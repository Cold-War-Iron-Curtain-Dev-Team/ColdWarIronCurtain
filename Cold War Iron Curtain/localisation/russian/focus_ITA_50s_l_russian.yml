 KEN_50s_mitchell_governorship:0 "Правление Митчелла"
 KEN_50s_mitchell_governorship_desc:0 "Назначенный губернатором Кении в декабре 1944 года, Митчелл изначально подходил к должности с чувством долга и ответственности перед коренным населением. Однако со временем этот взгляд ослаб, и его энтузиазм сменился презрением к «огромной массе людей», которые «в настоящее время находятся в весьма примитивном моральном, культурном и социальном состоянии»."
 KEN_50s_support_bantu_cooperatives:0 "Поддержка банту-кooperatives"
 KEN_50s_support_bantu_cooperatives_desc:0 "Митчелл верит в возрождение и поддержку введения этнических банту-кооперативов по всей нашей сельской местности, примером может служить масаи"
 KEN_50s_invite_princess_elizabeth:0 "Пригласить принцессу Елизавету"
 KEN_50s_invite_princess_elizabeth_desc:0 "Поскольку Его Величество король Георг VI находится в плохом здоровье, было решено, что принцесса Елизавета совершит тур по Кении от его имени."
 KEN_50s_ignore_mau_mau:0 "Игнорировать «Мау-Мау»"
 KEN_50s_ignore_mau_mau_desc:0 "Кikuyu движения и деятельность — не новость для Кении. Мы можем проигнорировать эту явную попытку спровоцировать реакцию нашей администрации."
 KEN_50s_embrace_swahili_language_in_schools:0 "Ввести язык суахили в школах"
 KEN_50s_embrace_swahili_language_in_schools_desc:0 "Будучи основным языком нашего народа, суахили следует утвердить в качестве нового базового языка в нашей системе образования."
 KEN_50s_the_retiring_of_mitchell:0 "Отставка Филипа Митчелла"
 KEN_50s_the_retiring_of_mitchell_desc:0 "После почти десяти лет довольно бездеятельного, но не хаотичного правления время Филипа Митчелла на посту губернатора подходит к концу. Будем надеяться, что его преемник возьмёт на себя более активную роль в протекторате."
 KEN_50s_the_kolloa_affray:0 "Инцидент в Коллое"
 KEN_50s_the_kolloa_affray_desc:0 "Проблема местных религиозных пророков существовала задолго до колониальной администрации. Хотя их послания обычно различались, один из них — Лукас Пкеч —, по-видимому, взял на себя задачу разжигать беспорядки своей антиколониальной риторикой и подстрекать к неповиновению по всему протекторату."
 KEN_50s_lucas_pkech_surrenders:0 "Лукас Пкеч сдаётся"
 KEN_50s_lucas_pkech_surrenders_desc:0 "Лукас Пкеч, понимая, что это может плохо кончиться, решил мирно сдаться местным властям."
 KEN_50s_alan_stevens_confronts_seditioners:0 "Алан Стивенс противодействует подстрекателям"
 KEN_50s_alan_stevens_confronts_seditioners_desc:0 "Хотя, возможно, это не лучшее решение, местный окружной комиссар Алан Стивенс пришёл к выводу, что применение силы — оптимальный способ справиться с этими беспорядками. Будем надеяться, что последствия не окажутся слишком серьёзными."
 KEN_50s_governor_evelyn_baring:0 "Губернатор Эвелин Баринг"
 KEN_50s_governor_evelyn_baring_desc:0 "Новое десятилетие — новый губернатор. Посмотрим, что Эвелин Баринг приготовил для своего срока на посту."
 KEN_50s_the_royal_technical_college:0 "Королевский технический колледж"
 KEN_50s_the_royal_technical_college_desc:0 "Поскольку новые высшие учебные заведения появляются по всему протекторату, было решено объединить два существующих проекта в «Королевский технический колледж в Найроби» — по инициативе азиатской общины, предложившей мемориальный колледж в честь Махатмы Ганди."
 KEN_50s_the_swynnerton_plan:0 "План Суиннертона"
 KEN_50s_the_swynnerton_plan_desc:0 "С экономическим ростом у губернатора Эвелина Баринга возникла идея создать «План Суиннертона», направленный на радикальное увеличение сельскохозяйственного производства."
 KEN_50s_kakuzi_limited_co:0 "Kakuzi Limited Co."
 KEN_50s_kakuzi_limited_co_desc:0 "Первый этап этой грандиозной схемы — создание «Kakuzi PLC», которая будет в основном заниматься производством чая, авокадо и ананасов, а также развитием животноводства."
 KEN_50s_rea_vipingo_co:0 "Rea Vipingo Co."
 KEN_50s_rea_vipingo_co_desc:0 "На втором этапе проекта будет основана компания «Rea Vipingo», основной продукцией которой станет сisal."
 KEN_50s_unga_group_limited_co:0 "Unga Group Limited Co."
 KEN_50s_unga_group_limited_co_desc:0 "Наконец, на заключительном этапе мы субсидируем «Unga Group Limited», основная продукция которой связана с помолом, питательными продуктами и кормами для животных."
 KEN_50s_rift_valley_aquifers:0 "Водоносные слои долины Рift"
 KEN_50s_rift_valley_aquifers_desc:0 "Преимущественно белое население «Долины Рift» и её гористые окрестности делают этот район идеальным для использования подземных водоносов в целях повышения эффективности сельского хозяйства."
 KEN_50s_expand_central_plumbing_infrastructure:0 "Расширить центральную водопроводную инфраструктуру"
 KEN_50s_expand_central_plumbing_infrastructure_desc:0 "Поскольку освоение водоносных слоёв долины Рift уже идёт полным ходом, мы можем направить плоды этой работы в столицу."
 KEN_50s_mombasa_roadworks:0 "Дорожные работы в Мombasa"
 KEN_50s_mombasa_roadworks_desc:0 "Поскольку Мombasa — наш единственный выход к восточноафриканскому побережью и далее, крайне важно довести инфраструктуру до достаточного уровня."
 KEN_50s_nairobi_roadworks:0 "Дорожные работы в Найроби"
 KEN_50s_nairobi_roadworks_desc:0 "Раз уж путь к побережью проложен, нет смысла останавливаться. Используя этот импульс, мы можем основательно модернизировать дорожную сеть по всему протекторату."
 KEN_50s_encourage_settlement_to_white_highlands:0 "Поощрить поселение в Белых нагорьях"
 KEN_50s_encourage_settlement_to_white_highlands_desc:0 "Белые нагорья — район центральной Кении, зарезервированный для белого, европейского, поселения. Мы должны расширить его на благо нашей нации."
 KEN_50s_lease_veterans_property:0 "Аренда земли для ветеранов"
 KEN_50s_lease_veterans_property_desc:0 "Огромные территории, которые мы зарезервировали для расширения европейского и белого населения, необходимо немедленно освоить."
 KEN_50s_british_and_south_africa_immigration:0 "Иммиграция из Британии и Южной Африки"
 KEN_50s_british_and_south_africa_immigration_desc:0 "Наши прекрасные нагорья привлекли внимание как британских, так и южноафриканских переселенцев. Такой дар судьбы не стоит отвергать."
 KEN_50s_expand_the_999_year_lease:0 "Расширить 999-летнюю аренду"
 KEN_50s_expand_the_999_year_lease_desc:0 "999-летняя аренда — это то, что кенийский протекторат предлагал ветеранам на протяжении последнего десятилетия: 999-летняя аренда земли в Белых нагорьях для ветеранов и их детей. Мы должны расширить эту программу за пределы узкой группы, которой она сейчас предоставляется."
 KEN_50s_white_highland_rule:0 "Правление Белых нагорий"
 KEN_50s_white_highland_rule_desc:0 "Управление Кенийским протекторатом должно исходить из Белых нагорий, от белого меньшинства — как в Родезии и Южной Африке."
 KEN_50s_rise_of_the_united_country_party:0 "Восход Новой партии Кении"
 KEN_50s_rise_of_the_united_country_party_desc:0 "Майкл Бланделл основал Объединённую сельскую партию, ныне Новую партию Кении, которая проведёт более консервативную политику в наших интересах."
 KEN_50s_infiltrate_student_groups:0 "Проникновение в студенческие группы"
 KEN_50s_infiltrate_student_groups_desc:0 "Хотя возглавить такой клуб кажется заманчиво простым делом, возможно, более тонкий подход принесёт большую пользу."
 KEN_50s_british_propoganda:0 "Британская пропаганда"
 KEN_50s_british_propoganda_desc:0 "Необходимо провести пропагандистскую кампанию при поддержке Британии, чтобы стабилизировать нашу страну."
 KEN_50s_disinformation_campaign:0 "Кампания дезинформации"
 KEN_50s_disinformation_campaign_desc:0 "Становится очевидным, что силой не изменить мышление этих проблемных студентов. Но с помощью дезинформации и обмана мы, возможно, одержим победу."
 KEN_50s_nairobi_student_riots:0 "Студенческие беспорядки в Найроби"
 KEN_50s_nairobi_student_riots_desc:0 "Похоже, что, несмотря на наши усилия быть доброжелательными наставниками и правителями, молодёжь этой страны полна решимости подорвать нашу доброту."
 KEN_50s_ban_the_kenyan_african_union:0 "Запретить Кенийский африканский союз"
 KEN_50s_ban_the_kenyan_african_union_desc:0 "Нам необходимо запретить политическую партию Кенийский африканский союз из-за её мятежного характера. Она по своей сути противоречит нашим интересам."
 KEN_50s_ban_the_young_kikuyu_association:0 "Запретить Ассоциацию молодых кikuyu"
 KEN_50s_ban_the_young_kikuyu_association_desc:0 "Ассоциация молодых кikuyu не conformist и выступает против самого того, что необходимо для функционирования нашего общества."
 KEN_50s_jomo_kenyattas_speech:0 "Речь Джомо Кениеатты"
 KEN_50s_jomo_kenyattas_speech_desc:0 "Недавно на африканском конгрессе самая видная фигура движений за независимость и автономию в Кении — Джомо Кениеатта — произнёс чрезвычайно популярную речь. Осудив «Мау-Мау», он заявил, что целью каждого африканца должна быть борьба за независимость, особенно в Восточной Африке."
 KEN_50s_the_arrest_of_jomo_kenyatta:0 "Арест Джомо Кениеатты"
 KEN_50s_the_arrest_of_jomo_kenyatta_desc:0 "С арестом этого невероятно разрушительного деятеля, возможно, в страну наконец вернутся порядок и стабильность. Верно?"
 KEN_50s_KAU_underground:0 "КАС подполье"
 KEN_50s_KAU_underground_desc:0 "Независимость Кении необходимо добиваться даже под преследованием — мы продолжим запрещённый Кенийский африканский союз в подполье."
 KEN_50s_elect_tom_mboya_as_mayor_of_nairobi:0 "Избрать Тома Мбою мэром Найроби"
 KEN_50s_elect_tom_mboya_as_mayor_of_nairobi_desc:0 "Том Мбоя — наряду с самим Кениеаттой — человек, на которого мы по-настоящему можем положиться в ведении нас к независимости. Его обаяние, интеллект и лидерские качества наверняка склонят на нашу сторону всех, кто верен нашему делу."
 KEN_50s_jaramogi_odingas_criticism:0 "Критика Джaramogi Одинги"
 KEN_50s_jaramogi_odingas_criticism_desc:0 "Джaramogi Одинга, видный пanafricanist писатель, выпустил серию брошюр, осуждающих несправедливое заключение совершенно невиновного Джомо Кениеатты."
 KEN_50s_advocate_freedom_for_kenyatta:0 "Требовать освобождения Кениеатты"
 KEN_50s_advocate_freedom_for_kenyatta_desc:0 "Раздутые обвинения, по которым заключён Джомо Кениеатта, возмутительны! Требования его освобождения должны быть усилены и ускорены. Так или иначе Кениеатта будет освобождён, и он поведёт нас в будущее."
 KEN_50s_international_controversy:0 "Международный скандал"
 KEN_50s_international_controversy_desc:0 "Международный скандал вокруг ареста Джомо Кениеатты вызвал возмущение самых видных деятелей. Джулиус Ньерере, Кваме Нкрума и Неру публично выступили против его ареста и заключения."
 KEN_50s_advance_independence_movements:0 "Развивать движение за независимость"
 KEN_50s_advance_independence_movements_desc:0 "Несмотря на отсутствие нашего дорогого лидера, мы не можем останавливаться. По всей стране поддержка нашего дела растёт, и вскоре британские колонизаторы уже не смогут отказать нам в заслуженной независимости."
 KEN_50s_the_trial_of_jomo_kenyatta:0 "«Суд над Джомо Кениеаттой»"
 KEN_50s_the_trial_of_jomo_kenyatta_desc:0 "Роман «Суд над Джомо Кениеаттой» вызвал широкие сомнения в обоснованности ареста и заключения Джомо Кениеатты — даже на Западе."
 KEN_50s_african_representation:0 "Африканское представительство"
 KEN_50s_african_representation_desc:0 "Равные права для всех — довольно чуждая британцам концепция, но не для нас. Мы не успокоимся, пока каждый мужчина и каждая женщина не будут уважаемы и не станут считаться людьми, а не подданными чужой короны."
 KEN_50s_reestablishment_of_KAU:0 "Восстановление КАС"
 KEN_50s_reestablishment_of_KAU_desc:0 "Необходимо приложить усилия для восстановления Кенийского африканского союза. Британцы могли отбросить нас назад, но со всей нашей силой КАС вернётся ещё мощнее!"
 KEN_50s_british_sympathy:0 "Сочувствие британцев"
 KEN_50s_british_sympathy_desc:0 "В довольно ироничном повороте обычные британцы, узнавшие об appalling обращении с Джомо Кениеаттой, испытывают сочувствие к нашему делу и смущение перед своим правительством."
 KEN_50s_the_road_to_independence:0 "Дорога к независимости"
 KEN_50s_the_road_to_independence_desc:0 "Сквозь кровь, пот и слёзы наша цель — независимость Кении — всё ближе. Недолго осталось, братья и сёстры — скоро мы станем свободной нацией свободных мужчин и женщин!"
 KEN_50s_enforce_martial_law:0 "Ввести военное положение"
 KEN_50s_enforce_martial_law_desc:0 "Как бы нам ни было больно это признавать, коренное население упорно не признаёт наше право на власть. Похоже, нам придётся занять более жёсткую позицию по отношению к населению."
 KEN_50s_manipulate_tribal_leaders:0 "Манипулировать племенными вождями"
 KEN_50s_manipulate_tribal_leaders_desc:0 "Белое меньшинство слишком мало, чтобы контролировать всю страну, но, к счастью, достаточно племенных вождей готовы прислушаться к нашим «советам» и даже следовать нашим рекомендациям."
 KEN_50s_institute_apartheid:0 "Ввести апартеид"
 KEN_50s_institute_apartheid_desc:0 "Хотя это довольно неприятная мера, если мы хотим остаться здесь к началу следующего десятилетия, нам тоже придётся следовать примеру Южной Африки."
 KEN_50s_create_a_bicameral_legislature:0 "Создать двухпалатный парламент"
 KEN_50s_create_a_bicameral_legislature_desc:0 "Поскольку правительство переходит от колониальной к федеральной форме, сама система управления также должна измениться, чтобы соответствовать цивилизованному обществу."
 KEN_50s_empower_the_executive_branch:0 "Усилить исполнительную власть"
 KEN_50s_empower_the_executive_branch_desc:0 "Очевидно, что единственный способ укрепить наш контроль над страной — централизовать государственную власть в исполнительной ветви."
 KEN_50s_abolish_legislative_council:0 "Распустить Законодательный совет"
 KEN_50s_abolish_legislative_council_desc:0 "«Приём» нашего правления коренным населением наглядно показал, что им нельзя доверять принятие обоснованных решений. Так что, вопреки нашим желаниям, Законодательный совет будет распущен."
 KEN_50s_empower_white_businesses:0 "Укрепить белый бизнес"
 KEN_50s_empower_white_businesses_desc:0 "Поскольку наша власть становится всё заметнее среди коренного населения, сейчас идеальное время показать им экономическое процветание, которое может принести капитализм."
 KEN_50s_expand_white_highland_restrictions:0 "Расширить ограничения в Белых нагорьях"
 KEN_50s_expand_white_highland_restrictions_desc:0 "Поскольку белое население растёт и укрепляется, территории, где оно проживает, также должны стать более закрытыми исключительно для белых."
 KEN_50s_rename_nairobi_coldbrook:0 "Переименовать Найроби в Coldbrook"
 KEN_50s_rename_nairobi_coldbrook_desc:0 "Действительно, при основании нашего протектората сохранилось коренное название Найроби. Но при власти ОСП коренное название Найроби не подходит для британского города — переименуем его в английский эквивалент, Coldbrook."
 KEN_50s_united_country_party_victory:0 "Победа Объединённой сельской партии"
 KEN_50s_united_country_party_victory_desc:0 "Наконец, с победой Объединённой сельской партии Майкла Бланделла, возможно, мы сможем начать укреплять нашу позицию в Кении. Правление белого меньшинства надолго."
 KEN_50s_the_rogue_colony:0 "Мятежная колония"
 KEN_50s_the_rogue_colony_desc:0 "Несмотря на безоговорочную верность короне и стране, Британия отвергла нас. После этого последнего акта было решено, что мы должны проложить собственный путь в мире."
 KEN_50s_loyalty_to_the_crown:0 "Верность короне"
 KEN_50s_loyalty_to_the_crown_desc:0 "Мысль о том, что мы отвернёмся от метрополии, довольно неприятна. Мы — отныне и навсегда — верные подданные Её Величества королевы Елизаветы II."
 KEN_50s_rise_of_kenyan_industry:0 "Подъём кенийской промышленности"
 KEN_50s_rise_of_kenyan_industry_desc:0 "Довольно постыдно, что Кения по сравнению с такими странами, как Канада и Австралия, остаётся woefully неиндustrialized. Её население совершенно не знакомо с городским трудом. Это необходимо немедленно исправить!"
 KEN_50s_public_construction_works:0 "Государственные строительные работы"
 KEN_50s_public_construction_works_desc:0 "Центральная плановая комиссия необходима для координации всех усилий по индustrialизации по всей стране. Когда крупные города Найроби и Мombasa будут достаточно развиты, мы сможем сосредоточиться на сельских районах."
 KEN_50s_begin_mining_in_kerio_valley:0 "Начать добычу в долине Kerio"
 KEN_50s_begin_mining_in_kerio_valley_desc:0 "Благодаря отчётам разведчиков мы узнали о богатых залежах полезных ископаемых под долиной Kerio в западных районах Кении."
 KEN_50s_begin_mining_the_highlands:0 "Начать добычу в наgorьях"
 KEN_50s_begin_mining_the_highlands_desc:0 "Нaгорья уже являются одним из богатейших районов протектората, но там наверняка ещё скрыты полезные материалы, которые только и ждут, когда их извлекут."
 KEN_50s_create_mombasa_sugar_factory:0 "Построить сахарный завод в Мombasa"
 KEN_50s_create_mombasa_sugar_factory_desc:0 "Комиссия решила, что создание сахароперерабатывающего завода в центре Мombasa станет надёжным первым шагом к инdustrialизации."
 KEN_50s_magadi_soda_co:0 "Magadi Soda Co."
 KEN_50s_magadi_soda_co_desc:0 "Комиссии, а также местным предпринимателям, стало известно, что озеро Magadi богато trona — ключевым соединением для газированных напитков. Комfortable вложение в Magadi Soda Company кажется прибыльным."
 KEN_50s_nairobi_security_exchange:0 "Найробийская фондовая биржа"
 KEN_50s_nairobi_security_exchange_desc:0 "Чтобы поощрить иностранных спекулянтов, мы учредим Найробийскую фондовую биржу."
 KEN_50s_the_bunyala_road_factory:0 "Завод на Bunyala Road"
 KEN_50s_the_bunyala_road_factory_desc:0 "Главная улица Bunyala Road в Найроби станет местом размещения крупного промышленного завода."
 KEN_50s_the_rise_of_kenyan_entrepeneurship:0 "Рост кенийского предпринимательства"
 KEN_50s_the_rise_of_kenyan_entrepeneurship_desc:0 "Похоже, запах денег витает в воздухе — многочисленные местные жители взялись продвигать собственные идеи и, надеясь, разбогатеть на них."
 KEN_50s_cooper_motors_limited:0 "Cooper Motors Limited"
 KEN_50s_cooper_motors_limited_desc:0 "Несмотря на то что Cooper Motors существует уже некоторое время, компания так и не смогла по-настоящему взлететь. При дополнительной поддержке она могла бы стать благом для нашей промышленности."
 KEN_50s_founding_of_kenyan_power_and_lighting_co:0 "Основание Kenyan Power and Lighting Co."
 KEN_50s_founding_of_kenyan_power_and_lighting_co_desc:0 "Хотя компания была основана несколько лет назад, в 1922 году, под названием «East African Power and Lighting Company» (EAP&L), столь широкое название в последние годы стало преувеличением. Чтобы отличаться от всех остальных, EAP&L будет реорганизована в Kenya Power and Lighting Company!"
 KEN_50s_build_a_plant_in_mombasa:0 "Построить электростанцию в Мombasa"
 KEN_50s_build_a_plant_in_mombasa_desc:0 "Электрификация — хотя и не новое явление — часто оказывается трудной задачей для всей страны. Тем не менее, начать нужно откуда-то, а побережье — неплохое место для этого."
 KEN_50s_build_a_plant_in_nairobi:0 "Построить электростанцию в Найроби"
 KEN_50s_build_a_plant_in_nairobi_desc:0 "Электрификация такого крупного города, как Найроби, несомненно станет трудоёмким делом, но при должных усилиях и вложениях времени Найроби может стать маяком будущей модернизации."
 KEN_50s_assassination_of_cheif_waruhiu:0 "Убийство вождя Waruhiu"
 KEN_50s_assassination_of_cheif_waruhiu_desc:0 "Убийство прobritанского вождя Waruhiu принесло в Кению период неопределённости и нестабильности. С такой тьмой, опустившейся на нас, неизвестно, когда наступит утро."
 KEN_50s_declare_a_state_of_emergency:0 "Объявить чрезвычайное положение"
 KEN_50s_declare_a_state_of_emergency_desc:0 "После новости об убийстве вождя Waruhiu, потрясшей самые основы протектората, губернатор Эвелин Баринг сочёл необходимым объявить чрезвычайное положение до восстановления порядка."
 KEN_50s_expand_king_african_rifles:0 "Расширить Королевские африканские стрелки"
 KEN_50s_expand_king_african_rifles_desc:0 "Учитывая текущую ситуацию и нехватку белого персонала, необходимо расширить коренные подразделения KAR для помощи в подавлении."
 KEN_50s_weapon_sharing_with_britain:0 "Поставки оружия от Британии"
 KEN_50s_weapon_sharing_with_britain_desc:0 "Британия — ведущая держава в современном мире. Такие связи по-настоящему помогут нам в технологическом превосходстве над толпой людей, вооружённых деревянным оружием."
 KEN_50s_modernize_artillery:0 "Модернизировать артиллерию"
 KEN_50s_modernize_artillery_desc:0 "Поскольку у нас нет средств для разработки собственной артиллерии, мы должны обратиться за помощью к Британии."
 KEN_50s_enlist_highlander_special_forces:0 "Привлечь шотландские спецподразделения"
 KEN_50s_enlist_highlander_special_forces_desc:0 "Нам необходимо призвать шотландские спецподразделения, чтобы полностью уничтожить любую форму сопротивления."
 KEN_50s_expand_air_operations:0 "Расширить авиационные операции"
 KEN_50s_expand_air_operations_desc:0 "Как колония короны Мetрополии, мы имеем значительное преимущество над этими мятежниками. У нас есть самолёты. Пусть «Мау-Мау» дрожат от ужаса, когда мы потрясаем их архаичный мир громом jet age!"
 KEN_50s_nairobi_airbases:0 "Авиабазы в Найроби"
 KEN_50s_nairobi_airbases_desc:0 "При британской помощи мы должны обеспечить их присутствие строительством крупномасштабных аэродromов."
 KEN_50s_lincoln_bombing_campaigns:0 "Бombardировочные кампании «Линкольн»"
 KEN_50s_lincoln_bombing_campaigns_desc:0 "С одобрения губернатора и при самолётах, предоставленных metropолией, мы начнём эффективную бombardировочную кампанию на «Линкольнах»."
 KEN_50s_british_anti_insurgency:0 "Британская антипartisanная кампания"
 KEN_50s_british_anti_insurgency_desc:0 "Британцы сделают всё возможное, чтобы провести эффективную и результативную антипartisanную кампанию."
 KEN_50s_villagization:0 "Вillagization"
 KEN_50s_villagization_desc:0 "Если мы хотим хоть как-то подавить это восстание, мы должны сконцентрировать кikuyu, чтобы лучше следить за ними."
 KEN_50s_british_military_intervention:0 "Британское военное вмешательство"
 KEN_50s_british_military_intervention_desc:0 "К сожалению, восстание достигло такой стадии, что мы не можем подавить его самостоятельно. В результате британское военное вмешательство на данном этапе абсолютно необходимо — будем надеяться, что с их помощью мы сможем положить конец этому мятежу."
 KEN_50s_detention_programs:0 "Программы internment"
 KEN_50s_detention_programs_desc:0 "Изолируя кikuyu элементы в различных internment центрах, мы можем начать отсеивать самых непокорных сторонников «Мау-Мау»."
 KEN_50s_operation_anvil:0 "Операция «Наковальня»"
 KEN_50s_operation_anvil_desc:0 "Операция «Наковальня» — военная операция для эффективного проникновения во все аспекты повстанческого движения «Мау-Мау», начиная с подхода снизу вверх к вербовке противника и ликвидации лидеров «Мау-Мау»."