l_english:
 stalin_speech_category: ""
 stalin_speech_category_desc: "Товарищ Сталин сделал многое для советского народа, после разгрома фашизма будущее Советского Союза и будущее социализма по-прежнему требует его внимания."
 addresstothe19thcongressofthecommunistpartyofthesovietunion: ""
 addresstothe19thcongressofthecommunistpartyofthesovietunion_desc: "Позвольте мне от имени нашего партийного съезда выразить нашу благодарность всем братским партиям и организациям, представители которых почтили своим присутствием наш партийный съезд или прислали нашему партийному съезду дружественный привет, за их пожелания дальнейших успехов и за их доверие. Для нас это доверие особенно ценно, так как оно означает их готовность поддержать нашу партию в ее борьбе за лучшее будущее для народа, в ее борьбе против войны, в ее борьбе за сохранение мира. Было бы ошибкой полагать, что наша партия, обретя могущество, не нуждается в дальнейшей поддержке. Это было бы неправильно. Наша партия и наша страна нуждаются в постоянном доверии и эмпатии братских народов за пределами наших границ и впредь в этом будут нуждаться."
 stalin_funeral_category: ""
 stalin_funeral_category_desc: "Наш великий вождь товарищ Сталин скончался от инсульта. После четырехдневного всенародного траура ему устраивают государственные похороны. Вклад товарища Сталина будет запомнен навсегда."
 khrushchev_speech: ""
 khrushchev_speech_desc: ""
 malenkov_speech: ""
 malenkov_speech_desc: "Уважаемые соотечественники, товарищи, друзья. Советский народ и всё человечество понесли очень серьезную и невосполнимую утрату. Наш учитель, наш гид, выдающийся гений всего человечества, скончался. Утрату Иосифа Виссарионовича Сталина в эти трудные дни разделяет всё прогрессивное человечество. Деяния Сталина будут продолжать жить через века и будущие поколения. Трудящиеся Советского Союза как и я знаем, что наша могучая Родина пойдет к новым успехам. В мире нет таких вещей, которые могли бы остановить движение советского общества к коммунизму. Прощай, наш учитель. Наш дорогой друг, дорогой товарищ, с нетерпением ожидаю всесоюзного торжества Ленина и Сталина."
 beria_speech: ""
 beria_speech_desc: "Дорогие товарищи, друзья!\n\nТрудно выразить словами чувство великой скорби, которое переживают в эти дни наша партия и народы нашей страны, всё прогрессивное человечество.\n\nНе стало Сталина – великого соратника и гениального продолжателя дела Ленина. Ушел от нас человек, самый близкий и родной всем советским людям, миллионам трудящихся всего мира.\n\nВся жизнь и деятельность Великого Сталина является вдохновляющим примером верности ленинизму, примером самоотверженного служения рабочему классу и всему трудовому народу, делу освобождения трудящихся от гнёта и эксплуатации.\n\nВеликий Ленин основал нашу партию, привел её к победе пролетарской революции.\n\nВместе с Великим Лениным его гениальный соратник Сталин укреплял большевистскую партию и создал первое в мире социалистическое государство.\n\nПосле смерти Ленина Сталин почти тридцать лет вёл нашу партию и страну по ленинскому пути. Сталин отстоял ленинизм от многочисленных врагов, развил и обогатил учение Ленина в новых исторических условиях.\n\nМудрое руководство Великого Сталина обеспечило нашему народу построения социализма в СССР и всемирно-историческую победу советского народа в Великой Отечественной войне. Великий зодчий коммунизма, гениальный вождь, наш родной Сталин вооружил нашу партию и народ величественной программой строительства коммунизма.\n\nТоварищи! Неутолима боль в наших сердцах, неимоверно тяжела утрата, но и под этой тяжестью не согнётся стальная воля Коммунистической партии, не поколеблется её единство и твёрдая решимость в борьбе за коммунизм.\n\nНаша партия, вооружённая революционной теорией Маркса – Энгельса – Ленина – Сталина, умудрённая полувековым опытом борьбы за интересы рабочего класса и всех трудящихся, знает, как вести дело, чтобы обеспечить построение коммунистического общества."
 molotov_speech: ""
 molotov_speech_desc: "Дорогие товарищи и друзья, в наши дни мы все скорбим о смерти Иосифа Сталина, утрате великого лидера и в то же время близкого и бесконечно дорогого человека. Мы, его старые и близкие друзья, и миллионы советских людей, рабочие всех стран мира. Сегодня с товарищем из стали, которого мы все так любили, его наследие всегда будет жить в наших сердцах. Память о великом Сталине дает нам четкое направление для строительства великого дела коммунизма для нашей страны, он сильнее и теснее сплочен в центральном правительстве, и трудящиеся всего мира будут жить веками. Да здравствуют великие учителя Маркс, Энгельс, Ленин и Сталин. Да здравствует наша могучая социалистическая Родина. Время от времени советские люди живут в великой Коммунистической партии Советского Союза."