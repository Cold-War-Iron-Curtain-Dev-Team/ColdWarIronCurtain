l_russian:
 stalin_speech_category: "Обращение Сталина к народу"
 stalin_speech_category_desc: "Товарищ Сталин много сделал для советского народа, после разгрома фашизма будущее Советского Союза и будущее социализма по-прежнему требует его руководства."
 addresstothe19thcongressofthecommunistpartyofthesovietunion: "Обращение к 19-му съезду Коммунистической партии Советского Союза."
 addresstothe19thcongressofthecommunistpartyofthesovietunion_desc: "Позвольте мне от имени нашего партийного съезда выразить нашу благодарность всем братским партиям и организациям, представители которых почтили своим присутствием наш партийный съезд или прислали нашему партийному съезду привет Дружбы, за их пожелания дальнейших успехов и за их доверие. Для нас это доверие особенно ценно, так как оно означает их готовность поддержать нашу партию в ее борьбе за лучшее будущее для народа, в ее борьбе против войны, в ее борьбе за сохранение мира. Было бы ошибкой полагать, что наша партия, ставшая могущественной державой, не нуждается в большей поддержке. Это было бы неправильно. Наша партия и наша страна нуждаются в постоянном доверии, сочувствии и поддержке братских народов за пределами наших границ и всегда будут нуждаться в этом."
 stalin_funeral_category: "Выступления на похоронах Сталина"
 stalin_funeral_category_desc: "Наш великий вождь товарищ Сталин скончался от инсульта. После четырехдневного всенародного траура ему устраивают государственные похороны. Вклад товарища Сталина запомнится навсегда."
 khrushchev_speech: "Речь Хрущева на похоронах Сталина"
 khrushchev_speech_desc: "От имени Центрального Комитета Коммунистической партии Советского Союза и Совета Министров СССР здесь проходит мемориальный митинг памяти председателя Совета Министров Союза Советских Социалистических Республик и секретаря Центрального комитета Коммунистической партии Советского Союза генералиссимуса Иосифа Сталина."
 malenkov_speech: "Речь Маленкова на похоронах Сталина"
 malenkov_speech_desc: "Уважаемые соотечественники, товарищи, друзья. Советский народ и всё человечество понесли очень серьезную и невосполнимую утрату. Наш учитель, наш гид, выдающийся гений всего человечества, скончался. Утрату Иосифа Виссарионовича Сталина в эти трудные дни разделяет всё прогрессивное человечество. Деяния Сталина будут продолжать жить через века и потомство. Трудящиеся Советского Союза и я знаем, что наша могучая Родина пойдет к новым успехам. В мире нет таких цифр, которые могли бы остановить движение советского общества к коммунизму. Прощай, наш учитель. Наш дорогой друг, дорогой товарищ, с нетерпением ожидаю полного торжества Ленина и Сталина."
 beria_speech: "Речь Берии на похоронах Сталина"
 beria_speech_desc: "Дорогие друзья, друзья, мне трудно выразить мои великие чувства в эти дни. Что касается дождя и народа нашей страны, то всех прогрессивных людей. Сталин - великий, сострадательный и талантливый человек, и самый близкий человек, который покинул нас. Народ нашей страны может быть уверен, что политические партии и советское правительство приложат все усилия для сохранения общего единства партии. Руководящие принципы для дружбы народов Советской Социалистической Республики могут теперь придать стране уверенность в марксистско-ленинских идеях, чтобы исследовать наследие Ленина и Сталина и привести страну от социализма к коммунизму. Слава нашему любимому, дорогому и великому учителю Сталину."
 molotov_speech: "Речь Молотова на похоронах Сталина"
 molotov_speech_desc: "Дорогие товарищи и друзья, в наши дни мы все страдаем от смерти Иосифа Сталина, потери великого лидера и в то же время близкого уроженца бесконечно дорогого человека. Мы его старые и близкие друзья и миллионы советских людей, рабочие во всех странах мира. Сегодня с товарищем из стали, которого мы все так любили, что результаты всегда будут жить в наших сердцах. Память о великом Сталине дает нам четкое направление для построения великого дела коммунизма для нашей страны, он сильнее и теснее сплочен в центральном правительстве, и трудящиеся всего мира будут жить веками. Да здравствуют великие учителя Маркса, Энгельса, Ленина и Сталина. Да здравствует наша могучая социалистическая Родина. Время от времени советские люди живут в великой Коммунистической партии Советского Союза."
