 Formosa_Resolution.1.d: "Сенат США принял совместную резолюцию под названием «Резолюция Формозы». В ней сообщается, что президент имеет право по своему усмотрению развернуть вооруженные силы Соединенных Штатов для обеспечения безопасности и защиты Формозы (Тайвань) и окружающих её островов в ответ на любую вооруженную агрессию коммунистов. Принятие резолюции отмечается по всему Тайваню, поскольку его народ уже давно ощущает угрозу вторжения коммунистов с материка. Тайваньское правительство пообещало оставаться стойким в своем неповиновении коммунистам и поблагодарило США за то, что она поддерживает силы демократического Китая. Китайская Народная Республика осудила резолюцию, как первый шаг Америки, пытающейся превратить Формозу в колонию и империалистическую базу для последующих атак на достижения революции. Многие американцы поддержали эту резолюцию, как демонстрацию решимости Соединенных Штатов защитить международное сообщество от коммунизма."
 nixon_native.1.d: "В недавнем обращении к Конгрессу президент Никсон представил свою политику самоопределения туземцев. Президент осудил предыдущую политику и призвал правительство позволить коренным американцам самим распоряжаться своим будущим. Ожидается, что в ближайшие месяцы Конгресс примет ряд законопроектов в поддержку создания самоуправляющихся племенных общин при поддержке США. Это представляет собой изменение американской политики увольнения. Предыдущие президенты поддерживали политику увольнения, направленную на интеграцию коренных американцев и ликвидацию всех институтов самоуправления. Коренные американцы в значительной степени осудили увольнение как искоренение коренной идентичности. Активисты и лидеры коренных народов широко хвалят новую политику Никсона."
 Great_Realiagnment.1.d: "Поскольку президент Эрл Уоррен заканчивает свой второй срок пребывания в должности, нация размышляет о крупных политических изменениях, охвативших страну. Успех Уоррена укрепил умеренное и либеральное крыло Республиканской партии. Принятие гражданских прав возродило традиционные связи между Республиканской партией и афроамериканским сообществом. Более городские американцы также принимают Республиканскую партию как оплот стабильности и равенства. Демократическая партия увидела, что возможности наладить отношения с либеральными сообществами не увенчались успехом. Таким образом, партия теперь все больше придерживается консервативного видения диксикратов. Демократическая партия становится все более привлекательной для более консервативного и сельского населения, особенно на Юге и Среднем Западе. Многие эксперты считают, что влияние президента Уоррена навсегда изменит политическую траекторию двух основных американских политических партий."
 Fat_Fucker.1.d: "Директор ЦРУ, госсекретарь и высокопоставленные сотрудники агентства разработали план под названием проект FF, или проект "Fat Fucker". Соединенные Штаты осознают, что нынешняя политическая организация в Египте нестабильна и сильно коррумпирована. Если положение дел не изменится, то в стране высока вероятность революции левых сил. План ЦРУ призывает обратиться к королю Фаруку и оказать на него сильное давление с целью инициировать важные реформы. В конечном итоге цель для короля состоит в том, чтобы реформировать своё правительство, распространить влияние монарха на эффективных министров, обуздать коррупцию и предложить прогрессивное мировоззрение для египетского народа. Если король откажется от предложенных реформ, то следует рассмотреть альтернативы его правительству, такие как "Свободные Офицеры", подпольное движение офицеров-антимонархистов в вооруженных силах, заинтересованных в создании нового националистического государства."
 Fat_Fucker.2.d: "Соединенные Штаты обратились к королю Египта и сделали устрашающее предупреждение. Они заявили, что если нынешняя политическая ситуация сохранится, то Египту грозят народные волнения и свержение монархии. Американцы настаивают на том, чтобы король провел реформы, обуздал коррупцию и распространил свою власть над правительством. Реформы включают в себя предоставление королевской полномочий для чиновников и военных. По сути, американцы хотят, чтобы король разорвал связи с некоторыми из своих близких друзей, ограничил некоторые из его внеклассовых интересов и установил более прогрессивное королевское правительство под руководством подготовленных бюрократов и военных. Король должен сделать выбор - поддаться давлению и потерять силу своей власти из-за иностранного и внутреннего влияния, либо придерживаться прежнего курса и сохранить суверенитет монархического Египта."
 Fat_Fucker.3.d: "Король поддался под американским давлением по поводу проведения критически важных реформ в своем правительстве и администрации, чтобы предотвратить возможные беспорядки или даже восстания. Близкие советники короля составляют соответствующие приказы и привлекают старших государственных служащих и военных на наиболее важные должности для режима. Однако, хоть король и согласился на проведение реформ, нам еще предстоит увидеть, как долго он останется привержен пути реформации. Тем не менее, король утверждает, что действует в интересах египетского народа и монархии. Хотя правительственные СМИ освещают новую инициативу, как задуманную королем, по Египту уже ходят слухи о том, что король действует под американским давлением. Похоже, что некоторые дворцовые чиновники, понимая, что реформы приведут к потере их власти, открыто распространяют эту информацию."
 Fat_Fucker.4.d: "Проект FF, похоже, продвигается довольно успешно, поскольку король Фарук выразил готовность начать реформы. Однако он не в первый раз обещает реформы, но не доводит их до конца. Независимо от этого, ЦРУ и Госдепартамент счастливы, что король принял наше предложение в принципе. Следующим этапом будет продолжение давления на короля Фарука до тех пор, пока он не проведет все реформы и не создаст безопасное для нас антикоммунистическое египетское государство. Аналитики разведки утверждают, что мы должны продолжать оказывать давление на короля. Однако есть опасения, что по мере распространения слухов о том, что король согласился на реформы, которые включают предоставление большей власти военным офицерам, антимонархисты и националисты в вооруженных силах могут найти в этом возможность, для продвижения собственных интересов."
 Fat_Fucker.5.d: "Наши попытки заставить короля Фарука начать важные реформы потерпели неудачу. Король остается непоколебимым в своих иллюзиях о величии и считает, что наши советы - это уловка для установления американского господства в стране. Проект FF, похоже, не смог обеспечить нам поддержку короля, однако цель установления сильного антикоммунистического режима в Египте - всё ещё выполнима. ЦРУ поддерживает контакты с группой националистических, антилоялистских офицеров, называемых «Свободные Офицеры». Мы можем предоставить этой группе тайную поддержку и обеспечить их защиту от контр-переворотов, когда они выступят против короля Фарука. Президент поручил Госдепартаменту и ЦРУ переориентировать свои усилия на поддержку свободных офицеров, чтобы гарантировать победу правых сил после падения монархического режима."
 Project_FF.1.d: "ЦРУ начало операцию по распространению информации в международной прессе, в которой подчеркивается опасность действий короля Египта Фарука для Ближнего Востока. Поступает все больше сообщений о Египте, в которых обсуждается их желание уничтожить Израиль и конкурирующие арабские державы любыми необходимыми средствами. Союзники в Конгрессе, среди прочих источников, «слили» детально отобранные разведывательные отчеты о том, что Египет готовится объявить себя банкротом, дабы приобрести оружие для вторжения на территории соседних государств. Наши агенты в Египте распространяют брошюры и статьи, осуждающие коррупцию и аморальность действий короля Фарука, чтобы навредить его поддержке внутри страны."
 Project_FF.2.d: "В Соединенных Штатах и Европе растет тревога в связи с сообщениями разведки о том, что король Египта Фарук готовится к военному вторжению в Израиль и другие соседние государства. В сообщениях подчеркивается неадекватный характер действий Фарука и предполагается, что он доведет Египет до банкротства, чтобы быстро приобрести оружие для достижения своих амбиций. Многие американские официальные лица и их союзники за рубежом отмечают, что такой сценарий вероятен и возобновление конфликта в регионе может привести к катастрофическому гуманитарному кризису. Правительство Египта осуждает обвинения, обвиняя Запад в развязывании пропагандистской кампании против арабского народа."
 US_Navy50s.1.d: "Военно-морской флот США провел серию переговоров на высшем уровне между старшими офицерами и руководством национальной обороны, чтобы сформулировать более современную проактивную доктрину. Военно-морской флот США считает, что они должны развернуть флот по всему миру для позиционирования сил, которые смогут быстро прибыть на место возникновения любого международного кризиса. Это даст Соединенным Штатам больше возможностей для маневрирования на международном уровне, поскольку они смогут быстро установить передовое присутствие военно-морских сил. Чтобы лучше реализовать такую стратегию, флоту потребуется постоянная и обширная финансовая поддержка со стороны правительства."
 CIA_DOM_50s.1.d: "У ЦРУ нет полицейских полномочий внутри страны и им запрещено шпионить за американцами дома. Однако у них есть Отдел Национальных Ресурсов (ОНР), ориентированный на внутренние потребности. ОНР курирует несколько программ добровольных опросов американцев с целью сбора разведданных, а также управление нынешней разведки, которое проводит брифинги государственного уровня. Однако, по слухам, агентство участвует и в других операциях, направленных на эксперименты с определенными технологиями, теориями и попытками повлиять на общественное мнение. Такие операции имеют решающее значение для укрепления возможностей агентства в ближайшие годы, но ЦРУ планирует держать свои операции вдали от общественности, чтобы избежать юридических проблем."
 CIA_DOM_50s.2.d: "Ближе к концу войны наши спецслужбы обнаружили передовые и подчас ужасающие эксперименты японцев и немцев, связанные с манипуляциями и контролем над человеческим разумом. Многие нацисты, участвовавшие в таких программах, были арестованы нашими войсками и после войны были наняты для продолжения работы над проектами. Наши недавние стычки с коммунистическими силами подтвердили, что они использовали свои собственные методы и экспериментировали с американскими военнопленными. Это недопустимо и мы не можем отставать от них. Исходя из этого, ЦРУ недавно запустило проект "MKUltra", который будет экспериментировать и изучать использование определенных наркотиков, чтобы улучшить наши показатели на допросах и изучать влияние над разумом. ЦРУ планирует проводить тесты на военнослужащих, проститутках, заключенных и психически больных, чтобы избежать общественного внимания, поскольку некоторые юристы ЦРУ считают, что эти эксперименты могут нарушать законы, касающиеся присутствия ЦРУ внутри страны."
 CIA_DOM_50s.3.d: "Средства массовой информации становятся все более важным ресурсом, позволяющий людям во всем мире узнавать о новостях. Советы уже воспользовались этим, воздействуя на СМИ и манипулируя ими для достижения своих политических целей и подрыва авторитета Соединенных Штатов. Для борьбы с иностранным влиянием и подрывной деятельностью, ЦРУ недавно начало операцию «Пересмешник». Агенты ЦРУ вербуют ведущих американских журналистов и влиятельные гражданские группы, чтобы координировать эффективный ответ на советские действия. Что еще более важно, ЦРУ может помочь в пропаганде наших собственных наступательных операций в СМИ, чтобы убедить американское и международное сообщество в нашем справедливом деле и предотвратить влияние иностранной пропаганды или американских коммунистов."
 USA_Suez.5.d: "Лондонская фондовая биржа рухнула после новостей о том, что Соединенные Штаты начнут взыскивать свой военный долг у Соединенного Королевства. Это произошло после того, как британское правительство отказалось от требований Вашингтона прекратить вмешательство в Суэцкий регион. Совместное англо-франко-израильское вторжение, начатое после национализации Египтом Суэцкого канала, застало США врасплох. Многие американские лидеры сравнивают эти военные действия с дипломатией канонерок колониальной эпохи, которой нет места в современном мире. Это подрывает имидж Запада во всем регионе. Решение взыскать военный долг приведет к повсеместной панике по всей Великобритании, но, возможно, это только первый шаг. Если Великобритания продолжит войну, Америка в ответ может вскоре прекратить экономическую помощь, что будет иметь катастрофические последствия для страны, которая все еще восстанавливается после Второй мировой войны."
 USA_KOR_WITHDRAWAL.1.d: "Соединенные Штаты начали вывод своих войск из Кореи. Президент объявил о своем решении после встречи на высочайшем уровне с высокопоставленными военными и оборонными ведомствами. Президент пришел к выводу, что американский народ пожертвовал и отдал все, что мог, для поддержки дела свободы в Корее. Однако оставаться там означало бы пожертвовать жизнями без разумной выгоды, и для народа Кореи пора встать и бороться за свою свободу самостоятельно. Эта новость рассматривается, как фатальная неудача для Южной Кореи и сил Организации Объединенных Наций, поскольку потеря американских войск теперь заметно сдвигает баланс сил в пользу Северной Кореи. Правительство Южной Кореи и американские союзники резко раскритиковали решение США."
 Albanian_Subversion.1.d: "Британская SIS обратилась к нам с планом свержения коммунистического режима в Албании. Британцы считают, что Энвер Ходжа, лидер коммунистов, все еще находится в процессе консолидации своего режима и что существует возможность остановить коммунистическую экспансию. Британцы полагают, что при нашей поддержке они смогут перебросить десант высококвалифицированных албанских эмигрантов-антикоммунистов в регион Мати. Мати известен своим консерватизмом и прочными связями с бывшей королевской семьей. Британцы считают, что агенты смогут организовать массовое восстание, а при серьёзной поддержке они смогут в конечном итоге свергнуть Ходжу и положить конец коммунистической угрозе."
 Albanian_Subversion.5.d: "Британцы смогли сформировать Национальный Комитет Свободной Албании. В организацию входят албанцы-антикоммунисты, проживающие на западе. С помощью этой организации мы надеемся привлечь и организовать этих албанских активистов для предстоящей операции. Группа отправит наиболее перспективных участников к британцам для углубленного обучения и подготовки к запланированной операции. Попытки привлечь поддержку организации со стороны короля Зогу зашли в тупик, поскольку бывший монарх не желает идти на компромисс в своей позиции, согласно которой он является единственным представителем албанцев. ЦРУ не желает оказывать проекту серьёзную поддержку, поскольку оно обеспокоено присутствием албанских антикоммунистических изгнанников, ранее выступавших за силы Оси."
 Albanian_Subversion.6.d: "Британское правительство обратилось к ЦРУ с просьбой о сотрудничестве в их планах по подготовке антикоммунистического восстания в Албании. Британцы установили тесные связи с Национальным Комитетом Свободной Албании. Через эту организацию группа может предоставить агентов для инициирования операции. Однако британцам не удалось заручиться поддержкой бывшего албанского монарха короля Зогу. ЦРУ полагает, что британцы хорошо подготовились, но обеспокоены отсутствием королевской поддержки и присутствием бывших албанских изгнанников-нацистов, сражавшихся за Ось. Часть сотрудников в Агентстве считают, что решением этой проблемы будет пойти своим путем и сотрудничать с королем Зогом, чтобы организовать восстание роялистов."
 Albanian_Subversion.7.d: "ЦРУ отказалось сотрудничать с предложенной британцами операцией в Албании. в ЦРУ считают, что король Зогу - самый лучший способ спровоцировать антикоммунистическое восстание. Они выразили скептицизм по поводу осуществимости плана SIS без поддержки короля Зогу. Говорят, что британцы очень разочарованы этим результатом и не знают, что делать дальше, поскольку для реализации их плана им нужны были американские базы и авиация. ЦРУ надеется, что SIS подключатся к нашей операции, так как мы уверены, что сможем добиться успеха с королём Зогу."
 Albanian_Subversion.8.d: "Соединенные Штаты недавно начали дипломатическую и медийную компании по осуждению албанского коммунистического режима Энвера Ходжи. Американское правительство призывает к самоопределению и обвиняет коммунистов в ущемлении прав всех албанцев. ЦРУ также поддерживает эти усилия, оказывая давление на своих союзников в международных средствах массовой информации, чтобы они публиковали сообщения о подавлении коммунистической угрозы и заявления албанских эмигрантов-антикоммунистов. Эти усилия направлены на то, чтобы подорвать коммунистический режим и обеспечить международную поддержку будущей операции по свержению коммунистов."
 Albanian_Subversion.9.d: "Соединенные Штаты объявили, что примут в страну албанских беженцев. Американское правительство заявило, что эти беженцы являются жертвами коммунистической агрессии и находятся под угрозой в Европе. Публичная декларация призвана разоблачить ситуацию с правами человека в контролируемой коммунистами Албании. По мнению ЦРУ, прибытие беженцев позволит организации укрепить связи с албанцами-антикоммунистами и выявить будущих оперативников и политических союзников."
 Albanian_Subversion.10.d: "Ассамблея порабощенных европейских наций была организована в Нью-Йорке под наблюдением Соединенных Штатов и частным руководством ЦРУ. Организация объединяет антикоммунистических эмигрантов из Албании, Болгарии, Чехословакии, Эстонии, Венгрии, Латвии, Литвы, Польши и Румынии. Организация обязуется освободить свои страны мирными средствами и предать гласности реальность жизни за жестоким железным занавесом. Наряду с публикацией периодических изданий и газетных статей организация планирует открытие филиалов в Англии, Франции и Швейцарии. Советский Союз и его союзники будут внимательно следить за действиями этой группы."
 Albanian_Subversion.11.d: "Албанское антикоммунистическое восстание, возглавляемое албанскими изгнанниками, которые вернулись для освобождения своей страны, приветствовало возвращение короля Зогу в Тирану. Король жил в изгнании с тех пор, когда был вынужден бежать из страны после вторжения Италии в 1939 году. Его критиковали за то, что он забрал большую часть золотого запаса Албании, но он пообещал вернуть его и утверждал, что вывез золото только ради сохранения его от разграбления странами Оси. Антикоммунистическое восстание привлекло в свои ряды самых значимых сторонников со всех регионов Албании, которые остались верными королю. Выступая перед огромной толпой сторонников, король Зогу пообещал восстановить албанское достоинство и богатство. Соседние коммунистические государства осудили возвращение короля Зогу, назвав это началом реакционного кошмара для народа Албании. Соединенные Штаты и их союзники же, наоборот, приветствуют возвращение короля Зогу, как освободителя политической воли народа Албании."
 US_STEEL.0.d: "Цена на сталь в США резко выросла. Это вызвало обеспокоенность президента [USA.GetLeader] и его экономических советников. Они считают, что сталелитейная промышленность, в которой в первую очередь доминирует американская сталелитейная корпорация, координирует свои усилия по повышению цен на сталь с целью максимизации прибыли. Президент считает, что повышение цен чревато инфляционным кризисом и может ослабить оборонную промышленность в случае его возникновения. Считается, что он рассматривает разделение картеля "U.S. Steel", как способ повысить экономическую конкуренцию и снизить цены. Однако ему придется учитывать возможные последствия и юридические проблемы, которые может вызвать такое действие. "U.S. Steel" утверждает, что повышение цен связаны с рыночным регулированием и повышением заработной платы рабочих. Они выступают категорически против любых попыток федерального вмешательства в их деятельность."
 US_STEEL.5.d: "Президент [USA.GetLeader] недавно поручил правительству провести расследование в отношении компании "U.S. Steel" за манипулирование рынком, в то же время приказав своей команде юристов подать антимонопольные иски с целью разрушения корпорации. Президент заявил, что "U.S. Steel" обладает несправедливой монополией на рынке стали и сдерживает конкуренцию. Он предположил, что корпорация может либо пройти через серию судебных процессов и расследований, либо просто согласиться на разделение компании. После заседания совета директоров компания "U.S. Steel" ответила согласием на требования президента и инициировала планы по разделу компании. Президента критикуют многие акулы бизнеса, называя это чрезмерным вмешательством исполнительной власти в рыночные отношения, однако многие американцы аплодируют президенту за его усилия по защите потребителей и развитию конкуренции в бизнесе."
 US_STEEL.6.d: "Отвечая на вопросы о резком росте цен на сталь, президент [USA.GetLeader] заявил, что, хотя он и понимает чувства американского народа и предпринимателей, зависящим от стали, но такова цена свободной рыночной экономики. Когда его спросили о призывах в прессе вмешаться в проблему, чтобы снизить цены или разделить крупные сталелитейные корпорации, президент заявил, что эти варианты даже не рассматриваются. В своем заявлении "U.S. Steel" повторно заявила, что нынешнее повышение цен не является частью тщательно продуманной схемы, а всего лишь результатом текущих рыночных цен и спроса."
 Decolonization_USA.50.d: "Недавняя речь президента Соединенных Штатов вызвала сильное удивление у лидеров Западной Европы. Президент осудил европейский колониализм, как подавление неотъемлемых прав колонизированных народов на самоопределение и свободу. Он отметил, что продолжающийся колониализм только усиливает архаичные системы управления и радикализирует местное население против идей свобод и прогресса, которые Демократия предлагает миру. Он призвал все европейские державы с колониями начать процесс деколонизации и помочь установить новый мировой порядок свободной торговли, демократии и сотрудничества в Африке и Азии."
 Korean_War_Yan.1.d: "Соединенные Штаты потребовали, чтобы наши вооруженные силы начали немедленную операцию по освобождению Юньнани от коммунистов. Соединенные Штаты недавно начали войну с коммунистическим режимом и, похоже, полны решимости его уничтожить. Американцы выразили признательность за нашу приверженность демократии в Китае и считают, что наши операции во многом помогут их усилиям по разгрому коммунистов. Многие из командиров считают, что мы должны действовать сейчас в интересах Китая и сковать в боях войска коммунистов. Однако некоторые командиры призывают к осторожности, говоря, что мы будем действовать вне основных американских сил и рискуем потерять наши силы. Они считают, что мы должны отклонить просьбу и вторгнуться в Юньнань в удобное нам время и в выбранном нами месте."
 Korean_War_Yan.2.d: "Силы Китайской Республики, действующие в Бирме, согласились на нашу просьбу о начале операций в Юньнани. Это долгожданная новость для нашей операции. Коммунисты будут вынуждены защищать контролируемое побережье и свои границы, что даст нам возможность нанести удар по их ослабленным зонам. Это также узаконит нашу миссию по освобождению Китая и защите его демократических сил. В ближайшие дни мы можем ожидать сообщений о наступлении сил YANSA."
 Korean_War_Yan.3.d: "Силы Китайской Республики, действующие в Бирме, отклонили нашу просьбу о начале операции в Юньнани. Это серьезное препятствие для наших военных операций в Китае. Участие сил YANSA ослабило бы коммунистов и дало бы большую гибкость нашим планам. ЦРУ считает, что командиры YANSA были обеспокоены потерями и, возможно, слишком привыкли к своим базам в Бирме, где они контролировали местную торговлю наркотиками."
 Korean_War_Yan.4.d: "Сообщения из Китая и Бирмы доказывают, что остатки 8-й армии Китайской Республики начали вторжение в коммунистический Китай через провинцию Юньнань. Китайская Народная Республика пообещала немедленный ответ, но недооценила уровень угрозы, исходящий из этих действий. Однако это вторжение может закончиться катастрофой, поскольку коммунистам теперь придется ввести войска в Юньнань, поскольку они ведут прямую войну с США. Американское правительство приветствовало эту новость, назвав ее возрождением освободительных сил, стремящихся положить конец коммунистической тирании."
 Decolonization_USA.2.d: "В недавнем обращении президент призвал к деколонизации Африки. Президент заявил, что американский народ всегда поддерживал дело демократии и свободы. В соответствии с этими ценностями прекращение колониализма и свобода для всех африканцев является жизненно важным интересом для Соединенных Штатов. Он закончил свое обращение, призвав страны, которые все еще держат колонии, признать деколонизацию - это единственный справедливый путь вперед. Это обращение, несомненно, вызовет беспокойство у колониальных держав, но американское правительство считает, что оно приобрело новых друзей и легитимность на всем африканском континенте. Многие антиколониальные организации приветствовали эту новость. Американские предприятия и экономисты также демонстрируют поддержку, поскольку прекращение колониального правления откроет новые рынки для американских товаров."
 Decolonization_USA.3.d: "Переход к политике деколонизации имеет высокий риск отчуждения могущественных союзников и отражает наш возврат к Вильсоновской дипломатии. Госдепартамент США объявил, что Соединенные Штаты твердо поддерживают самоопределение всех колонизированных народов. Новые усилия США призваны укрепить связи Америки с новыми государствами и бросить вызов Советскому Союзу, как поборнику антиколониализма в Африке. Поговаривают, что Советы обеспокоены этим вызовом и советская партийная элита опасается, что американцы могут распространить эту позицию самоопределения на находящиеся под советским влиянием регионы в Европе и Азии."
 Decolonization_USA.4.d: "Госдепартамент объявил, что Соединенные Штаты намерены пригласить новые независимые африканские государства присоединиться к программе технической помощи. Американское правительство считает, что программа предоставит необходимую техническую поддержку, чтобы помочь преобразованию этих государств в стабильные демократические страны. Это приглашение продолжает недавнее стремление Америки к деколонизации и многие рассматривают программу технической помощи, как способ для США усилить свое влияние на континенте и обуздать угрозу коммунистического влияния."
 Decolonization_USA.1.d: "Ситуация в Африке стремительно меняется. По всему континенту миллионы людей выступают либо за значительную автономию, либо за независимость от колониальных держав. Распространение образования и более радикальных идеологий в колониях подпитывает антиколониальные организации. Госдепартамент считает, что европейские державы, продолжающие удерживать колонии, даже с применением силы, рискуют радикализировать своих колониальных подданных, чем могут воспользоваться коммунисты. Есть мнение, что Соединенные Штаты должны использовать свои рычаги воздействия на европейские колониальные государства, чтобы подтолкнуть их к деколонизации, дабы предотвратить радикализацию и открыть эти территории для американского культурного и экономического влияния. Однако другая политическая группа утверждает, что такой подход будет только способствовать возникновению радикальных режимов и вместо этого они призывают Соединенные Штаты более открыто поддерживать колониальные государства. Мы можем побудить их провести реформы, чтобы в конечном итоге они могли передать власть местным прозападным элитам."
 Radio_Free_Europe.1.d: "Национальный комитет за свободную Европу (NCFE) недавно запустил новую радиостанцию под названием Радио "Свободная Европа". Эта новая станция будет вести передачи по Европе и за железным занавесом для борьбы с коммунистической пропагандой. ЦРУ контролирует NCFE и завербовало многих видных антикоммунистов для поддержки этой программы. Радио "Свободная Европа" будет транслировать рассказы беженцев, сумевших спастись от коммунистических режимов. Радиостанция широко приветствуется в Соединенных Штатах, как решительный ответ на растущую коммунистическую угрозу."
 PBSUCCESS_AFTERMATH.2.d: "Неудачная попытка свергнуть правительство Хакобо Арбенса привела к тому, что он укрепил свою власть над страной. Теперь, владея более серьёзной поддержкой внутри страны, он, несомненно, расширит компанию по захвату земель и объектов американских компаний, таких как United Fruit Company. ЦРУ считает, что это неизбежно приведет к превращению Гватемалы в советскую марионетку. Однако пока этого не происходит. Чтобы не потерять Гватемалу и разрешить вопрос до того, как ситуация станет совершенно несостоятельной, ЦРУ разработало план по утечке определенных разведданных, чтобы создать впечатление, что Советы уже предпринимают шаги для расширения своего влияния на Гватемалу. Как только американский народ увидит, что Гватемала находится на грани размещения советских войск, мы сможем развернуть наши вооруженные силы для обеспечения безопасности страны."
 PBSUCCESS_AFTERMATH.1.d: "Неспособность ЦРУ взять под контроль ситуацию в Гватемале отражает более широкий провал доктрины Монро. На протяжении десятилетий доктрина Монро защищала наши интересы и наш регион от враждебных идеологий или иностранного вмешательства. Однако недавний провал подчеркивает ограниченность американского влияния и теперь Гватемала рискует стать союзником СССР. Наша неудача в Гватемале является открытым сигналом для антиамериканских сил во всем западном полушарии организовывать свои операции и реализовывать собственные планы. Союзники США также потеряли веру в нашу защиту и могут начать искать поддержку в других местах."
 PBSUCCESS_AFTERMATH.3.d: "В американской и западной прессе распространяются сообщения об усилении советского влияния на гватемальское правительство Хакобо Арбенса. В сообщениях указывается, что Советы планируют быстро наладить отношения со страной и создать в Гватемале собственные базы. Редакции уже призвали к ответным действиям президента. Американскому народу не нравится то, что советские войска размещаются всего в нескольких милях от Соединенных Штатов. Президент получил необходимую общественную поддержку для принятия более решительных мер по урегулированию ситуации в Гватемале."
 PBSUCCESS_AFTERMATH.50.d: "Левый режим в Гватемале укрепил свой контроль над страной и ввел драконовские меры, чтобы обуздать инакомыслие и организовать дальнейшую национализацию иностранных компаний в стране, особенно это касается компании "United Fruit Company", жизненно важной американской корпорации. ЦРУ ответило на это операцией "PBSuccess", целью которой было установить вещание радиопередач по стране и вселить страх и панику среди гватемальцев. В этой хаотической обстановке гватемальские военные с их проамериканским и антикоммунистическим руководством смогут сплотить даже проправительственных офицеров, чтобы вмешаться и положить конец режиму Якоба Арбенса. Однако этот план провалился. Как только просочились новости о предстоящем развертывании советских войск, президент отдал приказ вооруженным силам Соединенных Штатов о вторжении в Гватемалу, чтобы восстановить демократию и защитить американских граждан и их собственность в стране при поддержке американского народа."
 USA_Israel_Lobby.1.d: "Ситуация на Ближнем Востоке нестабильна. Хотя недавняя арабо-израильская война закончилась перемирием, обе стороны, похоже, готовятся ко второму раунду боевых действий. Арабский мир обладает ценными ресурсами, в особенности нефтью. Израильтяне создают демократическое государство, имеют тесные связи с Западу и симпатизируют американскому народу. Администрация должна решить, как нам действовать в сложившейся обстановке. Одна группа выступает за продвижение произраильской политики, включая контракты на оружие, что будет хорошо воспринято общественностью и произраильскими сторонниками. Израильтяне также могут помочь защитить наши интересы в регионе. Однако это может привести к гневу арабов и недоступности их нефти. Другая группа считает, что мы должны сохранять нейтралитет, чтобы поддерживать и развивать связи с арабскими государствами. С этой позиции мы могли бы помочь в заключении будущего мирного соглашения и долгосрочных выгодных отношениях с обеими сторонами."
 USA_Israel_Lobby.2.d: "США, Великобритания и Франция подписали трехстороннюю декларацию. Три государства обязуются поддерживать территориальный статус-кво, установленный недавними арабо-израильскими соглашениями о перемирии. Соглашение подтверждает приверженность этих государств миру и стабильности на Ближнем Востоке и предотвращению дестабилизации шаткого мира любой из сторон. Арабские государства приветствуют соглашение, отчаянно восстанавливая свой военный потенциал. Говорят, что израильтяне расстроены, поскольку считают, что их военное преимущество скоро будет потеряно, так как стороны соглашения также решили ограничить продажу оружия в этом регионе."
 USA_Israel_Lobby.3.d: "Соединенные Штаты отказались подписать трехстороннюю декларацию, предложенную Великобританией и Францией. Соглашение призывает все три государства сохранить нынешний территориальный статус-кво между Израилем и его арабскими соседями. Также было бы оговорено, что три стороны будут работать над контролем продажи оружия в регионе. Американское правительство утверждало, что соглашение было антиизраильским, поскольку оно отказывает им в доступе к оборонной помощи, позволяя арабским государствам более эффективно перевооружаться с их более сильным финансовым положением. Отказ Америки указывает на то, что она поддерживает Израиль и арабские государства возмущены таким положением дел."
 Ajax_USA.5.d: "Госдепартамент объявил, что Соединенные Штаты решительно выступают против недавней национализации иностранных нефтяных компаний в Иране. Такие односторонние действия ограничивают потенциал будущих инвестиций в Иран и несправедливо бьёт по тем, кто имеет долю в этих компаниях. Соединенные Штаты призывают Иран пересмотреть свой подход и вернуться за стол переговоров для достижения справедливого решения. Объявление приветствуется британцами, которые продолжают попытки заручиться международной поддержкой для защиты своих интересов."
 Ajax_USA.6.d: "Президент Соединенных Штатов проинформировал Совет национальной безопасности, что Америка не планирует военную операцию в Иране. Президент выразил надежду, что и Великобритания, и Иран смогут разрешить свои споры мирным путем. На данном этапе военная эскалация только вызовет новые проблемы и сильно ослабит имидж Соединенных Штатов за рубежом. Британское правительство также было проинформировано об этом решении, и ожидается, что оно не поприветствует наш ход. Если Британия начнёт собственную военную операцию, то она рискует спровоцировать негативную реакцию Америки."
 Ajax_USA.15.d: "Президент поручил Госдепартаменту подвергнуть критике давление Великобритании на Иран. Соединенные Штаты не могут мириться с таким вопиющим вмешательством, поскольку оно рискует обострить напряженность в регионе. Это также ослабило бы престиж Запада среди постколониальных государств. ЦРУ получает указание прекратить любое сотрудничество с британцами в отношении разведывательных операций в Иране. Если англичане будут настаивать на своем нынешнем курсе, то им придётся полагаться только на свои силы."
 Ajax_USA.7.d: "Неспособность Великобритании свергнуть иранское правительство заставило их рассмотреть более решительные меры для предотвращения национализации нефти и дальнейшего ослабления западного влияния в стране. Британцы сейчас призывают нас поддержать их как в военном, так и в политическом плане при подготовке вторжения в Иран. Поддержка вторжения и новый режим в Иране мог бы укрепить контроль Запада над ключевым государством в регионе и усилить связи с Великобританией. Британцы также утверждают, что нынешнее иранское правительство близко к коммунистической партии Туде, и если его не убрать, Иран может стать жертвой коммунистического переворота, спонсируемого Советским Союзом. Однако такое вторжение может иметь другие последствия, такие как радикализация иранской оппозиции к нам и впоследствии спровоцировать более широкую негативную реакцию в регионе. Также необходимо учитывать потенциальную реакцию Советского Союза."
 Ajax_USA.8.d: "Соединенные Штаты согласились с нашим предложением сместить иранское правительство с помощью военных действий. Нынешний режим в Тегеране явно находится в плену просоветской Туде. Это только вопрос времени, когда в результате государственного переворота, организованного Советским Союзом, Иран станет советской марионеткой. Если бы это произошло, Советы оказались бы в самом центре Ближнего Востока. Усилия по национализации и антибританские демонстрации являются доказательством коммунистического влияния. При поддержке Америки мы можем рассчитывать на быструю победу и дипломатическое прикрытие в наших операциях."
 Ajax_USA.9.d: "Соединенные Штаты отклонили наше предложение о смещении иранского правительства с помощью военных действий. Нынешний режим в Тегеране явно находится в плену просоветской Туде. Это только вопрос времени, когда в результате государственного переворота, организованного Советским Союзом, Иран станет советской марионеткой. Если бы это произошло, Советы оказались бы в самом центре Ближнего Востока. Американцы предпочитают игнорировать опасные последствия недавнего усиления процесса по национализации британских активов и антибританских демонстраций. При необходимости нам, возможно, придется устранить иранскую угрозу самостоятельно, но это, скорее всего, вызовет возражения со стороны США."
 Containment_Policy.1.d: "С 1945 года самым большим вызовом мировому порядку является рост радикальных коммунистических движений в Европе и Азии. Советский Союз открыто поддерживает такие объединения и предлагает этим организациям оружие, обучение и деньги для свержения демократических режимов. На территориях, находящихся под советской военной оккупацией они просто уничтожили не коммунистические политические партии и насильственно установили коммунистические режимы. Для борьбы с этим вызовом Соединенные Штаты создают союзы между прифронтовыми государствами, противостоящими коммунистам и поощряют коллективную оборону. Американская военная, экономическая и политическая помощь защитит эти государства от явных и скрытых коммунистических угроз. Цель состоит в том, чтобы окружить коммунистический мир и удержать его от дальнейшего расширения."
 USA_CWC.1.d: "В Китае бушует гражданская война, Китайская Республика изо всех сил пытается остановить коммунистическую Китайскую Народную Республику. Годы внутренних конфликтов и Вторая мировая война истощили большую часть сил Китайской Республики. Мы должны рассмотреть варианты выхода из сложившейся ситуации. Один из вариантов - оставить все на самотек и забыть про этих китайцев. Наше участие может только затянуть никому не нужную борьбу, усилить коммунистов или истощить наши собственные силы. Другой вариант - обратиться в ООН, чтобы добиться международного сотрудничества в разрешении конфликта в пользу Китайской Республики. Наконец, мы можем просто вмешаться напрямую. Мы можем предоставить советников, оборудование и, если необходимо, осуществить военную интервенцию, чтобы спасти китайский народ от коммунистической страшной тирании."
 CCW_USA.10.d: "В мрачной атмосфере безысходности президент обратился к американскому народу, заявив, что вооруженные силы США вмешаются в гражданскую войну в Китае. Президент сказал, что Китайская Республика была близким союзником Соединенных Штатов во время последней войны, удерживая линию против Японской империи ценой огромных потерь. Он также отметил налаживание тесных связей между Китаем и США во время войны, в том числе многочисленные китайские уступки для размещения и защищённости американских лётчиков на их базах. В заключение он заявил, что коммунисты стремились эксплуатировать измученную китайскую нацию своими гнусными вылазками, а правительство Китая нуждается в прямой американской помощи, чтобы обеспечить свободу своего народа."
 CWC_Police_Action.1.d: "Соединенные Штаты представили в Совете Безопасности ООН резолюцию, призывающую к международному осуждению и принятию мер против Китайской Народной Республики (КНР). Соединенные Штаты заявляют, что КНР постоянно нарушает международные нормы и совершает серьезные преступления против собственного народа. Успешное голосование в ООН придаст легитимность военным действиям против КНР и поможет создать международную коалицию. Единственное препятствие для принятия резолюции - Советский Союз, который имеет право вето в Совете Безопасности."
 CWC_Police_Action.2.d: "Соединенные Штаты недавно представили Совету Безопасности ООН резолюцию, призывающую к международному осуждению и принятию мер против Китайской Народной Республики (КНР). Соединенные Штаты пытаются достичь международного консенсуса в отношении планируемых ими военных операций. КНР - коммунистическое государство, однако их руководство временами было неустойчивым и проявляло желание в конечном итоге бросить вызов нашему руководству коммунистическим миром. Порой они ставили под сомнение наш революционный путь. Возможно, в наших интересах воздержаться от голосования и позволить двум нашим соперникам ослабить себя в вооруженном конфликте. Однако Китай - крупное коммунистическое государство и отказ от права вето может привести к серьезным последствиям для продвижения коммунизма в Азии."
 CWC_Police_Action.3.d: "Советский Союз использовал свое право вето, чтобы отклонить резолюцию Соединенных Штатов, призывающую к решительным действиям против Китайской Народной Республики (КНР). Это серьезный удар для американцев, которые хотели заручиться международной поддержкой их военных операций. Другие коммунистические государства довольны нашими действиями по защите социализма. Запад, несомненно, будет взбешен, но нам к этому не привыкать. КНР также выразила благодарность за наше решение и мы надеемся на улучшение отношений с ними в ближайшем будущем."
 CWC_Police_Action.4.d: "Советский Союз неожиданно решил воздержаться от права Вето по резолюции Совета Безопасности ООН, призывающей к решительным действиям против Китайской Народной Республики (КНР). Это крупная победа США, предложивших резолюцию. Хотя советские союзники открыто не осуждают это решение, многие левые и коммунистические движения уже выразили возмущение по этому поводу. КНР также осудила советское решение и открыто ставит под сомнение революционность воззрений советских лидеров. Соединенные Штаты теперь без помех смогут выполнить свои задачи в отношении КНР."
 USA_VIE50s.3.d: "Директор ЦРУ представил президенту план по обеспечению победы наших союзников на предстоящих выборах по воссоединению во Вьетнаме. Мы создали в стране довольно прочную разведывательную сеть. План будет включать в себя вливание денег, коррупционные схемы и манипуляцию фальшивыми голосами, дабы обеспечить победу демократии для народа Вьетнама. Однако если эта операция будет раскрыта - это может иметь серьезные последствия для нас во всём регионе. Но если не действовать, мы рискуем потерять всю страну и, возможно, весь регион из-за новой волны распространения коммунизма."
 Vietnam_RefferendumAH.5.d: "Народ Вьетнама проголосовал против объединения. Похоже, что народ Южного Вьетнама не заинтересован в объединении с коммунистическим Северным Вьетнамом. Результаты приветствуются поддерживаемым США правительством Южного Вьетнама, которое утверждало, что правительство Северного Вьетнама не способно провести свободные выборы. Правительство Северного Вьетнама обвинило Юг и его союзников в манипулировании результатами, чтобы не допустить объединения и создания настоящего центрального правительства, которое представило бы народ Вьетнама. Они призывают народ Вьетнама выразить свое недовольство и обещают удвоить свои усилия по освобождению всего вьетнамского народа."
 USA_VIE50s.2.d: "Соединенные Штаты согласились с планом проведения выборов по воссоединению Вьетнама, вытекающими из недавно подписанных Женевских соглашений. Соглашение было достигнуто после заверений коммунистического севера в том, что за выборами будут наблюдать международные наблюдатели. Наше согласие означает, что южные вьетнамцы должны будут согласиться с ним, несмотря на некоторые оговорки. ЦРУ также заявляет, что не уверено в удачном исходе выборов. Тем не менее, отказ от выборов может лишить южное правительство поддержки и подтолкнуть вьетнамскую общественность в подавляющем большинстве на сторону коммунистов, которые на деле готовы объединить нацию."
 USA_VIE50s.4.d: "На выборах по воссоединению народ Вьетнама решил объединиться под коалиционным правительством коммунистического севера и демократического юга. Тысячи людей вышли на улицы праздновать результаты выборов и многие вьетнамцы считают это победой в своей борьбы за мир и независимость. ЦРУ полагает, что на данный момент коалиционное правительство достаточно стабильно, но предупреждает, что коалиция может быстро распасться, если какая-либо из сторон попытается расширить своё влияние. Мы будем внимательно следить за ситуацией и работать над тем, чтобы коммунисты не использовали это, как возможность совершить переворот и захватить власть у свободолюбивого народа Вьетнама."
 USA_VIE50s.8.d: "Соединенные Штаты готовы поддержать Южный Вьетнам в его отказе от Женевских соглашений. Правительство юга считает, что соглашение даст коммунистам базу для расширения влияния, которым они могут подорвать позиции южного правительства. Что еще более важно, предложение о проведении выборов по воссоединению несостоятельны, поскольку коммунисты явно будут манипулировать ходом голосования в свою пользу всеми доступными им средствами. ЦРУ согласно с этой оценкой и готово оказать всестороннюю поддержку правительство Южного Вьетнама. Коммунистам придется пойти с нами на компромисс и дать гарантии выполнения достигнутых договорённостей и соглашений."
 American_Aid.5.d: "Президент поручил министерству обороны и госдепартаменту перебросить помощь, предназначенную для Франции, в Корею и Японию. Соединенные Штаты решили, что оказание большей поддержки Азии гораздо важнее, чем сосредоточение такого внимания на Европе. Франция - развитая и сильная страна и она не сильно пострадает от такого решения, хотя французское правительство, скорее всего, негативно отреагирует на наше решение. Правительство Японии и Кореи уже выразили свою благодарность за нашу возросшую поддержку. Они являются ключевыми государствами в Азии, находящимися на острие борьбы с коммунистической угрозой, поэтому им необходима максимальная поддержка."
 American_Aid.6.d: "Соединенные Штаты объявили, что перенаправят помощь, предназначенную для Великобритании, Австралии и других государств Содружества в Индию, Пакистан и Филиппины. Американское правительство понимает, что эти государства находятся под угрозой советского влияния, и поэтому необходимы решительные действия. Государства Содружества будут огорчены нашими действиями, но это не сильно скажется на темпе их восстановления. Данное решение подчеркивает одну из важнейших наших задач по обеспечению борьбы за влияние в Южной Азии и Тихоокеанском регионе."
 American_Aid.1.d: "Конгресс недавно принял "Закон о взаимной безопасности". Это новая программа иностранной помощи, которая позволит Соединенным Штатам предоставлять помощь и гранты дружественным государствам. Поддержка поможет этим странам более эффективно развивать свой потенциал и уверенно противостоять коммунистическому влиянию. В отличие от предыдущих программ, поддержка не будет ограничена каким-либо одним регионом или государством. Это даст президенту большую гибкость в дипломатических отношениях и укрепит позиции Госдепартамента, поскольку он продолжает вести дипломатические схватки за обеспечение американского влияния против все более воинственной советской внешней политики."
 USA_Korean_War.10.d: "Соединенные Штаты объявили войну Китайской Народной Республике. Вмешательство Коммунистического Китая в войну привело к огромным потерям для обеих сторон и ожесточенным боям между китайскими и американскими войсками. Президент обратился к конгрессу и рассказал об открытой поддержке Северной Кореи китайскими коммунистами. Размещение китайских войск с тяжелым вооружением и боевой авиацией свидетельствует об их решимости вести открытую войну против Соединенных Штатов. Отказ от объявления войны дало бы КНР преимущество, оставляя американские войска в Корее в уязвимом положении. Но объявив войну, Соединенные Штаты смогли расширить свой контингент и теперь уже призвать коммунистический режим Китая к ответственности за свои действия. После выступления Президента Конгресс подавляющим большинством проголосовал за объявление войны."
 CCW_USA.5.d: "Соединенные Штаты призвали международное сообщество активизировать усилия по оказанию крайне необходимой гуманитарной помощи Китайской Республике. Американский представитель в Организации Объединенных Наций отметил, что народ Китая столкнулся с десятилетиями гражданской войны и интервенции, и коммунисты, вместо того, чтобы объединить усилия для восстановления страны, стремятся использовать разруху внутри Китая в своих интересах. Гуманитарная помощь принесет ослабление страданий китайского народа и снизит нагрузку на правительство, поскольку они вынуждены противостоять вызовам новой войны, а также решит проблему с основными потребностями населения. Китайская Народная Республика через своих коммунистических союзников осудила резолюцию Америки, сославшись на нее, как на попытку заставить международное сообщество субсидировать военные расходы Китайской Республики."
 CWC_Police_Action.0.d: "В то время, как новости из Китая продолжают рисовать нам картину того, что осажденная Китайская Республика постепенно уступает свои позиции армии КНР, появляется все больше сообщений о потенциальной интервенции США. Поговаривают, что темы, связанные с Китаем, преобладают на встречах в Пентагоне, Белом доме и совещаниях спецслужб. Американских офицеров, имевших опыт боевых действий в Китае во время войны, отзывают и переводят в Пентагон. На пресс-конференциях правительственные чиновники постоянно выражают озабоченность глобальными последствиями победы коммунистов в Китае. Эти сообщения вызывают обеспокоенность в Москве и других коммунистических государствах, так как Соединенные Штаты вскоре могут оказаться на грани вмешательства в гражданскую войну в Китае, что может привести к драматической эскалации конфликта на международной арене."
 American_Ceasefire_Request.1.d: "Соединенные Штаты потребовали прекращения огня в Корейском конфликте. Прибытие наших войск нарушило баланс сил, перевесив чашу весов на нашу сторону, серьёзно угрожая силам США и их марионеток. Стало ясно, что они не видят возможности добиться победы и не способны повлиять на прекращение боевых действий. Некоторые из наших старших советников утверждают, что это хорошая возможность и мы должны удвоить наши усилия для достижения полной победы. Другая группа советников считает, что Китай уже продемонстрировал свою приверженность мировой революции и оказал непосильную помощь кровью и потом наших солдат. Они утверждают, что мы должны согласиться на прекращение огня и сконцентрироваться на построении нашего социалистического государства, чтобы мы могли нанести удар по американцам, когда достигнем значительных успехов в строительстве коммунизма."
 American_Ceasefire_Request.2.d: "Недавно мы отправили китайцам запрос на прекращение огня. Они достаточно эффективно противостоят нам и их согласие на прекращение огня положило бы конец боевым действиям. Однако китайцы оказались глупы и отклонили запрос. Похоже, они верят, что победа их войск близка. Однако наши войска более чем способны сдержать их и нанести им сокрушительное поражение за их ошибку. После отказа Китая наши командиры начали планировать новые операции, дабы продемонстрировать Китаю, что их победа невозможна."
 American_Ceasefire_Request.3.d: "Недавно мы отправили китайцам запрос на прекращение огня. Они достаточно эффективно противостоят нам и их согласие на прекращение огня положило бы конец боевым действиям. Наша просьба была принята и в настоящее время планируется провести встречу между командующими на передовой для обеспечения планомерного урегулирования конфликта. Силы Организации Объединенных Наций и американские войска храбро сражались против превосходящих сил. Китайцы, несомненно, тоже пришли к выводу, что продолжение боевых действий не приведет к положительной ситуации, а лишь еще больше подорвет их силы."
 American_Ceasefire_Request.4.d: "Ожесточенные бои в Корее, похоже, подходят к концу после новостей о том, что обе стороны согласились на прекращение огня. Война началась с вторжения коммунистической Северной Кореи в Южную Корею. Это спровоцировало Соединенные Штаты вмешаться на защиту Юга с союзными войсками в соответствии с мандатом Организации Объединенных Наций. Боевые действия быстро переросли в крупный региональный конфликт, который недавно зашел в тупик, ибо ни одна из сторон не смогла добиться решительного превосходства. Обе стороны приветствуют прекращение огня и народ, как Северной, так и Южной Кореи, несомненно, вздохнет с облегчением от прекращения боевых действий."
 PRC_USA_KOR.1.d: "По частным каналам Соединенные Штаты передали нам, что вскоре начнут применять ядерное оружие против нашей страны, если мы не выйдем из корейского конфликта. Это чудовищная угроза отражает отчаяние кровожадного капиталистического режима. Некоторые из наших высокопоставленных должностных лиц утверждают, что угроза - это лишь вынужденная уловка, поскольку наши силы держат капиталистов и их марионеток в шаге от поражения. Было бы глупо остановиться сейчас и дать им возможность использовать ядерный шантаж для других конфликтов, таких как борьба за Тайбэй. Однако другие официальные лица считают, что угроза реальна и соответствует стремлению Америки к победе любой ценой. Они утверждают, что наше первоначальное вмешательство демонстрирует приверженность Китая мировой революции и уход сейчас не сделает Китай уязвимым, а вместо этого выиграет время для Китая, чтобы противостоять ядерному шантажу. Мы должны либо остаться и сражаться до последнего, либо принять их требования."
 PRC_USA_KOR.4.d: "Китайцы проигнорировали наши угрозы использовать против них наш ядерный арсенал. Китай явно считает, что мы блефуем и не планируем в действительности использовать ядерное оружие. Пентагон готов начать подготовку первого раунда установления целей и развёртывание ядерного оружия. Использование этого вооружения может переломить ситуацию, минимизировать наши потери и, возможно, заставить Китай подчиниться. Однако некоторые из наших высших руководителей оборонного ведомства проявляют осторожность. Они опасаются последствий ядерных ударов в Корее. Это может спровоцировать более широкомасштабный конфликт или даже ответную реакцию Советов. Есть также опасения, что наше решение применить ядерное оружие в небольшом региональном конфликте может создать прецедент, который позволит другим государствам в будущем действовать аналогичным образом. Мы должны решить, реализовать ли наши угрозы или отступить и не использовать ядерное оружие."
 PRC_USA_KOR.2.d: "Китайское правительство, используя частные каналы, дало нам понять, что они услышали наше предупреждение и вскоре начнут вывод китайских войск из Кореи. Китайцы заявляют, что это тактический отход и предупреждают нас держаться подальше от их границы. Это большая победа для нас, и как только произойдет вывод китайских войск, баланс сил в Корее изменится в нашу пользу. Что еще более важно, это показывает нам успешность тактики запугивания нашим ядерным арсеналом для получения дипломатических и военных преимуществ за рубежом. Многие в Пентагоне очень довольны тем, что их вложения в расширение ядерного арсенала принесли дивиденды и, вероятно, спасли жизни многих американских солдат."
 PRC_USA_KOR.3.d: "В неожиданном заявлении Китайская Народная Республика сообщила, что достигла своих целей по защите Китая от капиталистической интервенции и немедленно начнет вывод своих войск из Кореи. Китайское правительство добавило, что любые дальнейшие попытки вторжения будут встречены отчаянным сопротивлением. Соединенные Штаты и их союзники приветствуют эту новость, поскольку это сдвигает военный баланс в Корее в их пользу. Союзники КНР озадачены, поскольку ходят слухи о том, что решение Китая может быть связано с американскими угрозами задействовать свой ядерный арсенал в корейском конфликте."
 PRC_USA_KOR.10.d: "После ожесточенного конфликта, который начался с не спровоцированного вторжения Северной Кореи, Республика Корея вышла победителем. При поддержке сил Организации Объединенных Наций во главе с США Корея наконец объединилась. Впервые с девятнадцатого века Корея стала единым независимым государством. Корейское правительство объявило, что вскоре начнет программу декоммунизации и искоренит все остатки предыдущего режима. Победа была достигнута только после вывода китайских войск из конфликта, что изменило баланс сил в пользу Соединенных Штатов и их союзников."
 USA_VIE50s.10.d: "Вскоре состоится референдум о будущем объединении Вьетнама. Правительство должно решить, примет ли оно результаты или отклонит их. В вооружении коммунистов стоит мощная пропагандистская машина и программа, рассчитанная на простой народ. Проникновение в сельскую местность наряду с их тоталитарным контролем над севером предполагает, что они имеют возможности для манипуляций выборами. Тем не менее, они пообещали, что голосование будет проходить свободно под контролем международных наблюдателей. Отклонение результатов оттолкнет наших международных партнеров и если мы осудим голосование заранее и в конечном итоге получим положительный результат - это будет серьезной проблемой. Правительство должно решить, можно ли доверять этим выборам."
 CWC_Police_Action.5.d: "Соединенные Штаты объявили, что их вооруженные силы примут роль полицейского против Китайской Народной Республики. Американское правительство продолжает настаивать на том, что КНР ведет не избирательную и бессмысленную агрессивную войну против Китайской Республики. Американская военная компания предназначена только для того, чтобы остановить эту агрессию и восстановить мир в Китае. Коммунистическое правительство Китая осудило американскую интервенцию, сравнив ее с дипломатией канонерских лодок колониального периода и попыткой колонизировать Китай. Китайская Республика же приветствовала американское вмешательство и раскритиковала КНР за откровенную пропаганду."
 Ajax_USA.16.d: "Объединенные британские и американские вооруженные силы начали вторжение в Иран. Это вторая военная интервенция Великобритании в Иран с 1939 года. Она является ответом на решение Ирана национализировать свою нефтяную промышленность. Соединенные Штаты поддерживают позицию Великобритании о незаконном захвате их собственности. Они также поддерживают позицию Великобритании, согласно которой нынешнее правительство Ирана сталкивается с риском коммунистического переворота или уже находится под тайным коммунистическим контролем. Военное руководство в Вашингтоне и Лондоне выражает уверенность в скорой решительной победе. Правительство Ирана осудило интервенцию и призывает международное сообщество поддержать Иран, столкнувшийся с империалистическим вторжением."
 KW_EARLY.5.d: "Корейская война подошла к концу после объявления о том, что Северная Корея и Организация Объединенных Наций договорились о прекращении огня. Конфликт начался с неожиданного вторжения Северной Кореи в Южную Корею. Коммунистическое правительство Северной Кореи стремилось насильственно воссоединить Корею под своей властью. Однако Организация Объединенных Наций проголосовала за военное вмешательство во главе с США. После тяжелых и кровавых боев конфликт перерос в тупиковую ситуацию. Поскольку ни одна из сторон не смогла взять верх, было подписано соглашение о прекращении огня, которое восстановит довоенные границы. Международное сообщество в целом приветствовало окончание боевых действий."
 KW_EARLY.6.d: "Коварные американцы и их марионетки отклонили нашу справедливую просьбу о репатриации всех военнопленных в их родную страну. Они настаивают на том, что каждому военнопленному будет предоставлен выбор: репатриироваться или остаться на коррумпированном юге. Несомненно, их обширная пропагандистская кампания принесла определенные успехи, которыми они воспользуются, чтобы поставить нас в неловкое положение. Большинство в Центральном комитете считают, что единственный ответ на это - продолжение войны. Как только враг понесёт значительные потери, он отступится от своей нелепой позиции. Другие, однако, считают, что бои и так уже  продолжаются достаточно долго и что мы должны доверять революционному духу наших людей. Они призывают отказаться от наших требований и прекратить боевые действия, чтобы начать восстановление нашей страны. По их мнению те, кто откажется вернуться, были предателями с самого начала и они получат заслуженное наказание, когда мы завершим объединение нашего народа."
 KW_EARLY.1.d: "Истинные хозяева Южной Кореи, Соединенные Штаты, недавно начали переговоры о прекращении огня с нашими вооруженными силами. Наш революционный дух и сопротивление остановили их гнусные замыслы. Их непомерное богатство и современное вооружение не смогли преодолеть наши силы. Сейчас они держат десятки тысяч наших товарищей в лагерях, где ведется усиленная пропаганда. Прежде чем будет достигнуто какое-либо прекращение огня, мы потребуем вернуть этих людей домой. Американцы настаивают на том, что они не будут насильственно репатриировать военнопленных, но переговоры не могут продолжаться, пока они этого не сделают."
 KW_EARLY.2.d: "Наши переговоры с Северной Кореей по соглашению о прекращении огня зашли в тупик. Северные корейцы настаивают на том, чтобы мы репатриировали всех их военнопленных. Это идет вразрез с нашей нынешней позицией, согласно которой всем военнопленным следует предоставить выбор: остаться или отправить обратно. Многие военнопленные опасаются пыток или даже смерти, если их заставят вернуться. Другие обратились в христианство и опасаются религиозных преследований в случае возвращения. Подчинение требованиям коммунистов ускорит окончание конфликта, однако это будет противоречить всему, за что мы боремся и вызовет критику со стороны  американской общественности. Или мы могли бы придерживаться нашей позиции до тех пор, пока северокорейцы не откажутся от своих требований, оставаясь под гнётом бремени войны и в конце концов согласятся на наше предложение."
 KW_EARLY.3.d: "Капиталистические марионетки согласились на наше справедливое требование вернуть всех наших военнопленных. Их план использования наших товарищей в своих пропагандистских целях и подрыва нашего революционного духа был сорван. Как только наши люди вернутся, мы сможем начать процесс подведения итогов и при необходимости перевоспитания пленённых бойцов. Это устранит последние препятствия на пути наших переговоров о прекращении огня. Скоро эта долгая борьба закончится. Мы можем начать процесс восстановления нашей страны и подготовиться к выполнению священной миссии, которую мы начали."
 KW_EARLY.4.d: "После сложных переговоров северокорейцы наконец согласились на прекращение огня. Наша долгая борьба в Корее закончилась. Американский народ может гордиться тем, что его солдаты выполнили свой долг, а наше правительство выполнило свои обязательства перед миссией Организации Объединенных Наций. Несмотря на отчаянные трудности, наши люди держали оборону против превосходящей силы коммунистов. Соединенные Штаты продемонстрировали, что будут готовы противостоять насильственной коммунистической экспансии, где бы она ни происходила. Международный коммунизм теперь дважды подумает, прежде чем угрожать любой свободной нации."
 USA_1952_Buildup.1.d: "Лидеры Демократической партии все больше обеспокоены ростом популярности генерала Дугласа Макартура, главного кандидата в президенты от республиканцев. Чтобы противостоять популярному герою войны, генералу Дуайту Дэвиду Эйзенхауэру предлагают стать кандидатом от демократов на пост президента. Генерал Эйзенхауэр, пожалуй, единственный офицер, который достиг или даже превзошел достижения Макартура на войне. Эйзенхауэр также гораздо более популярен среди истеблишмента Вашингтона и Пентагона. Демократы надеются, что их собственный кандидат в герои войны сможет победить кандидата от республиканцев."
 USA_1952_Buildup.2.d: "Генерал Дуглас Макартур быстро набирает популярность, как республиканский кандидат в президенты. Его статус героя войны и природная харизма делают его очень привлекательным кандидатом для избирателей. Что касается республиканского истеблишмента, то к Макартуру они относятся с подозрением и сейчас началось новое движение за консолидацию поддержки истеблишментом одного из кандидатов, чтобы бросить вызов Макартуру. Существует три варианта: губернатор Томас Дьюи, губернатор Харольд Стассен и губернатор Эрл Уоррен. Все три варианта - это признанные политики, способные работать в рамках политической системы и с оппозицией. Лидеры республиканцев считают, что выбор этих трех кандидатов для поддержки со стороны истеблишмента может вытеснить Макартура и предложить кандидата в президенты, который сможет понравиться всем американцам."
 Decolonization_VIE.1.d: "Соединенные Штаты пошли на необычный шаг, публично призвав к свободным выборам во Вьетнаме. Это произошло уже после поражения правительства коммунистического Вьетминя. Американская позиция свидетельствует о том, что она уважает желание вьетнамского народа, даже если на выборах произойдет рост популярности коммунистов. Это отражает недавнее стремление Америки к деколонизации и самоопределению стран Африки и Азии. Американское правительство считает, что их политика усилит международную поддержку Соединенных Штатов и, в конечном итоге, приведет к более прочным отношениям с нашими союзниками."
 AmericanOffer.4.d: "После долгих интенсивных переговоров правительства Северного и Южного Вьетнама согласились на объединение страны. По решению сторон будет создано новое коалиционное правительство единства. Новое государство обещает восстановить то, что было разрушено в ходе недавних войн и заложить основу для сильного независимого Вьетнамского государства. Что касается внешней политики, новое государство обещает, что не будет втягивать страну во внешние конфликты и избежит выбора какой-либо из сторон в международных конфликтах. Вместо этого Вьетнам будет придерживаться принципа нейтралитета, поддерживая со всеми дружеские отношения. Эта новость приветствуется, как великая дипломатическая победа всех государств, участвующих в переговорах, в особенности Соединенных Штатов, Советского Союза и Франции."
 AmericanOffer.1.d: "Соединенные Штаты, используя спецслужбы, направили нашему правительству частное предложение. Они пообещали отказаться от своего несогласия с воссоединением Вьетнама в обмен на наши гарантии нейтралитета во внешней политике. Если мы примем американское предложение, то у Южного Вьетнама не останется иного выбора, кроме как согласиться на выборы и мы, вероятно, достигнем нашей цели - единого независимого Вьетнама. Однако принятие их требований будет означать компромисс во внешней политике. Политбюро разделилось во мнениях. Одна фракция требует принятия, поскольку это обеспечит быстрое объединение страны и осуществление революции во Вьетнаме. Другая фракция считает это предложение признаком слабости Америки и принесение в жертву внешней политики поставит под угрозу нашу независимость. Они призывают нас продолжать добиваться полной независимости. Дискуссия должна прийти к логическому завершению..."
 AmericanOffer.2.d: "Наше предложение поддержать воссоединение в обмен на отказ от активной внешней политики было принято Северным Вьетнамом. Это, кажется, подтверждает некоторые наши данные, которые предполагают, что, хотя они и коммунисты, они гораздо больше сосредоточены на обеспечении и продвижении вьетнамской независимости и национальной идентичности. Хотя решение далеко не идеальное, мы успешно предотвратили превращение Вьетнама в оплот коммунистической и советской экспансии в регионе."
 AmericanOffer.3.d: "Наше предложение поддержать воссоединение в обмен на нейтралитет во внешней политике было отвергнуто Северным Вьетнамом. Их решение не удивляет наших экспертов внешней разведки, которые давно рассматривают режим Северного Вьетнама, как прикрытие международной экспансии коммунизма. Отказ подтверждает, что они не являются националистической или антиколониальной силой, как они утверждают в своих заявлениях для общества. В конечном итоге они стремятся поставить весь Вьетнам под свой деспотический контроль, а затем использовать Вьетнам в качестве базы для распространения коммунизма по всему региону. Нам следует подумать об увеличении нашей поддержки Южному Вьетнаму."
 USA_INDO.1.d: "Американский президент направил своего госсекретаря для передачи послания нашему правительству во время его недавнего визита. Американцы считают, что нынешняя ситуация в Индокитае ухудшается и дальнейшее обострение конфликта приведёт только к катастрофе. Они призывают нас подумать и начать дипломатическое урегулирование конфликта. Хотя об этом прямо не заявляется, подразумевалось, что наш отказ начать переговоры может привести к сокращению американской помощи, в особенности военной. Высокопоставленные представители министерства обороны считают, что такой сценарий может иметь ужасные последствия для нашей обороноспособности. Возможно, настало время положить конец этой войне и отправить наших высокопоставленных дипломатических и политических лидеров, чтобы они запустили процесс переговоров."
 nato_expansion.1.d: "На недавней конференции стран-лидеров НАТО обсуждались вопросы расширения организации с целью включения в нее большего числа прифронтовых государств и усиления коллективной защиты свободной Европы. Западная Германия, Греция и Турция сталкиваются с коммунистическими силами на своих границах и рискуют подвергнуться подрывной деятельности коммунистической экспансии. Если оставить эти государства на обочине внешней политики, то это грозит свержением их правительств и поставит под угрозу позиции НАТО против Советского Союза в Европе. Эти государства можно укрепить и защитить от явных и скрытых коммунистических угроз. Однако предложение об их членстве встречает сопротивление ряда лидеров. Некоторые члены НАТО с подозрением относятся к включению Западной Германии в союз, ведь война окончилась совсем недавно. Другие опасаются, что Греция и Турция могут в конечном итоге стать более серьезным испытанием для альянса из-за их слабой экономики и отсталых вооруженных сил."
 nato_expansion.3.d: "НАТО предложило нам членство в их организации. Вступив в НАТО, мы будем защищены в соответствии с их положением о взаимной защите и получим доступ к современной военной технике, обучению армии и экономической поддержке. Однако вступление в НАТО поставило бы нас исключительно на сторону американского лагеря и сделало бы нас прямой мишенью для Советского Союза. Часть кабинета министров также опасается, что любые будущие операции втянут Турцию в более широкий, международный конфликт. Пронатовские члены кабинета министров считают, что членство в организации необходимо для обеспечения независимости Турции и дальнейшей модернизации страны. Они отмечают, что без защиты со стороны НАТО Советы в скором времени активизируют свои усилия по подрыву легитимной власти в Турции. Противники считают, что присоединение к организации уведет страну от кемалистской доктрины внешней политики, которая приносила пользу республике на протяжении десятилетий и рискует втянуть Турцию в разрушительную войну в будущем. Решение должно быть принято."
 nato_expansion.4.d: "Турция объявила о своем намерении вступить в НАТО. Заявление рассматривается, как крупная победа организации и подводит ее прямо к советской границе. Члены НАТО в восторге от включения прифронтового государства в состав альянса, имеющего значительную военную, стратегическую и географическую ценность. НАТО приветствовало это решение и пообещало, что организация защитит Турцию и поможет ее народу достичь процветания и достигнуть взаимовыгодного сотрудничества в рамках организации. Ходят слухи, что Советский Союз пришел в ярость и выразил обеспокоенность по поводу того, что Соединенные Штаты скоро создадут базы, с которых будут иметь прямой доступ к советской территории. Правительство Турции надеется, что членство даст им доступ к большей военной и экономической поддержке."
 nato_expansion.5.d: "Турция заявила об отклонении предложения о членстве в НАТО. Турецкое правительство заявило, что вступление в организацию подорвет позиции внешней политики, выстраиваемые десятилетиями и рискует втянуть турецкий народ в войну, в которой он не заинтересован. Советский Союз приветствовал решение Турции, назвав его ответственным и добрососедским. НАТО и Соединенные Штаты, в частности, будут сильно разочарованы тем, что не получат доступа к территории Турции и ее военному ресурсу."
 nato_expansion.6.d: "НАТО недавно предложило нам членство в организации. Присоединение к НАТО включит нас в их договор о коллективной защите и предоставит нам доступ к военной, экономической и политической поддержке. Кабинету министров придется обсудить, присоединяться нам или нет. Те, кто считает, что мы должны присоединиться, отмечают, что мы лишь недавно пережили попытку коммунистического переворота под влиянием советской подрывной деятельности. Вступление в НАТО обеспечит так необходимую нам защиту и ускорит наше восстановление после боевых действий. Оппозиция утверждает, что Греция не может полагаться на другие государства и, вступив в НАТО, она может только способствовать усилению советской подрывной деятельности. Они считают, что Греция и так достаточно пострадала за последние годы и вступление в организацию может привести к тому, что она окажется втянутой в будущую войну блоков в Европе."
 nato_expansion.7.d: "Премьер-министр Греции объявил, что правительство согласилось вступить в НАТО. Это делает Грецию новым членом поддерживаемого США альянса. Правительство Греции отметило, что оно надеется на установление тесных связей со всеми государствами-членами и обеспечение защиты Греции от любой внешней угрозы. Члены НАТО взволнованы этим заявлением, поскольку американцы заинтересованы в потенциальном создании баз и объектов для лучшего наблюдения за советскими действиями в восточном Средиземноморье. Говорят, что Советы не оценили это решение и выразили протест послу Греции в Москве. Множество людей в Греции приветствуют эту новость, поскольку членство предложит государству прямую защиту альянса. Стране, которая совсем недавно была целью иностранных захватчиков, а затем пережила ещё и гражданскую войну."
 nato_expansion.8.d: "Премьер-министр Греции объявил, что правительство отклонило предложение о вступлении в НАТО. Новость будет воспринята, как удар по организации, которая надеялась укрепить свое присутствие в восточном Средиземноморье и заблокировать распространение советского влияния. Советский Союз расценил это как решение, направленное на снижение напряженности в мире. Греческое правительство заявило, что отказалось присоединиться к альянсу потому, что греческий народ все еще выздоравливает от недавних войн и не в состоянии взять на себя обязанности по членству в альянсе. Будет ли этот отказ признаком греческого нейтралитета или сдвигом в сторону советского лагеря покажет только время."
 nato_expansion.9.d: "Поскольку американские, британские и французские войска планируют формально прекратить военную оккупацию нашей страны, они предложили нам членство в НАТО. Присоединение к организации завершит нашу интеграцию в коллективную защиту Западной Европы. Американцы, в частности, считают, что наше членство в НАТО имеет решающее значение для предотвращения будущей советской агрессии. Присоединение к организации будет способствовать демилитаризации нашей страны и позволит нам продемонстрировать, что Германия является оплотом демократии и свободы в Европе. Однако некоторые члены кабинета министров призывают нас отклонить это предложение. Они отмечают, что Франция и Великобритания не желают нашего перевооружения и это может вызвать рост напряженности. Что еще более важно, они обеспокоены тем, что наше присоединение к НАТО сделает объединение Германии практически невозможным, поскольку Советы будут рассматривать нас, как марионетку США."
 nato_expansion.10.d: "Западная Германия официально приняла приглашение вступить в НАТО. Это знаменует собой крупную победу организации. Новости об этом заявлении были хладнокровно восприняты в Лондоне и Париже, поскольку многие с подозрением относятся к вооружению Германии, даже несмотря на союзнические отношения. Однако Соединенные Штаты тепло приветствовали эту новость, назвав ее доказательством того, что Германия реабилитировалась и является примером добровольного оплота демократии. По мнению специалистов по планированию НАТО, Западная Германия значительно усилит оборону Западной Европы, как с точки зрения увеличения военной мощи, так и с точки зрения стратегической важности этих территорий. Советский Союз явно взбешен таким ходом событий и обвинил Соединенные Штаты и НАТО в саботаже вероятного воссоединения Германии и мира в Европе."
 nato_expansion.11.d: "В неожиданном заявлении Западная Германия отказалась от членства в НАТО. Это серьезный удар для организации, которая рассчитывала на то, что Западная Германия станет ключевым государством на передовой в защите Западной Европы. Франция и Великобритания, похоже, не слишком обеспокоены этим решением, поскольку многие в этих странах опасались того, что произойдет, если НАТО перевооружит Западную Германию, даже несмотря на их роль в качестве союзника. Говорят, что Соединенные Штаты сильно разочарованы, поскольку они самым решительным образом лоббировали присоединение Западной Германии к этой организации. Многие американские официальные лица выразили обеспокоенность тем, что отказ Германии указывает на то, что они могут поддаться на ложные советские обещания поддержки объединенной нейтральной Германии. Советский Союз положительно отреагировал на эту новость, похвалив Западную Германию за снижение угрозы новой войны в Европе."
 nato_expansion.12.d: "Поскольку мы работаем над укреплением нашего контроля над страной и предотвращением возрождения коммунизма, НАТО предложило нам членство в организации. Вступление в НАТО даст нам доступ к важной военной, экономической и учебной поддержке. Также нам будет обеспечена защита в соответствии с положением о коллективной безопасности, которое защитит нас от иностранного коммунистического экспансии. Альянс может стать нашим щитом, за которым мы построим сильную Албанию. Однако присоединение к организации может подтолкнуть коммунистов к расширению их подрывной деятельности на территории страны и вызвать народные волнения. НАТО также обяжет нас принимать иностранные войска и присоединяться к конфликтам, в которых албанский народ не заинтересован. Мы должны решить, перевешивают ли преимущества вступления в НАТО недостатки от подобного решения."
 nato_expansion.13.d: "Королевство Албания заявило, что присоединится к НАТО в ближайшее время. Правительство Албании отметило свои исторические связи с государствами-членами союза и свое желание еще больше укрепить эти связи. Члены НАТО в восторге от этих новостей, ведь многие видят в Албании ключевое прифронтовое государство и базу, с которой можно бросить вызов коммунистическим режимам на Балканах. Что еще более важно, НАТО считает, что теперь может защитить Албанию от прямых коммунистических угроз внутри страны. Советский союз обвинил правительство Албании в том, что оно является американской марионеткой, незаконно захватившей власть, отмечая, что албанский народ не будет долго терпеть подобного притеснения."
 nato_expansion.14.d: "Королевство Албания заявило, что не будет вступать в НАТО, несмотря на предложение о членстве. Организация сильно разочарована, поскольку многие считали, что членство Албании обеспечит им защиту королевства и позволит НАТО установить серьёзное присутствие на Балканах. Похоже албанцы опасаются, что после присоединения к организации они бы не защитили королевство, а наоборот, рисковали бы немедленным коммунистическим вторжением или народным восстанием. Новый режим все еще утверждает свою власть и искореняет албанские коммунистические структуры. Правительство Албании добавило, что, хотя оно и не будет присоединяться к организации, оно всё же надеется поддерживать дружеские отношения со всеми странами-членами НАТО."
 Hungarian_Rev_UN.0.d: "Госсекретарь США пообещал, что вскоре вынесет недавний кризис в Венгрии на обсуждение Совета Безопасности и Генеральной Ассамблеи ООН. Американцы утверждают, что народное восстание и советское вмешательство указывают на то, что ситуация может вскоре перерасти в открытую войну или даже в войну гражданскую. Есть надежда, что Совет Безопасности сможет привлечь внимание к тому, что происходит в Венгрии и осудить подавление воли ее народа. Многие наблюдатели полагают, что этот шаг США будет во многом символическим, поскольку Советский Союз контролирует право вето в Совете Безопасности и вряд ли поддержит что-либо, противоречащее его интересам."
 Hungarian_Rev_UN.1.d: "Ситуация в Венгрии критическая. Успешное восстание устранило марионеточное советское руководство и новый режим в Будапеште заявил о своих намерениях установить более независимый и демократический режим. Советский Союз ответил на это вооруженной интервенцией, что привело к ожесточенным уличным боям между венгерскими революционерами и советскими танкистами. У Соединенных Штатов есть два варианта действий в Организации Объединенных Наций: мы можем предложить голосование Генеральной Ассамблее, которое осудит действия Советского Союза и призовет к полному расследованию ситуации, что стало бы крупной символической победой демократии, или мы могли бы предложить полицейскую операцию Организации Объединенных Наций в Совете Безопасности, хотя для ее принятия нам нужно было бы сотрудничать в этом вопросе с Советами."
 Hungarian_Rev_UN.10.d: "Соединенные Штаты направили свои зарубежные миссии и высших должностных лиц в ООН, дабы осудить советское вторжение в Венгрию. Американское правительство не может сидеть сложа руки, пока советские танки попирают права и мечты венгерского народа. Действия Америки, похоже, сейчас ограничиваются только словами, но их резкая публичная критика повысит осведомленность международного сообщества по этому вопросу. Советский Союз и его союзники в ответ обвинили Соединенные Штаты в лицемерии, отметив отсутствие у них критики, когда попираются права граждан в государствах, являющихся союзниками Соединенных Штатов."
 Hungarian_Rev_UN.11.d: "Соединенные Штаты предложили полицейскую операцию Организации Объединенных Наций по разведению венгерских революционных сил и советских войск в Венгрии. Американское правительство утверждает, что ООН должна вмешаться, чтобы обеспечить защиту и безопасность венгерского народа, а также гарантировать соблюдение его прав. Соединенные Штаты желают найти реальное решение проблемы, поэтому приказали своим дипломатическим миссиям обратиться к советским дипломатам, чтобы найти приемлемое решение этого вопроса. Тем не менее, это будет тяжелое сражение, хоть оно и не военное."
 Hungarian_Rev_UN.2.d: "Соединенные Штаты предложили в Генеральной Ассамблее резолюцию, призывающую Советский Союз прекратить интервенцию в Венгрию. В резолюции также содержится призыв к Генеральному секретарю начать полное расследование вмешательства и определить, что произошло на самом деле. Резолюция была принята подавляющим большинством, поскольку некоторые из советских союзников-социалистов предпочли воздержаться, чтобы показать свое неодобрение деспотичных действий Советского Союза. Хотя Соединенные Штаты поздравляют себя с успехом, многие газеты и венгерские эмигранты отмечают, что резолюция в значительной степени несёт символический характер."
 Hungarian_Rev_UN.3.d: "Соединенные Штаты обратились к нам по поводу своего плана по внесению резолюции, призывающей к действиям полиции Организации Объединенных Наций в Венгрии. Американское правительство отмечает, что ситуация в Венгрии напряженная и рискует выйти из-под контроля. Кроме того, наши действия вызывают широкое международное осуждение. Они предлагают, чтобы мы поддержали развертывание сил Организации Объединенных Наций для обеспечения прекращения огня и начала мирных переговоров для урегулирования конфликта. Мы настаивали на том, чтобы силы ООН проводили разоружение венгерских повстанцев и должны были иметь советских наблюдателей для обеспечения их нейтралитета, на что американцы согласились. Одна из фракций в Москве считает, что поддержка резолюции восстановит престиж Советского Союза и переговоры, скорее всего, позволят сохранить в Венгрии социализм. Однако другая фракция утверждает, что мы не можем доверять Западу и победа над реакционными силами в Венгрии близка и мы должны использовать свое право вето, чтобы отклонить предложенную резолюцию."
 Hungarian_Rev_UN.4.d: "Соединенные Штаты представили резолюцию, призывающую к размещению в Венгрии миротворцев Организации Объединенных Наций. Эти силы разведут враждующие стороны, разоружат ополченцев и другие вооруженные группы, обеспечивая при этом стабильную обстановку для переговоров между венгерской стороной и Москвой. Советский Союз не был впечатлен даже предложением о включении их наблюдателей в миссию ООН. Советский посол раскритиковал делегацию Соединенных Штатов и ее лицемерную реакцию на события в Венгрии. Он назвал этот вопрос делом венгерского народа и что советские войска уже поддерживают стабильность в стране по приглашению легитимного правительства. Советский Союз наложил вето на резолюцию, положив конец любым шансам на ее принятие и нанеся дипломатическое поражение Соединенным Штатам."
 Hungarian_Rev_UN.5.d: "Соединенные Штаты представили резолюцию, призывающую к размещению в Венгрии миротворцев Организации Объединенных Наций. Эти силы разведут враждующие стороны, разоружат ополченцев и другие вооруженные группы, обеспечивая при этом стабильную обстановку для переговоров между венгерской стороной и Москвой. Советская делегация приняла резолюцию положительно, отметив, что ее войска уже находятся в стране по приглашению венгерской легитимной власти. Она также отметила, что силы ООН смогут помочь поддержать существующую миротворческую миссию и обеспечить большую прозрачность той положительной роли, которую Советский Союз играет в разрешении конфликта. Затем Совет Безопасности проголосовал за одобрение резолюции. Соединенные Штаты считают эту резолюцию большой победой. Аналитики уверены, что несмотря на принятие резолюции советской стороной, это представляет собой признание Советским Союзом того, что ситуацию нелегко разрешить с помощью грубой военной силы и что необходимо изменить тактику действий."
 USA_FRAIND.1.d: "Соединенные Штаты призвали к выводу наших войск из Индокитая. Они обеспокоены обострением конфликта в регионе, в том числе осадой Дьенбьенфу. Американцы настаивают на том, что у нас нет достаточной поддержки, огневой мощи и политической стабильности для достижения победы. Они настаивают на том, что наши дальнейшие операции только рискуют усилить поддержку коммунистов на территории Вьетнама. Однако наши высшие военные и разведывательные органы призывают нас отказаться от этого требования, особенно после успеха операции «Кондор», которая серьезно ослабила коммунистические линии снабжения и инфраструктуру. Генералы доверяют этим сведениям и они уверены, что приложив немного больше усилий можно добиться окончательной победы. Министр иностранных дел не столь оптимистичен и предупреждает, что если мы проигнорируем позицию американцев, они в ответ могут прекратить оказание помощи Франции, что может нанести значительный ущерб восстанавливающейся экономике."
 USA_FRAIND.2.d: "Франция заявила, что согласна с нашим призывом к выходу из Индокитая. Французское правительство заявило, что признает ситуацию в регионе неприемлемой и вскоре начнет процесс начала переговоров со всеми действующими сторонами и подготовку к выводу своих сил. Это крупная дипломатическая победа, поскольку ЦРУ и Госдепартамент сильно беспокоились, что продолжение французской оккупации укрепит доверие местного населения к коммунистам и ослабит антикоммунистические или прозападные группировки среди вьетнамского народа."
 USA_FRAIND.3.d: "Франция отклонила наш призыв к выводу их войск из Индокитая. Французы утверждают, что из-за недавних успехов на некоторых направлениях они не могут прекратить свои операции или отступить, находясь в серьёзном преимуществе. Французы подчеркнули, что вывод войск на этом этапе оставит беззащитными тех людей в регионе, которые их поддерживают и создаст вакуум власти, которым коммунисты обязательно воспользуются в своих интересах. Непредвиденное упорство французов продолжает отчуждение государств региона и негативно сказывается на репутации Запада за границей. Возможно нам придется рассмотреть более жесткие меры, чтобы привести французов в чувство."
 Establish_SEATO.1.d: "Во время встречи Совета министров в Бангкоке была официально учреждена Ассоциация Договора о Юго-Восточной Азии (SEATO). Организация является следствием недавно подписанного Манильского пакта, который призвал подписавшие его стороны сформировать SEATO с целью укрепления двусторонних связей и обеспечения коллективной безопасности перед лицом усиливающейся региональной коммунистической угрозы. Штаб-квартира организации будет находиться в Бангкоке и она надеется привлечь больше антикоммунистических региональных держав. Соединенные Штаты являются основными гарантами этого соглашения и выражают надежду на то, что организация превратится в своего рода НАТО Азиатского региона. Хотя обсуждались и планы культурных и военных обменов, участники встречи не пришли к соглашению о создании какого-либо совместного военного командования. Китайское коммунистическое правительство выразило сомнения по поводу перспектив организации, назвав ее бессмысленной империалистической попыткой задушить китайскую революцию."
 Establish_SEATO.2.d: "Соединенные Штаты предложили нам членство в SEATO. Организация призвана способствовать укреплению двусторонних связей между государствами-членами и сформировать органы коллективной безопасности против китайской агрессии в регионе. Присоединение к организации откроет возможности для расширения отношений с этими государствами, в особенности торговых связей и культурного обмена. В военном отношении организация не имеет объединенного военного командования, но проводит регулярные встречи с высокопоставленными представителями обороны стран-членов, которые могут способствовать профессиональному развитию наших вооруженных сил. Однако вступление в организацию может сделать нас мишенью для коммунистических государств. Нашему собственному населению может не понравиться идея коллективной безопасности и оно будет противодействовать потенциальным усилиям по интеграции военного сотрудничества."
 Establish_SEATO.3.d: "[FROM.GetName] приняли наше приглашение присоединиться к SEATO. Они пообещали присутствовать на следующем заседании Совета министров, чтобы официально оформить их членство. Они сообщили нам, что организация соответствует их внешней политике и целям. Их особенно взволновала перспектива расширения культурных и торговых связей с другими странами-членами. Это крупная победа нашей внешней политики, и SEATO получит выгоду от приема нового члена. Реакция прессы была очень положительной, поскольку многие в стране рассматривают рост SEATO, как подтверждение нашей твердой внешней политики."
 Establish_SEATO.4.d: "[FROM.GetName] отклонили наше приглашение присоединиться к SEATO. Они заявили о проблемности перспектив столь тесных связей с организацией на фоне внутренних проблем. Было повторено, что отказ от членства не означает отказ от их позиции дружеских отношений. [FROM.GetName] решили, что присоединение к организации может вызвать больше проблем, чем пользы. Это, безусловно, неудача, но мы продолжим поиск потенциальных членов альянса для усиления блока от надвигающейся угрозы коммунизма в Азии."
 CENTO_PROPOSAL.1.d: "Соединенные Штаты недавно предложили расширить Организацию Центрального договора (CENTO). CENTO был создан для сдерживания коммунистического влияния на Ближнем Востоке. Его члены имеют тесные двусторонние связи и значительный доступ к западной помощи. Американское предложение было направлено на привлечение большего числа государств Ближнего Востока для укрепления CENTO, чтобы противостоять не только коммунистическим угрозам, но и другим радикальным идеологиям в регионе. Его легитимность, как регионального альянса, должна быть усилена. Проамериканские арабские государства будут нацелены на привлечение в организацию большего числа арабских стран. Это также снимет обвинения в том, что организация не является репрезентативной для региона."
 CENTO_PROPOSAL.2.d: "Недавно мы получили приглашение присоединиться к Организации Центрального договора (CENTO). CENTO призван стать ближневосточной версией НАТО и предотвратить коммунистическую экспансию в регионе. Соединенные Штаты и Великобритания предоставляют группе стран, входящих в союз, военную и экономическую помощь. страны-члены альянса также имеют расширенные двусторонние и культурные связи. Присоединение к организации могло бы открыть доступ к расширенной западной помощи. Это укрепило бы наше место в западном лагере. Однако присоединение к организации может спровоцировать внутренние проблемы и радикализировать как левых, так и арабских националистов в стране."
 CENTO_PROPOSAL.3.d: "Правительство Ливана отказалось от членства в Организации Центрального договора (CENTO). Ливан заявил, что они безмерно благодарны приглашению и внимательно его рассмотрели. Однако из-за внутренних проблем и чувств ливанского народа они вынуждены отказаться. Это серьезный удар для Соединенных Штатов, которые надеялись расширить CENTO, чтобы побудить больше арабских государств остро реагировать на радикальные идеологические угрозы в регионе."
 CENTO_PROPOSAL.4.d: "Правительство Ливана заявило о своей взволнованности по поводу присоединения к Организации Центрального договора (CENTO). Присоединение к организации откроет Ливану доступ к расширенной западной помощи. Ливан выразил надежду на улучшение двусторонних и культурных связей со всеми странами-членами блока. CENTO и Соединенные Штаты рассматривают этот факт, как крупную победу в регионе. Ливан является одним из крупнейших центров арабской культуры в организации, обеспечивая CENTO большую легитимность в регионе. Другие арабские государства региона осуждают Ливан и обвиняют его в том, что он предал арабский народ ради выгоды от дружбы с империалистическими хищниками."
 CENTO_PROPOSAL.5.d: "Ливан положительно откликнулся на приглашение присоединиться к Организации Центрального договора (CENTO). Это большая победа для организации, которую мы помогли создать, чтобы сдерживать коммунистическое влияние в регионе. Хотя организация была предназначена для содействия коллективной обороне в регионе, но на самом деле она так и не вышла за рамки форума для более тесных двусторонних, культурных и военных связей. Присоединение Ливана к организации ослабит региональную критику блока, как имперского проекта, продвигаемого нами и Великобританией. Это также усилит способность организации справляться с ростом радикальных идеологий в регионе, таких как арабский национализм."
 CENTO_PROPOSAL.6.d: "Недавно мы получили приглашение присоединиться к Организации Центрального договора (CENTO). CENTO призван стать ближневосточной версией НАТО и предотвратить коммунистическую экспансию в регионе. Соединенные Штаты и Великобритания предоставляют группе стран, входящих в союз, военную и экономическую помощь. страны-члены альянса также имеют расширенные двусторонние и культурные связи. Присоединение к организации могло бы открыть доступ к расширенной западной помощи. Это укрепило бы наше место в западном лагере, усилив прозападные наклонности монархии. Однако такое решение может вызвать неприятные последствия и радикализировать как левых, так и арабских националистов в стране, особенно в рядах наших вооруженных сил."
 CENTO_PROPOSAL.7.d: "Правительство Иордании отказалось от членства в Организации Центрального договора (CENTO). Иордания заявила, что они рады приглашению и внимательно его рассмотрели. Однако из-за внутренних проблем и чувств иорданского народа они вынуждены отказаться. Это серьезный удар для Соединенных Штатов, которые надеялись расширить CENTO, чтобы побудить больше арабских государств остро реагировать на радикальные идеологические угрозы в регионе. Что касается Иордании, то это, вероятно, укрепит их имидж среди арабских националистов как внутри страны, так и в регионе."
 CENTO_PROPOSAL.8.d: "Правительство Иордании заявило о своем желании присоединиться к Организации Центрального договора (CENTO). Присоединение к организации откроет для Иордании доступ к расширенной западной помощи. Иордания выразила надежду на улучшение двусторонних и культурных связей со всеми странами-членами блока. CENTO и Соединенные Штаты рассматривают это как крупную победу, Иордания является одним из наиболее влиятельных арабских государств в организации, придавая CENTO большую легитимность. Другие арабские государства региона осуждают Иорданию и обвиняют ее в предательстве арабского народа ради выгоды от дружбы с империалистическими хищниками."
 CENTO_PROPOSAL.9.d: "Иордания положительно откликнулась на приглашение присоединиться к Организации Центрального договора (CENTO). Это большая победа для организации, которую мы помогли создать, чтобы сдерживать коммунистическое влияние в регионе. Хотя организация была предназначена для содействия коллективной обороне, но по большей части она так и не вышла за рамки форума для более тесных двусторонних, культурных и военных отношений. С присоединением Иордании к организации региональную критику блока, как имперского проекта, продвигаемого нами и Великобританией, значительно сократится. Это также усилит способность организации справляться с ростом радикальных идеологий в регионе, таких как арабский национализм."
 CENTO_PROPOSAL.10.d: "Соединенные Штаты официально присоединились к Организации Центрального договора (CENTO) перестав быть просто наблюдателем. Это дает организации гораздо больший доступ к западной помощи и снижает нагрузку на Великобританию по удовлетворению потребностей CENTO. Сообщается, страны-члены CENTO в восторге от такого хода событий и с нетерпением ждут встречи с высокопоставленными американскими чиновниками на будущих конференциях. CENTO защитит интересы США в регионе и обеспечит им верных союзников для борьбы с антизападными или дружественными коммунистам режимами. Некоторые страны в регионе осуждают эту акцию, называя ее доказательством того, что CENTO - имперский проект. Присоединение к организации уменьшит необходимость прямой поддержки Израиля для достижения наших целей. Наше членство может помочь превратить организацию в НАТО Ближнего Востока."
 CENTO_PROPOSAL.11.d: "Соединенные Штаты отклонили предложение повысить свой статус с наблюдателя до члена Организации Центрального договора (CENTO). Хотя организация и призвана защищать Ближний Восток от посягательств коммунистов, но она так и не смогла выйти за рамки форума двустороннего, культурного и военного сотрудничества между странами-членами блока. Среди большинства стран Ближнего Востока организация рассматривается как имперский марионеточный проект. Госдепартамент не уверен, что наше членство будет способствовать развитию альянса и опасается, что это еще больше подорвет их легитимность в регионе. Израиль так же испытывает антипатию к нашим потенциальным противникам в регионе и произраильские официальные лица отмечают, что поддержка Израиля будет иметь больший эффект для достижения региональных целей. Вероятно именно по этим причинам США решили воздержаться."
  
 CIA_SYRIA.1.d: "Недавно ЦРУ провело переговоры с бывшим сирийским министром Михаилом Беем Ильяном по вопросу возможного военного антикоммунистического переворота в стране. Он уверил нас, что военные силы могут установить контроль над Дамаском, Алеппо, Хомсом и Хамой, а также над всеми крупными международными пограничными пунктами. Как только радиостанции объявят о новом правительстве под руководством полковника Каббани, ведущие антикоммунистические политики будут приглашены на службу новому правительству. Заговорщикам понадобятся деньги от ЦРУ, чтобы рассчитаться с замешанными в перевороте офицерами и обеспечить окончательный успех операции. ЦРУ поддержали этот план, назвав его операцией «Straggle». Они считают, что антикоммунистическая Сирия усилит сопротивление экспансии Советов в регионе. Однако наши дипломатические советники с осторожностью отнеслись к этому плану, полагая, что операция может провалиться и усилить напряженность и нестабильность в Дамаске, чем обязательно воспользуются коммунисты."
 CIA_SYRIA.2.d: "Агенты ЦРУ в Дамаске работали, не покладая рук, чтобы обеспечить крепкую опору для операции «Straggle». На поддержку «Straggle» были потрачены сотни тысяч долларов. Госдепартамент готов сделать заявления и провести дипломатические маневры для защиты и поддержки сил, готовящихся провести захват власти в стране. Однако напряженность отношений с Израилем в регионе вынудила бывшего сирийского министра Михаила Бея Ильяна отложить план на пять дней. ЦРУ призывает Ильяна больше не откладывать операцию, поскольку момент может быть упущен. Вашингтон находится в нервном ожидании запланированного переворота."
 CIA_SYRIA.3.d: "Из Дамаска поступают отрывочные сообщения, Боевые группы сирийской армии были замечены в передвижениях по городу и занятию ключевых зданий и государственной радиостанции. Аналогичные сообщения поступают и из Алеппо. Туристы, пытающиеся въехать в Сирию или покинуть Сирию через иорданскую или ливанскую границу, вынуждены разворачиваться, поскольку военные, похоже, закрыли границы. Радиопередачи объявляют о формировании нового правительства под руководством полковника Каббани, что указывает успешное осуществление плана. В течении ближайших нескольких часов будет установлено, завершится ли полным успехом операция «Straggle»."
 CIA_SYRIA.4.d: "Сирийское правительство объявило о раскрытии разведкой страны плана государственного переворота, спонсируемого США. Сирия опубликовала фотографии арестованных заговорщиков и показала в СМИ горы денег, захваченных в ходе контроперации, которые, как утверждается, были доставлены агентами ЦРУ. Сирийцы заявили, что офицеры, которые нанесли поражение силам заговорщиков и остановили попытку Америки лишить сирийский народ его независимости, настоящие патриоты и герои. Соединенные Штаты отрицают причастность к заговору. По всей видимости, переворот предполагал свержение правительства сирийскими вооруженными силами и установление нового режима под руководством полковника Каббани, который находится среди задержанных предателей."
 CIA_SYRIA.5.d: "Новый режим полковника Каббани уже получил поддержку и признание международного сообщества. Значительную роль в достижении этого сыграли США,  быстро признавшие его правительство и подтолкнувшие своих союзников к таким же действиям. Американское посольство также проявляет активность: ходят слухи, что старшему офицерскому составу заносят чемоданы с наличными, чтобы они не бросали вызов новому режиму. Недавнее объявление о новом кабинете, состоящем из антикоммунистических политиков, лишь убедила многих сирийцев в истинной сути происходящего. Этот переворот - операция, спонсируемая ЦРУ. Новому режиму придется действовать быстро, чтобы получить поддержку среди населения, поскольку большинство сирийцев относятся к новой власти с искренним презрением."
 CIA_SYRIA.6.d: "Информация, полученная на допросах, проведенными нашей разведкой, подтверждают причастность Америки к недавно раскрытому заговору и неудавшемуся перевороту. Высокопоставленные американские агенты спланировали операцию и принесли прямо в наши руки огромные суммы денег. Американская поддержка была основана почти исключительно на вере в то, что новый режим возьмет твердый антикоммунистический курс. Прискорбно видеть, как далеко зашли Соединенные Штаты в своих заговорах, но, к счастью, их союзники оказались бесхребетными трусами и недооценили наших собственных агентов. Мы будем распространять слухи об американском заговоре и сирийский народ сплотится за нами, как за истинными защитниками сирийского народа."
 CIA_SYRIA.7.d: "Провал операции «Straggle» выявляет фундаментальные проблемы в организационных приготовлениях разведки США в Сирии. ЦРУ признает, что оно переоценило надежность своих сирийских контактов и их возможности. Структура сирийской разведки невероятно крепка и ее сложно перехитрить. Кроме того, сирийский национализм - очень мощная сила и ЦРУ возлагала слишком серьезные надежды на то, что деньги смогу победить лояльность сирийских офицеров. И они ошиблись, поскольку когда офицеры поняли, откуда пришли деньги, они смогли быстро разоблачить заговор. Невероятно, но некоторые офицеры, которых мы подкупили, пришли к действующему правительству, признались в участии в заговоре и сдали деньги. Разоблачение нашей причастности также сильно ослабляет престиж США в Сирии, а дальнейшее участие только подстрекает сирийскую враждебность в отношении Запада. Мы должны сосредоточить наши усилия на открытой дипломатии и взаимодействии с друзьями в Сирии, а не на скрытых операциях. В противном случае мы рискуем потерпеть новые неудачи в регионе. Куда более значительные, нежели операция «Straggle»."
 CIA_SYRIA.99.d: "ЦРУ использовало свои контакты со средствами массовой информации по всему миру и политическими союзниками для публикации статей, в которых подчеркивается, насколько нестабильно сирийское правительство. В этих сообщениях отмечается, что сирийское правительство по-прежнему придерживается курса войны с Израилем и занимается созданием новых вооружений, обделяя вниманием развитие экономики на благо своего народа. Что еще более важно, Конгресс был проинформирован об отчетах разведки, указывающих на рост коммунистического влияния в Дамаске. Эти сообщения предполагают, что либо в ближайшем будущем в стране произойдет коммунистический переворот, либо нестабильный сирийский режим может обратиться к Советскому Союзу, открыв доступ своих территорий для коммунистических военных баз и войск в обмен на поставки оружия. Общественность все чаще рассматривает Сирию, как бомбу замедленного действия, готовую разрушить любое подобие региональной или даже глобальной стабильности."
 CIA_SYRIA.100.d: "Американское правительство пригласило нас присоединиться к их международной коалиции против сирийского правительства. Американцы заявляют, что сирийское правительство нестабильно и настроено на экспансионизм. Будь то за счет своих внутренних врагов или же их арабских соседей. Кроме того, сирийцы продолжают предъявлять территориальные претензии почти ко всем своим соседям. Соединенные Штаты хотели бы, чтобы мы помогли им положить конец сирийскому режиму, восстановить мир в регионе и положить конец недавней истории неудавшегося военного переворота в стране. Наши советники считают, что наше участие в этой авантюре может открыть новые возможности для американцев. Однако ряд официальных лиц предостерегает нас от поспешного решения, поскольку присоединение к антисирийской коалиции может столкнуться с непониманием нашего народа, который, вероятно, будет рассматривать войну, как очередную американскую авантюру."
 CIA_SYRIA.101.d: "Соединенные Штаты объявили, что их коалиция начала военные действия против Сирии. Американцы настаивают на том, что сирийское правительство нестабильно и представляет опасность для собственного народа и всех своих соседей. Разоружение режима и установление мирного правительства для всех сирийцев - единственный способ предотвратить возникновение катастрофического регионального кризиса. Соединенные Штаты обещают быструю коалиционную кампанию, но сирийское правительство остается непреклонным и призывает всех сирийцев объединиться для противостояния иностранным захватчикам."
 CIA_SYRIA.25.d: "Соединенные Штаты призвали международное сообщество оказать усилия по оказанию гуманитарной помощи Турции. Недавние волнения на севере Сирии привели к тому, что большое количество беженцев пересекли границу с Турцией. Турецкое правительство назвало ситуацию на своей границе гуманитарной катастрофой. Турецкие войска дислоцируются в регионе, чтобы контролировать поток беженцев и поддержать строительство для них временного лагеря. Американское правительство также подвергло резкой критике сирийское правительство за его деспотичный подход к собственному населению."
 Syria_CIA.27.d: "Госсекретарь заявила, что Соединенные Штаты признали недавнюю аннексию северной Сирии Турцией. Госсекретарь отметила, что Турция была вынуждена действовать только после того, как сирийское правительство обострило ситуацию жестокими репрессиями против мирных жителей в этом районе. Соединенные Штаты считают, что прибытие турецких войск остановит насилие и предотвратит дальнейшее ухудшение ситуации. Сирийское правительство осудило Соединенные Штаты за подрыв их суверенитета и открытую поддержку разделения сирийской нации. Сирия призывает всех арабов объединиться и освободить арабские земли, захваченные турками."
 Syria_CIA.26.d: "Турция недавно спросила, как мы отреагируем, если они вмешаются в дела Сирии. Турецкое правительство отметило, что гуманитарная ситуация на севере Сирии стремительно ухудшается, что вызвало кризис беженцев и привело к вооруженным столкновениям прямо на их границе. Турецкие военные считают, что они могут вмешаться и быстро положить конец жестокой сирийской антинародной кампании на севере. Американский президент в ответ одобрил Турецкий план. Соединенные Штаты считают поведение сирийских властей неприемлемым. Американское правительство предоставит Турции всю возможную дипломатическую и разведывательную поддержку для ее операции на севере Сирии."
 CIA_SYRIA.50.d: "Соединенные Штаты направили несколько послов, чтобы в частном порядке поинтересоваться нашими интересами в Сирии и согласовать идею плана, который они разработали. Американцы считают, что население на севере Сирии недовольно политикой Дамаска и их агенты успешно смогут спровоцировать народное восстание. В хаосе погромов американцы просят нас вмешаться и оккупировать север Сирии при полной поддержке международного сообщества во главе с Соединенными Штатами Америки. При поддержке США такой заговор позволит получить нам контроль над стратегически важной территорией и значительными ресурсами. Однако любая военная операция сопряжена с непредвиденными рисками и мы рискуем столкнуться с ожесточенным сирийским сопротивлением или даже более широкой негативной реакцией арабского мира, если мы будем придерживаться американского плана. Мы должны принять решение о том, поддержать ли план вторжения в северную Сирию или отказаться."
 CIA_SYRIA.51.d: "Турция дала понять, что готова работать с Соединенными Штатами над планом борьбы с сирийским режимом. Они пообещали развернуть свои силы и помочь обосновать необходимость турецкого вмешательства после начала восстания на севере Сирии. Турция пообещала поделиться своими разведданными и активами в регионе, чтобы поддержать наши усилия. Это настоящая дипломатическая победа! Как только Турция захватит северные территории Сирии, от неё останутся лишь осколки не представляющие никакой угрозы для региона."
 CIA_SYRIA.52.d: "Турецкое правительство отказалось поддержать планы США спровоцировать народное восстание на севере Сирии с целью установления контроля над этой территорией Турцией. Турки считают, что этот план нереалистичен и ослабит региональные позиции Турции, а так же рискует затянуться в большую кровопролитную войну. Это серьезная неудача для американских планов ослабить Сирию и устранить их, как региональную угрозу. Турецкое правительство также отметило, что несмотря на отказ поддержки плана, оно все же надеется сохранить дружеские отношения с США."
 CIA_SYRIA.53.d: "Соединенные Штаты направили сотрудников разведки, чтобы в частном порядке представить нашему правительству заманчивое предложение. Они считают, что сирийское государство представляют опасность для региональной безопасности и американских интересов и предлагают нам начать вторжение в Сирию и восстановить власть Хашимитов в этом стране. Для поддержки этого плана они обеспечат обширное дипломатическое прикрытие и предоставят современное вооружение нашим силам. Их спецслужбы также помогут найти предлог для укрепления нашей власти в Ираке. План привлекателен тем, что он исправит ошибки, нанесенные покойным королем Фейсалом и прочно укрепит наше место в регионе. Однако многие советники опасаются, что такое вмешательство может вызвать недовольство иракских и арабских националистов в армии. Мы должны решить, какой путь нам выбрать."
 CIA_SYRIA.54.d: "Правительство Ирака согласилось поддержать наши планы свержения сирийского правительства. Иракское правительство и спецслужбы будут сотрудничать с нашими, чтобы облегчить перевооружение их армии и создать предлог для иракского наступления на Сирию. Иракцев очень привлекает идея расширения Хашимитского правления в Сирии и сдерживания распространения арабских националистических идей. Они непреклонны и хотят, чтобы предлог был неоспоримым, дабы усилить позиции правительства, когда оно решит вмешаться. Мы также высоко ценим нашу дипломатическую и тайную поддержку и надеемся, что этот план положит конец сирийской угрозе раз и навсегда."
 CIA_SYRIA.55.d: "Правительство Ирака отказалось поддержать наш план свержения сирийского правительства. Иракцы считают, что эта схема нереалистична и ее потенциальные выгоды не перевешивают потенциальных негативных последствий. Иракцы опасаются затяжного конфликта с другим арабским государством. Однако больше всего их беспокоит то, что даже при наличии веского предлога арабские националисты в Ираке и военные могут вместо этого использовать конфликт для захвата власти у монархистов. Решение Ирака является серьезным препятствием для американских усилий по урегулированию ситуации в Сирии и тех рисков, которые оно несет для региона."
 CIA_SYRIA.10.d: "ЦРУ установило контакт с высокопоставленными сирийскими генералами правого крыла под руководством генерала Адиба Шишакли. Он давно дружит с Западом и обещает придерживаться этого курса, а так же подавлять влияние сирийских коммунистов. Наши сирийские друзья считают, что переворот возможен, но на это придется потратиться. Сирийское командование, войска и официальные лица придется подкупать, чтобы обеспечить поддержку предлагаемого переворота. ЦРУ уверено, что план сработает, поскольку генерал Шишакли имеет национальное признание и опыт переговоров на самом высоком уровне. Предлагаемая операция получила название «Wappen»."
 CIA_SYRIA.11.d: "ЦРУ представило окончательный план операции «Wappen». Сирийские генералы запросили гораздо больше денег, чем было согласовано изначально. Белый дом обеспокоен тем, что вбрасывание такого количества денег в Дамаск может раскрыть план и намекает, что это может быть просто попыткой вымогательства. Еще большее беспокойство вызывает то, что эта сирийская спецоперация призвана раскрыть нашу причастность к ней и нанести ущерб нашей репутации в регионе. ЦРУ настоятельно рекомендует, чтобы мы выполнили требования, но госсекретарь считает, что они страдают от туннельного видения ситуации и отчаяния, пытаясь спланировать смену режима. Мы должны решить, как нам действовать. Согласиться на их требования, остаться верными первоначальному плану или же сократить наши расходы и не рисковать."
 Passage_to_Freedom.0.d: "ВМС США объявили о начале операции «Passage to Freedom». Американские войска помогут французской армии и французскому флоту эвакуировать профранцузских и антикоммунистических вьетнамских активистов, попавших в ловушку коммунистического Северного Вьетнама, в безопасную зону демократического Южного Вьетнама. В частности, кампания сосредоточена на эвакуации католиков из Северного Вьетнама, которые сталкиваются с угрозой атеистического режима и враждебной пропагандой того, что они являются профранцузской пятой колонной. ЦРУ тайно работает с правительством Южного Вьетнама над производством и распространением листовок в Северном Вьетнаме, призывающих католиков и других людей бежать от коммунистического режима. Нынешнее правительство Южного Вьетнама отчаянно хочет привлечь больше католиков, чтобы поддержать правительство, в значительной степени зависящее от католических чиновников. Северный Вьетнам осудил враждебную пропаганду, хотя есть сообщения о перекрытиях речного движения, дорог и деревень для того, чтобы заблокировать поток беженцев."
 CIA_SYRIA.12.d: "ЦРУ провело успешную раздачу взяток ключевым сирийским генералам и, похоже, операция «Wappen» готова к запуску. Сообщается, что лидер переворота генерал Шишакли организовывает правые политические партии, чтобы подготовить их к началу переворота. Как только генералы захватят власть и произведут чистку от левых офицеров, новому правительству потребуется поддержка правых партий для успешного управления. ЦРУ выразило уверенность в Белом доме, что операция состоится в ближайшее время. Они также отметили, что успешная кампания по даче взяток показала, что американская экономическая мощь может быть эффективно использована для достижения целей разведки, когда ситуация складывалась в наших интересах."
 CIA_SYRIA.13.d: "ЦРУ потерпело серьезную неудачу после сообщений из Дамаска о том, что несколько сирийских генералов сдали взятки, которые, по их утверждениям, были даны Соединенными Штатами для организации государственного переворота. Сирийские силы окружили наше посольство и задержали офицера ЦРУ, организовавшего заговор на месте. Генералы заявили, что их патриотизм и лояльность к Сирии подтолкнули их сообщить об инциденте и вернуть деньги. Операция Wappen была разоблачена вместе с участием ЦРУ. Другие сирийские генералы и политические лидеры либо бежали за границу, либо были задержаны сирийской разведкой. Похоже, наши предложения взятки были недостаточно высоки для нескольких генералов, которые предпочли разоблачить заговор, чем рискнуть неудачным переворотом. Говорят, что Белый дом в ярости, в то время как Госдепартамент предполагает, что сирийская разведка знала все время и нанесла удар только сейчас, чтобы максимально затруднить положение Соединенных Штатов."
 CIA_SYRIA.14.d: "Ночью сирийские танки и войска ворвались в Дамаск, захватив радиостанцию вместе с ключевыми правительственными зданиями. Подобные сцены произошли в Алеппо и нескольких других крупных сирийских городах. На следующее утро государственное радио передало, что совет генералов захватил власть и сверг правительство за его коррумпированность и предательство сирийского народа. К вечеру, изгнанный ранее, генерал Шишакли прибыл на самолете, чтобы взять под контроль военную хунту и новое правительство. Новый сирийский лидер обратился к населению и призвал к национальному единству и изгнанию из страны опасных чужеродных идеологий, таких как коммунизм. Соединенные Штаты и Великобритания незамедлительно приветствовали новое правительство, в то время как арабские националисты в других частях региона начали организацию протестов."
 Syria_CIA.10.d: "США объявили, что начинают военные действия против сирийского правительства. В последние недели ЦРУ использовало свои контакты в СМИ для публикации сообщений о массовых поставках советского оружия для Сирии. Они также опубликовали статьи, описывающие сирийское правительство как советского клиента, разжигающего беспорядки в регионе и жестоко подавляющего народ. Это вызвало общественный резонанс и требование принять меры по прекращению сирийской агрессии в регионе. Президент заявил, что американские вооруженные силы будут действовать решительно для освобождения сирийского народа."
 CIA_SYRIA.59.d: "Турецкие войска перешли границу на севере Сирии. Правительство Турции утверждает, что недавняя эскалация насилия и растущий кризис беженцев вынудили их действовать. Сирийское правительство обвиняется в применении чрезмерного насилия против повстанцев в северных регионах. Сирийское правительство осудило турецкую интервенцию и пообещало дать решительный бой любой армии, которые решат вторгнуться на её территории. Соединенные Штаты заявили о своей поддержке Турции, назвав это гуманитарной акцией, призванной остановить беспорядки в регионе."
 CIA_SYRIA.60.d: "Турецкое правительство объявило, что оно организовало безопасную зону под прямым управлением Турции на севере Сирии. Это последовало за их вмешательством в регион с целью изгнать сирийские правительственные силы, которые обвинялись в нарушении прав человека в отношении населения на севере Сирии. Сирийское правительство поспешило осудить эту очевидную аннексию своей территории и призвало арабский мир поддержать Сирию и оказать сопротивление интервентам. Соединенные Штаты поддерживают решение Турции, отмечая стабилизирующее присутствие Турции в регионе."
 CIA_SYRIA.61.d: "Тысячи сирийцев вышли на улицы Дамаска, чтобы отпраздновать недавнюю победу их войск над Турцией. Турецкие военные недавно попытались вмешаться на севере Сирии, чтобы помешать сирийским правительственным силам подавить повстанцев в этом регионе. Однако вскоре турецкие силы были остановлены сирийскими военными, которые начали успешную контратаку. Согласно сообщениям, сирийские военные контролируют Хатай, исторически спорную территорию. Сирийское правительство опубликовало заявление, в котором говорится, что оно освободило последние арабские города от турецкого ига. Многие наблюдатели полагают, что Соединенные Штаты, вероятно, будут смущены неудачей своего союзника - Турции, и им, возможно, придется пересмотреть свои планы на Сирию."
 CIA_SYRIA.56.d: "В сообщениях указывается, что иракские войска перешли в массированное наступление на силы сирийского режима. Подробности поступают отрывочно, но похоже, что Хашимитская династия Ирака решила вмешаться, чтобы восстановить сирийскую монархию и вернуть трон своей семье. Правительство Ирака заявило, что оно было вынуждено действовать, чтобы спасти сирийский народ от угнетения и коррумпированности властей. Сирийское правительство осудило интервенцию Ирака, назвав его колониальным вторжением предателей арабского мира. Сообщается, что сирийские военные быстро развертываются, чтобы противостоять угрозе. Соединенные Штаты обвиняют Сирию в том, что они побуждают иракское правительство действовать ещё более решительно."
 CIA_SYRIA.57.d: "Победоносные иракские войска, повторив парад победы короля Фейсала 1918 года, прошли через Дамаск. Правительство Ирака заявило, что оно успешно победило коррумпированный и незаконный режим и восстановит законную королевскую власть для сирийского народа. Сирийские правительственные силы не смогли остановить иракское вмешательство, которое широко осуждается арабскими националистами во всем регионе. Сообщается, что Соединенные Штаты очень довольны сменой режима в Дамаске и поздравили правительство Ирака."
 CIA_SYRIA.58.d: "Захваченные иракские автомобили и грузовики с трофейным оружием и уничтоженной техникой прошли через Дамаск. Сирийское правительство хвасталось трофеями своего успешного контрнаступления на вторгнувшиеся иракские войска. Иракские военные недавно начали интервенцию в Сирию, чтобы восстановить хашимитскую монархию, но их усилия закончились неудачей. Иракское правительство хранит молчание о том, что произошло, хотя сообщения ясно указывают на победу Сирийского режима. Сирийское правительство выставляет свою победу над западным империализмом, как победу для всего арабского мира. Правительству Ирака необходимо будет оценить, что пошло не так. Сообщается, что Соединенные Штаты сильно разочарованы поражением иракских сил и правительства."
 USA_INDONESIA.5.d: "Ситуация в Индонезии ухудшилась, поскольку многие индонезийцы-патриоты на Суматре продолжают выступать против правительства из-за его коммунистических взглядов. Правительство Сукарно продолжает жесткую политику, включая прекращение поставок предметов первой необходимости тем, кого оно обвиняет в восстании. По совету ЦРУ президент поручил Государственному департаменту и миссии Организации Объединенных Наций начать дипломатическую и общественную кампанию, призывающую к гуманитарному вмешательству в конфликт, чтобы предотвратить массовые человеческие жертвы. ЦРУ считает, что такая миссия может дать нам возможность расширить контакты с антикоммунистами и заложить основу для будущих действий."
 USA_INDONESIA.6.d: "ЦРУ недавно направило затемненные бомбардировщики, пилотируемые бывшими пилотами ВВС, через частную компанию "Civil Air Transport", чтобы поддержать антикоммунистических повстанцев Суматры против правительства Индонезии. Эти пилоты тайно наносили бомбовые удары по позициям Индонезии с аэродромов, контролируемых повстанцами. К сожалению, индонезийцы взяли в прицел бомбардировщик, пилотируемый Алленом Лоуренсом Поупом. Его B-26 после бомбардировки был перехвачен и сбит. Поуп и члены экипажа из повстанцев сумели спастись, но были захвачены индонезийскими войсками. Его поимка подтверждает обвинения правительства в том, что самолеты повстанцев управляются пилотами из США и националистического Китая. Мы отрицаем свою причастность и утверждаем, что Поуп был наемником, но этот инцидент вызывает серьезные трудности для продолжения операции."
 USA_INDONESIA.7.d: "Наша операция в Индонезии закончилась неудачей, антикоммунистические повстанцы Суматры потерпели поражение и Сукарно теперь, похоже, находится в гораздо более сильном положении. Причин этой неудачи много. Например, мы недооценили возможности индонезийских вооруженных сил. Наши усилия по поддержке пропагандистских станций и повстанческой базы были сорваны правительственными атаками. В самих индонезийских вооруженных силах много офицеров-антикоммунистов и наши действия рисковали настроить их против нас. Повстанцы и антикоммунистические фракции были фактически разделены нашими действиями по поддержке повстанцев, что дало коммунистам возможность более тесно сотрудничать с правительством. Мы также не смогли привлечь в операцию другие западные державы и не выделили достаточно сил для обеспечения успеха повстанцев."
 USA_INDONESIA.1.d: "Соединенные Штаты осудили ситуацию с правами человека на Суматре как в ООН, так и в Белом доме. Американское правительство обвиняет правительство Индонезии в применении чрезмерного насилия и голодомора против жителей Суматры. Это знаменует собой интернационализацию недавнего восстания антикоммунистических индонезийских офицеров, захвативших Суматру. Мятежники требуют, чтобы правительство Индонезии ушло в отставку и избавилось от всякого коммунистического влияния в стране. Правительство Индонезии до сих пор сохраняет контроль над большей частью вооруженных сил и их лидер Сукарно отрицает какой-либо союз с коммунистами или нарушения прав человека. Вместо этого он говорит, что повстанцы - это клика недовольных людей, требующих власти, прикрывающихся идеей индонезийской демократии. Действия Соединенных Штатов вызывают серьезную озабоченность со стороны других держав, которые опасаются, что американское вмешательство может привести к эскалации кризиса."
 USA_INDONESIA.8.d: "ВМС США начали крупные военно-морские учения у побережья Индонезии и недалеко от Суматры, где силы повстанцев в настоящее время сражаются с правительственными войсками. Соединенные Штаты недавно начали критиковать правительство Индонезии за его деспотичную тактику борьбы с повстанцами и отказ прислушиваться к их требованиям. Повстанцы требуют, чтобы правительство Индонезии во главе с Сукарно отказалось от власти и запретило коммунистической партии от любого участия в правительстве и политике. Правительство отрицает чрезмерное коммунистическое влияние и обвиняет повстанцев, состоящих из офицеров, в попытке подорвать демократию с целью захвата власти. Размещение американских военно-морских сил и критика Сукарно только ослабят позиции индонезийского правительства и окажут решительную поддержку повстанцам."
 INO_USA_WAR.1.d: "В обращении к нации президент Соединенных Штатов объявил, что американские вооруженные силы немедленно развертываются в Индонезии для защиты повстанцев Суматры. Президент отметил, что правительство Индонезии использовало крайнюю тактику, чтобы положить конец восстанию, напрасно подвергая опасности миллионы жизней мирных жителей. Он также заявил, что правительство Индонезии все больше попадает в рабство иностранного коммунистического влияния и американское вмешательство не только спасет жизни, но и спасет демократию для народа Индонезии. Правительство Индонезии ответило категорично, заявив, что повстанцы Суматры были просто марионеточной силой американского правительства и что все индонезийцы объединятся, чтобы победить заокеанских интервентов."
 INO_USA_WAR.5.d: "США объявили о планах раздела Индонезии. Американское правительство отметило, что нынешнее государство слишком разнообразно и географически рассредоточено, чтобы обеспечить эффективное центральное управление. Такая система делала его уязвимым для локальных восстаний и люди, живущие за пределами главных островов, были склонны игнорировать указания центра. Благодаря разделу все народы на островах получат доступ к лояльному правительству и ни один остров не сможет навязывать свои ценности или убеждения всем остальным просто потому, что они контролируют ключевые государственные аппараты. Решение подвергается критике со стороны индонезийцев-горожан, многие из которых утверждают, что план раздела только спровоцирует новые конфликты между островами. Другие утверждают, что раздел на самом деле всего лишь инструмент, гарантирующий, что Индонезия никогда не реализует свой потенциал, чтобы стать крупным глобальным игроком."
 INO_USA_WAR.4.d: "Благодаря нашему успешному вмешательству в Индонезию, мы можем диктовать свои условия для разрешения конфликта. Один из вариантов - восстановить центральное правительство и передать власть лидеру суматранских повстанцев полковнику Ахмеду Хусейну. Он установит авторитарный режим и изгонит всех коммунистов из страны. По мнению аналитиков, его позиция популярна среди военных. Он мог бы координировать национальную антикоммунистическую программу. Альтернативным решением является разделение Индонезии, поскольку многие аналитики считают, что Индонезия слишком велика и географически разделена, чтобы ею можно было управлять в нынешнем виде. Громоздкий государственный аппарат делает Индонезию особенно уязвимой для коммунистического проникновения. Раздел предотвратит это и заблокирует главный путь коммунистического заражения в регионе."
 INO_USA_WAR.6.d: "При поддержке Америки полковник Ахмед Хусейн укрепил свой контроль над Индонезией. Полковник Хусейн прославился, как один из главных и самых влиятельных офицеров повстанческой армии на Суматре. Он поставил ультиматум индонезийскому правительству о восстановлении правительственных чиновников и новых выборах. Однако правительство отказалось, что привело к вооруженному конфликту. При поддержке Америки повстанцы одержали победу. Ожидается, что он объявит о создании кабинета, состоящего из высших национальных антикоммунистических политических лидеров. Его нынешняя военная хунта состоит из нескольких видных и уважаемых офицеров-антикоммунистов. Обещаются новые выборы, а также запрет коммунистов и других групп, которые рассматриваются как угроза индонезийскому государству и демократии. Сообщается, что ЦРУ и американское посольство играют важную закулисную роль в защите режима Хусейна от контр-переворотов, планируемых более высокопоставленными офицерами."
 INO_CIA_EXPOSURE.0.d: "ЦРУ, используя подставную роту в Таиланде, успешно перебрасывает бомбардировщики и пилотов для поддержки индонезийских повстанцев на Суматре. Наши летчики успешно проводят бомбардировки индонезийских военных объектов и аэродромов. Бомбардировщики передаются пилотам повстанцев с большой осторожностью и ясно, что наша операция не были раскрыта. Нам удалось избежать разоблачения со стороны правительства Индонезии, что позволило нам поддержать повстанцев и публично оставаться нейтральной стороной в конфликте. Это даст нам большую гибкость в оказании давления на Индонезию, чтобы она перестала все больше сближаться с местными коммунистами."
 INO_CIA_EXPOSURE.1.d: "ЦРУ, используя подставную компанию в Таиланде, пыталось тайно предоставить бомбардировщики и пилотов повстанцам на Суматре. Однако правительству Индонезии удалось сбить бомбардировщик и захватить летчика, вытянув правду наружу. Это серьезная проблема для нашего правительства и большая неудача для ЦРУ. Индонезийцы в ярости и в результате пострадает наша репутация в регионе. Потребуется много усилий, чтобы восстановить доверительные отношения с Индонезией. Наряду с правительством Индонезии, Советский Союз и региональные коммунистические партии радостно заявляют о наших проблемах. Директор ЦРУ подвергся жесткой критике со стороны президента."
 INO_CIA_EXPOSURE.2.d: "Правительство Индонезии опубликовало новости о том, что американский бомбардировщик, летевший в поддержку повстанческих сил на Суматре, был сбит во время атаки на правительственный военный аэродром. Американское посольство быстро отказалось от какой-либо причастности, однако индонезийские газеты опубликовали фотографии сбитого самолета и американского пилота, находящегося под стражей. Сбитый американский самолет времен Второй мировой войны имел символы Китайской Республики на недавно нанесенном свежим слоем краски. Правительство Индонезии отметило факт наличия американского пилота, а происхождение самолета указывало на прямую причастность к этому Соединенных Штатов. Американское правительство теперь настаивает, что все американские самолеты или пилоты были наемниками, а не представителями или агентами Соединенных Штатов. Несмотря на их заявления, большинство стран, похоже, встают на сторону Индонезии и призывают Соединенные Штаты прекратить любую помощь, которую они оказывают повстанческим силам."
 Sumatran_Revolt.50.d: "Индонезийские повстанцы на Суматре, в основном военные подразделения, недавно подняли восстание, требуя отставки правительства Сукарно. Повстанцы считают, что коммунистическое влияние в Джакарте растет, а Сукарно попал под их прямое влияние. Усилия Сукарно по разрешению проблем и предотвращению эскалации уже принесли определенный успех. Однако ЦРУ считает, что с их помощью оно может дать больше поддержки повстанцам и превратить восстание в полномасштабную гражданскую войну против сил Сукарно. Это серьезно ослабило бы Сукарно и могло бы гарантировать, что коммунисты не будут манипулировать призедентом на пути к власти."
  
 Sumatran_Revolt.0.d: "Региональные военные командиры на Суматре перестали подчиняться центральному правительству и подняли восстание. Среди населения и некоторых офицеров растет беспокойство по поводу централизации экономического развития на Яве, а не на других островах. Лояльные офицеры зачастую вынуждены покидать посты в результате бескровных переворотов офицерами повстанцев, которые затем создают новое, альтернативное местное правительство. Ходят слухи, что эти офицеры получают доход от контрабанды для накопления средств. Правительство должно придумать правильный, симметричный, ответ, хотя мятежные офицеры заявляют, что они не стремятся создать государство в государстве, а хотят лишь привлечь внимание к недостаткам в управлении государством."
 Sumatran_Revolt.1.d: "Офицеры мятежной армии на Суматре недавно провели конференцию и решили объединиться под руководством подполковника Ахмеда Хусейна. Они назвали себя Революционным правительством Республики Индонезия и предъявили Джакарте ультиматум. Группа считает, что президент Сукарно находится под коммунистическим влиянием и он должен урезать свою власть и отказаться от ряда президентских полномочий. Другие требования призывают к восстановлению демократического правления с антикоммунистическими политическими лидерами во главе. Они дали правительству пять дней, чтобы подчиниться их требованиям."
 Sumatran_Revolt.2.d: "Требования мятежных офицеров на Суматре были приняты президентом Сукарно. Офицеры повстанцев, которые сформировали группу под названием Революционное правительство Республики Индонезия (РПРИ), стремились к восстановлению демократических институтов и устранению коммунистов из центрального правительства. Согласно требованиям повстанцев, президент Сукарно ограничит свои полномочия, которые были согласованы в конституции и позволит Джуанде Картавиджаджа реформировать кабинет министров и получить над ним полную власть до проведения новых выборов. Победа лидера РПРИ, подполковника Ахмеда Хусейна, сделала его национальной знаменитостью и ходят слухи, что он может иметь президентские амбиции во время новых выборов, которые состоятся в ближайшее время. Индонезийские коммунисты с тревогой будут следить за этими событиями."
 Sumatran_Revolt.3.d: "Президент Сукарно отклонил требования восставших военных на Суматре и приказал начать военную мобилизацию. Он также призвал всех лояльных граждан и солдат помочь правительству восстановить порядок на Суматре. Офицеры повстанцев, называющие себя Революционным правительством Республики Индонезия (РПРИ), под руководством подполковника Ахмеда Хусейна ответили своим собственным призывом к патриотически настроенным индонезийцам присоединиться к их восстанию. РПРИ утверждает, что нынешнее правительство авторитарно и чрезмерно терпимо по отношению к коммунистам. РПРИ полагает, что если оно не будет действовать сейчас, то центральное правительство может вскоре стать жертвой коммунистического переворота. Основная часть индонезийских сил кажется лояльной правительству, однако еще неизвестно, изменится ли это после начала боевых действий."
 Sumatran_Revolt.4.d: "Правительство Индонезии заявило, что подавило восстание военных предателей на Суматре. Офицеры повстанцев, которые называли себя Революционным правительством Республики Индонезия (РПРИ), начали восстание из-за опасений коммунистического влияния и отсутствия демократичности в центральном правительстве. Правительство Индонезии успешно собрало свои силы и убедило своих верных офицеров, что повстанцы были больше мотивированы жадностью, нежели идеями патриотизма. Действительно, конфликт показал, что многие индонезийские офицеры являются ярыми антикоммунистами, но они полагали, что офицеры повстанцев преувеличивали коммунистическую угрозу или влияние на президента Сукарно. Индонезийские военные довольно быстро сокрушили повстанческие силы, уход которых к партизанской тактике не смогли остановить правительственные силы. Руководство РПРИ к тому же раскололось и вскоре его командиры начали сдаваться правительственным силам по всем линии фронта."
 Sumatran_Revolt.5.d: "Подполковник Ахмед Хусейн объявил о победе над индонезийским правительством, положив конец конфликту между правительством и повстанческими силами, базирующимися на Суматре. Повстанческая группа, Революционное правительство Республики Индонезия (РПРИ) подняла восстание после того, как правительство отказалось от его требований ограничить коммунистическое влияние и восстановить соблюдение конституционных ограничений власти. Правительство направило свои силы, чтобы победить повстанцев. Однако РПРИ удалось отбить атаки правительства и даже убедить многих офицеров правительственной армии дезертировать. Ахмед Хусейн пообещал восстановить премьер-министра Джуанду Картавиджаджа и его кабинет министров. Вскоре должны состояться выборы. РПРИ гарантирует, что коммунисты не смогут участвовать в них. Ожидается, что Хусейн займет пост президента до начала выборов."
  
