 branch_crypto_desc: "Сбор разведданных и криптология - это краеугольные камни всей системы разведки. Здесь вы осуществляете борьбу с вражескими шифрами и системами защиты."
 upgrade_form_department_desc: "Кибернетическая разведка открывает доступ к широкому кругу возможностей в отношении кибербезопасности. Электронные системы жизненно необходимы для процветания государства и они должны быть защищены."
 crypto_offense_infiltration_desc: "Широкий выбор улучшений и обновлений для предоставления шпионам возможности проникать на объекты либо постепенно внедряться с целью сбора информации."
 crypto_defense_infiltration_desc: "Широкий выбор дорогостоящих систем безопасности, использующихся для предотвращения внедрения на наши защищённые объекты."
 crypto_offense_cyber_desc: "Технологии кибервойн используются для атак на враждебные государства и их электронную инфраструктуру."
 crypto_defense_cyber_desc: "Системы кибербезопасности используются для защиты страны и её электронных активов от вражеских атак."
  
  
  
  
  
