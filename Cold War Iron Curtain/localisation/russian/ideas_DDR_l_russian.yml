l_russian:
 SED_party_strength: "Сила партии SED"
 DDR_idea_first_two_year_plan: "Первый двухлетний план"
 ddr_idea_agrarian_reform: "Аграрная реформа"
 ddr_ida_agrarian_reform_desc: "Мы находимся в середине программы коллективизации фермы."
 idea_peoples_enterprises: "Народные предприятия"
 idea_peoples_enterprises_desc: "Народные предприятия работают для людей ГДР."
 idea_economic_upheaval: "Экономический переворот"
 DDR_idea_first_five_year_plan: "Первая пятилетка"
 DDR_idea_first_five_year_plan_desc: "Наши строгие правила в отношении наших работников, похоже, работают."
 DDR_idea_second_five_year_plan: "Вторая пятилетка"
 DDR_idea_second_five_year_plan_desc: "Мы продолжаем нашу коллективизацию всей промышленности. Некоторые люди, кажется, бегут из-за этих пятилетних планов."
 ddr_idea_expanded_private_agriculture: "Разрешить частное сельское хозяйство"
 ddr_idea_expanded_private_agriculture_desc: "Не все фермы в этом коммунистическом государстве являются коммунистическими."
 ddr_idea_new_economic_system: "Новая экономическая система"
 ddr_idea_new_economic_system_desc: "Мы подтвердили нашу приверженность народу и промышленности, а не военным."
 ddr_idea_industrial_corruption: "Промышленная коррупция"
 ddr_idea_industrial_corruption_desc: "Многие из наших фондов, предназначенных для расширения заводов, пусты. Конечно, ведь совершенно случайно появляются новые машины наших министров."
 ddr_idea_mass_emigration: "Бегство из Республики"
 ddr_idea_mass_emigration_desc: "Многие из наших самых талантливых людей устремляются в Западную Германию. «Утечка мозгов» в разгаре и у нас не хватает квалифицированных работников."
 idea_young_pioneers: "Юные пионеры"
 idea_young_pioneers_desc: "Мы создали социалистическую образовательную программу для детей, очень похожую на ту, которая была в Советском Союзе."
 idea_stasi: "Штази"
 idea_stasi_desc: "Наша тайная полиция делает свою работу, защищая Германию."
 ddr_no_established_army: "Нет официальной армии"
 east_german_influence: "Восточногерманское влияние"
 east_german_influence_desc: "Восточная Германия влияет на нашу политику."
 stasi_operations: "Операции Штази"
 stasi_operations_desc: "Многие из наших людей находятся под влиянием коммунистических восточногерманских агентов. Мы должны найти их."
 idea_revised_history_books: "Пересмотренные книги по истории"
 idea_revised_history_books_desc: "Мы больше не упоминаем о зверствах Второй мировой войны."
 idea_legacy_of_prussia: "Наследие Пруссии"
 idea_legacy_of_prussia_desc: "Наша пропаганда призывает людей в армию."
 ddr_idea_weakened_police_force: "Ослабленные полицейские силы"
 ddr_country_in_chaos: "Страна в хаосе"
 ddr_country_in_chaos_desc: "В нашей стране нет лидера! Нам тоже нужно выяснить наше дальнейшее будущее."
 ddr_idea_lack_of_leadership: "Отсутствие руководства"
 ddr_idea_nazi_industry: "Быстрое строительство"
 ddr_idea_nazi_industry_desc: "Мы улучшаем нашу промышленность до предела, чтобы мы могли строить все необходимые заводы."
 idea_nazi_influence: "Нацистское влияние"
 idea_nazi_influence_desc: "Слухи говорят о старых чиновниках, дружественных к нацистам. Они снова оказываются у власти."
 ddr_idea_weakened_propaganda_machine: "Ослабленная пропагандистский аппарат"
 ddr_idea_weakened_propaganda_machine_desc: "Мы уменьшаем влияние нашей пропаганды."
 ddr_idea_revised_curriculum: "Пересмотренные планы"
 ddr_idea_revised_curriculum_desc: "Мы больше не оказываем чрезмерного уважения социалистическим мыслителям, а вместо этого принимаем во внимание всех философов."
 east_german_democratic_influence: "Восточногерманское влияние"
 Warsaw_Pact_Military_Restrictions: "Военные ограничения Варшавского договора"
 Warsaw_Pact_Military_Restrictions_desc: "Пока мы не станем полноценным коммунистическим государством, у нас не может быть собственных вооруженных сил."
