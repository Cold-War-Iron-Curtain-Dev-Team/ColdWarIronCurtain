  #1960s Focus Tree Ideas 
 Republikflucht: "Бегство из Республики"
 Republikflucht_desc: "Тысячи наших рабочих бегут в Западную Германию каждый месяц. Мы должны остановить это."
 Neues_Okonomisches_System: "Новая экономическая система"
 Neues_Okonomisches_System_desc: "Наша экономика работает смотря на местный спрос. Необходимо её централизировать"
 DDR_Resource_Efficiency: "Удержание ресурсов"
 Resource_Efficiency_TT: "§GЭффективность добычи ресурсов§"
 DDR_Resource_Efficiency_desc: "Меньше материалов тратится впустую, поскольку производство товаром оптимизировано."
 Market_Based_Pricing: "Рыночное ценообразование"
 Market_Based_Pricing_desc: "У нас уникальная социалистическая экономика, которая соответствует нашему скрытому социалистическому рынку."
 prussian_heritage: "Прусское наследие"
 prussian_heritage_desc: "Мы полностью поддерживаем наш уникальный статус владения большей частью немецкой части Пруссии."
 anti_prussia_campaign: "Антипрусская кампания"
 anti_prussia_campaign_desc: "Мы осуждаем наше империалистическому прусское прошлое."
 defensive_posturing: "Оборонительная позиция"
 defensive_posturing_desc: "Мы продолжаем строить планы по защите Восточной Германии."
 Construction_Soldiers: "Солдаты-строители"
 Construction_Soldiers_desc: "Противники войны служат своей стране по-другому."
 Prussian_Legacy: "Прусское наследие"
 Prussian_Legacy_desc: "Мы поддерживаем наше прусское наследие."
 Wehrmacht: "Вермахт"
 Wehrmacht_desc: "Мы возродили Вермахт и его славу."
 Prussian_Identity: "Прусская подлинность"
 Prussian_Identity_desc: "Мы признаем, что являемся преемником прусского государства."
 ESS: "Экономическая система социализма"
 ESS_desc: "Мы пытаемся превзойти Запад в одних областях, пренебрегая другими."
 Central_Planning: "Центральное планирование"
 Central_Planning_desc: "Мы вернулись к использованию централизованного планирования для определения наших решений."
 debt_crisis: "Долговой кризис"
 debt_crisis_desc: "У нас много долгов перед западными капиталистами, но, безусловно, все будет погашено."
