l_english:
 nga.60.tt.1: "Получит §G+$30 млрд§!"
 nga.60.tt.2: "§YНигерийская Федерация§! будет называться §YРеспублика Нигерия§!"
 nga.60.tt.3: "§YОбафеми Аволово§! будет арестован и перестанет быть главны в партии §Gсоциал-демократов§!"
 nga.60.tt.4: "§RЗападный кризис§! будет §Gзаканчиваться§!"
 nga.60.tt.5: "§YВопрос будет вновь рассмотрен, когда гражданская война в Нигерии станет неизбежной§!"
 NGA.60.tt.6: "§YЭтот фокус будет автоматически завершен событием"
 NGA.60.tt.7: "§YМы создадим две танковые дивизии§!"
 NGA.60.tt.8: "§YМы получим несколько голландских фрегатов§!"
 nga.60.tt.9: "§YМы получим голландский эсминец§!"
 NGA.60.tt.10: "§RВысокопоставленные северяне  в нашем правительстве будут убиты§!"
 NGA.60.tt.11: "Ахмаду Белло умер"
 NGA.60.tt.12: "Самуэль Акинтола умер"
 NGA.60.tt.13: "§RПереворот пяти майоров удался§!"
 NGA.60.tt.14: " Абубакар Тафава Балева умер"
 NGA.60.tt.15: "§RАрмейская фракция Джонсона Агуийи-Иронси проведет переговоры с Патриком Чуквумой Нзеогву§!"
 NGA.60.tt.16: "§YС принятием Декрета № 34 федеративное устройство будет упразднено§!"
 NGA.60.tt.17: "§YПарламент будет распущен§!"
 NGA.60.tt.18: "§YСеверяне-заключенные будут освобождены§!"
 NGA.60.tt.19: "§YЗаключенные-северяне останутся в тюрьме§!"
 NGA.60.tt.20: "Мы будем доить запад на §G+10 миллиардов§!"
 NGA.60.tt.21: "§RООН и соседние страны, скорее всего, поддержат Камерун, но США и Великобритания все равно поддержат нас§!"
 NGA.60.tt.22: "§YНигерийская освободительная армия§! будет называться §YНародная Демократическая Республика Нигерия§!"
 NGA.60.tt.23: "§YВсе африканские марксистско-ленинские нации дадут друг другу гарантии§!"
 NGA.60.tt.24: "§YНародная Демократическая Республика Нигерия§! присоединится к §YВаршавскому договору§!"
 NGA.60.tt.25: "Благодаря хитрой дипломатии мы обеспечим себе §G25 миллиардов§! в финансировании развития"
 NGA.60.tt.26: "§RФранция поддержит Мали в военном отношении, как и наши враги Южная Африка, Родезия и Израиль§!"
 NGA.60.tt.27: "§Yпротестантизм§! вырастет до §Y30%§! в юго-восточных штатах"
 NGA.60.tt.28: "§YМы унаследуем генеральный штаб Либерии§!"
 NGA.60.tt.29: "§GОткрывает§! §YСпециальную механику§! для §Yвключения новых наций в федерацию§!"
 NGA.60.tt.30: "§YМы получим более ориентированный на игбо военный персонал§!"
 NGA.60.tt.31: "§YМы наберём две дивизии из дельты Нигера§!"
 NGA.60.tt.32: "§YМы наберём две дивизии из Средней полосы§!"
 NGA.60.tt.33: "§CЭлитные коммандос спецназа из морских пехотинцев Бенджамина «Черного скорпиона» Адекунле§Y проникнут в порт Калабар§!"
 NGA.60.tt.34: "Мы получим §G$500 миллионов§!"
 NGA.60.tt.35: "§YБудет сформирован конгресс по планированию западноафриканской федерации§!"
 NGA.60.tt.36: "Наша нация будет называться §Западноафриканская федерация§!"
 NGA.60.tt.37: "Наша нация будет называться §Западноафриканская Федеративная Республика§!"
 NGA.60.tt.38: "Наша нация будет называться §Демократическая Федеративная Республика Западная Африка§!"
 NGA.60.tt.39: "§YКваме Нкрума§! будет лидером федерации, когда она сформируется"
 NGA.60.tt.40: "§BПредупреждение: несмотря на то, что Биафра получила исправления и некоторые добавления нового контента, а также некоторые незначительные переделки, ее дерево фокусов и его содержимое не из переработанной Нигерии, а из древнего обновления 2018 года.§!"
 NGA.60.tt.41: "§GЭто приблизит нас к их включению в Федерацию§!"
 NGA.60.tt.42: "§YЭтот фокус уберет прежнюю колониальную конституцию§!"
 NGA.60.tt.43: "Мы конфискуем §G$100§! Миллионов"
