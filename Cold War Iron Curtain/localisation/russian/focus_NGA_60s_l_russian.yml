 petition_for_soviet_support: "Петиция о советской поддержке"
 NGA_shell_bp_PDCNL_2: "Shell-BP PDCNL"
 NGA_shell_bp_PDCNL_2_desc: "После того, как в 1958 году в дельте Нигера были обнаружены известные месторождения нефти, Shell-BP создала собственное управление в Нигерии, создав Shell-BP Petroleum Development Company Nigeria Limited (Shell-BP PDCNL). В то время как этнические меньшинства в дельте Нигера считают, что иностранная корпорация несет ответственность за эксплуатацию их народа и земли предков, богатые элиты игбо, хауса и йоруба счастливы получать свою долю прибыли от своих голландских и британских партнеров."
 NGA_kemalist_nigeria: "Кемалистская Нигерия"
 NGA_kemalist_nigeria_desc: "Благодаря нашему дальновидному лидеру §YЧике Оби§!, Нигерия играет уникальную роль на мировой арене как одна из немногих кемалистских наций в мире."
 NGA_anti_igbo_pogroms: "§RПогромы Анти-игбо§!"
 NGA_anti_igbo_pogroms_desc: "Негодование северян против игбо достигло точки кипения после переворота пяти майоров, и теперь, когда они воодушевлены контрпереворотом, они идут дальше. Среди многих общин мигрантов игбо по всей северной Нигерии происходят массовые убийства и уничтожение собственности, мы должны решить эту проблему."
 NGA_nigerian_national_oil_corporation: "Нигерийская национальная нефтяная корпорация"
 NGA_igbo_yoruba_hausa_divide_desc: "В Нигерии, хотя и насчитывается десятки этнических групп, есть три доминирующие группы: игбо, йоруба и хауса-фулани. Игбо, происходящие с юго-востока, являются выдающимися предпринимателями, которые встречаются в общинах мигрантов по всей стране и благодаря своим традициям в меритократических обществах стремятся подняться на вершину через любую систему. Хауса-фулани — самая крупная из трех групп, пришедших с северо-запада. Будучи выходцами из традиционного феодального исламского общества, хауса-фулани больше верят в иерархическую структуру, в которой фермеры и ремесленники чувствуют себя довольными в более низком социально-экономическом положении. Это приводит к главному конфликту культур, поскольку хауса-фулани одержимы игбо, пытаясь вытеснить их на их собственном рабочем месте или в системе образования. Йоруба - это общество, известное своими скульпторами, художниками и музыкантами, которые всегда находятся между напряжением игбо и хауса-фулани."
 NGA_1960_rise_of_the_nigerian_federation: "Подъем Нигерийской Федерации"
 NGA_1960_rise_of_the_nigerian_federation_desc: "Нигерийская федерация теперь является независимым государством, и нам пора встать на путь самоуправления"
 NGA_nationalize_the_nigerian_railway_corporation: "Национализировать Нигерийскую железнодорожную корпорацию"
 NGA_nationalize_the_nigerian_railway_corporation_desc: "Корпорация Нигерийских железных дорог, созданная в колониальную эпоху, до сих пор имеет акционеров, в основном принадлежащих европейским владельцам. Если бы мы национализировали предприятие, это позволило бы нам, как правительству, использовать его более эффективно и давать больше доходов государству."
 NGA_subsidize_the_nigerian_railway_corporation: "Субсидировать Нигерийскую железнодорожную корпорацию"
 NGA_subsidize_the_nigerian_railway_corporation_desc: "Если бы мы субсидировали существовавшую ранее Нигерийскую железнодорожную корпорацию, это, вероятно, было бы более эффективным, чем неэффективная бюрократия правительства, управляющего ею"
 NGA_reform_northern_agriculture: "Реформа северного сельского хозяйства"
 NGA_reform_northern_agriculture_desc: "Северное сельское хозяйство устарело и неэффективно, но может рухнуть в случае засухи. Нам, необходимо реформировать этот сектор, если мы хотим устойчивого снабжения продовольствием северной части страны"
 NGA_prevent_factionalism: "Предотвращение фракционности"
 NGA_prevent_factionalism_desc: "Фракционность слишком большая проблема в их нынешнем правительстве, которое разделено по этническому признаку. На данный момент мы можем договориться о том, чтобы немного снять это напряжение"
 NGA_redifine_zoning_laws_in_kano: "Пересмотреть законы о зонировании в Кано"
 NGA_redifine_zoning_laws_in_kano_desc: "Чтобы привлечь больше инвестиций в город Кано, мы можем изменить законы о зонировании, сделав их более мягкими для иностранных подрядчиков"
 NGA_expand_northern_islamic_schools: "Расширить северные исламские школы"
 NGA_address_ethnic_tension: "Устранить этническую напряженность"
 NGA_address_ethnic_tension_desc: "Хотя на самом деле решение проблемы находится за пределами нашей компетенции для команды, мы можем, по крайней мере, назвать то, что, по нашему мнению, является источником проблем игбо, хауса-фулани и йоруба"
 NGA_the_founding_of_the_republic: "Основание республики"
 NGA_the_founding_of_the_republic_desc: "Нигерийская федерация как концепция является результатом предыдущей колониальной конституции. Теперь, когда мы независимы, пришло время основать официальную Нигерийскую Республику"
 NGA_tame_the_wild_west: "Приручить Дикий Запад"
 NGA_tame_the_wild_west_desc: "Из-за конфликта с участием Инициативной группы йоруба под руководством Обафеми Аволово западный регион погрузился в полный хаос, и нам, безусловно, необходимо решить эту проблему"
 NGA_make_the_west_a_yoruba_issue: "Превратить Запад в проблему йоруба"
 NGA_make_the_west_a_yoruba_issue_desc: "Если жители Запада решат устроить беспорядки и разрушить свои города, пусть делают это. Они будут страдать только от собственного насилия"
 NGA_subsidize_yoruba_farms: "Субсидировать фермы йоруба"
 NGA_subsidize_yoruba_farms_desc: "Субсидирование фермерских хозяйств западного региона, скорее всего, приведет к более быстрому восстановлению"
 NGA_develop_yoruba_plumbing: "Развитие водопроводной системы йоруба"
 NGA_develop_yoruba_plumbing_desc: "Развивая водопроводную систему йоруба, мы можем улучшить санитарию и доступность воды в регионе и, таким образом, успокоить Инициативную группу"
 NGA_sideline_the_issue: "Отодвинуть проблему на второй план"
 NGA_sideline_the_issue_desc: "Западный кризис слишком утомителен для наших политиков, поэтому на данный момент, может быть, лучше всего отодвинуть этот вопрос на второй план"
 NGA_arrest_obafemi_awolowo: "Арестовать Обафеми Аволово"
 NGA_arrest_obafemi_awolowo_desc: "Вождь Обафеми Аволо и его партия «Инициативная группа» явно представляли угрозу стабильности республики, и многие утверждают, что он даже пытается свергнуть правительство. Ему место в камере или даже в могиле."
 NGA_rely_on_samuel_akintola: "Довериться Самуэлю Акинтоле"
 NGA_rely_on_samuel_akintola_desc: "Союзник Ахмеда Белло Самуэль Акинтола явно может справиться с проблемой западного региона. Теперь, когда мы арестовали Обафеми Аволово, мы можем сделать Акинтолу губернатором"
 NGA_the_west_is_tamed: "Запад приручен"
 NGA_the_west_is_tamed_desc: "Благодаря усилиям руководства региона Самуэля Акинтолы мы можем теперь сказать, что хаос западного кризиса закончился"
 NGA_simplify_western_zoning_laws: "Упрощение западных законов о зонировании"
 NGA_simplify_western_zoning_laws_desc: "Упрощая законы о зонировании, мы можем привлечь больше инвестиций в западный регион"
 NGA_send_in_the_federal_government: "Послать в федеральное правительство"
 NGA_send_in_the_federal_government_desc: "Хаос западного кризиса продолжается достаточно долго. Пришло время послать официальное военное присутствие."
 NGA_the_west_is_subdued: "Запад покорен"
 NGA_the_west_is_subdued_desc: "После нашего жесткого военного ответа Запад был подавлен до такой степени, что западный кризис больше не является проблемой"
 NGA_relocate_public_works: "Перенос общественных работ"
 NGA_relocate_public_works_desc: "Отвлекая внимание от общественных работ на западе, мы можем развивать более лояльные регионы"
 NGA_Balewa_diplomacy: "Дипломатия Балева"
 NGA_Balewa_diplomacy_desc: "Абубакар Тафава Балева как лидер планирует выступить с крупной инициативой в области международных отношений, посвятив большую часть своего административного времени внешней политике"
 NGA_the_congo_crisis: "Конголезский кризис"
 NGA_the_congo_crisis_desc: "Кризис в Конго — это катастрофа для африканского континента, и Балева планирует оказать любую возможную помощь конголезскому правительству"
 NGA_send_in_un_peacekeepers: "Отправить миротворцев ООН"
 NGA_send_in_un_peacekeepers_desc: "Во-первых, чтобы помочь с кризисом в Конго, необходимо, чтобы мы отправили нигерийских солдат в качестве миротворцев ООН"
 NGA_ignore_the_crisis: "Игнорировать кризис"
 NGA_ignore_the_crisis_desc: "Конголезский кризис — пустая трата нигерийских ресурсов, давайте сосредоточимся на внутренних делах"
 NGA_negotiate_with_tshome: "Переговоры с Чомбе"
 NGA_negotiate_with_tshome_desc: "Балева считает, что сможет договориться с Чомбе и прийти к мирному решению этого конфликта"
 NGA_address_south_africa: "Послание Южной Африке"
 NGA_address_south_africa_desc: "Как крупная африканская нация, мы обязаны бороться с режимом апартеида."
 NGA_tolerate_south_africa: "Терпеть Южную Африку"
 NGA_tolerate_south_africa_desc: "Оказывать дипломатическое давление на Южную Африку нет необходимости, давайте оставим их в покое"
 NGA_confront_south_africa: "Противостоять Южной Африке"
 NGA_confront_south_africa_desc: "Нам крайне необходимо противостоять Южно-Африканской Республике. Нарушения прав человека в Южной Африке в настоящее время не остановлены, и мы должны оказать давление на их режим, чтобы изменить его характер"
 NGA_boycott_the_fifa_world_cup: "Бойкот чемпионата мира по футболу"
 NGA_boycott_the_fifa_world_cup_desc: "Расистский характер ФИФА проявился, поскольку они неоднократно штрафовали нас за то, что мы не пускаем Южную Африку в Конфедерацию африканского футбола. Поскольку Южной Африке разрешили вернуться на чемпионат мира в 1966 году, мы, как африканцы, не можем этого терпеть"
 NGA_stop_mandelas_execution: "Остановить казнь Манделы"
 NGA_stop_mandelas_execution_desc: "Пока Мандела и его товарищи ожидают суда, нам нужно приложить дипломатические усилия, чтобы это не закончилось казнью"
 NGA_lobby_to_remove_south_africa_from_the_commonwealth: "Лоббирование исключения Южной Африки из Содружества"
 NGA_lobby_to_remove_south_africa_from_the_commonwealth_desc: "Режиму апартея в Южной Африке явно не место в содружестве, лоббирование против их пребывания в содружестве будет нам дипломатически выгодно."
 NGA_integrate_british_cameroon: "Интегрировать Британский Камерун"
 NGA_integrate_british_cameroon_desc: "В соответствии с резолюцией Организации Объединенных Наций, передающей нам контроль над Камеруном, пришло время интегрировать его как официальную часть нашей нации"
 NGA_integrate_the_infrastructure: "Интеграция инфраструктуры"
 NGA_integrate_the_infrastructure_desc: "После политической интеграции южного Камеруна следующим шагом будет соединение его инфраструктуры с нашей"
 NGA_improve_relations_with_the_commonwealth: "Улучшить отношения с Содружеством"
 NGA_improve_relations_with_the_commonwealth_desc: "Поскольку мы хотим оставаться неотъемлемой частью Содружества, нам необходимо установить лучшие дипломатические отношения с другими членами"
 NGA_the_first_nigerian_oil_boom: "Первый нигерийский нефтяной бум"
 NGA_the_first_nigerian_oil_boom_desc: "Опираясь на предыдущие исследования, становится ясно, что Нигерия очень богата нефтью, особенно на юго-востоке. Это десятилетие, несомненно, ознаменуется массовым расширением нефтепереработки в стране"
 NGA_expand_oil_in_biafra: "Расширение нефтяных месторождений в заливе Биафра"
 NGA_expand_oil_in_biafra_desc: "Учитывая богатые запасы нефти в заливе Биафра, это очевидный первый выбор для добычи нефти"
 NGA_expand_oil_in_fields_in_the_south_west: "Расширение нефтяных месторождений на юго-западе"
 NGA_expand_oil_in_fields_in_the_south_west_desc: "Хотя нефть не так богата нефтью, как на юго-востоке, в Юго-Западном регионе все же возможно некоторое расширение запасов нефти"
 NGA_expand_oil_in_fields_in_the_niger_delta: "Расширение нефтяных месторождений в дельте Нигера"
 NGA_expand_oil_in_fields_in_the_niger_delta_desc: "Дельта реки Нигер является одним из самых богатых ресурсами районов страны и подходящим местом для добычи нефти"
 NGA_expand_port_harcourt_facilities: "Расширение возможностей Порт-Харкорта"
 NGA_expand_port_harcourt_facilities_desc: "Район вокруг города Порт-Харкорт является подходящим местом для строительства объектов по сбору масла. Таким образом, мы должны расширить ранее существовавшие в регионе"
 NGA_expand_coal_mining_in_jos: "Расширение добычи угля в Джосе"
 NGA_expand_coal_mining_in_jos_desc: "Высокогорья, окружающие город Джос, являются отличным местом для добычи полезных ископаемых, поскольку они богаты угольными месторождениями"
 NGA_expand_tin_mining_in_sokoto: "Расширение добычи олова в Сокото"
 NGA_expand_tin_mining_in_sokoto_desc: "Равнины, окружающие город Сокото, богаты залежами олова и созрели для сбора урожая"
 NGA_expand_tin_mining_in_jos_highlands: "Расширение добычи олова в горах Джос"
 NGA_expand_tin_mining_in_jos_highlands_desc: "Горная местность Джос содержит большое количество олова и является хорошим кандидатом для добычи полезных ископаемых"
 NGA_build_a_processing_plant_in_kaduna: "Построить перерабатывающий завод в Кадуне"
 NGA_build_a_processing_plant_in_kaduna_desc: "Кадуна — очень хороший кандидат на перерабатывающий завод, мы должны воспользоваться этим"
 NGA_establish_limestone_mines_in_the_north_central: "Создание известняковых рудников в Северо-Центральном районе"
 NGA_establish_limestone_mines_in_the_north_central_desc: "Северо-центральный регион страны является отличным местом для начала добычи известняка"
 NGA_expand_palm_oil_fields_in_zaria: "Расширение месторождений пальмового масла в Зарии"
 NGA_expand_palm_oil_fields_in_zaria_desc: "Пальмовое масло становится все более и более необходимым ингредиентом для продуктов домашнего обихода во всем мире, мы обнаружили, что поля за пределами Зарии являются идеальным местом для начала плантаций"
 NGA_expand_peanut_farms_in_kano: "Расширение арахисовых ферм в Кано"
 NGA_expand_peanut_farms_in_kano_desc: "Выращивание арахиса является жизненно важным элементом экономики на севере, мы должны расширить его в регионе, окружающем Кано"
 NGA_adopt_the_nigerian_naira: "Принять нигерийскую найру"
 NGA_adopt_the_nigerian_naira_desc: "Разработка собственной валюты жизненно важна для нашей независимости и самоуправления. Наши финансовые эксперты уверены, что пришло время принять нигерийскую найру."
 NGA_join_OPEC: "Вступить в ОПЕК"
 NGA_join_OPEC_desc: "Как крупная нефтедобывающая страна, теперь в наших интересах присоединиться к ОПЕК, чтобы иметь возможность заявить о себе на нефтяном рынке, независимом от влияния США и Великобритании."
 NGA_Nigerian_armed_forces: "Нигерийские вооруженные силы"
 NGA_Nigerian_armed_forces_desc: "Поскольку мы теперь независимы, пришло время сформировать наши собственные виды вооруженных сил"
 NGA_the_nigerian_army: "Нигерийская армия"
 NGA_the_nigerian_army_desc: "В качестве основы наших вооруженных сил важно, чтобы мы создали функциональную армию на основе ранее существовавших Королевских пограничных войск Западной Африки"
 NGA_establish_the_nigerian_medical_corps: "Создание Нигерийского медицинского корпуса"
 NGA_establish_the_nigerian_medical_corps_desc: "Создание Медицинского корпуса Нигерии будет способствовать совершенствованию современной армии"
 NGA_begin_military_contracting_in_lagos: "Запустить военные контракты в Лагосе"
 NGA_begin_military_contracting_in_lagos_desc: "Начало серии военных контрактов в Лагосе будет иметь жизненно важное значение для создания современной военной промышленности"
 NGA_purchase_italian_artillery: "Покупка итальянской артиллерии"
 NGA_purchase_italian_artillery_desc: "Закупка итальянской артиллерии для нас подходящий вариант"
 NGA_create_the_first_army_brigade: "Создать первую армейскую бригаду"
 NGA_create_the_first_army_brigade_desc: "Создание нашей первой армейской бригады станет для нас решающим моментом, давайте насладимся им"
 NGA_form_the_nigerian_air_force: "Сформировать ВВС Нигерии"
 NGA_form_the_nigerian_air_force_desc: "Мы достигли точки, в которой наша страна обосновалась после обретения независимости и готова создать подразделение ВВС вооруженных сил"
 NGA_purchase_german_do_17s: "Покупка немецких Do-17"
 NGA_purchase_german_do_17s_desc: "Закупка немецких Do-17 будет способствовать формированию наших собственных ВВС"
 NGA_request_west_german_advisors: "Запрос западногерманских советников"
 NGA_request_west_german_advisors_desc: "Западногерманские ветераны предлагают наблюдать за формированием наших местных военно-воздушных сил."
 NGA_commission_czech_l29_delfin: "Эксплуатация чешских L-29 Delfin"
 NGA_commission_czech_l29_delfin_desc: "Ввод в эксплуатацию чешских L-29 в качестве легких самолетов является практичным выбором для наших молодых ВВС"
 NGA_import_russian_planes: "Импорт русских самолетов"
 NGA_import_russian_planes_desc: "Благодаря советской политике предоставления оружия дружественным странам мы можем получить крупную партию русских самолетов"
 NGA_the_nigerian_navy: "Нигерийский флот"
 NGA_the_nigerian_navy_desc: "Нации с большим побережьем необходимо создать надлежащий военно-морской флот, который мы могли бы использовать для защиты нашей добычи нефти на юго-востоке и борьбы с пиратством"
 NGA_import_dutch_patrol_boats: "Импортные голландские патрульные катера"
 NGA_import_dutch_patrol_boats_desc: "Нидерланды готовы продать нам различные патрульные катера военного назначения, мы должны принять это предложение"
 NGA_the_nigerian_marines: "Нигерийские морские пехотинцы"
 NGA_the_nigerian_marines_desc: "Организация дивизии морской пехоты нашего флота будет играть важную роль в войне"
 NGA_import_a_dutch_destryer: "Импорт голландских эсминцов"
 NGA_import_a_dutch_destryer_desc: "Импортируя голландские эсминцы, мы можем содержать что-то вроде флотилии на голубых водах"
 NGA_develop_indigenous_landing_craft: "Разработка местных десантных кораблей"
 NGA_develop_indigenous_landing_craft_desc: "Чтобы полностью использовать наши подразделения морской пехоты, нам потребуются десантные корабли местного производства"
 NGA_the_coup_of_the_five_majors: "Переворот пяти майоров"
 NGA_the_coup_of_the_five_majors_desc: "После переворота, совершенного различными младшими офицерами, в том числе майором Чукумой Кадуной Нзеогву и майором Эммануэлем Ифеаюной, у нас появилась возможность жестоко убить северян, что снизило возможности игбо в этой стране"
 NGA_transfer_all_power_to_the_armed_forces: "Передача всей власти Вооруженным Силам"
 NGA_transfer_all_power_to_the_armed_forces_desc: "С убийством главных политических деятелей нашей страны теперь можно быть уверенным, что власть де-факто переходит к хунте"
 NGA_declare_martial_law: "Объявить военное положение"
 NGA_declare_martial_law_desc: "Для безопасной передачи власти крайне важно объявить военное положение по всей стране"
 NGA_creation_of_the_supreme_military_council: "Создание Высшего военного совета"
 NGA_creation_of_the_supreme_military_council_desc: "Эти беззаконные офицеры должны быть усмирены, пришло время для лидера вооруженных сил Джонсона Агийи-Иронси подавить это прославленное восстание"
 NGA_tolerate_northern_officers: "Терпеть северных офицеров"
 NGA_tolerate_northern_officers_desc: "В то время как офицеры, контролирующие нацию, в основном являются игбо, важно удерживать офицеров-северян на своих должностях, чтобы не оттолкнуть хауса-фулани."
 NGA_decree_no_34: "Указ № 34"
 NGA_decree_no_34_desc: "Джонсон Агийи-Иронси планирует издать указ № 34, который упразднит федеративную структуру и создаст унитарное государство. Хотя это укрепляет все теории заговора о том, что первоначальный переворот был организован под ложным флагом, чтобы оправдать приход к власти игбо Агуйи-Иронси, он пытается восстановить общественную поддержку, обеспечив свободу прессы."
 NGA_dissolve_parliament: "Распустить парламент"
 NGA_dissolve_parliament_desc: "Высший военный совет в попытке полностью упразднить гражданское правительство делает следующий шаг в виде полного роспуска парламента"
 NGA_status_of_northern_prisons: "Статус северных заключенных"
 NGA_status_of_northern_prisons_desc: "Во время первого переворота пяти майоров многие северные офицеры, верные предыдущему правительству, были заключены в тюрьмы. Хотя Джонсон Агийи-Иронси заинтересован в том, чтобы освободить их, чтобы получить поддержку с севера, его близкие обеспокоены тем, что это может привести к контрперевороту"
 NGA_the_northern_counter_coup: "Северный контрпереворот"
 NGA_the_northern_counter_coup_desc: "С тех пор, как Агуйи-Иронси вел переговоры о сдаче Нзеогву после переворота пяти майоров, будь то из-за искренних подозрений или предубеждений против игбо, северяне давно подозревали заговор с участием ложного флага, оправдывающего захват власти Агуйи-Иронси. Это, наряду с желанием северян сохранить контроль над страной, спровоцировало заговор Мурталы Мухаммада и других видных северных офицеров с целью государственного переворота"
 NGA_johnson_aguiyi_ironsi_holds_on_to_power: "Джонсон Агийи-Иронси удерживает Власть"
 NGA_johnson_aguiyi_ironsi_holds_on_to_power_desc: "Несмотря на попытку государственного переворота, Джонсон Агийи-Иронси был проинформирован заранее, что позволило избежать его похищения. Поскольку большинство заговорщиков оказались в заключении, переворот был быстро остановлен благодаря обеспечению безопасности тюрьмы, в которой они находились"
 NGA_maintain_the_supreme_military_council: "Сохранение Высшего военного совета"
 NGA_maintain_the_supreme_military_council_desc: "Нация еще не готова к гражданскому правлению. Скорее, им должен руководить Джонсон Агийи-Иронси, поскольку он защищает страну для народа игбо"
 NGA_create_a_unitary_country: "Создать унитарное государство"
 NGA_create_a_unitary_country_desc: "Расширяя указ 34, Джонсон Агуйи-Иронси полностью централизует государство в унитарную страну в соответствии с одним правовым кодексом и законодательным органом"
 NGA_british_advisors: "Британские советники"
 NGA_british_advisors_desc: "Имея хорошие отношения с Соединенным Королевством и прецедент, когда наша военная структура в основном обучалась в британских академиях, мы будем продолжать полагаться на британских советников для расширения нашей военной структуры"
 NGA_militarize_the_cameroon_border: "Милитаризовать границу с камеруном"
 NGA_militarize_the_cameroon_border_desc: "Готовясь к нападению Камеруна или нашей необходимости освободить Амбазонию, мы установим оборону на границе с этой страной"
 NGA_weaken_labor_unions: "Ослабить влияние профсоюзов"
 NGA_weaken_labor_unions_desc: "Профсоюзы исторически всегда были чем-то, что сдерживает прогресс и является опорой для коммунистов и социалистов. Нам нужно будет привязать эти группы..."
 NGA_exploit_foreign_aid: "Эксплуатация иностранной помощи"
 NGA_exploit_foreign_aid_desc: "Запад, будучи нашим другом, также может быть использован для предоставления нам необходимого стимула и финансирования развития"
 NGA_push_the_envelope_in_western_cameroon: "Освободить Амбазонию"
 NGA_push_the_envelope_in_western_cameroon_desc: "Южная часть того, что ранее было Британским Камеруном, говорит по-английски и называется там Амбазонией. Когда в регион пришла независимость, люди изначально хотели быть частью Нигерии или независимой нацией, но вместо этого стали частью Камеруна, где они до сих пор борются за свое существование. Мы должны освободить этих угнетенных людей"
 NGA_build_a_military_complex_the_niger_delta: "Построить военный комплекс в дельте Нигера"
 NGA_build_a_military_complex_the_niger_delta_desc: "Дельта Нигера, являющаяся основной частью нашей страны, является подходящим местом для военного комплекса, наряду со многими другими промышленными центрами региона"
 NGA_build_a_military_complex_in_biafra: "Построить военный комплекс в Энугу"
 NGA_build_a_military_complex_in_biafra_desc: "Район, окружающий Порт-Харкорт, уже имеет подходящую инфраструктуру индустриального парка для размещения там военного комплекса"
 NGA_move_capital_to_port_harcourt: "Перенести столицу в Порт-Харкорт"
 NGA_move_capital_to_port_harcourt_desc: "Учитывая историю Лагоса как колониальной столицы и непрактичную географию его нахождения на окраине нашей страны, пришло время установить более разумное место для размещения нашего правительства"
 NGA_liberalize_the_economy: "Либерализация экономики"
 NGA_liberalize_the_economy_desc: "Экономическая либерализация поможет нам создать самодостаточную нацию"
 NGA_subsidize_biafran_companies: "Субсидировать юго-восточные компании"
 NGA_subsidize_biafran_companies_desc: "Учитывая экономический бум, который уже наблюдается на юго-востоке, нам необходимо инвестировать в регион, чтобы обеспечить продолжение этого роста"
 NGA_allow_igbo_militias: "Разрешить ополчение игбо"
 NGA_allow_igbo_militias_desc: "Жители Игболанда должны защищать друг друга, учитывая открытое антиигбо-настроения в стране"
 NGA_build_southern_railroad_infrastructure: "Создание инфраструктуры Южной железной дороги"
 NGA_build_southern_railroad_infrastructure_desc: "Чтобы модернизировать нашу страну и обеспечить транспорт для людей, мы построим соединительную железнодорожную систему на юге страны"
 NGA_found_the_port_of_harcourt_university: "Основать Университет Порт-Харкорта"
 NGA_found_the_port_of_harcourt_university_desc: "Учитывая потребность в высшем образовании в стране, мы создадим университет в новой столице"
 NGA_subsidize_biafran_textile_industries: "Субсидировать текстильную промышленность Энугу"
 NGA_subsidize_biafran_textile_industries_desc: "Текстиль, являющийся одним из основных промышленных товаров Энугу, нуждается в субсидиях для улучшения экономики"
 NGA_establish_a_new_junta: "Установить новую хунту"
 NGA_establish_a_new_junta_desc: "Фаворитист игбо, Агуйи-Иронси, бесполезен для решения проблем нашей страны, связанных с крайним этническим конфликтом. Лучше уж новая хунта возьмет верх..."
 NGA_soviet_aligned_junta: "Хунта союзников Москвы"
 NGA_soviet_aligned_junta_desc: "При поддержке Советского Союза и заговоре с участием нескольких молодых офицеров низшего звена с высшим образованием станет возможным переворот, согласованный с Москвой"
 NGA_ban_sharia_law: "Запрет Шариатских законов"
 NGA_ban_sharia_law_desc: "Законы шариата — это то, что феодальный истеблишмент использует для управления массами севера. Мы должны отменить эту систему, если хотим разрушить власть организованной религии"
 NGA_state_atheism: "Государственный атеизм"
 NGA_state_atheism_desc: "Принуждение государственного атеизма является необходимостью в этой стране, учитывая интенсивный контроль религиозных учреждений над Нигерией"
 NGA_nationalize_cash_crops: "Национализация товарных культур"
 NGA_nationalize_cash_crops_desc: "С национализацией государственных посевов мы отнимем у крепостников-помещиков главный источник прибыли"
 NGA_socialist_lliteracy_campaigns: "Социалистические кампании по ликвидации неграмотности"
 NGA_socialist_lliteracy_campaigns_desc: "Высокий уровень неграмотности в стране, безусловно, потребует радикальной инициативы с участием тысяч студентов университетов"
 NGA_achieve_class_conciousness: "Достичь классового сознания"
 NGA_achieve_class_conciousness_desc: "Благодаря диалектическому пониманию действительности, а также взгляду на мир через марксистскую призму можно подавить этническую напряженность в стране"
 NGA_five_year_plan: "Пятилетний план"
 NGA_five_year_plan_desc: "При движении к независимой индустриализации можно разработать новый пятилетний план развития"
 NGA_socialist_public_works_projects: "Социалистические проекты общественных работ"
 NGA_socialist_public_works_projects_desc: "Благодаря запланированным государством проектам общественных работ мы можем провести капитальный ремонт инфраструктуры, используя навыки рабочих нашей страны"
 NGA_soviet_advised_military_overhaul: "Советский помощь по военному переоснащению"
 NGA_soviet_advised_military_overhaul_desc: "С помощью СССР мы можем капитально перестроить нашу армию за счет масштабного переоснащения наших оружейных заводов"
 NGA_bulwark_against_imperialism: "Оплот против империализма"
 NGA_bulwark_against_imperialism_desc: "Нигерия выстоит, готовая защищаться от всех актов империализма"
 NGA_declare_the_democratic_peoples_republic_of_nigeria: "Провозгласить Нигерийскую Народно-Демократическую Республику"
 NGA_declare_the_democratic_peoples_republic_of_nigeria_desc: "Теперь, когда страна находится в безопасности, мы можем отменить военное положение и официально создать Нигерийскую Народно-Демократическую Республику"
 NGA_align_with_african_marxists: "Сотрудничество с африканскими марксистами"
 NGA_align_with_african_marxists_desc: "В наших интересах сохранения марксизма на африканском континенте в наших интересах тесно сотрудничать с другими африканскими марксистско-ленинскими нациями"
 NGA_african_socialist_bloc: "Африканский социалистический блок"
 NGA_african_socialist_bloc_desc: "Заключив соглашения о взаимной военной защите, мы приблизимся к нашим африканским союзникам"
 NGA_economic_ties_with_african_marxists: "Экономические связи с африканскими марксистами"
 NGA_economic_ties_with_african_marxists_desc: "Во-вторых, в установлении тесных связей с африканскими марксистами-ленинцами нам нужно будет переплести наши экономики с инвестициями"
 NGA_full_moscow_alignment: "Полное согласование с Москвой"
 NGA_full_moscow_alignment_desc: "Мы не будем уклоняться от международной рабочей революции, возглавляемой с родины революции в Москве"
 NGA_become_a_comecon_observer: "Стать наблюдателем СЭВ"
 NGA_become_a_comecon_observer_desc: "В надежде на развитие нашей страны благодаря советскому влиянию мы подадим прошение о том, чтобы стать наблюдателями СЭВ"
 NGA_join_the_warsaw_pact: "Присоединиться к Варшавскому договору"
 NGA_join_the_warsaw_pact_desc: "Наша военная мощь показала восточным блокам, что мы должны стоять вместе с ними в Варшавском договоре"
 NGA_transition_to_a_civilian_government: "Переход к гражданскому правительству"
 NGA_transition_to_a_civilian_government_desc: "Агуйи-Иронси после провала контрпереворота на Севере достаточно уверен, что страна в безопасности, и он может перейти к демократии"
 NGA_the_hausaland_war: "Хаусалендская война"
 NGA_the_hausaland_war_desc: "Северяне в стране продемонстрировали неспособность функционировать в разумных условиях и теперь воюют против своих соотечественников в сепаратистском государстве. Мы должны победить их"
 NGA_secure_french_support: "Заручиться Французкой поддержкой"
 NGA_secure_french_support_desc: "Учитывая нефтяные инвестиции, сделанные Францией в Юго-Восточную Нигерию, они очень хотят помочь нашему правительству."
 NGA_import_french_light_artillery: "Импорт французской лёгкой артиллерии"
 NGA_import_french_light_artillery_desc: "Благодаря дипломатическим отношениям с Французской Республикой мы можем получить партию легкой артиллерии"
 NGA_begin_the_embargo: "Начать эмбарго"
 NGA_begin_the_embargo_desc: "Чтобы заставить сепаратистское государство Хаусаленд подчиниться, мы начнем полное эмбарго нации и предотвратим любой доступ в нацию, какой только сможем"
 NGA_emergency_nigerian_militarization: "Чрезвычайная нигерийская милитаризация"
 NGA_emergency_nigerian_militarization_desc: "Из последних сил мы можем быстро милитаризировать большую часть страны"
 NGA_flood_northern_regions: "Затопление северных регионов"
 NGA_flood_northern_regions_desc: "Область к югу от Хаусаленда может быть затоплена и разрушена, если будут сделаны правильные приготовления"
 NGA_import_french_small_arms: "Импорт французского стрелкового оружия"
 NGA_import_french_small_arms_desc: "Поскольку отношения с Францией столь же хороши, как и благодаря их инвестициям в нашу страну, мы можем легко получить от них партию оружия среднего размера"
 NGA_import_french_anti_air: "Импорт французских ПВО"
 NGA_import_french_anti_air_desc: "Импорт французских ПВО поможет нам разгромить Хаусаленд"
 NGA_french_advisors: "Французские советники"
 NGA_french_advisors_desc: "Наши вооруженные силы отчаянно нуждаются в реструктуризации и нуждаются в переоценке, французские вооруженные силы готовы помочь нам в этом"
 NGA_continue_army_expansion: "Продолжить расширение армии"
 NGA_continue_army_expansion_desc: "Общий рост нашей армии - одна из самых важных факторов, которую мы можем легко изменить, и мы, безусловно, должны это сделать"
 NGA_train_nigerian_specialist_divisions: "Обучать нигерийские специализированные подразделения"
 NGA_train_nigerian_specialist_divisions_desc: "Подготовка специализированных подразделений станет отличным способом ускорить захват удаленных пустынных городов"
 NGA_rebuild_the_north: "Восстановить Север"
 NGA_rebuild_the_north_desc: "Наш долг - восстановить и заново присоединить Хаусаленд"
 NGA_subsidize_nigerian_transportation_infrastructure: "Субсидировать нигерийский транспорт"
 NGA_subsidize_nigerian_transportation_infrastructure_desc: "Вместо того, чтобы национализировать транспортную инфраструктуру Нигерии, многие экономические консультанты выступают за то, чтобы мы позволили свободному рынку более эффективно управлять сетями, и мы простимулируем это за счет государственных субсидий"
 NGA_yakubu_gowon_takes_the_reigns: "Якубу Говон принимает власть"
 NGA_yakubu_gowon_takes_the_reigns_desc: "Военная хунта, возглавляемая Мурталой Мухаммадом, решила сделать Якубу Говона главой государства, поскольку его происхождение как этнического меньшинства и христианина защитит новое правительство от претензий на северную предвзятость, одновременно обеспечив такое господство, он сам все еще остается северянином"
 NGA_create_new_state_subdivisions: "Создать новые государственные подразделения"
 NGA_create_new_state_subdivisions_desc: "Стремясь сдержать влияние правительства на юго-востоке, Говон объявляет о разделении 3 нигерийских регионов на 12 штатов: Северо-Западный штат, Северо-Восточный штат, Штат Кано, Северо-Центральный штат, Штат Бенуэ-Плато. , штат Квара, Западный штат, штат Лагос, Среднезападный штат и, из восточного региона Оджукву, штат Риверс, юго-восточный штат и восточно-центральный штат"
 NGA_tolerate_unions: "Терпеть профсоюзы"
 NGA_tolerate_unions_desc: "Профсоюзы уже несколько десятилетий играют важную роль в Нигерии, особенно в Лагосе. Хотя некоторые из них под руководством тунджи отегбейе доставляли неудобства, в целом они не причиняют особого вреда интересам нигерийского правительства. Терпение к ним, безусловно, является практическим решением для борьбы с ними"
 NGA_address_the_anti_igbo_pogroms: "Борьба с погромами анти-игбо"
 NGA_address_the_anti_igbo_pogroms_desc: "После переворота пяти майоров и контрпереворота Агуйи-Иронси широко распространенное представительство игбо в северной части страны проявилось в заговорах с целью заговора игбо с целью захватить нацию. Это предубеждение привело к массовым убийствам общин мигрантов игбо на севере страны, что не может продолжаться, если мы хотим какой-либо формы примирения с юго-востоком"
 NGA_minor_land_reform: "Малая земельная реформа"
 NGA_minor_land_reform_desc: "В то время как широкомасштабная земельная реформа на севере оттолкнет наших аристократических сторонников, власть стратократии позволит нам осуществить некоторые крупные приобретения земли и оказать существенное влияние на жизнь людей"
 NGA_develop_a_national_sewage_network: "Развитие национальной канализационной сети"
 NGA_develop_a_national_sewage_network_desc: "Несмотря на то, что в Лагосе и нескольких других крупных городах есть номинальная канализационная сеть, совершенно очевидно, что мы создадим национальную сеть для полного решения санитарных проблем, с которыми сталкивается страна"
 NGA_found_the_federal_republic_of_nigeria: "Основание Федеративной Республики Нигерия"
 NGA_found_the_federal_republic_of_nigeria_desc: "В нескончаемом ожидании большей автономии севера и юга Нигерии кажется, что в борьбе с южным сепаратизмом лучшим решением является создание федерального государства в Нигерии, где большая часть власти будет передана региональным губернаторам"
 NGA_combat_igbo_propoganda: "Борьба с пропагандой игбо"
 NGA_combat_igbo_propoganda_desc: ""
