 west_african_federation_0_desc: "Хотя изначально у нас было несколько стран, добровольно объединившихся для создания Западноафриканской федерации, есть много других стран, которые могли бы присоединиться к нам в нашей панафриканской судьбе. С помощью дипломатии, лоббирования, инвестиций и военного давления мы можем привлечь остальную часть Западной Африки к нашей стране."
