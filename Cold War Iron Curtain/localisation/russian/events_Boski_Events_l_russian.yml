 French_PM.1.d: "Правительство французского премьер-министра и политического ветерана Анри Кёя упало после неудачной попытки заручиться достаточной поддержкой в Национальном собрании. Хотя его правление казалось недолгим, ему удалось справиться с ростом голлистских партий и коммунистического влияния. Тем не менее, становится очевидным, что Кёй боролся за управление через политически разделенное Национальное собрание и непродуманные конституционные законы, касающиеся законодательства. Некоторые задаются вопросом, действительно ли Четвертая республика исправила ошибки Третьей республики. Тем не менее, общее мнение заключается в том, что Анри Кёй хорошо справился с обстоятельствами."
 French_PM.2.d: "Правительство премьер-министра Жоржа Бидо недавно распалось в Национальном собрании. Будучи политическим деятелем и долгосрочным министром, Бидо изо всех сил пытался достичь своих целей и сталкивался с постоянным давлением со стороны Национального собрания. Он обнаружил, что его позиция премьер-министра постоянно оспаривается дебатами в Ассамблее по поводу его министров. С его ситуацией невыносимо, он был вынужден уйти в отставку. Французские политические партии по-прежнему готовы использовать конституционные недостатки и лазейки для своей политической выгоды."
 French_PM.3.d: "Правительство премьер-министра Рене Плевена недавно распалось в Национальном Собрании. Плевен был решительным сторонником европейской интеграции и время от времени сталкивался с необходимостью принять закон, чтобы облегчить этот процесс. Тем не менее, конфликты из-за бюджета и его постоянное сражение с левыми и правыми игроками ослабили его позиции. Понимая, что он больше не может изменить законодательство или даже принять свой недавний бюджет, он подал в отставку."
 French_PM.4.d: "Во второй раз премьер-министр Франции Анри Кёй и его правительство пали от власти. Это был его второй срок в должности премьер-министра, и многие считают, что это оказалось гораздо более сложным делом, чем когда он впервые занял этот пост. Политические разногласия и процедуры, которыми он умело управлял в течение своего первого срока, оказались гораздо труднее преодолеть на этот раз. Он изо всех сил пытался добиться легитимности со своим кабинетом или договориться о компромиссах. Похоже, что все политические партии во Франции готовы использовать конституционные слабости четвертой республики для достижения своих политических целей."
 French_PM.5.d: "Во второй раз правительство премьер-министра Жоржа Бидо распалось в Национальном собрании. В течение этого короткого срока полномочий Бидо сделал трудовые вопросы своим приоритетом. Хотя он чувствовал, что был достигнут прогресс, политическая нестабильность Национального собрания и постоянные проблемы его министров поглощали его время. Когда он осознал, что продолжение пребывания на этом посту приведет только к новым задержкам и пробкам, Бидо решил покончить со своим правительством. Многие французские граждане все больше разочаровываются нынешней политической системой в стране, тем более что страна сталкивается с серьезными внутренними и международными проблемами."
 French_PM.6.d: "Премьер-министр Эдгар Фор объявил о роспуске своего правительства в Национальном собрании. Консервативный политик изо всех сил пытался справиться с политическими конфликтами и нестабильностью Четвертой республики. Аналитики считают, что пропорциональные процедуры голосования, выборы премьер-министра через Национальное собрание и уязвимость министров перед голосованием в Национальном собрании являются основными причинами, мешающими премьер-министру консолидировать свою власть над правительством и законодательными органами."
 French_PM.7.d: "Консервативное правительство Антуана Пине закончилось, когда его министерская коалиция распалась. Пине, который едва избежал объявления о коллаборационизме за поддержку Петэна в военное время, сумел организовать поддержку консерваторов в Национальном собрании. Он провел свой короткий срок, сосредоточенный на восстановлении финансов страны, но, опять же, отсутствие явного большинства в Национальном собрании сделало его правительство уязвимым с самого начала. Некоторые французы теперь задаются вопросом, что именно изменилось с Третьей республики до Четвертой."
 French_PM.8.d: "Премьер-министр Рене Майер объявил о завершении своего правления после непродолжительного пребывания у власти. Рене Майеру, члену Радикальной партии, как и многим его предшественникам, мешало отсутствие явного большинства в Национальном собрании. Падение его правительства - еще один знак для французских граждан, что Четвертая республика, возможно, не решила проблемы, которые преследовали французскую политику до войны. Рене Майер известен тем, что был вторым премьер-министром еврейского наследия."
 french_elections.2.d: "Национальное собрание провело выборы следующего президента Франции. При Четвертой республике положение в значительной степени церемониальное, но выборы показали, насколько глубоко расколотой остается Национальное собрание. Победивший кандидат должен получить абсолютное большинство, но после двенадцати раундов голосования ни один из кандидатов не смог его обеспечить. Собрание оставалось разделенным из-за избрания социалистического или консервативного кандидата. Когда прибыло тринадцатое голосование, компромиссный кандидат, консервативный либерал Рене Коти, который появился только в одиннадцатом туре, смог обеспечить голоса, необходимые для избрания. Новый президент вскоре будет приведен к присяге, но не ожидается, что он будет играть какую-либо важную роль в качестве политического влияния."
 AJAX.13.d: "Сообщения о том, что члены партии Туде бродят по магазинам и уничтожают символы капитализма, вызвали массовую панику, охватившую Тегеран. Контрпротестанты, исчисляемые тысячами, вышли, чтобы осудить премьер-министра Моссада за поощрение коммунистических волнений на улицах и призвать шаха вернуться. Среди главных организаторов этих акций протеста - Шабан Джаффри. Протестующие против шаха вскоре наполнились обеспокоенными гражданами, которые помогли прогнать членов партии Туде с улиц. Генерал Захеди убедил местный гарнизон солдат присоединиться и помочь вывести Туде из города. С удалением Туде правительственные здания были захвачены, а премьер-министр Моссадех сдался армии после того, как его резиденция загорелась. Моссадех, чтобы предотвратить кровопролитие, отказался призывать своих сторонников попытаться исправить ситуацию. После задержания Моссадеха и освобождения Тегерана от своих сторонников генерал Захеди взял под свой контроль правительство и пригласил шаха вернуться из Италии."
 Soviet_Nuke_Test.1.d: "Советский Союз успешно испытал свое первое ядерное оружие в Казахской ССР. Устройство мощностью 22 килотонны было разработано Курчатовским институтом и вооружено плутонием, произведенным на ядерном объекте Челябинск-40. Сама бомба напоминает американскую бомбу Толстяк, сброшенную на Нагасаки. Советы обозначили испытание как RDS-1. Успех рассматривается как кульминация интенсивных советских исследований и разработок для противодействия монополии на ядерное оружие, которым пользуются Соединенные Штаты. Кремль тепло поздравил ученых и чиновников, которые сделали это большое достижение. Американское правительство обнаружило испытание после того, как метеорологический самолет ВВС собрал образцы, подтверждающие ядерный взрыв. По мере распространения новостей западные спецслужбы будут сбиты с толку, поскольку они не ожидали, что Советы добьются ядерного взрыва в течение ряда лет."
 CMEA_empowered: "CMEA Усилен"
 vie.1500.d: "Честь и достоинство Франции и ее народа восстановлены. Франция бросила вызов разногласиям, вернувшись в свои колонии в Индокитае, где многие аналитики предсказывали катастрофу. Тем не менее, французские военные и администрация смогли восстановить свои позиции и построить партнерские отношения между людьми, чтобы обеспечить его военный успех. Коммунистические усилия были сорваны, поскольку их бойцы не смогли закрепиться среди людей, и наши силы смогли искоренить угрозу. Вместе с нашими местными партнерами Франция будет смотреть в будущее, уверенная в том, что сможет справиться с трудными волнами деколонизации, которые, похоже, охватывают весь мир."
 USA_70s_The_Paris_Peace_Accords: "Парижское мирное соглашение"
 USA_CIVIL_RIGHTS.1.d: "Черные пассажиры составляют семьдесят пять процентов пассажиров городских автобусов Монтгомери. Тем не менее, они должны сидеть в задней части автобуса и сталкиваться с открытой дискриминацией со стороны водителей автобусов. В недавнем инциденте Роза Паркс, секретарь NAACP, жена и мать, была арестована за отказ уступить свое место белому пассажиру. Впоследствии она была оштрафована на десять долларов. Организатор Е.Д. Никс решил превратить дело в катализатор бойкота против сегрегации автобусов и дискриминации черных наездников. Он призвал молодого Преподобного Мартина Лютера Кинга возглавить движение, которое быстро набрало силу. Автобусы Монтгомери быстро потеряли клиентов, и темнокожие жители помогали друг другу поддерживать бойкот. Церкви по всей стране собирали деньги за бойкот. Разъяренные белые жители прибегали к физическим атакам и бомбардировкам черных церквей, возглавляющих акции протеста, однако Мартину Лютеру Кингу удалось предотвратить ответное насилие, проповедуя ненасилие бойкотерам. Город Монтгомери в конечном счете закончил свою политику сегрегации после бойкота и постановлений суда."
 USA_CIVIL_RIGHTS.2.d: "Черное сообщество и широкая публика были шокированы после того, как журнал Chicago Defender and Jet опубликовал неотредактированные фотографии Эммитта Тилля. До тех пор, как 14-летний подросток из Чикаго был жестоко убит белыми людьми во время посещения семьи в Миссисипи. Тиль предположительно присвистнул белой женщине, работающей в продуктовом магазине. Ее муж и друзья выследили Тилла, избили, изуродовали, а затем застрелили его, прежде чем выбросить его тело. Суды отказались осудить убийц, и во время похорон Эммитта Тилля его мать приказала открыть гроб, чтобы показать миру, что было сделано с ее сыном. Шокирующие образы рассматриваются как катализатор для более активных действий за гражданские права. Многие по всей стране не могут понять, как предполагаемый случай оскорбления женщины может привести к такому жестокому убийству и несправедливости по отношению к жертве."
 USA_CIVIL_RIGHTS.3.d: "В Олбани, штат Джорджия, местные черные министры и лидеры общин сформировали альянс под названием Движение Олбани. Город на сорок процентов черный, но политика сегрегации и бездействие полиции создают огромные трудности для общества. Он стремился использовать ненасильственные протесты для десегрегации общественных мест в городе. Местное правительство отказалось, и местные СМИ открыто выступили против движения Олбани. Движение Олбани стремилось отправить добровольцев на местную автобусную станцию ​​и проверить ее соответствие федеральным законам о десегрегации. Местная полиция арестовала протестующих по обвинению в нарушении мира. Аресты и отказ протестующих от внесения залога привели к уличным протестам. Полиция Олбани, опасаясь негативной национальной прессы, начала операцию по ненасильственному противостоянию протестующим и распространению арестованных по всему графству, чтобы не допустить переполнения местных тюрем. Движение Олбани в конечном итоге потерпело неудачу, но его усилия показали связь со СМИ и правительством, предоставив важные уроки активистам за гражданские права."
 USA_CIVIL_RIGHTS.4.d: "Южная христианская лидерская конференция (SCLC) во главе с Преподобным Мартином Лютером Кингом была избрана в Бирмингеме штат Алабама, возможно, самый сегрегированный город в Америке в качестве цели своей ненасильственной кампании прямого действия. Кампания началась с бойкота местного бизнеса, которого попросили положить конец дискриминационной политике занятости. Протестующие использовали сидячие забастовки, шествия и запускали акции избирателей, но столкнулись с массовыми арестами и запугиванием. Мартин Лютер Кинг был в конечном итоге арестован, и он написал свое знаменитое письмо из тюрьмы Бирмингема в защиту ненасильственных акций протеста. Чтобы сохранить импульс, протестующие вербуют студентов, особенно из колледжей и вузов, которые гораздо охотнее задерживаются полицией. Национальная пресса и нация в целом внимательно следили за событиями, и образы полицейских, использующих водяные шланги и нападающих на протестующих, были определяющими изображениями. Когда город остановился и общественное мнение против них, город согласился на отмену сегрегации."
 USA_CIVIL_RIGHTS.5.d: "После успеха Бирмингемской кампании и повышения осведомленности общественности о Движении за гражданские права коалиция групп за гражданские права по всей стране собралась вместе, чтобы выступить в Вашингтоне. По оценкам, четверть миллиона человек приняли участие в марше вдоль Национального Молла. В Мемориале Линкольна выступили известные лидеры движения за гражданские права, в том числе выступление Преподобного Мартина Лютера Кинга на телевидении, транслируемом по всей стране. Затем спикеры пошли в Белый дом и поговорили с президентом по вопросам гражданских прав. Марш рассматривается как крупный успех и проявление расширения прав и возможностей чернокожих, но некоторые участники, особенно представители Нации Ислама, обвиняют ораторов в том, что они превращают марш из выражения черного гнева в примирение с белыми и правительством."
 USA_CIVIL_RIGHTS.6.d: "Подозреваемые белые сторонники превосходства расстреляли баптистскую церковь 16-й улицы в Бирмингеме, штат Алабама. Церковь была главной штаб-квартирой для активистов во время Бирмингемской кампании и видимой целью для противников гражданских прав. Это был едва ли не первый взрыв бомбы в городе, поскольку за последнее десятилетие было множество таких нападений, но это было первое, что привело к гибели людей. Ведь молодые темнокожие девочки погибли в результате взрыва, вызвавшего гнев и потрясение не только в городе, но и в стране. Через несколько часов после нападения черно-белые молодые люди столкнулись по всему городу, поскольку обе общины боролись за сохранение мира. Полиция, по всей видимости, расследует участие Ку-клукс-клана в причастности, но многие чернокожие жители скептически относятся к тому, что справедливость исходит от того, что они считают расистской полицией."
 USA_CIVIL_RIGHTS.7.d: "У штата Алабама есть закон, требующий прохождение тестов на грамотность и налога на опросы избирателей, которое фактически лишает права голоса большинства чернокожих жителей и бедных белых. Это особенно заметно в округе Даллас, в котором проживает большинство чернокожих, в котором менее двухсот негров имеют право голосовать из пятнадцати тысяч населения. Местные власти постоянно препятствуют усилиям по расширению списков избирателей. После убийства протестующего Джимми Ли Джексона государственным солдатом, протестующие за права избирателей решили пройти маршем от Сельмы до Монтгомери, чтобы спросить губернатора о деле и о реформах в законах о выборах. Когда они пересекали мост на шоссе 80, государственные солдаты атаковали толпу, применяя ночные палки, слезоточивый газ и конные заряды против протестующих. Фотографии и видео жестоких действий полиции потрясли народ. В общей сложности семнадцать участников марша, включая молодых женщин, были госпитализированы, а пятьдесят были доставлены в больницу с менее серьезными травмами. Многие дублируют несостоявшийся марш Кровавого воскресенья."
 USA_CIVIL_RIGHTS.8.d: "События Кровавого воскресенья вызвали гнев по всему округу Даллас и национальной прессе. Местные активисты попросили постановление суда, чтобы защитить протестующих в последующем шествии, но суды попросили больше времени. Нетерпеливые протестующие настаивали на продолжении второго марша, и их возглавил преподобный Мартин Лютер Кинг. Тем не менее, он заключил тайное соглашение с властями, и после того, как он побудил протестующих к молитве на месте кровавого воскресенья, он повернул протестующих обратно к Сельме. В ту ночь белый проповедник Джеймс Риб, участвовавший в акциях протеста, был жестоко убит членами Ку-клукс-клана в Сельме. Убийство вызвало еще большее возмущение, и когда суды дали разрешение на продолжение шествия, Белый дом пообещал свою защиту. Затем доктор Мартин Лютер Кинг привел протестующих в Монтгомери, где участвовало до двадцати пяти тысяч протестующих. Национальная симпатия и федеральная защита подчеркивают растущую поддержку гражданских прав в Соединенных Штатах."
 USA_CIVIL_RIGHTS.9.d: "Преподобный Мартин Лютер Кинг провел кампанию за гражданские права с сегрегационистского юга в Чикаго. Его прибытие предназначено для поддержки усилий по прекращению де-факто жилья, образования и сегрегации в сфере занятости, распространяющейся по всему городу. Хотя местные черные жители сначала сопротивлялись доктору Кингу, он смог помочь собрать Чикагское движение за свободу и начал устраивать митинги по всему городу, несмотря на некоторые случаи насилия со стороны полиции и белых жителей. В конце концов, доктор Кинг выдвинул ряд требований к мэрии Чикаго, чтобы оказать давление на его лидеров, чтобы они выступали против дискриминации. Кампания подчеркивает, что расовая дискриминация существует в Соединенных Штатах, а не только на юге, и, как говорят, влияет на готовящееся в Конгрессе законодательство о недобросовестной жилищной практике. Чикагское движение за свободу отмечает крупнейшую кампанию за гражданские права на севере."
 USA_CIVIL_RIGHTS.10.d: "Кампания «Бедные люди» призвана оказать давление на правительство, чтобы обеспечить всем гражданам экономическую справедливость и доступ к тому, что им нужно для жизни. Это отход от лидеров движения за гражданские права, таких как доктор Мартин Лютер Кинг, которые видят, что условия жизни чернокожих не изменились благодаря новому законодательству о гражданских правах. Несколько тысяч участников организовали лагерь протеста в Вашингтоне, округ Колумбия, чтобы оказать давление на правительство с целью обеспечения экономической справедливости, и он уникален тем, что является многорасовым мероприятием с протестующими из всех основных расовых групп страны. Протестующие останутся и призваны показать Конгрессу и правительству лицо бедности в стране. Кампания действительно повысила осведомленность и привела к некоторым политическим изменениям, призванным снизить уровень бедности, но в целом национальным СМИ и местным жителям не хватало симпатий к протестующим. Заинтересованные федеральные агентства в настоящее время расследуют дело преподобного Мартина Лютера Кинга и других лидеров за гражданские права как потенциальных коммунистов."
 USA_CIVIL_RIGHTS.11.d: "Несмотря на то, что суды и федеральное правительство десегрегировали общественный транспорт и межгосударственные автобусы на юге, местные власти отказываются подчиняться законам. В ответ группы по защите гражданских прав по всей стране организуют «Заезды на свободу», в ходе которых активисты проводят смешанные гонки в автобусах, чтобы бросить вызов государствам за несоблюдение законов. Местные власти цитировали местные постановления и пытались обеспечить сегрегацию, когда автобусы достигли южных городов, что привело к случаям арестов и насилия со стороны толпы. Однако в последующих постановлениях суда такие постановления были объявлены неконституционными и вынесены в пользу гонщиков за свободу. Даже перед лицом насилия со стороны толпы активисты боролись за гражданские права, пока Межгосударственная торговая комиссия, наконец, не выполнила постановления суда и не позволила пассажирам выбирать, где они хотели бы сидеть независимо от расы."
 USA_CIVIL_RIGHTS.12.d: "Доктор Мартин Лютер Кинг прибыл в Мемфис, штат Теннесси, чтобы поддержать чернокожих работников санитарии, требующих повышения заработной платы и прекращения дискриминационной практики в пользу белых работников. Это продолжает недавний сдвиг, одобренный доктором Кингом, чтобы сосредоточиться на экономической справедливости, а также гражданских правах. 3 апреля д-р Кинг обратился к церкви, в которой он заявил, что, если он умрет, это не будет напрасным, и причина будет продолжаться. На следующий вечер, стоя на балконе своего номера в мотеле, пуля попала в значок гражданских прав. Через час он был объявлен мертвым в больнице. Белый дом и лидеры по всей стране поспешили выразить сочувствие, и убийство вызвало возмущение людей по всей стране. Убийца все еще в бегах. Начались новости о том, что разочарованные черные сообщества по всей стране участвуют в жестоких беспорядках, чтобы выразить свое разочарование по поводу убийства. Близкие соратники Мартина Лютера Кинга призывают к спокойствию и ненасилию, поскольку доктор Кинг всегда проповедовал."
 USA_CIVIL_RIGHTS.13.d: "Малик эш-Шахбаз, более известный как Малкольм Икс, был убит во время выступления в Манхэттене боевиками «Нации Ислама». Шахбаз долго обвинял свою бывшую группу в попытке убить его после того, как он публично порвал с Илией Мухаммедом. Как Малкольм Икс он помогал группе увеличивать свое членство в геометрической прогрессии. Становление национально известным его риторикой о черной идентичности и сепаратизме. Он долго критиковал других лидеров гражданских прав за компромисс с угнетателями. Он публично порвал с Нацией Ислама в 1964 году. Он отправился в Мекку для паломничества хаджа, где этот опыт побудил его принять ислам суннитов и изменить свое мировоззрение. По возвращении в Соединенные Штаты он объявил свое новое имя и свою веру в расовую гармонию, а не в сепаратизм. Он обратился к лидерам, которых он когда-то критиковал, как Мартин Лютер Кинг, чтобы предложить свою поддержку ненасильственному движению. Многие оплакивают потерю человека, который так красноречиво говорил о гордости за черную идентичность и который был урезан, когда он только начал свой путь к расовой гармонии."
 USA_CIVIL_RIGHTS.14.d: "Во время Второй Великой Миграции многие афроамериканские семьи прибыли в Лос-Анджелес. Тем не менее, они столкнулись с дискриминационными жилищными правилами, жестокостью полиции и, несмотря на законодательство о гражданских правах, они придерживались практики, направленной на предотвращение владения имуществом меньшинств. Кроме того, все более милитаризованный LAPD начал целевые операции и патрули, нацеленные на чернокожих и испаноговорящих молодых людей. Все это напряжение разразилось насилием, когда черный автомобилист Маркетт Фрай поссорился с государственными солдатами. Хаос видел, как полиция задерживала жителей в окрестностях, заставляя злобную толпу формироваться и бросать камни в полицию. В районе вспыхнули беспорядки, несмотря на призывы лидеров сообщества к спокойствию. Калифорнийская национальная гвардия была вызвана с полицией, которая рассматривала беспорядки как зону боевых действий. В итоге было тридцать четыре смерти, тысячи раненых, тысячи арестов и миллионы материального ущерба. Государство создало комиссию по расследованию причин беспорядков, и лидеры за гражданские права называют беспорядки причиной того, что страна должна пересмотреть свою расистскую практику."
 USA_CIVIL_RIGHTS.15.d: "Следствием Второй Великой Миграции стало появление афроамериканских общин в городах за пределами юга. Эти жители постоянно сталкивались с дискриминацией, насилием и расизмом. Для этих жителей тактика движения за гражданские права на юге, направленная на борьбу с юридической сегрегацией и разделением акций, для них неприменима. Молодые темнокожие молодые люди организовали группы Черных Сил, чтобы изучить, как черное сообщество может в конечном итоге достичь экономической и политической власти, а также равных прав. Хьюи Ньютон и Бобби Сил основали Партию Черной Пантеры из этих дискуссий в Окленде. Они черпали вдохновение из националистической риторики чернокожих Малкольма X и противостояли любым уступкам со своими угнетателями. Группа объединилась с воинствующими студенческими группами, чтобы сформировать силы самообороны для защиты от белых сторонников превосходства и расистских полицейских патрулей. Они разбили лагеря и законно собирают оружие для обороны. Эта группа является одной из новых тенденций в черном национализме, которая отказывается поставить под угрозу их права на защиту от внешнего насилия."
 USA_CIVIL_RIGHTS.16.d: "В историческом решении Верховный суд вынес решение в пользу Любящей семьи и постановил, что законы о противодействии смешениям являются неконституционными. Суд постановил, что законы, запрещающие смешение прав, нарушили законы о равной защите. Их не впечатлил аргумент, что такие законы одинаково влияют на обе расы и, следовательно, не нарушают ни одну из групп. Суды отметили, что в законах проводится различие между расой и практикой брака, которая является широко распространенной практикой, что делает законы дискриминационными. Результаты откроют двери для межрасовых браков по всей территории Соединенных Штатов. Дело началось, когда Любящая семья была арестована за нарушение законов штата Вирджиния против межрасовых союзов, женившись в Вашингтоне, округ Колумбия. Они передали дело в Верховный суд. Ожидается, что после вынесения вердикта пара вернется в Вирджинию со своей молодой семьей."
 USA_CIVIL_RIGHTS.17.d: "В Детройте, после того как полиция совершила налет на нелицензионный бар после окончания рабочего дня, в котором они задержали сторонников вечеринок, празднующих возвращение двух черных солдат из боя, толпа разразилась насилием. Вскоре беспорядки распространились по всему району, и полиция быстро разбилась о них. Насилие переросло в поджог зданий, и полиция должна была поддерживаться сторонними организациями. Через два дня Белый дом санкционировал развертывание федеральных войск и Национальной гвардии для подавления беспорядков. В конце концов насилие прекратилось, и тысячи были арестованы, однако Национальная гвардия подверглась критике за убийство девяти участников беспорядков без особых провокаций. Полиция также обвиняется в жестоком обращении с жителями во время хаоса. Беспорядки обвиняются в дискриминационной жилищной политике и чрезмерной жестокости полиции в черных кварталах. Государство обязалось пересмотреть эти опасения и расширить наем меньшинств в правительстве, однако многие белые теперь обвиняют правительство в легитимизации мятежников и радикалов."
 USA_CIVIL_RIGHTS.18.d: "Губернатор Алабамы Джордж Уоллес выступил со страстной речью в столице штата Монтгомери, штат Алабама. Он защищал свои сегрегационные взгляды и подверг резкой критике движение за гражданские права. Он объявил сегрегацию сейчас, сегрегацию завтра, сегрегацию навсегда для ликующей толпы сторонников. Его замечания привлекли широкое внимание национальной прессы, и губернатор Уоллес, похоже, является главным символом противодействия интеграции на юге. Лидеры за гражданские права осудили его высказывания как бесчувственные и обвиненные в расовом отношении, утверждая, что они рискуют спровоцировать насилие в отношении уязвимых меньшинств в государстве."
 USA_CIVIL_RIGHTS.19.d: "В Таскалусе, штат Алабама, протестующие во главе с преподобным Т.Ю. Роджерс планировал пройти от своей церкви до здания суда округа Таскалуса, чтобы протестовать против политики сегрегации. Однако, когда его мирный протест начал покидать церковь, полиция отреагировала с крайним насилием, чтобы разбить марш и помешать им добраться до здания суда. В итоге было произведено около ста арестов и почти сорок человек госпитализированы из-за полученных жестоких ранений. Средства массовой информации в значительной степени игнорировали этот инцидент, и очень немногие люди за пределами юга или движения за гражданские права знают о том, что произошло, однако, они демонстрируют количество насилия, с которым группы гражданских прав сталкиваются почти ежедневно на юге. Доктор Мартин Лютер Кинг осудил насилие и призвал полицию уважать ненасильственный характер движения."
 USA_CIVIL_RIGHTS.20.d: "Кампания «Лето свободы» недавно завершилась, но не достигла своих целей по значительному увеличению числа зарегистрированных чернокожих избирателей в Миссисипи. В рамках этой кампании активисты движения за гражданские права и добровольцы со всей страны приезжают в Миссисипи и помогают местным жителям зарегистрироваться и проголосовать. Кампания была сильно затруднена законами Джима Кроу, местными властями и актами насилия со стороны таких групп, как Ку-клукс-клан. Кампания обнародовала характер этих законов и вызвала национальную симпатию к движениям за гражданские права, что в конечном итоге значительно помогло делу. В течение лета более тысячи активистов были арестованы, около ста избиты и четверо убиты. Три местных чернокожих были также убиты за участие в движении. Насилие повысило осведомленность среди чернокожих добровольцев о необходимости самообороны и рассматривается как катализатор растущей черной националистической тенденции среди афроамериканской молодежи."
 algeria.1000.d: "Премьер-министр Франции Ги Молле недавно завершил свой катастрофический визит в Алжир. Перед тем, как отправиться в путешествие, Молле пообещал провести переговоры с повстанцами НФО. Однако после прихода к власти он отступил и объявил, что переговоры могут состояться только после французской военной победы. Его меняющиеся позиции приводили в ярость как про-французское, так и анти-французское население в Алжире. Во время поездки премьер-министра забросали гнилыми помидорами, брошенными враждебной демонстрацией. Французские СМИ уже называют это событие днем помидоров. Премьер-министр вернулся в Париж, убежденный, что он должен занять твердую позицию по алжирскому вопросу или рискнуть потерять поддержку всех сторон на французской территории."
 algeria.1001.d: "Алжирский национализм резко вырос, поскольку алжирское арабское и берберское мусульманское большинство были вдохновлены вильсоновскими идеями самоопределения. Алжир играл ведущую роль во время Второй мировой войны, предоставляя обширную базу, рабочую силу и ресурсы для Свободной Франции. После войны французское правительство решительно отказывалось уступать независимость Алжиру, поддерживаемое многочисленными европейскими алжирскими поселенцами, которых называли пьяными нуарами. После Второй мировой войны антифранцузские группировки сформировались и создали Национальный фронт освобождения (ФНО), чтобы возглавить антиколониальные усилия. Чтобы заставить Францию ​​деколонизировать, НСО сформировали исполнительный комитет для управления и организации вооруженного крыла, чтобы начать партизанскую войну против французов. После зрелищных нападений на Алжир в День всех святых НСО объявили о своем присутствии и насильственном сопротивлении. В ответ французские военные и государство начали собирать собственные силы для уничтожения антиколониального сопротивления НСО и Алжира."
 algeria.1002.d: "Война в Алжире приняла мрачный оборот после неудачной атаки FLN на Филипвиль. FLN начало полномасштабную атаку, надеясь застать французов врасплох и захватить важный портовый город. Однако французские войска обнаружили передвижение истребителей FLN и знали об атаке заранее. В ходе первоначального нападения французские войска понесли потери, поскольку европейские гражданские лица вместе с арабами и берберами, считавшимися пособниками, были убиты ФНО и их местными сторонниками. Эти убийства и нападение были остановлены после прибытия французских десантников, захвативших более сотни пленных. Французские войска казнили пленных, убив по меньшей мере двести человек. Местное европейское гражданское население отреагировало на их действия, устроив жестокий погром местного мусульманского населения арабов и берберов. На глазах у французских войск сотни этих мирных жителей были убиты на местном футбольном стадионе, европейские граждане наблюдали за происходящим с трибун. Ужасающее насилие привело в ярость алжирское мусульманское население, возмутило международное сообщество и привело к тому, что в Париже потребовали, чтобы правительство рассмотрело возможные варианты действий."
 algeria.1003.d: "La Main Rouge, или Красная Рука - французская террористическая организация, нацеленная на убийство лидеров и саботаж операций Фронта национального освобождения (ФНО). С момента создания группы она была ответственна за убийство нескольких видных лидеров и сторонников НСО в Европе и Тунисе. Что еще более важно, эта группа связана с убийствами известных торговцев оружием в Германии, связанными с контрабандой оружия для НСО. Многие в средствах массовой информации и в НФО подозревают, что эта группа является фронтом для французской разведки, поскольку французские власти, похоже, не желают расправляться с этой группой."
 algeria.1004.d: "Недавний кризис подчеркнул политическую слабость Четвертой республики и военную власть над гражданскими властями. Чтобы бороться с этой политической слабостью, политические силы согласились вернуть Шарля де Голля в качестве лидера Франции. Его назначение удовлетворило военных, широкую общественность и большинство политических групп. Чтобы разрешить кризис в Алжире и исправить конституцию, де Голль попросил и получил от Национального собрания разрешение на постановление указом. С этими чрезвычайными полномочиями Де Голль надеется лучше справиться с Алжиром и решить политические проблемы, которые преследовали страну после окончания Второй мировой войны."
 algeria.1005.d: "Фронт национального освобождения (ФНО) потерпел недавние неудачи в борьбе за независимость Алжира. Французы задержали некоторых своих лидеров, и что еще более тревожно, европейские поселенцы Пьед-Нуар начали создавать свои собственные военизированные группы. Эти группы организовали взрывы и убийства мусульманских арабов и берберов в прибрежных городах. НСО решили начать беспорядочную террористическую кампанию в городах, особенно в столице Алжире, чтобы довести войну до противника и продемонстрировать, что французские военные не контролируют городские пространства. Кампания сопровождалась бомбардировками и нападениями с применением оружия на гражданские европейские цели и французских военных по всему городу. Французские силы были уполномочены местными колониальными властями, отчаянно нуждающимися в восстановлении порядка. В течение месяцев обеспечения французские силы использовали агрессивную тактику допроса и борьбы с повстанцами, чтобы демонтировать сети ФНО в городе. Хотя Алжир был в конечном счете обеспечен, жестокое насилие с обеих сторон привело к полному разрыву в отношениях между переселенцами и мусульманскими общинами в городе."
 USA_CIVIL_RIGHTS.21.d: "Исторический процесс Браун против Совета по образованию положил конец практике сегрегации в школах по всей стране. Тем не менее, с момента вынесения решения Университет Алабамы не допустил ни одного чернокожего заявителя, часто тесно сотрудничая с полицией, чтобы найти что-либо, чтобы дисквалифицировать заявителя или потребовать, чтобы все имеющиеся места были заполнены. Недавно федеральный суд отметил эту дискриминацию и обязал университет принять Вивиан Мэлоун и Джеймса Гуда. Губернатор Алабамы Джордж Уоллес, символически пытаясь сдержать свое инаугурационное обещание навсегда поддержать сегрегацию, встал, чтобы заблокировать вход в приемную, чтобы запретить двум студентам официально зарегистрироваться. Наблюдая за средствами массовой информации, он громко отказался отойти в сторону, когда встретился с заместителем генерального прокурора Соединенных Штатов. Президент чем федерализировал Алабамскую национальную гвардию и приказал ее командиру переместить губернатора. Род вежливо попросил о соответствии, что сделал губернатор, позволив двум студентам завершить регистрацию. Инцидент вызвал напряженность в этом районе и привлек Уоллеса к общенациональному вниманию."
 USA_CIVIL_RIGHTS.22.d: "На церемонии в Белом доме президент Соединенных Штатов подписал важный закон о гражданских правах, в котором правозащитники следят за развитием событий. Законопроект запрещает любую дискриминацию по признаку расы, пола, пола, цвета кожи или национального происхождения. Он также запрещает неравное применение законов, касающихся занятости, регистрации избирателей или сегрегации в школах или общественных помещениях. Законопроект долгое время был поддержан политиками и активистами, но получил новую поддержку после роста протестов и осведомленности о гражданских правах, особенно в южных штатах. Несмотря на некоторые протесты за просегрегацию и попытки раскрутить законопроект в Конгрессе, президент и сторонники законопроекта помогли обеспечить его принятие. Хотя многие восхваляют этот закон, еще предстоит выяснить, насколько эффективно местные власти и федеральное правительство применяют его условия."
 USA_CIVIL_RIGHTS.23.d: "Президент Соединенных Штатов подписал законопроект о гражданских правах - Закон об избирательных правах. Этот новый закон запрещает расовую дискриминацию при голосовании и защищает доступ граждан к правам по четырнадцатой и пятнадцатой поправкам. В течение десятилетий во многих штатах, особенно на юге, были законы о голосовании, требующие образования и экономических условий, которые делали подавляющее большинство чернокожих избирателей не имеющими права голоса. Многие из недавних протестов за гражданские права были связаны с проблемой дискриминации при голосовании за чернокожих граждан. Президент подписал законопроект с участием известных правозащитников, и его хвалят за помощь в прохождении законопроекта через Конгресс и Сенат. Законопроект также позволит федеральным наблюдателям следить за выборами и гарантировать отсутствие нарушений. Хотя законопроект помогает избирателям из числа меньшинств, отмечается, что его положения позволят многим бедным белым участвовать в выборах."
 fra.10.d: "Автономное правительство Чада официально запросило независимость от Франции. Ее лидеры считают, что страна быстро продвинулась под руководством Франции и теперь готова присоединиться к сообществу наций на своих собственных условиях. Нынешний правящий политический класс состоит из многих лидеров с западным образованием или франкофилов. Французское правительство может принять эту просьбу, оно сделает Францию популярной среди народа Чада и его нового правительства. Однако независимость может иметь непредвиденные риски, которые могут дорого обойтись Франции. Другой вариант - вежливо отклонить запрос и настаивать на том, что Чад нуждается во французской защите, особенно во все более опасном мире. Это может оттолкнуть людей, но наши интересы будут надежно защищены."
 fra.9.d: "Автономное правительство Нигера официально запросило независимость от Франции. Ее лидеры считают, что страна быстро продвинулась под руководством Франции и теперь готова присоединиться к сообществу наций на своих собственных условиях. Нынешний правящий политический класс состоит из многих лидеров с западным образованием или франкофилов. Французское правительство может принять эту просьбу, оно сделает Францию популярной среди народа Чада и его нового правительства. Однако независимость может иметь непредвиденные риски, которые могут дорого обойтись Франции. Другой вариант - вежливо отклонить запрос и настаивать на том, что Чад нуждается во французской защите, особенно во все более опасном мире. Это может оттолкнуть людей, но наши интересы будут надежно защищены."
 fra.8.d: "Договор о создании Европейского оборонительного сообщества, также известный как Парижский договор, создаст Европейское оборонительное сообщество (ЕОС) с общеевропейскими оборонительными силами."
 fra.4.d: "Автономное правительство Нигера официально запросило независимость от Франции. Ее лидеры считают, что страна быстро продвинулась под руководством Франции и теперь готова присоединиться к сообществу наций на своих собственных условиях. Нынешний правящий политический класс состоит из многих лидеров с западным образованием или франкофилов. Французское правительство может принять эту просьбу, оно сделает Францию популярной среди народа Чада и его нового правительства. Однако независимость может иметь непредвиденные риски, которые могут дорого обойтись Франции. Другой вариант - вежливо отклонить запрос и настаивать на том, что Чад нуждается во французской защите, особенно во все более опасном мире. Это может оттолкнуть людей, но наши интересы будут надежно защищены."
 YEM_COuP.1.d: "Недавнее назначение Мухаммада аль-Бадра наследным принцем его отцом, имамом Ахмадом бин Яхья, вызвало волнения среди его высших военных советников и королевской семьи. Братья имама Ахмада бин Яхья считали, что одного из них следовало назвать наследником из-за традиции и их роли в удержании имама у власти. В вооруженных силах многие считали, что аль-Бадр слишком сочувствует арабской националистической риторике, охватившей регион. Подполковник Ахмед Яхья аль-Талая решил действовать. Он развернул свои силы под предлогом подавления протестующих фермеров, но вместо этого повел своих людей осадить имама Ахмада бин Яхья в его дворце в Таизе. Талая потребовал от имама отречься от престола в пользу своего брата принца Абдуллы Яхья Хамида ад-дина. Принц Аббас, еще один брат, организует протесты в пользу переворота в столице Санаа. Принц аль-Бадр, опасаясь потери трона, пытается заручиться поддержкой племени против Талаи ..."
 YEM_COuP.2.d: "Принц аль-Бадр, назначенный наследник и сын имама Ахмада бин Яхья, не смог победить переворот против своего отца. Подполковник Ахмед Яхья аль-Талая, осадивший имама в Таизе, успешно вынудил имама отречься от престола в пользу своего брата Абдуллы Яхья Хамида ад-дина. Принц Мухаммад аль-Бадр сплотил ряд соплеменников, чтобы поддержать свою контрпогрузку, однако, когда они попытались захватить королевский арсенал и казну около Таиза, они столкнулись с сопротивлением со стороны сторонников Талаи. Командующий в последнюю минуту приказал своим сторонникам через Таиз обезопасить склады оружия и задержать верных имаму солдат, вероятно, спасая его заговор. Поскольку аль-Бадр не смог спасти своего отца, правительственные силы в Сане отказались действовать, позволив протестам, организованным принцем Аббасом, усилиться. Когда ситуация стала неприемлемой, имам Ахмад бин Яхья подписал документы об отречении и передал власть своему брату."
 YEM_COuP.3.d: "Принцу аль-Бадру, назначенному наследнику и сыну имама Ахмада бин Яхья, удалось отразить попытку переворота против своего отца. Вдохновитель, подполковник Ахмед Яхья аль-Талая сосредоточил свои силы на осаде имама в Таизе, что позволило аль-Бадру привести своих сторонников из племени и захватить местный арсенал и казну в Таизе. Вдобавок к аль-Бадру присоединились верные имаму солдаты, бежавшие из Талаи, который вскоре прервал захват и арестовал аль-Талаю. В Сане успех аль-Бадра помог активизировать правительственные силы в городе, которые быстро подавили протесты в поддержку переворота и задержали их организаторов, принца Аббаса. Принц Абдулла Яхья Хамид ад-Дин, которого Талая стремился занять трон, также был задержан. Говорят, что имам Ахмад бин Яхья возмущен предательством своих военных и братьев."
 YEM_COuP.4.d: "Имам Йемена Ахмад бин Яхья недавно отправился на лечение в Италию. Его назначенный наследник и сын принц Мухаммад аль-Бадр вступил во владение, пока его отец выздоровит. Однако вскоре до страны дошли слухи, что имам Ахмад впал в кому и не выздоровеет. Принц аль-Бадр воспринял это как знак и инициировал серию реформ, таких как создание парламента и приглашение египетских советников для модернизации государства. Эти радикальные реформы вызвали негативную реакцию внутри правительства, особенно среди военных, которые выступали против реформ. Принц аль-Бадр выделил средства племенным силам, которые подняли восстание в поддержку реформ и аль-Бадра. Умеренные и сторонники роялистов молятся, чтобы имам выздоровел и вернулся до того, как повстанцы станут слишком могущественными."
 YEM_COuP.5.d: "Хотя имам Ахмад бин Яхья действительно оправился от своей болезни в Италии, он послушался совета своих врачей и остался там для полного выздоровления. Многие считают, что его обманули истинные масштабы беспорядков в стране. По возвращении он обнаружил, что племенные волнения в пользу его сына, принца Мухаммада аль-Бадра, были намного сильнее, чем он предполагал. Имам отменил все реформы, проведенные в его отсутствие, и приказал военным сокрушить племенные силы. Однако во многие подразделения уже проникла пропаганда принца аль-Бадра, и племенные силы глубоко укоренились. Когда стало ясно, что военные не могут сдержать беспорядки, и протестующие сторонники аль-Бадра начали марш в столице, имам Ахмад бин Яхья объявил о своем отречении от престола в пользу своего сына."
 YEM_COuP.6.d: "К большому удивлению принца Мухаммада аль-Бадра, имам Ахмад бин Яхья не только пережил болезнь в Италии, но и сразу же вернулся. Имам немедленно отменил все реформы аль-Бадра и приказал военным подавить племенных мятежников. Военные безжалостно подавляли все племена, которые не присягали имаму. Некоторые из племен бежали в Саудовскую Аравию, но вскоре были возвращены имаму. Чтобы проверить лояльность своего сына, принцу аль-Бадру было приказано наблюдать за казнью всех лидеров повстанцев. Говорят, что военные и высокопоставленные правительственные чиновники очень довольны возвращением имама."