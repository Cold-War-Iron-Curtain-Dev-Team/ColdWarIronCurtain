 Chehelom_Protests: "Протесты в Чехеломе"
 intensifying_protests: "Усиливающиеся протесты"
 intensified_protests: "Сильные протесты"
 crippling_protests: "Жестокие поротесты"
 crippling_protests_alt: "Индустриальные протесты"
 revolutionary_islamic_socialism: "Исламский Революционный Социализм"
 revolutionary_islamic_socialism_desc: "Исламский Революционный Социализм, находящийся под сильным влиянием произведений Али Шариати, верит в ислам как революционную силу, призванную создать бесклассовое общество. Его нынешние идеологи изображают идеи исламского мученичества и практики как исторически противоположные феодализму и капитализму. Теперь они утверждают, что исламское революционное рвение, особенно среди шиитов, должно быть использовано для завершения процесса создания бесклассового общества. Противники обвиняют сторонников этой идеологии в том, что они скрывают марксизм под исламским прикрытием, но его сторонники утверждают, что ислам является жизненно важным компонентом, и они отвергают атеистическую природу марксизма."
 Biafra_War.1.d: "Нигерия является домом для множества культурных, этнических и религиозных группировок. Географически на севере, юго-западе и юго-востоке преобладали этнические группы хауса-фулани, йоруба и игбо соответственно. Независимость привела к продолжению конфликта и напряженности, поскольку каждая группа пыталась получить влияние на центральное правительство. Разбитая клика офицеров Игбо совершила кровавый переворот, направленный против северных офицеров и политиков, которых обвиняли в эксплуатации ресурсов в юго-восточной Нигерии и коррупции. Хотя переворот был побежден, его последствия привели к общенациональному погрому против игбо. Почти два миллиона игбо, живущих на севере или юго-западе, бежали обратно на юго-восток. При поддержке вооруженных сил и правительства осажденные игбо во главе с полковником Одемегву Оджукву объявили о создании Республики Биафра. Правительство Нигерии осудило это объявление и готовится отправить военные силы для подавления восстания. Оджукву объявил, что все жители Биафры, независимо от их личности, будут готовы к любому вторжению."
 Biafra_War.2.d: "\nПравительство Биафры объявило о создании Республики Бенин в Среднем Западном регионе Нигерии, где его войска оккупируют территорию. Говорят, что новость является попыткой правительства Биафры обеспечить лояльность и поддержку людей, которые там живут. В начале войны регион Среднего Запада стремился содействовать миру и отказывался от входа в федеральные войска, но после оккупации Биафры и усиления насилия население, как сообщалось, все больше выступало против присутствия Биафры. Они рассматривают конфликт как конфликт между игбо и нигерийским государством. Однако с этим новым заявлением правительство Биафры надеется, что местные жители теперь активно присоединятся к своему собственному государству. Республику Бенин возглавляет врач Альберт Оконкво, но критики отмечают, что Республика Бенин фактически является марионеточным государством для Биафры."
 Biafra_War.3.d: "Несмотря на доблестное сопротивление, Республика Биафра, наконец, рухнула во время последнего наступления нигерийских военных. Сочетание экономической блокады и агрессивных военных операций смогли окончательно преодолеть сопротивление Биафрана. Блокада расширилась на международном уровне, поскольку нигерийское правительство успешно удержало Биафру от установления дипломатических отношений с внешними государствами. Нигерийские операции были подвергнуты широкой критике за их воздействие на гражданское население, но нигерийское правительство настаивает на том, что именно отказ Биафрана прекратить его насильственную борьбу привел к его успеху. Многие нигерийские лидеры уже призывают к проведению политики национального примирения с бывшими жителями Биафрана, однако уже есть сообщения о спорадических случаях насилия против игбо."
 Biafra_War.4.d: "Правительство Нигерии официально признало независимость Республики Биафра, положив конец нигерийской гражданской войне. Это следует за рядом военных неудач, включая потерю Среднего Запада. В рамках соглашения Нигерия также согласилась признать созданную в Биафране Республику Бенин, которая управляет Средним Западом. Республика Биафра объявила о своей победе для всех угнетенных народов мира и оправдании игбо жертв анти-игбо погромов, которые первоначально вызвали конфликт. Правительство Нигерии прекратило свои усилия по объединению страны после своих военных поражений и опасений в руководстве, что продолжающийся успех Биафры может привести к дальнейшей дезинтеграции разнообразной нации. Теперь, когда конфликт закончился, правительству Биафры придется восстанавливать и поддерживать удовлетворение своего собственного меньшинства, поскольку оно сталкивается с обвинениями в пристрастии к большинству игбо, начавшему гражданскую войну."
 biafra_war_categorty: "Биафрская война"
 biafra_war_categorty_desc: "Тяжелый баланс между тремя крупнейшими этническими группами в Нигерии в значительной степени нарушился после неудавшегося переворота со стороны офицеров игбо в армии. Затем национальный погром был направлен на общины игбо по всей стране, и миллионы людей вернулись в свои родные районы на юго-востоке. Опасаясь, что нигерийское правительство очистит Игбо, будет использовать его ресурсы и приведет правительство к более самодержавному курсу, юго-восточный регион объявил независимость Республикой Биафра, что привело к гражданской войне в Нигерии. Нигерия должна иметь дело с Биафрой и гарантировать, что она поддерживает лояльность всех своих этнических общин. Точно так же Биафра должна также иметь дело с нигерийскими вооруженными силами и гарантировать, что большие неигбо-меньшинства не будут отчуждены от них."
 Secure_Our_Independence_BFR: "Защитить нашу независимость"
 insurgency_below_five_TT: "Силы повстанцев ниже 5%"
 Rajk.1.d: "Ласло Райк был арестован правительством по обвинению в сотрудничестве с капиталистами, в том, что он титоист и предательстве независимости Венгрии. Это знаменует конец ранних лидеров венгерской коммунистической партии. Он участвовал в гражданской войне в Испании, а во время Второй мировой войны был арестован за свои действия против фашистского режима. Будучи популярным лидером, он занимал пост министра внутренних дел и министра иностранных дел, помогая очистить Венгрию от контрреволюции и учредив агентство государственной безопасности AVH. Однако генсек ЦК КПВ Матьяш Ракоши начал рассматривать популярного лидера как угрозу для него. Советы также считают, что его заявления министра иностранных дел подорвали дипломатические усилия, особенно в отношении Югославии. С помощью Советского Союза Ракоши выступил против Райка, и многие видят его арест, когда Ракоши начинает укреплять свои позиции над Венгрией и партией."
 Kadar.1.d: "Янош Кадар, когда-то лидер коммунистов и политический координатор, был арестован AVH по приказу председателя Совета министров Матиаса Ракоши. Кадар обвиняется в том, что он был шпионом предыдущего фашистского режима Миклоша Хорти. Многие считают обвинения сфабрикованными и представляют собой мощную игру Ракоши для консолидации власти над правительством. Недавно Кадар подал в отставку с поста министра внутренних дел, сославшись на проблемы со здоровьем, многие подозревали, что он пытается избежать ареста, но это не защитило его. В настоящее время он подвергается допросу AVH и вскоре предстанет перед судом, чтобы предстать перед судом. Партия уже лишила его статуса."
 Golden_Team.1: "Сборная Венгрии по футболу за последнее время стала самой доминирующей командой под названием Golden Team. Команду возглавляет менеджер Густав Себеш, бывший профсоюзный организатор. Ведущими игроками являются Ференц Пушкаш, Сандор Кочиш, Нандор Хидегкути, Золтан Цибор, Йожеф Бозсик и Дьюла Грошикс. Sebes реализовал научную программу фитнеса, тактическую гибкость и требование универсальности всех своих игроков. Это позволяет команде играть в гораздо более динамичную игру, которая возбуждает толпы и побеждает в матчах. Команда доминировала над некоторыми традиционными футбольными центрами, включая потрясающую победу над Англией на их родной земле. Их победы хвалят правительство как пример превосходства социалистического человека. Среди венгров эти победы обнадеживают национальную гордость, которой немного озабочены некоторые сторонники жесткой линии коммунистов."
 Nagy.1.d: "Член Политбюро и бывший председатель Национального собрания Имре Надь был недавно назначен Председателем Совета министров Венгрии. Ветеран Первой мировой войны, он воевал за красных во время русской революции и в конце концов поселился в Москве. Он вернулся в Венгрию после Второй мировой войны и считается надежным партнером для Матиаса Ракоши. Он помог подписать несколько ордеров на арест во время недавней чистки, продемонстрировав свою преданность Ракоши. Москва также будет довольна назначением человека, который был основным информатором для НКВД во время его пребывания в Москве. Тем не менее, есть некоторые слухи относительно националистических тенденций Надя, хотя это, похоже, сдерживало его назначение."
 SOV_HUN.1.d: "Венгерское правительство запросило одобрение недавних реформ в рамках кампании «Новый курс в социализме» главы правительства Имре Надя. С момента своего назначения Надь предпринял ряд шагов, направленных на сокращение принудительных полномочий правительства. Он называет это Новым курсом, и это повлекло за собой освобождение политзаключенных и правовые реформы. Эти действия завоевали популярность Надя среди людей, но столкнулись с оппозицией внутри партии. Многие венгерские коммунисты полагают, что эти принудительные силы и действия являются тем, что поддерживает государство и является необходимым для социалистического преобразования Венгрии. Они боятся, что реформы Надя ослабят государство, доктринально противостоят советской модели и могут вызвать беспорядки. Это, безусловно, важные соображения, но следует отметить, что реформы улучшили отношения между людьми и государством, что может оказаться жизненно важным в ближайшие годы."
 SOV_HUN.2.d: "Советское правительство положительно отреагировало на нашу просьбу одобрить недавние реформы. Принятие Москвой нового курса социализма предсовмина Имре Надя заставит замолчать сторонников жесткой линии внутри партии и позволит нам расширить кампанию либерализации. Премьер-министр Надь в ответ отметил, что это одобрение позволит правительству более открыто и эффективно инициировать политику, желаемую венгерским народом, и поможет им отстаивать свою волю через правительство, посвященное народу. С советского благословения оппозиции внутри КПВ очень трудно открыто бросить вызов Надю."
 SOV_HUN.3.d: "Советский Союз решительно осудил реформы, начатые предсовмином Имре Надем. Они заявили, что реформы идут вразрез с доктриной, обслуживают контрреволюционеров и позволят внешним силам подорвать венгерское государство. Сильная советская оппозиция реформам стала серьезным ударом по премьер-министру. Оппозиция внутри Венгерской коммунистической партии смогла сплотить тех, кто был нейтральным, и теперь кажется, что правительство Имре Надя закончится. Из-за сильного осуждения со стороны Москвы, когда Надя снят с должности, он, вероятно, будет лишен своих руководящих постов в венгерской партии. Хотя это победа сторонников жесткой линии, многие венгры будут разочарованы смещением популярного лидера."
 Kadar.5.d: "Председатель Совета Министров Имре Надь в рамках своей попытки реформировать некоторые из более насильственных элементов венгерского государства освободил нескольких видных политических заключенных, в том числе Яноша Кадара. Кадар был восходящей звездой в партии до того, как его очистили и осудили на показательном процессе за его якобы оппозицию Сталину и Матиасу Ракоши. После освобождения из тюрьмы и реабилитации Кадар принял пост партийного секретаря промышленного сектора Будапешта. Он уже демонстрирует свое мастерство в качестве политического оператора, нанимая рабочих и формируя среди них сильных последователей. Многие в стране ожидают, что Кадар скоро вернется к известности, которую он имел до ареста."
 Rakosi.1.d: "Бывший венгерский силовик и страстный сталинист Матиас Ракоши был исключен на любую руководящую должность. Его гнетущий государственный аппарат, чистки и культ личности издавна отчуждали его не только от венгерского народа, но и от ведущих коммунистов в его собственной партии и Советском Союзе. Он рассматривается как пережиток прошлого времени, в котором социалистические государства пытаются развиваться и учиться. Во время Венгерской революции его собственные сторонники и преемники оказались в значительной степени неэффективными и неприкосновенными, подтверждая, что Ракоши нет места в будущем Венгрии."
 Hungarian_Collectivized.1.d: "Хотя первоначальные попытки сельскохозяйственной коллективизации в Венгрии закончились неудачей, последние попытки оказались очень успешными. Венгерское правительство объявило, что более девяноста процентов сельскохозяйственных земель являются собственностью колхозов. Правительство утверждает, что успех был обусловлен реформами и приверженностью правильному социалистическому подходу к этой проблеме. Аналитики отмечают, что последние усилия были гораздо более постепенными и не полагались на принуждение, чтобы вызвать коллективизацию. Угнетение в предыдущих усилиях также подавляло инновации и открытые дискуссии, которые также препятствовали этим попыткам. Правительство поздравило государственные органы и крестьян с коллективизацией и обещало будущий рост и процветание сельского хозяйства."
 Hungary_Anti_Semitic.1.d: "Семитизм и антисионизм растут среди венгров. На первый взгляд это кажется странным, учитывая, что коммунистический режим давно связывает традиционные антисемитские тропы с фашистским режимом Миклоша Хорти. Советский Союз долго утверждал, что все народы стали жертвами фашизма в последней войне, а те, кто подчеркивает страдания евреев во время Холокоста, рассматриваются как националисты, выступающие против социалистического единства. Венгрия последовала этому примеру и расправилась с сообщениями о Холокосте в стране, и любые активисты по реабилитации жертв евреев также подвергаются преследованиям. Сионизм также обвиняется в поощрении национализма и раскола, и венгерское правительство также подавляет этих сторонников."
 Wallenberg.1.d: "Был проведен ряд судебных процессов по поводу таинственного исчезновения и предполагаемой смерти Рауля Валленберга. Валленберг был шведским дипломатом и архитектором, который сыграл важную роль в организации спасения тысяч венгерских евреев, предоставив им безопасные убежища и защитные паспорта. После освобождения Будапешта советскими войсками Валленберг исчез, и многие полагают, что он умер под стражей в Советском Союзе. Однако венгерское правительство начало судебные процессы, чтобы доказать, что Советы не убили Валленберга. Вместо этого судебные процессы утверждали, что именно группа евреев Будапешта и бывших членов фашистского режима совершила убийство Валленберга. Все подозреваемые были осуждены в ходе судебных процессов, хотя многие международные наблюдатели осудили их как жертв показательных судебных процессов. Многие отмечают, что судебные процессы были удобным способом для коммунистического режима преуменьшить любую советскую причастность и вместо этого обвиняют фашистов и венгерскую еврейскую общину, причем обе группы в настоящее время подвергаются преследованиям со стороны государства."
 Kadar.2.d: "Комунистический лидер Янош Кадар назначен Генеральным секретарем КПВ. Кадар на протяжении всей своей карьеры проявлял умение превращать сторонников в партию и организовывать рабочих. Эта способность делает его влиятельной фигурой. С дискредитированными Матиасом Ракоши и его кликой Кадар является идеальным лидером для венгерского народа и советского правительства. Хотя он публично выглядит довольно лояльным по отношению к венгерской партии, он установил хорошие отношения с Советами. Что еще более важно он верит в советский порядок, и они доверяют ему работать над тем, чтобы Венгрия оставалась верным партнером в глобальном социалистическом порядке."
 Nagy_Executed.1.d: "В неожиданном объявлении правительство Венгрии объявило, что бывший предсовмин Имре Надь был казнен после осуждения венгерским судом. Суд хранил судебное разбирательство и вынесение приговора в тайне от общественности, объявляя об этом только после вынесения приговора. Правительство боялось общественного и международного протеста. Надь был осужден за измену и попытку свергнуть венгерское государство. Правительство отказалось разрешить любой доступ к могиле, и общественного протеста не было. Это связано с размещением сотрудников службы безопасности и политикой нулевой терпимости нынешнего правительства. Будучи предсовмином, Имре Надь стремился либерализовать общество, вернуть демократию и добиться венгерского нейтралитета, но его попытки потерпели неудачу после вторжения Советского Союза для восстановления коммунистического режима. Объявление о казни рассматривается по всей советской сфере как предупреждение лидерам, что их ждет, если они не подчинятся Москве."
 cam.1.d: "Король Нородом Сианук решил распустить Национальное собрание во главе с премьер-министром Йемом Самауром. Несколькими месяцами ранее премьер-министр Пенн Ноут столкнулся с участившимися нападками оппозиции из-за роста коррупции и экономических проблем в Камбодже. Его заменил Йем Самаур, бывший член Демократической партии и человек, тесно связанный с королевской семьей и традиционными элитами. Затем Демократическая партия оказала давление на короля, чтобы тот распустил собрание. Опасаясь, что Демократическая партия может попытаться мобилизовать своих уличных сторонников, король согласился. После роспуска Национальной ассамблеи Камбоджа будет управляться королевским указом до проведения новых выборов. Многие в стране надеются, что новое Национальное собрание будет лучше отражать интересы людей и обеспечит более стабильное управление в будущем."
 CAM_Recognition.2.d: "Король Нородом Сианук все больше признает, что продолжающийся контроль Франции над камбоджийскими министерствами и политикой привел к широко распространенным антифранцузским настроениям в стране. Это, в свою очередь, привело к критике монархии и правительства за соучастие во французском присутствии в Камбодже. Король недавно побывал во Франции и попросил полной независимости. Французское правительство отказалось, и в ответ король совершил международное турне по США и Канаде. Он отстаивал независимость Камбоджи как лучшее средство борьбы с коммунистическим влиянием в регионе перед восприимчивой аудиторией. По возвращении в Камбоджу король организовал массовые публичные митинги за независимость и благословил формирование нового ополчения для борьбы за независимость. Он также отказался вернуться в столицу, однако французы недавно вернули правительству несколько министерств и согласились обсудить независимость Камбоджи в ближайшем будущем."
 CAM_Exile.1.d: "После драматического переворота под предводительством Лон Нола и антивьетнамских беспорядков в Камбодже принц Нородом Сианук решил остаться за границей и не возвращаться в страну. Бывший король в радиопередаче обвинил новое правительство в краже власти и призвал камбоджийцев восстать против нового режима. Ожидается, что принц Сианук останется с дружественными правительствами недалеко от Камбоджи и организует международную поддержку возвращения своего правительства. Он также организует правительство в изгнании и, вероятно, также попытается организовать вооруженных боевиков, чтобы восстановить свое правление. Хотя его первоначальная трансляция действительно привела к протестам в столице, на данный момент новое правительство, похоже, твердо у власти, но Сианук, похоже, полон решимости объединить силы, чтобы положить конец новому правительству и восстановить его правление."
 CAM_Exile.2.d: "Принц Нородом Сианук вернулся сегодня в Камбоджу, чтобы возобновить церемониальные обязанности главы государства. Новое правящее правительство Камбоджи недавно предложило ему эту должность и призвало бывшего короля вернуться из ссылки. Принц Сианук поблагодарил новое правительство и народ Камбоджи за совместную работу с ним, чтобы положить конец прежнему режиму Лон Нола. Большинство камбоджийцев, независимо от политических взглядов, рассматривают монархию как жизненно важный институт стабильности и порядка в стране. Они в основном приветствуют возвращение бывшего монарха, хотя многие считают, что ему следует ограничиться своим церемониальным положением и не стремиться заниматься политикой, как это было в прошлом. Многие хотели бы, чтобы церемониальная монархия была официально восстановлена в ближайшее время, а Сианук восстановлен как король."
 Rep_Cam.1.d: "Принцу Нородому Сиануку сообщили, что губернатор Чхуон замышляет переворот против правительства. Подробности были неясными, и принц решил подождать, чтобы получить больше информации. Это закончилось ошибкой, так как заговорщики обнаружили в принце нового и немедленно начали действовать. Бойцы кхмеров серай подняли восстание на северо-востоке. Принц послал войска, чтобы подавить его, но они оказались неэффективными. Это усилило напряженность и беспокойство в столице. Когда принц попытался приказать большему количеству войск двинуться, военные обвинили принца в том, что он не поддерживает порядок. После того, как военные обеспечили безопасность ключевых государственных учреждений и политиков, они объявили, что к власти придет новое правительство, состоящее из многих антикоммунистов. Новое правительство тогда провозгласило, что Камбоджа теперь будет называться Республикой Камбоджа, и ее народ больше не будет пешками коммунистических иностранцев или равнодушным монархом."
 Assasination_Nop.1.d: "Ноп Бофанн был ведущим редактором газеты. Он был застрелен сторонником Объединенного Иссаракского фронта в столице, недалеко от главных военных казарм. Объединенный Иссаракский фронт был антиколониальной левой камбоджийской группой сопротивления, которая вела войну против французских колониальных властей. Убийство разозлило многих сторонников левых и коммунистов по всей стране. Это оказывает огромное давление на правительство Камбоджи, которое пытается поддерживать баланс с коммунистическими и антикоммунистическими фракциями, действующими в стране. Многие опасаются, что это убийство было заказано антикоммунистическими военными, которые стремятся дестабилизировать ситуацию и заставить правительство действовать против коммунистов, спровоцировав реакцию левых. Однако сторонники антикоммунистических фракций отмечают, что это мог быть коммунистический заговор с целью подставить их и заставить правительство принять жесткие меры против их сторонников. Убийство вызвало нестабильность и напряженность по всей стране."
 VIN_CAM.1.d: "Высокопоставленные представители Республики Вьетнам и Камбоджи недавно подписали Договор о взаимной обороне. Соглашение обязывает обоих соседей защищать и помогать друг другу от внешних угроз. Многие рассматривают договор как прямой вызов коммунистическому Северному Вьетнаму, которого обвиняют в разжигании беспорядков и размещении войск в этих государствах. Действительно, представитель Северного Вьетнама отметил, что это соглашение создано одним из двух марионеточных режимов, отчаянно пытающихся обеспечить, чтобы их незаконные режимы оставались у власти, несмотря на желания людей. Однако и Камбоджа, и Южный Вьетнам настаивают, что их не беспокоит такая реакция, и этот договор отражает общие интересы и исторические узы, связывающие обе страны."
 Bangkok_Coup.5.d: "Принцу Нородому Сиануку сообщили, что губернатор Чхуон был главным заговорщиком в заговоре против его правительства. Принц Сианук решил действовать немедленно и развернул батальон войск, чтобы арестовать Чхуона. В конце концов он был схвачен войсками, которые также задержали американского гражданина, работавшего с ним. Во время допроса Чхуон начал признаваться, но быстро умер при неизвестных обстоятельствах. Он не раскрыл всех сообщников, и принц подозревает, что Чхуон не выдержал допроса, потому что военачальники не хотели быть замешанными. Принц знает, что кхмерские сераи должны были стать военной силой для реализации заговора, и работали с антикоммунистическими политиками. Отныне они и кхмерские сераи будут находиться под пристальным наблюдением."
 Bangkok_Coup.1.d: "После окончания Второй мировой войны правительство Камбоджи, возглавляемое Нородомом Сиануком, изо всех сил пыталось сбалансировать свои отношения с коммунистами, антикоммунистами и традиционными элитами. Это разочаровало многих, и те, кто справа, тесно сотрудничают с агентами разведки из Таиланда, а некоторые говорят, что даже Соединенные Штаты планируют действия по смещению принца Сианука. Они хотят сменить принца и установить твердый антикоммунистический режим, чтобы защитить Камбоджу от посягательств коммунистов, особенно со стороны ее соседей. Бывший королевский советник Сэм Сари, работая с могущественным командиром националистических ополченцев Сон Нгк Тхань и губернатором Дап Чуон, планируют использовать ополчение для подстрекательства восстания на северо-востоке. Затем из хаоса они захватили бы власть с помощью союзников в столице. Сари и Тхань готовы к действию и приводят сюжет в действие ..."
 Bangkok_Coup.2.d: "Принцу Нородому Сиануку сообщили, что боевики подняли восстание на северо-востоке страны. Он не знал, что эта сила содействовала попытке переворота, сея беспорядки. Первоначально принц думал о немедленном отправлении войск для подавления беспорядков, но вместо этого он сначала решил обратиться к народу. Он призвал граждан объединиться против угрозы Камбодже и дополнил вооруженные силы местными силами. Это имело решающее значение, поскольку именно они обнаружили боевиков кхмерских серайцев и быстро отбросили их на свои базы. Заговорщики надеялись, что инсценированное восстание посеет панику и заставит людей и военных потерять веру в принца, способствуя перевороту, но вместо этого у власти остался принц Сианук. В отчаянии некоторые военные офицеры, причастные к заговору, действительно пытались организовать переворот, но им это не удалось, и по мере допроса выясняются все подробности и участники. Ожидаются массовые аресты и задержания."
 destalinization.0.d: "Восхождение Никиты Хрущева на пост Генерального секретаря ЦК КПСС ознаменовало начало новой эры. Хрущев быстро решил, что ему нужно ослабить репрессии сталинской эпохи, контроль и агрессивную внешнюю политику. Хрущев может приступить к реализации этого амбициозного проекта преобразования советского общества благодаря своей способности вступать в союз с могущественными группировками и находить лояльных сторонников по всей советской системе. Его крестьянское прошлое также способствует его авторитету. Однако по мере того, как Хрущев работает над устранением худших аспектов предыдущего режима, ему придется иметь дело с амбициозными соперниками и стойкими сталинистами, которые не ценят эту кампанию открытости, особенно по отношению к врагам государства. Хрущев считает, что эпоха десталинизации оживит Советский Союз в его борьбе против капиталистического мира."
 Khruschev.100.d: "После смерти Иосифа Сталина Никита Хрущев смог мобилизовать своих сторонников более эффективно, чем его соперники, и обеспечить себе власть. Благодаря союзу с высшим командованием Красной Армии и назначению молодых ставленников на ключевые должности, Хрущев перехитрил консервативных сторонников жесткой линии из ближайшего окружения Сталина. Выдающиеся сталинисты, такие как Лаврентий Берия, были подвергнуты чистке, в то время как другие были отодвинуты на задний план, прежде чем их оттеснили на пенсию. Чтобы заменить этих людей, Хрущев начал продвигать молодых амбициозных людей, разделяющих его видение советского общества. Хотя эти люди могут оказаться проблемой в будущем, в настоящее время Хрущев успешно устраняет сторонников жесткой линии и сильную старую гвардию с помощью более молодых, лояльных сторонников, которые на несколько лет далеки от того, чтобы бросить ему вызов."
 Lysenko.1.d: "На протяжении десятилетий сельскохозяйственные и биологические теории Трофима Лысенко были единственными приемлемыми теориями развития сельского хозяйства. Эти теории, получившие название лысенковщины, осуждали генетиков и более научные методы сельского хозяйства как капиталистические и неправильные. Он отверг концепцию естественного отбора и идею гена. С одобрения Сталина сторонники Лысенко задержали тысячи биологов и генетиков. Любая критика его работы осуждалась и каралась арестом. Однако в последние годы после смерти Сталина советское правительство прекратило поддержку Лысенко, и теперь публикации, в том числе связанные с государством, открыто осуждают лысенковщину. Этот сдвиг объясняется новым ослаблением цензуры, и многие университеты теперь возвращают ученых-агрономов."
 destalinization.1.d: "В обращении к ЦК Никита Хрущев осудил то, что произошло во время ленинградского дела. «Ленинградское дело» было чисткой ведущих сталинских чиновников от Сталина и его спецслужб. В то время он был изображен советским людям как заговор ленинградских чиновников для захвата власти. Хрущев в своих замечаниях отметил, что обвинения против ленинградских советских чиновников были сфабрикованы или сфабрикованы Леврентом Берией под руководством Иосифа Сталина. Он призвал к реабилитации выживших жертв ленинградского дела и в своем выступлении подверг критике нескольких влиятельных сталинистов в ЦК. Хрущев не только выявил жертв ложной чистки Сталиным, но и привлек к участию тех сталинистов, которые все еще сидят в Комитете, включая его соперника Маленкова, он ослабил их и укрепил свою собственную позицию."
 VLC.1.d: "Сельскохозяйственный сектор Советского Союза долгое время был предметом беспокойства для правительства. При Сталине принудительная коллективизация стремилась удержать крестьян на земле, но эта жесткая политика часто приводила к разочаровывающей урожайности, гибели большого количества людей и крестьянскому недовольству. Режим Никиты Хрущева выбрал амбициозный проект под названием «Кампания на целинных землях», призванный значительно увеличить производительность сельского хозяйства в Советском Союзе путем возделывания миллионов гектаров ранее необрабатываемых земель. Эти предлагаемые земли расположены на землях к востоку от Волги до Западной Сибири. Кроме того, Хрущев расширит политику сельскохозяйственной реформы, чтобы стимулировать производительность и улучшить условия жизни фермеров. У амбициозного плана есть недоброжелатели, обеспокоенные затратами и осуществимостью, но Хрущев не будет удерживаться от своей цели привести сельскохозяйственную революцию. Правительство начало агрессивную пропагандистскую кампанию, направленную на то, чтобы молодые советские граждане переселились на эти земли из патриотического долга. Пока что ответ был очень положительным."
 destalinization.2.d: "Новый советский лидер Никита Хрущев стремится укрепить свое правление и положить конец тому, что он считает разрушительной политикой сталинской эпохи. В рамках этих усилий Хрущев распорядился освободить миллионы политзаключенных из страшных тюрем ГУЛАГа. Хрущев отметил, что многие из осужденных были отправлены за очень мелкие правонарушения или отбывали наказание, но не были освобождены. Новость была хорошо принята по всему Советскому Союзу, особенно от членов партии, многие из которых имеют друзей или семью, которые были отправлены в эти лагеря по приказу Сталина. На более практическом уровне число заключенных выросло до опасно высокого уровня, и многие сообщения о беспорядках или восстаниях заключенных доходили до Москвы. Хрущев надеется смягчить это потенциальное волнение и получить политический кредит от многих в Советском Союзе, которые аплодируют этой акции."
 Sov_Missle.1.d: "Поскольку Советский Союз расширяет свой ядерный арсенал и системы доставки, министерство обороны решило создать Ракетные войска стратегического назначения (РВСН) в качестве военной ветви Советского Союза. РВСН будет контролировать все советские баллистические ракеты, их организацию, размещение, а также будет испытывать новые ракетные системы. Ожидается, что при РВСН будут организованы новые формирования, и Советы надеются, что эта отрасль упростит разработку, производство и развертывание ракет. Эта новая военная отрасль отражает растущую важность стратегического военного оружия и важность таких активов. На международном уровне SMF будет тщательно изучен в качестве модели того, как другие страны с такими системами оружия могут еженедельно организовывать их."
 Baikonur.1.d: "По мере того, как Советский Союз расширяет свою программу баллистических ракет и участвует в разработке новых систем, потребность в испытательной и пусковой стороне возросла. Чтобы решить эту проблему, советское правительство открыло новую ракетно-испытательную площадку на юге Казахстана под названием космодром Байконур. Массивное сооружение (пролет 90 км) потребовало строительства новой инфраструктуры и нового города для размещения необходимого персонала. Что еще более важно, когда объект вступает в эксплуатацию, Советы также определили этот участок в качестве основного космодрома для Советского Союза. Технология и ракеты для космической программы будут разрабатываться и запускаться с объекта. Объект расположен недалеко от экватора, и его погода считается идеальной для будущих ракетных и космических запусков. Объект находится под строгой охраной и секретностью, чтобы защитить советские космические и ракетные разработки от враждебных иностранных держав."
 KGB.1.d: "Советское правительство решило реорганизовать свои спецслужбы и создать Комитет государственной безопасности, или КГБ. В прошлом руководители советской разведки консолидировали чрезмерную власть, которая иногда угрожала Советскому государству. Ожидается, что эта новая организация предотвратит накопление энергии и упростит не только операции по разведке внутри страны, но и за ее пределами. Различные типы разведки и регионов будут возглавляться отдельными управлениями, которые все отвечают перед председателем. Эта структурная схема помешает любому официальному лицу консолидировать власть и повысит эффективность сбора информации. Организация действует в качестве преемника успешной НКВД эпохи Второй мировой войны и, как ожидается, сыграет важную роль в обеспечении коммунистического правления и поддержке коммунистических движений по всему миру."
 SOV_COL.1.d: "Давно угнетенные крестьяне в Колумбии недавно начали организовываться против капиталистической эксплуатации. Их организация называется Революционные вооруженные силы Колумбии или ФАРК. ФАРК начал вооруженную борьбу в ответ на эксплуатацию, а также на политические репрессии в Колумбии, в результате которых популисты и социалисты замолчали в результате насилия. Советская разведка оценивает потенциал организации и принимает социалистические ценности. Имея это в виду, Советский Союз решил направить военную помощь ФАРК и помочь ей в ее борьбе. Советская помощь поможет преодолеть разногласия и поможет крестьянам защитить себя от капиталистического и насильственного колумбийского государства. Расширение советского влияния в Колумбии также позволит Советам проецировать свою власть в западном полушарии."
 SOV_ALG.1.d: "Французы долго эксплуатировали и злоупотребляли народом Алжира своим колониальным проектом. Теперь алжирцы ведут борьбу со своей организацией, Фронтом национального освобождения или ФНО. НФО организует крестьян и других эксплуатируемых людей и ведет их в вооруженную борьбу против жестокой французской армии, поддерживаемой местными сотрудниками. НСО обещает новый режим социализма и экономического равенства для Алжира. Чтобы помочь этим усилиям, Советский Союз согласился начать предлагать помощь НСО. Советская поддержка будет иметь решающее значение в оказании помощи алжирцам в борьбе против современных французских военных. Что еще более важно для Советов, подрыв французского правления и получение алжирской поддержки могут оказаться жизненно важными в долгосрочной перспективе. Что еще более важно, помощь НСО подтверждает Советам давнюю оппозицию империализму и его эксплуатации колонизированных народов."
 SovFlySub.1.d: "В конце 1930-х годов советский военно-морской флот исследовал идею создания и испытания самолета, который затем мог погрузиться в воду, это было названо Программой летающих подводных лодок. Его возглавил инженер Борис Ушаков, и хотя программа имела раннюю поддержку, она была отложена до 1940 года, поскольку военно-морской флот пришел к выводу, что предложенный самолет не осуществим. Однако Советы под руководством Лавреницы Берии возобновили программу после окончания войны. Советы недавно построили испытательный самолет, и результаты оцениваются. В идеале летающая подводная лодка потенциально может сыграть роль в нацеливании на жизненно важные корабли противника. Однако, похоже, проблема с самолетом - это его вес. Что еще более важно, поскольку враги Берии становятся все более заметными в советском руководстве, маловероятно, что они продолжат программу, которую он начал."
 TU_114.1.d: "На недавней Всемирной выставке в Брюсселе Советы показали новую пассажирскую авиакомпанию, Ту-114. Этот массивный пассажирский самолет способен выполнять трансокеанские полеты, имеет спальные места для пассажиров и является самым быстрым пропеллерным самолетом в истории, способным соответствовать скоростям реактивных авиалайнеров. Советский премьер Никита Хрущев, стремящийся продемонстрировать эту блестящую советскую технологию, решил полететь на самолете во время своего визита в Соединенные Штаты. Хотя высокопоставленные советские чиновники были обеспокоены доверием самолета, находящегося в стадии разработки, Хрущев настоял на том, чтобы взять его. По прибытии многие в международной прессе были впечатлены его размерами и возможностями, утверждая, что он превосходит любой западный пассажирский самолет, представленный на рынке. Полет Ту-114 стал крупным успехом для Хрущева и его кампании по демонстрации советской изобретательности миру."
 Khruschev_Agri.1.d: "Советский п Никита Хрущев происходит из крестьян и рассматривает революцию в сельском хозяйстве как свою главную цель. Однако он решил игнорировать советы ведущих агрономов, многие из которых заявили, что правительству необходимо вкладывать значительные средства в сельское хозяйство, а вместо этого слушать Трофима Лысенко. Лысенко, фаворит Сталина, пообещал создать рекордный рост сельского хозяйства с ограниченными инвестициями. Методы Лысенко отвергают современные научные методы, в частности от генетиков и ботаников. Хрущев, как и Сталин, верит своим аргументам. Однако, в отличие от Сталина, Хрущев не очищал и не задерживал тех, кто выступает против Лысенко, и позволял ученым открыто критиковать его. Однако, несмотря на научную критику и отсутствие результатов того, что обещал Лысенко, Хрущев продолжает полагаться на продолжение своих традиционных методов советского сельского хозяйства."
 cpsu.20.d: "Двадцатый съезд Коммунистической партии Советского Союза завершился после заседания в течение более десяти дней. Это первая конференция, проводимая под руководством советского премьера Никиты Хрущева, и он решил сделать Конгресс осуждением чисток и насилия сталинской эпохи. Хрущев в последний день съезда изложил это в своей секретной речи под названием «О культе личности и его последствиях». В своей речи Хрущев обвинил Сталина в культе личности и раскритиковал его чистки по поводу воображаемых угроз. Речь также затрагивала высокопоставленных советских чиновников того времени, которые помогали Сталину проводить его чистки. Реакция на эту речь была неоднозначной, многие хвалят Хрущева за то, что он говорил правду, в то время как многие сторонники жесткой линии или приверженцы Сталина, успешного советского лидера военного времени, обвинили Хрущева в ревизионизме. Ожидается, что новости о выступлении потрясут коммунистический мир до глубины души."
 Doctors_Plot.10.d: "Во время своей речи, осуждающей чистки сталинской эпохи, советский премьер Никита Хрущев рассказал о знаменитой чистке врачей, которая произошла незадолго до того, как смерть Сталина была фактически основана на сфабрикованных доказательствах. Он заявил, что врачи были невиновны и были спасены только смертью Сталина. Хрущев заявил, что Сталин сказал судье, который рассматривает дело, чтобы вынести обвинительные приговоры и избил врачей за ложные показания. Что еще более важно, Хрущев связал этот заговор с антисемитизмом Сталина, а сфабрикованный заговор стал первым шагом к общепартийной чистке. Разоблачения Хрущева ошеломили многих, поскольку пресса под руководством Сталина обнародовала важные новости по всей стране. Критики Хрущева отмечают, что он был старшим участником в это время и был доволен заговором. Они предполагают, что он говорит сейчас только как средство укрепления своей политической позиции."
 APG_Fail.1.d: "После публичного осуждения Сталина советским премьером Никитой Хрущевым, он вызвал много гнева со стороны чиновников сталинской эпохи и других, которые считают Хрущева лицемерным, учитывая его высшее положение во время чисток, которые он критиковал. Фракция этих людей сформировала клику, в которую вошли Григорий Маленков, Вячеслав Молотов, Лазарь Каганович, Дмитрий Шепилов и другие. Группа пыталась свергнуть Хрущева на драматическом заседании ЦК, на котором Хрущев назвал группу Антипартийной группой. До голосования советский министр обороны, герой войны генерал Георгий Жуков угрожал уничтожить Антипартийную группу, даже если их голосование будет успешным из-за их преступлений при Сталине. Однако голосование провалилось, и Хрущеву пришлось решить, куда понизить членов Антипартийной группы."
 KhruschevRel.1.d: "Рожденный крестьянином советский премьер Никита Хрущев всегда относился к религии с подозрением. Он глубоко воспринял марксистскую критику религии и считал ее основной угрозой просвещению и социалистическому развитию людей. Хрущев видел в отмене религиозных ограничений во время Второй мировой войны ошибку и после прихода к власти начал новую волну репрессий против Русской Православной Церкви. Многие церкви закрываются, записываются участники церковных служб, родители ограничены в том, какую религию они могут преподавать детям, а детям запрещено посещать службы. В дополнение к этим новым ограничениям, священники, нарушающие какое-либо из правил, быстро арестовываются, в то время как те, кто озвучивает жалобы, также сталкиваются с вопросами или задержанием со стороны государства."
 KhruschevRel.2.d: "В рамках антирелигиозной кампании советского премьера Никиты Хрущева Советское правительство закрывает рекордное количество русских монастырей. Любые члены, которые жалуются или не подчиняются приказам о закрытии, подвергаются аресту и преследуются государством за нарушение закона. Кроме того, новые правила запрещают паломничество, которое поразило некоторые из наиболее популярных монастырей. Эти закрытия являются частью более широкого преследования Русской Православной Церкви. Источники в правительстве указывают, что советское правительство, возможно, надеется закрыть две трети существующих церквей с момента прихода к власти Хрущева. Правительство заявляет, что оно просто осуществляет уже установленные законы и указывает, что церковь имеет контакты с иностранными группами и может действовать, чтобы подорвать Советский Союз изнутри."
 APG_Fail.2.d: "Лазарь Каганович и Дмитрий Шепилов оба были высокопоставленными членами партии, участвовавшими в недавней попытке свергнуть советского премьера Никиту Хрущева. Они пытались проголосовать против него во время заседания ЦК, но голосование провалилось, и они потерпели поражение. После потери голосования и Каганович, и Сепилов были отправлены в небольшие промышленные учреждения за Уралом в качестве наказания. Эти бывшие высокопоставленные члены партии были значительно сокращены в статусе и положении. Однако Хрущев отметил, что если бы они попытались сделать то, что сделали со Сталиным, наказание было бы намного хуже. Время покажет, смогут ли эти два человека когда-либо примириться с Москвой или это знаменует конец их карьеры."
 APG_Fail.3.d: "Вячеслав Молотов, один из руководителей недавней попытки свергнуть премьер-министра СССР Никиту Хрущева, был назначен послом СССР в Монголии. Это наказание за его роль в заговоре после того, как ЦК проголосовал против смещения Хрущева. Бывший министр иностранных дел Сталина и давний высокопоставленный советский лидер были изгнаны и унижены этим назначением. Хрущев считает, что это всего лишь наказание за его попытку свержения, и отметил, что при Сталине наказание было бы намного хуже. Хотя Молотов потерпел поражение и сталинская эра продолжает подвергаться нападкам со стороны правительства Хрущева, он по-прежнему убежден в том, что он и Сталин действовали в лучших интересах советского народа."
 Khruschev_yug.1.d: "Отношения с Советским Союзом и Югославией быстро ухудшались после Второй мировой войны. Советский лидер Иосиф Сталин пытался заставить президента Югославии Иосипа Тито подчиниться его указаниям. Тито отказался, и после нескольких враждебных писем друг другу отношения оставались очень холодными. Однако советский премьер Никита Хрущев сделал примирение и позитивные отношения с Югославией одной из главных целей своей внешней политики более дружественных отношений. Хрущев недавно посетил Белград, и, несмотря на то, что Тито изначально проявлял враждебность, был достигнут прорыв, и оба они согласились восстановить более тесное сотрудничество между двумя коммунистическими государствами. Хотя поездка была успешной, среди других коммунистических партий в мире грохочут, что Хрущев мирится с режимом, который имеет опыт реализации либерального коммунизма. Сторонники Хрущева возражают, что объединение всего коммунистического мира важно для предотвращения капиталистической эксплуатации."
 sinosovietsplit.1.d: "Придя к власти, советский премьер Никита Хрущев стремился продолжать укреплять связи с коммунистическим правительством Китая. Советские эксперты, помощь и оружие очень помогли китайцам в их усилиях по восстановлению страны после десятилетий войны. Однако в последнее время отношения начали разрушаться после решения Хрущева десталинизировать и публично осудить своего предшественника. Кроме того, китайцы выступили против советских усилий по улучшению связей с Западом и с коммунистическими государствами, которые, как считается, не смогли реализовать надлежащие марксистско-ленинские режимы. Эта напряженность закипела во время недавнего визита Хрущева в Китай, в результате чего советский лидер ушел рано. В конечном итоге это закончилось тем, что Советы отозвали своих советников, а Китай ослабил связи после недавнего Конгресса Коммунистической партии Румынии, где обе нации публично застрелили друг друга. Этот советско-китайский раскол является основным разделением коммунистического мира, и многие опасаются, что Запад может попытаться использовать это в своих интересах."
 KMT.10.d: "В Китайской Республике правящая партия Гоминьдан объявила о высылке Лэй Чена, бывшего советника президента и основателя периодического издания «Свободный Китай». Хотя «Свободный Китай» был основан как независимое издание, свободное для открытого обсуждения вопросов и противопоставление жестокости контролируемых коммунистами СМИ, Гоминьдан считает недавние публикации в «Свободном Китае» опасными. В частности, в нескольких статьях Гоминьдан критиковался за несоблюдение конституционных процедур, особенно с точки зрения ограничения срока полномочий, и правительство считало, что за этой критикой стоит Лэй Чен. Лэй Чен является известным сторонником конституции, и, похоже, такая позиция стоила ему членства в партии. Ожидается, что он и дальше будет отстаивать свои убеждения."
 Formosa.10.d: "Движение 228 ссылается на массовые убийства и жестокое подавление тайваньских демонстрантов контролируемой Китайской Республикой 28 февраля 1947 года. Протесты против коррупции и нападения на вдову со стороны государственных чиновников привели к развертыванию войск, которые убили тысячи людей. Это также спровоцировало жестокую кампанию репрессий против тайваньского народа, которому было запрещено обсуждать или вспоминать события. Все это усилило напряженность между тайваньцами и материковыми китайцами. Многие тайваньцы не забыли и продолжают рассматривать эти события как наглядный пример коррупции и жестокости китайского Гоминьдана. Они также видят в этом доказательство того, почему Тайвань должен быть свободным и независимым, чтобы управлять своей судьбой."
 Formosa.11.d: "В результате поразительного развития событий в Китайской Республике правящее правительство рухнуло, что привело к восстанию, которое возглавили тайваньцы, возмущенные господством и контролем над своим островом после прибытия гоминьдана из материкового Китая после их поражения во время гражданской войны в Китае. В предыдущие дни по всему острову, особенно в столице Тайбэя, тысячи людей вышли на улицы. Правительство направило полицию и армию с приказом прекратить протесты с помощью насилия, но это только побудило больше людей присоединиться к протестам. Когда правительство приказало войскам использовать огнестрельное оружие, многие войска отказались и присоединились к восстанию. Без поддержки военных правительство сдалось, и многие бежали в дружественные дипломатические миссии или в аэропорт в поисках защиты. Газеты в стране объявили об успехе Формозской революции."
 Formosa.12.d: "Недавняя Формозская революция привела к тому, что население острова, жившее до прихода Гоминьдана в 1945 году, наконец взяло остров под свой контроль. Революционеры недавно объявили о создании нового Временного правительства Формозы, чтобы перевести остров в новую эру инклюзивного и справедливого управления. Во время беспорядков некоторым бывшим правительственным чиновникам и сторонникам удалось бежать, но многие из них остаются на острове, особенно беженцы, бежавшие из материкового Китая от коммунистов. На данный момент новое правительство заявило, что за этими людьми будут внимательно следить, особенно за теми, кто совершил преступления, и как только правительство установится, оно будет решать, что делать с беженцами. Заявление не было воспринято беженцами как обнадеживающее, и многие сторонники Гоминьдана также обеспокоены священной миссией освобождения материка."
 Formosa.100.d: "Новый государство Формоза недавно объявило в общенациональном эфире, что аннулировало все претензии на материковый Китай. Они заявили, что нация больше не будет посвящать свои усилия и жертвовать своими ресурсами делу, которое не имело большого значения, кроме как для беженцев и сторонников Гоминьдана. Формоза заботится только о благополучии, безопасности и развитии своих людей. Они добавили, что, отступив от этих земельных претензий, они надеются установить дружеские, добрососедские отношения с коммунистическим режимом Китая, но по-прежнему будут заботится о защите своих границ от агрессии. Официального ответа из Пекина не последовало, но многие аналитики полагают, что заявление Формозы, скорее всего, не изменит позицию правительства материкового Китая о том, что остров является провинцией Китая и должен быть возвращен стране."
 KMT.110.d: "Китайская Республика (КР) и ее правящая партия Гоминьдан приветствовали президентский визит американского президента [USA.GetLeader]. Визит в столицу широко освещается островной прессой, чтобы подчеркнуть уровень международной поддержки, на которую Китайская Республика может рассчитывать в своей борьбе за освобождение Китая. Ожидается, что две страны обсудят расширение сотрудничества в области обороны, торговли и региональной безопасности. Президент [USA.GetLeader] встретится с ведущими правительственными чиновниками и, как ожидается, посетит культурные объекты по всей стране. Коммунистическое правительство Китая выпустило собственное заявление, в котором осудило Соединенные Штаты за вмешательство во внутренние дела Китая и подтвердило, что вскоре оно вернет мятежный остров. В ответ политик Китайской Республики осудил заявление с материка и добавил, что визит узаконивает правительство Гоминьдана и поможет заставить замолчать критиков его целей."
 KMT.201.d: "Сегодня на острове Тайвань произошел государственный переворот против генералиссимуса Чан Кай-Ши. По словам властей и военных представителей, генерал Сунь-Ли Джен, один из лучших генералов и лидеров Китайской Республики, совершил военный переворот с целью свержения того, кого он называет «неудавшимся лидером, позорным для китайской нации». Будучи одобренными американцами, многие заявляют, что переворот был поддержан ЦРУ и президентом США, но до сих пор эти утверждения не имели никакой поддержки; похоже, что это будет слух среди множества слухов о показаниях Чанга."
 KMT.150.d: "Роммель Востока, генерал Сунь-Ли Джен, сегодня был взят властями по приказу генералиссимуса Чан Кай-Ши; утверждая, что первый планировал военный переворот с целью свергнуть и подавить китайцев на Тайване, Кай-Ши пообещал сурово наказать генерала, будучи обвиненным в некоторой халатности, позволившей своим подчиненным участвовать в восстании с участием агентов коммунистов; В данный момент генерал находится под домашним арестом, ожидая своей судьбы."
 AntiRevBul.1.d: "Недавняя кампания десталинизации и мирного сотрудничества с некоммунистическими государствами со стороны советского правительства спровоцировала рост антиревизионистской критики в Болгарии. Критики новой советской политики осудили Советы за то, что они были ревизионистами. и угроза правильному осуществлению марксистско-ленинской идеологии. Еще более важно то, что политика Москвы по содействию мирному сосуществованию с глобальными капиталистическими державами и улучшению связей с коммунистическими государствами, которые не полностью охватывают марксизм-ленинизм, рассматривается как ослабление революции. Антиревизионистская критика быстро распространяется в Болгарии и оказывает давление на болгарскую коммунистическую партию, чтобы она открыто критиковала Советский Союз и продолжала свою практику. Тем не менее, партия признает сохраняющуюся необходимость в советской поддержке и, как ожидается, реформирует руководство и управление в соответствии с новым советским подходом."
 Bul_Purge.1.d: "Болгарское правительство объявило о казни Антона Югова за предательство Болгарской коммунистической партии и ее идеологии. Это происходит на фоне крупной чистки в Болгарии. Следуя примеру Советского Союза, Антон Югов выступил за то, чтобы сделать партию более открытой, болгарской и устранить сталинское влияние. Однако старая гвардия пережила эту новую угрозу и, оставшись под контролем правительства, отвергла идею смены партийных идей. Чтобы укрепить свой постоянный контроль над страной, они очищают Болгарскую коммунистическую партию от того, что они обвиняют в качестве ревизионистов, которые стремятся подорвать реализацию марксистского ленинизма. Антон Югов был старшим руководителем партии со времен Второй мировой войны и занимал высокие посты вплоть до его ареста и последующей казни."
 Bul_Purge.2.d: "Болгарское правительство объявило о казни Тодора Живкова за предательство Коммунистической партии Болгарии и ее идеологии. Это происходит на фоне крупной чистки в Болгарии. Следуя примеру Советского Союза, Тодор Живков выступал за то, чтобы сделать партию более открытой, болгарской и устранить сталинское влияние. Однако старая гвардия пережила эту новую угрозу и, оставшись под контролем правительства, отвергла идею смены партийных идей. Чтобы укрепить свой постоянный контроль над страной, они очищают Болгарскую коммунистическую партию от того, что они обвиняют в качестве ревизионистов, которые стремятся подорвать реализацию марксистского ленинизма. Тодор Живков воевал как партизан во время Второй мировой войны и вступил в партию после. Он занимал руководящие должности и был убежденным сторонником жесткой политики Сталина, пока Москва не объявила о своем новом подходе и отказе от сталинских практик. Однако этот сдвиг оказался ошибкой, поскольку старая гвардия сохранила власть и теперь очистила его."
 Protivobalgarska.1.d: "КПБ решила изменить свою политику после Второй мировой войны в отношении региона Пирин Македония. Советский лидер Иосиф Сталин поручил Болгарии предложить культурную автономию региону и признать население македонским. Это привело к тому, что болгарское государство начало политику провозглашения жителей Македонии и насильственного перемещения других объявленных македонцев в регион, чтобы установить свою культурную самобытность. Противники политики были арестованы или объявлены государством фашистами. Многие жители региона отмечены как болгарские спикеры и члены болгарской церкви. Мотивацией для македонизации были планы составления федерации с Югославией, и правительство даже поручило органам переписи населения определить регион в качестве большинства македонцев для соединения с соседним югославским македонским регионом. Однако теперь эти планы закончились из-за раскола Югославии с Москвой, и регион снова называют болгарским."
 Bul_Purge.5.d: "Тодор Жиков был отстранен от должности в болгарском правительстве и, как ожидается, будет официально исключен из Болгарской коммунистической партии. Бывший партийный лидер Второй мировой войны и высокопоставленный член партии допустили критическую ошибку, приняв на себя десталинизацию и ослабление государственного контроля, к которому призывало советское правительство. Жиков думал, что, следуя примеру Москвы, он сможет получить контроль над партией, снять старую гвардию и одновременно получить общественную поддержку. Однако его попытка захватить власть в ЦК потерпела неудачу, и его торжествующие враги решили, что Жиков должен быть полностью отстранен от власти. Ожидается, что союзники Жикова будут смещены с властных постов в ближайшие недели."
 Bul_Purge.10.d: "Трайчо Костов, бывший глава КПБ, был посмертно реабилитирован и вновь принят в партию после доклада Центрального комитета по делу о Костове. Костов был арестован по обвинению в том, что он агент западных спецслужб, подрывает советские отношения и защищает национализм за счет марксистско-ленинского единства. После его ареста и казни сторонники его партии также были арестованы и приговорены к длительным срокам. Новые объятия десталинизации привели к тому, что Болгарская коммунистическая партия пересмотрела эти испытания и создала комиссии для рассмотрения этих испытаний. Они пришли к выводу, что ошибка культа личности привела к неправомерному осуждению Костова и его сторонников. Те, кто еще находился в тюрьме, также были освобождены и реабилитированы."
 Bul_Purge.11.d: "Партизанская фракция в КПБ обнаружила, что ее позиция все более ограничивается внутри партии. Коммунистические партизаны, которые сопротивлялись фашистскому режиму и силам Оси, после войны сыграли важную роль в организации государственного переворота, который привел к власти КПБ. Недавний сдвиг в Москве к десталинизации и мирному сотрудничеству ознаменовал сдвиг в коммунистическом мире. В Болгарии это привело к появлению новой группы лидеров, которые выступают за смену сталинской старой гвардии и осуществление локальной десталинизации внутри страны. Этот сдвиг привел к тому, что партизанская фракция потеряла влияние и статус в партии, поскольку они в значительной степени приняли сталинскую линию."
 AntiRevBul.2.d: "ЦК КПБ неожиданным решением объявил, что принимает антиревизионизм. Это знаменует собой удар по Советскому Союзу и его недавним объятиям десталинизации и дружественному сотрудничеству с капиталистическими государствами. Критики этого советского изменения политики Сталина обвиняют Москву в том, что она ревизионистская. Приняв эту позицию, болгарская старая гвардия получила поддержку и, как ожидается, будет твердо контролировать Болгарию. Тем не менее, предыдущие, теплые связи между советским и болгарским правительством, вероятно, будут негативно затронуты этим изменением. Болгарское правительство отметило, что, приняв антиревизионизм, оно сохраняет марксистско-ленинскую идеологию государства."
 yugov.1.d: "Переход к десталинизации, начатый из Москвы, побудил основные коммунистические партии по всей Европе пересмотреть свою политику и структуры. В Болгарии старая гвардия, которая контролировала партию после Второй мировой войны, следуя просоветской, сталинской линии, оказалась в стороне от партии. Поскольку десталинизация была обычным делом, КПБ объявила, что назначает Антона Югова первым секретарем. Юго осуждает культ личности и поддерживает развитие болгарского коммунизма, независимого от Москвы. В прошлом такие взгляды могли привести к его отстранению от власти и партии, но при десталинизации, принятой партией, эти взгляды станут основой партии. Теперь старая гвардия подвергается критике, и ее сторонники не будут рассматривать назначение Югова как продуктивный шаг для партии. Югов также превзошел соперников в своем лагере, которые, возможно, стремились занять руководящую должность для себя."
 Bul_Purge.3.d: "Трайчо Костов, КПБ, был казнен болгарским правительством. Он был уволен Центральным Комитетом и лишен членства в партии несколько месяцев назад. После ареста его обвинили в том, что он уклоняется от марксизма-ленинизма, охватывает национализм, подрывает советские связи и является агентом западных спецслужб. В ходе судебного разбирательства Костов не смог предложить эффективную защиту и был быстро признан виновным. Поскольку Костова судили, его сторонники в партии были арестованы и преданы суду по аналогичным обвинениям, они также должны быть признаны виновными и приговорены к длительным срокам лишения свободы. Многие считают, что судебные процессы были показательными, чтобы очистить партию Костова и его сторонников и укрепить просоветские фракции внутри партии."
 Zhivkov.1.d: "Новый генеральный секретарь КПБ - Тодор Живков. Бывший партизанский командир дослужился до старших партийных чинов после того, как был назначен начальником полиции Софии. Живкову удалось занять пост генерального секретаря из-за охватившего многие коммунистические страны десталинизации после того, как Советский Союз объявил о его поддержке. Старое коммунистическое руководство в Болгарии построило свою власть на послушании Московской линии и Сталину, но с таким подходом, который сейчас подвергается критике в Москве, их позиция становится несостоятельной. Живков сумел помочь вывести из строя старое руководство и позиционировать себя как лучшего кандидата на эту должность. Ожидается, что он инициирует политику и реформы для создания болгарской версии коммунизма, которая, как надеются, не только оживит партию, но и получит ее поддержку среди населения."
 Bul_Purge.4.d: "Генеральный секретарь КПБ Валко Червенков снят с должности. Червенков провел годы в Москве, проходя обучение и подготовку. Он возглавлял пропагандистские усилия во время Второй мировой войны и впоследствии присоединился к правительству. Он перехитрил своих противников и в итоге соединил свою роль руководителя партии с постом премьер-министра. Он придерживался советской линии марксистско-ленинского, экономического и социального развития. Однако смещение в Москве в сторону десталинизации сделало его позицию несостоятельной, поскольку Червенков был одним из самых послушных сторонников сталинизма. С ростом оппозиции в партии и уменьшением поддержки населения Червенкову не оставалось ничего другого, кроме как уйти в отставку и быть отстраненным от власти. Он остается членом партии, но вряд ли будет иметь большой голос с государством. Новая эра болгарского коммунизма началась."
 ZSL.1.d: "ОНП, Объединенная народная партия, была создана после слияния коммунистической партии Стройництво Людове и остатков Народной партии; Во главе с Юзефом Нецко партия провозглашает точку зрения на аграрность и аграрный социализм. Он рассматривается и функционирует как сателлитная партия для коммунистической ПОРП, Польской объединенной рабочей партии, а главное намерение так называемого «сателлита» - представлять сельских рабочих Польши. Несколько польских политиков высоко оценили создание этой новой партии и поздравили самого Юзефа за его звездную работу."
 ZSL.2.d: "Известный врач и политик Тадеуш Михейда, депутат от Национальной рабочей партии в 1930-х годах и министр здравоохранения Польши, официально заявил о своем намерении поддержать недавно созданный ОНП, высоко оценивая аграрную политику и внимание, которое партия уделяет сельским работникам. которые часто упускаются из виду во все более урбанизированном обществе, с которым сталкивается Польша. ОНП поблагодарила политика за его похвалы, признавая не только его работу в Польше, но, как говорится, поборником социализма."
 Wyszynski.1.d: "Профессор и кардинал Стефан Вышинский был недавно арестован после разгона нескольких элементов польского общества и в настоящее время находится в тюрьме в Рювальде; польское правительство ссылается на изменническое поведение в связи с продолжающейся волной арестов, за которыми следуют массовые судебные процессы и тюремное заключение. Он был недавно возведен в ранг кардинального священника Папой Римским и был заядлым социальным работником и помогал нескольким евреям во время нацистской оккупации Польши, прежде чем возглавить проект восстановления в послевоенном Влоцлавеке. Многие считают этот арест серьезной несправедливостью по отношению к Церкви и народу Польши."
 Gomulka.1.d: "Владислав Гомулка, заместитель генерального секретаря Временного правительства Польши с января по июнь 1945 года и известный политический деятель ПОРП, был заключен в тюрьму по приказу президента Польши Болеслава Берута. В том, что, как казалось экспертам, многолетняя борьба за власть между двумя маяками коммунизма, наконец-то взорвалась, когда Берут обвинил Гомулку в «правых реакционных уклонах», без комментариев относительно продолжительности тюремного заключения и последующего Изгнанный из Польской объединенной рабочей партии, Гомулка остается преследуемым, заключен в тюрьму и не имеет политических функций."
 POL_NATOLIN.1.d: "Сегодня пришло известие из Польской Народной Республики, государства-сателлита Советского Союза и одного из самых густонаселенных государств в Восточном блоке, что они отрицают Катынскую резню. Резня была серией массовых расстрелов, которые имели место около апреля и мая 1940 года. Около 22 000 польских военных чиновников и образованных людей были казнены НКВД, в то время как убийства произошли в советских тюрьмах, бойня названа в честь Катынского леса, где Первые братские могилы были обнаружены. Советы утверждают, что люди, которые стояли за бойней, были немцами и постоянно отрицали ответственность за бойню."
 POL_NATOLIN.2.d: "Поступают сообщения от еврейских общин в Польской Народной Республике о дискриминации, запрещении разрешить еврейской диаспоре в Польше возвращаться в Израиль, а также об аресте многочисленных элитных еврейских чиновников и представителей интеллигенции внутри страны. Это вызвало протест со стороны Израиля, и многочисленные еврейские общины в Европе умоляли о справедливом обращении с еврейским населением в Польше. Это полная кампания против них. Нужно принять меры!"
 Gomulka.2.d: "В конце 40-х годов правительство нашей страны было разделено соперничеством между Гомулкой и Берутом. Гомулка возглавлял домашнюю национальную группу, а Берут возглавлял группу, поддерживаемую Советским Союзом. В конечном итоге это привело к отстранению Гомулки от власти в 1948 году. Его обвинили в реакционном отклонении правого крыла, что привело к его тюремному заключению на срок более восьми лет, с 1949 по 1956 год. Но теперь, когда в Познани усиливаются беспорядки, мы вынуждены реабилитировать Гомулку. Реформаторы в ПОРП хотят политической реабилитации и его возвращения к партийному руководству, а Гомулка хочет реальной власти для осуществления реформ. У нас действительно нет выбора в этом вопросе."
 Gomulka.3.d: "В связи с бурными акциями протеста в городе Познань усиливающиеся протесты гражданских лиц и членов кабинета призвали к реальным действиям. Теперь, когда Завадзки взял на себя роль первого секретаря, при полной поддержке наших товарищей в Советском Союзе, мы начали подавлять протесты с помощью армии и тайной полиции. Были произведены многочисленные аресты, но самое главное. Гомулка, старый реформатор, который был реабилитирован, снова арестован. Может быть, это покажет ему и протестующим, что реформа не нужна, и наше население должно научиться жить с этим! В конце концов, все, что нам нужно было сделать, это ударить его ногой в дверь, и весь протест рухнет."
 Polish_October.0.d: "Народная Польская Республика объявила период национального траура в связи с кончиной первого секретаря Болеслава Берута. Первый секретарь Болеслав Берут умер вчера от сердечного приступа в советской столице Москве. Тем не менее, почти за месяц до того, как Берут участвовал в 20-м съезде Коммунистической партии Советского Союза в составе польской делегации в феврале, однако вместо возвращения в Польшу с остальной частью польской делегации Берут остался госпитализирован в Москве из-за случай гриппа. Грипп Берута в конечном итоге вызовет пневмонию и сердечные осложнения, которые приведут к сердечному приступу Берута. Церковные колокола прозвучали по всей польской нации в день похорон Берута, на котором также присутствовал первый секретарь Советского Союза. Через четыре дня после похорон Берута ПОРП проведет свой 6-й пленум, чтобы определить преемника Берута. На 6-м Пленуме ПОРП Эдуард Очаб был бы единогласно избран Центральным Комитетом ПОРП новым Первым секретарем в качестве компромиссного кандидата между реформистской фракцией Пулавы и сталинистской фракцией сторонников жесткой линии в Натолине."
 Polish_October.1.d: "Последние сообщения показывают изменение политического климата в Польше. Его называют польским оттепелем или польским октябрем. Жесткая сталинская фракция утратила популярность, и протесты в начале июня выдвинули на первый план недовольство и общий дискомфорт, которые люди испытывали в связи с их положением и правлением. События привели к появлению фракции реформаторов во главе с Владиславом Гомулкой. Гомулка с энтузиазмом поддерживается большинством общества в Польше, не как лидер коммунистов, а как лидер нации, которая сопротивлялась советскому давлению и тоталитарному правлению Сталина."
 Polish_October.2.d: "\nС охлаждением напряженности в Польской Народной Республике после польского Октября Владислав Гомулка взял на себя руководство Объединенной рабочей партией Польши. Он был фактическим лидером послевоенной Польши до 1948 года. После польского октября он снова стал лидером после кончины Берута. Поначалу Гомулка был очень популярен благодаря своим реформам и поискам «польского пути к социализму», который положил начало периоду, известному как «оттепель Гомулки». Возможно, это приведет к периоду мира, процветания и реформ в одной из крупнейших стран Восточного блока?"
 Polish_October.3.d: "\nС уходом Берута должность первого секретаря Польской Народной Республики в настоящее время занимает Александр Завадский. Он был заместителем премьер-министра Польской Народной Республики и был назначен председателем Государственного совета Польши вместо Болеслава Берута, который занял пост первого секретаря. С уходом Берута Завадзки подробно изложил свой план, чтобы больше ориентировать страну в сторону Советского Союза и интегрировать больше частей советской культуры в нацию."
 Sect_Crisis.1.d: "Несколько месяцев назад Бин Сюйен, политическая сила в Сайгоне с оплотом организованной преступности, объединенная двумя сектами, буддистом Хоа Хао и синкритическим Цао Даем, объединила Объединенный фронт против режима Нго Динь Дьема. Три организации имеют сильные базы сторонников и контролируют свои военизированные формирования. Дьем отказался от их требований к более инклюзивному правительству. Вместо этого он сложил правительство со своими лоялистами и католиками. Его отказ разделить власть и семейственность вызвал напряженность. Это переросло в открытую войну после того, как Дьем объявил, что заменит начальника полиции Сайгона, члена Бинь Сюйен. Эта последняя провокация подтолкнула Объединенный фронт начать атаку, чтобы захватить страну и положить конец некомпетентности Дьема. Объединенный фронт утверждает, что политика Диема ослабит национальное единство и будет способствовать угрозе коммунизма. В ответ Дьем призвал армию развернуть свои силы в Сайгоне и бороться с сектами."
 diem_exile.1.d: "После битвы при Сайгоне Объединенный фронт успешно сверг лидера Южного Вьетнама Нго Динь Дьема и его правительство. Хотя многие выступали за его казнь или тюремное заключение, было ясно, что такие действия еще больше расколоть южновьетнамский народ. В ходе переговоров о формировании правительства национального единства католические и консервативные лидеры указали, что жесткое обращение с Дьем положит конец любым надеждам объединенного правительства. В результате Объединенный фронт объявил, что вместо этого изгонит Нго Динь Дьема из страны. Ожидается, что Дьем приземлится в Маниле, но окончательное место его изгнания еще не определено. Многие считают, что он выберет либо Францию, либо Соединенные Штаты. Ожидается, что его семья в конце концов присоединится к нему."
 Anti_Reffernedum.1.d: "Женевские соглашения обязали два правительства во Вьетнаме провести выборы в пределах своих границ для создания единого вьетнамского государства. Однако правительство Южного Вьетнама объявило, что не будет проводить такой референдум. Правительство процитировало недавно завершенный референдум о типе правительства, которое хотел бы народ Южного Вьетнама, и заявило, что результаты ясно показали неприятие коммунистической системы. Кроме того, они утверждали, что тоталитарному, репрессивному режиму в Ханое нельзя доверять проведение честных выборов, тем более что они активно поддерживали насильственные волнения. Правительство Северного Вьетнама призвало Сайгон к измене их обязательствам и заявило, что оно будет продолжать поддерживать вьетнамский народ и его священную миссию объединения. Соединенные Штаты поспешили объявить о своей поддержке Южного Вьетнама и согласились, что референдум в это время будет непродуктивным."
 Diem.50.d: "Генерал Нгуен Ван Вы был высококлассным офицером армии Южного Вьетнама. Обученный как офицер французами, он участвовал в нескольких крупных битвах против коммунистического Вьет-Миня. Он стал частью национальной армии в Южном Вьетнаме после окончательного вывода французов. Генерал Нгуен Ван Ви признал, что Нго Динь Дьем стремился захватить политическую власть для себя и удалить императора Бао Дая. Он считал, что если Дьема не остановить, это еще больше ослабит государство Южного Вьетнама и в конечном итоге поможет коммунистам в их усилиях по захвату страны. Он действовал, пытаясь захватить контроль над армией и задержать Дьема во имя императора. Однако эта попытка не удалась, и он был арестован сторонниками Дьема. Генерал был лишен своего звания и бежал во Францию."
 Can_Lao.1.d: "Нго Динь Дьем и его брат Нго Динь Нху официально создали новую политическую партию под названием Кан Лао. Нху, который также является ближайшим советником своего брата Дьема, заявил, что партия приведет Вьетнам к славному будущему от упадка французского колониализма и угнетения коммунизма. Он сказал, что его теория личного достоинства станет идеологией партии. Теория подчеркивает персонализм, спиритизм, и Нху утверждает, что она предлагает третий путь для народа Вьетнама. Новая партия объединяет все группы, которые Дьем объединил за эти годы, особенно среди католиков, антикоммунистов и консервативных антиколониальных групп. Ожидается, что новая партия значительно улучшит способность Дьема объединиться, мобилизовать и расширить свою разнообразную базу сторонников."
 VIE_Negotiations.1.d: "Правительство Южного Вьетнама решило отправиться в Ханой и начать переговоры. Правительство Южного Вьетнама считает, что в его интересах добиться какого-то понимания или решения с Северным Вьетнамом. Многие в Южном Вьетнаме считают, что политика неповиновения и антагонизма по отношению к Северному Вьетнаму только провоцирует нестабильность, горечь и эскалацию насилия. Они рассказали Северному Вьетнаму ради всех вьетнамцев; они должны начать переговоры, чтобы решить свои нерешенные вопросы до того, как ситуация не достигнет точки невозврата. Известие о решении по Южному Вьетнаму вызвало гневную реакцию Вашингтона, который сказал Сайгону, что такое решение указывает на слабость и сильно препятствует способности Южного Вьетнама противостоять коммунистической угрозе."
 Vietnam_Mon.1.d: "Принц Куонг Де, пожизненный антиколониальный, революционный вьетнамский националист, был коронован как Император Вьетнама. Он провел много лет, организовывая восстания и живя в изгнании из-за его сильной преданности антиколониальной борьбе. У него много поклонников во Вьетнаме, и считается, что его коронация сделает монархию жизнеспособным вариантом для многих по всей стране. Он заявил, что должен был вступить во владение как Император из-за действий его предшественника, который непрерывно подводил народ Вьетнама в борьбе против Франции. Хотя его поддержка Японии во время войны сделала его объектом критики во многих кругах, у него есть сильные основания для поддержки, особенно среди секты Цао Дай, которые давно отстаивали свою оккупацию трона как средство предотвращения разрушения монархии и традиционные обычаи вьетнамского народа."
 Sect_Crisis.2.d: "Три отделения Объединенного фронта оказались довольно разделенными, особенно их военизированные формирования, а отсутствие координации помешало решительным, ранним действиям во время битвы за Сайгон. Лояльные воинские части Нго Динь Дьема прибыли и вовлекли повстанцев в жестокие уличные бои. Секты ответили минометным огнем и получили тайную французскую помощь. Тем не менее, Соединенные Штаты решили, что они поддержат Дьема, и как только южно-вьетнамские военные услышат об этом, быстро прибудет больше подразделений, принесших тяжелую артиллерию, чтобы повернуть поток против сект. После нескольких дней интенсивных боев правительство Нго Динь Дьема победило, поскольку его войска захватили все основные цитадели сект. С одобрением Соединенных Штатов и его военной победой, Дьем торжествует в Сайгоне. Говорят, что несколько крупных лидеров секты бежали во Францию после своего поражения."
 Sect_Crisis.3.d: "Три отделение Объединенного фронта сумели создать единый командный центр в начале битвы при Сайгоне. Это оказалось решающим, поскольку они смогли захватить ключевые позиции правительства и обеспечить несколько крупных въездов в город, препятствуя военному укреплению Нго Динь Дьема. Новости из Вашингтона были неясны, так как Соединенные Штаты не взяли на себя обязательство поддерживать Дьема, из-за которого несколько его командиров армии отказались от развертывания сил против сект. В результате ожесточенных уличных боев секты одержали верх и вытеснили Дьема и его сторонников из города. Теперь, когда секты контролируют Сайгон, они призвали людей собраться вместе и помочь им сформировать новое правительство национального единства."
 Operation_to_Freedom.d: "Соглашение о прекращении боевых действий во Вьетнаме и разделении государства на два правительства предусматривало трехсотдневный период, в течение которого местное население может свободно перемещаться в любую нацию. И французское, и новое южно-вьетнамское правительство считали, что число беженцев будет ограниченным, но быстро стало ясно, что это число в десятки раз превышает их оценки. Многие католики опасались коммунистической антирелигиозной доктрины и стремились двинуться на юг, изнуряя французские ресурсы. Соединенные Штаты решили вмешаться, чтобы помочь эвакуации в рамках операции «Переход к свободе». Помимо предоставления кораблей и самолетов, Соединенные Штаты также предоставляют столь необходимую помощь беженцам. Операция является огромным пиар-успехом и пропагандистской победой Южного Вьетнама и США. Они указывают на огромное количество беженцев как наглядное свидетельство того, что люди во Вьетнаме предпочитают некоммунистическое правление."
 Diem.10.d: "\nПосле недавнего референдума, на котором было заявлено, что девяносто восемь процентов избирателей хотели получить республику из-за монархии, лидер Южного Вьетнама Нго Динь Дьем объявил об упразднении монархии. Хотя референдум был весьма подозрительным, со многими сообщениями о вбросе бюллетеней и правилах, запрещающих агитацию за монархию, Император решил отправиться в изгнание. Это устраняет его, поскольку глава государства и Дьем, как ожидается, примут титул за себя. Династия Нгуен управляла с начала девятнадцатого века, но решение Императора после Второй мировой войны отречься от престола в пользу Вьетминь обозначило монархию как цель для антикоммунистического Дьема. Хотя император отрекся от престола, он по-прежнему имел символическое значение для многих вьетнамцев, и критики Дьема поспешили указать, что отмена монархии ослабит национальное единство перед лицом коммунистической агрессии."
 Diem.11.d: "\nЛидер Южного Вьетнама Нго Динь Дьем объявил о создании Республики Вьетнам. Он объявил, что это ознаменовало конец колониализма, монархизма и угрозы коммунизма. Дием заявил, что Республика Вьетнам является оплотом свободы и станет базой, из которой в конечном итоге возникнет единый, демократический Вьетнам. Хотя правительство поспешила похвалить референдум и что это значит, были сообщения о широко распространенном мошенничестве с избирателями и вбросе бюллетеней. Северный Вьетнам назвал результаты фарсом марионеточного режима. Критики в Южном Вьетнаме отметили, что, положив конец монархии и провозгласив республику, Дьем нарушил национальную связь, которую многие по всему Вьетнаму чувствовали к императору. Несмотря на эту критику, можно было услышать большие праздники в приморских кварталах Сайгона, и Соединенные Штаты заявили, что быстро признают новое правительство."
 Diem.12.d: "Лидер Южного Вьетнама Нго Динь Дьем открыто отверг Женевские соглашения и заявил, что его правительство не будет связано с ними. Дьем отметил, что Южный Вьетнам формально не подписал соглашение и что он не предлагает какого-либо механизма проведения выборов по объединению. Он также отметил, что коммунистический режим в Северном Вьетнаме создал такую тоталитарную и гнетущую атмосферу, что там не было возможности провести свободные выборы. Хотя Франция выразила свои надежды на реализацию Соглашений и сыграла важную роль в обеспечении безопасности государства Южный Вьетнам, ее заменяют Соединенные Штаты, которые поддерживают позицию Дьема. Помимо международной поддержки, Дьем продолжает политически укреплять свой контроль над Южным Вьетнамом. Его неприятие Женевских соглашений отражает его уверенность в его способности сокрушить коммунистических борцов в его границах."
 Tay_Ninh.1.d: "Тай Нинь, духовная столица секты Цао Дай, пала перед правительством Южного Вьетнама. Солдаты с подавляющей силой захватили Тай Нинь, а его религиозные лидеры, по сообщениям, бежали. Као Дай практикуют синкретическую веру со многими приверженцами, но они также являются политической силой со своими военизированными силами. Их недавняя попытка свергнуть центральное правительство в Сайгоне закончилась неудачей и не позволила секте перегруппироваться, правительство решило, что это займет Тай Нинь. Командующий ведущими правительственными силами объявил, что захват Тай Нинь знаменует конец Цао Дай, и правительство теперь сосредоточится на умиротворении коммунистической угрозы. Наблюдатели в Сайгоне отмечают, что Цао Дай пользуется большой поддержкой, и любая попытка правительства расправиться с группой потребует постоянных усилий."
 Ba_Cut.1.d: "После битвы при Сайгоне правительство Южного Вьетнама под руководством Нго Динь Дьема решило нанести удар по базам поддержки и лидерам всех трех участвующих сект. Ба Кут был ведущим членом буддийской секты Хоа Хао. Умелый военачальник, Ба Кат руководил своими войсками во время битвы при Сайгоне, перекрывая ключевые подъездные пути и подавляя движение правительства. Он избегал захвата и продолжал сопротивляться, оказывая вооруженное сопротивление и препятствуя влиянию должностных лиц Дьема в районах Хоа Хао. Тем не менее, он был недавно захвачен правительственным патрулем, и его силы были впоследствии побеждены. Многие предлагали Дьему реабилитировать Ба Реза из-за его военных навыков и антикоммунизма. Они чувствовали, что милость к нему поможет объединить нацию после недавних волнений. Тем не менее, Дьем позволил военному суду приговорить Ба Кат к смерти и впоследствии казнить с применением гильотины. Многие сторонники Ба Кат отреагировали гневно и отправились в джунгли, чтобы бороться против Дьема."
 Saigon_Trials.1.d: "Правительство Вьет-Куока объявило, что все больше коммунистов будут привлечены к ответственности за свои контрреволюционные и антинародные действия в 1940-х годах. Пресса называет судебные процессы над Сайгоном, и ожидается, что многие из обвиняемых будут приговорены к суровым приговорам за свои действия. Правительство перечислило целый ряд обвинений, в том числе убийство членов Вьет Куок, возвращающихся в страну из Китая, военные операции, проводимые против группы боевиками-коммунистами, мошенничество на выборах и незаконное заключение в тюрьму лидеров Вьет Куок. Они утверждали, что все эти действия произошли во время борьбы за независимость и были вопиющими усилиями коммунистов укрепить свою собственную власть и сокрушить борцов за некоммунистическую свободу за счет антиколониальной борьбы. Критики Вьет-Куока называют это антикоммунистической чисткой через шоу-процессы."
 Diem_Returns.1.d: "Объединенный фронт после своей победы в Сайгонской битве создал правительство национального единства. Может ли Лао, партия Дьема, согласиться, что она будет участвовать в правительстве национального единства, только если Дьем будет изгнан вместо сурового приговора. Объединенный фронт согласился, и Кан Лао присоединился под руководством Нго Динь Нху, брата свергнутого Дима. Кан Лао оказался гораздо более организованным, чем другие политические партии, и его способность объединять различные фракции антикоммунистов вместе с католиками позволила партии занять доминирующую политическую позицию. Нху недавно объявил, что Дим вернется в Южный Вьетнам и снова возьмет под свой контроль страну. Разобщенность внутри Объединенного фронта и доминирование Кан Лао на ключевых военных позициях обеспечили, что это объявление будет встречено с минимальным сопротивлением. Объединенный фронт рухнул."
 Dalit.1.d: "Далитское буддийское движение под руководством Б.Р. Амбедкара планирует преобразовать далитов, известных как неприкасаемые, в свою версию буддизма. Цель состоит в том, чтобы преобразовать достаточное количество далитов, чтобы создать политическое давление для социальных изменений и положить конец влиянию индуистских общин далитов на сохранение угнетения сообщества. Справочное издание Амбедкар, крупный активист движения за независимость и активист далитов, давно рассматривал индуизм как коренную проблему социального развития далитов. Предложенная им версия буддизма называется Наваяна, которая рассматривает религию через призму классовой борьбы и отвергает многие основные буддийские верования. После запуска его кампании обращено целых полмиллиона далитов. Хотя цифры впечатляют, критики отмечают, что коэффициент конверсии не так высок, как хотелось бы Амбедкару, и обращенные далиты не настолько велики, чтобы стать политической силой, стремящейся к социальным переменам. Напряженность в обществе также возросла, так как многие индусы считают эти целенаправленные обращения прямой угрозой своему сообществу."
 India.25.d: "\nВо время Второй мировой войны Андаманские и Никобарские острова находились под оккупацией Свободной индийской армии и их японских покровителей. Они управляли островами как часть Свободной Индии и после войны сдали ее британским индийским войскам. После обретения независимости Индия заявила о своем намерении освободить всех индейцев от колониализма и дать выбор присоединиться к Индийскому союзу. Тем не менее, в этот период британцы заявили, что намерены переселить всех англо-индейцев и англо-бирманцев на острова и предоставить им независимость. Однако этот план оказался невозможным для реализации, но вызвал обеспокоенность у индийского руководства. Чтобы положить конец любым спорам о статусе этих островов, правительство Индии официально объявило о присоединении Андаманских и Никобарских островов к Союзу индейцев и пообещало предоставить острову образование и развитие."
 Asian_Games.1.d: "Первое издание Азиатских игр началось в Дели. Спортсмены из более чем десяти азиатских стран участвуют в более чем пятидесяти соревнованиях. Для этого первого издания коммунистические режимы не были приглашены, и Пакистану было отказано в разрешении из-за конфликта в Кашмире. Происхождение Азиатских игр можно проследить до игр Чемпионата Дальнего Востока перед Второй мировой войной, которые закончились после начала китайско-японской войны. Во время Олимпийских игр 1948 года Китай и Филиппины обсудили новую редакцию Дальневосточных игр, и представитель Индии в Международном олимпийском комитете согласился, но предположил, что в сферу охвата входят новые независимые государства в Азии. Это положило начало процессу, который в конечном итоге привел к созданию Азиатской спортивной ассоциации и соглашения о проведении первых Азиатских игр в Нью-Дели. Хотя Япония не является членом Азиатской спортивной ассоциации, им было разрешено участвовать."
 COM_Hyderabad.1.d: "На протяжении веков народ Хайдарабада жил под тираническим правлением своего Низама и его клики помещиков и слуг. Низам использовал этих людей, чтобы физически раздавить крестьян и тех, кто хотел бы провести реформы для развития региона. Теперь, когда Индия контролирует Хайдарабад и признает, что это может исправить исторические ошибки. Правительство Индии объявило о широкомасштабной серии увольнений и арестов бывших чиновников, королевских советников и помещиков, которые тесно сотрудничали с низамом Хайдарабада. Этих людей наказывают за их прошлые действия, и, поскольку эти дела предстанут перед судом, правительство ожидает, что эти люди вернут богатство, которое они украли, людям. Правительство добавило, что физическое освобождение Хайдарабада было только одной частью, а следующая часть требует устранения реакционных классов. Это позволит проводить развитие и проводить реформы с минимальным вмешательством или саботажем."
 COM_Hyderabad.2.d: "В течение 1947 и 1948 годов операция «Поло» аннексировала Хайдарабадское княжество в новой независимой Индии. Однако это привело к нестабильности, и вскоре государство было захвачено крестьянским восстанием при поддержке Коммунистической партии Индии. Крестьяне напали на феодальных помещиков, которые правили землей с древних времен, прежде чем обратить свое внимание и всю силу своего гнева на Османа Али Хана, правящего принца Хайдарабада с 1911 года. Жестокое подавление этого насилия, наконец, принесет близко к операции «Поло», но нигде не остановит непрекращающееся насилие между наксалитами и маоистами в регионе. Тем не менее, это будет означать, что ИПЦ должен будет принести коммунизм в Индию в рамках демократии и, наконец, навести хотя бы видимость порядка в раздираемом войной регионе."
 India.6.d: "Конституция Имараудингдии требовала, чтобы президент создал комиссию для расследования условий отсталых классов по всей стране и внесения предложений о том, как положить конец дискриминации. Отсталые классы были определены как сообщества, которым по религиозным, племенным или социально-экономическим причинам препятствовали получение представительства, доступа к образованию или работе. Президент поместил эту комиссию, названную Первой Комиссией Обратных классов под руководством известного индийского активиста независимости Кака Калелкар. В конечном итоге комиссия определила более двух тысяч отсталых групп и сообществ, из которых почти девятьсот были названы самыми отсталыми. Он рекомендовал социализм, резервирование мест в университетах для отсталых сообществ и кампанию социальной справедливости, в рамках которой представители высших каст или статусов отказываются от своих преимуществ на благо нации. Он также призвал к обучению грамоте и программам обучения для этих сообществ."
 kashmir.100.d: "Когда группы боевиков, без сомнения действовавшие с одобрения Пакистана, вошли в Кашмир вскоре после обретения независимости, правительство Индии получило запрос от махараджи Кашмира. Он заявил, что его столица была на грани развала жестоким бандитам и попросил нашей помощи. Мы сказали ему, что если он согласится присоединить Кашмир к Индийскому союзу, мы сможем предложить помощь. Он согласился, и индийская армия быстро прибыла, чтобы спасти Сринагар от увольнения боевиками. Вскоре Пакистан раскрыл свою открытую роль и развернул свои войска в Кашмире. После нескольких месяцев интенсивных боевых действий обе стороны договорились о прекращении огня, и Индия в настоящее время занимает две трети того, что было в княжестве Джамму и Кашмир. Наше присутствие имеет важное значение для обеспечения мира и прекращения массового изгнания индусов в Джамму."
 Negar.1.d: "Индийские патриоты, живущие в португальском Нагархавел после получения независимости упорно трудились, чтобы освободить территорию от колониальных сил. После непродолжительной борьбы люди одержали победу, и они начали управлять собой с помощью Индии. Однако на международном уровне территория все еще рассматривалась как португальская. Это закончилось сегодня после того, как высокопоставленный член гражданской службы Индии был назначен главой государства Негар Хавели. Как только он был приведен к присяге, он официально запросил разрешение на въезд в Индию, которое правительство Индии приняло. Индийские войска и правительственные чиновники быстро двинулись на территорию, чтобы начать процесс интеграции территории в Индию. Португальцы подали протест индийскому правительству и Организации Объединенных Наций, однако многие наблюдатели считают, что это мало повлияет на местах."
 kashmir.101.d: "Махараджа Кашмира присоединился к Княжеству Джамму и Кашмир в Индию, чтобы заручиться поддержкой Индии в его усилиях против пакистанских боевиков, поддерживаемых Пакистаном. Индийская армия быстро вмешалась и защитила большую часть территории для Индии. После стабилизации фронта в Кашмире было создано законодательное собрание. Это собрание недавно подтвердило действия Махараджи и заявило, что жители Джамму и Кашмира одобряют присоединение к Индии. В ответ на это решение правительство Индии объявило, что вскоре начнет интеграцию администрации и полиции Кашмира с национальными учреждениями, приведя их в соответствие с надлежащими стандартами и процедурами. Политически правительство Индии также заявило, что оно будет стремительно добавить Кашмир в качестве новой национальной провинции."
 IndiaPuppet.1.d: "Королевство Непал уже давно переплетено с историей Индии. Многие непальцы работают по всей Индии, и их знаменитые солдаты-гуркхи являются одними из самых элитных в индийской армии. Именно эта тесная историческая связь, о которой заявляет правительство Индии, является причиной того, что они потребовали от Непала принять индийскую гегемонию. Индийское правительство Непал, по сути, является княжеским государством, и поэтому оно должно выработать свой статус в Нью-Дели, а не в Лондоне. Правительство Индии также заявило, что, хотя правительство Непала заявляет, что оно является независимым, народ Непала глубоко желает союза с Индией. Индийцы подчеркивали, что Непал не имел бы функционирующей экономики или доступа к миру без Индии. Ожидается, что правительство Непала вскоре отреагирует, хотя многие наблюдатели считают, что они примут требования Индии, несмотря на их опасения."
 IndiaPuppet.2.d: "Правительство Индии объявило, что Бутан вступит в более глубокое партнерство, предоставляя Индии доступ к стране, а также поддержку нашей внешней и внутренней политики. Индийское правительство заявило, что Бутан является по сути княжеским государством и долгое время зависел от Индии с точки зрения ее безопасности, экономики и развития. Новая договоренность отражает историческую реальность. Что еще более важно, индийское правительство отметило, что народ Бутана теперь будет защищен от махинаций враждебных соседей. Наблюдатели этой недавней акции считают, что индийский шаг отражает стремление Индии обезопасить свои границы и создаст буферное пространство на случай, если конкурирующая держава попытается бросить вызов Индии на севере."
 IndiaPuppet.3.d: "Тибетское правительство объявило о своем волнении по поводу нового соглашения, которое оно заключило с правительством Индии. Это заявление воспринимается со скептицизмом по всему миру, поскольку по существу Тибет согласился передать свою внешнюю политику, оборону и экономику индийскому контролю в обмен на защиту индийских военных. В некоторых сообщениях уже говорится, что индийские воинские части перебрались в Тибет. Правительство Индии в своем заявлении отметило, что недавнее соглашение соответствует историческим связям между Индией и Тибетом, которые уходят в глубь веков. Многие наблюдатели считают, что эта индийская интервенция в Тибете предназначена для того, чтобы дать им сильную буферную зону для защиты равнин Индии от любой будущей угрозы с севера. Для тибетцев, хотя их суверенитет был уменьшен, они считают, что стоимость стоит того, чтобы обеспечить защиту от потенциальной агрессии со стороны своих соседей, многие из которых имеют территориальные планы в отношении Тибета."
 IndiaPuppet.4.d: "У французов были анклавы в Южной Азии с семнадцатого века. С независимостью Индии люди во французских областях потребовали союза с новым государством. Французы в свою очередь решили разрешить проведение выборов в районах, чтобы определить, чего хочет народ. После этих результатов все французские анклавы были переданы под юрисдикцию Индии. Индийское правительство уже направляет чиновников и администраторов для плавного перехода бывшей французской территории в страну. Некоторые из этих территорий будут включены в соседние провинции, но основной район Франции, Пондишери, будет администрироваться как союзная территория. Другая колониальная держава в Индии была вытеснена, и Индийский Союз становится сильнее. Миссия по ликвидации колониализма в Южной Азии успешно продолжается."
