 Iranian_Revolution.1.d: "Иранское правительство надеялось, что изгнание аятоллы Хомейни из Ирана изолирует его от его сторонников и сломит его влияние в стране. Однако из своего дома в Ираке аятолла продолжает ругаться против шаха и его союза с Соединенными Штатами. Надежды на то, что его годы изгнания приведут к его поддержке, оказались ошибкой. Когда его последователи посещают Ирак, часто совершая паломничество в святые города, они возвращают аудиокассеты аятоллы Хомейни и его проповеди. Эти ленты стали невероятно популярными на черном рынке, и он не только расширил число своих подписчиков, но и является общенациональной фигурой. Даже более светские иранские противники шаха уважают огненную риторику Хомейни и его твердую веру в то, что монархия должна прекратиться."
 Iranian_Revolution.2.d: "Молодой социолог Али Шариати стал революционным идеологом для иранцев всех политических ориентаций. В своих широко популярных лентах ему удается сочетать элементы марксизма, шиитского ислама и иранского национализма. Он критикует другие крупные революционные движения после Второй мировой войны за их секуляризм. Вместо этого он утверждает в пользу Ирана, что шиитская вера должна восприниматься как исторически активистская вера. Его аргумент позволяет религиозным иранцам комфортно участвовать в революционной политике, не опасаясь поставить под угрозу их религиозные убеждения. Хотя правительство Ирана настойчиво пыталось скрыть эти записи, они широко распространились и популярны как в медресе, так и в университетских городках."
 Iranian_Revolution.3.d: "Шах Ирана официально одобрил решение премьер-министра (кто бы ни был премьер-министром в то время) объединить две легальные политические партии и объединиться, чтобы сформировать партию Растахиз (Возрождение). Новая партия требует от всех иранцев участия в качестве членов и будет действовать как сила национального единства и развития. В Меджлисе больше не будет политической разобщенности, а новое молодежное крыло поможет распространить партию по всему Ирану. Этот шаг рассматривается как шах, консолидирующий его абсолютную власть и отчуждающий профессиональные и политически сознательные сообщества. Требование членства и связанные с ним сборы оттолкнули сообщество базарцев, которые не хотят платить правительству или соблюдать их правила. Для шаха он обеспечил полный политический контроль, и теперь меджлис примет законодательство и реформы без дебатов и задержек."
 Iranian_Revolution.4.d: "В последней попытке шаха навязать себя духовенству он объявил, что персидский календарь официально заменит исламский календарь в Иране. Это решение вызвало негодование не только среди духовенства, но и среди социальных групп в Иране, которые рассматривают ислам как важную часть своей идентичности. Для духовенства это последняя попытка шаха, который также расширил богословские факультеты в светских университетах как средство распространения своей принятой версии ислама. Органы безопасности сообщили шаху, что многие имамы низкого ранга осуждают это решение в своих пятничных проповедях."
 Iranian_Revolution.5.d: "\nВ Мешхеде правительство завершило проект реконструкции, чтобы украсить Храм Имама Резы и город. Базары вокруг участка были снесены, и вокруг него были построены новые дороги. Эти действия спровоцировали насилие и гневные протесты, в том числе взрывы нескольких строительных машин. Базарцы были расстроены из-за разрушения их зданий и того, как проект отделил их от местного духовенства. Местное духовенство также было возмущено тем, как проект изолировал их от массы. Для правительства этот результат можно рассматривать только как успех. Область теперь визуально привлекательна и более организована. Что еще более важно, операция разорвала физическую связь операторов базар и духовенства."
 Iranian_Revolution.6.d: "Национальный фронт возглавляет кампанию по отправке открытых писем жалоб шаху и правительству. Они требуют большей демократии для Ирана и меньшей роли для шаха. Многие иранские либеральные политики и интеллектуалы приняли участие. Эти письма в основном игнорируются правительством, однако, международная репутация Ирана подвергается негативному влиянию. Все чаще появляются сообщения об отсутствии политических свобод в Иране, несмотря на его обширную модернизационную кампанию. Эти письма также подталкивают иранских студентов, особенно тех, кто учится за границей, к освещению проблем, которые они видят на своей родине."
 Iranian_Revolution.7.d: "Адвокаты Ирана устроили серию акций протеста в Тегеране. Адвокаты протестуют против недавних изменений в судебных процедурах, которые облегчают правительству задержание диссидентов. Такие изменения приносят пользу только государственным органам и создают правовую систему против граждан Ирана. В дополнение к требованию отмены этих изменений, адвокаты также призывают иранское правительство и судебную систему более строго придерживаться принципа верховенства закона, как это предусмотрено конституцией. В течение многих лет они утверждают, что правительство и органы безопасности выставляли напоказ правовые процедуры и законы для выполнения своей повестки дня. Правительство отклонило этих адвокатов как иностранных агентов и настаивает на том, что Иран является одной из самых сильных судебных систем в регионе."
 Iranian_Revolution.8.d: "Иранский социолог и революционер Али Шариати скончался от очевидного сердечного приступа в Англии. Его внезапная смерть в таком молодом возрасте разжигает скептицизм по всему Ирану, что он был убит САВАК, правительственной тайной полицией. Шариати, получившие образование в Париже, находились под сильным влиянием постколониальных революционных движений как способа освобождения Ирана, но противостояли их светской природе. Вместо этого он отметил, что шиитский ислам является активистской верой, которая в сочетании с марксизмом и иранским патриотизмом позволит иранцам сохранить свою идентичность и освободиться от угнетения. Его основная идея о том, что он позволяет иранцам сохранять свою веру и продолжать совершать революционные действия, сделала его популярным по всей стране. Его проповеди и записи стали хитами среди студентов и религиозных деятелей. Его смерть является серьезным ударом по иранским революционерам, однако, его записи сейчас популярны как никогда, что вдохновляет многих иранцев поверить в законность революционных действий."
 Iranian_Revolution.9.d: "Тяжелые государственные расходы, особенно на предметы роскоши и армию, наряду с амбициозными социальными программами, привели к большим нагрузкам на экономику. Инфляция растет безудержно, а нефтяной бум только подпитывает эти экстравагантные расходы. Еще более тревожно то, что разрыв в уровне благосостояния в стране значительно увеличился, поскольку элиты сумели накопить богатства в этот период. Для борьбы с экономическими проблемами, с которыми сталкивается Иран, правительство объявило о новых мерах жесткой экономии, направленных на то, чтобы контролировать инфляцию. Тем не менее, эти новые меры, скорее всего, в основном затронули бедное городское население страны. Эксперты предупреждают, что меры жесткой экономии на работающих промышленных рабочих могут вызвать широкое недовольство правительства и сбои в промышленном производстве."
 Iranian_Revolution.10.d: "Amnesty International опубликовала ужасный доклад о шахе и его правительстве. Они обвиняют правительство в грубых нарушениях прав человека, включая пытки подозреваемых и аресты без надлежащей правовой процедуры. Правозащитная организация впервые публикует доклад по Ирану. Правительство Ирана отвергает утверждения о том, что нарушения прав человека являются государственной политикой, и настаивает на том, что любые нарушения являются отдельными инцидентами. Они добавляют, что на отчет оказывают влияние антиправительственные деятели. В Иране в докладе появились слухи о том, что Соединенные Штаты прекратили свою поддержку шаха, многие полагают, что амнистия является рычагом американского правительства."
 Iranian_Revolution.11.d: "Когда дошли новости о запланированном визите шаха и его жены в Белый дом, тысячи иранских студентов начали собираться в столицу. Они хотели протестовать против шаха и его правительства. Чтобы противостоять этим протестующим, иранское правительство привлекло военных офицеров и курсантов вместе с правительственными сторонниками, которые в настоящее время находятся в Соединенных Штатах для противодействия протесту. Когда шах достиг Белого дома, он столкнулся с тысячами протестующих. Затем контр-протестующие начали нападать, что привело к столкновениям. Когда президент приветствовал шаха снаружи, местная полиция сбросила слезоточивый газ, который в итоге достиг шаха и президента, заставив обоих мужчин ворваться в Белый дом. В Иране сообщения об инциденте вызвали слухи о том, что ЦРУ преднамеренно слезоточивым газом шах, еще раз подтверждая растущую веру в страну, что он потерял американскую поддержку."
 Iranian_Revolution.12.d: "Ведущая правительственная газета опубликовала странную статью об аятолле Хомейни. В статье опубликованы обвинения Хомейни в его сексуальной ориентации, национальности и религиозной преданности. Он также обвинил его в том, что он был британским агентом, намеревавшимся продавать Иран империалистам и коммунистам. Эта статья была осуждена по всей стране, поскольку даже самые светские иранцы признают Хомейни человеком веры и принципов. Среди сторонников Хомейни реакция была яростью. Религиозные студенты в священном городе Куме, к которым присоединились базары и другие сторонники Хомейни, начали протесты по поводу этой статьи. Полиция вмешалась, и это привело к ожесточенным столкновениям. Правительство утверждает, что двое протестующих были убиты, хотя ходят слухи, что полиция открыла огонь, и жертвы были выше пятидесяти. Согласно шиитскому обычаю, поминальные службы по погибшим демонстрантам будут проводиться через сорок дней после их смерти."
 Iranian_Revolution.13.d: "По всему Ирану были проведены мемориальные службы (называемые чехелом), чтобы почтить память убитых полицией во время протестов в Куме. Жестокие протесты начались после публикации в ведущей правительственной газете зажигательной статьи об аятолле Хомейни. Через сорок дней после протестов сторонники Хомейни и другие религиозные лидеры-шииты смогли организовать мечети по всему Ирану для проведения служб для мертвых. В конце службы десятки тысяч вышли на улицу, чтобы осудить правительство и шаха. Протесты в Чехеломе привели к гибели еще нескольких человек, и уже через сорок дней планируется провести аналогичные акции протеста. Правительство должно решить, следует ли работать с умеренным духовенством, предлагать незначительные уступки и выдерживать общественное негодование. Или, если требуется более сильный, военный ответ, чтобы положить конец протестам и восстановить стабильность в Иране."
 Iranian_Revolution.14.d: "Цикл протестов чехелом продолжается уже несколько месяцев, нанося ущерб экономике и стабильности Ирана. Однако в последние несколько циклов протестов число участников резко сократилось. Правительство заявило, что последний протест был достаточно мал, чтобы силы безопасности легко контролировали ситуацию. Успех правительства можно увидеть в его усилиях по смягчению влияния шиитского духовенства, постепенной либерализации права на протесты и переговорах с протестующими. Он пообещал демократические выборы в следующем году, успокоив светских противников, и подписал приказы по борьбе с коррупцией, особенно со стороны королевской семьи. Хотя протестующие продолжали приносить жертвы каждый день протеста, арестованные предстали перед гражданским судом. Предположительно коррумпированные чиновники также были уволены, и шах также заменил главу САВАКа умеренным генералом. Шах, похоже, пережил этот последний период гражданских беспорядков."
 Iranian_Revolution.15.d: "Народ Ирана скорбит после шокирующей атаки в Абадане. Группа неопознанных людей подожгла театр Cinema Rex, закрыв двери, чтобы предотвратить побег от посетителей. Огонь быстро распространился, и в результате более четырехсот человек погибли в огне. Иранское правительство обвиняет исламских марксистов в нападении. Тем не менее, протестующие и противники шаха обвиняют САВАК, государственную тайную полицию в проведении атаки, чтобы вбить клин между светскими и религиозными протестующими. Иранцы, которые были на ограждении из-за недавнего усиления протестов, как правило, верят заявлениям протестующих, и правительство Ирана готовится к всплеску новых протестов по всей стране. Теперь многие иранцы верят, что шах и его правительство удовлетворены разрушительной атакой поджогов Cinema Rex."
 Iranian_Revolution.16.d: "Протестующие против Пахлави, число которых увеличилось после того, как правительство обвинило в поджоге Синема Рекса правительство, получило новый импульс, когда начался священный месяц Рамадан. Антиправительственное духовенство способно вдохновить многих в своих собраниях присоединиться к протестам как почти религиозное обязательство перед своей верой и нацией. Любые надежды правительства на стабилизацию этого периода волнений, похоже, быстро разрушаются. Как и предыдущие протесты, неопытные солдаты и полиция стреляют в толпы, несмотря на приказы не использовать насилие для разгона беспорядков. Больше беспокойства вызывают новости о том, что умеренное духовенство, похоже, теряет контроль и влияние на молодое духовенство и население."
 Iranian_Revolution.17.d: "Ид аль-Фитр, праздник, знаменующий конец Рамадана, должен был дать шаху возможность остудить недавние волнения. Правительство Ирана выдало разрешения на проведение молитв под открытым небом в Тегеране. Присутствовали толпы более полумиллиона граждан, и после молитв духовенство направило их на марш через центральный Тегеран. Толпа превратилась в антишахскую акцию протеста с песнями за возвращение аятоллы Хомейни и призывами к исламской республике. Это ознаменовало радикализацию в протестах, поскольку Хомейни непреклонен в устранении шаха, а не только политических реформ. Шах якобы наблюдал за протестами со своего вертолета. Обеспокоенный он собрал своих высокопоставленных чиновников и должен определиться со своими действиями. Он может объявить военное положение и заставить военных разрешить ситуацию. Другой его вариант - вызвать светскую оппозицию, договориться о его отречении и принять новую конституцию, которая ограничивает монархию."
 Iranian_Revolution.18.d: "Шах объявил военное положение в двенадцати городах по всему Ирану. Протесты будут запрещены, а суровый генерал Голам-Али Овейси будет курировать администрацию военного положения. В продолжение колеблющейся позиции шаха он пообещал продолжить либерализацию после отмены военного положения. Несколько тысяч протестующих бросили вызов приказам и столкнулись с иранскими солдатами, которые открыли огонь по толпе. Десятки были убиты, и, несмотря на заявления генерала Овейси, что его войска были обстреляны. Многие в стране обвиняют военных в неизбирательном насилии и называют события Черной пятницей. Новости о продолжающемся насилии и фотографии погибших демонстрантов закалили население против шаха. Шах раскритиковал военных и приказал им отказаться от участия в будущих акциях протеста, но даже самые умеренные оппозиционеры не желают вести открытые переговоры с шахом."
 Iranian_Revolution.19.d: "После Черной пятницы многие иранцы перешли от стремления к сокращенной монархии до конца династии Пахлави. Однако к трудностям шаха добавляется недавнее объявление иранскими рабочими всеобщей забастовки в знак солидарности с протестующими. Нефтяная промышленность Ирана, критически важная для ее экономического влияния, практически закрыта, как и большинство отраслей. Рабочие организуют национальные забастовочные комитеты, чтобы обеспечить экономическое воздействие забастовок на правительство. Шах отказался от совета по размещению войск для прекращения забастовок и вместо этого увеличил свою заработную плату. Несмотря на его действия, рабочие в настоящий момент остаются приверженными поддержке протестующих."
 Iranian_Revolution.20.d: "Отчаявшийся шах попросил иракское правительство убрать аятоллу Хомейни из Наджафа. Правительство Ирана считает, что его удаление помешает ему попытаться тайно проникнуть в Иран или распространить свои опасные послания своим сторонникам в Иране. Иракское правительство подчинилось, опасаясь, что Хомейни может разжечь собственное население, и аятолла уехал в пригород Парижа. Однако надежды на то, что Хомейни будет вынужден замолчать или обойти стороной, быстро разбились, так как иранские диссиденты и изгнанники за границей объединились, чтобы посетить аятоллу. Кроме того, Париж широко представлен в средствах массовой информации, что облегчило Хомейни обращение к иранцам, протестующим против шаха. Аятолла Хомейни также провел переговоры с ведущими лидерами светской оппозиции, которые согласились поддержать его призыв к свержению шаха и исламскому присутствию в следующем правительстве."
 Iranian_Revolution.21.d: "По всему Ирану ежедневно бушевали антиправительственные протесты, а экономика практически остановилась, и к шаху подошли несколько старших генералов. Они требовали, чтобы он уполномочил военный комитет взять на себя безопасность и ввести военное положение. Они утверждают, что нерешительность правительства действовала только для разжигания беспорядков, и ситуация быстро ухудшалась. Шах согласился, но должен решить, какую фракцию вооруженных сил расширить. Он может выбрать умеренных, которые, вероятно, попытаются править в столкновениях и будут более примиренными, или уполномочат сторонников жесткой линии, которые считают, что необходим сильный, твердый подход."
 Iranian_Revolution.22.d: "Шах Ирана недавно обратился к народу. Он признал коррупции и ошибки своего режима и пообещал исправить их. Кроме того, он заявил, что нынешний военный режим является временным, и он начнет переговоры с оппозицией о формировании коалиционного правительства наряду с демократическими реформами. Речь была направлена на то, чтобы успокоить протесты и положить конец общенациональной забастовке, наносящей ущерб экономике, но, похоже, лишь заставила протестующих поверить, что режим скоро рухнет. Военное правительство очень расстроено объявлением, поскольку оно подрывает их позицию и возможные действия. Учитывая его призывы к сдержанности, многие в армии полагают, что они больше не смогут завершить полный разгон, даже если бы захотели."
 Iranian_Revolution.23.d: "Недавно военное правительство распространило военное положение на Хузестан. В этой жизненно важной провинции сосредоточена большая часть добычи нефти в Иране, а ее рабочие бастуют уже более месяца. Марши протеста значительно сократились, и военно-морской флот направил персонал для прекращения забастовки нефтяников. Добыча нефти вернулась к дореволюционному периоду и обеспечивает некоторое облегчение для иранской экономики. По другим сведениям, лидер оппозиции Карим Санджаби был задержан после возвращения в Иран после проведения переговоров с аятоллой Хомейни в Париже. Некоторые рассматривают успех в Хузестане как признак возвращения правительства, но это еще предстоит выяснить."
 Iranian_Revolution.24.d: "Иранские военные сталкиваются с серьезными трудностями в своих усилиях по контролю за уличными протестами и безопасностью. Многие солдаты-призывники не имеют надлежащей подготовки по борьбе с толпой, что приводит к инцидентам, когда солдаты стреляют в толпу. В других случаях призывники сочувствуют демонстрантам и в конечном итоге отказываются разбивать протесты. Офицеры на местах все больше разочаровываются противоречивыми приказами, которые они получают от начальства. Однако в последние недели эти напряжения привели к случаям стрельбы солдат по офицерам, которые приказывают им стрелять в протестующих. В некоторых случаях солдаты публично дезертируют и присоединяются к протестующим. В целом военные сообщили шаху, что почти тысяча иранских солдат дезертируют из своих подразделений каждый день. Многие генералы не уверены, достаточно ли у них людей, чтобы выполнять приказы или даже полагаться на них во время беспорядков."
 Iranian_Revolution.25.d: "Священный месяц Мухаррам начинается сегодня. Этот месяц особенно важен для десяти шиитов, поскольку они оплакивают мученическую смерть Али, внука пророка Мухаммеда. Десятый день, называемый Ашура, ознаменовывает фактическое событие и является временем массового общественного горя. Революционеры и протестующие шаха уже запланировали серию эскалаций протестов, которые завершатся национальным маршем Ашуры по Ирану. И светская, и религиозная оппозиция тесно работают над этими протестами. Иранское правительство не может рисковать массовыми столкновениями в столь благоприятное время, поскольку такие действия могут вызвать восстание в рядах военных."
 Iranian_Revolution.26.d: "В преддверии Ашурского марша шах и протестующие договорились о предотвращении насильственных столкновений. Шах, отчаянно пытаясь избежать насилия во время Ашуры, освободил политических заключенных, в том числе Карима Санджаби. Кроме того, для Ашуры был снят запрет на акции протеста и выданы разрешения организаторам. Взамен протестующие обязались избегать насилия. Марш Ашуры стал массовым демонстрацией силы, по некоторым оценкам, по меньшей мере, десять миллионов протестов, более десяти процентов всех иранцев, участвующих. Его называют крупнейшим маршем в мировой истории. Карим Санджаби и аятолла Талегани возглавили акции протеста, чтобы символизировать революционное единство светской и религиозной оппозиции шаху. Шах, как говорили, был подавлен сообщениями."
 Iranian_Revolution.27.d: "Ситуация в Иране достигла критического места. Шах сообщил послу, что не знает, что можно сделать, и его позиция выглядит несостоятельной. Это отсутствие решимости, несомненно, является главной причиной кризиса и усугубляет антиамериканские настроения среди иранцев. Некоторые высокопоставленные чиновники утверждают, что если шах не сможет выжить, мы должны постараться произвести позитивное впечатление на следующий режим. Эти чиновники предлагают нам разработать план, который позволит шаху отречься от престола и передать власть республиканскому правительству во главе с прозападными чиновниками и военными. Другие члены администрации заявляют, что иранские революционеры уже настроены против Америки, и любое дальнейшее участие в этом деле будет действовать только как боеприпасы для наших врагов в регионе. Шах, вероятно, согласится с тем, что мы предложили, но президент должен решить, предложить ли план оппозиции или отложить."
 Iranian_Revolution.28.d: "Иранская оппозиция провела встречи с американскими официальными лицами по поводу политического урегулирования кризиса. Американцы предполагают, что демократическая установка может быть установлена, когда аятолла Хомейни будет духовным проводником иранского государства. Хомейни и американцы оба чувствовали, что переговоры были положительными, но окончательное соглашение оставалось недостижимым в данный момент. Иранская оппозиция должна решить, сможет ли она добиться ликвидации шаха при посредничестве американцев или сможет ли она добиться этого самостоятельно. Использование американцев, вероятно, приведет к формированию правительства с сильным присутствием проамериканских чиновников и снижением роли шиитского духовенства. Однако, если оппозиция сможет убрать самого шаха, она сможет полностью контролировать свою судьбу."
 Iranian_Revolution.29.d: "Марш Ашура, дезертирство армии и экономический крах сделали ситуацию невыносимой для шаха. Наблюдатели отмечают, что в марше Ашура участвовало по меньшей мере десять процентов всех иранцев, что намного выше, чем три или четыре процента французских граждан, участвовавших во французской революции. Необходимая стратегия выхода, шах заключил соглашение с лидером Национального фронта Шахпуром Бахтияром на пост премьер-министра. Он также объявил о планах взять отпуск со своей семьей и покинуть страну в руках совета регентства, возглавляемого премьер-министром. Бахтияр присоединился к правительству из страха, что Хомейни не примет демократию для страны. Однако его решение встречает всеобщее презрение среди светской и религиозной оппозиции. Национальный фронт исключил его, и Хомейни обвинил его в послушании ложным богам."
 Iranian_Revolution.30.d: "Шах Мохаммад Реза Пахлави и его семья вылетели из Тегерана, ознаменовав конец династии Пахлави в Иране. Имперская гвардия плакала, когда королевская семья садилась на их самолет, в то время как его премьер-министр Шахпур Бахтияр, давний противник шаха, не мог скрыть своего презрения к монарху. Он верил, что шах должен остаться перед лицом справедливости народа. Новости быстро распространились, шах оставил. Иранцы вышли на улицы в радости и уничтожили любые символы монархии, от статуй до портретов королевской семьи. Премьер-министр приказал военным отступить и позволить народу выразить себя, стремясь утвердить себя в качестве нового лидера."
 Iranian_Revolution.31.d: "Премьер-министр Бахтияр официально пригласил аятоллу Хомейни вернуться после многолетнего изгнания. Аятолла прибыл вскоре после этого на чартерном рейсе в Тегеран. Миллионы иранцев вышли на улицу, чтобы поприветствовать культового революционного лидера. Его машина была так сильно обстреляна, что Хомейни в итоге был вывезен из аэропорта на вертолете. С толпами, повторяющими его имя и призывающими его руководить страной, Хомейни оставался стойким и твердым. Несмотря на уверенность премьер-министра пригласить его, Хомейни раскритиковал его правительство за то, что оно является продуктом коррумпированного шаха. Он также, по-видимому, критиковал понятие демократии без руководства клерикалов как неприемлемый сценарий. Вероятно, он займет более определенную позицию в ближайшие несколько дней."
 Iranian_Revolution.32.d: "Премьер-министр Шахпур Бахтияр, давний противник шаха, занял пост премьер-министра при условии, что шах покинет страну. Однако его решение было встречено осуждением со стороны его бывших союзников по национальному фронту и аятоллы Хомейни. Оба обвинили его в поддержке и легитимации шаха. После того как шах покинул страну, премьер-министр заявил, что он является временным правительством, и пообещал новые выборы в соответствии с демократической конституцией. Кроме того, он расформировал тайную полицию САВАК и освободил всех политзаключенных. Он также приказал военным больше не вмешиваться в акции протеста или демонстрации. Эти решения и пропаганда открыли переговоры с Национальным фронтом, но аятолла Хомейни продолжает критиковать Бахтияра. Хомейни остается принять решение, он может либо работать с Бахтияром и принять ограниченную роль для духовенства в новой конституции, либо он может приказать своим сторонникам создать параллельное временное правительство."
 Iranian_Revolution.33.d: "В последние несколько дней аятолла Хомейни поручил своим сторонникам создать советы местных органов власти и создать параллельное правительство от правительства премьер-министра Шахпура Бахтияра. Десятки тысяч молодых революционеров считают Хомейни своим лидером и охотно исполняют приказ. Через несколько дней параллельное правительство не только начало администрировать, но и изгнало сторонников режима Бахтияра. Для многих иранцев единственное правительство, которое они видят действующим, - это правительство Хомейни. Революционная молодежь также совершила набег на склады оружия и захватила тяжелое оружие, местные вооруженные силы отказались вмешиваться, опасаясь жертв среди гражданского населения. Несмотря на его усилия, Бахтияр, похоже, не в состоянии преодолеть разрыв между своей базой и революционной молодежью, возглавляющей революцию. В связи с ухудшением его положения Высший военный совет рассматривает вопрос о том, сможет ли он продолжать оказывать поддержку премьер-министру."
 Iranian_Revolution.34.d: "Высший военный совет объявил, что будет нейтральным в продолжающейся борьбе между правительством премьер-министра Бахтияра и аятоллой Хомейни. Без поддержки военных Бахтияр видел, как его последняя группа сторонников бежала, когда революционная молодежь захватила правительственные здания, дворцы, радио и телевизионные станции. Говорят, что сам Бахтияр бежал из страны, спасаясь от вооруженных революционеров. Это поражение знаменует окончательный крах последнего остатка старого режима. С быстрым приходом к власти Хомейни и его сторонников светская оппозиция во главе с Национальным фронтом завершает разработку новой конституции страны, которая, по их словам, обеспечивает роль духовенства. Еще неизвестно, допустит ли Хомейни и его сторонники новую конституцию, которая не предлагает полную Исламскую Республику."
 Iranian_Revolution.35.d: "После окончательного краха старого режима аятолла Хомейни управлял через свой Революционный совет и вспомогательные организации. Светская оппозиция во главе с Национальным фронтом и якобы в союзе с Хомейни организована как Национальный демократический фронт. Республиканская партия мусульманских народов состоит из умеренного духовенства во главе с великим аятоллой Мухаммедом Каземом Шариатмадари. Они утверждают, что исламская республика более умеренная, чем предложил Хомейни. Все эти политические силы были когда-то объединены в оппозиции к шаху, но теперь они все участвуют в конкуренции друг с другом за будущее Ирана."
 Iranian_Revolution.36.d: "Революционный совет провел общенациональный референдум, на котором народ Ирана просили либо одобрить исламскую республику, либо нет. Критики, такие как Национально-демократический фронт, считают референдум слишком расплывчатым, поскольку нет четких указаний на то, что такое Исламская республика. Референдум был также бойкотирован курдским населением, которое по-прежнему решительно выступает против установления шиитской теократии над своим в основном суннитским населением. В итоге, девяносто восемь процентов проголосовали за утверждение исламской революции. Аятолла Хомейни высоко оценил результат, заявив, что он является убедительным подтверждением его усилий по созданию подлинной исламской республики."
 Iranian_Revolution.37.d: "Иранская революция вызвала негативную реакцию со стороны роялистских, марксистских и этнических организаций, которые восстали против революционных сил. Хузестан и Иранский Курдистан являются основными очагами этого насилия. В Хузестане некоторые арабские жители требуют большей автономии, что приводит к вооруженным столкновениям с силами безопасности. Для курдов революция и упор на исламскую республику во главе с шиитами противостоит этой в основном суннитской этнической группе. Курдское восстание возглавляют левые боевики, стремящиеся к достижению автономии или независимости. В других областях небольшие группы марксистов нацеливаются на революционных лидеров, что ведет к еще большему количеству столкновений. Однако революционные силы, опирающиеся на огромные ресурсы бывших военных шаха, кажутся более чем способными справиться с этими угрозами."
 Iranian_Revolution.38.d: "Революционный совет признает рост различных групп противников по всей стране, и они особенно обеспокоены остатками старых военных шаха. Эти солдаты остаются в своих казармах, и их офицеры могут активировать их, когда они захотят. Чтобы противостоять этому влиянию, они согласились создать Революционную гвардию, состоящую из вооруженных, организованных активистов, которые будут защищать революцию от узурпаторов или врагов. Новая сила уже начинает операции, чтобы сорвать политические митинги и организацию конкурирующих политических партий. Ожидается, что в последующие недели Революционная гвардия станет достойным противодействием угрозе, которую по-прежнему представляют старые военные."
 Iranian_Revolution.39.d: "После успешного удаления шаха многие спросили аятоллу Хомейни о его мнении об исламской революции в более широком исламском мире. До своего возвращения Хомейни предполагал, что все мусульманские государства нуждаются в такой трансформации, но теперь, когда он занимает руководящую должность и командует, он должен решить, одобрить ли экспорт Революции или нет. Экспорт революции в целом соответствует идеологии, которую поддерживает Хомейни, и его публичное выступление об этом укрепит его базу поддержки, особенно в соседнем Ираке. Однако, если он решит вместо этого заявить, что революция должна сосредоточиться на внутреннем, он рискует оттолкнуть своих самых преданных последователей, но такое заявление успокоит его соседей."
 Iranian_Revolution.40.d: "До окончательного распада монархии Хасан Хабиби предложил конституцию для Ирана. По его версии, у Ирана будет сильный президент и законодательный орган. Совет священнослужителей будет консультировать по вопросам законов, но не сможет подготовить или отклонить законодательство. Левые обвиняют его в том, что он слишком похож на старую конституцию с президентом вместо шаха. В результате Ассамблея экспертов, состоящая в основном из священнослужителей, рассматривает документ, чтобы завершить его утверждение. Есть две фракции, одна из которых поддержана Хомейни, которые предлагают радикальные изменения в документе, чтобы создать настоящую Исламскую Республику. Умеренное духовенство хочет сохранить документ как есть, но дает совету священнослужителей больше полномочий для снятия законодательного акта, который считается оскорбительным для ислама. Страна ждет, чтобы увидеть, какая конституция появляется."
 Iranian_Revolution.41.d: "С его властью, защищенной Революционной гвардией и его Исламской Республикой, закрепленной в конституции, аятолла Хомейни торжествует над другими революционными группами. Чтобы обеспечить плавную передачу власти, он приказал Революционной гвардии и другим сетям насильственно подавлять партии светских и умеренных священнослужителей. Хомейни считает, что иранский народ нуждается в четком руководстве и едином голосе, чтобы направить его в эту новую эру для страны. Хомейни также назначил священнослужителей, которые будут ключевыми руководителями и советниками нового режима. Через несколько дней после его приказа наиболее организованная оппозиция Хомейни либо рухнула, либо бежала в изгнание, либо скрывалась."
 Iranian_Revolution.42.d: "С созданием Исламской Республики и новостями о шахе, проходящем курс лечения в Соединенных Штатах, толпы разгневанных студентов начали серию насильственных акций протеста возле американского посольства. Они требуют возвращения шаха и обвиняют американское правительство в том, что оно тайно пытается свергнуть новую Исламскую Республику. Премьер-министр успешно предотвратил выход ситуации из-под контроля, но сотрудники службы безопасности сообщили ему, что ситуация быстро обостряется. Премьер-министр решил попросить аятоллу Хомейни успокоить студентов, прежде чем их протесты приведут к катастрофе. Аятолла Хомейни может либо потворствовать студентам и поддерживать свое влияние на революционную молодежь, либо править ими и рискнуть потерять такую жизненно важную поддержку, когда он строит новый Иран."
 Iranian_Revolution.43.d: "После интенсивного посредничества американских дипломатов иранский шах согласился отречься от престола. После церемонии переезда, где он и его семья попрощались со своими сотрудниками во дворце, шах был доставлен в аэропорт, где он подписал документы об отречении, ознаменовав конец династии Пахлави. Зафрахтованный американский правительственный самолет, который доставил его и его семью в Соединенные Штаты. Через несколько часов после того, как шах покинул Иран, аятолла Хомейни прибыл из Парижа. Улицы Тегерана и других крупных городов были заполнены ликующими толпами, празднующими смещение шаха и возвращение Хомейни. Только благодаря американским переговорам шах смог уйти как можно более достойно. По прибытии Хомейни заявил о своей поддержке конституционного процесса."
 Iranian_Revolution.44.d: "Конституция была написана светскими политиками и демократическими лидерами. Документ призывает республику с комитетом священнослужителей консультировать по вопросам законодательства. Духовенство не будет иметь права вето или предлагать законы. Прежде чем он может быть окончательно утвержден, Ассамблея экспертов, состоящая в основном из духовенства, должна собраться, чтобы решить, соответствует ли конституция исламскому законодательству. В духовенстве существует разрыв, умеренные считают, что духовенство должно минимизировать взаимодействие с государством, в то время как более политически мыслящие, вдохновленные Хомейни и Шариатами, верят в исламское правительство. Соединенные Штаты, благодаря своей роли посредников, смогли использовать свое влияние для обеспечения того, чтобы умеренные лица доминировали в Ассамблее экспертов."
 Iranian_Revolution.45.d: "Решение о посредничестве во время кризиса пришло в критическое время. Хотя мы потеряли нашего давнего союзника шаха, мы успешно организовали его безопасный отъезд и установили связи с новым режимом. Шах и его семья будут жить комфортно и под нашей защитой. Что еще более важно, наша роль в оказании помощи иранскому народу в достижении республики, и конституция восстановила наш престиж в стране. Хотя многие иранцы по-прежнему считают нас ответственными за прошлые несправедливости, наши действия гарантировали, что новое правительство будет по меньшей мере сердечным. Со временем мы надеемся восстановить наши близкие отношения с иранским правительством."
 Iranian_Revolution.46.d: "Цикл протестов в Чехелом продолжается уже несколько месяцев, нанося ущерб экономике и стабильности Ирана. Тем не менее, последние два цикла протестов показали резкий рост протестов после первоначального падения. Решение шаха применить военную силу и безжалостно подавить протесты сначала, казалось, подавляло беспорядки. Тем не менее, количество смертей, особенно во время похоронных мероприятий, привело в ярость религиозных единомышленников и духовенства. Даже умеренные клерикалы, традиционно преданные шаху, тесно сотрудничают с революционными клерикалами, чтобы протестовать против верующих. Во время последних протестов в Чехеломе наибольшее количество людей возникло по всему Ирану. Хотя военные в качестве крайней меры приказали запустить оружие, неопытные солдаты часто паниковали, что приводило к многочисленным смертям по всей стране. Теперь даже светские оппозиционные группы пообещали принять участие в большем количестве во время следующего протеста в Чехелом через сорок дней."
 Iranian_Revolution.47.d: "о мере приближения следующего цикла протестов чехелом ситуация внутри иранских военных выглядит ужасной. Многие солдаты являются призывниками, и приказы чехелома разогнать демонстрантов и инциденты с расстрелами берут свое. Дезертирство растет, и старшие офицеры теряют контроль над своими подчиненными. Некоторые офицеры сообщают, что их солдаты обещали, что, если им будет приказано стрелять в протестующих, они вместо этого будут стрелять в офицеров. Высшее военное командование в значительной степени отклонило эти сообщения как преувеличенные и говорит шаху оставаться твердым, поскольку они полагают, что протесты скоро закончатся."
 Iranian_Revolution.48.d: "Очередные протесты в Чехеломе не на несколько дней, но Тегеран полон военной активности. Офицеры оцепляют ключевой район города. Министерство обороны в частности полностью окружено. Старшие офицеры встречались там с шахом и его кабинетом, чтобы обсудить меры безопасности для следующего протеста. Когда дошли собравшиеся, что здание окружили, двое старших офицеров, известных умеренных, объявили, что ситуация стала невыносимой, и несколько вооруженных солдат вошли в комнату. Затем шах был проинформирован о том, что офицеры и солдаты в вооруженных силах в основном не желают продолжать бойню граждан, и призвал его отстранить всех генералов и советников, которые выступали за подавление или рискуют распадом Ирана. Шах знает, что его собственные имперские гвардейцы, скорее всего, скоро наведут порядок, чтобы он мог дождаться умеренных или присоединиться к их действиям и отдать приказ о захвате старших чиновников и офицеров."
 Iranian_Revolution.49.d: "Шах потворствовал действиям умеренных офицеров и приказал своей имперской гвардии помогать солдатам в сборе жестких офицеров и чиновников. Затем шах обратился к народу, заявив, что его ввели в заблуждение, и патриотические военные смогли направить его на правильный путь. Он объявил, что следующая акция протеста будет продолжена без вмешательства военных. Во время протестов толпа восхваляла военных и продолжала осуждать шаха. Затем умеренные офицеры в частном порядке сообщили шаху, что его положение более не является надежным. Через несколько дней шах, как и его отец, объявил о своем отречении на престол ради своего сына. Совет регентства, возглавляемый его женой и состоящий из старших офицеров, обратится к оппозиции и обсудит планы новой конституции. Сам шах планирует немедленно покинуть страну на длительный период."
 Iranian_Revolution.50.d: "Шах назвал блефом умеренных офицеров, и через час его Имперская Гвардия восстановила контроль над Тегераном. Не было никаких серьезных случаев насилия, поскольку заговорщики знали, что без шаха план рухнет. Умеренные генералы и их подчиненные были задержаны и, вероятно, столкнутся с военным трибуналом. Шах и его высокопоставленные чиновники считают этот переворот заговором протестующих и планируют удвоить их усилия. Шах уже одобрил планы введения военного положения в нескольких стратегических областях, где лояльность офицеров не определена. Ободренный шах также одобрил дополнительные меры, чтобы наказать протестующих и задержать подозреваемых лидеров оппозиции."
 Iranian_Revolution.51.d: "\nПоскольку Ассамблея экспертов в значительной степени одобряет представленную ей конституцию, все смотрят на аятоллу Хомейни. С первых дней революции Хомейни выступал не только за смещение шаха, но и за истинную исламскую республику. Многие из его сторонников считают, что новая конституция не дает духовенству достаточно власти или влияния. Поскольку эти сторонники становятся все более громкими и порой враждебными, высокопоставленное иранское духовенство потребовало от Хомейни публично одобрить новую конституцию и стать председателем совета духовенства, чтобы консультировать Маджлис. Если Хомейни примет, его база потеряет импульс, но он получит высшую должность в новом правительстве, однако, если он откажется, он может подтолкнуть своих сторонников к своей позиции."
 Iranian_Revolution.52.d: "Отказавшись от высшего духовенства и нового правительства, аятолла Хомейни приказал своим сторонникам и Революционной гвардии создать параллельные правительства в провинциях и городах. Они будут обеспечивать руководство и управление, в то время как Хомейни и его Революционный совет будут напрямую из Тегерана. Приказ выполняется с энтузиазмом, особенно среди молодежи, и новое правительство оказывается насильственно вытесненным по всей стране. Остатки королевских военных подошли к правительству и объявили о своей готовности помочь ему восстановить порядок и реализовать новую конституцию."
 Iranian_Revolution.53.d: "Правительство Ирана, воодушевленное подтверждением того, что бывшие вооруженные силы помогут ему в борьбе за власть против аятоллы Хомейни, выдвинуло ультиматум. Они вновь подтвердили свое предложение назначить Хомейни председателем совета священнослужителей, если он согласится отказаться, распустив параллельное правительство. Кроме того, он должен направить Революционную гвардию на разоружение. За ультиматумом стоит подпись нескольких старших генералов, которые обещают обеспечить верховенство конституции. Говорят, что уже воинские части мобилизуются в казармах по всей стране. Хомейни может принять условия, или он может игнорировать ультиматум. В его лагере есть много людей, которые утверждают, что военные не смогут действовать против него."
 Iranian_Revolution.54.d: "С ультиматумом, проигнорированным Хомейни, иранские военные двинулись, чтобы разоружить и закрыть его параллельное правительство. Между революционной гвардией и военными быстро возникли интенсивные бои. Больше всего для правительства было перебежка нескольких подразделений, в том числе тяжелой техники к Хомейни. Похоже, что военные переоценили свои возможности, и ясно, что Иран столкнулся с полноценной гражданской войной. Победитель этого конфликта определит будущее страны, как республики, так и ислама."
 Iranian_Revolution.55.d: "Высший военный совет и шах признают, что период беспорядков недавно был под контролем из-за переговоров и уступок с оппозицией, особенно умеренным духовенством. После недавнего всплеска беспорядков было решено попытаться использовать эти соединения для наведения порядка. Кроме того, военнослужащим было дано указание избегать столкновений с протестующими, и местным правительственным чиновникам было рекомендовано также выдавать протестующим разрешения, чтобы избежать кровопролития. После нескольких недель интенсивных обсуждений шах согласился назначить нескольких священнослужителей старшими советниками правительства и подписать соглашение, гарантирующее права иранских граждан, закрепленные в конституции. Эти две реформы дают религиозной оппозиции место за столом и гарантируют защиту светской оппозиции от незаконных задержаний или репрессий. Протесты все еще продолжаются, но цифры начинают падать."
 Iranian_Revolution.56.d: "\nВ широко разрекламированном мероприятии старший кабинет и лидеры Высшего военного совета заявили о вечной верности наследнику престола и его матери, которых шах назначил регентом. Шах заявил, что это событие должно было обеспечить стране продолжение династии Пехлеви и стабильность правительства. Для наблюдателей это событие рассматривается как подтверждение того, что шах может страдать проблемами со здоровьем, поскольку его публичные выступления в последнее время заметно сократились. Даже во время мероприятия, несмотря на то, что он был в своей лучшей форме, шах казался отсталым и болезненным для всех присутствующих."
 Iranian_Revolution.57.d: "\nШах Ирана уехал в Соединенные Штаты для того, что он назвал рутинными медицинскими процедурами. Шах объявил, что он не покинет страну без твердого руководства, и назначил Совет по регентству, который будет управлять в его отсутствие. Регентский совет будет находиться под контролем его жены, королевы. Члены Высшего военного совета также были назначены. Учитывая, что его семья осталась позади, многие ожидают, что шах скоро вернется, но его решение уйти продолжает подпитывать слухи о его здоровье."
 Iranian_Revolution.58.d: "Уступки, предложенные правительством, и назначение старшего духовенства на руководящие консультативные должности в значительной степени положили конец протестам против правительства. Те, кто все еще участвует, в основном являются самыми радикальными антимонархистами и преданными последователями аятоллы Хомейни. Военные недавно сообщили Совету по делам регентов, что они больше не считают, что протесты представляют угрозу для правительства или даже общественного порядка. Это знаменует собой крупную победу для правительства и служит хорошим предзнаменованием для Совета регентства, поскольку он ожидает возвращения шаха после его лечения в Соединенных Штатах."
 Iranian_Revolution.59.d: "Шах Мохаммад Реза Пахлави скончался вчера в Соединенных Штатах. Он проходил курс лечения, теперь понимаемый как лечение рака. Его тело было быстро доставлено обратно в Тегеран, где его семья, включая его маленького сына, получила его в аэропорту. Императорская гвардия перекрыла большинство основных дорог, так как тело было доставлено во дворец во время подготовки к похоронам. Многие иностранные высокопоставленные лица уже прибывают в страну для участия в его похоронах. Реакция общественности во многом приглушена, у шаха сложная история со своим народом. Он наблюдал за крупными усилиями по реформе и модернизации, но также твердо держал власть с обвинениями в том, что его правительство совершало нарушения прав человека для поддержания власти. Ожидается, что новый шах, Реза Пахлави, в конце концов будет возведен на престол его матерью и Советом регентства."
 Iranian_Revolution.60.d: "\nПосле смерти шаха Мухаммеда Реза Пахлави Высший военный совет публично объявил о подтверждении того, что он продолжает оказывать поддержку Совету регентства королевы Фары. Он добавил, что полномочия шаха также будут сохраняться через совет, и когда его сын будет готов, шах Реза Пахлави вступит на престол с полными полномочиями своего отца. Объявление рассматривается как явная угроза для любого лица в стране, которое, возможно, планировало подорвать или бросить вызов монархии в этот переходный период. В целом кажется, что население Ирана хочет видеть, какой тип лидера является шах Реза, и это объявление было в основном предназначено для амбициозных правительственных чиновников или военных лидеров."
 Iranian_Revolution.61.d: "\nПосле оживленных дискуссий и обсуждений Ассамблея экспертов одобрила конституцию с небольшими изменениями. Совет духовенства будет иметь больше прав в законодательстве, связанном с социальными вопросами, однако общая структура законодательного органа и сильная исполнительная власть были утверждены. Левые разочарованы, опасаясь, что президент может просто стать новым шахом при новой системе, но многие по всей стране хвалят превращение Ирана в республику. Хотя священнослужители в целом счастливы, еще неизвестно, как аятолла Хомейни и его сторонники будут относиться к республике, в которой."
 Iranian_Revolution.62.d: "После дискуссий между Советом регентства и оппозицией, включая Национальный фронт и антиправительственное духовенство, была принята новая конституция. Новая конституция уполномочивает премьер-министра управлять через Маджлис. Шах будет оставлен с в значительной степени церемониальными функциями и ролью в вооруженных силах. Совет по делам регентов принял эти условия, так как шах в настоящее время слишком молод, и общественная атмосфера совершенно противоположна монархии. Хотя, как говорят, иранская общественность в значительной степени одобряет документ и с нетерпением ожидает новых выборов, некоторые наблюдатели опасаются, что положение, придающее шаху неопределенную роль в вооруженных силах, может в конечном итоге стать способом возвращения монархии."
 Iranian_Iraq_War.1.d: "Несколько правительственных зданий в преимущественно шиитских кварталах были недавно взорваны. Личности бомбардировщиков неизвестны, но в сообщениях указывается, что это, скорее всего, шиитские радикалы, вдохновленные иранской революцией. Аятолла Хомейни постоянно призывал иракских шиитов присоединиться к революции и свергнуть наше правительство. Он продолжает делать эти заявления, несмотря на усилия наших дипломатов, просящих его прекратить. Такие действия заставляют наше правительство выглядеть неделей и ободряют радикалов. Расследование немедленно начато."
 Iranian_Iraq_War.2.d: "Несмотря на наши постоянные призывы к аятолле Хомейни прекратить призывать иракских шиитов восстать против правительства, он продолжает это делать. Эта опасная риторика продолжает вызывать проблемы, поскольку несколько правительственных чиновников были недавно убиты. Еще раз ясно, что виновниками являются радикалы, вдохновленные Хомейни. Эти атаки наряду с бомбежками являются явными провокациями. Созывается совещание высокопоставленных правительственных чиновников для рассмотрения наших вариантов борьбы с иранской угрозой."
 Iranian_Iraq_War.3.d: "Во время встречи высокопоставленных правительственных и военных чиновников состоялись дискуссии о том, как бороться с продолжающейся радикализацией нашей шиитской молодежи аятоллой Хомейни. Одна фракция утверждает, что иранская революция угрожает не только нашему народу, но и нашим арабским братьям в Хузестане. Для них лучшим подходом было бы освобождение Хузестана и его нефтяных месторождений. С этим под нашим контролем мы можем диктовать Хомейни, что он может или не может сказать. Такой операции, скорее всего, будет легко осуществить, поскольку иранские военные в смятении после революции. Другая фракция утверждает, что мы должны продолжать дипломатические усилия и позволить ситуации успокоиться. Хотя взрывы и убийства обескураживают, похоже, это работа небольшого меньшинства, которое мы можем в конечном итоге искоренить."
 Iranian_Iraq_War.4.d: "Иракские войска при поддержке танков и авиации пересекли иранскую границу для Хузестана. Правительство Ирака объявило, что операция является ответом на иранский терроризм против иракского народа. Он также добавил, что иранское правительство представляет собой экзистенциальную угрозу для арабов Хузестана, и Ирак выполняет свои обязанности по их освобождению. Первоначальное сопротивление Ирана, похоже, до сих пор практически не существовало. Однако уже есть сообщения о том, что бывшие военные активы шаха мобилизуются вместе с энтузиастами-добровольцами для противодействия вторжению Ирака."
 Iranian_Iraq_War.5.d: "Наше правительство очень внимательно следит за ситуацией в Иране. Успешная революция будет иметь много последствий для нас. Наше значительное население шиитов может оказаться под влиянием радикальных идеологий, и это необходимо контролировать. В то же время хаос в Иране может предоставить нам некоторые возможности. Мы граничим с иранской курдской территорией и богатой нефтью арабской провинцией Хузестан. Если правительство и военная ситуация резко ухудшатся, это может дать возможность нашим силам действовать. В течение многих лет размер и сила Ирана сдерживали и ограничивали наши возможности, но в условиях революционных волнений мы можем находить решения спорных вопросов, которые существовали десятилетиями."
 Iranian_Iraq_War.6.d: "Известия об иранской революции, успешно удалившей шаха, указывают на новый сдвиг в регионе и в наших отношениях с Ираном. В последние годы наше правительство и шах подписали несколько договоров о нашей общей границе. Поскольку он больше не у власти, а иранские военные, несомненно, в смятении, это может стать для нас моментом разрешения споров в нашу пользу. Мы, конечно, можем утверждать, что договоры больше не применяются сейчас, и в интересах всего мира мы берем эти земли и людей, живущих там, чтобы защитить их от революционного насилия. Другие члены кабинета выступают против вмешательства, они считают, что нам следует подождать, чтобы увидеть, какое правительство появится, и привлечь их. Публично заявив о нашем уважении к договорам, мы, возможно, сможем установить тесные отношения с Ираном."
 Iranian_Iraq_War.7.d: "Иранская революция кажется неудержимой. После изнурительной борьбы с иракским правительством его силы захватили Багдад, и военное сопротивление Ирака в основном прекратилось. Правительство Ирана объявило, что вскоре выведет свои войска из Ирака и оставит исламское правительство в качестве подарка давно угнетенному иракскому народу. Ожидается, что новый иракский режим будет тесно связан с Тегераном, и в нем будет доминировать большинство иракских шиитов. Победа Ирана уже вызывает шок во всем регионе, поскольку соседние государства уже проводят политику, направленную на предотвращение влияния Ирана и его панисламской идеологии на свое население. Для бывшего иракского правительства этот результат подчеркивает грубую ошибку, которую они совершили, вторгшись в Иран, чтобы остановить экспорт революции и вывести провинцию Хузестан с арабским большинством из состава Ирана."
 Iranian_Iraq_War.8.d: "Праздничные толпы вышли на улицы Багдада и других иракских городов после объявления о том, что война закончилась победой страны. Первоначально иракское правительство начало войну из страха перед исламской революцией, распространяющейся на его население, и из-за желания урегулировать свои давние пограничные проблемы с Ираном. Иракские военные рассчитывали, что иранское правительство будет слабым и хаотичным после революции и сможет достичь своих целей. Оказалось, что они были правы, так как иракские военные не только обеспечили свои претензии на границе, включая освобождение арабского большинства провинции Хузестан, но и свергли исламское правительство в Тегеране. Новое иранское правительство возглавляет Национальный совет сопротивления Ирана, в котором доминирует светская левая организация MEK. Он уже очищает исламистов и согласился уступить Хузестан Ираку, утверждая, что это воля народа. Региональные государства обеспокоены тем, что победа Ирака может подтолкнуть его руководство к поиску аналогичных решений в других спорах."
 Iranian_Iraq_War.9.d: "Праздничные толпы вышли на улицы Багдада и других иракских городов после объявления о том, что война закончилась победой страны. Первоначально иракское правительство начало войну из страха перед исламской революцией, распространяющейся на его население, и из-за желания урегулировать свои давние пограничные проблемы с Ираном. Иракские военные рассчитывали, что иранское правительство будет слабым и хаотичным после революции и сможет достичь своих целей. Оказывается, они были частично правы, иракским силам удалось захватить Хузестан, но попытки продвинуться вглубь Ирана и уничтожить революцию затормозились. Для иранцев, хотя им удалось остановить дальнейшую экспансию Ирака, они не смогли выбить их из Хузестана. В сложившейся ситуации правительство Ирана неохотно согласилось прекратить войну и уступить Хузестан Ираку. Ирак рассматривает соглашение как полную победу, но многие аналитики предполагают, что иранцы могут возобновить конфликт, как только восстановят свои вооруженные силы."
 Iranian_Iraq_War.10.d: "Ирано-иракская война началась после того, как иракское правительство первоначально вторглось в Иран из-за страха перед исламской революцией, распространяющейся на его население, и стремления обеспечить свои давние пограничные проблемы с Ираном. Иракские военные рассчитывали, что иранское правительство будет слабым и хаотичным после революции и сможет достичь своих целей. Однако после некоторых первых успехов иранское население сплотилось и сумело изгнать иракцев из страны. Затем обе стороны попытались вторгнуться в другую, иранское правительство пообещало создать исламское правительство в Багдаде. Ни одна из сторон не преуспела, и обе стороны согласились на прекращение огня, которое по существу возвращает довоенные границы. Ирак претендует на победу за успешное прекращение распространения исламской революции, называя себя арабским оплотом против персидских полчищ. Иранцы также заявляют о своей победе за свое национальное сопротивление иностранной оккупации. Многие аналитики не удивлены тем, что обе страны закрутили военную патовую ситуацию как победу, чтобы показать своему народу, что война не была напрасной."
 Iran_Iraq_War_decision_category: "Ирано-иракская война"
 The_Iranian_Iraqi_War: "Ирано-иракская война"
 Iran_Iraq_War_decision_category_desc: "Потрясение иранской революции предоставило Ираку как возможность, так и опасность. Многие в Ираке видят хаос в Иране как возможность использовать военную силу для решения пограничных проблем и освобождения провинции арабского большинства Хузестан. Однако иранская революция и панисламские побуждения, которые она пропагандирует, прямо бросают вызов арабской националистической идеологии Ирака. Если не отметить, Ирак рискует революцией среди своего собственного шиитского населения. Исходя из этих соображений, иракское правительство решило, что оно должно действовать для достижения своих целей до того, как новый иранский режим поселяется или его собственное население взрывается в беспорядках."
