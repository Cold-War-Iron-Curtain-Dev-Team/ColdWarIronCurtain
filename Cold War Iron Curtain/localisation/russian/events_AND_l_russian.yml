l_english:
 AND.1_desc: "Его Превосходительство Рамон Иглесиас-и-Наварри, возглавлявший Андорру во время Второй мировой войны, ушел в отставку из-за проблем со здоровьем. Теперь наш новый правитель - Рамон Малья Каль. Мы будем помнить нашего старого соправителя, который помог развитию туризма в нашем Княжестве."