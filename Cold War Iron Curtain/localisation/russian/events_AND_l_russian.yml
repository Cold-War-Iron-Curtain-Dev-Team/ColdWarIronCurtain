l_russian:
 AND.1_desc: "Его Превосходительство Рамон Иглесиас-и-Наварри, возглавлявший Андорру во время Второй мировой войны, ушел в отставку из-за проблем со здоровьем. Рамон Малла Колл теперь наш новый соправитель. Мы будем помнить нашего старого соправителя, который помог развитию туризма в нашем княжестве."
