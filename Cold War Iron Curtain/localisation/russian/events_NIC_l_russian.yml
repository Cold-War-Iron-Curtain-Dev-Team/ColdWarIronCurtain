 nic.5.d: "Кофе входит в число самых популярных экспортных товаров Никарагуа. Впервые кофе начали выращивать внутри страны в качестве диковинки в начале XIX века. Однако в конце 1840-х годов, по мере роста популярности кофе в Северной Америке и Европе, в окрестностях Манагуа началось коммерческое выращивание кофе. К началу 1850-х годов пассажирам, пересекающим Никарагуа по пути в Калифорнию, подавали большое количество никарагуанского кофе. К 1870-м годам кофейный бум в Центральной Америке был в самом разгаре, и большие территории на западе Никарагуа были расчищены и засажены кофейными деревьями.\n\nВ отличие от традиционного скотоводства или натурального хозяйства, производство кофе требует значительного капитала и большого количества рабочей силы. Поэтому были приняты законы, поощряющие иностранные инвестиции и позволяющие легко приобретать землю. Прибыль от производства кофе утекает за границу или к немногочисленным землевладельцам. Налоги на кофе фактически отсутствуют."
 nic.6.d: "Некоторые гражданские лица, никарагуанские военные в изгнании и другие действующие военные, не согласные с президентом Сомосой Гарсией, задумали государственный переворот. По слухам, даже Эмилиано Чаморро имеет к этому отношение.\n\n В [GetDate] на южном шоссе Манагуа была организована засада с целью захвата президента Сомосы Гарсии, направлявшегося в имение Монтелимар. Её спланировали и организовали офицеры Национальной гвардии вместе с группой молодых консерваторов и одним-двумя либералами, которые отвергали правление Сомосы. Когда в столице узнали о перевороте, они услышали, что..."
 nic.7.d: "Президент Сомоса только что сообщил нам, что два члена Национальной гвардии были убиты и один ранен сегодня при попытке покушения на него. Три грузовика с оружием и боеприпасами были доставлены контрабандой из Коста-Рики с полного ведома костариканских чиновников, особенно полковника Эрреры из Гражданской гвардии, утверждает президент. Прошлой ночью на него пытались устроить засаду, когда он выходил из нашего дома, но он сказал нам, что его предупредили, и гвардейцы прогнали людей от расположенного неподалеку городского резервуара с водой. Сегодня двое гвардейцев попытались остановить подозрительный грузовик на дороге в Монтелимар, но его пассажиры открыли огонь. В бой вступил полицейский на мотоцикле, и он и один охранник были убиты, а другой ранен. Проходивший мимо ребёнок также погиб. Нападавшие скрылись, но, как полагают, были окружены. Сомоса рассказал полковнику Лейтону, что в грузовике было четырнадцать человек. Полковник Роджерс говорит, что ВВС заметили брошенный грузовик с боеприпасами, и он узнал, что несколько человек в джипе были арестованы перед воротами моей резиденции прошлой ночью.\n\nПрезидент сказал Лейтону, что объявляет военное положение. Президент утверждает, что генерал Чаморро причастен к заговору. Вчера вечером Чаморро не появился в моей приемной, что было необычно, - прокомментировал Сомоса."
 nic.8.d: "План потерпел поражение, и все участники были схвачены. Впоследствии большинство пленных были вывезены на кофейные плантации в департаменте Карасо и жестоко казнены, некоторые, оставшиеся в живых, были помещены в военные тюрьмы Лома-де-Тискапа, позже их судили в военном совете, а казненные были частично сожжены и похоронены в общей могиле. \n\nНебольшая группа повстанцев, которым удалось вырваться из ловушки, устроенной Национальной гвардией, и которые направлялись к костариканской границе на грузовике, были схвачены в Куатро Эскинас и все были казнены войсками под командованием капитана Агустина Перальта Руиса. \n\nСтолкнувшись с репрессиями, многие ушли в самоизгнание или укрылись в посольствах; пакты были разорваны, и генерал Эмилиано Чаморро приказал вывести консервативных депутатов и сенаторов из Национального конгресса, но не все из них обратили на него внимание."
 nic.9.d: "Эпоха Анастасио Сомосы Гарсии внезапно закончилась, когда он был убит во время государственного переворота, совершённого недовольными военными и гражданскими. На его место встал бывший офицер Национальной гвардии Адольфо Баэс Боне, возглавивший Фронт спасения Никарагуа. Он пообещал превратить Никарагуа в настоящую демократию. Уже сейчас многие бывшие сторонники Сомосы покидают страну."
 nic.10.d: ""
 nic.11.d: "Хосе Фигерас Феррер, умеренный социалист, был избран президентом Коста-Рики в 1953 году. Наш президент Анастасио Сомоса уверен, что он участвовал в заговоре с целью его убийства при помощи Карибского легиона (легион поддерживал Фигераса на выборах); Сомоса быстро разработал планы мести и решил связаться с Рафаэлем Кальдероном Гуардиа, недовольным бывшим президентом Коста-Рики, который должен возглавить отряд повстанцев на юг из Никарагуа в Коста-Рику. К счастью для нас, Кальдерон согласен с планом и обещает достойную оплату в случае успеха."
 nic.12.d: "Срочные новости с границы Никарагуа: силы, верные недовольному бывшему президенту Рафаэлю Кальдерону, пересекли границу и начали вторжение. Повстанцы уже захватили приграничный город Вилья-Кесада. Тем временем наше правительство мобилизует свои полицейские силы, Гражданскую гвардию и военизированные отряды сторонников правительства, чтобы противостоять захватчикам. Мы должны попросить ОАГ вмешаться, пока не стало слишком поздно."
 nic.13.d: "Организация Американских Государств обнаружила, что правительство Никарагуа поддерживает повстанцев, и как только об этом было объявлено, правительство Никарагуа прекратило поддержку повстанцев. США продали Коста-Рике четыре истребителя, в то время как повстанцы были подавлены правительственными войсками, поддерживаемыми народом. После ожесточенных боев в нескольких северных городах повстанцы были вытеснены из Коста-Рики. Хосе Фигерас обвинил ЦРУ в тайном содействии вторжению в Никарагуа, посылая пилотов и самолеты для тайного нападения на Коста-Рику, в частности, подвергнув пулеметному обстрелу по меньшей мере 11 деревень."
 nic.14.d: "Организация американских государств не нашла поддержки для Кальдеронистских повстанцев. После ожесточённых боёв в нескольких северных городах повстанцы смогли начать восстание против Фигуреса. В результате Фигурес ушёл в отставку, а Рафаэль Кальдерон занял пост президента."
 nic.15.d: "Луис Сомоса Дебайле закрепил свой контроль над президентским креслом в результате фальсификации выборов в феврале 1957 года, которые бойкотировала вся оппозиция, кроме марионеточной Консервативной националистической партии. В ответ на эти выборы была создана Социал-христианская партия, получившая поддержку молодых консерваторов, недовольных тем, что их партия не смогла оказать никакого политического влияния на диктатуру."
 nic.16.d: "В разгар восхождения Луиса Сомосы на престол летом 1957 года Луис Сомоса обнародовал указ о широкой и безоговорочной амнистии. Время, на которое распространяется действие этого указа об освобождении от наказания, охватывает период с 1950 года до даты его публикации в официальной государственной газете La Gaceta. В нём много внимания уделяется событиям 1954 года и не упоминаются трагические события 1956 года, связанные с убийством его отца, но поскольку это время охватывает день обнародования данного указа об амнистии, Луис Сомоса помиловал и исполнителей, и всех, кто мог быть к этому причастен, и всех заключённых и ссыльных, как виновных, так и невиновных в смерти Сомосы Гарсии, а также причастных к последующим пыткам и смертям."
 nic.17.d: "Несмотря на многочисленные реформы Луиса Сомосы, в стране сохраняется сильная оппозиция. С триумфом Фиделя Кастро на Кубе и его самоотверженными усилиями по экспорту революции и, кроме того, его поступок стимулировал стремление многих повторить эту одиссею, в том числе и здесь, в Никарагуа.\nНа равнинах Оламы приземлился самолёт из Пунта Ллорона, Коста-Рика, с 45 вооруженными повстанцами, стремящимися свергнуть правительство Луиса Сомосы. Другая группа приземлилась в Моллехонесе, в долине Чонталь, недалеко от Санто-Томаса. Бойцы принадлежат к группам никарагуанской буржуазии, а также к кубинским повстанцам.\nЕсли этого недостаточно, в Эль-Чапарраль также вторгаются экспедиционные силы, возглавляемые Че Геварой с Кубы. Вследствие этого студенты, в основном в Леоне, проводят крупные демонстрации."
  
  
 nicr.1.d: "В Никарагуа только что произошла революция. Насколько нам известно, оппозиция Анастасио Сомосы Гарсии совершила переворот против него, в ходе которого он был убит. Новым лидером стал бывший офицер Национальной гвардии Адольфо Баэс Боне. Он уверяет нас, что это не повлияет на наши хорошие отношения."
 nicr.2.d: "Сегодня день наших действительно свободных и справедливых выборов. В выборах участвуют Консервативная партия и Независимая либеральная партия.\nПартия консерваторов - старейшая из существующих в Никарагуа партий. Она была основана в XIX веке, когда Никарагуа утвердилась в качестве независимой республики, представителями элиты Гранады. Её цель - сохранить хорошие отношения между Никарагуа и США.\nПартия Либерал Индепенденте была сформирована после отделения от Националистической либеральной партии Сомосы в 1944 году. Она считает себя преемницей старой Либеральной партии."
 nicr.3.d: "В настоящее время обсуждается судьба Националистической либеральной партии (Partido Liberal Nacionalista). Изначально она придерживалась либеральных взглядов (либералы были одной из двух главных партий Никарагуа с XIX века наряду с консерваторами), но впоследствии Националистическая либеральная партия превратилась не более чем в политический инструмент клептократии клана Сомоса. Когда Анастасио Сомоса Гарсия пришел к власти в 1936 году, партия объединилась с США и другими политиками Латинской Америки, такими как Рафаэль Трухильо, Освальдо Лопес Арельяно и Фульхенсио Батиста.\n\nНынче было выдвинуто предложение. В нем мы разрешаем бывшим членам вступить в нашу партию, Partido Liberal Independiente. Это поможет нам выглядеть лучше, чем жестокий режим Сомосы.\nНекоторые, однако, опасаются, что их вступление может вернуть Никарагуа к диктаторскому режиму. Конечно, мы всегда можем разрешить некоторым членам присоединиться к нам, но с ограничениями, например, не допуская их к высшим руководящим должностям."
 nicr.4.d: "Пришли срочные новости. Похоже, что президент Энок Агуадо Фарфан погиб в результате взрыва автомобиля. Это произошло около 9:30 утра, когда президент ехал на пресс-конференцию в Леон. Президент и двое других, находившихся в машине, погибли.\nПо данным полиции, мотив нападения неизвестен. Однако некоторые предполагают, что в этом виноваты бывшие члены администрации Сомосы. После быстрых выборов лидера новым президентом стал Рене Шик Гутьеррес, бывший член Националистической либеральной партии, ныне Объединенной либеральной партии."
  
 nic_go_ahead_tt: "Разблокирует решения для подготовки к вторжению"
  
 nicc.1.d: "Теперь, когда мы закрепили за собой власть в стране, мы отдадим Луиса Сомосу Дебайле под суд за его преступления на посту президента в 1956-1959 годах. Суд будет быстрым и будет проводиться Революционным судом справедливости. Возглавляемый [NIC.GetLeader], суд совещался 3 дня, в течение которых образовались две стороны. Первая сторона хочет заключить его в тюрьму. Во время заключения он должен быть перевоспитан в хорошего работника, как император Пуйи. Вторая сторона, напротив, хочет повесить его за преступления, которые он и его семья совершили во время их правления.\n\nЛуис Сомоса Дебайле, этот суд признает вас виновным в государственной измене и преступлениях против человечества. В связи с этим суд приговаривает вас к..."
 nicc.2.d: ""
 nicc.3.d: "Хотя большая часть имущества и вещей Сомосы была передана государству, некоторые незначительные вещи будут розданы. Такие вещи, как мелкая недвижимость, автомобили, драгоценности и другие подобные вещи. Теперь [NIC.GetLeader] должен решить, кому они достанутся. Один из вариантов - случайным образом раздать их рабочим и крестьянам в лотерее. Таким образом, они будут раздаваться справедливо и поровну. С другой стороны, их можно вручить высшему руководству партии за усердную работу и преданность революции. Однако народ может этого не заметить и, скорее всего, обвинит нас в олигархии."
 nicc.4.d: ""
 nicc.5.d: "Генерал Адольфо Калеро Портокарреро объявил военное положение в Никарагуа в ответ на вспышку насилия после того, как бывший генерал Сомоса совершил переворот несколько дней назад.\n\nВ своей телеречи из президентского дворца в Манагуа, Калеро сказал, что он вводит чрезвычайное положение, чтобы регулировать и контролировать безопасность в стране, после вспышки насилия в различных частях страны после переворота.\n\n\N 'Я объявляю чрезвычайное положение, с целью наблюдения и контроля внутренней безопасности национального государства. Этим актом я подтверждаю своё правление и намерен провести оценку в ближайшие недели, чтобы увидеть, какие меры необходимо принять для обеспечения безопасности нашей страны', - сказал Калеро.\n\n\n23 солдата были убиты во время протестов, а по неофициальным данным, с момента путча погибло 1588 человек."
 nicc.6.d: "WIP"
 nicc.7.d: "ОТ: Директор Службы Интеллигенции\nSUBJECT: Операция 'Бдительный глаз'\n\nПредседатель, прилагаю отчёт об операции 'Бдительный глаз'. Наши оперативники внедряются в церкви, следят за священнослужителями и самими церквями. Чтобы было понятно, мы следим не только за церковью, но и за теми, кто имеет к ней отношение. Мы ищем любые подозрительные действия, которые могут быть признаками предстоящих антиправительственных демонстраций или террористических актов. Мы будем публиковать более подробную информацию по мере проведения операции. Но позвольте мне сказать, что мы будем неустанно преследовать тех, кто стремится спровоцировать наших соотечественников и нарушить общественный порядок.\n\nДа здравствует революция!"
 nicc.8.d: "Томаш Борге сидел за своим столом, когда зазвонил телефон. На другом конце был Серхио Фонтанес, капитан местного отделения СДЛ в департаменте Масая. У него был довольный голос.\n\n 'Товарищ, операция 'Бдительный глаз' дала свои результаты. Всего несколько часов назад наши офицеры, следуя наводке, провели неожиданный рейд в церкви Ла Асунсьон в Масае. Были арестованы несколько подозреваемых, в том числе Хосе Р. Сомоса, бывший генерал Сомоса и член Национального никарагуанского союза', - сказал Фонтанес.\n\n 'Кроме того, офицеры изъяли несколько единиц оружия, поддельные документы и украденные правительственные документы' - добавил Фонтанес.\n\n 'Это доказывает нашу правоту. Что церкви сотрудничают с повстанцами. Сколько ещё подобных ячеек существует в стране. Их деятельность незаконна и должна быть пресечена' - ответил Борге.\n\n 'Действительно, товарищ. Однако мы должны быть осторожны с нашими дальнейшими действиями, чтобы они не проболтались. Я составлю официальный отчет о рейде и отправлю его в штаб СДЛ. Вот и всё.\n\nНа этом Фонтанес попрощался и положил трубку. Борге налил себе выпить и с лёгкой улыбкой сел в кресло."
 nicc.9.d: "Вчера Национальная полиция провела массовые аресты по всей Никарагуа. Целью этих арестов, судя по всему, были члены ФССН, запрещенной бывшей правящей партии страны.\n\nВ последние недели ФССН активизировала свои призывы к всеобщей забастовке и открытому восстанию против правительства. Недавно ФССН организовал серию блокпостов на побережье Москито, а также открытые беспорядки на улицах Манагуа, Сан-Хуан-де-Никарагуа и Масая.\nВ общей сложности 742 человека были арестованы за предполагаемое насилие, терроризм и другие обвинения. Во время арестов были ранены 34 офицера, а 148 повстанцев были убиты."
 nicc.10.d: "Утреннее солнце начинает светить, и в воздухе витает волнение. Впервые за последние десятилетия мы проводим свободные демократические выборы. Чтобы предотвратить преследования со всех сторон, избирательные участки охраняются как Национальной полицией, так и международными наблюдателями ООН. Первые участки открываются в 8:00 утра, и очереди растягиваются на многие километры. Работники избирательных участков начинают раздавать бюллетени, и выборы идут полным ходом. На пост президента претендуют четыре партии, у которых есть шансы на победу.\n\nСозданная из сторонников и членов коммунистического режима, Либеральная Рабочая Коалиция (ЛРК) провозглашает себя демократической социалистической партией, однако очевидно, что сандинистская идеология по-прежнему доминирует в ней.\nПосле недавних арестов и преследований бывших членов ФССН список потенциальных кандидатов был невелик. В итоге они выдвинули Артуро Конехеро.\n\nПреемник либеральных партий прошлого, Либерально-конституционная партия (ЛКП) рассматривается как правоцентристская либерально-консервативная партия. Их кандидатом является Рамиро Сакаса Герро, родственник Сомосаса, который присоединился к революции, чтобы сместить его.\n\nПартия Консервадор Унидо (ПКУ) - давний соперник либералов Никарагуа. В её состав входят представители городской элиты, некоторые представители бывшей партийной элиты и христианские демократы. Их кандидатом является Фернандо Агуэро Роча, член Национального конгресса.\n\nА также наименее вероятный победитель, Движение за национальную безопасность Никарагуа, известное как Эль Движение. Оно состоит из бывших членов правительства Сомосы, бывших генералов и других националистических и правых групп. Ходят слухи, что за кулисами партия контролируется ЦРУ. Поэтому эта партия, скорее всего, понравится американцам.\nПоскольку партия разнородна, ей было трудно выбрать лидера. Хотя предполагалось, что борьба будет вестись между нынешним лидером Адольфо Калеро и Артуро Крузом-старшим, в итоге выбор пал на Энрике Бермудеса, известного как Comandante 380 и подполковника армии.\n\nПосле того как бюллетени закрываются, сразу же начинается подсчет голосов. По мере подсчета голосов результаты транслируются по радио и телевидению.\n\ Дорогие никарагуанцы. Голоса подсчитаны, и новая партия, победившая на выборах в пресдентальный парламент, а также получившая большинство голосов в Национальном конгрессе..."
 nicc.11.d: "ОТ: Редактировано\n\nТоварищ Борге. Согласно вашим указаниям, Карлос Фонсека лишён должности заместителя председателя партии. Он останется рядовым членом партии, но больше не будет участвовать ни в каких партийных собраниях или в выработке политики. Он не будет занимать никаких политических постов в партии. Это наказание за его роль в заговоре после того, как Центральный комитет проголосовал против вашего смещения. Уверяю вас, это не будет иметь для нас никаких последствий."
 nicc.12.d: "ОТ: Министр иностранных дел,\n\nУважаемый председатель,\nМы представляем вам предложение, которое может изменить экономику Никарагуа и укрепить наши международные отношения со странами COMECON, особенно с Восточной Германией. Министерство иностранных дел разработало туристическую программу, направленную на привлечение туристов из этих стран. Эта инициатива включает в себя строительство новых отелей на западном побережье и превращение города Блюфилдс в туристическую точку.\n\nЕсли этот план будет реализован, он принесёт прямые инвестиции и высокодоходный туризм из-за пределов Никарагуа, что будет способствовать росту нашей экономики. Однако, как и в любом значительном проекте, здесь есть свои трудности, которые мы должны преодолеть. Во-первых, нам необходимо значительное количество средств на строительство и обеспечение безопасности города. Во-вторых, у общины мискито есть опасения, что предложенный план повлияет на их культуру и образ жизни. Признавая их обеспокоенность, мы считаем, что этот проект принесет значительную пользу всей стране.\n\nПоэтому я прошу вас внимательно рассмотреть это предложение и взвесить его потенциальные преимущества и возможные недостатки. Должны ли мы продвигаться вперёд по этому плану или нам следует пересмотреть его? Решение остается за вами, господин председатель."
 nicc.13.d: "В результате внеочередного собрания партии Томашу Борге не оставалось ничего другого, как объявить о своей немедленной отставке с поста лидера партии. В результате партия избрала вместо него Карлоса Фонсеку."
 nicc.14.d: "Че Гевара покинул Никарагуа, чтобы помочь другим революциям. В связи с этим нам нужен новый председатель. Многие ожидали, что этот пост займут Карлос Фонсека или Томас Борхе, но в итоге его занял Сильвио Майорга Морено, близкий соратник и друг Гевары. В своей первой речи он пообещал продолжить путь, который Че Гевара проложил для Никарагуа."
 nicc.15.d: "Пришло время политбюро избрать нового вице-председателя партии. Прежний председатель Сильвио Майорга был выдвинут на руководящий пост после ухода Че, и поэтому нужен новый вице-председатель.\nЭлита партии, включая региональных представителей и высокопоставленных чиновников, собралась в столице Манагуа, чтобы принять участие в выборах. Атмосфера накалена и напряжена, поскольку претенденты на пост вице-председателя с нетерпением ждут голосов своих сторонников.\n\nПервый кандидат, Хуан Альберто Энрикес Опорта, - восходящая звезда партии, известный своей ярой поддержкой маоистской политики. Он утверждает, что партия нуждается в свежем взгляде, и что именно он является кандидатом, который может привнести новую энергию и страсть в роль заместителя председателя. Он популярен среди прокитайски настроенных членов партии. \n\nВторой кандидат, Альваро Рамирес Гонсалес, - бывший партизан, воевавший против Сомосы, а затем сделавший карьеру в государственном управлении. Несмотря на своё происхождение, он воспринимается как нейтральный бюрократ, который не привержен ни одной фракции в партии. Он представляет себя как компромиссного кандидата, которого может поддержать большинство членов Полибюро.\n\nПоследний кандидат, Эли Альтамирано Перес, - профсоюзный лидер с длинной историей активизма, трижды сидевший в тюрьме во время волны репрессий, последовавших за убийством Анастасио Сомосы в 1956 году. Он позиционирует себя как защитник рабочего класса, подчёркивая свой опыт профсоюзного деятеля и долгую историю борьбы за права трудящихся. Однако его радикальная политика вызывает разногласия в партии. Он опирается на поддержку более молодых членов Политбюро.\n\nПосле голосования члены партии с нетерпением ждут результатов. Комиссии по подсчету голосов требуется пять дней."
 nicc.16.d: "Напряженность в партии нарастает по мере того, как её руководство занимает всё более жёсткую позицию по таким вопросам, как внешняя политика и революционная стратегия. Один из основателей партии и уважаемый интеллектуал Карлос Фонсека Амадор стал ярым критиком. Фонсека Амадор долгое время выступал за более умеренный, прагматичный подход к социализму и не согласен с растущим радикализмом партии. Он считает, что партия слишком далеко отошла от своих корней и должна сосредоточиться на традиционном коммунизме.\nНесмотря на его авторитет в партии, инакомыслие Фонсеки Амадора рассматривается руководством партии как угроза. Они опасаются, что его критика может подорвать единство партии и привести к расколу в ней. Летом [GetYear] руководство партии начало серию чисток, чтобы искоренить инакомыслие в партии. Под прицел попал Фонсека Амадор, которого обвинили в нелояльности и работе против интересов партии. Несмотря на его протесты и попытки защитить себя, Фонсека Амадор был в итоге исключен из партии. Это решение стало для него горьким ударом, и он почувствовал себя преданным своими бывшими товарищами.\n\nВ течение нескольких недель после своего исключения Фонсека Амадор продолжал выступать против политики партии. Однако его открытость была недолгой. Через несколько недель после изгнания, ранним дождливым утром, он был убит неизвестным возле своего дома. Подробности его смерти были неясны, но широко распространено мнение, что он стал мишенью для руководства партии или его союзников в Службе разведки."
 nicc.17.d: "ОТ: Министр иностранных дел\n\nДорогой вице-председатель,\nЯ пишу вам с тяжелым сердцем, чтобы сообщить трагические новости, которые только что пришли к нам из Сьюдад-де-Ленин. Наш любимый лидер и генеральный секретарь Сильвио Майорга был хладнокровно убит. Как вы, возможно, уже знаете, он проводил совещание высокого уровня со своими советниками, когда в комнату вошел вооруженный человек и произвел пять выстрелов в него. Хотя сотрудникам службы безопасности удалось нейтрализовать нападавшего, было слишком поздно, чтобы спасти нашего лидера, который скончался от полученных ранений в течение нескольких минут. Насколько нам известно, нападавший был бывшим генералом, работавшим с семьей Сомосы.\n\nСильвио Майорга был для нас не только лидером, но и наставником, провидцем и настоящим защитником народа. Его безвременная смерть создала не только пустоту в наших сердцах, но и вакуум лидерства в стране. Вот здесь-то вы и нужны, заместитель председателя. Настоящим вы назначаетесь генеральным секретарем нашей великой нации.\n\nВаша первая задача - как можно скорее явиться в политбюро, резиденцию власти. Там министры и другие высокопоставленные чиновники расскажут вам о текущем положении дел и мерах, которые необходимо принять после смерти Сильвио Майорги. Вы также должны будете обратиться к народу и заверить его в том, что правительство находится в надежных руках. Пусть вы будете руководствоваться принципами нашего великого лидера Сильвио Майорги и поведете страну к миру, процветанию и прогрессу."
 nicc.18.d: "Неожиданным шагом стало объявление правительства Никарагуа о том, что оно очищает правящую партию от гуэваристского крыла и принимает антигуэваристскую идеологию. Это решение, принятое после выдвижения Хуана Альберто, рассматривается как значительный отход от давних социалистических убеждений страны.\nПравительство утверждает, что чистка необходима для избавления страны от контрреволюционных элементов и обеспечения дальнейшего успеха социалистического эксперимента. Этот шаг вызвал беспокойство у многих никарагуанцев, которые давно поддерживают движение геваристов.\n\nКритики правительства обвиняют его в предательстве идеалов революции и предупреждают, что принятие антигеваристской идеологии приведет к созданию более репрессивного правительства. Однако правительство остается непоколебимым в своей приверженности новой идеологии и обещает быть бдительным в отношении любых попыток подорвать революцию.\nЕщё неясно, что это означает для будущего Никарагуа и всего региона, но ясно, что страна вступила в новую эру, в которой геваризм больше не является доминирующей идеологией."
 nicc.19.d: "Наше правительство недавно объявило о введении добровольных уроков албанского языка и культуры в национальную учебную программу, что является данью уважения к наследию Энвера Ходжи и его социалистическим достижениям в Албании. Занятия начнутся в следующем учебном году и будут открыты для всех студентов, желающих узнать больше о культуре и истории Албании.\n\n Мы должны рассматривать это как способ укрепить связи между Никарагуа и Албанией и вдохновить студентов на поиск новых путей обучения. Как страна, приверженная социалистическим идеалам, мы считаем, что эти занятия дадут студентам уникальную возможность глубже понять окружающий мир и лучше понять социалистические принципы.\nБолее того, введение занятий по албанскому языку и культуре не только расширит кругозор студентов, но и даст им ценные навыки, которые пригодятся им в их будущей карьере. Способность говорить на нескольких языках и понимать различные культуры становится все более важной в нашем глобализированном мире, и мы гордимся тем, что предлагаем нашим студентам такую возможность.\nВ заключение мы призываем всех студентов воспользоваться этой захватывающей новой возможностью и приобщиться к богатой культуре и истории Албании."
 nicc.20.d: "Центральный комитет Коммунистической партии Никарагуа собрался на экстренное заседание. Инициаторами собрания стали основатель и идеолог партии Карлос Фонсека и его сторонники. Они предприняли яростную атаку на нынешнего генерального секретаря Томаса Борхе, обвинив его в предательстве революции, установлении диктатуры и служении интересам Москвы. Фонсека утверждает, что Борхе потерял связь с массами и что он должен уйти в отставку ради интересов партии и страны. Однако Борге не желает отдавать свою власть без боя. У него есть свои сторонники в партии, а также поддержка Советского Союза и Кубы. Он осуждает Фонсеку как предателя, ревизиониста и агента ЦРУ. Встреча быстро превращается в жаркую дискуссию, обе стороны осыпают друг друга оскорблениями и угрозами. Судьба партии и революции висит на волоске."
 nicc.21.t: "Касимиро Сотело посетил побережье Мискито" 
 nicc.21.d: "Касимиро Сотело, выдающийся лидер фракции гуэваристов ФРГ, был убит неизвестными в Пуэрто-Кабесас, столице побережья Мискито. Сотело посещал регион, чтобы обратить внимание на растущие беспорядки и недовольство среди коренного населения, которое считает себя маргинализированным и угнетаемым центральным правительством. Он также планировал встретиться с местными лидерами и активистами, чтобы обсудить пути улучшения социальных и экономических условий жизни мискито, а также укрепления их культурной и политической автономии.\n\nСмерть Сотело вызвала возмущение и скорбь среди его сторонников, которые видят в нем символ молодежного восстания против диктатуры Сомосы. Он был бывшим студенческим лидером, бросившим вызов тирану на публике и потребовавшим от него раскрыть местонахождение тела Сандино. Он также был членом Национального директората ФРГ и близким союзником Альваро Рамиреса Гонсалеса.\nУбийство Сандино вызвало подозрения и напряженность в ФРГ, поскольку некоторые обвиняют соперничающие группировки в том, что они стоят за убийством. Некоторые указывают на фракцию 'Затянувшаяся народная война', возглавляемую Томасом Борхе, который критиковал умеренный и примирительный подход Сотело к проблеме мискито. Другие подозревают участие иностранных агентов или местных коллаборационистов, которые стремятся подорвать революцию и посеять раздор в её рядах.\nЭто трагический удар по нашей революции и нашему единству. Как мы справимся с этой потерей?" 
 nicc.22.t: "Беспорядки на побережье Мискито" 
 nicc.22.d: "После убийства неизвестными Касимиро Сотело в регионе начался хаос и насилие. Протестующие требуют большей автономии и признания со стороны центрального правительства, а некоторые радикальные группы призывают к прямому отделению. Для подавления беспорядков и восстановления порядка в регион была направлена Милиция национальной обороны под командованием Томаса Борге. Однако их присутствие только ещё больше накалило обстановку, поскольку до нас дошли сообщения о столкновениях и жестокости. Как мы должны справиться с этим кризисом?" 
