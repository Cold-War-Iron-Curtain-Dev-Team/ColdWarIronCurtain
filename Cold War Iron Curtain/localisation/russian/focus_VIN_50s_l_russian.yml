 Indochina_War.2.d: "Битва на трассе Coloniale 4 закончилась полным успехом Франции. осле отступления группы Баярдов 3 500 французских солдат после нападения на Донг Кхе группа полковника Шартона предприняла попытку встретиться с группировкой Баярдов после потери личного состава и тяжелой техники из засад во Вьетнаме. Объединенную группу оттеснили в ущелье Кок Ха, где они сражались яростно и оборонительно, пока французские десантники не смогли оказать помощь и дать отпор вьетнамцам."
 Indochina_War.3.d: "Битва на трассе Coloniale 4 оказалась полной неудачей для Франции. После отступления группы Баярдов 3 500 французских солдат от их штурма Донг Кхе, группа полковника Шартона попыталась и успешно встретилась с группой Баярдов после потери личного состава и тяжелой техники из-за засад Вьетминя. Объединенную группу оттеснили в ущелье Кок Ха, где они были перебиты до последнего человека."
 Indochina_War.5.d: "Осада французского аванпоста в Донг-кхе была прервана сегодня утром после вмешательства 1-го парашютно-десантного батальона Иностранного легиона. После двух дней жестоких минометных обстрелов и атак живой силы численностью до двух тысяч, парашютно-десантный батальон оказал необходимую помощь, прежде чем форпост пал. Дальнейшее подкрепление 5 000 легионеров и марокканцев означало полное отступление войск Вьетминя."
 Indochina_War.6.d: "Вьетминь выиграл серию смертельных сражений за французский форпост в Донг Кхе. После двух дней жестоких минометных обстрелов и нападений человеческих волн на две тысячи человек во Вьетнаме две компании, удерживавшие аванпост, были вынуждены отступить с тем небольшим, что у них осталось. Атака 1-го парашютного батальона иностранного легиона была аналогичным образом контратакована и отбита. Одна последняя атака произошла совсем недавно, когда 5 000 легионеров и марокканцев попытались захватить форпост, и только 4 800 вернулись."
 Indochina_War.8.d: "Французы решительно выиграли битву при Винь-Йене. Хотя французский Иностранный легион потерпел несколько небольших поражений, позволивших Вьетминю занять ряд холмов перед Винь-Яном, применение артиллерии, тяжелой воздушной поддержки и напалмовых бомб против Вьетминя позволило Иностранному легиону отступить, перегруппироваться и контратаковать, а французская воздушная поддержка в конечном итоге вынудила отступить партизанские силы."
 Indochina_War.9.d: "Вьетминь решительно выиграли битву при Винь-Йене. Хотя французы использовали все свои резервы, включая артиллерию, тяжелую поддержку с воздуха и напалмовые бомбы, Вьетминь смог уничтожить Иностранный легион на каждом холме, даже после короткого отступления. Недоукомплектованные войска были уничтожены до последнего человека, и Вьетминь еще раз доказал, что это будет долгая война."
 Indochina_War.11.d: "Ночные удары Вьетминя по аванпостам в Мао Хэ были успешно отбиты французским Иностранным Легионом. Северо-вьетнамские партизаны начали полномасштабное наступление на город через три дня после первого штурма, но остановились из-за давления французского флота. Еще одна атака на угольную шахту Мао Хэ была также отбита благодаря поддержке французской авиации. Была предпринята последняя попытка артиллерийского и пехотного штурма, который был отброшен кровавыми боями в ближнем бою и ударами французской артиллерии."
 Indochina_War.12.d: "Ночные удары Вьетминя по аванпостам в Мао Хэ успешно уничтожили французский Иностранный легион. Северо-вьетнамские партизаны начали полномасштабное наступление на город через три дня после первого штурма, но остановились из-за давления французского флота. Массированная отвлекающая атака на угольную шахту Мао Хэ была предпринята, чтобы отвлечь внимание от города, и, в то время как французский Иностранный легион был отвлечен, Вьетминь предпринял последнюю артиллерийскую и пехотную атаку, сломив оставшихся защитников и взяв город, прежде чем был организован надлежащий ответ."
 Indochina_War.14.d: "После долгого и затяжного сражения французский Дальневосточный корпус под командованием генерала Жана де Латтра де Тассиньи отбил натиск вьетнамцев.Один из немногих обычных сражений против Вьетминя, генерал Тассиньи еще раз продемонстрировал свою способность к стратегии, остроумие и хитрость, отбив ополчение Вьетминя. Потеряв в сражении своего единственного сына, генерал доволен своей победой и тихо оплакивает смерть сына на поле боя.\n\n Дельта реки Дэй является стратегически важным регионом для Франции, поскольку это один из немногих регионов с Католическим большинством, поэтому удивительно большое количество вьетнамцев в этом районе предпочитают французов. Эта победа принесла им счастье, зная, что вьетнамцы были отброшены назад. Никто не знает, каким будет следующий шаг Вьетминя, но многие подозревают, что он не будет в районе дельты реки Дэй."
 Indochina_War.15.d: "Вьетминь объявил о победе над французским Дальневосточным корпусом в ошеломляющем сражении. Генерал Зяп легко перехитрил французского генерала Жана де Латтра де Тассиньи, применив против своего французского коллеги нетрадиционную тактику. В результате внезапной ночной атаки была уничтожена целая полковая боевая группа и десантный батальон, включая генерала Тассиньи и его сына. Хотя некоторые подразделения смогли сплотиться, они были быстро отброшены назад.\n\n Похоже, что район дельты реки Дэй станет оплотом Вьетминя, даже если там будет католическое большинство. Что это означает для французских усилий во Вьетнаме, неизвестно, но известно, что Франция потеряла одного из своих самых лучших генералов."
 Indochina_War.17.d: "This morning the French government has triumphantly declared that the outpost at Dien Bien Phu has beaten back the attacking Viet Minh forces and are in a holding action against any more hostile insurgents. The French Far East Corps high command has stated, 'We have done what so many thought was not possible.'. With casualties in the tens of thousands, the Viet Minh has admitted, 'We  have lost this battle, and we show the enemy respect for their hard-fought win.'. They followed up that statement with another broadcast: 'The French imperialists shall regret ever coming to Vietnam! We shall fight them with a ferocity the likes of never seen before!'. Many observers say that the Viet Minh will most likely not follow through with their declaration."
 Indochina_War.18.d: "Этим утром французское правительство подтвердило потерю французского военного аванпоста в Дьен-Бьен-Фу два дня назад. Во вчерашнем пресс-релизе вьетнамцы утверждали, что они убили, ранили и захватили более 20 000, уничтожили 17 танков и более 100 самолетов. Высшее командование французского Дальневосточного экспедиционного корпуса опровергло эти сообщения, заявив, что это всего лишь 16 000 человек, 10 танков и 67 самолетов. Тем не менее, это все еще огромное поражение для Франции, и многие предполагают, что им, возможно, придется сесть за стол переговоров в Женеве."
 Indochina_War.20.d: "После череды оборонительных побед решение Франции возобновить наступление закончилось неудачей. После того, как столица Хуонг Хоа Бинь стала конечной целью наступления, французский Иностранный Легион начал действовать, взяв перевал Чо Бен в первой фазе плана битвы и атакуя Хоа Бинь по суше, воздуху и морю. В поисках слабого места генерал Зяп начал беспощадную контратаку на позиции иностранного легиона. Использование поддержки с воздуха, а также других более современных технологий и тактики обеспечило гибкую оборонительную линию на французских условиях, но только справедливо. На данный момент атаки Вьетминя уменьшились."
 Indochina_War.21.d: "После череды оборонительных побед решение Франции возобновить наступление закончилось неудачей. После того, как столица Хуонг Хоа Бинь стала конечной целью наступления, французский Иностранный Легион начал действовать, взяв перевал Чо Бен в первой фазе плана битвы и атакуя Хоа Бинь по суше, воздуху и морю. Однако Иностранный легион был в конечном счете плохо подготовлен к контратаке генерала Зяпа. Стратегия изоляции, саботажа и постоянных атак в конечном счете оказалась успешной, и французский Иностранный легион покинул город после нескольких месяцев осады."
