l_russian:
  
 YUG_ww_capitals: "Kumbor"
 YUG_ww_capitals_short: "Kumbor"
 YUG_ww_capitals_desc: "Броненосец береговой обороны типа "Кронпринц Эржерцог Рудольф"."
  
 YUG_battle_hull_light_0: "Крейсерский тип "Gazelle""
 YUG_battle_hull_light_0_short: "Крейсерский тип "Gazelle""
 YUG_battle_hull_light_0_desc: "Немецкий малый крейсер (Kleiner Kreuzer) "Ниоба". 22 декабря 1943 года он был поврежден двумя торпедами и оставлен экипажем, вскоре корпус был захвачен югославскими партизанами, но из-за невозможности спасения был оставлен, в 1947 году его начали разбирать на металл, в 1952 году он был окончательно разобран на металл югославской судоподъемной компанией "Бродоспас"."
  
 YUG_battle_hull_light_4: "Тип "Kotor""
 YUG_battle_hull_light_4_short: "Тип "Kotor""
 YUG_battle_hull_light_4_desc: "Большие патрульные корабли (Veliki patrolni brodovi) типа "Котор". Корабль вооружен четырьмя ракетами типа "корабль-корабль" Р-21 или Р-22 (код НАТО SS-N-2 Styx). Масса ракеты составляет 2607 кг, боеголовка весом 480 кг, с дальностью полета от 8 до 80 км, высота полета 25 или 50 метров, скорость 0,9 Маха. Они имеют инфракрасные системы самонаведения (Р-22) или активное радиолокационное наведение (Р-21)."
  
 YUG_screen_hull_heavy_0: "Тип "Tb 74T""
 YUG_screen_hull_heavy_0_short: "Тип "Tb 74T""
 YUG_screen_hull_heavy_0_desc: "Т1 был введен в строй югославским военно-морским флотом после войны как Голешница. Она была перевооружена двумя 40-мм (1,6 дюйма) пушками на одиночных установках и четырьмя 20-мм (0,79 дюйма) пушками, а ее торпедные аппараты были сняты. Она продолжала служить в Югославии под этим именем до октября 1959 года. Т5 также был введен в строй югославским военно-морским флотом после войны и переименован в Cer. Она была оснащена двумя 40-мм (1,6 дюйма) пушками на одиночных установках и одной 20-мм (0,79 дюйма) пушкой, а ее торпедные аппараты также были сняты. Она служила до 1962 года, когда была распущена."
 YUG_screen_hull_heavy_1: "Split"
 YUG_screen_hull_heavy_1_short: "Split"
 YUG_screen_hull_heavy_1_desc: "Основное вооружение "Сплита" состояло из четырех 38-калибровых 5-дюймовых (13 см) пушек в одиночных установках, по одной надводной паре в носовой и кормовой частях надстройки. Ее зенитное вооружение состояло из четырех двухствольных и четырех одиночных установок для лицензионных 40-мм пушек Bofors AA. Корабль нес один пятиместный комплект 21-дюймовых торпедных аппаратов и сохранял свою мощность на 40 мин. Для противолодочного боя "Сплит" был оснащен двумя мортирами "Ежик", шестью метателями глубинных бомб и двумя стеллажами для глубинных бомб. Корабль был оснащен директором управления огнем Mk 37 для 5-дюймовых орудий и директором Mk 51 для зенитных орудий."
 YUG_screen_hull_heavy_2: "W class"
 YUG_screen_hull_heavy_2_short: "W class"
 YUG_screen_hull_heavy_2_desc: "Повторения предыдущих эсминцев U и V-класса, с измененными директорными структурами. Z класс был вооружен 4,5 дюймовой пушкойs."
 YUG_screen_hull_heavy_3: "Тип "Animoso""
 YUG_screen_hull_heavy_3_short: "Тип "Animoso""
 YUG_screen_hull_heavy_3_desc: "По сравнению с классом Spica, из которого он был разработан, класс Ariete потерял одну из трех 100-мм (4 дюйма)/47-мм пушек двойного назначения, в то время как торпедное вооружение выросло с четырех до шести 450-мм (18 дюймов) торпедных аппаратов в двух тройных установках на центральной линии корабля. Зенитная установка включала десять 20 - мм пушек.."
 YUG_screen_hull_heavy_4: "Проект 1159"
 YUG_screen_hull_heavy_4_short: "Проект 1159"
 YUG_screen_hull_heavy_4_desc: "Вооружение состояло из двух спаренных 76-мм пушек АК726 и двух спаренных 30-мм пушек АА, на некоторых кораблях были установлены 4 противокорабельные ракетные установки SSN-2, на корме установлены глубинные бомбы и минные стойки."
  
 YUG_screen_hull_medium_0: "Тип "Tb 82F"
 YUG_screen_hull_medium_0_short: "Тип "Tb 82F"
 YUG_screen_hull_medium_0_desc: "Торпедные катера (Torpiljarke) Тип "Tb 82F", в 1945 году переданные югославскому военно-морскому флоту и введенные в качестве сторожевого корабля (Patrolni brod) T 5 (с 18 мая 1949 года PBR 92 "Cer" (PBR 92 "Cer") бортовой № 92), исключенные в 1962 году, переданы в 1963 году для разборки на металл."
 YUG_screen_hull_medium_1: "Тип "Дубровник""
 YUG_screen_hull_medium_1_short: "Тип "Дубровник""
 YUG_screen_hull_medium_1_desc: "Югославский эсминец "Дубровник"."
 YUG_screen_hull_medium_2: "Тип "Beograd""
 YUG_screen_hull_medium_2_short: "Тип "Beograd""
 YUG_screen_hull_medium_2_desc: "Разрушители "Београд""
 YUG_screen_hull_medium_3: "Тип "Ariete""
 YUG_screen_hull_medium_3_short: "Тип "Ariete""
 YUG_screen_hull_medium_3_desc: "Эскортные эсминцы (Razaraći eskortni) Тип "Ариете"."
 YUG_screen_hull_medium_4: "Триглав"
 YUG_screen_hull_medium_4_short: "Триглав"
 YUG_screen_hull_medium_4_desc: "Триглав-патрульный катер класса "Светляк""
  
  
  
  # Submarine Hulls # 
  
 YUG_sub_hull_ww: "Грабри-класс"
 YUG_sub_hull_ww_short: "Грабри-класс"
 YUG_sub_hull_ww_desc: "Для надводного хода лодки класса "Грабри" приводились в действие двумя дизельными двигателями мощностью 2400 тормозных лошадиных сил (1800 кВт), приводившими в движение два гребных вала. При погружении гребные винты приводились в движение двумя электродвигателями мощностью 1600 лошадиных сил (1200 кВт). Они могли развивать максимальную скорость 15,7 узла (29,1 км/ч; 18,1 миль / ч) на поверхности и 10 узлов (19 км/ч; 12 миль / ч) на своих электромоторах при погружении. Были вооружены шестью носовыми 533-мм (21 дюйм) торпедными аппаратами и несли двенадцать торпед."
  
  
 YUG_sub_hull_small_single_3: "Una-класс"
 YUG_sub_hull_small_single_3_short: "Una-класс"
 YUG_sub_hull_small_single_3_desc: "Подводная лодка класса Una (также известная как Тип 911) была классом из шести карликовых подводных лодок, построенных для югославского военно-морского флота в Бродоградилиште specijalnih objekata в 1980-х годах. Они были разработаны с целью установки небольших минных полей и транспортировки военно-морских сил специального назначения, с их подводными аппаратами или без них, на мелководье, недоступном для больших подводных лодок. Из-за их профиля миссии, который требовал небольшой конструкции, а также необходимости оставаться незамеченными, им не хватало торпедного вооружения и генератора для подзарядки батарей."
  
  
 YUG_sub_hull_large_single_0: "Тип "Flutto""
 YUG_sub_hull_large_single_0_short: "Тип "Flutto""
 YUG_sub_hull_large_single_0_desc: "Введен в состав югославского военно-морского флота 10 сентября 1953 года, модернизирован, исключен в 1968 году."
  
 YUG_sub_hull_large_single_1: "Проект "B-81/1""
 YUG_sub_hull_large_single_1_short: "Проект "B-81/1""
 YUG_sub_hull_large_single_1_desc: "Класс Sutjeska-это класс из двух дизель-электрических подводных лодок, построенных для югославского военно-морского флота в конце 1950-х и начале 1960-х годов. Построен на верфи "Ульяник" в Пуле."
  
 YUG_sub_hull_large_single_2: "Проект "B-81/2""
 YUG_sub_hull_large_single_2_short: "Проект "B-81/2""
 YUG_sub_hull_large_single_2_desc: "Класс Sutjeska-это класс из двух дизель-электрических подводных лодок, построенных для югославского военно-морского флота в конце 1950-х и начале 1960-х годов. Построен на верфи "Ульяник" в Пуле."
  
 YUG_sub_hull_large_single_3: "Heroj-класс"
 YUG_sub_hull_large_single_3_short: "Heroj-класс"
 YUG_sub_hull_large_single_3_desc: "Класс Heroj был классом дизель-электрических ударных подводных лодок, построенных для югославского флота в 1960-х годах. Вооружение этого класса состояло из четырех 533-мм (1 фут 9,0 дюйма) торпедных аппаратов, используемых для запуска до шести активных/пассивных самонаводящихся торпед SET-65E или развертывания вместо них до двенадцати морских мин. Набор датчиков лодки включал в себя приемник радиолокационного предупреждения "Стоп-сигнал", надводный поисковый радар "Snoop Group" и гидролокатор Thomson Sintra Eledone, установленный на корпусе."
  
 YUG_sub_hull_large_single_4: "Sava-класс"
 YUG_sub_hull_large_single_4_short: "Sava-класс"
 YUG_sub_hull_large_single_4_desc: "Класс Sava был классом дизель-электрических ударных подводных лодок, построенных для югославского военно-морского флота в конце 1970-х и начале 1980-х годов. Вооружение состояло из шести 533-мм (21,0 дюйма) торпедных аппаратов, направленных вперед, используемых для запуска дополнения до десяти торпед TEST-71ME с максимальной дальностью действия 10,8 нми (20 км; 12 миль) или до двадцати морских мин, если они использовались для минных операций. Датчики включают в себя радиолокационную систему предупреждения "Стоп-сигнал" и радиолокатор наземного поиска "Снуп Групп". Источники несколько противоречивы относительно установленного гидроакустического оборудования."
  
  
 YUG_sub_hull_large_double_0: "Тип "Smeli""
 YUG_sub_hull_large_double_0_short: "Тип "Smeli""
 YUG_sub_hull_large_double_0_desc: "Югославская дизель-электрическая подводная лодка."
  
  
