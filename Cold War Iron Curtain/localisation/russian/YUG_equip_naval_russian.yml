l_english:
 YUG_ww_capitals: "Броненосец береговой обороны \"Кумбор\""
 YUG_ww_capitals_short: "\"Кумбор\""
 YUG_ww_capitals_desc: "«Кронпринц Эрцгерцог Рудольф» был уникальным броненосным военным кораблём, построенным для военно-морских сил Австро-Венгрии в 1880-х годах, последним судном этого типа во флоте. Он был вооружен главной батареей из трёх 30,5-сантиметровых (12 дюймов) пушек и имел составную стальную обшивку той же толщины на своем бронепоясе. После войны корабль был передан военно-морским силам Королевства сербов, хорватов и словенцев, переименован в \"Кумбор\" и классифицирован как корабль береговой обороны. Таким он оставался в их составе всего год, будучи проданным на слом в 1922 году."
 YUG_battle_hull_light_0: "Бронепалубный крейсер типа «Газелле»"
 YUG_battle_hull_light_0_short: "Тип \"Газелле\""
 YUG_battle_hull_light_0_desc: "Немецкий бронепалубный крейсер \"Ниобе\". 22 декабря 1943 года он был поврежден двумя торпедами и оставлен экипажем, вскоре был захвачен югославскими партизанами, но из-за невозможности спасения был оставлен. Останки крейсера были в 1947—1952 годах разобраны на металл югославской фирмой «Бродоспас»."
 YUG_battle_hull_light_4: "Фрегат типа \"Котор\""
 YUG_battle_hull_light_4_short: "Тип \"Котор\""
 YUG_battle_hull_light_4_desc: "Патрульный фрегат типа \"Котор\" может быть вооружен четырьмя противокорабельными ракетами П-21 либо П-22 (экспортный вариант П-15М; код НАТО SS-N-2 Styx). Масса ракеты составляет 2607 кг, боеголовка весом 480 кг, с дальностью полета от 8 до 80 км, высота полета 25 и 50 метров, скорость - 0,9 Маха. Имеют инфракрасную систему (П-22) или активное радиолокационное наведение (П-21)."
 YUG_screen_hull_heavy_0: "Миноносец типа \"Tb 74T\""
 YUG_screen_hull_heavy_0_short: "Тип \"Tb 74T\""
 YUG_screen_hull_heavy_0_desc: "Миноносец \"Т-1\" был введен в строй югославского военно-морского флота после войны как \"Голешница\". Он был перевооружен двумя 40-мм (1,6 дюйма) пушками на одиночных установках и четырьмя 20-мм (0,79 дюйма) пушками, а его торпедные аппараты были сняты. Он продолжал служить в Югославии под этим именем до октября 1959 года."
 YUG_screen_hull_heavy_1: "Эсминец типа \"Сплит\""
 YUG_screen_hull_heavy_1_short: "Тип \"Сплит\""
 YUG_screen_hull_heavy_1_desc: "Основное вооружение \"Сплита\" состояло из четырех 38-калиберных 5-дюймовых (13 см) пушек в одиночных установках, по одной паре в носовой и кормовой частях надстройки. Ее зенитное вооружение состояло из четырех двухствольных и четырех одноствольных установок для лицензионных 40-мм пушек Bofors AA. Корабль нес один пятиместный комплект 21-дюймовых торпедных аппаратов и мог хранить до 40 мин. Для противолодочного боя \"Сплит\" был оснащен двумя мортирами \"Хеджхог\", шестью метателями и двумя стеллажами для глубинных бомб. Корабль был оснащен системой управления огнём Mk 37 для 5-дюймовых орудий и Mk 51 для зенитных орудий."
 YUG_screen_hull_heavy_2: "Эсминец типа \"W\""
 YUG_screen_hull_heavy_2_short: "Тип \"W\""
 YUG_screen_hull_heavy_2_desc: "Копия предыдущих эсминцев типа \"U\" и \"V\", с модифицированными системами управления огнём."
 YUG_screen_hull_heavy_3: "Миноносец типа \"Чиклоне\""
 YUG_screen_hull_heavy_3_short: "Тип \"Чиклоне\""
 YUG_screen_hull_heavy_3_desc: "Тип \"Чиклоне\" представлял собой группу эскортных миноносцев, построенных для итальянского флота, воевавших во Второй мировой войне. Они были модифицированными, немного более тяжелыми версиями предыдущего типа \"Орса\", с улучшенной устойчивостью и более тяжелым противолодочным вооружением. Эти корабли были построены в рамках итальянской военной мобилизационной программы в 1942–43 годах. Все 16 единиц были оснащены гидролокатором, его торпедные аппараты присутствовали в том же количестве и месте у всех кораблей типа."
 YUG_screen_hull_heavy_4: "Сторожевой корабль проекта 1159 типа \"Дельфин\""
 YUG_screen_hull_heavy_4_short: "Проект 1159"
 YUG_screen_hull_heavy_4_desc: "Вооружение состояло из двух спаренных 76-мм (3,0 дюйма) артустановок АК-726 и двух спаренных 30-мм (1,2 дюйма) зенитных пулемётов АК-230. На некоторых кораблях были установлены 4 пусковые установки противокорабельных ракет П-15М «Термит», на корме - стеллажи для глубинных бомб и морских мин."
 YUG_screen_hull_medium_0: "Миноносец типа \"Tb 82F\""
 YUG_screen_hull_medium_0_short: "Тип \"Tb 82F\""
 YUG_screen_hull_medium_0_desc: "4 корабля данного типа изначально принадлежали югославскому военно-морскому флоту, \"Т-5\", \"Т-6\", \"Т-7\" и \"Т-8\".  После Второй мировой войны остался только один, которому удалось спастись от затопления у берегов Мальты. Миноносец \"Т-5\" был вновь введен в строй югославского военно-морского флота и переименован в \"Цер\". Он был оснащен двумя 40-мм (1,6 дюйма) пушками на одиночных установках и одной 20-мм (0,79 дюйма) пушкой, однако его торпедные аппараты были сняты. Он служил до 1962 года, когда был списан в на металл."
 YUG_screen_hull_medium_1: "Эсминец типа \"Дубровник\""
 YUG_screen_hull_medium_1_short: "Тип \"Дубровник\""
 YUG_screen_hull_medium_1_desc: "\"Дубровник\" был единственным представителем своего класса. Он был построен для Королевского югославского флота компанией Yarrow Shipbuilders в Глазго в 1930-1931 годах. Его первоначальный проект был основан на увеличенной версии британского типа \"Шекспир\" с пятью морскими орудиями Skoda 14/56 см. Он также был оснащен двумя тройными 533-мм (21 дюйм) торпедными аппаратами в его центральной части. Для противовоздушной обороны были спаренные орудия Škoda 83,5 мм (3,29 дюйма) L/35, расположенные в центральной части между двумя установками торпедных аппаратов, и шесть полуавтоматических зенитных орудий Škoda 40 мм (1,6 дюйма) L/67, размещенных в двух спаренных установках и двух одиночных установках. Был оснащен двумя метателями и двумя направляющими для глубинных бомб, которых мог нести 10 штук. На борту также находились два 15-мм (0,59 дюймов) пулемета и 40 мин."
 YUG_screen_hull_medium_2: "Эсминец типа \"Белград\""
 YUG_screen_hull_medium_2_short: "Тип \"Белград\""
 YUG_screen_hull_medium_2_desc: "Серия эсминцев типа \"Белград\" состояла из трех кораблей, построенных для югославского королевского флота в конце 1930-х годов. Является вариантом французского типа кораблей \"Бурраск\". Основное вооружение состояло из четырех орудий Škoda 120 мм (4,7 дюйма) L/46 в одиночных установках, две в передней части надстройки и две в корме, защищенных орудийными щитами. Вспомогательное вооружение состояло из четырех зенитных орудий Škoda 40 мм (1,6 дюйма) L/67 в двух сдвоенных установках, расположенных по обе стороны от кормовой палубы-убежища. Корабли также были оснащены двумя тройными установками 550-мм (22 дюйма) торпедных аппаратов и двумя пулеметами. Их системы управления огнем были предоставлены голландской фирмой Hazemayer. В готовом виде они также могли нести 30 морских мин."
 YUG_screen_hull_medium_3: "Эскадренный миноносец типа \"Ариете\"."
 YUG_screen_hull_medium_3_short: "Тип \"Ариете\""
 YUG_screen_hull_medium_3_desc: "Тип \"Ариете\" - серия эскадренных миноносцев, построенных изначально для военно-морских сил Италии во время Второй мировой войны. Они были увеличенными версиями торпедных катеров типа Спика и были разработаны для сопровождения конвоев в Северную Африку. По сравнению с ним, на основе которого и был разработан, тип \"Ариете\" лишился одного из трех универсальных орудий калибра 100 мм (4 дюйма), тогда как торпедное вооружение выросло с четырех до шести 450-мм (18 дюймов) торпедных аппаратов в двух тройных установках по центральной линии корабля. Зенитный комплекс включал десять 20-мм пушек."
 YUG_screen_hull_medium_4: "Сторожевой катер \"Триглав\""
 YUG_screen_hull_medium_4_short: "\"Триглав\""
 YUG_screen_hull_medium_4_desc: "\"Триглав\" - сторожевой катер проекта 10412 \"Светляк\". Катера подобного проекта предназначены для охраны прибрежной зоны, отражения нападений с воздуха и моря противников, проведения поисково-спасательных операций и обучения личного состава военно-морских сил."
 YUG_sub_hull_ww: "Подводная лодка типа \"Храбри\""
 YUG_sub_hull_ww_short: "Тип \"Храбри\""
 YUG_sub_hull_ww_desc: "Для надводного хода лодки типа \"Храбри\" приводились в движение двумя дизельными двигателями с тормозной мощностью 2400 лошадиных сил (1800 кВт), приводившими в движение два гребных винта. При погружении гребные винты вращались за счёт двух электродвигателей мощностью 1600 лошадиных сил (1200 кВт). Они могли развивать максимальную скорость 15,7 узла (29,1 км/ч; 18,1 миль/ч) на поверхности и 10 узлов (19 км/ч; 12 миль/ч) на своих электромоторах при погружении. Были вооружены шестью носовыми 533-мм (21 дюйм) торпедными аппаратами и несли двенадцать торпед."
 YUG_sub_hull_small_single_3: "Подводная лодка типа \"Уна\""
 YUG_sub_hull_small_single_3_short: "Тип \"Уна\""
 YUG_sub_hull_small_single_3_desc: "Подводная лодка типа \"Уна\" (также известная как Тип 911) была серией из шести карликовых подводных лодок, построенных для югославского военно-морского флота на верфи \"Бродосплит\" в 1980-х годах. Они были разработаны с целью установки небольших минных полей и транспортировки военно-морских сил специального назначения, с их подводными аппаратами или без них, на мелководье, недоступном для больших подводных лодок. Из-за их профиля миссии, который требовал небольшой конструкции, а также необходимости оставаться незамеченными, им не хватало торпедного вооружения и генератора для подзарядки батарей."
 YUG_sub_hull_large_single_0: "Подводная лодка типа \"Флутто\""
 YUG_sub_hull_large_single_0_short: "Тип \"Флутто\""
 YUG_sub_hull_large_single_0_desc: ""
 YUG_sub_hull_large_single_1: "Подводная лодка проекта В-81/1"
 YUG_sub_hull_large_single_1_short: "Проект B-81/1"
 YUG_sub_hull_large_single_1_desc: "Тип \"Сутьеска\" - это серия из двух дизель-электрических подводных лодок, построенных для югославского военно-морского флота в конце 1950-х и начале 1960-х годов. Оба судна были спущены на воду на верфи \"Ульяник\" в Пуле."
 YUG_sub_hull_large_single_2: "Подводная лодка проекта В-81/2"
 YUG_sub_hull_large_single_2_short: "Проект B-81/2"
 YUG_sub_hull_large_single_2_desc: "Тип \"Сутьеска\" - это серия из двух дизель-электрических подводных лодок, построенных для югославского военно-морского флота в конце 1950-х и начале 1960-х годов. Оба судна были спущены на воду на верфи \"Ульяник\" в Пуле."
 YUG_sub_hull_large_single_3: "Подводная лодка типа \"Херой\""
 YUG_sub_hull_large_single_3_short: "Тип \"Херой\""
 YUG_sub_hull_large_single_3_desc: "Тип \"Херой\"  был серией дизель-электрических подводных лодок, построенных для югославского флота в 1960-х годах. Вооружение этого класса состояло из четырех 533-мм (1 футовых 9 дюймовых) торпедных аппаратов, используемых для запуска до шести активных/пассивных самонаводящихся торпед СЭТ-65Э или развертывания вместо них до двенадцати морских мин. Набор датчиков лодки включал в себя систему предупреждения об облучении РЛС, поисковый радар и гидролокатор Thomson Sintra Eledone, установленный на корпусе."
 YUG_sub_hull_large_single_4: "Подводная лодка типа \"Сава\""
 YUG_sub_hull_large_single_4_short: "Тип \"Сава\""
 YUG_sub_hull_large_single_4_desc: "Тип \"Сава\" был серией дизель-электрических ударных подводных лодок, построенных для югославского военно-морского флота в конце 1970-х и начале 1980-х годов. Вооружение состояло из шести 533-мм (21,0 дюймовых) торпедных аппаратов, направленных вперед, используемых для запуска до десяти торпед ТЭСТ-71МЭ с максимальной дальностью действия 10,8 морских миль (20 км; 12 миль) или до двадцати морских мин, когда производилась их постановка. Датчики включают в себя радиолокационную систему предупреждения об излучении РЛС и радиолокатор наземного поиска. Информация относительно установленного гидроакустического оборудования спорна."
 YUG_sub_hull_large_double_0: "Подводная лодка типа \"Смели\""
 YUG_sub_hull_large_double_0_short: "Тип \"Смели\""
 YUG_sub_hull_large_double_0_desc: ""