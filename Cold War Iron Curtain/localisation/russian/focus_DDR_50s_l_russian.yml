 DDR_Veterans_from_the_National_Revolutionary_War_of_the_Spanish_People: "Повысить ветеранов гражданской войны в Испании"
 DDR_Veterans_from_the_National_Revolutionary_War_of_the_Spanish_People_desc: "Многие члены КПГ воевали в интернациональных отрядах во время гражданской войны в Испании. Мы должны предложить им должности в армии."
