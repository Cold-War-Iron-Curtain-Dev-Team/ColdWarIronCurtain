 DDR_prepare_for_the_five_year_plan: "Подготовка к пятилетнему плану"
 DDR_prepare_for_the_five_year_plan_desc: "Для следующей пятилетки партия наметила несколько ключевых показателей, направленных на индустриализацию неразвитых регионов Восточной Германии. Если мы достигнем этих показателей, то будем готовиться к следующей пятилетке задолго до её начала. Это обеспечит наш успех в будущем."
 DDR_first_five_year_plan: "Первая пятилетка"
 DDR_first_five_year_plan_desc: "Первый пятилетний план установил механизм централизованного государственного планирования; план утвердил высокие нормы производства в тяжёлой промышленности и увеличил производительность труда."
 DDR_civilian_industry: "Гражданская промышленность"
 DDR_civilian_industry_desc: "В данный момент мы должны сконцентрироваться на гражданской отрасли экономики вместо военной."
 DDR_military_industry: "Военная промышленность"
 DDR_military_industry_desc: "В данный момент мы должны сконцентрироваться на военной отрасли экономики вместо гражданской."
 DDR_coastal_industry: "Прибрежные предприятия"
 DDR_coastal_industry_desc: "В то время как процессы национализации и общей индустрализации начались в центальных регионах нашей страны, прибрежные регионы на севере остаются аграрными. Настало время увеличить производство в прибрежных районах и создать там больше рабочих мест."
 DDR_southern_industry: "Промышленность на юге страны"
 DDR_southern_industry_desc: "В рамках плана, созданного Народными предприятиями и Народной палатой ГДР, мы должны провести индустриализацию и нацонализацию в южных регионах страны. Если мы этого не сделаем, регионы быстро начнут отставать от остальной части страны в промышленном потенциале..."
 DDR_central_industry: "Промышленность в центральных регионах"
 DDR_central_industry_desc: "В рамках плана, созданного Народными предприятиями и Народной палатой ГДР, мы должны провести индустриализацию и нацонализацию в центральных регионах страны. Если мы этого не сделаем, регионы быстро начнут отставать от остальной части страны в промышленном потенциале.."
 DDR_the_new_course: "Neuer Kurs"
 DDR_the_new_course_desc: "Новый курс был советской экономической политикой, которая была направлена на повышение уровня жизни, увеличение доступности потребительских товаров В ГДР, понижение цен на продукты питания и возвращение малого бизнеса и ферм в ведение частных лиц."
 DDR_modernisation: "Modernisierung"
 DDR_modernisation_desc: "Ранее пленум СДПГ доказал превосходство нашей страны и представил второй пятилетний план. Девизом плана была фраза 'модернизация, механизация и автоматизация,' которая должна была подчеркнуть технологический прогресс. Сейчас мы должны сконцентрироваться на модернизации."
 DDR_mechanisation: "Mechanisierung"
 DDR_mechanisation_desc: "Ранее пленум СДПГ доказал превосходство нашей страны и представил второй пятилетний план. Девизом плана была фраза 'модернизация, механизация и автоматизация,' которая должна была подчеркнуть технологический прогресс. Сейчас мы должны сконцентрироваться на механизации"
 DDR_automation: "Automatisierung"
 DDR_automation_desc: "Ранее пленум СДПГ доказал превосходство нашей страны и представил второй пятилетний план. Девизом плана была фраза 'модернизация, механизация и автоматизация,' которая должна была подчеркнуть технологический прогресс. Сейчас мы должны сконцентрироваться на автоматизации."
 DDR_promote_private_agriculture: "Продвигать частное сельское хозяйство"
 DDR_promote_private_agriculture_desc: "Вместо того, чтобы прикладывать наши усилия для проведения тотальной коллективизации в сельском хозяйстве, нам стоит вернуться к старой политике, которая может оказаться более выгодной. Если мы начнём способствовать приватизации и доведём это дело до конца, то сможем создать командную экономику с элементами свободного рынка."
 DDR_second_five_year_plan: "Вторая пятилетка"
 DDR_second_five_year_plan_desc: "Второй пятилетний план предполагает, что ГДР проведёт коллективизацию в сельском хозяйстве и национализирует промышленность."
 DDR_appease_the_people: "Успокоить народные массы"
 DDR_appease_the_people_desc: "На данный момент мы должны отойти от идей тотальной милитаризации. Сконцентрировавшись на других аспектах экономики и промышленности, мы сможем действительно помогать народу и станем одной из самых развитых и сильных стран в восточной Европе."
 DDR_continue_military_industrialisation: "Продолжить инвестирование в тяжёлую промышленность"
 DDR_continue_military_industrialisation_desc: ""
 DDR_develop_east_berlin: "Развивать восточный Берлин"
 DDR_develop_east_berlin_desc: "Берлин был полностью разрушен в годы второй мировой войны. Настало время продолжить его восстановление путём объединения всех наших усилий для развития восточного Берлина."
 DDR_regional_infrastructure: "Региональная инфраструктура"
 DDR_regional_infrastructure_desc: "Несмотря на то, что восточный Берлин является промышленным центром страны, инфраструктура в сельской местности Восточной Германии окажется более полезной во многих отношениях."
 DDR_investigate_industrial_corruption: "Расследовать коррупцию в промышленности"
 DDR_investigate_industrial_corruption_desc: "Ходят слухи, что промышленный сектор страдает от теневых сделок и коррупции внутри самой партии. Нам следует провести полное расследование и избавить Восточную Германию от коррупции раз и навсегда ."
 DDR_national_peoples_army: "Nationale Volksarmee"
 DDR_national_peoples_army_desc: "В течение многих лет нам запрещали иметь армию, но пришло время восстановить военный порядок. Удачно, что у нас есть Kasernierte Volkspolizei, которая может быть преобразована в регулярную армию."
 DDR_allow_liberals_in_government: "Разрешить либералам находиться в правительстве"
 DDR_allow_liberals_in_government_desc: "Очевидно, что социализм в ГДР и во всём мире однажды потерпит крах. Мы наблюдали ужасы, которые Иосиф Сталин творил со своим народом, так что настало время встать на защиту наших ценностей. Нам следует позволить либералам становиться членами правительства для того, чтобы распространять либеральные идеи о становлении демократического общества."
 DDR_weaken_the_propaganda_machine: "Ослабить пропагандистскую машину"
 DDR_weaken_the_propaganda_machine_desc: "Преданные социалисты Восточной Германии создали машину пропаганды, уничтожающую будущее наших детей. Мы должны ослабить пропаганду до того, как население превратится в безмозглых дронов."
 DDR_rewrite_the_curriculum: "Переделать учебный план"
 DDR_rewrite_the_curriculum_desc: "Существующая система образования убеждает детей Восточной Германии в том, что социализм - это путь вперёд, и продолжает промывать им мозги. Она должна быть реформирована."
 DDR_strengthen_the_national_democrats: "Усилить национал-демократов"
 DDR_strengthen_the_national_democrats_desc: "Национально-демократическая партия Германии была местом для умеренных нацистов, которые не перешли в социализм. Сейчас партия находится в коалиции с социалистами из СДПГ. Если мы усилим её власть в коалиции, это ослабит красных на некоторое время."
 DDR_decentralise_the_party: "Децентрализация партии"
 DDR_decentralise_the_party_desc: "Нам стоит издать приказы о постепенной децентрализации социалистической единой парти Германии и предоставить каждой отдельной партии больше полномочий. Таким образом мы будем готовы к многопартийной демократии в ближайшем будущем."
 DDR_berlin_roads: "Берлинские дороги"
 DDR_berlin_roads_desc: "Промышленный потенциал восточного Берлина активно растёт. Скорее всего, инфраструктурная программа должна быть реализована следующей."
 DDR_northern_expansion: "Северная экспансия"
 DDR_northern_expansion_desc: "Настало время предоставить северным регионам возможность промышленного развития."
 DDR_northern_airports: "Северные аэропорты"
 DDR_northern_airports_desc: "Настало время предоставить северным регионам воздушную инфраструктуру для военных и гражданских нужд."
 DDR_coastal_protection: "Береговая защита"
 DDR_coastal_protection_desc: "Мы живём в опасное время, так что мы должны быть готовы к обороне нашей страны. Высока вероятность того, что на первых этапах войны враг с лёгкостью захватит береговую линию, поэтому нам нужно построить систему береговой обороны на севере страны."
 DDR_the_german_question: "Германский вопрос"
 DDR_the_german_question_desc: "Германия остаётся разделённой, при этом одна часть населения живёт в утопии, о которой многие в мире могут только мечтать, а другая часть живёт в ужасной дистопии, управляемой капиталистами. Мы не можем это игнорировать. Нужно что-то сделать."
 DDR_unification_by_force: "Насильственное объединение"
 DDR_unification_by_force_desc: "Западногерманские капиталисты никогда не примут мирных предложений о воссоединении. Мы объявим войну для демонстрации превосходства социализма!"
 DDR_status_quo: "Статус-кво"
 DDR_status_quo_desc: "После долгих диспутов стало понятно, что Германия никогда не будет объединённой."
