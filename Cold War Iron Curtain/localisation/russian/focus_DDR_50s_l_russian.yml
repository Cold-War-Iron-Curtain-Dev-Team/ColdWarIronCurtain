l_english:
 DDR_trade_penalties_idea_1: "Штрафы за торговлю в Восточном блоке"
 DDR_trade_penalties_idea_2: "Штрафы за торговлю в Восточном блоке"
 DDR_trade_penalties_idea_3: "Штрафы за торговлю в Восточном блоке"
 Decrease_Industrial_Costs: "Снижение потребления промышленного топлива и электроэнергии"
 Increase_Industrial_Costs: "Повышение потребления промышленного топлива и электроэнергии"
 GDR_The_Two_Year_Plan: "Двухлетний план"
 GDR_The_Two_Year_Plan_desc: "Теперь, когда мы наконец-то избавились от нацистов, нам нужно приступить к реализации первого плана по восстановлению и развитию промышленности!"
 GDR_The_First_Five_Year_Plan: "Первая пятилетка"
 GDR_The_First_Five_Year_Plan_desc: "Завершив наш двухлетний план, мы теперь удвоим усилия и начнем наш самый первый пятилетний план, в котором мы решим либо расширить наши автаркические проекты, либо сместить фокус на диверсификацию экономики?"
 GDR_The_Second_Five_Year_Plan: "Вторая пятилетка"
 GDR_The_Second_Five_Year_Plan_desc: "Наша экономика продолжает расти. Мы все больше и больше догоняем этих назойливых западников, показывая им, что социализм может быть таким же хорошим, как и капитализм, смею сказать, даже лучше! Однако мы не можем остановиться. Нам нужно еще раз решить, на чем сосредоточиться в этой второй пятилетке. Будем ли мы быстро ускорять коллективизацию или проанализируем недавнюю советскую экономическую реформу и последуем ее примеру?"
 GDR_Begin_Restoring_Dismantled_Steel_Plants: "Восстановить демонтированные сталелитейные заводы"
 GDR_Begin_Restoring_Dismantled_Steel_Plants_desc: "Чтобы запустить нашу промышленность, нам нужно восстановить разрушенные сталелитейные заводы, чтобы увеличить производство стали, которая будет использоваться в повседневных вещах, необходимых нашим товарищам!"
 GDR_The_Return_of_Rolling_Mills: "Возвращение прокатных станков"
 GDR_The_Return_of_Rolling_Mills_desc: "Теперь, когда мы восстановили сталелитейные заводы, нам нужно открыть фабрики, где сталь будет перерабатываться для промышленных целей. С их помощью мы сможем делать самые лучшие железнодорожные пути и трубы во всей Европе!"
 GDR_Continue_Autarky_Projects: "Продолжить проекты автаркии"
 GDR_Continue_Autarky_Projects_desc: "Мы не можем полагаться на западный импорт. Мы будем продолжать наши усилия по созданию автаркии, чтобы стать самодостаточными!"
 GDR_Invest_in_Synthetic_Fiber: "Инвестиции в синтетическое волокно"
 GDR_Invest_in_Synthetic_Fiber_desc: "Построив больше электростанций на ископаемом топливе, мы также должны построить заводы, чтобы запустить нашу нефтехимическую промышленность. Благодаря этому мы сможем создавать каучук и сырьевые материалы."
 GDR_Expand_Steel_Production: "Расширение производства стали"
 GDR_Expand_Steel_Production_desc: "После восстановления сталелитейной промышленности в рамках нашего двухлетнего плана мы будем расширять эту область промышленности и увеличивать ее производство!"
 GDR_Accelerate_Economic_Collectivization: "Ускорение экономической коллективизации"
 GDR_Accelerate_Economic_Collectivization_desc: "Мы не нуждаемся в чужих отчетах о том, как нам следует развивать нашу промышленность. Мы будем следовать социалистической модели до мельчайших деталей и быстро ускорим коллективизацию промышленности"
 GDR_Kickstart_a_Microelectronics_Industry: "Начало индустрии микроэлектроники"
 GDR_Kickstart_a_Microelectronics_Industry_desc: "Микроэлектроника - довольно новая отрасль промышленности. Она сосредоточена на создании транзисторов, микросхем и резисторов, которые используются для питания в промышленных процессах. Это не только откроет новые пути в наших технологических исследованиях, но и предоставит больше рабочих мест для наших товарищей!"
 GDR_Offer_Partnerships_to_Private_Enterprise: "Предложить партнерство частным предприятиям"
 GDR_Offer_Partnerships_to_Private_Enterprise_desc: "Даже если это противоречит некоторым социалистическим принципам, мы будем предлагать частным предприятиям партнерские сделки. Не всем будет предложено такое партнерство. Мы установим строгие правила, чтобы убедиться, что частная промышленность сосредоточена на людях, а не на прибыли!"
 GDR_Establish_The_State_Planning_Commission: "Создать Госплан"
 GDR_Establish_The_State_Planning_Commission_desc: "Мы не можем просто продолжать создавать жилье и промышленность без всякого планирования. Именно поэтому мы создаем Государственную комиссию по планированию, которая будет следить за правильным размещением промышленности и жилья, чтобы создать более целенаправленную и эффективную промышленность."
 GDR_Continue_the_Bodenreform: "Продолжить Боденреформу"
 GDR_Continue_the_Bodenreform_desc: "После того как советские войска начали строить наше славное социалистическое государство, они начали так называемую боденреформу. В рамках этой политики сельскохозяйственные земли изымались у частников и передавались государству, чтобы стать отправной точкой для строительства коллективных хозяйств. Спустя годы мы должны продолжить эту политику."
 GDR_Storfreimachung: "Действия по разминированию"
 GDR_Storfreimachung_desc: "Aktion Storfreimachung был смелым экспериментом, проведенным нашим государством, чтобы показать, что мы не нуждаемся в ресурсах западных стран для своего функционирования! Он более чем достиг своих целей! Есть только одна небольшая проблема..."
 GDR_Economic_Diversification: "Экономическая диверсификация"
 GDR_Economic_Diversification_desc: "Даже если до сих пор наши усилия по автаркии приносили свои плоды, теперь решено, что мы должны перевести нашу экономику на диверсификацию, чтобы создать больше рабочих мест и более разнообразную структуру внутреннего производства."
 GDR_Rebuild_Light_Industry: "Восстановить легкую промышленность"
 GDR_Rebuild_Light_Industry_desc: "Мы не можем просто строить только тяжелую промышленность. Мы уже расширяли тяжелую промышленность, а теперь пришло время расширить и легкую. Зачем нужна пушка, если вы даже не можете приготовить себе тост утром?"
 GDR_Analyze_the_1953_Soviet_Advice: "Проанализировать советские экономические отчеты за 1953 год"
 GDR_Analyze_the_1953_Soviet_Advice_desc: "Мы получили от Советов экономический отчет о нашем развитии. В нем они рекомендуют нам прекратить коллективизацию, поскольку она только вредит нашему экономическому росту, и критикуют, что наша политика ускорения социализма через коллективизацию работает совсем не в нашу пользу. Может быть, нам стоит прислушаться..."
 GDR_Rollback_Agricultural_Collectivization: "Откат сельскохозяйственной коллективизации"
 GDR_Rollback_Agricultural_Collectivization_desc: "Следуя предложению Советов, мы откажемся от коллективизации и попробуем применить методы других стран Восточного блока."
 GDR_Increase_Eastern_Bloc_Trade: "Пересмотр торговых условий Восточного блока"
 GDR_Increase_Eastern_Bloc_Trade_desc: "Нынешние условия торговли с остальными странами Восточного блока слишком благоприятны для Советов и других стран. Мы не можем позволить этому продолжаться, если хотим помочь нашей промышленности развиваться. Мы встретимся с представителями разных стран и Советов и попытаемся договориться о более сбалансированных условиях!"
 GDR_Embrace_Modern_Steel_Making_Technology: "Воспользоваться современными технологиями производства стали"
 GDR_Embrace_Modern_Steel_Making_Technology_desc: "Мы живем в современную эпоху. Мы живем в 20-м веке. Мы не можем продолжать использовать старые устаревшие технологии производства стали. Мы выделим 200 миллиардов восточногерманских марок, чтобы перейти на новые технологии производства стали!"
 GDR_Retool_Machinery: "Переоборудование машинного оборудования"
 GDR_Retool_Machinery_desc: "Мы не можем иметь промышленность, не имея инструментов для ее работы. В первую очередь мы сосредоточимся на сборе старых, еще сохранившихся машин и будем использовать их до тех пор, пока не сможем начать производство новых станков."
 GDR_Invest_in_Machine_Tool_Production: "Инвестиции в производство станков"
 GDR_Invest_in_Machine_Tool_Production_desc: "Старые инструменты, как ни странно, уже не работают. Пора вкладывать деньги в создание новых с нуля."
 GDR_A_Heavy_Industry_Emphasis: "Акцент на тяжелую промышленность"
 GDR_A_Heavy_Industry_Emphasis_desc: "Запад наращивает горы своего вооружения, и кажется, что Третья мировая война неумолимо приближается к нашему порогу. Нам необходимо сделать упор на тяжёлую промышленность и производить как можно больше своих пушек. Таким образом, в случае полномасштабной войны мы сможем сдерживать Запад до прибытия наших советских товарищей!"
 GDR_Modernize_the_LPGs: "Улучшение сжиженного углеводородного газа"
 GDR_Modernize_the_LPGs_desc: "LPGs... или Landwirtschaftliche Produktionsgenossenschaft... Серьезно, это то название, которое мы выбрали? Ладно... Эти... кооперативы созданы для контроля над крупными государственными коллективными хозяйствами, которые похожи на советскую модель колхозов."
 GDR_Abandon_Coal_Based_Chemical_Production: "Отказ от химического производства на основе угля"
 GDR_Abandon_Coal_Based_Chemical_Production_desc: "Мы живем в XX веке. А мы все еще используем уголь для производства химикатов. Пора прекращать! Мы полностью откажемся от использования угля в химическом производстве и будем использовать другие материалы!"
 GDR_Accelerate_Railway_Reconstruction: "Ускорение реконструкции железной дороги"
 GDR_Accelerate_Railway_Reconstruction_desc: "Несмотря на то, что большинство железных и автомобильных дорог постепенно приводят в порядок, многие из них до сих пор лежат заброшенными и разрушенными. Этого нельзя допустить. Мы быстро ускорим ремонт железнодорожных путей по всей стране!"
 GDR_De_Emphasize_Heavy_Industry: "Прекращение акцентирования на тяжелой промышленности"
 GDR_De_Emphasize_Heavy_Industry_desc: "Кажется, ситуация немного стабилизировалась. Было решено отказаться от акцента на тяжелую промышленность и сосредоточиться на легкой."
 GDR_Stop_Shopfloor_Competiton_Policies: "Прекратить конкурентную политику в цехах"
 GDR_Stop_Shopfloor_Competiton_Policies_desc: "Мы слишком долго не замечали коррупции, которая происходила с фондами, выделенными на развитие промышленности, позволяя министрам прикарманивать средства для себя. Теперь этому пришел конец. Согласно этому закону, любой человек, обвиненный и уличенный в коррупции, будет отстранен от должности и заменен."
 GDR_The_Schwarze_Pumpe_Combine: "Комбинат Schwarze Pumpe"
 GDR_The_Schwarze_Pumpe_Combine_desc: "Комбинат «Шварце Пумпе» - это электростанция, работающая на буром угле, которая также используется в качестве одной из наших крупных промышленных площадок для переработки бурого угля."
 GDR_Lauchhammer_Coking_Plant: "Коксохимический завод Лауххаммера"
 GDR_Lauchhammer_Coking_Plant_desc: "Биобашни Лауххаммера - это большая часть нашей мощной развитой промышленности. В 1952 году прямо на пороге нашего города заработала первая в мире крупная коксовая установка, производящая высокотемпературный кокс из бурого угля. Когда импорт битумного кокса из Рурской области стал иссякать, этот технологический прорыв позволил нам заменить его собственными поставками."
 GDR_Invest_in_the_Energy_Sector: "Инвестиции в энергетический сектор"
 GDR_Invest_in_the_Energy_Sector_desc: "Поскольку мы продолжаем развивать промышленность и жилищное строительство, растет и потребность в энергии. Поэтому мы будем инвестировать в развитие энергетического сектора, чтобы рабочий мог работать при свете, а в доме было электричество, необходимое для просмотра последних новостей по телевизору!"
 GDR_Prioritize_Automation_Technology: "Приоритет технологиям автоматизации"
 GDR_Prioritize_Automation_Technology_desc: "Вместе с развитием современного оружия произошел и внезапный бум новых промышленных технологий. Машины, которые еще 20-30 лет назад казались фантастикой, теперь становятся реальностью. Мы не можем позволить этим чудесам пройти мимо нас. Мы профинансируем Приоритизацию Автоматизации, чтобы использовать эти чудеса во славу социализма!"
 GDR_Strengthen_the_Planning_Commission: "Усилить комиссию по планированию"
 GDR_Establish_the_Eisenhuttenkombinats_Ost: "Создание Eisenhuttenkombinats Ost"
 GDR_Strengthen_the_Planning_Commission_desc: "Комиссия по планированию, которую мы создали во время первого двухлетнего плана, до сих пор работала замечательно. Именно поэтому SED решил, что она должна получить больше финансирования и быть усилена, чтобы полностью раскрыть свой потенциал!"
 GDR_Empower_Technocrats: "Расширить возможности технократов"
 GDR_Empower_Technocrats_desc: "В нашем социалистическом государстве есть много самых светлых голов современности. Ученые, которые продолжают доказывать, что фантастика иногда может стать реальностью. Именно поэтому мы должны расширить возможности группы технократов в нашем правительстве и обеспечить им большее финансирование. Кто знает, что еще они могут вскоре изобрести с нашим финансированием!"
 GDR_Expand_the_Port_of_Rostock: "Расширить порт Ростока"
 GDR_Expand_the_Port_of_Rostock_desc: "Порт Росток - это наша главная гавань, которая соединяет нас с Балтийским морем, а также с Северным морем и Атлантикой. Поэтому нам необходимо расширить его, чтобы обеспечить дальнейший импорт и экспорт материалов от наших социалистических братьев со всего мира!"
 DDR_Harich.1.d: "Отвращение к советской оккупации Восточной Германии достигло предела и вылилось в переворот группы Хариха. Немцы, возмущённые советским преследованием этой группы, восстали. Здание суда, в котором проходило дело самого Хариха, было захвачено, а подсудимые освобождены. Лагеря НКВД были атакованы, а произошедшие по всей стране забастовки погрузили страну в хаос.\nВ этом хаосе группа Хариха взяла фактический контроль над страной и пообещала провести либеральные реформы. Последователи Сталина уже начали бежать из страны, так как боятся быть убитыми последователями новой власти."
 DDR_Harich.10.d: "Желая обеспечить единство и самостоятельность немецкого народа, правительство Восточной Германии призвало к общегерманским выборам. Ссылаясь на факт того, что немецкий народ больше не хочет быть под контролем других стран, а хочет обрести политическую самостоятельность, правительство Восточной Германии обещало оказать поддержку этим выборам. Правительство Восточной Германии также выдвинуло несколько вариантов того, как эти выборы будут проведены и как правильно обеспечить выражение воли немецкого народа.\nВ то время как немцы яро поддерживают это предложение, оно породило раскол политиков на две группы. Одна из них сомневается, что соглашение выражает их интересы. Обе стороны еще не опубликовали официальных заявлений или позиций по этому вопросу."
 ulbricht_purge.1.d: "Вальтер Ульбрихт, первый секретарь Германской демократической республики, был убит по приказу политбюро ЦК. Вскоре после смерти Сталина по всей стране вспыхнули массовые беспорядки. Просталинистские лидеры провалились в попытке остановить беспорядки, которые переросли в полноценную революцию. Просталинистское правительство было свергнуто.\nПредседатель экономической комиссии Генрих Рау и глава Штази Вильгельм Цайссер стали фактическими лидерами нации. Сразу после захвата власти Рау и Цайссер обвинили Ульбрихта в предательстве германского народа. Они также назвали его советской марионеткой, созданной для того, чтобы обманывать немецких рабочих марксистскими сказками. Разбирательство по делу Ульбрихта длилось очень долго, было обеспечено широкое юридическое представительство. Он был признан виновным в сговоре против немецкого народа. Ульбрихт был казнён сразу после судебного заседания из-за опасений о возможном перехвате конвоя."
 ddr_zaisser_purged.1.d: "Вильгельм Цайссер, министр государственной безопасности Германской Демократической Республики, был смещён с поста по приказу Вальтера Ульбрихта. Подавив рабочее восстание, Ульбрихт обеспечил свою безопасность и приказал убить Рау и несколько других людей, которых он назвал  “врагами государства”.\nПолный список обвинений, предъявленных Вильгельму Цайссеру, включал плохие отношения с остальными членами партии, контакты с неблагонадёжными людьми и недостаточная активность Штази во время восстания.\nЦайссер был лишён своей должности, но он продолжит работать переводчиком в институте марксизма и ленинизма в Восточном Берлине."
 mielke_purged.1.d: "Эрих Мильке, начальник службы безопасности экономической комиссии Германской Демократической Республики, был отстранён от власти по приказу Генриха Рау. В результате долгого судебного разбирательства Эрих, который обвинялся в антинародной деятельности, был признан виновным по некоторым пунктам обвинения. Эрих Мильке был снят с должности и будет отправлен работать переводчиком в институт марксизма и ленинизма в Восточном Берлине.\nВина за искажение учений Маркса была доказана, но заговор и измена не имели место быть. Было решено, что время, проведённое за чтением и переводом работ Маркса, поможет Эриху Мильке увидеть истинный свет социализма. "
 anti_harich_group.1.d: "Группа Хариха, кружок единомыслящих либеральных марксистов, была арестована и предстала перед судом.\nГруппа во главе с Вольфгангом Харихом в течение долгого продвигала идеи либерализации общества и отмену сталинских реформ. Члены группы хотели расформировать Штази и провести гражданские реформы в стране.\nПосле долгих расследований и допросов большая часть группы была арестована и обвинена в государственной измене. Доказательства в основном состояли из анонимных свидетельских показаний. Все члены группы либо были приговорены к смерти, либо отправлены на безопасные для советского государства работы под строгим надзором."
 ddr_media.1.d: "Официальное немецкое телевещание DFF только что дебютировало в стране. В течение долгого времени радио было главным источником новостей в Восточной Германии. Однако в пятидесятых годах телевидение стало быстро набирать популярность. После этого расширение сети телевещания даже было включено в ближайший пятилетний план. В течение нескольких лет было учреждено DFF, которое привнесло высококачественное образование и развлечение в массы.\nТВ программа включает:\nМарксистское образование для детей\nЕжедневные новости о коммунизме\nЕженедельные отчёты о состоянии дел в стране\nКомедийные шоу с участием подставных лиц\nЭстрадные номера\nПознаватеьные шоу\nИсторическая программа\nСкоро"
 waldheimer_prozesse.1.d: "3442 нацистских военных преступников и других зверских преступников сегодня предстанут перед судом в Вальдхейме. Эти люди обвиняются в разнообразных преступлениях, которые включают преступления против человечества, массовые убийства, военные преступления и многие другие. Защитники подсудимых сами состоят из нацистских преступников, которым ещё предстоит встать перед судом. Судебные процессы будут проводиться последовательно и быстро по причине большого количества обвиняемых. Несколько независимых репортёров утверждают, что процессы несправедливы. На разбирательство одного дела часто уходит не более нескольких минут. Наиболее тревожащим является дело 14-летнего мальчика по имени Вальтер Юриш, которого приговорили к 20 годам лишения свободы. Один из прокуроров ответил, что подсудимые являются нацистами, а у нацистов нет прав. Другой прокурор утверждал, что подсудимые должны быть благодарны за сам факт проведения судебного разбирательства."
 DDR_promulgate_a_constitution: "Принять Конституцию"
 DDR_promulgate_a_constitution_desc: "Первая Конституция ГДР была создана социалистической единой партией Германии в сентябре 1946 года. Конституция 1949 года была предназначена для объединённой Германии и во многих аспектах отличалась от Конституций западных демократий."
 DDR_end_Speziallager: "Закрыть Speziallager"
 DDR_end_Speziallager_desc: "Созданные совесткой военной администрацией лагеря для военнопленных управлялись Главным управлением исправительно-трудовых лагерей (ГУЛаг). Многие командиры лагерей были представителями высшего офицерского состава. Лагеря не практиковали принудительный труд и не располагались при фабриках или шахтах. Наоборот, заключенным не разрешали работать."
 DDR_Cultural_Policies: "Культурная политика"
 DDR_Cultural_Policies_desc: "Мы должны решить какого рода культуру мы будем продвигать среди нашего народа."
 DDR_Purge_Undesirables_from_the_Volkspolizei: "Избавиться от нежелательных элементов в Народной полиции"
 DDR_Purge_Undesirables_from_the_Volkspolizei_desc: ""
 DDR_Socialist_Realism: "Социалистический реализм"
 DDR_Socialist_Realism_desc: "Социалистический реализм - это стиль идеализированного социалистического искусства, которое было придумано в Советском Союзе. Социалистический реализм характеризуется прославлением коммунистических ценностей, таких как освобождение пролетариата."
 DDR_Launch_Deutscher_Fernsehfunk: "Запустить немецкое телевещание"
 DDR_Launch_Deutscher_Fernsehfunk_desc: "В остальных странах Восточного Блока радио является самым распространённым средством вещания. В Германии приоритет должен отдаваться именно телевидению, так как мы должны быть конкурентоспособны на фоне западногерманского телевидения."
 DDR_Appoint_Sepp_Schwab_In_Charge_of_DEFA: "Назначить Зеппа Шваба главой ДЕФА"
 DDR_Appoint_Sepp_Schwab_In_Charge_of_DEFA_desc: "С продолжающимся расширением нашей государственной компании ДЕФА становится понятно, что необходимо назначить умелых и лояльных работников в совет предприятия. Будучи опытным коммунистическим журналистом, Зепп Шваб идеально подходит на роль. Сделав его главным, мы увеличим эффективность компании и покажем немецкому народу опасность фашизма."
 DDR_Promote_Bach: "Продвигать творчество Баха"
 DDR_Promote_Bach_desc: "Иоганн Себастьян Бах был великим композитором, который заслуживает место даже в сердцах социалистов."
 DDR_Stalinist_Architecture: "Сталинская архитектура"
 DDR_Stalinist_Architecture_desc: "Сталинская архитектура в Советском Союзе представляет собой настоящее произведение искусства и показывает мощь советской архитектуры всему миру. Было бы полезно перенять этот стиль для наших собственных строительных проектов, создав основу для нового социалистического стиля."
 DDR_Plattenbau_Housing: "Здания типа Plattenbau"
 DDR_Plattenbau_Housing_desc: "Plattenbau - это здание, построенное из больших сборных бетонных плиты."
 DDR_Deutsche_Akademie_der_Kunste: "Академия искусств ГДР"
 DDR_Deutsche_Akademie_der_Kunste_desc: "Мы должны обучить людей социалистическому искусству."
 DDR_Construct_Karl_Marx_Alle: "Построить Шталин-аллее"
 DDR_Construct_Karl_Marx_Alle_desc: "Нам стоит построить в Берлине большой бульвар для того, чтобы показать мощь социализма. Нам стоит назвать его в честь нашего хорошего друга и освободителя - Сталина."
 DDR_Protect_Ethnic_Minorities: "Защитить этнические меньшинства"
 DDR_Protect_Ethnic_Minorities_desc: "Поскольку в стране проживает много меньшинств, мы должны убедиться, что они не подвергаются дискриминации."
 DDR_Tolerate_Regional_Languages: "Разрешить региональные языки"
 DDR_Tolerate_Regional_Languages_desc: "В условиях постоянно сокращающегося числа лужицких сербов мы должны принять меры для сохранения жизни этой уникальной культуры в соответствии с социалистическими идеалами."
 DDR_Begin_a_Culture_War: "Начать Культуркампф"
 DDR_Begin_a_Culture_War_desc: "Мы должны бороться с влиянием церкви."
 DDR_Socialist_Rites: "Социалистические традиции"
 DDR_Socialist_Rites_desc: "Альтернатива христианскому признанию, социалистические обряды помогают молодежи перейти во взрослую жизнь."
 DDR_Establish_Jugendweihe: "Учредить Jugendweihe"
 DDR_Establish_Jugendweihe_desc: "Jugendweihe - это светская церемония взросления, разработанная в качестве альтернативы конфирмации в протестантстве и римском католичестве."
 DDR_Establish_the_Freidenkerverband: "Создать Deutscher Freidenker-Verband"
 DDR_Establish_the_Freidenkerverband_desc: "Deutsche Freidenker-Verband (Немецкий союз свободомыслящих). Его целью было распространение и продвижение нерелигиозных рациональных взгляов на мир."
 DDR_Tolerate_Organized_Religion: "Разрешить религиозные организации"
 DDR_Tolerate_Organized_Religion_desc: "В то время как социализм традиционно выступал против религии, возможно, мы можем закрыть глаза на некоторые религиозные организации и обычаи."
 DDR_Encourage_Liberation_Theology: "Христианский социализм"
 DDR_Encourage_Liberation_Theology_desc: "Кто сказал, что коммунист и христианин не могут быть друзьями?"
 DDR_Subvert_The_Lutherarn_Churches: "Разрушить лютеранскую церковь"
 DDR_Subvert_The_Lutherarn_Churches_desc: "С помощью Штази мы можем назначить наших собственных агентов в качестве священников в церкви, взяв их под свой контроль."
 DDR_Religion_as_a_Means_of_Social_Control: "Религия как метод социального контроля"
 DDR_Religion_as_a_Means_of_Social_Control_desc: ""
 DDR_formally_establish_the_ddr: "Официально учредить ГДР"
 DDR_formally_establish_the_ddr_desc: "В ноябре 1948 года Немецкая экономическая комиссия, включающая представителей антифашистского блока, взяла на себя административные полномочия. После объявления о создании Федеративной республики Германия, НЭК приготовилось сформировать временное правительство и провозгласить создание Германской Демократической Республики. Пришло наше время!"
 DDR_establish_the_stasi: "Создать Штази"
 DDR_establish_the_stasi_desc: "Министерство государственной безопасности ГДР было официальной службой государственной безопасности Германской Демократической Республики. Оно было одним из самых эффективных и репрессивных разведывательных агентств когда-либо существовавших."
 DDR_Waldheimer_Prozesse: "Процесс Вальдхайма"
 DDR_Waldheimer_Prozesse_desc: "Судебные процессы Waldheimer проходили в маленьком саксонском городке Вальдхейм. Несколько военных трибуналов в районном суде города Хемниц проводили следствие над 3442 людьми, которые были обвинены в военных преступлениях. 3324 подсудимых были признаны виновными, большинству из них назначили тюремное заключение сроком от 15 до 25 лет."
 DDR_treaty_of_zgorzelec: "Згожелецкий договор"
 DDR_treaty_of_zgorzelec_desc: "Згожелецкий договор между Польской республикой и Восточной Германией был соглашением, которое утвердило границу по линии Одер-Нейсе. Эта линия была установлена Постдамским соглашением в 1945 году в качестве границы между двумя государствами."
 DDR_national_front: "Национальный фронт ГДР"
 DDR_national_front_desc: "Национальный фронт - это альянс политических партий и общественных организаций, контролируемых правящей партией, СЕПГ."
 DDR_third_party_congress: "Конгресс третьей партии"
 DDR_third_party_congress_desc: "Германская Демократическая Республика - это молодая нация, путь которой ещё не определён. Конгресс третьей партии должен утвердить наше направление развития..."
 DDR_continue_agrarian_reforms: "Продолжить проведение аграрных реформ"
 DDR_continue_agrarian_reforms_desc: "С начала советской оккупации в 1945 году военная администрация постепенно переносила сельскохозяйственный сектор из частного ведения в сферу общественного интереса, как это делается в России. Если мы вместе будем работать на государство, то это сыграет нам на руку в будущем."
 DDR_peoples_enterprises: "Народное предприятие"
 DDR_peoples_enterprises_desc: "Народное предприятие, или Volkseigener Betrieb, было основной правовой формой промышленного предприятия в Восточной Германии. Оно находилось в общественной собственности и было образовано после массовой национализации, имевшей место после окончания советской оккупации."
 DDR_Nationalizaton_Campaign: "Кампания по национализации"
 DDR_Nationalizaton_Campaign_desc: ""
 DDR_toe_the_line: "Подчиниться требованиям"
 DDR_toe_the_line_desc: "В течение многих лет мы жили под гнётом нацистов и капиталистов. Именно последних так любят демократические партии. Русские являются нашими освободителями, и мы всегда будем оставаться на их стороне, какой бы путь они не избрали. Другими словами, мы должны подчиняться их требованиям..."
 DDR_promote_the_young_pioneers: "Продвигать пионерскую организацию имени Эрнста Тельмана"
 DDR_promote_the_young_pioneers_desc: "Pionierorganisation Ernst Thälmann (Пионерская организация имени Эрнста Тельмана) - это молодёжная организация для школьников от 6 до 14 лет в Восточной Германии. Организация была основана на движении бойскаутаов, но ориентирована на обучение детей социалистической идеологии. Деятельность, осуществляемая в этой организации, состояла из полуоккультного социалистического обучения и поддержания революционных традиций."
 DDR_Aktion_Rose: "Роза действий"
 DDR_Aktion_Rose_desc: "Aktion Rose было мерой правительства ГДР по национализации отелей, домов отдыха и служб такси в феврале 1953 года. Акцент был сделан на курортах, расположенных на балтийском побережье. Более 400 предпринимателей были арестованы за нарушение закона о защите государственной собственности и другой общественной собственности."
 DDR_crackdown_on_fascists: "Расправиться с фашистами"
 DDR_crackdown_on_fascists_desc: "Мы участвовали в послевоенной денацификации, как это делала ФРГ, однако в Восточной Германии остаётся множество людей, тайно поддерживающих нацизм. Мы должны уничтожить эту ужасную идеологию раз и навсегда."
 DDR_pressure_moscow_against_poland: "Оказать давление на Польшу при поддержке Москвы"
 DDR_pressure_moscow_against_poland_desc: "У Польши отсутствует право на управление исконными немецкими землями, если не считать декларативные союзнические соглашения. Мы не можем справиться с ними в одиночку, однако с помощью Москвы мы сможем убедить Польшу мирно вернуть наши территории."
 DDR_crackdown_on_democrats: "Расправиться с демократами"
 DDR_crackdown_on_democrats_desc: "Демократы и либералы в восточной Германии представляют угрозу нашему образу жизни и порядку в обществе. Их идеология должна быть уничтожена до того, как они смогут нанести вред обществу."
 DDR_anti_west_propaganda: "Антизападная пропаганда"
 DDR_anti_west_propaganda_desc: "Западные капиталисты должны быть уничтожены независимо от последствий, так как это необходимо для существования идеального общества. Распространяя антизападную пропаганду, мы наконец-то сможем обесчеловечить врагов в глазах народа."
 DDR_inner_german_border: "Внутригерманская граница"
 DDR_inner_german_border_desc: "Велика вероятность того, что Европу ждёт третья мировая война. Мы должны быть готовы отразить любые атаки со стороны наших западных соседей из ФРГ. Внутригерманская граница обеспечит безопасность нашего народа."
 DDR_Aktion_Vermin: "Операция Паразиты"
 DDR_Aktion_Vermin_desc: "Множество политически непредсказуемых людей живёт рядом с западной границей. Мы должны переселить этих людей для того, чтолы уменьшить риск побега и шпионажа."
 DDR_german_soviet_friendship: "Общество германо-советской дружбы"
 DDR_german_soviet_friendship_desc: "Две великие страны должны поддерживать дружеские отношения друг с другом."
 DDR_Join_COMECON: "Вступить в СЭВ"
 DDR_Join_COMECON_desc: ""
 DDR_Complete_Reperation_Payments: "Выплатить репарации"
 DDR_Complete_Reperation_Payments_desc: "После всех пролитых слёз и крови, мы наконец-то можем выплатить репарации."
 DDR_Rehabilitated_Wehrmact_Officers: "Реабилитировать офицеров Вермахта"
 DDR_Rehabilitated_Wehrmact_Officers_desc: ""
 DDR_Reinstate_Wehrmacht_Generals: "Восстановить в должности генералов Вермахта"
 DDR_Reinstate_Wehrmacht_Generals_desc: "Из-за недостатка высшего офицерского состава нам придётся восстановить в должности некоторых генералов Вермахта. После некоторой переподготовки они смогут стать полезными для родины."
 DDR_Reorganize_the_Arial_Fleet: "Реорганизовать воздушный флот"
