l_english:
 StalinNotes.1.d: "Советский лидер Иосиф Сталин раскрыл свой план решения Германского вопроса. Продолжающееся разделение Германии и оккупация союзниками грозит превращением Западной Германии в крупный буфер для Запада. Восточной Германии в настоящее время не хватает рабочей силы и промышленного потенциала Западной Германии. Сталин заявил о своем намерении передать западным державам дипломатическую ноту с предложением провести мирную конференцию для  объединения демократической Германии при условии, что она останется полностью нейтральной. Это наряду с другими условиями, такими как Потсдамская граница. Нейтральная Германия могла бы стать ключевым буферным государством и лишить Запад потенциального союзника. Однако, прежде чем отправить ноту, Советское правительство должно для себя решить, можно ли доверять, что Запад и Германия будут следовать условиям договора."
 StalinNotes.2.d: "Советский Союз недавно направил ноту с призывом к мирной конференции между оккупационными державами в Германии для определения деталей создания единого буржуазного Германского государства. Советское правительство настаивают на том, что объединенная Германия должна быть нейтральной и иметь потсдамские границы. Условия кажутся щедрыми, и нейтральная Германия была бы полезным буфером. Однако обещания о создании демократии в Германии не включают гарантии свободных выборов, и наши союзники считают, что Германия должна участвовать в них. Возможно, нам следует послать ответ с подробным изложением наших взглядов и призвать к дальнейшим дискуссиям с Советским Союзом по этому вопросу, особенно о том, что означает строгий нейтралитет. Советское предложение также может быть просто уловкой, в этом случае оно должно быть категорически форме отвергнуто."
 StalinNotes.3.d: "Западные державы, как и следовало ожидать, добавив свои собственные условия, в частности, они хотят, чтобы голосование в Германии состоялось до мирной конференции и под наблюдением ООН. Они также выразили некоторые оговорки в отношении нейтралитета Германии, утверждая, что этот нейтралитет нарушает суверенитет Германии. Так же они выступают против потсдамской границы. Мы должны отреагировать на эту ноту и определить наш подход к взаимодействию с Западом в последующих коммуникациях. Один из вариантов состоит в том, чтобы уступить западу, конечно за исключением нейтралитета Германии. Другой вариант - попытаться достичь компромисса с Западом по данному вопросу. В конце концов, возражения Запада указывают на то, что они, вероятно, попытаются манипулировать результатами наших соглашений."
 StalinNotes.4.d: "Мы обменялись с Советским Союзом нотами по вопросу об объединении Германии. Похоже, что Советское правительство готово пойти на компромисс и добиться подлинного согласия. Однако ясно, что если мы пойдем по этому пути они будут твердо бороться за свои интересы. Другой вариант состоит в том, чтобы признать советский план способом ослабить оборону Западной Европы, и если это так, то они должны полностью принять наши предварительные требования к будущим переговорам. И наконец, если все это окажется пропагандистской уловкой, мы можем положить конец любым дискуссиям с Советским правительством."
 StalinNotes.5.d: "Западные страны продолжают отвергать наши  условия обледенение оккупационных зон в единое Германское государство. Очевидно, что их противодействие созданию демократического буржуазного нейтрального государства отражает их темные амбиции превратить Германию в свою колонию, в свою капиталистическую военную машину. Однако, если мы уверены в том что левые одержат победу на общенациональных выборах до начала конференции, даже при соблюдении предварительных условий, германское государство в любом случаи будет работать с нами, и мы сможем повернуть конференцию в свою пользу. Есть и большие риски, что выборы пойдут не в нашу пользу, в таком случаи мы рискуем потерять всю Германию на Западе."
 StalinNotes.6.d: "Представители Советского Союза, Соединенных Штатов, Франции и Великобритании собираются на конференцию в Дрездене, чтобы обсудить объединение Германии. Конференция состоялась после того, как Советский Союз предложил провести заключительное собрание лидеров стран для определения судьбы Германии. Многие на Западе с осторожным оптимизмом относятся к потенциальным переговорам, поскольку Советский Союз обещал уважать потенциальную демократическую политику в Германии, включая многочисленные политические партии и права личности. Однако есть некоторые опасения, что Советская власть стремятся создать слабое, немецкое буферное государство для защиты своих границ и всяческий ослабить работу по формированию надежной западноевропейской обороны."
 StalinNotes.7.d: "Союзные державы и Советский Союз согласились на формирование объединительного правительства в Германии. Кабинет министров будет разделен между консервативными и левыми политиками. Аналогичное соглашение будет заключено и с германским парламентом. Равный политический раскол обеспечивает консенсус, необходимый для принятия законодательства, и будет держать политические крайности в узде. В Западной Германии сетуют на то, что союзники жертвуют демократическими принципами в угоду коммунистам, которые не пользуются такой большой популярностью в Германии."
 StalinNotes.8.d: "В одной из наиболее спорных дискуссий четыре державы объявили, что новое объединенное германское государство будет географически соответствовать положениям Потсдамской конференции. Соглашение фактически сдвигает восточную границу к линии Одер-Ниссе, отказываясь от значительной части немецкой границы 1937 года. Западная Германия долго выступала против этого положения, однако оккупационные державы согласились с ним. Американский дипломат в частном порядке сказал журналистам, что граница фактически уже стала реальностью, и ее изменение принесет много ненужных не кому беспорядков."
 StalinNotes.9.d: "На крупно заседаний четыре оккупационные державы согласились, что объединенная Германия будет строго нейтральной на международном уровне и демократической по своему характеру. Германия не может вступать или участвовать в каких либо военных союзах и вольна участвовать в любых торговых соглашениях. В результате компромисса с американцами новой Германии будет разрешено вступить в Организацию Объединенных Наций и участвовать в ней, но не будет разрешено применять военную силу или вести военные действия против какой-либо из оккупационных держав. Новая Германия тоже может содержать армию, но только силу, необходимую для разумной обороны и внутренней безопасности. Советский Союз настаивал на том, что никаких выборов не должно проводиться для поддержания баланса сил, однако Соединенные Штаты утверждают, что демократическое общество требует выборов. Было решено, что правительство объединенной Германий определит, будут ли разрешены выборы или нет."
 StalinNotes.10.d: "В историческом соглашении Соединенные Штаты, Франция, Великобритания и Советский Союз договорились об окончательном урегулировании вопроса об объединении Германии. В соответствии с соглашением, Западная и Восточная Германия должны организовать новое объединительное правительство. Германия должна оставаться строго нейтральной, соблюдать потсдамские границы и гарантировать демократические права и свободы своим гражданам. Хотя многие немцы вроде как рады этой новости, но есть опасения по поводу границ и сил компартии в соглашении о разделе власти.."
 StalinNotes.11.d: "Соединенные Штаты, Англия и Франция настаивают на том, чтобы мы сформировали единое правительство, как это предусмотрено в их соглашении с Советским Союзом. Многие в стране возмущены тем, что немцы не были на переговорах. Кроме того, предлагаемое государство будет иметь спорные потсдамские границы и вынудит нас работать с коммунистами в Восточной Германии, которых не признают легитимными. Наши сторонники в Соединенных Штатах сообщили нам, что если мы откажемся создать объединённое правительство, они поддержат аннулирование договора. Однако есть также много немцев, которые поддерживают соглашение, полагая, что его преимущества перевешивают опасения по поводу границ и разделения власти."
 StalinNotes.12.d: "Западногерманское правительство выразило свое несогласие с недавним соглашением оккупационных держав об объединении Германии. Они ссылаются на то, что отсутствие какого-либо участия избранного представителя немецкого народа вызывает принципиальную озабоченность. Кроме того, условия нейтрального государства ставили под угрозу безопасность и экономическое будущее Германии. Что еще более важно, объединенное правительство с отсутствием гарантий свободных выборов, даже с гарантией демократических прав, являются неприемлемыми демократическому народу Германии. Правительство добавило, что не признает незаконный режим в Восточной Германии и не будет вступать с ними в какие-либо дискуссии. У Соединенных Штатов нет другого выбора, кроме как отказаться от поддержки заключённого ранее ею договора и вернуться к проекту Западной Германии."
 StalinNotes.13.d: "Недавнее соглашение об объединении с Германией, похоже, провалилось. Правительство Западной Германии отказалось принять условия договора и не будет встречаться с восточногерманскими официальными лицами, которых они не признают. После этого заявления Соединенные Штаты вместе с Великобританией и Францией объявили, что не будут принуждать Западную Германию соблюдать условия договора. Это фактически означает, что все советские усилия по решению вопроса об объединении Германии потерпели неудачу. Советский Союз выразили свое возмущение и обвинили Запад в милитаризации Европы. Советскую власть в основном хвалят за то, что они заняли принципиальному позицию по соблюдению ранее оговорённых с западом договорённостей, в то время как Соединенные Штаты сталкиваются с серьёзной критикой за переговоры о соглашениях которые они не захотели соблюсти."
 StalinNotes.14.d: "После напряженных дискуссий представители Западной и Восточной Германии договорились о формировании объединительного правительства. Ключевые посты в кабинете министров будут разделены, а места в парламенте-распределены между партиями. Будет установлен равный баланс между правыми и левыми партиями. Это должно обеспечить нейтралитет Германии и угрозу узурпаций власти диктатором. Нейтральное германское государство получило сообщения о начале вывода оккупационных войск из страны. Первая законодательная дискуссия заключается в том, следует ли Германии проводить свободные выборы в будущем или нет. Будущая конституция будет определять будущий состав правительства и избирательную политику государства."
 StalinNotes.15.d: "В соглашении между оккупационными державами говорилось, что Германия примет демократические ценности, но свободные выборы оставлены на усмотрение германского правительства. Советcкие власти выступали против демократических выборов, предпочитая вместо этого систему, в которой несколько партий получили бы места и могли разместить на них тех людей, которых сами партий хотели бы. Баланс партий и идеологии сохранит нейтралитет, а демократические выборы могут разрушить такой баланс. Западные державы считают, что демократия эффективна только в том случае, если граждане имеют право голоса. Парламент и кабинет министров должны принять решение о будущем, объявить всеобщие выборы или сохранить нынешнее правительство до тех пор, пока решение не будет найдено позже."
 StalinNotes.16.d: "Представители ООН начинают собираться в городах по всей Западной и Восточной Германии. Оба государства проведут национальные выборы для создания единого правительства, прежде чем провести мирные переговоры с оккупационными державами для принятия решения об окончательном объединении Германии. Советские и западные вооруженные силы в стране, останутся в своих частях до проведения выборов. Это продолжение мирного процесса, начатого Советским Союзом для решение вопроса об объединении Германии."
 StalinNotes.17.d: "Впервые за многие годы народ Германии пойдет на свободные выборы. Всем крупным политическим партиям было разрешено проводить агитационные кампании по всей Западной и Восточной Германии. За выборами будут следить члены Организации Объединенных Наций из многих стран. Советские, Американские, Французские и Британские вооруженные силы находятся в своих казармах, а военная техника запрещена на улицах в день выборов. Журналисты со всего мира приехали посмотреть на исторические выборы. Вся Европа, похоже, затаила дыхание в ожидании результатов."
 StalinNotes.18.d: "Организованные Организацией Объединенных Наций выборы в Западной и Восточной Германии прошли мирно. Миллионы немцев пришли на избирательные участки, чтобы определить будущее своей нации. Выборы привлекают пристальное международное внимание. Для европейцев успех этих опросов и нового правительства единства приведет Германию к мирным переговорам с оккупационными державами. ООН планирует обнародовать результаты, как только будут подсчитаны все голоса. Советский Союз и Соединенные Штаты хвалят за их инициативу и уважение к выбору немецкого народа."
 StalinNotes.19.d: "Организация Объединенных Наций недавно объявила, что левая коалиция во главе с коммунистической Социалистической Партией Единства Германии победила на выборах. Он возглавит германскую делегацию на мирных переговорах. Результаты удивили Соединенные Штаты и их Европейских союзников, которые считали, что эта партия не сможет эффективно конкурировать в Германии. Советский Союз высоко оценил результаты выборов как свидетельство стремления Германии к миру через социальные права, свободы и равенства немецкого народа. Многие аналитики считают, что это сместит преимущество на мирной конференции по объединению Германии в пользу Советской власти."
 StalinNotes.21.d: "Нынешняя мирная конференция по объединению Германии достигла соглашения о границах Германии. Советское и Германское правительства согласились соблюдать границы, установленные Потсдамской декларацией. Хотя многие Немцы выступают против границы, было признано, что пограничные земли уже сдвинулись и повернуть их вспять теперь невозможно."
 StalinNotes.22.d: "Мир приветствовал известие о подписании окончательного мирного договора об объединении Германии. Западные державы довольны гарантией демократических прав для новых германских государств. Советский Союз видят в требуемом нейтралитете Германии важный для себя результат. Нейтральная Германия предлагает буферное государство между двумя альянсами. Говорят, что немцы взволнованы новыми соглашениями, так же существуют некоторые разногласия относительно окончательных границ, установленных этими соглашениями."
 StalinNotes.23.d: "Новоизбранная коалиция консервативных партий принимает участие в Мирной конференции по объединению Германии с нынешними оккупационными державами. Христианско-демократическая партия является самой крупной в коалиции и, как ожидается, будет добиваться восстановления границы 1937 года и обеспечения демократических прав. Советский Союз захочет свести к минимуму германскую армию и ее нейтралитет в европейских и глобальных вопросах."
 StalinNotes.24.d: "Продолжающаяся мирная конференция по объединению Германии уже согласовала внешнюю и военную политику объединенной Германии. Хотя Советские власти хотели, чтобы Германия всегда была нейтральной и не имела выборов, гарантирующих сбалансированное правительство, их убедили пойти на компромисс. Германия останется под определёнными военными ограничениями в течение пятнадцати лет. Даже после того, как ограничения будут сняты, Германия должна согласиться быть осторожной в своей внешней политике. Расплывчатость формулировок рассматривается после снятия ограничений как преимущество для Германии."
 StalinNotes.25.d: "Участники Мирной конференции достигли серьёзных результатов по объединению Германии приняв соглашение о границах Германии. Советский Союз стремился сохранить территориальное разделение, согласованное с союзниками в Потсдаме, но не смогло преодолеть давление со стороны союзников и Германии по этому вопросу. Советские власти договорились о возвращении Калининграда и его окрестностей Германии. Это крупная победа Германского правительства, и она будет всенародно принята немецким народом. Польша и Советский Союз не будут довольны таким положением дел, Хотя как мы помним Советские власти обещали передать управление возвращенной территорией обратно немцам. Соединенные Штаты поддерживают эту попытку продвинуть нейтральный буфер ближе к советскому пространству."
 StalinNotes.26.d: "Мир приветствовал известие о том, что оккупационные державы и Германия подписали окончательное соглашение об объединении Германии. Соглашение предусматривает период нейтралитета и демилитаризации наряду с гарантированными демократическими правами для всех граждан Германии. Западные державы очень довольны результатами, и многие европейцы видят в соглашении снижение напряженности на континенте. Советские власти будут довольны нейтралитетом и созданием Германии в качестве буферного государства, однако ее временный нейтральный статус может вызвать проблемы в будущем, особенно после того как только они будут сняты."
 StalinNotes.27.d: "Советские, Американские, Британские и Французские оккупационные силы в настоящее время контролируют подготовку к национальным выборам в Западной и Восточной Германии. Сформированное правительство будет представлять Германию на предстоящей Мирной конференции по объединению Германии. Советские власти первоначально стремились провести конференцию без участия Германии, но пошли на компромисс с Западом при условии, что выборы будут проводиться оккупационными державами. Западные державы изначально выбрали для наблюдения за выборами Организацию Объединенных Наций, но в итог приняли Советскую требование. Говорят, что Немцы крайне обеспокоены изо предвыборного ажиотажа."
 StalinNotes.28.d: "Советский Союз будет наблюдать за выборами в своей Немецкой оккупационной зоне, чтобы определить, какое правительство будет представлять Германию на запланированной мирной конференции по объединению Германии. До выборов еще несколько месяцев, а политические партии уже ведут предвыборную кампанию. Нет никакого способа предсказать итог выборов. Мы могли бы позволить немецкому народу принять решение на выборах, однако было внесено предложение обеспечить успешный исход для левый партии. Местная разведка и вооруженные силы могут гарантировать успех на выборах, Западная Германия все еще имеет достаточно большее население. Чтобы изменить положение дел в свою пользу, мы можем передать им более миллиона этнических немцев, проживающих в Казахской ССР. Потенциально они могут быть расселены под Калининградом."
 StalinNotes.29.d: "Есть сообщения и слухи об большом количестве железнодорожных составов в Восточной Германии. В частности, похоже, что в страну прибывают тысячи новых немцев. Советские власти размещают этих людей во временных лагерях, причем ходят слухи, что в конечном итоге они могут быть расселены в близлежащих районах Калининграда. По данным разведки, происхождение этих немцев, по-видимому, Казахская ССР. Советские власти переводят большое этническое немецкое население обратно в Германию, без сомнения, чтобы добавить тысячи голосов на предстоящих выборах в пользу своих коммунистических сил. Советская секретность и отказ комментировать это население указывают на более широкую схему возможных манипуляций на выборах. За выборами нужно внимательно следить."
 StalinNotes.30.d: "Выборы национального правительства, которое будет представлять Германию на предстоящей Мирной конференции по объединению Германии, должны состояться в ближайшие недели. Репортеры в Восточной Германии замечают, что на фоне политической агитации к ним приезжает большое количество немцев из Советского Союза. Похоже, Советские власти переводят этнических немцев, депортированных во время войны, обратно в страну для участия в выборах. Советские власти отказались комментировать этот вопрос, и западные наблюдатели выражают озабоченность тем, что это представляет собой заговор с целью манипулирования результатами в пользу Партии Социалистического Единства."
 StalinNotes.31.d: "Результаты недавних общенациональных выборов в Западной и Восточной Германии свидетельствуют о заметном всплеске поддержки Коммунистической Рабочей Партии Социалистического Единства. Подробности все еще выясняются, но, судя по всему, коммунисты, опрошенные в Восточной Германии, были исключительными. Успехи левых в Западной Германии указывают на то, что окончательное правительство, скорее всего, будет коалицией левых партий во главе с коммунистической партией. Западные державы и западногерманское правительство поднимают вопросы по поводу результатов, и в этих столицах проводятся чрезвычайные собрание. Советский Союз дал высокую оценку предстоящим выборам и призвал все партии Германии относится с уважением к результатам. Говорят, что Советское решение о возвращении депортированных этнических Немцев и уступке части территории Восточной Германии сыграло решающую роль в результатах этих выборов."
 StalinNotes.32.d: "Наши разведывательные донесения на местах, сообщения в средствах массовой информации и данные выборов указывают на то, что в Советской зоне оккупации, вероятно, имели место широко распространенные фальсификации на выборах. Эти результаты гарантируют, что левое немецкое правительство будет представлять Германию на будущей конференции. Это даст Советским властям сильную позицию для переговоров. Мы можем отказаться от нашей поддержки конференции и выборов, фактически положив конец недавним мирным усилиям. Хотя Советское правительство выдаст ноту протеста Западу, это, вероятно, будет хорошо воспринято нашими союзниками и многими немцами. Однако, возможно, в наших интересах, чтобы мирная конференция продолжалась, даже если немецкие представители будут просоветский настроены, у них все равно будут свои национальные интересы по некоторым вопросам. Решение Советов вернуть депортированных немцев и уступить земли Восточной Германии дало толчок поддержке коммунистов и социалистов  в Западной Германии."
 StalinNotes.33.d: "Результаты выборов показывают победу левых в национальных опросах. Коммунистическая партия, очень хорошо себя зарекомендовала. Сообщения, в том числе из средств массовой информации, свидетельствуют о том, что советские оккупационные силы, наблюдавшие за выборами в Восточной Германии, занимались манипуляциями с бюллетенями для обеспечения победы коммунистов. Коммунисты должны были бы править вместе с другими левыми партиями и возглавить Германию на мирной конференции. Это смягчило бы их просоветскую позицию. Однако ясно, что выборы скорее всего не являются подлинными, и мы легко можем отказаться от продолжения процесса становление новой власти. Американцы, Французы и Англичане заявили о своей поддержке, если мы решим прекратить этот процесс. Решение Советского союза вернуть депортированных Немцев в Германию и уступить земли Восточной Германии дало толчок поддержке социалистов и коммунистов в Западной Германии."
 StalinNotes.34.d: "Западные державы и Западная Германия отказались вести мирные переговоры после недавних выборов. Советский Союз обвиняют в фальсификации выборов в Восточной Германии, чтобы обеспечить для себя  большое влияние в Германии и развить коммунистическое движение там. Без законного результата немецкий народ не может быть представлен должным образом на мирной  конференций. Советский Союз громко критикует Запад за саботаж мирных усилий, потому что выборы прошли не в его пользу. Западная Германия утверждает, что эти выборы доказывают нелегитимность Восточногерманского режима."
 StalinNotes.35.d: "Мировые СМИ сообщили о недавних выборах, проходивших в Западной и Восточной Германии. Несмотря на опасения относительно голосования в Восточной Германии, все указывает на то, что Немцы могли голосовать свободно, беспрепятственно. Основным политическим партиям как в Западной, так и в Восточной Германии было разрешено свободно вести предвыборную кампанию. Все оккупационные державы, Немцы и Европейцы будут внимательно следить за результатами. Победившая коалиция возглавит германскую делегацию на предстоящей мирной конференции по окончательному объединению Германии. Ожидается, что Христианско-демократическая партия и Партия Социалистического Единства станут двумя крупнейшими победителями на выборах."
 StalinNotes.36.d: "На недавних выборах в Западной и Восточной Германии победила коалиция консервативных партий. Новое правительство возглавит Германию на мирной конференции. Советские власти не будут довольны результатами, но, как ожидается, будут добиваться компромисса в свою пользу. Союзные державы надеются, что дружественное германское правительство поможет им продвинуть свои цели в обсуждении. Немцы будут с нетерпением следить за ходом переговоров и надеяться на единую, мирную Германию."
 StalinNotes.37.d: "Мирная конференция по объединению Германии согласилась на восстановление части восточной границы Германии в обмен на независимую внешнюю политику. Не будет никаких ограничений на немецкие вооруженные силы, но есть надежда, что Германия сохранит вооруженные силы только для обеспечения безопасности своих границ и сохранения внутреннего мира. Советский Союз стремился сохранить границы, установленные Потсдамским соглашением, но был вынужден пойти на компромисс, чтобы сохранить постоянный нейтралитет Германии. Польша, вероятно, будет мягко говоря расстроена этим соглашением, но Советские власти обещали вернуть управление территориями обратно Германскому правительству. Немецкое правительство не получило всех своих территориальных требований, но смогло получить Калининград и его окрестности."
 StalinNotes.38.d: "Продолжающаяся мирная конференция по объединению Германии согласилась сохранить демократические и личностные права для всех Немцев. Вопрос о свободных выборах должен быть поставлен на голосование Немецким народом после конференции. Западные державы хотели гарантированных свободных выборов, но Советские власти хотели постоянного, разделяющего власть правительства для поддержания политического баланса в стране. Референдум позволит решить этот вопрос Немецкому народу."
 StalinNotes.39.d: "Консервативное германское правительство и оккупационные державы подписали окончательное соглашение об объединении Германии. Договор требует от Германии строгого нейтралитета и гарантии демократических прав. Вопрос о свободных выборах будет решаться на всенародном референдуме. Что еще более важно, подписанты согласились восстановить некоторые из немецких границ, существовавших до Второй мировой войны. Соглашение не вполне устраивало ни одну из сторон, однако союзные державы смогли обеспечить демократическую Германию. Советскому Союзу удалось обеспечить новому германскому государству сохранение нейтралитета, предоставив им буферную зону и лишив США доступа к потенциальной германской промышленной или военной мощи."
 StalinNotes.40.d: "Немцы по всей стране вышли на избирательные участки, чтобы решить, будут ли в стране свободные выборы. Недавно согласованный договор обеспечивает демократические и индивидуальные права. Однако вопрос о свободных выборах так и не был решен. Сторонники утверждают, что свободные выборы являются важной частью любой демократии. Однако оппоненты утверждают, что будущая конституция должна гарантировать баланс распределения мест для всех политических идеологий. Это предотвратит доминирование одной идеологии и поможет сохранить нейтралитет. Эксперты по этому вопросу говорят, что нет четких прогнозов на то, какая сторона победит."
 StalinNotes.41.d: "Недавние общенациональные выборы привели к победе коалиции левых партий. Партия Социалистического Единства является самой крупной партией в правительстве. Результат встречает одобрение Советского Союза, и его эксперты полагают, что это поможет ему в предстоящих мирных переговорах по объединению Германии с оккупационными державами. Хотя западные страны будут разочарованы, остается понимание, что коалиция будет помнить о национальных интересах независимого, единого Германского государства."
 StalinNotes.42.d: "Мирная конференция по объединению Германии достигла компромисса относительно границ Германии. В замен принятых границ из Потсдамского соглашения в обмен на временный нейтралитет. Соглашение о границе устраивает Советский Союз и Польшу. Для Запада соглашение о временном нейтралитете открывает возможность прозападного германского государства в будущем. Германия должна быть строго нейтральной в течение пятнадцати лет, прежде чем ограничения будут сняты."
 StalinNotes.44.d: "Оккупационные державы и Германия подписали окончательное соглашение по вопросу объединения Германии. Договор решает ряд вопросов, касающихся окончательной границы, демократических прав и нейтралитета Германского государства. Ни Союзные оккупанты, ни Советский Союз не вполне довольны результатами. Однако ожидается, что достигнутые компромиссы сохранят мир не только в Германии, но и в Европе. Международное сообщество в значительной степени приветствует эти результаты и высоко оценивает способность государств-участников достичь соглашения."
 StalinNotes.45.d: "Немецкий парламент обсуждает вопрос о том, должны ли свободные выборы стать частью будущей конституции Германии. Сторонники выборов утверждают, что демократические права, гарантированные недавним договором, могут быть узаконены только путем проведения выборов. Противники считают, что Германия должна установить баланс политических сил, чтобы сохранить нейтралитет и гарантировать, что ни один диктатор или радикальная партия никогда не заняли власть. Ожидается, что дебаты будут бойкими и интересными."
 StalinNotes.46.d: "Запад, особенно Соединенные Штаты, отреагировали на наши мирные усилия по объединению Германии различными махинациями и невыполнимыми встречными предложениями. Они раскрыли свои планы разжигания войны. Запад хочет перевооружить Германию и сделать из неё военную державу, чтобы помочь им в свержений режима в Восточной Европе. Немецкая пресса сообщает о наших достойных условиях по объединению Немецкого народа и об американском участии в ее провале. Восточногерманское правительство выразило свое восхищение нашими усилиями по достижению прочного мира."
 StalinNotes.47.d: "Обмен нотами между Советским Союзом и Германскими оккупационными державами прекратился. Американцы утверждают, что Советское правительство никогда не были искренними и только делали вид, что они были заинтересованы в справедливом мире для Германии. Хотя многие в нашем правительстве согласны с этой оценкой, но растет и число тех официальных лиц и средств массовой информации, предполагающих, что провал переговоров может быть упущенной возможностью. Это привело к некоторому недовольству среди Немцев, но в целом мы не ожидаем, что это распространится на общественные протесты или выражения гнева."
 StalinNotes.48.d: "Обмен нотами между Советским Союзом и нашими союзниками завершились неудачей. Советская власть, казалось, предлагали щедрые условия по объединению Германии, однако наши усилия вести переговоры и продвигать дискуссии дальше были отклонены. Ясно, что Советское правительство просто использовали эти дискуссии как инструмент пропаганды и способ узаконить свой незаконный режим в Восточной Германии. Хотя наши союзники и народ пронимают эти факты, есть очень много Немцев, которые считают, что это наша вина, что переговоры провалились."
 StalinNotes.49.d: "Решительные попытки Советского Союза добиться справедливого решения вопроса об объединении Германии и мире закончились безрезультатно. Запад отреагировал негативно и активно добивался провала объединения. Они делали это, выдвигая неадекватные требования и распространяя слухи, которые подрывали честные намеренья Советской власти. Западная Германия показала свое истинное лицо как Американская марионетка, продолжая свою пропаганду. В конце концов, все Немцы видели, как одна сторона стремилась к миру и единству, в то время как другая предпочла продолжать эскалацию напряженности."
 StalinNotes.57.d: "Наши недавние попытки добиться окончательного мира и объединение в Германией закончились, когда Запад отказался от наших условии объединение, когда они поняли, что они не достигнут полной победы в мирных переговорах. Стремясь к миру, мы вернули миллион депортированных немцев из Казахской ССР. Эти возвращенцы были отправлены в Калининград и районы Силезии, которые ранее находились под управлением Польши. Земли находятся в совместном управлении между нами и Немцами. Однако после окончания мирных переговоров участились случаи об этнических столкновениях между немцами и поляками в Силезии. Польское правительство выразило свою озабоченность и просит вернуть эту территории в свои состав. Мы должны решить либо оставить территорию у Немцев, либо вернуть её Польше."
 StalinNotes.59.d: "Советский Союз объявил, что снимает Восточногерманскую администрацию в Силезии, заменяя ее польскими официальными лицами для совместного контроля над территорией. Ранее Советские власти подталкивали Польшу уступить эти земли Восточной Германии до выборов, чтобы определить будущее правительство единого Германского государства. Многие Немцы теперь признают, что Советское правительство просто играли в политику и только делали вид, что заботятся о правах и притязаниях Германии. Наше правительство выступит с осуждением продолжающейся этнической чистки Немцев Советским Союзом и его марионетками."
 StalinNotes.58.d: "Советские власти заявили, что земли Силезии, которые они заставили нас уступить Восточной Германии, останутся под Немецким контролем. Они отмечают, что приток немецких репатриантов изменил местную демографию, и возвращение Польского правления потенциально может вызвать серьезный кризис беженцев и борьбу между социалистическими и коммунистическими братьями. Это неутешительное для нас решение, и мы это высказали. Однако Советское правительство настаивали на том, что никаких планов или соображений по поводу передачи земли кому либо нет. Мы ясно дали понять, что в случае такого сценария наше правительство не может гарантировать, что Польский народ сможет это понять. Остается только надеяться, что Советский Союз больше не преподнесут нам сюрпризов."
 StalinNotes.43.d: "Мирная конференция по объединению Германии достигла компромисса относительно границ Германии. В обмен на согласие Германии отказаться от своих претензий на всю границу 1937 года, Германия согласится принять период временного нейтралитета. Соглашение о границе удовлетворяет Советский Союз и Польшу, которые опасались, что Советское правительство или новое объединенное германское правительство будут настаивать на большей территории. Для Запада соглашение о временном нейтралитете открывает возможность прозападного Германского государства в будущем. Германия должна быть строго нейтральной в течение пятнадцати лет, прежде чем ограничения будут сняты. До конференции Советский Союз уступил Восточной Германии часть земель вокруг Калининграда."
 StalinNotes.51.d: "Недавняя инициатива Советского Союза по заключению окончательного мира и объединение Германии провалилась. Это ослабило надежду всей Европы на решение, которое могло бы урегулировать напряженность между Востоком и Западом. Советский лидер Иосиф Сталин начал свою работу с обмена нотами, которые многие воспринимали как щедрые уступки по вопросам, связанным с демократическим правительством и экономическими свободами в нейтральном немецком Государстве. Неясно, что привело к провалу этой инициативы, В свою очередь Советский Союз обвиняют Запад в саботаже этой инициативы, необоснованными требованиями которые были не возможны к исполнению . Соединенные Штаты утверждали, что Советское предложение было направлено исключительно на пропаганду и идеологический подрыв как Союзных государств, так и Западной Германии. Несмотря на это, многие Немцы остаются в недоумении, не упустили ли они в ходе этих событий золотую возможность для объединения."
 StalinNotes.50.d: "Недавнее соглашение об объединении с Германией, похоже, провалилось. Правительство Западной Германии отказалось принять условия договора и не будет встречаться с восточногерманскими официальными лицами, которых они не признают. После этого заявления Соединенные Штаты вместе с Великобританией и Францией объявили, что не будут принуждать Западную Германию соблюдать условия соглашения. Это фактически положило конец Советским мирным усилиям об объединении двух Германии. Советские власти выразили свое возмущение и обвинили Запад в милитаризации Европы. На международном уровне Советский Союз в основном хвалят за то, что они заняли твёрдую позицию по этому вопросу, в то время как Соединенные Штаты сталкиваются с постоянной критикой за срыв переговоров."
 StalinNotes.54.d: "Большое количество немецких иммигрантов, привезенных в Восточную Германию, расселялось вокруг Калининграда. Однако эти немцы всё чаще в Восточной Германии эмигрируют в районы Силезии, которые находятся под Польским влиянием. Польские власти выразили обеспокоенность. Наши собственные чиновники опасаются, что эти немецкие иммигранты могут лишиться права голоса, если они продолжат обживаться в этом районе. Чтобы обеспечить подсчет голосов и подорвать пропаганду Запада о том, что мы стремимся тем или иным образом наказать Германию, мы уступим Калининград и заставим Польшу уступить эти районы Силезии в пользу Восточной Германии. Польские чиновники и власти в этом районе будут заменены Восточными Немцами. Хотя Польское правительство не будет в восторге от наших действий, мы уверены, что они не поднимут шума до тех пор, пока территория не будет возвращена Германии. Это даст нашим сторонникам в Германии серьезный козырь перед голосованием."
 StalinNotes.52.d: "Советский Союз подтвердил сообщения о массовом притоке этнических немцев, возвращающихся в Восточную Германию. Советские власти добавили, что они уступают Калининград, а Польша уступит часть Силезии Восточной Германии, чтобы принять возвращенцев. Это знаменует собой серьезный поворот Советского правительства, которые долгое время требовали полного выполнения Потсдамского соглашения. Хотя Соединенные Штаты осуждают эту акцию и называют его политическим театром, предназначенный для манипулирования опросами, многие Немцы празднуют, узнав эту новость. Наше собственное правительство может только отметить, что все наши территориальные притязания не были решены, но даже эта уступка широко приветствуется. Многие аналитики теперь считают, что политические воззрением Немцев сдвинутся в сторону социалистических и коммунистических партий."