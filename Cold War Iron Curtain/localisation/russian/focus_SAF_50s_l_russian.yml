l_english:
 saf_news.8.t: "Международная конфедерация свободных профсоюзов (МКСП) недавно призвала к санкциям против Южной Африки за ее политику апартеида. Профсоюзам-членам предлагается оказать давление на свои национальные и местные предприятия, чтобы они отказались от заказов из Южной Африки. МКСП изначально была основана профсоюзами из некоммунистических государств, которые считали, что другие международные союзы находятся под коммунистическим контролем. В последние годы в ее состав вошли профсоюзы из новых независимых государств Азии и Африки. Говорят, что именно эти профсоюзы возглавляют эту попытку наказать Южную Африку. Утверждается, что правительство Южной Африки внимательно следит за ситуацией, поскольку многие иностранные поставщики могут быть вынуждены сократить заказы, чтобы избежать конфликта с рабочими."
