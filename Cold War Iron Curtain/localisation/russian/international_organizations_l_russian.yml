 organization_of_african_unity_cat: "Организация африканского единства"
 leave_the_oau: "Выйти из Организации африканского единства"
 idea_OAU_member: "Член Организации Африканского Единства"
 oau.1.d: "Делегаты из Адиса Абебы уведомили нас, что мы соответствуем требованиям для вступления в Организацию африканского единства. Они прислали нам ряд бумаг для подписания, утверждая, что эта организация принесет совместное процветание и единство между всеми африканскими народами. Как мы ответим?"
  
