 #1950s 
 nga50.1.d: "В ответ на возросшие требования регионального представительства и растущее движение за независимость в Нигерии корона учредила конституционный совет в Нигерии. Поскольку различные предложения не пользуются популярностью, в будущем, скорее всего, будет выбрано создание совета министров и федерального собрания."
 nga50.2.d: "С момента объединения Северной и Южной Нигерии в единую колонию предприимчивые игбо мигрировали на север в поисках больших возможностей трудоустройства. Однако, как и многие состоятельные мигранты, они испытывают недовольство со стороны своих коренных соседей. Это стало очевидным на прошлой неделе во время серии беспорядков в северном городе Кадо, где северянами были разрушены большие участки предприятий и домов игбо."
 nga50.3.d: "Продуктивное время Джона Стюарта Макферсона в качестве колониального губернатора подошло к концу, поскольку он уходит в отставку после долгой карьеры в колониальных и административных делах по всей империи, и мы приветствуем нашего нового губернатора, Джеймса Уилсона Робертсона. Макферсон руководил многочисленными реформами и поправками к конституции и продолжал укреплять связи между колониальным режимом и более автократической, лояльной знатью и местными лидерами Севера. В то время как северяне и йоруба могли бы вежливо жестом отказаться от Макферсона, многие игбо не почувствовали никакого внимания, которое он привлек к их региону, и увидят в нем еще одного колониального губернатора без происшествий. Однако среди каждой группы могло быть некоторое умеренное признание попыток Макферсона африканизировать государственные службы колонии и позволить политическим партиям коренных народов войти в колониальную ассамблею."
 nga50.4.d: "Совместное предприятие British Petroleum и Royal Dutch Shell Company приступило к крупномасштабной разведке ресурсов в колонии и протекторате Нигерия. Когда опрос охватит все основные регионы Нигерии, мы увидим, какую экономическую ценность имеет Нигерия помимо своей нынешней сельскохозяйственной роли в выращивании товарных культур, таких как хлопок и каучук». Национальные советы Нигерии и Камеруна (NCNC), в основном игбо, выступили против этого, утверждая, что они могут легко уничтожить новое нигерийское государство."
 nga50.5.d: ""
 nga50.6.d: "В этом году крупную политическую партию основал Обафеми Аволово, настоящий журналист, который несколько лет назад основал собственную газету. Партия выступает за в целом социал-демократическую политику, аналогичную лейбористской партии в Соединенном Королевстве, однако многие считают ее просто первой партией, отстаивающей интересы йоруба."
 nga50.7.d: "С момента объединения нигерийских северных и южных колоний британцы отдавали предпочтение более авторитарно организованному северу, чтобы усилить косвенное правление Империи в регионе. Пытаясь получить больший контроль над ресурсами нации, Соединенное Королевство продолжало использовать этот подход до 1950-х годов, когда оно оказалось не в состоянии провести правильную конституционную реформу, чтобы сдержать этническую напряженность в Нигерии. Теперь это неизбежно привело к моменту, когда NCNC Ннамди Азикиве возглавляет независимую республику игбо, в то время как одновременно на западе Группа действий Обафеми Аволово провозгласила независимое государство йорубан, известное как Республика Одудува."
 nga50.8.d: "Покончив с мятежами нации, мы пришли к приемлемому решению в недавних соглашениях, чтобы разделить Нигерию на свободную конфедерацию между северной мусульманской половиной и южной христианской и искусной верой. И Север, и Юг находят это решение подходящим, поскольку оно, по сути, создаст де-факто отдельные нигерийские нации, которые по-прежнему будут представлены вместе в дипломатических и торговых соглашениях по всему миру. Еще одно условие соглашения заключается в том, что обе половины Нигерии могут провозгласить независимость в любое время (теоретически) посредством публичного референдума."
 nga50.9.d: ""
 nga50.10.d: "Великобритания, движимая своей глобальной военной стратегией времен холодной войны, хочет защитить свои долгосрочные интересы в странах Африки к югу от Сахары. Исламский северный истеблишмент, который благосклонно относится к британцам, независимо от этого, заинтересован в этом соглашении, поскольку их точка зрения на холодную войну по своей сути антикоммунистическая. Однако из-за того, что в военном штабе Нигерии доминируют англичане, непредвиденным последствием этого, вероятно, станет более длительный процесс африканизации вооруженных сил после обретения независимости."
 nga50.11.d: "После создания Конституции Макферсона Нигерия как колония состоит из трех административных зон (Северной, Восточной и Западной), каждая из которых возглавляется премьер-министром, который избирается региональной ассамблеей для каждой зоны. Ннамди Азикиве в своей политической карьере руководил NCNC через жестокую борьбу с доминирующей группой действий йоруба Обафеми Аволово за контроль над Западным регионом. Западный регион, являющийся столицей страны, был тем, за что боролся Зик, поскольку он хочет преодолеть этнические границы со своей панафриканской партией, хотя это закончилось тщетно, поскольку большинство йоруба в западном регионе постоянно голосовало по этническому признаку. Однако эта неудача привела к его возвращению в восточный регион, где преобладают игбо, где большинство NCNC с радостью внесло предложения принять его и избрать премьер-министром региона."
 nga50.12.d: "Сэр Ахмаду Белло, дворянин Сокото, снова вызвал ажиотаж спорным интервью на BBC, в котором он защищал политику «нотернизации», согласно которой северяне получают преимущество при приеме на работу в первую очередь, а не игбо. Его риторика была основана на чрезмерно доминирующем и амбициозном характере игбо и на том, что для ограничения их влияния необходимо удерживать заслуживающих доверия северян на важных должностях и в бюрократии в целом. Далее он заявил, что Нигерия еще далеко не готова к обретению независимости и что он может предвидеть существование колониализма в Нигерии еще двадцать лет, если это будет необходимо."
 nga50.13.d: "Чинуа Ачебе, игбо с юго-востока страны и выпускник Ибаданского университета, только что опубликовал через британскую компанию "Things Fall Apart" свою книгу, которая, хотя и медленно продвигалась в Нигерии, распространилась по всему миру, и критики восприняли ее очень благосклонно."
 nga50.14.d: "Нигерийский писатель Чинуа Ачебе в июне этого года опубликовал первую в мире книгу-бестселлер африканца «Вещи разваливаются», в которой рассказывается история игбо по имени Оконкво, который живет в Нигерии на заре колониализма в регионе. Книга представляет собой попытку убрать африканскую литературу с исключительно колониальной точки зрения, создав историю, основанную на устных традициях и традиционных африканских методах рассказывания историй, таким образом, чтобы это навсегда изменило литературу в Африке. Вещи разваливаются, находясь на пути к тому, чтобы зарекомендовать себя как самая известная книга в истории Африки, в то время как влияние книги в Нигерии еще не проявилось."
