 nga.tt.6: "Продолжение §RСеверного господства§! создаст нестабильность в нашей колонии"
 nga.tt.7: "Мы сохраним нашу действующую конституцию §RБез поправок§!"
 nga.tt.8: "§YЭтот фокус будет автоматически завершен позже событием, разблокировав этот путь дерева фокусов."
 nga.tt.9: "§YКолония и протекторат Нигерии§! будет называться §YНигерийская федерация"
