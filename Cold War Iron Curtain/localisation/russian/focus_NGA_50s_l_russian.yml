 #ideas 
 NGA_north_south_tension_low: "Низкая напряженность между Севером и Югом"
 NGA_north_south_tension_low_desc: "С момента объединения колонии Северной Нигерии с колониями юго-востока и запада в Нигерии возникла глубокая этническая и религиозная напряженность. Поскольку северяне-мусульмане исторически благоволили британцам за их авторитарное и лояльное отношение, южные народы чувствуют себя крайне бесправными. Если колониальная администрация не будет тщательно регулировать эту напряженность, мы можем столкнуться с полномасштабной этнической гражданской войной."
 NGA_north_south_tension_moderate: "Умеренная напряженность между Севером и Югом"
 NGA_north_south_tension_moderate_desc: "С момента объединения колонии Северной Нигерии с колониями юго-востока и запада в Нигерии возникла глубокая этническая и религиозная напряженность. Поскольку северяне-мусульмане исторически благоволили британцам за их авторитарное и лояльное отношение, южные народы чувствуют себя крайне бесправными. Если колониальная администрация не будет тщательно регулировать эту напряженность, мы можем столкнуться с полномасштабной этнической гражданской войной."
