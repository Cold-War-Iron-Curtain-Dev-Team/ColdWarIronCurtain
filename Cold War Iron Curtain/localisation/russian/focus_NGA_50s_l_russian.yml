 NGA_has_north_cameroon: "Нигерия была передана Северному Камеруну"
  
  #50s focus tree 
 NGA_1950_ibadan_constitutional_conference: "Конституционная конференция Ибадана"
 NGA_1950_ibadan_constitutional_conference_desc: "Из-за напряженности между доминирующей автократической северной аристократией и юго-восточными мигрантами игбо нам снова нужна конституционная конференция, основанная на колониальных мерах, необходимых для борьбы с этими беспорядками"
 NGA_1950_create_the_macpherson_constitution: "Создать Конституцию Макферсона"
 NGA_1950_create_the_macpherson_constitution_desc: "Конституция Макферсона является последней итерацией колониального закона в Нигерии"
 NGA_1950_create_a_council_of_ministers: "Создать Совет министров"
 NGA_1950_create_a_council_of_ministers_desc: "Создание совета министров позволит осуществлять более скоординированную колониальную администрацию"
 NGA_1950_create_a_federal_assembly: "Создать Федеральное собрание"
 NGA_1950_create_a_federal_assembly_desc: "В федеральном собрании большее представительство будет дано различным политическим фракциям; предоставляя более густонаселенное содержание"
 NGA_1950_africanization_of_civil_services: "Африканизация гражданских служб"
 NGA_1950_africanization_of_civil_services_desc: "Поместив коренных нигерийцев на общие роли в нашей бюрократии, мы африканизируем гражданские службы и сделаем колонию более подготовленной к независимости"
 NGA_1950_grant_northern_regional_autonomy: "Предоставление Северной региональной автономии"
 NGA_1950_grant_northern_regional_autonomy_desc: "Предоставив региональную автономию северу, мы позволим им проводить политику приоритета северянина"
 NGA_1950_grant_the_igbo_regional_autonomy: "Предоставить региональную автономию игбо"
 NGA_1950_grant_the_igbo_regional_autonomy_desc: "Мы разрешим региональную автономию в юго-восточном регионе игбо, предоставив больше власти местным лидерам"
 NGA_1950_maintain_the_richards_constitution: "Сохранить Конституцию Ричардса"
 NGA_1950_maintain_the_richards_constitution_desc: "Мы просто сохраним существующую колониальную конституцию Нигерии"
 NGA_1950_build_an_electrical_grid_in_kano: "Построить электрическую сеть в Кано"
 NGA_1950_build_an_electrical_grid_in_kano_desc: "В Кано нет крупной электросети, эту проблему обязательно нужно решить"
 NGA_1950_develop_urban_infrastructure: "Развивать городскую инфраструктуру"
 NGA_1950_develop_urban_infrastructure_desc: "Нам нужно развивать городскую инфраструктуру"
 NGA_1950_centralize_resource_extraction: "Централизация добычи ресурсов"
 NGA_1950_centralize_resource_extraction_desc: "Поскольку население больше соответствует автократическому северу, мы должны быть в состоянии централизовать добычу ресурсов"
 NGA_1950_invite_foreign_companies_to_kaduna: "Приглашение иностранных компаний в Кадуну"
 NGA_1950_invite_foreign_companies_to_kaduna_desc: "Для благосклонности северной аристократии, наиболее лояльной к колониальной администрации, мы будем приглашать в Кадуну иностранные компании"
 NGA_1950_invite_foreign_companies_to_kano: "Приглашение иностранных компаний в Кано"
 NGA_1950_invite_foreign_companies_to_kano_desc: "В угоду северной аристократии, наиболее лояльной к колониальной администрации, мы будем приглашать в Кано иностранные компании"
 NGA_1950_kano_riots: "Беспорядки в Кано"
 NGA_1950_kano_riots_desc: "Северяне, которые чувствуют себя лишенными гражданских прав из-за чрезмерно успешных южан, начали хулиганить и уничтожать собственность игбо в городе Кано; это привело к неконтролируемому бунту"
 NGA_1950_lyttleton_constitution: "Конституция Литтлтона"
 NGA_1950_lyttleton_constitution_desc: "Конституция Литтлтона станет последним способом справиться с эволюцией колониальных требований в Нигерии и позволит создать федеральную колонию"
 NGA_1950_connect_the_north_and_the_south: "Соединить север и юг"
 NGA_1950_connect_the_north_and_the_south_desc: "Нам необходимо создать сеть, соединяющую север и юг Нигерии, создавая более взаимное сотрудничество"
 NGA_1950_create_regional_representation: "Создать региональное представительство"
 NGA_1950_create_regional_representation_desc: "Обеспечение регионального представительства по всей колонии избавляет от чувства бесправия, характерного для этнических эмигрантов"
 NGA_1950_treat_northern_drought: "Лечение северной засухи"
 NGA_1950_treat_northern_drought_desc: "Нам необходимо обратить внимание на крупномасштабную засуху в северных регионах из-за чрезмерного земледелия"
 NGA_1950_africanize_the_frontier_forces: "Африканизация пограничных войск"
 NGA_1950_africanize_the_frontier_forces_desc: "Нам нужно сделать коренную политику в первую очередь для местных колониальных вооруженных сил"
 NGA_1950_robertson_constitution: "Конституция Робертсона"
 NGA_1950_robertson_constitution_desc: "Режим губернатора Робертсона установит новую, более централизованную конституцию, которая принесет пользу Британской империи в последние годы существования этой колонии"
 NGA_1950_centralize_rubber_plantations: "Централизация каучуковых плантаций"
 NGA_1950_centralize_rubber_plantations_desc: "В южных частях колонии есть много каучуковых плантаций, которые в настоящее время разбросаны и неорганизованы, что приводит к неэффективности. Централизация этих секторов привела бы к гораздо большей прибыли для колониального режима"
 NGA_1950_centralize_cotton_plantations: "Централизация хлопковых плантаций"
 NGA_1950_centralize_cotton_plantations_desc: "В северных частях колонии есть много плантаций хлопка, которые в настоящее время разбросаны и неорганизованы, что приводит к неэффективности. Централизация этих секторов привела бы к гораздо большей прибыли для колониального режима"
 NGA_1950_colonial_nationalization_of_the_south: "Колониальная национализация Юга"
 NGA_1950_colonial_nationalization_of_the_south_desc: "Колониальная администрация Нигерии считает, что может более эффективно управлять своими южными ресурсами, такими как каучук и железо, без прямого управления короной"
 NGA_1950_integrate_colonial_guard: "Интеграция колониальной гвардии"
 NGA_1950_integrate_colonial_guard_desc: "Для продвижения местных вооруженных сил было бы гораздо более продуктивным, если бы колониальное правительство Нигерии интегрировало местных жителей в роли майоров и офицеров"
 NGA_1950_move_capital_to_kaduna: "Перенести столицу в Кано"
 NGA_1950_move_capital_to_kaduna_desc: "Поскольку на Севере остается большая часть внимания колониальной администрации, для нас имело бы смысл переместить туда центр нашего колониального управления"
 NGA_1950_Shell-BP_expeditions: "Экспедиции Shell-ВР"
 NGA_1950_Shell-BP_expeditions_desc: "В этом году British Petroleum и Royal Dutch Shell планируют начать разведку многочисленных ресурсов нигерийской колонии"
 NGA_1950_colonial_nationalization_of_the_north: "Колониальная национализация Севера"
 NGA_1950_colonial_nationalization_of_the_north_desc: "Колониальная администрация Нигерии считает, что она может более эффективно управлять своими северными ресурсами, такими как хлопок и арахис, без прямого управления короной"
 NGA_1950_expand_coal_mining_in_the_niger_river_valley: "Расширение добычи угля в долине реки Нигер"
 NGA_1950_expand_coal_mining_in_the_niger_river_valley_desc: "Богатства долины реки Нигер можно легко увеличить за счет их эксплуатации"
 NGA_1950_expand_mineral_extraction: "Расширить добычу полезных ископаемых"
 NGA_1950_expand_mineral_extraction_desc: "Добыча полезных ископаемых, в первую очередь на севере и юго-востоке, несколько прибыльна, но их добыча может быть легко расширена в рамках ее операций"
 NGA_1950_expand_steel_mining_in_Enugu: "Расширение добычи стали в Энугу"
 NGA_1950_expand_steel_mining_in_Enugu_desc: "Район, окружающий город Энугу, заполнен месторождениями железа, которые при некоторой обработке можно легко превратить в ценный строительный материал"
 NGA_1950_expand_tin_mining_in_jos: "Расширение добычи олова в Джосе"
 NGA_1950_expand_tin_mining_in_jos_desc: "Умеренное количество запасов олова, хранящихся вокруг города Джос, было бы полезно с точки зрения торговли и занятости местного населения, если бы его хорошо эксплуатировали."
 NGA_1950_small_scale_kerosene_production: "Мелкомасштабное производство керосина"
 NGA_1950_small_scale_kerosene_production_desc: "Хотя крупные месторождения нефти еще не обнаружены, у колониального правительства есть необходимая инфраструктура в этом районе, чтобы начать мелкосерийное производство керосина для использования в отоплении и приготовлении пищи"
 NGA_1950_expand_coal_mining_in_enugu: "Расширение добычи угля в Энугу"
 NGA_1950_expand_coal_mining_in_enugu_desc: "Добыча угля в Энугу и его окрестностях уже давно является источником занятости для региона. Расширение этого приведет к стабильности и поможет в развитии сообщества"
 NGA_1950_founding_of_shell_bp_PDCNL: "Основание PDCNL Shell-BP"
 NGA_1950_founding_of_shell_bp_PDCNL_desc: "Учитывая предполагаемые возможности добычи нефти в будущем Нигерии, Shell-BP рассматривает возможность создания нового филиала, находящегося в совместном владении, известного как Petroleum Department of Colonial Nigeria Limited."
 NGA_1950_1956_petroleum_discovery: "1956 Нефтяное открытие"
 NGA_1950_1956_petroleum_discovery_desc: "Обширные исследования по всей колонии, наконец, оказались плодотворными, поскольку теперь на юго-востоке страны были обнаружены большие залежи сырой нефти"
 NGA_1950_begin_extraction_in_port_harcourt: "Начать добычу в Порт-Харкорте"
 NGA_1950_begin_extraction_in_port_harcourt_desc: "PDCNL рассматривает возможность начала крупной добычи нефти в Порт-Харкорте"
 NGA_1950_begin_extraction_in_benin_city: "Начать добычу в штате Дельта"
 NGA_1950_begin_extraction_in_benin_city_desc: "PDCNL рассматривает возможность начала крупной добычи нефти в штате Дельта"
 NGA_1950_begin_extraction_in_aba: "Начать добычу в Абе"
 NGA_1950_begin_extraction_in_aba_desc: "PDCNL рассматривает возможность начала крупной добычи нефти в Абе"
 NGA_1950_establish_bitumen_processing: "Наладить переработку битума"
 NGA_1950_establish_bitumen_processing_desc: "Битум, побочный продукт производства дизельного топлива и бензина, имеет множество применений, например, в производстве асфальта. Пока местная нигерийская инфраструктура не пользуется спросом на такой материал, его экспорт может быть выгоден колонии"
 NGA_1950_begin_exporting_petroleum_products: "Начать экспорт нефтепродуктов"
 NGA_1950_begin_exporting_petroleum_products_desc: "Различные нефтепродукты, такие как смазочные материалы, могут быть полезны для стимулирования новой серии экспорта в нигерийской колонии"
 NGA_1950_expand_nigerian_domestic_exports: "Расширить нигерийский внутренний экспорт"
 NGA_1950_expand_nigerian_domestic_exports_desc: "Колония и протекторат Нигерия в прошлом практически не занимались независимым экспортом, за исключением поставок в Соединенное Королевство или колонии для дальнейшей переработки. Если бы колония могла сосредоточиться на сборе урожая и переработке своих основных культур и полезных ископаемых, она могла бы быть намного более эффективной и подготовить нацию к независимой экономике"
 NGA_1950_build_a_peanut_plant: "Построить арахисовый завод"
 NGA_1950_build_a_peanut_plant_desc: "Арахис выращивают в северных частях Нигерии уже несколько десятилетий, и он показал очень правильное использование пахотных земель на реке Нигер"
 NGA_1950_expand_cotton_farming_in_the_north: "Расширение хлопководства на севере"
 NGA_1950_expand_cotton_farming_in_the_north_desc: "Выращивание хлопка в северных регионах Нигерии, хотя и не такое обширное, как в других частях Британской империи, все же может быть весьма прибыльным, если мы расширим эту практику."
 NGA_1950_expand_peanut_farming_in_the_north: "Расширение выращивания арахиса на севере"
 NGA_1950_expand_peanut_farming_in_the_north_desc: "Арахис выращивают в северных частях Нигерии уже несколько десятилетий, и он показал очень правильное использование пахотных земель на реке Нигер"
 NGA_1950_reinvigorate_northern_tin_mining: "Возрождение северной добычи олова"
 NGA_1950_reinvigorate_northern_tin_mining_desc: "Умеренные объемы добычи олова в северной Нигерии всегда были важной практикой на протяжении тысячелетий, но сегодня это хороший источник местных доходов и развития"
 NGA_1950_dawn_of_nigerian_industry: "Рассвет нигерийской промышленности"
 NGA_1950_dawn_of_nigerian_industry_desc: "В этом десятилетии мы видим первую основу того, что однажды станет процветающей индустриальной системой Нигерии"
 NGA_1950_build_a_cocoa_plant_in_Ibadan: "Построить завод по производству какао в Ибадане"
 NGA_1950_build_a_cocoa_plant_in_Ibadan_desc: "Какао, орех, используемый для производства шоколада, в настоящее время выращивается в небольших количествах в Нигерии в качестве товарной культуры. Если расширить этот сектор сельского хозяйства, это могло бы привести к значительно большему количеству прибыли"
 NGA_1950_build_a_palm_oil_plant_in_benin_city: "Построить завод по производству пальмового масла в Бенин-Сити"
 NGA_1950_build_a_palm_oil_plant_in_benin_city_desc: "Пальмовое масло, возможно, является самой ценной товарной культурой, выращиваемой в Нигерии в настоящее время. Этот ценный материал, становящийся все более и более популярным в производстве кухонных принадлежностей, можно было бы выращивать в больших количествах, если бы мы расчищали больше лесов и кустарников"
 NGA_1950_build_a_palm_oil_plant_in_aba: "Построить завод по производству пальмового масла в Абе"
 NGA_1950_build_a_palm_oil_plant_in_aba_desc: "Пальмовое масло, возможно, является самой ценной товарной культурой, выращиваемой в Нигерии в настоящее время. Этот ценный материал, становящийся все более и более популярным в производстве кухонных принадлежностей, можно было бы выращивать в больших количествах, если бы мы расчищали больше лесов и кустарников"
 NGA_1950_build_a_cocoa_plant_in_akure: "Построить завод по производству какао в Акуре"
 NGA_1950_build_a_cocoa_plant_in_akure_desc: "Какао, орех, используемый для производства шоколада, в настоящее время выращивается в небольших количествах в Нигерии в качестве товарной культуры. Если расширить этот сектор сельского хозяйства, это могло бы привести к значительно большему количеству прибыли"
 NGA_1950_expand_rubber_production_in_biafra: "Расширение производства каучука в Биафре"
 NGA_1950_expand_rubber_production_in_biafra_desc: "Каучуковые деревья уже давно выращивают на юге Нигерии, и их расширение было бы очень прибыльным"
 NGA_1950_road_to_independence: "Дорога к Независимости"
 NGA_1950_road_to_independence_desc: "После мировой войны колониализм явно изменился. В ближайшем будущем независимая Нигерия вполне может смело идти вперед"
 NGA_1950_initiate_religious_autonomy: "Ввести религиозную автономию"
 NGA_1950_initiate_religious_autonomy_desc: "Религиозные различия между христианским югом и мусульманским севером всегда были проблемой в колонии. Предоставляя религиозную автономию правовой системе колонии, мы можем обеспечить стабильность"
 NGA_1950_africanize_the_bureaucracy: "Африканизировать бюрократию"
 NGA_1950_africanize_the_bureaucracy_desc: "Поощряя коренные народы в колониальной бюрократии, мы можем все больше и больше готовить нацию к независимости"
 NGA_1950_africanize_the_armed_forces: "Африканизировать вооруженные силы"
 NGA_1950_africanize_the_armed_forces_desc: "В настоящее время в нашей колониальной армии есть лишь несколько высокопоставленных африканских офицеров. Расширив доступ к военному образованию, мы могли бы увеличить процент нигерийцев на высоких должностях в вооруженных силах"
 NGA_1950_africanize_general_assembly: "Африканизировать Генеральную Ассамблею"
 NGA_1950_africanize_general_assembly_desc: "Открытое допущение африканского большинства к участию в генеральной ассамблее, несомненно, приведет к замене политических партий британской/колониальной повестки дня в системе"
 NGA_1950_segregate_state_institutions: "Разделение государственных учреждений"
 NGA_1950_segregate_state_institutions_desc: "Разделив северян с йорубанами и в первую очередь игбо, мы обеспечим более контролируемую этническую напряженность"
 NGA_1950_fight_the_rebellions: "Борьба с восстаниями"
 NGA_1950_fight_the_rebellions_desc: "Нигерия сталкивается с массовыми мятежами и региональным этническим конфликтом из-за этнической напряженности в колонии и неспособности губернаторов справиться с ней"
 NGA_1950_a_unitary_nigeria: "Унитарная Нигерия"
 NGA_1950_a_unitary_nigeria_desc: "Вместо ранее более популярных федеральных систем, предложенных для Нигерии, благодаря нашему военному превосходству мы можем обеспечить унитарное государство с прямым управлением"
 NGA_1950_centralize_the_north: "Централизация Севера"
 NGA_1950_centralize_the_north_desc: "Централизация различных институтов и бюрократии в северных частях Нигерии, безусловно, является следующим шагом в создании унитарного государства с прямым управлением"
 NGA_1950_blend_sharia_law_and_colonial_law: "Смешать шариатские и колониальные законы"
 NGA_1950_blend_sharia_law_and_colonial_law_desc: "Учитывая природу более авторитарного севера, являющегося лучшей группой для создания национального единства, мы также будем поддерживать их религиозные и культурные обычаи"
 NGA_1950_create_a_unitary_civil_service_program: "Создать унитарную программу государственной службы"
 NGA_1950_create_a_unitary_civil_service_program_desc: "Предыдущая система децентрализованной государственной службы с трайбализмом и этническим разделением явно менее эффективна. Вместо этого мы должны попытаться создать неоднородную унитарную систему государственной службы"
 NGA_1950_the_kano_accords: "Соглашения Кано"
 NGA_1950_the_kano_accords_desc: "После полного прекращения всех региональных восстаний мы можем попытаться найти долгосрочное решение этнических конфликтов в Нигерии"
 NGA_1950_binational_state: "Двунациональное государство"
 NGA_1950_binational_state_desc: "Мы должны попытаться создать двунациональное государство между южной христианской Нигерией и мусульманской северной Нигерией"
 NGA_1950_partition_nigeria: "Раздел Нигерии"
 NGA_1950_partition_nigeria_desc: "Здесь, в конце эпохи колониализма, разумно предположить, что единственным разумным способом решения этнических конфликтов в Нигерии является полное разделение нации"
 NGA_1950_nsobu_adighi: "Нсобу Адиги"
 NGA_1950_nsobu_adighi_desc: "Ради будущего нигерийского народа мы наконец-то можем сосредоточиться на развитии и модернизации страны, в которой уже решены многие прежние этнические конфликты"
 NGA_1950_northern_peoples_congress: "Северный народный конгресс"
 NGA_1950_northern_peoples_congress_desc: "Северный народный конгресс - это партия, поддерживающая народ хауса, основанная на консервативных мусульманских взглядах, а также партия, которая поддерживает различные политики, типичные для левого национализма"
 NGA_1950_emphasize_hausa_culture: "Сделать акцент на культуре хауса"
 NGA_1950_emphasize_hausa_culture_desc: "Разумно подчеркнуть трудолюбивую и интеллигентную культуру народа хауса. Ремесленники, рабочие и региональная исламская знать разделяют это прекрасное кушитское наследие"
 NGA_1950_subsidize_large_families: "Субсидировать большие семьи"
 NGA_1950_subsidize_large_families_desc: "Большие семьи являются основным достижением сообщества хауса и, безусловно, нуждаются в поддержке"
 NGA_1950_bring_water_to_sokoto: "Принести воду в Сокото"
 NGA_1950_bring_water_to_sokoto_desc: "Сокото в Сахеле регулярно сталкивается с засухой, и люди часто страдают от болезней, передающихся через воду. Важнейшим приоритетом должно стать обеспечение водопровода и чистой воды в этом регионе"
 NGA_1950_divert_resources_to_kano: "Перенаправить ресурсы в Кано"
 NGA_1950_divert_resources_to_kano_desc: "Кано — фантастический северный город, который можно использовать для переработки сырья. Было бы очень практично направить в этот город больше сырья"
 NGA_1950_localize_tin_processing: "Локализация обработки олова"
 NGA_1950_localize_tin_processing_desc: "Если бы мы перерабатывали сырое олово в тех районах на севере, где оно добывается, это было бы и эффективнее, и лучше для населения"
 NGA_1950_Nigerian_Democratic_Party: "Нигерийская демократическая партия"
 NGA_1950_Nigerian_Democratic_Party_desc: "Нигерийская демократическая партия — старейшая современная политическая партия Нигерии. Хотя в какой-то момент она была ведущей партией в 30-е годы, ее актуальность резко снизилась. Сосредоточив внимание на деловых интересах и поощряя политическое участие среднего нигерийца, эта партия будет одобрена небольшим меньшинством самодельных нигерийских бизнесменов, которые в основном являются выходцами из йоруба и игбо"
 NGA_1950_expand_the_lagos_grid: "Расширить сеть Лагоса"
 NGA_1950_expand_the_lagos_grid_desc: "Столица Лагоса почти полностью лишена чего-либо, напоминающего современную электрическую сеть, и если мы хотим это изменить, это потребует значительного распределения ресурсов"
 NGA_1950_bring_foreign_investment: "Привлечь иностранные инвестиции"
 NGA_1950_bring_foreign_investment_desc: "Сторона считает, что посредством различных соглашений и стимулов мы можем увеличить объем иностранных инвестиций в течение следующих пяти лет"
 NGA_1950_encourage_local_entrepreneurship: "Поощрение местного предпринимательства"
 NGA_1950_encourage_local_entrepreneurship_desc: "В культуре игбо на унаследованное богатство смотрят свысока, и ожидается, что местные лидеры утвердятся в течение своей собственной жизни. Эта вера в 20-м веке привела к появлению большого количества успешных бизнесменов игбоского происхождения. Принимая эту веру и развивая ее, мы, в свою очередь, можем поощрять больше предпринимательства коренных народов"
 NGA_1950_encourage_businesses_in_lagos: "Поощрение бизнеса в Лагосе"
 NGA_1950_encourage_businesses_in_lagos_desc: "Благодаря изменениям в законодательстве о зонировании и налогах мы можем стимулировать как местный, так и иностранный бизнес в городе Лагос."
 NGA_1950_advocate_for_intercolonial_trade: "Защита межколониальной торговли"
 NGA_1950_advocate_for_intercolonial_trade_desc: "Если наши делегации представят убедительные доводы в пользу своей следующей встречи с представителями империи на материке, мы, возможно, сможем убедить их поощрять межколониальную торговлю в британских западноафриканских владениях"
 NGA_1950_national_council_for_nigeria_and_the_cameroons: "Национальный совет Нигерии и Камеруна"
 NGA_1950_national_council_for_nigeria_and_the_cameroons_desc: "TНациональный совет Нигерии и Камеруна представляет собой политическую партию, состоящую преимущественно из игбо, возглавляемую доктором Ннамди Азикиве, которая выступает за национальное единство и организованное движение за независимость"
 NGA_1950_oppose_right_to_succession: "Выступить против права на успех"
 NGA_1950_oppose_right_to_succession_desc: "Из-за раскольнического характера регионов Нигерии и их политических разногласий, основанных на этническом признаке, прозвучал большой призыв к тому, чтобы право на успех было передано в руки каждого федерального штата. Удивительно, но Национальный совет Нигерии и Камеруна, состоящий в основном из игбо (NCNC), выступил против этого, заявив, что он может легко разрушить любое новое нигерийское государство"
 NGA_1950_expand_eastern_iron_forges: "Расширить Восточные железные кузницы"
 NGA_1950_expand_eastern_iron_forges_desc: "Железные кузницы на востоке в настоящее время находятся на небольшом локальном уровне, если бы мы привезли лучшее оборудование, чтобы эти кузницы можно было использовать в промышленных масштабах"
 NGA_1950_emphasize_igbo_culture: "Делать акцент на культуре игбо"
 NGA_1950_emphasize_igbo_culture_desc: "В процветающей Нигерии великая предпринимательская культура игбо была бы высоко оценена по всей стране"
 NGA_1950_create_vocational_schools_in_benin_city: "Создание профессионально-технических училищ в Бенин-Сити"
 NGA_1950_create_vocational_schools_in_benin_city_desc: "Чтобы увеличить занятость в городах, мы можем открыть профессионально-технические училища в Бенин-Сити, в которых будет больше сертифицированных специалистов по торговым навыкам"
 NGA_1950_embrace_social_freedom: "Принять социальную свободу"
 NGA_1950_embrace_social_freedom_desc: "С помощью программ культурного просвещения, брошюр и других средств информирования общественности мы можем побуждать жителей юга Нигерии быть более открытыми для личных свобод, связанных с их собственной культурой"
 NGA_1950_develop_port_harcourt_plumbing: "Разработка водопроводной системы в Порт-Харкорт"
 NGA_1950_develop_port_harcourt_plumbing_desc: "Сантехника в Порт-Харкорте настолько примитивна, что не имеет большого смысла для населения города в целом, и если бы мы расширили ее, это значительно снизило бы количество болезней и отходов"
 NGA_1950_support_trade_unions: "Поддержка профсоюзов"
 NGA_1950_support_trade_unions_desc: "Среди любого городского рабочего класса профсоюзы будут играть важную роль в защите прав и гражданских свобод рабочих. Если мы хотим процветающей Нигерии, где средний рабочий может содержать свою семью и добиваться успеха, NCNC должен иметь возможность выступать за широкое распространение профсоюзов"
 NGA_1950_Action_Group: "Инициативная группа"
 NGA_1950_Action_Group_desc: "Доминирующая группа действий йоруба - это партия, возглавляемая бизнесменом Обафеми Аволово, добившимся успеха самостоятельно, которая до обретения независимости в основном придерживалась социал-демократических принципов и национального единства"
 NGA_1950_encourage_debate_in_parliament: "Поощрение дебатов в парламенте"
 NGA_1950_encourage_debate_in_parliament_desc: "Одной из основных тактик Инициативной группы является поощрение активных и длительных дискуссий в парламенте или национальном собрании. Здесь они считают свои доводы решающими и могут коренным образом изменить мнение представителей и членов других партий"
 NGA_1950_move_away_from_britain: "Отдалиться от Британии"
 NGA_1950_move_away_from_britain_desc: "Если Нигерия хочет быть по-настоящему независимой, необходимо, чтобы мы отодвинули нашу приверженность дальше от Соединенного Королевства."
 NGA_1950_emphasize_yoruba_culture: "Сделать акцент на культуре йоруба"
 NGA_1950_emphasize_yoruba_culture_desc: "Если мы хотим, чтобы Нигерия была богатой в музыкальном и художественном плане, необходимо только подчеркнуть великие культурные традиции и мировоззрение народа йоруба"
 NGA_1950_divert_funding_to_lagos: "Перенаправить финансирование в Лагос"
 NGA_1950_divert_funding_to_lagos_desc: "Лагос, являющийся столицей страны и ее крупнейшим торговым портом, совершенно логично направлять больше средств в этот город, а не на север или юго-восток"
 NGA_1950_western_public_schooling: "Западное государственное школьное образование"
 NGA_1950_western_public_schooling_desc: "Государственное школьное образование на западе страны будет главным приоритетом для Инициативной группы и будет им оставаться до тех пор, пока образование в этой области не будет значительно расширено. До тех пор избиратели партии будут недовольны"
 NGA_1950_encourage_formal_parties: "Стимулировать формальнотсь партий"
 NGA_1950_encourage_formal_parties_desc: "Основные члены Инициативной группы считают, что мы должны поощрять формальные политические партии, а не этнические фракции в национальном собрании"
 NGA_1950_Nigerian_Youth_Movement: "Нигерийское молодежное движение"
 NGA_1950_Nigerian_Youth_Movement_desc: "Нигерийское молодежное движение — старая политическая организация, основанная в 1940-х годах в оппозиции к Демократической партии Нигерии. Членство в нем сокращается, поскольку многие из его предыдущих лидеров ушли, чтобы создать свои собственные уникальные партии, в основном по этническому признаку. Партия выступает за социальную справедливость и правовую реформу, а также за более широкое представительство коренного населения Нигерии против элиты колониального меньшинства"
 NGA_1950_new_zoning_law_in_lagos: "Новые законы о зонировании в Лагосе"
 NGA_1950_new_zoning_law_in_lagos_desc: "Изменение законов о зонировании в Лагосе значительно поощрит иностранные инвестиции и приведет к расширению городских районов в основных частях города"
 NGA_1950_clear_out_eastern_rainforests: "Очистить пространство в восточных тропических лесах"
 NGA_1950_clear_out_eastern_rainforests_desc: "Вырубка юго-восточных тропических лесов Нигерии создаст больше пахотных земель для плантаций каучуковых деревьев или какао."
 NGA_1950_establish_benin_city_electric_grid: "Создание электрической сети Бенин-Сити"
 NGA_1950_establish_benin_city_electric_grid_desc: "В настоящее время в Бенин-Сити нет ничего похожего на какую-либо крупную электрическую сеть, и большая часть освещения исходит от керосиновых ламп. Это должно измениться, если мы хотим перенести город в современный мир"
 NGA_1950_clear_out_western_rainforests: "Очистить пространство в западных тропических лесах"
 NGA_1950_clear_out_western_rainforests_desc: "Вырубка западных тропических лесов Нигерии создаст больше пахотных земель для плантаций каучуковых деревьев или какао"
 NGA_1950_the_royal_west_african_frontier_forces: "Королевские пограничные войска Западной Африки"
 NGA_1950_the_royal_west_african_frontier_forces_desc: "Королевские пограничные войска Западной Африки — подразделение колониальных вооруженных сил Соединенного Королевства. Нигерийское и ганское отделения являются самыми крупными, однако почти все силы сосредоточены исключительно в Нигерии. В учреждении также есть всего несколько известных африканских офицеров, но они только в Нигерии"
 NGA_1950_critique_the_army: "Критиковать армию"
 NGA_1950_critique_the_army_desc: "Армия RWAFF в настоящее время сильно недоучена и не оснащена. Если мы хотим иметь основу для создания нигерийских вооруженных сил позже, нам придется работать над нашей армией в данный момент"
 NGA_1950_import_british_surplus: "Импорт британских излишков"
 NGA_1950_import_british_surplus_desc: "Одно из решений, предложенных для решения проблемы острой нехватки в нашей армии в настоящее время, состоит в том, чтобы импортировать устаревшее избыточное британское оборудование с прошлой войны"
 NGA_1950_improve_reward_system: "Улучшить систему наград"
 NGA_1950_improve_reward_system_desc: "Нынешняя система награждения лентами и трофеями очень бедна и неинтересна, а простой солдат не знает, чем его можно награждать. Создавая церемонии награждения и учреждая больше орденов, лент и медалей, мы будем поощрять солдат к совершению различных действий в своей военной карьере"
 NGA_1950_import_british_machinging_parts: "Импорт британских деталей для механической обработки"
 NGA_1950_import_british_machinging_parts_desc: "Домашнее производство большинства деталей винтовки здесь, в Нигерии, в настоящее время невозможно из-за отсутствия подходящих инструментов для обработки этих металлических частей винтовки, таких как ствольная коробка. Если бы мы получили пресс-формы для этих комплектов механической обработки из Соединенного Королевства, мы могли бы начать этот процесс здесь, в нашей в стране."
 NGA_1950_adopt_british_doctrines: "Принять британские доктрины"
 NGA_1950_adopt_british_doctrines_desc: "Это был бы простой способ резко улучшить боеспособность наших армий, мы можем анализировать и подражать военным доктринам Соединенного Королевства, чтобы наши собственные офицеры могли применять их в будущем"
 NGA_1950_reestablish_artillery_brigade: "Восстановить артиллерийские бригады"
 NGA_1950_reestablish_artillery_brigade_desc: "Артиллерийские бригады в Нигерии были в основном расформированы после последней мировой войны. Если мы хотим создать основу новой армии, то мы должны восстановить этот элемент нашей армии"
 NGA_1950_rehabilitate_old_artillery_equipment: "Восстановить старое артиллерийское оборудование"
 NGA_1950_rehabilitate_old_artillery_equipment_desc: "Военные склады Нигерии заполнены вышедшими из строя сломанными или необслуживаемыми артиллерийскими орудиями. Дешевый способ вывести эти новые артиллерийские бригады из строя — восстановить наше старое оборудование"
 NGA_1950_import_artillery_from_french_west_africa: "Импорт артиллерии из Французской Западной Африки"
 NGA_1950_import_artillery_from_french_west_africa_desc: "Импорт избыточной артиллерии из Французской Западной Африки — это идея, предложенная высокопоставленными колониальными офицерами, хотя она потребует некоторой организации с нашими делегациями"
 NGA_1950_address_direct_fire_gun_shortage: "Устранить нехватку оружия прямой наводки"
 NGA_1950_address_direct_fire_gun_shortage_desc: "В настоящее время на наших складах имеется менее нескольких десятков орудий прямой наводки, необходимых для наших артиллерийских бригад. Нам придется импортировать просроченные излишки из Соединенного Королевства"
 NGA_1950_rehabilitate_auto_cannons: "Восстановить автоматические пушки"
 NGA_1950_rehabilitate_auto_cannons_desc: "Восстановление старых автоматических пушек на наших складах будет простым способом подготовиться к будущей армии с зенитными возможностями"
 NGA_1950_a_frontier_air_force: "Пограничный торговый флот"
 NGA_1950_a_frontier_air_force_desc: "Хотя у нашей страны нет ничего похожего на функционирующий флот, за исключением нескольких устаревших транспортных кораблей, это можно изменить с помощью организационных изменений в системе и некоторого сотрудничества с британцами"
 NGA_1950_expand_training_programs: "Расширить учебные программы"
 NGA_1950_expand_training_programs_desc: "Если мы хотим иметь функционирующую программу военно-воздушных сил, нам нужно начать организовывать дивизии, обучающие новобранцев быть пилотами для боевых действий"
 NGA_1950_adapt_older_airplane_designs: "Адаптация старых конструкций самолетов"
 NGA_1950_adapt_older_airplane_designs_desc: "Чтобы легче ремонтировать, модернизировать и иным образом модифицировать уже существующие самолеты, нам нужно научиться более простым способам адаптации устаревших деталей"
 NGA_1950_rehabilitate_coastal_defenses: "Восстановление береговой обороны"
 NGA_1950_rehabilitate_coastal_defenses_desc: "Чтобы работать рука об руку с нашими военно-воздушными силами, чтобы защитить нашу страну от любой будущей войны, нам понадобится береговая оборона, чтобы минимизировать возможный ущерб, нанесенный нашим прибрежным торговым портам"
 NGA_1950_build_an_air_base_in_lagos: "Построить авиабазу в Лагосе"
 NGA_1950_build_an_air_base_in_lagos_desc: "Крупнейший порт, торговый центр и столица Нигерии были бы наиболее логичным центром для строительства нашей первой военной базы"
