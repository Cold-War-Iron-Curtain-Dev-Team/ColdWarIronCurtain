 NGA_igbo_yoruba_hausa_divide: "Различия народов Игбо-Йоруба-Хауса"
 NGA_shell_monopoly: "Монополия Shell D’Arcy"
 NGA_shell_monopoly_desc: "Shell D'Arcy, основанная в 1937 году, в первую очередь занимается разведкой и разведкой, которая стремится найти нефтяные месторождения в Нигерии, хотя пока не добилась больших успехов. В то время как большинство нигерийцев думают, что они просто ищут пальмовое масло, влияние этой иностранной голландско-британской монополии на Нигерию может оказаться гораздо более зловещим, если она найдет то, что ищет..."
 NGA_shell_monopoly_1: "Монополия Shell D’Arcy"
 NGA_shell_monopoly_1_desc: "Shell D'Arcy, основанная в 1937 году, в первую очередь занимается разведкой и разведкой, которая стремится найти нефтяные месторождения в Нигерии, хотя пока не добилась больших успехов. В то время как большинство нигерийцев думают, что они просто ищут пальмовое масло, влияние этой иностранной голландско-британской монополии на Нигерию может оказаться гораздо более зловещим, если она найдет то, что ищет..."
 NGA_shell_bp_PDCNL: "Shell-BP PDCNL"
 NGA_shell_bp_PDCNL_desc: "После открытия небольших нефтяных месторождений в дельте Нигера Shell-BP создала собственное управление в Нигерии, создав компанию Shell-BP Petroleum Development Company Nigeria Limited (Shell-BP PDCNL). В то время как этнические меньшинства в дельте Нигера считают, что иностранная корпорация несет ответственность за эксплуатацию их народа и исконной земли, местные колониальные элиты счастливы получать прибыль от партнеров в родной стране и своего голландского соседа."
 NGA_shell_bp_PDCNL_1: "Shell-BP PDCNL"
 NGA_shell_bp_PDCNL_1_desc: "После того, как в 1958 году в дельте Нигера были обнаружены известные месторождения нефти, Shell-BP создала собственное управление в Нигерии, создав Shell-BP Petroleum Development Company Nigeria Limited (Shell-BP PDCNL). В то время как этнические меньшинства в дельте Нигера считают, что иностранная корпорация несет ответственность за эксплуатацию их народа и земли предков, богатые элиты игбо, хауса и йоруба счастливы получать свою долю прибыли от своих голландских и британских партнеров."
 NGA_richards_constitution: "Конституция Ричардса"
 NGA_richards_constitution_desc: "Съезды колониальных губернаторов Нигерии в недавней истории были важными инструментами для подавления желаний как коренных, так и колониальных элит. Если мы хотим сохранить эту пороховую бочку колонии вместе, следующим губернаторам придется внести поправки в конституцию."
