 Sartre_thought_desc: " "
 trotskyism_ideology: "Троцкизм"
 trotskyism_ideology_desc: "Троцкизм - это теория марксизма, которую отстаивал Лев Троцкий. Троцкий отождествлялся как ортодоксальный марксист и большевик-ленинец. Он выступал за создание передовой партии пролетариата, пролетарского интернационализма и диктатуры пролетариата, основанной на самоосвобождении рабочего класса и массовой демократии."
 trotskyism_noun: "Революционный социализм"
 vatican: "Ватикан"
 vatican_desc: "Политика Ватикана осуществляется в рамках теократической абсолютной выборной монархии, в которой папа, религиозно говоря, лидер Римско-Католической Церкви и епископ Рима, осуществляет в силу занимаемой должности высшую законодательную, исполнительную и судебную власть над Ватиканом, что является редким случаем не наследственной монархии."
 Salazarism: "Салазаризм"
 Salazarism_desc: "Салазаризм - это националистическая авторитарная идеология, ориентированная на ‘Бога, Отечество и семью " и подчеркивающая социальную роль католицизма, выделяя его из основных вариаций фашизма."
 radical_zaidiism: "Хусизм"
 radical_zaidiism_desc: "Хусизм-это вооруженное движение, происходящее из секты шиитского ислама, Заидизма. Хуситов почти нет за пределами Йемена. Движение хуситов решительно выступает против Саудовской Аравии, США и Израиля и стремится бороться с "отсталостью и маргинализацией" Йемена."
 vennamolaisuus: "Веннамоизм"
 vennamolaisuus_desc: "Веннамолайсуус, или Веннамоизм по-английски-это название, идеологии и политического движеня Вейкко Веннамо, лидера финской сельской партии. Она классифицируется по популизму, опоре на лозунги и поддержке сельского хозяйства."
 guevarism: "Геваризм"
 guevarism_desc: "Геваризм-это теория коммунистической революции и военная стратегия партизанской войны, связанная с коммунистическим революционером Эрнесто " Че " Геварой. Эта идеология способствует экспорту революции в любую страну, чей лидер пользуется поддержкой империи (США) и впал в немилость у ее граждан. Идеология имеет три основных положения, а именно: что народ может победить при правильной организации против национальной армии; что условия, которые делают революцию возможной, могут быть созданы народными силами; и что народные силы всегда имеют преимущество в не городской обстановке."
 ho_chi_minh_thought: "Ho Chi Minh Thought" #NT!
 ho_chi_minh_thought_desc: "Ho Chi Minh Thought is the official ideology of the Communist Party of Vietnam under the leadership of Chairman Ho Chi Minh. Though firmly Marxist-Leninist, Ho believes in a more nationalistic reintepretation of Marxism for the unique conditions of the Vietnamese revolution, even taking some influence from Sun Yat-Sen's "Three Principles of the People" and the American revolutionaries. Ho Chi Minh Thought is as proudly Vietnamese as it is Communist, and calls for a "national democratic revolution" -- a truly Vietnamese path to socialism where worker, peasant, soldier, and merchant will unite against inequality and imperialism in all its forms." #NT!
 oriental_personalism: "Oriental Personalism" #NT!
 oriental_personalism_desc: "Oriental Personalism is the official ideology of Ngo Dinh Diem's Can-Lao Party in South Vietnam. Owing as much to the influence of his brother, Ngo Dinh Nhu as Diem himself, Oriental Personalism has diverse ideological influences, including Emannuel Mournier's theory of Personalism, Marxism, and the folk traditions and religions of Vietnam. The Can-Lao manifest calls for the gradual transformation of Vietnamese society through two phase. In the first phase, the Personalist Revolution, the Social and Working Classes will tear their divisions and join as one. Then comes the Social Revolution, where all forms of capitalism and colonial influence will be swept out on a triumphant march to a utopian, socialist, and proudly Vietnamese society." #NT!
 nhuism: "Person Dignity Theory" #NT!
 nhuism_desc: "Person Dignity Theory, also known as Spiritualistic Marxism, describes the more radical worldview of Ngo Dinh Nhu. Influenced by his involvment with French syndicalism in the 1930s and the left-wing nationalism of the Viet Minh, Nhu's views are significantly to the left of his older brother. Nhu's interpretation of \"True Marxism\" calls for a total centralization of state power in the Can Lao Party and the complete destruction of traditional society in favor of the strict regimentation of the peasants in collectivist \"Strategic Hamlets\" and the city dwellers through \"Urban Revolutionary Syndicates\". Some believe Nhu's ambitions may lie beyond Vietnam, given his calls for a worldwide crusade against \"Materialistic Capitalism\"." #NT!
