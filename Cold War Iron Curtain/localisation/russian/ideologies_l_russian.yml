 libertarianism: "Либертарианство"
 libertarianism_desc: "Либертарианство - это совокупность политических философий и движений, которые поддерживают свободу как основной принцип. Либертарианцы стремятся максимизировать политическую свободу и автономию, подчеркивая свободу выбора, добровольного объединения и индивидуального суждения. Либертарианцы разделяют скептицизм по отношению к авторитету и государственной власти, но расходятся во мнениях относительно масштабов своей оппозиции существующим политическим и экономическим системам."
 maoism: "Маоизм"
  
 maoism_drift: "Ежедневная поддержка маоизма"
 maoism_drift_1: "Влияние маоизма I"
 maoism_drift_2: "Влияние маоизма II"
 maoism_drift_3: "Влияние маоизма III"
 maoism_drift_4: "Влияние маоизма IV"
 maoism_drift_5: "Влияние маоизма V"
 maoism_noun: "Маоист"
 maoist: "Маоизм"
 maoist_desc: "Маоизм-это коммунистическая политическая теория, основанная на учении китайского политического лидера Мао Цзэдуна, последователи которого известны как маоисты. Разработанная с 1950-х годов до реформ Дэн Сяопина в 1970-х годах, она широко применялась как руководящая политическая и военная идеология Коммунистической партии Китая и как теория, направляющая революционные движения во всем мире."
 mao_zedong_thought: "Mao Zedong Thought"
 mao_zedong_thought_desc: "Mao Zedong thought is the product of the combination of the basic principles of Marxism Leninism and the specific reality of the Chinese revolution. It is the crystallization of the collective wisdom of the Chinese Communists. It is a political, military and development theory advocated by Mao Zedong and widely practiced in the Chinese revolution in the 20th century. It is generally considered to be the development of Marxism Leninism in China."
 marxism_leninism_maoism: "Marxism-Leninism-Maoism"
 marxism_leninism_maoism_desc: "The synthesis of Marxism–Leninism–Maoism did not occur during the life of Mao Zedong. From the 1960s, groups that called themselves Maoist or which upheld Maoism were not unified around a common understanding of Maoism and had instead their own particular interpretations of the political, philosophical, economical and military works of Mao; these disorganized ideological trends comprised, and still comprise, Mao Zedong Thought."
 market_socialism: "Рыночный социализм"
 market_socialism_desc: "Рыночный социализм - это тип экономической системы, предполагающий общественную, кооперативную или общественную собственность на средства производства в рамках рыночной экономики."
 marxism_leninism: "Марксизм-Ленинизм"
 marxism_leninism_desc: "Марксизм-ленинизм - это идеология, сочетающая марксистскую социально-экономическую теорию и ленинскую политическую практику, которая является официальной идеологией Союза Советских Социалистических Республик и Коммунистического Интернационала. Целью марксизма-ленинизма является революционное превращение капиталистического государства в социалистическое, осуществляемое под руководством передовой партии профессиональных революционеров из рабочего класса."
 military_junta: "Военная диктатура"
 military_junta_desc: "Военная диктатура - это форма правления, при которой военная сила осуществляет полный или существенный контроль над политической властью."
 monarchism: "Монархист"
 monarchism_desc: "Монархия"
 monarchism_drift: "Ежедневная поддержка монархизма"
 monarchism_drift_1: "Влияние монархистов I"
 monarchism_drift_2: "Влияние монархистов II"
 monarchism_drift_3: "Влияние монархистов III"
 monarchism_drift_4: "Влияние монархистов IV"
 monarchism_drift_5: "Влияние монархистов V"
 monarchism_noun: "Монархизм"
 monarchist: "Монархия"
 monarchist_desc: "Монархия - это форма правления, в которой группа, обычно семья, представляющая династию, воплощает национальную идентичность страны, а ее глава, монарх, выполняет роль суверенитета."
 negusa_nagast: "Негуса Нагаст"
 negusa_nagast_desc: "Негуса Нагаст, или Царь царей, - это тип избирательной наследственной имперской монархии, которая стала преобладающим руководством Эфиопии с тех пор, как Негус Земене Месафинт закончил период эпохи князей, когда Эфиопия была раздроблена между небольшими княжествами, родами и султанатами."
 national_bolshevik: "Национал-большевизм"
 national_bolshevik_desc: "Национал-большевизм - это политическое движение, сочетающее в себе элементы национализма и большевизма."
 national_conservatism: "Национальный Консерватизм"
 national_conservatism_desc: "Национальный консерватизм - это разновидность консерватизма, который больше концентрируется на национальных интересах и поддержании культурной или этнической идентичности, чем большинство других консерваторов. В Европе национал-консерваторы обычно являются евроскептиками."
 nationalist_ideology: "Национализм"
 nationalist_ideology_desc: "Национализм - это политическая идеология, которая подчеркивает интересы собственной нации. Как правило, это происходит в контексте защиты своей национальной идентичности и исторической территории. Национализм-это чрезвычайно разнообразная совокупность множества различных идеологий, хотя то, что является общим для большинства форм, - это защита и улучшение граждан одной нации и их продвижение в ущерб интересам другой нации. Это чаще всего реакция на угрожающие внешние факторы, которые люди  государства рассматривают как ущемляющие их собственные интересы."
 left_nationalist: "Левый национализма"
 left_nationalist_desc: "Левый национализм - это форма национализма, которая способствует повышению социальных стандартов для своего собственного национального народа в целом, путем введения социального равенства и национализации правительства. Левый национализм часто является антиимпериалистическими, обычно может представлять собой национально-освободительные фронты.  Как правило, левый национализм будет ответом на неоднократную эксплуатацию нации внешними факторами."
 national_democrat: "Национальная демократия"
 nationalist: "Национализм"
 nationalist_desc: "Тоталитарный режим"
 nationalist_drift_1: "Влияние нацистов I"
 nationalist_drift_2: "Влияние нацистов II"
 nationalist_drift_3: "Влияние нацистов III"
 nationalist_drift_4: "Влияние нацистов IV"
 nationalist_drift_5: "Влияние нацистов V"
 nationalist_noun: "Националист"
 neo_nazism: "Неонацизм"
 neo_nazism_desc: "Неонацизм состоит из послевоенных воинственных, социальных или политических движений, стремящихся возродить идеологию нацизма. Она заимствует элементы из нацистской доктрины, включая ультранационализм, расизм вплоть до ксенофобии, аблеизма, гомофобии, антиромантизма, антисемитизма, антикоммунизма и инициации Четвертого Рейха. Отрицание Холокоста является общей чертой, как и включение нацистской символики и восхищение Адольфом Гитлером."
 neutrality: "Реакционеры"
 neutrality_desc: "Авторитарный режим"
 neutrality_drift: "Ежедневная поддержка нейтралитета"
 neutrality_drift_1: "Влияние реакционеров I"
 neutrality_drift_2: "Влияние реакционеров II"
