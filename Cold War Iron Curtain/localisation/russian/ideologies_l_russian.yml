 neutrality_drift_4: "Влияние реакционеров IV"
 neutrality_drift_5: "Влияние реакционеров V"
 neutrality_noun: "Реакционер"
 oligarchism: "Олигархия"
 oligarchism_desc: "Олигархия - это форма правления, при которой группа людей правит с абсолютной властью."
 pan_africanism: "Панафриканизм"
 pan_africanism_desc: "Панафриканство - это всемирное движение, которое стремится поощрять и укреплять узы солидарности между всеми людьми африканского происхождения. Основываясь на общей судьбе, восходящей к Атлантической работорговле, движение выходит за пределы континентальной Африки, имея значительную базу поддержки среди африканской диаспоры в Карибском бассейне, Латинской Америке и Соединенных Штатах."
 black_conservatism: "Черный Консерватизм"
 black_conservatism_desc: "Черный консерватизм - это разновидность консервативной идеологии, популярной среди африканцев в обоих полушариях. Люди, которые будут продвигать черный консерватизм, скорее всего, будут сторонниками свободного рыночного капитализма, пропаганды традиционных верований (как правило, в отношении католического и протестантского христианства) и патриотизма или ура-патриотизма. Черный консерватизм противопоставляется Панафриканству, социализму и Антиимпериализму."
 pan_arabism: "Насеризм"
 pan_arabism_desc: "Насеризм-это революционная идеология, вдохновленная вторым египетским президентом Гамалем Абдель Насером; он выступает за объединение того, что называется арабским миром. Он утверждает, что арабский народ представляет собой единую нацию или Федерацию, основанную на общем языке и культуре, превосходящую Ислам и христианство. Сторонники Насеризма часто описываются как представители политических и экономических позиций, которые являются светскими, социалистическими, националистическими, социально прогрессивными и антиимпералистскими."
 progressive: "Прогрессивизм"
 progressive_desc: "Прогрессизм - это поддержка или пропаганда улучшения общества путем реформ. Как философия, она основана на идее прогресса, которая утверждает, что достижения в области науки, техники, экономического развития и социальной организации имеют жизненно важное значение для улучшения условий жизни человека."
 radical_shiaism_drift_1: "Влияние радикальных шиитов I"
 radical_shiaism_drift_2: "Влияние радикальных шиитов II"
 radical_shiaism_drift_3: "Влияние радикальных шиитов III"
 radical_shiaism_drift_4: "Влияние радикальных шиитов IV"
 radical_shiaism_drift_5: "Влияние радикальных шиитов V"
 reactionary: "Реакционеры"
 reactionary_desc: "В политической науке реакционер - это человек, придерживающийся политических взглядов, способствующих возвращению к прежнему политическому состоянию общества, которое, по его мнению, обладает характеристиками, отрицательно отсутствующими в современном статус-кво общества."
 religious_zionism: "Религиозный сионизм"
 religious_zionism_desc: "Религиозные сионисты раньше были просто евреями, которые поддерживали сионистское движение, но постепенно оно превратилось в самостоятельное движение. Последователи религиозного сионизма считают, что право евреев на заселение древней Земли Израиля, которая была обещана им богом, является постоянным и неотчуждаемым. Сионизму по-прежнему противостоят ультраортодоксальные евреи, которые видят в сионизме вмешательство в спасение и, следовательно, богохульство, но религиозные сионисты все еще верят в заслугу поселения в Израиле на религиозной почве."
 republican: "Республиканская партия"
 republican_desc: "Республиканская партия является одной из двух основных политических партий в Соединенных Штатах, её исторический соперник-демократическая партия. Партия названа в честь республиканства, главной идеологии американской революции. Основанная активистами борьбы с рабством, экономическими модернизаторами, бывшими национальными республиканцами, бывшими свободными почвенниками и вигами в 1854 году, республиканцы в значительной степени доминировали в политике на национальном уровне и в большинстве северных штатов между 1860 и 1932 годами."
 revisionist_zionism: "Ревизионистский Сионизм"
 revisionist_zionism_desc: "Сформированный как националистическая оппозиция и выступающий в качестве основы израильского права, ревизионистский сионизм предполагает территориальную целостность над исторической землей Израиля и поддерживает еврейский национализм. Ревизионистские сионисты считают, что евреи обладают суверенитетом над обоими берегами реки Иордан, и их последователи ставят под сомнение легитимность Иорданского королевства. В настоящее время ревизионистский сионизм рассматривается как маргинальная идеология, но его сторонники недавно начали настаивать на том, чтобы сделать идеологию более умеренной и, следовательно, более выборной."
 revolutionary_socialism: "Революционный социализм"
 revolutionary_socialism_desc: "Революционный социализм - это социалистическое учение о том, что социальная революция необходима для того, чтобы вызвать структурные изменения в обществе. Более конкретно, это точка зрения, что революция является необходимой предпосылкой для перехода от капитализма к социализму."
 rexism: "Рексизм"
 rexism_desc: "Решительно выступающий против либеральных и коммунистических идеалов рексизм-это стойкое консервативное националистическое движение, выступающее за корпоративистскую экономическую политику. Используя все более популистскую и авторитарную риторику, их идеалы смещаются ближе к другим фашистским движениям."
 salafism_drift_1: "Влияние салафистов I"
 salafism_drift_2: "Влияние салафистов II"
 salafism_drift_3: "Влияние салафистов III"
 salafism_drift_4: "Влияние салафистов IV"
 salafism_drift_5: "Влияние салафистов V"
 salafist: "Салафизм"
 salafist_desc: "Салафизм - это Реформистская ветвь или возрожденческое движение внутри суннитского ислама, которое развилось в Египте в конце XIX века как ответ на западноевропейский империализм, корни которого уходят в ваххабитское движение XVIII века, возникшее в районе Неджд современной Саудовской Аравии."
 scientific_socialism: "Научный социализм"
 scientific_socialism_desc: "Научный социализм был основан Фридрихом Энгельсом и Карлом Марксом, но широко использовался Дэн Сяопином из КНР для реформирования маоизма. Это  Маосизм, но с несколькими реформами, которые добавляют больше акцента на науку, индустриализацию и в целом новый акцент на экономику"
 shia_islamism: "Шиитский Исламизм"
 shia_islamism_desc: "Шиизм-это ветвь ислама, которая утверждает, что исламский пророк Мухаммад назначил Али ибн Аби Талиба своим преемником (имамом)."
 radical_shiaism: "Shia Islamism"
 radical_shiaism_noun: "Shia Islamism" #NT!
 social_democrat: "Социал-демократизм"
 social_democrat_desc: "Социал-демократия - это политическая, социальная и экономическая идеология, поддерживающая экономические и социальные интервенции для содействия социальной справедливости в рамках капиталистической экономики, а также политический режим, предполагающий приверженность представительной демократии, меры по перераспределению доходов и регулирование экономики в общих интересах и положениях государства всеобщего благосостояния."
 social_liberal: "Социальный либерализм"
 social_liberal_desc: "Социальный либерализм - это политическая идеология, которая считает, что свобода личности требует определенного уровня социальной справедливости. Подобно классическому либерализму, социальный либерализм поддерживает рыночную экономику и расширение гражданских и политических прав и свобод, но отличается тем, что он считает, что законная роль правительства включает решение экономических и социальных проблем, таких как бедность, здравоохранение и образование."
 socialism_desc: "Социализм - это совокупность экономических и социальных систем, характеризующихся общественной собственностью и самоуправлением трудящихся средствами производства, а также связанными с ними политическими теориями и движениями. Социальная собственность может относиться к формам общественной, коллективной или кооперативной собственности или к долевой собственности граждан. Существует множество разновидностей социализма, и нет единого определения, охватывающего их все, хотя социальная собственность является общим элементом, разделяемым ее различными формами. Социалистические экономические системы можно разделить на нерыночные и рыночные формы. Нерыночный социализм предполагает замещение факторных рынков и денег инженерно-техническими критериями, основанными на расчетах, производимых в натуральном выражении, тем самым создавая экономический механизм, функционирующий по иным экономическим законам, чем капитализм. Нерыночный социализм стремится обойти неэффективность и кризисы, традиционно связанные с накоплением капитала и системой прибыли. Напротив, рыночный социализм сохраняет использование денежных цен, факторных рынков и в некоторых случаях мотива прибыли в отношении функционирования находящихся в общественной собственности предприятий и распределения между ними капитальных благ. Прибыль, получаемая этими фирмами, контролировалась бы непосредственно рабочей силой каждой фирмы или поступала бы в общество в целом в виде социального дивиденда. В дискуссии о социалистических расчетах обсуждается целесообразность и методы распределения ресурсов для социалистической системы."
 socialist: "Социализм"
 socialist_desc: "Демократия"
 socialist_drift: "Ежедневная поддержка социализма"
 socialist_drift_1: "Влияние социалистов I"
 socialist_drift_2: "Влияние социалистов II"
 socialist_drift_3: "Влияние социалистов III"
 socialist_drift_4: "Влияние социалистов IV"
 socialist_drift_5: "Влияние социалистов V"
 socialist_noun: "Социализм"
 stalinism: "Сталинизм"
 stalinism_desc: "Сталинизм - это государство и связанная с ним политика, осуществлявшаяся примерно с 1927 по 1953 год Иосифом Сталиным. Сталинская политика и идеи, выработанные в Советском Союзе, включали быструю индустриализацию, теорию социализма в одной стране, тоталитарное государство, коллективизацию сельского хозяйства, культ личности и подчинение интересов иностранных коммунистических партий интересам Коммунистической партии Советского Союза, считавшейся сталинизмом ведущей авангардной партией коммунистической революции того времени."
 sunni_islamism: "Суннитский Исламизм"
 sunni_islamism_desc: "Суннитский ислам - это самая крупная конфессия Ислама. Его название происходит от слова Сунна, отсылающего к образцовому поведению исламского пророка Мухаммеда"
 titoism: "Титоизм"
 titoism_desc: "Титоизм описывается как политика и практика после Второй мировой войны, связанная с Иосипом Броз Тито во время Холодной войны, характеризующаяся оппозицией Советскому Союзу. Обычно она представляет собой югославскую доктрину Тито в международной политике времен Холодной войны. Она возникла после освобождения югославскими партизанами Югославии независимо от Красной Армии, в результате чего Югославия стала единственной восточноевропейской страной, которая осталась социалистической, но независимой после Второй мировой войны, а также сопротивлялась давлению Советского Союза, чтобы стать членом Варшавского договора."
 toryism: "Торизм"
 toryism_desc: "Торизм - это политическая философия, основанная на британской версии традиционализма и консерватизма, которая поддерживает верховенство социального порядка, как оно развивалось на протяжении всей истории. Тори можно описать фразой "Бог, Король и страна"."
 trotskyism: "Революционные социалисты"
 trotskyism_desc: "Социалистическое"
 trotskyism_drift_1: "Влияние революционных социалистов I"
 trotskyism_drift_2: "Влияние революционных социалистов II"
