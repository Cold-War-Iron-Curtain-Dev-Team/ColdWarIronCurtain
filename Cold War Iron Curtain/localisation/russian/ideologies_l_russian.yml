 christian_democracy: "Христианская демократия"
 christian_democracy_desc: "Христианская демократия - это форма консерватизма и политической идеологии, возникшая в Европе XIX века под влиянием католического социального учения, а также Неокальвинизма. Первоначально она была задумана как сочетание традиционных католических верований и современных демократических идей, а затем стала включать в себя социальное учение других христианских конфессий, таких как лютеранская церковь и реформатская церковь."
 colonial_regime: "Колониализм"
 colonial_regime_desc: "Колониализм - это политика государства, стремящегося расширить или сохранить свою власть над другими народами или территориями, как правило, с целью открытия торговых возможностей. Колонизирующая страна стремится извлечь выгоду, в то время как колонизируемая страна или земельный массив, поскольку многие из колонизированных стран вообще не были странами, модернизируются при помощи правил, определенных колонизаторами, особенно в экономике, религии и здравоохранении."
