 democratic: "Прогрессивизм"
 democratic_america: "Демократическая партия"
 democratic_america_desc: "Демократическая партия является одной из двух основных современных политических партий в Соединенных Штатах, наряду с Республиканской партией. Прослеживая свое наследие от Демократической Республиканской партии Томаса Джефферсона и Джеймса Мэдисона, современная демократическая партия была основана около 1828 года сторонниками Эндрю Джексона, что делает ее старейшей активной политической партией в мире."
 democratic_desc: "Прогрессивный режим"
 democratic_islamism: "Демократический Исламизм"
 democratic_islamism_desc: "Исламская демократия - это политическая идеология, которая стремится применять исламские принципы к государственной политике в демократических рамках. Исламская политическая теория определяет три основные черты исламской демократии: лидеры должны быть избраны народом, подчиняться шариату и привержены практике "Шуры", особой форме консультаций, практикуемой пророком Мухаммедом"
 democratic_noun: "Прогрессивизм"
 democratic_socialism_desc: "Стремясь к равенству и социалистическому государству реформистскими средствами, социал-демократы стремится уничтожить или смягчить последствия капитализма с помощью общественного мандата."
 democratic_socialist: "Демократический социализм"
 democratic_socialist_desc: "Демократический социализм - это политическая философия, которая отстаивает политическую демократию наряду с общественной собственностью на средства производства, с акцентом на самоуправление и демократическое управление экономическими институтами в рамках рыночной или какой-либо другой формы децентрализованной плановой социалистической экономики."
 despotism: "Деспотизм"
 despotism_desc: "Деспотизм - это форма правления, в которой один человек правит с абсолютной властью."
 falangism: "Фалангизм"
 falangism_desc: "Авторитарная идеология с чертами фашизма и консерватизма, фалангизм ценит национальную и католическую идентичность."
 general_zionism: "Сионизм"
 general_zionism_desc: "Многие люди и партии предпочли не следовать ни одной из отчетливых сионистских школ мысли и предпочли придерживаться основной идеологии сионизма, поселившись в Израиле и создав еврейское государство. Многие партии, которые придерживаются "ядра" сионизма, являются центристскими партиями, которые не ассоциируют себя ни с левыми, ни с правыми и склонны быть экономически либеральными."
 ku_klux_klan: "Ку-Клукс-Клан"
 ku_klux_klan_desc: "Ку-Клукс-Клан-это американская группа сторонников превосходства белой расы. Клан существовал в трех различных эпохах в разные периоды истории Соединенных Штатов. Каждый из них отстаивал экстремистские реакционные позиции, такие как превосходство белых, белый национализм, антииммиграция и-особенно в более поздних итерациях—Нордицизм и антикатолицизм."
 ujamaa: "Уджамаа"
 ujamaa_desc: "Суахилийское слово Уджамаа означает "расширенная семья", "братство" или "социализм"; как политическая концепция оно утверждает, что человек становится личностью через народ или общину. Уджамаа был термин, ставший популярным благодаря политической философии, применявшейся в рамках политики социального и экономического развития Джулиуса Ньерере в Танзании после того, как она получила независимость от Великобритании в 1961 году."
 left_wing_dictatorship: "Левая военная диктатура"
 left_wing_dictatorship_desc: "Левая военная диктатура - это правительство, которое поддерживает определенные социалистические убеждения, для того, чтобы заручиться поддержкой второго мира, но при этом всем же, государство управляется деспотом-военным."
 fascism: "Третий путь"
 fascism_desc: "Тоталитарный"
