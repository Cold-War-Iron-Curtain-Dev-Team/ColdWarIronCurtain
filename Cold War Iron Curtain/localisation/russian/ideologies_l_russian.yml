 fascism_ideology: "Третий позиционизм"
 fascism_ideology_desc: "Охватывая различные ультранационалистические движения, третий путь, как правило, порождает преданность государству и объединяет народ под сильным руководством сильного лидера. Третий путь представлен как его собственная уникальная идеология, как третий вариант капитализма или коммунизма."
 fascism_noun: "Третий путь"
 gaullist: "Голлизм"
 gaullist_desc: "Голлизм-это французская политическая позиция, основанная на мыслях и действиях лидера французского сопротивления во время Второй мировой войны генерала Шарля де Голля, который стал президентом-основателем Пятой французской республики."
 green: "Зеленая политика"
 green_desc: "Зеленая политическая идеология , направленная на создание экологически устойчивого общества. Основными принципами зеленой политики являются энвайронментализм, ненасилие, социальная справедливость и народная демократия."
 hindu_nationalism: "Индуистский Национализм"
 hindu_nationalism_desc: "Индуистский национализм был коллективно назван выражением социальной и политической мысли, основанной на исконных духовных и культурных традициях индийского субконтинента."
 hoxhaism: "Ходжаизм"
 hoxhaism_desc: "Ходжаизм - это вариант антиревизионистского марксизма-ленинизма, возникший в конце 1970-х годов в результате раскола маоистского движения, возникшего после идеологического спора между Коммунистической партией Китая и Партией труда Албании. Эта идеология названа в честь Энвера Ходжи, известного албанского коммунистического лидера."
 independent: "Независимый"
 independent_desc: "Независимый политик - это индивидуальный политик, не связанный ни с одной политической партией."
 islamic_monarchy: "Исламская Монархия"
 islamic_monarchy_desc: "Исламские монархии - это разновидность Исламского государства, которое является монархией. Они исторически известны под различными названиями, такими как Мамлака, халифат, Султанат или эмират."
 islamism: "Исламизм"
 islamism_desc: "Исламистский режим"
 islamism_drift_1: "Влияние Ислама I"
 islamism_drift_2: "Влияние Ислама II"
 islamism_drift_3: "Влияние Ислама III"
 islamism_drift_4: "Влияние Ислама IV"
 islamism_drift_5: "Влияние Ислама V"
 islamism_noun: "Исламистский"
 juche: "Чучхе"
 juche_desc: "Чучхе-это официальная государственная идеология Северной Кореи, описанная правительством как оригинальный, блестящий и революционный вклад Ким Ир Сена в национальную и международную мысль. Он постулирует, что корейские массы должны действовать как хозяева революции и строительства и что, став самостоятельными и сильными, нация может достичь истинного социализма."
 kemalism: "Кемализм"
 kemalism_desc: "Кемализм - это основополагающая идеология Турецкой Республики. Кемализм, как он был реализован Мустафой Кемалем Ататюрком, определялся широкими политическими, социальными, культурными и религиозными реформами, призванными отделить новое турецкое государство от его Османского предшественника и принять вестернизированный образ жизни, включая установление демократии, секуляризм, государственную поддержку науки и бесплатного образования."
 khomeinist: "Хомейнизм"
 khomeinist_desc: "Хомейнизм был основан великим аятоллой Рухоллой Хомейни во время Иранской Исламской революции 1979 года. Речь идет о замене старого монархического правления теократической системой. Все, что есть в Коране, теперь является законом для правительства."
 labor_zionism_mapai: "Трудовой Сионизм"
 labor_zionism_mapai_desc: "Лейбористский сионизм - это левое крыло сионистского движения. В течение многих лет это была наиболее значительная тенденция среди сионистов и сионистских организаций. Она рассматривала себя как Сионистский сектор исторического еврейского рабочего движения Восточной и Центральной Европы, в конечном счете развивая местные подразделения в большинстве стран с большим еврейским населением. Лейбористские сионисты считают, что еврейское государство могло быть создано только усилиями еврейского рабочего класса, осевшего на Земле Израиля и построившего государство путем создания прогрессивного еврейского общества с сельскими кибуцами и мошавами и городским еврейским пролетариатом."
 labor_zionism: "Лейбористский сионизм"
 labor_zionism_desc: "Лейбористский сионизм - это левое крыло сионистского движения. В течение многих лет это была наиболее значительная тенденция среди сионистов и сионистских организаций. Она рассматривала себя как Сионистский сектор исторического еврейского рабочего движения Восточной и Центральной Европы, в конечном счете развивая местные подразделения в большинстве стран с большим еврейским населением. Лейбористские сионисты считают, что еврейское государство могло быть создано только усилиями еврейского рабочего класса, осевшего на Земле Израиля и построившего государство путем создания прогрессивного еврейского общества с сельскими кибуцами и мошавами и городским еврейским пролетариатом."
