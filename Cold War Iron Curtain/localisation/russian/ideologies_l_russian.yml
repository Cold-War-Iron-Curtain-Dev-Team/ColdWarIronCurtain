 african_socialism: "Африканский социализм"
 african_socialism_desc: "Африканский социализм-форма хозяйствования, предполагающая возможным рациональное использование ресурсов «традиционным» африканским способом, в отличие от классического социализма. Африканские социалисты пытались соединить европейские социалистические учения с особенностями национального исторического развития и местными культурно-религиозными традициями, а также часто с исламским либо христианским социализмом."
 anarcho_communism: "Анархо-коммунизм"
 anarcho_communism_desc: "Анархо-коммунизм-это теория анархизма, которая выступает за отмену государства, капитализма, наемного труда и частной собственности в пользу общей собственности на средства производства, прямой демократии и горизонтальной сети рабочих советов с производством и потреблением, основанной на руководящем принципе: от каждого по его способностям, к каждому потребностям."
 conservative_liberalism: "Консервативный Либерализм"
 conservative_liberalism_desc: "Вариант либерализма, который совмещает консервативные ценности с либеральными позициями по ряду вопросов политики, то есть представляющий правое крыло либерального движения. Это более позитивный и менее радикальный вариант классического либерализма."
 baathism: "Баасизм"
 baathism_desc: "Баасизм - это арабская националистическая идеология, которая стремится к созданию единого арабского государства через руководство авангардной партией над прогрессивным революционным правительством."
 centrism: "Центризм"
 centrism_desc: "Центризм - это политическое мировоззрение или специфическая позиция, которая предполагает принятие или поддержку баланса между социальным равенством и  социальной иерархией, а также противодействие политическим изменениям, которые привели бы к значительному сдвигу общества либо сильно влево, либо вправо."
