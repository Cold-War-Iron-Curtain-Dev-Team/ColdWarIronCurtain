 BEL49_Election.0.d: "На выборах 1949 года идет острая борьба между кандидатом от Христианско-социальной партии Гастоном Эйскенсом, членом Палаты представителей Бельгии, и Полем-Анри Спааком, действующим премьер-министром с 1947 года, представляющим Бельгийскую социалистическую партию. Кого выберет народ?"
 BEL49.1.d: "Во время немецкой оккупации Бельгии многие граждане обратились за помощью к своим похитителям, а не к сопротивлению, создавая враждующие политические партии и группы, такие как фламандская VNV, DeVlag и Rex Party. 15 000 бельгийцев служили в двух отдельных дивизиях СС, в том числе в 28-й дивизии СС "Валлония", состоявшей в основном из франкоязычных фашистов. Теперь, когда война окончена и Бельгия не находится под сапогом Германии, мы должны быстро привлечь к ответственности и осудить всех примерно 53 000 бельгийцев, которые работали на наших оккупантов."
 BEL49.2.d: "В дополнение к нашим продолжающимся усилиям по преследованию и осуждению всех бывших немецких коллаборационистов в пределах наших границ, мы продолжим подавлять любую деятельность правых, ограничивая свободы и права тех, кто подозревается в работе на немцев. Их заклеймят как предателей, как и должно быть, за то, что они заискивают перед угнетателями и убийцами нашего народа. Ни один соавтор никогда не будет прежним, поэтому они должны жить с тем, что они сделали."
 BEL49.3.d: "Koningskwestie, или \"Королевский вопрос\", представляет собой крупный политический кризис, связанный с легитимностью короля Бельгии Леопольда III. Во время немецкого вторжения в Бельгию в 1940 году король и его правительство вступили в конфликт, когда Леопольд взял под свой контроль армию и проявил крайне авторитарные наклонности, был помещен под домашний арест во время немецкой оккупации и в конечном итоге был депортирован в Германию в 1944 году. После войны Леопольд был вынужден обратиться в Швейцарию для изгнания. Люди по-прежнему упорно спорят о том, следует ли разрешить королю вернуться и возобновить свои обязанности или ему следует остаться в изгнании."
 BEL49.4.d: "Без каких-либо консультаций или подобия демократической власти Христианско-социальная партия, возглавляемая Гастоном Эйскенсом, решила разрешить Леопольду III, королю Бельгии, вернуться с ссылки из Швейцарии в Брюссель. Неизвестно, чем было вызвано это решение, но ожидается, что король прибудет в течение нескольких дней. Это, несомненно, вызовет высокий уровень напряженности, особенно в Валлонии, но CSP, похоже, приняла это во внимание при принятии своего решения."
 BEL49.5.d: "После успешной победы его сторонников на королевском референдуме король вернулся в Брюссель, приземлившись в аэропорту Брюсселя к толпе любящих подданных. Ожидается, что в Валлонии и Брюсселе пройдут сотни протестов, вызванных антироялистской коалицией, осуждающих прибытие якобы авторитарного и бывшего коллаборационистского короля. Это, несомненно, приведет к продолжению политической напряженности, но ожидается, что Леопольд выступит с речью в центре Брюсселя и быстро возобновит свои обязанности короля."
 BEL49.6.d: "После окончания референдума и победы антироялистской коалиции во главе с Бельгийской социалистической партией бельгийское правительство официально отказало королю в выполнении каких-либо из его предыдущих конституционных обязанностей, тех, которые он полностью утратил в 1940 году с немецким вторжением. Это не позволяет королю Леопольду иметь какие-либо полномочия или обязанности в правительстве и представляет собой великую победу для сторонников антироялистов. Празднования проходят по всей стране, особенно в Валлонии, откуда поступило большинство голосов, хотя в ближайшие дни ожидаются небольшие контрпротесты."
 BEL49.7.d: "С подавляющим большинством левых в Сенате с победой BSP роль крупнейшего профсоюза Бельгии, FGTB-ABVV, становится еще более значительной. Algemeen Belgisch Vakverbond или Fédération Generale du Travail de Belgique, созданная в 1945 году Бельгийской конфедерацией профсоюзов, коммунистической Бельгийской ассоциацией синдикатов единства и различными другими союзами и синдикатами, демонстрировала свои мускулы на протяжении 5 лет своего существования. Готовность правительства расширить возможности FGTB-ABVV представляет собой улучшение связи между государством и ее экономической базой."
 BEL50_Election.0.d: "Досрочные выборы 1950 года приходятся на особенно тяжелое время в бельгийской политике. Кандидат от CSP, Жан Дювьесар, бывший член Палаты представителей и Сената Бельгии, а также министр экономики, выступает против Макса Бюзе, президента Бельгийской социалистической партии. Кого выберет народ?"
 BEL50.1.d: "Не урегулировав должным образом королевский вопрос и почувствовав особый уровень недовольства народа, бельгийский сенат решил начать вотум недоверия премьер-министру Жану Дювьесару. Получив лишь минимальное сопротивление со стороны нескольких сторонников жесткой линии CSP, предложение, внесенное несколькими законодателями BSP, прошло безоговорочно, что привело к смещению Дювьесара и поиску нового премьер-министра."
 BEL50.2.d: "С доминированием CSP в правительстве и возвращением Леопольда III в Бельгию кажется уместным, чтобы король возобновил свои обязанности, закрепленные в конституции 1831 года, как это предусмотрено законом. После краткой церемонии присяги Национальный институт радиовещания, национальный радиопровайдер, транслировал речь короля на всю страну."
 BEL50.3.d: "Отчаявшись найти замену после голосования за Жана Дювьесара с поста премьер-министра, CSP выдвинула кандидатуру Жозефа Фольена. Ветеран Первой мировой войны, а также министр юстиции в 1939 году перед немецким вторжением, Фолиен способен к мощному лидерству. В ближайшие дни будет подтверждено, что Фольен будет премьер-министром, и мы надеемся, что дольше, чем его предшественник."
 BEL50.4.d: "Под огромным давлением со стороны предыдущего правительства Дювьесара Леопольд объявил 1 августа, что отрекается от престола, оставив свое правление вместо своего сына Бодуэна. Есть подозрение, что это было сделано для снятия напряжения в Валлонии и во всей стране после его возвращения в Бельгию и его печально известного наследия во время Второй мировой войны. Некоторых это может порадовать, но по нему тоже будут скучать."
 BEL50.5.d: "После отречения его отца в августе наследный принц Бельгии Бодуэн I принял корону короля Бельгии вместе со всеми связанными с ней конституционными полномочиями. Его отец Леопольд накануне подписал отречение от престола, и толпы людей собрались в Брюсселе, чтобы увидеть коронацию и последующую речь, в которой новый король пообещал уважать правительство, законы и пожелания бельгийского народа. Однако важно было упомянуть о нескольких беспорядках во время его выступления, в том числе о том, что выкрикнул лидер коммунистов Жюльен Лао, известный своими революционными убеждениями. Празднования продолжаются сегодня вечером по всей Бельгии после этого самого захватывающего дня."
 BEL50.6.d: "С решением королевского вопроса, новым королем и новым премьер-министром репрессии должны быть ослаблены. Жестокое обращение с коллаборационистами не может быть полностью прекращено ради нашей национальной безопасности, и наследие войны продолжается, но такие варварские меры, как смертные приговоры и публичное порицание, должны быть постепенно изъяты из культуры."
 BEL50.7.d: "В связи с внезапным уходом Жозефа Фольена с поста премьер-министра всего через полтора года Христианско-социальная партия выдвинула кандидатуру Жана Мари Жозефа, барона ван Хаутта, бывшего профессора права в Гентском университете и министра финансов при Жане Дювьесаре и Жозефе. Мы надеемся, что кандидатура ван Хаутте будет подтвержден в ближайшие дни, и ожидается, что он проработает дольше, чем два его предшественника, что обеспечит сильное лидерство Бельгии."
 BEL50.8.d: "Почувствовав дух послевоенного сотрудничества с нашими союзниками и потребность во взаимной помощи и безопасности Западной Европы, бельгийский генеральный штаб санкционировал проведение крупного оборонного обзора, направленного на оценку эффективности бельгийских вооруженных сил и постановку основных задач на будущее. После нескольких месяцев изучения авторы отчета пришли к выводу, что основной угрозой являются действия Советского Союза и его сателлитов в западноевропейском регионе, и поставили цели по расширению вооруженных сил до трех действующих дивизий, двух резервных дивизий, 400 самолетов. и пятнадцать кораблей, а также многочисленные части противовоздушной обороны, радары и системы управления."
 BEL50.9.d: "Обращение с нашими гражданами, обвиняемыми в пособничестве Германии, должно быть прекращено. Правительство продолжит преследовать и осуждать коллаборационистов, но культурная традиция публично позорить этих людей, в том числе брить им головы и запирать их в импровизированных зоопарках и вольерах - Позор. Стигматизация, связанная с этими гражданами, должна прекратиться, и они будут привлечены к ответственности за свои преступления соответствующим образом."
 BEL50.10.d: "Наша политика либерализации в отношении коллаборационистов оказалась неэффективной как для подавления общественного недовольства, так и для обеспечения свободного отправления правосудия в отношении бывших немецких коллаборационистов. Репрессии, как известно, нужно лишь немного усилить, чтобы закончить работу по расчистке беспорядка от бывших немецких военных преступников в нашей стране."
 BEL50.11.d: "В ответ на Королевский вопрос и на фоне кипящей политической напряженности в правительстве Брюсселя несколько крупных профсоюзов Валлонии, в том числе FGTB, организовали массовые забастовки и протесты против возвращения короля, а также против отсутствия трудовых реформ относительно промышленности. У этих забастовок нет вероятной конечной точки, и правительство должно выяснить, как с ними справиться, прежде чем ситуация станет чрезмерно жестокой."
 BEL50.12.d: "В ответ на протесты социалистов и антироялистов в Валлонии местное правительство направило жандармерию, чтобы убедиться, что протесты носят мирный характер. Надев защитное снаряжение и щиты, полиция заняла позиции на главных площадях в Льеже, Шарлеруа и Брюсселе, наблюдая, как протестующие продвигаются вперед, и противодействуя им. Некоторые протесты переросли в насилие, и несколько полицейских и протестующих получили ранения в различных потасовках. В целом политическая ситуация была довольно мирной, но неуважение к правительству со стороны социалистов возросло."
 BEL50.13.d: "По странному стечению обстоятельств, недавно избранное правительство во главе с Бельгийской социалистической партией почти не сопротивлялось массовым забастовкам и протестам, происходящим в основном в Валлонии, Брюсселе и Льеже. Это событие поразило политологов и зрителей, а общественное мнение о правительстве возросло, а представитель правительства рассказал о предстоящих в ближайшие дни переговорах по трудовым вопросам. Местной полиции было рекомендовано следить за протестами, чтобы предотвратить дальнейшее насилие, но мало что ожидается, кроме некоторого сопротивления монархистов."
 BEL50.14.d: "Попытки местной жандармерии предотвратить насилие не увенчались успехом. Правительство под руководством CSP, стремясь сдержать беспорядки до того, как разразится новый конфликт, обратилось к бельгийскому генеральному штабу с просьбой развернуть несколько дивизий бельгийского сухопутного компонента в крупных городах. Все подразделения состоят из регулярных военнослужащих и призывников и включают 2-ю пехотную дивизию, дислоцированную в Льеже, и 6-ю пехотную дивизию, дислоцированную в Брюсселе. Резервы не будут призываться, но развернутым солдатам будет поручено поддерживать порядок и военное положение, если правительство введет его."
 BEL50.15.d: "В разгар мирных социалистических протестов и забастовок контрпротестующие монархисты беспокоили и наносили ущерб народу и его требованиям. Правительство БСП заявило, что \"все протестующие-монархисты, вмешивающиеся в мирный протест рабочих, будут арестованы\". Уже несколько сотен монархистов были арестованы и задержаны либо местной полицией, либо протестующими, взявшими закон в свои руки."
 BEL50.16.d: "Печально известный лидер коммунистов Жюльен Лао был убит возле своей резиденции в городе Серен двумя неизвестными вооруженными людьми. Это могло быть спровоцировано регентством принца Бодуэна, который, принимая присягу регентства, был прерван депутатом-коммунистом, выкрикивавшим \"Да здравствует республика!\". Считалось, что заместителем был Лао, действия которого во время Королевского вопроса вызвали гнев монархистов. В смерти Лао обвиняют монархистов, и вскоре должны состояться массовые похороны, в которых примут участие до 300 000 человек. Планируются новые забастовки, поскольку левые становятся все более разгневанными во время широкомасштабного политического насилия."
 BEL54_Election.0.d: "После решения царского вопроса ситуация в стране вроде бы стабилизировалась. Кандидат CSP, Жан ван Хаутт, нынешний премьер-министр и бывший профессор права Гентского университета и министр финансов при правительствах Жана Дювьесара и Жозефа Фольена. Кандидатом от БСП является Ахилл ван Акер, премьер-министр с 1945 по 1946 год и лидер Бельгийской лейбористской партии. Кого выберет народ?"
 BEL54.1.d: "Фламандский бриллиант — это фламандская ссылка на сеть из четырех мегаполисов в Бельгии, включая Брюссель, Гент, Антверпен и Левен. Этот район является наиболее промышленно развитым и урбанизированным в Бельгии, его можно сравнить с Рурской долиной или Рандстадом в Нидерландах. Покрывая около 51 мили, Алмаз также включает в себя множество высших учебных заведений, таких как Университет Хасселта и Университет Гента."
 BEL54.2.d: "Производство бельгийского пива значительно улучшилось и набирает обороты на мировой арене. Национальная пивная индустрия варит пиво разных стилей, в том числе траппистское, аббатское, пильз, белый эль и фламандское красное пиво. Более 80% бельгийского пива импортируется и производится такими компаниями, как Stella Artois, Hoegaarden и Leffe. Фестивали организуются по всей Бельгии, в том числе Weekend of Belgian Beers и фестиваль Karakterbieren."
 BEL54.3.d: "Анри Моро де Мелен, известный ветеран Корейской войны и командир бельгийского батальона Командования ООН, был награжден бельгийским министром обороны. Полковник де Мелен до своего участия в Корее участвовал во Второй мировой войне, попал в плен, затем стал сенатором, а затем министром юстиции с 1948 по 1949 год. Во время правления Жозефа Фольена де Мелен занимал пост министра обороны, принимая решение о вводе войск в Корею. Разочаровавшись в разгар Королевского вопроса, де Мелен подал в отставку и записался в батальон, став его командиром. Он служил достойно, и вся Бельгия будет приветствовать его как героя."
 BEL54.4.d: "Был принят Второй закон де Тайе, названный в честь министра здравоохранения и министра по делам семьи Альфреда де Тайе. Этот закон дает городам и муниципалитетам компенсацию за разрешения на снос, что позволяет местным органам власти покупать землю и разрушать там здания, имея право продавать щебень для получения прибыли. Этот закон вызвал много протестов из-за того, что он дал правительствам слишком много власти и позволил снести жилье с низким доходом, но сторонники утверждают, что города получат экономические выгоды и прибыль, что приведет к снижению налогов для всех."
 BEL54.5.d: "Крупная авария на шахте произошла на угольной шахте Буа-дю-Казье в Марсинелле, провинция Эно в Валлонии. В результате отказа подъемного механизма и последующего подземного пожара 262 горняка погибли от отравления угарным газом. Спасательные работы продолжались до 23 августа, выжило всего 12 человек. Подавляющее большинство погибших были итальянскими гастарбайтерами, а также 95 бельгийцами и другими европейцами. Италия немедленно потребовала улучшения условий труда, и администрация шахты будет привлечена к ответственности за халатность."
 BEL54.6.d: "В ответ на продолжение раздельного католического обучения Христианско-социальной партией, Бельгийской социалистической партией и Либеральной партией в ответ на заявление правительства были организованы массовые акции протеста в крупных городах. Эти протесты в основном проходят в Брюсселе, а также в Льеже, Антверпене и Генте, и речь идет о светском образовании, при этом некоторые протестующие вывешивают плакаты, а некоторые держат своих маленьких детей в воздухе. Некоторые студенты также присутствовали на протестах, рассказывая о своем опыте в католических школах и призывая правительство принять светские меры. Неясно, повлияет ли это как-то на нынешнее решение, но время покажет."
 BEL54.7.d: "Законы об образовании, введенные в действие министром образования Пьером Армелем во время правления Жозефа Фольена, были отменены правительством BSP! Это позволит получить светское образование, а также обеспечит существенное разделение церкви и государства в школьной системе. Неясно, будет ли замена законов об образовании Хармеля, и если да, то когда, но улицы взрываются от радости. Многие члены CSP и католики ропщут на эти события, и есть разговоры о протестах в ближайшие дни, как в светских, так и в религиозных кругах. Это может снова обернуться очередным циклом политического насилия."
 BEL54.8.d: "Несмотря на то, что законы Армеля об образовании были отменены, протесты продолжаются по всей стране, даже со стороны социалистов, которые утверждают, что отсутствие закона об образовании идет на пользу только католическим школам. Протесты продолжаются, особенно в Брюсселе, где протестующие BSP сталкиваются с контрпротестующими CSP, что приводит к нескольким дракам и арестам вооруженной полицией. Правительство считает, что социалистические и либеральные протесты должны быть остановлены, и полиция была вызвана для разгона толпы и введения комендантского часа, если это применимо."
 BEL54.9.d: "Несмотря на то, что законы Армеля об образовании были отменены, протесты продолжаются по всей стране, даже со стороны католиков, которые утверждают конституционность ограничения частных религиозных школ. Протесты продолжаются, особенно в Брюсселе, где протестующие CSP сталкиваются с контрпротестующими BSP. что привело к нескольким дракам и арестам вооруженной полицией. Правительство считает, что католические и консервативные протесты должны быть остановлены, и полиция была вызвана для разгона толпы и введения комендантского часа, если это применимо."
 BEL54.10.d: "Закон Коллара, названный в честь нынешнего министра образования и члена BSP Лео Коллара, предусматривает сокращение субсидий бельгийской образовательной сети и удаление из системы примерно 110 католических посредников, а также увеличение заработной платы учителей и положений для технических школ и свободы выбора. Многие считают это подходящей альтернативой ныне несуществующим законам об образовании Хармеля, которые несправедливо давали преимущество католическим школам. Этот закон вызовет много протестов, но, по всей вероятности, обеспечит светлое будущее бельгийским школьникам."
 BEL58_Election.0.d: "На очередных выборах 1958 года соревнуются кандидат от CSP Гастон Эйскенс и кандидат от BSP Ахилл ван Акер. Эйскенс - предыдущий премьер-министр и экономист, а ван Акер также был предыдущим премьер-министром в конце 1940-х годов. Кого выберет народ?"
 BEL58.1.d: "С переходом от Европейского сообщества угля и стали к новому Европейскому экономическому сообществу общая цена на уголь становится дешевле, а транспортировка между странами увеличивается. Наша угольная промышленность должна оставаться неизменной, и правительство считает себя обязанным снижать цены, чтобы сохранить конкурентоспособность на других рынках. Наша промышленность начинает просадку, а между тем она должна оставаться на прежнем уровне."
 BEL58.2.d: "Школьный пакт, соглашение о разрешении Второй школьной войны, является результатом работы, проведенной в сентябре 1958 года Национальной школьной комиссией, переговоров между BSP, CSP и либеральными партиями. Это договор, решающий вопросы образования в Бельгии, и предусматривает свободу выбора школ, четкое разграничение между государственной и частной школой, и запрет политической деятельности в школах."
 BEL58.3.d: "Правительство предупреждено о вспышках гражданских беспорядков в столице Бельгийского Конго Леопольдвиле. Беспорядки начались после того, как членам ABAKO или политической партии Alliance des Bakongo не разрешили собраться для протеста против бельгийских зверств в Конго. Насилие начинает поражать простых людей, часть города разграблена и сожжена. Ответ нужен как можно быстрее."
 BEL58.4.d: "Force Publique, жандармерия и полиция Бельгийского Конго, были развернуты для реагирования на массовые беспорядки в Леопольдвиле. 13-й батальон FP под командованием генерала Эмиля Янссенса уполномочен применять смертоносную силу для подавления протестов, нападений и грабежей. Это должно быть лишь временной мерой, чтобы остановить дальнейшие протесты и насилие."
 BEL58.5.d: "После беспорядков в Леопольдвиле, почувствовав всеобщее недовольство бельгийским колониальным правлением и следуя примеру других колониальных держав, Палата представителей Бельгии собралась для проведения публичных слушаний по Министерству колоний и их действиям в последнее время, в том числе возможные зверства. Кроме того, необходимо подумать о независимости Конго в самом ближайшем будущем. Есть надежда, что эти слушания раскроют правду."
 BELFA.1.d: "5 ноября 1955 года был сформирован парламент Бенилюкса совместно с Экономическим союзом Бенилюкса. Задуманный как консультативная группа, не имеющая права принимать решения по принятию законов, Парламент состоит из 49 членов; по 21 из Бельгии и Нидерландов, а также 7 представителей из Люксембурга. Председатель чередуется между тремя странами каждые два года, начиная с Брюсселя, Франс ван Колварт становится первым председателем ассамблеи."
 BELFA.2.d: "В дополнение к обновленному таможенному соглашению 1944 и 1947 годов между Бельгией, Нидерландами и Люксембургом три страны подписали соглашение о создании Экономического союза Бенилюкса. Используя парламент Бенилюкса в качестве консультативного органа, союз обязался обеспечить свободное передвижение людей, товаров и услуг между тремя странами."
 BELFA.3.d: "Во время Межправительственной конференции 1956 года по Общему рынку и Евратому, проходившей здесь же, в Бельгии, состоялись дискуссии о европейском ядерно-энергетическом сообществе. С подписанием Договора о Евратоме во время Римских договоров в 1957 году было создано Европейское сообщество по атомной энергии, известное как Евратом, для создания единого общего рынка ядерной энергии."
 BELFA.4.d: "С началом войны на Корейском полуострове и принятием резолюции 84 Совета Безопасности ООН, разрешающей формирование единого командования, Бельгия считает целесообразным выделить как можно больше людей для продолжающихся полицейских операций. В Леопольдсбург прибыло до 2000 подходящих мужчин, чтобы присоединиться к командованию, и они должны быть проверены и обучены. Уже в 1951 году BUNC сможет развернуться в Корее."
 BELFA.5.d: "Несанкционированное и несправедливое вторжение в Южную Корею поддерживаемой Советским Союзом Северокорейской народной армии неприемлемо. Правительство Бельгии хочет выразить свое осуждение конфликта, заявил представитель на пресс-конференции по ситуации. Пресс-секретарь также сообщил, что в настоящее время министерство обороны Бельгии не планирует направлять какие-либо войска для помощи в операциях Организации Объединенных Наций."
 BELFA.6.d: "Поскольку Нидерланды понесли гораздо больший ущерб во время наводнения в Северном море в 1953 году, чем Бельгия, мы сделаем все возможное, чтобы поддержать наших голландских братьев на севере. Солдаты были отправлены для помощи в спасении, а также было создан Национальный фонд помощи. Все средства Бельгийского Красного Креста пойдут на восстановление голландских объектов."
 BELFA.7.d: "Город Брюссель с гордостью принимает у себя Всемирную выставку 1958 года, неофициально известную как «Экспо-58». Первая крупная международная выставка, проведенная после Второй мировой войны, была наиболее известна благодаря большому Атомиуму, а также павильону Бельгийского Конго и павильонам различных стран, таких как США, Советский Союз, Германия и Чехословакия. За шесть месяцев посетило более 41 миллиона посетителей , что делает Всемирную выставку весьма впечатляющей."
 BELFA.8.d: "В рамках подготовки к Всемирной выставке в Брюсселе, которая состоится в ближайшее время, бельгийское правительство заказало строительство нового здания под названием Атомиум, которое имеет форму кристаллической ячейки железа. С его фирменными металлическими сферами, соединенными различными лестницами, Атомиум станет памятником Брюсселю, хотя ожидается, что он не доживет до окончания Всемирной выставки."
 BELColonial.1.d: "Колониальная история Бельгии полна жестокости и противоречий. Из трех колоний и трех концессий, которыми владела или владеет Бельгия, Бельгийское Конго и Руанда-Урунди являются самыми печально известными. Сначала Конго принадлежало исключительно королю Леопольду II в 1880-х годах, а Конго было возвращено Бельгии в 1908 году после многих лет насилия со стороны официальных лиц Свободного государства Конго, которые использовали принудительный труд, убийства и нанесение увечий, чтобы сохранить контроль над потоком каучука и урана. из колоний. Участие конголезцев во Второй мировой войне очень помогло восточноафриканской кампании. Колония Руанда-Урунди также имеет большое значение, полученная в 1922 году после Первой мировой войны и теперь ставшая подопечной территорией ООН, находящейся под управлением Бельгии. Сохранение этой небольшой, но могущественной колониальной империи является сложной задачей, и, глядя на соседние колониальные державы, такие как Франция, поддержание стабильности и модернизации наших колоний, безусловно, будет подвигом человека."
 BELColonial.2.d: "После Второй мировой войны стало ясно, что Конго нужен новый экономический план, причем быстрый, чтобы ускорить новый современный экономический потенциал. Начиная с 1949 года был принят Десятилетний план, направленный на быстрые инвестиции и строительство транспортной инфраструктуры для замены устаревших систем. В колонии будет создано "Колониальное общество развития" для координации стратегических целей, а с внедрением новых производственных процессов уровень промышленного производства в колониях будет только увеличиваться, помогая снабжать страны по всему миру."
 BELColonial.3.d: "Центральный банк Бельгийского Конго и Руанды-Урунди, или CBBCRU, 1 июля 1952 г. сформировал центральный колониальный банк и обеспечил более стабильное финансовое будущее колоний. До этого Банк Англии взял на себя ответственность за выпуск банкнот из-за немецкой оккупации Бельгии, особенно во время Второй мировой войны. Это, наконец, передаст валюту в руки народа, а не иностранной державы, и объединит африканские колонии, облегчив получение кредитов или облигаций независимо от местоположения."
 BELColonial.4.d: "Политика Бельгии в отношении коренных народов меняется в связи с политическими и экономическими свободами наших колониальных подданных в Конго и Руанде-Урунди. Новый Королевский указ от 14 июля 1952 г. допускает большую политическую свободу во всех колониях, включая создание большого числа политических институтов, таких как провинциальные, районные и муниципальные представители туземцев, вплоть до Высшего совета, предназначенных для большего самоуправления среди коренных народов и меньшего иностранного вмешательства со стороны колониального правительства, хотя некоторые остатки должны оставаться для территориальной безопасности и благополучия. Король надеется, что этим указом не злоупотребляют, а свободно используют для продвижения демократических идеалов."
 BELColonial.5.d: "Его первое крупное начинание в качестве королевской семьи, король Бодуэн совершил государственный визит в Бельгийское Конго, посетив такие крупные города, как Леопольдвиль, Стэнливиль и Альбервиль. Во время своего визита он казался восторженным, а бесчисленные толпы подбадривали его, когда он путешествовал по улицам. В речи, произнесенной в столице Леопольдвилле, король отметил идеи генерал-губернатора относительно "бельгийско-конголезской общины". Иностранные наблюдатели отмечают, что во время визита все кажется нормальным, хотя в тени грохота профсоюзных прав, языковых различий и образования - вопросов, которые затрагивают Бельгию внутри страны; начинают поражать колонии"
 BELColonial.6.d: "Дискуссии о разнице в заработной плате между белыми европейцами и чернокожими местными рабочими задели самое сердце колониального правительства. Это произошло из-за притока образованных конголезцев, которые требуют равной оплаты труда для всех и сформировали Профсоюз вспомогательных государственных служащих (APIC) для решения этой проблемы. Кроме того, проблема заработной платы, затрагивающая большинство коренных конголезцев, переплетается с народным освободительным движением, которое представляет угрозу безопасности колониального правительства. Немедленно были начаты переговоры между канцелярией генерал-губернатора и APIC, чтобы обсудить разрыв в заработной плате и, как мы надеемся, снять некоторое давление на население."
 BELRec.1.d: "После окончания Второй мировой войны Бельгия добилась значительного прогресса в возмещении своих потерь во время немецкого вторжения и оккупации в 1940-1944 годах. После нашего освобождения были проведены реформы социального обеспечения, а также спрос на наши самые популярные экспортные товары, включая уголь, сталь и текстиль. Такие программы, как «Битва за уголь» и план Гутта, соответственно увеличили добычу угля и сократили денежную массу. Нехватка рабочей силы в Бельгии по-прежнему является серьезной проблемой, и предстоит еще много работы. Наша экономика улучшается, но могло бы быть и лучше, и мы должны продолжать работать для достижения этой высокой цели."
 BELRec.2.d: "Бельгия направила дипломатический контингент для подписания Парижского договора, который должен сформировать Европейское объединение угля и стали, первый межевропейский правительственный орган и открытый экономический рынок. Жан Монне из Франции должен стать первым председателем Высшего руководящего состава ЕОУС, а Бельгию будет представлять Поль Фине, бывший генеральный секретарь профсоюза ABVV и политик. Мы надеемся, что это партнерство сильно поможет нашей экономике, поскольку наш импорт угля и стали необходим на всем континенте."
 BELRec.3.d: "В рамках предложенного Соединенными Штатами плана взаимной помощи, известного как план Маршалла, Бельгия должна получить в общей сложности около 777 миллионов долларов помощи, которая будет использована для улучшения инфраструктуры, улучшения промышленности и производственных процессов, а также как поддержание нашей системы благосостояния, количества валюты и экспорта."
 BELRec.4.d: "Разработанный не кем иным, как Полем-Анри Спааком, Римский договор был подписан сегодня в Риме с участием представителей Западной Германии, Франции, Италии, Нидерландов и Люксембурга. Это ключевой основополагающий документ для европейского сотрудничества, поскольку он описывает основную структуру органа, известного как "Европейский союз". Мы надеемся, что этот договор только расширит ЕОУС и обеспечит большую экономическую свободу по всей Европе среди союзников."
 BELRec.5.d: "Мы выстояли в худшем периоде восстановления и сейчас значительно улучшаемся. Наша экономика стала сильнейшей в своей истории, и с помощью ECS, а теперь и EEC, подписания Римского договора и возможной интеграции в этот Европейский Союз мы выздоровели. Многое еще предстоит сделать в будущем, в связи с меняющимися временами."
 BELFlavor.1.d: "Жорж Проспер Реми, более известный как Эрж, — бельгийский карикатурист, наиболее известный своей серией комиксов "Приключения Тинтина"; считается одним из самых популярных европейских комиксов 20 века. Родившийся в Брюсселе, Эрж впервые начал рисовать карикатуры, проиллюстрировав бельгийский скаутский журнал Le Boy-Scout Belge в 1926 году. Вращаясь вокруг путешествий репортера Тинтина и его собаки Сноуи, а также других различных персонажей, Тинтин использовался в качестве консервативной пропаганды для детей. , используя поездки в Советский Союз как антисоциалистическую пропаганду и представляя коренных конголезцев в Бельгийском Конго детскими идиотами. После немецкого вторжения в Бельгию в 1940 году Эрге работал в коллаборационистской газете и после войны подвергся критике за поддержку немцев. В 1950 году была основана Studios Herge, чтобы упростить производство комиксов о Тинтине, особенно раскраски."
 BELFlavor.2.d: "После Второй мировой войны сцена бельгийских комиксов разделилась на две основные группы: голландские фламандцы и французские валлонцы, причем последние были более популярны в таких сериалах, как Tintin и Spirou и в журналах. Другие конкуренты включают ежедневные газетные комиксы во Фландрии и бумажные приложения на французском языке. Это обычно называют золотым веком бельгийских комиксов, отмеченным периодом постоянного роста и расширения."
 BELFlavor.3.d: "Хотя небольшая сцена фламандских комиксов не так популярна, как их франкоязычные аналоги, она по-прежнему важна для Бельгии. Никакие местные журналы не смогли бы сравниться с успехом Tintin или Spirou, но некоторые стали независимыми, например, 't Kapoentje, а также Jommeke, дебютировавший в 1955 году. Некоторые фламандские дизайнеры, следуя по стопам Berck, обратились к работе на место этого журнала на французском языке."
 BELFlavor.4.d: "Бельгийское телевидение существует с 1953 года и находится в ведении Национального бельгийского института радиораспространения (INR) или Бельгийского национального института радиовещания. Созданный по закону в июне 1930 года, INR отвечал за бельгийское радио до немецкого вторжения, когда оно было вынуждено прекратить вещание. Однако некоторым сотрудникам удалось бежать и сформировать Radio Belgique в Англии под управлением Национального управления радиораспространения в Бельгии, или RNB. После войны INR и RNB существовали вместе, пока они не были объединены Королевским указом в 1945 году в рамках INR. С тех пор INR внес свой вклад в создание Европейского вещательного союза в 1950 году и начал телевизионное вещание в 1953 году с двухчасовыми программами в день."
 BELFlavor.5.d: "Первые планы метрополитена в Брюсселе появились еще в 1890-х годах. После окончания Второй мировой войны возросла поддержка строительства подземных железнодорожных линий, поскольку для наземного автомобильного движения появилось больше места. Из-за постоянно растущего числа пробок между автомобилями и трамваями в 1954 году было создано Societe des Transports Intercommunaux des Bruxelles / Maatschappij voor het Intercommunaal Vervoer te Brussel (STIB/MIVB) для управления сетью трамваев, автобусов и метро в Брюсселе."
 BELFlavor.6.d: "Павильон Соединенных Штатов Америки на Экспо 58 довольно просторный, спроектированный архитектором Эдвардом Дуреллом Стоуном. Павильон с концертной площадкой для Симфонического оркестра Седьмой армии и Марширующего оркестра Калифорнийского университета, а также аттракционом 360-градусного кино, известным как Circarama, имел множество особенностей. В 1959 году этот павильон снова появится на Американской национальной выставке в Москве, а затем вернется в Соединенные Штаты в Диснейленд в Анахайме, штат Калифорния."
 BELFlavor.7.d: "В отличие от американского павильона, павильон Советского Союза представляет собой такое же большое и внушительное здание, которое по окончании выставки было свернуто и возвращено в Россию. Среди особенностей — модель атомного ледокола «Ленин», а также советские автомобили ГАЗ-13 «Чайка» и грузовик ГАЗ-53. В павильоне, удостоенном награды Гран-при, также была модель спутника «Спутник», который таинственным образом исчез, что привело к обвинениям в его краже Соединенными Штатами."
 BELFlavor.8.d: "Визит короля Бодуэна в Конго в 1959 году резко отличался от его предыдущего визита за четыре года до этого в 1955 году. После выступления 13 января с обещанием конголезской независимости король был закидан камнями по прибытии в Леопольдвиль чернокожими гражданами, недовольными тюремным заключением Патриса Лумумбы. При посещении других городов его прием был лучше, но монарх по-прежнему сталкивался с криками \"Немедленная независимость!\" Мы можем только надеяться, что этот кризис в наших колониях будет преодолен как можно скорее."
 BELFlavor.9.d: "2 июля 1959 года принц Альберт Льежский и итальянка Донна Паола Руффо ди Калабрия поженились в брюссельском соборе Св. Геделе. Впервые они встретились в 1958 году после коронации Папы Иоанна XXIII в Риме на приеме в посольстве Бельгии. Об их помолвке было объявлено в замке Лакен в 1959 году, и в июле они поженились, у них родилось трое детей."
  
 csp_wins: "Христианско-социальная партия победила на всеобщих выборах."
 bsp_wins: "Бельгийская социалистическая партия победила на всеобщих выборах."
