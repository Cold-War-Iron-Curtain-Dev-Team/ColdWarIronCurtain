l_english:
 taz.1.d: "Большинство жителей Занзибара - чернокожие африканцы. Несмотря на это, арабское меньшинство правит политическим ландшафтом как пережиток британского вмешательства в XIX веке. Но сегодня это изменилось. После всеобщих выборов 1963 года черные африканцы во главе с Джоном Окелло подняли восстание против султана и арабского меньшинства. Всего за три часа 300-600 африканских солдат захватили полицейские участки и правительственные здания, вынудив султана бежать из страны. Однако некоторые люди воспользовались возможностью, чтобы отомстить арабам, убив от 5000 до 12000 человек"
 taz.2.d: "Слияние Танзании и Занзибара."