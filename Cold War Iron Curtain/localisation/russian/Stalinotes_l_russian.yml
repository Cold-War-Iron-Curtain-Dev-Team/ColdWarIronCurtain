l_english:
 cw_stalinotes.0.t: ""
 cw_stalinotes.0.d: ""
 cw_stalinotes.0.a: ""
 cw_stalinotes.0.b: ""
 cw_stalinotes.1.t: ""
 cw_stalinotes.1.d: "Советский Союз прислал нам договор. Они заявляют, что Западная и Восточная Германии могут объединиться в одну нейтральную страну, если мы согласимся. Нейтральная Германия также не будет вступать ни в какие союзы. Хотя, это, скорее всего, не продлится долго. Нейтральная Германия также сможет сформировать свою собственную армию. Это может предоставить СССР некоторое преимущество в обороне, потому что нейтральная Германия будет для по сути буферной зоной. Однако некоторые наши советники говорят, что это поможет остановить возможную Третью мировую войну, которая может начаться как раз с Германии. Что мы скажем советам?"
 cw_stalinotes.1.a: ""
 cw_stalinotes.1.b: "Нет, это больше сыграет на руку коммунистам, чем нам."
 cw_stalinotes.2.t: "НАТО отказывает Сталину"
 cw_stalinotes.2.d: "Американцы и НАТО сказали \"нет\" Ноте Сталина. Они заявляют, что это будет помогать больше нам, чем им. Нейтральная объединенная Германия может увеличить наши возможности обороны в Европе ещё больше. Должны ли мы в ответ предложить пересмотренную ноту Сталина или вовсе отказаться от этой затеи?"
 cw_stalinotes.2.a: "Отправьте НАТО пересмотренную ноту"
 cw_stalinotes.2.b: "Отказаться от данной идеи. Мы никуда не уйдем. Германия должна остаться разделенной."
 cw_stalinotes.2.c: "Небольшое давление со стороны нашей армии наверняка заставит их передумать."
 cw_stalinotes.3.t: ""
 cw_stalinotes.3.d: "СССР прислал нам вторую и переработанную Сталинскую ноту. Они заявляют, что в Германии могут быть проведены свободные выборы, но ценой ограничения армии. Что же мы теперь скажем об этом?"
 cw_stalinotes.3.a: ""
 cw_stalinotes.3.b: ""
 cw_stalinotes.4.t: "Вторая Сталинская нота была отвергнута НАТО"
 cw_stalinotes.4.d: "НАТО снова отказалось от Ноты Сталина. У нас нет выбора, они настойчиво продолжают играть одну и ту же песню про полноценную армию для нейтральной Германии. Однако мы могли бы попробовать припугнуть их нашей армией, дабы заставить сесть за стол переговоров. Нота Сталина по итогу оказалась своего рода провалом, и мы могли бы отменить её, пока ситуация не стала ещё хуже."
 cw_stalinotes.4.a: "Отправить последний вариант Сталинской ноты."
 cw_stalinotes.4.b: "Отозвать ноту Сталина"
 cw_stalinotes.4.c: ""
 cw_stalinotes.5.t: "Последняя нота Сталина"
 cw_stalinotes.5.d: "СССР прислал нам последнюю ноту Сталина. Она включает в себя все, что было до того, как мы разошлись во мнениях. Они заявили, что готовы вернуть нейтральной Германии границы 1937 года, но все остальное остается прежним. Они поставили нас перед фактом, что если мы скажем \"нет\", они больше не ответят. Это что, какая-то сделка? Что же нам делать?"
 cw_stalinotes.5.a: "Договор о границе 1937 года."
 cw_stalinotes.5.b: ""
 cw_stalinotes.6.t: ""
 cw_stalinotes.6.d: "НАТО и СССР составили договор о единой Германии в рамках ноты, посланной Сталиным. В договоре говорится, что Федеративная Республика Германия и Германская Демократическая Республика будут объединены под одним нейтральным немецким государством. Нам будет позволено иметь армию, но мы не сможем вступить ни в какие альянсы. У нас тоже будут свободные выборы. Наша граница все равно останется прежней. Принимаем мы Сталинскую ноту или нет?"
 cw_stalinotes.6.a: ""
 cw_stalinotes.6.b: "Мы будем вести переговоры о более выгодных для нас вариантах. Отправить дипломата в СССР."
 cw_stalinotes.6.c: "Нам нужно утвердиться на Западе. Этот договор не сработает, отняв у нас лишь только нужное нам время."
 cw_stalinotes.7.t: "Сталинская нота дарует объединение!"
 cw_stalinotes.7.d: "И Западная, и Восточная Германия согласились на создание единого германского государства. В ноте Сталина говорится, что Германия будет единой, будет иметь свободные выборы, наблюдаемые другими странами, а также регулярную армию, ту же границу и никаких союзов. НАТО и Варшавский договор согласовали эту сделку вместе. Немецкий народ ликует по поводу своего воссоединения. Мы надеемся, что это положит начало эре мира в Европе."
 cw_stalinotes.7.a: ""
 cw_stalinotes.8.t: ""
 cw_stalinotes.8.d: "ФРГ направила дипломата для обсуждения Сталинской ноты. Они требуют, чтобы до линии Одер-Нейсе были присоединены обратно к Германии по границе 1937 года. Они также настаивают на самостоятельном избрании альянса и свободных выборах. Должны ли мы принять оба их требования, принять одно или другое или отклонить все просьбы?"
 cw_stalinotes.8.a: "Мы согласны организовать границу по образцу 1937 года и предоставить Германии возможность свободно выбрать желаемый альянс."
 cw_stalinotes.8.b: "Предоставьте Германии границы 1937 года в обмен на ее нейтралитет."
 cw_stalinotes.8.c: ""
 cw_stalinotes.9.t: ""
 cw_stalinotes.9.d: "Мы стали свидетелями увеличения количества радиопереговоров и передвижения советских войск в Восточной Германии. Наши самолеты-разведчики и шпионы это подтвердили. Советские войска были замечены на западногерманской границе, делая вид, будто собираются атаковать. Даже на блокпосту Чарли советские танки стоят прямо напротив наших солдат. Они, очевидно, делают это из-за того, что мы отрицаем посылаемые ими Сталинские ноты. Стоит ли нам показать и наши зубы, или лучше проигнорировать? Что же нам делать?"
 cw_stalinotes.9.a: ""
 cw_stalinotes.9.b: "Игнорировать СССР."
 cw_stalinotes.10.t: ""
 cw_stalinotes.10.d: "Американцы уже развернули свою технику и солдат. Похоже, мы завладели их вниманием. Теперь мы можем сказать им, чего хотим. Мы могли бы послать последнюю ноту протеста, но опять же некоторые советники говорят, что если НАТО отказалось от первых двух, то и в этой нет никакого смысла. Если мы пошлем последнюю ноту Сталина, то независимо от того, каков будет их ответ, мы больше посылать им ничего не будем. Как нам поступить?"
 cw_stalinotes.10.a: ""
 cw_stalinotes.10.b: "Прекратите все операции. Нота оказалась неудачной."
 cw_stalinotes.10.c: "Переворот в Западной Германии поспособствует нашим планам."
 cw_stalinotes.10.dd: "Никакие варианты не работают. Кровь будет пролита."
 cw_stalinotes.11.t: "[GetNewspaperHeader]Сталинская нота дарует объединение!"
 cw_stalinotes.11.desc: "И Западная, и Восточная Германия согласились на создание единого германского государства. В ноте Сталина говорится, что Германия будет единой, будет иметь свободные выборы, наблюдаемые другими странами, а также регулярную армию, ту же границу и никаких союзов. НАТО и Варшавский договор согласовали эту сделку вместе. Немецкий народ ликует по поводу своего воссоединения. Мы надеемся, что это положит начало эре мира в Европе."
 cw_stalinotes.11.a: ""
 cw_stalinotes.11.b: "Единая Германия"
 cw_stalinotes.11.c: ""
 cw_stalinotes.11.d: ""
 cw_stalinotes.12.t: ""
 cw_stalinotes.12.d: "Советские и американские войска находятся в тупике в Германии. То, что началось с развертывания советами новой военной техники и войск в Восточной Германии, было сделано и американцами. На контрольно-пропускном пункте Чарли в Западном Берлине советские и американские танки и солдаты уже несколько часов стоят лицом друг к другу. Советы сказали, что это яркий пример того, как полномасштабная война может вспыхнуть в Германии из-за отсутствия единого государства, и именно поэтому Сталинская нота должна быть подписана, чтобы спасти мир от возможного разрушения."
 cw_stalinotes.12.a: ""
 cw_stalinotes.12.b: ""
 cw_stalinotes.12.c: ""
 cw_stalinotes.13.t: "[GetNewspaperHeader]Противостояние в Германии заканчивается!"
 cw_stalinotes.13.d: "После нескольких напряженных дней американские и советские войска отошли от границы. Советский Союз заявил, что нет смысла нагнетать обстановку, потому что НАТО не при каких обстоятельствах не примет ноту Сталина. Советский Союз также заявил, что будущее мира просто потускнело из-за отсутствия какого-либо консенсуса по вопросу единения Германии. Кризис Сталинской ноты, похоже, подходит к концу."
 cw_stalinotes.13.a: ""
 cw_stalinotes.13.b: ""
 cw_stalinotes.13.c: "Третья мировая война своих свеч не стоит. Мы попробуем договориться в другой раз."
 cw_stalinotes.14.t: ""
 cw_stalinotes.14.d: "В Германии разразилась война. Мы не знаем, кто стрелял первым, но войска вдоль немецкой границы сейчас рвут друг друга на части. Советские танки и мотопехота были замечены продвигающимися через Фульдский коридор, в то время как силы НАТО удерживают советское наступление в Южной Германии. Будет ли эта война обычной как и прежде, или наш маленький мир ждет то, чего он никогда в жизни не видел?"
 cw_stalinotes.14.a: ""
 cw_stalinotes.14.b: ""
 cw_stalinotes.14.c: ""
 cw_stalinotes.15.t: ""
 cw_stalinotes.15.desc: "СССР и ГДР договорились с ФРГ и НАТО о создании единого нейтрального германского государства. Германия будет иметь доступ к членству в любых альянсах. Граница 1937 года, которой раньше владела Германия, теперь будет ей возвращена. Польша ведет переговоры с немцами о снятии линии Одер-Нейсе. Будем надеяться, что это возвестит о наступлении новой эры мира в Европе."
 cw_stalinotes.15.a: "Мир на нашем веку."
 cw_stalinotes.15.b: "Наконец-то единство."
 cw_stalinotes.15.c: ""
 cw_stalinotes.15.d: "Это великая победа мира."
 cw_stalinotes.16.t: "[GetNewspaperHeader]Конец нотам Сталина"
 cw_stalinotes.16.d: "СССР заявил, что больше никаких нот не будет. Они заявили, что признали, что НАТО не хочет единой Германии и обрекло будущее мира из-за войны, которая, возможно, разразится в немецком регионе из-за разделенной Германии. СССР также заявил, что они открыты для нескольких путей мирного урегулирования для объединенной Германии, но НАТО просто не хочет этого. НАТО заявило, что направляемые ноты были несправедливы по отношению к НАТО и односторонни по отношению к СССР. Они также заявили, что линия Одер-Ниссе не была согласована из-за того, что НАТО заявило, что эта линия является временной границей и будет возвращена Германии, но СССР этого не сделал. Похоже, этот кризис закончился."
 cw_stalinotes.16.a: "Нас ждет еще один кризис?"
 cw_stalinotes.16.b: "Нота была несправедливой"
 cw_stalinotes.16.c: "Мы предложили НАТО оливковую ветвь с голубями, а они отказались."
 cw_stalinotes.17.t: ""
 cw_stalinotes.17.d: "В Западной Германии разразилась гражданская война. Повстанцы, выступающие за нейтралитет заявили, что Западная Германия должна порвать с вестернизацией и сосредоточиться на внутренних проблемах. Они поддерживают нейтральную объединенную Германию и хотят, чтобы Западная Германия приняла ноту, отправленную Сталиным западным державам. В свою очередь НАТО заявило, что это восстание должно быть как-то связано с СССР, но у них нет доказательств. Повстанцы захватили несколько городов и блокировали вход любых сил НАТО. Альянс заявил, что боевые операции в Западной Германии уже начались и что они помогут ФРГ подавить эту попытку переворота."
 cw_stalinotes.17.a: ""
 cw_stalinotes.17.b: ""
 cw_stalinotes.17.c: ""