 cw_stalinotes.0.t: ""
 cw_stalinotes.0.d: ""
 cw_stalinotes.0.a: ""
 cw_stalinotes.0.b: ""
  
 cw_stalinotes.1.t: "Нота Сталина"
 cw_stalinotes.1.d: "Советский Союз прислал нам договор. Они сказали, что западная и Восточная Германия объединятся в одну нейтральную страну, если мы согласимся. Нейтральная Германия также не будет иметь никаких союзов. Это, скорее всего, не продлится долго. Нейтральная Германия также сможет сформировать армию. Теперь это поможет советам в защите, потому что эта нейтральная Германия будет для них буферной зоной. Хотя некоторые наши советники говорят, что это поможет остановить войну, которая, как мы надеемся, разразится в Германии. Что мы скажем советам?"
 cw_stalinotes.1.a: "Это звучит как хорошая сделка. Сообщите об этом немцам."
 cw_stalinotes.1.b: "Нет, это помогает красным больше, чем нам."
  
 cw_stalinotes.2.t: "НАТО говорит Сталину нет"
 cw_stalinotes.2.d: "Американцы и НАТО сказали "нет" Ноте Сталина. Они сказали, что это поможет нам больше, чем им. Нейтральная Германия защитит нас ещё больше. Должны ли мы предложить пересмотренную ноту Сталина или отказаться от этой затеи?"
 cw_stalinotes.2.a: "Направьте в НАТО пересмотренную ноту."
 cw_stalinotes.2.b: "Удалить Примечание. Мы не сдвинемся с этого места. Германия просто должна будет остаться разделенной."
 cw_stalinotes.2.c: "Небольшое военное давление наверняка заставит их передумать."
  
 cw_stalinotes.3.t: "Вторая Нота Сталина"
 cw_stalinotes.3.d: "СССР прислал нам вторую и переработанную Сталинскую ноту. Они сказали, что там могут быть свободные выборы, но ценой ограниченной армии тогда. Что же мы теперь скажем об этом?"
 cw_stalinotes.3.a: "Сделка нас вполне устраивает."
 cw_stalinotes.3.b: "Эта сделка все ещё несправедлива."
  
 cw_stalinotes.4.t: "Вторая Сталинская нота опровергнута НАТО"
 cw_stalinotes.4.d: "НАТО снова отказалось от Ноты Сталина. У нас нет выбора, и они продолжают хотеть того же самого. Они хотят иметь полноценную армию для нейтральной Германии. Однако мы могли бы попробовать военный вариант, чтобы заставить их сесть за стол переговоров. Нота Сталина также была своего рода провалом, и мы могли бы отменить её, пока ситуация не стала ещё хуже."
 cw_stalinotes.4.a: "Отправить окончательную Сталинскую ноту."
 cw_stalinotes.4.b: "Отзовите ноту Сталина."
 cw_stalinotes.4.c: "Небольшое военное давление, несомненно, заставит их изменить свое мнение."
  
 cw_stalinotes.5.t: "Заключительная нота Сталина"
 cw_stalinotes.5.d: "СССР прислал нам последнюю ноту Сталина. Она включает в себя все, что было до того, как мы разошлись во мнениях. Они заявили, что готовы вернуть нейтральной Германии границы 1937 года, но все остальное остается прежним. Они сказали, что если мы скажем "нет", они больше не ответят. Это что-то вроде сделки для нас? Что же нам делать?"
 cw_stalinotes.5.a: "Мы договариваемся о границе 1937 года."
 cw_stalinotes.5.b: "Ответ по-прежнему отрицательный."
  
 cw_stalinotes.6.t: "Сталинская Нота согласована с НАТО"
 cw_stalinotes.6.d: "НАТО и СССР договорились о договоре под названием "Сталинская Нота". В договоре говорится, что Федеративная Республика Германия и Германская Демократическая Республика будут объединены под нейтральным немецким государством. Нам будет позволено иметь армию, но мы не сможем вступить ни в какие союзы. У нас тоже будут свободные выборы. Наша граница все равно останется прежней. Принимаем мы Сталинскую ноту или нет?"
 cw_stalinotes.6.a: "Мы принимаем этот договор об объединении. Одна Германия для всех немцев."
 cw_stalinotes.6.b: "Мы будем вести переговоры о более выгодном договоре. Отправить дипломата в СССР."
 cw_stalinotes.6.c: "Нам нужно утвердиться на Западе. Этот договор не сработает и займет слишком много времени."
  
 cw_stalinotes.7.t: "Сталинская Нота Дарует Объединение!"
 cw_stalinotes.7.d: "И Западная, и Восточная Германия согласились на создание единого германского государства. В ноте Сталина говорится, что Германия будет единой, будет иметь свободные выборы, которые будут контролироваться, постоянную армию, ту же границу и никаких союзов. НАТО и Варшавский договор согласовали этот договор вместе. Немецкий народ ликует по поводу единого немецкого государства. Мы надеемся, что это положит начало эре мира в наше время."
 cw_stalinotes.7.a: "Единая Германия"
  
 cw_stalinotes.8.t: "Обсуждение Сталинской ноты"
 cw_stalinotes.8.d: "ФРГ направила дипломата для обсуждения Сталинской ноты. Они хотят потребовать, чтобы линия Одер-Нейсе была присоединена обратно к Германии под границей 1937 года. Они также настаивают на системе альянсов, которую они могут выбрать, и свободных выборах. Должны ли мы принять их обоих, принять одно или другое или отклонить все просьбы?"
 cw_stalinotes.8.a: "Мы предоставим немецкую границу 1937 года и систему альянсов."
 cw_stalinotes.8.b: "Дайте границы 1937 года в обмен на нейтральную Германию."
 cw_stalinotes.8.c: "Мы не примем ничего из этого. Сталинская нота не изменится."
  
 cw_stalinotes.9.t: "Советские войска развернуты"
 cw_stalinotes.9.d: "Мы стали свидетелями увеличения радиопереговоров и передвижения советских войск в Восточной Германии. Наши самолеты-разведчики и шпионы это подтвердили. Советские войска были замечены на западногерманской границе, выглядя так, как будто они собираются атаковать. Даже на блокпосту Чарли советские танки стоят прямо напротив наших солдат. Они, очевидно, делают это из-за того, что мы отрицаем Ноты Сталина. Разворачиваем ли мы свои войска или игнорируем это? Что же нам делать?"
 cw_stalinotes.9.a: "Разверните наши войска и технику."
 cw_stalinotes.9.b: "Игнорировать Советы."
  
 cw_stalinotes.10.t: "Американские войска"
 cw_stalinotes.10.d: "Американцы уже развернули свою технику и солдат. Похоже, теперь мы завладели их вниманием. Теперь мы можем сказать им, чего хотим. Мы могли бы послать последнюю ноту протеста, но опять же некоторые советники говорят, что если НАТО откажется от первых двух, то в этом нет никакого смысла. Если мы пошлем последнюю записку Сталину, то независимо от того, каков будет их ответ, мы не пошлем другой записки. Что же нам теперь делать?"
 cw_stalinotes.10.a: "Отправить окончательную Сталинскую ноту"
 cw_stalinotes.10.b: "Прекратите все операции. Нота оказалась неудачной"
 cw_stalinotes.10.c: "Переворот в Западной Германии поможет этому делу."
 cw_stalinotes.10.dd: "Все варианты не сработают. Кровь должна пролиться."
  
 cw_stalinotes.11.t: "[GetNewspaperHeader]Сталинская Нота Дарует Объединение!"
 cw_stalinotes.11.desc: "И Западная, и Восточная Германия согласились на создание единого германского государства. В ноте Сталина говорится, что Германия будет единой, будет иметь свободные выборы, которые будут контролироваться, постоянную армию, ту же границу и никаких союзов. НАТО и Варшавский договор согласовали этот договор вместе. Немецкий народ ликует по поводу единого немецкого государства. Мы надеемся, что это положит начало эре мира в наше время."
 cw_stalinotes.11.a: "Мир в наше время."
 cw_stalinotes.11.b: "Елиная Германия"
 cw_stalinotes.11.c: "Настало время для единой Германии."
 cw_stalinotes.11.d: "Это нейтральное буферное государство нам очень поможет."
  
 cw_stalinotes.12.t: "[GetNewspaperHeader]Противостояние в Германии!"
 cw_stalinotes.12.d: "Советские и американские войска находятся в тупике в Германии. То, что началось с развертывания советами новой военной техники и войск в Восточной Германии, американцы последовали их примеру. Даже на контрольно-пропускном пункте Чарли в Западном Берлине советские и американские танки и солдаты стоят лицом друг к другу. Советы сказали, что это пример того, как война может вспыхнуть в Германии из-за разделенной Германии, и именно поэтому Сталинская нота должна быть подписана, чтобы спасти мир от разрушения."
 cw_stalinotes.12.a: "Разразится ли Третья мировая война?"
 cw_stalinotes.12.b: "Мы не будем отступать."
 cw_stalinotes.12.c: "Американцы играют с огнём."
  
 cw_stalinotes.13.t: "[GetNewspaperHeader]Противостояние заканчивается в Германии!"
 cw_stalinotes.13.d: "После нескольких напряженных дней американские и советские войска отошли от границы. Советский Союз заявил, что нет смысла нагнетать обстановку, потому что НАТО не примет ноту Сталина. Советский Союз также заявил, что будущее мира просто потускнело из-за отсутствия мирного договора, подписанного для единой Германии. Кризис Сталинской ноты, похоже, подходит к концу."
 cw_stalinotes.13.a: "Смогут ли они когда-нибудь поладить?"
 cw_stalinotes.13.b: "Мы знали, что они отступят."
 cw_stalinotes.13.c: "Третья Мировая Война того не стоит. Мы попробуем ещё в другой раз."
  
 cw_stalinotes.14.t: "[GetNewspaperHeader]В Германии начинается война!"
 cw_stalinotes.14.d: "Война разразилась в Германии. Мы не знаем, кто стрелял первым, но войска вдоль немецкой границы сейчас находятся в состоянии войны. Советские танки и мотопехота были замечены проносящимися через Фульдскую брешь, в то время как силы НАТО удерживали советское наступление в Южной Германии. Будет ли эта война обычной войной или ядерной войной?"
 cw_stalinotes.14.a: "Да поможет нам Бог."
 cw_stalinotes.14.b: "Мы будем защищать Западную Германию!"
 cw_stalinotes.14.c: "Мы освободим Запад!"
  
 cw_stalinotes.15.t: "[GetNewspaperHeader]Нейтральная Германия объединилась в границах 1937 года!"
 cw_stalinotes.15.desc: "СССР и ГДР договорились с ФРГ и НАТО о создании единого нейтрального германского государства. Германия будет иметь доступ к членству в любых союзах. Граница 1937 года, которой раньше владела Германия, теперь возвращена Германии. Польша ведет переговоры о снятии линии Одер-Ниссе с них и с Германией. Будем надеяться, что это возвестит о наступлении новой эры мира в Европе."
 cw_stalinotes.15.a: "Мир в наше время."
 cw_stalinotes.15.b: "Наконец-то мы едины."
 cw_stalinotes.15.c: "Это великая победа мира."
 cw_stalinotes.15.d: "Это великая победа мира."
  
 cw_stalinotes.16.t: "[GetNewspaperHeader]Конец Нотам Сталина"
 cw_stalinotes.16.d: "СССР заявил, что больше никаких нот не будет. Они заявили, что признали, что НАТО не хочет единой Германии и обрекло будущее мира из-за войны, которая, возможно, разразится в немецком регионе из-за разделенной Германии. СССР также заявил, что они открыты для нескольких путей мирного урегулирования для объединенной Германии, но НАТО просто не хочет этого. НАТО заявило, что направляемые ноты были несправедливы по отношению к НАТО и односторонни по отношению к СССР. Они также заявили, что линия Одер-Ниссе не была согласована из-за того, что НАТО заявило, что эта линия является временной границей и будет возвращена Германии, но СССР этого не сделал. Похоже, этот кризис закончился."
 cw_stalinotes.16.a: "Случится ли еще один кризис?"
 cw_stalinotes.16.b: "Записка была несправедливой"
 cw_stalinotes.16.c: "Мы предложили НАТО оливковую ветвь, и они сказали "нет"."
  
 cw_stalinotes.17.t: "[GetNewspaperHeader]Гражданская война в Германии!"
 cw_stalinotes.17.d: "В Западной Германии разразилась гражданская война. Нейтральные повстанцы заявили, что Западная Германия должна порвать с вестернизацией и сосредоточиться на внутренних проблемах. Они поддерживают нейтральную объединенную Германию и хотят, чтобы Западная Германия приняла Ноту Сталина. НАТО заявило, что это должно быть как-то связано с поддержкой СССР повстанцев, но у них нет доказательств. Нейтральные повстанцы захватили несколько городов и блокировали вход любых сил НАТО. НАТО заявило, что боевые операции начнутся в Западной Германии и что они помогут Западной Германии подавить восстание."
 cw_stalinotes.17.a: "Кто победит в Гражданской войне?"
 cw_stalinotes.17.b: "Мы в любом случае поможем Западной Германии."
 cw_stalinotes.17.c: "Наш план работает."
  
  
