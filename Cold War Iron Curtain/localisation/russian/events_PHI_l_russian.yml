l_english:
 philippines.2.t: "[GetNewspaperHeader]Хукбалахапское восстание терпит неудачу!"
 philippines.2.d: "Филиппины объявили о победе в подавлении восстания Хукбалахап и осталось лишь уничтожить последние силы повстанцев. Оставшиеся силы сбежали в горы. Филиппины и НАТО назвали это победой в сдерживании распространения коммунизма в других частях Азии. Хукбалахап сказал, что они вернутся, когда придет время. Пока что восстание окончено и мир на Филиппинах наступил."
 philippines.2.a: "Интересно"
 philippines.2.b: "Страна теперь объединена."
 philippines.3.t: "[GetNewspaperHeader]Хукбалахапское восстание оказалось успешно!"
 philippines.3.d: "Филиппинская столица Манила пала сегодня перед войсками Хукбалахапа после долгой битвы. Филиппинские войска сломлены и покинули столицу. Силы хукбалахапов захватили Манилу и объявили Народную Республику Филиппины. Силы Хукбалахап продвинулись к югу от Манилы на другие острова, но повстанцы, преследующие филиппинские правительственные силы, испытывают трудности. Силы хукбалахапов побеждают в своем восстании, и кажется, что Филиппины падут. НАТО и Филиппины назвали это провалом, но не оставят надежды сдержать его."
 philippines.3.a: "Что теперь будет?"