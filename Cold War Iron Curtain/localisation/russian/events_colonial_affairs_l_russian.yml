l_english:
 colonial_affairs: "Дела колоний"
 colonial_affairs_desc: "Управляйте §Cколониальными владениями§! \nлибо усиливая власть  \nколоний либо улучшая им экономику. \n\nВ быстро меняющемся новом мировом порядке и после \nвойны, направленной на поражение тирании и \nавтократии, возможно, было бы умеренно лицемерным \nугнетать коренных жителей этих земель."
 end_cameroon_mandate_uk: "Конец мандата - британский Камерун"
 end_togo_mandate_uk: "Конец мандата - британское Того"
 end_tanganyika_mandate: "Конец мандата - Таньганьика"
 cocos_islands_act: "Акт о Кокосовых островах"
 christmas_island_act: "Акт об Острове Рождества"
 terminate_british_trucial_sheikhdoms_treaty: "Расторгнуть договор о перемирии между британскими шейхами"
 decolonization.2.t: "Деколонизация британского Камеруна"
 decolonization.2.d: "Поскольку мы еще не деколонизировали британский Камерун, наш мандат уже истек, и статус этой территории будет обсуждаться с Нигерией и Камеруном."
 decolonization.2.a: "Хорошо."
 decolonization.4.t: "Деколонизация британского Того"
 decolonization.4.d: "Поскольку мы еще не деколонизировали британский Того, наш мандат истек, и эта территория будет интегрирована в состав Ганы."
 decolonization.4.a: "Хорошо."
 decolonization.8.t: "Деколонизация Таньганьики"
 decolonization.8.d: "Поскольку мы еще не деколонизировали Танганьику, наш мандат истек, и Танганьике будет предоставлена независимость."
 decolonization.8.a: "Хорошо."
 decolonization.10.t: "Малайский Вопрос"
 decolonization.10.d: "Настало время заняться вопросом деколонизации Северного Борнео. У нас есть 2 выбора. Малазийский план пользуется поддержкой большинства людей и предполагает объединение Сингапура и колоний Северного Борнео, исключая Бруней, с Малайей, чтобы сформировать Малайзию. План Северного Борнео одобряется Народной партией Брунея и предполагает объединение колоний Северного Борнео с Брунеем для образования Федерации Северного Борнео, причем только Сингапур присоединяется к Малайзии."
 decolonization.10.a: "Малазийский план"
 decolonization.10.b: "План Северного Борнео"
 decolonization.11.t: "Акт о независимости Малайи"
 decolonization.11.d: "Парламент принял акт о независимости Малайи, вынудив нас отменить Малайский колониальный статус и предоставить им суверенитет."
 decolonization.11.a: "Мы желаем им успехов!"
 decolonization.12.t: "Акт о независимости Гайаны"
 decolonization.12.d: "Парламент принял м о независимости Гайаны, вынудив нас предоставить независимость королевской колонии Гвианы и превратить ее в кооперативную Республику Гайана."
 decolonization.12.a: "Мы желаем им успехов!"
 decolonization.13.t: "Акт о независимости Белиза"
 decolonization.13.d: "Парламент принял акт о независимости Белизе, вынудив нас предоставить независимость королевской колонии британского Гондураса и превратить ее в Белиз."
 decolonization.13.a: "Мы желаем им успехов!"
 decolonization.14.t: "Акт о независимости Королевства Лесото"
 decolonization.14.d: "Парламент принял акт о королевстве Лесото, который обязывает нас предоставить независимость королевской колонии Басутоленд и превратить ее в Лесото."
 decolonization.14.a: "Мы желаем им успехов!"
 decolonization.16.t: "Договор о британских арабских странах истек"
 decolonization.16.d: "Договоры, которые мы подписали с правителями стран, Катара и Бахрейна, уже истекли, и теперь нам придется предоставить независимость этим арабским государствам."
 decolonization.16.a: "Мы желаем им успехов!"
 decolonization.17.t: "Чрезвычайная ситуация в Адене"
 decolonization.17.d: "Наши колонии в Адене переживают тяжелые времена. Крайне левые партизаны начинают мятеж на наших территориях с целью достижения независимости. Чтобы облегчить эту проблему наши колониальные администраторы реформируют колониальную администрацию в регионе."
 decolonization.17.a: "Эти чертовы коммунисты!"
 decolonization.18.t: "Акт о независимости Мальты"
 decolonization.18.d: "В настоящее время парламент обсуждает и голосует по законопроекту о предоставлении независимости королевской колонии Мальты. Однако сама Мальта расколота между независимостью и интеграцией как заморская территория. Мы могли бы вмешаться в законодательный процесс."
 decolonization.18.a: "Действуйте как скажет парламент!"
 decolonization.18.b: "Мальта, как заморская территория!"
 decolonization.19.t: "Акт о независимости Багам"
 decolonization.19.d: "Парламент принял Акт о независимости Багамских островов, вынудив нас предоставить независимость королевской колонии Багамских островов и превратить ее в Содружество Багамских островов."
 decolonization.19.a: "Мы желаем им успехов!"
 decolonization.20.t: "Лондонско-Цюрихские соглашения"
 decolonization.20.d: "После интенсивного этнического насилия в Лондоне и Цюрихе были проведены переговоры по урегулированию кипрского кризиса. В настоящее время переговоры пришли к выводу, что единая республика Кипр будет образована как греками, так и турками, а Акротири и Декелия станут британскими военными базами."
 decolonization.20.a: "Создание Республики Кипр"
 decolonization.20.b: "Это несправедливо!"
 decolonization.21.t: "Акт о независимости Ботсваны"
 decolonization.21.d: "Парламент принял Акт о независимости Ботсваны, вынудив нас предоставить независимость протекторату Бечуаналенд и превратить его в Республику Ботсвана."
 decolonization.21.a: "Мы желаем им успехов!"
 decolonization.22.t: "Акт о независимости Замбии"
 decolonization.22.d: "Парламент принял акт о независимости Замбии, вынудив нас предоставить независимость Северной Родезии и превратить ее в Республику Замбия."
 decolonization.22.a: "Мы желаем им успехов!"
 decolonization.23.t: "Акт о независимости Малави"
 decolonization.23.d: "Парламент принял акт о независимости Малави, вынудив нас предоставить независимость Ньясаленду и превратить его в Республику Малави."
 decolonization.23.a: "Мы желаем им успехов!"
 decolonization.24.t: "Государство Сомалиленд"
 decolonization.24.d: "После многолетней подготовки колониальных администраторов Британский протекторат Сомалиленд получил независимость и был преобразован в государство Сомалиленд, поскольку переговоры об объединении с Сомали все еще продолжаются."
 decolonization.24.a: "Я и забыл, что у нас есть эта колония!"
 manage_french_cameroons: "Управление французский Камерун"
 end_togo_mandate_france: "Распустить мандат - французское Того"
 colonial.1.t: "Деколонизация французского Камеруна"
 colonial.1.d: "Поскольку мы еще не деколонизировали французский Камерун, наш мандат истек, и сегодня Камерун получит независимость."
 colonial.1.a: "Хорошо.."
 colonial.2.t: "Французский Камерун"
 colonial.2.d: ""
 colonial.2.a: "Деколонизировать"
 colonial.2.b: "Закрыть"
 decolonization.3.t: "Деколонизация французского Того"
 decolonization.3.d: "Поскольку мы еще не деколонизировали французское Того, наш мандат истек, и сегодня Того получит независимость."
 decolonization.3.a: "Хорошо.."
 decolonization.15.t: "Мадридские соглашения"
 decolonization.15.d: "Давление нарастает. Наши владения в Западной Сахаре подвергаются серьезному давлению со стороны Марокко, Мавритании и международного сообщества, требующего их деколонизации. Марокко и Мавритания выдвигают территориальные требования, и партизаны Фронта Полисарио сеют хаос на этой территории. Мы должны решить этот вопрос прямо сейчас."
 decolonization.15.a: "Вывести войска из Западной Сахары"
 decolonization.15.b: "Уступки Мавритании"
 decolonization.15.c: "Отказаться от переговоров"
 end_nauru_mandate: "Распустить мандат - Науру"
 end_papua_new_guinea_mandate: "Распустить мандат - Папуа - Новая Гвинея"
 decolonization.5.t: "Деколонизация Науру"
 decolonization.5.d: "Поскольку мы еще не деколонизировали Науру, наш мандат истек, и сегодня Науру получит независимость."
 decolonization.5.a: "Хорошо.."
 decolonization.9.t: "Деколонизация Папуа - Новой Гвинеи"
 decolonization.9.d: "Поскольку мы еще не деколонизировали Папуа - Новую Гвинею, наш мандат истек, и сегодня Папуа - Новая Гвинея получит независимость."
 decolonization.9.a: "Хорошо.."
 end_ruanda_urundi_mandate: "Распустить мандат - Руанда - Урунди"
 decolonization.6.t: "Деколонизация Руанды - Урунди"
 decolonization.6.d: "Поскольку мы еще не деколонизировали Руанду-Урунди, наш мандат истек, и сегодня Руанда и Бурунди получат независимость."
 decolonization.6.a: "Хорошо.."
 decolonization.7.t: "Бельгийское Конго провозглашает независимость"
 decolonization.7.d: "Конференция по Бельгийскому Конго, установила дату провозглашения независимости Бельгийского Конго - 30 июня 1960 года. Поскольку мы уже согласились с этими условиями, у нас нет иного выбора, кроме как признать независимость Конго."
 decolonization.7.a: "Мы желаем Конго удачи в построении своей нации."