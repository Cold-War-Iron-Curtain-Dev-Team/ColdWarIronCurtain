l_russian:
 #1949 
 LBA_emirship_of_idris: "Эмират Идриса"
 LBA_emirship_of_idris_desc: "Эта эпоха знаменует собой эмирство Идриса над Киренаикским эмиратом."
 LBA_glorify_omar_mukhar: "Слава Омару Муктару"
 LBA_glorify_omar_mukhar_desc: "Омар Муктар, герой ливийского народа, храбро сражался против итальянского вторжения. Мы должны гордиться им и изучать его тактику"
 LBA_manage_the_sharifs: "Управление шарифами"
 LBA_manage_the_sharifs_desc: "Мы будем управлять Шарифами"
 LBA_manage_dynastic_claims: "Управление династическими претензиями"
 LBA_manage_dynastic_claims_desc: "Мы будем управлять династическими претензиями"
 LBA_strengthen_noble_privlidges: "Укрепить дворянские привилегии"
 LBA_strengthen_noble_privlidges_desc: "Мы укрепим дворянские привилегии"
 LBA_lesson_noble_priviledges: "Урок знатных привилегий"
 LBA_lesson_noble_priviledges_desc: "Мы научим благородным привилегиям"
 LBA_plan_of_succession: "План наследования"
 LBA_plan_of_succession_desc: "Мы создадим план наследия"
 LBA_ignore_the_succession: "Игнорировать последовательность"
 LBA_ignore_the_succession_desc: "Мы проигнорируем любой план наследования"
 LBA_demonstrate_against_the_bevin_sforza_plan: "Демонстрация против плана Бевина-Сфорца"
 LBA_demonstrate_against_the_bevin_sforza_plan_desc: "Как люди могут поддерживать неоколониальный план Бевина-Сфорца по разделу Ливии между Великобританией и Францией? Возмущаются они на улицах от Байды до Триполи"
 LBA_petition_united_nations: "Петиция в ООН"
 LBA_petition_united_nations_desc: "Нам нужно подать петицию в ООН против плана Бевина-Сфорца, в их интересах победить колониализм."
 LBA_spread_demonstrations_worldwide: "Распространение демонстраций по всему миру"
 LBA_spread_demonstrations_worldwide_desc: "Демонстрации против плана Бевина-Сфорца распространяются по всему миру, поскольку все больше и больше людей видят план Великобритании и Франции по укреплению своей империи. "
 LBA_suggest_resolution_to_un: "Предложить резолюцию в ООН"
 LBA_suggest_resolution_to_un_desc: "Мы предложим резолюцию в ООН"
 LBA_declare_united_kingdom_of_libya: "Провозгласить Соединенное Королевство Ливии"
 LBA_declare_united_kingdom_of_libya_desc: "Теперь, когда мы преодолели план Бевина-Сфорца, теперь мы можем объединить Триполитанию, Феццан и Киренаику под властью Идриса в единое королевство."
 LBA_determine_the_future_administration: "Определить будущую администрацию"
 LBA_determine_the_future_administration_desc: "После того, как мы образовали Ливию, самый важный вопрос: будем ли мы неделимой унитарной администрацией? Или отдельные регионы Триполитания, Феццан и Киренаика будут управляться как отдельные образования в рамках федеральной системы."
 LBA_adopt_unitary_administration: "Принять унитарную администрацию"
 LBA_adopt_unitary_administration_desc: "Мы примем унитарное управление, где регионы нашей страны неделимы."
 LBA_adopt_federal_administration: "Принять федеративную администрацию"
 LBA_adopt_federal_administration_desc: "Мы примем федеративную администрацию, в которой Триполитания, Киренаика и Феццан будут отдельными штатами."
 LBA_tripolitian_and_fezzan_discontent: "Триполитанское и Феццанское недовольство"
 LBA_tripolitian_and_fezzan_discontent_desc: "Недовольство в Триполитании и Феццане"
 LBA_efficent_resource_management: "Эффективное управление ресурсами"
 LBA_efficent_resource_management_desc: "Теперь мы более эффективно управляем нашими ресурсами"
 LBA_tripolitan_and_fezzan_autonomy: "Триполитанская и Феццанская автономия"
 LBA_tripolitan_and_fezzan_autonomy_desc: "Мы предоставим больше автономии Триполитании и Феццану."
 LBA_Bureacratic_Reform: "Бюрократическая реформа"
 LBA_Bureacratic_Reform_desc: "Мы проведем бюрократические реформы"
 LBA_adopt_the_1952_constitution: "Принять Конституцию 1952 года"
 LBA_adopt_the_1952_constitution_desc: "По мере того, как наша страна движется вперед, наше современное время требует некоторых вопросов исполнительной функции. Должен ли Идрис править декретом, как стутусом-кво, или мы примем парламентскую монархическую систему."
 LBA_monarchial_status_quo: "Монархический статус-кво"
 LBA_monarchial_status_quo_desc: "Мы сохраним монархический статус-кво"
 LBA_form_parlimentary_monarchy: "Образовать парламентскую монархию"
 LBA_form_parlimentary_monarchy_desc: "Мы создадим парламентскую монархию"
 LBA_allow_political_parties: "Разрешить политические партии"
 LBA_allow_political_parties_desc: "Мы позволим политическим партиям существовать."
 LBA_revise_provisional_administration: "Пересмотреть Временную администрацию"
 LBA_revise_provisional_administration_desc: "Мы пересмотрим временную администрацию"
 LBA_ban_political_parties: "Запретить политические партии"
 LBA_ban_political_parties_desc: "Мы запретим политические партии"
 LBA_supremacy_of_provisional_authorities: "Верховенство временной власти"
 LBA_supremacy_of_provisional_authorities_desc: "У нас будет верховенство временной власти"
 LBA_adequate_tax_collection: "Адекватный сбор налогов"
 LBA_adequate_tax_collection_desc: "У нас будет адекватный сбор налогов"
 LBA_devalue_tribal_cyrenaican_chiefs: "Обесценить племенных киренаикских вождей"
 LBA_devalue_tribal_cyrenaican_chiefs_desc: "Мы обесценим слово вождей киренаикских племен"
 LBA_tolerate_pan_arabism: "Терпеть панарабизм"
 LBA_tolerate_pan_arabism_desc: "Из-за близких отношений между нашим королем и Насером мы будем терпеть панарабизм."
 LBA_Literacy_Campaign: "Кампания грамотности"
 LBA_Literacy_Campaign_desc: "Мы начнем кампанию по ликвидации неграмотности"
 LBA_Invest_in_Bayda: "Инвестировать в Байду"
 LBA_Invest_in_Bayda_desc: "Мы будем инвестировать в дом королевского двора, в Байда"
 LBA_appeal_to_cyrenaican_cheifs: "Обращение к киренаикским вождям"
 LBA_appeal_to_cyrenaican_cheifs_desc: "Мы обратимся к киренаикским вождям"
 LBA_anti_pan_arabism: "Антипанарабизм"
 LBA_anti_pan_arabism_desc: "Мы должны быть против этой новой и опасной идеи панарабизма."
 LBA_form_loyalist_cabinet: "Сформировать Кабинет лоялистов"
 LBA_form_loyalist_cabinet_desc: "Мы сформируем кабинет лоялистов"
 LBA_idris_international_airport: "Международный аэропорт Идрис"
 LBA_idris_international_airport_desc: "Мы построим международный аэропорт Идриса"
 LBA_join_the_league_of_arab_states: "Вступить в Лигу арабских государствs"
 LBA_join_the_league_of_arab_states_desc: "Нам нужно вступить в лигу арабских государств"
 LBA_establish_university_of_libya: "Основание Ливийского университета"
 LBA_establish_university_of_libya_desc: "Мы создадим университет Ливии, обучающий наш народ"
 LBA_enforce_traditional_muslim_values: "Укрепить традиционные мусульманские ценности"
 LBA_enforce_traditional_muslim_values_desc: "Наш принцип - соблюдение традиционных мусульманских ценностей."
 LBA_superficial_relations_with_egypt: "Внешние отношения с Египтом"
 LBA_superficial_relations_with_egypt_desc: "Хотя мы не согласны с панарабистскими, реформистскими взглядами Египта, наш король Идрис дружит с Насером, и ему нравится посещать Египет"
 LBA_Develop_Cyrenaica: "Развитие Киренаики"
 LBA_Develop_Cyrenaica_desc: "Нам нужно развивать Киренаику"
 LBA_Aid_Pastoral_Families: "Помощь пастырским семьям"
 LBA_Aid_Pastoral_Families_desc: "Мы должны помочь пастырским фермерским семьям нашей страны"
 LBA_Increase_Access_to_Healthcare: "Расширение доступа к здравоохранению"
 LBA_Increase_Access_to_Healthcare_desc: "Мы расширим доступ к здравоохранению, по крайней мере, для более широкой демографической группы среднего класса"
 LBA_Depoliticization_of_Society: "Деполитизация общества"
 LBA_Depoliticization_of_Society_desc: "Наш король неидеологичен, политикой не интересуется, правительство должно показать это обществу, чтобы  народ не становился чрезмерно идеологизированным"
 LBA_invite_egyptian_teachers: "Пригласить египетских учителей"
 LBA_invite_egyptian_teachers_desc: "Насер добросовестно поощрял египетских учителей приезжать в нашу страну для обучения молодежи. Будем надеяться, что они не будут распространять панарабизм и чрезмерно восхвалять египетскую культуру."
 LBA_appeal_to_us: "Обращение к США"
 LBA_appeal_to_us_desc: "Нам нужно обратиться за помощью к главной западной сверхдержаве"
 LBA_appeal_to_uk: "Обращение к Великобритании"
 LBA_appeal_to_uk_desc: "Мы должны обратиться к крупнейшей державе региона, Великобритании"
 LBA_washington_legation: "Вашингтонская миссия"
 LBA_washington_legation_desc: "Мы создадим посольство в Вашингтоне"
 LBA_london_legation: "Лондонская миссия"
 LBA_london_legation_desc: "Мы создадим посольство в Лондоне"
 LBA_host_american_military_bases: "Размещение американских военных баз"
 LBA_host_american_military_bases_desc: "Мы будем размещать американские военные базы"
 LBA_host_british_military_bases: "Размещение британских военных баз"
 LBA_host_british_military_bases_desc: "Мы разместим британские военные базы"
 LBA_foreign_protection: "Иностранная защита"
 LBA_foreign_protection_desc: "Нас охраняет иностранная защита"
 LBA_libyan_self_determination_of_resources: "Ливийское самоопределение ресурсов"
 LBA_libyan_self_determination_of_resources_desc: "Теперь, когда мы единая Ливия, мы можем самостоятельно определять наши ресурсы"
 LBA_invite_foreign_extraction_corporations: "Пригласить иностранные добывающие корпорации"
 LBA_invite_foreign_extraction_corporations_desc: "Мы будем получать доход, приглашая иностранные добывающие корпорации для добычи наших ресурсов"
 LBA_trade_oil_with_western_europe: "Торговля нефтью с Западной Европой"
 LBA_trade_oil_with_western_europe_desc: "Мы будем торговать нефтью с Западной Европой"
 LBA_esso_funded_power_plants: "Электростанции, финансируемые Esso"
 LBA_esso_funded_power_plants_desc: "Корпорация Esso убедила нас инвестировать в нашу страну при небольших затратах на использование нефти"
 LBA_trade_oil_with_arab_states: "Торговля нефтью с арабскими государствами"
 LBA_trade_oil_with_arab_states_desc: "Мы будем торговать нефтью с другими арабскими странами"
 LBA_mineral_law_of_1953: "Закон о полезных ископаемых 1953"
 LBA_mineral_law_of_1953_desc: "Мы принимаем новый Закон о полезных ископаемых, который будет способствовать более масштабной добыче ресурсов"
 LBA_lower_foreign_corporation_fees: "Более низкие сборы для иностранных корпораций"
 LBA_lower_foreign_corporation_fees_desc: "Мы снизим комиссионные сборы для иностранных корпораций"
 LBA_Petroleum_law_of_1955: "Закон о нефти 1955"
 LBA_Petroleum_law_of_1955_desc: "Приняв новый закон о нефти, иностранные и местные корпорации будут расширять добычу нефти в нашей стране"
 LBA_civilian_gridization: "Гражданская гридизация"
 LBA_civilian_gridization_desc: "Благодаря иностранному финансированию мы теперь можем построить современную гражданскую электросеть в нашем крупном населенном пункте"
 LBA_1959_esso_oil_discovery: "Открытие Esso Oil 1959"
 LBA_1959_esso_oil_discovery_desc: "Исследования Esso обнаружили новое крупное нефтяное месторождение в нашей стране"
 LBA_liberalize_industrial_zoning_laws: "Либерализация законов о промышленном зонировании"
 LBA_liberalize_industrial_zoning_laws_desc: "Либерализируя законы о промышленном зонировании, мы будем стимулировать промышленный рост"
 LBA_tripolitan_civilian_industrialization: "Триполитанская гражданская индустриализация"
 LBA_tripolitan_civilian_industrialization_desc: "Нам нужно развивать гражданскую промышленность Триполитании"
 LBA_cyrenaican_civilian_industrialization: "Киренаикская гражданская индустриализация"
 LBA_cyrenaican_civilian_industrialization_desc: "Нам нужно развивать гражданскую промышленность Триполитании"
 LBA_industrialize_benghazi: "Индустриализация Бенгази"
 LBA_industrialize_benghazi_desc: "Бенгази должен быть индустриализирован ради нашей страны"
 LBA_industrialize_tripoli: "Индустриализация Триполи"
 LBA_industrialize_tripoli_desc: "Триполи - наш самый большой город, и он становится архаичным, мы должны индустриализировать его ради нашей страны"
 LBA_refurbish_italian_arms_manufacturies: "Модернизация итальянских оружейных производств"
 LBA_refurbish_italian_arms_manufacturies_desc: "Мы восстановим итальянские оружейные производства, оставшиеся с межвоенного периода"
 LBA_the_emirate_military: "Эмиратские военные"
 LBA_the_emirate_military_desc: "Армия Киренаикийского эмирата довольно маленькая и скромная, мы начнем планировать ее расширение"
 LBA_defend_the_emirate: "Защита Эмирата"
 LBA_defend_the_emirate_desc: "Мы должны планировать защиту нашего эмирата в стороне от посторонних лиц"
 LBA_begin_tribal_conscription: "Ввести племенную воинскую повинность"
 LBA_begin_tribal_conscription_desc: "Единственный набор призывников, из которого мы действительно можем выбрать, чтобы соответствовать удовлетворительным стандартам набора, — это племенные ополчения"
 LBA_ottoman_weapons_reserves: "Запасы османского оружия"
 LBA_ottoman_weapons_reserves_desc: "В нетронутых зданиях Бенгази и Сирта остались старые османские запасы, где мы можем приобрести работающие винтовки с продольно-скользящим затвором начала века"
 LBA_Captured_Italian_Weapons: "Трофейное итальянское оружие"
 LBA_Captured_Italian_Weapons_desc: "Недавно были обнаружены новые запасы итальянского оружия, скорее всего, спрятанные для последующего использования на африканском театре военных действий Второй мировой войны"
 LBA_study_egyptian_military_doctrine: "Изучить египетскую военную доктрину"
 LBA_study_egyptian_military_doctrine_desc: "Наши офицеры считают, что они могут изучить очень полезную доктрину у нашего более могущественного соседа"
 LBA_Salvaged_Artillery: "Трофейная артиллерия"
 LBA_Salvaged_Artillery_desc: "Есть старая итальянская и турецкая артиллерия, которую мы можем использовать"
 LBA_senussi_order_militias: "Ополчения Ордена Сенусси"
 LBA_senussi_order_militias_desc: "Религиозный орден Ливии всегда поддерживал надлежащее ополчение для своих собственных целей, мы можем расширить это и использовать для нашего собственного благополучия"
 LBA_reverse_engineer_italian_engineering: "Перепроектирование Итальянской технологии ведения боя"
 LBA_reverse_engineer_italian_engineering_desc: "Есть множество инженерных приемов, которым мы можем научиться у наших предыдущих поработителей"
 LBA_organize_senussi_veterans: "Организовать ветеранов Сенусси"
 LBA_organize_senussi_veterans_desc: "Нам нужно организовать наших старых ветеранов-сенусси в новые ливийские вооруженные силы"
 LBA_the_royal_libyan_military: "Королевская ливийская армия"
 LBA_the_royal_libyan_military_desc: "Пришло время организовать новую объединенную ливийскую королевскую армию"
 LBA_british_equipment_exchange: "Биржа Британского оборудования"
 LBA_british_equipment_exchange_desc: "Мы можем договориться с британцами о приобретении новой техники"
 LBA_american_equipment_exchange: "Биржа американского оборудования"
 LBA_american_equipment_exchange_desc: "Мы можем договориться с американцами о приобретении новой техники"
 LBA_analyze_military_truck_designs: "Анализ конструкции военного грузовика"
 LBA_analyze_military_truck_designs_desc: "Мы можем проанализировать эти иностранные конструкции военных грузовиков, чтобы использовать их на наших собственных заводах"
 LBA_analyze_world_war_2_planes: "Анализ иностранных самолетов"
 LBA_analyze_world_war_2_planes_desc: "Мы можем проанализировать эти иностранные конструкции самолетов для использования на наших собственных заводах"
 LBA_British_Advisors: "Британские советники"
 LBA_British_Advisors_desc: "Мы пригласим британских советников"
 LBA_analyze_infantry_weapons: "Анализ пехотного оружия"
 LBA_analyze_infantry_weapons_desc: "Мы можем узнать о производстве приемников и базовой механической обработке, проанализировав зарубежные образцы"
 LBA_analyze_artillery_equipment: "Анализ артиллерийского вооружения"
 LBA_analyze_artillery_equipment_desc: "Мы можем научиться производить артиллерийскую технику, анализируя иностранную технику"
 LBA_American_Advisors: "Американские советники"
 LBA_American_Advisors_desc: "Мы пригласим американских советников"
 LBA_further_leadership_reforms: "Дальнейшие реформы руководства"
 LBA_further_leadership_reforms_desc: "Мы будем и дальше реформировать наше военное руководство"
 LBA_modern_transmission_blueprints: "Современные чертежи коробки передач"
 LBA_modern_transmission_blueprints_desc: "Мы проанализируем и разработаем новые современные чертежи трансмиссий автомобилей"
 LBA_adopt_new_steel_casting_techniques: "Внедрение новых технологий литья стали"
 LBA_adopt_new_steel_casting_techniques_desc: "Мы внедрим новые технологии стального литья"
 LBA_Import_British_Weaponry: "Импортировать британское оружие"
 LBA_Import_British_Weaponry_desc: "Мы будем импортировать британское оружие"
