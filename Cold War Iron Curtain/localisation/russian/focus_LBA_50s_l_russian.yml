 LBA_DECADE_CRISIS_DESC: "Ливия в 1960-х годах в основном представляет собой обезлюдевшую пустыню, но ее новый государственный капитал, полученный за счет иностранной добычи нефти в стране, сделал политическую элиту и сенусскую аристократию очень богатыми, в то время как средний ливиец все еще живет в отсталых условиях. Арабский мир никогда не был прежним со времен Второй мировой войны, но в таких городах, как Триполи, Сирте и Байда, панарабизм и насеристские политические взгляды можно найти среди молодежи любой демографической группы. Независимо от того, что, по мнению Идриса, должно быть сделано с Королевством, глубокое влияние соседнего насеристского Египта на Ливию за последние несколько лет неизбежно."
