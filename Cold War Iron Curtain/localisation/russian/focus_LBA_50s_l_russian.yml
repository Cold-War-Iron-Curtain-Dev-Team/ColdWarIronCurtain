 LBA.5.d: "    Его Величество король Идрис призвал Мохиэддина Фикини сформировать новый кабинет для текущих целей государства. Новые пути перемен, принятые Фикини, будут попыткой отменить федеральную систему и сформировать унитарное правительство, запустить наш первый пятилетний план развития и внести поправки в конституцию 1951 года. Мы можем только надеяться, что это приведет к более единой и безопасной Ливии, учитывая пламя революции в Каире и Багдаде."
 LBA.9.d: "    Конституция Ливии 1951 года была первоначально создана после присоединения Феццана и Триполитании к Киренаикскому эмирату при эмире Идрисе I и с тех пор устарела в соответствии с текущими пожеланиями нашего истеблишмента. Изменения в новой конституции, разработанной Мохиэддином Фикини, включают принятие унитарного государства и право голоса для женщин."
 LBA.10.d: "   Восхищаясь великим наследием арабского Египта, Идрис и правительство Ливии приглашают путешествующих учителей из соседнего Египта, чтобы они помогали учить наших детей. Тем не менее, наблюдатели заметили, что в образовании особое внимание уделяется истории Египта, и многие учителя - молодежь, открыто придерживающаяся панарабистских убеждений, прославляющих Насера ​​и египетскую революцию..."
 LBA.13.d: "   Король Идрис подписал соглашение, в котором говорится, что он уйдет в отставку в пользу своего ближайшего родственника, однако это не будет действовать в течение нескольких месяцев, и правительству необходимо будет установить временное регентство. Однако мы будем действовать осторожно, так как это может быть в интересах более радикальных группировок в нашей стране."
 LBA.11.d: "   Влияние панарабизма можно увидеть в каждом аспекте ливийской жизни. Будь то «Радио Каир» или египетский учитель, бизнесмен или кассир, молодежь постоянно подвергается воздействию этих радикальных идей, распространяющихся по всему арабскому миру."
 LBA.14.d: "   Предыдущие месяцы стали решающим фактором в изменении политической ситуации в Ливии. Пока его величество король Идрис отсутствовал, получая медицинскую помощь в Египте, небольшая группа офицеров, прикомандированных к ротам связи, штурмовала Байду и Бенгази. Принц Хасан отказался от всех претензий на трон и призвал ливийский народ не сопротивляться новому правительству. Сможет ли RCC установить свой контроль по всей стране, еще неизвестно. Молодой бедуин по имени Муаммар аль-Каддафи, похоже, возглавил этих офицеров и, по сути, является их фактическим лидером."
 LBA.15.d: "   В попытке объединить Ливию с ОАР председатели Каддафи совместно создали организацию, известную как Федерация арабских республик"
 LBA.16.d: "   Арабский мир меняется, и многие из наших людей не верят, что Ливия изменится вместе с ним. Такие идеи, как насеризм и панарабизм, проявились в Объединенной Арабской Республике. Напряженность между Израилем и арабами всегда была обостренной с момента их первой сионистской оккупации Палестины. Мы должны научиться решать эти многочисленные проблемы"
 LBA.20.d: "   Муаммар аль-Каддафи подал в отставку в знак протеста с поста председателя RCC после несогласия с недавно принятым законом. Этот спор необходимо разрешить, иначе в нашу революцию могут вмешаться внешние силы."
