 LBA_60s_continue_influx_of_egyptian_teachers: "Продолжение притока египетских учителей"
 LBA_60s_continue_influx_of_egyptian_teachers_desc: "Никто не собирается препятствовать продолжающемуся притоку добровольных учителей из Египта, хотя последствия насеристских взглядов, которых придерживаются многие египтяне, неизвестны."
