l_russian:
 tutorial.1000.t: "[GetNewspaperHeader]Cold War: The Iron Curtain ТУТОРИАЛ"
 tutorial.1000.d: "Русификатор находится в стадии Beta \n\nДобро пожаловать в Cold War: The Iron Curtain. Пожалуйста, пройдите туториал, чтобы узнать новую механику игры, в частности вертолетов, ядерного оружия и объявления войны. \n\n\nПеревод сделан командой переводчиков НГПМ (https://vk.com/newmodsp)."
 tutorial.1000.a: "Скорее,покажите мне новые механики!"
 tutorial.1000.b: "Спасибо, но я все знаю."
  
 tutorial.1.t: "Меню"
 tutorial.1.d: "Выберите тему, которую вы хотели бы узнать об этом моде."
 tutorial.2.t: "Меню - страница 2"
 tutorial.2.d: "Выберите тему, которую вы хотели бы узнать об этом моде."
 tutorial.1.dd: "Следующая страница"
 tutorial.1.a: "Расскажите мне о DEFCON и объявлении войны."
 tutorial.1.b: "Расскажите мне о ядерных ракетах."
 tutorial.1.c: "Расскажите мне о вертолетах."
 tutorial.1.f: "Расскажите мне о НАТО."
 tutorial.1.g: "Расскажите мне о химическом оружии."
 tutorial.1.e: "Я больше не хочу изучать."
 tutorial.1.h: "Вернуться"
  
 tutorial.go: "Вперед"
 tutorial.back: "Назад"
 tutorial.menu: "Вернуться в меню."
  
 tutorial.11.t: "Меню DEFCON"
 tutorial.11.d: "DEFCON – новая механика, введенная в наш мод,иногда может ввести в заблуждение. DEFCON теперь влияет на то, как вы будете объявлять войну или как вы взаимодействовуете в военном отношении с другими странами."
 tutorial.12.t: "DEFCON V"
 tutorial.12.d: "Сперва, у нас есть DEFCON 5. Он выбран в мирное время и допускает самое маленькое количество военных действий, которые вы можете сделать. DEFCON 5 уже выбран для вас, и он уже влияет на то, что вы можете сделать в военном отношении. Вы не сможете вообще объявить войну, пока не мировая напряжённость достигнет 50%, или не получите событие, объявившее войну. Примером может служить Корейская война, куда США будут приглашены. Это позволит разблокировать DEFCON 3 для использования. Войны с прокси-серверами важнее сейчас, так как вы не можете полноценно объявить войну, но вы все равно сможете отправить добровольцев."
  
 tutorial.13.t: "DEFCON 4"
 tutorial.13.d: "DEFCON 4 разблокируется, когда мировая напряженность более 25% . Вы можете отправить больше добровольцев и предоставить ленд-лиз. Вы также можете влиять на страны с каждым DEFCON."
 tutorial.14.t: "DEFCON 3"
 tutorial.14.d: "DEFCON 3 активируется,когда все начинает становиться серьезным. Вы можете активировать DEFCON 3 во время войны (но не в мировой войне). Должно быть не менее 50% мировой напряженности. С DEFCON 3 вы можете теперь отправлять все больше и больше добровольцев, и вы можете объявлять свои собственные войны. С DEFCON 2 вам нужно 75% или больше мирового напряжения."
 tutorial.15.t: "DEFCON 2"
 tutorial.15.d: "DEFCON 2 может позволить вам посылать гораздо больше добровольцев и начинать ленд-лиз а также делает оправдание цели войны еще более дешевой и недолгой. DEFCON 1 требует более 95% мирового напряжения, чтобы разблокировать."
 tutorial.16.t: "DEFCON 1"
 tutorial.16.d: "DEFCON 1 может позволить вам отправить максимальное количество добровольцев и предоставить ленд-лиз, а также клепать цели войны за несколько недель. Это вызывает тотальную войну и, вероятно, закончит мир для вас, когда начнется Третья мировая война."
 tutorial.17.t: "DEFCON: Заключение"
 tutorial.17.d: "Это гайды,что да как работает, и мы надеемся, что этот урок поможет вам в игре, теперь идите в игру развязывать глобальную темоядерную войну!\n\n\n-От the Cold War: Iron Curtain Dev Team."
  
 tutorial.22.t: "Ядерные ракеты"
 tutorial.22.d: "'Ядерные ракеты' это новая механика,также способная ввести вас в заблуждение. Существует 2 типа ядерных ракет: Расщепление атома (атомные бомбы) и слияние атомов (водородные бомбы) и 4 типа для ядерных ракет: Баллистические ракеты подводных лодок (БРПЛ), баллистическая ракета с короткой дистанцией (БРКД), Баллистическая ракета средней дальности (БРСД) и Межконтинентальная баллистическая ракета (МБР)."
 tutorial.23.t: "Ядерные ракеты II"
 tutorial.23.d: "БРПЛ могут быть запущены из любой точки мира из подводных лодок с баллистическими ракетами. БРПЛ являются ракетами ближнего радиуса действия и имеют всего несколько сотен километров диапазона. (Пример: из Западной Германии в Западную Польшу). БРСД от нескольких сотен километров до нескольких тысяч. (Пример: из Восточной Франции в Москву). МБР может фактически ударить по всему миру. (Пример: Восточное побережье США по Западной России). Вот как  работать с ядерными ракетами:"
 tutorial.24.t: "Ядерные ракеты: Шаг 1."
 tutorial.24.d: "Шаг 1. Как только вы откроете раздел исследований, вы увидите вкладку в конце. Радиоактивный символ - это вкладка древа ядерных ракет. Нажмите его, и исследования окажутся перед вами."
 tutorial.25.t: "Ядерные ракеты: Шаг 2."
 tutorial.25.d: "Шаг 2. Как только вы попадете на вкладку, вы увидите все ракеты и бомбы. Теперь нажмите, чтобы исследовать ракеты или бомбы. Сначала мы будем использовать ракеты."
 tutorial.26.t: "Ядерные ракеты: Шаг 3."
 tutorial.26.d: "Шаг 3. Как только вы исследуете ракету, вы переходите на производственную страницу. Там все ракеты и бомбы классифицируются под самолетами. Как только вы это сделаете, вы построите нужную вам ракету."
 tutorial.27.t: "Ядерные ракеты: Шаг 4."
 tutorial.27.d: "Шаг 4. После того, как ракеты построятся, вы должны знать, где они находятся. Они появятся на аэродромах, и вы сможете разместить их на аэродромах, где захотите. Вы создаете новое воздушное крыло, и они сформируются."
 tutorial.28.t: "Ядерные ракеты: Шаг 5."
 tutorial.28.d: "Шаг 5. Теперь, как только вы поместили их на аэродром, вы можете нависнуть над аэродромом и увидеть дальность ракеты. Это максимум. Если вы хотите более широкий диапазон, исследуйте более поздние классы или исследуйте более крупную ракету с большим диапазоном."
 tutorial.29.t: "Ядерные ракеты: Шаг 6 (БРПЛ)."
 tutorial.29.d: "(Только для БРПЛ) Шаг 6. Для БРПЛ они действуют как военно-морские самолеты для авианосцев. Вы должны построить новый класс подводной лодки. Этот класс - подводная лодка с баллистическими ракетами. Затем вы делаете то, что вы регулярно делаете для самолетов на авианосцах, и добавляете их туда."
 tutorial.30.t: "Ядерные ракеты: Шаг 7."
 tutorial.30.d: "Шаг 7. После того, как вы сделаете эти шаги, вы теперь сможете развязывать глобальную термоядерную войну. Чтобы сделать это, просто нажмите на провинцию, и там будет кнопка с ванильной ядеркой. Это пошлет ракету в провинцию и КАБУУУУМ,произойдёт ядерный взрыв и начнется ядерная война!"
 tutorial.31.t: "Заключение по ядерным ракетам"
 tutorial.31.d: "Это описание по работе ядерных ракет. Мы надеемся, что этот урок помог вам, теперь идите делать Армагеддон в мире!\n\n\n-From the Cold War: Iron Curtain Dev Team"
  
 tutorial.33.t: "Вертолеты"
 tutorial.33.d: "Вертолеты - новая механика, введенная в наш мод,тоже может ввести в заблуждение. Существует 4 типа вертолетов: Грузовые, Многоцелевые, Ударные, Легкие ударные / Разведчики и АПВ."
  
 tutorial.34.t: "Грузовые вертолеты"
 tutorial.34.d: "Грузовые вертолеты занимаются поддержкой транспортом и обеспечением доставки снаряжения вашим войскам."
  
 tutorial.35.t: "Многоцелевой вертолёт"
 tutorial.35.d: "Многоцелевой имеет дело с перевозкой войск на короткие расстояния и быстрым движением а также наносит небольшой урон из пушек. Многоцелевой вертолет также будет составлять новый шаблон подразделения воздушной кавалерии."
  
 tutorial.36.t: "Ударный вертолёт"
 tutorial.36.d: "Ударные вертолеты атакуют наземные подразделения и наносят некоторый ущерб воздушным единицам. Ударные вертолёты также являются частью шаблонов и будут давать баффы атакам."
  
 tutorial.37.t: "Легкие ударные / разведчики"
 tutorial.37.d: "Легкие ударнык / разведчики чаще всего являются  разведкой, но могут наносить небольшой урон наземным единицам.Вертолеты-разведчики очень быстры, потому что они легкие."
  
 tutorial.38.t: "Вертолеты ПЛО"
 tutorial.38.d: "ПЛО имеет дело с нападением на военно-морские корабли или подводные лодки и является единственным типом вертолетов, который может атаковать военно-морские подразделения. Вертолеты ПЛО прикрепляются к вертолетоносцам и обычным авианосцам, хотя на обычных авианосцах вы вряд ли сможете их уместить."
 tutorial.39.t: "Вертолеты II"
 tutorial.39.d: "Вертолеты могут быть быстрыми и дешевыми для производства, их легче рамещать но не так быстро, как самолеты. Поэтому разумно выбирайте то, что вы хотели бы сделать."
 tutorial.40.t: "Заключение по вертолетам"
 tutorial.40.d: "Это описание по тому, как это работает, и мы надеемся, что этот урок поможет вам, теперь врубайте Fortune Son на вертолете и наслаждайтесь!\n\n\n-От the Cold War: Iron Curtain Dev Team и НГПМ(Команда переводчиков)."
  
 tutorial.44.t: "НАТО"
 tutorial.44.d: "НАТО теперь является оборонительным альянсом со времени обновления 3.10. Это означает, что он не отображается на карте альянсов и может быть просмотрен только через идеи стран. Когда одна страна из НАТО атакована, другие получают возможность присоединиться к войне. Их принятие зависит от силы / слабости вражеской страны."
  
 tutorial.55.t: "Химическое оружие"
 tutorial.55.d: "Химическое оружие - это способности, которые можно разблокировать с помощью своих исследований. Вы должны произвести 50 единиц одного оружия, чтобы иметь возможность использовать умение с вашим командиром.\n\nЭто требует DLC Waking the Tiger."
  
 tutorial.211.d: "CWTR вводит совершенно новую систему ОМП, позволяющую осуществлять более сложные и стратегические ядерные обмены по стандартному методу ванильного клика в каждой провинции. В графическом интерфейсе есть 8 основных частей. \n 1. Верхний левый экран показывает ядерные державы мира — другими словами,  тех кто активировал накопление ЯО во вкладке политики.  \n 2. Экран Defcon показывает ваш уровень Defcon (боевой готовности) и доступен только для США, СССР и КНР. Перемещение уровня вниз будет означать более высокую стадию напряжения и он открывает больше возможностей для ведения боя. \n \n 3. Центральная часть графического интерфейса показывает, сколько у вас каждого вида ОМП, от ванильного ядерного оружия до МБР. Список химического оружия в крайнем правом углу - это НЗП, а денуклеаризация - ну, в любом случае, зачем вам это делать? \n 4. Под разделом, обсуждаемым в разделе 3, находятся 3 варианта, обозначаемые уровнями от 1 до 3, каждый из которых предлагает различное количество используемых ядерных зарядов и разные цели. Уровень 1 - это базовая атака на вражеские столицы в радиусе действия. Уровень 2 - это уровень 1, плюс дополнительные ядерные заряды для стратегических целей, т. е. крупные населенные или промышленные центры. Уровень 3 - это полный, самый полный ядерный залп, и для него требуется одна из 2 вещей-технология МБР или для СССР или США, ракеты на Кубе или в Турции соответственно. \n 5. Большая серая кнопка станет красной, если все требования к запуску будут выполнены, и тогда вы сможете поиграть в глобальную термоядерную войну . \n 6. Под большой кнопкой находится список ядерных зарядов, необходимых для удара. \n 7. Слева от него, список целей-государств для удара. \n 8. Слева список стран противника, находящихся в зоне действия ваших ракет.  \n\n Помните, что если у вас возникнут какие-либо ошибки или проблемы с этой системой, не стесняйтесь перечислять их в steam или discord разработчику. \n\n Удачной бомбёжки!"
  
 TUTOR.666.t: "§RСУКА, НЕ ИГРАЙ ЗА ВАТИКАН БЛЯТЬ§!"
 TUTOR.666.d: "§RВатикан предназначен как глобальный центр для принятия решений и управления игрой за кулисами лично сумасшедшим ИИ и не менее поехавшими переводчиками НГПМ. Игра в качестве Ватикана вызовет сбои, ошибки, ошибки и, как правило, просто не заставит игру работать вообще.§!"
 TUTOR.666.a: "Ладно, черт возьми, успокойся. Я перезапущу игру, потому что уже испортил ее."
  
  
