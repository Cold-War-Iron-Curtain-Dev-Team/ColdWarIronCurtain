 BCR_NATO_decisions_allowed_opinion: "Решения НАТО приняты"
 BCR_berlin_question_talks_opinion: "Переговоры Берлинскому вопросу"
 BCR_NATO_pulling_out_opinion: "Войска НАТО выводятся"
 BCR_Berlin_stays_divided_opinion: "Берлин остается разделенным"
 BCR_Berlin_reunified_opinion: "Берлин воссоединился"
 BCR_Berlin_reunified_west_opinion: "Берлин воссоединился"
