l_english:
 berlincrisis.1.t: ""
 berlincrisis.1.d: "На саммите в Вене в [GetDateText] напряженность возросла. Встретившись с президентом США [USA.GetLeader], генеральный секретарь Хрущев повторно выдвинул советский ультиматум о подписании сепаратного мирного договора с Восточной Германией который положит конец существующим соглашениям четырех держав, гарантирующим права Америки, Великобритании и Франции на доступ к Западному Берлину и контроль Восточного Берлина советскими войсками. Три державы ответили, что любой односторонний договор не может повлиять на их обязанности и права в Западном Берлине. В условиях растущей конфронтации по поводу статуса Берлина [USA.GetLeader] подорвал свой авторитет в Берлине во время переговоров на высшем уровне в Вене с Хрущевым в июне 1961 года. [USA.GetLeader] по сути, передал согласие США на постоянное разделение Берлина. Это сделало его более поздние, более напористые публичные заявления менее значимыми для СССР. Что нам следует делать с Берлинским вопросом?"
 berlincrisis.1.a: "Провести саммит НАТО о разоружении Западного Берлина и его передаче"
 berlincrisis.1.b: "Мы не отдадим им ни пяди земли"
 berlincrisis.2.t: "[GetNewspaperHeader]НАТО выводит войска из Западного Берлина"
 berlincrisis.2.d: "После переговоров на Венском саммите Советский Союз предъявил НАТО ультиматум с требованием решить Берлинский вопрос в пользу СССР. Представители СССР хотят, чтобы Западный Берлин был включен обратно в состав Восточного Берлина и стал единым городом в составе Германской Демократической Республики. Пару недель назад начался саммит НАТО, и после переговоров НАТО приняло решение о выводе войск из Западного Берлина. НАТО сделало заявление, в котором говорится, что мир не может быть втянут в Третью мировую войну из-за разделенного города. Американские, французские и британские войска, дислоцированные в Западном Берлине, выводятся, и тысячи мирных жителей пытаются выбраться. Многие эксперты критиковали это решение, поскольку оно увеличивает влияние СССР, но, по крайней мере, Берлинский кризис подошел к концу"
 berlincrisis.2.a: "Надеюсь, это предотвратит Третью мировую войну"
 berlincrisis.2.b: "Победа коммунизма"
 berlincrisis.2.c: "Третья мировая война предотвращена"
 berlincrisis.3.t: "[GetNewspaperHeader]НАТО отказалось от советского предложения"
 berlincrisis.3.d: "По мере эскалации конфронтации вокруг Берлина, Кеннеди в своей речи, произнесенной по общенациональному телевидению в ночь на 25 июля, повторил, что Соединенные Штаты не ищут борьбы и что он признает историческую озабоченность Советского Союза по поводу своей безопасности в центральной и восточной Европе\". Он заявил, что готов возобновить переговоры, но при этом объявил, что попросит у Конгресса дополнительно $3,25 млрд. на военные расходы. Он хотел получить шесть новых дивизий для армии и две для морской пехоты, а также объявил о планах утроить призыв в армию и призвать резервистов. Кеннеди провозгласил: \"Мы стремимся к миру, но мы не сдадимся\". В тот же день Кеннеди потребовал увеличить численность армии с 875 000 до примерно 1 миллиона человек, а также предоставить ему право ввести в строй некоторые резервные части. Хрущев, отдыхавший на черноморском курорте Сочи, по сообщениям, был разгневан речью Кеннеди. Джон Джон Макклой, советник Кеннеди по вопросам разоружения, который оказался в Советском Союзе, был приглашен присоединиться к Хрущеву. Сообщается, что Хрущев объяснил Макклою, что наращивание военной мощи Кеннеди угрожает войной."
 berlincrisis.3.a: "Мы не позволим коммунизму распространять своё влияние!"
 berlincrisis.3.b: "Давайте подумаем о других вариантах."
 berlincrisis.3.c: "Напряженность будет нарастать"
 berlincrisis.4.t: "НАТО говорит \"нет\" в ответ на Берлинский ультиматум"
 berlincrisis.4.d: "НАТО ответило \"нет\" на ультиматум, заявляя, что это нарушает правила соглашений \"большой четверки\", подписанных в 1946 году. Американцы, англичане и французы заявили, что не отдадут коммунистам ни сантиметра земли. Правительство Восточной Германии размышляет о будущих действиях НАТО. Каким должен быть следующий шаг СССР? Мы могли бы оказать давление на Запад, разместив наши танки и войска прямо на границе, или мы могли бы просто согласиться с их решением"
 berlincrisis.4.a: "Военный вариант работает!"
 berlincrisis.4.b: "Мы позволим этому решению стать решающим"
 berlincrisis.5.t: "Берлинский кризис становится все напряжённее"
 berlincrisis.5.d: "Советский Союз выражает свое недовольство тем, что руководство НАТО не приняло ультиматум, заявив о советских многомиллионных жертвах, чтобы захватить Берлин. Их представители заявили, что если войска НАТО они покинут Берлин, то это спровоцирует Третью Мировую Войну, что вызовет миллиардные жертвы. Напряженность в Берлине высока, советские танки и войска находятся прямо напротив танков и солдат НАТО. Что нам следует делать?"
 berlincrisis.5.a: "Это нападение!"
 berlincrisis.5.b: "Отправьте дипломата для переговоров с СССР"
 berlincrisis.5.c: "Отведите наши танки и солдат"
 berlincrisis.6.t: "[GetNewspaperHeader]Начинается Третья Мировая Война!"
 berlincrisis.6.d: "После многих недель переговоров и всё возрастающей напряженности между НАТО и Коминформом дипломаты не смогли прийти к взаимопониманию, ситуация дошла до того, что переговоры быстро переросли во взаимные оскорбления. Нам поступают сообщения о осаде Берлина. Выстрелы пушек слышны за много километров, истребители и бомбардировщики поднимаются в воздух, а военно-морские силы покидают свои доки. Страны со всего мира проводят мобилизацию войск. Началась Третья мировая война, но единственный вопрос, который волнует весь мир - это будет обычная или ядерная война?"
 berlincrisis.6.a: "Боже, спаси мир, потому что никто другой уже не может"
 berlincrisis.7.t: "[GetNewspaperHeader]Переговоры о Берлинском кризисе"
 berlincrisis.7.d: "Соединенные Штаты направили дипломата в СССР для обсуждения Берлинского кризиса в ответ на советские угрозы военных действий. Обе стороны пытаются снизить напряженность, но продолжают возникать трудности из-за того, что СОВЕТЫ заявляют, что НАТО не место в Берлине, а НАТО не соглашается по соображениям международной безопасности. Надеюсь, Берлинский кризис будет разрешен здесь и что мир не вступит в Третью мировую войну"
 berlincrisis.7.a: "Мы покончим с этим и сохраним Западный Берлин"
 berlincrisis.7.b: "Мы покончим с этим и захватим Западный Берлин"
 berlincrisis.7.c: "Будем надеяться, что это скоро закончится"
 berlincrisis.8.t: "Переговоры по берлинскому вопросу"
 berlincrisis.8.d: "Напряженность сейчас на самом высоком уровне в мире. Американское правительство направило дипломата для переговоров с нами по Берлинскому вопросу. Мир наблюдает за нами на этих переговорах. Мы будем вести переговоры с американцами о том, что делать. На чем мы должны сосредоточиться на переговорах?"
 berlincrisis.8.a: "Настаивайте на воссоединении Берлина и присоединении его к ГДР"
 berlincrisis.8.b: "Продвигайте идею Свободного Города Берлина"
 berlincrisis.8.c: "Берлин останется разделенным"
 berlincrisis.9.t: "Переговоры в Берлине"
 berlincrisis.9.d: "Советское правительство хочет, чтобы Западный Берлин и Восточный Берлин были объединены в Свободный Город Берлин. Они хотят, чтобы это произошло под наблюдением ГДР и без оккупационных сил. Берлин станет демилитаризованной зоной. Никакой армии, будь то восточной или западной, в городе не будет. Должны ли мы принять их сделку?"
 berlincrisis.9.a: "Принимаем сделку"
 berlincrisis.9.b: "Берлин останется разделенным"
 berlincrisis.10.t: "[GetNewspaperHeader]Западный и Восточный Берлин объединены!"
 berlincrisis.10.d: "После недель дебатов и жарких споров НАТО согласилось вывести войска из Западного Берлина и передать Восточной Германии Западный Берлин. Советы назвали это великой победой во имя мира во всем мире. В заявлении НАТО говорится, что Вторая мировая война закончилась много лет назад и что Западный Берлин не должен быть напоминанием живущим там людям о том, что они все еще оккупированы. Некоторые критики НАТО назвали это плохим шагом со стороны НАТО, заявив, что это расширит коммунистическую сферу влияния"
 berlincrisis.10.a: "Нам не нужно контролировать Западный Берлин"
 berlincrisis.10.b: "Великая победа Варшавского договора"
 berlincrisis.10.c: "Улучшаться ли теперь отношения?"
 berlincrisis.11.t: "Советское правительство настаивает на создании Свободного Города Берлин"
 berlincrisis.11.d: "Советское правительство заявило, что если НАТО не принимает идею передачи Берлина под контроль ГДР, то, возможно, мы могли бы сформировать Свободный Город Берлин. Свободный город Берлин включал бы в себя как Западный, так и Восточный Берлин и был бы нейтральным государством. Проблема с этим, однако, заключается в том, что СССР мог бы влиять на нейтральный Берлин. Что нам с этим делать?"
 berlincrisis.11.a: "Позвольте создание Свободного Города Берлина"
 berlincrisis.11.b: "Мы не собираемся отдавать нашу землю"
 berlincrisis.12.t: "[GetNewspaperHeader]Образован Свободный Город Берлин!"
 berlincrisis.12.d: "США и СССР договорились о независимом городе-государстве в Берлине. Город-государство будет нейтральным и не будет состоять ни в каком альянсе. Это, несомненно, продлится недолго, поскольку Берлин является стратегическим местом для и для НАТО и для Варшавского договора. США, СССР, французы и британцы начали выводить свои войска. ГДР и ФРГ решительно высказали свое мнение о городе-государстве и заявили, что они снова станут частью единого немецкого государства"
 berlincrisis.12.a: "Надеюсь, с этим кризисом покончено"
 berlincrisis.12.b: "Германия скоро будет под нашим контролем"
 berlincrisis.12.c: "Что теперь произойдет?"
 berlincrisis.13.t: ""
 berlincrisis.13.d: "\nПоскольку шпион КГБ Георгий Большаков служил основным каналом связи, Хрущев и Кеннеди договорились снизить напряженность, отведя танки. Советский контрольно-пропускной пункт имел прямую связь с генералом Анатолием Грибковым из Верховного командования Советской Армии, который, в свою очередь, разговаривал по телефону с Хрущевым. На контрольно-пропускном пункте США находился офицер военной полиции, который разговаривал по телефону со штаб-квартирой военной миссии США в Берлине, которая, в свою очередь, поддерживала связь с Белым домом. Кеннеди предложил в будущем не беспокоить Берлин в обмен на то, что Советы сначала выведут свои танки. Советы согласились. Кеннеди заявил по поводу стены: \"Это не очень хорошее решение, но стена, черт возьми, намного лучше войны\". Сначала советский танк продвинулся примерно на 5 метров назад; затем его примеру последовал американский танк. Один за другим танки отошли."
 berlincrisis.13.a: ""
 berlincrisis.13.b: "В следующий раз мы получим Западный Берлин"
 berlincrisis.13.c: ""
 berlincrisis.14.t: ""
 berlincrisis.14.d: "Берлинский кризис, наконец, подошел к концу. После многих недель переговоров, горячих дебатов, эскалации сил НАТО и Коминформа и, что особенно важно, строительства неоднозначной Берлинской стены, обе стороны согласились на взаимные соглашения, согласно которым США будут снисходительны к Восточному Берлину и признают, что берлинская стена лучше войны, в обмен на то, что СССР первым выведет свои танки, напряженность между сторонами снизилась"
 berlincrisis.14.a: ""
 berlincrisis.14.b: ""
 berlincrisis.14.c: "Западный Берлин позже будет нашим"
 berlincrisis.14.e: "Мы защитили наш город"
 berlincrisis.14.f: "Берлин чуть не втянул нас в Третью мировую войну"
 BCR_no_berlin_for_soviets_opinion: "НАТО не уступит Берлин"
