 BCR_Free_City_of_Berlin_opinion: "Вольный город Берлин"
 SOV_khruschev_reforms_desc: "Смерть Сталина в 1953 году спровоцировала борьбу за власть, из которой Хрущев вышел победителем. 25 февраля 1956 года на XX съезде партии он произнес \"Секретную речь\", в которой осудил сталинские чистки и возвестил о начале менее репрессивной эпохи в Советском Союзе. Его внутренняя политика, направленная на улучшение жизни простых граждан, часто была неэффективной, особенно в сельском хозяйстве. Надеясь на ракеты для национальной обороны, Хрущев приказал значительно сократить обычные вооруженные силы"
 SOV_the_secret_speech_desc: "В 1956 году Хрущев резко раскритиковал покойного товарища Сталина за его чистки, проведенные в 1930-х, а также был возмущён созданием культа личности вместо того, чтобы способствовать улучшению жизни для обычных рабочих. Эта речь сильно повлияла на китайско-советский раскол и ослаблению советской сферы влияния повсюду на планете."
 SOV_sino_soviet_split_desc: "После публикации секретной речи Хрущева в 1956 году Мао осудил Хрущева как ревизиониста за его критику Сталина, идеи которого легли в основу многих коммунистических систем во всем мире, и раскол сильно ослабил СССР, поскольку он терял одного из своих самых важных союзников и экономических партнеров на планете"
 SOV_peaceful_coexistence_desc: "На 20-м съезде партии Хрущев одобрил и защитил концепцию мирного сосуществования с США после значительного роста напряженности и возможностью начала ядерной войны. Это означает конец советской идеи распространения коммунизма, коммунисты мира расценили это как предательство принципов социалистической революции"