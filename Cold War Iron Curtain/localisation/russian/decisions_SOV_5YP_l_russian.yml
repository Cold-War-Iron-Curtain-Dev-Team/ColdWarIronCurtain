 SOV_10th_5yp_category: "10-я Пятилетка"
 SOV_10th_5yp_category_desc: "10-я Пятилетка\n10-я пятилетка - это комплекс задач, направленных на укрепление экономики нашей страны с 1976 по 1980 год, представленный на 25-м съезде председателем Совета Министров Алексеем Косыгиным. Также этот план стал известен как план повышения эффективности и качества из-за Брежнева, который утверждал, что советская экономика столкнулась со снижением роста из-за медленного технического прогресса внутри страны. Следовательно, план подчеркивал необходимость технологического обновления многочисленных отраслей промышленности в стране, предназначенными для повышения эффективности.\n\n текущий прогресс: [?sov_10th_5yp_progress|R]%"
