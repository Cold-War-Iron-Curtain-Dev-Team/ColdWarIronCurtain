 SOV_9th_5yp_category: "9-я Пятилетка"
 SOV_9th_5yp_category_desc: "9-я Пятилетка\nЦель 9-ой пятилетки-укрепление нашей экономики, и она будет по плану с 1971 по 1975 год. Она была представлена на 24-м съезде председателем Совета Министров Алексеем Косыгиным. Основной целью пятилетки является увеличение роста промышленного производства потребительских товаров, причем Брежнев отметил, что повышение уровня жизни было более важным, чем экономическое развитие. План также включает предложение об увеличении валового национального дохода на 37-40 процентов.\n\n Текущий прогресс: [?sov_9th_5yp_progress|R]%"
