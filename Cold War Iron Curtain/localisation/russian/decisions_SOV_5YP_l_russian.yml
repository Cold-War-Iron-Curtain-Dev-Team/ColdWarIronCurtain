 SOV_11th_5yp_category: "11-я Пятилетка"
 SOV_11th_5yp_category_desc: "11-я Пятилетка\n11-я пятилетка - это еще один комплекс задач по укреплению нашей экономики. Его планируется достичь в период с 1981 по 1985 год. Она была представлена председателем Совета Министров Николаем Тихоновым на 26-м съезде. Брежнев сказал делегатам съезда, что главной целью плана является переход экономики от экстенсивного к интенсивному росту, и что одной из целей должно быть повышение уровня жизни. Другие цели включали прекращение миграции с востока на Запад и с юга на север и обеспечение экономического роста, поскольку большинство советских экономических центров располагалось в слаборазвитых районах, таких как Сибирь и Центральная Азия.\n\n текущий прогресс: §G[?sov_11th_5yp_progress|R]%§!"
