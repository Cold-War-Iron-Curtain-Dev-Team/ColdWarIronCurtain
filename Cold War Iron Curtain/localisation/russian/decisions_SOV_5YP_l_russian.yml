 SOV_8th_5yp_category: "8-я Пятилетка"
 SOV_8th_5yp_category_desc: "8-я Пятилетка\n8-я пятилетка - это амбициозный комплекс задач промышленного производства. Представленные на 23-м Съезде планы пятилетки будут рассмотрены центральным правительством. План также направлен на улучшение благосостояния рабочих и предоставление обычным людям доступа к большей части экономики.\n\n Текущий прогресс: [?sov_8th_5yp_progress|R]%"
