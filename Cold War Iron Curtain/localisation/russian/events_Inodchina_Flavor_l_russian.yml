l_english:
 Fulro_1_desc: "Новая организация поднялась из джунглей Вьетнама. От пропагандистских плакатов до вооруженной борьбы, Объединенный фронт освобождения угнетенных рас поднялся на борьбу с Южным и Северным Вьетнамом - выступая за права и автономию монтаньяров, они были решительны в своих сражениях. Большинство считает, что Камбоджа и Китай несут ответственность за финансирование и поддержку этой группы. Удастся ли ей добиться успеха в своей борьбе, еще предстоит увидеть.\n В 1958 году группа французских интеллектуалов создала предшественника FULRO, целью которого была защита народа бахнар, джарай, раде и к'хо. Названная BAJARAKA, она просуществовала недолго, после чего объединилась с Фронтом освобождения Чампы и Фронтом освобождения Кампучии Кром, обе группы возникли в Камбодже и боролись за свои этнические группы. Монтаньяры, этническая группа, которая в большинстве своем составляла ФУЛРО, насчитывает 2,25 миллиона человек с дюжиной племен и различными языками."
 North_Vietnam_1_desc: "Сердце основателя Демократической Республики Вьетнам остановилось. Хо Ши Мин тихо и мирно лежит на смертном одре; сердечный приступ отнял у нации основателя вьетнамского социализма и, таким образом, оставил ее на мгновение без лидера. Родившийся в мае 1890 года, неуловимый Хо Ши Мин, как известно, использовал по меньшей мере пятьдесят псевдонимов, с неизвестным или, по крайней мере, неопределенным местом и датой рождения, лидер Северного Вьетнама был любим многими и ненавидим многими другими, особенно в Южном Вьетнаме.; писатель, журналист, поэт и полиглот - он был вдохновляющей фигурой, которая вела Демократическую Республику Вьетнам через бурные времена и была непоколебима в своей вере в то, что Вьетнам должен быть объединен под одним знаменем."
 North_Vietnam_2_desc: "Правительство Демократической Республики Вьетнам объявило, что оно начнет серию земельных реформ в интересах крестьянства и сельских рабочих; в то время как первоначально занимая умеренную позицию и идя на компромисс с помещиками в отношении земель, с простым снижением земельной ренты, правительство Северного Вьетнама начало более жесткую и радикальную реформу, вдохновляясь китайцами. Считать помещиков предательскими элементами дела и образовать особый народный трибунал суд; большинство из них составлены крестьянами, практически не разбирающимися в законах и выносящими произвольные приговоры, которые варьируются от смертной казни до нескольких лет сурового труда. Кроме того, был издан ряд декретов и законов о земельной реформе, подробно описывающих последний этап земельной революции - перераспределение сельскохозяйственных земель."
 North_Vietnam_3_desc: "После радикализации земельной реформы элементами Коммунистической партии Вьетнама вскоре началась пустота и социальная изоляция помещиков. После публикации документа Политбюро, в котором подробно говорится, что один на тысячу человек всего населения должен быть казнен на том основании, что они являются помещиками или иным образом сотрудничают с помещиками; было подсчитано, что пятнадцать тысяч реакционеров и помещиков мертвы. До сих пор VWP начала кампанию по исправлению ошибок после казни этих землевладельцев, многие из которых были ложно или ошибочно приговорены к смертной казни. В ходе трехэтапной операции она переклассифицировала крестьян и восстановила имущество, которое было ошибочно экспроприировано или иным образом компенсировано за эти ошибки; кроме того, была проведена ревизия, инвентаризация и сосредоточенная повторная индоктринация местного персонала."
 Cambodia_Com_1_desc: "\N После разделения Индокитайской коммунистической партии на Лаосскую, вьетнамскую и камбоджийскую было принято решение о создании камбоджийской коммунистической партии. Исполняющим обязанности председателя партии был назначен Сын Нгок Мин, первоначально получивший название Кхмерской народно - революционной партии. Ходят слухи, что КПРФ и Вьетминь связаны друг с другом и поддерживают очень прочные отношения; и КПРФ активно поддерживает вьетнамскую партию на этом начальном этапе своего существования."
 Cambodia_Com_2_desc: "Был начат долгий марш; неспособность Вьетминя договориться о политической роли КПРП на Женевской конференции побудила исполняющего обязанности председателя КПРП Сон Нгок Мина совершить марш в Северный Вьетнам с тысячью человек. Мужчины, оставшиеся в Камбодже, создали легальную политическую партию, в дополнение к Прачичону. Во время формирования Прачихона появились два новых лидера, которые будут управлять партией: Ту Самут из городского комитета и Сиу Хенг из сельского комитета; Городской комитет имеет теплые взгляды на Нородом Сианук и поддерживает Северный Вьетнам, в то время как Сиу Хэн был яростно против Нородома и выступает за борьбу за свержение\"феодального\" Сианука."
