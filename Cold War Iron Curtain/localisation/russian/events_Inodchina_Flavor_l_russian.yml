 Bangkok_Plot_1_desc: "\nNorodom Сианук, король Камбоджи, был свергнут правыми генералами и политиками Сын Нгок Тхань, Сэм Сари и региональный камбоджийский военачальник и губернатор Дап Чхуон; Сын Нгок Тхань собрал антикоммунистических и антимонархических партизан в южных районах Камбоджи, в то время как Чхуон вызвал восстание на северо-востоке. В то время как войска короля были отправлены для борьбы с восстанием, партизаны во главе с Тхань вторглись в Пномпень и захватили дворец; сборник Сон Нгок Тханя провозгласил образование Кхмерской Республики, в то время как короля оскорбляют, чтобы найти, вполне вероятно, что он бежал со своей семьей далеко от Камбоджи. Таиланд, Южный Вьетнам и Соединенные Штаты стремятся начать переговоры с новым правительством."
 Bangkok_Plot_2_desc: "\nSon Ngoc Thanh, камбоджийский генерал правого крыла, вместе с Сэмом Сари и региональным камбоджийским военачальником, а также губернатором Дапом Чхуоном попытались сместить короля Камбоджи Нородома Сианука с его места главы государства и короля нации; в то время как Тхань собирал антикоммунистических и антимонархических партизан на юге страны, большинство из которых были меньшинствами из кхмеров, кроме того, Чхуон должен был начать восстание.на северо-востоке. План был сорван разведывательными службами Нородома Сианука, которые попытались убить Чхуона, прежде чем он сбежал и позже был схвачен - умер от ран позже после допроса. И Сари, и Тхань бежали из страны, в то время как гражданин США и предполагаемый радист Виктор Мацуи был арестован, что побудило Нородома обвинить ЦРУ в организации переворота против него из-за теплых отношений с Китайской Народной Республикой. Фотографии трупа Чхуона были сделаны и показаны в Пномпене-последний знак попытки переворота против Нородома; сторонники режима обвинили Таиланд, Южный Вьетнам и Соединенные Штаты в попытке свергнуть камбоджийского лидера."
 Mon_Cambodia_1_desc: "Откровенный критик принца Нородома Сианука из-за его разрядки с Китайской Народной Республикой, националист и генерал правого крыла, Дап Чхуон был министром внутренней безопасности и губернатором провинции Сиемреап в 1950-х годах. После того, как его исключили из кабинета министров, он все больше разрывал свои связи с режимом Нородома, кульминацией которого стал Бангкокский заговор. Он был арестован, допрошен и впоследствии умер от полученных ран; многие утверждают, что Лон Нол, камбоджийский генерал и политик, казнил его из-за опасений быть замешанным в Бангкокском заговоре."
 Mon_Cambodia_2_desc: "Сегодня был застрелен журналист, редактор газеты Pracheachon и один из представителей левого Объединенного фронта Иссарака Ноп Бопханн. Будучи убитым возле военной казармы в Пномпене, он был опасным элементом администрации Нородома Сианука из-за его поддержки партизанского движения, которое когда-то занимало половину камбоджийской территории; многие утверждают, что принц сам приказал его убить, в то время как он, конечно, яростно отрицает эти утверждения и утверждает, что он был поклонником решимости Бопхана."
 Mon_Cambodia_3_desc: "Глава городского комитета Прачихона Ту Самут исчез со всей страны. Не было найдено ни единого следа левого политика и наставника видного коммунистического лидера Салота Сара, более известного как Пол Пот. Интеллигентный человек с умеренным темпераментом, он был известен тем, что призывал к мирным переговорам с королем Нородомом Сиануком и признавал его фигурой стабильности и национального единства. Многие из окружения Пол Пота утверждают, что Лон Нол, камбоджийский военный генерал, арестовал и казнил его; в то время как слухи, даже внутри партии, утверждают, что Пол Пот был тем, кто организовал убийство своего бывшего наставника и союзника. Какова бы ни была истинная причина исчезновения Ту Самута и его последующей смерти, теперь она похоронена между стопками документов в Камбодже."