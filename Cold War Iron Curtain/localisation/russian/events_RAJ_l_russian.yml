l_russian:
 PM_Shastri.1.d: "Ночью скончался лидер Индийского национального конгресса Лал Бахадур Шастри. Пресс-секретарь не сообщил подробностей, лишь подтвердив, что лидер оппозиции скончался внезапно. Шастри — ветеран Конгресса, руководил партией Конгресса после кончины Джавахарлала Неру. Его опыт, спокойное поведение и политическая смекалка сделали его очень эффективным политическим лидером. Хотя все указывает на то, что его смерть наступила по естественным причинам, ходят слухи, что Шастри мог стать жертвой заговора. Партия Конгресса планирует провести немедленные переговоры, чтобы определить нового лидера партии. Индира Ганди, дочь Неру, является явным фаворитом на то, чтобы взять власть в свои руки и попытаться вернуть партию к власти."
 goa.1.d: "После столетий подавления индейцы Гоа требуют свободы. Проиндийские забастовки и протесты продолжают требовать от португальцев прекращения их правления на территории. Действительно, официальные лица в этом районе сообщают, что большое количество индийцев покидают Гоа в поисках свободы и спасения от насилия. Чтобы предотвратить нестабильность и продемонстрировать нашу решимость, правительство утвердило приказ о развертывании вооруженных сил вдоль границы с Гоа. Присутствие наших войск поднимет боевой дух и даст ясное предупреждение португальцам, что они не могут действовать безнаказанно."
 goa.2.d: "Военный командующий в Гоа отправил срочный доклад в Лиссабон. Он подробно описал крупную мобилизацию вооруженных сил Индией на границе с Гоа. Количество войск, оборудования и расположение ясно указывают на то, что это не оборонительные развертывания. Это ставит наши силы в Гоа в отчаянное военное положение, поскольку они превосходят численностью, вооружены и находятся в милях от поддержки. С этого момента мы должны вести себя осторожно, поскольку Индия, похоже, сильно заинтересована в военном варианте. Гражданские официальные лица также прислали отчет, в котором отмечалось, что индийские СМИ, похоже, сотрудничают с правительством, демонизируя наше присутствие."
 goa.3.d: "Гоа долгое время был пятном на карте для жителей Индии. Патриотичные индейцы не понимали, как европейские колониальные колонии могут существовать рядом со свободной Индией. В этой ситуации правительство Индии искало решение с Португалией, но они отказались. В конце концов, операция «Вижай» была начата. Несмотря на казалось бы большие военные преимущества над португальцами, операция провалилась. Никогда еще со времен битвы при Плесси независимая индийская держава не терпела такого сокрушительного поражения от европейской державы. Мы должны провести переоценку наших вооруженных сил. Многие утверждают, что мы сохраняем слишком много обычаев и структур колониальной эпохи, нам не хватает национального духа. Несмотря на то, что у военных было так много офицеров с боевым опытом, военные полностью провалили то, что казалось легкой задачей. Португалия ликует и с нетерпением ждет возможности продиктовать условия, мы должны зализать наши раны от этого унижения."
 goa.4.d: "Когда до Лиссабона дошли вести о военной победе в Гоа, люди начали радостно праздновать. Индийское вторжение стало самым большим вызовом политике военной борьбы с деколонизацией. Наши войска столкнулись с опытным противником, имеющим преимущество в размерах и географии. Несмотря на эти устрашающие препятствия, наши силы, умело руководимые, с высоко мотивированными войсками, добились того, что казалось невозможным, - успешной обороны Гоа. Политика правительства по отказу от переговоров с Индией теперь кажется оправданной. Наблюдатели отмечают, что победа укрепляет правительство и делает Португалию устойчивой мировой державой. В военном отношении был достигнут ценный опыт и, что более важно, уверенность. Теперь Португалия может успешно диктовать Индии и сохранить Гоа."
 goa.5.d: "Защита Гоа всегда была трудной задачей. Территория окружена Индией и враждебно настроенным к нашему присутствию населением. ООН не удалось привлечь Индию к ответственности за ее агрессивную политику до или во время конфликта. Наши собственные союзники проигнорировали мольбы о помощи, когда индийские военные мобилизовали наступательные силы на границе Гоа. Однако, несмотря на огромные трудности, гарнизон выполнил свой долг и сопротивлялся, как мог. Сегодня правительству сообщили, что наши силы сдались, исчерпав свою способность к сопротивлению. Хотя наши европейские союзники и США выступили с осуждением, ясно, что их реакция не будет выходить за рамки дипломатии. Жители Лиссабона понимали, что задача очень трудная, но все же ожидается, что они будут весьма удручены, когда до них дойдут новости."
 goa.6.d: "Крошечная нация Португалия бросила вызов предсказаниям всех наблюдателей и успешно защитила свою колонию в Гоа от вторжения Индии. Индийская армия, несмотря на наличие преимуществ во всех категориях, особенно в географическом, не смогла успешно использовать их для успешного вмешательства. В течение нескольких месяцев напряженность нарастала, поскольку проиндийские жители Гоа все чаще протестовали против португальского правления в Гоа. Индийская армия после мобилизации начала операцию «Вижай» (Победа), чтобы решительно решить проблему, но была ошеломлена яростной обороной португальцев. Успех Португалии придал смелости правительству и укрепил его авторитет среди граждан. В то время как в Нью-Дели правительство сталкивается с гневными речами оппозиции и по всей стране, правительственные чиновники вместе с военнослужащими, как говорят, сталкиваются со словесными оскорблениями в связи с унизительным поражением."
 goa.7.d: "Гоа долгое время был пятном для народа Индии. Патриотически настроенных индийцев приводила в ярость мысль о существовании европейских колониальных анклавов рядом со свободной Индией. После того, как Португалия отказалась от всех дипломатических предложений и с ростом напряженности, армия начала мобилизацию на границе. Вскоре после этого была начата операция «Вижай» с целью освобождения Гоа от почти 500-летнего португальского колониализма. Индийские военные продемонстрировали свою современную подготовку и военную мощь, быстро победив португальцев. Жители Гоа поддерживали войска в их продвижении, и победа вызвала чувство массовой эйфории по всей Индии. Операция демонстрирует, что индийское государство способно быстро разрешать региональные споры с помощью военных действий, что, несомненно, заставит соединенные штаты уважать наши возможности."
 goa.8.d: "450 лет португальского колониального присутствия в Индии официально закончились после успешного захвата Индией Гоа. Независимость Индии вызвала рост национализма среди индийцев в португальской колонии Гоа. Его попытки обсудить статус Гоа постоянно отвергались Португалией. Однако во время недавних беспорядков индийские военные собрали значительные силы вокруг колонии и приказали вмешаться, сославшись на необходимость защиты индейцев в Гоа. После непродолжительного конфликта капитулировал гораздо меньший португальский гарнизон. Попытки Португалии заручиться международной поддержкой не увенчались успехом, поскольку немногие страны хотели поддерживать колониальную державу. По всей Индии царит чувство гордости и радости за успешное изгнание колониальной державы с субконтинента и военную доблесть индийской армии."
 goa.9.d: "Индийское правительство, исчерпав все усилия для мирного урегулирования, объявило, что оно направляет свои вооруженные силы для освобождения Гоа от почти пятивекового колониализма. В последние месяцы португальские власти изо всех сил пытались справиться с протестами и забастовками местных проиндийских субъектов. Наблюдатели считают, что индийская армия имеет большое преимущество в численности, оснащении и опыте. Правительство Португалии осудило то, что оно называет агрессией Индии, пообещав, что ее гарнизон отразит любое нападение. Португалия в течение многих лет отказывалась от любых переговоров с Индией по поводу Гоа, серьезная неудача может стать ударом по действующему правительству. Для индийцев операция позволит Индии поиграть мускулами в качестве региональной державы."
 India_Elects_70s.1.d: "Индийский народ принял участие в выборах, которые, по мнению многих, являются самыми ожесточенными в истории Индии. На выборах партия Конгресса во главе с Индирой Ганди выступает против Мораджи Десаи и его партии Джаната. Партия Конгресса выступает на платформе, призывающей к более социалистической трансформации Индии. Партия Джаната обещает восстановить Индию в видении Махатмы Ганди и осуждает Конгресс за стремление навязать народу Индии чужую идеологию. Джаната обещает возвращение традиционных индийских ценностей и защиту индийской промышленности и сельскохозяйственных производителей. Народ Индии должен принять решение о большей социализации или толчке к той Индии, которую представляли ее первые борцы за свободу."
 India_Emergency.20.d: "Ссылаясь на продолжающуюся нестабильность и экономический кризис, правительство Индии во главе с премьер-министром Индирой Ганди объявило о приостановке всех выборов. Главные городские газеты подвергли это решение резкой критике. Однако проконгрессовские СМИ громко выступили в поддержку. Оппозиция призывает к массовым акциям протеста в ближайшие дни, при этом многие политики обвиняют правительство в отсрочке выборов до установления полного контроля. Партия Конгресса в ответ призвала своих сторонников подготовить собственные мероприятия в поддержку правительства в это критическое время. Похоже, что политическая ситуация в Индии остается нестабильной и неопределенной."
 India_Emergency.17.d: "Премьер-министр Индира Ганди заявила, что чрезвычайное положение подходит к концу, и через несколько месяцев состоятся новые выборы. Она приказала правительству освободить всех политических заключенных, чтобы обеспечить свободную и открытую избирательную кампанию. Индира Ганди изображает выборы и отмену чрезвычайных ограничений как естественный прогресс. Она выразила надежду, что люди подтвердят свою поддержку Конгресса на выборах. Однако оппозиция утверждает, что именно давление индийского народа вынудило правительство провести выборы. Почти все оппозиционные партии уже заявляют, что предстоящие выборы будут проходить между сохранением диктатуры или демократии."
 India_Emergency.1.d: "Судья Джагмоханлал Синха вынес вердикт по делу штата Аттер-Прадеш против Раджа Нараина. Радж Нараин, проигравший свои выборы в нижнюю палату парламента премьер-министру Индире Ганди, обжаловал огромную победу Ганди на выборах. Он утверждает, что Ганди и партия Конгресса использовали государственные ресурсы, взяточничество и другие средства, чтобы обеспечить ей победу над ним два к одному. Судья в ошеломляющем вердикте согласился с Нараином и аннулировал победу Ганди. Индире Ганди запрещено занимать пост премьер-министра. Судья приказал партии Конгресс выбрать нового премьера в течение 20 дней. Оппозиция и Конгресс считают, что в случае принятия вердикта необходимо провести новые выборы. Индира Ганди может принять приговор или обратиться в Верховный суд, что позволит ей остаться премьер-министром. Ее советники считают, что если она подаст апелляцию, то должна объявить чрезвычайное положение, чтобы предотвратить нестабильность и обеспечить нейтралитет судов."
 Sikkim_Accension.1.d: "Лидер Партии национального конгресса Сиккима (SNCP) призвал правительство Индии завершить интеграцию Сиккима в состав Индии. Это следует за недавними действиями индийского парламента по изменению отношений Сиккима с Индией из протектората в штат в составе Индийского Союза. Чогьял Сиккима продолжает сопротивляться таким попыткам, призывая вместо этого к свободному и справедливому референдуму о том, должен ли Сикким оставаться под протекторатом или присоединиться к Индийскому союзу. Премьер-министр Индии должен решить, реагировать ли на избранную народом SNCP и вмешаться, или отступить и отказаться от прямого вмешательства."
 Sikkim_Accension.2.d: "Столица Сиккима гудела от волнения и страха, когда ее жители видели, как индийские войска вошли в город и захватили ключевые правительственные здания, включая дворец. Правительство Индии развернуло свои силы после получения запроса от избранных представителей Сиккима и на фоне опасений, что ситуация может перерасти в столкновения. Индийская армия утверждает, что ее силы существуют только для того, чтобы защищать людей и не вмешиваться в их дела. В некоторых кругах этот шаг резко осуждается как вопиющее вмешательство в дела Сиккима. Однако многие индийцы аплодируют правительству за лучшее содействие интеграции нового штата в Индийский союз. Премьер-министр Индии объявил, что вскоре будет проведен референдум о будущем Сиккима, чтобы определить будущие отношения Сиккима и Индии."
 Sikkim_Accension.3.d: "Под надзором индийской армии жители Сиккима проголосовали за то, присоединиться ли к Индийскому союзу или остаться под протекторатом. После подведения результатов более девяноста пяти процентов людей проголосовали за вступление в Индийский союз. Проиндийские сторонники вышли на улицу, чтобы отпраздновать результаты, хотя некоторые из наиболее промонархических районов были заметно тихими. Некоторые наблюдатели отметили, что обстоятельства голосования выглядели поспешными, и ходят слухи, что правительство Индии манипулировало бюллетенями для достижения полной победы на выборах. Как бы то ни было, монархия Сиккима упразднена, и Индия скоро примет в союз новый штат."
 Sikkim_Accension.4.d: "Индийский парламент проголосовал за принятие новой поправки к конституции, официально интегрирующей Сикким в качестве новейшего штата в Индийский Союз. Прежние отношения протектората были отменены, и управление Сиккимом будет происходить в соответствии с законами Индии. Это завершает длительный процесс интеграции бывшего колониального княжества в Индию. В парламенте поправка получила всеобщую поддержку, и интеграция Сиккима рассматривается как большой успех премьер-министра. Китайское и пакистанское правительства осудили недавние действия как открытую аннексию."
 INC_VICTORY.1.d: "Недавний закон, принятый во время чрезвычайного положения, был недавно подтвержден Верховным судом. Это крупная победа правительства Конгресса. В последние годы партия Конгресса и Индира Ганди усердно работали над ослаблением могущественной индийской судебной системы. Судьи, использующие свои полномочия для вмешательства в политику и правительство, были уволены, а новое законодательство ограничило судебный надзор. Эта последняя победа подтверждает, что их усилия по контролю над судебной системой были успешными. Лидеры оппозиции решительно осудили судебные решения, а некоторые обвинили судей в том, что они являются штампами для недемократического режима."
 INC_VICTORY.2.d: "Старая гвардия и оппозиция партии Конгресса принадлежат к другой политической эпохе в Индии. Многие, несмотря на провозглашение левых взглядов, по-прежнему являются продуктами колониальных школ и идей. Новое поколение молодых активистов Конгресса становится активным сторонником Индиры Ганди и ее усилий по более непосредственному взаимодействию с индийским народом. Это мужчины и женщины, получившие образование в независимой Индии. Это восходящее молодежное крыло возглавляет сын Индиры Ганди Санджай Ганди. В последние недели многие из этих высокомотивированных партийных работников получили повышение или были назначены на руководящие должности как в партии, так и в правительстве. Хотя премьер-министр приветствует развитие событий, многие старые члены партии все больше обеспокоены продвижением радикальных идей. В одной редакционной статье бывшего приверженца Конгресса даже премьер-министр обвинялся в укреплении тотальной власти над партией Конгресса."
 INC_VICTORY.3.d: "Партия Конгресса направила делегацию во главе с высокопоставленным партийным чиновником сикхов для переговоров с избранными лидерами сикхов. Сообщество сикхов выступило против чрезвычайного положения, проводя демонстрации и обвиняя правительство в фашистских наклонностях. Хотя многие видные члены сикхской оппозиции не присутствовали, некоторые умеренные лидеры все же пришли. Правительство заверило их, что не намерено подрывать индийскую демократию. Кроме того, были даны обещания прекратить судебные разбирательства и освободить некоторых сикхов, арестованных в ходе акций протеста. Переговоры не сняли напряженность в Пенджабе, но уменьшили напряженность между сикхской общиной и партией Конгресса."
 India_Econ.6.d: "Федеральный совет по развитию обсуждает, следует ли развивать промышленность в Бомбее или Мадрасе. Оба являются крупными городами, и их национальные политики оказывают огромное давление на премьер-министра, чтобы тот продвигал их город. Бомбей и Мадрас - исторические портовые города с огромным культурным и политическим влиянием. Выбор Бомбея укрепит премьер-министра и его отношения с влиятельным бизнесом и киноиндустрией. Поддержка Мадраса вызовет симпатию премьер-министра к югу Индии и ее связям с другими крупными торговыми постами в Индийском океане."
 India_Econ.7.d: "Федеральный совет по развитию рассматривает возможность инвестирования в новые сталелитейные заводы в стране. Эти два города - Дели и Бангалор. Дели на бумаге кажется идеальным, учитывая его историю как крупного промышленного центра и расположение по отношению к столице. Однако Бангалор - исторически важный город на юге Индии. Строительство там сталелитейных заводов укрепит отношения между северной и южной Индией. Премьер-министр должен решить, на каком участке строить."
 India_Econ.8.d: "Финансовые регуляторы и министр финансов обратились к премьер-министру. Они отмечают быстрый рост банковского дела в стране и необходимость продвижения финансовых институтов. Гуджрат и Хайдарабад рекламируются как потенциальные места для поощрения создания новых банков и финансовых рынков. Исторически Гуджрат является крупным торговым центром, и такие инвестиции могут принести благо в торговле на Ближнем Востоке. Инвестиции в Хайдарабад открыли бы местным жителям возможность доступа к финансовым учреждениям. Решение должен принять премьер-министр."
 India_Econ.11.d: "Федеральное правительство сталкивается с резкой негативной реакцией со стороны газет и региональных политических партий на юге Индии. Они пишут отчеты, в которых подчеркивается стремление федерального правительства инвестировать в штаты северной Индии. Многие из наиболее агрессивных писателей заявляют, что южная Индия становится полуколонией для нужд северных индийцев. Премьер-министр отвергает эти обвинения, и его политические союзники на юге высказываются по этому поводу. Однако индийскому правительству потребуется много времени, чтобы восстановить свои связи с народом южной Индии."
 India_Econ.12.d: "Федеральное правительство сталкивается с резкой негативной реакцией со стороны газет и региональных политических партий на севере Индии. Они пишут статьи, осуждающие правительство за чрезмерную реакцию на обеспокоенность южных штатов Индии тем, что федеральное правительство, традиционно доминирующее в Северной Индии, игнорирует его. Все больше писателей заявляют, что северные индийские штаты наказываются за то, что они находятся в авангарде освобождения, и скованы этой предвзятостью и квотами. Премьер-министр отверг эти обвинения, заявив, что решения были полностью основаны на беспристрастном анализе. Однако индийскому федеральному правительству потребуется много времени, чтобы восстановить свои связи с народом и правительствами северной Индии."
 KashmirIND70.1.d: "Ситуация в Кашмире остается в подвешенном состоянии. Наши силы сохраняют контроль над ключевыми районами, однако пакистанцы продолжают занимать ключевые районы территории. Они также непреклонны в своих амбициях захватить всю провинцию и разжигают волнения среди кашмирцев. Высокопоставленные руководители обороны, политики и разведки недавно встретились, чтобы обсудить ситуацию. Один из вариантов — сосредоточиться на внутренней безопасности, чтобы предотвратить возможные восстания, особенно те, которые спонсирует Пакистан. Такой фокус также расширил бы нашу базу поддержки среди кашмирцев. Второй вариант — рассмотреть ограниченное наступление через границу. Такая акция могла бы улучшить наше положение на границе и продемонстрировать пакистанцам бесперспективность поиска военного решения в будущем."
 KashmirIND70.25: "Полиция и агенты разведки в Сринагаре выявили нескольких ключевых студентов и политических агитаторов, выступавших либо за независимость Кашмира, либо за объединение с Пакистаном. Эти агитаторы регулярно устраивают митинги, иногда переходящие в публичные демонстрации. Один из вариантов — арестовать этих агитаторов, это может ограничить любые протесты в обозримом будущем. Однако это может иметь неприятные последствия и спровоцировать новые волнения. Другой вариант — просто следить за протестующими и принимать текущий уровень протестов, вмешиваясь таким образом, чтобы предотвратить их распространение."
 KashmirIND70.26: "Недавний арест общественных агитаторов в Кашмире оказал сильное влияние на беспорядки в регионе. Отсутствие руководства привело к сокращению организованных митингов и публичных протестов. Похоже, оставшиеся хардкорные активисты не могут донести свое послание до людей. Мы ожидаем, что со временем появится новая группа лидеров, но на это потребуется время, и, похоже, наша операция полностью разрушила протестную инфраструктуру в Шринагаре. Аресты также показали, что некоторые из лидеров спонсировались пакистанской разведкой."
 KashmirIND70.27: "После пятничной молитвы тысячи людей вышли на улицы Сринагара в знак протеста против арестов ведущих агитаторов в городе. Наша операция по задержанию этих агитаторов не привела к обезглавливанию лидеров протеста. Вместо этого оставшиеся агитаторы разработали план по распространению информации об арестах и использованию пятничных молитвенных проповедей в качестве места для разжигания беспорядков. Протесты стали намного масштабнее, чем раньше, и привлекли внимание международных СМИ. Пакистанцы используют это для распространения собственной пропаганды. Вероятно, нам придется отпустить некоторых агитаторов, чтобы снизить напряженность."
 KashmirIND70.30.d: "Индия инициировала радиопередачи, нацеленные на наше присутствие в Кашмире. Они изображают наше освобождение кашмирцев как оккупацию, которая привела к разделению семей в Кашмирской долине. Что еще более важно, индийцы распространяют ложную пропаганду о том, что кашмирцы в Индии пользуются всеми демократическими правами, в то время как пакистанские кашмирцы находятся под военной оккупацией. Предпринимаются усилия, чтобы опровергнуть это повествование, но для некоторых кашмирских семей, которые обнаружили, что их земля оккупирована солдатами или разлученными семьями, они находят сообщения привлекательными. Также участились студенческие протесты, призывающие к большей автономии и административным правам для правительства Азад Кашмир."
 KashmirIND70.2.d: "Один из наших сотрудников по закупкам за границей, посещая производителя горного оборудования для закупок, заметил несколько единиц оборудования с индийскими военными опознавательными знаками. Спокойно расспросив некоторых сотрудников, он обнаружил, что Индия делает крупный заказ на боевое снаряжение в горах. Мы не знаем, что это значит, но размер заказа и расписание указывают на то, что индийцы, возможно, замышляют какую-то авантюру. Возможно, на границах с Гималаями или в Кашмире. Некоторые в штабе призывают на всякий случай перебросить силы на Кашмирский фронт, однако другие генералы утверждают, что такая чрезмерная реакция может оставить другие фронты открытыми для индийской агрессии."
 PostSimla.1.d: "Видный кашмирский лидер шейх Абдулла и премьер-министр [IND.GetLeader] подписали соглашение, называемое Шейхскими соглашениями. Соглашение было заключено после недавней военной победы Индии над Пакистаном. Теперь, когда стратегический баланс сил изменился в пользу Индии, кашмирский лидер решил, что ему необходимо достичь соглашения. Соглашение призывает к внесению поправок в конституцию, чтобы начать официальную интеграцию Кашмира в Индию. Первым районом Кашмира, который будет включен в состав индийского штата, станет Джамму. Для Кашмира начался путь к формальной аннексии и интеграции. Пакистанцы и кашмирские националисты осуждают соглашение как капитуляцию шейха Абдуллы."
 PostSimla.2.d: "Аманулла Хан, проживающий в Великобритании кашмирский националист, недавно основал в Бирмингеме новую организацию под названием «Фронт освобождения Кашмира». Хан - известный националист, он участвовал в угоне самолета рейса Indian Airlines, прежде чем сбежать в Англию. Его почитает большая кашмирская община страны. Группа быстро набирает популярность и открывает отделения в Западной Европе, Пакистане, США и странах Персидского залива. В настоящее время организация не участвует в прямом конфликте с индийским государством, но растет, организуется и проводит кампании за политические права кашмирцев. Это только вопрос времени, когда правительству Индии придется иметь дело с этой группой напрямую, поскольку ее публикации набирают популярность в Сринагаре и Кашмирской долине."
 PostSimla.3.d: "Национальная конференция (НК) решительно победила на выборах штата в индийском Джамму и Кашмире. Наблюдатели отмечают, что это были самые свободные выборы, проведенные в штате с тех пор, как Индия, бывшее княжеское государство, присоединилась к Индии. НК является старейшей политической партией в штате и претендует на то, чтобы представлять всех жителей штата. Победа на выборах является крупной победой индийского правительства, поскольку НК является близким союзником Нью-Дели. Кашмирские активисты за границей и в Пакистане будут разочарованы результатом. Индийские газеты восхваляют результаты как подтверждение того, что спор о Кашмире был твердо решен в пользу Индии после ее победы над Пакистаном."
 Janata.1.d: "Коалиция партии Джаната недавно отклонила законы эпохи чрезвычайного положения, ограничивающие рабочие или политические забастовки. Премьер-министр заявил, что забастовки и акты гражданского неповиновения сыграли жизненно важную роль в обретении Индией независимости и прекращении чрезвычайного положения. Поскольку эти действия позволяют людям быть услышанными, правительство не вправе вмешиваться или ограничивать такие действия. Он добавил, что это продолжает его видение того, как Индия вернется к видению Махатмы Ганди для нации. Сообщается, что владельцы бизнеса и фабрик разочарованы этим решением, утверждая, что ничто не может помешать политическим лазутчикам манипулировать рабочими и использовать забастовки как средство нанесения вреда экономике в поддержку более радикальных программ."
 Janata.2.d: "Правительство Индии рассматривает возможность представления в парламент закона, требующего от иностранных корпораций вступать в партнерские отношения с индийскими корпорациями. Сторонники закона утверждают, что он будет способствовать развитию местной промышленности и самоэффективности. Они утверждают, что иностранные корпорации с радостью подчинились бы закону, чтобы выйти на крупный индийский рынок, и что такие отношения помогут индийской промышленности быстро модернизироваться. Противники закона опасаются, что потенциальный внутренний промышленный бум, обещанный сторонниками законопроекта, не материализуется, и иностранные корпорации могут в конечном итоге уйти с индийского рынка. Премьер-министр должен решить, соглашаться ли с законом, однако, если он откажется, он столкнется с негативной реакцией со стороны партии."
 Janata.3.d: "Недавнее законодательство, требующее от иностранных корпораций вступать в партнерские отношения с местными индийскими корпорациями, имело неприятные последствия. Coca Cola и IBM входят в число наиболее известных иностранных фирм, объявивших о своем уходе из Индии. Компании ссылаются на новые индийские законы как на слишком разрушительные для роста и решили покинуть индийский рынок. Индийское правительство попыталось сделать мужественное лицо, заявив, что индийские производители покроют потребительский спрос на такие товары. Экономисты предлагают более пессимистическую оценку. Они отмечают отсутствие иностранных товаров, будет тормозить экономическое развитие Индии. Отсутствие иностранных фирм ухудшит доступ к технологиям и помешает индийским корпорациям конкурировать с товарами на международном рынке."
 Janata.4.d: "В последние недели правящая партия Джаната приняла конституционные поправки, отменяющие поправки, принятые во время чрезвычайного положения. Правительство отмечает, что эти поправки были призваны узаконить недемократический захват власти и наделить исполнительную власть чрезвычайной властью. Новые реформы призваны восстановить доверие к судебной системе и предотвратить дальнейшие попытки подорвать индийскую демократию. Премьер-министр заявил, что Индия прочно восстановила себя как крупнейшая демократия в мире. Этот шаг широко приветствуется в СМИ, хотя несколько лидеров оппозиции выразили обеспокоенность тем, что теперь они будут открыты для судебного разбирательства."
 Janata.5.d: "Партия Джаната состоит из социалистов, сторонников бизнеса, региональных и религиозных партий по всей Индии. У него противоречивые интересы и ряд партнеров по коалиции с противоположными точками зрения. Несмотря на свою победу, партия Джаната в настоящее время имеет слабую коалицию. Недавно левые депутаты Джаната заявили, что они не всегда могут голосовать за партию в парламенте. Есть опасения, что партия Конгресса может использовать это в своих интересах и подорвать законодательную повестку дня правительства. Премьер-министр призвал к встрече всех основных партнеров по коалиции и лидеров джанаты, чтобы найти решение и укрепить коалицию."
 Janata.6.d: "Премьер-министр стремился заручиться поддержкой внутри партии Джаната и ее союзников по коалиции, особенно среди ее левых членов на недавней встрече. Однако эти усилия не увенчались успехом, и теперь левое крыло партии категорически заявляет, что не будет гарантировать свое право голоса по всем вопросам, особенно связанным с экономикой. Они продолжают осуждать Конгресс за его автократическую структуру, но заявляют, что не могут предавать индийских рабочих ради политической выгоды. Правительство попыталось развеять их опасения и пообещало сбалансированную экономическую программу, но левые отказались пойти на компромисс в своей позиции. Премьер-министру придется иметь дело с еще более слабой коалицией и более сложными законодательными баталиями в парламенте."
 Janata.7.d: "Премьер-министр стремился заручиться поддержкой внутри партии Джаната и ее союзников по коалиции, особенно среди ее левых членов на недавней встрече. Переговоры имели большой успех, поскольку левое крыло коалиции согласилось не отзывать свой голос в поддержку правительственных законопроектов, которые они считают слишком ориентированными на бизнес или капиталистическими. Однако они согласились при условии, что Джаната ограничит некоторые из предложенных им законов и продолжит поддерживать усилия по защите прав рабочих в Индии. Это небольшой компромисс, и премьер-министр может быть уверен, что его коалиция теперь намного сильнее, чем когда она начиналась."
 Janata.8.d: "Партия Джаната объявила о ряде новых реформ для спецслужб страны. Военные офицеры, прикрепленные к этим ведомствам, будут смещены с определенных должностей и заменены гражданскими служащими. Кабинет также будет осуществлять более прямой надзор за этими агентствами. Все внутренние операции должны быть немедленно прекращены, включая текущее расследование. Правительство надеется, что эти реформы позволят оперативникам разведки сосредоточиться на внешних угрозах и больше не будут подвергаться злоупотреблениям со стороны какого-либо будущего правительства, как это было во время чрезвычайного положения. Перемещение офицеров также предотвратит любое военное вмешательство во внутренние дела."
 Janata.9.d: "Премьер-министр учредил Комиссию Мандала для выявления отсталых в социальном или образовательном отношении классов в Индии и представления рекомендаций по расширению прав и возможностей этих групп. Комиссия выявила конкретные касты, отстающие в социальном развитии, образовании, экономическом развитии. В итоговом отчете рекомендуется ряд реформ. Один призывает к предотвращению грабительских займов бесправным кастам. Более спорные рекомендации призывают к установлению квот на государственные должности и образовательные учреждения. Если премьер-министр решит приступить к реализации предложений, он рискует получить негативную реакцию со стороны тех сообществ, которые не подходят под категорию отсталого класса, но при этом чувствуют себя бесправными. Другой вариант — просто отложить рекомендации Мандала и оставить их другому правительству, что разозлит эти сообщества."
 IND_PRC70s.1.d: "Новое индийское правительство во главе с Мораджи Десаи обратилось с просьбой направить в страну делегацию. Новое правительство Индии желает принять меры по укреплению доверия, чтобы улучшить отношения и облегчить мирное решение наших текущих проблем. Многие из наших экспертов по международным отношениям считают, что мы должны встретиться с индийцами, поскольку улучшение отношений могло бы открыть доступ к торговле с Индией и ее обширному рынку. Другие считают, что это было бы больше в наших интересах, и пакистанцы были бы признательны, если бы мы отвергли эту инициативу."
 IND_PRC70s.5.d: "Недавно в столицу прибыла индийская делегация для переговоров на высшем уровне по нормализации отношений между нашими государствами. Индийцы также привезли некоторых из своих высокопоставленных экономических чиновников и призывают к расширению торговых возможностей. Индийское правительство не стеснялось обсуждать свою заинтересованность в нормализации наших отношений. У нас есть три варианта. Мы можем воспользоваться этой возможностью для нормализации отношений путем расширения культурных обменов. Или мы могли бы нормализовать отношения и подписать несколько торговых соглашений, чтобы увеличить потенциальную торговлю между нашими странами. Первые два варианта могут помочь проложить путь к будущим соглашениям. Последний вариант — вежливо принять миссию и отправить обратно без каких-либо договоренностей и сохранить статус-кво. Это поможет связям с Пакистаном и покажет нашу позицию по отношению к Индии."
 IND_PRC70s.4.d: "Недавняя дипломатическая миссия в Китай прибыла в Нью-Дели. Миссия успешно добилась дипломатического прорыва, включая соглашение о расширении культурных обменов. Индийское правительство поставило нормализацию отношений с Китаем в качестве одной из основных целей своей внешней политики, и, похоже, их усилия приносят свои плоды. Две страны также договорились расширить свои посольства, чтобы облегчить поездки и взаимодействие между двумя государствами. Критики премьер-министра признают его успех, но отмечают, что соглашения не знаменуют собой существенный сдвиг в отношениях и не решают текущие нерешенные вопросы между двумя государствами."
 IND_PRC70s.3.d: "На переговоры в столицу прибыла представительная делегация в составе высокопоставленных государственных чиновников и политиков Индии. Индийцы стремятся нормализовать отношения и начать укреплять доверие между нашими двумя штатами. Индийская делегация настаивает на том, что премьер-министр стремится к прорыву в двусторонних отношениях между двумя самыми могущественными азиатскими державами. Мы должны решить, стоит ли отвечать взаимностью, и начать процесс нормализации отношений. Мы сделали бы это, подписав соглашение об увеличении культурных обменов между нашими государствами. Такое соглашение уменьшит вероятность конфликта с Индией, но может оттолкнуть Пакистан. Другой подход состоит в том, чтобы вежливо принять индийцев, а затем отослать их без каких-либо обязательств, оставив нетронутым статус-кво."
 IND_PRC70s.2.d: "Китайцы положительно отреагировали на нашу просьбу и официально попросили нас прислать делегацию. Это знаменует собой крупный прорыв в индо-китайских отношениях. Мы должны решить, какой тип дипломатической миссии послать. Мы можем послать одного во главе с нашим министром иностранных дел для работы по нормализации дипломатических отношений и снижению существующей напряженности. Материальные выгоды в дипломатической миссии будут ограничены, но она имеет высокую вероятность успеха. Или мы могли бы послать миссию, в которой доминируют экономические чиновники, чтобы настаивать на новом экономическом соглашении. Расширение экономических связей могло бы стать способом достижения экономического роста и позитивных связей. Экономическая миссия может предложить больше вознаграждения, но она очень рискованна и может легко закончиться неудачей."
 IND_PRC70s.6.d: "Недавняя дипломатическая миссия в Китай прибыла в Нью-Дели. Миссия успешно добилась дипломатического прорыва, включая соглашение о расширении культурных обменов. Кроме того, обе стороны согласились поощрять торговые связи посредством нескольких договоров. Индийское правительство поставило нормализацию отношений с Китаем в качестве одной из основных целей своей внешней политики, и, похоже, их усилия приносят свои плоды. Две страны также договорились расширить свои посольства, чтобы облегчить поездки и взаимодействие между двумя государствами. Критики премьер-министра признают его успех, но отмечают, что ему не удалось решить более серьезные нерешенные вопросы. Правительство утверждает, что достижение такого соглашения требует принятия мер, и Индия добилась больших успехов."
 slow_text: ""
 India_Emergency.2.d: "Премьер-министр Индира Ганди и ее правительство разрешили президенту объявить чрезвычайное положение в Индии. Правительство сослалось на экономический кризис, вызванный недавними забастовками, в связи с недавними политическими беспорядками. В качестве причины чрезвычайного положения также была названа угроза возобновления конфликта с Пакистаном. Это беспрецедентное изменение, и оно уже заставляет оппозиционных политиков призывать к новым забастовкам и сопротивлению. Премьер-министра обвиняют в объявлении чрезвычайного положения, чтобы предотвратить ее отстранение от власти из-за приговора Раджу Нараину."
 India_Emergency.3.d: "Недавно суды подтвердили чрезвычайное положение, объявленное правительством Индиры Ганди. Судьи, вызвавшие беспокойство, были заменены проправительственными судьями, которые быстро возвысились над ними. Суды также утверждают ордера на арест, выдаваемые правительством в условиях чрезвычайного положения. Продолжающиеся усилия Индиры Ганди по замене судей в ее пользу подвергаются резкой критике со стороны СМИ и оппозиции. Несмотря на это, усиление государственного контроля над судебной системой дает Ганди огромную власть."
 India_Emergency.4.d: "Правительство Индии утверждает, что назревающий кризис безопасности требует расширения и сохранения режима чрезвычайного положения. Индира Ганди утверждает, что рост забастовок и инакомыслия, а также опасения по поводу безопасности в отношении Пакистана означают, что Индия сталкивается с внутренней чрезвычайной ситуацией наряду с международной. Премьер-министр просил президента продлевать чрезвычайное положение каждые шесть месяцев, пока ситуация не стабилизируется и демократия не сможет процветать."
 India_Emergency.5.d: "Несмотря на яростную критику со стороны оппозиции, кажется, что аргумент правительства о необходимости введения чрезвычайного положения набирает популярность среди общественности. В последние недели люди все чаще читают проправительственные редакционные статьи и отчеты об эскалации кризиса безопасности. Индира Ганди и ее правительство кажутся сильнее, чем когда-либо, обладая обширными полномочиями. Общественность также выражает удовлетворение в связи с арестом правительством коррумпированных политиков и чиновников. Оппозиции придется пересмотреть свой подход к противостоянию с властью."
 India_Emergency.6.d: "Крупнейшие газеты Индии развернули постоянную редакционную кампанию с критикой правительства Индиры Ганди. Они указывают, что чрезвычайная ситуация, по-видимому, является результатом политических неудач, а не реальной необходимости защищать нацию. Многие обвиняют правительство в убийстве демократического духа Индии. Более тревожным для правительства является публикация оппозиционных осуждений правительства. Если общественность поддержит оппозицию, правительство Индиры Ганди столкнется с серьезными проблемами в поддержании чрезвычайного положения."
 India_Emergency.7.d: "Индира Ганди провела частную встречу с высшими офицерами индийской армии. Она указала на причины ЧП и попросила военных отреагировать на ситуацию. Премьер-министр выразила надежду на то, что индийская армия долгое время была аполитичной и профессиональной. Индийская армия и ее высшее командование стоят перед трудным выбором. В то время как большинство офицеров склонны оставаться в стороне, есть и те, кто опасается за демократическое будущее страны. Они призывают командующего армией использовать свое влияние и предлагают премьер-министру рассмотреть вопрос об отмене чрезвычайного положения и проведении выборов. Однако сделать это было бы серьезным отходом от традиции."
 India_Emergency.8.d: "Одержав крупную победу правительства Индиры Ганди, индийская армия заявила, что останется аполитичной. Это подтверждение того, что оппозиция не оказывает влияние на военных, хотя вряд ли они будут активно помогать правительству в расправе с оппонентами. Военные строго сосредоточены на защите границ от внешних угроз. Новости об отказе армии действовать несколько снизят напряженность и нанесут удар по тем противникам, которые надеялись на военное вмешательство, чтобы окончательно положить конец чрезвычайной ситуации."
 India_Emergency.9.d: "На частной встрече с руководством армии премьер-министр Индира Ганди была проинформирована о предпочтительных выборах для военных. Это знаменует собой серьезную неудачу для Индиры Ганди и чрезвычайного положения. Подразумевается, что неспособность назначить выборы может привести либо к военному вмешательству, либо к публичному отказу от военной поддержки, что является катастрофическим сценарием для правительства. Вскоре после встречи премьер-министр Индира Ганди обратилась к нации и объявила о своей рекомендации президенту отменить чрезвычайное положение. Новые выборы будут проведены немедленно. Армия и правительство не захотят раскрывать подробности встречи, поскольку это может подорвать политическую структуру Индии. Если оппозиция или широкая общественность узнают, это может привести как к гневу на армию за вмешательство, так и к новому прецеденту, когда оппозиция может призвать армию для решения политических проблем в будущем."
 India_Emergency.10.d: "Санджай Ганди, сын премьер-министра Индиры Ганди, продолжает концентрировать власть во время Чрезвычайного положения. Он был одним из самых решительных сторонников объявления чрезвычайного положения, и с переходом ключевых советников на сторону оппозиции его позиция значительно укрепилась. Премьер-министр полностью доверяет своему сыну, однако публично его считают коррумпированным из-за его семейных связей и предыдущего участия в спорных правительственных инициативах. Санджа Ганди также обнародовал повестку дня из пяти пунктов, направленную на продвижение усилий по повышению грамотности, планированию семьи и другим инициативам по улучшению общества. Многие наблюдатели нервничают по поводу растущей известности и власти Санджая."
 India_Emergency.11.d: "После чрезвычайного положения правительство Индии стремится сломать традиционные политические машины, действующие по всей стране. Во многих регионах Индии доминируют политические машины основных политических партий. Этот процесс препятствует открытой конкуренции во многих сферах и заставляет граждан выбирать между голосованием за партию и потерей доступа к государственным ресурсам или взяткам, предлагаемым партиями. Премьер-министр Индира Ганди по настоянию своего сына Санджая Ганди начала демонтировать эти партийные машины посредством арестов и принятия новых правил. Это позволяет премьер-министру и ее сторонникам напрямую взаимодействовать с населением, а не через партийный аппарат, состоящий из множества противников власти."
 India_Emergency.12.d: "Премьер-министр Индии Индира Ганди обнародовала Программу двадцати пунктов, чтобы вывести Индию из нынешнего кризиса. Премьер-министр настаивает на том, что реализация программы поможет вывести страну из нынешнего чрезвычайного положения. План в значительной степени ориентирован на экономику и предназначен для увеличения производства в сельском хозяйстве и промышленности. Улучшение государственных услуг и искоренение коррупции также являются одной из основных задач. Программа хорошо воспринимается, однако оппозиция обвиняет правительство в манипулировании народом."
 India_Emergency.13.d: "После объявления чрезвычайного положения правительство Индиры Ганди приказало полиции по всей Индии арестовывать диссидентов. Считающиеся экстремистскими политические организации, такие как Коммунистическая партия Индии, RSS и Джамаат-и-Ислами, обнаруживают, что их мероприятия запрещены, а лидеры заключены в тюрьму. Активистов, уличенных в организации забастовок или общенациональных протестов, арестовывают тысячами. Даже оппозиционных политиков арестовывают по сомнительным обвинениям в коррупции и подстрекательстве к беспорядкам. Поступают многочисленные сообщения о пытках в полиции. Сообщается, что СМИ сталкиваются с аналогичными угрозами, а некоторые СМИ становятся рупорами правительства. Хотя правительство устраняет своих врагов, общественность, как говорят, возмущена тем, что, по их мнению, является посягательством на гражданские свободы."
 India_Emergency.14.d: "Усилия Индиры Ганди и ее правительства по восстановлению порядка с объявлением чрезвычайного положения потерпели неудачу в Амристар. Тысячи сикхов собрались в городе, чтобы осудить то, что они называют фашистскими тенденциями партии Конгресса. Мероприятие под названием Кампания за спасение демократии признано одним из первых крупных массовых протестов против правительства. Правительство Индии уже начало приказывать полиции арестовывать сикхских активистов. Несмотря на то, что они составляют небольшое меньшинство, ясно, что большой процент арестованных составляют сикхи, что вызывает сильное недовольство сикхской общины правительством."
 India_Emergency.15.d: "Усилия правительства Индиры Ганди по непосредственному взаимодействию с населением в обход традиционной политической инфраструктуры и новых социальных реформ получили поддержку сельских жителей Индии. Горожане-индийцы по-прежнему сильно недовольны тем, что считается эрозией индийской демократии. Тем не менее, есть определенная поддержка правительства среди владельцев бизнеса, которые поддерживают новые инициативы по оживлению экономики. Аресты диссидентов и подавление оппозиции помешали усилиям по сопротивлению Индире Ганди, в целом национальные забастовки и протесты уменьшились."
 India_Emergency.16.d: "Правительство Индиры Ганди сталкивается с обвинениями в надзоре за принудительной стерилизацией миллионов людей в сельской местности. Поступают сообщения из деревень, в которых государственных врачей обвиняют в стерилизации женщин без их ведома. Считается, что нынешняя кампания по планированию семьи находится под контролем Санджая Ганди, и он сталкивается с критикой. В пострадавших сельских общинах проходят акции протеста, а газеты широко публикуют истории людей, ставших жертвами программы. Местные чиновники сталкиваются с толпами протестующих возле своих домов. Санджая Ганди обвиняют в некомпетентности и коррупции, и многие считают его положение результатом кумовства."
 India_Kashmir70s.50.d: "На секретном собрании высших политических деятелей, офицеров обороны и разведки велось обсуждение того, что делать в Кашмире. Военные заявили, что они провели необходимые материально-технические приготовления для кампании в Кашмире, и наши разведывательные данные на фронте были очень высокими. Они заявили, что решение о том, оправданы ли военные действия, теперь остается за премьер-министром. Локальные наступления могут стать для Пакистана мощной демонстрацией нашей решимости, однако в случае неудачной операции пакистанцы могут получить территорию и престиж. Если пакистанцы кажутся слишком окопавшимися или похоже, что они могут начать наступление, текущая операция может быть переведена из наступательной в оборонительную. Мы должны принять окончательное решение."
 India_Kashmir70s.51.d: "Индийская армия начала наступление в Кашмире. Правительство Индии опубликовало заявление, в котором подчеркивается, что операции носили ограниченный характер и предназначались для наказания Пакистана за продолжающееся вмешательство и провокации в Кашмире. Правительство Пакистана поспешило осудить нападение Индии и пообещало, что его силы дадут достойный ответ на нападение Индии. Международное сообщество будет внимательно следить за ситуацией, поскольку есть опасения, что любые боевые действия между ними могут быстро перерасти в всеобщую войну."
 India_Kashmir70s.52.d: "Наше правительство объявило, что оно успешно отвоевало ключевые приграничные территории у пакистанских войск в Кашмире. Индийская армия недавно начала свои ограниченные операции в ответ на попытки Пакистана разжечь восстания и продемонстрировать бесполезность военной силы для своих сил. Парламент уже направил поздравление правительству и военным за их действия. Пакистанцы опровергают сообщения о том, что они потерпели поражение, но наши войска явно контролируют некоторые ключевые приграничные районы. Международное сообщество удовлетворено тем, что конфликт не обострился. Индийский народ воспримет этот успех с большим восхищением."
 India_Kashmir70s.53.d: "Индийская армия запустила гнусный план, кульминацией которого стала неспровоцированная агрессия на границе с Кашмиром. Наши войска сражались храбро и дисциплинированно, но, к сожалению, были отброшены на нескольких участках. Мы осудим индийскую агрессию на международном уровне и минимизируем потери для нашего народа, но ясно, что индийцы контролируют некоторые новые территории вдоль границы. Мы должны пересмотреть нашу военную ситуацию и политическое направление, чтобы вернуть себе эти территории и гарантировать, что в будущем не будет новых актов агрессии со стороны Индии."
 India_Kashmir70s.54.d: "Мы дали указание Министерству иностранных дел и Министерству обороны свести к минимуму свои комментарии после того, как армия подтвердила, что наши силы были немного отброшены в Кашмире. Наш план наказать пакистанцев и улучшить военную ситуацию в Кашмире путем ограниченного наступления провалился. В последовавшей за этим пакистанской контратаке их силам удалось захватить часть территории. Наш план полностью провалился, пакистанцы и их агенты в Кашмире набрались смелости на дальнейшую агрессию. Индийские военные обязались проявлять особую бдительность. Мы можем ожидать общественной реакции и парламентского гнева по поводу этой неудачной операции, что более важно, военная ситуация в Кашмире изменилась."
 India_Kashmir70s.55.d: "Индийская армия стремилась использовать хитрость и грубую силу, чтобы отбросить наши войска в Кашмире. Несмотря на их усилия и внезапность, наши храбрые солдаты не только остановили наступление, но и перешли в контрнаступление, заняв несколько ключевых стратегических позиций вдоль границы. Мы уже публикуем в СМИ фотографии пакистанских офицеров и солдат, позирующих на позициях, когда-то занятых индийской армией. Один советник предложил смелый план, мы можем предложить вернуть только что захваченную территорию, если Индия согласится выполнить резолюции ООН по Кашмиру. Теперь Индия может счесть военную ситуацию неустойчивой и согласиться. Другой вариант — просто удерживать территорию и готовиться к будущей операции по полному освобождению Кашмира."
 India_Kashmir70s.56.d: "Правительство Пакистана предложило вернуть территорию, захваченную им во время нашего недавнего пограничного конфликта в Кашмире, в обмен на выполнение резолюций ООН по Кашмиру. Бескомпромиссные чиновники призывают нас отклонить это предложение, утверждая, что мы сможем вернуть себе земли в будущем, и открытое голосование, скорее всего, пойдет против нас. Однако более умеренные лидеры считают, что это может быть возможностью разрешить наш спор с Пакистаном в Кашмире. Они считают, что мы должны доверять нашим друзьям среди кашмирцев, которые проголосуют вместе с нами, и выполнение резолюций, скорее всего, не приведет к полной потере Кашмира. Другая группа чиновников просто считает, что мы должны отклонить это предложение, поскольку это создаст прецедент, когда государства могут шантажировать нас территорией для достижения целей. Мы должны решить, как реагировать."
 Nagaland_Unrest.1.d: "В 1946 году между сообществом нагов и правительством Ассама было заключено соглашение. Наги получили контроль над своей землей, а также исполнительную, законодательную и судебную власть. Соглашение должно было длиться 10 лет, после чего будет заключено новое соглашение. Националисты-наги истолковали это как означающее, что за 10 лет они обрели независимость, что вызвало конфликт в конце 1950-х годов. В конце концов мы создали Нагаленд как штат в соответствии с конституцией в начале 1960-х годов, сняв напряженность. К сожалению, новая волна национализма нагов захлестывает штат, сообщая о формировании вооруженных банд. Мы могли бы направить силы безопасности для борьбы с повстанцами или заключить соглашение, предоставляющее более широкую автономию государству на ближайшее время."
 Nagaland_Unrest.2.d: "Наши силы безопасности вовлечены в вооруженный конфликт с так называемыми партизанскими отрядами Федеральной армии Нага. Эти заблуждающиеся националисты-наги проводят нападения и диверсионные операции против правительственных учреждений и полицейских постов. Мы вводим вооруженные силы и устанавливаем контрольно-пропускные пункты. Тем не менее, наши военные эксперты считают, что повстанцы не будут представлять серьезной угрозы, поскольку армия может легко закрыть регион. Просто потребуется время, чтобы усмирить провинцию. Политические лидеры нагов осуждают наш ответ, выдвигая безосновательные обвинения в нарушении прав человека."
 Nagaland_Unrest.3.d: "Ситуация с безопасностью в Нагаленде стабилизировалась. Лидеры националистов нага больше заинтересованы в продолжении мирных переговоров с правительством. Многие боевики разочарованы тем, что остаются в полевых условиях, и отчаянно хотят вернуться домой. Что еще более важно, гражданское население начинает нападать на повстанцев, в значительной степени измученных военными контрольно-пропускными пунктами и комендантским часом. Хотя повстанцы не побеждены, они тают. Поскольку мы сворачиваем операции, наши войска и ресурсы в Нагаленде теперь могут быть передислоцированы для национальных целей."
 Nagaland_Unrest.4.d: "Со слухами о новом здании повстанцев в Нагаленде правительство достигло соглашения с лидерами нага. Правительство согласилось временно предоставить широкую автономию Нагаленду на следующие десять лет. Во избежание недоразумений лидеры нагов соглашаются, что через десять лет администрация вернется к предыдущей модели, если не будет достигнуто новое соглашение. Правительство Нагаленда прямо обещает не требовать независимости и не продвигать сепаратизм в соответствии с этим соглашением. Некоторые критикуют соглашение как капитуляцию, однако другие хвалят нас за проявление политической зрелости в отношении ситуации в Нагаленде."
 nagaland_agitation: "Нагалендская агитация"
 NCO_71.1.d: "Соединенные Штаты продолжают использовать свою помощь с пшеницей как средство заставить наше правительство подчиниться. Это приводит к общественным затруднениям и ставит под вопрос независимость Индии. Для многих патриотически настроенных индийцев эти отношения напоминают то, как британцы много веков назад манипулировали субконтинентом и вероломно украли его, злоупотребляя торговыми отношениями в своих интересах. Принимая во внимание эти невыносимые обстоятельства, премьер-министр объявил о планах немедленного прекращения поставок пшеницы из Соединенных Штатов и оказания помощи. Премьер-министр отметил, что поначалу это вызовет трудности для людей и экономики, но индийские институты приспособятся. Это заявление воодушевило многих индийцев, особенно левых, хотя некоторые консервативные политики обвинили правительство в том, что оно пожертвовало доступом к еде для миллионов людей только для того, чтобы набрать политические очки."
 NCO_71.2.d: "В недавнем интервью, опубликованном в газетах Индии, премьер-министр Мораджи Десаи изложил свое видение внешней политики Индии, которое многие называют доктриной Десаи. Премьер-министр отметил, что борцы за свободу Индии, Ганди и Неру, оба верили в Индию, независимую от каких-либо иностранных держав и самодостаточную. Он также отметил, что Индия не должна быть заинтересована во вмешательстве или вмешательстве в дела других, чтобы не навредить этим людям, как это сделала индийская нация из-за империализма. Вместо этого Индия откажется от глубоких отношений со сверхдержавами и вместо этого будет стремиться к региональному содействию миру и процветанию в Азии. Многие видят в этом последнем заявлении завуалированную критику предыдущих правительств, которые стремились установить тесные связи либо с западным, либо с советским лагерем. В заключение премьер-министр подтвердил свое стремление к региональному миру и отметил свои усилия по нормализации отношений с Китаем. Китайское правительство тепло приветствовало это заявление."
 INC_71.1.d: "Премьер-министр Индира Ганди и ее министры в последние недели обнародовали то, что многие в средствах массовой информации называют «доктриной Индиры». Индия твердо проведет твердую линию через Гималаи и гарантирует, что этот стратегический район не попадет в руки враждебных держав. Чтобы поддержать это начинание, правительство Индии поддержит независимость гималайских штатов и станет их партнером. Критики в регионе обвиняют Индию в насильственном стремлении установить гегемонистские отношения и добиться лояльности этих государств. Тем не менее, многие по всей стране приветствуют эти действия как активную защиту границ Индии."
 INC_71.2.d: "Премьер-министр был проинформирован о недавнем этническом насилии в Шри-Ланке, в ходе которого произошло несколько ожесточенных столкновений. Столкновения произошли между сингальцами и тамилами. Многие тамилы возмущены политическим доминированием сингалов в стране и отмечают отсутствие их представительства. Отсутствие участия полиции, особенно в случаях нападения на тамильскую собственность, только подлило масла в огонь столкновений. Наше правительство должно занять публичную позицию, чтобы поддержать либо правительство Шри-Ланки, либо тамильское сообщество. Внутри нашей страны проживает большое тамильское население, которое симпатизирует своим соотечественникам в Шри-Ланке. Если мы поддержим правительство, это может помочь двусторонним отношениям, но вызовет некоторый внутренний гнев, если мы поддержим тамилов, то мы можем получить некоторую общественную поддержку, но наши отношения со Шри-Ланкой упадут."
 INC_Kashmir.1.d: "Недавний конфликт с Пакистаном подтвердил наше политическое, экономическое и военное превосходство в регионе. Мы нанесли сокрушительный удар пакистанским амбициям в отношении Кашмира и нейтрализовали их способность интернационализировать конфликт. Антииндийские элементы в правительстве Кашмира теперь лишены покровителя и находятся в столь же слабом положении. Настало время для премьер-министра Индиры Ганди провести переговоры со знаменитым кашмирским лидером шейхом Абдуллой, известным как Кашмирский лев. Исторически он представлял угрозу для Индийского Союза своим постоянным заигрыванием с независимыми или даже пропакистанскими фракциями. Кашмирские активисты уже давно жалуются на свой статус, поскольку независимость остается в подвешенном состоянии и заморожена. Эти переговоры обеспечат прорыв и, вероятно, справедливое урегулирование Кашмира. Переговорная позиция Льва никогда не была ниже."
 INC_Kashmir.2.d: "Представители премьер-министра и шейха Абдуллы подписали в Нью-Дели соглашение по Кашмиру. Новое соглашение, среди его ключевых положений, подтверждает, что Кашмир является конституционной частью Индии, соглашается, что любые попытки поставить под сомнение суверенитет Индии или оскорбить символы нации будут наказаны, а шейх Абдулла будет назначен главным министром. Реакция в Индии в целом положительная: многие хвалят правительство за то, что оно, наконец, раз и навсегда положило конец движению за самоопределение. Среди кашмирцев реакция очень неоднозначная, некоторые поддерживают Абдуллу, утверждая, что текущая региональная политическая и стратегическая реальность ограничивает его способность договариваться об условиях. Тем не менее, в Сринагаре прошли протесты, осуждающие соглашение, и, по слухам, кашмирская молодежь за границей собирается на встречи, чтобы сформировать новые организации, чтобы бросить вызов индийскому правлению. Несмотря на это, соглашение закрепляет недавнюю победу Индии."
 CPI_71.1.d: "Премьер-министр приветствовал принятие нового закона, национализирующего все частно-государственные партнерства в стране. Премьер-министр отметил, что партнерские отношения были противоречивыми, поскольку одно работало исключительно для получения прибыли, а другое стремилось облегчить страдания рабочих. Теперь, когда государство контролирует эти товарищества, права рабочих будут сохранены и приведут к улучшению производства. Бывшие частные партнеры не получат компенсации от государства, и многие горько жалуются на то, что правительство украло семейный бизнес. Кроме того, оппозиционные политики горько жалуются, что эта национализация вызовет коррупцию и неэффективность, поскольку центр будет изо всех сил пытаться оставаться на вершине всех этих новых отраслей. Сторонники правительства хвалят это действие как необходимое для создания сильной экономики, учитывающей потребности рабочих."
 CPI_71.2.d: "Правительство Индии сделало нам строгое предупреждение в отношении коммунистической партии Шри-Ланки. Они потребовали, чтобы мы сняли все ограничения и освободили всех задержанных активистов движения. Это вопиющее вмешательство в наши внутренние дела, и мы задержали только тех, кто представляет прямую угрозу общему миру и стабильности Шри-Ланки. Индийская угроза кажется реальной, мы должны либо дать им гарантии защиты коммунистической партии и активистов, либо мы можем обратиться за защитой к Соединенным Штатам и Великобритании в это трудное время. Мы можем предложить им военно-морские базы в обмен на гарантию."
 CPI_71.3.d: "Индийское правительство недавно выступило с громкими угрозами в адрес Шри-Ланки за предполагаемое подавление социалистов и тамилов по всему острову. Индийские СМИ широко публикуют отчеты, многие из которых непроверены, описывающие зверства и насилие, совершаемые правительством Шри-Ланки против собственных граждан. Правительство Шри-Ланки в ответ отказалось принять требования Индии о гарантиях коммунистической партии и освободить всех задержанных активистов. Их лидер недавно связался с президентом и запросил у Америки поддержки в этом споре в обмен на доступ к военно-морской базе в Шри-Ланке. Это дало бы нашему флоту стратегические порты в Индийском океане, однако мы рискуем быть втянутыми в войну с Индией."
 CPI_71.4.d: "Индийское правительство недавно выступило с громкими угрозами в адрес Шри-Ланки за предполагаемое подавление социалистов и тамилов по всему острову. Индийские СМИ широко публикуют отчеты, многие из которых непроверены, с описанием зверств и насилия, совершаемых правительством Шри-Ланки в отношении собственных граждан. Правительство Шри-Ланки в ответ отказалось принять требования Индии о гарантиях коммунистической партии и освободить всех задержанных активистов. Их лидер недавно связался с премьер-министром и попросил британскую поддержку в этом споре в обмен на доступ к военно-морской базе на Шри-Ланке. Это дало бы нашему флоту стратегический доступ в регион, но с риском вооруженного конфликта с Индией. Некоторые в кабинете призывают премьер-министра согласиться не только на доступ к морю, но и на поддержку нашего бывшего колониального владения от радикального левого режима."
 CPI_71.5.d: "Правительство Шри-Ланки быстро отклонило наш справедливый призыв к справедливости. Они демонстративно заявили, что их политика в отношении социалистов и коммунистов является внутренним делом. Он также отметил, что правительство Шри-Ланки не может вмешиваться в правоохранительные или судебные органы в отношении лиц, задержанных за подрывную деятельность. Шри-ланкийцы также обратились к внешним силам и, возможно, получили некоторые гарантии. Принимая во внимание все эти факторы, мы должны решить, следует ли нам продолжать раздувать пламя гнева по отношению к шри-ланкийцам или оставить ситуацию на время, пока все не остынет. Возможно, для разрешения этого кризиса потребуется более разрушительный путь."
 CPI_71.6.d: ""
 CPI_71.7.d: ""
 CPI_71.8.d: ""
 IND_PAK60s.1.d: "Соединенные Штаты после раздела установили особенно дружеские отношения с Пакистаном. Чтобы осуществить сдвиг в нашей внешней политике на западную ориентацию и заручиться поддержкой, особенно в отношении Китая, мы должны продемонстрировать наши миролюбивые намерения в отношении Пакистана. Мы можем пригласить Пакистан на переговоры по региональной безопасности. Даже если переговоры не приведут к каким-либо результатам, американцы увидят в этом позитивный шаг, и это только пойдет на пользу нашим с ними отношениям. Однако некоторые в правительстве выступают против переговоров с пакистанцами и опасаются, что это навредит внутри страны и укрепит их глобальный имидж. Мы должны решить, что делать."
 IND_PAK60s.2.d: "Посол Индии передал приглашение от своего правительства принять участие в саммите по ситуации с региональной безопасностью. Индийцы выразили озабоченность по поводу внешнего влияния и угроз для Южной Азии и хотели бы обсудить способ присоединения Пакистана к усилиям по сохранению суверенитета Южной Азии. Они отметили свое признание того, что напряженность между нашими странами существует, но они надеются, что сотрудничество в других областях может привести к более широкому миру. Мы, безусловно, можем присутствовать на этих переговорах, чтобы узнать, что на уме у индийцев, возможно, они будут более любезны с Кашмиром, если мы им потакаем. Однако ясно, что индийцы могут попытаться использовать это для подтверждения ложной нормализации наших отношений, и в этом случае, возможно, лучше всего будет отказаться и заявить, что такие переговоры будут уместны только после того, как Кашмир будет урегулирован."
 IND_PAK60s.3.d: "Высокопоставленные индийские и пакистанские официальные лица начали переговоры в Калькутте по поводу ситуации с региональной безопасностью. Во вступительном слове министр обороны Индии обсудил, как соперничество между Индией и Пакистаном может сделать Южную Азию уязвимой перед потенциальными угрозами. Хотя он не назвал никаких конкретных угроз, многие предположили, что он имел в виду Китай. Делегация Пакистана в своем вступительном слове заявила, что готова сидеть и слушать, и надеется, что Индия понимает, что решение нерешенных вопросов между двумя странами является ключом к созданию сильной и прочной обороны в Южной Азии."
 IND_PAK60s.4.d: "Правительство Индии заявило, что понимает наши оговорки в связи с текущими нерешенными вопросами, и отметило, что нереально пытаться решить все эти вопросы в ходе этих обсуждений. Однако они отметили, что обе страны были заинтересованы в сохранении свободы, за которую сражались и умирали многие выходцы из Южной Азии. Они предлагают, чтобы наши два государства взаимно согласились гарантировать независимость друг друга в течение пяти лет, чтобы в случае внешнего вторжения обе стороны могли объединиться для взаимной защиты. Безусловно, такое предложение было бы привлекательным для националистов в Пакистане, особенно для тех, кто участвует в борьбе за свободу, и оно не обязывает нас формальными отношениями с государством, с которым у нас есть нерешенные проблемы. Однако мы также должны учитывать негативную реакцию внутри страны и ослабление наших возможностей решить проблему Кашмира, если мы подпишем такое соглашение."
 IND_PAK60s.5.d: "Правительство Пакистана отметило, что, хотя оно ценит усилия Индии по попытке достичь соглашения, они заявили, что это нереально, пока вопрос о Кашмире остается нерешенным. Правительство Пакистана оценило приглашение и намерение правительства Индии, но заявило, что обстоятельства делают соглашение практически невозможным. Пакистанская делегация вскоре уехала, положив конец переговорам. Хотя соглашение не было достигнуто, наши действия были хорошо восприняты внутри страны, и мы продемонстрировали свою позицию миролюбивой мировой державы."
 IND_PAK60s.6.d: "Обе стороны согласились подписать пакт, совершив крупный прорыв в индо-пакистанских отношениях. Обе страны обещают защищать друг друга в случае нападения иностранной третьей стороны. Соглашение рассчитано на пять лет, и многие в регионе приветствуют его как крупный прорыв. Для Индии, которая испытывает напряженность на границе с Китаем, это соглашение дает некоторое облегчение ее силам, граничащим с Пакистаном. Что касается Пакистана, они объявили о своем намерении использовать соглашение в качестве строительного блока, на основе которого можно попытаться добиться дальнейших прорывов в Кашмире. Многие пакистанские аналитики выразили разочарование и считают, что в соглашении Индия добилась гораздо большего, чем Пакистан."
 IND_PAK60s.7.d: "Государственный секретарь Соединенных Штатов недавно позвонил премьер-министру, чтобы выразить признательность за наши недавние усилия по координации обороны Южной Азии от коммунистической агрессии. Он заявил, что Вашингтон внимательно следил за переговорами, и независимо от того, что произошло, ясно, что Индия смотрит на мир с точки зрения сохранения глобального мира. Затем госсекретарь пригласил высокопоставленных чиновников нашего правительства посетить Соединенные Штаты для обмена мнениями. Это большой шаг в улучшении отношений с США."
 IND_PAK60s.8.d: "Срок пятилетнего оборонительного пакта между Индией и Пакистаном истек. Для Индии соглашение помогло ее положению в области безопасности в период повышенной напряженности. Что касается Пакистана, они надеялись использовать соглашение, чтобы добиться решения по Кашмиру, однако правительство Индии отказалось сдвинуться с места по этому вопросу, разочаровав пакистанцев. В частности, правительство Пакистана счастливо, что неловкое соглашение больше не является чем-то, что люди могут критиковать. Хотя срок действия соглашения истек, эксперты не рассчитывают ни на какие военные действия друг против друга."
 USA_INDIA60s.1.d: "Правительство Индии обратилось с просьбой о посещении Дели военной миссией и вынесении рекомендаций. Индийцы предпочли бы военную технику, которая будет использоваться для защиты Индии от угрозы коммунистического Китая и других гнусных влияний в регионе. Однако они также, если миссия не может отправить оборудование, они также были бы признательны за помощь в обучении наших сил. Кое-кто в Пентагоне скептически относится к участию в такой миссии, поскольку в прошлом индийское правительство оказывало сопротивление нашему влиянию. Тем не менее, Государственный департамент утверждает, что именно поэтому Соединенным Штатам следует направить миссию, чтобы, как мы надеемся, начать переводить Индию в наш лагерь. Есть более широкие опасения, что помощь Индии может оттолкнуть Пакистан, с которым мы установили тесные связи."
 USA_INDIA60s.2.d: "Соединенные Штаты сообщили нашему правительству, что в настоящее время они не могут выполнить нашу просьбу о направлении военной миссии в Дели. Это серьезная неудача в наших усилиях сблизиться с западными державами. Внутри страны многие газеты отмечают, что, похоже, ответные меры со стороны Запада не такие большие, как мы ожидали. Они отмечают, что это может иметь катастрофические последствия, поскольку наш дипломатический сдвиг уже отталкивает социалистические страны. Мы можем только опубликовать заявление, поверив американцам на слово, и заявить, что это был лишь вопрос времени. Надеюсь, Соединенные Штаты вскоре осознают, что их будущие отношения в Южной Азии должны включать Индию."
 USA_INDIA60s.3.d: "Приглашенная нами военная оценочная группа завершила свой визит в Индию и предложила два варианта поддержки. Они оценили наши возможности в отношении Китая и предложили оборудование для укрепления обороноспособности наших войск. Оборудование, откровенно говоря, не так уж и много, и мы чувствуем, что это было сделано для того, чтобы свести к минимуму пакистанский гнев и избежать внутренней критики такой сделки. Однако такое современное оборудование всегда можно использовать. В качестве альтернативы они предложили поддержать расширение обучения и организации сил специального назначения. Это может оказаться очень полезным, поскольку наши вооруженные силы всегда стремятся модернизировать свою подготовку и возможности. Мы должны решить, какой пакет выбрать."
 USA_INDIA60s.4.d: "Пакистанская пресса и правительство выражают свое недовольство нашей недавней военной миссией в Индию. Пакистанцы называют нас двуличными, и они позвонили нашему послу, чтобы выразить свое разочарование в связи с развитием событий. Хотя пакистанцы явно в бешенстве, они все еще очень зависят от нас. Мы можем ожидать, что со временем это закончится, но мы выпустим заявление, в котором подчеркнем, что наша цель — мир в Южной Азии, и мы ценим наши отношения с Пакистаном. Но все страны должны понять, что мы вольны заключать двусторонние соглашения с кем захотим."
 CPI_FP.3.d: "Недавно индийско-советское руководство подписало индийско-советский договор о дружбе и сотрудничестве. Соглашение закрепляет и провозглашает стратегическое партнерство между двумя странами. Утверждается, что Соединенные Штаты и Китай очень обеспокоены соглашением, и оно знаменует собой явный отход Индии от неприсоединения. Многие индийские аналитики приветствуют этот шаг и считают его необходимым, поскольку Пакистан добивается иностранной помощи. После подписания договора Советский Союз в частном порядке заверил Индию, что вскоре отправит оружие, чтобы поддержать Индию, поскольку она сталкивается с угрозами на своей границе."
 burma_2022.2.d: "The residents of Rangoon woke to the sound of tanks, vehicles, and soldiers sweeping across the city. General Ne Win has assumed power. He soon addressed the nation in a brief radio address. General Ne Win called for calm, promising to end the ongoing economic and political instability in the country. He promised the establishment of a socialist republic with him serving as Prime Minister and chairman of a new governing Union Revolutionary Council. Reports on the ground indicate the former Prime Minister, Chief Justice, and leading politicians across all political parties have been detained by the Army. All universities are closed. The coup is being well-received both by the population and foreign embassies. Both perceived the previous government as being corrupt and incapable. The Army also enjoys popularity for its recent efforts at facilitating elections and promoting national unity."
 India_Com60s.1.d: "С победой коммунистов на выборах баланс сил в мире изменился, и глобальный социалистический лагерь стал еще более могущественным. Два ведущих социалистических государства, Советский Союз и Китай, приветствовали это объявление и уже направили высокопоставленные делегации для посещения CPI. Оба предложили исключительную помощь нашей нации, поскольку она переходит к революционному правительству. Советы принесли богатый опыт в области индустриализации и современного вооружения. Однако китайское государство больше напоминает нас с большим населением и отсутствием промышленного развития, они могут лучше подойти в качестве союзника. Несмотря на это, оба указали, что если мы пойдем под их руководством, они ожидают эксклюзивных отношений, поэтому теперь мы должны принять решение и принять руководство СССР или Китая."
 India_Com60s.2.d: "Состоялась, пожалуй, самая важная конференция Коммунистической партии Индии. Когда КПИ у власти, настал момент принести социализм и освобождение рабочим и крестьянам Индии. Основные возникающие споры заключаются в том, какому стилю социализма должна следовать Индия. Одна фракция считает, что Индия должна пройти социалистическую трансформацию по советскому образцу, ссылаясь на ее важность как первого и самого могущественного социалистического государства. Другие, особенно сельские активисты, считают, что Индия должна следовать китайской модели. Они отмечают, что в Китае, как и в Индии, преобладает аграрное крестьянское население, долгое время находившееся под притеснением элиты. Китайской модели не мешает неспособность советских теоретиков предсказать подъем социализма среди крестьян. На конференции выступили представители обеих фракций, и вскоре будет проведено голосование, чтобы определить, по какому социалистическому пути нам идти..."
 INC_1962.1.d: "Оборонный истеблишмент, особенно вооруженные силы, до обретения независимости были тесно связаны с колониальным правительством и оккупацией Индии. Многие из ведущих политиков Индии годами боролись с колониальным режимом при поддержке этих вооруженных сил. Многие офицеры старшего и среднего звена прошли обучение в колониальный период. Таким образом, поддержание гражданского надзора и подчинения оборонному аппарату является критическим вопросом. Недавно старший советник предложил правительству провести эксперимент, предоставив военным больше независимости и контроля над военными вопросами, чтобы повысить эффективность вооруженных сил. Это интересное предложение, но те, кто выступает против предоставления таких полномочий, могут спровоцировать потенциальный переворот в будущем, и вместо этого Министерству обороны следует предоставить еще больший контроль. Мы должны решить, следует ли временно усилить гражданский контроль или предоставить военным больший контроль над чисто военными вопросами. После этого мы можем решить, какой путь будет лучшим для Индии."
 INC_1962.2.d: "Недавно мы экспериментировали над вопросом, какой уровень гражданского надзора должен быть над военными. Даже после недавних изменений мнения правительства по-прежнему расходятся во мнениях относительно того, поддерживать ли ослабление гражданского надзора или поощрять ужесточение надзора. Те, кто выступает за более слабый надзор, отмечают, что это уменьшит скорость принятия решений, повысит эффективность и придаст уверенности военнослужащим. Сторонники жесткого гражданского контроля отмечают, что это предотвращает военный авантюризм, информирует страну и способствует стабильному государству. Любая потеря эффективности для них незначительна по сравнению с преимуществами, полученными нацией и государственными институтами. Мы должны принять решение о будущем военно-гражданских отношений в Индии."
 American_Sanctions: "American Sanctions"
 global_trade_penalty_adjustment: "Global Trade Cost Penalty"
 lower_american_food_prices_TT: "Lower American Food Prices"
 INC_1967.1.d: "После раздела индийские военные продолжают предъявлять высокие требования к оборудованию, финансированию и обучению. Недавно одна газета опубликовала отчет, в котором говорится, что значительная часть средств выделяется в виде пенсий военнослужащим, вышедшим на пенсию. Быстрое увеличение вооруженных сил, увеличение бюджета и поддержка расширения приведут только к увеличению затрат. Старший экономический советник предложил правительству не выполнять оборонные запросы в ближайшем будущем. Хотя это негативно повлияет на военные закупки и организацию, экономические выгоды перевесят истощение, и как только экономика поднимется, нам будет легче удовлетворять оборонные потребности. Министр обороны категорически против этой меры, отметив, что Индия находится во враждебном географическом соседстве и должна сохранять бдительность."
 Swatantra60s.1.d: "Политика либерализации нынешнего правительства радикализировала экстремистских коммунистов-агитаторов в сельской местности. Они распространяли пропаганду по всей стране и организовывали жестокие крестьянские комитеты. Эти крестьяне совершают набеги на помещиков, захватывая товары для продажи, оружие и необработанные земли. Сельские полицейские участки в некоторых районах захвачены, а их оружейные склады зачищены. Индийская армия предложила план развертывания военизированных формирований в горячих точках для восстановления правопорядка и прекращения волнений. Наряду с военными действиями министр внутренних дел планирует отправить чиновников для переговоров с деревнями и успокоения крестьян. Премьер-министр подписал план."
 Swatantra60s.2.d: "Военные операции против крестьянских агитаторов проходят с большим успехом. Наши силы вернули украденные деньги и оружие. Профессионализм наших войск обеспечил наличие мелких боевых действий, в большинстве случаев крестьянские отряды просто сдавались в плен. Наиболее ярые коммунисты сопротивлялись, но их легко одолели. Военные продолжают планировать рейды против закоренелых коммунистов, в то время как правительственные чиновники встречаются с деревнями, чтобы вести переговоры с крестьянами. СМИ постоянно сообщают о сельчанах, которые отказываются от насилия и клянутся работать с правительством. Несмотря на первоначальные успехи, операции продолжаются."
 Swatantra60s.3.d: "Правительство Индии объявило, что после недавних успехов оно значительно сократит военные и информационно-просветительские операции. В последние недели военные успешно нейтрализовали многих закоренелых коммунистических лидеров, сломив сопротивление крестьян. Большинство крестьян согласились отказаться от насилия и вернуть трофейное оружие. СМИ широко сообщают об успешной способности правительства бороться с беспорядками с минимальным насилием. Аналитики высоко оценивают силу индийских институтов. Однако главная проблема заключается в том, что многие выжившие закоренелые коммунисты ушли в подполье и, несомненно, продолжат попытки распространять агитацию. Однако на данный момент ситуация с правопорядком в Индии значительно улучшилась."
 Swantantra67.1.d: "Правительство Индии направило делегацию высокого уровня в Государственный департамент и Пентагон. Они призвали к более тесному сотрудничеству в области обороны и экономической поддержки. Нынешнее индийское правительство верит в либерализм и демократию. Они хотят восстановить историческую связь между Индией и Западом. Наши собственные разведывательные отчеты отмечают, что новое правительство выступает против перехода к социализму и тесных связей с социалистическими государствами, которые индийское государство начало после обретения независимости. Мы можем предложить пакет экономической помощи или экономический и оборонный пакет. Однако сближение с Индией оттолкнет Пакистан, и если нас это беспокоит, мы должны отказаться от подписания какого-либо соглашения. Выборы в Индии непредсказуемы, и если оппозиция вернется к власти, любые успехи, достигнутые нами благодаря связям с Индией, могут быть так же легко обращены вспять."
 Swantantra67.2.d: "Наши усилия по налаживанию более тесных связей с Соединенными Штатами принесли свои плоды после заключения соглашения об американской помощи Индии. Это не является традиционной финансовой или материальной помощью. Вместо этого Соединенные Штаты предоставят экономических и политических экспертов для укрепления индийской экономики и модернизации административной практики. Многие в средствах массовой информации хвалят наше правительство за его успешные переговоры и называют это переворотом против Пакистана и их связей с Соединенными Штатами. Оппозиция ворчит, а некоторые левые издания называют это возвращением к колониализму, но в целом реакция была в основном положительной."
 Swantantra67.3.d: "Наши усилия по налаживанию более тесных связей с Соединенными Штатами принесли свои плоды после заключения соглашения об американской помощи Индии. Это не является традиционной финансовой или материальной помощью. Вместо этого Соединенные Штаты предоставят экономических и политических экспертов для укрепления индийской экономики и модернизации административной практики. В дополнение к этой экономической поддержке Соединенные Штаты также предоставят военных советников для улучшения наших возможностей, технологий и производства. Многие в средствах массовой информации хвалят наше правительство за его успешные переговоры и называют это переворотом против Пакистана и их связей с Соединенными Штатами. Оппозиция ворчит, а некоторые левые издания называют это возвращением к колониализму, но в целом реакция была в основном положительной."
 INDIA_COM_NEP.1.d: "Правительство получило сообщения о том, что правительство Непала активно принимает законы и преследует рабочих по всему Непалу. В частности, правительство Непала обвиняют в подавлении профсоюзов и распространении в стране социалистической литературы. Премьер-министр провел заседание кабинета, на котором одобрил парламентское заявление в поддержку непальских рабочих. Затем премьер-министр должен был решить, как реагировать непосредственно на ситуацию. Одна фракция считает, что Индия должна направить правительству Непала предупреждение о прекращении репрессий против невиновных. Однако другая фракция утверждает, что заявления парламента было достаточно, и вместо этого правительству следует поручить спецслужбам тайно поддерживать рабочих в Непале. Если слишком много шумихи, это может насторожить Непал и помешать нам отправить поддержку через границу."
 INDIA_COM_NEP.2.d: "Индийское правительство, в котором доминирует коммунистическая партия, направило нам через своего посла предупреждение о прекращении любых репрессий или ограничений в отношении социалистических рабочих Непала. Это связано с недавними протестами против прав рабочих, в ходе которых произошли случаи насилия между полицией и протестующими. Мы, безусловно, можем согласиться с требованиями Индии, они не слишком сложны, и мы будем бдительны в отношении коммунистической угрозы. Однако, учитывая агрессивную индийскую угрозу, всегда есть риск агрессии, особенно со стороны нашего самого важного соседа. Министр иностранных дел заявил, что может связаться либо с США, либо с Китаем. Соединенные Штаты, вероятно, захотят остановить коммунистическую экспансию Индии. От китайцев, даже если у них будет похожее на Индию правительство, не ожидается, что они поддержат индийскую экспансию, которая позволила бы ей выставить еще больше сил на границе с Китаем."
 INDIA_COM_NEP.3.d: "Государственный департамент передал президенту срочный запрос из Непала. Правительство Непала утверждает, что Индия открыто комментирует свои внутренние дела и угрожает военными действиями, если Непал не подчинится. Ситуация попахивает коммунистическим экспансионизмом, и у нас было бы полное право гарантировать независимость Непала в этот трудный период, чтобы помешать индийским планам экспансии. Непал популярен среди американцев, в том числе среди ветеранов Второй мировой войны, которые во время войны сражались вместе с непальскими солдатами-гуркхами. Наши аналитики считают, что Индия вряд ли будет реагировать на свои угрозы, поэтому гарантия Непала, скорее всего, не будет сопряжена с высоким риском. Некоторые другие советники считают, что нам просто не следует вмешиваться, Непал окружен враждебными государствами, и если Индия вмешается, Соединенные Штаты не смогут защитить Непал. Обе стороны приводят убедительные аргументы, но решение должно быть принято."
 INDIA_COM_NEP.4.d: "Правительство Непала официально обратилось за помощью к Китаю, поскольку оно сталкивается с беспрецедентной угрозой со стороны Индии. Даже если наша точка зрения схожа с Индией, Непал является прекрасным буфером, и его потеря подвергнет Китай агрессии со стороны Индии, если враждебное правительство захватит Дели. Китай также верит в суверенитет всех наций, а Индию можно рассматривать как занимающуюся экспансионизмом. Возможно, в интересах Китая было бы предложить гарантии Непалу. Другая точка зрения отмечает, что Непал, вероятно, будет таким же враждебным, как и любой будущий индийский режим, и мы не обязаны поддерживать коррумпированный режим. Возможно, для Китая было бы лучше просто наблюдать за развитием ситуации и не рисковать социалистическим единством или нашими собственными ресурсами ради глупой затеи."
 INDIA_COM_NEP.5.d: "Правительство Непала публично и в частном порядке отказало в нашей просьбе о соблюдении основных прав человека и соблюдении приличий для своих граждан. СМИ возмущены, и по всей Индии проходят массовые демонстрации солидарности. СМИ сообщают о новостях об интенсивном насилии, совершаемом не только в отношении непальских рабочих, но и в отношении индийских мигрантов в стране. Наше собственное правительство считает, что эти сообщения, вероятно, преувеличены, но сейчас не время подавлять страсти людей. Военные спросили, хотим ли мы, чтобы они разработали план интервенции, чтобы свергнуть реакционное правительство в Непале. Мы должны решить это, но мы должны учитывать, что Непал, вероятно, обратился к одной или двум крупным державам, чтобы запросить поддержку в этом кризисе. Еще одна вещь, которую следует учитывать, — это потенциальные потери и затраты на полномасштабное вмешательство. Мы направили наше предупреждение и проявили солидарность, дипломатические и политические преимущества уже получены, поскольку Индия отстаивает свое место в регионе. Необходимо принять решение..."
