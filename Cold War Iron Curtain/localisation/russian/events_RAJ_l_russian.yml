 INDIA_COM_NEP.7.d: ""
 Sino_Indian_War_Redux.150.d: "НОАК успешно захватила узкий коридор Сильгурри, фактически изолировав северо-восток Индии от остальной части страны. Это дает уникальную возможность, поскольку мы успешно поставили мат индийскому правительству. Один из вариантов — объявить о прекращении огня, вернуть территории, это снизит напряженность и откроет возможность примирения в будущем. Другой вариант - захватить спорные приграничные земли и создать Народную Республику Индии под руководством индийских революционеров."
 Sino_Indian_War_Redux.151.d: "Китайское правительство объявило о создании Народной Республики Индии на оккупированных северо-восточных штатах Индии. Новое правительство возглавит Чару Маджумдар. Новое правительство призвало всех революционных индийцев приехать, пообещав в конечном итоге распространить революцию на Индию. Правительство Индии, к которому присоединились Соединенные Штаты, осудило то, что они называют государством-клиентом Китая. Поступают сообщения о беспорядках и протестах в крупных индийских городах, поскольку многие ошеломлены масштабами неудачи."
 SINO_INDIAN_WAR.150.d: "Правительство Индии развернуло крупную дипломатическую кампанию, представители которой обратились к правительствам и публикациям в СМИ по поводу продолжающегося спора с Китаем. Индия утверждает, что китайские солдаты продолжают перебрасывать войска к югу от линии Мак-Магона, нарушая международные соглашения. Индийские дипломаты отметили, что в настоящее время их вооруженные силы развернуты для противодействия этой угрозе и предотвращения насильственной китайской оккупации. Китайское правительство осудило претензии Индии, обвинив индийскую армию в нарушении границы с целью насильственного выселения своих войск."
 SINO_INDIAN_WAR.151.d: "Наши военные операции против Китая продемонстрировали сильные, но также и слабые стороны наших возможностей. Звучат призывы переориентировать некоторые из наших ресурсов. Одна группа гражданских и военных чиновников считает, что нынешние разведывательные механизмы не в состоянии обеспечить адекватную военную разведку, отмечая отсутствие точных карт. Эта группа официальных лиц хотела бы, чтобы больше внимания уделялось сбору военной разведывательной информации, а не другим формам. Другая группа гражданских и военных чиновников отметила, что командный механизм временами наделял гражданских чиновников, особенно министра обороны, слишком большими полномочиями в военных вопросах. Эти чиновники хотели бы видеть реформу на высшем уровне. Правительство должно решить, переориентировать ли нашу разведку или реформировать высшие уровни военного командования."
