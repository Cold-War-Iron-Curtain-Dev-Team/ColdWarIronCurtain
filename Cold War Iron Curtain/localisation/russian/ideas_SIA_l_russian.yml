 the_lagacy_of_khana_ratsadon: "Наследие Ханы Рацадон"
 the_lagacy_of_khana_ratsadon_desc: "Революция 1932 года оказалась Поворотным пунктом тайской политики. Она закончилась абсолютным господством монархической власти, которая длилась почти 600 лет и дала Таиланду его первую Конституцию. Но все закончилось не очень хорошо. За ней последовала короткая гражданская война 1933 года. До сих пор Таиланд остается в состоянии политической нестабильности и борьбы за власть между Плаеком Пхибунсонкхрамом и Приди Баномыонгом, которые оба были бывшими членами Хана Рацадон."
