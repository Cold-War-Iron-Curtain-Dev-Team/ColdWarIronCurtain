l_english:
 egy_corruption_tt: "§RВ правительстве начинает появляться коррупция§!"
 egysud.tt.1: "§YНезависимость Судана будет решена по британскому графику§!"
 EGY_The_Mad_King: "Безумный король"
 EGY_The_Mad_King_desc: "Фарук, несомненно, очень обаятельный человек, но он также капризен и безответственен. Он очень богат и любит играть в азартные игры, он скупой клептоман. Если он чего-то хочет, он возьмет это. Он крал не только у своих подданных, но и у самого Черчилля. Даже с женщинами он, кажется, предпочитает жен других мужчин, и он не принимает слово нет в качестве ответа. Если всего есть семь смертных греховО, то он найдет восьмой"
 EGY_The_State_of_Foriegn_Affairs: "Состояние иностранных дел"
 EGY_The_State_of_Foriegn_Affairs_desc: "Появляется новый мировой порядок, и враждебное государство находится рядом с нашими границами, пришло время исправить положение в наших внешней политике..."
 EGY_The_Egyptian_Armed_Forces: "Египетские вооружённые силы"
 EGY_The_Egyptian_Armed_Forces_desc: "Египетские вооружённые силы показали себя некомпетентными. Мы должны изучить наши ВС для работы над ошибками."
 EGY_Lessons_from_the_Nakba: "Извлечь уроки из Накбы"
 EGY_Lessons_from_the_Nakba_desc: "Арабо-израильская война 1948 года показала слабость нашей армииы. Теперь мы должны исправить ошибки, чтобы избежать еще одного позора."
 EGY_The_Egyptian_Airforce: "Египетские ВВС"
 EGY_The_Egyptian_Airforce_desc: "Египетские ВВС существуют только на бумаге. Если мы хотим конкурировать с другими странами, то мы должны реорганизовать и модернизировать нашу авиацию."
 EGY_Puchase_British_Jets: "Купить британские реактивные самолёты"
 EGY_Puchase_British_Jets_desc: "У нас отсутствуют возможности разработки и производства собственных реактивных истребителей, так что нам стоит закупить их у Британии для продолжения программы модернизации ВВС."
 EGY_Recover_our_Losses: "Возмещение убытков"
 EGY_Recover_our_Losses_desc: "Мы должны возместить наши потери, понесённые в войне против Израиля."
 EGY_Czechoslovakian_Arms_Deal: "Чехословацкая оружейная сделка"
 EGY_Czechoslovakian_Arms_Deal_desc: "Американцы и британцы отказываются давать нам вооружение, которое может быть использовано против наших соседей. Если Запад не хочет нам помогать, возможно это сделают коммунисты."
 EGY_Expand_Cairo_Airbases: "Расширить аэродромы Каира"
 EGY_Expand_Cairo_Airbases_desc: "Аэродромы Каира стареют и их обслуживание оставляет желать лучшего. Мы должны расширить аэродромы для будущих самолётов."
 EGY_The_Egyptian_Army: "Египетская армия"
 EGY_The_Egyptian_Army_desc: "Египетская армия пронизана некомпетентностью и старыми методами. Для конкуренции с нашими соседями необходимо модернизировать и оживить армию."
 EGY_A_Political_Army: "Политическая армия"
 EGY_A_Political_Army_desc: "Армия остро нуждается в реструктуризации. Если мы внедрим лояльных офицеров и командиров в армию, то мы создадим прочную преданную основу для армии."
 EGY_Fortification_Initiatives: "Инициатива по фортификации"
 EGY_Fortification_Initiatives_desc: "Очередная война с Израилем неизбежна. Создание укреплений и военных объектов даст нам преимущество в любых предстоящих конфликтах."
 EGY_Field_Marshall_Abdel_Hakim_Amer: "Фельдмаршал Абдель Хаким Амер"
 EGY_Field_Marshall_Abdel_Hakim_Amer_desc: "Последним штрихом, необходимым для избавления армии от некомпетентности, является назначение достойного фельдмаршала. Абдель Хаким Амер подходит для этой задачи."
 EGY_Purchase_Modern_Infantry_Equipment: "Приобрести современное пехотное снаряжение"
 EGY_Purchase_Modern_Infantry_Equipment_desc: "Множество нашего оружия является остатками со второй мировой войны, нам следует купить современное вооружения для повышения боеспособности армии."
 EGY_The_Egyptian_Navy: "Египетский ВМФ"
 EGY_The_Egyptian_Navy_desc: "Наш военно-морской флот состоит только из старых британских кораблей. Эффективная охрана нашего побережья и вод невозможна без модернизации. Пришло время для развития флота."
 EGY_Begin_Naval_Armament_Campaign: "Начать кампанию военно-морского вооружения"
 EGY_Begin_Naval_Armament_Campaign_desc: "Мы должны начать модернизацию нашего военно-морского флота путем строительства объектов для производства новых кораблей. Сделав это, мы получим возможность построить большой и современный флот."
 EGY_Purchase_Ibrahim_el_Awal: "Купить Ибрагим эль-Аваль"
 EGY_Purchase_Ibrahim_el_Awal_desc: "У каждого флота есть флагман.Мы должны купить это современное чудо, чтобы ускорить расширение и модернизацию нашего флота."
 EGY_Amphibious_Training: "Тренировка десанта"
 EGY_Amphibious_Training_desc: "Мировая война доказала необходимость морских высадок на вражеский берег. Мы должны обучить наших солдат этим операциям в современных условиях."
 EGY_The_Straits_of_Tiran: "Тиранские проливы"
 EGY_The_Straits_of_Tiran_desc: "Тиранские проливы должны быть укреплены для того, чтобы мы были готовы в момент израильского нападения."
 EGY_Ban_All_Red_Cars: "Запретить красные автомобили"
 EGY_Ban_All_Red_Cars_desc: "Король любит красные автомобили и гонки, но неневидит, когда полиция мешает ему во время вождения. Поэтому он решил запретить все красные автомобили для того, чтобы полиция знала, что это он."
 EGY_Endemic_Corruption: "Повсеместная коррупция"
 EGY_Endemic_Corruption_desc: "Из-за нерациональных королевских расходов и решений коррупция начинает получать распространение внутри страны."
 EGY_The_Ghali_Affair: "Дело Гали"
 EGY_The_Ghali_Affair_desc: ""
 EGY_The_Kitchen_Cabinet: "Вечеринка во Франции"
 EGY_The_Kitchen_Cabinet_desc: "Королю просто необходима большая вечеринка во Франции. Почему? Потому что он король."
 EGY_The_Visit_to_France: "Визит во Францию"
 EGY_The_Visit_to_France_desc: "Король решил, что он должен посетить Францию с дипломатической целью, какой бы она ни была на самом деле."
 EGY_Cancel_the_Anglo_Egyptian_Treaty_of_1936: "Отменить англо-египетский договор 1936 года"
 EGY_Cancel_the_Anglo_Egyptian_Treaty_of_1936_desc: "Несмотря на нашу формальную независимость, полученную в 1922 году, британцы имели чрезмерное влияние на наше Королевство. Договор 1936 года был подписан из-за страха перед итальянским империализмом, вследствие чего мы не смогли полностью устранить британское влияние, и отмена договора была бы хорошим первым шагом к окончательному избавлению от британского контроля."
 EGY_Growing_Discontent: "Растущее недовольство"
 EGY_Growing_Discontent_desc: "Из-за нарастающего безумием короля и ухудшения условий жизни обычных людей популярность короля ежедневно уменьшается. Вскоре кто-то может даже попытаться свергнуть его."
 EGY_The_King_of_Egypt_and_Sudan: "Король Египта и Судана"
 EGY_The_King_of_Egypt_and_Sudan_desc: ""
 EGY_Black_Saturday: "Чёрная суббота"
 EGY_Black_Saturday_desc: "Все коррумпированные и корыстные решения, которые принимал король, создали цепную реакцию, ожидающую взрыва. Искра, которая зажгла взрыв, возникла, когда 50 египетских полицейских были убиты оккупационными войсками в бою. Протест быстро превратился в жестокие беспорядки, превратившиеся в антиправительственные. Это конец царства египетского?"
 EGY_The_Egyptian_Revolution: "Египетская революция"
 EGY_The_Egyptian_Revolution_desc: "Избавившись от беспорядков и нестабильности, Свободные офицеры спровоцировали переворот против короля Фарука. Удачный переворот сигнализирует о конце старого порядка и открывает путь для новой республики."
 EGY_Establish_the_RCC: "Учредить Совет революционного командования Египта"
 EGY_Establish_the_RCC_desc: "Совет революционного командования Египта должен быть создан для того, чтобы направлять революцию и избегать разделения фракций изнутри"
 EGY_Sideline_Pro_Soviet_Officers: "Сместить просоветских офицеров"
 EGY_Sideline_Pro_Soviet_Officers_desc: "Про-советские офицеры - не что иное, как помеха. Чтобы обеспечить мирный переход, мы должны ослабить коммунистическое влияние."
 EGY_Abolish_the_1923_Constitution: "Отменить Конституцию 1923 года"
 EGY_Abolish_the_1923_Constitution_desc: "Конституция 1923 года является старой и неэффективной, она была создана только для успокоения масс. Мы должны отменить старую конституцию и начать написание новой."
 EGY_Agrarian_Reform_Law: "Закон об аграрной реформе"
 EGY_Agrarian_Reform_Law_desc: "Реализация аграрной реформы позволит нам получить поддержку народа и увеличить производство сельскохозяйственной продукции. Мы будем меньше зависеть от импорта и иностранной помощи."
 EGY_Exile_Farouk: "Изгнать Фарука"
 EGY_Exile_Farouk_desc: "Король Фарук должен быть изгнан. Его убийство может повлечь международное осуждение и даже повлечь британскую интервенцию."
 EGY_Declare_the_Three_Year_Transitional_Period: "Объявить трехлетний переходный период"
 EGY_Declare_the_Three_Year_Transitional_Period_desc: "Переход от королевства к республике потребует трехлетнего переходного периода для обеспечения плавной и стабильной передачи власти."
 EGY_The_Anglo_Egyptian_Sudan: "Англо-египетский Судан"
 EGY_The_Anglo_Egyptian_Sudan_desc: "Статус англо-египетского Судана должен быть решен. Мы можем требовать аннексии Судана или позволить Судану существовать как суверенная республика."
 EGY_Push_for_Annexation: "Требовать аннексии"
 EGY_Push_for_Annexation_desc: "Мы должны оказать давление на британцев для того, чтобы они позволили нам аннексировать Судан."
 EGY_Full_Annexation: "Полная аннексия"
 EGY_Full_Annexation_desc: "Весь Судан является законной собственностью короля. Мы должны полностью аннексировать Судан, чтобы полностью контролировать то, что по праву принадлежит нам."
 EGY_Arrest_the_Free_Officers: "Арестовать Свободных Офицеров"
 EGY_Arrest_the_Free_Officers_desc: "Организация предателей, известная как Движение свободных офицеров, попыталась свергнуть наше законное правительство. Однако заговорщики были побеждены, а переворот ликвидирован, и наш великий король Фарук якобы убил по меньшей мере 16 предателей, хотя, к сожалению, одному из главных лидеров попытки государственного переворота Гамаль Абдель Насер удалось бежать."
 EGY_Political_Crackdown: "Политические облавы"
 EGY_Political_Crackdown_desc: "Движение свободных офицеров было политической организацией младших офицеров и других националистических фигур в вооруженных силах. Это доказало нелояльность тех политических организаций, которые не связаны с королем. Этих потенциальных диссидентов необходимо остановить, прежде чем они попытаются совершить новый переворот."
 EGY_Begin_the_Purges: "Начать чистки"
 EGY_Begin_the_Purges_desc: "Нападающие, возможно, и потерпели поражение, но в нашей стране все еще есть те, кто сочувствует заговорщикам. Мы должны устранить этих предателей, чтобы восстановить порядок в Королевстве."
 EGY_Absolute_Monarchism: "Абсолютная монархия"
 EGY_Absolute_Monarchism_desc: "Отныне король будет править декретом без ограничения своей власти, как абсолютные монархи древности."
 EGY_Dissolve_Parliament: "Распустить парламент"
 EGY_Dissolve_Parliament_desc: "Его Величество Фарук I Алавийя Милостью Бога король Египта и Судана постановил, что впредь парламент должен быть распущен, а выборы – приостановлены."
 EGY_Strengthen_Western_Ties: "Укрепить связи с Западом"
 EGY_Strengthen_Western_Ties_desc: "Британцы давно поддерживают нашу монархию, несмотря на наши недавние споры по Судану и Суэцу. Мы должны продолжать укреплять тесные связи с ними, а также начать общение к американцам."
 EGY_Ban_Radical_Movements: "Запретить радикальные движения"
 EGY_Ban_Radical_Movements_desc: "Движение свободных офицеров и их попытка государственного переворота пользовались поддержкой других радикальных группировок, стремящихся положить конец монархии. Правительство подготовило проект нового указа, который объявит вне закона любую политическую деятельность, которая считается опасной для стабильности Королевства. Теперь все, что требуется, - это королевское одобрение."
 EGY_Partition_of_Sudan: "Раздел Судана"
 EGY_Partition_of_Sudan_desc: "Разделение Судана предотвратит будущую нестабильность и даст нам контроль над дружественным арабам севером страны."
 EGY_Execute_Nasser: "Казнить Насера"
 EGY_Execute_Nasser_desc: "Насер был всего лишь предателем, служившим себе, и пытавшимся захватить власть в Египте путем государственного переворота. Насер должен быть казнен, чтобы наказать его за его преступления и это будет служить предупреждением другим предательским группировкам в Египте."
 EGY_American_Military_Advisors: "Американские военные советники"
 EGY_American_Military_Advisors_desc: "Наши военные офицеры оказались ненадежными и опасными. Мы должны начать переговоры с американцами для получения помощи новому поколению офицеров, более лояльных королю."
 EGY_Encourage_Tourism: "Поощрять туризм"
 EGY_Encourage_Tourism_desc: "В результате наших недавних инициатив на западе мы начали видеть новый приток туристов и, что более важно, их наличные деньги. Мы должны поощрять эту тенденцию и инициировать программу стимулов для создания новых предприятий, ориентированных на туризм."
 EGY_Invest_in_Infrastructure: "Инвестировать в инфраструктуру"
 EGY_Invest_in_Infrastructure_desc: "Большая часть нашего великого Королевства все еще существует в условиях, которые многие сочли бы доиндустриальными. Мы должны инвестировать в инфраструктуру, чтобы стимулировать экономическую активность и привлекать инвестиции."
 EGY_Restructure_the_Royal_Military: "Реструктуризация Королевской армии"
 EGY_Restructure_the_Royal_Military_desc: ""
 EGY_Encourage_Western_Casinoes: "Поощрять западные казино"
 EGY_Encourage_Western_Casinoes_desc: "Хорошо известно, что наш король любит прекрасные вещи в жизни, и хотя многие критиковали его за это. Также это дало ему ценное представление о важности бизнеса, который некоторые могут считать ... аморальным, и теперь он стремится поощрять инвестиции в эти заведения в Египте. Конечно, чисто из соображений экономической выгоды."
 EGY_The_Republic_of_Sudan: "Республика Судан"
 EGY_The_Republic_of_Sudan_desc: "Судан должен стать суверенной республикой, которая избавит нас от будущих проблем, которые могли бы возникнуть, если бы мы сохранили контроль над Суданом."
 EGY_The_Suez_Situation: "Суэцкая ситуация"
 EGY_The_Suez_Situation_desc: "Канал был построен египтянами, но находится в чужих руках. Бесчисленные египтяне погибли, строя канал, но британцы и французы пожинают прибыль. Если мы хотим вернуть контроль над нашей страной и получить стратегически ценный водный путь, мы должны вернуть контроль над каналом."
 EGY_Abrogate_the_1936_Treaty: "Расторгнуть англо-египетский договор 1936 года"
 EGY_Abrogate_the_1936_Treaty_desc: "Британская империя была ослаблена войной. Если мы вернем канал силой, они не смогут остановить нас. Мы заберем канал любыми необходимыми средствами."
 EGY_Negotiate_with_Britain: "Переговоры с Британией"
 EGY_Negotiate_with_Britain_desc: "Мы не можем позволить себе войну с англичанами из-за канала. Если мы хотим сохранить хорошие отношения с англичанами и западом, мы должны вести переговоры о мирной передаче Суэцкого канала."
 EGY_The_Gaza_Strip: "Сектор Газа"
 EGY_The_Gaza_Strip_desc: "После унижения, с которым мы столкнулись после арабо-израильской войны 1948 года, мы сохранили контроль над сектором Газа."
 EGY_Dissolve_the_Palestinian_Government: "Распустить палестинское правительство"
 EGY_Dissolve_the_Palestinian_Government_desc: ""
 EGY_Abolish_the_Monarchy: "Упразднить монархию"
 EGY_Abolish_the_Monarchy_desc: "Монархия старого мира будет расформирована, и новая светская республика родится из пепла."
 EGY_Ban_All_Parties: "Запретить все партии"
 EGY_Ban_All_Parties_desc: "Всем партиям будет запрещено обеспечивать мирный переход между партиями и предотвращать любую нестабильность, которая может произойти со сменой правительства после выборов."
 EGY_Establish_the_Liberation_Rally: "Учредить митинг по поводу освобождения"
 EGY_Establish_the_Liberation_Rally_desc: "Будет организован митинг, посвящённый освобождению египетского народа от старой, коррумпированной и британской контролируемой монархии."
 EGY_A_New_Constitution: "Новая конституция"
 EGY_A_New_Constitution_desc: "Настало время разработать новую и современную конституцию, которая поможет Египту стать современной державой."
 EGY_Secular_Values: "Светские ценности"
 EGY_Secular_Values_desc: "Мы должны принять светские ценности в нашем правительстве, если мы хотим быть современной и уважаемой страной."
 EGY_Trials_for_the_Royalist_Officers: "Суды над офицерами-роялистами"
 EGY_Trials_for_the_Royalist_Officers_desc: ""
 EGY_Ikhwan_Rioting: "Бунт ихванов"
 EGY_Ikhwan_Rioting_desc: "После многих светских программ более консервативное и исламистское население начало беспорядки."
 EGY_Ban_the_Ikhwan: "Запретить ихванов"
 EGY_Ban_the_Ikhwan_desc: "Мы должны запретить ихванов, чтобы обуздать их опасное влияние в правительстве и в Египте в целом."
 EGY_Conflicts_in_the_RCC: "Конфликты внутри СРК"
 EGY_Conflicts_in_the_RCC_desc: "В Совете революционного командования произошёл раскол по поводу того, в каком направлении правительство и Египет должны идти дальше. Мы должны подождать и посмотреть, что происходит."
 EGY_Naguib_Consolidates_Power: "Нагиб консолидирует власть"
 EGY_Naguib_Consolidates_Power_desc: ""
 EGY_Nasser_Consolidates_Power: "Насер консолидирует власть"
 EGY_Nasser_Consolidates_Power_desc: "Полковник Гамаль Абдель Насер всегда был самым харизматичным в группе. Благодаря укрепляющей силе Насера ​​Египет пойдет в панарабском и антиизраильском направлении."
 EGY_Kahlid_Mohieddin_Coup: "Переворот Халида Мохиеддина "
 EGY_Kahlid_Mohieddin_Coup_desc: ""
 EGY_Establish_Tagammu: "Учредить Тагамму"
 EGY_Establish_Tagammu_desc: ""
 EGY_Strengthen_Soviet_Ties: "Укрепить связи с Советами"
 EGY_Strengthen_Soviet_Ties_desc: ""
 EGY_Merger_with_the_Communist_Party: "Слияние с коммунистами"
 EGY_Merger_with_the_Communist_Party_desc: ""
 EGY_Reconstruction_of_Cairo: "Реконструкция Каира"
 EGY_Reconstruction_of_Cairo_desc: ""
 EGY_City_Economics: "Экономика города"
 EGY_City_Economics_desc: ""
 EGY_The_Modern_Pharoah: "Фараон современности"
 EGY_The_Modern_Pharoah_desc: "Король Фарук успешно закрепил свое правление и доказал, что он здесь останется."
 EGY_Soviet_Military_Coopeation: "Советская военная кооперация"
 EGY_Soviet_Military_Coopeation_desc: ""
 EGY_Align_with_the_Warsaw_Pact: "Сближение с Варшавским договором"
 EGY_Align_with_the_Warsaw_Pact_desc: "Запад не хочет поддерживать нас против израильской угрозы. Итак, пришло время присоединиться к Варшавскому договору, чтобы обуздать западные и империалистические влияния в Египте и арабском мире в целом."
 EGY_Sponsor_Fedayeen_Activities: "Спонсировать израильских фидаинов"
 EGY_Sponsor_Fedayeen_Activities_desc: "Мы должны спонсировать наших палестинских братьев, вооружив федаинов, чтобы сорвать израильские операции в Палестине."
 EGY_Expand_Womens_Rights: "Расширить права женщин"
 EGY_Expand_Womens_Rights_desc: "Современный Египет требует современной политики. Египет должен отстаивать права женщин и войти в число прогрессивных государств Ближнего Востока."
 EGY_Establish_Secret_Police: "Создать секретную полицию"
 EGY_Establish_Secret_Police_desc: "Прискорбная правда, что египетский народ еще не полностью поддержал наше новое правительство, и есть даже те, кто призывает к свержению нашего великого лидера и уничтожению партии. Чтобы эти подрывники не подорвали страну, мы должны создать специальную службу безопасности, чтобы устранить их, прежде чем они смогут «промыть мозги» людям."
 EGY_Nationalize_Foriegn_Assets: "Национализировать иностранные активы"
 EGY_Nationalize_Foriegn_Assets_desc: "Иностранцы слишком долго эксплуатируют наш народ. Пора ликвидировать влияние этих капиталистических паразитов и захватить их активы на благо государства (и людей)."
 EGY_Student_Radicalization: "Радикализация студентов"
 EGY_Student_Radicalization_desc: ""
 EGY_Enforce_State_Atheism: "Учредить государственный атеизм"
 EGY_Enforce_State_Atheism_desc: "Религия не сделала ничего, кроме как сдерживала египетский народ страхом и суевериями. Мы должны принять атеизм, навязанный государством, чтобы двигаться в будущее."
 EGY_Reduce_Censorship: "Ослабить цензуру"
 EGY_Reduce_Censorship_desc: "У прессы всегда были отношения любви-ненависти к правительствам. Чтобы не допустить распространения недемократических элементов, прессу пришлось подвергнуть цензуре, но в этом больше нет необходимости, и свободу прессы можно восстановить."
 EGY_Repeal_Political_Bans: "Отменить политические запреты"
 EGY_Repeal_Political_Bans_desc: "Когда наша власть обеспечена, а революция стабилизируется, авторитарные меры, используемые для предотвращения контрпереворота, могут быть отменены, и мы можем серьезно начать демократический процесс."
 EGY_Guided_Democracy: "Направленная демократия"
 EGY_Guided_Democracy_desc: "Хотя президент Нагиб обеспечил сохранение демократических принципов в Египте, все еще есть те, кто будет стремиться дестабилизировать страну. Чтобы защитить еще молодую демократию, мы должны убедиться, что люди движутся в правильном направлении."
 EGY_The_Road_to_Democracy: "Дорога к демократии"
 EGY_The_Road_to_Democracy_desc: "Мохамед Нагиб, лидер революции 1952 года и первый президент Египта, принес демократию в нашу великую нацию, и, хотя нам предстоит еще долгий и трудный путь, мы можем быть уверены, что он будет демократическим."
 EGY_Establish_Political_Rights: "Установить политические права"
 EGY_Establish_Political_Rights_desc: "Когда демократия больше не находится под угрозой, мы можем закрепить права, достигнутые революцией законом."
 EGY_Western_Rappoachment: "Повторное сближение с Западом"
 EGY_Western_Rappoachment_desc: "После революции, отношения с Западом были напряженными, если не сказать лучше. Мы должны стремиться восстановить наши испорченные отношения и установить обновленные отношениями с великими странами Запада."
 EGY_Tolerate_the_Ilkwhan: "Допустить деятельность ихванов"
 EGY_Tolerate_the_Ilkwhan_desc: "Египетское «Братья-мусульмане» (также известное как Ихван) было главной политической силой в Египте в течение многих лет, и с падением монархии их влияние еще больше возросло. Несмотря на их поддержку революции, они на каждом шагу противодействовали нашим усилиям по секуляризации страны. Если мы снимем запрет на их деятельность и включим их в демократический процесс, мы сможем изолировать более радикальных членов Братства и не дать им дестабилизировать обстановку в стране."
 EGY_Hold_Elections: "Провести выборы"
 EGY_Hold_Elections_desc: "Пришло время выполнить наше обещание принести демократию в Египет, все на выборы!"
 EGY_Naguib_Victory: "Победа Нагиба"
 EGY_Naguib_Victory_desc: "Мохамед Нагиб, лидер революции и первый президент новой республики, проявил себя как способный и заслуживающий доверия лидер, и люди предпочли, чтобы он продолжал руководить страной."
 EGY_Ilkwhan_Victory: "Победа Ильхана"
 EGY_Ilkwhan_Victory_desc: "«Братья-мусульмане» имели влияние в Египте с момента своего основания в 1928 году. Несмотря на усилия как монархии, так и Движения свободных офицеров по подавлению этой организации, они продолжали оставаться ведущими защитниками исламского Египта и добились победы на недавних выборах. Однако «Братство» разделено на умеренных, которые выступают за демократию, основанную на исламских принципах, и сторонников жесткой линии, которые стремятся создать полностью исламское государство в Египте."
 EGY_Establish_Sharia_Law: "Установить законы шариата"
 EGY_Establish_Sharia_Law_desc: "В то время как сторонники жесткой линии и умеренные сталкиваются по многим вопросам, обе стороны могут согласиться с тем, чтобы включить законы шариата в кодекс законов Египта и создать шариатские суды, чтобы помочь светским властям обеспечить соблюдение исламских законов."
 EGY_Mobilize_the_Secret_Apparatus: "Мобилизовать секретный аппарат"
 EGY_Mobilize_the_Secret_Apparatus_desc: "Так называемый Секретный Аппарат был важной военизированной силой Братства со времен Монархии. Теперь, когда Египет движется к исламскому будущему, их следует мобилизовать для защиты исламского правительства."
 EGY_Promote_Islamic_Morality: "Продвигать исламскую мораль"
 EGY_Promote_Islamic_Morality_desc: "Нравственность нашего народа так же важна, как и любая правительственная реформа или закон. Мы должны продвигать исламские ценности и учения в школах и государственных учреждениях, чтобы поощрять нравственное поведение среди граждан."
 EGY_Sayyid_Qutb: "Сейид Кутб"
 EGY_Sayyid_Qutb_desc: "Люди высказались, и, несмотря на усилия RCC по секуляризации, они доказали всем, что египетский народ является исламским насквозь. Сторонники жесткой линии при Сайиде Кутбе стали победителями в борьбе за власть среди Братьев-мусульман, и теперь может начаться процесс преобразования Египта в истинное исламское государство."
 EGY_Condemn_the_Zionist_Threat: "Осудить сионистскую угрозу"
 EGY_Condemn_the_Zionist_Threat_desc: "Мы должны осудить сионистскую угрозу за нашими границами за незаконное государство, которым она является."
 EGY_Persecute_Religous_Minorities: "Преследовать религиозные меньшинства"
 EGY_Persecute_Religous_Minorities_desc: "Очень жаль, что в Египте есть те, кто все еще отвергает учение ислама и Братства. Чтобы достичь чистого общества, нужно избавиться от этих неисламских элементов и устранить религиозные разногласия."
 EGY_Repeal_Secular_Reforms: "Отменить светские реформы"
 EGY_Repeal_Secular_Reforms_desc: "Светские реформы RCC и президента Нагиба были основным голосом оппозиции Братства после революции. Теперь, когда люди продемонстрировали свое стремление к исламскому Египту, эти реформы должны быть отменены, и ислам должен занять свое законное место в качестве руководящего принципа нашей нации."
 EGY_Hassan_al_Hudaybi: "Хасан аль-Худайби"
 EGY_Hassan_al_Hudaybi_desc: "Умеренная фракция Братьев-мусульман во главе с Хасаном Аль Худайби, официальным лидером Братства, победила на выборах. Худайби, давний критик насильственных тенденций Братства и сторонник более мирного и демократического перехода к исламскому обществу, завоевавший сочувствие и поддержку народа, преодолев внутреннюю оппозицию внутри Братства и одержавший победу в борьбе за власть с сторонниками жесткой линии. и теперь может начать преобразование Египта в истинно исламскую республику."
 EGY_Crush_Israel: "Сокрушить Израиль"
 EGY_Crush_Israel_desc: "Эксперимент нелегитимного сионистского государства продолжался достаточно долго. Пришло время вернуть Палестину и раздавить Израиль."
 EGY_Du_at_la_Qudat: "Ду ла Кудат"
 EGY_Du_at_la_Qudat_desc: "Президент Худайби наконец-то опубликовал свой трактат о применении исламского закона в обществе. Так называемый Ду ла Кудат (проповедники, а не судьи) опровергает более радикальные элементы внутри Братства и критикует методы других мусульманских правительств за их политику и осуждает практику такфира, или объявления мусульманина неверующим. Никогда прямо не ссылаясь на Сайида Кутб, многие отметили последствия осуждения конкретных практик и тактик, используемых Кутбом и сторонниками жесткого курса."
 EGY_Moderate_Reforms: "Умеренные реформы"
 EGY_Moderate_Reforms_desc: "Хотя ислам должен быть основой политики и закона в Египте, это не означает, что мы должны преследовать другие религии. Наши реформы должны гарантировать защиту этих меньшинств, гарантировать свободу религии, хотя и при исламском правительстве."
 EGY_Democratic_Islamism: "Демократический ислам"
 EGY_Democratic_Islamism_desc: "Ислам по своей сути является демократической религией, и правительство должно отражать это. Коран учит, что Шура и Иджма жизненно важны для функций управления и что свободы и права (аль-хуррийя и аль-хуккук аль-шарийя) должно быть гарантировано. Это также должно гарантировать стабильность и популярность нашего правительства."
 EGY_Support_Small_Buisness: "Поддержать малый бизнес"
 EGY_Support_Small_Buisness_desc: "Класс торговцев всегда был важен в исламе и исламских традициях ведь сам Пророк изначально был купцом. Следуя этой практике, мы должны поддерживать малый бизнес и торговцев в нашей стране и гарантировать их защиту."
 EGY_Increase_Healthcare_Access: "Расширить доступ к здравоохранению"
 EGY_Increase_Healthcare_Access_desc: "Наши люди по-прежнему страдают от отсутствия доступа к медицинской помощи. Пришло время обеспечить, чтобы каждый мог получить надлежащее лечение от болезней и травм."
 EGY_Water_Infrastructure: "Водные объекты"
 EGY_Water_Infrastructure_desc: "Река Нил была источником жизненной силы Египта со времен фараонов. Правительству следует улучшить инфраструктуру вокруг него, чтобы лучше использовать эту важную реку."
 EGY_Western_Investment: "Западные инвестиции"
 EGY_Western_Investment_desc: "Запад долгое время эксплуатировал египетский народ, но теперь мы - сильная и независимая демократическая страна, свободная от иностранного влияния. Мы должны снова привлечь инвестиции из западных стран, но на этот раз на наших условиях."
 EGY_Exile_the_Jewish_Population: "Изгнать еврейское население"
 EGY_Exile_the_Jewish_Population_desc: "Еврейское население должно быть изгнано, если мы хотим сохранить стабильность внутри наших границ."
 EGY_Economic_Growth: "Экономический рост"
 EGY_Economic_Growth_desc: "Реформы Насера ​​приносят свои плоды, поскольку экономика начала расти. Мы должны использовать эти благоприятные экономические условия."
 EGY_Increase_Access_to_Healthcare: "Увеличить доступность здравоохранения"
 EGY_Increase_Access_to_Healthcare_desc: "Каждый египтянин, нуждающийся в медицинской помощи, должен иметь возможность получить её. Мы должны расширить доступ к медицинской помощи для самых бедных египтян."
 EGY_Golden_Era_of_Egyptian_Culture: "Золотая эра египетской культуры"
 EGY_Golden_Era_of_Egyptian_Culture_desc: "Предоставленная правительством культурная свобода положила начало золотой эре египетской культуры и кино."
 EGY_Helwan_Steel_Works: "Хелуанский металлургический завод"
 EGY_Helwan_Steel_Works_desc: "С металлургическим заводом Хелуан мы сможем значительно увеличить производство стали. При этом мы будем меньше зависеть от иностранного импорта стали."
 EGY_Constitutional_Reform: "Конституционные реформы"
 EGY_Constitutional_Reform_desc: "Мы должны реформировать конституцию, чтобы она соответствовала постоянно меняющейся ситуации в Египте. Если конституция должна оставаться современной, она должна быть реформирована"
 EGY_Establish_the_National_Union: "Создать Национальный Союз"
 EGY_Establish_the_National_Union_desc: "Чтобы обуздать коммунистическое влияние и получить больше поддержки со стороны левых, мы создадим национальный союз."
 EGY_Secure_Funding_for_the_Aswan_Dam: "Обеспечить финансирование Асуанской плотины"
 EGY_Secure_Funding_for_the_Aswan_Dam_desc: "Если Египет хочет модернизировать и увеличить производство сельскохозяйственной продукции, должна быть построена Асуанская плотина. Таким образом, чрезвычайно важно найти иностранные инвестиции и кредит для финансирования строительства плотины для обеспечения  египетского народа водой и электричеством."
 EGY_Expand_Affordable_Housing: "Увеличить доступность жилья"
 EGY_Expand_Affordable_Housing_desc: "Мы должны расширить доступность жилья для размещения растущего населения Египта и сокращения количества бездомных"
 EGY_Nationalization_Programs: "Программа по национализации"
 EGY_Nationalization_Programs_desc: "Национализация иностранных компаний пойдет на пользу не только правительству, но и населению. Благодаря этим кампаниям по национализации мы сможем финансировать наши реформы и государственные программы."
 EGY_Formation_of_the_UAR: "Формирование ОАР"
 EGY_Formation_of_the_UAR_desc: "Мы должны объединить всех арабов под единым флагом и единой страной. Формирование ОАР станет началом объединения арабов и станет важным моментом в истории. Формирование ОАР сместит баланс сил на Ближнем Востоке в нашу пользу."
 EGY_Surplus_Soviet_Supplies: "Излишки советского снаряжения"
 EGY_Surplus_Soviet_Supplies_desc: "У Советского Союза есть большой избыток запасов, которые могли бы финансировать и снаряжать нашу армию. Получение этих поставок подготовит нас к будущим действиям"
 1_EGY_tt: "Абдель Хаким Амер станет фельдмаршалом"
 2_egy_tt: "Его Величество Король Фарук посетит Францию с дипломатической целью"
 3_egy_tt: "Все красные автомобили будут под запретом"
 EGY_construct_a_spy_network: "Создать Службу Государственной Безопасности"
 EGY_construct_a_spy_network_desc: "Поскольку в египетском обществе слишком много предателей, король одобрил создание новой королевской службы безопасности для защиты института монархии."
 EGY_guarantee_high_living_for_friends: "Гарантия высоких стандартов жизни для друзей"
 EGY_guarantee_high_living_for_friends_desc: "Почему бы не наградить друзей более высоким уровнем жизни, чем у обычных людей? Как вы помните, они были вам верны."
 EGY_fund_oil_barons: "Финансировать нефтяных баронов"
 EGY_fund_oil_barons_desc: "Король Фарук имеет связи с нефтяными баронами. Мы должны продемонстрировать им поддержку со стороны правительства, чтобы увеличить добычу нефти."
 EGY_build_up_the_army: "Расширить армию"
 EGY_build_up_the_army_desc: "После ликвидирования нелояльных офицеров и обеспечения лояльности военных, король Фарук решил приступить к программе военной экспансии во славу короля и страны."
 EGY_stop_communism: "Репрессировать коммунистические организации"
 EGY_stop_communism_desc: "Из всех политических сил в Египте, призывающих к свержению монархии, коммунисты в последние годы были наиболее активными. Хотя спецслужбы не смогли подтвердить поддержку Москвы в их усилиях, мы, тем не менее, должны активизировать наши усилия по подавлению этой опасной идеологии."
 EGY_military_parade: "Организовать военный парад"
 EGY_military_parade_desc: "Наши вооруженные силы сейчас являются одними из самых современных и мощных во всем арабском мире. Мы должны организовать военный парад в Каире, чтобы продемонстрировать нашу мощь миру и любым потенциальным диссидентам внутри страны."
 EGY_fund_healthcare: "Финансирование здравоохранения"
 EGY_fund_healthcare_desc: "Благополучие наших граждан должно быть на первом месте. Новый монарх внес в парламент законопроект, призванный повысить доступность и качество здравоохранения в королевстве."
 EGY_farouk_leads_troops: "Маршалл Фарук"
 EGY_farouk_leads_troops_desc: "Подобно древним фараонам, Его Величество лично возглавит свои войска. Разве король не должен утверждать свое командование в армии?"
 EGY_farouk_clique: "Клика Фарука"
 EGY_farouk_clique_desc: "Из-за склонности Фарука давать огромные суммы денег своим друзьям, теперь мы начинаем видеть организованную группировку вокруг Фарука, которая контролирует большую часть страны."
 EGY_improve_lives_with_church: "Разрешить деятельность миссионеров"
 EGY_improve_lives_with_church_desc: "Партия Вафд всегда принимала представителей всех религий и конфессий. Благодаря нашему более терпимому и либеральному подходу к религии западные миссионеры начали создавать медицинские учреждения и программы помощи бедным. Официально признавая этих миссионеров и оказывая государственную поддержку, мы можем обеспечить благополучие наших граждан."
 EGY_labour_negotations: "Выполнить обещания рабочим"
 EGY_labour_negotiations_desc: "Чтобы добиться победы на выборах, мы дали обещания профсоюзам и организациям рабочих. Хотя некоторые в партии могут называть это социализмом, если мы хотим их постоянной поддержки, нам необходимо выполнить наши обещания."
 EGY_wafd_victory: "Победа Вафд"
 EGY_wafd_victory_desc: "Партия Вафд вызвала негодование революционных лидеров и народа за их сотрудничество со старой монархией и британцами. Но с переходом к демократии их либеральная политика снова набрала обороты, и они достигли достаточной популярности, чтобы одержать победу на выборах."
 EGY_sell_farouks_posessions: "Продать имущество короля"
 EGY_sell_farouks_posessions_desc: "Продажа имущества короля Фарука принесет нам дополнительные деньги и докажет египетскому народу, что правительство новой республики будет отличаться от коррумпированной и британской контролируемой монархии."
 EGY_Align_with_moscow: "Сближение с Москвой"
 EGY_Align_with_moscow_desc: "Советский Союз зарекомендовал себя как лидер пролетарского движения во всем мире и наш величайший благотворитель. Мы должны официально подписать ряд договоров о взаимоотношениях с Советским Союзом и вместе работать над освобождением рабочих всего мира."
 EGY_give_land_to_peasents: "Землю - крестьянам"
 EGY_give_land_to_peasents_desc: "Одно из требований противников короля Фарука - это передача земли крестьянам. Это не только повысило бы продуктивность и настроение в обществе, но и наш проницательный монарх мог бы использовать это как способ уменьшить богатство и влияние потенциальных соперников своей власти."
 EGY_replace_farouk: "Заменить Фарука"
 EGY_replace_farouk_desc: "Фарук оказался неспособным объединить и возглавить египетский народ. Его необходимо заменить на более разумного (или управляемого) лидера."
 EGY_limited_reforms: "Ограниченные реформы"
 EGY_limited_reforms_desc: "Несмотря на процветание и мир, которые наш великий король принес стране, все еще есть те, кто осуждает короля Фарука как коррумпированного и некомпетентного. В то время как репрессии и цензура - всегда быстрые способы положить конец таким предательским представлениям, эта стратегия может зайти далеко. Король в своей высшей мудрости счел необходимым провести ограниченные реформы для улучшения жизни людей и создания более эффективного и инициативного правительства."
 EGY_improve_worker_rights: "Расширить права рабочих"
 EGY_improve_worker_rights_desc: "Профсоюзы и рабочие организации давно запрещены в королевстве, однако подпольные союзы и рабочие движения оказались рассадником коммунистических настроений. Хотя это может расстроить некоторых союзников и друзей короля, Фарук достаточно мудр, чтобы понять, что снятие ограничений с профсоюзов и предоставление им возможности действовать открыто, позволит усилить надзор за их деятельностью и истощить потенциальную поддержку коммунистических движений в будущем."
 EGY_reduce_kings_spending: "Уменьшить королевские расходы"
 EGY_reduce_kings_spending_desc: "Король научился скромности и решил сократить свои расходы. Конечно же это хорошо"
 EGY_force_british_to_leave: "Заставить британцев уйти"
 EGY_force_british_to_leave_desc: "Мы слишком долго терпели британцев, поскольку военные силы все еще находятся в этом районе, якобы для защиты Суэцкого канала. Они так и не поняли, что им пора уходить."
 EGY_encorage_egyptian_identitety: "Поддержать египетский национализм"
 EGY_encorage_egyptian_identitety_desc: "Египет не является обычной арабской страной. У Египта есть своя богатая история, которую должен знать народ страны."
 EGY_fate_of_nasser: "Судьба Насера"
 EGY_fate_of_nasser_desc: "Насер был на политической арене только для захвата власти. Теперь, когда его амбиции обузданы, мы должны решить судьбу Насера ​​и будущее Египта."
 EGY_economic_boom: "Жемчужина Нила"
 EGY_economic_boom_desc: "Благодаря мудрому руководству короля Фарука в последние недели в экономике произошел значительный рост инвестиций и расходов, что привело к увеличению богатства."
 EGY_reform_the_parlament: "Реформировать парламент"
 EGY_reform_the_parlament_desc: "Бывший король распустил парламент, чтобы обеспечить свое правление. Вместе с ним мы должны изменить это, чтобы дать людям веру."
 EGY_reform_blueshirts: "Реформа синих рубашек"
 EGY_reform_blueshirts_desc: "Синие рубашки были молодежным крылом нашей партии. Однако, прежде чем извлечь выгоду из низового характера молодежных движений, мы попытались предоставив Голубым рубашкам место в иерархии Вафд, представив участникам униформу, значки и стандартизированный салют. На этот раз мы сделаем все по-другому и превратим их в правильную молодежную организацию."
 EGY_fate_of_farouk: "Судьба бывшего короля"
 EGY_fate_of_farouk_desc: "Мы не проверяли короля некоторое время. Мы должны увидеть, что с ним сейчас происходит."
 EGY_oppose_red_menace: "«Лучше быть мертвым, чем красным!»"
 EGY_oppose_red_menace_desc: "Коммунисты на востоке не лучше империалистов на западе. Красные стремятся свергнуть наше новое либеральное правительство; они должны быть убраны, если мы хотим, чтобы демократия и свобода выжили."
 EGY_limit_israels_influence: "Ограничить влияние Израиля"
 EGY_limit_israels_influence_desc: "Как оспа, сионистские влияния должны быть ограничены и не должны распространяться. Доктор Египет знает лучше."
 EGY_a_new_party: "Новая партия Вафд"
 EGY_a_new_party_desc: "Мы наконец избавились от нашей дурной репутации сотрудничества с монархией и Британией, и наша либеральная политика доказала нашу приверженность делу улучшения положения людей. Старая партия мертва, а новая партия Вафд стала ведущим голосом в Египте."
 EGY_oppose_the_british: "Противостоять британцам"
 EGY_oppose_the_british_desc: "Несмотря на нашу предыдущую готовность сотрудничать с британцами во времена монархии, это было сделано только для того, чтобы мы могли позволить потребности того времени. Теперь, когда монархия ушла, мы можем занять более жесткую позицию по отношению к британцам и доказать свою лояльность нации и народу Египта."
 fawzia_faud: "Фавзия Фуад"
 UAR_Establishment_Of_The_UAR: "Создание объединённой арабской республики"
 UAR_Disband_the_Syrian_Parliament: "Распустить сирийский парламент"
 UAR_Allow_the_Syrian_Baathist_Party: "Разрешить деятельность сирийской баасистской партии"
 UAR_Ban_all_Syrian_Parties: "Запретить все сирийские партии"
 UAR_Form_a_new_National_Assembly: "Сформировать Национальное собрание"
 UAR_Form_The_Syrian_Tripartite_Comitee: "Сформировать сирийский трехсторонний комитет"
 UAR_Prevent_Syrian_Officials_from_Getting_Power: "Отстранить сирийских чиновников от получения власти"
 UAR_Neutralize_Important_Syrian_Opposition_Figure: "Нейтрализовать важную фигуру сирийской оппозиции"
 UAR_Start_Implementing_the_Egyptian_Land_Reform_In_Syria: "Начало осуществления египетской земельной реформы в Сирии"
 UAR_Restrict_Syrian_Communist_Influence: "Ограничить сирийское коммунистическое влияние"
 UAR_Delegate_Egyptians_to_Administrate_Syria: "Египетский делегат для управления Сирией"
 UAR_Block_Saudi_Bedouin_Funding: "Запрет Саудовско-Бедуинского финансирования"
 UAR_An_United_Arab_Republic: "\"Объединенная\" Арабская Республика"
 soviet_technical_advisors_PRC: "Советские технические консультанты"
 peoples_democracy: "Народная демократия"
 EGY_free_press: "Свободная пресса"
 EGY_free_press_desc: "Пресса всегда была враждебна правительствам во всем мире, но, тем не менее, пресса является важным институтом для выживания демократических принципов. Мы должны гарантировать свободу прессы, даже если это означает, что некоторые люди настроятся против нас."
 EGY_educate_the_masses: "Программа обучения грамоте"
 EGY_educate_the_masses_desc: "По мнению ООН, образование - это право человека. Народ Египта долгое время страдал от отсутствия школьного образования и неграмотности. Монарх предложил новую программу бюджета образования, чтобы гарантировать всем гражданам Королевства доступ к образованию, и первым шагом к этой цели является повышение грамотности."
 EGY_emplyment_opportunities: "Программа поддержки малого бизнеса"
 EGY_emplyment_opportunities_desc: "Экономический бум, начавшийся при бывшем короле Фаруке, привел к печальным последствиям: многие малые предприятия остались позади и уступили место крупным корпорациям. Мы должны начать программу займов под низкие проценты и инвестиций в малые предприятия, чтобы они могли конкурировать."
 EGY_rural_development: "Развитие сельских районов"
 EGY_rural_development_desc: "Большая часть нашей страны и сельского хозяйства зависит от реки Нил и нескольких источников воды в пустыне. Для того, чтобы в полной мере извлечь выгоду из этих сельских регионов, им необходимы инвестиции для расширения и развития в соответствии с современными стандартами."
 EGY_root_out_corruption: "Искоренение коррупции"
 EGY_root_out_corruption_desc: "Бывший король Фарук был хорошо известен тем, что во время своего правления укомплектовал политические офисы своими друзьями и подхалимами и позволил коррупции процветать. Если мы хотим создать прозрачное и ответственное правительство, с этим нужно разобраться."
 EGY_direct_rule_from_cairo: "Прямое управление из Каира"
 EGY_direct_rule_from_cairo_desc: "Судан всегда был законной египетской территорией под британской оккупацией. Поскольку переговоры о будущем статусе региона начинают разворачиваться в нашу пользу, мы должны добиваться полной интегрирации в королевскую провинциальную систему."
 EGY_defend_against_others: "Защитить нашу землю"
 EGY_defend_against_others_desc: "Египет - единственный бастион истинного социализма в арабском мире и он окружен врагами. Необходимо начать строительство оборонительных сооружений и укреплений, чтобы удержать империалистические державы от вторжения."
 rulc_egy_tt: "Разблокирует фокус аннексии Судана."
 EGY_stable_for_now: "На данный момент стабильны"
 EGY_stable_for_now_desc: "Благодаря мудрым реформам, проведенным Фаруком, люди стали намного счастливее, а их жизнь значительно улучшилась. Призывов к свержению правительства стало меньше, недовольные рабочие больше не ворчат в рабочее время, а угрозы расправой перестали появляться в почте!"
 EGY_more_democratic_nation: "Наконец-то демократия"
 EGY_more_democratic_nation_desc: "В то время как монархия должна оставаться важным институтом в управлении и единстве страны, коррупция и злоупотребления короля Фарука во время его абсолютного правления показали глупость предоставления абсолютной власти одному человеку. При новом монархе теперь правит действительно конституционное и демократическое правительство, и Египет действительно может называть себя маяком свободы в арабском мире."
 EGY_spread_to_libya: "Поддержка ливийских коммунистов"
 EGY_spread_to_libya_desc: "Наши товарищи в Ливии остаются под деспотическим правлением монархии Сенусси. Мы должны оказать помощь ливийскому народу в его освобождении."
 EGY_support_israel_communists: "Поддержка израильских коммунистов"
 EGY_support_israel_communists_desc: "Несмотря на нашу историческую неприязнь к Израилю, мы не ненавидим израильский народ. Наш великий лидер понимает, что израильский народ по-прежнему является нашими братьями и сестрами и что они сбиты с толку капиталистической ложью и пропагандой. Если мы хотим излечить ненависть между нами, мы должны поддержать израильский народ в создании социалистического государства."
 EGY_arab_socialism: "Социализм с арабскими чертами"
 EGY_arab_socialism_desc: "Арабский народ не подходит для социализма советского стиля. Мы должны прокладывать свой собственный путь в условиях нового арабского социализма, который будет работать на нас."
 EGY_red_officers: "Советское военное руководство"
 EGY_red_officers_desc: "Наши офицеры еще молоды и неопытны, мы должны попросить советских офицеров проконсультировать нас в случае войны."
 EGY_replace_old_officials: "Заменить коррумпированных политиков"
 EGY_replace_old_officials_desc: "Коррумпированные члены политической элиты доказали, что они - часть проблемы, а не решение. Их замена необходима, чтобы очистить нашу политику от коррупции."
 EGY_better_relations_with_israel: "Улучшить отношения с Израилем"
 EGY_better_relations_with_israel_desc: "Новый король - это новое направление нашей внешней политики. Мы можем начать с изменений, улучшив двусторонние отношения с Израилем."
 EGY_closen_with_usa: "Более тесные связи с США"
 EGY_closen_with_usa_desc: "Близость с Соединенными Штатами, безусловно, позволит им защитить себя от коммунизма и доказать, что мы являемся ценным союзником."
 EGY_finalize_corruption_reforms: "Завершить антикоррупционные реформы"
 EGY_finalize_corruption_reforms_desc: "Наши реформы по борьбе с коррупцией подходят к концу. Отсюда новый Египет для людей проложит путь."