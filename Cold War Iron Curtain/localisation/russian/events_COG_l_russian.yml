l_english:
 congo_mutiny.1.d: "Хотя Конго официально провозгласило независимость от Бельгии 30 июня 1960 года, повседневная жизнь бывшей колонии осталась в основном прежней, и многие ее колониальные институты все еще функционируют. Один из них, Force Publique, был в центре значительной негативной реакции в Конго. Хотя Бельгия официально вышла из состава колонии, многие высокопоставленные чиновники в Вооруженных силах остались бельгийцами, к большому огорчению чернокожих членов вооруженных сил. Эта напряженность достигла апогея сегодня, когда несколько полностью черных подразделений взбунтовались против своих бельгийских офицеров в ответ на заявление главнокомандующего Эмиля Янсена о том, что ситуация после обретения независимости не изменится по сравнению с прежней. Эти подразделения продвинулись на несколько миль через конголезскую сельскую местность, взяв в заложники многих бельгийцев и набрав еще больше солдат. Хотя Янссен пытался организовать войска для подавления мятежников, новое правительство выступило за переговоры, которые привели к преобразованию Вооруженных сил в Национальную конголезскую армию, а также изгнанию бельгийских офицеров."
 mobutu_cos.1.d: "\n\nMobutu, конголезский гарнизонный офицер, назначается сегодня начальником штаба конголезского колониального гарнизона. В попытке африканизировать руководство гарнизона, чтобы ослабить напряженность в отношениях с солдатами, полковник Мобуту был назначен начальником штаба. Его назначение было широко принято министрами, ответственными за это назначение, поскольку другому кандидату Морису Мполо не доверяют. Опасаясь, что Морис может совершить государственный переворот, потому что он имел влияние на восставших солдат, Мобуту был доверен этот пост вместо него."
 lumumba_deposed.1.d: "Лумумба, первый премьер-министр Конго, был свергнут после нескольких месяцев пребывания у власти. Инакомыслие и недовольство распространялись в Конго уже некоторое время, и мятежи только усиливались.\нМобуту Шестой Секо, начальник штаба конголезских вооруженных сил, при поддержке США и Бельгии только что арестовал первого премьер-министра. В настоящее время Лумумбу везут в Порт-Франки на юге Конго."
 un_congo.1.d: "Через несколько дней после конголезского мятежа бельгийские войска вторглись в Конго в попытке восстановить порядок из-за того, что сепаратистские силы Тшомбе становятся все сильнее. Это привело к тому, что первый премьер-министр Лумумба призвал к вмешательству ООН для урегулирования ситуации. Лумумба заявляет, что вторжение бельгийских войск в Конго является актом необоснованной агрессии и попыткой восстановить колониальный контроль Бельгии над Конго. Кроме того, он неоднократно обращался к силам ООН с просьбой подчинить повстанческое правительство во главе с Тшомбе.Ожидается, что ООН ответит в течение нескольких дней."
 un_congo.2.d: "Конголезское правительство на встрече по вопросам безопасности с другими членами Совета по поводу постколониальной ситуации в Конго заявляет, что ООН некомпетентна. Расстроенный неспособностью сил безопасности ООН обеспечить порядок или изгнать бельгийские войска из этого района, Лумумба выразил протест, заявив, что ООН неспособна разрешить ситуацию. В ответ ООН заявила, что будет настоятельно призывать бельгийцев к скорейшему выводу своих войск из Конго."
 congo_un.20.d: "По мере того как проходят месяцы без четкой резолюции, конголезское правительство обвиняет ООН в том, что она встала на сторону Тшомбе и иностранных горнодобывающих компаний. Сегодня конголезское правительство требует, чтобы силы ООН покинули страну и прекратили вмешиваться в ее дела.\Эти требования вытекают из многомесячных разногласий между конголезским правительством и Организацией Объединенных Наций по поводу миротворческого мандата, в частности по вопросу о Катанге. ООН категорически отказалась отвоевать Катангу, заявив, что это внутреннее дело и им запрещено вмешиваться в силу статьи 2 Устава ООН.\В настоящее время Конго обращается к великой силе, к Советскому Союзу, с просьбой о немедленной помощи в области безопасности, чтобы справиться с этой ситуацией."
 un_congo.3.d: "Конголезское правительство выдвинуло ультиматум ООН о немедленном выводе своих сил. Разъяренное ростом сил ООН в Конго и отказом войск ООН подавить движение за отделение Катанги, Конго выдвинуло окончательный ультиматум ООН о немедленном выводе войск. Если это требование не будет удовлетворено, Конго получит огромную энергию, которая связывает помощь и организует нападение на сепаратистскую провинцию Катанга."
 belgium_congo.1.d: "Разъяренное вторжением Бельгии в Конго и недовольное тем, что они находятся там для защиты бельгийских граждан, конголезское правительство требует, чтобы Бельгия немедленно вывела свои войска из Конго.Напряженность продолжала расти по мере того, как Бельгия увеличивала численность своих местных гарнизонов в регионе. Конголезское правительство опасается, что они могут восстановить колониальное правление или принудить конголезское правительство.Бельгийское правительство в ответ вновь заявило о своей цели и заявило, что они уйдут, как только смогут обеспечить безопасность или будут заменены гарнизоном ООН, который сможет сделать то же самое."
 lumumba_death.1.d: "Хотя казнь звучит как чистое слово, смерть бывшего премьер-министра Конго Патриса Лумумбы-это совсем не так. В течение декабря 1960-го и января 1961 года Лумумба был отправлен в ад, недоедал и \"жил в абсолютно невозможных условиях\" в лагере Харди, пока солдаты даже не отказались работать. В конце концов его задержали и доставили в Элизабетвиль, где его избивали и пытали как катангские, так и бельгийские офицеры, пока он и еще двое не были расстреляны 17 января 1961 года в присутствии бельгийских офицеров. Чтобы избавиться от трупов, палачи казнили и уваривали трупы в серной кислоте, затем дробили и разбрасывали кости. Хотя правительство Катангана официально поддерживает их трехнедельный запоздалый доклад о том, что он был убит разгневанными сельскими жителями, люди от Белграда до Нью-Йорка подняли руки над этим трагическим и тираническим проявлением."
 mobutu.2.d: "Суверенная гвардия Лумумбы\" предотвратила переворот и убила Мобуту. Опасаясь попытки переворота, Лумумба тайно собрал подразделение спецназа секретной службы, известное как Суверенная гвардия Конго. В состав SGC входили лучшие военнослужащие конголезских вооруженных сил, прошедшие подготовку в Советском Союзе. Лумумба поручил гвардии защищать его и быть готовой нанести удар по Мобуту, если потребуется.\nВ день, когда Мобуту начал свой переворот, SGC получила конфиденциальную записку о нападении и подготовила засаду. По пути следования силы Мобуту попали в засаду и были настигнуты силами КЗВ, вооруженными модифицированными советскими огнеметами. Под прикрытием дыма КЗВ удалось затушить силы Мобуту огнем. Никто из членов КЗВ не был убит, а Мобуту погиб в пламени вместе со своими ближайшими сторонниками.\nЛумумба объявил чрезвычайное положение и организовал силы для изгнания незаконных иностранных корпораций и врагов Конго. Контратака принесла огромные политические выгоды и привлекла патриотически настроенных новобранцев и региональных наемников, слишком напуганных, чтобы работать на врагов Лумумбы."
 mobutu.3.d: "ONUC в настоящее время расправляется со всеми подразделениями наемников в Конго.. ООН выпустила резолюцию, призывающую к полному выводу всех бельгийских и катаганских наемников из Конго. ОНУК получил мандат на то, чтобы ле Верье расследовал деятельность иностранных наемников везде, где они с ними сталкиваются.ООН опубликовала заявление по этому вопросу, в котором говорится, что наемнические подразделения представляют угрозу стабильности и миру в Конго. Это удивило многих, потому что первоначальный мандат ОНУК не позволял им принимать чью-либо сторону, и это действие прямо противоречит этому мандату. Вряд ли такая акция не встретит сопротивления и, скорее всего, столкнется с конфликтом в ближайшем будущем."
 zaire.1.d: "Во время кризиса в Конго, с 1960 по 1965 год, вновь образованная Республика Конго была вовлечена в постоянные локальные конфликты с поддерживаемыми Бельгией сепаратистскими движениями и конкурирующими правительствами. После выборов 1965 года полковник Мобуту совершил бескровный переворот и взял под свой контроль страну. Несмотря на обещание восстановить демократию, он распустил парламент и отменил должность премьер-министра, а в 1967 году основал МНР, которая была единственной легальной партией в стране. Начав кампанию за подлинность, Мобуту переименовал многие конголезские города, чтобы искоренить их колониальное наследие, и пропагандировал проафриканское культурное отношение. Иностранные активы также были национализированы, и Мобуту укрепил свое правление, сформировав высоко централизованное и жестко регулируемое правительство, с ним в качестве бесспорного диктатора. Его усилия увенчались успехом, поскольку он официально переименовал Республику Конго в Республику Заир. Хотя это в значительной степени символический шаг, он представляет собой полный контроль Мобуту над Конго и его презрение к их колониальному наследию, а также провал еще одной африканской демократии."
 tshombe.1.d: "Руководство Тшомбе достигло седьмого года и встречается с большим праздником на улицах. Уже сейчас в Конго наблюдается массовый приток инвесторов из зарубежных стран, а правительственное Бюро труда заверяет всех, что условия труда здесь самые лучшие в мире. Тшомбе также с гордостью сообщает, что по всей стране работают реабилитационные центры, которые занимаются перевоспитанием людей, выступающих против государства Конго. Как видно на этих фотогеничных снимках, народ государства Конго очень счастлив быть под благосклонным правлением Тшомбе.\n Однако, не все довольны правлением нашего славного лидера, и многие независимые репортеры ошибочно заявляют о \"нарушении прав человека\" и \"угнетении\". Сеть вещателей государства Конго опровергла эти заявления, предоставив доказательства того, что в Конго все хорошо и счастливо. К сожалению, многие из этих репортеров совершили весьма изощренные самоубийства после того, как их абсурдные заявления были опровергнуты."
 mobutu_execution.1.d: "Мобуту, который был захвачен войсками Тшомбе, был приговорен к смертной казни после быстрого суда. Мобуту был признан виновным в заговоре против конголезского народа, желая хаоса и власти выше порядка и гармонии, и будучи совершенно неумелым. Тшомбе представил много важных свидетельств, таких как неудачи Мобуту на посту начальника штаба и попытка Мобуту убить конголезское правительство без плана его замены. Кроме того, Tshombe представила доказательства, которые не будут обнародованы из-за своей графической природы. Такие доказательства разоблачали любовь Мобуту бить детей, а затем продавать наркотики тем же самым детям, чтобы облегчить боль от того, что он бьет их, а затем бьет снова. Такое шокирующее и жестокое поведение годится только для худшего из наказаний. Однако в порыве милосердия Тшомбе приговорил Мобуту к милосердной смерти от рук аллигатора."
 mobutu.10.d: "С восстановлением контроля над страной казалось, что кризис в Конго закончился. Со времени своего первого переворота в 1960 году полковник Мобуту Шестой Секо укреплял свою власть, гарантируя лояльность местных дивизий и отправляя тех, чья лояльность вызывала сомнения, в отдаленные гарнизоны. После операции \"Дракон-разбойник\" премьер-министр центра замка Тшомбе потерял благосклонность как к президенту Каса-Вубу, так и к Мобуту, что вызвало политический кризис на предстоящих выборах 1965 года. В то время как Тшомбе получил большинство, Каса-Вубу воспользовался дезертирством значительной части своей партии, чтобы назначить Эвариста Кимбу на пост премьер-министра. Парламент отклонил этот шаг президента, что привело к тому, что политический гном там фактически парализовал конголезское правительство. 25 ноября Мобуту сломил гнома, захватив власть в бескровном государственном перевороте. Мобуту объявил чрезвычайное положение, предоставив ему неограниченную власть на 5 лет. После этого он обещал восстановить демократию, но при значительной внутренней и внешней поддержке и диктаторской власти остается неясным, захочет ли он отказаться от своей власти."