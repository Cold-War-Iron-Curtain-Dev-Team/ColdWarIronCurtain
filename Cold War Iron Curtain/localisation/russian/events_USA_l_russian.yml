 Shanghai_Communique.1.t: "Через Тихий океан"
 Shanghai_Communique.1.d: "Хотя с момента окончания Гражданской войны в Китае у нас было ограниченное дружеское взаимодействие с [PRC.GetNameDef], наши лучшие дипломаты смогли открыть дипломатические каналы для [PRC.GetNameDef] через [PAK.GetNameDef]. Большинство президентов придерживаются сильной антикоммунистической позиции со времени начала Варшавского договора Сталина, и даже еще во время Гражданской войны в России, но это беспрецедентная возможность проложить дорогу отношениям с [PRC.GetLeader], что позволит нам сосредоточиться на других наших врагах."
 Shanghai_Communique.2.t: "Через Тихий океан"
 Shanghai_Communique.2.d: "[USA.GetNameDef] предложил дипломатическую миссию в нашу скромную страну, возглавляемую никем иным, как президентом [USA.GetPresident]! Это может иметь большое значение для дипломатии между нашими противостоящими нациями, а также для нашего статуса на международном уровне! Однако мы также можем воспользоваться этой возможностью, чтобы отказать этим капиталистам."
 Shanghai_Communique.3.t: "Через Тихий океан - Китай согласен!"
 Shanghai_Communique.3.d: "Хотя в прошлом у наших стран были свои разногласия, [PRC.GetLeader] согласился на нашу миссию в их страны! Уже готовятся планы президента [USA.GetLeader] для посещения Шанхая и встречи с председателем."
 Shanghai_Communique.4.t: "Через Тихий океан - Китай отказался!"
 Shanghai_Communique.4.d: "Председатель [PRC.GetLeader] однозначно отклонил нашу просьбу о дипломатической миссии! Кажется, что наши прошлые различия были слишком велики, чтобы их выдержать."
 Shanghai_Communique.5.t: "Американец в Шанхае"
 Shanghai_Communique.5.d: "После краткого пополнения топлива на Гавайях и Гуаме президент [USA.GetLeader] приземлился в Шанхае! Президент встретился с военным почетным караулом и небольшой толпой в серый зимний день. Хотя мало что ожидалось, встреча с президентом была намеком на разочарование в связи с отсутствием «тысяч людей в ликующих толпах» после десятилетий враждебной дипломатии."
 Shanghai_Communique.6.t: "[GetNewspaperHeader]Американец в Шанхае"
 Shanghai_Communique.6.d: "После десятилетий враждебной дипломатии [USA.GetNameDef] и [PRC.GetNameDef] начали длительный процесс примирения. Президент [USA.GetLeader] приземлился в Шанхае в рамках недельной дипломатической миссии с целью нормализации их отношений и обсуждения проблем между их народами. Мир затаив дыхание наблюдает, как эти политические гиганты садятся за стол переговоров"
 Shanghai_Communique.7.t: "Встреча с Президентом"
 Shanghai_Communique.7.d: "Президент [USA.GetLeader] приближается к Пекину в рамках своей поездки в нашу скромную страну. Хотя мы можем сохранять эту дружелюбность и аполитичность, частью условий визита было обсуждение дипломатических отношений между нашими суверенными нациями."
 Shanghai_Communique.8.t: "Встреча с председателем"
 Shanghai_Communique.8.d: "После недели путешествия на север от Шанхая вдоль китайского побережья президент [USA.GetLeader] наконец прибыл в Пекин. Почти сразу после прибытия американского президента председатель [PRC.GetLeader] вызвал его на короткую встречу в отеле Цзиньцзяня. После их встречи Председатель скромно сказал Президенту: «Я думаю, что наш старый друг, [ROC.GetLeader], не одобрит это». Хотя эта встреча была короткой, ее важность в продвижении дипломатии между западными демократиями и восточными коммунистическими государствами несомненна. В рамках этой встречи эти мировые лидеры предприняли дальнейшие попытки нормализовать отношения. Обсуждаемые темы включали соглашение об избежании гегемонии в Азиатско-Тихоокеанском регионе, а также признание политики единого Китая."
 Shanghai_Communique.9.t: "Встреча с президентом - США не согласны"
 Shanghai_Communique.9.d: "Президент [USA.GetLeader] согласился с нашими условиями, согласившись избегать гегемонии и признавая наше правительство истинным правительством Китая!"
 Shanghai_Communique.10.t: "Встреча с президентом - США согласны"
 Shanghai_Communique.10.d: "Президент [USA.GetLeader] согласился с некоторыми нашими условиями. Президент согласился избежать гегемонии в регионе, но отказывается признать наше правительство истинным правительством Китая."
 Shanghai_Communique.11.t: "Встреча с президентом - США против"
 Shanghai_Communique.11.d: "Президент [USA.GetLeader] казался потрясенным, а затем рассерженным, услышав наши условия. Президент отверг любые шансы на примирение между нашими двумя странами, заявив, что они никогда не откажутся от [ROC.GetNameDef], особенно по просьбе иностранного государства."
 Shanghai_Communique.12.t: "Шанхайское коммюнике"
 Shanghai_Communique.12.d: "В рамках продолжающегося визита в [PRC.GetNameDef] [USA.GetLeader] встретился с [PRC.GetLeader], чтобы сгладить дипломатический конфликт и обеспечить мир между двумя странами. Это привело к подписанному коммюнике о мире и взаимопонимании двух лидеров. Они заявили в этом совместном заявлении, что не будет никакой борьбы за гегемонию между народами, и что [USA.GetNameDef] признает политику единого Китая - фактически это означает, что она больше не признает нацию [ROC.GetNameDef]. Это переломный момент в отношениях между Западом и Востоком."
 Shanghai_Communique.13.t: "Шанхайское коммюнике"
 Shanghai_Communique.13.d: "В рамках продолжающегося визита в [PRC.GetNameDef] [USA.GetLeader] встретился с [PRC.GetLeader], чтобы сгладить дипломатический конфликт и обеспечить мир между двумя странами. Хотя на переговорах были некоторые проблемы, две страны выпустили подписанное коммюнике, в котором говорится, что между двумя странами в Тихом океане не будет борьбы за гегемонию."
 Shanghai_Communique.14.t: "Шанхайское коммюнике"
 Shanghai_Communique.14.d: "В рамках продолжающегося визита в [PRC.GetNameDef] [USA.GetLeader] встретился с [PRC.GetLeader], чтобы сгладить дипломатический конфликт и обеспечить мир между двумя странами. Тем не менее, переговоры пошли в тар тарары, когда президент упомянул беспокойство по поводу признания политики «Единого Китая», которая признает претензии [PRC.GetNameDef] на [ROC.GetNameDef]. Расстроенный этой новостью, [PRC.GetLeader] закончил переговоры в гневе, заявив, что это само по себе является вызовом их суверенитету и гегемонии в Тихом океане, и что отказ признать их единственным Китаем был отказом признать свою нацию. Визит [USA.GetLeader] будет продолжен, но атмосфера напряжения заменила некогда веселый тон."
 Shanghai_Communique.15.t: "Великий переговорщик"
 Shanghai_Communique.15.d: "Президент [USA.GetLeader] вернулся в [USA.GetNameDef] после того, что было объявлено триумфом дипломатии газетами в демократическом мире. Поскольку президент [USA.GetLeader] начал устранять колоссальный раскол в дипломатии двух стран, мы можем только смотреть на соглашения между нашими двумя великими нациями."
 Shanghai_Communique.16.t: "Наконец радушие"
 Shanghai_Communique.16.d: "Президент [USA.GetLeader] вернулся в [USA.GetNameDef] после того, что многие считают первым шагом в правильном направлении к восстановлению отношений с [PRC.GetNameDef]. Несмотря на то, что нам предстоит долгий путь, мы можем наконец перестать беспокоиться об угрозе [PRC.GetNameDef]."
 Shanghai_Communique.17.t: "Неудачи в дипломатии"
 Shanghai_Communique.17.d: "Возвращение президента [USA.GetLeader] в [USA.GetNameDef] было мрачным. Хотя президент отправился в [PRC.GetNameDef] с целью восстановления отношений, он вернулся с пустыми руками после того, как оспорил условия [PRC.GetLeader]. Наши отношения сейчас как никогда враждебны."
 Department_of_Energy.1.d: "Федеральное правительство недавно одобрило создание Министерства энергетики. Это будет позиция Кабинета министров, и она направлена на консолидацию различных энергетических программ в рамках федерального правительства с оборонными обязанностями, связанными с ядерной программой. В течение многих лет энергетическая политика, особенно научные исследования, была затруднена отсутствием фокуса из-за различных вовлеченных программ и агентств. Что еще более важно, ядерная программа также была несогласованной, особенно в плане проектирования, производства и исследований. С Министерством энергетики все эти программы и политика будут скоординированы, и правительство ожидает значительного улучшения того, насколько эффективно Соединенные Штаты смогут разрабатывать новые энергетические технологии и внедрять их по всей стране."
 Abolish_JCNAE.1.d: "Объединенный комитет Конгресса США по атомной энергии был официально упразднен. В период своего расцвета комитет обладал юрисдикцией в отношении всех законопроектов и постановлений, касающихся военных и гражданских аспектов ядерной энергетики. Она также обладала уникальным законодательным правом вето, которое позволяло ей голосовать при принятии исполнительных решений по ядерной политике. Действительно, он считался одним из самых влиятельных комитетов Конгресса в Американской истории. Однако в последние годы его юрисдикция и надзор значительно сократились из-за того, что другие комитеты Сената и конгресса взяли на себя надзор за гражданской ядерной энергией. Кроме того, агентство по охране окружающей среды и создание комиссии по ядерному регулированию также сделали комитет все более избыточным. С учетом этих факторов комитет был официально упразднен сегодня, что многие считают победой исполнительной власти и ее усилиями по консолидации ядерной политики в исполнительной власти."
 Ford.5.d: "Президент Джеральд Форд объявил сегодня Нельсона Рокфеллера, бывшего губернатора Нью-Йорка, своим кандидатом на пост вице-президента. Решение выбрать Рокфеллера вызвало немедленную негативную реакцию среди консервативных республиканцев, которые считали, что президент Форд предал ценности партии, выбрав либерального республиканца. Действительно, слушания по утверждению в Конгрессе, как ожидается, будут изнурительными, поскольку даже консервативные демократы, как ожидается, будут задавать жесткие вопросы. Однако его подтверждение, как ожидается, будет достигнуто в конце концов. Сделав свое заявление, президент Форд указал на управленческий опыт Рокфеллера и его послужной список успешного осуществления политики. Наблюдатели отмечают, что Рокфеллер может оказаться главным электоральным активом Форда на следующих президентских выборах. Рокфеллер может привлечь поддержку со стороны общин, традиционно выступающих против консервативных республиканцев, и его включение в качестве вице-президента расширит привлекательность Форда."
 Ford.6.d: "Президент Джеральд Форд сегодня объявил перед Конгрессом, что самой большой угрозой для страны является инфляция. Он объявил о начале новой кампании под названием Whip Inflation Now (WIN) как добровольное движение для американских граждан, чтобы собраться вместе и бороться с инфляцией дома в координации с его общественными мерами по контролю инфляции. Президент Форд заявил, что он также будет приветствовать письма от американцев с предложениями по контролю над расходами на родине. Позже Белый дом объявил, что те, кто участвует в WIN, должны носить булавки и рубашки с надписью WIN, чтобы показать солидарность. Кроме того, эта программа соответствует убеждению, что именно частные граждане работают с правительством, чтобы решить нынешний инфляционный кризис, а не более крупное правительство. Первоначальная реакция на победу была одной из насмешек многих американцев, и противники президента манипулируют логотипом, чтобы превратить его в критику президента."
 Ford.7.d: "В обращении к нации по национальному телевидению новоназначенный президент Джеральд Форд объявил о помиловании бывшего президента Ричарда Никсона. Президент Форд заявил, что Соединенным Штатам необходимо двигаться дальше и исцелиться от недавних противоречий, и единственный способ положить этому конец-это президентское помилование. Бывший президент Никсон подал в отставку из-за Уотергейтского скандала и недавнего выпуска компрометирующих Белый дом записей. Решение о помиловании президента Никсона было встречено не очень хорошо. Противники обвиняют Форда в сговоре с Никсоном, чтобы возвыситься до президента, в то время как другие предполагают, что Никсон должен был столкнуться с последствиями своих действий. Политические обозреватели отмечают, что это решение ударит по репутации президента Форда как честного брокера. Однако сторонники президента настаивают, что его решение было не результатом политической сделки, а морально правильным поступком, и он примет политическую реакцию, чтобы исцелить нацию."
 Albert.1.d: "Президент Карл Альберт объявил, что он подтвердит назначение Джеральда Форда своим вице-президентом. Решение оставить республиканского вице-президента рассматривается как примирительный акт, учитывая чрезвычайные обстоятельства, которые привели к вступлению президента Альберта в должность. Джеральд Форд считается умеренным республиканцем с сильным моральным характером, который уважают как демократы, так и республиканцы. Президент Альберт заявил, что он надеется на тесное сотрудничество с вице-президентом Фордом. Хотя пресса в основном поддерживала решение президента Альберта, среди демократов были недовольные, которые опасались, что вице-президент Форд, близкий друг бывшего президента Ричарда Никсона, может использовать свое положение, чтобы подорвать судебное разбирательство против него."
 Albert.2.d: "Суд над бывшим президентом Ричардом Никсоном завершился его осуждением. Находясь на своем посту, бывший президент Никсон возглавил заговор с целью проникнуть в офис Демократической партии в Уотергейте и впоследствии помогал в прикрытии. Президент Карл Альберт, который в качестве спикера Палаты представителей помогал продвигать расследование Конгресса, приветствовал решение суда. Он утверждал, что ни один человек не стоит выше закона и все люди ответственны за его действия. Президент Альберт отметил, что после завершения судебного процесса он надеется, что нация сможет наконец исцелиться и перейти к более светлому будущему и более прозрачному правительству. Многие американцы, даже сторонники бывшего президента, согласны с этим мнением об ответственности."
 Agnew.1.d: "Президент Спиро Агню объявил о назначении Джорджа Ромни вице-президентом Соединенных Штатов. Ромни когда-то был сильным кандидатом в президенты и рассматривался как политический соперник Никсона, хотя и присоединился к его первой администрации. Будучи губернатором, Ромни смог заручиться поддержкой в штате Мичиган, и его обращение к рабочим семьям рассматривается многими в Республиканской партии как актив для следующих президентских выборов. Вице-президент Ромни также был весьма искусен в работе через проход с демократами, которые президент Спиро также видит в качестве основного актива, когда он пытается реализовать политику в Конгрессе. Хотя это и не выбор более консервативных республиканцев, многие по всей стране выразили удовлетворение новым вице-президентом."
 Agnew.2.d: "В Национальном телеобращении к нации недавно вступивший в должность президент Спиро Агню объявил, что прощает бывшего президента Ричарда Никсона. Президент Агню заявил, что Соединенным Штатам необходимо двигаться дальше и исцелиться от недавних противоречий, и единственный способ положить этому конец-это президентское помилование. Бывший президент Никсон подал в отставку из-за Уотергейтского скандала и недавнего выпуска компрометирующих Белый дом записей. Решение о помиловании президента Никсона было встречено не очень хорошо. Противники обвиняют Агню в сговоре с Никсоном, чтобы возвыситься до президента, в то время как другие предполагают, что Никсон должен был столкнуться с последствиями своих действий. Политические обозреватели отмечают, что репутация президента Агню пострадает из-за его тесных отношений с Никсоном. Однако сторонники президента настаивают, что его решение было не результатом политической сделки, а морально правильным поступком, и он примет политическую реакцию, чтобы исцелить нацию."
 Amnesty.1.d: "Соединенные Штаты объявили программу амнистии для тех, кто избежал призыва в Вооруженные силы. Во время недавнего конфликта многие американцы предпочли бежать из Соединенных Штатов или скрываться, чтобы избежать обязательной военной службы. Многие из тех, кто уклонялся от призыва или дезертировал, утверждали, что делают это из моральных убеждений или из убеждения, что они не могут поддерживать военные действия. Новая программа даст возможность тем, кто избежал проекта амнистии, если они попросят об этом правительство. Эта политика рассматривается как компромисс. Хотя уклонисты от призыва не будут наказаны напрямую, но, запросив амнистию, они все равно признают свою вину. Новая политика, несомненно, является компромиссом, но правительство считает необходимым решить проблему уклонистов от призыва и вернуть этих людей в их семьи."
 ERA.5.d: "\nХотя поправка о равных правах (ПРП) была первоначально предложена в конце 1920-х годов, она была окончательно ратифицирована в Конституции Соединенных Штатов Америки. ПРП устраняет любые юридические различия между мужчинами и женщинами, особенно в отношении развода, собственности и занятости. Сторонники законопроекта теперь утверждают, что американские женщины, наконец, будут пользоваться всеми законными правами мужчин и больше не будут гражданами второго сорта. Тем не менее, ряд женщин среднего класса выступают против ПРП, поскольку она подрывает традиционные гендерные роли, угрожает правам матерей в случаях развода и открывает двери для женщин, призванных на военную службу. Они назвали ПРП пародией и проводят кампанию за то, чтобы государства выступили против ратификации поправки в своих законодательных органах. Независимо от этой оппозиции, ПРП была успешно пройдена, и, как говорят, большое количество сторонников радостно приветствуют новости по всей стране."
 USA_Marijuana.1.d: "Соединенные Штаты официально одобрили декриминализацию марихуаны. Этот наркотик долгое время ассоциировался с контркультурой и был объектом интенсивных полицейских репрессий. Однако многие стали утверждать, что такой фокус отвлекает от расследования более серьезных преступлений или нацеливания на более вредные наркотики в Соединенных Штатах. Это было подкреплено недавними статьями, предполагающими, что влияние марихуаны не сильно отличается от курения табака или употребления алкоголя. Кроме того, многие штаты утверждали, что потенциальная прибыль, которую можно получить от налогов на марихуану, может принести правительству огромные неожиданные денежные поступления. Все эти аргументы работали на то, чтобы склонить правительство к декриминализации наркотиков, однако есть противники, которые утверждают, что это решение в конечном итоге повредит американскому народу, поскольку сторонники декриминализации преуменьшают негативные последствия, которые вызовет легализация."
 Clark_Amendment.1.d: "Насилие в Анголе привело к тому, что многие иностранные игроки включились в борьбу, поддерживая различные группировки, борющиеся за контроль. Соединенные Штаты также оказывают военную помощь антикоммунистическим группам на местах. Однако недавние сообщения и разоблачения, касающиеся случаев нарушений прав человека и массовых убийств гражданских лиц, побудили Конгресс действовать. Сенатор Дик Кларк принял поправку к закону О контроле за экспортом оружия под названием поправка Кларка, которая запрещает Соединенным Штатам оказывать помощь частным ангольским группам, участвующим в военных операциях. Поправка Кларка привела в ярость сторонников антикоммунизма, которые считают, что поддержка этих групп является жизненно важным американским интересом. Однако многие американцы также поддерживают этот закон и считают, что Соединенные Штаты не должны способствовать увековечиванию продолжающегося насилия в Анголе."
 ELS_COUP.1.d: "Правительство Сальвадора оказалось в значительной степени неэффективным в борьбе с экономическим неравенством и растущим влиянием крайне левых сил. Это привело к созданию коалиции между умеренными военными офицерами и гражданскими лицами, которые начали переворот с целью свержения правительства и привели к власти гражданско-военную хунту, известную как революционная правительственная хунта (РПХ). Хунта пользовалась поддержкой Соединенных Штатов, которые опасались коммунистического переворота. Хунта начала политику умеренных реформ, чтобы успокоить население и жестокие репрессии против того, что она идентифицирует как коммунистические левые. Однако растущее насилие и рост поддерживаемых правительством эскадронов смерти значительно ослабили программу реформ, и сопротивление, особенно в сельской местности, растет."
 ELS_COUP.2.d: "Эскалация насилия в Сальвадоре приняла более мрачный оборот, когда появились новости о том, что вооруженные боевики убили любимого архиепископа Оскара Ромеро, когда он заканчивал проповедь. Ни одна группировка не взяла на себя ответственность, но бесстыдное убийство откровенного правозащитника, священнослужителя и борца за бедных потрясло и возмутило многих в стране. Многие указывают пальцем либо на правящую революционную правительственную хунту, либо на отряд смерти, связанный с ней. Считается, что Ромеро был убит за его поддержку прав человека и недавние призывы к сальвадорским войскам не подчиняться приказам, нарушающим права человека. Правительство отрицает свою ответственность и говорит, что это трагическое последствие эскалации насилия с обеих сторон, и никто не может быть обвинен. Говорят, что Католическая Церковь требует полного международного расследования этого убийства."
 Ford.10.d: "Члены престижного Host Breakfast приглашали президента Форда выступить перед собравшимися после того, как губернатор Демократической Калифорнии отказался взять на себя обязательства по проведению этого мероприятия. Видя потенциал мобилизации сторонников в штате в преддверии предстоящих президентских выборов, президент Форд прибыл, чтобы выступить на мероприятии. Бывший член Семьи Мэнсона Линетт Фромм также прибыла на мероприятие, вооруженная пистолетом. Фромм недавно прочитал о том, как загрязнение угрожает уничтожить окружающую среду, особенно калифорнийские секвойи. Последовательница печально известного серийного убийцы решила, что убьет президента и покажет истеблишменту серьезность экологической проблемы. После этого события президент Форд пошел через парк к дому штата Калифорния, чтобы встретиться с ведущими политическими лидерами Калифорнии. Когда он приблизился, Фромм оказался в нескольких футах от президента Форда. Она подняла пистолет и направила его на президента..."
 Ford.11.d: "Когда Фромм нажала на спусковой крючок, раздался щелчок - оказалось, что убийца не успел зарядить пистолет. Агент Секретной службы Ларри Буэндорф повалил ее на землю, а она, как было замечено, смеялась над тем, что ей не удалось выполнить свою задачу. Президент Форд казался невозмутимым этим событием и продолжил свою дневную программу. Многие американцы аплодировали президенту за его храбрость перед лицом смерти. Сам президент заявил, что видел, как она подняла оружие, но не видел серьезной угрозы, особенно после того, как Фромм был задержана. Вернувшись в Белый дом, Форд был встречен своей ликующей семьей и, как говорят, взял небольшой отпуск. Ожидается, что Фромм предстанет перед судом за покушение на убийство. ФБР расследует, играл ли печально известный серийный убийца Чарли Мэнсон какую-либо роль в действиях своего бывшего ученика."
 Ford.12.d: "Когда Фромм нажал на курок, пуля попала президенту Джеральду Форду в грудь. Президент был срочно доставлен в местную больницу, так как Секретная служба взяла Фромма под стражу. Через несколько часов президент был объявлен мертвым. Известие об убийстве вызвало шоковую волну по всей стране и миру. Президент Форд долгое время пользовался репутацией честного и порядочного человека, и заявления о соболезнованиях уже начали поступать. Говорят, что толпы скорбящих ждут у Белого дома. На международном уровне многие страны также говорят, что они потрясены и не уверены в том, что ждет Соединенные Штаты в будущем. Вице-президент Рокфеллер был лично приведен к присяге в качестве нового президента, и нация ждет своего нового будущего."
 Allende.1.d: "Когда президент Сальвадор Альенде пришел к власти в Чили, его режим объявил о начале нового социалистического эксперимента для Южной Америки. С момента прихода к власти он столкнулся с критикой Верховного суда и резолюцией Конгресса, призывающей военных действовать. Президент Альенде отметил, что эти усилия были недемократическими попытками устранить Демократический выбор народа. Многие в стране подозревают, что эти усилия находятся под влиянием ЦРУ, которое отчаянно хочет видеть провал социализма в Чили. Однако сегодня рано утром, когда до столицы дошла весть о том, что военно-морской флот захватил контроль над Вальпараисо, разразился более серьезный кризис. У президента Альенде теперь есть новости о том, что вооруженные войска захватывают места по всей столице и что радиостанции были разбомблены Военно-Воздушными Силами. Похоже, что готовится полномасштабный переворот, и президент Альенде должен действовать быстро. Следующие несколько часов определят будущее Чили."
 Allende.2.d: "Когда до президента Альенде впервые дошла весть, что флот захватил Вальпараисо, он попытался связаться со своими старшими офицерами. Он не мог связаться с ними и опасался, что лидеры переворота задержали старших офицеров. Однако оказалось, что высшие офицеры, за исключением начальника Военно-Морского Флота, который был задержан, руководили попыткой переворота, и к тому времени, когда президент Альенде понял это, было уже слишком поздно. Лидеры переворота потребовали отставки, но президент Альенде отказался, поскольку он был избран президентом Чили. Вместо этого вооруженные отряды попытались захватить Президентский дворец, но столкнулись с сопротивлением лояльных социалистов-ополченцев. Когда военные силы сомкнулись, Альенде обратился к нации, заявив, что он не узаконит переворот и не станет инструментом для нового режима. Вскоре после того, как новое военное правительство объявило, что президент Альенде покончил с собой. После непродолжительной борьбы Чили теперь находится под контролем военных."
 Allende.3.d: "Когда до президента Альенде впервые дошла весть о перевороте, он испугался, что лидеры переворота задержали его старших офицеров, поскольку он не мог связаться с ними. Однако оказалось, что все старшие офицеры, кроме Адмирала Монтеро, руководили попыткой переворота. Но заговорщикам не удалось задержать Адмирала Монтеро, который сумел восстановить свой контроль над флотом. По мере того как солдаты начали занимать ключевые позиции по всей столице, появились новости о том, что флот в Вапараисо вернул город правительственной власти. Последовавшая за этим неразбериха замедлила военные действия, и некоторые региональные командиры отказались от участия в заговоре. Несколько часов спустя попытка захватить Президентский дворец закончилась неудачей, так как большое количество сторонников Альенде ополченцев смогли защитить дворец от нападения. Вскоре после этого лидеры переворота сдались и приказали своим войскам отступить. Президент Альенде обратился к нации, объявив, что демократическое правление восторжествовало над тиранией и заговорами."
 War_Powers.1.d: "Конгресс Соединенных Штатов отменил президентское вето и принял резолюцию о военных силах или закон о военных силах. Новый закон намерен проверить исполнительную власть, требуя от Президента получить одобрение Конгресса на любые военные действия. Многие в Конгрессе приветствуют этот акт как победу демократии и способ гарантировать, что ни один президент не может использовать военную силу для своих собственных целей или интересов. В целом законопроект получил широкую общественную поддержку, но в Белом доме отметили, что в столь быстро меняющемся мире меняющихся обстоятельств новый закон будет препятствовать способности Соединенных Штатов действовать эффективно. Наблюдатели законопроекта отмечают, что закон имеет потенциальные лазейки, и Время покажет, действительно ли президент может быть оспорен во время кризиса."
 NIC_USA.1.d: "Сандинистский фронт национального освобождения возник в результате слияния нескольких молодежных и студенческих групп в университетских городках. Партия все больше поддерживает социалистическую идеологию в оппозиции к правящей семье Сомоса. Для многих никарагуанцев режим Сомосы привел к экономическим трудностям, политическим репрессиям и политике капитуляции перед требованиями Соединенных Штатов. Популярность сандинистов возросла в последние годы из-за вопиющей коррупции и неспособности правительства справиться с недавним землетрясением. Эта группа проводила кампанию за повышение заработной платы и предприняла несколько рейдов против семьи Сомоса и их сторонников. Соединенные Штаты относятся к появлению этой левой организации с растущим подозрением и поддерживают никарагуанское правительство в его усилиях по борьбе с этой угрозой."
 NIC_USA.2.d: "Подъем социалистического Сандинистского фронта национального освобождения и их кампания по похищению людей и разжиганию беспорядков привели в ярость никарагуанское правительство во главе с многолетним правителем Анастасио Сомосой. Семья Сомоса сама управляла страной со времени последней американской военной интервенции и десятилетиями пользовалась помощью Соединенных Штатов. Никарагуанское правительство развязало жестокую кампанию убийств и подавления, чтобы подавить беспорядки, называемые политикой осады, но это не положило конец беспорядкам. На самом деле масштабы насилия потрясли Соединенные Штаты, и хотя они выступают против сандинистов как альтернативного режима, было решено приостановить американскую помощь Никарагуанскому правительству и Сомосе. Режим Сомосы поспешил назвать этот шаг предательством антикоммунистического союзника, но Соединенные Штаты настаивают на том, что они не могут поддерживать грубые нарушения прав человека, происходящие в Никарагуа."
 NIC_USA.3.d: "После кампании похищения людей социалистическим сандинистским Фронтом национального освобождения против никарагуанского правительства его правитель решил начать политику осады. Многолетний Никарагуанский диктатор Анастасио Сомоса развязал свою американскую обученную Национальную гвардию, чтобы возглавить кампанию внесудебных убийств, насилия, цензуры Прессы и запугивания, чтобы нацелиться на левых по всей стране и предотвратить утечку новостей за границу. Хотя многие страны уже осудили эту политику как увековечивающую нарушения прав человека, правительство Соединенных Штатов решило поддержать политику осады. Американское правительство не может допустить, чтобы социалисты-сандинисты пришли к власти и устранили ключевого американского союзника. Действительно, один американский чиновник заявил средствам массовой информации, что никарагуанское правительство защищает себя и народ от коммунистического террора, указывая на свою поддержку режима Сомосы."
 NIC_USA.4.d: "Педро Чаморро был редактором популярной газеты La Prensa, основателем Демократической партии и родственником двух бывших президентов Никарагуа. Группа вооруженных людей подъехала к Чаморро на машине и открыла огонь, убив Чаморро. Его смерть вызвала возмущение по всей стране, поскольку оппозиция обвиняет в этом убийстве правительство диктатора Анастасио Сомосы. На его похоронах десятки тысяч людей вышли на улицы, что привело к насилию и беспорядкам, направленным против режима Сомосы. Всеобщая забастовка также остановила большинство предприятий на несколько дней. Режим Сомосы обвинил местного бизнесмена, расстроенного критикой со стороны Ла Пренса, но большинство людей считают правительство ответственным."
 NIC_USA.5.d: "Президент Анастасио Сомоса официально подал в отставку с поста президента Никарагуа. Говорят, что он и его семья уже бежали, и многие подозревают, что они бегут с миллионами государственных активов. Падение режима Сомосы привело к тому, что в столицу вошли силы Сандинистского фронта национального освобождения. Ожидается, что новый социалистический режим под руководством сандинистов придет к власти, поскольку их силы в настоящее время контролируют почти всю страну. Неспособность Сомосы пойти на компромисс в требованиях реформ, устранить десятилетиями существовавшее экономическое неравенство и использовать репрессии способствовали их падению. Многие в Никарагуа не скорбят о падении семьи Сомоса, но существует неопределенность относительно будущего Никарагуа."
 USA_NIC_WAR.1.d: "Американские военные вторглись в Никарагуа. Это первая прямая военная операция в Никарагуа с тех пор, как Соединенные Штаты вышли из страны в 1933 году. Подъем социалистического Сандинистского фронта национального освобождения грозит превратить Никарагуа в социалистическое государство. Для Соединенных Штатов наличие социалистического правительства так близко к континентальным Соединенным Штатам и в состоянии распространять социалистические беспорядки на соседей ИС считается неприемлемым. Американские военные заявили, что их цель-спасти народ Никарагуа от репрессивного режима. Он добавил, что ожидает хорошего приема со стороны народа и не ожидает сильного сопротивления. В соседних штатах по всему региону многие вышли на улицы в знак протеста против американских военных действий. Есть опасения, что американская интервенция это возврат к американской канонерской дипломатии начала XX века."
 contra.1.d: "Новое сандинистское правительство приступило к осуществлению программы социалистических реформ для улучшения положения Никарагуанского общества. Однако есть люди из старого режима, которые сопротивляются переменам. На протяжении десятилетий эти люди наживались на коррупции и эксплуатации. Кроме того, Соединенные Штаты открыто организуют эти группировки в вооруженные формирования, чтобы уничтожить волю никарагуанцев. Эти боевики называют себя контрас и проводят операции против нашего Сандинистского правительства. Наши собственные источники сообщают нам, что контры объединяются иностранными спецслужбами и их целью является уничтожение социализма в Никарагуа. По мере того как \"контрас\" проводят все больше операций, они получают все большую поддержку со стороны сочувствующих и все больше вселяют страх в сердца многих никарагуанцев."
 contra.2.d: "Крах режима Сомосы и подъем социалистических сандинистов ознаменовали радикальную трансформацию системы управления в Никарагуа. Сандинисты изначально обещали уважать демократию и положить конец экономическому неравенству в обществе. Однако некоторые фракции никарагуанцев стали подозрительно относиться к сандинистам и считают, что они вместо этого строят коммунистическое общество. Эти группировки объединились в воинствующие группировки под названием \"контрас\", которые начинают нападения на сандинистов. Контрас состоит из трех основных групп: бывших сторонников режима Сомосы, антикоммунистов и борцов против Сомосы, которые считают, что сандинисты солгали им после того, как они пришли к власти. Говорят, что ЦРУ объединяет эти Контргруппы и поддерживает антисандинистские группировки в Никарагуа. Многие опасаются, что появление контрас может привести к гражданской войне и насилию."
 USA_NIC.50.d: "Впервые с начала 1930-х годов морские пехотинцы Соединенных Штатов высадились в столице Никарагуа Манагуа. Американское правительство заявило, что морские пехотинцы будут сосредоточены на защите посольства и аэропорта, но сообщения из Манагуа указывают на то, что они дислоцируются на ключевых военных контрольно-пропускных пунктах. Это развертывание значительно укрепляет президента Никарагуа Анастасио Сомосу, когда он борется за сохранение власти против повстанцев социалистического Сандинистского фронта национального освобождения. Сандинистские бойцы добились успеха, но с американским развертыванием многие ожидают, что ситуация может измениться. Президент Сомоса ведет жестокую кампанию против сандинистов, сталкиваясь с широким международным осуждением нарушений прав человека, но Соединенные Штаты продолжают последовательно поддерживать его как важнейший антикоммунистический оплот."
 AST_CIA.1.d: "Нынешнее правительство Австралийской лейбористской партии во главе с премьер-министром Гофом Уитламом подняло тревогу в нашем правительстве. Премьер-министр Уитлэм предложил рассмотреть возможность закрытия американских военных баз в Австралии. Такой сценарий был бы разрушительным для наших интересов в южной части Тихого океана. Однако у ЦРУ есть потенциальное решение. Они считают, что нынешний австралийский генерал-губернатор сэр Джон Керр с пониманием относится к важности американского военного присутствия. Один из наших агентов обратится к генерал-губернатору и попросит его использовать свою конституционную власть, чтобы свергнуть слабое правительство Уитлама и не только положить конец политическому тупику в Австралии, но и помочь в глобальной защите от коммунистического влияния."
 AST_CIA.2.d: "Нынешнее правительство Австралийской лейбористской партии во главе с премьер-министром Гофом Уитламом подняло тревогу в нашем правительстве. Премьер-министр Уитлэм предложил рассмотреть возможность закрытия американских военных баз в Австралии. Такой сценарий был бы разрушительным для наших интересов в южной части Тихого океана. Недавно мы послали агента просить генерал-губернатора сэра Джона Керра использовать его конституционные полномочия для отставки правительства. Это помогло бы решить текущие политические проблемы, преследующие Австралию, и защитить наши базы. Однако эта попытка заручиться поддержкой генерал-губернатора провалилась, поскольку он решил не увольнять правительство."
 AST_CIA.3.d: "В шокирующем развитии политический кризис в Австралии вылился в резкое отставку правящей лейбористской партии премьер-министра Гоф Уитлама. Хотя Уитмен и оппозиция, похоже, были близки к достижению компромисса, генерал-губернатор вместо этого решил предпринять решительные действия по смещению правительства. Решение генерал-губернатора, безусловно, отвечает интересам Соединенных Штатов и их опасениям, что Уитмен намерен вывести американские военные базы из страны. ЦРУ в частном порядке берет на себя ответственность за убеждение генерал-губернатора действовать. Говорят, что австралийцы ошеломлены этими действиями и боятся за демократическое будущее страны. Однако новое правительство настаивает на том, что оно скоро проведет выборы и положит конец недавним политическим беспорядкам."
 Diem_Coup.1.d: "Президент Южного Вьетнама Нго Динь Дьем и его брат Нго Динь были зверски убиты во время военного переворота, начатого офицерами-националистами. Будучи глубоко преданным католиком, режим Дьема в последние годы боролся с коммунистическими партизанами, действующими в сельской местности, и сопротивлением большинства буддийского населения. Буддисты, протестующие против дискриминационной политики правительства Дьема, были встречены военным огнем. После того как заговорщики военного переворота изолировали Дьема от лоялистских сил, они напали на его резиденцию, в конечном счете захватив Дьема и его брата, которые попытались бежать. Несмотря на гарантии генералов и Соединенных Штатов, что Дьему будет обеспечен безопасный выезд из страны, при его транспортировке в военный штаб Дьема и его брата закололи штыками и застрелили младшие офицеры. Многие в новой правящей хунте осудили этот акт, но остается неизвестным, было ли убийство случайным или заказанным хунтой для удержания власти."
 PRC_UN.1.d: "\nГенеральная Ассамблея ООН приняла резолюцию 2578. 74 страны проголосовали \"за\", 35 стран - \"против\", 17 стран воздержались. Резолюция 2578 признает Китайскую Народную Республику в качестве законного представителя Китая в Организации Объединенных Наций. Резолюция 2578 предоставляет Китайской Народной Республике статус члена ООН и передает постоянное место Китайской Республики в Совете Безопасности Организации Объединенных Наций Китайской Народной Республике. Резолюция также высылает представителя Чан Кайши и лишает Китайскую Республику статуса члена ООН. Китайская республика постоянно критикует резолюцию 2578 как незаконную, поскольку высылка члена ООН требует рекомендации Совета Безопасности и может произойти только в том случае, если страна упорно нарушает принципы, изложенные в настоящей главе, в соответствии со статьей 6 Главы 2 Устава Организации Объединенных Наций."
 PRC_UN.2.d: "На 22-й сессии Генеральной Ассамблеи ООН Соединенные Штаты наложили вето на резолюцию 2578, которая признает Китайскую Народную Республику законным представителем Китая. Представитель Соединенных Штатов в ООН Джордж Х. У. Буш заявил, что резолюция 2578 является незаконной, поскольку высылка члена ООН требует рекомендации Совета Безопасности и может произойти только в том случае, если страна упорно нарушает принципы настоящей главы в соответствии со статьей 6 Главы 2 Устава Организации Объединенных Наций. Джордж Буш также заявил, что он предложил проект резолюции 2578, которая предоставит Китайской Народной Республике статус члена ООН и постоянное место Китайской Республики в Совете Безопасности ООН, но Китайская республика сохранит за собой право представительства в ООН, однако этот проект был отклонен Генеральной Ассамблеей ООН."
 USA_Secret_War.1.d: "Блокада вьетнамского побережья фактически остановила всю контрабанду оружия и поставок коммунистическим партизанам в Южном Вьетнаме. В ответ северные вьетнамцы расширили операции 559-й Транспортной группы, которая установила ряд маршрутов из Северного Вьетнама в Южный Вьетнам. Маршрут назывался тропой Хо Ши Мина и простирался от Вьетнама до некоторых районов Лаоса и Камбоджи. Попытки Соединенных Штатов заставить камбоджийское и лаосское правительства прервать эти линии снабжения провалились. Разочарованное растущим проникновением боевиков в Южный Вьетнам, правительство Соединенных Штатов решило начать кампанию бомбардировок. Цель операции-нанести удар по силам Северного Вьетнама, объектам и маршрутам снабжения как в Камбодже, так и в Лаосе. Эта операция значительно расширяет Вьетнамскую войну, но американские политики считают, что авиация может сильно помешать усилиям Северного Вьетнама и связать северо-вьетнамские силы, которые в противном случае направились бы на юг."
 usa_flavor.1.d: "Из Нью-Йорка поступают сообщения, звонки от репортеров о Stonewall Inn, баре в Гринвич-Виллидж, который служит убежищем для городского сообщества геев, лесбиянок и трансгендеров. Несмотря на то, как часто мы совершаем набеги на гей-бары, они сейчас отбиваются. Две цветные трансгендерные женщины, Марша П. Джонсон и Сильвия Ривера, как говорят, оказали сопротивление аресту и бросили первую бутылку (или кирпич или камень) в полицейских. Растущая толпа снаружи заставила первоначальную группу рейдеров нью-йоркской полиции забаррикадироваться, бунтовщики снаружи забрасывали их предметами и пытались протаранить. Наконец, где-то после 4 часов утра, все успокоилось. Удивительно, но в первую ночь беспорядков никто не погиб и не был серьезно ранен, хотя несколько полицейских сообщили о ранениях.\n\nПосле того как наши офицеры разорвали его на части, гостиница Stonewall Inn открылась еще до наступления темноты на следующую ночь. Снова была вызвана полиция, чтобы восстановить порядок, включая еще большую группу офицеров ТПФ, которые избивали и слезоточивым газом травили членов толпы. Это продолжалось до раннего утра, когда толпа рассеялась.\n\nВсё больше и больше сторонников появлялось, скандируя лозунги вроде \"геи сила\" и \"мы победим\".\"В течение следующих нескольких ночей гей-активисты продолжали собираться возле каменной стены, пользуясь моментом, чтобы распространять информацию и создавать сообщество, которое будет подпитывать рост движения За права геев. Хотя полицейские также вернулись, настроение было менее конфронтационным, с отдельными стычками, заменившими масштабные беспорядки в выходные."
 USA_Rhodesia.2.d: "\nПоскольку Советский Союз и его клиенты по всей Африке вызывают волнения и захватывают власть в разных местах, интерес к Родезии возобновляется. С тех пор как Родезия объявила о своей односторонней независимости, Соединенные Штаты вместе со своим союзником Великобританией поддерживали разрыв связей и введение санкций до тех пор, пока Родезия не примет принцип господства большинства. Однако родезийцы обладают ценными минералами и ведут войну против многочисленных воинствующих группировок, претендующих на независимость. Однако их левая идеология намекает, что эти группы могут быть просто советскими активами. Южная Африка и Португалия отказываются применять санкции, позволяя Родезийцам обойти их влияние на страну. В последнее время американская разведка, деловые круги и белые сторонники превосходства начали использовать Южную Африку для торговли и продажи оружия с Родезийцами. Хотя это противоречит официальной политике и является вопиющим, Вашингтон до сих пор отказывался закрывать лазейку, указывая на молчаливое одобрение."
 USA_Rhodesia.1.d: "В Вашингтоне все больше верят в то, что многие левые независимые движения, действующие в Африке, являются коммунистическими фронтами. Эти группы пытаются изобразить себя борцами за свободу, но они только закладывают основу для будущего, когда они превратятся в тоталитарные коммунистические государства. Такие страны, как Родезия, которую когда-то поносили за ее сильную позицию против таких групп, теперь изображаются как антикоммунистический редут в Африке. Сторонники Родезии лоббируют Белый дом, чтобы он проигнорировал коммунистическую пропаганду и признал Родезию. Они хотят, чтобы Родезия получила поддержку, необходимую для продолжения сопротивления коммунизму. Когда эти защитники настаивают на Родезийской расовой политике, они часто заявляют, что это внутреннее дело родезийцев, но оно может быть изменено сверхурочно с помощью Соединенных Штатов."
 SOVUSA.1.d: "Соединенные Штаты через тайного эмиссара предложили присоединиться к Советскому Союзу и разгромить КНР. Американцы утверждают, что китайское правительство оказалось непредсказуемым, жестоким и источником беспорядков во всем мире. Хотя они обладают огромным числом и ресурсами, совместные усилия должны увенчаться успехом. Некоторые высокопоставленные партийные лидеры хотят принять это предложение, заявив, что американские военно-морские и военно-воздушные силы, в частности, могут обеспечить быструю победу над Пекином. Другие опасаются, что участие Соединенных Штатов ограничит наши послевоенные возможности, поскольку американцы будут настаивать на том, чтобы их марионеточный режим на Тайване пришел к власти после войны. Такой сценарий может быть разрушительным для наших интересов в Азии."
 SOVUSA.2.d: "Недавно мы предложили СССР объединить наши силы и разгромить КНР. Коммунистический режим в Пекине уже давно представляет угрозу нашим интересам в регионе, и, что более важно, поддержка одного коммунистического режима для уничтожения другого только поможет нашим интересам. Однако Советский Союз сообщил нам, что они не могут принять наше предложение. Хотя они не приводили причин, это, вероятно, связано с их опасениями, что американское участие ограничит их послевоенные возможности, и, возможно, они не хотели, чтобы их военные тесно сотрудничали с нашими. Это неутешительный результат, но его можно ожидать, учитывая голые амбиции глобального коммунизма."
 SOVUSA.3.d: "Недавно мы предложили СССР объединить наши силы и разгромить КНР. Коммунистический режим в Пекине уже давно представляет угрозу нашим интересам в регионе, и, что более важно, поддержка одного коммунистического режима для уничтожения другого только поможет нашим интересам. После рассмотрения предложений советы ответили, что они принимают это предложение. Новость была взволнованно воспринята в Белом доме, который быстро приказал Пентагону подготовить развертывание войск и средств. Уже сейчас высокопоставленные чиновники Кабинета министров установили контакт со своими советскими коллегами, а также с высшим военным штабом. Переводчики с русского языка переводятся из других ведомств в Пентагон, чтобы помочь этой работе. Америка достигла своей цели и надеется наказать КНР и отстаивать свои интересы в Азии."
 SOVUSA.4.d: "К большому потрясению собственного населения, Соединенные Штаты и Советский Союз объявили о начале военных действий против Китая. Обе страны ссылались на жестокость пекинского правительства и его участие в разжигании глобальных беспорядков. Уже появились новости о том, что советские сухопутные войска пересекают границу, а также слухи об американских атаках. Масштабы военного сотрудничества между двумя странами неизвестны, хотя обе стороны тесно общаются. Некоторые предполагают, что этот контакт должен гарантировать, что ни одна из сторон случайно не нацелится на другую. В Пекине правительство вело себя вызывающе, утверждая, что Китай столкнулся с национальной борьбой против империализма, но в отличие от прежней борьбы, народ готов. Китайские войска мобилизуются, и провластные марши поощряют сопротивление и добровольцев для военных. Сейчас, когда три самых могущественных государства находятся в состоянии войны, многие во всем мире опасаются последствий такого конфликта."
 USA_COUP.1.d: "Основатель Индонезии и многолетний лидер президент Сукарно передал власть генералу Сухарто. Похоже, индонезийские военные вынудили Сукарно отказаться от власти после серии убийств индонезийских военачальников таинственной новой коммунистической военизированной группировкой. Боевики пытались заставить Сукарно одобрить их действия, но он отказался, и поскольку военные расправились с радикальными боевиками, Сукарно был удален. Сухарто обвинил нападение боевиков в попытке коммунистического переворота и приказал расправиться с индонезийской Коммунистической партией. Судя по всему, репрессии носят насильственный характер с сообщениями об убийствах и ожесточенных боях между военными подразделениями и коммунистами. Правительство также арестовывает тысячи подозреваемых коммунистов по всей стране. Похоже, новое индонезийское военное правительство сосредоточено на устранении коммунизма из политической жизни. Соединенные Штаты предлагают разведывательную и военную помощь, чтобы поддержать правительство в его антикоммунистическом движении."
 latam_coup.1.d: "После нескольких месяцев социальных волнений, особенно между президентом и шахтерами, боливийские военные вмешались и свергли правительство. Вице-президент Рене Барриентос возглавил эти усилия и пришел к власти при военной поддержке. Многие в Боливии предполагают, что переворот произошел при поддержке Америки. Те, кто верит в эту теорию, указывают, что Соединенные Штаты имеют экономические интересы в стране и все больше обеспокоены политическими беспорядками. Имея это в виду, Америка опасалась восстания или политического сдвига в сторону коммунизма и поощряла военный переворот. Правительство Соединенных Штатов, со своей стороны, приветствовало новый режим как стабилизирующую силу и проигнорировало вопросы о какой-либо причастности к перевороту."
 CIA_60s.3.d: "Президент Хулио Аросемена Монрой бурный срок пребывания на посту президента Эквадора завершился военным переворотом. Новая военная хунта заявила, что она выступает против коммунизма и его недавнего распространения в Латинской Америке. Противники переворота и левые находятся под арестом, и хунта обещает начать реформы, направленные на облегчение текущих экономических и политических проблем, преследующих Эквадор. Президент Монрой инициировал реформы, но столкнулся с проблемами с военными и законодательными органами, открыто восхваляя левые движения. Недавно он начал критиковать региональную политику Соединенных Штатов и оскорбил их посла. Многие в стране считают, что эти последние действия подтолкнули американцев дать свое тихое одобрение военным действиям."
 Paris_Peace.1.d: "Парижские мирные соглашения были подписаны между Соединенными Штатами, Северным Вьетнамом, Южным Вьетнамом и повстанческими силами в Южном Вьетнаме. Соединенные Штаты поспешили назвать это соглашение прочным миром для всех в регионе. Соединенные Штаты согласились вывести все свои войска из Вьетнама, Камбоджи и Лаоса в дополнение к снятию блокады Северного Вьетнама. Северный Вьетнам освободит своих американских пленных и пообещает не посылать больше войск или оружия южновьетнамским повстанцам. Северным вьетнамцам и их союзникам разрешено оставаться на своих территориях в Южном Вьетнаме, где они установят линии прекращения огня с правительством Сайгона. Реакция Южного Вьетнама на этот договор была крайне негативной, многие называли неприемлемым разрешение северо-вьетнамских лазутчиков на юге и обвиняли Соединенные Штаты в том, что они вынудили правительство согласиться на его условия, чтобы облегчить их уход из региона."
 Camp_David.1.d: "После почти двухнедельных напряженных переговоров лидеры Египта и Израиля подписали на лужайке Белого дома всеобъемлющий мирный договор. Американское правительство возглавило эти недавние усилия после недавней оттепели в египетско-израильских отношениях. Двухнедельные переговоры состоялись в резиденции президента в Кэмп-Дэвиде. Оба лидера подписали два документа. Один из них предлагал рамки для регионального мира, призывая к созданию самоуправляемой Палестинской зоны на Западном берегу и в Газе. Другой документ был гораздо более всеобъемлющим и разрешал десятилетнюю напряженность между Египтом и Израилем. Синай будет возвращен Египту в обмен на гарантии безопасности, признание Израиля и нормализацию дипломатических отношений. Несмотря на широкую международную похвалу, арабские государства и палестинцы встретили гневную реакцию. Они обвинили Египет в предательстве арабского единства и особенно критиковали первый документ, поскольку он был написан без консультаций с другими региональными арабскими государствами или палестинцами."
 Vietnam_War_2.1.d: "Соединенные Штаты подписали Парижские соглашения с твердым намерением следовать им и действовать в духе мира со всеми фракциями. Однако ясно, что северные вьетнамцы и их союзники воспользовались нашей честью и не выполняют условий соглашения. Из-за этого Соединенные Штаты решили начать новые военные операции. До тех пор, пока коммунисты продолжают подрывать невинный народ Южного Вьетнама, Соединенные Штаты не могут оставаться в стороне. Американский народ, возможно, не полностью поддерживает наши действия, но у Америки есть обязательства и долг перед народом Вьетнама. Мы не остановимся, пока коммунисты не прекратят свою бессмысленную агрессию."
 SEATO.4.d: "После недавних успехов на поле боя против коммунистических сил штаб СЕАТО объявил о расширении своих членов. СЕАТО возник в 1950-х годах как региональная организация, призванная содействовать культурным, торговым и военным связям стран, заинтересованных в предотвращении распространения коммунизма в регионе. Страны, вовлеченные в Индокитайский конфликт, в основном держались в стороне из-за своих собственных международных соглашений, препятствующих их присоединению, однако некоторые присоединились в качестве наблюдателей. Эти государства-наблюдатели теперь объявили о своем намерении присоединиться к организации, поскольку Соединенные Штаты обязались укрепить организацию и пообещали, что СЕАТО будет Авангардом антикоммунистических сил в регионе."
 SEATO.5.d: "СЕАТО возник в 1950-х годах как региональная организация, призванная содействовать культурным, торговым и военным связям стран, заинтересованных в предотвращении распространения коммунизма в регионе. В последние годы организация пришла в упадок, поскольку некоторые члены отказались участвовать во Вьетнаме, и организация не смогла привлечь многие страны из Юго-Восточной Азии. В связи с ухудшением ситуации во Вьетнаме и значительным ослаблением американского участия было принято решение официально распустить группу, поскольку у нее больше нет четкой цели. Хотя СЕАТО не оправдала своего военного потенциала и больше не будет функционировать, региональные связи, которые она создала, останутся прочным наследием организации."
 US_Taiwan.10.d: "После недавнего размораживания отношений между Соединенными Штатами и КНР американское правительство объявило, что оно немедленно прекратит всякую помощь Тайваню. Американское правительство ссылается на меняющуюся региональную ситуацию и желание не способствовать разжиганию напряженности в регионе. Важно отметить, что теперь Америка будет рассматривать тайваньский спор как внутренний вопрос, который должен быть решен двумя правительствами. Это заявление уже вызвало гнев Конгресса и возмущение средств массовой информации в Америке, многие из которых назвали это решение предательством верного антикоммунистического союзника. Однако американское правительство настаивает на том, что это решение отвечает наилучшим интересам страны и не делается для умиротворения какого-либо иностранного государства."
 USA_Afghanistan.1.d: "Соединенные Штаты решительно осуждают недавние военные действия, предпринятые Советским Союзом в Афганистане. Они называют советское вторжение незаконным, посягательством на афганский народ и посягательством на мир во всем мире. В Вашингтоне советского посла вызвали в Белый дом, где он получил официальный протест. Ожидалась решительная реакция Соединенных Штатов, но приведет ли это к какому-либо участию в продолжающемся конфликте, в настоящее время неизвестно. Госсекретарь уже позвонил своим коллегам в регионе, которые также выразили обеспокоенность действиями советских войск. Советское правительство в ответ заявило, что оно действовало в интересах афганского народа и по приглашению своего правительства."
 Grain_Embargo.1.d: "В ответ на американское вторжение в Афганистан Соединенные Штаты объявили о введении эмбарго на весь экспорт зерна в Советский Союз. Соединенные Штаты надеются, что эмбарго приведет к дефициту в Советском Союзе, что подтолкнет его народ к тому, чтобы заставить правительство прекратить свою деятельность. Хотя этот шаг приветствуется по всей Америке, многие эксперты полагают, что Советы смогут найти альтернативные источники и смягчить его последствия. Американское правительство заявляет, что это решение является частью многогранной дипломатической кампании, направленной на то, чтобы заставить советы прекратить свое участие в Афганистане."
 US_Olympics.1.d: "В рамках своего многогранного подхода к протесту и дипломатическому оспариванию советского вторжения в Афганистан Америка объявила, что будет бойкотировать Олимпийские игры 1980 года, которые пройдут в Москве. Кроме того, Соединенные Штаты обратились ко всем своим союзникам и странам, поддерживающим мир во всем мире, с просьбой присоединиться к ним в бойкоте. Почти сразу же несколько государств выразили заинтересованность в поддержке этого шага. Идея бойкота Игр возникла у советских диссидентов, которые считали, что такая акция продемонстрирует глобальную решимость противостоять советской агрессии. Хотя этот шаг получил первоначальную международную и внутреннюю поддержку, многие в стране считают, что спорт должен быть отделен от политики. Кроме того, дипломаты из некоторых стран в частном порядке сообщили СМИ, что считают такой шаг пустым жестом и не планируют присоединяться к бойкоту."
 Sandinista.1.d: "Американское правительство публично осудило сандинистов Никарагуа за их жестокую тактику и оскорбления против народа Никарагуа. Соединенные Штаты отметили, что Центральная Америка уже давно представляет интерес для этой страны, и американцы уже давно стремятся помочь ее народу на протяжении многих лет. Сандинисты представляют собой экзистенциальную угрозу для Никарагуанского народа и его ценностей. Решительное осуждение со стороны Соединенных Штатов вызвало опасения относительно дальнейшего американского участия в Никарагуа, хотя антисандинистские силы в стране приветствуют это заявление. Сандинисты в ответ заявили, что они борются за крестьян и рабочих Никарагуа и не поддадутся империалистическому давлению."
 Khomenei_Assasinated.1.d: "В результате эскалации жестокого подавления, развязанного шахом Ирана против инакомыслящих в стране, аятолла Рухолла Хомейни был убит. Давний критик Шаха бежал из страны много лет назад и стал символом оппозиции Шаху. Подробности убийства все еще неясны, но вину уже возлагают на Шаха и его тайную полицию-САВАК. Смерть Хомейни станет серьезным ударом по оппозиции. Уже сейчас волны протестов со стороны иранских диссидентов и сторонников Хомейни проходят в Европе, Иране и соседних государствах. Вину за это Шах возложил на своего союзника Соединенные Штаты, причем многие полагали, что САВАК действовал совместно с ЦРУ. Американское правительство до сих пор хранило молчание по поводу этой новости, хотя многие считают, что недавние репрессии против диссидентов произошли только с благословения Соединенных Штатов."
 Oil_Embargo.79.d: "Добыча иранской нефти значительно сократилась после волнений, которые продолжают сотрясать страну. К этому давлению добавляются постоянные забастовки, преследующие иранскую нефтяную промышленность. Это привело к глобальной панике в отношении энергоснабжения. К этой неопределенности добавляется недавнее заявление американского правительства о том, что оно введет эмбарго на иранскую нефть в обозримом будущем из-за их продолжающегося неповиновения международным нормам и враждебного отношения к Соединенным Штатам. Президент подчеркнул, что эти меры накажут Иран, и были приняты меры по смягчению его воздействия на Соединенные Штаты, однако это заявление вызвало еще большую потребительскую панику, которая вредит экономическому росту и ведет к росту цен на нефть. Иранское правительство назвало это последнее заявление пустым жестом Америки."
 USA_Rhodesia.3.d: "В спорном шаге американское правительство объявило, что признает независимость Родезии. Как и многие другие страны, Соединенные Штаты ранее отказались признать Родезию из-за ее расовой политики и одностороннего провозглашения независимости от своего союзника Великобритании. Однако подъем коммунизма в Африке привел к новой оценке со стороны американских политиков. Они считают, что поддержка эффективных антикоммунистических режимов на континенте будет наиболее эффективным способом остановить коммунизм. Родезия, в частности, была исключительно эффективна в сопротивлении левым партизанским армиям, несмотря на отсутствие доступа к западной помощи или оружию. Спорные родезийские расовые законы теперь игнорируются и рассматриваются как внутреннее дело Родезии. Однако это заявление вызвало гневные протесты в США и за рубежом. Многие осуждают расовую политику и считают повстанцев борцами за свободу, а не коммунистами. Степень американской поддержки Родезии пока неизвестна."
 USA_Portugal.1.d: "В рамках нового сдвига в американской политике в отношении Африки Соединенные Штаты обязались сделать все возможное для сохранения португальских позиций в Африке. Многие американские политики теперь рассматривают растущее число левых партизанских сил, борющихся за независимость, как по существу коммунистические силы, стремящиеся превратить континент в коммунистический. Потеря этих территорий, населения и ресурсов для коммунистического мира потенциально может подорвать позиции Америки на международном уровне. Португальцы и их союзники являются одними из наиболее эффективных сил на местах, сражающихся с этими группировками, что побудило Соединенные Штаты поддержать их и изменить свою позицию по деколонизации в Африке. Новый сдвиг в политике ведет к международной и внутренней негативной реакции. Многие приравнивают новую политику к активной поддержке деколонизации и расовой дискриминации, что в конечном счете приведет к международной изоляции Америки."
 IHC.1.d: "В беспрецедентной эскалации сотни иранских студентов-протестующих захватили контроль над посольством Соединенных Штатов в Тегеране. После недолгой борьбы посол сдался. Сотрудникам посольства и морским пехотинцам завязали глаза и устроили парад перед телекамерами. Аятолла Рухолла Хомейни одобрил захват власти, и заложники находятся в руках его сторонников. Соединенные Штаты и многие другие государства поспешили осудить это нарушение международного права. До сих пор захватчики заложников требуют, чтобы иранский шах был возвращен из Соединенных Штатов, где он попросил убежища и проходит курс лечения. Захватчики также захватили документы из посольства, которые они планируют публично обнародовать, чтобы показать американскую причастность к преступлениям Шаха."
 IHC.5.d: "Когда мы рассматривли наши варианты противостояния Ирану, было решено, что будущие военные операции будут проводиться исключительно с помощью НАТО. В штаб-квартире НАТО американцы активировали статью 5, заявив, что нападение на ее посольство было нападением на американскую суверенную территорию. Многие члены НАТО выразили поддержку Соединенным Штатам в это трудное время. В Вашингтоне существует широкий консенсус в отношении того, что если Америка должна действовать, то она должна делать это со своими ближайшими союзниками. Если НАТО не сможет помочь, это будет означать, что вся американская система безопасности обанкротилась. Если дело дойдет до войны, Америка пойдет на нее с поддержкой своих ближайших союзников или без нее."
 IHC.10.d: "Соединенные Штаты Америки объявили, что их войска перемещаются с баз в регионе, чтобы быстро нейтрализовать иранское правительство. Американский президент сообщил американскому народу, что дело правое и оставить Иран безнаказанным после того, как он проигнорирует ультиматум, ослабит страну и заставит друзей Соединенных Штатов усомниться в американской убежденности. Президент привел в качестве оправдания военных действий нарушения международных законов и нарушения прав человека. Америка обещает восстановить правильное и справедливое правительство для иранского народа. Несмотря на то, что вторжение пока идет по плану, размеры Ирана и его население вызывают опасения, что крупное американское присутствие может спровоцировать серьезные беспорядки и проблемы. Иранские активисты, выступающие против нового режима, говорят, что сотрудничают с американской разведкой, чтобы помочь облегчить вторжение."
 IHC.15.d: "Поскольку переговоры о заложниках зашли в тупик из-за чрезмерных требований Ирана и отсутствия у них возможности для маневра, к президенту обратились с просьбой о военном решении кризиса. Американские спецслужбы и спецслужбы заявляют, что они знают, что заложники все еще находятся в посольстве, и предлагают операцию, которая бы хирургически спасла заложников и не включала в себя полномасштабное военное нападение на Иран. План предусматривает создание американскими войсками аэродрома в Иране в качестве плацдарма. Как только это будет установлено, почти сотня солдат спецназа прибудет и начнет воздушную атаку на посольство. Как только заложники будут освобождены, они будут вывезены из Ирана вместе с нашими войсками. Хотя это сложная операция, военные проявляют уверенность и заявляют, что она вряд ли спровоцирует более широкий конфликт."
 IHC.16.d: "Американский народ был вне себя от радости, узнав об успешном освобождении американских заложников в Иране. Несмотря на некоторые незначительные проблемы с топливом, в ходе двухдневной американской операции удалось сначала создать авиабазу в Иране, откуда американские спецназовцы вылетели на вертолетах, чтобы штурмовать посольство и спасти заложников. Нападение, когда по плану, с иранским сопротивлением намного легче, чем ожидалось, похоже, что они совершенно не знали, что такая операция вообще может быть проведена. О жертвах пока ничего не известно, но Новости пока рано сообщать. Иранская ошибка заключалась в том, что заложников держали вместе, что делало операцию возможной. Попытки иранских военных перехватить рейдеров провалились, так как временный американский аэродром к тому времени, когда они добрались до него, был уже давно пуст. Эта операция является огромной победой американских спецназовцев и демонстрирует, что Америка не потерпит шантажа со стороны любого государства или организации, независимо от того, где они находятся."
 IHC.17.d: "Белый дом объявил, что попытка освободить американских заложников, удерживаемых в Иране, провалилась. Хотя детали все еще выясняются, похоже, что американские военные действительно погибли, хотя заложники остались невредимыми. Миссия была отозвана после того, как начальная фаза операции закончилась катастрофой. Хотя взлетно-посадочная полоса была создана в Иране, существовали проблемы с топливом и погодными условиями, которые привели к крушению по крайней мере одного транспортного самолета и одного вертолета. Оставшиеся силы были отчаянно эвакуированы,и несколько самолетов были брошены. Ни один личный состав не был потерян в бою с врагом, и Иран уже называет неудавшуюся операцию знамением от Бога. Говорят, что американский народ в отчаянии от этих новостей, и моральный дух в армии сильно пострадал. В Иране заложники сейчас рассредоточены по всей стране, чтобы гарантировать, что подобная попытка не повторится."
 IHC.20.d: "Народ Соединенных Штатов внимательно следит за развитием событий с тех пор, как толпы иранских студентов захватили в заложники сотрудников американского посольства в Тегеране. После долгих мытарств иранское правительство официально освободило заложников, позволив им улететь из страны. Сделав по пути несколько остановок, чтобы дать возможность Военно-медицинскому персоналу проверить свое здоровье, освобожденные американцы приземлились на военном аэродроме в Нью-Йорке. Затем бывших заложников доставили на автобусе в отель \"Тайер\" при Военной академии Соединенных Штатов в Вест-Пойнте. По всему автобусному маршруту толпы американцев приветствовали бывших заложников. Через три дня их отвезут в Нью-Йорк на парад телетайпов. Семьи бывших заложников торжествуют по поводу возвращения своих близких. Американское правительство выражает удовлетворение и вздыхает с облегчением, что ситуация наконец разрешилась и заложники благополучно вернулись."
 IHC.2.d: "Иран официально начал переговоры с Соединенными Штатами по поводу заложников американского посольства. Через Панаму они официально потребовали возвращения Шаха, чтобы предстать перед лицом его преступлений против иранского народа. Американское правительство отказалось по гуманитарным соображениям, заявив о его слабом здоровье и продолжающемся медицинском лечении. Иранцы требуют от Америки извинений за свое предыдущее вмешательство во внутренние дела Ирана и размораживание иранских государственных фондов, находящихся в распоряжении США. Что касается американцев, то, хотя вопрос об освобождении шаха не стоит на повестке дня, они готовы вести дальнейшие переговоры по другим требованиям, включая возможность создания комиссии по расследованию американского участия в иранских делах. Однако захватчики кажутся весьма целеустремленными, и вряд ли иранское правительство сможет пойти на компромисс."
 IHC.3.d: "Недавняя иранская провокация и захват заложников у посольства Соединенных Штатов возмутили американский народ. В результате американское правительство решило, что оно не будет вознаграждать такое бессмысленное нарушение международного права и американского суверенитета. Она исключила любые переговоры с Ираном и вместо этого выдвинула ультиматум с требованием безоговорочного освобождения заложников. Многие американцы приветствуют решительную позицию правительства, хотя предостерегают, что такая агрессивная позиция может подвергнуть заложников гораздо большему риску."
 IHC.4.d: "Американское правительство недавно направило предложение нашему правительству. Они попросили нас присоединиться к антииранскому пакту и помочь им свергнуть новый режим в Тегеране. Взамен они предложили полностью отказаться от поддержки афганской оппозиции, которая ведет борьбу с нашими войсками в Афганистане. Некоторые из наших советников предполагают, что это предложение может оказаться плодотворным. Прекращение афганского сопротивления принесет огромную пользу, а теократический характер нового режима может представлять угрозу для нашего собственного мусульманского населения. Другие советники, однако, отмечают, что новый режим до сих пор, похоже, хотел сердечных связей, а предыдущий режим долгое время был занозой на нашей стороне. Замена нынешнего режима другим проамериканским может в конечном итоге создать большую угрозу нашим интересам, чем афганская оппозиция могла бы когда-либо надеяться. Мы должны тщательно обдумать это американское предложение."
 VFX.1.d: "Концепция VFX, нашего Военно-Морского эксперимента по истребителям, началась в 1968 году, когда Grumman представил незапрошенное предложение по самолету. Заинтересовавшись этим, начальник Военно-морских операций рекомендовал провести исследование для определения целесообразности проекта VFX. Исследование пришло к выводу, что новая конструкция истребителя была осуществима, и военно-морской флот приступил к определению контракта, пять компаний представили свои проекты, такие как Grumman, General Dynamics, Vought, McDonnell Douglas и North American Rockwell. Какое захватывающее время быть авиаконструктором! Мы выберем двух финалистов и выберем оттуда. Нам нужен самолет с экипажем из двух человек, мощным бортовым радаром управления вооружением, способным вести дальний воздушный бой (свыше 100 миль), он должен быть двухмоторным перехватчиком и иметь максимальную скорость 2,2 Маха. Он также должен иметь M61 Vulcan и иметь возможность нести шесть AIM-54 или шесть AIM-7 и четыре AIM-9."
 VFX.2.d: "После многих интересных проектов от многих компаний мы свелись к двум производителям, контракт либо переходит к McDonnell Douglas, известным создателям F-4 Phantom, чрезвычайно надежного самолета, который мы использовали во Вьетнаме, либо мы присуждаем контракт Grumman с их революционным дизайном 303. В Военно-Морском флоте было некоторое давление на выбор McDonnell Douglas, поскольку, когда речь заходит о морской авиации, к ним определенно есть некоторые симпатии. Grumman не был известен тем, что делал отличные реактивные истребители."
 VFX.3.d: "Мы выбрали Grumman победителем и вручим им контракт на производство нашего нового перехватчика F-14. Работа Grumman над VFX началась с изучения концепции \"303\". Несмотря на их участие в неудавшемся F-111B из конкурса TFX, Grumman использовал их опыт в создании самолетов, чтобы создать дизайн, который в конечном итоге выиграл конкурс. Модель 303 выпускалась в нескольких различных вариантах, как с неподвижным, так и с распашным крылом. Самолет имеет два форсажных турбовентиляторных двигателя General Electric, он способен развивать скорость 2,34 Маха, может нести удивительную боевую нагрузку от воздуха до воздуха и соответствует всем нашим критериям."
 VFX.4.d: "Мы выбрали McDonnell Douglas по контракту нашего нового перехватчика, истребителя F-14. McDonnell Douglas предложил, возможно, самый амбициозный дизайн VFX. Как и три из четырех других конструкций, их предложение отличалось изменяемой геометрией крыльев. Они также включили в конструкцию канарейки, а также двойной хвост. Крылья были установлены низко на самолете, в то время как двигатели доминировали в фюзеляже. Фюзеляж был довольно квадратным и не аэродинамичным, он обеспечивал большое пространство для установки ракет. Амбициозное предложение получило одобрение благодаря ожидаемой хорошей маневренности, которой обладали Канары и двухвостки. Этот проект был одним из двух финалистов, отобранных для дальнейшей разработки, и в конце концов McDonnell Douglas вышел на первое место над Grumman."
 usanews.2.d: "Вскоре после недавно завершенного Всемирного торгового центра в Нью-Йорке в центре Чикаго было завершено строительство нового самого высокого здания в мире, Сирс-Тауэр. Детище архитектора Брюса Грэма и инженера-строителя Фазлура Рахмана Кхана, структура включает в себя новый революционный дизайн, включающий девять квадратных зданий или «труб», сгруппированных в матричный квадрат 3 на 3 с окружностью 225 футов, девять труб, составляющие структуру, поднимутся до 50-го этажа, где северо-западные и юго-западные трубы будут выходить на плато, северо-восточные и юго-восточные трубы останутся на 66-м, северные, восточные и южные трубы на 90-м, а западные и центральные трубы будут заканчиваться на на 108-м этаже, побив мировой рекорд Всемирного торгового центра - 1450 футов. В нынешнюю эру гражданского строительства США и команда Грэма и Хана, значительно опередившие свое время, получили большую международную похвалу, причем Хан, в частности, был отмечен за его гениальное воплощение его \ \"трубчатой ​​конструкции \", получив множество комиссий по его реализации за рубежом."
 power_pack.1.d: "Соединенные Штаты вмешались в продолжающуюся гражданскую войну в Доминиканской Республике. По крайней мере, три бригады боевых подразделений при поддержке воздушно-десантных войск рано утром высадились на авиабазе Сан-Исидро. Они быстро продвинулись в Санто-Доминго, где американские военные подтвердили успешное создание зоны международной безопасности, охватывающей посольства и прилегающие территории для Организации американских государств (ОАГ). Американцы утверждают, что вмешательство было необходимо для облегчения эвакуации иностранных граждан и защиты мирного процесса ОАГ в стране. Многие доминиканцы возмущены тем, что они считают иностранным вмешательством, при этом многие отмечают, что американская операция укрепила фракцию лоялистов и оттолкнула наступающие конституционные повстанческие силы в этом районе. По всему региону проходят антиамериканские протесты, многие осуждают их как возвращение к дипломатии канонерских лодок начала двадцатого века."
 swf.3.d: "Президент Трумэн умер во время операции в больнице общего профиля имени Уолтера Рида после перестрелки в доме Блэра. Трумэн останавливался в Blair House из-за того, что Белый дом был в процессе реставрации. После перестрелки в здание вошли двое боевиков. Президент Трумэн с агентами попытался сбежать, но столкнулся с двумя боевиками. 3 офицера и 3 агента были убиты, несколько ранены. Президент Трумэн был ранен но доставлен в больницу, где скончался во время операции. Один из боевиков погиб в перестрелке, другой взят в плен. Убитый боевик был опознан как Гризелио Торресола. Другой боевик был схвачен и опознан как Оскар Коллазо. Мотивом этого покушения было то, что эти боевики были пуэрториканскими националистами, которые хотели, чтобы Пуэрто-Рико освободилось от американского империализма, и хотели поставить точку, убив президента США. Сегодня народ скорбит. Вице-президент Албен В. Баркли был приведен к присяге как 34-ый президент Соединенных Штатов Америки."
 swf.2.d: "Президент Трумэн был в Blair House, когда Белый дом был в процессе реставрации. Появились двое боевиков и начали открывать огонь. В перестрелке погиб 1 полицейский, несколько получили ранения. Президент Трумэн здоров и не пострадал. Один из боевиков погиб в ходе боевых действий. Его опознали как Гризелио Торресола. Другой боевик был схвачен и опознан как Оскар Коллазо. Мотивом этого покушения было то, что эти боевики были пуэрториканскими националистами, которые хотели, чтобы Пуэрто-Рико освободилось от американского империализма, и хотели поставить точку, убив президента США. К счастью, с президентом Трумэном все в порядке."
 Harriman.1.d: "Президент Уильям Гарриман объявил о новом изменении внешней политики. Президент подтвердил необходимость противостоять угрозе коммунизма посредством сдерживания и коллективной безопасности. В своем заявлении президент объявил, что будут предприняты усилия для поддержки существующих союзников и установления контактов с новыми потенциальными друзьями. Он заявил, что сильный акцент на сдерживании требует, чтобы Соединенные Штаты обеспечивали экономическую и военную мощь своих союзников на передовой. Многие аналитики не удивляются, поскольку президент давно питает подозрения в отношении Советского Союза."
 Harriman.2.d: "Белый дом объявил о начале своей новой кампании в области искусств и наук. Кампания, разработанная президентом Гарриманом, призывает к увеличению инвестиций и развитию искусства и науки по всей стране. Президент в своем заявлении отметил, что Соединенные Штаты отстают от других мировых держав, в том числе из враждебных государств в этих областях, и только возобновив интерес, особенно среди молодежи, Соединенные Штаты могут полностью раскрыть свой потенциал. Кампания увидит не только поощрение, но и увеличение грантов на образование для ускорения развития учащихся."
 Liberal_Republican.1.d: "Либеральные республиканцы возрождаются в Соединенных Штатах. Они предлагают прогрессивную альтернативу традиционным демократическим политическим машинам для американцев, которым не нравится консервативная социальная или фискальная политика. Возрождение вызвано новой волной поддержки Либерально-республиканской партии в рамках их традиционной базы на Среднем Западе и Северо-Востоке. Также есть сообщения о том, что в других штатах все больше центристских демократов и разочарованных консервативных республиканцев обращаются к кандидатам от Либерально-республиканской партии. Это отражает растущее притяжение американской общественности к политическому центру, а не к левым или правым."
 Dewey_Mafia.1.d: "Президент Томас Дьюи похвалил обвинительные заключения, объявленные ФБР и другими правоохранительными органами, которые нацелены на основные организации мафии по всей стране. Эти судебные преследования начались всего через несколько месяцев после того, как президент дал указание федеральным правоохранительным органам сосредоточить усилия на ликвидации всей организованной преступности в стране. Этот акцент на мафии не шокирует многих, поскольку президент впервые приобрел известность, когда он выступал в качестве федерального прокурора против главных лидеров мафии в 1930-х годах. Хотя президента широко хвалят, есть опасения, что он может рискнуть подвергнуться жестоким репрессиям или нарушить закон и порядок, если эти организации погрузятся в войну за территорию, когда лидеров мафии уберут с улиц. Несмотря на эти опасения, Президент пообещал продолжить свои усилия."
 Dewey.10.d: "Первые успехи президента Томаса Дьюи дали новую жизнь умеренному крылу Республиканской партии, которое часто называют восточным истеблишментом. В последние годы консервативные республиканцы обвиняли это крыло партии в продвижении противоположной социальной и экономической политики и использовании своего богатства для манипулирования национальной партией с целью продвижения своих кандидатов. Консерваторы утверждали, что их кандидаты не так уж сильно отделяются от демократов, а у консерваторов нет мотивации голосовать. Однако победа президента Дьюи опровергла эту критику. База Восточного истеблишмента, находившаяся в осаде в последние избирательные циклы, теперь, похоже, оживилась и активно поддерживает президента, чтобы помочь ему реализовать его национальную повестку дня."
 nixon_early.1.d: "Президент Ричард Никсон призвал федеральные агентства и прокуратуру изучить деятельность Ку-клукс-клана. Президент назвал недавние сообщения о расовом насилии и массовых нападениях клановцев, преследующих афроамериканцев, недопустимым и прямым вызовом государству. В частности, он указал на новость о том, что члены Ку-клукс-клана напали на чернокожего музыканта, выступающего на сцене в Алабаме. Президент заявил, что всем американцам разрешено верить в то, во что они хотят, но использование насилия и организация несанкционированных боевиков противоречат общественным нормам и с ними необходимо бороться. Президент не исключил развертывания федеральных агентов на местах для прямого противостояния Клану."
 Nixon_early.2.d: "Президент Ричард Никсон направил в Конгресс сообщение о своих взглядах на дела Индии. Президент выразил свое несогласие с нынешней политикой увольнения в отношении коренных американцев. Президент отметил, что эта политика лишила коренных американцев свободы воли и навязала непопулярные законы в этих общинах. Он также выступал против того, чтобы федеральное правительство имело такую власть над любым населением страны. Вместо этого президент Никсон призвал Конгресс восстановить самоопределение коренных американцев и позволить им самоуправление и администрирование. В записке содержится просьба к Конгрессу отменить ряд принятых в последние десятилетия законов, ограничивающих автономию коренных американцев. Хотя некоторые лидеры Конгресса уже начали возражать, эта записка уже получила широкую поддержку среди коренных американцев, которые давно жаловались на отсутствие независимости и принудительную ассимиляцию со стороны правительства Соединенных Штатов."
 Stassen.10.d: "Энергичный президент Гарольд Стассен продолжал укреплять свое политическое господство над Республиканской партией, снимая ключевых консервативных республиканцев с различных должностей как в правительстве, так и в руководстве национальной партии. Это знаменует продолжающийся упадок консервативного крыла в партии, которое только недавно казалось готовым вытеснить умеренное и либеральное крыло Республиканской партии. Победа президента Стассена укрепила его сторонников и дала ему политический капитал для нейтрализации консервативной угрозы. Президент, похоже, готов претворить в жизнь свое видение страны при активной поддержке своей партии."
 Stassen.1.d: "Президент Гарольд Стассен завершил последний этап обширной кампании среди сельских фермерских сообществ по увеличению голосов. Президент, сын фермера из Миннесоты, стремится укрепить и расширить свою базу. Он снял озабоченность по поводу чрезмерных усилий правительства, пообещав всегда внедрять хорошее правительство, а не правительство для поддержки такой политики, как оппозиция. Во время остановки своей кампании президент рекламировал свою безупречную репутацию губернатора и то, почему он получил огромную поддержку от фермеров, отметив, что то, что он сделал, чтобы помочь фермерам Миннесоты, он сделает, чтобы помочь фермерам Америки."
 Stassen.6.d: "Решительным голосованием Конгресс одобрил план универсального базового дохода, отстаиваемый президентом Гарольдом Стассеном. План будет обеспечивать безработным, одиноким матерям двух и более детей фиксированный доход каждый месяц. Президент успешно доказал, что этот закон сократит бедность и защитит самых уязвимых в Америке. Принятие закона хвалит прогрессивные газеты, которые считают, что президент Стассен продемонстрировал свою приверженность борьбе с бедностью. Однако более консервативные газеты открыто осуждают этот акт, поскольку он заставляет налогоплательщиков дополнять и поощрять преступность и аморальность, растущие среди молодежи. Тем не менее, президент настаивает, что закон укрепит положение и принесет пользу всем американцам, особенно наиболее уязвимым детям."
 Stassen.5.d: "В своем самом смелом шаге президент Гарольд Стассен предложил план обеспечения всеобщего базового дохода для безработных и одиноких матерей в Соединенных Штатах. Согласно плану, более ста долларов в месяц будут отправляться одиноким матерям двух и более детей, которые не имеют работы. Президент заявил, что его план направлен на борьбу с бедностью, поддержку наиболее уязвимых слоев населения и обеспечение того, чтобы эти дети получали более качественный уход. Ожидается, что оппозиция будет ожесточенной со стороны членов обеих партий. Некоторые называют это предложение экстравагантными расходами, которые поощряют плохие решения, в то время как другие высказывают опасения, что оно будет способствовать аморальному поведению среди молодых женщин в стране. Президента это не пугает, и он вкладывает большую часть своего политического капитала в принятие законопроекта."
 Stassen.7.d: "Решительным голосованием Конгресс отклонил план универсального базового дохода, отстаиваемый президентом Гарольдом Стассеном. Этот план обеспечил бы безработным, одиноким матерям двух и более детей фиксированный ежемесячный доход. Президент утверждал, что этот закон сократит бедность и защитит самых уязвимых в Америке. Отказ от закона хвалят консервативные газеты, которые считают, что президент Стассен стремился подорвать основные американские фискальные принципы и мораль. Более прогрессивные газеты вызвали неоднозначную реакцию: одни хвалили президента за попытку принять закон, а другие утверждали, что закон не сделал достаточно для решения этих проблем. Со своей стороны, президент выступил с заявлением, в котором выразил разочарование. Многие аналитики считают, что президенту потребуется время, чтобы восстановить политическую поддержку после этого крупного поражения."
 Martin.1.d: "Президент Эдвард Мартин официально начал новую кампанию по расширению избирательных прав республиканцев в южных штатах. Президент отметил, что Демократическая партия в последние десятилетия приняла ряд государственных и местных законов, которые фактически лишили гражданских прав значительную часть населения и закрепили их политическую власть в этих штатах. Президент надеется, что его кампания привлечет больше южан к спискам избирателей и заставит власти отменить ограничительные меры. Многие газеты отмечают, что президент, по сути, стремится привлечь больше афроамериканцев к избирательным спискам и укрепить приверженность республиканцев гражданским правам. Южные газеты и некоторые консервативные газеты критикуют президента за вмешательство в дела местных сообществ."
 Martin.5.d: "Президент Эдвард Мартин в резко сформулированном заявлении открыто осудил нарушения при голосовании в южных штатах. Президент отметил, что десятилетия демократического господства в этих штатах в значительной степени обусловлены систематической политикой государственных и местных властей по установлению границ, которые не позволяют многим южанам, особенно меньшинствам и более бедным слоям населения, голосовать. Он призвал устранить эти препятствия во имя демократии. Группы за гражданские права все чаще хвалят президента, и многие республиканцы спокойно хвалят президента за его усилия по разрушению оплота демократов на юге. Некоторые, однако, полагают, что в конечном итоге президент может оттолкнуть лишь некоторые из наиболее консервативных элементов республиканской базы."
 Halleck.1.d: "Президент Чарльз Халлек встретился с главными республиканскими лидерами и членами Конгресса. По итогам встречи Президент обнародовал список новых назначений на должности в администрации и правительстве. Судя по списку, президент Халлек создает консервативную коалицию поддержки внутри Республиканской партии. Это указывает на сдвиг партии в сторону ее консервативного крыла и может означать новый политический переход для страны. Этот сдвиг заставил многих демократов и некоторых умеренных республиканцев в частном порядке выразить беспокойство по поводу того, в каком направлении движется президент."
 Halleck.10.d: "Произошел драматический поворот, когда президент Чарльз Халлек сформулировал свое неприятие кейнсианского консенсуса. Он утверждал, что экономические принципы, установленные Джоном Кейнсом в 1930-х годах, больше не действуют в современной глобальной экономике. Он отметил проблему инфляции, обременительных бюджетов и растущего государственного долга как признаки того, что послевоенный экономический подход терпит неудачу. Президент Халлек утверждал, что стране необходимо продолжить развитие свободного рынка и вывести правительство из экономики. Принятие консервативной экономики также указывает на консервативное влияние на президента и Республиканскую партию."
 Halleck.9.d: "Президент Халлек предложил законодательство и фискальную политику для укрепления доллара и его защиты. Он отметил, что доллар находится под угрозой инфляции и падения стоимости из-за государственных расходов. Он предложил федеральной резервной системе сосредоточить свои усилия на обеспечении стабильного доллара и обеспечении прозрачности для обеспечения фискальной безопасности доллара. Предложения указывают на то, что президент продолжит стремление к более консервативной, свободной рыночной экономике в Соединенных Штатах."
 MacArthur.1.d: "Президент Дуглас Макартур призвал Конгресс отменить Национальный закон об огнестрельном оружии. Законопроект, первоначально принятый в 1930-х годах, был направлен на регулирование приобретения определенного огнестрельного оружия. Закон требует, чтобы владельцы оружия регистрировались и платили налог. Президент отметил, что этот акт был призван обуздать бандитское насилие в эпоху запрета, но угроза давно миновала. Президент утверждает, что налоги и требования сделали владение оружием непомерно дорогим и в конечном итоге нанесли ущерб американским производителям. Что еще более важно, это сильно мешает американцам реализовать свои права на вторую поправку. Президент считает, что отмена закона отвечает интересам американцев и, что более важно, расширение доступности огнестрельного оружия пойдет на пользу национальной безопасности Соединенных Штатов."
 MacArthur.2.d: "На недавней пресс-конференции президент Дуглас Макартур призвал к резкому увеличению пособий для ветеранов. Президент сказал, что не понаслышке знает о жертвах и преданности американского бойца. Он добавил, что долг американского народа и правительства - обеспечить надлежащую заботу об этих людях. Он отметил, что случаи безработицы среди ветеранов напомнили ему о людях из «Бонусной армии» времен Первой мировой войны. Он сказал, что правительство должно действовать сейчас, чтобы гарантировать, что подобное событие не произойдет, когда американских солдат просят действовать против отчаявшихся ветеранов, не способных прокормить себя или их семьи."
 Macarthur.100.d: "Президент Дуглас Макартур обратился к Конгрессу с прощальным словом. В своей задумчивой речи президент Макартур отметил, что за свою долгую военную и политическую карьеру он несколько раз видел, как мир менялся. Он сообщил Конгрессу, что на протяжении всей своей блестящей карьеры он просто пытался выполнить свой долг. Он заявил, что, хотя у него может быть мало времени, последние годы он проведет, думая о своей службе США и вооруженным силам."
 MacArthur.5: "Президент Дуглас Макартур провел совещание высокопоставленных представителей федеральных правоохранительных органов. После встречи президент объявил, что решил нанести прямой удар по Ку-клукс-клану. Он обвинил организацию в увековечении насилия и беспорядков на юге Америки. Он заявил, что весь вес федерального правительства будет направлен против группы, пока она не будет искоренена и уничтожена. Многие газеты приветствовали жесткую позицию президента в отношении того, что многие считают группой ненависти. Южные газеты осудили эту акцию, назвав ее предлогом для федерального вмешательства во внутренние дела штатов."
 MacArthur.5.d: "Президент Дуглас Макартур провел совещание высокопоставленных представителей федеральных правоохранительных органов. После встречи президент объявил, что решил нанести прямой удар по Ку-клукс-клану. Он обвинил организацию в увековечении насилия и беспорядков на юге Америки. Он заявил, что весь вес федерального правительства будет направлен против группы, пока она не будет искоренена и уничтожена. Многие газеты приветствовали жесткую позицию президента в отношении того, что многие считают группой ненависти. Южные газеты осудили эту акцию, назвав ее предлогом для федерального вмешательства во внутренние дела штатов."
 MacArthur.6.d: "Президент Дуглас Макартур объявил, что направит всю мощь федерального правительства против Ку-клукс-клана. Группа ненависти приобрела известность в последние годы из-за актов насилия, направленных против афроамериканцев и групп за гражданские права. Недавние громкие нападения, приписываемые этой группе, заинтересовали президента, который рассматривает эту группу как восстание против правительства Соединенных Штатов. Этот шаг в основном приветствуется американцами, заинтересованными в восстановлении правопорядка. Тем не менее, многие официальные лица южных штатов осудили эту акцию, назвав ее чрезмерным выходом за грани закона и заявив, что они более чем способны справиться с этой группой."
 MacArthurCivilRights.1.d: "Президент Дуглас Макартур заявил о своей поддержке расширения прав голоса южных штатов, а также местного законодательства, ограничивающего избирательные права афроамериканцев и более бедных белых. Президент добавил, что такие законы неконституционны и направлены против основных прав американских граждан. Он также добавил, что эти законы представляют угрозу для Соединенных Штатов, и он был готов предоставить федеральному правительству всю полноту власти для обеспечения защиты прав граждан."
 MacArthurCivilRights.2.d: "Губернатор Арканзаса Орвал Фобус недавно усилил свое несогласие с недавним постановлением Верховного суда, приказав подразделениям Национальной гвардии Арканзаса не допускать темнокожих студентов к интеграции в Центральную среднюю школу Литл-Рока. Верховный суд постановил, что сегрегация является неконституционной, и постановил объединить все школы. В последние дни президент Дуглас Макартур резко отреагировал на то, что он назвал прямым вызовом федеральному правительству, направив в город элитные воздушно-десантные войска. Было объявлено суровое военное положение, и войска Национальной гвардии были принудительно разоружены. Пока войска защищали учеников, посещающих школы, толпы противников интеграции нарушали правила военного положения, что приводило к ожесточенным столкновениям с солдатами. Поступают сообщения о том, что в результате этой решительной федеральной акции было ранено и убито несколько протестующих."
 MacArthurCivilRights.5.d: "Президент Дуглас Макартур приказал объявить военное положение в штатах Дикси. Президент отметил, что многие из этих бывших штатов Конфедерации либо отказывались, либо сопротивлялись, либо затягивали выполнение законов о гражданских правах и недавних постановлений федерального суда. Власти штата уклоняются от ответственности перед нацией и гражданами Соединенных Штатов. Президент будет федерализовать подразделения Национальной гвардии, развернет воинские части и будет использовать федеральные агентства для надзора за исполнением всех законов. Президент добавил, что меры будут временными, и как только этим штатам будет доверено выполнение своих обязательств, меры будут отменены. Эта новость шокировала страну: некоторые осудили деспотичный подход, в то время как другие рассматривают его как первый шаг к окончательному завершению восстановления."
 Russel_Court_Packing.2.d: "Соединенные Штаты погрязли в дебатах после обнародования президентом Ричардом Расселом нового плана добавления судей в Верховный суд. Хотя консерваторы в Конгрессе, похоже, взволнованы такой перспективой, более либеральные элементы осуждают президента за попытки политизировать судебную систему для своих собственных элементов. Аналитики предсказывают, что президенту предстоит тяжелая битва в Конгрессе. Все зависит от того, какая сторона может привлечь на свою сторону самых умеренных."
 Russel_Court_Packing.3.d: "Президент Ричард Рассел приветствовал известие о том, что Конгресс передал свое предложение об увеличении числа судей в Верховном суде. Президент объявил, что в ближайшее время пришлет имена кандидатов в судьи. Президент назвал голосование победой демократии и восстановлением судебной власти ее предназначенной роли. Противники закона осудили его как неприкрытый акт президента, стремящегося укрепить свою власть над судебной системой. Многие либеральные газеты утверждают, что новый закон знаменует собой серьезное поражение демократии в стране. Консерваторы по всей стране в восторге от этих новостей и верят, что их точка зрения, наконец, будет услышана."
 Russel_Court_Packing.4.d: "Конгресс не смог принять недавнее предложение президента Ричарда Рассела о добавлении судей в Верховный суд. Президенту и его союзникам по Конгрессу не удалось собрать достаточное количество избирателей, особенно со стороны более умеренных конгрессменов. Президент выразил разочарование по поводу голосования, назвав его неудачей для американского народа. Из-за неудачных попыток президент израсходовал большую часть своего политического капитала, и ему нужно будет восстановить свою поддержку. Результат - серьезная неудача для консерваторов в Соединенных Штатах."
 Southern_Manifesto_Russel.2.d: "President Richard Russell gave an address on the recently unveiled Southern Manifesto. The document, signed almost exclusively by Democrat senators and congressmen from southern states and two Republicans condemns recent Supreme Court rulings calling for the integration of schools and other public places. The President offered his support for the document and claims the Supreme Court has overstepped its jurisdiction by ruling on integration. He called for the court to respect the way Americans wish to live by. The document notes the constitution does not address integration or education and the court has overstepped its boundaries. Although many southern newspapers support the document, the reaction across the country has been largely negative with many accusing the President of overtly favoring white southerners."
 Russel.5.d: "Президент Ричард Рассел высоко оценил успешную отмену постановления Верховного суда относительно Брауна против Совета по образованию. Президент заявил, что первоначальное постановление было явно судебным злоупотреблением, и его аргументация была построена на шатких основаниях. Он похвалил возвращение к судебному здравомыслию и защиту американцев контролировать свои собственные дела, особенно образование детей. Первоначальное постановление призывало к интеграции сегрегированных школ после того, как выяснилось, что афроамериканские дети были лишены сегрегированных школ. Переворот широко осуждается либеральными газетами и активистами за гражданские права, которые обвиняют президента в использовании исполнительных и федеральных ресурсов для лишения усилий по прекращению расовой дискриминации на юге страны."
 Russel.4.d: "Президент Ричард Рассел заявил о своей безоговорочной поддержке губернатора Арканзаса Орвала Фобуса. Губернатор отказался подчиниться недавнему постановлению Верховного суда в отношении Брауна против Совета по образованию. Постановление объявило сегрегацию неконституционным и призвало к интеграции школ. В результате эскалации губернатор приказал Национальной гвардии Арканзаса запретить темнокожим студентам посещать Центральную среднюю школу Литл-Рока. На президента оказывали давление с требованием выполнить постановление федерального суда, поскольку многие обвиняют губернатора в оспаривании федеральных властей. Однако президент в своем выступлении не только поддержал губернатора, но и исключил любые попытки использовать федеральные ресурсы. Он заявил, что морально не может действовать в соответствии с постановлением, которое, по его мнению, было неконституционным."
 Southern_Manifesto_Russel.1.d: "Президент Ричард Рассел выступил с обращением к недавно обнародованному Южному манифесту. Документ, подписанный почти всеми исключительно сенаторами-демократами и конгрессменами из южных штатов и двумя республиканцами, осуждает недавние постановления Верховного суда, призывающие к интеграции школ и других общественных мест. Президент поддержал документ и утверждает, что Верховный суд вышел за рамки своей юрисдикции, приняв решение об интеграции. Он призвал суд уважать образ жизни американцев. В документе отмечается, что конституция не касается интеграции или образования, и суд вышел за ее границы. Хотя многие южные газеты поддерживают этот документ, реакция по всей стране была в основном негативной: многие обвиняли президента в явной поддержке белых южан."
 Russel_Court_Packing.1.d: "Президент Ричард Рассел обнародовал свой план добавить судей в Верховный суд. Президент утверждал, что в настоящее время суду нужно больше судей, чтобы лучше отражать ситуацию в стране и гарантировать, что слишком большая власть не принадлежит горстке судей. Он заявил, что нынешний суд неподвижен и очень политизирован. Предложение встречает неоднозначную реакцию. Многие консервативные газеты поддерживают президента и его инициативу, однако более либеральные газеты называют это неприкрытой попыткой превратить судебную систему в консервативный институт."
 Brown_v_Board.10.d: "Президент Ричард Рассел громко осудил недавнее знаменательное решение Верховного суда по дело Брауна против Совета по образованию. Верховный суд постановил, что идея раздельных, но равных школ, неконституционна, и постановил объединить все школы. Хотя решение широко приветствуется афроамериканцами и сторонниками гражданских прав, оппозиция президента рассматривается как беспрецедентная. Президент заявил, что суды вышли за рамки своих полномочий и вмешиваются в американский образ жизни. Он также отметил, что решение суда заставить большинство согласиться с меньшинствами создает плохой прецедент на будущее. На вопрос, будет ли он использовать федеральные ведомства для выполнения постановления, президент заявил, что не собирался этого делать."
 MacArthurCivilRights.3.d: "Президент Дуглас Макартур решительно отреагировал на недавние попытки губернатора Арканзаса развернуть силы Национальной гвардии штата для предотвращения интеграции школ в Арканзасе. Это было нарушением недавнего постановления федерального суда о прекращении интеграции. Элитные воздушно-десантные войска были быстро переброшены в Арканзас, где они разоружили Национальную гвардию и ввели военное положение. Попытки сторонников сегрегации организовать протесты и перекрыть дороги были резко прерваны сообщениями о погибших. Президент решительно утвердил федеральную власть в этом кризисе."
 MacArthurCivilRights.4.d: "Президент Дуглас Макартур приказал объявить военное положение в штатах Дикси. Президент отметил, что многие из этих бывших штатов Конфедерации либо отказывались, либо сопротивлялись, либо затягивали выполнение законов о гражданских правах и недавних постановлений федерального суда. Власти штата уклоняются от ответственности перед нацией и гражданами Соединенных Штатов. Президент будет федерализовать подразделения Национальной гвардии, развернуть воинские части и использовать федеральные агентства для надзора за исполнением всех законов. Многие страны хвалят американских союзников за рубежом, в то время как противники Соединенных Штатов считают, что эти действия указывают на хрупкость американской системы."
 MacArthurCivilRights.6.d: "Объявление военного положения в южных штатах вызвало негативную реакцию диксикратов как в Конгрессе, так и в штатах. Многие сенаторы, лидеры Конгресса и губернаторы осудили действия президента. Они назвали военное положение неконституционным. В ответ президент Дуглас Макартур приказал ФБР арестовать многих высокопоставленных лидеров Диксикрата за разжигание беспорядков. Президент добавил, что аресты будут способствовать исполнению федеральных законов. Хотя некоторые хвалят эту акцию, многие газеты ставят под сомнение законность и жесткую позицию президента."
 Moderate_Hero_Wallace.1.d: "Джордж Уоллес выиграл недавние выборы губернатора Демократической партии в Алабаме. Ему почти гарантирована победа на предстоящих выборах. Уоллес придерживался умеренной платформы с одобрения NAACP. Его противник, Джон Паттерсон, придерживался просегрегационной платформы и, по слухам, пользовался полной поддержкой Ку-клукс-клана. Однако перед выборами он был арестован ФБР за его связи с организацией и попытки подавить выполнение федеральных законов о гражданских правах. Многие хвалят Уоллеса, и его победа считается признаком перемен в южной политике."
 Warren_HC.1.d: "Президент Эрл Уоррен недавно завершил обширную поездку по ключевым штатам, рекламируя свои планы по обеспечению всеобщего здравоохранения для всех американцев. Во время своего визита президент говорил о важности предоставления всем американцам равных возможностей пользоваться преимуществами великих достижений в области медицины. Во многих обращениях он напоминал американцам, что вернувшиеся с Второй мировой войны военнослужащие столкнулись с множеством трудностей, особенно с медицинскими расходами. Он отметил, что если бы в Соединенных Штатах была обеспечена всеобщая медицинская помощь, эти солдаты были бы защищены и не остались бы с расходами, от которых они страдают по сей день. Противники плана утверждают, что он финансово невыполним и возложит на американское общество огромное бремя по его финансированию. Они также считают, что закон также будет препятствовать медицинским инновациям. Ожидается, что в ближайшее время в Конгрессе состоится голосование."
 Warren_HC.2.d: "Конгресс США одержал крупную политическую победу и одобрил всеобщий план здравоохранения президента Эрла Уоррена. Президент потратил много политического капитала и времени, чтобы обеспечить принятие закона, который обеспечит всем американским гражданам доступ к медицинским услугам. Голосование было близким, и оппоненты впоследствии продолжали предупреждать о финансовых затратах, однако президент, как говорят, в восторге. В заявлении, сделанном после голосования, президент Уоррен отметил, что он не прошел такое же голосование, как губернатор, но теперь может сдержать свое обещание тем семьям, которые сталкиваются с ужасным финансовым бременем из-за медицинских расходов. Этот акт беспрецедентен для Соединенных Штатов, и многие газеты наполнены как поддержкой, так и осуждением нового закона."
 Warren_HC.3.d: "Серьезным политическим ударом стало то, что Конгресс Соединенных Штатов не одобрил план всеобщего здравоохранения президента Эрла Уоррена. Президент потратил много политического капитала и времени, чтобы обеспечить принятие закона, который обеспечил бы всем американским гражданам доступ к медицинским услугам. Однако опасений по поводу цены и чрезмерного вмешательства правительства было слишком много. Президент выступил с заявлением, в котором выразил разочарование в связи с неудачей. Он отметил, что в ближайшие десятилетия медицинские расходы будут становиться все более сложными и обременительными для семей, и Конгресс действовал исходя из краткосрочных соображений. Многие общенациональные газеты разделились по поводу этого закона, и есть сильные передовые статьи, как восхваляющие закон, так и осуждающие Конгресс."
 Dem_Eisenhower.10.d: "Президент Дуайт Эйзенхауэр провел переговоры с ведущими лидерами южных демократических партий. Встреча состоялась, поскольку президент стремится сохранить единство Демократической партии. Южные демократы все больше отдаляются от остальной партии по вопросу о гражданских правах. Многие в СМИ называют фракцию южных демократов «диксиратами». Диксираты поддерживают сегрегацию и выступают против федеральных усилий по обеспечению соблюдения гражданских прав в южных штатах. Президент Эйзенхауэр, вероятно, будет стремиться развеять опасения, что Конгресс примет законы, направленные против определенных практик, однако он, скорее всего, подчеркнет, что судебные постановления будут выполняться федеральным правительством. Демократическая партия надеется, что переговоры как минимум снизят напряженность и укрепят лояльность партии к будущим выборам, поскольку президента Эйзенхауэра очень уважают на юге."