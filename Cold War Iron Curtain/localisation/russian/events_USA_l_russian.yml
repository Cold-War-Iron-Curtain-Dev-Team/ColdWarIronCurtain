 usa_flavor.4.d: "Today marks the release of the film “They Shoot Horses, Don’t They?” based on a 1935 novel of the same name by Horace McCoy.\n\nDirected by Charlie Chaplin and starring his son alongside a young Marilyn Monroe in a Great Depression-era dance marathon, trying to survive. The film has had mixed reviews and is still struggling in the box office, even past the threat of Hollywood purges and communist witch-hunting.\n\nAmong the public it remains a rousing success, perfectly encapsulating the story and ideals of the novel written over 20 years ago."
 usa_flavor.3.d: "Революционные изменения в мире комиксов.\n\nСегодня утром в совместном заявлении в своем журнале два гиганта отрасли объявили, что на следующей неделе они объединятся в Epic Comics.\n\nДва издателя столкнулись с экономическими проблемами после недавние ограничения, введенные президентом Кефовером. На полосе была показана обложка с изображением Супермена, сражающегося с Капитаном Америкой из Атласа, под названием «Событие, которое навсегда изменит историю!» количество выпусков следующего номера стремительно растет, и, к неудовольствию президента Кефовера, это может быть началом возрождения интереса к жанру супергероев среди американской молодежи."
 usa_flavor.2.d: "Известный криптограф, математик и инженер Клод Шеннон опубликовал статью под названием «Теория связи секретных систем» в Техническом журнале Bell System. Статья представляет собой рассекреченную версию отчета, который он представил в 1945 году, когда во время войны работал криптографом в правительстве США. Статья предлагает доказательство того, что все теоретические невзламываемые шифры должны иметь те же требования, что и метод шифрования, называемый одноразовым блокнотом. Шеннон также обсуждает криптографию с точки зрения теории информации — области, в которой он является пионером. Хотя эта статья не получила широкой известности, она служит основополагающим текстом современной криптографии."
 PBSUCCESS.50.d: "Левый режим в Гватемале укрепил свой контроль над страной и ввел драконовские меры, чтобы обуздать инакомыслие и организовать дальнейшую национализацию иностранных компаний в стране, особенно United Fruit Company, жизненно важной американской корпорации. ЦРУ ответило операцией PBSuccess, целью которой было установить радиопередачи и вселить страх и панику среди гватемальцев. В этой хаотичной обстановке гватемальские военные с их проамериканским и антикоммунистическим руководством смогли бы сплотить даже проправительственных офицеров, чтобы вмешаться и положить конец режиму Джейкоба Арбенса. Однако этот план провалился. Как только просочились новости о предстоящем развертывании советских войск, президент смог приказать военным Соединенным Штатам вторгнуться в Гватемалу, чтобы восстановить демократию и защитить американских граждан и собственность в стране при поддержке американского народа."
 watergate.1.d: "Президент Никсон поручил своему Генеральному прокурору Джону Митчеллу стать председателем вновь созданного Комитета по переизбранию президента (КПП). Митчелл ушел в отставку со своей должности в кабинете министров и будет осуществлять надзор за деятельностью КПП. В состав КПП входят высокопоставленные финансовые сторонники, политические союзники и советники президента для обеспечения его переизбрания. Советник президента Джон Дин и отставной агент ФБР Гордон Лидди, играют ключевую роль в организации. Ожидается, что они будут держать президента в курсе событий и помогать направлять конкретные действия. Организация будет работать над сбором средств на проведение кампании, более эффективным их распределением, расследованием и противодействием тактике Демократической партии. Противники президента, уже называют КПП различными оскорбительными названиями."
 watergate.2.d: "На недавнем заседании найвысшего уровня Комитета по переизбранию президента (КПП) бывший агент ФБР Гордон Лидди предложил провести обширную шпионскую кампанию против Демократической партии. Председатель КПП Джон Митчелл отверг эту идею как нереальную. На следующей встрече Лидди предложил гораздо более урезанную версию плана, призывая к прослушиванию телефонных разговоров и фотографированию агитационных документов в национальном штабе Демократической партии. Митчелл и Президентский советник Джон Дин должны рассмотреть вопрос о том, должны ли они одобрить предложение, поскольку Президент не может быть уведомлен. Лидди добавил, что планировал привлечь к реализации плана консультанта Белого дома и бывшего агента ЦРУ Говарда Ханта, опытного оперативника."
 watergate_alt.1.d: "После получения одобрения и тайного финансирования от Комитета по переизбранию президента (КПП) Гордон Лидди и Джон Дин работали над сбором команды. Лидди привел Говарда Ханта, который в свою очередь, собрал команду бывших сотрудников ЦРУ и ФБР. Группа ворвалась в Национальный штаб Демократической партии, расположенный в комплексе Уотергейт в Вашингтоне, округ Колумбия. Не обнаружив кого-либо, группа смогла прослушать телефоны председателя Демократической партии и его главного советника. Из-за нехватки времени было сделано немного фотографий документов. Тем не менее, прослушивание телефонных разговоров предоставило неоценимую информацию для КПП. Они узнали подробности об избирательном финансировании, стратегиях и приоритетах финансирования Демократической партии. С этим избирательным преимуществом КПП уверен в победе президента Никсона. Команда, которая провела прослушивание, получит вознограждение за хорошо выполненную работу."
 watergate.3.d: "После получения одобрения и тайного финансирования от Комитета по переизбранию президента (КПП) Гордон Лидди и Джон Дин работали над сбором команды. Лидди привел Говарда Ханта, которыйв свою очередь, собрал команду бывших сотрудников ЦРУ и ФБР. Группа ворвалась в Национальный штаб Демократической партии, расположенный в комплексе Уотергейт в Вашингтоне, округ Колумбия. Не обнаружив кого-либо, группа смогла прослушать телефоны председателя Демократической партии и его главного советника. Тем не менее, прослушивание телефонных разговоров председателя провалилось, и пришлось сделать второй взлом. На этот раз охранник заметил клейкую ленту на дверях, что в итоге вызвало у него подозрения. Он вызвал полицию, и оперативники не были предупреждены, так как их охранник не заметил, как полицейские в штатском входят в здание. Впоследствии пять оперативников в здании были арестованы полицией. Местная пресса уже расследует этот странный взлом."
 watergate.4.d: "Старшие члены Комитета по переизбранию президента (КПП) и советник президента Джон Дин проинформировали президента Никсона о неудачной операции в Уотергейте. Президент Никсон особенно обеспокоен, поскольку полиция нашла контактную информацию Говарда Ханта среди арестованных оперативников. Хант - известный консультант по безопасности в Белом доме, поэтому разоблачение его причастности вызовет подозрения. Президент склонен пойти с большинством из присутствующих на встрече, чтобы начать немедленное сокрытие и отрицание участия КПП или Белого дома. Преимущество этого состояло бы в том, чтобы препятствовать тому, чтобы это стало основной сюжетной линией выборов. Другой вариант - просто признать роль КПП в грабеже, обвинить в этом чрезмерно увлеченных членов группы и отстранить их. Это сохранит рейтинг президента, но может оказаться дорогостоящим для выборов."
 watergate.5.d: "Одним из первых вопросов, стоящих перед сокрытием, является сохранение публичного заявления о том, что Комитет по переизбранию президента (КПП) не причем в скандале в Уотергейте. Председатель КПП, бывший генеральный прокурор Джон Митчелл особенно обеспокоен своей женой Мартой Митчелл. Марта сделала себе имя публично откровенной светской персоной. Марта в настоящее время находится в Калифорнии, но Джон Митчелл сообщил чиновникам администрации Никсона, что, когда она узнает подробности об Уотергейте, она поймет участие КПП, поскольку один из арестованных был бывшим семейным телохранителем. Ее телохранитель Стив Кинг на месте, и мы должны решить, следует ли нам пытаться не позволять ей публично выступать в течение по крайней мере недели, чтобы уменьшить снежный ком СМИ. Другой вариант - позволить ей выступать и просто преуменьшить ее высказывания как эксцентричные."
 watergate.6.d: "Администрация Никсона поручила телохранителю Марты Митчелл, бывшего агента ФБР Стива Кинга, задержать ее в Калифорнии и отключить от средств массовой информации и телефона. Однако ей удалось выяснить подробности Уотергейтского скандала и в конце концов позвонить журналистке. Она заявила, что разведется со своим мужем, если он не покинет администрацию Никсона из-за их роли в краже со взломом. Звонок был прерван Кингом, который разорвал телефонную линию. Когда они это сделали, она утверждала, что ее держали против ее воли и сильно накачали, чтобы она не разговаривала со СМИ. Однако ее претензии превратили ее историю в шутку для многих в стране. Среди сильнейших сторонников Никсона, заявления о принудительном задержании и применении наркотиков кажутся надуманными, несмотря на вещественные доказательства, которые она представила журналистам."
 watergate.7.d: "С тех пор, как проникновение в Уотергейт дошло до средств массовой информации, «Вашингтон пост» уделяет особое внимание расследованию потенциальных связей Белого дома. Репортеры Боб Вудворд и Карл Бернштейн возглавили дело, разрабатывая источники в Белом доме и расследуя происхождение денег, отданных задержанным грабителям. Высокопоставленные представители администрации уже давно осознали, насколько Вашингтон пост сосредоточена на своем расследовании, и предложили два способа справиться с ними. Одним из них является активная дискредитация и преследование «Вашингтон пост» как предвзятого издательства. Большинство других СМИ, похоже, не заинтересованы в Уотергейте, уделяя больше внимания избирательной кампании. Другой подход заключается в том, чтобы игнорировать документ и позволить им работать. Это продемонстрирует нашу беззаботность и может подтолкнуть газету к рассмотрению того, что их расследования могут оказаться не такими революционными, как они думают."
 watergate.8.d: "Конгрессмен с многолетним опытом, председатель банковского комитета Райт Патман, завершил расследование по делу Уотергейта. Патман взялся за расследование, изучив стодолларовые купюры, связанные с оплатой грабителям и пытаясь выяснить их происхождение. Тем не менее, Белый дом отрицает обвинения, утверждая, что расследование было политически мотивированным. Лидер меньшинства в Палате представителей Джеральд Форд сыграл главную роль, препятствуя расследованию, блокируя попытки вызвать представителей Белого дома в суд, что привело к неполному расследованию. Другие демократы также отказались помогать Патману, поскольку они чувствовали, что его расследование мешает избирательной кампании и оставляет партию открытой для обвинений в политической мотивации. Хотя Патману не удалось выяснить происхождение денег, газета «Вашингтон пост» и другие следователи сената в настоящее время изучают денежный след как средство найти связь Белого дома в Уотергейте."
 watergate.9.d: "Судья Сирика недавно вынес приговор осужденным по Уотергейтскому делу. Некоторые признали себя виновными, а другие были осуждены. Хотя Белый дом надеялся, что вынесение окончательного приговора ознаменует конец интереса к делу, похоже, интерес СМИ только увеличился. В ходе судебного разбирательства выяснились подробности денежного следа от Комитета по переизбранию президента к грабителям. Это усилило общественный интерес к этому делу и подтолкнуло СМИ к дальнейшему расследованию. Кроме того, в процессе было выявлено участие Говарда Ханта и Гордона Лидди. Оба - бывшие агенты разведки, уличенные в связи с Белым домом. Похоже, расследование и интерес средств массовой информации быстро усиливаются."
 watergate.10.d: "С учетом того, что осуждение Уотергейтских грабителей приводит лишь к увеличению количества СМИ и правительственного расследования по поводу причастности Белого дома, президент встретился со своими старшими советниками, чтобы спланировать следующий шаг. Президент и некоторые его советники склонны инициировать чистку, чтобы отстранить тех, кто сделал первоначальное сокрытие. По сути, план будет заключаться в сокрытии самого сокрытия и прекращении спекуляций об участии Никсона в \"Уотергейте\". Другая группа советников утверждает, что увольнение этих чиновников или их выдворение, только вызовет лищние подозрения, усилит общественную поддержку расследований, проводимых Конгрессом, и заставит Белый дом выглядеть виновным. Вместо этого, они предлагают всем оставаться на своих местах, а Белый дом вытеснит остальные спекуляции в СМИ."
 watergate.11.d: "Сенат недавно подавляющим большинством проголосовал за создание Уотергейтского комитета для расследования одноименного скандала. Высокопоставленные чиновники Белого дома, включая Джона Дина, дали показания, усиливая давление на Белый дом. На допросе помощник Белого дома Александр Баттерфилд сообщил, что в Белом доме установлена система магнитофонной записи. Специальный прокурор по данному делу Арчибальд Кокс быстро потребовал записи. Президент Никсон сослался на проблемы национальной безопасности и исполнительной привилегии и отказался. Теперь Кокс должен решить, примет ли он этот аргумент из Белого дома, фактически прекратив расследование, или же он откажется отозвать повестку в суд. Интерес конгресса и американского народа к выпуску кассет лишь растет."
 watergate.12.d: "Отказ Специального прокурора Арчибальда Кокса снять свою повестку по поводу записей Белого дома достиг точки кипения. Президент Никсон в пятницу предложил компромисс, где сенатор Стеннис выслушает и расшифрует записи для Специального прокурора. Однако Кокс отказался, и на следующий день Никсон приказал генеральному прокурору уволить его. Генеральный прокурор отказался, так как он пообещал съезду, что не будет вмешиваться и вместо этого подал в отставку. Затем заместителя генерального прокурора попросили уволить Кокса, и он тоже отказался и подал в отставку. Это оставлено на усмотрение Генерального солиситора, который выполнил просьбу об увольнении Арчибальда Кокса. Президент Никсон затем попытался свернуть расследование, но отставки и увольнение вызвали гнев общественности, конгресса и судебных органов в отношении Белого дома. Вместо этого будет выбран новый специальный прокурор Леон Яворский. Белый дом надеется, что он ограничит свое расследование, а не расширит его, как пыталась сделать Кокс."
 watergate.13.d: "Вопрос об обнародовании кассет не закончился увольнением Арчибальда Кокса. Его замена, Леон Яворский, уволился следом за своим предшественником и не завершил расследование, как надеялся президент Никсон. Вместо этого вопрос о выдаче кассет Белого дома был передан в Верховный суд. В ошеломляющем поражении Президента Суд проголосовал против Никсона и его требований. Суд распорядился обнародовать записи для Специального прокурора. Белый дом согласился, и первые записи показали, что Никсон одобрил сокрытие и планы Джона Дина расплатиться с участниками Уотергейта. Однако записи не показывают, был ли президент Никсон осведомлен о выплатах с самого начала или даже о заговоре до того, как он произошел. Несмотря на это, выпуск лент - большой удар для Никсона и его команды."
 watergate.14.d: "Белый дом незаметно выпустил ранее не выпущенную ленту всего через несколько дней после взлома. В ленте президент Никсон узнает о том, как грабители получают деньги от своей кампании, и соглашается с планами сокрытия. Он соглашается сказать ЦРУ связаться с ФБР, чтобы прекратить расследование, поскольку президент не мог предсказать их расследование. Многие утверждают, что это обсуждение указывает на прямое участие Никсона в скандале с Уотергейтом и прямую попытку вмешаться в расследование. В своей защите Белый дом отмечает, что ЦРУ справедливо пришло к выводу, что взлом не был угрозой национальной безопасности, и президент Никсон в конечном итоге приказал ФБР завершить тщательное расследование. Несмотря на это, явное доказательство причастности президента Никсона к сокрытию с самых первых дней подорвало его политическую позицию и легитимность."
 watergate.15.d: "Выпуск ленты Smoking Gun наряду с другими действиями президента Никсона и его штаба привел делегацию лидеров Конгресса к визиту президента. Высокопоставленные лидеры Конгресса республиканцев сообщили президенту, что они ожидают, что три статьи импичмента легко пройдут через Палату представителей и Сенат. Республиканские лидеры заявили, что президент едва ли сможет получить четверть голосов в Палате представителей, а его положение в Сенате было еще хуже. Опросы также показали, что общественность также отвернулась от президента,и у него осталось два варианта. Один из них-уйти в отставку и избежать унижения в виде голосования по импичменту и суда в Сенате. Другой вариант-отказаться, остаться у власти и быть насильственно отстраненным от власти, возможно, американский народ поддержит его, когда он столкнется с гневом Конгресса."
 watergate.26.d: "В национальном телеобращении к нации, президент Никсон объявил о своем намерении уйти в отставку с поста президента. Никсон выразил сожаление, что не закончит свой срок полномочий и заявил, что его отставка отвечает интересам нации. Он выразил надежду на то, что его решение поможет Америке преодолеть полемику вокруг Уотергейта и исцелит страну. На следующий день, Никсон и его семья попрощались с сотрудниками Белого дома. Затем они вылетели на вертолете в авиабазу Эндрюс, после чего были доставлены в свой дом в Калифорнии. После многих лет споров и шокирующих откровений, бурное президентство подошло к концу."
 watergate.16.d: "Гамбит президента Никсона остаться на своем посту, несмотря на потерю поддержки Конгресса, закончился неудачей. Американский народ не сплотился за президента Никсона, и обе палаты Конгресса быстро осудили его по всем трем обвинениям. Президент будет официально отстранен от должности и теперь будет открыт для судебного преследования. Многие полагают, что его преемник, вероятно, простит Никсона, хотя нет никаких гарантий, что это произойдет. Президент сказал, что он уважает действия Конгресса и начнет подготовку к освобождению офиса как можно скорее."
 watergate.17.d: "\nПосле того, как президент Никсон перестал быть в должности, вице-президент Спиро Агнью принял присягу президента. Президент Агнью недавно пережил собственный коррупционный скандал и смог сохранить свою позицию. Популярный политик из Мэриленда и ветеран Второй мировой войны, надеется, что он сможет объединить американский народ и возглавить новую кампанию национального единства. Никсон выбрал Агнью в качестве своего напарника из-за его центристских политических взглядов, и теперь кажется, что стране понадобится такой человек, чтобы восстановить престиж исполнительной власти и принять закон."
 watergate.18.d: "\nПосле того, как президент Никсон перестал быть в должности, вице-президент Джеральд Форд принял присягу президента. Президент Форд, умеренный бывший конгрессмен, принял вице-президентство у Спиро Агнью, который подал в отставку после обвинений в коррупции. Никсон выбрал Форда из-за его лояльности к партии и безупречной репутации в обоих палатах Конгресса. Президент Форд указал своим друзьям, что он планирует принести президентство национального исцеления и восстановить доверие к офису и республиканской партии. Может ли он достичь этого, еще неизвестно."
 watergate.19.d: "Поскольку президент Никсон больше не находится в должности, спикер палаты представителей Карл Альберт принял присягу президента. Хотя спикер палаты является третьим в очереди на пост президента, в настоящее время должность вице-президента пустует. Бывший вице-президент Спиро Агнью недавно подал в отставку на фоне обвинений в коррупции, не связанных с Уотергейтским скандалом. Эта должность не была занята из-за препятствий со стороны демократов во время слушаний по утверждению вице-президента. Задержки были такими, что Никсон не смог подтвердить Вице-президента во время его отставки. В беспрецедентном шаге президентство впервые перешло к спикеру палаты. Республиканцы особенно возмущены тем, что спикер - демократ, а республиканцы обвиняют демократов в том, что они затягивают слушания по утверждению, чтобы украсть президентство. Президент Альберт считает, что стране нужен сильный защитник закона и конституции, и именно этим он и был."
 watergate.25.d: "Недавнее расследование, проведенное прокурором США в штате Мэриленд по поводу коррупции в округе Балтимор, в последнее время резко изменилось. Хотя последний год Агнью занимал должность в округе, один из обвиняемых утверждал, что давал взятки Агнью после того, как тот стал вице-президентом. Президент Никсон встретился с Агнью, чтобы обсудить обвинения, которые Агнью решительно отверг. Агнью также выступил перед СМИ и публично объявил о своей полной невиновности по обвинению. Он сказал, что любые деньги, которые он получал, предназначались для взносов в избирательную кампанию и ничего больше. Тем не менее, средства массовой информации и прокурор по-прежнему сосредоточены на расследовании дела Агнью и на попытках раскрыть и доказать обвинения против него."
 watergate.20.d: "В связи с усилением расследования в отношении вице-президента Спиро Агнью он решил посетить спикера палаты представителей Карла Альберта, чтобы обсудить, защищает ли его статус вице-президента от судебного преследования. Администрация Никсона тихо сообщила Агнью, что, если обвинения имеют какую-либо правду или оказываются слишком отвлекающими, он должен подумать о том, чтобы поступить правильно и уйти в отставку. Спикер Альберт мог сказать Агнью, что Конгресс может защитить его от судебного преследования. Тем не менее, спикер Альберт, глубоко преданный конституционалист, знает, что Конгресс проводил расследование в отношении вице-президента в начале девятнадцатого века, что станет прецедентом, который Конгресс может использовать. Он заявил, что Конгресс не имеет права вмешиваться в дела судов. Если демократ Альберт скажет Агнью, что он может быть обвинен, Агнью придется уйти в отставку, если нет, Агнью может попытаться остаться."
 watergate.21.d: "После переговоров со спикером палаты представителей и усиления давления со стороны средств массовой информации вице-президент Агнью решил уйти в отставку. Даже после того, как он недавно говорил с большой аудиторией в Калифорнии и объявил о своей невиновности. Он также пришел к соглашению с прокурором и согласился на соглашение о признании вины, согласно которому он не будет отбывать срок тюремного заключения, но будет вынужден не участвовать в выборах и выплатит штраф. В ответ президент Никсон написал письмо, в котором он похвалил бывшего вице-президента за его огромный патриотизм и преданность Соединенным Штатам. Он заявил, что отставка была сделана для защиты страны и устранения отвлекающих факторов в исполнительной власти. Члены Конгресса были шокированы этой новостью, и президент Никсон надеется, что Конгресс вскоре утвердит нового вице-президента."
 watergate.22.d: "\nПосле отставки вице-президента Белый дом предложил Джеральда Форда Конгрессу, который будет утвержден в качестве вице-президента. Выбор Форда, кажется, умный, поскольку он с превосходной репутацией. Тем не менее, на первых слушаниях некоторые демократы отметили роль, которую Форд сыграл в прекращении работы комитета Патмана. До сих пор Форд не отрицал своей роли в замедлении этого расследования, заявляя, что это было частью его обязанностей в качестве меньшинства в Палате представителей. Представители демократов обратились к спикеру палаты Карлу Альберту с предложением. Без вице-президента это оставило бы Белый дом для Альберта, если Никсон подаст в отставку. Тем не менее, Альберт, строгий конституционалист, разрывается от этой идеи и считает моральным преступлением, что он не поддерживает Форда. Однако он знает, что ему, возможно, придется принять решительные меры в интересах страны."
 brown_v_board.2.d: "Верховный суд принял знаменательное решение по делу Браун против Совета по образованию. Суд отклонил отдельную, но равную доктрину и единогласно постановил, что расовая сегрегация детей в государственных школах является неконституционной. Суд установил, что даже при отсутствии разницы в качестве наличие отдельных помещений по своей сути является неравным и нарушает четырнадцатую поправку. В этом деле Оливер Браун подал иск против школьного совета Топики за отказ разрешить своей дочери посещать высококачественную и географически более близкую школу для белых по сравнению с более далекой школой для черных. Судебное решение требует, чтобы все школы немедленно начали интеграцию, и отменяет любую правовую защиту сегрегации. Активисты NAACP и движения за гражданские права в восторге от решения, в то время как белые южные политики, выступающие за сегрегацию, уже выражают возмущение по поводу этого решения."
 CIA_60s.1.d: "Вчера вечером 30-го мая «Шевроле Бель Эйр», принадлежавший El Jefe, был перехвачен машиной, полной вооруженными людьми, когда он направлялся в Сан-Кристобаль из Санто-Доминго. Транспортное средство преследователей следовало за машиной Трухильо по пустынному шоссе и преследовало его, прежде чем открыть огонь из поставляемых ЦРУ карабинов М1. Когда шофер остановил поврежденную машину Трухильо, остановившуюся на обочине шоссе, машина, в которой находились вооруженные люди, остановилась перед ним и преградила ему дорогу. Между боевиками и вооруженным Трухильо вместе с его шофером началась интенсивная, хотя и односторонняя перестрелка. В конце концов, Трухильо был ранен, пытаясь сбежать из своей изрешеченной пулями машины, и его застрелили посреди улицы. Затем вооруженный человек упаковал его тело в их машину и унесся в ночь, оставив обломки и кровь для местной полиции."
 CIA_60s.2.d: "С продолжением нашей невмешательской повестки дня в отношении левых, диктующих нашу внешнюю политику, ЦРУ сочло необходимым сместить президента Эквадора Хосе Веласко. ЦРУ только пришли к такому выводу после упорного сопротивления Веласко против политики США. ЦРУ проникло в структуру политических организаций в Эквадоре, охватывая все политические масштабы, отодвигая всех граждан от поддержки коммунистов на Кубе и антиамериканских взглядов. Они также начали электронный мониторинг своих сетей в Эквадоре. Получив всю необходимую необходимую информацию, ЦРУ приступило к отстранению Веласко от должности президента Эквадора. С эквадорскими вооруженными силами на стороне ЦРУ, у Веласко не было иного выбора, кроме как уйти с поста. Веласко был заменен его вице-президентом, Карлосом Аросеменой, фигурой, более снисходительной к американской политике."
 Wallace.1.d: "В результате выборов весьма спорный президент [USA.GetLeader] взошел на высшую должность в Соединенных Штатах. Вновь избранный чиновник утверждал, что будет порядок в его Соединенных Штатах. Президент [USA.GetLeader] подписал исполнительный указ, объявляющий военное положение в городских районах. В том же обращении он хвастался, что «провел черту в пыли против преступников», далее заявляя, что «привлечение вооруженных сил Соединенных Штатов является самым верным способом искоренить незаконную деятельность, совершаемую этими коммунистами и нежелательными американцами».'"
 usa.cubaninter: "Мы начинаем процесс, который повлияет на предстоящие выборы на Кубе."
 intervene_in_cuban_elections: "Вмешательство в выборы на Кубе"
 intervene_in_cuban_elections_desc: "Мы можем выбрать, вмешиваться ли нам в предстоящие выборы на Кубе, чтобы получить желаемый результат и тем самым сохранить порядок на Американском континенте."
 usa.6.t: "Кубинская проблема"
 usa.6.d: "Президентские выборы на Кубе должны состояться в ближайшее время. Согласно опросам, победу на выборах одержит кандидат от левого крыла. У нас есть три варианта, что нам делать?"
 usa.1.d: "С 1959 года Эйзенхауэр пишет свое последнее заявление для публики. Сегодня он, наконец, выступил с ним. \nРекция была «торжественным моментом в решительно неоправданное время», предупредив нацию о «легкомысленном процветании, увлеченной молодостью и гламуром, и стремящейся к легкой жизни». Несмотря на то, что он был политиком с военным прошлым и единственным генералом, избранным президентом в 20-м веке, он, как известно, предупреждал нацию в отношении разрушительного влияния того, что он называет «военно-промышленным комплексом». Он также выразил свою наибольшую обеспокоенность коррупцией научного процесса в рамках этой централизации финансирования в федеральном правительстве."
 usa.2.d: "В деле Hernandez v. Texas, 347 US 475, Верховный суд в постановлении, вынесенном судьей Эрлом Уорреном, постановил, что американцы мексиканского происхождения и все другие группы граждан в Соединенных Штатах пользуются равной защитой в соответствии с 14-й поправкой к Конституции США. Это был первый случай, когда мексиканско-американские адвокаты предстали перед Верховным судом США. Это решение рассматривается как расширение защиты групп меньшинств внутри страны и признание того факта, что группы, помимо чернокожих, могут подвергаться дискриминации."
 usa.700.t: "Помощь КНР"
 usa.700.d: "КНР попросила нас о помощи в их делах. Должны ли мы вмешаться и помочь им?"
 usa.700.a: "Да, конечно!"
 usa.700.b: "Нет, с чего бы это?"
 usa.701.t: "Объединение Австрии"
 usa.701.d: "Народ Австрии снова хочет быть свободной и независимой страной. Она может служить буферным государством между востоком и западом. Разрешим ли мы это?"
 usa.701.a: "Да, конечно!"
 usa.701.b: "Нет, мы оставляем землю себе."
 usa.702.t: "Принять КНР в ООН"
 usa.702.d: "Китайская Народная Республика хочет быть признанной в ООН. Китайская Республика стала очень слабой после гражданской войны, поэтому мы должны поддержать большую и сильную нацию, которой сейчас является Китайская Народная Республика."
 usa.702.a: "Да, конечно!"
 usa.702.b: "Нет, они должны держаться подальше."
 swf.100.t: "Президент Никсон убит!"
 swf.100.d: "Поступают сообщения о том, что вчера президент Соединенных Штатов Америки Ричард Никсон был убит бомбой, заложенной под президентским лимузином. В то время как во время президентского парада в Вашингтоне, округ Колумбия, лимузин взорвался примерно в 22:34, Вашингтон быстро обвинил возможных российских агентов КГБ, и СССР так же быстро опроверг обвинения, заявив, что «это не наша проблема, если американский народ не любит капиталистический империализм\". Вице-президент Генри Кэбот Лодж III немедленно принял присягу."
 swf.101.t: "35-й президент США убит!"
 swf.101.d: "Джон Ф. Кеннеди, 35-й президент Соединенных Штатов, был убит вчера, в 12:30. в Далласе, штат Техас, во время поездки по Дили Плаза. Кеннеди ехал со своей женой Жаклин, губернатором Техаса Джоном Коннелли и женой Коннелли, Нелли, и был смертельно застрелен бывшим морским пехотинцем США Ли Харви Освальдом. Десятимесячное расследование, проведенное Комиссией Уоррена с ноября 1963 года по сентябрь 1964 года, пришло к выводу, что Освальд действовал один, стреляя в Кеннеди, и что Джек Руби также действовал один, когда он убил Освальда, прежде чем он предстал перед судом. Смерть Кеннеди ознаменовала четвертое (после убийств Линкольна, Гарфилда и Маккинли) и последнее убийство американского президента. Вице-президент Линдон Б. Джонсон автоматически стал президентом после смерти Кеннеди."
 civil_rights.2.t: "[GetNewspaperHeader]Закон о гражданских правах обременен, проблемы в конгрессе"
 civil_rights.2.d: "Хотя большинство в обеих партиях проголосовало за законопроект, были заметные исключения. Несмотря на то, что он выступал против принудительной сегрегации, сенатор-республиканец от штата Аризона Барри Голдуотер проголосовал против законопроекта, отметив: «Вы не можете издавать законы о морали». Голдуотер поддержал предыдущие попытки принять законодательство о гражданских правах в 1957 и 1960 годах, а также 24-ю поправку, запрещающую налог на избирательные участки. Он заявил, что причиной его несогласия с законопроектом 1964 года стал Раздел II, который, по его мнению, нарушает свободу личности и права штатов. Демократы и республиканцы из южных штатов выступили против законопроекта и возглавили безуспешную 83-дневную обструкцию, включая сенаторов Альберта Гора старшего и Дж. Уильяма Фулбрайта, а также сенатора Роберта Берда, который лично пилил 14 часов подряд."
 civil_rights.3.t: "[GetNewspaperHeader]Закон о гражданских правах принят! Конгресс в кризисе!"
 civil_rights.3.d: "Несколько сенаторов южных штатов подняли шум и выразили протест против принятия и подписания законопроекта о гражданских правах, в результате чего весь конгресс оказался в хаосе. Сенаторы начали призывать к отрыву от Соединенных Штатов, заявляя, что «это не является частью нашего видения как страны\". Пытаясь снизить напряженность в сенате, президент приказал закрыть несколько государственных учреждений и организаций. Несколько южных штатов призывают к проведению референдума. Военное положение было объявлено в южных штатах по указу президента."
 civil_rights.4.t: "[GetNewspaperHeader]Слишком много напряженности на Конгресс"
 civil_rights.4.d: "В результате принятия бескомпромиссного законопроекта, принудительного закрытия правительства по распоряжению президента и усиления конкуренции, оскорблений и недопонимания, а также военного положения, предписанного президентом, несколько южных штатов официально объявили о своих намерениях выйти из состава Соединенных Штатов Америки, заявив, что «это не наше американское видение и не наш законный президент. Президент не действует как диктатор, и это именно то, что мы имеем». Президент пытался призвать к мирным решениям и переговорам, но отделяющиеся штаты отказались отвечать или даже слушать его. уровень готовности вооруженных сил был повышен, и вся национальная гвардия и армия были мобилизованы."
 civil_rights.5.t: "[GetNewspaperHeader]Акт о гражданских правах подписан!"
 civil_rights.5.d: "2 июля 1964 года 88-й Конгресс Соединенных Штатов принял акт о гражданских правах, который вступил в силу немедленно и объявил вне закона дискриминацию по признаку расы, цвета кожи, религии, пола или национального происхождения. Запрещено неравное применение требований к регистрации избирателей, расовой сегрегации в школах, занятости и общественных помещениях. Тем не менее, законопроект разделяет и ставит под угрозу долгосрочные изменения в поддержке обеих сторон. Президент осознал, что поддержка этого законопроекта может привести к потере подавляющей поддержки Юга со стороны Демократической партии. Генеральный прокурор Роберт Кеннеди и вице-президент Джонсон настаивали на введении новой редакции законодательства о гражданских правах. Джонсон сказал помощнику Кеннеди Теду Соренсену: «Я знаю, что риски велики, и мы можем потерять Юг, но эти штаты могут быть потеряны в любом случае»."
 civil_rights.6.t: "[GetNewspaperHeader]Марш на Вашингтон"
 civil_rights.6.d: "В среду, 28 августа 1963 года, от 200 000 до 300 000 человек вышли на Вашингтон, и, по оценкам, 75–80% участников марша были чернокожими. Марш был одним из крупнейших политических митингов за права человека в истории Соединенных Штатов, и целью марша была защита гражданских и экономических прав афроамериканцев. На марше Мартин Лютер Кинг-младший, стоящий перед Мемориалом Линкольна, произнес свою историческую речь «У меня есть мечта», в которой он призвал положить конец расизму. После марта спикеры отправились в Белый дом для краткого обсуждения предлагаемого законодательства о гражданских правах с президентом Кеннеди. Кеннеди смотрел речь Кинга по телевизору и был очень впечатлен. Март считается «триумфом управляемого протеста», и Кеннеди тоже чувствовал, что это его победа, что повышает шансы на его законопроект о гражданских правах."
 civil_rights.7.t: "[GetNewspaperHeader]Марши от Сельмы до Монтгомери"
 civil_rights.7.d: " Вдоль 54-мильной трассы от Сельмы, штат Алабама, до столицы штата Монтгомери, с 7 по 25 марта 1965 года были проведены три марша протеста. Первый марш состоялся 7 марта 1965 года и был организован на местах Бевелем, Амелией Бойнтон и др. Солдаты штата и окружные послеменники напали на безоружных демонстрантов с помощью клюшек и слезоточивого газа и это событие стало известно как кровавое воскресенье. Второй марш состоялся 9 марта. Солдаты, полиция и участники демонстрации противостояли друг другу на окраине моста, но когда солдаты отошли в сторону, чтобы пропустить их, Кинг привел участников марша обратно в церковь, выполняя федеральный судебный запрет. Третий марш начался 21 марта. Под защитой 1900 военнослужащих Национальной гвардии штата Алабама, находящихся под федеральным командованием, и многих агентов ФБР и федеральных маршалов, участники марша проходили в среднем 10 миль (16 км) в день по маршруту США 80, достигнув Монтгомери 24 марта, и Капитолий штата Алабама 25 марта."
 tonkin.1.t: "[GetNewspaperHeader]USS Maddox был атакован!"
 tonkin.1.d: "2 августа 1964 года в Тонкинском заливе эсминец USS Maddox во время выполнения разведывательного патрулирования в рамках операций DESOTO преследовался тремя торпедными катерами Северо-Вьетнамского флота 135-й торпедной эскадрильи. Мэддокс произвел три предупредительных выстрела, и северьетнамские катера атаковали торпедами и пулеметами. Мэддокс потратил более 280 3-дюймовых и 5-дюймовых снарядов в морском сражении. Один самолет США был поврежден, три северо-вьетнамских торпедных катера были повреждены, и четыре северо-вьетнамских моряка были убиты, еще шесть ранены. Среди моряков эсминца не было жертв. 4 августа Мэддокс и Тернер Джой вышли в еще один патруль в рамках DESOTO у северо-вьетнамского побережья, чтобы «показать флаг» после первого инцидента. Вечером и в раннее утро из-за непогоды и сильного моря эсминцы получали радиолокационные, сонарные и радиосигналы, которые, как они полагали, сигнализировали о еще одном нападении северо-вьетнамского флота. Несмотря на утверждение военно-морского флота о том, что два атакующих торпедных катера были потоплены, на месте предполагаемого сражения не было обломков, тел погибших северо-вьетнамских моряков или других вещественных доказательств."
 taft.1.t: "Изоляционизм или интернационализм?"
 taft.1.d: "В рамках одного из своих предвыборных обещаний я пообещал вывести Соединенные Штаты из НАТО и меньше вмешиваться в дела мира. Нам нужно меньше вмешиваться в мир и вернуться к нашему изоляционистскому государству, как это было до Второй мировой войны. Однако это может сделать Европу уязвимой для полчищ коммунизма, и у СССР появится открытый мир для распространения своих коммунистических идеалов. Если мы останемся в изоляции, то мы надеемся, что нас не втянут в третью мировую войну. Какой должна быть внешняя политика США?"
 taft.1.a: "Изоляционизм нужен для мира."
 taft.1.b: "Коммунизм стал слишком большой угрозой. Интернационализм нужен."
 taft.2.t: "[GetNewspaperHeader]США объявляют о прекращении членства в НАТО."
 taft.2.d: "Соединенные Штаты сегодня объявили о своем отстранении от командования НАТО и своем членстве в нем. Президент Тафт заявил, что он больше не желает вмешиваться в иностранные дела и делать то, что лучше для американского народа. Тафт также сказал, что он хотел бы вступить в новую эру американского процветания, которая придет с изоляционизмом. Другие члены НАТО потрясены и сейчас находятся в чрезвычайном совете, чтобы обсудить будущее НАТО и свободного мира. СССР сказал, что они желают лучшего для США, а также сказал, что их изоляционистская политика поможет миру."
 taft.2.a: "Что будет со Свободным миром?"
 usa.500.d: "Кампания террора Марка Эссекса против полиции Нового Орлеана завершилась 7 января в результате 11-часового разгрома в отеле Говарда Джонсона на проспекте Лойолы, где он убил семь человек, включая трех полицейских, и ранил восемь. Неделей ранее он убил двух других полицейских и ранил одного. Он скрывался от полиции в течение недели, пока не ранил бакалейщика из Герт Тауна, а затем направился к Говарду Джонсону. Стрельба Эссекса закончилась на крыше отеля, где он умер от 200 огнестрельных ранений."
 usa.501.d: "Массовое убийство безоружных вьетнамских граждан американскими войсками в Южном Вьетнаме! Ранее этим утром около 100 американских солдат прибыли на поиски и уничтожение партизан Вьетконга. Вместо этого они нашли тихую деревню, заполненную в основном женщинами, детьми и стариками. За этим последовала ужасная резня. Американские солдаты систематически преследовали и убивали перепуганных, безоружных жителей деревни, насилуя женщин и сжигая дома по пути. Еще до конца дня 504 вьетнамских деревенских жителя были убиты в ходе так называемой резни в Ми-лае, названной так в честь одной из деревень Сон-Ми."
 castle_bravo.1A: "\"Касл Браво\" первые испытания высокоэффективного термоядерного оружия, проведенные Соединенными Штатами на атолле Бикини, Маршалловы Острова, в рамках операции \"Касл\". Это устройство было самым мощным ядерным устройством, взорванным Соединенными Штатами,и его первым термоядерным оружием на основе дейтерида лития. Выход Касл-Браво составил 15 мегатонн тротила, что в 2,5 раза превышает прогнозируемые 6,0 мегатонн, из-за непредвиденных дополнительных реакций с участием 7Li, которые привели к неожиданному радиоактивному загрязнению районов к востоку от атолла Бикини."
 mccarthy.1.t: "Враги внутри"
 mccarthy.1.a: "Волнительно"
 USA_70s_The_CIA: "Операции ЦРУ"
 cia.20.d: "Тревожные новости пришли из США. Ряд тайных, а порой и незаконных проектов Федерального бюро расследований США (ФБР), направленных на слежку, проникновение, дискредитацию и подрыв деятельности внутриполитических организаций, были раскрыты неизвестным лицом. Записи ФБР показывают, что ресурсы COINTELPRO были нацелены на группы и отдельных лиц, которых ФБР считало подрывными, включая коммунистическую партию США, организаторов Антивьетнамской войны, активистов движения За гражданские права или движения за черную власть, феминистские организации, движения за независимость (такие как пуэрто-риканские группы независимости, такие как молодые лорды) и различные организации, которые были частью более широких новых левых. Программа также была нацелена на группы белых сторонников превосходства, включая Ку-Клукс-Клан, и националистические группы, включая ирландских республиканцев и кубинских эмигрантов."
 USAkorea.4.d: "Президент Гарри С. Трумэн освободил генерала Дугласа Макартура от его многочисленных военных обязанностей, прежде всего Верховного главнокомандующего союзными державами и главнокомандующего американскими войсками на Дальнем Востоке. Трумэн потребовал, чтобы Макартур передал свои полномочия генерал-лейтенанту Мэтью Риджуэю, сославшись на его неспособность оказать искреннюю поддержку политике правительства США и Организации Объединенных Наций в вопросах, касающихся его официальных обязанностей."
 cultural_events.1.d: "Сегодня вечером, 5 апреля 1980 года, в Гонолулу, Гавайи, состоится финальный эпизод знаменитой полицейской драмы. Hawaii Five-O знаменитая полицейская драма теперь носит титул самой продолжительной полицейской драмы с выходом в эфир эпизода 279, положившему конец историям капитана Стива МакГаррета, Дэнни Уильямса, Чин Хо Келли, Коно Калакауа и Дюка Лукелы."
 cultural_events.2.d: "Сегодня Нью-Йорк изо всех сил пытается взять себя в руки после 2-дневного Нью-Йоркского блэкаута, длившегося с 13 по 14 июля. Начиная с комбинации удара молнии и перегрузки атомной электростанции, которая привела к тому, что самый большой генератор в Нью-Йорке вышел из строя и обесточил весь город. Поскольку электричество не было восстановлено до конца следующего дня, молодые люди ворвались в магазины, используя автомобили, сильно пострадавшие от Краун-Хайтс и Бушвика, причем многие из них пострадали от поджогов."
 cultural_events.3.d: "Сегодня на собрание Ку-Клукс-Клана из Южной Каролины напали 500 человек из племени Лумби после того, как Джеймс Коул, лидер ККК в этом районе, начал кампанию запугивания против Лумби после получения ограниченного федерального признания. После того, как ККК разместился на сочувствующем фермерском поле, люди Лумби окружили ККК и продолжили кричать и атаковать ККК, стреляя в членов клана, члены клана попытались открыть ответный огонь, но потерпели неудачу и закончили тем, что 4 члена клана были ранены, а остальные бежали, оставив свою семью, свою систему громкой связи и неосвещенный крест. Вместе с депутатами округа Роберсон депутаты и шерифы разогнали празднование Лумби гранатами со слезоточивым газом."
 book_releases.1.d: "8 июня 1949 года Джордж Оруэлл опубликовал антиутопический роман \"1984\". Действие происходит в далеком 1984 году, в центре его внимания три мегалитических государства и их постоянная, постоянно меняющаяся война друг с другом и с собственным народом. В начале 1950-х годов Великобритания оказывается втянутой в Третью мировую войну, на этот раз с применением ядерного оружия, подобного тому, что было применено над Японией в 1945 году. Британия впадает в гражданскую войну, и авторитарная английская Социалистическая партия, или Ингсок, выходит победителем. В авторитарном государстве мысли контролируются, история пересматривается, и культ личности усатого старшего брата царит безраздельно."
 kef.2.d: "Золотой век комиксов в США длился с 1938 по 1945 год, и его конец ознаменовался резким упадком комиксов о супергероях. Новые жанры, такие как криминальные комиксы и комиксы ужасов, вызвали возмущение утверждениями о том, что эти комиксы вдохновляют незаконное поведение среди несовершеннолетних, известное как подростковая преступность. Сенат поручил подкомитету Сената Соединенных Штатов по делам несовершеннолетних расследовать эти утверждения. Печально известные слушания по комиксам состоялись 21 апреля, 22 и 4 июня 1954 года и оказали глубокое влияние на будущее комиксов, причем вкус графических изображений в комиксах был поставлен под сомнение. Публикация книги \"соблазнение невинных\" настроила общественное мнение против комиксов и дала индустрии неблагоприятное освещение в прессе, фактически заставив их принять Кодекс комиксов, навязав им самоцензуру и приведя к жесткой цензуре или даже отмене многих давних серий комиксов. Последствия этого еще не полностью ощутимы, но уже ясно, что это сокрушительный удар для уже борющейся американской индустрии комиксов."
 little_rock.1.d: "Девять афроамериканских студентов были приняты в Центральную среднюю школу Литл-Рока под защитой 101-й воздушно-десантной дивизии. После дела \"Браун против Совета директоров\" Национальная ассоциация по улучшению положения цветных людей зарегистрировала девять учеников для посещения Центральной средней школы Литл-Рока: Минниджин Браун, Элизабет Экфорд, Эрнест Грин, Тельма Мотершед, Мелба Паттильо, Глория Рэй, Терренс Робертс, Джефферсон Томас и Карлотта Уоллс, которые вскоре стали известны как \"Девятка Литл-Рок\". Губернатор штата Арканзас Орвал Фобус вызвал Национальную гвардию, чтобы помешать им. А изображения их бедственного положения были распространены в мировых средствах массовой информации, привлекая большое международное внимание. Массовые беспорядки и протесты вынудили отчислить студентов. После этого президент Эйзенхауэр принял важное решение о развертывании 1200 человек из 101-й воздушно-десантной дивизии, чтобы обеспечить безопасность студентов. Несмотря на постоянные преследования в течение всего года, такой поворот событий представляет собой значительный шаг вперед в усилиях по десегрегации по всей территории США."
 kef.10.d: "Сегодня было произведено огромное количество арестов и расследований, поскольку федеральное правительство объявило общенациональные репрессии против несовершеннолетних правонарушителей, ссылаясь на быстрый рост преступлений, связанных с молодежью, за последнее десятилетие. По данным Министерства юстиции,количество преступлений, связанных с молодежью, с годами возросло. Таким образом, закон и порядок не могут быть поддержаны, и несовершеннолетние правонарушители подвергаются слабому обращению со стороны судебной системы. Организации по защите гражданских прав осуждают этот акт, поскольку он посягает на права молодежи и очень склонен к злоупотреблениям."
 kef.7.d: "Американская Медицинская Ассоциация сегодня попала под огонь критики, поскольку в последнее время циркулируют сообщения о том, что ее доноры, в основном крупные фармацевтические и медицинские компании, повлияли на ее политику и лоббистские программы, сделав их соучастниками коррупционных скандалов и конфликтов интересов. Скандал, связанный с высшими эшелонами организации, недавно получил огромные суммы пожертвований, половина из которых идет им самим, а половина-организации, в обмен на благосклонность и влияние в политике организации. Американская Медицинская Ассоциация еще не ответила, но наблюдатели утверждают, что это будет иметь далеко идущие последствия в будущем."
 kef.3.d: "Президент Соединенных Штатов Эстес Кефаувер недавно получил высокую оценку различных организаций по защите гражданских прав, поскольку президент приступает к масштабной кампании по защите гражданских прав, призывая к расширению прав и возможностей меньшинств и их интеграции в американское общество. В своей привилегированной речи Кефаувер сказал, что американский народ обязан относиться ко всем одинаково, независимо от расы, религии, сексуальности и других аспектов, и судить о людях исключительно по характеру человека, а не по цвету кожи. Однако это вызвало негативную реакцию со стороны различных групп белых сторонников превосходства по всей стране, осуждающих его действия и требующих немедленного отказа."
 sab_army_mc.1.d: "Слушания по делу Маккарти были приостановлены до дальнейшего уведомления сегодня, поскольку недавние доказательства, показывающие некомпетентность различных военных чиновников в этих слушаниях, фактически не дают им права судить Джозефа Маккарти, одного из самых видных сенаторов Вашингтона, который попал под спор за публикацию документов, касающихся предполагаемых коммунистических чиновников в правительстве США. Такое развитие событий является большой победой для сенатора, поскольку он может, наконец, продолжить свой так называемый \"крестовый поход против коммунизма\", фразу, придуманную его различными сторонниками. Наблюдатели говорят, что если Маккарти продолжит такой крестовый поход, мы увидим не только более антикоммунистическую Америку, но и более недемократическую Америку."
 cultural_events.9.d: "Мировое сообщество увидело смерть одного из своих великих, невоспетых защитников сегодня, когда английский криптограф Алан Тьюринг был найден мертвым в том, что кажется актом самоубийства; доктор Тьюринг, 41 год, считается родоначальником современной компьютерной науки и сыграл немалую роль в взломе\" Энигмы \" нацистских немецких кодов пупка, ключевую роль, которая помогла военным усилиям союзников в битве за Атлантику среди других; гомосексуалисты гомосексуалисты, как полагают, потенциально ответственны за спасение свыше 14 миллионов жизней и даже сокращение продолжительности Второй мировой войны на целых два года, британское правительство быстро дистанцировалось от смерти Тьюринга, однако, поскольку гомосексуальные законы на Британских островах таковы, каковы они есть, Тьюринга заставили предстать перед судом за преступление гомосексуализма, а криптограф был приговорен к химической кастрации менее чем за десять лет до его безвременной кончины.\nКакие бы споры ни преследовали Тьюринга в жизни, в смерти, его будут помнить как острие копья в сердце военной машины Оси и ключевую фигуру в спасении Британии, Европы и, по сути, всего мира от фашизма и тирании."
 kef.8.d: "В своей пламенной речи перед Конгрессом американский президент Эстес Кефаувер публично осудил Южный Манифест. Подписанный в марте 1956 года в ответ на Браун против Совета, он является главной базой Южной оппозиции все более настойчивым федеральным усилиям по десегрегации. Его речь была встречена с разной реакцией, от похвалы до обвинений в измене, даже членами его собственной Демократической партии. В связи с тем, что президент посвятил себя делу десегрегации, напряженность в отношениях с теми, кто выступает за сохранение статус-кво, значительно возросла. Сам Кефаувер теперь сталкивается с широкой оппозицией со стороны диксикратов в своей партии, хотя это частично компенсируется растущей поддержкой тех, кто симпатизирует движению за гражданские права. Однако ясно одно: процесс десегрегации Американского общества значительно ускорился в результате этих событий , и южным странам, возможно, придется принять дующие им навстречу ветры перемен."
 phi_events.2.d: "Насилие и гражданские беспорядки свирепствуют по всей Маниле и всему Филиппинскому архипелагу, поскольку различные студенческие активисты, гражданские группы и оппозиционные фракции, большинство из которых имеют прямые связи с Коммунистической партией Филиппин, организуют демонстрации и протесты, осуждающие правление президента Фердинанда Маркоса и его предполагаемых американских хозяев. Распространились сообщения о том, что эти демонстрации быстро переросли в крупномасштабное насилие, поскольку эти демонстранты уже атаковали различные правительственные районы, такие как Мендиола, который находится в непосредственной близости от дворца Малакананг, официальной резиденции президента, и американского посольства, которое, по словам боевиков, является фактическим местом пребывания власти на Филиппинах. В ответ на такие акты насилия президент Фердинанд Маркос мобилизовал филиппинскую полицию и при необходимости насильственно разогнал демонстрации. С быстрым ростом гражданских беспорядков, наряду с коммунистической угрозой, достигающей академических кругов, наблюдатели предсказывают, что правительство Маркос введет радикальные меры для подавления восстания и коммунистической угрозы."
 phi_events.3.d: "23 сентября 1972 года президент Фердинанд Маркос только что подписал Прокламацию № 1081, президентскую прокламацию, объявляющую военное положение на всем Филиппинском архипелаге. По словам президента Маркос, военное положение было объявлено из-за упадка законности и порядка, наряду с постоянно растущей угрозой коммунизма, который быстро набирал обороты, утверждая, что они находятся в завершающих работах революционного восстания против его правительства. Однако оппозиционные группы утверждают, что подавляющее большинство террористических актов, с которыми столкнулись Филиппины, были организованы ближайшим окружением президента-военными генералами, чтобы посеять страх и террор среди населения, тем самым придав легитимность его заявлению. Тем не менее введение военного положения было быстрым, и Вооруженные силы Филиппин или ВСФ смогли обеспечить безопасность стратегических районов, наносящих ущерб режиму Маркоса, а также выполнение \"общих приказов\", отданных в связи с этим заявлением. Наблюдатели неоднозначно реагируют на это заявление, так как одни симпатизируют правительству, а другие критикуют его, веря в историю оппозиции."
 kef.9.d: "Решительным шагом президента Соединенных Штатов Кефаувера процесс выдвижения кандидатов от Демократической партии был радикально изменен в целях повышения эффективности процесса отбора кандидатов в президенты от Демократической партии. Традиционно кандидаты отбирались в основном тайно лидерами партий, что иногда приводило к отбору кандидатов, которые никогда не баллотировались в качестве делегатов на первичных выборах. Президент выдвинул руководящие принципы в отношении того, как следует отбирать кандидатов, быстро модернизируя процесс выдвижения кандидатов с учетом воли народа и эффективно заставляя государства выбирать своих делегатов через Президентские праймериз. Результатом этой реформы является то, что демократические избиратели играют гораздо большую роль в исходе выборов, чем раньше, и этот шаг забрал значительную часть власти из рук влиятельных политиков в руки народа. Теперь ясно, что будущие демократические кандидаты будут представлять народ больше, чем на предыдущих выборах. Еще предстоит выяснить, повлияет ли это на будущие выборы."
 adlai_civil.1.d: "7 мая Верховный Суд Соединенных Штатов вынес решение по знаковому делу \"Браун против Совета директоров\". Единогласно проголосовав всеми 9 членами суда, они согласились с тем, что раздельное образование рас является неконституционным, тем самым переписав дело Плесси против Фергюсона от 1897 года, в котором содержались законы о сегрегации. Дело началось с коллективного иска, поданного против Совета по образованию города Топика в Канзасе, который представлял Оливер Браун, и вскоре было рассмотрено Верховным судом. Их решение вызвало большие волнения на юге, рассматриваясь как угроза их традиционному порядку. В шокирующем шаге президента Адлая Стивенсона он отказался обеспечить соблюдение этого закона и заявил, что намерен разрешить это делать всем школам, которые хотят сохранить образовательную сегрегацию. Это решение вызвало большое возмущение со стороны либеральных элементов в Демократической партии, и раздаются разрозненные призывы к импичменту президента. Однако представляется маловероятным, что какой-либо из этих призывов осуществится, и позиции Юга, а также сегрегационистского движения значительно укрепились."
 truman_civil.1.d: "7 мая Верховный Суд Соединенных Штатов под председательством главного судьи Эрла Уоррена вынес решение по знаковому делу \"Браун против Совета директоров\". Единогласно проголосовав всеми 9 членами суда, они согласились с тем, что раздельное образование рас является неконституционным, тем самым переписав дело Плесси против Фергюсона от 1897 года, в котором содержались законы о сегрегации. Дело началось с коллективного иска, поданного против Совета по образованию города Топика в Канзасе, который представлял Оливер Браун, и вскоре было рассмотрено Верховным судом. Их решение вызвало большие волнения в южных штатах, которые рассматривались как угроза их традиционному порядку. Президент Трумэн всегда был известен как сторонник гражданских прав, приняв самый первый закон о десегрегации вооруженных сил в 1948 году. Неудивительно, что Трумэн объявил перед Конгрессом о своих намерениях немедленно ввести в действие это постановление по всей стране. Хотя это и вызвало значительные волнения на юге, фактическое сопротивление было ограниченным. Несмотря на разрозненные призывы к его импичменту со стороны Диксикратов внутри Демократической партии, никакой прочной базы оппозиции не сформировалось, и похоже, что президент не столкнется с существенными политическими угрозами в ближайшем будущем. Вопрос о том, как южные штаты будут справляться с этими быстрыми изменениями и адаптироваться к новому политическому климату, остается спорным."
 truman_civil.2.d: "Верховный суд Соединенных Штатов под председательством главного судьи Эрла Уоррена вынес вердикт по историческому делу Брауна против Совета. Единогласно проголосовав за всех 9 членов суда, они согласились с тем, что отдельное обучение рас было неконституционным, тем самым перезаписав дело Плесси против Фергюсона от 1897 года, в котором поддерживались законы о сегрегации. Дело началось с коллективного иска, поданного против Совета по образованию городом Топика в Канзасе, интересы которого представлял Оливер Браун, и вскоре было рассмотрено Верховным судом. Их решение вызвало большие волнения в южных штатах, поскольку оно рассматривалось как угроза их традиционному порядку. Президент Гарриман всегда был известен как сторонник гражданских прав, приняв самый первый закон о десегрегации вооруженных сил в 1948 году. Неудивительно, что Гарриман объявил перед Конгрессом о своем намерении немедленно обеспечить выполнение этого решения по всей стране. Вызвав значительные беспорядки на юге, фактическое сопротивление было ограниченным. Несмотря на разрозненные призывы к его импичменту со стороны диксикратов в Демократической партии, прочной базы оппозиции так и не сформировалось."
 kef.6.d: "В Соединенных Штатах Управление по контролю за продуктами питания и лекарствами было основано в 1906 году для содействия общественному здоровью посредством регулирования безопасности пищевых продуктов и различных медицинских инструментов. Поскольку законы, касающиеся общественного здравоохранения, постоянно обновляются, призывы расширить полномочия FDA усилились после окончания Второй Мировой Войны, и после избрания Кефаувера президентом он, казалось, был несколько готов провести реформы, чтобы еще больше расширить власть FDA. Недавно президент предложил законопроект, радикально расширяющий полномочия FDA в области общественного здравоохранения, и сегодня изменения были официально ратифицированы Конгрессом. Поскольку законопроект вступит в силу в ближайшие дни, изменения, вероятно, станут главным фактором в продолжающейся борьбе за улучшение общественного здравоохранения, хотя эти изменения вызвали критику со стороны тех, кто выступает против того, что они воспринимают как чрезмерное вмешательство правительства в жизнь американских граждан."
 kef.4.d: "7 мая Верховный Суд Соединенных Штатов под председательством главного судьи Эрла Уоррена вынес решение по знаковому делу \"Браун против Совета директоров\". Единогласно проголосовав всеми 9 членами суда, они согласились с тем, что раздельное образование рас является неконституционным, тем самым переписав дело Плесси против Фергюсона от 1897 года, в котором содержались законы о сегрегации. Дело началось с коллективного иска, поданного против Совета по образованию города Топика в Канзасе, который представлял Оливер Браун, и вскоре было рассмотрено Верховным судом. Их решение вызвало большие волнения на юге, рассматриваясь как угроза их традиционному порядку. Президент Кефаувер всегда был известен как борец за гражданские права и только через день после вынесения решения объявил перед Конгрессом о своих намерениях \"поддерживать это решение везде, где это возможно\". Хотя это всего лишь короткая речь, она представляет собой важный шаг для движения За гражданские права в Соединенных Штатах и, по-видимому, является решающим поворотным пунктом для сегрегации в Америке."
 kef.1.d: "В пламенной речи перед Конгрессом американский президент Эстес Кефаувер официально объявил войну итало-американской мафии, поклявшись искоренить ее и \"восстановить порядок\" в американских городах. Происходя главным образом из потомков итальянских иммигрантов, мафия приобрела известность в эпоху сухого закона и продолжает активно действовать во многих промышленных американских городах, таких как Чикаго, управляя обширной и хорошо организованной преступной сетью. До своего прихода на пост президента Кефаувер председательствовал на слушаниях в 1950 году, которые привлекли внимание всей страны к растущей проблеме организованной преступности, и после его избрания на пост президента многие ожидали, что он предпримет юридические действия по этому вопросу. До сих пор мафия сталкивалась с относительно небольшим сопротивлением со стороны правоохранительных органов в построении своей криминальной империи, но теперь кажется, что это скоро изменится. Реакция на выступление президента была различной, однако, по-видимому, существует явный контраст между теми, кто решительно выступает за подавление организованной преступности, и теми, кто предсказывает радикальные последствия конфликта с мафией для обществ районов, находящихся в непосредственной близости от неизбежного конфликта. Некоторые конгрессмены даже высказали предположение, что полностью искоренить устоявшуюся мафию может оказаться слишком сложно и это приведет лишь к дальнейшему конфликту, гневу и разрушению внутри городских общин. Независимо от последствий, этот амбициозный шаг будет иметь значительные долгосрочные последствия для жизни многих людей, но принесут ли эти попытки плоды, остается не понятно."
 adlai_civil.2.d: "Многие консервативные южные избиратели отделились от Демократической партии в 1948 году, чтобы сформировать партию Диксикратов, однако они плохо выступили на выборах 1948 года, и многие вернулись к демократам, что привело к концу Диксикратов. После избрания президентом Адлая Стивенсона многие бывшие Диксикраты были воодушевлены про-сегрегационистской политикой президента, и их влияние в партии быстро возросло. На протяжении всего срока его полномочий более вокальные Диксикраты открыто выступали за то, чтобы президент предпринял дальнейшие шаги по защите южных традиций и обеспечил соблюдение законов Джима Кроу на юге. В последнее время давление на президента со стороны Диксикратов внутри партии усилилось, что вызвало у президента много внутренних проблем и заставило его действовать. В ответ на это давление президент Адлай объявил перед Конгрессом о своем намерении поддержать законы Джима Кроу в южных штатах. Этот шаг немедленно вызвал протесты среди сторонников гражданских прав, и многие выразили озабоченность по поводу последствий этого для обращения с афроамериканцами на юге. Поскольку президент склоняется перед интересами Диксикрата, похоже, что движение за десегрегацию потерпело серьезное поражение."
