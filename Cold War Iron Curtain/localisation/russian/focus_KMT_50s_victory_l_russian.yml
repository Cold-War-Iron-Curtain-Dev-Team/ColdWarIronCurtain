 Appease_Warlords_Minor_TT: "Это §Gувеличит§! Лояльность военачальников, поскольку это действие защищает их интересы."
 Appease_Warlords_Moderate_TT: "Это §Gувеличит§! Лояльность военачальников, поскольку это действие отвечает их интересам."
 Appease_Warlords_Major_TT: "Это §Gзначительно увеличит§! Лояльность военачальников, поскольку это действие отвечает их основным интересам."
 uranium_concession_TT: "Передаст концессию на урановый рудник в Шаньтуне США, и мы также можем получить от этого некоторую сумму денег."
