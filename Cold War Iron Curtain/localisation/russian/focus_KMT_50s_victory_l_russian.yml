l_russian:
 KMT_Amend_the_Temporary_Provisions: "Внести изменения во Временные положения"
 KMT_Amend_the_Temporary_Provisions_desc: "Теперь, когда коммунистическое восстание подавлено, наши Временные положения могут быть изменены для того, чтобы Китай был мирным и больше не подвергался насилию."
 KMT_Republic_of_China_Armed_Forces: "Вооруженные силы Китайской Республики"
 KMT_Republic_of_China_Armed_Forces_desc: "Наши вооруженные силы должны стать сильными, чтобы служить маяком свободы, демократии и антикоммунизма во всем азиатском регионе!"
 KMT_The_Direction_of_the_Kuomintang: "Направление Гоминьдана"
 KMT_The_Direction_of_the_Kuomintang_desc: "Гоминьдан должен стать ведущей и главной политической партией во всем Китае. Необходимо, чтобы коммунисты были сдержаны."
 KMT_The_Tibetan_Situation: "Ситуация в Тибете"
 KMT_The_Tibetan_Situation_desc: "В Тибетском регионе раздаются голоса о независимости, революции, освобождении от оккупационных китайских сил. Мы сохранили их свободу, и это не пройдет."
 KMT_Reforming_the_National_Revolutionary_Army: "Реформирование Национально-революционной армии"
 KMT_Reforming_the_National_Revolutionary_Army_desc: "Наши славные революционные силы должны быть реформированы, чтобы объединить Китай и обеспечить порядок, мир и процветание в нашем новом демократическом обществе."
 KMT_The_Hyperinflation_Crisis: "Кризис гиперинфляции"
 KMT_The_Hyperinflation_Crisis_desc: "Инфляция нашей валюты зашла достаточно далеко! Мы начнем бороться с гиперинфляционным кризисом в Китае и восстановим нашу промышленность!"
 KMT_Establish_the_Institute_of_Nuclear_Energy_Research: "Создать Институт исследований ядерной энергии"
 KMT_Establish_the_Institute_of_Nuclear_Energy_Research_desc: "Ядерная энергия - это будущее, и очень важно, чтобы Китайская Республика как можно скорее приступила к созданию ядерных реакторов. Будет создан институт для содействия и расширения этих исследований."
 KMT_The_Indochina_Situation: "Ситуация в Индокитае"
 KMT_The_Indochina_Situation_desc: "Ситуация в Индокитае стремительно ухудшается, большая часть коренного населения Вьетнама и других стран восстала против французского колониального правительства. Мы должны тщательно выбрать свою сторону, чтобы сохранить мир в регионе."
 KMT_The_Legacy_of_the_Faustian_Bargain: "Наследие фаустовской сделки"
 KMT_The_Legacy_of_the_Faustian_Bargain_desc: "Мы выиграли гражданскую войну, но теперь нам предстоит решать новые проблемы. По определению фаустовской сделки, у нас теперь есть материковый Китай, но мы «продали душу» дьяволу, чтобы получить его. Это означает, что мы должны улучшить нашу новую страну."
 KMT_Repress_the_Bandits: "Подавить бандитов"
 KMT_Repress_the_Bandits_desc: "Бандиты и полевые командиры материкового Китая не будут и не могут быть действующими членами нового правительства. Они находятся в оппозиции к Гоминьдану и поэтому должны быть подавлены."
 KMT_Restoring_Rural_Order: "Восстановление порядка в сельской местности"
 KMT_Restoring_Rural_Order_desc: "Необходимо восстановить порядок в сельских регионах Китая, тех, которые особенно подвержены нападению местных полевых командиров или коммунистов, не лояльных новому правительству. Мы сделаем все от нас зависящее, чтобы обеспечить безопасность и спокойствие в наших сельских регионах."
 KMT_Combat_Opium_Usage: "Борьба с употреблением опиума"
 KMT_Combat_Opium_Usage_desc: "Опиум - это опасный и смертельный наркотик, который был введен европейскими державами и вверг нас в международную войну, междоусобицу и разруху. Мы должны остановить использование этого наркотика любой ценой, чтобы защитить нашу новую нацию."
 KMT_Tolerate_Gambling_and_Prostitution: "Терпимость к азартным играм и проституции"
 KMT_Tolerate_Gambling_and_Prostitution_desc: "Азартные игры и проституция - необходимые пороки, которые обеспечат средства к существованию и соблюдение законов нашего населения и предоставят необходимые рабочие места для казино и секс-индустрии."
 KMT_Ban_Prostitution: "Запретить проституцию"
 KMT_Ban_Prostitution_desc: "Проституция - это грех, и она должна быть предотвращена любой ценой! Все публичные дома, бордели или дома дурной славы, особенно в наших городах, должны быть закрыты, а все работники будут подвергнуты серьезным лекциям и/или штрафам."
 KMT_Promote_Christian_Missionary_Activity: "Содействовать христианской миссионерской деятельности"
 KMT_Promote_Christian_Missionary_Activity_desc: "Признавая преимущества и добрую волю, которые дает христианская вера, мы позволим миссионерам въезжать в Китай и распространять слово Божье среди всех, кто желает его услышать."
 KMT_Suppress_Ethnic_Seccessionists: "Подавление этнических сепаратистов"
 KMT_Suppress_Ethnic_Seccessionists_desc: "Те, кто хочет отделиться от нашей великой и скромной нации, должны быть предотвращены любой ценой. Мы хотим быть едиными, а не разделенными; все, кто выступает против руководства гоминьдановского правительства, будут задержаны как политические диссиденты."
 KMT_Launch_Sinicization_Campaign: "Запуск кампании по синификации"
 KMT_Launch_Sinicization_Campaign_desc: "Распространение исконно китайской культуры является самой важной из наших образовательных кампаний, и мы сделаем все возможное, чтобы ассимилировать коренные народы с нашей культурой и уникальным китайским образом жизни."
 KMT_Support_The_Viet_Quoc: "Поддержать Вьеткуок"
 KMT_Support_The_Viet_Quoc_desc: "ВьетКуок, также известная как Вьетнам Куок Дан Данг или VNQDD, является вьетнамской националистической партией, известной своими антифранцузскими настроениями. Мы будем поддерживать наших братьев в Индокитае в их борьбе против зла колониализма!"
 KMT_Assasinate_Viet_Minh_Leaders: "Убийство лидеров Вьетнама"
 KMT_Assasinate_Viet_Minh_Leaders_desc: "Вьет Мин известен тем, что также выступает за независимость, но его идеология ближе к коммунистической. Чтобы защитить наших союзников, некоторые лидеры Вьет Мина должны быть «убраны», чтобы сохранить власть VNQDD в регионе."
 KMT_The_White_Terror: "Белый террор"
 KMT_The_White_Terror_desc: "Наше положение стало тяжелым; некоторые противники режима Гоминьдана должны быть задержаны и допрошены об их идеологических мотивах; это делается для того, чтобы обеспечить лояльность и отсутствие оппозиции правящей партии нашего славного Китая!"
 KMT_Utilize_Organized_Crime_Connetions: "Использовать связи с организованной преступностью"
 KMT_Utilize_Organized_Crime_Connetions_desc: "Связи, которые наше правительство имеет с различными синдикатами и триадами, слишком ценны, чтобы их терять. С их поддержкой мы можем получить все, что захотим, и стать еще более могущественными!"
 KMT_Crackdown_on_Organized_Crime: "Борьба с организованной преступностью"
 KMT_Crackdown_on_Organized_Crime_desc: "Китайские организованные преступные семьи и организации должны быть искоренены. У нас не должно быть коррупции."
 KMT_Legitimize_Rural_Secret_Cults: "Легитимизация сельских тайных культов"
 KMT_Legitimize_Rural_Secret_Cults_desc: "Различные культы, такие как Общество желтого песка, должны быть узаконены и стать частью китайского общества."
 KMT_Crush_Secret_Societies: "Сокрушить тайные общества"
 KMT_Crush_Secret_Societies_desc: "Тайные общества являются чумой на этой земле и могут быть использованы для разжигания сопротивления или восстания против нашего режима. Мы не позволим им больше существовать."
 KMT_Instigate_Renewed_Nationalist_Insurgency: "Спровоцировать возобновление националистического восстания"
 KMT_Instigate_Renewed_Nationalist_Insurgency_desc: "Чтобы поддержать наших братьев во Вьетнаме, мы должны сделать все возможное, чтобы воплотить в жизнь идеалы национализма и свободы от французской тирании, чтобы помочь народу."
 KMT_Liquidate_Communist_Supporters: "Ликвидировать сторонников коммунистов"
 KMT_Liquidate_Communist_Supporters_desc: "Те, кто поддерживал предательских коммунистов, должны быть уничтожены, мы не можем иметь коллаборационистов в нашей среде."
 KMT_Pardon_Communist_Partisans: "Помилование коммунистических партизан"
 KMT_Pardon_Communist_Partisans_desc: "В конце концов, гражданская война закончилась, и мы должны сохранить некое подобие равенства; те, кто сражался на стороне коммунистов, будут помилованы, но за ними будут очень внимательно наблюдать."
 KMT_Commencen_the_Show_Trials: "Начать показательные испытания"
 KMT_Commencen_the_Show_Trials_desc: "Необходимо привести в пример тех, кто был замешан в сотрудничестве с японцами во время их вторжения и оккупации. Мы не потерпим здесь предателей!"
 KMT_Pardon_Japanese_Collaborators: "Помилование японских коллаборационистов"
 KMT_Pardon_Japanese_Collaborators_desc: "Мы должны подчеркнуть равенство, и теперь, когда Китай вступил в новую эпоху, мы должны помиловать и очистить себя от всех прошлых преступлений; те, кто работал с японцами, будут помилованы."
 KMT_Intensify_Communist_Persecution: "Усиление коммунистических преследований"
 KMT_Intensify_Communist_Persecution_desc: "Мы должны продолжать преследовать и избавляться от коммунистической угрозы, с которой мы так доблестно боролись в гражданской войне; коммунизм никогда не будет жить в Китае."
 KMT_Investigate_Land_Reform: "Исследовать земельную реформу"
 KMT_Investigate_Land_Reform_desc: "Необходимо, чтобы наше правительство изучило и исследовало наилучшую политику земельной реформы, чтобы сделать нашу страну самой процветающей в сельскохозяйственной отрасли."
 KMT_Commit_to_Land_Reform: "Принять обязательства по земельной реформе"
 KMT_Commit_to_Land_Reform_desc: "Очевидно, что необходима реформа, которая поможет перераспределить собственность и фермы в пользу простых людей. Правительство с готовностью возьмет на себя эту задачу!"
 KMT_Persecute_Disloyal_Landowners: "Преследование нелояльных землевладельцев"
 KMT_Persecute_Disloyal_Landowners_desc: "Землевладельцы должны всегда помнить о своей лояльности Гоминьдану и государству, иначе они могут просто случайно потерять свою землю."
 KMT_Allow_Clique_Autonomy: "Разрешить автономию клики"
 KMT_Allow_Clique_Autonomy_desc: "Различным кликам материкового Китая должна быть предоставлена большая свобода, поскольку они будут выполнять функции местных органов власти; поддерживать мир и обеспечивать лояльность национальному правительству."
 KMT_Compensate_Landowners: "Выплатить компенсацию землевладельцам"
 KMT_Compensate_Landowners_desc: "В обмен на выращивание сельскохозяйственных культур и их поступление на рынок мы предоставим компенсацию или субсидию, чтобы помочь нашим землевладельцам компенсировать растущие затраты на сельское хозяйство."
 KMT_Liquidate_Uncooperative_Landlords: "Ликвидировать несговорчивых арендодателей"
 KMT_Liquidate_Uncooperative_Landlords_desc: "Любые землевладельцы, которые отказываются подчиниться новой земельной реформе государства, будут задержаны и допрошены; мы хотим обеспечить сельскохозяйственное и земельное равенство для всех желающих стать фермерами."
 KMT_Take_Half_Measures: "Принимать половинчатые меры"
 KMT_Take_Half_Measures_desc: "Земельная реформа не является необходимой в глазах Гоминьдана, мы не видим причин начинать масштабные проекты или даже оказывать минимальную поддержку, если в этом нет необходимости."
 KMT_Seize_Collaborators_Land: "Захватить землю для сотрудничества"
 KMT_Seize_Collaborators_Land_desc: "Прошлые пособники коммунистов или японских оккупантов будут должным образом наказаны, а их земли будут конфискованы государством, в надежде, что они будут распределены среди более лояльных граждан."
 KMT_Reward_Kuomitang_Loyalists: "Вознаграждение лоялистам Гоминьдана"
 KMT_Reward_Kuomitang_Loyalists_desc: "Те, кто остался верным и сильным Гоминьдану, будут вознаграждены дополнительной землей или имуществом, чтобы начать свое хозяйство или бизнес."
 KMT_Commit_to_Reform: "Приверженность реформам"
 KMT_Commit_to_Reform_desc: "С тех пор как мы освободили материк, у правящего правительства появилось множество проблем. Необходима реформа, чтобы укрепить наш контроль над новой территорией и обеспечить справедливое отношение к нашим гражданам."
 KMT_Deny_Need_to_Reform: "Отрицание необходимости реформ"
 KMT_Deny_Need_to_Reform_desc: "Реформы явно не нужны славному китайскому правительству, мы сильны и вернули себе материк без всяких новых «реформ», они просто не нужны."
 KMT_Lift_Martial_Law: "Отмена военного положения"
 KMT_Lift_Martial_Law_desc: "Мы не видим необходимости в продолжении военного положения. Гражданская война закончилась, и коммунисты были должным образом сдержаны. Народ лоялен нам, и мы не видим необходимости навязывать ему дальнейшие авторитарные меры."
 KMT_Continue_Martial_Law: "Продолжить военное положение"
 KMT_Continue_Martial_Law_desc: "Очевидно, что коммунисты и противники руководства Гоминьдана по-прежнему представляют угрозу нашей внутренней безопасности. Военное положение будет продолжено, чтобы обеспечить борьбу с этими людьми."
 KMT_Strengthen_Grip_Over_Cliques: "Усилить контроль над кликами"
 KMT_Strengthen_Grip_Over_Cliques_desc: "Наш контроль над кликами должен быть расширен; их участие в нашем режиме еще больше обеспечит лояльность народа по отношению к нам."
 KMT_Empower_the_Cliques: "Расширение возможностей клики"
 KMT_Empower_the_Cliques_desc: "Вместо того чтобы пытаться ассимилировать различные клики в наш режим, мы предоставим им определенные свободы, но они должны научиться оставаться под нашим пристальным взглядом, иначе произойдут очень неприятные вещи."
 KMT_The_Central_Reform_Committee: "Центральный комитет реформ"
 KMT_The_Central_Reform_Committee_desc: "Мы должны сформировать Центральный комитет реформ Гоминьдана, который будет отвечать за переосмысление и преобразование Гоминьдага в более демократическую и народную партию, используя идеологию "Трех принципов народа", созданную нашим основателем Сунь Ятсеном."
 KMT_Li_Zongren_Solidifies_Power: "Ли Цзунжэнь укрепляет власть"
 KMT_Li_Zongren_Solidifies_Power_desc: "Ли Цзунжэнь, один из лучших генералов националистов и нынешний президент Китайской Республики, укрепил свою власть на посту президента и сохранит свой пост после образования КНР."
 KMT_Allow_Press_Freedom: "Разрешить свободу прессы"
 KMT_Allow_Press_Freedom_desc: "Ограничения и цензура в СМИ будут ослаблены, поскольку с созданием Китайской Республики мы должны дать больше власти СМИ и журналистике как источнику новостей для народа."
 KMT_Reign_in_the_Secret_Police: "Воцарение тайной полиции"
 KMT_Reign_in_the_Secret_Police_desc: "Тайная полиция Гоминьдана, Общество голубых рубашек и Бюро расследований и статистики перестарались в своих полицейских операциях. Они будут обузданы, чтобы обеспечить большую безопасность в сознании людей."
 KMT_Outlaw_Torture: "Пытки вне закона"
 KMT_Outlaw_Torture_desc: "Как указано в Декларации прав человека ООН, которую подписала Китайская Республика, пытки считаются «жестоким, бесчеловечным и унижающим достоинство обращением.» Мы будем придерживаться этого утверждения и прекратим пытки, сделав их незаконными; существуют более гуманные способы получения информации."
 KMT_The_Return_of_Chiang: "Возвращение Чиана"
 KMT_The_Return_of_Chiang_desc: "Чан Кай-ши, лидер Китая во время Второй мировой войны и президент Китайской Республики до января 1949 года, вернулся и вновь занял пост президента, надеясь повести Китай в националистическом направлении."
 KMT_Empower_the_Central_Club_Clique: "Расширение возможностей центральной клубной клики"
 KMT_Empower_the_Central_Club_Clique_desc: "Клика Центрального клуба - это фракция Гоминьдана, которая особенно близка к президенту Чан Кайши. Их антикоммунистические и антияпонские взгляды, несомненно, приведут Гоминьдан к величию!"
 KMT_Crush_the_Reformsts: "Подавить реформистов"
 KMT_Crush_the_Reformsts_desc: "Те в Гоминьдане, кто хочет реформ, - глупцы. Некоторые в своих убеждениях отворачиваются от Гоминьдана и прославляют демократию или коммунизм. Мы не можем этого допустить, эти реформаторы должны быть наказаны."
 KMT_Inhibit_the_Political_Center: "Подавление политического центра"
 KMT_Inhibit_the_Political_Center_desc: "Политический центр ничем не лучше реформистской фракции Гоминьдана! Мы должны остановить их антикитайские, центристские взгляды и убедить их поверить в великую националистическую идеологию Гоминьдана."
 KMT_Strengthen_the_Secret_Police: "Усилить тайную полицию"
 KMT_Strengthen_the_Secret_Police_desc: "Наша тайная полиция должна быть значительно усилена, чтобы поддерживать наши операции по поддержанию лояльности и подавлению всех, кто не согласен с нашими патриотическими, национальными идеалами."
 KMT_Outlaw_Labor_Strikes: "Трудовые забастовки вне закона"
 KMT_Outlaw_Labor_Strikes_desc: "Трудовые забастовки в Китайской Республикой не нужны, и особенно напоминают левые движения за права трудящихся. Все забастовщики в Китайской Республике будут считаться сочувствующими коммунистам и должным образом наказываться таким образом."
 KMT_Play_the_Cliques_Against_Each_Other: "Стравить клики друг против друга"
 KMT_Play_the_Cliques_Against_Each_Other_desc: "Различные клики КМТ расколоты и отличаются по своим убеждениям и целям для партии; необходимо натравить их друг на друга, чтобы уменьшить сопротивление нашей националистической идеологии в партии."
 KMT_Restrain_American_Influence: "Сдерживание американского влияния"
 KMT_Restrain_American_Influence_desc: "Американское влияние зашло достаточно далеко; мы выиграли нашу гражданскую войну и жестоко подавили всех коммунистов, оставшихся от остатков того конфликта. Теперь мы самодостаточны и не нуждаемся в помощи или деньгах из Вашингтона."
 KMT_Crackdown_on_the_Intellectual_Elites: "Подавление интеллектуальной элиты"
 KMT_Crackdown_on_the_Intellectual_Elites_desc: "Интеллигенция представляет угрозу нашей национальной безопасности, особенно в том, что она распространяет идеи, контрпродуктивные для целей КМТ. С представителями интеллектуальной элиты будут бороться, чтобы сохранить лояльность режиму."
 KMT_Outreach_to_the_Panchen_Lama: "Просветительская работа с Панчен-ламой"
 KMT_Outreach_to_the_Panchen_Lama_desc: "Панчен-лама, или второй высший духовный лидер тибетского буддизма, важен для нашего дела, и с ним необходимо поговорить как можно скорее, чтобы предотвратить кризис в Тибете."
 KMT_Sun_Li_Jen_Takes_Command: "Сунь Ли Чжэнь принимает командование"
 KMT_Sun_Li_Jen_Takes_Command_desc: "Сунь Ли-чжэнь, нынешний главнокомандующий армией Китайской Республики и выдающийся ветеран гражданской войны в Китае, захватил контроль над правительством в результате переворота, осуществленного при поддержке американского ЦРУ."
 KMT_Invite_CIA_Advisors: "Пригласить советников ЦРУ"
 KMT_Invite_CIA_Advisors_desc: "Мы сочтем за честь принять у себя советников американской разведки для оказания нам помощи в наших антикоммунистических усилиях в регионе."
 KMT_Launch_Investigations_into_Warlords: "Начать расследование в отношении полевых командиров"
 KMT_Launch_Investigations_into_Warlords_desc: "Военачальники в каждом регионе должны быть тщательно изучены, чтобы раскрыть их действия и истинные намерения перед национальным правительством; мы должны обеспечить их лояльность."
 KMT_Condemn_the_Dalai_Lama: "Осудить Далай-ламу"
 KMT_Condemn_the_Dalai_Lama_desc: "Далай-лама, пытаясь заставить Тибет быть независимым, отделяет свой народ от защиты и безопасности Китайской Республики. Мы осуждаем все его сепаратистские действия."
 KMT_Demand_Tibetan_Submission: "Потребовать подчинения Тибета"
 KMT_Demand_Tibetan_Submission_desc: "Мы требуем, чтобы Тибет отступил и вновь занял свое место в составе Китайской Республики в качестве функционирующей провинции нашей страны; сопротивление и угрозы независимости ничего не сделают для их дела."
 KMT_Back_Coup_by_Panchen_Lama: "Обратный переворот Панчен-ламы"
 KMT_Back_Coup_by_Panchen_Lama_desc: "Чтобы остановить эти гнусные действия, совершаемые Далай-ламой, мы собираемся поддержать его второго по рангу Панчен-ламу в его попытке свергнуть и взять под контроль региональное правительство Тибета."
 KMT_Recognize_Tibetan_Independence: "Признать независимость Тибета"
 KMT_Recognize_Tibetan_Independence_desc: "Тибет выразил свою независимость от нашего государства, и, будучи в состоянии принять это, мы признаем Тибет как суверенное государство и надеемся, что другие дружественные государства мира сделают то же самое."
 KMT_Settle_Border_Claims_with_India: "Урегулирование пограничных претензий с Индией"
 KMT_Settle_Border_Claims_with_India_desc: "Что касается западных границ, то наша граница с Республикой Индия вызывает много споров, и во имя мира мы предлагаем как можно скорее урегулировать пограничные претензии с Индией, чтобы избежать конфликта."
 KMT_Encourage_American_Investors: "Поощрять американских инвесторов"
 KMT_Encourage_American_Investors_desc: "Теперь, когда большинство наших внутренних проблем решены, мы можем начать поощрять американских инвесторов играть на нашей вновь обретенной экономической силе, чтобы мы могли стать международной промышленной державой!"
 KMT_Reform_the_Kuomintang: "Реформировать Гоминьдан"
 KMT_Reform_the_Kuomintang_desc: "КМТ серьезно нуждается в реформе; партия стремительно становится все более коррумпированной и жесткой по отношению к власти, и необходимо как можно скорее принять серьезные меры для проведения реформы, чтобы наша страна оставалась сильной."
 KMT_Join_SEATO: "Вступить в ОДЮВА"
 KMT_Join_SEATO_desc: "В интересах национальной безопасности Китайской Республики присоединится к новой Организации Договора Юго-Восточной Азии, чтобы мы могли внести свой вклад в идеалы безопасности и коллективной обороны в азиатском регионе."
 KMT_Invade_Tibet: "Вторжение в Тибет"
 KMT_Invade_Tibet_desc: "Тибет уже достаточно бунтовал и сопротивлялся! Чтобы показать нашу силу принуждения и недовольство независимостью Тибета, наши лучшие и наиболее оснащенные подразделения вторгнутся в Тибет и подавят любое сопротивление."
 KMT_Crush_the_Tibetan_Aristocracy: "Сокрушить тибетскую аристократию"
 KMT_Crush_the_Tibetan_Aristocracy_desc: "Тибетская верхушка является корнем восстания в регионе; аристократия в Тибетском регионе будет наказана и очищена за их преступления против Китайской Республики."
 KMT_End_Political_Commissars: "Покончить с политическими комиссарами"
 KMT_End_Political_Commissars_desc: "Политические комиссары - это исключительно коммунистическая грань армии, и мы никогда не будем похожи на коммунистическую мразь! Следить за идеологией наших войск необходимо, но комиссары не являются."
 KMT_Embrace_American_Influence: "Принять американское влияние"
 KMT_Embrace_American_Influence_desc: "Рост американских инвестиций в Китайской Республике и военная помощь, наряду с разведкой, только сблизили нас с США."
 KMT_Crackdown_on_Party_Corruption: "Борьба с коррупцией в партии"
 KMT_Crackdown_on_Party_Corruption_desc: "Политическая коррупция является массовой проблемой не только в КМТ, но и по всей стране. Мы должны искоренить всю коррупцию, чтобы сделать правительство более эффективным и работающим для народа, а не для собственной выгоды."
 KMT_Republic_of_China_Air_Force: "Военно-воздушные силы Китайской Республики"
 KMT_Republic_of_China_Air_Force_desc: "Наши военно-воздушные силы должны быть укреплены новейшими моделями самолетов, и мы будем известны как передовая воздушная держава в регионе!"
 KMT_Anti_Aircraft_Initiative: "Противовоздушная инициатива"
 KMT_Anti_Aircraft_Initiative_desc: "Зенитные технологии, в том числе Зенитные пушки, радары и ракеты «земля-воздух» (ЗВ), являются наиболее важными для нас; Советский Союз имеет аналогичные системы, и мы должны быть готовы к любым наступательным военным действиям наших врагов."
 KMT_Establish_a_Centralized_Payroll: "Создайте централизованную систему начисления заработной платы"
 KMT_Establish_a_Centralized_Payroll_desc: "Мы должны максимизировать эффективность в армии путем создания централизованной платежной ведомости, чтобы платить нашим солдатам в одно и то же время, из одного и того же источника."
 KMT_Re_Establish_the_Whampoa_Military_Academy: "Учредить Военную академию Уэмпоа"
 KMT_Re_Establish_the_Whampoa_Military_Academy_desc: "Военная академия Уэмпоа обучила многих наших доблестных офицеров и солдат во время Второй мировой войны и Гражданской войны в Китае; мы вновь откроем ее как можно скорее в Гаосюне, Тайвань, в качестве главной военной академии для нашего корпуса кадетов."
 KMT_Reform_the_Air_Force_Academy: "Реформировать Академию ВВС"
 KMT_Reform_the_Air_Force_Academy_desc: "Академия ВВС Китайской Республики должна быть реформирована с учетом новых технологий и более интенсивной подготовки, которую должны получать наши офицеры ВВС."
 KMT_Import_American_Jets: "Импортные американские самолеты"
 KMT_Import_American_Jets_desc: "Соединенные Штаты, один из наших ближайших союзников, имеют одни из самых новых и современных самолетов; мы с удовольствием купим у них несколько многоцелевых самолетов последней модели для пополнения наших военно-воздушных сил."
 KMT_A_Chinese_Jet_Fighter: "Китайский реактивный истребитель"
 KMT_A_Chinese_Jet_Fighter_desc: "Необходимо, чтобы вместо того, чтобы полагаться исключительно на иностранный импорт от наших союзников, Китайская Республика разработала собственные реактивные самолеты, чтобы значительно расширить наши военно-воздушные силы."
 KMT_Reform_the_Justice_Investigation_Bureau: "Реформировать Бюро судебных расследований"
 KMT_Reform_the_Justice_Investigation_Bureau_desc: "Бюро судебных расследований - это служба контрразведки и уголовного розыска Китайской Республики. Для борьбы с коррупцией и массовыми несправедливостями в деятельности JIB срочно необходима реформа."
 KMT_Launch_Investigations_into_the-Army: "Начать расследование в отношении армии"
 KMT_Launch_Investigations_into_the-Army_desc: "Бюро судебных расследований и Бюро военной разведки Китайской Республики немедленно проведут массовые расследования в отношении некоторых лиц в армии Китайской Республики, которые выражали политические взгляды, противоречащие идеалам государства. Дисциплина будет поддерживаться."
 KMT_Send_Suspect_Officers_to_the_Frontier: "Отправить подозреваемых офицеров на границу"
 KMT_Send_Suspect_Officers_to_the_Frontier_desc: "Все офицеры, которые считаются политическими диссидентами или были замешаны в коррупции или любой другой незаконной деятельности, получат оплачиваемую всеми расходами командировку в новое командование на востоке Китая, где они будут наслаждаться пограничной жизнью."
 KMT_Mass_Purges: "Массовые чистки"
 KMT_Mass_Purges_desc: "Необходимо избавиться от тех, кто заявлял о своей нелояльности и оппозиции правящему режиму Гоминьдана; эти люди будут арестованы, преданы суду, осуждены и «обработаны» соответствующим образом."
 KMT_Complete_the_Purges: "Завершить чистки"
 KMT_Complete_the_Purges_desc: "Чистка завершена, мы надеемся, что это послужит уроком для остального населения, что их мысли о противостоянии приведут к смерти."
 KMT_Republic_of_China_Army: "Армия Китайской Республики"
 KMT_Republic_of_China_Army_desc: "Армия Китайской Республики должна стать ведущей сухопутной военной силой на азиатском континенте! Мы будем обучать и оснащать наших людей для любой возможной ситуации."
 KMT_Restore_the_Hanyang_Arsenal: "Восстановить Ханьянский арсенал"
 KMT_Restore_the_Hanyang_Arsenal_desc: "Ханьянский арсенал был самым известным и старейшим арсеналом в Китае, помогая производить винтовки со времен Боксерского восстания и Гражданской войны. Мы восстановим его, чтобы здесь снова начали производить стрелковое оружие и винтовки."
 KMT_Restore_the_Taiyuan_Arsenal: "Восстановить Тайюаньский арсенал"
 KMT_Restore_the_Taiyuan_Arsenal_desc: "Мы восстановим и Тайюаньский арсенал! Расположенный в Шаньси, этот арсенал был известен тем, что во время Гражданской войны производил винтовки Маузер Тип 24, а также пулеметы, артиллерийские орудия и снаряды."
 KMT_Reform_the_Kiangnan_Arsenal: "Реформировать Киангнанский арсенал"
 KMT_Reform_the_Kiangnan_Arsenal_desc: "Расположенный в Шанхае, Киангнанский арсенал примыкал к Киангнанским верфям и занимался производством огнестрельного оружия, пока не был расформирован в 1937 году, незадолго до начала Войны сопротивления японской агрессии. Мы восстановим его!"
 KMT_Urban_Warfare_Training: "Обучение ведению боевых действий в городских условиях"
 KMT_Urban_Warfare_Training_desc: "Городские войны становятся все более распространенными в современную эпоху асимметричных войн. Наши войска должны быть хорошо обучены ведению боевых действий в городских условиях, будь то атака или оборона."
 KMT_Republic_of_China_Navy: "Военно-морской флот Китайской Республики"
 KMT_Republic_of_China_Navy_desc: "Наш флот должен стать сильным, поскольку мы должны быть одной из ведущих военно-морских держав в регионе. Безопасность в наших водах и на морях - главный приоритет нашего флота."
 KMT_Expand_the_Kiangnan_Shipyard: "Расширение Киангнанской судоверфи"
 KMT_Expand_the_Kiangnan_Shipyard_desc: "Расширение верфи Киангнан, которая была известна строительством канонерских лодок и других патрульных судов в 1920-х годах; мы будем использовать их опыт в развитии нашего военно-морского флота."
 KMT_Commissioning_Former_IJN_Destroyers: "Ввод в эксплуатацию бывших эсминцев Императорского ВМФ Японии"
 KMT_Commissioning_Former_IJN_Destroyers_desc: "Мы испытываем серьезную потребность в кораблях; захват бывших японских эсминцев одновременно расширит наш флот и поможет японскому правительству; ввод в эксплуатацию начнется как можно скорее."
 KMT_Puchase_American_Vessels: "Покупка американских судов"
 KMT_Puchase_American_Vessels_desc: "Соединенные Штаты также стремятся модернизировать свой военно-морской флот; мы с готовностью примем американские суда более старой модели, чтобы сделать наш флот большим и разнообразным."
 KMT_Expand_the_Marine_Corps: "Расширить корпус морской пехоты"
 KMT_Expand_the_Marine_Corps_desc: "Корпус морской пехоты Китайской Республики, или ROCMC, считается элитным родом войск; его расширение необходимо, чтобы быть готовым к любым операциям в Азии, требующим нашей помощи."
 KMT_Seek_Western_Financial_Aid: "Обратиться за финансовой помощью к Западу"
 KMT_Seek_Western_Financial_Aid_desc: "Для дальнейшего укрепления нашей экономики мы должны принять взносы от США в форме плана Маршалла, чтобы восстановить нашу экономику после разрушительных последствий Второй мировой войны и коммунистического восстания."
 KMT_Enact_Currency_Reform: "Принять валютную реформу"
 KMT_Enact_Currency_Reform_desc: "Наша валюта должна быть реформирована как можно скорее; гиперинфляция наносит ущерб нашей экономике, и мы должны иметь решения, чтобы предотвратить наш экономический крах."
 KMT_Introduce_New_Standardized_Currency: "Ввести новую стандартизированную валюту"
 KMT_Introduce_New_Standardized_Currency_desc: "Новый китайский доллар заменит старые китайские доллары в качестве нашей денежной единицы; правительство и национальные банки будут способствовать обмену валюты на новый стандарт."
 KMT_Apply_For_American_Reconstruction_Aid: "Обратиться за помощью в восстановлении Америки"
 KMT_Apply_For_American_Reconstruction_Aid_desc: "Быстрые успехи плана Маршалла в Европе убедили нас в том, что принятие американской помощи для реконструкции является лучшей стратегией для восстановления нашей экономики и инфраструктуры."
 KMT_Commence_Planning_of_the_Four_Year_Plan: "Начало планирования четырехлетнего плана"
 KMT_Commence_Planning_of_the_Four_Year_Plan_desc: "Мы должны начать наш первый четырехлетний план по восстановлению нашей экономики, не путать с пятилетними планами злых коммунистов; мы лишь стремимся восстановить нашу разрушающуюся промышленность и инфраструктуру."
 KMT_The_First_Four_Year_Plan: "Первый четырехлетний план"
 KMT_The_First_Four_Year_Plan_desc: "Мы провели обширное планирование, и реализация Четырехлетнего плана начнется как можно скорее, главной целью которого является восстановление и национализация жизненно важных отраслей промышленности, находящихся под нашим контролем."
 KMT_Establish_the_Ministry_of_Economic_Planning: "Создать Министерство экономического планирования"
 KMT_Establish_the_Ministry_of_Economic_Planning_desc: "Чтобы помочь нашей промышленности в ремонте, необходимо создать Министерство экономического планирования, или МЭП, для предоставления правительственных консультаций и сотрудничества с государственными и частными предприятиями, чтобы продвинуть китайскую экономику к успеху."
 KMT_Nationalize_Mining_and_Extraction_Industries: "Национализировать горнодобывающую и добывающую промышленность"
 KMT_Nationalize_Mining_and_Extraction_Industries_desc: "Наша горно-добывающая промышленность оказалась успешной как внутри страны, так и на международном уровне; ее национализация позволит увеличить торговлю и прибыль для Китайской Республики."
 KMT_Nationalize_the_Arms_Industry: "Национализировать оружейную промышленность"
 KMT_Nationalize_the_Arms_Industry_desc: "Наша оружейная промышленность должна быть поглощена государством, чтобы централизовать различные предприятия по всей стране."
 KMT_Begin_Mechanizing_Agriculture: "Начать механизацию сельского хозяйства"
 KMT_Begin_Mechanizing_Agriculture_desc: "Сельскохозяйственные системы и технологии, которые используют наши фермеры, устарели; мы должны начать механизировать и рационализировать процесс ведения сельского хозяйства, чтобы накормить наших людей."
 KMT_Invest_in_Irrigation_Projects: "Инвестируйте в ирригационные проекты"
 KMT_Invest_in_Irrigation_Projects_desc: "Особо засушливые регионы Китая нуждаются в серьезных ирригационных проектах, и, используя американские средства, мы будем активно инвестировать в водную инфраструктуру нашей страны."
 KMT_Commence_Reconstruction: "Начать реконструкцию"
 KMT_Commence_Reconstruction_desc: "Наши усилия по восстановлению начнутся, и наша вновь построенная инфраструктура и промышленность станут лучшими на азиатском континенте!"
 KMT_Rebuild_Coastal_Infrastructure: "Восстановить прибрежную инфраструктуру"
 KMT_Rebuild_Coastal_Infrastructure_desc: "Инфраструктура в наших прибрежных районах, включая порты, мосты и дороги, должна быть восстановлена и развита в соответствии с современными стандартами."
 KMT_Rebuild_Southern_Railways: "Восстановить Южные железные дороги"
 KMT_Rebuild_Southern_Railways_desc: "Наши южные железнодорожные линии были разрушены во время войн в регионе; их необходимо модернизировать и сделать эффективными для перевозки пассажиров и грузов по всему региону."
 KMT_Decline_to_Seek_American_Cooperation: "Не стремиться к американскому сотрудничеству"
 KMT_Decline_to_Seek_American_Cooperation_desc: "В области ядерных исследований есть и другие державы, с которыми мы могли бы сотрудничать; мы ценим американскую поддержку, но Китайская Республика не будет привязана навсегда."
 KMT_Reform_University_Departments: "Реформирование факультетов университетов"
 KMT_Reform_University_Departments_desc: "Встав на независимый путь исследований, наши высшие учебные заведения и университетские факультеты должны быть реформированы, чтобы отразить современную эпоху, в которой мы живем, и научные исследования, которые мы должны проводить.."
 KMT_Import_Dassault_Mirage_IV_Strategic_Bombers: "Импорт стратегических бомбардировщиков Dassault Mirage IV"
 KMT_Import_Dassault_Mirage_IV_Strategic_Bombers_desc: "В рамках сотрудничества с другими странами мы будем импортировать стратегические бомбардировщики из Франции, последнюю модель Mirage IV; это позволит нам как нарастить наши военно-воздушные силы, так и начать торговлю с другими демократическими союзниками."
 KMT_Prioritize_Coastal_Relief: "Приоритет прибрежной помощи"
 KMT_Prioritize_Coastal_Relief_desc: "Острова и приморские города на побережье Китая больше всего пострадали от недавних войн; общая помощь стране должна быть направлена в первую очередь на эти районы."
 KMT_Nationalize_Taiwanese_Assets: "Национализировать тайваньские активы"
 KMT_Nationalize_Taiwanese_Assets_desc: "Все сельскохозяйственные и промышленные активы на острове Тайвань будут национализированы, чтобы поддержать нашу растущую экономику; Тайвань будет известен как экономическая держава!"
 KMT_Attract_Foriegn_Capital: "Привлечение иностранного капитала"
 KMT_Attract_Foriegn_Capital_desc: "Мы должны привлекать больше иностранного капитала и инвестиций в экономику нашей страны; необходима не только американские инвесторы, но и международная поддержка."
 KMT_Exploit_Uranium_Deposits_in_Shandong: "Эксплуатация урановых месторождений в Шаньдуне"
 KMT_Exploit_Uranium_Deposits_in_Shandong_desc: "Для продолжения нашей ядерной программы необходимо расширить и обогатить урановые рудники Шаньдуна, чтобы помочь нам получить необходимые ресурсы."
 KMT_Attract_Chinese_American_Scientists: "Привлечение американских ученых китайского происхождения"
 KMT_Attract_Chinese_American_Scientists_desc: "Оказывая влияние на ученых китайского происхождения в Америке, мы можем надеяться убедить их помочь нам в нашей программе по созданию ядерной энергии и оружия."
 KMT_Intensify_French_Nuclear_Cooperation: "Активизация сотрудничества Франции в ядерной сфере"
 KMT_Intensify_French_Nuclear_Cooperation_desc: "Франция быстро стала нашим самым важным союзником в области ядерных исследований, и наши отношения только укрепляются."
 KMT_Offer_Grants_to_Foriegn_Chinese_Nuclear_Students: "Предложение грантов для иностранных китайских студентов-ядерщиков"
 KMT_Offer_Grants_to_Foriegn_Chinese_Nuclear_Students_desc: "Если мы предоставим потенциальным студентам гранты по нашей ядерной программе, мы сможем повлиять на них, чтобы они работали с нами."
 KMT_Develop_Chinese_Nuclear_Power: "Развитие китайской ядерной энергетики"
 KMT_Develop_Chinese_Nuclear_Power_desc: "Атомная энергетика - это самая современная, энергоэффективная и безопасная форма производства электроэнергии, которая была разработана. Китайская Республика заслуживает иметь атомную энергетику, и мы будем развивать ее как свою собственную."
 KMT_American_Cooperation: "Американское сотрудничество"
 KMT_American_Cooperation_desc: "В конце концов, американцы первыми применили ядерное оружие и ядерную энергию, так почему бы не заручиться их помощью в наших усилиях по программе?"
 KMT_Joint_American_Chinese_Uranium_Extraction: "Совместная американо-китайская добыча урана"
 KMT_Joint_American_Chinese_Uranium_Extraction_desc: "При американской помощи и сотрудничестве мы начнем добычу урана из месторождений в Шаньдуне на благо обеих наших стран."
 KMT_Import_Nuclear_Energy_Reactors: "Импортные реакторы для атомной энергетики"
 KMT_Import_Nuclear_Energy_Reactors_desc: "В рамках нашего сотрудничества с Соединенными Штатами мы с удовольствием купим ядерные реакторы последнего поколения и внедрим их в нашу расширяющуюся энергосистему."
 KMT_Establish_the_Tibetan_Autonomous_Region: "Создание Тибетского автономного района"
 KMT_Establish_the_Tibetan_Autonomous_Region_desc: "Теперь, когда переворот Панчен-ламы удался, мы сделаем Тибет автономным регионом, под нашим контролем, но с некоторым подобием самоуправления."
 KMT_Prepare_for_Mass_Industrialization_Program: "Подготовка к программе массовой индустриализации"
 KMT_Prepare_for_Mass_Industrialization_Program_desc: "Наша индустриализация должна начаться как можно скорее. Это позволит создать более крупную промышленность и более разнообразную и успешную экономику."
 KMT_Aim_for_Electric_Equipment_Self_Sufficiency: "Стремиться к самообеспечению электрооборудованием"
 KMT_Aim_for_Electric_Equipment_Self_Sufficiency_desc: "Китайская Республика должна начать поддерживать самодостаточность нашей электрической сети; электростанции будут построены в нашей стране, чтобы прекратить нашу зависимость от других стран за электроэнергию."
 KMT_Modernize_Steel_Production: "Модернизация производства стали"
 KMT_Modernize_Steel_Production_desc: "Основной процесс кислородной выплавки стали был разработан Робертом Дюррером только в 1948 году; мы должны догонять новые разработки в производстве, чтобы не отставать от других промышленно развитых стран мира."
 KMT_Complete_the_Economic_Reorganization: "Завершить реорганизацию экономики"
 KMT_Complete_the_Economic_Reorganization_desc: "Реорганизация нашей экономики почти завершена! Наша горнодобывающая и оружейная промышленность были национализированы, инфраструктура улучшена, а правительство оказывает помощь фермерам; наша политика была массово успешной."
 KMT_Complete_the_Reforms: "Завершить реформы"
 KMT_Complete_the_Reforms_desc: "Наши земельные реформы скоро будут завершены. Это позволит обеспечить большую свободу людей и большее процветание для всех, особенно для тех, кто хочет стать фермерами."
 KMT_Attempt_to_Persuade_Reluctant_Landlords: "Попытка убедить нежелающих арендодателей"
 KMT_Attempt_to_Persuade_Reluctant_Landlords_desc: "Землевладельцам, которые не уверены в политике земельной реформы РПЦ, будут мягко и спокойно напоминать о преимуществах соблюдения правил, возможно, с предварительной выплатой нескольких сотен долларов..."
 KMT_Invest_in_Agricultural_Modernization: "Инвестировать в модернизацию сельского хозяйства"
 KMT_Invest_in_Agricultural_Modernization_desc: "Сельское хозяйство является основной отраслью в Китае, и инвестиции в новейшие технологии и идеи в области сельского хозяйства позволят нам быть на одном уровне с более модернизированными странами."
 KMT_Enforce_Reforms_in_Clique_Territory: "Проведение реформ на территории клики"
 KMT_Enforce_Reforms_in_Clique_Territory_desc: "Наши реформы должны быть более активно продвинуты на территории клики, так как они нуждаются в большей помощи и содействии со стороны национального правительства, чем другие регионы."
 KMT_Launch_the_Second_Four_Year_Plan: "Запуск второго четырехлетнего плана"
 KMT_Launch_the_Second_Four_Year_Plan_desc: "Отмечая масштабный успех первого четырехлетнего плана, мы как можно скорее приступим к реализации второго плана, сосредоточившись на дальнейшей индустриализации и модернизации экономики."
 KMT_Begin_Mass_Literacy_Campaigns: "Начать кампании по массовой грамотности"
 KMT_Begin_Mass_Literacy_Campaigns_desc: "В дополнение к нашим кампаниям по индустриализации, наши люди должны получить образование, не только в русле националистической идеологии, но и научиться читать и писать как современные граждане. Китайский народ будет известен своим интеллектом!"
 KMT_Construct_New_Steel_Mills: "Строительство новых металлургических заводов"
 KMT_Construct_New_Steel_Mills_desc: "С нашей модернизацией сталелитейного производства и расширением тяжелой промышленности представляется необходимым построить больше сталелитейных заводов."
 KMT_Expand_Heavy_Industry: "Расширение тяжелой промышленности"
 KMT_Expand_Heavy_Industry_desc: "Наша тяжелая промышленность должна быть расширена, чтобы производить больше промышленной продукции, самолетов и вооружения."
 KMT_Seek_Foriegn_Economic_Advisors: "Искать иностранных экономических советников"
 KMT_Seek_Foriegn_Economic_Advisors_desc: "Мы должны заручиться американской помощью в виде экономических советников, которые будут предлагать предложения по улучшению нашей экономики и промышленности."
 KMT_Electrification_Campaign: "Кампания по электрификации"
 KMT_Electrification_Campaign_desc: "Электричество должно стать доступным для каждого места в Китае! Электростанции будут построены по всей стране, чтобы обеспечить стабильную энергосистему."
 KMT_Build_New_Dams: "Построить новые плотины"
 KMT_Build_New_Dams_desc: "Строительство новых плотин на наших реках обеспечит практически бесконечный источник гидроэлектроэнергии, которая в дальнейшем будет использоваться для укрепления нашей энергосистемы."
 KMT_Exploit_Rare_Earth_Deposits: "Эксплуатация месторождений редкоземельных металлов"
 KMT_Exploit_Rare_Earth_Deposits_desc: "По всей нашей стране обнаружены ценные месторождения редкоземельных металлов, таких как вольфрам! Мы должны использовать их для наших промышленных нужд, а остальное продавать на международном рынке."
 KMT_Encourage_Urbanization: "Поощрение урбанизации"
 KMT_Encourage_Urbanization_desc: "Мы должны расширить городские районы Пекина, Шанхая, Гуанчжоу и других крупных городов; урбанизация позволит сконцентрировать промышленность и рабочих в центре и облегчить доступ к поддержке населения."
 KMT_Expand_Rural_Rail_Access: "Расширение доступа к железнодорожным путям в сельской местности"
 KMT_Expand_Rural_Rail_Access_desc: "Железнодорожное сообщение между городами и сельскими районами Китая очень важно, поскольку в наши дни транспорт должен стать более эффективным. Железнодорожное сообщение будет расширено, как в плане линий, так и в плане курсирующих поездов."
 KMT_Expand_Shanghai_Port_Capacity: "Расширение портовых мощностей Шанхая"
 KMT_Expand_Shanghai_Port_Capacity_desc: "В Шанхайском порту необходимо построить больше доков и верфей для содействия росту торговли и нашему постоянно расширяющемуся военно-морскому флоту, наряду со строительством и ремонтом."
 KMT_The_Industrialization_of_China: "Индустриализация Китая"
 KMT_The_Industrialization_of_China_desc: "В качестве основной части нашего Второго четырехлетнего плана, большая часть Китая должна быть индустриализирована; промышленные комплексы будут построены везде, где они необходимы в нашей стране."
 KMT_Economic_Modernization: "Модернизация экономики"
 KMT_Economic_Modernization_desc: "Поскольку время меняется, наши методы изготовления и производства также должны быть изменены, чтобы не отставать от других современных, промышленно развитых стран мира."
 KMT_Conduct_a_Proper_Census: "Проведите надлежащую перепись населения"
 KMT_Conduct_a_Proper_Census_desc: "Наш народ должен быть подсчитан; это очень необходимо, так как это позволит лучше определить потребности народа и то, как правительство может их удовлетворить."
 KMT_Rapid_Economic_Growt: "Быстрый экономический рост"
 KMT_Rapid_Economic_Growt_desc: "Наша экономика растет быстрее, чем когда-либо прежде, благодаря успеху наших четырехлетних планов и международной помощи!"
 KMT_Reform_the_Judicial_System: "Реформировать судебную систему"
 KMT_Reform_the_Judicial_System_desc: "Наша судебная власть и судебная система должны быть реформированы, чтобы отражать справедливость, а не коррупцию или авторитаризм."
 KMT_Empower_the_Legislative_Yuan: "Расширение полномочий Законодательного Юаня"
 KMT_Empower_the_Legislative_Yuan_desc: "Законодательная власть Китайской Республики, Юань, должна быть допущена к дальнейшему обсуждению вопросов, касающихся народа и развития экономики, во благо демократии и нации."
 KMT_Introduce_Limited_Democratic_Reforms: "Ввести ограниченные демократические реформы"
 KMT_Introduce_Limited_Democratic_Reforms_desc: "Ограниченная демократия - это путь для Китайской Республики, и он останется таким; полная демократия может быть опасной, а авторитаризм неэффективен в наши дни. Реформы должны быть проведены."
 KMT_Prosecute_the_CC_Clique: "Преследование клики ЦК"
 KMT_Prosecute_the_CC_Clique_desc: "Клика ЦК - предатели, верные только Чангу, но не своей партии и не своей стране. Они будут наказаны в качестве примера для тех, кто коррумпирован и не заботится о своей славной нации."
 KMT_Begin_Preperations_for_First_Nuclear_Test: "Начало подготовки к первому ядерному испытанию"
 KMT_Begin_Preperations_for_First_Nuclear_Test_desc: "Наконец-то наши ядерные исследования окупились! Китайская Республика станет ядерной державой, присоединившись к рядам США, Великобритании, Франции и СССР; это знаменательный день для китайцев всего мира!"
 KMT_Embrace_Atoms_for_Peace: "Применения атома для мира"
 KMT_Embrace_Atoms_for_Peace_desc: "Вместо того чтобы использовать ядерную энергию для войны и разрушения, Китайская Республика возьмет на себя обязательство использовать ядерную энергию в мирных целях, применяя ее только для производства энергии и электричества."
 KMT_Siphon_American_Material: "Сифонный американский материал"
 KMT_Siphon_American_Material_desc: "Американские материалы и документы будут очень полезны для нашего дела по созданию ядерного оружия. Некоторые из их самых важных документов могут просто «пропасть» на несколько часов..."
 KMT_Covertly_Continue_the_Program: "Скрытое продолжение программы"
 KMT_Covertly_Continue_the_Program_desc: "Программа создания ядерного оружия должна продолжаться, хотя и в тайне; наши американские партнеры не должны знать о наших разработках, и мы достаточно скоро станем ядерной державой."
 KMT_Redevelop_Damaged_Factories: "Реконструировать поврежденные заводы"
 KMT_Redevelop_Damaged_Factories_desc: "Наши поврежденные заводы должны быть восстановлены и перестроены с учетом современных технологий и методов, распространенных в индустриальном мире."
 KMT_Support_the_French: "Поддержать французов"
 KMT_Support_the_French_desc: "Вместо того чтобы поддерживать Вьеткок, мы будем поддерживать другую крупную державу в регионе, французское колониальное правительство; с нашей помощью мы сможем подавить коммунистических повстанцев!"
 KMT_Cut_Off_Viet_Minh_Supply_Routes: "Перекрыть пути снабжения Вьетминя"
 KMT_Cut_Off_Viet_Minh_Supply_Routes_desc: "Отрезав пути снабжения Вьетминя в Лаосе и Камбодже, мы уморим повстанцев голодом и заставим их сдаться или умереть."
 KMT_Curtail_Communist_Recruitment: "Прекратить вербовку коммунистов"
 KMT_Curtail_Communist_Recruitment_desc: "Вмешательство в вербовку в коммунистические партии эффективно остановит популярность Вьетнама и падение неудавшегося восстания."
 KMT_Strike_Viet_Minh_Positions: "Нанести удар по позициям Вьетнама"
 KMT_Strike_Viet_Minh_Positions_desc: "Пришло время показать мастерство наших военных и военно-воздушных сил, нанося тактические удары по основным позициям и базам Вьетмина, чтобы эффективно подавить остатки коммунистов."
 KMT_Invest_in_the_Empire_of_Vietnam: "Инвестиции в империю Вьетнама"
 KMT_Invest_in_the_Empire_of_Vietnam_desc: "Оказывая взаимную помощь Вьетнаму, мы считаем справедливым инвестировать в промышленность и экономику Вьетнама, обеспечивая их стабильность в далеком будущем."
 KMT_Send_Advisors_to_Vietnam: "Отправить советников во Вьетнам"
 KMT_Send_Advisors_to_Vietnam_desc: "В рамках нашей военной и экономической поддержки Вьетнам получит советников НПВ, которые помогут ему построить сильное, националистическое правительство."
 KMT_A_Republican_Vietnam: "Республиканский Вьетнам"
 KMT_A_Republican_Vietnam_desc: "При нашей поддержке Вьетнам стал сильным, республиканским, националистическим правительством, приверженным идеалам свободы и демократии!"
 CHI_idea_first_four_year_plan: "Первый четырехлетний план"
 CHI_idea_second_four_year_plan: "Второй четырехлетний план"
 Industrial_Reconstruction_kmt: "Усилия по восстановлению промышленности"
