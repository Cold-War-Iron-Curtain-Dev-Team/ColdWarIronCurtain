 ic_generic60_events.1.t: "Социальный вопрос"
 ic_generic60_events.1.d: "С окончанием войны, выплатой репараций и мировым процветанием, социальные проблемы вновь оказались на переднем крае мировой политики. Обсуждаются права трудящихся, экологические перспективы, права меньшинств и противоположного пола, ЛГБТ, глобализм и даже милитаризм и внешняя политика. Эти дебаты разорвали страну на части, и если оставить их без внимания, то это поставит под угрозу саму стабильность страны."
 ic_generic60_events.2.t: "[GetNewspaperHeader]Дебаты о правах трудящихся"
 ic_generic60_events.2.d: "Дебаты о правах трудящихся в течение последних трех месяцев были интенсивными. Беспорядки, всеобщие забастовки и лоббирование-все это вот чем были наполнены национальные СМИ за последние несколько месяцев. Но теперь пыль улеглась, и законодатели страны примут свое решение.\n Про-работодательские группы утверждают, что права и мандаты рабочих являются обструкционистскими и аморальными. Про-Работодательские группы утверждают, что свобода и свободная ассоциация труда исправят условия работников и обеспечат каждому хорошую сделку без вмешательства правительства. Кроме того, выступающие за работодателей группы заявляют, что экономический рост в результате  свободы приведет к созданию лучших условий, чем когда-либо могли обеспечить законы о правах трудящихся.\n Про-профсоюзные группы утверждают, что права трудящихся жизненно важны для их защиты. Про-профсоюзные группы заявляют, что люди не могут свободно выбирать свою работу, поскольку нет достаточного количества рабочих мест, чтобы обеспечить свободный поток рабочей силы. Таким образом, про-профсоюзные группы заявляют, что профсоюзы должны быть укреплены, чтобы действовать в защиту трудящихся, и что необходимо разработать Билль о правах трудящихся, чтобы еще больше ограничить рабочее время, обеспечивая при этом прожиточный минимум, безопасность на рабочем месте и хорошие условия труда.\n Умеренные, называющие себя трудовыми прагматиками, утверждают, что полный выбор любой из сторон приведет страну к краху. Трудовые прагматики утверждают, что профсоюзы должны быть достаточно сильными, чтобы защитить своих работников, но они не должны обладать абсолютной властью, поскольку чрезмерные требования будут препятствовать экономическому росту и приведут страну в худшее состояние. Трудовые прагматики приходят к выводу, что наличие умеренно мощных профсоюзов, приемлемых стандартов, установленных законом, и разумных уровней экономической свободы обеспечит баланс роста и выгоды."
 ic_generic60_events.3.t: "[GetNewspaperHeader]Дебаты по охране окружающей среды"
 ic_generic60_events.3.d: "Экологический вопрос выявил беспрецедентные уровни проникновения в умы населения. То, как люди думают о будущем и о своих собственных потребностях, было раскрыто перед всеми, и эти дебаты дадут социологам в стране много работы, возможно, на все десятилетие. В то время как законодатели страны будут иметь влияние в дебатах, в конечном счете именно люди и их взгляды будут диктовать свое поведение и устойчивость нации.\n Материалисты желают экономического роста, больших объемов роскоши и потребления, и не заботятся об окружающей среде. Материалисты считают, что глобальное потепление-это миф, природа всегда найдет выход, что жизнь бессмысленна, когда она тратится в условиях жесткой экономии, а выгоды от быстрого промышленного роста всегда превосходят последствия неустойчивости.\n Защитники окружающей среды-это чрезвычайно экологичные и глобально мыслящие люди. Защитники окружающей среды довольствуются немногочисленными, чрезвычайно надежными потребительскими товарами. Они желают стабильности, охраны окружающей среды и самое главное-долгой жизни. Защитники окружающей среды считают, что глобальное потепление является экзистенциальной угрозой, что стабильные продукты необходимы для дальнейшего выживания человечества и что экосистема должна быть сохранена.\n Однако в дебатах об охране окружающей среды есть и экологи-центристы. Эти центристы считают, что принятие крайних мер по сохранению окружающей среды в ненужны, и просто сокращение расточительности, предотвращению вырубки лесов и вымирания видов животных является достаточным. Экологи-центристы считают материалистов чрезмерно расточительными, а экологов-слишком суровыми. Таким образом, они хотят иметь нацию, которая предпринимает только необходимые шаги для сокращения чрезмерного потребления и защиты окружающей среды."
 ic_generic60_events.4.t: "[GetNewspaperHeader]Дебаты по гендерным вопросам/правам меньшинств"
 ic_generic60_events.4.d: "К числу наиболее спорных и важных тем, относятся гендерные вопросы и права меньшинств, затрагивающие подавляющую часть населения и диктующие, что эти группы могут делать.\n Первая группа, реакционеры, верит в национальное принуждение к историческому гендерному превосходству в стране. Эта группа также считает, что национальное наследие важно для страны и что меньшинства не имеют значения или нежелательны. Эта группа утверждает, что группа большинства выше. Эта группа опасается, что все остальное приведет к распаду семьи, интроверсии детей или даже к влиянию самих меньшинств.\n Вторая группа, прогрессивисты, верят в позитивные действия по содействию гендерному равенству и равенству меньшинств по всей стране. Это означает огромные усилия со стороны правительства или народа, направленные на поощрение принятия и полное разрушение культурных норм и традиций. Эта группа прогрессистов считает, что единственный способ обеспечить равенство-это поощрять членов исторически маргинализированных групп к полному раскрытию их потенциала и преодолению предрассудков в обществе.\n Третья группа, консерваторы, считает, что меньшинства и оба пола должны быть равны. Консерваторы считают, что позитивные действия по отношению к меньшинствам являются как излишними, так и неестественными, и что равенства в законе и социальном мировоззрении достаточно для того, чтобы меньшинства имели равные возможности в стране. Кроме того, консерваторы считают, что, хотя и мужчины, и женщины должны быть в состоянии достичь одних и тех же целей с одинаковой работой и навыками, традиционная семейная ячейка лучше всего подходит для воспитания семей и поддержания общества, и поэтому добровольное объединение с культурными нормами страны является лучшей политикой."
 ic_generic60_events.5.t: "[GetNewspaperHeader]Дебаты о сексуальности и гендерном признании"
 ic_generic60_events.5.d: "Очень редко поднимаемые до современной эпохи, споры о сагах поставили под сомнение многие традиции в нашем обществе. Глобальное историческое преследование сексуальных меньшинств и альтернативной гендерной идентичности ставится под сомнение, и причины, стоящие за ними, часто анализируются в ходе дискуссий. Вопрос только в том, как общество переварит эти проблемы и как изменится культура в целом.\n Первая группа, традиционалисты, утверждает, что брак священен и что существует только предопределенное историей количество полов, а остальные-просто заблуждения. Традиционалисты стремятся сохранить подавление альтернативной сексуальности и навязать традиционную гендерную идентичность.\n Вторая группа, прогрессисты, считают, что положительные действия по отношению к ЛГБТ  быстро продвигают ценности этой группы в массы. Прогрессисты утверждают, что к ЛГБТ+ людям нужно относиться как к равным и принимать меры для их защиты в обществе от дискриминации.\n Наконец, либералы считают, что ЛГБТ-группы не должны подвергаться дискриминации и должны рассматриваться как равноправные члены общества. Либералы верят, что члены ЛГБТ+ равны со всеми остальным и это должно быть общепризнанным фактом."
 ic_generic60_events.6.t: "[GetNewspaperHeader]Дебаты о милитаризме"
 ic_generic60_events.6.d: "Основа выживания нации и противостояние враждебным силам является наше отношение к военной политике. Вопрос о милитаризме касается самого выживания человечества, и ни одна группа не может полностью согласиться с тем, какая политика является лучшей для мира.\nПацифисты считают, что конфликт как средство достижения цели-это нелепая концепция. Они утверждают, что по своей природе война разрушительна, разрушая то, что могло было быть получено, или давая место для роста тому, что может уничтожить абсолютно все. Они также утверждают, что нашей главной заботой, как цивилизованных существ, является прекращение всех вооруженных конфликтов. Пацифисты считают, что война-это эволюционный тупик, столь же бесполезный, сколь и расточительный.\n С другой стороны этого спора находятся шовинисты. Они верят, что единственные истинные добродетели-это мужество и дисциплина, и при правильном подходе при помощи них можно преодолеть любое препятствие. Шовинисты утверждают, что способность проецировать силу имеет первостепенное значение. Они считают, что единственный способ сохранить наш образ жизни - это убедиться, что все разделяют его; добровольно или нет.\n Есть, однако, и другая группа, которая занимает нейтральную позицию в вопросе войны. Эта группа считает, что война должна быть последним средством и должна вестись только тогда, когда существует законная угроза для нации и когда все другие варианты исчерпаны. Эта группа центристов считает, что правительство должно поддерживать сильную армию для защиты нации, и что она не должна использоваться без крайней необходимости."
 ic_generic60_events.7.t: "[GetNewspaperHeader]Дебаты о глобализации"
 ic_generic60_events.7.d: "С развитием информационных технологий и современного транспорта мир становится все более взаимосвязанным и взаимозависимым. Это вызвало новую дискуссию о том, как мир должен реагировать на экономическую глобализацию.\n Националисты считают, что нация должна быть самодостаточной и не должна беспокоиться о приливах и отливах мировой экономики. Эти националисты утверждают, что иностранные инвесторы будут забирать доходы, произведенные рабочими страны, и тратить их в другом месте, нанося ущерб национальной экономике. Кроме того, эти националисты утверждают, что ресурсы страны будут разграблены, рабочим страны не будет предоставлена справедливая доля, и в целом, страна будет обманута глобальной экономикой.\n  Глобалисты утверждают, что мир-это игра, и только положительный эффект для выйдет благодаря разным странам,что работают вместе. Глобалисты спорят с националистами, обвиняя их в том, что они меркантилисты и что их политика была опробована давно и провалилась. Эти глобалисты верят, что глобальная взаимозависимость и открытая экономика для глобальных инвесторов и рабочих принесут стране огромный уровень богатства и обеспечат процветание нации на долгие годы вперед.\n Существует центристская группа, которая утверждает, что экономическая взаимозависимость и национальная автаркия являются деструктивными концепциями. Эта группа людей верит в умеренный контроль над иностранными инвесторами, запрещающий им огромное количество собственности, а также они верят в умеренно ограниченную иммиграцию и экономику, которая достаточно открыта для мира. Они считают это лучшей политикой."
 ic_generic60_events.8.t: "Создание национальной ТВ сети"
 ic_generic60_events.8.d: "Через несколько месяцев после начала строительства инфраструктуры для национальной телевизионной сети, все было готово. Национальный спрос на телевизоры взлетел до небес, поскольку огромное количество семейств по всей стране борются за возможность купить телевизор. Новая инфраструктура сделала телевидение широко доступным. Уже возникла новая индустрия с большим количеством фильмов и продюсеров, пытающихся сделать огромное количество контента для нациольного телевидения. Все, от новостных станций до образовательных шоу и развлекательных программ, появилось свыше чем на 10 каналах нашей страны."
 ic_generic60_events.9.t: "НОВЫЙ ПРЕТЕНДЕНТ НА КОСМИЧЕСКУЮ ГОНКУ"
 ic_generic60_events.9.d: "[From.owner.GetName] объявил, что их страна также будет участвовать в космической гонке. Первоначально это воспринималось большинством стран как шутка или, возможно, прихоть какого-нибудь диктатора третьего мира. Однако, когда [countryleader=dynamic] показал всему миру свою новую ракету, все поняли, что лидер этой страны настроен серьезно. Многие люди считают, что эта случайная страна никогда не сможет конкурировать со сверхдержавами, но другие считают, что у них еще может быть шанс. Если ничего не изменится, это означает что мир увидит нового соперника в космической гонке.\nУже [From.owner.GetName]’s космическое управление начало работу над своим следующим прототипом, который упраление надеется использовать, чтобы обогнать весь остальной мир."
 ic_generic60_events.10.t: "Открытие национального сообщества кинопродюсеров"
 ic_generic60_events.10.d: "С массовым всплеском спроса на телевизоры и созданием новой телевизионной инфраструктуры было только вопросом времени, когда новые предприниматели и амбициозные звезды начнут создавать свои собственные программы, пытаясь сделать их популярными на серебряном экране. В результате в [capital=dynamic] открылось национальное сообщество кинопродюсеров. Это сообщество имеет бизнес, в значительной степени основанный на киноиндустрии, и будет делиться мастерскими, технологиями, персоналом и талантами для производства культовых фильмов, которые будут показываться по всей стране."
 ic_generic60_events.11.t: "Национальная мультпиликация стала популярной!"
 ic_generic60_events.11.d: "[From.owner.GetName] начало охватывать мультипликациионая культура. Уже сейчас большинство развлекательных программ на телевидении показывают анимационные комедии, которые пользуются популярностью как молодых, так и старых. Массовый всплеск анимационного программирования привел  к тому. что [From.owner.GetName], создал своей уникальный стиль анимации.\nУже сейчас многие из наших шоу очень популярны на международном уровне, поскольку они получили известность в соседних странах."
 ic_generic60_events.12.t: "Национальные драмы стали популярны!"
 ic_generic60_events.12.d: "[From.owner.GetName] начало охватывать культура драмы. От мыльных опер до серьезных фильмов, вот основа развлечения в нашей стране. Начиная от драмы и заканчивая романтикой, каждый из этих серьезных фильмов имеет свой уникальный отклик в обществе.\nУже сейчас многие из наших шоу очень популярны на международном уровне, поскольку они получили известность в соседних странах."
 ic_generic60_events.13.t: "Низко-качественный юмор становится популярным"
 ic_generic60_events.13.d: "[From.owner.GetName] наблюдает всплеск комиков и артистов эстрады, которые доводят до смеха всю страну. Многие граждани [From.owner.GetName] наслаждаются такой формой юмора, забывая о собственных проблем. Уже сейчас клубы ипровизации и комедийные шоу начали появляться по всей стране, а некоторые даже возникают в соседних странах."
 ic_generic60_events.14.t: "Вещенание национальной \"Большой игры\"."
 ic_generic60_events.14.d: "Впервые в [From.owner.GetName] истории, спортивные игры будут показаны на телевидение. Но это не просто очередная спортивная игра, это кубок традиционного чемпионата [From.owner.GetName]. Вся страна, казалось, замерла на час и внимательно следила за всем. Помимо последствий самой игры, страна также показала, как далеко она продвинулась экономически."
 ic_generic60_events.15.t: "Изобразительное искусство становится популярным"
 ic_generic60_events.15.d: "Изобразительное искусство, классическая музыка, и многие другие формы искусства становятся популярными в нашей стране. Многие люди начинают интересоваться искусством, а некоторые выбирают его в качестве своего хобби.\nВ результате, огромное количество музеев начинают появляться по всей стране, чтобы сохранить нашу истроию в виде предметов искусства."
 ic_generic60_events.16.t: "Круглосуточное радиовещание"
 ic_generic60_events.16.d: "Расширение национальной радиосети обеспечило стандартизированную, связанную радиосеть, которая полностью охватывает все районы страны, даже сельские и отдаленные районы страны за пределами телевизионной сети могут получить к ней доступ. Эта радиосеть значительно поможет в коммуникации и соединит страну через среду, которая позволит каждому получить доступ к информационным и развлекательным каналам."
 ic_generic60_events.17.t: "Страна создает военную новостную сеть[ВНС]"
 ic_generic60_events.17.d: "[From.owner.GetName] создала национальную военную новостную сеть, которая будет сообщать в национальные СМИ о том, что происходит в войсках. ВНС будет транслировать информацию и новости, которые, как заверил [Root.GetLeader] будут “полностью нейтральными, основанными на фактах, в отличие от частны СМИ”. Уже сейчас новостные станции  ВНС создаются по всей стране для сбора и передачи информации. Кроме того, распространились слухи, что правители страны рассматривают возможность того, чтобы военные репортеры изучали независимые источники информации и сообщали об их точности."
 ic_generic60_events.18.t: "Country Reaffirms Independant Reporters"
 ic_generic60_events.18.d: "[From.owner.GetName] has reaffirmed the position and importance of independent reporters and their rights. Citing that the independent media is an important part of any functioning country, [Root.GetLeader] has assured reporters that their positions and activities are important to the country and keeping it informed. This has a lot of independent reporters in [From.owner.GetName] relieved that they will be safe from prosecution and will be able to continue their jobs. Additionally, the action has many liberal citizens happy that the government will not attempt to skew national viewpoints by establishing military reporters."
 gen60_debate_over: "Национальные дебаты завершены"
 gen60_debate_begin: "Начались национальные дебаты"
 gen60_good_fun: "Убирайся, я в эфире!"
 gen60_stop_criminal_scum: "Теперь мы оставим свой след"
 gen60_exciting: "Потрясающе"
 gen60_only_the_best: "Это доказательство того, что наша культура самая лучшая"
 gen60_as_it: "Так и должно быть"
 wp.1.d: "Во время нашего обстрела белым фосфором несколько снарядов были выпущены по неправильным координатам, попав в соседний город. После того, как огонь погас, наша разведгруппа отправилась оценивать ущерб. Несколько зданий были разрушены, и многие мирные жители погибли. Этот инцидент, несомненно, уменьшит поддержку этой войны."
 ABILITY_WHITE_PHOSPHOROUS_DESC: "В сторону противника будет произведен заградительный огонь из РГ боеприпасов."
 americo_liberian_minority_rule: "Американо-либерийское правление меньшиства"
 gen60_infrastructure_interstate: "Строительство национальной автомагистрали"
 gen60_infrastructure_interstate_desc: "Наша страна имеет плохое транспортное сообщение. Нам нужно построить национальную автомагистраль, чтобы соединить нашу страну воедино."
 gen60_infrastructure_railway: "Строительство новой железной дороги"
 gen60_infrastructure_railway_desc: "Теперь, когда у нас есть новая национальную автомагистраль, мы должны начать строительство магистральной железной дороги, о которой безостановочно говорил наш министр финансов."
 gen60_infrastructure_urban: "Расширение городской инфраструктуры"
 gen60_infrastructure_urban_desc: "Мы должны стремиться к расширению городской инфраструктуры в наших городах, чтобы повысить производительность труда."
 gen60_infrastructure_revise_planning: "Пересмотреть городское планирование"
 gen60_infrastructure_revise_planning_desc: "Мы должны пересмотреть то, как мы проводим городское планирование, чтобы лучше спланировать будущее расширение и рост городской инфраструктуры."
 gen60_mil_naval_bases: "Строительство морских баз"
 gen60_mil_naval_bases_desc: "Мы значительно расширили нашу наземную инфраструктуру. Однако пришло время расширить нашу военно-морскую инфраструктуру и построить порты и гавани в наших городах."
 gen60_civilian_rust_belt: "Оживить ржавый пояс"
 gen60_civilian_industrialize: "Индустриализация"
 gen60_civilian_urban_renewal: "Обновление городов"
 gen60_civilian_urban_services: "Городской сервис"
 gen60_civilian_rust_belt_desc: "Ржавый пояс-промышленный центр нашей страны, когда-то это был гордый центр нашей промышленности, сейчас это просто ржавые заводы. Мы должны возродить пояс, чтобы вернуть ему былую славу."
 gen60_civilian_industrialize_desc: "Есть много мест в нашей стране, оставшихся неиндустриализованными и полными безработицы, мы должны создать пакет стимулов для промышленников, чтобы спасти эти области."
 gen60_civilian_urban_renewal_desc: "Мы страдаем от сильных городских проблем. Высокая преступность, районы с низким уровнем доходов, они слишком распространены и создают проблемы для тех, кто живет в них и за их пределами. Мы должны вернуть этим местам былое величие."
 gen60_civilian_urban_services_desc: "Муниципальные власти должны начать расширять гражданскую инфраструктуру"
 gen60_mil_air_bases: "Строительство военно-воздушных баз"
 gen60_mil_air_bases_desc: "Чтобы защитить нашу страну, нашим военно-воздушным силам необходимо больше авиабаз для контроля воздушного пространства. Новые базы будут домом наших ангелов-хранителей."
 gen60_military_industrial_complex: "Расширить военно-промышленный комплекс"
 gen60_military_industrial_complex_desc: "Наш ВПК не справляется с поставленными задачами. Нам нужно расширить расходы на него."
 gen60_military_naval_expansion: "Военно-морская экспансия"
 gen60_military_naval_expansion_desc: "Наш флот слишком слаб. Нам нужно начать строительство новых верфей."
 gen60_military_revise_plans: "Пересмотреть планы"
 gen60_military_revise_plans_desc: "Нам нужно пересмотреть наши планы по обороне страны и подумать о расширении нашей армии."
 gen60_military_increase_spending: "Увеличение военных расходов"
 gen60_military_increase_spending_desc: "Мы должны увеличить сумму, которую тратим на нашу оборону."
 gen60_mil_radar: "Радиолокационный проект"
 gen60_mil_radar_desc: "Радар имеет решающее значение для современных боевых действий. Мы должны попытаться исследовать новые радиолокационные технологии."
 gen70_civil_defense: "Основать бюро гражданской обороны"
 gen70_civil_defense_desc: "В эпоху наращивания ядерных запасов, ужасающих достижений в области химического оружия и растущего радикализма мы должны создать бюро по борьбе с терроризмом, защите населения, планированию гражданской обороны и шпионажу за диссидентами."
 gen70_maritime_guard: "Основать морскую охрану"
 gen70_maritime_guard_desc: "Контрабандисты, террористы, картели и бесчисленное множество других преступников доставляют в нашу страну контрабанду и сеют раздор. Морская охрана станет частью военно-морского флота и будет заниматься защищитой наших берегов от преступной и террористической деятельности."
 gen70_found_mpf_branch: "Корпус муниципальной охраны"
 gen70_found_mpf_branch_desc: "Муниципальная охрана - это специальное подразделение морской охраны. Она будет защищать порты городов и пытаться непосредственно пресекать внутригородскую контрабанду и преступность. Кроме того, эти силы будут обыскивать склады и суда в поисках контрабанды."
 gen70_mpf_autonomy: "Милитаризация муниципальной охраны"
 gen70_mpf_autonomy_desc: "Расширив морскую охрану, мы выделим дополнительные средства на группы быстрого реагирования, и также мы снабдим муниципальную охрану специальной бронетехникой для борьбы с террористами, а также для дополнительной защитой доков."
 gen70_navy_patrols_coast: "Сфокусироваться на борьбе с терроризмом"
 gen70_navy_patrols_coast_desc: "Наша морская охрана должна сосредоточиться на борьбе с терроризмом и преступностью, а не на подготовке к войне. Защита граждан является приоритетом для нас."
 gen70_navy_patrols_deep: "Фокус на голубой воде"
 gen70_navy_patrols_deep_desc: "Наша морская охрана должна сосредоточиться на национальной безопасности, а не на защите гражданских. Защита нашей страны от иностранных захватчиков-наша главная забота."
 gen70_patrol_in_being: "Патруль в пути"
 gen70_patrol_in_being_desc: "Отныне мы будем поддерживать более высокий уровень безопасности, а также теперь каждое судно, что будет у нас вызывать подозрение, должно будет пройти специальную проверку. Этим займутся специально созданные патрули."
 gen70_naval_optics: "Модули кораблей"
 gen70_naval_optics_desc: "Наши морские модули недостаточно эффективны. мы создадим специальный фонд на разработку лучших морских модулей для наших флотов."
 gen70_naval_airforce: "Воздушное патрулирование"
 gen70_naval_airforce_desc: "В то время как патрульные корабли хорошо справляются со своими задачами, патрульные самолеты же в свою очередь могут собирать гораздо больше информации, обхватывать большую площадь, и видеть с неба намного больше, чем моряки на катерах. Мы создадим морскую патрульную авиацию для охоты на преступников. "
 gen70_monitor: "Мониторы"
 gen70_monitor_desc: "Патрулирование рек также является важным вопросом. Мы создадим патрули из наблюдательных катеров, которые будут заниматься охраной рек и борьбой с преступностью"
 gen70_mairtime_emergency: "Группы по борьбе с пиратством"
 gen70_maritime_emergency: "Группы по борьбе с пиратством"
 gen70_maritime_emergency_desc: "Создание морских подразделений по борьбе с пиратством, состоящих из тяжеловооруженных морских пехотинцев, имеет первостепенное значение для защиты нашей нации. Нельзя недооценивать угрозу вооруженных пиратов, и эти подразделения, в случае необходимости, попытаются вернуть контроль над захваченными торговыми судами."
 gen70_naval_helo: "Вертолетные подразделения"
 gen70_naval_helo_desc: "Мы должны создать группу военно-морских вертолетов для нашей морской охраны, чтобы она могла в полной мере реагировать на угрозы и вести войну против иностранных захватчиков."
 gen70_remote_posts: "Посты дистанционного прослушивания"
 gen70_remote_posts_desc: "Сеть постов дистанционного прослушивания даст нам приемущество против вражеских морских атак, или же даст нам информацию о присутствие подводных лодок, что позволит нам предотвратить внезапные атаки."
 gen70_naval_bombers: "Воздушная оборона"
 gen70_naval_bombers_desc: "Мы добавим морские бомбардировщики и авиационный корпус поддержки к нашей морской охране, чтобы мы могли бомбить вражеские флоты, которые находятся в пределах досягаемости нашей авиации, или же мы сами сможем наносить удары по их портам."
 gen70_nat_militia: "Основать национальную милицию"
 gen70_nat_militia_desc: "Милиция будет выполнять функции военизированной организации как в мирное, так и в военное время. Оно будет помогать нашей армии, а также нести гарнизонную службу."
 gen70_militia_urban: "Сфокусироваться на защите граждан"
 gen70_militia_urban_desc: "Наша национальная милиция должна быть сосредоточена прежде всего на защите простных граждан и оборонительных операциях."
 gen70_militia_rural: "Сфокусироваться на помощи армии"
 gen70_militia_rural_desc: "Национальная милиция будет сосредоточена в первую очередь на поддержке армии и нашей военной машины."
 gen70_metro: "Гарнизон"
 gen70_metro_desc: "Гарнизоны национальной милицим не только помогут нашим войскам в защите наших городов, но и разработают тактику ведения боевых действий в городе, которую мы сможем применять во время войны."
 gen70_nbc_civilian_safety: "Гражданская безопасность от ЧС"
 gen70_nbc_civilian_safety_desc: "Мы живем в эпоху ядерных, биологических и химических угроз. Последствия ядерной войны, наводнения, вызванные биологической инвазией, и турбулентность химического загрязнения нельзя недооценивать. Наша национальная милиция возьмет под контроль гражданскую оборону и начнет строить укрытия и оборонительные системы для смягчения последствий применения этих видов оружия."
 gen70_militia_patrols: "Милицейские патрули"
 gen70_militia_patrols_desc: "Чтобы лучше защитить нашу страну, мы создадим милицейские патрули, это позволит облегчить бремя наших регулярных войск, которые в данный момент заняты также и внутренней безопасностью."
 gen70_helo_patrols: "Вертолетные патрули"
 gen70_helo_patrols_desc: "Финансирование вертолетного корпуса для нашей национальной милиции-более дорогой, но более эффективный вариант противодействия внутренним угрозам. Таким образом, мы будем использовать более значительное количество вертолетов, чем обычно, которые будут помогать нашим наземным патрулям."
 gen70_motor_patrols: "Автомобильные патрули"
 gen70_motor_patrols_desc: "В то время как вертолеты были бы вариантом Cтронера, вместо одного вертолета, мы могли бы приобрести более 10 патрульных машин. Вертолеты будут играть второстепенную роль, и мы сосредоточимся в основном на наземном патрулировании."
 gen70_mps: "Эффективная оборона"
 gen70_mps_desc: "Мы укрепим наши гарнизоны и проведем обширные исследования по повышению эффективности наших оборонительных батарей для защиты нашей нации."
 gen70_mobs: "Основать главную операционную базу"
 gen70_mobs_desc: "Первый шаг в создании национальной милиции - это основание главной операционной базы, в будущем это поможет нам в формирование баз передового развёртывания."
 gen70_fobs: "Сооружение баз передового развёртывания"
 gen70_fobs_desc: "Основной фокус нашей национальной милиции это создание баз переводого развёртывания, которые будут заниматься снабжением наших вооруженных сил"
 gen70_logistic_corp: "Корпус логистики национальной милиции"
 gen70_logistic_corp_desc: "Армия сражается с теми припасами, которые у нее есть. Снабженцы не имеют такой же дисциплины и боевой мощи, как у фронтовиков. Поэтому лучшим вариантом в данной ситуации является перевод большинства наших сил национальной милиции на материально-техническое обеспечение."
 gen70_mil_hospitals: "Военные госпитали"
 gen70_mil_hospitals_desc: "Военные потери представляют собой огромную угрозу для любой нации, и не только из-за потери населения, но и из-за потери ветеранов-это смертельно опасно, особенно в связи с тем, что армии имеют все большие и большие требований к профессионализму и мастерству."
 gen70_cbd_rad: "Воздушной командование"
 gen70_cbd_rad_desc: "Расширение центральной системы безопасности до воздушной командной сети в нашей стране является важной частью современной войны. Способность объединить наши системы в сеть для отражения воздушных атак противника жизненно важна."
 gen70_network_centric: "Центральная сеть ВВС"
 gen70_network_centric_desc: "Помимо простой централизованной системы организации нашей воздушной обороны, мы создадим систему центрального командования, это позволит нашим военно-воздушным силам работать самым эффективным образом."
 gen70_defense_focus: "Локальные центры ВВС"
 gen70_defense_focus_desc: "Вместо общей центральной системы мы будем делегировать ресурсы на уровни местного командования, которые займутся решением конкретных проблем в конкретных регионах, а ресурсы мы будем рапределять между этими регионами исходя из их стратегической важности."
 gen70_interceptor: "Сеть перехватчиков"
 gen70_interceptor_desc: "Мы создадим сети перехватчиков, которые будут охватывать конкретные регионы, и создадим высокоэффективные сети перехватчиков, которые снизят затраты на запуск перехватчиков."
 gen70_particularist: "Особая оборонительная сеть"
 gen70_particularist_desc: "В то время как сеть перехватчиков была бы исключительно мощным инструментом в небе, она также требует слишком много ресурсов, в следствие чего, мы не сможем создать эффективную сеть перехватчиков. Вместо этого наши ресурсы лучше было бы направить на борьбу с ущербом и на систему защиты промышленных центров."
 gen70_adhoc_inter: "Программа исследования перехватчиков"
 gen70_adhoc_inter_desc: "Мы профинансируем создание новой конструкции перехватчика и выделим политические ресурсы на этот новый самолет, чтобы увеличить потенциал наших перехватчиков."
 gen70_adhoc_multi: "Многоцелевая исследовательская программа"
 gen70_adhoc_multi_desc: "У нас нет ресурсов для того, чтобы содерждать множество перехватчиков, даже если мы создами конструкцию самого лучшего перехватчика, мы не сможем позволить себя его  массовое строительство. Вместо них, мы будем производить многоцелевые самолеты, которые смогут выполнять множество различных задач. Использование таких самолетов будет намного выгоднее и разумнее."
 gen70_adhoc_radar: "Программа радиолокационных исследований"
 gen70_adhoc_radar_desc: "Важнейшие регионы нашей страны имеют недостаточное радиолокационное покрытие, мы будем инвестировать в новую радиолокационную систему, чтобы улучшить наши существующие системы в этих районах."
 gen70_adhoc_sam: "Исследовательский проект ЗРК"
 gen70_adhoc_sam_desc: "Наши ЗРК устарели, и в эпоху, когда реактивные самолеты становятся все более смертоносными и мощными, нам понадобится самая новейшая антивоздушная защита."
 gen70_net_expansion: "Расширение радиолокационной сети"
 gen70_net_expansion_desc: "Мы можем направить политические ресурсы на расширение нашей сети воздушно-космической обороны и на улучшение защиты страны в целом."
 gen70_military_research: "Военно-исследовательский центр ГО"
 gen70_military_research_desc: "Сама сложность системы гражданской обороны, которую мы сейчас имеем, создает нагрузку на наши существующие ресурсы. Бесчисленные сети по гражданской защите, борьбе с терроризмом и обороне потребуют создания объекта, предназначенного для их управления и совершенствования."
 gen70_industrial_philosophy: "Производственное направление"
 gen70_industrial_philosophy_desc: "Пришло время выбрать философию нашей индустрии и направление, в котором будет развиваться наша экономика."
 gen70_industrialism: "Индустриализм"
 gen70_industrialism_desc: "Наш промышленный сектор лучше всего сосредоточен на переработке ресурсов, а не на переработке сырья. Нашей стране не хватает природных ресурсов, чтобы основывать нашу экономику только на их сборе."
 gen70_hybridization: "Гибридизация"
 gen70_hybridization_desc: "У нашей страны достаточно ресурсов, но мы должны сосредоточиться прежде всего на сбалансировании нашей экономики и управлении вертикальной цепочкой поставок."
 gen70_rentierization: "Государство-рантье"
 gen70_rentierization_desc: "Огромные и богатые экономические ресурсы нашей страны созрели для сбора и экспорта, мы должны сосредоточить наши усилия на том, что наиболее выгодно: на сборе и переработке!"
 gen70_con_goods: "Экономика потребления"
 gen70_con_goods_desc: "Экономика потребления в нашей стране могло бы стать сильнее, если мы сможем наладить производство товаров для внутреннего рынка "
 gen70_housing_construction_industry: "Жилищная индустрия"
 gen70_housing_construction_industry_desc: "Наши обширные участки земли являются идеальной недвижимостью для жилья, и у нас есть вся промышленность, чтобы поддержать бурно развивающуюся жилищную индустрию. Наша страна начнет процветать, если мы начнем восстанавливать и строить новое жилье самостоятельно."
 gen70_intermediates: "Индутрия промежуточных товаров"
 gen70_intermediates_desc: "Производство промежуточных товаров, таких как детали, строительные материалы и незавершенные изделия, является прибыльным делом."
 gen70_industrial_goods_factories: "Индустрия промышленных товаров"
 gen70_industrial_goods_factories_desc: "Зачем импортировать машины, если мы сами можем производить машины и транспорт? Промышленные фабрики могут также потреблять произведенные внутри страны промежуточные товары."
 gen70_construct_mines: "Строительство шахт"
 gen70_construct_mines_desc: "На земле нашей страны есть огромные богатства, и мы должны стремиться к их добыче, чтобы получить ещё больше прибыли!"
 gen70_lumber_stone_energy: "Древесина, камень, энергия"
 gen70_lumber_stone_energy_desc: "Древесина, камень, энергия-все, что вам нужно. Запуск доступного энергетического проекта и объединение его с органическими ресурсами RGOs идеально подходит для процветания нашей страны."
 gen70_oil_sources: "Нефтепровод"
 gen70_oil_sources_desc: "Наши ресурсы лучше всего расходовать на строительство нефтепровода внутри нашей страны, который поможет в добычи и переработки нефти."
 gen70_oil_refineries: "Нефтяная логистика"
 gen70_oil_refineries_desc: "Обеспечение нефтеперерабатывающей логистики и приоритетное использование инфраструктуры нефтеперерабатывающими заводами-это идеальный способ укрепить нашу экономику сбора природных ресурсов."
 gen70_bureau_of_industry: "Бюро промышленности"
 gen70_bureau_of_industry_desc: "Создание бюро промышленности для удовлетворения потребностей наших вновь возникающих заводов и производственной экономики жизненно важно для их будущего состояния!"
 gen70_vertical: "Вертикальная экономика"
 gen70_vertical_desc: "Самодостаточность, сокращение избыточности, отсутствие посредников, вертикальная экономика - это наилучший возможный результат, и благодаря наличию вертикальной экономики, мы можем получить гораздо больше дохода, чем без неё."
 gen70_rgo_economy: "Экономика сбора ресурсов"
 gen70_rgo_economy_desc: "Наша промышленная экономика сейчас имеет бурно развивающийся сектор, который занимается сбором ресурсов. Мы получим огромную прибыль от дешевого сбора, а затем и от продажи природных ресурсов!"
 gen70_commercial_philosophy: "Коммерческая философия"
 gen70_commercial_philosophy_desc: "Если мы хотим платить за политикам и поддерживать конкурентоспособность в мире, то должны выбрать путь для получения дохода."
 gen70_artisan: "Ремесленная коммерция"
 gen70_artisan_desc: "Непродуктивные маркетинговые отделы, банкиры и другие бесчисленные бессмысленные должности должны быть сведены к минимуму в нашей стране. Продуктивное коммерческое предприятие-залог успеха."
 gen70_commercial_hybrid: "Сбалансированная коммерция"
 gen70_commercial_hybrid_desc: "Торговля на финансовой основе-это фантастическое благо для любого национального дохода и экономической логистики, но без поддержки она нестабильна и ненадежна. Хорошо поддерживаемая коммерческая логистика обеспечит рост нашей экономики!"
 gen70_financial: "Финансовая коммерция"
 gen70_financial_desc: "Банкиры, клерки, конторы, магазины, досуг. Наличие мощного коммерческого центра, процветающего благодаря активной деятельности, и мощной финансовой основы приведет к стремительному повышению наших доходов и экономическому росту!"
 gen70_office_zoning: "Офисное зонирование"
 gen70_office_zoning_desc: "Нам нужно начать подготовку к созданию офисных районов в нашем городе рядом с жилыми домами. Они буферизуют шум от коммерции и обеспечивают невероятные блага для самой коммерции."
 gen70_office_priority: "Специальное зонирование"
 gen70_office_priority_desc: "Мы можем еще больше повысить нашу коммерческую мощь, введя более тщательно спланированные и специализированные городские зоны. Предписывая коммерции быть вблизи или даже в жилых районах, а также, чтобы эти районы были хорошо вписаны во внешний вид, самодостаточным и минимально громкими, мы будем держать жилые районы тихими, а коммерцию-в пределах досягаемости домов. Наличие досуговых районов по другую сторону офисов для обеспечения развлечений для людей улучшит качество жизни. Наконец, резервирование районов с самой высокой стоимостью земли или вблизи достопримечательностей, которые будут специализироваться на туризме, значительно повысит доходы от туристов."
 gen70_banking_it: "Банковское дело и информационные технологии"
 gen70_banking_it_desc: "Заключительная часть нашего плана-создание 2 дополнительных специализированных офисных зон. Информационные и банковские сектора. Гарантирование пространства для этих драгоценных районов и предоставление им приоритетных услуг, а также отсутствие налога на имущество будут давать огромные суммы богатства и обеспечивать большие суммы налоговых доходов в других местах."
 gen70_agrarian_growth: "Права земельного сектора"
 gen70_agrarian_growth_desc: "Одним из лучших способов обеспечить стабильную экономику являются товарные культуры и сельское хозяйство. Предоставление земельных прав сельскохозяйственным секторам и снижение налогов на них обеспечат устойчивый и стабильный сельскохозяйственный сектор и, следовательно, стабильную экономику."
 gen70_agrarian_prospects: "Перспективы и гранты на развитие"
 gen70_agrarian_prospects_desc: "Предоставление субсидий на развитие и выделение обширных земельных участков сельскохозяйственному сектору для выращивания товарных культур улучшит рост сельского хозяйства и дополнительно обеспечит экономическую стабильность и региональную самодостаточность, чтобы предотвратить возникновение проблем, связанных с глобальными экономическими кризисами."
 gen70_cash_crops: "Товарная культура"
 gen70_cash_crops_desc: "Существует много ценных сельскохозяйственных товаров, пользующихся высоким спросом на рынке, и благодаря тщательному анализу, планированию и осознанию мы можем нажиться на них и получить большие суммы дохода, одновременно имея возможность использовать их для нашего собственного экономического роста и выгоды в будущем."
 gen70_city_logistics: "Сельская логистика"
 gen70_city_logistics_desc: "От фермы к столу, мы будем экспериментировать с нашей агро-индустильной логистикой в регионах, которые не отличаются особым развитием, так мы на учимся на том, что мы создаем."
 gen70_export_agencies: "Экспортное агентство"
 gen70_export_agencies_desc: "Пришло время создать экспортное агентство  и извлекать выгоду из взлетов и падений мирового рынка. Мы сможем позаботиться о наших собственных потребностях, получая выгоду от роста рынка."
 gen70_warehousing_districts: "Складские районы"
 gen70_warehousing_districts_desc: "С нашей сбалансированной экономикой мы должны развивать складские районы рядом с железнодорожными узлами между коммерческими и промышленными зонами, чтобы поддерживать нашу торговлю стабильной и прибыльной. Система."
 gen70_commercial_zoning: "Больше коммерческих зон"
 gen70_commercial_zoning_desc: "У нас есть много неиспользованной дорогой земли в некоторых наших городах."
 gen70_commercial_logistics: "Коммерческая логистика"
 gen70_commercial_logistics_desc: "Некоторые коммерческие районы представляют собой абсолютный беспорядок, и им приходится направлять движение по неэффективным, узким дорогам или просто стоять в пробках в течение длительного периода времени. Везде, где это происходит, мы должны рассмотреть вопрос о пересмотре нашего муниципального планирования, чтобы лучше приспособить коммерческую логистику."
 gen70_militia_brigade: "Создание бригад милиции"
 gen70_militia_brigade_desc: "Мы должны найти время для создания милицейских бригад, тем самым заложив основы для национальных милицейских организаций, а также нам необходимо разработать стандартизированный формат этих сил"
 gen70_cooperative_counterterrorism: "Совместные силы антитеррора"
 gen70_cooperative_counterterrorism_desc: "Мы должны создать совместные антитеррористические силы с нашими союзниками, чтобы лучше защищать друг друга и экстрадировать террористов"
 gen70_infrastructure_interstate: "Строительство национальной автомагистрали"
 gen70_infrastructure_interstate_desc: "Наша страна имеет плохое транспортное сообщение. Нам нужно построить национальную автомагистраль, чтобы соединить нашу страну воедино."
 gen70_infrastructure_railway: "Строительство новой железной дороги"
 gen70_infrastructure_railway_desc: "Теперь, когда у нас есть новая национальную автомагистраль, мы должны начать строительство магистральной железной дороги, о которой безостановочно говорил наш министр финансов."
 gen70_infrastructure_urban: "Расширение городской инфраструктуры"
 gen70_infrastructure_urban_desc: "Мы должны стремиться к расширению городской инфраструктуры в наших городах, чтобы повысить производительность труда."
 gen70_infrastructure_revise_planning: "Пересмотреть городское планирование"
 gen70_infrastructure_revise_planning_desc: "Мы должны пересмотреть то, как мы проводим городское планирование, чтобы лучше спланировать будущее расширение и рост городской инфраструктуры."
 gen70_mil_naval_bases: "Строительство морских баз"
 gen70_mil_naval_bases_desc: "Мы значительно расширили нашу наземную инфраструктуру. Однако пришло время расширить нашу военно-морскую инфраструктуру и построить порты и гавани в наших городах."
 gen70_civilian_rust_belt: "Оживить Ржавый пояс"
 gen70_civilian_industrialize: "Индустриализация"
 gen70_civilian_urban_renewal: "Городское возрождение"
 gen70_civilian_urban_services: "Городской сервис"
 gen70_civilian_rust_belt_desc: "Ржавый пояс-промышленный центр нашей страны, когда-то это был гордый центр нашей промышленности, сейчас это просто ржавые заводы. Мы должны возродить пояс, чтобы вернуть ему былую славу."
 gen70_civilian_industrialize_desc: "Есть много мест в нашей стране, оставшихся неиндустриализованными и полными безработицы, мы должны создать пакет стимулов для промышленников, чтобы спасти эти области."
 gen70_civilian_urban_renewal_desc: "Мы страдаем от сильных городских проблем. Высокая преступность, районы с низким уровнем доходов, они слишком распространены и создают проблемы для тех, кто живет в них и за их пределами. Мы должны вернуть этим местам былое величие."
 gen70_civilian_urban_services_desc: "Муниципальные власти должны начать расширять гражданскую инфраструктуру"
 gen70_mil_air_bases: "Строительство военно-воздушных баз"
 gen70_mil_air_bases_desc: "Чтобы защитить нашу страну, нашим военно-воздушным силам необходимо больше авиабаз для контроля воздушного пространства. Новые базы будут домом наших ангелов-хранителей."
 gen70_military_industrial_complex: "Расширить военно-промышленный комплекс"
 gen70_military_industrial_complex_desc: "Наш ВПК не справляется с поставленными задачами. Нам нужно расширить расходы на него."
 gen70_military_naval_expansion: "Военно-морская экспансия"
 gen70_military_naval_expansion_desc: "Наш флот слишком слаб. Нам нужно начать строительство новых верфей."
 gen70_military_revise_plans: "Пересмотреть планы"
 gen70_military_revise_plans_desc: "Нам нужно пересмотреть наши планы по обороне страны и подумать о расширении нашей армии."
 gen70_military_increase_spending: "Увеличение военных расходов"
 gen70_military_increase_spending_desc: "Мы должны увеличить сумму, которую тратим на нашу оборону."
 gen70_mil_radar: "Радиолокационный проект"
 gen70_mil_radar_desc: "Радар имеет решающее значение для современных боевых действий. Мы должны попытаться исследовать новые радиолокационные технологии.\""
 civil_defense_bureau: "Бюро гражданской обороны"
 civil_defense_bureau_desc: "Эта страна основала бюро гражданской обороны в ответ на растущую озабоченность по поводу гражданской обороны и терроризма."
 maritime_guard: "Морская охрана"
 maritime_guard_coast: "Морская береговая охрана"
 maritime_guard_advanced: "Морская береговая охрана(Расширенная)"
 maritime_guard_deep: "Морская охрана голубых вод"
 maritime_guard_deep_advanced: "Морская охрана голубых вод (Расширенная)"
 maritime_guard_desc: "Эта нация основала морскую охрану."
 maritime_guard_coast_desc: "В этой стране есть морская охрана, которая занимается гражданской обороной."
 maritime_guard_advanced_desc: "В этой стране есть расширенная морская охрана, которая занимается гражданской обороной."
 maritime_guard_deep_desc: "В этой стране есть морская охрана, которая занимается национальной обороной."
 maritime_guard_deep_advanced_desc: "В этой стране есть расширенная морская охрана, которая занимается национальной обороной."
 national_miltia: "Создать народное ополчение"
 national_miltia_urban: "Народное ополчение"
 national_miltia_metro: "Народное ополчение в метро"
 national_miltia_metro_advanced: "Народное ополчение в метро"
 national_miltia_metro_professional: "Резервный корпус метрополитена"
 national_miltia_rural: "Народное ополчение"
 national_miltia_network: "Рабочая сеть народного ополчения"
 national_miltia_network_advanced: "Рабочая сеть народного ополчения"
 national_miltia_network_professional: "Рабочая сеть резервного корпуса"
 national_miltia_desc: "Эта страна пытается создать национальное ополчение"
 national_miltia_urban_desc: "Эта страна создала национальное ополчение"
 national_miltia_metro_desc: "Эта страна создала национально ополчение, которое фокусируется на граджанской обороне и охране"
 national_miltia_metro_advanced_desc: "Эта страна создала национально ополчение, которое фокусируется на граджанской обороне и охране"
 national_miltia_metro_professional_desc: "Эта страна создала резервный корпус, которое фокусируется на граджанской обороне и охране"
 national_miltia_rural_desc: "Эта страна создала национальное ополчение"
 national_miltia_network_desc: "Эта страна создала развлетленную сеть национального ополчения, которая сосредоточена на охране"
 national_miltia_network_advanced_desc: "Эта страна создала развлетленную сеть национального ополчения, которая сосредоточена на обороне"
 national_miltia_network_professional_desc: "Эта страна создала развлетленную сеть резервного корпуса, которая сосредоточена на обороне"
 cbd_rad: "Бюро гражданской обороны"
 cbd_rad_net: "Бюро гражданской обороны"
 cbd_rad_def: "Бюро гражданской обороны"
 cbd_rad_net_inter: "Бюро гражданской обороны"
 cbd_rad_def_inter: "Бюро гражданской обороны"
 cbd_rad_net_pdn: "Бюро гражданской обороны"
 cbd_rad_def_pdn: "Бюро гражданской обороны"
 cbd_rad_desc: "Эта страна основала бюро гражданской обороны в ответ на растущую озабоченность по поводу гражданской обороны и терроризма. Бюро гражданской обороны создало сеть воздушно-космической обороны."
 cbd_rad_net_desc: "Эта страна основала бюро гражданской обороны в ответ на растущую озабоченность по поводу гражданской обороны и терроризма. Бюро гражданской обороны создало сеть, ориентированную на воздушно-космическую оборону."
 cbd_rad_def_desc: "Эта страна основала бюро гражданской обороны в ответ на растущую озабоченность по поводу гражданской обороны и терроризма. Бюро гражданской обороны создало сеть аэрокосмической обороны, ориентированную на гражданскую оборону."
 cbd_rad_net_inter_desc: "Эта страна основала бюро гражданской обороны в ответ на растущую озабоченность по поводу гражданской обороны и терроризма. Бюро гражданской обороны создало сетевую сеть аэрокосмической обороны с сетью перехватчиков."
 cbd_rad_def_inter_desc: "Эта страна основала бюро гражданской обороны в ответ на растущую озабоченность по поводу гражданской обороны и терроризма. Бюро гражданской обороны создало ориентированную на гражданскую оборону сеть воздушно-космической обороны с сетью перехватчиков."
 cbd_rad_net_pdn_desc: "Эта страна основала бюро гражданской обороны в ответ на растущую озабоченность по поводу гражданской обороны и терроризма. Бюро гражданской обороны создало сетевую сеть аэрокосмической обороны с противовоздушной сетью."
 cbd_rad_def_pdn_desc: "Эта страна основала бюро гражданской обороны в ответ на растущую озабоченность по поводу гражданской обороны и терроризма. Бюро гражданской обороны создало ориентированную на гражданскую оборону сеть воздушно-космической обороны с противовоздушной сетью."
 economic_philosophy_basic: "Экономическое планирование"
 economic_philosophy_basic_desc: "Администрация этой страны в настоящее время ведет подготовку к расширению экономики"
 economic_philosophy_industrialism: "Сырьевый индустриальный сектор"
 economic_philosophy_industrialism_con: "Сырьевый индустриальный сектор"
 economic_philosophy_industrialism_civ: "Сырьевый индустриальный сектор"
 economic_philosophy_industrialism_bureau: "Сырьевый индустриальный сектор"
 economic_philosophy_industrialism_desc: "В этой стране есть развитый промышленный сектор, ориентированный на сырьевую производительность и рост фабрик"
 economic_philosophy_industrialism_con_desc: "В этой стране есть развитый промышленный сектор, ориентированный на сырьевую производительность и рост фабрик"
 economic_philosophy_industrialism_civ_desc: "В этой стране есть развитый промышленный сектор, ориентированный на сырьевую производительность и рост фабрик"
 economic_philosophy_industrialism_bureau_desc: "В этой стране есть развитый промышленный сектор, ориентированный на сырьевую производительность и рост фабрик"
 economic_philosophy_hybridization: "Вертикальный промышленный сектор"
 economic_philosophy_hybridization_vertical: "Вертикальный промышленный сектор"
 economic_philosophy_hybridization_desc: "Эта страна имеет вертикальный промышленный сектор и стремится сбалансировать сбор ресурсов и производительность труда, чтобы обеспечить стабильную производительность и предотвратить дефицит"
 economic_philosophy_hybridization_vertical_desc: "Эта страна имеет вертикальный промышленный сектор и стремится сбалансировать сбор ресурсов и производительность труда, чтобы обеспечить стабильную производительность и предотвратить дефицит"
 economic_philosophy_rentierization: "Рантье промышленный сектор"
 economic_philosophy_rentierization_oil: "Рантье промышленный сектор"
 economic_philosophy_rentierization_refinery: "Рантье промышленный сектор"
