 missile_facility_desc: "В этой стране есть секретный исследовательский центр по ракетостроению"
 industry_minister: "Назначить министра промышленности"
 industry_minister_desc: "Пришло время назначить нового министра промышленности."
 industry_communist_1: "Пятилетний план"
 industry_communist_1_desc: "Наш новый министр рекомендовал нам начать 5 летний план по развитию экономики"
 industry_communist_2: "Инвестиции в промышленность"
 industry_communist_2_desc: "Наш министр рекомендовал начать с изъятия средств и начать строительство государственных заводов"
 industry_rural_1: "Проект по развитию сельского хозяйства"
 industry_rural_1_desc: "Наш новый министр приступил к работе по развитию сельских территорий"
 industry_rural_2_desc: "Наш министр создал агентство по охране окружающей среды"
 industry_rural_2: "Агентство по охране окружающей среды"
 industry_capitalist_1: "Принять свободную торговлю и капитализм"
 industry_capitalist_1_desc: "Наш новый министр рекомендовал нам обратить внимание на экономическую модель Laissez-faire, это позволит нам улучшить нашу страну"
 industry_capitalist_2: "Дерегуляция"
 industry_capitalist_2_desc: "Наш министр приступил к разработке законопроекта об устранении ненужных нормативных актов"
 civilian_rust_belt: "Оживить Ржавый пояс"
 civilian_industrialize: "Индустриализация"
 civilian_urban_renewal: "Городское возрождение"
 civilian_urban_services: "Городской сервис"
 civilian_rust_belt_desc: "Ржавый пояс-промышленный центр нашей страны, когда-то это был гордый центр нашей промышленности, сейчас это просто ржавые заводы. Мы должны возродить пояс, чтобы вернуть ему былую славу."
 civilian_industrialize_desc: "Есть много мест в нашей стране, оставшихся неиндустриализованными и полными безработицы, мы должны создать пакет стимулов для промышленников, чтобы спасти эти области."
 civilian_urban_renewal_desc: "Мы страдаем от сильных городских проблем. Высокая преступность, районы с низким уровнем доходов, они слишком распространены и создают проблемы для тех, кто живет в них и за их пределами. Мы должны вернуть этим местам былое величие."
 civilian_urban_services_desc: "Муниципальные власти должны начать расширять гражданскую инфраструктуру"
 mil_air_bases: "Строительство военно-воздушных баз"
 mil_air_bases_desc: "Чтобы защитить нашу страну, нашим военно-воздушным силам необходимо больше авиабаз для контроля воздушного пространства. Новые базы будут домом наших ангелов-хранителей."
 safety_net: "Социальная защита"
 safety_net_desc: "В этой стране есть система социальной защиты против бедности"
 welfare_state: "Государство всеобщего благосостояния"
 welfare_state_desc: "Эта страна вкладывает большие суммы в благосостояние простого народа"
 subsidies_basic: "Обширные субсидии"
 subsidies_basic_desc: "Эта страна активно искажает свою экономику с помощью субсидий"
 subsidy_economy: "Субсидии экономики"
 subsidy_economy_desc: "Эта страна оказывает сильное влияние на свой частный сектор с помощью субсидий и налогов"
 save_money: "Эффективная бюрократия"
 save_money_desc: "Государственная система этой страны эффективно экономит деньги"
 save_more_money: "Сильные банки"
 save_more_money_desc: "В этой стране очень сильный частный финансовый сектор"
 socialism_healthcare: "Всеобщее здравоохранение"
 socialism_healthcare_desc: "Эта страна пытается обеспечить здравоохранение для всех, платя за их лечение."
 communism_healthcare: "Продвинутое всеобщее здравоохранение"
 communism_healthcare_desc: "Эта страна пытается обеспечить здравоохранение для всех, уплачивая их лечение и проводя общественную программу здравоохранения"
 medical_science: "Медицинские исследовательские учреждения"
 medical_science_desc: "Эта страна владеет медицинскими исследовательскими центрами"
 medical_apotheosis: "Больничные лаборатории"
 medical_apotheosis_desc: "В этой стране есть по крайней мере небольшая лаборатория или исследовательские офисы в каждом медицинском учреждении. Она возможно также проводит или не проводит незаконные тесты на своих гражданах. Возможно."
 reduce_medical_bills: "Дешевое здравоохранение"
 reduce_medical_bills_desc: "Эта страна пытается сократить расходы на здравоохранение, как можно сильнее"
 privatized_healthcare: "Частное здравоохранение"
 privatized_healthcare_desc: "Здравоохранение в этой стране приватизировано"
 liberalized_communism: "Либеральный коммунизм"
 socialist_state_unions: "Социалистические государственные союзы"
 activate_communism: "Пятилетний план"
 activate_communism_desc: "В этой стране действуют пятилетние планы"
 communism_intensifies: "Плановая экономика"
 communism_intensifies_desc: "Правительство этой страны контролирует большую часть частной промышленности"
 rural_development_spirit: "Проекты по развитию сельского хозяйства"
 rural_development_spirit_desc: "Эта страна пытается развивать сельскую экономику, спонсируя ее инвестициями в гражданскую инфраструктуру"
 have_furries_control_government: "Агентство по охране окружающей среды"
 have_furries_control_government_desc: "Эта страна защищает свою окружающую среду строгим регулированием."
 activate_capitalism: "Капиталистическая экономика"
 activate_capitalism_desc: "Эта страна придерживается капитализма"
 capitalism_intensifies: "Экономика Laissez-faire"
 capitalism_intensifies_desc: "Государство этой страны старается не вмешиваться в экономику. Помимо других политик, практически не существует общего регулирования."
 education_minister: "Назначить министра просвещения"
 education_minister_desc: "Пришло время назначить министра образования и науки"
 education_progressive_1: "Творческое образование"
 education_progressive_1_desc: "Наш новый министр образования утверждает, что \"фабричная система образования\" устарела и образование должно быть основано на творчестве"
 education_progressive_2: "Фундаментальные исследования"
 education_progressive_2_desc: "Наш министр образования, не спрашивая предварительно одобрения, разработал и внес законопроект, расходующий огромные суммы денег на научные исследования"
 education_conservative_1: "Строительство школ"
 education_conservative_1_desc: "Наш новый министр образования утверждает, что нам нужно построить больше школ"
 education_conservative_2: "Консервативное образование"
 education_conservative_2_desc: "Наш министр образования говорит, что мы должны учить в школах семейным ценностям и патриотизму"
 education_militarist_1: "Армиейское образование"
 education_militarist_1_desc: "Наш новый министр образования говорит, что для того, чтобы получить высшее образование, нужно отслужить не менее 4 лет в армии, а потом получить его полностью бесплатным. Он был очень настойчивым."
 education_militarist_2: "Милитаризация молодежи"
 education_militarist_2_desc: "Наш министр образования выступил за политику создания военной молодежной программы для повышения патриотизма и поощрения культурных про-военных настроений."
 interior_minister: "Назначить министра внутренних дел"
 interior_minister_desc: "Пришло время назначить министра внутренних дел"
 interior_civil_1: "Чистки"
 interior_civil_1_desc: "Через несколько недель после того, как мы назначили нашего нового министра, тысячи людей пропали без вести. Наш министр внутренних дел взял на себя ответственность и заявил, что нашел доказательства того, что они были преступниками и предателями, которые были оправданно наказаны."
 interior_civil_2: "Полицейское государство"
 interior_civil_2_desc: "Наш министр увеличил в несколько раз федеральное финансирование всех сил внутренней безопасности"
 interior_internal_1: "Внутренний аудит"
 interior_internal_1_desc: "Наш новый министр начал массовые расследования и проверки в нашей стране, чтобы искоренить всех, кто потенциально может быть коррупционером."
 interior_internal_2: "Охота на шпионов"
 interior_internal_2_desc: "Наш министр принял серьезные меры по искоренению шпионов и информаторов из других стран"
 interior_external_1: "Расширить сеть информаторов"
 interior_external_1_desc: "Наш новый министр уже приступил к работе по созданию сетей платных конфиденциальных информаторов в других странах"
 interior_external_2: "Проект «Фантом»"
 interior_external_2_desc: "Наш министр забрал из казны большие суммы денег и не говорит нам, куда они тратятся. Он утверждает, что это окупится."
 defense_minister: "Назначить министра обороны"
 defense_minister_desc: "Пришло время назначить министра обороны"
 defense_quartermaster_1: "Дела ветеранов"
 defense_quartermaster_1_desc: "Наш новый министр требует, чтобы мы увеличили выплаты для ветеранов"
 defense_quartermaster_2: "Фонд помощи жертвам войны"
 defense_quartermaster_2_desc: "Наш министр рекомендовал нам создать фонд помощи жертвам войны, чтобы облегчить их жизнь"
 defense_reformer_1: "Расширить генштаб"
 defense_reformer_1_desc: "Наш новый министр изложил свои предложения по новой структуре генерального штаба. Это требует от нас троекратного расширения нашего генштаба."
 defense_reformer_2: "Расширить тактический штаб"
 defense_reformer_2_desc: "Наш министр заявил, что нам нужно больше тактиков, чтобы они помогли в процессе военного планирования"
 defense_finance_hawk_1: "Сократить издержки"
 defense_finance_hawk_1_desc: "Наш новый министр наметил длинный список потенциальных способов сэкономить деньги на наших военных"
 defense_finance_hawk_2: "Ешё больше сократить издержки"
 defense_finance_hawk_2_desc: "Наш министр наметил огромную систему по сокращению издержек в военной сфере, чтобы еще больше уменьшить расходы."
 military_industrial_complex: "Расширить военно-промышленный комплекс"
 military_industrial_complex_desc: "Наш ВПК не справляется с поставленными задачами. Нам нужно расширить расходы на него."
 military_naval_expansion: "Военно-морская экспансия"
 military_naval_expansion_desc: "Наш флот слишком слаб. Нам нужно начать строительство новых верфей."
 military_revise_plans: "Пересмотреть планы"
 military_revise_plans_desc: "Нам нужно пересмотреть наши планы по обороне страны и подумать о расширении нашей армии."
 military_increase_spending: "Увеличение военных расходов"
 military_increase_spending_desc: "Мы должны увеличить сумму, которую тратим на нашу оборону."
 mil_radar: "Радиолокационный проект"
 mil_radar_desc: "Радар имеет решающее значение для современных боевых действий. Мы должны попытаться исследовать новые радиолокационные технологии."
 ic_generic_events.1.t: "Кандидаты в министры финансов"
 ic_generic_events.1.d: "Нашей стране нужен новый министр финансов. В настоящее время есть 3 кандидата на выбор. Первый-это левый борец за благосостояние. Он хочет расширить финансовую помощь и благосостояние народа. Второй-это интервенционист, который хочет управлять экономикой с помощью субсидий. Третий-это правый финансовый ястреб, который хочет снизить пошлины, расходы и укрепить финансовые институты."
 begin_selection: "Подтвердить кандидатуру"
 police_state: "Полицейское государство"
 police_state_desc: "Эта страна имеет чрезвычайно хорошо финансируемую полицию и ограничения в социальной среде"
 internal_audits: "Внутренний аудит"
 internal_audits_desc: "Эта страна проводит регулярные проверки в своем правительстве"
 intel_network: "Сеть информаторов"
 intel_network_desc: "Starfoth, пожалуйста, добавьте детали перед обновлением. Не облажайся снова (шутка разрабов мода)."
 thicc_intel_network: "Центральное разведывательное управление"
 thicc_intel_network_desc: "В этой стране есть разведывательное управление"
 ic_generic_events.4.t: "Кандидаты в министры образования"
 ic_generic_events.3.t: "Кандидаты в министры промышленности"
 ic_generic_events.2.t: "Кандидаты в министры здравоохранения"
 ic_generic_events.5.t: "Кандидаты в министры внутренних дел"
 ic_generic_events.6.t: "Кандидаты в министры обороны"
 ic_generic_events.4.d: "Мы решили назначить нового министра науки и образования. Есть прогрессист, который хочет увеличить финансирование, консерватор, который хочет привить народу патриотизм, и милитарист, который хочет милитаризировать общество."
 ic_generic_events.3.d: "Нашей стране нужен хороший министр промышленности. Есть коммунист, капиталист и защитник окружающей среды,  все они являются хорошими, квалифицированными специалистами в сфере экономики."
 ic_generic_events.2.d: "Ситуация со здоровьем в нашей стране крайне тяжелая. Нам нужно выбрать хорошего министра здравоохранения. Мы можем выбрать защитника здравоохранения, технократа или финансового ястреба на эту должность, чтобы попытаться улучшить ситуацию."
 ic_generic_events.5.d: "Министр внутренних дел руководит нашим шпионажем и МВД. Выбирайте с умом. Мы можем назначить крайне левого радикала, который хочет, чтобы каждый предатель в этой стране был арестован, или же кого-то, кто будет защищать нашу страну от шпионов, или же бывшего банкира, который хочет расширить разведывательные операции в других странах."
 ic_generic_events.6.d: "И все же самое главное, что бы министр обороны будет руководить защитой нашей страны во время войны. Мы можем выбрать кого-то, кто хочет видеть войну менее жестокой, реформатора, который знает, как перестроить нашу командную структуру, или финансового ястреба, который считает, что нам нужно сократить расходы."
 soviet_alignment_general: "Советский уклад"
 soviet_alignment_general_desc: "Мы решили встать на сторону наших коммунистических союзников против безудержной волны капитализма. Капитализм? Больше похоже на дерьмизм."
 independance_alignment_general: "Независимость"
 independance_alignment_general_desc: "Советы и запад - это  халера и чума на нашей земле. Мы должны противостоять им и сделать выбор в пользу укрепления самих себя."
 Western_Alignment: "Западный уклад"
 Western_Alignment_desc: "Мы решили встать на сторону демократов, а не быть марионетками коммунистических хозяев. Коммунизм? Больше похоже на то, что они коммимрази."
 communist_gun_nuts: "Военная помощь от советов"
 communist_gun_nuts_desc: "Советы решили дать нам оружие. Мы их не подведем."
 comecon_aids: "Экономическая помощь СЭВ"
 comecon_aids_desc: "СЭВ решила направить экономическую помощь в нашу страну, чтобы помочь нам."
 communist_spy_hubs: "Советское посольство"
 communist_spy_hubs_desc: "Мы должны установить контакт с нашими советскими союзниками."
 kgb_conspirators: "Связи с КГБ"
 kgb_conspirators_desc: "КГБ хотел бы, чтобы мы сотрудничали с ними и позволили им создать здесь свои базы. Что может пойти не так?"
 foreign_investments_desc: "Большое количество иностранных инвесторов приезжает в нашу страну, чтобы построить заводы и магазины. Все это благодаря нашей ориентацией на запад."
 foreign_investments: "Привлечение иностранного капитала"
 military_aids: "Военная помощь от США"
 military_aids_desc: "США посылают нам оружие, деньги и офицеров, чтобы помочь нам в вооружение нашей армии."
 western_cia_agencies: "Посольства западных стран"
 western_cia_agencies_desc: "Было бы разумно открыть посольства в западных странах."
 cia_conspirators: "Связи с ЦРУ"
 cia_conspirators_desc: "ЦРУ хотело бы создать секретные явки в нашей стране. Что может пойти не так?"
 strengthen_sphere: "Укрепить местной влияние"
 strengthen_sphere_desc: "Нам нужно укрепить собственную сферу влияния, усилить контроль над подчиненными, улучить отношения с союзниками."
 self_sufficiency_general: "Независимость"
 self_sufficiency_general_desc: "Мы не можем полагаться на какие-либо крупные державы в плане экономической мощи. Нам нужно полагаться только на себя."
 real_ass_politik: "Реальная политика"
 real_ass_politik_desc: "Мы являемся правомерной державой нашего региона, и мы должны вмешиваться везде, где сочтем нужным, и когда сочтем нужным."
 patriotic_neutral: "Патриотизм"
 patriotic_neutral_desc: "Мы не являемся ничьими марионетками. Мы сами себе хозяева. Мы-патриоты!"
 radical_centrism: "Внеблоковая"
 radical_centrism_desc: "Эта страна подтвердила свою позицию по отношению к иностранным державам и пытается укрепить местные связи и свою собственную сферу влияния"
 radical_centrism_0: "Внеблоковая"
 radical_centrism_0_desc: "Эта страна подтвердила свою позицию по отношению к иностранным державам и пытается укрепить местные связи и свою собственную сферу влияния"
 radical_centrism_1: "Внеблоковая"
 radical_centrism_1_desc: "Эта страна подтвердила свою позицию по отношению к иностранным державам и пытается укрепить местные связи и свою собственную сферу влияния"
 radical_centrism_2: "Внеблоковая"
 radical_centrism_2_desc: "Эта страна подтвердила свою позицию по отношению к иностранным державам и пытается укрепить местные связи и свою собственную сферу влияния"
 alignment_boner: "Торговое представительство"
 alignment_boner_desc: "Эта страна создала посольства в иностранных державах и теперь имеет торговые представительства в других странах, что облегчает торговлю."
 infrastructure_boost_general: "Активное строительство инфраструктуры"
 infrastructure_boost_general_desc: "Эта страна строит инфраструктуру"
 civilian_boost_general: "Наращивание промышленности"
 civilian_boost_general_desc: "Эта страна развивает свою промышленность"
 military_boost_general: "Наращивание вооруженных сил"
 military_boost_general_desc: "Эта страна развивает свою армию"
 navy_boost_general: "Наращивание ВМФ"
 navy_boost_general_desc: "Эта страна развивает свой флот"
 basic_welfare_state: "Базовое государство благосостояния"
 reformed_welfare_state: "Реформированное государство благосостояния"
 welfare_state_plus: "Государство всеобщего благосостояния"
 budget_cuts: "Сокращение бюджета"
 welfare_state_plus_desc: "Эта страна активно инвестирует в программы социального обеспечения"
 gen60_warrant_officer_comission: "Обучение унтер-офицеров"
 gen60_warrant_officer_comission_desc: "Мы должны расширить корпус младшего офицерского состава, для лучшего управления солдатами на поле боя"
 gen60_support_corps: "Корпус поддержки"
 gen60_support_corps_desc: "Мы должны создать корпус армейской поддержки, чтобы увеличить эффективность наших дивизий"
 gen60_new_officers: "Поддержать молодых офицеров"
 gen60_new_officers_desc: "Новые офицеры, молодые и искрой в глазах, хотят создать армию, основанную на комиксах, где армия является аэромобильной, а герои многочисленны."
 gen60_army_academy: "Основать военную академию"
 gen60_army_academy_desc: "Мы должны создать военную академию для нашей страны и сделать ее самой лучшей! Академия будет обучать наших офицеров вести солдат к победе!"
 gen60_side_with_old_guard_desc: "Выдающаяся старая гвардия хочет создать армию, подкрепленную огневой мощью и возглавляемую танками, а не непонятно что, основанное на фильмах или популярной фантастике."
 gen60_airmobile_army: "Аэромобильная армия"
 gen60_airmobile_army_desc: "Новые офицеры создадут специальный корпус для подготовки десантных команд и разработки новых вертолетов."
 gen60_research_helicopters: "Исследования вертолетов"
 gen60_research_helicopters_desc: "Армейская академия приступила к крупному проекту, который направлен на развитие вертолетной техники."
 gen60_wmd_dev: "Химическое оружие"
 gen60_wmd_dev_desc: "Ядерное оружие, химикаты, биологическое оружие-все это ужасающее, но мощное оружие, которое, по мнению новых офицеров, никогда не должно использоваться в реальных боевых действиях. Однако они также боятся инопланетного вторжения и поэтому хотят сохранить преимущество перед любыми потенциально превосходящими врагами."
 gen60_finalize_army_academy: "Наземная война"
 gen60_finalize_army_academy_desc: "Армейская академия завершена, и она является воплощением видения наших новых офицеров"
 gen60_side_with_old_guard: "Принять сторону старой гвардии"
 gen60_new_traditions: "Отбросить старые традиции"
 gen60_new_traditions_desc: "Пришло время отбросить старые традиции и создать новую, неиспытанную армию."
 gen60_old_traditions: "Принять старые традиции"
 gen60_old_traditions_desc: "Независимо от того, на чью сторону мы встали при создании военной академии, мы должны финансировать исследовательские проекты, которые мы знаем и которым можем доверять."
 gen60_special_forces_corps: "Корпус специального назначения"
 gen60_special_forces_corps_desc: "Спецназ всегда доказывал свою ценность в войне, и поэтому его необходимо развивать."
 newfocus_12: "Комиссия по делам офицеров спецназа"
 gen60_deep_wire_officers_desc: "Наш спецназ должен иметь опытное руководство, особенно находясь в тылу врага."
 gen60_deep_wire_officers: "Комиссия по делам офицеров спецназа"
 gen60_ground_army: "Сухопутная армия"
 gen60_ground_army_desc: "Наша пехота - основа нашей армии. Может быть, они и не являются острием копья, но они, по крайней мере, образуют прочный, длинный ствол проникающей способности нашей армии."
 gen60_mech_research: "Проект по исследованию механизации"
 gen60_mech_research_desc: "Для того чтобы наша армия сохранила свою силу, наша пехота должна быть мобильной и хорошо защищенной, до тех пор пока они добираются до своих позиций."
 gen60_conventional_missiles_1: "Стандартизация ракет"
 gen60_conventional_missiles_1_desc: "У нас должна быть мощная ракетная основа в нашей армии, для того чтобы мы могли уничтожать наших врагов на расстоянии."
 gen60_finalize_old_guard_academy: "Проект по обновлению армии"
 gen60_finalize_old_guard_academy_desc: "Мы должны пересмотреть нашу командную структуру и то, как функционирует наша армия, чтобы разные формирования в нашей армии могли лучше поддерживать друг друга."
 gen60_navy_living_conditions: "Улучшение жилищных условий"
 gen60_navy_living_conditions_desc: "Вы же не можете просто ожидать, что храбрые моряки будут жить в тесной нищете, не так ли? Нет. Улучшите условия жизни на палубе так, что бы они начали скучать по морю!"
 gen60_light_armor_research: "Проеткы лёгких танков"
 gen60_light_armor_research_desc: "Мы должны начать финансировать проекты, которые позволят нам разработать новые лёгкие танки"
 gen60_more_fucking_choppers: "Вертолетные проекты"
 gen60_more_fucking_choppers_desc: "Начать инвестировть в крупные вертолетные проекты для поддержки нашей армии"
 gen60_missile_research: "Ракетные проекты"
 gen60_missile_research_desc: "Финансирование научно-исследовательского проекта по ракетам"
 gen60_heavy_armor_research: "Проект по исследованию ОБТ"
 gen60_heavy_armor_research_desc: "Мы должны начать финансировать новый проект ОБТ, чтобы заострить острие нашей армии"
 gen60_doctrine_up: "Пересмотр современной тактики"
 gen60_doctrine_up_desc: "Нам нужно пересмотреть и отточить нашу тактику ведения боя"
 gen60_art_of_hillary_clinton: "Проект исследования артиллерии"
 gen60_art_of_hillary_clinton_desc: "Артиллерия-это отличный способ улучшить огневую мощь нашей армии. Мы должны улучшить нашу артиллерию."
 gen60_airforce_academy: "Основать военно-воздушную академию"
 gen60_airforce_academy_desc: "Нам нужно создать военно-воздушную академию для подготовки наших офицеров ВВС, чтобы они были готовы к новой эпохи."
 gen60_asup_0: "Традиции авиационной поддержки"
 gen60_asup_0_desc: "Наши военно-воздушные силы существуют для поддержки армии, и именно по этой причине наши традиции ВВС сформированы таким образом, чтобы максимально эффективно поддерживать армию с воздуха."
 gen60_asuper_0: "Традиции авиационного превосходства"
 gen60_asuper_0_desc: "Наши военно-воздушные силы существуют для того, чтобы доминировать в небе, и наши традиции отражают этот факт."
 gen60_asup_1: "Старшие офицеры связи"
 gen60_asup_1_desc: "Нам нужна хорошая связь земли и воздуха, чтобы направлять наши авиаудары, для поддержки наших армий"
 gen60_asup_2: "Учебные поля фронтовых бомбардировщиков"
 gen60_asup_2_desc: "Мы должны создать учебные поля для фронтовых бомбардировщиков в нашей академии"
 gen60_asup_3: "Корпус воздушной логистики"
 gen60_asup_3_desc: "Нам нужен авиационный корпус снабжения для поддержки наших армий"
 gen60_asuper_1: "Приоритет по вызову"
 gen60_asuper_1_desc: "Наши воздушные истребители должны быть способны в любой момент прибыть на место и установить господство в небе!"
 gen60_asuper_2: "Учебные поля бомбардировщиков"
 gen60_asuper_2_desc: "Мы должны научить наших летчиков стратегических бомбардировщиков обрушивать всю нашу мощь на наших врагов!"
 gen60_asuper_3: "Школа морских бомбардировщиков"
 gen60_asuper_3_desc: "Наша авиация должна продемонстрировать свое превосходство над всем остальным. Включая флот противника!"
 gen60_air_doctrine_up: "Пересмотр современных воздушных доктрин"
 gen60_air_doctrine_up_desc: "Многие военные теоретики полагают, что в будущем в небе будут преобладать скорость и дальность действия, а не воздушные схватки. Это звучит нелепо, но они действительно правы в том, что времена меняются, и нам нужно адаптироваться к ним."
 gen60_area_69: "Расширить академию"
 gen60_area_69_desc: "Наши академии могут быть уже завершены по своей сути, но мы должны массово расширить потенциал рекрутинга в них, чтобы наши новые офицеры могли создавать оружие будущего!"
 gen60_naval_fuel_efficiency: "Экономия расходов топлива"
 gen60_naval_fuel_efficiency_desc: "Наличие топливосберегающих кораблей позволит флоту оставаться в боевой готовности дольше и иметь большую дальность хода, чем когда-либо прежде!"
 gen60_navy_adventure: "Авантюристы, что витают в облаках"
 gen60_navy_adventure_desc: "В порядке исключения, мы решил назначать в морскую академию летчиков-идеалистов, для того чтобы начать обучение в них раньше"
 gen60_hardy_semen: "Опытные моряки"
 gen60_hardy_semen_desc: "Мы выбрали заведомо лучший вариант, назначив наших самых опытных морских офицеров руководить нашей академией."
 gen60_navy_aa: "Универсальные корабли"
 gen60_navy_aa_desc: "Наши отважные авантюристы отчаянно нуждаются в том, чтобы иметь возможность защищаться в одиночку без какой-либо поддержки, и поэтому мы должны улучшить военно-морскую боеспособность наших кораблей!"
 gen60_spam_fleet: "Множественный флот"
 gen60_spam_fleet_desc: "Сила - в количестве, и мы должны принять это правило для нашего флота."
 gen60_naval_academy: "Основать морскую академию"
 gen60_naval_academy_desc: "Военно-морская академия будет готовить наших морских офицеров к защите нашей страны на море!"
 gen60_naval_research: "Хорошо подготовленный флот"
 gen60_naval_research_desc: "Нам нужен флот, который хорошо подготовлен для выполнения различных задач!"
 gen60_naval_armor: "Броня кораблей"
 gen60_naval_armor_desc: "Наши корабли должны иметь тяжелую броню, чтобы выстоить против любой вражеской атаки"
 gen60_navy_org: "Выдающиеся адмиралы"
 gen60_navy_org_desc: "Придерживаясь прошлых заслуг и успехов нашего флота, мы должны позаботится о том, чтобы наши адмиралы были лучшими в мире!"
 gen60_fleet_of_few: "Флот-меньшинства"
 gen60_fleet_of_few_desc: "Мы должны иметь маленький, но сильный флот, а не те игрушечные канонерки, что сейчас у нас есть, которые только и ждут, когда их снимут с дежурства."
 gen60_naval_research_general_boost: "Модернизация военно-морского флота"
 gen60_naval_research_general_boost_desc: "Мы должны модернизировать наш флот с помощью масштабного проекта, использующего столько ресурсов, сколько мы можем себе позволить. [Примечание: хотя ограничение в 1 день может показаться пустяком, морской бонус применяется сразу же после начала исследовательского проекта]"
 gen60_screen_research: "Проекты кораблей сопровождения"
 gen60_screen_research_desc: "Мы должны исследовать различные малые корабли в огромных количествах"
 gen60_sub_project: "Проекты подлодок"
 gen60_sub_project_desc: "Подводные лодки имеют огромную роль в получении контроля моря."
 gen60_capital_research: "Проект флангманского корабля"
 gen60_capital_research_desc: "Наш флот остро нуждается в новом флагмане, который способен сокрушить наших врагов. Мы должны инвестировать в этот проект!"
 gen60_carrier_research: "Проект авианесущих кораблей"
 gen60_carrier_research_desc: "Авианосец является неотъемлемой частью современной морской войны. По сути это плавучий аэродром."
 gen60_wr_pe_1: "Про-работодатель"
 gen60_wr_pe_1_desc: "Работодатель руководит предприятием, берет на себя риски, а работники находятся там по собственной воле. Если им это не нравится, мы не можем заставить работодателей делать то, что работники не делают или не могут делать."
 gen60_wr_b_1: "Сбалансированный"
 gen60_wr_b_1_desc: "Обе позиции имеют хорошие моменты, мы не можем пренебрегать правами рабочих, но и не можем жертвовать промышленностью ради их прав."
 gen60_wr_pu_1: "Про-союзная"
 gen60_wr_pu_1_desc: "На что годится работодатель? Сидеть на шеи рабочих? Лидерство и управление? Капитал? Как бы то ни было, рабочие - это главная сила нашей промышленности, и мы должны защищать их."
 gen60_wr_pe_2: "Отмена законов о рабочем времени и минимальной заработной плате"
 gen60_wr_pe_2_desc: "Это решено. Лучший способ помочь рабочим - это развивать экономику. Мы должны отменить все законы, препятствующие этому."
 gen60_wr_b_2: "Прагматическое решение"
 gen60_wr_b_2_desc: "Мы должны быть прагматичными и найти взаимовыгодное решение."
 gen60_wr_pu_2: "Билль о правах трудящихся"
 gen60_wr_pu_2_desc: "Наша страна должна разработать Билль о правах трудящихся! 6 часовой рабочий день! Максимальная безопасность! Меритократия и демократизация на предприятиях!"
 gen60_e: "Дебаты об охране окружающей среды"
 gen60_e_desc: "В стране разгораются дебаты среди экологов. Кто же победит?"
 gen60_e_p_1: "Потребительское мировоззрение"
 gen60_e_p_1_desc: "Какой смысл заботиться об окружающей среде, если мы несчастны? Мы должны потреблять столько, сколько хотим, и адаптироваться к будущему, когда оно наступит!"
 gen60_e_b_1: "Сбалансированное мировоззрение"
 gen60_e_b_1_desc: "Как насчет того, чтобы не отказываться от наших потребностей, но и не засорять нашу единственную планету, верно?"
 gen60_e_e_1: "Зеленое мировоззрение"
 gen60_e_e_1_desc: "Мы должны стремиться к материальному удволетворению и находить счастье в гармонии с природой!"
 gen60_e_e_2: "Культ Земли"
 gen60_e_e_2_desc: "Мы должны защитить нашу Мать-Землю любой ценой. Мы можем найти комфорт в садах, медитации, безопасных потребительских товарах и т. д. Не говоря уже о том, что все это приближает нас к самой Земле."
 gen60_e_b_2: "Умеренность"
 gen60_e_b_2_desc: "Мы должны быть умеренными. Приносить жертвы там, где это необходимо, и не потреблять слишком много. Но все же мы должны быть счастливы всегда!"
 gen60_e_p_2: "Материализм"
 gen60_e_p_2_desc: "Кого волнует завтрашний день, если сегодня можно повеселиться?"
 gen60_gmr: "Дебаты по гендерным вопросам и правам меньшинств"
 gen60_gmr_desc: "В стране разгораются дебаты о гендерном равенстве и правах меньшинств!"
 gen60_gmr_archy_1: "[Патри/Матри]арха"
 gen60_gmr_archy_1_desc: "Наша [Агнатическая/Энатическая] культура всегда была такой и останется навсегда такой!"
 gen60_gmr_archy_2: "Власть большинства"
 gen60_gmr_archy_2_desc: "Это наша страна, а не их. Здесь правим мы, а не они!"
 gen60_gmr_b_1: "Культурная традиция"
 gen60_gmr_b_1_desc: "Наша [Агнатическая/Энатическая]- когнитивная культура всегда работала. Никто не должен быть ограничен законом, но нельзя отрицать, что [мужчины/женщины] были предназначены для того, чтобы быть домохозяйками по биологическому замыслу."
 gen60_gmr_b_2: "Терпимость к меньшинствам"
 gen60_gmr_b_2_desc: "Мы не собираемся проводить массовые кампании по любви к меньшинствам, но в то же время мы должны признать равенство [меньшинства в нынешней стране]"
 gen60_gmr_e_1: "Полное равноправие"
 gen60_gmr_e_1_desc: "Мы-абсолютные когнитивисты. Полное равенство в культуре и праве должно быть обеспечено!"
 gen60_gmr_e_2: "Позитивные действия по отношению к меньшинству"
 gen60_gmr_e_2_desc: "Мы не несем ответственности за поступки наших предков. Мы не должны расплачиваться за то, что сделали они. Но это не значит, что мы не должны исправлять ошибки прошлого. Хотя  когда-то все в мире смотрели друг на друга свысока, мы будем стремиться двигаться в будущее и исправлять ошибки прошлого."
 gen60_lgbt: "Гендерное равенство"
 gen60_lgbt_desc: "Дебаты о сексуальности и гендерном равенстве"
 gen60_lgbt_t_2: "Гендерные нормы"
 gen60_lgbt_t_2_desc: "–"
 gen60_lgbt_t_1: "Традиционные сексуальные нормы"
 gen60_lgbt_t_1_desc: "–"
 gen60_lgbt_b_1: "Легализация ЛГБТ+"
 gen60_lgbt_b_1_desc: "Не должно быть закона, который принуждает к сексуальности. Ну вы чего, чуваки? Это же 60-ые!"
 gen60_lgbt_b_2: "Гендерное признание"
 gen60_lgbt_b_2_desc: "Пол и гендер это 2 разных вещи. Мы будем принимать личности людей на умеренном уровне, но не подпускайте этих людей ко мне, пожалуйста."
 gen60_lgbt_e_1: "Поддержка ЛГБТ+"
 gen60_lgbt_e_1_desc: "Мы должны защищать ЛГБТ+ от дискриминации и быть прогрессивными."
 gen60_lgbt_e_2: "Поддержка трансгендеров"
 gen60_lgbt_e_2_desc: "Наша культура будет отражать нашу прогрессивность. Будь тем, кем ты хочешь быть. Делай, что хочешь, и пока ты никому не причинишь вреда, все будет хорошо."
 gen60_m: "Дебаты о милитаризме"
 gen60_m_desc: "Разгораются дебаты о военных действиях."
 gen60_m_j_1: "Шовинизм"
 gen60_m_j_1_desc: "НА ВОЙНУ! СЛАВА ПАТРИОТАМ! К ЧЕРТУ ТРУСОВ, ОНИ НИКОГДА НЕ ИЗМЕНЯТСЯ, НЕ ГОВОРЯ УЖЕ ОБ ЭТОМ ЖАЛКОМ МИРЕ!"
 gen60_m_j_2: "Ястребы"
 gen60_m_j_2_desc: "Война разрушительна по своей природе, но из этого разрушения могут возникнуть новые миры. Давайте возьмем в качестве примера современную эпоху и убедимся, что именно мы определяем, что вырастает из пепла."
 gen60_m_b_1: "Про-армейские"
 gen60_m_b_1_desc: "Поддержим нашие бравые войска!"
 gen60_m_b_2: "Увеличение расходов на армию"
 gen60_m_b_2_desc: "Мы должны увеличить сумму, которую мы выплачиваем нашим служащим."
 gen60_m_p_1: "Пацифизм"
 gen60_m_p_1_desc: "Война? А? Кому она полезна? Абсолютно никому! Она по своей сути разрушительна и не приносит ничего, кроме вреда нашему миру."
 gen60_m_p_2: "Сокращение военных расходов"
 gen60_m_p_2_desc: "Как насчет того, чтобы сократить военные расходы и использовать деньги на то, что нам ДЕЙСТВИТЕЛЬНО нужно?"
 gen60_g: "Дебаты \"Глобализм против национализма\"."
 gen60_g_desc: "Эти дебаты будут определять будущее нашей нации."
 gen60_g_g_1: "Глобализм"
 gen60_g_g_1_desc: "–"
 gen60_g_g_2: "Международный фонд развития"
 gen60_g_g_2_desc: "Небольшая часть богатства нашей страны должна пойти на нужды людей в других странах."
 gen60_g_b_1: "Сбалансированный взгляд"
 gen60_g_b_1_desc: "Нам следует заботиться о других народах, но мы никому ничего не должны. Наша страна на первом месте!"
 gen60_g_b_2: "Международные инвесторы"
 gen60_g_b_2_desc: "Мы должны искать иностранных инвесторов и учавствать в международной торговли, для того, чтобы мы могли извлечь выгоду."
 gen60_g_n_1: "Национализм"
 gen60_g_n_1_desc: "Наша страна привыше других, и наши интересы должны быть единственной вещью, о которой мы заботимся."
 gen60_g_n_2: "Протекционизм"
 gen60_g_n_2_desc: "Наша страна нуждается в твердом экономическом протекционизме, чтобы предотвратить влияние иностранцев и укрепить нашу независимость."
 gen60_wr: "Дебаты о правах трудящихся"
 gen60_wr_desc: "Дебаты о правах трудящихся в настоящее время являются тем, к чему прикованы взгляды всей нации."
 gen60_social_question: "Социальный вопрос"
 gen60_social_question_desc: "И снова социальные вопросы являются главной проблемой нашей политики. Мы должны урегулировать их, чтобы нам не пришлось иметь дело с драмой и прочим дерьмом в будущем, я не знаю когда точно, возможно, в конце 2010-х или что-то в этом роде."
 gen60_nat_tv: "Создание национальной телевизионной сети"
 gen60_nat_tv_desc: "Наша страна остро нуждается в средствах массовой информации и развлечениях. Мы должны создать огромную телевизионную сеть!"
 gen60_big_game: "Большая игра"
 gen60_big_game_desc: "Наш любимый национальный вид спорта впервые будет транслироваться по всей стране. Это будет захватывающие зрелище!"
 gen60_darkwoods: "Фильмы из Дарквуда"
 gen60_darkwoods_desc: "Прямо за пределами знаменитого Дарквуда, в нашей стране есть огромное количество студий, а также кинопродюсеров, которые открывают свои предприятия!"
 gen60_cartoons: "Мультики и комиксы!"
 gen60_cartoons_desc: "Наша нация любит мультфильмы, комиксы и героев!"
 gen60_drama: "Художественные фильмы и драмы!"
 gen60_drama_desc: "Наш народ очень хорошо известен своими художественными и драматическими фильмами"
 gen60_huh_huh_he_got_hit_in_the_nuts_huh_huh: "Низко-качественый юмор"
 gen60_huh_huh_he_got_hit_in_the_nuts_huh_huh_desc: "Наш народ любит комедию. Каким бы грубыми наши комедии ни казались другим."
 gen60_realart: "Изобразительное искусство"
 gen60_realart_desc: "Наша страна  высоко ценит изобразительное искусство и музыку, и к тому же у нас это получается лучше, чем у других"
 gen60_radio: "Расширить радиосеть"
 gen60_radio_desc: "Наша нация остро нуждается в улучшении нашией радиосвязи."
 gen60_fakenews: "Независимые СМИ"
 gen60_fakenews_desc: "Независимые СМИ нашей страны видят благо в расширенние телеосетей и радиосетей."
 gen60_realnews: "Военные репортеры"
 gen60_realnews_desc: "Наши военные отчеты теперь могут увидеть больше людей, чем когда-либо!"
 gen60_space_race: "Новый претендент на космическую гонку"
 gen60_space_race_desc: "[Еще не закончен. Пожалуйста, дождитесь космической гонки-переделки] Мы богаты. Мы могущественны. Теперь наше время сиять в космической гонке!"
 gen60_natreporters: "Запрет международным журналистам на вещание"
 gen60_interreporters: "Разрешение международным журналистам на вещание"
 gen60_interreporters_desc: "Мы должны пригласить международных репортеров в нашу страну, чтобы они могли рассказывать о том, что происходит в нашей стране"
 gen60_natreporters_desc: "Мы можем доверять только нашим национальным информационным агентствам, чтобы сообщать то, что происходит в нашей стране всему миру."
 newfocus_121: "новыйфокус_121"
 gen60_sports_stadiums: "Строительство спортивных стадионов"
 gen60_sports_stadiums_desc: "Наша жители любит спорт и, поэтому мы должны построить больше стадионов"
 gen60_parks_and_rec: "Строительство парков"
 gen60_parks_and_rec_desc: "Мы должны сосредоточить наши инвестиции на развитие парков и зон отдыха"
 gen60_build_a_factory: "Просто построить фабрику"
 gen60_build_a_factory_desc: "За"
 gen60_endow_commerce: "Расширить коммерческую экспансию"
 gen60_endow_commerce_desc: "Мы не можем полагаться на парки или стадионы, вместо этого мы должны придерживаться расширения коммерческих районов, чтобы именно они могли развлекать массы"
 gen60_proclaim: "Провозгласить победу в космической гонке!"
 gen60_proclaim_desc: "Мы объявили о нашей победе в космической гонке!"
 gen60_world_conquest: "Потребовать глобального контроля!"
 gen60_world_conquest_desc: "Наше технологические достижения непостижимы! Теперь мы должны аннексировать весь мир, и направить человечество к звездам под нашим контролем!"
 gen60_late_socialist: "Сторонники социалистических взглядов"
 gen60_late_socialist_desc: "Социалисты стремятся изменить или модифицировать нашу национальную политику"
 gen60_late_centrist: "Сторонники центриских взглядов"
 gen60_late_centrist_desc: "Центристы стремятся изменить или модифицировать нашу национальную политику"
 gen60_late_capitalist: "Сторонники капиталистических взглядов"
 gen60_late_capitalist_desc: "Капиталисты стремятся изменить или модифицировать нашу национальную политику"
 gen60_healthcare_1: "Общедоступное здравоохранение"
 gen60_healthcare_1_desc: "Сторонники социалистических взглядов желают отметить любые противоречащие законы в сфере здравохранения и позволить действовать ВОЗ в нашей стране [Lvl 1]"
 gen60_subsidies: "Субсидии"
 gen60_subsidies_desc: "Сторонники центриских взглядов считают, что мы должны отменить предыдущие финансовые законы и ввести субсидиарную экономику. [Lvl 1]"
 gen60_welfare: "Социальная защита"
 gen60_welfare_desc: "Сторонники социалистических взглядов в нашей стране хотят, что бы в нашей стране была реализована солциальная защита [Lvl 1]"
 gen60_stronk_banks: "Финансовая реформа"
 gen60_stronk_banks_desc: "Капиталисты в нашей стране хотят отменить государственные пенсии и сократить расходы. [Lvl 2]"
 gen60_techno_healthcare: "Больничные лаборатории"
 gen60_techno_healthcare_desc: "Центристы в нашей стране стремятся создать больничные лаборатории для улучшения медицинских исследований. [Lvl 2]"
 gen60_schools: "Расширить систему школ"
 gen60_schools_desc: "Центристы в нашей стране хотят, чтобы мы строили больше школ [Lvl 1]"
 gen60_5_year_plan: "Пятилетный план"
 gen60_5_year_plan_desc: "Сторонники социалистических взглядов хотят, чтобы мы создали сильную государственную экономику. [Lvl 2]"
 gen60_cut_military: "Сократить военные расходы"
 gen60_cut_military_desc: "Капиталисты в нашей стране хотят, чтобы мы сократили расходы на нашу армию [Lvl 2]"
 gen60_reduce_med_costs: "Сократить расходы на медицинское обслуживание"
 gen60_reduce_med_costs_desc: "Капиталисты в нашей стране хотят сократить медицинские расходы. [Lvl 1]"
 gen_army_academy: "Начальная академия для военных"
 gen_army_academy_desc: "В этой стране есть армейская академия для подготовки офицеров"
