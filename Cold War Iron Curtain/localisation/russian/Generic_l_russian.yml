 THIRD_BALKAN_WAR_TIMER: ""
 CIA_Expansion: ""
 import_restrictions: ""
 generic_military_hq: "Учредить Штаб верховное командование"
 generic_military_hq_desc: "Наша армия страдает от многих факторов, которые понижают боеспособность. Чтобы устоять в этом мире и выжить, мы должны создать штаб верховного командования и привести в порядок нашу военную структуру."
 high_grade_army: "Высококлассная армия"
 high_grade_army_desc: "С нашей индустриально развитой нацией ясно, что мы должны создать армию, основанную, в первую очередь, на принципах качества. Мы создадим крупные и очень дорогостоящие подразделения, чтобы сокрушить наших врагов нашей технологической и промышленной мощью."
 armor_exercises: "Испытания бронетехники"
 armor_exercises_desc: "Чтобы лучше понять, как танки функционируют в бою, мы должны провести множество испытаний по обстрелу наших танков в условиях, приближенных к боевым."
 mechanized_exercises: "Испытания бронетранспортеров"
 mechanized_exercises_desc: "Мы должны провести серию учений с имитацией обстрела. Это позволит переработать способы функционирования наших механизированных сил."
 special_forces_expansion: "Расширение спецназа"
 special_forces_expansion_desc: "Являясь важной частью любой элитной армии, спецназ отбирает новобранцев из лучших частей армии и заставляет их выполнять специальные задания. Расширение нашей программы спецназа-это необходимость."
 modernize_army: "Модернизация армии"
 modernize_army_desc: "Когда наши учения будут наконец завершены, мы сможем приступить к созданию современной армии. Для этого мы должны начать модернизацию нашей военной техники."
 nuclear_weapons_program: "Военная ядерная программа"
 nuclear_weapons_program_desc: "Мы можем получить иностранное финансирование для нашей программы ядерного оружия, заявив, что инвестируем его в ядерную энергетику. Мы попросим сверхнормативные суммы денег на создание низкокачественной атомной энергетики, а большую часть денег пустим на ядерные бомбы."
 tank_research_perm: "Научный центр бронетанковых войск"
 tank_research_perm_desc: "Чтобы гарантировать, что наши танки являются лучшими в мире, мы создадим специальную группу внутри нашего военно-исследовательского центра."
 mech_research_perm: "Исследования в области бронетранспортеров"
 mech_research_perm_desc: "Мы расширим нашу недавно основанную группы по бронетехники, чтобы добавить к ним специалистов по механизации."
 black_berets: "Программа «Чёрные береты» "
 black_berets_desc: "Угрозы против нас огромны. Черные береты станут культовым копьем нашей нации."
 airborne_cavalry: "Воздушно-десантный кавалерийский корпус"
 airborne_cavalry_desc: "Воздушно-десантные кавалерийские корпуса-это высокомобильные силы, в составе наших воздушно-десантных войск. Они гарантируют, что мы сможем реагировать на любую ситуацию в бою и подавлять прорывы, какими бы сильными или частыми они ни были."
 mech_optimization: "Оптимизация механизированного производства"
 mech_optimization_desc: "Чтобы гарантировать, что мы сможем массово производить достаточное количество БТР и БМП для нашей армии, нам необходимо оптимизировать производство."
 psych_training: "Улучшить обучение «Черных беретов» "
 psych_training_desc: "Для того, чтобы наши Черные береты были самыми элитными, мы должны создать режим экстремальных тренировок, чтобы они были самыми лучшими в мире."
 army_intelligence: "Армейская разведывательная комиссия"
 army_intelligence_desc: "Для того чтобы защитить нашу страну от внешних угроз и влияния, нам необходимо создать армейскую разведывательную комиссию, занимающуюся защитой наших данных и шпионажем за врагами."
 low_cost_army: "Низкобюджетная армия"
 low_cost_army_desc: ""
 infantry_exercises: "Военные игры пехоты"
 infantry_exercises_desc: "Нам нужно провести серию учений и военных игр с нашей пехотой, чтобы лучше понять технику и тактику, необходимые нам на поле боя."
 light_armor_exercises: "Опыты с легкобронированными танками"
 light_armor_exercises_desc: "Нам нужно провести учения с нашими легкими танками, чтобы лучше понять, как они могут сражаться."
 motor_exercises: "Опыты с автотранспортом"
 motor_execises_desc: "Чтобы лучше понять возможности наших двигателей, нам нужно провести серию тестов с нашими грузовиками в различных средах, чтобы увидеть, как они работают при различных условиях."
 reorganize_army: "Реорганизовать армию"
 reorganize_army_desc: "После того, как мы получили важное представление после наших испытаний и учений, мы теперь понимаем, как реорганизовать нашу армию и лучше подготовить ее к бою."
 adhoc_infantry_equipment: "Специальные конструкторские группы пехотного снаряжения"
 adhoc_infantry_equipment_desc: "У нас серьезные проблемы с устаревшим пехотным снаряжением. Мы должны модернизировать наше вооружение, чтобы наша пехота могла сокрушить наших врагов."
 light_armor_manufacturing: "Удешевление лёгкой бронетехники"
 light_armor_manufacturing_desc: "Создав специальную команду дальновидных механиков для оптимизации наших легких танков, мы сможем производить еще больше, чем раньше, и утопить наших врагов в их мощи."
 motor_manufacturing: "Уменшить стоимость автотранспорта"
 motor_manufacturing_desc: "Наши грузовики стоят слишком дорого. Нам нужно создать команду механиков, чья единственная цель-найти способы сэкономить деньги и упростить производственный процесс."
 infantry_manufacturing: "Удешевление пехотного снаряжения"
 infantry_manufacturing_desc: "Чтобы пойти еще дальше, нам нужна команда инженеров в нашем исследовательском центре, которые посвящают себя упрощению деталей и повышению надежности нашего оружия."
 airborne_cavalry_light: "Воздушно-десантный кавалерийский корпус"
 airborne_cavalry_light_desc: "Воздушно-десантные кавалерийские корпуса-это высокомобильные силы, состоящие из наших Воздушно-десантных войск. Они гарантируют, что мы сможем реагировать на любую ситуацию в бою и отталкивать прорывы, какими бы сильными или частыми они ни были."
 motor_design: "Модели автотранспорта"
 motor_design_desc: "Мы должны расширить нашу команду по оптимизации двигателей инженерами, которые будут помогать в разработке новых машин для нашей армии."
 submarine_focus: "Секретное проектирование подводных лодок"
 submarine_focus_desc: "Есть очень хороший анклав, который мы нашли на побережье. Мы можем начать бурить в нем, чтобы создать сверхсекретный исследовательский центр подводных лодок."
 navy_exercise: "Морские учения"
 navy_exercise_desc: "Нам нужно провести масштабные военно-морские учения, чтобы лучше понять, как устроен морской бой."
 submarine_manufacturing: "Флотилии субмарин"
 submarine_manufacturing_desc: "Открытое море пронизано маршрутами вражеских конвоев, перевозящими припасы. Мы должны создать специальную флотилию, чтобы повысить эффективность нашей охоты за конвоями."
 escort_focus: "Военно-морской отдел логистики"
 escort_focus_desc: "Наше развитие рейдерского корпуса оставило нас уязвимыми против вражеских атак. Если наши враги сделают то же, что и мы, мы можем оказаться в опасности. Мы должны организовать наш тыловой корпус и установить формализованные протоколы охраны для наших флотов."
 shore_bombardment_focus: "Департамент артиллерии"
 shore_bombardment_focus_desc: "Наш флот должен быть более универсальным, чем когда-либо. Мы должны создать дальнобойные морские артиллерийские орудия в нашем исследовательском центре, чтобы помочь нашим армиям на суше."
 naval_air_research_foc: "Создание объединенной группы ВВС и ВМФ"
 naval_air_research_foc_desc: "Нам нужно создать совместный исследовательский отдел военно-воздушных сил и военно-морского флота в нашем исследовательском центре."
 navy_air_production: "Создание объединенного авиационного корпуса"
 navy_air_production_desc: "В братстве, которое образовалось в  нашем исследовательском отделе, наш военно-морской флот и наши военно-воздушные силы хотят создать совместный воздушный корпус, где военно-воздушные силы обучают морских пилотов, а затем возвращают их в ВМФ. Это может пойти на пользу на обеим структурам."
 naval_recovery: "Департамент военно-морского кофморта"
 naval_recovery_desc: "Как ни странно, администратор исследовательского центра посвятил новый отдел улучшению условий жизни наших моряков. Мы должны вложить в это деньги, чтобы поднять боевой дух флота."
 naval_repair: "Ремонтный отдел ВМФ"
 naval_repair_desc: "Военно-морские корабли строятся очень долго. Ещё дольше они ремонтируются. Нам необходимо создать в нашем исследовательском центре отдел, специализирующийся на разработке новых способов повышения скорости ремонта наших кораблей."
 stronk_navy: "Мощный военно-морской флот"
 stronk_navy_desc: "Подводные лодки. Авианосцы. Морская авиация. Ни что из этого не может сравниться с истинной мощью ВМФ. Наша сила - в наших флотах."
 screen_focus: "Конструкторское бюро по созданию эскортных кораблей"
 screen_focus_desc: "Есть очень хорошое место, которое мы нашли на побережье. Мы можем начать строительство там, чтобы создать там КБ по проектированию и испытанию эскортных кораблей."
 capital_focus: "Конструкторское бюро по созданию крупных кораблей"
 capital_focus_desc: "Есть очень хорошое место, которое мы нашли на побережье. Мы можем начать строительство там, чтобы создать там КБ по проектированию и испытанию крупных кораблей."
 navy_exercise_0: "Морские учения"
 navy_exercise_0_desc: "Нам нужно провести масштабные военно-морские учения, чтобы лучше понять, как устроен морской бой."
 screen_capital_manufacturing: "Отдел сокращения расходов"
 screen_capital_manufacturing_desc: "Единственный способ противостоять врагу, который превосходит нас в морском бою, - это перестрелять его. Мы должны создать в нашем исследовательском центре подразделение, которое будет заниматься оптимизацией расходов на наши корабли."
 naval_organization: "Военно-морской отдел по работе с экипажом"
 naval_organization_desc: "Не секрет, что между кораблем и экипажом порой возникает связь. По мере добавления новых систем на судно, появляются новые члены экипажа. Если мы создадим отдел, занимающийся улучшением оснащения и организации экипажа, наши военно-морские силы смогут работать более эффективно."
 marine_focus: "Департамент морской пехоты"
 marine_focus_desc: "Морские пехотинцы-важнейшая часть любой армии. Хотя они и не элита, как спецназ, но они сильнее регулярных войск. Департамент, специализирующийся на исследовании и создание снаряжения морпехов, позволит нам получить максимальную отдачу от этих солдат."
 screen_attack: "Отдел экспериментального оружия"
 screen_attack_desc: "Есть много непроверенных идей и теорий для морского оружия. Мы должны создать отделение для проведения исследований с новейшим вооружением для нашего флота."
 capital_attack: "Департамент по бронированию кораблей"
 capital_attack_desc: "Мы должны стремиться к тому, чтобы сделать корабли более бронированными и живучими с лучшими системами управления огнем. Главный отдел по исследованию брони должен начать разработку новых типов брони для кораблей."
 guardian_angels: "Ангелы-хранители"
 guardian_angels_desc: "Бомбардировщики-ничто, если мы не можем контролировать небо. Наши самолеты будут ангелами-хранителями наших военных."
 light_aircraft_research: "Научно-исследовательский центр лёгких самолетов"
 light_aircraft_research_desc: "Мы должны построить авиационный исследовательский комплекс в отдаленном месте для проведения испытаний."
 air_shows: "Ежегодное авиашоу"
 air_shows_desc: "Чтобы создать культуру, которая ценит нашу воздушную мощь, мы должны ежегодно выставлять наши самолеты на всеобщее обозрение."
 air_shows_0: "Ежегодное авиашоу"
 air_shows_0_desc: "Чтобы создать культуру, которая ценит нашу воздушную мощь, мы должны ежегодно выставлять наши самолеты на всеобщее обозрение."
 light_aircraft_manufacturing: "Группа оптимизации лёгкой авиации"
 light_aircraft_manufacturing_desc: "Мы должны расширить авиационный исследовательский центр, чтобы включить в него группу по оптимизиции для снижения затрат."
 air_safety_focus: "Упор на надежность"
 air_safety_focus_desc: "Мы должны создать отдел, который будет заниматься исследованиям,цель которых направлена на повышение надежности наших самолётов."
 sabaton_firestorm: "Огненный шторм"
 sabaton_firestorm_desc: "Военно-воздушные силы бесполезны, если они не могут уничтожить то, что находится на земле. Наша авиация обрушит огненный шторм на головы наших врагов."
 bomber_research: "Научно-исследовательский центр тяжелой авиации"
 bomber_research_desc: "Мы должны построить авиационный исследовательский комплекс в отдаленном месте для проведения испытаний."
 heavy_aircraft_manufacturing: "Группа оптимизации тяжелой авиации"
 heavy_aircraft_manufacturing_desc: "Мы должны расширить авиационный исследовательский центр, чтобы включить в него группу по оптимизиции для снижения затрат.."
 heavy_reliability: "Высокая надежность"
 heavy_reliability_desc: "Мы должны создать отдел, который будет заниматься исследованиям,цель которых направлена на повышение надежности наших самолётов.."
 light_aircraft_research_0: "Программа по созданию лёгких самолетов"
 light_aircraft_research_0_desc: "Мы должны отправить новые объекты на испытания и обеспечить эти испытания достаточным финансированием для нового крупного воздушного проекта."
 heavy_aircraft_research_0: "Программа по созданию тяжелых самолетов"
 heavy_aircraft_research_0_desc: "Мы должны отправить новые объекты на испытания и обеспечить эти испытания достаточным финансированием для нового крупного воздушного проекта."
 overpowered_missile_research: "Ракетный центр"
 overpowered_missile_research_desc: "Хотя обычные и реактивные самолеты сами по себе прекрасны и хороши, наш исследовательский центр должен создать новый отдел, посвященный самим ракетам, чтобы дать этим самолетам больше огневой мощи."
 area_69: "Сверхсекретный исследовательский центр"
 area_69_desc: "Мы сделали значительные инвестиции в нашу армию. У нас есть три научно-исследовательских центра, каждый из которых имеет множество отделов. Теперь пришло время создать новый объект, способный курировать проекты и помогать нашим военным в новых разработках."
 finance_minister: "Утвердить министерство финансов"
 finance_minister_desc: "Пришло время создать министерство финансов, которое будет руководить казначейством."
 mil_naval_bases: "Строительство военно-морских баз"
 mil_naval_bases_desc: "Мы значительно расширили нашу наземную инфраструктуру. Однако пришло время расширить нашу военно-морскую инфраструктуру и построить порты и гавани для наших городов."
 finance_welfare_warrior_1: "Программа помощи малоимущим"
 finance_welfare_warrior_1_desc: "Наш новый министр финансов предложил, чтобы мы создали систему социальной защиты для помощи бедным."
 finance_welfare_warrior_2: "Государство всеобщего благосостояния"
 finance_welfare_warrior_2_desc: "Наш министр финансов разработал план перераспределения капитала сверху в помощь тем, кто находится внизу."
 finance_subsidizer_1: "Увеличить субсидии"
 finance_subsidizer_1_desc: "Наш новый министр финансов разработал план выплаты субсидий отраслям промышленности, которые испытывают трудности в нашей стране, чтобы сделать их более конкурентоспособными."
 finance_subsidizer_2: "Субсидирование железнодорожных компаний"
 finance_subsidizer_2_desc: "Наш министр финансов рекомендовал нам давать деньги железнодорожным компаниям, чтобы вознаградить их за труды и, тем самым субсидировать их, для того чтобы они приносили нам ещё больше выгоды."
 finance_finance_hawk_1: "Снизить налоги"
 finance_finance_hawk_1_desc: "Наш новый министр финансов ворвался в ваш кабинет. Он принес большую 500 страничную книгу заполненную предложениями по небольшим сокращениям в различных отраслях. Такое урезание налогов позволит нам увеличить благосостояние народа."
 finance_finance_hawk_2: "Урезать государственные пенсии"
 finance_finance_hawk_2_desc: "Наш министр финансов рекомендовал нам сократить государственные пенсии и обязать большую часть людей искать частные пенсионные фонды."
 infrastructure_interstate: "Строительство межрегиональной автомагистрали"
 infrastructure_interstate_desc: "Наша страна имеет плохое транспортное сообщение. Нам нужно построить межрегиональную автомагистраль, чтобы соединить нашу страну воедино."
 infrastructure_railway: "Строительство магистральной железной дороги"
 infrastructure_railway_desc: "Теперь, когда у нас есть сеть автодорог по всей стране, мы должны начать строительство магистральной железной дороги, о которой наш министр финансов говорил без остановки."
 health_minister: "Учредить министерство здравохранения"
 health_minister_desc: "Ситуация со здоровьем в нашей стране ухудшается с каждой секундой. Мы должны назначить нового прозорливого министра здравоохранения, чтобы вернуть все  в норму."
 health_socialist_1: "Социализированное здравоохранение"
 health_socialist_1_desc: "Наш новый министр здравоохранения рекомендовал нам начать всеобщую программу по улучшению здравоохранения, чтобы лучше заботиться о здоровье наших людях."
 health_socialist_2: "Программа общественного здравоохранения"
 health_socialist_2_desc: "Наш министр здравоохранения наметил ряд планов по улучшению программы здравоохранения для нашего народа."
 health_technocrat_1: "Медицинский исследовательский центр"
 health_technocrat_1_desc: "Наш новый министр здравоохранения привел убедительные аргументы, что единственный способ получить необходимое для нас медицинское обслуживание - это провести обширные исследования в различных отраслях медицины."
 health_technocrat_2: "Больничные лаборатории"
 health_technocrat_2_desc: "Наш министр здравоохранения рекомендовал нам создать ряд независимых лабораторий в наших больницах для проведения исследований и экспериментов с новыми процедурами."
 health_finance_hawk_1: "Сократить издержки"
 health_finance_hawk_1_desc: "Наш министр здравоохранения заявил, что наша система здравоохранения слишком дорого обходится нашей стране, и необходимо принять меры для ее удешевления."
 health_finance_hawk_2: "Частное здравоохранение"
 health_finance_hawk_2_desc: "Наш министр финансов рекомендовал нам полностью перейти на частную систему  здравоохранения и выдавать людям налоговые ваучеры людям, которые не могут себе позволить частное здравоохранение."
 infrastructure_urban: "Расширить городскую инфраструктуру"
 infrastructure_urban_desc: "Мы должны стремиться к расширению городской инфраструктуры в наших городах, чтобы повысить производительность труда."
 infrastructure_revise_planning: "Пересмотреть городское планирование"
 infrastructure_revise_planning_desc: "Мы должны пересмотреть то, как мы проводим городское планирование, чтобы лучше соответствовать будущему расширению и росту городской инфраструктуры."
 reshuffle_cabinet: "Переформировать кабинет министров"
 reshuffle_cabinet_desc: "Старый кабинет министров не хочет и не способен выполнять свою работу должным образом. Им пора в отставку, а вместо них мы назначим новых."
 finance_minister.d: "Выберите министра финансов для управления казначейством и капиталом страны"
 finance_minister.t: "Назначить министра финансов"
 finalize_research_facility_high: "Закончить исследовательский центр"
 finalize_research_facility_high_desc: "Наш новый объект теперь завершен. Пришло время упорядочить наши документацию."
 finalize_research_facility_low: "Военный исследовательский центр готов"
 finalize_research_facility_low_desc: "Наш славный военный исследовательский центр  завершен. Теперь закончим с документам."
 finalize_naval_facility_flexible: "Завершить строительство военно-морского исследовательского центра"
 finalize_naval_facility_flexible_desc: "Наш военно-морской исследовательский центр готов к завершению. Мы просто должны сложить все бумаги в одну папку."
 finalize_naval_facility_stronk: "Крупный военно-морской исследовательский центр "
 finalize_naval_facility_stronk_desc: "Мы завершили наш военно-морской исследовательский центр и теперь можем записать все, что у нас есть в одном списке."
