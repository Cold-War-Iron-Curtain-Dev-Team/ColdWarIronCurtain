 USA_MCGOVERN72_Reform_Welfare_Bureacracy: "Реформировать бюрократию социального обеспечения"
 USA_MCGOVERN72_Railroad_Revitilization_and_Regulation_Act: "Закон о возрождении и регулировании железных дорог"
 USA_MCGOVERN72_Trade_Act_of_1974: "Закон о торговле 1974 года"
 USA_MCGOVERN72_Come_Home_America: "Возвращайся домой, Америка"
 USA_MCGOVERN72_Implement_the_Earned_Income_Tax_Credit: "Внедрить налоговый кредит на заработанный доход"
