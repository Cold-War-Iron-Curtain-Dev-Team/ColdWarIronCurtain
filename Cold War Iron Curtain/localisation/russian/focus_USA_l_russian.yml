 USA_EISENHOWER_The_Eisenhower_Administration: "Администрация Эйзенхауэра"
 USA_EISENHOWER_The_Eisenhower_Administration_desc: "Бывший начальник SHAEF и архитектор высадки в День Д, перейдя от военной службы к политической карьере, теперь оказался во главе правительства США. Вам нравится Айк? Потому что электорат, похоже, да!"
 USA_EISENHOWER_Balance_the_Budget: "Сбалансировать бюджет"
 USA_EISENHOWER_Balance_the_Budget_desc: "Хотя это не самое веселое занятие, федеральный бюджет должен быть обуздан. Он вышел из-под контроля, деньги уходят везде и всюду, казалось бы, наугад. С этим нужно что-то делать."
 USA_EISENHOWER_Refugee_Relief_Ac: "Закон о помощи беженцам"
 USA_EISENHOWER_Refugee_Relief_Ac_desc: "Очень много беженцев бегут из-за железного занавеса. Нам нужно принять закон, который позволит им въехать в страну, чтобы они не были вынуждены вернуться в коммунистическую тюрьму, из которой бежали."
 USA_EISENHOWER_Social_Security_Act_of_1953: "Закон о социальном обеспечении 1953 года"
 USA_EISENHOWER_Social_Security_Act_of_1953_desc: "SSA от 1953 года увеличит пособия для пожилых людей и кормильцев, продлит зачет заработной платы за военную службу, и сделает больше средств доступными для федерального правительства."
 USA_EISENHOWER_Communist_Control_Act: "Закон о контроле над коммунистами"
 USA_EISENHOWER_Communist_Control_Act_desc: "Закон о контроле над коммунистами запретит коммунистическую партию, что давно назрело. Он также криминализирует членство или поддержку партии или других групп, признанных генеральным прокурором США коммунистическими."
 USA_EISENHOWER_National_Firearms_Act: "Национальный закон об огнестрельном оружии"
 USA_EISENHOWER_National_Firearms_Act_desc: "Национальный закон об огнестрельном оружии попытается продолжить Федеральный закон об огнестрельном оружии 1938 года, который объявлял вне закона владение тяжелым оружием, таким как пулеметы, и требовал регистрации владельцев в федеральном бюро."
 USA_EISENHOWER_Sabotage_the_Army_McCarthy_Hearings: "Саботаж армейских слушаний Маккарти."
 USA_EISENHOWER_Sabotage_the_Army_McCarthy_Hearings_desc: "Возможно, Маккарти зашел слишком далеко в своей попытке очистить правительство от коммунистов, но этот процесс выходит из-под контроля. В конце концов, Маккарти - республиканец и голосует за нас. Мы должны попытаться найти любые недостатки в его экзаменаторах, какие только сможем."
 USA_EISENHOWER_Small_Buisness_Act: "Закон о малом бизнесе"
 USA_EISENHOWER_Small_Buisness_Act_desc: "Малый бизнес жизненно важен почти для каждого города, независимо от численности населения, которое он обслуживает. В то время как крупные корпорации становятся все более могущественными, мы должны обеспечить защиту малого бизнеса."
 USA_EISENHOWER_Multiple_Mineral_Development_Act: "Закон о разработке множества полезных ископаемых"
 USA_EISENHOWER_Multiple_Mineral_Development_Act_desc: "Закон о разработке множества полезных ископаемых - это поправка к давно действующему Общему закону о горном деле от 1872 года. Он позволит разрабатывать и добывать несколько полезных ископаемых на одном и том же участке земли."
 USA_EISENHOWER_Agricultural_Act_of_1954: "Сельскохозяйственный закон 1954 года"
 USA_EISENHOWER_Agricultural_Act_of_1954_desc: "Сельскохозяйственный закон 1954 года создаст Корпорацию товарного кредита для оказания помощи иностранным и отечественным сельхозпроизводителям, а также установит гибкий контроль цен и поддержку сельскохозяйственной продукции."
 USA_EISENHOWER_Federal_National_Mortgage_Association_Charter_Act: "Закон об уставе Федеральной национальной ипотечной ассоциации"
 USA_EISENHOWER_Federal_National_Mortgage_Association_Charter_Act_desc: "FNMACA реорганизует FNMA (известную как Fannie Mae в просторечии), чтобы лучше помочь вторичному ипотечному рынку и его инвесторам."
 USA_EISENHOWER_Enforce_Brown_vs_Board_of_Education: "Обеспечение выполнения закона Брауна против Совета по образованию"
 USA_EISENHOWER_Enforce_Brown_vs_Board_of_Education_desc: "Верховный суд постановил, что сегрегация школ является неконституционной, однако многие губернаторы и школьные системы отказываются это делать. Это возмутительно, и они должны раз и навсегда усвоить, что все люди созданы равными."
 USA_EISENHOWER_National_Housing_Act_of_1955: "Национальный жилищный акт 1955 года"
 USA_EISENHOWER_National_Housing_Act_of_1955_desc: "National Housing ACt of 1955 обеспечит финансирование 140.000 единиц жилья, которые будут построены на месте трущоб, которые будут очищены."
 USA_EISENHOWER_Internal_Revenue_Code_of_1954: "Кодекс внутренних доходов 1954 года"
 USA_EISENHOWER_Internal_Revenue_Code_of_1954_desc: "Налоговый кодекс 1954 года станет первым крупным пересмотром нашей налоговой системы с момента ее создания в 1913 году. В кодексе так много лазеек и слабых мест, что мы не можем позволить им больше сидеть без дела."
 USA_EISENHOWER_Career_Incentive_Act: "Закон о стимулировании карьеры"
 USA_EISENHOWER_Career_Incentive_Act_desc: "Закон о стимулировании карьеры будет делать именно то, что называется - стимулировать карьерную военную службу для тех, кто был призван на Корейскую войну и скоро закончит свой срок."
 USA_EISENHOWER_Fish_and_Wildlife_Act: "Закон о рыбе и дикой природе"
 USA_EISENHOWER_Fish_and_Wildlife_Act_desc: "Целью FWA является регулирование коммерческой рыбной промышленности, создание политики в отношении рыбы и моллюсков, расширение общественных возможностей для рыбалки, а также увеличение исследований в области рыбы и дикой природы."
 USA_EISENHOWER_Interstate_Highway_Act_of_1955: "Закон о межгосударственных автомагистралях 1955 года"
 USA_EISENHOWER_Interstate_Highway_Act_of_1955_desc: "Закон о межгосударственных автомагистралях 1955 года санкционирует выделение 25 миллиардов долларов на строительство 41000 миль дорог по всей Америке. Официально это будет сделано для того, чтобы лучше связать нашу нацию и население, но истинная цель - помочь военным перевозкам и, в случае необходимости, эвакуации."
 USA_EISENHOWER_Modernize_the_Postal_Service: "Модернизировать почтовую службу."
 USA_EISENHOWER_Modernize_the_Postal_Service_desc: "Почтовая служба является важнейшей составляющей бесперебойной работы нашей страны, и все же она во многом устарела, даже в некоторых отдаленных местах все еще полагается на лошадей. Мы должны привести ее в соответствие с современными стандартами середины 20-го века."
 USA_EISENHOWER_Health_Research_Facilities_Act: "Закон о медицинских исследовательских учреждениях"
 USA_EISENHOWER_Health_Research_Facilities_Act_desc: "Создание крупных научно-исследовательских учреждений здравоохранения, таких как Национальный институт здоровья (НИЗ) вблизи Вашингтона, округ Колумбия, улучшит нашу способность изучать современные заболевания и производить высокотехнологичные лекарства от них."
 USA_EISENHOWER_The_Space_Race: "Космическая гонка"
 USA_EISENHOWER_The_Space_Race_desc: "Космос - последний рубеж! Он всегда захватывал наше воображение, и с новыми разработками он скоро будет в нашей досягаемости. Однако мы должны идти в ногу с Советами, поскольку они, похоже, имеют здесь преимущество."
 USA_EISENHOWER_Air_Pollution_Control_Act: "Закон о контроле за загрязнением воздуха"
 USA_EISENHOWER_Air_Pollution_Control_Act_desc: "Закон о контроле загрязнения воздуха призван обеспечить исследования и техническую помощь в области контроля загрязнения воздуха, а также регулировать выбросы от автомобилей и заводов."
 USA_EISENHOWER56_The_Eisenhower_Administration_1956: "Администрация Эйзенхауэра"
 USA_EISENHOWER56_The_Eisenhower_Administration_1956_desc: "Дуайт Д. Эйзенхауэр победил на президентских выборах 1956 года, одержав убедительную победу над своим коллегой-демократом. Однако ему придется преодолеть меньшинство в Палате представителей и Сенате."
 USA_EISENHOWER_Economic_Prosperity: "Экономическое процветание"
 USA_EISENHOWER_Economic_Prosperity_desc: "Наша экономика - самая сильная в мире, и наш народ это знает. У нас больше всего потребительских товаров, лучшие услуги, и каждому есть чем насладиться. Это чрезвычайно полезно и даст отличные результаты."
 USA_EISENHOWER_Establish_NASA: "Создать НАСА"
 USA_EISENHOWER_Establish_NASA_desc: "Поскольку новые достижения в области космических/ракетных технологий появляются каждый день, пришло время создать официальное правительственное агентство, которое будет заниматься этими вопросами. Национальное управление по аэронавтике и исследованию космического пространства поможет упорядочить и сфокусировать наш исследовательский процесс."
 USA_EISENHOWER_Airways_Modernization_Act: "Закон о модернизации воздушных путей"
 USA_EISENHOWER_Airways_Modernization_Act_desc: "1 год назад, 30 июня, произошла ужасная катастрофа с участием двух пассажирских самолетов в нерегулируемом воздушном пространстве над Гранд-Каньоном. Приняв Закон о модернизации воздушных путей, мы можем гарантировать, что это не повторится."
 USA_EISENHOWER_Civil_Rights_Act_of_1957: "Закон о гражданских правах 1957 года"
 USA_EISENHOWER_Civil_Rights_Act_of_1957_desc: "С 1875 года каждый раз, когда вносился закон о гражданских правах, его отклоняли. Однако это не означает, что мы можем смириться с нынешним положением дел с правами афроамериканцев. Пришло время попытаться провести через Конгресс еще один закон о гражданских правах."
 USA_EISENHOWER_Deploy_the_Army_to_Little_Rock: "Развернуть армию в Литл-Рок"
 USA_EISENHOWER_Deploy_the_Army_to_Little_Rock_desc: "Несмотря на результаты дела \"Браун против Совета по образованию\" и недавно принятый закон о гражданских правах, губернатор Арканзаса Орвал Фаубус отказывается десегрегации Центральной средней школы Литл-Рока. Мы должны привлечь к федерализации Национальную гвардию, останавливающую студентов, и заставить их сопроводить \"Little Rock 9\" в безопасное место."
 USA_EISENHOWER_National_Defense_Education_Act: "Закон об образовании в области национальной обороны"
 USA_EISENHOWER_National_Defense_Education_Act_desc: "Нам необходимо улучшить научную программу наших школьных систем, чтобы наши будущие химики и физики имели лучшую подготовку в этих важнейших областях. NDEA будет распределять средства среди научных программ по всей Америке."
 USA_EISENHOWER_Price_Anderson_Nuclear_Industries_Indemnity_Act: "Закон Прайса Андерсона о возмещении ущерба ядерной промышленности"
 USA_EISENHOWER_Price_Anderson_Nuclear_Industries_Indemnity_Act_desc: "Ядерная промышленность - электростанции и другие службы - по своей сути опасна. Нам необходимо обеспечить, чтобы и гражданское население могло получить компенсацию в случае инцидента, и чтобы корпорации были частично защищены от исков об ответственности."
 USA_EISENHOWER_Establish_ARPA: "Создать ARPA"
 USA_EISENHOWER_Establish_ARPA_desc: "Советы, запустив Спутник, доказали, насколько они опережают нас в передовых областях исследований, и мы не можем позволить себе еще больше отстать. ARPA, или Агентство передовых исследовательских проектов, будет служить нам в этом."
 USA_EISENHOWER_Federal_Aviation_Act: "Федеральный закон об авиации"
 USA_EISENHOWER_Federal_Aviation_Act_desc: "Вслед за Законом о модернизации воздушных путей 1957 года, Федеральный закон об авиации будет и дальше регулировать и структурировать дружественное небо, создав Федеральную авиационную администрацию."
 USA_EISENHOWER_Transportation_Act: "Закон о транспорте"
 USA_EISENHOWER_Transportation_Act_desc: "Из-за нашей совершенно новой системы супермагистралей железные дороги, и без того испытывающие трудности из-за авиакомпаний, чувствуют себя еще хуже. Закон о транспорте уполномочит МТП ссужать железным дорогам деньги и устанавливать цены, чтобы попытаться оживить их."
 USA_EISENHOWER_Narcotics_Manufacturing_Act: "Закон о производстве наркотиков"
 USA_EISENHOWER_Narcotics_Manufacturing_Act_desc: "Хотя мы принимали предыдущие акты и конвенции, касающиеся незаконных наркотиков, нам необходимо подтвердить нашу приверженность им, а также создать больше сдерживающих факторов для производства наркотиков. НМА выполнит обе эти задачи."
 USA_EISENHOWER_The_Lessons_of_Defeat: "Уроки поражения"
 USA_EISENHOWER_The_Lessons_of_Defeat_desc: "За последние несколько лет наши люди, приученные к победе после мировых войн, начали ощущать горький вкус поражения после наших неудач в Корее. Однако это не совсем плохо, поскольку из поражения можно извлечь иные уроки и стратегии, чем из победы."
 USA_EISENHOWER_Department_of_Defense_Reorganization_Act: "Закон о реорганизации Министерства обороны"
 USA_EISENHOWER_Department_of_Defense_Reorganization_Act_desc: "ДОРПА упорядочит цепочку командования в наших вооруженных силах, передав принятие решений от военных департаментов Объединенному комитету начальников штабов и министру обороны. Он также создаст более централизованную, ориентированную на военных версию АРПА - ДАРПА."
 USA_EISENHOWER_Admission_of_Alaska_and_Hawaii: "Принятие Аляски и Гавайев"
 USA_EISENHOWER_Admission_of_Alaska_and_Hawaii_desc: "После того, как Аляска и Гавайи были территориями США с 1800-х годов, мы наконец-то получили поддержку в Сенате, чтобы принять Аляску и Гавайи в состав Союза. Нам придется усиленно лоббировать их принятие, а производителям флагов придется обновить их дизайн."
 USA_EISENHOWER_The_Airport_Construction_Act: "Закон о строительстве аэропорта"
 USA_EISENHOWER_The_Airport_Construction_Act_desc: "Теперь, когда мы сделали небо над Америкой более безопасным местом, пришло время, чтобы больше людей могли воспользоваться его преимуществами. Закон о строительстве аэропортов предоставит субсидии на запланированные проекты аэропортов, а также поддержит сельские аэропорты в их непрерывном обслуживании."
 USA_EISENHOWER_Solve_the_Missle_Gap: "Устранить ракетный разрыв"
 USA_EISENHOWER_Solve_the_Missle_Gap_desc: "Кажется, что Советы намного опережают нас в ракетной/ракетной технологии, вплоть до того, что это становится международной шуткой. Нам нужно удвоить наши усилия и ликвидировать разрыв в наших технологиях."
 USA_EISENHOWER_Revise_the_Walsh_Healey_Contracts_Act: "Пересмотреть закон о контрактах Уолша-Хили"
 USA_EISENHOWER_Revise_the_Walsh_Healey_Contracts_Act_desc: "Закон о контрактах Уолша-Хили от 1937 года устанавливает базовую зарплату за стандартные и сверхурочные часы для гражданских служащих, работающих по правительственным контрактам, и был разработан для улучшения трудовых стандартов. Он более чем немного устарел, и в него необходимо внести несколько изменений."
 USA_EISENHOWER_The_Explorers_Program: "Программа исследователей"
 USA_EISENHOWER_The_Explorers_Program_desc: "Программа исследователей - это космический проект НАСА, в рамках которого будут проводиться эксперименты и собираться информация о физике в космическом пространстве. Эксплорер-1, первая ракета, выстроенная для миссии, надеюсь, достигнет орбиты."
 USA_EISENHOWER_Landrum_Griffin_ACt: "Закон Ландрума Гриффина"
 USA_EISENHOWER_Landrum_Griffin_ACt_desc: "Недавно стали известны новые факты коррупции и недобросовестной работы среди профсоюзов. Закон Ландрума-Гриффина будет регулировать внутренние дела профсоюзов и обяжет их отчитываться перед Министерством труда, чтобы решить эту проблему."
 USA_EISENHOWER_Civil_Rights_Act_of_1960: "Закон о гражданских правах 1960 года"
 USA_EISENHOWER_Civil_Rights_Act_of_1960_desc: "Даже после всех наших усилий все еще существует множество дискриминационных законов и практик, призванных помешать афроамериканцам и латиноамериканцам голосовать, особенно на Юге. Этот закон о гражданских правах установит федеральную проверку списков избирателей и введет наказания за препятствование избирателям, чтобы противостоять этим законам."
 USA_70s_Advanced_Cruise_Missle_Development: "Разработка усовершенствованной крылатой ракеты"
 USA_70s_Advanced_Cruise_Missle_Development_desc: "Крылатые ракеты обладают многими преимуществами, включая большую дальность полета и способность управляться в полете. Мы должны инвестировать в дополнительные исследования в этой области, чтобы создать новое поколение крылатых ракет и получить преимущество над Красной Армией"
 USA_70s_Improve_Missle_Launch_Awareness: "Улучшить осведомленность о запуске ракет"
 USA_70s_Improve_Missle_Launch_Awareness_desc: "Реалии холодной войны означают, что Советы могут начать стратегическое ядерное нападение на Соединенные Штаты в любой момент. Мы должны усовершенствовать наши системы предупреждения, чтобы сохранить нашу способность противостоять любому превентивному ядерному удару."
 USA_70s_Improve_the_M113: "Улучшение M113"
 USA_70s_Improve_the_M113_desc: "M113 ACAV - это прочный и надежный бронетранспортер. Улучшив подвеску, охлаждение двигателя и дымовые установки, мы можем сделать M113 настоящим элементом армии Соединенных Штатов на десятилетия вперед."
 USA_70s_The_MICV_Program: "Программа MICV"
 USA_70s_The_MICV_Program_desc: "M113 ACAV - прекрасная машина, но она слишком слабо вооружена для поддержки операций пехоты после того, как войска спешиваются. Новый прототип MICV-70 может похвастаться грузоподъемностью в девять человек и броней, способной остановить советские пули калибра 14,5 мм HMG. Он также оснащен 20- или 25-мм автоматической пушкой и портовым оружием M321 для стрельбы в придачу."
 USA_70s_Widen_M113_Deployment: "Расширить развертывание M113"
 USA_70s_Widen_M113_Deployment_desc: "Низкая стоимость и надежность M113 в бою не дают нам оснований не увеличивать производство. Наши парни в форме не будут скакать в бой с шиком, но у них будет хороший шанс выйти из боя живыми"
 USA_70s_M939_Trucks: "Грузовики M939"
 USA_70s_M939_Trucks_desc: "Тяжелый грузовик M939 может перевозить груз весом 10 000 фунтов и станет достойной заменой почтенному M809."
 USA_70s_The_TOW_Missle: "Ракета TOW"
 USA_70s_The_TOW_Missle_desc: "Новая противотанковая управляемая ракета TOW обладает вдвое большей дальностью стрельбы, чем SS.10, и высокотехнологичной системой наведения SACLOS, которая облегчает поражение целей. Способные пробивать более 430 мм RHA, они станут важной защитой от советской брони нового поколения"
 USA_70s_The_Navys_20th_Decade: "20-е десятилетие ВМС"
 USA_70s_The_Navys_20th_Decade_desc: "Военно-морскому флоту Соединенных Штатов исполняется 200 лет, и какую вечеринку мы запланировали! Конечно, у нас есть несколько подарков для наших отважных мужчин и женщин в море."
 USA_70s_The_VFX_Program: "Программа VFX"
 USA_70s_The_VFX_Program_desc: "Корпорация Grumman представила прототип нового военно-морского истребителя с двумя мощными двигателями, крыльями изменяемой стреловидности и самыми лучшими авиационными технологиями. Мы должны немедленно начать тесты."
 USA_70s_Restart_the_VFAX_Program: "Перезапуск программы VFAX"
 USA_70s_Restart_the_VFAX_Program_desc: "Полный провал F-111B оставил военно-морской флот без жизнеспособного ударного истребителя, который мог бы заменить F-4 Phantom II. Давайте посмотрим, что может приготовить авиационная промышленность."
 USA_70s_Select_a_VFX_Program_Winner: "Выбрать победителя программы VFX"
 USA_70s_Select_a_VFX_Program_Winner_desc: "Хотя дизайн Grumman остается фаворитом, General Dynamics, McDonnell Douglas и Rockwell представили свои проекты для VFX. Все, что теперь остается, - это выбрать победителя и заказать наших новых бойцов."
 USA_70s_Big_Cats_Big_Decks: "Большие кошки Большие колоды"
 USA_70s_Big_Cats_Big_Decks_desc: "Современные самолеты-носители намного крупнее, чем винтовые \"Уайлдкэтсы\" и \"Неустрашимые\" времен войны на Тихом океане. Нам нужен новый класс атомных авианосцев с палубами, достаточно массивными, чтобы поддерживать нашу современную флотскую авиацию."
 USA_70s_Advanced_S_3_Viking_Capabilities: "Расширенные возможности S 3 Viking"
 USA_70s_Advanced_S_3_Viking_Capabilities_desc: "S-3 \"Викинг\" - многоцелевой самолет с реактивным двигателем, хорошо оснащенный для борьбы с советскими подводными лодками нового поколения."
 USA_70s_Strategic_Bomber_Command_Restructure: "Перестройка командования стратегических бомбардировщиков"
 USA_70s_Strategic_Bomber_Command_Restructure_desc: "Стратегическое бомбардировочное командование превратилось в неэффективный, запутанный хаос. Сократив бюджет SBC и закрыв ненужные базы, мы можем снова превратить SBC из раздутого чудовища в существенную часть наших наступательных и оборонительных возможностей."
 USA_70s_Cancel_the_XB_70: "Отменить XB 70"
 USA_70s_Cancel_the_XB_70_desc: "XB-70 - прототип шестимоторного стратегического бомбардировщика, способного развивать устойчивую скорость свыше 3 Махов. Это чудо инженерной мысли, к сожалению, является пустой тратой денег, созданное за время до того, как МБР сделали стратегические ядерные средства воздушного базирования достоянием прошлого. Пришло время нам заткнуть ей рот и вложить деньги во что-то более современное."
 USA_70s_Big_Four_B_52_Enhancement: "Большая четверка B 52 Улучшение"
 USA_70s_Big_Four_B_52_Enhancement_desc: "Настоящий бомбардировщик В-52 начинает стареть, но мы все еще можем модернизировать и перестроить наш парк В-52, чтобы они выглядели и летали как новенькие."
 USA_70s_Evaluate_Vietnam_War_Air_Combat_Experiences: "Оценить опыт воздушных боев вьетнамской войны"
 USA_70s_Evaluate_Vietnam_War_Air_Combat_Experiences_desc: "Превосходство в воздухе, наземная поддержка и стратегические бомбардировки - все это сыграло важную роль во вьетнамском конфликте, но мы также понесли тяжелые потери и обнаружили, что некоторые из наших моделей самолетов лучше подходят для более ранней эпохи войны. Мы должны использовать уроки, извлеченные во Вьетнаме, для разработки нового поколения боевых самолетов для нового поколения войн."
 USA_70s_The_F_15_Eagle: "F 15 Eagle"
 USA_70s_The_F_15_Eagle_desc: "Созданный в ответ на советский истребитель МиГ-25, McDonnell Douglas F-15 Eagle является истребителем будущего. Его мощные двигатели способны подниматься на высоту 30 000 футов за одну минуту и выполнять вертикальное ускорение в боевых условиях, в то время как его пилот имеет доступ к цифровому бортовому компьютеру и самому лучшему радару и авионике."
 USA_70s_The_M1_Abrams: "M1 Abrams"
 USA_70s_The_M1_Abrams_desc: "M60 Patton - прекрасный танк, но новый советский Т-72 выбивает его из колеи. Нам нужен современный танк с огневой мощью \"Паттона\", но с мобильностью и защитой, чтобы справиться с новыми игрушками Москвы."
 USA_70s_The_Nimitz_Class_Supercarrier: "Суперкарриер класса \"Нимиц\""
 USA_70s_The_Nimitz_Class_Supercarrier_desc: "Класс Nimitz станет вершиной технологии авианосцев. Этот плавучий город с экипажем из более чем 5000 солдат и офицеров может вместить более 100 самолетов в условиях военного времени и полностью оснащен ядерной энергетикой."
 USA_70s_The_A_10_Thunderbolt_II_Warthog: "A 10 Thunderbolt II Warthog"
 USA_70s_The_A_10_Thunderbolt_II_Warthog_desc: "Прозванный пилотами \"бородавочником\", A-10 Thunderbolt II был спроектирован как мощный штурмовик, способный наносить удары и получать за это множество наказаний. Может, она и некрасива, но да поможет Бог любому, кто окажется под прицелом этой 30-миллиметровой вращающейся автопушки."
