l_english:
 mic_expansion: "Расширение военно-промышленного комплекса"
 unificaiton_elections_vie_veto: "Южный Вьетнам наложил вето на выборы по воссоединению"
 USA_Operation_Paperclip: "Операция 'Скрепка'"
 USA_Operation_Paperclip_desc: "Хотя кажется немного неприятным полагаться на наших бывших врагов, Вернер фон Браун и его коллеги немецкие ученые - лучшие в своем деле, а нам нужны лучшие люди, работающие над нашей программой баллистических ракет."
 USA_Advanced_Military_Projects: "Передовые военные проекты"
 USA_Advanced_Military_Projects_desc: "Каждый день в военных исследованиях совершаются новые открытия, и было бы глупо не воспользоваться ими. Мы должны увеличить финансирование военных исследований."
 USA_Early_Ballistic_Missle_Developments: "Ранние разработки баллистических ракет"
 USA_Early_Ballistic_Missle_Developments_desc: "Несмотря на то, что наша ракетная программа все еще находится в зачаточном состоянии, она делает потрясающие успехи. Мы должны хорошо использовать эти новообретенные знания и испытать их на практике. "
 USA_Atlas_Program: "Программа 'Атлас'"
 USA_Atlas_Program_desc: "Подразделение Convair компании GM разрабатывает новую МБР и космическую ракету под названием Атлас, и после первого запуска она станет самой большой в истории. Она не только сможет доставить ядерную боеголовку, но и доставить человека на орбиту вокруг Земли."
 USA_Castle_Bravo: "Касл Браво"
 USA_Castle_Bravo_desc: "Castle Bravo будет первой из наших термоядерных бомб, использующих дейтерид лития. На данный момент это самое смертоносное оружие из когда-либо созданных. Теперь Советы не посмеют нам перечить!"
 USA_Condemn_British_Imperialism: "Осудить британский империализм"
 USA_Condemn_British_Imperialism_desc: "Великобритания продолжает поддерживать режим Пехлеви исключительно в своих собственных империалистических интересах. Мы должны вмешаться и положить этому конец, чтобы повысить независимость Ирана."
 USA_Foriegn_Aid_to_Iran: "Иностранная помощь Ирану"
 USA_Foriegn_Aid_to_Iran_desc: "Несмотря на свои размеры и численность населения, Иран крайне слабо развит. Направление некоторых средств в эту страну может пойти только на пользу нам обоим."
 USA_Redevelopment_of_the_Iranian_Armed_Forces: "Реконструкция вооруженных сил Ирана"
 USA_Redevelopment_of_the_Iranian_Armed_Forces_desc: "В дополнение к своей небольшой экономике, Иран также имеет устаревшие вооруженные силы. Необходима реструктуризация и пополнение дивизий, чтобы обновить их для ведения современной войны."
 USA_The_Hungarian_Revolution: "Венгерская революция"
 USA_The_Hungarian_Revolution_desc: "Венгерский народ наконец-то увидел свет и обещание демократии. Однако Советы, как и ожидалось, преследуют диссидентов и оккупировали столицу и окрестности. Должны ли мы оставить это без внимания и просто выразить протест, или мы рискуем начать третью мировую войну, выдвинув ультиматум: выводите войска - или нет?"
 USA_Diplomatic_Objections: "Дипломатические возражения"
 USA_Diplomatic_Objections_desc: "Было бы неплохо иметь бастион демократии в глубине железного занавеса, лучше поддерживать мир, чем рисковать войной. Послать возражение - это все, что мы можем сделать, и нам придется наблюдать и ждать другого времени, чтобы нанести удар по коммунизму."
 USA_Ultimatum_to_the_Soviets: "Ультиматум Советам"
 USA_Ultimatum_to_the_Soviets_desc: "Советы зашли слишком далеко! Они обещали не вмешиваться в дела других стран еще в 44 году, и снова и снова нарушают это обещание. Наш долг - обеспечить выживание венгерского демократического режима, и мы скажем Советам, чтобы они отступили, иначе будет война."
 USA_Democracy_Restored_in_Hungary: "Восстановление демократии в Венгрии"
 USA_Democracy_Restored_in_Hungary_desc: "Советы отступили! Все наши перемирия в течение последней недели принесли большие дивиденды. В Венгрии теперь снова есть демократическое правительство, и наконец-то в железном занавесе появилась трещина. Кто знает, как долго продержится остальная его часть после этого?"
 USA_Back_Down: "Отступить"
 USA_Back_Down_desc: "Холодные головы возобладали и показали нам, что, возможно, рисковать войной и нашим уничтожением из-за Венгрии неразумно. Мы потеряем лицо и будем опозорены на мировом уровне, но выживание лучше, чем гордость."
 USA_The_Final_Struggle: "Последняя битва"
 USA_The_Final_Struggle_desc: "Вот оно. Советы отказались снять оккупацию Венгрии, и это то, что мы не можем оставить без внимания, как это было в прошлом. Чтобы защитить свободу, свободолюбие и демократию, у нас нет другого выбора, кроме как объявить войну. Да защитит нас Бог в этой страшной борьбе за судьбу мира и всего человечества."
 USA_Arm_Israel_suez: "Вооружение Израиля"
 USA_Arm_Israel_suez_desc: "Последние события доказали, что Израиль является ценным (если не единственным) союзником на Ближнем Востоке. Окруженный враждебными соседями, Израиль должен быть уверен, что он сможет защитить себя, если возникнет такая необходимость. Вооружение его сил является важной частью этой задачи."
 USA_Support_Colonial_Powers_in_UN: "Поддержка колониальных держав в ООН"
 USA_Support_Colonial_Powers_in_UN_desc: "После успешной кампании наши союзники вновь овладели Суэцем и оттеснили вооруженные силы Египта. Однако это не ставит точку в этом вопросе. Мы должны обратиться в ООН и решить этот вопрос раз и навсегда."
 USA_Support_Britian: "Поддержка Великобритании"
 USA_Support_Britian_desc: "После долгих дебатов и серьезных размышлений мы решили поддержать наших традиционных союзников в Суэцком кризисе. Надеемся, что они смогут вернуть Синай и канал без особых проблем, и Ближний Восток снова успокоится."
 USA_Economic_Aid_For_Korea_and_Japan: "Экономическая помощь Корее и Японии"
 USA_Economic_Aid_For_Korea_and_Japan_desc: "Корея и Япония - две самые мощные демократические страны в далеком Тихом океане. Мы должны посылать им экономическую помощь, чтобы они оставались сильными и способными защитить себя."
 USA_Recognize_Reality: "Признать реальность"
 USA_Recognize_Reality_desc: "Несмотря на все наши усилия, ситуация в Китае безнадежна и прошла точку невозврата. Коммунисты просто слишком сильны для Чан Кай-Шека и его националистических сил, и мы не можем вовлечь себя в еще одну полномасштабную войну. К сожалению, похоже, что Китай станет красным."
 USA_Arm_Taiwan: "Рука Тайваня"
 USA_Arm_Taiwan_desc: "Большая часть снаряжения националистической армии была потеряна во время поражения и последующей эвакуации из материкового Китая. Нам необходимо перевооружить Республику Тайвань, чтобы она могла продолжать поддерживать свои вооруженные силы."
 USA_Closer_Ties_to_MI6: "Тесные связи с МИ-6"
 USA_Outreach_to_Ho_Chi_Minh: "Работа с населением в Хо Ши Мине"
 USA_Outreach_to_Ho_Chi_Minh_desc: "Хо Ши Мин и его Демократическая Республика Вьетнам победили французских колонизаторов. Вместо того, чтобы позволить стране скатиться в советскую сферу влияния, мы должны попытаться установить с ним контакт и посмотреть, сможем ли мы найти решение проблемы двух государств."
 USA_The_Unification_of_Vietnam: "Объединение Вьетнама"
 USA_The_Unification_of_Vietnam_desc: "Переговоры с Хо Ши Мином и Южным Вьетнамом прошли успешно! Пришло время объединить два государства и сформировать один сильный, единый и независимый Вьетнам."
 USA_Finlandization_of_Vietnam: "Финляндизация Вьетнама"
 USA_Finlandization_of_Vietnam_desc: "Хо Ши Мин был готов пойти на компромисс, но в душе он все еще коммунист. Чтобы гарантировать, что он не присоединится к Варшавскому договору, как только мы отвернемся, мы должны финляндизировать страну - заставить Вьетнам объявить о своем нейтралитете, чтобы никто не вмешивался в его дела и он занимался своими делами."
 USA_Arm_Lebanon: "Рука Ливана"
 USA_Arm_Lebanon_desc: "\"Ливанское правительство находится не в таком шатком положении, как Хусейн, но все же ему предстоит нелегкая прогулка. Поддерживая его армию так же, как и иорданскую, мы можем гарантировать, что она сможет защитить Ливан от угроз Насера.\""
 USA_Support_Nasser: "Поддержите Насера"
 USA_Support_Nasser_desc: "Насер привнес глоток свежего воздуха в Египет, и, хотя он, возможно, не такой сторонник демократии, как нам хотелось бы, он не коммунист. Поддерживая его, мы можем гарантировать, что он останется таким."
 USA_Fund_the_Aswan_Dam: "Финансирование Асуанской плотины"
 USA_Fund_the_Aswan_Dam_desc: "Асуанская плотина сотворит чудо для сельских фермеров и экономики Египта в целом. Она будет генерировать большое количество электроэнергии, распространит воду по пустыне, а также станет огромной PR-победой для нас обоих. Все, что нам нужно сделать, это отправить средства."
 USA_TRUMAN_The_Truman_Administration: "Администрация Трумана"
 USA_TRUMAN_The_Truman_Administration_desc: "1-я администрация президента Трумана сосредоточится на улучшении внутренней стабильности и безопасности, а также продолжит некоторые программы и политику покойного президента Рузвельта."
 USA_TRUMAN_Fair_Labor_Standards_Amendment: "Поправка о справедливых трудовых стандартах"
 USA_TRUMAN_Fair_Labor_Standards_Amendment_desc: "Поправка о справедливых трудовых стандартах изменит закон от 1938 года, увеличив минимальную заработную плату и расширив законы о защите детского труда.\""
 USA_TRUMAN_Central_Intelligence_Agency_Act: "Закон о ЦРУ"
 USA_TRUMAN_Central_Intelligence_Agency_Act_desc: "Закон о ЦРУ сделает ЦРУ почти независимой правительственной ветвью, позволит ему держать в секрете свои записи и агентов, а также даст ему практически неограниченные средства. Захватывающе? Да. Неконституционно? Возможно."
 USA_TRUMAN_Agricultural_Act_of_1949: "Аграрный закон 1949 года"
 USA_TRUMAN_Agricultural_Act_of_1949_desc: "Закон о сельском хозяйстве от 1949 года позволит передавать излишки продовольствия нуждающимся в нем странам и предоставит помощь штатам для создания программ школьных обедов."
 USA_TRUMAN_Omnibus_Medical_Research_Act: "Омнибусный закон о медицинских исследованиях"
 USA_TRUMAN_Omnibus_Medical_Research_Act_desc: "Всеобъемлющий закон о медицинских исследованиях создаст NIAMD, или Национальный институт артрита и метаболических заболеваний. Он также уполномочит генерального хирурга сформировать национальную консультативную программу."
 USA_TRUMAN_Defense_Production_Act_of_1950: "Закон об оборонном производстве 1950 года"
 USA_TRUMAN_Defense_Production_Act_of_1950_desc: "В ответ на начало Корейской войны мы должны принять DPA. Он позволяет президенту Трумэну запрещать скопидомство и завышение цен, заставлять предприятия отдавать предпочтение военной продукции и контрактам, а также реквизировать имущество. Он также позволяет Министерству обороны выдавать беспроцентные кредиты, чтобы помочь предприятиям, жизненно важным для военных действий."
 USA_TRUMAN_Housing_Act: "Закон о жилье"
 USA_TRUMAN_Housing_Act_desc: "Закон о жилье предусматривает выделение средств на расчистку трущоб и обновление городов. Он также предоставляет больше полномочий для федеральных ипотечных программ и больше финансирования для исследования строительных технологий."
 USA_TRUMAN_National_Science_Foundation_Act: "Закон о Национальном научном фонде"
 USA_TRUMAN_National_Science_Foundation_Act_desc: "Закон о ННФ создаст ННФ, независимое правительственное агентство, которое продвигает и поддерживает все области исследований, от математики и компьютерных наук до социальных наук и экономики."
 USA_TRUMAN_The_Kefauver_Hearings: "Слушания по делу Кефаувера"
 USA_TRUMAN_The_Kefauver_Hearings_desc: "Слушания Кефаувера - это часть расследования Сената об организованной преступности в межштатной торговле, и сенатор Эстес Кефаувер возглавляет это расследование. Мы хотим выяснить, сколько преступных организаций существует в Америке.\nЭй... Разве это не работа ФБР?"
 USA_TRUMAN_McCarran_Internal_Security_Act: "Закон МакКаррана о внутренней безопасности"
 USA_TRUMAN_McCarran_Internal_Security_Act_desc: "Закон МакКаррана о внутренней безопасности потребует от коммунистических организаций зарегистрироваться у генерального прокурора и предоставить подробную информацию о своих финансах. Кроме того, он позволяет президенту задерживать и арестовывать людей, подозреваемых в сговоре или в возможности сговора с целью саботажа или шпионажа против США. \nО каком красном испуге вы говорите? Никто ничего не говорил о красном испуге!"
 USA_TRUMAN_Anti_Merger_Act: "Закон о противодействии слияниям"
 USA_TRUMAN_Anti_Merger_Act_desc: "Закон о борьбе со слияниями закроет лазейку в антимонопольном законе Клейтона от 1914 года, которая позволяла бизнесменам покупать активы конкурента, а не покупать бизнес напрямую, чтобы таким образом получить монополию. Он также даст правительству возможность предотвращать вертикальную интеграцию и конгломератные слияния."
 USA_TRUMAN_Social_Security_Act_of_1950: "Закон о социальном обеспечении 1950 года"
 USA_TRUMAN_Social_Security_Act_of_1950_desc: "Закон о социальном обеспечении 1950 года - это очередная поправка к первоначальному закону о социальном обеспечении 1935 года. Он продлевает срок действия закона, впервые увеличивает пособия и вводит в программу корректировку стоимости жизни."
 USA_TRUMAN_Propose_National_Healthcare_System: "Предложить национальную систему здравоохранения"
 USA_TRUMAN_Propose_National_Healthcare_System_desc: "Во многих сельских районах и районах с низким уровнем дохода нет ни больниц, ни даже врачей. Кроме того, государственные службы здравоохранения неадекватны и имеют недостаточное финансирование. Эти ситуации могут быть улучшены путем создания национальной системы здравоохранения."
 USA_TRUMAN_Crackdown_on_Strikers: "Подавление забастовок"
 USA_TRUMAN_Crackdown_on_Strikers_desc: "Рабочие U.S. Steel и других важных сталелитейных компаний, жизненно важных для гражданской экономики и вооруженных сил страны, планируют провести забастовку. Пытаясь национализировать заводы, на которых они работают, мы можем попытаться пресечь забастовку до ее начала."
 USA_TRUMAN_Tax_Relief_for_the_Poor: "Налоговые льготы для бедных"
 USA_TRUMAN_Tax_Relief_for_the_Poor_desc: "К сожалению, в Соединенных Штатах много бедных людей. Предоставление им налоговых льгот не только даст им и их семьям передышку, но и позволит им вложить больше денег в экономику."
 USA_TRUMAN_McCarran_Walter_Act: "Закон МакКаррана Уолтера"
 USA_TRUMAN_McCarran_Walter_Act_desc: "Закон МакКаррана Уолтера сохранит этнический статус-кво страны и предотвратит дестабилизирующее влияние коммунистов, \"еврейских интересов\" и других нежелательных лиц путем создания строгих иммиграционных квот, основанных на этнической и региональной принадлежности, а также на трудовой квалификации."
 USA_TRUMAN_Propose_Civil_Rights_Legislation: "Предложить законодательство о гражданских правах"
 USA_TRUMAN_Propose_Civil_Rights_Legislation_desc: "После десегрегации вооруженных сил есть много других шагов, которые мы можем предпринять, чтобы улучшить права афроамериканцев и получить их голоса. Они подвергаются репрессиям практически в любой социальной среде, и расовая напряженность высока. Мы должны что-то с этим сделать."
 USA_TRUMAN_The_McGuire_Act: "Закон МакГуайра"
 USA_TRUMAN_The_McGuire_Act_desc: "Закон МакГуайра расширит действие закона Миллера-Тайдингса от 1937 года, который позволяет штатам принимать законы о честной торговле для защиты малого бизнеса от вертикального фиксирования цен. Это исключение необходимо для того, чтобы обойти антитрестовский закон Шермана."
 USA_TRUMAN_Expand_Funding_for_Eletrification_Programs: "Расширение финансирования программ электрификации"
 USA_TRUMAN_Expand_Funding_for_Eletrification_Programs_desc: "В наше время электричество необходимо всем и везде. Мы находимся в процессе распространения электроэнергии по всей стране, но нам необходимо больше средств, чтобы делать это эффективно и результативно."
 USA_TRUMAN_Mutual_Security_Act: "Закон о взаимной безопасности"
 USA_TRUMAN_Mutual_Security_Act_desc: "Закон о взаимной безопасности 1951 года является продолжением закона 1949 года. Он создаст новое агентство, которое будет контролировать план Маршалла и надзирать за программами иностранной помощи, как военной, так и экономической, чтобы обеспечить нам союзников, способных защитить мир от \"красной угрозы.\""
 USA_TRUMAN_Calm_Political_Tensions: "Успокоить политическую напряженность"
 USA_TRUMAN_Calm_Political_Tensions_desc: "Между всеми этими коммунистами, радикальными элементами и просто недовольством по поводу холодной войны и направления развития нашей страны, политическая напряженность высока. Нам необходимо разрядить обстановку, пока ситуация не вышла из-под контроля и не произошел реальный ущерб."
 USA_TRUMAN52_The_Truman_Administration: "Администрация Трумана"
 USA_TRUMAN52_The_Truman_Administration_desc: "На второй срок президент Трумэн будет стремиться продолжить программы, которые он начал продвигать в 1948 году, а также расширить финансирование научных исследований и повысить стабильность в Соединенных Штатах."
 USA_TRUMAN52_Invest_in_Science: "Инвестиции в науку"
 USA_TRUMAN52_Invest_in_Science_desc: "Наука является важной восходящей областью в современном мире. Мы должны расширять наши усилия по просвещению людей и увеличивать их возможности для этого."
 USA_TRUMAN52_Expand_School_Lunch_Programs: "Расширение программ школьных обедов"
 USA_TRUMAN52_Expand_School_Lunch_Programs_desc: "Инициатива Программы школьных обедов была очень успешной и оказалась жизненно важной для некоторых из наших сельских школьных систем. Мы должны воспользоваться этим и расширить количество таких программ."
 USA_TRUMAN52_Repeal_Taft_Hartley: "Отмена Тафта-Хартли"
 USA_TRUMAN52_Repeal_Taft_Hartley_desc: "Закон Тафта-Хартли от 1947 года ограничивал деятельность профсоюзов, а в некоторых случаях и вовсе запрещал их. Мы считаем, что каждый человек должен иметь возможность как можно легче вступать в профсоюз, поэтому мы должны отменить этот закон немедленно."
 USA_TRUMAN52_Social_Security_Act_of_1953: "Закон о социальном обеспечении 1953 года"
 USA_TRUMAN52_Social_Security_Act_of_1953_desc: "Закон от 1953 года увеличит пособия для пожилых людей и кормильцев, продлит зачет заработной платы за военную службу и предоставит больше средств федеральному правительству."
 USA_TRUMAN52_Refugee_Relief_Ac: "Закон о помощи беженцам"
 USA_TRUMAN52_Refugee_Relief_Ac_desc: "В мире много людей, перемещенных в результате жестоких конфликтов, которые отчаянно ищут, где бы приютиться. Мы должны помочь им, оказывая помощь им и их странам."
 USA_TRUMAN52_Expand_The_Rural_Eletrification_Program: "Расширение программы электрификации сельских районов"
 USA_TRUMAN52_Expand_The_Rural_Eletrification_Program_desc: "Хотя мы, возможно, и начали электрификацию сельских районов, мы еще не закончили. Нам необходимо активизировать наши усилия по распространению электроэнергии по всей стране."
 USA_TRUMAN52_Empower_Trade_Unions: "Расширение прав и возможностей профсоюзов"
 USA_TRUMAN52_Empower_Trade_Unions_desc: "Профсоюзы являются важной частью нашей экономики, и слишком долго они были оттеснены или сдерживались. Мы должны расширить их возможности, чтобы работники могли защищать свои права."
 USA_TRUMAN52_Small_Buisness_Act: "Закон о малом бизнесе"
 USA_TRUMAN52_Small_Buisness_Act_desc: "Малый бизнес жизненно важен практически для каждого города, независимо от численности населения, которое он обслуживает. В то время как крупные корпорации становятся все более влиятельными, нам необходимо обеспечить защиту малого бизнеса."
 USA_TRUMAN52Expand_Medical_Access: "Расширение доступа к медицинским услугам"
 USA_TRUMAN52Expand_Medical_Access_desc: "Здравоохранение и доступ к больницам слишком важны, чтобы их не хватало или они были недоступны для многих американцев. Мы должны исправить это."
 USA_TRUMAN52_Federal_National_Mortgage_Association_Charter_Act: "Закон об уставе Федеральной национальной ипотечной ассоциации"
 USA_TRUMAN52_Federal_National_Mortgage_Association_Charter_Act_desc: "Каждая семья должна иметь возможность позволить себе собственный дом и жить в нем, однако для многих это слишком дорого. Создав Федеральную ипотечную ассоциацию, мы сможем помочь бедным семьям обрести жилье."
 USA_TRUMAN52_Enforce_Brown_vs_Board_of_Education: "Обеспечение соблюдения закона 'Браун против Совета' по образованию"
 USA_TRUMAN52_Enforce_Brown_vs_Board_of_Education_desc: "Верховный суд постановил, что сегрегация школ является неконституционной, однако многие губернаторы и школьные системы отказываются это делать. Это возмутительно, и они должны раз и навсегда усвоить, что все люди созданы равными."
 USA_TRUMAN52_Enforce_Fair_Labor_Standards: "Обеспечение соблюдения справедливых трудовых стандартов"
 USA_TRUMAN52_Enforce_Fair_Labor_Standards_desc: "Несмотря на принятие ранее Поправки о справедливых трудовых стандартах, во многих предприятиях по всей территории США до сих пор не соблюдаются правила. Нам необходимо обеспечить соблюдение Поправки более жесткими и четкими формулировками."
 USA_TRUMAN52_Internal_Revenue_Code_of_1954: "Налоговый кодекс 1954 года"
 USA_TRUMAN52_Internal_Revenue_Code_of_1954_desc: "Налоговый кодекс 1954 года станет первым крупным пересмотром нашей налоговой системы с момента ее создания в 1913 году. В кодексе так много лазеек и слабых мест, что мы не можем позволить им больше не работать."
 USA_TRUMAN52_Begin_Space_Research: "Начать космические исследования"
 USA_TRUMAN52_Begin_Space_Research_desc: "Космос - последний рубеж! Он всегда захватывал наше воображение, а с новыми разработками он скоро будет в нашей власти. Мы должны немедленно расширить космические исследования."
 USA_TRUMAN52_A_Quarter_Century_of_Progress: "Четверть века прогресса"
 USA_TRUMAN52_A_Quarter_Century_of_Progress_desc: "С момента окончания Великой депрессии и начала Второй мировой войны наша экономика стала самой сильной в мире и продолжает увеличиваться. Поздравляем нас!"
 USA_TRUMAN52_Federal_Infrastructure_Reform_Act: "Закон о реформе федеральной инфраструктуры"
 USA_TRUMAN52_Federal_Infrastructure_Reform_Act_desc: "Закон о реформе федеральной инфраструктуры снизит налоги на бензин и сократит программу федеральных автодорог, чтобы сосредоточиться исключительно на межгосударственных проектах."
 USA_TRUMAN52_Modernize_the_Postal_Service: "Модернизация почтовой службы"
 USA_TRUMAN52_Modernize_the_Postal_Service_desc: "Почтовая служба является важнейшей составляющей бесперебойной работы нашей страны, однако она в значительной степени устарела, а в некоторых отдаленных районах до сих пор работает на лошадях. Мы должны привести ее в соответствие с современными стандартами середины 20-го века."
 USA_TRUMAN52_Appeal_to_the_Dixiecrats: "Обращение к диксикратам"
 USA_TRUMAN52_Appeal_to_the_Dixiecrats_desc: "Диксикраты - или южные демократы - являются важной частью коалиции Демократической партии. Многие из них были встревожены десегрегацией, происходящей в штатах, и угрожают выйти из партии. Мы должны заверить их в том, что их интересы по-прежнему в наших руках."
 USA_TRUMAN52_Expand_Missile_Research: "Расширение ракетных исследований"
 USA_TRUMAN52_Expand_Missile_Research_desc: "Ракетные исследования очень важны для нашей способности конкурировать с Советами в небе, а также для доставки ядерного оружия. Мы должны поддерживать нашу программу на высоком уровне."
 USA_TRUMAN52_Continue_New_Deal_Economic_Policies: "Продолжить экономическую политику Нового курса"
 USA_TRUMAN52_Continue_New_Deal_Economic_Policies_desc: "Еще в 1930-х годах покойный президент Рузвельт ввел радикально новый вид экономической политики - \"Новый курс.\" С тех пор она творит чудеса, и в наших интересах продолжать политику Нового курса."
 USA_Rocket_Advancements: "Ракетное продвижение"
 USA_Rocket_Advancements_desc: "Нам необходимо активизировать наши исследования в области разработки и проектирования ракет. Это важная область исследований, и мы не можем допустить, чтобы наши исследования отставали от советских. "
 USA_Suez_Crisis: "Суэцкий кризис"
 USA_Suez_Crisis_desc: "Египет национализировал Суэцкий канал и угрожает израильским линиям снабжения и морским путям. Израиль, Великобритания и Франция планируют контрнаступление. Кого мы должны поддержать - Израиль или Египет - или лучше затаиться и наблюдать за развитием событий?"
 USA_Formosa_Decleration: "Формозская декларация"
 USA_Formosa_Decleration_desc: "Как раз когда все начало успокаиваться, КНР начала совершать рейды на острова в Тайваньском проливе. Нам необходимо заверить националистов, что мы встанем на их защиту в случае ухудшения военных действий, а также предоставить президенту конституционные полномочия для этого."
 USA_Develop_Taiwanese_Industry: "Развивать тайваньскую промышленность"
 USA_Develop_Taiwanese_Industry_desc: "Тайвань - лишь малая часть материкового Китая, но это все, что осталось от правительства Чан Кай-ши. Нам нужно максимально развить его промышленность, чтобы тайваньцы могли восстановить свою экономику после войны."
 USA_Strengthen_NATO_Members: "Укреплять членов НАТО"
 USA_Elections_of_1956: "Выборы 1956 года"
 USA_Creation_of_the_CIA: "Расширить сферу деятельности ЦРУ"
 USA_Creation_of_the_CIA_desc: "ЦРУ будет решающим оружием в войне за выживание демократии в обозримом будущем. Нам необходимо расширить его охват и возможности, чтобы оно могло лучше продвигать наши интересы по всему миру."
 USA_The_Free_Officier_Coup: "Переворот свободных офицеров"
 USA_The_Free_Officier_Coup_desc: "Гамель Абдель Насер и его приспешники свергли короля Фарука. Хорошо это или нет, еще предстоит выяснить. Но одно ясно. Мы можем либо признать Насера и его новый бренд панарабского национализма, либо отвергнуть его как крайний и укрепить против него окружающую территорию."
 USA_Arm_Jordan: "Вооружение Иордании"
 USA_Arm_Jordan_desc: "Король Хусейн все еще дружелюбен к нам - пока. Мы должны действовать и стабилизировать его режим, пока пропаганда Насера не вызвала новый переворот. Поддержка лояльных ему сил будет способствовать улучшению наших отношений и его положения."
 USA_An_Offer_to_Jordan: "Предложение Иордании"
 USA_Preparation_for_Honduras_Coup: "Подготовка к перевороту в Гондурасе"
 USA_Preparation_for_Honduras_Coup_desc: "В последнее время правительство Гондураса вызывает подозрения. Ходят слухи, что их трудовое законодательство становится более либеральным, и утверждения, что в правительство проникают сторонники коммунистов. В Гондурасе есть консервативные элементы, которые хотят избавиться от этого криптокоммунистического кабинета. Возможно, нам следует поддержать эту инициативу?"
 USA_Support_the_Pahlavi_Regime: "Развивать иранское оружейное производство"
 USA_Support_the_Pahlavi_Regime_desc: "Теперь, когда мы стабилизировали монархию Пехлеви, пришло время улучшить их возможности по производству оружия. Шах должен быть в состоянии содержать армию для защиты правительства, которое мы так старательно поддерживали."
 USA_undermine_Sukarno: "Подорвать Сукарно"
 USA_undermine_Sukarno_desc: "Возможно, Соекарно и освободил Индонезию от голландского колониализма, но его внешняя политика все больше совпадает с политикой Советского Союза и Красного Китая. Подрывая его правительство и сея недовольство среди индонезийской общественности, мы можем заставить его изменить курс."
 USA_Launch_Coup_in_Indonesia: "Запустить переворот в Индонезии"
 USA_Launch_Coup_in_Indonesia_desc: "Открытое дружелюбие индонезийского правительства к коммунистическому блоку нетерпимо, учитывая его стратегическое положение. Если Соекарно не удастся переубедить, нам нужно действовать сейчас и поддержать антикоммунистический переворот в Джакарте, пока мы не потеряли еще большую часть Азии из-за коммунистической угрозы."
 USA_Support_the_indonesian_uprising: "Поддерживать индонезийское восстание"
 USA_Support_the_indonesian_uprising_desc: "Социалистическая политика Соекарно, его гедонистическая личная жизнь и все более диктаторское правление не понравились индонезийскому населению, которое в значительной степени обнищало и было социально консервативным. Активы ЦРУ в регионе установили контакт с антикоммунистическими и исламскими повстанцами PRRI на Суматре. Даже если их восстание не увенчается успехом, оно все равно надолго свяжет руки Соекарно."
 USA_Operation_Condor: "Операция Кондор"
 USA_Operation_Condor_desc: "Правление Кастро на Кубе является живым доказательством того, что даже Америка не защищена от коммунизма. Череда правых военных переворотов в Южной Америке дала нам уникальную возможность как подавить распространение коммунизма на нашем заднем дворе, так и приобрести бесценных союзников капиталистов в регионе."
 USA_Mutual_Security_Act: "Акт о взаимной безопасности"
 USA_Mutual_Security_Act_desc: "Успехи плана Маршалла послужили образцом для будущих начинаний по оказанию внешней помощи. Печатая доллары для развития, технического содействия и военной помощи свободным странам по всему миру, мы можем превзойти коммунистическое влияние и получить новых ценных экономических и военных партнеров в глобальном партнерстве за демократию."
 USA_The_Southern_Cone: "Южный конус"
 USA_Assurances_in_Gran_Colombia: "Гарантии в Гран-Колумбии"
 USA_Coup_in_Brazil: "Переворот в Бразилии"
 USA_Coup_in_Brazil_desc: "Правительство [BRA.GetLeader] приняло опасный антиамериканский курс. ЦРУ установило контакты с диссидентствующими правыми военными, планирующими военный переворот, стремясь силой покончить с планами Москвы в отношении бразильского народа."
 USA_Support_Pro_American_Regimes: "Поддержка проамериканских режимов"
 USA_Support_Pro_American_Regimes_desc: "Латинская Америка является местом расположения множества проамериканских, антикоммунистических военных диктатур. Хотя мы можем находить их автократические или даже откровенно фашистские методы отвратительными, мы не можем отрицать, что они делают американские компании счастливыми и сохраняют целостность доктрины Монро. Перефразируя Рузвельта, можно сказать, что они сукины дети, но это наши сукины дети."
 USA_Support_Israeli_Weapons_Production: "Поддержка производства израильского оружия"
 USA_Support_Israeli_Weapons_Production_desc: "Израиль - один из немногих наших надежных союзников на Ближнем Востоке. Поддержка их растущей отечественной оружейной промышленности даст ЦАХАЛу средства для защиты наших израильских друзей от их многочисленных врагов и останется маяком ближневосточной демократии."
 USA_Support_Egypt_in_UNSC: "Поддерживать Египет в СБ ООН"
 USA_Support_Egypt_in_UNSC_desc: "Теперь, когда Египет одержал победу на земле, мы должны обеспечить нашему новому союзнику сохранение с таким трудом заработанной земли на переговорах в ООН. Это будет трудно, так как многие члены просто хотят сохранить статус-кво, особенно Британия и Франция, но мы сделаем все, что в наших силах."
 USA_Pressure_Britain: "Оказать давление на Британию."
 USA_Pressure_Britain_desc: "Британия должна признать, что мировой порядок постоянно меняется и что ее роль в нем постоянно уменьшается. Потеря канала - лишь следующий шаг в этом процессе. Мы должны активизировать наши дипломатические усилия, чтобы заставить их понять, что солнце действительно заходит за Британскую империю."
 USA_Adlai_Stevenson_II_56: "Адлай Стивенсон 1956"
 USA_Manufacturing_Subsidies: "Субсидии на производство"
 USA_Manufacturing_Subsidies_desc: "Промышленность Америки - это бьющееся сердце ее экономики. В условиях международной конкуренции субсидии в промышленном секторе проделают долгий путь к поддержанию производительности и конкурентоспособности американской экономики."
 USA_Post_War_China: "Послевоенный Китай"
 USA_Post_War_China_desc: "Последствия гражданской войны в Китае вызвали шок во всей Азии, и мы должны пересмотреть нашу позицию в отношении Китая."
 USA_Promote_De_Armament: "Содействовать деармизации"
 USA_Promote_De_Armament_desc: "Холодная война быстро переросла в гонку обычных и ядерных вооружений библейских масштабов. Хотя мы можем не во всем соглашаться с Москвой, ни одна из наших стран не выиграет от третьей мировой войны, и подписание некоторых предварительных соглашений о контроле над вооружениями с русскими могло бы в значительной степени предотвратить ядерный армагеддон."
 USA_intervene_in_indonesia: "Вмешаться в дела Индонезии"
 USA_intervene_in_indonesia_desc: "Хотя Сукарно и его коммунистические сторонники преуспевают в борьбе с голландской Ост-Индией, это не продлится долго. Мы должны вступить в войну и помешать его революции."
 USA_intervene_in_malaysia: "Вмешаться в Малайзию"
 USA_intervene_in_vietnam: "Вмешаться во Вьетнам"
 USA_intervene_in_vietnam_desc: "Похоже, французы не могут подавить небольшое коммунистическое восстание в Северном Вьетнаме. Неважно. Вступив в борьбу сами, мы сможем быстро, эффективно и, если понадобится, безжалостно подавить Хо Ши Мина."
 USA_Second_Chinese_Civil_War: "Вторая китайская гражданская война"
 USA_Second_Chinese_Civil_War_desc: "Гражданская война в Китае закончилась хрупким миром - националисты к югу от Великой стены, а коммунисты в Пекине и Маньчжурии. Теперь коммунисты сочли нужным отомстить КМТ раз и навсегда, угрожая нашим интересам в регионе. Мы должны вмешаться, пока не стало слишком поздно и уничтожить их."
 USA_The_Truman_Doctrine: "Доктрина Трумэна"
 USA_The_Truman_Doctrine_desc: "Доктрина Трумэна - это политика президента в отношении Советского Союза. Она гласит, что мы должны сдержать, остановить и победить распространение §RКоммунизма§! любой ценой, в любом месте и в любое время. Для этого мы должны защищать наших союзников, противостоять Советам, и, если необходимо, придерживаться моральной корректности, чтобы обеспечить §CДемократию§!, начиная с нашего дома и заканчивая Европой и Азией."
 USA_Landrum_Griffin_Act: "Закон Ландрума-Гриффина"
 USA_Landrum_Griffin_Act_desc: "Расследования Конгресса в отношении организованного труда выявили потрясающую тенденцию коррупции, рэкета и других неправомерных действий. Закон Ландрума-Гриффина установит надзор за определенной деятельностью профсоюзов, защитит демократические права профсоюзных работников внутри их профсоюза и обеспечит, чтобы профсоюзы снова стали ценным элементом нашей национальной экономики."
 USA_Communist_Control_Act: "Закон о коммунистическом контроле"
 USA_Communist_Control_Act_desc: "Закон о контроле над коммунистами объявит вне закона Коммунистическую партию Соединенных Штатов Америки (КПСС) и криминализирует членство в коммунистических организациях или их поддержку. Члены КПСС должны будут зарегистрироваться у генерального прокурора, иначе им грозит штраф в размере 10 000 долларов и тюремное заключение сроком до пяти лет."
 USA_Domino_Theory: "Теория домино"
 USA_Domino_Theory_desc: "Президент Эйзенхауэр считает, что распространение коммунизма подобно падающему домино - как только падает одно, все остальные домино на его пути падают вместе с ним. Вмешиваясь, чтобы остановить коммунистические революции, особенно в Азии, прежде чем они смогут закрепиться у власти, мы можем предотвратить распространение международного коммунизма."
 USA_Found_ARPA: "Найдено ARPA"
 USA_Found_ARPA_desc: "Запуск русскими Спутника выявил критическую необходимость догнать и превзойти Советы, когда дело доходит до технологий. Агентство перспективных исследовательских проектов объединит наши лучшие умы из научного и инженерного сообществ для создания передовых оборонных технологий с будущим применением в высокотехнологичном и гражданском секторах."
 USA_Internal_Affairs: "Внутренние дела"
 USA_Internal_Affairs_desc: "Мы должны тесно сотрудничать с ФБР в расследовании коммунистической деятельности, особенно в политической, культурной и трудовой сферах. Агенты Москвы должны быть найдены и преданы суду."
 USA_Elections_of_1952: "Выборы 1952 года быстро приближаются, и скоро американцам предстоит выбрать своего президента на следующие четыре года."
 USA_Estes_Kefauver_56: "Эстес Кефаувер 1956"
 USA_Estes_Kefauver_56_desc: "Инаугурация президента Кефаувера означает новую повестку дня для Америки. У президента есть прогрессивная программа для Америки, и он может рассчитывать на поддержку демократов Нового курса для улучшения повседневной жизни американцев, борьбы с преступностью и коррупцией и обеспечения того, чтобы наследие Рузвельта осталось для будущих поколений."
 USA_Atomic_Investments: "Атомные инвестиции"
 USA_Atomic_Investments_desc: "Сила атома представляет собой не только потенциал для разрушения, но и для прогресса. Инвестиции в атомные электростанции и атомные исследования обеспечат миллионы американцев дешевой, чистой энергией на долгие годы. Наши ядерные реакторы будут предметом зависти всего мира."
 USA_Criminal_Justice_Reforms: "Реформы уголовного правосудия"
 USA_Criminal_Justice_Reforms_desc: "Президент Кефаувер давно имеет репутацию борца с преступностью, наиболее известен как глава Комитета Кефаувера, который раскрыл истинные масштабы преступлений мафии. Теперь, стоя у руля нации, президент позаботится о том, чтобы мафиози и злоумышленники всех мастей боялись закона. Никогда больше мафия не будет подкупать их, чтобы избежать тюрьмы."
 USA_Support_The_British_Empire: "Поддержка Британской империи"
 USA_Support_The_British_Empire_desc: "Теперь, когда MLA побеждена, мы можем сосредоточиться на поддержке Британской империи в ее попытке сохранить свои колонии, которыми она все еще владеет, будь то в Тихом океане, Атлантике или Африке."
 USA_Stabilize_European_Empires: "Стабилизировать европейские империи"
 USA_Stabilize_European_Empires_desc: "Со всеми революциями на колониальной территории, стабильность по всей Европе очень низкая. Низкая стабильность и высокие беспорядки порождают поддержку коммунистов, чего быть не может. Мы должны помочь этим странам восстановиться после войн."
 USA_Supply_European_Empires: "Снабжать европейские империи"
 USA_Supply_European_Empires_desc: "Одна из причин успеха этих восстаний заключается в том, что этим странам очень трудно снабжать свою полицию и вооруженные силы на землях, столь удаленных от их собственных. Увеличив количество товаров и оружия, мы можем решить эту проблему."
 USA_support_for_south_vietnam: "Поддержка Южного Вьетнама"
 USA_support_for_south_vietnam_desc: "Еще одна страна Юго-Восточной Азии стала красной, но мы все еще надеемся на государство Вьетнам. Поддерживая его оружием и экономической помощью, мы можем укрепить его для неизбежного столкновения с северным соседом."
 USA_Advisors_to_South_Vietnam: "Советники Южного Вьетнама"
 USA_Advisors_to_South_Vietnam_desc: "Просто послать АРВН оружие недостаточно. Мы должны послать военных советников, чтобы обучить их войска тактике, а офицеров - стратегии, чтобы у них был шанс бороться с Хо Ши Мином и его партизанами."
 USA_Support_India: "Поддерживать Индию"
 USA_Support_India_desc: "Индия и Пакистан враждуют друг с другом с тех пор, как ушли британцы. Очевидно, что мы не можем поддерживать их обоих, и поддержка Индии - лучший выбор."
 USA_support_for_India: "Оружие для Индии"
 USA_support_for_India_desc: "После публичного заявления о нашей поддержке, нам нужно сделать что-то физическое, чтобы защитить положение индийцев. Снабжение их армии сделает это."
 USA_Advisors_to_India: "Советники Индии"
 USA_Advisors_to_India_desc: "Теперь, когда у их войск есть оружие, следующим шагом для нас будет подготовка индийских офицеров для руководства ими, а также обучение всех, как использовать их новые инструменты."
 USA_Decolonization_of_Africa: "Деколонизация Африки"
 USA_Decolonization_of_Africa_desc: "Африка была местом самых ужасных колониальных преступлений, и до сих пор является самым порабощенным из всех континентов. Пришло время для Британии, Франции и Бельгии отказаться от хватки своих бывших колоний и оставить Африку африканцам."
 USA_Algerian_war_of_independence: "Алжирская война за независимость"
 USA_Algerian_war_of_independence_desc: "Устав от притеснений и избиений со стороны французского правительства, алжирский народ восстал. Хотя мы не будем вмешиваться напрямую, нам все равно нужно следить за ситуацией, чтобы она не вышла из-под контроля."
 USA_Peace_in_Algeria: "Мир в Алжире"
 USA_Peace_in_Algeria_desc: "Эта война длится уже достаточно долго. Франция должна признать, что колониальная эпоха давно в прошлом, и мы должны оказать на нее давление, чтобы она поняла это. Алжир наконец-то получит свою независимость."
 USA_Return_Treaty_Ports_to_the_Peoples_Republic_of_China: "Вернуть договорные порты КНР"
 USA_Return_Treaty_Ports_to_the_Peoples_Republic_of_China_desc: "Несмотря на наше непризнание коммунистического Китая, правительство председателя [PRC.GetLeader] очень настаивает на том, чтобы европейские договорные порты были переданы под его контроль. Оказывая давление на Британию и Португалию, чтобы они передали Гонконг и Макао КНР, мы можем снизить напряженность в регионе и сохранить приверженность антиколониализму."
 USA_Return_Treaty_Ports_to_the_Republic_of_China: "Вернуть договорные порты КМТ"
 USA_Return_Treaty_Ports_to_the_Republic_of_China_desc: "Китайская Республика - ценный союзник США. Возможно, мы сможем вознаградить их лояльность, оказав давление на Британию и Португалию, чтобы они вернули Гонконг и Макао под свой контроль. В конце концов, мы все в одной команде, не так ли?"
 USA_Support_Pakistan: "Поддерживать Пакистан"
 USA_Support_Pakistan_desc: "Индия и Пакистан враждуют друг с другом с тех пор, как ушли британцы. Очевидно, что мы не можем поддерживать их обоих, и поддержка Пакистана - лучший выбор."
 USA_support_for_Pakistan: "Оружие для Пакистана"
 USA_support_for_Pakistan_desc: "После публичного заявления о нашей поддержке, нам нужно сделать что-то физическое, чтобы защитить положение пакистанцев. Снабжение их армии поможет это сделать."
 USA_Advisors_to_Pakistan: "Советники Пакистана"
 USA_Advisors_to_Pakistan_desc: "Теперь, когда у их войск есть оружие, следующим шагом для нас будет подготовка индийских офицеров для руководства ими, а также обучение всех, как использовать их новые инструменты."
 USA_Department_of_Defense: "Министерство обороны"
 USA_Department_of_Defense_desc: "Поскольку ситуация во всем мире выглядит все более напряженной, пришло время пересмотреть наши вооруженные силы, сосредоточить наши исследования и улучшить наши доктрины. Это будет иметь решающее значение в предстоящем столкновении с коммунизмом."
 USA_Department_of_the_Navy: "Министерство военно-морского флота"
 USA_Department_of_the_Navy_desc: "Военно-морской флот Соединенных Штатов - это то, как мы традиционно проецируем нашу силу и присутствие по всему миру. Однако с новыми достижениями в воздушных и ракетных технологиях нам нужно решить, сохранит ли он эту роль или будет отодвинут в сторону."
 USA_Department_of_the_Airforce: "Министерство военно-воздушных сил"
 USA_Department_of_the_Airforce_desc: "ВВС - самый новый род наших вооруженных сил, и в некотором смысле самый важный. Последняя мировая война доказала, насколько незаменимы воздушное прикрытие и поддержка, а новые дальние бомбардировщики с каждым днем увеличивают наши ударные возможности."
 USA_Fighter_focus: "Разработки истребителей"
 USA_Fighter_focus_desc: "Исследуя и производя новые варианты и конструкции истребителей, мы можем улучшить способность наших ВВС обеспечить чистое и дружелюбное небо для наших наземных войск."
 USA_Bomber_focus: "Разработки бомбардировщиков"
 USA_Bomber_focus_desc: "Исследуя и производя новые варианты и конструкции бомбардировщиков, мы можем улучшить способность наших ВВС выполнять дальние удары и стратегические бомбардировки."
 USA_Respond_to_Puerto_Rican_Nationalism: "Подавить пуэрториканский национализм"
 USA_Respond_to_Puerto_Rican_Nationalism_desc: "Пуэрто-Рико - относительно новое присоединение к США, и языковые, культурные и расовые барьеры привели к тому, что некоторые пуэрториканцы предпринимают насильственные действия против нашего контроля над островом. Мы не можем допустить, чтобы территориальная целостность Соединенных Штатов или пуэрториканского народа оказалась под угрозой из-за нескольких плохих актеров."
 USA_Puerto_Rican_Statehood: "Пуэрто-риканская государственность"
 USA_Puerto_Rican_Statehood_desc: "Многие пуэрториканцы годами добивались статуса штата. Возможно, полностью приняв их в Союз, мы сможем успокоить пуэрториканских националистов и наверняка заработаем еще несколько голосов выборщиков на следующих президентских выборах."
 USA_The_Korean_War: "Корейская война"
 USA_The_Korean_War_desc: "Началась война! Северная и Южная Корея ведут смертельную борьбу, и только от нас зависит, чтобы силы демократии одержали победу. Мы должны сделать все возможное, чтобы помочь Сингману Ри и его правительству, будь то через ленд-лиз или добровольцев."
 USA_Turkish_Straits_Crisis: "Кризис в турецких проливах"
 USA_Turkish_Straits_Crisis_desc: "Советы оказывают давление на турок, чтобы те передали проливы и дали им доступ к Средиземному морю. Это стало бы серьезным ударом по позициям НАТО в Европе, и этого нельзя допустить. Хотя Турция придерживается нейтральной политики, мы должны дать туркам понять, что мы их прикрываем. СССР должен быть сдержан."
 USA_economic_aid_to_turkey: "Экономическая помощь Турции"
 USA_economic_aid_to_turkey_desc: "Это будет не последний раз, когда Советы предпримут попытку захватить проливы или Турцию. Развивая экономику Турции и предлагая им финансовую поддержку, мы можем гарантировать, что они смогут защитить себя лучше, чем в этот раз."
 USA_Containment: "Сдерживание"
 USA_Containment_desc: "Мы не можем напрямую вовлечь Советский Союз в крупномасштабный конфликт, но мы можем, по крайней мере, гарантировать, что у нас есть средства, чтобы создать серьезную угрозу для них, если мы будем вынуждены это сделать. Увеличение нашего военного производства и ракетных исследований поможет нам в этом."
 USA_Mobilize_Against_the_Soviets: "Увеличить производство оружия"
 USA_Mobilize_Against_the_Soviets_desc: "У нас относительно большие вооруженные силы, но они меркнут по сравнению с могучей Красной Армией. Нам нужно увеличить производство оружия, а также других военных машин, чтобы попытаться догнать Советы на земле."
 USA_An_Arms_Race: "Гонка вооружений"
 USA_An_Arms_Race_desc: "Если догнать Советы на земле окажется невозможным, мы должны обеспечить себе преимущество в небе и верхних слоях атмосферы. Увеличение исследований в области ракетной техники поможет в этом."
 USA_Decleration_of_Conscience: "Декларация совести"
 USA_Decleration_of_Conscience_desc: "Недавно сенатор Маргарет Чейз Смит (штат Мэн) произнесла речь, в которой критиковала правительство и его тактику, используемую на слушаниях Маккарти. Она не назвала никого по имени, но нетрудно понять, к чему она клонит. Маккарти должен уйти."
 USA_The_Hollywood_Witch_Hunt: "Охота на ведьм в Голливуде"
 USA_The_Hollywood_Witch_Hunt_desc: "Ходят слухи, что в Голливуде полно отвратительных коммунистов! Красные промывают мозги нашим детям под видом милых и развлекательных фильмов! Мы должны обнаружить этих предателей и отсечь их, пока они не настроили нашу собственную драгоценную молодежь против славы свободы! Вперед, за демократию!"
 USA_Fall_of_the_Mainland: "Падение китайского материка"
 USA_Fall_of_the_Mainland_desc: "Китайская Народная Республика победила в гражданской войне в Китае, но это не значит, что все потеряно. Признав националистическое правительство на Тайване, мы можем обеспечить его выживание, а также сохранить плацдарм в Юго-Восточном Китайском море."
 USA_Peace_Fails: "Мир не удался"
 USA_Peace_Succeeds: "Мир удался"
 USA_Support_Israel: "Поддерживаю Израиль"
 USA_Support_Israel_desc: "Израиль был дружелюбен к нам с момента обретения независимости в 1948 году. Наши союзники в регионе немногочисленны, и мы были бы глупцами, если бы оттолкнули стабильную демократию, которая тянется к западным державам. В Америке также очень большая еврейская дисапора, и они, несомненно, оценят нашу поддержку своих еврейских братьев в сезон выборов."
 USA_Support_Egypt: "Поддерживать Египет"
 USA_Support_Egypt_desc: "Пришло время поддержать новую лошадь на Ближнем Востоке. Насер харизматичен и влиятелен в арабском мире, а нам нужна его нефть и доступ к земле. Кроме того, хорошо иметь более агрессивно настроенного союзника, который не боится действовать, в отличие от наших европейских товарищей."
 USA_Ignore_the_Crisis: "Игнорировать кризис"
 USA_Ignore_the_Crisis_desc: "Суэц далеко. Кроме того, наше судоходство не затронуто всей этой безумной чехардой. Пусть обе стороны разбираются между собой, а мы будем наблюдать со стороны, как это делают Советы. У нас есть более важные дела, и мы должны сосредоточиться на них."
 USA_Advance_the_American_Nuclear_Program: "Продвигать американскую ядерную программу"
 USA_Advance_the_American_Nuclear_Program_desc: "Очевидно, что ядерное оружие будет играть огромную роль в этот новый день и век. Хотя мы все еще впереди всех в том, что касается исследований, мы не можем позволить себе самоуспокоиться в этой области."
 USA_Hydrogen_Bomb_Test: "Испытание водородной бомбы"
 USA_Hydrogen_Bomb_Test_desc: "Атомная бомба - самое мощное оружие, известное человеку, но наши ученые разработали еще более разрушительное оружие, основанное на ядерном синтезе водорода. Не дай Бог, чтобы нам когда-нибудь пришлось его применить, но сама угроза H-бомбы, в случае успеха, может удержать Москву от любых идей о войне."
 USA_Further_Nuclear_Tests: "Дальнейшие ядерные испытания"
 USA_Further_Nuclear_Tests_desc: "Мы не можем почивать на лаврах после нашего последнего ядерного успеха. Советы не прекращают свои исследования, так что и мы не остановимся."
 USA_Create_the_First_Nuclear_Submarine: "Разработать первую атомную подводную лодку."
 USA_Create_the_First_Nuclear_Submarine_desc: "Разработка ядерной подводной лодки означает, что мы сможем размещать и запускать ядерные ракеты практически из любой точки мира. Это увеличит наш ударный потенциал и способность угрожать СССР."
 USA_eisenhower_presidency_Copy: "Эйзенхауэр 1956"
 USA_eisenhower_presidency_Copy_desc: "Американский генерал одержал победу, выиграв еще один президентский срок. Президент Эйзенхауэр надеется продуктивно использовать следующие четыре года, обеспечивая стабильность и процветание Америки внутри страны и стойкость перед угрозой коммунизма за рубежом. Слава вождю!"
 USA_Support_Anti_Communist_Groups: "Поддерживать антикоммунистические группы"
 USA_Support_Anti_Communist_Groups_desc: "Коммунизм - это само определение тирании. Мы должны поддерживать тех честных людей, которые пытаются освободить свои народы от коммунизма, где бы в мире они ни находились. Коммунистический гнет не может вечно сдерживать мир."
 USA_Rid_the_World_Of_Communism: "Очистить мир от коммунизма"
 USA_Rid_the_World_Of_Communism_desc: "Недостаточно просто сдерживать коммунистический блок. Подобно тому, как раковую опухоль необходимо вырезать, пока она не пустила метастазы и не убила весь организм, мы должны работать над тем, чтобы активно сворачивать распространение коммунизма. Кусочек за кусочком мы будем освобождать народы мира из лап Москвы, пока свобода не зазвенит даже над Кремлем."
 USA_Bolster_the_Arms_Industry: "Укрепить оружейную промышленность"
 USA_Bolster_the_Arms_Industry_desc: "Оружейная промышленность становится все более ключевым компонентом нашей экономики и нашей обороны от красных. Новые контракты с американскими оборонными компаниями могут означать только хорошее, поскольку мы готовимся к защите Леди Свободы."
 USA_Continue_New_Deal_Economic_Policies: "Продолжить экономическую политику Нового курса"
 USA_Continue_New_Deal_Economic_Policies_desc: "Новый курс никогда не был очень популярен в GOP. К сожалению, это сделало GOP не очень популярной в Америке. Эйзенхауэр признает, что, если убрать немного жира, Новый курс может продолжать делать много хорошего для многих людей. Зачем разрушать хорошее?"
 USA_Continued_Congressional_Cooperation: "Продолжение сотрудничества с Конгрессом"
 USA_Continued_Congressional_Cooperation_desc: "Америка - не диктатура, и каким бы престижным ни был пост президента, он все равно должен иметь рабочие отношения с Конгрессом, чтобы шестеренки правительства двигались."
 USA_Conitinue_Hard_Liner_Stance_on_Communism: "Продолжить жесткую позицию против коммунизма."
 USA_Conitinue_Hard_Liner_Stance_on_Communism_desc: "Советский Союз, похоже, уверен, что сможет заставить нас подчиниться, что однажды мы просто сдадимся и позволим коммунизму управлять нашей жизнью. Как они ошибаются. Мы не намерены отступать. Москва должна научиться уважать свободный мир, иначе они получат те же уроки, которые мы преподали нацистам и императорской Японии."
 USA_These_Years_Of_Progress: "Эти годы прогресса"
 USA_These_Years_Of_Progress_desc: "За последние несколько лет Америка добилась огромных успехов в промышленном, научном, культурном и социальном прогрессе. Мы еще раз доказали, что для дела свободы нет предела, а наш народ сплочен и процветает как никогда. Американский путь - это действительно лучший путь. Желаю еще долгих лет успеха!."
 USA_The_Constitutional_Crisis: "Конституционный кризис"
 USA_The_Constitutional_Crisis_desc: "Увольнение президентом Трумэном генерала Макартура вызвало массовую реакцию среди его многочисленных сторонников в правых политических кругах, которые считают его антикоммунистическим крестоносцем. Более того, они утверждают, что увольнение Макартура по явно политическим причинам не входит в полномочия президента, и угрожают объявить ему импичмент за злоупотребление исполнительной властью."
 USA_Impeach_Truman: "Импичмент Трумэну"
 USA_Impeach_Truman_desc: "Злоупотребление Трумэном исполнительной властью, в последнее время с его увольнением Макартура, представляет собой тревожную тенденцию к диктатуре исполнительной власти. Пока мы боремся с коммунизмом за рубежом, мы также должны бороться с этой тиранией внутри страны единственным возможным способом - путем импичмента Трумэна и попытки сместить этого диктатора с поста раз и навсегда!."
 USA_Continue_Reforms: "Продолжение реформ"
 USA_Continue_Reforms_desc: "Марш прогресса не должен останавливаться. Простой человек требует перемен, и он их получит. Давайте не оставим никого позади."
 USA_Support_The_Dutch_Empire: "Поддерживать Голландскую империю"
 USA_Support_The_Dutch_Empire_desc: "Единственная причина, по которой Сукарно смог восстать в первую очередь, заключалась в слабости Голландской империи. Мы должны оказать ей экономическую поддержку, чтобы это не повторилось."
 USA_Support_The_French_Empire: "Поддерживать Французскую империю"
 USA_Support_The_French_Empire_desc: "Франция никогда не была стабильной (во всяком случае, после Наполеона), и все эти волнения в ее колониях не способствуют этому. Мы должны сделать все возможное, чтобы помочь их восстановлению."
 USA_Abstain_from_the_unsc: "Воздержаться от участия в СБ ООН"
 USA_Abstain_from_the_unsc_desc: "Поскольку мы до сих пор держались в стороне от конфликта, имеет смысл сделать то же самое в СБ ООН. Пусть другие державы разбираются с этим, это не наша проблема. В конечном счете, пока у Советов нет Суэца, нам нет до этого никакого дела."
 USA_The_Colonization_Question: "Вопрос о колонизации"
 USA_The_Colonization_Question_desc: "По мере того, как в регионах, все еще оккупированных европейскими державами старого мира, растет число националистических движений и настроений, нам пора решить, где мы стоим в этом вопросе. Должны ли мы поддержать наших союзников по НАТО и сохранить их империи, даже с помощью силы, или лучше пустить все на самотек и покончить с колонизацией здесь и сейчас?"
 USA_Support_Israel_in_UNSC: "Поддерживать Израиль в СБ ООН"
 USA_Support_Israel_in_UNSC_desc: "Израиль быстро стал одним из наших самых надежных партнеров на Ближнем Востоке. Мы можем отплатить за это, обеспечив, чтобы любая резолюция ООН, направленная против наших друзей в Тель-Авиве, столкнулась с незамедлительным вето."
 USA_Increase_Encryption: "Повысить стандарты шифрования"
 USA_Increase_Encryption_desc: "Один из способов замедлить советских оперативников и шпионские меры - это повысить наши стандарты шифрования. Это сделает все наши закодированные и секретные сообщения более трудными для взлома."
 USA_A_Response_to_the_KGB: "Ответ КГБ"
 USA_A_Response_to_the_KGB_desc: "КГБ активизировал свои операции и подрывную деятельность по всему миру. Они пытаются распространить коммунизм повсюду. Мы должны что-то с этим сделать!"
 USA_Improved_Spying_Techniques: "Улучшенные методы шпионажа"
 USA_Improved_Spying_Techniques_desc: "Теперь, когда мы приняли некоторые превентивные меры, пришло время перейти к пресловутой атаке. Мы не будем напрямую вредить СССР, но с помощью новых методов наших агентов мы скоро будем знать все, что они замышляют."
 USA_Send_advisors_to_Vietnam: "Отправить советников во Вьетнам"
 USA_Send_advisors_to_Vietnam_desc: "Южный Вьетнам изолирован от коммунистической угрозы на севере. Мы не можем позволить Москве и Пекину обеспечить свои интересы в Индокитае. Мы пошлем советников, чтобы помочь Южному Вьетнаму развить экономику и вооруженные силы до западных стандартов."
 civilian_preparations: "Гражданские приготовления"
 constitutional_crisis: "Constitutional Crisis"
 increased_encryption: "Повышение уровня шифрования"
 improved_espionage: "Улучшенный шпионаж"
 anti_soviet_mobilization: "Антисоветская мобилизация"
 ARPA: "АРПА"
 USA_red_scare: "Красный испуг"
 Domino_Theory: "Теория домино"
 USA_korean_tensions: "Корейская напряженность"
 USA_defensive_protocol: "Корейский оборонительный протокол"
 USA_offensive_protocol: "Корейский наступательный протокол"
 USA_a_modern_airforce1_desc: "ВВС США - лучшие военно-воздушные силы в мире, и мы должны убедиться, что они такими и останутся. Мы будем модернизировать и реформировать наши ВВС, чтобы сохранить это ключевое преимущество над Советами."
 USA_enable_the_us_navy1: "Включить ВМС США"
 USA_enable_the_us_navy1_desc: "Наш флот - самая важная часть наших вооруженных сил. Без военно-морской мощи Америка не сможет проецировать свою военную мощь далеко от своих границ, и у нас будет очень мало способов помешать русским в их стремлении к мировому господству. Мы должны инвестировать и расширять военно-морской флот и наш судостроительный потенциал."
 USA_mothball_the_us_navy: "Законсервировать ВМС США"
 USA_mothball_the_us_navy_desc: "Военно-морской флот составляет огромный кусок нашего огромного военного бюджета. Было бы разумнее сократить наш флот и вместо этого сосредоточиться на более экономически эффективных средствах контроля над волнами."
 USA_american_commandos1_desc: "Сила американской армии заключается в ее спецназе. Мы усилим требования к подготовке наших десантников, морских пехотинцев и альпинистских бригад, чтобы они оставались высококачественной боевой силой."
 USA_the_marshall_plan1_desc: "Опыт показывает, что экстремизм пускает корни во времена политического и экономического хаоса - такого, в каком сейчас оказалась Европа. Мы должны обеспечить массивные инвестиции денег и материалов для восстановления Европы, чтобы не получилось так, что они будут искать спасения у Сталина или другого Гитлера. "
 USA_foriegn_affairs_desc: "Как новый лидер свободного мира и основной защитник от мирового коммунизма, мы имеем много областей, которые требуют нашего внимания. Мы должны решить, в какие области вмешаться и в какой степени."
 USA_mccarthy_presidency_desc: "В шокирующем повороте Джозеф Маккарти победил на президентских выборах в США и готов принять ответные меры против коммунистов, как реальных, так и воображаемых."
 USA_reaction_to_mccarthyism_desc: "Сенатор Джозеф Маккарти выдвинул шокирующее обвинение - у него есть список из более чем 200 сотрудников Государственного департамента, которые являются членами Коммунистической партии! Этот сенатор из Висконсина вызывает бурю возмущения и паранойи по всей стране. Мы должны решить, как нам справиться с этой бурей."
 USA_aid_roc_desc: "Республиканское правительство Чан Кай-ши - наш твердый союзник на Востоке, но они истощены японским вторжением, произошедшим несколько лет назад. Если мы не поможем им, то они почти наверняка падут перед коммунистическим режимом Мао Цзэдуна, а вместе с ними начнет падать и домино в Восточной Азии."
 USA_advisors_roc_desc: "Снабжать Гоминьдан оружием и техникой недостаточно, если они не знают, как лучше их использовать. Китайцы смогут воспользоваться мудрыми советами наших величайших военных умов, которые, несомненно, помогут повернуть Красный прилив в сторону."
 USA_declare_war_on_prc_desc: "Хотя до сих пор мы избегали прямых действий в Китае, опасаясь советских репрессий, мы больше не можем безучастно наблюдать, как Азия погружается в тень Сталина. Президент решил объявить войну Мао и его ужасному режиму с целью стабилизации и реорганизации Северного Китая до тех пор, пока он не будет передан ответственному, демократическому китайскому государству."
 USA_cut_off_roc_desc: "Гоминьдан - это беспорядок - коррумпированный, недемократический и вовлеченный в безнадежную войну с коммунистами. Ни морально, ни разумно продолжать поддерживать режим Кай-Шека."
 USA_recognize_prc_desc: "Как бы это ни было неприятно, мы не можем отрицать, что Мао Цзэдун выиграл войну за господство над Китаем. Мы должны пойти на признание КНР как законного правительства Китая в надежде, что мы сможем оспорить влияние Москвы на них."
 USA_anti_soviet_alliance_desc: "Хотя Мао является марксистом, он довольно неортодоксален, и между Пекином и Кремлем существует большая напряженность. Если мы подойдем к КНР с достаточным тактом, мы сможем убедить Мао подписать с нами союз против Сталина, несмотря на наши идеологические разногласия."
 USA_restart_marshall_mission_desc: "В 1945 году мы послали генерала Джорджа Маршалла на переговоры о мире между коммунистическим и националистическим правительствами в Китае. Коррупция и свинство обоих правительств привели к тому, что эта миссия провалилась, и Маршалл ушел в 1947 году. Мы должны удвоить наши усилия и послать еще одну миссию ради мира, стабильности и безопасности против Советов."
 USA_press_for_peace_desc: "Мы не были достаточно настойчивы во время миссии Маршалла в 1945-1947 годах. Мы должны полностью посвятить себя дипломатическому давлению на обе стороны, чтобы они согласились на прекращение огня."
 USA_push_for_yangtze_border_desc: "Наконец-то наши дипломаты продвинулись вперед и нашли решение, которое может быть приемлемым для обеих сторон. Мы попытаемся провести разделительную линию между двумя Китаями на исторической реке Янцзы. Возможно, это наконец-то положит конец кровопролитию."
 USA_compromise_with_congress_desc: "Хотя, конечно, было бы предпочтительнее принимать все законы без сопротивления, президент должен понимать, что в условиях демократии не все его предложения пройдут. Мы должны быть более готовы идти на компромисс с Конгрессом, даже если он вынуждает нас смягчать наши предложения и не дает нам делать то, что мы хотим. В конце концов, они тоже представляют американский народ."
 USA_the_bully_pulpit_desc: "Конгресс - это помеха, постоянно препятствующая усилиям президента по проведению его мудрых реформ и мешающая его воле на каждом шагу. Мы должны подорвать их легитимность, убедив американский народ, что Конгресс несправедливо препятствует усилиям президента, направленным на помощь им."
 USA_korea_desc: "Корейский полуостров является ключевым стратегическим активом. Из-за своей близости к Китаю и Японии он будет представлять собой жизненно важный плацдарм и форпост для того, кто будет его контролировать. Мы не можем допустить, чтобы он попал в руки коммунистов, как ради корейского народа, так и ради безопасности наших союзников в Восточной Азии."
 USA_fair_society_desc: "Мы должны обеспечить справедливое и равное общество для всех американцев."
 USA_truman_assasination_desc: "Трумэн должен быть убран с дороги, любыми средствами."
 USA_expansion_of_social_security_desc: "Мы уже тратим миллионы долларов ежегодно на дорогостоящие и рискованные проекты по сдерживанию распространения мирового коммунизма, в то время как каждый день миллионы американцев страдают от потери доходов, вызванных болезнями, безработицей и старостью. Эти огромные богатства лучше потратить на улучшение качества жизни наших граждан."
 USA_crack_down_on_strikes_desc: "Если во время войны профсоюзы обещали не бастовать, чтобы обеспечить поражение нацизма, то теперь это обещание истекло, и они снова начинают создавать проблемы. Мы должны занять более жесткую позицию в отношении подрывных забастовок, чтобы профсоюзам было труднее нарушать работу американской промышленности и препятствовать росту коммунистической инфильтрации в нашей стране."
 USA_end_military_segregation_desc: "В настоящее время в вооруженных силах США допускается, чтобы подразделения были только однородного расового происхождения. Это не только несправедливо, но и приводит к напряженности в вооруженных силах и к трудностям в поиске подходящего человека на нужную роль. Мы должны положить конец этой практике и интегрировать армию, как по моральным, так и по практическим причинам."
 USA_continue_price_controls_desc: "Во время войны мы установили строгий контроль над тем, сколько можно взимать за определенные товары и услуги, чтобы привести нашу экономику в состояние готовности к войне. Экономисты настаивают на отмене этих ограничений сейчас, когда война закончилась, утверждая, что они приводят к дефициту, но мы знаем лучше. Мы будем продолжать государственный контроль над жизненно важными отраслями."
 USA_repeal_taft_hartley_desc: "Закон 1947 года об отношениях между руководством и трудовым коллективом, более известный как закон Тафта-Хартли, накладывает несправедливые ограничения на то, что профсоюзные работники могут законно делать для защиты своих прав. Мы должны отменить этот несправедливый закон, чтобы сохранить права наших людей."
 USA_brennan_plan_desc: "Во время войны союзники испытывали большую потребность в продовольствии, и мы платили фермерам намного выше рыночных ставок, чтобы они производили как можно больше. Однако после окончания войны тысячи фермеров оказались с кучами продовольствия, которое они не могут продать. Мы продадим эти излишки по рыночным ценам, а затем выплатим фермерам компенсацию за то, что они больше не могут продавать продукты по ценам военного времени."
 USA_housing_act_of_1949_desc: "США сталкиваются с огромной нехваткой жилья, и многие американцы ютятся в пригородных трущобах. Этого нельзя допустить - мы введем масштабную программу по ликвидации трущоб, строительству доступного жилья и обеспечению ипотечного страхования, чтобы каждый американец мог иметь хороший дом."
 USA_increase_min_wage_desc: "Эта администрация твердо убеждена, что базовая социальная справедливость требует, чтобы американский рабочий имел право на справедливую и разумную плату за свой труд. Мы увеличим минимальную заработную плату, чтобы обеспечить нашим рабочим хотя бы минимальный уровень экономической достаточности и безопасности."
 USA_political_freedom_of_conscience_desc: "Это фундаментальное право каждого человека - иметь возможность не только придерживаться, но и публично выражать свои искренние и искренние убеждения, не опасаясь общественного преследования. Именно эта великая свобода защищает нашу Республику от падения в тиранию, и мы должны убедиться, что публично закрепили этот принцип в наших заявлениях и усилиях."
 USA_condemn_mccarthy_as_insane_desc: "Джозеф Маккарти - это опасная и непостоянная сила, свободная пушка, побочный ущерб которой невозможно предсказать. Мы должны публично осудить его в попытке положить конец его самодовольному и контрпродуктивному крестовому походу против членов нашего правительства."
 USA_discredit_eisenhower_desc: "Дуайт. Д. Эйзенхауэр, хотя и является уважаемым героем войны, не поддается нашим планам на будущее. Мы должны очернить его имя, чтобы устранить его как политическую угрозу."
 USA_preserve_colonial_empires_desc: "Хотя мы всегда считали себя антиколониалистами, нам следует избегать слишком сильного давления на наших колониальных союзников. Франция и Британия - наши жизненно важные союзники в борьбе против Советов, и толкать их к отказу от своих колониальных империй будет только ослаблять и злить их, возможно, подталкивая их в объятия Сталина."
 USA_arm_imperialist_vietnam_desc: "Хо Ши Мин и его коммунистические революционеры разжигают проблемы во Вьетнаме. Мы должны послать оружие и материалы вьетнамскому правительству, чтобы помочь им подавить огонь революции."
 USA_vietnam_advisors_desc: "Вьетнамское правительство страдает от недостатка опытных военных советников для обучения своей армии. Мы должны послать им советников для обучения их офицеров и помочь им сохранить собственную безопасность."
 USA_operation_vulture_desc: "Французский гарнизон в Дьенбьенфу был окружен солдатами Вьетминя. Они, несомненно, будут убиты, если никто не предпримет действий для их спасения. Мы пошлем им поддержку в виде волн бомбардировщиков B-29. Мы даже думаем послать ядерные бомбы на помощь французам..."
 USA_eisenhower_doctrine_desc: "Ближний Восток - заманчивая цель для мирового коммунизма, поскольку этот регион полон недовольства и богат жизненно важными нефтяными ресурсами, которые нужны и нам, и свободному миру. Мы должны дать понять, что любая ближневосточная страна может обратиться к нам за помощью против коммунистической агрессии, ради их и наших интересов."
 USA_new_look_policy_desc: "Наши нынешние военные расходы были основаны на предположении, что Советы достигнут максимального \"предела\" своего военного потенциала по сравнению с нами где-то в 1950-х годах. Сейчас кажется маловероятным, что советский военный потенциал выровняется, как мы ожидали, поэтому нам следует перейти к долгосрочной стратегии, сосредоточившись на противовоздушной обороне и ядерном оружии, а не на постоянных армиях и флотах."
 USA_army_macarthur_hearings_desc: "Маккарти оказывает очень негативное влияние на наше правительство и на восприятие правительства обществом. Нам удалось найти против него обвинения в ненадлежащем давлении на армейских чиновников, и мы заставим его принять участие в слушаниях по ним в прямом телеэфире. Возможно, когда американский народ увидит его лично, они настроятся против него."
 USA_refugee_relief_act_desc: "В последнее время наблюдается наплыв беженцев из Южной Европы, включая несколько коммунистических стран. Наши нынешние иммиграционные положения не позволяют им въезжать в Соединенные Штаты, но мы должны принять новый закон, разрешающий переселение этих бедных, перемещенных людей (конечно, при условии определенных проверок и контроля)."
 USA_support_monarchism_iran_desc: "Стабильность на Ближнем Востоке имеет первостепенное значение, поскольку этот регион полон нефти и коммунистических агитаторов. Народное недовольство правящей в Иране династией Пехлеви расцвело при советской поддержке. Мы должны помочь шаху укрепить народную поддержку и подавить красное недовольство. Если мы этого не сделаем, весь Ближний Восток может пасть в скором времени."
 USA_operation_ajax_desc: "Иранский шах оказался восприимчив к западным идеям, но его правительство гораздо менее открыто. Вместе с британцами мы обратились к влиятельному иранскому военному и попросили его помочь нам стабилизировать власть шаха над непокорным парламентом."
 USA_arm_imperialist_persia_desc: "Теперь, когда мы помогли шаху укрепить его контроль над Ираном, мы должны обеспечить предотвращение вооруженного восстания. Мы отправим значительное количество оружия и боеприпасов в Персию, чтобы укрепить нашего верного союзника."
 USA_malayam_emergency_aid_desc: "Малайя страдает от коммунистического восстания, война осложняется тем, что коммунисты в первую очередь борются против колониального угнетения. Мы должны послать помощь в Малайю, чтобы помочь подавить эту чрезвычайную ситуацию."
 USA_advisors_to_malaysia_desc: "Как и многие страны Восточной Азии, Малайя страдает от относительного отсутствия опыта ведения современной войны. Мы должны послать военных советников, чтобы помочь им в борьбе с коммунистическим повстанческим движением."
 USA_intervene_in_malaysia_desc: "Мы потеряли веру в способность малайского правительства самостоятельно справиться с революционерами MLA. Мы решили вмешаться сами, чтобы сдержать распространение мирового коммунизма."
 USA_science_funding_desc: "Будущее Америки лежит в развитии науки и образовании нашей молодежи в области естественных наук. Мы должны увеличить финансирование этих жизненно важных областей, чтобы не отстать в гонке с Россией."
 USA_support_african_colonialism_desc: "Нашим союзникам в Европе нужны ресурсы их колониальных рынков, чтобы восстановить свою экономику и оставаться сильными перед лицом влияния Варшавского договора. Для этого мы должны поддерживать их усилия по поддержанию мира и порядка в своих колониях."
 USA_advisors_french_algeria_desc: "Французский Алжир - это территория, страдающая от особенно яростных националистических настроений. Французам понадобится помощь наших военных советников, если они хотят сохранить стабильность в регионе."
 USA_intervene_in_algeria_desc: "Алжирские националистические повстанцы оказались на удивление умелыми и решительными. Французы больше не могут рассчитывать на безопасность своих североафриканских колоний - мы должны вмешаться, чтобы обеспечить мир."
 USA_crack_down_on_organized_crime_desc: "Мафия и другие формы организованной преступности являются эпидемией для нашего общества. Шантаж, вымогательство, убийства, грабежи и всевозможные пороки совершаются этими преступниками. Их больше нельзя игнорировать, и они должны быть подавлены любыми доступными нам средствами."
 USA_expand_missle_research_desc: "Во время вторжения в нацистскую Германию мы спасли и амнистировали многих немецких ученых-ракетчиков. Их опыт значительно ускорит нашу ракетную программу - в конце концов, военный потенциал этой области невозможно переоценить."
 USA_the_interstate_highway_system_desc: "Путешествиям и торговле по Америке мешают небезопасные дороги и неэффективное планирование маршрутов. Мы примем участие в беспрецедентном по масштабам проекте строительства дорог, чтобы создать гораздо более совершенную систему дорог, которая упорядочит жизнь американцев."
 USA_statehood_for_alaska_and_hawaii_desc: "В настоящее время Аляска и Гавайи являются организованными инкорпорированными территориями, а не полноценными штатами. Мы должны двигаться к расширению статуса штатов, но Конгресс не хочет утверждать ни один из штатов отдельно, поскольку на Аляске большинство составляют республиканцы, а на Гавайях - демократы. Поэтому они оба должны стать штатами в быстрой последовательности."
 USA_nasa_desc: "Новые технологии открыли поразительную возможность покинуть эту планету, на которой мы жили всю нашу историю. Более того, Советы также проявили интерес к этому предприятию, и пока что они лидируют в \"космической гонке.\" Мы создадим Национальное управление по аэронавтике и исследованию космического пространства, чтобы продвинуть американское освоение космического пространства."
 USA_latam_operations_desc: "Латинская Америка - наш задний двор, и мы не потерпим никаких социалистических подрывных действий так близко к нашим границам. Падение любой американской страны до коммунистического режима потенциально может дать Советскому Союзу возможность закрепиться в нескольких сотнях миль от наших границ, и это не будет терпимо."
 USA_PBSUCCESS_desc: "Гватемала находится под контролем либерального правительства, которое имеет слишком много связей с коммунизмом для нашего комфорта. Мы разработали план, который позволит заменить нынешнюю администрацию Гватемалы на ту, которая будет более благоприятна для достижения наших целей."
 USA_democratic_regime_gua_desc: "Создание автократического правительства в Гватемале было ошибкой с нашей стороны, большой несправедливостью по отношению к народу Гватемалы. Мы должны были позволить демократически избранному правительству прийти к власти."
 USA_gua_military_junta_desc: "Диктатура, которую мы установили в Гватемале, недостаточно стабильна, чтобы надежно противостоять проникновению коммунистов. Мы должны организовать приход к власти более твердого и сильного правительства."
 USA_support_arab_cause_desc: "У арабов и израильтян напряженные и непростые отношения друг с другом, но арабов гораздо больше, чем израильтян. В интересах региональной стабильности на Ближнем Востоке мы должны поддержать дело арабов."
 USA_arm_arab_states_desc: "Арабские страны являются мишенью для русских, которые пытаются финансировать коммунистических повстанцев внутри их стран. Мы должны предоставить им оружие и боеприпасы, чтобы помочь им противостоять социалистическим повстанцам."
 USA_arab_advisors_desc: "Наши арабские союзники получат пользу от советов наших опытных военных."
 USA_economic_and_oil_development_Desc: "Ближний Восток изобилует нефтью, но арабские страны не имеют возможности эффективного доступа к большей ее части. Мы будем инвестировать значительный капитал в наших арабских союзников, чтобы дать им возможность использовать их огромные природные ресурсы."
 USA_gua_corporate_puppet_desc: "United Fruit Company - американская корпорация, которая имела значительные интересы в Гватемале до недавней нестабильности. Они обратились к нам с просьбой разрешить им расширить свое влияние в стране, чтобы Америка могла более эффективно защищать своих союзников и предотвращать распространение социализма."
 USA_support_israel_desc: "Еврейский народ является частью нашего общего иудео-христианского наследия. Мы должны поддержать израильтян в их благородной попытке защитить свою нацию от иностранной агрессии."
 USA_arm_israel_desc: "Еврейский народ ужасно пострадал во время Второй мировой войны, и теперь он вновь обрел часть своей исконной родины в Израиле. Однако они окружены большим количеством враждебных арабов, которые еще не готовы к сосуществованию с ними. Мы должны снабжать Израиль оружием, которое необходимо ему для самозащиты."
 USA_israeli_advisors_desc: "Израиль нуждается в помощи наших военных советников для обеспечения безопасности своих границ."
 USA_support_israeli_economically_desc: "Недостаточно дать Израилю оружие - мы должны обеспечить ему экономическое процветание, чтобы он ни в чем не нуждался. Мы будем инвестировать в Израиль огромные суммы капитала и промышленности публично, а также будем поощрять частные инвестиции в экономику Израиля."
 USA_support_honduras_coup_desc: "Заговорщики в Гондурасе дали нам знать, что сейчас самое время нанести удар. Мы подготовились, и наши оперативники выдвигаются на место. Если повезет, через несколько недель Гондурас будет окончательно выведен из советской сферы."
 USA_arm_militarist_honduras_desc: "Мы должны предоставить оружие и боеприпасы правительству Гондураса, чтобы лучше обеспечить его способность защитить себя от коммунистических повстанцев."
 USA_arm_korea_desc: "Южная Корея находится в крайне уязвимом положении в Восточной Азии. Мы должны посылать большие объемы материальной поддержки, чтобы гарантировать, что они смогут защитить себя от внутренних и внешних угроз."
 USA_south_korean_economy_desc: "В настоящее время Корея слабо развита, но это в основном из-за долгого угнетения японцами. Однако мы видим большой потенциал в экономике Кореи и будем вкладывать значительные средства в развитие нашего союзника."
 USA_defend_the_border_desc: "Мы не можем позволить себе начать наступление на Северную Корею, но режим Кима слишком опасен, чтобы его просто игнорировать. Мы построим систему укреплений и мин, которые должны замедлить или даже остановить наступление Северной Кореи в случае войны на полуострове."
 USA_pre_emptive_strike_desc: "Позволяя режиму Кима гноиться, мы только усугубим проблему. Мы покончим с угрозой коммунизма в Корее сейчас, прежде чем у них появится шанс распространить свой яд дальше."
 USA_operation_blue_bat_desc: "Ливан - страна, расколотая между мусульманами и христианами-маронитами. Недавний президент Ливана сблизился с Западом, что разозлило часть исламского населения и вызвало внутренние волнения. Мы должны начать операцию по укреплению правительства Ливана, чтобы удержать его от отхода от Запада."
 USA_arm_lebanon_desc: "Для дальнейшего укрепления ливанского правительства мы должны послать ему оружие и броню американского производства, чтобы обеспечить способность правительства противостоять угрозам как внешним, так и внутренним."
 USA_pull_out_of_korea_desc: "Корея не является областью нашего беспокойства. Полуостров разделен крайне неестественным и труднообороняемым образом, и было бы пустой тратой огромного количества ресурсов держать наши боевые войска на юге."
 USA_arm_tibetan_uprising_desc: "Тибетский народ восстал против оккупации Китаем. Мы не видим причин, по которым тибетский народ не должен иметь право на самоопределение, поэтому мы будем посылать оружие повстанцам, чтобы помочь делу независимости Тибета."
 USA_return_our_boys_home1_desc: "Война наконец-то закончилась, но сотни тысяч американских солдат все еще несут гарнизонную службу в Европе. Хотя угроза со стороны Советов реальна, это не означает, что американские войска должны постоянно оккупировать Германию и Францию. Мы передадим эти обязанности нашим союзникам и начнем позволять нашим парням возвращаться в свои семьи."
 USA_consolidate_the_army1_desc: "Без угрозы нацистской Германии больше нет оправдания для постоянной мобилизации миллионов солдат. Наша оборона против Советов будет гораздо лучше обеспечена консолидированной армией, состоящей из обученных профессионалов, а не из солдат по призыву."
 USA_return_to_domestic_defense_policy1_desc: "Почему американские налогоплательщики должны оплачивать счета за защиту Европы, Африки и Азии? Мы должны вернуться к политике только внутренней обороны, когда наша армия защищает американский материк, а не вынуждена защищать все страны Западного полушария одновременно."
 USA_end_of_colonization_desc: "Колониальная эпоха подошла к концу, и угнетение неевропейцев европейцами является анахроничной несправедливостью. Мы должны публично выступить в поддержку движений за независимость мировых колоний. В конце концов, если мы не освободим их сами, они могут искать спасения у России..."
 USA_call_for_de_colonization_desc: "До сих пор мы обращались с Британией и Францией в лайковых перчатках, никогда не оказывая на них серьезного давления с целью предоставления независимости их колониям. Это время прошло - настало время ясно дать понять, что мы не потерпим продолжающегося и неопределенного существования колониальных держав в Свободном мире."
 USA_the_treaty_ports_desc: "В девятнадцатом веке доминирующие в то время европейские державы вынудили передать несколько китайских портов под свое прямое управление, чтобы облегчить торговлю. С тех пор китайцы по праву испытывают горечь по поводу этого соглашения, и теперь, когда Гоминьдан - наш союзник, мы должны оказать давление на Британию и Португалию, чтобы вернуть договорные порты под контроль Китая."
 USA_fund_shia_radicals_desc: "Монархия Пехлеви в Иране безнадежно коррумпирована и слаба. Они являются живым доказательством глупости автократического правления. Мы узнали о восстании популистов против монархии, и во имя свободы мы должны поддержать тех, кто хочет освободиться от тирании абсолютизма."
 USA_recognize_iranian_government_desc: "Стабильное правительство на Ближнем Востоке имеет первостепенное значение. Мы не можем позволить себе насильственное восстание, переворачивающее политический порядок на Ближнем Востоке в столь критическое время. Мы должны официально поддержать иранскую монархию Пехлеви против мятежа, направленного на их свержение."
 USA_iranian_industrial_development_desc: "Если мы хотим, чтобы Ближний Восток был стабильным, мы должны иметь стабильный и дружественный Иран. Если мы хотим иметь стабильный и дружественный Иран, то Иран должен быть богатым и довольным. Для нас имеет смысл инвестировать в Иран, чтобы улучшить его экономику."
 USA_further_deployment_to_europe1_desc: "Некоторые представители вооруженных сил призывают демобилизовать наши войска из Европы, но мы знаем лучше. Война с нацистами может быть закончена, но потребность в мужчинах для борьбы за свободу - нет. Страшный призрак преследует Европу, призрак коммунизма. Мы должны не только отказаться от демобилизации, мы должны послать еще больше войск на защиту Европы!"
 USA_establish_us_european_command1_desc: "Если мы собираемся проводить операции в Европе, чтобы сдержать советское влияние, то недостаточно просто иметь войска. Четыре миллиона солдат не могут должным образом управляться из-за океана. Мы должны создать четкую структуру военного командования со штаб-квартирой в Европе для организации наших европейских операций."
 USA_mobilize_against_the_ussr1_desc: "Если мы вступим в тотальную войну с Советами, это будет одно из величайших начинаний, которые когда-либо предпринимал американский народ. Никто успешно не вторгался в Россию со времен монголов, и если мы хотим добиться успеха, нам потребуется, чтобы каждый трудоспособный мужчина был готов отдать свою жизнь за это дело."
 USA_the_korean_war_draft_desc: "Корейская война может легко превратиться в затяжное дело против окопавшегося врага, в застойную войну. Мы снизим минимальный возраст для призыва в армию до 18 с половиной лет, чтобы больше рабочей силы было доступно для военных усилий."
 USA_mountain_assualt1_desc: "Лучшие войска Америки - это наши спецназовцы. Мы должны расширить обучение горным операциям для как можно большего числа солдат, чтобы максимизировать нашу способность сражаться в горных регионах по всему миру."
 USA_condemn_african_colonialism_desc: "Народы Африки безмерно страдают под бременем колониализма. Осудить это зло и оказать давление на Британию, Францию и Португалию, чтобы они предоставили своим африканским колониям независимость - дело первостепенной моральной важности."
 USA_algerian_democratic_front_desc: "Алжир - это очаг национализма, поскольку берберский народ стремится добиться независимости от Франции. Мы должны поддерживать их, чтобы гарантировать, что когда они получат независимость, они будут дружелюбны и открыты к союзу с нами."
 USA_start_uprising_algeria_desc: "Наконец-то пришло время. Наши алжирские союзники-националисты уже несколько месяцев призывают нас начать решительную военную кампанию против французов, и наконец-то все готово. Восстание начнется."
 USA_reform_our_doctrine1_desc: "Мы вышли из Второй мировой войны одной из доминирующих держав мира, но наша сухопутная армия уступает советской Красной армии. Если мы хотим иметь хоть какой-то шанс сдержать советское вторжение в Европу, то мы должны модернизировать наши представления о войне."
 USA_grow_our_talons1_desc: "Наша величайшая сила - это наши военно-воздушные силы. ВВС США известны во всем мире благодаря безупречной службе. Мы должны сосредоточиться на этой области, потому что мы не можем позволить себе потерять наш козырь против Советов."
 USA_amphious_warfare1_desc: "Корпус морской пехоты США является, пожалуй, самым известным военным подразделением во всем мире. Мы должны быть уверены, что сохраним это, и инвестировать в технологии амфибийной войны - в отличие от Советов, нам, скорее всего, придется действовать в тех частях мира, где у нас нет сухопутной границы, и морская пехота будет незаменима в этих войнах."
 USA_american_airborne_forces1_desc: "Десантники - жизненно важная часть будущего войны. Расширяя корпус десантников, мы сможем обеспечить наличие большого контингента воздушно-десантной пехоты."
 USA_special_forces1_desc: "У нас никогда не будет населения, необходимого для того, чтобы сравняться с Советами в сырой рабочей силе, поэтому мы должны обеспечить более умное и эффективное использование наших солдат. Для этого мы должны сосредоточить наши усилия на наших подразделениях спецназа, которые дадут нам преимущество в тактической гибкости перед русским джаггернаутом."
 USA_expand_our_numbers1_desc: "Дядя Сэм нуждается в вас! Мы должны сделать так, чтобы всем молодым американцам привили добродетель патриотизма, и чтобы каждый мужчина воспринимал армию как славное дело в деле всемирной защиты свободы!"
 USA_collabrative_efforts_desc: "Мы должны сохранить наше технологическое преимущество над Советами, если мы хотим одержать победу над мировым коммунизмом. Мы должны более тесно сотрудничать с нашими союзниками в Европе, чтобы гарантировать, что мы останемся на острие научных исследований."
 USA_eagles_talons1_desc: "Хотя наши истребители являются лучшими в своем классе, именно бомбардировщики позволяют нам превратить превосходство в воздухе в победу в войне. Мы будем расширять наши исследования в области бомбардировщиков, чтобы быть уверенными, что мы можем проецировать воздушную мощь в любой точке земного шара."
 USA_begin_a_european_recovery1_desc: "Разрушения, причиненные странам Европы Первой мировой войной, сыграли огромную роль в становлении коммунизма и фашизма. Урок ясен: экстремистские идеологии приходят к власти благодаря политической нестабильности, а политическая нестабильность проистекает из экономического хаоса и бедности. Поэтому, если мы хотим укрепить Европу против коммунизма, мы должны восстановить ее и сделать богатой."
 USA_nets_for_flemmish_fishermen1_desc: "Фламандская рыболовная промышленность сильно пострадала от войны. Отправка им современного, новейшего рыболовного оборудования значительно укрепит бельгийскую экономику."
 USA_construction_equipment_and_engineers_to_france1_desc: "Франция была полностью опустошена нацистским вторжением и оккупацией, и сейчас переживает волнения в своей разрушающейся колониальной империи. Мы должны отправить во Францию массу строительных материалов и инженеров, чтобы восстановить их инфраструктуру и экономику."
 USA_rebuild_italys_auto_indsutry1_desc: "Хотя Италия была державой Оси в войне, мы должны помочь и ей, поскольку она ближе, чем большинство стран Западной Европы, к угрозе коммунизма. Автомобильная промышленность Италии лежит в руинах после войны, и мы должны инвестировать в итальянские компании, чтобы возродить ее."
 USA_coal_exports_to_denmark1_desc: "Мы будем развивать промышленность Дании, снабжая их дешевым углем для отопления их заводов."
 USA_food_distribution_to_europe1_desc: "Соединенные Штаты были благословлены широкими океанами с двух сторон, что не позволяло ни одной вражеской державе вторгнуться на их материк. Таким образом, наше сельское хозяйство не было прервано бомбардировками или захвачено оккупантами. Европе не так повезло, и голод является реальной угрозой во многих частях Франции и особенно Германии. Мы будем экспортировать огромное количество продовольствия, чтобы помочь страдающим людям Европы."
 USA_consolidate_our_positions1_desc: "Военно-морской флот США - самый мощный флот в мире, но мы не должны успокаиваться своим превосходством. Советы знают об этом и, вероятно, будут вкладывать значительные средства в свой флот. Мы должны быть уверены, что не отстаем от них."
 USA_rebuild_and_modernize_our_navy1_desc: "Авианосцы - это будущее морской войны, способное проецировать воздушную мощь на тысячи миль за пределы любой военно-морской базы. Мы должны перестроить наш флот в соответствии с этой реальностью."
 USA_a_truly_american_navy1_desc: "Наконец-то наш флот начинает принимать ту форму, которую мы для него предусмотрели. Мы продолжим нашу программу расширения авианосцев, чтобы о мощи нашего флота говорили поколениями, подобно британскому флоту прошлых лет."
 USA_the_macarthur_question1_desc: "Генерал Макартур позволил своей славе вскружить ему голову. Он выступал против нашей политики в отношении войны в Корее, но недавно он сделал свою критику публичной и проводил опасно агрессивную политику в отношении Китая. Многие опасаются, что его контроль над оккупацией Японии превратил его в диктатора. Ему нужно напомнить, что он подчиняется президенту."
 USA_a_rebuilt_europe1_desc: "Европа восстала из пепла войны с помощью американских инвестиций. Страны Западной Европы начинают восстанавливаться, и их экономики демонстрируют признаки роста, неслыханного за многие годы. Следующий логический шаг - инвестиции в европейские автомобильные и железные дороги, чтобы это вновь обретенное богатство могло течь более свободно."
 USA_a_new_threat1_desc: "Советская угроза - это самая большая угроза свободе, с которой свободный мир сталкивался со времен падения нацизма. Западная Европа является жизненно важным оплотом против распространения коммунизма. Мы укрепили Европу настолько, что экономические потрясения, вероятно, не заставят их броситься в объятия Москвы, но мы должны вооружить и их, чтобы они могли защитить себя от более прямой агрессии."
 USA_call_for_nato_members_to_return_treaty_ports_roc_desc: "Теперь, когда Китайская Республика является нашим союзником, действительно непростительно, чтобы члены НАТО несправедливо удерживали китайские земли. Мы будем ходатайствовать перед европейцами о возвращении Китаю договорных портов."
 USA_iranian_civil_war_desc: "Поддержка антипехлевийских повстанцев чрезвычайно возросла в Иране. Настало время для революции с целью свержения монархии."
 USA_arm_greek_government_desc: "Греки уже пострадали от коммунистических повстанцев. Мы должны послать им оружие и припасы, чтобы гарантировать, что Кремль не сможет зайти в Средиземноморье."
 USA_economic_aid_to_greece_desc: "Экономика Греции находится в состоянии некоторой разрухи после 2-й мировой войны и последующей коммунистической гражданской войны. Мы должны предоставить им экономическую помощь, чтобы гарантировать, что греческому народу не придется искать спасения в коммунизме."
 USA_invite_greece_and_turkey_nato_desc: "Греция и Турция уязвимы, находясь так близко к России и другим странам Варшавского договора. Мы должны приложить значительные политические и дипломатические усилия, чтобы обеспечить их защиту, а также интеграцию с остальными нашими союзниками. Приглашение их в НАТО - один из способов достижения обеих этих целей."
 USA_McCarran_internal_security_act_desc: "Мы всегда должны опасаться влияния коммунистических организаций на нашу великую страну. Мы примем закон, обязывающий все коммунистические организации регистрироваться в правительстве, а также облегчающий поиск и преследование тех, кто подозревается в подрывной деятельности или шпионаже против наших демократических свобод."
 USA_join_anti_communist_movement_desc: "До сих пор мы были слишком мягкими по отношению к красным. Бойкоты? Сдерживание? В лучшем случае полумеры! Мы должны всецело посвятить нашу нацию прямому уничтожению мирового коммунизма."
 USA_purge_state_department_desc: "Государственный департамент заполнен коммунистическими шпионами и переплетен с сетью шпионажа. Мы должны вычистить из нашего правительства всех тех, кто стремится продать страну Советам."
 USA_civil_rights_act_of_1959_desc: "Расовое неравенство в американском обществе - это трагедия и несправедливость (не говоря уже о том, что коммунисты часто используют его в качестве риторической дубинки, чтобы бить нас). Мы должны добиваться отмены технически законных, но явно дискриминационных законов о голосовании на Юге, которые практически лишают небелых права голоса."
 USA_subvert_democratic_system_desc: "Баланс сил в американском правительстве представляет угрозу мировой стабильности. Как Америка может надеяться защитить мир от коммунизма, если мы намеренно ущемляем наше собственное правительство? Мы должны устранить любые препятствия на пути к президентской власти."
 USA_military_junta_desc: "Хотя демократия - это проверенная временем американская традиция, сейчас мы нуждаемся в стабильности больше, чем когда-либо. Как однажды сказал Авраам Линкольн, вы не меняете лошадей во время движения, и вы не меняете лидеров во время войны. Мы находимся в состоянии войны с коммунизмом и будем находиться в состоянии войны в обозримом будущем. Мы должны обеспечить стабильность, необходимую для победы в этой войне."
 USA_spread_fascism_desc: "Наши союзники недостаточно мотивированы в борьбе с красными, и многие из них предпочли бы политику умиротворения решению проблемы. Глупцы! Неужели они не помнят, что случилось в последний раз, когда они пытались умиротворить диктатора? Мы должны сделать так, чтобы во главе свободного мира стояли более сильные, более динамичные люди."
 USA_crusade_agaisnt_communism_desc: "Наконец-то пришло время. Мы готовы, наши армии готовы, и наши союзники готовы. Сегодня мы вступаем в величайшую войну, которая когда-либо велась в истории человечества. Сегодня мы начинаем великий крестовый поход против зла и тирании, равного которому никогда не было и не может быть. Слава, слава, аллилуйя! Победа Соединенных Штатов!"
 USA_show_trials_on_opposition_figures_desc: "Маккарти постоянно противостоял коммунистическим предателям в своем благородном стремлении защитить Америку от подрывной деятельности. Теперь, когда он стал президентом, у него наконец-то появилась власть, чтобы избавиться от всех предателей, которые хотели уничтожить Америку."
 USA_embrace_nationalism_desc: "Слишком долго американский народ стыдился того, что его называют националистами. Этот термин ассоциируется у них с расизмом, риторикой о крови и почве и бессмысленными войнами. Это совершенно ошибочно! Национализм означает лишь любовь к своей стране! Мы должны противостоять хныкающему интернационализму коммунистов с красно-кровавым националистическим духом."
 USA_paramilitary_american_legion_desc: "Американский легион - это почетное общество для наших военных ветеранов, но мы не видим причин, почему их навыки должны пропадать зря. Мы превратим Американский легион в единую патриотическую силу квалифицированных воинов под личным контролем Маккарти."
 USA_outlaw_leftist_opposition_desc: "Второй злейший враг Америки - либерализм, ибо либерализм неизбежно ведет к коммунизму. Разве не либералы препятствовали попыткам Маккарти очистить Америку от коммунистов под их нытье о скользких склонах и правах совести? Чтобы обеспечить безопасность Америки, все левые организации должны быть запрещены."
 USA_isolationism_desc: "Вмешательство Америки во Вторую мировую войну было необходимым злом для уничтожения нацизма. Мы не обещали больше и не дадим больше. Президент Тафт намерен вывести Америку из ее пут в Европе. В конце концов, мы должны служить и защищать прежде всего Америку."
 USA_asian_pivot_desc: "Президент Тафт решил, что для Америки будет гораздо выгоднее сосредоточиться на сотрудничестве со своими союзниками на Тихоокеанском побережье, а не ввязываться в обреченную сухопутную войну с русскими в Европе."
 USA_pacifica_desc: "Мы должны оформить наши отношения с нашими тихоокеанскими союзниками в настоящий альянс - Организацию тихоокеанского договора."
 USA_stevenson_presidency_desc: "Адлай Стивенсон выиграл президентский пост и планирует провести обширные экономические и социальные реформы."
 USA_kefauver_presidency_desc: "Эстес Кефаувер выиграл президентский пост и будет бороться с крупными деловыми трестами и организованной преступностью."
 USA_macarthur_presidency_desc: "Дуглас Макартур выиграл президентский пост, опираясь на свою репутацию героя войны. Он планирует посвятить всю американскую нацию уничтожению коммунизма."
 USA_eisenhower_presidency_desc: "Дуайт Эйзенхауэр выиграл президентский пост и намерен жестко противостоять мировому коммунизму посредством международного сотрудничества и политики массированного возмездия в ядерной войне."
 USA_taft_presidency_desc: "Роберт Тафт-младший выиграл президентский пост и планирует вывести Америку из путаницы европейской политики."
 USA_the_deutsche_mark1_desc: "Немецкая валюта была, что неудивительно, полностью разрушена поражением в войне. С тех пор немцы прибегают к использованию американских сигарет в качестве валюты, и черный рынок процветает. Германия никогда не будет восстановлена, если все будет продолжаться в том же духе. В рамках плана Маршалла мы должны вновь ввести в Германии надлежащую, обеспеченную американцами валюту."
 USA_final_year_of_eisenhowers_presidency_desc: "За долгие годы пребывания в Овальном кабинете Дуайт Д. Эйзенхауэр видел множество кризисов и неприятностей - восстания, революции, создание НАСА и строительство масштабной магистрали Интерстейт. Теперь, когда приближается последний год его президентства, он готовится к последнему плаванию за штурвалом государственного корабля."
 USA_the_space_race_desc: "В 1957 году СССР запустил Спутник, первый в истории искусственный спутник Земли. Это напугало наш народ - наша безопасность зависит от технологического превосходства над Советами, а этот запуск вызвал сомнения в этом превосходстве. В ответ мы создали НАСА и разрабатываем собственную космическую программу. Мы должны выиграть эту гонку к звездам, чтобы успокоить умы наших людей."
 USA_nuclear_program_desc: "В холодной войне победит тот, у кого больше ядерных ракет. Мы должны сделать так, чтобы наш ядерный арсенал оставался лучшим в мире, чтобы у Советов всегда были причины опасаться нашего гнева."
 USA_elections_of_1964_desc: "Срок полномочий президента наконец-то закончился, и необходимо провести новые выборы. Ожидается, что на этих выборах в равной степени будут обсуждаться социальные вопросы и внешняя политика, а двумя наиболее перспективными кандидатами являются демократ Линдон Джонсон и республиканец Барри Голдуотер. Однако никогда нельзя предугадать, не появится ли неожиданный кандидат..."
 USA_The_Election_of_1968_desc: "Пришло время снова идти на избирательные участки, чтобы решить, кто возглавит нашу великую нацию. Наиболее перспективными кандидатами являются демократ Хьюберт Хамфри и республиканец Ричард Никсон, хотя Джордж Уоллес, независимый кандидат из Алабамы, также объявил о своем намерении баллотироваться."
 USA_The_Election_of_1972_desc: "Пришло время снова идти на выборы, чтобы решить, кто возглавит нашу великую нацию."
 USA_the_CIA_desc: "Мы никогда не победим в холодной войне без сильной разведывательной службы. Шпионаж имеет огромное значение, как для кражи секретов наших врагов, так и для предотвращения кражи наших секретов русскими шпионами. Мы должны массово расширить функции ЦРУ, чтобы обеспечить нашу безопасность."
 USA_The_Civil_Rights_Movement_desc: "Несмотря на усилия, предпринятые в конце предыдущего десятилетия, чернокожие и другие меньшинства все еще в огромной степени страдают от дискриминации в нашей стране. В последние годы народное недовольство становится все громче, перерастая в полноценное общественное движение. Пойдет ли это движение по пути мирного или насильственного сопротивления - это еще предстоит выяснить."
