 USA_jfk60_The_Kennedy_Administration: "Администрация Кеннеди"
 USA_jfk60_The_Kennedy_Administration_desc: "Молодой и харизматичный, Джон Ф. Кеннеди был выбран президентом Соединенных Штатов на выборах 1960 года. Демократ, Кеннеди стал первым римским католиком, победившим на всеобщих выборах."
 USA_jfk60_Betray_Organized_Crime: "Предать организованную преступность"
 USA_jfk60_Betray_Organized_Crime_desc: "Хотя многие ожидали, что он оставит мафию в покое, Кеннеди идет против прогнозов экспертов и преследует преступные группировки, планируя новый раунд расследования."
 USA_jfk60_Establish_the_Peace_Corps: "Учредить Корпус мира"
 USA_jfk60_Establish_the_Peace_Corps_desc: "Нам необходимо продвигать демократию и американские ценности по всему миру новым, ненасильственным способом, и Корпус мира достигнет этого. Мы отправим лучших из наших юношей и девушек за границу, чтобы помогать и развивать страны третьего мира."
 USA_jfk60_Area_Redevelopment_Act: "Закон о перепланировке территорий"
 USA_jfk60_Area_Redevelopment_Act_desc: " Закон о развитии территорий создаст одноименную администрацию, роль которой будет заключаться в оказании помощи бедным сельским районам, в частности Аппалачам, в развитии местной инфраструктуры и ресурсов."
 USA_jfk60_Increase_the_Minimum_Wage: "Повышение минимальной заработной платы"
 USA_jfk60_Increase_the_Minimum_Wage_desc: "Минимальная заработная плата, хотя и не слишком низкая, все еще не достаточна для тех, кому ее платят, чтобы выжить в нашей современной и растущей экономической системе. Мы должны ее повысить."
 USA_jfk60_Invest_in_Appalachia: "Инвестируйте в регион Аппалачи."
 USA_jfk60_Invest_in_Appalachia_desc: "Несмотря на то, что Аппалачи уже стали мишенью Закона о перепланировке территорий, это самый бедный регион Америки, и ему нужны все средства и инвестиции, которые он может получить."
 USA_jfk60_Drug_Efficacy_Amendment: "Поправка об эффективности лекарств"
 USA_jfk60_Drug_Efficacy_Amendment_desc: "Поправка к ранее принятому Федеральному закону о продуктах питания, лекарствах и косметике, DEA вводит требование к компаниям предоставлять доказательства того, что их продукт действительно работает безопасно, как и предполагалось, прежде чем его можно будет продавать."
 USA_jfk60_Foreign_Assistance_Act_of_1961: "Закон об иностранной помощи 1961 года"
 USA_jfk60_Foreign_Assistance_Act_of_1961_desc: "Этот закон реструктурирует наши программы международной помощи, классифицируя средства на военные и невоенные пакеты. Новое Агентство по международному развитию (USAID) будет контролировать экономические пакеты."
 USA_jfk60_Manpower_Development_and_Training_Act: "Закон о развитии и обучении рабочей силы"
 USA_jfk60_Manpower_Development_and_Training_Act_desc: "Наш резерв рабочей силы, а также вооруженных сил ограничен, и мы должны убедиться, что мы получаем как можно больше от каждого мужчины или женщины."
 USA_jfk60_Migration_and_Refugee_Assistance_Act: "Закон о миграции и помощи беженцам"
 USA_jfk60_Migration_and_Refugee_Assistance_Act_desc: "Закон о миграции и помощи беженцам призван решать неожиданные и неотложные проблемы беженцев, перемещенных лиц, жертв конфликтов и других лиц, находящихся в опасности, по всему миру."
 USA_jfk60_Deploy_Troops_to_Ole_Miss: "Развернуть войска в Оле Мисс"
 USA_jfk60_Deploy_Troops_to_Ole_Miss_desc: "Студенты Оле Мисс, после всего, что произошло с Little Rock 9 и движением за гражданское право, начали беспорядки в знак протеста против зачисления чернокожих студентов, и людей убивают. Пришло время послать армию."
 USA_jfk60_Executive_Order_11063: "Исполнительный приказ №11063"
 USA_jfk60_Executive_Order_11063_desc: "Этот указ запрещает дискриминацию при любых сделках или взаимодействии, связанных с федеральным жильем."
 USA_jfk60_Fund_the_Apollo_Program: "Финансировать программу Аполлон"
 USA_jfk60_Fund_the_Apollo_Program_desc: "\"Мы решили отправиться на Луну в этом десятилетии, и сделать другие вещи, не потому что они легкие, а потому что они трудные...\" \n С этими словами наш президент объявил нации, что мы достигнем Луны до конца десятилетия. Удачи НАСА!"
 USA_jfk60_Equal_Pay_Act: "Закон о равной оплате труда"
 USA_jfk60_Equal_Pay_Act_desc: "Следующий в бесконечной череде поправок к закону о справедливых трудовых стандартах, закон о равной оплате попытается ликвидировать гендерный разрыв в оплате труда, а также атаковать другие области дискриминации по половому признаку."
 USA_jfk60_Clean_Air_Act: "Закон о чистом воздухе"
 USA_jfk60_Clean_Air_Act_desc: "Закон о чистом воздухе - это закон, направленный на контроль и устранение загрязнения воздуха. Новая программа Службы общественного здравоохранения будет следить за его исполнением, и будет финансироваться больше исследований в соответствующих областях."
 USA_jfk60_Federal_Transit_Act: "Федеральный закон о транзите"
 USA_jfk60_Federal_Transit_Act_desc: "Закон о городском массовом транспорте от 1964 года предоставит 375 миллионов долларов на крупномасштабные городские государственные или частные железнодорожные проекты в виде соответствующих фондов городам и штатам."
 USA_jfk60_Civil_Rights_Act_of_1964: "Закон о гражданских правах 1964 года"
 USA_jfk60_Civil_Rights_Act_of_1964_desc: "Закон о гражданских правах 1964 года запрещает дискриминацию по признаку расы, цвета кожи, религии, пола или национального происхождения. Он также запрещает неравное применение требований к регистрации избирателей и расовую сегрегацию в школах, на работе и в общественных местах."
 USA_jfk60_Revenue_Act_of_1964: "Закон о доходах 1964 года"
 USA_jfk60_Revenue_Act_of_1964_desc: "Закон о доходах 1964 года сократит федеральные подоходные налоги примерно на двадцать процентов по всем направлениям, а также снизит верхнюю ставку федерального подоходного налога с 91 процента до 70 процентов."
 USA_jfk60_Food_Stamp_Act: "Закон о продовольственных талонах"
 USA_jfk60_Food_Stamp_Act_desc: "Закон о продовольственных талонах предоставит постоянные законодательные полномочия программе продовольственных талонов, которая была введена несколько лет назад на временной основе и имела массовый успех."
 USA_jfk60_Rollback_Steel_Prices: "Откатить цены на сталь"
 USA_jfk60_Rollback_Steel_Prices_desc: "Со времен Второй мировой войны и последних конфликтов цены на сталь были очень высокими для всех, но особенно для гражданских компаний. Пришло время снизить их обратно."
 USA_jfk60_Economic_Opportunity_Act: "Закон об экономических возможностях"
 USA_jfk60_Economic_Opportunity_Act_desc: "Закон об экономических возможностях санкционирует создание местных агентств общественных действий как часть войны с бедностью, а целью закона является укрепление, дополнение и координация усилий по борьбе с бедностью."
