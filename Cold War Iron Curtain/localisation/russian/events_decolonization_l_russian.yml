 decolonization.25.d: "Вест-Индская федерация появилась сегодня после принятия Закона о Британской Карибской федерации. Новый политический союз объединяет более двадцати крупных и около двухсот пятидесяти мелких островов в десять провинций с федеральным центром. Британцы надеются, что Федерация сможет превратить бывшие колониальные острова в полностью независимое государство. Лондон рассматривает Федерацию как ответ на растущее давление со стороны подданных островов, требующих независимости, и в то же время гарантирует, что независимость приведет к созданию жизнеспособного государства, не зависящего от Лондона. Некоторые жители, особенно с больших островов, с осторожностью приветствуют новое государство, но выражают беспокойство по поводу того, насколько централизованной будет Федерация. Некоторые антиколониальные активисты видят в Федерации лишь продолжение британской эксплуатации, и только немедленная независимость положит конец многовековому колониальному угнетению жителей островов. Однако, судя по всему, большинство людей радостно приветствуют эту новость и надеются, что она ознаменует новый период независимости и развития для народов."
 newsdecolonization.25.d: "Вест-Индская федерация появилась сегодня после принятия Закона о Британской Карибской федерации. Новый политический союз объединяет более двадцати крупных и около двухсот пятидесяти мелких островов в десять провинций с федеральным центром. Британцы надеются, что Федерация сможет превратить бывшие колониальные острова в полностью независимое государство. Лондон рассматривает Федерацию как ответ на растущее давление со стороны подданных островов, требующих независимости, и в то же время гарантирует, что независимость приведет к созданию жизнеспособного государства, не зависящего от Лондона. Некоторые жители, особенно с больших островов, с осторожностью приветствуют новое государство, но выражают беспокойство по поводу того, насколько централизованной будет Федерация. Некоторые антиколониальные активисты видят в Федерации лишь продолжение британской эксплуатации, и только немедленная независимость положит конец многовековому колониальному угнетению жителей островов. Однако, судя по всему, большинство людей радостно приветствуют эту новость и надеются, что она ознаменует новый период независимости и развития для народов."
 decolonization.26.d: "Антиколониальная борьба в Португальской Гвинее и Кабо-Верде продолжала приближаться к миру. На референдуме, состоявшемся в Кабо-Верде, население острова подавляющим большинством голосов проголосовало за принятие независимого Национального собрания, представленного Африканской партией за независимость Гвинеи и Кабо-Верде (ПАИГК). Другой вариант - отказаться от независимости от Португалии. Хотя насильственная антиколониальная деятельность на Кабо-Верде не имела места, жители Кабо-Верде активно участвовали в конфликте на материке и имели несколько ведущих политиков, действующих в рамках ПАИГК. Ожидается, что старший член партии и Кабо-Верде Аристидис Перейра придет к власти, как только Португалия официально уйдет. Он занимал руководящие посты в ПАИГК и помогал организовывать забастовки и антиколониальные протесты на Кабо-Верде, обеспечивая участие своего народа в борьбе за независимость. Референдум отражает переход Португалии к деколонизации для разрешения конфликта в Португальской Гвинее. Единственным потенциальным камнем преткновения для нового государства Кабо-Верде являются внутренние дебаты о том, должна ли страна стремиться к объединению с Гвинеей-Бисау или сохранить свою независимость."
 newsdecolonization.26.d: "Антиколониальная борьба в Португальской Гвинее и Кабо-Верде продолжала приближаться к миру. На референдуме, состоявшемся в Кабо-Верде, население острова подавляющим большинством голосов проголосовало за принятие независимого Национального собрания, представленного Африканской партией за независимость Гвинеи и Кабо-Верде (ПАИГК). Другой вариант - отказаться от независимости от Португалии. Хотя насильственная антиколониальная деятельность на Кабо-Верде не имела места, жители Кабо-Верде активно участвовали в конфликте на материке и имели несколько ведущих политиков, действующих в рамках ПАИГК. Ожидается, что старший член партии и Кабо-Верде Аристидис Перейра придет к власти, как только Португалия официально уйдет. Он занимал руководящие посты в ПАИГК и помогал организовывать забастовки и антиколониальные протесты на Кабо-Верде, обеспечивая участие своего народа в борьбе за независимость. Референдум отражает переход Португалии к деколонизации для разрешения конфликта в Португальской Гвинее. Единственным потенциальным камнем преткновения для нового государства Кабо-Верде являются внутренние дебаты о том, должна ли страна стремиться к объединению с Гвинеей-Бисау или сохранить свою независимость."
 decolonization.27.d: "Сан-Томе и Принсипи были португальской колонией с тех пор, как португальцы впервые прибыли на необитаемые острова в конце пятнадцатого века. Он стал местом сахарных плантаций и крупным центром работорговли в регионе. В конце концов какао и кофе также стали основным экспортом для острова, но его история с рабством и принудительным трудом нависла над отношениями между большинством африканского населения на островах и Португалией. По мере того как после Второй мировой войны усилился шум вокруг деколонизации, была сформирована социалистическая партия Сан-Томеанцев под названием Движение за освобождение Сан-Томе и Принсипи (МЛСТП). Хотя МЛСТП не участвовала в насилии, она создала базу и выступала против португальского колониализма. После решения Португалии принять деколонизацию местные колониальные власти вступили в контакт с МЛСТП и начали переход к независимости островов. На всенародном референдуме народ проголосовал за учредительное собрание, где МЛСТП получила все места, что ознаменовало конец португальского правления на острове. Ожидается, что лидер MLSTP Мануэль Пинту да Коста станет главой государства для новой нации."
 newsdecolonization.27: "Сан-Томе и Принсипи были португальской колонией с тех пор, как португальцы впервые прибыли на необитаемые острова в конце пятнадцатого века. Он стал местом сахарных плантаций и крупным центром работорговли в регионе. В конце концов какао и кофе также стали основным экспортом для острова, но его история с рабством и принудительным трудом нависла над отношениями между большинством африканского населения на островах и Португалией. По мере того как после Второй мировой войны усилился шум вокруг деколонизации, была сформирована социалистическая партия Сан-Томеанцев под названием Движение за освобождение Сан-Томе и Принсипи (МЛСТП). Хотя МЛСТП не участвовала в насилии, она создала базу и выступала против португальского колониализма. После решения Португалии принять деколонизацию местные колониальные власти вступили в контакт с МЛСТП и начали переход к независимости островов. На всенародном референдуме народ проголосовал за учредительное собрание, где МЛСТП получила все места, что ознаменовало конец португальского правления на острове. Ожидается, что лидер MLSTP Мануэль Пинту да Коста станет главой государства для новой нации."
 newsdecolonization.28.d: "Британцы захватили Маврикий в начале девятнадцатого века и боролись с экономическими и социальными проблемами из-за зависимости острова от сахара и разнообразной рабочей силы. Сегодня остров получил новую конституцию и провозгласил свою независимость. В течение нескольких лет британцы определяли Маврикий как пространство для независимости, но их усилия по превращению колонии в независимое государство не были гладкими. Разнородное население и трудовые группировки привели к сектантскому насилию над будущим страны всего за несколько недель до выборов. Британским военным пришлось развернуть войска, чтобы положить конец беспорядкам. Однако, несмотря на эту неопределенность, многие надеются на будущее. Новый парламент возглавит сэр Сивусагур Рамгулам из правящей Лейбористской партии. В ответ студенческая организация под названием Маврикийское воинствующее крыло (ММВ) под руководством Пола Беренджера уже провозгласила себя главной оппозиционной группой правящей лейбористской партии. ММВ предлагает социалистическую альтернативу Лейбористской партии. Несмотря на насилие и ранние политические вызовы, многие настроены оптимистично, что новая нация сможет достичь своих национальных интересов."
 newsdecolonization.29.d: "Во французских Коморских островах парламент острова проголосовал за одностороннее провозглашение независимости от Франции. Говорят, что французы были удивлены этим решением, поскольку они ожидали предоставить независимость в 1978 году. Несколько лет назад были проведены референдумы о независимости на четырех островах Коморских островов, три проголосовали за независимость, а Майотта воздержалась, новое государство состоит из всех Коморских островов, кроме Майотты. Главный министр Коморских островов Ахмед Абдалла объявил о голосовании за независимость и является первым президентом Коморских островов. Напряженность на острове высока, поскольку большая франкофильская община считает этот шаг пагубным для развития страны. С другой стороны, социалисты считают парламент и Ахмеда Абдаллу слишком центристскими, чтобы обеспечить значимые перемены. Приведет ли эта напряженность к политическим потрясениям, остается неизвестным, но решение о независимости вызвало гнев Парижа из-за действий коморских националистов. Ожидается, что Франция, скорее всего, разорвет связи с островами и укрепит свою власть на Майотте, возможно, со временем удастся восстановить отношения с Францией и ее теперь уже бывшей колонией."
 newsdecolonization.30.d: "Сейшельские острова первоначально были необитаемы, пока европейцы не начали прибывать в шестнадцатом веке, к началу девятнадцатого это была коронная колония Великобритании. Исторически на острове существовала мощная система плантаций, которая экспортировала товарные культуры, но с момента создания международного аэропорта он стал основным туристическим направлением. Поскольку экономическое будущее Сейшельских островов развивалось в позитивном направлении, британское правительство объявило о планах предоставить Сейшельским островам независимость. Джеймс Манчем, юрист из известной семьи, основал Демократическую партию Сейшельских островов (СДП) в ответ на планы Великобритании по обретению независимости. Партия Манчема доминировала на провинциальных выборах, проходивших в течение переходного периода, и Лондон объявил сегодня, что этот переходный период закончился. Джеймс Манчем станет президентом независимых Сейшельских островов, и в публичном заявлении он объявил, что его страна будет республикой в составе Содружества. Социалистическая оппозиционная партия, Объединенная народная партия, не имеет мест в Национальном собрании, но имеет сильную поддержку на островах и получила пост премьер-министра в Национальном собрании. Будущий успех Сейшельских островов будет определяться тем, смогут ли две основные политические партии объединиться для решения проблемы быстрого экономического роста при защите трудящихся граждан."
 decolonization.34.d: "Цель ООН по обеспечению независимости в течение 10 лет для народа Сомалиленда была, наконец, выполнена с итальянским Сомалилендом, получившим независимость от Италии сегодня. Новообразованный Сомалиленд одновременно объединился с Британским Сомалилендом, который получил свою собственную независимость всего за несколько дней до этого. Объединение сразу же привело к созданию Сомалийской Республики с правительством, сформированным Абдуллахи Исой и Мухаммадом Хаджи Ибрагимом Эгалем вместе с другими членами правительств опеки и протектората, с Хаджи Башир Исмаилом Юсуфом в качестве председателя Сомалийской Национальной ассамблеи, Аденом Абдуллой Османом Дааром в качестве президента Сомалийской Республики и Абдирашидом Али Шермарком в качестве премьер-министра. Однако поспешный толчок ООН к 10-летней независимости выявил ее обратную сторону, поскольку республика, по-видимому, все еще находится под сильным колониальным влиянием как среди народа, так и среди правительства. На данный момент судьба земли Сомали зависит от республики."
 decolonization.40.d: "После обещания, данного десять лет назад в 1942 году бывшей королевой Вильгельминой, заявившей, что все заморские территории Королевства Нидерландов получат некоторую форму автономии, сегодня, в декабре 1954 года, отмечается официальное начало Нидерландских Антильских островов после того, как они были изданы королевским указом тремя годами ранее. Это позволит увеличить автономию и избавит наше правительство от необходимости управлять каждым отдельным островом. Каждый остров будет иметь вице-губернатора, который будет подчиняться генерал-губернатору Кюрасао в попытке централизовать территории. Нидерландские Антильские острова состоят из Кюрасао, Бонайре, Арубы, Синт-Мартена, Синт-Эстатиуса и Сабы, официальной валютой которых является Нидерландский антильский гульден. Их правительство будет управляться парламентом и советом министров с премьер-министром в качестве главы правительства в Виллемстаде, столице острова Кюрасао. Будем надеяться, что это подавит волнения и борьбу за независимость, которые вспыхнули во время короткого американского контроля во Второй мировой войне."
 decolonization.42.d: "На этой неделе наш парламент ратифицировал Мадридские соглашения-договор о передаче Испанской Сахары Мавритании и Марокко. Со времени принятия резолюции 1514 Генеральной Ассамблеи Организации Объединенных Наций проклятая организация оказывает на нас сильное давление, требуя, чтобы мы отказались от наших немногочисленных малых африканских территорий, несмотря на то, что мы классифицируем их как внутренние провинции. В то время как большинство высокопоставленных членов правительства хотели создать независимую испанскую Сахарскую Республику, давление со стороны Мавритании и Марокко, требовавших их полной аннексии провинции вместе с недавно сформированной сепаратистской группой, сделало эти соглашения наиболее логичным подходом."
 newsdecolonization.41.d: "Независимость Нигерии была достигнута на этой неделе в результате переговоров, проведенных всеобъемлющей коалицией нигерийских политических партий, перед которыми тогда стояла более сложная задача по формированию нового правительства. В конце концов, эта трудная задача привела к тому, что премьер-министром стал Абубакар Тафава Балева, выходец из Народного конгресса Севера, по происхождению хауса, под началом которого находился этнический игбо, президент Национального совета Нигерии и Камеруна Ннамди Азикиве. Подобно другим бывшим британским колониям, Нигерийская федерация предпочтет остаться частью Содружества и по-прежнему иметь королеву Елизавету II в качестве официального монарха, а британский генерал К.Б. Уэлби-Эверард останется главой новых нигерийских вооруженных сил для следующие несколько лет."
 newsdecolonization.42.d: "После многолетнего давления со стороны Генеральной ассамблеи ООН на Испанию с целью деколонизации их сахарских территорий было наконец достигнуто соглашение в свете недавно сформированного повстанческого фронта Полисарио. Испания попыталась отсрочить свою деколонизацию, объединив свои североафриканские владения в \"внутреннюю провинцию\" испанской Сахары и на короткое время разгромив местные воинствующие организации. Однако после того, как Марокко совершило марш 350 000 граждан в Испанскую Сахару в знак демонстрации \"марокканизации\" провинции, Испании стало ясно, что Марокко готово вести войну за эту территорию. Мадридские соглашения были подписаны на этой неделе испанским парламентом в то время как Франсиско Франко лежит в коме"
 decolonization.45.d: "После более чем 300-летнего подчинения народ небольшого островного государства Доминика пользуется независимостью от короны. Народ Доминики теперь сможет проложить свой собственный путь. Тем не менее, с ЦРУ, скрывающимся в тени, поверьте, новый путь не будет слишком отличаться от старого."
 newsdecolonization.45.d: "После более чем 300-летнего подчинения народ небольшого островного государства Доминика пользуется независимостью от короны. Народ Доминики теперь сможет проложить свой собственный путь. Тем не менее, с ЦРУ, скрывающимся в тени, поверьте, новый путь не будет слишком отличаться от старого."
 decolonization.46.d: "Первоначально французская колония, маленький остров был полем битвы между соседними британскими колониями. В общей сложности Сент-Люсия была обменена между Францией и Великобританией 14 раз, прежде чем окончательно утвердиться в качестве британской колонии. 22 февраля 1979 года, после почти 400 лет европейской интервенции, ни французский, ни британский флаг не развевались над островом. Сегодня в столице возвышался независимый флаг Святого Лукиана."
 newsdecolonization.46.d: "Первоначально французский остров был полем битвы между соседними британскими колониями. В общей сложности Сент-Люсия была обменена между Францией и Великобританией 14 раз, прежде чем окончательно утвердиться в качестве британской колонии. 22 февраля 1979 года, после почти 400 лет европейской интервенции, ни французский, ни британский флаг не развевались над островом. Сегодня в столице возвышался независимый флаг Святого Лукиана."
 decolonization.47.d: "Сегодня Сент-Винсент и Гренадины провозгласили независимость от Великобритании. После 400 лет восстания независимость наконец пришла к народу Сент-Винсента и Гренадин не с треском ружья, а с росчерком пера."
 newsdecolonization.47.d: "Сегодня Сент-Винсент и Гренадины провозгласили независимость от Великобритании. После 400 лет восстания независимость наконец пришла к народу Сент-Винсента и Гренадин не с треском ружья, а с росчерком пера."
 decolonization.48: "Сегодня Гренада официально получила независимость от Великобритании. Несмотря на независимость, островное государство объявило, что оно останется под короной с королевой Елизаветой в качестве официального главы государства."
 newsdecolonization.48: "Сегодня Гренада официально получила независимость от Великобритании. Несмотря на независимость, островное государство объявило, что оно останется под короной с королевой Елизаветой в качестве официального главы государства."
 newsdecolonization.49: "С непопулярной Вест-Индской федерацией в смятении остров Ямайка объявил о своем официальном выходе из обреченного союза. Сегодня Юнион Джек был спущен и заменен новым независимым флагом Ямайки над зданием парламента."
 newsdecolonization.50: "После выхода Ямайки из Вест-Индской федерации Тринидад и Тобаго провозгласили независимость. Тринидад и Тобаго, одна из старейших колоний в регионе, входившем в состав Британской империи, не имела автономии с 1498 года, когда Колумб наткнулся на нее, как неуклюжий дурак. Поскольку судьба двух островов находится в их собственных руках, многие задаются вопросом, каким курсом они пойдут."
 decolonization.56.d: "После того, как наше правительство, наконец, смогло достичь удовлетворительного уровня согласия в переговорах с крупнейшей местной партией, Национальной партией Суринама, мы смогли официально добиться независимости Суринама. Из-за их небольшого населения и отсутствия местной гражданской инфраструктуры нам необходимо сделать им ряд экономических вливаний, которые, скорее всего, составят более 2,7 миллиардов голландских гульденов."
 newsdecolonization.57.d: "После переговоров, проведенных Национальной партией Суринама (НПС), Республика Суринам была официально провозглашена новейшей постколониальной нацией. Трагическая судьба этого, однако, заключается в том, что одна треть его населения решила мигрировать в Нидерланды, чтобы сохранить свое гражданство, поскольку многие считают новое государство нежизнеспособным. Имея в виду нехватку ресурсов, населения и гражданской инфраструктуры, Нидерланды решили выделить ряд средств на развитие в течение следующих 7 лет на сумму более одного миллиарда долларов США. Однако, несмотря на эти проблемы, многие суринамцы радуются по всей стране, прославляя свою новую нацию как культурный плавильный котел с десятками разговорных языков и населением, происходящим из Африки, Индонезии, Индии, Нидерландов и коренных жителей нового мира."
 surinamedecolonization: "§YОдна треть населения Суринама прибудет в нашу страну, пополнив и без того значительную суринамскую общину. §RТаким образом, они будут нашим крупнейшим этническим меньшинством во многих городских районах, что приведет к этнической напряженности.§!"