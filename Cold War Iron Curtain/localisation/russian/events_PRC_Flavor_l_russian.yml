l_russian:
 PRC_Focus_1_desc: "После победы коммунистов в гражданской войне националисты бежали на Тайвань и стойко удерживали его против дальнейших маоистских наступлений, наряду с островом Тайвань, несколько островов в Южно-Китайском море также были захвачены националистами, такими как Киньмэнь и Мацу, развернув 58 000 войск на Кинмэне и 15 000 войск на Мацу. Недавно войска Народно-освободительной армии начали обстрел вышеупомянутых островов, причем Чжоу Эньлай заявил, что Тайвань должен быть освобожден от угнетающих сил Гоминьдана, которые в настоящее время правят железным кулаком. НОАК также направила войска для захвата островов Ицзяншань, расположенных у побережья Чжэцзяна."
 PRC_Focus_2_desc: "После кампании «Сто цветов» Мао Цзэдун был полон решимости искоренить "реакционные" элементы из нации, начав кампанию по преследованию тех, кто критиковал правительство КНР. Сразу же после окончания движения Ста цветов Мао начал арестовывать интеллектуалов и критиков; в некоторых случаях они подвергались каторжным работам или расстрелам, а судебная власть заменялась политическими кадрами и полицией. Вскоре выяснилось, что 300 000 человек были помечены как правые - ходили слухи, что Дэн Сяопин был одним из самых восторженных обвинителей движения во время его волны чисток. Негодование против "правых" восходит в Коммунистической партии еще к "Длинному маршу", примером которого является ненависть к Чжан Боцзюню."
 PRC_Focus_3_desc: "\nС появлением движения «Сто цветов», которое принесло десятки писем и откровенных протестов в маоистский Китай, этническим и религиозным меньшинствам по всему Китаю не потребовалось много времени, чтобы последовать примеру интеллектуалов и критиковать их обращение в Китае со стороны властей; наряду с критикой КПК и самого Мао Цзэдуна. Рулевой вскоре ответил чисткой интеллигенции, а вместе с ней и меньшинств. Подвергаясь пыткам, публичным унижениям и давлению, многие из этих случаев сопровождались самоубийствами или казнями, постигая ту же участь, что и интеллигенция, раздавленная во время Антиправой кампании."
 PRC_Focus_4_desc: "Председатель Мао заявил, что"политика, позволяющая сотне цветов цвести и сотне школ мысли бороться, призвана способствовать расцвету искусств и прогрессу науки". И именно с этой идеи КНР начала "Кампанию ста цветов", направленную на то, чтобы побудить граждан Китая открыто выражать свое мнение, поскольку идея состояла в том, чтобы побудить интеллектуалов обсуждать проблемы страны с целью продвижения новых форм искусства и культурных институтов. Не потребовалось много времени, чтобы протесты поднялись против КПК и письма затопили Мао критикой; точно так же, как не потребовалось много времени, чтобы председатель Мао начал кампанию преследования тех, кто критиковал режим и его идеологию, а те, кто был мишенью, были публично раскритикованы и приговорены к тюремным трудовым лагерям, Китай вскоре стал свидетелем создания Антиправого движения."
 PRC_Focus_5_desc: "В Маньчжурии Мао начал кампанию по избавлению от коррумпированных или иным образом про-тайваньских элементов внутри Китая, уделяя особое внимание бывшим членам КМТ, бюрократическим чиновникам, которые не были официальными членами партии, и членам партии, которые были коррумпированы. Анти-это борьба с коррупцией, расточительством и бюрократией. Кампания "Три против" предусматривала чрезвычайно суровые наказания, включая пытки, и все, кто был признан виновным в своих признанных или нераскрытых преступлениях, должны были платить штрафы правительству. Рулевой нации снова и снова заявлял, что это важнейшая мера, необходимая для избавления Китая от коррумпированных членов и тех, кто растрачивает и стагнирует китайскую экономику"своими собственными эгоистичными выгодами"."
 PRC_Focus_6_desc: "С Корейской войной возможности были даны многим в Северном Китае, что дало начало новому классу капиталистов в Маньчжурии, которые вскоре начали понимать, что их не видят дружелюбными глазами в Пекине. Вскоре была начата кампания "Пять анти", описанная как тотальная война против буржуазии в Китае, и вышеупомянутые анти были: борьба со взяточничеством, борьба с кражей государственной собственности, борьба с уклонением от уплаты налогов, борьба с мошенничеством в государственных контрактах и борьба с воровством государственной экономической разведки. Некоторые компании начали посылать 1000 признаний в день, чтобы избавиться от огромного давления, которое оказывала на них КПК; парады антикапиталистических активистов ходили от двери к двери, чтобы навестить лидеров бизнеса, создавая огромное психологическое давление. Мао сказал, что"мы, вероятно, должны казнить от 10 000 до нескольких десятков тысяч казнокрадов по всей стране, прежде чем мы сможем решить эту проблему". Прямым результатом этой кампании стали сотни тысяч самоубийств, причем с китайскими капиталистами обращались не лучше, чем с иностранцами."
 PRC_Focus_7_desc: "\nПо мере того как идет Антиправая кампания, многих интеллектуалов арестовывают, пытают или иным образом унижают и сажают в тюрьму. Чэнь Фэнсяо был заключен в тюрьму на 15 лет во время кампании за то, что был правым и, таким образом, предал маоистское движение. Многие диссиденты были сожжены огнем, избиты до смерти или расстреляны, и, по оценкам, от 400 000 до 700 000 человек были подвергнуты политическому преследованию; непосильный труд в тюремной системе часто приводил к их смерти, и другие были полностью исключены из общества, такие как Ло Лунцзи и Чжан Боцзюнь, в то время как другие, такие как Чэнь Мэнцзя, покончили с собой из-за исключения и политического давления."
 PRC_Focus_8_desc: "\nВо время Антиправой кампании, чтобы облегчить преследование интеллектуалов и других инакомыслящих маоистского правительства, ученые-юристы и рабочие также подвергались судебному преследованию и приговаривались к суровым тюремным срокам за сотрудничество или иное замедление Движения; судебная система была тщательно изучена и внимательно наблюдалась, как она медленно заменялась партийными кадрами, лояльными КПК и Мао, и полицией, чтобы облегчить аресты и вынесение приговоров. Те, кто не был арестован, были переведены на другую работу, которая не препятствовала захвату независимой судебной власти партией, что для многих означало, что Мао еще больше укрепляет свою власть в Китае."
 PRC_Focus_9_desc: "Сегодня было объявлено, что сын Мао Цзэдуна, Верховного лидера Китая, был убит в бою авиаударом; опытный офицер, сын Мао воевал во Второй мировой войне в качестве артиллерийского офицера против Третьего рейха в Польше, будучи добровольцем Советской Армии. Во время своей смерти он служил в Китайской народной добровольческой армии в качестве секретаря и русского переводчика для командующего ПВА Пэн Дэхуая. Он был размещен в штабе ПВА, в пещерах рядом со старым поселением золотодобытчиков; похоже, что четыре американских самолета сбросили в этом районе напалмовые бомбы, одна из которых разрушила импровизированное здание рядом с пещерами, убив Мао Аньина и еще одного офицера. Председатель Мао, как сообщается, глубоко скорбит об этой потере, но никаких комментариев от Рулевого не последовало."
 PRC_Focus_10_desc: "Великий рулевой Китайской Народной Республики, революционный лидер и политический теоретик Мао Цзэдун умер; перенесший два сердечных приступа в начале года, последний сердечный приступ окончательно сразил верховного лидера через несколько дней, чуть позже полуночи. КПК передала по радио важное сообщение о кончине Мао, призывая к единству партии. Лидер был забальзамирован и задрапирован во флаг КПК, который будет находиться в Большом зале народа в течение недели. По оценкам, миллион человек придут посмотреть на Рулевого в последний раз, а те, кто уже присутствуют при этом, открыто плачут или демонстрируют ту или иную степень печали. На стене висит официальный портрет председателя Мао, а на плакате написано \"Продолжайте дело, оставленное председателем Мао, и несите дело пролетарской революции до конца\"
 PRC_Focus_11_desc: "Китайское правительство направило войска в Чамдо в том, что они называют"Освобождением Тибета" после неудачных переговоров о включении Тибета в состав нации; Народно-освободительная армия прошла через реку Цзиньша с сотнями войск, которые захватили пограничный город Камдо, и активные боевые действия начались в пограничном районе к северо-востоку от реки Гьямо Нгул Чу и к востоку от 96-го меридиана. Неясно, будет ли Китайская Народная Республика немедленно продвигать свое желание аннексировать Тибет, но это кажется очень вероятным, поскольку Мао Цзэдун утверждает, что"тибетский народ достаточно пострадал, пришло, наконец, время для него присоединиться к Китайской Народной Республике и быть освобожденным.\""
 PRC_Focus_12_desc: "\nПосле падения армии клики Ма во время гражданской войны в Китае было создано повстанческое движение, возглавляемое бывшими генералами и ветеранами Ма Буфана. Основой мятежа стало падение Ма Буфана во время кампании в Нинся, и вскоре после этого многие генералы, большинство из которых были мусульманами, перешли на сторону Китайской Народной Республики, поскольку крах националистического Китая был неизбежен. Большинство бывших гоминьдановских мусульманских генералов, таких как Ма Буфан, Ма Хункуй, Ма Дунцзин, Бай Чунси и т. Д., бежали на Тайвань вместе с правительством Китайской Республики, но подчиненные Ма Буфана офицеры остались в провинции Цинхай. Сегодня последние повстанцы были разгромлены в Иу, где более 700 повстанцев погибли в бою, когда флаг КНР развевался над городом Иу."
 PRC_Focus_13_desc: "НОАК объявила сегодня, что она положила конец Тибетскому мятежу. Когда Лхаса открыто восстала против Китайской Народной Республики, армия обстреляла Норбулингку, чтобы разогнать толпу, разместив войска на баррикадах, разделявших город на северную и южную части. Ранним утром тибетские повстанцы потерпели поражение от войск Народно-освободительной армии, которые вели кровопролитную битву на улицах, прежде чем двинуться в сторону Джокханга, сражаясь в трехчасовом бою, через несколько мгновений на храме был поднят флаг Китая, который подавил восстание. Ходят многочисленные слухи, что Пандацанг Рапга, про-КМТ и про-РПЦ революционный лидер, сыграл важную роль в восстании против КНР; и Далай-лама нигде не найден."
 PRC_Focus_14_desc: "Председатель Мао заявил, что наряду с мерами, принимаемыми для обеспечения Большого скачка вперед, утверждается новая кампания, которая будет немедленно проведена под названием"Кампания четырех вредителей". Председатель утверждает, что это гигиеническая кампания против крыс, мух, комаров и воробьев; комары ответственны за малярию; грызуны, которые распространяют чуму; мухи, которые считаются всепроникающими, и воробьи, которые едят зерна и семена обильных урожаев в Китае. Также проводятся конкурсы среди предприятий, государственных учреждений и школ по чистоте, сообщается, что нематериальные награды получают те, кто сдает наибольшее количество крысиных хвостов, дохлых мух и комаров или дохлых воробьев."
 PRC_Focus_25_desc: "\nВпервые после перемирия 1946 года председатель Коммунистической партии Китая Мао Цзэдун объявил, что он предложит новое предложение по Тайваню, которое предполагает проведение всеобщих выборов в Материковом Китае и на Тайване, а также на островах, которые ставят под угрозу целостность обеих стран. Эти всеобщие выборы, говорит Мао, "имеют целью объединить обе наши нации и решить судьбу Китая, предоставив народу выбирать между Гоминьданом и Коммунистической партией Китая". Еще неизвестно, примет ли Тайвань это предложение, но многие эксперты говорят, что это всего лишь уловка Мао, попытка продемонстрировать приветливость и легитимность своего режима."
 PRC_Focus_16_desc: "Коммунистическая партия Китая заявила сегодня, что впервые с тех пор, как она пришла к власти во время гражданской войны в Китае, Всекитайское собрание народных представителей, высший орган государственной власти КНР и национальный законодательный орган, будет либерализовано и будет более активное участие мелких партий, которые в настоящее время входят в состав национального законодательного органа.; одним из самых сильных сторонников этого шага был Революционный комитет КМТ, Китайская демократическая лига и Китайская демократическая национальная строительная ассоциация также были двумя партиями, которые были сильными сторонниками этого шага и приветствовали его как следующий шаг в освобождении Китая от превращения в репрессивный режим."
 PRC_Focus_17_desc: "Председатель Мао заявил сегодня, что будет пересмотр нынешнего режима Китайской Народной Республики, сам Председатель высоко оценил интеллектуалов, которые критиковали правительство во время кампании"Сто цветов", и утверждал, что "пришло время цветам расцвести и Китаю признать мольбы своих жителей". Это, по-видимому, явный показатель того, что китайский режим планирует реформировать свой авторитаризм и позволить себе стать более умеренным, еще предстоит выяснить, будет ли председатель Мао либерализовать или он сохранит свою железную хватку на правительстве."
 PRC_Focus_18_desc: "Сегодня в Лхасе началось восстание, поскольку протестующие утверждают, что Тибет является независимым государством. Когда опасения, что КПК собирается похитить Далай-ламу, достигли ушей его обитателей, люди вскоре собрались у дворца, чтобы помешать ему уйти или, что еще хуже, быть насильственно удаленным КПК и быть встреченным неизвестной судьбой. Вскоре после этого на улицах Лхасы были возведены баррикады, и вскоре появилась петиция о поддержке вооруженных повстанцев; как китайские, так и тибетские войска уже начали движение в направлении Лхасы, и поступили сообщения о создании артиллерии в пределах досягаемости летнего дворца Далай-ламы Норбулингка."
 PRC_Focus_19_desc: "И Кан Шэн, и Жэнь Биши, один из ключевых членов разведывательного аппарата Китая и командующий Пятой Красной Армией, соответственно, утверждали, что насильственная кампания против помещиков в Китае неизбежна, так как"тридцать миллионов помещиков и богатых крестьян должны быть уничтожены". Сегодня Кормчий объявил, что каждый крестьянин должен идти на бой со своими помещиками и убивать их голыми руками. Мао выразил желание не"исправлять излишества преждевременно" и принял политику "живи и дай жить другим" в отношении насилия, которое в настоящее время происходит по всему Китаю, КПК не одобряет и не санкционирует физическое насилие крестьян над помещиками, которых вешают, хоронят заживо, расчленяют и расстреливают. На улицах они бормочут"Доу Ди Чжу" или"Боритесь с помещиком"; похоже, что председатель Мао всеми необходимыми средствами укрепляет поддержку партии."
 PRC_Focus_20_desc: "Первый командующий и комиссар Народной добровольческой армии Пэн Дэхуай объявил сегодня, что ее войска войдут в КНДР, чтобы поддержать ее; режим, возглавляемый Ким Ир Сеном, приветлив по отношению к КНР и к председателю Мао в частности; китайский лидер поклялся защищать КНДР и поддерживать ее всякий раз, когда это необходимо. Похоже, что эта армия состоит из тысяч солдат, которые полны решимости помочь своим корейским братьям по оружию против сил, поддерживаемых США; в настоящее время существует ряд опасений относительно будущего Корейского полуострова, но председатель Мао, похоже, уверен, что конец войны близок и над полуостровом будет развеваться красный флаг."
 PRC_Focus_21_desc: "\nКитайская Народная Республика в последнее время продвигает свое дипломатическое признание. Председатель КНР начал просить страны признать его легитимность по сравнению с его националистическим коллегой, Китайской Республикой. Как только она вышла из гражданской войны, Китайская Народная Республика была немедленно признана СССР и государствами, которые компрометируют ее сферу влияния, такими как Социалистическая Республика Румыния, Польская Народная Республика и Венгерская Народная Республика. Китай просит признания у азиатских государств, таких как Индия и Северный Вьетнам; многие эксперты утверждают, что это вопрос времени, пока КНР не будет признана во всем мире, в то время как другие утверждают, что идея КНР как международно признанного государства-это трубопровод, судьба которого все еще неопределенна."
 PRC_Focus_22_desc: "\nВслед за попытками КНР добиться дипломатического признания со стороны своих азиатских соседей, коммунистическая нация теперь разветвляется на другие сферы, в данном случае на Европу. Швейцария представляет себя весьма заинтересованной в признании Китая, а другие скандинавские страны, такие как Дания, Швеция и Финляндия, имеют очень позитивные перспективы для этой новой попытки признания со стороны КНР; это все еще вопрос геополитического маневрирования - но председатель Мао выразил, что он вполне позитивен, когда дело доходит до признания его нации Западом, и эксперты предполагают, что, скорее всего, она будет признана в ближайшем будущем."
 PRC_Focus_23_desc: "Председатель КНР объявил сегодня, что различные культы, присутствующие в сельских районах Китая, должны быть уничтожены из-за сотрудничества с КМТ, реакционными и буржуазными элементами в Китае. Общество Красного Копья уже начало падать, его члены были быстро арестованы силами КПК, и Общество Больших Мечей, похоже, встретило ту же участь, что и Общество Желтого Песка. Все эти общества были вдохновлены в своей деятельности милленаристскими, духовными и романтизированными монархическими идеями; большинство, если не все эти общества яростно выступали против династии Цин и верили, что восстановление династии Мин принесет счастье и мир всему Китаю."
 PRC_Focus_24_desc: "Мао Цзэдун официально объявил, что Китай примет курс действий, который вытекает из необходимости преодолеть аграрное общество, которым он был на протяжении веков, и начать принимать форму современной индустриальной нации. Именно с этой целью Председатель КПК сделал Большой скачок вперед. Используя коллективизацию в народных коммунах, поощряя всех крестьян, проживающих в Народной Республике, производить дворовые печи для снабжения государства сталью, запрещая частные владения и используя ирригационные проекты без использования формально образованных инженеров, лидер Китая от всего сердца обещал, что эта кампания продвинет Китай в новом направлении, сделав его одной из величайших держав в мире, если не величайшей."
 PRC_Focus_15_desc: "Сегодня, когда премьер-министр КНР и премьер-министр КНДР пожимают друг другу руки с улыбкой на лицах, подписывается Китайско-северокорейский Договор о дружбе и взаимопомощи. Обещая мирное сотрудничество между двумя странами в области культуры, экономики, технологий и других социальных благ, это явный шаг, который КНДР согласовывает с Китаем; кроме того, во второй статье договора говорится, что обе страны предпримут все необходимые меры, чтобы противостоять любой стране или коалиции стран, которые могут напасть на любую страну, - мера, которую многие считают средством для КНДР обеспечить себе место в великой державе, не подвергаясь вторжению со стороны ее капиталистического партнера Соединенных Штатов."
 PRC_Focus_26_desc: "Большинство азиатских и африканских государств собрались сегодня на массовое воссоединение, чтобы обсудить афро-азиатское экономическое и культурное сотрудничество, противостоящее колониализму или неоколониализму любой нации в любой форме; будучи состоящей из двадцати девяти стран, она представляет собой общее население в 1,5 миллиарда человек, или 54% населения мира. Обсуждается декларация из десяти пунктов, и представляется вероятным, что она будет принята единогласно, из этих пунктов наиболее важными являются воздержание от вмешательства или вмешательства во внутренние дела другой страны, воздержание от актов угрозы агрессии или применения силы против территориальной целостности или политической независимости любой страны. Кроме того, представляется заключительное коммюнике, в котором в настоящее время подчеркивается необходимость того, чтобы развивающиеся страны ослабили свою экономическую зависимость от ведущих промышленно развитых стран путем оказания друг другу технической помощи путем обмена экспертами и технической помощью."
 PRC_Focus_27_desc: "\nОдним махом основатель Чучхе и предполагаемый освободитель Северной Кореи Ким Ир Сен был свергнут в результате дворцового переворота. Офицеры, сторонники китайской модели социализма, увидев триумф Мао над националистическими силами во время гражданской войны, провозгласили, что новая Корейская Народно-Демократическая Республика продолжит борьбу против капитализма бок о бок со своим новым союзником-КНР. Председатель Мао был рад услышать эту новость и заявил, что видит очень светлое будущее для всех людей, проживающих в Северной Корее. Через несколько минут китайские войска были замечены марширующими в Пхеньяне и других городах коммунистического аналога РК. Похоже, маоистский свет озаряет КНДР."
 PRC_Focus_28_desc: "Политбюро объединилось в надежде провести конференцию, которая обсудит Большой скачок вперед и выгоды - и ужасную бесхозяйственность - которые он принес. Во время конференции Пэн Дэхуай направил Мао письмо, в котором почтительно критиковал элементы, которые сделали Большой скачок вперед катастрофическим усилием; шаг, который стоил его карьеры. Вскоре после этого Мао продлил конференцию на десять дней, где он яростно критиковал Пэн Дэхуая за то, что тот находится"всего в тридцати километрах от правых", и приказал его уволить, арестовать и заменить лояльным генералом Линь Бяо. Вскоре после этого Мао Цзэдун выступил с длинной, страстной и воинственной речью в Лушуне, защищая себя, утверждая, что он, как и великие писатели, такие как Конфуций, Ленин и Маркс, совершил ошибки и что сосредоточение внимания на этих ошибках не поможет ситуации; вскоре он последовал за этим, защищая свои стратегии в Великом скачке вперед. Председатель еще больше укрепил свое правление внутри Китая, и, похоже, мало кто осмеливается ему противостоять."
 agrarian_collectivization_process_1_desc: "Базовая коллективизация земли была достигнута. Хотя у крестьян нет ноу-хау, которое ведет к расточительству, у них есть воля построить лучшее общество!"
 agrarian_collectivization_process_2_desc: "Крестьяне начинают самостоятельно осваивать новые методы организации, тем самым становясь более эффективными, не теряя преимуществ процесса коллективизации"
 agrarian_collectivization_process_3_desc: "Коллективизация начинает принимать стандартизированную форму, с местными адаптациями, расцветающими благодаря инновационному духу народа."
 agrarian_collectivization_process_4_desc: "Коллективизация сделала большой шаг, большая часть крестьян теперь добровольно зачислена в колхозы! Накоплен большой объем знаний, что позволило улучшить урожайность и условия жизни крестьянства"
 agrarian_collectivization_process_5_desc: "Посткапиталистический Китай, который мы знаем,-не более чем дурной сон! Теперь коллективизация была достигнута народом для формирования Социалистического общества"
 agrarian_bourgeoisie_1_desc: "Большая часть современных средств производства все еще находится в руках помещиков. Если они эффективнее колхозников, то служат только себе, а не народу! Они должны быть уничтожены!"
 agrarian_bourgeoisie_2_desc: "Переход к Социалистическому обществу близок, но проклятые помещики все еще мешают нашему прогрессу. Они регулярно угрожают снабжению городов продовольствием и не хотят сотрудничать с режимами. Председатель Мао этого не потерпит!"
 agrarian_bourgeoisie_3_desc: "Теперь Аграрная буржуазия ослаблена, но еще не мертва. Ослабление наших усилий по борьбе с ними сейчас может позволить им реорганизоваться. Бей, пока железо горячо!"
 agrarian_bourgeoisie_4_desc: "Аграрная буржуазия больше не является классом для себя, она была иссушена мощью народа. Остатки не смогут организовать себя в ближайшее время, но они все еще являются 5-й колонной в глазах председателя Мао"
 agrarian_bourgeoisie_5_desc: "Помещики, Аграрная буржуазия; это слова прошлого. Теперь китайское общество не знает старых капиталистических классов. Конечно, председатель Мао знает, что формируются новые классы, такие как бюрократы в Советском Союзе. Бой еще не закончился!"
 protected_landlords_desc: "Защита арендодателей-это лишь временное решение, позволяющее справиться с неэффективностью вновь созданной системы. Крестьяне будут учиться на техниках прежних мастеров"
 mixed_economy_desc: "Экономика все еще переходит от феодального к социалистическому государству. Разрешение малого частного бизнеса повысит дух людей в инновациях и предпринимательстве. Это, конечно, будет использовано в нашей дальнейшей политике..."
 Establish_the_Republic_of_Benin: "Создать Республику Бенин"
