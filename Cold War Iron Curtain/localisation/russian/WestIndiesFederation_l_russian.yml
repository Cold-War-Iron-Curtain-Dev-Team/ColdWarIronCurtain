 wif.1.d: "Федерация Вест-Индии возникла сегодня после принятия Закона о Британской Карибской Федерации. Новый политический союз объединяет более двадцати крупных островов и почти двести пятьдесят меньших островов в десять провинций с федеральным центром. Британцы надеются, что Федерация сможет превратить свои бывшие колониальные острова в полностью независимое государство. Лондон рассматривает Федерацию как способ отреагировать на усилившееся давление со стороны субъектов на островах с целью обеспечения независимости, а также обеспечение независимости, которая приведет к созданию жизнеспособного государства, не зависящего от Лондона. Некоторые жители, особенно с крупных островов, осторожно приветствуют это новое государство, но выражают беспокойство по поводу вопросов о том, насколько централизованной будет Федерация. Опрошенные антиколониальные активисты заявили, что Федерация просто продолжает британскую эксплуатацию, и только немедленная независимость положит конец столетиям колониального угнетения жителей островов. Однако, похоже, большинство людей приветствуют эту новость и надеются, что это ознаменует новый период независимости и развития для людей."
