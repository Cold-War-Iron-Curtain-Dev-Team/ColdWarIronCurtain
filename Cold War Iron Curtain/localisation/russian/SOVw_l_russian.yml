 SOV_WW3_decisions:0 "Великая Oсвободительная Война"
 SOV_WW3_decisions_desc:0 "\nThe capitalist powers have long sought to contain the might of the Soviet Union, undermining the workers' struggle and threatening global socialism. Their imperialist grip has strangled the revolution in Europe, Asia, and beyond. But now, history has reached its decisive moment. The Great Liberation War is upon us-a final, inevitable confrontation between the forces of socialism and the decaying remnants of bourgeois oppression.\n---------------------------------------------------------------------------------------------\n                                               Public Opinion\n---------------------------------------------------------------------------------------------\n§YPublic War exhaustion:§! [?Soviet_War_Exhaustion_variable|-0%]\n§RArmy Strength:§! [?Soviet_Army_Strength|-0%]\n---------------------------------------------------------------------------------------------\n                                                  Objectives\n---------------------------------------------------------------------------------------------\n[get_paris_capital]\n[get_helsinki_capital]\n[get_stockholm_capital]\n[get_oslo_capital]\n[get_west_berlin_capital]\n[get_rome_capital]\n[get_vienna_capital]\n[get_athens_capital]\n[get_madrid_capital]\n[get_lisbon_capital]\n "
