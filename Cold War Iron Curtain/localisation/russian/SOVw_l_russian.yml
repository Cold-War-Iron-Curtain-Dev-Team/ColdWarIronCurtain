 great_liberation_war:0 "The Great Liberation War"
 great_liberation_war_desc:0 "Время пришло! Запад во главе с империалистическими США осмелился напасть на нашу священную Родину, вновь ввергнув мир в пламя войны. Но пусть они помнят — как мы сокрушили захватчиков в годы Великой Отечественной войны, так мы разгромим их и сейчас. Это не просто битва между нациями; это сражение идеологий, борьба за справедливость, равенство и само выживание социализма. \nСоветский Союз един и непоколебим. Наш народ, закалённый огнём истории, не дрогнет. Наша армия, несравнимая по силе и решимости, сломит волю врага к борьбе. Пусть мир увидит несокрушимое могущество Союза и непобедимый дух его народа. \nПобеда будет за нами — не только ради Советского Союза, но и ради всех угнетённых народов, жаждущих освобождения. Мы восторжествуем, мы выстоим, а силы империализма рухнут под тяжестью своей собственной надменности. \n§RСоветский Союз одержит победу, и история вновь воздаст должное нашей силе и стойкости§!"
 great_liberation_war_2:0 "The Great Liberation War"
 great_liberation_war_2_desc:0 "The time is now! The West, led by the imperialist United States, has dared to attack our sacred homeland, plunging the world into the fires of war once again. But let them remember—just as we crushed the invaders during the Great Patriotic War, we will crush them now. This is not merely a battle of nations; it is a battle of ideologies, a fight for justice, equality, and the survival of socialism itself. \nThe Soviet Union stands united and unyielding. Our people, forged in the fires of history, will not falter. Our military, unmatched in strength and resolve, will break the enemy's will to fight. Let the world witness the unshakable might of the Union and the indomitable spirit of its people. \nVictory will be ours, not just for the Soviet Union, but for all oppressed peoples who yearn for liberation. We shall triumph, we shall endure, and the forces of imperialism will crumble beneath the weight of their arrogance. \n§RThe Soviet Union will emerge victorious, and history will once again honor our strength and resolve!§!\""
 great_liberation_war_3:0 "The Great Liberation War"
 great_liberation_war_3_desc:0 "The time is now! The West, led by the imperialist United States, has dared to attack our sacred homeland, plunging the world into the fires of war once again. But let them remember—just as we crushed the invaders during the Great Patriotic War, we will crush them now. This is not merely a battle of nations; it is a battle of ideologies, a fight for justice, equality, and the survival of socialism itself. \nThe Soviet Union stands united and unyielding. Our people, forged in the fires of history, will not falter. Our military, unmatched in strength and resolve, will break the enemy's will to fight. Let the world witness the unshakable might of the Union and the indomitable spirit of its people. \nVictory will be ours, not just for the Soviet Union, but for all oppressed peoples who yearn for liberation. We shall triumph, we shall endure, and the forces of imperialism will crumble beneath the weight of their arrogance. \n§RThe Soviet Union will emerge victorious, and history will once again honor our strength and resolve!§!\""
 the_last_war:0 "The Last War"
 the_last_war_desc:0 "\n\n\n\n\n\n£sacred_war\n\n\n\n\n\n\n\nWe shall fight back against the stranglers\nOf all murderous idea,\nThe rapists and the robbers,\nThe killers of people!\n\n§RLet our noble wrath\nBoil over like a wave!\nThis is the people's war,\nA Sacred War!§!"
 rhine_in_seven_days:0 "Seven Days to the Rhine"
 rhine_in_seven_days_desc:0 "§RWe must reach the Rhine river by the seven days or there will be severe consequences...§!"
 Union_of_Laborer:0 "Union of Laborers"
 SOVw_Third_World_War.1.d:0 "Сегодня миллионы людей были призваны на защиту Советского Союза, выступая в авангарде угнетённых народов и поднимая оружие против разлагающегося империалистического порядка.  В историческом обращении к Верховному Совету сегодня утром товарищ [SOV.GetLeader] заявил, что пришло время освободить трудящиеся массы от оков западной эксплуатации, ознаменовав официальное начало того, что будет называться Великой Освободительной Войной.\n\nНа рассвете советские войска начали превентивные оборонительные операции против растущей милитаризации НАТО у наших границ. На протяжении многих лет капиталистические державы окружали советскую Родину, накапливая войска и оружие в агрессивной попытке задушить социализм. Однако рабочие и крестьяне СССР, сплочённые в единое целое, отказались склониться перед угрозами Запада. Сегодня, под знаменем Ленина и бессмертными идеалами марксизма-ленинизма, советский народ предпринял необходимые шаги для обеспечения мира через силу."
 SOVw_Third_World_War.2.d:0 "По мере того как разворачивается Великая освободительная война, советские трудящиеся вновь доказывают, что они являются непоколебимым фундаментом, на котором будет построена победа. От сталелитейных кузниц Магнитогорска до текстильных фабрик Иваново — на заводах и в колхозах Союза кипит неустанный труд, движимый несгибаемой волей народа.\n\nПод руководством партии промышленное производство достигло исторического уровня. На великих тракторных заводах Челябинска рабочие трудятся круглосуточно, превращая машины мира в движущие силы освобождения. В Ленинграде и Харькове пролетариат откликается на призыв долга, собирая танки, самолёты и винтовки с непревзойдённой точностью. Ни одна секунда не тратится зря — каждый болт закручен, каждый колос собран, каждая железная дорога уложена — всё это удары молота по силам империализма.\n\nДух Стаханова живет на каждом заводе и в каждом колхозе. Шахтеры Донбасса перевыполняют квоты, добывая уголь и железо, необходимые для нашей славной борьбы. Женщины Советского Союза, плечом к плечу с товарищами, занимают своё законное место в рабочем процессе, обеспечивая бесперебойную работу производства. В сибирских железнодорожных узлах безостановочно текут жизненно важные для войны поставки — еда, боеприпасы и оружие, снабжая нашу Советскую армию всем необходимым и не позволяя ей остановиться."
 SOVw_Third_World_War.3.d:0 "Земля вздрагивает, когда начинается решающее сражение за советскую Родину. Империалистические армии, движимые отчаянием, сталкиваются с несломимым духом социализма. С запада НАТО перешло границу нашего Советского Союза.\n\nНо советский народ не будет покорён. Он уже пережил множество испытаний и стоит непреклонно. Красная армия, с развёрнутыми знаменами, готова защищать Москву, черпая силу от тех, кто сражался с Наполеоном и Гитлером.\n\nНа заводах Урала рабочие неустанно трудятся, создавая оружие для решающей битвы. По всему Ленинграду и Киеву граждане поднимаются решительно, укрепляя свои дома и баррикадируя улицы. От бескрайних полей Волги до замёрзших просторов Сибири советский народ объединяется, вооружённый винтовками, молотками и косами, готовый встать на защиту социалистической Родины."
 SOVw_Third_World_War.4.d:0 "Из величественного зала Кремля Генеральный секретарь [SOV.GetLeader] выступил перед собравшейся аудиторией, его голос был тверд и решителен. Война вступила в решающую фазу, и в то время как советские войска наступали на далеких полях сражений, другой фронт требовал такой же бдительности — заводы, шахты и поля, которые поддерживали военные усилия.\n\nОн говорил не о жертвах, а о долге — о неразрывной связи между рабочим и солдатом, между машинами, сходящими с конвейеров, и бойцами, которые используют их в бою. Каждое собранное ружье, каждый выкованный танк, каждый построенный самолет были еще одним шагом к победе. Труд народа был не менее важен, чем мощь Советской Армии, ведь без него война не могла быть выиграна.\n\nПослание было ясно:  триумф Советского Союза будет решаться не одними солдатами, а твердыми руками тех, кто трудится за линией фронта. Заводы не остановятся, поля дадут урожай, и страна двинется к будущему, свободному от гнета Запада. Дух прошедших поколений, тех, кто пережил Великую Отечественную войну, продолжал жить в сердцах тех, на чьих плечах теперь лежало бремя истории.\n\nКогда речь подошла к концу, зал взорвался громовыми аплодисментами. Люди понимали — это была и их война."
 SOVw_Third_World_War.5.d:0 "В то время как бушевал огонь Третьей мировой войны, Советский Союз понимал, что не может сражаться в одиночку. С линиями фронта, очерченными против Запада, Москва обратилась к единственной державе, способной изменить ход конфликта, — Китаю. Советский посланник, неся на своих плечах тяжесть истории, был отправлен в Пекин с единственной целью: привести Китай в войну.\n\nПереговоры были напряженными, проходили за закрытыми дверями в Чжуннаньхае, где советские дипломаты и китайские представители обсуждали судьбу Восточного блока. Советская сторона говорила об американской агрессии, о бесконечных посягательствах Запада и мировом порядке, созданном для их сдерживания. Москва предлагала военную координацию, передовые технологии и новый глобальный баланс — такой, в котором ни Москва, ни Пекин больше не будут подчинены западному влиянию.\n\nСпустя несколько дней размышлений ответ был дан. Китай будет стоять на стороне Советского Союза. Рукопожатие, последовавшее за этим, было не просто соглашением — это была клятва, что Восток поднимется как единое целое. Заводы ожили,  солдаты мобилизованы, а мир затаил дыхание перед бурей, которая вот-вот обрушится. Союз, выкованный в стали и огне, не остановит уже ничто."
 SOVw_Third_World_War.6.d:0 "Когда я сижу при тусклом свете фонаря, вдали гремит артиллерийский огонь, и это напоминает мне, как далеко я от дома, но мое сердце остается с тобой. Война продолжается, и хотя дни тянутся долго, а ночи кажутся еще длиннее, мысль о тебе придает мне силы.\n\nЗдесь мужчины сражаются не просто за нашу Родину, а за будущее — за тебя, наших детей и ту жизнь, которую мы построим, когда все это закончится. Я часто вспоминаю нашу маленькую квартиру, утренние часы, когда я просыпался от аромата твоего чая и тепло твоих рук в моих ладонях. Именно эти воспоминания помогают мне идти вперед, когда холодный ветер проникает сквозь форму, а усталость тяжелым грузом ложится на плечи.\n\nМы продолжаем наступать, и хотя враг сопротивляется, мы остаемся несокрушимыми. Запад думал, что нас можно сломить, но они не знают, что такое сердце советского солдата. Мы сражаемся с духом тех, кто был до нас, тех, кто шел на Берлин и победно поднимал красное знамя. Клянусь тебе, моя любовь, я снова увижу тебя, когда это знамя поднимется вновь.\n\nБереги себя, моя дорогая. Скажи нашему сыну, что его отец сражается, чтобы он жил в мире без войны. Оставь свечу гореть в окне для меня — Я найду дорогу домой, следуя за ее огнем.\n\nСо всей моей любовью,"
 SOVw_Third_World_War_news.1.d:0 "Since the outbreak of the Third World War, the Soviet Union has sought to reshape the global order, and now, it has secured its most powerful ally. After months of negotiations, Beijing has cast aside past differences and joined Moscow in its war against the United States, forging an alliance that threatens to tip the scales of history.\n\nWith China’s vast manpower and industrial might reinforcing the Soviet war machine, a new front emerges—one that stretches from the Pacific to the heart of Eurasia. Soviet and Chinese forces coordinate their offensives, striking at Western positions with unrelenting force. The factories of Beijing and Shanghai work day and night, supplying the war effort, while Soviet generals and Chinese commanders plan their next decisive move.\n\nThe world watches as the Eastern Bloc solidifies, a force unseen since the height of the Cold War. With two superpowers standing together, the war’s outcome is no longer certain—the tide has turned."