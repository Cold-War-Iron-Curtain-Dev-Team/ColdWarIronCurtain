 SOVw_A_Revolution_Realized:0 "The Revolution, Realized"
 SOVw_The_Great_Liberation_War_desc:0 "Товарищ! Час расплаты настал! Империалистические капиталистические силы Запада осмелились напасть на нашу святую Родину, но не бойтесь! Под знаменем Коммунистической партии мы едины, полны решимости дать отпор захватчикам и сокрушить их подлую агрессию. С каждым вдохом, с каждой каплей пота и крови мы будем теснить их назад, ибо их земля станет нашим полем битвы, а их кровь окрасит землю в борьбе за справедливость! Вперед, товарищи!  §RПобеда за нами, ведь революцию не остановить!§!"
 SOVw_Round_up_the_Armed_Forces_desc:0 "Призыв к оружию разнесся по всей стране! Вооружённые силы Советского Союза мобилизованы, готовые защитить честь и суверенитет нашего великого Союза. Родина зовёт своих сынов и дочерей подняться, сражаться с несгибаемым мужеством и непоколебимой решимостью. С прочностью нашей стали и волей народа мы станем плечом к плечу против любого врага, осмелившегося угрожать нашей земле. Революция — наш щит, красный флаг — наше знамя, а наши сердца, пылающие огнём социализма, приведут нас к победе! Каждый солдат, каждый рабочий, каждый товарищ — сегодня мы шагаем вперёд как один!"
 SOVw_One_Last_Push_for_Victory_desc:0 "Опираясь на силу наших товарищей и мощь наших социалистических идеалов, мы будем неустанно идти вперед. Каждый клочок нашей земли, каждый город, каждое село, каждое поле будет отвоёвано и освобождено из рук врагов. Наши танки загремят, словно гром, наша пехота двинется вперёд, как неудержимая волна, а наша артиллерия обрушит безжалостный огонь на захватчиков. Мы сражаемся не просто за границы, а за будущее революции. За каждого рабочего, каждого крестьянина, каждого ребёнка, мечтающего о мире без угнетения."
 SOVw_Rally_the_Workers_of_the_Unions_desc:0 "Перед лицом испытаний, в самой гуще борьбы, рабочие Советского Союза стоят непоколебимо! Не только наши армии, но и сила народа — рабочих, крестьян, строителей — составляют истинный хребет нашего великого социалистического государства. В каждом заводском цехе, в каждой мастерской, на каждом поле мы завершаем свой труд с несгибаемой решимостью, куя будущее своими руками и своим потом. Когда дуют ветры невзгод, когда враги прогресса пытаются нас сломить, мы стоим твёрдо, несгибаемые и нерушимые. Мы знаем, что революция побеждает не только мечом, но и неустанным трудом тех, кто преобразует землю, создаёт богатство и воплощает мечту. Благодаря нашей самоотверженности мы справимся с любыми трудностями, и вместе обеспечим, что ни одна преграда, ни один враг не сломит нашу волю!"
