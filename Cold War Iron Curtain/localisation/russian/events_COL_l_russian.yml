l_russian:
 COL_pol.1.t: "La Violencia"
 COL_pol.1.d: "Хорхе Элисер Гайтан был любимым либеральным кандидатом, считавшимся наиболее вероятным победителем на выборах, пока его не убили сегодня. Вспыхнули беспорядки и грабежи, в результате которых в Боготе погибло около сотни человек. Известное как "Боготазо", консервативное правительство немедленно обвинило в этом колумбийских коммунистов. Жители сельской местности начали брать в руки оружие после хаоса в столице, вызвавшего десятилетнюю гражданскую войну."
 COL_pol.1.a: "Хаос в Колумбии! Партизаны в деревне!"
 COL_pol.2.t: "Формирование FARK-EP"
 COL_pol.2.d: "В 1964 году колумбийские военные атаковали Маркеталию, коммунистический анклав, образованный во времена "Ла Виоленсии", заполненный крестьянскими партизанами. В ответ группы коммунистических партизан и независимых партизан, сочувствующих коммунистическому делу, собрались вместе, чтобы провести "Вторую партизанскую конференцию" в 1966 году. После этой встречи эти партизаны под влиянием членов ПКК Якобо Аренаса и Мануэля Маруланда организовались в FARK. Мы должны действовать до того, как они еще больше разожгут огонь гражданской войны в Колумбии."
 COL_pol.2.a: "Viva La Revolucion!"
 COL_pol.2.a.tt: "Сражайтесь как Колумбийская Социалистическая Республика."
 COL_pol.2.b: "Угроза Республике. Выследить их!"
 COL_pol.2.b.tt: "Сражайтесь как Республика Колумбия."
