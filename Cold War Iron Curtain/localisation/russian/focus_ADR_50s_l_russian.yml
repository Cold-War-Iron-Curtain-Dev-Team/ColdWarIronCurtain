 #focuses 
 ADR_Sovietization_of_Austria: "Советизация Австрии"
 ADR_Sovietization_of_Austria_desc: ""
 ADR_Found_the_ministry_of_culture: "Основать Министерство Культуры"
 ADR_Found_the_ministry_of_culture_desc: ""
 ADR_Embrace_Socialist_Realism: "Продвигать социалистический реализм"
 ADR_Embrace_Socialist_Realism_desc: ""
 ADR_Promote_the_legacy_of_the_failed_1918_coup: "Пропагандировать наследие неудавшегося переворота 1918 года"
 ADR_Promote_the_legacy_of_the_failed_1918_coup_desc: ""
 ADR_Foster_ideals_of_strength_through_unity: "Развивать идеалы силы через единство"
 ADR_Foster_ideals_of_strength_through_unity_desc: ""
 ADR_Enforce_strict_standards_on_the_arts: "Обеспечить соблюдение строгих стандартов в искусстве"
 ADR_Enforce_strict_standards_on_the_arts_desc: ""
 ADR_Pardon_Soviet_Crimes_in_Austria: "Простить советские преступления в Австрии"
 ADR_Pardon_Soviet_Crimes_in_Austria_desc: ""
 ADR_Rehabilitate_the_Rote_Garde: "Реабилитировать Красную Гвардию"
 ADR_Rehabilitate_the_Rote_Garde_desc: ""
 ADR_Intensify_Denazification: "Устранить оставшихся фашистских коллаборационистов"
 ADR_Intensify_Denazification_desc: ""
 ADR_Replace_the_Hitler_Youth_with_the_Pioneers: "Австрийские пионеры"
 ADR_Replace_the_Hitler_Youth_with_the_Pioneers_desc: ""
 ADR_Open_Holocaust_Museums: "Открыть музеи Холокоста"
 ADR_Open_Holocaust_Museums_desc: ""
 ADR_Publish_textbooks_on_Nazi_war_crimes: "Издать учебники о нацистских военных преступлениях"
 ADR_Publish_textbooks_on_Nazi_war_crimes_desc: ""
 ADR_Place_the_remaining_blame_on_the_West_German_Government: "Возложить оставшуюся вину на Западногерманское правительство"
 ADR_Place_the_remaining_blame_on_the_West_German_Government_desc: ""
 ADR_Found_the_Democratic_republic_of_Austria: "Создать Австрийскую Демократическую Республику"
 ADR_Found_the_Democratic_republic_of_Austria_desc: "East Germany has adopted a new name for Itself. No longer are they called Soviet Military Administration in Germany, they have now Proclaimed to be the Deutsche Demokratische Republik, DDR for short. We should take notes of our neighbor and do the same, Proclaiming ourselves to be the Austrian Democratic Republic!"
 ADR_KPO_Uber_Alles: "КПА превыше всех"
 ADR_KPO_Uber_Alles_desc: ""
 ADR_Inauguration_of_General_Secretary_Johann_Koplenig: "Генеральный секретарь Коплениг"
 ADR_Inauguration_of_General_Secretary_Johann_Koplenig_desc: "General Secretary Koplenig has been elected as our First General Secretary, having the monumental task of turning a before Fascist Nation into a Socialist nation where anyone no matter their Ethnicity or Color is Comrade. Not to mention re-establishing diplomatic relations with the World and Reconstructing the ruined Economy. To say Koplenig has a lot on his plate would be a understatement."
 ADR_Denounce_the_division_of_Austria: "Осудить раздел Австрии"
 ADR_Denounce_the_division_of_Austria_desc: "The fact that our Nation just like Germany has to be divided is a disgarce. The allies, Fearing that the Soviets might expand their Influence too far, will rather split us apart between East and West, just because we have been Liberated as a Socialist Goverment. Not to mention that the West Austrians haven´t protested this move at all. Wel unlike them, Koplenig has quite a few words to say about the Division of Austria!"
 ADR_Fully_commit_to_the_international_workers_struggle: "Принять участие в международной борьбе трудящихся"
 ADR_Fully_commit_to_the_international_workers_struggle_desc: "Just like the Soviet Union and the rest of Socialist Genossen, we are hoping to one day liberate all the Workers on Earth and once and for all get rid of Capitalism. It´s of course clear that such a goal is more than monumental and will likely take decades till it´s actually achieved. Meanwhile though we won´t just sit idly by. By commiting to the Workers Struggle, it will be clear to the rest of the Eastern Block and the World that we stand with the Workers and will do anything in our might to support their battle!"
 ADR_European_Comrades: "Европейские товарищи"
 ADR_European_Comrades_desc: "Our European Comrades have been almost fully Liberated just like us by the Soviet Union after the Second World War and showed us how powerful Socialism can be if we only work together. Since our Goverment has only recently been Liberated, it´s only natural that we open Diplomatic talks with the rest of Socialist Europe to discuss trade Agreements and on how we are gonna Liberate the remaining Workers still being Opressed by the Capitalists in the West!"
 ADR_Economic_cooperation_with_our_former_allies: "Экономическое сотрудничество с нашими бывшими союзниками"
 ADR_Economic_cooperation_with_our_former_allies_desc: "Most, if not all of our former Allies have become Socialist just like us. But ever since the dark days of World War Two, we haven´t really had any Talks or Relations with them. That though is a easy problem to fix. Any friendship can be revived at a Feast of Beer and Bratwursts!"
 ADR_Pay_off_Soviet_War_reparations: "Выплата советских военных репараций"
 ADR_Pay_off_Soviet_War_reparations_desc: "The Soviets liberated us but just like anything in Life, it wasn´t for free. The Soviets gave us a hefty debt to repay as Reparations for the damage we and the Germans did during the  Second World War. Including Intrest rates of course. Luckily though, we have a lot save up  and even if our Industry is for now small yet growing, we´ll be able to pay the debt back right now, showing the Soviet Union how much we are dedicated to fixing relationships between our Nations and on how serious we are about the Socialist cause."
 ADR_Asian_Comrades: "Азиатские товарищи"
 ADR_Asian_Comrades_desc: "Unsuprisingly, Europe wasn´t the only part of the World to have a explosion in Socialist Nations and Movements. From the PRC that kicked out the old Nationalist Goverment and pushed it out of the Mainland, to the Korean Peninsula that is, just like us, split in half. Which doesn´t seem to stop them from holding onto their Socialist Beliefs still."
 ADR_Recognize_North_Vietnam: "Признать северный Вьетнам"
 ADR_Recognize_North_Vietnam_desc: "North Vietnam is just like North Korea, a Socialist nation that is in a fight with it´s Nationalist counterpart. Even if we have been sending them Weapons and supplies, it just doesn´t feel like we have done enough. Then it dawned upon us. We still haven´t recognized them as the Legitimate Rulers of Vietnam! We´ll do that right away!"
 ADR_Establish_relations_with_Kim_and_Mao: "Наладить отношения с Кимом и Мао"
 ADR_Establish_relations_with_Kim_and_Mao_desc: "Let´s not walk around hot Borscht. China and North Korea have been the Elephant in the room for a long time. From the Chinese Civil War to the korean Unification War. Them being the Biggest Socialist Powers in Asia, not including Vietnam which will be tackled on it´s own later, we´ll contact both Goverments and attempt to Establish Relations in the name of Socialism!"
 ADR_From_an_economic_partnership_with_our_old_subjects: "От экономического партнерства с нашими старыми субъектами"
 ADR_From_an_economic_partnership_with_our_old_subjects_desc: "The Goal of the so called Volkswirtschaftspakt will be to emulate the raw Industrial Power and scale just like the Austria-Hungary of old. Obviously this time it will be to benefit the Workers instead of a Elite Aristocracy. For now the Volkswirtschaftspakt is miniscule, but with time and effort it can grow into a economic powerhouse!"
 ADR_Begin_reconstruction: "Начать реконструкцию"
 ADR_Begin_reconstruction_desc: "It´s no surprise to say that our Industry isn´t in the best shape it could be after the War. Not to fear though. Koplenig will start the Reconstruction of the entire Industry, fixing bombed out Homes and factories, until East Austria is healed from the Scars of the Second World war."
 ADR_Beg_the_Soviets_to_return_stolen_industry: "Попросить Советы вернуть украденную промышленность"
 ADR_Beg_the_Soviets_to_return_stolen_industry_desc: "The Soviets occupied some of our Industry as they were pushing deeper and deeper into our nation during the war, confiscating Industry and using it to Produce goods for their Troops in field. Now that the war is over though, we´ll kindly ask them if they would be willing to let us buy back the before mentioned Industry."
 ADR_Request_East_German_Industrial_Aid: "Запросить промышленную помощь у Восточной Германии"
 ADR_Request_East_German_Industrial_Aid_desc: "While we are Reconstructing our Industry, the idea has been proposed that we ask our fellow Socialist East German brothers for Industrial Aid. The East Germans will be more than eager to help us out we are sure of that. The sight of fellow Socialist Germans might even show our populace how great Socialism is in bringing us together!"
 ADR_Fully_commit_to_collectivization: "Начать коллективизацию"
 ADR_Fully_commit_to_collectivization_desc: "Even if some might find Collectivization to be cruel, claiming that we are seizing land that was earned by workers and not by greedy Landlords, it´s still a good policy to enact. After all, if the land is in the hands of the State, it will be better protected and reach it´s full it´s potential with our financial aid."
 ADR_Import_grain_to_stop_food_riots: "Импортировать зерна для прекращения продовольственных бунтов"
 ADR_Import_grain_to_stop_food_riots_desc: "Our Agricultural Industry had been struggling. Most of our farmlands are still mostly craters from Allied Bombings. And it´s taking the crops a while to grow before they can be properly harvested. Understandably the workers are not happy with not having any food on the plate and have understandably began to strike. They do not need to worry anymore though, as we have signed trade deals to have food Imported from our Socialist neighbors and ration this food, until the food situation at home is fixed."
 ADR_Modernize_machine_tooling: "Модернизация станков"
 ADR_Modernize_machine_tooling_desc: "Now that the Industry is getting back into shape, we have encountered another problem. Most of our tools are very outdated and most of them don´t even work anymore! This is in certain ways a hidden blessing, as we can begin to replacing those outdated tools with new Machine Tools that will increase efficiency and make the work easier for our Workers!"
 ADR_Housing_expansion_in_Vienna: "Постройка жилья в Вене"
 ADR_Housing_expansion_in_Vienna_desc: "Vienna is a giant city. Or at least it was until it was just like Berlin split into two, giving us the less developed side while giving the West the best parts. East Wien, being more rural than the West, thus it will have it´s housing Expanded to give all our workers a roof over their head!"
 ADR_Jumpstart_heavy_industry_in_Burgen-land: "Толчок для тяжёлой индустрии в Бургенланде"
 ADR_Jumpstart_heavy_industry_in_Burgen-land_desc: "The Heavy Industry has boomed during the war, but eventually it became the target of allied bombings. As of now we currently have no Heavy Industry in service. With the West threathening our Borders every day, it´s only logical we restore weapon production to defend our borders."
 ADR_Launch_show_trials: "Запуск показательных испытаний"
 ADR_Launch_show_trials_desc: "Even if the nation has been rid largely if not entirely of Fascist Influence, there remain still a few enemies in our Nation and Goverment. The first step of taking back control from these Traitors, we will be launching Trials in which they will be Prosecuted for their Anti-Revolutionary behavior."
 ADR_Kill_Heinrich_Gross: "Убить Генриха Гросса"
 ADR_Kill_Heinrich_Gross_desc: "Heinrich Gross is a Austrian Psychiatrist, medical Doctor and Neurologist, that during the second World War was charged and proven in Involvement of killing at Least 9 Children through different methods. Children that were deemed unclean by the Nazi regime at that. To finally avenge the Innocent children by Executing this monster!"
 ADR_Execute_Traitorous_Officers: "Казнить офицеров-предателей"
 ADR_Execute_Traitorous_Officers_desc: "Amongst our ranks, there still remain Traitorous Officers that would prefer if we were ruled by West Austria or who are just not loyal to our cause in General. Our Proud Socialist Forces cannot have these traitors in charge of anything! They will be Purged through suspensions,Retirements or Firing Squads!"
 ADR_Obtain_confessions_from_disloyal_Intelligentsia: "Получить признание от нелояльной интеллигенции"
 ADR_Obtain_confessions_from_disloyal_Intelligentsia_desc: "For a while now, our Loyal Agents in the Austrian Stasi have been Interrogating disloyal Agents. And now, after having finally broken their spirits we have Obtained Confessions of their- and others Anti-Socialist Behavior. With these Confessions, we´ll have solid evidence in dealing with them."
 ADR_Return_White_Army_soldiers_in_exile_to_the_Soviet_Union: "Вернуть солдат Белой армии в Советский Союз"
 ADR_Return_White_Army_soldiers_in_exile_to_the_Soviet_Union_desc: "After the Bolshevik victory in the Russian Civil War, a bunch of White Army Soldiers decided to settle down in Austria. Not many of them are left since many have either moved on or died from old Age. But there remain a small number of those who are still in the nation. With the Nation being Socialist just like the Soviet Union, it is only logical for us to return these White Army Soldiers to the Motherland."
 ADR_Delegitimize_the_Reunification_Faction: "Делегитимизировать фракцию воссоединения"
 ADR_Delegitimize_the_Reunification_Faction_desc: "In the Nation, there is a Faction that is attempting to convince our populace to support the Reunification with the West. Generally there is nothing wrong with that, as we´d love to Reunify with the West as well!...But only if that meant that the nation would remain Socialist, a thing that this Faction ignores, wanting Unification at any cost. It remains rather small at the moment, but it cannot be risked that they may grow. Efforts will be made to Delegitimize this faction, and convince the Workers not to join them."
 ADR_Declare_Lothar_Rendulic_Innocent_to_appear_objective: "Объявить Лотара Рендулича невиновным, чтобы казаться объективными"
 ADR_Declare_Lothar_Rendulic_Innocent_to_appear_objective_desc: "Lother Rendulic was a Oberst in the Austrian Armed Forces in the 1920s. For a time he was put on the Temporary invactive list due to his involvment in the banned Nazi party. After the war he was charged with Scorched earth tactics and of killing hostages in Yugoslavia. To appear Objective to the rest of the world, we will declare him Innocent. The last thing the nation in General needs is another Austrian being blamed for Nazi War crimes..."
 ADR_Form_the_Austrian_STASI: "Создать австрийское Штази"
 ADR_Form_the_Austrian_STASI_desc: "The Austrian Stasi has in large part been inspired by the Ruthless German Version. We have been impressed on how disciplined and Trained the Stasi in East Germany is. With a Intelligence Service like this, Austria would be safe from any Western Internal threats. We´ll try to replicate the German Stasi, Hopefully making ours just as efficient!"
 ADR_Begin_wiretapping: "Начать прослушку"
 ADR_Begin_wiretapping_desc: "There are still many Fascists and Class Enemies in our state that are currently in hiding, calling eachother and plotting to Overthrow us or to smuggle in Western propaganda. To keep the regime safe, it will be permitted that our Stasi begins Wiretapping our Workers, in case one of them is a spy."
 ADR_Create_a_national_Database_of_untrustworthy_people: "Создать национальную базу данных неблагонадежных людей"
 ADR_Create_a_national_Database_of_untrustworthy_people_desc: "A National Database. Words that only years ago would confuse anyone you´d talk to and even in a likely case send you to a Insane Asylum. But now, with the technology such as the Computer getting more and more advanced, these words actually mean something. We´ll establish a National Database of Untrustworthy People that have in the past acted strangely. This will make it easier for us to find our enemies."
 ADR_Infiltrate_Cooperatives: "Проникнуть в кооперативы"
 ADR_Infiltrate_Cooperatives_desc: "Even if we generally trust our collectives, as we have Established them ourselves. But there´s always the chance that a spy slipped by us. That´s why to make sure our Collectives truly are acting in the name of the Workers and Socialism, we´ll smuggle in some of our men who are definitely loyal to us that will report any Anti-Revolutionary behavior."
 ADR_Make_Dissidents_disappear: "Заставить диссидентов исчезнуть"
 ADR_Make_Dissidents_disappear_desc: "We have thanks to the Wiretapping and our Cnetral Database found many enemies and Dissidents. Now that we know who these people are, it´s time to deal with them. Slowly one by one, we´ll make the dissapear from the Public eye."
 ADR_Develop_special_interrogation_tactics: "Разработать особую тактику допроса"
 ADR_Develop_special_interrogation_tactics_desc: "Having found the spies and Dissidents is all good. But the problems arise when trying to find out who else is part of their operations or for who they are working for. And even if some Interrogation methods work, many are so widely known by now they simply have no effect anymore. That´s why need to develop new Special Interrogation methods. Ones that haven´t been seen before and that our captives won´t expect and can´t resist to."
 ADR_Exchange_data_with_our_German_comrades: "Обмен данными с нашими немецкими товарищами"
 ADR_Exchange_data_with_our_German_comrades_desc: "As our Intelligence Agencies share the same name, it shouldn´t come to anyones surprise that we also share Data and Knowledge with our East German Comrades. By Intergrating eachothers knowledge of possible State enemies and Interrogation methods, we´ll make eachother more efficient in hunting down Anti-Revolutionary elements."
 ADR_Begin_the_first_5-year_plan: "Начать первый пятилетний план"
 ADR_Begin_the_first_5-year_plan_desc: "The 20th Congress of the CPSU has been recently held and Unsuprisingly after Stalin´s death many changes have been announced. Before we deal with them though, it´s Important that we continue expanding our Industry. We are gonna do this, by starting our First Five Year Plan!"
 ADR_The_Austrian_Red_Army: "Австрийская красная армия"
 ADR_The_Austrian_Red_Army_desc: "The Austrian Army, or what remains of it, has inherited the last few soldiers that survived the second war and joined our regime are the most hardened fighter one can have. But of course that isn´t the only thing that counts. We´ll have to take a close look at each branch and see if there are any reforms required, which let´s be honest they very likely are."
 ADR_The_Austrian_Red_Airforce: "Австрийские красные ВВС"
 ADR_The_Austrian_Red_Airforce_desc: "Our Red Air Force!.....That doesn´t exist. Not yet at least. We have Pilots, but it seems like the planes were in the West when the nation became divided. Looks like we´ll have to start from scratch."
 ADR_Purchase_Soviet_Yaks: "Покупка советских ЯКов"
 ADR_Purchase_Soviet_Yaks_desc: "Soviet Yak Fighters are, from experience, quite powerful fighters. They might not be the most modern plane at this point, but we know the soviets want to slowly get rid of them to free up space for newer models. So buying them seems like the best option for us."
 ADR_Expand_the_Air_Defense_Capabilities: "Попросить советские МИГи"
 ADR_Expand_the_Air_Defense_Capabilities_desc: "The Soviet MiG-15 are amazing piece of Engineering. They can serve as fighter but also as Close Air support. Only problem is that we don´t have the Industry to build them, so we´ll ask the Soviets for some!"
 ADR_Construct_Airstrips_in_Ost-Wien: "Построить взлетно-посадочные полосы в Ост-Вене"
 ADR_Construct_Airstrips_in_Ost-Wien_desc: "While having planes now is nice, we still do not have a Airport where we could store and launch the Airplanes from. It was proposed that a construction of Airstrips should commence and be built in Ost-Wien."
 ADR_Begin_development_on_our_own_Fighters: "Начать разработку наших собственных истребителей"
 ADR_Begin_development_on_our_own_Fighters_desc: "Our Air Force is finally established! Thanks to the Soviets, we now have actual Planes that are able to defend the nation. But we cannot forever keep buying planes from the Eastern Block. Instead we will focus on developing our own Planes!"
 ADR_The_Austrian_Red_Army_Ground_Force: "Сухопутные войска Австрийской Красной армии"
 ADR_The_Austrian_Red_Army_Ground_Force_desc: "The Austrian Armed Ground Forces are what keeps the West at bay. Combined of Veternas and volunteers, they stand guard at the Western Borders and in West Wien, making sure no one tries to illegally enter or escape."
 ADR_Utilize_captured_German_equipment: "Использовать трофейную немецкую технику"
 ADR_Utilize_captured_German_equipment_desc: "At the end of The Second World War, the fleeing Nazis left back a bunch of Equipment as they couldn´t pack it all up, with the Allied and Soviet Forces rapidly approaching. This Equipment is surprisngly still around. And since it´s in working condition, it will be of great use for our armed forces."
 ADR_Import_Soviet_Armor: "Импорт советской бронетехники"
 ADR_Import_Soviet_Armor_desc: "Tanks are ever since World War One, a true beast on the battlefied, completely changing how wars happen. We are in a era where thanks are a must for a real army, be it to only defend it´s borders or to invade another country. Our nation does not have any, if we don´t count the few ones that were left over from the Nazis. Thankfully though, the Soviets offered to give us some as we are after all, on the Frontline with the West."
 ADR_Reinvigorate_gun_manufacturing_and_research: "Активизировать производство и исследования оружия"
 ADR_Reinvigorate_gun_manufacturing_and_research_desc: "For too long have our Weapon Manufacturing Plants laid abandoned and unused. Our new Socialist Army needs guns! These Plants will be brought back to life, producing only the finest weapons for our Army!"
 ADR_The_First_line_of_Defense: "Первая линия обороны"
 ADR_The_First_line_of_Defense_desc: "Just like the DDR, we are the Frontline against Capitalism and the West. We are the First Line of Defense and we have to act like it! Should the West try to invade the Eastern Block, our Workers and Armed Forces will do our best to slow them down or stop them as long as possible until the Motherlands Armed Forces arrive!"
 ADR_The_Austrian_Air_Defence_Force: "Австрийские силы ПВО"
 ADR_The_Austrian_Air_Defence_Force_desc: "Even if we don´t have a navy, we have the Air Defense Force. During the Second World War our nation has been heavily bombarded by the Allies. Fortunately most, if not all damage was fixed. But that does not mean we can let it happen again! The Air Defense Forces task is to keep the Skies clean of any more Enemy Fighters and Bombers, Protecting our Civilian Population and our many historic buildings!"
 ADR_Buy_portable_anti-aircraft_equipment: "Купить переносное зенитное оборудование"
 ADR_Buy_portable_anti-aircraft_equipment_desc: "Our capital and our lands in general lack Anti-Air Structures. We could of course start building them but who knows if they would be ready by the time the West attacks? Or that they wouldn´t swiftly be destroyed? No instead of building Stationary Anti-Air positions, we´ll buy Portable Anti-Aircraft Equipment and equip the Air Defense Forces with it."
 ADR_Construct_long_range_RADAR_on_the_west_Austrian_border: "Построить радар на границе с Западной Австрией"
 ADR_Construct_long_range_RADAR_on_the_west_Austrian_border_desc: "The Radar is a wonderful technological Miracle. Through Radar stations, it´s able to notice enemy Aircraft in it´s range and give us either it´s exact or approximate position. Having the know-how to construct these Radar stations, we´ll place some on the West Austrian Border."
 ADR_Build_Blast_shelters_in_urban_areas: "Построить противовоздушные укрытия в городских районах"
 ADR_Build_Blast_shelters_in_urban_areas_desc: "Even if there are now weapons and Radars, protecting us as best as they can from bombings or worse, there are still fears of what could happen if both fail. It was proposed that, just in case, Blast shelters should be constructed in Urban Areas. A measure to ensure that in case of Bombings or even, nuclear Armageddon, at the very least part of our Population survives."
 ADR_Begin_Development_on_short_range_SAM_systems: "Начать разработку ЗРК малой дальности"
 ADR_Begin_Development_on_short_range_SAM_systems_desc: "SAM Systems are short range Air Defense vehicles, designed to shoot down any Aircraft or Missiles that it locates. Even if we don´t have any right now, that doesn´t stop us from Investing into researching them and eventually getting our own."
 ADR_Establish_the_ministry_of_worker_wellbeing: "Создать Министерство Благосостояния Трудящихся"
 ADR_Establish_the_ministry_of_worker_wellbeing_desc: "Even if it does sound like something from the Book 1984, it´s nothing like that! The Ministries task is to listen to workers and Trade Unions wishes and make sure the workers are safe and are treated fairly."
 ADR_Begin_Mass_production_of_Trabants: "Начать массовое производство Трабанта"
 ADR_Begin_Mass_production_of_Trabants_desc: "The Trabant is a beatiful car. And it´s robust too. Developed in East Germany, it didn´t take long for the car to get a cult following of sorts. Even some of our own workers managed to get a Trabant from East Germany, but it´s a rare sight. That can be changed though! The East German goverment will be asked if they would be willing to license the Trabant to us, letting us build our own Trabants!"
 ADR_Secure_additional_funds_from_Moscow: "Улучшение методов распределения поставок в сельских районах"
 ADR_Secure_additional_funds_from_Moscow_desc: "In the Rural Areas of East Austria many of our supply Routes to villages and small towns are very outdated to the point that it´s very difficult to ensure steady supply. A attempt will be made to ask the Soviets if they could spare some funds so we can bring the Supply Distribution Methods into better shape. This will be the needed development to also finally solve the food situation and put an end to Rationing."
 ADR_Increase_production_of_hygiene_products: "Увеличение производства средств гигиены"
 ADR_Increase_production_of_hygiene_products_desc: "A suprisingly lacking product in our nation are.....Hygiene products. Soap, shower gel and such. This problem is a easy fix though. The Production of Hygiene Products will simply be increased. We´ll also use this opportunity to start a Hygiene campaign to teach the Population, how to properly keep their bodies in fresh shape!"
 ADR_Provide_cooking_equipment_to_shorten_breadlines: "Предоставить кухонное оборудование для сокращения готовки"
 ADR_Provide_cooking_equipment_to_shorten_breadlines_desc: "Even if we made efforts to stop the Food shortage, it isn´t enough yet. The next step in our efforts is to Provide Cooking Equipment to the Breadline cooks, hopefully thus making it easier to make more bread faster for the hungry workers"
 ADR_Open_toy_factories_in_northern_Austria: "Kinderpanzer"
 ADR_Open_toy_factories_in_northern_Austria_desc: "What better way to earn a childs love that giving them a tank? That´s basically how to sum up the proposal that was made to the Goverment today. It was proposed to open toy factories that would produce among other things the now dubbed Kinderpanzer. Of course it wouldn´t be a real tank, but it would be big enough to let the children sit inside. A great toy and a great way to inspire future tankists!"
 ADR_Sell_consumer_goods_to_the_eastern_bloc: "Продавать товары народного потребления в Восточный блок"
 ADR_Sell_consumer_goods_to_the_eastern_bloc_desc: "A great way to support our economy and to show the rest of Eastern Block how wonderful East Austrian products are, our products will now be exported all over the Eastern Block. From Prague to Berlin, Warsaw, Sofia and beyond!"
 ADR_Boost_heavy_industry: "Поднять тяжелую промышленность"
 ADR_Boost_heavy_industry_desc: "Another step in making the Austrian Economy grow, is to open more Heavy Industry that will produce finest reliable weapons and Motorized vehicles, maybe even planes for the armed forces. And the equipment that remains can always be sold to the rest of the Eastern Block!"
 ADR_Begin_infrastructure_efforts: "Начать работу с инфраструктурой"
 ADR_Begin_infrastructure_efforts_desc: "The Plieseis Railway Network is a long due part of our Infrastructure plan. A large part of the nation has, ever since we were liberated from the Capitalists and honestly even before the second World War, had very poor Infrastructure. With the Railway Plieseis, this problem will hopefully become a thing of the past."
 ADR_Adopt_the_khrushchyovka: "Адаптировать Хрущёвки"
 ADR_Adopt_the_khrushchyovka_desc: "The Khrushchyovka named after Nikita Kruschev, is a Apartment building that is build from already pre-made panels that are put together. This allows the houses to build extremely quickly! By Adopting it, our Civilian Population will have more than enough houses and place for their children to start their own families!"
 ADR_Pave_every_road: "Соединить нацию"
 ADR_Pave_every_road_desc: "Tha nazis were bad. But their Autobahn project was a big succes. It helped connect Germany through a wide road Network. And something like that would be more than welcome here in East Austria. If we ask East Germany, they might be willing to help us to replicate the Autobahn here in East Austria."
 ADR_Build_munitions_plants_in_Vienna: "Строительство заводов по производству боеприпасов в Вене"
 ADR_Build_munitions_plants_in_Vienna_desc: "Now that we have Weapons thanks to our Heavy Industry. A small problem arose. We do not have munition for our Weapons...We´ll build a few more factories to produce said Munition."
 ADR_Build_forts_along_the_West_Austrian_Border: "Построить укрепления вдоль всей западной границы"
 ADR_Build_forts_along_the_West_Austrian_Border_desc: "Our border with West Austria is generally unprotected. We do have troops stationed at it, making sure no spy or Saboteur tries to sneak in. But that simply isn´t enough. A plan has thus been proposed and accepted, in which we will be building Fortifications along the Western Border. That should step those West Austrians from trying to sneak in!"
 ADR_Expand_existing_factories: "Расширить существующие фабрики"
 ADR_Expand_existing_factories_desc: "As we come close to finishing our First Five Year Plan, one last issue arose. A Automobile plant is to be soon constructed in Burgenland. And it hasn´t been decided what name should be given to this Automobile Plant. Until Genosse Koplenig stepped in that is! With his blessing, it was decided that it will be named the Karl Marx Automobile Plant!"
 ADR_Found_Unit_7_to_negate_chronic_manpower_shortages: "Создать Блок 7 для устранения хронической нехватки рабочей силы"
 ADR_Found_Unit_7_to_negate_chronic_manpower_shortages_desc: "Unfortunately, just like in East Germany and the Soviet Union itself, we have been suffering from Manpower Shortages due to many of our Workers and Citizens preferring to flee to the West instead of giving Socialism a chance. To combat this problem, Unit 7 will be created to deal with this issue."
 ADR_Research_Weaponized_computer_systems: "Исследование Оружейных Компьютерных Систем"
 ADR_Research_Weaponized_computer_systems_desc: "The Computer, a very new Machine that has slowly been spreading, has also been gaining more and more ways of how to be Weaponized. Already Major Powers such as Britain, US, PRC and USSR have been researching and Adopting the Computer. We may not be as big as the examples given, but that will not stop us from starting our own Research inot Weaponized Computer Systems!"
 ADR_An_Austrian_Kalashnikov: "Австрийский Калашников"
 ADR_An_Austrian_Kalashnikov_desc: "The Soviet Soldiers that are stationed along with our Troops at the Western Borders, have been seen carrying something that caught the eyes of our Generals and Soldiers. A new weapon they dubbed the Kalashnikov. Having gotten our hands on a few from our Soviet comrades, we will research the components in them and produce our own version. The Austrian Kalashnikov."
 ADR_Request_Soviet_missile_blueprints: "Создание исследовательских центров по ракетам малой дальности"
 ADR_Request_Soviet_missile_blueprints_desc: "Being on the border with the West, a idea came up in the Goverment and Armed Forces to request Blueprints for Short Range Missilies from the Soviet Union. With these we could start our Research Facilities and one day create our own and point them at the West. To Demonstrate that they will be crushed if they dare attack us!"
 ADR_Begin_heavy_artillery_production: "Провести массовые военные учения"
 ADR_Begin_heavy_artillery_production_desc: "Our Armed Forces, that have existed only for a few years now, have been slowly getting more and more Profesional. They are truling becoming a force to be reckoned with. To help them in getting better and better, we will organize Extensive Military Drills."
 ADR_20th_congress_of_the_CPSU: "20-й съезд КПСС"
 ADR_20th_congress_of_the_CPSU_desc: "The 20th CPSU Congress is being held, in which the future of the Soviet Union and the Eastern Block will be discussed. We will obviously fly to Moscow and participate! This will also be the First Congress where comrade Stalin is no longer in charge of and his Successor will be speaking for the First time!"
 ADR_Begin_the_second_5-year_plan: "Начать второй пятилетний план"
 ADR_Begin_the_second_5-year_plan_desc: "With our First 5-Year Plan being a huge success, it is time we begin the Second Five Year Plan! This one will be focused on expanding our Industry further, as well as Modernizing different aspects of the Industry."
 ADR_Expand_light_industry: "Расширить легкую промышленность"
 ADR_Expand_light_industry_desc: "Light Industry is crucial to a nation. It produces many products our workers need in their daily life as well as creating Workspace for said workers. So it makes more than enough sense why we´d want to expand our small Light Industry sector!"
 ADR_Expand_heavy_industry: "Расширить тяжёлую промышленность"
 ADR_Expand_heavy_industry_desc: "The Industrial sector that makes sure we have something to protect Socialism with is our Heavy Industry sector. It has been supplying our Army with munition and Weapons for a few years now. But with our Army constantly growing as more and more eager Socialist Genossen sign up to guard the borders, the demand for more Weapons increases with them. Which is why the Heavy Industry sector is going to be expanded."
 ADR_Modernize_tooling: "Модернизация инструментов"
 ADR_Modernize_tooling_desc: "A factory that wishes to achieve maximum Productivity needs tools that are up to stand with modern times. Ours are currently not. Most of them are still from the Second World War and some are even older than that. Safe to say it is about time the Tools get replaced by new ones."
 ADR_Purchase_Soviet_Lavochkins: "Покупка советских Лавочкиных"
 ADR_Purchase_Soviet_Lavochkins_desc: "In order to boost our Air Force more, we need more planes. Sadly we cannot currently build a sufficient amount ourselves. So we´ll buy more from the Soviets."
 ADR_Increase_fertilizer_production: "Увеличение производства удобрений"
 ADR_Increase_fertilizer_production_desc: "Farming food has been a very important part of the nation´s Industry in the rural areas. But since most of the Farmlands are in the West, it´s important that we find a way how to keep up with our Poulations demand. And one solution that was agreed upon was the Increase of Fertilizer."
 ADR_Open_the_Renner_mine_in_Upper_Austria: "Открыть рудник Реннер в Верхней Австрии"
 ADR_Open_the_Renner_mine_in_Upper_Austria_desc: "East Germany and Poland have been slapping names of famous Socialists and their Leaders on Industrial Buildings and Mills for a while now. And it is about we time we do something similar. With a new Mine opening soon in Upper Austria, it was decided to name it the Karl Renner Mine, after our beloved Politican Karl Renner himself"
 ADR_Introduce_quality_of_life_products_in_stores: "Поставлять в магазины продукты высокого качества"
 ADR_Introduce_quality_of_life_products_in_stores_desc: "Our Workers have been working hard in the Factories, on the fields and in Labs. Doing their best to help us achieve a perfect Socialist Society, not asking anything in return. But we of course want to thank the workers for their hard work. That´s why more Quality of Life Products will start appearing in store Shelves!"
 ADR_Ramp_up_war_production: "Наращивать военное производство"
 ADR_Ramp_up_war_production_desc: "The sad truth is, that the world went from World War Two to the Cold War. A much more Higher staked war, in which if one was to shoot first, it would mean the end of the world. Soldiers stand on both sides of the Iron Curtain, waiting if today would be the day that the Higher Ups give the command to attack. We do so too. Ramping up our War Production is only logical."
 ADR_Build_more_cars_in_Upper_Austria: "Выделить больше земли под сельское хозяйство"
 ADR_Build_more_cars_in_Upper_Austria_desc: "To make sure that in the future the children of our Children have enough food. That the population will not have to suffer a famine or lack of food. This will be done by Allocating more Land to Farming."
 ADR_Open_Tractor_plants_in_Burgunland: "Открыть тракторные заводы в Бургенланде"
 ADR_Open_Tractor_plants_in_Burgunland_desc: "Placing more and more Focus on farming, the next step now is to give the Farmers more Equipment like the Tractor. The Tractor is the best Friend of a Farmer, sparing them from having to walk around with a Scythe in the burning sun. With the Tractor demand increasing, a new plant in Burgenland will be constructed."
 ADR_Use_soviet_industry_to_build_MBTs: "Субсидирование сельского хозяйства в сельской местности"
 DR_Use_soviet_industry_to_build_MBTs_desc: "More and more Farms are opening up all over the country, with many new farmers seeing that with our recent Investments it has been becoming a very tempting and modern Field to work in. To attract even more new farmers, we´ll Subsidize the farmers as well to our already huge investments into Farming sector."
 ADR_Tighten_control: "Начать сворачивать репрессии со стороны государства"
 ADR_Tighten_control_desc: "With the State Police having been cleaning and getting rid of Traitors and Dissidents, Koplenig feels like it´s time to roll back State Repression as many of the state enemies have been either gotten rid of or fled the country."
 ADR_Purge_Theodor_Kroner: "Уволить Теодора Корнера"
 ADR_Purge_Theodor_Kroner_desc: "Theodor Korner was a man that returned to our nation to supposedly help us rebuild our Capital Ost-Vienna. But since then, he has become a Critic of how we are doing things. And at this point Koplenig is sick of it, announcing that Theodor Korner is being dismissed from the Goverment."
 ADR_Use_the_Ministry_of_Worker_wellbeing_as_a_front_for_domestic_surveillance: "Улучшение надзора Штази"
 ADR_Use_the_Ministry_of_Worker_wellbeing_as_a_front_for_domestic_surveillance_desc: "Our Stasi has been working tiredlessly ever since it was founded to protect state and state Interests. And we are very thankful to them for that! So thankful in fact, that it was decided to Increase their Power and Funding, making them even more effective!"
 ADR_Build_monuments_to_Karl_Renner: "Построить памятники Карлу Реннеру"
 ADR_Build_monuments_to_Karl_Renner_desc: "The so called Father of the Republic and former chancellor, is a very well know figure in Austria to say the least. In 1945 he was also the Leader of a Soviet Established Provisional Goverments. He was basically the General Secretary of East Austria before our Democratic Republic was even a thing! And it is about time we give the Father of the Republic his well deserved Monuments!"
 ADR_Foster_East_Austrian_nationalism: "Поддерживать порядок с помощью восточно-австрийского национализма"
 ADR_Foster_East_Austrian_nationalism_desc: "Now yes. Fascism and Nationalism are generally bad. But if we keep Nationalism in control and make sure it benefits us and the workers it should be harmless! Besides this will be East Austrian Nationalism. Totally different from regular Nationalism!"
 ADR_Hunt_down_supporters_of_the_Coup_attempt: "Продолжить массовое наблюдение Штази"
 ADR_Hunt_down_supporters_of_the_Coup_attempt_desc: "With the Stasi having more funding, we can continue the Mass Surveillance of potential state enemies. As well as keep an eye out on any future Traitors of Socialism."
 ADR_Reaffirm_our_loyalty_to_Moscow: "Подтвердить нашу преданность Москве"
 ADR_Reaffirm_our_loyalty_to_Moscow_desc: "With some of our neighbors trying to break free from Soviet Union, its not suprising that the Soviets are getting worried of who is loyal and who is not. We are in forever debt to the Soviets for liberating us from Capitalism and Reaffirming or Loyalty to Moscow is the least we can do!"
 ADR_Join_the_UN: "Вступить в ООН"
 ADR_Join_the_UN_desc: "To help us make some more Bread for the workers, we need more Grain. Sadly our Farmers aren´t ready just yet to provide, so in the meantime we will ask the Soviets if they could send us some Additional Grain Shipments."
 ADR_Request_Comecon_Aid: "Попросить помощи СЭВ"
 ADR_Request_Comecon_Aid_desc: "The West has been using the benefits the Marshall plan gave them to help rebuild and drag them further into the claws of Capitalism. We might not have gotten the Marshall Plan, but the Soviets provided something better. The COMECON! Similar to Marshall Plan but with Socialist Flavor. With us being very Loyal to Moscow, it should be easy to get some funding."
 ADR_Stability_once_more: "Объявить Восточную Австрию образцовым социалистическим государством"
 ADR_Stability_once_more_desc: "The Road here was long. And the Road ahead is still long. But Koplenig has given it so far his best to transform Austria into a truly Socialist State. And after years of Sweat, Blood and Tears, we can proudly announce to the World that Austria is a Perfect True Socialist State!"
