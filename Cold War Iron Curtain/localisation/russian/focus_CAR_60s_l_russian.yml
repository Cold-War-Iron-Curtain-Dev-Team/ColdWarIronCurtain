l_russian:
 CAR_60s_The_State_of_the_Economy: "Состояние нашей экономики"
 CAR_60s_The_State_of_the_Economy_desc: "Французы оставили нам очень небольшое количество путей развития экономики. Стоит разобраться, как мы можем исправить данную ситуацию."
 CAR_60s_Public_Transportation: "Общественный транспорт"
 CAR_60s_Public_Transportation_desc: "Банги - сердце нашей страны, а так же центр нашего небольшого индустриального бума. Мы должны поддержать данный бум развитием автобусного сообщения в важных районах страны."
 CAR_Revitalization_of_Bangui: "Возродить Банги"
 CAR_60s_Revitalization_of_Bangui: "Реконструкция Банги"
 CAR_60s_Revitalization_of_Bangui_desc: "Жизненная сила нашей столицы - Банги, была украдена колонистами. Сейчас же, мы можем отстроить этот город заново."
 CAR_60s_Ferry_Services: "Паромной сообщение"
 CAR_60s_Ferry_Services_desc: "Огромная часть нашей страны использует реки для передвижения по стране. Необходимо упростить жизнь людям, создав паромное сообщение."
 CAR_60s_Sponsor_Local_Cultural_Festivals: "Спонсирование местной культуры"
 CAR_60s_Sponsor_Local_Cultural_Festivals_desc: "Колониальное право похоронило память о нашей культуре. Сейчас у нас есть шанс воскресить её."
 CAR_60s_National_Orchestra: "Национальный оркестр"
 CAR_60s_National_Orchestra_desc: "У большинства развитых держав есть свои оркестры. Если мы хотим равняться на европейские державы, нам придется учредить свой."
 CAR_60s_Ubangi_River_Infrastructure: "Инфраструктура реки Убанги"
 CAR_60s_Ubangi_River_Infrastructure_desc: "Убанги - одна из важнейших артерий коммуникации и торговли в стране. Её инфраструктура нуждается в дальнейшем развитии, если мы хотим контролировать страну."
 CAR_60s_Focus_on_Bangui: "Акцент на Банги"
 CAR_60s_Focus_on_Bangui_desc: "Банги - место активного развития нашей страны, наша столица. Децентрализация не наш метод, ведь она ведёт к восстаниям и неподчинению. Собственно поэтому и ресурсы страны должны быть сконцентрированны здесь."
 CAR_60s_All_Roads_lead_to_Bangui: "Все дороги ведут в Банги"
 CAR_60s_All_Roads_lead_to_Bangui_desc: "Банги - сердце нашей нации. Место, где наши люди могут и должны процветать и чувствовать себя в безопастности. "
 CAR_60s_Equalize_Development: "Развитие для всех"
 CAR_60s_Equalize_Development_desc: "Каждый человек должен иметь шанс вырваться из нищеты, а потому приоритетной задачей является развитие социальной лестницы по всей стране."
 CAR_60s_Roads_to_Diamonds: "Дорога к алмазам"
 CAR_60s_Roads_to_Diamonds_desc: "Мы должны поощрять охоту за драгоценностями, развивая нашу транспортную сеть. Это ускорит наш экспорт и так же будет гарантом того, что каждый может обрести здесь своё богатство."
  
 CAR_60s_Independence_from_Equatorial_Africa: "Пост-экваториальное независимое государство"
 CAR_60s_Independence_from_Equatorial_Africa_desc: "Итак, огромное влияние язычников во власти уменьшилось, и теперь мы можем запустить процесс деколонизации на полную."
 CAR_60s_De_Gentillesation: "Искоренение язычества"
 CAR_60s_De_Gentillesation_desc: "Все следы нашего жестокого реакционного прошлого должны исчезнуть из анналов истории."
  
 CAR_60s_Independence_from_France: "Независимость от Франции"
 CAR_60s_Independence_from_France_desc: "В соответствии с деколонизацией, у нас есть независимость. И пришло время исправить ошибки нашего народа."
 CAR_60s_The_Name: "Имя нации"
 CAR_60s_The_Name_desc: "Самый лёгкий способ изменить представление о нашей нации - сменить её имя. Не стоит забывать, что это одно из самых видимых достояний страны, что мы можем изменить. Так как нам себя называть?"
 CAR_60s_Central_African_Republic: "Центральная Африканская Республика"
 CAR_60s_Central_African_Republic_desc: "Центральная Африканская Республика - новое название. Мы должны дистанцироваться от колониального и рабского прошлого и его прозвища - Убанги-Шари. Такими действиями мы придём к будущему."
 CAR_60s_Republic_of_All_of_the_Peoples: "Республика для всех"
 CAR_60s_Republic_of_All_of_the_Peoples_desc: "Мы должны смириться с нашим прошлым и принять тот факт, что племена устарели, как строй государства в 20-м веке."
 CAR_60s_Ubangi_Shan: "Убанги-Шари"
 CAR_60s_Ubangi_Shan_desc: "Данное название наиболее ярко резонирует с нашим народом, живущим меж двух рек, Убанги и Шари."
 CAR_60s_Tribal_Democracy: "Племенная демократия"
 CAR_60s_Tribal_Democracy_desc: "Мы должны осознать, что сила нашей страны - в племенах, и мы должны выразить им свою поддержку."
 CAR_60s_President_Goumba: "Президент Гумба"
 CAR_60s_President_Goumba_desc: "Господин Гумба привел нашу страну к независимости от Франции. Думаю, привилегия стать первым президентом ЦАР должна принадлежать ему."
 CAR_60s_Power_Struggle_with_Dacko: "Борьба за власть с Дако"
 CAR_60s_Power_Struggle_with_Dacko_desc: "Наша страна не должна переживать политический кризис, а потому борьба двух сильных политиков должна закончиться как можно быстрее."
 CAR_60s_French_Support_of_Dacko: "Поддержка Дако из Франции"
 CAR_60s_French_Support_of_Dacko_desc: "Видимо, Франция не хочет забывать о своих бывших колониях, но решающий момент гонки за президентство скоро наступит."
  
