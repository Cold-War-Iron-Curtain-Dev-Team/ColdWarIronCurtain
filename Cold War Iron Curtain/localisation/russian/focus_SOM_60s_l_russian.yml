 SOM_60s_align_with_west_desc: "Placeholder."
 SOM_60s_befriend_yugoslavia: "Дружить с Югославией"
 SOM_60s_befriend_yugoslavia_desc: "Югославию можно считать почти крупной державой в мире. Поэтому было бы разумно дружить с ними."
 SOM_60s_Abdirashid: "Президент Абдирашид"
