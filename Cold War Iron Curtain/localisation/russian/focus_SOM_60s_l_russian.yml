 SOM_60s_nato_friends: "Друзья с НАТО"
 SOM_60s_nato_friends_desc: "Поскольку мы верим в западные убеждения, мы должны дружить с ними."
 SOM_60s_syl: "Сомалийская молодежная лига"
 SOM_60s_syl_desc: "Сомалийская молодежная лига или SYL - ведущая партия в Сомали. Мы должны поддерживать их и другие партии"
