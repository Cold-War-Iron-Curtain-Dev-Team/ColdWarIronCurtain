l_english:
 central_africa.500.d: "Еще более тревожные слухи из Центральной Африки: появились достоверные утверждения о том, что самопровозглашенный император Бокасса I регулярно ест человеческое мясо, а также подает его иностранным высокопоставленным лицам через морозильную камеру в подвале своего дворца."
 central_africa.501.d: "Тревожные новости из Центральной Африки: появляется все больше и больше сообщений о жестоких пытках в Центральной Африке, в том числе даже о том, что Бокасса лично пытал своих жертв во время заседания кабинета министров."
 central_africa.502.d: "Бокасса, когда-то бывший французским колониальным солдатом, сегодня короновал себя Бокассой I, императором Центральноафриканской империи, на спортивном стадионе на краю джунглей.\n Церемония имела атмосферу наполеоновского зрелища, смешанную с мелодиями Моцарта и племенными барабанами. \n 56-летний бывший солдат возложил на свою голову тяжелую золотую корону под наблюдением около 3500 гостей и выступлениями танцоров.\n Император Бокасса, одетый в изысканную тогу в римском стиле, вошел в зал под защитой войск, вооруженных пистолетами-пулемётами."
 crushed_intenral_opposition: "Сокрушенная внутренняя оппозиция"
 entral_africa.101.d: "Император Центральноафриканской империи Бокасса I приказал и, вероятно, принимал участие в апрельской резне около 100 школьников, заявила сегодня Африканская Комиссия Юристов. Он выколол глаз школьнику заточенной тростью и расстрелял 39 человек.\nСледственная комиссия из пяти человек, созданная в мае на встрече французских и африканских лидеров, заявила в опубликованном сегодня докладе, что тела убитых детей хоронили в общих могилах или бросали в реку.\nМногочисленные объективные и совпадающие показания указывают на то, что император Бокасса трижды находился в тюрьме Нгарба и участвовал в массовых убийствах, заявила комиссия."
 central_africa.600: "Император Центральноафриканской империи Бокасса I, самодержавно правивший этой страной с 1965 года, прошлой ночью был свергнут в результате бескровного переворота, сообщило Agence France-Presse из столицы Банги со ссылкой на источники в посольстве Франции.\nИнформационное агентство сообщило, что Дэвид Дако, 49-летний бывший президент, захватил власть и провозгласил страну республикой. В 1965 году император, тогдашний полковник Жан-Бедель Бокасса, изгнал господина Дако и поместил его под домашний арест. Он освободил его и взял к себе в качестве личного советника три года назад.\n В одном сообщении говорилось, что 58-летний император бежал из страны, вероятно, в Ливию."
