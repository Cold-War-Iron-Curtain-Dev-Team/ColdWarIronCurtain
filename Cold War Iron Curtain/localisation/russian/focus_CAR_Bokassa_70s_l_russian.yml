 CAR_70s_Bokassas_Regime: "Режим Бокассы"
 CAR_70s_Bokassas_Regime_desc: "Продолжить правление Бокассы."
 CAR_70s_Seek_Aid_From_France: "Просить помощи у Франции"
 CAR_70s_Seek_Aid_From_France_desc: "Республике нужна помощь. Это необходимо для достижения наших целей."
 CAR_70s_Trade_Uranium: "Торговля ураном"
 CAR_70s_Trade_Uranium_desc: "Наши природные ресурсы могут обеспечить нам иностранную помощь."
 CAR_70s_Uranium_Fever: "Урановая лихорадка"
 CAR_70s_Uranium_Fever_desc: "Нам нужно увеличить производство урана."
 CAR_70s_Aid_From_Gaddafi: "Помощь от Каддафи"
 CAR_70s_Aid_From_Gaddafi_desc: "Давайте посетим Ливию и заручимся любой помощью, которую они могут оказать."
 CAR_70s_Reliance_on_Others: "Зависимость от других"
 CAR_70s_Reliance_on_Others_desc: "Мы должны признать, что наша экономика не сильна сама по себе."
 CAR_70s_Foriegn_Dependence: "Иностранная зависимость"
 CAR_70s_Foriegn_Dependence_desc: "Мы во многом зависим от зарубежных стран."
 CAR_70s_Egalitarian_Reforms: "Эгалитарные реформы"
 CAR_70s_Egalitarian_Reforms_desc: "Женщины заслуживают роли в нашей стране."
 CAR_70s_Promote_Bokassa_to_General: "Рекламировать Бокассу"
 CAR_70s_Promote_Bokassa_to_General_desc: "Несмотря на то, что Бокасса велик, он даже не генерал. Мы должны дать ему подобающее место."
 CAR_70s_Promote_Bokassasim: "Распространение бокассизма"
 CAR_70s_Promote_Bokassasim_desc: "Наша единственная вера в нашего лидера."
 CAR_70s_One_Man_State: "Государство одного человека"
 CAR_70s_One_Man_State_desc: "Только один человек правит этой страной."
 CAR_70s_Consolidation_of_Power: "Консолидация власти"
 CAR_70s_Consolidation_of_Power_desc: "Мы в состоянии продолжить наши реформы с нашими новыми полномочиями."
 CAR_70s_Subservience_of_MESAN: "Доминировать в ДСЭЧА"
 CAR_70s_Subservience_of_MESAN_desc: "ДСЭЧА должна подчиняться нашей воле."
 CAR_70s_One_Party_State: "Однопартийное государство"
 CAR_70s_One_Party_State_desc: "Глупо полагать, что один человек может управлять нацией самостоятельно."
 CAR_70s_Modernization: "Модернизация"
 CAR_70s_Modernization_desc: "Мы должны поощрять секуляризм и проецировать другие западные идеи на нашу страну."
 CAR_70s_Capitalist_Reforms: "Капиталистические реформы"
 CAR_70s_Capitalist_Reforms_desc: ""
 CAR_70s_President_for_Life: "Пожизненный президент"
 CAR_70s_President_for_Life_desc: "Бокасса будет руководить нашей нацией столько, сколько сможет."
 CAR_70s_Central_Africa_to_the_Forefront: "Центральная Африка на переднем крае истории"
 CAR_70s_Central_Africa_to_the_Forefront_desc: "Мы должны сделать все возможное, чтобы наша нация отличалась от остальной Африки."
 CAR_70s_Give_France_our_Diamonds: "Подарить Франции бриллианты"
 CAR_70s_Give_France_our_Diamonds_desc: "Нам нужно как-то отплатить французской помощи. Почему бы не дать некоторым чиновникам хорошее вознаграждение?"
 CAR_70s_The_Monarchy_Proposal: "Провозглашение монархии"
 CAR_70s_The_Monarchy_Proposal_desc: "Монархизм – отличительная черта любой нации. Например, Эфиопия противостояла европейцам только потому, что она была сильной монархией под управлением одного человека."
 CAR_70s_Relations_with_France: "Отношения с Францией"
 CAR_70s_Relations_with_France_desc: "Мы можем захотеть сблизиться с Францией, чтобы стимулировать инвестиции."
 CAR_70s_French_Advisors: "Французские советники"
 CAR_70s_French_Advisors_desc: "Попросим прислать советников из Франции. Они помогут нам стать сильнее."
 CAR_70s_Dependency_with_France: "Зависимость от Франции"
 CAR_70s_Dependency_with_France_desc: "Наша главная зависимость должна быть от Франции и ни от какой другой страны. С момента основания у нас сложились уникальные отношения с Францией."
 CAR_70s_Frenchify_our_Creole: "Францизируйте наш креольский язык"
 CAR_70s_Frenchify_our_Creole_desc: "Мы должны убедиться, что наш французский язык соответствует стандартам материка."
 CAR_70s_Join_Francafrique: "Присоединится к ФранкАфрике"
 CAR_70s_Join_Francafrique_desc: "Давайте официально свяжем себя с Францией."
 CAR_70s_A_More_Direct_Relationship: "Более прямые отношения"
 CAR_70s_A_More_Direct_Relationship_desc: "Мы должны договориться с французами, чтобы обеспечить наше нынешнее место."
 CAR_70s_French_Central_Africa: "Французская Центральная Африка"
 CAR_70s_French_Central_Africa_desc: "Нужно официально изменить наше название, чтобы никто не забыл, кому мы верны."
 CAR_70s_Promote_Creole: "Продвигать креольский язык"
 CAR_70s_Promote_Creole_desc: "Родные языки нас только разделяют. Давайте примем язык будущего - французский."
 CAR_70s_Mainland_Supplies: "Материковые поставки"
 CAR_70s_Mainland_Supplies_desc: "Французы, конечно, не будут возражать, если мы возьмем часть их припасов."
 CAR_70s_Welcome_Back_Colonialism: "С возвращением, колониализм"
 CAR_70s_Welcome_Back_Colonialism_desc: "Неоколониализм скучен по сравнению с колониализмом. Пригласим обратно наших французских соратников под рукой Бокассы."
 CAR_70s_Invite_Foriegn_Leaders: "Пригласить иностранных лидеров"
 CAR_70s_Invite_Foriegn_Leaders_desc: "В рамках нашей подготовки мы должны разослать приглашения в крупные страны. Если они примут, они дадут нам много престижа."
 CAR_70s_Seek_French_Support: "Искать поддержки у французов"
 CAR_70s_Seek_French_Support_desc: "Мы должны спросить Францию, прежде чем мы решим объявить коронацию. Они могут помочь нам спланировать это."
 CAR_70s_French_Supplies: "Французские принадлежности"
 CAR_70s_French_Supplies_desc: "Давайте попросим Францию ​​о вещах, которые нам понадобятся для коронации."
 CAR_70s_Napoleon_of_Africa: "Наполеон Африки"
 CAR_70s_Napoleon_of_Africa_desc: "Нам следует добиваться церемонии столь же грандиозной, как коронация Наполеона. Ничего хуже для Бокассы не подходит."
 CAR_70s_Prepare_for_the_Coronation: "Подготовьтесь к коронации"
 CAR_70s_Prepare_for_the_Coronation_desc: "Давайте сделаем последние приготовления, прежде чем мы официально провозгласим монархию."
 CAR_70s_Stay_Muslim: "Оставаться мусульманином"
 CAR_70s_Stay_Muslim_desc: "Бокасса не изменит своей религии, что бы ни говорило международное сообщество."
 CAR_70s_Convert_to_Catholicism: "Обратиться в католицизм"
 CAR_70s_Convert_to_Catholicism_desc: "Мы не хотим, чтобы нас считали халифатом. Давайте развеем потенциальные страхи и обратимся в религию французов - католицизм."
 CAR_70s_Central_African_Caliphate: "Центральноафриканский халифат"
 CAR_70s_Central_African_Caliphate_desc: "Давайте изменим название нашей страны на более подходящее для нашего исламского монарха."
 CAR_70s_Central_African_Empire: "Центральноафриканская империя"
 CAR_70s_Central_African_Empire_desc: "Имя Империи действительно повысит интерес к нашему народу. Королевство звучит слишком уныло, а о республике не может быть и речи."
 CAR_70s_More_French_Support: "Дополнительная поддержка на французском языке"
 CAR_70s_More_French_Support_desc: "Французы очень довольны нашим обращением в католицизм. Так довольны, что они могут оказать нам еще немного помощи."
 CAR_70s_Integrating_Islam: "Интеграция ислама"
 CAR_70s_Integrating_Islam_desc: "Несколько мест в нашей стране составляют мусульманское большинство. Мы должны угодить им, интегрировав исламистов в наше правительство."
 CAR_70s_The_Coronation: "Коронация"
 CAR_70s_The_Coronation_desc: "Да здравствует Бокасса! Он — Солнце новой Центральной Африки!"
 CAR_70s_Repression: "Репрессии"
 CAR_70s_Repression_desc: "Критика Бокассы слишком распространена. Бокассу больше нельзя оклеветать."
 CAR_70s_Torture: "Пытка"
 CAR_70s_Torture_desc: "Логичный следующий шаг. Диссидентам не место в Центральной Африке."
 CAR_70s_Human_Flesh: "Человеческая плоть"
 CAR_70s_Human_Flesh_desc: "Охранники Бокассы говорят, что мужчина часто посещает небольшие города. Говорят, что города кричат ​​по ночам. Что бы ни происходило, это нехорошо."
 CAR_70s_International_Ridicule: "Международное осмеяние"
 CAR_70s_International_Ridicule_desc: "Наши идеи по продвижению Центральной Африки только принесли нам известность. Неважно, Центральная Африка не будет нуждаться в мире."
 CAR_70s_Economic_Failure: "Экономический провал"
 CAR_70s_Economic_Failure_desc: "Никто не хочет связываться с государством, которое мы создали."
 CAR_70s_Cut_Foriegn_Ties: "Сократите зарубежные связи"
 CAR_70s_Cut_Foriegn_Ties_desc: "Единственная цель Организации Объединенных Наций — унизить нас."
 CAR_70s_Isolationism: "Изоляционизм"
 CAR_70s_Isolationism_desc: "Центральную Африку нельзя отнести к другим мелким нациям."
 CAR_70s_Another_Disastrous_Year: "Еще один катастрофический год"
 CAR_70s_Another_Disastrous_Year_desc: "С прошлого года ничего не изменилось. Все стало только хуже."
 CAR_70s_New_General_Development_Plan: "Новый генеральный план развития"
 CAR_70s_New_General_Development_Plan_desc: "Центральная Африка будет развиваться. Ничто не может остановить наш новый план экономики."
 CAR_70s_Lack_of_Investors: "Отсутствие инвесторов"
 CAR_70s_Lack_of_Investors_desc: "Какой сюрприз. Наше правительство считают отбросами Африки."
 CAR_70s_Violent_Crackdown: "Жестокое подавление"
 CAR_70s_Violent_Crackdown_desc: "Бокасса сталкивается с новыми протестами. Есть только одно решение."
 CAR_70s_Border_Tensions: "Напряженность на границе"
 CAR_70s_Border_Tensions_desc: "Нашу страну осаждают нелегальные мигранты. Мы должны перебросить наши войска ко всем нашим границам."
 CAR_70s_Renew_Equipment: "Обновить оборудование"
 CAR_70s_Renew_Equipment_desc: "Нам нужно переоснастить наших солдат снаряжением, необходимым им для защиты нашей страны."
 CAR_70s_Brutal_Camps: "Жестокие лагеря"
 CAR_70s_Brutal_Camps_desc: "Нам нужно продолжать подавление протестующих."
 CAR_70s_Reverse_Course: "Обратный курс"
 CAR_70s_Reverse_Course_desc: "Наша экономическая политика не помогает. Нам нужно переосмыслить её."
 CAR_70s_Criticize_the_Development_Plan: "Критиковать план развития"
 CAR_70s_Criticize_the_Development_Plan_desc: "План не помог. Мы должны признать это."
 CAR_70s_Nepotism: "Кумовство"
 CAR_70s_Nepotism_desc: "У Бокассы есть некоторое количество ​​сторонников, которым необходимо уделять приоритетное внимание."
 CAR_70s_Student_Riots: "Студенческие беспорядки"
 CAR_70s_Student_Riots_desc: "Студенты из Центральной Африки отказываются носить одежду, созданную женой Бокассы! Это неприемлемо."
 CAR_70s_Food_Riots: "Продовольственные бунты"
 CAR_70s_Food_Riots_desc: "Изоляционизм, по-видимому, остановил весь импорт продовольствия. Нам нужно действовать быстро, чтобы исправить это."
 CAR_70s_Solidify_Power: "Усилить репрессии"
 CAR_70s_Solidify_Power_desc: "Возможно, наши предыдущие репрессии не подтвердили нашу точку зрения. От бокассизма не может быть пути назад."
 CAR_70s_Central_African_State: "Центральноафриканское государство"
 CAR_70s_Central_African_State_desc: "Мы должны отличаться от наших соседей. Мы государство центральноафриканцев."
 CAR_70s_Bokassa_Worship: "Поклонение Бокассе"
 CAR_70s_Bokassa_Worship_desc: "Он тот, кто вывел нас из бедности. Он принес нам помощь и работает только для нас."
 CAR_70s_Bokassa_Our_Leader: "Бокасса - наш Лидер"
 CAR_70s_Bokassa_Our_Leader_desc: "Слава Бокассе во веки веков!"
 CAR_70s_Operation_Barraccuda: "Операция Барракуда"
 CAR_70s_Operation_Barraccuda_desc: "Быстрым ударом французские войска, дислоцированные возле Банги, двинулись на президентский дворец и похитили Бокассу! Страна в смятении."
 CAR_70s_Dackos_Back: "Руководство Дако"
 CAR_70s_Dackos_Back_desc: "Французы подбросили Дако к нашему порогу. Кажется, теперь он наш лидер."
 CAR_70s_Plan_for_Democracy: "План демократизации"
 CAR_70s_Plan_for_Democracy_desc: "Мы должны демонтировать это отвратительное государство, которое построил Бокасса. Других надежд у нашего народа нет."
