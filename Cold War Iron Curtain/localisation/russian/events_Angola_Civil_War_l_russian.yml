l_russian:
 Angola_Civil_War.0.d: "В течение 24 часов после подписания Алворского соглашения столица Анголы вспыхнула насилием, когда МПЛА и ФНЛА начали борьбу за контроль над городом. Многие надеялись, что Алворское соглашение приведет к созданию национального правительства под руководством МПЛА, ФНЛА и УНИТА, которое установит мир в Анголе, но, к сожалению, этого не произошло. МПЛА утверждала, что ФНЛА пыталась убить своего лидера, в то время как ФНЛА утверждала, что МПЛА участвовала в захвате власти. По мере усиления боевых действий УНИТА вывел свой личный состав и бойцов из Луанды на свои базы на юге. Это открытие военных действий знаменует собой начало Гражданской войны в Анголе и новую фазу войны для народа Анголы."
 Angola_Civil_War.1.d: "Нелегкое перемирие между тремя основными ангольскими партиями-ФНЛА, МПЛА и УНИТА-закончилось в столице. Вскоре после того, как было объявлено о создании нового правительства единства для перехода страны к независимости, вспыхнули боевые действия между МПЛА и ФНЛА. ФНЛА обвинили в организации переворота и попытке убийства лидера МПЛА. После трехмесячных боев МПЛА наконец вытеснила ФНЛА из столицы. В то время как ФНЛА понесла большие потери, бойцам и сторонникам УНИТА удалось организованно отступить. МПЛА заявила, что она действовала, чтобы остановить переворот ФНЛА, поддержанный иностранными державами. ФНЛА утверждает, что все это было заговором МПЛА с целью захвата власти. Ожидается, что борьба между тремя партиями независимости будет усиливаться по мере того, как каждая из них начнет свою работу "
 Angola_Civil_War.2.d: "Кубинское правительство давно ощущает революционное товарищество с МПЛА в Анголе. МПЛА, в свою очередь, неоднократно обращалась за помощью к Кубе и другим революционным правительствам по всему миру. В течение предыдущих недель кубинцы откликнулись на эти просьбы, направив офицеров для оценки потребностей МПЛА. Они пришли к выводу, что МПЛА сталкивается с экзистенциальной угрозой со стороны реакционных режимов, и если они не получат помощь в ближайшее время, они могут пасть. С окончательного одобрения кубинского руководства кубинские военные начнут перебрасывать большое количество войск в Анголу с помощью грузовых судов и самолетов, чтобы обучать, поддерживать и укреплять МПЛА против своих врагов."
 Angola_Civil_War.3.d: "С приближением официального срока предоставления Португалией независимости Анголе ФНЛА начала наступление, чтобы обеспечить безопасность столицы Луанды. Это придало бы им легитимность и лишило бы их одного из бастионов поддержки МПЛА. К северу от города силы ФНЛА решили атаковать стратегическую деревню Кифангондо, чтобы иметь базу для обеспечения безопасности столицы и контроля над водохранилищем. При поддержке южноафриканской и зарийской авиации и артиллерии атака началась рано утром. Однако задержка пехотного штурма привела к тому, что МПЛА и их недавно приобретенная советская реактивная артиллерия, управляемая кубинскими советниками, опустошили атакующие силы. Отступая, ФНЛА потеряла почти все свои транспортные средства и тяжелую технику. С уверенной победой МПЛА была готова контролировать Луанду, когда наступит независимость."
 Angola_Civil_War.4.d: "С приближением официального срока предоставления Португалией независимости Анголе ФНЛА начала наступление, чтобы обеспечить безопасность столицы Луанды. Это придало бы им легитимность и лишило бы их одного из бастионов поддержки МПЛА. К северу от города силы ФНЛА решили захватить стратегическую деревню Кифангондо, чтобы иметь базу для обеспечения безопасности столицы и контроля над водохранилищем. При поддержке южноафриканской и зарийской авиации и артиллерии атака началась рано утром. Когда силы МПЛА были ошеломлены, пехота ФНЛА немедленно атаковала, прорвав линии МПЛА и заставив противника отступить. Артиллерия МПЛА не могла быть использована вовремя, так как ФНЛА хлынула через линию фронта сразу же после того, как их бомбардировщики и артиллерия закончили размягчение района. Поскольку ФНЛА надежно закреплена, похоже, что они готовы взять Луанду до того, как будет предоставлена официальная независимость."
 Angola_Civil_War.5.d: "Южная Африка очень внимательно следила за подъемом коммунистической МПЛА. Они представляли угрозу для Южной Африки и уже организовывали бойцов для сопротивления в Намибии. Чтобы не допустить намибийских партизан на базу операций в Анголе, было решено поддержать ФНЛА и УНИТА в их борьбе против МПЛА. Для достижения этой цели Южная Африка начала операцию "Саванна". Операция началась с того, что Южная Африка направила оперативную группу из условно обученных бойцов ФНЛА для нападения на МПЛА с намибийской границы. В первые часы работы оперативная группа добилась больших успехов, и южноафриканские войска готовятся войти в Анголу для поддержки миссии. В конечном счете операция "Саванна" надеется увидеть захват Луанды и конец МПЛА."
 Angola_Civil_War.6.d: "Оперативная группа условно обученных сил ФНЛА, работающая совместно с южноафриканскими силами военного вмешательства, добилась поразительных результатов. МПЛА оказалась неспособной противостоять дисциплине и огневой мощи наших войск. После жесткой кампании и прибытия иностранной помощи в МПЛА силы ФНЛА при поддержке ЮАР выполнили основные задачи операции "Саванна". С этим успехом можно надеяться, что умеренное правительство захватит Анголу и вся поддержка намибийских партизан будет прекращена, что сделает их легкой мишенью."
 Angola_Civil_War.7.d: "Оперативная группа условно обученных сил ФНЛА, работавшая совместно с южноафриканскими силами военного вмешательства, первоначально добилась молниеносных результатов. Первоначальное сопротивление МПЛА было довольно слабым по сравнению с дисциплиной и огневой мощью наших войск. Однако по мере продвижения операции "Саванна" противник начал получать огромную поддержку в виде оборудования и иностранной помощи. Действительно, к тому времени, когда южноафриканские военные поняли, что они не могут добиться успеха, стало очевидно, что южноафриканские силы столкнулись с более оснащенным противником. Многие южноафриканцы винят в неудаче отсутствие международной поддержки их усилий. Высокопоставленные южноафриканские военные чиновники также обвиняют правительство в неспособности обеспечить международную или информационную поддержку операции."
 Angola_Civil_War.8.d: "Фронт освобождения анклава Кабинда (FLEC) объявил о своей независимости как от Португалии, так и от Анголы. Кабинда была португальским протекторатом и до двадцатого века была отдельной администрацией от португальской Анголы. Однако ангольское правительство утверждает, что оно является частью собственно Анголы, и отвергло декларацию независимости. ФЛЕК активно участвовал в войне против португальского владычества, но утверждает, что был отодвинут на второй план во время мирных переговоров и хочет получить признанное государство. Несмотря на провозглашение, ожидается, что ангольские силы вскоре придут, чтобы остановить ФЛЕК."
 Angola_Civil_War.9.d: "Правительство Заира уже давно вовлечено в конфликты, бушующие в Анголе. Первоначально Заир надеялся поддержать африканское националистическое свержение колониального государства, но со временем его амбиции переросли в попытку установить дружественное правительство. После ряда военных побед зарийским войскам удалось прорвать вражеские линии и захватить контроль над столицей Анголы Луандой. Когда зарийские войска праздновали победу на улицах, правительство Зарийцев опубликовало заявление, в котором говорилось, что оно надеется на плодотворные отношения с законными представителями Анголы. Многие наблюдатели ожидают, что правительство Зариана установит дружественный режим, однако неизвестно, планируют ли они аннексировать районы страны."
  
   #Restoration of the Kongo 
 Angola_Civil_War.10.d: "\nПосле ряда военных успехов ФНЛА обеспечила себе военную победу над МПЛА и УНИТА. С этой победой ФНЛА теперь контролирует судьбу Анголы. ФНЛА объявила о своем намерении восстановить государство Конго и дать народу Баконго родину, которую Португалия украла у него в 1914 году с распадом Королевства Конго. Развалив Анголу, ФНЛА надеется предоставить всем ангольцам представительство и предотвратить будущие беспорядки. ФНЛА долгое время полагалась на поддержку в северной Анголе и, в частности, народа Баконго. Как остальные ангольцы отреагируют на создание государств-преемников, неизвестно, но ФНЛА по-прежнему уверена, что ее решение о расколе страны приведет к более широкому миру."
   #Savimbi Victorious 
 Angola_Civil_War.11.d: "УНИТА возник как группа, предлагающая обеспечить независимость Анголы и создание государства, которое обеспечило бы равенство граждан. Несмотря на трудности в плане обеспечения оружием, техникой и людьми, УНИТА, наконец, смог одержать победу и занять столицу Луанду. Лидер УНИТА Жонас Савимби поддерживал движение с самого начала, и по всей Анголе граждане вышли на улицы, скандируя его имя. Савимби опубликовал заявление, в котором заявил, что Ангола примет демократию и неприсоединение, чтобы гарантировать, что никакая иностранная идеология или государство не будут извращать свободу Анголы. Многие ангольцы будут с нетерпением ждать, сможет ли УНИТА выполнить свои обещания."
   #Retreat of the FNLA 
 Angola_Civil_War.12.d: "ФНЛА в военном отношении настолько деградировала, что ее войска отступают в Заир. Военный маршрут начался раньше, и по мере того, как поражения ФНЛА продолжались, ее силы начали отступать во все возрастающем хаосе, а банды бойцов ФНЛА бесчинствовали в деревнях, когда они бежали. Иностранная помощь этой группе в значительной степени прекратилась, и оставшиеся иностранные наемники, воюющие с ФНЛА, также в значительной степени отказались от борьбы. Хотя они рассчитывают занять базы и безопасные убежища в Заире, новое ангольское правительство пообещало, что оно разберется с остатками ФНЛА и будет настаивать на том, чтобы Заир ликвидировал эту группировку."
   #MPLA Victory 
 Angola_Civil_War.13.d: "В пресс-релизе партия МПЛА объявила, что наконец-то добилась исполнения желаний народа и одержала победу над своими врагами. Несмотря на угрозы со стороны двух мощных ангольских группировок, поддерживаемых иностранными державами, МПЛА смогла победить обе группы после серии побед. Теперь, когда мир обеспечен, МПЛА объявила, что принесет истинный социализм народу и создаст региональные партийные штаб-квартиры по всей стране. Это позволит партии искоренить контрреволюционные элементы, подавить коррупцию и накопительство и начать процесс распределения столь необходимых товаров народу Анголы. В ответ на эти заявления МПЛА многие в Анголе осторожно приветствуют окончание гражданской войны и надеются, что правление МПЛА приведет к стабильности и процветанию, а не к чисткам или репрессиям."
  
 ANGOLA_IND.0.d: "После окончания Второй мировой войны рост чувства деколонизации привел Португалию к усмирению потенциальных беспорядков в Анголе.  Однако восстановление провинциальных прав и другие реформы не смогли воспрепятствовать организации нескольких антиколониальных групп. Некоторые выступают за местные этнические группы, в то время как другие движимы коммунистической идеологией. В последние месяцы португальское правительство решило использовать тяжелую военную силу для разрешения серии протестов и волнений крестьян. Эта акция подтолкнула одну из антиколониальных группировок, Союз народов Анголы (УПА), к вторжению в Анголу из Конго-Леопольдвиля. Их захват португальских земель и ферм поселенцев вместо того, чтобы привести к массовому бегству португальцев, вместо этого привел к тому, что поселенцы остались на месте, а Португалия начала контратаку. Ожидается, что другие формирующиеся антиколониальные силы присоединятся к борьбе против Португалии и друг друга. Ангольская война началась, и ни одна из сторон, похоже, не желает сдаваться."
 ANGOLA_IND.1.d: "Ангольские рабочие на хлопковой плантации, управляемой компанией Cotonang, начали массовый протест. Цель состояла в том, чтобы подтолкнуть компанию к улучшению условий труда. Это привело к насилию в отношении португальских работников на плантации. Известие о протесте рабочих привело к тому, что местные деревни присоединились к нему, превратив его в восстание против португальского колониального контроля над Анголой. В ответ на эти события колониальное правительство развернуло военные силы и авиацию для подавления восстания. В результате военных действий погибли сотни людей, и многие деревни сообщили, что португальцы бомбили их без разбора. Жестокое подавление сильно возмутило ангольские антиколониальные группировки. Движение за освобождение Анголы (МПЛА) распространяло слухи о том, что гибель мирных жителей исчисляется десятками тысяч, еще больше разжигая ангольские чувства."
  
 ANGOLA_SAF.1.d: "Наша мобильная оперативная группа пересекла территорию МПЛА. Мы успешно идентифицировали оперативный центр МПЛА, который они оставили слабо защищенным. Противник не ожидал, что наши подвижные силы будут продвигаться так быстро, и мы легко прорвали их оборону. Штурм быстро сломил сопротивление противника, и МПЛА была разбита и вынуждена уйти из этого района. Этот успех заставит МПЛА дважды подумать, прежде чем пытаться посягнуть на наши интересы."
 ANGOLA_SAF.2.d: "Вчера чрезмерно усердный офицер допустил серьезную ошибку. Возможно, слишком уверенный в своей быстрой мобильной тактике, он стремился атаковать и уничтожить лагерь МПЛА в этом районе. Однако лагерь оказался укрепленным и готовым к нападению. Вместо того чтобы развалиться под давлением, противник удерживал позиции и наносил потери нашим войскам. Нам пришлось отступить, и МПЛА уже объявляет о своей победе над нашими силами в этом районе. Боевой дух наших людей также был ослаблен сражением."
 ANGOLA_SAF.3.d: "Силы, сражающиеся на юге Анголы против повстанцев МПЛА, призвали к воздушной поддержке против крупного нападения. Мы отправили несколько вертолетов, модифицированных для непосредственной поддержки с воздуха, эти вертолеты обеспечивали огневую мощь, бомбы и ракеты, чтобы отбить наступление противника, причем одна бомба уничтожила штабную машину МПЛА. Успешная операция демонстрирует, что МПЛА придется столкнуться с угрозами с неба, если они попытаются продвинуться к нашей границе."
 ANGOLA_SAF.4.d: "В южной Анголе мы получили запросы на воздушную поддержку из-за атаки MPLA. Мы отправили несколько вертолетов, модифицированных для непосредственной поддержки с воздуха, однако вскоре вертолеты попали в засаду ожидавших их сил МПЛА с легким зенитным вооружением. К счастью, мы не потеряли ни одного вертолета, но миссия поддержки по бомбардировке наступающих сил МПЛА была отменена."
  
 ANGOLA_POR.11.d: "ФНЛА уже давно ведет кампанию жестокого насилия против групп, которые она считает лояльными нашему режиму. Кроме того, ангольцы европейского происхождения, даже те, кто имеет европейское и африканское происхождение, также являются мишенями. Это позволило нашим разведчикам вербовать людей из деревень, пострадавших от ФНЛА. В недавней операции мы послали некоторых из этих людей присоединиться к ФНЛА, и они, в свою очередь, снабдили нас ценными разведданными, связанными с передвижениями войск ФНЛА, моральным духом и тактическими планами. Этот успех, несомненно, поможет нашим усилиям не только сдержать ФНЛА, но и окончательно искоренить эту угрозу."
 ANGOLA_POR.12.d: "ФНЛА уже давно ведет кампанию жестокого насилия против групп, которые она считает лояльными нашему режиму. Кроме того, ангольцы европейского происхождения, даже те, кто имеет европейское и африканское происхождение, также являются мишенями. Недавно мы попытались завербовать местного лидера, жители которого подверглись нападениям ФНЛА. Мы надеялись, что он сможет выйти на связь, стать сторонником ФНЛА, а затем, в конце концов, скормить нам информацию об операциях ФНЛА в его стратегическом районе. Однако, как только он вступил в ФНЛА, стало ясно, что он двойной агент. Предоставленная информация не привела ни к каким успехам и только растянула наши силы, в результате чего ФНЛА захватила территорию от нас. Операция по засадке шпиона в ФНЛА в конечном счете провалилась."
 ANGOLA_POR.15.d: "ФНЛА утверждает, что это национальное движение за Анголу. Оккупация земель и деревень придает им легитимность. Что еще более важно, деревни становятся пространствами, в которых они могут создавать объекты и административные структуры, бросая вызов судебному приказу Португалии. Получив разведданные на земле, группа самолетов предприняла дерзкую бомбардировку нескольких деревень, находившихся под контролем ФНЛА. Перехваченные радиопередачи подтверждают, что мы уничтожили командные структуры, административные здания и склады снабжения. Это затруднит способность ФНЛА снабжать и руководить своими людьми и повредит их моральному духу."
 ANGOLA_POR.16.d: "Действуя по сообщениям о том, что ФНЛА прорвалась в деревню, лояльную нашей администрации, несколько самолетов вылетели для оказания непосредственной поддержки с воздуха. Они определили, что видели колонну боевиков ФНЛА, и произвели бомбардировку. Однако, судя по донесениям с земли, бомбы, возможно, не попали в цель или, что еще хуже, были нацелены на колонну лоялистов, двигавшуюся из деревни. Детали все еще не подтверждены, но в отчетах говорится, что среди жителей деревни ощущается ощутимая паника и шок, и их преданность нашему делу, похоже, поколеблена."
 ANGOLA_POR.13.d: "ФНЛА очень эффективны в нападении на безоружных крестьян, португальских поселенцев или безоружных государственных чиновников. В ходе успешной карательной операции легковооруженное подразделение выследило рейдовый отряд ФНЛА, и как только они разбили лагерь на ночь, наши люди двинулись туда. Они быстро прорвали оборону, окружили противника, а затем начали наступление, уничтожив силы ФНЛА. Более успешные операции, подобные этим, будут продолжать внушать страх и показывать, что ФНЛА не может продолжать свою кампанию террора."
 ANGOLA_POR.14.d: "Командир местной полиции приказал ближайшей воинской части ФНЛА массировать силы для нападения на его деревню. Воинская часть мобилизовалась, чтобы ответить и отогнать ФНЛА, но не провела должным образом разведку или даже последовательную стратегию по очистке ФНЛА. Вместо того чтобы застать ФНЛА врасплох и окружить их, зачистка, начатая нашими войсками, привела к тому, что ФНЛА ускользнула. Действительно, некоторые из наших войск оказались слишком далеко от основных сил во время беспорядочной операции и были отрезаны ФНЛА, когда они отступили без потерь. В довершение всего деревня, которую мы должны были защищать, была атакована неделю спустя."
  
 ANGOLA_POR.1.d: "МПЛА в значительной степени опирается на поддержку городской элиты в столице. Недавно мы приступили к работе в столице, куда были направлены несколько лояльных ангольцев португальского происхождения, получивших университетское образование, чтобы присоединиться к МПЛА. Эти оперативники быстро поднялись, благодаря подпольной поддержке и наличным деньгам. Теперь они регулярно посылают сообщения о попытках МПЛА распространить свою идеологию на сельскую местность и подорвать наш авторитет. Из этих разведданных мы успешно выкорчевали в одной области параллельную административную установку коммунистической МПЛА."
 ANGOLA_POR.2.d: "МПЛА в значительной степени опирается на поддержку городской элиты в столице. Недавно мы приступили к работе в столице, куда были направлены несколько лояльных ангольцев португальского происхождения, получивших университетское образование, чтобы присоединиться к МПЛА. К сожалению, эти агенты в конечном итоге дезертировали и присоединились к их делу. Они раскрыли процесс, в котором мы размещаем агентов в их организации, и в результате МПЛА начала чистку, которая выкорчевала ряд наших агентов внутри организации, что значительно затруднило нашу способность получать разведданные о группе."
 ANGOLA_POR.5.d: "Одна из наших разведывательных групп обнаружила небольшой конвой, замаскированный под гражданские машины, перевозящие людей и оборудование для МПЛА. Мы отправили несколько самолетов, которые смогли разбомбить и уничтожить конвой. Когда подразделение прибыло на место, они обнаружили, что МПЛА перевозила тяжелые минометы и тяжелое огнестрельное оружие вместе с людьми в колонне. Успех помешает им нацелиться на наши аванпосты в этом районе и ослабит их боевой дух."
 ANGOLA_POR.6.d: "Во время контрповстанческой зачистки один из наших военных командиров заявил, что вступил в бой с крупными силами противника и потребовал поддержки с воздуха. Мы выслали самолеты, которые широко поразили цель. Однако при осмотре мы обнаружили, что координаты были неверны, и командир преувеличил сопротивление, с которым он столкнулся. Бомбы не задели ничего ценного и, к сожалению, разрушили фермерский дом, информации о жертвах пока нет. Это нападение поставило нас в неловкое положение и привело к протестам местных жителей, выступающих против применения нами чрезмерной силы."
 ANGOLA_POR.3.d: "Тяжеловооруженная оперативная группа была отправлена с одной из наших передовых баз. Это подразделение начало быструю операцию по оцеплению близлежащей деревни, в которой, как подозревают, находились силы МПЛА. Подразделение вступило в бой с вражескими часовыми за пределами деревни, прежде чем начать полномасштабную атаку. В короткий срок вражеские войска были разбиты с многочисленными потерями и пленными. Эта быстрая операция меньших, более мобильных сил демонстрирует эффективность более мелкомасштабной тактики борьбы с повстанцами."
 ANGOLA_POR.4.d: "Генерал, отвечающий за стратегический регион, мобилизовал свои силы и провел массированную операцию по зачистке, чтобы искоренить МПЛА. Многие города и деревни были обысканы вместе с землей. Несмотря на множество комментариев прессы перед операцией и хвастовство, что с МПЛА будут жестко разбираться, операция дала минимальные результаты. Похоже, что МПЛА получила известие об операции из-за масштабной мобилизации и пресс-конференций и просто растаяла. Появление истребителей МПЛА всего через несколько дней после окончания операции лишь еще больше подчеркнуло ее провал."
  
 ANGOLA_POR.21.d: "Хотя УНИТА очень сильно выступает против нашего режима, его руководство состоит из людей, которые меняют свои взгляды на то, каким должно быть будущее Анголы. Это привело к напряженности внутри группы, которую пытались использовать наши разведчики. В ходе недавней операции наш агент выдавал себя за сторонника одной из фракций УНИТА и начал направлять средства старшим руководителям УНИТА в этой фракции. В свою очередь, эти люди давали нашему агенту ценные разведданные о структуре их руководства, количестве бойцов и материально-техническом положении. Успех операции гарантирует, что наши силы будут иметь преимущество над противником, и мы можем посеять недовольство и внутри него."
 ANGOLA_POR.22.d: "Хотя УНИТА очень сильно выступает против нашего режима, его руководство состоит из людей, которые меняют свои взгляды на то, каким должно быть будущее Анголы. Это привело к напряженности внутри группы, которую пытались использовать наши разведчики. В ходе недавней операции наш агент выдавал себя за сторонника одной из фракций УНИТА и направлял средства старшим руководителям УНИТА во фракции. Однако, похоже, УНИТА знал об этой попытке и в течение длительного времени собирал наличные деньги и в какой-то момент крупную партию оружия нашими агентами, отчаявшимися получить ключевую информацию. В конце концов никаких достоверных разведданных получено не было, и несколько наших агентов в УНИТА были уничтожены, когда они выяснили наши методы. Нам придется перестроиться, чтобы предотвратить будущие неудачи."
 ANGOLA_POR.25.d: "Бойцы УНИТА передвигаются небольшими группами и проводят обескураживающие операции против наших сил, а также сторонников. Однако недавно мы обнаружили, что один из старших командиров УНИТА превратил дом в деревне, расположенной в глубине зоны их операций, в командный пункт. Очевидно, этот командир был слишком уверен, что мы не сможем до него добраться или что мы не обнаружим его передвижения. Это оказалось дорогостоящей ошибкой, поскольку несколько наших самолетов разбомбили командный пункт, уничтожив командование сил УНИТА в этом районе. Успешная операция только укрепит наш боевой дух и повредит их."
 ANGOLA_POR.26.d: "Бойцы УНИТА передвигаются небольшими группами и проводят обескураживающие операции против наших сил, а также сторонников. Во время одного неприятного инцидента мы получили координаты от так называемого разведывательного агента группы УНИТА, действовавшей в этом районе. Однако после того, как наша авиация разбомбила цель, стало ясно, что мы ни во что не попали и что УНИТА подбросил разведку. Удары были нанесены в районе, хорошо видимом для многих жителей деревни, и УНИТА пообещал, что они напугают нас настолько, что легко убедят нас бомбить именно это место. Это в конечном счете укрепило их положение в этом районе и снизило поддержку жителей деревни по отношению к нашему делу."
 ANGOLA_POR.23.d: "Смелый младший офицер успешно определил схему передвижения банды УНИТА, которая предприняла несколько жестоких нападений на правительственные войска и их сторонников. Он понимал, что бойцы УНИТА избегают прямого боя с превосходящими силами противника и часто устраивают засады, готовясь к атаке, чтобы не быть застигнутыми врасплох вражескими силами. Однако наш офицер вычислил их схему и расположил свои войска так, как, по его мнению, командир УНИТА разместит своих людей для подготовки нападения на соседнюю деревню. Когда прибыли бойцы УНИТА, они столкнулись с засадой, и наши войска вышли победителями. Мы нанесли потери, и многие вражеские бойцы бросили свое оружие при отступлении."
 ANGOLA_POR.24.d: "Один из наших командиров решил начать крупную операцию по оцеплению, чтобы выкорчевать боевиков УНИТА из своего района. Его люди постоянно подвергались партизанским атакам со стороны противника, и он хотел вступить в бой с УНИТА. Однако операция закончилась полным провалом, УНИТА в основном отступил из района поисков, и всякий раз, когда наши подразделения отходили от основных сил, они сталкивались с быстрыми ударами бойцов УНИТА. В конечном счете операция практически не дала бойцов УНИТА или запасов вражеских припасов, и мы понесли несколько потерь. Моральный дух наших людей был истощен в этом районе после этой неудачной попытки."
  
 ANGOLA_ANG.15.d: "ФНЛА захватила стратегически ценную деревню, изгнав ее жителей и установив сильную позицию, с которой можно было координировать свои усилия по вытеснению нас на юг. Однако несколько эскадрилий скоординировали свои минометные подразделения и в предрассветной атаке сбросили так много бомб, что многие бойцы ФНЛА, включая нескольких их лидеров, бежали, а позже в тот же день позиция была легко отбита."
 ANGOLA_ANG.16.d: "ФНЛА застала врасплох попытку минометного обстрела наших войск. Региональный командующий полагал, что его войска смогут занять позиции и нанести удар по ряду опорных пунктов, удерживаемых боевиками ФНЛА. Однако по мере того, как минометная группа настраивалась, ФНЛА запускала свои собственные минометы вместе с пехотной атакой. Этот штурм вынудил наших людей бежать, и они оставили позади минометы и другую ценную технику. Это был большой успех для ФНЛА в этом районе, и местные жители, похоже, теперь встали на их сторону. Мы подозреваем, что эти тактические маневры, вероятно, являются результатом иностранных советников, стремящихся потушить пламя нашей революции."
 ANGOLA_ANG.13.d: "Недавнее наступление ФНЛА выбило наши войска из нескольких деревень. ФНЛА, казалось, отступили, но опытный командир обнаружил, что они действовали из симпатизирующей деревни, расположенной недалеко от мест их нападений. Ночью наши люди окружили деревню, а на следующий день несколько обычных патрулей ФНЛА, покинувших деревню, попали в засаду. Когда противник понял, что они окружены, многие сдались или впали в панику, нашим войскам удалось завершить штурм и захватить оружие и документы у противника. Известие о нашем успешном наступлении побудило деревни в этом районе поддержать нас и ослабило влияние их вождей."
 ANGOLA_ANG.14.d: "Наши чрезмерно усердные силы стремились отбить вторжение ФНЛА на нашу территорию. Командир считал, что быстрый штурм их главного лагеря вынудит ФНЛА отступить. Однако из-за неудачной подготовки штурма наши люди попали в засаду за пределами своего лагеря. Шок от вражеской атаки вызвал панику, когда наши войска отступили. В дополнение к потерям, мы потеряли технику, и некоторые из наших людей были взяты в плен. ФНЛА рассматривает победу как подтверждение своего дела, а поддержка революции в регионе истощилась."
 ANGOLA_ANG.11.d: "Мы получили доказательства против сына видного вождя, сторонника ФНЛА, который учится в известном университете за рубежом. Используя этот шантаж, мы убедили его начать предоставлять нам подробную информацию о планах и тактике ФНЛА. Благодаря полученной информации нам удалось сорвать попытку штурма деревни наших сторонников. Мы надеемся, что информация, которую он предоставит, окажется жизненно важной в наших усилиях по разгрому этой реакционной угрозы нашей революции."
 ANGOLA_ANG.12.d: "Это обычная практика для некоторых наших вооруженных кадров, чтобы присоединиться к конкурирующей группе, чтобы собрать информацию и посеять недовольство. Однако один из наших агентов в ФНЛА, по-видимому, был подкуплен, чтобы дезертировать и предать народ и нашу партию. Предателю удалось убедить своего куратора привлечь нескольких других агентов для координации операции, в результате которой ФНЛА потеряла бы нескольких видных лидеров, однако все это было уловкой, и ФНЛА удалось захватить кураторов и этих агентов."
  
 ANGOLA_ANG.21.d: "В пространстве УНИТА есть много людей, которые считают, что идеология партии отклоняется от своих истоков. Некоторые из этих несогласных верят в революционное правительство, как и мы, и наши агенты успешно превратили политического лидера УНИТА в нашего агента. Его должность позволяет ему поддерживать тесную связь со старшими военными командирами УНИТА, и информация, которую он уже предоставил, дает нам четкое представление об их тактике, боевом духе и планируемых операциях. Это преимущество в разведке позволит нам гораздо эффективнее нацеливаться на УНИТА."
 ANGOLA_ANG.22.d: "Группа агентов разведки доказывала скромное происхождение УНИТА, и его руководство сделало бы его особенно уязвимым для интеллектуальных лидеров, которые могли бы быстро подняться по служебной лестнице и расколоть группу внутри нас. Этот план провалился, поскольку люди, завербованные для проникновения в ряды УНИТА, оказались недостаточно подготовленными к выполнению задания и были довольно быстро уничтожены. Тем не менее, агенты, которые сами организовали операцию, были почти все захвачены, поскольку УНИТА доказал, что он может поставить свою собственную ловушку на наших агентах. К счастью, большинство наших агентов сбежало, но операция по проникновению провалилась."
 ANGOLA_ANG.25.d: "Один из наших самых опытных командиров эскадрилий провел блестящую операцию против базового лагеря УНИТА вблизи нашей территории. Он направил небольшой отряд на разведку стратегического района, откуда боевики УНИТА наносили удары по нашим линиям снабжения. Отряд обнаружил лагерь повстанцев, и ночью на позиции выдвинулась минометная группа. Затем они прицелились и разбомбили лагерь. После того, как бомбардировка закончилась, остальная часть эскадрильи атаковала позицию, обнаружив, что она покинута бойцами УНИТА, напуганными нашей демонстрацией силы. Из лагеря были изъяты вражеские документы, потери и снаряжение."
 ANGOLA_ANG.26.d: "Командир эскадрильи нанес серию минометных ударов по передовым позициям УНИТА, однако он, по-видимому, успокоился, поскольку его последняя попытка привела к серьезной неудаче. УНИТА сообщил по радио, возможно, намеренно, что он накапливает людей и оружие на знакомом нашему командиру посту. Возможно, он почувствовал возможность нанести массированный урон минометным ударом по этому месту, однако, как только его эскадрилья начала выдвигаться на позиции, силы УНИТА устроили им засаду, нанеся потери, взяв пленных и захватив несколько минометов. Теперь наши аванпосты обстреливаются из наших же минометов, что подрывает боевой дух наших войск."
 ANGOLA_ANG.23.d: "В течение последних нескольких недель небольшая группа бойцов УНИТА совершала набеги на деревни, находящиеся под нашей защитой, и совершала наезды на наши аванпосты. Командиру в этом районе удалось обнаружить общее расположение вражеского базового лагеря. Используя численное превосходство, он окружил район, а затем провел зачистку, обнаружив вражеский лагерь. Затем наши войска провели штурм, уничтожив базу УНИТА и захватив ряд пленных."
 ANGOLA_ANG.24.d: "Попытка очистить контролируемый УНИТА район от его боевиков и утвердить наш контроль закончилась неудачей. Наши силы, состоявшие из нескольких эскадронов, стремились обезопасить ряд деревень и заманить противника в бой или застать его врасплох. Однако в деревнях не было ни складов снабжения, ни складов боеприпасов, а попытки найти боевиков только приводили в ярость жителей, которые чувствовали, что их свободы нарушаются. Когда войска двинулись дальше, они действительно встретили бойцов УНИТА, но они были окопаны и хорошо подготовлены. Мы понесли тяжелые потери, и бойцы УНИТА продолжали преследовать наши силы до тех пор, пока мы не отступили."
  
 ANGOLA_ANG.1.d: "К молодому ангольскому колониальному бюрократу тайно обратились несколько наших оперативников. Он выразил свое разочарование колониальным режимом и пообещал сообщить информацию, касающуюся распределения припасов, наличных денег и оружия в его регионе. Эта ценная разведка подскажет нам, кто из местных на стороне колонизаторов и где сосредоточены вражеские войска для будущих операций."
 ANGOLA_ANG.2.d: "В университете в Луанде была прервана операция по привлечению нескольких будущих выпускников, сочувствующих нашему делу, к работе в колониальном правительстве и армии для сбора разведданных. Были арестованы не только студенты, но и их кураторы и некоторые из наших лучших вербовщиков в кампусе. План казался обреченным с самого начала, поскольку наши кураторы связали операцию с вербовкой студентов, которые были известными нашими сторонниками. Португальские чиновники легко разгадали план и свернули операцию."
 ANGOLA_ANG.5.d: "Полицейский барак под Луандой был сильно разбомблен минометной группой наших бойцов. Снаряды нанесли огромный урон и привели к сильному взрыву, когда был поражен арсенал. Колониальные полицейские силы понесли потери, но что более важно, способность наших бойцов провести такую операцию, а затем быстро ускользнуть, не будучи пойманными, подняла наш авторитет среди народа."
 ANGOLA_ANG.6.d: "Местный командир думал, что он может разбомбить колониальный военный лагерь с минометной командой, однако, когда его бойцы попытались продвинуться на позицию, патруль вражеских войск заметил их. В последовавшем бою наши войска понесли несколько потерь и захватили ценные минометы. Португальский командир отвез захваченное оружие и бомбы в местную деревню и заявил, что мы намерены обстреливать жителей деревни без разбора, чтобы посеять страх. Наш престиж и поддержка в этом районе были исчерпаны."
 ANGOLA_ANG.3.d: "В классическом маневре партизанской войны небольшая колонна португальских военных грузовиков снабжения была сбита эскадрильей наших истребителей. Противник был совершенно не готов к тяжелой огневой мощи и быстрому отходу наших войск после нанесения большого урона. Командир доложил, что почти все грузовики выведены из строя или уничтожены с большими потерями для противника. Многие местные жители теперь распространяют слухи о нашем триумфе, и ходят слухи, что португальцы могут вскоре покинуть свои посты в этом районе, если грузовики снабжения не смогут свободно передвигаться."
 ANGOLA_ANG.4.d: "Один из командиров нашей эскадрильи привел свои силы к тому, что считалось изолированной португальской военной силой, состоящей в основном из африканских солдат. Командующий предполагал, что в случае сильного штурма большая часть войск либо сдастся, либо дезертирует, что даст нам крупную победу и тайник с оружием. Однако, когда начались бои, сопротивление со стороны базы было жестким, и численность вражеских войск была намного выше, чем ожидалось. Наши бойцы быстро отступили, но это было беспорядочно, и вражеские силы, посланные в погоню, в конечном итоге нанесли тяжелые потери и взяли пленных. Командир эскадрильи был отстранен от должности за то, что не смог должным образом предвидеть или разведать колониальные силы."
  
 ANGOLA_FNL.1.d: "Мы представляем волю нации и объединим страну под руководством ангольского правительства, не контролируемого иностранными государствами или иностранными идеологиями. Этот призыв сильно резонирует с ангольцами, все еще связанными с колониальным режимом, которые знают, что они никогда не достигнут высокого ранга или статуса, пока продолжается португальское правление. В ходе недавней операции нашим оперативникам удалось убедить чиновника среднего уровня колониальной Анголы предоставить нам ценную разведывательную информацию о намерениях и передвижениях португальцев. Он также свяжет нас с другими людьми, сочувствующими нашей миссии."
 ANGOLA_FNL.2.d: "Мы представляем волю нации и объединим страну под руководством ангольского правительства, не контролируемого иностранными государствами или иностранными идеологиями. Этот призыв сильно резонирует с ангольцами, все еще связанными с колониальным режимом, которые знают, что они никогда не достигнут высокого ранга или статуса, пока продолжается португальское правление. Недавняя попытка убедить ангольского чиновника среднего звена кормить американскую разведку оказалась провальной. Чиновник немедленно доложил об оперативниках своему начальству, которое захватило мужчин. После их ареста ряд сочувствующих чиновников были отстранены колониальным государством, и наши усилия по сбору разведданных закончились неудачей."
 ANGOLA_FNL.5.d: "Португальский социальный клуб, расположенный в крупном населенном пункте, уже некоторое время находится под наблюдением наших болельщиков. Было решено, что охрана в этом месте слабая и мы можем заложить взрывчатку. Миссия по установке бомб была успешной, и социальный клуб был разрушен. Это потрясло португальских чиновников и поселенцев, и мы надеемся, что это заставит многих в этом районе покинуть Анголу и поднять наш собственный авторитет среди народа."
 ANGOLA_FNL.6.d: "Группа, перевозившая взрывчатку для проведения бомбардировки португальского объекта, была перехвачена на полицейском блокпосту. Эти люди, очевидно, вызвали подозрение и были быстро арестованы португальцами. Взрывчатка была показана местным жителям и португальским поселенцам, и колониальные власти утверждают, что мы собирались провести террористическую кампанию против гражданских лиц, стремясь дискредитировать нас и продемонстрировать поселенцам, что их безопасность обеспечена."
 ANGOLA_FNL.3.d: "Плантация, управляемая португальской семьей поселенцев, была быстро захвачена нашими войсками. Это спровоцировало местные власти направить силы для отражения нашей атаки, и они, в свою очередь, попали в засаду. Налет и засада принесли нам наличные деньги, оружие, припасы и товары, которые мы могли бы продать. Психологически наш успех в борьбе с поселенцами, надеюсь, послужит примером и подтолкнет их оставить Анголу нашему народу."
 ANGOLA_FNL.4.d: "Наш командир определил деревню, симпатизирующую португальскому колониальному правительству, предложив им припасы и людей. Командир считал, что деревня плохо защищена, и планировал начать штурм, чтобы уничтожить португальские объекты и присутствие сил безопасности, чтобы показать деревне, что она должна изменить свои пути. Однако, когда наши истребители двинулись в стремительный штурм, португальский патруль в этом районе заметил их и атаковал тыл наших войск. Они нанесли тяжелые потери и вынудили наших людей отступить, попытка налета оказалась неудачной."
  
 ANGOLA_FNL.11.d: "ФНЛА представляет Анголу, свободную от иностранных империалистов и иностранных идеологий. МПЛА является явным рабом иностранной идеологии и должна быть остановлена. В их рядах есть те, кто опасается, что их лидеры перемещают их в места, выходящие за рамки ангольских культурных или социальных норм. Это также люди, которые не вознаграждаются за свои таланты, и наши оперативники недавно убедили неопределенного старшего командира МПЛА начать снабжать нас информацией в обмен на денежную помощь. Информация, которую мы уже собрали, многое рассказала нам об их организации, тактике и моральном состоянии. Мы надеемся использовать эту информацию, чтобы лучше нацелить их силы на поле боя."
 ANGOLA_FNL.12.d: "Сегодня мы пережили серьезный конфуз. Мы послали старшего оперативника завербовать чиновника МПЛА, чтобы он предоставил нам информацию. Мы надеялись, что предложение присоединиться к нам в национальном деле и наличные деньги убедят чиновника. Первоначально нам сообщили, что операция прошла успешно, но вскоре мы поняли, что полученная информация привела наши силы к нескольким засадам или в районы без присутствия МПЛА, растянув наши силы. Прежде чем мы успели сообразить, что нас разыгрывают, чиновник МПЛА организовал встречу с двумя нашими оперативниками, и МПЛА захватила их. Операция по приобретению источников внутри МПЛА закончилась неудачей."
 ANGOLA_FNL.15.d: "МПЛА имеет обширный партийный аппарат, который стремится эксплуатировать и использовать пропаганду для промывания мозгов сторонникам среди ангольского народа. Другой метод контроля, который они используют, - это распределение ресурсов между деревнями по квотам в определенных районах. Чтобы воспользоваться преимуществами и навредить поддержке, которую местные жители оказывают МПЛА, наша команда недавно взорвала несколько складов на территории МПЛА. Разрушение этих ресурсов привело к нехватке товаров первой необходимости для местных жителей, и это поднимает анти-МПЛА чувство и повышает моральный дух нашей собственной партии в этом районе."
 ANGOLA_FNL.16.d: "МПЛА недавно обнаружила группу наших бойцов, движущихся в тылу своих войск, чтобы заложить взрывчатку, нацеленную на их руководство и объекты. Подробности того, как были пойманы эти люди, остаются неизвестными, однако МПЛА не теряла времени даром, демонстрируя взрывчатку местным жителям. Они начали порочную серию лжи, утверждая, что бомбы предназначались для рынков и школ в попытке использовать страх как средство заставить жителей деревни поддержать наше правое дело."
 ANGOLA_FNL.13.d: "Силам МПЛА, как правило, не хватает профессиональных офицеров или дисциплины. К счастью, мы можем положиться на внешних добровольцев, которые обладают обширными знаниями о военной дисциплине и тактике. Один из этих добровольцев недавно привел отряд наших людей, которых он обучал, в базовый лагерь МПЛА. Используя тактику разведки и проникновения, наши люди сумели прорваться в лагерь противника без обнаружения, что привело к нападению. Мы захватили лагерь, нанося потери, захватывая пленных и захватывая важные документы у врага."
 ANGOLA_FNL.14.d: "Вождь ФНЛА недавно отчитал командира ФНЛА в своем районе за то, что он не реагировал и не предотвращал нападения МПЛА. Вождь также говорил местным жителям, что он опасается, что деревни скоро падут под натиском МПЛА, что приведет к волнениям среди населения. Командующий решил покончить с этой критикой и двинулся против базы МПЛА, действовавшей в этом районе. Однако МПЛА, по-видимому, были подготовлены и превратили нападение наших бойцов в ловушку и разгромили наших людей. Мы понесли тяжелые потери, и теперь, как говорят, моральный дух жителей деревни почти рухнул."
  
 ANGOLA_FNL.21.d: "УНИТА долгое время действовал без обширной финансовой или идеологической базы с точки зрения того, чего он хочет. Это сработало в нашу пользу, так как мы недавно послали бойца, чтобы присоединиться к их силам и подняться в ряды наших агентов. Его усилия принесли свои плоды, поскольку он смог подняться, часто используя деньги, которые мы предоставляем, чтобы подкупить его путь к вершине, и он нашел нескольких офицеров и должностных лиц УНИТА, готовых помочь нам за наличные или помочь им подняться на более высокие посты в УНИТА. Эта сеть уже предоставила ценную разведывательную информацию об УНИТА и помогла нам защитить ключевые активы от вражеских диверсий."
 ANGOLA_FNL.22.d: "УНИТА долгое время действовал без обширной финансовой или идеологической базы с точки зрения того, чего он хочет. Мы думали, что сможем использовать это в своих интересах, завербовав командира УНИТА с наличными деньгами для обеспечения нас разведданными. Однако командир УНИТА оказался двойным агентом и собрал у нас много наличных денег и припасов в обмен на разведданные, что в конечном итоге не привело ни к каким крупным успехам. Он был, наконец, обнаружен, когда наш оперативник случайно дал ему некоторые незначительные разведданные, которые УНИТА использовал для засады наших сил. Как только это стало ясно, мы разорвали с ним все связи, но операция по приобретению агента внутри УНИТА оказалась провальной."
 ANGOLA_FNL.25.d: "Командир УНИТА, удобно живущий через границу в лагере, стал мишенью группы наших бойцов. Боевики контрабандой переправили через границу взрывчатку и уничтожили дом командира. На данный момент неизвестно, сколько жертв было понесено, но это нападение продемонстрировало УНИТА, что они не могут избежать нашего гнева. Моральный дух наших войск был поднят, когда пришло известие, что жестокий вражеский командир был так эффективно нацелен нашими войсками."
 ANGOLA_FNL.26.d: "Благодаря справедливости нашего дела нам посчастливилось иметь много добровольцев, прибывших из-за границы, чтобы помочь в борьбе за создание Анголы, свободной от иностранных правительств и идеологий. Чтобы продемонстрировать свою силу, мы планировали снести основные здания заброшенной деревни, которая бежала до прибытия наших войск. Мы хотели лишить сочувствующих УНИТА функциональной деревни, в которую можно было бы вернуться, однако, когда здания были разрушены, мы обнаружили, что жители деревни были удержаны бойцами УНИТА из страха, что они поддержат наши наступающие силы. Разрушая здания, мы гарантировали, что теперь они будут сторонниками УНИТА, что приведет к провалу бомбардировки."
 ANGOLA_FNL.23.d: "Бойцы УНИТА следуют набору правил и тактики, чтобы минимизировать потери и нанести потери. Один из наших командиров понял, что группа боевиков УНИТА, с которой он столкнулся, похоже, срезала углы в плане организации засад и обеспечения путей отступления. Тщательно спланировав свои действия, он вошел в зону их действий, спровоцировав засаду, которая, как он знал, должна была произойти, но у него уже были небольшие силы, расположенные позади противника, и он смог сковать и разгромить силы УНИТА. Он наносил потери, брал пленных и захватывал оружие противника, без сомнения, мешая им эффективно действовать в этом районе."
 ANGOLA_FNL.24.d: "УНИТА, как правило, исчезает перед лицом превосходящих сил, и в недавнем сражении наш командир дорого пострадал за то, что предположил, что это произойдет. Командующий располагал большими, чем обычно, силами, и недавние действия УНИТА в этом районе показали, что у них было гораздо меньше сил. Командир выследил бойцов УНИТА в определенном месте. Он решил начать штурм, оттеснить их и затем преследовать врага. Однако его предположение о численном превосходстве и выводе УНИТА были неуместны, поскольку УНИТА собрал гораздо большие силы, и они не отступили во время нападения. Наши войска были вынуждены отступить после тяжелых потерь и в настоящее время находятся в обороне."
  
 ANGOLA_UNT.1.d: "Португальцы уже давно перенапряглись и взяли за правило набирать рекрутов из ангольцев, чтобы пополнить свои ряды. Мы воспользовались этим и направили часть наших кадров в эти ополчения. Недавние усилия принесли свои плоды, поскольку эти лазутчики контрабандой перевозили ценное оружие и припасы для наших бойцов. Что еще более важно, эти люди распространяют послание УНИТА в рядах и предоставляют нам ключевые разведданные, которые мы используем, чтобы переместить людей на позиции для эффективного удара."
 ANGOLA_UNT.2.d: "Португальцы уже давно перенапряглись и взяли за правило набирать рекрутов из ангольцев, чтобы пополнить свои ряды. Мы воспользовались этим и направили часть наших кадров в эти ополчения. Однако недавние усилия оказались катастрофическими. Похоже, что привлекательность наличных денег заставила многих наших агентов дезертировать. Они доложили о наших усилиях по проникновению и выкорчевали многих наших сторонников в колониальных ополченцах. Несколько групп боевиков также попали в засаду из-за этого предательства."
 ANGOLA_UNT.5.d: "Группа наших бойцов обнаружила уязвимое правительственное здание в спорной деревне. Ночью люди заложили взрывчатку, а утром мы уничтожили этот символ португальского империалистического режима. Говорили, что жители деревни были в восторге от нашего успеха, и многие пришли присоединиться к нашим бойцам или предложить еду людям, работающим в этом районе. Этот успех поднимет боевой дух."
 ANGOLA_UNT.6.d: "Попытка взорвать вражеский полицейский блокпост закончилась катастрофой в одночасье. Наша группа боевиков думала, что они определили слабое место, откуда можно проникнуть и разместить взрывчатку, но они были перехвачены и захвачены колониальной полицией. Ожидается, что эти люди будут публично казнены, а португальцы обнародовали взрывчатку как свидетельство террористического заговора, направленного против гражданских лиц. Моральный дух наших бойцов был подорван, и жители деревни теперь больше боятся поддержать наше дело."
 ANGOLA_UNT.3.d: "Во время недавней зачистки португальскими войсками одна из наших групп выследила подразделение, которое вышло за пределы основных сил. Бойцы сумели устроить засаду на подразделение, нанеся тяжелые потери и захватив оружие и боеприпасы, которые всегда нужны нашим бойцам. Сам Мао гордился бы тем, как эти люди себя ведут. Португальские войска быстро отступили, и боевой дух наших людей был значительно поднят после успеха."
 ANGOLA_UNT.4.d: "Сегодня до руководства дошло тревожное сообщение. Группа наших бойцов понесла тяжелые потери среди колониальных войск во время неудачной атаки на вражеский аванпост. Командир, по-видимому, не следовал нашим тактическим процедурам и вместо того, чтобы атаковать, когда враг наиболее слаб, он ударил их, когда они были сильны и окопались. Всем командирам будет дана директива, напоминающая им, что мы не должны бросать наши силы в слабых усилиях."
  
 ANGOLA_UNT.11.d: "МПЛА уже давно претендует на звание революционной партии Анголы, однако их декаданс и жестокость разочаровали многих в их рядах. Важный региональный командир выразил сочувствие делу УНИТА, и наши оперативники смогли установить контакт. От него мы получаем ценную информацию о передвижениях и тактике МПЛА. Мы ожидаем, что наше влияние будет расти в результате этого проникновения в ряды МПЛА."
 ANGOLA_UNT.12.d: "МПЛА уже давно претендует на то, чтобы быть революционной партией Анголы, однако их декаданс и жестокость разочаровали многих в их рядах. Некоторые из наших оперативников думали, что смогут убедить члена МПЛА действовать как крот в их рядах. Он бы распространил наши взгляды и предоставил ключевые разведданные, однако это оказалось ловушкой. Оперативники были схвачены, и после жестокого допроса МПЛА очистила некоторые из наших сторонников в своих рядах."
 ANGOLA_UNT.15.d: "МПЛА создала партийные пункты в деревнях и городах по всей зоне своего контроля. Чтобы показать народу, что мы являемся истинными представителями Анголы, группа наших бойцов смогла заложить взрывчатку и взорвать партийный объект МПЛА в стратегически важном населенном пункте. Уничтожив этот пропагандистский объект, мы показали, что МПЛА не в состоянии защитить себя. Если они не могут этого сделать, то как они могут защищать или представлять народ? Наш успех поднимет УНИТА в умах людей и вселит страх в МПЛА."
 ANGOLA_UNT.16.d: "Амбициозная группа наших бойцов стремилась заложить взрывчатку и уничтожить склад МПЛА. Однако они не провели разведку местности так хорошо, как следовало бы, и были убиты в процессе установки взрывчатки. МПЛА в этом районе получила значительный подъем боевого духа. Говорят, что наши собственные бойцы чувствуют себя истощенными этой неудачной попыткой. МПЛА распространила слухи, что наши люди планировали совершить неизбирательное насилие против населения, чтобы повредить нашему положению."
 ANGOLA_UNT.13.d: "Мао гордился бы сегодня нашими силами. В деревне, занятой МПЛА, небольшая группа бойцов устроила засаду на нескольких часовых, выбравшихся из деревни. Остальные силы в деревне открыли ответный огонь, но большая группа наших людей открыла огонь с другой стороны. МПЛА разделила свои силы и двинулась навстречу этой новой угрозе, но они попали в ловушку, когда другая скрытая группа открыла огонь по выставленным силам МПЛА, ударив их с разных сторон. Нанеся тяжелые потери, бойцы отступили с победой."
 ANGOLA_UNT.14.d: "Командир МПЛА, несомненно, знакомый с нашей тактикой, превратил атаку наших истребителей в маршрут. МПЛА проявила исключительную дисциплину, чтобы не попасть в ловушку, не маршируя туда, откуда стреляли диверсионные силы. Вместо этого меньшие силы бойцов МПЛА прокрались на фланг и посеяли хаос. Они оттеснили наши войска, нанося потери и захватывая брошенное оружие, которое они выставляли напоказ в качестве трофеев жителям деревни. Местный боевой дух сильно пострадал."
  
 ANGOLA_UNT.21.d: "ФНЛА действует как реакционная сила, стремящаяся создать новое угнетение для народа Анголы. Они полагаются на внешние деньги и поддержку, чтобы сохранить лояльность людей. Чтобы получить разведданные и доступ к жизненно важным поставкам и оружию, мы начали операцию по отправке некоторых кадров, чтобы присоединиться к ним в качестве бойцов. Операция прошла успешно, и эти люди предоставляют нам необходимую информацию и сообщают, где мы можем взять их припасы. Что еще более важно, мы также способны распространять нашу миссию в рядах и сеять недовольство."
 ANGOLA_UNT.22.d: "Попытка наших оперативников превратить некоторых бойцов ФНЛА в информаторов закончилась катастрофой. Первоначально нам удалось получить информацию из этих источников, чтобы захватить припасы и оружие, однако это была просто ловушка. Эти предатели заманили в ловушку некоторых наших ключевых оперативников, и после того, как они были схвачены, некоторые из наших сторонников в рядах ФНЛА были обнаружены и уничтожены жестоким руководством ФНЛА."
 ANGOLA_UNT.25.d: "ФНЛА провела жестокие операции, чтобы запугать деревни и города, чтобы они приняли их власть. В одном из этих городов мы обнаружили дом крупного сторонника ФНЛА. Наши бойцы смогли установить бомбы и разрушили дом. Эта ошеломляющая бомбардировка крупного сторонника ФНЛА навела страх на ФНЛА и принесла нам поддержку многих местных жителей, которые презирали этого человека."
 ANGOLA_UNT.26.d: "Подразделение по установке бомб было захвачено при попытке проникнуть в контролируемую ФНЛА деревню. У этих людей были взрывчатые вещества и другое оборудование для их миссии, и ожидается, что с ними жестоко расправится местный командир ФНЛА. Этот успех поднял боевой дух нашего противника и заставил наших собственных бойцов сомневаться в приказах, отданных их начальством."
 ANGOLA_UNT.23.d: "Трусливая ФНЛА напала на беззащитную деревню, которая поддерживала наше дело. В отместку несколько ведущих командиров в этом районе встретились, чтобы спланировать наше возмездие. Используя нашу традиционную тактику, силы ФНЛА были заманены за пределы деревни, где мы атаковали с нескольких сторон, трусливые ФНЛА быстро бежали, понеся тяжелые потери и бросив оружие. Из нескольких захваченных пленных мы поняли, что один из них был из иностранного государства и в настоящее время допрашивают, чтобы выяснить, откуда он пришел."
 ANGOLA_UNT.24.d: "Попытка одной из наших групп напасть на то, что казалось разбросанным отрядом бойцов ФНЛА, обернулась катастрофическим поражением. Противник удержался и в конце концов прижал к земле несколько наших истребителей. Это позволило подойти подкреплениям ФНЛА и нанести большой урон нашим бойцам. Мы подозреваем, что отставшие члены ФНЛА на самом деле могли быть подразделением обученных солдат из соседнего государства, привлеченных для поддержки дела НФНА."
  
 Angolan_War_Decisions_category: "Ангольская война за независимость"
 Angolan_War_Decisions_category_desc: "[GetAngolaWarStatusDesc]"
 angola_war.1.d: "Послевоенная волна деколонизации и африканского национализма прокатилась по португальской колонии Ангола. Протест против условий труда привел к тому, что Португалия использовала чрезмерную силу, чтобы утвердить свое правление. Однако это только спровоцировало три крупных антиколониальных движения выйти и бороться с португальцами, нацелившись на европейских поселенцев. Португалия изо всех сил пытается удержать свою самую ценную колонию и защитить сотни тысяч поселенцев, живущих в Анголе. Три главные антиколониальные партии должны не только изгнать Португалию, но и договориться друг с другом, чтобы определить будущую судьбу Анголы.\n\n Текущая португальская сила: [?POR.ANGOLA_VICTORY_POINTS]\n Текущая сила FNLA: [?FNL.ANGOLA_VICTORY_POINTS]\n Текущая сила MPLA: [?ANG.ANGOLA_VICTORY_POINTS]\n Текущая сила UNITA: [?UNT.ANGOLA_VICTORY_POINTS]\n\nFunding для FNLA: [?FNL.global_fnla_funding] Миллиард\nFunding для MPLA: [?ANG.global_mpla_funding] Миллиард\nFunding для УНИТА: [?UNT.global_unita_funding] Billion\n\n Strength of FNLA Bases in Zaire [?295.FNLA_Camp_Level]/20\n strength of MPLA Bases in Zambia [?246.MPLA_Camp_Level]/20\n strength of UNITA Bases in Zambia [?246.UNITA_Camp_Level]/20"
 angola_war.2.d: "МПЛА, ФНЛА и УНИТА работали против португальского колониального правительства и военных. Однако даже во время войны за независимость эти три группы часто враждовали друг с другом. Когда Португалия предложила предоставить независимость, три группы независимости согласились разделить власть в Луанде. Однако почти сразу же начались междоусобицы, и по всей Анголе разразилась новая фаза войны. Теперь каждая сторона возвращается к своим опорным базам и начинает подготовку к тому, чтобы их партия стала бесспорным лидером независимой Анголы.\n\n Текущая сила FNLA: [?FNL.ANGOLA_VICTORY_POINTS]\n Текущая сила MPLA: [?ANG.ANGOLA_VICTORY_POINTS]\n Текущая сила UNITA: [?UNT.ANGOLA_VICTORY_POINTS]\n\n\nFunding для FNLA: [?FNL.global_fnla_funding] Billion\nFunding для MPLA: [?ANG.global_mpla_funding] Billion\Финансирование УНИТА: [?UNT.global_unita_funding] Billion\n\n Strength of FNLA Bases in Zaire [?295.FNLA_Camp_Level]/20\n Strength of MPLA Bases in Zambia [?246.MPLA_Camp_Level]/20\n strength of UNITA Bases in Zambia [?246.UNITA_Camp_Level]/20"
  
