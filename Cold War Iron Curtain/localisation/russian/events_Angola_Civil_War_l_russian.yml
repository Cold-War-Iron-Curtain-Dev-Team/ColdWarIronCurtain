 Angola_Expulsion.1.d: "Замбия уже давно открыла свои границы для группировок, выступающих против португальского колониального режима в Анголе. Кроме того, он способствовал перемещению оружия, поставок и инструкторов антиколониальным группам в регионе, поскольку это соответствовало замбийской вере в антиколониальное сопротивление и африканский национализм. Однако недавно Замбия объявила, что выгонит Национальный союз за полную независимость Анголы (УНИТА) со своих земель. Правительство Замбии заявило, что группа использует возможности Замбии, преследует граждан Замбии и строит заговоры против правительства. В частном порядке многие отмечают, что замбийское правительство также опасалось португальских трансграничных операций, которые могли бы дестабилизировать правительство. Кроме того, УНИТА нацелился на португальскую инфраструктуру в Анголе, включая железнодорожные линии, связывающие замбийские товары с побережьем, и отказ УНИТА не нацеливаться на такие маршруты также привел правительство в ярость."
 Angola_Expulsion.3.d: "Замбия уже давно открыла свои границы для группировок, выступающих против португальского колониального режима в Анголе. Кроме того, он способствовал перемещению оружия, поставок и инструкторов антиколониальным группам в регионе, поскольку это соответствовало замбийской вере в антиколониальное сопротивление и африканский национализм. Однако правительство Замбии объявило, что оно выгонит Народное движение за освобождение Анголы (МПЛА) со своих земель. Они ссылались на то, что МПЛА замышляет заговор против правительства, преследует замбийцев и не концентрируется на своей миссии по освобождению Анголы. В частном порядке ходят слухи, что правительство также опасалось спровоцировать Португалию на проведение более прямых трансграничных операций, которые могли бы дестабилизировать страну."
 Angola_Expulsion.2.d: "ФНЛА долгое время находила поддержку у Заира в плане военных советников, оружия и баз, с которых можно было бороться с португальским колониальным режимом. Однако ситуация изменилась после недавнего заявления правительства Заира о том, что Фронт национального освобождения Анголы (ФНЛА) будет изгнан из страны. Заир заявил, что ФНЛА злоупотребляет щедростью Заира и просто стала группой, накапливающей богатство, а не борющейся за свободу. В частном порядке многие предполагают, что Заир опасался, что Португалия может провести операции через границу и дестабилизировать правительство. Кроме того, если бы Заир подпрыгнул, успехи ФНЛА в северной Анголе открыли бы для них минеральные ресурсы, но этого не произошло, что привело бы к растущему разочарованию."
 Carnation_Revolution.0.d: "Португальское правительство и военные начали официальный вывод войск из Анголы. Сообщения в Луанде описывают морские суда и пассажирские самолеты, загруженные португальскими чиновниками и солдатами. Это знаменует собой конец португальского колониального господства в стране и прекращение ее военного конфликта с борцами за независимость Анголы. Действия Португалии начались после того, как она добилась соглашения с различными группами независимости, которые согласились на вывод войск в обмен на создание переходного правительства. После более чем четырех столетий сотрудничества с этим регионом Португалия наконец-то покинула свою самую ценную колонию в Африке. Говорят, что многие ангольцы вне себя от радости при мысли о том, что их страна наконец обретет независимость, хотя остается неясным, сможет ли переходное правительство удержать различные политические группы вместе."
 Carnation_Revolution.1.d: "Народ Португалии терпел самодержавное правление почти полвека. Акцент правительства на корпоративизме отталкивает португальский рабочий класс, в то время как непопулярные колониальные войны истощают богатство и стоят жизней. Недавняя книга генерала Антонио де Спинолы, командовавшего войсками в одной из колониальных войн, указывает на коррупцию и ошибки руководства страны и призывает к реформам. Вдохновленная его посланием, разочарованная клика молодых офицеров, названная Движением Вооруженных сил, планировала переворот. Используя заранее подготовленные музыкальные передачи в качестве сигналов, мятежные офицеры и солдаты захватили стратегические пункты и здания по всей стране. Невероятно, но этот военный переворот превратился в народную революцию, когда десятки тысяч людей вышли на улицы в поддержку повстанцев и вручили им гвоздики. Эта общественная поддержка помогла убедить правительство уйти в отставку и передать власть хунте во главе со Спинолой, которая обещала быстрый переход Португалии к демократии."
 Carnation_Revolution.2.d: "Недавняя книга генерала Антонио де Спинолы, командовавшего войсками в одной из колониальных войн, указывает на коррупцию и глупость правительства. Он призывает к реформам и вдохновил кабалу внутри вооруженных сил под названием "Движение вооруженных сил". Эта группа планировала переворот, который должен был начаться после заранее подготовленных музыкальных передач. Однако второй сигнал так и не был передан. Это привело к ситуации, когда подразделения повстанцев, реагируя на первый сигнал, выдвинулись на позиции, но не действовали. Это позволило лоялистским силам осознать ситуацию и отреагировать. В течение нескольких часов большинство повстанческих отрядов было разоружено. Некоторые подразделения действительно пытались выполнить свои задачи, но эти спорадические действия легко справлялись силами режима. Попытка переворота потерпела огромный провал и, вероятно, приведет к чистке радикально настроенных офицеров в армии. Хотя правительство заявило, что разгромило марксистский заговор, многие гражданские лица не убеждены в этом и, как говорят, подавлены этой новостью."
  
 Portugal_Victory_Angola.1.d: "Недавние военные успехи против коммунистической МПЛА привели к тому, что их аппарат и повстанческие сети практически полностью выкорчевали в Анголе. Наши силы беспрепятственно патрулируют, а наши разведывательные службы эффективно следят за центрами влияния МПЛА, особенно за школьными кампусами. МПЛА фактически была изгнана из Анголы, ее оставшиеся бойцы действуют из соседних государств, и любые вторжения, которые они совершают, обычно приводят к их выводу. Поскольку МПЛА фактически находится за пределами Анголы, Португалия надеется укрепить и восстановить свою власть во всей колонии."
 Portugal_Victory_Angola.3.d: "УНИТА возник как партизанская сила маоистского стиля, действующая на юго-востоке Анголы. Их разочаровывающая тактика вызвала много проблем для португальских войск. Однако после ряда военных неудач и провалов разведки португальское государство фактически вытеснило УНИТА из Анголы. Без базы в Анголе оставшиеся боевики, как говорят, базируются через границу соседних государств, но не имеют возможности удерживать ангольскую территорию. С фактическим удалением УНИТА из Анголы Португалия надеется укрепить и восстановить свою власть во всей колонии."
 Portugal_Victory_Angola.2.d: "ФНЛА вышла на сцену, пытаясь изгнать португальских поселенцев из Анголы с помощью кампании эскалации насилия. Однако недавние успехи португальских военных и разведчиков привели к тому, что группа практически была изгнана со всей территории Анголы, особенно с ее базы поддержки в северной Анголе. Говорят, что оставшиеся бойцы ФНЛА базируются в соседних государствах, но не продемонстрировали способности удерживать ангольскую территорию. С фактическим удалением ФНЛА из Анголы Португалия надеется укрепить и восстановить свою власть во всей колонии."
  
