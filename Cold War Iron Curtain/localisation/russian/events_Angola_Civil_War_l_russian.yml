 Eliminate_UNITA_MPLA: "Захватить контроль над Анголой"
 Angola_Prelude.1.d: "Стремясь лучше координировать свои усилия по освобождению Анголы от Португалии, Союз народов Анголы (УПА) согласился объединиться с Демократической партией Анголы (PDA) для формирования Национального фронта освобождения Анголы (FNLA). Это также позволит УПА, которая изначально была сепаратистской организацией Баконго, стать национальной организацией освобождения всей Анголы. Она расширила свои масштабы как этническое и политическое движение. Антиколониальная, анти-поселенческая и этническая идеология группы делает ее очень популярной, особенно в соседних государствах, стремящихся поддержать антиколониальные усилия, поскольку они опасаются, что более коммунистически ориентированная группа может иметь более широкие региональные амбиции."
 Angola_Prelude.2.d: "Ангольская коммунистическая партия под руководством Вириато да Круса объединилась с Партией объединенной борьбы за африканцев в Анголе (PLUA), чтобы сформировать Народное движение за освобождение Анголы (MPLA). Это слияние объединит интеллигенцию и городских активистов колониальной столицы Луанды с этнической группой амбунду. Эта база в идеале позволит организации эффективно организоваться, противостоять внешнему давлению и утвердиться в качестве главного движения за освобождение Анголы."
  
 UNITA.1.d: "Жонас Савимби и Антонио де Коста Фернандес создали Национальный союз за полное освобождение Анголы (УНИТА). Савимби первоначально состоял в Национальном фронте освобождения Анголы (ФНЛА), но чувствовал, что ему не хватает низового подхода, особенно в плане крестьянской реформы. После основания УНИТА сотни делегатов собрались на юго-востоке португальской Анголы. Группа стремится заручиться поддержкой этнической группы овимбунду. УНИТА придерживается более маоистской линии и рассчитывает на сотрудничество в своей кампании против Португалии с Народным движением за освобождение Анголы (МПЛА). УНИТА будет бороться не только с Португалией, но и с другими группировками, "идеологически противостоящими ей". Сможет ли она поддерживать сотрудничество с МПЛА, еще предстоит выяснить."
