l_english:
 Jor.1.d: "Сегодня, входя в мечеть Аль-Акса в оккупированном Восточном Иерусалиме, одинокий палестинский боевик выстрелил в короля Абдаллу I и его внука Хусейна. Хусейн отделался легким ранением, но король получил смертельные огнестрельные ранения и теперь скончался. Теперь на иорданский престол взойдет его сын Талал."
 Jor.2.d: "После того, как ему поставили диагноз шизофрения, парламент, которому он сам дал расширенные полномочия, решил, что король Талал будет вынужден отречься от престола из-за своей болезни. Теперь на иорданский престол взойдет его сын Хусейн."
 Jor.3.d: "Сегодня король Хусейн печально скончался от лимфомы и других заболеваний. Огромные толпы людей собрались у его больницы, когда он был объявлен мертвым, и он совсем недавно сделал своего сына Абдуллу иорданским наследным принцем, сменив своего брата Хасана. Теперь Абдалла взойдет на иорданский трон."
 Jor.4.d: "Сегодня Талал Иорданский подтвердил контроль в качестве иорданского монарха после того, как его парламент попытался отстранить его с помощью предложения о недоверии, когда Талал находился в больнице для лечения, и их доводы заключались в том, что Талал, по слухам, страдал шизофренией и поэтому не годился для правления. Таким образом, Талал подтвердил контроль на данный момент, но многие не уверены, что принесет будущее с Талалом у руля Иордании."
 Jor.5.d: "Сегодня правительство Иордании объявило о запрете крабов. Военный персонал был отправлен для сбора и депортации всех крабов, находящихся в Иордании. Талал считал крабов угрозой национальной безопасности и счел необходимым официально запретить их. Крабов уже судят в иорданских судах, и все, кого подозревают в укрывательстве беглых крабов, тоже будут судимы. Когда представителя правительства попросили объяснить, почему крабы рассматриваются как угроза национальной безопасности, он просто заявил, что это приказ Талала и поэтому не должен приниматься во внимание. Повсюду вокруг Иордании люди объединяются в замешательстве, и многие предполагают, что это может быть только началом странных тенденций Талала....."
 Jor.6.d: "Молодой полковник Гамаль Абдель Насер консолидировал власть в Совете революционного командования Египта (РКК). Насер-панарабист и убежденный антиимпериалист, до сих пор неизвестно, что планирует молодой новый президент Египта, но одно можно сказать наверняка. Для Египта и, возможно, всего арабского мира только что началась новая эра."
 Jor.7.d: "Со времен Накбы и оккупации западного берега Иордан страдает от напряжения израильтян и палестинских беженцев как в политическом, так и в экономическом плане. Палестинцы составляют значительную часть всего населения Иордании и более склонны к арабским националистическим и экстремистским идеологиям. Из-за большого их количества мы не можем выбить наиболее опасных из этих агитаторов и, таким образом, находимся в тупике, который создал напряженность внутри Иордании, которую могут почувствовать все. Мы должны в будущем решить, что делать с растущей проблемой."
 Jor.8.d: "Сегодня начальник военного штаба Али Абу Нувар начал операцию \"Хашем\", в ходе которой иорданские части окружили столицу Амман, когда Хусейн заподозрил движение войск и, думая, что Нувар проявляет силу, чтобы свергнуть Хусейна, он призвал Нувара вывести свои войска и предпринял шаги по роспуску арабистского правительства Сулеймана Набулси. Теперь Хусейну придется подождать и посмотреть, что получится из того, что он считает попыткой переворота против него."
 Jor.9.d: "Осознав подозрительные передвижения войск, инициированные начальником штаба Али Абу Нуваром, в ходе которых он окружил иорданскую столицу Амман, Хусейн быстро приказал Нувару немедленно вывести свои войска, что Нувар и сделал. Затем Хусейн занялся укреплением своих позиций, приказав арестовать тех, кто, как он утверждал, был заговорщиками против него, и свергнуть левое панарабское симпатизирующее правительство в парламенте, которое, когда пыль улеглась, обеспечило его правление."
 Jor.10.d: "Премьер-министр Сулейман Набулси, лидер арабских националистов, был вынужден уйти в отставку после борьбы с королем Хусейном за власть. Смещение Набулси подтолкнуло начальника штаба иорданской армии Али Абу Нувара к активизации городских иорданцев и палестинцев внутри лояльных ему военных. Сначала он должен был нейтрализовать верные королю воинские части бедуинов. Сначала он убедил короля Хусейна выслать из столицы основной бедуинский полк на военные учения. Когда они ушли, он послал лояльные ему подразделения, чтобы разоружить оставшиеся бедуинские подразделения и обеспечить безопасность ключевых правительственных зданий. Несмотря на мелкие стычки, заговор удался, и король вскоре был окружен. С его несостоятельным положением король Хусейн капитулировал. В национальном эфире Али Абу Нувар объявил о своей революции, конце монархии и новом правительстве Свободных офицеров. Он добавил, что уже ведутся переговоры об объединении с Объединенной Арабской Республикой для удовлетворения чаяний иорданского народа."
 Jor.11.d: "После десятилетий усилий гордые хашимитские династии Ирака и Иордании объявили о своем объединении в Арабскую федерацию. Два фактора оказались решающими в разрешении этого. Недавний подъем Объединенной Арабской Республики и ее опасная идеология, особенно среди народа, подтолкнули обе страны к признанию объединения как средства защиты народа. Что еще более важно, молодые монархи-друзья детства, и именно их личное желание послужило главным толчком к его успеху. Арабская федерация объединяет внешнюю политику и оборону обеих стран, но оставляет управление в руках каждой страны. Таким образом, оба монарха сохраняют свой высокий статус, но остаются способными противостоять арабской националистической угрозе, независимо от того, появляется ли она внутри страны или на границе. Оба монарха планируют устроить друг у друга банкеты в честь этого исторического дня для народа Ирака и Иордании."
 Jor.12.d: "Идеологическая борьба в арабском мире приняла сегодня серьезный сдвиг с объявлением Арабской Федерации между Ираком и Иорданией. Обе страны контролируются хашимитскими монархами, которые обязались объединить свою внешнюю и оборонную политику. Это рассматривается как прямая реакция на недавнее образование Объединенной Арабской Республики (ОАР). ОАР быстро осудил новый союз, назвав его последним выступлением реакционных князей и призвав арабов восстать в обеих странах. Иракское и иорданское правительства заявили, что Арабская федерация является кульминацией десятилетней мечты династии, и победителями станут народы Ирака и Иордании. В Аммане и Багдаде прошли про-королевские митинги, чтобы подчеркнуть популярность соглашения среди народа. Аналитики отмечают, что, несмотря на заявления об объединении, Арабская Федерация является главным образом военным альянсом, призванным противостоять ОАР."