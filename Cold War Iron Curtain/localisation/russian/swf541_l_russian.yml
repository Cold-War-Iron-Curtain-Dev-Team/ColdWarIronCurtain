 prc.50.d: "Мао Цзэдун объявил сегодня в Пекине, что он уйдет сегодня с поста главного секретаря Китайской Народной Республики. Он заявил, что настало время для выхода на пенсию и хотел проводить больше времени с людьми. Некоторые из сторонников Мао заявили, что его заставили покинуть пост после некоторых его реформ. Следующий лидер китайского народа будет объявлен в ближайшее время."
 prc.85.d: "Дэн Сяопин был отстранен от должности заместителя председателя Коммунистической партии Китая и других политических должностей. Мао Цзэдун сказал в своем сегодняшнем выступлении, что Дэн был заключен в тюрьму за то, что он был контрреволюционером и за его роль антиправительственных действий против руководства партии. Кампания Мао Цзэдуна против реформистов и антимаоистов продолжается в рамках его «Культурной революции». Многие приветствовали, когда Мао продолжил свою речь. Многие из критиков Мао заявили, что Дэн был убран только потому, что он был критиком Мао, и что он хотел более либерального Китая. Культурная революция Мао продолжается, когда Китай возвращается к своей истинной сущности."
 prc.75.d: "Лин Бяо, один из наших ближайших союзников и генералов, попал в аварию при попытке перебраться в СССР. Кажется, он был лидером проекта 571. Проект 571 - это кодовое имя нашего любимого лидера, Мао Цзэдуна, который должен был быть убит, а затем должен был начаться переворот против руководства партии. Любой из сторонников Мао будет посажен за решетку или казнен. Однако несколько наших чиновников раскрыли заговор и попытались его арестовать. Он сбежал со своей семьей, но, находясь над Монголией, потерпел крушение. С сообщениями, найденными в его офисе Советов, предлагающих поддержать его переворот и его лидерство, это заставляет нас задаться вопросом, действительно ли Советы на нашей стороне. Мы должны быть настороже, чтобы больше не было разногласий в нашем правительстве."
 prc.86.d: "Мао Цзэдун заключил Лю Шацуй в тюрьму после того, как Мао Цзэдун сказал в другой речи, что Шацуй был арестован за предательство правительства и партии. Мао заявил, что Шацуй был сторонником капитализма и хотел подорвать единство китайского народа. Шацуй также был обвинен в поддержке террористических актов против правительства Китая. Многие из критиков Мао заявили, что это еще один способ для Мао получить больше власти и устранить любую оппозицию. Мао показал, что его политика «Культурной революции» будет продолжаться и расти, чтобы устранить предателей в правительстве."
