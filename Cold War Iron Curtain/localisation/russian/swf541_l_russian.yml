 generic.1.t: "[FROM.GetName] хочет аннексировать нас!"
 generic.1.d: "У [FROM.GetNameDef] есть планы по аннексии всей нашей территории для личной выгоды. Позволим ли мы им разрушить культуру и историю наших стран, присоединившись, или мы будем сопротивляться, чтобы защитить нашу страну и наш народ?"
 generic.1.a: "Мир всем."
 generic.1.b: "Будем драться!"
 generic.2.t: "[FROM.GetName] приглашает нас в свой альянс"
 generic.2.d: "[FROM.GetNameDef] хочет, чтобы мы присоединились к их альянсу. Мы могли бы объединить наши силы и бороться против общего врага."
 generic.2.a: "Мы будем вместе."
 generic.2.b: "Нет, спасибо."
 generic.3.t: "[FROM.GetName] присоединился к нашему альянсу"
 generic.3.d: "[FROM.GetNameDef] присоединились к нам и теперь мы будем вместе."
 generic.3.a: "Мы будем вместе."
 generic.4.t: "[FROM.GetName] отказался от нашего приглашения"
 generic.4.d: "[FROM.GetNameDef] не хочет вступать в наш альянс."
 generic.4.a: "Это грустный день."
 generic.5.t: "[FROM.GetName] хочет объединить страны"
 generic.5.d: "[FROM.GetNameDef] хочет, чтобы мы присоединились к их стране и объединились под общим флагом."
 generic.5.a: "Объединение!"
 generic.5.b: "Нет, спасибо."
 generic.6.t: "[FROM.GetName] присоединился к стране"
 generic.6.d: "[FROM.GetNameDef] теперь часть нашей страны."
 generic.6.a: "Очень хорошо."
 generic.7.t: "[FROM.GetName] отказался от нашего предложения"
 generic.7.d: "[FROM.GetNameDef] не хочет объединяться под единым флагом."
 generic.7.a: "Это грустный день."
 generic.8.t: "[FROM.GetName] хочет присоединиться к нашему альянсу"
 generic.8.d: "[FROM.GetNameDef] хочет, чтобы мы объединили наши усилия и стали членом нашего альянса."
 generic.8.a: "Они могут присоединиться."
 generic.8.b: "Нет, они остаются вне."
 generic.9.t: "[FROM.GetName] позволили нам присоединиться"
 generic.9.d: "[FROM.GetNameDef] позволили нам стать членом их альянса."
 generic.9.a: "Мы будем сражаться под тем же флагом."
 generic.10.t: "[FROM.GetName] отказались"
 generic.10.d: "[FROM.GetNameDef] не хочет, чтобы мы были внутри их альянса."
 generic.10.a: "Позор."
 generic.19.t: "[FROM.GetName] предлагает обмен лицензиями"
 generic.19.d: "[FROM.GetNameDef] предлагает разделить лицензии на производство."
 generic.19.a: "Конечно!"
 generic.19.b: "Нет, спасибо."
 generic.20.t: "[FROM.GetName] дает добро на совместное использование лицензий"
 generic.20.d: "[FROM.GetNameDef] дают добро на пользование лицензиями."
 generic.20.a: "Очень хорошо!"
 generic.21.t: "[FROM.GetName] отказали в совместном использовании лицензии"
 generic.21.d: "[FROM.GetNameDef] не хочет делиться своими лицензиями на производство с нами."
 generic.21.a: "Печально..."
 generic.22.t: "[From.GetName] хочет вступить в НАТО"
 generic.22.d: "[From.GetNameDef] хотел бы вступить в Оборонительный альянс НАТО и сражаться на нашей стороне в случае нападения на одного из членов. Мы также будем защищать их, когда они становятся жертвами нападения."
 generic.22.a: "Мы принимаем их."
 generic.22.b: "Мы должны отказать им по стратегическим причинам."
 generic.23.t: "[From.GetName] принял наш запрос"
 generic.23.d: "[From.GetNameDef] принял нашу просьбу о вступлении в НАТО. Теперь мы будем на их стороне."
 generic.23.a: "Здорово!"
 generic.24.t: "[From.GetName] отклонил наш запрос"
 generic.24.d: "[From.GetNameDef] отклонил нашу просьбу о вступлении в НАТО."
 generic.24.b: "Нет! Зачем?"
