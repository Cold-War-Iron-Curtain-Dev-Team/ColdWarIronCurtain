 FRA_DeGaulle_Declines_desc: "Падение французского правительства в условиях кризиса, всего за несколько часов до истечения срока Алжирского ультиматума, ознаменовало на один день вакантность парижской власти. Несмотря на угрозу силового захвата власти, генерал де Голль отклонил предложение стать председателем Совета, предложенное президентом Рене Коти, который был вынужден уйти в отставку, как и обещал в случае отказа."
