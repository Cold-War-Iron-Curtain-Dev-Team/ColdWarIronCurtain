 FRA_ind_dev: "Развивать Промышленность"
 FRA_ind_dev_desc: "После завершения реконструкции дальнейшее развитие нашего промышленного сектора определенно необходимо."
 FRA_mainland: "Материк"
 FRA_mainland_desc: "Поскольку метрополия является сердцем нашей нации, развитие ее промышленного потенциала определенно необходимо."
 FRA_urbanism: "Урбанизм"
 FRA_urbanism_desc: "В наших городских регионах наблюдается бурный рост населения, большая часть которого происходит за счет людей, переезжающих из сельской местности. Необходимо дальнейшее развитие и расширение наших городов и поселков."
 FRA_mic_one: "Военное Развитие"
 FRA_mic_one_desc: "Поскольку Красная Угроза настолько распространена даже в нашей собственной стране, наращивание военного производства особенно необходимо."
 FRA_mic_two: "Продолжать Развивать нашу Военную Промышленность"
 FRA_mic_two_desc: "Наши вооруженные силы нуждаются в дальнейшей модернизации, чтобы не отставать от других крупных держав."
 FRA_cic_one: "Гражданское Развитие"
 FRA_cic_one_desc: "Наш гражданский сектор был сильно поврежден во время войны, теперь он восстановлен, дальнейшее развитие и инвестиции должны защитить нашу нацию от дальнейшего ущерба."
 FRA_more_cic: "Продолжать Расширять Гражданскую Промышленность"
 FRA_more_cic_desc: "Наш гражданский сектор нуждается в инвестициях для дальнейшего укрепления нашей промышленности."
 FRA_ind_reform: "Успешная Индустриализация"
 FRA_ind_reform_desc: "Текущие планы по дальнейшему расширению нашей промышленности были выполнены надлежащим образом."
  
  
  
  
