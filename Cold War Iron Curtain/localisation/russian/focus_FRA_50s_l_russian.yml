 FRA_Indochina_War_category_desc: "Индокитайская Война\n\nПосле долгой кампании сопротивления против французов и японцев, силы Вьет Мина заявили о победе (Августовская революция) после того, как японские и вишистские французские войска капитулировали на севере 15 августа 1945.\n\nВ войне во Вьетнаме британские войска временно оккупировали Юг, начиная с 13 сентября 1945, только чтобы восстановить французский колониальный контроль в 1946 году. В ООН и в рамках союза с Великобританией и США французы потребовали возвращения своей бывшей колонии Индокитая, прежде чем согласились участвовать в альянсе НАТО, противостоящем советской экспансии за пределы стран Коминтерна в холодной войне.\n\n\nКоммунистический Вьет Мин, которого союзники поддерживали во время Второй мировой войны, продолжил борьбу с французами при поддержке коммунистического Китая и Советского Союза."
