 SUPER_EVENT_WINTER_OF_1954_DESC: "Зимой 1954, когда температура на продолжительное время упала ниже -15°C, аббат Пьер, бывший боец сопротивления и бывший депутат МРП, выступил в национальных СМИ с призывом к социальной солидарности, чтобы помочь бедным и обездоленным. дома, которым грозила опасность замерзнуть до смерти в полном социальном и медийном неведении. Это начало "Восстания добра"."
 abbe_pierre.1.d: "Друзья мои, придите на помощь... Женщина замерзла насмерть сегодня в три часа ночи на тротуаре бульвара Севастополь, сжимая в руках уведомление о выселении, которое накануне сделало ее бездомной... Каждую ночь более двух тысяч человек переносят холод, без еды, без хлеба, более одного почти голого. Чтобы противостоять этому ужасу, аварийного жилья недостаточно. Выслушайте меня; за последние три часа были созданы два центра помощи: один под навесом у подножия Пантеона, на улице Монтань-Сент-Женевьев; другой в Курбевуа. Они уже переполнены, мы должны открыть их повсюду. Сегодня вечером, в каждом городе Франции, в каждом квартале Парижа, мы должны вывесить плакаты под фонарем в темноте, у дверей мест, где есть одеяла, койки, суп; где можно прочитать под заголовком "Центр братской помощи" эти простые слова: 'Если ты страдаешь, кто бы ты ни был, войди, поешь, поспи, обрети надежду, здесь тебя любят'. Прогноз на месяц - суровые морозы. Пока длится зима, пока существуют эти центры, пока их братья умирают в нищете, все человечество должно иметь одну волю: волю сделать эту ситуацию невозможной. Я прошу вас, давайте любить друг друга настолько, чтобы сделать это сейчас. Пусть из столь сильной боли нам будет дана прекрасная вещь: общий дух Франции. Спасибо! Каждый может помочь тем, кто остался без крова. Нам нужно сегодня вечером и самое позднее завтра пять тысяч одеял, триста больших американских палаток и двести каталитических печей. Приносите их быстро в отель "Рочестер", номер девяносто два, улица Ла Боэти. Встреча добровольцев и грузовиков для перевозки: сегодня в одиннадцать, перед палаткой на Монтань-Сент-Женевьев. Благодаря вам сегодня ни один человек, ни один ребенок не будет спать на асфальте или на набережных Парижа."
