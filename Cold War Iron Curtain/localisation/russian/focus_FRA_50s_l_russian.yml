 FRA_NATO_PCF.1.d: "После победы на выборах Французская Коммунистическая Партия (ФКП) начала действовать в соответствии со своим мандатом. С момента создания НАТО в 1949 году многие во Франции стали подозревать, что альянс подрывает независимость французских вооруженных сил и государства. Более того, ФКП утверждала, что альянс стремится подорвать волю народа в странах-членах. В конечном итоге Соединенные Штаты могут использовать НАТО для активных действий против левых или любых групп, считающихся угрозой. Исходя из этих опасений и мыслей, ФКП объявила о прекращении членства Франции в НАТО и о полном выходе Франции из НАТО. Франция больше не будет инструментом империалистических интересов США или даже Великобритании и, наконец, станет полностью независимой от внешнего влияния. Новость о решении Франции прекратить свое членство в НАТО потрясла Вашингтон и Лондон. Оба они представляли себе Францию как главную опору для обороны стран-членов НАТО, особенно в континентальной Европе. Советский Союз, как говорят, приветствовал это заявление и надеется на продолжение сотрудничества с новым французским правительством."
 ALG_Partition.1.d: "Сегодня французское правительство осуществило раздел Алжира. План был задуман несколькими старшими советниками президента и членами Национального собрания, которые стремятся отделить европейские районы Алжира от неевропейских. Наблюдатели отмечают, что французам удалось провести линии раздела таким образом, чтобы оставить европейской части доступ к ключевым инфраструктурам и месторождениям ресурсов в ущерб демографическим реалиям на местах. Французы утверждают, что раздел даст право на самоуправление пьед-нуар и арабскому населению, и утверждают, что это приведет к безопасности и прочному миру. Однако критики отмечают, что в результате проведения границ тысячи арабов остаются за пределами своих районов, а арабское алжирское государство не имеет доступа к ключевым ресурсам. Учитывая историю Балкан и недавнюю историю Ближнего Востока, эта ситуация кажется созревшей для продолжения насилия, массовой депортации или политических репрессий вместо прочного мира. На международном уровне план Франции был встречен сдержанной реакцией со стороны основных колониальных держав и США. Они надеются, что план приведет к укреплению мира, но решили публично не одобрять французскую политику. Среди арабского мира и деколонизированных государств Африки и Азии реакцией стала горячая риторика с осуждением того, что рассматривается как попытка сохранить империализм."
 Gladio_Reveal.1.d: "На ошеломляющей пресс-конференции в Париже французское правительство объявило об обнаружении секретной военизированной армии на территории Франции и всех государств НАТО. После Второй мировой войны Соединенные Штаты и Соединенное Королевство создали секретные склады оружия и ячейки боевиков для активизации движения сопротивления в случае советского вторжения. Программа называлась операция "Гладио" и была развернута на оккупированных союзниками территориях Германии, Италии и Франции. К моменту образования НАТО программа создания спящих ячеек военизированных формирований действовала во всех государствах-членах. Французское правительство заявило, что патриотически настроенные офицеры французской армии проинформировали правительство об этой секретной организации на фоне опасений, что Соединенные Штаты планируют задействовать французские военизированные формирования для дестабилизации французского правительства. Министр обороны заявил: "Франция обнародовала эту информацию, чтобы защитить себя от иностранной агрессии и продемонстрировать нашим европейским друзьям, что на самом деле влечет за собой американская "свобода"!" После появления новостей граждане стран НАТО вышли на улицы в знак протеста против этих секретных армий."
 VIN_PCF.1.d: "Война в Индокитае затянулась с 1946, Франция потратила много крови и денег, чтобы вернуть территорию под французское правление. Однако ФКП, как и многие другие, давно осознала, что этот конфликт лишь способствовал восстановлению французского колониализма в эпоху деколонизации. ФКП видела в конфликте семена французского упадка, а не восстановление былой славы. По мере затягивания конфликта французское государство становилось все более зависимым от экономической и военной помощи США. Вести империалистическую войну после получения избирательного мандата от французского народа на правление в его интересах было бессмысленно. Исходя из этих соображений, французское правительство объявило, что признает независимое вьетнамское государство под контролем Вьетминя, который объединил все основные партии независимости в стране и явно является лучшим представителем интересов Вьетнама. Париж с ликованием отреагировал на эту новость: тысячи студентов вышли на улицы и отпраздновали окончание войны. Войска возвращались домой, и кошмар Франции в Индокитае подходил к концу."
 French_Euroskepticism.1.d: "Римский договор и созданный на его основе Европейский экономический союз (ЕЭС) представляли собой все, что ненавидели президент Пьер Пужад и его соратники-пужадисты. В своем обращении к нации президент Пужад заявил, что эта организация лишит Францию экономического суверенитета и поставит французов под контроль иностранных элит и поддерживающих их международных корпораций. Политика, которую поддерживает ЕЭС, в конечном итоге приведет к разрушению французской культуры и общества. Фермеры будут вынуждены проводить масштабную индустриализацию, чтобы конкурировать на рынке, уничтожая сельскую местность и их образ жизни. Прекрасные города Франции будут превращены в городские фабрики, что приведет к моральному упадку и распространению упаднических иностранных идей. Чтобы предотвратить такую катастрофу, президент Пужад объявил, что Франция отвергнет Римский договор и полностью выйдет из ЕЭС. Франция не будет участвовать в организации, призванной разрушить европейский суверенитет и идентичность. Для сторон, подписавших Римский договор, выход Франции - это огромный удар по мечте о едином европейском рынке и экономическом союзе."
 ALG_Comp.3.d: "С учетом результатов двух недавних референдумов, один из которых был проведен на материке, а другой - "pieds noirs", французские военные в Алжире решили действовать. Под руководством отставного генерала Рауля Салана элитные французские подразделения Алжира быстро захватили контроль над городом. По всему Алжиру другие подразделения захватили ключевые объекты, в частности, радиостанции, порты и аэропорты. Генерал Салан объявил, что военные захватили контроль над Алжиром, чтобы сохранить свободу и жизнь "пьед нуар" и профранцузски настроенных мусульман. Он провозгласил Алжирскую Республику под своим руководством и поклялся не оставить Алжир и не позволить жертвам военных оказаться напрасными. Для французского правительства в Париже эти события стали полной неожиданностью, а попытки наладить связь с Алжиром или даже вмешаться в ситуацию весьма ограничены из-за захвата ключевых объектов восставшими солдатами. Многие наблюдатели считают, что прогресс в мирных переговорах теперь остановлен, и если ситуация не изменится, боевые действия в Алжире могут разгореться с новой силой."
 ALG_Comp.4.d: "военная хунта во главе с генералом Раулем Саланом не продвигалась вперед. Французские власти были особенно раздражены тем, что Салан и его сторонники использовали время, потраченное на переговоры, для того, чтобы полностью перехватить у правительства все управление Алжиром. Один из французских чиновников отметил, что правительство больше не может обслуживать шайку мятежных офицеров. Представитель самопровозглашенной Алжирской Республики лишь заявил, что Алжир остается французским и свободным только благодаря руководству генерала Салана и его храбрых офицеров. Наблюдатели отмечают, что отказ от торговли или отношений может вызвать крупный кризис снабжения для режима Салана. Похоже, Франция надеется, что такой кризис заставит Салана отступить."
 ALG_Comp.5.d: "После захвата Алжира генералом Раулем Саланом и провозглашения Алжирской Республики многие во Франции потребовали объяснений, как правительство так ужасно распорядилось ситуацией. Вслед за выступлениями в Национальном собрании и уличными протестами президент Рене Коти подал прошение об отставке. В письменном заявлении он выразил сожаление по поводу того, как все закончилось, и выразил надежду, что его преемник сможет спасти Францию от катастрофы, отметив, что, возможно, необходимо новое направление, поскольку нынешняя система политики ведет к разобщенности и нестабильности. Его преемником стал консервативный политик Антуан Пине. Многие наблюдатели высоко оценивают успехи Пине в финансовой и экономической политике на протяжении всей его карьеры, и он считается опытным политиком. Есть надежда, что этот опыт поможет направить нацию к политическому единству перед лицом международных проблем Франции и кризиса Алжирской Республики."
 FFL_Relocation.1.d: "Французский Иностранный Легион (ФИЛ) долгое время был ударными войсками французской империи и нации. Его личный состав долгое время придерживался принципов того, что значит быть французом, и долгое время полагался на правительство во время кризиса. Однако во время недавнего военного захвата в Алжире несколько подразделений Иностранного легиона приняли участие и активно присоединились к захвату. Это сделало подразделение подозрительным для французского правительства, которое решило вывести ФИЛ из Алжира. Подразделения ФИЛ из Алжира должны быть расформированы, а личный состав переведен в другие подразделения ФИЛ. По сообщениям, поступившим из казарм ФИЛ в Сидди Бель Аббес, внутри слышны пожары и громкие звуки. По всей видимости, личный состав разгневан этими событиями и сжег историческую реликвию из истории полка. Несмотря на гнев, ожидается, что легионеры подчинятся, поскольку они по-прежнему преданы Франции и получению французского гражданства по окончании службы. Париж уверен, что ФИЛ вернется в полном порядке, и надеется на реабилитацию личного состава после возвращения на материк."
 FRA_Referendum.10.d: "Народ Франции и ее территорий голосует за принятие новой конституции, разработанной под руководством Шарля де Голля. Недавний кризис в Алжире вызвал волнения на улицах, среди военных и нестабильность в Национальном собрании. Национальный герой Шарль де Голль вернулся в политику и призвал положить конец Четвертой республике. Он потребовал принятия новой конституции, которая бы больше подходила Франции. Неспособность правительства эффективно ответить на эти вызовы привела к тому, что Четвертая республика самораспустилась и провела конституционное собрание под управлением де Голля. Новая конституция направлена на создание сильной президентской системы и наделяет де Голля чрезвычайными полномочиями на первые шесть месяцев. Четвертая республика сохранила власть в законодательных органах, но ее положения, направленные на предотвращение политического раскола, в основном не сработали. Конституция де Голля стремилась помочь Франции в решении насущных проблем холодной войны и деколонизации. На референдуме французский электорат стоит перед двумя вариантами. Принять ли конституцию де Голля и провозгласить Пятую республику или отвергнуть ее/"
 ALG_Comp.1.d: "Французское правительство приняло решение о проведении референдума для народа Франции. Оно просит население одобрить план по предоставлению народам Алжира права на самоопределение. Референдум гласит: \"Одобряете ли вы законопроект, представленный французскому народу президентом республики и касающийся самоопределения населения Алжира и организации органов государственной власти в Алжире до самоопределения?" Правительство надеется, что общественная поддержка его планов через референдум позволит ему урегулировать алжирскую войну и принять трудные решения с доверием французского народа. Противники рассматривают это как начало капитуляции Алжира и оставление французской земли и граждан Франции. Сторонники референдума говорят, что самоопределение отражает французские демократические ценности и считают статус-кво в Алжире неустойчивым."
 ALG_Comp.2.d: "Пьед нуар живут в Алжире с 1830. Представляя более десяти процентов населения Алжира, эта группа играет решающую роль в управлении, экономическом, социальном и культурном развитии Алжира с момента начала французской колонизации. С начала Алжирской войны "pieds noirs" доказали свою жизненную важность в поддержке усилий колониального правительства по разгрому повстанцев. Они предоставляли важную разведывательную информацию, военных добровольцев и безопасные районы для действий французских войск. Поскольку французское правительство на материке все больше продвигается в направлении признания самоопределения, лидеры "пьед нуар" утверждают, что этот путь приведет к независимости Алжира, правлению большинства и разрушению их образа жизни. Они не видят шансов на компромисс с большинством населения, которому, по их мнению, не хватает культурного развития или политической зрелости для примирения. Резня и репрессии станут их будущим. Нельзя больше полагаться на то, что Франция будет служить их интересам. Вместо этого "пьедесталы нуара" должны сами распоряжаться своей судьбой и обеспечить безопасность Алжира. Чтобы добиться этого, руководство пьед-нуар организовало референдум о том, должен ли Алжир управляться и править пьед-нуар. Эта система правления меньшинства обеспечит самобытность Алжира и, что более важно, сохранит Алжир от деградации. Отказ от этого референдума будет означать согласие на самоопределение."
 MNA.1.d: "Алжирское национальное движение (АНД) возникло под руководством националиста Мессали Хаджа как альтернативное националистическое движение Фронту Национального Освобождения (ФНО). ФНО долгое время претендовал на роль единственного представителя алжирского народа в борьбе против французского колониализма. Появление АНД опровергает это мнение, и появились сообщения, что ФНО готовит заговор с целью уничтожения этой группы. Возможно, в интересах Франции будет тайно финансировать и поддерживать АНД, поскольку ее лидер изначально не поддерживал вооруженную борьбу ФНО. Если группировка будет набирать силу, это приведет к междоусобицам среди националистических групп. Это может дать нашим силам безопасности больше свободы и поможет нам легче разбить повстанцев, поскольку мы сможем переиграть эти группы друг с другом. Мы должны решить, хотим ли мы тайно поддерживать АНД и надеяться, что они смогут разделить послание ФНО и его боеспособность."
