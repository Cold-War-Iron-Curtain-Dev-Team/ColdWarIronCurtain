  ### 1951 ELECTIONS ### 
  ###################### 
  
 FRA_Elections_of_1951: "Законодательные выборы 1951"
 FRA_Elections_of_1951_desc: "Выборы во Франции 1951 могут оказаться важным поворотным моментом для Республики. Основными соперниками являются Третья Сила, СФН и ФКП. Наши западные друзья надеются, что победит либо Третья Сила, либо СФН, так как победа ФКП станет проблемой, но мы никогда не знаем, что ждет нас в будущем."
  
  ### RPF VICTORY ### 
  
 FRA_RPF_Victory: "Большинство СФН"
 FRA_RPF_Victory_desc: "Консервативная Партия Франции, или СФН, смогла получить большинство в парламенте. Благодаря этому они также установили лояльного премьер-министра, а это значит, что если все получится, будущее Франции может оказаться в руках Шарля де Голля."
 FRA_Economic_Third_Way: "Экономический Третий Путь"
 FRA_Economic_Third_Way_desc: "Французская экономика слишком долго пыталась найти компромисс между левыми и правыми. Пришло время окончательно подтвердить нашу верность капиталистическому и западному миру. С помощью этого закона французская экономика адаптирует основные принципы капитализма и начнет свой полный отказ от коммунизма."
 FRA_Presidential_Empowerment_decree: "Указ о Расширении Полномочий Президента"
 FRA_Presidential_Empowerment_decree_desc: "Мы почти всегда выступали за более влиятельного президента. Сегодня наш премьер-министр планирует сформировать указ, чтобы сделать именно это, и с одобрения президента он должен стать законом."
 FRA_Reform_the_voting_system: "Реформировать Систему Голосования"
 FRA_Reform_the_voting_system_desc: "Французская Система Голосования - это катастрофа. Она контролируется коррумпированным парламентом, который всегда голосует в интересах своих членов, а президентские выборы во Франции - это сплошной бардак. Пришло время положить этому конец. Французская избирательная система должна измениться."
 FRA_Reform_the_RTF: "Реформировать РТФ"
 FRA_Reform_the_RTF_desc: "Французское телевидение долгое время было гордой и выдающейся телевизионной станцией, но оно постарело, заржавело, а некоторые сказали бы даже бесполезным. В связи с этим мы разработали программу его реформирования и восстановления на прежнем месте."
 FRA_Favorize_Gaullist_Syndicates: "Фаворизировать Голлистские Синдикаты"
 FRA_Favorize_Gaullist_Syndicates_desc: "В нашей стране существует множество синдикатов, которые продвигают или следуют широкому спектру идеологий. Благодаря большой популярности Шарля де Голля среди них и сходству наших программ, имеет смысл отдать им предпочтение в парламенте."
 FRA_Finish_the_Dams: "Завершить Строительство Плотин"
 FRA_Finish_the_Dams_desc: "Наши запасы воды и гидроэлектроэнергии крайне малы, как в Метрополии, так и в наших африканских землях. Завершив наш текущий проект плотин в обоих регионах, мы сможем решить обе эти проблемы."
 FRA_Appoint_Giscard_Finances_Minister: "Назначить Жискара Министром Финансов"
 FRA_Appoint_Giscard_Finances_Minister_desc: "Валерий Жискар, политик с консервативными взглядами, зарекомендовал себя как полезный экономический советник на местном уровне. В связи с этим мы рассматриваем возможность назначить его министром финансов. Надеемся, он сможет помочь нашему правительству снизить гиперинфляцию."
 FRA_Pragmatic_Politics: "Прагматичная Политика"
 FRA_Pragmatic_Politics_desc: "Проклятая Четвертая Республика! Наши политики и президент ничего не делают, сидят сложа руки и ждут чуда. Пришло время положить этому конец! Мы, СФН, больше не можем ждать, и настал момент, когда Республика должна начать действовать!"
 FRA_Breakup_of_the_Troisieme_Force_Coalition: "Распад Коалиции Третьей Силы"
 FRA_Breakup_of_the_Troisieme_Force_Coalition_desc: "Центристские политики, вместо того, чтобы признать поражение и работать с нами, пытаются увлечь нашу славную страну за собой. По этой причине, президентским актом, поддержанным премьер-министром, мы разрушим их коалицию и не оставим сомнений в том, кто контролирует ситуацию."
 FRA_National_Referendum_on_the_Republic: "Национальный Референдум о Республике"
 FRA_National_Referendum_on_the_Republic_desc: "Третья Республика - это просто отсталая система. Президент почти не имеет власти, в то время как премьер-министр, часто являющийся марионеткой парламента, практически купается в ней. Парламент, как всегда идиотский, не изменит этого, но народ, он не так глуп, и он ХОЧЕТ изменить это, и мы дадим ему право сделать это, проголосовав на референдуме."
 FRA_Marginalization_of_the_Communists: "Маргинализация Коммунистов"
 FRA_Marginalization_of_the_Communists_desc: "Коммунистическая партия - это советские агенты и ничего больше, и за это они должны быть маргинализированы на следующих выборах. У народа не должно быть даже шанса провести в парламент коммунистических провокаторов, и мы позаботимся о том, чтобы они этого не получили. "
 FRA_Find_an_agreement_with_Tunisia: "Найти Соглашение с Тунисом"
 FRA_Find_an_agreement_with_Tunisia_desc: "В последнее время у Французской Республики возникли большие проблемы в Тунисе. Чтобы положить им конец, мы должны попытаться заключить соглашение с коренными тунисцами, может быть, независимость, может быть, автономию - кто знает, но что-то должно быть сделано."
 FRA_Devaluate_the_Franc: "Девальвировать Франк"
 FRA_Devaluate_the_Franc_desc: "Французский франк так долго держался на таком высоком уровне, что почти разрушил нашу экономику. Мы должны обесценить его быстро, пока наша экономика и валюта не упали слишком далеко, чтобы их можно было спасти."
 FRA_Intensify_Nuclear_Program: "Интенсифицировать Ядерную Программу"
 FRA_Intensify_Nuclear_Program_desc: "Совершенно ясно, что ядерная сила будет решающим фактором в любой предстоящей крупной войне, и мы должны стремиться иметь сильный и функционирующий арсенал."
 FRA_Invest_in_Rocketry: "Инвестировать в Ракетное Дело"
 FRA_Invest_in_Rocketry_desc: "Эта война между Востоком и Западом холодная, но ничто не дает нам уверенности в том, что в конце концов она не станет горячей. По этой причине мы должны быть уверены, что у нас есть огневая мощь и ракеты, чтобы защитить себя."
 FRA_Propose_a_constitutional_Reform: "Предложить Конституционную Реформу"
 FRA_Propose_a_constitutional_Reform_desc: "Третья республика закончилась. Наше послание нашло отклик у нашего народа, который хочет двигаться дальше от правительств "хромых уток" прошлого. Пришло время реформировать конституцию и дать больше власти президенту, который сможет провести нас через эти неспокойные времена."
  
