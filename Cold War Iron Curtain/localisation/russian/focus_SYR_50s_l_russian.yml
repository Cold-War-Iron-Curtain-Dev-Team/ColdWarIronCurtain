l_russian:
  
 SYR_fledglingoilindustry: "Зарождающася нефтяная промышленность"
 SYR_fledglingoilindustry_desc: "Пускай однажды нам уже не удалось найти нефть, но мы попробуем еще раз её отыскать."
 SYR_localsteelproduction: "Местная добыча стали"
 SYR_localsteelproduction_desc: "Добыча стали в нашем государстве нечтожно мала, но мы можем инвестировать в её развитие."
 SYR_karatchokoilfield: "Карачокское нефтяное месторождение"
 SYR_karatchokoilfield_desc: "В 1949 году мы обратились к Джеймсу У. Менхоллу с просьбой приехать в Сирию на поиски нефти. Буровая компания Джеймса У. Менхолла получила концессию на начало бурения в Карачоке. Вскоре Менхолл открыл месторождение нефти в Карачоке с запасами более 1 миллиарда баррелей."
 SYR_growingprivatesectori: "Расширяющийся частный сектор"
 SYR_growingprivatesectori_desc: "Государственные расходы на поддержку частного сектора смогут способствовать росту нашей экономики."
 SYR_growingmilitaryindustryi: "Растущий военно-промышленный комплекс"
 SYR_growingmilitaryindustryi_desc: "Мы должны иметь собственные военные заводы, чтобы, по крайней мере, поддерживать запас наших боеприпасов."
 SYR_textilemills: "Текстильные фабрики"
 SYR_textilemills_desc: "В связи с Корейской войной спрос на хлопок вырос. Мы должны воспользоваться этим шансом и инвестировать в текстильную промышленность для экспорта хлопчатобумажной ткани."
 SYR_nationalisetherailways: "Национализировать железные дороги"
 SYR_nationalisetherailways_desc: "Железные дороги в Сирии раздроблены и принадлежат частным компаниям. Национализация централизует их под нашим руководством."
 SYR_universityofaleppo: "Университет в Алеппо"
 SYR_universityofaleppo_desc: "Открытие университета в Алеппо, нашего второго университета в стране, позволит нам использовать новые научные умы в наших исследованиях."
 SYR_growingmilitaryindustryii: "Расширенние военно-промышленного комплекса"
 SYR_growingmilitaryindustryii_desc: "Бывшие французские военные заводы могут быть использованы для нашей промышленности."
 SYR_encourageprivateinvestments: "Стимулирование частных инвестиций"
 SYR_encourageprivateinvestments_desc: "Стимулирование частных инвестиций позволит нам быстрее развить нашу промышленность."
 SYR_seeksaudiforgiveness: "Попросить прощения у Саудовской Аравии"
 SYR_seeksaudiforgiveness_desc: "Левые становятся не контролируемыми и беспокоят Саудовскую Аравию. Нам необходимо извинится перед ними."
 SYR_palestiniansoldiers: "Солдаты из Палестины"
 SYR_palestiniansoldiers_desc: "У нас есть много беженцев из Палестины. Мы позволим им стать солдатами, чтобы однажды они вернули свой дом у Израиля."
 SYR_foilthecia: "Сорвать планы ЦРУ"
 SYR_foilthecia_desc: "Коварные американцы готовят свой очередной план по перевороту. Но не в этот раз, и пускай заберут своего посла назад."
 SYR_seekegyptiansupport: "Обратиться за помощю к египтянам"
 SYR_seekegyptiansupport_desc: "Мы все еще имем связи с народом Египта. Мы попросим их об поддержке."
 SYR_requestunionwithegypt: "Предложить Египту союз"
 SYR_requestunionwithegypt_desc: "При поддержке Египта в борьбе с Багдадским пактом, большинство сирийцев поддержат объединение с Египтом. Мы официально предложим им Союз."
 SYR_formtheunitedarabrepublic: "Создание Объединенной Арабской Республики"
 SYR_formtheunitedarabrepublic_desc: "Египта и Сирии больше нет. Да здравствует Объединенная Арабская Республика!"
 SYR_cuttieswithegypt: "Разорвать связи с Египтом"
 SYR_cuttieswithegypt_desc: "Мы больше не можем поддерживать дружественные отношения с Египтом. Они, к сожалению, связывают нам руки."
 SYR_egyptiansyrianagreement: "Сирийско-Египетский договор"
 SYR_egyptiansyrianagreement_desc: "Египет и Сирия очень похожи друг на друга. Мы должны работать вместе с Багдадским пактом."
 SYR_acquireww2aircraft: "Закупка самолетов времён ВМВ"
 SYR_acquireww2aircraft_desc: "Мы можем закупать самолеты из Европы, чтобы значительно увеличить наше превосходство в воздухе. Также нам будут доступны британские Метеоры."
 SYR_modernairbases: "Современные военно-воздушные базы"
 SYR_modernairbases_desc: "Совершенствование наших военных аэропортов так же поможет нам в развитии наших ВВС."
 SYR_acquireww2equipment: "Закупка снаряжения времён ВМВ"
 SYR_acquireww2equipment_desc: "Мы можем вооружить нашу армию снаряжением времен Второй мировой. И даже танками."
 SYR_fortifythegolan: "Укрепление Голанских высот"
 SYR_fortifythegolan_desc: "У нас есть возвышенность на границе. Что может быть лучше? Укрепления на возвышенности."
 SYR_latakiadockyards: "Инвестировать в верфи"
 SYR_latakiadockyards_desc: "Нам необходимы наши верфи в полностью исправном состоянии."
 SYR_coastaldefence: "Береговая оборона"
 SYR_coastaldefence_desc: "Мы не должны терять бдительности не только на Голанах, но и на побережье."
 SYR_airdoctrineevaluation: "Оценка воздушной доктрины"
 SYR_airdoctrineevaluation_desc: "Наши ВВС необходимо обучить правильной военной доктрине."
 SYR_landdoctrineevaluation: "Оценка наземной доктрины"
 SYR_landdoctrineevaluation_desc: "Наши войска необходимо обучить правильной военной доктрине."
 SYR_navaldoctrineevaluation: "Оценка военно-морской доктрины"
 SYR_navaldoctrineevaluation_desc: "Наш флот необходимо обучить правильной военной доктрине."
 SYR_acquiremodernequipment: "Приобрести современное оборудование"
 SYR_acquiremodernequipment_desc: "Советский Союз и страны Восточного блока могут предоставить нам современную военную технику для нашей армии."
 SYR_tartousdockyards: "Увеличение верфей"
 SYR_tartousdockyards_desc: "Мы не можем позволить верфям Тартуса ржаветь."
 SYR_lessonsfromthenakba: "Уроки из Накбы"
 SYR_lessonsfromthenakba_desc: "Мы отправлялись в Палестину воевать с сионистами, а вернулись униженными. Мы должны учиться на своих ошибках, чтобы не допустить этого снова."
 SYR_syriantourism: "Сирийский туризм"
 SYR_syriantourism_desc: "Сирия имеет богатую историю и не менее богатую природу, которые обязан увидеть весь мир. Мы должны использовать их в полной мере для привлечения прибыли."
 SYR_homsrefinery: "Нефтеперерабатывающий завод в Хомсе"
 SYR_homsrefinery_desc: "Чехословакия согласилась инвестировать в строительство нефтеперерабатывающего завода в Хомсе. Это, безусловно, поможет нам в будущем."
 SYR_husnialzaim: "Хусни Аль-Заим"
 SYR_husnialzaim_desc: "30 марта 1949 года, Аль-Заим захватил власть в результате бескровного государственного переворота против демократически избранного правительства. Переворот - это только начало грядущего хаоса."
 SYR_westernisesyria: "Вестернизация Сирии"
 SYR_westernisesyria_desc: "Сирийским женщинам будет разрешено голосовать и вступать в правительство. Феска - это старинный головной убор последних дней Османской империи. Необходимо отказаться и от вуали, это пережиток прошлого и теперь ей нет места в будущем Сирии."
 SYR_signarmisticewithisrael: "Заключить перемирие с Израилем"
 SYR_signarmisticewithisrael_desc: "Мы подпишем перемирие с Израилем. Мы не будем больше тратить людей за этот бессмысленый клочок Земли."
 SYR_westernalignment: "Равнятся на Западные страны"
 SYR_westernalignment_desc: "Мы поддержим Запад, чтобы не допустить распространения коммунизма."
 SYR_adibshishakli: "Адиб Шишакли"
 SYR_adibshishakli_desc: "Аль-Ханнави сверг Хусни аз-Заима с помощью своих соратников из Сирийской национал-социалистической партии, в том числе Адиба аш-Шишакли. Аль-дза Хаима заслужил пули в голову. Правление Аль-Хиннави тоже не продлилось долго, и у руля встал Адиб аш-Шишакли."
 SYR_purgethemilitary: "Чистки в армии"
 SYR_purgethemilitary_desc: "Армия - это рассадник революционеров, которые могут попытаться совершить еще один переворот. Пришло время взять инициативу в свои руки и ударить по ним прежде, чем они начнут действовать!"
 SYR_exileopponents: "Изгнание революционеров"
 SYR_exileopponents_desc: "Национальная партия, Коммунисты, баасисты и "Братья-мусульмане" не могут оставаться на свободе. Нам необходимо выгнать этих опасных личностей из нашей страны."
 SYR_removeiraqiinfluence: "Ликвидировать иракское влияние"
 SYR_removeiraqiinfluence_desc: "Хашимитские группировки в Ираке планируют присоединить Сирию к своей так называемой "Арабской Федерации"."
 SYR_befriendneutralpowers: "Подружиться с нейтральными странами"
 SYR_befriendneutralpowers_desc: "Сирия не должна слепо доверять ни  Западу, ни Востоку. Мы будем работать на своих условиях,со своими единомышленниками."
 SYR_syrianairforce: "Сирийские военно-воздушные силы"
 SYR_syrianairforce_desc: "С самолетами, оставленными французами, и инструкторами из Германии и Хорватии были созданы сирийские ВВС. Мы должны сохранять превосходство в воздухе в будущих войнах."
 SYR_syriannavy: "Сирийский военно-морской флот"
 SYR_syriannavy_desc: "Мы приобрели 3 корабля у Франции и сформировали сирийский военно-морской флот. Нам нужно будет построить больше кораблей, чтобы сохранить сирийское побережье сирийским."
 SYR_syrianarmy: "Сирийская армия"
 SYR_syrianarmy_desc: "Сирийская армия малочисленна, плохо вооружена и плохо обучена. Это надо срочно менять, и это зависит только от нас."
 SYR_syrianarmedforces: "Сирийские вооруженные силы"
 SYR_syrianarmedforces_desc: "Сирийские вооруженные силы - это наша единственная линия обороны. Мы должны не забывать о наших защитниках."
 SYR_economicassessment: "Экономическая оценка"
 SYR_economicassessment_desc: "Пришло время оценить состояние нашей экономики. Это глупо оставлять слаборазвитую страну на произвол своим же детям, не так ли?"
 SYR_turntoeasternsupport: "Обратиться к Востоку за помощью"
 SYR_turntoeasternsupport_desc: "Восточный блок во главе с Советским Союзом симпатизирует нашей стране. Это делает создаёт дружбу более выгадной, но это может сильно подбодрить некоторых коммунистов к действию."
 SYR_confronttheleftistinfluence: "Противостоять влиянию левых"
 SYR_confronttheleftistinfluence_desc: "Мы не можем бросить социалистов в нашей стране просто на произвол судьбы. И по этому мы должны срочно ограничить их власть в стране."
 SYR_cuttieswiththeeasternbloc: "Разорвать все наши связи с Восточным блоком"
 SYR_cuttieswiththeeasternbloc_desc: "Мы больше не можем поддерживать дружественные отношения с Восточным блоком. Они, к сожалению, связывают наши руки."
 SYR_postwaragriculturalboom: "Послевоенный сельскохозяйственный бум"
 SYR_postwaragriculturalboom_desc: "По мере того как Европа восстанавливается после войны, спрос на сельскохозяйственные товары растёт. Мы должны придумать, как увеличить наш урожай, чтобы удовлетворить выросший спрос."
 SYR_suezcrisis: "Суэцкий кризис"
 SYR_suezcrisis_desc: "Трехсторонняя агрессия Великобритании, Франции и Израиля против Египта заставляет нас с тревогой наблюдать за происходящим со стороны. Что же нам теперь делать?"
 SYR_interceptspyplanes: "Перехват шпионских самолетов"
 SYR_interceptspyplanes_desc: "Поступают сообщения о британских самолетах с Кипра, которые шпионят за нами. Мы обнаружим их разведчиков с помощью наземных наблюдателей, которые смогут вовремя предупредить наши авиабазы, чтобы подготовить план-перехват."
 SYR_acquiremodernaircraft: "Закупить современные самолеты"
 SYR_acquiremodernaircraft_desc: "Советский Союз и страны Восточного блока могут предоставить нам современные самолеты для наших военно-воздушных сил."
 SYR_restoredemocracy: "Восстановить демократию"
 SYR_restoredemocracy_desc: "Правление Шишакли зашло слишком далеко. Пришло время вернуть Сирию на путь к истинной демократии!"
 SYR_bowtothebaghdadpact: "Преклониться перед Багдадским пактом"
 SYR_bowtothebaghdadpact_desc: "Бессмысленно бросать вызов Багдаду и Амману, мы вынуждены подчиниться их требованиям."
 SYR_growingprivatesectorii: "Наращивание частного сектора"
 SYR_growingprivatesectorii_desc: "Мы можем вновь открыть закрытые заводы, оставленные французами, и даже можем пригласить иностранцев обратно, чтобы они снова начали инвестировать в нашу экономику."
 SYR_thenakba: "Накба"
 SYR_thenakba_desc: "Накба - это самая большая трагедия для арабского мира. К лету 1948 года в Сирии находилось около 70 000 палестинских беженцев. Мы поможем им, как настоящие арабские братья."
 SYR_settlethepalestinianrefugees: "Урегулирование ситуации с палестинскими беженцами"
 SYR_settlethepalestinianrefugees_desc: "У нас есть много здоровых палестинских беженцев в Сирии. Мы дадим им возможность жить здесь, пока не сможем вернуть их землю."
 SYR_sendvolunteers: "Отправить добровольцев"
 SYR_sendvolunteers_desc: "Мы не можем позволить Британии, Франции и Израилю добиться своего в Суэце... но мы не можем вмешаться в этот конфликт. Мы направим добровольцев в Египет и будем надеяться, что они смогут хоть чем то помочь."
 SYR_reactingtotheworld: "Реакция на изменчивый мир"
 SYR_reactingtotheworld_desc: "Мир вокруг быстро меняется. Но как мы будем на него реагировать?"
 SYR_pressureunionwithlebanon: "Союз или вражда с Ливаном"
 SYR_pressureunionwithlebanon_desc: "Французы отняли у нас Ливан и создали ложную "ливанскую идентичность". Пришло время напомнить им, что все они сирийцы."
 SYR_unitethehashemitekingdoms: "Объединиться в Хашимитское Королевство"
 SYR_unitethehashemitekingdoms_desc: "Пришло время нам объединиться в единое королевство!"
 SYR_prowesterndiplomacy: "Прозападная дипломатия"
 SYR_prowesterndiplomacy_desc: "Переход на дружественную Западу политику, сможет в будущем восстановить наши прежние отношения с Западом."
 SYR_hashemitemonarchy: "Хашимитская Монархия"
 SYR_hashemitemonarchy_desc: "Бывший Иракский регент принц Абд аль-ила был выбран в качестве потенциального короля Сирии."
 SYR_jointhebaghdadpact: "Присоединиться к Багдадскому пакту"
 SYR_jointhebaghdadpact_desc: "Поддержка Багдадского пакта позволит нам сплотится среди союзников с Запада против коммунизма."
 SYR_secondshishaklidictatorship: "Возвращение Шишакли"
 SYR_secondshishaklidictatorship_desc: "Возвращение Шишакли позволит ему взять контроль над страной и направить её в русло своих огромных амбиций."
 SYR_consolidateiraq: "Объединение с Ираком"
 SYR_consolidateiraq_desc: "Режим в Ираке слишком занят внутренними проблемами в государстве. К нашему счастью, они не заметили нашего вторжения"
 SYR_declareanendtothezionistpest: "Заявить о конеце сионистскому вредительству"
 SYR_declareanendtothezionistpest_desc: "Унижение 1948 года не забыто. На этот раз мы точно победим."
 SYR_demandkuwait: "Попросить Кувейт"
 SYR_demandkuwait_desc: "Единственным препятствием для аннексии Кувейта является Британия. Мы попросим разрешение на аннексию их протектората."
 SYR_endthehashemitesinjordan: "Покончить с Хашимитами в Иордании"
 SYR_endthehashemitesinjordan_desc: "Хашимитская монархия в Иордании слаба, и им приходится оставлять свою землю разлагаться в своих устаревших традициях. Мы присоединим эту землю как часть новой сирийской земли."
 SYR_declarepanarabistambitions: "Заявить об амбициях Великой Сирии"
 SYR_declarepanarabistambitions_desc: "Когда Шишакли вернется на своё законое место, мы сможем беспрепятственно работать над нашими будущими амбициями."
 SYR_proclaimgreatersyria: "Провозгласить Великую Сирию"
 SYR_proclaimgreatersyria_desc: "После завоевания наших соседей, мы сможем создать Великую Сирию!"
 SYR_centralisethekingdoms: "Централизовать Королевство"
 SYR_centralisethekingdoms_desc: "Теперь, когда Королевство объединилось, мы смогли централизовать руководство в Дамаске."
 SYR_declarepalestinesyrian: "Заявить об претензии на Палестину"
 SYR_declarepalestinesyrian_desc: "Палестина была потерена в течение многих поколений, будучи отданной Британией Сионистам. Мы не можем претендовать на то, чтобы иметь статус сирийского Королевства без Аль-Кудса в целом."
 SYR_requesttransferofkuwait: "Просьба о передаче Кувейта"
 SYR_requesttransferofkuwait_desc: "Пускай Кувейт и является британским протекторатом, мы все еще можем просить об его аннексии мирным путем."
 SYR_purgenationalistsinthearmy: "Националистическая чистка в армии"
 SYR_purgenationalistsinthearmy_desc: "Диссидентские элементы в нашей армии были всегда. Необходимо срочно провести чистку, чтобы истребить врагов государства."
 SYR_maintainfriendshipwithbaghdadpact: "Поддерживать дружбу с Багдадским пактом"
 SYR_maintainfriendshipwithbaghdadpact_desc: "Хотя Ирак и был аннексирован, мы всё ещё должны сохранить хорошие отношения с Багдадским пактом."
 SYR_ultimatumtolebanon: "Ультиматум Ливану"
 SYR_ultimatumtolebanon_desc: "Мы будем требовать их присоединения Ливана к нашему будущему королевству. Нельзя их так оставлять!"
