l_russian:
 ENG_The_British_Armed_Forces: "Вооруженные силы Великобритании"
 ENG_The_British_Armed_Forces_desc: "Ушибленные, но не сломленные, британские вооруженные силы вышли из огня Второй мировой войны проверенной боевой силой. Тем не менее, всегда есть возможности для совершенствования..."
 ENG_The_British_Army: "Британская армия"
 ENG_The_British_Army_desc: "Разгромленная при Дюнкерке британская армия была перевооружена и пережила войну. Но чтобы выжить в новую эпоху войны, потребуется новое оборудование и тактика."
 ENG_FV_214_Conqueror: "FV-214 Conqueror"
 ENG_FV_214_Conqueror_desc: "Если Британия хочет встать лицом к лицу с мировыми сверхдержавами, ей нужно оружие, соответствующее их вооружению. "Conqueror" является таким оружием. Более тяжеловооруженный, чем "Centurion", "Conqueror" способен сражаться со страшным советским ИС-3 и защищать интересы Великобритании."
 ENG_Expand_Centurion_Production: "Расширить производство Centurion"
 ENG_Expand_Centurion_Production_desc: "Хотя Centurion и не прошел испытания Второй мировой войны, он имеет потенциал, чтобы стать основой британской армии. Для этого необходимо увеличить производство, чтобы удовлетворить спрос."
 ENG_Adopt_the_L1A1: "Принятие на вооружение L1A1"
 ENG_Adopt_the_L1A1_desc: "Оружие бельгийского происхождения, получившее название L1A1, претерпело изменения, необходимые для того, чтобы сделать его пригодным для роли имперского "миротворца", и вскоре должно быть готово к поступлению на вооружение."
 ENG_Develop_Counter_Insurgency_Tactics: "Разработать тактику борьбы с повстанцами"
 ENG_Develop_Counter_Insurgency_Tactics_desc: "Новые враги Британии не будут сражаться на открытой местности с фронтами и четкими правилами ведения боя, поэтому мы должны адаптироваться и найти решение."
 ENG_The_Royal_Navy: "Королевский флот"
 ENG_The_Royal_Navy_desc: "Королевский флот оказался жизненно важным компонентом обороны Великобритании во время двух последних великих войн и, несомненно, окажется жизненно важным в следующей. Новые и лучшие корабли должны быть направлены против врагов Британии."
 ENG_The_Daring_class_Destroyers: "Разрушители класса "Daring""
 ENG_The_Daring_class_Destroyers_desc: "Новый эсминец класса Daring поможет заполнить пробелы в новой военно-морской стратегии Великобритании. Более крупный, чем большинство эсминцев, "Daring " может заполнить некоторые роли, которые раньше выполняли крейсеры, однако некоторые опасаются, что отсутствие у него вооружения помимо пушек может вызвать проблемы в будущем.."
 ENG_Complete_the_Audacious_Class_Carriers: "Завершить строительство авианосцев класса Audacious"
 ENG_Complete_the_Audacious_Class_Carriers_desc: "Заложенные во время Второй мировой войны, авианосцы класса Audacious вскоре должны быть готовы нести службу и вести Королевский флот в новую эру военно-морской войны.."
 ENG_Invest_in_Nuclear_Reactor_Research: "Инвестиции в исследования ядерных реакторов"
 ENG_Invest_in_Nuclear_Reactor_Research_desc: "Сила атома уже доказана, теперь вопрос в том, можно ли использовать его силу менее разрушительно."
 ENG_Develop_the_Tiger_Class_Cruisers: "Разработка крейсеров класса "Tiger""
 ENG_Develop_the_Tiger_Class_Cruisers_desc: "Заказанный в 1941 году, крейсер "Tiger" вызывает сомнения в том, есть ли ему место в современном флоте. Однако с некоторыми модификациями эти сомнения могут быть развеяны, и "Tigers", наконец, будут готовы к использованию."
 ENG_The_Nuclear_Program: "Ядерная программа"
 ENG_The_Nuclear_Program_desc: "Чтобы Британия выжила, она должна иметь самое лучшее и самое разрушительное оружие, доступное ей, и атомная бомба, безусловно, является таким оружием. Лучшие научные умы Британии начнут работу над созданием собственной бомбы и поиском других применений ядерной технологии."
 ENG_Vickers_Valiant: "Vickers Valiant"
 ENG_Vickers_Valiant_desc: "Если Великобритания хочет получить ядерное оружие, она должна быть способна нести и сбрасывать это оружие. Valiant станет средством уничтожения для Британии и, надеюсь, ему никогда не придется выполнять поставленную задачу."
 ENG_Fission_Nuclear_Tests: "Ядерные испытания делением"
 ENG_Fission_Nuclear_Tests_desc: "Мы должны понять, как янки использовали ядерную энергию для создания бомбы. Испытания должны быть проведены... в отдаленном месте."
 ENG_The_Thermonuclear_Weapon_Program: "Программа создания термоядерного оружия"
 ENG_The_Thermonuclear_Weapon_Program_desc: "Наши первые испытания прошли успешно, но мы уперлись в стену и нуждаемся в помощи, чтобы создать бомбу, равную по мощности американской и советской. Мы можем обратиться прямо к источнику или объединить все имперские знания вместе и надеяться на прорыв."
 ENG_Seek_American_Cooperation: "Стремиться к американскому сотрудничеству"
 ENG_Seek_American_Cooperation_desc: "Американцы - наши надежные союзники, и у них нет причин отказывать нам в доступе к их ядерным данным."
 ENG_Commonwealth_Collaboration: "Сотрудничество в рамках Содружества"
 ENG_Commonwealth_ColLaboration_desc: "Страны Содружества являются нашими верными партнерами, и у них нет причин не работать с нами над нашим ядерным проектом."
 ENG_The_Gloster_Javelin: "The Gloster Javelin"
 ENG_The_Gloster_Javelin_desc: "Угрозу, исходящую от реактивных бомбардировщиков, невозможно переоценить, особенно когда память о блице еще свежа для многих британцев. Javelin защитит Великобританию и ее интересы от этой угрозы."
 ENG_Produce_the_DH_112_Venom: "Производство DH-112 Venom"
 ENG_Produce_the_DH_112_Venom_desc: "Поскольку реактивные самолеты быстро совершенствуются по всему миру, Британия должна идти в ногу со временем. DH 112 Venom будет хорошо служить нам и позволит усовершенствовать наши старые реактивные самолеты."
 ENG_The_Hawker_Hunter: "Охотник за ястребами"
 ENG_The_Hawker_Hunter_desc: "После побития мирового рекорда скорости стало ясно, что Hawker Hunter является лидером для нового поколения RAF."
 ENG_The_Avro_Vulcan: "The Avro Vulcan"
 ENG_The_Avro_Vulcan_desc: "Vulcan - высокотехнологичный стратегический бомбардировщик, который обеспечит Великобритании ядерное сдерживание, необходимое в наше время."
 ENG_The_Royal_Airforce: "Королевские военно-воздушные силы"
 ENG_The_Royal_Airforce_desc: "Королевские ВВС выиграли битву за Британию и защищали наших солдат за рубежом, но они должны развиваться в соответствии с современными требованиями."
 ENG_Operation_Grapple: "Операция Grapple"
 ENG_Operation_Grapple_desc: "Мы сделали это. Мы думаем. Новый раунд испытаний покажет работу нашего ученого и поможет поднять падающее международное положение Великобритании."
  
  ### COLD WAR PREPARATION/ESPIONAGE ### 
  
 ENG_ColdWar: "Холодная война"
 ENG_ColdWar_desc: ""От Штеттина на Балтике до Триеста на Адриатике, железный занавес опустился на весь континент". Мы должны прислушаться к предупреждению Черчилля: коммунистическая угроза не приближается, она уже настигла нас! Британцы должны быть всегда бдительны."
 ENG_HighMilitarism: "Высокий уровень милитаризма"
 ENG_HighMilitarism_desc: "Мы должны милитаризировать нашу страну, невзирая на угрозу военно-промышленного комплекса. Мы должны милитаризироваться быстрее, чем когда-либо, против угрозы, которая больше, чем когда-либо. Британия будет военной державой."
 ENG_LowMilitarism: "Низкий уровень милитаризма"
 ENG_LowMilitarism_desc: "Только концентрация на оборонительной подготовке позволит избежать военно-промышленного комплекса."
 ENG_CloakDagger: "Плащ и кинжал"
 ENG_CloakDagger_desc: "Тактика "плаща и кинжала" может дать нам значительное преимущество над Советами. Мы должны использовать все тактики, которые у нас есть в этой холодной войне."
 ENG_Militarise: "Усиление милитаризма"
 ENG_Militarise_desc: "Милитаризм должен быть усилен. Мы с силой вовлечем всю Британию в холодную войну."
 ENG_Mobalise: "Мобилизация экономики"
 ENG_Mobalise_desc: "Грядет следующая крупная война."
 ENG_MI6: "MI6"
 ENG_MI6_desc: "Программа MI6 должна быть расширена."
 ENG_MI5: "MI5"
 ENG_MI5_desc: "Расширение MI-5 может принести большую пользу британской родине. Защита - лучшее нападение."
 ENG_StrikeFirst: "Нанести первый удар"
 ENG_StrikeFirst_desc: "Мы должны стать очагом третьей мировой войны, чтобы наши союзники были готовы и мы могли нанести удар на наших условиях.."
 ENG_DefensivePrep: "Подготовка к обороне"
 ENG_DefensivePrep_desc: "Мы должны подготовить нашу оборону. Естественная морская стена Великобритании должна быть подготовлена."
 ENG_Spy1: "Шпион на занавесе"
 ENG_Spy1_desc: "Мы должны послать шпионов и начать разведку за "Занавесом", ведь именно туда прибывают самые важные советские команды.."
 ENG_Cubs: "Защита от кубов"
 ENG_Cubs_desc: "Россия представляет собой угрозу, как и ее марионетки. Мы должны противостоять этому."
 ENG_Unthinkable: "Операция Немыслимое"
 ENG_Unthinkable_desc: "Уинстон Черчилль и его союзники разработали ряд планов; Операция: Немыслимое, чтобы рассмотреть возможность войны с Варшавским договором и Советским Союзом. Мы должны ввести их в действие и немедленно начать войну."
 ENG_LetThemCome: "Пусть приходят!"
 ENG_LetThemCome_desc: "Пусть наши враги придут к нашим берегам и обрушатся, как волны, на скалу, которой мы являемся! Пусть они разобьются!"
 ENG_Spy2: "Усовершенствованные методы шпионажа"
 ENG_Spy2_desc: "Мы вступили в новый век войны. Век шпионажа и ухищрений. Для того чтобы достойно участвовать в этой борьбе, мы должны быть в курсе новейших технологий дешифровки, чтобы должным образом защититься от советских шпионов."
 ENG_Defend: "Защита от мамы-медведицы"
 ENG_Defend_desc: "Когда детеныши убраны с дороги, мы должны защищаться от мамы-медведицы, Советского Союза."
  
  ### SUEZ CRISIS ### 
  
 ENG_Suez_Crisis: "Суэцкий кризис"
 ENG_Suez_Crisis_desc: "Насер слишком долго противостоял империи. Пытаясь национализировать Суэц, он зашел слишком далеко. При поддержке наших израильских союзников мы покажем этому начинающему националисту, что не стоит связываться со Львом!"
  
  ### SUEZ CRISIS - ENGLAND LOSES ### 
  
 ENG_Withdrawal_from_Suez: "Вывод войск из Суэца"
 ENG_Withdrawal_from_Suez_desc: "Насер устоял на ногах. Американцы угрожают нам экономическим разорением, если мы не выведем войска. У нас нет другого выбора, кроме как отдать Суэц египтянам."
 ENG_Humiliation: "Международное унижение"
 ENG_Humiliation_desc: "После поражения на канале наша репутация была разрушена. Дети дюжины разных народов используют нас в качестве предмета своих шуток, а иностранные высокопоставленные лица смеются и ехидничают за закрытыми дверями. Темный день для Британии."
 ENG_Empires_End: "Конец империи"
 ENG_Empires_End_desc: "Наконец-то пришло наше время. Когда-то наши флоты правили морями. Наша промышленность превосходила все остальные. Никто другой даже не осмелился бы испытать мощь наших армий. Вечно по милости Божьей солнце никогда не заходило над Империей. Но эти дни прошли. Наша нация опозорена, наши колонии потеряны. Поднимите полумачтовый флаг и скажите Империи "прощай"."
  
  ### SUEZ CRISIS - ENGLAND WINS ### 
  
 ENG_Victory_in_Suez: "Победа в Суэце"
 ENG_Victory_in_Suez_desc: "Война выиграна! С помощью израильтян и французов мы вытеснили Насера из Суэца. Солнце никогда не зайдет!"
 ENG_Push_for_Regime_Change: "Подталкивание к смене режима"
 ENG_Push_for_Regime_Change_desc: "После нашей победы на канале правительство Насера быстро пошло на попятную. Теперь у нас есть возможность взять под контроль египетскую политику и, наконец, начать возвращать себе утраченные имперские владения."
 ENG_Settle_for_Suez: "Согласие на оккупационную зону в Суэце"
 ENG_Settle_for_Suez_desc: "После победы на канале наши граждане требуют, чтобы мы продвигались дальше и отстранили Насера от власти. Однако, поскольку американцы угрожают нам эмбарго и санкциями, мы решили приостановить наше продвижение к каналу."
 ENG_Strengthen_Ties_to_Israel: "Укрепление связей с Израилем"
 ENG_Strengthen_Ties_to_Israel_desc: "На нашу победу над Насером в немалой степени повлияла поддержка, которую мы получили от израильских военных. Учитывая это, многие представители высшего командования наших вооруженных сил высказали предположение, что сотрудничество с израильским правительством может быть выгодным в дальнейших операциях на Ближнем Востоке."
 ENG_Resist_Decolonization: "Сопротивление деколонизации"
 ENG_Resist_Decolonization_desc: "Возможно, в недавнем прошлом наша Британия пережила тяжелые времена, но не более! Вечно милостив Господь, солнце никогда не зайдет над Британской империей!"
  
  ### SUEZ CRISIS - IMPERIALISM ### 
  
 ENG_Patriot: "Возрожденный патриотизм"
 ENG_Patriot_desc: "Победа над Гитлером породила обновленный британский патриотизм! Сила нашей империи, чтобы противостоять этому злу, возможно, Британия готова к новой империи."
 ENG_Solidify_Ties_with_France: "Укрепление французских отношений"
 ENG_Solidify_Ties_with_France_desc: "У нас, британцев, не всегда были самые дружественные отношения с нашим южным соседом, но мы стояли бок о бок в обеих мировых войнах как неразлучные союзники. Благодаря их помощи в Суэце мы должны развивать наши отношения с французами."
 ENG_Dominion_of_Rhodesia: "Доминион Родезия"
 ENG_Dominion_of_Rhodesia_desc: "Колониальное правительство Южной Родезии уже некоторое время просит Вестминстер о более тесном сотрудничестве с центральным правительством. Учитывая недавнюю заинтересованность нашего народа в укреплении империи, это предложение, от которого мы не можем отказаться."
 ENG_Preserve_Arab_Colonies: "Сохранение арабских колоний"
 ENG_Preserve_Arab_Colonies_desc: "Согласно соглашению Сайкса-Пико 1916 года, Ближний Восток должен был быть разделен между Французской и Британской империями, чтобы принести дальнейшее процветание нашим странам, а также должным образом развить регионы, которыми пренебрегали местные жители. Империя на Востоке не должна быть потеряна."
 ENG_Statute: "Покончить со статутом"
 ENG_Statute_desc: "Чтобы действительно укрепить Империю и привести ее к новой эре процветания, суверенитет наших колоний должен быть ограничен. Им все равно будет лучше под нашим правлением.."
 ENG_Strengthen_Ties_to_South_Africa: "Укрепление связей с Южной Африкой"
 ENG_Strengthen_Ties_to_South_Africa_desc: "Учитывая большой запас ресурсов Южной Африки, нам было бы выгодно поддерживать хорошие отношения с их правительством."
 ENG_Secure_African_Colonies: "Обеспечение безопасности африканских колоний"
 ENG_Secure_African_Colonies_desc: "Африка всегда упорно стремилась к завоеваниям. Беспорядки заполняют улицы, националисты умоляют о большем суверенитете. Пах! Африке лучше жить под направляющей рукой Британии, и мы позаботимся о том, чтобы аборигены знали об этом."
 ENG_Dominions: "Доминионы"
 ENG_Dominions_desc: "Чтобы укрепить империю, мы должны еще больше подчинить себе наши колонии."
 ENG_Commonwealth: "The Commonwealth"
 ENG_Commonwealth_desc: "Благодаря нашим недавним усилиям по централизации империи, пришло время по-настоящему объединить все наши земли под одним флагом - Юнион Джеком!"
 ENG_CanExpan: "Поработить Канаду"
 ENG_CanExpan_desc: "Канада, наш самый важный плацдарм в Северной Америке, - это процветающая страна, до краев наполненная природными ресурсами. Народ, живущий на такой прекрасной земле, несомненно, понимает, что под нашим праведным правлением ему будет только лучше, не так ли?"
 ENG_Ozzie: "Поработить Австралию"
 ENG_Ozzie_desc: "Увеличение наших военных гарнизонов в Австралии, а также дальнейшее регулирование их экономики из Вестминстера должны убедить австралийскую администрацию пересмотреть свой суверенитет."
 ENG_SouthAfrica: "Поработить Южную Африку"
 ENG_SouthAfrica_desc: "Используя расовую напряженность в Южной Африке, мы могли бы сделать так, чтобы централизация в большую Имперскую Федерацию казалась решением проблем Южной Африки."
 ENG_Retake_Ireland: "Вернуть Ирландию"
 ENG_Retake_Ireland_desc: "Ирландия не хочет нашего возвращения. Однако у них нет выбора. Британия марширует дальше."
 ENG_NZL: "Поработить Новую Зеландию"
 ENG_NZL_desc: "Новозеландцы - разумные люди, при правильном подходе мы могли бы просто убедить их присоединиться к нам. Если нет, мы всегда можем просто сжечь Веллингтон."
 ENG_Empress: "Боже, храни императрицу"
 ENG_Empress_desc: "Наконец, после долгих лет медленного упадка нашей империи, мы собрались вместе и объединили наши колонии под Юнион Джеком. Лев рычит вечно!"
 ENG_Britannia: "Правь Британия"
 ENG_Britannia_desc: "Британия, благословенная и свободная, облагодетельствованная Богом, сияющая жемчужина Земли. Ибо, когда Британия поднялась из моря, Ангелы окружили нацию и запели этот гимн: "Правь Британией! Британия правит морями!'" #NT!
 ENG_Raj: "Радж"
 ENG_Raj_desc: "Вестминстер неправомерно склонился к ошибочным требованиям индийцев о независимости. Подобная пародия не может остаться безнаказанной. Мы позаботимся о том, чтобы эти пожиратели карри узнали, что такое имперское правление."
 ENG_Cooperation_with_India: "Сотрудничество с Индией"
 ENG_Cooperation_with_India_desc: "Конечно, было бы славным подвигом снова покорить радж, но это просто неосуществимо. При живой памяти Ганди мы столкнемся с непреодолимым призывом к независимости. Британский народ достаточно пострадал от смерти за границей в нашей недавней истории: мы не будем без нужды жертвовать нашими молодыми людьми. Для обеих наших наций было бы гораздо выгоднее стремиться к взаимному сотрудничеству, открывая доступ к индийским ресурсам без пролития капли крови."
  
  ### GENERAL ELECTIONS - 1950 ### 
  
 ENG_Election_of_1950: "Всеобщие выборы 1950 года"
 ENG_Election_of_1950_desc: "Прошло пять лет с тех пор, как замолчали пушки по всей Европе. Прошло также пять лет с тех пор, как лейбористская партия Клемента Этли одержала шокирующую победу, по крайней мере, в глазах консервативного истеблишмента Великобритании. Станет ли 50-й год повторением 45-го? Теперь решение за народом."
  
 ENG_Labour_Victory: "Победа лейбористов"
 ENG_Labour_Victory_desc: "Неудивительно, что народ Великобритании решил сохранить лейбористскую партию Этли у власти, чтобы продолжить восстановление страны."
 ENG_Enviromental_Regulations: "Экологические нормы"
 ENG_Enviromental_Regulations_desc: "За сотни лет, прошедших с начала промышленной революции в нашей стране, не было проявлено ни малейшей заботы о наших зеленых и приятных землях. Значимые действия давно назрели, и эта ответственность лежит на нас. Что хорошего в Новом Иерусалиме без чистого воздуха?"
 ENG_Sell_Jet_Technology_to_Soviets: "Продать реактивные технологии Советам"
 ENG_Sell_Jet_Technology_to_Soviets_desc: "Наша экономика находится в упадке. Переговоры о простой сделке по продаже оружия вливают деньги в нашу экономику. Пока люди не смотрят на источник, мы будем в порядке."
 ENG_Nationalize_Steel_Industry: "Национализировать сталелитейную промышленность"
 ENG_Nationalize_Steel_Industry_desc: "Сталелитейная промышленность лучше всего находится под национальным контролем, учитывая ее былую роль в загрязнении Британии. Кроме того, мы должны дать понять, что ресурсы Британии не будут эксплуатироваться иностранцами."
  
 ENG_Liberal_Victory: "Победа либералов"
 ENG_Liberal_Victory_desc: "Шокирует тот факт, что Либеральная партия Клемента Дэвиса взяла верх на выборах и теперь может свободно продолжать национализацию промышленности страны."
 ENG_Rural_Infrastructure: "Сельская инфраструктура"
 ENG_Rural_Infrastructure_desc: ""
 ENG_Develop_Wales_and_Scotland: "Развитие Уэльса и Шотландии"
 ENG_Develop_Wales_and_Scotland_desc: ""
 ENG_Seek_closer_ties_to_western_europe: "Стремиться к более тесным связям с Западной Европой"
 ENG_Seek_closer_ties_to_western_europe_desc: ""
  
 ENG_Conservative_Victory: "Победа консерваторов"
 ENG_Conservative_Victory_desc: "Оправившись от поражения в 1945 году, Консервативная партия, которую по-прежнему возглавляет Уинстон Черчилль, прошла в парламент.."
 ENG_Oppose_Further_Nationalization: "Против дальнейшей национализации"
 ENG_Oppose_Further_Nationalization_desc: "Лейбористская партия под руководством Клемента Эттли после победы на выборах 1945 года начала проводить ряд радикальных левых политик, таких как национализация здравоохранения. Они не считали - и не считают - что такая политика побудит людей полагаться на государство, а не обеспечивать себя самостоятельно. Хотя народ никогда не позволит нам вернуть здравоохранение к исключительно частной форме, мы должны сделать все возможное, чтобы противостоять социализму во всех его формах, будь то революционный или его еще более опасный аналог - эволюционный."
 ENG_Political_Stability: "Политическая стабильность"
 ENG_Political_Stability_desc: ""
 ENG_Tax_Cuts: "Сокращение налогов"
 ENG_Tax_Cuts_desc: ""
 tax_cuts: "Сокращение налогов"
  
