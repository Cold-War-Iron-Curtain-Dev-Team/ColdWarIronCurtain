 premium_bonds_tt: "Разблокирует §CПремиальные облигации§!, которые являются ежегодными 100B (ingame), которые все еще существуют по состоянию на 2021 год, и имеют особенность передачи интересов по лотерейной системе."
 London_Greenbelt_tt: "§GМы позаботимся о том, чтобы столица Соединенного Королевства была окружена достаточным количеством деревьев и травы, чтобы сохранить здравомыслие в этом модернизирующемся мире. Это будет естественным образом приносить доход от туризма.§!"
 unlock_atomic_concern_tt: "Разблокирует §CУправление Соединенного Королевства по атомной энергии§!"
 Abandoned_devaluation_tt: "Мы §Rне сможем девальвировать нашу валюту, чтобы улучшить наш платежный баланс§!. Однако, §Gрынки будут заинтересованы в покупке фунта; это означает, что вероятность ухудшения платежного баланса снижается.§!"
 NHS_managed_tt: "Ограничит §Gна уровне 2% дополнительные расходы на "дух НСЗ"§! которые опасно растут. Мы надеемся, что как только люди впервые получат стоматологическую и глазную помощь, расходы сократятся. Это также §Cразблокирует Победу Аневрина Бевана§!."
  
 NHS_Deficit_Determined_TT: "Ограничит на уровне 5% стоимость потребительских товаров НЗС и запретит любые долги, убрав механику долга после его погашения."
 Unlock_Tarmac_TT: "§CРазблокирует улучшенное конструкторское бюро§!"
 NHS_Deficit_1_TT: "Будет увеличивать на 1% расходы на потребительские товары (дефицит) НСЗ каждый месяц, пока не будут приняты меры."
 Unlock_Investment_TT: "§YРаскрывает инвестиционные возможности в графствах с высоким уровнем безработицы в Великобритании.§!"
  
  ###Focus Tree### 
  
 UK50_Representation_People_Act: "Закон о народном представительстве [GetYear]"
 UK50_Representation_People_Act_desc: "Закон о народном представительстве [GetYear] укрепил предыдущее избирательное законодательство, но также внес некоторые изменения в администрацию. Основным изменением было обеспечение проведения будущих пересмотров парламентских границ постоянными парламентскими пограничными комиссиями. Закон также упразднил термины "парламентский район" и "парламентское графство", упразднил университетские избирательные округа и отменил требование о том, чтобы лондонский Сити формировал свой собственный избирательный округ."
 UK50_Reinforce_House_Prominence: "Усилить известность дома"
 UK50_Reinforce_House_Prominence_desc: "Палата общин - самая видная палата парламента, отвечающая за принятие всех законов, налогообложение и снабжение правительства деньгами."
 UK50_Parliament_Act: "Закон о парламенте"
 UK50_Parliament_Act_desc: "Закон о парламенте 1949 года (12, 13 и 14 Geo. 6 c. 103) - это закон парламента Соединенного Королевства. Он сократил полномочия Палаты лордов по задержке некоторых видов законодательства, в частности, государственных законопроектов, кроме денежных, путем внесения поправок в Закон о парламенте 1911 года."
 UK50_Liberalize_Adoption: "Закон об усыновлении детей [GetYear]"
 UK50_Liberalize_Adoption_desc: "Это законодательство либерализовало различные правила, касающиеся усыновления. Передача детей на усыновление перешла под контроль местных властей, а усыновленные дети получили права наследования. Кроме того, в законе было отменено подразумевавшееся в Законе о детях 1926 года представление о том, что мать должна знать личность усыновителя, чтобы дать разумное согласие на усыновление. Вместо этого закон разрешил скрывать личность усыновителя за серийным номером."
 UK50_Create_Free_Legal_Help_System: "Закон о юридической помощи и консультировании [GetYear]"
 UK50_Create_Free_Legal_Help_System_desc: "Этот закон расширил систему социального обеспечения таким образом, что те, кто не в состоянии оплатить услуги адвоката, могли получить бесплатную юридическую помощь."
 UK50_Inaugurate_National_Parks: "Закон о национальных парках и доступе к сельской местности [GetYear]"
 UK50_Inaugurate_National_Parks_desc: "Закон о национальных парках и доступе к сельской местности [GetYear] - это закон парламента Соединенного Королевства, в соответствии с которым была создана Комиссия по национальным паркам. Закон заложил основу для создания национальных парков и зон выдающейся природной красоты в Англии и Уэльсе, а также затронул вопросы общественных прав на проезд и доступ к открытым землям. Закон был принят при поддержке всех партий в рамках восстановления Великобритании лейбористским правительством после Второй мировой войны."
 UK50_Establish_Rent_Control_Courts: "Учредить суды по контролю за арендной платой"
 UK50_Establish_Rent_Control_Courts_desc: "С принятием нескольких законов, ограничивающих рост арендной платы, мы начинаем видеть некоторые результаты."
 UK50_Redraw_Electoral_Districts: "Пересмотр избирательных округов"
 UK50_Redraw_Electoral_Districts_desc: "Закон о Палате общин (перераспределение мест) 1949 года - это закон парламента Соединенного Королевства, который предусматривал периодический пересмотр количества и границ парламентских избирательных округов. Закон внес изменения в правила распределения мест, которым должны были следовать пограничные комиссии для каждой из стран, входящих в состав Соединенного Королевства. Закон содержал ряд правил, которыми должны были руководствоваться комиссии в своей работе."
 UK50_Clean_Air_Act: "Закон об охране чистого воздуха"
 UK50_Clean_Air_Act_desc: "Закон о чистом воздухе - это закон парламента Соединенного Королевства, принятый в основном в ответ на Великий лондонский смог 1952 года. Закон ввел ряд мер по снижению загрязнения воздуха. Главной из них был обязательный переход на бездымное топливо, особенно в районах с высокой задымленностью населения, чтобы уменьшить загрязнение дымом и диоксидом серы от бытовых пожаров. Закон также включал меры по сокращению выбросов газов, песка и пыли из дымоходов и дымовых труб."
 UK50_Housing_Repair_Rents_Act: "Закон о ремонте жилья и арендной плате"
 UK50_Housing_Repair_Rents_Act_desc: "Закон о внесении дополнительных положений о расчистке и перепланировке районов с непригодным жильем, а также об обеспечении или содействии восстановлению и содержанию домов; и другие поправки к законам, касающимся жилья, осуществления определенных полномочий в отношении земли и контроля арендной платы."
 UK50_Halt_Pay_Pauses: "Прекращение выплат"
 UK50_Halt_Pay_Pauses_desc: "Перерывы в оплате труда наших самых ценных работников наносят ущерб их благополучию и производительности. Мы немедленно займемся повышением заработной платы для наших рабочих."
 UK50_Increase_Telephone_Access: "Расширение телефонного доступа по всей Англии"
 UK50_Increase_Telephone_Access_desc: "Многие наши жители до сих пор не имеют доступа к телефонам. Мы должны выделить деньги на строительство новых линий по всей стране."
 UK50_Improve_Ulster_Transportation: "Улучшение транспортной системы Ольстера"
 UK50_Improve_Ulster_Transportation_desc: "Мы должны выделить больше средств Транспортному управлению Ольстера, чтобы улучшить там железнодорожную систему."
 UK50_Encourage_Paid_Holidays: "Стимулирование оплачиваемых отпусков"
 UK50_Encourage_Paid_Holidays_desc: "Оплата труда наших работников и одновременно предоставление им времени для отдыха в свободное от работы время повысит их производительность и обеспечит им дополнительные преимущества на рабочем месте."
 UK50_Double_Taxation_Relief_Order: "Приказ о предоставлении льгот по двойному налогообложению"
 UK50_Double_Taxation_Relief_Order_desc: "Богатые люди получат значительное снижение подоходного налога, благодаря политике двойного налогообложения, которая требовала уплаты налогов в двух разных юрисдикциях."
 UK50_Increase_Tory_Hold: "Усиление позиций Тори в сельских районах Южной Англии"
 UK50_Increase_Tory_Hold_desc: "Поддержка Консервативной партии должна быть обеспечена в сельских районах Южной Англии, где сосредоточена поддержка правоцентристов."
 UK50_Popularize_Holiday_Camps: "Популяризация каникулярных лагерей"
 UK50_Popularize_Holiday_Camps_desc: "Лагеря отдыха в Англии существуют с конца 1930-х годов, где они предоставляют жилье и развлечения для отдыхающих туристов. С появлением досуга в 1950-х годах эти лагеря популяризировались для наших людей во время отпуска."
 UK50_Permissive_Society: "Вседозволенное общество"
 UK50_Permissive_Society_desc: "Вседозволенное общество - это общество, в котором социальные нормы, такие как сексуальная свобода, становятся более либеральными. Такие общества в основном наблюдаются в Европе и Америке 1960-х годов с ростом наркотиков и контркультуры, а также ослаблением викторианских ценностей."
 UK50_Five_Common_Principles: "Пять общих принципов"
 UK50_Five_Common_Principles_desc: "Конституция Соединенного Королевства включает в себя пять основных принципов: суверенитет парламента, союз королевств, свобода личности, система сдержек и противовесов и подчинение суду."
 UK50_Maintain_Strict_Monetary_Policy: "Проведение жесткой денежно-кредитной политики"
 UK50_Maintain_Strict_Monetary_Policy_desc: "Наша монетарная политика должна быть жесткой, даже если из-за этого вырастет уровень инфляции. Мы будем печатать больше денег, чтобы поддерживать нашу растущую экономику."
 UK50_Renewed_Pound_Devaluation: "Возобновление девальвации фунта стерлингов"
 UK50_Renewed_Pound_Devaluation_desc: "Стоимость фунта стерлингов должна быть снижена, с $4,03 до $2,80 в привязке к 1 фунту стерлингов, из-за нехватки наших резервов."
 UK50_Allocate_Funds_Distriution_of_Industry_Act: "Выделить средства на распространение отраслевого закона"
 UK50_Allocate_Funds_Distriution_of_Industry_Act_desc: "Закон о распределении промышленности 1945 года был парламентским актом, призванным помочь в перепланировке районов. В период с 1945 по 1950 год был построен 481 государственный завод и 505 частных заводов, что создало около 200 000 рабочих мест."
 UK50_Increase_State_Housing_Credit_Limit: "Увеличение лимита государственного жилищного кредита"
 UK50_Increase_State_Housing_Credit_Limit_desc: "Будет повышен лимит на то, сколько кредитов наши люди могут использовать при покупке или аренде жилья. Увеличение этого лимита позволит большему числу людей расширить свои кредитные возможности и получить доступное жилье для себя"
 UK50_Ramp_Up_Industrial_Exports: "Наращивание промышленного экспорта"
 UK50_Ramp_Up_Industrial_Exports_desc: "Увеличение нашего экспортного производства для наших союзников и всех потребителей позволит быстро восполнить резерв стерлингов и обеспечить рост нашей экономики, в чем Великобритания отчаянно нуждается в настоящее время."
 UK50_Step_Up_Agricultural_Subsidies: "Увеличить субсидирование сельского хозяйства"
 UK50_Step_Up_Agricultural_Subsidies_desc: "Предоставление сельскохозяйственных субсидий позволит нашим фермерам выращивать больше урожая и продавать больше продовольствия, а также обеспечит их лучшими сельскохозяйственными технологиями, которые мы можем предложить."
 UK50_Restore_Universal_Death_Duties: "Восстановление всеобщих обязанностей в связи со смертью"
 UK50_Restore_Universal_Death_Duties_desc: "Наследственная пошлина и пошлина за наследование были отменены Законом о финансах 1949 года. Теперь мы должны вернуть их обратно."
 UK50_Fund_Tarmac_Group: "Финансировать Tarmac Group"
 UK50_Fund_Tarmac_Group_desc: "Tarmac Group - британская компания по производству строительных материалов, занимающаяся производством материалов для дорожного покрытия, бетона, цемента и извести, а также являющаяся подрядчиком по строительству дорог; их помощь оживит наши дороги и жизненно важную инфраструктуру."
 UK50_Subsidize_Coal_and_Steel: "Субсидирование угольной и сталелитейной промышленности"
 UK50_Subsidize_Coal_and_Steel_desc: "После создания Национального угольного совета в 1946 году для управления нашей угольной промышленностью и принятия Закона о железе и стали в 1949 году правительство Великобритании имеет определенный контроль над угольной и сталелитейной промышленностью, предоставляя им субсидии."
 UK50_Print_New_Export_Currency: "Печать новой валюты экспорта"
 UK50_Print_New_Export_Currency_desc: "Будет напечатана новая экспортная валюта и привязана к нашему фунту стерлингов, в попытке возместить наши низкие резервы и создать профицит."
 UK50_Increase_Minimum_Wage: "Повышение минимальной заработной платы"
 UK50_Increase_Minimum_Wage_desc: "С принятием Закона о советах по заработной плате 1945 года парламент приступает к повышению минимальной заработной платы в различных отраслях промышленности."
 UK50_Cap_NHS: "Ограничение расходов на здравоохранение"
 UK50_Cap_NHS_desc: "Расходы на Национальную службу здравоохранения зашли достаточно далеко! Правительство вынуждено взимать небольшие сборы, такие как один шиллинг за рецепты и один фунт за стоматологическую помощь, чтобы ограничить расходы НСЗ."
 UK50_Open_BOE_Loans: "Открытые кредиты Банка Англии"
 UK50_Open_BOE_Loans_desc: "Мы должны брать кредиты у Банка Англии, чтобы обеспечить рост нашей экономики, даже если это означает рост инфляции."
 UK50_Confirm_Rail_Nationalization: "Подтвердить национализацию железнодорожного и кабельного транспорта"
 UK50_Confirm_Rail_Nationalization_desc: "В соответствии с Законом о транспорте 1947 года все частные железнодорожные компании Великобритании были национализированы в British Railways, а телекоммуникационная сеть Великобритании была национализирована в Cable and Wireless plc."
 UK50_Diminish_Working_Hours_Public_Service: "Сокращение рабочего времени в государственных службах"
 UK50_Diminish_Working_Hours_Public_Service_desc: "Сокращение рабочего времени наших госслужащих и государственных служащих повысит их производительность и будет способствовать национальной стабильности."
 UK50_Raise_High_Income_Inheritance_Tax: "Повысить налог на наследство с высоким доходом"
 UK50_Raise_High_Income_Inheritance_Tax_desc: "Налог, взимаемый при наследовании доходов, должен быть повышен, так как государству нужно больше денег для выживания и роста."
 UK50_Expand_Iron_Steel_Corportaion_Of_GB: "Расширить Iron & Steel Corporation of Great-Britain"
 UK50_Expand_Iron_Steel_Corportaion_Of_GB_desc: "Закон о железе и стали 1949 года начал действовать в 1951 году, и из всей отрасли должна быть создана Корпорация железа и стали Великобритании.."
 UK50_Raise_Investment_in_Public_Works: "Повышение инвестиций в общественные работы"
 UK50_Raise_Investment_in_Public_Works_desc: "Наши инвестиции в проекты общественных работ, такие как автострады, мосты и другие объекты инфраструктуры, должны быть увеличены, чтобы правительство Великобритании могло иметь практически полный контроль над общественными работами."
 UK50_Resorb_NHS_Deficit: "Восполнить дефицит НСЗ"
 UK50_Resork_NHS_Deficit_desc: "Растущий дефицит Национальной службы здравоохранения должен быть снова поглощен правительством, чтобы сохранить мечту о национальном здравоохранении."
 UK50_Aneurin_Bevan_Victory: "Победа Аневрина Бевана"
 UK50_Aneurin_Bevan_Victory_desc: "Бывший министр труда Аневрин Беван завоевал доверие парламента и стал премьер-министром."
 UK50_Empower_Workers_Union: "Расширение возможностей профсоюза работников"
 UK50_Empower_Workers_Union_desc: "Профсоюзы чрезвычайно важны для охраны и безопасности наших британских рабочих, и расширение их деятельности и использование коллективных переговоров обеспечит сохранение прав всех работников."
 UK50_Strengthen_Agricultural_Cooperatives: "Укрепление сельскохозяйственных кооперативов"
 UK50_Strengthen_Agricultural_Cooperatives_desc: "Общественные сельскохозяйственные кооперативы объединят людей для достижения общей цели - производства продуктов питания в духе дружбы, а также сильного чувства гордости за свою преданность сельскохозяйственной отрасли Великобритании."
 UK50_Fully_Nationalize_Steelworks: "Полностью национализировать металлургические заводы"
 UK50_Fully_Nationalize_Steelworks_desc: "Все заводы и предприятия по производству железа и стали в Великобритании будут полностью национализированы и интегрированы в Iron and Steel Corporation of Great Britain, которая получит полный контроль над отраслью."
 UK50_Sponsor_Trade_Union_Congress_Leftist_Candidates: "Спонсировать левых кандидатов от Конгресса профсоюзов"
 UK50_Sponsor_Trade_Union_Congress_Leftist_Candidates_desc: "Если правительство будет спонсировать пропрофсоюзных, левых кандидатов, народ действительно будет знать, что мы стоим на стороне рабочих и сделаем все, что в наших силах, чтобы гарантировать их права и поддержку.."
 UK50_Generalize_Comprehensive_Schools: "Обобщить общеобразовательные школы"
 UK50_Generalize_Comprehensive_Schools_desc: "Первые общеобразовательные школы, разработанные для обеспечения более практичной учебной программы, появились в Англии после Второй мировой войны: пять в Лондоне и две в Ковентри. Эти школы должны быть развиты и обобщены, чтобы обеспечить более профессиональное обучение для нового поколения.."
 UK50_Reshuffle_State_Owned_Business_Boards: "Перетасовка советов директоров государственных предприятий"
 UK50_Reshuffle_State_Owned_Business_Boards_desc: "Советы директоров, контролирующие наши государственные предприятия, такие как Iron and Steel Corporation of Great Britain и Cable and Wireless plc, должны быть организованы и заменены более опытными и политически приемлемыми кандидатами."
 UK50_Turn_Company_Subsidies_Into_State_Shares: "Превратить субсидии компаний в акции государства"
 UK50_Turn_Company_Subsidies_Into_State_Shares_desc: "Инвестиции в наши государственные отрасли равны контролю государства над этими отраслями, поскольку правительство предоставляет субсидии. Наш контроль над национализированными отраслями продолжает расти."
 UK50_Propose_Left_Unity_Manifesto: "Предложить Манифест левого единства"
 UK50_Propose_Left_Unity_Manifesto_desc: "Все левые партии Великобритании, включая лейбористов, социалистов, коммунистов, должны объединиться и выступить единой, широко распространенной силой для народа!"
 UK50_Propose_Electoral_Reform: "Провести масштабную избирательную реформу"
 UK50_Propose_Electoral_Reform_desc: "С принятием законопроекта о народном представительстве, впервые предложенного Лейбористской партией в 1931 году, позволит проводить альтернативное голосование и даст народу шанс сменить правительство."
 UK50_Call_Snap_Elections: "Объявить внеочередные выборы"
 UK50_Call_Snap_Elections_desc: "Внеочередные выборы необходимы самым срочным образом, с нашей новой избирательной реформой и усилиями левого единства, результаты должны быть ясными."
 UK50_Second_Atlee_Ministry: "Второе министерство Атли"
 UK50_Second_Atlee_Ministry_desc: "После внеочередных выборов 1951 года премьер Эттли вновь завоевал доверие своего правительства, начав свое второе министерство в качестве премьера."
 UK50_Propose_Rearmament_Plan: "Предложить план перевооружения"
 UK50_Propose_Rearmament_Plan_desc: "После Второй мировой войны стало ясно, что Великобритания должна оставаться готовой к любым будущим конфликтам, быстро перевооружаясь и поддерживая мощные боевые силы."
 UK50_Double_University_Funds: "Удвоение средств университетов"
 UK50_Double_University_Funds_desc: "Наши университеты получают минимальное финансирование, несмотря на то, что наши солдаты возвращаются с войны и вынуждены искать работу или образование. Необходимо выделять больше средств университетам, чтобы обеспечить возможность дальнейшего образования."
 UK50_Open_New_RSAF_Munition_Plants: "Открытие новых заводов по производству боеприпасов RSAF"
 UK50_Open_New_RSAF_Munition_Plants_desc: "Королевский завод стрелкового оружия - это принадлежащий правительству Великобритании винтовочный завод в лондонском пригороде Энфилд. Он известен производством знаменитых винтовок Lee-Enfield, а также пистолетов Bren и Sten. Необходимо построить больше таких заводов по всей Великобритании, чтобы ускорить производство и развертывание нашего стрелкового оружия."
 UK50_Develop_de_Havilland_Exports: "Развивать экспорт самолетов de Havilland"
 UK50_Develop_de_Havilland_Exports_desc: "Разработка DH.106 Comet компанией de Havilland Aircraft Company Limited должна заинтересовать многих иностранных покупателей и вывести наш авиационный рынок на мировую арену.."
 UK50_Increase_BBC_Budget: "Увеличить бюджет Би-би-си"
 UK50_Increase_BBC_Budget_desc: "Британская вещательная корпорация является национальной вещательной компанией Соединенного Королевства и создана на основании Королевской хартии, что делает ее по сути государственной. Бюджет Би-би-си на радио- и телепрограммы должен пополняться за счет телевизионной лицензии."
 UK50_Expand_Avro_Factories: "Расширение заводов Avro"
 Uk50_Expand_Avro_Factories_desc: "Avro - британская авиастроительная компания, основанная в 1910 году и создавшая самолеты Avro 504 и Avro Lancaster. Базируясь в основном в Ланкашире, заводы Avro должны были быть расширены, чтобы начать производство нового бомбардировщика Avro Vulcan.."
 UK50_Inaugurate_Basildon_Corby_New_Towns: "Торжественное открытие новых городов Базилдон и Корби"
 UK50_Inaugurate_Basildon_Corby_New_Towns_desc: "После принятия Закона о новых городах 1946 года города Базилдон и Корби будут назначены новыми городами на юго-востоке Англии, как пригороды Лондона, и будут организованы через корпорации развития."
 UK50_Aid_Rolls_Royce_Production: "Помощь в производстве Rolls Royce"
 UK50_Aid_Rolls_Royce_Production_desc: "Rolls-Royce Limited - британская многонациональная аэрокосмическая и оборонная компания, которая сегодня разрабатывает, производит и распространяет силовые системы для авиации, включая авиационные двигатели."
 UK50_British_Productivity_Council: "Британский совет по производительности труда"
 UK50_British_Productivity_Council_desc: "Британский совет по производительности был организованным органом, целью которого было повышение эффективности промышленности Великобритании. Созданный в 1951 году, Совет выпустил множество фильмов, направленных на просвещение рабочих о трудовой практике."
 UK50_Establish_Fees_NHS_Dental_Vision_Care: "Установление платы за стоматологическую и зрительную помощь НСЗ"
 UK50_Establish_Fees_NHS_Dental_Vision_Care_desc: "В связи с избыточным финансированием Национальной службы здравоохранения правительство было вынуждено взимать плату за стоматологические услуги и услуги по охране зрения в дополнение к рецептам."
 UK50_Right_Road_For_Britain: "Правильный путь для Британии"
 UK50_Right_Road_For_Britain_desc: "Как сказано в манифесте Консервативной партии 1950 года, \"Правильный путь для Великобритании - это восстановление экономической независимости нашей страны и полной личной свободы и инициативы наших граждан.\""
 UK50_Push_Strong_Building_Industry: "Продвижение сильной строительной отрасли"
 UK50_Push_Strong_Building_Industry_desc: "Британия нуждается в сильной строительной отрасли, чтобы продолжать наши усилия по экономическому росту - мы должны добиваться этого как можно больше."
 UK50_Increase_Bellway_Subsidies: "Увеличение субсидий Bellway"
 UK50_Increase_Bellway_Subsidies_desc: "Bellway - это застройщик жилой недвижимости, расположенный в Ньюкасле-на-Тайне. Предоставив им финансирование, они могут помочь нам построить больше жилья для людей и предприятий."
 UK50_Expand_Taylor_Woodrow_Markets: "Расширение рынков Taylor Woodrow"
 UK50_Expand_Taylor_Woodrow_Markets_desc: "Taylor Woodrow была одной из крупнейших домостроительных и общестроительных компаний в Великобритании. Они выполняли широкий спектр работ, как для частного, так и для государственного сектора, но особенно выделялась их роль в энергетической отрасли Соединенного Королевства; после ряда обычных электростанций компания стала подрядчиком первой в мире коммерческой атомной электростанции. В частном секторе среди заметных контрактов были здания терминалов в лондонском аэропорту Хитроу и Ливерпульский кафедральный собор.."
 UK50_Fullfil_McMillan_Housing_Pledge: "Выполнить обещание Макмиллана по обеспечению жильем"
 UK50_Fullfil_McMillan_Housing_Pledge_desc: "Гарольд Макмиллан, министр жилищного строительства и местного самоуправления консерваторов, взял на себя обязательство, данное премьер-министром, строить 300 000 домов в год."
 UK50_Build_New_Scotland_England_Highways: "Реконструкция автомагистрали A1 Лондон-Эдинбург"
 UK50_Build_New_Scotland_England_Highways_desc: "Мы должны модернизировать А1, чтобы обеспечить более высокие скорости и большую пропускную способность."
 UK50_Raise_Gaelic_Trunk_Roads_Budgets: "Увеличить бюджет на гэльские магистрали"
 UK50_Raise_Gaelic_Trunk_Roads_Budgets_desc: "Улучшая магистральные дороги на гэльском языке, мы сможем связать между собой больше городов и деревень."
 UK50_Begin_Public_Services_Cuts: "Начать сокращение государственных услуг"
 UK50_Begin_Public_Services_Cuts_desc: "Мы должны начать передавать государственные службы и коммунальные услуги частным компаниям, чтобы дать стимул нашей экономике."
 UK50_Progressively_End_Rationning: "Постепенное прекращение нормирования"
 UK50_Progressively_End_Rationning_desc: "После Второй мировой войны прошло уже достаточно времени. Рационирование топлива, мяса, сыра, молока, сахара и всех других продуктов питания должно быть прекращено как можно скорее."
 UK50_UK_Atomic_Energy_Authority: "Управление по атомной энергии Соединенного Королевства"
 UK50_UK_Atomic_Energy_Authority_desc: "Управление по атомной энергии Соединенного Королевства (UKAEA) было создано после принятия Закона об Управлении по атомной энергии 1954 года, который предписывал ему \"производить, использовать и утилизировать атомную энергию.\" UKAEA наиболее известно тем, что работало над программой создания ядерного оружия в Великобритании и проводило последующие ядерные испытания."
 UK50_Create_Independent_Television: "Создание независимого телевидения"
 UK50_Create_Independent_Television_desc: "Independent Television, или ITV, - британская телекомпания, вещающая в свободном эфире, созданная в качестве прямого конкурента государственной компании BBC Television после принятия Закона о телевидении 1954 года."
 UK50_Stimulate_Household_Savings: "Стимулирование сбережений домашних хозяйств"
 UK50_Stimulate_Household_Savings_desc: "Необходимо стимулировать сбережения домашних хозяйств."
 UK50_Privatize_Steel_Industry: "Приватизация сталелитейной промышленности"
 UK50_Privatize_Steel_Industry_desc: "Теперь, когда Консервативная партия вернулась к власти, мы должны предпринять шаги по реинтеграции части государственной Корпорации чугуна и стали Великобритании в частный сектор, чтобы наша экономика могла восстановиться."
 UK50_Raise_BOE_Rates: "Повышение кредитных ставок Банка Англии"
 UK50_Raise_BOE_Rates_desc: "Повышение кредитного рейтинга Банка Англии позволит занимать меньше денег, оставляя меньшее предложение и значительно снижая темпы инфляции."
 UK50_Abandon_Devaluation_Policies: "Отказ от политики девальвации"
 UK50_Abandon_Devaluation_Policies_desc: "Политика девальвации фунта стерлингов была опасной и, возможно, угрожающей нашей экономике. Отказ от этой политики приведет к уменьшению денежной массы и увеличению профицита наших резервов."
 UK50_Create_London_Green_Belt: "Создать лондонский зеленый пояс"
 UK50_Create_London_Green_Belt_desc: "Столичный зеленый пояс - это законодательно установленный зеленый пояс, включающий часть Большого Лондона и шесть прилегающих к нему \"домашних округов\". Этот зеленый пояс предназначен для ограничения роста городов и будет расширен на 35 миль в соответствии с Законом о городском и сельском планировании от 1947 года.."
 UK50_United_For_Peace_And_Progress: "Объединение за мир и прогресс"
 UK50_United_For_Peace_And_Progress_desc: "Великобритания будет едина, чтобы обеспечить мир и прогресс как можно дольше."
 UK50_Milford_Haven_Fawley_Raffineries_Expansion: "Расширение нефтеперерабатывающих заводов Milford Haven и Fawley"
 UK50_Milford_Haven_Fawley_Raffineries_Expansion_desc: "Нефтеперерабатывающий завод Esso в Милфорд-Хейвене - это будущий нефтеперерабатывающий завод, расположенный на побережье Пемброкшира в Уэльсе. Ожидается, что строительство начнется в 1957 году и закончится к 1960 году; НПЗ Fawley - более старый нефтеперерабатывающий завод, основанный в 1921 году и открытый после расширения в 1951 году премьер-министром Эттли."
 UK50_Pupils_Registration_Regulations: "Правила регистрации учащихся"
 UK50_Pupils_Registration_Regulations_desc: "Все британские школьники должны быть зарегистрированы в своих школах, чтобы предотвратить прогулы и обеспечить их обучение."
 UK50_Mines_Quarry_Act: "Закон о шахтах и карьерах"
 UK50_Mines_Quarry_Act_desc: "Закон о шахтах и карьерах 1954 года был принят парламентом \ "для принятия новых положений в отношении управления и контроля над шахтами и карьерами, а также для обеспечения безопасности, здоровья и благополучия людей, работающих на них...\"."
 UK50_Inaugurate_Premium_Bonds: "Ввести в обращение премиальные облигации"
 UK50_Inaugurate_Premium_Bonds_desc: "Премиальные облигации - это лотерейные облигации, выпущенные правительством Великобритании начиная с 1956 года; размещенные в ежемесячном розыгрыше призов, правительство обещает выплатить их с процентами."
 UK50_Subsidize_Unilever_Innovation: "Субсидирование инноваций Unilever"
 UK50_Subsidize_Unilever_Innovation_desc: "Unilever - британская транснациональная компания по производству потребительских товаров, базирующаяся в Лондоне, Англия. Известная своими инновациями, компания Unilever должна получать субсидии за свой вклад в британскую экономику.."
 UK50_Vote_Tax_Cuts_Leyland_BMC: "Голосуйте за снижение налогов для Leyland BMC"
 UK50_Vote_Tax_Cuts_Leyland_BMC_desc: "British Motor Corporation Limited (BMC Limited) - британский производитель автомобилей, образованный в начале 1952 года путем приобретения акций компаний Austin Motor Company и Morris Motors.."
 UK50_Encourage_Marketing_Department_Openings: "Поощряйте открытие отделов маркетинга"
 UK50_Encourage_Marketing_Department_Openings_desc: "Маркетинг и реклама имеют решающее значение для роста нашей экономики; важно, чтобы текущие вакансии в этой области были публичными и заметными."
 UK50_Fund_Pilkington_Glass: "Фонд Pilkington Glass"
 UK50_Fund_Pilkington_Glass_desc: "Pilkington - британский производитель стекла и флоат-стекла, разработавший процесс производства последнего в 1953 году. Финансирование этой компании имеет решающее значение, поскольку она обеспечивает экспорт по всему миру."
 UK50_Open_Dunlop_Facilities: "Открытые объекты Dunlop"
 UK50_Open_Dunlop_Facilities_Desc: "Dunlop Rubber Company Ltd. - британский транснациональный производитель резины и шин, базирующийся в Бирмингеме, Англия, отвечающий за более чем половину рынка шин в Великобритании и имеющий 70 000 сотрудников. Необходимо больше предприятий для того, чтобы захватить рынок шин."
 UK50_Restrict_Bank_of_England_Credit_Allocation: "Ограничение кредитных ассигнований Банка Англии"
 UK50_Restrict_Bank_of_England_Credit_Allocation_desc: "Ограничение полномочий Банка Англии по распределению кредитов среди своих клиентов теоретически должно ограничить рост инфляции и контролировать денежную массу Великобритании."
 UK50_Set_Up_Radcliffe_Commission: "Создание комиссии Рэдклиффа"
 UK50_Set_Up_Radcliffe_Commission_desc: "Доклад Комитета по работе денежной системы - это отчет, опубликованный в 1959 году Комиссией Рэдклиффа под председательством Сирила Рэдклиффа. В нем рассматривается денежно-кредитная политика и содержатся предложения по контролю предложения."
 UK50_Allow_Sterling_Pound_Convertibility: "Разрешить конвертируемость фунта стерлингов"
 UK50_Allow_Sterling_Pound_Convertibility_desc: "Разрешение конвертировать фунт стерлингов в другие валюты, такие как доллар и дойче-марка, позволит еще больше контролировать денежную массу и поддерживать растущий профицит."
 UK50_Metropolitan_Vickers_Train_Engines_Modernization: "Модернизация поездных двигателей "Виккерс Метрополитен""
 UK50_Metropolitan_Vickers_Train_Engines_Modernization_desc: "В рамках плана модернизации Британских железных дорог для обслуживания современных транспортных средств должны быть внедрены железнодорожные двигатели производства Metropolitan Vickers, такие как British Rail Class 77 и Rail Class 28."
 UK50_Develop_Fulmer_Reasearch_Institute_Mineral_Fund: "Развитие минерального фонда Научно-исследовательского института Фулмера"
 UK50_Develop_Fulmer_Reasearch_Institute_Mineral_Fund_desc: "Исследовательский институт Фулмера - это научно-исследовательская организация Великобритании, созданная в 1946 году как исследовательский институт технологии материалов и химии. Отвечает за производство исследовательского алюминия, ракетного топлива и исследование легких сплавов, для помощи в их открытиях необходимо развивать Минеральный фонд."
 UK50_Stimulate_English_Electric_Computer_Research: "Стимулирование английских электрокомпьютерных исследований"
 UK50_Stimulate_English_Electric_Computer_Research_desc: "English Electric - британская компания, специализирующаяся на производстве электрооборудования, двигателей, самолетов и двигателей. Разработка и исследование English Electric DEUCE, первого коммерчески доступного британского компьютера, поможет росту нашей экономики."
 UK50_Imperial_Chemical_Industries_Plant_Development: "Развитие завода Imperial Chemical Industries"
 UK50_Imperial_Chemical_Industries_Plant_Development_desc: "Imperial Chemical Industries - крупная британская химическая компания, занимающаяся производством химикатов, пластмасс и фармацевтических препаратов. Будучи крупнейшей химической компанией в Великобритании, ее заводы и предприятия будут способствовать развитию нашей экономики в масштабах всей страны."
 UK50_Aid_Marconi_Instrument_LTD: "Помощь Marconi Instrument Ltd."
 UK50_Aid_Marconi_Instrument_LTD_desc: "Marconi Instruments Limited - британская компания по производству электроники, образованная в результате слияния в 1936 году; занимается производством осциллографов, вольтметров, электрических компонентов и другого оборудования. Британия должна начать фокусироваться на электронике в качестве основной части нашего промышленного фокуса."
 UK50_Connect_Calder_Hall_Chapelcross_Reactors: "Подключение реакторов Калдер Холл и Чапелкросс"
 UK50_Connect_Calder_Hall_Chapelcross_Reactors_desc: "Колдер-Холл и Чапелкросс - две атомные электростанции Magnox на юго-западе Шотландии, управляемые Управлением по атомной энергии Великобритании и отвечающие за обогащение плутония для программы ядерного оружия Великобритании в дополнение к обеспечению электроэнергией."
 UK50_Restructure_German_Debt: "Реструктуризация долга Германии"
 UK50_Restructure_German_Debt_desc: "Послевоенные репарации союзникам будут изменены в результате реализации Лондонского соглашения о внешних долгах Германии, которое будет охватывать займы по предыдущим планам Дауэса и Маршалла, в результате чего Германия будет выплачивать примерно 765 миллионов марок в год."
 UK50_Increase_MI5_Funds: "Увеличение фондов MI5"
 UK50_Increase_MI5_Funds_desc: "В связи с угрозами, возникшими в результате холодной войны, мы должны увеличить финансирование национальной безопасности."
 UK50_MI6_Expansion: "Расширение MI6"
 UK50_MI6_Expansion_desc: "В связи с угрозами, возникшими в результате холодной войны, мы должны увеличить финансирование нашей внешней безопасности."
 UK50_Sign_Peace_Treaty_Japan: "Подписать мирный договор с Японией"
 UK50_Sign_Peace_Treaty_Japan_desc: "После подписания Японского мирного договора 1951 года мы, наконец, достигли полного мира с Японией."
 UK50_Push_FRG_Admission_Council_Europe: "Продвижение идеи принятия Западной Германии в Совет Европы"
  
 UK50_Sign_Economic_Partnership_ECSC: "Подписание соглашения об экономическом партнерстве с ЕСУиС"
 UK50_Sign_Economic_Partnership_ECSC_desc: "Европейское сообщество угля и стали было организацией шести европейских стран, созданной после Второй мировой войны для регулирования их промышленного производства под централизованным управлением."
 UK50_H_Bomb_Program: "Программа создания H-бомбы"
 UK50_H_Bomb_Program_desc: "Поразительно, уважение, которое приносит ядерное оружие."
 UK50_Participate_Geneva_Conference: "Участие в Женевской конференции"
 UK50_Participate_Geneva_Conference_desc: "Участие в Женевской конференции по Вьетнаму."
 UK50_Help_British_Petroleum_Iran: "Помощь British Petroleum в Иране"
 UK50_Help_British_Petroleum_Iran_desc: "Помочь компании British Petroleum в решении проблем, связанных с иранским правительством."
 UK50_Foudn_Bagdad_Pact: "Заключил Багдадский пакт"
 UK50_Foudn_Bagdad_Pact_desc: "Багдадский пакт - это военный союз Ирана, Ирака, Пакистана, Турции и Великобритании."
 UK50_Blue_Streak_Missile_Program: "Ракетная программа Голубая стрела"
 UK50_Blue_Streak_Missile_Program_desc: "Стало ясно, что если Британия хочет иметь надежную угрозу ядерного сдерживания, баллистическая ракета необходима. Мы не могли закупать американское оружие оптом из-за ограничений Закона об атомной энергии 1946 года.\nНо теперь американцы предложили совместную программу разработки баллистических ракет. Соединенные Штаты должны были разработать межконтинентальную баллистическую ракету, а мы - баллистическую ракету средней дальности. Это предложение было принято как часть соглашения Вильсона-Сандиса.."
 UK50_Ask_American_Help: "Попросить помощи у американцев"
 UK50_Ask_American_Help_desc: "Попросить помощи у американцев"
 UK50_Tackle_Nasser_Regime: "Борьба с режимом Насера"
 UK50_Tackle_Nasser_Regime_desc: "Насер - большая заноза в наших боках, с которой необходимо разобраться."
 UK50_Propose_Signature_EFTA: "Предложить Договор о Европейской ассоциации свободной торговли"
 UK50_Propose_Signature_EFTA_desc: "Европейская ассоциация свободной торговли (ЕАСТ) - это региональная торговая организация и зона свободной торговли. Она была основана для того, чтобы служить альтернативным торговым блоком для тех европейских государств, которые не смогли или не захотели присоединиться к тогдашнему Европейскому экономическому сообществу."
 UK50_Commonwealth_Affairs: "Дела Содружества"
 UK50_Commonwealth_Affairs_desc: "Вопросы, связанные с Содружеством"
 UK50_Change_Imperial_Semantics: "Изменение имперской семантики"
 UK50_Change_Imperial_Semantics_desc: "\"Я думаю, что могу спасти Британскую империю от чего угодно, только не от британцев.\"\n-Винстон Черчилль"
 UK50_Colonial_Welfare_Development_Act: "Закон о развитии колониального благосостояния от [GetYear]"
 UK50_Colonial_Welfare_Development_Act_desc: "Закон о развитии колониального благосостояния от [GetYear] является продолжением закона 1946 года. Средства от этого акта выделяются Колониальному исследовательскому совету по социальным наукам, который консультирует Государственного секретаря по делам колоний по вопросам финансирования исследований в области социологии и антропологии, связанных с колониальным развитием.."
 UK50_Abandon_Groundnut_Scheme: "Отказ от программы по выращиванию арахиса в Танганьике"
 UK50_Abandon_Groundnut_Scheme_desc: "Схема выращивания арахиса в Танганьике, или Восточно-Африканская схема выращивания арахиса, была попыткой культивировать больше арахиса в Танганьике.\nСторонники схемы, в том числе, проигнорировали предупреждения о том, что окружающая среда и осадки не подходят, коммуникации были неадекватными, и весь проект осуществлялся с чрезмерной поспешностью. Несмотря на огромные усилия и затраты в 36 миллионов фунтов стерлингов (что эквивалентно более 1 миллиарду фунтов стерлингов в 2020 году), проект потерпел катастрофический провал.."
 UK50_Colonial_Loans_Act: "Закон о колониальных займах"
 UK50_Colonial_Loans_Act_desc: "Закон о колониальных займах призван предоставить нашим колониям финансирование для улучшения их бедных районов."
 UK50_Approve_Central_African_Federation_Principle: "Утвердить Принцип Центральноафриканской федерации"
 UK50_Approve_Central_African_Federation_Principle_desc: "Благодаря переговорам мы готовы одобрить Центральноафриканскую федерацию."
 UK50_Build_New_Airstrips_Gulf: "Построить новые взлетно-посадочные полосы в Персидском заливе"
 UK50_Build_New_Airstrips_Gulf_desc: "Мы должны расширить наше военное влияние вокруг Персидского залива."
 UK50_Expand_Indian_Ocean_Bases: "Расширение баз в Индийском океане"
 UK50_Expand_Indian_Ocean_Bases_desc: "Мы должны расширить наше военное влияние вокруг Индийского океана."
 UK50_Strengthen_Commonwealth_Trade: "Укрепление торговли Содружества"
 UK50_Strengthen_Commonwealth_Trade_desc: "Укрепление торговли Содружества с помощью новых торговых сделок."
 UK50_Increase_White_Dominion_Political_Ties: "Увеличение политических связей белых доминионов"
 UK50_Increase_White_Dominion_Political_Ties_desc: "\ "Сохраним Англию белой\" - хороший лозунг.\n-Винстон Черчилль, 1955"
 UK50_Stimulate_Sterling_Use: "Стимулирование использования стерлингов"
 UK50_Stimulate_Sterling_Use_desc: "После Второй мировой войны фунт стерлингов утратил свое международное применение, упав намного ниже уровня военного использования, что было вызвано снижением доверия к нему и смещением рынков в сторону Европы."
  
