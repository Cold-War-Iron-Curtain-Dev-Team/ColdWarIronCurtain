 Blue_Streak_Success: "Программа Голубая полоса"
 Blue_Streak_Success_desc: "Blue Streak - это совместный британско-американский проект по разработке баллистической ракеты средней дальности. Однако стоимость этого проекта уже резко возросла. Если мы решим продолжить его! §то нам придется заплатить еще 250 млрд. долларов за все дополнительные расходы, которые понес этот проект. §YОднако, если мы решим остановить проект§!, американцы будут заинтересованы в продаже нам ракеты §G"Поларис", и мы вернем 200 млрд. долларов§! за проект."
  
