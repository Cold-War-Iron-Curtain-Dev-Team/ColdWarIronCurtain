  ### NAVY/AIR FORCE ### 
  
 ENG_SeaAndSky: "Хранители моря и неба"
 ENG_SeaAndSky_desc: "Когда-то наши военно-морские силы славились на весь мир, а наша авиация сражалась бок о бок с американцами, уничтожая немецкие люфтваффе, которые так долго удерживали континент. Однако после окончания войны наше превосходство померкло. Наши военно-морские и военно-воздушные силы теперь превосходят наших американских союзников. Если мы хотим восстановить Британию, мы должны укрепить и эти факторы."
  
  ### AIR FORCE ### 
  
 ENG_ShdwScheme: "Теневая схема"
 ENG_ShdwScheme_desc: "Несмотря на то, что схема "Тень" была предложена до войны и принята во время войны, она все еще показывает большой потенциал для британского воздушного вооружения в мирное время, мы должны принять ее как необходимый законодательный акт для нашего драгоценного RAF."
 ENG_Designs: "Новые проекты"
 ENG_Designs_desc: "Мы должны стремиться к новым самолетам и конструкциям, чтобы они могли управлять небом, как никогда раньше. Бастионы мировой войны могут быть здесь, но мы всегда должны смотреть в будущее."
 ENG_AirDoctrine: "Воздушная доктрина"
 ENG_AirDoctrine_desc: "Воздушная доктрина нашей нации, была недостаточной в последней войне, стратегическое уничтожение было недостаточным для военных усилий, мы должны усовершенствовать наши доктрины."
 ENG_SuthEnglishBase: "Авиабазы Южной Англии"
 ENG_SuthEnglishBase_desc: "Южная Англия всегда была нашей землей для авиабаз, близко к континенту, и равнины на километры, RAF будут рады большему количеству баз."
 ENG_Airforce: "Военно-воздушные силы"
 ENG_ChessSky: "Шахматы в небе"
 ENG_ChessSky_desc: "Мы должны улучшить тактику и начать думать об этом, как о шахматах в небе.."
 ENG_Airforce_desc: "Военно-воздушные силы должны рассматриваться как единое целое; где находятся военно-воздушные силы, они должны быть укреплены, консолидированы."
 ENG_AirSchemeII: "Авиационная схема II"
 ENG_AirSchemeII_desc: "Мы должны создать вторую воздушную схему, на этот раз сфокусированную на роли ВВС в грядущих войнах."
  
  ### NAVY ### 
  
 ENG_ExpndRoyalNavy: "Расширить военно-морской флот"
 ENG_ExpndRoyalNavy_desc: "Мы должны расширить наш старый друг Королевский флот, это первый шаг к тому, чтобы снова править волнами!"
 ENG_Carriers: "Авианосцы"
 ENG_Carriers_desc: "Мы должны сконцентрировать усилия на увеличении количества авианосцев, к которым имеют доступ наши ВМС и ВВС."
 ENG_ASW: "Противолодочная война"
 ENG_ASW_desc: "Учитывая уроки, которые мы получили во время последней Великой войны, инвестирование в наши противолодочные возможности является обязательным."
 ENG_Battleships: "Линкоры"
 ENG_Battleships_desc: "Нам нужно больше линкоров"
 ENG_ShdwDocks: "Теневые верфи"
 ENG_ShdwDocks_desc: "Теневые схемы имели большой успех для ВВС, может быть, ее можно повторить для нашего фантастического флота?."
 ENG_ScotDocks: "Шотландские верфи"
 ENG_ScotDocks_desc: "Мы могли бы легко построить больше верфей в Шотландии."
 ENG_TacticsAdmiralty: "Адмиралтейские тактики"
 ENG_TacticsAdmiralty_desc: "Тактика, применяемая нашим флотом, устарела. Мы должны усовершенствовать их."
  
  ### ARMY ### 
  
 ENG_praiselord: "'Славьте Господа...'"
 ENG_praiselord_desc: ""
 ENG_passammo: "'...и передавайте боеприпасы...'"
 ENG_passammo_desc: ""
 ENG_stayfree: "'И мы все останемся свободными.'"
 ENG_stayfree_desc: ""
 ENG_Frwlharold: "Прощание с Гарольдом Александром"
 ENG_Frwlharold_desc: "Мы должны весело попрощаться с сэром Гарольдом Александром, поскольку он покидает военную службу и отправляется в Канаду, чтобы стать генерал-губернатором этой страны."
 ENG_Frwlvetrans: "Прощание с нашими ветеранами"
 ENG_Frwlvetrans_desc: "Мы должны позволить старой гвардии покинуть наши службы и вернуться к своей жизни."
 ENG_NewGuard: "Собрать новую гвардию"
 ENG_NewGuard_desc: "Когда старая гвардия уйдет, мы сможем собрать новую гвардию для всей Британии, чтобы найти новые тактики и поддерживать наши силы в актуальном состоянии."
 ENG_NewDoctrines: "Новые доктрины"
 ENG_NewDoctrines_desc: "Мы должны следовать новым доктринам в военной области, а не старым."
 ENG_ConsultAdvisors: "Советоваться с генералами"
 ENG_ConsultAdvisors_desc: "В погоне за новыми доктринами мы должны советоваться с нашими ветеранами, они больше всех знают о будущих доктринах."
 ENG_MdrnDivisions: "Современные дивизии"
 ENG_MdrnDivisions_desc: "Мы должны сделать современные дивизии для нашей армии."
 ENG_OldDoctrines: "Старые доктрины"
 ENG_OldDoctrines_desc: "Большой боевой план сослужил нашей нации огромную службу в мировой войне, сейчас, когда до новой войны еще так много времени, мы можем максимально усилить планирование, старые доктрины будут править бал!"
 ENG_Grand-erBttlepln: "Большой боевой план"
 ENG_Grand-erBttlepln_desc: "Мы должны сделать наши планы сражений более великими, грандиозными и масштабными, чем когда-либо прежде, мы должны создать величайшие планы, известные человеку, право нашей страны - планировать следующую войну!"
 ENG_NewDivisions: "Новые подразделения"
 ENG_NewDivisions_desc: "Старые дивизии нашей армии просто списаны с войны, мы должны смотреть вперед и повышать профессионализм наших войск, чтобы они соответствовали армиям Европы.."
  
  ### LEFTOVER LOC THAT MIGHT BE USEFUL LATER SO I'M NOT DELETING IT ### 
  
 ENG_Royalarmy: "Королевская армия"
 ENG_Royalarmy_desc: "Королевская армия Великобритании в настоящее время является самой многочисленной из когда-либо существовавших. Она пережила пламя Второй Великой войны. Несмотря на свой опыт, многим из этих людей по-прежнему не хватает подготовки и компетентных командиров. Чтобы оставаться конкурентоспособными, мы должны возродить армию."
 ENG_Warhawks: "Удалить "Warhawks""
 ENG_Warhawks_desc: "Мы должны убрать "Warhawks" по всей Европе или оказать давление на их правительство, чтобы оно их убрало. Было сделано много близких выстрелов, нам не нужно больше.."
 ENG_Cooling: "Начать охлаждение"
 ENG_Cooling_desc: "После удаления "Warhawks" мы можем начать дипломатические миссии."
 ENG_Soldiers: "Сокращение численности военнослужащих"
 ENG_Soldiers_desc: "Мы должны сократить количество солдат на границах и в Центральной Европе в целом. Мы должны сократить военное присутствие, чтобы еще больше охладить холодную войну!"
 ENG_Detante: "Начать разрядку"
 ENG_Detante_desc: "На Европу давит холод. Разрядка. Мы должны принять это и охладить мир."
 ENG_TakeEasy: "Спокойствие"
 ENG_TakeEasy_desc: "Мир охлаждается, не о чем беспокоиться, давайте расслабимся"
 ENG_Heating: "Начало агрессии"
 ENG_Heating_desc: "Несмотря на то, что холодная война - это холодная война, и мы, конечно, не хотим, чтобы она стала горячей, немного больше действий между державами могли бы оставить несколько замечательных"
 ENG_Incident: "Создать инцидент"
 ENG_Incident_desc: "Отопление, которое мы вызвали, принесло нам пользу, довольно большую... Может, мы могли бы начать инцидент?"
 ENG_Preserve: "Сохранить империю"
 ENG_Preserve_desc: "Нагрузка на нашу империю создает стресс, в то время как многие призывают отказаться от империи, мы должны сохранить ее и наши коронные драгоценности."
 ENG_Troubles: "Зарубежные проблемы"
 ENG_Troubles_desc: "Повсюду за границей, от зоны канала до колоний к югу от Сахары, создаются проблемы. Кризис, это путь Британии."
 ENG_SecureSuez: "Защитить Суэц"
 ENG_SecureSuez_desc: "Нам необходимо обеспечить безопасность нашей зоны Суэцкого канала. Любыми необходимыми средствами, включая Судан."
 ENG_EndEgypt: "Конец Египта"
 ENG_EndEgypt_desc: "Египетское государство было хорошим экспериментом, если можно так сказать. Но Египет угрожает миру, который наступил с их захватом зоны канала, и показал, что они слишком изгои, чтобы их оставили в покое."
 ENG_CntrlAfrica: "Контроль Африки"
 ENG_CntrlAfrica_desc: "Беспорядки в Африке распространяются, мы должны принять меры для их снижения."
 ENG_BNW: "Дивный новый мир"
 ENG_BNW_desc: "Это смелый новый мир. Мы должны принять новые институты, возникшие после падения гитлеровского рейха."
 ENG_UN: "ООН"
 ENG_UN_desc: "Организация Объединенных Наций была основана нашей страной, Канадой, Соединенными Штатами и многими другими. Мы должны способствовать укреплению легитимности этого глубокого института."
 ENG_OverseasCrisis: "Зарубежный кризис"
 ENG_OverseasCrisis_desc: "Кризис за рубежом нарастает, наши колонии охвачены беспорядками, мы должны принять меры, пока это не привело к новой революции."
 ENG_OldCrown: "Старая корона"
 ENG_OldCrown_desc: "В то время как Индия и Пакистан стали независимыми, они, кажется, ненавидят друг друга, мы не должны торопиться и укреплять наши позиции на востоке, Пакистан демонстрирует силу, благодаря индустриализации, которую мы ему дали, однако Индия демонстрирует потенциал рабочей силы."
 ENG_FrndIndia: "Подружиться с Индией"
 ENG_FrndIndia_desc: "Хотя мы никогда не были на лучшей позиции. Индия кажется правильным выбором в этой игре индуизма и ислама."
 ENG_FrndPakistan: "Подружиться с Пакистаном"
 ENG_FrndPakistan_desc: "Пакистан был нашим любимым государством, когда мы правили Раджем, мы должны продолжать это наследие и отдавать предпочтение ему в регионе."
 ENG_Consolidate: "Укрепление отношений"
 ENG_Consolidate_desc: "Мы должны укреплять наши отношения повсюду, этот выбор, который лег на стол наших министров, был трудным, но лучше, чтобы он был сделан сейчас, чем потом."
 ENG_Security: "Совет Безопасности"
 ENG_Security_desc: "Совет Безопасности Организации Объединенных Наций демонстрирует большой потенциал в качестве места силы Великобритании. Мы являемся одним из пяти постоянных членов."
 ENG_RedSun: "Восход красного солнца"
 ENG_RedSun_desc: "Великая депрессия, мировые войны, все так близко, наша империя в руинах. Революция пришла в Британию. Этот путь. может стать нашим последним."
 ENG_Internationalism: "Интернационализм"
 ENG_Internationalism_desc: "У Троцкого была правильная идея. Мы должны быть первой нацией, которая действительно примет интернационализм!"
 ENG_DecoloniseComittee: "Комитет по деколонизации"
 ENG_DecoloniseComittee_desc: "Мы должны принять постановления Комитета по деколонизации и стать его частью. Время Британской империи прошло."
 ENG_OneCountry: "Одна страна"
 ENG_OneCountry_desc: "У Сталина правильная мысль, заботиться о нашей стране, объединяться и править, нашей страной, а не разводить непокорные государства, которые будут выступать против нас."
 ENG_EndRoyalFamily: "Покончить с королевской семьей"
 ENG_EndRoyalFamily_desc: "Королевская семья представляет непосредственную угрозу для нашей революции. Они - бастионы богатых и грязных."
 ENG_CutTies: "Разрезать галстуки"
 ENG_CutTies_desc: "Наши отношения либо завянут сами по себе, либо мы их разорвем. Давайте уберем отношения с неугодными демократиями."
 ENG_OwnAlliance: "Наш собственный альянс"
 ENG_OwnAlliance_desc: "Нам нужен собственный пакт, а не преклонение перед сталинской варшавской мечтой. Да здравствует Ливерпульский пакт!"
 ENG_WarsawPact: "Присоединиться к Варшавскому договору"
 ENG_WarsawPact_desc: "Нам было бы глупо создавать свой собственный союз, мы видим непосредственную угрозу со стороны США и капиталистических европейцев, может быть, Сталин примет нас?"
 ENG_Prepareforinvasion: "Подготовка к вторжению"
 ENG_Prepareforinvasion_desc: "Мы должны подготовить берега Великобритании для Соединенных Штатов, Норвегии, Франции, Дании или даже Нидерландов, мы должны быть готовы к их атакам!"
 ENG_ArmWelsh: "Вооружить валлийцев"
 ENG_ArmWelsh_desc: "Мы должны вооружить валлийцев, если хотим быть готовыми к их вторжению"
 ENG_RAF: "Королевские военно-воздушные силы"
 ENG_RAF_desc: "Королевские ВВС - это мощь в Европе, не только победоносная, но и одна из крупнейших военно-воздушных сил, мы должны сохранить эту позицию, если хотим оставаться влиятельными."
 ENG_DfndFalklands: "Защитить Фолкленды"
 ENG_DfndFalklands_desc: "Мы должны укрепить Фолкленды, потому что в последнее время Хунта говорит очень агрессивно, защита наших оставшихся колоний должна быть приоритетной."
 ENG_BowEgypt: "Поклон Египту"
 ENG_BowEgypt_desc: "Это может быть неудобно, но для сохранения мира мы должны склониться перед египтянами, чтобы показать, что мы - сторонники демократии."
 ENG_EncourageStatute: "Поощрять устав"
 ENG_EncourageStatute_desc: "Первым шагом к прекращению веса нашей империи будет поощрение использования Вестминстерского статута и предвестие конца британского правления над нашими владениями."
 ENG_DemEnternal: "Вечная демократия"
 ENG_DemEnternal_desc: "Демократия пережила толстые и тонкие времена, наша демократия была первой из многих чистых демократий, и Соединенные Штаты показали, что мы в этом вместе."
 ENG_Invest: "Транснациональные инвестиции"
 ENG_Invest_desc: "Мы должны использовать наше вновь обретенное влияние для инвестирования в демократические страны, чтобы не только помочь им выстоять под натиском Советов, но и расширить наши собственные рынки и влияние."
 ENG_Queen: "Боже, храни королеву"
 ENG_Queen_desc: "Королева Елизавета II Александра Мария, королева Соединенного Королевства Великобритании и Северной Ирландии, была хорошо образована о конституции и демократии Великобритании, и должна стоять за наши собственные свободы."
 ENG_ExpndBurmingham: "Расширить Бирмингем"
 ENG_ExpndBurmingham_desc: "Расширить промышленность Бирмингема, чтобы освободить место для заводов по производству оружия и боеприпасов."
 ENG_ArmScot: "Вооружить шотландцев"
 ENG_ArmScot_desc: "Мы должны строить больше боеприпасов в Шотландии, чтобы, если война снова придет на эти прекрасные острова, мы могли вооружить этих сильных бойцов, чтобы они могли противостоять всему."
 ENG_Prolitariat: "Да здравствует пролетариат!"
 ENG_Prolitariat_desc: "После успеха революции пролетариат торжествует, и народ теперь правит островами! Да здравствует революция!"
 ENG_Referendum: "Провести референдум"
 ENG_Referendum_desc: "Даже если на Фолкленды претендуют аргентинцы, проведение референдума, чтобы доказать, что это наша законная земля, может оказаться удачным, а если это не удастся, пусть она присоединится к территориям, которые покинули нашу империю."
 ENG_Decolonise: "Дальнейшая деколонизация"
 ENG_Decolonise_desc: "Мы должны прояснить наши отношения с некоторыми новыми государствами, которые появились в результате наших усилий по деколонизации."
 ENG_deafrica: "Африка"
 ENG_deafrica_desc: "Наши отношения с африканцами, несомненно, будут самыми сложными для выяснения, возможно, нам следует дать министерству иностранных дел немного времени, чтобы привести наши отношения в порядок?"
 ENG_decarib: "Карибы"
 ENG_decarib_desc: "Из Британской Вест-Индии вышло много стран, и хотя они дружелюбны, не мешало бы выяснить все отношения между нами."
 ENG_FalklandsBritish: "Фолкленды принадлежат Британии!"
 ENG_FalklandsBritish_desc: "Фолкленды являются британскими, по крайней мере, так сказали их жители, когда наш референдум увенчался успехом."
 SOV_communist_austria: "Освободить Австрийскую Демократическую Республику"
 ENG_60s_Macmilian_holds_office: "Гарольд Макмиллан занимает должность"
 ENG_60s_Macmilian_holds_office_desc: "Гарольд Макмиллан - наш нынешний лидер."
 ENG_60s_Prime_MinisteR_Harold_Wilson: "Премьер-министр Гарольд Уилсон"
 ENG_60s_Prime_MinisteR_Harold_Wilson_desc: "Гарольд Уилсон - наш премьер-министр."
 ENG_60s_Socialist_republic: "Социалистическая Республика"
 ENG_60s_Socialist_republic_desc: "С новым коммунистическим правительством мы сможем создать социалистическую республику."
 ENG_60s_British_economy: "Британская экономика"
 ENG_60s_British_economy_desc: "Мы должны пересмотреть нашу экономику."
 ENG_60s_Royal_Military: "Королевские военные"
 ENG_60s_Royal_Military_desc: "Британская армия раз за разом доказывает, что она способна справиться с любыми угрозами. Для того чтобы она могла делать это в будущем, мы должны рассмотреть возможность ее модернизации."
 ENG_60s_Foreign_policy: "Внешняя политика"
 ENG_60s_embrace_non_aligned_movement: "Принять Движение неприсоединения"
 ENG_60s_british_isolationism: "Британский изоляционизм"
 ENG_60s_Foreign_policy_desc: "Какую внешнюю политику мы будем проводить?"
 ENG_60s_Consolidate_our_position_in_Europe: "Укрепление наших позиций в Европе"
 ENG_60s_Consolidate_our_position_in_Europe_desc: "Мы не можем изолироваться от наших соседей. Вместо этого мы должны сосредоточить наши усилия на укреплении наших позиций там."
 ENG_60s_Increase_our_presence_in_Vietnam: "Отправить советников во Вьетнам"
 ENG_60s_Increase_our_presence_in_Vietnam_desc: ""
 ENG_60s_The_Entriest_Threat: "Самая серьезная угроза"
 ENG_60s_The_Entriest_Threat_desc: "Великая британская нация находится под троцкистской угрозой. Что мы будем с этим делать?"
 ENG_60s_Heath_Ministry: "Министерство здравоохранения"
 ENG_60s_Heath_Ministry_desc: ""
 ENG_60s_Wind_of_change: "Ветры перемен"
 ENG_60s_Wind_of_change_desc: "Речь "Ветер перемен" - это исторически значимое обращение премьер-министра Великобритании Гарольда Макмиллана к парламенту Южной Африки, которое ясно дало понять, что возглавляемое консерваторами правительство Великобритании не намерено блокировать предоставление независимости многим из этих территорий."
 ENG_60s_Stay_on_path_of_decolonisation: "Продолжить деколонизацию"
 ENG_60s_Stay_on_path_of_decolonisation_desc: "Как мы и обещали, мы продолжим деколонизацию."
 ENG_60s_Nigerian_independence: "Улучшение отношений с Нигерией"
 ENG_60s_Nigerian_independence_desc: ""
 ENG_60s_Condemn_South_Africa: "Осудить Южную Африку"
 ENG_60s_Condemn_South_Africa_desc: "Хотя Южная Африка была нашим собственным ребенком, мы больше не можем мириться с их расистскими взглядами. Пора направить им дипломатическую ноту."
 ENG_60s_Kenyan_independence_referendum: "Референдум о независимости Кении"
 ENG_60s_Kenyan_independence_referendum_desc: "Кении следует разрешить провести референдум о независимости."
 ENG_60s_Condemn_Rhodesia: "Осудить Родезию"
 ENG_60s_Condemn_Rhodesia_desc: "Родезия при Смите - это не то, чего мы хотели."
 ENG_60s_Unemployment_Increase: "Рост безработицы"
 ENG_60s_Unemployment_Increase_desc: ""
 ENG_60s_Embrace_the_Conservative_Monday_Club: "Принять участие в клубе "Консервативный понедельник""
 ENG_60s_Embrace_the_Conservative_Monday_Club_desc: "У Консервативного понедельничного клуба могут быть правильные идеи..."
 ENG_60s_Resist_Nigerian_independence_movements: "Сопротивление независимости Нигерии"
 ENG_60s_Resist_Nigerian_independence_movements_desc: "Хотя мы, несомненно, разрушаемся, мы все еще можем попытаться противостоять независимости этих наций."
 ENG_60s_Internal_policy: "Внутренняя политика"
 ENG_60s_Internal_policy_desc: "Наша внутренняя политика."
 ENG_60s_Limited_Economic_Growth: "Ограниченный экономический рост"
 ENG_60s_Limited_Economic_Growth_desc: ""
 ENG_60s_Conservatives_declining: "Снижение популярности"
 ENG_60s_Conservatives_declining_desc: "Популярность тори падает."
 ENG_60s_Night_of_the_Long_knives: "Ночь длинных ножей"
 ENG_60s_Night_of_the_Long_knives_desc: "Ночь длинных ножей стала крупной перестановкой в кабинете министров. Премьер-министр Гарольд Макмиллан уволил семь членов своего кабинета, треть от общего числа. Скорость и масштаб перестановок вызвали у критиков ассоциации с "Ночью длинных ножей" 1934 года в нацистской Германии."
 ENG_60s_Douglas_Home_takes_over: "Дом лорда Дугласа принимает гостей"
 ENG_60s_Douglas_Home_takes_over_desc: ""
 ENG_60s_Anti_Labour_campaign: "Антилеборийская кампания"
 ENG_60s_Anti_Labour_campaign_desc: "Чтобы помочь нашей популярности, мы должны провести кампанию против лейбористской партии."
 ENG_60s_Instability_on_streets: "Нестабильность на улицах"
 ENG_60s_Instability_on_streets_desc: ""
 ENG_60s_Increased_Housing: "Увеличение жилья"
 ENG_60s_Increased_Housing_desc: ""
 ENG_60s_Lift_Ban_On_Homosexuality: "Отмена запрета на гомосексуализм"
 ENG_60s_Lift_Ban_On_Homosexuality_desc: ""
 ENG_60s_Abolish_Death_Penalty: "Отменить смертную казнь"
 ENG_60s_Abolish_Death_Penalty_desc: ""
 ENG_60s_Open_Universities: "Открытые университеты"
 ENG_60s_Open_Universities_desc: ""
 ENG_60s_The_Growth_of_Militant: "Рост воинствующих организаций"
 ENG_60s_The_Growth_of_Militant_desc: "Существует значительное количество радикальных левых ополчений."
 ENG_60s_Salvation_of_Britain: "Спасение Британии"
 ENG_60s_Salvation_of_Britain_desc: "Если мы не сделаем что-то быстро, коммунисты могут захватить правительство."
 ENG_60s_Sun_will_never_set_on_British_Empire: "Солнце никогда не зайдет над Британской империей"
 ENG_60s_Sun_will_never_set_on_British_Empire_desc: ""
 ENG_60s_Prevent_further_decolonisation: "Предотвращение дальнейшей деколонизации"
 ENG_60s_Prevent_further_decolonisation_desc: ""
