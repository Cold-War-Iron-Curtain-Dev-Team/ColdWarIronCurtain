 morrocan_faction_decisions: "Марокканская Партизанщина"
 morrocan_faction_decisions_desc: ""
 morrocan_faction_decisions_desc_alt: "Текущее европейское население в Марокко: [?MOR.French_Population]\n Текущее еврейское население в Марокко: [?MOR.Jewish_Population]\n§CПротекторат в Марокко:\n Франция установила протекторат над Марокко в 1912 году по Фесскому договору. Французский протекторат привел к новым проектам развития и прогрессу в образовании. Марокканские солдаты сыграли важную роль в обеих мировых войнах в интересах французского государства. Однако французская оккупация также вызвала ряд восстаний и беспорядков. Марокканские националистические партии начали появляться в 1930-х годах, положив начало ненасильственному движению за независимость. Надежды на независимость после Второй мировой войны были развеяны, что привело к росту насилия со стороны националистических активистов. Танжерская речь султана Мухаммеда V призывала к деколонизации и независимости. После этого французские войска устроили несколько массовых убийств в Касабланке. Напряженность в стране высока, так как марокканцы все чаще рассматривают вооруженное сопротивление как единственное средство продвижения вперед. Генерал Альфонс Жуэн должен решить, как сохранить французский контроль, несмотря на растущие националистические волнения, или подготовиться к достойному уходу Франции из региона.\n\n\nИспанское правление в Марокко началось в начале двадцатого века, когда Испания и Франция разделили страну на отдельные сферы влияния. В 1920-х годах Испания ввязалась в войну в Рифе, которую выиграла только после тяжелых потерь. Во время гражданской войны в Испании марокканские солдаты преданно служили испанскому диктатору Франсиско Франко. После победы Франко вознаградил территорию либеральной политикой. Появились марокканские националистические партии, которые стали открыто выступать за независимость. Танжерская речь султана Мухаммеда V призывала к деколонизации и независимости. Хотя косвенно этот призыв был направлен против французов, многие марокканцы на испанской территории также были воодушевлены, что подстегнуло новые националистические волнения. Генерал Рафаэль Гарсия Валино должен решить, как мобилизовать местную поддержку для сохранения испанского контроля перед лицом растущих националистических волнений или подготовиться к достойному испанскому уходу.§!"
 MOR_FACTION_1: "§GБордовый - Комитет Освобождения Арабского Магриба§!"
 MOR_FACTION_2: "§HФиолетовый -Местные Паши§!"
 MOR_FACTION_3: "§BСиний - Французский Протекторат§!"
 MOR_FACTION_4: "§YЖелтый - Испанский Протекторат§!"
 MOR_FACTION_5: "§RКрасный- Фракция Истикляль и Мухаммеда V§!"
 MOR_JEWISH_TT_DESC: "§CМарокканская еврейская община проживала в регионе на протяжении многих поколений. С приходом французского колониализма многие еврейские семьи воспользовались преимуществами европейских учреждений, особенно школ. Султан традиционно поддерживал позитивные связи с еврейской общиной, в частности, помогал ей во время Второй мировой войны. Однако возникновение Израиля и возвращение французского колониального надзора привело к обострению отношений. Арабские националисты все чаще рассматривают Израиль как главную угрозу и считают марокканских евреев потенциальной пятой колонной. Они выступают за то, чтобы правительство более жестко контролировало еврейскую общину. Марокканские антиколониальные активисты считают еврейскую общину тесно связанной с французами и представляющей угрозу независимости Марокко. Для еврейской общины французы все больше воспринимаются как их главные защитники, и многие теперь рассматривают миграцию как единственное средство для своей защиты. Правительство должно решить, как успокоить тревогу марокканских евреев или поддержать ту политику, за которую выступают арабские националисты и сторонники антиколониальной политики.§!"
 MOR_FACTION_1_DESC: "Возглавляемый известным борцом против колониализма и ветераном Рифтовой войны Абд эль-Каримом, Комитет освобождения арабского Магриба основал свой главный офис в Каире. Организация исповедует арабский национализм, выступая за объединение Магриба. Группа популярна среди молодых городских интеллектуалов и сторонников вооруженного сопротивления колониальным державам. Они особенно популярны в районах, контролируемых Испанией или ранее находившихся под ее влиянием. Их сторонники выступают против местных арабов и берберов, которых они считают реакционными или коллаборационистскими, таких как традиционные сельские правители и королевское правительство. Чтобы группировка могла расти, она должна не только бросить вызов колониальным державам, но и убедить народ принять новый панарабистский национализм, охвативший весь арабский мир."
 MOR_FACTION_2_DESC: "Тами Эль-Глауи возглавляет сельских пашей, которые все чаще демонстрируют сопротивление националистическим партиям. На протяжении десятилетий эти паши процветали под французским колониальным правлением. Французы предоставили им автономию и защиту, что позволило пашам укрепить свою власть над сельскими общинами и накопить личное богатство. Мобилизация их сторонников позволит им сохранить свою автономию и предотвратить распространение националистического и королевского влияния на их районы. Однако по мере того, как Франция и Испания рассматривают новые реформы, они рискуют оттолкнуть пашу. В условиях меняющейся ситуации Тами Эль Глауи должен решить, как ему сохранить свою автономию - поддержать одну из других фракций или даже захватить власть, чтобы сохранить власть пашей."
 MOR_FACTION_3_DESC: "Французский протекторат Марокко должен справиться с растущими волнениями среди марокканского населения. Националистический пыл охватывает народ, особенно городских арабов, принадлежащих к рабочему классу. Однако французы могут рассчитывать на поддержку со стороны поселенцев и небольших еврейских общин, проживающих на территории протектората. За предыдущие десятилетия правительство установило прочные связи с некоторыми сельскими общинами посредством призыва в армию. Эти солдаты играли ключевые роли в недавних французских колониальных и военных конфликтах. Можно рассчитывать, что эти люди останутся верны сохранению французского правления. Они хотят сохранить социальные и экономические выгоды от своей лояльности."
 MOR_FACTION_4_DESC: "Испанский протекторат Марокко сталкивается с растущими националистическими волнениями среди населения, особенно среди городских марокканских мусульман. Наряду с некоторыми поселенцами, испанцы могут опираться на меньшинство марокканской еврейской общины. Как и французы, испанцы установили прочные связи с сельскими марокканскими общинами посредством вербовки солдат. Эти солдаты оказались чрезвычайно лояльными и эффективными во время гражданской войны в Испании. Испания может рассчитывать на лояльность этих солдат, которые поддержат продолжение испанского правления, чтобы сохранить свою относительную независимость и денежную поддержку."
 MOR_FACTION_5_DESC: "В Танжерской речи султан Мухаммед V прямо заявил о своей поддержке независимости Марокко. Он тесно сотрудничает с Аллалом аль-Фасси и его националистической партией Истикляль. Эта партия популярна среди городских арабов и берберов. Фракция также пользуется поддержкой традиционных марокканских правителей, которые на протяжении многих поколений клялись в верности королевской семье. Имея прочные местные связи и международную легитимность, султан должен решить, как сбалансировать свой подход к другим марокканским фракциям и колониальным режимам. Слишком резкое движение к независимости может вызвать негативные последствия, но бездействие в этот момент антиколониального пыла может оставить их в борьбе за контроль над судьбой марокканской нации."
 MOR_FRA_State_1_TT: "Доминирующей политической фракцией в Рифе является французский протекторат\nОбщественная поддержка в настоящее время находится на уровне [?290.french_influence_percentage|%G0]\n\n§CФранцузский протекторат Марокко вынужден бороться с растущими волнениями среди марокканского населения. Среди населения, особенно среди городских арабов, принадлежащих к рабочему классу, распространяется националистический пыл. Однако французы могут рассчитывать на поддержку со стороны поселенцев и небольших еврейских общин, проживающих на территории протектората. За предыдущие десятилетия правительство установило прочные связи с некоторыми сельскими общинами посредством призыва в армию. Эти солдаты играли ключевые роли в недавних французских колониальных и военных конфликтах. Можно рассчитывать, что эти люди останутся верны сохранению французского правления. Они хотят сохранить социальные и экономические преимущества своей лояльности.§!"
