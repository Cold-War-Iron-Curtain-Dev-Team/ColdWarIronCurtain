 MOR_RIF_State_12_TT: "Доминирующей политической фракцией в Тафилалет является Комитет Освобождения Арабского Магриба\nОбщественная поддержка в настоящее время находится на уровне [?1470.republican_influence_percentage|%G0]\n\n§CВозглавляемый известным борцом против колониализма и ветераном Рифтовой войны Абд эль-Каримом, Комитет освобождения арабского Магриба основал свой главный офис в Каире. Организация исповедует арабский национализм, выступая за объединение Магриба. Группа популярна среди молодых городских интеллектуалов и сторонников вооруженного сопротивления колониальным державам. Они особенно популярны в районах, контролируемых Испанией или ранее находившихся под ее влиянием. Их сторонники выступают против местных арабов и берберов, которых они считают реакционными или коллаборационистскими, таких как традиционные сельские правители и королевское правительство. Для роста группировки необходимо не только бросить вызов колониальным державам, но и убедить народ принять новый панарабистский национализм, охвативший весь арабский мир.§!"
 MOR_SPR_State_1_TT: "Доминирующей политической фракцией в Рифе является Испания\nОбщественная поддержка в настоящее время находится на уровне [?290.spanish_influence_percentage|%G0]\n\n§CИспанский протекторат Марокко сталкивается с ростом националистических волнений среди населения, особенно среди городских марокканских мусульман. Наряду с некоторыми поселенцами, испанцы могут опираться на меньшинство марокканской еврейской общины. Как и французы, испанцы установили прочные связи с сельскими марокканскими общинами посредством вербовки солдат. Эти солдаты оказались чрезвычайно лояльными и эффективными во время гражданской войны в Испании. Испания может рассчитывать на лояльность этих солдат, которые поддержат продолжение испанского правления, чтобы сохранить свою относительную независимость и денежную поддержку.§!"
