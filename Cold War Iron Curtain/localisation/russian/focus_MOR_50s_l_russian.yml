 MOR_MOR_State_1_TT: "Доминирующей политической фракцией в Рифе является Истикляль\nОбщественная поддержка в настоящее время находится на уровне [?290.istqal_influence_percentage|%G0]\n\n§CВ Танжерской речи султан Мухаммед V прямо заявил о своей поддержке независимости Марокко. Он тесно сотрудничает с Аллалом аль-Фасси и его националистической партией Истикляль. Эта партия популярна среди городских арабов и берберов. Фракция также пользуется поддержкой традиционных марокканских правителей, которые на протяжении многих поколений клялись в верности королевской семье. Имея прочные местные связи и международную легитимность, султан должен решить, как сбалансировать свой подход к другим марокканским фракциям и колониальным режимам. Слишком резкое движение к независимости может спровоцировать негативные последствия, но бездействие в этот момент антиколониального пыла может оставить их в борьбе за контроль над судьбой марокканской нации.§!"
