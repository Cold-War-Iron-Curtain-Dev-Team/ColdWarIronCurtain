 morrocco.4.t: "Покушение на Принца"
 morrocco.4.d: "СМИ сообщили о близком покушении на жизнь наследного принца Хасана II во время выступления с речью в городе Рабат сегодня днем. Во время обсуждения связей с Западом двое мужчин из толпы бросили три бутылки с зажигательной смесью в принца и его охрану. Первая бутылка с зажигательной смесью пролетела мимо, заставив насторожиться двух следующих. Один попал в охрану, а третий даже не был брошен, так как толпа быстро расправилась с мужчинами. Хасан II закончил свою речь, после чего его быстро увели в безопасное место."
 morrocco.4.a: "Хвала Аллаху, Принц в Безопасности!"
 morrocco.4.b: "Неделя национального траура по нашему любимому принцу..."
 morocco_news.1.t.his: "[GetNewspaperHeader]Наследный Принц Хасан II Пережил Нападение"
 morocco_news.1.t.alt: "[GetNewspaperHeader]Наследный Принц Хасан II убит"
 morocco_news.1.d.his: "СМИ сообщили о покушении на жизнь наследного принца Хасана II во время выступления с речью в городе Рабат сегодня днем. Во время обсуждения связей с Западом двое мужчин из толпы бросили три бутылки с зажигательной смесью в принца и его охрану. Первая бутылка с зажигательной смесью пролетела мимо, заставив насторожиться двух следующих. Один попал в охрану, а третий даже не был брошен, так как толпа быстро расправилась с мужчинами. Хасан II закончил свою речь, после чего его быстро увели в безопасное место. Двое мужчин и еще трое сообщников были найдены и арестованы.\n Наследный принц Хасан II поблагодарил охранников и своих сторонников в толпе за спасение его жизни, пообещав, что это не остановит будущие события. То, что могло закончиться ужасным убийством, не оставило ни одного раненого, а влияние оппозиции режиму ослабло."
 morocco_news.1.d.alt: "Разрушительная новость о смерти принца, которая распространилась по всему Марокко, была официально подтверждена государственными властями сегодня вечером. Из-за ухудшения здоровья отца наследный принц Хасан II к концу десятилетия начал брать на себя многие функции отца, что привело к тому, что он стал чаще появляться на публике. Одно из таких выступлений в городе Рабат стало последним, когда он обратился к нации с речью об улучшении отношений с Соединенными Штатами и Западом. После призыва к дружественным связям с Израилем в Хасана II и его охрану были брошены три бутылки с зажигательной смесью. Охранники были потрясены первой бутылкой с зажигательной смесью, что дало возможность второй попасть Хасану прямо в голову, а третьей - в грудь. Принц загорелся и упал, ударившись головой во время падения. Он был быстро потушен и доставлен в медицинское учреждение, так как в городе был введен маршальский закон. Пять предполагаемых террористов были схвачены в течение первого часа.\n После того, как Хасан II был признан мертвым, судьба Марокко оказалась на перепутье. По мере того, как нынешний король заболевает, назрела необходимость в замене наследника. Следующим в очереди на престол стоит брат Хасана II принц Мулай Абдалла, который не проявляет особого интереса к политике. Без сильного Хасана II в качестве замены Мохаммеду V это может означать серьезное будущее для династии Алауитов."
 morocco_news.1.a: "Хвала Аллаху, принц в безопасности!"
 morocco_news.1.b: "Неделя национального траура по нашему любимому принцу..."
 casablanca.1.t: "[GetNewspaperHeader]Конференция группы стран Касабланки"
 casablanca.1.d: "В разросшемся портовом городе Касабланка, расположенном в засушливых пустынях Марокко, лидеры различных государств Северной Африки, таких как Алжир, Египет, Гана, Марокко и другие, решили положить конец конфликту и вражде между своими странами и создать \"Касабланскую группу\". Созданная как неофициальная ассоциация африканских стран, ее единственной целью было объединение Африки под одним знаменем, а панафриканизм был основным постулатом в ее ценностях новой, объединенной Африки. Хотя Касабланская группа широко рассматривается как доброжелательная организация, критики отмечают, что в нее входят в основном радикальные, левые лидеры и их соответствующие политические партии, придерживающиеся взглядов, критически относящихся к правлению Запада в Африке. Тем не менее, наблюдатели считают, что организация может привести к прочному миру и процветанию на одном из самых жестоких, самых бедных континентов планеты, но пока еще рано говорить об этом наверняка."
 casablanca.1.a: "Шаг в пользу Африканского союза"
 morocco.5.a: "НСНС перешла черту!"
 morocco.5.d: "После недавнего нападения на наследного принца полиция захватила 5 подозреваемых. После напряженных переговоров с полицией, они были взяты под стражу закона, где начался дальнейший допрос. В ходе уголовного расследования было установлено, что четверо из пяти подозреваемых имеют конкретные доказательства против них, а также связь с партией Национальный союз народных сил (НСНС) через контракт, найденный в квартире одного из мужчин, предположительно от Фкиха Басри, который командовал нападением.\nЭти доказательства потрясли правительство, не знающее, как реагировать. Решение было оставлено на усмотрение наследного принца Хасана II, который до сих пор не принял никакого решения. "
 morocco.5.t: "[GetNewspaperHeader]Подозреваемые в нападении на НСНС арестованы"
 morocco.6.t: "[GetNewspaperHeader]Амнистия объявлена нападавшим"
 morocco.6.a: "Хасан II будет вести Марокко с праведностью!"
 morocco.6.d: "После нападения на наследного принца Хасана II четыре человека были схвачены и признаны виновными в нападении с доказательствами того, что члены радикальной НСНС организовали покушение. В шокирующей демонстрации прощения Хасан II амнистировал всех причастных.\nБлагородство принца получило большую поддержку общественности, которая видит в нем праведного будущего лидера. Многие представители элиты беспокоятся, что для наказания оппозиции было сделано недостаточно. "
 morocco.9.t: "[GetNewspaperHeader]Президент Барка выживает после рейда роялистов"
 morocco.9.d: "Установление свободных выборов и роли президента будет подвергаться ожесточенному анализу, так как многие роялистские силы считают этот шаг прямым оскорблением некогда могущественной династии Алауитов, обвиняя Бен Барку в \"смерти Марокко\" и \"берберском образе жизни\". Группа, состоящая из элитных роялистов, потерявших многие свои государственные посты, организовала попытку убить Барку и восстановить авторитарный контроль. Начиная с 22:00, 45 стрелков ворвутся в президентский дворец при поддержке 5 AFVS, превращенных военными в бандитов. Президенту, его семье и службе безопасности удалось продержаться до 23:00, когда военные успели нанести поражение нападавшим и восстановить порядок.\nВ то время как президент и его семья остались невредимы, 31 боевик и 4 офицера службы безопасности были убиты, а 4 AFVS уничтожены. Началось расследование, чтобы определить, кто и в какой степени был причастен к этому. На данный момент нация скорбит по силам безопасности, погибшим при защите демократии."
 morocco.9.a: "Кто еще может быть причастен?"
 morocco.12.t: "[GetNewspaperHeader]Монархические Перевороты Теперь будут караться Смертной Казнью"
 morocco.12.d: "После попытки убийства президента Бен Барки более 200 человек были осуждены за координацию и участие в государственной измене, убийстве и покушении на убийство и приговорены к смертной казни. Эта шокирующая новость была официально объявлена по государственному телевидению, которое вело напряженную запись перестрелки. Многие заключенные остаются в камере смертников, а более 30 были казнены через расстрел."
 morocco.11.t: "[GetNewspaperHeader]Коммунисты Изгнаны"
 morocco.11.d: "После нападения был проведен суд над всеми, кто участвовал в заговоре против Бен Барки. После тщательного изучения найденных улик непосредственный стрелок был приговорен к пожизненному заключению, а пятеро других были сосланы в Советский Союз. Напряженность между Марокко и Советским Союзом только нарастала в связи с этой ситуацией, положив конец истории позитивных советско-марокканских отношений."
 morocco.11.a: "Демократия не умрет!"
 morocco.12.a: "Долой предателей!"
 morocco.13.t: "[GetNewspaperHeader]Террор в Марокко!"
 morocco.13.d: "Сегодня по дороге на работу генерал-резидент Марокко Огюстен Гийом был убит с помощью заминированного автомобиля. Когда генеральный резидент вошел в свой автомобиль и его шофер завел его, Citroen Traction Avant вспыхнул, убив их обоих и испепелив листья близлежащей флоры. Самир Туфик, ранее неизвестный марокканский националист, взял на себя ответственность за внезапное нападение, призывая марокканский народ восстать против французских угнетателей, когда он был арестован сегодня днем. Призыв Туфика к действию возымел действие на многих марокканцев, которые сегодня вечером выйдут на улицы Рабата в знак протеста против империалистического французского правительства. Хотя это событие было довольно жестоким, оно пробудило народ Марокко к действиям во имя независимости."
 morocco.13.a: "Vive la revolution!"
 morocco.13.b: "Увеличить наше присутствие там"
 morocco.13.c: "Дорогой Бог"
 morocco.10.t: "[GetNewspaperHeader]Бен Барка выживает после Нападения Коммунистов"
 morocco.10.a: "На этот раз Барка точно уклонился от пули..."
 morocco.10.d: "Президент Бен Барка находился на публичном митинге, когда из толпы в него было произведено три выстрела. Все три выстрела попали мимо, но один из них ранил его в руку. Потрясенные, участники митинга продолжили работу как ни в чем не бывало, а охрана быстро выследила нападавшего. Быстро выследив человека, они обнаружили множество писем между послом СССР в Рабате, в которых обсуждалось убийство. Мужчина был быстро арестован, и в ходе дальнейшего расследования было найдено еще более 6 сообщников."
 Maghreb.1.t: "Пропаганда в Магрибе"
 Maghreb.1.d: "Политики всего Магриба были приглашены в Рабат для обсуждения нового расцвета связей Магриба, которые в большинстве случаев считались враждебными. Предлагаемый Союз Арабского Магриба позволит расширить двусторонние связи как в экономике, так и в политике, что приведет к более тесным отношениям и торговым сделкам. Этот проект будет, по меньшей мере, трудным, поскольку он объединяет страны, которые, как известно, враждовали между собой. Находясь на стадии бета-тестирования, Марокко обещает, что в североафриканском регионе повысится уровень процветания и наступит мир, если удастся договориться о создании Союза."
 Maghreb.1.a: "Принять"
 Maghreb.1.b: "Отклонить"
 11_MOR_tt: "Все Африканские страны согласны на большее сотрудничество"
 12_MOR_tt: "Даёт Претензию на Магриб"