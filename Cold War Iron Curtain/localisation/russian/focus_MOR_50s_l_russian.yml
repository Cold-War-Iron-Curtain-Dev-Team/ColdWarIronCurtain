 aliyah_mission_TT: "Примерно [?ROOT.aliyah_monthly_percentage|%R5] еврейского населения эмигрирует в Израиль, что еще больше препятствует нашему экономическому развитию."
 mor_aliyah: "Алия"
 mor_aliyah_desc: "Марокканская еврейская община проживала в регионе на протяжении многих поколений. С приходом французского колониализма многие еврейские семьи воспользовались преимуществами европейских учреждений, особенно школ. Султан традиционно поддерживал позитивные связи с еврейской общиной, в частности, помогал ей во время Второй мировой войны. Однако возникновение Израиля и возвращение французского колониального надзора привело к обострению отношений. Арабские националисты все чаще рассматривают Израиль как главную угрозу и считают марокканских евреев потенциальной пятой колонной. Они выступают за то, чтобы правительство более жестко контролировало еврейскую общину. Марокканские антиколониальные активисты считают еврейскую общину тесно связанной с французами и представляющей угрозу независимости Марокко. Для еврейской общины французы все больше воспринимаются как их главные защитники, и многие теперь рассматривают миграцию как единственное средство для своей защиты. Правительство должно решить, как успокоить тревогу марокканских евреев или поддержать ту политику, за которую выступают арабские националисты и сторонники антиколониальной политики."
