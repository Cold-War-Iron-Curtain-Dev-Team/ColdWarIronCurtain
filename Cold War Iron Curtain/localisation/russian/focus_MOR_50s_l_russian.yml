 morrocco.1.t: "Смерть Мухаммеда V"
 morrocco.1.a: "Хасан II"
 morrocco.1.b: "Абдалла III"
 morrocco.1.d: "Отмечая печальный день в летописи династии Алауитов, сегодня султан Мухаммед Пятый, мир ему, скончался, поскольку осложнения после продолжающейся операции стали слишком тяжелыми для него; уступив место своему старшему сыну, Хасану II, чтобы теперь взойти на марокканский престол. Тысячи людей выстроились у дверей Королевского дворца, с нетерпением ожидая, когда тело короля отнесут в могилу, под эхо баллад и запах благовоний, знаменующих конец эпохи. Воспоминания о независимости, кажется, никогда не были так свежи. А шепот об убийстве распространился как лесной пожар"
