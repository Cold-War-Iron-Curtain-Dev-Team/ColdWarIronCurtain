 MOR_FRA_State_7_TT: "Доминирующей политической фракцией в Фес является французский протекторат\nОбщественная поддержка в настоящее время находится на уровне [?1469.french_influence_percentage|%G0]\n\n§CФранцузский протекторат Марокко вынужден бороться с растущими волнениями среди марокканского населения. Среди населения, особенно среди городских арабов, принадлежащих к рабочему классу, распространяется националистический пыл. Однако французы могут рассчитывать на поддержку со стороны поселенцев и небольших еврейских общин, проживающих на территории протектората. За предыдущие десятилетия правительство установило прочные связи с некоторыми сельскими общинами посредством призыва в армию. Эти солдаты играли ключевые роли в недавних французских колониальных и военных конфликтах. Можно рассчитывать, что эти люди останутся верны сохранению французского правления. Они хотят сохранить социальные и экономические преимущества своей лояльности.§!"
