 MOR_NOB_State_1_TT: "Доминирующей политической фракцией в Рифе являются Местные Паши\nОбщественная поддержка в настоящее время находится на уровне [?290.nobility_influence_percentage|%G0]\n\n§CТами Эль-Глауи возглавляет сельских пашей, которые все чаще демонстрируют сопротивление националистическим партиям. На протяжении десятилетий эти паши процветали под французским колониальным правлением. Французы предоставили им автономию и защиту, что позволило пашам укрепить свою власть над сельскими общинами и накопить личное богатство. Мобилизация их сторонников позволит им сохранить свою автономию и предотвратить распространение националистического и королевского влияния на их районы. Однако по мере того, как Франция и Испания рассматривают новые реформы, они рискуют оттолкнуть пашу. В связи с изменением ситуации Тами Эль-Глауи должен решить, как ему сохранить свою автономию: поддержать одну из других фракций или даже захватить власть, чтобы сохранить власть пашей.§!"
