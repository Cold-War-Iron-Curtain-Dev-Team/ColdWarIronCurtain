 Burma_KW.1.d: "Премьер-министр Бирмы резко осудил США за интервенцию в Корее. Он сказал, что нынешний конфликт должен быть урегулирован самим корейским народом, и Соединенные Штаты используют конфликт, чтобы навязать свой собственный имперский порядок в Азии. Это заявление разделило бирманских политических лидеров, особенно консерваторов и социалистов. Они опасаются, что осуждение только приободрит бирманских коммунистов и разозлит западные державы, которые являются важным источником экономической помощи для страны. Однако это заявление нашло отклик у левых и простых бирманских граждан, которые все еще оправляются от травм британского и японского империализма."
 Burma_KW.3.d: "AFPFL решила провести чистку Конгресса профсоюзов в ответ на то, что его президент Такин Лвин открыто критиковал AFPFL за его внешнюю политику. Львин явно убежденный коммунист, и организация, созданная как социалистический противовес коммунистическим профсоюзам, нуждается в чистке. AFPFL приостановит членство Конгресса профсоюзов до тех пор, пока он не устранит всех коммунистов, включая Львина, с руководящих должностей. Выполнив эти требования, организация может быть реинтегрирована в AFPFL. Некоторые оппозиционные публикации ссылаются на то, что AFPFL действовала после того, как Лвин публично раскритиковал правительство за поддержку Соединенных Штатов в корейском конфликте."
 Pyidawtha.1.d: "Премьер-министр У Ну созвал ведущих представителей экономики, политики и развития для проведения переговоров о новом плане развития страны. Помимо консультаций с ведущими официальными лицами, правительство также заключило контракты с внешними инженерными, экономическими и горнодобывающими фирмами, чтобы помочь разработать план. У Ну считает, что для того, чтобы избавиться от оков колониализма, Бирма должна стремиться вперед с амбициозным планом преобразований. Цель этого плана развития состоит в том, чтобы сделать Бирму экономически конкурентоспособной и как можно быстрее вывести ее население из нищеты. Правительство планирует обнародовать детали своего комплексного плана на предстоящей конференции по развитию, которая называется "Конференция в Пидавте.""
 Pyidawtha.2.d: "Народ Бирмы и многие международные наблюдатели были очарованы недавно предложенным восьмилетним планом развития премьер-министра У Ну. Подробности были обнародованы во время Конференции в Пидавте по развитию. Бирманское правительство хочет индустриализировать страну и создать государство всеобщего благосостояния. План включает десять основных схем, в том числе акцент на национализацию, инфраструктуру, образование, местное самоуправление и автономию региональных органов власти. Этот план является кульминацией интенсивного планирования правительства, которое также наняло несколько ведущих иностранных консалтинговых и инженерных фирм для помощи в этом. Несмотря на амбициозные цели, правительство уверено, что сможет достичь всех своих целей. Хотя многие люди хвалят экономические аспекты, политические соперники высказывают некоторую критику по поводу того, не вызовет ли расширение полномочий местных органов власти антинациональные настроения."
 AFPFL.1.d: "На последних выборах оппозиционному Национальному объединенному фронту удалось набрать большое количество голосов и мест благодаря нашей избирательной системе. Этой левой коалиции удалось забрать избирателей, от которых мы ожидали голосования вместе с нами. NUF оказался эффективным в создании союзов с профсоюзами и крестьянскими организациями. Мы также слышали слухи о том, что иностранные посольства также были вовлечены в предложение поддержки партии. Лидеры NUF доказали свою способность привлекать и использовать средства массовой информации в своих интересах на протяжении всей избирательной кампании. Партия должна найти время, чтобы проанализировать, что хорошо делает NUF, и предложить реформы для укрепления AFPFL в будущем."
 AFPFL.2.d: "Ба Шве назначен премьер-министром Бирмы. Лидер AFPFL У Ну решил не занимать эту должность. Сообщается, что У Ну особенно обеспокоен быстрым успехом на выборах оппозиционного Фронта национального союза и возглавит усилия по анализу того, какие реформы необходимы для повторного усиления AFPFL. Ба Шве — доверенный заместитель У Ну и глава Социалистической партии. Ожидается, что новый премьер-министр сосредоточится на продолжении экономических преобразований Бирмы."
 AFPFL.3.d: "Поступают сообщения об усилении распрей внутри правящей партии AFPFL в Бирме. Похоже, что премьер-министр Ба Шве становится все более недоволен высокопоставленным лидером партии У Ну. После недавних выборов У Ну стремился начать важные реформы, чтобы укрепить партийный аппарат и сделать его более конкурентоспособным на предстоящих выборах. Некоторые из его предложений явно отталкивают Ба Шве и других, не согласных с руководством У Ну. Говорят, что сторонники Ба Шве сплачивают членов AFPFL, чтобы поддержать призывы к новому руководству в партии."
 AFPFL.4.d: "Правительство Бирмы объявило, что У Ну сменит пост премьер-министра Ба Шве. Новый премьер-министр отметил, что решил взять перерыв, чтобы разработать концепцию укрепления национального единства Бирмы и AFPFL. У Ну пользуется большой популярностью среди многих бирманцев, и его возвращение к власти будет хорошо воспринято. Однако есть сообщения о росте напряженности внутри AFPFL, поскольку даже некоторые из самых лояльных заместителей У Ну, все больше обеспокоены стилем руководства У Ну."
 AFPFL.6.d: "Недавний партийный съезд AFPFL выявил ожесточенные разногласия в партии. Эта внутренняя борьба продолжалась до тех пор, пока не выплеснулась наружу, когда бывший премьер-министр Ба Шве и высокопоставленный лидер партии Чжо Ньин вынудили тринадцать других министров уйти из правительства, фактически расколов партию. Большая часть партии встала на сторону Ба Шве которая называется "Стабильная AFPFL", а те, кто все еще с У Ну, называются "Чистая AFPFL." Несколько дней спустя "стабильная AFPFL" потребовала вотума недоверия в парламенте, который потерпел поражение только тогда, когда оппозиция и Национальный объединенный фронт, решили поддержать осажденного премьер-министра. Несмотря на драматический раскол, кажется, что это разделение в значительной степени является результатом конкурирующих личностей, поскольку ни одна из сторон не объявила о серьезном отходе от традиционной политики AFPFL. Многие бирманцы все больше обеспокоены этим новым витком политической нестабильности."
 Burmese_Buddhism.0.d: "Премьер-министр У Ну, духовный лидер буддистов Тхеравады, инициировал программу по продвижению буддизма по всей стране. Эти усилия поддержат недавнее возрождение буддийских практик по всей Бирме. У Ну твердо уверен, что приверженцы буддизма и его признание многими бирманскими гражданами делают его идеальным средством укрепления национального единства. Будут поощряться буддийские программы, и правительство приложит все усилия для приобретения буддийских артефактов по всему региону. Краеугольным камнем этого нового подхода станут планы проведения Великого Синода."
 Burmese_Buddhism.1.d: "Бирманское правительство решило спонсировать Шестой Великий синод буддизма Тхеравады. Последнее собрание было проведено более восьмидесяти лет назад. Правительство построило пагоду под названием Пагода Каба Айе в Махапасана Гуха. На встречу будут приглашены в общей сложности 2500 буддийских старейшин Тхераведы из восьми стран. Премьер-министр У Ну надеется, что конференция продемонстрирует Бирму как центр буддийского обучения. Совет будет собираться около двух лет, и правительство планирует разрешить посетителям совершать паломничество к этому месту."
 Rohingya.1.d: "Наша дипломатическая миссия в Бирме сообщила, что правительство Бирмы обратилось к ним с требованием прекратить финансирование повстанческого движения рохинджа. Они настаивают на том, что их позиция состоит не в том, чтобы искоренить ислам в Бирме, а в том, чтобы создать единое государство, в котором все общины смогут процветать. С их точки зрения, наша постоянная поддержка является разрушительной, и бирманское правительство рассматривает возможность ухудшения наших дипломатических отношений. В обмен на то, что мы прекратим помощь рохинджа, бирманское правительство готово улучшить дипломатические и торговые связи, предоставив нам более широкий доступ к их рынкам. Представители нашей разведки считают, что мы можем продолжать поддерживать повстанцев, но продолжение боевых действий может привести к более агрессивным репрессиям со стороны бирманской армии, что может привести к гуманитарному кризису. Предложение кажется выгодным, однако нет никаких гарантий, что бирманцы сдержат свое обещание не подавлять ислам в Бирме после восстановления ее власти."
 Rohingya.2.d: "Пакистанская дипломатическая миссия тихо сообщила нам, что они не будут вмешиваться в наши внутренние дела. Это значительно ослабит повстанческое движение рохинджа. Мы пообещали пакистанцам, что возмездия не будет, но, конечно, мы оставляем за собой право вести внутренние дела так, как мы считаем нужным. Чтобы они были довольны, мы предложим улучшение торговых отношений. Этого должно быть достаточно, чтобы предотвратить их повторное столкновение с повстанцами в более позднее время. Это крупная победа нашего правительства и военной позиции нашего государства."
 Rohingya.3.d: "Правительство Пакистана отвергло наше прямое требование прекратить вооружать повстанцев рохинджа. Они настаивают на том, что это не пакистанские агенты вооружают повстанцев, и нет никаких доказательств какой-либо причастности Пакистана к этому делу. Это серьезная неудача и смехотворное отрицание. Пакистанцы явно сосредоточены на этой ошибочной попытке вмешаться в наши дела. Мы ухудшим отношения с Пакистаном и удвоим наши усилия по искоренению повстанцев. Армия настаивает, что это не помешает им восстановить порядок и установить национальное единство."
 Burma_Union.1.d: "Премьер-министр У Ну объявил о создании Бюро специальных расследований. Это новое криминальное ведомство будет подчиняться непосредственно премьер-министру. Агентство будет отвечать за расследование финансовых преступлений, коррупции и незаконных потоков иностранной валюты. У Ну все больше беспокоит влияние коррупции на управление и роль иностранных государств в поддержке повстанческих движений. Оппозиция выразила обеспокоенность тем, что новая организация станет инструментом премьер-министра для наказания и ареста оппонентов по надуманным основаниям."
 NUF_1958.0.d: "В важном заявлении бирманское правительство объявило, что коммунистическая повстанческая Освободительная армия прекратит свою кампанию и присоединится к государству. Премьер-министр отметил, что предыдущие боевые действия были вызваны разногласиями с государством, но его правительство разрешило эти опасения. Это большой успех нового правительства Национального единого фронта, поскольку оно положило конец большой вооруженной группе повстанцев. Хотя многие приветствуют эту новость, среди бирманских консерваторов растет подозрение, что NUF контролировало повстанцев и использовало их для оказания давления на предыдущее правительство."
 Burma_Elect.1.d: "Бирма проводит всеобщие выборы, чтобы определить следующее правительство. Из-за продолжающихся проблем с безопасностью явка избирателей кажется очень низкой. Ожидается, что популярная AFPFL победит на выборах подавляющим большинством голосов, поскольку ей удалось создать коалиции со многими другими партиями, участвующими в опросах. Несмотря на низкую явку, партия воспользуется этой победой как сильным мандатом для реализации своего видения нации. AFPFL обещает экономическое и социальное развитие, но ее основное внимание будет сосредоточено на восстановлении национального единства в стране. Это означает взаимодействие со многими повстанческими группировками, действующими в настоящее время в стране."
 BURMA_KMT_UN.1.d: "На заключительном этапе гражданской войны в Китае тысячи солдат Гоминьдана (КМТ) из Китайской Республики перешли на нашу территорию, где они создали базы вокруг Кендуна, на Шанской земле. Утверждается, что эти иностранные воинские части тренируются и готовятся к возможному вооруженному вторжению в Китай. Наши попытки заставить этих людей разоружиться и подчиниться нашей власти были отвергнуты. Командующий гоминьданом заявил, что будет сопротивляться любым попыткам наших военных восстановить нашу власть в этом районе. Эти иностранные солдаты эксплуатируют наших местных жителей и ресурсы. Если они решат вторгнуться в Китай, мы рискуем подвергнуться полному вторжению со стороны китайского коммунистического правительства. Военная кампания будет дорогостоящей, поэтому мы должны сначала обратиться в ООН и попросить помощи в решении проблемы КМТ."
 Operation_Bayinnaung.1.d: "Наши усилия по использованию Организации Объединенных Наций для переговоров о выводе гоминьдановских сил с наших земель принесли определенные плоды. Международное сообщество принимает нашу позицию, и некоторые иностранные силы были выведены. Однако наши спецслужбы отметили, что вывод войск идет очень медленно, и многие иностранные боевые части остаются. Чтобы быстро разрешить этот кризис, военные инициировали операцию «Байиннаунг», крупнейшую из когда-либо проводившихся межведомственных операций. Мы ожидаем, что гоминьдановское сопротивление рухнет довольно быстро, что, наконец, положит конец их оккупации."
 NUF_1958.4.d: "Национальный объединенный фронт твердо верит в единую Бирму, но категорически не согласен с прежней политикой использования военной силы для установления центральной власти над всей территорией. После проведения обсуждений правительство NUF решило сделать предложения лидерам Карен и Мон. Каждой группе будет предоставлена возможность прекратить вооруженное восстание в обмен на региональную автономию. Они должны присягнуть бирманскому правительству, но им будет предоставлена широкая автономия. NUF считает, что ее предложение обеспечивает быстрое возвращение к миру и экономическому процветанию для всех граждан. Элементы бирманских военных и националистов недовольны этим предложением, утверждая, что это капитуляция государства."
 NUF_1958.5.d: "Национально-освободительная армия Карана объявила, что примет недавнее мирное предложение, предложенное правительством Объединенного национального фронта. Соглашение призывает к прекращению всех боевых действий между бирманскими силами и бойцами Карен. Взамен Карен будет предоставлена обширная автономия, возможность жить в соответствии со своим образом жизни в пределах бирманского государства. Новость хорошо принята в Карене и в контролируемых правительством частях Бирмы. Правительство NUF утверждает, что оно сделало еще один шаг к объединенной Бирме, где все граждане могут жить в условиях мира. Ходят слухи о гневе, особенно среди консервативной элиты и некоторых офицеров, которые считают соглашение сдачей бирманской территории силам повстанцев."
 NUF_1958.6.d: "Каренская национально-освободительная армия объявила, что не примет недавнее мирное предложение, предложенное правительством Объединенного национального фронта. Соглашение призывает к прекращению всех боевых действий между бирманскими силами и бойцами Карен. Взамен Карен будет предоставлена обширная автономия, возможность жить в соответствии со своим образом жизни в пределах бирманского государства. Группа повстанцев заявила, что бирманское правительство делало аналогичные предложения в прошлом, но отказывалось от них. Эта новость является серьезной неудачей для NUF, которая обещала быстро объединить Бирму. Оппозиционные газеты сообщают, что некоторые военные втайне недовольны правительством, чье щедрое предложение только подтолкнуло повстанцев к мысли, что они могут добиться полной независимости."
 NUF_1958.7.d: "Народно-освободительная армия Мон объявила, что примет недавнее мирное предложение, предложенное правительством Объединенного национального фронта. Соглашение призывает к прекращению всех боевых действий между бирманскими силами и боевиками Мон. Взамен монам будет предоставлена обширная автономия, возможность жить в соответствии со своим образом жизни в пределах бирманского государства. Новость хорошо принята в Карене и в контролируемых правительством частях Бирмы. Правительство NUF утверждает, что оно сделало еще один шаг к объединенной Бирме, где все граждане могут жить в условиях мира. Ходят слухи о гневе, особенно среди консервативной элиты и некоторых офицеров, которые считают соглашение сдачей бирманской территории силам повстанцев."
 NUF_1958.8.d: "Народно-освободительная армия Мон объявила, что не примет недавнее мирное предложение, предложенное правительством Объединенного национального фронта. Соглашение призывает к прекращению всех боевых действий между бирманскими силами и бойцами Карен. Взамен монам будет предоставлена обширная автономия, возможность жить в соответствии со своим образом жизни в пределах бирманского государства. Группа повстанцев заявила, что бирманское правительство делало аналогичные предложения в прошлом, но отказывалось от них. Эта новость является серьезной неудачей для NUF, который обещал быстро объединить Бирму. Оппозиционные газеты сообщают, что некоторые военные втайне недовольны правительством, чье щедрое предложение только подтолкнуло повстанцев к мысли, что они могут добиться полной независимости."
 AFPFL.5.d: "Правительство Бирмы объявило, что У Ну сменит пост премьер-министра Ба Шве. Новый премьер-министр отметил, что решил взять перерыв, чтобы разработать концепцию укрепления национального единства Бирмы и AFPFL. У Ну пользуется большой популярностью среди многих бирманцев, и его возвращение к власти будет хорошо воспринято. Однако есть сообщения о росте напряженности внутри AFPFL, поскольку даже некоторые из самых лояльных заместителей У Ну, как говорят, все больше обеспокоены стилем руководства премьер-министра. Придя к власти, премьер-министр должен будет управлять этими конфликтами или рисковать их эскалацией."
 AFPFL.7.d: "Премьер-министр У Ну, после раскола AFPFL и того, как он едва выжил после вотума недоверия, призвал генерала Ни Вина, начальника штаба вооруженных сил, стать временным премьер-министром. Генерал Ни Вин пообещал, что временное правительство восстановит общественный порядок, обеспечит стабильность, а затем проведет новые выборы нового правительства. Многие хвалят У Ну за его решение, отмечая, что после раскола AFPFL он признал, что эффективное управление будет невозможным, тем более что многие парламентарии AFPFL сейчас выступают против У Ну. Две фракции AFPFL будут стремиться организоваться к следующим выборам."
 Burma_FP.1.d: "Бирма и Китайская Народная Республика (КНР) подписали соглашение об установлении официальных дипломатических отношений между двумя государствами. Исторически Бирма и Китай имели многовековые торговые, языковые и религиозные связи друг с другом. Это решение делает Бирму одним из первых некоммунистических государств, признавших правительство КНР, и вызвало некоторую критику со стороны западных посольств. Чиновники бирманского правительства обычно говорят, что Китай является крупным торговым партнером и соседним государством, игнорирование этого только вызовет недоверие и ненужные проблемы."
 Burma_Agreement.1.d: "Правительство Бирмы объявило, что будет соблюдать соглашение, подписанное Аунг Саном, о предоставлении полной автономии общинам меньшинств в Бирме. Военным было приказано покинуть эти места вместе с федеральными чиновниками. Говорят, что повстанческие силы Карен, Шан, Аракан и Мон празднуют вместе со своими сторонниками. Несмотря на утверждения, что правительство просто выполняет прошлые обязательства, ясно, что повстанцы успешно вытеснили военных со своей территории. Похоже, что «полная автономия» — это просто способ правительства преуменьшить тот факт, что эти районы фактически независимы от бирманской власти. Бирманское правительство надеется, что теперь оно сможет сосредоточить свои усилия на укреплении экономики Бирмы, в которой больше не бунтуют."
 Burma_KW.2.d: "Премьер-министр Бирмы решительно осудил вторжение Северной Кореи в Южную Корею. Он отметил, что это был акт неприкрытой агрессии со стороны режима, отчаянно пытающегося насильственно навязать свою коммунистическую систему мирному государству. Он заявил о своей поддержке международных усилий по прекращению боевых действий и защите южнокорейского народа. Это заявление было хорошо воспринято западными посольствами, которые пытаются заручиться международной поддержкой против Северной Кореи. Большинство политических лидеров поддерживают это заявление, считая его явным свидетельством того, что премьер-министр не потерпит насилия со стороны коммунистов и хочет укрепить связи с Западом. Однако бирманские коммунистические лидеры и члены профсоюзов резко критикуют премьер-министра за то, что он является орудием западного империализма."
 NUF_1958.2.d: "Бирманское правительство недавно арестовало начальника штаба вооруженных сил по подозрению в подготовке государственного переворота. Во время последующего судебного разбирательства ему было предъявлено обвинение в организации эскадронов смерти и незаконном вмешательстве в управление государством. По его убеждению, он был быстро казнен. Казнь ошеломила бирманских военных и оставила их антикоммунистических офицеров без лидера. Многие офицеры подумывают об уходе в отставку, и Объединенный национальный фронт надеется заполнить руководящие должности своими сторонниками. Генерал Ни Вин считался аналитиками вероятным человеком, который либо возглавит переворот против NUF, либо сохранит независимость вооруженных сил от политического влияния."
 NUF_1958.3.d: "После окончания гражданской войны в Китае тысячи гоминьдановских сил, организованных как Юньнаньская антикоммунистическая армия национального спасения (ЮААНС), оккупировали северную Бирму, ожидая приказа о вторжении в Китай. Эти силы долгое время сопротивлялись попыткам Бирмы восстановить свою власть в этом районе или даже разоружить этих солдат. Однако новое левое правительство, возглавляемое партией Объединенный национальный фронт, объявило, что больше не может мириться с тем, что иностранные вооруженные силы подрывают государственную власть. Бирманским военным было приказано ликвидировать ЮААНС любыми средствами. Это решение нашло поддержку у многих в стране. Представитель ЮААНС заявил, что бирманское правительство является марионеткой международного коммунизма и что его силы не остановят свою священную миссию."
 Burma_Elect.2.d: "Жители Бирмы должны проголосовать на предстоящих всеобщих выборах. Партия сопротивления военного времени, AFPFL, является большим фаворитом, и ее лидеры ожидают больших результатов. Уверенность выражает и их главный оппонент - Объединенный национальный фронт. Во время избирательной кампании он стремился установить отношения с профсоюзами и крестьянскими группами, опираясь на традиционную базу поддержки AFPFL. NUF также объединяет левые и правые группы, предлагая широкую коалицию. В ходе избирательной кампании NUF обвинил AFPFL в коррупции, в то время как AFPFL утверждает, что NUF получает иностранное финансирование. Теперь народ Бирмы должен решить, кто будет править."
  
 MYR_The_U_Nu_Era_desc: ""
 MYR_The_Pyidawtha_Plan_desc: "План Pyidawtha - это восьмилетний план национального экономического развития для создания индустриального государства всеобщего благосостояния в постколониальной Бирме. Первоначальная стоимость плана оценивается в 1 575 000 000 долларов США, две трети из которых предназначены для промышленных предприятий, а остальные - для финансирования социальных услуг."
 MYR_The_Tatmadaw_desc: "На момент обретения Мьянмой независимости в 1948 году Татмадау была слабой, малочисленной и разобщенной. Трещины появились по этническому признаку, политической принадлежности, организационному происхождению и различным службам. Самой серьезной проблемой была напряженность между офицерами-каренцами, пришедшими из британской армии Бирмы, и бирманскими офицерами, пришедшими из Патриотических бирманских сил (ПБС)."
 MYR_The_Elections_of_1956_desc: ""
 MYR_Restore_Abandoned_Rice_Paddies_desc: "В результате японского вторжения многие рисовые поля были заброшены во время войны. Сейчас, когда война позади, пришло время вернуть эти заброшенные поля к работе."
 MYR_Introduce_New_Cotton_Strains_desc: "Министерство сельского хозяйства занимается исследованиями хлопка с 1920-х годов. Теперь, чтобы расширить хлопковую промышленность, мы создадим Корпорацию по развитию сельского хозяйства и сельских районов, чьей задачей будет исследование и улучшение наших хлопковых сортов. Уже заключена сделка по импорту хлопка, растущего на возвышенностях, G. hirsutum из США и СССР."
 MYR_Rebuild_Railways_desc: "Наша железнодорожная инфраструктура была сильно повреждена во время войны. Теперь, для поддержкичтобы поддержать нашу растущую промышленную базу, мы должны восстановить их."
 MYR_Japanese_Reperations_desc: "Японцы согласились выплатить нам репарации за свои действия во Второй мировой войне."
