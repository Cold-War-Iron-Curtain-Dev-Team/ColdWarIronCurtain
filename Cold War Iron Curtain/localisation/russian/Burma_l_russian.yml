 MYR_Request_Pakistan_Halt_Mujahideen_Funding_desc: "Пакистанское правительство предупредило нас об отношении к мусульманам в Аракане при поддержке повстанцев рохинья. Чтобы успокоить их опасения, а также прекратить поддержку повстанцев, мы отправим дипломата Пе Кхина для переговоров о заключении меморандума о взаимопонимании."
 MYR_Establish_the_Bureau_of_Special_Investigation_desc: "Административный совет по специальным расследованиям должен быть сформирован под непосредственным руководством премьер-министра с количеством сотрудников 315 человек в соответствии с \"Законом о бюро специальных расследований\.""
