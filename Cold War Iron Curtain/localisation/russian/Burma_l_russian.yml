 MYR_Organize_A_Great_Synod_of_Theraveda_Buddhism_desc: "Шестой буддийский синод - это генеральный совет буддизма тхеравады, проводимый в специально построенном комплексе пещер и пагод в пагоде Каба Айе в Янгоне. Планируется, что в совете примут участие 2500 монахов из восьми стран, исповедующих буддизм тхеравады. Совет должен продлиться с Весака 1954 года по Весак 1956 года, его завершение совпадет с традиционным 2500-летием Париниббаны Будды Гаутамы. По традиции прошлых буддийских советов, основной целью Шестого совета является сохранение учений и практики Будды в том виде, как они понимаются в традиции тхеравадинов."
 MYR_Preserving_The_Union_desc: "Мы должны сделать все возможное, чтобы сохранить бирманский союз от распада."
