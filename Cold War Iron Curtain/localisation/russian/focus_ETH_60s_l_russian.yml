 newseth60.3.d: "На этой неделе удивленный Хайле Селассие был «атакован» более чем сотней тысяч фанатичных ямайцев, вывалившихся на взлетно-посадочную полосу. Его приветствовали восторженные исполнители громких барабанов из калебаса с едкими облаками дыма каннабиса, когда он пытался покинуть свой самолет в международном аэропорту Кингстона. Его Императорское Величество (в настоящее время в сопровождении видных деятелей растафари) затем продолжил свое пребывание на Ямайке, приняв участие в нескольких церемониях по всему городу: от посещения дворца премьер-министра до получения почетного звания доктора Вест-Индского университета. Однако самой знаменательной церемонией была его встреча с ключевыми фигурами культа Растафари, которая войдет в историю как легендарное событие для последователей движения. Во всей африканской диаспоре в Вест-Индии растафари теперь узаконены и воспринимаются всерьез как их пророк, Хайле Селассие проявил к ним привязанность. Несмотря на это буквальное поклонение Хайле Селассие теми, кто заявляет, что он - второе пришествие Иисуса Христа, его императорское величество настаивало на том, что он «обычный человек», что мало что изменило в их сознании."
