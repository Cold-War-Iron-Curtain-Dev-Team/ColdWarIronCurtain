 ETH_60s_Asfaw_Wossens_Speech: "Выступление Асфау Воссена"
 ETH_60s_Asfaw_Wossens_Speech_desc: "Асфау Воссен (некоторые утверждают, что под давлением заговорщиков) произнес длинную и вдохновляющую речь, описывающую угнетение сельского эфиопского народа. По его словам и его сторонникам, мы должны создать организованное прогрессивное имперское общество, основанное на этой теме."
