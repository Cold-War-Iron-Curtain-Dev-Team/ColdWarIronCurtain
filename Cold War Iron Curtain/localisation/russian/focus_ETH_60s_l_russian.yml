 ETH_60s_the_final_modernization_desc: "С момента восхождения на престол Хайле Селассие он провел несколько модернизаций, направленных на превращение Эфиопии в современное национальное государство. В 1960-х - начале 1970-х годов Хайле Селассие проведет последнюю из своих реформ."
