 selassie_brazil_trip: "Хайле Селассие находится с государственным визитом в Бразилии"
 eth60.1.d: "Хайле Селассие отправился с дипломатической миссией в Сан-Паулу на несколько недель, чтобы встретиться с президентом Федеративной Республики Бразилии и организовать обмен между различными представителями обеих стран."
 eth60.2.d: "Бригадный генерал Менгисту Ньюэй потребовал, чтобы большинство видных министров и политиков Эфиопии встретились в столице Империи на экстренное совещание."
 newseth60.1.d: "Сегодня утром в Аддис-Абебе произошло шокирующее событие: генералы Менгисту Ньюэй, Мулугета Були и местный губернатор Герман Ньюэя взяли в заложники премьер-министра и ключевые фигуры, поскольку лояльные силы приближаются к ситуации, чтобы стабилизировать ситуацию. Пока император Селассие находится в дипломатической поездке в Бразилию, время покажет, как все будет развиваться..."
 newseth60.2.d: "Сегодняшний день ознаменовался образованием ОАЕ, Организации африканского единства в Аддис-Абебе, Эфиопия, вместе с 32 подписавшими ее правительствами. Главная цель формирования была объявлена объединить африканские народы и полностью искоренить колониализм и неоколониализм на континенте. Во время первой конференции, которая состоялась 1 мая, ведущий гамбийский националист Алиеу Эбрима Чам Джооф выступил с жесткой антиколонизационной речью: «Поэтому я заклинаю вас игнорировать любые предложения за пределами Африки и считать, что нынешняя цивилизация , которым хвастаются некоторые из крупных держав, они возникли в Африке и понимают, что всему миру есть чему поучиться у Африки». Теперь мир ждет, чтобы увидеть, что этот новый союз может принести континенту."
 eth60.3.d: "Воспользовавшись поездкой императора, сегодня утром было созвано ложное экстренное собрание, на котором эфиопские заговорщики во главе с генералами Менгисту Ньюай, Мулугета Були и местный губернатор Гармаме Ньюай взяли в заложники таких ключевых фигур, как премьер-министр Аббе Арегай."
 eth60.4.d: "Последующие часы были жестокими по отношению к этим заговорщикам, поскольку Мулугета Були пытается сохранить лояльность вооруженных сил для поддержки переворота. Действия, которые они предпримут для обеспечения этой лояльности, навсегда решат судьбу Эфиопии."
 eth60.5.d: "Принц Асфау Воссен, сын Хайле Селассие, произнес на этой неделе противоречивую речь из столицы, контролируемой узурпаторами. Акцентирование внимания на речи было смелым заявлением о будущем Эфиопии. Атака на слабые места и недостатки правительства в решении проблем, от которых страдают бедные массы сельской страны. Претендовать на светлое будущее под конституционной монархией во главе с принцем с новым кабинетом прогрессивных деятелей, в котором простой эфиоп больше не был забыт. В то время как большинство иностранных наблюдателей считали принца неподдельным и просто говорящим под давлением похитителей, местная студенческая молодежь и интеллигенция вышли на городскую площадь, собравшись в хвалу."
 eth60.6.d: "Войска под командованием Мареда Мангеши под прикрытием крупнокалиберных пулеметов, самолетов-разведчиков, легких танков и большого пехотного взвода штурмовали центр столицы сегодня днем. Когда многие заговорщики погибли в бою, два главных организатора, братья Ньюэй, в последний момент трусости убили своих заложников, включая премьер-министра и ветерана Итало-эфиопской войны Абебе Арегай. Удивительно, но в их отчаянной попытке сбежать, двое убили своего товарища по заговору Мулугети Булли в споре. Жернам Ньюэй и Менгисту Ньюэй были найдены в соседнем городе Моджо, хотя они могли бежать из столицы. В то время как Жермам Ньюэй покончил жизнь самоубийством до своего захвата, Менгисту был взят живым и вскоре после этого повешен."
 eth60.7.d: "Премьер-министр Абебе Арегай, хотя и мог легко обмануть крупные итальянские подразделения в войне нашей страны десять лет назад, не смог урегулировать свою ситуацию с заговорщиками и был полностью сдержан в своей роли заложника. У гражданского правительства нет надежды остановить этот переворот, и спасти монархию должны будут вооруженные силы."
 eth60.8.d: "Когда воздушные силы и танковые подразделения страны заявили о своей лояльности перевороту, монархия нации была фактически узурпирована. Хотя вначале неясно, какую именно смену администрации предпримут заговорщики, ясно, что в ближайшее десятилетие страна Эфиопия радикально изменится к лучшему или худшему. В то время как студенческая молодежь и интеллигенция организовывают массовые праздники в основных городах Эфиопии, сельская знать постепенно узнает о перевороте и готовится к худшему. Поскольку сельское неграмотное крестьянство не имеет доступа к информации за пределами своего имения, их помещики опасаются их будущего и начнут делать все возможное, чтобы сохранить свою феодальную собственность."
 eth60.9.d: "Посланники из Аддис-Абебы неоднократно приводили устрашающие речи руководителей страны. Местный парламент Эритреи, созданный резолюцией ООН, делающей его владением под эфиопской короной, постоянно отодвигается на второй план, а региональные администраторы начинают думать, что их позиции скоро станут несостоятельными."
 eth60.10.d: "Несмотря на рост беспорядков в связи с ростом эритрейского национализма, император объявил о полной аннексии Эритреи; объявляя провинцию Асмэра. Как нация Эритреи отреагирует на это сверхурочное время, еще предстоит увидеть."
 eth60.11.d: "Эфиопский военный штаб недавно получил сообщение о том, что эритрейский националист и боец Хамад Идрис Авате погиб в результате боя. В то время как некоторые рассматривают потерю наиболее важной фигуры ФОЭ как удар по своей морали, другие аналитики видят в этом лишь причину для большей мотивации со стороны повстанцев-эртиреев."
 eth60.12.d: "Мы только что получили требование от новой администрации Эфиопии, в котором говорится, что наш султан должен немедленно отказаться от своих владений, прежде чем его королевство окажется перед полным исчезновением. Как мы ответим?"
 eth60.13.d: "Главнокомандующий вооруженными силами Мулугети Булли организовал сегодня в столице государственный переворот при поддержке военных. Прославившийся как итало-эфиопский военный генерал, возглавлявший эфиопские экспедиции в Корейской войне, он занимал видное место в новой администрации с момента государственного переворота 1960 года. Вдохновленный египетскими свободными офицерами, положившими конец вековой династии Мухаммеда Али, Мулугети Булли считает себя сильным генералом, который возглавит полулевое националистическое правительство в Эфиопии, которое будет милитаризировать государство для защиты от иностранной агрессии."
 eth60.14.d: "Молодой принц Асфау Воссен был принят сегодня эфиопской церковью как император Амха Селассие. Утверждая, что он прогрессивный монарх, который решит и решит проблемы, преследующие бедное крестьянство страны."
 ethparty.1.d: "Под руководством Хайле Фида в Эфиопии была сформирована новая видная левая партия, основанная на аграрном социализме. Вдохновленная маоизмом и другими африканскими идеологиями, партия хочет радикально изменить Эфиопию на основе земельной реформы ее обширных владений, при этом крепостные до сих пор живут почти в рабстве."
 ethparty.2.d: "Сегодня создается Эфиопская народно-революционная партия, привлекающая широкий круг студентов из центральных университетов. Основываясь на более маргинальных элементах революционного социализма и коммунизма, партия строит достойных последователей, которые, безусловно, повлияют на политику Эфиопии в будущем."
 eth60.16.d: "Впервые за тысячелетнюю историю Эфиопии мы видим первые всеобщие выборы. Две основные партии, получившие известность, - это MEISON и недавно созданная коалиция различных демократических групп под руководством основателя новой республики под руководством Германа Ньюэя. Возникает вопрос - кто победит на этих спорных выборах?"
 eth60.17.d: "С помощью крупных держав - в первую очередь Великобритании, офицеры, все еще сохраняющие верность короне, с помощью иностранного оборудования и обучения организовали крупномасштабное амхарское восстание против нового правительства. Мы должны подавить это восстание."
 eth60.18.d: "На этой неделе дворянство Годжама подняло сборы, которые жестко боролись с монархией в Хайле Селассие, пытаясь править в их угнетении своих крепостных. Хотя это и не было полномасштабным восстанием, основная инфраструктура региона была повреждена."
 eth60.19.d: "Перед лицом восходящих панафриканистов в Африке, таких как Нкрума, Найререр и Кеньятта, Хайле Селассие больше пытается расширить свой внешний имидж и дипломатию. То, как он отреагирует на будущие мировые события, непременно привлечет внимание зарубежных аналитиков."
 eth60.20.d: "Сегодняшний день ознаменовался образованием ОАЕ, Организации африканского единства в Аддис-Абебе, Эфиопия, вместе с 32 подписавшими ее правительствами. Главная цель формирования была объявлена объединить африканские народы и полностью искоренить колониализм и неоколониализм на континенте. Во время первой конференции, которая состоялась 1 мая, ведущий гамбийский националист Алиеу Эбрима Чам Джооф выступил с жесткой антиколонизационной речью: «Поэтому я заклинаю вас игнорировать любые предложения за пределами Африки и считать, что нынешняя цивилизация , которым хвастаются некоторые из крупных держав, они возникли в Африке и понимают, что всему миру есть чему поучиться у Африки». Теперь мир ждет, чтобы увидеть, что этот новый союз может принести континенту."
