 ETH_50s_ethiopian_state_enterprise: "Эфиопские государственные предприятия"
 ETH_50s_ethiopian_state_enterprise_desc: "Нам нужно развивать государственные предприятия."
 ETH_50s_ethiotelecom: "«Ethio telecom»"
 ETH_50s_ethiotelecom_desc: "Мы учреждаем государственную телекоммуникационную компанию «Ethio telecom»."
 ETH_50s_anbessa_city_bus_service_enterprise: "«Anbessa City Bus Service Enterprise»"
 ETH_50s_anbessa_city_bus_service_enterprise_desc: "Мы создадим общественный транспорт в центральной Эфиопии."
 ETH_50s_harar_fuel_silos: "Топливные хранилища Харэра"
 ETH_50s_harar_fuel_silos_desc: "Мы установим прочные топливные хранилища в Харэре."
 ETH_50s_highland_foundries: "Высокогорные литейные хаводы"
 ETH_50s_highland_foundries_desc: "Мы будем строить литейные заводы в Центральном нагорье."
 ETH_50s_ethiopian_foreign_policy: "Внешняя политика Эфиопии"
 ETH_50s_ethiopian_foreign_policy_desc: "Вот как мы откроем себя миру."
 ETH_50s_partition_eritrea: "Раздел Эритреи"
 ETH_50s_partition_eritrea_desc: "Более практично разделить Эритрею между Эфиопией и англо-египетским Суданом."
 ETH_50s_british_guarantee: "Британская гарантия"
 ETH_50s_british_guarantee_desc: "Благодаря этой договоренности Великобритания гарантирует вашу безопасность."
 ETH_50s_UN_disaproval: "Ответ ООН"
 ETH_50s_UN_disaproval_desc: "Генеральный комитет Организации Объединенных Наций не одобряет наше соглашение с Соединенным Королевством."
 ETH_50s_UN_Resolution_390-A: "Резолюция ООН 390-A(V)"
 ETH_50s_UN_Resolution_390-A_desc: "Организация Объединенных Наций предлагает резолюцию, которая объединит Эритрею с Эфиопией."
 ETH_50s_seek_international_support: "Искать международную поддержку"
 ETH_50s_seek_international_support_desc: "Мы с радостью получим поддержку по этому предложению."
 ETH_50s_establish_federal_structure: "Создать федеральную структуру"
 ETH_50s_establish_federal_structure_desc: "Предварительно нужно создать федеральную структуру."
 ETH_50s_the_federal_act: "Федеральный закон"
 ETH_50s_the_federal_act_desc: "С подписанием федерального закона мы объединимся с Эритреей в федеральную структуру."
 ETH_50s_abolish_eritrean_constitution: "Отменить конституцию Эритреи"
 ETH_50s_abolish_eritrean_constitution_desc: "Мы выберем отмену конституции Эритреи."
 ETH_50s_enforce_amharic_language: "Обеспечить соблюдение амхарского языка"
 ETH_50s_enforce_amharic_language_desc: "Мы выберем амхарский язык."
 ETH_50s_allow_arabic_use: "Разрешить использование арабского языка"
 ETH_50s_allow_arabic_use_desc: "Мы разрешим говорить на арабском и эритрейском языках."
 ETH_50s_preserve_eritrean_constitution: "Сохранить конституцию Эритреи"
 ETH_50s_preserve_eritrean_constitution_desc: "Мы сделаем выбор в пользу сохранения конституции Эритреи."
 ETH_50s_resignation_of_Tedla_Bairu: "Отставка Тедла Байру"
 ETH_50s_resignation_of_Tedla_Bairu_desc: "Тедлу Байру, глава исполнительной власти Эритреи, решил уйти в отставку, учитывая отношение к эритрейской культуре и языку в соответствии с новой конституцией Эфиопии."
 ETH_50s_nationalize_eritrean_coffee_exports: "Национализировать экспорт кофе из Эритреи"
 ETH_50s_nationalize_eritrean_coffee_exports_desc: "С новым контролем над Эритреей мы теперь можем национализировать экспорт эритрейского кофе."
 ETH_50s_expand_copper_mining_in_eritrea: "Расширить добычу меди в Эритрее"
 ETH_50s_expand_copper_mining_in_eritrea_desc: "Нам нужно расширить добычу меди в Эритрее."
 ETH_50s_address_the_mau_mau_uprising: "Обратиться к восстанию Мау-Мау"
 ETH_50s_address_the_mau_mau_uprising_desc: "Соседняя страна Кения столкнулась с масштабным антиколониальным восстанием. Как подойти к этому вопросу?"
 ETH_50s_shelter_the_mau_mau: "Убежище Мау-Мау"
 ETH_50s_shelter_the_mau_mau_desc: "Мы должны приютить этих борцов за свободу."
 ETH_50s_ignore_the_korean_war: "Игнорировать корейскую войну"
 ETH_50s_ignore_the_korean_war_desc: "Это событие на нас не влияет, давайте держаться подальше от этого дела."
 ETH_50s_intervene_in_the_korean_war: "Вмешаться в корейскую войну"
 ETH_50s_intervene_in_the_korean_war_desc: "Своей интернациональной внешней политикой мы должны помочь коалиции Организации Объединенных Наций на Корейском полуострове."
 ETH_50s_support_south_korea: "Поддержать Южную Корею"
 ETH_50s_support_south_korea_desc: "Нам нужно поддержать Южную Корею в коалиции ООН"
 ETH_50s_address_postwar_italian_government: "Обратиться к послевоенному правительству Италии"
 ETH_50s_address_postwar_italian_government_desc: "После гражданской войны в Италии у нас появилась новая итальянская нация, с которой можно установить дипломатические отношения."
 ETH_50s_demand_reparations: "Требовать возмещения ущерба"
 ETH_50s_demand_reparations_desc: "Мы заслуживаем возмещения за многочисленные повреждения и раны, нанесенные нашему народу итальянцами."
 ETH_50s_forgive_and_forget: "Простить и забыть"
 ETH_50s_forgive_and_forget_desc: "Мы должны простить действия Италии, они изменившиеся люди."
 ETH_50s_denounce_the_mau_mau: "Осудить Мау-Мау"
 ETH_50s_denounce_the_mau_mau_desc: "Мы сделаем ответственный шаг и осудим Мау-Мау."
 ETH_50s_continue_status_quo: "Продолжайте сохранять статус кво"
 ETH_50s_continue_status_quo_desc: "Единственно логично отказаться от ненужных изменений"
 ETH_50s_end_positive_british_relations: "Конец позитивных британских отношений"
 ETH_50s_end_positive_british_relations_desc: "Нам нужно забыть эти бессмысленные отношения с британцами."
 ETH_50s_international_isolation: "Международная изоляция"
 ETH_50s_international_isolation_desc: "Благодаря нашей вполне разумной внешней политике, страны, которые бессмысленно настроены против нас, начали формировать против нас блоки политической изоляции."
 ETH_50s_strengthen_noble_privlidges: "Укрепляйте благородные привилегии"
 ETH_50s_strengthen_noble_privlidges_desc: "Нам нужно укреплять высший класс, они являются нашей опорой и были одобрены Богом."
 ETH_50s_end_positive_french_relations: "Конец позитивных французских отношений"
 ETH_50s_end_positive_french_relations_desc: "Нам нужно положить конец этим бессмысленным отношениям с Францией."
 ETH_50s_continue_somali_suppression: "Продолжать подавление Сомали"
 ETH_50s_continue_somali_suppression_desc: "В наших интересах продолжать сомалийское подавление."
 ETH_50s_harari_suppression: "Подавление Харэра"
 ETH_50s_harari_suppression_desc: "В наших интересах продолжать подавление Харэра."
 ETH_50s_annex_hargesia: "Аннексия Харгейса"
 ETH_50s_annex_hargesia_desc: "У нас есть право применить силу в городе Харгейса и его окрестностях."
 ETH_50s_annex_french_somaliland: "Аннексия Французского Сомалиленда"
 ETH_50s_annex_french_somaliland_desc: "У нас есть право применить силу в городе Харгейс и его окрестностях."
 ETH_50s_international_denouncement: "Международная осуждение"
 ETH_50s_international_denouncement_desc: "В настоящее время мы сталкиваемся с международным осуждением"
 ETH_50s_1955_constitution: "Конституция 1955 года"
 ETH_50s_1955_constitution_desc: "Истеблишмент решил создать новую Конституцию для решения нашей феодальной структуры."
 ETH_50s_education_initiative: "Образовательная инициатива"
 ETH_50s_education_initiative_desc: "Нам нужно бороться с неграмотностью в нашей стране."
 ETH_50s_give_autonomy_to_afar_sultanate: "Автономия Афарскому султанату"
 ETH_50s_give_autonomy_to_afar_sultanate_desc: "Это часть наших недавних соглашений о предоставлении автономии султанату Афар."
 ETH_50s_reign_in_eritrean_autonomy: "Правление в автономии Эритреи"
 ETH_50s_reign_in_eritrean_autonomy_desc: "Нам нужно править в Эритрейской автономии."
 ETH_50s_placate_somali_people: "Успокоить сомалийский народ"
 ETH_50s_placate_somali_people_desc: "Успокоить сомалийский народ."
 ETH_50s_creation_of_lower_assembly: "Создать Нижнюю Ассамблею"
 ETH_50s_creation_of_lower_assembly_desc: "Мы добавим в наш парламент отдельный блок, который обеспечит большее представительство самых разных социальных слоев."
 ETH_50s_creation_of_the_chamber_of_deputies: "Создание Палаты депутатов"
 ETH_50s_creation_of_the_chamber_of_deputies_desc: "Нам нужно создать Палату депутатов, чтобы более конкретно заниматься вопросами нашей нации в ряде отделений."
 ETH_50s_seperation_of_powers: "Разделение властей"
 ETH_50s_seperation_of_powers_desc: "Мы разделим нашу нацию на ряд отдельных держав, которые будут сдерживать силу друг друга... по крайней мере на бумаге."
 ETH_50s_placate_harai_people: "Умиротворение людей Харэра"
 ETH_50s_placate_harai_people_desc: "Принимая во внимание наши недавние действия в регионе Харэра, разумно, что мы, по крайней мере, кажемся, чтобы добавить немного успокоения народу."
 ETH_50s_placate_nobility: "Умиротворение знати"
 ETH_50s_placate_nobility_desc: "Единственно логично умилостивить дворянство нашей нации, ведь их верность важнее всего."
 ETH_50s_lessons_of_the_second_italo_ethiopian_war: "Уроки Второй итало-эфиопской войны"
 ETH_50s_lessons_of_the_second_italo_ethiopian_war_desc: "Из Второй итало-эфиопской войны стало ясно, что наши вооруженные силы не соответствуют военным силам. Крайне важно, чтобы мы исправили основные недостатки нашего командования и вооруженных сил в прошлом."
 ETH_50s_address_the_problem_on_land: "Решить проблему земли"
 ETH_50s_address_the_problem_on_land_desc: "Мы должны решить проблемы и недостатки нашей сухопутной армии."
 ETH_50s_focus_on_army_motorization: "Сосредоточиться на моторизации армии"
 ETH_50s_focus_on_army_motorization_desc: "Нам нужно сосредоточиться на моторизации и механизации нашей армии."
 ETH_50s_focus_on_rocket_artillery: "Сосредоточиться на ракетной артиллерии"
 ETH_50s_focus_on_rocket_artillery_desc: "Нам нужно сосредоточиться именно на ракетной артиллерии."
 ETH_50s_focus_on_army_conscription: "Сосредоточиться на призыве в армию"
 ETH_50s_focus_on_army_conscription_desc: "Нам нужно полагаться на крупные кампании по призыву и значительную численность военнослужащих."
 ETH_50s_depend_on_mass_assault: "Зависит от массового нападения"
 ETH_50s_depend_on_mass_assault_desc: "Благодаря превосходящей численности мы можем сокрушить наших врагов практически в любом сражении."
 ETH_50s_rely_on_superior_firepower: "Положиться на превосходящую огневую мощь"
 ETH_50s_rely_on_superior_firepower_desc: "Мы должны полагаться на превосходящую огневую мощь наших соседей."
 ETH_50s_depend_on_mobile_warfare: "Положиться на мобильную войну"
 ETH_50s_depend_on_mobile_warfare_desc: "С постоянно движущейся линией фронта мы можем окружить и уничтожить наших врагов."
 ETH_50s_a_new_army: "Новая армия"
 ETH_50s_a_new_army_desc: "Мы решили земельные вопросы с нашими сухопутными войсками и создали новую армию."
 ETH_50s_address_the_problem_in_the_air: "Решите проблему в воздухе"
 ETH_50s_address_the_problem_in_the_air_desc: "Мы должны извлечь уроки из нашего опыта неудач в области превосходства в воздухе в предыдущих боях."
 ETH_50s_expand_air_force: "Развивать военно-воздушные силы"
 ETH_50s_expand_air_force_desc: "Нам нужно развивать наши военно-воздушные силы, чтобы конкурировать с любыми врагами."
 ETH_50s_expand_air_defenses: "Развивать противовоздушную оборону"
 ETH_50s_expand_air_defenses_desc: "Более практично вкладывать средства в нашу оборону от наших будущих врагов, чем пытаться конкурировать в размере военно-воздушных сил."
 ETH_50s_anti_air_network: "Противовоздушная сеть"
 ETH_50s_anti_air_network_desc: "Мы создадим противовоздушную сеть."
 ETH_50s_radar_netwrok: "Радиолокационная сеть"
 ETH_50s_us_assisted_transition_to_jet_age: "Переход к эре реактивных двигателей"
 ETH_50s_us_assisted_transition_to_jet_age_desc: "Соединенные Штаты будут помогать нам в нашем переходе к реактивной эре с импортом P-60 Shooting stars и F-86 Sabres."
 ETH_50s_lideta_aviation_school: "Лидетская авиационная школа"
 ETH_50s_lideta_aviation_school_desc: "Мы создадим авиационную школу Лидеты, чтобы лучше обучать наших пилотов."
 ETH_50s_founding_of_the_ethiopian_navy: "Основаnm эфиопский флот"
 ETH_50s_founding_of_the_ethiopian_navy_desc: "Теперь, когда у нас есть выход к Красному морю, основным приоритетом является создание сильного, структурированного флота для патрулирования и защиты нашего побережья."
 ETH_50s_haile_selassie_naval_base: "Военно-морская база Хайле Селассие"
 ETH_50s_haile_selassie_naval_base_desc: "Мы создадим крупную военно-морскую базу Хайле Селассие."
 ETH_50s_establish_a_fleet: "Создать флот"
 ETH_50s_establish_a_fleet_desc: "Мы создадим действующий флот."
 ETH_50s_purchase_american_submarine_chaser: "Купить морских охотников"
 ETH_50s_rehabilitate_italo_eritrean_ships: "Восстановить итало-эритрейские корабли"
 ETH_50s_rehabilitate_italo_eritrean_ships_desc: "Мы восстановим итало-эритрейские корабли."
 ETH_50s_establish_an_admiralty: "Учредить адмиралтейство"
 ETH_50s_establish_an_admiralty_desc: "Мы создадим Адмиралтейство."
 ETH_50s_amhara_naval_academy: "Военно-морская академия Амхары"
 ETH_50s_amhara_naval_academy_desc: "Мы создадим военно-морскую академию Амхара."
 ETH_50s_dahlak_island_radar_station: "Радарная станция острова Дахлак"
 ETH_50s_dahlak_island_radar_station_desc: "Построим радиолокационную станцию острова Дахлак."
