 eth50.1.d: "С тех пор, как Хайле Селассие достиг совершеннолетия, Эфиопия имела широкий и широкий охват внешних связей с Европой. Начиная с 1920-х годов, когда Хайле Селассие, а затем Рас Тафари, отправились в дипломатическое путешествие в такие города как Париж, Брюссель, Амстердам, Стокгольм, Лондон, Женеву и Афины. Во время итало-эфиопской войны и Второй мировой войны Хайле Селассие возглавлял правительство в изгнании в Лондоне и имел крепкие отношения с союзными нациями. С момента обретения независимости Эфиопия продолжает эту политику, и Хайле Селассие в Европе считают харизматичным, симпатичным и эксцентричным дипломатическим лидером."
 eth50.3.d: "Эфиопия находится в трудном положении после Второй мировой войны и второй итало-эфиопской войны. С новым итальянским правительством, имеющим подорванные отношения с Эфиопией и британской гегемонией, будущее эфиопских интересов неясно. Переговоры в комитете Организации Объединенных Наций по деколонизации обсуждают идею присоединения Эритреи к Эфиопии в составе федерации; некоторые считают, что граничащий народ сомалийского мандата должен быть приближен к независимости"
 eth50.5.d: "Центральный комитет США на прошлой неделе потратил сорок минут на то, чтобы поднять вопрос эфиопской администрации по поводу недавних территориальных захватов. Поскольку многие мировые лидеры предлагают санкции и дипломатическое осуждение, можно с уверенностью сказать, что эти недавние события мало чем помогли эфиопским дипломатическим отношениям."
 eth50.6.d: "Предложение США по Резолюции 390-A (V) было подкреплено недавними обсуждениями в центральном комитете США. В резолюции содержится призыв к введению мандата США в Эритрее в качестве федерального государства Эфиопии с его нынешней конституцией."
 eth50.7.d: "Вся Европа и центральный комитет США высказались в поддержку недавней Резолюции 390-A (V), поскольку это разумный конец империалистическим колониальным захватам."
 eth50.8.d: "Сегодня Хайле Селассие под надзором имперского совета подписал Федеральный закон от 1952 года. Этот закон официально инициирует передачу Эритреи от британского контроля Эфиопии. В то время как исполнительный директор Эритреи чувствует давление со стороны Имперской короны, общее настроение в Эритрее изначально положительное."
 eth50.9.d: "Тедла Байру, первый исполнительный директор Эритреи, подал в отставку на прошлой неделе в ответ на политику в отношении эритрейцев в Эфиопской империи. Администрация Аддис-Абебы отменила конституцию Эритреи, запретила официальное использование эритрейского и арабского языков; также отговаривали исламские меньшинства от практики."
 eth50.10.d: "В соответствии с принципом коллективной безопасности, сторонником которого является Хайле Селассие, Эфиопия направила контингент под командованием генерала Мулугета Були и Кеббеде Гебре, известный как батальон Кагнев, для участия в войне в Корее. Он был прикреплен к американской 7-й пехотной дивизии и будет участвовать в крупных боях."
 eth50.11.d: "Сегодня вечером Организация Объединенных Наций направила письменное предложение нашим делегатам в Париже. В предложении содержится призыв к официальному признанию итальянским государством Эфиопии, и, кроме того, Эфиопия представила Экономической комиссии для Италии законопроект на сумму 184 746 023 фунтов стерлингов за ущерб, причиненный в ходе итальянской оккупации. Список включал разрушение 2000 церквей, 535 000 домов, убой или кражу 5 000 000 голов крупного рогатого скота, 7 000 000 овец и коз, 1 000 000 лошадей и мулов и 700 000 верблюдов."
 eth50.12.d: "Делегация Эфиопии в Риме была встречена негативно в то время как были достигнуты договоренности об оплате представленного счета Экономической комиссии для Италии в размере 184 746 023 фунтов стерлингов за ущерб, нанесенный в ходе итальянской оккупации. Список включал разрушение 2000 церквей, 535 000 домов, убой или кражу 5 000 000 голов крупного рогатого скота, 7 000 000 овец и коз, 1 000 000 лошадей и мулов и 700 000 верблюдов."
 eth50.15.d: "В Тигрее произошел голод, в результате которого на сегодняшний день погибло более 100 000 человек: - Хайле Селассие отказывается отправлять какую-либо значительную базовую экстренную продовольственную помощь в провинцию Тигрей, принимая позиции Имперского Совета."
 eth50.16.d: "В конце 40-х годов Эфиопия приобрела в Чехии двадцать чехословацких танкеток АН-IV. Они только недавно прибыли в Джибути, после чего их доставили по железной дороге в Аддис-Абебу."
 eth50.17.d: "Консультативная группа по военной помощи США была направлена в Эфиопию и начала свою работу с реорганизации армии в три дивизии. Подготовка наших войск к стандартам американской армии, а также предоставление стрелкового оружия за разумную оплату."
 ETH_50s_address_ethiopian_feudalism: "Адрес эфиопского феодализма"
 ETH_50s_address_ethiopian_feudalism_desc: "Независимо от того, чего хочет знать, у нас нет другого выбора, кроме как обратиться к феодальной практике в нашей стране."
 ETH_50s_ethiopian_modernization: "Модернизация Эфиопии"
 ETH_50s_ethiopian_modernization_desc: "Нам нужно модернизировать основные элементы нашего общества"
 ETH_50s_further_crackdown_on_slavery: "Дальнейшая ликвидация рабства"
 ETH_50s_further_crackdown_on_slavery_desc: "Хотя рабство было незаконным в Эфиопии с 1930-х годов, его практика по-прежнему широко распространена в сельских районах нашей страны. Нам нужно бороться с этим."
 ETH_50s_address_inner_tribal_wars: "Решение вопроса межплеменных войн"
 ETH_50s_address_inner_tribal_wars_desc: "В южных сельских районах Гамбела и Сидамо распространена практика борьбы между общинами в небольших массовых убийствах из-за этнических различий между общинами. Нам нужно решить эту проблему."
 ETH_50s_modernize_adis_abeba_agriculture: "Модернизация сельского хозяйства в Аддис-Абебе"
 ETH_50s_modernize_adis_abeba_agriculture_desc: "Большая часть прилегающей территории Аддис-Абеба которая обеспечивает сельскохозяйственное производство Центрального нагорья."
 ETH_50s_adis_abeba_gridization: "Электрофикация Аддис-Абебе"
 ETH_50s_adis_abeba_gridization_desc: "В настоящее время в Аддис-Абебе нет инфраструктуры для обеспечения бесперебойного электроснабжения Центрального нагорья. Нам нужно это изменить."
 ETH_50s_harar_gridization: "Электрофикация Харэра"
 ETH_50s_harar_gridization_desc: "Как и Аддис-Абеба, Харэр не может непрерывно обеспечивать электроэнергией своих жителей. Мы изменим это с помощью государственного финансирования."
 ETH_50s_address_harari_autonomy: "Автономия Харэра"
 ETH_50s_address_harari_autonomy_desc: "Последние несколько десятилетий Харэр находился в состоянии относительной автономии из-за отсутствия имперской власти в регионе. Мы должны решить эту проблему."
 ETH_50s_harari_asset_confiscation: "Конфискация активов Харэра"
 ETH_50s_harari_asset_confiscation_desc: "Дворянство Харэра имеет мало влияния при нашем императорском дворе, было бы довольно легко и в наших интересах конфисковать эти активы."
 ETH_50s_continue_harari_suppression: "Продолжать подавление Харэра"
 ETH_50s_continue_harari_suppression_desc: "Более эффективно продолжать подавление харарской культуры и обычаев, чем полностью устранять местную знать."
 ETH_50s_subsidize_harari_development: "Субсидировать развитие Харэра"
 ETH_50s_subsidize_harari_development_desc: "Харэр, как один из наших крупных городов, нуждается в большем развитии за счет Национального финансирования."
 ETH_50s_independence_of_the_Tewahedo_Church: "Независимость церкви Теваэдо"
 ETH_50s_independence_of_the_Tewahedo_Church_desc: "Из-за недавних разногласий с Патриархом Александрии Хайле Селассие встретился с духовенством нашей церкви и решил, что мы должны перестать обращаться к Патриарху Александрии за канонизацией."
 ETH_50s_adis_abeba_university: "Аддис-Абебский университет"
 ETH_50s_adis_abeba_university_desc: "Наша страна нуждается в крупном университете в центре. Аддис-Абеба предоставит нашей стране новую форму класса разведки."
 ETH_50s_relations_with_europe: "Отношения с Европой"
 ETH_50s_relations_with_europe_desc: "Пора расширять наши богатые и обширные отношения с Европой."
