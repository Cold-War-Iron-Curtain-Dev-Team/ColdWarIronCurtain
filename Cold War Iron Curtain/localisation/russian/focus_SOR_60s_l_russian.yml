l_russian:
 SOR_60s_Somali_Armed_Forces: "Сомалийская национальная армия"
 SOR_60s_Somali_Armed_Forces_desc: "До обретения независимости нашей национальной армией была Даравишта Полиска (мобильная группа сомалийских полицейских сил). Теперь мы можем объединить Даравишта с бывшими британскими разведчиками Сомалиленда и создать настоящую армию."
 SOR_60s_Somali_Air_Force: "Сомалийские ВВС"
 SOR_60s_Somali_Air_Force_desc: "Сомалийские военно-воздушные силы, основанные в 1954 году как Сомалийский авиационный корпус, являются нашим основным средством защиты неба."
 SOR_60s_Mogadishu_Air_Defenses: "Воздушная оборона Могадишо"
 SOR_60s_Mogadishu_Air_Defenses_desc: "Мы должны уметь защищать нашу столицу от вражеской авиации."
 SOR_60s_Colonial_British_and_Italian_Aircraft: "Приобрести британских и итальянских бойцов"
 SOR_60s_Colonial_British_and_Italian_Aircraft_desc: "Благодаря нашим тесным отношениям с итальянцами и британцами, мы можем легко купить у них самолеты."
 SOR_60s_Soviet_IL_18s: "Договор о советских самолетах"
 SOR_60s_Soviet_IL_18s_desc: "Больше самолетов для нас."
 SOR_60s_Import_MiG_17s: "Импортировать МиГ-17"
 SOR_60s_Import_MiG_17s_desc: "Мы можем достать несколько истребителей МиГ дешево."
 SOR_60s_Somali_National_Army: "Армия Сомали"
 SOR_60s_Somali_National_Army_desc: "Сухопутные войска - это основа каждой армии."
 SOR_60s_Italian_Weapon_Caches: "Найти тайники с итальянским оружием"
 SOR_60s_Italian_Weapon_Caches_desc: "Во время итальянской оккупации осталось много винтовок. Мы должны найти их и вооружить ими наши войска."
 SOR_60s_International_Advisors: "Запросить международных советников"
 SOR_60s_International_Advisors_desc: ""
 SOR_60s_Military_Modernization: "Военная модернизация"
 SOR_60s_Military_Modernization_desc: ""
 SOR_60s_National_Unity_Government: "Правительство национального единства"
 SOR_60s_National_Unity_Government_desc: "Продажа американского вооружения II"
 SOR_60s_Somali_Navy: "Сомалийский флот"
 SOR_60s_Somali_Navy_desc: "Мы должны создать военно-морской флот для защиты наших национальных вод, особенно нашей исключительной экономической зоны."
 SOR_60s_Establish_Berbera_Naval_Base: "Создание военно-морской базы в Бербере"
 SOR_60s_Establish_Berbera_Naval_Base_desc: "Нам нужен большой порт в регионе Сомалиленд."
 SOR_60s_Establish_Kismayo_Naval_Base: "Создание военно-морской базы Кисмайо"
 SOR_60s_Establish_Kismayo_Naval_Base_desc: "Нам нужны порты возле Могадишо."
 SOR_60s_Soviet_Naval_Advisors: "Пригласить советских военно-морских советников"
 SOR_60s_Soviet_Naval_Advisors_desc: "Советы готовы помочь нам укрепить наш флот и обучить тактике."
 SOR_60s_Merca_Radar_Facility: "Радиолокационная станция Meркa"
 SOR_60s_Merca_Radar_Facility_desc: "Поддержка американской разведки"
 SOR_60s_Integrate_the_Somaliland_Scouts: "Интегрировать разведчиков Сомалиленда"
 SOR_60s_Integrate_the_Somaliland_Scouts_desc: "Разведчики Сомалиленда были обученными британцами подразделениями, отвечающими за оборону Сомалиленда. Поскольку Сомалиленд теперь является частью Сомали, мы можем интегрировать их в наши новые вооруженные силы."
 SOR_60s_syl: "Сомалийская молодежная лига"
 SOR_60s_Somali_National_Congress_Victory: "Победа Сомалийского национального конгресса"
 SOR_60s_Somali_Youth_Leage_Victory_56: "Победа Сомалийской молодежной лиги"
 SOR_60s_Elections_of_1969: "Выборы 1969 года"
 SOR_60s_Somali_National_Congress_Victory_69: "Победа Сомалийского национального конгресса"
 SOR_60s_october_21st: "21 октября"
 SOR_60s_Begin_Integration: "Начать интеграцию"
 SOR_60s_Begin_Integration_desc: "Несмотря на то, что после обретения независимости они объединились в единую нацию, юг и север с институциональной точки зрения представляют собой две отдельные страны. Италия и Соединенное Королевство оставили две страны с отдельными административными, правовыми и образовательными системами, в которых дела велись в соответствии с разными процедурами и на разных языках."
 SOR_60s_the_Establishment_of_the_Somali_National_Congress: "Создание Сомалийского национального конгресса"
 SOR_60s_the_Establishment_of_the_Somali_National_Congress_desc: ""
