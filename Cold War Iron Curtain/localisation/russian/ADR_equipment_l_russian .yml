 #Austria 
  
 ADR_infantry_equipment_0: "Карабин 98 kurz"
 ADR_infantry_equipment_0_short: "Карабин 98к"
 ADR_infantry_equipment_0_desc: "Знаковая винтовка с продольно-скользящим затвором, принятая на вооружение Вермахта в 1935 году в качестве стандартной служебной винтовки. Это была одна из последних разработок в длинной линейке армейских винтовок Маузер. Хотя во время мировой войны ее дополняли полу- и полностью автоматические винтовки II, она оставалась основной немецкой служебной винтовкой до конца войны в 1945 году. Несмотря на растущее количество полуавтоматических и полностью автоматических винтовок, Kar98k продолжает использоваться по обе стороны железного занавеса."
  
 ADR_infantry_equipment_1: "Автомат Калашникова 1947"
 ADR_infantry_equipment_1_short: "АК-47"
 ADR_infantry_equipment_1_desc: "AK47 — полностью автоматическая штурмовая винтовка, разработанная в Советском Союзе Михаилом Калашниковым в 1947 году, но принятая на вооружение только в 1948 году, когда в производство была отправлена ​версия с фиксированным прикладом. В начале 1949 года AK47 был принят Советскими Вооруженными Силами для массового развертывания в передовых частях. Благодаря длинноходному газовому поршню, селектору/предохранителю, автоматическому спусковому механизму и механизму досылания, а также дальнейшим усовершенствованиям общей конструкции АК47 представлял собой обширную модернизацию по сравнению с АК47. СКС. AK47 на протяжении многих лет считался одним из самых надежных и простых в обслуживании видов оружия в мире."
  
 ADR_infantry_equipment_2: "Автомат Калашникова Модернизированный"
 ADR_infantry_equipment_2_short: "АКМ"
 ADR_infantry_equipment_2_desc: "АКМ — это модернизированный вариант автомата АК47, разработанного Михаилом Калашниковым в конце 1950-х годов и принятого на вооружение Советской Армии в 1959 году. Для модернизации армии. Многие детали были упрощены для массового производства, а ствольная коробка из фрезерованной стали была заменена на У-образную стальную штамповку для повышения производительности. Оружие также стало значительно легче в результате упрощений, уменьшивших его вес на 30%. Кроме того, метал был усилен, чтобы сделать его прочнее, и добавлены направляющие для улучшения движения затворной рамы. АКМ немедленно и повсеместно использовался многими странами и производился для конфликтов на протяжении всего срока его службы."
  
 ADR_infantry_equipment_3: "Машиненпистолет Автомат Калашникова-74Н"
 ADR_infantry_equipment_3_short: "МПи-АК-74Н"
 ADR_infantry_equipment_3_desc: "В 1981 году ГДР приобрела лицензию на производство АК-74, после чего в оружие был внесен ряд изменений. Новый образец получил индекс MPi AK-74N. Изменения заключались в изготовлении нового приклада и цевье из серо-голубого (реже темно-коричневого) пластика.Приклад имел характерную точечную структуру.Вариант со складным прикладом получил вариант МПи АКС-74Н.Также был разработан автомат МПи АК-74НК, отличающийся укороченный ствол."
  
 ADR_infantry_equipment_4: "Машиненпистолет КМ-90"
 ADR_infantry_equipment_4_short: "МПи-90"
 ADR_infantry_equipment_4_desc: "Создание Wieger MPi-90 - это попытка Восточной Германии разработать собственную систему стрелкового оружия, независимую от Советского Союза, но на базе АК-74 под патрон 5,56x45 мм НАТО."
  
  
  ########## NEW ADR ARMOR 
 ADR_lt_equipment_1: "Штейр АДГЗ"
 ADR_lt_equipment_1_short: "АДГЗ"
 ADR_lt_equipment_2: "Т-70"
 ADR_lt_equipment_2_short: "Т-70"
 ADR_lt_equipment_2_desc: "Легкий танк Т-70 был танком-разведчиком времен Второй мировой войны, созданным для замены ПТ60. Николай Астров начал работу сразу после ПТ60 и закончил в 1942 году. За 2 года его производства было выпущено 8300 штук. 45-мм пушка была намного крупнее, оснащалась двумя двигателями ГАЗ-202 и могла развивать скорость до 45 км / ч. Т-70 также имел номинально улучшенные оптические возможности. Он широко использовался во время Второй мировой войны."
 ADR_lt_equipment_3: "ПТ-76"
 ADR_lt_equipment_3_short: "ПТ-76"
 ADR_lt_equipment_3_desc: "ПТ76 — это советский легкий плавающий танк, который широко экспортировался по всему миру. Он был разработан Н. Шашмыриным и Ж. Котиным в 1951 году, и было произведено около 12 000 единиц. Он требует экипажа из 3 человек и рядного шестицилиндрового двигателя V6. со скоростью 44 км/ч и может плавать со скоростью 10 км/ч. он до сих пор используется во многих странах благодаря своей знаменитой надежности и простоте обслуживания."
 ADR_lt_equipment_4: "ПТ-76Б Модель 4"
 ADR_lt_equipment_4_short: "ПТ-76Б"
 ADR_lt_equipment_4_desc: "ПТ-76, вооруженный 76,2-мм нарезной танковой пушкой Д-56ТС (двойной дульный тормоз, эжектор гильз, дымосос и двухкоординатная система стабилизации СТП-2П "Заря"),[4] ПАЗ ( противоатомная защита) система РХБ защиты, автоматическая система пожаротушения, улучшенный прицел ТШК-2-66, фильтровентиляционная система, улучшенные приборы наблюдения, улучшенное электрооборудование, новый 6-цилиндровый 4-тактный рядный двигатель В-6Б дизельный двигатель водяного охлаждения мощностью 263 л.с. (196 кВт) при 1800 об/мин и дополнительные внутренние топливные баки, для чего пришлось несколько изменить форму брони."
 ADR_lt_equipment_5: "БРМ-1К"
 ADR_lt_equipment_5_short: "БРМ-1К"
 ADR_lt_equipment_5_desc: "БРМ-1К — советская разведывательная машина конца холодной войны. Она была разработана для поддержки бронетанковых и механизированных формирований советских войск. БРМ-1К предназначалась для разведки маршрутов и обнаружения вражеских формирований."
 ADR_lt_equipment_6: "БРМ-3К"
 ADR_lt_equipment_6_short: "БРМ-3К"
 ADR_lt_equipment_6_desc: "БРМ-3К "Рысь" была разработана в начале 1990-х годов. Она предназначалась для дополнения и замены разведывательной машины БРМ-1К. Базируется на шасси боевой машины пехоты БМП-3. Хотя официально БРМ-3К принятый на вооружение Российской Армии еще в 1995 году, он до сих пор находится в мелкосерийном производстве."
  
 ADR_mbt_equipment_0: "Panzerkampfwagen IV"
 ADR_mbt_equipment_0_short: "Танковый IV"
 ADR_mbt_equipment_1: "Т-34-85М"
 ADR_mbt_equipment_1_short: "Т-34-85М"
 ADR_mbt_equipment_2: "Т-54"
 ADR_mbt_equipment_2_short: "Т-54"
 ADR_mbt_equipment_2_desc: "Танк Т-54 был самым массовым танком в истории. Танк был разработан в 1946 году ХКБМ. Сам танк оснащен 100-мм нарезной пушкой и имеет различную толщину брони от 205 до 60 мм. Сам двигатель представляет собой дизельный двигатель V-12 объемом 38,88 л, а танк использует торсионную подвеску и способен развивать скорость до 48 км / ч. Сам танк использовался более чем в 50 армиях мира и производился на всей советской территории и во всех странах мира. их конфликты вместе с ним."
 ADR_mbt_equipment_3: "Т-55"
 ADR_mbt_equipment_3_short: "Т-55"
 ADR_mbt_equipment_3_desc: "Т-55 является усовершенствованной версией танка Т-54. ОКБ-520 доработало конструкцию Т-55, улучшив защиту от РХБ, придав ему более оптимизированный двигатель, улучшив форму башни и даже добавив дополнительные вспомогательные оборудование, такое как улучшенное управление огнем и оптика. Кроме того, Т-55 чаще использовал крупнокалиберный пулемет ДШК калибра 12,7, тогда как Т-54 использовал орудие СГМТ калибра 7,62, что придавало ему большую огневую мощь, но не позволяло нести больше боеприпасов. использовался в стольких же армиях и типично видел все конфликты, которые видел Т-54."
 ADR_mbt_equipment_4: "Т-62"
 ADR_mbt_equipment_4_short: "Т-62"
 ADR_mbt_equipment_4_desc: "Т-62 является дальнейшим развитием танка Т-55. Т-62 использует гладкоствольную пушку и имеет немного более толстую броню. Основное орудие также было увеличено до 115 мм. Первоначально он был заказан Советским Союзом. в попытке улучшить свою огневую мощь, и ОКБ-520 завершило проект примерно в 1960 г. Несмотря на улучшение, производство не было прекращено, поскольку его стоимость была номинально выше, чем у Т-55. Более 22 700 Т-62 были выпущены произведен, и он участвовал в большом количестве боев на территории СССР, но участвовал в конфликтах в основном на Ближнем Востоке. Его усовершенствования продемонстрировали немного большую боеспособность в 1969 году в китайско-советском пограничном конфликте."
 ADR_mbt_equipment_5: "Т-62М"
 ADR_mbt_equipment_5_short: "Т-62М"
 #ADR_mbt_equipment_5_desc: ""
 ADR_mbt_equipment_6: "Т-72"
 ADR_mbt_equipment_6_short: "Т-72"
 ADR_mbt_equipment_6_desc: "Т-72 — советский ОБТ, созданный как танк нового поколения, в основном для замены Т-62 и его дорогого аналога Т-64. Он стоил почти вдвое дешевле Т-64 и комплектовался обширные усовершенствования. Его конструкция была завершена в 1973 году Леонидом Венедиктовым и показала невероятные возможности. Орудие и броня по-прежнему были 125-мм и составными соответственно, но с гораздо более экономически целесообразной конструкцией, которую было проще производить. Двигатель - В-12 780 л.с. который впоследствии можно было переоборудовать в конструкцию мощностью 1130 л. -64, а также продемонстрировал в них невероятные возможности. Танк также неоднократно применялся в конфликтах за пределами Африки, Ближнего Востока и Индокитая."
