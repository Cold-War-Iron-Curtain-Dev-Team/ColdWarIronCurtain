 ADR_jet_CAS_equipment_1: "Ильюшин Ил-10М"
 #ADR_jet_CAS_equipment_1_desc: ""
 ADR_jet_CAS_equipment_1_short: "Ил-10М"
 ADR_jet_CAS_equipment_2: "Микоян-Гуревич МиГ-17бис"
 ADR_jet_CAS_equipment_2_desc: "Конверсия истребителя-бомбардировщика, оснащенного неуправляемыми ракетами и бомбами."
 ADR_jet_CAS_equipment_2_short: "МиГ-17бис"
 ADR_jet_CAS_equipment_3: "Микоян-Гуревич МиГ-19С"
 ADR_jet_CAS_equipment_3_desc: "Вариант истребителя-бомбардировщика с цельноповоротным плитчатым хвостовым оперением. Оснащен приемником дальней навигации "Свод" и вооружен тремя 30-мм пушками НР-30. Предусмотрен для установки реактивной неуправляемой ракетной установки ОРО-32К или ФАБ-250. бомбы под каждым крылом, а с 1957 года модифицировали, чтобы можно было нести четыре ракетных блока."
 ADR_jet_CAS_equipment_3_short: "МиГ-19С"
 ADR_jet_CAS_equipment_4: "Сухой Су-7Б"
 ADR_jet_CAS_equipment_4_desc: "Бомбардировочный вариант Су-7 "Слесарь-А" впервые поднялся в воздух в марте 1959 г., позже поступил на вооружение в 1961 г. Он стал основным советским штурмовиком 1960-х гг. С 1957 по 1972 г. более 1400 самолетов. Были построены Су-7Б, многие из которых были экспортированы. Самолет был относительно популярен за границей, обслуживался в 10 странах. Он широко использовался как в ВВС Индии, так и в ВВС Египта. Самолет остается на ограниченной службе в Северной Корее."
 ADR_jet_CAS_equipment_4_short: "Су-7Б"
 ADR_jet_CAS_equipment_5: "Сухой Су-7БКЛ"
 ADR_jet_CAS_equipment_5_desc: "Модернизированный двигатель АЛ-7Ф-1, модернизированная топливная система с внешними трубопроводами по обе стороны от хребта фюзеляжа, топливные баки установлены в крыльях, "мокрые" подкрыльные узлы подвески для подвесных топливных баков, способные нести тактические ядерные бомбы ."
 ADR_jet_CAS_equipment_5_short: "Су-7БКЛ"
 ADR_jet_CAS_equipment_6: "Сухой Су-20"
 ADR_jet_CAS_equipment_6_desc: "Сухой Су-17 Fitter-C был дальнейшим развитием советского штурмовика Су-7Б. Су-17 широко экспортировался в ВВС стран Восточного блока, арабских стран и Южной Америки. Улучшенный Су-17 почти во всех аспектах своего предшественника, включая датчики, летные характеристики, полезную нагрузку, дальность полета и изменяемую стреловидность крыла. С 1969 по 1990 год было произведено и использовалось 2867 самолетов в 30 странах, 6 из которых используют эти самолеты до сих пор."
 ADR_jet_CAS_equipment_6_short: "Су-20"
 ADR_jet_CAS_equipment_7: "Микоян-Гуревич МиГ-27М"
 ADR_jet_CAS_equipment_7_desc: "МиГ-27 "Флоггер" — советский штурмовик с крылом изменяемой стреловидности. Самолет создан на базе МиГ-23, но оптимизирован для штурмовиков. В отличие от МиГ-23, МиГ-27 не получил широкого распространения за пределами СССР. В 1970-1986 годах было произведено 1075 самолетов. МиГ-27 использовался на более поздних этапах советско-афганской и Каргильской войн. Самолет остается на ограниченной службе в Индии и Казахстане."
 ADR_jet_CAS_equipment_7_short: "МиГ-27М"
  
 ADR_jet_CAS_equipment_8: "Сухой Су-25К"
 ADR_jet_CAS_equipment_8_desc: "Сухой Су-25 "Лягушка" - двухмоторный штурмовик, разработанный в Советском Союзе. Самолет совершил свой первый полет в 1975 году и был принят на вооружение в 1981 году. С 1978 года было произведено более 1000 самолетов. популярный за рубежом самолет, продаваемый в 29 стран. Из-за этого Су-25 участвовал в нескольких конфликтах, в частности, в советско-афганской, ирано-иракской войнах и войнах в Персидском заливе. Сегодня самолет остается на вооружении всех стран-экспортеров."
 ADR_jet_CAS_equipment_8_short: "Су-25К"
  
 ADR_cas_stealth_equipment_1: "Сухой Су-25СМ"
 ADR_cas_stealth_equipment_1_short: "Су-25СМ"
 ADR_cas_stealth_equipment_1_desc: "Су-25СМ" (Строевой модернизированный) - это программа "доступной" модернизации Су-25, задуманная российскими ВВС в 2000 году. Программа возникла после попыток модернизации Су-25Т и Су-25ТМ, которые были оценены и названы слишком сложными и дорогими. Модернизация Су-25СМ включает в себя усовершенствование авионики и реконструкцию планера, что позволит продлить срок службы "лягушатника" на 500 летных часов или 5 лет. Совершенно новый навигационно-атакующий комплекс ПРНК-25СМ "Барс" построен на базе цифровой вычислительной системы БЦВМ-90, изначально запланированной для программы модернизации Су-25ТМ. Точность навигации и атаки, обеспечиваемая новым комплексом, в три раза выше, чем у базового Су-25, и, как сообщается, находится в пределах 15 м с использованием спутниковой коррекции и 200 м без нее."
  
 ADR_jet_tac_bomber_equipment_1: "Ильюшин Ил-22"
 ADR_jet_tac_bomber_equipment_1_short: "Ил-22"
 ADR_jet_tac_bomber_equipment_1_desc: "Ильюшин Ил-22 был первым советским реактивным бомбардировщиком, совершившим полет. В нем использовались четыре ТРД Люлька ТР-1, установленные на коротких горизонтальных пилонах впереди и под крылом. расход топлива был выше, чем планировалось. Эти проблемы привели к тому, что самолет не смог достичь требуемых характеристик, и 22 сентября 1947 года он был списан ."
 ADR_jet_tac_bomber_equipment_2: "Ильюшин Ил-28"
 ADR_jet_tac_bomber_equipment_2_short: "Ил-28"
 ADR_jet_tac_bomber_equipment_2_desc: "Ил-28 был турбореактивным средним бомбардировщиком, разработанным сразу после окончания Второй мировой войны для советских ВВС. Первый реактивный бомбардировщик, запущенный в крупносерийное производство, Ил-28, введенный в эксплуатацию в 1950 году, служил во многих крупных конфликтах холодной войны, от Вьетнама и советско-афганской войны до Суэцкого конфликта и войны в Биафре. в этот день. В отчетах ВВС США / Министерства обороны США указано название «Тип 27», а кодовое имя НАТО - «Бигль."
 ADR_jet_tac_bomber_equipment_3: "Яковлев Як-28Б"
 ADR_jet_tac_bomber_equipment_3_short: "Як-28Б"
 ADR_jet_tac_bomber_equipment_3_desc: "Як-28 разрабатывался как боевой самолет со стреловидным крылом, представленный в 1960 году. Варианты бомбардировщика Як-28, известные под кодовым названием НАТО Брюэр, имели двигатели, установленные в гондоле, как и Як-25 "Фонарик". С этим и стреловидным крылом это был высокодозвуковой самолет, который мог развивать околозвуковые скорости на большой высоте.Он служил основным легким бомбардировщиком советских ВВС и в основном использовался Россией, Беларусью и Туркменистан после распада Советского Союза, все они вышли на пенсию к 1992 году."
 ADR_jet_tac_bomber_equipment_4: "Яковлев Як-28И"
 ADR_jet_tac_bomber_equipment_4_short: "Як-28И"
 ADR_jet_tac_bomber_equipment_4_desc: "Улучшенная версия с внутренней системой наведения "Инициатива-2" 360-градусной РЛС картографирования местности вместе с наземной системой наведения с использованием триангуляции от наземных передатчиков."
 ADR_jet_tac_bomber_equipment_5: "Микоян-Гуревич МиГ-25РБТ"
 ADR_jet_tac_bomber_equipment_5_short: "МиГ-25РБС"
 ADR_jet_tac_bomber_equipment_5_desc: "МиГ-25РБС представляет собой одноместный бомбардировщик-разведчик, производный от МиГ-25Р, оснащенный усовершенствованными системами разведки и системой автоматического бомбометания "Пеленг". Самолет может нести восемь бомб по 500 кг (1102 фунта)."
 ADR_jet_tac_bomber_equipment_6: "Сухой Су-24"
 ADR_jet_tac_bomber_equipment_6_short: "Су-24"
 ADR_jet_tac_bomber_equipment_6_desc: "Большой истребитель-бомбардировщик, разработанный Советским Союзом в 1960-х годах, который используется до сих пор. Его характеристики включают изменяемые крылья и острый корпус. для наземных ракет, сохраняя при этом стабильную скорость. Этот самолет известен под кодовым названием НАТО «Фехтовальщик." Вместе со своим преемником Су-34 в настоящее время он используется в качестве истребителя-бомбардировщика для стран бывшего Восточного лагеря."
 ADR_jet_tac_bomber_equipment_7: "Сухой Су-24"
 ADR_jet_tac_bomber_equipment_7_short: "Су-24М"
 ADR_jet_tac_bomber_equipment_7_desc: "Поступивший на вооружение в 1983 году, Су-24М стал дальнейшим развитием Су-24 с момента принятия на вооружение первого типа. Одной из основных особенностей Су-24М является возможность дозаправки топливом в воздухе с выдвижной заправочный зонд, новая внутренняя навигационная система и лазерный целеуказатель «Кайра-24», позволяющий использовать бомбы с точным наведением. На Западе он известен как «Фехтовальщик-Д."
 #ADR_jet_tac_bomber_equipment_8: "Sukhoi Su-34"
 #ADR_jet_tac_bomber_equipment_8_short: "Su-34"
 #ADR_jet_tac_bomber_equipment_8_desc: "An attacker developed based on the Su-27 with a tandem seat cockpit. It exhibits top class maneuverability for an attacker, with its agile movements competing aggressively with fighters of the same class. Thicker armor also increases its survival rate. The NATO codename is the "Fullback". Assuming attack missions over an extended period of time, the rear section of pilot seats has a basin and a simple kitchen."
  
  
