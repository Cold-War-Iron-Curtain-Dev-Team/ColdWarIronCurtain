 ADR_jet_multirole_equipment_1: "Микоян-Гуревич МиГ-9"
 ADR_jet_multirole_equipment_1_desc: "МиГ-9 "Фарго" был первым реактивным самолетом, разработанным Микояном после Второй мировой войны. Представлен в 1948 году. Он имел ограниченное боевое и учебное применение во время Гражданской войны в Китае и Корейской войны. Всего было произведено 610 самолетов, исключительно СССР. Последние МиГ-9 были списаны КНР в 1951 году."
 ADR_jet_multirole_equipment_1_short: "МиГ-9"
 ADR_jet_multirole_equipment_2: "Микоян-Гуревич МиГ-15"
 ADR_jet_multirole_equipment_2_desc: "Возможно, один из самых знаковых истребителей холодной войны, МиГ-15 "Фагот" Микояна-Гуревича поступил на вооружение в 1947 году. достойный противник американским F-86 Sabre и F9F Panther. Участок корейско-китайской границы получил прозвище Аллея МиГов из-за их преобладания в этом районе. Более 18 000 МиГ-15 были построены и использовались многими странами, в первую очередь СССР и страны Восточного блока. Хотя большинство самолетов было выведено из эксплуатации в 1950-х годах, некоторые из них до сих пор остаются на вооружении ВВС Северной Кореи."
 ADR_jet_multirole_equipment_2_short: "МиГ-15"
 ADR_jet_multirole_equipment_3: "Микоян-Гуревич МиГ-17"
 ADR_jet_multirole_equipment_3_desc: "Прямой преемник МиГ-15 "Фагот". С 1952 года было произведено более 10 000 МиГ-17 Fresco. МиГ-17 производился по лицензии в НОАК как Shenyang J-5. Всего МиГ использовалось 20 странами. -17, охватывая Африку, Европу и Азию. Его первое боевое применение было в 1958 году, когда МиГи КНР столкнулись с националистическими китайскими F-86 Sabre над Тайваньским проливом. Однако МиГ-17 в основном использовался во Вьетнамской войне с NVAF. и ВВС НОАК, где он одержал 28 воздушных побед.МиГ-17 был настолько успешным, что даже выстоял против гораздо более современных, сверхзвуковых американских истребителей Phantom II во время войны во Вьетнаме.МиГ-17 вообще был выведен из эксплуатации в 1970-х годах, в то время как он до сих пор находится в ограниченном количестве в некоторых африканских странах и Северной Корее."
 ADR_jet_multirole_equipment_3_short: "МиГ-17"
 ADR_jet_multirole_equipment_4: "Микоян-Гуревич МиГ-19"
 ADR_jet_multirole_equipment_4_desc: "МиГ-19 был первым советским серийным самолетом, способным развивать сверхзвуковую скорость в горизонтальном полете. Сопоставимым американским истребителем "Century Series" был североамериканский F-100 Super Sabre, хотя МиГ-19 в основном воевал против более современные McDonnell Douglas F-4 Phantom II и Republic F-105 Thunderchief над Северным Вьетнамом."
 ADR_jet_multirole_equipment_4_short: "МиГ-19"
 ADR_jet_multirole_equipment_5: "Микоян-Гуревич МиГ-21Ф-13"
 ADR_jet_multirole_equipment_5_desc: "МиГ-21 "Фишбед" считается одним из первых советских истребителей третьего поколения, оснащенных ракетами дальнего радиуса действия и импульсным радаром. Китай и Индия по лицензии.Было построено более 11 000 самолетов, служивших в более чем 60 странах на 5 континентах.За время своего существования МиГ-21 сбили 240 самолетов.МиГ-21 участвовал во многих конфликтах,в том числе во Вьетнаме (где он видел огромные успех), индо-пакистанская война 1971 года, ирано-иракская война и множество более мелких конфликтов. Он остается на вооружении спустя более 6 десятилетий."
 ADR_jet_multirole_equipment_5_short: "МиГ-21Ф-13"
 ADR_jet_multirole_equipment_6: "Микоян-Гуревич МиГ-21ПФ"
 ADR_jet_multirole_equipment_6_desc: "Серийный вариант всепогодного перехватчика. Они оснащались ТРД Р11Ф2-300 и, начиная с седьмой серийной партии, оснащались РЛС РП-21 (в первых шести партиях использовалась более старая РЛС ЦД-30Т). (он же РП-9-21).Кроме того, система управления вооружением была изменена по сравнению с F-13, чтобы позволить использовать зенитный ракетный комплекс РС-2УС (он же К-5МС) с лучевым наведением в дополнение к К с ИК-наведением. -13"
 ADR_jet_multirole_equipment_6_short: "МиГ-21ПФ"
 ADR_jet_multirole_equipment_7: "Микоян-Гуревич МиГ-23М"
 ADR_jet_multirole_equipment_7_desc: "МиГ-23 был первым советским истребителем, оснащенным радаром "взгляд вниз/снижение", и одним из первых, вооруженным ракетами дальнего радиуса действия. Производство началось в 1969 году и достигло больших объемов - было построено более 5 000 самолетов, что сделало его самым производимым самолетом с изменяемой стреловидностью крыла в истории. Сегодня МиГ-23 остается в ограниченном количестве на вооружении некоторых экспортных заказчиков."
 ADR_jet_multirole_equipment_7_short: "МиГ-23М"
 ADR_jet_multirole_equipment_8: "Микоян-Гуревич МиГ-23МЛ"
 ADR_jet_multirole_equipment_8_desc: "Ранние варианты "Флоггера" имели ряд конструктивных недостатков, включая прочность и надежность планера, характеристики двигателя, маневренность и радиолокационные характеристики. В результате была проведена значительная доработка конструкции планера, в результате чего появился МиГ-23МЛ."
 ADR_jet_multirole_equipment_8_short: "МиГ-23МЛ"
 ADR_jet_multirole_equipment_9: "Микоян-Гуревич МиГ-23МЛД"
 ADR_jet_multirole_equipment_9_desc: "МиГ-23МЛД был окончательным вариантом истребителя МиГ-23. Основным направлением модернизации было улучшение маневренности, особенно на больших углах атаки, что было определено как главный недостаток МиГ-23М/МЛ. Стрела Пито была оснащена вихревыми генераторами, а зазубренные корни передней кромки крыла были "распилены", чтобы также служить вихревыми генераторами. Система управления полетом включала синтетическое устройство "стик-стоп"/ограничитель сигналов SOS-3-4."
 ADR_jet_multirole_equipment_9_short: "МиГ-23МЛД"
 ADR_jet_multirole_equipment_10: "Микоян-Гуревич МиГ-29А"
 ADR_jet_multirole_equipment_10_desc: "МиГ-29 Fulcrum A изначально был разработан ОКБ Микояна. Это был первый истребитель 4-го поколения, поступивший на вооружение СССР и стран Восточного блока. Он отличался улучшенной авионикой и значительно улучшенными радиолокационными возможностями. Первые МиГ-29 использовались Варшавским договором в качестве учебных с ограниченным экспортом в Индию, но имели ограниченное боевое применение. МиГ-29 позже стал базой для широко производимых вариантов, таких как МиГ-29С, МиГ-29М и МиГ-35."
 ADR_jet_multirole_equipment_10_short: "МиГ-29А"
  
 ADR_mr_stealth_fighter_equipment_1: "Микоян МиГ-29М"
 ADR_mr_stealth_fighter_equipment_1_short: "МиГ-29М"
 ADR_mr_stealth_fighter_equipment_1_desc: "Самолет МиГ-29М/М2 является модификацией базового МиГ-29. Он обладает более надежной многоцелевой функциональностью за счет расширенного использования высокоточного оружия класса "воздух-воздух" и "воздух-земля". Он также отличался значительно увеличенной боевой дальностью за счет увеличения внутреннего запаса топлива. - весовое соотношение. Геометрия впускных рамп была изменена, верхние воздухозаборные жалюзи были удалены, чтобы освободить место для большего количества топлива в LERX, введены сетчатые экраны для предотвращения повреждения посторонними предметами (FOD), а размеры впуска были увеличены для более высокого потока воздуха ."
  
