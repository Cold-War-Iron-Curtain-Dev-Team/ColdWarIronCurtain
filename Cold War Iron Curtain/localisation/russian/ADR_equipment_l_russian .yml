 ADR_recon_equipment_0: "Туполев Ту-2Р"
 ADR_recon_equipment_0_short: "Ту-2Р"
 ADR_recon_equipment_0_desc: "Разведывательный вариант Ту-2."
 ADR_jet_recon_equipment_0: "Микоян-Гуревич МиГ-15Рбис"
 ADR_jet_recon_equipment_0_short: "МиГ-15Рбис"
 ADR_jet_recon_equipment_0_desc: "В 25 апреля 1950 года ОКБ МиГ начало разработку фронтового разведывательного варианта МиГ-15 с фотоаппаратом АФА-БА/40, обеспечивающего съемку полосы шириной от 0,9 до 4,5 км при длине маршрута фотографирования от 90 до 450 км на высотах от 2000 до 10000м. На самолете была установлена только одна пушка НР-23. Для увеличения дальности полета разведчика впоследствии на балках были установлены замки Д4-50, что позволило подвесить под крылом 600-литровые топливные баки улучшенной формы. Кроме того, на машине был установлен транспондер "Барий-М" и дополнительный 2-литровый кислородный баллон."
 ADR_jet_recon_equipment_1: "Микоян-Гуревич МиГ-25РБ"
 ADR_jet_recon_equipment_1_short: "МиГ-25РБ"
 ADR_jet_recon_equipment_1_desc: "МиГ-25РБ - одноместный всевысотный оперативно-разведывательный самолет-бомбардировщик. Испытания завершены в декабре 1970 г. Самолет был оснащен 2-4 камерами общей разведки А-70М и одной топографической АФА-Э/10. Фотоаппаратура размещалась в пяти отсеках, расположенных в нижней части носовой части фюзеляжа. Также устанавливалась станция радиотехнической разведки СПС-4А или Б "Вираж", работающая в разных диапазонах частот. Специальное оборудование - станция активных радиопомех СПС-141"
 ADR_jet_recon_equipment_2: "Сухой Су-24МР"
 ADR_jet_recon_equipment_2_short: "Су-24МР"
 ADR_jet_recon_equipment_2_desc: "Специализированный тактический разведывательный вариант. Су-24МР сохраняет большую часть навигационного комплекса Су-24М, в том числе РЛС слежения за местностью, но убирает штурмовой РЛС "Орион-А", лазерную/телевизионную систему и пушку в пользу двух панорамных фотоустановок: телекамеры «Аист-М» («Аист»), РЛС бокового обзора (БРЛР) РДС-БО «Штик» («Штык») и инфракрасной разведки «Зима» системы. Другие датчики переносятся в форме капсулы."
  
 ADR_heavy_fighter_equipment_1: "Яковлев Як-9"
 ADR_heavy_fighter_equipment_1_short: "Як-9"
 ADR_heavy_fighter_equipment_1_desc: "Як-9 имел укороченную хвостовую часть фюзеляжа с фонарем кругового обзора. Его более легкая металлическая конструкция позволила увеличить запас топлива и вооружение по сравнению с предыдущими моделями, построенными из дерева. Як-9 был маневренен на высоких скоростях. скорость на малых и средних высотах и ​​легкость в управлении, что сделало его одним из самых массовых советских истребителей Второй мировой войны."
 ADR_heavy_fighter_equipment_2: "Петляков Пе-3"
 ADR_heavy_fighter_equipment_2_short: "Пе-3"
 ADR_heavy_fighter_equipment_2_desc: "Являясь дальнейшим развитием Пе-2, Пе-3 был специализированным ночным истребителем, когда он был представлен в 1941 году, в том же году, что и его конюшня, Пе-2. те, что были захвачены немецкими Люфтваффе с Junkers Ju 88 и британскими Королевскими ВВС с De Havilland Mosquito. С отличием использовались во время битвы за Москву и несмотря на то, что единственный завод, ответственный за создание этого типа, был эвакуирован в результате битвы. , Пе-3 использовался на протяжении всего конфликта, а более поздние производственные циклы были посвящены созданию разведывательных вариантов этого типа."
 ADR_heavy_fighter_equipment_3: "Лавочкин Ла-11"
 ADR_heavy_fighter_equipment_3_short: "Ла-11"
 ADR_heavy_fighter_equipment_3_desc: "Разработанный в 1947 году, после окончания Второй мировой войны, Ла-11 был дальнейшим развитием Ла-9 "Фриц" для создания дальнего эскортного истребителя. удобствами для длительных полетов, такими как увеличенная обивка сиденья, подлокотники, писсуар.Кроме того, был установлен полный радионавигационный комплекс.Неудивительно, что боевые характеристики с полной заправкой страдали.Однако по мере того, как загрузка топлива приближалась к Ла-9, как и производительность. Пилоты Ла-11 на советской, а затем и на китайской службе служили в противовоздушной обороне, сбивая американские «Мустанги» и штурмовики во время Корейской войны. Его имя в отчетах НАТО - ФАН."
  
 ADR_jet_interceptor_equipment_1: "Яковлев Як-17"
 ADR_jet_interceptor_equipment_1_desc: "Як-17 впервые был представлен публике на Дне советской авиации 1949 года на аэродроме Тушино. В эксплуатации Як-17 имел большинство тех же недостатков, что и его предшественник, включая относительно низкую скорость и дальность полета, а также ненадежный двигатель (все еще основанный на немецком Junkers Jumo 004) со сложной процедурой запуска.С другой стороны, его управление было очень простым и похожим на популярные винтовые истребители, такие как Як-3 и Як-9.Это сделало его отличная переходная машина к реактивным истребителям."
 ADR_jet_interceptor_equipment_1_short: "Як-17"
 ADR_jet_interceptor_equipment_2: "Лавочкин Ла-15"
 ADR_jet_interceptor_equipment_2_desc: "Лавочкин Ла-15 "Веерохвост" был принят на вооружение ВВС СССР в 1949 году. Хотя технологически этот самолет превосходил МиГ-15, более низкая стоимость производства МиГ-15 означала, что ему отдавалось предпочтение. участвовал в боевых действиях и имел ограниченное применение. 235 произведенных самолетов были выведены из эксплуатации к 1953 году. С них сняли двигатели и использовали для испытаний ядерного оружия."
 ADR_jet_interceptor_equipment_2_short: "Ла-15"
 ADR_jet_interceptor_equipment_3: "Микоян-Гуревич МиГ-17ПФ"
 ADR_jet_interceptor_equipment_3_desc: "Всепогодный вариант истребителя-перехватчика с РЛС "Изумруд", 3 х 23-мм пушками НР-23 и двигателем ВК-1Ф."
 ADR_jet_interceptor_equipment_3_short: "МиГ-17ПФ"
 #ADR_jet_interceptor_equipment_4: "Sukhoi Su-9"
 #ADR_jet_interceptor_equipment_4_desc: "The Sukhoi Su-9 Fishpot was a delta winged Soviet all-weather interceptor developed in the 1950's. The Su-9 made its first complete flight on the 24th of June 1956, entering service 3 years later in 1959. The aircraft was exclusively operated by the 894th Fighter Aviation Regiment of the Soviet Air Force and never saw active combat. The last of the 1150 aircraft manufactured left service in 1979"
 #ADR_jet_interceptor_equipment_4_short: "Su-9"
 #ADR_jet_interceptor_equipment_5: "Sukhoi Su-11"
 #ADR_jet_interceptor_equipment_5_desc: "The Su-11 was an upgraded version of the Sukhoi Su-9 ('Fishpot') interceptor, which had been developed in parallel with the OKB's swept wing Su-7 fighter bomber. Recognizing the Su-9's fundamental limitations, Sukhoi began work on the Su-11."
 #ADR_jet_interceptor_equipment_5_short: "Su-11"
 #ADR_jet_interceptor_equipment_6: "Sukhoi Su-15"
 #ADR_jet_interceptor_equipment_6_desc: "The Sukhoi Su-15 Flagon A was a twinjet interceptor developed by the Soviet Union in the 1960s. The aircraft made its first flight in mid-1962 and, 3 years later entered service with the Soviet Air Force in 1965. From 1965-1979 1290 aircraft were produced. The aircraft also saw service in the Ukrainian Air Force and limited, emergency service in the Russian Air Force. It was officially retired from service in 1996."
 #ADR_jet_interceptor_equipment_6_short: "Su-15"
 #ADR_jet_interceptor_equipment_7: "Mikoyan-Gurevich MiG-25P"
 #ADR_jet_interceptor_equipment_7_desc: "The Mikoyan-Gurevich MiG-25 Foxbat is perhaps, one of the most influential Soviet Aircraft in history. The first MiG-25 prototype took flight in early 1964, officially entering service in 1970. Throughout its lifetime over 1150 aircraft were constructed and sold to numerous nations, including Syria, Iraq and India. The aircraft was designed to rapidly intercept extreme high altitude aircraft like the U-2 and B-58 with blistering speed. The aircraft gave the Soviet Union far superior control over their own, remote airspace than any time before. It is still in limited service with the Russian Air Force today."
 #ADR_jet_interceptor_equipment_7_short: "MiG-25P"
 #ADR_jet_interceptor_equipment_8: "Mikoyan-Gurevich MiG-31"
 #ADR_jet_interceptor_equipment_8_desc: "The MiG-31 Foxhound is the direct successor to the MiG-25 and was designed as a comprehensive replacement. The aircraft shares most design elements with the MiG-25 featuring mostly internal changes. The MiG-31 has 2 seats and superior sensors and engines, the cockpit was also modernized to support a heads-up display and newer air-to-air missile systems. From 1975-1994 519 MiG-31s were produced. It remains in service with the Russian Air Force and Kazakhstan Air Force. It one of the fastest combat aircraft in service today."
 #ADR_jet_interceptor_equipment_8_short: "MiG-31"
 #ADR_jet_interceptor_equipment_9: "Sukhoi Su-27S"
 #ADR_jet_interceptor_equipment_9_desc: "The Su-27S Flanker B is the initial production variant of the Soviet designed Sukhoi Su-27 fighter. The aircraft was intended as the direct competitor to the F-14 Tomcat and F-15 Eagle. After making its maiden flight in 1977 it entered service later in 1985. It's primary role was long range air defense against American B-1 and B-52 bombers, also to provide long-range escort for Soviet intercontinental strategic bombers. So far 809 aircraft have been produced, which still see service in the Russian Air Force. Other operators include: Indonesia, Ukraine, Vietnam and China (Designated J-11), among others. The aircraft will remain in service for the foreseeable future."
 #ADR_jet_interceptor_equipment_9_short: "Su-27S"
  
