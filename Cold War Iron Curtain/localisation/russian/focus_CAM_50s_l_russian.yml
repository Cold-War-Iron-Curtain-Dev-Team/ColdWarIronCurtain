 SIA_insurgency_options.3.d: "Красные кхмеры продолжают обстреливать мирных жителей и пересекать нашу границу, не обращая внимания на наши предупреждения. Чтобы противостоять этому, мы создали группу быстрого реагирования в приграничном районе, изобилующем нарушениями со стороны кхмерских боевиков. Это решение оказалось отличным, поскольку была обнаружена группа вражеских боевиков, пересекающих границу, чтобы скрыться от правительственных сил. Наше подразделение определило их местоположение и быстро переместилось, начав атаку, которая, несомненно, шокировала их командира, который думал, что сможет прятаться несколько дней, прежде чем мы ответим. Враг понес тяжелые потери и был отброшен назад через границу."
 SIA_insurgency_options.4.d: "Красные кхмеры продолжают обстреливать мирных жителей и пересекать нашу границу, не обращая внимания на наши предупреждения. Чтобы противостоять этому, мы создали группу быстрого реагирования в приграничной зоне, изобилующей нарушениями со стороны кхмерских боевиков. После сообщений о том, что группа боевиков \"красных кхмеров\" расположилась на нашей стороне границы после боя с камбоджийскими правительственными войсками, мы направили наше подразделение, чтобы убрать их. Однако, когда бойцы приблизились, они попали в засаду и понесли потери, после чего были вынуждены бежать. Бойцы \"красных кхмеров\" совершили налет на тайскую пограничную деревню и вернулись обратно с захваченным оружием и припасами. Похоже, наши силы оказались тактически неподготовленными к встрече с бойцами, хорошо знакомыми с партизанской тактикой противника."
 SIA_insurgency_options.5.d: "Красные кхмеры укрепляют свои позиции в сельской местности и угрожают отрезать столицу Камбоджи от ее военных подразделений, действующих в сельской местности. Такой сценарий не отвечает интересам нашего правительства, и было решено, что мы будем использовать нашу собственную воздушную мощь для оказания ограниченной поддержки красным кхмерам. Используя разведывательные источники, мы обнаружили ключевой перекресток дорог, который прочно контролируется боевиками, действующими из близлежащего лагеря. Выявив лагерь, мы направили туда самолеты, которые подвергли его бомбардировке. Воздушная разведка и перехват вражеских сообщений подтвердили, что удар был успешным, и мы помешали \"красным кхмерам\" в этом районе."
 SIA_insurgency_options.6.d: "Красные кхмеры укрепляют свои позиции в сельской местности и угрожают отрезать столицу Камбоджи от ее военных подразделений, действующих в сельской местности. Такой сценарий не отвечает интересам нашего правительства, и было решено, что мы будем использовать нашу собственную воздушную мощь для оказания ограниченной поддержки красным кхмерам. Используя разведывательные источники, мы обнаружили ключевой перекресток дорог, который прочно контролируется боевиками, действующими из близлежащего лагеря. Выявив лагерь, мы направили туда самолеты, которые подвергли его бомбардировке. К сожалению, воздушная разведка и перехват вражеских сообщений подтвердили, что удар был нанесен по невоенной цели, что вызвало бурю эмоций у местных жителей в этом районе. Наш удар только способствовал росту популярности \"красных кхмеров\"."
 VIE_insurgency_options.3.d: "Коммунистические \"красные кхмеры\" способствуют перемещению людей и оружия для антиправительственных сил на нашей собственной территории. Они открыто действуют на нашей границе, и на их руках кровь многих невинных людей. Чтобы показать, что мы не потерпим враждебные силы на нашей границе, мы недавно провели рейд в Камбоджу. Наши люди напали на вражеский лагерь, нанесли большие потери, захватили документы и, что более важно, обнаружили огромный склад продовольствия и оружия, предназначенных для наших врагов. Наши люди уничтожили все это, прежде чем вернуться обратно. Эта операция показала, что мы не потерпим вмешательства красных кхмеров и их союзников в наши дела, и наши действия оказывают поддержку камбоджийскому правительству."
 VIE_insurgency_options.4.d: "Коммунистические \"красные кхмеры\" способствуют перемещению людей и оружия для антиправительственных сил на нашей собственной территории. Они открыто действуют на нашей границе, и на их руках кровь многих невинных людей. Чтобы показать, что мы не потерпим враждебные силы на нашей границе, мы недавно начали рейд в Камбоджу. Однако, когда бойцы приблизились к намеченному лагерю, оказалось, что они не застали врасплох красных кхмеров, которые устроили засаду. Они понесли тяжелые потери и заставили наших людей вернуться через границу. Красные кхмеры используют этот рейд как доказательство вьетнамского вторжения, чтобы завербовать больше людей и вбить клин между нами и камбоджийским правительством, которое теперь публично осуждает наши действия, чтобы сохранить лицо."
 VIE_insurgency_options.5.d: "Воздушная разведка ясно показывает, насколько обширна поддержка наших врагов со стороны красных кхмеров. Они способствуют перемещению оружия, людей и припасов в нашу страну, что подпитывает боевые действия на наших землях. Используя разведданные из дружественных источников, мы обнаружили крупное скопление топлива, боеприпасов и припасов вблизи границы. Мы отправили несколько бойцов, которые успешно разбомбили эту цель, что привело к мощным взрывам и уничтожению всех этих запасов. Красные кхмеры, охранявшие объект, также были уничтожены, и мы считаем, что эта операция помешает их операциям вместе с нашими врагами."
 VIE_insurgency_options.6.d: "Воздушная разведка ясно показывает, насколько обширна поддержка наших врагов со стороны красных кхмеров. Они способствуют перемещению оружия, людей и припасов в нашу страну, что подпитывает боевые действия на наших землях. Используя разведданные из дружественных источников, мы обнаружили крупное скопление топлива, боеприпасов и припасов вблизи границы. Мы направили несколько истребителей, но когда они приблизились к цели, то подверглись сильному зенитному обстрелу с земли. Самолеты сбросили бомбы и вернулись на базу, к счастью, не понеся потерь. Однако бомбы повредили местные фермы, а одна бомба упала рядом с деревней. Это было использовано для активизации поддержки \"красных кхмеров\" в этом районе."
 USA_CAM_Inusrgency_Options.5.d: "По всей видимости, Соединенные Штаты достигли негласного соглашения с камбоджийским правительством, разрешив ему бомбить убежища красных кхмеров вблизи границы с Вьетнамом. Массивные бомбардировщики B-52 начали интенсивную кампанию бомбардировок, в результате которой были уничтожены материальные средства, персонал и базы в районах проживания красных кхмеров. Соединенные Штаты надеются, что их операции предотвратят поток коммунистического оружия в Южный Вьетнам и помешают операциям красных кхмеров, уничтожив их базу снабжения. Несмотря на разрушительный ущерб, который был нанесен, в конечном счете, красные кхмеры, похоже, приспосабливаются и по-прежнему способны выполнять свои задачи, несмотря на недавнее американское воздушное наступление. Соединенные Штаты называют свою бомбардировочную кампанию операцией \"Меню\"."
 CAM_insurgency_options.15.d: "Правительство Камбоджи недавно начало крупное наступление, чтобы оттеснить \"красных кхмеров\" и обезопасить страну от коммунистической угрозы. Красные кхмеры развернули свои силы для контроля ключевых дорог и позиций, чтобы изолировать правительственные подразделения друг от друга. Цель наступления - восстановить контроль правительства над этими дорогами и обеспечить контакт с военными силами в сельской местности и столице. Наступление достигло своих целей, в ходе операции несколько подразделений действовали совместно, чтобы окружить силы красных кхмеров и обеспечить безопасность путей снабжения. В ходе операции были захвачены склады вражеских припасов, топлива и оружия. Эффективное использование артиллерии и хорошая координация действий командиров обеспечили успех операции. После этой победы враг перешел к обороне, и некоторые считают, что ситуация изменилась."
 CAM_insurgency_options.151.d: "Правительство Камбоджи недавно начало крупное наступление, чтобы оттеснить \"красных кхмеров\" и обезопасить страну от коммунистической угрозы. Красные кхмеры развернули свои силы для контроля ключевых дорог и позиций, чтобы изолировать правительственные подразделения друг от друга. Цель наступления - восстановить контроль правительства над этими дорогами и обеспечить контакт с военными силами в сельской местности и столице. Наступление достигло своих целей, в ходе операции несколько подразделений действовали совместно, чтобы окружить силы красных кхмеров и обеспечить безопасность путей снабжения. В ходе операции были захвачены склады вражеских припасов, топлива и оружия. Эффективное использование артиллерии и хорошая координация действий командиров обеспечили успех операции. После этой победы враг перешел к обороне, и некоторые считают, что ситуация изменилась."
 CAM_insurgency_options.16.d: "Правительство Камбоджи недавно начало крупное наступление, чтобы оттеснить \"красных кхмеров\" и обезопасить страну от коммунистической угрозы. Красные кхмеры развернули свои силы для контроля ключевых дорог и позиций, чтобы изолировать правительственные подразделения друг от друга. Цель этого наступления - восстановить контроль правительства над этими дорогами и обеспечить контакт с военными силами в сельской местности и столице. К сожалению, наступление закончилось неудачей. Связь между подразделениями оказалась плохой, и многочисленные подразделения попали под интенсивный огонь противника. Артиллерии поддержки порой не хватало, и к концу наступления почти все подразделения вернулись на исходные позиции, а некоторые, наиболее изолированные, оказались еще более отрезанными от путей снабжения. Моральный дух упал, и среди офицеров стало преобладать опасное оборонительное мышление."
 CAM_insurgency_options.3.d: "Один из командиров нашего подразделения получил сообщение от крестьянина о том, что в соседней деревне крестьяне запасают рис, накапливают оружие и принимают у себя коммунистических бойцов. Он взял своих подчиненных, и они ворвались в деревню, захватив большинство жителей, включая большое количество молодых мужчин. Обыскав деревню, они обнаружили скрытую кладовую с продовольствием, оружием и припасами. Всех мужчин взяли под стражу, чтобы провести более тщательное расследование. На данный момент ясно лишь то, что мы совершили налет на крупную оперативную базу красных кхмеров в этом районе и значительно затруднили деятельность их сторонников и персонала в этом районе."
 CAM_insurgency_options.4.d: "В одном из наших сельских районов подразделение решило совершить рейд в деревню в поисках боевиков \"красных кхмеров\" в этом районе. К сожалению, подразделение двигалось очень медленно, и мы полагаем, что их выследил враг, на которого они собирались охотиться. Когда они достигли деревни, командир потерял управление, так как бойцы бросились отбирать рис и другую еду у жителей деревни, очевидно, отряд недополучал продовольствие, хотя мы подозреваем, что командир продавал свои пайки. Это разозлило жителей деревни, и когда одна группа солдат отступила к близлежащему складу, они были перебиты из засады красных кхмеров. Те, кого удалось организовать, попытались отогнать врага, но и они попали в засаду, и в итоге отряд хаотично отступил. В результате рейда не удалось захватить ни пленных, ни вражеское оборудование, и он лишь способствовал отчуждению королевских войск от местных жителей и укреплению морального духа левых."
 CAM_insurgency_options.5.d: "Региональное военное командование решило разместить артиллерию на стратегическом холме, с которого можно было бы обрушить хаос на вражеские силы, действующие в этом районе. Используя разведданные, полученные из дружественного источника, нам сообщили, что враг рассматривает этот район как своего рода шоссе, по которому можно перебрасывать людей и материальные средства. Эти сведения оказались весьма точными, так как группа людей, медленно двигавшаяся по джунглям, была обнаружена и успешно обстреляна нашей артиллерией. Когда патруль отправился на разведку, они обнаружили, что эти люди были коммунистическими бойцами, которые несли большое количество оружия и припасов. В настоящее время планируется установить такие огневые позиции в других частях страны."
 CAM_insurgency_options.6.d: "В одном из наших районов \"красные кхмеры\" проявляют агрессивность в противостоянии с нашими силами. Местный командир тайно установил артиллерию и выслал патруль, чтобы отвлечь силы противника, которые затем будут уничтожены артиллерийским и минометным огнем. Однако, когда враг атаковал, наши артиллеристы оказались неумелыми из-за отсутствия подготовки и эффективного руководства. Снаряды промахивались или попадали в патруль, нанося потери от дружественного огня и помогая коммунистам прижать наших людей к земле. В итоге наши силы понесли большие потери в обмене, моральный дух был сильно подорван, а между пехотными офицерами и артиллеристами в этом районе возникло чувство вражды."
 CAM_insurgency_options.1.d: "Возможно, самым большим преимуществом монархии является верность и преданность, которую она внушает всем камбоджийцам, особенно крестьянам. Даже среди самых левых крестьян есть те, кто все еще надеется на королевскую семью как на лидера и руководителя. Недавно наш разведчик выявил несколько таких крестьян и попросил их присоединиться или предложить помощь красным кхмерам в определенном районе. Затем эти крестьяне передали нам ценную разведывательную информацию о порядке действий, передвижениях и целях коммунистических бойцов. Что еще более важно, они перечислили деревни и деревенских лидеров, активно помогающих врагу. С этой информацией мы начали медленно сворачивать сочувствующих врагу, изолировать коммунистических бойцов и вскоре завернем и их, очистив район от вражеских сил."
 CAM_insurgency_options.2.d: "Возможно, самым большим преимуществом монархии является верность и преданность, которую она внушает всем камбоджийцам, особенно крестьянам. Даже среди самых левых крестьян есть те, кто все еще надеется на королевскую семью как на лидера и руководителя. Недавно наш разведчик выявил несколько таких крестьян и попросил их присоединиться или предложить помощь красным кхмерам в определенном районе. Затем эти крестьяне передали нам ценные разведданные о порядке действий, передвижениях и целях коммунистических бойцов. Однако в данном случае все закончилось неудачей. Оказалось, что крестьяне были двойными агентами и вместо этого снабжали нас разведданными, которые мы использовали для того, чтобы уничтожить или задержать жителей проправительственных деревень. К тому времени, когда мы это выяснили, ущерб был нанесен, и теперь многие проправительственные деревни в этом районе присоединились к коммунистам или больше не помогают нам в выявлении врагов."
 CAM_insurgency_options.3a.d: "Была обнаружена группа боевиков \"красных кхмеров\", которые пересекли границу, вероятно, пройдя определенную подготовку. Вскоре после этого они разбили лагерь в глубине джунглей. Командир нашего местного подразделения организовал рейдовую группу из лучших солдат своего подразделения, и они смогли начать штурм лагеря. Многие вражеские бойцы были нейтрализованы, оставшиеся в живых в ужасе бежали, а наши люди забрали несколько пленных, пропагандистские документы и оружие. Судя по всему, эти люди отправились за границу для прохождения предварительной подготовки, поэтому их уничтожение поможет ослабить коммунистическую деятельность в этом районе и поднять боевой дух наших войск."
 CAM_insurgency_options.4a.d: "Противник продолжает пытаться изолировать наши подразделения, пересекая маршруты снабжения и пытаясь раздробить наши силы. Эффект такого подхода был недавно ощутим, когда местный командир получил приказ выследить вражеские силы, которые устраивали засады на колонны снабжения вдоль важной дороги. Из-за отсутствия координации и связи между подразделениями в этом районе командир подошел к предполагаемому лагерю в том направлении, где враг легко увидел их прибытие. Красные кхмеры устроили засаду возле своего лагеря, и когда наши бойцы двинулись на штурм, они попали в ловушку противника. Наши силы понесли тяжелые потери, а противник в итоге расширил свой контроль над спорной дорогой."
 CAM_insurgency_options.5a.d: "Антикоммунистические качества нашей Республики произвели впечатление на многие страны региона и мира. Они тонко или открыто способствовали нашей кампании против красных кхмеров. Недавно дружественное нам государство предложило поддержку с воздуха для любой операции по нашему выбору. На одной из главных дорог мы обнаружили, что крупные силы красных кхмеров перехватывают движение и временами блокируют поставки из столицы в некоторые из наших наиболее важных подразделений на границе. Мы предоставили нашим друзьям информацию от местных информаторов и разведчиков. Вчера, используя эту информацию, дружественное государство послало несколько самолетов, которые интенсивно бомбили противника. Патруль, посланный оценить ситуацию, отметил, что лагерь коммунистов был опустошен, а выжившие, несомненно, бежали. Эта успешная бомбардировка расчистила путь для наших сил, чтобы восстановить контроль в этом районе и пока что защитить движение припасов и товаров."
 CAM_insurgency_options.6a.d: "Антикоммунистические качества нашей Республики произвели впечатление на многие страны региона и мира. Они тонко или открыто способствовали нашей кампании против красных кхмеров. Недавно дружественное государство предложило поддержку с воздуха для любой операции по нашему выбору. Один из наших командиров заметил, что группа деревень была, по сути, базой для боевиков \"красных кхмеров\", действующих против его сил. С этой информацией дружественное государство направило самолеты, которые нанесли удар по целям, чтобы уничтожить вражеские силы и их инфраструктуру поддержки. Когда патруль отправился на расследование, они обнаружили, что самолеты неправильно прочитали информацию и не поразили цели, вместо этого они ударили по проправительственным районам. Местное население было в ярости, и патруль был вынужден быстро вернуться. Эта неудачная операция стоила нам жизненно важной поддержки местного населения и только укрепила наших коммунистических врагов."
 CAM_insurgency_options.1a.d: "Преданность наших сторонников делу борьбы с коммунизмом не поддается описанию. Агенты нашей разведки недавно завербовали таких преданных членов, чтобы они прошли обучение и уехали в сельскую местность. Затем они присоединились к местным \"красным кхмерам\" в этом районе. Затем мы получили от них ценную разведывательную информацию о тактике, передвижениях, мотивах и подготовке. Эта информация используется для того, чтобы помочь нам противостоять их пропаганде и препятствовать их собственным движениям. Более того, некоторые из наших лазутчиков даже поднимаются по служебной лестнице и могут сообщить названия деревень и имена лидеров общин, поддерживающих боевиков. С помощью этой разведывательной информации мы в конечном итоге идентифицируем и уничтожим \"красных кхмеров\" в этом районе вместе с их сетями поддержки."
 CAM_insurgency_options.2a.d: "Преданность наших сторонников делу борьбы с коммунизмом не поддается описанию. Агенты нашей разведки недавно завербовали таких преданных членов, чтобы они прошли обучение и уехали в сельскую местность. Затем они присоединились к местным \"красным кхмерам\" в этом районе. Однако, похоже, наша подготовка была не столь тщательной, и эта банда коммунистов легко вычислила наших шпионов. Они снабжали их ложной информацией и устраивали ловушки, которые подтверждали их подозрения. Со временем это привело к ряду тактических поражений и действий наших войск, которые оттолкнули сторонников правительства. К тому времени, когда мы поняли правду, наши лазутчики исчезли, а один из агентов разведки был также похищен противником."
 Rouge_insurgency_options.3.d: "У противника нет ни боевого опыта, ни высоких стандартов подготовки. Мы можем опираться на опыт наших товарищей на других театрах региональной и глобальной борьбы за революцию. Недавний пример такого преимущества - когда наши бойцы выследили вражеский патруль. Они поняли, что патруль имеет тенденцию возвращаться тем же путем, которым пришел, что является серьезной тактической военной ошибкой. В итоге наши бойцы организовали идеальную засаду, и мы атаковали патруль, нанеся ему тяжелые потери и захватив ценное оружие и припасы. Моральный дух наших бойцов теперь выше, и враг в этом районе боится покидать свои базы."
 Rouge_insurgency_options.4.d: "Самоуверенный лидер повел своих бойцов на штурм вражеского форпоста. Наши бойцы не смогли должным образом разведать или спланировать свою тактику и предали некоторые из основных принципов нашего революционного стиля борьбы. В результате перестрелки бойцы не смогли прорвать заставу и понесли тяжелые потери. Командир был заменен, а оставшиеся в живых бойцы взяты на переподготовку для обучения правильной тактике и технике. Силы противника оказались больше, чем ожидалось, а наши бойцы двигались довольно открыто, выдавая элемент внезапности. Еще более неприятным было то, что мы не смогли использовать местность в своих интересах. Такие ошибки наших войск, которые не являются профессиональными солдатами, можно иногда ожидать, но они должны быть немедленно исправлены."
 Rouge_insurgency_options.5.d: "Один местный чиновник получил королевскую награду за многолетнюю службу правительству. Этот человек предал огласке полученную им награду. Многие жители деревни были впечатлены и теперь говорят положительные вещи о правительстве и королевской семье. Это подрывает поддержку нашего дела среди угнетенных крестьян. Чтобы остановить это, группа бойцов заложила взрывчатку в доме бюрократа и уничтожила его. Сообщение было получено, и теперь бюрократ отказывается обсуждать свою награду, когда об этом заходит речь, а некоторые из более откровенных жителей деревни теперь молчат."
 Rouge_insurgency_options.6.d: "Правительство продолжает направлять вооруженных головорезов для изъятия продовольствия и денег у крестьян. Они обескровливают страну, чтобы накормить свои собственные желания и коррупцию. В одной крупной деревне у сборщиков налогов есть офис. Группа подрывников попыталась взорвать его, но была схвачена местными силами безопасности, которые поймали наших людей со взрывчаткой. Теперь правительство говорит жителям деревни, что наши люди пытались заложить бомбу, которая убила бы невинных людей и уничтожила бы правительственный склад с рисом. Они ложно утверждают, что мы планировали взорвать рис и вызвать нехватку продовольствия, чтобы еще больше отвратить народ от королевской семьи."
 Rouge_insurgency_options.1.d: "Правительство в значительной степени полагается на местных крестьян, которые сильно привязаны к королевской семье. Они используют этих простых мужчин и женщин для сбора информации о нашей революционной деятельности. Однако в некоторых случаях правительство проявляет самодовольство, и в одном районе мы обнаружили, что они принимают любого, кто клянется в лояльности и хочет предоставить информацию. Мы послали несколько агентов, чтобы внедриться в правительственные войска, выдавая себя за лояльных крестьян. Эта операция увенчалась большим успехом, поскольку они снабжают правительство устаревшей информацией и, в свою очередь, узнают об их тактике и процедурах. Мы также направляем правительство в районы, где нет боевиков, чтобы облегчить передвижение наших сил. Этот успех позволил нашим силам в этом районе действовать намного эффективнее."
 Rouge_insurgency_options.2.d: "Правительство в значительной степени полагается на местных крестьян, которые сильно привязаны к королевской семье. Они используют этих простых мужчин и женщин для сбора информации о нашей революционной деятельности. Мы послали несколько агентов, чтобы внедриться в правительственные войска, выдавая себя за верных крестьян. Операция оказалась неудачной, так как правительственные вербовщики оказались искусными в проверке наших людей. Они быстро поняли, что происходит, и привели людей. Однако они позаботились о том, чтобы наши агенты не получили компрометирующих разведданных, и проследили за ними. Когда они узнали, кто был их кураторами, они арестовали внедрившихся и наших агентов в этом районе. Это ослабило нашу способность отслеживать противника, и теперь правительственные силы добиваются успехов в этом районе."
 Rouge_insurgency_options.3a.d: "Вопиющее насилие и агрессия, которые правительственные войска демонстрируют крестьянам в своем рвении охотиться на нас и рис для сбора налогов, завоевали нам большую поддержку местных жителей. Из этой информации мы узнали, что большинство военнослужащих на заставе, охраняющей ключевой перекресток дорог, совершают эти жестокие рейды каждые несколько дней. Хотя они утверждают, что крадут продукты из деревень для сбора налогов, многие подозревают, что войска плохо снабжаются и живут за счет земли. Используя эту информацию, группа наших людей установила вокруг поста. Когда правительственные войска выдвинулись к деревням и оказались на расстоянии, наши люди атаковали слабо защищенный пост. Мы уничтожили то, что не смогли унести, а также смогли уничтожить несколько машин, перевозивших почту и припасы по дороге. Этот успешный рейд, несомненно, ослабит дух наших противников и заставит их оставаться в ловушке на своем форпосте, пока мы укрепляем свои позиции в этом районе."
 Rouge_insurgency_options.4a.d: "Наш враг провозгласил себя величайшим противником коммунистического пыла, охватившего нашу нацию. Благодаря этому они могут приобретать оборудование и припасы у дружественных государств или групп, симпатизирующих им. Это дорого обошлось одному из наших бойцов, попытавшемуся ночью штурмовать вражеский пост из слабого места. Обычно такая операция была бы легким успехом для наших сил, поскольку враг на этом посту, как было замечено, игнорировал основные методы создания обороны. Однако, когда наши бойцы подошли на открытое место, они неожиданно попали под сильный огонь и, понеся потери, были вынуждены отступить с поражением. Мы полагаем, что на этом форпосте находился либо иностранный советник, либо передовое оборудование для ведения ночной войны, которое они использовали для отражения нашей атаки."
 Rouge_insurgency_options.5a.d: "Правительство продолжает пытаться убедить народ в том, что его дело правое. Однако их союз с капиталистами, коррупция и жестокая политика по отношению к крестьянам позволяют нам оставаться сильными перед лицом их агрессии. Наша основная тактика заключается в изоляции правительственных сил путем налетов или перехвата транспорта на основных дорогах, чтобы лишить республиканские силы связи. В ходе недавней операции группа саперов разведала боковую дорогу, используемую правительственными машинами для снабжения вражеских сил в этом районе. Ночью им удалось установить мины на этой дороге, и на следующий день, когда прибыли машины снабжения, они подорвались на минах. С тех пор эта группа отслеживает маршруты снабжения вражеских войск и продолжает их минировать. Это приводит к некоторой панике и снижению эффективности правительственных войск."
 Rouge_insurgency_options.6a.d: "Правительство продолжает направлять вооруженных головорезов для изъятия продовольствия и денег у крестьян. Они обескровливают страну, чтобы накормить свои собственные желания и коррупцию. В одной крупной деревне у сборщиков налогов есть офис. Группа подрывников попыталась взорвать его, но была схвачена местными силами безопасности, которые поймали наших людей со взрывчаткой. Теперь правительство говорит жителям деревни, что наши люди пытались заложить бомбу, которая убила бы невинных людей и уничтожила бы правительственный склад с рисом. Они ложно утверждают, что мы планировали взорвать рис и вызвать нехватку продовольствия, чтобы еще больше отвратить людей от правительства."
 Rouge_insurgency_options.1a.d: "Многие в правительстве, особенно в среднем звене армии и бюрократии, признают неизбежность нашей революции. Они видят, что крестьяне настроены против них, и хотят обеспечить их выживание. Некоторые даже осознают праведность наших убеждений и хотят присоединиться к нам. Конечно, мы принимаем некоторых дезертиров, но недавно было решено использовать некоторых из тех, кто хочет перейти на другую сторону, в качестве агентов, предоставляющих нам информацию. В одном из крупных городов мы успешно завербовали нескольких правительственных и военных чиновников, чтобы они снабжали нас информацией. От них мы узнали об их приказах, политике, передвижениях, численности и моральном состоянии. Благодаря этой информации мы смогли расширить свое присутствие, опровергнуть правительственную пропаганду и еще больше деморализовать правительственные силы в городе. Мы надеемся, что этот успех откроет нам путь к окончательному изгнанию врага."
 Rouge_insurgency_options.2a.d: "Многие в правительстве, особенно в среднем звене армии и бюрократии, признают неизбежность нашей революции. Они видят, что крестьяне настроены против них, и хотят обеспечить их выживание. Некоторые даже осознают праведность наших убеждений и хотят присоединиться к нам. Конечно, мы принимаем некоторых дезертиров, но недавно было решено использовать некоторых из тех, кто хочет перейти на другую сторону, в качестве агентов, предоставляющих нам информацию. К сожалению, недавняя операция показала, что такой подход может быть обоюдоострым мечом. В одной из деревень, где шли сильные бои, мы завербовали военного офицера среднего звена для предоставления нам разведданных, и поначалу информация казалась очень полезной. Однако он манипулировал своим куратором и вскоре выяснил, где в основном сосредоточены наши силы. За последние несколько дней куратор был задержан, а наши силы в этом районе понесли большие потери после скоординированной правительственной атаки. Похоже, что наш лазутчик был двойным агентом."
 Rouge_insurgency_options.151.d: "Хотя во многих местах правительственные войска превосходят наши силы в живой силе, последние бои показывают, что у них нет морального духа или желания продолжать борьбу. Учитывая это, при помощи артиллерии, полученной из дружественных источников, военное руководство начало широкомасштабное наступление, чтобы расширить нашу зону контроля и заставить врага обороняться. Наступление увенчалось ошеломляющим успехом, поскольку правительственные войска таяли, когда вступали в бой, и особенно когда попадали под артиллерийский огонь. Ключом к успеху стало решение командиров маневрировать нашими людьми таким образом, чтобы блокировать подкрепление, особенно со стороны проправительственных ополченцев для усиления подразделений камбоджийской армии. В настоящее время наши силы закрепляют свои успехи, поскольку противник пытается перегруппироваться после понесенных потерь. Враг находится в обороне, и, похоже, наша революция в Лаосе стала намного ближе к осуществлению."
 Rouge_insurgency_options.15.d: "Хотя во многих местах правительственные войска превосходят наши силы в живой силе, последние бои показывают, что у них нет морального духа или желания продолжать борьбу. Учитывая это, при помощи артиллерии, полученной из дружественных источников, военное руководство начало широкомасштабное наступление, чтобы расширить нашу зону контроля и заставить врага обороняться. Наступление увенчалось ошеломляющим успехом, поскольку правительственные войска таяли, когда вступали в бой, и особенно когда попадали под артиллерийский огонь. Ключом к успеху стало решение командиров маневрировать нашими людьми таким образом, чтобы блокировать подкрепление, особенно со стороны проправительственных ополченцев для усиления подразделений камбоджийской армии. В настоящее время наши силы закрепляют свои успехи, поскольку противник пытается перегруппироваться после понесенных потерь. Враг находится в обороне, и, похоже, наша революция в Лаосе стала намного ближе к осуществлению."
 Rouge_insurgency_options.16.d: "Хотя во многих местах правительственные войска превосходят наши силы в живой силе, последние бои показывают, что у них нет морального духа или желания продолжать борьбу. Исходя из этого, военное руководство при помощи артиллерии, полученной из дружественных источников, начало широкомасштабное наступление, чтобы расширить зону нашего контроля и заставить противника обороняться. Оказалось, что наша оценка была неверной. Хотя первые успехи были достигнуты против правительственных сил, нам не удалось блокировать прибытие проправительственных ополченцев, которые усилили сопротивление противника. Кроме того, воздушная мощь правительства оказалась решающей в нанесении ударов по артиллерии и большей концентрации наших сил. Наши ранние успехи были быстро сведены на нет, и после тяжелых потерь атака была отменена. На данный момент мы должны находиться в обороне."
 CAM_insurgency_options.10.d: "Гражданская война в Камбодже наконец-то закончилась тем, что победившие красные кхмеры захватили столицу и последний оплот правительства Пномпень. В течение последних нескольких месяцев красные кхмеры методично захватывали близлежащие районы и в конце концов окружили город. После начала главного штурма они столкнулись с интенсивными боями от дома к дому, хотя в конце концов сломили сопротивление правительства. Когда правительственные силы развалились, оставшиеся в живых военные и гражданские лидеры попытались спастись на вертолете с Олимпийского стадиона или перебраться в посольство Франции. Несколько высокопоставленных правительственных чиновников, в том числе премьер-министр Лонг Борет, были захвачены в плен во время хаоса. После захвата города красные кхмеры немедленно приказали эвакуировать из него всех гражданских лиц, что привело к массовым жертвам, особенно среди пациентов больниц. Французское посольство в конце концов сдало своих беженцев, чтобы предотвратить массовую резню. На Олимпийском стадионе уже происходят массовые казни бывших военных и гражданских лидеров. Теперь Камбоджа прочно находится под властью \"красных кхмеров\"."
 CAM_insurgency_options.11.d: "Последний бастион боевиков \"красных кхмеров\" недавно пал перед камбоджийским правительством. Несмотря на жестокую борьбу, правительству удалось сорвать попытки красных кхмеров перехватить линии снабжения и изолировать правительственные центры друг от друга. Поскольку красные кхмеры не смогли разделить армию или консолидировать контроль над населенными пунктами, повстанцы в конце концов начали терять больше людей, чем могли набрать из крестьянства. Камбоджийские крестьяне становились все более разочарованными из-за перебоев, вызванных войной. Когда банды красных кхмеров были изолированы и отрезаны от населения, правительство смогло зачистить их оставшиеся банды. Во время этого последнего штурма многие высокопоставленные лидеры и командиры красных кхмеров были убиты или захвачены в плен. Пока неизвестно, есть ли среди них их лидер Пол Пот, хотя правительство уверено, что со всеми выжившими лидерами в конечном итоге будет покончено."
 CAM_insurgency_options.0.d: "Правитель Камбоджи, принц Сианук, недавно принял антикоммунистическое правительство под руководством премьер-министра Лон Нола. Чтобы поправить экономику, Лон Нол начал агрессивную кампанию по сбору риса, в ходе которой вооруженные до зубов войска маршировали в сельскую местность, насильно собирая рис и выплачивая крестьянам низкие расценки. Это спровоцировало восстание, которое Лон Нол жестоко подавил. Это восстание заставило принца Сианука окончательно ополчиться против левых, и он приказал провести собственные репрессии. Однако эти действия спровоцировали коммунистическую партию \"красных кхмеров\" начать восстание против правительства. Они планируют использовать поддержку соседних коммунистических партий и опыт Вьетнама, чтобы направить свои силы против камбоджийского правительства, стремящегося раз и навсегда сломить левое сопротивление."
 CAM_insurgency_options.100.d: "Камбоджийское правительство в течение многих лет пыталось сбалансировать свои международные отношения с Западом и коммунистическими государствами. Внутри страны оно действовало аналогичным образом, временами оказывая предпочтение коммунистическим фракциям, а временами - антикоммунистическим, чтобы сохранить стабильность. Однако после крестьянского восстания из-за налогов на рис правительство резко отвернулось от коммунистов и начало сотрудничать с Соединенными Штатами. Это спровоцировало \"красных кхмеров\" начать свое коммунистическое восстание против правительства. Теперь камбоджийское правительство сталкивается с коммунистическими партизанами, которые могут заручиться поддержкой влиятельных региональных коммунистических правительств."
 Cambodian_Civil_War_Decisions_desc: "Камбоджийское правительство в течение многих лет пыталось сбалансировать свои международные отношения с Западом и коммунистическими государствами. Внутри страны оно действовало аналогичным образом, временами оказывая предпочтение коммунистическим фракциям, а временами - антикоммунистическим, чтобы сохранить стабильность. Однако после крестьянского восстания из-за налогов на рис правительство резко отвернулось от коммунистов и начало сотрудничать с Соединенными Штатами. Это спровоцировало \"красных кхмеров\" начать свое коммунистическое восстание против правительства. Теперь камбоджийское правительство сталкивается с коммунистическими партизанами, которые могут заручиться поддержкой мощных региональных коммунистических правительств.\n\nТекущая сила:\n[?CAM.GetNameDef]: [?CAM.cam_insurgency] Победные очки\n[?KMP.GetNameDef]: [?KMP.cam_insurgency] Победные очки"
