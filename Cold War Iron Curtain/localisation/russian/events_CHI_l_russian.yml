l_english:
 chi.1.t: "Принять КНР в ООН"
 chi.1.d: "Китайская Народная Республика хочет, чтобы Организация Объединенных Наций признала ее преемницей Китайской Республики. Гоминьдановское правительство бежало на Тайвань, а Китайская Народная Республика контролирует материк. Следует ли нам выступать за то, чтобы Китайская республика Тайваня уступила свое место Китайской Народной Республике?"
 chi.1.a: "Да, конечно!"
 chi.1.b: "Нет, они должны остаться сами по себе."
 CHI_KOR.0.d: "Молодая Республика Корея, долго осаждаемая агитацией Ким Ир Сена, была втянута в гражданскую войну, а Мао Цзэдун, несомненно, поддержал силы Кима на Севере в качестве средства борьбы с угрозой Соединенных Штатов поддерживающих Юг. По мере эскалации корейской Гражданской войны взоры всего мира вновь устремились на Азию, и Китайская республика не будет стоять в стороне, когда Красная угроза обрушится на добрый народ Кореи со стороны Пхеньяна.Чан Кайши уже направил письмо президенту Америки, предлагая военную помощь как Америке, так и Корее против режима Ким Ир Сена."
 CHI_KOR.1.d: "Наше недавнее решение ввязаться в гражданскую войну в Корее привлекло внимание КНР и Ким Ир Сена; Китайская республика на Тайване и остатки Гоминьдана выступили с предложением присоединиться к американской армии в борьбе против северокорейской армии.\n\nНаше участие в этом конфликте, могут подтолкнуть КНР принять решение о полномасштабном вторжении в Корею через Маньчжурию."
 CHI_KOR.2.d: "Весть из Вашингтона! Американское правительство подписало предложение Чан Кайши о том что армия Соединенных Штатов будет действовать совместно с гоминьдановской армией в совместной борьбе против северокорейской армии!"
 CHI_KOR.3.d: "Официальные лица из Вашингтона информировали Чан Кайши о том что Китайской Республике не рекомендуется вмешиваться в Корейскую гражданскую войну, ссылаясь на опасения, что любое военное вторжение с Тайваня вызовет ответную реакцию со стороны Пекина, что потенциально приведет к эскалации войны до международного кризиса."
 CHI_KOR.4.d: "\nС началом гражданской войны в Корее вполне естественно, что враги азиатского коммунистического блока, будут стремиться присоединиться к боевым действиям на стороне Ли Сын Мана; не прошло и года с конца Гражданской войны в Китае, как остатки Гоминьдана на Тайване вновь решили взяться за оружие против китайской Красной Армии, поддерживающей Ким Ир Сена в Северной Корее.\n\nПосле недавней переписки между президентом Китайской Республики Чан Кайши в Тайбэе и американским президентом Гарри Трумэном в Вашингтоне Соединенные Штаты дали зеленый свет гоминьдановской армии на помощь армии США в Корее, полагая, что их опыт борьбы с красными китайскими войсками поможет одержать верх в этой войне и избавиться от красной угрозы на северной части полуострова."
 CHI_KOR_TT: "[CHI.GetNameDef] официально вступила в Корейскую войну против коммунистических агрессоров."
 KMT_Lift_Martial_Law2: "Отменить военное положение"