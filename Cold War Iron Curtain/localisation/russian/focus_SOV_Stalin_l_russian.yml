 soviet_industry.1.b: "Промышленность должна остаться в РСФСР"
 soviet_industry.1.c: "Перенести тяжелую промышленность в Казахскую ССР"
 soviet_industry.1.d: "Перенести тяжелую промышленность в Таджикскую ССР"
 soviet_indudstry.e: "Перенести тяжелую промышленность в Среднюю Азию"
 soviet_indudstry.f: "Перенесите тяжелую промышленность в Украину или Россию"
 soviet_industry.1.desc: "После Великой Отечественной войны наш государственный плановый аппарат предоставил несколько вариантов развития тяжёлой промышленности. Мы могли бы создать промышленность в Украинской ССР, известной как «житница Союза», дающей большую часть хлеба государству; или промышленность может остаться в РСФСР, предоставляя больше рабочих мест этническим русским. Также появилась новая и неожиданная альтернатива; перемещение тяжелой промышленности в Среднюю Азию, либо в Казахскую ССР, либо в Таджикскую ССР, обе из которых имеют достаточное пространство и ресурсы. Куда мы перенесём промышленность?"
