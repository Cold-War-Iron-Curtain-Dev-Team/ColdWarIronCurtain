 SOV_law_on_labour_collectives: "Law "On Labour Collectives""
 SOV_law_on_labour_collectives_desc: "After the adoption of the law "On labour collectives and increasing their role in the management of enterprises, institutions, organisations", workers began to try to take part in the development and discussion of draft long-term and current plans for the economic and social development of their enterprise. However, the lack of subjectivity and legal certainty allows the heads of enterprises to often circumvent or level the decisions of the labour collective."
 SOV_Decree_No_659: "Принять указ No. 659"
 SOV_Decree_No_659_desc: "Decree No. 659 sets the task of improving the planning of the activities of production associations and enterprises, creating conditions that would stimulate high-quality, highly productive work, initiative and entrepreneurship, ensuring the acceleration of scientific and technological progress, and the intensification of production. The Central Committee of the CPSU and the Council of Ministers of the USSR consider it necessary, along with the consistent and persistent introduction of the forms and methods of management that have justified themselves, to carry out a system of additional measures to expand the rights of production associations and enterprises in planning and economic activity, to ensure their interest in achieving high production efficiency and to strengthen responsibility for work results. All these measures should be aimed at further improving and strengthening the centralized management of the economy, combined with the development of democratic principles in the management of the national economy, the enhancement of the role of labour collectives in the management of production associations and enterprises, and the widespread introduction of cost accounting. In order to develop these measures, and ensure their comprehensive validity and practical verification, a large-scale economic experiment will be carried out."
