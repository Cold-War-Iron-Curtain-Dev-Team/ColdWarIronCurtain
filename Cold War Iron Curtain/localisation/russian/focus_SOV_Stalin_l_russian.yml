 Soviet_Op_North.1.d: "Советский Союз обвиняют в депортации тысяч Свидетелей Иеговы из Прибалтики и других восточноевропейских регионов в Сибирь. В сообщениях указывается, что министерство государственной безопасности недавно издало указы о депортации и конфискации имущества. Говорят, что число Свидетелей Иеговы исчисляется тысячами. Свидетели Иеговы уже давно не в ладах с советской властью, отказываясь от участия в государственных функциях, в том числе от службы в армии. Для многих советских чиновников эти религиозные убеждения представляли собой прямой вызов государству, который нужно было искоренить, прежде чем он распространится на другие слои населения. Эта акция, вероятно, вызовет некоторую международную критику по поводу религиозных преследований"
 SOV_PRC_Treaty.1.d: "Два мировых социалистических гиганта могут многое выиграть от сотрудничества. Договор гарантирует союз между Китаем и Советским Союзом. Договор обеспечивает крайне необходимую помощь новому китайскому режиму. Порты Далянь и Лушунь также будут возвращены Китаю. Советы получают привилегии в Синьцзяне и Маньчжурии. Оба государства выиграют от партнёрства социалистического мира"
