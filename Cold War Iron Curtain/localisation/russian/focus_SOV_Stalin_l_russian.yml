 SOV_Economic_Department_of_the_Central_Committee_of_the_CPSU: "Economic Department of the Central Committee of the CPSU"
 SOV_Economic_Department_of_the_Central_Committee_of_the_CPSU_desc: "The newly created Economic Department of the Central Committee of the CPSU shook up the old management style somewhat, improving the formation and direction of economic policy for a while."
 SOV_Mass_reshuffles_and_dismissals_in_the_party_and_administrative_apparatus: "Mass reshuffles and dismissals in the party and administrative apparatus"
 SOV_Mass_reshuffles_and_dismissals_in_the_party_and_administrative_apparatus_desc: "§WMonthly Corruption:§! §G-0.2§!\n§W--------------§!\nThe mass removal of corrupt and incompetent ministers and party officials from office is a necessary procedure, but this does not take place without their resistance and problems in selecting a worthy replacement."
 SOV_Wide_anti_corruption_campaign: "Широкая антикоррупционная кампания"
 SOV_Wide_anti_corruption_campaign_desc: "§WЕжемесячная коррупция:§! §G-0.2§!\n§W--------------§!\n"
 SOV_Ongoing_mass_dismissals_in_the_Ministry_of_Internal_Affairs: "Ongoing mass dismissals in the Ministry of Internal Affairs"
 SOV_Ongoing_mass_dismissals_in_the_Ministry_of_Internal_Affairs_desc: "§WMonthly Corruption:§! §G-0.2§!\n§W--------------§!\nThe Shchelokov case and other investigations within the Ministry of Internal Affairs and its structures reveal a huge number of officers tainted with corruption, abuse of authority, violation of the charter, covering up and concealing the crimes of their colleagues, merging with criminal elements and even outright robbery of Soviet citizens. In relation to these persons, large-scale investigative measures are being taken, criminal cases are opened and dismissals are carried out en masse. Although these measures are necessary, they distract honest employees of the MVD and the KGB from their direct duties and create a heavy burden on the administrative apparatus."
 SOV_Anti_corruption_campaign_in_MVD: "Anti-corruption campaign in MVD"
 SOV_Anti_corruption_campaign_in_MVD_desc: "§WMonthly Corruption:§! §G-0.2§!\n§W--------------§!\nBefore starting an anti-corruption campaign in the party and administrative bodies, we need to put in order and remove corruption from the MVD, to which many services are subordinate, from firefighters and militsiya to internal troops and the main department for combating the theft of socialist property (GUBKhSS). We are especially concerned about the latter since it is the GUBKhSS that should be investigating and preventing corruption and theft. To make sure everything goes smoothly, we will put the Ministry of Internal Affairs under the supervision of the 3rd Main Directorate of the KGB, responsible for military counterintelligence."
 SOV_Preparation_for_an_anti_corruption_campaign: "Preparation for an anti-corruption campaign"
 SOV_Preparation_for_an_anti_corruption_campaign_desc: "Corruption permeates the party and society from top to bottom, but the biggest threat is corruption at the top, and we must start with it. Broad preparations should be made to root out this problem, first by replacing the incompetent Ivan Kapitonov with the responsible Yegor Ligachev as head of the Department of Organisational and Party Work of the Central Committee of the CPSU to facilitate the removal of corrupt officials."
 SOV_Discipline_strengthening_initiative: "Discipline Strengthening Initiative"
 SOV_Discipline_strengthening_initiative_desc: "§WMonthly Labour Discipline:§! §G+0.5§!\n§W--------------§!\nAfter Comrade Andropov's speech at the last plenum of the Central Committee of the CPSU, where he declared a fight against any violations of the party, state, and labour discipline, local raids began on public places - such as hairdressers, shops, and cinemas - where workers are not supposed to be during working hours. The population is perplexed by such measures, and it is not entirely clear whether Comrade Andropov meant this when he spoke of strengthening discipline."
 SOV_Campaign_on_Strengthening_Labour_Discipline: "Campaign on Strengthening Labour Discipline"
 SOV_Campaign_on_Strengthening_Labour_Discipline_desc: "§WMonthly Labour Discipline:§! §G+1§!\n§W--------------§!\nThe campaign to strengthen labour discipline, launched by Comrade General Secretary Andropov, is acquiring more explicit legislative outlines, noticeably different from local initiatives for the better both in terms of efficiency and thoughtfulness."
 SOV_Campaign_on_Strengthening_Labour_Discipline_Improved: "Campaign on Strengthening Labour Discipline"
 SOV_Campaign_on_Strengthening_Labour_Discipline_Improved_desc: "§WMonthly Labour Discipline:§! §G+1§!\n§W--------------§!\nThe campaign to strengthen labour discipline, launched by Comrade General Secretary Andropov, is acquiring more explicit legislative outlines, noticeably different from local initiatives for the better both in terms of efficiency and thoughtfulness."
 SOV_Campaign_on_Strengthening_Labour_Discipline_Improved_again: "Campaign on Strengthening Labour Discipline"
 SOV_Campaign_on_Strengthening_Labour_Discipline_Improved_again_desc: "§WMonthly Labour Discipline:§! §G+2§!\n§W--------------§!\nThe campaign to strengthen labour discipline, launched by Comrade General Secretary Andropov, is acquiring more explicit legislative outlines, noticeably different from local initiatives for the better both in terms of efficiency and thoughtfulness."
