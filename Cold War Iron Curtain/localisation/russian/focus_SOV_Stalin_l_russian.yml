 soviet_industry.3.t: "Стройте новые железные дороги"
 soviet_industry.3.desc: "Государственный плановый аппарат дал разрешение на строительство новых железных дорог в рамках нашего промышленного плана; однако у нас есть много вариантов того, где следует разместить железную дорогу. Сибирь была выдвинута как идея; но она в значительной степени пуста, и железная дорога там может быть пустой тратой времени. Была предложена Прибалтика, но снова строительство было оспорено. Наконец, была предложена Средняя Азия, включая Казахскую ССР, Киргизскую ССР, Туркменскую ССР, Таджикскую ССР и Узбекскую ССР; и, безусловно, это поможет с внутренней мобильностью, а также с промышленным развитием. Что мы выберем?"
 soviet_industry.3.a: "Проложить железные дороги в Сибири — это необходимость"
 soviet_industry.3.b: "Инвестиции в республики Прибалтики откроют для нас много возможностей"
 soviet_industry.3.c: "Центральная Азия, это хорошее предложение"
 soviet_industry.2.t: "Устранение проблем в инфраструктуре"
 soviet_industry.2.desc: "Проблемы в инфраструктуре существуют по всему Союзу, но мы вынуждены выбирать для исправления только один регион. В Прибалтике очень мало инфраструктуры, но этот регион не очень выгоден для нас; Беларусь — богатый и процветающий регион, Россия — самая большая ССР и обременена проблемами инфраструктуры, и, наконец, есть Грузинская ССР, родина Сталина, которой тоже не помешало бы исправить инфраструктуру. Куда пойдут решения?"
 soviet_industry.2.a: "В странах Прибалтики очень мало инфраструктуры, исправление этой проблемы должно быть приоритетом"
 soviet_industry.2.b: "Беларусь – богатый и процветающий регион, которому необходима хорошая инфраструктура"
 soviet_industry.2.c: "Россия имеет серьёзные инфраструктурные проблемы, их решение важнее всего"
 soviet_industry.2.d: "Грузия станет хорошим местом для наших планов на будущее"
 soviet_industry.2.e: "Починить инфраструктуру в России или Грузии"
 soviet_industry.2.f: "Починить инфраструктуру в Беларуси или Прибалтике"
