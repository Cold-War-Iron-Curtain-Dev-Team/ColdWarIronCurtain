 SOV_WGR.1.d: "От: Первое главное управление Министерства государственной безопасности\nКому: Генеральный секретарь Сталин\n\nТема: Выборы 1949 года в Западной Германии и угрозы братскому социалистическому государству\n\nПервое главное управление, отвечающее в первую очередь за внешнюю разведку, изучило и внимательно следило за кампанией на первых выборах в Федеративной Республике Германии, которые, как ожидается, состоятся до конца 1949. В основном участвуют три партии; Христианско-демократический союз (ХДС) во главе с мэром Кельна Конрадом Аденауэром; Социал-демократическая партия (СДПГ) во главе с Куртом Шумахером; и Свободная демократическая партия (СДП) во главе с Францем Блюхером. Однако Коммунистическая партия Германии остается жизнеспособным кандидатом на выборах; во главе с видным немецким коммунистом Максом Рейманном.\n\nПервое главное управление внесло ряд предложений по изменению исхода выборов в Западной Германии в нашу пользу, включая отправку дополнительных агентов МГБ в Западную Германию, отправку финансовой помощи КПГ, и фальсификация голосов в пользу КПГ. Мы ожидаем, что Рейман будет поддерживать советскую политику в будущем, и рассчитываем, что меры по вмешательству в выборы обеспечат наш успех, одновременно дестабилизируя западный империалистический блок.\n\nПОДПИСАНО:\nВиктор Абакумов,\nНачальник Первого управления Министерства Государственной Безопасности"
 SOV_WGR.2.d: "От: Разведывательный отдел G-2, Армия США в Европе, Союзные оккупационные власти\nКому: Временное правительство Федеративной Республики Германии\n\nТема: Угрозы безопасности федеральных выборов 1949 г.\n\nНедавние действия СССР и его государств-сателлитов выявили ключевую уязвимость в безопасности предстоящих парламентских выборов в Федеративной Республике. Недавние утечки от наших агентов за железным занавесом, а также в Федеративной Республике выявили предполагаемые заговоры с целью изменить результаты выборов в пользу СССР путем фальсификации голосов в пользу Коммунистической партии Германии, или КПГ, во главе с известным коммунистом Максом Рейманом. Наши агенты также сообщили о заметном увеличении числа агентов МГБ, а также о пропаганде КПГ в крупных городах Германии.\n\nПоследствия фальсификации выборов могут быть катастрофическими; если Германия станет коммунистической, это повлияет не только на безопасность НАТО и Западной Европы, но и на баланс сил в мире.\n\nНемедленное осуждение вмешательства в выборы и арест агентов МГБ, а также усиление безопасности выборов должны гарантировать безопасные и демократические выборы в Федеративную Республику.\n\nПОДПИСАНО\nГенерал Люциус Д. Клей\nКомандующий армией США в Европе"
