 SOV_Amendments_to_the_law_on_labour_collectives: "Поправки к закону "О трудовых коллективах""
 SOV_Amendments_to_the_law_on_labour_collectives_desc: "Принятие поправок к закону "О трудовых коллективах" формализовало возможности, уточнило роль трудового коллектива в принятии решений и дало ему больше административных возможностей влиять на управление предприятием и осуществлять свои законные полномочия."
 SOV_Start_Small_experiment: "Начать "Маленький" Эксперимент"
 SOV_Start_Small_experiment_desc: "В связи с реализацией направлений деятельности, предусмотренных постановлением ЦК КПСС и Совета Министров СССР № 814 "О мерах по ускорению научно-технического прогресса в народном хозяйстве", где определены дополнительные меры по стимулированию разработки и внедрения новой техники и технологии, на предприятиях Ленинграда будет проведен эксперимент, предусматривающий совершенствование оплаты труда инженерно-технических работников. В качестве базы эксперимента выбраны ведущие производственные объединения Ленинграда. Смысл эксперимента заключается в выполнении плановых заданий по разработке и внедрению новой техники и технологии меньшим числом инженерно-технических работников при дополнительном стимулировании их труда за счет сэкономленного фонда заработной платы."
 SOV_Start_Big_experiment: "Начать "Большой" Эксперимент"
 SOV_Start_Big_experiment_desc: "В соответствии с постановлением ЦК КПСС и Совета Министров СССР №. 659 "О дополнительных мерах по расширению прав производственных объединений (предприятий) промышленности в планировании и хозяйственной деятельности и усилению их ответственности за результаты работы" в Министерстве тяжелого машиностроения СССР, Министерстве электротехнической промышленности СССР, Министерстве пищевой промышленности Украинской ССР, Министерстве легкой промышленности Белорусской ССР и Министерстве местной промышленности Литовской ССР будет проведен экономический эксперимент. Смысл эксперимента заключается в том, чтобы проверить, как будут работать предприятия в условиях самофинансирования, без мелочной опеки со стороны министерств. Предприятиям будет предоставлена возможность самостоятельно использовать часть средств единого (общеминистерского) фонда развития науки и техники для проведения по собственной инициативе проектных работ по созданию новой техники и компенсации повышенных затрат при ее разработке, а также расширены права в расходовании фондов заработной платы и фонда материального поощрения для установления надбавок к окладам и тарифным ставкам за высокую квалификацию и достигнутые результаты труда для всех категорий работников."
 SOV_Special_Commission_for_the_Direction_of_the_Economic_Experiment: "Специальная комиссия по направлению экономического эксперимента"
 SOV_Special_Commission_for_the_Direction_of_the_Economic_Experiment_desc: "Специальная комиссия по руководству экономическим экспериментом занимается формированием и поддержанием надлежащих условий для проведения запланированного нами эксперимента."
 SOV_Special_Commission_for_the_Direction_of_the_Economic_Experiment_Improved: "Специальная комиссия по направлению экономического эксперимента"
 SOV_Special_Commission_for_the_Direction_of_the_Economic_Experiment_Improved_desc: "Специальная комиссия по направлению экономического эксперимента занимается формированием и поддержанием надлежащих условий для проведения запланированного нами эксперимента."
