 SOV_Stalin_The_Zhdanov_Doctrine_desc: "Доктрина Жданова, созданная Андреем Ждановым, диктует, что мир разделился на два лагеря: империалистический и коммунистический; с нами как лидером последнего и Соединенными Штатами как главной империалистической державой."
 SOV_Stalin_Follow_the_Percentage_Agreements_desc: "На Ялтинской конференции мы договорились о границах нашей сферы влияния. Хотя мы, несомненно, заслуживаем большего, мы должны держать свое слово и не переступать границ."
 SOV_Stalin_Smuggle_Arms_to_Greek_Communists_desc: "В Греции разразилась гражданская война, и коммунистические силы храбро сражаются перед лицом западного гнета и интервенции. Мы знаем, что договорились об определенной сфере влияния в Ялте, но мы не можем сидеть сложа руки и смотреть, как гаснет огонь Революции."
 SOV_Stalin_Catch_Up_with_Western_Atomic_Research_desc: "Ядерная энергетика, как военная, так и мирная, станет одним из решающих факторов в предстоящей борьбе за выживание, и мы не можем позволить себе отстать в этой области от американцев."
 SOV_Stalin_Enact_a_Complete_Embargo_on_Yugoslavia_desc: "Маршал Тито и его союзники в Югославии отказываются вступать в Коминтерн, несмотря на наше естественное сходство. Нам нужно подключить нашу дипломатию, чтобы оказать на них давление."
 SOV_Stalin_Deport_Black_Sea_Greeks_desc: "Греческие меньшинства в Черноморском регионе будут депортированы в Грецию."
 SOV_Stalin_Increase_Funding_for_Western_Communist_Parties_desc: "Во Франции и Италии уже есть сильные коммунистические партии, но их душит политика правительства и радикальные буржуи. Мы должны поддерживать наших товарищей за границей всеми возможными и невозможными способами."
 SOV_Stalin_Suspend_Claims_on_Turkish_Lands_desc: "Один из вопросов, который мы пытаемся поднять, касается Турецких проливов, потому что владение ими даст нам полный доступ к Средиземному морю и океанам за его пределами. Однако это вне нашей сферы, поэтому нам следует отказаться от своих претензий."
 SOV_Stalin_Delay_Austrian_Independence_desc: "Австрийцы и три другие союзные державы требуют от нас независимости Австрии, однако мы чувствуем, что австрийцы должны оставаться в нашей власти еще какое-то время, поскольку они несут ответственность за две мировые войны, и мы не хотели бы третьей."
 SOV_Stalin_Assist_in_Greek_Reconstruction_desc: "Теперь, когда гражданская война в Греции закончилась, и благодаря нашей помощи коммунисты победили, пришло время пригласить их в Коминформ вместе с остальной частью Восточной Европы."
 SOV_Stalin_Establish_Military_Bases_in_Greece_desc: "Теперь, когда Греция находится под контролем коммунистов, мы должны расширить наше стратегическое влияние в Южной Европе и Средиземноморье, построив несколько баз для размещения наших войск в Греции."
 SOV_Stalin_Maintain_Pressure_On_the_Turkish_Border_desc: "Турецкое правительство до сих пор отказывалось от выполнения наших условий и претензий на проливы и надеялось на поддержку Запада, но если мы сможем добиться смены режима, новое правительство просто даст нам то, что мы хотим."
 SOV_Stalin_An_Ultimatum_to_Yugoslavia_desc: "Дерзкие попытки Тито и Югославии игнорировать нас и наши просьбы зашли слишком далеко, и пришло время им присоединиться к нам или столкнуться с мощью Красной Армии."
 SOV_Stalin_Push_For_Bosphorus_Border_Changes_desc: "Теперь, когда мы обеспечили существование дружественноё Турции, мы можем перекраивать границы так, как захотим. Здесь у нас две основные цели. Первое, естественно, это наш контроль над Турецкими проливами. Второй – создание государства для угнетенных курдов в Турции."
 SOV_Stalin_Recognize_the_Peoples_Republic_of_China_desc: "Радуясь тому, что наши братские китайские коммунистические силы выиграли гражданскую войну, мы первыми признаем на международном уровне новое правительство Китайской Народной Республики и отзовём признание буржуазной империалистической Китайской Республики."
 SOV_Stalin_Save_Northwestern_China_desc: "К сожалению, наши братья по оружию в Китае проиграли гражданскую войну, но перебрались в Маньчжурию, чтобы сформировать временное правительство, подальше от Гоминьдановского Китая. Мы будем всячески помогать правительству Северо-Западного Китая узаконить его власть."
 SOV_Stalin_The_Sino_Soviet_Treaty_of_Friendship_Alliance_and_Mutual_Assistance_desc: "В своих действиях по признанию КНР и отказу от признания Китайской Республики мы подписали Договор о дружбе, союзе и взаимной помощи, обеспечивающий более дружественное дипломатическое сотрудничество между Москвой и Пекином."
 SOV_Stalin_Prepare_For_the_Korean_War_desc: "Война в Корее! Ким Ир Сен и его армия перешли 38-ю параллель и наносят удар вглубь Южной Кореи. У нас есть 2 варианта: подождать и посмотреть, что произойдет, или принять более активное участие в обеспечении победы Севера."
 SOV_Stalin_Send_Military_Advisors_desc: "Прямое вмешательство на данном этапе слишком рискованно, но мы можем позволить себе послать военных «советников». Вовлекаются ли они в конфликт — не наша проблема."
 SOV_Stalin_Establish_the_64th_Fighter_Aviation_Corps_desc: "64-й истребительный авиационный корпус станет специальной авиаэскадрильей добровольцев в Северной Корее, которая сможет бороться с самолетами буржуазных стран в небе."
 SOV_Stalin_Increase_Korean_Production_Capabilities_desc: "Помимо отправки орудий, танков и самолетов, мы также должны стремиться увеличить способность Северной Кореи производить собственное оборудование и стать более самодостаточными."
 SOV_Stalin_Send_Infantry_Equipment_desc: "Северокорейцы остро нуждаются в пехотном снаряжении, винтовках и другом оружии. У нас большой арсенал, и мы дадим им несколько тысяч орудий для поддержки их борьбы с империалистами."
 SOV_Stalin_Provide_Surplus_Tanks_desc: "Кроме того, Северная Корея отчаянно нуждается в танках и бронетранспортерах, чтобы улучшить продвижение своей пехоты в южную Корею. Будут даны новые модели Т-54/55."
 SOV_Stalin_Direct_Intervention_In_the_Korean_War_desc: "Мы не можем рисковать тем, что режим Ким Ир Сена рухнет под натиском НАТО. Здесь нельзя дурачиться. Прямое вмешательство гораздо предпочтительнее более пассивной роли."
 SOV_Stalin_Ensure_Kim_Regime_Survival_desc: "Теперь, когда война закончилась, будет позором, если мы позволим режиму Ким Ир Сена рухнуть и все наши усилия пропадут даром. Нам нужно гарантировать выживание его правительства, чтобы показать Западу, что мы настроены серьезно."
 SOV_Stalin_Prepare_For_the_Asian_Liberation_War_desc: "После окончания гражданской войны Китай оставался сильно напряженным. Продвижение ООН к реке Ялу зашло достаточно далеко, и ходят слухи, что в этом могут быть замешаны НПСК и Восточный Туркестан. Мы должны быть готовы."
 SOV_Stalin_Military_Bases_in_East_Turkestan_desc: "Сейчас особенно важно усилить наше стратегическое влияние в Азии; Восточный Туркестан, будучи важнейшим союзником, позволяет нам размещать на своей территории базы и войска, готовые к любым непредвиденным обстоятельствам."
 SOV_Stalin_Provide_Guns_To_the_Military_Cliques_desc: "Военные группировки в Китае готовятся к бою, и отправка этим силам оружия увеличит наши шансы на победу в будущем конфликте."
 SOV_Stalin_Send_Surplus_Tanks_To_the_North_Koreans_desc: "Северокорейцам необходимо отправить больше излишков Т-54, а также более старые модели, чтобы гарантировать их независимость."
 SOV_Stalin_Expand_the_North_Chinese_Industrial_Base_desc: "Промышленность в Маньчжурии невелика, и народное правительство Северного Китая борется за рост своей экономики; помощь такой сверхдержавы, как мы, поможет им добиться успеха!"
 SOV_Stalin_Send_In_The_Aviation_Corps_desc: "Ситуация в Китае и Корее зашла достаточно далеко. Вместо того, чтобы посылать наземные войска, один из наших авиационных корпусов, вооруженный реактивными перехватчиками и тактическими бомбардировщиками, будет развернут в регионе для обеспечения максимальной безопасности"
 SOV_Stalin_Smuggle_Guns_To_the_Vietnamese_desc: "Вьетнамские коммунисты во главе с Хо Ши Мином сражаются с французскими колонизаторами и будут полезны в нашей борьбе в Азии. Они тоже получат оружие."
 SOV_Stalin_Call_For_A_General_Peace_in_Asia_desc: "Товарищ Сталин и Министерство иностранных дел призвали лидеров обеих сторон, коммунистов и империалистов, прийти к соглашению по земельным спорам, а не сражаться и умирать. Это странная перемена взглядов Сталина."
 SOV_Stalin_Send_The_Armed_Forces_desc: "Ситуация в Азии ухудшилась достаточно, чтобы оправдать наше вмешательство. Несколько дивизий Советской Армии перебрасываются в стратегически важные точки региона для поддержания порядка."
 SOV_Stalin_The_Khabarovsk_War_Crimes_Trials_desc: "12 бывших военнослужащих японской Квантунской армии сегодня предстанут перед судом. Они обвиняются в создании и применении бактериологического оружия в нарушение Женевского протокола 1925 года."
 SOV_Stalin_Recognize_Vietnams_Independence_desc: "Теперь, когда Вьетнам освободился от оков французских колонизаторов, мы признаем их независимость и будем добиваться их вступления в ООН."
 SOV_Stalin_Purge_the_Leningrad_Dissenters_desc: "После смерти Жданова Ленинградская ячейка потеряла своё влияние и стала удобной мишенью во внутренней политической борьбе. Маленков и Берия обвиняют группу ленинградских коммунистов, среди которых Кузнецов Алексей Александрович и Вознесенский Николай Алексеевич, во вражеско-подрывной работе и коррупции, а также использовании служебного положения в личных корыстных целях. Пора положить конец их бесчинствам."
 SOV_Stalin_Hold_The_Pavlovian_Session_desc: "В честь 100-летия со дня рождения И. П. Павлова необходимо провести юбилейную Павловскую Сессию. Мы должны решить проблемы с буржуазными учениями и возвысить достижения советской науки!"
 SOV_Stalin_Push_Khrushchev_To_Found_The_Black_Cat_Gang_desc: "Хрущёв является отъявленным ревизионистом. Мы должны скомпрометировать его и подсадить на крючок. Для этого сфабрикуем дело о его связях с нашумевшей бандой "Чёрная Кошка". После этого он уже не отвертится и будет играть по нашим правилам."
 SOV_Stalin_Punish_Khrushchev_For_His_Failure_desc: "Хрущев, как первый секретарь Московского обкома ВКП(б) и член Политбюро (Президиума) ЦК ВКП(б), имеет высокое положение и значительные возможности для продвижения собственных амбиций. Он не раз попадался на подстрекательстве и интриганстве. Мы должны принять жесткое и справедливое решение по его отстренению от всех занимаемых должностей и судить по всей строгости закона."
 SOV_Stalin_Deportation_of_Jehovahs_Witnesses_desc: "Из-за отказа служить в армии, отстранения от политики (свидетели Иеговы не вступали в компартию, комсомол и не разрешали своим детям вступать в ряды пионеров) и связей с США, Свидетели Иеговы столкнулись с противодействием со стороны Советской власти. Их учения были расценены как антисоветские. В связи с этим, в ноябре 1950 года Абакумов представил Иосифу Сталину план их депортации, и Сталин утвердил осуществление плана на март — апрель 1951 года."
 SOV_Stalin_Dismantle_The_Jewish_Anti_Fascist_Committee_desc: "Изначально ЕАК (Еврейский Антифашистский Комитет) был создан для продвижения идей социализма в еврейских общинах. Однако с годами ситуация изменилась. В наше время организованные группы евреев-сионистов создают нам немало политических и общественных проблем. Они целенаправленно проникают в партийные ячейки и занимают руководящие должности на заводах и других общественных предприятиях, находя в этом выгоду для своих сторонников. У них также немало друзей-сионистов в капиталистическом блоке, что несет значительную угрозу для внутренней безопасности страны. Эту проблему необходимо решить, пока они не нанесли нам серьёзного ущерба."
 SOV_Stalin_Further_Investigate_The_Mingrelian_Affair_desc: "Органы государственной безопасности Грузинской ССР начали дело в отношении руководящих работников, выходцев из Мингрелии. Им было предъявлено тяжкое обвинение в мингрельском национализме и ориентации на Турцию, а так же в коррупции и использовании служебного положения."
 SOV_Stalin_19th_Congress_Of_The_Communist_Party_desc: "Наконец-то наступил XIX съезд Коммунистической партии, и мы должны собраться, чтобы обсудить успехи нашего народа."
 SOV_Stalin_Arrest_The_Treasonous_Doctors_desc: "Начиная с 1952 года «Дело врачей» разрабатывалось органами МГБ под руководством подполковника М. Д. Рюмина, написавшего в 1951 году донос Сталину о «сионистском заговоре» в органах госбезопасности. 29 октября 1952 г. Игнатьев доложил Сталину, что специалисты-медики подтвердили факт преступного лечения кремлёвских руководителей. Сталин немедленно дал санкцию на арест главных заговорщиков."
 SOV_Stalin_Arrest_The_Beria_Clique_For_Treason_desc: "Лаврентий Берия не раз попадал под подозрение в связи с личными амбициями. Так было и с мингрельским делом, а так же многими другими эпизодами. Последней каплей в терпении Сталина стала достоверная информация о подготовке Берией покушения на него и захвата власти после его смерти."
 STALIN_Heavy_Industry_Development_desc: "Хотя у нас есть крупные промышленные центры по всей стране, наши возможности по производству тяжелого оборудования и машин по-прежнему отстают от мощностей западных производителей, таких как США. Это можно изменить только совместными усилиями по развитию нашей машиностроительной отрасли."
 STALIN_Utilize_German_Rocketry_Knowledge_desc: "Когда мы пронеслись по Германии в конце Великой Отечественной войны, мы захватили многих выдающихся немецких ученых, среди них есть несколько высококвалифицированных исследователей ракетных двигателей. Создав им все условия для работы, мы сможем расширить наши горизонты в ракетостроений."
 STALIN_Prioritize_Electronic_Developments_desc: "Каждый день на Западе в отделе электроники делаются новые успехи, и тем не менее во многих наших сельских районах отсутствуют элементарные энергетические объекты. Нам необходимо улучшить их инфраструктуру, а также идти в ногу с современными достижениями в области высоких технологий."
 STALIN_Aid_Ukranian_Reconstruction_desc: "Украина сильно пострадала от нацистов во время оккупации, и большая часть ее инфраструктуры была разрушена. Придется вложить много труда в её восстановление."
 STALIN_Rebuild_Ukranian_Agriculture_desc: "Нацисты во время войны разрушили много предприятий пищевой промышленности украинской республики, отправив в своё время её большую часть в третий рейх. Наши люди уже экономят продукты, поэтому нам необходимо вновь востановить селськое хозяйство УССР."
 STALIN_Rebuild_Destroyed_Dams_desc: "Многие плотины были разрушены во время войны, в результате чего многие деревни в окрестностях были разрушены, а плотины не могли обеспечивать эти регионы электроэнергией. Обе эти причины более чем достаточны для того, чтобы мы приступили к их ремонту."
 STALIN_Invest_in_the_Baltics_desc: "Балтийский регион сильно пострадал во время великой отечественной войны. Во время окупаций нацистами испытал на себе последствия политики выжженной земли. Необходимо вложить ресурсы в востоновление и развитие этих республик."
 STALIN_Rebuild_Stalingrad_desc: "В Сталинграде находятся могилы многих наших героев, место одного из переломных моментов Великой Отечественной войны. Однако все это не меняет того факата что это сейчас руйны, и нам неободимо восстановить как город так и промышленность."
 STALIN_Open_New_Metallurgy_Plants_desc: "Редкоземельные металлы становятся все более и более важными для производства высокотехнологичной электроники, современного оружия и транспортных средств. Расширение  и строительство новых предприятий по их добыче и производству даст нам улучшенную базу для дальнейшего технологического развития."
 STALIN_Complete_the_Don_Volga_Canal_desc: "Волгодонский канал — проект, жизненно важный для нашего сельскохозяйственного сектора на юге СССР, и завершив его, мы улучшим местную инфраструктуру и возможности развития и производства продуктов питания."
 STALIN_Repair_Mining_Pits_desc: "Востонавливая работу карьеров и промышленность в целом, мы можем увеличить экспорт и производство металла."
 STALIN_Eliminate_Infrastructure_Bottlenecks_desc: "Состояние наших дорог и общей инфраструктуры, хоть и являются полезным инструментом для замедления наступления супостатов, находится в плачевном состоянии, для торговли и развитие цепочек промышлености необходимио их строительство и модернизация."
 STALIN_Increase_Cement_Production_desc: "Цемент является жизненно необходимым материалом для строительства самых разных сооружений, от мостов и дорог до зданий и укреплений, и нам нужно его больше."
 STALIN_Build_New_Railways_desc: "Строительство новых железных дорог - хороший способ модернизации и развитие региональной инфраструктуры, а также упрощает транспортировку товаров и войск."
 STALIN_Connect_the_Union_desc: "Чтобы завершить наши новые промышленные и инфраструктурные проекты, мы должны создать обширную систему дорог и магистралей, которые соединят нашу огромную страну. От Ленинграда на Балтике до Севастополя на Черном море и до Владивостока на Дальнем Востоке, наш народ будут иметь свободу передвижения по своей родине."
 STALIN_The_Soviet_Armed_Forces_desc: "Наши вооруженные силы являются одними из самых мощных в мире, если говорить о размерах. Тем не менее, мы отстаем от Запада по уровню исследований и разработок в нескольких ключевых областях, прежде всего в реактивных технологиях и в военно-морском флоте."
 STALIN_The_Soviet_Airforce_desc: "Наша авиация сыграла большую роль в победе в Великой Отечественной войне, поскольку наши бесстрашные авиаторы сокрушили Люфтваффе. Но наступила новая эра полета, на этот раз оснащенная реактивным двигателем, и мы должны прыгнуть в эту эру с полной отдачей."
 STALIN_Expand_MiG_15_Production_desc: "Массовое производство МиГ-15, одного из лучших реактивных истребителей, созданных на сегодняшний день нашими товарищами-учеными, творит чудеса с возможностями ВВС."
 STALIN_Develop_Sakhallin_Airfields_desc: "Сахалинские аэродромы — крупнейшие аэродромы на Дальнем Востоке, но все же они удручающе малы. Их расширение принесет нам большую пользу."
 STALIN_Develop_the_Tu_16_desc: "Ту-16 — это проект реактивного стратегического бомбардировщика, предложенный КБ Туполев, и он выглядит очень многообещающе. Мы должны утвердить дальнейшие исследования и разработку этого проекта."
 STALIN_Invest_in_Supersonic_Fighters_desc: "Сверхзвуковые истребители — это будущее боевых действий «воздух-воздух», и мы не можем позволить себе отставать в этой важной области."
 STALIN_The_Soviet_Army_desc: "Красная Армия разгромила Вермахт и поставила Берлин на колени, снискав нам вечную славу во Второй мировой войне. Однако мы не можем почивать на лаврах, поскольку война постоянно меняется, и мы также должны меняться."
 STALIN_Begin_Mass_Production_of_the_T54_desc: "Основной боевой танк Т-54 — это наш новейший ОБТ, который намного превосходит любой серийно выпускаемый американский танк. Распространение его по всей нашей армии увеличит наше технологическое превосходство над Западом."
 STALIN_Rapid_Adoption_of_the_AK47_desc: "АК-47 — новейшая блестящая разработка Михаила Калашникова, это красивая штурмовая винтовка с инновационным дизайном (и не только), но она всё еще дешевая в производстве. Мы должны начать производство этого оружия прямо сейчас."
 STALIN_Expand_the_VDV_desc: "ВДВ - это элитный десантно-штурмовой род войск. Хотя тактика и стратегия их использования все еще формируются, бойцов ВДВ всё же хорошо иметь под рукой."
 STALIN_Increase_Soviet_Air_Defense_Forces_desc: "В дополнение к нашим самолетам, за оборону нашего неба также отвечают наземные подразделения ПВО. Увеличение таких юнитов, в свою очередь, повысит нашу обороноспособность."
 STALIN_The_Soviet_Navy_desc: "Советский флот после войны отстал от западного как по количественному, так и по качественному показателю. Даже если исключить из сравнения американские авианосцы, то мы всё равно не сможем на равных противостоять им на море. И хоть основной упор Министерства Обороны идёт на армию и авиацию, мы не должны игнорировать нужды ВМС и нам необходимо начать проектирование и строительство современного надводного и подводного флота."
 STALIN_Project_30bis_desc: "Проект 30бис — это название для современного первоклассного эсминца, который значительно улучшит эскортные возможности нашего флота, и мы должны вложить в него значительные средства."
 STALIN_Modernize_the_Black_Sea_Shipyards_desc: "Несмотря на большое количество верфей в черном море, все они либо сильно пострадали от войны, либо устарели. Необходимо провести масштабную работу по их обновлению и расширению.."
 STALIN_Study_German_Submarine_Designs_desc: "Мы захватили довольно много немецких подводных лодок и исследователей, которые их проектировали, в конце Второй мировой войны. Изучая конструкции подводных лодок, мы можем улучшить наш собственный подводный флот."
 STALIN_Ramp_Up_Submarine_Production_desc: "Подводные лодки — наш единственный шанс нанести какой-либо ущерб западным кораблям, если мы когда-нибудь придем к конфликту. Мы должны убедиться, что наш флот соответствует поставленной задаче."
  
 SOV_Stalin_Establish_the_Malenkov_Khrushchev_and_Beria_Troika_desc: "После смерти Сталина был создан совещательный орган или тройка из трех человек, чтобы исполнять правительства. Эта хрупкая группа, состоящая из Георгия Маленкова, Никиты Хрущева и Лаврентия Берии."
 SOV_Stalin_Investigate_Berias_and_Khrushchevs_Activities_desc: "Деятельность и действия Берии и Хрущева в ходе чисток и других действий внутри партии заслуживают второго взгляда, тем более, что они являются двумя из трех самых важных людей в СССР."
 SOV_Stalin_Suppress_the_East_Berlin_Uprising_desc: "Восстание в Восточном Берлине представляет прямую угрозу социалистическому образу жизни и играет на руку западным империалистам. Их действия не останутся безнаказанными."
 SOV_Stalin_Arrest_Lavrentiy_Beria_desc: "Берия представляет угрозу дальнейшему правлению этого правительства, особенно его власти над спецслужбами и полицией. Мы должны арестовать его и вывести из состава правительства, пока мы еще можем."
 SOV_Stalin_Arrest_Nikita_Khrushchev_desc: "Хрущев — грязный реформатор, угроза национальной безопасности и социалистическому братству Советского Союза. Мы должны арестовать этого урода и вывести из состава правительства, пока мы еще можем."
 SOV_Stalin_Reopen_Our_Embassy_in_Israel_desc: "Несмотря на то, что отношения с Израилем испортились, особенно после того, как в феврале возле нашего посольства взорвалась бомба, мы должны восстановить дружеские отношения, вновь открыв наше посольство в Тель-Авиве."
 SOV_Stalin_Grant_Crimea_to_the_Soviet_Republic_of_Ukraine_desc: "Крым по праву был территорией Украины, и теперь, когда Украина сама является частью СССР, будучи ССР, мы считаем целесообразным отдать Крым."
 SOV_Stalin_Re_Empower_the_Secretariat_desc: "Особенно в последние годы своей жизни товарищ Сталин стремился отодвинуть партию на обочину и сделать наше коммунистическое государство больше похожим на диктатуру одного человека. Пора вернуть Коммунистической партии ее законное место в нашем обществе"
 SOV_Stalin_Send_Back_West_German_POWs_desc: "Взяв в плен к концу Великой Отечественной войны тысячи немецких солдат, мы в них действительно больше не нуждаемся. Это было бы жестом доброй воли по отношению к Западу."
 SOV_Stalin_Extend_the_Government_Powers_desc: "Сталин не только отодвинул в сторону партию, но и закрыл партийный аппарат, еще больше уменьшив его значение и влияние. Нам нужно реанимировать его, чтобы укрепить партию."
 SOV_Stalin_Seek_the_Approval_of_the_Central_Committee_desc: "После генсека Хрущева ЦК является самой влиятельной и могущественной организацией в СССР. Нам потребуется его одобрение, если мы хотим добиться чего-то существенного."
 SOV_Stalin_Lower_Retail_Prices_desc: "Подтвердив контроль над ценами в сельскохозяйственном секторе, мы защитим наших сельскохозяйственников и обеспечим справедливую сделку для всех."
 SOV_Stalin_Establish_the_KGB_desc: "КГБ — Комитет государственной безопасности — это наш ответ ЦРУ. Он будет стремиться распространять наши интересы и идеологию повсюду, расправляться с внутренними инакомыслящими и, наоборот, сеять инакомыслие на землях наших врагов."
 SOV_Stalin_Establish_A_New_Diplomatic_Stance_desc: "Наша новая дипломатическая позиция покажется Западу более мягкой, возможно, превратив «железный занавес» в сетчатый забор. Но внешность обманчива. Мы можем не посылать свои силы, но мы все равно будем бороться за коммунизм по всему миру."
 SOV_Stalin_Clear_Out_the_Gulags_desc: "Еще один неприятный побочный продукт сталинской паранойи — невероятное количество политических заключенных, забитых в переполненную и перегруженную систему ГУЛАГ. Его очистка упростит нашу бюрократию, уменьшит наши расходы и завоюет доверие наших людей."
 SOV_Stalin_Investigate_the_Stalin_Purges_desc: "Ленинградское дело было грязным инцидентом, спровоцированным параноидальным и стареющим лидером, подозрительным ко всем в Союзе в заговоре с целью его убийства. Нам нужно оставить его позади и дистанцироваться от него."
 SOV_Stalin_Pressure_Scientists_for_the_Hydrogen_Bomb_desc: "Если американцы серьезно относятся к нашим угрозам, мы должны быть в состоянии нанести такой же ущерб, как и они. А для этого нам нужна водородная бомба, последняя разработка в технологии ядерного оружия."
 SOV_Stalin_Reduce_Criminal_Sentences_desc: "При Сталине люди получали самые суровые наказания за самые мелкие преступления. Это понизило мораль нашего народа и привело к тому, что мы потеряли его доверие. Нам нужно показать, что мы стремимся к истинной справедливости, независимо от того, намерены ли мы добиться ее на самом деле."
 SOV_Stalin_Begin_the_Virgin_Lands_Campaign_desc: "Кампания целинных земель направлена ​​на использование ранее нетронутых земель для сельского хозяйства и ферм. Это расширит наши возможности по производству продуктов питания и емкости для хранения продуктов питания."
 SOV_Stalin_Execute_Viktor_Abakumov_desc: "СМЕРШ возглавляет Виктор Абакумов, заместитель Берии и его главный чистильщик. Абакумова надо репрессировать, как он это сделал с сотнями, если не тысячами невиновных."
 SOV_Stalin_Push_for_Malenkovs_Resignation_desc: "Маленков никогда не представлял серьезной угрозы для дуумвирата, достаточной, чтобы оказать влияние на влияние, но все же был достаточно союзником Берии, чтобы мы могли заставить его уйти в отставку мирным путем."
  
 SOV_Stalin_Appoint_Merkulov_Head_of_the_MVD_desc: "Теперь, когда Берия поднялся на одну из видных руководящих должностей в СССР, его прежняя должность министра внутренних дел должна быть заменена, в данном случае, Всеволодом Меркуловым, одним из верных заместителей Берии."
 SOV_Stalin_Clean_the_Central_Committee_of_Khrushchevites_desc: "Поскольку мы арестовали Хрущёва и ликвидировали его влияние внутри тройки, мы должны вычеркнуть и очистить из партии всякое влияние его буржуазного ревизионизма."
 SOV_Stalin_Prepare_A_Mass_Release_Plan_desc: "Как ни парадоксально, подготовка плана массового освобождения для наших трудовых лагерей и тюрем гарантирует, что мы будем знать, что делаем, когда он вступит в силу."
 SOV_Stalin_Reform_the_Secret_Services_desc: "Возглавляя МВД, Берия осознает необходимость реформ, чего он не мог осуществить при товарище Сталине. Теперь, когда он ушел, мы можем перейти к новой эре внутренней безопасности."
 SOV_Stalin_Execute_Bulganin_desc: "Министр национальной обороны Николай Булганин известен как союзник Хрущева. Хотя он и является самым высокопоставленным красноармейцем в правительстве, он не может оставаться на своем посту."
 SOV_Stalin_Restart_of_the_Korenizatsiya_desc: "Коренизация была ранней советской политикой интеграции нерусских национальностей в партию и центральное правительство."
 SOV_Stalin_Emergency_Relief_for_the_Kolkhozy_desc: "Колхозы или система колхозов остро нуждаются в экстренной помощи из-за голода и потери урожая."
 SOV_Stalin_Cancel_Superfluous_Projects_desc: "Проекты, начатые товарищем Сталиным, такие как Дворец Советов, являются пустой тратой наших ресурсов, которые нужны в другом месте."
 SOV_Stalin_Redirect_the_Nuclear_Project_Towards_Civilian_Use_desc: "Вместо того, чтобы ограничиваться только оружием, мы должны бороться с нашим энергетическим кризисом, обратившись к ядерной энергии для производства электроэнергии и других гражданских целей."
 SOV_Stalin_Raise_Agricultural_Prices_desc: "Цены на урожай должны быть повышены, чтобы не отставать от спроса и предложения."
 SOV_Stalin_Reduce_Surplus_Equipment_Stockpiles_desc: "Излишки оборудования просто пылятся на наших складах, и, возможно, их использование или передача другим уменьшит количество ненужных товаров, которые нам приходится хранить."
 SOV_Stalin_Abolish_Internal_Passports_desc: "Внутренние паспорта в нашей стране лишь добавляют лишнего беспокойства и бесполезности в процесс передвижения по Союзу. Их отмена позволит обеспечить большую свободу передвижения в пределах наших границ."
 SOV_Stalin_Empower_the_Presidium_desc: "Президиуму нужно дать больше полномочий в нашем правительстве для принятия важнейших решений."
 SOV_Stalin_Soften_Quotas_For_the_State_Farms_desc: "Квоты совхозов всегда были высокими, их никогда не было достаточно для того, чтобы они могли это сделать. Чтобы отразить фактические цели, квоты будут уменьшены."
 SOV_Stalin_Fragment_the_Larger_Farms_desc: "Крупные совхозы стали неповоротливыми, и с ними слишком трудно иметь дело. Разделение этих ферм на более мелкие единицы облегчит управление и частично исправит наши проблемы."
  
 SOV_Stalin_Establish_the_Malenkov_Pervukhinn_and_Saburov_Advisory_Body_desc: "Теперь, когда товарищ Сталин пережил покушение против своей жизни, мы создадим специальную комиссию для поддержки его правления, в которую войдут Георгий Маленков, Председатель Совета Министров; Михаил Первухин, первый заместитель Председателя Совета Министров, председатель Госплана и Максим Сабуров, также первый заместитель Председателя Совета Министров."
 SOV_Stalin_Expand_the_GULAG_System_desc: "Стало совершенно ясно, что наша предыдущая система трудовых лагерей и тюрем не работала достаточно хорошо, разоблачая предателей внутри нашего правительства. Для укрепления безопасности будет расширена тюремная система ГУЛАГ."
 SOV_Stalin_The_Khrushchev_Trial_desc: "Товарищ Никита Хрущев — бывший высокопоставленный член партии, который пытался убить и отобрать власть у великого товарища Сталина. За свои преступления и правонарушения против СССР он будет предан суду высшей инстанции и немедленно приговорен к расстрелу."
 SOV_Stalin_Begin_Construction_on_the_Great_Northern_River_Reversal_Project_desc: "Товарищ Сталин выразил заинтересованность в изменении направления течения нескольких северных рек, чтобы отвести необходимую воду из Арктики в степи Средней Азии. Мы со всей поспешностью приступим к этому начинанию!"
 SOV_Stalin_The_Armenian_Azeri_Border_Problem_desc: "В период между империалистической Российской империей и образованием Советского Союза причерноморские страны Армения и Азербайджан, ныне ССР Союза, были независимыми. Однако граница всегда была спорной, даже сейчас, когда республики объединены СССР."
 SOV_Stalin_Deport_Georgian_SSR_Minority_Populations_desc: "Товарищ Сталин, как выходец из Грузинской ССР, проявлял немало внимания своей малой Родине. По его мнению сложились благоприятные обстоятельства для переселения нацменьшинств в свои родные регионы, что положительно скажется на межнациональной напряженности."
 SOV_Stalin_Investigate_Malenkov_Over_the_March_1953_Incident_desc: "После неудавшегося заговора врачей и покушения на Сталина Георгий Маленков, председатель Совета министров и предполагаемый преемник Сталина, попал под наблюдение. Его участие в этом деле подозрительно и сигнализирует о его попытках захватить власть."
 SOV_Stalin_Merge_the_GVD_and_MVD_desc: "У Министерства внутренних дел и Министерства обороны по сути одна и та же цель, стратегия и персонал, необходимый для выполнения их обязанностей. Чтобы не усложнять структуру правительства, эти две организации, ГВД и МВД, будут объединены."
 SOV_Stalin_Divert_the_Pechora_River_into_the_Volga_Basin_desc: "Поскольку река Печора является одной из рек, впадающих в Северный Океан, и находится в коротком списке для изменения направления течения, мы изменим русло реки в сторону от ее естественного русла в бассейн Волги, где она будет течь на большей части Западной России."
 SOV_Stalin_Transfer_Nagorno_Karabakh_and_Nakhchivan_desc: "Для решения армяно-азербайджанского пограничного спора мы вмешаемся в дела АзССР, а территории Нагорного Карабаха и Нахичивани отдадим Армянской Советской Социалистической Республике."
 SOV_Stalin_Transfer_Nagorno_Karabakh_to_Armenia_desc: "Для решения армяно-азербайджанского пограничного спора мы примем решение о передаче Нагорного Карабаха Армянской Советской Социалистической Республике, но территория Нахичивани остается спорной."
 SOV_Stalin_Deport_Armenians_from_Nagorno_Karabakh_and_Nakhchivan_desc: "Чтобы решить этот вопрос раз и навсегда, мы просто депортируем всех лиц армянского происхождения со спорных территорий Нагорного Карабаха и Нахичивани и не отдадим территорию ни одной из двух ССР."
 SOV_Stalin_Prepare_Central_Asian_Population_Transfers_desc: "Степи Средней Азии малонаселены, и мы должны воспользоваться этой возможностью, чтобы подготовить депортацию неугодных лиц в те районы, откуда они никогда не смогут выбраться."
 SOV_Stalin_Welcome_Suslov_Into_Stalins_Inner_Circle_desc: "Михаил Суслов, заведующий отделом пропаганды ЦК, был ценным помощником товарища Сталина во время его пребывания в должности. Он будет переведен во внутренний круг, став вторым секретарем Коммунистической партии Советского Союза, ответственным за повседневную деятельность партийного секретариата."
 SOV_Stalin_Revitalize_the_Caspian_Fisheries_desc: "Рыболовство в Каспийском море сталкивается с многочисленными проблемами, от нехватки рыбы до морального духа и устаревающей инфраструктуры. В кратчайшие сроки будет реализована государственная программа по увеличению и улучшению рыбной промышленности в этом районе."
 SOV_Stalin_New_Caspian_Irrigation_Schemes_desc: "Отводя всю воду из северных арктических рек, мы будем внедрять схемы массового орошения в районе Каспия, чтобы повысить урожайность сельскохозяйственных культур."
 SOV_Stalin_Deport_Azeri_Populations_in_Armenian_SSR_desc: "Азербайджанское население Армянской ССР стало беспокойным. Чтобы облегчить беспорядок и предотвратить споры, эти группы населения будут просто отправлены в Азербайджанскую Советскую Социалистическую Республику, чтобы жить среди своего народа."
 SOV_Stalin_Deport_Traitorous_Elements_in_Germany_desc: "Мятежные и буржуазные личности Восточной Германии, осмелившиеся восстать против нашей власти, будут сурово наказаны, высланы в отдаленные районы Казахстана до конца своей жалкой жизни."
 SOV_Stalin_Trial_of_the_14_desc: "В государственной измене и преступлениях против государства обвинены 14 высокопоставленных лиц в партии, в том числе Молотов, Микоян, Ворошилов и другие низшие лица в аппарате СССР. Все будут судимы по нашим законам и приговорены к смертной казни."
 SOV_Restructuring_the_Kazakh_SSR_desc: "Казахская ССР нуждается в реформировании и перестройке, особенно в связи с притоком в регион населения неказахской национальности."
 SOV_Establish_the_German_SSR_desc: "После депортации до миллиона восточных немцев, обвиненных в государственной измене, мы просто дадим им их собственную ССР, Германскую Советскую Социалистическую Республику, в Казахстане."
 SOV_Deport_Chechens_to_Tajikistan_desc: "Все представители чеченского меньшинства, находящиеся на территории Союза и более мелких ССР, будут депортированы в Таджикскую ССР, где они будут жить до конца срока."
 SOV_Incorporate_Northeastern_Kazakhistan_into_Russia_desc: "Северо-Восточный Казахстан малонаселен, но большинство населения составляют русские; мы просто присоединим эту территорию к Российской Советской Федеративной Социалистической Республике."
 SOV_Transfer_Karakalpak_ASSR_to_Kazakh_SSR_desc: "Каракалпакская АССР, входившая в состав Узбекской ССР, будет передана под управление Казахской ССР."
 SOV_Establish_the_Korean_SSR_desc: "С учетом большого корейского населения и беженцев, спасающихся от Корейской войны, мы создадим Корейскую Советскую Социалистическую Республику где будут жить только корейцы."
 SOV_Sorting_Out_the_Turkic_SSR_Mess_desc: "Тюркские ССР, включая Таджикскую, Узбекскую, Казахскую и Киргизскую ССР, остро нуждаются в исправлении проблем и реструктуризации для размещения переселяющегося населения со всего Союза."
 SOV_Transfer_Central_Asian_Ukrainians_to_Ukraine_desc: "Люди украинского происхождения, проживающие в Центрально-Азиатском регионе, будут переселены на свою родину - в Украинскую Советскую Социалистическую Республику, где они смогут жить со своим народом."
 SOV_Send_Central_Asian_Armenians_to_Armenia_desc: "Лица армянского происхождения, проживающие в Средней Азии, будут возвращены на свою родину в Армянскую Советскую Социалистическую Республику, где они смогут жить со своим народом."
 SOV_Stalin_Resettle_Uzbek_Populations_desc: "Узбекское население должно принадлежать Узбекской ССР, а не другим тюркским ССР. Депортации и переселения будут происходить со всей поспешностью."
 SOV_Stalin_Allow_Shelepin_Into_the_Presidium_desc: "Александр Шелепин, первый секретарь ВЛКСМ, доказал свою ценность для партии, особенно в воспитании нашей молодежи. За верность партии и ее идеалам он выдвигается в Президиум."
 SOV_Stalin_Purge_Gromyko_and_Ponomarenko_desc: "Андрей Громыко и Пантелеймон Пономаренко - два человека в партии Белорусской ССР, активно вовлеченные и сильно коррумпированные. Их действия и присутствие недопустимы в нашем аппарате."
 SOV_Stalin_Give_Kosygin_A_Place_in_the_Government_desc: "У Алексея Косыгина была бурная деятельность в нашем правительстве. Выйдя из Великой Отечественной войны кандидатом в члены Политбюро, он стал министром финансов, пока его покровитель Жданов не умер и его не перевели на более низкие должности. Теперь, когда ситуация стабилизировалась, мы снова дадим Косыгину место в правительстве в качестве министра финансов."
 SOV_Stalin_The_Golubtsova_Affair_desc: "Имеются внутренние сообщения о том, что председатель Совета министров Георгий Маленков проживает с женщиной по имени Голубцова, которая не состоит с ним в законном браке. Это будет тщательно изучено!"
 SOV_Stalin_Appoint_Zhukov_to_the_Defense_Ministry_desc: "Маршал Советского Союза Георгий Жуков проявил себя как великий герой, особенно в годы Великой Отечественной войны. В знак признания его заслуг мы присвоим ему высшее воинское звание в СССР - министр обороны."
 SOV_Stalin_Prepare_the_Succession_desc: "Сталин стареет и выражает желание уйти в отставку с поста генерального секретаря. Мы должны сделать все возможное, чтобы подготовить преемника."
 SOV_Stalin_Announce_Stalins_Retirement_desc: "Пришло время объявить нашему народу и всему миру об отставке товарища Сталина"
 SOV_Stalin_20th_Congress_of_the_Communist_Party_desc: "Пришло время 20-го съезда Коммунистической партии Советского Союза, и предстоит принять много решений..."
  
 KhrushchevGain: "Хрущев получит власть и влияние внутри партии"
 KhrushchevLoss: "Хрущев значительно потеряет власть и влияние внутри партии"
 KhrushchevArrest: "Хрущев будет арестован"
 BeriaGain: "Берия получит власть и влияние внутри партии"
 BeriaLoss: "Берия значительно потеряет власть и влияние внутри партии"
 BeriaArrest: "Берия будет арестован"
 StalinLive: "Сталин останется на посту Генерального секретаря Коммунистической партии"
 StalinDie: "Сталин поддастся своей болезни и умрет"
 MalenkovLoss: "Маленков значительно потеряет власть и влияние внутри партии"
 MalenkovArrested: "Маленков будет арестован"
  
  #KAGANOVICH FOCUSES 
 SOV_Analyse_the_results_of_the_Seventh_five_years_plan: "Анализ результатов седьмой пятилетки"
 SOV_Kaganovichs_Union: "СССР Кагановича"
 SOV_Kaganovichs_Union_desc: "Comrade Lazar Moiseyevich Kaganovich has assumed the post of General Secretary of the CPSU in the wake of Comrade Stalin's retirement. Widely seen as a staunch supporter of Stalin's policies, Kaganovich has promised to guide the People and Party to new heights. The Soviet Union seems poised to turn inward, putting its efforts toward the realization of Communism."
 SOV_Step_Away_From_the_Personality_Cult: "Отойдите от культа личности"
 SOV_Step_Away_From_the_Personality_Cult_desc: "Хотя деяния товарища Сталина бесчисленны, и его действия не только спасли Советский Союз в его самые мрачные моменты, но и дали Союзу возможность двигаться вперед, он был лишь одним из многих, кто отдал свою жизнь и пожертвовал своими личными интересами, содействуя общему благу. Вот почему крайне необходимо выйти из тени Сталина, приняв ленинские идеи о привлечении всех способных людей на благо коммунизма и партии, создание единства в изобразительном искусстве Союза, позволит социалистическому реализму отойти от культа личности и идти своим ходом, молча и медленно смещая культ Сталина с главного пьедестала внимания партии, пока Политбюро размышляет о будущем художественной души нации."
 SOV_Focus_on_the_Greater_Good: "Сосредоточьтесь на высшем благе"
 SOV_Focus_on_the_Greater_Good_desc: "Collectivism is one of the most important values of a communist. While the imperialists view their own countrymen as tools to be exploited, Comrade Lenin taught us a more civlized way. We must refocus our propaganda toward the dedication and heroism of the Soviet people, the torchbearers of the communist cause."
 SOV_Refocus_Propaganda_Toward_Lenin: "Переориентируйте пропаганду на Ленина"
 SOV_Refocus_Propaganda_Toward_Lenin_desc: "During Comrade Stalin's leadership, a Cult of Personality was created around him. Though Stalin was a great man, in this case, he was in error. Stalin was but a faithful servant of Lenin, and we must teach our people once more to not be loyal to men, but to the Soviet ideal. Lenin lived, Lenin lives, and Lenin will live as long as we remain loyal to Lenin's cause."
 SOV_Empathise_the_Collective_Leadership: "Стипатии коллективному управлению"
 SOV_Empathise_the_Collective_Leadership_desc: "The Soviet Union is not an autocracy like the Russian Empire before her. Comrade Kaganovich might be the first among equals, but the Politburo as a whole must particpate in the governance of our great Union, upholding the values of Soviet Democracy."
 SOV_Internal_Work_on_Errors: "Внутренняя работа над ошибками"
 SOV_Internal_Work_on_Errors_desc: "A communist must never sit on his laurels. The imperialists work every day to grow their power, and so we must look inward and engage in our own program of reform. This is not a betrayal of communist ideas, but a completion of it. We will restore the Party apparatus to full working order, from the smallest villages to the Central Committee itself. "
 SOV_Strengthen_the_party_Structure_and_Legality: "Укрепить партийную структуру и законность"
 SOV_Strengthen_the_party_Structure_and_Legality_desc: "Положения и правила необходимы для поддержания работоспособности любой системы. Если двигаться вперед, отказавшись от правления террора, верховенство закона станет новым механизмом, который будет руководить умами будущих членов партии. Используя строгие методы регулирования решений, следуя твердым правилам манер, организации и народного участия, аппарат партии станет разумом государства, что обеспечит равное представительство всех ее членов в соответствии с идеями социализма и позволит лучше провести коллективизацию власти в рамках Коммунистической партии."
 SOV_Analyse_COMECON_Efficency: "Анализ эффективности СЭВ"
 SOV_Analyse_COMECON_Efficency_desc: "СЭВ был одной из поздних идей Сталина не только объединить коммунистические государства, но и создать общий рынок, способный конкурировать с рынками Запада. Однако многие члены партии и институты, отвечающие за экономическое планирование как на международном, так и на национальном уровнях, рассматривали СЭВ как способ отнять у Советского Союза ценные ресурсы, не получая взамен никакой реальной прибыли. Глубокий анализ организации позволит администрации Кагановича найти новый способ использования этого дипломатического инструмента таким образом, чтобы каждый член, включая Советский Союз, мог счесть его полезной организацией, далеко выходящей за рамки простой формальности со стороны Министерства иностранных дел."
 SOV_Recreate_the_Komintern: "Возрождение Коминтерна"
 SOV_Recreate_the_Komintern_desc: "После того, как сталинская интерпретация международных отношений стала твердой, как железо, многие члены партии отошли от первоначальных ленинских идей о продвижении революции, красной, как солнце, которое могло бы сиять над миром. Сталин продвигал прагматизм в Министерстве иностранных дел с целью расширения отношений Советского Союза с Западом и улучшения международного положения Советского Союза как дипломатического государства. Однако постоянные нападки Запада на товарищей по всему миру показали, что независимо от позиции советского правительства, капиталисты будут вступать в заговор против коммунистического движения во всем мире. Имея это в виду, реорганизация Коминтерна позволит коммунистическим организациям во всем мире получить достаточно информации и помощи для эффективного противодействия многочисленной агрессии, которую Соединенные Штаты и их союзники совершали против пролетариата, и его борьбы за самоорганизацию против буржуазии."
 SOV_Reorganise_the_Party_Status: "Реорганизовать статус партии"
 SOV_Reorganise_the_Party_Status_desc: "The Communist Party was always meant to be a mass organization. Sadly, the Party has become disconnected from the working class, a state of affairs that runs contrary to Marxist-Leninist doctrine. The Party's rolls will be expanded, adding millions of new voices to the chorus of our great Communist Party."
 SOV_Make_New_Legal_Frameworks: "Создавайте новые правовые рамки"
 SOV_Make_New_Legal_Frameworks_desc: "The Soviet state apparatus is in great need of reform. New legal frameworks will be created to clearly define the powers and duties of bureaucrats and officials and give them the necessary breathing room to best perform their duties."
 SOV_Start_the_program_of_Militsiya_Motorization: "Запустить программу моторизации полиции"
 SOV_Start_the_program_of_Militsiya_Motorization_desc: "The Militsiya are responsible for law enforcement in the country, equivalent to police officers in the western democracies. Allocating more modern police cars for the militsioners will make stopping crime a far easier task and keep our streets safe. No one who steals from the Soviet people will get away."
 SOV_Create_the_Commission_on_studying_and_amnesty: "Создать Комиссию по изучению и амнистии"
 SOV_Create_the_Commission_on_studying_and_amnesty_desc: "Stalin's last round of purges before his retirement put a great many people into the Gulags. Though he was certainly right to root out the would-be capitalists from the Party, our prison population is unreasonably high. Comrade Kaganovich has proposed a general amnesty for many GULAG inmates and a commission to study the cases of certain more high-profile prisoners. Let no one say the Party is not merciful."
 SOV_Begin_Internal_Bond_Repayment: "Начать погашение внутренних облигаций"
 SOV_Begin_Internal_Bond_Repayment_desc: "Like many countries, the Soviet government raises revenue through the sale of state bonds. However, this results in the accumulation of debt, much of which is owed to our own citizens. We should tighten our belts in the short term if it means making good on our debts and demonstrating fiscal responsibility to the People."
 SOV_Make_Specialized_Education_Free: "Сделать профильное образование бесплатным"
 SOV_Make_Specialized_Education_Free_desc: ""Give me four years to teach the children and the seed I have sown will never be uprooted".\n\n Comrade Lenin's words ring true now more than ever. As our world becomes more technologically advanced, our education system must answer the challenge. Effective immediately, all technical schools and universities will be free for qualified students. Everyone has the opportunity to learn in the Soviet Union."
 SOV_Introduce_Peoples_Control_Committee: "Представить комитет комиссии народного контроля"
 SOV_Introduce_Peoples_Control_Committee_desc: "The People's Control Commission Committee is a semi-governmental organization consisting of the Soviet masses who volunteer their time to scrutinize the conduct of government officials. Though the idea has existed since 1920 in some shape or form, Comrade Kaganovich has expanded their authority. PCCCs will have the power to reprimand, fine, or even press charges against corrupt officials."
 SOV_Replace_Lysenko_System: "Заменить систему Лысенко"
 SOV_Replace_Lysenko_System_desc: "During the Stalin era, biologist Trofim Lysenko's eccentric theories on genetics and agriculture were endorsed by the state, with traditional Mendelian geneticists persecuted. Poor crop yields over the years have proven Lysenkoism to be a failure at best and quackery at worst with our current understanding of science. We will rejoin the scientific community when it comes to genetics and get our agriculture back on track."
 SOV_Refocus_Planning_Toward_Consumer_Goods_Output: "Переориентация планирования на производство потребительских товаров"
 SOV_Refocus_Planning_Toward_Consumer_Goods_Output_desc: "Soviet industrial capacity has for the most part been focused on heavy industry. Necessary during the initial industrialization and Great Patriotic War, our economy is in good enough shape to refocus production toward consumer goods. The Soviet people will truly enjoy a workers paradise and put the imperialists to shame."
 SOV_Introduce_Pension_for_all_Workers_Groups: "Ввести пенсию для всех рабочих групп"
 SOV_Introduce_Pension_for_all_Workers_Groups_desc: "Article 120 of the Soviet Constitution mandates social insurance for the old, sick, and those physically unable to work. In accordance with the constitution, old age pensions will be extended to all classes of workers, no matter their skill or role."
 SOV_Reform_Gardening_and_livestock_Ownership: "Реформа садоводства и животноводства"
 SOV_Reform_Gardening_and_livestock_Ownership_desc: "During the process of collectivization, farmers were allotted small private plots for their homes. Analyses of our kolkhozes have repeatedly shown that the private plots have become essential for our food supplies. Though a return to the days of kulaks is out of the question, expanding private plots and livestock will improve morale and standards of living on the collective farms."
 SOV_Create_Roadmap_for_Internal_Debt_Repayment: "Создать дорожную карту для погашения внутреннего долга"
 SOV_Create_Roadmap_for_Internal_Debt_Repayment_desc: "Our initial repayment of internal debt was a good start but we need to establish a solid plan for repaying the rest of our debts back to the people. Though it might limit our spending on other affairs of state, ensuring the continued solvency of our financial system and the trust of our people is worth any price."
 SOV_Principle_of_Budgetary_Responsability: "Принцип бюджетной ответственности"
 SOV_Principle_of_Budgetary_Responsability_desc: "The Soviet people cannot spend more money than they have, yet their government can. The Party, which under Marxist principles is formed from the working masses, must not get any special treatment. We will get our checkbooks in order and govern the nation with a steady and responsible hand."
 SOV_Analyse_the_results_of_stalin_five_years_plan: "Проанализируйте результаты последнего пятилетнего плана"
 SOV_Analyse_the_results_of_stalin_five_years_plan_desc: "The Fifth Five Year Plan was the last to happen under Stalin's leadership, prioritizing the expansion of heavy industry, infrastructure, and the reduction of costs. Comrade Kaganovich has tasked GOSPLAN with analyzing its results and making recommendations as to the course to take with the next Five Year Plan."
 SOV_Focus_on_application_of_Leninist_Principles: "Фокус на применении ленинских принципов"
 SOV_Focus_on_application_of_Leninist_Principles_desc: "Marxism-Leninism is Marxism put into action, the science that guides our path to communism. Stalin was a faithful servant of Leninist teaching, and so is Comrade Kaganovich. The party ranks must read and re-read Lenin's theories and apply them in their daily work."
 SOV_Maintain_Unity_of_Central_Comittee_and_Party_Apparatus: "Сохранять единство ЦК и партийного аппарата"
 SOV_Maintain_Unity_of_Central_Comittee_and_Party_Apparatus_desc: "The Party apparatus is an enormous machine operated by a very small Central Committee. The Leninist principle of Democratic Centralism must be maintained if the Party is to prosper. The Central Committee and the Party ranks will think with one mind, speak with one voice, and work toward one goal."
 SOV_XXIth_CPSU_Congress: "XXI съезд КПСС"
 SOV_XXIth_CPSU_Congress_desc: "The 21st Congress of the CPSU will be the first under General Secretary Kaganovich. He has proposed a new program of political and social reform for the Supreme Soviet to ratify, focusing on building a better society for the common Soviet citizen. A new era of Socialism draws near and the whole Party is ready to realize it in full."
 SOV_Introduce_People_Control_Into_Law_Enforcement: "Внедрить народный контроль в правоохранительные органы"
 SOV_Introduce_People_Control_Into_Law_Enforcement_desc: "The Soviet Militisya are meant to protect the people from crime. It is wholly unacceptable, then, that some members of this organization are crooks themselves, abusing the public trust and their authority for personal gain. Just as the Peoples Control Commission scrutinizes the Party apparatus, we must give the people the right to demand accountability from law enforcement as well."
 SOV_Strengthen_Procurator_Office_And_Expand_PPC_Cooperation: "Укрепление прокуратуры и расширение сотрудничества с КПП"
 SOV_Strengthen_Procurator_Office_And_Expand_PPC_Cooperation_desc: "Realizing the principle of popular control over law enforcement, the PPCs will be given authority to refer wrongdoing by militsioners to the procurators. The procurators in turn will be given more funding to root out crime and corruption from our Socialist Motherland."
 SOV_Improve_Militsoners_Training_and_Equipment: "Улучшение обучения и снаряжения милиции"
 SOV_Improve_Militsoners_Training_and_Equipment_desc: "The Militsiya has slacked in its duties to fight crime and protect the Soviet people. Comrade Kaganovich has ordered that the Militisiya be given access to whatever weapons, vehicles, and equipment it needs to keep the peace. New and current militiamen will be subject to stricter training and discipline standards as well, to ensure they are worthy of the trust we give them."
 SOV_Hire_More_Rural_Militsioners: "Наймите больше сельских милиционеров"
 SOV_Hire_More_Rural_Militsioners_desc: "The Militsiya has largely been an urban police force, leaving our rural areas vulnerable to crime. We will train new militsioners from rural areas to better police the less populated parts of the country."
 SOV_Strengthen_High_Level_Party_Disciplines: "Укрепить партийную дисциплину до высокого уровня"
 SOV_Strengthen_High_Level_Party_Disciplines_desc: "Положения и правила необходимы для поддержания работоспособности любой системы. Если двигаться вперед от правления террора, верховенство закона станет новым механизмом, который будет сиять в умах будущих членов партии. Используя строгие методы регулирования решений, следуя твердым правилам манер, организации и народного участия, аппарат партии станет ее собственным разумом, что обеспечит равное представительство всех ее членов в соответствии с идеями социализма и позволит лучше провести коллективизацию власти в рядах Коммунистической партии."
 SOV_Introduction_of_Peoples_Control_into_Education: "Внедрение Комиссии народного контроля в сфере образования"
 SOV_Introduction_of_Peoples_Control_into_Education_desc: "The People's Control Commission has a great stake in the improvement of our education system, after all, many of its members are mothers and fathers themselves. The PPC will be given the authority to scrutinize our schools and ensure our children receive only the finest Soviet education."
 SOV_Fund_Expansion_of_Elementary_and_Medium_Schools: "Фонд расширения начальных и средних школ"
 SOV_Fund_Expansion_of_Elementary_and_Medium_Schools_desc: "Access to education is not yet equal among all parts of the Union, and many areas remain underserved by the school system. New elementary and middle schools will be built to provide primary education for our nation's youth in all parts of the Motherland. No child will be left behind."
 SOV_Expand_Pedagogy_Education_Schools: "Расширить школы педагогического образования"
 SOV_Expand_Pedagogy_Education_Schools_desc: "An expanded school network will require more teachers to staff it. New teachers academies will be built to train a new generation of educators in the latest innovations in pedagogy. Education will be the road to communism!"
 SOV_Expand_numbers_of_Technical_Students: "Увеличить количество студентов-техников"
 SOV_Expand_numbers_of_Technical_Students_desc: "The fields of science and engineering have seen unparalleled progress during the last century. A new generation of industry, electronics, and computers will require a new generation of scientists and engineers to keep us in the fray with the imperialists. Any students who demonstrate competency in mathematics and science should be afforded every opportunity the state has to be educated in the technical disciplines."
 SOV_Expand_numbers_of_Medical_Students: "Увеличить количество студентов-медиков"
 SOV_Expand_numbers_of_Medical_Students_desc: "The Soviet healthcare system is in need of reform and lags behind the imperialist powers. Those students who demonstrate competency and interest in medicine should be given every opportunity the state has to be educated in medical science."
 SOV_Overhaul_Rural_Education: "Капитальная переделка сельского образования"
 SOV_Overhaul_Rural_Education_desc: "Comrade Lenin made the education of women and the peasantry a priority for the new Soviet state. We must honor his legacy and reform our education system to meet the needs of rural citizens so that they will be able to take advantage of an increasingly technical world of agriculture."
 SOV_Introduction_of_Peoples_Control_in_the_Soviet_Healthcare: "Введение комиссии народного контроля в советское здравоохранение"
 SOV_Introduction_of_Peoples_Control_in_the_Soviet_Healthcare_desc: "The People's Control Commission must be put to work scrutinizing the state of our healthcare system. Many hospitals lack proper equipment, doctors do not take their duties seriously, and hospitals remain poorly administered. How can we tolerate such things when our own constitution enshrines the right to healthcare?"
 SOV_Expand_Medical_Research_Facilities: "Расширение медицинских исследовательских центров"
 SOV_Expand_Medical_Research_Facilities_desc: "Советская медицинская наука уже много лет отстает от империалистов. Товарищ Каганович понимает, что советский народ заслуживает лучшего. Мы направим наши лучшие медицинские умы на работу над новыми лекарствами и оборудованием, чтобы советские люди могли даже победить болезни."
 SOV_Expand_Medical_Equipment_Production_Facilities: "Расширение производственных мощностей медицинского оборудования"
 SOV_Expand_Medical_Equipment_Production_Facilities_desc: "Medical advancements are useless without the means to produce medicine. We will put our engineers to work on new medical production facilities and create a proper medical industry."
 SOV_Increase_Funding_For_Urban_Healthcare: "Увеличение финансирования городского здравоохранения"
 SOV_Increase_Funding_For_Urban_Healthcare_desc: "В наших городских центрах проживает большая часть населения, и они нуждаются в больницах, подобающих современным городам. Мы расширим сеть больниц в крупных городах Союза, предоставим современное оборудование и расширим национальную службу скорой помощи."
 SOV_Kickstart_Rural_Healthcare: "Подтолкнуть развитие сельского здравоохранения"
 SOV_Kickstart_Rural_Healthcare_desc: "Rural healthcare represents a challenge of its own, since there is less infrastructure for advanced hospitals or rapid response to medical emergencies. This does not mean that we cannot assign more doctors to rural regions, nor build more rural clinics. Everyone in our country deserves good healthcare."
 SOV_XXIIth_CPSU_Congress: "XXII съезд КПСС"
 SOV_XXIIth_CPSU_Congress_desc: "Двадцать второй съезд КПСС находится на сессии, и товарищ Каганович имеет амбициозную программу политических реформ. Он напоминает нам, что быть коммунистом - значит быть революционером, и восхваляет комсомольскую молодежь, которая станет новым поколением нашей партии. Кроме того, товарищ Каганович намерен в полной мере реализовать советскую демократию, предоставив простому народу больше участия во всех делах управления. Давайте не будем довольствоваться существующим положением вещей, а будем вечно идти вперед к конечной цели - коммунизму!"
 SOV_Draw_A_Plan_of_Komsomol_Reform: "Создайте план комсомольской реформы"
 SOV_Draw_A_Plan_of_Komsomol_Reform_desc: "Всесоюзный ленинский коммунистический союз молодежи, или сокращенно "комсомол", является молодежным объединением Коммунистической партии. Хотя его члены еще не являются членами КПСС, они - ряды ее будущих поколений. Комсомол будет реформирован в организацию, действительно достойную готовить коммунистов будущего."
 SOV_Focus_Komsomol_Ideological_Education: "Фокус на комсомольское идеологическое воспитание"
 SOV_Focus_Komsomol_Ideological_Education_desc: "Образование всегда было на переднем крае коммунистической повестки дня. Сам товарищ Ленин провел успешную кампанию по ликвидации неграмотности. Однако, чтобы быть коммунистом, необходимо хорошо знать теории марксизма-ленинизма. Мы не можем допустить, чтобы коммунисты будущего были невежественны в ленинском учении или, что еще хуже, поддались соблазнам капитализма. Каждый комсомолец будет знать наизусть труды Маркса, Энгельса, Ленина и Сталина."
 SOV_Raise_Powers_and_Responsabilities_of_Komsorgs: "Увеличение полномочий и ответственности комсоргов"
 SOV_Raise_Powers_and_Responsabilities_of_Komsorgs_desc: "Как мы можем сделать комсомол учебной базой для наших будущих лидеров, если им не дают возможности быть лидерами? Комсорги получат больше полномочий и ответственности за повседневную работу комсомола, готовя нашу молодежь к отстаиванию советской демократии."
 SOV_Raise_Wages_in_Komsomol_Construction_Groups: "Повышение заработной платы в комсомольских строительных отрядах"
 SOV_Raise_Wages_in_Komsomol_Construction_Groups_desc: "Хотя мало кто осмелится говорить об этом, комсомольские стройотряды довольно плохо оплачиваются за ту ценную работу, которую они выполняют для Советского государства. Мы не капиталисты, и эти молодые строители коммунизма будут справедливо вознаграждены за свой труд."
 SOV_Support_for_Komsomol_Members_Getting_High_and_Technical_Educations: "Поддержка получения комсомольцами высшего и технического образования"
 SOV_Support_for_Komsomol_Members_Getting_High_and_Technical_Educations_desc: "Советский Союз испытывает хроническую нехватку рабочей силы, то есть у нас много работы для наших людей, но некому ее выполнять. Поощряя членов комсомола к получению высшего или технического образования, мы можем вырастить новое поколение профессионалов, готовых служить Советскому Союзу."
 SOV_Increase_Lower_Ranks_Responsabilities_to_weed_out_Fellow_Travelers: "Увеличьте обязанности нижних чинов, чтобы отсеять "попутчиков""
 SOV_Increase_Lower_Ranks_Responsabilities_to_weed_out_Fellow_Travelers_desc: "There are many youths who, though intelligent and capable, join the Komsomol merely to secure that vaunted Party job and the benefits that come with it without being truly committed to the communist cause. Everyone will be made to do their part, and those Komsomoltsy who shirk their duties will be removed from the organization."
 SOV_Introduce_Voting_For_Head_of_Komsomol: "Ввести голосование за главу ВЛКСМ"
 SOV_Introduce_Voting_For_Head_of_Komsomol_desc: "В отличие от так называемых западных "демократий", советская демократия охватывает все стороны жизни, от рабочего места до партийных органов. Позволяя нашим комсомольцам избирать руководителя организации, мы сможем вырастить поколение, знакомое с делом советской демократии и полностью преданное ему."
 SOV_Introduce_Peoples_Control_into_CPSU_Regional_Work: "Ввести Комиссию народного контроля в региональную работу КПСС"
 SOV_Introduce_Peoples_Control_into_CPSU_Regional_Work_desc: "Комиссия народного контроля до сих пор была сосредоточена на национальных партийных структурах, но областные и республиканские отделения коммунистической партии также должны быть предметом народного контроля. Мы не можем допустить коррупции или некомпетентности на любом уровне власти, чтобы не потерять из виду путь к коммунизму."
 SOV_Establish_Multimembers_Deputy_Districts: "Создание многомандатных депутатских округов"
 SOV_Establish_Multimembers_Deputy_Districts_desc: "Нет демократии без социализма, и нет социализма без демократии. Придерживаясь этого принципа, некоторые округа Верховного Совета должны быть назначены многомандатными, чтобы их более многочисленное население было справедливо представлено в рядах партии."
 SOV_Give_Verhovny_Soviet_power_to_decide_the_GENSEC_By_Voting: "Дать Верховному Совету право избирать Генерального Секретаря"
 SOV_Give_Verhovny_Soviet_power_to_decide_the_GENSEC_By_Voting_desc: "В настоящее время Генеральный секретарь избирается членами Политбюро, меньшего органа, который управляет Советским Союзом, когда Верховный Совет не заседает. Передача этих полномочий самому Верховному Совету гарантирует, что высшие чины нашей партии не превратятся в новую буржуазию, а останутся подотчетными партии и народу в целом."
 SOV_Introduce_Legal_Term_Limits: "Ввести юридические ограничения срока"
 SOV_Introduce_Legal_Term_Limits_desc: "Принцип диктатуры пролетариата обусловил необходимость того, чтобы руководство партии служило пролетариату без регулярной смены власти. Сам товарищ Сталин проработал на посту Генерального секретаря партии более трех десятилетий. Однако теперь, когда мы достигли развитой формы социализма, мы можем ввести ограничения по срокам пребывания на руководящих постах в партии, в том числе и товарища Кагановича, и влить в ее ряды свежую кровь."
 SOV_Peoples_Control_in_Reigonal_Shop_work: "Комиссия народного контроля в областной цеховой работе"
 SOV_Peoples_Control_in_Reigonal_Shop_work_desc: "Комиссия народного контроля - невоспетый герой советской демократии. По всему Союзу миллионы добровольцев из народа тщательно проверяют деятельность местных и региональных партийных отделений, добиваясь того, чтобы коррумпированные чиновники и разрушители быстро предстали перед судом. Их полномочия должны распространяться и на региональные цеха, чтобы рабочие могли по-настоящему защитить средства производства от любых потенциальных капиталистов из числа управленцев."
 SOV_Expand_Refrigirators_Production: "Расширить производство холодильников"
 SOV_Expand_Refrigirators_Production_desc: "На Западе даже самые бедные рабочие семьи могут позволить себе холодильник в своем доме, однако чаще всего эта необходимость современной жизни оказывается ограниченной домами аппаратчиков. В рамках более широкой программы инвестиций в потребительские товары необходимо уделить особое внимание тому, чтобы в каждом советском доме было достаточно холодильников."
 SOV_Create_The_Okean_Fish_Shop_Network: "Создать сеть рыбных магазинов «Океан»"
 SOV_Create_The_Okean_Fish_Shop_Network_desc: "Сеть рыбных рынков "Океан" будет служить государственной компанией по продаже всей рыбы и морепродуктов на всей территории Советского Союза."
 SOV_Expand_Rural_Shop_Network: "Расширить сеть сельских магазинов"
 SOV_Expand_Rural_Shop_Network_desc: "Многие сельские районы нашей Родины практически не имеют доступа к продуктовым магазинам и поэтому подвержены большему риску отсутствия продовольственной безопасности. Мы будем расширять количество и качество магазинов в сельской местности, чтобы все советские граждане имели доступ к достаточному количеству продуктов питания для своих семей."
 SOV_Overhaul_of_Shops_logistics_Network: "Глобальная переработка логистической сети магазинов"
 SOV_Overhaul_of_Shops_logistics_Network_desc: "Как бы нам ни хотелось это признать, длинные очереди и хронический дефицит стали неотъемлемой частью советского шопинга. Гордый советский рабочий не должен быть вознагражден за свои усилия тем, что ему приходится покупать хлеб во вторник, колбасу в пятницу и новый радиоприемник в следующем году. Мы упорядочим логистическую сеть наших магазинов, жестко накажем любые проявления коррупции или фаворитизма в рядах сотрудников, а также увеличим поставки и качество доступных товаров там, где это возможно."
 SOV_XXIIIth_CPSU_Congress: "XXIII съезд КПСС"
 SOV_XXIIIth_CPSU_Congress_desc: "В связи с введением ограничений на срок пребывания на посту Генерального секретаря товарищ Каганович принял благородное решение оставить пост Генерального секретаря и предоставить Верховному Совету возможность избрать ему замену на предстоящем съезде партии. Нам будет очень не хватать его руководства, но он ясно дал понять, что не позволит себе особого отношения."
 SOV_Decrease_The_Military_Numbers: "Уменьшить численность армии"
 SOV_Decrease_The_Military_Numbers_desc: "Советская армия, а до нее царская армия часто полагались на численность, чтобы победить своих врагов. Это могло сработать во времена мушкетов и огнестрела, или даже во время Великой Отечественной войны, но сегодняшние войны ведутся с помощью оружия, способного уничтожить целые города. Советские вооруженные силы должны стать не сбродом призывников, а профессиональной, высококвалифицированной силой, всецело преданной своему долгу меча и щита революции."
 SOV_Expand_the_NCO_Ranks: "Расширьте ряды унтер-офицеров"
 SOV_Expand_the_NCO_Ranks_desc: "В настоящее время унтер-офицеры не имеют большого авторитета в Красной Армии, являясь не более чем солдатами срочной службы, срок службы которых подходит к концу, или, что еще хуже, старыми прапорщиками, использующими свой псевдоавторитет для издевательств над рядовыми, чтобы те стали их прислугой. С другой стороны, американцы готовят сержантов к роли лидеров, которым доверено решать, как лучше выполнять приказы своих офицеров. Возможно, есть смысл расширить и обучить наши сержантские ряды для выполнения той же цели."
 SOV_Create_Fortified_Region_Far_East: "Создать укрепленный район на Дальнем Востоке"
 SOV_Create_Fortified_Region_Far_East_desc: "Дальний Восток не является домом для многих. Однако здесь находится наш Тихоокеанский флот, и он уязвим для атак Америки и ее союзников в Тихом океане. Если бы мы вступили в войну с империалистами, мы вполне могли бы дойти до Рейна, только чтобы американцы и их японские прихлебатели ударили нам в спину. Мы должны установить здесь сильное военное присутствие."
 SOV_Fortify_Vladivostok: "Укрепить Владивосток"
 SOV_Fortify_Vladivostok_desc: "Владивосток - это дом Тихоокеанского флота, меч и щит советского Дальнего Востока. В то время как основная часть нашей военной мощи сосредоточена на НАТО на западе, мы оставляем наши важнейшие владения на востоке уязвимыми для империалистического удара. Владивосток должен быть неуязвимым для вторжения любой ценой."
 SOV_Protect_the_Kurils: "Защитить Курилы"
 SOV_Protect_the_Kurils_desc: "Япония никогда официально не признавала наш суверенитет над Курильскими островами, несмотря на их поражение от наших рук в 1945 году. Если у них возникнут идеи вернуть "свои" острова силой, мы должны иметь достаточно большое военно-морское присутствие в регионе, чтобы сдерживать любые попытки вторжения."
 SOV_Build_up_the_Kamchatka_Naval_Base: "Создать Камчатскую военно-морскую базу"
 SOV_Build_up_the_Kamchatka_Naval_Base_desc: "Камчатка лежит на самых дальних рубежах советской родины. Ее изолированное расположение делает ее идеальным местом для современной базы подводных лодок для нашего Тихоокеанского флота, что позволит нам не только защищать наши территориальные воды, но и наносить удары по американскому сердцу."
 SOV_Establish_the_Ohotsk_Sea_Defensive_Perimeter: "Создать Охотский морской оборонительный рубеж"
 SOV_Establish_the_Ohotsk_Sea_Defensive_Perimeter_desc: "Охотское море является частью наших территориальных вод по праву, но остается уязвимым для американских и японских военно-морских сил. Сеть береговых оборонительных сооружений и радарных станций защитит его от любых нежелательных гостей."
 SOV_Develop_New_Anti_ship_Missiles: "Разработать новые противокорабельные ракеты"
 SOV_Develop_New_Anti_ship_Missiles_desc: "Ракета до сих пор находила применение против наземных и воздушных целей, но что насчет моря? Противокорабельная ракета - это многообещающая новая технология, против которой у империалистических флотов нет защиты. У нас нет оправдания, чтобы не инвестировать в такое ценное оружие."
 SOV_Create_Fortified_Region_North: "Создать укрепрайон Север"
 SOV_Create_Fortified_Region_North_desc: "Северные регионы Советского Союза простираются от могучего города Ленинграда, колыбели революции, до прохладных пустошей Баренцева моря. Здесь также расположены два наших военно-морских флота - Северный и Балтийский. Тесно сплоченная сеть наземных, воздушных и военно-морских средств необходима для сдерживания Запада от оспаривания нашего присутствия в северных морях."
 SOV_Prepare_Finnish_Defense_measures: "Подготовить меры антифинской обороны"
 SOV_Prepare_Finnish_Defense_measures_desc: "Финское правительство может поддерживать с нами дружеские отношения, но их реабилитация военных преступников и агрессоров против советского народа доказывает, что им нельзя доверять. Необходимо увеличить военное присутствие у наших сухопутных и морских границ с финнами на случай, если они забудут свое место."
 SOV_Establish_new_garrisons_on_the_Baltic_Coast: "Создать новые гарнизоны на Балтийском побережье"
 SOV_Establish_new_garrisons_on_the_Baltic_Coast_desc: "Балтийский флот в основном базируется в Калининграде, но есть и другие ключевые точки на Балтийском побережье, например, город Рига. Для защиты советской Прибалтики в регионе будут построены новые армейские базы и направлены дополнительные войска."
 SOV_Expand_the_bases_in_the_Barents_Sea: "Расширить базы в Баренцевом море"
 SOV_Expand_the_bases_in_the_Barents_Sea_desc: "Холодное Баренцево море - это место стоянки нашего Северного флота, хотя сфера его влияния гораздо шире. Хотя большинство северных островов негостеприимны для постоянного поселения людей, а некоторые даже не были открыты до 1920-х годов, некоторые станции мониторинга погоды и радары могли бы помочь нам следить за активностью НАТО."
 SOV_Build_Fortifications_in_Murmansk: "Построить укрепления в Мурманске"
 SOV_Build_Fortifications_in_Murmansk_desc: "Порт Мурманск является домом для нашего Северного флота, необходимым для растущего числа наших подводных лодок дальнего действия. Однако сам Мурманск уязвим как для воздушных, так и для морских атак, особенно со стороны сил НАТО, размещенных в близлежащей Норвегии. Сеть противокорабельных оборонительных сооружений и новое противовоздушное оборудование в значительной степени способствовали бы защите нашего северного форпоста."
 SOV_Expand_Missile_Defense_System_in_Kaliningrad: "Развернуть систему ПРО в Калининграде"
 SOV_Expand_Missile_Defense_System_in_Kaliningrad_desc: "Калининград - одна из наших самых важных баз на Балтийском море, и благодаря своей близости к Западу он, несомненно, будет одним из первых мест, куда направятся западные самолеты в случае войны. Калининград будет непоколебимым бастионом против империалистов, вооруженным до зубов лучшими противокорабельными и противовоздушными ракетами из нашего арсенала."
 SOV_Favourize_Troops_Mobility: "Поощрять мобильность войск"
 SOV_Favourize_Troops_Mobility_desc: "Советский Союз - самая большая страна на Земле, и защищать ее - задача не из легких. Американский проект "Интерстейт" вдохновил наши военные умы. Ребята из ГОСПЛАНа могут ворчать по поводу стоимости, но мобильная армия необходима для защиты революции от Берлина до Владивостока."
 SOV_Request_new_Artillery_Systems: "Запросить новые артиллерийские системы"
 SOV_Request_new_Artillery_Systems_desc: "Волны за волнами артиллерии заставили немцев бежать обратно в Берлин в последней войне. Обновленный арсенал, дополненный дальнобойными орудиями и ПГРК, несомненно, заставит НАТО бежать обратно в Вашингтон в следующей войне."
 SOV_Extend_Interceptors_Production_chain: "Расширить производственную цепочку перехватчиков"
 SOV_Extend_Interceptors_Production_chain_desc: "Ядерная стратегия НАТО полагается на флоты дальних, высотных реактивных бомбардировщиков, таких как B-52 и Avro Vulcan, чтобы пробить нашу противовоздушную оборону. Создание большего количества перехватчиков станет ключом к защите Родины от превентивного ядерного удара."
 SOV_Create_Fortified_Region_South: "Создать укрепрайон Юг"
 SOV_Create_Fortified_Region_South_desc: "Юго-западные регионы нашей страны разнообразны по рельефу, народам и промышленности. От восстановленного города-героя Сталинграда до побережья Крыма и всегда ценной нефти Азербайджана, Родине грозит катастрофа, если мы оставим их в качестве мягкого подбрюшья для наших врагов."
 SOV_Build_Nuclear_Bunkers_in_the_Caucasus: "Строить противоядерные бункеры на Кавказе"
 SOV_Build_Nuclear_Bunkers_in_the_Caucasus_desc: "Кавказские горы хорошо защищены и представляют собой сложную задачу для любого врага. Это делает их идеальными для строительства сетей высокозащищенных убежищ от выпадения радиоактивных осадков в случае ядерной войны."
 SOV_Expand_Moldova_Bunkers_Network: "Расширить бункерную сеть Молдовы"
 SOV_Expand_Moldova_Bunkers_Network_desc: "Оборона Молдавии... мягко говоря, недостаточная. С предоставлением некоторых дополнительных средств мы можем построить приличную сеть бункеров для защиты наших войск и основных гражданских лиц от обычных и ядерных атак."
 SOV_Modernize_Crimean_Coastal_Defense: "Модернизация береговой обороны Крыма"
 SOV_Modernize_Crimean_Coastal_Defense_desc: "Крым и Севастополь являются важными местами для контроля над Черным морем, но наши оборонительные сооружения в Крыму помнят начало Великой Отечественной войны или даже 30-е годы, поэтому они сильно устарели, поэтому мы должны их модернизировать, чтобы защитить Крым от возможной агрессии. Модернизация даст нам новые укрепления, корабельная оборона и противовоздушная оборона в Крыму и на подступах к Севастополю, чтобы предотвратить бомбардировку этого города."
 SOV_Protect_the_Black_Sea_Touristic_Coast: "Защитить Черноморский туризм"
 SOV_Protect_the_Black_Sea_Touristic_Coast_desc: "Побережье Черного моря представляет собой широкий спектр всевозможных туристических достопримечательностей, но оно не защищено от морских вторжений из Турции или бомбардировок западных самолетов. Мы должны построить сеть противовоздушной обороны и местные казармы, чтобы быстро реагировать в случае морского вторжения, поэтому мы должны улучшить наши оборонительные возможности в этом регионе."
 SOV_Boost_Nuclear_Delivry_Systems: "Улучшите системы доставки ядерного оружия"
 SOV_Boost_Nuclear_Delivry_Systems_desc: "В нашем ядерном арсенале не хватает систем для быстрой доставки из секретных складов в ракетные шахты ядерного оружия, поэтому мы построим обширную и простую систему доставки, состоящую из автомобильных и железных дорог и укрытий для нашего ядерного арсенала. Мы не можем допустить, чтобы наш арсенал был ослаблен отсутствием инфраструктуры"
 SOV_Create_Fortified_District_Central: "Создать Центральный укрепрайон"
 SOV_Create_Fortified_District_Central_desc: "В случае войны Центральная Россия уязвима для наземных атак, потому что она ничем не укреплена, такие районы, как Смоленск, Брянск, Курск и Белгород, были бы первой линией обороны Москвы, если вторжение пойдёт с Запада, но такие регионы, как Воронеж, Тула и Москва, являются важными промышленными регионами, поэтому их тоже нужно защищать, поэтому мы должны строить укрепления для защиты этих регионов."
 SOV_Build_More_Nuclear_Bunkers_in_the_Moscow_Area: "Строить больше противоядерных бункеров в Подмосковье"
 SOV_Build_More_Nuclear_Bunkers_in_the_Moscow_Area_desc: "Москва — наша столица и промышленный центр, все железные дороги связаны с этим великим городом, здесь находится наше правительство и высшие должностные лица. В случае ядерного уничтожения мы должны обеспечить их безопасность, чтобы восстановиться после такой трагедии. Мы должны построить дополнительные убежища в Подмосковье для защиты властей, светлейших умов Советского Союза, людей в городе и окрестностях нашей столицы."
 SOV_Boost_Western_Regions_Defensive_Missiles_Silos: "Усилить бункеры западных регионов"
 SOV_Boost_Western_Regions_Defensive_Missiles_Silos_desc: "Западная граница Советского Союза будет первым регионом, который подвергнется нападению Запада, наших нынешних оборонительных ракетных шахт недостаточно для защиты этих регионов от ядерных атак, поэтому создание новых шахт повысит способность защиты западных регионов в случае войны"
 SOV_Protect_Central_Asian_Republics_Airspace: "Защищать воздушное пространство республик Центральной Азии"
 SOV_Protect_Central_Asian_Republics_Airspace_desc: "По мере того, как мы идем в новую эру, нашей противовоздушной обороны становится недостаточно для защиты нашего неба от капиталистических шпионов, и, что еще хуже, в случае войны мы будем уязвимы для бомбардировок, тем более что наша промышленность находится в серьезной опасности, мы должны создать новую наземную сеть ПВО"
 SOV_Expand_Urals_and_Siberian_Military_Infrastructures: "Расширение военной инфраструктуры Урала и Сибири"
 SOV_Expand_Urals_and_Siberian_Military_Infrastructures_desc: "Уральский хребет и Сибирь — идеальные места для развития нашей военной инфраструктуры для создания укрытий для нашего правительства и важных чиновников на случай войны, ракетных шахт для реагирования на агрессию и, конечно же, железных дорог, соединяющих наиболее важные города в Сибири"
 SOV_Improve_Ground_Based_Air_Defence_Network: "Улучшить сеть наземных ПВО"
 SOV_Improve_Ground_Based_Air_Defence_Network_desc: "Узбекская ССР, Казахская ССР, Киргизская ССР, Таджикская ССР и Туркменская ССР - это среднеазиатские ССР, они в основном представляют собой огромную обширную территорию, не развитую промышленно и без больших городов, но мы должны иметь в виду, что мы должны защищать воздушное пространство этих регионы, потому что враг может нанести удар через них или послать самолеты-шпионы, потому что их образ мышления будет простым — на этих землях нет опасности, значит мы должны это изменить."
 SOV_Introduce_the_Fifth_Five_Years_Plan: "Представьте шестой пятилетний план"
 SOV_Raise_Agriculturale_Purchase_Prices: "Поднять закупочные цены на сельскохозяйственную продукцию"
 SOV_Introduce_Sovnarkhoz_Regional_Goods_Distribution_Management: "Внедрить региональное управление товародвижения Совнархоза"
 SOV_Expand_Regional_Consumer_Level_Planning: "Расширить региональное планирование на уровне потребителей"
 SOV_Implemant_Public_Control_in_Sovnarkhoz_Decision_System: "Внедрение общественного контроля в систему принятия решений совнархоза"
 SOV_Plan_the_Production_Expansion: "Планирование расширения производства"
 SOV_Invest_in_Non_Black_Soil_Regions: "Инвестируйте в нечерноземные регионы"
 SOV_Expand_the_Storage_Bottlenecks: "Исправьте проблемы хранилищ"
 SOV_Reform_the_Kolkhozes: "Реформа колхозов"
 SOV_Enlarge_Collective_Farms: "Увеличить колхозы"
 SOV_Deploy_Reinforced_Concrete_Into_Regional_Capitals: "Использование железобетона в региональных столицах"
 SOV_Accept_Regional_Concrete_Panel_Standards: "Принять региональные стандарты бетонных панелей"
 SOV_Start_Large_Scale_Deployment_Of_Mobile_Concrete_Combinates: "Начать широкомасштабное использование мобильных бетонных комбайнов"
 SOV_Expand_Modern_Lathe_Production: "Увеличение производства современных токарных станков"
 SOV_Modernize_Agriculturla_Machinery: "Модернизация сельскохозяйственной техники"
 SOV_Institute_New_Consumer_Goods_Production_Clusters: "Создание новых кластеров производства потребительских товаров"
 SOV_Develop_Oil_and_Gas_In_Transurals: "Добывать нефть и газ в Трансуралье"
 SOV_Overhual_Oil_Refineries_in_the_Caucasus: "Большие НПЗ на Кавказе"
 SOV_Expand_Production_Of_Civilian_Motor_Vehicles: "Расширить производство гражданских автомобилей"
 SOV_Overhaul_Public_Vehicle_Maintenance_Stations: "Капитальный ремонт станций технического обслуживания общественного транспорта"
 SOV_Expansion_of_Intercity_Public_Transportation: "Расширение междугороднего транспортного сообщения"
 SOV_Analyse_The_Results_Of_The_Fifth_Five_Years_Plan: "Анализ результатов шестой пятилетки"
 SOV_Introduce_The_Sixth_Five_Years_Plan: "Представить план седьмой пятилетки"
 SOV_Embrace_Deeper_Implementation_Of_Self_Management: "Более глубокое внедрение самоуправления"
 SOV_Decrease_Centrally_Planned_Target_Indicators: "Уменьшение количества централизованно планируемых целевых показателей"
 SOV_Expand_Economic_Independence_of_Industrial_Plants: "Расширение экономической независимости промышленных предприятий"
 SOV_Organize_Consumer_Needs_Frameworks: "Организовать рамки потребительских потребностей"
 SOV_Increase_Food_Prices_In_Agriculture: "Повышение цен на сельскохозяйственные продукты питания"
 SOV_Decrease_Prices_for_Replacement_Agricultural_Equipments: "Снижение цен на сельскохозяйственную технику"
 SOV_Allow_Internal_Entreprises_Funds: "Разрешить внутренние фонды предприятий"
 SOV_Lower_Rural_Taxes: "Понизить сельские налоги"
 SOV_Increase_Food_Purchases_Prices: "Увеличить цены на закупку продуктов питания"
 SOV_Introduce_Long_Run_Price_Targets_Plan: "Внедрить план долгосрочных целевых цен"
 SOV_Extend_Financial_Support_for_Less_Profitable_Industries: "Расширение финансовой поддержки менее прибыльных отраслей"
 SOV_Start_Industrial_Housing_Construction: "Промышленное жилищное строительство"
 SOV_Creation_Of_Modern_Civilians_Car_Production_Centers: "Создание центров производства современных автомобилей"
 SOV_Introduction_Of_Corn_Into_Ukraine: "Внедрение производства сладкой кукурузы в Украину"
 SOV_Build_The_North_Crimean_Water_Channel: "Построить Северо-Крымский канал"
 SOV_Continue_Stalins_Central_Asian_Canals: "Ускорение сталинского проекта по повороту реки"
 SOV_Attempt_Limited_Teslina_Campaign_In_Kazakhstan: "Ограниченная экспериментальная кампания по освоению целинных земель в КССР"
 SOV_Invest_Into_Fish_Processing_Fleet: "Расширьте флот кораблей рыбной промышленности"
 SOV_Expand_And_Upgrade_Large_Scale_Food_Storage_Network: "Расширьте и модернизируйте обширную сеть хранения продуктов питания"
 SOV_Accept_Kitov_Red_Book_Proposition: "Одобрить финансирование проекта "Красная книга"Китова"
 SOV_Expand_Computer_Related_Education_Facilities: "Расширение компьютерных отделов в учебных заведениях"
 SOV_Support_Technical_Related_Computer_Education: "Расширить техническое образование, связанное с компьютером"
 SOV_Reorganize_The_Computer_Design_Bureau_Into_NITsVTM: "Создание машиностроения и приборостроения"
 SOV_Acquire_The_Best_Western_Computers: "Приобретите лучшие западные компьютеры"
 SOV_Introduce_the_Best_Of_Both_Worlds_Hardware_Policy: "Внедрить в отношении аппаратного обеспечения политику «Лучшее из двух миров»"
 SOV_Request_New_Algorithms_For_The_Civilian_Industry: "Изучить реализацию новых предложений по алгоритмам гражданской промышленности"
 SOV_Push_For_New_Military_Algorithms: "Перенаправить бюджет на новые алгоритмы военной обороны"
 SOV_Adopt_New_Networking_Solutions: "Внедрить новые сетевые решения"
