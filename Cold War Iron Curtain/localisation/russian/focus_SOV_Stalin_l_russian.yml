 SOV_Decree_No_745: "Указ № 745 О дополнительных мерах по укреплению трудовой дисциплины"
 SOV_Decree_No_745_desc: "Учитывая предложения трудящихся, в целях дальнейшего укрепления трудовой дисциплины и сокращения текучести кадров Совет Министров СССР и ВЦСПС принимают постановление №. 745, в котором предписывается: улучшить сбалансированность планов, материально-технического снабжения, обеспечить создание других экономических и организационных условий для бесперебойной и высокопроизводительной работы трудовых коллективов, повысить их инициативу и ответственность за выполнение плановых заданий и обязательств; критически изучать состояние трудовой и производственной дисциплины, принимать конкретные меры по ее укреплению, активнее внедрять передовые формы организации и стимулирования труда, бригадный учет затрат, оплату по конечным результатам и с применением коэффициента трудового участия; строго руководствоваться принципом равной оплаты за равный труд, не допускать необоснованного завышения размеров материального поощрения с целью переманивания работников с других предприятий. Шире применять безавансовую систему оплаты труда с учетом мнения трудовых коллективов, а также там, где это целесообразно и возможно. Постоянно совершенствовать культурно-бытовое обслуживание населения"
 funded_OGAS_ASPR: "Funded §YOGAS-ASPR§!"
