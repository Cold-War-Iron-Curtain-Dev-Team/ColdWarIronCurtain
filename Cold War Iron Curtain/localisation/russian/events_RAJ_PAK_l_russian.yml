l_english:
 Tashkent_Decleration.1.d: "Советский Союз любезно предложил провести мирные переговоры в Ташкенте, чтобы положить конец нашей войне с Индией. Пока мы готовимся к конференции, мы должны учитывать, что произошло во время недавнего конфликта. Хотя наши силы не добились решающих результатов, пакистанские вооруженные силы выстояли против гораздо более крупного врага, несомненно, впечатлив мир. В ходе конфликта и мы, и индусы приобретали и теряли территории в ходе боевых действий. МИД предлагает надавить на Индию для выполнения резолюций ООН в ходе мирных переговоров. Они, безусловно, должны признать, что это единственный способ предотвратить будущий конфликт с нами. Наши высокопоставленные дипломаты, однако, предполагают, что индийцы вряд ли примут это, и самый простой результат, на который мы можем надеяться, — это возвращение к довоенным границам. Учитывая, как наша военная пропаганда говорила о великих победах, такой результат может привести к большому разочарованию."
 Tashkent_Decleration.2.d: "Советский Союз любезно предложил провести мирные переговоры в Ташкенте, чтобы положить конец нашей войне с Пакистаном. Готовясь к конференции, мы должны учитывать то, что произошло во время этого конфликта. Наши превосходные вооруженные силы успешно предотвратили пакистанский заговор с целью отобрать у нас Кашмир. Затем наши силы приступили к расправе с пакистанцами через их границы. Хотя мы добились успехов, мы также потеряли часть территории в пользу Пакистана. Однако наши высокопоставленные дипломаты считают, что мы достигли своей цели — не потерять Кашмир, и мы, вероятно, можем договориться о возвращении к довоенным границам. Пакистанцы, скорее всего, будут настаивать на решении кашмирской проблемы, однако они не в состоянии требовать территории или того, чтобы мы выполняли резолюцию ООН. Кабинет министров призывает премьер-министра не уступать потенциальному давлению со стороны Пакистана."
 Tashkent_Decleration.3.d: "Недавно завершившийся конфликт с Индией высветил тревогу и страхи многих бенгальцев в Пакистане. Они считали, что боевые действия в Кашмире произошли без консультаций и привели к войне, которая поставила Восточный Пакистан в серьезную опасность. Кроме того, многие бенгальцы считали, что правительство сосредоточило свои ресурсы и войска на Кашмирском фронте, оставив крупнейшую населенную провинцию Пакистана уязвимой для вражеских вторжений. Бенгальские политики и студенческие лидеры обратились к большим толпам протестующих, возмущенных тем, что, по их мнению, военные не смогли их защитить."
 Tashkent_Decleration.4.d: "Советское правительство принимает в Ташкенте руководителей Индии и Пакистана для переговоров. Цель этих переговоров — прийти к окончательному соглашению о прекращении недавней войны между двумя южноазиатскими державами. Война началась, когда Пакистан попытался разморозить текущую ситуацию в Кашмире, это привело к военной эскалации, вылившейся в открытую войну. Пакистанское руководство будет настаивать на урегулировании по Кашмиру, предпочтительно на выполнении предыдущих резолюций ООН по этому вопросу. Однако эксперты полагают, что индийское правительство, скорее всего, отвергнет такое давление и вместо этого будет настаивать на том, чтобы довоенная линия прекращения огня стала постоянной границей. Многие аналитики считают, что конфликт на местах был в значительной степени безрезультатным, и было бы удивительно, если бы одна из сторон смогла убедить другую. Для Советов встреча дает им шанс продемонстрировать свои претензии на статус нейтральной или дружественной мировой державы новым постколониальным государствам."
 Tashkent_Decleration.5.d: "Первоначальные переговоры оказались безрезультатными, но, следуя указаниям Советского Союза, президент Пакистана и наш премьер-министр встретились в частном порядке, чтобы обсудить варианты мира. Во время разговора пакистанский лидер настаивал на том, чтобы мы выполнили резолюцию ООН по Кашмиру и позволили ООН провести референдум. Он заявил, что в противном случае конфликт только усугубится и оттолкнет кашмирцев. После этих переговоров премьер-министр провел переговоры со своими советниками. Консенсус заключался в том, что мы сохраняем твердый контроль над нашей частью Кашмира и не должны узаконивать пакистанскую агрессию, соглашаясь. Вместо этого они заявили, что мы можем предложить сделать довоенную линию прекращения огня в Кашмире постоянной границей. Премьер-министр услышал эти комментарии и теперь должен решить, пойдет ли он на риск и примет позицию Пакистана или отклонит предложение."
 Tashkent_Decleration.6.d: "Вопреки всем своим советникам премьер-министр заявил о намерении договориться с Пакистаном и выполнить резолюцию 47 ООН по Кашмиру. Он заявил, что, хотя это решение не будет популярным дома, оно укрепит Индию как зрелую державу и со временем будет воспринято положительно. Он добавил, что жители Кашмира могут воспринять решение Индии как положительное, и это может привести к тому, что голосование закончится в нашу пользу. Это решение взволновало пакистанскую делегацию и советских посредников. Первоначальная реакция СМИ была в основном негативной. Многие оппозиционные политики и редакционные статьи уже критикуют правительство за капитуляцию перед пакистанской агрессией, а некоторые даже призывают правительство уйти в отставку. Несмотря на этот шум, премьер-министр остается верным своему решению."
 Tashkent_Decleration.7.d: "Международное сообщество было удивлено, узнав, что Индия согласилась обратиться к Организации Объединенных Наций с просьбой выполнить резолюцию 47 и провести референдум в Кашмире, чтобы определить его окончательный статус. Хотя военный конфликт закончился безрезультатно для Пакистана, многие аналитики предсказывали, что Индия будет стремиться восстановить довоенный статус-кво. Организация Объединенных Наций приветствовала это решение, в то время как страны всего мира хвалят Индию за ее государственную мудрость и стремление к прочному миру в Южной Азии. Пакистанское правительство едва могло скрыть радость по поводу этого заявления. Реакция в Индии в основном была гневом и шоком по поводу того, что многие называют предательством. Многие индусы считают это решение уступкой пакистанской военной агрессии."
 Tashkent_Decleration.8.d: "Премьер-министр Индии сообщил нам о своем решении выполнить резолюцию ООН по Кашмиру. Это знаменует собой достижение нашей главной внешнеполитической цели с момента обретения независимости. Мы давно ощущали необходимость разморозить Кашмир, что и подтолкнуло к нашим недавним действиям. Решение Индии подтверждает, что наши действия были справедливыми, и народ Кашмира, наконец, добьется своих истинных прав после многолетней борьбы. Первоначальная реакция СМИ и ведущих политиков была в основном положительной. По мере распространения новостей мы можем ожидать ликующие толпы. Это достижение является свидетельством напряженной работы и самопожертвования наших вооруженных сил в недавней борьбе. Мы действительно стали ведущей державой в регионе и мире."
 Tashkent_Decleration.9.d: "Мы пытались сильно надавить на Индию, чтобы воспользоваться этим моментом для выполнения резолюций ООН по Кашмиру. Мы надеялись, что по нашим действиям они увидят и примут решение, что, пока Кашмир остается неопределенным, не может быть и будущего мира. Вместо этого премьер-министр Индии сообщил нам, что он согласен с тем, что Кашмир должен быть урегулирован, но решение не состоит в том, чтобы передать решение иностранному органу, такому как ООН. Вместо этого он предложил восстановить довоенные границы Кашмира и сделать их постоянными. Это большой удар по нашему делу, и все согласны с тем, чтобы полностью отклонить это предложение. Однако президент должен подумать, стоит ли принятие постоянной границы и негативные последствия пользы от нормализации отношений и установления мира и благополучия в регионе."
 Tashkent_Decleration.10.d: "Президент Пакистана, к большому огорчению своих советников, заявил о своем согласии сделать границу Кашмира постоянной. В своих комментариях он отметил, что это было сделано из стремления к постоянному миру для народов Пакистана, Индии и Кашмира. Наша делегация вместе с советскими посредниками ликовали по поводу этого решения, и слухи о нашем успехе уже распространяются дома. Мы уже получаем поздравления от лидеров оппозиции с успехом в Ташкенте. Мы убедительно доказали, что неприкрытая агрессия не может привести к успеху, и наши вооруженные силы жертвовали собой во имя общего блага."
 Tashkent_Decleration.11.d: "Реакция Пакистана на новости из Кашмира в значительной степени была вызвана отвращением и возмущением. Во время недавнего конфликта средства массовой информации изображали Пакистан как страну, добившуюся больших военных успехов. Многих ошарашивает, что после таких якобы побед, как президент мог сдать Кашмир. Многие утверждают, что победы на поле боя были сданы на мирных переговорах. Уже звучат призывы к проведению маршей солидарности в Кашмире. Ожидается, что некоторые члены кабинета уйдут в отставку в знак протеста, ходят слухи о недовольстве и в рядах военных. Несмотря на это, президент остается твердым и в кратком заявлении упомянул, что это решение приведет к миру и откроет путь для воссоединения кашмирских семей."
 Tashkent_Decleration.12.d: "В ходе неожиданного прорыва в Ташкенте советское правительство объявило, что Пакистан и Индия достигли соглашения по Кашмиру. Обе стороны согласились вернуться к довоенным границам и сделать первоначальную линию прекращения огня постоянной границей. Эта новость хорошо воспринимается на международном уровне, и многие хвалят пакистанское правительство именно за то, что оно проницательно распознало ситуацию и добилось постоянного прорыва. Недавняя война между обоими государствами в основном произошла из-за боевых действий в Кашмире. Хотя боевые действия остались безрезультатными, похоже, пакистанское и индийское руководство было заинтересовано в решительном разрешении кризиса. Индийское население позитивно реагирует на эту новость, хотя первоначальные сообщения из Пакистана свидетельствуют о негативной реакции на соглашение."
 Tashkent_Decleration.13.d: "Пакистанская делегация категорически отвергла наше предложение сделать кашмирскую границу постоянной. Вместо этого они подтвердили свое желание выполнять резолюции ООН. Ясно, что они не хотят сдвинуться с места, но и не в состоянии продолжать боевые действия. Очевидно, что мы не можем учитывать позицию Пакистана. И мы, и пакистанцы сталкиваемся с сильным давлением со стороны советских посредников с целью стабилизации ситуации. Поскольку военная ситуация закончилась безрезультатно, кажется, что остается единственный вариант - настаивать на возвращении к довоенным границам. Такое решение не идеально, но подтвердит, что нам удалось предотвратить пакистанскую агрессию в Кашмире."
 Tashkent_Decleration.14.d: "Ясно, что индийцы не желают сдвинуться с места или быть реалистичными в решении проблемы Кашмира. Кроме того, мы сталкиваемся с огромным давлением со стороны Советов, чтобы они завершили переговоры и согласились на решение, которое положило бы конец недавнему конфликту. Индусы заявили, что согласятся на возвращение к довоенным границам и обмен военнопленными. Это не тот сценарий, которого мы хотели, но, учитывая ситуацию, у нас нет выбора. Наш народ должен быть доволен тем, что, столкнувшись с таким крупным врагом, наши храбрые военные смогли помешать ему добиться решающей победы."
 Tashkent_Decleration.15.d: "Министр иностранных дел Зульфикар Бхутто, один из самых откровенных ястребов в правительстве, очень негативно отреагировал на окончательное соглашение. Он считает, что Индия теперь будет действовать, чтобы сделать свою оккупацию Кашмира постоянной, и мы должны были продолжать борьбу. Его громкие разоблачения раздражают президента, и вполне вероятно, что его дни в правительстве сочтены. В частном порядке многие в кабинете считают, что Бхутто сыграл важную роль в том, чтобы подтолкнуть военных к действиям в Кашмире, и это действие привело правительство к нынешней ситуации."
 Tashkent_Decleration.16.d: "С улыбками советских посредников лидеры Пакистана и Индии подписали Ташкентское соглашение. Договор предусматривает, что обе стороны отведут свои войска к своим довоенным границам. Соглашение также обязывает обе стороны обмениваться военнопленными из недавнего конфликта. Что касается Кашмира, соглашение предусматривало, что обе страны продолжат работу над поиском возможного решения. Хотя окончательного решения по Кашмиру пакистанцы не добились. Индия хотела формулировку, которая обязывала бы обе стороны найти решение только мирными средствами, но Пакистан смог сделать формулировку гораздо более расплывчатой. В целом соглашение подтверждает незавершенный характер конфликта."
 Tashkent_Decleration.17.d: "После недели переговоров в Ташкенте при посредничестве СССР, Пакистан и Индия достигли окончательного соглашения. Ташкентское соглашение предусматривает возврат к довоенным границам и обмен военнопленными. Надежды на окончательное решение по Кашмиру не оправдались, поскольку соглашение лишь призывает обе страны к продолжению переговоров. Соглашение в значительной степени подтверждает, что недавний конфликт был безрезультатным в военном отношении. Индийская делегация, вероятно, будет удовлетворена результатом, хотя пакистанская делегация, скорее всего, столкнется с негативной реакцией. Международное сообщество приветствовало соглашение, надеясь, что восстановление мира в регионе проложит путь к будущему решению."
 Tashkent_Decleration.18.d: "Ошеломляющим событием стало известие из Ташкента о скоропостижной кончине премьер-министра Шастри вскоре после подписания соглашения. По предварительным данным, он скончался от сердечного приступа. Сообщается, что индийская делегация и парламент ошеломлены этой новостью. Премьер-министр Шастри, известный своей скромностью и тихой преданностью индийскому народу, умело руководил страной во время недавней войны с Пакистаном. Сообщается, что президент Пакистана был потрясен этой новостью и помог донести его тело до самолета, который возвращал его домой для надлежащих похорон. Несмотря на его смерть, Ташкентское соглашение и его реализация не претерпят изменений."
 Treaty_Lahore.1.d: "Мы должны подготовиться к переговорам с индийским правительством в Лахоре. Недавняя война с Индией закончилась тем, что мы заняли прочную военную позицию. По милости Божией наши вооруженные силы достигли своих целей в Кашмире и вдоль границы. Индийские военные не смогли захватить наши крупные города и потерпели серьезные неудачи в Кашмире и других местах. После прекращения огня стало ясно, что мы в силах диктовать условия индийцам. Многие в кабинете выступают за то, чтобы мы использовали наш успех, чтобы заставить Индию урегулировать вопрос о Кашмире. Мы развернули наши операции по размораживанию Кашмира и в значительной степени преуспели в наших планах. Настало время настаивать на наших претензиях."
 Treaty_Lahore.2.d: "Мы должны подготовиться к переговорам с пакистанским правительством в Лахоре. Недавняя война с Пакистаном пошла не так, как мы надеялись. Наши силы потерпели серьезные неудачи в Кашмире и вдоль более широкой границы. Нам не удалось захватить ни одного ценного города у Пакистана, и мы не можем использовать это в качестве козыря в переговорах. Понятно, что пакистанцы будут давить на нас в Кашмире и требовать, чтобы мы освободили провинцию. Нашим лучшим подходом будет настаивать на выполнении резолюции 47 ООН. По иронии судьбы, это отмена нашей предыдущей политики, если вместо этого Пакистан будет настаивать на том, чтобы мы покинули провинцию, мы можем предложить план раздела, который позволит нам удержать Ладакх. и Джамму. Мы должны приложить все усилия на предстоящих переговорах, чтобы добиться достойного результата."
 Treaty_Lahore.3.d: "Бенгальцы в Восточном Пакистане давно подозреваются в том, что они являются гражданами второго сорта или что федеральное правительство игнорирует их. И это несмотря на их многочисленное население, огромную экономическую роль и историческую преданность Пакистанскому движению. Когда из-за Кашмира впервые разразилась война, распространились слухи, что Западный Пакистан покинул Восточный Пакистан. Однако, когда пакистанские военные начали одерживать военные победы, эти опасения вскоре рассеялись. Бенгальская пресса высоко оценила военные успехи, а военные и федеральное правительство выразили свое восхищение поддержкой и жертвами, принесенными народом Восточного Пакистана. С окончанием войны и началом мирных переговоров бенгальский патриотизм по отношению к Пакистану, похоже, возродился. Чтобы ответить взаимностью на это новое чувство единства, правительство Пакистана объявило о включении видного бенгальского провинциального лидера в состав пакистанской группы по переговорам в Лахоре."
 Treaty_Lahore.4.d: "Индийская делегация во главе со своим премьер-министром недавно прибыла в Лахор для переговоров о прекращении недавней войны в Южной Азии. Пресса отметила, что ни один из индийских представителей не проявил ничего, кроме серьезного отношения к своей миссии. Перед прибытием премьер-министр Индии сообщил своей стране, что собирается вести переговоры с Пакистаном в надежде на обеспечение справедливого мира, возвращение оккупированных индийских земель и солдат, содержащихся в качестве военнопленных. Президент Пакистана и его делегация уже находятся в Лахоре, официальные переговоры начнутся в ближайшие дни. Хотя пакистанская пресса шумно хвасталась успешным положением Пакистана, правительство недавно потребовало временно прекратить такие публикации, чтобы создать дружественную атмосферу для мирных переговоров."
 Treaty_Lahore.5.d: "Во время первоначальных переговоров мы сказали индийцам, что нашей главной целью является установление окончательного мира в Кашмире. Поскольку мы занимаем господствующее военное положение в Кашмире и вдоль границы, у нас, безусловно, есть преимущество. Однако индийцы удивили нашу делегацию, предложив выполнить резолюцию 47 ООН по Кашмиру, как мы требовали в течение многих лет. Они говорят, что сейчас настал момент для обеих наших стран сделать шаг назад и позволить кашмирскому народу выбрать свою судьбу. Конечно, это то, чего мы всегда хотели, но наша позиция такова, что мы можем просто потребовать от Индии освободить Кашмир и не рисковать международным голосованием, в которое потенциально могут вмешаться индийцы. Возможно, у нас никогда больше не будет такой сильной позиции на переговорах, и если мы оставим это на усмотрение ООН, это может иметь неприятные последствия. Однако принятие предложения Индии, а затем получение Кашмира путем голосования в ООН сделало бы наш успех более законным на международном уровне."
 Treaty_Lahore.6.d: "По неожиданному стечению обстоятельств пакистанское правительство приняло наше предложение выполнить резолюцию 47 ООН. В результате будущее Кашмира останется за его жителями, и они потенциально могут захотеть присоединиться к нам, хотя это кажется маловероятным. Тем не менее, это гораздо более благоприятный результат, чем просьба полностью освободить Кашмир. С этим соглашением мы можем ожидать возвращения к довоенным границам на международной границе вместе с обменом пленными, как только мы встанем на путь Организации Объединенных Наций. Слухи о соглашении хорошо восприняты индийской прессой, и многие считают этот результат гораздо более приемлемым, чем альтернатива."
 Treaty_Lahore.7.d: "Президент Пакистана обратился к нации в связи с мирными переговорами в Лахоре. Он заявил, что правительство Индии предложило полностью посвятить себя выполнению резолюций ООН по Кашмиру. Он заявил, что расширение прав и возможностей народа Кашмира - единственное скромное желание народа Пакистана. Резолюция ООН позволит кашмирцам раз и навсегда решить, к какой нации они хотят присоединиться. Английская пресса в Пакистане хвалит президента за достижение пакистанских целей таким образом, чтобы не унизить Индию и сохранить международное положение нации. Пресса урду, однако, гораздо более язвительна, обвиняя правительство в том, что оно выбирает международный имидж, а не использует свое положение силы для вытеснения Индии. По их мнению, у индийцев были годы, чтобы выполнить резолюцию, но они предпочли этого не делать, им следовало смириться. Среди военных также ходят слухи, выражающие разочарование тем, что победы на полях сражений не превратились в более конкретные победы."
 Treaty_Lahore.8.d: "Мир положительно отреагировал на известие о том, что Пакистан и Индия согласились выполнить резолюции ООН по Кашмиру, чтобы установить окончательное решение спорной территории. Действительно, недавняя война между двумя сторонами была за то, кто будет контролирует Кашмир. Индия была вынуждена предложить выполнение резолюций, так как военный конфликт оставил их в очень слабом положении. Из-за этого соглашение удивило некоторых наблюдателей, которые думали, что Пакистан просто воспользуется своим положением, чтобы вытеснить Индию из Кашмира и забрать его себе. Похоже, что пакистанцы стараются не навязывать мир, который вызовет дальнейшую враждебность со стороны Индии или создаст международный имидж Пакистана как агрессивной в военном отношении державы. Также ясно, что пакистанцы были уверены, что голосование даст им Кашмир."
 Treaty_Lahore.9.d: "Пакистанское правительство холодно отреагировало на наше предложение выполнить резолюцию ООН. Они отметили, что это было то, что мы могли бы сделать много лет назад, и предлагать это сейчас, в нынешней ситуации, было бы лицемерным способом сохранить лицо. Вместо этого пакистанцы заявили, что ситуация Индии в Кашмире явно несостоятельна, и Индия должна покинуть бывшее княжеское государство. Пакистанцы смягчили эту жесткую позицию, добавив, что, если мы подчинимся, они немедленно восстановят международную границу до довоенных границ и обменяются военнопленными. Конечно, мы не можем навсегда смириться с оккупацией крупных индийских городов. Однако некоторые советники предлагают предложить пакистанцам план раздела Кашмира, в котором мы сохраняем Джамму и Ладакх, это позволило бы каждой части Кашмира быть со своими единоверцами."
 Treaty_Lahore.10.d: "После того, как мы сообщили индийцам, что не намерены играть в игры по поводу Кашмира, они сделали интригующее предложение. Индийцы отметили, что исторически Джамму был немусульманским, и Первая Кашмирская война вытеснила многих немусульман из Долины в Джамму. Это население будет опасаться пакистанского правительства, и, чтобы предотвратить враждебность или новый цикл межобщинных беспорядков, возможно, нам следует разделить Кашмир. Они отдали бы нам весь Кашмир, кроме Джамму и Ладакха. Принятие этого Плана раздела позволило бы достичь нашей цели по контролю над долиной и устранить потенциальную головную боль, связанную с интеграцией кашмирских немусульман. Это также позволит нам избежать наследования пограничного спора между Индией и Китаем. Однако мы должны рассмотреть этот вариант, некоторые из наиболее ястребиных делегатов считают, что мы должны обезопасить весь Кашмир и, наконец, сделать Пакистан единым целым."
 Treaty_Lahore.11.d: "Пакистанцы продемонстрировали свои неприкрытые амбиции, отклонив наше последнее предложение о разделе Кашмира. Пакистанцы заявили, что они выведут свои войска с нашей территории и обменяются военнопленными, как только наши войска начнут эвакуацию из Кашмира. Наше положение несостоятельно, чем дольше пакистанские силы оккупируют наши земли, тем слабее будет выглядеть государство и правительство. Хотя это причиняет нам боль, у нас нет другого выбора, кроме как подчиниться и подписать соглашение. Военные и население, несомненно, будут в ярости из-за такого изменения событий. Пакистанцы думают очень недальновидно, хотя сейчас они могут добиться успеха, народ Индии никогда не бросит тех кашмирцев, которых мы защищали с 1947 года."
 Treaty_Lahore.12.d: "Пакистанское правительство, потратив время на рассмотрение нашего предложения, согласилось на раздел Кашмира. Мы немедленно отдали приказ нашим войскам отойти к новым рубежам. Окончательное соглашение приведет к тому, что обе наши страны вернутся к международным довоенным границам и начнут процесс обмена пленными. Хотя наш народ и оппозиция будут разочарованы результатом, мы можем, по крайней мере, утверждать, что сохранили нашу приверженность жертвам первоначального племенного вторжения в Кашмир. Учитывая плохую ситуацию, мы выступили так, как и можно было ожидать."
 Treaty_Lahore.13.d: "Международное сообщество с удовлетворением отметило, что Пакистан и Индия пришли к окончательному соглашению о прекращении недавней войны в Лахоре. После напряженных переговоров Пакистан согласился разделить Кашмир с Индией. Кашмирская долина и территория, уже контролируемая Пакистаном, окажутся под его контролем. Индия сохраняет контроль над Ладакхом и Джамму. Обе стороны согласились, что это решение позволит всем кашмирцам проживать там, где им наиболее комфортно. Несмотря на это, уже есть сообщения о переезде кашмирцев-немусульман в Джамму и Индию. Это соглашение знаменует собой серьезную неудачу для Индии и подтверждает ее военное поражение на поле боя. Для Пакистана их правительство празднует договор как завершение сорздания нации. Уже разрабатываются планы визита президента в Шринагар."
 Treaty_Lahore.14.d: "Президент Пакистана и премьер-министр Индии подписали Лахорский договор о прекращении недавнего военного конфликта. Соглашение подтверждает военную победу Пакистана, поскольку Индия согласилась полностью уйти из Кашмира. Взамен обе стороны вернутся к довоенным границам вдоль международной границы и обменяются военнопленными. Реакцией в Пакистане было полное ликование. Мечети провозглашают подробности договора, собирая толпы людей для празднования. В Индии этот договор рассматривается как крайнее унижение. Уже поступают сообщения о кашмирцах-немусульманах, бегущих в Индию, их прибытие только подчеркнет то, что было потеряно. Многие наблюдатели считают, что, несмотря на победу Пакистана, это соглашение вряд ли улучшит ситуацию между двумя странами."
 Treaty_Lahore.15.d: "Лахорский договор очень негативно воспринимается в Индии. Оппозиция была особенно жестока в своей критике правительства за то, как оно справилось с войной и ее последствиями. Есть сообщения о беспорядках среди младших офицеров, которые считают, что высшее руководство и правительство не справились с задачей. Есть несколько сообщений о том, что гражданские лица словесно оскорбляют мужчин в форме и государственных чиновников. Больше беспокойства вызывает прибытие проиндийских кашмирских беженцев, лидеры которых уже публикуют осуждающие передовицы в крупных газетах. Мы должны усердно работать, чтобы воссоединить нацию и подготовиться к будущему. На этот раз Пакистан, безусловно, одержал верх, но мы, без сомнения, рано или поздно найдем момент, чтобы нанести ответный удар."
 Treaty_Delhi.1.d: "Недавний конфликт с Индией закончился катастрофой. Нам не только не удалось заставить Индию урегулировать вопрос о Кашмире, но в ходе конфликта у нас теперь есть пакистанские города, находящиеся под оккупацией Индии. В военном отношении у нас очень мало рычагов воздействия. Народ Пакистана хочет, чтобы его семьи объединились, а солдаты вернулись домой. Однако ясно, что цена за это может быть за счет Кашмира. Пока наша делегация готовится к Дели, мы должны добиваться прекращения огня и восстановления довоенного статус-кво. Если это не удастся, мы будем настаивать на разделе Кашмира, сохранив за собой Гилгит-Балтистан. Мы постараемся сделать эту границу постоянной, чтобы хоть что-то спасти от ситуации. Однако военная ситуация такова, что, если Индия будет настаивать на том, чтобы мы освободили Кашмир, у нас, вероятно, не будет выбора."
 Treaty_Delhi.2.d: "Недавний конфликт обострился только после того, как Пакистан начал коварную кампанию насилия в Кашмире. Их попытки насильственно захватить территорию не увенчались успехом, и в результате войны наши силы доказали превосходство. У нас есть военное преимущество и мы контролируем достаточно территории, чтобы вести переговоры с позиции силы. Многие ястребы в правительстве будут давить на нас, чтобы мы потребовали весь Кашмир, включая Гилгит-Балтистан. Хотя это, безусловно, имеет смысл, мы должны учитывать проблемы, связанные с присоединением такого большого количества земли и населением, которому десятилетиями промывали мозги, чтобы ненавидеть нашу нацию. Может быть, лучше рассмотреть альтернативные планы, но не упускать преимущества, которое наши храбрецы обеспечили нам на поле боя."
 Treaty_Delhi.3.d: "Недавно завершившийся конфликт с Индией высветил тревогу и страхи многих бенгальцев в Пакистане. Они считали, что боевые действия в Кашмире произошли без консультаций и привели к войне, которая поставила Восточный Пакистан в серьезную опасность. Кроме того, многие бенгальцы считали, что правительство сосредоточило свои ресурсы и войска на Кашмирском фронте, оставив крупнейшую населенную провинцию Пакистана уязвимой для вражеских вторжений. Бенгальские политики и студенческие лидеры обратились к большим толпам протестующих, возмущенных тем, что, по их мнению, военные не смогли их защитить."
 Treaty_Delhi.4.d: "Первоначальные переговоры между нами и Пакистаном были очень напряженными. В ходе последних обсуждений предлагалось вернуть регион в довоенное состояние за месяц до начала боевых действий в Кашмире. Они заявляют, что это сохранит хрупкий статус-кво Кашмира и предотвратит дальнейшее разжигание эмоций по обе стороны границы. Очевидно, это отчаянная уловка пакистанцев, мы скоро сообщим пакистанцам, что это они нарушили статус-кво. Из-за этого они должны признать новую реальность на местах, поэтому мы заявим, что Пакистан должен уступить нам весь свой оккупированный Кашмир. Княжество Кашмир присоединилось к Индии, и Пакистан должен признать эту реальность."
 Treaty_Delhi.5.d: "Наши попытки восстановить довоенные границы были решительно отвергнуты. Индийцы не в настроении думать об этом. Они чувствуют, что мы вызвали беспорядки, и они не могут остановиться, пока не получат что-то от нас. Наш следующий вариант — обменять наши права на Кашмирскую долину на восстановление мира. Мы предложим раздел Кашмира, при котором мы сохраним Гилгит и Балтистан, но уступим остальное Индии. На этот раз мы потерпели поражение, но мы оправимся и никогда не покинем Кашмир."
 Treaty_Delhi.6.d: "Пакистанская делегация поняла, что мы не в том настроении, чтобы позволить им сорваться с крючка. В последних раундах переговоров они предложили уступить нам свой так называемый Азад-Кашмир, но просили оставить за собой Гилгит-Балтистан. Во время Первой Кашмирской войны Гилгит-Балтистан быстро перешел к пакистанцам, поскольку они пользовались там поддержкой местных сил ополчения. Их предложение может иметь для нас большое значение. Мы избежим наследования враждебного населения и преуспеем в объединении Кашмирской долины. На международном уровне это также будет приветствоваться. Однако многие из наших ястребов говорят, что мы не можем потерять это преимущество и должны заставить пакистанцев покинуть Кашмир."
 Treaty_Delhi.7.d: "Правительство Индии приняло наше предложение о разделе Кашмира. С тяжелым сердцем мы уже отдали приказ нашим официальным лицам и оставшимся войскам покинуть Азад Кашмир. Уже есть сообщения о семьях кашмирцев, спасающихся бегством в Пакистан. Однако, учитывая альтернативу, это был лучший результат. Мы никогда не покинем Кашмир, однако наши руки связаны. Правительство Индии согласилось вывести свои войска с нашей территории, произвести обмен военнопленными и восстановить дипломатические отношения. Мы можем только молиться, чтобы будущее дало нам возможность исправить эту историческую несправедливость."
 Treaty_Delhi.8.d: "Новости о нашем соглашении в Дели вызвали массовые волнения в наших городах. Это настоящий шок, поскольку у многих пакистанцев сложилось впечатление, что наши войска хорошо справлялись с войной. Раннее прибытие беженцев из Азад Кашмира подпитывает гнев. В армии ходят слухи о напряженности между старшими офицерами и их подчиненными. Многие молодые офицеры считали, что военные неудачи были связаны не с превосходством Индии, а с неудачей руководства. Мы должны работать над воссоединением нашего народа в этот кризисный момент."
 Treaty_Delhi.9.d: "Новости о нашем соглашении по Кашмиру дошли до широкой общественности. Многие в стране радуются такому результату. Они видят в соглашении подтверждение нашего военного господства в регионе и справедливое наказание пакистанцам. Что касается Кашмира, многие газеты утверждают, что объединение Кашмирской долины объединит семьи и снизит напряженность среди кашмирцев. Армейцев широко аплодируют за сохранение чести нации. С этой победой мы надеемся наконец увидеть новую эру мира."
 Treaty_Delhi.10.d: "Переговоры в Дели между Индией и Пакистаном завершились соглашением. Пакистан согласился уступить долину Кашмира Индии в обмен на восстановление довоенных международных границ. Обе стороны также договорились об обмене военнопленными. Разрешение Пакистану сохранить Гилгит-Балтистан рассматривается многими наблюдателями как позитивный шаг. Когда обе стороны выводят свои силы с фронта, поступают сообщения о перемещении кашмирских беженцев в Пакистан. Говорят, что население Индии ликует по поводу договора, рассматривая его как подтверждение своей военной победы. Реакция в Пакистане шок и гнев, многие считают, что правительство полностью подвело народ Кашмира."
 Treaty_Delhi.11.d: "Индийская делегация продемонстрировала свою жадность и честолюбие, отвергнув наше справедливое предложение о разделе Кашмира. Индийцы заявили, что единственный сценарий, который они примут для восстановления международной границы и мира, — это наш полный уход из Кашмира. Из-за военного баланса у нас не остается другого выбора, кроме как подчиниться. С тяжелым сердцем мы должны вывести наши войска из Кашмира. Последствия и негативная реакция людей будут огромными. Однако у нас нет выбора, но, учитывая несправедливость ситуации, со временем мы будем искуплены. Наши делегаты скоро подпишут окончательный договор."
 Treaty_Delhi.12.d: "Новости о нашем соглашении в Дели вызвали массовые волнения в наших городах. Это настоящий шок, поскольку у многих пакистанцев сложилось впечатление, что наши войска хорошо справлялись с войной. Раннее прибытие беженцев из Азад Кашмира подпитывает гнев. В армии ходят слухи о напряженности между старшими офицерами и их подчиненными. Многие молодые офицеры считали, что военные неудачи были связаны не с превосходством Индии, а с неудачей руководства. Мы должны работать над воссоединением нашего народа в этот кризисный момент. Наши сторонники, находящиеся сейчас под индийской оккупацией, останутся преданными нам в своих сердцах."
 Treaty_Delhi.13.d: "Новости о нашем соглашении по Кашмиру дошли до широкой общественности. Многие в стране радуются такому результату. Они видят в соглашении подтверждение нашего военного господства в регионе и справедливое наказание пакистанцам. Что касается Кашмира, многие газеты утверждают, что объединение Кашмирской долины объединит семьи и снизит напряженность среди кашмирцев. Новые границы также ограничат контакты Китая с Пакистаном, укрепляя нашу позицию. Армейцев широко аплодируют за сохранение чести нации. С этой победой мы надеемся наконец увидеть новую эру мира."
 Treaty_Delhi.14.d: "Переговоры в Дели между Индией и Пакистаном завершились соглашением. Пакистан согласился уступить всю свою территорию Кашмира Индии в обмен на восстановление довоенных международных границ. Обе стороны также договорились об обмене военнопленными. Некоторые наблюдатели выразили обеспокоенность тем, что захват всего Кашмира только укрепит антагонизм между Индией и Пакистаном. Когда обе стороны выводят свои силы с фронта, поступают сообщения о перемещении кашмирских беженцев в Пакистан. Говорят, что население Индии ликует по поводу договора, рассматривая его как подтверждение своей военной победы. Реакция в Пакистане - шок и гнев. Многие считают, что правительство полностью подвело народ Кашмира."
 kashmiri_plebiscite: "Резолюция ООН 47: Кашмирский референдум"
 kashmiri_plebiscite_desc: "Индия и Пакистан оккупировали бывшее княжеское государство Кашмир. Оба претендуют на всю провинцию,и начали короткую войну через несколько недель после раздела. Недавно обе стороны договорились о выполнении резолюций Совета Безопасности ООН о проведении на территории референдума. В ближайшие недели народ Кашмира определит свое будущее и проголосует за присоединение либо к Индии, либо к Пакистану. Оба правительства активно участвуют в кампаниях, направленных на то, чтобы убедить кашмирцев в том, что их будущее зависит от их государства. ООН проведет честные выборы."