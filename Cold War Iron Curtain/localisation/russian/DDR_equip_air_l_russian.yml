l_english:
 DDR_fighter_equipment_1:0 "Messerschmitt Bf 109 B-1"
 DDR_fighter_equipment_1_short:0 "Messerschmitt Bf 109"
 DDR_fighter_equipment_3:0 "FWD 53B"
 DDR_fighter_equipment_3_short:0 "FWD 53B"
 DDR_fighter_equipment_3_desc:0 "Проект получил кодовый номер \"53\" (по году его начала), а конструктивной основой для не очень нового истребителя для зарождающихся ВВС ГДР были в основном поздние планеры Bf 109G и некоторые Bf 109K, отраженные суффиксом \"А\" и \"В\". для экономии веса вооружение FWD-53 было относительно легким. Она состояла из пары тяжелых 12,7-мм пулеметов Березина УБС и одной 23-мм пушки Нудельмана-Суранова НС-23. Эти три орудия были установлены над двигателем, синхронизированные для стрельбы через диск пропеллера."
 DDR_jet_multirole_equipment_1:0 "Ме.262"
 DDR_jet_multirole_equipment_1_short:0 "Ме.262"
 DDR_jet_multirole_equipment_2:0 "МиГ-15бис"
 DDR_jet_multirole_equipment_2_short:0 "МиГ-15бис"
 DDR_jet_multirole_equipment_2_desc:0 "МиГ-15бис - Советский реактивный истребитель, разработанный ОКБ Микояна и Гуревича, развитие МиГ-15. В 1946 году моторостроительное ОКБ В. Я. Климова занялось разработкой усовершенствованного варианта двигателя РД-45Ф, который являлся копией британского Нин II. Разработанный Климовым ТРД ВК-1 при практически тех же габаритах и массе что и РД-45Ф, имел на 20% большую тягу. Заводские и государственные испытания двигателя были проведены на четырёх серийных МиГ-15, которые получили заводской шифр «СЛ». В начале 1949 года госиспытания двигателя были завершены, а 14 мая, постановлением Совета Министров СССР № 1887-697 двигатель ВК-1 со 100 часовым ресурсом был запущен в серийное производство."
 DDR_jet_multirole_equipment_3:0 "МиГ-17Ф"
 DDR_jet_multirole_equipment_3_short:0 "МиГ-17Ф"
 DDR_jet_multirole_equipment_4:0 "МиГ-19ПМ"
 DDR_jet_multirole_equipment_4_short:0 "МиГ-19ПМ"
 DDR_jet_multirole_equipment_4_desc:0 "МиГ-19ПМ - Советский одноместный реактивный истребитель второго[3] поколения, разработанный ОКБ Микояна и Гуревича в начале 1950-х годов. Первый советский серийный сверхзвуковой истребитель, широко применялся в системе ПВО СССР и поставлялся за рубеж. Ровесник американского истребителя F-100 Super Sabre, хотя во Вьетнаме противостоял и более поздним F-4 Phantom II."
