l_russian:
  
  #Armistice 
 The_Chinese_Civil_war: "Китайская гражданская война"
 chinapeace.1.t: "США требуют перемирия"
 chinapeace.1.d: "Гражданская война в Китае не удалась для нас. Во-первых, оммунистические силы продвинулись далеко вперед, а во-вторых наша нация разрушается. Сегодня мы получили сообщение от правительства США, в котором предлагалось равное перемирие под их надзором и под надзором ООН. Мы будем защищены от внешних угроз со стороны США, пока действует перемирие. Наши враги также получили это предложение."
 chinapeace.1.a: "Согласиться, так будет лучше как для нас, так и для китайского народа."
 chinapeace.1.b: "Нет! Мы будем сражаться до конца, даже если нам придется бежать в Тайвань!"
 chinapeace.2.t: "США требуют перемирия"
 chinapeace.2.d: "Это был тяжелый бой. Наши силы жестоко борются за контроль над Китаем, в результате которого погибают миллионы солдат и гражданских лиц. Сегодня мы получили сообщение от правительства США, в котором предлагалось равное перемирие под их надзором и под надзором ООН. Мы будем защищены от внешних угроз со стороны США, пока действует перемирие. Наши враги также получили это предложение."
 chinapeace.2.a: "Согласиться, так будет лучше как для нас, так и для китайского народа."
 chinapeace.2.b: "Нет! Чан и его псы будут повешены!"
 chinapeace.3.t: "Перемирие вступило в силу"
 chinapeace.3.d: "Наши усилия были успешными. И РК, и КНР договорились о прекращении огня. Теперь мы должны достичь политического разрешения конфликта."
 chinapeace.3.a: "Мы сделали это!"
 chinapeace_prc_accept: "КНР согласилась на перемирие"
 chinapeace_roc_accept: "РК согласилась на перемирие"
 chinapeace_prc_deny: "КНР отказалась от перемирия"
 chinapeace_roc_deny: "РК отказалась от перемирия"
 marshall_mission: "Миссия Маршалла"
 chinese_civil_war_over: "Китайская гражданская война окончена"
 ROC_taiwan: "Республика Китай на Тайване"
  
 chinese_civil_war.1.t: "Конец Клики Ма"
 chinese_civil_war.1.d: "Мы разгромили силы Ма Буфана и захватили Цинхай. Это означает, что линии поставок РК в Синьцзян сокращены, а их администрация в провинции быстро разрушается. Оставшиеся силы Ма перешли к нам."
 chinese_civil_war.1.a: "Конец Чана близок."
 chinese_civil_war.2.t: "[GetNewspaperHeader]Конец Клики Ма"
 chinese_civil_war.2.d: "Коммунистическая Партия Китая оккупировала Цинхай, а силы Ма Буфана сдались. Это серьезный удар по Китайской Республике, поскольку это означает, что их правление в Синьцзяне подошло к концу. Тем более, что оставшиеся силы Ма Буфанга теперь присоединяются к КПК."
 chinese_civil_war.2.a: "Покойся с миром!"
  
