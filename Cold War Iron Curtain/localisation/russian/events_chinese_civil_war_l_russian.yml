l_english:
 The_Chinese_Civil_war: "Китайская гражданская война"
 chinapeace.1.t: "Соединенные Штаты просят о перемирии"
 chinapeace.1.d: "Гражданская война в Китае идет не очень хорошо для нас. Во-первых, Коммунистические силы продвинулись далеко вперед, а во вторых и наша нация разрушается с каждой секундой. Сегодня мы получили послание от правительства США, предлагающее равноправное перемирие под их контролем и контролем ООН. Пока действует перемирие, США будут защищать нас от внешних угроз. Наши враги также получили это предложение."
 chinapeace.1.a: "Согласиться, так будет лучше как для нас, так и для китайского народа."
 chinapeace.1.b: "Нет! Мы будем сражаться до конца, даже если нам придется бежать на Тайвань!"
 chinapeace.2.t: "Соединенные Штаты просят о перемирии"
 chinapeace.2.d: "Это была тяжелая борьба. Наши войска жестоко сражаются за контроль над Китаем, в результате гибнут миллионы солдат и мирных жителей. Сегодня мы получили послание от правительства США, предлагающее равноправное перемирие под их контролем и контролем ООН. Пока действует перемирие, США будут защищать нас от внешних угроз. Наши враги также получили это предложение."
 chinapeace.2.a: "Согласиться, так будет лучше как для нас, так и для китайского народа."
 chinapeace.2.b: "Нет! Чан и его псы будут повешены!"
 chinapeace.3.t: "Перемирие в гражданской войне вступает в силу."
 chinapeace.3.d: "Наши усилия увенчались успехом. Республика Китай и Китайская Народная Республика договорились о прекращении огня. Теперь мы должны достичь политического разрешения конфликта."
 chinapeace.3.a: "Мы сделали это!"
 chinapeace_prc_accept: "КНР согласилась на перемирие"
 chinapeace_roc_accept: "РК согласилась на перемирие"
 chinapeace_prc_deny: "КНР отказалась от перемирия"
 chinapeace_roc_deny: "РК отказалась от перемирия"
 marshall_mission: "Миссия Маршалла"
 chinese_civil_war_over: "Китайская гражданская война окончена"
 ROC_taiwan: "Республика Китай на Тайване"
 chinese_civil_war.1.t: "Конец Клики Ма"
 chinese_civil_war.1.d: "Мы разгромили силы Ма Буфана и захватили Цинхай. Это означает, что линии поставок РК в Синьцзян сокращены, а их администрация в провинции быстро разрушается. Оставшиеся силы Клики Ма перешли к нам."
 chinese_civil_war.1.a: "Конец Чана близок."
 chinese_civil_war.2.t: "[GetNewspaperHeader]Конец Клики Ма"
 chinese_civil_war.2.d: "Коммунистическая Партия Китая оккупировала Цинхай, а силы Ма Буфана сдались. Это серьезный удар по Китайской Республике, поскольку это означает, что их правление в Синьцзяне подошло к концу. Это подкрепляется тем фактом, что оставшиеся силы Ма Буфанга теперь присоединяются к КНР."
 chinese_civil_war.2.a: "Покойся с миром!"