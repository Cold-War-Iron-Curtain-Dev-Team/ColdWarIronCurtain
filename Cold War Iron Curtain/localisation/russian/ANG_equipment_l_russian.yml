 ANG_fighter_equipment_0:0 "Национальные военно-воздушные силы Анголы"
 ANG_fighter_equipment_0_short:0 "НААСА"
 ANG_fighter_equipment_0_desc:0 "Национальные воздушные силы Анголы или FANA (Força Aérea Nacional de Angola) - это воздушный филиал вооруженных сил Анголы. Имея на вооружении более 300 самолетов, FANA является (на бумаге) одной из крупнейших военно-воздушных сил Африки."
 ANG_jet_multirole_equipment_2:0 "Микоян-Гуревич МиГ-15"
 ANG_jet_multirole_equipment_2_desc:0 "Возможно, один из самых знаковых истребителей холодной войны, МиГ-15 \"Фагот\" Микояна-Гуревича поступил на вооружение в 1947 году. МиГ-15 участвовал во многих конфликтах после своего появления в Корейской войне, где он оказался достойным противником американских F-86 Sabre и F9F Panther. Участок корейско-китайской границы был прозван Аллеей МиГов из-за их широкого распространения в этом районе. Было построено более 18 000 МиГ-15, которые использовались многими странами, в первую очередь СССР и странами Восточного блока. Хотя большинство самолетов было списано в 1950-х годах, некоторые до сих пор остаются на вооружении ВВС Северной Кореи."
 ANG_jet_multirole_equipment_2_short:0 "МиГ-15"
 ANG_jet_multirole_equipment_3:0 "Микоян-Гуревич МиГ-17"
 ANG_jet_multirole_equipment_3_desc:0 "Прямой преемник МиГ-15 \"Фагот\". Более 10 000 МиГ-17 \"Фреско\" было произведено с 1952 года. МиГ-17 был построен по лицензии в ВВС НОАК как Shenyang J-5. В общей сложности МиГ-17 использовался в 20 странах Африки, Европы и Азии. Его первое боевое применение состоялось в 1958 году, когда МиГи КНР столкнулись с националистическими китайскими F-86 Sabres над Тайваньским проливом. Однако в первую очередь МиГ-17 использовался во время войны во Вьетнаме в составе ВВС НОАК и ВВС НОАК, где он одержал 28 воздушных побед. МиГ-17 был настолько успешен, что даже противостоял более современным сверхзвуковым американским истребителям Phantom II во время войны во Вьетнаме. МиГ-17 был снят с вооружения в 1970-х годах, но до сих пор ограниченно эксплуатируется в некоторых африканских странах и Северной Корее."
 ANG_jet_multirole_equipment_3_short:0 "МиГ-17"
 ANG_jet_multirole_equipment_4:0 "Микоян-Гуревич МиГ-19"
 ANG_jet_multirole_equipment_4_desc:0 "МиГ-19 был первым советским серийным самолетом, способным развивать сверхзвуковую скорость в ровном полете. Сравнимым американским истребителем \"Century Series\" был North American F-100 Super Sabre, хотя МиГ-19 в основном сражался с более современными McDonnell Douglas F-4 Phantom II и Republic F-105 Thunderchief над Северным Вьетнамом."
 ANG_jet_multirole_equipment_4_short:0 "МиГ-19"
 ANG_jet_multirole_equipment_6:0 "Микоян-Гуревич МиГ-21MФ"
 ANG_jet_multirole_equipment_6_desc:0 "Серийный вариант всепогодного перехватчика. Они оснащались турбореактивными двигателями R11F2-300 и, начиная с седьмой серийной партии, оснащались радаром РП-21 (на первых шести партиях использовался более старый радар ЦД-30Т (он же РП-9-21). Кроме того, система управления вооружением была модифицирована по сравнению с F-13, что позволило использовать лучевую АУ РС-2УС (она же К-5МС) в дополнение к К-13 с ИК-целью."
 ANG_jet_multirole_equipment_6_short:0 "МиГ-21MФ"
 ANG_jet_multirole_equipment_7:0 "Микоян-Гуревич МиГ-21"
 ANG_jet_multirole_equipment_7_desc:0 "МиГ-21"
 ANG_jet_multirole_equipment_7_short:0 "Окончательное развитие МиГ-21, оснащенный турбореактивным двигателем Туманского Р25-300 и множеством других усовершенствований по сравнению с предыдущими типами. МиГ-21бис для советских войск ПВО оснащались системой ГСИ \"Лазурь\", а для советских ВВС - системой ИЛС \"Полет\"."
 ANG_jet_multirole_equipment_8:0 "Микоян-Гуревич МиГ-23МЛ"
 ANG_jet_multirole_equipment_8_desc:0 "Ранние варианты \"Флоггера\" имели ряд конструктивных недостатков, включая прочность и надежность планера, работу двигателя, маневренность и радиолокационные характеристики. Была проведена значительная переделка планера, в результате которой появился МиГ-23МЛ."
 ANG_jet_multirole_equipment_8_short:0 "МиГ-23МЛ"
 ANG_jet_CAS_equipment_7:0 "Сухой Су-22M4"
 ANG_jet_CAS_equipment_7_short:0 "Су-22M4"
 ANG_jet_CAS_equipment_7_desc:0 "Сухой Су-17 \"Фиттер-С\" был дальнейшим развитием советского штурмовика Су-7Б. Су-17 широко экспортировался в ВВС стран Восточного блока, арабских государств и Южной Америки. Су-17 улучшил практически все аспекты своего предшественника, включая датчики, летные характеристики, полезную нагрузку, дальность полета и изменяемую стреловидность крыла. С 1969 по 1990 год было произведено 2867 самолетов, которые использовались в 30 странах, в 6 из которых они используются и сегодня."
 ANG_jet_CAS_equipment_8:0 "Сухой Су-25"
 ANG_jet_CAS_equipment_8_short:0 "Су-25"
 ANG_jet_CAS_equipment_8_desc:0 "Сухой Су-25 Frogfoot - двухмоторный штурмовик, разработанный в Советском Союзе. Самолет совершил первый полет в 1975 году и был представлен в 1981 году. С 1978 года было произведено более 1000 самолетов. Самолет был особенно популярен за рубежом, он был продан в 29 стран. Благодаря этому Су-25 участвовал в нескольких конфликтах, в частности, в советско-афганской, ирано-иракской и войне в Персидском заливе. Сегодня самолет остается на вооружении всех стран-экспортеров."
 ANG_jet_light_equipment_2:0 "Микоян-Гуревич МиГ-15УТИ"
 ANG_jet_light_equipment_2_short:0 "МиГ-15УТИ"
 ANG_jet_light_equipment_2_desc:0 "6 апреля 1949 года коллективу ОКБ-155 было официально поручено разработать учебно-тренировочный вариант истребителя МиГ-15. Опытный образец самолета МиГ-15УТИ был изготовлен на заводе № 1 в марте-мае 1949 года. Кабина инструктора на УТИ МиГ-15 была размещена за счет уменьшения первого фюзеляжного топливного бака. Обе герметичные кабины были оборудованы катапультными креслами и фонарями пиромеханического сброса. Специальное оборудование машины состояло из автоматического пушечного прицела АСП-1Н, приемопередающей радиостанции РСИ-6К, радиокомпаса с маркером РПКО-10М, переговорного устройства СПУ-2М, кислородного прибора КП-14 и фотоаппарата АФА-ИМ. Вооружение состояло из одной 23-мм пушки НР-23 с боекомплектом 80 патронов и одного пулемета УБК-Э с боекомплектом 150 патронов."
 ANG_jet_light_equipment_3:0 "Л-29 Дельфин"
 ANG_jet_light_equipment_3_short:0 "Л-29 Дельфин"
 ANG_jet_light_equipment_3_desc:0 "Aero L-29 Delfín (на английском языке - Dolphin, по классификации НАТО - Maya) - военный реактивный учебно-тренировочный самолет, разработанный и произведенный чехословацкой авиастроительной компанией Aero Vodochody. В ходе реализации программы было произведено более 3000 учебно-тренировочных самолетов L-29 Delfin. Из них около 2 000, как сообщается, были поставлены в Советский Союз, где они использовались в качестве стандартного учебно-тренировочного самолета для советских ВВС."
 ANG_jet_light_equipment_4:0 "Аэро Л-39 Альбатрос"
 ANG_jet_light_equipment_4_short:0 "Л-39 Альбатрос"
 ANG_jet_light_equipment_4_desc:0 "Aero L-39 Albatros - это высокоэффективный реактивный учебно-тренировочный самолет, разработанный в Чехословакии компанией Aero Vodochody. Он был разработан в 1960-х годах как замена Aero L-29 Delfín в качестве основного учебного самолета. Это был первый учебно-тренировочный самолет, оснащенный турбовентиляторной силовой установкой. Этот тип экспортировался во многие страны в качестве военного учебно-тренировочного самолета."
 ANG_jet_light_equipment_5:0 "Аэро Л-39ЗA Альбатрос"
 ANG_jet_light_equipment_5_short:0 "Л-39ЗA Альбатрос"
 ANG_jet_light_equipment_5_desc:0 "Значительно модернизированный L-39 для вооруженной подготовки и легких атак, с более прочным шасси, большей полезной нагрузкой и, в частности, с возможностью установки 23-миллиметровой двухствольной пушки ГШ-23Л, закрепленной в конформной капсуле под кабиной пилота, с магазином на 150 патронов внутри планера."
 ANG_transport_plane_equipment_2:0 "Антонов Ан-2"
 ANG_transport_plane_equipment_2_short:0 "Ан-2"
 ANG_transport_plane_equipment_4:0 "Антонов Ан-12"
