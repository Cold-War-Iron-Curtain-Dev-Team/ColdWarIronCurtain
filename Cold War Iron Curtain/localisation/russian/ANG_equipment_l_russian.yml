 ANG_transport_plane_equipment_6_desc:0 "Ан-32 - это, по сути, переделанный Ан-26. Он разработан таким образом, чтобы выдерживать неблагоприятные погодные условия лучше, чем стандартный Ан-26. Анонсированный на Парижском авиасалоне в мае 1977 года, Ан-32 отличается от своего предшественника двигателями, поднятыми на 1,5 м над крылом, чтобы избежать повреждения посторонними предметами на неровных, неподготовленных взлетно-посадочных полосах."
