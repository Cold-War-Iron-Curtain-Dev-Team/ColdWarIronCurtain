l_english:
 ANG_infantry_equipment_0:0 "Карабин 98k Эспингарда 8 мм Маузер м/938"
 ANG_infantry_equipment_0_short:0 "Маузер м/938"
 ANG_infantry_equipment_0_desc:0 "Винтовка Mauser-Vergueiro была разработана в 1904 году Жозе Альберто Вергейро, пехотным офицером португальской армии, и производилась компанией Deutsche Waffen und Munitionsfabriken (DWM). Он был разработан на основе винтовки Mauser 98 с применением новой системы затвора, заимствованной из Gewehr 1888 и Mannlicher-Schönauer. За пределами Португалии это оружие было также известно под названием \"Португальский Маузер\"."
 ANG_infantry_equipment_1:0 "Автомат Калашникова 1947"
 ANG_infantry_equipment_1_short:0 "АК-47"
 ANG_infantry_equipment_1_desc:0 "АК47 - полностью автоматический автомат, разработанный в Советском Союзе Михаилом Тимофеевичем Калашниковым в 1947 году, но поступивший на вооружение только в 1948 году, когда был запущен в производство вариант с фиксированным затвором. В начале 1949 года АК47 был принят на вооружение советских вооруженных сил для массового поступления на вооружение фронтовых частей. Благодаря длинноходному газовому поршню, селектору/предохранителю, автоматическому спусковому крючку и патроннику, а также дальнейшему совершенствованию общей конструкции АК47 стал значительной модернизацией СКС. На протяжении многих лет АК47 считался одним из самых надежных и простых в обслуживании, обращении и освоении оружием в мире."
 ANG_infantry_equipment_2:0 "Автомат Калашникова Модернизированный"
 ANG_infantry_equipment_2_short:0 "AKM"
 ANG_infantry_equipment_2_desc:0 "АКМ - это модернизированный вариант автомата АК47, разработанный Михаилом Калашниковым, который был создан в конце 1950-х годов и поступил на вооружение Советской Армии в 1959 году. Большая часть оружия была оптимизирована и переработана в соответствии с потребностями модернизируемой армии. Многие детали были упрощены для массового производства, а фрезерованная стальная ствольная коробка была заменена П-образной стальной штамповкой для повышения темпов производства. В результате упрощения конструкции вес оружия снизился на ~30%. Кроме того, оружие было усилено для придания ему большей прочности и добавлены направляющие для улучшения движения затворной рамы. АКМ немедленно и повсеместно стал использоваться во многих коммунистических странах и производился для участия в конфликтах на протяжении всего срока службы. Наиболее заметным было вторжение в Чехословакию, где он использовался обеими сторонами."
 ANG_infantry_equipment_3:0 "Хеклер и Кох Г3A3"
 ANG_infantry_equipment_3_short:0 "Хеклер и Кох Г3A3"
 ANG_infantry_equipment_3_desc:0 "Наиболее известная версия 1963 года. Барабанный прицел с улучшенной мушкой, пламегаситель/дульный тормоз, способный стрелять гранатами стандарта НАТО, фиксированный цельнопластиковый приклад и пластиковая гарда, не соприкасающаяся со свободно висящим стволом. Наконечник выпускался в тонком, вентилируемом и широком вариантах. Последний вариант позволяет устанавливать сошки."
 ANG_mbt_equipment_2:0 "T-54"
 ANG_mbt_equipment_2_short:0 "T-54"
 ANG_mbt_equipment_2_desc:0 "Танк Т-54 был самым производимым танком в истории. Танк был разработан в 1946 году конструктором КМБД. Танк оснащен 100-мм нарезной пушкой и имеет различную толщину брони - от 205 мм до 60 мм. Двигатель - дизельный V-12 объемом 38,88 л. Танк использует торсионную подвеску и способен развивать скорость до 48 км/ч. Сам танк использовался в более чем 50 армиях мира и выпускался на протяжении всего советского периода и всех конфликтов вместе с ним."
 ANG_mbt_equipment_3:0 "T-55"
 ANG_mbt_equipment_3_short:0 "T-55"
 ANG_mbt_equipment_3_desc:0 "Т-55 - это усовершенствованная версия танка Т-54. ОКБ-520 модифицировало конструкцию Т-55, улучшив противоядерную защиту, поставив более оптимизированный двигатель, улучшив форму башни, и даже добавив дополнительное оборудование, такое как улучшенное управление огнем и оптика. Кроме того, Т-55 чаще использовал 12,7 ДШК HMG, в то время как Т-54 использовал 7,62 SGMT пушку, что давало ему больше огневой мощи, но не позволяло нести больше боеприпасов. Т-55 использовался в столь же многочисленных армиях и, как правило, участвовал во всех конфликтах, что и Т-54."
 ANG_mbt_equipment_4:0 "T-62"
 ANG_mbt_equipment_4_short:0 "T-62"
 ANG_mbt_equipment_4_desc:0 "Т-62 является дальнейшим развитием танка Т-55. Т-62 использует гладкоствольную пушку и имеет несколько более толстую броню. Главная пушка также была увеличена до 115 мм. Изначально он был заказан Советским Союзом в попытке улучшить огневую мощь, и конструкторское бюро ОКБ-520 завершило проект около 1960 года. Несмотря на усовершенствование, производство не было прекращено, так как его стоимость была номинально выше, чем у Т-55. Было произведено более 22 700 единиц Т-62, которые приняли участие в огромном количестве боевых действий по всей советской территории, но в основном в конфликтах на Ближнем Востоке. Его усовершенствования показали несколько большие возможности в 1969 году в китайско-советском пограничном конфликте."
