 finv.1.t: "Кабинет Рихтниеми I"
 finv.1.d: "После поражения Кекконена на президентских выборах 1968 года Кабинет Паасио I решил самораспуститься и позволить сформировать новое правительство. СДП начала переговоры о формировании правительства, но не смогла сформировать его. После этого председатель Кокоомуса, Юха Рихтниеми смог сформировать Кабинет Рихтниеми I.\n\nКабинет является консервативным и состоит из Кокоомуса, Кескустапуолуэ, СПМ и СКЛ. Лидер СМП Вейкко Веннамо получил пост министра сельского хозяйства. Президент Вирккунен заявил о своей поддержке правительства и нового премьер-министра Юхи Рихтниеми."
 finv.2.t: "Парламент проголосовал за отказ от планов смягчения алкогольного законодательства"
 finv.2.d: "Сегодня правительство проигнорировало пакет законов об алкоголе после того, как голосование в парламенте по нему провалилось со счетом 87-113. В этом предложении было: \n-Разрешение ресторанам и барам более свободно продавать больше видов алкоголя\n-Разрешение продавать слабое пиво до 3,5% в продуктовых магазинах\n-постепенная отмена так называемой \n-"Карты Выпивки\n" (Viinakortti)\n-Реформа магазинов Oy Alkoholiliike Ab, чтобы они были более дружелюбными и простыми в использовании\n-Лучшее просвещение о вреде алкоголя.\n\nНыне законы остаются такими же, как и раньше. Текущее правительство удовлетворено этим, вместе с президентом Вирккуненом."
 finv.3.t: "Кабинет министров Юннила I"
 finv.3.d: "После смерти бывшего премьер-министра Юхи Рихтниеми были проведены новые парламентские выборы. На выборах победил Кокоомус, который сформировал кабинет Юннила I. Это коалиционное правительство большинства, сформированное Кокоомусом, Кескустапуолуэ, СМП и Либералитетом. Новым премьер-министром стал Тууре Юннила."
 finv.4.t: "Ханну Салама получил более суровый приговор"
  
 fin.1.d: "Слишком долго рабочие предприятия Kemi Oy Pajusaari бастовали. После того, как отдел заработной платы Министерства социального обеспечения хотел снизить зарплату деревообработчиков на 30-40 процентов, рабочие решили бастовать. Вскоре за ними последовали работники портов Кеми и Каарихаара, а также некоторые местные деревообработчики, в результате чего бастовали тысячи рабочих. Ситуация начала обостряться, когда несколько сторон попытались завершить забастовку в свою пользу. Борьба шла в основном между Коммунистической партией Финляндии и кабинетом премьер-министра К-А. Фагерхольма. Кабинет контролировал большую часть профсоюзов через Социал-демократическую партию, а коммунисты хотели вернуть власть своей парламентской организации - Финской народно-демократической лиги, потерянной на выборах в законодательное собрание в 1948 году. Даже Советский Союз пытался вмешаться в ситуацию: советский посол Григорий Савоненков заявил о своей поддержке бастующих рабочих.\nПо мере того, как забастовки продолжались, правительство объявило их незаконными. Забастовка вызвала затор из 20,5 миллионов кубических футов бревен в устье реки Кемийоки. Работодатели наняли бастующих и привели их на работу под охраной полиции.\nПосле мирного шествия более 3 000 бастующих направились к устью реки, где бастующие валили бревна и освобождали затор. Когда марш был остановлен вооруженными полицейскими, вспыхнули жестокие беспорядки. Протестующие орудовали палками и камнями, а полиция использовала дубинки и пистолеты. Один забастовщик был застрелен, а одна женщина-работница была смертельно ранена грузовиком. До сих пор неясно, кто произвел смертельный выстрел. Согласно официальной судебно-медицинской экспертизе, пуля не была выпущена ни из одного из полицейских пистолетов. Один из полицейских заявил, что ему помешало выстрелить в агрессивного нападающего только то, что его пистолет заклинило.\nВ результате президент Юхо Кусти Паасикиви объявил общую тревогу вооруженных сил, и правительство направило в Кеми армейские войска. Это закончилось арестом 22 ведущих активистов. Позднее в восстании были обвинены 127 забастовщиков, 63 из них были отправлены в тюрьму. Насилие со стороны полиции вызвало серию забастовок сочувствия по всей Финляндии со стороны профсоюзов, в которых доминировали коммунисты, таких как профсоюз моряков под руководством Ниило Вялляри и большое количество металлистов.\nФинское правительство даже боялось коммунистического восстания и советской интервенции. Коммунисты, в свою очередь, обвиняли правительство в нарушении Парижского мирного договора, поскольку оно направило военных против бастующих рабочих. Американская пресса охарактеризовала этот инцидент как \"испытание для Финской демократии\". Советская газета Правда говорила о \"полицейском терроре\" и "Сотрудничестве Премьер-Министра Фагерхольма с Американскими Империалистами". Забастовки сочувствия были окончательно прекращены через несколько недель, так как Центральная организация профсоюзов Финляндии, контролируемая социал-демократами, исключила бастующих из профсоюзов. Несколько других профсоюзов решили отменить запланированные забастовки. Некоторые профсоюзные лидеры были позже отданы под суд и получили небольшие сроки заключения."
 fin.2.d: "Хотя многие страны начали исследования в области компьютеров за много лет до Финляндии, в конце концов, в середине 1950-х годов Хельсинкский технологический университет начал надлежащее исследование этой технологии в Финляндии. Работа была поручена рабочей группе под названием Matematiikkakonekomitea, известной на русском языке как Комитет по Математическим Машинам, возглавляемый Эркки Лаурила.\n\nОни начали работу над первым финским компьютером, основанным на прототипе немецкого компьютера G1a. Однако проект столкнулся с множеством проблем, включая ошибки в чертежах, невозможность модификации из-за того, что это был готовый дизайн, и тот факт, что G1a был уже устаревшим. Компьютер, названный ESKO, сокращенно Elektroninen SarjaKOmputattori, был закончен в 1960 году.\n\n\nПервым компьютером в Финляндии был IBM 650 по прозвищу ENSI, заказанный Postisäästöpankki в 1958 году."
 fin.3.t: "Смерть президента Ю.К. Паасикиви"
 fin.3.d: "Президент Юхо Кусти Паасикиви умер в возрасте 86 лет. Последние недели жизни он провел в больнице Салус в Хельсинки из-за проблем с сердцем и общей усталости. В 10:20 утра у него произошла остановка сердца, и, несмотря на все усилия врачей, он вскоре скончался.\n\nПохороны с национальными почестями запланированы на конец декабря в Хельсинкском Сууркиркко. Его последнее пристанище будет находиться на могиле Хиетаниеми в Хельсинки. \"Suuren vainajan mukana oli poistunut kappale Suomen historiaa, jota hän itse oli ollut luomassa!\" (\"С великим постигшим его несчастьем испарилась часть финской истории, которую он сам создавал!\) сказал репортер Filmisepo во время передачи новостей.\n\nПоскольку он умер на посту, пришло время выбирать нового президента. Наиболее вероятным кандидатом является Урхо Кекконен, близкий союзник Паасикиви. §YВпрочем, некоторые считают, что победить может и Хертта Куусинен, если она станет президентом после смерти Мауно Пеккала, а Паасикиви решит содействовать финскому единству.§!"
 fin.3.a: "Lepää Rauhassa"
 fin.4.t: "Что Такое Доктрина Паасикиви-Кекконена?"
 fin.4.d: "Доктрина Паасикиви-Кекконена - это внешнеполитическая доктрина, созданная президентом Юхо Кусти Паасикиви и его близким соратником Урхо Кекконеном, целью которой является сохранение Финляндии как независимой, суверенной, демократической и капиталистической страны в непосредственной близости от Советского Союза. Это означает использование иногда даже радикальных мер, чтобы убедиться, что Советы видят в Финляндии хорошего соседа.\n\nДоктрина подверглась критике, начиная от того, что Советы не считают Финляндию нейтральной, сотрудничают с западными спецслужбами, и заканчивая тем, что некоторые видят в доктрине тенденцию к \"литургии\" хороших отношений."
 fin.4.a: "Мы нейтральны, клянемся!"
 fin.5.t: "Переговоры о Возвращении Порккалы"
 fin.5.d: "Военно-Морская База Порккала - это советская военно-морская база на полуострове Порккала, состоящая из муниципалитетов Деферби, большей части Киркконумми, Порккаланниеми, Упинниеми и нескольких небольших островов. База расположена всего в 30 километрах (19 миль) к западу от Хельсинки. Согласно перемирию 1944 года, эта территория была передана Советскому Союзу на 50 лет. 10 февраля 1947 года Парижский мирный договор подтвердил право Советского Союза занимать эту территорию до 1994 года.\n\nНекоторые называют базу кинжалом, направленным на столицу Финляндии, но в случае войны она давала бы Советскому Союзу значительное преимущество. В результате, в наших интересах было бы выбить оттуда советские войска.\nНесмотря на это, ходили слухи, что они могут захотеть вернуть его нам, так как технологический прогресс сделал береговую артиллерию устаревшей, а также продемонстрировать Западу мирные отношения между нашими странами. Несмотря на это, когда наш дипломат Ээро А. Вуори спросил советского посла Виктора Лебедева об этих слухах, тот быстро опроверг их, заявив \"Порккала необходима для обороны Ленинграда и безвредна для Финляндии.\" Однако это не остановило слухи, и нашему лидеру [FIN.GetLeader] было рекомендовано обсудить это в ходе предстоящего государственного визита."
 fin.5.a: "Будем надеяться на Лучшее"
 fin.6.t: "Встреча с Финским Лидером"
 fin.6.d: "Президент Финляндии [FIN.GetLeader] прибыл несколько часов назад с государственным визитом. После небольшой экскурсии по Москве и ужина настало время для дипломатической беседы. После краткого разговора о ситуации в мире, обсуждение перешло к отношениям между нами и Финляндией. Прежде всего, было решено продлить Договор о дружбе, сотрудничестве и взаимной помощи (ДСП) на 20 лет. В какой-то момент предметом обсуждения стал район Порккала. [FIN.GetLeader] упомянул о слухах, что мы, возможно, хотели бы вернуть ее раньше времени.\n\nДействительно, уже некоторое время [SOV.GetLeader] вместе с несколькими генералами рассматривает вопрос о полезности базы. С тех пор, как мы получили базу в 1944 году, технологии значительно продвинулись вперед, и первоначальная польза была утрачена. Кроме всего прочего, база очень дорога в обслуживании из-за своего расположения и необходимости чрезвычайно жесткой охраны границы.\n\n[SOV.GetLeader] не отрицал эти слухи, но не хотел рассказывать о причинах по соображениям государственной безопасности. Затем [FIN.GetLeader] спросил, готовы ли мы начать переговоры о возвращении базы обратно в Финляндию."
 fin.6.tt: "Это означает, что вы сохраните базу до конца срока аренды (1994 год). Однако учтите, что ее содержание обходится очень дорого из-за ее расположения и необходимости чрезвычайно жесткой охраны границы. С течением времени расходы будут только расти. Кроме того, размещенный там персонал, как правило, мало интересуется своими обязанностями, предпочитая пьянствовать и устраивать беспорядки. Некоторые даже могут попытаться дезертировать в Финляндию.\nЕсли этого недостаточно, мы упускаем прекрасную дипломатическую возможность продемонстрировать Западу нашу готовность к миру с нейтральным соседом. Финское правительство вряд ли будет возражать против нашего решения, но финский народ будет недоволен. [SOV.GetLeader], мы не будем вас останавливать, но, пожалуйста, помните, мы вас предупреждали.\n"
 fin.7.d: "Сегодня, [GetDateText] народ Финляндии был потрясен известием о смерти маршала Карла Густава Маннергейма, скончавшегося накануне в Швейцарии. Уход маршала был ожидаем как в близком окружении, так и среди финского народа.\nЗа несколько дней до этого Маннергейм заболел и ему была сделана срочная операция на брюшной полости. Операция прошла успешно, однако его сердце больше не могло выдерживать нагрузку от других болезней. Он понял, что конец близок, попрощался с присутствующими и поблагодарил их за все, что они для него сделали. Вскоре после этого он потерял сознание и умер через четыре часа.\nВ кантонской больнице тело маршала покоилось на подиуме в центре часовни, покрытое финским флагом и окруженное цветами. Вокруг него в почетном карауле стояли швейцарские полицейские. На следующий день президент [FIN.GetLeader] торжественно и красиво говорил по радио о памяти и жизненном пути Маннергейма. Правительство назначило комиссию по подготовке государственных похорон. Было решено, что похороны состоятся через 2 недели."
 fin.8.t: "Порккала возвращается к нам!"
 fine.8.d: "Президент [FINE.Get Leader] возвращается с государственного визита в Советский Союз победителем. После напряженных переговоров с [SOV.GetLeader] было решено, что Порккала будет возвращена нам. Однако это займет несколько месяцев, поскольку советы готовятся покинуть этот район, уничтожая военные объекты и выводя свои войска. Тем временем мы должны ратифицировать соглашение в парламенте и подготовиться к возвращению земли их законным владельцам. Вскоре после своего прибытия президент [FINE.Get Leader] выступил с речью по радио, заявив: "Впервые я вернулся из Советского Союза удовлетворенным. Перо исправило то, что сломал меч.\"\n\Другой темой встречи стало соглашение о дружбе, сотрудничестве и взаимопомощи (YYA), которое было продлено еще на 20 лет."
 fin.9.t: "Порккала Остается Советской"
 fin.9.d: "Президент [FIN.GetLeader] вернулся из государственного визита в Советский Союз. Несмотря на большие надежды, они отказались вернуть нам Порккалу. Хотя [SOV.GetLeader] подтвердил, что такой вариант рассматривался, в конечном итоге было решено, что эта территория все еще полезна для них. Кроме того, встреча была названа приятной.\n\nДругой темой был Договор о дружбе, сотрудничестве и взаимной помощи (ДСП). Он был продлен еще на 20 лет без изменений, несмотря на некоторые возражения против этого."
 fin.10.t: "День Возвращения"
 fin.10.d: "После нескольких месяцев подготовки как с нашей, так и с советской стороны, район Порккала, наконец, возвращается под наш контроль после того, как он находился под контролем советских войск с 1944 года. Последние советские солдаты покинули район, а соглашение о возвращении было подписано в советском посольстве в Хельсинки.\nВскоре после этого на мосту Эспоонлахти открылись пограничные ворота, и финские солдаты маршем направились в район. Советский Союз организовал экскурсию для финских и иностранных журналистов.\n\nВ прессе это событие описывается как \"Победа Доктрины Паасикиви-Кекконена.\" Некоторые даже рассматривают это как возможность возвращения Карелии. Однако возвращение Карелии вызвало и критику, некоторые критикуют Кекконена за то, что он приписывает себе слишком много заслуг в этом событии. Министр Аарре Симонен преуменьшил значение этого события из-за того, что в сделку не была включена Карелия. Президент [FIN.GetLeader] резко отругал его, закончив свою тираду словами: \"Может быть, господин Симонен сам поедет в Москву и возьмет с собой американского солдата.\" \n\nПоскольку советской власти не было особого смысла использовать базу, многие из оставшихся зданий демонстрировали признаки запустения. Хуже того, многие кладбища были разрушены, а могилы подверглись вандализму. Хотя это было проигнорировано как работа всего лишь нескольких пьяных солдат, они уже согласились восстановить ущерб и выплатить обильную компенсацию за это."
 fin.11.t: "[GetNewspaperHeader]Акт Советской Доброты"
 fin.11.d: "Сегодня Советский Союз продемонстрировал свою готовность к миру. В совместном заявлении президента Финляндии [FIN.GetLeader] и генерального секретаря [SOV.GetLeader] было объявлено, что Советский Союз вернет Финляндии военно-морскую базу Порккала, расположенную рядом с Хельсинки.\n\nСоветский Союз арендовал военно-морскую базу Порккала на пятьдесят лет в 1947 году в рамках мирного соглашения с Финляндией. Причины оккупации Порккалы были связаны с обороной советских морских путей в Финском заливе и защитой Ленинграда. Однако Порккала также функционировала как армейская база, которая играла определенную роль в планируемых советских сухопутных операциях.\n\nХотя финский народ празднует возвращение, многие западные страны называют это не более чем дешевым пропагандистским трюком."
 fin.12.t: "Последний Поезд в Союз"
 fin.12.d: "226 500 000 долларов. Именно столько мы были вынуждены заплатить Советскому Союзу в рамках Московского перемирия. Год за годом поезда, лодки, двигатели и другие предметы были сделаны и отправлены в Советский Союз. Но больше нет. Последний репарационный поезд ушел с пограничной железнодорожной станции Вайниккала.\nЛюди по всей стране празднуют. Мы не только освободились от огромного финансового бремени, но и достигли чего-то конкретного. Некоторые даже говорят, что к нам вернулась часть нашей независимости.\nВ честь праздника в Выставочном зале Хельсинки состоится грандиозная вечеринка, на которой выступят Урхо Кекконен, Пенна Терво, Сванте Зундман и Павел Кумыкин."
 fin.13.t: "8-й Всемирный Фестиваль Молодежи и Студентов"
 fin.13.d: "В Хельсинки только что прошел 8-й Всемирный Фестиваль Молодежи и Студентов. Всемирная Федерация Демократической Молодежи организовала этот фестиваль вместе с Международным Союзом Студентов, а также при существенной государственной поддержке. Финляндия стала второй страной после Австрии, проводившей этот фестиваль, несмотря на то, что она является неприсоединившимся государством. В итоге фестиваль обошелся в 853 миллиона марок.\n\nОколо 1000 мероприятий было запланировано в рамках фестиваля, а его участникам были предоставлены бесплатные обеды и жилье в Хельсинки. В фестивале приняли участие около 52 000 человек из 137 стран. Это было крупнейшее мероприятие, организованное в Хельсинки со времен летних Олимпийских игр 1952 года. По данным местных газет, под конец фестиваля присутствовало не менее 95 000 человек. На фестивале присутствовал советский космонавт Юрий Гагарин. Девиз фестиваля - "За Мир и Дружбу."
 fin.13.tt: "Отдать Финляндии контроль над Карелией, не объединяя ее."
 fin.14.t: "Запрос Отклонен"
 fin.14.d: "К сожалению, Советы отклонили наш запрос на получение Карелии."
 fin.15.t: "Частичное Согласие"
 fin.15.d: "Советы частично согласились на наш запрос о Карелии. Они позволят нам управлять регионом, но нам не разрешат его интегрировать."
 fin.16.t: "Карелия - Наша!"
 fin.16.d: "Советы согласились на нашу просьбу о Карелии. Теперь она будет частью нашего государства."
 fin.17.t: "Конец Демократии"
 fin.17.d: "Сегодня демократия для нас умерла. Как объявила теперь генеральный секретарь Хертта Куусинен, Финляндской Республики больше нет. На ее месте поднимается Финская Демократическая Республика, государство трудящихся, свободное от гнета капитализма и фашизма. Никто не может точно сказать, как это произошло, но сейчас это не имеет значения."
 fin.18.t: "[GetNewspaperHeader]Первая Телевизионная Передача"
 fin.18.d:0 "Сегодня состоялась первая телевизионная трансляция в Финляндии. Более пятидесяти человек были приглашены следить за трансляцией. В разных частях Хельсинки было пятнадцать приемников. Настраивающая картинка с музыкой начала транслироваться в 16:00. Собственно программа началась в 16:30 с выступления Политехнического хорового квартета и вступительного слова Б. Вуолте, ректора университета. Камера была одна. Ведущим программы был актер Лассе Пейсти. Также присутствовали художники Хелена Винкка, Рауха Рентола и Майкки Лансио. Также была программа на шведском языке: художники Биргитта Ульфссон и Нильс Брандт исполнили скетч под названием "Арми и Гил в поезде". Детям показали кукольный спектакль Моны Леон. Программа также включала гипноз и обзоры новостей. Часовая трансляция завершилась обзором погоды и распределением стипендий Хямяляйнену и Ларкке. Наконец, профессор Йоуко Похьянпало попрощался со зрителями, сказав: "Сегодня состоялась первая телевизионная трансляция в Финляндии. Более пятидесяти человек были приглашены следить за трансляцией. В разных частях Хельсинки было пятнадцать приемников. Настраивающая картинка с музыкой начала транслироваться в 16:00. Собственно программа началась в 16:30 с выступления Политехнического хорового квартета и вступительного слова Б. Вуолте, ректора университета. Камера была одна. Ведущим программы был актер Лассе Пейсти. Также присутствовали художники Хелена Винкка, Рауха Рентола и Майкки Лансио. Также была программа на шведском языке: художники Биргитта Ульфссон и Нильс Брандт исполнили скетч под названием "Арми и Гил в поезде". Детям показали кукольный спектакль Моны Леон. Программа также включала гипноз и обзоры новостей. Часовая трансляция завершилась обзором погоды и распределением стипендий Хямяляйнену и Ларкке. Наконец, профессор Йоуко Похьянпало попрощался с аудиторией, сказав: "До свидания, увидимся позже!" Трансляция не сохранена.\n\Прегулярное телевизионное вещание началось в 1956 году с двух еженедельных передач. Первая цветная трансляция состоялась 24 мая 1960 года."
 fin.19.t: "Заседание Коммунистической Партии"
 fin.19.d: "Пришло время обратиться к руководству страны. Хертта Куусинен выразила свою заинтересованность в продолжении руководства страной. Имея большую поддержку, не многие могут реально оспорить ее позицию. Однако два человека выступили против нее. Аймо Аалтонен, председатель Коммунистической Партии, работавший руководителем Службы безопасности Финляндии, и Вилле Песси, скромный человек, открытый для сотрудничества с социал-демократами. Кто же это будет?"
 fin.20.t: "Закон о Сохранении Сайменской кольчатой нерпы"
 fin.20.d: "Сегодня мы сделали важный шаг к защите Сайменской кольчатой нерпы. С этого момента вид получает статус охраняемого, что означает запрет на охоту и убийство. Поскольку их осталось всего около 100 особей, многие высоко оценили это решение. Однако некоторые рыбаки протестуют против этого, утверждая,\ "Никто не должен заботиться о них.\""
 fin.21.t: "Критика Правильной Речи"
 fin.21.d: "Сегодня президент Эйно Кильпи выступил с речью о текущей политической ситуации в Финляндии. Речь, длившаяся около 20 минут, состояла в основном из критики в адрес правых партий и их нежелания сотрудничать. Речь была охарактеризована как \"Крайне бессодержательная, полная сухих политических разговоров, до которых большинству граждан нет никакого дела\". Тем не менее, некоторые хвалили речь и президента за то, что он осмелился выступить против правого крыла."
 fin.22.t: "Изгнание Видных Социал-Демократов"
 fin.22.d: "Получив власть, коммунисты начали чистку своих соперников, нанося самые сильные удары по социал-демократам. Сегодня, однако, они решили нанести им еще более сильный удар. Всех, кто не желал отказаться от своей идеологии в пользу коммунизма, отправляли в ссылку. Среди изгнанных: Онни Хилтунен, Вяйне Таннер, Аарре Симонен, Вяйне Лескинен и К.-А. Фагерхольм. После того, как видные лидеры оказались в изгнании, партия превратилась не более чем в марионеточную партию СКП."
 fin.23.t: "Умер Президент Пеккала"
 fin.23.d: "Решив отдохнуть после работы, Пеккала пошел ужинать с несколькими высокопоставленными министрами. Однако во время десерта Пеккала начал жаловаться на сильную боль в верхней части груди, сопровождающуюся обильным потоотделением. Когда он встал, чтобы выйти в туалет, его вырвало, и он потерял сознание, ударившись при этом головой о край стола. Быстро была вызвана скорая помощь, которая прибыла через несколько минут. Люди в шоке наблюдали, как потерявшего сознание и истекающего кровью Пеккала транспортировали в больницу Финского Красного Креста в Тееле.\nК моменту прибытия в больницу Пеккала перестал дышать. В течение 78 минут врачи пытались воскресить его, но безрезультатно.\nПо данным коронарного исследования, причиной смерти стал \n "Инфаркт миокарда, вызванный несколькими годами злоупотребления алкоголем.\"\nВскоре после этого о его смерти было объявлено по радио жителям Финляндии. Его похороны должны состояться через неделю в кафедральном соборе Хельсинки, а его последнее пристанище - на кладбище Хиетаниеми.\n\nВ норме для выбора его преемника должны быть проведены новые выборы, однако парламент решил принять чрезвычайный закон и голосовать непосредственно за его преемника. После нескольких дней началось голосование за последних кандидатов. Борьба идет между двумя кандидатами: Эйно Кильпи, умеренным социалистом. И радикальным генеральным секретарем СКДЛ Херттой Куусинен. Хотя у нее нет шансов на честных выборах, при некотором советском вмешательстве у нее может появиться шанс на победу. Теперь, после подсчета голосов, победителем становится..."
 fin.24.t: "Подозреваемые Коммунисты Отстранены от Власти"
 fin.24.d: "Хотя Эйно Кильпи относит себя к социалистам, он не слишком любит радикальный коммунизм. Поэтому он планирует провести чистку правительства от радикальных коммунистов. С помощью Суоелуполийси, Кильпи удалось составить список "
 fin.25.t: "Советы Отказываются Уступить Карелию"
 fin.25.d: "Как и ожидалось, Советы отказались уступить нам потерянную Карелию. Они ответили коротким письмом, объясняя свою потребность в земле и тому подобное, но мы все знаем, что дело в геополитике."
 fin.26.t: "Всеобщая Забастовка"
 fin.26.d: "После окончания послевоенных мер контроля над ценами, принятых правительством в 1955 году, цены на многие товары и услуги стали расти. За два месяца стоимость жизни в Финляндии выросла на 7%. Центральная Организация Профсоюзов Финляндии (САК) попыталась повысить общий уровень заработной платы, чтобы учесть рост уровня цен. Несмотря на внутренние противоречия по поводу мелкого шрифта, САК требовала повышения зарплаты на 12 мк в час, что повысило бы зарплату финских рабочих на 6-10%.\nОднако [ДАННЫЕ УДАЛЕНЫ] руководство САК решило начать всеобщую забастовку. После провала экстренных переговоров между САК и тогдашним спикером парламента Карлом-Августом Фагерхольмом, забастовка началась в 06:00 [ДАННЫЕ УДАЛЕНЫ], в день вступления президента [FIN.GetLeader] в должность на первый срок."
 fin.27.t: "Окончание Всеобщей Забастовки"
 fin.27.d: "Всеобщая Забастовка завершилась, в результате чего зарплата по всей стране была повышена на 6-10 процентов. Во время забастовки информационная деятельность была парализована. САК не разрешили выпуск газет во время забастовки. На вещание радиопрограмм всеобщая забастовка не повлияла. В результате произошло небольшое отключение СМИ. Газеты распространяли информацию о забастовке, публикуя раздаточные материалы. Раздаточные материалы распространялись на улицах, вывешивались, например, на витринах агентств и универмагов. Во время забастовки произошло несколько жестоких беспорядков, в результате которых были раненые, но смертей удалось избежать. Попытки приостановить распределение бензина привели к самым ожесточенным столкновениям."
 fin.28.t: "[GetNewspaperHeader]Финляндия Бросает Вызов Советскому Союзу"
 fin.28.d: "Финляндия, маленькая страна в Северной Европе, заняла твердую позицию в отношении своего восточного соседа, Советского Союза, в беспрецедентном повороте событий."
 fin.29.t: "Разрешить Отто Вилле Куусинену визу?"
 fin.29.d: "Сегодня мы получили запрос на визу из Советского Союза. Точнее, от Отто Вилле Куусинена. Во время гражданской войны он был одним из ведущих деятелей Финской Социалистической Рабочей Республики. После гражданской войны он бежал в Советский Союз. По данным Службы разведки безопасности, до войны он работал шпионом в Скандинавии. Он был одним из немногих ведущих финских коммунистов, переживших сталинские чистки. В декабре 1939 года, во время Зимней войны, он был назначен руководителем поддерживаемой Советским Союзом Финской Демократической Республики, однако она была распущена всего через 3 месяца, в марте 1940 года. После этого он был назначен Председателем Президиума Верховного Совета Карело-Финской ССР до 1956 года.\n\nНыне Министерство иностранных дел должно решить, разрешить ли ему приезд или отказать во въезде. Виза запрашивается на 60 дней,\"для общего визита.\" По разведданным, он планирует принять участие в 40-летнем юбилее Коммунистической Партии и 100-летнем юбилее Ювяскюлян Лисео.\n\nДоступный выбор определяется вашим нынешним президентом."
 fin.30.t: "Экономический Бум из-за Корейской Войны"
 fin.30.d: "Начавшаяся Корейская Война вызвала внезапный и резкий экономический подъем в мировой экономике, который дошел даже до нашей маленькой финской экономики. По мнению профессоров экономики, причина этого - угроза более масштабной войны, даже Третьей мировой войны. Великие Державы быстро пытаются схватить с мирового рынка все необходимые товары военного времени. Спрос в Финляндии в основном затронул целлюлозу, а также все другие экспортные товары, связанные с древесиной. Мы надеемся, что этот хороший подъем продлится еще некоторое время."
 fin.31.t: "Экономические Потрясения"
 fin.31.d: "Похоже, что наш экономический подъем подходит к концу. Великая Война не началась, но запасы полны, а предложение растет, например, по целлюлозе. США уже начали регулировать импорт скандинавской целлюлозы, а многие европейские страны снижают цены на продукцию из древесины. В сочетании с неправильным управлением экономикой мы сейчас движемся к инфляции. Мы должны исправить это как можно скорее."
 fin.32.t: "Судьба Программы К"
 fin.32.d: "Во время работы кабинета Кекконена III, премьер-министр Урхо Кекконен представил программу экономической политики под названием Программа К, которая должна была решить проблемы конкурентоспособности, возникшие у промышленности после окончания подъема, вызванного Корейской Войной. Согласно программе, детские пособия должны были быть отменены, работодателям должны были быть предоставлены налоговые льготы, а общий доход от заработной платы должен был быть сокращен на 10%. Социал-Демократы, участвовавшие в правительстве, не одобрили программу, в результате чего кабинет Кекконена III распался и был заменен кабинетом Кекконена IV, который состоял из буржуазных партий и был правительством меньшинства.\n Осенью 1953 года кабинет Кекконена IV разработал предложение по государственному бюджету под названием \"Niukkis-budjetti\" (Скупой Бюджет), который должен был значительно сократить социальные расходы, включая расходы по закону, в соответствии с предложениями Программы К. Однако в октябре 1953 года совет директоров Кекконена объявил, что готов отказаться от Программы К.\n\nСейчас этот вопрос вновь поднимается. После недавних парламентских выборов было очень трудно сформировать правительство. Теперь САК и СДП объявили, что поддержат кабинет Кекконена V, если он согласится навсегда отменить Программу К и заменить ее новой Программой S. Она будет противоположна Программе К и вместо этого будет стимулировать государственные расходы. Однако, если мы действительно хотим, мы можем смазать некоторые колеса и заставить СДП согласиться с Программой К."
 fin.33.t: "Возрождение Красного Вальпо"
 fin.33.d: "Красное Вальпо относится к той фазе финской государственной полиции, когда организация ведомства в 1945-1948 годах была в основном в руках коммунистов. Хотя в 1949 году она была реформирована и очищена от коммунистов, мы решили вновь укомплектовать ее коммунистами и социалистами. Директор Армас Алхава был вынужден уйти в отставку, его заменил Ээро Хаутоярви. Вместе с этим восстановлены его прежние права, которые включают право на арест и допрос подозреваемых, право на прослушивание телефонов и более широкие права на работу под прикрытием."
 fin.34.t: "[GetNewspaperHeader]Смягчение Алкогольного Законодательства: Угроза или Возможность?"
 fin.34.d: "Сегодня правительство объявило о предложении по смягчению алкогольных законов в стране. В это предложение включены такие вещи, как:\n-Разрешение ресторанам и барам более свободно продавать больше видов алкоголя\n-Разрешение продавать слабое пиво до 3,5% в продуктовых магазинах\n-Постепенная ликвидация так называемой \"Карты Выпивки\" (Viinakortti)\n-Реформа магазинов Alko, чтобы они были более дружелюбными и простыми в использовании\n-Лучшее просвещение об опасностях алкоголя.\nВ то время как другие празднуют эти изменения, другие выступают против них. Самая яростная оппозиция исходит от движения за умеренность, которое заявляет\"Эти абсурдные изменения, несомненно, приведут нашу нацию на путь разрушительного алкоголизма\". Ожидается, что закон пройдет голосование в парламенте."
 fin.35.t: "Финляндия Предлагает Программу Обмена Студентами"
 fin.35.d: "Сегодня мы получили предложение от Финляндии. В нем изложены планы по 10-летней программе студенческого обмена от 18 лет и старше. Это может стать отличной возможностью для углубления наших отношений и "
 fin.36.t: "Государство [FROM.GetName] Принимает программу студенческого обмена"
 fin.36.d: "Государство  [FROM.GetName] решило присоединиться к программе студенческого обмена. Подготовка к ней уже идет, и скоро программа официально стартует."
 fin.37.t: "Государство  [FROM.GetName] отказывается от программы студенческого обмена"
 fin.37.d: "Государство [FROM.GetName] решило, что на данный момент оно не будет участвовать в программе студенческого обмена. Какие у них могут быть причины, мы не узнаем."
 fin.38.t: "Попытка Убийства Кекконена?"
 fin.38.d: "§RTOP SECRET: ПО ПРИКАЗУ ПРЕЗИДЕНТА, ЭТОТ ДОКУМЕНТ ДОЛЖЕН СОДЕРЖАТЬСЯ В ТАЙНЕ! §!\n\nПокушение на жизнь президента было совершено во время его летних каникул в Култаранте. Кекконен только что вошел в дверь главного здания Култаранты, Гранитного замка. Затем откуда-то раздался выстрел, который попал в каменную стену лестницы в главном здании. Полиция и охрана немедленно прочесали местность, но никого не смогли найти. Однако по месту попадания можно было сделать вывод, что стрелявший знал внутренние помещения здания.\nКекконен решил, что этот инцидент должен быть сохранен в тайне. Всем, кто присутствовал при этом, были даны строгие инструкции молчать об инциденте. В результате, единственным документом о происшествии стала записка, написанная для сотрудников Култаранты: \"Президент Республики извещает, что окно на 2-м этаже здания замка разбито. Свяжитесь с начальником полиции.\"\nВ отчете о расследовании делается вывод, что акт тщательно спланирован: в середине лета звук выстрелов должен был смешаться с фейерверком. Пуля была выпущена из высокоточного оружия с лодки или близлежащего островка. Личность стрелка не установлена. Мотив не установлен, однако, по оценке полиции, это было предупреждение: Вот что мы можем сделать, если ваша политика зайдет слишком далеко на Восток."
 fin.39.t: "Ребрендинг Маалаислиитто"
 fin.38.d: "§RTOP SECRET: ПО ПРИКАЗУ ПРЕЗИДЕНТА, ЭТОТ ДОКУМЕНТ ДОЛЖЕН СОДЕРЖАТЬСЯ В ТАЙНЕ! §!\n\nПокушение на жизнь президента было совершено во время его летних каникул в Култаранте. Кекконен только что вошел в дверь главного здания Култаранты, Гранитного замка. Затем откуда-то раздался выстрел, который попал в каменную стену лестницы в главном здании. Полиция и охрана немедленно прочесали местность, но никого не смогли найти. Однако по месту попадания можно было сделать вывод, что стрелявший знал внутренние помещения здания.\nКекконен решил, что этот инцидент должен быть сохранен в тайне. Всем, кто присутствовал при этом, были даны строгие инструкции молчать об инциденте. В результате, единственным документом о происшествии стала записка, написанная для сотрудников Култаранты: \"Президент Республики извещает, что окно на 2-м этаже здания замка разбито. Свяжитесь с начальником полиции.\"\nВ отчете о расследовании делается вывод, что акт тщательно спланирован: в середине лета звук выстрелов должен был смешаться с фейерверком. Пуля была выпущена из высокоточного оружия с лодки или близлежащего островка. Личность стрелка не установлена. Мотив не установлен, однако, по оценке полиции, это было предупреждение: Вот что мы можем сделать, если ваша политика зайдет слишком далеко на Восток."
 fin.40.t: "Авиакатастрофа в Койвулахти"
 fin.40.d: "3 января 1961 года пассажирский самолет DC-3 компании Aero Oy, направлявшийся из Кокколы в Ваасу, врезался в землю в районе Койвулахти в Мустасаари. В результате катастрофы погибли 22 пассажира и экипаж из трех человек.\n\nВылет самолета из аэропорта Кроноби был запланирован на 07:00, но подготовка к взлету опоздала, и самолет вылетел в 07:16. Пилоты не соблюдали минимальную высоту полета по маршруту Кроноби-Вааса, которая составляет 1 500 футов, вместо этого они летели на высоте ниже 330 футов. Вскоре после последнего радиоконтакта с управлением воздушным движением самолет резко повернул влево. Это замедлило самолет и значительно нарушило воздушный поток. Пилоты попытались исправить ситуацию, дав полный газ, но это не помогло, и самолет перешел в штопор. Последнее, что видели очевидцы на земле, это то, что пилоты включили посадочные фары, прежде чем самолет врезался в лес в 07:40:30 на крутом 70-градусном повороте.\nПервые спасатели, прибывшие на место крушения через десять минут после катастрофы, не смогли никого спасти из-за сильного пламени, которое достигало более 15 метров (49 футов) в высоту. Самолет был сильно разрушен в результате удара и пожара.\n\nОфицеры финской комиссии по расследованию несчастных случаев пришли к выводу, что OH-LCC был пригоден к полетам. Не было обнаружено никаких доказательств технической неисправности, столкновения самолета с деревьями или взрыва. Согласно отчету, ни пилот, капитан Ларс Хаттинен, ни второй пилот, первый офицер Вейкко Халме, не были в состоянии, пригодном для полета. Они плохо спали предыдущей ночью и были сильно пьяны. Вскрытие показало, что содержание алкоголя в крови Хаттинена составило 0,20 (2 ‰), а Хальме - 0,156 (1,56 ‰). В общей сложности Хаттинен, Хальме и возможный посетитель кабины пилотов выпили шестнадцать бутылок пива, семь джин-грогов и 900 граммов коньяка с 21:50 до 02:00. Таким образом, Хаттинен пренебрег своей ответственностью за безопасность самолета и пассажиров, и ни он, ни Хальме не были в состоянии управлять самолетом в день аварии.\n\nВероятной причиной аварии была признана ошибка пилота при выполнении левого поворота. Возможно, что один из пассажиров мог находиться в кабине, судя по расположению его тела."
 fin.41.t: "Начало FiR 1"
 fin.41.d: "Сегодня мы запустили наш первый ядерный реактор, Otaniemen tutkimusreaktori (Исследовательский Реактор Отаниеми). Это исследовательский реактор, расположенный в районе кампуса Отаниеми в городе Эспоо. Тепловая мощность реактора TRIGA Mark II составляет 250 киловатт. Помимо исследований, реактор используется для производства радиоактивных изотопов для промышленных измерений. Он также используется для нейтронно-активационного анализа геологических и биологических материалов.\n\nКонтракт на покупку исследовательского реактора был подписан в 1960 году. Наиболее активными людьми, стоявшими за приобретением, были Пекка Яухо, Эркки Лаурила и Хейкки Лехтонен. Проект исследовательского реактора - это подготовка к строительству атомной электростанции в Финляндии. Исследовательский реактор необходим для подготовки персонала для энергетических реакторов.\nFiR 1 начал работу в 1962 году в 13.44, когда президент [ROOT.GetLeader] запустил реактор."
 fin.42.t: "Коррупционные Скандалы"
 fin.42.d: "Возникли два крупных коррупционных скандала. Дело Учреждения социального страхования Финляндии и Дело акушерской школы.\nДело Учреждения социального страхования - это дело, которое всплыло в 1961 году в связи с законностью жилищных условий, построенных Учреждением социального страхования для своих сотрудников. Члены правления Института национального страхования были осуждены за должностные преступления. Обвинения были более серьезными, поскольку речь шла о нарушениях при занятии государственной должности. Обвинения и приговор касались финансирования жилья для сотрудников учреждения. Этот вопрос привлек внимание общественности, когда осенью 1957 года депутаты Вейкко Веннамо и Арне Охман обратились к канцлеру юстиции Олави Хонка с просьбой расследовать законность договоренностей о строительстве жилья для сотрудников Кассы социального страхования. Правление Kela содействовало этим проектам, предоставляя кредиты на льготных условиях, и все члены правления Kela были привлечены к ответственности за нарушение дисциплины и недобросовестное управление. 28 июня 1961 года Апелляционный суд Хельсинки приговорил всех членов правления Института социального страхования к освобождению от занимаемых должностей.\n\nДело акушерской школы стало политическим скандалом в Финляндии на рубеже 1950-х и 1960-х годов. Проблемы начались, когда строительный комитет колледжа, возглавляемый министром финансов Аарре Симоненом, в декабре 1956 года выбрал в качестве подрядчика уже обанкротившуюся компанию Rakennusliike Teora. Трудности строительной компании были скрыты за планом по выплате налоговых задолженностей, и ей было выплачено авансом 200 млн. маркка за еще не выполненные работы, чтобы избежать включения компании в список протеста. В то же время Teora строила квартиры в Мунккивуори по выгодной цене для членов комитета по строительству Акушерского колледжа, включая министра финансов Симонена. Строительная компания Teora также заложила сертификаты акций этих квартир в качестве обеспечения своих долгов и строительства Акушерского колледжа. Однако, когда Teora окончательно обанкротилась, министр Симонен сумел договориться о том, чтобы его собственная жилищная компания была освобождена от этих бумаг.\nБанкротство строительной компании Teora в конечном итоге обошлось налогоплательщикам примерно в 300 миллионов марок. После банкротства Teora, строительство нового здания Акушерского колледжа было завершено строительной компанией Puolimatka Oy, и здание было открыто 11 апреля 1960 года. 5 апреля 1961 года Апелляционный суд приступил к рассмотрению дела. Процесс получил дополнительный импульс, когда летом 1961 года Рейно Куускоски, член Апелляционного суда и председатель Верховного административного суда, был отстранен от должности в связи с так называемым делом о жилье Народного пенсионного фонда, в то время как дело об Акушерском колледже находилось на рассмотрении. 14 декабря 1961 года Апелляционный суд приговорил Аарре Симонена и Вильхо Вяюрюнена к штрафам в размере 375 000 и 80 000 марок в соответствии с Законом об ответственности министров."
 fin.43.t: "Парламент Отменяет Законы о Богохульстве"
 fin.43.d: "Сегодня парламент проголосовал за отмену главы 17, раздела 10 Уголовного Кодекса Финляндии, гласящего: \n\nКто \n1) публично хулит Бога или, с намерением оскорбить, публично клевещет или порочит то, что считается священным в церкви или религиозной общине по смыслу Закона о свободе вероисповедания (267/1922), или \n2) шумит, угрожает или иным образом нарушает религиозную службу, церковную службу, другие подобные религиозные мероприятия или похоронную службу,\nбудет приговорен к штрафу или тюремному заключению на срок не более четырех лет за нарушение спокойствия". \n\nВ то время как прогрессивисты празднуют этот важный шаг, консерваторы не в восторге от него."
 fin.44.t: "Парламент Проголосовал за Ограничение Смертной Казни"
 fin.44.d: "После принятия поправки 1949 года смертная казнь больше не могла применяться за преступления, совершенные в мирное время. В то же время в закон было добавлено положение, согласно которому смертный приговор, вынесенный в состоянии войны, автоматически заменялся пожизненным заключением, если он не был приведен в исполнение по окончании состояния войны. Когда эта поправка к закону обсуждалась в парламенте, никто не высказался за сохранение смертной казни в мирное время.\nСегодня смертная казнь отменена, за исключением государственной измены. Предложение правительства ссылалось на то, что общественное мнение изменилось, и что смертная казнь должна применяться только в случае государственной измены финскому государству. Однако, когда законопроект обсуждался в парламенте, некоторые члены СМП и Коалиционной Партии выступили против полной отмены смертной казни и добились ее сохранения за государственную измену."
 fin.45.t: "Парламент Проголосовал за Отмену Смертной Казни"
 fin.45.d: "После поправки 1949 года смертная казнь больше не могла применяться за преступления, совершенные в мирное время. В то же время в закон было добавлено положение, согласно которому смертный приговор, вынесенный в состоянии войны, автоматически заменялся пожизненным заключением, если он не был приведен в исполнение по окончании состояния войны. Когда эта поправка к закону обсуждалась в парламенте, никто не выступал за сохранение смертной казни в мирное время.\nСегодня смертная казнь полностью отменена в уголовной системе. В своем предложении правительство ссылалось на то, что за более чем 20 лет действия закона, запрещающего смертную казнь в мирное время, общественное мнение стало все больше выступать против применения смертной казни при любых обстоятельствах.  Однако, когда законопроект обсуждался в парламенте, некоторые члены СМП и Коалиционной партии выступили против полной отмены смертной казни в военное время, поскольку она все еще существовала в Швеции. Однако встречное предложение (автор Вейкко Веннамо) было отклонено 140 голосами против 29 при 27 воздержавшихся и трех голосах против. В ходе дебатов по этому вопросу депутат от Коалиционной Партии Ээро Латтула ссылался не только на пример соседних стран, но и на сдерживающий эффект смертной казни, которая, по его мнению, заставит тех, кто планирует совершить, например, акты трусости и дезертирства, серьезно задуматься о последствиях своих действий. С другой стороны, коллега Латтулы по партии Юха Викатмаа утверждал, что такие негативные меры, как смертная казнь, не смогут поддержать боеспособность сил обороны и желание граждан защищать свою страну. Депутат от СКДЛ Анна-Лииса Йокинен, напротив, считает, что Финляндия вполне может стать лидером в запрете смертной казни."
 fin.46.t: "Остроботнийская Речь"
 fin.46.d: "В своей речи на Празднике в Остроботнии, посвященном 50-летию независимости Финляндии, Кекконен сказал, что важной задачей 1960-х годов является интеграция коммунистов в функционирующую часть общества. Он объединил свою великую идею национального единства с международным мирным сосуществованием. Борьба идей, основанная на грубой силе и насилии, должна была быть преобразована в экономическое и интеллектуальное соревнование. \"Тот, кто уверен в своей жизнеспособности и своего дела, решится вступить в него.\"\n\nВ Остроботнии он сказал, что Финляндия так же дорога коммунистам, как и другим финнам. \"Финский народ был бы слаб, если бы каждый четвертый гражданин был врагом отечества.\"Открытие Кекконена для крайне левых было смелым шагом. Агонизирующие революционеры, прошедшие обучение в Москве, вышли из СКП только в начале 1966 года, а самый жесткий из старых, Вилле Песси, все еще оставался секретарем партии. Для внешнего мира все еще не было очевидно, что СКП начала развиваться в направлении еврокоммунизма."
 fin.47.t: "Бунт Молодежи Против Запрета на Отдых в Дни Молитвы"
 fin.47.d: "В молитвенную субботу в сельской общине Хельсинки вспыхнули беспорядки, когда популярная английская группа The Renegades должна была выступать в Танхуринне в Корсо. Полиция прервала танцы, на которые провинциальное правительство не давало разрешения. The Renegades также не дали выступить.\nВ результате начались беспорядки, в ходе которых были разбиты окна танцевального зала, разгромлены полицейские машины, а в полицейских бросали камни и бутылки. В конце концов, беспорядки перекинулись на центр Корсо. Была вызвана пожарная бригада, которая попыталась успокоить ситуацию с помощью водометов. Однако ярость молодых людей не утихала, и пожарные машины были перевернуты. В конце концов, бунтующую молодежь удалось усмирить с помощью слезоточивого газа. Двадцать молодых людей были арестованы, и в телевизионных новостях начальник полиции Эдвард Урджа пригрозил им тюремным заключением. В ряде других мест произошли более мелкие беспорядки.\nМинистр внутренних дел Ниило Рюхта призвал родителей тщательнее следить за передвижениями своих детей. Рабочая группа, созданная в кратчайшие сроки, предложила ограничить разрешение на работу иностранных оркестров, которые, похоже, "настраивают умы на край\". Мистер Рюхта также считает, что у молодежи слишком много свободного времени, и опасается предстоящего перехода на пятидневную рабочую неделю. После событий Министерство внутренних дел запретило пожарной бригаде участвовать в охране порядка."
 fin.48.t: "Президент Паасио Уходит в Отставку"
 fin.48.d: "Поскольку студенческие беспорядки продолжают нарастать, они начали требовать отставки президента Паасио. [GetDate] Рафаэль Паасио подал в отставку с поста президента Финляндии и объявил, что передает свои полномочия премьер-министру Мауно Койвисто. Протестующие пока довольны, но скоро мы должны провести новые выборы, согласно их требованиям."
 fin.49.t: "Массовые Студенческие Протесты"
 fin.49.d: "Начиная с момента избрания президента Паисио, по всей Финляндии разгорелся период гражданских беспорядков, сопровождавшийся демонстрациями, всеобщими забастовками, а также захватом университетов и заводов. Многие опасаются, что экономика Финляндии может остановиться. Опасаются, что протесты могут привести к гражданской войне или революции. Протесты связаны с аналогичными движениями, происходящими по всему миру, и уже вдохновляют поколение протестного искусства в виде песен, образных граффити, плакатов и лозунгов."
 fin.50.t: "Внеочередные Выборы [GetYear]"
 fin.50.d: "Внеочередные парламентские выборы проводятся после того, как премьер-министр Мауно Койвисто решил распустить правительство после того, как оно не смогло решить проблему студенческих беспорядков. После выборов возможны два правительства. Первое возглавит социалист Эле Алениус из СКДЛ. Он называет себя социалистом, для которого важно сотрудничество с левыми. Второе возможное правительство возглавит центрист Йоханнес Виролайнен из Кескустапуолуэ. Он поддержал реформу университетского управления, за которую выступало радикальное студенческое крыло."
 fin.51.t: "СКП Берет Власть в Финляндии"
 fin.51.d: "[GetMonth], [GetYear] Коммунистическая партия Финляндии при советской поддержке взяла под неоспоримый контроль правительство Финляндии. Не имея возможности контролировать протест, правительство впало во внутренние распри, и большинство некоммунистических министров ушли в отставку. Возникло сильное движение сторонников коммунизма, например, организация рабочих советов на заводах, чтобы взять контроль над предприятиями. Премьер-Министр [FIN.GetLeader], опасаясь гражданской войны, решил подать в отставку и распустить правительство. Вскоре после этого СКП объявили о захвате власти в стране и пригласили советских солдат для закрепления своих позиций. В тот же день была принята новая Народно-Демократическая Конституция, а все отрасли промышленности были национализированы.\n\nКак бы то ни было, остается только один вопрос: кто станет нашим первым Генеральным Секретарем? На это место есть два варианта: еврокоммунист Аарне Сааринен или лидер традиционной оппозиции Тайсто Синисало.\n\n\nАарне Сааринен вел споры между большинством и меньшинством СКП. Сааринен пытается отделить свою партию от Советской НКП и продвигать независимый, национальный и мирный коммунизм. Он и большинство партии осудили вторжение Варшавского Договора в Чехословакию.\n\n\nТайсто Синисало - лидер жесткой просоветской фракции партии (также известной как боец по Фамилии Синисало) и заместитель председателя партии. Его идеологию иногда называют Сталинистской."
 fin.52.t: "Кескиолутлаки"
 fin.52.d: "Закон о среднем пиве (462/1968) вступил в силу [GetDate]. Закон был принят парламентом 137-33 голосами. В этот закон включены такие вещи, как:\n-разрешение ресторанам и барам более свободно продавать больше видов алкоголя\n-Право продавать пиво III класса (4,7%) в продуктовых магазинах\n-Отмена так называемой \"Карты Выпивки\" (Viinakortti) через два года\n-Переименование Oy Alkoholiliike Ab в Oy Alko Ab\n-Лучшее просвещение о вреде алкоголя.\nВ то время как другие празднуют эти изменения, другие выступают против них. Самая яростная оппозиция исходит от движения за умеренность, которое заявляет\"Эти абсурдные изменения, несомненно, приведут нашу нацию на путь разрушительного алкоголизма\"."
 fin.53.t: "Панъевропейская Конференция по Безопасности"
 fin.53.d: "WIP"
 fin.54.t: "Финляндия Покидает План Нордек"
 fin.54.d: "План Нордек был попыткой создать общую экономическую зону Северных Стран. Письмо президента Финляндии Урхо Кекконена Найти Финляндию - Löydä Suomi, опубликованное в 1966 году, предвосхищало будущее развитие Северных Стран, утверждая, что Швеция, Финляндия и, возможно, весь Северный регион со временем могут превратиться в единую экономическую и культурную зону. \nИнициатива создания общего экономического пространства Северных стран была выдвинута премьер-министром Дании Хильмаром Баунсгаардом на заседании Северного совета в Копенгагене весной 1968 года.\n\n\n К июлю 1969 года переговоры достигли соглашения по большинству аспектов проекта соглашения, включая движение капитала, торговую и морскую политику, трудовую и социальную политику, образование, исследования и помощь в развитии. Однако вопросы, касающиеся промышленной продукции, сельского хозяйства и рыболовства, а также финансирования сотрудничества, оставались нерешенными.\nВизит президента Финляндии Урхо Кекконена в Завидово в качестве гостя советского руководства имел большое значение для судьбы Нордека. В ходе дискуссий в Завидово стало ясно, что Советский Союз выступает против присоединения Финляндии к Нордеку. [SOV.GetLeader], Генеральный секретарь КПСС, прямо назвал Нордек \"антисоветской группировкой\", деятельность которой повредит отношениям между Финляндией и Советским Союзом.\n\nОкончательный гвоздь в крышку гроба был забит на заседании Совета Северных стран в Рейкьявике весной 1970 года, когда Финляндия объявила, что не будет подписывать соглашение Нордек. Премьер-Министр Мауно Койвисто, который был горячим сторонником Нордека, почувствовал неудачу проекта как личное разочарование. Аналогичным образом, премьер-министр Швеции [SWE.GetLeader] впоследствии неоднократно сожалел о крахе Нордека. С другой стороны, вступление Дании в ЕЭС, которое произошло в начале 1973 года, означало бы, что Нордек мог быть распущен сразу же после своего рождения."
 fin.55.t: "[GetNewspaperHeader]Протесты Перерастают в Насилие"
 fin.55.d: "В последнее время в Финляндии произошла трагедия, когда мирные студенческие протесты были жестоко подавлены полицией, что привело к ответным действиям протестующих. Все началось с того, что большая группа студентов университета Хельсинки заняла Старый студенческий дом. Этот дом был назначен местом проведения торжеств по случаю столетнего юбилея Студенческого союза, запланированного на следующий день. Акция была проведена в знак протеста против того, что они расценили как "вечеринку в белых галстуках" в стиле 1950-х годов и восстание против ценностей, которые они отстаивали. Считается, что акция была вдохновлена различными политическими движениями в Европе в том же году или ранее.\nОсновные требования диссидентов касались демократических реформ в администрации университета. Однако некоторые участники также требовали создания марксистско-ленинских кружков на кафедрах и факультетах, отмены обязательного членства в Студенческом Союзе и изменения политической направленности ежемесячного студенческого журнала Ylioppilaslehti. На балконе Дома студентов были вывешены транспаранты с этими прокламациями и произнесены речи. Однако не все молодые люди были коммунистами; участвовали также представители Центристско-Аграрной Партии.\n\nПравительство опасалось, что если оно уступит их требованиям, то позволит СССР влиять на студентов и будущие поколения, а через них и на всю страну. Хотя среди членов правительства и парламента были разногласия, приказ подавить протесты любыми средствами уже был отдан. Полицейские массовым маршем направились к Дому студентов и университету, и хотя вначале они встретили некоторое сопротивление, это застало студентов врасплох. Увидев такую реакцию, многие студенты решили выступить против и начали драться с полицией, используя в качестве оружия все, что могли найти. Пока неизвестно, есть ли погибшие, но несколько человек и полицейских получили ранения различной степени тяжести. Популярность правительства резко упала, а протесты переросли в массовые беспорядки.\nК чему это приведет, пока неизвестно, но слухи и неофициальные комментарии, исходящие от анонимных правительственных источников, говорят, что если решение не будет найдено в ближайшее время, нынешний президент Рафаэль Паасио может быть вынужден уйти в отставку."
 fin.56.t: "Парламент Принял Законопроект о Борделях"
 fin.56.d:0 "Появились новости по необычному вопросу, по которому финскому правительству и парламенту пришлось занять определенную позицию: открывать или нет государственную систему публичных домов. В своем письменном вопросе правительству Айли Лайтинен, врач и член парламента, поинтересовалась: "Появились новости по необычному вопросу, по которому правительству и парламенту Финляндии пришлось занять определенную позицию: открывать или нет государственную систему публичных домов. В своем письменном вопросе правительству Айли Лайтинен, врач и член парламента, поинтересовалась: "Какие меры намерено принять правительство для предотвращения распространения заболеваний, передающихся половым путем, и профессиональной проституции, и намерено ли правительство предпринять шаги по созданию государственной системы публичных домов, которая обслуживала бы клиентов как мужского, так и женского пола в безопасных условиях, или правительство намерено принять срочные меры для обеспечения реального и эффективного секса образования и за привитие здорового образа жизни во всех учебных заведениях и государственных средствах массовой информации, чтобы предотвратить вред, причиняемый распространенными венерическими заболеваниями?"\нОсмо Кайпайнен, министр социальных дел и здравоохранения, попытался ответить на вопрос Лайтинена, и, по его мнению, государственная система публичных домов была бы плохим решением, которое скорее создало бы новые проблемы, чем решило старые. Поскольку публичные дома в Финляндии были упразднены с 19 века, цитировались его слова о том, что "не было причин возвращаться в прошлый век для решения сегодняшних проблем". Лично Кайпайнен сказал, что он верит в государственное предпринимательство, но не верит, что такой бизнес был бы очень близок сердцу правительства. Вместо этого Кайпайнен сказал, что правительство предпочитает эффективное гендерное просвещение.\После долгих жарких дебатов правительство и парламент решили выдвинуть предложение о создании государственных борделей, которые будут тщательно контролироваться, чтобы не происходило нарушений здоровья или чего-либо еще незаконного. Сторона, поддерживающая это ходатайство, утверждала, что публичные дома обеспечат безопасное место для клиентов и сотрудников, а также предоставят государству средства, которые ему понадобятся."
 fin.57.t: "Formation of Sorsa I Cabinet" #NT!
 fin.57.d: "On a sunny day in Helsinki, President Rafael Paasio appointed the new government, led by Kalevi Sorsa. The Sorsa I Cabinet is a coalition of four parties: the Social Democrats, the Centre Party, the Swedish People's Party, and the Liberals. It has a parliamentary majority of 125 seats.\nThe cabinet ministers arrived at the palace in their official attire. They greeted each other and the President cordially. They were ready to implement their agenda, which focused on social reforms, industrial investments, and improving relations with \"Strategic allies\".\n\nThe ceremony started at noon, with President Paasio giving a speech. He commended the new government for its broad representation and its commitment to democracy and social justice. He also thanked the outgoing government of Teuvo Aura for its service and cooperation.\nHe then swore in the cabinet ministers, beginning with Prime Minister Sorsa. He shook hands with each minister and handed them a portfolio with their official documents.\nThe ceremony concluded with a group photo of the President and the cabinet. They smiled and waved to the crowd below, who applauded their new leaders.\nThe Sorsa I Cabinet was officially in office. It would face many challenges and opportunities in its term, but it was confident and optimistic." #NT!
  
 nfc.1.t: "К Власти Приходит Кабинет Фагерхольма III"
 nfc.1.d: "В Финляндии Кабинет Фагерхольма III был сформирован после парламентских выборов 1958 года. Победителем выборов стала Финская Народно-Демократическая Лига, но ее не взяли в правительство, поэтому крупнейшей партией кабинета стала Социал-Демократическая Партия во главе с Карлом-Августом Фагерхольмом. Особое беспокойство у нас вызывает тот факт, что правое крыло Социал-Демократов, Вяйне Лескинен и Олави Линдблом, находятся в правительстве благодаря поддержке военного преступника Вяйне Таннера. Кроме того, имя министра сельского хозяйства Нийло Косола прочно ассоциируется с именем его отца, Вихтори Косола, лидера движения лапуа в 1930-х годах. Должны ли мы высказывать свои опасения или держать их при себе?"
 nfc.2.t: "Советский Протест по Поводу Кабинета Фагерхольма III"
 nfc.2.d: "Советы выразили свою озабоченность по поводу нашего нового правительства. Особенно их беспокоят Вяйне Лескинен и Олави Линдблом, которые представляют правую часть СДП. Еще во время формирования правительства Йоханнес Виролайнен из Аграрного Союза, который был ключевым участником правительственных переговоров и стал министром иностранных дел нового правительства, в последний момент попытался обратиться к Вяйне Таннеру, чтобы Лескинен не был включен в правительство, на что Таннер пробормотал: \"О чем вы говорите, молодой человек, сейчас формируется правительство Финляндии, а не правительство Советского Союза.\" Президент Урхо Кекконен уже заранее предупредил Виролайнена, чтобы он не входил в одно правительство с Лескиненом. После назначения правительства 29 августа Кекконен произнес свои знаменитые слова: \"Это была худшая речь, которую я когда-либо читал, но она была написана не мной.\""
 nfc.3.t: "Усилить Финское Давление?"
 nfc.3.d: "Несмотря на наши опасения, Кабинет Фагерхольма III все еще у власти. Должны ли мы оказать на них большее давление, чтобы добиться отставки правительства и прихода к власти более благоприятного правительства?"
 nfc.4.t: "Советское Давление Усиливается"
 nfc.4.d: "Советское давление на наш нынешний кабинет министров только усиливается. В экономическом плане были приостановлены переговоры об использовании Сайменского канала, отложен договор о правах на рыбную ловлю в Финском заливе, затянулись торговые переговоры. В [ДАННЫЕ УДАЛЕНЫ] советский посол в Финляндии Виктор Лебедев ушел в \"отпуск\", не посетив министра иностранных дел Йоханнеса Виролайнена, как того требовал протокол, и впоследствии было объявлено, что он переведен на другие должности, а преемника назначать не планируется."
 nfc.5.t: "Финляндия Сдается!"
 nfc.5.d: "После давления на финское правительство в течение нескольких месяцев, похоже, что оно, наконец, уступило. По сообщениям, они уже предприняли шаги по увольнению кабинета Фагерхольма и замене его на гораздо более приятный."
 nfc.7.t: "Конец Кабинета Фагерхольма III"
 nfc.7.d: "Несколько месяцев назад Аграрная Лига заставила своих министров уйти из правительства, и президент Урхо Кекконен начал маневрировать, чтобы сместить правительство. Наконец, на §R(ДАННЫЕ УДАЛЕНЫ)§! Виролайнен объявил о своей отставке, после чего Фагерхольм объявил об отставке всего правительства. Вскоре после этого Кекконен выступил по государственному радио и телевидению и объявил о формировании правительства аграрного меньшинства во главе с В. Я. Сукселайненом."
 nfc.8.t: "Конец Кризиса Ночных Заморозков"
 nfc.8.d: "Кризис Ночных Заморозков был разрешен во время частной поездки Урхо и Сильви Кекконена в Ленинград, где он \"случайно\" встретился с [SOV.GetLeader] и министром иностранных дел Андреем Громыко. Во время обеда, который последовал за переговорами, [SOV.GetLeader] заявил, что в то время как Финляндия имеет право решать, какие правительства ей выбирать, Советский Союз также имеет право решать, что он думает о них. Президент Кекконен считал, что Кризис Ночных Заморозков был вызван внутренними разногласиями в Социал-демократической партии. Вскоре после этого дипломатические отношения между странами были восстановлены, когда Советский Союз назначил Алексея Захарова новым послом в Финляндии."
