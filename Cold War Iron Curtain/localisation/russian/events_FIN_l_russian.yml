 fin.200.d: "Настало время для вторых президентских выборов после окончания войны. После того, как были отобраны президентские выборщики, есть два кандидата с шансами на победу. Ведущим кандидатом является действующий президент >.К. Паасикиви, которого поддерживают правые и социал-демократы. Второй кандидат - Мауно Пеккала, социалист из партии СКДЛ.\nПаасикиви сначала не хотел добиваться переизбрания, по крайней мере, на обычных президентских выборах. Он рассматривал возможность обратиться к парламенту Финляндии с просьбой переизбрать его через другой закон о чрезвычайном положении. Бывший президент Стольберг, который выступал в качестве его неофициального советника, убедил его добиваться переизбрания обычным путем, когда он прямо сказал Паасикиви: \"Если финский народ не потрудится избирать президента каждые шесть лет, то он действительно не заслуживает независимой и демократической республики.\" Наряду с этим, из-за слабой экономики в стране возросла поддержка левых сил. Хотя шансы на избрание президента-социалиста невелики, возможно, эти события в совокупности могут привести к проигрышу Паасикиви?"
