 FDJ.0.d: "Социалистическая единая партия Германии объявила об инициативах по продвижению социалистической немецкой идентичности для своего народа. Германия — это место, где впервые развился социализм, родина Карла Маркса, и где в политическом отношении социализм долгое время был важной силой в развитии страны. Слишком долго внешние силы и капиталистические интересы стремились ограничить или стереть эту идентичность. Это также позволит Германии иметь свою собственную концепцию и видение в социалистическом мире и положит конец любой критике и заявлениям о том, что мы являемся советской марионеткой."
 Beat_Music.1.d: "В рамках новой инициативы по обеспечению большей либерализации в государстве правительство объявило о планах разрешить и спонсировать популярное направление бит-музыки. Правительственным радиостанциям будет разрешено исполнять определенные песни, утвержденные соответствующим министерством. Правительство позаботится о том, чтобы любая западная музыка в этом жанре была тщательно проверена. Государство также объявило о планах поддержать некоторые музыкальные группы, чтобы подать социалистическую версию этой музыки. Правительство уверено, что его усилия уменьшат тревожную тенденцию молодых людей, ищущих западную музыку через опасные капиталистические радиостанции."
 Beat_Music.2.d: "Недавние усилия правительства по управлению и контролю популярной бит-музыки не увенчались успехом, поэтому мы запретили её, однако наша молодежь продолжает искать западные песни через враждебные радиостанции. Что еще более тревожно, участники наших спонсируемых групп занимаются спорной и опасной лирикой, без сомнения, вдохновленной капиталистами. Чтобы предотвратить волнения или гнев молодежи, мы поручили правительственным учреждениям подготовить для молодежи новые музыкальные и танцевальные стили и жанры, дающие ей творческий выход при сохранении целостности социалистического государства."
 Beat_Music.3.d: "Социалистическая единая партия Германии недавно запустила конкурс музыкальных талантов для молодёжи. К сожалению, шоу закончилось довольно неудачно: группы решили играть музыку, которая была явно запрещена государством и не имела социалистической тематики. Многие чиновники и пожилые люди в зале были сильно оскорблены конкурсом и требовали предпринять что-либо. Мы поручили соответствующим ведомствам расследовать, как произошло это неудачное событие, и разобраться с музыкальными группами."
 Beat_Music.4.d: "Высокопоставленные члены Социалистической единой партии Германии осудили недавние меры по либерализации. Они отмечают, что эти решения, особенно в отношении музыки, порой радикализировали молодежь, поощряя капиталистические идеи и культуру. Вопиющее неповиновение молодежи как родителям, так и государству находится на беспрецедентном уровне. Кроме того, разрешение на показ фильмов с критикой в адрес правительства только способствовало более широкому инакомыслию и предвзятому отношению к партии. СЕПГ было настоятельно рекомендовано, чтобы разочарования, высказанные ее отдельными членами, отразили взгляды более широкого общества, и эксперимент по либерализации должен быть завершен."
 FDJ.3.d: "Союз свободной немецкой молодёжи (ССНМ) был основан как антифашистская организация после Второй мировой войны. Сегодня эта организация - крупный государственный орган. Молодые люди в возрасте от 14 до 25 лет вступают в Союз, где их учат существовать в социалистическом обществе, быть гордым членом партии. Организация также выступает в средствах массовой информации, продвигая и поощряя ее убеждения и социализм. Однако Союз все чаще игнорируется молодыми людьми и изо всех сил пытается привлечь преданных членов. Недавно в организации был объявлен ряд реформ, призванных помочь возобновить работу партии с молодежью. Эти реформы призваны дать больше полномочий молодежным лидерам и ослабить строгое соблюдение партийных директив. ССНМ будет организовывать больше концертов, танцев, а также праздников и спортивных соревнований, чтобы обеспечить более непринужденные и веселые мероприятия. Это побудит больше молодых людей вступить в него."
 FDJ.10.d: "Социалистическая единая партия Германии объявила, что обратит вспять новую политику и инициативы, связанные с Союзом свободной немецкой молодёжи. Попытки обеспечить смягчение партийных директив и проводить более непринуждённые мероприятия привели к вопиющему неповиновению молодежи и проблемам в работе Союза. Недавние мероприятия, связанные с музыкой и поэзией, шли вразрез с социалистической доктриной или полностью игнорировали её. Это только поощряет большее инакомыслие и отчуждает молодежь, преданную партии. Восстановление социалистической приверженности и уменьшение свободы действий, предоставленной молодежным лидерам, положат конец любой путанице среди молодежи в стране. Несмотря на восстановление строгого государственного контроля, все еще существуют планы организации молодежных праздников и других досуговых мероприятий, но в строгой социалистической атмосфере. Также будут приняты меры по обеспечению более широкого участия молодежи в партийной работе."
 FDJ.11.d: "Социалистическая единая партия Германии утвердила предложения о постоянном расширении полномочий молодежной комиссии Политбюро и наделении ее председателей должностями в ключевых руководящих органах. Партия считает, что это является подтверждением единства всех поколений в Германии в стремлении к достижению справедливого социалистического общества. Это новое решение продолжает недавние инициативы по реформированию, которые начались с либерализации Союза свободной немецкой молодёжи. Помимо предоставления большего пространства для публичного самовыражения, правительство также уполномочило молодежных лидеров помогать государству в разработке молодежной политики. Эта новость указывает и на то, что реформы, скорее всего, продолжаться и пока удовлетворительны для государства."
 GDR_Econ_Failure.1.d: "Семилетний план закончился неудачей, так как нам не удалось превзойти Западную Германию по ВВП на душу населения. Аналитики предполагают, что дополнительные требования к производительности, необходимые для достижения этой цели, не были реалистичными и не учитывали текущие экономические условия. Что еще более важно, продолжающаяся эмиграция, особенно профессионалов, значительно ограничила промышленный потенциал государства. Правительство пересмотрит свою политику и планы развития, чтобы обеспечить достижение государством более реалистичных экономических целей."
 Storfreimachung.5.d: "Запад продолжает угрожать нам угрозами перекрыть торговлю и доступ к основным товарам. Что еще более важно, они делают это в сочетании со своей пропагандой и разведывательными операциями, призванными убедить наш народ предать правительство и покинуть страну. Чтобы справиться с этой угрозой, ГДР объявила о новых ограничениях на западную торговлю, вместо этого призвав увеличить внутреннее производство и усилия по поиску источников импорта из дружественных социалистических государств. Мы также продолжим развивать порт в Ростоке для дальнейшего сокращения западной торговли и облегчения ввоза социалистических товаров. Также мы должны рассмотреть способы борьбы с постоянной эмиграцией, которая истощает экономику."
 ddr.22.d: "Чтобы помешать западным шпионам и пропаганде разрушить социалистическую систему в Германии, создается антифашистская оборонительная стена, отделяющая капиталистический Западный Берлин от нашего народа. По мере возведения стены возводятся сторожевые башни, чтобы следить за попытками перейти границу, и за теми глупцами, что ищут капиталистическое рабство Запада. Правительство считает, что эта новая структура необходима для сохранения германского социализма, и с уменьшением зависимости от западной торговли строительство закрытой границы гораздо более осуществимо. Запад предсказуемо резко отреагировал на наши действия, но в конечном счете это означает не закрытие Германии, как они утверждают, а освобождение социализма внутри Германии."
 Liberman_Econ.1.d: "Советский Союз призвал правительство адаптировать рекомендации своего выдающегося экономиста Евсея Либермана. Ключевые чиновники рассматривают его предложения, предлагающие более резкий сдвиг от уже традиционного государственного планирования. Либерман предлагает более децентрализованную экономическую модель без давления ежегодных экономических ориентиров и целей. Он считает, что предоставление большей свободы и уменьшение необходимости достижения краткосрочных результатов обеспечит гибкость и побудит экономику искать более творческие пути достижения долгосрочного роста. Эти предложения приведут к сокращению потерь сырья и расширению механизации, что будет способствовать не только более высокому экономическому росту, но и повышению эффективности. Оппоненты внутри партии отмечают, что эти предложения бездоказательны, предвзяты по отношению к сельскому хозяйству и рискованны. Отсутствие централизованного контроля может привести к полной экономической стагнации, если не произойдет ожидаемого творчества или инноваций."
 Storfreimachung.1.d: "Инициатива импортозамещения стремилась уменьшить нашу зависимость от западных товаров и заменить их нашим собственным производством или импортом из социалистических государств. Кампания имела определённый успех и достигла своей цели –продемонстрировать наше экономическое сопротивление Западу. Однако центральные экономические органы отмечают, что затраты, связанные с инициативой и планированием, необходимыми для начала производства многих товаров, растут слишком быстро. Долгосрочное здоровье экономики находится под угрозой, а замена импорта определенных товаров, особенно химикатов, невозможна – их не хватает и у наших социалистических союзников. Таким образом, правительство спокойно завершит программу после того, как подчеркнет её достижения."
 Storfreimachung.2.d: "Инициатива импортозамещения стремилась уменьшить нашу зависимость от западных товаров и заменить их нашим собственным производством или импортом из социалистических государств. Кампания имела успех и достигла своей цели –продемонстрировать наше экономическое сопротивление Западу. Однако центральные экономические органы отмечают, что затраты на импортозамещение только растут. Это приводит к замедлению экономического роста, но, несмотря на это, правительство признает, что достижение самообеспеченности с помощью производства собственных товаров обеспечивает долгосрочную защиту от Запада и закладывает основу для экономического бума. Таким образом, программа не будет замедляться, а будет лишь расширяться. Сегодня Германия стремится достичь полной экономической самодостаточности, и внутри страны будет производиться еще больше товаров."
 SOVGDR_ECON.1.d: "Германская Демократическая Республика (ГДР) недавно направила делегацию с просьбой о дополнительном финансировании для поддержки своей экономики. У ГДР есть амбициозные планы по созданию экономики, превосходящей экономики капиталистических соседей, для того чтобы продемонстрировать превосходство социализма и подорвать западную пропаганду. Немецкие чиновники признают, что они недооценили затраты, необходимые для их экономических прогнозов, но настаивают на том, что с советскими средствами они могут достичь своих целей и обеспечить победу всего социалистического мира. Мы должны тщательно рассмотреть эту просьбу и решить, можем ли мы доверять немцам эффективно использовать наши средства, и если нет, мы должны призвать их ставить реалистичные цели, а не пытаться просто тратить их."
 SOVGDR_ECON.2.d: "Советский Союз согласился оказать финансовую поддержку ГДР, так как мы продолжаем процесс преобразования нашей экономики. Советы согласились с нашей оценкой, того, что сильная социалистическая Германия является наилучшей защитой от западной пропаганды. Долгосрочные выгоды также очевидны – с ростом экономики влияние вражеской пропаганды значительно уменьшится. Основные экономические органы соберутся в ближайшие недели, чтобы решить, как наилучшим образом использовать дополнительное финансирование и контролировать текущий экономический план."
 SOVGDR_ECON.3.d: "Советский Союз отклонил нашу просьбу о финансовой поддержке нашего государства, хотя мы и продолжаем процесс преобразования нашей экономики и достижения роста. Советы сочувствовали нашей оценке сильной социалистической Германии как ключа к прекращению западной пропаганды, однако они считают, что наши экономические проблемы были вызваны не недостатком финансирования, а плохим централизованным планированием. Они призвали наше правительство более эффективно и реалистично использовать средства для достижения экономического роста. Это серьезный удар для правительства, поскольку там ожидали советской финансовой поддержки."
 SOV_GDR.1.d: "Когда известие о замене Никиты Хрущева дошло до Германской Демократической Республики, реакция руководства правящей Социалистической единой партии Германии была неоднозначной. Реформаторы были обеспокоены, так как они всем сердцем поддерживали поощрение большей либерализации как общества, так и экономики. Однако сторонники жесткой линии в партии будут рады видеть нового советского лидера. Они полагали, что либерализация привела лишь к социальной напряженности, особенно между взрослыми и национальной молодежью. С экономической точки зрения советское поощрение более децентрализованного государственного планирования было слишком похоже на капитализм. Многие сторонники жесткой линии в партии считают, что Хрущев потерпел неудачу, не практикуя коллективного руководства, краеугольного камня социалистического правительства."
 SOV_GDR.2.d: "Советский Союз считает, что в Социалистической единой партии Германии должна произойти смена руководства. Давний лидер ГДР Вальтер Ульбрихт поощряет экономическую модель, несовместимую с социализмом. Он настаивает на большей независимости и отвергает советские призывы к нему начать переговоры с Западом, что сильно вредит международному социализму. Есть две возможные замены Ульбрихту. Эрих Хонеккер, протеже Ульбрихта, имеет большой опыт руководства, особенно в военных делах. Недавно он отвернулся от своего наставника, выступив против его экономической политики и встав на сторону традиционных сторонников жесткой линии в партии. Другой вариант - Хорст Зиндерман, еще один опытный лидер. Он не такой жесткий, как Хонеккер, но и не такой либерал, как Ульбрихт. Он предлагает нечто среднее между ними, что делает его интересным вариантом для руководства ГДР."
 GDR_COMECON.1.d: "Совет экономической взаимопомощи (СЭВ) создан в начале 1950-х годов как способ развития международной торговли и стимулирования экономики социалистических европейских государств и Советского Союза. Он должен был создать систему экономического сотрудничества, но с момента своего основания большинство его членов стремились обеспечить собственную экономическую самодостаточность. Однако Германская Демократическая Республика желает, чтобы СЭВ более тесно интегрировала экономики своих членов, особенно в том, что касается торгово-экономической координации между госуда. Мы можем принять это предложение, однако другие государства-члены могут критиковать нас за то, что мы не работаем в соответствии с общем мнением и менее согласованы с социалистической идеологией."
 GDR_COMECON.2.d: "Советский Союз согласился поддержать усилия по усилению СЭВ для лучшей координации экономики и торговли между его государствами-членами. При нашей поддержке мы надеемся убедить другие социалистические государства отказаться от акцента на автаркии и работать над созданием мощной экономической зоны, способной лучше противостоять капиталистической угрозе. По крайней мере, мы можем лучше координировать свои действия с Советами для укрепления торговых связей и экономического роста наших государств."
 GDR_COMECON.3.d: "Советский Союз отклонил наш призыв к углублению интеграции в СЭВ и лучшей координации наших экономик. Они ссылаются на сопротивление среди других государств-членов и переизбыток требований к Советскому Союзу для достижения этой цели. Гораздо лучше и идеологически обоснованно проводить консультации на индивидуальном уровне и при единодушном согласии всех членов СЭВ. Это горькая неудача и будет препятствовать нашим усилиям по обеспечению большей экономической власти в несоветских социалистических европейских государствах."
 Constitution_Reform.1.d: "Народ Германской Демократической Республики (ГДР) недавно проголосовал за принятие новой конституции государства. Предыдущая конституция была недавно признана поверхностной и несовместимой с социалистической идентичностью и желаниями народа. Новая конституция является насквозь коммунистическим документом и гораздо более четко определяет ГДР как истинное социалистическое государство. Это крупная победа правительства, которое теперь заявляет, что у врагов государства или иностранных заговорщиков нет законного способа изменить социалистическую идентичность ГДР и ее народа. Результаты голосования были в подавляющем большинстве в пользу новой конституции."
 SOV_GDR_NEG.1.d: "Демократическая Германская Республика и Советский Союз начинают переговоры о Германо-советском экономическом соглашении. Нынешняя структура предлагает очень выгодные условия для Советов и накладывает ограничения. Это будет препятствовать способности немецкой экономики оживить и открыть свои рынки. Реформаторы, такие как Эрих Апель, настаивают на том, чтобы мы отвергли это предложение и попросили Советы пересмотреть соглашение. Однако сторонники жесткой линии в партии считают эти опасения необоснованными, и соглашение стабилизирует отношения с Москвой и обеспечит дальнейшее социалистическое развитие экономики. Они обвиняют реформаторов в отвлечении государства от правильной, социалистической экономической модели."
 SOV_GDR_NEG.2.d: "Германская Демократическая Республика приняла советские условия для последнего экономического соглашения между двумя государствами. Условия, казалось, весьма благоприятствовали Советам за счет немецкой экономики, однако они были отклонены, и высокопоставленные чиновники настаивали на том, что условия обеспечивают продолжение надлежащего социалистического развития. Реформаторы, скорее всего, будут недовольны соглашением, но, похоже, опасения по поводу его условий были недостаточно убедительными, чтобы убедить государство рискнуть своими отношениями с Москвой."
 SOV_GDR_NEG.3.d: "Германская Демократическая Республика сделала необычный запрос относительно предлагаемого договора об экономическом соглашении. Они хотят изменить некоторые элементы, особенно те, которые связаны с торговлей и планированием. Немцы считают, что эти условия вредны для их развития и экономических целей. Наши собственные экономические чиновники отмечают, что это может быть правдой, но условия обеспечивают благоприятные возможности для советской экономики. Ради большего сотрудничества и доверия мы можем принять эти изменения, хотя и теряем те преимущества, которые исходили бы от первоначального предложения. Мы могли бы также отклонить это предложение, это показало бы наше неудовольствие и заставило бы их не отходить от нашего руководства, так как в конечном счете они не могут выжить без нашей помощи."
 SOV_GDR_NEG.4.d: "Советский Союз принял наши условия о пересмотре предложенного договора об экономическом соглашении. Мы просили об отмене некоторых условий, выгодных Советам в ущерб нашему собственному торгово-экономическому развитию. Советское соглашение означает их приверженность сохранению связей и признание нас партнером, а не клиентом. Новое соглашение широко приветствуется реформаторами в партии, которые будут чувствовать себя все более смелыми, чтобы подтолкнуть государство к политике, которая может вызвать рост, а не стагнацию."
 SOV_GDR_NEG.5.d: "Советский Союз отклонил наши условия о пересмотре предложенного договора об экономическом соглашении. Мы просили об отмене некоторых условий, выгодных Советам в ущерб нашему собственному торгово-экономическому развитию. Советское неприятие указывает на их недовольство. Советы утверждали, что первоначальное соглашение обеспечивает позитивный рост для всего социалистического мира, и наши изменения отражали эгоизм. Сторонники жесткой линии в партии будут возмущены результатом, поскольку мы отчаянно нуждаемся в советской экономической и политической помощи. Реформаторы разочарованы тем, что соглашение не может быть достигнуто, но будут удовлетворены тем, что государство не стремится к компромиссному соглашению."
 SOV_GDR_NEG.6.d: "Недавно мы заключили новое германо-советское экономическое соглашение. Это подтверждает сохраняющиеся исторические и глубокие связи между нашими государствами. Хотя в ходе переговоров возникли некоторые вопросы, окончательное соглашение было подписано к удовлетворению обеих сторон. Советам удалось укрепить отношения, в то время как мы смогли обеспечить более справедливые условия, чем в прошлом. Растет оптимизм по поводу того, что это знаменует собой новую эру более тесного сотрудничества и равенства между двумя государствами."
 SOV_GDR_NEG.7.d: "Германо-Советское экономическое соглашение окончательно ратифицировано нашим правительством и Германской Демократической Республикой. Этот новый договор подтверждает прочные связи между нами и немцами. Мы согласились на несколько немецких просьб, которые препятствовали общей выгоде, которую мы получаем от договора. Однако во имя более широкого социалистического сотрудничества и укрепления экономики ключевого союзника мы приняли это. Мы надеемся, что немцы признают наше великодушие и в будущем отплатят нам тем же."
 Uberholen_ohne_Einzuholen.1.d: "Социалистическая единая партия Германии инициирует новую экономическую политику под названием \"Uberholen ohne einzuholen\" (обгоняя, но не догоняя), которая призывает ГДР сосредоточиться на инвестировании и развитии некоторых ключевых, высокодоходных секторов экономики для содействия взрывному росту. Прибыль от этого окупит долг, необходимый для поддержания этого роста, и позволит нам обогнать капиталистическую Западную Германию в течение следующих пяти лет. Вкладывая значительные средства в эти ключевые отрасли промышленности, ГДР планирует достичь крупного экономического скачка, от которого она сможет не только преодолеть, но и обогнать разрыв между ней и Западом, не вкладывая средства во всю экономику."
 Uberholen_ohne_Einzuholen.2.d: "Когда впервые была изложена политика Uberholen ohne einzuholen (обгоняя, но не догоняя), многие в правительстве отнеслись к ней скептически. Были высказаны опасения по поводу накопления долга, необходимого для обеспечения быстрых инвестиций в ключевые отрасли. Была также серьезная озабоченность по поводу того, как другие секторы экономики будут существовать в течение этого времени. Несмотря на эти опасения, авантюра окупилась. ВВП ГДР сейчас выше, чем в Западной Германии. Мир ошеломлен быстрыми инновациями и инфраструктурой, которую мы разработали для этих ключевых отраслей. Спрос на технологию ГДР и прибыль от нее легко позволят нам расплатиться с долгами при росте экономики. Экономического разрыва с Западом больше нет."
 Uberholen_ohne_Einzuholen.3.d: "Когда впервые была изложена политика Uberholen ohne einzuholen (обгоняя, но не догоняя), многие в правительстве отнеслись к ней скептически. Были высказаны опасения по поводу накопления долга, необходимого для обеспечения быстрых инвестиций в ключевые отрасли. Была также серьезная озабоченность по поводу того, как другие секторы экономики будут существовать в течение этого времени. К сожалению, эти опасения были вполне обоснованными. Рост долга оказал огромное давление на финансирование и внешние источники для получения большего количества средств для экономики быстрее, чем можно было бы достичь роста, покрывшего бы потерю средств. Быстрый рост также не был осуществлен, а забытые отрасли не смогли удовлетворить производственные потребности, необходимые для их развития. Разрыв в ВВП все еще существует и, возможно, стал более заметным, поскольку правительство теперь должно искать способ оживить экономику и контролировать ее обременительный долг. Ожидаемый скачок не состоялся."
 FDJ.5.d: "Сотни тысяч молодежных делегатов со всей Западной и Восточной Германии собрались в Восточном Берлине на Немецкую национальную молодежную конференцию 1964 года. В течение всего периода проведения мероприятия для участников были организованы танцы, светские мероприятия и вечеринки. Это создало непринужденную, открытую атмосферу для всех присутствующих. Социалистическая единая партия Германии высоко оценила широкое участие молодежи в мероприятиях и направила государственные средства массовой информации для трансляции конференции. Среди присутствующих есть подлинное чувство открытости и свободы, хотя некоторые отмечали отсутствие обширных социалистических дискуссий время от времени."
 FDJ.6.d: "В рамках Немецкой национальной молодежной конференции 1964 года начала вещание новая радиостанция. Она называется Sonderstudio Deutschlandtreffen, что уже сокращается до DT-64. Станция будет транслировать новости, развлечения и популярную музыку (в том числе и бит-музыку). На станции также есть прямые эфиры с конференции, что очень необычно на радио в ГДР. Радиостанции даже разрешат играть популярные западные песни."
 Berlin_Wall.1.d: "Жители Берлина с трудом воспринимают происходящее ныне строительство бетонной стены через границу, отделяющую Восточный Берлин от Западного. Строительство началось неделю назад, когда войска ГДР закрыли въезды на границу, установили колючую проволоку и заблокировали КПП, чтобы предотвратить движение транспортных средств. В течение следующих дней были возведены бетонные баррикады для возведения стены, отделяющей город. Строительство ведется в Восточном Берлине, чтобы предотвратить любые западные жалобы и контрмеры. Баррикада, получившая название Берлинской стены, призвана предотвратить незаконное передвижение граждан, остановить западную пропаганду и положить конец предательским заговорам врагов государства. Запад предсказуемо отреагировал возмущением."
 Berlin_Wall.2.d: "ГДР объявила о новых ограничениях на передвижение между Западным и Восточным Берлином. Восточным берлинцам теперь не разрешается пересекать границу. В конечном итоге, могут быть исключения для пожилых пенсионеров, посещения важных семейных дел, и для профессионалов по рабочим вопросам. Европейцам и западным берлинцам не разрешается свободно переправляться в Восточный Берлин, будет создано девять контрольно-пропускных пунктов под строгим пограничным контролем. В настоящее время планируется рассмотреть визовые заявления и усилить контроль на пограничных переходах. Пограничные войска ГДР имеют право применять оружие, чтобы остановить любого, кто попытается незаконно пересечь границу."
 GDR_SAGA.1.d: "Когда ГДР была только основана, она унаследовала устаревшие законы и уголовные кодексы, в том числе от нацистского режима. Это включало в себя законы, которые криминализировали гомосексуализм и \"совращение\" мужчин другими мужчинами. Правительство не применяло эти законы в течение ряда лет, но недавно было принято решение реформировать эти законы и декриминализовать гомосексуализм. Социалистическая единая партия Германии рассматривает гомосексуализм не как болезнь, но и не как законную сексуальную идентичность. Социалистическая доктрина рассматривает гомосексуалистов как \"не репродуктивных\", и они сталкиваются с общим исключением в партии. Несмотря на эти социальные проблемы, ГДР является одним из немногих европейских государств, легализовавших гомосексуализм."
 DDR_Stasi.1.d: "В последние недели по всей ГДР произошло массовое освобождение заключенных, в том числе и политзаключенных. Социалистическая единая партия Германии ныне экспериментирует с политикой либерализма. Эти действия нужды для того, чтобы заручиться поддержкой людей и остудить атмосферу в обществе. Ожидается, что вливание этих освобожденных заключенных в общество также даст толчок экономике и восполнит потери населения из-за эмиграции."
 SOV_GDR.5.d: "Вальтер Ульбрихт недавно ушел с поста первого секретаря Социалистической единой партии Германии, сославшись на проблемы со здоровьем. Партия подтвердила его замену Эрихом Хонеккером, который займет пост первого секретаря и станет новым лидером Германской Демократической Республики (ГДР). Эрих Хонеккер ранее занимал руководящие посты в Политбюро, имея большой опыт работы в оборонной сфере. Многие эксперты не были удивлены, ведь Ульбрихт готовил Хонеккера к этому. Хотя ходят слухи, что эти двое недавно поссорились из-за экономики. Хонеккер пообещал, что установит единство экономической и социальной политики. Он обещает эру стабильности и социального роста."
 SOV_GDR.6.d: "Вальтер Ульбрихт недавно ушел с поста первого секретаря Социалистической единой партии Германии, сославшись на проблемы со здоровьем. Партия подтвердила его замену Хорстом Зиндерманном, который займет пост первого секретаря и станет новым лидером Германской Демократической Республики (ГДР). Зиндерман, многолетний лидер партии, рассматривается многими как компромиссный выбор между реформаторами и сторонниками жесткой линии в партии. Ожидается, что он скорректирует экономические, социальные и внешние отношения, но эксперты не верят, что это приведет к серьезным изменениям."
 Ulbricht_Doctrine.1.d: "Лидер Германской Демократической Республики Вальтер Ульбрихт обнародовал новую доктрину, получившую название Доктрины Ульбрихта, в отношении к дипломатии с Западной Германией. Доктрина утверждает, что дипломатические отношения и нормализация могут произойти только в том случае, если оба государства взаимно признают законность и суверенитет друг друга. Западная Германия долгое время утверждала, что они являются единственным истинным немецким государством, но внутри страны существует определенное давление на правительства для изменения подхода к дипломатии. Другие европейские социалистические государства обязались сократить свои контакты с Западной Германией до тех пор, пока они не согласятся признать суверенитет ГДР. ГДР надеется, что ее новая политика окажет давление на Западную Германию, чтобы она действовала с взаимным уважением к Восточной Германии."
 DDR_Foriegn.1.d: "Первый секретарь [DDR.GetLeader] осудил Западную Германию и НАТО за их высокомерие и вмешательство в германские дела. Он обвинил Западную Германию в нагнетании напряженности и постоянном отрицании суверенитета ГДР с целью провоцирования насильственной конфронтации. НАТО поддерживает непримиримую позицию Западной Германии, развертывая враждебные вооруженные силы и организуя массированную пропагандистскую кампанию, направленную на подрыв немецкого социализма и провоцирование насилия в пределах наших границ. Мощная речь завершилась обещанием, что ГДР знает об этих махинациях и остается приверженной защите социалистического государства."
 ESS.1.d: "Германская Демократическая Республика (ГДР) объявила о начале новой социалистической экономической системы. Планируемая политика обещает восстановить централизованное планирование и сосредоточить основное внимание на высоких технологиях для обеспечения самодостаточного экономического роста. Инициатива направлена на быстрое расширение экономики, чтобы конкурировать с Западом и заставить замолчать критиков, которые утверждают, что предыдущие экономические модели не были близки к социализму. План, по своей сути, сокращает финансирование других секторов экономики, но тот импульс, который экономика ожидает получить, компенсирует любые проблемы, связанные со стагнацией в этих секторах или увеличением долга, компенсирует любые проблемы."
 ESS.2.d: "Лидер Германской Демократической Республики (ГДР) Эрих Хонеккер изложил свое единство экономической и социальной политики в недавнем обращении. ГДР больше не будет работать, чтобы конкурировать с капитализмом и превзойти его. Эта политика часто приводила к опасным идеологическим компромиссам в экономике. Вместо этого ГДР будет стремиться построить социалистическое общество и рабочий класс. Целью экономики будет достижение политических целей, поставленных государством и партией. Благодаря этой политике социалистическая политическая система восторжествует на благо рабочих и государства."
 Ulbricht_Doctrine.2.d: "Германская Демократическая Республика открыто осудила и отвергла советское давление на переговоры с Западной Германией. ГДР настаивает на том, что переговоры будут проводиться на ее условиях, условия которых заключаются в том, что Западная Германия признает легитимность и суверенитет Восточной Германии. СССР же стремится ослабить напряженность в Европе и давит на Западную Германию, чтобы отстранить её от Соединенных Штатов. Решение ГДР, скорее всего, вызовет раздражение Москвы и поставит под угрозу недавние мирные усилия Советов."
 SOV_GDR_NEG.10.d: "Бывший инженер-ракетчик и главный экономический советник Германской Демократической Республики (ГДР) Эрих Апель был найден мертвым, он застрелился из пистолета в голову. Эта смерть ошеломила многих в партии Социалистического союза Германии. Апель, ключевой сторонник экономических реформ, в последние недели усилил свое влияние на Первого секретаря. Правительство объявило, что будет проведено тщательное расследование, однако ходят слухи, что самоубийство могло быть инсценировано сторонниками жесткой линии или советскими агентами. Якобы существовало опасение, что Апель был на грани убеждения в серьезном изменении экономической политики ГДР. Независимо от правды, смерть станет серьезным ударом для реформаторов."
 Uberholen_ohne_Einzuholen.4.d: "Германская Демократическая Республика (ГДР) объявила, что ее экономические отчеты подтвердили, что ее ВВП, наконец, превзошел ВВП Западной Германии. Это крупная победа социалистической экономической системы, начатой ГДР несколькими годами ранее. Экономический план восстановил централизованное планирование и сосредоточил производство на нескольких ключевых высокотехнологичных отраслях. План требовал накопления долгов и пренебрежения другими секторами экономики. Эта авантюра окупилась, так как достигнутый рост способствовал быстрому экономическому подъему, позволившему достичь столь значимой для ГДР победы."
 FDJ.1.d: "Правящая Социалистическая единая партия Германии должна решить, следует ли реформировать Союз свободной немецкой молодёжи. Первоначально Союз был основан как антифашистская молодежная организация, но превратился в структурное подразделение государства и партии. Она дает молодым людям рекомендации относительно будущей карьеры в социалистическом обществе, однако в последние годы участие в организации сильно сократилось. Среди молодежи, по-видимому, растет апатия к социалистическому учению. Звучат призывы к реформам, которые приведут к более спокойной и аполитичной деятельности, сделают молодежные организации более привлекательными и обратят вспять этот разрыв поколений. Противники реформы жалуются, что она не придерживается строгой социалистической идеологической обработки и будет иметь обратный эффект, поощряя бунтарские мысли, ослабляя социалистическую мораль и социальные нормы."
 GDR_ECON.1.d: "Советская контрольная комиссия недавно прислала доклад с подробным описанием нашего экономического развития. Советы критиковали политику ускорения социализма путем коллективизации и другие наши меры. В докладе отмечается, что это привело к отчуждению многих специалистов, которые покинули страну. Комиссия рекомендует сделать шаг назад от коллективизации и сосредоточиться на диверсификации экономики. Некоторые в правительстве согласны с этим анализом и считают, что мы должны принять рекомендации, однако высокопоставленные члены партии считают, что советский анализ игнорирует ключевые реалии и долгосрочный рост, который приведет к экономическому буму в будущем."
 GDR_ECON.2.d: "Правительство объявило о переводе служащих из промышленности в комиссию Госплана. Это значительно повысит экономическую эффективность и свидетельствует о возобновлении внимания к тяжелой и горнодобывающей промышленности. Новая структура будет улучшать систему планирования экономического развития, отчеты местных властей теперь будут быстрее анализироваться и влиять на экономику. Помимо этого, Госплан станет гораздо ближе к Совету Министров в аспекте экономического планирования."
 Storfreimachung.0.d: "Западная Германия продолжает угрожать выйти из нашего международного торгового соглашения. Они глупо думают, что могут использовать торговлю и нашу потребность в западном импорте против нас. В ответ партия объявила о новой политике «Akiton Sorfreimachung». Она направит правительство на поиск альтернативных источников импорта и сократит нашу потребность в западногерманских товарах. Товары, обычно импортируемые, теперь будут производиться нашими собственными заводами, в то время как материалы и станки могут быть привезены из Советского Союза и наших социалистических союзников в Европе."
 GDR_ECON.0.d: "Правительство объявило о создании Государственной плановой комиссии. Она будет тесно сотрудничать с Советом Министров для содействия разработке государственной экономической политики на национальном уровне. Это поможет определить правильное развитие новых отраслей промышленности и строительства жилья. Правительство считает, что комиссия будет способствовать более целенаправленному и эффективному экономическому видению государства и правительства. Председатель комиссии будет заседать в Совете Министров."
 ddr.1.t: "Увеличение рабочих норм"
 ddr.1.d: "Руководители государственного промышленного сектора уже много месяцев настаивают на увеличении рабочих норм. Правительство одобрило их просьбу, и они наконец получили то, что хотели. Хоть людям будет труднее работать на государство, но это ни в коем случае не должно быть проблемой."
 ddr.1.o1: "Прекрасно"
 ddr.2.t: "Бунт рабочих"
 ddr.2.d: "Вчера утром 300 строителей из восточного Берлина объявили забастовку и прошли маршем по аллее Сталина к правительственным зданиям после того как их начальство объявило о сокращении зарплаты, если они не выполнят увеличенную рабочую норму. Число бунтовщиков быстро росло, была объявлена всеобщая забастовка и протесты. Сегодня произошли крупные столкновения, но в конце концов военные подавили восстание силой."
 ddr.2.o1: "Что еще мы могли сделать?"
 ddr.3.t: "[GetNewspaperHeader]Образование ГДР"
 ddr.3.d: "Германская Демократическая Республика, иначе известная как Восточная Германия, была основана в советской оккупированной зоне Германии сегодня. Создание ГДР закрепляет разделение Германии, которое произошло в 1945 году. Западная Германия уже получила независимость от оккупационных держав в начале 1949 года, и создание Восточной Германии означает то же самое для бывшей Советской зоны, хотя правящая Социалистическая единая партия Германии поддерживает тесные связи с СССР и поэтому ГДР рассматривается как государство-сателлит."
 ddr.3.o1: "Возрождённые из руин!"
 ddr.3.o2: "Объединение идет"
 ddr.4.t: "Перейти черту?"
 ddr.4.d: "Новое германское правительство следует политике Варшавского договора и советского правительства. Возможно, мы могли бы вознаградить их, вернув некоторые отрасли промышленности, захваченные во время оккупации."
 ddr.4.o1: "Конечно"
 ddr.4.o2: "Мы сохраним промышленность у себя"
 ddr.5.t: "СССР возвращает промышленность"
 ddr.5.d: "Советское правительство объявило, что вернёт в ГДР промышленность, захваченную при оккупации. Это, прежде всего, награда за то, что мы продолжаем наш коммунистический путь."
 ddr.5.o1: "Превосходно"
 ddr.6.t: "СССР отказывается посылать промышленность"
 ddr.6.d: "Многие в советском правительстве предлагали высшему руководству вернуть в ГДР часть промышленности, захваченной во время оккупации, как награду за следование советской политике. Однако их предложение было отвергнуто, и промышленность останется в СССР."
 ddr.7.t: "Восточногерманское предложение"
 ddr.7.d: "Ошеломляющий поворот во внешней политике ГДР привел к тому, что они сделали интересное предложение. Если мы пообещаем встать на их сторону против Варшавы, они оккупируют западные земли, которые якобы по праву являются немецкими, несмотря на массовые депортации немцев с них в первые послевоенные годы. Как руководители Восточного блока, мы должны выбирать, кого поддерживать."
 ddr.7.o1: "Поддержать ГДР"
 ddr.7.o2: "Поддержать Польшу"
 ddr.8.t: "СССР поддерживает нас"
 ddr.8.d: "За закрытыми дверями Советский Союз заявил, что будет поддерживать нас в нашей польской экспансии."
 ddr.8.o1: "Замечательно"
 ddr.9.t: "Предательство СССР"
 ddr.9.d: "За закрытыми дверями правительство СССР обещало свою полную поддержку восточным немцам в их экспансии. Мы могли бы принять ответные меры против оккупации этих регионов ГДР, но это означает войну и с Советами. С другой стороны, мы могли бы просто смириться со своей судьбой и этими территориальными потерями."
 ddr.9.o1: "Ничего не поделать"
 ddr.9.o2: "Мы дадим отпор!"
 ddr.10.t: "СССР поддерживает нас"
 ddr.10.d: "За закрытыми дверями правительство СССР обещало свою полную поддержку Польше в противостоянии восточногерманской экспансии. ГДР попыталась попросить СССР передать земли Западной Польши, но, к счастью, Москва осознала националистическую природу этой просьбы."
 ddr.10.o1: "Они сохранили Европу"
 ddr.11.t: "СССР поддерживает Польшу"
 ddr.11.d: "За закрытыми дверями правительство СССР обещало полную поддержку Польше в наших попытках расширения. Мы просили у Советов польские западные земли, но, к сожалению, Москва считает, что полякам лучше в Варшавском договоре, чем в объединенной Восточной Германии."
 ddr.11.o1: "Чего еще можно было ожидать?"
 ddr.12.t: "Объединение?"
 ddr.12.d: "В течение значительного периода времени мы ожидали, что Восточная Германия предложит воссоединение. Сегодня мы получили ноту от посла ГДР с подробным изложением их просьбы. Они утверждают, что Восточная Германия на самом деле готова демонтировать социалистическую систему и воссоединиться с Западной, если мы разорвем наши договоры с НАТО и станем нейтральным государством."
 ddr.12.o1: "Принять воссоединение"
 ddr.12.o2: "Отказать ГДР"
 ddr.13.t: "Западная Германия принимает предложение"
 ddr.13.d: "Правительство Федеративной Республики Германии приняло наше предложение стать единой и нейтральной Германией."
 ddr.13.o1: "Вместе, воскресшие из руин!"
 ddr.14.t: "Западная Германия отказывает нам"
 ddr.14.d: "Правительство Федеративной Республики Германии отвергло наше предложение стать единой и нейтральной Германией."
 ddr.14.o1: "Мы потерпели неудачу"
 ddr.15.t: "Берлинская стена пала"
 ddr.15.d: "Было 8 часов вечера, и жители Западного Берлина, казалось, занимались своей повседневной жизнью. Однако буквально через полчаса перемены уже витали в воздухе, и сотни тысяч людей маршировали к Берлинской стене. Охранники ничего не могли поделать, когда западные берлинцы снесли Стену, вбежали на территорию ГДР, умоляя спасти их от капитализма. Сегодня все население Германии требует, чтобы демократическое правительство ушло в отставку и уступило место социализму и объединению с Востоком."
 ddr.15.o1: "Это воля народа"
 ddr.16.t: "Берлинская стена разрушена"
 ddr.16.d: "Было 8 часов вечера, и жители Западного Берлина, казалось, занимались своей повседневной жизнью. Однако буквально через полчаса перемены уже витали в воздухе, и сотни тысяч людей маршировали к Берлинской стене. Охранники ничего не могли поделать, когда западные берлинцы снесли Стену, вбежали на территорию ГДР, умоляя спасти их от капитализма. Сегодня все население Германии требует, чтобы демократическое правительство ушло в отставку и уступило место социализму и объединению с Востоком."
 ddr.16.o1: "Время пришло."
 ddr.17.t: "Объединение?"
 ddr.17.d: "В течение значительного времени мы ожидали, что восточные немцы предложат какое-то предложение о воссоединении. Сегодня мы получили ноту от посла ГДР с подробным изложением их просьбы. Они утверждают, что Восточная Германия на самом деле готова объединить страну в рамках двух систем. Восток сохранит социалистическое правительство и экономику, а Запад - демократию и капитализм. Однако они объединили бы внешнюю политику и другие системы, что заставляет нас полагать, что они будут снисходительны к нам."
 ddr.17.o1: "Принять"
 ddr.17.o2: "Отказаться"
 ddr.18.t: "Западная Германия принимает предложение"
 ddr.18.d: "Правительство Федеративной Республики Германии приняло наше предложение стать единой Германией в рамках двух систем."
 ddr.18.o1: "Воскресшие из руин"
 ddr.19.t: "Западная Германия отказывает нам"
 ddr.19.d: "Правительство Федеративной Республики Германии отвергло наше предложение стать единой Германией в рамках двух систем."
 ddr.19.o1: "Мы потерпели поражение"
 ddr.24.o1: "Только Восточная марка и Померания"
 ddr.24.o2: "Отдать всё"
 ddr.24.o3: "Мы будем удерживать своё"
 ddr.25.t: "Польша предлагает регионы"
 ddr.25.d: "Поляки приняли некоторые из наших грубых требований, позволив нам без проблем вернуть Восточную Марку и Померанию. Однако достаточно ли только этого?"
 ddr.25.o1: "Да"
 ddr.25.o2: "Дадим им второй шанс"
 ddr.26.t: "Польша приняла ультиматум"
 ddr.26.d: "Польское правительство приняло все наши грубые требования, позволив нам без каких-либо проблем захватить их западные области. Наконец-то великая Германия вернулась!"
 ddr.26.o1: "Отлично"
 ddr.27.t: "Польша отказывается"
 ddr.27.d: "Польское правительство отвергло все наши грубые требования, отказавшись позволить нам взять их западные области мирно. Должны ли мы подкрепить наши требования грубой военной силой или отступить?"
 ddr.27.o1: "Вторгнуться в Польшу"
 ddr.27.o2: "Отступить"
 ddr.28.t: "Второй шанс"
 ddr.28.d: "Предложив восточногерманскому рейху Восточную Марку и Померанию в обмен на мир, мы получили отказ. Их лидер потребовал, чтобы мы приняли все условия, отказ от которых приведет к определенным последствиям."
 ddr.28.o1: "Принять все условия"
 ddr.28.o2: "На этот раз ответ отрицательный"
 ddr.29.t: "Польша принимает условия"
 ddr.29.d: "Польское правительство приняло все наши грубые требования, позволив нам без каких-либо проблем захватить их западные области. Наконец-то великая Германия вернулась!"
 ddr.29.o1: "Отлично"
 ddr.30.t: "Польша отказывает нам"
 ddr.30.d: "Польское правительство отвергло все наши грубые требования, отказавшись позволить нам взять их западные области мирно. Должны ли мы подкрепить наши требования грубой военной силой или отступить?"
 ddr.30.o1: "Вторгнуться в Польшу"
 ddr.30.o2: "Отступить"
 ddr.31.t: "Объединение?"
 ddr.31.d: "Поскольку и Западная, и Восточная Германия находятся под властью нацистских доброжелательных лидеров, правительство Восточного Берлина предложило нам сделку, которая объединила бы нацию после многих лет разделения. Как мы должны реагировать?"
 ddr.31.o1: "Конечно да"
 ddr.31.o2: "Западная Германия прежде всего"
 ddr.32.t: "Западная Германия принимает предложение"
 ddr.32.d: "Западногерманские нацисты приняли наше предложение объединиться под единым великим правительством. Наконец, эта нация может оставить позади годы разделения и работать вместе для великого Рейха."
 ddr.32.o1: "Хайль!"
 ddr.33.t: "Западная Германия отказывается"
 ddr.33.d: "Западногерманские нацисты отвергли наше предложение об объединении под единым великим правительством. Может быть, сейчас самое время оставить позади годы раскола и воссоединить Германию силой?"
 ddr.33.o1: "Никакой войны"
 ddr.33.o2: "Глупое решение с их стороны"
 ddr.34.t: "Берлинская весна"
 ddr.34.d: "Было относительно холодное и туманное утро в Восточном Берлине, магазины только открывались. Однако через несколько часов волна безоружных граждан прошла маршем к различным правительственным учреждениям, требуя, чтобы чиновники сдались революции. Как только они это сделали, другая армия революционеров двинулась к границе с Западной Германией, крича своим друзьям, чтобы они спешили и воссоединялись. Они объединились, и жители Восточного Берлина объявили, что коммунистическое правительство рухнуло в течение одного дня, и что Берлинская весна мирно свергла репрессивное правительство."
 ddr.34.o1: "Их правление закончилось"
 ddr.35.t: "Берлинская весна"
 ddr.35.d: "Восточные немцы обратились к ужасам демократии и капитализма, назвав это \"Берлинской весной\". Должны ли мы вторгнуться и восстановить порядок?"
 ddr.35.o1: "Да."
 ddr.35.o2: "Предоставим их самим себе"
 ddr.36.t: "Объединение?"
 ddr.36.d: "Поскольку и Западная, и Восточная Германия управляются демократическими правительствами, Восточная Германия предложила нам сделку, которая объединила бы нацию после многих лет разделения. Как мы должны реагировать?"
 ddr.36.o1: "Конечно"
 ddr.36.o2: "Западная Германия прежде всего"
 ddr.37.t: "Западная Германия принимает предложение"
 ddr.37.d: "Западные немцы приняли наше предложение объединиться под единым великим правительством. Наконец, эта нация может оставить позади годы разделения и работать вместе для великой Республики."
 ddr.37.o1: "Прекрасно"
 ddr.38.t: "Западная Германия отказывается"
 ddr.38.d: "Западногерманское правительство отвергло наше предложение об объединении под единым великим правительством. Возможно, эта нация никогда не сможет оставить позади годы разделения..."
 ddr.38.o1: "Поистине позор"
 ddr.39.t: "Перестрелка на границе с Германией"
 ddr.39.d: "Неизвестный солдат из ГДР застрелил двух восточногерманских пограничника перед пересечением границы с Федеративной Республикой Германия в городе Хильдбургхаузен. Федеративная Республика Германия (ФРГ) приняла его к себе, и с тех пор мы не знаем, где он. Мы должны установить личность этого убийцы и перебежчика и потребовать, чтобы западногерманское правительство вернуло его для суда."
 ddr.39.a: "Мы требуем его выдачи, чтобы он ответил за свои убийства"
 ddr.39.b: "Пусть с ним разбирается западногерманское правительство"
 ddr.40.t: "[GetNewspaperHeader]Стрельба на германской границе"
 ddr.40.d: "Ранним утром 19 декабря 1975 года произошел инцидент со стрельбой на межгерманской границе, на границе между Тюрингией и Баварией, недалеко от восточногерманского города Хильдбургхаузен. По словам дежуривших в то время западногерманских пограничников, лунное спокойствие холодной и ясной зимней ночи было нарушено около 2:25 ночи звуком автоматной стрельбы с восточной стороны границы. В течение следующих часов на восточногерманской территории произошло много волнений: пограничники прочесывали местность за границей; офицеры разъезжали, руководя процессом; над головой гудели вертолеты. Основываясь на своих наблюдениях за подобными прошлыми инцидентами, западногерманские власти быстро пришли к выводу, что, вероятно, имело место попытка побега через сильно укрепленную внутреннюю границу Германии."
 ddr.40.a: "Беглец пока останется в Западной Германии."
 ddr.41.t: "Западная Германия отказала в экстрадиции"
 ddr.41.d: "Западногерманское правительство отказало нам в выдаче Вернера Вайнхольда. Это оскорбление, неприемлемое для нас. Этот человек убил двух наших товарищей и должен предстать перед судом в Восточной Германии. Многие наши официальные лица призывают Западную Германию прекратить безответственные действия, поскольку это может привести к \"серьезным последствиям\". Должны ли мы позволить ФРГ иметь с ним дело или окажем на них давление?"
 ddr.41.a: "Эскалация напряженности того не стоит. Надеюсь, западные немцы отправят его в тюрьму."
 ddr.41.b: "Оказать давление на западных немцев. Готовьте войска на границе."
 ddr.42.t: "[GetNewspaperHeader]Берлинская Стена"
 ddr.42.d: "Правительство ГДР начало возводить колючую проволоку и бетонную \"антифашистскую стену\", или \"антифашистский бастион\", между Восточным и Западным Берлином. Было заявлено, что официальная цель этой Берлинской стены состоит в том, чтобы помешать западным \"фашистам\" проникнуть в Восточную Германию и подорвать социалистическое государство, но некоторые считают, что она в первую очередь служит цели пресечения массового бегства с Востока на Запад. Президент США сказал: \"Стена - это чертовски много лучше, чем война.\""
 ddr.42.a: "Это сигнализирует о еще более глубоком разделении между нами"
 ddr.43.d: "Фридрих Вильгельм Рейнхольд Пик только что умер в своей квартире по адресу кольцо Маяковского, 29, район Панков, Восточный Берлин. В 1949 году он стал первым президентом Германской Демократической Республики, должность которого была упразднена после его смерти."
 Honecker.100.d: "Эрих Хонеккер только что был избран генеральным секретарем Социалистической единой партии Германии. Хонеккер - сторонник жесткой линии, который несколько раз сталкивался с СССР и поэтому считался лучшим выбором для ГДР. Во время его инаугурационной речи его твердая антилиберальная позиция получила большую поддержку со стороны Кубы, Северной Кореи и бесчисленных сторонников жесткой линии социалистов по всему миру. Западная Германия обвинила Хонеккера в совершении зверств, наблюдаемых при строительстве и эксплуатации Берлинской стены."
 Prussia_cul.1.d: "Фридрих Великий-величайший лидер, который когда-либо был у Германии. Он возвел Пруссию из ничего в силу, с которой приходилось считаться. Пришло время еще раз принять его наследие. ГДР объявила об учреждении праздника в честь Фридриха Великого. В течение недели праздника будут проходить ежедневные военные парады и фестивали, посвященные Пруссии. Западноевропейские комментаторы уже называют его Восточным Октоберфестом."
 Prussia_cul.2.d: "Девяносто Пять тезисов Мартина Лютера позволили народам Европы бросить вызов Папству и Империи. В некотором смысле мы обязаны Лютеру возвышением Германии. Наша Германия, а не ложь Габсбургов и пап."
 Prussia_cul.5.d: "Восточногерманское утро началось бурно, когда радикальные сторонники антилютеранской политики правительства подожгли несколько церквей и, как сообщается, напали на нескольких священников. Правительство не дало никаких комментариев, но лютеране во всем мире осуждают эти действия как жестокость."
 Prussia_Spring.5.d: "Восточногерманский режим объявил сегодня, что Германская Демократическая Республика будет проводить радикальный сдвиг экономической политики, аналогичной политике Югославии Иосипа Тито. Эта акция была встречена со смешанными чувствами и общей подозрительностью со стороны Советского Союза."
 Prussia_Spring.6.d: "Снова юнкеры и Гогенцоллерны восстают! До последних дней Вельткрига мы держали мир в страхе. Мы потерпели неудачу тогда, мы не потерпим неудачу снова. Более чем через 30 лет после отречения Вильгельма II династия Гогенцоллернов вернулась в Пруссию и заняла свое место в качестве монархов Пруссии. В тот же день были выдвинуты возражения со стороны Великобритании и Франции."
 Prussia_Spring.3.d: "Когда мы проиграли войну, восточная Германия была порабощена большевистской угрозой. Мы страдали от бесчисленных унижений, нанесенных Советами. Мы больше не будем их марионетками. Недавно восстановленное Королевство Пруссия объявило о скором выходе из Варшавского договора. О других советских организациях, в которые входила Германия, не упоминалось, но эксперты НАТО предсказывают, что Пруссия покинет их все."
 Prussia_Spring.4.d: "Советский ревизионизм является загрязнителем идей Маркса. Председатель Мао многому нас научил, и теперь мы разрываем наши цепи и сплачиваем народ. Мы объединим Германию, как Мао освободил Китай. При неожиданном повороте событий восточногерманское руководство осудило советское руководство и пригрозило выйти из СЭВ. Германский посол недавно принимал участие в громкой дипломатической миссии в Китай, и теперь стало ясно, что Германия стремится к союзу с коммунистическим Китаем."
 NDP.1.d: "Несмотря на то, что сказали союзники, мы не свободны. Они манипулируют нашей нацией, крадут наши ресурсы и нашу законную землю. Гитлер сопротивлялся западу, и теперь следующее поколение немцев готово занять его позицию. Сегодня рано утром западногерманская полиция была вновь вызвана для разгона митинга во главе с неонацистской Национал-демократической партии Германии (НДПГ). Правительство и НАТО сделали заявления, осуждающие партию и ее действия, но, похоже, полиция была неэффективна, и опросы перед предстоящими выборами предсказывают, что НДПГ получит несколько мест."
 NDP.2.d: "Когда Гитлер возглавлял наш Рейх, наши границы простирались от Испании до ворот Москвы. Наша армия была непобедима, наш народ был по-настоящему счастлив, но потом, на пике могущества, Рейх распался и был разрушен. На этот раз мы исправим ошибки и победим большевиков. Сегодня Германия увидела себя единой после референдума, который ошеломил большую часть мира. Фашисты снова контролируют Германию. НАТО никак не прокомментировало это, но протестные выступления уже начались в ООН, где их возглавил польский представитель, вероятно, от имени Советского Союза."
 DDR_prussa_unify.1.d: "18 января 1871 года в залах короля-солнца Германия была окончательно объединена. Мы узурпировали Францию как хозяев Европы, и теперь наши кайзеры возвращаются. Наш Рейх наконец-то займет свое место под солнцем. Королевство Пруссия вновь стало катализатором объединения Германии под единым руководством после длительной кампании воссоединения. После переговоров с бывшим западногерманским правительством воссоединение было завершено в Версальском дворце, хотя на этот раз они только попросили забронировать место, а не вторгаться во Францию."
 DDR_unify.1.d: "Германия бесконечно страдала с момента окончания войны. Нас больше, чем Запада. Оба наших народа требуют, чтобы стена рухнула и снова объединились. После десятилетий разлуки жители Берлина снесли стену, которая не только разделяла народ Германии, но и убивала тех, кто пытался ее пересечь. Кадры разрушения стены транслировались миллионам людей по всему миру и уже превозносятся как одно из самых значительных событий века."
 ddr.46.d: "Из Саксонии пришли отличные новости. Компания VEB Sachsenring Automobilwerke Zwickau только что объявила, что первая модель Trabant P50 покинула завод. Это относительно продвинутый автомобиль с передним приводом, унитарной конструкцией и независимой подвеской.\Двигатель представляет собой небольшой двухтактный двигатель с воздушным охлаждением 500 куб. см мощностью 18 л. с. Это означает, что автомобиль может развить максимум 100 км/ч. Среднее время ожидания нового автомобиля составляет 10 лет, но при социализме мы никуда не спешим."
 ulbricht_purge.2: "Время [DDR.GetLeader] истекло. Строительство Берлинской стены стало для него пиар-катастрофой не только на Западе, но даже в Восточном блоке. Это становилось все более критичным, поскольку ГДР столкнулась с растущими экономическими проблемами из-за его неудачных реформ, а другие страны отказались предложить какую-либо помощь. Его отказ искать сближения с Западной Германией на советских условиях и отказ от разрядки привели советское руководство в ярость. Теперь пришло время заставить его уйти на пенсию\"по причинам плохого самочувствия\". На его замену есть два кандидата, Москва отдавала предпочтение Эриху Хонеккеру или более либеральному Хорсту Зиндерманну."
 ddr.21.d: "Почти сразу после нашего освобождения Советами народ покинул республику, чтобы присоединиться к империалистической и капиталистической Западной Германии. В 1950-х годах мы пытались ограничить выезд людей и стигматизировать Republikflucht, в том числе требуя снятия с регистрации в восточногерманских органах власти и разрешения на выезд из страны под угрозой тюремного заключения до трех лет. Мы даже выпустили пропагандистскую брошюру в надежде остановить народ. Но, несмотря на все наши усилия, миллионы людей уже ушли, и миллионы уйдут, если мы ничего не предпримем."
 ddr.23.d: "WIP"
 marx_year.1.d: "В этом 1953 году исполняется 70 лет со дня смерти Карла Маркса, возможно, самого важного философа последних 100 лет и автора Коммунистического манифеста. В ознаменование этой годовщины Германская Демократическая Республика проведет свой первый Год Карла Маркса, и в настоящее время разрабатываются планы переименования города Хемниц в Карл-Маркс-Штадт, а также возведения массивной статуи в центре города. Лейпцигский университет также будет переименован в Университет Карла Маркса, и будет учрежден новый орден, орден Карла Маркса, самая важная награда в ГДР. Этот год будет полон дружеских марксистско-ленинских торжеств как в ГДР, так и во всем Восточном блоке!"
 marx_year.2.d: "1968 год будет 150-летием со дня рождения Карла Маркса, основателя марксистской теории. Германская Демократическая Республика будет отмечать свой второй год Карла Маркса, первый-в 1953 году; снова начнутся гордые социалистические торжества!\""
 marx_year.3.d: "100-летие со дня смерти Карла Маркса наступит в 1983 году. Наследие Маркса, важного человека, запомнится всему Восточному блоку и развивающемуся миру как человек, позволивший рабочим всего мира подняться. Германская Демократическая Республика в этом году будет отмечать свой третий год Карла Маркса, и каждый социалист должен гордиться тем, что помнит Маркса!"
 ADR.1.d: "Сегодня на волне растущего фашистского насилия Австрийская Демократическая Республика объявила о волне радикальных политических реформ, направленных на очищение нации от всех физических и психологических пережитков национал-социализма. Уже сейчас многие статуты, намекающие на немецкое превосходство или австрийский национализм, были снесены, были введены строгие законы, касающиеся австрийской истории, и подозреваемые в симпатиях к фашизму исчезли из общественной жизни. В то время как многие диссиденты считают эти акты такими же фашистскими, как и предполагаемые цели, многие отмечают, что с момента начала нацистского военизированного насилия и преступлений на почве ненависти резко сократилось."
 ADR.2.d: "Вчера Генеральный секретарь Иоганн Коплениг выступил с заявлением, критикующим западно-австрийское правительство за отказ австрийскому рабочему в праве выбора “истинного австрийского государства”. Коплениг призвал провести выборы в обоих штатах, чтобы решить, объединяться или нет в рамках “нейтрального рабочего государства”. Эта просьба была широко осуждена как акт политического театра, призванный дестабилизировать Западную Австрию и дать Восточной Австрии моральную почву. Несмотря на непрозрачность, заявление Копленига уже вызвало рост крайне левого активизма в Западной Австрии."
 ADR.3.d: "Обязанностью КПО является защита революции, продвижение австрийского рабочего и сохранение мира во всем мире. Подрыв или прямое противодействие любой из этих обязанностей равносильно государственной измене."
 ADR.4.d: "Цель состоит в том, чтобы воссоздать мощь и масштаб реакционной Австро-Венгерской империи, на этот раз, однако, в интересах ее рабочих и крестьян. На данный момент Фольксвагеншафтпакт-это незначительная коллекция торговых сделок и лицензий на оснастку, но с работой и единством он вырастет в пакт, более прочный, чем сталь."
 ADR.5.d: "Чехословацкая Республика подписала Фольксвагеншафтпакт, экономический пакт, направленный на “полное уничтожение границ и торговых ограничений между всеми государствами-членами”. На данный момент пакт представляет собой всего лишь несколько незначительных торговых сделок по древесине и бокситам, но многие предсказывают, что он может стать мощным экономическим и военным союзом, который будет играть доминирующую роль в европейской дипломатии."
 ADR.7.d: "Вернулся после войны, чтобы восстановить нашу великую столицу Вену. Однако с тех пор он использовал всю свою добрую волю к партии, будучи откровенным критиком центрального планирования и однопартийного государства. Если мы хотим продвинуться дальше, Корнер должен быть исключен из общественного внимания. Из-за его происхождения было бы глупо казнить его. Вместо этого Корнер будет уволен и лишен права занимать какие-либо государственные должности."
 ADR.8.d: "Теперь стойте на краю светлого будущего, наполненного процветанием, единством и трудом. Тем не менее, предстоит еще многое сделать. Наши границы остаются пористыми и слабыми, позволяя реакционерам и диссидентам путешествовать туда и обратно почти без сопротивления. Наши заводы, хотя и являются образцами социалистической современности, все еще недостаточно эффективны. Фольксвагеншафтпакт, хотя и многообещающий старт, - всего лишь лист бумаги. Эти и многие другие вопросы будут решены в ближайшие десятилетия, когда мы продемонстрируем истинную силу австрийского рабочего."
 ADR.9.d: "Сегодня генеральный секретарь Австрийской Демократической Республики Иоганн Коплениг резко усилил напряженность в отношениях с Западной Австрией в печально известной речи, призывающей к «немедленному свержению незаконного и изменнического правительства в оккупированной Австрии». Это выступление уже вызвало осуждение как со стороны США, так и Советского Союза, посчитав его ненужной провокацией в одном из самых напряженных регионов мира. Несмотря на критику со стороны обеих мировых держав, речь, известная в Австрии как «Die Rede der Verräterischen Brüder» или «Вероломная речь о беспокойстве», была широко популярна среди населения Восточной Австрии. Коплениг уже получил волну поддержки в виде масштабного вздутия КПО. В Западной Австрии резко возросло количество спорадических случаев мирного инакомыслия среди рабочего класса, хотя маловероятно, что восстание произойдет в обозримом будущем. Несмотря на то, что выступления произвели международное впечатление, кажется, что основная цель — популяризация коммунистического движения в глазах жителей Восточной Австрии — была достигнута."
 ADR.10.d: "Вчера музыканты из стран Варшавского договора и других стран собрались в Вене на первый ежегодный Einheinskonzert. Концерт Einheinskonzert, по мнению правительства Восточной Австрии, является «мероприятием, на котором социалистические государства по всему миру могут обмениваться культурой и художественными достижениями без капиталистической цензуры». Заметными участниками концерта были Советский ансамбль Александрова, Ансамбль Эриха-Вайнхерта ГДР, Государственный заслуженный хор и симфонический оркестр Корейской народной армии, Центральный оркестр Войска Польского и Ансамбль Вооруженных сил Болгарии. Официальные лица Восточной Австрии намекнули, что Einheinskonzert вернется через пять лет, поскольку это мероприятие узаконило Восточную Австрию как суверенную нацию и принесло миллионы долларов доходов от туризма."
 ADR.11.d: "Сегодня генеральный секретарь Восточной Австрии Иоганн Коплениг объявил Австрию «первой жертвой фашистского империализма». В том же заявлении Коплениг выразил мысль о том, что австрийский народ был не чем иным, как ступенькой к мировому господству и полному разрушению постпросвещенческих ценностей. Хотя это кажется небольшим событием в маленькой стране, многие корреспонденты считают, что принятие восточноавстрийской жертвы означает конец денацификации для маленькой центральноевропейской нации, поскольку население пришло к осознанию опасности фашизма как для австрийского государства, и люди. Тем не менее, некоторые не столь восторженны. Многие в еврейской общине осудили недавнее заявление на том основании, что оно устраняет национальную вину за холокост. Независимо от последствий, ясно, что темная глава в австрийской истории закрывается."
 ADR.12.d: "Западную Европу сегодня потрясло то, что впервые после разделения Восточная Австрия обогнала экономику Западной Австрии. Несмотря на значительно меньший ВВП на душу населения, экономика Восточной Австрии за последние несколько лет росла шокирующими темпами, став богаче, чем многие небольшие европейские страны. Хотя этому успеху есть много причин, самой важной из них, по-видимому, является готовность Восточной Австрии выйти на западные рынки. В публичном заявлении генеральный секретарь Иоганн Коплениг пошутил, что «нашим успехом мы обязаны западногерманскому, британскому и американскому потребителю не меньше, чем промышленному духу нашего народа». Эта победа социализма потрясла весь мир, и многие ставят под сомнение истинную силу капитализма."
 ADR.13.d: "Сегодня жители Вены проснулись и увидели масштабную строительную площадку на границе с Восточной Австрией. Как и их немецкие товарищи, Восточная Австрия начала строительство массивной стены вдоль границы с Западной Веной. Официально восточные австрийцы заявили, что эти укрепления предназначены для «защиты австрийской революции от натовского империализма». Однако многие считают, что истинной целью стены будет остановить массовую нелегальную иммиграцию из страны. Многие в Западной Австрии беспокоятся о своих соотечественниках за железным занавесом, а некоторые опасаются, что Восточная Австрия станет государством-тюрьмой."
 ADR.14.d: "Во время дипломатической поездки в Москву генеральный секретарь Восточной Австрии Иоганн Коплениг был свергнут умеренным кланом внутри КПО во главе с социал-демократом Францем Йонасом. Это событие, обычно называемое Октябрьским переворотом, вероятно, положит начало новой эре в Восточной Австрии. Йонас уже объявил о своих намерениях изгнать все иностранные войска с австрийской земли, нарушить однопартийное правило КПО и позволить австрийскому народу воссоединиться. Западная Австрия и НАТО празднуют появление возможности мирного объединения Австрии. СССР резко осудил Октябрьский переворот и призвал к немедленному смещению Йонаса. Ходит много слухов о возможном советском вторжении, поскольку войска стран Варшавского договора собираются на австрийской границе. Однако эксперты в регионе считают, что из-за гористой местности и потенциального сопротивления Австрии любое вторжение в Восточную Австрию обойдется дорого."
 ADR.15.d: "Сегодня последние баррикады и заграждения, разделяющие восточную и западную австрийскую границу, были убраны, так как два народа стали одним целым. Восточная Австрия, только что свергнувшая коммунистическое правление, провела выборы, которые международные наблюдатели сочли «свободными и справедливыми» для воссоединения с Западной Австрией. Несмотря на решение воссоединиться с Западной Австрией, результат выборов не был предрешен: голоса против объединения набрали 46%, а голоса за объединение - 54%. Теперь, когда страна объединена, австрийским чиновникам придется решать множество проблем, таких как интеграция энергосистемы, стандартизация восточных и западных частей в армии и, конечно же, работа с большим меньшинством людей, предпочитающих коммунистическое правление. На международном уровне это событие вызвало глубокую тревогу у СССР и его союзников, поскольку часть железного занавеса откололась. Советы уже увеличили гарнизоны в Восточной Европе, и ясно, что они не допустят повторения этого."
 ADR.16.d: "На волне политической нестабильности Восточная Австрия развязала чистку КПО и Красной Армии. Это стало неожиданностью, поскольку многие международные наблюдатели считали Восточную Австрию одной из самых стабильных стран Восточного блока. Многие известные политики-реформисты, такие как Франц Йонас, были обвинены в государственной измене и приговорены к смертной казни. Официальное заявление Восточной Австрии на данный момент гласит, что КПО переживает период реорганизации, и многие в государственном аппарате неспособны управлять в новом политическом климате. Правительство Восточной Австрии осудило чистки как «клеветническую ложь», однако ясно, что многие умеренные члены КПО были смещены с должностей на местном и государственном уровне."
 ADR.17.d: "Сегодня Австрийская Демократическая Республика объявила о смерти генерального секретаря Иоганна Копленига. После долгих лет борьбы с раком Коплениг скончался в своей постели. Были организованы государственные похороны, и ожидается, что на них приедут многие коммунисты со всего мира. На данный момент будущее Австрийской Демократической Республики висит в воздухе. Хотя официально пост генерального секретаря занял Франц Мури, многие в КПО считают, что будущее партии принадлежит ветерану Коминтерна и либерализатору Эрнсту Фишеру. Кто консолидирует власть, тот и решит будущее Австрии."
 ADR.18.d: "Сегодня Франц Мури был назначен генеральным секретарем КПО и лидером Австрийской Демократической Республики. У Мури есть новые смелые планы в отношении Австрии, в первую очередь расширение экономического сотрудничества в Центральной Европе и усиление поддержки революционеров в странах третьего мира. Помимо нового видения Австрии, новый генеральный секретарь считает, что ключом к успеху Восточной Австрии являются прочные отношения с СССР. Несмотря на личные убеждения, Мури заверил Москву, что Австрийская Демократическая Республика останется верной Советскому Союзу."
 ADR.19.d: "Сегодня Эрнст Фишер был назначен генеральным секретарем КПО и лидером Австрийской Демократической Республики. У Фишера есть новые смелые планы на Австрию, в том числе масштабные экономические реформы и расширение культурных свобод. Несмотря на то, что после распада Австрии новый генеральный секретарь придерживался советской линии, он осудил советское влияние в Центральной и Восточной Европе после Пражской весны. Эти заявления отдалили его от остальной части Восточного блока. Москва предупредила, что любые действия, направленные на уход, будут встречены советским отказом от экономической и политической поддержки."
 ADR.20.d: "Прошлой ночью граждане со всего восточного блока стекались в Вену, чтобы посмотреть восточно-австрийскую постановку под названием «Джон Браун: мюзикл». Джон Браун: Мюзикл изображает подвиги аболициониста и неудавшегося американского революционера Джона Брауна и его попытку вдохновить восстание рабов на довоенном юге. Восточная Австрия объявила о работе над мюзиклом всего несколько месяцев назад как о начале многочисленных высокобюджетных театральных постановок, направленных на повышение культурного и развлекательного уровня австрийского народа. Несмотря на роковую постановку, «Джон Браун Мюзикл» получил множество блестящих отзывов международных критиков, отметивших невероятное исполнение, блестящий сценарий, символические отсылки к современным социалистическим движениям. Несмотря на закулисные распри, страсть, проявленная художественной командой, смогла создать шедевр. Признание критиков закрепило «Джон Браун: Мюзикл» как яркий пример художественного прогресса при социалистическом правительстве. Этот успех придал смелости Министерству культуры предоставить большую свободу творчества и еще больше увеличить финансирование искусства."
 ADR.21.d: "Прошлой ночью граждане со всего восточного блока стекались в Вену, чтобы посмотреть восточно-австрийскую постановку под названием «Джон Браун: мюзикл». Джон Браун: Мюзикл изображает подвиги аболициониста и неудавшегося американского революционера Джона Брауна и его попытку вдохновить восстание рабов на довоенном юге. Восточная Австрия объявила о работе над мюзиклом всего несколько месяцев назад как о начале многочисленных высокобюджетных театральных постановок, направленных на повышение культурного и развлекательного уровня австрийского народа. Несмотря на то, что «Джон Браун: Мюзикл» продвигается как основной продукт Восточной Австрии, он получил множество плохих отзывов международных критиков. Несмотря на то, что спектакль вызвал энтузиазм у всех сторон, вовлеченных в художественное развитие, спектакль пострадал от сокращения бюджета в последнюю минуту, что привело к нехватке сценического пространства, плохому качеству звука и «ужасному дизайну костюмов». Критическая катастрофа обрекла «Джона Брауна: мюзикл» на сноску в истории Восточной Австрии. Министерство культуры уже отозвало все заявления и рекламные материалы для постановки в попытке стереть фиаско из общественной памяти.."
 ADR.22.d: "Министерство культуры пообещало, что «Джон Браун: мюзикл» станет путем наших великих наций к величию. Сильный художественный талант разовьет восточноавстрийский дух и обеспечит стране столь необходимый доход от туризма. Несмотря на наши смелые планы, артистическая группа, стоящая за постановкой, запросила больше денег и времени на мюзикл и предупредила, что без надлежащего финансирования спектакль может обернуться настоящей катастрофой. Хотя мы хотим дать ему как можно больше шансов, многие специалисты по планированию призывают нас продолжать финансирование более важных областей экономики. Что нам делать?"
 ADR.23.d: "Пришло время превратить Volkswirtschaftspakt из разрозненного набора мелких торговых сделок в настоящий символ центральноевропейского социалистического сотрудничества. Однако на пути стоит одна вещь. Хотя STASI сообщило нам, что Советский Союз, вероятно, не имеет представления о наших планах на будущее, предварительное центральноевропейское экономическое сотрудничество без одобрения СССР может спровоцировать советское вторжение. Мы должны рассказать им все и попросить зеленый свет."
 ADR.24.d: "Сегодня Австрийская Демократическая Республика потребовала резкого расширения Volkswirtschaftspakt. В настоящее время Volkswirtschaftspakt представляет собой беспорядочную и бессвязную смесь торговых сделок между АДР, Чехословакией и Венгрией. Однако мы считаем, что со временем он может стать прочным экономическим блоком. В то время как некоторые в партии с энтузиазмом поддерживают европейскую интеграцию, некоторые опасаются отказываться от влияния. Этот пакт может выйти из-под контроля и привести к тому, что мы потеряем контроль над многими другими социалистическими странами в Варшавском договоре."
 ADR.25.d: "К сожалению, Советы отклонили нашу просьбу о расширении Volkswirtschaftspakt, полагая, что в дальнейшей экономической интеграции не будет необходимости. Это стало большим разочарованием, и многие в КПО осудили Советы. Хотя Volkswirtschaftspakt мертв, наша экономика все еще может процветать."
 ADR.26.d: "СССР принял нашу просьбу о расширении Volkswirtschaftspakt! Хотя поначалу наше предложение вызвало беспокойство, Советы поддались влиянию наших опытных дипломатов, заверивших их, что Восточная Австрия и впредь останется верным социалистическим союзником. Получив зеленый свет, мы теперь можем полностью посвятить себя центральноевропейскому экономическому сотрудничеству, не опасаясь советского вмешательства."
 ADR.27.d: "Наша экономика находится на подъеме, но все еще отстает от западного правительства. Если мы хотим укрепить свою позицию законной Австрии в глазах всего мира, мы должны обогнать экономику Западной Австрии и поднять наш народ в современную эпоху. Ключ к нашему успеху лежит в диверсификации и зарубежном сотрудничестве. Победа для нас — это победа социализма и всего австрийского народа. Неудача будет унижением нашего отечества."