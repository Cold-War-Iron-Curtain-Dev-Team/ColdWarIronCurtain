 ddr_adopt_new_flag_desc: "На Третьем народном конгрессе, состоявшемся в 1949 году, мы решили принять черно-красно-золотой флаг, то есть тот же, что и у наших западных врагов. Однако теперь мы должны изменить его, добавив наш национальный герб, молот и компас, окруженный венком из кукурузы, дабы он отличался от капиталистического флага Федеративной Республики. Такая эмблема будет символизировать союз рабочих, фермеров и немецкой интеллигенции."