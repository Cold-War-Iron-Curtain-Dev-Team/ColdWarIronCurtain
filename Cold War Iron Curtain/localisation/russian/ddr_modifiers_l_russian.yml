 ddr_adopt_new_flag_desc: "На Третьем народном конгрессе, состоявшемся в 1949 году, мы решили принять черно-красно-золотой флаг. Это то же самое, что и наш западный враг. Теперь мы должны изменить его, добавив наш национальный герб, молот и компас, окруженный кукурузой, с тем чтобы отличить флаг Федеративной Республики. Эмблема символизирует союз рабочих, фермеров и разведки."
