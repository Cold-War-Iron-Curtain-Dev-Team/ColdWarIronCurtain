 AOC_reorganize_farming_policies: "Реорганизовать политику сельского хозяйства"
 SOV_agriculture_desc: "Начиная с зари человечества, сельское хозяйство было способом выращивания продовольствия для роста населения, после Великой Отечественной войны нам необходимо создать новую сельскохозяйственную систему для поддержки нашего населения в случае новой войны с капиталистическими державами."
 SOV_improved_training_desc: "Во время войны мы потеряли сотни тысяч советских срочников из-за нашего отчаянного положения на фронте, мы должны организовать более профессиональную военную подготовку, чтобы не потерять так много людей из-за таких расточительных усилий"
 SOV_lessons_from_the_great_patriotic_war_desc: "Великая Отечественная война многому нас научила, мы должны начать крупную реформу наших Вооруженных сил, чтобы никогда больше не позволять угнетающей силе проникать так глубоко в СССР, не править водами нашей нации, не править небом нашей великой коммунистической нации."
 SOV_rebuild_member_civilian_industries_desc: "Те, кто противостоял нам во время войны, очень пострадали за свои действия и решения, но теперь, когда мы создали дружественные правительства в этих странах с единомышленниками, мы должны поддержать их промышленный сектор, чтобы конкурировать с Западом."
 SOV_develop_membership_infrastructure_desc: "Бомбардировки нашими советских ВВС оставили большой след на всех наших старых врагах, после установления наших дружественных товарищей мы должны восстановить их железные дороги, города и шоссе для большего развития их народов."
 SOV_develop_membership_research_collection_desc: "Со времени начала холодной войны несколько лет назад мы заметили, что капиталистические державы очень сильно растут в технологическом превосходстве, это связано с их сотрудничеством в исследовательской программе, и мы должны учредить ее, чтобы создавать великолепные проекты. за Родину."
 SOV_collectivized_five_year_plans_desc: "С самого начала нашей нации, пятилетние планы были источником нашей промышленной мощи и были причиной, по которой мы отбили фашистского зверя, так как он работал так хорошо для нас, мы должны реализовать пятилетний план на всех наших новых дружеские товарищи."
 SOV_soviet_oil_fields_desc: "Немецкое наступление на Кавказ напомнило нам об огромной силе, которую нефть имеет для военной военной машине, мы должны искать и использовать любые новые нефтяные месторождения, которые мы находим в максимально возможной степени, чтобы заправить нашу военную машину самым большим потенциалом.."
 SOV_soviet_oil_refineries_desc: "Постоянно меняющаяся мировая экономика учит нас тому, что нефть является одним из крупнейших товаров, который необходимо поставлять любой стране, которая хочет называться мощью, и поэтому мы должны создать новые нефтеперерабатывающие заводы для удовлетворения потребностей советского народа. а также наших союзников по всему миру."
 SOV_autarkic_policies_desc: "Мы не можем зависеть ни от кого, даже от наших союзников, поскольку наши ресурсы имеют огромное значение для народа, поэтому наш великий лидер решил, что мы примем автаркию в качестве нашей новой политической цели для СССР."
 SOV_latam_operations_desc: "Чем ближе мы приближаемся к врагу рабочих, тем лучше, поэтому мы должны финансировать наших братьев-коммунистов в правительствах стран Южной и Центральной Америки, чтобы способствовать революции и свергнуть капиталистического орла."
 SOV_european_thrust_desc: "С тех пор как мы повернули вспять фашистское чудовище, мы хотели принести коммунизм в остальную Европу, но союзники препятствовали нашему прогрессу, мы говорим не более, поскольку мы начнем подрывать капиталистическую тиранию в Европе и освободить всех рабочих ,"
 SOV_internal_stability_desc: "Внутренняя стабильность должна быть достигнута для того, чтобы отбить капиталистический орел на Западе, мы были опасно близки к троцкистскому перевороту однажды, когда мы сокрушили контрреволюционеров в праведном социалистическом огне, мы снова должны искать стабильность, чтобы обезопасить наши буферные государства от американцев."
 SOV_new_political_theory_desc: "Мир меняется, и поскольку мы чувствуем, что ветер перемен дует на нашу страну, мы также должны начать меняться, одним из столпов нашей нации является то, как мы справляемся с реакционными силами во всем мире, мы должны разработать новую теорию коммунистической экспансии по всему миру."
 SOV_middle_east_operations_desc: "Мы должны смотреть на Ближний Восток как на почву для революции, это один из самых богатых районов нефти на планете, нефть, которая была бы высоко оценена всеми в СССР, поэтому мы должны начать переговоры с ближневосточными правительствами и начать посылать наших агентов для содействия революции."
 SOV_support_arab_cause_desc: "Арабы праведны в своем мнении против израильской страны, мы должны открыто поддерживать их везде, где только можем, в этом вопросе против капитализма и империализма."
 SOV_arm_arab_states_desc: "Мы должны начать готовить арабов к любым попыткам подавить их жажду революции со стороны американцев или англичан, что является одной из причин того, что мы собираемся послать оружие и бойцов для многих арабских государств."
 SOV_soviet_arabian_sphere_desc: "Давление со стороны нашего правительства наверняка заставит большинство, если не все, арабских правительств оказать нам свою поддержку в этой холодной войне против США, мы должны сделать все, чтобы расширить нашу сферу влияния как можно больше, чтобы увеличить наше буферное государство и защитить истинного лидера социализма - СССР."
 SOV_anti_colonialism_desc: "Британский и французский колониализм уже давно является тяжелым бременем для государства трудящихся по всей планете, включая Азию и Африку, и мы должны открыто выступить против таких вопиющих попыток сломить дух международных трудящихся."
 SOV_stalin_reforms_desc: "Наш Советский Союз уже давно является источником многих реформ на благо трудящихся, и это не исключение, наш великий вождь Сталин проведет в СССР крупные реформы, которые приведут его в статус сверхдержавы, превзойдя Соединенные Штаты Америки."
 SOV_an_iron_curtain_desc: "Было замечено, что подрывные элементы капиталистических держав проникают в каждое коммунистическое государство как болезнь, мы должны установить антикапиталистическую политику в каждом отдельном буферном государстве, которое у нас есть, ибо мы должны предотвратить провал революции как бастиона рабочих во всем мире."
 SOV_socialism_in_one_country_desc: "Как бы ни была прекрасна всемирная революция, революция-это долгий и трудный процесс, который необходимо поддерживать в течение столетий, чтобы добиться успеха, вместо этого мы должны убедиться, что наша база социализма является самой сильной в мире, и ждать бури капиталистического экономического краха, который обязательно последует в ближайшие годы."
 SOV_expand_gulags_desc: "Мы не можем позволить врагам государства мешать нашему развитию, более того, мы должны расширять нашу тюремную систему, поэтому враги государства должны работать на благо страны, а не позволять никому и ничему мешать возвышению нашей нации на ее праведном месте на земле."
 SOV_traditional_beliefs_desc: "Женщины не принадлежат на полях сражений, они принадлежат их домам, воспитывая будущих детей социалистической революции, бессмысленно позволять матерям наших детей бессмысленно умирать на поле битвы, чтобы калечить нашу великую нацию."
 SOV_egalitarian_beliefs_desc: "Крайне важно, чтобы мы позволили женщинам работать в армии и на заводах, они сыграли решающую роль в Великой Отечественной войне и доказали свою ценность, потому что они так же полезны на поле боя или на заводах, как и мужчины, потому что мы должны показать реакционным странам мира, что Советский Союз действительно является самой равноправной страной в мире."
 SOV_collectivization_desc: "Императив - слово, употребляемое для коллективизации всех хозяйств в СССР, только вместе рабочие в Советском Союзе найдут свою утопию ближе к ним, поскольку они оставляют свои эгоистические принципы позади для величия своей нации."
 SOV_traditional_farms_desc: "Возвращение традиционных хозяйств - верный путь вперед, так как коллективизация наших хозяйств в прошлом стоила жизни миллионам наших соотечественников, мы должны стремиться к счастью и безопасности нашего населения, а не быть ужасно жесткими с ними в нашей индустриализации."
 SOV_continue_the_great_turn_desc: "Во время Великой Отечественной войны мы были прерваны тем, что продолжили наш Великий Поворот против капиталистической политики, осуществленной Лениным в 1921 году, но теперь, когда товарищ Сталин стоит у руля нашей нации после победы фашистского зверя, мы можем возобновить Великий Поворот и революционизировать промышленность Советского Союза еще больше."
 SOV_revitalize_the_new_economic_policy_desc: "Мы должны признать недостатки нашего правительства с помощью такого быстрого ускорения коллективизации рабочих и нашего стремления к истинному коммунизму как таковому, мы должны попытаться устранить огромный ущерб, который мы нанесли промышленности нашей страны, и вновь ввести Ленинская политика капитализма, поэтому наша экономика может расти здоровым путем."
 premier_khrushchev: "Никита Хрущёв"
 premier_malenkov: "Георгий Маленков"
 premier_zhukov: "Георгий Жуков"
 premier_beria: "Лаврентий Берия"
 premier_brezhnev: "Леонид Брежнев"
 SOV_government_corruption: "Коррупция в правительстве"
 SOV_government_corruption_endemic: "Эндемичная коррупция в правительстве"
 stagnation: "Эпоха застоя"
 SOV_Generalissimo_Stalin: "Генералиссимус Сталин"
 SOV_Generalissimo_Stalin_desc: "Товарищ Сталин много сделал для советского народа, однако после разгрома фашистского зверя и расширения Советского Союза еще многое предстоит сделать в отношении будущего социализма в нашей стране и за рубежом!"
 SOV_Proclaim_Victory_Over_Fascism: "Провозгласить победу над фашизмом"
 SOV_Proclaim_Victory_Over_Fascism_desc: "С помощью товарища Сталина и мощи Родины советский народ может по праву претендовать на нашу победу над немецко-фашистскими захватчиками, которые стремились изнасиловать нашу славную родину и уничтожить её ради своей выгоды!"
 SOV_Korea_Question: "Корейский вопрос"
 SOV_Korea_Question_desc: "Режиму Ким Ир Сена угрожают западные империалисты! Мы должны найти способ эффективно помочь ему!"
 SOV_Demand_War_Reparations: "Требование военных репараций"
 SOV_Demand_War_Reparations_desc: "После победы над Германией и ее восточными союзниками мы должны потребовать репараций за военные преступления, которые они совершили против советского народа, и бомбардировки советских городов. Мы позаботимся о том, чтобы они заплатили за то, что они сделали!"
 SOV_Establish_European_Radar_Stations: "Установить радиолокационные станции"
 SOV_Establish_European_Radar_Stations_desc: "Радарные станции помогут безопасности нашего восточного блока, и наш Союз будет оставаться стабильным и отслеживать любые потенциальные шаги, которые Запад может предпринять против нас."
 SOV_Infrastructure_Effort: "Разваивать инфраструктуру"
 SOV_Infrastructure_Effort_desc: "Улучшение нашей инфраструктуры улучшит связи между крупными городами и большим количеством сельских общин на родине, а также улучшит движение товаров и поставок в стране."
 SOV_Institute_Nation_Wide_Workers_Programs: "Институт Общенациональных Рабочих Программ"
 SOV_Institute_Nation_Wide_Workers_Programs_desc: "Нации и пролетариату было бы полезно разработать новые программы для всех наших работников, чтобы они могли быть более продуктивными."
 SOV_Resume_the_1945_Five_Year_Plan: "Возобновить пятилетку 1945 года"
 SOV_Resume_the_1945_Five_Year_Plan_desc: "К 1960 году мы станем ведущей мировой индустриальной державой. Это были слова премьер-министра Иосифа Сталина. После Великой Отечественной войны наша страна была опустошена. Мы должны возобновить четвертый пятилетний план восстановления нашей страны."
 SOV_Comecon_Investments: "Инвестировать в СЭВ"
 SOV_Comecon_Investments_desc: "Наши бывшие враги теперь стали нашими товарищами с тех пор, как мы создали новые правительства в своих странах. Мы должны инвестировать в них новые отрасли, чтобы они могли восстановить стабильность и чтобы мы могли и дальше сотрудничать с нашими экономиками."
 SOV_Turkish_Straits_Crisis: "Территориальные претензии к Турции"
 SOV_Turkish_Straits_Crisis_desc: "Турция держит ворота в Средиземное море. Мы должны решить этот вопрос, касающийся наших кораблей и выхода в Средиземное море."
 SOV_Peaceful_Resolution: "Мирное решение"
 SOV_Peaceful_Resolution_desc: "Благодаря нашим талантливым дипломатам, направленным для обсуждения вопроса о турецких проливах и доступе наших кораблей в Средиземное море, мы пришли к мирному урегулированию ситуации и успешно избежали конфликта между нами и Турцией."
 SOV_Expand_the_Nuclear_Program: "Расширить ядерные программы"
 SOV_Expand_the_Nuclear_Program_desc: "Нам не хватает возможности опровергнуть США с точки зрения ядерного потенциала. Мы должны вкладывать больше ученых и нашего бюджета в продвижение нашей ядерной программы!"
 SOV_Continue_Demands_for_Regime_Chang: "Требовать смены режима"
 SOV_Continue_Demands_for_Regime_Chang_desc: "Высокомерие турок и наши исторические конфликты с Турцией дают нам много причин освободить их от антисоветского режима и установить наш контроль в регионе!"
 SOV_Partition_of_Turkey: "Раздел Турции"
 SOV_Partition_of_Turkey_desc: "Поскольку Турция окончательно побеждена и находится под нашей сферой влияния, нам необходимо вернуть часть их земель советской родине в качестве компенсации!"
 SOV_The_Greek_Civil_War: "Гражданская война в Греции"
 SOV_The_Greek_Civil_War_desc: "Товарищи в Греции объявили войну их правительству. Жизненно важно, чтобы мы заняли позицию в этом потенциально стратегическом вопросе."
 SOV_Leave_them_to_their_Fate: "Оставить их на произвол судьбы"
 SOV_Leave_them_to_their_Fate_desc: "С потерями, которые понесли наши товарищи в Греции, было бы слишком дорого пытаться спасти их сейчас. Ради международного мира и потенциальной подготовки к еще более успешной революции в Греции мы должны оставить их на произвол судьбы."
 SOV_Intervene_in_the_Greek_Civil_War: "Вмешаться в греческую гражданскую войну"
 SOV_Intervene_in_the_Greek_Civil_War_desc: "Наши греческие товарищи нуждаются в том, чтобы мы помогли их революции преуспеть! Революция за социализм в Греции слишком стратегически важна, чтобы мы её игнорировали! Мы должны помочь им!"
 SOV_Invite_Greece_to_COMECON: "Пригласить Грецию в СЭВ"
 SOV_Invite_Greece_to_COMECON_desc: "С нашим вмешательством в Грецию мы теперь должны официально привести их в нашу сферу влияния и направить их экономику на путь социализма!"
 SOV_Revival_of_the_Russian_Orthodox_Church: "Возрождить православную церквь"
 SOV_Revival_of_the_Russian_Orthodox_Church_desc: "Несмотря на то, что в прошлом мы подавляли православную церковь, мы теперь осознаем ее социальную значимость для советских людей и преимущества того, что церковь существует под советским государством. Теперь мы дадим церкви оживиться, чтобы заслужить благосклонность православного населения к социализму!"
 SOV_Soviet_Socialist_Patriotism: "Советский социалистический патриотизм"
 SOV_Soviet_Socialist_Patriotism_desc: "После Великой Отечественной войны у нас выросла новая волна любви к нашей Родине и нашему социалистическому образу жизни! Вся наша нация поет песню великолепия нашим ветеранам и нашим рабочим за их будущее нашего Союза!"
 SOV_stalin_notes: "Сталинские ноты"
 SOV_stalin_notes_desc: "После разделения Германии мы показали, кто является настоящей силой мира. Прошло несколько лет с момента такого разделения, и все еще существует вероятность объединения Германии, но это будет на наших условиях для нейтрального правительства в Германии и вывода наших сил и западных сил во имя прочного мира. Мы предложим это на запад."
 SOV_Direct_Intervention: "Прямое вмешательство"
 SOV_Direct_Intervention_desc: "Американцам и их корейскому бандитскому государству на юге придется пройти через нас, если они хотят даже ступить на Корейский полуостров!"
 SOV_Indirect_Intervention: "Косвенное вмешательство"
 SOV_Indirect_Intervention_desc: "Мы отправим нашу технику и людей, чтобы помочь нашим корейским товарищам на Севере. Мы должны сделать это тайно, чтобы не тревожить американцев."
 SOV_socialism_in_one_country: "Социализм в одной стране"
 SOV_expand_gulags: "Расширить ГУЛАГ"
 SOV_Further_Purges: "Дальнейшие чистки"
 SOV_Further_Purges_desc: "Несмотря на то, что Троцкий мертв, как и многие его союзники, благодаря великой чистке, в нашем политбюро все еще есть те, кто желает зла ​​против товарища Сталина и что он сделал для нашей нации, которых нужно полностью очистить от партии."
 SOV_Favour_Beria_and_Malenkov: "Польза Берии и Маленкова"
 SOV_Favour_Beria_and_Malenkov_desc: "Товарищи Берия и Маленков доказали свою лояльность товарищу Сталину и его политике. Мы должны держать их на высоких постах в политбюро, чтобы закрепить влияние товарища Сталина на то, чтобы он оставался в партии."
 SOV_Purge_the_Lenningrad_Party_Leadership: "Чистка руководства Ленинградской партии"
 SOV_Purge_the_Lenningrad_Party_Leadership_desc: "Лидеры из Ленинграда показали свое отвращение к чисткам в политбюро. Они должны быть добавлены на разделочную доску."
 SOV_the_doctors_plot: "Заговор Врачей"
 SOV_the_doctors_plot_desc: "В последнее время у товарища Сталина было плохое здоровье, и ему приходилось полагаться на помощь еврейских врачей. Однако он перестал доверять им и теперь видит, что они вмешиваются в его здоровье, чтобы убить его, и поэтому приказал провести кампанию против этих врачей и евреев по всему Союзу, чтобы отправить их в Сибирь за попытку причинить ему вред."
 SOV_propaganda_against_judaism: "Пропаганда против Иудаизма"
 SOV_propaganda_against_judaism_desc: "Мы должны продолжать заговор врачей с пропагандой против евреев в нашей стране, поскольку они стали жертвами врагов государства и американских шпионов!"
 SOV_anti_western_propaganda: "Антизападная пропаганда"
 SOV_anti_western_propaganda_desc: "Запад, без сомнения, нанял этих «докторов», чтобы убить товарища Сталина! Затем мы должны показать свой гнев против Запада, чтобы показать, что мы не потерпим их шпионов в нашей стране!"
 SOV_Purge_the_Georgian_Party_Leadership: "Очистить руководство грузинской партии"
 SOV_Purge_the_Georgian_Party_Leadership_desc: "Лидеры Грузинской ССР продемонстрировали свою враждебность к дальнейшим чисткам товарища Сталина от Политбюро. Они должны быть добавлены на разделочную доску."
 SOV_Eastern_European_Stimulus_Package: "Восточно-европейский пакет стимулирующих мер"
 SOV_Eastern_European_Stimulus_Package_desc: "С американцами, помогающими Западной Европе в плане Маршалла, мы должны сделать нечто подобное, чтобы наши страны могли конкурировать с Западом и оправиться от войны!"
 SOV_Jumpstart_Belorussian_Industry: "Рывок белорусской промышленность"
 SOV_Jumpstart_Belorussian_Industry_desc: "Чтобы еще больше оправиться от войны, мы должны помочь промышленности наших белорусских товарищей!"
 SOV_Jumpstart_Baltic_and_Balkan_Industry: "Рывок балтийской и балканская промышленностей"
 SOV_Jumpstart_Baltic_and_Balkan_Industry_desc: "После нашей интеграции Эстонии, Латвии и Литвы в наш великий Союз в 1940 году мы должны инвестировать в их промышленность, а также в наших новых балканских союзников, чтобы помочь им восстановиться и оставаться лояльными!"
 SOV_Invest_In_Ukranian_Reconstruction_Program: "Инвестировать в украинские программы реконструкции"
 SOV_Invest_In_Ukranian_Reconstruction_Program_desc: "Наши украинские товарищи сильно пострадали от немецкого вторжения, их дома и промышленность были разрушены. Чтобы завоевать их благосклонность и дать толчок их экономической мощи, в помощь им будут выпущены программы реконструкции."
 SOV_Execute_Khruschev: "Казнить Хрущева и Жукова"
 SOV_Execute_Khruschev_desc: "Иосиф Сталин видит в Жукове и Хрущеве угрозы своей силовой базе. Чтобы обеспечить его безопасность и безопасность Советского Союза, Хрущев и Жуков должны быть устранены."
 SOV_Begin_Military_Purges: "Начать военные чистки"
 SOV_Begin_Military_Purges_desc: "Великая чистка 30-х годов помогла уничтожить царские элементы в российских войсках. Мы должны еще раз очистить вооруженные силы, чтобы обеспечить безопасность Союза от капиталистического мира."
