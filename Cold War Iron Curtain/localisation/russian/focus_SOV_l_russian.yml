 SOV_BREZHNEV_Inaugurate_the_Collective_Leadership_desc: " The Presidium, which had grown to resent Khrushchev's leadership style and feared Mao Zedong's one-man dominance and the growing cult of personality in the People's Republic of China, began an aggressive campaign against Khrushchev in 1963. This campaign culminated in 1964 with the replacement of Khrushchev in his offices of First Secretary by Leonid Brezhnev and of Chairman of the Council of Ministers by Alexei Kosygin. Brezhnev and Kosygin, along with Mikhail Suslov, Andrei Kirilenko and Anastas Mikoyan, were elected to their respective offices to form and lead a functioning collective leadership."
