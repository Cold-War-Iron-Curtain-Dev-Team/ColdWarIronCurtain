 ZIM_Suggest_Federalization_of_British_Central_Africa: "Предлагаю федерализацию Британской Центральной Африки"
 ZIM_Suggest_Federalization_of_British_Central_Africa_desc: "Джим Гриффитс, государственный секретарь по делам колоний, проинформировал Палату общин о том, что британское правительство решило провести еще одно изучение возможности более тесного союза между центральноафриканскими территориями и что была проведена конференция соответствующих правительств и Центральноафриканского совета. устраивается."
 ZIM_Begin_Negotiations: "Начать переговоры"
 ZIM_Begin_Negotiations_desc: "Начинаем переговоры о создании федерации"
 ZIM_Appeal_to_Cohen: "Обращение к Коэну"
 ZIM_Appeal_to_Cohen_desc: "Соглашение, вероятно, не было бы достигнуто без сэра Эндрю Коэна, помощника заместителя госсекретаря по делам Африки. Он стал одним из главных архитекторов и движущих сил, стоявших за созданием Федерации, часто, казалось бы, в одиночку распутывая тупиковые ситуации и откровенные забастовки со стороны соответствующих партий. Коэн, который был евреем и пострадал от Холокоста, был антирасистом и защитником прав африканцев. Но он пошел на компромисс со своими идеалами, чтобы избежать того, что он считал еще большим риском, чем продолжение патерналистской системы господства белых в Южной Родезии - она становится еще менее гибкой, радикальное превосходство белых, как правительство Национальной партии в Южной Африке"
 ZIM_Settle_on_Federal_Structure: "Определиться с федеральной структурой"
 ZIM_The_Federation_of_Rhodesia_and_Nyasaland: "Федерация Родезии и Ньясаленда"
 ZIM_The_Federation_of_Rhodesia_and_Nyasaland_desc: "Палата общин одобрила предложения конференций и приняла ходатайства в пользу объединения территорий Северной Родезии и Ньясаленда. По этому поводу в Южной Родезии был проведен референдум. Следуя настояниям и заверениям премьер-министра Южной Родезии, немногим более 25 000 белых южнородезийцев проголосовали на референдуме за федеральное правительство против почти 15 000 против. Большинство африканеров и чернокожих афроамериканцев на всех трех территориях были решительно против этого. Федерация возникла, когда парламент Соединенного Королевства принял Закон о федерации Родезии и Ньясаленда в 1953 году. Закон уполномочивал королеву, посредством распоряжения в совете, обеспечить федерацию трех составляющих территорий."
 ZIM_South_Rhodesian_Affairs: "Дела Южной Родезии"
 ZIM_South_Rhodesian_Affairs_desc: "Теперь, когда профсоюз сформирован, он должен сосредоточиться на всех трех областях. Теперь мы займемся делами Южной Родезии"
