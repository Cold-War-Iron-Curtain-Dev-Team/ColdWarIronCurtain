 soviet_leader_change.1.d.A: "Terrible news, comrades. Joseph Vissarionovich Stalin has died at the age of 74 in Kuntsevo Dacha after suffering a stroke. Days before his stroke, Stalin and a small number of his inner circle, consisting of Malenkov, Molotov, Beria, and Khrushchev and a few others gathered together for an evening of entertainment and imbibing alcoholic beverages. The guests dispersed at approximately 4:00 a.m. the next day and Stalin retired to his private quarters with strict instructions that he was not to be disturbed until sounds were heard indicating that he had awakened. Time passed and no sounds were heard throughout the day. At approximately 11:00 p.m. on the same day his housekeeper cautiously entered his room and found him lying on the floor, wearing his pajama trousers and a shirt. He was unconscious, breathing heavily, incontinent, and unresponsive to attempts to rouse him. Beria was called and, upon seeing him, discounted the fact that he was unconscious, attributing this to alcohol consumption, and departed.\nAt 7:00 a.m. on the next day, Beria and a group of medical experts were summoned to examine him. Based on their examination, which revealed a blood pressure of 190/110 and a right-sided hemiplegia, they concluded that Stalin, who had a known history of uncontrolled hypertension, had sustained a hemorrhagic stroke involving the left middle cerebral artery. Over the next two days he received a variety of treatments; and, in an attempt to decrease his blood pressure, which had risen to 210/120, two separate applications of eight leeches each were applied to his neck and face over the next two days. However, his condition continued to deteriorate and he died at [GetDateText]. His body then was taken to an unspecified location and an autopsy was performed, after which it was embalmed for public viewing. Nikita Khrushchev, Georgy Malenkov, Vyacheslav Molotov and Lavrentiy Beria are in charge of organizing the funeral." #NT!
 soviet_leader_change.1.d.B: "Terrible news, comrades. Joseph Vissarionovich Stalin has suffered a stroke at his Kuntsevo Dacha. Days before his stroke, Stalin and a small number of his inner circle, consisting of Malenkov, Molotov, Pervukhin, Saburov and a few others gathered together for an evening of entertainment and imbibing alcoholic beverages. The guests dispersed at approximately 4:00 a.m. the next day and Stalin retired to his private quarters with strict instructions that he was not to be disturbed until sounds were heard indicating that he had awakened. Time passed and no sounds were heard throughout the day. At approximately 8:00 a.m. on the same day his housekeeper cautiously entered his room and found him lying on the floor, wearing his pajama trousers and a shirt. He was unconscious, breathing heavily, incontinent, and unresponsive to attempts to rouse him. the doctors were called and, upon seeing him, immediately begun expert examinations.\nAt 11:00 p.m. later that day, Malenkov and the rest of his inner circle were informed by the incident. Thanks to the doctors quick responses, which revealed a blood pressure of 190/110 and a right-sided hemiplegia, Comrade Stalin, who had a known history of uncontrolled hypertension, had partially recovered from the stroke. Over the next few weeks he received a variety of treatments; and, announced he planned to retire at the next Party congress, but in the meantime he will establish a rotating advisory body made of his members of his politiburo to help him in his task. Maksim Saburov, Georgy Malenkov and Mikhail Pervukhin are the first members of this council." #NT!
 soviet_leader_change.1.t.B: "The Stalin's Stroke" #NT!
 soviet_leader_change.1.t.A: "The Death of Stalin" #NT!
 soviet_leader_change.1.o.A: "Comrades Malenkov, Khrushchev and Beria will form a Troika" #NT!
 soviet_leader_change.1.o.B: "Comrades Stalin will create an advisory body to prepare his succession." #NT!
  
 soviet_leader_change.2.t: "Khrushchev's Removal Attempt" #NT!
 soviet_leader_change.2.desc: "" #NT!
 soviet_leader_change.2.o.A: "Leonid Brezhnev is elected First Secretary" #NT!
 soviet_leader_change.2.o.B: "Alexander Shelepin is elected First Secretary" #NT!
 soviet_leader_change.2.o.C: "Nikita Khrushchev is saved by his allies" #NT!
  
 soviet_leader_change.3.t: "Tashkent factory accident" #NT!
 soviet_leader_change.3.desc: "On 21 March 1982, Brezhnev began a visit to Soviet Central Asia which included a particularly rigorous schedule of "medal-giving ceremonies, speeches, and visits to industrial and agricultural enterprises". On 25 March while touring the Chkalov aircraft factory in Tashkent with Uzbek Communist Party first secretary Sharaf Rashidov, scaffolding  suddenly collapsed under the weight of a number of assembled factory workers." #NT!
 soviet_leader_change.3.o.A: "The scaffolding suddenly collapse and hit First Secretary Brezhnev." #NT!
 soviet_leader_change.3.o.B: "The scaffolding suddenly collapse and hit the security officers next to the First Secretary." #NT!
  
 soviet_leader_change.4.t: "Death of Leonid Ilyich Brezhnev" #NT!
 soviet_leader_change.4.desc: "Leonid Ilyich Brezhnev, our dear leader has died at age 75 after suffering a heart attack following years of serious ailments. He had struggled with several ailments since 1974, most notably heart disease, leukemia, jaw cancer, emphysema and circulatory disease, all of which had been exacerbated by his heavy smoking and obesity. Despite his illness, he continued his duties until finally dying of a heart attack in his office. His funeral will be held in five days from now. While we mourn his death, we must also choose his successor." #NT!
 soviet_leader_change.4.o.A: "Yuri Andropov is elected Chairman." #NT!
  
 Germany_Unified_Neutral: "@DDRGermany is §Yunified§! under a neutral state" #NT!
 Swf_Later_Stalin.1.d: "На протяжении более века ведутся обсуждения по поводу обращения русел рек, текущих в арктический регион. Это могло бы дать мощнейший толчек развитию промышленности и сельского хозяйства в средней азии. В 1930-х годах лучшие советские ученые в Академии наук обсудили вопрос о реверсии рек, но в менее глобальном масштабе. Государственный аппарат желает начать работу в этом направлении, чтобы обеспечить советских крестьян и рабочих большим количеством водного ресурса."
 Swf_Later_Stalin.2.d: "Политбюро направил в советскую центральную азию сотрудников партии и КГБ для начала подготовки расселения в этом районе. Переселение населения в средней азии подняло вопрос о потенциальных будущих этнических конфликтах в этих республиках. Восстановление этнической гомогены только укрепит среднеазиатские советские республики. Существующие в республиках национальные меньшинства могут быть перемещены в районы, где они составляют этническое большинство. Необходимо наладить тесное сотрудничество КГБ с местными государственными оганами для обеспечения быстрой и бесперебойной серии операций."
 Swf_Later_Stalin.3.d: "В советской центральной азии существует устоявшаяся, хоть и небольшая, армянская община. Большая часть их прибыла сюда в середине девятнадцатого века. Есть и более старые семьи армян, прибывших сюда для налаживания торговли. Тем не менее, это меньшинство постепенно разрастается, поднимая этническую напряженность, поскольку местные жители не принимают их социальный статус и культуру. Для предотвращения потенциальных проблем и этнической напряженности Центральный Аппарат утвердил план переселения армян из Центральной Азии в Армянскую Советскую Социалистическую Республику. Эта операция не только поспособствует нашим планам по достижению этнической гармонии в Центральной Азии, но также поможет объединить армянское население. Несмотря на это, есть сообщения о том, что армяне Центральной Азии переживают за потерю имущества и совершенно не имеют связей в Советской Армении."
 Swf_Later_Stalin.4.d: "Первый шаг по обращению потоков советских рек в среднюю азию был недавно достигнут. Советский Союз официально открыл печора-камский канал. Проект интенсивно обсуждался в 1930-х годах, но только недавно началось его строительство. Канал будет перенаправлять поток реки Печора в бассейн рек, втекающих в Каспийское море. В течение более века российские чиновники и ученые стремились развить великую реверсию северной реки, которая, наконец, остановила бы поток воды в Северный Ледовитый океан. Несмотря на очевидный успех, ожидается, что реализация проекта займет годы и будет стоить больших сил и ресурсов."
 Swf_Later_Stalin.5.t: ""[GetNewspaperHeader]Mass Deportations in [DDR.GetNameDef] After Failed Uprising"" #NT!
 Swf_Later_Stalin.5.d: "Отчеты с Восточной Германии говорят о душераздирающих сценах депортации крупных групп немцев, насильственно посаженных на поезда, направляющихся в Советскую Центральную Азию. Эти депортации были наказаны  Иосифом Сталиным после неудачного антисоветского восстания в Восточной Германии. Ожидается, что советское правительство отправит подозреваемых антисоветских активистов в Северный Казахстан, куда Сталин изгнал поволжских немцев во время Второй Мировой Войны. Массовые депортации широко осуждаются в некоммунистическом мире, но советское правительство остается приверженным своей политике."
 Swf_Later_Stalin.6.d: "В настоящее время Советский Союз проводит одно из крупнейших переселений народов в своей истории, конкретно в советской Центральной Азии. В попытке, по-видимому, сохранить этнические гомогены и предотвратить потенциальные источники национальных волнений, все основные этнические общины в регионе будут перемещены в их родные республики. Казахи со всех советских центрально-азиатских республик будут переселены в Казахскую ССР. Все этнические узбеки будут переселены в Узбекскую ССР. Советские чиновники настаивают, что эти действия приветствуются переехавшим населением, которые благодарны им за решение об объединении народов. Тем не менее, антисоветские активисты утверждают, что депортации - это разрушение сообществ, которые поколениями жили в этом регионе и эти действия могут положить началу соперничеству между этническими группами."
 Swf_Later_Stalin.7.d: "Переселение украинцев в среднюю азию пережило несколько крупных волн начиная с 18 века. Ещё до советской эпохи на эти земли попадали как добровольные переселенцы, так и те, кого принудили к этому. Под советским правлением, в течение 1930-х и 1940-х годов, государство принудительно депортировало в степи десятки тысяч украинцев. В первую очередь целью были кулаки и их пособники, а когда началась вторая мировая война, то и подозреваемые в сочувствии и поддержке нацистам. Теперь Советский Союз объявил о планах начала переселения всех украинцев из Центральной Азии обратно на Украину. Эта новость особо горячо приветствуется недавно депортированными украинцами. Тем не менее тысячи местных украинцев уже называют среднюю азию своим домом и негативно относятся к переезду на Украину. Похоже, что Советский Союз стремится к созданию и восстановлению этнической гомогены по всем советским республикам для сохранения национальной целостности и предотвращению этнических конфликтов."
 Swf_Later_Stalin.8.d: "Советские чиновники не прокомментировали доклады, касающиеся чеченцев, которые были депортированы в Таджикскую ССР. Несмотря на отказ, источники утверждают, что в рамках более широкой программы перемещения населения в Советской Центральной Азии происходят депортации. Причины не совсем понятны, но это может быть связано с осторожностью среди советских чиновников по поводу угрозы от чеченцов, которые могут являться источником угрозы в их планах. Общая цель этих перемещений населения, по-видимому, является желание советской власти установить этническую гомогену по советским социалистическим республикам в регионе и устранить источники потенциальных этнических или культурных конфликтов."
 Swf_Later_Stalin.9.d: "После необычной партийной сессии Советский Союз объявил об передаче Западного казахстана Российской ССР. Это один из главных шагов в недавней советской инициативе по реорганизации Центральной Азии. Территориальные изменения и перемещения населения являются частью согласованных усилий, чтобы сделать советские социалистические республики более этнически гомогенными и снизить перспективу будущих этнических или культурных конфликтов в этих районах. Население переданной территории состоит из русского большинства и согласуется с проводимой политикой. Хотя решение положительно оценивается в советской прессе, этот шаг скорее всего приведет к негативным последствиям в регионе."
 Swf_Later_Stalin.10.d: "С начала Второй мировой войны Советский Союз депортировал большое количество немцев в Казахскую ССР. Когда началась война, население немецкого поволжья было оперативно депортировано из страха, что местное население присоединится к нацистским захватчикам. Во время недавнего антисоветского восстания в Восточной Германии немцы, подозреваемые в организации и поддержке протестов, также были депортированы. Из-за большой концентрации советских и восточногерманских немцев, Союз решил создать новую Германскую Советскую Социалистическую Республику. Земли Казахской ССР, занимаемые немецким большинством, переданы в новое образование. Решение отражает усилия Советов для реорганизации Советской Центральной Азии и обеспечения этнической гомогенности советских социалистических республик."
 Swf_Later_Stalin.11.d: "Советский Союз, в рамках его усилий по реорганизации советской Центральной Азии и восстановлению этнической однородности советских республик объявил о создании Корейской Советской Социалистической Республики. Земля для нового образования выделена с крайней восточной территории Казахской ССР. Население будет состоять из существующих корейских общин в районе, сахалинских корейцов и большого количества беженцов-коммунистов, которые бежали из Кореи после войны. Советы надеются, что эта политика снизит этническую или культурную напряженность в регионе."
 Swf_Later_Stalin.12.d: "Советский Союз недавно объявил о политике реорганизации Советских Социалистических Республик Советской Центральной Азии, дабы снизить потенциал этнических или культурных конфликтов и обеспечить граждан их собственными национальными правительствами. В рамках этих усилий Автономная Советская Советская Социалистическая Республика Каракалпак была передана Казахскому ССР. Это возвращает большую этническую группу казахов обратно в Казахский ССР. Это также рассматривается, как способ сохранить Казахскую ССР, после передачи немалых земель новым новым советским республикам. Драматичные территориальные изменения этого региона нарушили многие экономические и социальные цепочки и местно население теперь ждёт последствий от этих событий."
 Swf_Later_Stalin.13.d: "Доклады Советского Союза указывают на массовую депортацию в Азербайджанском ССР. Армянское население в Нагорном Карабахе и Нахичеване перемещаются из региона в Армянскую ССР. Советские чиновники не комментируют эти события, но, похоже, это делается с целью снизить этническую напряженность в регионе. Аналитики отмечают, что депортации, вероятно, были запланированы и непосредственно утверждены на самом высшем уровне. Исторически в регионе постоянно происходили насильственные стычки между армянскими и азербайджанскими группами, живущие бок о бок поколениями. Переселение армян может быть попыткой снизить региональную напряженность и сделать Азербайджан этнически более однородным."
 Swf_Later_Stalin.14.d: "Одним из самых больших потрясений на Кавказе с 1920-х годов, стала передача Нагорного Карабаха и Нахичеваня Армянской ССР из состава Азербайджанского ССР. Советы, видимо, надеются, что этот шаг сделает управление регионом менее проблемным и сократит этнические конфликты в регионе. В этих регионах проживают крупные общины обоих народов, но при этом большинство за армянами. Эксперты считают, что такое решение может быть принято непосредственно Сталиным."
 Swf_Later_Stalin.15.d: "Одним из самых больших потрясений на Кавказе с 1920-х годов, стала передача Нагорного Карабаха Армянской ССР из состава Азербайджанского ССР. Советы, видимо, надеются, что этот шаг сделает управление регионом менее проблемным и сократит этнические конфликты в регионе. В этих регионах проживают крупные общины обоих народов, но при этом большинство за армянами. Эксперты считают, что такое решение может быть принято непосредственно Сталиным."
 Swf_Later_Stalin.16.d: "Доклады Советского Союза указывают на масштабную депортацию на Кавказе. Азербайджанское население в Нагорном Карабахе и Нахичеване перевозятся из региона в Азербайджанскую ССР. Советские чиновники не комментируют этот вопрос, но, похоже, целью является предотвращение волнений в регионе после передачи этих земель Армении. Аналитики отмечают, что депортации были запланированными и согласованы на самом высоком уровне. Исторически в этом регионе постоянно происходили стычки между этническими группами армян и азербайджанцев. Этот шаг, скорее всего, должен ликвидировать этническую напряженность в регионе."
 Swf_Later_Stalin.17.d: "Доклады Советского Союза указывают на масштабное перемещение населения на Кавказе. Азербайджанцы в Нагорном Карабахе вывозятся на территорию Азербайжанской ССР. Советские чиновники не комментируют этот вопрос, но, похоже, это сделано с целью предотвратить волнения после передачи региона Армянской ССР. Аналитики отмечают, что депортации были запланированными и согласованы на самом высоком уровне. Исторически в этом регионе постоянно происходили стычки между этническими группами армян и азербайджанцев. Этот шаг, скорее всего, должен ликвидировать этническую напряженность в регионе."
 Swf_Later_Stalin.18.d: "Reports from the Soviet Union indicate a massive deportation is underway in the Caucasus. The Armenian population in Nagorno-Karabakh and Nakhichevan are being removed from the region. Soviet officials are not commenting on the matter, but it appears to be a move meant to calm potential unrest in the region as the regions are eventually to be integrated into Azerbaijan. Analysts note the deportations were likely planned and directly approved by the highest levels of the Soviet Union. Historically, the region has seen continuous incidents of violence between Armenian and Azeri populations living side by side for generations. Moving the Armenians may be the final step in forcibly establishing harmony." #NT!
  
  #Country Events 
 Brezhnev_Pol.10.d: "Никита Хрущев, несмотря на свои заявления об обратном, правил как диктатор и отстранял от власти партийных лидеров. Леонид Брежнев и Политбюро осудили эту практику как отсталую и противоречащую духу марксизма-ленинизма. Брежнев дошел до того, что цитировал Ленина как человека, который всегда хвалил коллективное руководство. Было бы естественно вернуться к такой практике. На недавнем заседании Политбюро было объявлено о восстановлении коллективного руководства как средства предотвращения концентрации власти в одном лице. Правительство публично восхваляет это решение как восстановление марксистско-ленинской практики. Старшие члены партии вскоре получат важные обязанности, и Брежнев будет управлять страной на основе консультаций и консенсуса."
 Brezhnev_Pol.2.d: "После смещения Хрущева новое советское руководство продолжало политику, направленную на дистанцирование от него и его властной базы. Это привело к возвращению старой гвардии внутри Коммунистической партии. При Хрущеве эти люди долгое время находились в стороне или занимали низкие посты, чтобы не допустить их к власти. Однако теперь, когда Брежнев контролирует ситуацию и нуждается в собственной поддержке, эти люди возвращаются в Политбюро и на другие руководящие посты. Советские СМИ восхваляют этот сдвиг и подчеркивают историческую роль, которую многие из этих людей играли в раннем советском государстве и во время Второй мировой войны."
 Brezhnev_Pol.3.d: "Советский премьер Леонид Брежнев недавно предпринял попытку упорядочить руководство и усилить процесс принятия решений путем реструктуризации партийной иерархии в более вертикальную структуру. Раньше старшие члены партии просто подчинялись непосредственно лидеру, встречи были запланированы из-за личных отношений, а не срочности. Часто руководство занималось тривиальными делами и пренебрегало важными или неотложными делами. Брежнев утверждает, что это мешало правительству эффективно решать важнейшие вопросы. Наличие вертикальной структуры позволит более эффективно направлять информацию и не позволит высшему руководству увязнуть в мелких проблемах. Эти незначительные проблемы будут решаться по мере продвижения по цепочке. Многие в партии высоко оценивают этот более научный подход к эффективному управлению."
 Destalinization.49.d: "Советское правительство развернуло значительную кампанию в средствах массовой информации, чтобы обвинить бывшего премьера Никиту Хрущева в системных, экономических и социальных проблемах, стоящих перед Советским Союзом. Хрущева обвиняют в передаче централизованной власти, вопреки коммунистической доктрине, для поддержки его личной власти. Хрущева также обвиняют в чрезмерной либерализации общества, ведущей к беспорядкам и нарушению партийной дисциплины. Все эти проблемы в совокупности создавали слабое Советское государство и экономику. Новый режим Леонида Брежнева подчеркивает эти ошибки как причину того, что советский народ развивается не так, как было обещано. Есть надежда, что обвинение Хрущева позволит новому режиму выиграть время для укрепления собственного авторитета."
 Destalinization.50.d: "Когда Никита Хрущев был у власти, Леонид Брежнев во многом поддерживал его политику десталинизации. Он поддерживал реабилитацию жертв Великой чистки, критику произвольного правления и терпимость к критике со стороны интеллектуальных классов. Однако, придя к власти, Брежнев начал сворачивать эту политику. Правительство предупредило о недопустимости публичной критики, причем нескольким авторам уже грозит арест. Реабилитация жертв сталинской чистки также замедлилась, скорее всего, остановится. Что еще более важно, Брежнев наделил государственные органы полномочиями использовать репрессивные полномочия для контроля над обществом и задержания диссидентов. Однако совершенно ясно, что этот поворот в политике не означает возвращения к крайнему насилию и массовым арестам, наблюдавшимся при Сталине."
 Maoism_SU.1.d: "Советское руководство при Леониде Брежневе восстановило законы о цензуре, чтобы обратить вспять политику либерализации бывшего премьера Никиты Хрущева. Эти новые законы вызвали гнев многих советских писателей, которые чувствуют себя ущемленными властью. Однако литература, которую Хрущев сам подавлял, например маоистская литература, теперь снова разрешена. Маоистская критика Хрущева теперь разрешена советским правительством, чтобы поддержать его усилия по идеологическому сдвигу партии назад к тому, что она считает правильной марксистско-ленинской практикой. Советское правительство будет и впредь строго следить за цензурой в отношении опасных мыслей, но и поддерживать конструктивные произведения."
 Sakharov.1.d: "Бывший физик-ядерщик Андрей Сахаров превратился в ярого критика правительства и распространения ядерного оружия. Он получил известность как диссидент, открыто выступая против того, чтобы ученый, участвовавший в сталинских чистках, не был избран в советскую академию наук. Позже он женился на своей коллеге-диссиденте и защитнике прав человека. Его творчество представляет собой серьезную угрозу общественному согласию внутри Советского Союза и наносит ущерб нашему национальному имиджу. Чтобы разобраться с Сахаровым, спецслужбы расследуют его личную жизнь, а СМИ направляют на активную критику и регулярное осуждение Сахарова. Советское правительство также поощряет членов Академии наук присоединиться к этой массовой критической кампании по дискредитации Сахарова."
 Sakharov_HRC.1.d: "Андрей Сахаров и другие советские интеллектуалы создали Комитет по правам человека в СССР как первый независимый орган по правам человека, действующий в Советском Союзе. Комитет регулярно публикует доклады о правах человека и призывы к советским диссидентам, которым предъявлены обвинения. Советские органы безопасности внимательно следят за этой группой, но недавно было решено, что Советское правительство проведет переговоры с Сахаровым. Советское правительство использовало эти переговоры для того, чтобы заявить, что оно серьезно относится к правам человека и будет учитывать интересы этой группы. Многие полагают, что эти переговоры являются пиар-кампанией, призванной продемонстрировать, что правительство Брежнева не собиралось участвовать в репрессиях, которые наблюдались в раннем советском государстве. Однако из переговоров становится ясно, что правительство вряд ли пойдет на компромисс в своих усилиях по поддержанию социального контроля над членами партии и народом."
 Brezhnev_Ethniciy.1.d: "Советские республики постоянно осуществляют законы и политику, рассчитанные на их собственные этнические группы. Универсальная советская система во всех республиках сильно разрушилась при Никите Хрущеве, который поощрял партикуляризм и позволял республикам управлять собой, пока они были лояльны Советскому Союзу. Для Леонида Брежнева и старших партийцев это представляет серьезную проблему. Если эти республики будут продолжать действовать в значительной степени независимо, то лишь вопрос времени, когда они начнут принимать этнический национализм, а это представляет собой серьезную угрозу Советскому единству. Правительство планирует реформы, которые могут обратить вспять раковую опухоль партикуляризма и укрепить единство Советского Союза."
 Brezhnev_Ethniciy.3.d: "Некоторые социалистические республики в составе Советского Союза позволили отсталым народам сохранить свои традиционные формы правления, часто племенные правительства. Разрешение этих уникальных форм правления является общей чертой партикуляризма и главным препятствием для создания единой, единой советской системы управления. Для борьбы с этим центральным советским руководством в Москве было дано указание соответствующим социалистическим республикам начать процесс упразднения этих племенных правительств. Это не в интересах людей, управляемых этими архаичными и отсталыми практиками, и устранение их ускорит развитие социалистического сознания среди этих людей."
 Brezhnev_Ethniciy.2.d: "Леонид Брежнев и высшие партийные руководители определили партикуляризм среди Советских Социалистических Республик как принципиальную угрозу будущему процветанию, социалистическому развитию и единству Советского государства. Для борьбы с этой опасной угрозой Советское правительство объявило, что оно начнет назначать русских на руководящие должности в различных социалистических республиках. Правительство утверждает, что это не является попыткой превзойти русских над любой другой национальной группой, но отражает, что Россия является самым развитым социалистическим государством в Союзе. Поэтому вполне естественно, что русские являются идеальными лидерами для того, чтобы помочь другим республикам развить свой собственный социализм, которому в течение многих лет мешал партикуляризм, пропагандируемый их местными национальностями."
 11th_5ypfood.0.d: "У высшего советского руководства есть два кандидата-Николай Тихонов и Михаил Горбачев, которые рассматриваются на предмет ответственности за развитие аграрной политики. Сельскохозяйственное производство в последние годы вызывает разочарование, и с этим необходимо бороться. Николай Тихонов является одним из ключевых членов старой гвардии партии и на протяжении всей своей карьеры умело служил администратором, главным образом в промышленности и металлургии. Его предлагаемая сельскохозяйственная политика, скорее всего, будет направлена на корректировку или реформирование существующих методов и политики. Тихонов понимает, что сельское хозяйство отстает, но экстремальные изменения рискуют еще больше подорвать производство. Михаил Горбачев предлагает более молодую перспективу, и он поднялся по партийной лестнице в эпоху после Второй мировой войны. Он считает, что сельскохозяйственное производство в СССР находится в кризисе и для подъема производства потребуются системные реформы. Он утверждает, что без радикальных реформ ситуация только ухудшится еще больше. Партия должна решить, идти ли с надежным Тихоновым или довериться молодому и энергичному реформатору Горбачеву."
 sov_comp_purchase.0.d: "Советское посольство обратилось в Госдепартамент и запросило разрешения обратиться в крупную американскую корпорацию для приобретения технологий, призванных улучшить повседневную жизнь советских граждан. Советское правительство настаивает на том, что передача технологий не помешает Соединенным Штатам и повысит доверие и сотрудничество между нами. Некоторые в кабинете министров утверждают, что мы должны позволить советам покупать технологии, это поможет нашей экономике, а не ослабит баланс сил, улучшит отношения и, возможно, поможет нашим спецслужбам собирать информацию. Другие члены кабинета министров хотят отклонить Советский запрос, они утверждают, что нет смысла отдавать какую-либо технологию открыто враждебной державе, и уступка была бы международной и стратегической неудачей."
 sov_comp_purchase.1.d: "Американское правительство уведомило нас о своем разрешении приобрести у них технологию. Посольство уже связывается с некоторыми предприятиями и корпорациями, чтобы обсудить цены и варианты. Это решение показывает готовность и, возможно, отчаяние американцев в поддержании позитивных отношений с нами. Услышав эту новость, некоторые в Политбюро заявили, что передача технологий позволит нам продвинуть страну вперед и в конечном итоге опередить американцев. Другие, однако, предостерегли такой анализ и заявили, что, возможно, такие передачи и позитивное взаимодействие с американцами могут обеспечить новую эру сотрудничества и мирного развития для советского народа."
 sov_comp_purchase.2.d: "Американское правительство уведомило нас, что у нас не будет разрешения на закупку технологий для их страны. Это удар по нашим усилиям по модернизации экономики. Мы сразу же сообщили американцам, что их решение ставит под угрозу двусторонние связи и указывает на их гнусные планы против Советского Союза. В Политбюро ЦК КПСС единодушно утверждали, что американцам не хватает стремления к миру, а Советский Союз должен оставаться бдительным и преданным делу защиты марксизма-ленинизма. Было также решено издать заявление, восхваляющее советскую науку и призывающее исследователей продолжать свое прекрасное служение государству."
 sov_ibm_purchase.0.d: "Советское посольство сообщило Госдепартаменту о своем желании приобрести компьютерные системы IBM, чтобы построить систему резервирования для предстоящей Олимпиады в Москве. Компьютеры предназначались для Советского туристического агентства "Интурист". Советы заявили, что IBM будет готова предоставить такие системы, если Госдепартамент одобрит их. Мы могли бы дать одобрение; это высветило бы усилия по международному сотрудничеству в преддверии этих предстоящих Олимпийских игр и предложило бы дипломатическое открытие с советами. Однако некоторые чиновники Министерства обороны предупреждают, что советы могут использовать эти системы для развития своих собственных компьютерных технологий, угрожая американским достижениям в этой области. Мы должны решить, одобрять ли продажу компьютеров IBM или нет."
 sov_ibm_purchase.1.d: "Американское правительство одобрило сделку, которую мы заключили с IBM, чтобы продать нам компьютерные системы для нашей системы бронирования на предстоящих Олимпийских играх. Наше туристическое агентство "Интурист" получит компьютеры, и это значительно облегчит иностранным гостям, спортсменам и СМИ планирование посещения игр. Американское решение было отличным знаком доброй воли, и если эти системы окажутся столь же эффективными, как утверждалось, это может вдохновить новое внимание к компьютерам в стране. Есть некоторые опасения, что американцы могут попытаться шпионить за нами с помощью этих компьютеров, но начальники службы безопасности отклонили эти опасения, поскольку системы предназначены для "интуриста", а не для какого-либо другого секретного агентства."
 sov_ibm_purchase.2.d: "Наша недавняя попытка взаимодействовать с американцами в духе международного сотрудничества по поводу предстоящей Московской Олимпиады закончилась разочарованием. Недавно мы попытались облегчить покупку компьютеров у американской корпорации IBM. Эти компьютеры предназначались бы для "интуриста", нашего туристического агентства, и создавали бы систему бронирования, которая облегчала бы поездки посетителей со всего земного шара. В ответ на эту простую просьбу американское правительство сорвало сделку, продемонстрировав свою воинственность и враждебность, не знающую конца. Неудача в приобретении этих систем будет препятствовать подготовительным усилиям, однако советский народ не подведет в своих обязанностях и не забудет этого последнего пренебрежения со стороны американцев."
 encourage_scientific_competition: "Поощряемый научный конкурс"
 equal_pay_act: "Повышенная Заработная Плата"
 sov_sell_tech.0.d: "Недавно из Москвы прибыла делегация высокого уровня. Во время переговоров один высокопоставленный советский чиновник предложил нам закупить у них технику. Они отметили, что Советский Союз имеет самую большую научную инфраструктуру в социалистическом мире, и такие технологии могут принести огромную пользу нашей стране. Совершенно очевидно, что делегация ожидает от нас окончательного ответа на их предложение. Если мы купим технологию, это, конечно, повредит нашим финансовым резервам, но это укрепит связь между нашими двумя государствами. Кроме того, такая технология может оказаться полезной для нас. Если мы отвергнем советское предложение, то делегация наверняка выразит разочарование, и Москва может прийти в ярость. Однако небольшое ухудшение наших отношений с Советским Союзом может стать платой за нашу финансовую стабильность."
 sov_sell_tech.1.d: "Недавно была отправлена ​​делегация в [FROM.GetName] для того, чтобы обсудить общие проблемы, стоящие перед нами обоими, и предложить им продать технологию. Продажа технологии другим социалистическим государствам укрепит социалистический мир и поможет финансировать многочисленные советские ученые и лаборатории, продвигающие технологии в конкурентной борьбе с Западом. Получив это предложение, правительство [FROM.GetName] с энтузиазмом принимается. Они заявили о своем желании продвигать свой народ и делать это через знания, полученные в социалистическом мире. Успешный визит, несомненно, укрепляет связи между Советским Союзом и [FROM.GetName]. Уже сейчас строятся планы по будущим предложениям о продаже технологий нетерпеливым и дружественным государствам."
 sov_sell_tech.2.d: "Недавно была отправлена ​​делегация в [FROM.GetName] для того, чтобы обсудить общие проблемы, стоящие перед нами обоими, и предложить им продать технологию. Продажа технологии другим социалистическим государствам укрепит социалистический мир и поможет финансировать многочисленные советские ученые и лаборатории, продвигающие технологии в конкурентной борьбе с Западом. Получив это предложение, правительство [FROM.GetName] ошеломило наших дипломатов отказом. Они не сделали этого резко или грубо, но отметили, что финансовые ограничения мешают им приобрести эту технологию. Конечно, это скорее всего ложь, но как только делегация вернется, мы временно понизим рейтинг сотрудников посольства и его консульских служб, чтобы показать наше неудовольствие."
  
  #Country Events 
 ABMT.1.d: "Премьер-министр Леонид Брежнев и высокопоставленные партийные чиновники предложили нам договор о противоракетной обороне. Предлагаемый договор будет ограничивать развертывание такого оружия только на объектах МБР и в столице. Системы противоракетной обороны (ПРО) разрабатываются обеими нашими странами для уменьшения разрушительных последствий тотального ядерного обмена. Однако понятно, что такие проекты очень дороги и рискуют начать новую гонку вооружений. Хотя мы полагаем, что наши технологические достижения дадут нам в конечном счете преимущество, некоторые из наших теоретиков предполагают, что такой сценарий может спровоцировать советы нанести удар первыми. Это предложение представляется разумным, поскольку наши военные эксперты говорят, что ПРО в настоящее время не может предотвратить ядерное уничтожение. Принятие этого предложения также способствовало бы улучшению отношений с советами. Однако некоторые старшие советники считают, что советское предложение говорит об их слабости в исследованиях по ПРО, поэтому мы должны отклонить это предложение и продолжить наши собственные."
 SALT_II.1.d: "Советский Союз предлагает новую серию переговоров по ограничению стратегических вооружений для обеих стран. Этот новый договор фактически предусматривал бы сокращение ядерных запасов до определенного предела. Договор также ограничит разработку новых договоров, хотя текущие программы развития в обеих странах будут исключены, а это означает, что будущие программы будут ограничены. Предлагаемый договор не будет резко ограничивать запасы, и обе страны по-прежнему будут иметь стратегический паритет, но он остановит гонку ядерных вооружений и накопление такого оружия. Учитывая, что договор кардинально не меняет расстановку сил, его подписание имеет смысл, позволит нам финансировать более насущные программы и станет отличным моментом для получения международной поддержки. Несмотря на это, некоторые высокопоставленные чиновники Пентагона призывают нас не подписывать договор и вместо этого сосредоточиться на разработке более совершенных систем, чтобы подтолкнуть стратегический баланс в нашу пользу."
 ROM_NORMALIZATION.1.d: "В течение многих лет румынская Коммунистическая партия под руководством Николае Чаушеску отклонялась от марксистско-ленинской линии в вопросах экономического развития, личных прав и иностранных дел. Румыния временами отрывалась от советской линии по международным вопросам и медленно выводила Румынию из состава военного командования Варшавского договора, что огорчало советских чиновников. Для советского режима Леонида Брежнева это неприемлемо и является нарушением его брежневской доктрины. Во время недавнего заседания Варшавского договора Советское правительство предложило румынам нормализовать отношения, если они согласятся очистить свою партию от уклонистов и вернуть страну на путь марксизма-ленинизма. Советское правительство отметило, что румынский социализм находится под угрозой со стороны внутренних сил, и если оно не исправится, то Москва без колебаний поможет народу. Теперь румынское правительство должно решить, как оно будет реагировать на этот вызов."
 ROM_NORMALIZATION.2.d: "Советский Союз с удовлетворением воспринял недавнюю новость о том, что на внеочередном заседании Румынской коммунистической партии было принято решение отстранить Николае Чаушеску и вернуть Румынию для подражания советскому образцу. Чаушеску и его союзники яростно сопротивлялись, но на этой встрече их перехитрили. Промосковские партийцы объединили противников Чаушеску и других, кто опасался советской интервенции для смещения многолетнего румынского лидера. Чаушеску обвиняли в отступничестве от марксизма-ленинизма, контрреволюционной деятельности и коррупции. Он и его союзники были лишены высших партийных постов, и еще неизвестно, предстанут ли они в конечном итоге перед судом. Эти события являются крупной победой Советского Союза и доктрины Брежнева."
 ROM_NORMALIZATION.3.d: "Советский Союз при Леониде Брежневе принял новую доктрину, в которой Москва оставляет за собой право спасать социалистические государства, столкнувшиеся с экзистенциальными внутренними или внешними угрозами. Недавно советы обратились к Румынской коммунистической партии с просьбой восстановить надлежащий, социалистический характер ее правительства и политики или же пострадать от последствий. Несмотря на некоторые усилия диссидентов внутри Румынской коммунистической партии, давний правитель Румынии Николае Чаушеску выжил и теперь более прочно закрепился в качестве лидера. Как только он обезопасил себя, он обвинил советы во вмешательстве в румынские дела и отказался от советских требований. Румынское правительство отметило, что оно по-прежнему привержено своей революции и социалистическому характеру, и отвергло советские претензии на обратное, предложив Советскому Союзу ограничить свои собственные амбиции."
 SOV_PLO.1.d: "Советский Союз уже давно поддерживает борьбу арабов против империалистов и их региональных марионеток. В частности, Организация освобождения Палестины (ООП) уже давно привержена делу национального освобождения своих земель, захваченных Израилем. Чтобы повысить осведомленность о своем деле и оказать давление на израильтян, ООП начала несколько впечатляющих операций, которые израильтяне и их союзники осуждают как террористические. Однако советское правительство решило вместо этого назвать эти действия выражением подавленного народа и оказать давление на израильтян, чтобы они прекратили свою оккупацию. Поддержка ООП значительно укрепит наш имидж во всем арабском мире и поможет нам выглядеть жизнеспособным, неимпериалистическим союзником для таких арабских государств и организаций, как ООП."
 SOV_Beria_Struggle.1.d: "Ситуация достигла критической стадии после кончины товарища Сталина. До членов Политбюро уже дошли слухи о неприкрытых амбициях Никиты Хрущева. Он и его сторонники уже замышляют махинации, чтобы собрать союзников и захватить власть. В зависимости от действий, которые мы предпримем в ближайшие дни, мы, возможно, сможем остановить Хрущева. Посредством этих действий мы можем гарантировать, что стойкий Лаврентий Берия или преданный Георгий Маленков возьмут бразды правления в свои руки и спасут Советский Союз от фракционности и личных амбиций."
 SOV_Beria_Struggle.2.d: "Перед своей прискорбной кончиной товарищ Сталин подготовил план по устранению предателей и коррумпированных членов из партии. Сталин считал, что такие действия поднимут моральный дух советских людей и сохранят приверженность партии государству и своим обязанностям. Проведение этих чисток подтвердит позицию Лаврентия Берии и Георгия Маленкова и приведет к смещению Анастаса Микояна. Это также вызовет панику у Никиты Хрущева и Климента Ворошилова. Однако Маленков отмечает, что такие действия могут оттолкнуть потенциальных союзников и спровоцировать конфликт до того, как он или Берия будут готовы. Теперь вопрос в том, проводить ли чистку или отложить ее, пока ситуация не прояснится."
 SOV_Beria_Struggle.3.d: "Георгий Маленков и Лаврентий Берия ищут способы заручиться поддержкой старых большевистских элементов партии. Если бы Климента Ворошилова удалось взять на борт, они бы получили старого большевика и старшего офицера Красной Армии. Однако Ворошилов, похоже, не хочет поддерживать ни одного человека. Один из способов убедить его - собрать или создать какие-то документы и свидетелей, которые указывают на военные недостатки Ворошилова во время Зимней войны и Великой Отечественной войны. Тогда мы могли бы использовать это, чтобы заставить Ворошилова поддержать нас. Однако такие экстремальные усилия по принуждению союзника сопряжены с риском, и даже в этом случае Ворошилов может оказаться ненадежным, вместо этого, возможно, лучше просто найти другого сторонника жесткой линии, который поддержит нас."
 SOV_Beria_Struggle.4.d: "Нам удалось собрать достаточно документов и свидетелей, чтобы убедить Килмента Ворошилова в том, что мы располагаем средствами, чтобы разрушить его репутацию в партии и Красной Армии. Он настолько обеспокоен нашей информацией, что обещает полную поддержку в будущем. По сути, он стал нашим человеком, и теперь у нас есть поддержка высокопоставленного сторонника жесткой линии и влиятельного военного офицера."
 SOV_Beria_Struggle.41.d: "Генерал Жуков, похоже, не хочет заниматься политикой, но мы разработали план и обещаем ему в обмен на его поддержку мы осуществим реформу деполитизации армии. Это сильно ограничило бы влияние и власть политических комиссаров в Красной Армии. Генерал Жуков давно высказал мнение, что во время последней войны комиссары часто вмешивались в боеспособность и дисциплину войск. С этим обещанием мы надеемся, что генерал Жуков, наконец, начнет действовать и сплотит Красную Армию."
 SOV_Beria_Struggle.42.d: "Члены Политбюро начали открыто поддерживать Лазаря Кагановича, чтобы тот стал новым главой партии. Каганович, стойкий сталинист, был известным советником и партнером товарища Сталина. С его богатым опытом и преданностью революции мало кто может даже возразить, почему Каганович не должен возглавить партию. Многие сейчас изо всех сил пытаются найти позицию поблизости от Железного Лазаря."
 SOV_Beria_Struggle.5.d: "Новости из Берлина тревожные. Для подавления протестов местным советским войскам пришлось применить тяжелую силу, в том числе танки. Многие в Политбюро отмечают, что, несмотря на некоторые меры либерализации, предпринятые Лаврентием Берия, это привело к таким сценам, как бунты в Берлине. Чтобы оценить ситуацию в Берлине и определить, какие действия предпринять, товарищ Молотов вызвался немедленно отправиться в Берлин, уладить обстановку, а затем отправить отчет в Москву. Берия должен решить, одобрять поездку Молотова или нет. Если Берия обеспечил безопасность или нейтрализовал основных сторонников жесткой линии, такая поездка не представляла бы угрозы, но если сторонники жесткой линии останутся независимыми, Молотов может вернуться с осуждающим докладом о ситуации."
 SOV_Beria_Struggle.6.d: "Министр обороны Николай Булганин представляет серьезную угрозу как для Георгия Маленкова, так и для Лаврентия Берии. Во время войны он наладил тесные связи с Красной Армией и в кризис мог оказать военную поддержку амбициозному Хрущеву. Однако Берия и его агенты собрали изобличающие показания о Булганине и имеют достаточно улик, чтобы арестовать его по нескольким обвинениям. Арест Булганина поможет и Маленкову, и Берии, но Берия особенно выиграет от этого акта. Отказ от ареста Булганина сейчас - риск, но он может того стоить, поскольку такой поступок может спровоцировать непредвиденные последствия."
 SOV_Beria_Struggle.71.d: "После нейтрализации Николая Булганина Лаврентий Берия нацелился на Дмитрия Шепилова, редактора «Правды». Обладая влиянием в СМИ, Шепилов мог сплотиться вокруг Никиты Хрущева и стать серьезной угрозой. Используя проверенных агентов, Берия может публично устранить Шепилова. Это, несомненно, вселит страх в противников и расчистит ему и его союзникам путь к победе. Однако некоторые близкие офицеры опасаются, что такой поступок может иметь неприятные последствия и привести к непредвиденным последствиям. Теперь вопрос в том, отдавать приказ об атаке или нет."
 SOV_Beria_Struggle.81.d: "На заседании Политбюро Лаврентий Берия возглавил попытку сместить Никиту Хрущева с поста. Берия и его союзники смогли перехитрить Хрущева и его союзников. Это кульминация успешной кампании Берии и его союзников по предотвращению чрезмерно амбициозного захвата власти Хрущевым. Товарищ Берия теперь будет стремиться укрепить свою власть над государством и партией. Конечно, Маленков по-прежнему соруководитель, но Берия закрепил за собой место в дуумвирате. Их лидерство обязательно приведет к изменениям, таким как политика разрядки и сдвиг в сторону потребительских товаров."
 SOV_Beria_Struggle.82.d: "На заседании Политбюро Георгий Маленков возглавил попытку занять пост. Его соперник Никита Хрущев и его союзники не смогли остановить действия Маленкова и его сторонников. Это кульминация успешной кампании Маленкова и его союзников по предотвращению чрезмерно амбициозного захвата власти Хрущевым и подрыва всего социалистического государства. Маленков, долгое время считавшийся естественным преемником Сталина, теперь будет стремиться укрепить свою власть над государством и партией. Мы уже можем предположить, что Маленков проведет серьезный сдвиг в сторону потребительских товаров, но пока он опасается, что Берия стал слишком опасным."
 SOV_Beria_Struggle.9.d: "Карьера и махинации Берии прекратились после осуждения его Верховным судом Советского Союза. Берия вместе с шестью подсудимыми были расстреляны вскоре после вынесения приговора. Арест произошел несколькими месяцами ранее во время заседания президиума. Берия был осужден коллегами и вскоре арестован офицерами Красной Армии. Вскоре прибыли вооруженные силы, чтобы задержать его старших офицеров и обезопасить его разведывательный аппарат, чтобы предотвратить переворот или восстание сторонников Берии. В конце концов Берия был осужден за государственную измену, терроризм и контрреволюционную деятельность, кроме того, его обвинили в использовании своего положения для совершения сотен изнасилований и других действий. Его никто не будет оплакивать, особенно его многочисленные жертвы."
  
  #News Events 
 SOV_AFG.1.d: "После свержения Афганской монархии ситуация в Афганистане оставалась неопределенной. Несмотря на советскую поддержку, правительство президента Дауда не смогло инициировать реформы, и внешние силы организовывали воинственные группы и подрывные действия против правительства. Во время Саурской революции Президент Дауд и его семья были казнены, что привело к созданию более радикального социалистического правительства. Однако, несмотря на массированную советскую поддержку, новый режим боролся изо всех сил. Недавняя вспышка мятежей, особенно в окрестностях Герата, привела к тому, что некоторые элементы внутри правительства обратились за советской помощью. Советские войска и танки быстро продвигались от границы, а советские десантники заняли ключевые позиции в Кабуле. Советы настаивают на том, что они были приглашены правящим правительством НДПА, и как только стабильность будет восстановлена, они уйдут. Вторжение уже встречает международное осуждение, поскольку многие рассматривают советскую интервенцию и подавление афганских повстанцев как вопиющее нарушение международного права."
 Brezhnev_POL.1.d: "Советские войска пересекли польскую границу, чтобы обеспечить безопасность коммунистического режима в Польше и сокрушить Движение солидарности. Солидарность началась как забастовка верфи против руководства за произвольное увольнение рабочего, но вскоре переросла в новые забастовки и выражения гнева по поводу стагнации экономики. Польские коммунисты согласились признать Солидарность первым независимым Союзом в составе Советского блока, но эта группа продолжала подвергать сомнению политику правительства. Советский премьер Леонид Брежнев увидел в этом угрозу для коммунизма в Польше и, ссылаясь на доктрину Брежнева, санкционировал военные действия для прекращения солидарности и восстановления партийной дисциплины в Польше. Примечательно, что польские военные и высшие коммунистические лидеры, по слухам, расстроены и не сотрудничают со своим союзником по Варшавскому договору. Советы, по-видимому, не позволили им разрешить кризис внутри страны, и теперь они опасаются, что советские действия только усилят народный призыв к солидарности."
 SOV_Detente.1.d: "Советское правительство признает, что продолжение напряженности холодной войны привело к большим военным расходам и постоянному состоянию боевой готовности. Такая ситуация не помогает экономике и мешает государству обеспечивать своих граждан. Кроме того, сохранение агрессивной позиции только заставляет наших врагов и их союзников более прочно закрепиться друг с другом. Чтобы изменить это, Советский Союз решил начать кампанию по смягчению своей международной риторики, более открыто взаимодействовать с Соединенными Штатами и их союзниками и попытаться снизить глобальную напряженность. Это позволит Советскому Союзу больше сосредоточиться на своей экономике, улучшить свое международное положение и, показав свою более мягкую сторону, он сможет убедить некоторые нейтральные державы или даже некоторых американских союзников перестроиться. Советский Союз стремится установить период разрядки или расслабления отношений с Соединенными Штатами."
 SOV_VIN.20.d: "В новом дипломатическом наступлении, начатом в столицах крупнейших государств, вовлеченных во Вьетнам, и в Организации Объединенных Наций, Советский Союз призывает все стороны объединиться в мире. Советские дипломаты подчеркивают, что многолетнее насилие должно скоро прекратиться и что народ Вьетнама уже достаточно пострадал. Помимо призыва к Америке сократить свои боевые действия, советы также призывали Южновьетнамское правительство проявлять сдержанность. Однако, в отличие от предыдущих призывов к миру, советы призвали Северный Вьетнам помочь мирным усилиям, замедляя поток боевиков и гибко вступая в мирные переговоры. В частном порядке некоторые источники указывают на то, что советские дипломаты информировали Ханой о том, что неудача активных попыток договориться о мире чревата потерей советской помощи. Американцы, без сомнения, оценят эти усилия по достоинству."
 SOV_Mid_FP.1.d: "Советский Союз и Соединенные Штаты участвуют в переговорах по ограничению стратегических вооружений, чтобы обсудить пути ограничения и контроля гонки ядерных вооружений. Обе страны обладают огромным стратегическим ракетным потенциалом, но желание обновить системы вооружений и накопить боеголовки становится очень дорогим для обеих стран. Пока что, как представляется, переговоры могут увенчаться успехом в согласовании замораживания текущих уровней ракет и ограничении количества определенных пусковых систем. Такое соглашение было бы хорошо воспринято на международном уровне, и многие считают, что такое соглашение могло бы проложить путь для будущих переговоров, которые в конечном итоге могли бы привести мир к денуклеаризации. Хотя многие эксперты считают такие прогнозы чрезмерно амбициозными или далекими в будущее."
 ABMT.2.d: "Соединенные Штаты сообщили Советскому Союзу, что они отвергли предложенный договор о противоракетной обороне (ДРСМД). Это удар по советским усилиям по контролю за расходованием средств и новой гонке вооружений. Это решение свидетельствует о том, что американцы планируют расширить свои исследования в области ПРО и заинтересованы в том, чтобы найти способ изменить существующий в настоящее время стратегический паритет. Советские военные лидеры настаивают на том, что у них есть свои собственные исследования по ПРО и они не будут отставать от Соединенных Штатов. На самом деле, один из старших офицеров отметил, что про-это очень дорогостоящее предприятие, и даже если американцы будут продвигаться вперед, противнику будет нетрудно придумать способы подавления таких систем с минимальными усилиями или деньгами. Американцы отвергли эти обвинения и настаивают на том, что они не пойдут на компромисс с иностранными державами по исследованию технологий, которые могут спасти жизни американцев."
 ABMT.3.d: "Соединенные Штаты проинформировали Советский Союз о том, что они приняли предложенный договор о противоракетной обороне (ДРСМД). Это большой триумф для дипломатов обеих стран. Потенциал гонки вооружений по ПРО теперь предотвращен, и военным ведомствам обеих стран не придется тратить ресурсы на такие проекты. Большой страх внутри Кремля состоял в том, что гонка вооружений по ПРО может привести к тому, что Соединенные Штаты используют свои технологические преимущества для получения несправедливого преимущества. Такой сценарий был бы дестабилизирующим для мира во всем мире. Действительно, сообщения из Америки указывали на то, что одной из причин, по которой они приняли договор, является вера в то, что американский прорыв в технологии ПРО может спровоцировать Советский Союз нанести первый удар, прежде чем он потеряет свое преимущество. Независимо от его аргументации, и Соединенные Штаты, и Советский Союз счастливы и надеются, что этот договор знаменует собой потепление отношений между обеими странами."
 SALT_II.2.d: "Соединенные Штаты отвергли предложения последнего договора о переговорах по ограничению стратегических вооружений (Солт-II). Это соглашение позволило бы обеим странам впервые ограничить свои арсеналы, ограничить развитие новых ракетных технологий и сократить стартовые платформы. Отказ Соединенных Штатов озадачил некоторых экспертов, которые отмечают, что даже ограничения в договоре едва ли ослабили способность одного государства уничтожить другое. Говорят, что Советы пришли в ярость и назвали Соединенные Штаты поджигателями войны. Однако американский дипломат, участвовавший в процессе принятия решений, отметил, что это решение во многом связано с недавно обнаруженной моделью подрывных действий Советов, указывая на то, что им не хватает искренности в плане реального снижения риска глобальной ядерной войны."
 SALT_II.3.d: "Соединенные Штаты приняли предложения последнего договора о переговорах по ограничению стратегических вооружений (Солт-II). В рамках соглашения обе страны впервые ограничат свои арсеналы, ограничат развитие новых ракетных технологий и сократят стартовые платформы. Эксперты отмечают, что это соглашение едва ли подрывает способность любой из сторон нанести удар по другой стороне, но оно знаменует собой попытку остановить накопление ядерного оружия и разработку новых систем доставки. Это соглашение расценивается в обеих странах как шаг в правильном направлении, и мы надеемся, что оно приведет к потеплению отношений. Многие надеются, что такие переговоры будут продолжаться и в последующие годы, что в конечном итоге приведет к ядерному разоружению. Говорят, что обе страны удовлетворены этим соглашением и его последствиями."
 Sov_FP.125.d: "Советский Союз недавно изменил свою внешнюю политику в сторону Западной Европы. Он полностью смягчил свой тон. Вместо враждебности или изоляции она вовлекла эти государства в дружественные обмены, которые способствовали росту торговых, культурных и политических связей. Сейчас, когда отношения улучшаются и многие в Западной Европе с оптимизмом смотрят в будущее мирного сосуществования, советы считают, что настало время попросить эти государства прекратить свой отказ признать границы, установленные в Восточном блоке после Второй мировой войны. В частности, они уже давно противостоят восточногерманским и польским границам. Советы скажут Западной Европе, что это поддерживает напряженность на высоком уровне, и если они признают эти границы, это положит конец главному камню преткновения на пути к европейскому миру. Если советам удастся достичь соглашения о границах, это также повысит авторитет СССР среди его союзников по Варшавскому договору."
 Brezhnev.1.d: "Для Леонида Брежнева и его старших партнеров по Советскому правительству одной из величайших ошибок предыдущего правительства была его терпимость к множественному социализму. Это привело к тому, что майские коммунистические государства отошли от общепринятой практики марксизма-ленинизма и от советской модели. Кроме того, внешние силы, финансируемые капиталистическими интересами, часто пытаются свергнуть режимы, чтобы облегчить переход к капитализму. Для борьбы с этим Брежнев объявил новую доктрину, получившую название доктрины Брежнева. Советский Союз имеет право на военное вмешательство в любое социалистическое или коммунистическое государство, столкнувшееся с внутренними или внешними угрозами для сохранения социалистического общества. Национальный суверенитет не вытесняет интересы глобального социализма, и Советский Союз будет действовать в случае необходимости. Новая доктрина знаменует собой ослабление советской мощи. Расплывчатость языка означает, что советские союзники и враги только тогда начнут понимать ограниченность и практику этой доктрины."
 ROM_NORMALIZATION.4.d: "Вызывающее румынское неприятие доктрины Брежнева привело к экстренному заседанию Варшавского договора. После консультаций советский премьер Леонид Брежнев объявил, что для сохранения социализма в Румынии Варшавский договор начнет военные действия в Румынии. Он призвал румынские вооруженные силы отступить, а народ выйти и помочь своим братьям-социалистам в освобождении их страны от тирании Николае Чаушеску. Немедленная реакция румынского правительства не последовала. Однако несколько возмущенных европейских государств уже заявили, что намерены довести это вторжение до сведения Организации Объединенных Наций. Советская акция подтверждает свою приверженность доктрине Брежнева, которая обещает военные действия для поддержки любого социалистического государства, столкнувшегося с внутренними или внешними силами, угрожающими его существованию."
 ROM_NORMALIZATION.5.d: " Вызывающее румынское неприятие доктрины Брежнева привело к экстренному заседанию Варшавского договора. После консультаций советский премьер Леонид Брежнев объявил, что Советский Союз и его союзники будут продолжать оказывать дипломатическое давление на Румынию и продолжать призывать Румынию принять надлежащие марксистско-ленинские методы. Это заявление снизило региональную напряженность и опасения перед надвигающимся советским вторжением, и многие аналитики считают, что советское решение не применять военную силу показывает, что доктрина Брежнева имеет свои пределы. Неизвестно, решили ли советы не действовать из своих собственных интересов или же советское руководство опасалось, что военные действия против Румынии могут привести к дезертирству других союзников по Варшавскому договору, которые, возможно, не захотят участвовать в такой операции. Как бы то ни было, весь этот инцидент указывает на ограничение советской власти и влияния, которое некоторые интерпретируют как свидетельство того, что Советы теряют контроль над Варшавским договором и глобальным коммунизмом."
 SOV_Kashmir.1.d: "\nСоветский Союз признает, что Индия и Пакистан были одновременно жертвами капиталистической эксплуатации и империализма в условиях колониального господства. Чтобы помочь обеим странам, они недавно предложили провести переговоры с лидерами Индии и Пакистана по спорному региону Кашмир. Обе страны положительно отнеслись к этой идее. Когда переговоры действительно происходят, есть очень мало шансов на реальный прорыв, но их согласие принять советское посредничество демонстрирует растущую дипломатическую мощь Советского Союза. Советы в своем заявлении также добавили, что у них нет никакой другой повестки дня, кроме мира, и они надеются узнать об этом от обеих сторон. Советский Союз также заявил, что он является другом всего народа Индии и Пакистана и всегда будет действовать как глобальная сила добра."
 SOV_PAL.1.d: "\nСоветский Союз объявил, что полностью поддерживает решение о создании двух государств в качестве основы для установления мира на Ближнем Востоке. Советское правительство заявило, что любое другое решение было бы несправедливым и привело бы к бесконечному конфликту. Советы добавили, что такое решение должно привести к возвращению палестинцев в дома, из которых они были изгнаны. Израильское правительство просто заявило, что оно ожидает от Советского Союза уважения его суверенитета и безопасности. Представитель Палестины заявил, что он высоко ценит любое государство, которое признает право палестинцев на возвращение домой, хотя этот представитель и не касался идеи создания израильского государства. Советская позиция рассматривается как способ усилить определенное давление на израильтян, чтобы они были более гибкими в отношении будущих мирных соглашений."
  
  #News Events 
 Solzhenitsyn.1.d: "\nАлександр Солженицын недавно был удостоен Нобелевской премии по литературе. Известный автор является ярым критиком Советского Союза и его системы правления. Однако советское правительство при Леониде Брежневе объявило, что Солженицыну будет запрещено забирать приз из-за его антисоветских работ. Солженицын служил Советской Армии во Второй мировой войне, но после войны был отправлен в ГУЛАГ за критику Сталина в письме. При режиме Никиты Хрущева Солженицыну было разрешено опубликовать автобиографию о его пребывании в ГУЛАГе, отражающую разгар либерализации при Хрущеве. Однако его преемник Леонид Брежнев отменил эту либерализацию и использовал государственные органы и СМИ для критики Солженицына. Он также руководил консенсусом, и многие полагают, что другие высокопоставленные члены руководят жесткой позицией правительства по этому вопросу. Международное сообщество и интеллектуалы всего мира критикуют Москву за ее решение."
 DevSocialism.1.d: "Генеральный секретарь Леонид Брежнев и высокопоставленные члены партии обсуждают, что Советский Союз достиг состояния развитого социализма. По мнению Москвы, нынешняя экономическая структура и направление государства представляют собой наиболее развитое социалистическое общество в мире. Все другие коммунистические государства должны стремиться к достижению этого статуса и не должны отклоняться от курса. В коммунистическом мире этот аргумент рассматривается как критика в адрес других режимов, которые в последние годы отошли от советской экономической модели. Эти государства утверждают, что они должны отклониться, чтобы приспособить свое общество к социализму. Однако позиция Брежнева указывает на то, что Советский Союз стремится подтолкнуть все свои советские республики и коммунистический мир в целом к прекращению экономических отклонений и подражанию Советскому Союзу как центру глобального коммунистического экономического прогресса."
 Brezhnev_Constitution.1.d: "Советский Союз принял новую конституцию на недавно завершившейся седьмой сессии Верховного Совета Советского Союза. Новый документ подтверждает Советский Союз как развитое социалистическое государство с единым народом, не разделенным по национальному признаку или даже профессии. Конституция утверждает, что партия теперь представляет не только рабочих и крестьян, но и всех людей советского общества. Что еще более важно, новая конституция подрывает автономию Социалистических республик в составе Советского Союза и требует, чтобы все подтвердили советские законы и признали верховенство советского суверенитета. Советским гражданам также гарантированы основные права, но с ограничениями. Документ подтверждает многие ведущие идеи, пропагандируемые правящим режимом Леонида Брежнева, и многие уже называют этот документ брежневской конституцией."
 Brezhnev_Pol.100.d: "Недавние воспоминания советского лидера Леонида Брежнева о годах Великой Отечественной войны удостоены престижной Ленинской литературной премии. Хотя мемуары считаются плохо написанными и прославляющими его незначительный вклад на поле битвы, не многие в Советском Союзе удивляются. Брежнев давно проявляет страсть к церемониям и получению наград. Ему было вручено более ста медалей, и теперь ожидается, что на праздновании его дня рождения будут вручены новые медали и звания. Над многочисленными наградами и продвижением по службе, которые он дает себе, шутят по всей стране, и хотя Брежневу, по-видимому, рассказывали о том, что общественность развлекала его одержимость наградами, он отмахнулся от этого. Для Брежнева, если люди шутят над ним, значит, он им нравится."
  
 stalin_dead: "Сталин умер"
  
 SOV_TUR.10.d: "\nРоссийская империя, а позже и Советский Союз были стратегически заинтересованы в обеспечении контроля над Турецкими проливами. Контроль пролива враждебной державой грозит блокадой в Черном море советского торгового и военного флота. В 1936 году Конвенция Монтрё постановила, что проливы будут находиться под контролем Турции, и только корабли из стран, граничащих с Черным морем, могут использовать его. После Второй мировой войны Советы приводили примеры судоходства стран Оси из Германии и Италии во время войны как свидетельство необходимости переписывания Конвенции Монтрё. Эти требования уступок в отношении проливов наряду с территориальными требованиями к восточной Турции превратили спор в международный кризис. В конце концов Турция встала на сторону Соединенных Штатов, и конфликт утих, поскольку Советы приняли ситуацию, но указали на то, что они все еще считают, что Конвенцию Монтрё необходимо переписать. Возможно, в конечном итоге Турцию удастся убедить вернуться к нейтральной внешней политике или даже присоединить к советскому альянсу."
 TUR_SOV.2.d: "Коммунистическая партия Турции вместе с сочувствующими в ключевых точках государства начала попытку переворота. Многие турки отвергают отсутствие в стране прогресса в проведении более демократических реформ и рассматривают кризис вокруг Турецкого пролива как еще одно свидетельство того, что политика нейтралитета привела Турцию к потенциальной катастрофе. Коммунисты нашли большую поддержку в городских районах со стороны турок, которые видят, что правительство замедлило или не сумело осуществить политику модернизации основателя республики Мустафы Кемаля. Они хотят, чтобы символы реакционной жизни, религиозности и консерватизма были полностью искоренены. Новый турецкий режим заявил о своих надеждах на успех Турции в современном обществе. Говорят, что Соединенные Штаты ошеломлены этими событиями, в то время как появились слухи о том, что более консервативные, религиозные и кемалистские элементы в сельских районах могут выступить в качестве сопротивления новому коммунистическому правительству."
 TUR_SOV.3.d: "Кризис вокруг Турецких проливов резко обострился. После того, как турецкое правительство отказалось уступить советским требованиям пересмотреть Конвенцию Монтрё 1936 года или отказаться от своего суверенитета над проливами, Советский Союз начал вооруженное вторжение в Турцию. Хотя контроль над проливами является ключевой целью, у Советов также есть территориальные претензии к восточной Турции. Советское правительство объявило, что его солдаты объединят советские народы с их соотечественниками, которые были разделены границами, созданными реакционной Османской империей и сохраненными нынешним турецким режимом. Турецкое правительство призвало международную поддержку в ответ на \"неприкрытую агрессию\" Советского Союза и заявило, что турки должны сплотиться для этого дела. Турецкое правительство сослалось на то, как турки строили свою судьбу после Первой мировой войны, и заявило, что храбрость того времени должна вернуться к Турции, чтобы победить."
 Berlin_Blockade.2.d: "Военно-воздушные силы США пообещали, что смогут и будут поддерживать воздушные перевозки. Хотя воздушный мост оказался очень напряженным, будут внесены некоторые изменения для повышения эффективности. Генералу Уильяму Таннеру, который во время Второй мировой войны реформировал воздушный коридор между Индией и Китаем и увеличил количество воздушных перевозок на этом театре военных действий, было рекомендовано принять командование. Французы также пообещали построить новый аэродром в Берлине. Также обсуждаются планы по объединению с британскими королевскими военно-воздушными силами по повышению эффективности и координации. Пока воздушная линия продолжает функционировать, есть надежда, что контрблокада против управляемой Советским Союзом Германии заставит их и сдаться. Пока Западный Берлин страдает, контрблокада создала большую нагрузку на промышленные предприятия Восточной Германии. Ожидается, что в политическом плане жители Берлина продолжат поддерживать усилия по воздушным перевозкам. Граждане, которые следят за этим делом в союзных государствах, до сих пор поддерживали и, как ожидается, продолжат поддерживать эту политику."
 Berlin_Blockade.3.d: "\nСоединенные Штаты объявили об изъятии немецкой марки из обращения в Западном Берлине. Соединенные Штаты заявили, что их решение было принято не из-за давления со стороны Советов, а из-за желания помочь многострадальным людям Берлина, а не играть в политику. Среди ученых мужей и политиков на Западе были аплодисменты, которые поддерживают Соединенные Штаты за то, что они поставили на первое место жителей Берлина, и полагают, что первоначальная воздушная перевозка достигла своей цели, продемонстрировав советские угрозы, не ослабив решимости союзников. Однако были также оппозиция и инакомыслие со стороны других сторон, которые рассматривают решение Америки как капитуляцию перед коммунистическим шантажом. Советское правительство приветствовало то, что Соединенные Штаты \"одумались\", но еще не объявило, когда и будет ли снята блокада. Берлинцы оптимистично настроены в отношении того, что Советы снимут блокаду, и благодарны за помощь, оказываемую до сих пор западными союзниками."
 Berlin_Blockade.4.d: "Правительство Соединенных Штатов решило остановить воздушные перевозки Берлина и объявить Берлин открытым городом. Войскам западных союзников, оккупирующим город, было приказано отойти, а Советам было предложено снять блокаду, чтобы облегчить вывод войск. Берлин будет открытым городом. Реакция в США была довольно негативной, акция воспринималась как капитуляция перед советским шантажом. Многие спрашивают, откажутся ли США от Берлина, почему любая другая страна будет доверять Соединенным Штатам, если им угрожают Советы. Другие, однако, указали, что Берлин был вражеским городом совсем недавно, и рисковать более широкой войной из-за него не имеет смысла. Западный Берлин был несостоятельным и не стоил усилий. Советы заявили, что рассматривают свои варианты и, как ожидается, вскоре ответят. В Западном Берлине моральный дух рухнул, так как многие опасаются того, что произойдет после вывода войск союзников. Ощущение предательства ощутимо, и напряженность между войсками союзников в городе и местными жителями растет."
 Korean_War_Sov.1.d: "Корейская Народно-Демократическая Республика (КНДР) была создана под руководством известного, популярного антиимпериалистического лидера и коммуниста Ким Ир Сена в 1948 году. В 1950 году после получения одобрения Советского Союза и Китайской Народной Республики (КНР) Ким начал вторжение в Республику Корея (РК). Несмотря на первоначальный успех, активный военный ответ и развертывание США привели к жестокому нападению Соединенных Штатов на КНДР. Когда позиция Кима находится под угрозой, Советы осознают, что массированный военный ответ США может в конечном итоге привести к угрозе для КНР и отбрасыванию всех недавних коммунистических и советских успехов в Азии. Что еще более важно, такой сценарий оставит Советский Союз уязвимым на востоке. В результате этих соображений и увеличения военного вмешательства Соединенных Штатов Советский Союз решил вступить в войну на стороне КНДР. Советы помогут освободить Корею, а также защитят КНДР и КНР от империалистической агрессии."
  
 TUR_SOV.1.d: "После Второй мировой войны Советский Союз пытался пересмотреть Конвенцию Монтрё 1936 года. Соглашение 1936 года позволяло Турции контролировать турецкие проливы и предусматривало, что только корабли из стран, граничащих с Черным морем, могут использовать проливы. Однако после войны Советы начали выдвигать территориальные требования к восточной Турции и выразили неудовольствие по поводу управления проливами. Недавно в МИД Турции поступила нота советского правительства. В записке требовалось переписать соглашение 1936 года и от Турции отказаться от контроля над проливами; возможно, Турции следует принять советские предложения о совместном управлении проливами. Причиной изменения договора были случаи, когда немецкие и итальянские корабли пересекали проливы во время войны, что, по мнению Советов, показало, что Турция неспособна контролировать проливы. Турецкое правительство могло бы отреагировать на ноту, приняв советские требования о контроле режима над проливами, но это грозит коммунистическим проникновением и советской оккупацией ключевых мест. Или он может отклонить советское письмо как нападение на суверенитет Турции. Конечно, это может привести к эскалации со стороны Советов, но поскольку Соединенные Штаты заинтересованы в помощи, это может быть идеальным союзником для защиты Турции от советских махинаций."
 Berlin_Blockade.1.d: "Поскольку Советский Союз ввел блокаду Западного Берлина после гнева из-за решения западных союзников ввести новую немецкую валюту, немецкую марку. Соединенные Штаты и Соединенное Королевство решили в ответ ввести собственную блокаду управляемой Советским Союзом Германии и запустить воздушный транспорт для снабжения жителей Берлина. Единственный способ, которым Советы могли заблокировать воздух, - это сбивать самолеты, но Советы не осмеливались сделать подобное. Несмотря на расходы и трудности с экипажами и самолетами, воздушные перевозки продолжаются, но и блокада продолжается. Американское руководство встречается, чтобы рассмотреть свои варианты для решения вопроса, поскольку Советы, похоже, не хотят ослаблять блокаду. Одна из тем встречи - обсуждения о продолжении воздушных перевозок, несмотря на то, что воздушные перевозки и так перегружены и экипажи испытывают перегрузку как и самолеты. Накоплен ценный опыт, и определенные изменения на земле могут помочь увеличить доставки и снизить проблемы блокады. Второй вариант - уступить советским требованиям и отозвать новую валюту. Это принесет берлинцам большое облегчение, но приведет к потере репутации. Наконец, город можно было бы объявить свободным городом. Это оставило бы давление на Советский Союз, чтобы он прекратил блокаду, чтобы позволить союзным войскам выйти."
 Stalin_Purge.2.d: "Лаврентий Берия, бывший глава НКВД, оказался для Иосифа Сталина самым опасным человеком. Он курировал советскую ядерную программу, Ленинградское дело и роспуск Еврейского антифашистского комитета. Однако у Сталина все больше росла паранойя по поводу Берии, который укреплял свою власть, выполняя приказы Сталина. Сталин стремился убрать Берию и сосредоточился на Коммунистической партии Грузии, где у Берии была самая сильная опора. Против ведущих грузинских партийных лидеров был выдвинут ряд сфабрикованных обвинений, в частности, мегрелы (грузинская этническая группа), входящие в партию, в заговоре с грузинскими изгнанниками и Соединенными Штатами с целью вывести Грузию из Советского Союза. В результате арестов и судебных процессов в 1951 и 1952 годах сторонники Берии в Грузинской партии, в том числе первый секретарь Кандид Чарквиани, были ликвидированы. Несмотря на то, что чистка была нацелена на мегрельцев, на самом деле она была нацелена на некоторых грузин, не относящихся к мегрелам, например, Чаркивиани. В конечном итоге чистка была больше сосредоточена на ограничении влияния и власти Берии. Несмотря на атаку Сталина на опору власти, Берия по-прежнему сохранял свою позицию в Политбюро.."
 Stalin_Jew.1.d: "Еврейский антифашистский комитет (ЕАК) сформирован в конце 1941 года под руководством Соломона Микоэлса. Он действовал с целью распространения просоветской пропаганды за рубежом и подчеркивания отсутствия антисемитизма в Советском Союзе. Члены комитета много ездили в Соединенные Штаты, Соединенное Королевство, Мексику и Канаду, чтобы заручиться финансовой и материальной поддержкой СССР. Комитет добился огромных успехов в своих усилиях, частично благодаря установлению тесных связей с другими национальными и международными еврейскими организациями. Он повысил осведомленность о советском деле, а также выделил миллионы долларов на поддержку военных действий. После войны ЕАК работал с американскими еврейскими организациями над публикацией информации о Холокосте и участии евреев в войне. Это раздражало Москву, которая рассматривала эти усилия как подрыв советских утверждений, что война была всеобщей борьбой для всех Советов. Вдобавок эти тесные контакты с американскими организациями вызвали у Сталина особые подозрения в отношении деятельности ЕАК. Соломон Микоэлс, лидер ЕАК, был убит, а ведущие члены комитета арестованы в январе 1948 года по обвинению в буржуазном национализме, попытке создать еврейское государство в Крыму и работе в интересах США."
 Stalin_Purge.1.d: "Иосиф Сталин долгое время с подозрением относился к Ленинграду и его советскому руководству. Его давний соперник Григорий Зиовьев имел там опору власти в 1920-е годы, и Сталин чувствовал, что у ленинградских советов есть желание перенести столицу и политический центр обратно в старую имперскую столицу. После Второй мировой войны это подозрение переросло в паранойю. Блокада Ленинграда сделала руководителей города национальными героями и во время блокады позволила им действовать независимо от директив Сталина. После войны ленинградские лидеры получили больше властных позиций в центральном правительстве в Москве, получив максимальную власть, которую оно имело с момента прихода к власти Сталина. Опасаясь этой новой основы политической власти и появления стольких молодых политиков, Сталин решил действовать. В январе 1949 года ведущие руководители Ленинграда, такие как Алексей Кузнецов и Николай Вознесенский, организовали торговую ярмарку. Сталин приказал СМИ и силам безопасности атаковать это событие и предъявил своим ленинградским конкурентам серию сфабрикованных обвинений в хищении и коррупции. В январе 1950 г. судебные процессы завершились, и шесть ведущих руководителей Ленинграда были приговорены к смертной казни. Ленинградское дело позволило Сталину устранить предполагаемую опору власти соперника."
  
 sov.1.t: "Помощь КНР"
 sov.1.d: "КНР обратилась к нам за помощью в их действиях. Будем ли мы вмешаться и помогать им?"
 sov.1.a: "Да, конечно!"
 sov.1.b: "Нет, а зачем нам?"
 sov.2.t: "[From.GetName] хочет присоединиться к Варшавскому договору"
 sov.2.d: "[From.GetName] просили нас присоединиться к Варшавскому договору, принимаем ли мы их?"
 sov.2.a: "Да!"
 sov.2.b: "Нет!"
 sov.3.t: "Объединение Австрии"
 sov.3.d: "Народ Австрии снова хочет быть свободной и независимой страной. Он мог служить буферным государством между востоком и западом. Мы позволим этому свершиться?"
 sov.3.a: "Да, конечно!"
 sov.3.b: "Нет, мы продолжим оккупацию."
 sov.4.t: "Принять КНР в ООН"
 sov.4.d: "Китайская Народная Республика хочет быть признанной в ООН. Гоминьдан стал очень слабым после гражданской войны, поэтому сейчас мы должны поддерживать более крупный и сильный Китай – Китайскую Народную Республику."
 sov.4.a: "Да, конечно!"
 sov.4.b: "Нет, они останутся в стороне."
 newssovever.1.d: "Никита Хрущев решил уйти с поста генерального секретаря из-за преклонного возраста и плохого состояния здоровья. Никита Хрущев руководил Советским Союзом в течение десяти лет и начал космическую программу СССР, возглавил Берлинский вопрос и, конечно, поддержал Кубу. Никита Хрущев сказал, что он желает, чтобы СССР жил, и что Леонид Брежнев отлично справится с этой задачей в качестве генерального секретаря. Другие страны мира были удивлены этим шагом. По какому пути пойдет теперь СССР при Леониде Брежневе? Мир или война?"
 newssovever.2.d: "Шокирующие новости пришли из СССР |:| Председатель Хрущев заявил, что Леонид Брежнев пытался свергнуть его. Хрущев заявил, что его предали товарищи, и что это прямая атака на ценности революции. Брежнев парировал это, заявив, что Хрущев непригоден для своего поста из-за того, что он почти ввергнул мир в Третью Мировую Войну из-за Кубинского ракетного кризиса. Оба собрали своих сторонников, призывая людей отстаивать Конституцию Союза, защищая законного лидера. В Союзе борьба за власть приобрела ожесточенный характер."
 newssovever.3.d: "Слухи о перевороте распространились по СССР очень быстро, и известно, что они были распространены только Никитой Хрущевым или кем-то предавшим в «Комитете». Брежнев и «Комитет» теперь известны всему миру, и нам нужно что-то делать. Мы смотрим на очень темное время для СССР. Обе стороны призвали к поддержке, отстаивать справедливость и бороться с другой стороной. На чьей стороне мы выступаем в борьбе за пост? Хрущев или Брежнев?"
 every1.9.d: "Мексиканцы предоставили Никите Хрущеву политическое убежище для проживания в секретном месте в Мексике. Мексиканцы наверняка заключили сделку с Хрущевым, чтобы он имел защиту, чтобы тот передал им советские секреты и планы о том, как мы действуем. Тогда американцы, вероятно, получат секреты и планы от мексиканского правительства в какой-нибудь сделке. Это нанесет нам большой удар, и нам нужен план, как с этим бороться."
 newssovever.6.d: "Никите Хрущеву было предоставлено убежище в Мексике, и ему было разрешено остаться в секретном месте. Хрущев действительно сначала обратился к американцам за убежищем, но они ответили отказом из-за плохих отношений и еще большей напряженности, которую это принесет. Однако мексиканское правительство приняло его, потому что Мексика была известна как убежище для бегства от врагов и потому что Америка могла бы получить некоторую помощь от своего друга на юге. Леонид Брежнев сказал, что СССР больше никогда не допустит Хрущева, и что ему лучше быть осторожным со своей жизнью сейчас. Никита Хрущев сейчас находится в секретном месте, чтобы СССР не посылал туда агентов КГБ, чтобы покончить с его жизнью. Мексиканцы называют это прекрасной возможностью завязать дружбу с американцами и начать новую эру. Что же теперь будет с Хрущевым и СССР? Никита Хрущев сейчас находится в секретном месте, чтобы СССР не посылал туда агентов КГБ, чтобы покончить с его жизнью. Мексиканцы называют это большим ударом по СССР и началом великого союзника. Что же теперь будет с Хрущевым и СССР?"
 newssovever.5.d: "Никите Хрущеву было предоставлено убежище в США, и ему было разрешено остаться в секретном месте. Американцы сказали, что они хотели бы иметь человека, который знает СССР изнутри и снаружи и как он работает. Они сказали, что секреты Хрущева и разведданные помогут США в их усилиях, поскольку теперь у них обоих есть общий враг. Однако СССР возмущен тем, что они приняли предателя в свою страну, и только показывает, что США несправедливы к правосудию. Леон Брежнев сказал, что СССР больше никогда не допустит Хрущева, и что ему лучше быть осторожным со своей жизнью сейчас. Никита Хрущев сейчас находится в секретном месте, чтобы СССР не посылал туда агентов КГБ, чтобы покончить с его жизнью. Американцы называют это большим ударом по СССР и началом великого союзника. Что же теперь будет с Хрущевым и СССР? "
 every1.6.d: "Никита Хрущев приземлился в Вашингтоне, округ Колумбия, и теперь просит политического убежища из-за того, что он был отстранен от должности премьера в результате переворота Леонида Брежнева и его комитета. Если то, что он сказал, Правда и мы его удержим, то новый СССР нанесет ущерб нашим отношениям и сделает напряженность высокой. Если мы откажем ему в убежище, тогда ему придется уехать куда-нибудь еще. Мексика была бы подходящим местом для него там, если он нам не нужен. Однако он будет играть большую роль в нашем правительстве, и его дезертирство поможет нам понять советские коммуникации, размещение войск и то, как работает СССР внутри и снаружи. Он был бы очень ценным приобретением."
 every1.7.d: "Никита Хрущев бежал от Брежнева после государственного переворота в Москве и бежал в США за политическим убежищем. Однако американцы не хотели его видеть, потому что, если они его возьмут, возникнет более высокая напряженность между США и СССР, а также потому, что американо-советские отношения будут серьезно затронуты. Американцы послали его к нам, чтобы спросить, возьмут ли они Хрущева. Мексика всегда была настоящим убежищем для людей, которые бегут из других стран. Только более 30 лет назад у нас был Лев Троцкий в Мехико, который пытался избежать встречи со Сталиным и СССР. Хрущев также помог бы нам как политический деятель, и кто знает, понравимся ли мы американцам, если мы позволим ему передавать им советские секреты? Что же нам теперь делать?"
 sov_death.3.d: "Yuri Vladimirovich Andropov has died in his room at Central Clinical Hospital in western Moscow at the age of 69. After suffering a kidney failure in August 1983, he moved permanently to the hospital where he spent the rest of his life. According to the post mortem medical report, Andropov suffered from several medical conditions|:| interstitial nephritis, nephrosclerosis, residual hypertension and diabetes, which were worsened by chronic kidney deficiency. We have already decided on a four-day mourning period. But now, we must also elect his successor. Our most likely candidate is Konstantin Chernenko, a man similar to Andropov. He however is already rather sick; suffering from emphysema and right-sided heart failure. Last year, he had been absent from his duties for three months due to bronchitis, pleurisy and pneumonia. Andropov had however requested Mikhail Gorbachev to succeed him, but many are afraid of his reformistic ideals."
 sov_death.4.d: "After the death of Brezhnev and his successor Yuri Andropov, Chernenko was elected General Secretary in February 1984 and made Chairman of the Presidium of the Supreme Soviet in April 1984. Due to his rapidly failing health, he was often unable to fulfill his official duties. He died in March 1985 after leading the country for only 13 months.\nChernenko became the third Soviet leader to die in less than three years. Upon being informed in the middle of the night of his death, U.S. President [USA.GetLeader] is reported to have remarked, \"How am I supposed to get anyplace with the Russians if they keep dying on me?\"" #NT!
 sov_maki.1.d: "Коммунистическая партия Израиля, или маки, обратилась к нам сегодня с просьбой о нашей поддержке в отношении "оказания давления" на их более умеренных членов коалиции-партию МАПАМ. Хотя это и рискованно, но в случае успеха мы могли бы получить верного союзника на Ближнем Востоке."
 sov.102.d: "В 1947 году товарищ Сталин лично санкционировал строительство 7 небоскребов в Москве. Названные в народе «Семь сестер», они были предназначены для того, чтобы показать Западу нашу промышленную мощь и доблесть, а также произвести впечатление на всех посетителей нашей прекрасной столицы. Самая выдающаяся из них - Славная башня МГУ - завершена сегодня под пристальным вниманием главного архитектора Льва Руднева. Руднев уже построил такие величественные здания, как Фрунзенская военная академия и Маршальские апартаменты, завоевавшие уважение и доверие партии и самого Сталина. Башня расположена в самом центре университетского городка и возвышается как над ним, так и над горизонтом Москвы. На его фундамент было потрачено более 400000 тонн стали и 130000 тонн бетона, а его высота 240 метров, это самое большое здание в Европе и седьмое место в мире. Это действительно большой шаг вперед для нашего великого союза, и хотя товарища Сталина, к сожалению, сегодня нет с нами, чтобы засвидетельствовать его открытие, мы знаем, что он будет гордиться этим."
 chernobyl.1.d: "В 01:23:04, после 10-часовой задержки, началась проверка безопасности с новой, неподготовленной командой. Во время запланированного снижения мощности реактора при подготовке к электрическому испытанию мощность неожиданно упала до почти нулевого уровня. Операторам удалось лишь частично восстановить заданную тестовую мощность, что поставило реактор в потенциально нестабильное состояние. В 01:23:40 по данным централизованной системы управления СКАЛА была нажата кнопка АЗ-5 системы аварийной защиты реактора. При нажатии кнопки АЗ-5 начиналась установка регулирующих стержней в активную зону реактора. Когда регулирующие стержни были опущены, мощность реактора подскочила примерно до 30 000 МВт тепловой мощности, что в 10 раз превышает нормальную рабочую мощность - последнее показание, указанное на измерителе мощности на панели управления. После этого произошло несколько взрывов, в результате которых реактор распахнулся настежь, из-за чего графит попал в окружающую среду..."
  
  
 soviet.4.d: "СССР присоединил Карело-Финскую ССР к Российской Федеративной ССР. Это первый раз, когда одна советская республика была присоединена к другой. СССР заявил, что после расширения финляндско-советских отношений они думают, что пора аннексировать Карело-Финскую ССР. Однако есть несколько человек, которые недовольны этим. Финское население в бывшей ССР опасалось усиления советского контроля и меньшей автономии для него. Советы заявили, что финнам не следует беспокоиться. Советы праздновали присоединение областей к РСФСР в Москве."
 soviet.3.d: "После десятилетия Второй мировой войны и улучшения отношений с Финляндией участники съезда заявили, что Карело-Финской ССР пора присоединиться к СССР. Нам также нужна земля для границы с Норвегией и Швецией на случай, если нам понадобится начать вторжение или обороняться. Однако некоторые финские политические лидеры в конгрессе хотели сохранить ССР для финнов в этом районе. Что нам делать? Принимаем мы финляндизацию или нет?"
 soviet.2.d: "СССР разрешил Российской Федеративной ССР подарить Крым Украинской ССР как их дружбу на протяжении более 300 лет. Украина присоединилась к Российскому Царству 300 лет назад, и РСФСР хотела выразить свою признательность за их историческую дружбу. Украинская ССР сказала, что благодарят РСФСР за этот подарок дружбы."
 soviet.1.d: "По мере того, как мы приближаемся к 300-летию присоединения Украины к Российскому царству, все больше и больше людей заговорили о том, что мы будем делать для Украинской ССР в честь годовщины. Некоторые политические лидеры съезда заговорили о передаче Крыма из состава Российской Федеративной ССР в состав Украинской ССР. Мы всегда были очень близки с украинцами, и они говорили, что эта земля принадлежит им. Это может быть прекрасным подарком за их дружбу с нами на протяжении более 300 лет. Однако земля очень ценна и имеет для нас много портов и ресурсов."
 news.1500.t: "С глубокой скорбью 5 марта в 21:50 после тяжелой болезни скончался секретарь ЦК Коммунистической партии, Председатель Совета Министров Иосиф Виссарионович Сталин. Сердце соратника и последователя гениального дела Ленина, мудрого вождя и учителя Коммунистической партии и советского народа перестало биться. Иосиф Сталин был трудолюбивым и помогал своим товарищам. Его яркое видение СССР помогло сформировать множество идеалов и ценностей, которые у нас есть сегодня. Он продолжил наследие Ленина. Его будет не хватать. Созывается Совет и он пусть решает, кто будет преемником великого Вождя. Кто бы это ни был, им придется последовать одному из величайших наследий СССР."
 swf.7.d: "Сегодня мы все собрались в Варшаве, Польша, чтобы подтвердить наше стремление к созданию коллективного альянса, основанного на европейской безопасности, независимо от наших социальных или политических систем. С годами «холодная война» ухудшилась, и проводится все больше новых границ. Теперь, после перевооружения ГДР, нам нужно убедиться, что мы готовы к полномасштабному вооруженному конфликту, разразившемуся в немецком регионе или в другом месте. Коминформ был великим альянсом, но нам нужно усилить Восток против Запада. Варшавский договор должен быть создан для защиты всех членов, независимо от их социальных или политических систем. Мы объединимся против врагов Варшавского договора. Коминформ мертв! Да здравствует Варшавский договор!"
 swf.9.d: "После конференции в Варшаве Польша, Восточный блок и другие советские союзники подписали договор о национальной обороне и союзе. Они распустили Коминформ и сформировали Варшавский договор взамен старого альянса. Советы заявили, что из-за более высокого напряжения необходим более сильный союз для защиты стран на Востоке от Запада. НАТО сделало заявление, в котором говорится, что все равно будет бороться с коммунистической угрозой, несмотря ни на что, и что это ничего не меняет. Напряженность в Европе по-прежнему высока, и теперь она обострилась из-за этого «нового» военного союза."
 TUR_SOV.11.d: "Похоже, что после занятия Босфора Советским Союзом, оружие Сталина нацелилось на нас. Сегодня мы получили беспокойную телеграмму о том, что Советский Союз намеревается включить Югославию в восточный блок мирным путем. Они требуют, чтобы мы позволили советским войскам размещаться в нашей стране, открыли порты для стоянки ВМФ СССР, а Советские ВВС могли пользоваться нашими аэродромами. Они пообещали, что если мы примем условия, то маршал Тито, все правительство Югославии и военные сохранят свои позиции. Сталин заявил, что желает поправить отношения с народом Югославии и дать нам возможность вновь разделить и печали, и радости. Однако, если мы откажемся, Сталин пообещал, что Красная Армия до конца недели войдет в Белград."
 TUR_SOV.12.d: "После нашего успешного вторжения в Югославию, которая осмелилась игнорировать наш авторитет и социалистическое братство в Восточной Европе, мы должны принять решение по ней. Товарищ Сталин объявил о конференции со всеми соседними странами Югославии, чтобы обсудить, как бывшая югославская территория должна быть разделена и подумать о будущих шагах, будь то сохранение единой Югославии или передача части территорий Албании и Греции."
 TUR_SOV.13.d: "Поскольку Югославия отказалась следовать нашему социалистическому братству в Восточной Европе, товарищ Сталин и Министерство внешнеэкономических связей решили навязать полное эмбарго на Югославию, пытаясь убедить их отказаться от ревизионизма. Это будет включать полную остановку любого советского импорта каких-либо товаров, включая продовольствие и технологическое оборудование, а также экономическую помощь. Это будет служить предупреждением любыми другими коммунистическими правительствам, которые осмелятся прогнуться под империалистические западные силы, пообещавших им золотые горы."
 TUR_SOV.14.d: "В городе Хабаровске на российском Дальнем Востоке проводится суд над военными преступлениями, против 12 членов японской квантунской армии, обвиняемых в изготовлении и использовании биологического оружия во время Великой Отечественной войны. Все обвиняемые были признаны виновными и были приговорены к от 2 до 25 лет в трудовых лагерях. На скамье подсудимых оказались генерал Отозо Ямада, командир квантунской армии, а также несколько генералов, отвечающих за печально известный отряд 731 и другие медицинские отделения. Их преступления вызвали смерть тысяч невынных людей."
 SOV_Troika.1.d: "Ранние отчеты от "Радио Москва" указывают, что Лавренний Берия, министр внутренних дел, начальник НКВД и первый заместитель председателя Совета Министров был арестован в Кремле при поддержке маршала Георгия Жукова и других вооруженных офицеров. В настоящее время Берия содержится в штаб-квартире Московского военного округа и лояльные ему силы безопасности заблокированы отдельными группами кантемировской танковой дивизии и таманской моторизированной дивизией. Считается, что Берия была арестована за госизмену, терроризм и сексуальное насилие, являющиеся серьезными правонарушениями. Однако, существует мнение, что Берия был арестован в ходе борьбы других членов Тройки получить власть."
 SOV_Troika.2.d: "Внутренние доклады указывают, что Никита Хрущев, начальник отделения в Московской коммунистической партии и член Тройки, был арестован в Кремлевском комплексе членами партии, лояльных Лаврентию Берии, в том числе Всеволоду Меркулову, Богдану Кобулову и Георгию Маленкову. Неизвестно, где содержится Хрущев, но он точно находится в Москве. Считается, что Хрущев был арестован за измену и контрреволюционную деятельность, хотя некоторые западные наблюдатели видят это, как захват власти Берией и зачисткой неудобных товарищей из правящей тройки."
 SOV_Troika.3.d: "Был казнен генерал Виктор Абакумов, министр государственной безопасности. Назначеный в 1946 году товарищем Сталиным, Абакумова лишился должности, когда он был арестован в 1951 году за непроффесионализм в деле против евреев. После заговора врачей Абакумов остался в тюрьме и не вышел даже после того, как Берия и его заместитель, Михаил Рюмин, были казнены. В декабре 1954 года Абакумов был обвинен в фальсификации ленинградского дела, сталинистского заговора против членов КПСС, формировавших антисоветские организации и был расстрелян с тремя его замами из МГБ."
 SOV_Troika.4.d: "Сегодня в Москве судили за измену и контрреволюционную деятельность 14 высокопоставленных чиновников коммунистической партии. В их числе были Вячеслав Молотов, первый заместитель председателя Совета Министров; Анастас Микоян, министр внешней торговли; Маршалы Климент Ворошилов и Семен Буденный; Арсений Зверев, министр финансов; многочисленные первые секретари партии на армянской, грузинской и финской ССР, Московских городов, региональных комитетов и центральной ревизионной комиссии. Кроме того, Петр Поспелов, главный редактор Правды, был оправдан. Все 14 чиновников были приговорены к смерти и расстреляны."
 SOV_Troika.5.d: "После недавнего судебного разбирательства были осуждены еще два высокопоставленных чиновника, Андрей Громыко и Пантелеймон Пономаренко. Громыко, бывший постоянный представитель СССР в ООН, был обвинен в шпионаже в пользу западных держав, благодаря его отношениям с высокопоставленными дипломатами и послом в Соединенном Королевстве. Пономаренко, бывший министр закупок и первый секретарь казахстанской коммунистической партии, был обвинен в коррупции и финансовых злоупотреблениях, после проведения проверок и обнаружения строящейся виллы и большой суммы наличных. Оба были расстреляны в подмосковье. Международное сообщество, а особенно западные союзники, сильно потрясены смертью Громыко, любимого друга противника в ООН."
 SOV_Troika.6.d: "В конце концов даже преподложтельный преемник Сталина не смог избежать обвинений. Георгий Маленков, председатель Совета Министров и секретарь КПСС, был обвинен в прелюбодеянии, коррупционном и сексуальном хищничестве в деле, известном как "дело Голубцовой". Маленков встретил Валерию Голубцову, дочь государственного советника Российской империи в Нижнем Новгороде в 1920 году. С тех пор они жили вместе, но никогда не регистрировали официально их союз и, таким образом, технически не были женаты. Находясь в таком высоком положении в правительстве, такого рода поведение является недопустимым и Маленков был осужден и признан виновным. Какое наказание он должен понести?"
 SOV_Troika.7.d: "Ранее на этой неделе советское правительство объявило, что официальная передача власти от нынешнего генерального секретаря Союза Советских Социалистических Республик Иосифа Сталина к действующему Лэзару Кагановичу произойдет на XX съезде КПСС в Москве. Лазарь Каганович станет новым генеральным секретарём. Подготовка к мероприятию уже началась, ожидается событие, сопоставимое с военным парадом на красной площади в 45м, а количество участников и зрителей станет самым большим в истории Советского Союза. Все это стало неожиданностью для западных наблюдателей, которые ожидали, что Сталин не отпустит должность генерального секретаря до самой своей смерти. После пережитого инсульта в 1953 году его состояние здоровья сильно ухудшилось и многие полагают, что смерть настигнет его уже совсем скоро."
 Stalin.Retirement.d: "Шокирующая новость прибыла сегодня из Кремля в Москве. Сообщается, что Иосиф Виссарионович Сталин, генеральный секретарь Коммунистической Партии Советского Союза с 1922 года, объявил о своем выходе на пенсию. Получив власть в стране после смерти основателя СССР Владимира Ильича Ленина в 1922 году, идея Сталина о социализме в отдельно взятой стране в сочетании с пятилетними планами индустриализации создала могущественную коммунистическую страну с централизованной плановой экономикой. За время его правления коммунистические движения возникали по всему миру и Советский Союз теперь считается сверхдержавой, сопоставимой с западными Союзниками. Мировые лидеры выразили свой шок, хотя частные беседы в Белом доме и на Даунинг-стрит - это смесь облегчения и беспокойства."
 CPSU20.1.d: "Двадцатый съезд КПСС закончился по прошествию 10 дней. Это первый съезд, проводимый новым секретарем Лазарем Кагановичем, выбранным преемником Иосифа Сталина. Это его первое публичное появление в новом качестве. Каганович предложил на съезде укрепить анти-ревизионистские и анти-реформистские позиции партии и поблагодарил товарища Сталина за его заслуги перед народами Советского Союза. Затем он высказался по поводу прошедших внутрипартийных чисток, в ходе которых были осуждены бывшие выдающиеся должностные лица, такие как Никита Хрущев, Вячеслав Молотов и другие, осмелившиеся посягнуть на изменение социалистического образа жизни. Эта речь закончилась на рассказе о победе над реформистским крылом партии, стремившейся протолкнуть рыночные элементы в стране. Мир разделили смешанные эмоции от этого выступления. Запад выразил глубокую озабоченность авторитарным характером советской власти, а в Восточном блоке поддержали решительность нового лидера и несменность принципов."
 CPSU20.2.d: "Двадцатый съезд КПСС закончился по прошествию 10 дней. Это первый съезд, проводимый под новым совместным руководством Георгия Маленкова и Лаврентия Берии, взявших власть во внутрипартийной борьше большой Тройки после смерти товарища Сталина. На сцене они поочередно говорили о необходимости устойчивого руководства в условиях империализма и ревизионизма, осуждали оппортунистов, таких как Никита Хрущев и Николай Булганин, которые осмелились выступать против них. Реакция партии на их речь была смешанной. Как и ортодоксы, так и реформисты, выразили смесь поддержки и враждебности. На международном уровне реакция аналогична. Они выражают осторожную надежду на будущее СССР."
  
  #Kaganovich 
 SOV_KAG.1.desc: "Today, my dear students, we continue our class about our esteemed Comrade Stalin. During our last class, we discussed the industrialization of the Soviet Union in the 1930s, and today we will focus on Comrade Stalin's excellent leadership, which saved us from the fascist threat of the Third Reich...These types of lectures were commonplace throughout the Soviet Union as the next generation studied hard to become productive members of the socialist society. The Soviet teachers had a challenging task in understanding the curriculum to properly present the life and legacy of Joseph Stalin, an incredibly complex leader." #NT!
 SOV_KAG.2.desc: "Komsomolskaya Pravda published another story today about the founding fathers of the Soviet Union. The front page contains a summary of the life of Vladimir Illyich Lenin. Starting with his humble beginnings and his gradual turn to the revolutionary side after witnessing his brother's death by the Tsar's troops. During the Great War Lenin was exiled in Switzerland but not even a vast distance from his motherland could stop him from trying to bring power to the people. He wrote letters and pamphlets that were later distributed on Petrograd's streets. Later renamed Leningrad in his honor. After the revolution, his circle of associates grew, including his successor Joseph Stalin. But before Lenin could achieve his dreams of bringing the glory of socialism to the world he suffered a stroke. That did not stop him from fulfilling his duties until his untimely passing. It paid off, however, as the movement he started and the Union he created were strong enough to resist the fascist threat and safeguard the revolution for decades to come!" #NT!
 SOV_KAG.3.desc: "" #NT!
 SOV_KAG.4.desc: "The alliance of the Socialist countries headed by the Soviet Union known as the Komintern has issued a public statement about its reformation that will take place over the next several months. Aside from internal developments, the Komintern should now focus on resource extraction in order to boost the industry of the East to successfully export the revolution across the world by any means necessary. It is quite clear what is meant by this wording. The Cold War is heating up." #NT!
 SOV_KAG.5.desc: "" #NT!
 SOV_KAG.6.desc: "" #NT!
 SOV_KAG.7.desc: "The Soviet Union entered a period of mourning today as the saddest news struck the nation. Its leader, the General Secretary of the Communist Party Joseph Vissarionovich Stalin has passed away. From the scarce reports coming out of the Kremlin, it seems Joseph Stalin passed away peacefully in his Kuntsevo dacha near Moscow. The preparations are underway for his funeral which will be no short of magnificent. Politicians of the Socialist world have already sent their condolences and will surely arrive to meet Comrade Stalin one last time before his final rest. On the other hand, his victims and the millions of people he put into gulags are secretly celebrating." #NT!
 SOV_KAG.8.desc: "...and so I say, there will not come a day where a party official, a peasant, an engineer, a pilot will not thank you, Comrade Stalin, for everything that you have done for the Soviet Union, and for the world! Therefore, in our hearts, in our minds, in our souls, you will always live on!" said Lazar Kaganovich in the final paragraph of his speech opening the 21st All-Union Communist Party Congress. Despite the grim atmosphere of the Man of Iron passing, he was rewarded with a ten-minute standing ovation. Kaganovich had to resort to using Stalin's buzzer to calm the room before returning to his seat.\nNext was Vyacheslav Molotov, who reiterated the speech of Comrade Kaganovich, however, in a much more somber tone. He said that it was good fate that Stalin passed in his dacha, as it was the place where he has seen him most happy. But he added that the course set by him needs to be followed and his work continued. For which he earned a nod from Iron Lazar.\nFollowing the speeches of the other members of the Politburo, Comrade Kaganovich returned to the stage to present the main topic of this year's Congress, his reforms to the Soviet system, which many started to dub "Kaganovichism".\nOne of its tenets is a return to a low-level inter-party democracy to ease the replacement of junior party members either upwards to better positions or out of the party and to make the lower echelons of the state more responsive and efficient. The implementation of term limits for the position of General Secretary is concurrent with this goal. The final big issue Lazar Kaganovich seeks to eradicate is corruption within the state for which he will present a plan in the coming days." #NT!
 SOV_KAG.9.desc: "As he already outlined during the Congress, Comrade Kaganovich aims to eradicate corruption from the state apparatus. Several proposals for punishment have been put forward in a law similar to the one against Social Parasitism. In this iteration, it is those who misuse their position and the work of others to their benefit. The specific punishments will vary on the number of Rubles the perpetrator has acquired through his dishonest actions, from property seizure, years in prison, eviction from the Party, and relocation to a faraway region of the Union." #NT!
 SOV_KAG.10.desc: "The opening of the 22nd Congress of the CPSU took place today. The importance of this Congress lies in the actual summing up of the struggle between supporters and opponents of applied cybernetics, invisible to the general public, but noticeably reflected in the results of the 8th Five-Year Plan and the well-being of the people. Secretary General Lazar Kaganovich opened the Congress with an introductory speech, in which objective results were listed - which indicators were achieved in full, and which only partially. At first calmly listening, some of the Congress delegates turned to disapproving whistles, hoots and cheers, shouting about "squandering the people's wealth", "thoughtless experiments" and "an attempt to push the Party aside and usurp power." Delegates who supported Kaganovich tried to outshout his haters, talking about anti-popular elements in the party who interfered with cybernetization in the same way that wreckers sabotaged industrialization, and about the deliberate failure to implement the decisions of the previous Congress. After the allotted time, Lazar Kaganovich, obviously alarmed by the unceasing disputes, but trying not to show it, called the delegates to order, and when the noise stopped, gave way to the next speaker." #NT!
 SOV_KAG.11.desc: "The 23rd Congress of the Communist Party is underway in Moscow and there are reports of incoming change in leadership of the Soviet Union. According to the internal party bulletin, Lazar Kaganovich has announced his resignation from the post of the General Secretary of the Communist Party and there was a vote for his replacement the very next day.\nTwo candidates were considered. First was Dmitry Ustinov, a Soviet general responsible for the Soviet military–industrial complex. His main propositions are an intensification of OGAS development with military integration, civil defence investments, underground factories beyond Urals and a more active involvment in foreign activities. Second was Alexander Shelepin, who caught the eye of Stalin after he organized the partisan movements in the Moscow region and his crucial role in Komsomol Youth Organization." #NT!
  
  #Andropov 
 SOV_SamanthaSmith.1.d: "Dear Mr. Andropov,\n\nMy name is Samantha Smith.\nI am 10 years old.\nCongratulations on your new job.\nI have been worrying about Russia and the United States getting into a Nuclear war. Are you going to vote to have a war or not? If you aren’t please tell me how you are going to help to not have a war. This question you do not have to answer but I would like it if you would. Why do you want to conquer the world or at least our country? God made the world for us to share and take care of. Not to fight over or have one group of people own it all. Please let's do what he wanted and have everybody be happy too.\n\nSamantha Smith\nManchester, Maine, U.S.A.\nBox 44 04351\nP.S. Please write back." #NT!
 SOV_SamanthaSmith.3.d: "Dear Mr. Ambassador,\n\nMy name is Samantha Smith and I am 10 years old.\n\nI have heard that you are the Soviet Ambassador to the United States. I am very glad you’re here in our country.\n\nI wrote Mr. Andropov, as I am scared of Nuclear war between our two countries. I do not want him to start a nuclear war, and I wish very much that he’d answer my letter.\n\nI have seen a copy of Pravda, where my letter was printed. They made fun of my questions and of my age. I believe my questions were correct and my age does not matter at all. Nuclear war is a fear that anyone should be scared of.\n\nI again ask Mr. Andropov to answer my letter as it means very much to me.\n\nThank you,\n\nSamantha Smith\nManchester, Maine, U.S.A.\nBox 44 04351" #NT!
 SOV_SamanthaSmith.4.d: "Dear Samantha,\n\nI received your letter, which is like many others that have reached me recently from your country and from other countries around the world.\n\n It seems to me - I can tell by your letter - that you are a courageous and honest girl, resembling Becky, the friend of Tom Sawyer in the famous book of your compatriot Mark Twain. This book is well known and loved in our country by all boys and girls.\n\nYou write that you are anxious about whether there will be a nuclear war between our two countries. And you ask are we doing anything so that war will not break out.\n\nYour question is the most important of those that every thinking man can pose. I will reply to you seriously and honestly.\n\nYes, Samantha, we in the Soviet Union are trying to do everything so that there will not be war on Earth. This is what every Soviet man wants. This is what the great founder of our state, Vladimir Lenin, taught us.\n\nSoviet people well know what a terrible thing war is. Forty-two years ago, Nazi Germany, which strove for supremacy over the whole world, attacked our country, burned and destroyed many thousands of our towns and villages, killed millions of Soviet men, women, and children.\n\nIn that war, which ended with our victory, we were in alliance with the United States: together we fought for the liberation of many people from the Nazi invaders. I hope that you know about this from your history lessons in school. And today we want very much to live in peace, to trade and cooperate with all our neighbors on this earth - with those far away and those nearby. And certainly with such a great country as the United States of America.\n\nIn America and in our country there are nuclear weapons - terrible weapons that can kill millions of people in an instant. But we do not want them to be used. That’s precisely why the Soviet Union solemnly declared throughout the entire world that never will it use nuclear weapons first against any country. In general we propose to discontinue further production of them and to proceed to the abolition of all the stockpiles on Earth.\n\nIt seems to me that this is a sufficient answer to your second question: ‘Why do you want to wage war against the whole world or at least the United States?’ We want nothing of the kind. No one in our country - neither workers, peasants, writers nor doctors, neither grown-ups nor children, nor members of the government - want either a big or ‘little’ war.\n\nWe want peace - there is something that we are occupied with: growing wheat, building and inventing, writing books and flying into space. We want peace for ourselves and for all peoples of the planet. For our children and for you, Samantha.\n\nI invite you, if your parents will let you, to come to our country, the best time being this summer. You will find out about our country, meet with your contemporaries, visit an international children’s camp - Artek - on the sea. And see for yourself: in the Soviet Union, everyone is for peace and friendship among peoples.\n\nThank you for your letter. I wish you all the best in your young life.\n\nY. Andropov" #NT!
 SOV_SamanthaSmith.5.d: "10-year old Maine girl Samantha Smith, after writing a letter to Soviet leader Yuri Andropov, has been invited to visit the country on a goodwill tour. Capturing hearts both here in the United States as well as in the Soviet Union, Samantha has become a media darling overnight.\n\nState Department officials, acting quickly, have proposed several responses to this invitation. Allowing Samantha to visit would provide perfect public relations to show a peacebuilding initiative with the Soviet Union, and her presence may genuinely serve as a calming point in what are clearly increasing relations.\n\nHowever, some officials have expressed concern that allowing Samantha to visit would provide leverage for the Soviet Union to “take the moral high ground” in the Cold War, particularly among countries that have shifting relations with the United States. It may be preferable to limit her travel, by either not sanctioning it, condemning the visit, or going so far as to cancel her passport." #NT!
 SOV_SamanthaSmith.6.d: "Today, a jet Samantha Smith and her parents onboard landed in Moscow, beginning what would be the first day in a two-week visit of the Soviet Union, on the invitation of General Secretary Yuri Andropov.\n\nAfter writing a letter to Andropov, worried about the rising threat of nuclear war, the Soviet leader wrote back, attracting immediate media attention on both sides of the Curtain. Samantha’s concern and Andropov’s sympathetic answer has provided a needed calm in the midst of rapidly increasing tensions in the Cold War.\n\nIt is not known whether Smith will be able to meet directly with Andropov, but it is known that she will attend a Soviet children’s camp known as Artek, located in Crimea.\n\nThe media, however, will be following Smith along the entire way, and will continue to report on her adventures in the Soviet Union." #NT!
 SOV_SamanthaSmith.7.d: "Perhaps unsurprisingly, the United States has announced today that they are actively stopping Samantha Smith and her parents from visiting the Soviet Union, on the grounds that their visit is a “threat to United States national security.”\n\nApparently concerned that Smith’s visit might turn public opinion against the United States, both domestically and internationally, State Department officials have also categorically condemned the Soviet invitation as a “strategy to coerce innocent children, who do not know what they are being invited to.”\n\nThe media has decried this decision, but conservative outlets hail the decision as protecting children and American reputation, as the fear that Smith would be used as a propaganda outlet grew." #NT!
