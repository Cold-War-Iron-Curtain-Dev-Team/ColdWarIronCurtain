§YРадар§! - Увеличивает максимальный уровень радиолокационной станции и дает бонусы.\n\n§CЯдерная энергия§!\n§YЯдерная энергия§! - Улучшает эффективность ядерной энергетики"
 TUTOR.1062.t: "Технология"
 TUTOR.1062.d: "§CЭЛЕКТРОНИКА§!\n§YТранзисторы§! - Обязательное условие для суперкомпьютеров\n§YСуперкомпьютеры§! - Увеличивает скорость исследования\n§YАппаратура§! - условие для многих других технологий и почти для всех военных технологий.\n§YПрограммное обеспечение§! - Смешанный набор с бонусами\n§YМнтернет и связь§! - Увеличивает максимум командных очков\n§YБытовая электроника§! - Увеличивает и без того огромный доход офисов\n§YШифрование/Дешифрование§! - Важные технологии для разведки\n§YРадар§! - Увеличивает максимальный уровень радиолокационной станции и дает бонусы.\n\n§CЯДЕРНЫЙ§!\n§YЯдерная энергия§! - Улучшает эффективность ядерной энергетики"
 TUTOR_economics_107: "Закупка снаряжения"
 TUTOR.107.t: "Закупка снаряжения"
 TUTOR_economics_107_desc: "§YЗакупка снаряжения§! позволяет использовать §дегьги§! для закупки снаряжения вашим военным. §G1x§! покупки имеют 1 год кулдауна и позволяют мгновенно приобрести оборудование. С большим уровнем §YЗакупки снаряжения§! появляется период ожидания, во время которого §YКампания(ии)§! должна произвести снаряжение для вас.\n\n§CГРАЖДАНСКИЙ РЫНОК§!\n §YГражданский рынок§! это общедоступный универсальный контракт, по которому может купить такие вещи, как §YДоп.снаряжение§!, §YАвтотранспорт§!, или §YТранспортные самолеты§! которые не требуют военных контрактов. Как правило, это недорогие предметы, которые не имеют боевых способностей и в основном производятся §YГражданскими§! §Yнезависимыми кампаниями§!.\n\n§CКОНТРАКТЫ§!\nВы можете иметь до 1 §YКонтракта§! каждого уровня (низкий, средний, высокий) для разных видов §YВоенного снаряжения§! и §YОружия§!. Чтобы выбрать §YКонтракт§!, нажмите кнопку §YПодписать контракт§! и выберите §YПроизводитель§!. Вам необходимо §Y100-300§! §YПолитической власти§! чтобы получить контракт. Вы можете повысить §YВысокоровневый контракт§! до §Максимальный уровень§! открывая доступ к закупке §YАвианосцев и крейсеров§!. Некоторые §Yкампании§! имеют более высокий  §YУровень технологий§! повышая качество произвиденного снаряжения."
 TUTOR.107.d: "§YЗакупка снаряжения§! позволяет использовать §дегьги§! для закупки снаряжения вашим военным. §G1x§! покупки имеют 1 год кулдауна и позволяют мгновенно приобрести оборудование. С большим уровнем §YЗакупки снаряжения§! появляется период ожидания, во время которого §YКампания(ии)§! должна произвести снаряжение для вас.\n\n§CГРАЖДАНСКИЙ РЫНОК§!\n §YГражданский рынок§! это общедоступный универсальный контракт, по которому может купить такие вещи, как §YДоп.снаряжение§!, §YАвтотранспорт§!, или §YТранспортные самолеты§! которые не требуют военных контрактов. Как правило, это недорогие предметы, которые не имеют боевых способностей и в основном производятся §YГражданскими§! §Yнезависимыми кампаниями§!.\n\n§CКОНТРАКТЫ§!\nВы можете иметь до 1 §YКонтракта§! каждого уровня (низкий, средний, высокий) для разных видов §YВоенного снаряжения§! и §YОружия§!. Чтобы выбрать §YКонтракт§!, нажмите кнопку §YПодписать контракт§! и выберите §YПроизводитель§!. Вам необходимо §Y100-300§! §YПолитической власти§! чтобы получить контракт. Вы можете повысить §YВысокоровневый контракт§! до §Максимальный уровень§! открывая доступ к закупке §YАвианосцев и крейсеров§!. Некоторые §Yкампании§! имеют более высокий  §YУровень технологий§! повышая качество произвиденного снаряжения."
 TUTOR_economics_108: "Ресурсы"
 TUTOR.108.t: "Ресурсы"
 TUTOR_economics_108_desc: "§YРесурсы§! используются практически всем в CWIC. Большинство зданий используют §YРесурсы§!. §YИндустриальные парки§! используют £resources_strip|7, £resources_strip|5, и £resources_strip|1. §YОфисы§! используют £resources_strip|7, £resources_strip|2, и £resources_strip|1. §YВерфи§! используют £resources_strip|7, и немного §YЭлектроэнергии§!.\n\n§CОДР§!\n§YОДР§! или §YОперации по добыче ресурсов§! являются источником большинства ресурсов, которые вы производите. Большинство регионов уже начинают игру с некоторыми §YОДР§! но вы можете построить больше в решениях §YОДР§! инвестируя §Yденьги§! в их создание. Много §YОДР§! требоуют §BТехнологии добычи ресурсов§! для того, чтобы строить больше."
 TUTOR.108.d: "§YРесурсы§! используются практически всем в CWIC. Большинство зданий используют §YРесурсы§!. §YИндустриальные парки§! используют £resources_strip|7, £resources_strip|5, и £resources_strip|1. §YОфисы§! используют £resources_strip|7, £resources_strip|2, и £resources_strip|1. §YВерфи§! используют £resources_strip|7, и немного §YЭлектроэнергии§!.\n\n§CОДР§!\n§YОДР§! или §YОперации по добыче ресурсов§! являются источником большинства ресурсов, которые вы производите. Большинство регионов уже начинают игру с некоторыми §YОДР§! но вы можете построить больше в решениях §YОДР§! инвестируя §Yденьги§! в их создание. Много §YОДР§! требоуют §BТехнологии добычи ресурсов§! для того, чтобы строить больше."
 TUTOR.200.a: "Пиу пиу"
 TUTOR.200.b: "Читать больше"
 TUTOR_military_201: "Общие основы"
 TUTOR.201.t: "Общие основы"
 TUTOR_military_201_desc: "Есть несколько важных деталей, которые являются универсальными для всех модов HOI4.\n\n§CШАБЛОНЫ§!\nШаблоны всегда должны быть §Y10, 20,§! или §Y40§! ширины фронта, потому что подавляющее большинство боев происходит на местности, которая имеет ширину в §Y20§!. Любое оставшееся пространство не будет заполнено так как §YДивизии§! не могут частично заполнить места. Слоты под §YРоты поддержки§! позволяют поставить до 10 различных видов §YРот поддержки§!. Каждая §YДивизия§! имеет доступ до 5 §Yбригад§! каждый из которых имеет до 5 §Yбатальонов§!.\n\n§CХАРАКТЕРИСТИКИ§!\nВнимательно следите за §YОрганизацией§! потому что это будет определять, как долго ваша дивизия может оставаться в бою, пока §YПрочность§! определяет, какая часть оборудования и рабочей силы теряется при повреждении. §YПехота§! является основой вашей армии и повышает §YОрг§! и §YПрочн.§!. §YПодразделения огневой поддержки§! такие как §YАртиллерия§! или §YПТУРы§! эффективны в улучшении силы §Yурона§! но ужастны в §YОрганизации§! и §YПрочн§!. §YБронетехника/Боевые машины§! имеют решающее значение для повышения вашего §YПрорыва§! и §YОбороны§! которые позволяют вам избегать урона и наносить больше врагу урона, чем они наносят вам. §YСкорость восстановления/Мораль§! позволяет вашей армии восстановить свою §Yорганизацию§! быстрее вне боя.\n\n§CРОТЫ ПОДДЕРЖКИ§!\n§YРОТЫ ПОДДЕРЖКИ§! это две колонки слева. Вы можете иметь до 10 из них. §YОгневая поддержка§! повышает боевые характеристики дивизии на фиксированную величину, за исключением рот §YСпец войск§! которые повышают определенную характеристику в подразделении, выполняя специальные операции за линиями, которые вы можете §Bисследовать§! в соответствующей ветке исследований. §YБоевая поддержка§! повышают специальные характеристики, такие как §YРазведка§! or §YУкрепленность§!.\n\n§CДРУГИЕ ХАРАКТЕРИСТИКИ§!\nЕсть многочисленные §YСпециальные характеристики§! которые в основном получены от §YРот поддержки§!.\n§YРазведка§! - Получайте информацию во время битвы за баффы и повышайте вероятность противодействия тактике противника, чтобы получить преимущество или победить более сильного противника.\n§YЗащищенность§! - Стоя, дивизии могут укрепиться и получить баффы защиты\n§YИнициатива§! - Одна из самых мощных характеристик. Не все подразделения прибывают в бой сразу. Подразделения в бою начинаются слабыми и уязвимыми и постепенно приобретают силу с течением времени. Инициатива ускоряет этот процесс и может позволить вам сокрушить врага или раньше победить более сильную силу\n§YПодавление§! - Важно только для гарнизонов! Влияет на то, насколько эффективно подразделение может подавлять мятежи на оккупированной территории и эффективно поддерживать порядок.\n§YВес§! - Влияет на то, сколько времени требуется для начала морского вторжения\n§YНадежность и захват снаряжения§! - Надежность влияет на истощение. Чем надежнее, тем меньше вероятность того, что дивизия потеряет силы и будет уничтожена вне боя или сломается во время боя. Захват снаряжения позволяет вам вернуть утерянное снаряжение у противника (включая ненадежное вражеское снаряжение, которое сломалось без боя)\n§YСохранение опыта§! - сохраняет силы и опыт от потери в бою, когда солдаты умирают/прочность теряется\n§YБроня против пробития§! - Если броня противника выше, чем у другой дивизии, весь урон в подавляющем большинстве уменьшается\n§YПрочность§! - прочность влияет на соотношение урона бронетехнике или пехоте. \n§YАкклиматизация§! - Уменьшает истощение от холода или жары. Оборудование с надежностью менее 70% почти всегда подвергается истощению, связанному с климатом, независимо от акклиматизации.\n§YБаффы/дебаффы местности§! -Влияет на урон, прорыв и защиту дивизии, сражаясь в определенных местах, видимых внизу в §YШаблон дивизии§!"
 TUTOR.201.d: "Есть несколько важных деталей, которые являются универсальными для всех модов HOI4.\n\n§CШАБЛОНЫ§!\nШаблоны всегда должны быть §Y10, 20,§! или §Y40§! ширины фронта, потому что подавляющее большинство боев происходит на местности, которая имеет ширину в §Y20§!. Любое оставшееся пространство не будет заполнено так как §YДивизии§! не могут частично заполнить места. Слоты под §YРоты поддержки§! позволяют поставить до 10 различных видов §YРот поддержки§!. Каждая §YДивизия§! имеет доступ до 5 §Yбригад§! каждый из которых имеет до 5 §Yбатальонов§!.\n\n§CХАРАКТЕРИСТИКИ§!\nВнимательно следите за §YОрганизацией§! потому что это будет определять, как долго ваша дивизия может оставаться в бою, пока §YПрочность§! определяет, какая часть оборудования и рабочей силы теряется при повреждении. §YПехота§! является основой вашей армии и повышает §YОрг§! и §YПрочн.§!. §YПодразделения огневой поддержки§! такие как §YАртиллерия§! или §YПТУРы§! эффективны в улучшении силы §Yурона§! но ужастны в §YОрганизации§! и §YПрочн§!. §YБронетехника/Боевые машины§! имеют решающее значение для повышения вашего §YПрорыва§! и §YОбороны§! которые позволяют вам избегать урона и наносить больше врагу урона, чем они наносят вам. §YСкорость восстановления/Мораль§! позволяет вашей армии восстановить свою §Yорганизацию§! быстрее вне боя.\n\n§CРОТЫ ПОДДЕРЖКИ§!\n§YРОТЫ ПОДДЕРЖКИ§! это две колонки слева. Вы можете иметь до 10 из них. §YОгневая поддержка§! повышает боевые характеристики дивизии на фиксированную величину, за исключением рот §YСпец войск§! которые повышают определенную характеристику в подразделении, выполняя специальные операции за линиями, которые вы можете §Bисследовать§! в соответствующей ветке исследований. §YБоевая поддержка§! повышают специальные характеристики, такие как §YРазведка§! or §YУкрепленность§!."
 TUTOR.2012.t: "Больше статистики"
 TUTOR.2012.d: "§CДРУГИЕ ХАРАКТЕРИСТИКИ§!\nЕсть многочисленные §YСпециальные характеристики§! которые в основном получены от §YРот поддержки§!.\n§YРазведка§! - Получайте информацию во время битвы за баффы и повышайте вероятность противодействия тактике противника, чтобы получить преимущество или победить более сильного противника.\n§YЗащищенность§! - Стоя, дивизии могут укрепиться и получить баффы защиты\n§YИнициатива§! - Одна из самых мощных характеристик. Не все подразделения прибывают в бой сразу. Подразделения в бою начинаются слабыми и уязвимыми и постепенно приобретают силу с течением времени. Инициатива ускоряет этот процесс и может позволить вам сокрушить врага или раньше победить более сильную силу\n§YПодавление§! - Важно только для гарнизонов! Влияет на то, насколько эффективно подразделение может подавлять мятежи на оккупированной территории и эффективно поддерживать порядок.\n§YВес§! - Влияет на то, сколько времени требуется для начала морского вторжения\n§YНадежность и захват снаряжения§! - Надежность влияет на истощение. Чем надежнее, тем меньше вероятность того, что дивизия потеряет силы и будет уничтожена вне боя или сломается во время боя. Захват снаряжения позволяет вам вернуть утерянное снаряжение у противника (включая ненадежное вражеское снаряжение, которое сломалось без боя)\n§YСохранение опыта§! - сохраняет силы и опыт от потери в бою, когда солдаты умирают/прочность теряется\n§YБроня против пробития§! - Если броня противника выше, чем у другой дивизии, весь урон в подавляющем большинстве уменьшается\n§YПрочность§! - прочность влияет на соотношение урона бронетехнике или пехоте. \n§YАкклиматизация§! - Уменьшает истощение от холода или жары. Оборудование с надежностью менее 70% почти всегда подвергается истощению, связанному с климатом, независимо от акклиматизации.\n§YБаффы/дебаффы местности§! -Влияет на урон, прорыв и защиту дивизии, сражаясь в определенных местах, видимых внизу в §YШаблон дивизии§!"
 TUTOR_military_202: "Силы спецназа и развертывание снаряжения"
 TUTOR.202.t: "Силы спецназа и развертывание снаряжения"
 TUTOR_military_202_desc: "§YСилы спецназа§! это группа §BТехнологий§! которые предоставляют множество универсальных недоктринных преимуществ для ведения боевых действий на различных территориях, улучшают боевые возможности §YУдарных батальонов§! такие как §YМорская пехота§!, и улучшает способность очень мощных §YСпец войск§! §YРотами поддержки§!. Кроме стандартных батальонов, §YМеханизированные морские пехотинцы и ВДВ§!, §YКавалерия§!, и §YВоздушная кавалерия§! могут быть разблокированы через это дерево. Большинство §Yбоеприпасов§! и §YВспомогательного снаряжения пехоты§! по умолчанию не развернуты, вместо §YРазвернутые решения§! необходимы, чтобы получить выгоду.\n\n§CСпец.войска§!\n§YСпец.войска§! это группа §Bтехнологий§! это дает большое количество преимуществ различным областям вашей армии, которые не участвуют в прямых сражениях. §YУдарные батальоны§! такие как §YМорская пехота§!, §YВДВ§!, или §YГорнострелки§! полагаются на преимущества §Yспец.войск§!. Есть 3 разных дерева в §Yспец.войсках§! каждый с 3 преимуществами и отдельными ветвями §YСпециальных тактик и обучения§! для взаимоисключающих  §BТехнологий§! спецназа которые сосредотачиваюся на качестве или количестве.\n§YГорная/Арктическая Война§! дает преимущества для борьбы в холодном климате и в горах. §YВойна в пустыне§! делает то же самое, но для жаркого климата. §YМорской десант§! предоставляет улучшенные характеристики §YМорпехам§! для §YМорского вторжения§!. §YДесантная техника§! улучшает емкость и скорость §Yморского вторжения§!. §YВоздушно-десантные операции§! дает бонусы §Yпарашютистам§!. §YАрмия, флот и ВДВ§! разблокируют и обновят §YСпец войска§! роты поддержки, которые исполняют §YСпец операции§! за сценой, чтобы дать общие баффы дивизии, которую они обслуживают \n\n§CРАЗВЕРТЫВАНИЕ§!\n§YВспомогательное оборудование пехоты§! и §BТехнологии§! §YБоеприпасов§!  не предоставят преимущества. Вместо этого они разблокируют §YРешения по развертыванию§! где вам нужно применять их со временем к вашим войскам. Вы можете ускорить их развертывание, потратив §YКомандные ресурсы§!. Если у вас есть большое количество отдельных §YДивизий§! по сравнению с §YВоенными заводами§! тогда развертывание займет намного больше времени, так что будьте осторожны с огромным количеством маленьких проспамленных §YДивизий§!"
 TUTOR.202.d: "§YСилы спецназа§! это группа §BТехнологий§! которые предоставляют множество универсальных недоктринных преимуществ для ведения боевых действий на различных территориях, улучшают боевые возможности §YУдарных батальонов§! такие как §YМорская пехота§!, и улучшает способность очень мощных §YСпец войск§! §YРотами поддержки§!. Кроме стандартных батальонов, §YМеханизированные морские пехотинцы и ВДВ§!, §YКавалерия§!, и §YВоздушная кавалерия§! могут быть разблокированы через это дерево. Большинство §Yбоеприпасов§! и §YВспомогательного снаряжения пехоты§! по умолчанию не развернуты, вместо §YРазвернутые решения§! необходимы, чтобы получить выгоду.\n\n§CСпец.войска§!\n§YСпец.войска§! это группа §Bтехнологий§! это дает большое количество преимуществ различным областям вашей армии, которые не участвуют в прямых сражениях. §YУдарные батальоны§! такие как §YМорская пехота§!, §YВДВ§!, или §YГорнострелки§! полагаются на преимущества §Yспец.войск§!. Есть 3 разных дерева в §Yспец.войсках§! каждый с 3 преимуществами и отдельными ветвями §YСпециальных тактик и обучения§! для взаимоисключающих  §BТехнологий§! спецназа которые сосредотачиваюся на качестве или количестве.\n§YГорная/Арктическая Война§! дает преимущества для борьбы в холодном климате и в горах. §YВойна в пустыне§! делает то же самое, но для жаркого климата. §YМорской десант§! предоставляет улучшенные характеристики §YМорпехам§! для §YМорского вторжения§!. §YДесантная техника§! улучшает емкость и скорость §Yморского вторжения§!. §YВоздушно-десантные операции§! дает бонусы §Yпарашютистам§!. §YАрмия, флот и ВДВ§! разблокируют и обновят §YСпец войска§! роты поддержки, которые исполняют §YСпец операции§! за сценой, чтобы дать общие баффы дивизии, которую они обслуживают \n\n§CРАЗВЕРТЫВАНИЕ§!\n§YВспомогательное оборудование пехоты§! и §BТехнологии§! §YБоеприпасов§! не предоставят преимущества. Вместо этого они разблокируют §YРешения по развертыванию§! где вам нужно применять их со временем к вашим войскам. Вы можете ускорить их развертывание, потратив §YКомандные ресурсы§!. Если у вас есть большое количество отдельных §YДивизий§! по сравнению с §YВоенными заводами§! тогда развертывание займет намного больше времени, так что будьте осторожны с огромным количеством маленьких проспамленных §YДивизий§!"
 TUTOR_military_203: "Армия"
 TUTOR.203.t: "Армия"
 TUTOR_military_203_desc: "Армия§! так же важна, как и другие отрасли, но является самым сложным ядром ваших военных сил.\n\n§CПехота§!\n§YПехота§! является основой вашей армии, она обеспечивает §Yорганизацию§§! и §YОЗ§! вашей армии. §YМоторизированная пехота§! предлагает больше §YОрганизации§! и §YОЗ§!. §YБМП/Тяжелая моторизированная пехота§! имеет самую крепкую броню и отличные боевые характеристики. §YВоздушкая кавалерия§! наибыстрейшая и самая §YПрорывнаяh§! и §YЗащищенная§!военная единица. §YМеханизированная пехота§! быстра и оснащена бронёй.\n\n§CТанки/Боевой транспорт§!\n§YТанки§! дают много §YПрорыва§! и §Yзащиты§! а также довольно хорошие боевые характеристики. §YИстребители танков/Маневренные боевые машины§! функционируют подобно §YТанкам§! но с большим прорывом и имеют хуже броню. §YУдарные вертолеты§! чрезвычайно мощные, но ограничены в качестве одной §Yроты поддержки§! на §YДивизию§! Рекомендуется использовать их группами.\n\n§YОгневая поддержка§!\n§YОгневая поддержка§! очень разнообразна и составляет большую часть вашего урона. §YЛегкая, средняя и тяжелая§! Артиллерия оптимизирована для защитных, наступательных и чистых повреждений соответственно. §YАвтопушки§! дают  §YВоздушную защиту§!, немного §YЗашиты§!, и атаки. §YНосители ЗРК§! похожи на §YАвтопушки§! но дают лишь больше §YВоздушной защиты§!. §YОрудия стрельбы прямой наводкой§! дают много §Yпробития§! и немного атаки. §YПТУРы/Носители ПТУР§! функционируют аналогично, но намного дороже и очень сильно сосредоточены на §Yбронепробитии§! и дают немного атаки.\n\n§CРОТЫ ПОДДЕРЖКИ§!\n§YРоты поддержки§! предоставляют специальные характеристики и модификаторы для вашей армии или функционировать как дополнительные батальоны §Yподдержки§!. Существует множество более мощных мобильных версий §Yрот поддержки§! в ветке §Bтехнологий§! §Yподдержки§!. §YВертолеты§! безусловно, самые мощные варианты."
 TUTOR.203.d: "Армия§! так же важна, как и другие отрасли, но является самым сложным ядром ваших военных сил.\n\n§CПехота§!\n§YПехота§! является основой вашей армии, она обеспечивает §Yорганизацию§§! и §YОЗ§! вашей армии. §YМоторизированная пехота§! предлагает больше §YОрганизации§! и §YОЗ§!. §YБМП/Тяжелая моторизированная пехота§! имеет самую крепкую броню и отличные боевые характеристики. §YВоздушкая кавалерия§! наибыстрейшая и самая §YПрорывнаяh§! и §YЗащищенная§!военная единица. §YМеханизированная пехота§! быстра и оснащена бронёй.\n\n§CТанки/Боевой транспорт§!\n§YТанки§! дают много §YПрорыва§! и §Yзащиты§! а также довольно хорошие боевые характеристики. §YИстребители танков/Маневренные боевые машины§! функционируют подобно §YТанкам§! но с большим прорывом и имеют хуже броню. §YУдарные вертолеты§! чрезвычайно мощные, но ограничены в качестве одной §Yроты поддержки§! на §YДивизию§! Рекомендуется использовать их группами.\n\n§YОгневая поддержка§!\n§YОгневая поддержка§! очень разнообразна и составляет большую часть вашего урона. §YЛегкая, средняя и тяжелая§! Артиллерия оптимизирована для защитных, наступательных и чистых повреждений соответственно. §YАвтопушки§! дают  §YВоздушную защиту§!, немного §YЗашиты§!, и атаки. §YНосители ЗРК§! похожи на §YАвтопушки§! но дают лишь больше §YВоздушной защиты§!. §YОрудия стрельбы прямой наводкой§! дают много §Yпробития§! и немного атаки. §YПТУРы/Носители ПТУР§! функционируют аналогично, но намного дороже и очень сильно сосредоточены на §Yбронепробитии§! и дают немного атаки.\n\n§CРОТЫ ПОДДЕРЖКИ§!\n§YРоты поддержки§! предоставляют специальные характеристики и модификаторы для вашей армии или функционировать как дополнительные батальоны §Yподдержки§!. Существует множество более мощных мобильных версий §Yрот поддержки§! в ветке §Bтехнологий§! §Yподдержки§!. §YВертолеты§! безусловно, самые мощные варианты."
 TUTOR_military_204: "ВВС"
 TUTOR.204.t: "ВВС"
 TUTOR_military_204_desc: "§YВВС§! это военная ветвь, которая способна разрушить вражеские здания и §YФлот§! с расстояния и обеспечивая чрезвычайно мощные боевые баффы §Yармии§!. §YЛегкий ЛА§! может выполнять почти все миссии, но делает это плохо во всех отношениях. Они, однако, наиболее экономически эффективны, но §Rмогут быть разорваны в клочья мгновенно§! нормальными самолетами более богатых стран. Миссии по снабжению воздуха §CСТОЯТ КО§! в CWIC из-за их важности в быстро развивающейся современной войне, поэтому используйте их в полной мере.\n\n§CВоздушный бой§!\n §YМногоцелевые§! могут выполнять постоянно миссию §YВоздушное превосходство§! которые дают баффы юнитам на земле и они автоматически атакуют вражеские самолеты. §YПерехватчики§! являются воздушными подразделениями, которые не обеспечивают преимущества наземной атаки как миссии §YВоздушного превосходства§! и может атаковать только другой самолет. §YСверхзвуковые перехватчики§! специализируются на защите миссий §Yперехвата§! и уничтожают §YБомбардировщики§! и §YТранспортные самолеты§! и может быстро переместиться в любую точку мира.\n\n§YПоддержка с воздуха§!\n §YШтурмовики§!, §YМногоцелевые самолеты§!, и §YТактические бомбардировщики§! могут быть использованы для миссий §YШтурмовки§! для помощи §Yармейским дивизиям§! в бою, нанося огромный урон противнику с помощью специализированных §Yштурмовиков§!.\n\n§CБОМБАРДИРОВКА§!\n§YСтратегические бомбардировщики§! и §YТактические бомбардировщики§! может разрушать здания и сооружения в миссиях §Yбомбардировок§!. Они должны быть защищены самолетами, отправленными на миссию §YВоздушное превосходство§!. §YМорские бомбардировщики§! могут эффективно бомбить вражеские флоты или корабли в порту. §YВысокоскоростные бомбардировщики§! намного быстрее, имеют гораздо большую дальность и гораздо более живучи. §YЯдерные бомбардировщики§! имеют большой радиус действия.\n\n§CРАКЕТЫ§!\n§YКрылатые ракеты§! и §YБаллистические ракеты§! разрушительное одноразовое оружие, которое вы развертываете с ракетных пусковых установок большой дальности, расположенных на §YАвиабазах§!. Они могут выполнить практически любую миссию и обеспечить разрушительные немедленные эффекты. §YБаллистические ракеты§! имеют ядерную боеголовку.\n\n§CТРАНСПОРТНЫЕ САМОЛЕТЫ§!\n§YТранспортные самолеты§! используются для отправки §YВДВ§! и выполнять миссии §YАвиаподдержки§! временно переместить часть §YЛимит поддержки§! из региона §YАвиабазы§! в другой"
 TUTOR.204.d: "§YВВС§! это военная ветвь, которая способна разрушить вражеские здания и §YФлот§! с расстояния и обеспечивая чрезвычайно мощные боевые баффы §Yармии§!. §YЛегкий ЛА§! может выполнять почти все миссии, но делает это плохо во всех отношениях. Они, однако, наиболее экономически эффективны, но §Rмогут быть разорваны в клочья мгновенно§! нормальными самолетов более богатых стран. Миссии по снабжению воздуха §CСТОЯТ КО§! в CWIC из-за их важности в быстро развивающейся современной войне, поэтому используйте их в полной мере.\n\n§CВоздушный бой§!\n §YМногоцелевые§! могут выполнять постоянно миссию §YВоздушное превосходство§! которые дают баффы юнитам на земле и они автоматически атакуют вражеские самолеты. §YПерехватчики§! являются воздушными подразделениями, которые не обеспечивают преимущества наземной атаки как миссии §YВоздушного превосходства§! и может атаковать только другой самолет. §YСверхзвуковые перехватчики§! специализируются на защите миссий §Yперехвата§! и уничтожают §YБомбардировщики§! и §YТранспортные самолеты§! и может быстро переместиться в любую точку мира.\n\n§YПоддержка с воздуха§!\n §YШтурмовики§!, §YМногоцелевые самолеты§!, и §YТактические бомбардировщики§! могут быть использованы для миссий §YШтурмовки§! для помощи §Yармейским дивизиям§! в бою, нанося огромный урон противнику с помощью специализированных §Yштурмовиков§!.\n\n§CБОМБАРДИРОВКА§!\n§YСтратегические бомбардировщики§! и §YТактические бомбардировщики§! может разрушать здания и сооружения в миссиях §Yбомбардировок§!. Они должны быть защищены самолетами, отправленными на миссию §YВоздушное превосходство§!. §YМорские бомбардировщики§! могут эффективно бомбить вражеские флоты или корабли в порту. §YВысокоскоростные бомбардировщики§! намного быстрее, имеют гораздо большую дальность и гораздо более живучи. §YЯдерные бомбардировщики§! имеют большой радиус действия.\n\n§CРАКЕТЫ§!\n§YКрылатые ракеты§! и §YБаллистические ракеты§! разрушительное одноразовое оружие, которое вы развертываете с ракетных пусковых установок большой дальности, расположенных на §YАвиабазах§!. Они могут выполнить практически любую миссию и обеспечить разрушительные немедленные эффекты. §YБаллистические ракеты§! имеют ядерную боеголовку.\n\n§CТРАНСПОРТНЫЕ САМОЛЕТЫ§!\n§YТранспортные самолеты§! используются для отправки §YВДВ§! и выполнять миссии §YАвиаподдержки§! временно переместить часть §YЛимит поддержки§! из региона §YАвиабазы§! в другой"
 TUTOR_military_205: "Флот"
 TUTOR.205.t: "Флот"
 TUTOR_military_205_desc: "§YФлот§! это довольно сложная ветвь §Yвоенных§! и включает в себя тщательный баланс классов кораблей и морской тактики.\n\n§CМОРСКОЙ БОЙ§!\nКорабли бывают 4 типов. §YЭскортные§!, §YБоевые§!, §YАвианосцы§!, и §YПодводные лодки§!. §YЭскортные§! корабли образуют костяк §Yфлота§! и составляют большую часть флота, чтобы защитить §YБоевые§! корабли. Великолепно применяемая атака и §YТорпеды§! делает морские бои в CWIC смертельно опасными для больших кораблей. Необходимо иметь достаточное количество для прикрытия §Yбоевых§! кораблей. §YБоевые§! корабли несут гораздо большее количество огневой мощи и §Yпрочности§! по сравнению с §Yэскортными§! корабли и как таковые являются более мощными. Помимо того, что они составляют основную часть огневой мощи, они не дают вражеским §YБоевым§! кораблям прямой наводкой атаковать §YАвианосцы§!. §YАвианосцы§! несут либо §YСВВП§! либо §Yмногоцелевые палубные§! самолеты, которые могут сражаться с другими самолетами или наносить урон кораблям, §Yпалубные бомбардировщики§! которые могут бомбить вражеские корабли или обеспечивать наземную поддержку, или §Yпротиволодные§! вертолеты которые защищают §YАвианосцы§! и §Yбоевые§! корабли от §Yподводных лодок§!. §YПодводные лодки§! попытаются остаться незамеченным и напрямую атаковать §Yбоевые§! или §Yавианосцы§! если им удастся преодолеть срежства обнаружения. Дополнительно, §YРакетный подводный крейсер стратегического назначения§! (МТГ §YОдинарные огромные§! и §YДвойные огромные§! корпуса) могут перевозить §YБРПЛ§! или §YКрылатые ракеты§! атаковать цели на сухопутных или вражеских флотах. §YТорпеды§! может напрямую атаковать §YБоевые§! корабли и §YАвианосцы§!. Также, §YСредние торпеды§! могут наносить урон §YПодводным лодкам§!.\n\n§CКОНВОИ§!\nЖизненно важно для §Yторговли§!, §Yперевозки войск§!, и §Yснабжение§!, §Yконвои§! являются одной из основных причин, почему победа в морском бою является решающим боем, даже на взаимосвязанной земле. §YКонвои§! незащищенные и могут быть уничтожены §Yподводными лодками§!. Конвои в морском бою появляются в линии с §Yавианосцами§! и будут защищены кораблями §Yэскорта§! и §Yбоевыми§! кораблями.\n\n§CМОДУЛИ§!\nСпецифично для MTГ, §Yмодули§! прийти в различных формах.\n§YОрудия ПВО§! и §YЗРК§! исследуются в §Bтехнологиях§! §Yавтопушек§! и §YЗРК§!.\n§YВооружениЯ§! являются высокопробивными, когда §YЗРК§! меньше пробивают. §YБронированные§! корабли могут легко победить корабли, которые имеют слишком много §ЗРК§! и не достаточно §Yвооружены§!\n§YКонтрмеры§! являются §GОЧЕНЬ ДОРОГИМИ§!. §YCIWS§! является §Rв высшей степени дороже, особенно в £resources_strip|2 но добавляет много §Yзащиты§! кораблю. Если §Yзащита§! корабля выше, чем пробитие врага, даже немного, то он будет иметь дело с §Rзначительно меньшим уроном.§!\n§YМорские модули§! ставятся в §Yслоты§!. §YСУО§! требуется, чтобы ПВО наносил приличное количество урона и увеличивает урон всех §Yвооружений§!. §YEW/SS§! увеличивает §Yобнаружение§! корабль. §YНавигация§! улучшает §Yскрытность§! корабля, помогающего избежать обнаружения и обеспечивающего бонусы при бою на стесненной местности. §YСонары§! используются для обнаружения §Yподводных целей§!.\n\n§CСПЕЦИАЛЬНОЕ ОРУЖИЕ§!\nБольшинство кораблей имеют слот под §YСпециальное оружие§!. Все они предоставляют различные преимущества и очень разнообразны, и поэтому должны быть использованы с осторожностью.\n\n§CЯДЕРНЫЕ ДВИГАТЕЛИ§!\n§YЯдерные двигатели§! исследуются в вкладке §Bядерные технологии/ОМП§! и §Gне потребляют топлива§! а также более §Yнадежны§! в результате чего у корабля гораздо меньше изменений при разрушении в море или в бою."
 TUTOR.205.d: "§YФлот§! это довольно сложная ветвь §Yвоенных§! и включает в себя тщательный баланс классов кораблей и морской тактики.\n\n§CМОРСКОЙ БОЙ§!\nКорабли бывают 4 типов. §YЭскортные§!, §YБоевые§!, §YАвианосцы§!, и §YПодводные лодки§!. §YЭскортные§! корабли образуют костяк §Yфлота§! и составляют большую часть флота, чтобы защитить §YБоевые§! корабли. Великолепно применяемая атака и §YТорпеды§! делает морские бои в CWIC смертельно опасными для больших кораблей. Необходимо иметь достаточное количество для прикрытия §Yбоевых§! кораблей. §YБоевые§! корабли несут гораздо большее количество огневой мощи и §Yпрочности§! по сравнению с §Yэскортными§! корабли и как таковые являются более мощными. Помимо того, что они составляют основную часть огневой мощи, они не дают вражеским §YБоевым§! кораблям прямой наводкой атаковать §YАвианосцы§!. §YАвианосцы§! несут либо §YСВВП§! либо §Yмногоцелевые палубные§! самолеты, которые могут сражаться с другими самолетами или наносить урон кораблям, §Yпалубные бомбардировщики§! которые могут бомбить вражеские корабли или обеспечивать наземную поддержку, или §Yпротиволодные§! вертолеты которые защищают §YАвианосцы§! и §Yбоевые§! корабли от §Yподводных лодок§!. §YПодводные лодки§! попытаются остаться незамеченным и напрямую атаковать §Yбоевые§! или §Yавианосцы§! если им удастся преодолеть срежства обнаружения. Дополнительно, §YРакетный подводный крейсер стратегического назначения§! (МТГ §YОдинарные огромные§! и §YДвойные огромные§! корпуса) могут перевозить §YБРПЛ§! или §YКрылатые ракеты§! атаковать цели на сухопутных или вражеских флотах. §YТорпеды§! может напрямую атаковать §YБоевые§! корабли и §YАвианосцы§!. Также, §YСредние торпеды§! могут наносить урон §YПодводным лодкам§!.\n\n§CКОНВОИ§!\nЖизненно важно для §Yторговли§!, §Yперевозки войск§!, и §Yснабжение§!, §Yконвои§! являются одной из основных причин, почему победа в морском бою является решающим боем, даже на взаимосвязанной земле. §YКонвои§! незащищенные и могут быть уничтожены §Yподводными лодками§!. Конвои в морском бою появляются в линии с §Yавианосцами§! и будут защищены кораблями §Yэскорта§! и §Yбоевыми§! кораблями."
 TUTOR.2052.t: "МТГ"
 TUTOR.2052.d: "\n§CМОДУЛИ§!\nСпецифично для MTГ, §Yмодули§! прийти в различных формах.\n§YОрудия ПВО§! и §YЗРК§! исследуются в §Bтехнологиях§! §Yавтопушек§! и §YЗРК§!.\n§YВооружения§! являются высокопробивными, в то время как §YЗРК§! пробивают меньше брони. §YБронированные§! корабли могут легко победить корабли, которые имеют слишком много §YЗРК§! и не достаточно §Yвооружены§!\n§YКонтрмеры§! являются §GОЧЕНЬ ДОРОГИМИ§!. §YЗенитно-артиллерийский комплекс§! на порядок дороже, особенно в плане £resources_strip|2 но добавляет много §Yзащиты§! кораблю. Если §Yзащита§! корабля выше, чем пробитие врага, даже немного, то он будет иметь дело с §Rзначительно меньшим уроном.§!\n§YМорские модули§! ставятся в §Yслоты§!. §YСУО§! требуется, чтобы ПВО наносил приличное количество урона и увеличивает урон всех §Yвооружений§!. §YРадары§! увеличивают §Yобнаружение§! кораблей. §YНавигация§! улучшает §Yскрытность§! корабля, помогающего избежать обнаружения и обеспечивающего бонусы при бою на стесненной местности. §YСонары§! используются для обнаружения §Yподводных целей§!.\n\n§CСПЕЦИАЛЬНОЕ ОРУЖИЕ§!\nБольшинство кораблей имеют слот под §YСпециальное оружие§!. Все они предоставляют различные преимущества и очень разнообразны, и поэтому должны быть использованы с осторожностью.\n\n§CЯДЕРНЫЕ ДВИГАТЕЛИ§!\n§YЯдерные двигатели§! исследуются в вкладке §Bядерные технологии/ОМП§! и §Gне потребляют топлива§! а также более §Yнадежны§! в результате чего у корабля гораздо меньше изменений при разрушении в море или в бою."
 TUTOR_military_206: "Ракеты"
 TUTOR.206.t: "Ракеты"
 TUTOR_military_206_desc: "§BВетка технологий ракет§! это высший уровень §Yвоенных§! технологий и это имеет решающее значение для среднего и позднего игрового периода. В то время как на ранних этапах можно отказаться, у вас должен быть сильный костяк из §Yракетных технологий§! и §Yснаряжения§! до §Yсценария§! 73-го года.\n\n§CБОЕВЫЕ РАКЕТЫ§!\n§YПТУРы§! и §YЗЕНИТНЫЕ РАКЕТЫ§! специализированы на §Yпротивотанковой§! и §YПВО§! §оружия поддержки§! которые испытывают недостаток в атаке, более дороги, и конкурируют с середины и конца игры с §YБМП/Вертолетами/Боевыми машинами§!. §YРакетная артиллерия§! наносит невероятное количество атаки и заставляет игроков использовать больше §Yвертолетов§! и §YБМП/БТР§!. §ЗУР большой дальности§! используются в §Yзданиях ПВО§! и либо увеличивает их максимальный уровень, либо улучшает их.\n\n§CАВИАЦИОННЫЕ РАКЕТЫ§!\n§BТехнологии§! §YУРВВ§! и §YУРВП§!  предоставляют значительные бонусы §Yавиации§! и значительно увеличивает атаку. Без этих §Bтехнологий§!, вы практически не сможете сражаться с вражескими самолетами или обнаружите, что ваши самолеты в большинстве §Rсбиты§! §YРакетами§! и поздними §YЗРК§!.\n\n§CРАКЕТЫ МОРСКОГО БАЗИРОВАНИЯ§!\n§BТехнология§! §YПКР§! имеют низкое пробитие но высокий урон в MTG или жизненно важные бонусы в не MTG геймплее. При тщательном уравновешивании с высокой проникающей способностью §Yмодулей вооружения§! ваш флот может сокрушить и уничтожить врага. Просто следите за технологиями §YКонтрмер§!  так как, когда вы проектируете свои корабли или добавляеете §YПКР§! могут быть §Rнеэффективны§!.\n\n§CРАКЕТЫ§!\n§YКрылатые ракеты§! это обычные одноразовые устройства, которые вы можете развернуть из пусковых установок большой дальности на §YАвиабазах§! и могут нанести много урона. §YБаллистические ракеты§! тактическое ядерное оружие, которое вы можете использовать, чтобы нанести гораздо больший урон, чем §YКрылатые ракеты§! но значительно дороже, дольше §Bисследуются§!, но значительно дороже и требуют £resources_strip|6."
 TUTOR.206.d: "§BВетка технологий ракет§! это высший уровень §Yвоенных§! технологий и это имеет решающее значение для среднего и позднего игрового периода. В то время как на ранних этапах можно отказаться, у вас должен быть сильный костяк из §Yракетных технологий§! и §Yснаряжения§! до §Yсценария§! 73-го года.\n\n§CБОЕВЫЕ РАКЕТЫ§!\n§YПТУРы§! и §YЗЕНИТНЫЕ РАКЕТЫ§! специализированы на §Yпротивотанковой§! и §YПВО§! §оружия поддержки§! которые испытывают недостаток в атаке, более дороги, и конкурируют с середины и конца игры с §YБМП/Вертолетами/Боевыми машинами§!. §YРакетная артиллерия§! наносит невероятное количество атаки и заставляет игроков использовать больше §Yвертолетов§! и §YБМП/БТР§!. §ЗУР большой дальности§! используются в §Yзданиях ПВО§! и либо увеличивает их максимальный уровень, либо улучшает их.\n\n§CАВИАЦИОННЫЕ РАКЕТЫ§!\n§BТехнологии§! §YУРВВ§! и §YУРВП§!  предоставляют значительные бонусы §Yавиации§! и значительно увеличивает атаку. Без этих §Bтехнологий§!, вы практически не сможете сражаться с вражескими самолетами или обнаружите, что ваши самолеты в большинстве §Rсбиты§! §YРакетами§! и поздними §YЗРК§!.\n\n§CРАКЕТЫ МОРСКОГО БАЗИРОВАНИЯ§!\n§BТехнология§! §YПКР§! имеют низкое пробитие но высокий урон в MTG или жизненно важные бонусы в не MTG геймплее. При тщательном уравновешивании с высокой проникающей способностью §Yмодулей вооружения§! ваш флот может сокрушить и уничтожить врага. Просто следите за технологиями §YКонтрмер§!  так как, когда вы проектируете свои корабли или добавляеете §YПКР§! могут быть §Rнеэффективны§!.\n\n§CРАКЕТЫ§!\n§YКрылатые ракеты§! это обычные одноразовые устройства, которые вы можете развернуть из пусковых установок большой дальности на §YАвиабазах§! и могут нанести много урона. §YБаллистические ракеты§! тактическое ядерное оружие, которое вы можете использовать, чтобы нанести гораздо больший урон, чем §YКрылатые ракеты§! но значительно дороже, дольше §Bисследуются§!, но значительно дороже и требуют £resources_strip|6.\""
 TUTOR_military_207: "ОМП/Ядерная технология"
 TUTOR.207.t: "ОМП/Ядерная технология"
 TUTOR_military_207_desc: "В §BТехнологиях ОМП§! вы проводите ядерные, биологические и химические §Bисследования§!. Вы можете §Bисследовать§! §YОМП§!, §Rядерное оружие§!, §Yядерные двигатели§!, и §Yядерную энергию§!.\n\n§CЯДЕРНОЕ ОРУЖИЕ§!\n§YЯдерное оружие§! самое разрушительное оружие, которое у вас есть в вашем арсенале. Используется в вкладке §YОМД§!, это оружие может быть использовано для быстрого уничтожения страны и экономики противника во время §Rядерной войны§!. Вы строите §Yядерное оружие§! в §Bвкладке ракетных технологий§! или строите массивные §термоядерное оружие§! используя §Yфабрики по производству ядерного оружия§!. §YБункера гражданской обороны§! это здание, которое является отличным способом уменьшить урон, получаемый от вражеских атак гражданскими.\n\n§CОружие массового поражения§!\nЗдесь вы можете §Bисследовать§! §Yбиологическое оружие§! в §Yвкладке ОМП§!, §YХимическое оружие§! которые используются как §Yспособности армии§!, и §YНервно-паралитический газ§! это способность, которая становится все более мощной, но опасной как для врага, так и для его пользователя по мере его развития.\n\n§CЯДЕРНЫЕ ИССЛЕДОВАНИЯ§!\nВ этой секции вы можете §Bисследовать§! множество не военных §BЯдерных технологий§!. §YЯдерные реакторы§! дороги, уязвимы к §Rстратегической бомбардировке§!, и потребляет £resources_strip|6. Несмотря на это, они являются наиболее эффективной формой получения £resources_strip|7 . §YМорские ядерные реакторы§! высоконадежные, но очень дорогие двигатели, не потребляющие топлива. §YЭнергия синтеза§! крайне дорогое §Yздание§! который построен через §Yрешения§!."
 TUTOR.207.d: "В §BТехнологиях ОМП§! вы проводите ядерные, биологические и химические §Bисследования§!. Вы можете §Bисследовать§! §YОМП§!, §Rядерное оружие§!, §Yядерные двигатели§!, и §Yядерную энергию§!.\n\n§CЯДЕРНОЕ ОРУЖИЕ§!\n§YЯдерное оружие§! самое разрушительное оружие, которое у вас есть в вашем арсенале. Используется в вкладке §YОМД§!, это оружие может быть использовано для быстрого уничтожения страны и экономики противника во время §Rядерной войны§!. Вы строите §Yядерное оружие§! в §Bвкладке ракетных технологий§! или строите массивные §термоядерное оружие§! используя §Yфабрики по производству ядерного оружия§!. §YБункера гражданской обороны§! это здание, которое является отличным способом уменьшить урон, получаемый от вражеских атак гражданскими.\n\n§CОружие массового поражения§!\nЗдесь вы можете §Bисследовать§! §Yбиологическое оружие§! в §Yвкладке ОМП§!, §YХимическое оружие§! которые используются как §Yспособности армии§!, и §YНервно-паралитический газ§! это способность, которая становится все более мощной, но опасной как для врага, так и для его пользователя по мере его развития.\n\n§CЯДЕРНЫЕ ИССЛЕДОВАНИЯ§!\nВ этой секции вы можете §Bисследовать§! множество не военных §BЯдерных технологий§!. §YЯдерные реакторы§! дороги, уязвимы к §Rстратегической бомбардировке§!, и потребляет £resources_strip|6. Несмотря на это, они являются наиболее эффективной формой получения £resources_strip|7 . §YМорские ядерные реакторы§! высоконадежные, но очень дорогие двигатели, не потребляющие топлива. §YЭнергия синтеза§! крайне дорогое §Yздание§! который построен через §Yрешения§!."
 TUTOR_military_209: "Доктрины"
 TUTOR.209.t: "Доктрины"
 TUTOR_military_209_desc: "§YДоктрины§! используются для определения всеобъемлющих стратегий ваших военных и определения или улучшения вашего стиля игры на протяжении всей кампании. §YДоктрины§! §Rвзаимоисключающиеся§!и не может быть изменено (из-за ошибки, приводящей к сбою модифицированных доктрин).\n\n§CАВИАЦИОННЫЕ ДОКТРИНЫ§!\nЕсть 3 §Yавиационные доктрины§! в CWIC.\n§YАвиационная универсальность§! это доктрина, основанная на универсальности и минимальном обслуживании. Это дает повышение эффективности §Yмногоцелевым§! и §Yтактическим бомбардировщикам§! что позволяет минимизировать количество различных производственных линий, которые вам нужны. Также, это §Gзначительно снижает количество несчастных случаев и штрафов за плохую погоду§!.\n§YСистемная война§! расставляет приоритеты в стратегическом аспекте для  §YВВС§!. Это дает баффы §Yстратегическим бомбардировкам§! и §Yподдержке с воздуха§!. Его цель - обеспечить косвенное разрушение военной машины противника путем стратегической бомбардировки.\n§YТактическая целостность§! противоположность §YАэронавигационная универсальность§! и §YСистемная война§!. §YТактическая целостность§! дает бонусы специализированным авиационным подразделениям и сосредотачивается на поддержке армий и флотов во время их наступления. Это дает больше бонусов §YПоддержке с воздуха§! и специализированным самолетам для выполнения вспомогательных функций для других отраслей и улучшения §Yперехватчиков§! для борьбы с вражескими бомбардировщиками."
 TUTOR.209.d: "§YДоктрины§! используются для определения всеобъемлющих стратегий ваших военных и определения или улучшения вашего стиля игры на протяжении всей кампании. §YДоктрины§! §Rвзаимоисключающиеся§!и не может быть изменено (из-за ошибки, приводящей к сбою модифицированных доктрин).\n\n§CАВИАЦИОННЫЕ ДОКТРИНЫ§!\nЕсть 3 §Yавиационные доктрины§! в CWIC.\n§YАвиационная универсальность§! это доктрина, основанная на универсальности и минимальном обслуживании. Это дает повышение эффективности §Yмногоцелевым§! и §Yтактическим бомбардировщикам§! что позволяет минимизировать количество различных производственных линий, которые вам нужны. Также, это §Gзначительно снижает количество несчастных случаев и штрафов за плохую погоду§!.\n§YСистемная война§! расставляет приоритеты в стратегическом аспекте для  §YВВС§!. Это дает баффы §Yстратегическим бомбардировкам§! и §Yподдержке с воздуха§!. Его цель - обеспечить косвенное разрушение военной машины противника путем стратегической бомбардировки.\n§YТактическая целостность§! противоположность §YАэронавигационная универсальность§! и §YСистемная война§!. §YТактическая целостность§! дает бонусы специализированным авиационным подразделениям и сосредотачивается на поддержке армий и флотов во время их наступления. Это дает больше бонусов §YПоддержке с воздуха§! и специализированным самолетам для выполнения вспомогательных функций для других отраслей и улучшения §Yперехватчиков§! для борьбы с вражескими бомбардировщиками"
 TUTOR_military_210: "Мятежи/Оккупация"
 TUTOR.210.t: "Мятежи/Оккупация"
 TUTOR_military_210_desc: "На протяжении всей игры вам придется противостоять §Rсопротивлению§!. Есть 2 вида §Rсопротивления§!.\n\n§CМЯТЕЖИ§!\n§RСопротивление§! очень опасны и угрожают вашему политическому ландшафту. Они специфичны для области и созданы по сценарию. Они появятся как механика в §Yрешениях§!. Они могут потребовать большого количества §Yочков полит.власти§!, §Yденег§!, и §Yснаряжения§! для борьбы. Если вы не сможете их подавить, тогда они §Rсоздадут новую независимую страну, которая настроена против вас§! принимая большое количество §Yресурсов§!, землю и, возможно, военные активы, такие как §Yснаряжение§! или §YАеродромы§!.\n\n§CСОПРОТИВЛЕНИЕ В НЕ НАЦ.ППРОВИНЦИЯХ§!\n§RСопротивление в не нац.провинциях§! это §Rсопротивление§! которые динамичны и встречаются во всех §Yне нац.провинциях§!. Они динамичны и подавляются вашим §Yгарнизонным шаблоном§!. Рекомендуется приоритизировать создание §Yгарнизонного шаблона§! это экономически выгодно и ширина фронта должна быть 10+. Ширина фронта не имеет значения для §Yгарнизона§! можно использовать частичное или множественные §Yгарнизоны§! на территории. Приоритезация, чтобы это имело оптимальное соотношение цены и подавления и §RВСЕГДА ПОПОЛНЯЙТЕ СНАРЯЖЕНИЕМ ГАРНИЗОНЫ§!. Не давай им §Yбоевую технику§! как §YТанки§! или §Yоружие огневой поддержки§! как §YАртиллерия§! потому что они безсмысленны для §Yгарнизонов§!. §YАвтотранспорт, БТР и авиа кавалерия§! все они имеют высокий уровень подавления, но воздушная кавалерия, хотя и несколько более эффективна с точки зрения рабочей силы, часто неэффективна с точки зрения затрат. Если есть §RНеподчинение§! в регионе, §Rсопротивление§! будет наносить урон §Yгарнизону§! и попытаются уничтожить §Yздания§! и могут даже §Rобъявить независимость§!. Когда §Rсопротивление§! наносит урон §Yгарнизону§!, они делают §Yоперации сопротивления§!. Имея §Bтехнологии§! §Yавтопушек§! или §Yвоенной полиции§! может уменьшить ущерб от §Yопераций сопротивления§!. Процент прочности §Yгарнизонов§! уменьшит общий ущерб, нанесенный им §Yсопротивлением§!."
 TUTOR.210.d: "На протяжении всей игры вам придется противостоять §Rсопротивлению§!. Есть 2 вида §Rсопротивления§!.\n\n§CМЯТЕЖИ§!\n§RСопротивление§! очень опасны и угрожают вашему политическому ландшафту. Они специфичны для области и созданы по сценарию. Они появятся как механика в §Yрешениях§!. Они могут потребовать большого количества §Yочков полит.власти§!, §Yденег§!, и §Yснаряжения§! для борьбы. Если вы не сможете их подавить, тогда они §Rсоздадут новую независимую страну, которая настроена против вас§! принимая большое количество §Yресурсов§!, землю и, возможно, военные активы, такие как §Yснаряжение§! или §YАеродромы§!.\n\n§CСОПРОТИВЛЕНИЕ В НЕ НАЦ.ППРОВИНЦИЯХ§!\n§RСопротивление в не нац.провинциях§! это §Rсопротивление§! которые динамичны и встречаются во всех §Yне нац.провинциях§!. Они динамичны и подавляются вашим §Yгарнизонным шаблоном§!. Рекомендуется приоритизировать создание §Yгарнизонного шаблона§! это экономически выгодно и ширина фронта должна быть 10+. Ширина фронта не имеет значения для §Yгарнизона§! можно использовать частичное или множественные §Yгарнизоны§! на территории. Приоритезация, чтобы это имело оптимальное соотношение цены и подавления и §RВСЕГДА ПОПОЛНЯЙТЕ СНАРЯЖЕНИЕМ ГАРНИЗОНЫ§!. Не давай им §Yбоевую технику§! как §YТанки§! или §Yоружие огневой поддержки§! как §YАртиллерия§! потому что они безсмысленны для §Yгарнизонов§!. §YАвтотранспорт, БТР и авиа кавалерия§! все они имеют высокий уровень подавления, но воздушная кавалерия, хотя и несколько более эффективна с точки зрения рабочей силы, часто неэффективна с точки зрения затрат. Если есть §RНеподчинение§! в регионе, §Rсопротивление§! будет наносить урон §Yгарнизону§! и попытаются уничтожить §Yздания§! и могут даже §Rобъявить независимость§!. Когда §Rсопротивление§! наносит урон §Yгарнизону§!, они делают §Yоперации сопротивления§!. Имея §Bтехнологии§! §Yавтопушек§! или §Yвоенной полиции§! может уменьшить ущерб от §Yопераций сопротивления§!. Процент прочности §Yгарнизонов§! уменьшит общий ущерб, нанесенный им §Yсопротивлением§!."
 TUTOR_military_211: "Меню Оружия Массового Поражения"
 TUTOR.211.d: "Cold War Iron Curtain представляет совершенно новую систему ОМП, позволяющую осуществлять более сложные и стратегические обмены ядерными ударами по сравнению со стандартным ванильным методом щелчка по каждой провинции. Графический интерфейс состоит из 8 основных частей. \n1. Верхний левый экран показывает ядерные державы мира, другими словами, кто имеет ядерное оружие. \ n 2. Экран Defcon показывает ваш уровень Defcon и доступен только для США, СССР и КНР. Смещение уровня вниз будет указывать на более высокую стадию напряженности. \n\n 3. Средняя часть графического интерфейса показывает, сколько у вас есть каждого вида ОМУ, от обычных ядерных боеголовок до межконтинентальных баллистических ракет. Список химического оружия в крайнем правом углу - способность, которая в разработке. И немного денуклеаризации - ну, в любом случае, зачем вам это делать? \n4. Под разделом, обсуждаемым в разделе 3, находятся 3 варианта для удара 1, 2 или 3 уровня, каждый из которых предлагает разное количество использованных ядерных зарядов и разные цели. Уровень 1 - это базовая атака на вражеские столицы в радиусе действия. Уровень 2 - это уровень 1 плюс дополнительные ядерные бомбы для стратегических целей, т.е. крупные населенные или промышленные центры. Уровень 3 - это полный, тотальный, ядерный залп, и для него требуется одно из двух: технология межконтинентальных баллистических ракет или, для СССР или США, ракеты на Кубе или в Турции соответственно. \n5. Большая серая ядерная кнопка станет красной, если все требования для запуска будут выполнены, и тогда вы сможете играть в глобальную термоядерную войну. \n6. Под большой кнопкой находится список ядерных боеприпасов, необходимых для нанесения удара. \n7. Слева от него находится список целей штата для удара. \n8. Слева от него находится список вражеских стран в пределах досягаемости ваших ракет. \n\n Помните: если у вас возникнут какие-либо ошибки или проблемы с этой системой, не стесняйтесь размещать их в Steam или Discord разработчиков мода. \n\n Удачи в тотальном уничтожении человевечества!"
 TUTOR.300.a: "Я обиделся"
 TUTOR.300.b: "Подробнее"
 TUTOR_politics_301: "Механика дерева фокусов"
 TUTOR.301.t: "Механика дерева фокусов"
 TUTOR_politics_301_desc: "§YДрева фокусов§! в CWIC функционируют иначе, чем в других модах, из-за необычайно большого временного интервала. Каждый §Yпериод§!, ('49, '60, '73, '80,) §Yдрево фокусов§! будет меняться. Любые фокусы, не завершенные при переключении, не будут доступны, поэтому следите за датой и планируйте заранее.\n\n§CВЫБОРЫ§!\nСтраны будут периодически иметь сценарий §Yвыбора§!, в котором вы можете выбрать определенный путь. Эти выборы, как правило, открывают один из нескольких взаимосвязанных §YPolitically-Linked§! mutually exclusive focuses locked behind the §RAlways = No§! tag in the §YFocus Tree§!.\n\n§CEVENT-LINKED FOCUSES§!\nOther than §YPolitically-linked§! focuses, the other §RAlways = no§! locked focuses are §YEvent-Linked Focuses§!. They are locked behind decisions that involve scheduled §YEvents§! that may happen or have already happened that require a choice. Albeit rarely, some of these focuses may rely on foreign events or decisions and are marked as being responses to other nations or world events. "
 TUTOR.301.d: "YДрева фокусов§! в CWIC функционируют иначе, чем в других модах, из-за необычайно большого временного интервала. Каждый §Yпериод§!, ('49, '60, '73, '80,) §Yдрево фокусов§! будет меняться. Any focuses not completed when the switch occurs will no longer be completable so keep track of the date and plan ahead.\n\n§CВЫБОРЫ§!\nCountries will periodically have scripted §YElections§! in which you can choose a specific path. These elections will usually unlock one of several intertwined §YPolitically-Linked§! mutually exclusive focuses locked behind the §RAlways = No§! tag in the §YFocus Tree§!.\n\n§CEVENT-LINKED FOCUSES§!\nOther than §YPolitically-linked§! focuses, the other §RAlways = no§! locked focuses are §YEvent-Linked Focuses§!. They are locked behind decisions that involve scheduled §YEvents§! that may happen or have already happened that require a choice. Albeit rarely, some of these focuses may rely on foreign events or decisions and are marked as being responses to other nations or world events. "
