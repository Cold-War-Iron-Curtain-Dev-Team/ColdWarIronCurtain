 TUTOR.0.t: "Туториал CWIC"
 TUTOR.0.d: "Хотите включить туториал мода информационных решений? Вы можете закрыть их в любое время."
 TUTOR.0.a: "Включить Туториал"
 TUTOR.0.b: "Нет, спасибо"
 TUTOR.1.t: "Туториал CWIC"
 TUTOR.1.d: "Хотите выключить туториал мода информационных решений? Вы можете включить его, запустив \"event TUTOR.0\" в консоли (без кавычек)."
 TUTOR.1.a: "Отключить туториал"
 TUTOR.1.b: "Нет, спасибо"
 TUTOR_starting_templates: "§YПримеры шаблонов§!"
 TUTOR.10.t: "Примеры шаблонов"
 TUTOR_starting_templates_desc: "Хотите какой-нибудь пример/стартовые шаблоны? Они ни в коей мере не мета, но помогают продемонстрировать разнообразие оружия в моде и показать вам примеры того, как их использовать, и дать вам основу для их использования. Попробуйте использовать (xp 10000) и (research 0) в консоли (открывается клавишей `) и поэкспериментируйте с ними. (Research all) открывает все технологии и доктрины, так что это хорошо для исследования, но не хорошо для экспериментов."
 TUTOR.10.d: "Хотите какой-нибудь пример/стартовые шаблоны? Они ни в коей мере не мета, но помогают продемонстрировать разнообразие оружия в моде и показать вам примеры того, как их использовать, и дать вам основу для их использования. Попробуйте использовать (xp 10000) и (research 0) в консоли (открывается клавишей `) и поэкспериментируйте с ними. (Research all) открывает все скрытые технологии и доктрины, так что это хорошо для исследования, но не хорошо для экспериментов."
 TUTOR.10.a: "Да, пожалуйста"
 TUTOR.10.b: "Нет"
