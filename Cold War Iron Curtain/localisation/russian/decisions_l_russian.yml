 bond_purchasing: "Облигации и займы"
 bond_purchasing_desc: "Покупайте облигации, чтобы со временем окупить их с процентами. Они дают вам немедленный прирост наличных денег, но стоят денег с течением времени.\n§YОбязательно ознакомьтесь с описанием кредитов на предмет сроков окупаемости, годовых процентов и специальных условий, прежде чем брать их!§!"
