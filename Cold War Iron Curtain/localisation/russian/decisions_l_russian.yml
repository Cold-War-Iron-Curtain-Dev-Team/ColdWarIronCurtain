 TUTOR_politics_303: "Альянсы"
 TUTOR.303.t: "Альянсы"
 TUTOR_politics_303_desc: "§YАльянсы§! в CWIC работают немного иначе. Многие §YАльянсы§! такие как §YНATO§! активны, только если один из их участников подвергся нападению или их §YЛидер§! (такие §ЕС§!§ОВД§!§CA§!)вызывает их в заранее подготовленный сценарий §Rвойны§! такие §RТМВ§!. Практически все §YАльянсы§!не может быть присоединен вручную и должен быть присоединен по историческому или альт-историческому событию или фокусу."
 TUTOR.303.d: "§YАльянсы§! в CWIC работают немного иначе. Многие §YАльянсы§! такие как §YНATO§! активны, только если один из их участников подвергся нападению или их §YЛидер§! (такие §ЕС§!§ОВД§!§CA§!)вызывает их в заранее подготовленный сценарий §Rвойны§! такие §RТМВ§!. Практически все §YАльянсы§!не может быть присоединен вручную и должен быть присоединен по историческому или альт-историческому событию или фокусу."
 TUTOR_politics_304: "Влияние"
 TUTOR.304.t: "Влияние"
 TUTOR_politics_304_desc: "§YВлияние§! это система в CWIC, где разные страны могут оказывать определенный уровень контроля над другими.\n\n§CОБРЕТЕНИЕ ВЛИЯНИЯ§!\nДля того, чтобы получить §YВлияние§! вам нужно выбрать иностранную страну и провести §Yполитическое действие§! чтобы увеличить ваше §Yвлияние§! с ними. Большим странам труднее получить §Yвлияние§!. Ваше §Yшифрование§! и §Yдешифрирование§! влияет на сколько §Yвлияния§! вы можете получить и противостоять другим соответственно. Кроме того, получение §YЗаймов§! обычно увеличивает §YВлияние§ того, кто предоставил займ. Кроме того, такие действия, как оплата вооруженных сил иностранного государства или предоставление долговых субсидий, могут увеличить §YВлияние§! на них. \n\n§CБЕЗОПАСНОЕ ВЛИЯНИЕ§! \nИмея высокий уровень §YШифрования§! , затрудняет получение странами §YВлияния§ (за исключением §YКредитов§!). В §YРешениях§! на вкладке вы можете проверить количество §YВлияния§! других стран на вас. Выше §Y15%§ влияния – проблема и может быть опасным. Для борьбы с иностранным §YВлиянием§! вы можете потратить очки §Yполитической власти§! для прямого уменьшения §YВлияния§ или улучшайте уровень §YСуверенитета§! что навсегда усложнит §YВлияние§! на вас. \n\n§ИСПОЛЬЗОВАНИЕ ВЛИЯНИЯ§! \nВсе страны могут тратить свое §YВлияние§!. Они могут украсть §Yресурсы§, взять под частичный контроль их §Экономику§!, или даже §Rсделать марионеткой вашу страну, если влияние достигнет достаточно высокого уровня!§! Однако некоторые негосударственные организации, такие как §YIMF§! может попытаться изменить вашу §YФискальную и социальную политику§! в соответствии с их повесткой дня или добавить §YНациональные идеи§!. Это может быть вредным или полезным для вашей нации."
 TUTOR.304.d: "§YВлияние§! это система в CWIC, где разные страны могут оказывать определенный уровень контроля над другими.\n\n§CОБРЕТЕНИЕ ВЛИЯНИЯ§!\nДля того, чтобы получить §YВлияние§! вам нужно выбрать чужую страну и потратить очки §Yполитической власти§! чтобы увеличить ваше §YВлияние§! над ними. На большин страны труднее получить §YВлияние§! . Ваше §Yдешифрование§! и §Yшифрование§! влияет сколько §YВлияния§! вы можете получить от других и сопротивляться соответственно. Кроме того, получение §YЗаймов§! обычно увеличивает §YВлияние§ того, кто предоставил займ. Кроме того, такие действия, как оплата вооруженных сил иностранного государства или предоставление долговых субсидий, могут увеличить §YВлияние§! на них. \n\n§CБЕЗОПАСНОЕ ВЛИЯНИЕ§! \nИмея высокий уровень §YШифрования§! , затрудняет получение странами §YВлияния§ (за исключением §YКредитов§!). В §YРешениях§! на вкладке вы можете проверить количество §YВлияния§! других стран на вас. Выше §Y15%§ влияния – проблема и может быть опасным. Для борьбы с иностранным §YВлиянием§! вы можете потратить очки §Yполитической власти§! для прямого уменьшения §YВлияния§ или улучшайте уровень §YСуверенитета§! что навсегда усложнит §YВлияние§! на вас. \n\n§ИСПОЛЬЗОВАНИЕ ВЛИЯНИЯ§! \nВсе страны могут тратить свое §YВлияние§!. Они могут украсть §Yресурсы§, взять под частичный контроль их §Экономику§!, или даже §Rсделать марионеткой вашу страну, если влияние достигнет достаточно высокого уровня!§! Однако некоторые негосударственные организации, такие как §YIMF§! может попытаться изменить вашу §YФискальную и социальную политику§! в соответствии с их повесткой дня или добавить §YНациональные идеи§!. Это может быть вредным или полезным для вашей нации."