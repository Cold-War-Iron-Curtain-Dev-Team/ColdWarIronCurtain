 economy_decisions: "Экономические решения"
 economy_decisions_desc: "Принимайте экономические решения в вашей стране. Это может быть что угодно: от навязывания мер, поиска или предложения иностранной помощи, получения облигаций / займов или других экономических решений\n§YОбязательно ознакомьтесь с описаниями ссуд на предмет сроков окупаемости, годовых процентов и особых условий, прежде чем вынимать их.!§!\n\n§gВнутренние облигации определяются количеством §!§Yофисных парков§!§g в вашей стране§!\n\nЕжемесячный Баланс [?IncomeCheck|§+§=2§!§!]B\nТекущий долг: §R$[?currentDebt|2]§!B\nОставшиеся в наличии внутренние облигации: §C[?available_liquidity]§!B"
