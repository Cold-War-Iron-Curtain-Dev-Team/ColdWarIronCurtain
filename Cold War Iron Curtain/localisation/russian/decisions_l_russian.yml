 TUTOR_economics_101: "Заработок и ВВП"
 TUTOR.101.t: "Заработок и ВВП"
 TUTOR_economics_101_desc: "§YДеньги§! является ресурсом в CWIC, который производится практически всеми производственными зданиями.\n\n§CЗАРАБАТЫВАНИЕ ДЕНЕГ§!\nДеньги имеют множество источников. §YНалогообложение§! зарабатывает деньги на основе §YУровня развития§! населения региона. Высокие §YОбщие налоговые ставки§! сокращают §YЭффективность производства§!. §YИндустриальные парки§! и §YВерфи§! имеют доход §G0.5млрд§! с здания умножненное на §YПроизводительность§! (Эффективность производства + 50%). §YВерфи§! также получают бонус на основе §YТорговых законов§! и §YТехнологий логистики§!. §YНефтеперерабатывающие заводы§! имеют базовый доход §G0.75млрд§!за здание, умноженное на +15% для каждой из своих §Yтехнологий обработки нефти§!. §YОфисные парки§! являются наиболее продуктивным зданием, поскольку они приносят базовый доход §G1.5млрд.§! за здание, умноженное на +15% для каждой §Yтехнологии электроники§!, которую вы исследовали. Экспортируемые §Yресурсы§! также является хорошим источником дохода. §YАгро-индустриальные комплексы§! дают §G0.5млрд§! за время исследования +15% с каждой §YАгрокультурной§! технологии.\n\n§YВВП§!\n§YВВП§! вашего государства определяется общей производительностью промышленности и торговли вашей страны. Больше зданий = больше §YВВП§!.\n\n§CОблигации и долги§!\nЗадолженность не всегда является проблемой, особенно если вы используете деньги для реинвестирования в доходы или немедленные расходы. Каждый раз, когда вы тратите больше денег, чем у вас в резервах, ваша страна получает §Yкредит по ставке «овенайт» в §YУровень процентов§!. В год подлежит возврату  §Y4%§! в течениb §Y3 лет§! автоматически. Если вы хотите понизить §Yпроцентную§! ставку или хотите получить долгосрочные кредиты - перейдите к категории §YЭкономические решения§! и откройте §YОблигации§! которые вам предлагают купить. Все они имеют разные §Yпроцентные ставки§! и §YПродолжительность кредита§!. Все иностранные §YОблигации§! увеличивают §YВлияние§! других наций на вас. Если вы предпочитаете избегать этого, то стройте §YОфисные парки§! для увеличения своего лимита §YВнутренних облигаций§!. Пул §YВнутренние облигации§! ограничен, но пополняется со временем."
 TUTOR.101.d: "§YДеньги§! является ресурсом в CWIC, который производится практически всеми производственными зданиями\n\n§CЗАРАБАТЫВАНИЕ ДЕНЕГ§!\nДеньги имеют множество источников. §YНалогообложение§! зарабатывает деньги на основе §YУровня развития§! населения региона. Высокие §YОбщие налоговые ставки§! сокращают §YЭффективность производства§!. §YИндустриальные парки§! и §YВерфи§! имеют доход §G0.5млрд§! с здания умножненное на §YПроизводительность§! (Эффективность производства + 50%). §YВерфи§! также получают бонус на основе §YТорговых законов§! и §YТехнологий логистики§!. §YНефтеперерабатывающие заводы§! имеют базовый доход §G0.75млрд§!за здание, умноженное на +15% для каждой из своих §Yтехнологий обработки нефти§!. §YОфисные парки§! являются наиболее продуктивным зданием, поскольку они приносят базовый доход §G1.5млрд.§! за здание, умноженное на +15% для каждой §Yтехнологии электроники§!. Экспортируемые §Yресурсы§! также является хорошим источником дохода. §YАгро-индустриальные комплексы§! дают §G0.5млрд§! за время исследования +15% с каждой §YАгрокультурной§! технологии.\n\n§YВВП§!\n§YВВП§! вашего государства определяется общей производительностью промышленности и торговли вашей страны.Больше зданий = больше §YВВП§!.\n\n§CОблигации и долги§!\nЗадолженность не всегда является проблемой, особенно если вы используете деньги для реинвестирования в доходы или немедленные расходы. Каждый раз, когда вы тратите больше денег, чем у вас в резервах, ваша страна получает §Yкредит по ставке «овенайт» в §YУровень процентов§!. В год подлежит возврату  §Y4%§! в течении §Y3 лет§! автоматически. Если вы хотите понизить §Yпроцентную§! ставку или хотите получить долгосрочные кредиты - перейдите к категории §YЭкономические решения§! и откройте §YОблигации§! которые вам предлагают купить. Все они имеют разные §Yпроцентные ставки§! и §YПродолжительность кредита§!. Все иностранные §YОблигации§! увеличивают §YВлияние§! других наций на вас. Если вы предпочитаете избегать этого, то стройте §YОфисные парки§! для увеличения своего лимита §YВнутренних облигаций§!. Пул §YВнутренние облигации§! ограничен, но пополняется со временем."
 TUTOR_economics_102: "Политика и Указы"
 TUTOR.102.t: "Политика и Указы"
 TUTOR_economics_102_desc: "Политики и указы доступны на вкладке политики, расположенной рядом с разделом законов на экране политики вашей страны. Все политики, которые стоят денег, делают это на основе общей численности населения страны.\n\n§CФИСКАЛЬНАЯ ПОЛИТИКА§!\n§YФискальная политика§! – политика, которые требует от вас §YСтоимость обслуживания§! базирующиеся на вашей §YОбщей популярности§!. Эти политики предоставляют различные бонусы, которые можно просмотреть, наведя курсор мыши на каждую политику. Вы можете переключиться только на смежные политики за §O150 ПО§!. Увеличение политики требует перезарядки, когда политика должна быть реализована и ее цели выполнены. Снижение §YФискальных политик§! не имеет периода восстановления. Большинство стран не могут достичь систем более высокого уровня в начале игры и должны будут разработать свои технологии для их реализации.\n\n§CСОЦИАЛЬНАЯ ПОЛИТИКА§!\n§YСоциальные политика§! это политика, которая обычно идет с компромиссами, которые соответствуют разным стилям игры или создают различные потребности. Обычно это лучше всего смотреть с точки зрения погружения или ролевой игры. Определенные §Yидеологии§! ограничат вас от обладания определенной §YСоциальной политики§!. §YСоциальные политики§! у всех разные стоимость в §YПолитических очках§! и продолжительность перезарядки зависит от того, насколько резким является изменение. Часто некоторые изменения могут встретиться с §Rяростным сопротивлением§! у населения. Усиление маргинализации расовых групп в стране, например, вызовет §RРАСОВУЮ ВОЙНУ§! которая может длиться несколько лет. \n\n§CИНФОРМАЦИОННАЯ ВКЛАДКА§!\nПоследняя вкладка представляет вам большое количество статистики по вашей стране. Эта информация отображает ваш §Gдоход§! в разбивке по источникам, перечислены различные национальные статистические данные, такие как §YВВП§!, и позволяет вам изменить свою §YОбщую налоговую ставку§!."
 TUTOR.102.d: "Политики и указы доступны на вкладке политики, расположенной рядом с разделом законов на экране политики вашей страны. Все политики, которые стоят денег, делают это на основе общей численности населения страны.\n\n§CФИСКАЛЬНАЯ ПОЛИТИКА§!\n§YФискальная политика§! – политика, которые требует от вас §YСтоимость обслуживания§! базирующиеся на вашей §YОбщей популярности§!. Эти политики предоставляют различные бонусы, которые можно просмотреть, наведя курсор мыши на каждую политику. Вы можете переключиться только на смежные политики за §O150 ПО§!. Увеличение политики требует перезарядки, когда политика должна быть реализована и ее цели выполнены. Снижение §YФискальных политик§!не имеет периода восстановления. Большинство стран не могут достичь систем более высокого уровня в начале игры и должны будут разработать свои технологии для их реализации.\n\n§CСОЦИАЛЬНАЯ ПОЛИТИКА§!\n§YСоциальные политика§! это политика, которая обычно идет с компромиссами, которые соответствуют разным стилям игры или создают различные потребности. Обычно это лучше всего смотреть с точки зрения погружения или ролевой игры. Определенные §YИдеологии§! ограничат вас от обладания определенной §YСоциальной политики§!. §YСоциальные политики§! у всех разные стоимость в §YПолитических очках§! и продолжительность перезарядки зависит от того, насколько резким является изменение. Часто некоторые изменения могут встретиться с §Rяростное сопротивление§! у населения. Усиление маргинализации расовых групп в стране, например, вызовет §RРАСОВУЮ ВОЙНУ§! которая может длиться несколько лет. \n\n§CИНФОРМАЦИОННАЯ ВКЛАДКА§!\nПоследняя вкладка представляет вам большое количество статистики по вашей стране. Эта информация отображает ваш §Gдоход§! в разбивке по источникам, перечислены различные национальные статистические данные, такие как §YВВП§!, и позволяет вам изменить свою §YОбщую налоговую ставку§!."
 TUTOR_economics_103: "Категории регионов/Флаговые здания"
 TUTOR.103.t: "Категории регионов/Флаговые здания"
 TUTOR_economics_103_desc: "§YКатегории регионов§! в CWIC определяется §YНаселением§! и §YУровнем развития§! региона. Практически во всех модах и ваниле, §YКатегория региона§! не может быть улучшена. §YФлаговые здания§! являются зданиями, которые не построены обычными средствами и используют вместо этого государственные флаги. Ванильные разведывательные здания являются примером §YФлаговых зданий§!.\n\n§CКатегория регионов§!\nВ CWIC, §Yячейки под строительства§! определяются по следующей формуле (§YНаселение§! в миллионах §Gx2§! x (§Y+50%§! за каждый §YУровень развития§!)). Вы можете улучшить §YУровень развития§! в категории решений §YЭкономические инвестиции§!. Это также повысит налоговый доход. Вы можете просмотреть §YУровень развития§! нажав на регион и просмотрев информационную область.\n\n§CФлаговые здания§!\nКроме §YОДР§! (Операции по Добыче Ресурсов), CWIC показывает другие Флаговые здания, которые построены через решение или фокус. §YТелекомы§! (скоро)будет еще один. Стоимость, чтобы построить эти §YФлаговые здания§! можно увидеть отображаюшимся рядом с их соответствующими решениями."
 TUTOR.103.d: "§YКатегории регионов§! в CWIC определяется §YНаселением§! и §YУровнем развития§! региона. Практически во всех модах и ваниле, §YКатегория региона§! не может быть улучшена. §YФлаговые здания§! являются зданиями, которые не построены обычными средствами и используют вместо этого государственные флаги. Ванильные разведывательные здания являются примером §YФлаговых зданий§!.\n\n§CКатегория регионов§!\nВ CWIC, §Yячейки под строительства§! определяются по следующей формуле (§YНаселение§! в миллионах §Gx2§! x (§Y+50%§! за каждый §YУровень развития§!)). Вы можете улучшить §YУровень развития§! в категории решений §YЭкономические инвестиции§!. Это также повысит налоговый доход. Вы можете просмотреть §YУровень развития§! нажав на регион и просмотрев информационную область.\n\n§CФлаговые здания§!\nКроме §YОДР§! (Операции по Добыче Ресурсов), CWIC показывает другие Флаговые здания, которые построены через решение или фокус. §YТелекомы§! (скоро)будет еще один. Стоимость, чтобы построить эти §YФлаговые здания§! можно увидеть отображаюшимся рядом с их соответствующими решениями."
 TUTOR_economics_104: "Сельское хозяйство"
 TUTOR.104.t: "Сельское хозяйство"
 TUTOR_economics_104_desc: "Ваша нация требует §YСельскохозяйственные товары§!£resources_strip|3 чтобы выжить. §YСельскохозяйственные товары§!£resources_strip|3 представлены иконкой £resources_strip|3. Нехватка §YСельскохозяйственных товаров/Еды§!£resources_strip|3 приведет вашу страну к  §Rбольшим штрафам§! §YЭффективности производства§!, §YСтабильности§!, и на высоких уровнях вызовет §RГолод§! §YСельскохозяйственные товары§!£resources_strip|3 получаются из §YАгро-промышленных комплексов§!, с которого также получаются §YДеньги§!.\n\n§CАгро-биомы§!\n§YАгро-биомы§! являются функцией региона, которую можно увидеть на экране информации о состоянии. Чем плодороднее §YАгро-биомы§! тем больше производится еды. \nАгропромышленные комплексы имеют следующие базовые показатели в зависимости от агробиома региона:\n§YПустынные горы§! = §G0.5§!£resources_strip|3 \n§YПустыня или тундра§! = §G1§!£resources_strip|3 \n§YПышная пустыня или умеренные горы§! = §G2§!£resources_strip|3 \n§YСеверные регионы§! = §G3§!£resources_strip|3 \n§YБаза §! = §G4§!£resources_strip|3\n§YВесь год§! = §G6§!£resources_strip|3\n\n§CВОДНАЯ ИНФРАСТРУКТУРА§!\n§YВодная инфраструктура§! это тип инфраструктуры, которая улучшает производительность §YАгро-промышленных комплексов§! в регионе, где они построены. Если у региона нет §YВодная инфраструктура§! тогда почти не будет £resources_strip|3. Каждый уровень §YВодная инфраструктура§! увеличит продуктивность на §G+25%§!"
 TUTOR.104.d: "Ваша нация требует §YСельскохозяйственные товары§!£resources_strip|3 чтобы выжить. §YСельскохозяйственные товары§!£resources_strip|3 представлены иконкой £resources_strip|3. Нехватка §YСельскохозяйственных товаров/Еды§!£resources_strip|3 приведет вашу страну к  §Rбольшим штрафам§! §YЭффективности производства§!, §YСтабильности§!, и на высоких уровнях вызовет §RГолод§! §YСельскохозяйственные товары§!£resources_strip|3 получаются из §YАгро-промышленных комплексов§!, с которого также получаются §YДеньги§!.\n\n§CАгро-биомы§!\n§YАгро-биомы§! являются функцией региона, которую можно увидеть на экране информации о состоянии. Чем плодороднее §YАгро-биомы§! тем больше производится еды. \nАгропромышленные комплексы имеют следующие базовые показатели в зависимости от агробиома региона:\n§YПустынные горы§! = §G0.5§!£resources_strip|3 \n§YПустыня или тундра§! = §G1§!£resources_strip|3 \n§YПышная пустыня или умеренные горы§! = §G2§!£resources_strip|3 \n§YСеверные регионы§! = §G3§!£resources_strip|3 \n§YБаза §! = §G4§!£resources_strip|3\n§YВесь год§! = §G6§!£resources_strip|3\n\n§CВОДНАЯ ИНФРАСТРУКТУРА§!\n§YВодная инфраструктура§! это тип инфраструктуры, которая улучшает производительность §YАгро-промышленных комплексов§! в регионе, где они построены. Если у региона нет §YВодная инфраструктура§! тогда почти не будет £resources_strip|3. Каждый уровень §YВодная инфраструктура§! увеличит продуктивность на §G+25%§!"
 TUTOR_economics_105: "Энергетика и Инфраструктура"
 TUTOR.105.t: "Энергетика и Инфраструктура"
 TUTOR_economics_105_desc: "§YЭнергия§!£resources_strip|7 это новый и важный ресурс и §YИнфраструктура§! и получил собственное обновление и расширение в CWIC.\n\n§CЭНЕРГИЯ§!\n§YЭнергия§! £resources_strip|7 потребляется каждым производственным зданием в CWIC. §YНефтеперерабатывающие заводы§!, §YПромышленные парки§!, §YВоенное производство§!, §YОфисы§! и все другие производственные здания используют электричество для своей работы.  §YЭкологические энергетические§! технологии уменьшают потребление §YЭнергии§!£resources_strip|7 здания. §YЭнергия ископаемого топлива§! дешевая и надежная , но потребляет §Yнефтепродукты§!£resources_strip|1. может быть улучшена ветками §YГазовых§! технологий. §YЗеленая энергия§! намного дороже, но в подавляющем большинстве случаев её сложнее бомбить и ей не нужно §Yнефти§!£resources_strip|1. §YАтомная энергия§! найдете в ветке §YОМД§! и она крайне продуктивна но очень важная цель и требует множества инвестиций в §Bисследования§!.\n\n§CИНФРАСТРУКТУРА§!\n§Yинфраструктура§! в CWIC имеет целую ветку §Bтехнологий§!. §YМуниципальная инфраструктура§! повышает §YСкорость строительства§! в регионе. §YРегиональная инфраструктура§! повышает §Yснабжение§! и §Yдобычу ресурсов§! в регионе. §YВодная инфраструктура§! важна для производительности §YАгро-промышленных комплексов§! в регионе. Вы можете увеличить максимальный уровень застрайки в каждом состоянии каждого типа §YИнфраструктуры§! при помощи §Bисследования§! их соответствующих технологий. Технологии §YИнфраменеджмента§! это общий пакет с бонусами для §YПромышленности§! и §YСкорости строительства инфраструктуры§!."
 TUTOR.105.d: "§YЭнергия§!£resources_strip|7 это новый и важный ресурс и §YИнфраструктура§! и получил собственное обновление и расширение в CWIC.\n\n§CЭНЕРГИЯ§!\n§YЭнергия§! £resources_strip|7 потребляется каждым производственным зданием в CWIC. §YНефтеперерабатывающие заводы§!, §YПромышленные парки§!, §YВоенное производство§!, §YОфисы§! и все другие производственные здания используют электричество для своей работы.  §YЭкологические энергетические§! технологии уменьшают потребление §YЭнергии§!£resources_strip|7 здания. §YЭнергия ископаемого топлива§! дешевая и надежная , но потребляет §Yнефтепродукты§!£resources_strip|1. может быть улучшена ветками §YГазовых§! технологий. §YЗеленая энергия§! намного дороже, но в подавляющем большинстве случаев её сложнее бомбить и ей не нужно §Yнефти§!£resources_strip|1. §YАтомная энергия§! найдете в ветке §YОМД§! и она крайне продуктивна но очень важная цель и требует множества инвестиций в §Bисследования§!.\n\n§CИНФРАСТРУКТУРА§!\n§Yинфраструктура§! в CWIC имеет целую ветку §Bтехнологий§!. §YМуниципальная инфраструктура§! повышает §YСкорость строительства§! в регионе. §YРегиональная инфраструктура§! повышает §Yснабжение§! и §Yдобычу ресурсов§! в регионе. §YВодная инфраструктура§! важна для производительности §YАгро-промышленных комплексов§! в регионе. Вы можете увеличить максимальный уровень застрайки в каждом состоянии каждого типа §YИнфраструктуры§! при помощи §Bисследования§! их соответствующих технологий. Технологии §YИнфраменеджмента§! это общий пакет с бонусами для §YПромышленности§! и §YСкорости строительства инфраструктуры§!."
 TUTOR_economics_106: "Технология"
 TUTOR.106.t: "Технология"
 TUTOR_economics_106_desc: "§BТехнологии§! в CWIC  разделенны на узкоспециализированные категории.Ниже приведен скомпилированный список того, что делает каждая техническая линия.\n\n§CИНДУСТРИЯ§!\n§YЛогистика§! - Эффективность производства, доход верфи, скорость ремонта и хранение топлива\n§YПроизводство§! - Эффективность производства и объем\n§YМенеджмент§! - Эффективность производства, повышение эффективности и сохранение, а также переоборудование военно-морского флота\n§YСельское хозяйство§! - Улучшает производительность АПК\n§YОрганика§! - Рост населения (здоровье экосистемы скоро)\n§YВода§! - макс. уровень водной инфраструктуры и бонусы от менеджмента\n§YБиотопливо/Электрокары§! - Сокращение гражданского потребления топлива (здоровье экосистемы скоро будет)\n§YГражданское строительство§! - Скорость строительства и ремонта\n§YЗемляные работы§! - добыча ресурсов\n§YМатериаловедение§! - Обязательным условием для многих других технологий, повышает доход для нефтеперерабатывающих заводов и увеличивает их производительность. Пластик улучшает прирост топлива.\n§YЭнергосистема§! - Улучшает все источники энергии\n§YЗеленая энергия/Экоэнергия§! - Улучшает производительность и максимальный уровень возобновляемых электростанций и снижает потребление энергии другими зданиями соответственно\n§YТопливо§! - Улучшает выработку энергии электростанциями на ископаемом топливе\n§YИнфраменеджмент§! - Смешанный набор с бонусами\n§YИнфраструктура§! - Улучшает максимальный уровень муниципальной и региональной инфраструктуры\n\n§CЭЛЕКТРОНИКА§!\n§YТранзисторы§! - Обязательное условие для суперкомпьютеров\n§YСуперкомпьютеры§! - Увеличивает скорость исследования\n§YАппаратура§! - условие для многих других технологий и почти для всех военных технологий.\n§YПрограммное обеспечение§! - Смешанный набор с бонусами\n§YМнтернет и связь§! - Увеличивает максимум командных очков\n§YБытовая электроника§! - Увеличивает и без того огромный доход офисов\n§YШифрование/Дешифрование§! - Важные технологии для разведки\n§YРадар§! - Увеличивает максимальный уровень радиолокационной станции и дает бонусы.\n\n§CЯдерная энергия§!\n§YЯдерная энергия§! - Улучшает эффективность ядерной энергетики"
