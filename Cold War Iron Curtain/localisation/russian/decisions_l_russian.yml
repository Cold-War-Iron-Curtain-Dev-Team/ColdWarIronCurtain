 contra_insurgency_options.1.d: "Контрас полагаются на страх и запугивание, чтобы выразить себя. Те, кто поддерживает их, часто являются бывшими головорезами или жадными личностями, отчаянно нуждающимися в деньгах, предоставленных иностранцами, выступающими против нашей революции. Поэтому нам не так уж трудно завербовать местных жителей в районах, контролируемых контрразведкой, которые готовы выполнять свой патриотический долг и собирать для нас информацию. В ходе недавней разведывательной операции нам удалось успешно завербовать жителя деревни неподалеку от крупной базы контрразведки. Он предоставил нам бесценную информацию об их тактике вербовки, развертывании и уровне поставок оружия. Что еще более важно, поскольку многие из контрас ходят по магазинам или проводят свое свободное время в деревне,мы также получаем информацию о будущих контрнаступлениях. Исходя из этой информации, мы лучше смогли развернуть наши силы в этом районе, чтобы противостоять их силам, и смогли перехватить несколько попыток контрас ввести новые истребители в этот район."
 contra_insurgency_options.2.d: "Контрас полагаются на страх и запугивание, чтобы выразить себя. Те, кто поддерживает их, часто являются бывшими головорезами или жадными личностями, отчаянно нуждающимися в деньгах, предоставленных иностранцами, выступающими против нашей революции. Поэтому нам не так уж трудно завербовать местных жителей в районах, контролируемых контрразведкой, которые готовы выполнять свой патриотический долг и собирать для нас информацию. В ходе недавней разведывательной операции нам удалось успешно завербовать одного жителя деревни в районе, контролируемом контрразведкой. Источник в то время оказался полезным и предоставил разведданные, которые указывали на крупное контрнаступление в этом районе. Мы развернули войска, чтобы противостоять этому наступлению, но оно закончилось в другом районе, и контрас отбросили наши неподготовленные силы. Мы поняли, что наш рекрут был двойным агентом и способствовал успеху контры. Наша операция провалилась."
 contra_insurgency_options.3.d: "Контрас трусливый народ, часто нападающий только из джунглей, чтобы атаковать безоружных чиновников или невинных гражданских лиц. Мы развернули силы для защиты нескольких деревень, которые недавно подверглись нападению. Контрас этого не понимали, и нам удалось обнаружить их оперативную базу в этом районе. Во время дерзкого рейда наши войска смогли проникнуть в ряды контрразведки и напасть на нее. Застигнутые врасплох, их бойцы понесли тяжелые потери, когда они бежали и бежали, многие бросили свои современные западные винтовки. Мы взяли пленных и захватили документы. Жители деревни благодарны нам за наши действия, и боевой дух наших войск в этом районе возрос."
 contra_insurgency_options.4.d: "Контрас трусливый народ, часто нападающий только из джунглей, чтобы атаковать безоружных чиновников или невинных гражданских лиц. Мы развернули силы для защиты нескольких деревень, которые недавно подверглись нападению. Однако наш командир допустил ошибку, определив базу, с которой они начали атаку. Когда наши солдаты двинулись в атаку, контрас готовились к выходу и были начеку. В конце концов они обнаружили наши войска, и когда началась атака, наши люди столкнулись с окопавшимся и подготовленным противником. Мы понесли потери, и наши солдаты были вынуждены отступить. Поражение позволило контрас двигаться более агрессивно в этом районе, и жители деревни в этом районе потеряли доверие к правительству."
 contra_insurgency_options.5.d: "У нас скромная авиация, но наши летчики полны революционного пыла. С помощью разведданных дружественной державы нам удалось обнаружить расположение тренировочного лагеря контрнаступления под открытым небом. Похоже, они нагло полагают, что мы не в состоянии нанести удар по базе, поскольку она находится довольно далеко. Однако мы смогли послать несколько наших самолетов с бомбами, и они попали прямо в цель. После нападения мы узнали от нашей разведки, что база была большим тренировочным лагерем и плацдармом для повстанцев, и после удара она больше не функционирует. Возможности противника в этом районе были исчерпаны этим успешным ударом."
 contra_insurgency_options.6.d: "У нас скромная авиация, но наши летчики полны революционного пыла. С помощью разведданных дружественной державы нам удалось обнаружить расположение тренировочного лагеря контрнаступления под открытым небом. Мы послали несколько наших самолетов, чтобы уничтожить цель, что они и сделали. Однако разведывательные перехваты и источники не указывали на то, что \"контрас\" понесли потери в этом районе. Сбитая с толку, небольшая группа людей исследовала это место, похоже, наши самолеты, возможно, выбрали неверные координаты и вместо этого ударили по открытому полю рядом с фермерским домом. Судя по всему, жертв среди мирного населения не было, но бомбежка привела в ярость местных жителей, которые обвинили нас в попытке изгнать их с их земель. Контрас подпитывают такие мысли и получили толчок в поддержке."
 contra_insurgency_options.11.d: "Последнее наступление сил Контра успешно изолировало Манагуа от остальной части страны. В столице это привело к тому, что многие протестующие требовали прекращения конфликта, растягивавшего ресурсы уже поредевшего Сандинистского правительства. С надвигающимся штурмом столицы сандинистское правительство, наконец, капитулировало, призывая к прекращению огня. Контрас согласился, и в течение дня Сандинистские войска согласились демобилизоваться и сдать столицу. Победоносные контрнаступления по всей стране праздновали, среди спорадических сообщений они совершали акты репрессий. В Манагуа представители средств массовой информации встретились с комитетом ведущих лидеров оппозиции, которые заявили, что быстро сформируют правительство и проведут свободные выборы. Когда их спрашивали о судьбе сандинистов или об их будущем участии в выборах, они просто заявляли, что время определит этот ответ. Хотя международные СМИ утверждают, что объявление свободных выборов является шагом в правильном направлении, многие в Никарагуа сомневаются, что они действительно состоятся."
 contra_insurgency_options.10.d: "Сандинистское правительство успешно мобилизовало свои вооруженные силы, чтобы остановить наступление контрас. Недавние наступательные операции вытеснили контрас из их безопасных убежищ и от населения. Поскольку возможности \"контрас\" были значительно ослаблены, а международное давление требовало прекращения боевых действий, сандинисты решили провести переговоры с \"контрас\". Побежденные \"контрас\" согласились демобилизовать своих бойцов и прекратить нападения на мирных жителей. После демобилизации \"контрас\" правительство согласилось провести выборы под наблюдением международных наблюдателей со всего региона. Хотя \"контрас\" и их сторонники пытались добиться выполнения обязательств по демобилизации, реальность их военного положения означала, что у них не было иного выбора, кроме как прекратить свою борьбу. Никарагуанцы с нетерпением ждут мира и проведения выборов в позитивной атмосфере. Сандинистское правительство получает международную похвалу за их беспристрастный подход к прекращению угрозы контры."
 contra_insurgency_Decisions: "Война Контрас"
 contra_insurgency_Decisions_desc: "Остатки режима Самосы, борцы против Самосы, преданные левыми, пришедшими к власти, и антикоммунистические никарагуанцы объединились, чтобы сформировать контрас. Они едины в своем противостоянии социалистическому Сандинистскому правительству и его посягательствам на их права и образ жизни. Они имеют тесные связи с Соединенными Штатами и другими антикоммунистическими государствами. Сандинистское правительство организует свои собственные силы, чтобы противостоять этой угрозе и сохранить свою революцию. Никарагуанские крестьяне оказываются зажатыми между двумя сторонами, поскольку они отчаянно борются за будущую судьбу Никарагуа.\n\nТекущая сила [?.contra_insurgency]%"
