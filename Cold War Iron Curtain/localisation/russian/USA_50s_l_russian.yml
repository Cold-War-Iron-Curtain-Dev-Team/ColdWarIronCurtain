 USA_50s_US_MIssile_Command_desc: "Стратегическое авиационное командование (САК) было создано 21 марта 1946 года. САК имел контроль над наземными стратегическими бомбардировщиками и МБР. САК также управлял всеми стратегическими разведывательными самолетами, и всеми стратегическими воздушными командными пунктами и всеми самолетами дозаправки ВВС США."
