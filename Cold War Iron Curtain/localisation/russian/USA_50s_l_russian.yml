 USA_50s_The_Decolonization_Debate_desc: "Империализму бросают вызов с двух сторон. С одной стороны, в различных империях растет волна национализма, что влечет за собой требования самоуправления и независимости. С другой стороны, растет осознание того, что вся идея исключительной империи принадлежит прошедшей эпохе; и что отсталые регионы мира как в отношении экономического развития, так и культурного прогресса следует рассматривать как ответственность, лежащую на международном сообществе в целом."
 USA_50s_Push_for_Decolonization_desc: "Мир меняется, и в этом новом мире нет места империализму."
 USA_50s_A_Return_to_Wilsonian_Diplomacy_desc: "Наша политика в отношении колонизации должна следовать Четырнадцати пунктам Вудро Вильсона, которые включают в себя упор на самоопределение народов, защиту распространения демократии, защиту распространения капитализма, поддержку коллективной безопасности и, по крайней мере, частичную оппозицию американскому изоляционизму."
