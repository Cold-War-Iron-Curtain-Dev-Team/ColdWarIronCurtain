 USA_50s_The_Navys_19th_Decade_desc: "После Второй мировой войны, военно-морской флот США стал самой мощной надводной и подводной силой в мире. Но новые угрозы бросают вызов тому, что может таиться на горизонте."
 USA_50s_Jets_For_The_Fleet: "Истребители для флота"
 USA_50s_Jets_For_The_Fleet_desc: "Наши истребительные эскадрильи ВМС США по-прежнему в значительной степени полагаются на винтокрылые самолеты. Чтобы противостоять вызовам холодной войны, мы должны заменить их современными реактивными самолетами."
 USA_50s_Nuclear_Depth_Charges: "Атомные глубинные бомбы"
 USA_50s_Focus_on_Sub_Detection: "Фокус на обнаружение субмарин"
 USA_50s_Focus_on_Sub_Detection_desc: "Early reports suggest that the Soviet are planning to build submarines in the hundred. They know they cannot match the power of our surface fleet which is why we need to be ever watchful of the underwater threat posed by submarines."
 USA_50s_The_Supercarrier: "Суперавианосец"
 USA_50s_The_Supercarrier_desc: "Авианосцы класса «Форрестол» представляли собой четыре авианосца, спроектированные и построенные для ВМС США в 1950-х годах. Это был первый класс суперавиансоцев, сочетавший в себе высокий тоннаж, палубные лифты и наклонную палубу. Первый корабль был сдан в эксплуатацию в 1955 году, последний списан в 1998 году."
 USA_50s_Navalised_Helicoptors: "Военно-морские вертолёты"
 USA_50s_Navalised_Helicoptors_desc: "Вертолеты, созданные для эсминцев, могут выполнять противолодочную службу с небольшой дистанцией. Если Холодная война когда-нибудь станет горячей, нам нужно сохранить морские пути, чтобы посылать подкрепление туда, где это необходимо."
 USA_50s_Improve_Naval_Illuminator_Radar: "Улучшить военно-морской осветитель радара"
 USA_50s_Charles_F_Adams_Class_DDG: "DDG класс «Чарльз Ф. Адамс»"
 USA_50s_Charles_F_Adams_Class_DDG_desc: "Класс Чарльза Ф. Адамса — корабль класса из 29 управляемых ракетных эсминцев (DDG), построенных в период с 1958 по 1967 год. Двадцать три эсминца были построены для военно-морского флота Соединенных Штатов, три для Королевского австралийского флота и три для западногерманского бундесмарина. Конструкция этих кораблей была основана на конструкции эсминцев класса «Форрест Шерман», но класс «Чарльз Ф. Адамс» был первым классом, предназначенным для использования в качестве управляемых ракетных эсминцев."
 USA_50s_The_Post_War_Airforce: "Послевоенные военно-воздушные силы"
 USA_50s_The_Post_War_Airforce_desc: "ВВС США были созданы как отдельное подразделение Вооруженных сил США 18 сентября 1947 года. ВВС США теперь отвечают за доставку большей части ядерного арсенала страны, и для нас будет крайне важно сохранить постоянное преимущество над Советами."
