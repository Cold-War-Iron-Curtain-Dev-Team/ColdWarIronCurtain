 USA_50s_The_French_Indochina_War_desc: "После 2-й Мировой войны вьетнамцы надеялись стать независимыми. Вместо этого французы повторно оккупировали территорию, в результате чего Вьетминь начал войну за освобождение своей страны. Поскольку война бушует, мы должны решить, как поддержать наших французских союзников."
 USA_50s_Diplomatic_Assurances_to_France_desc: "Мы уверяем французов, что поддерживаем их усилия дипломатически, возможно, даже в конце концов закончим войну мирным путем."
 USA_50s_Continue_Diplomatic_Meetings_desc: ""
 USA_50s_Bring_the_French_to_the_Negotiating_Table_desc: "Война в Индокитае продолжается, и конца ей не видно. Мы должны попытаться усадить французов за стол переговоров с Вьетминем."
