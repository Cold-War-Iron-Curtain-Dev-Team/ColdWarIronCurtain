l_russian:
 Red_Scare.1.d: "Во взрывной речи, произнесенной в Западной Вирджинии в День Линкольна, сенатор Джозеф Маккарти размахивал листком бумаги, на котором, как он утверждал, был список из 205 сотрудников Госдепартамента, подозреваемых в том, что они коммунисты. Он отметил, что, несмотря на выявленные коммунистические симпатии, они остались на своих позициях и формируют американскую внешнюю политику. Он призвал федеральное правительство укрепить свою решимость и удалить всех сочувствующих коммунистам из федеральных ведомств. Речь вызвала большое общественное внимание, и Маккарти теперь рассматривается как один из ведущих антикоммунистических крестоносцев в Сенате."
 Red_Scare.2.d: "Сенат Соединенных Штатов создал Подкомитет по внутренней безопасности Сената для расследования применения Закона о внутренней безопасности и других законов, связанных со шпионажем, проникновением и саботажем против Соединенных Штатов Америки. Комитет возглавляет сенатор Патрик Маккарран. Ожидается, что комитет сыграет важную роль в раскрытии коммунистических угроз Соединенным Штатам. Сенатор Джозеф Маккарти, ярый антикоммунистический крестоносец, не входит в комитет. Многие инсайдеры отмечают, что руководство Республиканской партии осторожно относится к Маккарти и его агрессивным обвинениям, поэтому они гарантировали, что он не будет в комитете."
 Red_Scare.3.d: "Влиятельная группа ветеранов, Американский легион, заявила о своей поддержке всех расследований потенциальных коммунистических симпатизантов и советских шпионов на территории США. Группа отмечает, что коммунизм является антитезой американской демократии и свободы. Тысячи американских солдат отдали свои жизни, чтобы защитить эти идеи, и миллионы служили, чтобы сохранить их. Из уважения к этим жертвам американское правительство обязано полностью расследовать и уничтожить эти угрозы Соединенным Штатам. С этим одобрением влиятельной группы политики по обе стороны прохода будут открыто поддерживать расследования, чтобы не потерять голоса ветеранов, которые составляют большой избирательный блок по всей стране."
 Red_Scare.4.d: "Большое жюри присяжных обвинило Джулиуса и Этель Розенберг в шпионаже и предательстве Соединенных Штатов. Они оба уже находятся под стражей после того, как Джулиус был арестован несколько месяцев назад после расследования ФБР, которое идентифицировало его как советского шпиона. Затем было создано Большое жюри присяжных, и во время этих слушаний Этель Розенберг также была арестована после того, как она дала показания. Муж и жена вскоре предстанут перед судом, поскольку правительство обвиняет обоих в руководстве мощной шпионской сетью, которая передавала американские ядерные секреты Советскому Союзу во время войны. Юлиус Розенберг, работавший на армию во время войны, обвиняется в вербовке агентов из сверхсекретного Манхэттенского проекта и предоставлении бесценной информации Советскому Союзу. Этель Розенбург обвиняется в том, что она помогала своему мужу в этих усилиях."
 Red_Scare.5.d: "Суд над Джулиусом и Этель Розенберг открылся в Нью-Йорке. Ожидается, что на суде будут представлены показания Дэвида Грингласа, который во время собственного допроса признался, что давал информацию советским агентам через Юлиуса Розенберга. Розенберги были обнаружены только за их предполагаемый шпионаж военного времени после недавнего признания ученого Манхэттенского проекта. Джулиуса и Этель обвиняют в организации мощной советской шпионской сети, которая помогла Советам быстро покончить с американской ядерной монополией. Говорят, что общественность возмущена тем, как легко Советы проникли в самую секретную военную операцию, и высокопоставленные чиновники обвиняют этих шпионов в том, что они позволили Советам быстро догнать Соединенные Штаты в области ядерных технологий. Розенберги демонстративно отрицают обвинения и, как ожидается, будут ссылаться на пятую поправку в суде."
 Red_Scare.6.d: "Присяжные на внимательно следившем за этим шпионском процессе Джулиуса и Этель Розенберг признали обоих виновными в убийстве. Судья по этому делу решил приговорить обоих к смертной казни. В своих комментариях судья отметил, что эти двое не только совершили шпионаж, но и позволили Советскому Союзу получить технологию, которая приободрила коммунизм во всем мире, обеспечив ему контроль над американской ядерной энергетикой. Он заявил, что любые американские смерти в послевоенной турбулентности могут быть обвинены в Розенбургах и сродни убийству, и за это они также должны быть наказаны. Юлиус Розенберг в своем собственном заявлении назвал процесс обманом и заявил, что его подставили ради политической выгоды. Американский народ внимательно следил за этим делом и, как говорят, был поражен масштабами и возможностями советского шпионажа."
 Red_Scare.7.d: "Большинство американцев всем сердцем поддерживают смертный приговор, вынесенный Джулиусу и Этель Розенбергам за их участие в передаче ядерных секретов Советскому Союзу. Однако растет движение, призывающее к помилованию Юлиуса и Этель Розенберг. В этой кампании участвуют не только коммунисты, но и те, кто выступает против смертной казни, и гуманисты. Говорят, что Папа Римский также высказался за смягчение приговора и передал свои опасения президенту. Эта кампания привлекла внимание нескольких известных международных ученых и лауреатов Нобелевской премии. Президент должен решить, отклонить ли ходатайство о помиловании или смягчить приговор. Смягчение приговора улучшило бы международный имидж Соединенных Штатов, однако это приведет к негативной реакции общественности внутри страны."
 Red_Scare.8.d: "Решение президента заменить приговор Джулиусу и Этель Розенбергам пожизненным заключением без права досрочного освобождения получило широкую международную оценку. Однако пресса в Соединенных Штатах выпотрошила президента. Кроме того, по всей территории Соединенных Штатов проходят крупные акции протеста с осуждением этого решения. Многие обвиняют президента в том, что он пресмыкается перед иностранцами и игнорирует пожелания американского народа. Другие обвиняют президента в мягкости по отношению к коммунистам и говорят, что это решение придаст смелости большему количеству коммунистов и советским шпионским операциям. Американские ветераны войны, в частности, возмущены, отмечая, что это решение было пощечиной для всех американцев, которые пошли на крайние жертвы в войне. Президент должен надеяться, что ему удастся восстановить утраченную поддержку избирателей."
 Red_Scare.9.d: "В печально известной тюрьме Синг-Синг в Нью-Йорке Джулиус и Этель Розенберг были казнены за свои преступления против Соединенных Штатов. Они были осуждены за предоставление сверхсекретной ядерной информации Советскому Союзу, что ускорило их ядерную программу. Затем тела были отправлены в Бруклин для похорон, а затем они были похоронены на кладбище Уэллвуд. Они оставляют после себя двоих несовершеннолетних детей. На похоронах присутствовали сотни людей, а у кладбища стояли многотысячные толпы. Очевидно, что на этих двоих смотрят как на мучеников для многих присутствующих, которые видят в казни подтверждение того, что Соединенные Штаты медленно отворачиваются от своих либеральных идеалов и переходят к деспотическому правлению. Однако большинство американцев приветствовали эту новость как справедливость."
 Red_Scare.10.d: "Сенатор Джозеф Маккарти, рассматриваемый многими в его партии как неконтролируемая свободная пушка, продолжает расти в популярности. Газеты почти ежедневно публикуют сообщения о его претензиях и обвинениях в коммунистическом проникновении в правительство. Многие в Конгрессе следуют его примеру, надеясь, что их собственная антикоммунистическая риторика привлечет к ним внимание и голоса. По всей территории Соединенных Штатов многие американцы поддерживают его исследования и продвигают их дальше. Они добиваются изъятия книг, фильмов и даже чиновников, подозреваемых в симпатиях к коммунистам. Маккарти продолжает набирать популярность и влияние, и многие называют его кампанию против коммунизма маккартизмом."
 Red_Scare.11.d: "Сенатор Джозеф Маккарти объявил СМИ о своих намерениях исследовать лабораторию армейского корпуса связи в Нью-Джерси. Спорный сенатор утверждает, что в лаборатории существует шпионская сеть ученых, и армия не смогла должным образом справиться с ситуацией. Через несколько недель Маккарти признал, что в лаборатории нет никаких свидетельств существования коммунистических шпионских групп. Говорят, что армия в ярости от обвинений Маккарти. Сенатор Маккарти, однако, недавно получил сообщение о майоре в армии майоре, который был обнаружен как член опасной левой партии, но не был отстранен от службы. Некоторые союзники Маккарти призывают его прекратить расследование в отношении армии и перейти в Государственный департамент, но сенатор, похоже, сосредоточен на том, чтобы доказать, что военные ошибаются."
 Red_Scare.12.d: "Сенатор Маккарти начал задавать вопросы армии в связи с делом майора Ирвинга Пересса. Маккарти отметил, что армейский дантист, как выяснилось, был бывшим членом Американской рабочей партии. Он также оставил незаполненным раздел о политических пристрастиях в анкете лояльности. Маккарти хотел знать, почему армии потребовалось девяносто дней, чтобы уволить майора со службы. Майор Пересс был уволен своим командиром с почетом. Армия утверждает, что провела расследование и процесс в соответствии с процедурой, но Маккарти заявил: "Кто повысил Пересса?". Эта цитата стала кличем антикоммунистов и сторонников Маккарти по всей стране. Армия, как говорят, кипит."
 Red_Scare.13.d: "Армия недавно обвинила сенатора Джозефа Маккарти и его главного адвоката Роя Кона в использовании своего положения для получения благоприятного отношения к бывшему помощнику, который в настоящее время служит рядовым. Маккарти осудил эти обвинения, и инцидент будет расследован Постоянным подкомитетом Сената по расследованиям. Слушания будут транслироваться по национальному телевидению и, как ожидается, продлятся более месяца. Маккарти уверен, что слушания оправдают его, в то время как армия планирует использовать информацию от адвоката, знакомого с Маккарти, чтобы спланировать свою собственную стратегию. Маккарти должен тщательно спланировать свой подход."
 Red_Scare.14.d: "Джозеф Найл Уэлч, главный адвокат армии, вступил в серьезную перепалку с сенатором Джозефом Маккарти во время проходящих слушаний. Уэлч потребовал от Роя Кона предоставить список из 130 имен коммунистов или диверсантов в оборонном аппарате, который, как утверждал Маккарти, у него есть. В ответ сенатор Маккарти заявил, что Уэлчу следует заняться собственной юридической фирмой, поскольку Фред Фишер принадлежал к прогрессивной ассоциации юристов. Уэлч выступил в защиту Фишера, а в конце своего страстного ответа сказал: "Давайте не будем больше убивать этого человека, сенатор. Вы уже достаточно сделали. Неужели у вас нет чувства приличия?", после чего зал разразился аплодисментами. Это подчеркивает, что публичное выступление открыло Маккарти для критики за хулиганство и негативную рекламу."
 Red_Scare.15.d: "Слушания между армией и Маккарти закончились тем, что ни одна из сторон не добилась победы. Армия смогла доказать, что Рой Кон вмешивался в дела армии, но сенатор Маккарти был оправдан. Было установлено, что военный министр вмешивался в недавнее расследование Лаборатории Армейского корпуса связи в Нью-Джерси. Однако огласка слушаний и освещение в СМИ представили общественности весьма неприятный образ сенатора Маккарти. Многие теперь видят в нем хулигана и прядильщика лжи. Репутация сенатора и его сторонников находится на небывало низком уровне."
 Red_Scare.16.d: "Слушания между армией и Маккарти закончились тем, что ни одна из сторон не добилась победы. Армия смогла доказать, что Рой Кон вмешивался в дела армии, но сенатор Маккарти был оправдан. Было установлено, что военный министр вмешивался в недавнее расследование Лаборатории Армейского корпуса связи в Нью-Джерси. Многие наблюдатели были поражены тем, как сдержанно и порой спокойно Маккарти вел себя во время слушаний. По-видимому, военные советники были несколько удивлены и надеялись спровоцировать некоторые вспышки гнева со стороны сенатора. Освещение в средствах массовой информации было довольно обширным, но не изменило в значительной степени мнение общественности о том, что преследование коммунистов должно продолжаться."
 Red_Scare.17.d: "Сенатор Маккарти недавно провел слушания, ставящие под сомнение лояльность старших офицеров в армии. Сенатор отметил, что подозреваемые коммунисты и диверсанты могли передавать отчеты о проверке лояльности. Он спросил, почему некоторые офицеры тянут время или ворчат по поводу процедур, предназначенных для защиты Соединенных Штатов от внутренних угроз. Его комментарии завоевали популярность среди американского народа, но также и среди людей в Пентагоне. Некоторые высокопоставленные чиновники министерства обороны в частном порядке опасаются, что эти комментарии приведут к напряженности внутри вооруженных сил, поскольку офицеры начнут подозревать друг друга."
 Red_Scare.18.d: "Сенат недавно проголосовал за осуждение сенатора Джозефа Маккарти. Его обвиняют в издевательской тактике, не подобающей сенатору, и в искажении правды ради личной политической выгоды. Голосование последовало после его неудачного выступления на слушаниях по делу армии и Маккарти. Это в сочетании с другими его неудачными расследованиями и зажигательными обвинениями заставило его политических и общественных союзников дистанцироваться от него. Тот факт, что многие из его коллег-республиканцев поддержали голосование, свидетельствует о двухпартийном неприятии сенатора."
 Red_Scare.19.d: "Недавнее осуждение сенатом сенатора Джозефа Маккарти последовало за гораздо более широкой общественной реакцией против сенатора и маккартизма. Многие редакционные статьи теперь критикуют сенатора за то, что он нагнетает общественные эмоции и страх, чтобы привлечь внимание. Его также обвиняют в попытке начать публичную охоту на ведьм, которая противоречит американским ценностям. Многие из его политических оппонентов также призывают Маккарти разрушить имидж и карьеру бесчисленных людей в стране. Это сигнализирует о том, что эпоха антикоммунистического маккартизма, возможно, подходит к концу."
 Red_Scare.20.d: "Сенатор Маккарти недавно начал серию расследований против Государственного департамента. Сенатор утверждал, что сотни коммунистов и диверсантов формируют внешнюю политику. Представители Госдепартамента отрицали эти обвинения, однако общественность порой оказывалась очарованной этими утверждениями. В конце концов ряд чиновников Госдепартамента либо подали в отставку, либо тихо удалились, чтобы избежать пристального внимания и смущения. Похоже, что маккартизм продолжает оставаться сильным, и Маккарти остается на вершине."
 Red_Scare.21.d: "Американский народ был ошеломлен, услышав новость о том, что сенатор Джозеф Маккарти скончался, по-видимому, от острого гепатита. Покойный сенатор скончался в военно-морском госпитале Бетесды. В течение многих лет Маккарти был лицом расследований Конгресса о коммунистической инфильтрации и шпионских сетях в федеральном правительстве и вооруженных силах. Маккарти стал тезкой маккартизма, и, несмотря на его уход, общественный интерес и озабоченность коммунизмом в Соединенных Штатах продолжаются. Многие ведущие американские политики и деятели выступили с заявлениями, в которых выразили свое восхищение покойным сенатором."
 Red_Scare.22.d: "В последние недели военные стали свидетелями всплеска отставок после слушаний о лояльности офицеров. Похоже, многие в армии, опасаясь, что более глубокое расследование повлияет на моральный дух и организацию, предпочли уйти в отставку, вместо того чтобы затягивать процесс. Несколько старших генералов и адмиралов подали в отставку или досрочно ушли в отставку. Пентагон также объявил о новых директивах, направленных на более упорядоченное расследование и процесс удаления диверсантов из рядов. Отчеты о проверке лояльности также обновляются, чтобы быть более эффективными. Многие отставные офицеры осуждают политическое вмешательство в военные дела и опасаются, что военным потребуется время, чтобы восстановить свою боеспособность."
 Red_Scare.23.d: "Сенатор Джозеф Маккарти скончался от острого гепатита в военно-морском госпитале Бетесды. Некоторые журналисты предполагают, что это могло быть от алкоголизма, но это не было подтверждено. Сенатор Маккарти был лицом расследования Конгресса о коммунистическом и подрывном влиянии в федеральном правительстве. Первоначально он привлек внимание общественности, поскольку многие американцы были обеспокоены после раскрытия обширных советских шпионских сетей, существовавших во время Второй мировой войны. Однако недавно сенат осудил его за агрессивные расспросы во время слушаний и многочисленные необоснованные обвинения. Общественное мнение также значительно снизилось. Многие считают, что популярность маккартизма закончится с его смертью."
  
 Red_Scare_Cul.1.d: "После смерти судей Фрэнка Мерфи и Уайли Ратледжа, разделенных всего несколькими месяцами, внимание к судебной системе Соединенных Штатов возобновилось. Эти две вакансии должны быть заполнены президентом, и политические наблюдатели по всей стране ожидают его выдвижения. Некоторые считают, что президент может выбрать двух консервативных юристов. Это поможет правительству в тех случаях, когда речь идет об опасных диссидентах или угрозах национальной безопасности. Другие предполагают, что разумным шагом может быть назначение либеральных судей, чтобы помочь будущим усилиям по защите гражданских свобод и гражданских прав."
 Red_Scare_Cul.2.d: "Так называемая Голливудская десятка увидела, что их осуждение за неуважение к Конгрессу было поддержано в Верховном суде. Суд отказался рассматривать их дело, подтвердив обвинительный приговор. Все десять бывших голливудских писателей и режиссеров вскоре должны будут заплатить штраф и отбыть наказание в виде одного года тюрьмы. Обвинительный приговор был вынесен после того, как обвиняемые не дали показаний в Комитете по антиамериканской деятельности Палаты представителей по обвинениям в том, что они были членами Коммунистической партии. Обвиняемые действительно пытались читать заявления, осуждающие комитет и его действия, но конгрессмены часто отвергали их или относились к ним враждебно. Надежды на то, что Верховный суд вынесет решение в пользу "Голливудской десятки" и заявит, что приговоры являются нарушением конституции, были отвергнуты судом."
 Red_Scare_Cul.3.d: "Голливудская десятка сегодня начинает свое годичное тюремное заключение. Группа бывших голливудских режиссеров и писателей была осуждена за неуважение к Конгрессу за отказ давать показания перед Комитетом по антиамериканской деятельности Палаты представителей по обвинениям в том, что они были членами Коммунистической партии. Осужденные утверждали, что они не обязаны отвечать на вопросы в соответствии с Первой поправкой, и утверждали, что сам комитет является неконституционным. Однако их доводы не были убедительными, и Верховный суд в конечном итоге решил не пересматривать дело, поддержав обвинительные приговоры. Многие либеральные американцы считают, что это означает поражение прав личности в стране."
 Red_Scare_Cul.4.d: "В неожиданном постановлении Верховный суд объявил, что рассмотрит апелляцию так называемой Голливудской десятки против их годичного тюремного заключения. Десять бывших режиссеров и сценаристов были осуждены за неуважение к Конгрессу за отказ отвечать на вопросы Комитета по антиамериканской деятельности Палаты представителей. Многие консервативные газеты ставят под сомнение недавнее назначение либеральных судей в суды и утверждают, что пересмотр дела не сулит ничего хорошего для будущих усилий правительства по искоренению коммунизма и инакомыслия в стране. Более либеральные газеты выступают за то, чтобы Верховный суд прислушивался к голосу разума и проверял власть все более выходящего из-под контроля федерального правительства."
 Red_Scare_Cul.5.d: "В беспрецедентном шаге глава Комитета Палаты Представителей по антиамериканской деятельности опубликовал заявление, осуждающее Верховный суд за рассмотрение апелляции Голливудской десятки. Конгрессмен отметил, что такие действия являются явным судебным переворотом и подрывают усилия конгресса и правительства по борьбе с угрозой иностранного коммунистического влияния в стране. Предателям, шпионам и врагам Соединенных Штатов нельзя позволять прятаться за судами и свободами, гарантированными конституцией, чтобы уничтожить священную республику."
 Red_Scare_Cul.6.d: "Режиссер Эдвард Дмитрик, один из осужденных Голливудской десятки, опубликовал публичное заявление prision, в котором осудил Коммунистическую партию за то, что она использовала его и его коллег-соучастников в качестве инструментов для продвижения своей повестки дня. Дмитрий пытался сбежать из тюрьмы, сбежав в Англию до того, как его могли взять под стражу, однако после того, как срок его паспорта истек, он вернулся в Соединенные Штаты и был арестован. Он поклялся, наконец, предстать перед Комитетом по антиамериканской деятельности Палаты представителей, чтобы все прояснить и назвать коммунистов в Голливуде."
 Red_Scare_Cul.7.d: "Режиссер Эдвард Дмитрик предстал перед Комитетом Палаты Представителей по антиамериканской деятельности, чтобы дать показания о коммунистах в Голливуде. Директор ранее отказался давать показания и в результате был арестован на один год. Теперь он утверждал, что коммунисты использовали его в своих пропагандистских целях, и теперь охотно давал показания. Во время дачи показаний Дмитрий признался, что в 1945 году ненадолго вступил в Коммунистическую партию, и перечислил 21 коммуниста, включая семерых директоров. Дмитрий показал, что обнаружение коммунистических шпионских ячеек в федеральном правительстве и международная коммунистическая агрессия также были основными факторами в его решении дать показания."
 Red_Scare_Cul.8.d: "Всего через два года после дачи показаний в Комитете по антиамериканской деятельности Палаты представителей бывший член Голливудской десятки Эдвард Дмитрик переживает возрождение своей режиссерской карьеры. После дачи показаний он снял несколько фильмов, в том числе один с восходящим голливудским актером Кирком Дугласом. Ходят слухи, что вскоре он может быть выбран режиссером предстоящего фильма с Хамфри Богартом в главной роли, который, по мнению наблюдателей, может стать большим хитом во время Оскаровского сезона. Похоже, что его раскаяние и осуждение коммунизма было ключевым моментом, поскольку все остальные члены Голливудской десятки продолжают оставаться в черных списках по всей киноиндустрии. Голливудские инсайдеры полагают, что студии опасаются публичной реакции, если они будут нанимать людей, считающихся сторонниками коммунистов."
 Red_Scare_Cul.9.d: "11 лидеров Коммунистической партии Соединенных Штатов Америки (CPUSA) были обвинены в соответствии с Законом Смита 1940 года в заговоре с целью свержения правительства. Аресты последовали за недавними публичными судебными процессами над советскими шпионами и слушаниями в Конгрессе по коммунистическим агентам в американском обществе. Говорили, что ФБР под руководством Эдгара Гувера сыграло важную роль в сборе доказательств по этому делу. Утечки в СМИ предполагают, что ФБР использовало информаторов и другие разведывательные инструменты для завершения своего расследования. Все арестованные - члены Национального совета по делам КПСС. Источник в следственной группе предполагает, что число обвиняемых может вырасти до ста. Эта новость потрясла общественность, особенно после того, как стало известно, что во время войны КПЮА насчитывала 80 000 членов."
 Red_Scare_Cul.10.d: "Судебный процесс над лидерами Коммунистической партии Соединенных Штатов Америки (CPUSA) усилился, когда пять адвокатов защиты поставили под сомнение цель судебного процесса и неспособность суда обеспечить беспристрастное жюри присяжных или поддерживать порядок. Это относится к тому, что многие репортеры называют карнавальной атмосферой, поскольку суд по-прежнему переполнен репортерами и зеваками, многие бросают оскорбления в адрес подсудимых и их адвокатов. Обвиняемые лидеры КПЮСА защищаются пятью адвокатами-добровольцами, которые утверждают, что это дело противоречит основным принципам свободы слова и прав человека. Обвинение утверждает, что обвиняемые активно сотрудничали с Советским Союзом и готовили вооруженную революцию против Соединенных Штатов с 1945 года. Газеты и передовицы в основном поддерживают обвинение."
 Red_Scare_Cul.11.d: "Суд над лидерами Коммунистической партии Соединенных Штатов Америки (CPUSA) продолжает подвергаться критике со стороны защитников свободы слова и лидеров гражданских прав, которые отмечают, как новости о других обвинениях советских шпионов широко распространяются в зале суда. Недавние обвинительные приговоры по этим делам, которые не связаны с нынешним судебным процессом, питают общественное беспокойство по поводу коммунистического проникновения. Адвокаты лидера КПУСА предполагают, что эти дела используются обвинением, чтобы вызвать страх у присяжных. Учитывая все это, а также огромное количество репортажей и зрителей, как можно было не повлиять на жюри?"
 Red_Scare_Cul.12.d: "Во второй раз во время судебного процесса над лидерами Коммунистической партии Соединенных Штатов Америки (CPUSA) судья объявил, что все пять адвокатов защиты будут привлечены к ответственности за неуважение к суду и наказаны по завершении судебного процесса. Это происходит после того, как защита в очередной раз ставит под сомнение обоснованность и законность судебного разбирательства, отмечая проблемы с процессом отбора присяжных и временами разрушительную атмосферу зрителей. Судья постоянно отрицает эти претензии и обвиняет защиту в том, что она издевается над судом и использует тактику затягивания. Некоторые видные юристы выразили обеспокоенность действиями судьи."
 Red_Scare_Cul.13.d: "Суд над лидерами Коммунистической партии Соединенных Штатов Америки (CPUSA) закончился тем, что присяжные признали всех подсудимых виновными. Десять из них были оштрафованы и приговорены к пяти годам лишения свободы. Одиннадцатому, ветерану Второй мировой войны Роберту Томпсону, дали три года из уважения к его военной службе. Затем судья приговорил всех пятерых адвокатов защиты за неуважение к суду, приговорив их к тюремному заключению сроком от одного месяца до шести месяцев. Общественность в основном поддерживала приговоры, однако юридические наблюдатели были разочарованы приговором, который, по их словам, показал, что судья проявляет мстительный характер к адвокатам защиты. Некоторые адвокаты дошли до того, что согласились с утверждением подсудимого о том, что суд как суд кенгуру. Несмотря на это, общественность, по-видимому, поддерживает эти приговоры как пример того, что справедливость поддерживается."
 Red_Scare_Cul.14.d: "Коммунистическая партия Соединенных Штатов Америки (CPUSA) заявила, что будет обжаловать все обвинительные приговоры, вынесенные недавно завершившимся судом над партийными лидерами. Они были осуждены за нарушение Закона Смита, призывая к свержению американского правительства. Защита КПУСА утверждала, что ее члены просто выражали свои права по Первой поправке и утверждали, что никто не выступал за насильственное свержение, а за мирный переход к социализму. Судебный процесс привлек внимание общественности к иностранному коммунистическому влиянию в Соединенных Штатах и общественному гневу по отношению к КПСС. Адвокаты защиты на протяжении всего процесса отмечали враждебную галерею и судебные разбирательства, что в значительной степени благоприятствовало обвинению. Это привело в ярость судью, который обвинил адвокатов в неуважении к суду и осудил их в конце процесса. КПСС надеется, что Верховный суд рассмотрит их апелляцию."
 Red_Scare_Cul.15.d: "Генеральный секретарь Коммунистической партии Соединенных Штатов (CPUSA) Юджин Деннис был осужден в соответствии с Законом Смита, поддержанным главным решением Верховного суда. Судьи постановили, что Деннис не имеет защиты Первой поправки, если он пользуется этими правами, чтобы выступать за свержение правительства. Решение суда является серьезным ударом для тех коммунистических лидеров, которые были осуждены в ходе судебных процессов над лидерами КПСС по Закону Смита. Наблюдатели отмечают, что недавнее назначение консервативных судей на скамью подсудимых, скорее всего, склонило суды в пользу правительства."
 Red_Scare_Cul.16.d: "Верховный суд оставил в силе приговоры адвокатов защиты, вынесенные в ходе недавних судебных процессов над лидерами Коммунистической партии Соединенных Штатов (КПУСА) за нарушение Закона Смита. На протяжении всего процесса адвокаты жаловались на несправедливые процедуры и предубеждения в пользу обвинения. Они также отметили враждебную галерею и негативную прессу, покрывающую нацию. В конце процесса судья приказал задержать всех адвокатов защиты и приговорил их к различным срокам тюремного заключения за неуважение к суду. Многие считают, что судья был настолько враждебен, поскольку он чувствовал, что защита намеренно пытается вызвать неправильное судебное разбирательство. Верховный суд решил сосредоточиться только на небольшом аспекте обвинения в неуважении к суду и объявил приговор оправданным, поддержав приговоры."
 Red_Scare_Cul.17.d: "В шоковом решении Верховный суд отменил приговоры адвокатов защиты от недавних судебных процессов над лидерами Коммунистической партии Соединенных Штатов (CPUSA) за нарушение Закона Смита. Судья первой инстанции осудил их, обвинив в том, что они намеренно пытались спровоцировать зал суда, чтобы добиться судебного разбирательства. Судьи Верховного суда отметили, что приговоры казались мстительными, особенно когда судья записывал как "незаконченное дело", прежде чем вынести свои приговоры. Судьи также подвергли сомнению неспособность адвокатов защитить себя и их немедленный арест. Ожидается, что реакция общественности будет негативной, и многие обвинят президента в том, что он привел в Верховный суд более либеральных судей."
 Red_Scare_Cul.18.d: "Верховный суд шокировал общественность своим решением отменить приговор Юджину Деннису в соответствии с Законом Смита. Деннис, генеральный секретарь Коммунистической партии Соединенных Штатов (CPUSA), был осужден за пропаганду насильственного свержения Соединенных Штатов. Суд постановил, что Деннис не нарушал Закон, и все его действия были защищены Первой поправкой к конституции. Кроме того, суд также отметил, что условия на суде не были идеальными или благоприятными для защиты, и наказал судью первой инстанции. Ошеломляющее решение, скорее всего, вызовет гнев правительства, а также широкой общественности, которая подавляющим большинством поддержала правительство и его убеждения."
 Red_Scare_Cul.19.d: "Газеты по всем Соединенным Штатам критикуют Верховный суд и его решение отменить приговор Юджину Деннису, Генеральному секретарю Коммунистической партии Соединенных Штатов (КПУСА). Он был осужден по Закону Смита за подстрекательство к насильственному свержению правительства Соединенных Штатов. Верховный суд постановил, что Деннис не нарушал закон и не может быть осужден за осуществление своих прав по Первой поправке. Процесс захватил всю страну, особенно жителей Нью-Йорка, которые начали понимать, что коммунистическая угроза распространяется не только на иностранных шпионов, но и на других американцев. Жители Нью-Йорка тоже устраивали акции протеста. Многие американцы считают, что суды слишком мягки к врагам государства, которые прячутся за конституционной защитой, и считают, что суд критически ослабил способность правительства защищать нацию."
 Red_Scare_Cul.20.d: "После спорных решений Верховного суда, которые, по мнению многих, полностью подрывают способность правительства наказывать и арестовывать коммунистических лазутчиков, пламенный антикоммунистический сенатор Джозеф Маккарти созвал пресс-конференцию. В своих комментариях сенатор осудил Верховный суд, особенно двух недавно назначенных судей, которые, по его мнению, могут иметь крайне левые тенденции. Он отметил, что судебные решения кажутся противоречащими другим судебным решениям, вынесенным по всей стране, и опасается, что коммунизм может попытаться проникнуть в судебную систему. Сенатор Маккарти призвал Комитет Палаты представителей по антиамериканской деятельности расследовать деятельность судей и убедиться в отсутствии коммунистического заговора, заражающего судебную систему."
 Red_Scare_Cul.21.d: "Комитет по антиамериканской деятельности Палаты представителей в беспрецедентном порядке потребовал от двух недавно назначенных судей Верховного суда представить письменные ответы на вопросы, касающиеся недавних дел, связанных с переворотом осужденных коммунистов. Кроме того, возникнут вопросы относительно прошлых политических обязательств и убеждений судей. Комитет заявил, что ответы будут зачитаны во время предстоящего слушания по судьям и дадут ответы и, надеюсь, облегчение обеспокоенным американцам, испытывающим дискомфорт от недавних действий суда. Отказ от ответа конгрессу может привести к вызову в суд из конгресса, заставляя их присутствовать на слушаниях."
 Red_Scare_Cul.22.d: "Комитет по антиамериканской деятельности Палаты Представителей зачитал официальный ответ двух судей Верховного суда на вопросы комитета. Члены комитета, репортеры и наблюдатели были ошеломлены молчанием. Судьи систематически защищали свои действия и прошлое. Они также нашли время, чтобы объяснить свои действия американскому народу как действия, построенные на сохранении их индивидуальных прав и ограничении правительственного произвола. Красноречивые ответы вскоре будут опубликованы в национальных средствах массовой информации. После прочтения документов несколько членов комитета предложили свой собственный бурный ответ, но HUAC решил отложить следующее слушание по судьям до конца выходных. Наблюдатели считают, что комитет хочет увидеть реакцию общественности, прежде чем принять решение о продолжении расследования."
 Red_Scare_Cul.23.d: "Общественное мнение по поводу расследования Комитетом Палаты Представителей по антиамериканской деятельности двух недавно назначенных судей Верховного суда испортилось. Стенограммы и передовицы газетных редакторов отражают общее мнение о том, что многие рассматривают расследование HUAC как политическую вендетту и попытку подорвать судебную власть. Большинство американцев не убеждает мысль о том, что судьи тайно связаны с коммунистической угрозой. Из-за этой негативной реакции HUAC решил закончить свое расследование как можно раньше и сосредоточиться на более насущных вопросах."
 Red_Scare_Cul.24.d: "Общественная реакция на Комитет Палаты Представителей по антиамериканской деятельности и его расследование в отношении двух недавно назначенных судей Верховного суда очень благоприятствует HUAC. Стенограммы и передовицы газетных редакторов отражают убеждение многих, что расследование Палаты разоблачает опасный левый уклон в высшем суде страны. Многие американцы считают, что расследование в отношении судей должно быть распространено на все суды, чтобы предотвратить коммунистический план избежать государственного преследования. Сторонники судебной системы опасаются, что такая реакция только подорвет способность судей выносить справедливые решения."
 Red_Scare_Cul.25.d: "Два судьи Верховного суда, проходящие расследование Комитетом Палаты Представителей по антиамериканской деятельности, подали сегодня в отставку. Судьи отмечают, что они не хотят быть отвлекающим фактором или даже казаться запятнанными судом; таким образом, они уйдут в отставку. В своем заявлении оба судьи подчеркнули, что уходят в отставку не из чувства вины, а из желания защитить судебную систему и ее принципы. Ожидается, что президент заменит судей на более консервативных, поскольку он не захочет, чтобы этот сценарий повторился."
 Red_Scare_Cul.26.d: "В последние дни были приведены к присяге два новых судьи Верховного суда. Это произошло после скандальной отставки двух судей после их роли в отмене нескольких антикоммунистических обвинений по конституционным основаниям. Это привело к негативной реакции общественности и Конгресса, в результате которой судьи подали в отставку. Президент, читая настроения в стране, быстро выбрал двух новых консервативных судей с сильными антикоммунистическими предубеждениями, чтобы предотвратить дальнейшее судебное вмешательство в федеральные дела против коммунизма."
 Red_Scare_Cul.27.d: "Два судьи Верховного суда дали показания перед Комитетом Палаты Представителей по антиамериканской деятельности (HUAC), отвечая на повестку комитета. Некоторые конгрессмены воспользовались случаем, чтобы раскритиковать судей за их вмешательство в недавние судебные дела, направленные против коммунистических угроз Соединенным Штатам. Они также потребовали от судей полного отчета об их прошлых связях или связях с левыми лицами или организациями. Однако судьи были опытными знатоками закона и зала суда, они предлагали сильные защиты и заявления, которые часто перехитряли их критиков. В конечном счете они заявили, что их недавние решения были основаны не на идеологических балансах, а на конституционной законности, и предупредили, что их решения помогут гарантировать, что никакая гнусная идеология не сможет использовать суды против народа Соединенных Штатов. Хотя судьи умело защищались на слушаниях, еще неизвестно, как отреагирует американская общественность на стенограммы."
 Red_Scare_Cul.28.d: "Верховный суд Соединенных Штатов постановил отменить приговор коммунистическим лидерам низкого уровня, осужденным в соответствии с Законом Смита за то, что они были членами организации, которая выступала за насильственное свержение правительства. В знаковом постановлении суд постановил, что пункт Закона Смита, касающийся субъектов, выступающих за насильственное свержение правительства США, не распространяется на тех, кто только верит в насильственное свержение, но не выступает за его свержение. Таким образом,суд отменил приговор коммунистическому лидеру на том основании, что его права по Первой поправке были нарушены. Ожидается, что реакция конгресса, Белого дома и органов безопасности будет негативной, но суд, похоже, намерен не позволять общественному рвению диктовать судебные нормы."
 Red_Scare_Cul.29.d: "Верховный суд Соединенных Штатов постановил поддержать приговоры коммунистических лидеров низкого уровня, осужденных в соответствии с Законом Смита. Суд согласился с первоначальным решением о том, что Закон Смита не нарушает Первую поправку и осужденные были вовлечены в организацию, которая верила в насильственное свержение правительства. Особое мнение утверждало, что суд не учел разницу между убеждениями и фактической пропагандой свержения, и сегодняшнее решение не оставило многих невинных американцев уязвимыми. Несмотря на это, решение суда высоко оценивается на Капитолийском холме, в Белом доме и среди силовых ведомств, которые считают, что суд должен продолжать поддерживать усилия по защите Соединенных Штатов. Некоторые газетные передовицы критиковали суды и утверждали, что недавняя общественная реакция и назначения стоили суду любого подобия судебной независимости."
 Red_Scare_Cul.30.d: "Верховный суд постановил отменить обвинительные приговоры в отношении так называемой Голливудской десятки. Эти писатели и режиссеры были обвинены в отказе предстать перед Комитетом Палаты представителей по антиамериканской деятельности, чтобы назвать коммунистов в киноиндустрии. Новые прогрессивные судьи на скамье подсудимых сместили голосование, чтобы отменить приговоры. Это решение широко критикуется консервативными газетами и конгрессменами, которые обвиняют суд во вмешательстве в защиту национальной безопасности Соединенных Штатов. Верховный суд признал приговоры и тюремные сроки неконституционными и чрезмерными. Суд занял твердую позицию в защиту личных свобод."
