 EGY_60s_fix_the_infrastucture_problem: "Модернизация инфраструктуры"
 EGY_60s_fix_the_infrastucture_problem_desc: "Нам нужно соединить между собой сельские районы нашей страны. Наши предыдущие планы инфраструктуры не были расчитаны на массу сельких поселений, котоыре у нас есть."
 EGY_60s_mobilize_workers: "Мобилизация рабочей силы"
