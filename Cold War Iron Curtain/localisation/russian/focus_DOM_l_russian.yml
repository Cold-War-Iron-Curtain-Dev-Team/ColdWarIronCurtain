 DOM_MIL.1.d:0 "Доминиканская Республика запросила разрешение на покупку новых самолетов для расширения своих ВВС в условиях растущих региональных проблем. В списке пожеланий правительства есть как истребители, так и бомбардировщики. Хотя доминиканцы настаивают на том, что их программа направлена на собственную оборону, выступления и позиция нынешнего правительства указывают на то, что оно стремится получить такое вооружение для потенциального расширения своего влияния в регионе. По мнению нашей разведки, правительство Доминиканской Республики может без колебаний применить военную силу для разрешения региональных или внутренних споров. В связи с этим некоторые считают, что мы должны противостоять любым попыткам Доминиканской Республики расширить свою военно-воздушную мощь, как за счёт нас, так и за счёт наших союзников. Принятие просьбы Доминиканской Республики укрепит её антикоммунистическую решимость и улучшит отношения. Однако это может вызвать отторжение других карибских держав и привести к региональным конфликтам, что может усилить коммунистов в регионе."
 DOM_MIL.2.d:0 "США согласились на нашу просьбу о расширении ВВС за счёт покупки новых самолётов. Страны Карибского бассейна сталкиваются с растущими угрозами со стороны коммунистов, повстанцев и агрессивных режимов. Расширение ВВС позволит нам решить эту проблему, сохранить порядок и защитить наши границы. В настоящее время ВВС завершают согласование с США списка необходимых самолетов, поскольку мы настаиваем на быстрой передаче активов. Американское правительство явно видит в Доминиканской Республике авангард для региона."
 DOM_MIL.3.d:0 "США отклонили нашу просьбу о расширении ВВС за счёт покупки новых самолётов. Мы считаем, что враги и противники доминиканской нации саботировали эту попытку. Запасной план по обращению к Канаде с просьбой о покупке самолётов также был отклонен, так как наши бывшие оккупанты вынудили их прекратить эти переговоры. Доминиканская Республика находится на критическом этапе, сталкиваясь с угрозами со всех сторон, и мы должны быть авангардом для Карибского бассейна. Несмотря на эту неудачу, агенты и дипломаты будут направлены на поиски альтернативных источников."
 DOM_Nationalism.1.d:0 "Президент Рафаэль Трухильо долгое время выступал за создание прочной границы, первоначально выдворяя гаитян и воспитывая чувство патриотизма у жителей приграничных провинций. Для этого проводилась военная, экономическая, религиозная и образовательная политика. В рамках этой постоянной программы правительство объявило о ряде новых стимулов, призывающих доминиканцев переезжать и заселять приграничные с Гаити районы. Начиная с 1930-х годов, новые школы, больницы, дороги, жилье и здания превратили приграничную территорию в витрину доминиканской культуры. Учителям, специалистам и рабочим предлагаются льготы, чтобы активизировать усилия по созданию единой доминиканской нации."
 Antihatianismo_DOM.1.d:0 "Напряжённые отношения с Гаити существовали десятилетиями, однако президент Рафаэль Трухильо превратил распространённые среди населения антигаитянские настроения в государственную политику. Придя к власти в 1930-х годах, президент Трухильо руководил насильственным изгнанием тысяч 'гаитян' с границы, в том числе чернокожего испаноязычного населения, которое проживало в этих населенных пунктах на протяжении многих поколений. Кроме того, было широко распространено насилие, в том числе массовые убийства, совершенные доминиканскими солдатами. Трухильо также развернул при поддержке доминиканской интеллигенции широкую культурную кампанию, направленную на то, чтобы противопоставить культуру вуду католицизму. Эти действия в значительной степени узаконили антигаитянское насилие и поставили гаитянско-доминиканское население в положение сильного страха и незащищенности."
 DOM_Political.1.d:0 "Президент дал указание министерству иностранных дел и спецслужбам направить ресурсы и агентов для усиления поддержки Доминиканской Республики в США. Наши враги уже давно навязывают нам враждебное представление о нашей стране, и с этим необходимо бороться любыми способами. Наше правительство поддерживает тесные контакты в Майами, особенно с американскими бизнесменами, имеющими тесные связи с карибскими казино. Эти люди имеют своих партнеров по всей территории США, которые могут организовать тайные встречи с важными лидерами Конгресса, чтобы предложить им пожертвования. Кроме того, эти люди могут помочь организовать операции по вовлечению чиновников в компрометирующие обстоятельства, особенно с женщинами. Эта информация также может иметь решающее значение для того, чтобы наша точка зрения была услышана в Вашингтоне."
 DOM_Political.2.d:0 "Ватикан и Доминиканская Республика официально подписали Соглашение. Это соглашение закрепляет и определяет отношения между католической церковью и правительством. В соответствии с соглашением католицизм становится официальной государственной религией страны, хотя свобода вероисповедания остается гарантированной. Церковь будет получать низкие пошлины и доступ к государственным средствам. Государство будет признавать только религиозные церемонии, проводимые церковью. Поскольку католицизм глубоко укоренился в жизни большинства доминиканцев, это соглашение получило широкую поддержку населения. Президент Рафаэль Трухильо надеется, что соглашение укрепит его популярность и обеспечит ограниченное влияние Ватикана на политические дела государства."
 DOM_Cuba.0.d:0 "Наёмники из Карибского легиона предприняли попытку вторжения на территорию нашей страны с территории Кубы. Кубинское правительство открыто поддержало эту попытку, предоставив оборудование, оружие и руководство вооруженным бандитам, стремившимся безжалостно свергнуть наше демократическое правительство. Заговор прекратился только после того, как наши дипломатические усилия убедили США вмешаться и заставить кубинское правительство действовать против захватчиков. Спустя всего несколько дней кубинцы освободили наёмников. Мы твердо верим в принцип невмешательства, но Карибский легион и его амбициозные члены, возглавляемые Кубой, упорно продолжают свою нынешнюю политику насилия. Доминиканская Республика должна быть готова к будущим попыткам иностранной агрессии."
 DOM_Cuba.4.d:0 "Доминиканская Республика обратилась за немедленной помощью в связи с усилением враждебности со стороны Кубы. Президент Доминиканской Республики отметил, что кубинское правительство уже поддержало неудачный коммунистический заговор с целью вторжения в его страну и, несомненно, ищет другие пути агрессии. Он хочет получить немедленную поддержку, чтобы укрепить свое правительство и продемонстрировать иностранным угрозам, что США сохраняют свою приверженность. По мнению наших аналитиков, нынешнее правительство Доминиканской Республики настроено решительно антикоммунистически, и удовлетворение его просьбы позволит укрепить его режим от потенциальных коммунистических угроз, поскольку среди участников заговора в Карибской лиге были видны коммунисты. Однако следует отметить, что предоставление такой помощи может вызвать отторжение других региональных держав, в том числе Кубы, и подтолкнуть Доминиканскую Республику к рассмотрению собственной кампании военного авантюризма, что может привести к более широкой нестабильности."
 DOM_Cuba.5.d:0 "США согласились оказать нам немедленную помощь, поскольку мы столкнулись с угрозой со стороны Кубы и коммунистических бандитов. Наши разведданные о коммунистах, участвовавших в недавнем заговоре, помогли США принять правильное решение. В очередной раз заговор, направленный на разрушение нашей страны, был не только сорван, но и мы стали сильнее, чем прежде."
 DOM_Cuba.6.d:0 "США, несмотря на явное подтверждение того, что наша национальная безопасность находится под угрозой, отказали нам в просьбе о немедленной помощи. Американское правительство заявило, что не считает нашу ситуацию требующей притока помощи, отметив, что недавний инцидент с Карибским легионом был урегулирован до возникновения вооруженного конфликта. Они также отвергли наши опасения по поводу роли коммунистов в заговоре. США явно наказывают нашу независимую внешнюю политику и, несомненно, также причастны к заговорам против нашего народа. Несмотря на эту неудачу, мы будем твердо стоять на страже мира и процветания."
 DOM_Cuba.8.d:0 "Президент Доминиканской Республики Трухильо предложил нам финансовую помощь в борьбе с коммунистическими бандитами. Он утверждает, что осознает угрозу существования этой идеологии для Америки и хочет помочь нам в этой борьбе. Эта поддержка показывает, что мы не одиноки в мире и, по крайней мере, Доминиканская Республика заботится об интересах кубинского народа. Несмотря на эту прекрасную новость, есть и те, кто сомневается в намерениях Трухильо и в том, стоит ли принимать что-либо от его режима."
 DOM_Cuba.20.d:0 "Кубинские революционеры не скрывают своего пренебрежительного отношения к Доминиканской Республике. Фидель Кастро продолжает угрожать нашему режиму, а его недавняя попытка поднять восстание свидетельствует о том, что он без колебаний пойдет на расширение своей революции. Президент Трухильо, стремясь защитить свою страну, призвал ВС Доминиканской Республики начать подготовку к освобождению Кубы и отмстить за недавнюю агрессию. По мере разработки планов доблестные вооруженные силы должны повышать свою боеготовность. Будет ли это прямая или тайная операция, будет решено в ближайшие недели."
 DOM_Cuba.22.d:0 "Президент Доминиканской Республики Трухильо обратился к нам с просьбой о помощи в реализации его плана по освобождению Кубы от Фиделя Кастро. Трухильо в ярости от недавнего вторжения кубинцев на его территорию и заявлений из Гаваны, призывающих доминиканцев к восстанию. В последние годы Доминиканская Республика наращивала свой военный потенциал, но отчаянно нуждается в притоке военной помощи и советников, чтобы сделать следующий шаг в потенциальной попытке освобождения Кубы. Наши аналитики считают, что Трухильо в основном отчаянно пытается укрепить собственные позиции, но при этом твердо намерен противостоять Кубе. Однако он скептически относится к тому, что помощь существенно изменит ситуацию и может лишь подтолкнуть революционеров к расширению своих операций в регионе."
 DOM_Cuba.23.d:0 "США согласились предоставить военную помощь и советников для поддержки нашего проекта по освобождению Кубы от коммунистического заговора Фиделя Кастро. Эта помощь значительно усилит наши возможности и даст серьёзный толчок реализации проекта. Более того, эта поддержка позволит нашим храбрым солдатам выстоять в борьбе с любыми махинациями. Ещё важнее то, что расширение связей открывает нам доступ к американским разведданным, которые будут играть ключевую роль в нашей дальнейшей подготовке. Кастро пожалеет о том дне, когда он решил бросить вызов Доминиканской Республике."
 DOM_Cuba.24.d:0 "Соединённые Штаты отказались предоставить военную помощь и советников для поддержки нашего проекта по освобождению Кубы от коммунистического заговора во главе с Фиделем Кастро. Они ссылаются на то, что ситуация не подходит для такой операции, но в будущем она может измениться. Это удар по нашему планированию и возможностям. Американцы не хотят признавать угрозу, которую представляет собой Куба, поскольку она, несомненно, планирует распространять свою революцию. Несмотря на эту неудачу, мы сохраним бдительность и приверженность делу защиты Доминиканской Республики от экзистенциальной угрозы, исходящей от Кубы."
 DOM_Cuba.25.d:0 "После долгих обсуждений и планирования мы решили, что лучшим способом освобождения Кубы будет использование наёмников. Контрактники обладают всеми возможностями для достижения наших целей и не позволят кубинской диктатуре сплотить население против иностранного вторжения. Наёмники образуют ядро нового Карибского легиона. Как только мы выберем, с кем заключить контракт, их можно будет тайно доставить в Доминиканскую Республику и пройти необходимую для миссии подготовку. После этого наёмники должны объединиться с кубинскими бойцами, выступающими против Кастро. Как только плацдарм будет создан, наши силы смогут вступить в бой. Среди ведущих кандидатов - Освальдо Рамирес, который всё больше разочаровывается в режиме, и Уильям Морган, американец, примкнувший к революционерам."
 DOM_Cuba.26.d:0 "Освальдо Рамирес, который сражался с Кастро и его головорезами, порвал с режимом. Он разочарован их поворотом к марксизму и считает их политику пагубной для кубинского народа. Его богатый опыт и положение старшего командира делают его идеальным выбором для объединения сильных оппозиционных сил, которые присоединятся к нашим наемникам, как только они укрепятся на острове. Контакты разведки на острове, поддерживаемые ЦРУ, утверждают, что Рамиреса можно легко убедить, особенно если ему предложат деньги для организации оппозиционных сил."
 DOM_Cuba.27.d:0 "Комендант Уильям Морган - интригующий агент, уже обосновавшийся на Кубе, чтобы помочь организовать оппозиционные силы, которые помогут нам освободить остров от Кастро и его заговорщиков. По данным разведки, Морган готов поддержать наши усилия за крупную сумму денег. Как только половина денег будет внесена, Морган гарантирует, что те члены кубинского правительства, которые выступают против Кастро, будут готовы присоединиться к нашим наёмным силам. Имея уже установленный контакт, мы можем приступить к завершающим этапам подготовки к освобождению Кубы."
 DOM_Cuba.28.d:0 "Наши наёмники продолжают подготовку к освобождению Кубы. План предусматривает, что антиреволюционные кубинцы начнут восстание против Кастро, и как только оно начнется, наёмники будут переброшены на Кубу по воздуху. Как только эти силы создадут плацдарм, доминиканские войска смогут напрямую вмешаться и возглавить освобождение Кубы. Говорят, что президент Трухильо в восторге, особенно от новостей о контрабанде оружия для антикастровских сил из Майами. Присутствие наёмников и их подготовка остаются тайной для всего мира."
 DOM_Cuba.29.d:0 "Наша операция по освобождению Кубы отменена. Комендант Морган, который был нашим ключевым контактом в организации антикастровского восстания, полностью предал нас. Американский революционер с самого начала передавал Кастро детали плана, предал заговор и помог Кастро ликвидировать своих противников в стране. Кубинцы попытались устроить ловушку для Карибского легиона, но мы распознали их махинации и отменили вторжение, пока оно не привело к ещё большей катастрофе. Это большое разочарование."
 DOM_Cuba.32.d:0 "Наши наёмники были успешно высажены в Кубу, чтобы объединиться с кубинскими боевиками, выступающими против Кастро. Эти силы создали плацдарм на острове. Теперь мы можем заявить о своей роли и вступить в борьбу. Отдаются приказы о быстром развёртывании солдат, чтобы помочь завершить освобождение острова от кубинских революционеров. Президент Трухильо планирует обратиться к нации и вооруженным силам. Пришло время Доминиканской Республике занять достойное место и спасти регион от враждебного режима."
 DOM_ELECTS.1.d:0 "Доминиканская Республика объявила о скором проведении всеобщих и президентских выборов в стране. Хотя правительство называет выборы демократическими, подразумевается, что генералиссимус и действующий президент Доминиканы Рафаэль Трухильо полностью контролирует ситуацию, поскольку за годы своего правления он уничтожил всю возможную оппозицию. Президент уйдет в отставку, но сохранит контроль над военными и правящей Доминиканской партией. Президент Трухильо предпочёл бы, чтобы его брат, генерал Эктор Трухильо, был избран и правил через него. Однако некоторые советники предлагают ему выбрать Хоакина Балагуэра, глубоко преданного политического союзника. Откровенный выбор брата может вызвать международную критику, а на Балагуэра можно положиться. Президент Трухильо решает, кого выбрать в качестве президента, и должен либо пойти на поводу у своей семьи, либо довериться союзнику."
 #Global News
 DOM_Political.0.d:0 "В результате противоречивых выборов президентом Доминиканской Республики был избран Эктор Трухильо. Он был единственным кандидатом на выборах после того, как его брат и бывший президент Рафаэль Трухильо выбрал его своим преемником. Рафаэль Трухильо управлял страной железным кулаком, подавляя любую оппозицию и укрепляя свой контроль над правящей Доминиканской партией и военными. Результаты выборов подвергаются широкой критике во всем латиноамериканском мире, многие обвиняют Трухильо в том, что он правит Доминиканской Республикой как диктатор"
 Antihatianismo_DOM.2.d:0 "Силач Доминиканской Республики Рафаэль Трухильо посетит столицу Гаити Порт-о-Пренс, что символизирует полную перемену в отношениях между двумя странами. Трухильо, который на протяжении десятилетий подавлял гаитян и их культуру, недавно полностью изменил свою политику. Доминиканская Республика отменила строгий запрет на гаитянский язык и культурные традиции. Границы также были ослаблены, а новые программы призваны облегчить перемещение рабочих. Хотя многие в Гаити продолжают считать Трухильо ответственным за антигаитянские расправы 1930-х годов, теплый приём оказанный ему, свидетельствует о том, что его новая политика завоёвывает ему новую поддержку. Гаитянское правительство отметило, что этот визит укрепляет связи между гаитянским и доминиканским народами."
 Trujillo_Foreign_Assasinations.1.d:0 "Профессор юридических наук Хесус Галиндез, как сообщается, исчез, войдя поздно вечером на станцию нью-йоркского метро. Его исчезновение произошло после того, как профессор выразил опасения, что режим Рафаэля Трухильо в Доминиканской Республике пришлет агентов, чтобы убрать его. Хотя тело профессора не было найдено, следователи считают, что он, скорее всего, уже мёртв. Сторонники жертвы, политические лидеры и члены Конгресса обвиняют во всём правительство Доминиканской Республики, которое отрицает свою причастность. Галиндез был главным критиком семьи Трухильо и почти закончил работу над новой книгой, разоблачающей их коррупцию. Источник в ФБР отметил, что доминиканское судно причалило и покинуло Нью-Йорк в течение нескольких часов в то время, когда произошло предполагаемое похищение. Правительство США отозвало некоторых своих дипломатов и отменило встречи с официальными лицами Доминиканской Республики, выражая своё недовольство произошедшим."
 DOM_OAS.2.d:0 "После избрания Хоакина Балагуэра президентом Доминиканской Республики новый лидер решительно взялся за восстановление репутации своей страны на международном уровне. Многие члены Организации Американских Государств обвиняют Доминиканскую Республику в том, что она была репрессивной диктатурой времен Рафаэля Трухильо с более широкими региональными амбициями. Студенческие группы по всей Латинской Америке также провели ряд акций протеста против политических репрессий в стране. Президент Балагуэр обещает перемены, отмечая свои усилия по постепенному проведению демократических реформ, и он выразил желание взаимодействовать с другими странами путем сотрудничества, а не агрессии. Хотя неясно, как ОАГ отреагирует на эти предложения, многие в Доминиканской Республике приветствовали бы открытие связей по всему латиноамериканскому миру."
 DOM_Cuba.1.d:0 "В последние недели с Кубы поступают сообщения о том, что более тысячи кубинских и доминиканских революционеров проходят учения по подготовке к вторжению в Доминиканскую Республику. Эти силы, входящие в состав Карибского легиона, как утверждается, заинтересованы в прекращении правления Рафаэля Трухильо и восстановлении демократии в Доминиканской Республике. Кубинские власти ничего не предприняли, чтобы остановить подготовку, что вызвало критику со стороны доминиканского правительства. После давления со стороны США, кубинское правительство арестовало боевиков Карибской лиги, положив конец заговору. Хотя уже через несколько дней практически все бойцы были освобождены из тюрьмы. Считается, что первоначальное отсутствие усилий и быстрое освобождение заключенных разозлило Рафаэля Трухильо."
 DOM_Cuba.3.d:0 "Доминиканская Республика начала масштабное дипломатическое наступление на кубинское правительство. В язвительных заявлениях её официальные лица обвиняют кубинских чиновников в грубом вмешательстве во внутренние дела Доминиканской Республики и поддержке вооруженной агрессии против доминиканского народа. Это произошло через несколько недель после того, как США оказали давление на Кубу, чтобы она помешала Карибскому легиону осуществить план по высадке более тысячи доминиканских и кубинских ополченцев для свержения режима Рафаэля Трухильо. Карибский легион использовал Кубу в качестве своей операционной базы и не пытался скрыть свои действия. Официальный представитель кубинского правительства отметил, что в его обязанности не входит контроль над страстями иностранных граждан и что, возможно, именно доминиканскому правительству следует изменить свою собственную политику."
 DOM_Cuba.15.d:0 "После более чем недельных боев армия Доминиканской Республики сообщила о том, что она разгромила вторжение на остров, поддерживаемое Кубой. Боевые действия начались, когда самолет с 60 доминиканскими и кубинскими революционерами приземлился в Доминиканской Республике. Неделю спустя на яхте прибыло ещё больше боевиков, стремившихся спровоцировать всеобщее восстание против доминиканского правительства. С ними быстро расправились доминиканские войска. Доминиканское правительство незамедлительно осудило Кубу и при поддержке Америки созывает экстренное заседание Организации Американских Государств. Доминиканские лидеры настаивают на том, что Куба будет привлечена к ответственности, и уверены, что ОАГ поддержит их усилия по осуждению Кубы за попытку насильственного распространения своей революции."
 DOM_Batista.1.d:0 "Бывший президент Кубы Фульхенсио Батиста бежал со своей семьёй и союзниками в Доминиканскую Республику, когда его режим пал под ударами Фиделя Кастро и его революционеров. Прибытие Батисты вместе с его свитой и огромным количеством наличных денег вызвало недовольство доминиканского лидера Рафаэля Трухильо. Пока Батиста работает над оформлением визы, его держат в роскошном отеле под пристальным наблюдением доминиканских войск. Трухильо дал понять, что если Батиста захочет покинуть отель и отправиться туда, куда ему дадут визу, он должен будет заплатить Доминиканской Республике, чтобы возместить свои убытки. Отказ от оплаты повлечёт за собой тяжелые последствия, хотя Батиста и его союзники не знают, к чему это приведет.."
 DOM_Batista.2.d:0 "Бывший президент Кубы в изгнании Фульхенсио Батиста покинул Доминиканскую Республику и отправился в Испанию, где он и его семья получили визы. По сообщениям, для того чтобы покинуть Доминиканскую Республику, Батисте пришлось оставить Рафаэлю Трухильо миллионы долларов. Доминиканский силовик, очевидно, счёл нужным потребовать выкуп после того, как обнаружил огромную сумму наличных, захваченную семьей Батисты при бегстве с Кубы. Наблюдатели отмечают, что Батиста и его клика содержались в роскошном отеле, но их передвижения были строго ограничены."
 DOM_Batista.3.d:0 "Власти Доминиканской Республики сообщили, что бывший президент Кубы Фульхенсио Батиста скончался ночью от естественных причин. Батиста недавно бежал в Доминиканскую Республику после того, как его отстранили от власти революционеры. Те, кто бежал вместе с Батистой, включая близких соратников и членов семьи, как говорят, уже покинули страну и отправились в Испанию без его тела. Сообщается, что доминиканские власти конфисковали у кубинских изгнанников наличные деньги, прежде чем разрешить им уехать. Более того, слухи говорят о том, что смерть Батисты могла быть не естественной. Его семье не разрешили осмотреть тело или забрать с собой. Один из помощников Батисты сообщил журналистам, что бывший президент был взят под стражу в ночь своей смерти. Кроме того, говорят, что лидер Доминиканской Республики Рафаэль Трухильо потребовал у Батисты выкуп. Возможно, Батиста отказался, что привело к его казни доминиканским правительством."
 DOM_OAS.1.d:0 "Отношения между ОАГ и Доминиканской Республикой достигли новой точки падения. Многие члены ОАГ по-прежнему критикуют президента Эктора Трухильо, отмечая, что его избрание и политика указывают на то, что его брат и бывший президент Рафаэль Трухильо по-прежнему твердо руководит правительством из-за кулис. В частности, члены ОАГ выразили обеспокоенность по поводу продолжающейся концентрации власти семьи Трухильо и их участия в подозрительной деятельности. Правительство Доминиканской Республики отвергло эти опасения, обвинив ОАГ в предвзятости и активном вмешательстве во внутренние дела доминиканского народа."
 DOM_Cuba.21.d:0 "Лидер Доминиканской Республики Рафаэль Трухильо с гордостью объявил о создании нового Карибского легиона. Он назвал эти многонациональные силы необходимыми для защиты интересов всех любящих демократию людей и отметил, что группа объединяет народы со всего региона. Он отметил, что силы готовы защищать не только Доминиканскую Республику, но и Гаити от любых попыток радикального режима на Кубе распространить свою революцию. Карибский легион также будет готов оказать помощь кубинскому народу, когда он осознает коррумпированность Кастро и его заговорщиков. Карибская лига не входит в состав правительства Доминиканской Республики и является независимой организацией. Аналитики предполагают, что доминиканское правительство стремится создать правдоподобное опровержение, поскольку группа, скорее всего, находится под полным контролем доминиканских властей."
 DOM_Cuba.30.d:0 "Кубинское правительство объявило о том, что предотвратило попытку вторжения Доминиканской Республики на Кубу. Согласно сообщениям, кубинские власти раскрыли заговор доминиканских властей, которые хотели вызвать восстание, послать наемников, а затем, когда будет создан плацдарм, направить свои собственные силы для свержения правительства. Однако человек, нанятый для организации кубинского восстания, комендант Уильям Морган, в итоге предал доминиканцев и слил всю информацию высшим кубинским чиновникам. После того как кубинские спецслужбы выявили тех, кто планировал присоединиться к восстанию, сотни людей были арестованы, что позволило очистить правительство от многих антикастровских сил. Кубинские власти также предоставили оружие и наличные деньги, якобы присланные доминиканскими агентами, чтобы подтвердить свои заявления. Правительство Доминиканской Республики отказалось от комментариев, хотя, судя по сообщениям, его руководство разгневано провалом."
 DOM_Cuba.31.d:0 "По сообщениям с Кубы, между кубинскими военными и повстанцами вспыхнуло вооруженное сражение. Повстанцы, как утверждается, являются недовольными кубинскими бойцами, которые выступают против стремительного перехода к марксизму, происходящего под руководством Фиделя Кастро. Кубинские власти утверждают, что повстанцев поддерживают наёмники, прибывшие с юга страны. По их мнению, восстание и наёмники свидетельствуют об иностранном заговоре, который, вероятно, исходит из Доминиканской Республики. Доминиканские власти отрицают эти обвинения, заявляя, что кубинское правительство будет обвинять всех, кроме себя, в том, что оно подтолкнуло людей к действиям."
 DOM_Cuba.33.d:0 "Правитель Доминиканской Республики Рафаэль Трухильо обратился к народу, заявив, что ВС Доминиканской Республики вскоре присоединятся к борьбе за освобождение Кубы от Фиделя Кастро, объявив Кубе войну. В своём обращении Трухильо отметил, что Доминиканская Республика сама стала жертвой Кастро, попытавшегося поднять восстание всего несколько месяцев назад. Если доминиканский народ не предпримет меры сейчас, то следующей попыткой может стать массовое вторжение кубинцев в Доминиканскую Республику или на Гаити. Он оценил храбрость кубинских оппозиционеров и заявил, что не оставит их отважную борьбу. Кубинское правительство выступило с резким заявлением против Трухильо, заявив, что теперь ясно, что все восстания были спланированы иностранным заговором. Всех кубинцев призывают встать и дать отпор любым силам вторжения."
 DOM_Cuba.34.d:0 "Доминиканская Республика подтвердила, что у неё больше нет войск на Кубе и военные действия прекращены. Официальные лица Доминиканской Республики отказались от дальнейших комментариев. Кубинское правительство, как говорят, пребывает в приподнятом настроении, а захваченные пленные, оборудование и оружие демонстрируются по всей Гаване. Фидель Кастро поблагодарил храбрых кубинских солдат и народ за то, что они объединились, чтобы остановить вторжение, организованное доминиканской диктатурой. Кубинские власти также заявили, что могут подтвердить участие доминиканцев с самого начала, утверждая, что у них есть пленные, которые могут подтвердить, что они были наёмниками, которым платили и которых ввели доминиканские власти, как только произошло первое восстание. Лидеры других стран критикуют Доминиканскую Республику, а один из дипломатов назвал весь этот заговор причудливым и необоснованным. Судьба захваченных в плен остаётся неясной."
 DOM_Cuba.35.d:0 "Республикой, успешно захватили власть у революционного режима Фиделя Кастро. Кубинский боец Освальдо Рамирес Гарсия стал новым президентом Кубы. Он пообещал быстро восстановить мир в стране, вернуть её в международное сообщество и отменить жестокую политику предыдущего режима. Доминиканская Республика приветствовала эту новость и поздравила кубинский народ с обретением свободы. Боевые действия начались после вмешательства доминиканских войск в поддержку антикастровского восстания на Кубе. На данный момент общепризнанно, что весь план, скорее всего, был разработан и осуществлен доминиканским лидером Рафаэлем Трухильо, который хотел отомстить за попытку режима Кастро внедрить революционеров в Доминиканскую Республику. Для Трухильо победа на Кубе укрепила его статус крупного игрока в международной политике стран Карибского бассейна."
