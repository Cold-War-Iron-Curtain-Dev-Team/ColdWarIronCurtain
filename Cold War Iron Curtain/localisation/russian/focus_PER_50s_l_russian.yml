l_russian:
 iran_oil.1.d: "Избрание Мохаммеда Мосаддыка в Иране ознаменовало напряженность в отношениях с Великобританией и Соединенными Штатами, поскольку он долго говорил о национализации жидкого золота, как только представится такая возможность. Подтолкнув Меджлис к согласию, некогда радикальная идея оказалась гораздо более вероятной, чем можно было подумать. Наконец, Англо-Персидская нефтяная компания была национализирована, вытеснив англо-американское влияние на обширные ресурсы Ирана. Великобритания уже проявила открытое негодование, угрожая Ирану, если решение не будет отменено. Независимо от позиции Великобритании, Иран твердо стоит перед лицом этого кризиса."
 iran_assasinations.1.d: "Королевский министр Абдолхоссейн Хажир был объявлен мертвым после трех огнестрельных ранений в голову во время молитвы в мечети Сепахсалар. Хотя многие не согласны с его поддержкой британцев в англо-иранском нефтяном споре, его смерть вызвала шок среди иранского правительства и населения. Многие быстро перекладывают вину на Фада'иян-и Ислама, который долгое время протестовал против Хазира и высоких постов, на которых он оказался. Его убийца, Сейед Хоссейн Эмами Исфахани, был признан частью организации вскоре после ареста. В Тегеране вспыхнули волнения, и фундаменталисты и те, кто противостоит им, вышли на улицы. Это может быть началом большего кризиса ..."
 iran_assasinations.2.t: "[GetNewspaperHeader]Убийство генерала Хаджа Али Размары"
 iran_assasinations.2.d: "Премьер-министр Ирана Хадж Али Размара, как сообщается, был убит радикальным исламистом в Тегеране. Занимая пост премьер-министра с 1950 года, Размара последовательно выступал за децентрализацию и более выгодное соглашение с британским правительством. Размара первоначально пользовался поддержкой британского министерства иностранных дел и оттолкнул от себя многих влиятельных умеренных землевладельцев, а также Национальный фронт, не сумев заручиться поддержкой более радикальных партий. По свидетельству очевидцев, Размара присутствовал на поминальной службе в мечети Шаха, когда один из членов толпы произвел 3 выстрела. Убийство было совершено радикальной исламистской группировкой "Фадаян-э Ислам", скорее всего, из-за противодействия Размары национализации иранских нефтяных поставок. Это убийство совпадает с концепцией иранской национализации, которая в последние годы стремительно набирает популярность. Это последняя трагедия в череде убийств иранских министров."
 iran_assasinations.2.o: "Тегеран погружается в хаос"
 iran_political.10.t: "[GetNewspaperHeader]Гамбит отставки Моссадыка"
 iran_political.10.d: "В начале этого месяца премьер-министр Моссадык обратился к шаху с просьбой предоставить ему возможность назначить военного министра и начальника штаба, но получил отказ. Поэтому Моссадык объявил о своей отставке и обратился непосредственно к народу. В то время как Ахмад Кавам был назначен в качестве замены, радикальные группы организовали общенациональные протесты и забастовки в пользу Моссадыка. По всей стране вспыхнули забастовки и демонстрации. В течение последних пяти дней протестующие вступали в столкновения с войсками, поскольку страна полностью остановилась. Поскольку лояльность солдат была под сомнением, военные командиры приказали всем войскам вернуться в свои казармы, и Тегеран полностью оказался в руках протестующих. Сегодня испуганный шах уволил Кавама, и Мосаддык был вновь назначен, вместе со всеми военными полномочиями, которые он ранее требовал. Моссадык сейчас более популярен, чем когда-либо, и в состоянии еще больше расширить свое положение в правительстве"
 iran_political.10.o: "Уловка Моссадыка окупилась"
  
 AJAX.12.d: "Иранский генерал Фазлолла Захеди был преданным сторонником шаха и был обвинен Моссадыком в предательстве еще до неудавшегося переворота. Он был назначен новым премьер-министром в императорском указе шаха и после провала переворота быстро исчез из поля зрения общественности. Хотя Моссадык приказал силам безопасности окружить заговорщиков, Захеди до сих пор оставался вне их поля зрения и находился в бегах. Он объявил себя законным премьер-министром Ирана и призвал народ Ирана восстать против Моссадыка, но это не принесло успеха. Однако теперь, когда сторонники Моссадыка вернулись в свои дома, про-шахские заговорщики оказались в значительно более выгодном положении. Совсем недавно ходили слухи, что Захеди присутствовал на тайном собрании сторонников шаха, и если бы им удалось заручиться поддержкой народа, положение Моссадыка оказалось бы в значительной опасности. Как бы то ни было, присутствие Захеди в Иране является серьезной занозой в боку правления Моссадыка."
 AJAX.11.d: "После неудавшегося роялистского переворота было много слухов о местонахождении Реза-шаха. Однако теперь выясняется, что шах бежал из страны сразу же после попытки переворота и прибыл в Багдад со своей второй женой. После того как его просьба о временном убежище была удовлетворена, он провел некоторое время в гостях у иракского правительства, а затем был доставлен самолетом в Италию, где сейчас и находится. С уходом шаха Моссадык правит страной практически без сопротивления. Тем не менее, он приказал всем своим сторонникам вернуться домой, а без них его правительство кажется почти уязвимым - и твердо про-шахский генерал Захеди все еще находится в бегах."
 AJAX.10.d: "После удачного гамбита с отставкой премьер-министр Ирана Мохаммад Моссадык продолжал укреплять свою власть, в то время как шах все больше беспокоился о его растущем влиянии. В последнее время усилия Моссадыка увенчались тем, что он издал приказ об официальном упразднении парламента, фактически дав ему и его кабинету абсолютную власть и лишив шаха какой-либо реальной власти. Испугавшись абсолютной власти Моссадыка, роялистские заговорщики составили королевский указ, подписанный шахом, который отстранил Моссадыка от его роли и назначил на его место лоялистского генерала Захеди. Командующий имперской гвардией передал указ Моссадыку, однако тот был предупрежден о заговоре, предположительно коммунистической партией Туде, и приказал арестовать командующего, утверждая, что шах больше не имеет власти издавать указы. Местонахождение Захеди и шаха неизвестно, и многие подозревают Запад в причастности к попытке переворота. Хотя ситуация продолжает ухудшаться, похоже, что Моссадык, по крайней мере на данный момент, сохранил свою власть в Иране."
