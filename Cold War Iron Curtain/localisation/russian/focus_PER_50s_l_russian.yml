 PER_anglo_iranian_oil_company_desc: "В 1933 году британская «Англо-Иранская нефтяная компания» заключила сделку с правительством Ирана о предоставлении исключительных прав на бурение иранских нефтяных месторождений. Постоянная тема для дискуссий и источник внутренних неурядиц для Ирана."
 PER_corrupt_bureaucracy_judiciary_desc: "Наше общество работает на кумовстве, очереди заменяются взятками, генералы - сыновья богатой элиты, нами руководят дураки и шарлатаны."
 PER_revised_ai_oil_company_desc: "Пересмотренная A-И нефтяная Ко. внесла существенные улучшения в политический климат в стране, но лишь вопрос времени, когда ее существование снова будет поставлено под сомнение."
 PER_revised_deal: "Пересмотренная А-И нефтяная Ко."
 PER_revised_deal_desc: "Надеемся, мы показали Англии что привержены их делу и можем быть ценным и надежным союзником в регионе и на мировой арене. Надеюсь, с этим мы сможем пересмотреть и заключить более разумную сделку, чтобы частично ослабить политическое давление в нашем правительстве."
