 Piano_Solo.1.d: "После выступлений социалистов и коммунистов против правительства, а также неоднократных забастовок и нападений на чиновников и пешеходов, Карбиньери сочли нужным на время передать страну под свое управление с обещанием в будущем вернуться к демократии."
 Piano_Solo.2.d: "После того как социалисты и коммунисты выступили против правительства Италии, а также после неоднократных забастовок и нападений на чиновников и пешеходов, национальная жандармерия Италии сочла нужным на время передать страну под свое управление с обещанием в будущем вернуться к демократии."
