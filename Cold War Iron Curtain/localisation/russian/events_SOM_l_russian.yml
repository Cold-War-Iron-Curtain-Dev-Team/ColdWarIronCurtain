l_english:
 som.1.d: "Казнь Барре произошла всего несколько минут назад в Могадишо. Его привезли на центральную рыночную площадь, где повесили за попытку государственного переворота. Это будет примером для тех, кто думает, что они могут делать все, что им взбредет в голову."
 som.2.d: "Вчера вечером в Могадишо состоялась казнь Сиада Барре. Согласно свидетельским показаниям, его привезли туда, притащили к трибуне и быстро повесили. Повешение, однако, было сделано неправильно, что привело к тому что он несколько минут болтался на веревке, корчась и испытывая сильную боль. По мнению нового правительства, это послужит примером того, что происходит с теми, кто думает, что может взять на себя управление государством."
 som.3.d: "Всего несколько минут назад уважаемый генерал армии Сиад Барре возглавил бескровный захват правительства Сомали. Сомалийские войска при поддержке танков под командованием Барре штурмовали Могадишо. Захватив ключевые правительственные здания он отдал приказ об отставке руководства страны. В результате переворота был свергнут нынешний президент. Их мотивом является нападение на Абдирашида Али Шармарке, совершенное ранее."
 somnews.1.d: "Организация Объединенных Наций согласилась возложить на Италию ответственность за надзор за своей бывшей колонией Сомалиленд в качестве подопечной территории ООН. Эта территория находилась под британской военной оккупацией с тех пор, как она захватила этот район в 1941 году во время восточноафриканской кампании. Ожидается, что британские чиновники начнут вывод войск и передадут управление страной Италии. Однако представители ООН поспешили заявить, что это не восстановление итальянского колониального господства. Итальянцы договорились с местными сомалийскими активистами и пообещали предоставить независимость в течение десяти лет. Кроме того, итальянская администрация должна регулярно представлять доклады о ходе подготовки Сомалиленда к независимости. Организация Объединенных Наций также отправит наблюдателей на места для оказания помощи в развитии Сомалиленда. Итальянское правительство рассматривает это как крупную победу, и многие итальянцы разделяют мнение правительства в том, что Италия должна позаботиться о том, чтобы направить свои бывшие колонии на путь независимости. Ведущая Сомалийская Партия независимости, Сомалийская Молодежная Лига, опубликовала заявление, в котором говорится, что она надеется на честность итальянцев, но готова привлечь Италию к ответственности, если она не выполнит свои обязательства. Хотя все вовлеченные стороны казались удовлетворенными, в частном порядке некоторые дипломаты предполагают, что Италии может не хватить экономического потенциала или политической воли, чтобы довести этот процесс деколонизации Сомали до конца."
 som.7.d: "The United Nations passed a controversial decision, giving Italy the trusteeship over its former colony Somaliland. The territory has been under British military control since 1941 and its forces are due to hand over responsibility to Italian authorities. Despite criticism at seemingly returning a colonial possession, a UN official noted both Somali independence and Italian officials agreed on independence within ten years. The UN also requires Italy provide regular, public reports on its efforts at developing and preparing Somaliland for independence. Many Italians welcome the decision, seeing it as an opportunity for Italy to complete its responsibility of preparing its former colonies for independence. Most Somalis are hopeful, though many will wait to see before openly supporting the Italian trusteeship."
 som.4.d: "Цель ООН по обеспечению независимости народа Сомалиленда в течение 10 лет была наконец достигнута, и сегодня итальянский Сомалиленд получил независимость от Италии. Новообразованный Сомалиленд одновременно объединился с британским Сомалилендом, который всего за несколько дней до этого обрел собственную независимость. Это объединение сразу же привело к созданию Сомалийской Республики, в которой было сформировано правительство Абдуллахи Исса и Мухаммад Хаджи Ибрагим Эгаль, с Хаджи Башир Исмаилом Юсуфом в качестве председателя сомалийского Национального Собрания, Аденом Абдуллой Османом Дааром в качестве президента Сомалийской Республики и Абдирашидом Али Шермарке в качестве премьер-министра. Однако стремление ООН к 10-летней независимости было поспешным, поскольку республика, по-видимому, все еще находится под сильным колониальным влиянием как среди народа, так и среди правительства. А пока, судьба  Сомали зависит от руководства Республики."