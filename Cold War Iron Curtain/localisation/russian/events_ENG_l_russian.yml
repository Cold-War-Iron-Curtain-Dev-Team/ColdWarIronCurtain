l_russian:
 eng.1.t: "Объединение Австрии"
 eng.1.d: "Народ Австрии хочет снова стать свободной и независимой страной. Она могла бы служить буферным государством между Востоком и Западом. Разве мы это допустим?"
 eng.1.a: "Да, конечно же!"
 eng.1.b: "Нет, нам нужно сделать что-то другое с нашими австрийскими территориями."
 eng.2.t: "Признать КНР легитимным правительством Китая"
 eng.2.d: "Китайская Народная Республика хочет, чтобы ее признали единственным китайским правительством в ООН. С одной стороны, КНР контролирует материк и регулирует большинство актуальных вопросов в Китае, но с другой-должны ли мы позволить коммунистам занять еще одно место в Совете Безопасности ООН?"
 eng.2.a: "Проголосуйте за предоставление КНР мест Республике Китая."
 eng.2.b: "Нет, коммунисты должны держаться подальше."
 eng.3.t: "Основание НСЗ"
 eng.3.d: "Основана Национальная служба здравоохранения. Эта новая универсальная организация здравоохранения имеет три принципа: она должна удовлетворять потребности каждого человека, быть бесплатной в момент родов и основываться на клинических потребностях, а не на платежеспособности."
 eng.3.a: "Это знаменательный день для Британии!"
 eng.4.t: "Социалисты убивают королевскую семью!"
 eng.4.d: "Прошлой ночью группа социалистических экстремистов ворвалась в Букингемский дворец и убила членов королевской семьи, находившихся там. Ходят слухи, что оставшиеся члены королевской семьи были эвакуированы в Канаду до тех пор, пока беспорядки не утихнут."
 eng.4.a: "Им лучше бежать."
 eng.5.t: "Уганда просит независимости"
 eng.5.d: "Уганда хочет независимости от нас. Это одна из основных британских колоний, но она находится в глубине империи и далеко от нашей столицы."
 eng.5.a: "Да!"
 eng.5.b: "Нет, они все еще нуждаются в нашей защите."
 eng.6.t: "Нигерия просит независимости"
 eng.6.d: "Нигерия хочет независимости от нас. Они добывают много нефти и каучука, но наши компании готовы торговать с потенциальным независимым нигерийским государством. Может, нам их отпустить?"
 eng.6.a: "Да!"
 eng.6.b: "Нет, они все еще нуждаются в нашей защите."
 eng.7.t: "Кения просит независимости"
 eng.7.d: "Кения хочет независимости видя результат нашей неудачной колониальной политики, которая привела к таким вещам, как чрезвычайное положение в Кении. Они находятся на побережье Западной Африки. Следует ли нам освободить мятежный район?"
 eng.7.a: "Да!"
 eng.7.b: "Нет, они все еще нуждаются в нашей защите."
 eng.8.t: "Судан просит независимости"
 eng.8.d: "Судан хочет освободиться от нашего правления. Хотя это англо-египетский кондоминиум, мы фактически являемся правителями Судана. Должны ли мы позволить ему освободиться в одностороннем порядке?"
 eng.8.a: "Да!"
 eng.8.b: "Нет, их статус по отношению к Египту еще должен быть определен."
 eng.1000.d: "Королева Елизавета Вторая стала 39-м британским монархом и 6-й коронованной королевой в Вестминстерском аббатстве. Трехчасовая церемония коронации, начавшаяся в 11: 15 утра, была первой коронацией, транслируемой по телевидению Би-би-си. На коронации присутствовали представители 129 стран. Более 27 миллионов британцев смотрели церемонию по телевидению, и более 2000 журналистов были вне этого мероприятия. Эту церемонию можно было рассматривать как символ единства Британского Содружества: одна семья приплыла сюда из Австралии, чтобы присутствовать на коронации."
 UKRadar.1.d: "RAF Saxa Vord, также известная как Remote Radar Head Saxa Vord, представляет собой новую радиолокационную станцию, расположенную на острове Унст, на самом севере из Шетландских островов. Первоначально созданная в 1945 году как активная часть британской противовоздушной обороны, RRH Saxa Vord продолжает оставаться значительной частью британской сети противовоздушной обороны, будучи интегрированной в систему ROTOR, а в 1955 году станция была оснащена радаром AMES Type 80. No. 91 подразделение связи было официально размещено в RRH Saxa Vord в 1957 году, и Ее Величество Королева Елизавета II посетила это место в 1960 году. Весь персонал постоянно использует латинский девиз Praemoneo de periculus, что означает, что я заранее предупреждаю об опасности, что определенно относится к этой уникальной установке."
