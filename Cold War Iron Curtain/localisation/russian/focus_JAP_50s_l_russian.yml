 hi_japan.9.d: "Вчера, 23 декабря 1958 года, Токийская телебашня, телекоммуникационная башня, построенная корпорацией Takenaka Corporation, была открыта в качестве коммуникационной башни для обслуживания всех телевизоров в районе Канто, а также в качестве наблюдательной башни. Сегодня, в канун Рождества, тысячи людей вышли через станцию Хамамацучо в районе Минато в Токио, чтобы осмотреть первую послевоенную достопримечательность Японии."
 cambodia.2.d: "17 января 1968 года новая военная группировка коммунистов «Красные кхмеры» во главе с таинственным Пол Потом начала общенациональное коммунистическое восстание по всей Камбодже. Партизаны, численность которых составляет всего 4000-5000 человек, захватили значительную часть сельской местности только в северной части страны, используя джунгли в своих интересах. Вьетнам уже продемонстрировал поддержку «красных кхмеров», снабжая их оружием и обучая других повстанцев."
 Uganda.1.d: "30 июля 1953 года государственный секретарь по делам колоний Оливер Литтелтон мимоходом упомянул возможность объединения и федерации территорий Британской Восточной Африки. Это мимолетное упоминание вызвало резкий протест со стороны министров Буганды, заявивших, что, по их мнению, идея интеграции разрушит их культуру и их образ жизни. Хотя губернатор Уганды сэр Эндрю Коэн заверил их, что ни одно решение не будет принято без консультации с Бугандой, многие политические деятели считают, что кошка вышла из-под контроля, и многие другие призывают к независимости Буганды."
 Uganda.2.d: "Поскольку кризис Кебаки в Уганде продолжает нарастать, британская колониальная администрация решила изгнать бугандийского короля Мутесу II, чтобы заставить остановить призывы против предлагаемой Восточноафриканской федерации. Хотя британские власти надеялись, что это успокоит ситуацию, похоже, что эффект обратный. Сэр Коэн, губернатор Уганды, хотел избрать нового монарха, однако Буганда отказывается подчиниться ..."
 Uganda.3.d: "Пробыв в изгнании в течение нескольких месяцев, Мутеса II вернулся в Уганду после ратификации Соглашения Буганда, вносящего поправки в предыдущее соглашение от 1900 года. Соглашение увеличило местное африканское представительство в Угандийском протекторате, а также сохранило Буганду как неотъемлемую часть Уганды."
 cultural_events.4.d: "Французский писатель, активист и антиколониалист Жан-Поль Сартр скончался от отека легких. На протяжении всей своей жизни Сартр сосредотачивался на понятии свободы человека и в конечном итоге стал общественным интеллектуалом после войны, активно призывая писателей выражать свою политическую приверженность. Сартр также сыграл видную роль в борьбе против французского владычества в Алжире, а также в использовании французами пыток и концентрационных лагерей в Алжире. Его похороны на кладбище Монпарнас посетили более пятидесяти тысяч парижан."
 Uganda.10.d: "Король Буганды Мутеса II бежал из своей родной страны Уганды в Соединенное Королевство после обвинений премьер-министра Милтона Оботе в государственной измене. Эти обвинения последовали за серией политических кризисов, включая захват Оботе президентских полномочий Уганды у Мутесы в начале этой недели. Возражение Мутезы против этого захвата власти привело к тому, что Оботе послал войска в резиденцию короля на холме Менго, чтобы привести к нему короля, живого или мертвого. Хотя телохранители короля и лоялисты отважно сражались на холме и на улицах, они уступали в вооружении более вооруженным солдатам. В конце битвы дворец был подожжен, но король избежал чудовищной смерти."
 Uganda.11.d: "Новые беспорядки в Уганде разразились сегодня, когда премьер-министр Милтон Оботе объявил референдум по: 1) статусу двух округов; 2) по вопросу о том, должны ли они оставаться в составе Королевства Буганда и вернуть ли в Королевство Буньоро или создать новый округ. Королевство Буганда рассматривает этот референдум как прямое нападение на их автономию. Поскольку король Буганды является церемониальным президентом Уганды, в этой маленькой африканской стране, скорее всего, скоро начнутся новые беспорядки."
 Uganda.12.d: "Премьер-министр Милтон Оботе был казнен королем Буганды Мутесой II за государственную измену королю Буганды после его собственных обвинений в том, что король сам совершил государственную измену. Эти обвинения последовали за серией политических кризисов, включая захват Оботе президентских полномочий Уганды у Мутесы в начале этой недели. Возражение Мутезы против этого захвата власти привело к тому, что Оботе послал войска в резиденцию короля на холме Менго, чтобы привести к нему короля, живого или мертвого. Хотя солдаты Оботе были намного лучше вооружены, чем телохранители короля и лояльные разношерстные бойцы, сражавшиеся от улицы к улице, их партизанская тактика и отказ сдаться привели к краху мятежного наступления. Премьер-министр был найден при попытке к бегству из столицы в багажнике автомобиля, и его немедленно доставили к суду за свои преступления."
 KPA_RAID.4.d: "Война снова пришла на Корейский полуостров, и правительство Южной Кореи официально объявило о прекращении действия соглашения о перемирии, неофициально объявив войну. Это произошло всего через несколько дней после успешного убийства лидера Южной Кореи Пак Чон Хи отрядом 124, самым ценным отрядом коммандос Северной Кореи. Соединенные Штаты Америки, главный союзник Южной Кореи, еще не представили официального ответа на объявление войны, но распространяются сообщения о том, что гарнизон США, размещенный в столичной зоне Сеула, уже покинул окрестности, готовясь укрепить демилитаризованную зону, в которой уже произошло значительное количество стычек, невиданных ранее со времен Корейской войны. Президент Чунг Иль Квон и его кабинет уже эвакуировали этот район в неизвестное место, а жители Сеула, Инчхона и других крупных городов в этом районе эвакуировались в южные провинции республики. Главные союзники Северной Кореи, Советский Союз и Китайская Народная Республика, также еще не ответили, но наблюдатели предсказывают, что Китай, скорее всего, ответит наиболее и быстро, а Советский Союз вмешается в качестве последнего средства, если это будет необходимо."
 KPA_RAID_ALT.4.d: "Война снова пришла на Корейский полуостров, когда правительство Северной Кореи официально объявило о прекращении действия соглашения о перемирии, неофициально объявив войну. Уже тысячи солдат из КНА были переброшены в демилитаризованную зону, и активированы спящие агенты Северной Кореи, что подрывает способность Южной Кореи организовать надлежащий ответ. Это стало результатом успешного покушения на президента Пак Чон Хи, организованного отрядом 124, элитным отрядом коммандос Северной Кореи. Видя неспособность защитить демилитаризованную зону и прилегающие к ней провинции, гарнизон США в Сеуле уже эвакуирован и занял оборонительные позиции как в Пусане, так и в Чеджу, подвергая опасности миллионы граждан Южной Кореи. В то время как основные союзники Северной Кореи, Советский Союз и Китайская Народная Республика, еще не ответили, весьма вероятно, что Китай мобилизует свои войска, чтобы помочь своему коммунистическому союзнику укрепить свое влияние в Азии, с вмешательством Советов в случае необходимости."
 KPA_RAID.5.d: "Северная Корея сообщила, что их лидер Ким Ир Сен мертв. Это удивительно для изолированной страны, и еще более удивительно то, что северокорейский лидер скончался от огнестрельных ранений в результате убийства, которое они называют южнокорейским. Считается, что это убийство является ответом Южной Кореи на попытку убийства Северной Кореей Пак Чон Хи, лидера Южной Кореи. По данным южнокорейских инсайдеров, атака была осуществлена отрядом 684 спецназа ВВС. Подобное нападение на Корейском полуострове является беспрецедентным, и наблюдатели предсказывают, что вскоре разразится крупный военный конфликт."
 KPA_RAID.2: "Катастрофа и смущение поразили Южную Корею сегодня, поскольку Центральное информационное агентство Кореи, пропагандистское подразделение Северной Кореи, а также инсайдерские источники сообщили, что Южная Корея не смогла убить Ким Ир Сена в отместку за попытки Северной Кореи убить президента Южной Кореи Пак Чон Хи. Подразделению специального назначения, которому поручена эта задача, 684-му подразделению ВВС РК, в настоящее время предъявлено уголовное обвинение в Северной Корее, при этом некоторые эксперты заявляют, что это просто показательный процесс и что он неизбежно закончится либо их казнью, либо пытками. В ответ KCNA заявила, что Северная Корея будет использовать все доступные методы для \"уничтожения Америки и ее марионеточного государства Южной Кореи и освобождения корейского народа \". Спустя всего несколько часов после доклада американский гарнизон в Сеуле приводится в состояние повышенной готовности, и Вашингтон рассматривает возможность существенного увеличения численности гарнизона перед лицом потенциального крупномасштабного военного конфликта на полуострове."
 iran_assasinations.1.d: "Королевский министр Абдолхоссейн Хажир был объявлен мертвым после трех огнестрельных ранений в голову во время молитвы в мечети Сепахсалар. Хотя многие не согласны с его поддержкой британцев в англо-иранском нефтяном споре, его смерть вызвала шок среди иранского правительства и населения. Многие быстро перекладывают вину на Фада'иян-и Ислама, который долгое время протестовал против Хазира и высоких постов, на которых он оказался. Его убийца, Сейед Хоссейн Эмами Исфахани, был признан частью организации вскоре после ареста. В Тегеране вспыхнули волнения, и фундаменталисты и те, кто противостоит им, вышли на улицы. Это может быть началом большего кризиса ..."
 dmz_conflict.100.d: "С момента подписания соглашения о перемирии Северная и Южная Корея якобы переживают период мира, который в противном случае пролил бы больше крови в регионе, наполненном смертью и разрушениями с начала 20 века. Однако это далеко не так. С момента заключения соглашения о перемирии периодические стычки на границе не прекращаются по всей демилитаризованной зоне, где солдаты КНА и армии Республики Корея вместе с дислоцированным там гарнизоном США часто нападают друг на друга, но безрезультатно. Это косвенно свидетельствует о недостатках соглашения о перемирии, поскольку оно просто создает временный и символический мир на Корейском полуострове."
 dmz_conflict.101.d: "Прошло более 4 лет с тех пор, как на Корейском полуострове начались пограничные стычки и случайные вторжения, когда обе стороны пытались захватить территорию и протолкнуть свои границы за демилитаризованную зону, чтобы получить стратегическое преимущество против противоположной стороны. Из-за неудачных атак и контратак, проведенных обеими Кореями, наблюдатели пришли к выводу, что конфликт в ДМЗ фактически закончились с неубедительным результатом, поскольку обе стороны все еще имеют свои границы по 38-й параллели. Хотя это результат, с которым ни одна из сторон не захотела бы согласиться, уменьшение частоты пограничных столкновений доказало, что обе стороны отошли и потеряли интерес к продолжению конфликта и сосредоточились на своих внутренних проблемах, от которых страдают их страны, что фактически привело к временному миру на полуострове еще раз."
 dmz_conflict.102.d: "Прошло более 4 лет с тех пор, как на Корейском полуострове начались пограничные стычки и случайные вторжения, когда обе стороны пытались захватить территорию и протолкнуть свои границы за демилитаризованную зону, чтобы получить стратегическое преимущество против противоположной стороны. Благодаря широкому использованию Севером партизанской войны и ее доказанному успеху против поддерживаемой США Южной Кореи, Северная Корея, несомненно, выиграла конфликт в демилитаризованной зоне, и наблюдатели согласились с таким заявлением. Однако те же наблюдатели называют такую победу беспрецедентной и считают, что Северная Корея может попытать счастья и потенциально вызвать полномасштабный военный конфликт против Южной Кореи."
 dmz_conflict.103.d: "Война снова пришла на Корейский полуостров, когда правительство Северной Кореи официально объявило о прекращении действия соглашения о перемирии, неофициально объявив войну. Уже тысячи солдат из КНА были переброшены в демилитаризованную зону, и активированы спящие агенты Северной Кореи, что подрывает способность Южной Кореи организовать надлежащий ответ. Это стало результатом успешных вторжений Северной Кореи на территорию своего южного соседа, достигнув городской черты Сеула. Видя неспособность защитить демилитаризованную зону и прилегающие к ней провинции, гарнизон США в Сеуле уже эвакуирован и занял оборонительные позиции как в Пусане, так и в Чеджу, подвергая опасности миллионы граждан Южной Кореи. В то время как основные союзники Северной Кореи, Советский Союз и Китайская Народная Республика, еще не ответили, весьма вероятно, что Китай мобилизует свои войска, чтобы помочь своему коммунистическому союзнику укрепить свое влияние в Азии, с вмешательством Советов в случае необходимости."
 japan.5.d: "После завершения строительства в 1958 году Токийская телебашня мгновенно стала достопримечательностью города. 14 октября 1958 года радиомачта высотой 333 метра стала самой высокой отдельно стоящей башней в мире. Его история начинается в середине 1950-х годов, когда Тачу Наито был выбран в качестве архитектора для создания памятника, который символизировал бы господство Японии как глобального экономического центра. Найто решил поискать вдохновение, которое он нашел в парижской Эйфелевой башне. Многие уже ожидают, что Токийская башня станет одной из самых посещаемых туристических достопримечательностей Японии."
 hi_japan.1.d: "После поражения Японии в конце Второй мировой войны страна находилась под американской военной оккупацией и не допускала никаких вооруженных сил. Однако с ростом напряженности, вызванной холодной войной, американское правительство предприняло все более активные шаги по развитию Японии как капиталистического союзника на Востоке. Когда американские войска столкнулись с столкновением в Корейской войне, невероятно уязвимое и уязвимое положение Японии не осталось незамеченным. Забастовки и демонстрации левых и коммунистов также обострили ситуацию, и теперь Соединенные Штаты ясно видят разумным позволить Японии снова сформировать свои собственные вооруженные силы. Японское правительство официально санкционировало создание национальных вооруженных сил, однако их роль должна быть ограничена конкретно самообороной и будет строго контролироваться США, которые все еще опасаются мировой войны. Независимо от ограничений, создание японской армии помогает укрепить шаткое положение союзников в Азии, одновременно подчеркивая вновь обретенный национальный суверенитет Японии."
