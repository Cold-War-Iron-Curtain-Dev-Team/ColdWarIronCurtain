 japan.6.d: "После нашего сокрушительного поражения во Второй мировой войне профсоюзы и рабочие движения получили опасный рост популярности по всей стране и оказали все большее давление на правительство, чтобы оно предприняло дальнейшие шаги для защиты прав рабочих. В этом году на демонстрацию в честь Международного дня трудящихся тысячи протестующих собрались перед Императорским дворцом. Затем полиция напала на демонстрантов, вызвав кровавую схватку с невооруженными демонстрантами. Хуже того, первый случай применения полицией смертельного оружия против демонстрантов после окончания войны вызвал серьезную реакцию, и было оказано большое давление на существующие полицейские процедуры, касающиеся управления демонстрациями."
