l_russian:
 KOR_RAID.4.d: "Страна погрузилась в кризис, поскольку президент Южной Кореи Пак Чон Хи был убит руками северокорейских коммандос. Атака, организованная подразделением 124, самым ценным подразделением коммандос Северной Кореи, успешно совершила налет на Синий Дом, резиденцию президента в Южной Корее, и уничтожила Пака, не оставив следа. После этого события, премьер-министр Чон Иль Гвон был приведен к присяге как 7-й президент Республики Корея. Наблюдатели отмечают, что, если Южная Корея не сможет дать надлежащий ответ, она станет уязвимой для потенциального вторжения Северной Кореи."
