 KISHI_DESC: "В течение 1920-х и начала 1930-х годов блестящий молодой бюрократ Нобусуке Киши посетил ведущие промышленные державы мира и изучил их экономическую политику. По возвращении он стал сторонником экономического роста под руководством государства. К середине 1930-х годов японская армия полностью передала экономическую политику Маньчжоу-Го в руки Киши. Он курировал экономический рост, но был вовлечен в коррупцию и трудовую эксплуатацию до своего возвращения в Японию в 1940 году. Во время войны он занимал несколько должностей, в основном в качестве министра по боеприпасам. Когда война закончилась, он был задержан, но избежал уголовных обвинений, несмотря на его глубокую причастность к зверской эксплуатации неяпонской рабочей силы. Он счел американские судебные процессы незаконными и стремился организовать в Японии сторонников консерваторов, чтобы отстоять независимость страны. Хотя он является членом правящей Либеральной партии, он активно критикует премьер-министра Сигеру Ёсиду за его чрезмерную зависимость от Соединенных Штатов. Однако на данный момент Киси избегает чистки американцев из-за его способности организовывать консервативные фракции в Либеральной партии против японских социалистов."
 YOSHIDA_DESC: "Когда Либеральная партия выиграла выборы 1946 года, союзные власти быстро запретили лидеру партии Итиро Хатояме стать премьер-министром. Вместо него кресло премьера занял Сигэру Ёсида. Сигеру Ёсида поступил на дипломатическую службу в 1906 году и во время Второй мировой войны активно стремился подтолкнуть Японию к достижению мира с Союзниками. Он долгое время имел проамериканские и пробританские склонности, что делало его идеальным премьер-министром для оккупационных властей. Став премьер-министром, Ёсида сосредоточился на экономике, стремясь восстановить японскую экономику. Что касается внешней политики, Йошида работал над установлением партнерства в области безопасности с Соединенными Штатами. Многие предлагают, чтобы эта политика отдавала приоритет экономике. Ёсида должен держать под контролем остатки националистических группировок в Японии и демонстрировать широкому кругу населения, что его политика приведет к процветанию и безопасности Японии или рискнет быть заклейменным американской марионеткой."
 tt_japan_end_occupation: "§HЗавершив этот фокус, Япония станет свободной страной, и военная оккупация официально прекратится.§"
