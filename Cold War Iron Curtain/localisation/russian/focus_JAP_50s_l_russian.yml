 royal.2.d: "Как раз сегодня днем в Императорском дворце Токио состоялась публичная трансляция, на которой несколько охранников держали королевскую семью под прицелом. Впереди, в центре экрана, стоял Яков Александрович Малик, советский посол средних лет, с пистолетом в руке. «Действия японской королевской семьи привели к бесчисленным смертям во время Второй Мировой Войны. За каждое действие приходится платить. Император Хирохито по обвинению в заговоре с целью захвата власти, ведении агрессивных войн, совершении военных преступлений и преступлениях против человечности, я приговариваю вас и всю королевскую семью к смерти, поскольку это государство должно быть очищено». Соединенные Штаты и Содружество, включая несколько нейтральных стран, уже осудили публично транслируемую казнь, в которой участвовали женщины и дети. «Сталин и его коммунисты должны извиниться за этот варварский акт, дети невиновны и должны быть защищены» сказал президент Трумэн во время пресс-конференции."
 royal.1.d: "Император Хирохито только что объявил о своем отречении сегодня утром к всеобщему шоку. Не подвергаясь чужому влиянию, JCP не теряла времени, чтобы поддержать решение Императора. Президент Соединенных Штатов Гарри С. Трумэн отреагировал на пресс-конференции, тонко предположив, что к этому решению должна была приложить руку третья сторона. В то время как Великобритания оставалась на удивление нейтральной, а Китайская Народная Республика и Китайская Республика поддерживали и критиковали решение Императора соответственно. Как и ожидалось, СССР решительно поддержал отречение от престола, несколько дипломатов заявили, что, по их мнению, НАТО собирается впасть в паранойю по этому поводу. Несколько дней спустя президент Соединенных Штатов обвинил JCP в том, что она была третьей стороной, которая могла заставить отречься от престола. JCP быстро отвергла обвинения. СССР прокомментировал распространение американцами заговора и опасений по дальнейшей дестабилизации азиатских регионов."
 royal.3.d: "Вчера внеплановая международная трансляция по телевидению и радио удивила всех, так как в течение нескольких секунд играла коммунистическая музыка, после чего  император японской королевской семьи Хирохито, его невеста, а также несколько других мужчин, женщин и даже детей выстроили в ряд на высоких деревянных виселицах, с петлей на шее в Императорском дворце в Пекине, также известном как Запретный город. Молодой человек в форме офицера НОАК стоял за пьедесталом, пока другой офицер готовился дернуть за рычаг. «За преступления против материкового Китая, за преступления против нашего народа, за преступления, связанные с убийством наших заключенных без чести, за преступления против человечности и государства, мы, коммунистическая партия Китая, приказом председателя Мао Цзэдуна приговариваем вас и всю вашу семью к повешенью, пока смерть не будет подтверждена, здесь, в Запретном городе». Многие страны НАТО быстро отреагировали на эту передачу, решительно осудив сомнительные действия КНР, а некоторые даже призвали к ответным действиям. Соединенные Штаты поспешили обвинить СССР в содействии казни, на что СССР поспешил отвергнуть беспочвенные обвинения, поскольку не было граждан СССР, только азиаты. Монголия и Китайская Республика, в частности, закрыли свои границы для КНР после травмирующих событий."
 treaty_san_francisco.1.d: "Сегодня мирный договор в Сан-Франциско был официально подписан 48 странами между Японией и союзными державами. Этот договор призван официально положить конец позиции Японии как имперской державы, выделить компенсацию гражданским лицам Союзников и бывшим военнопленным, пострадавшим от военных преступлений Японии во время Второй мировой войны, и положить конец послевоенной оккупации Японии и Японии союзниками под руководством США. В этом договоре широко использовались Устав Организации Объединенных Наций и Всеобщая декларация прав человека для провозглашения целей союзников. С самого начала конференции Советский Союз решительно и открыто выступил против проекта текста договора, подготовленного Соединенными Штатами. Этот договор также поставил проблему правового статуса Тайваня из-за отсутствия в нем конкретики в отношении того, какой стране Тайвань должен был быть сдан, и поэтому некоторые сторонники независимости Тайваня утверждают, что суверенитет Тайваня все еще не определен."
 japan.1.d: "Сегодня произошла трагедия. В районе Большого Токио в городе Йокогама в префектуре Канагава загорелся электрический поезд, подъезжавший к станции Йокогама. Считается, что деревянный электропоезд задел висящий электрический провод. 150 человек в поезде не смогли открыть двери, а окна были слишком малы, чтобы в них можно было вылезти. По первым сообщениям, почти все из 150 человек в поезде погибли. Деревянный поезд серии 63, произведенный во время Второй мировой войны, проектировался с учетом экономии. Однако похоже, что сокращение затрат произошло за счет человеческих жизней."
 japan.2.d: "Храм Кинкаку-дзи в высокогорье северных холмов Киото был построен в 1398 году сёгуном. Он построен в стиле дзен. Однако сегодня 600-летний храм сгорел. В 03:17 областная пожарная часть отправила грузовики к храму. Местные прохожие говорят, что внутри никого не было, но бесценные буддийские статуи внутри были совершенно неузнаваемы. Местная следственная группа полиции обнаружила пропажу служителя храма. Поэтому они пришли к выводу, что служитель мог поджечь храм. В 15:00 полиция начала розыск преступника."
 japan.3.d: "На западной стороне Токио 129 человек погибли из-за отказа двигателя самолета Douglas C-124. При крушении Globemaster погибли 122 солдата и 7 летчиков. Два майора, отвечавшие за самолет, были очень опытными, и авиакатастрофа была неожиданной. Местный штаб-сержант ВВС США Роберт Д. Весс помог вытащить выживших из-под обломков. Однако все пассажиры погибли через несколько минут после авиакатастрофы в 04:34. В 05:50 первые медики прибыли на вертолете на арбузное поле, где разбился самолет, и подтвердили, что все мертвы. Это стало рекордом по количеству погибших в авиации."
 japan.4.d: "В японском городе Нагоя вышел новый фильм «Годзира». Режиссер Иширо Хонда, фильм показывает, как Годзилла атакует различные японские города, а затем, наконец, разрушается «Разрушителем кислорода», который разрушает атомы кислорода, вызывая удушье. Режиссер открыто заявил, что цель фильма - борьба с ядерными испытаниями. Японские критики заявили, что фильм неправдоподобен и лишь эксплуатирует известность инцидента «Счастливый дракон»."
