 SWE_The_Forsvarsmakten_desc: "Нашей обороной занимается «Försvarsmakten», буквально «Силы обороны». Они состоят из армии, ВВС и ВМФ, а также военных резервных сил-ополчения."
 SWE_The_Svenska_Marinen_desc: "Это ВМФ."
 SWE_The_Peoples_Home_Concept_desc: "«Folkhemmet», в переводе «Дом для народа» - концепция, тесно связанная с Социал-демократией и шведским «государством всеобщего благосостояния». Иногда называемый «шведским путем», «Folkhemmet» рассматривался как нечто среднее между капитализмом и социализмом. Основа концепции заключается в том, что все общество должно существовать подобно семье, где каждый не только вносит свой вклад, но также заботится друг о друге."
 SWE_Expand_NATO_Cooperation_desc: "Мы должны стремиться к нейтралитету в этом новом и меняющемся мире. По крайней мере, де-юре. Однако де-факто мы сотрудничаем с Западом и НАТО."
 SWE_Expand_Military_Funding_desc: "В этом мире ты должен уметь защищаться."
 SWE_The_Hajen_Class_Submarine_desc: "В конце Второй мировой войны шведский военно-морской флот отметил, что конструкция подводных лодок страны отстает и устарела по сравнению с новыми подводными лодками типов «XXI» и «XXIII», введенными «Кригсмарине» в конце войны. Победившие союзники рьяно охраняли полученную ими информацию о подводных лодках, а нейтральная Швеция, соответственно, не имела доступа к данным разработкам. К счастью, в конце войны, 8 мая 1945 года, недавно построенная немецкая подводная лодка типа XXI «U-3503» была затоплена в шведских территориальных водах у Гётеборга, что позволило шведам изучить новые технологии."
 SWE_The_Svenska_Armen_Desc: "Шведская армия – это вид вооруженных сил Швеции, предназначенный для ведения сухопутной войны."
 SWE_Bofors_Expansion_desc: "Расширение «Бофорса»"
 SWE_Import_British_Centurions_desc: "Великобритания согласилась продать по небольшой цене 200 танков «Центурион»."
 SWE_The_Volvo_L3314_desc: "В начале 1950-х годов «Вольво» получило заказ на новый военный вездеход для шведской армии. Они разработали «L3314», и он был принят на вооружение Шведской армии в 1959 году под обозначением «Personlastterrängbil 903»."
 SWE_Produce_Heavy_Water_in_Ljungaverk_desc: "Во время Второй мировой войны фабрика «Fosfatbolaget» производила в этом районе тяжелую воду для Германии и Америки. Теперь она могла бы произвести ее и для нас."
 SWE_Den_Svenska_Linjen_desc: "«Svenska Linjen» ссылается на исследования по атомной энергии 1955 года «о развитии гражданских ядерных технологий». В документе указывалось, что Швеция станет самодостаточной в этой области, инвестируя в полный шведский ядерный топливный цикл, основанный на отечественных урановых и тяжеловодных реакторах. Кроме того, большая часть этих инвестиций будет находиться под контролем государства как неотъемлемая часть шведской программы создания ядерного оружия."
 SWE_Expand_Funding_for_AB_Atomenergi_desc: "Финансирование ядерных исследований согласно «Svenska Linjen»"
 SWE_Attract_Nordic_Refugees_desc: "После войны многие люди в соседних странах остались без жилья и работы. Мы могли бы попытаться привлечь мигрантов из этих стран."
 SWE_Combat_Communist_Influence_in_the_Labor_Unions_desc: "«Allmänna säkerhetstjänsten, или же Служба общей безопасности, сообщила нам о нескольких попытках коммунистов оказать влияние на профсоюзы. Мы должны положить этому конец."
