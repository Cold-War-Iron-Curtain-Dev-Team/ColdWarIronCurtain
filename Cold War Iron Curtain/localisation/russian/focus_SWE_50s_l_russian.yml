 SWE_1958_Elections_desc: "Выборы"
 SWE_Seek_Norwegian_Heavy_Water_desc: "Ратифицировать Советско-афганский договор"
 SWE_Seperate_the_Church_and_State_desc: "\"почти любая секта, культ, или религия, получив достаточную политическую власть, возводят свои убеждения в ранг закона.\"\n- Роберт Э.Хайнлайн"
 SWE_The_Strong_Society_desc: "_"
 SWE_NUKES.1.d: "В шведском кабинете министров идут ожесточенные дебаты по поводу предложения Министерства обороны, согласно которому Швеции следует приобрести ядерное оружие для сохранения своего нейтралитета и независимости. Правительство считает, что обострение международной обстановки и стремительное расширение ядерных запасов СССР и США делает ядерное оружие основным сдерживающим фактором. Однако партнер по правительственной коалиции, Социал-демократический союз женщин Швеции (SSKF), решительно выступает против этого предложения. Они утверждают, что ядерное оружие приведет к милитаризации Швеции и повысит риск возникновения конфликта. А также протестуют против решения кабинета министров не дать высказаться общественности. Правительство должно принять решение:заполучить ядерное оружие с риском возникновения правительственной коалиции и негативной общественной реакции, либо оставить Швецию беззащитной перед ядерным угрозами и сдаться «SSKF»."
 SWE_NATO.1.d: "Правительство Швеции выступило с предложением относительно их позиции нейтралитета. Швеция предложила вступить в НАТО в обмен на право покупки ядерного оружия у США. Вступление Швеции в НАТО могло бы создать новое, современное, сильное в военном плане приграничное с Советским Союзом государство. Мы также заполучили бы больше возможностей для противодействия советской угрозе в Прибалтике. Однако многие в Государственном департаменте и Пентагоне выражают опасения по поводу данного предложения, заявляя, что распространение ядерных технологий и оружия снижает международный контроль, что непременно ставит под угрозу американские интересы. Белый дом должен принять окончательное решение по Швеции:передать ядерное оружие Щвеции в обмен на ее вступление в североатлантический альянс или же занять твердую позицию касательно политики нераспространении ядерного оружия."
 SWE_NATO.2.d: "Правительство Соединенных Штатов приняло наше предложение о вступлении в НАТО в обмен на ядерное оружие. Министерство обороны и вооруженные силы в восторге от этой новости. Нынешняя ядерная программа целиком зависит от американского сотрудничества, и их полная поддержка позволит создать мощное ядерное вооружение для сдерживания. Хотя Швеция, наконец, достигла своей цели, это происходит ценой шведского нейтралитета. Многие шведы, вероятно, будут обеспокоены и выступят против нашего решения. Мы будем внимательно следить за реакцией Советского Союза, его руководство давно предупреждало, что любое расширение НАТО, включая вступление Швеции, повлечет за собой серьезные ответные меры."
 SWE_NATO.3.d: "Правительство Соединенных Штатов отклонило наше предложение о вступлении в НАТО в обмен на американское ядерное оружие. Это большое разочарование для Министерства обороны и военных, которые давно выступают за приобретение ядерного сдерживания. Однако, как оказалось, Соединенные Штаты привержены принципу нераспространению, даже ценой потери потенциальных военных союзников. Несмотря на то, что соглашение не было достигнуто, некоторые члены правительства будут рады, что шведский нейтралитет остается в силе."
 SWE_NATO.4.d: "Посол в Стокгольме подтвердил информацию о том, что Швеция планирует вступить в НАТО. Это совершенно неприемлемый сдвиг в европейском балансе. Швеция граничит с СССР, предоставляя американскому альянсу возможность для перехвата советских судов и нанесения ударов по отдаленным советским территориям. НАТО также получит доступ к оборонной промышленности и военной мощи Швеции, существенно сместив баланс сил. Чтобы восстановить этот баланс, предлагается захватить стратегически важный остров Шпицберген, находящийся под контролем Норвегии, где находится множество шахт и многочисленное советское население. Контроль над ним был бы ключевым фактором, гарантирующим, что НАТО не сможет так легко перехватить наши морские поставки. Мы должны решить, стоит ли начинать этот исполнение этого плана, рискуя эскалацией конфликта с НАТО, или просто обойтись дипломатическими протестами."
 SWE.5.d: "Начиная с 1930-х годов шведское правительство стремилось реализовать политическую концепцию «Дом для народа».\" Основная идея – общество должно функционировать как семейная ячейка, а ее члены должны вносить свой вклад и заботиться друг о друге. Оно предлагает сбалансированный подход между капитализмом и социализмом. Абсолютной национализации или приватизации не существует, вместо этого правительство полагается на прямой контроль над экономикой. Классовая борьба заменяется классовым сотрудничеством во имя общенационального блага. Шведское правительство объявило о планах запустить новые программы социального обеспечения и расширить существующие программы, чтобы лучше служить народу."
 SWE_NUCLEAR.5.d: "Шведское правительство всецело поддерживает американскую инициативу «Атомы для мира». Ядерные технологии открывают перед Швецией широкие возможности для удовлетворения своих энергетических потребностей и обеспечения экономического роста. Инициатива дает возможность всем странам воспользоваться преимуществами ядерных технологий, а также свидетельствует о мирных намерениях Соединенных Штатов. Шведские ядерщики с нетерпением ожидают возможности начать напрямую сотрудничать с американскими экспертами для скорейшего внедрения ядерной энергии в повседневную жизнь людей."
 SWE_NUCLEAR.1.d: "Шведское правительство направило запрос на расширение сотрудничества в области атомной энергетики. Шведское государство начало проводить ядерные исследования еще в 1946 году. С нашей помощью они надеются использовать ядерную энергию для обеспечения экономического развития и энергетической независимости. На бумаге такое соглашение дало бы толчок нашим собственным исследованиям, поскольку в Швеции работают первоклассные исследователи. Однако согласно разведданным многие официальные лица Швеции верят в ядерное сдерживание, и знания, полученные от нас, могут ускорить тайную военную программу. Мы можем либо согласиться на сделку и надеяться, что шведы продолжат развитие мирной энергетики, либо отказаться от нее, потому что риски слишком высоки. "
 SWE_NUCLEAR.2.d: "США приняли наше предложение о расширении сотрудничества в сфере ядерной энергетики. Огромный объем данных и, что еще более важно, доступ к чертежам и основным документам, необходимым для ядерной энергетической программы. Расширение научного сотрудничества может также позволить нашим ученым усовершенствовать и проверять свои собственные теории. Правительство надеется на более быстрое развитие атомной энергетики в стране. По неофициальной информации, некоторые сотрудники службы безопасности считают, что развертывание этих объектов может принести долгосрочные выгоды для разработки ядерного оружия, если это будет необходимо в будущем."
 SWE_NUCLEAR.3.d: "Соединенные Штаты отвергли наше предложение о расширении сотрудничества в сфере ядерной энергетики. Это серьезное помеха для наших планов быстрого внедрения ядерной энергетики в Швеции. Мы считаем, что ядерная энергия представляет собой решение энергетического вопроса и поддержку экономики. Американское правительство заявило, что оно не может участвовать в таком соглашении из-за своих текущих международных обязательств. Однако Соединенные Штаты обеспокоены тем, что обмен знаниями и документами может быть использован для создания ядерного оружия, несмотря на наши настойчивые заявления о желании работать над развитием ядерной энергетики."
 SWE_NUCLEAR.20.d: "Ведущие ученые и специалисты по ядерным исследованиям направили правительству доклад о мерах, необходимых для создания внутреннего ядерного топливного цикла. Он включает в себя, как приобретение необходимых материалов, так и создание соответствующих объектов, а также шаги необходимые для получения Швецией собственной ядерной энергии. Амбициозный план требует сотрудничества нескольких министерств, корпораций и экспертов. Кроме того, правительство должно уделить время и выделить деньги для достижения успеха. Контроль за ядерным топливным циклом сохраняет энергетическую независимость Швеции и не позволит другому государству повлиять на процесс получения ядерной энергии."
 SWE_USA_NUK.1.d: "Шведское правительство предложило приобрести у нас ядерное оружие. Шведы ссылаются на растущую угрозу на своей границе со стороны Советского Союза и необходимость защиты от ядерного угроз в будущем. Пентагон и Государственный департамент отмечают, что гипотетическая потеря Швеции после советского вторжения ослабит северный фронт НАТО и рискует предоставить СССР преимущество. Ядерное оружие, скорее всего, предоставит Швеции фактор сдерживания, однако существует небольшой риск попадания страны под советское влияние. Кроме того, официальные представители предупреждают, что продажа этого оружия сделает будущие усилия по поддержке принципа нераспространения весьма спорными."
 SWE_USA_NUK.2.d: "Соединенные Штаты согласились предоставить нам ядерное оружие. Это знаменательное победа правительства для создания фактора ядерного сдерживания. Наши эксперты прогнозировали достижение таких возможностей уже много лет. создание надежных механизмов доставки не кажется слишком сложным учитывая, что наши собственные системы, особенно системы доставки, уже базируются на американских технологиях. Минобороны и военное командование планируют в ближайшее время провести совещание по вопросам развертывания и технического обслуживания вооружения."
 SWE_USA_NUK.3.d: "Соединенные Штаты отказались поставлять нам ядерное оружие. Похоже, они не могли согласиться на такую сделку, поскольку она противоречила их международной позиции в отношении политики ядерного нераспространения. Даже если бы соглашение держалось в секрете, его раскрытие поставило бы американцев под угрозу как внутри страны, так и на международном уровне. Несмотря на свой отказ, Соединенные Штаты выразили понимание задач, стоящих перед шведской нацией. Правительство должно рассмотреть другие варианты, как например, ускорение нашей собственной ядерной программы."
 SWE_ELECTIONS.1.d: "Жители Швеции идут на избирательные участки, чтобы проголосовать на всеобщих выборах 1952 года. Шведская социал-демократическая партия будет стремиться остаться у власти. Они надеются, что концепция классового единства ради национального блага и стремление идти по промежуточному пути социализма и капитализма по-прежнему привлекательны избирателям. Несколько правоцентристских и консервативных партий также борются за депутатские места. Они надеются получить достаточно голосов, чтобы сформировать коалицию и приблизить Швецию к свободной рыночной экономике и западу. Ожидается, что на предстоящих выборах развернется острая конкурентная борьба."
 SWE_ELECTIONS.2.d: "По всей Швеции проходят выборы 1956 года. Шведская социал-демократическая партия (SAP) надеется, что ее концепция развития Швеции как \"дома для народа\", наряду с их выступлениями за классовое единство найдут свой отклик у избирателей. Правоцентристские и правые партии надеются убедить шведов перейти к более свободной рыночной экономике, заявляя, что \"SAP\" продвигает повышение налогов и законы, которые тормозят экономический рост. Обозреватели не уверены, какая партия одержит победу на выборах."
 SWE_ELECTIONS.3.d: "По всей Швеции воцарилась напряженная атмосфера, когда миллионы людей пришли на избирательные участки, чтобы проголосовать на выборах 1958 года. Шведская социал-демократическая партия (SAP) надеется, что ее концепция развития Швеции как «Дома для народа», наряду с их выступлениями за классовое единство найдут свой отклик у избирателей. Однако она обязана сохранять сплоченность между своей более левой и умеренной фракцией внутри партии. Правоцентристские и правые партии надеются убедить шведов перейти к более свободной рыночной экономике, заявляя, что социал-демократическая партия (SAP) продвигает повышение налогов и законы, которые тормозят экономический рост. Для эффективной реализации своей законотворческой программы обе стороны будут стремиться к абсолютной победе на выборах."
 add_1_billion: "1 Миллиард Долларов"
 SWE_NATO.5.d: "НАТО объявило о вступлении Швеции в качестве нового члена. Это большая победа для организации, учитывая экономическую, военную и стратегическую ценность. Шведское правительство опубликовало заявление, в котором выразило свою радость в связи с совместной работой со странами, глубоко приверженными демократическим идеалам и кооперации. Ожидается, что в ближайшие недели высокопоставленная делегация , состоящая из шведских экономических и военных представителей, встретится с лидерами НАТО. Это заявление вызвало беспокойство в Европе из-за возможной реакции Советского Союза. Представители СССР часто предостерегали, что уход шведов от политики нейтралитета потребует ответных мер."
 SWE_NATO.6.d: "Члены НАТО собрались на экстренное заседание в связи с тем, что советские войска взяли под контроль норвежский остров Шпицберген. Стратегически важный остров, где живут в основном советские переселенцы, работающие на шахтах. Долгое время архипелаг был предметом спора между Советским Союзом и Норвегией. Советы утверждают, что захватили остров, чтобы помешать НАТО оккупировать или милитаризировать его, что идет в разрез с Договором о Шпицбергене. Поскольку договор был нарушен, Советские Власти заявили, что были вынуждены действовать. Многие связывают советские действия со вступлением Швеции в НАТО. Советы считают, что враждебная Швеция и присутствие НАТО на Шпицбергене поставят советское судоходство под недопустимую угрозу."
 SWE_Non_Prolif.1.d: "Шведское правительство призвало все страны принять меры, направленные на политику ядерного нераспространения и разоружения. В своем заявлении шведское правительство заявило, что распространение ядерного оружия представляет собой серьезный вызов глобальной безопасности и будущему человечества. Отныне Швеция будет стремиться содействовать сокращению, ликвидации ядерного оружия, а также бороться с распространением ядерного оружия по всему миру."
 SWE_Nukes.201.d: "Обсуждение программы ядерных вооружений закончилось решением шведского правительства прекратить попытки приобрести ядерное оружие. По-видимому, давление со стороны пацифистов среди членов правительства одержало верх. Кроме того, предполагаемые расходы на ядерную программу оказались слишком велики, и многие в правительстве считали, что данные ресурсы можно направить на социальные программы или на другие, более острые нужды армии. Несмотря на то, что Швеция больше не будет работать над созданием ядерного оружия, работа по освоению ядерной энергии, как ожидается, будет продолжена."
 OB_54.1.d: "Начались большие споры после публикации доклада под названием «ÖB-54» генерала Нильса Сведлунда, начальника генерального штаба. В докладе говорится, что единственным способом гарантировать безопасность и независимость Швеции – это приобретение ядерного оружия. Почти все политические партии занимают четкую позицию по этому вопросу, причем в более крупных партиях формируются фракции «за» и «против» ядерного оружия. Те, кто поддерживает данный доклад, отмечают, что Швеция находится на передовой между ядерными державами, и отсутствие такого оружия ставит страну под огромную угрозу. Однако противники опасаются, что ядерное оружие только привлечет больше внешних угроз и предоставит военным слишком большую власть. Как бы то ни было, похоже, что военные по этому вопросу уже озвучили свою позицию."
 SWE_NUCLEAR.10.d: "Недавно в Швеции был создан департамент ядерной физики для изучения  ядерной энергетики. Однако из недавних политических дебатов и осуществляемых национальных проектов становится ясно, что департамент может также проводить исследования в области ядерного оружия. Растет общественный протест против приобретения данного оружия, однако военные продолжают настаивать – это единственный способ защитить Швецию. Правительство могло бы воспользоваться этой ситуацией, чтобы отказаться от ядерной программы и решительно заявить, что последние разработки направлены исключительно на ядерную энергетическую программу."
 SWE_Nukes.100.d: "Швеция заявила о своем намерении продолжать программу создания ядерного оружия, несмотря на растущее общественное недовольство этой программой. Противники утверждают, что ядерное оружие идет вразрез с пацифистской сущностью Швеции, однако оно значительно усиливает вооруженные силы. Однако правительство отмечает, что хотело бы вовсе не иметь такой программы или крупных вооруженных сил, но международная ситуация вынуждает, чтобы Швеция обзавелась ядерным оружием. Во всяком случае, последняя война и ее влияние на Европу доказывают, что ни одна нация не может быть спокойна. И США, и Советский Союз выразили опасения по поводу недавних событий."
 SWE_Nukes.200.d: "Шведское правительство объявило, что больше не будет заниматься программой создания ядерного оружия и демонтирует ее. Будет передана все информация, имеющая отношение к развитию мирной ядерной энергетики. Это крупная победа для сторонников денуклеаризации, особенно для Национальной федерации социал-демократической партии Швеции, которая сыграла ведущую роль в данном вопросе и привлекла к обсуждению более широкое внимание общественности. Военные и более консервативные круги, вероятно, будут разочарованы таким результатом."
 SWE_USA_NUK.4.d: "Соединенные Штаты подтвердили продажу и передачу ядерного оружия Швеции. Соединенные Штаты отметили, что Швеция является приграничным с Советским Союзом государством, которое сталкивается с постоянными угрозами своей независимости и суверенитету. Предоставленное оружие обеспечит Швеции надежный фактор сдерживания и обеспечит свободу ее народу. Шведское правительство также отметило, что оружие защитит людей и уменьшит угрозу возникновения открытого конфликта. СССР и даже «Союзники» негативно отреагировали на эту новость, заявив, что американцы содействуют распространению ядерного оружия на международном уровне."
 SWE_ELECTIONS.10.d: "Шведская социал-демократическая партия (SAP) вновь победила на выборах, получив наибольшее число мест. Ожидается, что она сформирует коалицию с другими левыми партиями, в том числе с \"Союзом фермеров\". Партия связывает свою победу с тем, что шведы принимают концепцию «Дома для народа», где все граждане работают сообща ради процветания. Социал-демократической партия лидировала на выборах с 1920-х годов, и ее победа была весьма ожидаема, хотя оппозиции удалось отвоевать еще несколько мест."
 SWE_ELECTIONS.11.d: "Шведская социал-демократическая партия (SAP) получила наибольшее количество мест на последних выборах. Ожидается, что она сформирует коалицию с другими левыми партиями, включая центристский «Союз фермеров». Партия связывает свою победу с тем, что шведы принимают концепцию \"Дома для народа\", где все граждане работают сообща ради процветания. Социал-демократической партия лидировала на выборах с 1920-х годов. Несмотря на то, что коалиция выглядит стабильной, есть сведения, что некоторые ее участники обеспокоены предлагаемыми социальными программами."
 SWE_ELECTIONS.12.d: "Шведская социал-демократическая партия (SAP) получила наибольшее количество мест на последних выборах. Ожидается, что она сформирует коалицию с другими левыми партиями, включая центристский «Союз фермеров». Партия связывает свою победу с тем, что шведы принимают концепцию \"Дома для народа\", где все граждане работают сообща ради процветания. Социал-демократической партия лидировала на выборах с 1920-х годов. Лидеры партии подчеркнули, что ее победа свидетельствует о стремлении шведов жить в мире и единстве, а не в идеологической борьбе."
 SWE_ELECTIONS.13.d: "Коалиция правых партий, включая Консервативную партию и Либеральную Народную партию, сформировала новое правительство в Швеции. Это положило конец десятилетиям политического господства Шведской социал-демократической партии (SAP). Ее также называют коалицией буржуазии. Новая правящая коалиция поспешила заявить о своей победе, что отражает желание шведов о быстром экономическом росте посредством политики свободного рынка. Коалиция также обещает усилить вооруженные силы и укрепить связи Швецию с Западом."
 SWE_ELECTIONS.14.d: "Коалиция правых партий, включая Консервативную партию и Либеральную Народную партию, сформировала новое правительство в Швеции. Это удар по Шведской социал-демократической партии (SAP), которая имеет долгую историю успеха на выборах еще с 1920-х годов. Коалицию называют коалицией буржуазии. Новая правящая коалиция утверждает, что ее победа отражает желание шведов, которые хотят быстрого экономического роста с помощью политики свободного рынка. Коалиция также обещает усилить вооруженные силы и теснее связать Швецию с Западом."
 SWE_ELECTIONS.15.d: "Коалиция правых партий, включая Консервативную партию и Либеральную Народную партию, сформировала новое правительство в Швеции. Это удар по Шведской социал-демократической партии (SAP), которая имеет долгую историю успеха на выборах еще с 1920-х годов. Коалицию называют коалицией буржуазии. Новая правящая коалиция утверждает, что ее победа отражает желание шведов, которые хотят быстрого экономического роста с помощью политики свободного рынка. Коалиция также обещает усилить вооруженные силы и теснее связать Швецию с Западом. Аналитики полагают, что беспокойство со стороны Советского Союза послужило серьезным толчком для правых партий, выступающих за решительную оборону."