 AvroArrow.1.d: "Проект "Стрела" оказался проблематичным для канадского правительства по политическим причинам. Последние тенденции в области доставки ядерного оружия, по-видимому, указывают на увеличение роли межконтинентальных баллистических ракет и уменьшение значения стратегических бомбардировщиков, что заставляет некоторых сомневаться в ценности сверхзвукового перехватчика типа "стрела". Столкнувшись с растущим давлением на сокращение оборонных расходов и приведение своих стратегий воздушно-космической обороны в соответствии с Соединенными Штатами, канадское правительство объявило о прекращении производства CF-105. Отмена проекта поставила 15 000 канадцев без работы и поставила под сомнение будущее Avro Canada. Руководство аэрокосмической промышленности опасается, что отрасль не восстановится, отмечая, что "утечка мозгов" в Соединенные Штаты уже началась. "
 AvroArrow.2.d: "Советские бомбардировщики стремительно развиваются, и новые высокоскоростные советские самолеты теперь способны нести ядерное оружие в Северную Америку. Канада является первой линией обороны для Северной Америки, и если Советы пошлют свои бомбардировщики через Арктику, то именно ВВС США перехватят их. Чтобы противостоять Советскому бомбардировочному флоту, Avro Canada предлагает революционную конструкцию истребителя. CF-105 Arrow будет использовать двухмоторную конструкцию бесхвостого Дельта-крыла, направленную на максимизацию скорости, полезной нагрузки и запаса топлива. В то время как некоторые скептически относятся к высокозатратному проекту, ВВС настаивают на том, что они будут производить один из лучших высокоскоростных перехватчиков, которые когда-либо видел мир. С учетом дополнительного федерального финансирования Avro ожидает, что в проекте будет занято почти 15 000 канадцев. "
 Gladstone.1.d: "Джеймс Гладстон, весьма уважаемая фигура в Конфедерации черноногих, стал первым статусным индейцем, допущенным в Сенат Канады. Известный владелец ранчо, бывший член королевской Северо-Западной конной полиции и президент Ассоциации индейцев Альберты, Гладстон долгое время выступал за расширение прав и повышение статуса индейцев. Среди идей, которые он отстаивал, - лучшее образование, большее уважение к договорным правам и участие индийских народов в их собственном правительстве. Теперь, будучи полноправным членом верхней палаты парламента Канады, Гладстон решительно выступает за распространение избирательного права на всех канадских индейцев. С назначением Гладстона в Сенат многие ожидают, что в ближайшем будущем индейцы получат избирательные права. "
 CCF.1.d: "С самого начала Холодной войны Федерация Кооперативного Содружества подвергалась критике со стороны канадской общественности за их социалистические наклонности. Регинский манифест партии, который прямо призывал к национализации основных отраслей промышленности и ликвидации капиталистической системы, был заменен Виннипегской декларацией. Виннипегская декларация значительно смягчила позицию партии, выступающей за смешанную экономику и кейнсианскую, а не революционную экономическую политику. Хотя этот переход к социал-демократии представляет собой серьезное изменение для ФКС, еще предстоит выяснить, будет ли их новое направление лучше резонировать с канадцами. Некоторые идеи партии, однако, привлекли внимание населения, в первую очередь их предложения в области общественного здравоохранения. "
 OrgAmer.1.d: "Несмотря на тесные отношения с Соединенными Штатами, Канада скептически относится к вступлению в Организацию Американских Государств. Американский авантюризм в Южной Америке, противоречащие британские интересы в регионе и сомнительные материальные выгоды для Канады традиционно делают вопрос о членстве Канады в ВТО второстепенным. Недавние изменения приоритетов заставили канадское правительство пересмотреть эту политику, и в настоящее время ОАГ рассматривается как потенциальное средство, с помощью которого Канада может преследовать свои интересы в Южной Америке. Переговоры с ОАГ принесли свои плоды, и Канада была принята в качестве полноправного государства-члена. Ожидается, что Канада будет выступать за пропаганду демократических ценностей среди государств-членов. "
 CanEuro.1.d: "Британское правительство готовится подать заявление о вступлении во все более процветающее европейское экономическое сообщество. Будучи потенциально важным благом для экономики Соединенного Королевства и отношений с его континентальными союзниками, премьер-министр Канады выразил свою озабоченность по поводу отсутствия торговых гарантий с Содружеством. Премьер-министр также выразил свое разочарование тем, что Великобритания не проконсультировалась с Канадой или остальными странами Содружества по поводу своих планов вступления в ЕЭС. Хотя эта ссора, возможно, не будет иметь каких-либо особенно серьезных последствий для британо-канадских отношений, Канада, вероятно, будет стремиться к расширению торговых связей с Соединенными Штатами. "
 CanTrade.1.d: "Недавнее турне премьер-министра по странам Содружества укрепило его убежденность в том, что организация должна играть ключевую роль во внешней политике Канады. На основе исторической дружбы между Великобританией и ее бывшими белыми колониями и признания бывших колоний небелых стран в качестве равноправных партнеров премьер-министр планирует активно добиваться расширения Содружества как по размерам, так и по масштабам. Ожидается, что расширение торговых отношений, заключение оборонных соглашений и проведение консультаций по важным международным вопросам станут частью канадского видения более интегрированного Содружества Наций."
 London_Decleration.1.d: "Грядущие конституционные изменения в Индии побудили премьер-министров различных государств Содружества пересмотреть структуру британского Содружества. Премьер-министр Индии ясно дал понять, что, несмотря на свое желание продолжать сотрудничество с Содружеством, он намерен добиться того, чтобы Индия стала суверенной республикой и разорвала свои связи с Вестминстером. Дискуссии продолжались большую часть недели, пока премьер-министр Канады не предложил новое решение, согласно которому король будет занимать почетную должность главы Содружества, являющегося общим символом свободной ассоциации независимых государств-членов. Премьер-министр Индии согласился на компромисс, а из Лондона была выпущена декларация, превращающая Британское Содружество в Содружество Наций."
