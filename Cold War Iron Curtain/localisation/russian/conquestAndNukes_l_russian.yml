l_russian:
 conquest.1.t: "[GetNewspaperHeader]Падение Хельсинки"
 conquest.1.d: "После интенсивных боев столица Финляндии пала под натиском советских войск. Пока еще слышна стрельба, советские войска маршируют по Маннергейминтие, а шокированные граждане смотрят на них в недоумении.\n\nВсе финские флаги были заменены советскими, а в здании парламента было создано оккупационное правительство."
 conquest.1.a: ""Сису" не помогла им на этот раз"
 conquest.1.b: "Еще одна победа для родины"
 conquest.1.c: "Перкеле!"
  
