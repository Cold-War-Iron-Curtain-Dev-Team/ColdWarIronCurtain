l_english:
 conquest.1.t: ""
 conquest.1.d: "После интенсивных боев столица Финляндии пала под натиском советских войск. Пока еще слышна стрельба, советские войска маршируют по проспекту Маннергейма, а шокированные граждане наблюдают за происходящем в недоумении.\n\nВсе финские флаги были заменены советскими, а в здании парламента было создано оккупационное правительство."
 conquest.1.a: "\"Сису\" не помогла им на этот раз."
 conquest.1.b: "Еще одна победа для Родины."
 conquest.1.c: ""