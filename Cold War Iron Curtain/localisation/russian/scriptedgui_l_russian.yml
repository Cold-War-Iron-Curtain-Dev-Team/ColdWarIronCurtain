 COMECON_TECH_TT_1: "Разрушая патенты и авторские права между членами СЭВ, мы значительно увеличим исследовательскую премию для уже исследованных технологий, но это значительно затруднит будущие технологические достижения"
 COMECON_TECH_TT_2: "Более сбалансированный подход между двумя другими политиками, увеличит бонус за совместное использование технологий до 15%, но штраф за исследования 5%"
 COMECON_TECH_TT_3: "Нормальная скорость обмена технологиями"
 COMECON_INTEGRATION_1_TT: "На этом уровне 25% нашей промышленности уходит в Советский Союз, и мы получаем 50% бонус при торговле ресурсами с Советским Союзом и 25% - ный прирост производства наших ресурсов"
 COMECON_INTEGRATION_2_TT: "На этом уровне 12.5% нашей промышленности уходит в Советский Союз, и мы получаем 25% бонус при торговле ресурсами с Советским Союзом и 12.5% - ный прирост производства наших ресурсов"
 COMECON_INTEGRATION_3_TT: "На этом уровне 5% нашей промышленности уходит в Советский Союз, и мы получаем 25% бонус при торговле ресурсами с Советским Союзом и 5% - ный прирост производства наших ресурсов"
 COMECON_INTEGRATION_4_TT: "На этом уровне наша промышленность не уходит в Советский Союз, отказавшись от планирования СЭВ, национальная автономия будет медленно увеличиваться, однако мы не получим никаких торговых льгот или бонусов за добычу ресурсов"
