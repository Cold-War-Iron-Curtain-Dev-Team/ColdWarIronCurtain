l_russian:
 EGY_AI_BEHAVIOR: "@EGY Египет"
 IRQ_AI_BEHAVIOR: "@IRQ Ирак"
 RULE_OPTION_UAR: "Исторический"
 RULE_OPTION_UAR_HISTORICAL_AI_DESC: "Египетский ИИ расширит возможности Насера ​​и попытается сформировать Объединенную Арабскую Республику, пройдя по соответствующему пути в национальном дереве фокуса."
 RULE_OPTION_UAR_AHISTORICAL: "Коммунистический"
 RULE_OPTION_UAR_AHISTORICAL_AI_DESC: "Египетский ИИ позволит коммунистам взять верх и попытаться присоединиться к Варшавскому договору, пройдя по соответствующему пути в национальном дереве фокуса."
 RULE_DEMOCRATIC_EGY_AI_DESC: "Египетский ИИ превратится в демократическое государство и попытается сделать Египет процветающей демократией, пройдя по соответствующему пути в национальном дереве фокуса."
 RULE_OPTION_ISLAMIC: "Исламский"
 RULE_ISLAMIC_EGY_AI_DESC: "Египетский ИИ впадет в исламизм и попытается уничтожить Израиль, идя по соответствующему пути в национальном дереве фокуса."
 RULE_OPTION_FAROUK: "Фарук"
 RULE_FAROUK_EGY_AI_DESC: "Фарук"
 RULE_OPTION_COMMUNIST_IRQ_AI_DESC: "Иракский ИИ превратится в коммуниста и попытается присоединиться к Варшавскому пакту, пройдя по соответствующему пути в национальном дереве фокуса."
 RULE_OPTION_HISTORICAL_IRQ_AI_DESC: "Иракский ИИ будет пытаться следовать историческому пути и пытаться противостоять Объединенной Арабской Республике, идя по соответствующему пути в национальном дереве фокуса."
