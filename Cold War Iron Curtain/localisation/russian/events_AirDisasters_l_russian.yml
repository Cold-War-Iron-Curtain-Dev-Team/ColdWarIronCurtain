l_russian:
 air_disaster.1.d: "Вчера поздно вечером рейс авиакомпании Korean Airlines, вылетевший из международного аэропорта Теда Стивенса в Анкоридже, Аляска, и направлявшийся в международный аэропорт Кимпхо в Сеуле, Южная Корея, в 15:51 по UTC вторгся в советское воздушное пространство над камчаткой и был сбит из-за отказа самолета реагировать на предупреждающие знаки и сообщения советских военных. Советский Су-15 сбил гражданский авиалайнер с конгрессменом штата Джорджия Ларри Макдональдом на борту. Все 269 пассажиров самолета погибли."
 air_disaster.2.d: "Ранее этим днем рейс авиакомпании Эль-Аль вылетел из международного аэропорта Вена-Швехат в Вене, Австрия, и направился в аэропорт Лод в Тель-Авиве, Израиль. Он был сбит над Народной Республикой Болгария из-за отклонения от запланированного курса. Причина отклонения на данный момент неизвестна. Установлено, что самолет, выполнявший рейс Fl180, покинул воздушную трассу Amber-10 и отклонился на 200 миль вглубь болгарской территории. Экипаж проигнорировал предупредительные снаряды, выпущенные МиГ-15, эскадрилью которых союз разместил в Софии. Пинхас Бен-Порат, человек, который руководил формированием израильских ВВС и 101-й эскадрильи ВВС Израиля, погиб вместе с остальными пассажирами борта."
 air_disaster.3.d: "Трагедия произошла сегодня днем, когда самолет Avro Tudor V с бортовым названием 'Star Girl' потерпел крушение после попытки приземлиться на аэродроме Лландоу. По словам очевидцев самолет приблизился к взлетно-посадочной полосе на аномально малой высоте с выпущенным шасси. Только 3 человека выжили в этой катастрофе. Ещё 8 пассажиров были госпитализированы, но скончались в больнице от полученных ран. Это событие стало самой страшной авиакатастрофой за всю историю Уэльса."
 air_disaster.4.d: "Сегодня в аэропорту Лос-Родеос произошла катастрофа, повлекшая за собой гибель множества людей. Два Боинга 747, борт KLM и борт Pan American, столкнулись в тумане при попытке вылететь из аэропорта. Перегрузка в Лос-Родеос, вызванная террористической атакой в аэропорту Гран-Канарии, привела к страшной аварии, в результате которой погибли 583 человека. Всего 61 человек выжили в инциденте и все они были пассажирами борта Pan American. На данный момент это событие стало самой смертоносной авиакатастрофой в мире."
 air_disaster.5.d: "В мире рок-н-ролла произошла трагедия. Во время тура Winter Dance Party с участием Бадди Холли, Ричи Валенса и Джайлса Перри Ричардсона по прозвищу 'The Big Bopper' их борт Beechcraft V-Tail Bonanza исчез в снежной буре, окружившей муниципальный аэропорт Мейсон-Сити и вскоре был обнаружен тлеющим на кукурузном поле. Это произошло в 9:35 утра менее чем в шести милях от аэропорта. Этот день, 3 февраля 1959 года, будет, как некоторые говорят: 'Днем, когда умерла музыка'."
 air_disaster.6.d: "\nПосле крушения самолета DC-10 авиакомпании American Airlines в международном аэропорту О'Хара федеральное управление гражданской авиации под руководством главы Лангхорна Бонда сообщило, что сегодня вечером, 6 июля 1979 года, все базирующиеся в США самолеты DC-10, общим количеством 138 бортов, а также все DC- 10 из стран с двусторонними соглашениями с США будут выведены из эксплуатации. Моделям DC-10 отныне запрещено совершать полеты в воздушном пространстве США, за исключением бортов иностранных перевозчиков, возвращающих свои DC-10 на базы технического обслуживания."
  
 Thai_Focus_1_desc: "\nС приходом к власти националиста Плека Пибунсонгкрама государство перестало носить название Сиам. Таиланд - это страна многих национальностей и культур и это переименование было вызвано желанием лидера националистов модернизировать Таиланд в рамках компании по вестернизации, которая включала в себя ношение одежды в западном стиле, новый национальный гимн и флаг, а так же западный календарь. Вестернизация подразумевала в том числе и изменение названия страны на Таиланд. Оно должно было символизировать единство всех народов, говорящих на тайском, включая лаосцев и шанов, но не китайцев. Девизом кампании был «Таиланд для тайцев». После того, как Пибунсонгкрам был отстранен от власти в середине 1940-х годов, Сени Прамодж переименовал страну обратно в Сиам, ознаменовав это символом конца националистического режима. Но когда Плек Пибунсонгкрам вновь пришел к власти в 1949 году, то он снова вернул стране название Таиланд."
 Thai_Focus_2_desc: "Поступили срочные новости. Похоже, что офицеры Королевского флота Таиланда схватили премьер-министра Плека Пибунсонгкрама и держали его в заложниках во время церемонии передачи американского земснаряда 'Манхэттен', а затем доставили его на борт флагмана ВМФ HTMS 'Шри Аётха'. Корабль начал свой путь по реке Чаупхрая вниз по течению к центру военно-морского управления в Банг-На, но заговорщики не смогли обеспечить открытие Мемориального моста и флагман не смог продолжить свой курс. Быстро завязался бой и военно-морские подразделения, вставшие на сторону повстанцев, были подавлены полицией, армией и военно-воздушными силами, которые были и остаются лояльными правительству Таиланда. Корабль затонул, когда Плек Пибунсонгкрам был на борту и ему пришлось доплывать до берега вместе с моряками. Битва с заговорщиками привела к гибели 17 военнослужащих, восьми полицейских и 103 гражданских лиц; более 500 человек были ранены, а переворот был признан неудачным."
 Thai_Focus_3_desc: "После поражения повстанческих сил военно-морского флота при попытке переворота правительства Пибунсонгкрама, возглавляемая армией клика 'Группа Переворота' из сорока младших армейских офицеров, которые были вынуждены уйти в отставку по приказу премьер-министра Таиланда Приди Баномионга в конце Второй мировой войны, начала политическое маневрирование с целью расширения военного кабинета. Основными членами этой клики являются фельдмаршал Сарит Танарат, генерал полиции Фао Сианон и Фин Чунхаван. После попытки государственного переворота ВМС между гражданскими и военными лидерами завязалась политическая борьба за позиции в правительстве и клика 'Группа Переворота' попыталась убедить короля разрешить дальнейшее голосование военных на выборах и  увеличить количество военных правительственных чиновников, но она не увенчалось успехом. Позже 'Группа Переворота' попытались сделать свой ход, но она была сдержана исключительно влиянием Пибунсонгкрама, на поддержку которого клика полагалась в значительной мере. Поскольку король возвращался в Таиланд после поездки в Лозанну в Швейцарии, 'Группа Переворота' не могла рискнуть на прямую конфронтацию с монархом и поэтому они действовали осторожно, объявив по радио о роспуске парламента, восстановлении конституции 1932 года и формировании временного правительства. Пибунсонгкрам поначалу отказался, но позже все таки согласился с результатами переворота, вернувшись в кресло премьер-министра после недолгих переговоров."
 Thai_Focus_4_desc: "После поражения повстанческих сил военно-морского флота при попытке переворота правительства Пибунсонгкрама, возглавляемая армией клика 'Группа Переворота' из сорока младших армейских офицеров, которые были вынуждены уйти в отставку по приказу премьер-министра Таиланда Приди Баномионга в конце Второй мировой войны, начала политическое маневрирование с целью расширения военного кабинета. Основными членами этой клики являются фельдмаршал Сарит Танарат, генерал полиции Фао Сианон и Фин Чунхаван. После попытки государственного переворота ВМС между гражданскими и военными лидерами завязалась политическая борьба за позиции в правительстве, однако по результатам сохранилось статус-кво. Позже 'Группа Переворота' попытались сделать свой ход, но она была сдержана исключительно влиянием Пибунсонгкрама, на поддержку которого клика полагалась в значительной мере и он отказался от них, приказав арестовать половину клики, из-за чего другая половина пришла в крайнее отчаяние. Офицеры не нашли поддержку широких масс, поскольку король Таиланда вернулся домой после поездки в Лозанну в Швейцарии, свершив суд над арестованными офицерами, в следствии которого их освободили от занимаемых должностей в тайской армии без права восстановления. Похоже, что переворот полностью провалился."
 Thai_Focus_5_desc: "Сегодня правительству Плека Пибунсонгкрама был вручен ультиматум с требованием его отставки, подписанный 58 армейскими офицерами и возглавляемый Сарит Танаратом, тайским генералом, популярность которого в последние годы росла из-за слабого правления Пибунсонгкрамского правительства. Достаточно скоро начался масштабный общественный протест, направленный против действующего правительства. Разъяренная толпа направилась к резиденции Сарита, чтобы продемонстрировать поддержку требований армии. Всплывали сообщения о том, что Сарит Танарат и его армия уже начали государственный переворот, успешно захватив стратегические точки без сопротивления. Пибунсонгкрама нигде нет и скорее всего он бежал из страны после того, как попытка переворота ознаменовалась значительными успехами."
