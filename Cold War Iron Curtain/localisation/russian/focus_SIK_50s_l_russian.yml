l_russian:
 #Country Events 
 ETR.100.d: "Мы получили конфиденциальное письмо губернатору Синьцзяна из Советского Союза. Оно сообщает губернатору, что если мы согласимся сформировать коалицию с советами, а затем объявим независимость, Советы в свою очередь пообещают нашу защиту. Советское предложение, если оно будет принято, скорее всего освободит наш народ от ига Китая. Однако противники этого предложения указывают, что оно может заменить китайское господство русским. Что еще более важно, кажется, что Советы попытаются приобрести права на наши богатые природные ресурсы. Но в то же время это быть ценой свободы."
 ETR.105.d: "Советский Союз иногда был другом Восточно-Туркестанской республики, но его интересы меняются в определенное время. С 1945 года они держали нашего бывшего президента Алихана Тура под домашним арестом. Советы думали, что он был слишком независим и воинственнен в то время, когда они вели мирные переговоры в регионе. Чтобы укрепить наше государство и продемонстрировать, что мы можем говорить с Советами на равных, мы отправили запрос в Советский Союз об освобождении Алихана Тура."
 ETR.106.d: "К радости Восточно-Туркестанской Республики и ее народа Советский Союз объявил, что освободит нашего бывшего президента Алихана Тура из под домашнего ареста. Весть о его возвращении, несомненно, порадует людей и поднимет авторитет нашего правительства. Однако говорят, что китайцы и их союзники в регионе весьма недовольны советскими действиями, поскольку они чувствовали, что Алихан Тура станет голосом сепаратизма и насилия в регионе."
 ETR.107.d: "Наше правительство недавно просило Советский Союз освободить от домашнего ареста первого президента Восточного Туркестана Алихана Тура. Чувствовалось, что его задержание и отделение от своего народа заставили людей негативно относиться к Советскому Союзу. Однако, похоже, что советское правительство не прислушалось к нашим опасениям, поскольку они объявили, что не выпустят Элихана Тора. Неспособность нашего правительства вернуть бывшего президента подорвет отношения с Советами и подорвет народное доверие."
 ETR.125.d: "Правительство Восточно-Туркестанской Республики объявило о перестановках и реорганизации Национального Правящего Совета. Как только будут приняты решения о том, какие политики и политические фракции получат должности, нация будет об этом будет информирована. У нашего государства есть разные фракции, и все борются за влияние и позиции во власти, но есть надежда, что в конце концов будет создан эффективный Национальный Правящий Совет, который поведет государство к процветанию в это трудное время."
 ETR.20.d: "Правительство Китая продолжает оказывать давление на нашу нацию как в политическом плане, так и в военном, разместив на границе войска. Чтобы наш режим выжил и мечты нашего народа были осуществлены, мы должны просить вмешательства со стороны Советского Союза. Советская поддержка позволит нам победить любые махинации китайцев и их местных сторонников в регионе. Если Советский Союз примет нашу просьбу и вмешается, он будет вызван любовью нашего народа, и мы, несомненно, будем более восприимчивы к советским желаниям наших природных ресурсов."
 ETR.21.d: "Сегодня мы получили шокирующие новости. Советский Союз ответил на нашу просьбу о вмешательстве, заявив, что он не будет вмешиваться в наши дела. Мы считаем, что Советы просто не хотят злить китайцев, поскольку они стремятся к более тесным отношениям. По их мнению, народ Восточно-Туркестанской Республики явно не заслуживает советской помощи. Этот отказ подтверждает, что Советский Союз никогда не заботился о нашем деле и использовал нас только в своих интересах."
  
  
  
 #News Events 
 ETR.1001.d: "Восточно-Туркестанская республика сегодня провозгласила свою независимость. Правительство новообразованой республики заявило, что столетия иностранной, особенно китайской оккупации, подошли к концу, и что республика станет родиной степных людей во всем регионе. Они отметил, что недавнее соглашение коалиционного правительства с китайским государством не помогло людям Синьцзяна. Китайское правительство отреагировало на это заявление, заявив, что оно исходило от изгоев режима и негодяев, родившихся за границей. Скорее всего, это относится к советскому образованию многих руководителей Восточно-Туркестанской республики. Многие ждут реакции Советского Союза на это объявление, поскольку их поддержка независимости Республики Восточная Туркестан станет серьезным ударом по усилиям Китая по умиротворению региона."
 ETR.22.d: "Советский Союз объявил, что вмешается в ситиуацию в пользу Восточно-Туркестанской Республики (ВТР). Советское правительство отметило, что китайцы подвели народ региона, и единственный путь вперед - это то, что народ ВТР пойдет своим путем. Советская поддержка значительно укрепляет легитимность ВТР, и ее лидеры поспешили похвалить Советы за их позицию. Говорят, что советские войска на границе мобилизуются, а также, что некоторые подразделения, возможно, уже проникли в ВТР. Советы предупредили, что любые военные действия китайцев против ЕТР будут строго пресекаться. Китайское правительство еще не выступало с заявлениями после этого драматического советского заявления."
  
