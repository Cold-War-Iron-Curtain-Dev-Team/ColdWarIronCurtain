 #Indian Forces Repulsed (Pakistan/India event) 
 #"The Indian offensive along the ceasefire line has largely been repulsed by the Pakistan Army. Although the Indian forces appeared to make some initial gains, localized Pakistani counterattacks held firm. In particular, Indian forces appeared close to capturing the Haji Pir pass but were halted. Observers are watching the situation closely to see if Pakistan will launch its own offensive in response or work to cool down the escalating situation. This recent round of fighting was brought about after India discovered Pakistani troops were infiltrating into their controlled part of Kashmir to launch attacks. Both the United States and Soviet Union released statements calling for calm in the region." "The Indian offensive along the ceasefire line has largely been repulsed by the Pakistan Army. Although the Indian forces appeared to make some initial gains, localized Pakistani counterattacks held firm. In particular, Indian forces appeared close to capturing the Haji Pir pass but were halted. Observers are watching the situation closely to see if Pakistan will launch its own offensive in response or work to cool down the escalating situation. This recent round of fighting was brought about after India discovered Pakistani troops were infiltrating into their controlled part of Kashmir to launch attacks. Both the United States and Soviet Union released statements calling for calm in the region." #NT!
