 #Operation Nusrat (fires after PAK_Operation_Nusrat focus is completed) 
 #"The Pakistan Army recently launched Operation Nusrat. Pakistani forces along the Kashmir ceasefire lines are conducting reconnaissance operations to find gaps and infiltration points along the border. Small incursions are also being launched to test response times and local civilian reaction to our movements. The knowledge we are gaining will be crucial in potential operations in Kashmir. It appears the Indians are not aware of the full extent of our operations. Our troops are highly motivated and confident, these operations are raising morale and experience." "The Pakistan Army recently launched Operation Nusrat. Pakistani forces along the Kashmir ceasefire lines are conducting reconnaissance operations to find gaps and infiltration points along the border. Small incursions are also being launched to test response times and local civilian reaction to our movements. The knowledge we are gaining will be crucial in potential operations in Kashmir. It appears the Indians are not aware of the full extent of our operations. Our troops are highly motivated and confident, these operations are raising morale and experience." #NT!
 #-Good (national spirit, Operation Nusrat, increase in army intelligence, boost in attack, defense, morale, and organization) 
 #Selecting Men for Operation Gibraltar (fires from PAK_Prepare_For_Operation_Gibraltar) 
 #"After a series of high-level meetings involving senior officials from the cabinet and military, it was decided to reactivate Operation Gibraltar, a plan originally conceived in the early 1950s. The plan calls for the infiltration of Pakistani troops disguised as freedom fighters. These men would then conduct sabotage operations and encourage a popular uprising to end Indian rule in Kashmir. All of the soldiers involved are to be recruited from the Azad Kashmir Regiment. The plan is to conduct a month of specialized training before sending them over the border. Nine infiltration forces have been designated, each named after a famous figure from Islamic history." "After a series of high-level meetings involving senior officials from the cabinet and military, it was decided to reactivate Operation Gibraltar, a plan originally conceived in the early 1950s. The plan calls for the infiltration of Pakistani troops disguised as freedom fighters. These men would then conduct sabotage operations and encourage a popular uprising to end Indian rule in Kashmir. All of the soldiers involved are to be recruited from the Azad Kashmir Regiment. The plan is to conduct a month of specialized training before sending them over the border. Nine infiltration forces have been designated, each named after a famous figure from Islamic history." #NT!
 #-Operation Gibraltar will soon be ready (Launch Operation Gibraltar in 30 Days) 
 #Launch Operation Gibraltar 
 #"Columns of the infiltration forces crossed the border in Kashmir. They began moving to their planned areas of operations. However, the infiltration did not go as smoothly as we hoped. Some groups were discovered by locals who informed Indian authorities. They assumed our armed men, dressed as civilians, were armed criminals and not freedom fighters. Other forces are moving far slower to their areas of operations. Despite these setbacks, we have already received reports of some sabotage operations and armed clashes with Indian forces. Intercepted communications indicate the Indian Army believes an armed uprising maybe occurring. Ideally the locals will soon come to this conclusion as well and join in an uprising. Once the uprising begins in earnest our forces will advance to complete the liberation." "Columns of the infiltration forces crossed the border in Kashmir. They began moving to their planned areas of operations. However, the infiltration did not go as smoothly as we hoped. Some groups were discovered by locals who informed Indian authorities. They assumed our armed men, dressed as civilians, were armed criminals and not freedom fighters. Other forces are moving far slower to their areas of operations. Despite these setbacks, we have already received reports of some sabotage operations and armed clashes with Indian forces. Intercepted communications indicate the Indian Army believes an armed uprising maybe occurring. Ideally the locals will soon come to this conclusion as well and join in an uprising. Once the uprising begins in earnest our forces will advance to complete the liberation." #NT!
