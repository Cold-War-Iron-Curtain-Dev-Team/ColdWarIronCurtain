 #Indian Forces Make Gains (Pakistan Event) 
 #"The Indian offensive along the ceasefire line in Kashmir is making dangerous gains against Pakistani forces. The Indian Army recently announced its forces were now firmly in control of the Haji Pir pass. This revelation marks a major setback for Pakistani forces and threatens Muzaffarabad. It appears these offensives are limited in nature and not an all-out assault on Pakistani controlled Kashmir. The Indian government reiterated that Pakistan must withdraw all its infiltration forces from Indian Kashmir and that the recent military action was a direct response to Pakistani aggression. The Pakistan government has remained largely quiet. There are fears of further escalation in Kashmir despite calls from the United States and Soviet Union for a restoration of peace." "The Indian offensive along the ceasefire line in Kashmir is making dangerous gains against Pakistani forces. The Indian Army recently announced its forces were now firmly in control of the Haji Pir pass. This revelation marks a major setback for Pakistani forces and threatens Muzaffarabad. It appears these offensives are limited in nature and not an all-out assault on Pakistani controlled Kashmir. The Indian government reiterated that Pakistan must withdraw all its infiltration forces from Indian Kashmir and that the recent military action was a direct response to Pakistani aggression. The Pakistan government has remained largely quiet. There are fears of further escalation in Kashmir despite calls from the United States and Soviet Union for a restoration of peace." #NT!
