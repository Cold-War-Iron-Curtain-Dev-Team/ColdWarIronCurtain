 #Operation Gibraltar Not Effective 
 #"Operation Gibraltar has not advanced the way we had hoped. Many locals have either stayed away from our fighters or have led Indian forces to their camps. Most of our infiltration groups have taken heavy losses, with some even retreating to the border. At this point the Indian Army clearly realizes they are facing our troops and not insurgents. There have been heavy fire fights and some sabotage operations but not to the extent we hoped. We may need to consider escalating to phase two with a direct attack along the border by our forces to save the situation and not lose momentum." "Operation Gibraltar has not advanced the way we had hoped. Many locals have either stayed away from our fighters or have led Indian forces to their camps. Most of our infiltration groups have taken heavy losses, with some even retreating to the border. At this point the Indian Army clearly realizes they are facing our troops and not insurgents. There have been heavy fire fights and some sabotage operations but not to the extent we hoped. We may need to consider escalating to phase two with a direct attack along the border by our forces to save the situation and not lose momentum." #NT!
