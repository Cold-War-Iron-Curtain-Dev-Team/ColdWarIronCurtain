 #Problems in Kashmir (Indian Event) 
 #"Over the past few weeks our forces in Kashmir have engaged in heavy fighting against numerous groups of armed fighters. At first our local intelligence feared this was the beginning of an armed rebellion among the Kashmiris. However, it is now clear from the reports from locals and captured fighters that these are Pakistani regulars. We have two options in front of us, we can launch border offensives to punish the Pakistanis and take the fight to them. If we break through, we could improve our position along the ceasefire line and maybe even push for a resolution in Kashmir. The other option is to simply continue our operations to root out the infiltrators and restore normalcy in Kashmir as soon as possible." "Over the past few weeks our forces in Kashmir have engaged in heavy fighting against numerous groups of armed fighters. At first our local intelligence feared this was the beginning of an armed rebellion among the Kashmiris. However, it is now clear from the reports from locals and captured fighters that these are Pakistani regulars. We have two options in front of us, we can launch border offensives to punish the Pakistanis and take the fight to them. If we break through, we could improve our position along the ceasefire line and maybe even push for a resolution in Kashmir. The other option is to simply continue our operations to root out the infiltrators and restore normalcy in Kashmir as soon as possible." #NT!
