 india.50.t: "Казнь Натурама Винаяк Годзе"
 india.50.d: "Натурам Винаяк Годзе, сторонник индуистского национализма, убивший Махатму Ганди в 1948 году, только что был приговорен к смертной казни через повешение. Годзе предстал перед Высоким судом Пенджаба в Петергофе, Шимла. Хотя просьбы о смягчении наказания были сделаны двумя сыновьями Ганди, Манилалом Ганди и Рамдасом Ганди, они были отклонены премьер-министром Индии Джавахарлалом Неру, заместителем премьер-министра Валлабхбхай Патель и генерал-губернатором Чакраварти Раджагопалачари, а вскоре после этого Годзе был повешен в тюрьме Амбала."
 india.50.a: "Победа за других, поражение за других"
 india.51.t: "[GetNewspaperHeader]Казнь убийцы Ганди"
 india.51.d: "Сегодня Натурам Годзе, индуистский националист, был казнен за убийство известного защитника независимости Индии и борца за свободу Мохандаса Карамчанда Ганди. Он предстал перед Высоким судом Пенджаба в Петергофе, Шимла. Несмотря на то, что два сына Ганди, Манилал и Рамас Ганди, умоляли о его замене, премьер-министр Индии, заместитель премьер-министра и генерал-губернатор отвергли их просьбы. Повешение было совершено в тюрьме Амбала в Восточном Пенджабе."
 karachi.1.t: "Соглашение об установлении линии прекращения огня в регионе Джамму"
 india.51.a: "Смутные времена в Индии..."
 karachi.1.d: "Карачинское соглашение 1949 года было подписано военными представителями Индии и Пакистана под контролем Комиссии Организации Объединенных Наций для Индии и Пакистана и установило линию прекращения огня в Кашмире после индо-пакистанской войны 1947 года. линия, за которой с тех пор наблюдают наблюдатели из Организации Объединенных Наций. Подписавшимися:\nлейтенант. Генерал С. М. Шринагеш от имени Индии\nМайор. Генерал У. Дж. Коуторн от имени Пакистана\nЭрнандо Сампер и М. Дельвуа от имени UNCIP."
 Tripura.1.t: "Соглашение о слиянии в Трипуре"
 Tripura.1.d: "Штат Трипура был одним из древних княжеских штатов Индии. Согласно Раджмале, Трипурой постоянно правили 184 короля Трипури с суверенным и независимым статусом до ее слияния с Индийским союзом в 1949 году, после смерти последнего правящего короля Бир Бикрама Кишора Деббармана. Его преемнику Кириту Бикраму Кишору Деб Барману на момент слияния было тринадцать лет. Король Бир Бикрам Кишор Деббарман умер в 1947 году, после чего был сформирован Регентский совет для управления администрацией под председательством королевы Канчан Права Деви, матери Кирита Бикрама Кишора Деб Бармана.\nВ течение нескольких месяцев после неестественной кончины Король Бир Бикрам Кишор Деббарман, Трипура столкнулся с большим кризисом, с угрозами со стороны как внутренних, так и внешних сил. Королева Канчан Права Деви, как президент Регентского совета, оказалась под сильным давлением, чтобы она решила присоединиться к Индийскому союзу. По совету правительства Индии она распустила Регентский совет и стала единственным регентом 12 января 1948 года. Более чем через год она подписала «Соглашение о слиянии Трипуры», и Трипура стала частью Индийского союза. После этого он находился в ведении главного комиссара как штат категории «C»."
 Tripura.1.a: "Да благословит Господь наши совместные усилия на успех."
 india.2.d: "Индия добилась независимости от британского владычества 15 августа 1947 года. Независимость была получена благодаря Закону о независимости Индии 1947 года, акту парламента Соединенного Королевства, который разделил Британскую Индию на два новых независимых доминиона Британского Содружества. Индия получила независимость 15 августа 1947 года как конституционная монархия с Георгом VI в качестве главы государства и графом Маунтбеттеном в качестве генерал-губернатора.\n29 августа 1947 года был назначен Редакционный комитет для разработки проекта постоянной конституции под председательством Б.Р. Амбедкара. Проект конституции был подготовлен комитетом и представлен Учредительному собранию. Собрание собиралось на открытых для публики заседаниях в течение 166 дней в течение двух лет до принятия Конституции. После долгих обсуждений и внесения некоторых поправок члены Ассамблеи подписали два рукописных экземпляра документа."
 india.2.a: "День гордости для нас"
 india.2.b: "Поздравления"
 india.52.t: "Делийский пакт"
 india.52.d: "Между нами и Пакистаном только что был подписан Делийский пакт, также известный как пакт Лиаката-Неру, согласно которому беженцам разрешалось возвращаться, чтобы распоряжаться своей собственностью, награбленная собственность должна быть возвращена, насильственное обращение в другую веру не признавалось, а права меньшинств были подтверждены. Договор подписали в Нью-Дели премьер-министр Индии Джавахар Лал Неру и премьер-министр Пакистана Лиакат Али Хан. Договор стал результатом шестидневных переговоров, направленных на то, чтобы гарантировать права меньшинств в обеих странах после раздела Индии и предотвратить новую войну между нами."
 india.52.a: "Мир на данный момент"
 Sablin_Meme.1.d: "Валерий Саблин со стыдом и разочарованием смотрел себе под ноги, а его гибкие, но крепкие пальцы гладили орден «За заслуги перед Отечеством».\n\nЧертов хуесос.\"Как меня предала моя когда-то гордая рабочая нация? Разве мне не суждено быть чертовым Лениным, перевоплощенным с чертой Матери Терезы, которую культурный пролетарий мог бы чтить на все времена?\" толстый и деспотический Брежнев.Сегодня советский премьер выглядел особенно обрюзгшим, читая Саблину свой приговор.\n\nБрежнев начал перебирать каждую страницу обвинения Саблина, поправляя очки.\n\"Пожалуйста, помилуй бедных — сказал Суслов с виселицы хриплым, но властным голосом. сказал со стоическим ворчанием, которое заставило Саблина содрогнуться от страха и, к его удивлению, возбуждения.\n\n\"Могу ли я стать мучеником? Что, если моя смерть заставит советских людей объединиться вокруг меня в знак солидарности, выкрикивая мое имя? Саблин… Саблин…. Саблин… будут распевать. Теперь все меня вспомнят!\" - подумал он, и взволнованная, но детская ухмылка осветила его покрасневшее лицо.\n\nНе успел он закончить свои мысли, как два могучих советских офицера в подстриженных шортах цвета хаки схватили его за теплое тело и вытащили на улицу в перед могилой Ленина. Высокий офицер повалил Саблина на землю и надавил сапогом на горло опальным революционерам. Несмотря на толстую резину, Саблин чувствовал каждое сухожилие в офицерской стопе. Затем офицер наклонился к его уху. \n\n\"Ты жил, как Ленин, и теперь ты умрешь, как Ленин\", - прошептал офицер, прежде чем треск эхом разнесся по стенам Кремля. Когда звук затих, мир понял, что они потеряли величайшего революционера из когда-либо живших."
 PRC_NEFA_Offensive: "Наступление на Северо-восточное пограничное управление"
 UN_CEASEFIRE_PRC_1962: "Вступает в силу предписанное ООН прекращение огня"
 UN_CEASEFIRE_RAJ_1962: "Вступает в силу предписанное ООН прекращение огня"
 Naxalbari.1.d: "Революционер Чару Маджумдар завершил серию документов, определяющих идеологические принципы и революционную тактику воинствующих коммунистов-наксалитов. Документы осуждают Советский Союз как ревизионистский, осуждают индийское государство и призывают к народной войне для свержения правительства. Наксалиты являются членами более радикальной отколовшейся группы, покинувшей господствующую Индийскую коммунистическую партию. Они считали, что ИКП была скомпрометирована из-за участия в национальной политике и взаимодействия с наксалитами индийского штата как с буржуазным институтом. Письма уже распространяются по сельским районам, особенно в Бенгалии. Уже есть сообщения о том, что крестьяне в квартале Наксалбари округа Дарджилинг в Бенгалии начинают волноваться. Правительство Индии опасается, что эти документы могут спровоцировать массовые беспорядки."
 Naxalbari.2.d: "Крестьянские комитеты, вдохновленные работами Чахру Маджумдара, недавно образовались в округе Дарджилинг и начали захватывать землю у помещиков и обрабатывать ее без разрешения. Некоторые из пострадавших домовладельцев создали вооруженные группы, которые преследуют издольщиков, подозреваемых в причастности к этим комитетам. Воинствующие крестьяне отбирают у помещиков оружие, продовольствие и деньги. За последние несколько дней в Калькутту поступили сообщения о том, что вооруженные крестьяне штурмуют посты местного самоуправления и полиции, захватывая документы, касающиеся собственности на землю, и огнестрельное оружие. Попытки местных властей организовать полицейские банды не смогли вытеснить крестьян. Правительство Западной Бенгалии называет ситуацию с правопорядком вышедшей из-под контроля и требует развертывания военизированных формирований в регионе."
 Naxalbari.3.d: "Ситуация в округе Дарджилинг продолжает ухудшаться, поскольку усилия по развертыванию вооруженной полиции не смогли разогнать наксалитских крестьянских боевиков. Однако ситуация начала меняться, когда на место происшествия прибыли военизированные формирования. Эти хорошо вооруженные, обученные солдаты легко отогнали и разоружили ряд боевиков на начальных этапах. Правительство Индии сообщило СМИ, что развертывание и операции будут продолжаться до тех пор, пока не будет восстановлен закон и порядок. В заявлении повстанцев-коммунистов правительство Индии обвиняется в зверствах и использовании наемников для расправы над невинными крестьянами. В целом общественность больше заинтересована в восстановлении закона и порядка, чем в том, чтобы прислушиваться к требованиям наксалитов."
 Naxalbari.4.d: "После развертывания военизированных формирований наксалитское движение, похоже, ушло в подполье. Большинство крестьянских комитетов и вооруженных банд сдали оружие, а наиболее радикальные члены, по-видимому, отступили вглубь джунглей или растворились в деревнях. Индийское правительство высоко оценивает успешную операцию и отмечает, что несколько наиболее радикальных коммунистических боевиков были либо убиты, либо взяты в плен в ходе продолжающихся операций. Индийская общественность в значительной степени поддерживает действия правительства, поскольку многие считают наксалитов радикалами и рассматривают их публичные заявления как пропаганду. Премьер-министр и военные обеспокоены тем, что по окончании операции повстанцы могут просто вернуться, поэтому, как сообщается, они изучают варианты переговоров с местными крестьянскими лидерами."
 Naxalbari.5.d: "Крестьянские лидеры округа Дарджилинг объявили, что прекратят вооруженные операции против индийского государства и больше не будут поддерживать наксалитов. Правительство заявило, что как только крестьяне поняли, как их эксплуатируют наксалиты, они немедленно извинились и пообещали больше не сбиваться с пути. Представители крестьян утверждали, что они остаются лояльными гражданами Индии и ценят усилия правительства по восстановлению порядка, а также прислушиваются к жалобам крестьян. Правительство Индии, со своей стороны, заявило, что ценит поддержку крестьян и планирует прекратить военизированные операции в регионе. Правительство добавило, что будет стремиться решить проблемы крестьян, чтобы помочь восстановить мир в регионе. Этим заявлением правительство, похоже, положило конец крестьянским беспорядкам, но все еще есть опасения по поводу лидеров наксалитов, которым удалось в последние дни бежать из подполья."
 Naxalbari.6.d: "Наксалиты были занозой для правительства в течение нескольких лет. Премьер-министр, воспользовавшись чрезвычайной ситуацией, недавно приказал армии координировать свои действия с местными правоохранительными органами для полномасштабного наступления на группировку. После того, как необходимые силы были организованы, началась операция «Бег с препятствиями». Индийские войска, в том числе десантники, военизированные формирования и полиция, пронеслись по территории, контролируемой наксалитами. Сотни наксалитов были нейтрализованы, и не менее 20 000 подозреваемых членов находятся под стражей. Операция прошла с ошеломляющим успехом, но правительство держит ее детали в секрете от общественности, чтобы не допустить общественного беспокойства. СМИ информируют, чтобы они не сообщали об операции и не подвергались уголовному преследованию за угрозу национальной безопасности."
 Naxalbari.7.d: "Чару Маджумдар, основатель движения наксалитов и ведущий идеолог движения, скончался, находясь под стражей в Калькутте. Тюремные власти утверждают, что он умер от обширного сердечного приступа. Полицейские сопроводили тело в крематорий, где их встретила семья. Полиция не позволила семье осмотреть тело, прежде чем наблюдать за кремацией. Семья и критики правительства утверждают, что Маджумдар, вероятно, был убит под пытками, и осуждают правительство за политическое убийство. Маджумдар опубликовал много известных работ, но его будут помнить за его «Восемь документов», которые заложили идеологическую основу движения наксалитов. Наксалиты выступили с заявлением, в котором пообещали продолжить борьбу и добиться справедливости для своего лидера."
 SINO_INDIAN_WAR.0.d: "Пограничные споры между Индией и Китаем обострились с 1947 года. Индия обвинила Китай во вторжении на ее территорию в Северо-Восточной пограничной зоне (NEFA) и краже индийских земель путем оккупации Аксай-Чина. Китайцы, напротив, утверждают, что все эти территории исторически принадлежат Китаю. Они также обвиняют Индию во вмешательстве в дела Непала и Сиккима для защиты своих притязаний и интересов. Эта напряженность недавно обострилась после того, как китайское правительство опубликовало новую карту, подтверждающую его оккупацию Аксай-Чин и объявляющую всю NEFA своей собственностью. Премьер-министр Индии немедленно созвал совещание, чтобы определить, как Индия отреагирует на эту угрозу. Некоторые призывают к дипломатическим усилиям, а если это не удастся, к военному развертыванию. Другие выступают за немедленное развертывание военных, чтобы продемонстрировать решимость Индии перед лицом китайской провокации."
 SINO_INDIAN_WAR.1.d: "Индийская армия сообщила, что китайские патрули пересекли линию Мак-Магона и установили аванпосты в стратегических районах Северо-Восточной Азии. Недавняя публикация спорных карт в сочетании с этими вторжениями заставляет сотрудников разведки сделать вывод, что Китай, возможно, планирует захватить у нас NEFA. Индийские СМИ осуждают правительство и призывают к гораздо более жесткой линии в отношении Китая. Наши силы наблюдают за китайцами и, похоже, в данный момент держат их. Мы должны быстро решить, как противостоять китайской провокации, будь то дипломатическими или военными средствами."
 SINO_INDIAN_WAR.2.d: "Индийское правительство выступило с громким и публичным осуждением наших недавних карт, обвинив нас в оккупации индийской земли и претензиях на их территорию. Претензии Индии противоречат историческим фактам и основаны на британской империалистической пропаганде. Мы считаем, что индийцы либо пытаются сохранить лицо в глазах общественности, либо вынашивают опасные амбиции против Китая. Недавно мы получили приглашение провести официальные переговоры по спорным границам с Индией. Хотя мы справедливы в своих претензиях, может оказаться полезным выслушать индийцев и понять их амбиции. Высокопоставленные чиновники утверждают, что мы должны присутствовать на переговорах. Другие в правительстве утверждают, что мы должны просто отказаться, чтобы показать Индии, что нас не запугают."
 SINO_INDIAN_WAR.3.d: "Высокопоставленные китайские лидеры встретились со своими индийскими коллегами, чтобы провести переговоры об их спорных границах. Переговоры начались после дипломатической эскалации, вызванной публикацией карт китайским правительством, которое, как утверждает Индия, поставило свою территорию под власть Китая. В частности, индийское правительство считает, что Китай вторгается в прежние границы, о которых договорились Китай и британско-индийское колониальное правительство, а в случае с Аксай-Чином, который Индия считает частью Джамму и Кашмира, они просто захватили индийские земли. Китай, напротив, утверждает, что исторически оккупирует территорию Китая, а Индия не имеет исключительных претензий на Аксай-Чин из-за спорного характера Кашмира. Аналитики не уверены, сможет ли Индия достичь своих целей, поскольку Китай в значительной степени твердо контролирует спорные территории."
 SINO_INDIAN_WAR.4.d: "Индия начала наши обсуждения пограничных споров, призвав Китай уйти из Аксай-Чина. Индийцы утверждают, что эта территория исторически является частью Джамму и Кашмира, и поскольку княжеский правитель присоединил государство к Индии, эта земля принадлежит им. Наши собственные дипломаты отметили, что Индия не присутствовала на этой территории ни с точки зрения персонала, ни с точки зрения граждан, и именно наше правительство проложило дороги, связывающие этот район с Китаем. Кроме того, Кашмир является территорией международного спора, и у Индии нет исключительных претензий. Мы не собираемся отказываться от Аксай-Чина, он слишком важен для нас со стратегической точки зрения, и мы вложили в него значительные средства. Однако мы предложим Индии сделку, они должны принять наши претензии на Аксай-Чин, а мы отзовем свои претензии на территорию, которую они называют Северо-восточным пограничным районом."
 SINO_INDIAN_WAR.5.d: "Китайское правительство предложило соглашение о прекращении их претензий на Северо-восточную пограничную зону (NEFA) в обмен на признание нами их оккупации Аксай-Чина. Предложение по существу призывает сделать нынешние границы постоянными и положить конец спору. Китай определенно выигрывает больше всего, хотя установленная граница может снизить давление на Индию в плане безопасности. Однако старшие советники предупреждают, что соглашение будет воспринято как поражение Индии, и мы должны сделать встречное предложение. После обсуждения было решено, что мы попросим Китай также подтвердить признание границ Непала, Бутана и Сиккима. Кроме того, Китай должен признать Индию покровительницей Сиккима. Если Китай согласится на это, то сделка, безусловно, может быть достигнута. Мы также можем отвергнуть это явно предвзятое решение китайцев и признать, что они никогда серьезно не относились к переговорам."
 SINO_INDIAN_WAR.6.d: "Правительство Индии направило нам встречное предложение. Чтобы они приняли наши претензии на Аксай-Чин и сделали нынешнюю границу в NEFA постоянной, им нужно, чтобы мы подтвердили нынешние границы Бутана, Сиккима и Непала. Более того, они хотят, чтобы мы признали Сикким частью индийской сферы влияния. Принятие этого значительно затруднило бы будущую дипломатическую гибкость в Гималаях, но, по крайней мере, наши претензии больше не будут подвергаться критике со стороны Индии. Если это важно для нас, мы должны принять соглашение. Если нет, мы можем закончить переговоры. Мы уже контролируем Аксай-Чин и большую частью территории NEFA, поэтому отказ от подписания соглашения не станет катастрофой для нашего правительства."
 SINO_INDIAN_WAR.7.d: "Несмотря на широко распространенный скептицизм со стороны экспертов, лидеры Китая и Индии подписали всеобъемлющее соглашение для разрешения своего пограничного спора. В окончательном соглашении Индия должна признать, что Китай контролирует Аксай-Чин и их нынешнюю границу в спорной пограничной зоне NEFA. Взамен китайцы также должны принять текущую границу в NEFA и прекратить свои претензии на всю территорию Индии. Кроме того, Китай согласился принять нынешние границы Сиккима, Непала и Бутана, используя границы, установленные бывшим британским колониальным правительством Индии. Соглашение выглядит настоящим компромиссом. Китайский контроль над Аксай-Чином узаконен, а Индия прочно установила свое влияние среди гималайских государств."
 SINO_INDIAN_WAR.8.d: "Надежды на то, что Индия сможет договориться об урегулировании пограничных споров с Китаем, не оправдались. Индийские официальные лица и газеты обвиняют китайское правительство во враждебных территориальных планах в отношении Индии. В одной особенно резкой редакционной статье отмечалось, что китайцы захватили земли Индии с 1947 года, и когда Индия попыталась провести переговоры, чтобы попытаться положить конец этой агрессии, китайцы отказались сотрудничать и были удовлетворены своим воровством. Все чаще звучат призывы к правительству занять гораздо более решительную позицию, развернув войска на границе. В Китае реакция была в основном сдержанной: высокопоставленные чиновники и государственные СМИ заявляли, что Китай не имеет империалистических амбиций и не будет подвергаться запугиванию, чтобы Индия передала исторически сложившуюся китайскую территорию. По крайней мере, в одном отчете высокопоставленный китайский чиновник указал, что Индия должна быть благодарна Китаю за то, что он не выселил их насильственно с китайской территории, которую они продолжают оккупировать."
 SINO_INDIAN_WAR.9.d: "После сообщений о том, что китайцы медленно размещают войска в NEFA, премьер-министр созвал встречу на высоком уровне. Премьер-министр услышал от высокопоставленных чиновников министерства обороны и военачальников о планах реализации стратегии «Forward Policy» против китайских лазутчиков. Forward Policy призывает индийские войска установить посты за китайскими войсками, чтобы отрезать их от снабжения и заставить отступить. Генерал Б.М. Каул, ведущий сторонник этой стратегии, настаивает на том, что политика «Вперед» носит оборонительный характер и приведет к уходу китайцев с небольшим риском потерь. Он оценил китайские вооруженные силы в значительной степени как ополченцы. Некоторые высокопоставленные генералы выразили обеспокоенность по поводу эскалации конфликта и изоляции индийских сил на передовых постах, но в конце концов премьер-министр одобрил план реализации Forward Policy в NEFA."
 SINO_INDIAN_WAR.10.d: "Политика \"Forward Policy\" привела к успеху на линии Мак-Магона. Большинство китайских вторжений отступили за линию фронта. Индийская армия в восторге от результатов, и теперь они предложили план по созданию постов к северу от линии Мак-Магона и укреплению наших претензий на этот район. Многие офицеры считают, что операции подтверждают гипотезу о том, что китайским войскам не хватает современных военных стандартов. Однако некоторые другие высокопоставленные генералы призывают к осторожности, заявляя, что мы стабилизировали границы и не должны давить на опытных китайских военных. Премьер-министр должен решить, хочет ли он двигаться вперед, чтобы окончательно положить конец угрозе китайских вторжений."
 SINO_INDIAN_WAR.11.d: "Индийская армия установила ряд постов на нашей территории к северу от линии Мак-Магона. Индийцы утверждали, что линия Мак-Магона отмечает нашу границу, но это вторжение ясно показывает, что у них враждебные намерения. Наши собственные силы опасаются, что с этих постов индийцы вскоре перекроют движение подкреплений и припасов. Однако эти посты в значительной степени изолированы, и если мы переместим адекватные силы, они могут использовать тактику проникновения, чтобы отбросить индийцев назад. Решение за нами, должны ли мы отогнать индейцев или позволить им оттеснить нас и построить новую линию обороны."
 SINO_INDIAN_WAR.12.d: "Правительство Индии объявило, что его силы утвердили свою позицию в NEFA и нейтрализовали китайскую угрозу на этой территории. Индийская армия в своем заявлении высоко оценила профессионализм своих сил в проведении сложных операций. Китайское правительство не делало никаких публичных заявлений, но говорят, что его дипломаты критикуют Индию за ее враждебные действия. Похоже, китайское правительство не собирается воевать за эту территорию. Сообщается, что китайская делегация вылетела в Дели для проведения экстренных переговоров."
 SINO_INDIAN_WAR.13.d: "Делегация Китая прибыла в Дели для проведения экстренных переговоров с премьер-министром по поводу недавнего насилия вдоль границы в NEFA. Китайцы просят нас отойти к довоенной границе Линии Мак-Магона. Они пообещали, что если мы примем их, они позаботятся о том, чтобы их силы больше не совершали вторжений и уважали линию. Они предположили, что отказ может заставить Китай действовать. Предложение кажется разумным, поскольку мы уже давно призываем принять линию Мак-Магона в качестве границы. Однако в настоящее время у нас есть преимущество, и было бы глупо упускать эту возможность."
 SINO_INDIAN_WAR.14.d: "Индийское правительство продемонстрировало свои империалистические амбиции, отказавшись восстановить границы. Несмотря на наш призыв к восстановлению мира, индийцы вместо этого теперь оккупируют китайские земли, которые, как они утверждали, ранее не интересовали их. НОАК готова к действию и готова выдвинуться, если будет получен приказ. Мы должны решить, хотим ли мы начать наступление, чтобы выселить индийцев, или мы должны просто оставить ситуацию такой, какой она есть. Народ Китая чувствует себя униженным, возможно, сейчас время действовать и восстановить порядок."
 SINO_INDIAN_WAR.15.d: "Индийское правительство было ошеломлено, получив известие о том, что китайские войска атакуют индийские аванпосты вдоль наших позиций в NEFA. Китайское правительство заявило, что НОАК движется для восстановления порядка и стабильности в этом районе. Индийская армия, хотя и удивлена, обещает, что их силы более чем способны противостоять угрозе. Китайское правительство также заявило, что его действия должны преподать Индии урок скромности. Индийское правительство, напротив, осудило действия Китая, назвав их продолжением его враждебных действий с момента обретения независимости."
 SINO_INDIAN_WAR.16.d: "Индийцы и китайцы в настоящее время вовлечены в вооруженный конфликт. Многие в штабе считают, что это дает Пакистану возможность добиться успеха в Кашмире. Конфликт застал нашу разведку и военных врасплох, многие из наших сил в настоящее время находятся в отпуске. Однако, если мы отдадим приказ сейчас, мы можем попытаться выдвинуться из Хаджи Пира и Бурзила и захватить территорию к северу от Шринагара. Это продвижение значительно улучшит наше положение в Кашмире, но не спровоцирует индийцев или международное сообщество до уровня открытого осуждения. Однако, если атака провалится, мы можем понести непредвиденные потери. Мы должны принять решение о развертывании военных или нет."
 SINO_INDIAN_WAR.17.d: "Индийские военные доложили премьер-министру, что пакистанские войска начали ограниченное наступление в Кашмире. Ранние отчеты разведки и рекогносцировки показывают, что это не начало полномасштабного вторжения, а, по-видимому, оппортунистическая попытка закрепиться на границе, пока мы сражаемся с Китаем. Мы уже обращаемся к крупным державам с протестом против этой пакистанской агрессии, но, похоже, они мало что сделают, учитывая ее ограниченный масштаб. Несмотря ни на что, наши силы ответят и накажут пакистанцев за это предательство. Однако мы должны быть уверены, что не забываем о китайской угрозе. Народ должен сплотиться ради нации."
 SINO_INDIAN_WAR.18.d: "В последние часы бои в Кашмире стихли. Недавние сообщения указывают на то, что действует новое прекращение огня, и похоже, что Пакистан теперь оккупирует стратегическую территорию к северу от Шринагара. Сообщается, что ликующие толпы собираются в крупных городах Пакистана после объявления правительством об освобождении некоторых кашмирских земель. Индийское правительство до сих пор пыталось хранить молчание, однако из частных заявлений ясно, что в Кашмире произошла неудача. Аналитики отмечают, что Пакистан, вероятно, улучшил свое положение вдоль границы, но маловероятно, что они захватили огромное количество земель, поскольку это спровоцировало бы всеобщую войну и международное осуждение. Многие индийские газеты осуждают Пакистан за удар в спину, когда Индия борется с массовым коммунистическим китайским вторжением."
 SINO_INDIAN_WAR.19.d: "Недавнее пакистанское наступление против индийских войск в северном Кашмире закончилось неудачей. Пакистан надеялся воспользоваться китайско-индийским конфликтом, добившись успехов в Кашмире. Пакистан надеялся создать новую позицию, которая позволила бы ему в будущем легче освободить Кашмир. Вместо этого пакистанское наступление не только провалилось, но и привело к продвижению индийских войск и захвату стратегического перевала Бурзил. Поскольку перевал Бурзил находится под контролем Индии, они теперь могут угрожать Скарду. Правительство Пакистана признало, что неспровоцированное наступление Индии принесло незначительные успехи, но пакистанские силы предотвратили дальнейшие потери. Аналитики считают, что пакистанские военные, возможно, бросились в бой, надеясь добиться внезапности, но это закончилось для них неприятными последствиями. Поступают сообщения о том, что собираются разгневанные пакистанские толпы, а индийские СМИ полны похвалой вооруженным силам."
 SINO_INDIAN_WAR.20.d: "Индийское правительство заявило, что ее силы отразили вторгшиеся китайские войска и установили новую линию к северу от линии Мак-Магона. Индия утверждает, что начала действия только после нескольких лет китайских провокаций. Китайское правительство поспешило осудить Индию за ее агрессию против китайского народа и заявило, что их силы просто были застигнуты врасплох, а не побеждены в бою. Говорят, что индийская армия в восторге от своих недавних действий, которые не только отразили нападение китайцев, но и отбросили их назад. В то время как китайское правительство недооценивает масштабы боевых действий, в частном порядке многие аналитики полагают, что Пекин, вероятно, проведет всестороннюю оценку своих вооруженных сил. Индия должна решить, хочет ли она навсегда оккупировать завоеванные земли, рискуя начать всеобщую войну с Китаем, вернуть землю в обмен на гарантии безопасности или воспользоваться своим преимуществом и продвинуться вглубь китайской территории."
 SINO_INDIAN_WAR.21.d: "После наших недавних столкновений с агрессивными и коварно подготовленными индийскими военными они оккупировали земли, на которые они изначально не претендовали. Они называют это естественной границей своей территории под названием Северо-восточное пограничное управление (NEFA). Разведка сообщает, что индийские войска окапываются и строят постоянные строительные площадки. Мы должны решить, как действовать: либо принять завоевания индийцев и восстановить линию прекращения огня, либо расширить конфликт и начать всеобщую войну, чтобы вытеснить индийцев с этих земель."
 SINO_INDIAN_WAR.22.d: "Индийское правительство направило высокопоставленного дипломата, чтобы в частном порядке передать сообщение. мы  должны принять доконфликтную линию Мак-Магона в качестве постоянной границы и публично отказаться от своих претензий на земли к югу от так называемой линии Мак-Магона. Предложение показалось разумным, и наше правительство его приняло, хотя дальнейшее требование о выходе из Аксай-Чина было отклонено. В течение следующих нескольких дней индийская армия вывела свои войска, а наши войска вернулись в этот район. Наши командиры получили строгие инструкции подчиняться установленной до конфликта линии, поскольку индейцы ясно дали понять, что невыполнение этого требования может привести к новой атаке. Индийцы злорадствуют по поводу своего успеха, а мы должны выяснить, что пошло не так."
 SINO_INDIAN_WAR.23.d: "Премьер-министр Индии похвалил народ Индии и вооруженные силы за их непоколебимую храбрость перед лицом массированной агрессии Китая на границе. Нарисовав ужасную картину, премьер-министр отметил, что китайцы были всего в нескольких милях от того, чтобы достичь равнин Индии и опустошить страну, прежде чем индийские военные разгромят их. Замечания прозвучали после сообщений о том, что Индия успешно отразила китайское наступление вдоль их спорной границы в Северо-восточном пограничном управлении. Китайское правительство преуменьшало недавние неудачи, обвиняя Индию в том, что она является агрессором, и сильно преувеличивая масштабы боевых действий. Китайские СМИ изображают боевые действия как небольшую стычку, но аналитики считают, что правда лежит между двумя изображаемыми историями."
 SINO_INDIAN_WAR.24.d: "НОАК успешно оттеснила индийские войска, оккупировавшие наши земли, и даже продвинулась вглубь NEFA. Некоторые сообщения называют поражение Индии катастрофическим и утверждают, что Китай практически полностью оккупировал NEFA. Эти сообщения не за горами, наши силы скоро будут контролировать NEFA и готовы нанести сокрушительный удар по самой Индии. Однако это может спровоцировать международную интервенцию, и наши командиры не уверены, есть ли у нас материально-технические возможности для вторжения в такую большую страну. Мы можем либо надавить и открыть конфликт, объявить NEFA нашим и рискнуть расширить конфликт с Индией, либо просто объявить о прекращении огня и вернуться к тому, что мы считаем довоенными границами, чтобы максимизировать психологический, дипломатический и военный успех наших сил."
 SINO_INDIAN_WAR.25.d: "Сикким долгое время был марионеткой индийского правительства. Его народ контролируется марионеточным принцем, поставленным туда британскими империалистами и поддерживаемым государством-правопреемником Индии. Эта территория предоставляет возможность Индии возможность шпионить за нами, а сикхимский статус «независимого» государства делает это территорию идеальным буфером для них. Поскольку наш конфликт в Индии разгорается, в наших интересах больше не принимать миф о Сиккиме и его искусственных границах. НОАК готова выступить и освободить свой народ от местной тирании и индийской гегемонии. Однако выбор того, что делать с Сиккимом, в конечном итоге остается за председателем и Политбюро."
 SINO_INDIAN_WAR.26.d: "После наших неудач в недавнем пограничном конфликте с Китаем мы потеряли Северо-восточное пограничное управление. Китайцы атаковали с подавляющей и смертоносной силой, застигнув наши силы врасплох и захватив земли. В отчетах разведки указано, что китайцы в настоящее время ведут раскопки на территории и перемещают материалы для создания постоянных сооружений, чтобы укрепить свои претензии. Индийские военные признают, что получили удар в недавнем конфликте, но если их призовут, они нанесут ответный удар. Мы можем приказать военным обострить конфликт и начать полномасштабную атаку, чтобы отбросить захватчиков, или мы можем оставить ситуацию как есть и позволить этим боевым действиям закончиться."
 SINO_INDIAN_WAR.27.d: "Китайское правительство объявило о прекращении огня и отвело свои силы к доконфликтной границе с Индией вдоль так называемой линии Мак-Магона. Эта новость ошеломила индийское правительство, которое недавно обратилось с отчаянным призывом о помощи, чтобы справиться с тем, что оно назвало китайской агрессией. Китайское правительство настаивало на том, что его силы действовали в обороне, и, поскольку Китай не был имперской державой, у него не было желания вторгаться или оккупировать какую-либо другую страну. Аналитики предполагают, что действия Китая знаменуют собой дипломатическую и военную победу. Не захватив земли, Китай подорвал аргумент Индии о том, что она столкнулась с массовым вторжением из Китая. Кроме того, публично демонстрируя, что именно их силы выводились из Индии без какой-либо угрозы, это подчеркивает основательность их военных успехов в конфликте. Индийские СМИ уже публикуют критические статьи, а источники сообщают, что индийское правительство планирует провести активную переоценку ценностей."
 SINO_INDIAN_WAR.28.d: "Недавний конфликт между Индией и Китаем вдоль их спорной границы в Северо-восточном пограничном управлении закончился военной победой Китая. Индийские вооруженные силы оказались неспособными выполнить эту задачу, и во время конфликта их считали плохо оснащенными и плохо управляемыми. Многие индийцы считают, что эта неспособность снабжать высоко мотивированных и обученных солдат и руководить ими является результатом самоуспокоенности и сохраняющегося колониального влияния на институт. Для Китая военная победа рассматривается как подтверждение того, что НОАК способна не только вести массовые войны, но и справляться с локальными угрозами своим границам. Многие теперь предполагают, что боевые действия в Индии представляют собой план, который можно использовать в других сложных приграничных районах. Китайские лидеры в восторге от успешной координации дипломатических, военных и политических сил для достижения успеха."
 SINO_INDIAN_WAR.29.d: "Индийское правительство обратилось с отчаянным призывом оказать обширную военную помощь для укрепления индийских вооруженных сил перед лицом угрозы со стороны коммунистического Китая. Отчеты разведки предупреждают, что наступление коммунистов в Индии может спровоцировать выход индийских коммунистов из правительства и подорвать единство Индии. Они предлагают, чтобы мы предоставили военную помощь, особенно горным боевым подразделениям, чтобы помочь укрепить их оборону и помочь им предотвратить глубокое проникновение коммунистов. Хотя кажется естественным, что мы должны помогать Индии в борьбе с коммунистическим врагом, некоторые представители администрации предупреждают, что индийское правительство исторически было холодным по отношению к Западу. Кроме того, предоставление такой помощи вызовет гневную реакцию Пакистана. Мы должны решить, как действовать."
 SINO_INDIAN_WAR.30.d: "Экстренное оборудование западных вооружений прибыло, чтобы помочь индийской армии в защите от Китая. Хотя наше правительство запросило гораздо больший пакет помощи и призвало западные бомбардировщики атаковать китайцев, эта поддержка улучшит наши возможности. Министерство обороны будет контролировать интеграцию такого оборудования в наши силы, и мы направили письмо с благодарностью Соединенным Штатам. Пакистан в ярости из-за этого решения, но это не имеет значения, Индия нуждается в этой поддержке, чтобы защитить себя. Индийские коммунистические активисты также осуждают эту акцию, но мы сообщили общественности, что принятие такой помощи не означает, что мы присоединились к западному лагерю."
 SINO_INDIAN_WAR.31.d: "Поскольку конфликт между Индией и Китаем перерастает в полномасштабную войну, у нас может появиться возможность. Мы можем мобилизовать наши силы и атаковать Индию, поскольку они, несомненно, отвлечены этим конфликтом. Многие выступают за то, чтобы сильный удар мог обеспечить безопасность Кашмира и, возможно, решить некоторые из оставшихся после раздела территориальных проблем. Некоторые в стране уже призывают правительство использовать эту прекрасную возможность. Однако другие представители правительства призывают к осторожности. Они опасаются, что, если мы присоединимся к войне, мы можем оказаться в международной изоляции и потерять ключевую поддержку ООН для решения вопроса Кашмира."
 SINO_INDIAN_WAR.32.d: "Американский посол вызвал президента на частную беседу. Посол предупредил, что Соединенным Штатам известно о наших планах присоединиться к войне против Индии. Он добавил, что если такие действия будут предприняты, Соединенные Штаты прекратят всю военную и экономическую помощь. Они также окажут давление на своих союзников, чтобы они прекратили поддерживать нас, что существенно нанесет ущерб нашей экономике и серьезно ослабит вооруженные силы. Соединенные Штаты не могут допустить, чтобы один из их региональных союзников присоединился к коммунистической стране в агрессивной войне. После этого предупреждения президент созвал экстренное заседание кабинета министров. После непродолжительного обсуждения было решено, что текущие планы по вступлению в войну будут отложены."
 SINO_INDIAN_WAR.33.d: "В редком акте сотрудничества Соединенные Штаты и Советский Союз оказали сильное давление, прямо или косвенно, на Китай и Индию. Они оказывают давление на обе стороны, чтобы они как можно скорее прекратили нынешние боевые действия и восстановили мир в регионе. Пока оба правительства сопротивляются давлению сверхдержав. Однако международное сообщество обеспокоено потенциальными гуманитарными или более широкими геополитическими последствиями войны, если она продлится слишком долго. В частном порядке лидеры Китая и Индии информируют своих командиров о том, что они должны добиться результатов как можно скорее."
 SINO_INDIAN_WAR.34.d: "Организация Объединенных Наций объявила о вступлении в силу режима прекращения огня между Китаем и Индией. Недавний конфликт обострился после серии пограничных столкновений вдоль линии Мак-Магона в восточных Гималаях. Этот пограничный конфликт перерос в общую войну, но международное сообщество быстро оказало сильное давление, чтобы боевые действия прекратились. Были опасения по поводу гуманитарных издержек, связанных с тотальной войной двух крупнейших групп населения друг с другом. Ближайшие дни подведут окончательные итоги конфликта."
 SINO_INDIAN_WAR.35.d: "После прекращения огня ООН становится ясно, что Индия доминирует над бывшей линией Мак-Магона. Китайские войска в значительной степени были изгнаны, и правительство Индии заявляет, что сохранит контроль, чтобы защитить северо-восточную пограничную зону от будущей агрессии Китая. Китайское правительство выступило с кратким заявлением, осуждающим индийский милитаризм и империалистические амбиции. Пекин уже давно претендует на эту территорию, включая всю NEFA, как на свою собственную, но после этой неудачи ему придеться смириться с контролем Индии над этой территорией."
 SINO_INDIAN_WAR.36.d: "Индия резко осудила китайскую оккупацию Аксай-Чина, когда обнаружила, что Китай построил автомагистрали, соединяющие этот регион с Китаем. Индия утверждала, что эта земля исторически была частью Кашмира и, следовательно, находилась под контролем Индии. Китай не согласился, заявив, что эта земля исторически является китайской, и отметив, что Кашмир оспаривался, что отрицает любые претензии Индии на полную власть. Во время центового конфликта индийским военным удалось успешно вытеснить китайские войска и впервые в истории Индии занять Аксай-Чин. Когда вступило в силу прекращение огня, правительство Индии объявило об освобождении кашмирской земли и изгнании одного из иностранных оккупантов бывшего княжества. Он добавил, что полное освобождение будет вопросом времени. Это последнее заявление разозлило пакистанских лидеров, которые выступили с заявлением протеста. Наблюдатели отмечают, что после победы в Аксай-Чине Пакистан стал более дипломатически изолирован в отношении Кашмира, а Китай потерял ключевую связь между своими основными землями и Синьцзяном."
 SINO_INDIAN_WAR.37.d: "Серьезной неудачей для Китая стало то, что победившее правительство Индии объявило о создании нового временного правительства Тибета после прекращения огня ООН, положившего конец их недавнему конфликту. Новое правительство в Лхасе должно способствовать возвращению независимого тибетского государства. Успешное наступление индийских войск подтолкнуло китайцев к тому, что их присутствие в Тибете кажется все более несостоятельным. Многие западные государства поспешили похвалить это решение, и говорят, что Далай-лама готовится к своему возвращению в Лхасу. Китайское правительство осуждает установление марионеточного режима, и в частном порядке опасаются, что Тибет может быть потерян навсегда. В Лхасе есть сообщения о том, что мирные жители празднуют, а индийские войска наблюдают за происходящим, обеспечивая безопасность праздничной атмосферы."
 SINO_INDIAN_WAR.38.d: "После прекращения боевых действий между Китаем и Индией при режиме прекращения огня при посредничестве ООН китайцы объявили, что полностью овладели своими законными претензиями вдоль своей восточной границы. Индийское правительство хранит молчание, но в частном порядке некоторые официальные лица признали, что китайцы полностью контролируют не только линию Мак-Магона, но и все Северо-восточное пограничное управление. Отсутствие реакции Индии и огромное международное давление, которое привело к прекращению огня, указывают на то, что Индии, вероятно, придется смириться с территориальной неудачей."
 SINO_INDIAN_WAR.39.d: "По окончании боевых действий между Индией и Китаем китайские войска захватили большую часть индийского Кашмира. Некоторые кашмирцы встречают китайцев как освободителей, а китайские войска встречают самодельными кашмирскими, пакистанскими и китайскими флагами. Это недавно привело к смущающим пропагандистским фотографиям и случаям, когда пакистанские офицеры выступали в качестве «наблюдателей», посещая кашмирских лидеров. Китайское правительство повысило ставки, заявив, что вскоре они уйдут из Кашмира, но при условии, что Индия выполнит резолюции ООН по Кашмиру и проведет референдум. Альтернативой является продолжение оккупации Кашмира Китаем или, что более вероятно, передачи территории Пакистану. Ожидается, что правительство Индии вскоре объявит о своем намерении провести референдум, который приведет к уходу Китая и новому будущему Кашмира."
 SINO_INDIAN_WAR.40.d: "Во время недавнего конфликта между Индией и Китаем НОАК удалось захватить Сикким. Китайцы изображали завоевание как освобождение от коррумпированного, поддерживаемого Индией марионеточного режима. Индийское правительство назвало это захватом земли и призвало жителей Сиккима оставаться сильными в трудные времена. Несмотря на это, китайцы по-прежнему твердо контролируют Сикким, и китайцы уже объявляют о планах интеграции бывшего княжества по образцу того, что правительство сделало в Тибете. Бывшая королевская семья Сиккима бежала в Дели и проводит пресс-конференции с индийскими и мировыми СМИ."
 SINO_INDIAN_WAR.41.d: "Китайское правительство официально передало власть новому независимому кашмирскому правительству в Шринагаре. Китайцы утверждали, что кашмирцы годами оставались под автократическим правлением монарха, поддерживаемого Великобританией, только для того, чтобы затем стать жертвами индийского и пакистанского империализма. Новое правительство Кашмира опубликовало собственное заявление, в котором впервые с 1947 года утверждается, что весь Кашмир находится под управлением одного правительства. Он добавил, что впервые в своей истории провинция окажется под контролем кашмирского народа. Это последний удар по Пакистану и Индии после их военного поражения от Китая. Новое кашмирское государство обеспечивает Китаю стратегический буфер и значительно ослабит геополитическое положение побежденных государств. Индия и Пакистан выступили с заявлениями, в которых выразили свое разочарование этими событиями."
 CMC_Sino_India_War.260.d: "Китайское правительство уступило международному давлению, чтобы остановить войну против Индии. Международная коалиция, включающая Соединенные Штаты и Советский Союз, недавно сформировалась в ответ на эскалацию китайского вторжения в Индию. Мощная антикитайская коалиция призывает Китай прекратить войну и восстановить территорию Индии. Правительство Индии приветствовало эту новость, назвав ее победой мира и неизменной поддержкой международного сотрудничества. Говорят, китайцы огорчены этой новостью. Ведущие издания называют коалицию неоимпериалистическим заговором, призванным сдержать Китай."
 India_Pak_War_65.1.d: "Вскоре мы обратимся к ООН, чтобы договориться о прекращении огня, чтобы положить конец нынешней войне против Пакистана. Наши высокопоставленные чиновники и военное руководство полагают, что продолжение конфликта не сильно изменит текущую ситуацию на местах. Наши люди и военные сражались с огромным мужеством и дисциплиной. Пакистанская агрессия была встречена нашим сильнейшим сопротивлением, и мы не можем ожидать большего. Теперь наш долг — довести конфликт до конца и положить конец боевым действиям."
 India_Pak_War_65.2.d: "Наши вооруженные силы дали достойный ответ на недавнюю агрессию Пакистана. Результат их безумия очевиден для всего мира. Однако нескончаемый конфликт и гонка вооружений в Южной Азии — это не та судьба, которую наши основатели представляли для Индийского Союза. Теперь, когда у нас есть преимущество, настал момент, когда мы можем протянуть руку и предложить братские отношения с Пакистаном. Это также позволило бы нам утвердить новый политический порядок в Южной Азии. В международном масштабе такой подход получит широкое признание."
 India_Pak_War_65.3.d: "Правительство Индии официально запросило переговоры с нашим правительством. Индийцы заявляют, что хотят перезагрузить отношения и положить конец многолетней вражде с момента раздела. Вероятно, индийцы хотят нормализовать отношения и наладить более тесные торговые связи. Некоторые из наших советников считают, что это может помочь нашей экономике, которая шатается от недавней войны и потерь. Кроме того, это могло бы заручиться поддержкой либеральных слоев общества. Тем не менее, Индия, вероятно, извлекает выгоду из своих недавних военных успехов, и вступление в бой с ними может рассматриваться как признание нашей слабости. Возможно, для морального духа нашего народа будет лучше отказаться от этой инициативы и сосредоточиться на наших усилиях по восстановлению. Мы должны решить, как реагировать."
 India_Pak_War_65.4.d: "В ходе наших переговоров с Индией они предложили полную нормализацию отношений вместе с соглашением об ослаблении иммиграционных ограничений. Соглашение улучшит отношения, особенно торговые связи. Наше собственное население, вероятно, поддержало бы ослабление иммиграции, это позволило бы воссоединить семьи и друзей, давно разделенных разделом, и дало бы возможность некоторым гражданам вернуть утраченное имущество. Тем не менее, есть некоторое сопротивление, особенно среди старших офицеров, которые считают, что лучшим выходом было бы отказаться от беседы и прекратить переговоры. Это подтвердит пакистанское неповиновение. Мы должны решить, как реагировать."
 India_Pak_War_65.5.d: "Наши недавние усилия по нормализации отношений с Пакистаном увенчались успехом. Пакистанцы согласились подписать ряд соглашений, которые улучшат торговлю, нормализуют отношения и ослабят иммиграционные ограничения. Новости о соглашении уже положительно восприняты внутри страны и за рубежом. Теперь мир видит в Индии новую региональную силу. Индийцы и пакистанцы теперь могут стать братьями и сестрами, которыми они должны были быть. Мы не милитаристская или империалистическая держава, мы миролюбивая нация, приверженная постоянному миру."
 India_Pak_War_65.6.d: "Попытки Индии нормализовать отношения с Пакистаном закончились досадным провалом. Пакистанцы осудили индусов за стремление закрепить свои недавние успехи и превратить Пакистан в марионетку Индии. Правительство Пакистана опубликовало еще одно заявление, в котором утверждается, что оно никогда не откажется от своего желания освободить народ Кашмира и помешать Индии стать гегемонистской державой в Южной Азии. Индийское правительство ответило, заявив, что Пакистан политизирует подлинные усилия по установлению мира, и они только продемонстрировали свое желание проделжения войны."
 India_Pak_War_65.7.d: "Военные неудачи в нашей недавней войне с Пакистаном выявили системные проблемы. Парламент вскоре после окончания конфликта создал комиссию для изучения этих военных недостатков и разработки решений. Их выводы были представлены премьер-министру, который должен решить, какую рекомендацию выполнить. Премьер-министр должен соблюдать осторожность, поскольку слишком радикальные действия могут подорвать институциональное здоровье вооруженных сил. В конечном итоге комитет обвинил в этом отсталое колониальное наследие, унаследованное от британцев. Это привело к политике найма, которая исключает значительную часть населения. Кроме того, это привело к тому, что ряд старших офицеров достигли своих званий во многом благодаря службе в колониальной британско-индийской армии. Одним из решений является проведение реформ в области найма, что позволило бы нам более эффективно использовать наш огромный кадровый потенциал. Другое решение состоит в том, чтобы уволить ряд армейских офицеров и проложить путь для более творческих, профессиональных офицеров. Мы должны решить, какая реформа является наиболее важной, поскольку выполнение обеих может привести к катастрофическим последствиям."
 India_Pak_War_65.8.d: "Опубликовав отчет комитета о недавних военных неудачах, премьер-министр решил действовать. Он объявил об увольнении большого числа старших офицеров, особенно бригадных генералов, генерал-майоров, генерал-лейтенантов и генералов. Это откроет дорогу молодым офицерам. Реакция военных была безмолвной, но в частном порядке говорят, что многие офицеры возмущены. Несмотря на это, общественность в значительной степени поддерживает эти действия, считая их необходимыми. Это, без сомнения, невероятно трудный день для Индии, но без этих действий Индия не сможет возродиться, чтобы преодолеть свои недавние неудачи."
 India_Pak_War_65.9.d: "Индийское правительство объявило о серии реформ, призванных расширить базу набора и лучше связать вооруженные силы с народом Индии. Правительство добавило, что следует рекомендациям, недавно сделанным парламентским комитетом по расследованию недавних военных неудач. Многие индийцы решительно поддерживают это решение, поскольку многие считали, что военные продолжают цепляться за колониальные методы в отношении их вербовки и организации. Новые реформы расширят базу для найма и создадут больше учебных программ для гражданских учебных заведений. Правительство Индии добавило, что эти реформы помогут стране максимально увеличить свое огромное население и ресурсы, чтобы лучше обеспечить защиту и честь Индии."
 Jammue_Refugee_Crisis.1.d: "Настойчивость Пакистана в захвате Кашмира стала свидетелем крупнейшего кризиса с беженцами после раздела. Кашмирцы-индуисты устремляются в Пенджаб. Поступают сообщения о том, что ободренные кашмирские мусульмане насильственно захватывают имущество и угрожают индуистской общине. Беженцев помещают во временные лагеря, прежде чем они смогут реабилитироваться. Прибытие беженцев вызывает гнев. Местные власти направляют дополнительные силы полиции для предотвращения насилия. Их присутствие также возобновляет критику правительства за ее действия в войне."
 IND_BAN.22.d: "Наше неудавшееся наступление в Восточном Пакистане спровоцировало открытый мятеж и беспорядки бенгальских беженцев и их сторонников в Калькутте. Реакция вызвана искренним отчаянием и давлением, вызванным массовым притоком беженцев с начала кризиса. Местные власти запросили поддержку у местных армейских частей для поддержания мира. Многие магазины и здания были повреждены в результате насилия, а в местных отчетах это было названо самым жестоким насилием со времен раздела. В настоящее время жители призывают правительство депортировать беженцев. Нам придется иметь дело с напряженностью в Бенгалии в обозримом будущем."
 IND_BENGAL.1.d: "Недавно пакистанская армия начала репрессии в Восточном Пакистане. Их жестокое насилие обострило ситуацию и привело к нарастанию кризиса беженцев. Пакистанцы, особенно индуисты, бегут в Калькутту из Восточного Пакистана. Они рассказывают о зверствах и жестоких репрессиях. Международные СМИ освещают ситуацию, в то время как местные власти разбивают лагеря беженцев. Сообщения с границы предполагают, что число беженцев, вероятно, достигнет миллионов. Федеральное правительство вмешается, чтобы помочь местным властям. Учитывая количество беженцев и ресурсы, которые нам потребуются для их размещения, мы можем ожидать негативного воздействия на экономику. Есть также опасения, что напряженность между нашим населением и беженцами возрастет. Несмотря на это, народ Индии должен оказаться в высоком положении и помочь бенгальцам, страдающим от военных репрессий."
 IND_BENGAL.2.d: "Индийское правительство официально обратилось к нам с просьбой помочь урегулировать ситуацию в Восточном Пакистане. Индийцы указывают на нарастающий кризис с беженцами в Калькутте и широко освещаемые новости о жестоком подавлении пакистанскими военными. Индийцы предполагают, что если решение не будет найдено, они могут быть вынуждены действовать и сами решать ситуацию. У нас исторически тесные связи с Пакистаном, и Государственный департамент предполагает, что мы можем оказать на них давление. Наши национальные СМИ широко освещают репрессии в Пакистане, и растет агитация за то, чтобы мы действовали и прекратили насилие. Однако пакистанцы, скорее всего, отнесутся к любым нашим усилиям негативно, и, как правило, наша политика не заключается в том, чтобы не вмешиваться во внутренние дела дружественных государств по указке других государств."
 IND_BENGAL.3.d: "Соединенные Штаты недавно направили дипломатическую делегацию в Пакистан и призвали свое правительство прекратить продолжающиеся военные операции в Восточном Пакистане. Правительство Пакистана публично заявило, что ценит интерес Америки, но в частных сообщениях указывается, что они в ярости. Американские усилия вряд ли заставят Пакистан изменить свой подход к ситуации, но они указывают на растущую международную изоляцию, с которой Пакистан сталкивается в результате своих текущих операций. Индийское правительство опубликовало заявление в поддержку американских усилий, подпитывая сообщения СМИ в Пакистане, обвиняющие Америку и Индию в сговоре против нации."
 IND_BENGAL.4.d: "Недавно индийское правительство направило к нам экстренную делегацию для переговоров по поводу продолжающегося кризиса в Восточном Пакистане. Индийцы выразили опасения, что дальнейшее ухудшение ситуации может привести к катастрофе во всем регионе. Они призвали нас внедрить формулу Ахсана как лучшее решение, чтобы положить конец кризису мирным и честным путем. Это было сделано в частном порядке, поскольку индийцы не хотели создавать впечатление, будто они принуждают нас к действию, и давать нам политическое прикрытие, что приветствуется. Высокопоставленные военачальники и ястребы призывают президента отвергнуть то, что они считают индийской гегемонией. Однако некоторые члены кабинета министров считают, что формула Ахсана остается лучшим решением, и мы должны внедрить ее как можно скорее."
 IND_BENGAL.5.d: "Мы получили тревожный ультиматум от правительства Индии, призывающий нас немедленно прекратить военные действия и уйти из так называемого Бангладеша. Индийцы называют эти операции гуманитарным кризисом и инкубатором нарушений прав человека, которые выплеснутся наружу и приведут к катастрофе во всем регионе. Они дают нам три месяца на вывод, заявляя, что невыполнение этого требования может привести к тому, что Индия предпримет любые действия, необходимые для прекращения насилия. Многие считают, что Индия просто врет и не собирается вмешиваться в военные действия. Некоторые другие лидеры считают, что даже если Индия вмешается, пакистанская нация более чем готова дать достойный ответ. В частном порядке несколько официальных лиц убеждают президента принять ультиматум и сократить наш контингент в Восточном Пакистане. Они говорят, что укол вывода гораздо предпочтительнее того, что, как они опасаются, может закончиться военной катастрофой."
 INDIA_KAS60s.0.d: "Несколько дней назад в Шринагаре вспыхнули массовые протесты после сообщений о том, что из знаменитого храма Хазратбал украли священную реликвию. Мусульмане Кашмира немедленно вышли на улицы, чтобы осудить кражу, и протесты вскоре переросли в антииндийскую агитацию. Общинная напряженность в Кашмире накаляется, поскольку слухи о том, что кражу организовала индуистская община, распространяются среди кашмирских мусульман. Индийское правительство было застигнуто врасплох этими протестами и пытается ответить. Местные власти обеспокоены и хотят задействовать полицию с войсками для подавления беспорядков. Однако члены кабинета и центрального правительства считают, что такой решительный подход может привести к обострению напряженности. Вместо этого они предлагают правительству провести полное расследование и выразить понимание беспорядкам."
 INDIA_KAS60s.1.d: "Через несколько недель после того, как правительство Индии объявило, что оно направляет свое главное следственное подразделение, Центральное бюро расследований, для поиска украденной реликвии в Кашмире, вчера она была обнаружена. Власти Индии и Кашмира не объяснили, как реликвия была обнаружена, но выразили удовлетворение. Индуистские храмы и мечети провели благодарственные молитвы, чтобы помочь снизить межобщинную напряженность в регионе. Многие кашмирцы, особенно те, кто связан с правительством, довольны результатами, но сохраняется враждебность к индийскому правительству из-за его неспособности положить конец политической неопределенности, в которой остается Кашмир. Среди более антииндийских кашмирцев они распространяют слухи о том, что найденная реликвия это подделка, созданная правительством."
 INDIA_KAS60s.2.d: "В ответ на кражу мусульманской священной реликвии в Сринагаре мусульмане Кашмира начали агитацию в знак недовольства кражей, но также продолжили индийское правление в Кашмирской долине. Многие выражают гнев по поводу политической неопределенности, в которой кашмирцы живут с 1947 года. Напряженность в обществе также возросла из-за слухов о причастности индусов к краже и их предполагаемой близости к индийскому правительству. В ответ на беспорядки правительство Индии направило войска вместе с вооруженной полицией. Этот деспотичный подход привел к обострению напряженности, поскольку мусульмане заметили, что войска, развернутые для защиты индуистских храмов, разожгли общественные и политические волнения. Святая реликвия была обнаружена вчера, но надежды на то, что это немедленно положит конец протестам, не оправдались, поскольку кашмирцы в Сринагаре продолжают агитировать против  нынешнего политического тупика."
 INDIA_KAS60s.3.d: "За последние несколько месяцев индийские солдаты и полиция задержали агитаторов по всему Кашмиру. Эти люди были идентифицированы правительством как главари, причастные к разжиганию недовольства и межобщинной напряженности в провинции. Хотя количество протестов после возвращения украденной святыни уменьшилось, эта последняя волна арестов спровоцировала новый виток демонстраций. Многие кашмирские политические лидеры сейчас критикуют правительство Индии за применение силы вместо диалога в период обострения напряженности. Средства массовой информации по всей Индии широко поддерживают эту жесткую позицию в отношении того, что правительство изображает как общее беззаконие."
 INDIA_KAS60s.4.d: "После недавней напряженности в Кашмире правительство Индии осознало, что кашмирцы все больше разочаровываются в текущей ситуации. В рамках усилий по исправлению ситуации правительство Индии объявило об освобождении известного кашмирского политического лидера шейха Абдуллы. Бывший премьер-министр штата Джамму и Кашмир отбывал длительный срок тюремного заключения за предполагаемый заговор против Индии с целью создания независимого государства Кашмир. После своего освобождения шейх Абдулла пообещал, что будет работать с правительством Индии и обеспечивать соблюдение прав и желаний кашмирского народа. Это действие поможет смягчить разочарование кашмирцев, которые приветствуют возвращение человека по имени Шер-э-Кашмир (Лев Кашмира)."
 INDIA_KAS60s.5.d: "Недавние религиозные и политические потрясения вызвали серьезные межобщинные беспорядки в Восточном Пакистане и Западной Бенгалии. В Восточном Пакистане демонстранты осудили то, что, по их мнению, было нападением на ислам и продолжающимися репрессиями индийского государства в отношении кашмирских мусульман. Эти демонстрации превратились в межобщинные беспорядки, когда протестующие начали нападать на индуистские кварталы. Когда люди в Западной Бенгалии услышали об этих нападениях, они начали свои собственные демонстрации и нацелились на мусульманские районы, что привело к вспышкам беспорядков. Масштабы насилия далеки от межобщинных беспорядков при разделе, однако многие в Индии опасаются, что дальнейшие инциденты могут привести к эскалации ситуации. Бенгалия в настоящее время спокойна, но межобщинная напряженность между индуистами и мусульманами усиливается."
 INDIA_KAS60s.6.d: "Парламент обсуждает, применять ли статьи 356 и 357 к Джамму и Кашмиру. Это приостановит работу правительства штата и позволит центру установить прямое правление над провинцией, что позволит центру взять на себя законодательную власть. Введение государственного правления позволит правительству внести поправки в конституцию штата в Кашмире и лишить часть автономии, предоставленной в соответствии со статьей 370, и сделать штат более соответствующим Конституции Индии. Учитывая недавние беспорядки в Кашмире, многие в Индии считают, что эта акция необходима для предотвращения заговора кашмирцев или пакистанцев с целью подрыва индийского правления. Многие из ведущих кашмирских политиков, даже проиндийские, яростно выступают против этого действия и утверждают, что такой шаг будет воспринят кашмирцами как предательство и укрепит их враждебность к Индии."
 INDIA_KAS60s.7.d: "Индийский парламент проголосовал за введение прямого правления в Кашмире, используя статьи 356 и 357 конституции. Это решение рассматривается как важное действие для обеспечения лояльности Кашмира и дальнейшей интеграции в Индию. Правительство утверждает, что прямое правление позволит центру обеспечить, чтобы Кашмир функционировал как продуктивное государство, которое может принести прогресс и развитие народу Кашмира. Политические лидеры Кашмира широко осудили эту акцию, заявив, что Индия нарушила свое обещание, данное в 1949 году, сохранить автономию Кашмира. Хотя среди кашмирцев и есть недовольство, пока нет сообщений о массовых протестах или беспорядках."
 INDIA_KAS60s.8.d: "Индийский парламент принял ряд законов и поправок к государственной экономике Кашмира, которые в значительной степени подорвали гарантии статьи 370 в отношении внутренней автономии. Пост премьер-министра был упразднен, но заменен титулами губернатора и главного министра, чтобы обеспечить соответствие Кашмира другим штатам Индии. Индийское правительство отвергло критику со стороны многих кашмирских политических лидеров и Пакистана за то, что оно отказывается от своих обещаний. Вместо этого индийское правительство утверждает, что без этих реформ кашмирцы упустят средства на развитие и демократические реформы, которыми пользуются другие индийские штаты. Некоторые кашмирские лидеры поддерживают эти усилия, что приводит к разногласиям в Национальной конференции Джамму и Кашмира. Индийское правительство настаивает на том, что ее действия направлены на внутреннее улучшение и не подрывают ее обязательств перед кашмирцами или международным сообществом."
 INDIA_KAS60s.9.d: "Национальная конференция Джамму и Кашмира, легальная политическая партия, выступающая за сохранение автономии Кашмира, недавно проголосовала за самороспуск. Это первый шаг плана по слиянию партии в качестве отделения Индийского национального конгресса. Национальная конференция считает, что только работая с центральным правительством и национальной партией, они могут обеспечить дальнейшее сохранение кашмирской автономии в составе Индии. Они утверждают, что отсутствие таких контактов привело к недавнему введению государственного правления. Однако это действие привело к тому, что конкурирующая фракция отделилась от Национальной конференции. Эта группа, возглавляемая сторонниками шейха Абдуллы, сформировала группу под названием «Фронт плебисцита». Фронт плебисцита выступает за проведение референдума, спонсируемого ООН, чтобы определить будущее Кашмира."
 Sino_India_Pact.1.d: "Индия потребовала, чтобы мы соблюдали наш договор об обороне и присоединились к ним против Китая. Недавний пограничный конфликт между ними перерос в общий конфликт. Учитывая наш собственный спор с Индией, некоторые официальные лица считают, что мы должны предлагать помощь только с гарантией выполнения резолюций ООН по Кашмиру после конфликта. Другие официальные лица считают, что китайская агрессия представляет собой региональную угрозу, и мы должны соблюдать договор. Наконец, в правительстве есть те, кто считает, что мы должны просто отрицать, что обязаны помогать, и позволить Индии истечь кровью. Необходимо принять решение."
 Sino_India_Pact.2.d: "Согласно условиям нашего договора о взаимной обороне, мы недавно призвали Пакистан присоединиться к нам перед лицом массированного китайского вторжения. Пакистанцы заявляют, что хотя они и сочувствуют нашему положению, народ Пакистана по-прежнему неравнодушен к бедственному положению кашмирцев. Они настаивают на том, что мы должны согласиться на выполнение резолюций ООН по Кашмиру после конфликта. Это устранило бы любую враждебность и позволило бы Пакистану полностью перейти на нашу сторону. Учитывая военную ситуацию, ряд чиновников заинтересованы в принятии условий, полагая, что это дает краткосрочные и долгосрочные преимущества. Однако ряд официальных лиц выступают против, рассматривая это как капитуляцию перед пакистанской агрессией, они считают, что мы должны действовать в одиночку."
 Sino_India_Pact.3.d: "Правительство Пакистана объявило, что будет соблюдать договор об обороне с Индией и присоединится к борьбе против китайской агрессии. Оба правительства также подтвердили, что достигнуто соглашение в отношении Кашмира, отражающее этот новый дух единства в Южной Азии. Обе страны будут выполнять существующие резолюции ООН по урегулированию статуса Кашмира после разрешения конфликта с Китаем. Сообщается, что пакистанские войска быстро мобилизуются. Китайское правительство осудило это соглашение, назвав его бессовестным ура-патриотизмом."
 Sino_India_Pact.4.d: "Пакистан и Индия не смогли договориться об условиях присоединения Пакистана к войне против Китая на стороне Индии. Ни одно из правительств не сообщило, что пошло не так, хотя ходят слухи, что продолжающаяся напряженность в отношении окончательного статуса Кашмира помешала достижению соглашения. Пакистанские СМИ утверждают, что правительство не обязано вмешиваться, поскольку неясно, кто начал индо-китайский конфликт. Индийские газеты утверждают, что Пакистан нарушил договор об обороне и пытался шантажировать индийское правительство. Независимо от истинной причины, ясно, что Пакистан не будет вмешиваться, чтобы поддержать Индию."
 Sino_India_Pact.5.d: "Правительство Пакистана после переговоров с высокопоставленными официальными лицами Индии подтвердило, что будет соблюдать договор об обороне и присоединится к борьбе против Китая. Пакистанское руководство отметило, что этот кризис не время для политики или ссор, народы субконтинента должны работать вместе, чтобы не допустить, чтобы новая иностранная держава стремилась к доминированию. Говорят, что пакистанская армия быстро мобилизуется. Индийское правительство приветствовало эту новость. Поступают сообщения о протестах кашмирских общин в пакистанских городах и членов религиозных партий, осуждающих это решение. Они считают, что Пакистан предал дело Кашмира, не потребовав его разрешения в обмен на поддержку."
 Pak_India_War_65.1.d: "Пакистанская армия недавно начала операцию «Нусрат». Пакистанские силы вдоль линии прекращения огня в Кашмире проводят разведывательные операции по поиску брешей и точек проникновения вдоль границы. Также проводятся небольшие вторжения, чтобы проверить время реагирования и реакцию местных гражданских лиц на наши перемещения. Знания, которые мы получаем, будут иметь решающее значение для потенциальных операций в Кашмире. Похоже, индийцы не осведомлены о масштабах наших операций. Наши войска очень мотивированы и уверены в себе, эти операции поднимают боевой дух и опыт."
 Pak_India_War_65.2.d: "После серии встреч на высоком уровне с участием высокопоставленных чиновников из кабинета министров и вооруженных сил было решено возобновить операцию «Гибралтар» — план, изначально задуманный в начале 1950-х годов. План предусматривает проникновение пакистанских войск, замаскированных под борцов за свободу. Затем эти люди будут проводить диверсионные операции и поощрять народное восстание, чтобы положить конец индийскому правлению в Кашмире. Все задействованные солдаты должны быть набраны из полка Азад Кашмир. План состоит в том, чтобы провести месяц специализированной подготовки перед отправкой их за границу. Было определено девять сил проникновения, каждая из которых названа в честь известного деятеля из исламской истории."
 Pak_India_War_65.3.d: "Колонны сил проникновения пересекли границу в Кашмире. Они начали двигаться в запланированные районы операций. Однако проникновение прошло не так гладко, как мы надеялись. Некоторые группы были обнаружены местными жителями, которые проинформировали индийские власти. Они предположили, что наши вооруженные люди, одетые как гражданские, были вооруженными преступниками, а не борцами за свободу. Другие силы продвигаются к своим районам операций гораздо медленнее. Несмотря на эти неудачи, мы уже получили сообщения о некоторых диверсионных операциях и вооруженных столкновениях с индийскими силами. Перехваченные сообщения указывают на то, что индийская армия считает, что может произойти вооруженное восстание. В идеале местные тоже скоро придут к такому выводу и поднимут восстание. Как только восстание начнется всерьез, наши силы выдвинутся вперед, чтобы завершить освобождение."
 Pak_India_War_65.4.d: "Операция «Гибралтар» не продвинулась так, как мы надеялись. Многие местные жители либо держались подальше от наших боевиков, либо повели индийские войска в свои лагеря. Большинство наших групп проникновения понесли тяжелые потери, некоторые даже отступили к границе. В этот момент индийская армия ясно понимает, что они противостоят нашим войскам, а не повстанцам. Были ожесточенные перестрелки и несколько диверсионных операций, но не в такой степени, как мы надеялись. Возможно, нам придется рассмотреть вопрос о переходе ко второй фазе с прямой атакой вдоль границы нашими силами, чтобы спасти ситуацию и не потерять темп."
 Pak_India_War_65.5.d: "Наши группы проникновения успешно проникли в оккупированный Кашмир. С момента прибытия они успешно атаковали ключевые индийские военные и инфраструктурные объекты. Наши бойцы успешно сеют хаос в Кашмире, а обнаглевшие кашмирские активисты устраивают акции протеста в Шринагаре. По мере продолжения наших операций индийское правительство будет вынуждено сотрудничать с нами, иначе оно рискует полной изоляцией индийской армии в Кашмире. В то время как штаб-квартира празднует успех, полагая, что Кашмир скоро падет, некоторые официальные лица выражают обеспокоенность. Они утверждают, что вместо этого индийцы могут попытаться обострить ситуацию, тем более что к настоящему времени они осознают, насколько пакистанская армия вовлечена в разжигание беспорядков."
 Pak_India_War_65.6.d: "За последние несколько недель наши силы в Кашмире вели ожесточенные бои с многочисленными группами вооруженных боевиков. Сначала наша местная разведка опасалась, что это начало вооруженного восстания среди кашмирцев. Однако теперь из сообщений местных жителей и пленных боевиков становится ясно, что это пакистанские регулярные войска. У нас есть два варианта перед нами, мы можем начать приграничные наступления, чтобы наказать пакистанцев и дать им бой. Если мы прорвемся, мы сможем улучшить нашу позицию вдоль линии прекращения огня и, возможно, даже добиться урегулирования в Кашмире. Другой вариант — просто продолжить наши операции по искоренению лазутчиков и как можно скорее восстановить нормальную жизнь в Кашмире."
 Pak_India_War_65.7.d: "За последние несколько недель наши силы в Кашмире вели ожесточенные бои с многочисленными группами вооруженных боевиков. Сначала наша местная разведка опасалась, что это начало вооруженного восстания среди кашмирцев. Однако теперь из сообщений местных жителей и пленных боевиков становится ясно, что это пакистанские регулярные войска. Эти лазутчики нанесли значительный ущерб местной инфраструктуре, и у нас есть тревожные сообщения о том, что некоторые местные кашмирцы присоединяются к боевикам. Ситуация ухудшается, и у нас остается два выхода. Мы можем начать наступление вдоль линии прекращения огня, чтобы наказать пакистанцев и ослабить давление. Другой вариант — заявить о нашей поддержке выполнения резолюции 47 ООН и провести референдум."
 Pak_India_War_65.8.d: "В ответ на операцию «Большой шлем» индийская армия начала наступление вдоль линии прекращения огня в Кашмире. Наши силы были застигнуты врасплох на определенных участках, но упорно сопротивляются. Милостью Аллаха мы скоро отобьем эту атаку. Наши командиры на местах уверены, что в скором времени мы сразимся с индийцами и выполним нашу миссию по окончательному освобождению Кашмира от оккупации."
 Pak_India_War_65.9.d: "Наступление Индии вдоль линии прекращения огня в значительной степени было отражено пакистанской армией. Хотя индийские силы, по-видимому, добились некоторых первоначальных успехов, локальные пакистанские контратаки держались. В частности, индийские войска, казалось, были близки к захвату перевала Хаджи Пир, но были остановлены. Наблюдатели внимательно следят за ситуацией, чтобы увидеть, начнет ли Пакистан свое собственное наступление в ответ или будет работать, чтобы охладить обостряющуюся ситуацию. Этот недавний раунд боевых действий был вызван после того, как Индия обнаружила, что пакистанские войска проникают в контролируемую ими часть Кашмира для проведения атак. И Соединенные Штаты, и Советский Союз выступили с заявлениями, призывающими к спокойствию в регионе."
 Pak_India_War_65.10.d: "Индийское наступление вдоль линии прекращения огня в Кашмире приносит опасные успехи против пакистанских сил. Индийская армия недавно объявила, что ее войска прочно контролируют перевал Хаджи Пир. Это разоблачение знаменует собой серьезную неудачу для пакистанских сил и угрожает Музаффарабаду. Похоже, что эти наступления носят ограниченный характер и не представляют собой полномасштабное нападение на контролируемый Пакистаном Кашмир. Индийское правительство вновь заявило, что Пакистан должен вывести все свои силы для проникновения из индийского Кашмира и что недавние военные действия были прямым ответом на пакистанскую агрессию. Правительство Пакистана в основном хранит молчание. Есть опасения дальнейшей эскалации в Кашмире, несмотря на призывы Соединенных Штатов и Советского Союза к восстановлению мира."
 Pak_India_War_65.11.d: "В связи с усилением давления Индии на линию прекращения огня и в оккупированном Кашмире высшее командование пакистанской армии спланировало операцию «Большой шлем». Это наступление ослабит давление на наши войска, уже принявшие участие в боевых действиях, и, если оно увенчается успехом, мы потенциально можем отрезать Индию от оккупированного Кашмира. Упор наступления будет направлен на Акхнор. Если мы захватим город, Кашмир будет отрезан, и мы сможем, наконец, завершить освобождение Кашмира. Войска размещены, и нам просто нужно одобрить операцию, чтобы она началась."
 Pak_India_War_65.12.d: "Операция «Большой шлем» приносит огромные успехи. Наши силы быстро продвигаются к Ахнуру, и как только он будет захвачен, мы сможем отрезать индийскую армию и даже взять Джамму. Отчеты наших офицеров с фронта восхваляют эффективность и боевой дух наших солдат. Они считают, что как только Индия будет отрезана, им придется эвакуировать Кашмирскую долину, иначе они рискуют потерять все свои силы в Кашмире. ВВС и ВМС приведены в состояние повышенной готовности, особенно вдоль международной границы. Однако последние отчеты разведки показывают, что Индия вряд ли пойдет на эскалацию конфликта за пределы Кашмира."
 Pak_India_War_65.13.d: "Операция «Большой шлем» в значительной степени застопорилась. Наша первая атака прошла великолепно. Однако наши войска столкнулись с труднопроходимой местностью и гораздо более стойкой оборонительной силой, чем ожидалось. Хотя ясно, что мы не угрожаем отрезать Индию от Кашмира, наступление помогло ослабить давление на другие наши силы и стабилизировать линию прекращения огня. Наши люди будут сражаться, и мы надеемся, что появится новая возможность. Однако ясно, что ситуация в Кашмире быстро выходит из-под контроля."
 Pak_India_War_65.14.d: "Массированное пакистанское наступление на Акхнор застало наши силы врасплох. Однако, несмотря на превосходство в численности и снаряжении, наши бойцы сражаются храбро. Местный командир говорит, что его силы, безусловно, могут сдерживать пакистанцев еще несколько дней, однако он опасается размера атакующих сил и не считает, что у него достаточно резервов. Ситуация оставила нам два выхода. Один из них заключается в том, чтобы заявить о нашем намерении выполнить резолюцию 47 ООН по Кашмиру и принять участие в этом процессе. Хотя это сложно, мы можем потерять Кашмир, но не на поле боя. Мы, конечно, найдем момент, чтобы наказать пакистанцев позже. Другой вариант, безусловно, самый популярный, заключается в расширении конфликта и нападении на Западный Пакистан со стороны международной границы. Это ослабит давление, и мы сможем быстро захватить город Лахор, чтобы использовать его в качестве козыря. Единственная альтернатива — военная катастрофа в Кашмире."
 Pak_India_War_65.15.d: "Недавние пакистанские операции в Кашмире, от проникновения партизан до начала крупного наступления с целью отрезать индийские силы, позволили обеспечить безопасность Кашмирской долины. Когда пакистанские войска наконец отрезали Индию от Кашмира, индийское правительство пришло к соглашению. Они уступят Кашмирскую долину, включая Шринагар, Пакистану и установят новую линию прекращения огня. Взамен Пакистан гарантировал быструю эвакуацию и возвращение индийских войск вдоль старой линии прекращения огня. Вскоре после соглашения пакистанские войска достигли Сринагара, где их сторонники выступили, чтобы поддержать их. Однако празднование проходило на фоне вывода не только индийских войск, но и семей меньшинств, желающих остаться частью Индии. Правительство Индии заявило, что у него нет выбора, но столкнулось с резкой критикой со стороны оппозиции в парламенте."
 Pak_India_War_65.16.d: "Индийские вооруженные силы предотвратили махинации Пакистана и его вооруженных сил. Его усилия спровоцировать восстание, а затем захватить Кашмир с помощью вооруженной силы были остановлены. Наши силы обладают импульсом. Мы, безусловно, можем остановить боевые действия здесь, оставить границы как есть и надеяться, что Пакистан усвоит урок. Однако многие гражданские и военные лидеры сейчас настаивают на том, чтобы мы приняли решительное решение, чтобы гарантировать, что Пакистан никогда больше не будет рассматривать такие планы. Они предлагают нам расширить войну через международную границу в Западном Пакистане. Если мы быстро захватим важный город Лахор и продвинемся в Кашмире, мы сможем, наконец, заявить о себе как о бесспорной силе в регионе."
 Pak_India_War_65.17.d: "Недавний вооруженный конфликт в Кашмире перерос в полномасштабную войну между Индией и Пакистаном. Сообщается, что индийские силы пересекли границу недалеко от Лахора и, по слухам, перемещаются в другие сектора. Правительство Пакистана опубликовало вызывающее обращение к своему населению, призывающее свой народ объединиться против индийского вторжения. Правительство Индии заявило, что его операции были ответом на неспровоцированное насилие, развязанное Пакистаном в Кашмире. Они заявили, что индийские военные не успокоятся, пока пакистанская угроза не будет нейтрализована."
 Pak_India_War_65.18.d: "Когда в Западном Пакистане разразилась война, командование в Восточном Пакистане должно решить, активировать театр военных действий или нет. Фронт с Индией длинный, а наши силы, присутствующие в Восточном Пакистане, обычно невелики. Может быть, лучше держать наши силы на боевой позиции. Если мы не покажем им агрессивных намерений, индийцы могут решить не активизировать и этот фронт. Тем не менее, некоторые офицеры считают, что у нас достаточно сил, чтобы не только сдерживать индийские дивизии, но даже начинать наступательные операции. Мы должны решить, какую позицию занять."
 Pak_India_War_65.19.d: "Поскольку в Кашмире и вдоль границы с Западным Пакистаном разразилась война, наше Восточное командование должно рассмотреть возможные варианты. Мы можем попытаться держать наши силы в боевой готовности, но не с враждебными намерениями. Если пакистанские силы ответят на это взаимностью, мы сможем сохранить спокойствие на фронте. Это гарантирует, что мы сможем направить максимальные силы на главный фронт. Отказ от участия в Восточном Пакистане также продемонстрирует нашу поддержку бенгальцам Пакистана, что может помочь нам в будущем. Однако некоторые из наших старших офицеров считают, что у нас достаточно сил, чтобы продвинуться вглубь Восточного Пакистана. Они настаивают на том, чтобы мы открыли этот фронт и немедленно готовились к операции."
 Pak_India_War_65.20.d: "Хотя Индия и Пакистан ведут открытые боевые действия на западе, обе армии молчаливо решили не активизировать боевые действия вдоль границы с Восточным Пакистаном. Хотя у индийцев и пакистанцев может возникнуть соблазн вывести войска из этого района, пока бушует война, всегда существует вероятность того, что там могут начаться боевые действия. Многие бенгальцы в Восточном Пакистане не знают об этой ситуации, и есть опасения, что они могут быть подавлены и оставлены без защиты от крупной индийской операции."
 Pak_India_War_65.21.d: "Война между Пакистаном и Индией обострилась, когда между двумя сторонами вспыхнули боевые действия на границе с Восточным Пакистаном. Сообщается, что жители Калькутты и Дахки запасаются припасами. Практика отключения электроэнергии, которой не было со времен Второй мировой войны, возвращается. Хотя обе стороны обещают быструю победу, в настоящее время неясно, кто одержит верх в этой битве. Добровольцы с обеих сторон стекаются, чтобы оказать помощь своей стране."
 Pak_India_War_65.22.d: "Ситуация в Южной Азии переросла в тотальную войну между Индией и Пакистаном. Наши дипломаты и агенты на местах винят в этих боевых действиях Пакистан. Эти боевые действия являются результатом недавних пакистанских операций в Кашмире, призванных добиться разрешения конфликта. Государственный департамент и разведывательное сообщество в ярости. Они считают, что Пакистан использует оружие, которое мы предоставили, для начала их операций, и этот конфликт в конечном итоге только укрепит коммунизм в регионе. Они предлагают нам объявить эмбарго на поставки оружия как Индии, так и Пакистану. Пакистан будет гораздо больше затронут этим. Однако некоторые военные эксперты призывают к осторожности и говорят, что мы не должны принимать столь опрометчивое решение. Пакистан по-прежнему является для нас жизненно важным государством."
 Pak_India_War_65.23.d: "Посол Соединенных Штатов сообщил нам, что его правительство вскоре объявит о замораживании всей военной помощи и поставок в Пакистан и Индию. Они утверждают, что это сделано для предотвращения дальнейшего наращивания вооружений в регионе. Американский посол также добавил, что американское правительство всегда настаивало на использовании своего оружия для защиты от коммунизма, и использование нами американского оружия против Индии нарушает эти условия. Это, конечно, большой удар и нелепость. Наша нация сталкивается с вторжением со стороны гораздо более крупного соседа, и мы имеем право использовать любое оружие, которое у нас есть, для защиты родины. Америка наглядно показала свое истинное лицо."
 Pak_India_War_65.24.d: "Посол Соединенных Штатов сообщил нашему правительству, что вся потенциальная военная помощь или поставки оружия в Индию и Пакистан будут заморожены. Они утверждают, что это сделано для предотвращения дальнейшего наращивания вооружений в регионе. Эта новость, несомненно, является ударом по Пакистану, который долгое время зависел от американского оружия. Наши собственные военные настаивают, что эта новость не окажет большого влияния. Мы ответили послу, сообщив ему, что именно действия его народа придали смелости пакистанцам действовать таким образом. Без американской поддержки Пакистан не стал бы пытаться нарушить нынешнюю ситуацию."
 Pak_India_War_65.25.d: "Поскольку боевые действия с Индией усиливаются, пакистанцы требуют немедленного пополнения запасов оружия, танков и самолетов для своих сил. Они заявляют, что стресс от открытой войны приводит к сильному износу их оборудования, и они отчаянно нуждаются в поддержке. Пакистанские военные отмечают, что Индия дружит с Москвой, и если Пакистан потерпит неудачу, советское влияние в регионе станет бесконтрольным. Государственный департамент находит эти утверждения сомнительными, но отмечает, что американская помощь, несомненно, укрепит отношения между нами и Пакистаном. Другие высокопоставленные чиновники считают, что было бы лучше, если бы мы отказались от участия в конфликте."
 Pak_India_War_65.26.d: "Соединенные Штаты завершили экстренную поставку оружия нашим силам. Это оборудование будет иметь большое значение, чтобы помочь нам в этой текущей борьбе. Индийцы не были рады быстрому прибытию оружия. Хотя мы запросили у американцев гораздо большую партию оружия, учитывая короткие сроки, военные очень довольны. Действия американцев ясно показывают, что они настоящие друзья Пакистана, и их действия не будут забыты в ближайшее время. Технику оперативно отправляют в передовые части."
 Pak_India_War_65.27.d: "Когда война достигла критического уровня, высшее руководство Пакистана нанесло нам экстренный визит, чтобы заручиться поддержкой. Мы сообщили им, что, если они боятся поражения, они должны готовиться к войне народов и пережить своего врага. Пакистанцы вежливо послушались нашего совета, но в тот момент заявили, что им необходимо наше непосредственное участие. Наши собственные эксперты предполагают, что наше прямое вовлечение было бы неблагоразумным. Вместо этого мы можем либо предложить оружие, либо яростно осудить агрессию Индии во время этого конфликта."
 Pak_India_War_65.28.d: "Хотя Китай не мог обещать нам вооруженного вмешательства во время нашей нынешней войны с Индией. Они обеспечили доставку экстренной партии оружия в наши силы. Наша армия отчаянно нуждается во всей возможной поддержке. С помощью этой помощи Китай, без сомнения, показал себя большим другом Пакистана. Оборудование быстро обрабатывается и готовится к немедленному использованию на фронте. Война с Индией продолжается, но с такой помощью мы надеемся завершить ее решающей победой народа Пакистана."
 Pak_India_War_65.29.d: "Вчера китайцы опубликовали тревожное заявление. Они обвинили наше правительство в неприкрытой агрессии и империалистических замыслах в отношении Пакистана. Они настаивали на том, что Пакистан стал жертвой незаконной агрессии, и заявили, что внимательно следят за ситуацией. Мы получили сообщения о передвижении китайских войск вдоль границы. Подразумевается, что если мы продолжим конфликт, Китай может решить вмешаться против нас. Это важно учитывать. Однако несколько советников отвергли это заявление как браваду и настаивают на том, что Китай на самом деле не будет вмешиваться. Они утверждают, что Китай просто пытается показать Пакистану свою поддержку, фактически не вводя силы."
 Pak_India_War_65.30.d: "Война с Индией достигла критического уровня. Наши высшие командиры и официальные лица указывают, что пришло время положить конец боевым действиям. Вскоре мы направим соответствующим должностным лицам обращение в Организацию Объединенных Наций. Мы попросим их содействовать прекращению огня с Индией и развернуть наблюдателей для обеспечения мира. Мы надеемся, что индийцы быстро подчинятся, и эти боевые действия можно будет остановить как можно скорее. Независимо от результатов народ и вооруженные силы Пакистана показали себя превосходно."
 Pak_India_War_65.31.d: "Организация Объединенных Наций обратилась к нашему правительству, заявив, что Пакистан готов объявить о немедленном прекращении огня. Новость неудивительна, учитывая ситуацию на местах. Организация Объединенных Наций добавила в своем сообщении, что прекращение огня является желанием мирового сообщества. Мы встречаемся с нашими высшими военными и правительственными чиновниками, чтобы оценить ситуацию на местах. Ясно, что пакистанцы хотят прекращения боевых действий, и мы можем с этим согласиться. Однако наши дипломаты заявили, что могут отсрочить прекращение огня максимум на десять дней, прежде чем международное давление станет слишком сильным. Если мы почувствуем, что еще десять дней боев могут принести пользу нашей конечной позиции, мы можем это сделать."
 Pak_India_War_65.32.d: "Организация Объединенных Наций обратилась к нашему правительству, заявив, что Индия готова объявить о прекращении огня. Эта новость неудивительна, учитывая ситуацию на местах. Организация Объединенных Наций добавила в своем сообщении, что прекращение огня является желанием мирового сообщества. Мы встречаемся с нашим высшим руководством и официальными лицами, чтобы оценить ситуацию. Мы, безусловно, можем согласиться на прекращение огня сейчас, за что на данном этапе выступает Индия. Однако МИД считает, что мы можем использовать тактику проволочек и отсрочить прекращение огня на срок до десяти дней, прежде чем международное давление станет слишком сильным. Если мы чувствуем, что еще десять дней боев могут улучшить нашу конечную позицию, мы тоже можем это сделать."
 Pak_India_War_65.33.d: "Перемирие, спонсируемое Организацией Объединенных Наций, наконец вступило в силу, по крайней мере, временно приостановив нынешний индо-пакистанский конфликт. Обе стороны, похоже, придерживаются режима прекращения огня. Организация Объединенных Наций опубликовала заявление, в котором говорится, что после прекращения боевых действий вскоре прибудут наблюдатели, которые помогут убедиться в отсутствии серьезных нарушений режима прекращения огня или захвата территорий обеими сторонами. Ожидается также, что в ближайшее время встретятся лидеры Индии и Пакистана и постараются официально положить конец конфликту. Многие в Южной Азии наконец-то могут вздохнуть с облегчением, поскольку этот последний раунд широкомасштабных боевых действий, похоже, закончился."
 kashmiri_plebiscite: "Резолюция ООН 47: Кашмирский референдум"
 kashmiri_plebiscite_desc: "Индия и Пакистан оккупировали бывшее княжеское государство Кашмир. Оба претендуют на всю провинцию,и начали короткую войну через несколько недель после раздела. Недавно обе стороны договорились о выполнении резолюций Совета Безопасности ООН о проведении на территории референдума. В ближайшие недели народ Кашмира определит свое будущее и проголосует за присоединение либо к Индии, либо к Пакистану. Оба правительства активно участвуют в кампаниях, направленных на то, чтобы убедить кашмирцев в том, что их будущее зависит от их государства. ООН проведет честные выборы."