l_russian:
  
 kenya.1.d: "О милый вождь, как мы тебя любили! Прошлой ночью Содружество потеряло одну из самых верных и харизматичных фигур в Восточной Африке. На окраине Найроби любимого вождя везли с шофером, когда трое бандитов выстрелили в машину, мгновенно убив Варухиу. Варухиу был истинным сторонником британского колониального правления, откровенным критиком групп независимости и различных коренных народов, соперничающих за ненужную автономию. Этих убийц называют Мау-Мау, наши секретари связывают это убийство с многочисленными другими убийствами и актами насилия в отношении белых поселенцев в колонии и протекторате Кении."
 kenya.3.d: "Этой весной принцесса Елизавета посетила колонию короны и протекторат Кении в рамках поездки по империи. Получив бесконечные похвалы и внимание в Найроби, принцесса и ее свита отправились на сафари в рифтовую долину. Однако, насколько ей было известно, накануне днем король Георг умер от рака легких, оставив ее наследницей."
 kenya.4.d: "Кения, как и многие суахилийские нации, наполнена множеством этнических организаций и движений, непостижимых для внешних британских наблюдателей. Путешествующие мистики, лидеры культов и племенные популисты, и подобные чудеса по всей стране, но недавно появились сообщения о больших перемещениях племен кикуйю; путешествующие как организованные армии. Это, завершившееся недавними враждебными действиями коренных народов и белых поселенцев в высокогорье, заставляет некоторых задуматься, не затевается ли что-то более зловещее."
 kenya.5.d: "Так заканчивается восьмилетнее губернаторство сэра Филипа Юэна Митчелла, у него была необычная и скромная администрация, поскольку после расформирования основных подразделений королевских африканских стрелковых войск после Второй мировой войны произошло мало примечательных событий. Хотя, в отличие от этого ранее утверждавшегося британского убеждения, среди кенийской интеллигенции существует большое уважение к губернатору, поскольку он описал уроженцев Кении как "уникальный пример одного из немногих людей в мире, не имеющих истории или культуры."
 kenya.6.d: "В течение последних нескольких лет пророк по имени Лукас Пкех набирал последователей для своего пророческого движения. За свои язвительные антиевропейские взгляды и подстрекательство он был осужден за подстрекательство к мятежу и заключен в тюрьму. Однако пророк избежал своего заключения и привел несколько верных последователей по всей стране. Временный губернатор Алан Стивенс противостоит пророку со своими 300 или около того вооруженными копьями последователями."
 kenya.8.d: "Лидер Кенийского Африканского союза Джомо Кениата был заключен в тюрьму за подстрекательство к мятежу. Несмотря на то, что он выступал против Мау-Мау, выступал за мирные реформы, выступал против забастовок рабочих и преступного поведения, правительство королевской колонии Кении сочло его арест абсолютно необходимым. Хотя многие призывают к его полному изгнанию из Кении, многие считают, что это оправдает движение за независимость нации, сделав его политическим мучеником. Посмотрим, к чему это приведет в будущем."
 kenya.9.d: "Социалисты, панафриканцы, антиимпериалисты, общие повстанцы, независимо от того, как они себя называют, студенты по всему Найроби протестуют на неконтролируемом уровне. Многие из этих протестов переросли в акты грабежей и беспорядков по всему центру города."
 KLFA_uprising: "Восстание Мау-Мау продолжается"
 Tom_Mboya: "Том Мбойя"
 kenyan_decisions_0: "Колония и протекторат Кении в 1950-е годы"
 kenyan_decisions_0_desc: "Колония и протекторат Кении - это, мягко говоря, не образцовая колония. В то время как большинство жителей материковой части Великобритании вряд ли когда-либо думают об этой нации своей империи с ее 6-миллионным населением, живущим в совокупности четырех крупных городов и в основном небольших городов, африканское большинство Кении регулярно думает о своем британском подданном статусе. Основанная в кульминационный момент борьбы за Африку, Кения как колония в основном населена этническим народом кикуйю с заметным уровнем местного британского бизнеса и поселений. Как и в любой африканской колонии, в Кении существует небольшое меньшинство антиколониальной и панафриканской студенческой молодежи и интеллигенции, в основном организованной вокруг активиста Джомо Кеньятты. Однако в основном неграмотные сельские жители страны представляют реальную угрозу колониальной стабильности в Кении, поскольку путешествующие пророки и мистики формируют ополчения в сельской местности центрального нагорья."
  
 kenya.10.d: "Сегодня было официально объявлено о создании Восточноафриканской федерации. В то время как массовые карнавалы, культурные выставки и восторженные ликующие толпы заполняют улицы Момбасы, Дар-эс-Салама и Кампалы, тем больше вопросов возникает о том, как стабильность государства будет волновать многих. В то время как самый большой город в новой стране-Дар-эс-Салам, столица будет находиться в недавно спланированном и построенном городском центре Момбасы из-за его истории как знаменитого торгового города-государства. Поскольку большая часть старого города Момбасы обезлюдела и вся инфраструктура сосредоточена в этом новом центре, на всенародном референдуме было принято решение переименовать город в Новую Момбасу"
 kenya.11.d: "Операция Буньоро - это кодовое название военной операции, координируемой военными Восточноафриканской Федерации с целью вторжения и свержения Иди Амина в пользу Милтона Оботе. Клептократический лунатик Иди Амин игнорировал неоднократные нарушения его прав человека и продолжающиеся акты агрессии на границе с Танзанией. "
 kenya.12.d: "В возрасте 38 лет Том Мбойя был застрелен на Правительственной дороге в КБР Найроби после посещения аптеки Чаани. Нахашон Исаак Ньенга Ньороге был осужден за убийство и позже повешен."
 kenya.13.d: "Дух революции не умер со времен восстания Мау-Мау. Многие социалистические и профсоюзные группы по всей городской Кении не будут поддерживать правительство белого меньшинства. Пенджабский сикх Махан Сингх объявил о вооруженном восстании против кенийского правительства белого меньшинства."
 kenya.52.d: "Сын знаменитого генерала Второй мировой войны Арчибальда Джона Артура Уэйвелла, второго графа Уэйвелла, погиб сегодня в бою при Тайке. После преследования большого отряда смерти Мау-Мау, который ранее убил уважаемого вождя, преданного ее величеству, граф оказался на переднем крае интенсивной перестрелки, где он получил выстрелы и умер от ран на поле боя."
 kenya.53.d: "Среди королевских африканских винтовок в Кении поднялся местный кадровый солдат, некий Иди Дада Амин. Местные британские офицеры всегда любили молодого угандийца, поскольку его лояльность и конформизм ясно проявлялись в его преданности Империи. Хотя среди его пехоты ходят слухи, что под маской дисциплинированного колониального африканца скрывается очень странная личность, Амин всегда может посмеяться над своими превосходящими британскими офицерами..."
