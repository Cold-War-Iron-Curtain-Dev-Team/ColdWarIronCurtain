l_english:
 kenya.1.d: "О милый вождь, как мы тебя любили! Прошлой ночью Содружество потеряло одну из самых преданных и харизматичных фигур в Восточной Африке. На окраине Найроби любимого вождя подвозили на машине, когда трое вооруженных людей расстреляли автомобиль, убив Варухиу мгновенно. Варухиу был истинным защитником британского колониального правления, откровенным критиком групп независимости и различных коренных народов, борющихся за ненужную автономию. Этих убийц называют \"Мау-Мау\", наши секретари связывают это убийство с множеством других убийств и актов насилия по отношению к белым поселенцам в колонии и протекторате Кения."
 kenya.3.d: "Этой весной принцесса Елизавета посетила коронную колонию и протекторат Кению в рамках путешествия по Империи. После бесконечных похвал и внимания в Найроби принцесса и ее свита отправились на сафари в Рифтовую долину. Однако, насколько ей было известно, днем ранее король Георг скончался от рака легких, оставив ее в качестве наследницы."
 kenya.4.d: "В Кении, как и во многих других странах, населенных суахили, существует множество этнических организаций и движений, непостижимых для сторонних британских наблюдателей. Странствующие мистики, лидеры культов, племенные популисты и тому подобные снуют по всей стране, но недавно появились сообщения о крупных передвижениях представителей племени кикуйю, путешествующих в виде организованных армий. Это, а также недавние столкновения коренных народов с белыми поселенцами в высокогорных районах, заставляют некоторых задуматься, не замышляется ли что-то более зловещее."
 kenya.5.d: "Заканчивается восьмилетнее правление сэра Филиппа Юэна Митчелла. Его управление было скромным и непримечательным, так как после Второй мировой войны основные части Королевских африканских стрелков были расформированы, не происходило ничего примечательного. Однако, в отличие от прежних представлений британцев, среди кенийской интеллигенции существует большое презрение к губернатору. Он описывал коренных жителей Кении как \"уникальный пример одного из немногих народов в мире, не имеющих истории или культуры\", и его снисходительно-патерналистское отношение к местным жителям соответствовало традиционному подходу \"бремени белого человека\" по отношению к африканцам."
 kenya.6.d: "В последние несколько лет пророк по имени Лукас Пкеч набирал последователей для своего движения пророков. За свои яростные антиевропейские взгляды и подстрекательство он был осужден за подстрекательство к мятежу и заключен в тюрьму. Однако пророк сбежал из-под стражи и ведет за собой нескольких преданных последователей по сельской местности. Временный губернатор Алан Стивенс противостоит пророку и его примерно 300 последователям, вооруженным копьями."
 kenya.8.d: "Лидер Союза африканцев Кении Джомо Кениата был заключен в тюрьму за подстрекательство к мятежу. Несмотря на то, что он выступал против движения Мау-Мау, выступал за мирные реформы и осуждал трудовые забастовки и преступное поведение, правительство коронной колонии Кении сочло его арест абсолютно необходимым. Хотя многие призывают к его полному изгнанию из Кении, многие считают, что это оправдает движение за независимость страны, сделав его политическим мучеником. Посмотрим, к чему это приведет в будущем."
 kenya.9.d: "Социалисты, панафриканисты, антиимпериалисты, обычные бунтари — как бы они себя ни называли, студенты по всему Найроби протестуют на неконтролируемом уровне. Многие из этих протестов переросли в акты мародерства и беспорядков в центре города."
 KLFA_uprising: "Восстание Мау-Мау продолжается"
 Tom_Mboya: "Том Мбойя"
 kenyan_decisions_0: "Колония и протекторат Кения в 1950-е годы"
 kenyan_decisions_0_desc: "Колония и протекторат Кения — это, мягко говоря, не самая образцовая колония. Хотя большинство жителей материковой части Великобритании, возможно, почти никогда не задумываются об этой стране своей империи, где 6 миллионов человек живут в четырех крупных городах и в основном в небольших городках, африканское большинство Кении регулярно размышляет о своем статусе британских подданных. Образованная на пике борьбы за Африку, Кения как колония в основном населена народом кикуйю, с заметным присутствием местного британского бизнеса и поселенцев. Как и в каждой африканской колонии, в Кении существует небольшое меньшинство антиколониально и панафриканистски настроенной молодежи и интеллигенции, в основном организованной вокруг активиста Джомо Кениаты. Однако реальную угрозу колониальной стабильности в Кении представляют в основном неграмотные сельские жители страны, поскольку странствующие пророки и мистики формируют отряды в сельской местности центрального нагорья."
 kenya.10.d: "Сегодня было официально объявлено о создании Восточноафриканской федерации. В то время как массовые карнавалы, культурные выставки и восторженные ликующие толпы заполняют улицы Момбасы, Дар-эс-Салама и Кампалы, тем больше вопросов возникает о том, как стабильность государства будет волновать многих. В то время как самый большой город в новой стране-Дар-эс-Салам, столица будет находиться в недавно спланированном и построенном городском центре Момбасы из-за его истории как знаменитого торгового города-государства. Поскольку большая часть старого города Момбасы обезлюдела и вся инфраструктура сосредоточена в этом новом центре, на всенародном референдуме было принято решение переименовать город в Новую Момбасу"
 kenya.11.d: "Операция Буньоро - это кодовое название военной операции, координируемой военными Восточноафриканской Федерации с целью вторжения и свержения Иди Амина в пользу Милтона Оботе. Клептократический лунатик Иди Амин игнорировал неоднократные нарушения его прав человека и продолжающиеся акты агрессии на границе с Танзанией. "
 kenya.12.d: "В возрасте 38 лет Том Мбойя был застрелен на Правительственной дороге в КБР Найроби после посещения аптеки Чаани. Нахашон Исаак Ньенга Ньороге был осужден за убийство и позже повешен."
 kenya.13.d: "Дух революции не умер со времен восстания Мау-Мау. Многие социалистические и профсоюзные группы по всей городской Кении не будут поддерживать правительство белого меньшинства. Пенджабский сикх Махан Сингх объявил о вооруженном восстании против кенийского правительства белого меньшинства."
 kenya.52.d: "Сын знаменитого генерала Второй мировой войны Арчибальда Джона Артура Уэйвелла, второго графа Уэйвелла, погиб сегодня в бою при Тайке. После преследования большого отряда смерти Мау-Мау, который ранее убил уважаемого вождя, преданного ее величеству, граф оказался на переднем крае интенсивной перестрелки, где он получил выстрелы и умер от ран на поле боя."
 kenya.53.d: "Среди королевских африканских винтовок в Кении поднялся местный кадровый солдат, некий Иди Дада Амин. Местные британские офицеры всегда любили молодого угандийца, поскольку его лояльность и конформизм ясно проявлялись в его преданности Империи. Хотя среди его пехоты ходят слухи, что под маской дисциплинированного колониального африканца скрывается очень странная личность, Амин всегда может посмеяться над своими превосходящими британскими офицерами..."