 USA_aam_short_range_0: "AIM-9 Sidewinder"
 USA_aam_short_range_0_short: "AIM-9A"
 USA_aam_short_range_0_desc: "Американская управляемая ракета «воздух—воздух» с инфракрасной головкой самонаведения. Поступила на вооружение ВВС США в 1956 году, став первой в мире серийной управляемой ракетой «воздух—воздух»."
 USA_aam_long_range_0: "AIM-7A Sparrow"
 USA_aam_long_range_0_short: "AIM-7A"
 USA_aam_long_range_0_desc: "Американская управляемая ракета «воздух—воздух» средней дальности с полуактивной радиолокационной головкой самонаведения. Поступила на вооружение ВМС США в 1956 году. Многократно модернизировалась и до настоящего времени используется военно-воздушными силами многих стран мира, постепенно заменяясь более совершенной ракетой AIM-120 AMRAAM. Существует зенитный вариант ракеты корабельного базирования RIM-7 Sea Sparrow."
 USA_aam_short_range_1: "AIM-9B Sidewinder"
 USA_aam_short_range_1_short: "AIM 9B"
 USA_aam_short_range_1_desc: "Первая модификация ракеты запущенная в массовое производство. Принята на вооружение в 1956 году, одновременно с AIM-9A. Неохлаждаемая ГСН имела угол обзора всего около 4 градусов и сравнительно низкую скорость конического сканирования — из-за чего ракета была малоэффективна против активно маневрирующих целей. Тем не менее, именно эти ракеты впервые участвовали в воздушных боях над Тайваньским проливом в 1958 году, где был зафиксирован ряд попаданий в китайские истребители. Производилась до 1962 года, всего было изготовлено более 80000 ракет для ВМФ и ВВС."
 USA_aam_long_range_1: "AIM-7B Sparrow"
 USA_aam_long_range_1_short: "AIM-7B"
 USA_aam_long_range_1_desc: "В начале 1950-х, ещё до принятия ракеты на вооружение, фирма Raytheon предложила оснастить её активной радиолокационной головкой наведения, реализующей принцип «выстрелил-и-забыл». Ракете присвоили индекс AAM-N-3 и обозначение «Sparrow II». Экспериментальная отработка началась в 1951—1952 годах, но до 1955 не давали удовлетворительных результатов. Только в 1956 году удалось оснастить ракету АРЛГСН AN/APQ-64, но к этому времени флот уже не считал проект перспективным."
 USA_aam_short_range_2: "AIM 9L Sidewinder"
 USA_aam_short_range_2_short: "AIM 9L"
 USA_aam_short_range_2_desc: "Первая в мире ракета с всеракурсной двухдиапазонной ИК ГСН. Использовала принципиально новую ГСН с фотоприёмником на основе антимонида индия охлаждаемым аргоном(все предыдущие были на основе сульфида свинца). За счёт этого появилась возможность обстрела самолётов противника, летящих любым курсом с любого направления. Также имела утяжеленную БЧ массой порядка 9,4 кг, с круговым разлётом готовых поражающих элементов, и ПИМ с лазерным датчиком цели. Принята на вооружение в 1976 году, впервые применена с высокой эффективностью (вероятность поражения цели одной ракетой составила 80 %) во время Фолклендского конфликта в 1982 году. Производилась по лицензии в Германии и Японии."
 USA_aam_long_range_2: "AIM-7С Sparrow"
 USA_aam_long_range_2_short: "AIM-7С"
 USA_aam_long_range_2_desc: "В 1958 году, ракета с полуактивной ГСН была представлена на испытания в ВМФ. Она оснащалась твердотопливным двигателем компании Aerojet, но в отличие от более ранних моделей несла 30-килограммовую стержневую БЧ Mk 38. Радиус действия ракеты составлял порядка 11 км. Ракета успешно прошла испытания и в 1958 году поступила на вооружение, быстро заменив предшествующую модификацию «Sparrow I»."
 USA_aam_short_range_3: "AIM-9M Sidewinder"
 USA_aam_short_range_3_short: "AIM-9M"
 USA_aam_short_range_3_desc: "Принята на вооружение в 1983 году, улучшена помехоустойчивость ГСН, применён малодымный двигатель, система охлаждения ГСН — замкнутая. С 1982 года было произведено около 7000 ракет."
 USA_aam_long_range_3: "AIM-120A AMRAAM"
 USA_aam_long_range_3_short: "AIM-120A"
 USA_aam_long_range_3_desc: "Американская всепогодная управляемая ракета класса «воздух—воздух» средней дальности. Ракеты данного класса предназначены для поражения воздушных целей за пределами прямой видимости цели. В ВВС США получила прозвище Slammer."
 USA_aam_short_range_4: "Aim-9R Sidewinder"
 USA_aam_short_range_4_short: "Aim-9R"
 USA_aam_short_range_4_desc: "Версия ракеты с оптико-электронной системой наведения, позволяющей сканировать изображение цели и наводиться именно на неё. Существенно возросла устойчивость к инфракрасным ловушкам. В 1990 году ракета была представлена на испытания, но после окончания Холодной войны проект был закрыт."
 USA_aam_long_range_4: "AIM-120C-5 AMRAAM"
 USA_aam_long_range_4_short: "AIM-120C"
 USA_aam_long_range_4_desc: "Модификация по второму этапу стала AIM-120C-5. Она представляет собой AIM-120C-4 с более короткой модифицированной секцией управления WCU-28/B с электроникой меньших габаритов. Также были применены более компактные приводы рулевых поверхностей. Это позволило увеличить длину топливного заряда на 127 мм и повысить дальность до 105 км. Новая двигательная секция получила обозначение WPU-16/B. Также на ракетах было применено новое программное обеспечение, повышающее разрешение РЛ ГСН и была повышена помехозащищённость. Модификация AIM-120C-5 была предназначена на экспорт, её поставки начались в июле 2000 года."
 USA_aam_short_range_5: "AIM-9X Sidewinder"
 USA_aam_short_range_5_short: "AIM-9X"
 USA_aam_short_range_5_desc: "Современная модификация ракеты. Разрешение матрицы фотоприёмника 128×128. Улучшена помехоустойчивость к тепловым ловушкам. Улучшена манёвренность благодаря управлению вектором тяги, реализована интеграция с нашлемным дисплеем JHMCS. Поставляется с 2002 года. Произведено более 3000 ракет."
  
