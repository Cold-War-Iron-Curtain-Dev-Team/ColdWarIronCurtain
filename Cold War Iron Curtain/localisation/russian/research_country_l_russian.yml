 KOR_aam_short_range_0: "AIM-9B Sidewinder"
 KOR_aam_short_range_0_short: "AIM-9B"
 KOR_aam_short_range_0_desc: "Первая модификация ракеты запущенная в массовое производство. Принята на вооружение в 1956 году, одновременно с AIM-9A. Неохлаждаемая ГСН имела угол обзора всего около 4 градусов и сравнительно низкую скорость конического сканирования — из-за чего ракета была малоэффективна против активно маневрирующих целей. Тем не менее, именно эти ракеты впервые участвовали в воздушных боях над Тайваньским проливом в 1958 году, где был зафиксирован ряд попаданий в китайские истребители. Производилась до 1962 года, всего было изготовлено более 80000 ракет для ВМФ и ВВС."
 KOR_aam_long_range_0: "AIM-7D Sparrow"
 KOR_aam_long_range_0_short: "AIM-7D"
 KOR_aam_long_range_0_desc: "AAM-N-6a (AIM-7D) был похож на -6, но использовал новый жидкостный ракетный двигатель Thiokol для улучшения характеристик. Он также включал изменения в электронику наведения, чтобы сделать ее эффективной на более высоких скоростях сближения. Модель -6a также была выбрана для вооружения истребителей ВВС F-110A Spectre (F-4 Phantom) в 1962 году, известных им как AIM-101. Он был запущен в производство в 1959 году, всего было построено 7500 экземпляров."
 KOR_aam_short_range_1: "AIM-9E Sidewinder"
 KOR_aam_short_range_1_short: "AIM-9E"
 KOR_aam_short_range_1_desc: "AIM-9E была первой версией, специально разработанной ВВС США. Это был усовершенствованный AIM-9B с новой ГСН с термоэлектрическим (Пельтье) охлаждением и более высокой скоростью слежения 12°/с. Метод охлаждения Пельтье позволял неограниченное время охлаждения, пока ракета находилась на пусковой направляющей. Внешне AIM-9E отличался от AIM-9B более длинной конической носовой частью. Около 5000 AIM-9B были переоборудованы в AIM-9E. AIM-9E-2 — вариант с малодымным двигателем."
 KOR_aam_long_range_1: "AIM-7F Sparrow"
 KOR_aam_long_range_1_short: "AIM-7F"
 KOR_aam_long_range_1_desc: "В январе 1972 года компания Raytheon начала разработку значительно улучшенного AIM-7F. Он отличался новым ракетным двигателем двойной тяги (ускорение / поддержание) (обычно Hercules MK 58, но иногда Aerojet MK 65), который значительно увеличивал дальность полета ракеты. AIM-7F также имел совершенно новую твердотельную электронную систему наведения и управления (GCS), получившую обозначение AN/DSQ-35, которая также была совместима с современными импульсно-доплеровскими радарами."
 KOR_aam_short_range_2: "AIM-9L Sidewinder"
 KOR_aam_short_range_2_short: "AIM-9L"
 KOR_aam_short_range_2_desc: "В 1971 году ВВС США и ВМС США договорились о совместной разработке AIM-9L, значительно улучшенного Sidewinder на базе AIM-9H. Основными целями разработки были ALASCA (All-Aspect Capability) и эффективное использование против сильно маневрирующих и высокоскоростных целей на всех дистанциях. Все функции AIM-9L привели к значительно улучшенной ракете, которая могла захватывать цели во всех аспектах и ​​имела значительно улучшенные характеристики слежения, маневрирования, конечного самонаведения и поражения. Производство началось в 1978 году, было построено более 16000 AIM-9L."
 KOR_aam_long_range_2: "AIM-7M Sparrow"
 KOR_aam_long_range_2_short: "AIM-7M"
 KOR_aam_long_range_2_desc: "Следующей версией AIM-7 была AIM-7M, главной новой особенностью которой была новая обратная моноимпульсная ГСН для возможности обзора / сбития в новом наведении WGU-6 / B (позже WGU-23 / B). раздел. AIM-7M также имеет новую осколочно-фугасную боевую часть WDU-27/B в секции боевой части WAU-17/B. Первый запуск AIM-7М состоялся в 1980 году, а производство AIM-7М началось в 1982 году."
 KOR_aam_short_range_3: "AIM-9M Sidewinder"
 KOR_aam_short_range_3_short: "AIM-9M"
 KOR_aam_short_range_3_desc: "AIM-9M является развитием AIM-9L и заменил последний на производственной линии. Он оснащен ракетным двигателем с уменьшенным дымовыделением, улучшенной секцией наведения, обозначенной WGU-4 / B, улучшенной устойчивостью к средствам противодействия (IRCCM - инфракрасные контрмеры) и повышенной общей надежностью. Производство началось в 1982 году, и на сегодняшний день компанией Raytheon построено более 7000 ракет."
 KOR_aam_long_range_3: "AIM-120A AMRAAM"
 KOR_aam_long_range_3_short: "AIM-120A"
 KOR_aam_long_range_3_desc: ""
 KOR_aam_short_range_4: "AIM-9M-8/9 Sidewinder"
 KOR_aam_short_range_4_short: "AIM-9M-8/9"
 KOR_aam_short_range_4_desc: "Основными текущими серийными версиями являются AIM-9M-8 (USN) и AIM-9M-9 (USAF). Они дополнительно улучшили схему обнаружения IRCM и последние версии ракетного двигателя (MK 36 MOD 11), секции наведения (WGU-4E/B) и AOTD (DSU-15B/B). Большинство существующих AIM-9M будут модернизированы до стандарта -9M-8/9."
 KOR_aam_long_range_4: "AIM-120C-5 AMRAAM"
 KOR_aam_long_range_4_short: "AIM-120C"
 KOR_aam_long_range_4_desc: ""
 KOR_aam_short_range_5: "AIM-9X Sidewinder"
 KOR_aam_short_range_5_short: "AIM-9X"
 KOR_aam_short_range_5_desc: "Современная модификация ракеты. Разрешение матрицы фотоприёмника 128×128. Улучшена помехоустойчивость к тепловым ловушкам. Улучшена манёвренность благодаря управлению вектором тяги, реализована интеграция с нашлемным дисплеем JHMCS. Поставляется с 2002 года. Произведено более 3000 ракет."
  
 CHI_aam_short_range_0: "AIM-9B Sidewinder"
 CHI_aam_short_range_0_short: "AIM-9B"
 CHI_aam_short_range_0_desc: "Разработка Sidewinder началась в 1950 году в NOTS, позже переименованном в NWC (Naval Weapons Center) на Чайна-Лейк. Идея состояла в том, чтобы создать очень простую ракету класса "воздух-воздух" с тепловым наведением путем оснащения 12,7-сантиметровой ракеты "воздух-воздух" (на базе 5-дюймовой зуни) фотоэлементом из сульфида свинца в полусферической стеклянной носовой части для обнаружения ИК-излучения. Другой простой, но эффективной идеей было использование «роллеронов» (колеса со скользящим приводом на задней кромке киля, действующие как стабилизирующие гироскопы) в качестве устройств стабилизации по крену. Первые испытательные ракеты были запущены в 1951 году, а 11 сентября В 1953 году произошло первое попадание беспилотника в воздух-воздух."
 CHI_aam_long_range_0: "AIM-7D Sparrow"
 CHI_aam_long_range_0_short: "AIM-7D"
 CHI_aam_long_range_0_desc: "AAM-N-6a (AIM-7D) был похож на -6, но использовал новый жидкостный ракетный двигатель Thiokol для улучшения характеристик. Он также включал изменения в электронику наведения, чтобы сделать ее эффективной на более высоких скоростях сближения. Модель -6a также была выбрана для вооружения истребителей ВВС F-110A Spectre (F-4 Phantom) в 1962 году, известных им как AIM-101. Он был запущен в производство в 1959 году, всего было построено 7500 экземпляров."
 CHI_aam_short_range_1: "AIM-9E Sidewinder"
 CHI_aam_short_range_1_short: "AIM-9E"
 CHI_aam_short_range_1_desc: "AIM-9E была первой версией, специально разработанной ВВС США. Это был усовершенствованный AIM-9B с новой ГСН с термоэлектрическим (Пельтье) охлаждением и более высокой скоростью слежения 12°/с. Метод охлаждения Пельтье позволял неограниченное время охлаждения, пока ракета находилась на пусковой направляющей. Внешне AIM-9E отличался от AIM-9B более длинной конической носовой частью. Около 5000 AIM-9B были переоборудованы в AIM-9E. AIM-9E-2 — вариант с малодымным двигателем."
 CHI_aam_long_range_1: "AIM-7F Sparrow"
 CHI_aam_long_range_1_short: "AIM-7F"
 CHI_aam_long_range_1_desc: "В январе 1972 года компания Raytheon начала разработку значительно улучшенного AIM-7F. Он отличался новым ракетным двигателем двойной тяги (ускорение / поддержание) (обычно Hercules MK 58, но иногда Aerojet MK 65), который значительно увеличивал дальность полета ракеты. AIM-7F также имел совершенно новую твердотельную электронную систему наведения и управления (GCS), получившую обозначение AN/DSQ-35, которая также была совместима с современными импульсно-доплеровскими радарами."
 CHI_aam_short_range_2: "AIM-9L Sidewinder"
 CHI_aam_short_range_2_short: "AIM-9L"
 CHI_aam_short_range_2_desc: "В 1971 году ВВС США и ВМС США договорились о совместной разработке AIM-9L, значительно улучшенного Sidewinder на базе AIM-9H. Основными целями разработки были ALASCA (All-Aspect Capability) и эффективное использование против сильно маневрирующих и высокоскоростных целей на всех дистанциях. Все функции AIM-9L привели к значительно улучшенной ракете, которая могла захватывать цели во всех аспектах и ​​имела значительно улучшенные характеристики слежения, маневрирования, конечного самонаведения и поражения. Производство началось в 1978 году, было построено более 16000 AIM-9L."
 CHI_aam_long_range_2: "AIM-7M Sparrow"
 CHI_aam_long_range_2_short: "AIM-7M"
 CHI_aam_long_range_2_desc: "Следующей версией AIM-7 была AIM-7M, главной новой особенностью которой была новая обратная моноимпульсная ГСН для возможности обзора / сбития в новом наведении WGU-6 / B (позже WGU-23 / B). раздел. AIM-7M также имеет новую осколочно-фугасную боевую часть WDU-27/B в секции боевой части WAU-17/B. Первый запуск AIM-7М состоялся в 1980 году, а производство AIM-7М началось в 1982 году."
 CHI_aam_short_range_3: "AIM-9M Sidewinder"
 CHI_aam_short_range_3_short: "AIM-9M"
 CHI_aam_short_range_3_desc: "AIM-9M является развитием AIM-9L и заменой последней на производственной линии. Он оснащен ракетным двигателем с уменьшенным дымовыделением, улучшенной секцией наведения, обозначенной WGU-4 / B, улучшенной устойчивостью к средствам противодействия (IRCCM - инфракрасные контрмеры) и повышенной общей надежностью. Производство началось в 1982 году, и на сегодняшний день компанией Raytheon построено более 7000 ракет."
 CHI_aam_long_range_3: "AIM-120A AMRAAM"
 CHI_aam_long_range_3_short: "AIM-120A"
 CHI_aam_long_range_3_desc: ""
 CHI_aam_short_range_4: "AIM-9M-8/9 Sidewinder"
 CHI_aam_short_range_4_short: "AIM-9M-8/9"
 CHI_aam_short_range_4_desc: "Основными текущими серийными версиями являются AIM-9M-8 (USN) и AIM-9M-9 (USAF). Они дополнительно улучшили схему обнаружения IRCM и последние версии ракетного двигателя (MK 36 MOD 11), секции наведения (WGU-4E/B) и AOTD (DSU-15B/B). Большинство существующих AIM-9M будут модернизированы до стандарта -9M-8/9."
 CHI_aam_long_range_4: "AIM-120C-5 AMRAAM"
 CHI_aam_long_range_4_short: "AIM-120C"
 CHI_aam_long_range_4_desc: "Модификация по второму этапу стала AIM-120C-5. Она представляет собой AIM-120C-4 с более короткой модифицированной секцией управления WCU-28/B с электроникой меньших габаритов. Также были применены более компактные приводы рулевых поверхностей. Это позволило увеличить длину топливного заряда на 127 мм и повысить дальность до 105 км. Новая двигательная секция получила обозначение WPU-16/B. Также на ракетах было применено новое программное обеспечение, повышающее разрешение РЛ ГСН и была повышена помехозащищённость. Модификация AIM-120C-5 была предназначена на экспорт, её поставки начались в июле 2000 года."
