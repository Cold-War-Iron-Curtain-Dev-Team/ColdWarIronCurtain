 IND_support_equipment_desc: "Большой ассортимент высококачественной техники закупается с гражданского рынка. Медицинское оборудование и расходные материалы, логистическое оборудование, бинокли, строительное оборудование и инструменты, а также различные другие общедоступные предметы. Нетрудно найти, заказать или заключить контракт на подавляющее большинство используемого вспомогательного оборудования."
 IND_support_equipment_0_desc: "Большой ассортимент высококачественной техники закупается с гражданского рынка. Медицинское оборудование и расходные материалы, логистическое оборудование, бинокли, строительное оборудование и инструменты, а также различные другие общедоступные предметы. Нетрудно найти, заказать или заключить контракт на подавляющее большинство используемого вспомогательного оборудования."
 IND_motorized_equipment_1_desc: "Крепкий и надежный 1,5-тонный фермерский грузовик 4x4. Хотя они и не так хороши, как обычные грузовики военного класса, большие фермерские грузовики часто прекрасно подходят для их целей. Сельскохозяйственные грузовики построены с учетом надежности и способны перевозить большие грузы в различных ландшафтах. Фермерские грузовики могут перевозить изрядное количество грузов и перевозить до 10 солдат в кузове. Несмотря на надежность и некоторую прочность, они часто испытывают трудности с перевозкой особенно тяжелых грузов и могут потребовать переоборудования или прицепов в соответствии с их назначением. Таким образом, эти сельскохозяйственные грузовики поставляются с заказным оборудованием или спецификациями."
 IND_motorized_equipment_4_desc: "Исключительно сильный 5-тонный тяжелый внедорожный грузовик 6x6, построенный для промышленных целей с индивидуальными модификациями и построенный на заказ с гражданского рынка. Способные перевозить до 12 солдат и перевозить столько же веса, сколько и военные грузовики общего назначения, гражданские промышленные грузовики 6x6 идеально подходят для нужд военных. Эти грузовики часто имеют большую часть тех же элементов, что и военные транспортные средства, а иногда и те же конструкции."
 IND_utility_helicopter_equipment_1_desc: "Простой, но элегантный вертолет раннего рынка. Вертолеты имеют множество применений в промышленности, коммунальных службах, экстренных службах, торговле, а иногда и в личном использовании. Гражданские вертолеты на рынке редко соответствуют техническим характеристикам военных вертолетов и никогда не будут такими же способными."
 IND_utility_helicopter_equipment_3_desc: "Коммерческий вертолет, купленный на гражданском рынке. Эти вертолеты предназначены для различных гражданских целей, включая чрезвычайные или общественные службы и торговлю. Эти вертолеты могут быть приспособлены для различных военных задач по индивидуальному заказу или путем модернизации военными профессионалами."
 IND_utility_helicopter_equipment_5_desc: "Исключительно сильный и способный сверхмощный вертолет, построенный для аварийных служб и промышленного использования. Эти вертолеты быстры, сильны и в чем-то сравнимы с военными вертолетами в эпоху, когда они доступны для покупки. Они могут быть приспособлены для выполнения практически любой роли, которую может выполнять военный вертолет общего назначения, и выполнять прямую боевую или вспомогательную роль. Кроме того, с незначительными пользовательскими спецификациями они могут быть даже оснащены контрмерами или оружием, которое вы производите или покупаете по военным контрактам."
 IND_transport_plane_equipment_3_desc: "Варианты многочисленных различных избыточных транспортных самолетов, оставшихся после Второй мировой войны и проданных большим количеством независимых избыточных трейдеров. Многие страны после Второй мировой войны имели избыточное оборудование, которое они больше не хотели хранить или хотели заменить более современными самолетами после войны. Таким образом, эти избыточные транспортные самолеты ВМВ поставляются в различных состояниях ремонта, пробега и дизайна. Но вы не можете назначить цену за древность."
 IND_transport_plane_equipment_5_desc: "После создания эффективных грузовых авиаперевозок в 1950-х годах коммерческое и промышленное использование грузовых самолетов резко возросло. Эти коммерческие грузовые самолеты более чем способны эффективно перевозить грузы или служить военным целям. Коммерческие грузовые самолеты нуждаются в минимальном переоборудовании для военных целей, если только они не используются для воздушных операций, и в этом случае их конструкция должна быть сильно изменена, чтобы соответствовать этой роли. Тем не менее, они часто не имеют никаких проблем в большинстве ситуаций."
 IND_transport_plane_equipment_8_desc: "Включающие в себя множество различных категорий грузовых самолетов, эти коммерческие грузовые самолеты могут быть чем угодно-от комбинированных самолетов до брюшных грузовых самолетов или даже включать грузовые самолеты международной почтовой службы. Эти грузовые самолеты часто используются для перевозки грузов, которые должны быть доставлены быстро и не могут прибыть вовремя грузового судна. Эти самолеты часто способны выполнять военные функции, но настоятельно рекомендуется заказывать их специально для Воздушно-десантных операций в зонах боевых действий."
 IND_cargo_helicopter_equipment_2_desc: "Прототип / раннее принятие на гражданский рынок грузового вертолета. В то время как гражданский мир имел бесчисленное множество применений для служебных вертолетов, создание тяжелых грузовых вертолетов для коммерческих или военных целей заняло некоторое время. Было много ранних последователей грузовых вертолетов и большое количество независимых производителей, которые могли принимать контракты и заказы на грузовые вертолеты."
 IND_cargo_helicopter_equipment_4_desc: "Полностью дееспособный промышленный / коммерческий грузовой вертолет гражданского рынка. Эти вертолеты способны выполнять многочисленные функции в промышленности или торговле и широко используются в экстренных службах. Помимо аварийных служб и некоторых подразделений в промышленности и торговле, они часто являются роскошью или новинкой, поскольку небольшие служебные вертолеты выполняют те же функции, что и гражданские. Тем не менее, нетрудно найти гражданских промышленных производителей, которые способны и готовы производить их."
 IND_jet_light_equipment_1_desc: ""
 IND_jet_light_equipment_3_desc: ""
 IND_jet_light_equipment_5_desc: ""
 IND_convoy1_desc: "Гражданское торговое грузовое судно, используемое для перевозки больших партий товаров по морям. Гражданские торговые суда могут отлично служить в военной логистике и повсеместно доступны с бесчисленными производителями и сухими доками, легко доступными для массового производства этих кораблей. Грузовые суда обрабатывают основную часть международной торговли в мире и делятся на классы в зависимости от типа груза, который они перевозят. Это могут быть суда общего назначения, контейнеровозы, танкеры, сухогрузы, многоцелевые суда, суда RORO (для колесных транспортных средств) или рефрижераторные суда (рефрижераторы)."
 IND_convoy_desc: "Гражданское торговое грузовое судно, используемое для перевозки больших партий товаров по морям. Гражданские торговые суда могут отлично служить в военной логистике и повсеместно доступны с бесчисленными производителями и сухими доками, легко доступными для массового производства этих кораблей. Грузовые суда обрабатывают основную часть международной торговли в мире и делятся на классы в зависимости от типа груза, который они перевозят. Это могут быть суда общего назначения, контейнеровозы, танкеры, сухогрузы, многоцелевые суда, суда RORO (для колесных транспортных средств) или рефрижераторные суда (рефрижераторы)."
  
