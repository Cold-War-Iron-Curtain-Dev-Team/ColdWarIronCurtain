 FRA_aam_short_range_0: "Nord AA.20"
 FRA_aam_short_range_0_short: "AA.20"
 FRA_aam_short_range_0_desc: "Французская ракета класса "воздух-воздух", разработанная Nord Aviation, и была одной из первых таких ракет, принятых на вооружение в Западной Европе. Производство началось в Шатийоне, Франция, в 1956 году. Было выпущено около 6000 ракет этого типа, которые оставались в эксплуатации до 1960 года."
 FRA_aam_short_range_1: "Matra R.510"
 FRA_aam_short_range_1_short: "R.510"
 FRA_aam_short_range_1_desc: "Французская ракета класса "воздух-воздух" , разработанная Matra на основе их работы с Matra M.04 (R.042) и R.05. Первая версия ракеты, R.510 , была с инфракрасным наведением, и в то время как точный имел очень ограниченные рабочие параметры. [1] Ракета была заменена гораздо более способной R.530 на французской службе, хотя продолжала использоваться в учебных частях до 1976 года."
 FRA_aam_short_range_2: "AIM-9B Sidewinder"
 FRA_aam_short_range_2_short: "AIM-9B"
 FRA_aam_short_range_2_desc: "Американская управляемая ракета «воздух—воздух» с инфракрасной головкой самонаведения. Поступила на вооружение ВВС США в 1956 году, став первой в мире серийной управляемой ракетой «воздух—воздух»."
 FRA_aam_short_range_3: "Matra R.550 Magic"
 FRA_aam_short_range_3_short: "R.550"
 FRA_aam_short_range_3_desc: "Ракета ближнего боя, разработана в 1967 году компанией Matra. Ракета поступила на вооружение в 1974 году. В головной части ракеты установлены четыре аэродинамические поверхности."
 FRA_aam_short_range_4: "Matra R.550 Magic 2"
 FRA_aam_short_range_4_short: " R.550 Magic 2"
 FRA_aam_short_range_4_desc: "Является малой дальности ракеты класса " воздух-воздух " разработан в 1968 году французской компанией Matra , чтобы конкурировать с американской AIM-9 Sidewinder , и это было мудро сделал обратную совместимость с аппаратными средствами запуска Sidewinder."
 FRA_aam_short_range_5: "MBDA MICA"
 FRA_aam_short_range_5_short: "MICA"
 FRA_aam_short_range_5_desc: "Французская авиационная ракета класса «воздух-воздух» для поражения высокоманёвренных целей на малой и средней дистанции. Была разработана в качестве замены ракет средней дальности Matra Super 530D/F и ракет ближнего боя Matra R550 Magic II для вооружения истребителей Mirage 2000 и Rafale"
  
 FRA_aam_long_range_0: "Matra R.511"
 FRA_aam_long_range_0_short: "R.511"
 FRA_aam_long_range_0_desc: "Французская ракета класса воздух-воздух", разработанной Matra на основе их работы с Matra M.04 и R.05. Первая версия ракеты, R.510, была с инфракрасным наведением, и в то время как точный имел очень ограниченные рабочие параметры."
 FRA_aam_long_range_1: "Matra R.530"
 FRA_aam_long_range_1_short: "R.530"
 FRA_aam_long_range_1_desc: "Французская ракета класса «воздух-воздух» малой и средней дальности, разработанная фирмой Matra и являющаяся модернизированной версией ракеты Matra R530"
 FRA_aam_long_range_2: "Matra Super 530"
 FRA_aam_long_range_2_short: "Super 530"
 FRA_aam_long_range_2_desc: "Французская ракета класса «воздух-воздух» малой и средней дальности, разработанная фирмой Matra и являющаяся модернизированной версией ракеты Matra R530. В настоящее время Super 530 заменяется ракетой MICA европейского концерна MBDA."
 FRA_aam_long_range_3: "Matra Super 530D"
 FRA_aam_long_range_3_short: "Super 530D"
 FRA_aam_long_range_3_desc: "Французская ракета класса «воздух-воздух» малой и средней дальности, применяемая в составе вооружения Dassault-Breguet Mirage 2000. Впервые представлена в 1988 году"
 FRA_aam_long_range_4: "MBDA Meteor"
 FRA_aam_long_range_4_short: "Meteor"
 FRA_aam_long_range_4_desc: "управляемая ракета класса «воздух-воздух» большой дальности, оснащенная активной радиолокационной ГСН. Ракета оснащается маршевым прямоточным воздушно-реактивным двигателем, что позволяет поддерживать высокую скорость полёта на всей траектории, но также увеличивает ИК заметность ракетной атаки."
  
