 SOV_agm_0: "С-5K"
 SOV_agm_0_short: "С-5K"
 SOV_agm_0_desc: "55-мм неуправляемые ракеты С-5, впервые испытанные в качестве ракеты класса «воздух-воздух», не справились с этой задачей, доказали свою эффективность при поражении наземных целей, вариант С-5К имеет кумулятивную боевую часть (кумулятивную), высокоэффективную против средних и легкобронированных целей без потери характеристик против небронированных целей."
 SOV_agm_1: "С-8B"
 SOV_agm_1_short: "С-8K"
 SOV_agm_1_desc: "Неуправляемая ракета С-8 является дальнейшим развитием ракеты С-5. С-8 80 мм, имеет больше габаритных возможностей и увеличивает дальность полета ракеты. Вариант С-8Б фокусируется на том, чтобы быть надежным проникающим средством, загружаемым меньшим количеством взрывчатых веществ и делающим его более эффективным против более бронированных целей."
