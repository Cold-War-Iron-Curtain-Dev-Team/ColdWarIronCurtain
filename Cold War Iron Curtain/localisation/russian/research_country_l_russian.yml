 PRC_squad_weapons_1: "ДП"
 PRC_squad_weapons_1_short: "ДП"
 PRC_squad_weapons_1_desc: "Ручной пулемёт, разработанная Василием Дегтяревым в 1927 году для Советского Союза. Сама пушка использует те же боеприпасы, что и Мосин-Наган, и представляет собой полностью автоматическую газовую ЛМГ с закрылком кьельмана-Фриберга. Он включает в себя съемный ствол со встроенным глушителем вспышки и магазин поддона. Это было легко для массового производства из-за его простых и немногих частей. Он хорошо известен своим легким весом и универсальностью. Он устанавливался на советских танках, самолетах и использовался пехотой. Он широко использовался во время Второй мировой войны."
 PRC_squad_weapons_2: "РП-46"
 PRC_squad_weapons_2_short: "РП-46"
 PRC_squad_weapons_2_desc: "Советский ручной пулемёт, созданный в 1946 году конструкторами А. И. Шилиным, П. П. Поляковым и А. А. Дубининым на основе более раннего пулемёта Дегтярёва"
 PRC_squad_weapons_3: "Type 67"
 PRC_squad_weapons_3_short: "Type 67"
 PRC_squad_weapons_3_desc: "Единый пулемёт производства китайской компании «NORINCO».Пулемёт создавался для НОАК как более лёгкая замена Type 53 (СГ-43) и Type 57 (СГМ), которые выпускались в КНР по советской лицензии.Использует спусковой механизм от пулемёта ДП, быстросьёмный ствол от СГ-43, газовый регулятор, подобный РПД, ударно-затворный механизм ZB vz. 30 и систему питания на основе модифицированного механизма подачи ленты пулемёта Максима."
 PRC_squad_weapons_4: "QJY-88"
 PRC_squad_weapons_4_short: "QJY-88"
 PRC_squad_weapons_4_desc: "Китайский единый пулемёт. Предназначен для замены в войсках устаревшего пулемёта Тип 67-2. Он разработан под новый китайский малоимпульсный патрон 5,8×42 мм. Автоматика QJY-88 основана на отводе пороховых газов из канала ствола и запирании ствола поворотным затвором с двухступенчатой подачей патронов из нерассыпной ленты. Пулемёт использует механические прицельные приспособления, но также могут использоваться оптические, ночные, тепловизионные прицелы. По весу, который составляет порядка 11,8 кг, QJY-88 ближе всего к единым пулемётам, тогда как малокалиберный патрон роднит его с ручными пулемётами типа M249 SAW или MG4."
 PRC_squad_weapons_5: "QBZ-95"
 PRC_squad_weapons_5_short: "QBZ-95"
 PRC_squad_weapons_5_desc: "китайское семейство оружия, включающее автомат и ручной пулемёт. Оружие выполнено по компоновке «булл-пап» и использует (в базовой версии) новый китайский 5,8-мм промежуточный патрон"
  
 PRC_specialist_1: "СВТ-40"
 PRC_specialist_1_short: "СВТ-40"
 PRC_specialist_1_desc: "Полуавтоматическая газовая винтовка с магазинной подачей. СВТ-40-боевая винтовка, разработанная для Советского Союза в 1940 году Сергеем Симоновым. Он был отдан специально назначенным стрелкам и снайперам, хотя стандартный выпуск Мосина-Нагана также использовался для дальнего боя некоторыми снайперами. Он широко использовался во время Второй мировой войны и с тех пор участвовал во многих различных коммунистических мятежах, поскольку был арендован повстанцами Советским Союзом."
 PRC_specialist_2: "Снайперская винтовка Драгунова"
 PRC_specialist_2_short: "Драгунов"
 PRC_specialist_2_desc: "Самозарядная снайперская винтовка под патрон 7.62x54R. Драгунов был разработан в 1963 году Евгением Драгуновым. Само оружие известно своей высокой точностью и исключительной надежностью и используется армиями всего мира даже по сей день. Недорогие боеприпасы, простота обслуживания и высокая надежность обеспечили то, что это оружие оставалось на вооружении даже в некоторых из самых бедных армий мира и все еще умудрялось складываться в современных боевых условиях. Он видел неисчислимое количество сражений в более чем 40 войнах по всему миру."
 PRC_specialist_3: "Винторез"
 PRC_specialist_3_short: "ВСС"
 PRC_specialist_3_desc: "Специализированная снайперская винтовка, разработанная в 1980 году Сердюковым и Красниковым. Снайперская винтовка VSS имеет встроенный подавленный ствол и использует дозвуковые или АП боеприпасы. Сама винтовка используется в основном подразделениями спецназа, такими как спецназ, для ее скрытного использования и встроенной системы подавления звука и вспышки. Он видел боевые действия в Афганской войне, хотя и очень редко за ее пределами."
 PRC_specialist_4: "СВУ-АС (ОЦ-03) "
 PRC_specialist_4_short: "ОЦ-03 СВУ"
 PRC_specialist_4_desc: "Современный булпап-вариант "Драгунова", который изначально предполагался слегка модернизировать "Драгунов", но проект привел к почти полной перестройке вооружения. Разработанное в 1990 году конструкторским бюро приборостроения КБП, оружие переосмыслило старого Драгунова. Был добавлен специальный дульный тормоз, значительно уменьшающий энергию отдачи, и прикреплен эластичный приклад. Большое количество других небольших улучшений, таких как улучшенная рукоятка, крепление прицела и уменьшенный размер ствола с конфигурацией буллпапа, привели к тому, что оружие стало проще в обращении. СВУ участвовала в боевых действиях в Первую Чеченскую войну, где она продемонстрировала исключительные характеристики по сравнению с оригинальным Драгуновым."
 PRC_specialist_5: "QBU 88"
 PRC_specialist_5_short: "QBU 88"
 PRC_specialist_5_desc: "Китайская снайперская винтовка компоновки буллпап, разработанная в конце 2014-х годов.Она работает по схеме с газоотводной автоматикой и коротким ходом газового поршня. Ствольная коробка — стальная. Винтовка имеет открытые прицельные приспособления, регулируемый диоптрический целик, мушку в кольцевом намушнике. Ствольная коробка оснащена креплением для установки кронштейна оптических или ночных прицелов. На винтовку крепится 4-кратный дневной оптический прицел. Ствол имеет пламегаситель. Для стрельбы из QBU-88 применяются промежуточные патроны калибра 5,8×42 мм, точнее их специальный вариант с более тяжёлой пулей с бронебойным сердечником. Технически представляет собой 10-зарядную винтовку, которая использует газоотводную автоматику с коротким ходом газового поршня, расположенного под стволом. Подача патронов при стрельбе производится из отъемных коробчатых магазинов емкостью 10 патронов."
  
 PRC_ammo_explosives_1: "РГД-33, ПЦО"
 PRC_ammo_explosives_1_short: "РГД-33, ПЦО"
 PRC_ammo_explosives_1_desc: "РГД-33 - ручная граната, разработанная Дьяконовым в 1933 году. Сама граната заряжена тротилом, и взрыватель был поражен процессом броска и поступательным импульсом после того, как он был заряжен. Саму гранату собирали только перед боем, чтобы уменьшить вероятность несчастных случаев, причем гильзу, боеголовку и рукоятку держали отдельно. Он говорит о большом уровне использования до, во время и после Второй мировой войны, а также корейской и Вьетнамской войн.\nПуля с цельнометаллической оболочкой - пуля, изобретенная в 1882 году швейцарским полковником Эдуардом Рубином. Однако за время, прошедшее с тех пор до Второй мировой войны, в металлургию были внесены улучшения, и поэтому раунд Второй мировой войны просто включил более качественные материалы в уже существующий дизайн."
 PRC_ammo_explosives_2: "РКГ-3,Ф-1, МОН-50"
 PRC_ammo_explosives_2_short: "РКГ-3, Ф-1, МОН-50"
 PRC_ammo_explosives_2_desc: "РКГ-3 - советская граната, разработанная в 1950 году как усовершенствование РПГ-40 ее производителями. Она участвовала в иракской и судьбоносной войнах. Сама граната имела более высокий уровень противобронирующей способности по сравнению со своим предшественником и отличалась улучшенным взрывателем и мощной начинкой.\nФ-1 - ручная противопехотная оборонительная граната, в которой российские производители оружия улучшили существующую французскую гранату F1, установив современный растяжной взрыватель и тротиловую начинку с более качественным набором осколочных металлических оболочек. Она видела практически все русские боевые действия со времен Второй мировой войны, когда он был разработан в 1941 году и по сей день.\nМОН - серия ранних наземных мин, разработанных для Советского Союза различными конструкторами в период с 50-х по 60-е гг. все МОН являются противопехотными и обычно используют осколки и тротил для выполнения задач по отказу от зоны поражения. Они видели практически все боевые действия Советского Союза в 50-е и 60-е годы"
 PRC_ammo_explosives_3: "Бронебойный снаряд, Мины ТМ"
 PRC_ammo_explosives_3_short: "Бронебойный снаряд, Мины ТМ"
 PRC_ammo_explosives_3_desc: "БС-снаряды существовали в течение многих лет, начиная с Первой мировой войны и использовались в основном в проникающих боевых кораблях. Примерно в Первой мировой войне, после того как танк вышел на поле боя, были созданы миниатюрные снаряды. В конце концов, небольшие калибры БС были созданы как ответ на бронежилет. Современные БС в 1965 году были созданы как ответ на увеличение численности тяжелобронированной пехоты и пехотного прикрытия. Наземные мины ТМ - это серия советских противотанковых взрывных мин, первоначально разработанных и широко использовавшихся около 1941 года, но были прекращены из-за нехватки металла, который был приоритетным для создания другого оружия. Однако примерно в 1957 году они вернулись, и разработка и производство мин ТМ были продолжены с использованием более современных взрывчатых веществ. ТМ-мины часто использовались почти везде, где был конфликт в советской сфере, но их полный потенциал был засвидетельствован вокруг советского вторжения в Афганистан."
 PRC_ammo_explosives_4: "РГО/РГН"
 PRC_ammo_explosives_4_short: "РГО/РГН"
 PRC_ammo_explosives_4_desc: "РГО и РГН - оборонительные и наступательные осколочные ручные гранаты соответственно. Они состоят из однослойного предварительно фрагментированного тела. Сама раковина сделана из 2 зубчатых алюминиевых секций сверху и снизу. Сами гранаты немедленно взрываются при ударе, что затрудняет реакцию мишеней. Они были созданы по проекту "Базальт" во время Советско-Афганской войны, и их ударные взрывы облегчали попадание по целям в скалистой местности.гранаты-это ручные гранаты, выполняющие специальные функции, такие как светошумовые гранаты, дымовые шашки, зажигательные гранаты и т. д. Они могут быть использованы, чтобы оглушить врагов, скрыть позиции и запустить отрицание области соответственно."
 PRC_ammo_explosives_5: "Современные снаряды"
 PRC_ammo_explosives_5_short: "Современные снаряд"
 PRC_ammo_explosives_5_desc: "В современную эпоху существует огромный арсенал различных типов специализированных боеприпасов, которые могут быть использованы в конкретных ситуациях. Современные БС гораздо лучше проникают в цели, чем старые АП-снаряды, и могут достигать более высоких скоростей. Современные сплавы позволяют стандартным боеприпасам наносить больший урон цели. Хрупкие пули или зажигательные патроны имеют особые ситуации, в которых они полезны. Кроме того, дробовики могут иметь улучшенное удобство использования в современном бою с патронами HE, нулевых патронов, патронов flechette или зажигательных выстрелов."
  
 PRC_manpats_1: "Ружейный гранатомёт Дьяконова"
 PRC_manpats_1_short: "Ружейный гранатомёт Дьяконова"
 PRC_manpats_1_desc: "Ружейный гранатомёт системы Дьяконова был одним из самых ранних образцов пехотных взрывчатых веществ и иногда служил противотанковым оружием во время Второй мировой войны. Однако Советский Союз не разрабатывал собственного противотанкового пехотного вооружения и сильно полагался на ленд-лиз. Дьяканов был разработан компанией Dyakanov MG в 1917 году и может запускать специально построенные дульные взрывчатые вещества, такие как противотанковые или противопехотные гранаты. Само оружие широко использовалось во время Второй мировой войны, но было быстро отброшено после окончания войны в пользу Советского Союза, разрабатывающего лучшие пехотные гранатометы и соответствующие ПЗРК."
 PRC_manpats_2: "РПГ-7"
 PRC_manpats_2_short: "РПГ-7"
 PRC_manpats_2_desc: "Советский ручной противотанковый гранатомёт многоразового применения, Разработан в 1958 году ГСКБ-47 (ныне ГНПП «Базальт»). РПГ-7хорошо известен своей простотой, низкой стоимостью, высокой эффективностью, а также невероятной долговечностью и надежностью. Он способен стрелять стандартными, тепловыми снарядами, осколочными и термобарическими снарядами. Он состоит из очень простой системы, обеспечивающей его низкую стоимость и простоту обслуживания. Он основан вокруг стальной трубы, а середина покрыта деревом для защиты от тепла. Конец расклешен, чтобы помочь в защите пользователя от взрыва и обеспечить снижение отдачи. При выстреле он просто поражает боек, как обычное огнестрельное оружие, чтобы воспламенить гранату. Он был повсеместно распространен с момента его создания и был замечен практически во всех боевых действиях в каждом месте на Земле."
 PRC_manpats_3: "РПГ-18 «Муха»"
 PRC_manpats_3_short: "РПГ-18 «Муха»"
 PRC_manpats_3_desc: "Cоветская реактивная противотанковая граната, разработанная ЦКИБ СОО и КБ «Базальт» в начале 1960-х годов (ведущие конструкторы В.И. Барабошкин, И.Е. Рогозин) и принятая на вооружение Советской Армии в 1972 году. РПГ-18» Муха" стреляет 64-мм тепловой боеголовкой и имеет эффективную дальность действия 200 метров. Боеголовка всегда самоуничтожается через 6 секунд, что накладывает определенный предел. РПГ-18"Муха" использовался не так часто, как РПГ-7, и не так часто путешествовал по миру из-за того, что его нельзя было перезарядить. Однако он очень дешев, несмотря на то, что более громоздок с точки зрения логистики, поскольку каждая трубка срабатывает только один раз. Он широко использовался Китаем в различных войнах, а также в Советско-Афганской войне."
 PRC_manpats_4: "РПГ-29 «Вампир»"
 PRC_manpats_4_short: "РПГ-29 «Вампир»"
 PRC_manpats_4_desc: "Перезаряжаемый противотанковый РПГ, разработанный компанией «Базальт»в конце 1980-х гг. он был разработан для обеспечения современного, улучшенного варианта РПГ-7 и является перезаряжаемым в отличие от РПГ-18 "Муха". Он стреляет ракетами на эффективной дальности около 600 метров и не ограничен временной боеголовкой. Он гораздо более способен пробивать броню, чем РПГ-7, хотя он не полностью уничтожил РПГ-7 или РПГ-18 «Муха» из-за его более высокой стоимости. У РПГ-29"Вампир» также нет начального заряда топлива для защиты операторов, поскольку ракета воспламеняется, чтобы уменьшить вес и дать более ценное значение веса, которое может быть использовано для большего количества ракетного топлива. Это означает, что он не так прост в использовании и требует определенного уровня защиты для своего пользователя, но делает его более эффективным. The-29"Вампир» использовался в войне в Ираке, гражданской войне в Сирии и Ливанской войне 2006 года."
 PRC_manpats_5: "РПГ-32 «Баркас»"
 PRC_manpats_5_short: "РПГ-32 «Баркас»"
 PRC_manpats_5_desc: "Российский многоразовый ручной мультикалиберный многофункциональный гранатомёт. Оружие имеет эффективную дальность действия около 350 м с максимальной дальностью 700 м. пусковая установка поставляется с 2 различными 72 - мм или 105-мм боеголовками, которые являются термобарическими или тепловыми. Он обладает гораздо большей бронебойной способностью, чем любой из его предшественников. Он еще не был развернут или принят российской армией из-за его высокой стоимости, хотя некоторые ближневосточные страны импортируют его из России в основном для использования в своих армейских батальонах высшего класса. В настоящее время он используется в Гражданской войне в Ираке и Гражданской войне в Йемене."
  
 PRC_hmg_1: "ДШК"
 PRC_hmg_1_short: "ДШК"
 PRC_hmg_1_desc: "Советский станковый крупнокалиберный пулемёт под патрон 12,7×108 мм. Разработан на основе конструкции крупнокалиберного станкового пулемёта ДК. В феврале 1939 года ДШК был принят на вооружение РККА под обозначением «12,7 мм крупнокалиберный пулемёт Дегтярёва — Шпагина образца 1938 года»."
 PRC_manpads_1: "«Стрела-2»"
 PRC_manpads_1_short: "«Стрела-2»"
 PRC_manpads_1_desc: "Cоветский переносной зенитно-ракетный комплекс, принятый на вооружение ВС СССР в 1968 году. Разработанное КБМ в 1964 году, это оружие имело взрыватель ударной детонации без задержки, взрывчатую боеголовку HE и пропорциональную навигационную логическую систему наведения ракет. Он оказался относительно недорогим в массовом производстве. Однако советское высшее командование быстро отметило, что комплекс действовал плохо и намного ниже того, что они ожидали от этого оружия. Он видел конфликт в Советско-Афганской войне, много различных коммунистических революций, а также широкое использование в ближневосточных конфликтах."
 PRC_manpads_2: "«Стрела-3»"
 PRC_manpads_2_short: "«Стрела-3»"
 PRC_manpads_2_desc: "Советский переносной зенитно-ракетный комплекс, модернизация «Стрелы-2». Использовала ракеты 9М36 с новой инфракрасной головкой самонаведения и коническим сканированием фазомодулированным сигналом (ЧМ вместо AM-модуляции по амплитуде со спиральным сканированием)."Стрела-3" использовался во многих различных ближневосточных конфликтах, таких как иракско-иранская война, но не видел много боевых действий в самой советской сфере."
 PRC_manpads_3: "«Игла»"
 PRC_manpads_3_short: "«Игла»"
 PRC_manpads_3_desc: "Советский переносной зенитный ракетный комплекс, предназначенный для поражения низколетящих воздушных целей на встречных и догонных курсах в условиях тепловых помех.Разработка принципиально нового комплекса началась в Коломне в 1971 году. Главным разработчиком ПЗРК «Игла» (9К38) было определено КБМ Министерства оборонной промышленности СССР (главный конструктор — С. П. Непобедимый), а тепловая ГСН создавалась ЛОМО, (главный конструктор ГСН — О. А. Артамонов).. "Игла" использует двухволновую инфракрасную систему наведения и имеет систему детонации магнитного взрывателя замедленного действия. Ракета также шла с аэросайком, чтобы уменьшить лобовое сопротивление и повысить производительность. Это оружие было свидетелем многих общих конфликтов на Ближнем Востоке, но также и югославских войн."
 PRC_manpads_4: "«Верба»"
 PRC_manpads_4_short: "«Верба»"
 PRC_manpads_4_desc: "Hоссийский переносной зенитный ракетный комплекс (ПЗРК), предназначенный для поражения низколетящих воздушных целей на встречных и догонных курсах в условиях воздействия ложных тепловых помех. С высокой вероятностью поражает малоизлучающие цели — крылатые ракеты и БПЛА"
  
 PRC_protection_equip_1: "Стальной нагрудник"
 PRC_protection_equip_1_short: "Стальной нагрудник"
 PRC_protection_equip_1_desc: "Стальной нагрудник - чрезвычайно ранняя модель защитного снаряжения пехоты, основанная на стальной кирасе и изготовленная во время Первой мировой войны. Сами нагрудные знаки были внедрены примерно в 1942 году, и результаты их использования во время боевых действий были неоднозначными. Сами нагрудники работали в тяжелых городских условиях пехоты, но были обременительны в полевых условиях."
 PRC_protection_equip_2: "СН+СШ-40"
 PRC_protection_equip_2_short: "СН+СШ-40"
 PRC_protection_equip_2_desc: "Бронежилет и шлемы СШ-40 были разработаны ближе к концу Второй мировой войны. Сами шлемы были более прочными, чем их предыдущие версии."
 PRC_protection_equip_3: "6Б5-15+СТШ-81"
 PRC_protection_equip_3_short: "6Б5-15+СТШ-81"
 PRC_protection_equip_3_desc: "Жилет 6Б5-15 был разработан Советским научно-исследовательским институтом "сталь" и выпускался в 1986-1998 годах. Сам жилет использовал кевларовые материалы для защиты пользователя и поставляется с серией многокамерных камуфляжей. Шлемы СТШ-81 - это титановые и стальные шлемы, также производимые компанией "сталь" для Советского Союза. Шлемы СТШ-81 демонстрировали значительную прочность в бою."
 PRC_protection_equip_4: "6Б7-1"
 PRC_protection_equip_4_short: "6Б7-1"
 PRC_protection_equip_4_desc: "Со временем баллистическая броня 6Б5-15 должна была бы иметь больше и улучшенные ремни безопасности и вспомогательные компоненты. "Сталь" намеревалась создать полный набор современных установок для большинства сред по всему миру, которые могли бы быть изготовлены по желанию Советского Союза. Шлемы 6Б7-1 были улучшенной версией шлемов СТШ-81 и действовали как преемники их прежней конструкции. Сталь делала их из более современных материалов, таких как улучшенная внутренняя стальная конструкция, которая могла более эффективно отражать силу, исходящую от пуль."
 PRC_protection_equip_5: "6Б45+6Б47"
 PRC_protection_equip_5_short: "6Б45+6Б47"
 PRC_protection_equip_5_desc: "Компания Techinkom разработала бронежилеты 6B5 и пехотное снаряжение в начале 2000-х годов для удовлетворения потребностей современного боя. Они стали более маневренными, прочными и эффективными, чем раньше. Они отличались современным амортизирующим покрытием, снабжались атмосферо-и влагостойкой подкладкой и могли легко дать любому солдату массивное преимущество в пехотном бою. Шлем 6B47 и его навесное оборудование обеспечивают большую защиту для своих владельцев, чем раньше, предлагая большую защиту."
  
  
  
  ##########ISR Tree 
 ISR_team_weapons_1: "M1919 Browning, M1 Mortar"
 ISR_team_weapons_1_short: "M1919 Browning, M1 Mortar"
 ISR_team_weapons_1_desc: "M1919 Browning - тяжелый пулемет, разработанный в 1919 году Джоном Браунингом. Это оружие стало культовым после его знаменитого использования во время Великой войны эму, но оно также использовалось и во время Второй мировой войны. Оружие использует .Снаряды калибра 30 и имели короткую отдачу боевого действия и имели эффективную дальность стрельбы 1500 ярдов. Его предшественник, M1917, был охлажден водой, но водяное охлаждение было удалено, чтобы облегчить оружие за счет времени стрельбы. Это оказалось опасным, так как при перегреве топливо могло нагреться и привести к выстрелам без предупреждения, что привело бы к неконтролируемому огню./nМ1 - вариант французского миномета Брандта, созданного США близко к их первоначальному присоединению к Второй мировой войне. Он стреляет из миномета калибра 81 мм на расстояние до 1,9 мили. Он широко использовался во время Второй мировой войны, а также использовался во Вьетнаме и Корее."
 ISR_team_weapons_2: "M2 Browning, M29 Mortar, M75"
 ISR_team_weapons_2_short: "M2 Browning, M29 Mortar, M75"
 ISR_team_weapons_2_desc: "M2 Browning - обычно монтируется на транспортные средства, но также может использоваться в качестве установочного пистолета. Он стреляет .50 калибров патронов и имеет гораздо большую огневую мощь, чем М1919. Он был разработан в 1919 году Джоном Браунингом и использовался на протяжении всей Второй мировой войны. Он похож по сложности и качеству на М1919, но тяжелее и несет более тяжелые боеприпасы./nМ29 - это американский миномет, построенный для замены миномета М1 в 1952 году специальной группой. Он может стрелять 4-12 выстрелов в минуту и гораздо легче и имеет большую дальность стрельбы. Кроме того, он хромирован для повышения надежности оружия и улучшения очистки./nM75 - тяжелый гранатомет, разработанный компанией Philco-Ford в 1961 году и использовавшийся во время Вьетнамской войны. Это автоматический и электрический двигатель, приводимый в движение с частотой вращения 225 в минуту до 2045 ярдов. Сама пусковая установка была очень быстро заменена из-за ряда проблем с надежностью, энергоэффективностью и весом."
 ISR_team_weapons_3: "Mk19"
 ISR_team_weapons_3_short: "Mk19"
 ISR_team_weapons_3_desc: "Тяжелый гранатомет ударного действия, используемый в огневых точках или на транспортных средствах. Он был разработан в 1966 году компанией NOSL и использовался во Вьетнаме, войне в Персидском заливе, Афганистане, Ираке и в мексиканских войнах с наркотиками. Первая модель HGL была крайне ненадежной и небезопасной, но более поздние модели оказались высокоэффективными и с большей вероятностью убивали противника, чем оператора. Оружие может стрелять 40-миллиметровыми снарядами в минуту на расстоянии до 1600 ярдов."
 ISR_team_weapons_4: "M85, M224 Mortar"
 ISR_team_weapons_4_short: "M85, M224 Mortar"
 ISR_team_weapons_4_desc: "М85 - пулемет, который был разработан в 80-х годах компанией General Electric для замены Браунинга М2. Он был использован в войне в Персидском заливе, но не видел много боевых действий за его пределами. Вес M2 Browning привел к тому, что в конечном итоге разработка M85 была поручена армии США. М85 гораздо более легкий и обладает селективной скорострельностью. Он также конфигурируется в том, какие части он может удерживать или в каком направлении он может подаваться, что добавляет ему универсальности./nМиномет М224 был разработан в 1978 году специальной группой специалистов. Миномет участвовал в боевых действиях в Персидском заливе, Ираке, Афганистане, а его прототипы использовались во Вьетнаме. Сам миномет был изготовлен из более легких и прочных деталей, чем М29, и его легче обслуживать в полевых условиях."
 ISR_team_weapons_5: "XM312, XM307"
 ISR_team_weapons_5_short: "XM312, XM307"
 ISR_team_weapons_5_desc: "XM312 HMG - производное от автопушки XM307.Патроны 50-го калибра. XM307 был разработан в конце 90-х годов, а XM312 вышел в 2000 году. Оба были созданы компанией General Dynamics и еще не видели боевых действий. Оба они могут быть быстро преобразованы друг в друга в полевых условиях, что позволяет подразделению переключиться на наличие HMGs или HGLs, как это необходимо для текущей ситуации. Они легки [для тяжелого оружия, устанавливаемого на боевое дежурство] и надежны, хотя и дороги."
  
 ISR_squad_weapons_1: "Browning 1918A2 BAR "
 ISR_squad_weapons_1_short: "Browning 1918A2"
 ISR_squad_weapons_1_desc: "Назван в честь человека, который спроектировал его в 1917 году для американских военных, дизайнера Джона Браунинга, а не за то, что происходит с брюками врага, когда они его видят. Само оружие-это поддерживающий огонь LMG, который использует замок с поднимающимся затвором и газовое действие. Он имеет эффективную дальность действия 1500 ярдов и исключительно легкий вес даже для LMG. Бар широко использовался во время Второй мировой войны, где он продемонстрировал заметные возможности."
 ISR_squad_weapons_2: "FN Mag"
 ISR_squad_weapons_2_short: "FN Mag"
 ISR_squad_weapons_2_desc: "Единый пулемёт калибра 7,62 мм, созданный Эрнестом Вервье, конструктором бельгийской фирмы Fabrique Nationale в начале 1950-х годов на основе автоматической винтовки Браунинг M1918, путём модификации её патронника под ленточную подачу патронов."
 ISR_squad_weapons_3: "M60"
 ISR_squad_weapons_3_short: "M60"
 ISR_squad_weapons_3_desc: "Ручной пулемёт, разработанный для армии США в 1957 году компанией Saco Defense. Он может стрелять шариковыми, трассирующими и бронебойными снарядами. Автомат использует короткий ход газового поршня и открытый затвор. Система подачи представляет собой дезинтегрирующую ленту и имеет эффективную дальность действия 1200 ярдов. Он очень недорог в использовании и до сих пор используется американской армией по сей день из-за его низкой стоимости и высокой жизнеспособности в бою. Однако он ненадежен в экстремальных условиях, особенно когда грязен. Кроме того, он исключительно тяжел для LMG, хотя и является одним из самых легких 7,62-мм орудий, которые существуют. Он видел боевые действия во Вьетнаме, Камбодже, войне в Персидском заливе, Ираке, Афганистане и против ИГИЛ."
 ISR_squad_weapons_4: "M249, M32"
 ISR_squad_weapons_4_short: "M249, M32"
 ISR_squad_weapons_4_desc: "M249 — ручной пулемёт, разработанный FN Herstal в 1976 году. Он значительно легче и надежнее, чем M60, но обладает меньшей общей огневой мощью. M249 использовался во всех крупных конфликтах с участием США после вторжения в Панаму. Из-за своего меньшего веса и более высокой надежности он функционирует лучше, чем M60 в неконтролируемой среде/nи работает лучше как оружие наступательного отряда. Фактически, M249 изначально был заказан для замены M60 в качестве более легкого оружия. /nM32 - американский вариант револьверного гранатомета отряда Milkor MGL. Milkor был разработан в 1980 году Андриесом Пиеком для Южной Африки и является заметным шагом в качестве отряда гранатомета M79. Корпус морской пехоты США принял его и внес небольшие изменения, чтобы создать вариант M32. Он может быть загружен для удержания до 6 выстрелов и быстрой стрельбы в течение 2 секунд. Это может значительно увеличить огневую мощь отряда с его взрывной способностью. Кроме того, пусковая установка была принята правоохранительными органами по всему миру для использования с несмертельными гранатами, такими как дым. Он был использован во время гражданской войны в Руанде и колумбийского конфликта."
 ISR_squad_weapons_5: "IMI Negev"
 ISR_squad_weapons_5_short: "IMI Negev"
 ISR_squad_weapons_5_desc: "Hучной пулемёт под патрон 5,56×45 мм, выпускаемый израильским концерном Israel Military Industries. Используется как стандартный ручной пулемёт в пехотных подразделениях ЦАХАЛа"
  
 ISR_specialist_1: "M1903 Springfield"
 ISR_specialist_1_short: "M1903 Springfield"
 ISR_specialist_1_desc: "Винтовка с затвором, которая использовалась снайперами во время Второй мировой войны. Он был разработан Спрингфилдским оружейным заводом в 1903 году и сразу же был использован. Спрингфилд-это винтовка с затвором на 5 патронов, которая стреляет .30-06 раундов до 1000 ярдов эффективно. Однако максимальная дальность стрельбы достигает 5500 ярдов. Было произведено более 3 миллионов таких винтовок, и снайперы часто использовали их во время Второй мировой войны."
 ISR_specialist_2: "M40"
 ISR_specialist_2_short: "M40"
 ISR_specialist_2_desc: "Снайперская винтовка с затвором, разработанная в 1966 году компанией Remington arms для USMC. Он стреляет стандартными патронами 7.62x51mm и имеет эффективную дальность стрельбы в 900 ярдов. Он использовался во Вьетнаме, войне в Персидском заливе, Афганистане, Ираке и Ливане. Модель M40 отличается заметной надежностью и относительно проста в обслуживании. Он был эффективен как противотанковая снайперская винтовка."
 ISR_specialist_3: "M21"
 ISR_specialist_3_short: "M21"
 ISR_specialist_3_desc: "Полуавтоматическая снайперская винтовка, которая использовалась США и любыми другими странами, которые были достаточно благословлены, чтобы иметь такое великолепное оружие. Разработанный в 69 году командованием вооружения морской пехоты после вдохновения непосредственно Богом, он может выносить окончательное суждение на эффективной дистанции в 900 ярдов и использует славные боеприпасы 7.62x51mm. Его можно кормить с магазином 5, 10 или 20 патронов в зависимости от ваших вкусов. Она проявила свою несравненную энергию и доблесть в войнах во Вьетнаме и Ираке и, вероятно, выиграла бы войну во Вьетнаме, если бы они послали туда больше людей. Неудивительно, что такое невероятное легендарное оружие до сих пор используется и надирает задницу сегодня."
 ISR_specialist_4: "Barrett M82, M24"
 ISR_specialist_4_short: "M82, M24"
 ISR_specialist_4_desc: "Barrett M82 - полуавтоматическая противотанковая снайперская винтовка bullpup, которая использует .Боеприпасы 50-го калибра. Он был разработан в 1980 году Ронни Барреттом во время войны в Афганистане и войны в Ираке. Он имеет эффективную дальность действия 2000 ярдов и может пробивать стены, любые виды бронежилетов и легкобронированную технику. М82 является культовым по своей эффективности и антиматериальным возможностям. Его лицензия очень востребована многими странами и принадлежит 54 странам, которые еще больше пытаются получить права на производство или приобрести оружие./nM24 - снайперская винтовка с затвором, используемая армией США. Он был разработан в 1988 году компанией Remington arms и заказан для замены M40 в качестве стандартной выпускаемой снайперской винтовки. Он имеет эффективную дальность стрельбы 875 ярдов и использует боеприпасы 7.62x51mm. Он видел боевые действия в войне в Персидском заливе, Афганистане, Ираке и Сирии. М24 поставляется со свободным съемным прицелом и прикрепляемым штативом."
 ISR_specialist_5: "M110"
 ISR_specialist_5_short: "M110"
 ISR_specialist_5_desc: "Полуавтоматическая снайперская винтовка. Разработана в 2007 году компанией Knight's Armament Company и была введена в эксплуатацию после того, как американские военные стали свидетелями воздействия снайперов USSOCOM и отчетов о последующих действиях снайперов SOF по всему Ираку. После конкурса, в котором участвовало много различных проектов, был выбран M110, и рыцари выиграли очень значительный контракт. С тех пор она использовалась в Афганистане и Ираке. Имеет эффективную дальность действия приблизительно 875 ярдов и может обеспечить беспокоящий огонь далеко за пределами этого."
  
 ISR_ammo_explosives_1: "Mk2 Grenade, ПЦО, M1 Chemical Mine"
 ISR_ammo_explosives_1_short: "Mk2 Grenade, ПЦО, M1 Chemical Mine"
 ISR_ammo_explosives_1_desc: "Mk2 Grenade - противопехотная ручная граната, используемая Соединенными Штатами во время Второй Мировой Войны и Первой мировой войны. Он был разработан в 1918 году большой специальной командой дизайнеров и использовался многими различными странами. Сама граната представляет собой простую хрупкую гранату, которая взрывается на синхронизированном взрывателе ~через 4 секунды после вытягивания Штыря. Во время Второй мировой войны был создан чрезмерный излишек, и как таковой, несмотря на то, что производство было минимальным, а в конечном итоге и вовсе отсутствовало, он непрерывно использовался в течение многих лет./nM1 Chemical Mine - это противопехотная мина, содержащая иприт, который выделяется при детонации. Он использовался во время Второй мировой войны и мог поддерживать отрицание зоны после детонации до тех пор, пока газ задерживался./nFMJ  - это пуля, изобретенная в 1882 году швейцарским полковником Эдуардом Рубином. Однако за время, прошедшее с тех пор до Второй мировой войны, в металлургии были сделаны некоторые усовершенствования, и поэтому вторая модель ПЦО включила более качественные материалы в уже существующую конструкцию."
 ISR_ammo_explosives_2: "M26, M18 Claymore"
 ISR_ammo_explosives_2_short: "M26, M18 Claymore "
 ISR_ammo_explosives_2_desc: "M26 - хрупкая ручная граната, разработанная большой специальной группой в 1950 году. Он поступил на вооружение и в то же время впервые увидел боевые действия в Корейской войне. Он отличался синхронизированным фрикционным взрывателем и большей взрывной способностью, чем граната Мк2. Кроме того, осколку способствует предварительно зазубренная катушка внутри гранаты, которая способствует фрагментации./nM18 Claymore - это направленная осколочная противопехотная мина, разработанная в 1956 году большой специальной группой во главе с Норманом Маклеодом. Применялась во Вьетнамской войн и Иракской войне. Она использует взрывной колпачок M4 в сборе для детонации и заполняется C4."
 ISR_ammo_explosives_3: "Higher Grain Ammo, M67 Grenade"
 ISR_ammo_explosives_3_short: "Higher Grain Ammo, M67 Grenade"
 ISR_ammo_explosives_3_desc: "Ручная граната М67 - противопехотная осколочная ручная граната, созданная для замены серии М26, которая использовалась во Вьетнаме и Корее. Он содержит пиротехническую задержку и обладает большей взрывной способностью, чем М26. Он также оснащен предохранительным зажимом, чтобы предотвратить случайное вытягивание штифта. Он использовался во всех войнах США, начиная с Вьетнама./nAP-снаряды существовали в течение многих лет, начиная с Первой мировой войны, и использовались в основном в проникающих боевых кораблях. Около Первой мировой войны, когда танк вышел на поле боя, были созданы миниатюрные снаряды. В конце концов, небольшие AP-снаряды были созданы как ответ на бронежилет. Современные боеприпасы АП в 1965 году были созданы как ответ на увеличение численности тяжелобронированной пехоты и пехотного прикрытия."
 ISR_ammo_explosives_4: "Utility Grenades, M93 AT Mine"
 ISR_ammo_explosives_4_short: "Utility Grenades, M93 AT Mines"
 ISR_ammo_explosives_4_desc: "Вспомогательные гранаты - это ручные гранаты, которые выполняют специальные функции, такие как светошумовые гранаты, дымовые шашки, зажигательные устройства и т. д. Они могут быть использованы для оглушения врагов, сокрытия позиций и запуска отрицания зоны соответственно./nМины М93 - это противотанковые мины, разработанные компанией Textron в 1987 году. Он способен атаковать цели на расстоянии до 100 метров от своей позиции. На минах M93 используют сейсмические и акустические датчики для отслеживания и идентификации близлежащих целей. Как только он обнаруживает цель, он поворачивается к ним лицом и стреляет своим суббоеприпасом, 450-граммовым танталовым снарядом."
 ISR_ammo_explosives_5: "Современные боеприпасы"
 ISR_ammo_explosives_5_short: "Современные боеприпасы"
 ISR_ammo_explosives_5_desc: "В современную эпоху существует огромный арсенал различных типов специализированных боеприпасов, которые можно использовать в конкретных ситуациях. Современные АП-снаряды намного лучше проникают в мишени, чем более старые АП-снаряды и могут достигать более высоких скоростей. Современные сплавы позволяют стандартным боеприпасам наносить больший урон цели. У хрупких пуль или зажигательных патронов есть особые ситуации, в которых они полезны. Кроме того, дробовики могут улучшить удобство использования в современном бою с HE патронами, боеприпасами, патронами с флетчетом или зажигательными выстрелами."
  
 ISR_manpats_1: "M1 Bazooka"
 ISR_manpats_1_short: "M1 Bazooka"
 ISR_manpats_1_desc: "Безоткатная противотанковая ракета, разработанная в 1942 году Эдвардом Улом. Было создано более 400000 единиц техники, которые широко использовались во время Второй мировой войны, в Корее и Вьетнаме. Базука М1 - одно из первых реактивных противотанковых орудий. Его можно было использовать против бункеров, бронетехники, пулеметных гнезд или танков. Некоторые экземпляры М1 были захвачены немецкими войсками быстро после развертывания, и они были реверсированы для создания Panzerschreck. М1 стоит очень мало, и было создано огромное количество избыточных боеприпасов, поэтому он использовался в будущих войнах и до сих пор используется малобюджетными армиями сегодня. При нынешних темпах использования это оружие, скорее всего, будет продолжать использоваться в боевых действиях малобюджетными армиями. Однако с учетом того, что глобальное развитие приводит к увеличению числа выделенных микрофонов и текущим конфликтам, которые его исчерпывают, он вряд ли увидит больше в течение длительного времени."
 ISR_manpats_2: "M20A1 SuperBazooka"
 ISR_manpats_2_short: "M20A1 SuperBazooka"
 ISR_manpats_2_desc: "Суммирование большого количества усовершенствований, сделанных в базуку Эдвардом Улом на протяжении всей войны вплоть до середины 50-х гг. Она отличалась облегченными слепками, вспомогательной огневой поддержкой, оптическим прицелом, увеличенной дальностью действия в результате улучшенного боеприпаса, улучшенным сцепным механизмом, магнитным спусковым механизмом, заменяющим зажигание батареи, металлической мебелью и может быть сломана для облегчения мобильности и обслуживания. Эти усовершенствования сделали его гораздо более мощным оружием, чем М1, которое можно было использовать против более сильных целей. Он был использован в Корейской войне и многих других конфликтах, помимо этого, другими странами."
 ISR_manpats_3: "M72 LAW"
 ISR_manpats_3_short: "M72 LAW"
 ISR_manpats_3_desc: "Легкая противотанковая неуправляемая ракетная установка с 1 выстрелом, разработанная "FA Spinale, CB Weeks and PV Choate" в 1963 году. Он был введен сразу же, чтобы заменить базуку в производстве и видел боевые действия в каждом американском конфликте с момента его создания. Само оружие очень легкое и позволяет обычной пехоте носить его и использовать там, где это необходимо. Он не поддается повторной загрузке, но весит всего 5,5 фунта, так что даже ваша бабушка могла бы им воспользоваться. Он имеет эффективную дальность действия 660 футов. Это оружие использовалось в Афганской войне, Ираке, Сомали, войне в Персидском заливе и Вьетнаме."
 ISR_manpats_4: "M202 FLASH"
 ISR_manpats_4_short: "M202 FLASH"
 ISR_manpats_4_desc: "Многозарядная зажигательная ракетная установка, разработанная в 1978 году большой специальной группой и использовавшаяся во время войны во Вьетнаме. Он может быть загружен 66-миллиметровыми зажигательными ракетами, которые используют TPA для воспламенения области после взрыва. Он может гореть гораздо горячее, чем напалм, и создает достаточно тепла и дыма, чтобы заставить низко летящие вертолеты избегать этого района. Он может быть использован в качестве противотанкового оружия из-за огромного тепла, которое он создает на большой площади, эффективно поджаривая экипаж машины. Кроме того, М202 может использовать 66-мм ракеты, если оператор нуждается в этом, чтобы использовать прямые ракеты, а не покрывать область огня. Было изготовленно несколько сотен опытных образцов были изготовлены и использованы во Вьетнаме."
 ISR_manpats_5: "M141/153 SMAW"
 ISR_manpats_5_short: "M141/153 SMAW"
 ISR_manpats_5_desc: "M153 SMAW - противотанковая противофортификационная ракетная установка, разработанная в 1984 году компанией McDonnell Douglas. Это оружие участвовало в боевых действиях в войне в Персидском заливе, Афганистане, Ираке и Йемене. М141-это одноразовое одноразовое противофортификационное оружие, предназначенное для разрушения бункеров, которое имеет эффективную дальность действия 1200 ярдов,но может быть использовано для поражения больших целей дальше. M153-это многоразовое оружие, которое стреляет HEAA или термобарическими снарядами. SMAW может разрушать здания и имеет очень большой радиус взрыва. Он, однако, испускает большое количество полутоксичного дыма, что делает его стрельбу из замкнутого пространства небезопасной без газовой защиты. Эта проблема не будет устранена до тех пор, пока не будет разработан SMAW II. Он видел боевые действия в войне в Персидском заливе, Афганистане и Ираке."
  
 ISR_hmg_1: "M45 Quadmount"
 ISR_hmg_1_short: "M45 Quadmount"
 ISR_hmg_1_desc: "Буксируемое зенитное орудие с исключительной скорострельностью из своих 4-х пулеметов Браунинг М2. Он оснащен электрическим приводом и имеет максимальную дальность действия в 1,6 мили. Он был разработан корпорацией WL Maxson в 1943 году и использовался во время Второй мировой войны, Корейской войны и в качестве огневой точки во Вьетнамской войне. Прозванный "мясорубкой", он мог использоваться горизонтально, чтобы выносить мягкие цели и самолеты взаимозаменяемо. М45 также устанавливался на прицепы или полуприцепы, чтобы использоваться в качестве дешевой пушки SP AA."
 ISR_manpads_1: "Redeye I"
 ISR_manpads_1_short: "Redeye I"
 ISR_manpads_1_desc: "ПЗРК, созданный в 1959 году компанией Convair для адаптации к современным боевым условиям, когда реактивные самолеты могут обогнать или обойти зенитные орудия. Он использует инфракрасное излучение, чтобы попасть в цель. В 1948 году армия США начала искать новые средства ПВО для замены неэффективных орудий. Было исследовано много различных концепций для быстро движущихся ракет, но в конечном счете ни одна из них не была точной. В середине 1950-х годов компания Convair начала изучать использование инфракрасного наведения для создания переносной зенитной ракетной системы. "Convair" начал рассматривать ранние ракеты класса "воздух-воздух" для создания своего оружия и сумел уменьшить его до меньшего уровня. "Redeye" использовался во Вьетнаме, Никарагуа и Афганистане."
 ISR_manpads_2: "Redeye II"
 ISR_manpads_2_short: "Redeye II"
 ISR_manpads_2_desc: "ПЗРК, который был разработан компанией General Dynamics в 1967 году. Он использует инфракрасную самонаводящуюся ракету класса "земля-воздух" для наведения на цель. Он отличался более высоким конечным компьютером и общими улучшениями деталей и общей конструкции, чтобы сделать его более надежным. Хотя Redeye II был улучшением по сравнению с Redeye I, он не был широко изготовлен и оставался прототипом, поскольку большинство его улучшений можно было просто добавить к Redeye I. Можно считать, что разработка Redeye II в этом контексте является усовершенствованием компьютера Redeye I и производством более совершенного оборудования."
 ISR_manpads_3: "Stinger A"
 ISR_manpads_3_short: "Stinger A"
 ISR_manpads_3_desc: "Конечный результат проекта Redeye II, который был завершен в 1980 году компанией General Dynamics. Stinger A имеет полный ремонт всей системы Redeye и поставляется с двойным инфракрасным и ультрафиолетовым искателем, чтобы лучше определить, что является контрмерой, а что-фактической целью. Боекомплект "Stinger A" содержит более мощную смесь, дающую ему больше мощности, чем его предшественнику, и может достигать большего радиуса действия. Она продемонстрировала значительную мощь в Фолклендской войне, Афганистане, Ирано-Иракской войне и многих других ближневосточных конфликтах."
 ISR_manpads_4: "Stinger C"
 ISR_manpads_4_short: "Stinger C"
 ISR_manpads_4_desc: "Усовершенствование, сделанное по сравнению с Stinger B, законченным примерно в 1990 году компанией General Dynamics. Stinger B отличался улучшенным искателем, который имеет функцию сканирования розеток. Однако "Стингер Б" выпускался едва ли в количестве всего 600 единиц. Стингер с добавил больше компьютерных компонентов, более совершенное программное обеспечение и адаптивную систему, которая может попытаться преодолеть помехи, регулируя свои модули, чтобы попытаться найти наиболее четкое визуальное изображение. Было создано более 20000 экземпляров, которые участвовали в боевых действиях в Афганистане и Ираке. Проект "Stinger" продолжает развиваться с добавлением новых, незначительных дополнений и созданием новых вариантов, обозначаемых как незначительные улучшения."
  
  ##########USA Tree 
 USA_team_weapons_1: "M1919 Browning, M1 Mortar"
 USA_team_weapons_1_short: "M1919 Browning, M1 Mortar"
 USA_team_weapons_1_desc: "M1919 Browning - тяжелый пулемет, разработанный в 1919 году Джоном Браунингом. Это оружие стало культовым после его знаменитого использования во время Великой войны эму, но оно также использовалось и во время Второй мировой войны. Оружие использует .Снаряды калибра 30 и имели короткую отдачу боевого действия и имели эффективную дальность стрельбы 1500 ярдов. Его предшественник, M1917, был охлажден водой, но водяное охлаждение было удалено, чтобы облегчить оружие за счет времени стрельбы. Это оказалось опасным, так как при перегреве топливо могло нагреться и привести к выстрелам без предупреждения, что привело бы к неконтролируемому огню./nМ1 - вариант французского миномета Брандта, созданного США близко к их первоначальному присоединению к Второй мировой войне. Он стреляет из миномета калибра 81 мм на расстояние до 1,9 мили. Он широко использовался во время Второй мировой войны, а также использовался во Вьетнаме и Корее."
 USA_team_weapons_2: "M2 Browning, M29 Mortar, M75"
 USA_team_weapons_2_short: "M2 Browning, M29 Mortar, M75"
 USA_team_weapons_2_desc: "M2 Browning - тобычно монтируется на транспортные средства, но также может использоваться в качестве установочного пистолета. Он стреляет .50 калибров патронов и имеет гораздо большую огневую мощь, чем М1919. Он был разработан в 1919 году Джоном Браунингом и использовался на протяжении всей Второй мировой войны. Он похож по сложности и качеству на М1919, но тяжелее и несет более тяжелые боеприпасы./nМ29 - это американский миномет, построенный для замены миномета М1 в 1952 году специальной группой. Он может стрелять 4-12 выстрелов в минуту и гораздо легче и имеет большую дальность стрельбы. Кроме того, он хромирован для повышения надежности оружия и улучшения очистки./nM75 - тяжелый гранатомет, разработанный компанией Philco-Ford в 1961 году и использовавшийся во время Вьетнамской войны. Это автоматический и электрический двигатель, приводимый в движение с частотой вращения 225 в минуту до 2045 ярдов. Сама пусковая установка была очень быстро заменена из-за ряда проблем с надежностью, энергоэффективностью и весом."
 USA_team_weapons_3: "Mk19"
 USA_team_weapons_3_short: "Mk19"
 USA_team_weapons_3_desc: "Тяжелый гранатомет ударного действия, используемый в огневых точках или на транспортных средствах. Он был разработан в 1966 году компанией NOSL и использовался во Вьетнаме, войне в Персидском заливе, Афганистане, Ираке и в мексиканских войнах с наркотиками. Первая модель HGL была крайне ненадежной и небезопасной, но более поздние модели оказались высокоэффективными и с большей вероятностью убивали противника, чем оператора. Оружие может стрелять 40-миллиметровыми снарядами в минуту на расстоянии до 1600 ярдов."
 USA_team_weapons_4: "M85, M224 Mortar"
 USA_team_weapons_4_short: "M85, M224 Mortar"
 USA_team_weapons_4_desc: "М85 - пулемет, который был разработан в 80-х годах компанией General Electric для замены Браунинга М2. Он был использован в войне в Персидском заливе, но не видел много боевых действий за его пределами. Вес M2 Browning привел к тому, что в конечном итоге разработка M85 была поручена армии США. М85 гораздо более легкий и обладает селективной скорострельностью. Он также конфигурируется в том, какие части он может удерживать или в каком направлении он может подаваться, что добавляет ему универсальности./nМиномет М224 был разработан в 1978 году специальной группой специалистов. Миномет участвовал в боевых действиях в Персидском заливе, Ираке, Афганистане, а его прототипы использовались во Вьетнаме. Сам миномет был изготовлен из более легких и прочных деталей, чем М29, и его легче обслуживать в полевых условиях."
 USA_team_weapons_5: "XM312, XM307"
 USA_team_weapons_5_short: "XM312, XM307"
 USA_team_weapons_5_desc: "XM312 HMG - производное от автопушки XM307.Патроны 50-го калибра. XM307 был разработан в конце 90-х годов, а XM312 вышел в 2000 году. Оба были созданы компанией General Dynamics и еще не видели боевых действий. Оба они могут быть быстро преобразованы друг в друга в полевых условиях, что позволяет подразделению переключиться на наличие HMGs или HGLs, как это необходимо для текущей ситуации. Они легки [для тяжелого оружия, устанавливаемого на боевое дежурство] и надежны, хотя и дороги."
  
 USA_squad_weapons_1: "Browning 1918A2 BAR "
 USA_squad_weapons_1_short: "Browning 1918A2"
 USA_squad_weapons_1_desc: "Назван в честь человека, который спроектировал его в 1917 году для американских военных, дизайнера Джона Браунинга, а не за то, что происходит с брюками врага, когда они его видят. Само оружие-это поддерживающий огонь LMG, который использует замок с поднимающимся затвором и газовое действие. Он имеет эффективную дальность действия 1500 ярдов и исключительно легкий вес даже для LMG. Бар широко использовался во время Второй мировой войны, где он продемонстрировал заметные возможности."
 USA_squad_weapons_2: "M79"
 USA_squad_weapons_2_short: "M79"
 USA_squad_weapons_2_desc: "Однозарядный гранатомет, разработанный в 1960 году Спрингфилдским оружейным заводом для армии США. Это однозарядный гранатомет, который стреляет 40-миллиметровой гранатой. Во время его использования во Вьетнамской войне он показал себя обладающим невероятной огневой мощью и стреляет дольше, чем винтовочные гранаты, но является более портативным, чем миномет, что позволяет ему помогать в боевых действиях пехоте и хорошо действовать против легких вражеских машин и врагов в укрытии."
 USA_squad_weapons_3: "M60"
 USA_squad_weapons_3_short: "M60"
 USA_squad_weapons_3_desc: "Ручной пулемёт, разработанный для армии США в 1957 году компанией Saco Defense. Он может стрелять шариковыми, трассирующими и бронебойными снарядами. Автомат использует короткий ход газового поршня и открытый затвор. Система подачи представляет собой дезинтегрирующую ленту и имеет эффективную дальность действия 1200 ярдов. Он очень недорог в использовании и до сих пор используется американской армией по сей день из-за его низкой стоимости и высокой жизнеспособности в бою. Однако он ненадежен в экстремальных условиях, особенно когда грязен. Кроме того, он исключительно тяжел для LMG, хотя и является одним из самых легких 7,62-мм орудий, которые существуют. Он видел боевые действия во Вьетнаме, Камбодже, войне в Персидском заливе, Ираке, Афганистане и против ИГИЛ."
 USA_squad_weapons_4: "M249, M32"
 USA_squad_weapons_4_short: "M249, M32"
 USA_squad_weapons_4_desc: "M249 — ручной пулемёт, разработанный FN Herstal в 1976 году. Он значительно легче и надежнее, чем M60, но обладает меньшей общей огневой мощью. M249 использовался во всех крупных конфликтах с участием США после вторжения в Панаму. Из-за своего меньшего веса и более высокой надежности он функционирует лучше, чем M60 в неконтролируемой среде/nи работает лучше как оружие наступательного отряда. Фактически, M249 изначально был заказан для замены M60 в качестве более легкого оружия. /nM32 - американский вариант револьверного гранатомета отряда Milkor MGL. Milkor был разработан в 1980 году Андриесом Пиеком для Южной Африки и является заметным шагом в качестве отряда гранатомета M79. Корпус морской пехоты США принял его и внес небольшие изменения, чтобы создать вариант M32. Он может быть загружен для удержания до 6 выстрелов и быстрой стрельбы в течение 2 секунд. Это может значительно увеличить огневую мощь отряда с его взрывной способностью. Кроме того, пусковая установка была принята правоохранительными органами по всему миру для использования с несмертельными гранатами, такими как дым. Он был использован во время гражданской войны в Руанде и колумбийского конфликта."
 USA_squad_weapons_5: "MK48, XM25"
 USA_squad_weapons_5_short: "MK48, XM25"
 USA_squad_weapons_5_desc: "Mark 48 — ручной пулемёт, разработанный в 2003 году компанией FN Herstal совместно с Командованием специальных операций США. Он чрезвычайно легок для LMG и широко использовался США в боевых действиях в Ираке и Афганистане. Само оружие очень легко разбирается и может быть сделано в полевых условиях для замены перегретых стволов. Его основное преимущество перед M249 - это его легкий вес и значительно более упрощенные детали, облегчающие техническое обслуживание и производство./nXM25 - современный гранатомет bullpup, разработанный в 2010 году компанией Heckler and Koch и использовавшийся во время войны в Афганистане. Он стреляет гранатами из магазина и способен иметь эффективную дальность стрельбы до 765 ярдов. Он имеет возможность взрыва в воздухе и программируемые боеприпасы. Он поставляется с системным компьютером и лазерным дальномером, чтобы помочь оператору. Первоначальные прототипы сильно пострадали от неисправностей, и бюджет проекта в конечном итоге был урезан. Несмотря на то, что он видел боевые действия в Афганистане и продемонстрировал свой потенциал, было решено, что проект не стоит того из-за плохого прогноза о том, сколько будет стоить этот проект."
  
 USA_specialist_1: "M1903 Springfield"
 USA_specialist_1_short: "M1903 Springfield"
 USA_specialist_1_desc: "Винтовка с затвором, которая использовалась снайперами во время Второй мировой войны. Он был разработан Спрингфилдским оружейным заводом в 1903 году и сразу же был использован. Спрингфилд-это винтовка с затвором на 5 патронов, которая стреляет .30-06 раундов до 1000 ярдов эффективно. Однако максимальная дальность стрельбы достигает 5500 ярдов. Было произведено более 3 миллионов таких винтовок, и снайперы часто использовали их во время Второй мировой войны."
 USA_specialist_2: "M40"
 USA_specialist_2_short: "M40"
 USA_specialist_2_desc: "Снайперская винтовка с затвором, разработанная в 1966 году компанией Remington arms для USMC. Он стреляет стандартными патронами 7.62x51mm и имеет эффективную дальность стрельбы в 900 ярдов. Он использовался во Вьетнаме, войне в Персидском заливе, Афганистане, Ираке и Ливане. Модель M40 отличается заметной надежностью и относительно проста в обслуживании. Он был эффективен как противотанковая снайперская винтовка."
 USA_specialist_3: "M21"
 USA_specialist_3_short: "M21"
 USA_specialist_3_desc: "Полуавтоматическая снайперская винтовка, которая использовалась США и любыми другими странами, которые были достаточно благословлены, чтобы иметь такое великолепное оружие. Разработанный в 69 году командованием вооружения морской пехоты после вдохновения непосредственно Богом, он может выносить окончательное суждение на эффективной дистанции в 900 ярдов и использует славные боеприпасы 7.62x51mm. Его можно кормить с магазином 5, 10 или 20 патронов в зависимости от ваших вкусов. Она проявила свою несравненную энергию и доблесть в войнах во Вьетнаме и Ираке и, вероятно, выиграла бы войну во Вьетнаме, если бы они послали туда больше людей. Неудивительно, что такое невероятное легендарное оружие до сих пор используется и надирает задницу сегодня."
 USA_specialist_4: "Barrett M82, M24"
 USA_specialist_4_short: "M82, M24"
 USA_specialist_4_desc: "Barrett M82 - полуавтоматическая противотанковая снайперская винтовка bullpup, которая использует .Боеприпасы 50-го калибра. Он был разработан в 1980 году Ронни Барреттом во время войны в Афганистане и войны в Ираке. Он имеет эффективную дальность действия 2000 ярдов и может пробивать стены, любые виды бронежилетов и легкобронированную технику. М82 является культовым по своей эффективности и антиматериальным возможностям. Его лицензия очень востребована многими странами и принадлежит 54 странам, которые еще больше пытаются получить права на производство или приобрести оружие./nM24 - снайперская винтовка с затвором, используемая армией США. Он был разработан в 1988 году компанией Remington arms и заказан для замены M40 в качестве стандартной выпускаемой снайперской винтовки. Он имеет эффективную дальность стрельбы 875 ярдов и использует боеприпасы 7.62x51mm. Он видел боевые действия в войне в Персидском заливе, Афганистане, Ираке и Сирии. М24 поставляется со свободным съемным прицелом и прикрепляемым штативом."
 USA_specialist_5: "M110"
 USA_specialist_5_short: "M110"
 USA_specialist_5_desc: "Полуавтоматическая снайперская винтовка. Разработана в 2007 году компанией Knight's Armament Company и была введена в эксплуатацию после того, как американские военные стали свидетелями воздействия снайперов USSOCOM и отчетов о последующих действиях снайперов SOF по всему Ираку. После конкурса, в котором участвовало много различных проектов, был выбран M110, и рыцари выиграли очень значительный контракт. С тех пор она использовалась в Афганистане и Ираке. Имеет эффективную дальность действия приблизительно 875 ярдов и может обеспечить беспокоящий огонь далеко за пределами этого."
  
 USA_ammo_explosives_1: "Mk2 Grenade, ПЦО, M1 Chemical Mine"
 USA_ammo_explosives_1_short: "Mk2 Grenade, ПЦО, M1 Chemical Mine"
 USA_ammo_explosives_1_desc: "Mk2 Grenade - противопехотная ручная граната, используемая Соединенными Штатами во время Второй Мировой Войны и Первой мировой войны. Он был разработан в 1918 году большой специальной командой дизайнеров и использовался многими различными странами. Сама граната представляет собой простую хрупкую гранату, которая взрывается на синхронизированном взрывателе ~через 4 секунды после вытягивания Штыря. Во время Второй мировой войны был создан чрезмерный излишек, и как таковой, несмотря на то, что производство было минимальным, а в конечном итоге и вовсе отсутствовало, он непрерывно использовался в течение многих лет./nM1 Chemical Mine - это противопехотная мина, содержащая иприт, который выделяется при детонации. Он использовался во время Второй мировой войны и мог поддерживать отрицание зоны после детонации до тех пор, пока газ задерживался./nFMJ  - это пуля, изобретенная в 1882 году швейцарским полковником Эдуардом Рубином. Однако за время, прошедшее с тех пор до Второй мировой войны, в металлургии были сделаны некоторые усовершенствования, и поэтому вторая модель ПЦО включила более качественные материалы в уже существующую конструкцию."
 USA_ammo_explosives_2: "M26, M18 Claymore"
 USA_ammo_explosives_2_short: "M26, M18 Claymore "
 USA_ammo_explosives_2_desc: "M26 - хрупкая ручная граната, разработанная большой специальной группой в 1950 году. Он поступил на вооружение и в то же время впервые увидел боевые действия в Корейской войне. Он отличался синхронизированным фрикционным взрывателем и большей взрывной способностью, чем граната Мк2. Кроме того, осколку способствует предварительно зазубренная катушка внутри гранаты, которая способствует фрагментации./nM18 Claymore - это направленная осколочная противопехотная мина, разработанная в 1956 году большой специальной группой во главе с Норманом Маклеодом. Применялась во Вьетнамской войн и Иракской войне. Она использует взрывной колпачок M4 в сборе для детонации и заполняется C4."
 USA_ammo_explosives_3: "Higher Grain Ammo, M67 Grenade"
 USA_ammo_explosives_3_short: "Higher Grain Ammo, M67 Grenade"
 USA_ammo_explosives_3_desc: "Ручная граната М67 - противопехотная осколочная ручная граната, созданная для замены серии М26, которая использовалась во Вьетнаме и Корее. Он содержит пиротехническую задержку и обладает большей взрывной способностью, чем М26. Он также оснащен предохранительным зажимом, чтобы предотвратить случайное вытягивание штифта. Он использовался во всех войнах США, начиная с Вьетнама./nAP-снаряды существовали в течение многих лет, начиная с Первой мировой войны, и использовались в основном в проникающих боевых кораблях. Около Первой мировой войны, когда танк вышел на поле боя, были созданы миниатюрные снаряды. В конце концов, небольшие AP-снаряды были созданы как ответ на бронежилет. Современные боеприпасы АП в 1965 году были созданы как ответ на увеличение численности тяжелобронированной пехоты и пехотного прикрытия."
 USA_ammo_explosives_4: "Utility Grenades, M93 AT Mine"
 USA_ammo_explosives_4_short: "Utility Grenades, M93 AT Mines"
 USA_ammo_explosives_4_desc: "Вспомогательные гранаты - это ручные гранаты, которые выполняют специальные функции, такие как светошумовые гранаты, дымовые шашки, зажигательные устройства и т. д. Они могут быть использованы для оглушения врагов, сокрытия позиций и запуска отрицания зоны соответственно./nМины М93 - это противотанковые мины, разработанные компанией Textron в 1987 году. Он способен атаковать цели на расстоянии до 100 метров от своей позиции. На минах M93 используют сейсмические и акустические датчики для отслеживания и идентификации близлежащих целей. Как только он обнаруживает цель, он поворачивается к ним лицом и стреляет своим суббоеприпасом, 450-граммовым танталовым снарядом."
 USA_ammo_explosives_5: "Современные боеприпасы"
 USA_ammo_explosives_5_short: "Современные боеприпасы"
 USA_ammo_explosives_5_desc: "В современную эпоху существует огромный арсенал различных типов специализированных боеприпасов, которые можно использовать в конкретных ситуациях. Современные АП-снаряды намного лучше проникают в мишени, чем более старые АП-снаряды и могут достигать более высоких скоростей. Современные сплавы позволяют стандартным боеприпасам наносить больший урон цели. У хрупких пуль или зажигательных патронов есть особые ситуации, в которых они полезны. Кроме того, дробовики могут улучшить удобство использования в современном бою с HE патронами, боеприпасами, патронами с флетчетом или зажигательными выстрелами."
  
 USA_manpats_1: "M1 Bazooka"
 USA_manpats_1_short: "M1 Bazooka"
 USA_manpats_1_desc: "Безоткатная противотанковая ракета, разработанная в 1942 году Эдвардом Улом. Было создано более 400000 единиц техники, которые широко использовались во время Второй мировой войны, в Корее и Вьетнаме. Базука М1 - одно из первых реактивных противотанковых орудий. Его можно было использовать против бункеров, бронетехники, пулеметных гнезд или танков. Некоторые экземпляры М1 были захвачены немецкими войсками быстро после развертывания, и они были реверсированы для создания Panzerschreck. М1 стоит очень мало, и было создано огромное количество избыточных боеприпасов, поэтому он использовался в будущих войнах и до сих пор используется малобюджетными армиями сегодня. При нынешних темпах использования это оружие, скорее всего, будет продолжать использоваться в боевых действиях малобюджетными армиями. Однако с учетом того, что глобальное развитие приводит к увеличению числа выделенных микрофонов и текущим конфликтам, которые его исчерпывают, он вряд ли увидит больше в течение длительного времени."
 USA_manpats_2: "M20A1 SuperBazooka"
 USA_manpats_2_short: "M20A1 SuperBazooka"
 USA_manpats_2_desc: "M20A1 SuperBazooka - суммирование большого количества усовершенствований, сделанных в базуку Эдвардом Улом на протяжении всей войны вплоть до середины 50-х гг. Она отличалась облегченными слепками, вспомогательной огневой поддержкой, оптическим прицелом, увеличенной дальностью действия в результате улучшенного боеприпаса, улучшенным сцепным механизмом, магнитным спусковым механизмом, заменяющим зажигание батареи, металлической мебелью и может быть сломана для облегчения мобильности и обслуживания. Эти усовершенствования сделали его гораздо более мощным оружием, чем М1, которое можно было использовать против более сильных целей. Он был использован в Корейской войне и многих других конфликтах, помимо этого, другими странами."
 USA_manpats_3: "M72 LAW"
 USA_manpats_3_short: "M72 LAW"
 USA_manpats_3_desc: "Легкая противотанковая неуправляемая ракетная установка с 1 выстрелом, разработанная "FA Spinale, CB Weeks and PV Choate" в 1963 году. Он был введен сразу же, чтобы заменить базуку в производстве и видел боевые действия в каждом американском конфликте с момента его создания. Само оружие очень легкое и позволяет обычной пехоте носить его и использовать там, где это необходимо. Он не поддается повторной загрузке, но весит всего 5,5 фунта, так что даже ваша бабушка могла бы им воспользоваться. Он имеет эффективную дальность действия 660 футов. Это оружие использовалось в Афганской войне, Ираке, Сомали, войне в Персидском заливе и Вьетнаме."
 USA_manpats_4: "M202 FLASH"
 USA_manpats_4_short: "M202 FLASH"
 USA_manpats_4_desc: "Многозарядная зажигательная ракетная установка, разработанная в 1978 году большой специальной группой и использовавшаяся во время войны во Вьетнаме. Он может быть загружен 66-миллиметровыми зажигательными ракетами, которые используют TPA для воспламенения области после взрыва. Он может гореть гораздо горячее, чем напалм, и создает достаточно тепла и дыма, чтобы заставить низко летящие вертолеты избегать этого района. Он может быть использован в качестве противотанкового оружия из-за огромного тепла, которое он создает на большой площади, эффективно поджаривая экипаж машины. Кроме того, М202 может использовать 66-мм ракеты, если оператор нуждается в этом, чтобы использовать прямые ракеты, а не покрывать область огня. Было изготовленно несколько сотен опытных образцов были изготовлены и использованы во Вьетнаме."
 USA_manpats_5: "M141/153 SMAW"
 USA_manpats_5_short: "M141/153 SMAW"
 USA_manpats_5_desc: "M153 SMAW - противотанковая противофортификационная ракетная установка, разработанная в 1984 году компанией McDonnell Douglas. Это оружие участвовало в боевых действиях в войне в Персидском заливе, Афганистане, Ираке и Йемене. М141-это одноразовое одноразовое противофортификационное оружие, предназначенное для разрушения бункеров, которое имеет эффективную дальность действия 1200 ярдов,но может быть использовано для поражения больших целей дальше. M153-это многоразовое оружие, которое стреляет HEAA или термобарическими снарядами. SMAW может разрушать здания и имеет очень большой радиус взрыва. Он, однако, испускает большое количество полутоксичного дыма, что делает его стрельбу из замкнутого пространства небезопасной без газовой защиты. Эта проблема не будет устранена до тех пор, пока не будет разработан SMAW II. Он видел боевые действия в войне в Персидском заливе, Афганистане и Ираке."
  
 USA_hmg_1: "M45 Quadmount"
 USA_hmg_1_short: "M45 Quadmount"
 USA_hmg_1_desc: "Буксируемое зенитное орудие с исключительной скорострельностью из своих 4-х пулеметов Браунинг М2. Он оснащен электрическим приводом и имеет максимальную дальность действия в 1,6 мили. Он был разработан корпорацией WL Maxson в 1943 году и использовался во время Второй мировой войны, Корейской войны и в качестве огневой точки во Вьетнамской войне. Прозванный "мясорубкой", он мог использоваться горизонтально, чтобы выносить мягкие цели и самолеты взаимозаменяемо. М45 также устанавливался на прицепы или полуприцепы, чтобы использоваться в качестве дешевой пушки SP AA."
 USA_manpads_1: "Redeye I"
 USA_manpads_1_short: "Redeye I"
 USA_manpads_1_desc: "ПЗРК, созданный в 1959 году компанией Convair для адаптации к современным боевым условиям, когда реактивные самолеты могут обогнать или обойти зенитные орудия. Он использует инфракрасное излучение, чтобы попасть в цель. В 1948 году армия США начала искать новые средства ПВО для замены неэффективных орудий. Было исследовано много различных концепций для быстро движущихся ракет, но в конечном счете ни одна из них не была точной. В середине 1950-х годов компания Convair начала изучать использование инфракрасного наведения для создания переносной зенитной ракетной системы. "Convair" начал рассматривать ранние ракеты класса "воздух-воздух" для создания своего оружия и сумел уменьшить его до меньшего уровня. "Redeye" использовался во Вьетнаме, Никарагуа и Афганистане."
 USA_manpads_2: "Redeye II"
 USA_manpads_2_short: "Redeye II"
 USA_manpads_2_desc: "ПЗРК, который был разработан компанией General Dynamics в 1967 году. Он использует инфракрасную самонаводящуюся ракету класса "земля-воздух" для наведения на цель. Он отличался более высоким конечным компьютером и общими улучшениями деталей и общей конструкции, чтобы сделать его более надежным. Хотя Redeye II был улучшением по сравнению с Redeye I, он не был широко изготовлен и оставался прототипом, поскольку большинство его улучшений можно было просто добавить к Redeye I. Можно считать, что разработка Redeye II в этом контексте является усовершенствованием компьютера Redeye I и производством более совершенного оборудования."
 USA_manpads_3: "Stinger A"
 USA_manpads_3_short: "Stinger A"
 USA_manpads_3_desc: "Конечный результат проекта Redeye II, который был завершен в 1980 году компанией General Dynamics. Stinger A имеет полный ремонт всей системы Redeye и поставляется с двойным инфракрасным и ультрафиолетовым искателем, чтобы лучше определить, что является контрмерой, а что-фактической целью. Боекомплект "Stinger A" содержит более мощную смесь, дающую ему больше мощности, чем его предшественнику, и может достигать большего радиуса действия. Она продемонстрировала значительную мощь в Фолклендской войне, Афганистане, Ирано-Иракской войне и многих других ближневосточных конфликтах."
 USA_manpads_4: "Stinger C"
 USA_manpads_4_short: "Stinger C"
 USA_manpads_4_desc: "Усовершенствование, сделанное по сравнению с Stinger B, законченным примерно в 1990 году компанией General Dynamics. Stinger B отличался улучшенным искателем, который имеет функцию сканирования розеток. Однако "Стингер Б" выпускался едва ли в количестве всего 600 единиц. Стингер с добавил больше компьютерных компонентов, более совершенное программное обеспечение и адаптивную систему, которая может попытаться преодолеть помехи, регулируя свои модули, чтобы попытаться найти наиболее четкое визуальное изображение. Было создано более 20000 экземпляров, которые участвовали в боевых действиях в Афганистане и Ираке. Проект "Stinger" продолжает развиваться с добавлением новых, незначительных дополнений и созданием новых вариантов, обозначаемых как незначительные улучшения."
  
 USA_protection_equip_1: "M12 + M1"
 USA_protection_equip_1_short: "M12 + M1"
 USA_protection_equip_1_desc: "Во время Второй мировой войны бронежилет М12 использовался Соединенными Штатами в качестве защитного элемента брони, который мог поглощать зенитные и малокалиберные снаряды. Однако он был очень громоздким, поэтому большую часть времени единственной формой солдата была хлопчатобумажная оливково-серая униформа. Несмотря на это, М12 хорошо работал в защите солдат от шрапнели, предполагая, что шрапнель не попадала в огромное пространство, где не было бронежилета.шлем М1 был разработан в 1941 году майором Сиденхэмом из армии США. Он был очень эффективен в отражении выстрелов, которые были направлены вектором, но не в лоб. Он широко использовался во время Второй мировой войны и стал культовым."
 USA_protection_equip_2: "M1952A + M1A"
 USA_protection_equip_2_short: "M1952A + M1A"
 USA_protection_equip_2_desc: "M1952A - бронежилет, который использовался США во Вьетнамской войне и был разработан в 1952 году. Он обеспечивал номинальную защиту от малокалиберного оружия и зенитных ракет. Жилет номинально легкий и имеет встроенные карманы для переноски боеприпасов. Он также был разработан, с ограниченным успехом, чтобы изолировать от тепла.М1952А будет заменен на М1965А, когда кевлар будет изобретен почти сразу же. M1A-это усовершенствование по сравнению с шлемом M1 с незначительными изменениями внутренней части шлема, так что он легче ложится на голову."
 USA_protection_equip_3: "PASGT"
 USA_protection_equip_3_short: "PASGT"
 USA_protection_equip_3_desc: "PASGT - обозначение для набора брони, разработанного для пехоты США в 1975 году Центром солдатских систем армии США. Он гораздо лучше защищает пехоту, чем М1965А, которую он заменил. Включив в себя несколько слоев нейлона, шлем и жилет PASGAT будут полностью приняты к 1983 году. Однако, несмотря на лучшую защиту, PASGAT был чрезвычайно тяжелым, громоздким и очень неудобным в экстремальных температурах."
 USA_protection_equip_4: "Interceptor"
 USA_protection_equip_4_short: "Interceptor"
 USA_protection_equip_4_desc: "Interceptor - обозначение для современного защитного снаряжения военного назначения США. Он был разработан в DARPA в 1998 году и стремился обеспечить защиту, которая не была предоставлена пехоте с тех пор, как броня впервые устарела. Хотя он далеко не так эффективен против огнестрельного оружия, как пластинчатая броня против мечей. Перехватчик бронежилет состоит из ОТВ, в кедах, и Мич. ОТВ-это жилет, который защищает шею, горло, бицепсы и пах. Вспомогательные устройства могут быть удалены из защиты туловища. ОТВ содержит баллистические пластины и современные нейлоновые соединения, которые могут защитить солдат больше, чем любая броня до этого. Система также поставляется с возможностью защиты солдата с помощью тонкого Сплющивающегося жилета-носителя груза, чтобы облегчить переноску снаряжения. DAPS-это вспомогательные защитные рукава, предназначенные для защиты ног и рук. MICH-это легкий кевларовый шлем, который поставляется со вспомогательными портами для хранения различных предметов оборудования, таких как бинокль."
 USA_protection_equip_5: "ICTV + SFICTV"
 USA_protection_equip_5_short: "ICTV + SFICTV"
 USA_protection_equip_5_desc: "ICTV + SFICTV - теоретические комплекты средств индивидуальной защиты, предназначенные для замены перехватчика. В настоящее время большинство произведений находятся в стадии разработки или в концептуальной фазе. ICTV и SFICTV начали разработку в начале 2000-х годов различными производителями, причем только IOTV был разработан к 2007 году, а серия шлемов в настоящее время находится в стадии разработки или концептуальной разработки. ICTV будет включать в себя полный комплект бронежилетов, защищающих практически весь корпус с зазорами, защищенными блокирующими слоями волокон и легкими металлическими пластинами. Шлем поставляется с защитой ушей и глаз со вспомогательной опорой для защитного пуленепробиваемого штурмового противогаза и опорой для бинокля. Вариант SF гораздо легче, так как большая часть покрытия откинута назад или сегментирована, чтобы облегчить движение. Когда он будет разработан, он обеспечит полную защиту."
  ###USA END 
  
  ###SOV Tree 
 SOV_team_weapons_1: "СГ-43, М-30 обр.1938"
 SOV_team_weapons_1_short: "СГ-43, М-30 обр.1938"
 SOV_team_weapons_1_desc: "СГ-43 - средний пулемет, разработанный П. М. Горюновым для замены устаревшего, по стандартам Второй мировой войны, PM M1910 MG использовался Советским Союзом на протяжении большей части войны. SG-43 использовал наклоняющийся затвор и шел с устройством на дне, которое позволяло монтировать его на штативах, колесных опорах или на транспортных средствах в качестве вспомогательного оружия. Ствол с воздушным охлаждением и очень плотный, что затрудняет охлаждение при большинстве температур, но поставляется с хромированным отверстием, которое может выдержать их. Это делает его ненадежным при более высоких температурах. Он увидел широкое применение примерно в конце Второй мировой войны. Он был лицензирован в огромном количестве стран, в результате чего он видел боевые действия в корейской и Вьетнамской войнах. Хотя само оружие также имеет опыт участия во многих, многих гражданских войнах.\nМ-30 обр.1938 - 120-мм советский миномет, широко используемый Советской Армией во время Второй мировой войны. Его конструкция является почти копией французского mortier Brandt de 120 мм. сам миномет очень легко поддается гибке и развертке и может быстро перемещаться, чтобы избежать встречного огня. Он использует очень тяжелые 120-мм снаряды и имел высокую скорострельность, что делает его сильным оружием для поражения вражеских лагерей или пехоты в тяжелых укрытиях, таких как здания."
 SOV_team_weapons_2: "ПМ-43 120-мм, КПВ"
 SOV_team_weapons_2_short: "ПМ-43 120-мм, КПВ"
 SOV_team_weapons_2_desc: "КПВ - тяжелый пулемет, разработанный для советских войск в 1944 году Семеном Владимировым. Он не был введен в производство или эксплуатацию до 1949 года. Само орудие было в конце концов снято с пехотной службы в середине 1960-х годов из-за его огромного веса и заменено альтернативным HMG. Он печально известен своей исключительной 3000-метровой горизонтальной дальностью и 2000-метровой воздушной дальностью. Его тяжелый Калибр мог также сделать его полезным легким противотанковым оружием и размещался на разведывательных машинах и БТР. Он видел применение во время Корейской и Вьетнамской войн, и его сдача в аренду привела к тому, что это оружие стало боевым во многих различных войнах. Даже сегодня само оружие еще не было выведено из эксплуатации и пережило современные конфликты, такие как войны в Персидском заливе и Ираке.\nПМ-43 120-мм представлял собой 120-мм дульный заряженный казенный советский миномет, разработанный в 1943 году и представлявший собой модифицированную версию М1938. Его конструкция была сильно упрощена, а вес и стоимость значительно снижены. Он был использован в конце Второй мировой войны и видел советское использование в афганских войнах, а также во Вьетнаме и войне в Персидском заливе."
 SOV_team_weapons_3: "НСВ «Утёс», АГС-17 «Пламя»"
 SOV_team_weapons_3_short: "НСВ «Утёс», АГС-17 «Пламя»"
 SOV_team_weapons_3_desc: "НСВ - тяжелый пулемет, разработанный Никитиным, Соколовым и Волковым в 1971 году. Хотя он имеет меньшую дальность стрельбы, чем КПВ, сама пушка имеет несколько преимуществ, включая гораздо меньший вес, что позволяет ей продолжать использоваться в качестве пехотного ГМГ и более высокий уровень универсальности. Было также известно, что он более надежен и дешевле в производстве, что позволяет в целом улучшить его как пехотный ГМГ. Он участвовал в боевых действиях в Афганской и Вьетнамской войнах, а также в войнах в Ираке и Гражданской войне в Сирии.\nАГС-17 - тяжелый автоматический гранатомет, разработанный компанией KBP в 1967 году. Он предназначен для работы с транспортного средства или укрепленной позиции. Стандартный барабан может содержать до 29 гранат и может выстрелить всеми из них за 10 секунд. Он широко использовался Советским Союзом и продемонстрировал значительную надежность в Афганистане."
 SOV_team_weapons_4: "НСВТ, 2Б14 «Поднос»"
 SOV_team_weapons_4_short: "НСВТ, 2Б14 «Поднос»"
 SOV_team_weapons_4_desc: "НСВТ - усовершенствованный вариант НСВ, который был усовершенствован его первоначальными конструкторами через некоторое время после того, как было выпущено первоначальное оружие. NSVT отличался улучшениями, такими как более легкий вес из упрощенных деталей и более модернизированных материалов, чтобы позволить оружию выдерживать огонь дольше. Примерно в это же время были разработаны различные приложения для ГМГ. НСВТ хорошо известен тем, что монтируется на советских МБТ, таких как 64, 72 и 80.\n2Б14 - современный легкий миномет непрямого огня, разработанный в 1983 году нижегородским машиностроительным заводом для применения в Воздушно-десантных и легких пехотных войсках. Орудие стреляет из 82-мм современного миномета и имеет скорострельность около 24 выстрелов в минуту. Его высокая скорострельность и эффективная логистическая конструкция сделали его отличным оружием для Советов и видели применение далеко за пределами его целевого назначения, включая мотострелковые подразделения. Его успех был замечен в основном во время Афганской войны."
 SOV_team_weapons_5: "КОРД-6П50, АГС-30"
 SOV_team_weapons_5_short: "КОРД-6П50, АГС-30"
 SOV_team_weapons_5_desc: "Корд 6П50 - российский ГМГ, разработанный Намитулиным, Обидиным, Богдановым и Жирохиным. Оружие имеет обширные изменения по сравнению с прежним НСВТ, включая вращающийся затвор, заменяющий поворотный затвор казенной части, улучшенную газовую систему и переработанную дульную перегородку. Пистолет имеет гораздо меньшую отдачу, что дает ему более высокую точность и более длительное время стрельбы, что делает его лучше для подавления огня и дальней огневой поддержки. Он также значительно легче и производит больший объем огня. Она участвовала в большом разнообразии современных российских и российско-грузинских конфликтов, включая Русско-грузинскую войну и гражданскую войну в Сирии. Есть также сообщения, что он был замечен в войнах Ирака и Афганистана с США, хотя и редко.\nАСГ-30 - тяжелый гранатомет, разработанный в 1990 году бюро КБП для Советского Союза, но принятый на вооружение только после роспуска в 1995 году Российской Федерацией. Он стреляет со скоростью 400 выстрелов в минуту и оснащен обратным действием. Его конструкция в значительной степени основана на АГС-17 и значительно легче, мобильнее, имеет больший радиус действия и более точна. Пусковая установка приобрела заметный престиж в своей способности уничтожать укрепленных врагов. Его способность была доказана во время Второй чеченской войны, где он оказался очень мощным оружием."
  
 SOV_squad_weapons_1: "ДП"
 SOV_squad_weapons_1_short: "ДП"
 SOV_squad_weapons_1_desc: "Ручной пулемёт, разработанная Василием Дегтяревым в 1927 году для Советского Союза. Сама пушка использует те же боеприпасы, что и Мосин-Наган, и представляет собой полностью автоматическую газовую ЛМГ с закрылком кьельмана-Фриберга. Он включает в себя съемный ствол со встроенным глушителем вспышки и магазин поддона. Это было легко для массового производства из-за его простых и немногих частей. Он хорошо известен своим легким весом и универсальностью. Он устанавливался на советских танках, самолетах и использовался пехотой. Он широко использовался во время Второй мировой войны."
 SOV_squad_weapons_2: "РП-46"
 SOV_squad_weapons_2_short: "РП-46"
 SOV_squad_weapons_2_desc: "Советский ручной пулемёт, созданный в 1946 году конструкторами А. И. Шилиным, П. П. Поляковым и А. А. Дубининым на основе более раннего пулемёта Дегтярёва"
 SOV_squad_weapons_3: "РПК"
 SOV_squad_weapons_3_short: "РПК"
 SOV_squad_weapons_3_desc: "Ручной пулемёт, разработанная Михаилом Калашниковым в 1961 году и почти сразу же поступившая на вооружение Советского Союза. РПК использует много тех же функций и механизмов, что и АК-47, в том числе использует ту же форму боеприпасов, что позволяет более упорядочить логистическую и производственную систему. РПК имеет тяжелый, длинный ствол и усиленную ствольную коробку для повышения дальности стрельбы, точности и устойчивой огневой мощи. Хромированный ствол был постоянно закреплен, предотвращая полевое обслуживание, однако, и хотя был более надежен в бою, требовал специального оборудования для очистки и обслуживания. РПК будет видеть боевые действия в Китайско-Советском пограничном конфликте в 1969 году, используемые Советским Союзом. Кроме того, он широко использовался во время вторжения Варшавского договора в Чехословакию в 1968 году."
 SOV_squad_weapons_4: "РПК-74, ГП-25 «Костёр»"
 SOV_squad_weapons_4_short: "РПК-74, ГП-25 «Костёр»"
 SOV_squad_weapons_4_desc: "РПК-74 - усовершенствованная версия РПК, разработанная в 1974 году Михаилом Калашниковым и принятая на вооружение практически сразу. РПК-74 использует меньшие боеприпасы, также используемые АК-74. Он использует более длинный, хромированный ствол и усовершенствованный газовый блок с газовым каналом под углом 90 градусов от оси канала ствола с кольцом для чистящего стержня. Он также поставляется с усиленной задней цапфой приклада и усиленным магазином хорошо. Сама пушка стреляет быстрее с гораздо большей начальной скоростью, чем ее предшественница, которую она широко использовала во время войны в Донбассе и афганского конфликта.\nГП-25 - советский гранатомет, который может быть установлен на нижней части ствола автомата Калашникова. Он был разработан ЦКИБ СУ в 1978 году и сразу же принят на вооружение. Он стреляет из 40-миллиметровой гранаты без гильзы и чрезвычайно надежен. Во время войны в Афганистане гранатомет продемонстрировал исключительные боевые возможности."
 SOV_squad_weapons_5: "ПКП «Печенег»"
 SOV_squad_weapons_5_short: "ПКП «Печенег»"
 SOV_squad_weapons_5_desc: "Современный пулемет общего назначения, разработанный Цнииточмашем в России в 2001 году. Он гораздо более точен, чем все предыдущие модели, а также патронник большего калибра боеприпасов, используемых в АК-47. Он имеет более тяжелый, несъемный ствол принудительного воздушного охлаждения и радиальные ребра, которые предотвращают тепловое марево и сохраняют ствол прохладным во время длительного огня. Он также оснащен современными материалами и сплавами, включенными в его конструкцию, что позволяет ему быть более прочным и удерживать больший уровень огневой мощи по сравнению с предыдущими конструкциями. Она широко использовалась во всем мире во время Гражданской войны в Сирии, грузинской войны, Второй чеченской войны, вторжения в Крым и так далее."
  
 SOV_specialist_1: "СВТ-40"
 SOV_specialist_1_short: "СВТ-40"
 SOV_specialist_1_desc: "Полуавтоматическая газовая винтовка с магазинной подачей. СВТ-40-боевая винтовка, разработанная для Советского Союза в 1940 году Сергеем Симоновым. Он был отдан специально назначенным стрелкам и снайперам, хотя стандартный выпуск Мосина-Нагана также использовался для дальнего боя некоторыми снайперами. Он широко использовался во время Второй мировой войны и с тех пор участвовал во многих различных коммунистических мятежах, поскольку был арендован повстанцами Советским Союзом."
 SOV_specialist_2: "Снайперская винтовка Драгунова"
 SOV_specialist_2_short: "Драгунов"
 SOV_specialist_2_desc: "Самозарядная снайперская винтовка под патрон 7.62x54R. Драгунов был разработан в 1963 году Евгением Драгуновым. Само оружие известно своей высокой точностью и исключительной надежностью и используется армиями всего мира даже по сей день. Недорогие боеприпасы, простота обслуживания и высокая надежность обеспечили то, что это оружие оставалось на вооружении даже в некоторых из самых бедных армий мира и все еще умудрялось складываться в современных боевых условиях. Он видел неисчислимое количество сражений в более чем 40 войнах по всему миру."
 SOV_specialist_3: "Винторез"
 SOV_specialist_3_short: "ВСС"
 SOV_specialist_3_desc: "Специализированная снайперская винтовка, разработанная в 1980 году Сердюковым и Красниковым. Снайперская винтовка VSS имеет встроенный подавленный ствол и использует дозвуковые или АП боеприпасы. Сама винтовка используется в основном подразделениями спецназа, такими как спецназ, для ее скрытного использования и встроенной системы подавления звука и вспышки. Он видел боевые действия в Афганской войне, хотя и очень редко за ее пределами."
 SOV_specialist_4: "СВУ-АС (ОЦ-03) "
 SOV_specialist_4_short: "ОЦ-03 СВУ"
 SOV_specialist_4_desc: "Современный бульпап-вариант "Драгунова", который изначально предполагался слегка модернизировать "Драгунов", но проект привел к почти полной перестройке вооружения. Разработанное в 1990 году конструкторским бюро приборостроения КБП, оружие переосмыслило старого Драгунова. Был добавлен специальный дульный тормоз, значительно уменьшающий энергию отдачи, и прикреплен эластичный приклад. Большое количество других небольших улучшений, таких как улучшенная рукоятка, крепление прицела и уменьшенный размер ствола с конфигурацией буллпапа, привели к тому, что оружие стало проще в обращении. СВУ участвовала в боевых действиях в Первую Чеченскую войну, где она продемонстрировала исключительные характеристики по сравнению с оригинальным Драгуновым."
 SOV_specialist_5: "ОСВ-96"
 SOV_specialist_5_short: "ОСВ-96"
 SOV_specialist_5_desc: "Современная российская снайперская винтовка, разработанная в конце 1990-х годов ЦНИИТОЧМАШЕМ, но не выпускавшаяся и не выпускавшаяся до 2006 года. СВДК - это крупнокалиберная снайперская винтовка, эффективная дальность стрельбы которой составляет около 600 метров. Он может пробить тяжелую броню или прикрытие и был построен с намерением взять на себя цели, которые СВУ не могут. Нет никаких сообщений о случаях, когда СВДК видел боевые действия."
  
 SOV_ammo_explosives_1: "РГД-33, ПЦО"
 SOV_ammo_explosives_1_short: "РГД-33, ПЦО"
 SOV_ammo_explosives_1_desc: "РГД-33 - ручная граната, разработанная Дьяконовым в 1933 году. Сама граната заряжена тротилом, и взрыватель был поражен процессом броска и поступательным импульсом после того, как он был заряжен. Саму гранату собирали только перед боем, чтобы уменьшить вероятность несчастных случаев, причем гильзу, боеголовку и рукоятку держали отдельно. Он говорит о большом уровне использования до, во время и после Второй мировой войны, а также корейской и Вьетнамской войн.\nПуля с цельнометаллической оболочкой - пуля, изобретенная в 1882 году швейцарским полковником Эдуардом Рубином. Однако за время, прошедшее с тех пор до Второй мировой войны, в металлургию были внесены улучшения, и поэтому раунд Второй мировой войны просто включил более качественные материалы в уже существующий дизайн."
 SOV_ammo_explosives_2: "РКГ-3,Ф-1, МОН-50"
 SOV_ammo_explosives_2_short: "РКГ-3, Ф-1, МОН-50"
 SOV_ammo_explosives_2_desc: "РКГ-3 - советская граната, разработанная в 1950 году как усовершенствование РПГ-40 ее производителями. Она участвовала в иракской и судьбоносной войнах. Сама граната имела более высокий уровень противобронирующей способности по сравнению со своим предшественником и отличалась улучшенным взрывателем и мощной начинкой.\nФ-1 - ручная противопехотная оборонительная граната, в которой российские производители оружия улучшили существующую французскую гранату F1, установив современный растяжной взрыватель и тротиловую начинку с более качественным набором осколочных металлических оболочек. Она видела практически все русские боевые действия со времен Второй мировой войны, когда он был разработан в 1941 году и по сей день.\nМОН - серия ранних наземных мин, разработанных для Советского Союза различными конструкторами в период с 50-х по 60-е гг. все МОН являются противопехотными и обычно используют осколки и тротил для выполнения задач по отказу от зоны поражения. Они видели практически все боевые действия Советского Союза в 50-е и 60-е годы"
 SOV_ammo_explosives_3: "Бронебойный снаряд, Мины ТМ"
 SOV_ammo_explosives_3_short: "Бронебойный снаряд, Мины ТМ"
 SOV_ammo_explosives_3_desc: "БС-снаряды существовали в течение многих лет, начиная с Первой мировой войны и использовались в основном в проникающих боевых кораблях. Примерно в Первой мировой войне, после того как танк вышел на поле боя, были созданы миниатюрные снаряды. В конце концов, небольшие калибры БС были созданы как ответ на бронежилет. Современные БС в 1965 году были созданы как ответ на увеличение численности тяжелобронированной пехоты и пехотного прикрытия. Наземные мины ТМ - это серия советских противотанковых взрывных мин, первоначально разработанных и широко использовавшихся около 1941 года, но были прекращены из-за нехватки металла, который был приоритетным для создания другого оружия. Однако примерно в 1957 году они вернулись, и разработка и производство мин ТМ были продолжены с использованием более современных взрывчатых веществ. ТМ-мины часто использовались почти везде, где был конфликт в советской сфере, но их полный потенциал был засвидетельствован вокруг советского вторжения в Афганистан."
 SOV_ammo_explosives_4: "РГО/РГН"
 SOV_ammo_explosives_4_short: "РГО/РГН"
 SOV_ammo_explosives_4_desc: "РГО и РГН - оборонительные и наступательные осколочные ручные гранаты соответственно. Они состоят из однослойного предварительно фрагментированного тела. Сама раковина сделана из 2 зубчатых алюминиевых секций сверху и снизу. Сами гранаты немедленно взрываются при ударе, что затрудняет реакцию мишеней. Они были созданы по проекту "Базальт" во время Советско-Афганской войны, и их ударные взрывы облегчали попадание по целям в скалистой местности.гранаты-это ручные гранаты, выполняющие специальные функции, такие как светошумовые гранаты, дымовые шашки, зажигательные гранаты и т. д. Они могут быть использованы, чтобы оглушить врагов, скрыть позиции и запустить отрицание области соответственно."
 SOV_ammo_explosives_5: "Современные снаряды"
 SOV_ammo_explosives_5_short: "Современные снаряд"
 SOV_ammo_explosives_5_desc: "В современную эпоху существует огромный арсенал различных типов специализированных боеприпасов, которые могут быть использованы в конкретных ситуациях. Современные БС гораздо лучше проникают в цели, чем старые АП-снаряды, и могут достигать более высоких скоростей. Современные сплавы позволяют стандартным боеприпасам наносить больший урон цели. Хрупкие пули или зажигательные патроны имеют особые ситуации, в которых они полезны. Кроме того, дробовики могут иметь улучшенное удобство использования в современном бою с патронами HE, нулевых патронов, патронов flechette или зажигательных выстрелов."
  
 SOV_manpats_1: "Ружейный гранатомёт Дьяконова"
 SOV_manpats_1_short: "Ружейный гранатомёт Дьяконова"
 SOV_manpats_1_desc: "Ружейный гранатомёт системы Дьяконова был одним из самых ранних образцов пехотных взрывчатых веществ и иногда служил противотанковым оружием во время Второй мировой войны. Однако Советский Союз не разрабатывал собственного противотанкового пехотного вооружения и сильно полагался на ленд-лиз. Дьяканов был разработан компанией Dyakanov MG в 1917 году и может запускать специально построенные дульные взрывчатые вещества, такие как противотанковые или противопехотные гранаты. Само оружие широко использовалось во время Второй мировой войны, но было быстро отброшено после окончания войны в пользу Советского Союза, разрабатывающего лучшие пехотные гранатометы и соответствующие ПЗРК."
 SOV_manpats_2: "РПГ-7"
 SOV_manpats_2_short: "РПГ-7"
 SOV_manpats_2_desc: "Советский ручной противотанковый гранатомёт многоразового применения, Разработан в 1958 году ГСКБ-47 (ныне ГНПП «Базальт»). РПГ-7хорошо известен своей простотой, низкой стоимостью, высокой эффективностью, а также невероятной долговечностью и надежностью. Он способен стрелять стандартными, тепловыми снарядами, осколочными и термобарическими снарядами. Он состоит из очень простой системы, обеспечивающей его низкую стоимость и простоту обслуживания. Он основан вокруг стальной трубы, а середина покрыта деревом для защиты от тепла. Конец расклешен, чтобы помочь в защите пользователя от взрыва и обеспечить снижение отдачи. При выстреле он просто поражает боек, как обычное огнестрельное оружие, чтобы воспламенить гранату. Он был повсеместно распространен с момента его создания и был замечен практически во всех боевых действиях в каждом месте на Земле."
 SOV_manpats_3: "РПГ-18 «Муха»"
 SOV_manpats_3_short: "РПГ-18 «Муха»"
 SOV_manpats_3_desc: "Cоветская реактивная противотанковая граната, разработанная ЦКИБ СОО и КБ «Базальт» в начале 1960-х годов (ведущие конструкторы В.И. Барабошкин, И.Е. Рогозин) и принятая на вооружение Советской Армии в 1972 году. РПГ-18» Муха" стреляет 64-мм тепловой боеголовкой и имеет эффективную дальность действия 200 метров. Боеголовка всегда самоуничтожается через 6 секунд, что накладывает определенный предел. РПГ-18"Муха" использовался не так часто, как РПГ-7, и не так часто путешествовал по миру из-за того, что его нельзя было перезарядить. Однако он очень дешев, несмотря на то, что более громоздок с точки зрения логистики, поскольку каждая трубка срабатывает только один раз. Он широко использовался Китаем в различных войнах, а также в Советско-Афганской войне."
 SOV_manpats_4: "РПГ-29 «Вампир»"
 SOV_manpats_4_short: "РПГ-29 «Вампир»"
 SOV_manpats_4_desc: "Перезаряжаемый противотанковый РПГ, разработанный компанией «Базальт»в конце 1980-х гг. он был разработан для обеспечения современного, улучшенного варианта РПГ-7 и является перезаряжаемым в отличие от РПГ-18 "Муха". Он стреляет ракетами на эффективной дальности около 600 метров и не ограничен временной боеголовкой. Он гораздо более способен пробивать броню, чем РПГ-7, хотя он не полностью уничтожил РПГ-7 или РПГ-18 «Муха» из-за его более высокой стоимости. У РПГ-29"Вампир» также нет начального заряда топлива для защиты операторов, поскольку ракета воспламеняется, чтобы уменьшить вес и дать более ценное значение веса, которое может быть использовано для большего количества ракетного топлива. Это означает, что он не так прост в использовании и требует определенного уровня защиты для своего пользователя, но делает его более эффективным. The-29"Вампир» использовался в войне в Ираке, гражданской войне в Сирии и Ливанской войне 2006 года."
 SOV_manpats_5: "РПГ-32 «Баркас»"
 SOV_manpats_5_short: "РПГ-32 «Баркас»"
 SOV_manpats_5_desc: "Российский многоразовый ручной мультикалиберный многофункциональный гранатомёт. Оружие имеет эффективную дальность действия около 350 м с максимальной дальностью 700 м. пусковая установка поставляется с 2 различными 72 - мм или 105-мм боеголовками, которые являются термобарическими или тепловыми. Он обладает гораздо большей бронебойной способностью, чем любой из его предшественников. Он еще не был развернут или принят российской армией из-за его высокой стоимости, хотя некоторые ближневосточные страны импортируют его из России в основном для использования в своих армейских батальонах высшего класса. В настоящее время он используется в Гражданской войне в Ираке и Гражданской войне в Йемене."
  
 SOV_hmg_1: "ДШК"
 SOV_hmg_1_short: "ДШК"
 SOV_hmg_1_desc: "Советский станковый крупнокалиберный пулемёт под патрон 12,7×108 мм. Разработан на основе конструкции крупнокалиберного станкового пулемёта ДК. В феврале 1939 года ДШК был принят на вооружение РККА под обозначением «12,7 мм крупнокалиберный пулемёт Дегтярёва — Шпагина образца 1938 года»."
 SOV_manpads_1: "«Стрела-2»"
 SOV_manpads_1_short: "«Стрела-2»"
 SOV_manpads_1_desc: "Cоветский переносной зенитно-ракетный комплекс, принятый на вооружение ВС СССР в 1968 году. Разработанное КБМ в 1964 году, это оружие имело взрыватель ударной детонации без задержки, взрывчатую боеголовку HE и пропорциональную навигационную логическую систему наведения ракет. Он оказался относительно недорогим в массовом производстве. Однако советское высшее командование быстро отметило, что комплекс действовал плохо и намного ниже того, что они ожидали от этого оружия. Он видел конфликт в Советско-Афганской войне, много различных коммунистических революций, а также широкое использование в ближневосточных конфликтах."
 SOV_manpads_2: "«Стрела-3»"
 SOV_manpads_2_short: "«Стрела-3»"
 SOV_manpads_2_desc: "Советский переносной зенитно-ракетный комплекс, модернизация «Стрелы-2». Использовала ракеты 9М36 с новой инфракрасной головкой самонаведения и коническим сканированием фазомодулированным сигналом (ЧМ вместо AM-модуляции по амплитуде со спиральным сканированием)."Стрела-3" использовался во многих различных ближневосточных конфликтах, таких как иракско-иранская война, но не видел много боевых действий в самой советской сфере."
 SOV_manpads_3: "«Игла»"
 SOV_manpads_3_short: "«Игла»"
 SOV_manpads_3_desc: "Советский переносной зенитный ракетный комплекс, предназначенный для поражения низколетящих воздушных целей на встречных и догонных курсах в условиях тепловых помех.Разработка принципиально нового комплекса началась в Коломне в 1971 году. Главным разработчиком ПЗРК «Игла» (9К38) было определено КБМ Министерства оборонной промышленности СССР (главный конструктор — С. П. Непобедимый), а тепловая ГСН создавалась ЛОМО, (главный конструктор ГСН — О. А. Артамонов).. "Игла" использует двухволновую инфракрасную систему наведения и имеет систему детонации магнитного взрывателя замедленного действия. Ракета также шла с аэросайком, чтобы уменьшить лобовое сопротивление и повысить производительность. Это оружие было свидетелем многих общих конфликтов на Ближнем Востоке, но также и югославских войн."
 SOV_manpads_4: "«Верба»"
 SOV_manpads_4_short: "«Верба»"
 SOV_manpads_4_desc: "Hоссийский переносной зенитный ракетный комплекс (ПЗРК), предназначенный для поражения низколетящих воздушных целей на встречных и догонных курсах в условиях воздействия ложных тепловых помех. С высокой вероятностью поражает малоизлучающие цели — крылатые ракеты и БПЛА"
  
 SOV_protection_equip_1: "Стальной нагрудник"
 SOV_protection_equip_1_short: "Стальной нагрудник"
 SOV_protection_equip_1_desc: "Стальной нагрудник - чрезвычайно ранняя модель защитного снаряжения пехоты, основанная на стальной кирасе и изготовленная во время Первой мировой войны. Сами нагрудные знаки были внедрены примерно в 1942 году, и результаты их использования во время боевых действий были неоднозначными. Сами нагрудники работали в тяжелых городских условиях пехоты, но были обременительны в полевых условиях."
 SOV_protection_equip_2: "СН+СШ-40"
 SOV_protection_equip_2_short: "СН+СШ-40"
 SOV_protection_equip_2_desc: "Бронежилет и шлемы СШ-40 были разработаны ближе к концу Второй мировой войны. Сами шлемы были более прочными, чем их предыдущие версии."
 SOV_protection_equip_3: "6Б5-15+СТШ-81"
 SOV_protection_equip_3_short: "6Б5-15+СТШ-81"
 SOV_protection_equip_3_desc: "Жилет 6Б5-15 был разработан Советским научно-исследовательским институтом "сталь" и выпускался в 1986-1998 годах. Сам жилет использовал кевларовые материалы для защиты пользователя и поставляется с серией многокамерных камуфляжей. Шлемы СТШ-81 - это титановые и стальные шлемы, также производимые компанией "сталь" для Советского Союза. Шлемы СТШ-81 демонстрировали значительную прочность в бою."
 SOV_protection_equip_4: "6Б7-1"
 SOV_protection_equip_4_short: "6Б7-1"
 SOV_protection_equip_4_desc: "Со временем баллистическая броня 6Б5-15 должна была бы иметь больше и улучшенные ремни безопасности и вспомогательные компоненты. "Сталь" намеревалась создать полный набор современных установок для большинства сред по всему миру, которые могли бы быть изготовлены по желанию Советского Союза. Шлемы 6Б7-1 были улучшенной версией шлемов СТШ-81 и действовали как преемники их прежней конструкции. Сталь делала их из более современных материалов, таких как улучшенная внутренняя стальная конструкция, которая могла более эффективно отражать силу, исходящую от пуль."
 SOV_protection_equip_5: "6Б45+6Б47"
 SOV_protection_equip_5_short: "6Б45+6Б47"
 SOV_protection_equip_5_desc: "Компания Техником разработала бронежилеты 6B5 и пехотное снаряжение в начале 2000-х годов для удовлетворения потребностей современного боя. Они стали более маневренными, прочными и эффективными, чем раньше. Они отличались современным амортизирующим покрытием, снабжались атмосферо-и влагостойкой подкладкой и могли легко дать любому солдату массивное преимущество в пехотном бою. Шлем 6B47 и его навесное оборудование обеспечивают большую защиту для своих владельцев, чем раньше, предлагая большую защиту."
  
