l_russian:
 syr_news.1.t: "Президент Хусни Аль-Заим"
 syr_news.1.d: "30 марта 1949 года генерал Хусни Аль-Заим захватил власть в результате бескровного государственного переворота. Резиденцию президента Шукри аль-Куватли штурмовали солдаты, и генерал объявил о его аресте. Считалось, что ЦРУ оказало содействие перевороту, сделав его первой операцией агентства за границей. Аль-Заим, более уступчивый требованиям Вашингтона, одобрил Трансаравийский трубопровод, против которого выступал Куватли, и начал переговоры с Израилем о прекращении огня. Однако то, что произошло в общем, говорит о том, что страна погрузилась в десятилетие хаоса..."
 syr_news.1.a: "Что происходит с Сирией?"
 syr_news.2.t: "Перемирие с Израилем"
 syr_news.2.d: "Соглашение о перемирии 1949 года было подписано между Израилем и Сирией 20 июля 1949 года на высоте 232 близ Маханаима, положив конец официальному конфликту в рамках бывшего мандата Палестины. Израильскую сторону представляли подполковник Мордехай Маклеф, Йехошуа Пенман и Шабтай Розенн, а сирийскую - полковник Фаузи Село, подполковник Мохаммед Насер и капитан Афиф Сизри. Хотя соглашения о перемирии с Сирией завершили арабо-израильскую войну 1948 года, они не ознаменовали конец арабо–израильского конфликта."
 syr_news.2.a: "Мир. На сегодня."
 syr_news.3.t: "[GetNewspaperHeader]Хусни Аль-Заим свергнут"
 syr_news.3.d: "Менее чем через пять месяцев после своего президентства Хусни Аль-Заим сам стал объектом нового переворота. Сами Аль-Хиннави объявил себя новым президентом, но не прошло и четырех недель, как он был свергнут Адибом Шишакли. Шишакли с его новой должностью сохранит прозападную позицию, как и два предыдущих генерала, но будет расколот среди сирийского населения."
 syr_news.3.a: "Ещё больше хаоса."
 syr_news.4.t: "[GetNewspaperHeader]Демократия восстановлена!"
 syr_news.4.d: "В народе росло недовольство против Шишаклы, кульминацией которого стало свержение военного силача. Сирийская Коммунистическая партия, партия Баас и военные возглавляют антишишаклинское движение. Отказавшись втягивать страну в гражданскую войну, он ушел в отставку без боя. После этого состоялись выборы, и Шукри Аль-Куватли был вновь переизбран президентом Сирии."
 syr_news.4.a: "Неужели это конец хаосу?"
 syr_news.5.t: "Противостояние левому движению"
 syr_news.5.d: "Левые в Сирии стали влиятельными с тех пор, как страна присоединилась к Советскому Союзу. Она привлекла нежелательное внимание со стороны Ирака, Иордании и Турции, поскольку Багдадский пакт угрожал вторжением, чтобы сдержать коммунизм. Мы можем обратиться за поддержкой к египтянам или подчиниться их требованиям."
 syr_news.5.a: "Что мы можем сделать теперь?"
 syr_news.6.t: "[GetNewspaperHeader]Государственный переворот 8 Марта"
 syr_news.6.d: "В ночь на 8 марта военные подразделения, лояльные сирийскому отделению Арабской Социалистической Партии Баас, двинулись в Дамаск после года планирования и благословения лидера партии Мишеля Афлака. Заговорщики взяли государственный аппарат с минимальными жертвами к утру, а сирийский народ действовал равнодушно. Новые правители Сирии учредили Национальный Комитет Революционного Командования (НКРК), состоящий из двенадцати баасистов, восьми Насеровцев в качестве руководящего органа. Насеровцы говорили об очередной попытке объединения с Египтом, хотя баасисты относятся к этой идее с меньшим энтузиазмом."
 syr_news.6.a: "Опять переворот? Когда же они образумятся?"
 syr_news.7.t: "[GetNewspaperHeader]Сирийский государственный переворот 1966 г."
 syr_news.7.d: "Внутренние конфликты назревали в Арабской Социалистической Партии Баас с 1963 года. Лидеры и старая гвардия партии хотели править Сирией при классическом Баасизме, но более молодые и радикальные члены партии видели Сирию лучше в форме нео-баасизма при марксистско-ленинских принципах. 21 февраля вспыхнуло насилие между членами партии Баас в крупных городах, и когда пыль осела, Нео-баасисты одержали победу в борьбе. Основатели партии Баас бежали из страны в Ирак и вызвали раскол между баасистами Ирака и Сирии."
 syr_news.7.a: "Должны ли мы это комментировать?"
 syr_news.8.t: "[GetNewspaperHeader]Коррекционное движение"
 syr_news.8.d: "Генерал Хафез аль-Асад, рассорившись с генералом Салахом Джадидом, широко планировал захват власти. Выжидая удобного момента, он незаметно заменил сторонников Джадида на своих в армии, и к началу переворота у него было преимущество. Перед участием во Всеобщем национальном конгрессе он приказал своим сторонникам окружить и арестовать Джадида и его сторонников. Во время конгресса Джадид критиковал Асада и лишал его власти, в то время как большинство присутствующих делегатов понимали, что они проиграли. По окончании собрания Джадид и делегаты были арестованы сирийскими солдатами, верными Асаду, без потерь. Асад объявил о победе и начале "Исправительного движения", чтобы исправить ошибки Джадида в стране."
 syr_news.8.a: "Интересно."
 syr_news.12.t: "[GetNewspaperHeader]Попытка переворота сорвана"
 syr_news.12.d: "Генерал Хафез Аль-Асад после ссоры с генералом Салахом Джадидом широко планировал захватить власть. Выжидая удобного случая, он незаметно заменил сторонников Джадида своими в армии, и к началу переворота у него было преимущество. Прежде чем явиться на Всеобщий Национальный Конгресс, он приказал своим сторонникам окружить и арестовать Джадида и его сторонников, но анонимный источник позволил Джадиду подготовиться заранее. Во время конгресса Джадид критиковал Асада и лишил его власти, в то время как большинство присутствующих делегатов знали, что они проиграли. Как только встреча закончилась, Асад был арестован сирийскими солдатами, лояльными Джадиду, без каких-либо жертв. Джадид провозгласил победу и осудил Асада как контрреволюционера, который пытался предать страну."
 syr_news.12.a: "Не в этот раз."
 syr_news.9.t: "[GetNewspaperHeader]Израильский шпион пойман"
 syr_news.9.d: "Сирийский Мухабарат с помощью оборудования и личного состава КГБ и индийского посольства, информируя нас о необычных радиопередачах, обнаружил израильского шпиона. Большое количество радиопомех было прослежено в квартире израильского шпиона Эли Коэна, и он был пойман в середине передачи в Израиль. После судебного разбирательства в военном трибунале шпион был приговорен к смертной казни в соответствии с военным положением страны. Израиль пытался просить о помиловании, но смертный приговор был оставлен в силе. Коэн был публично повешен на площади Марджа."
 syr_news.9.a: "Интересно."
 syr_news.10.t: "Асад-Джадидская борьба за власть"
 syr_news.10.d: "Конфликт между сирийскими генералами Салахом Джадидом и Хафезом Асадом становился все более заметным для общественности. Смещение Джадидом Баасизма в сторону Коммунизма заставило тех, кто не одобрял его, присоединиться к Асаду. Двойственность истинной власти между ними стала предметом разговоров в Сирии, и ясно, что только один из них может выжить с полной властью."
 syr_news.10.a: "Интересно."
 syr_news.11.t: "Сирия предлагает договор о взаимной обороне"
 syr_news.11.d: "Сирийская делегация направилась в Москву, чтобы предложить договор о взаимной обороне. В то время как баасисты называют себя социалистами, их недовольство Израилем и их национализм вызывают некоторые опасения в президиуме..."
 syr_news.11.aa: "В любое время, товарищи."
 syr_news.11.ab: "Вы шутите, да?"
 syr_news.40.t: "Сирия хочет нас аннексировать"
 syr_news.40.d: "Послание из Дамаска требовало присоединения Ливана к Cирийскому государству. Ультиматум не оставляет нам много выбора."
 syr_news.40.aa: "Мы не сможем противостоять им. Мы уступим"
 syr_news.40.ab: "Мы не откажемся от нашего суверенитета."
 syr_news.41.t: "Ливан соглашается"
 syr_news.41.d: "Бейрут ответил, что они примут аннексию. Наши солдаты могут войти и обезопасить страну."
 syr_news.41.a: "Они вполне умны."
 syr_news.42.t: "Ливан отказывается"
 syr_news.42.d: "Бейрут ответил, что они отвергли наш ультиматум. Наши солдаты могут войти и обезопасить страну."
 syr_news.42.aa: "Пора заставить их пожалеть об этом решении."
 syr_news.42.ab: "Похоже, мы не можем их трогать."
 syr_news.43.t: "Сирия просит Кувейт"
 syr_news.43.d: "Дамаск послал сообщение, что они хотят присоединить Кувейт к Сирии. В то время как Сирия является нашим союзником, Кувейт находится под нашей защитой."
 syr_news.43.aa: "Большая Сирия - лучший союзник, чем Кувейт."
 syr_news.43.ab: "Кувейт находится под нашей защитой. Мы не можем согласиться с этим."
 syr_news.44.t: "Сирия хочет аннексировать нас"
 syr_news.44.d: "Дамаск направил в Лондон сообщение о том, что они хотят расширить Сирию за счет Кувейта. Британия пришла к нам, для того чтобы проинформировать нас об этом."
 syr_news.44.aa: "Мы не можем ни победить Сирию, ни втянуть Британию в войну."
 syr_news.44.ab: "Конечно, мы не можем согласиться на это!"
 syr_news.45.t: "Кувейт соглашается"
 syr_news.45.d: "Кувейт согласился на аннексию после консультаций с Великобританией."
 syr_news.45.a: "Еще одно присоединение."
 syr_news.46.t: "Кувейт бросает нам вызов"
 syr_news.46.d: "Кувейт отказался от аннексии. Британия заявила, что будет поддерживать Кувейт в этом вопросе."
 syr_news.46.aa: "Похоже, сила - это единственный язык!"
 syr_news.46.ab: "Может быть, в следующий раз."
 syr_news.50.t: "Сирия приглашает нас к своему союзу"
 syr_news.50.d: "Наши братья из Сирии приглашают нас в арабский союз, чтобы восстановить несостоявшиеся мечты сирийского королевства. Мы могли бы присоединиться к ним?"
 syr_news.50.aa: "Мы восстановим несостоявшуюся мечту. Рассчитывайте на нас."
 syr_news.50.ab: "Слишком амбициозно."
 syr_news.51.t: "Иордан соглашается"
 syr_news.51.d: "Иордан согласился на союз."
 syr_news.51.a: "Еще одна страна под нашим контролем."
 syr_news.52.t: "Иордания отказывается"
 syr_news.52.d: "Иордания отклонила это предложение."
 syr_news.52.a: "Их воля."
 syr_news.53.t: "Сирия приглашает нас к своему союзу"
 syr_news.53.d: "Наши братья из Сирии приглашают нас в арабский союз, чтобы восстановить несостоявшиеся мечты сирийского королевства. Мы могли бы присоединиться к ним?"
 syr_news.53.aa: "Мы восстановим несостоявшуюся мечту. Рассчитывайте на нас."
 syr_news.53.ab: "Слишком амбициозно."
 syr_news.54.t: "Ирак соглашается"
 syr_news.54.d: "Ирак согласился на союз."
 syr_news.54.a: "Еще одна страна под нашим контролем."
 syr_news.55.t: "Ирак отказывается"
 syr_news.55.d: "Ирак отклонил это предложение."
 syr_news.55.a: "Их воля."
 syr_news.56.t: "Сирия требует нашего подчинения"
 syr_news.56.d: "Послание из Дамаска требует, чтобы Ливан стал протекторатом сирийского государства. Ультиматум не оставляет нам много выбора."
 syr_news.56.aa: "Мы не сможем одолеть их. Мы уступим"
 syr_news.56.ab: "Мы не откажемся от нашего суверенитета."
 syr_news.57.t: "Ливан соглашается"
 syr_news.57.d: "Бейрут ответил, что они согласятся войти в нашу сферу влияния. Наши солдаты могут войти и обезопасить страну."
 syr_news.57.a: "Они вполне умны."
 syr_news.58.t: "Ливан отказывается"
 syr_news.58.d: "Бейрут ответил, что они отвергли наш ультиматум. Наши солдаты могут войти и обезопасить страну."
 syr_news.58.aa: "Пора заставить их пожалеть об этом решении."
 syr_news.58.ab: "Похоже, мы не можем их трогать."
 syr_news.59.t: "Сирия просит Кувейт"
 syr_news.59.d: "Дамаск послал сообщение, что они хотят присоединить Кувейт к Сирии. В то время как Сирия является нашим союзником, Кувейт находится под нашей защитой."
 syr_news.59.aa: "Сирия - лучший союзник, чем Кувейт."
 syr_news.59.ab: "Кувейт находится под нашей защитой. Мы не можем согласиться с этим."
 syr_news.60.t: "Сирия хочет аннексировать нас"
 syr_news.60.d: "Дамаск направил в Лондон сообщение о том, что они хотят расширить Сирию за счет Кувейта. Британия пришла к нам, для того чтобы проинформировать нас об этом."
 syr_news.60.aa: "Мы не можем ни победить Сирию, ни втянуть Британию в войну."
 syr_news.60.ab: "Конечно, мы не можем согласиться на это!"
 syr_news.61.t: "Кувейт соглашается"
 syr_news.61.d: "Кувейт согласился на союз после консультаций с Великобританией."
 syr_news.61.a: "Еще одна страна под нашим контролем."
 syr_news.62.t: "Кувейт бросает вызов"
 syr_news.62.d: "Кувейт отклонил наше приглашение. Британия заявила, что будет поддерживать Кувейт в этом вопросе."
 syr_news.62.aa: "Похоже, сила - это единственный язык!"
 syr_news.62.ab: "Может быть, в следующий раз."
 syr_news.63.t: "Сирия хочет присоединиться к CENTO"
 syr_news.63.d: "Мы получили необычный запрос из Сирии. Похоже, они хотят присоединиться к CENTO и стать частью Арабского щита против коммунизма. Может, нам их впустить?"
 syr_news.63.a: "Чем нас больше, тем веселее."
 syr_news.63.b: "Как насчет, нет?"
