 FE_DIFFICULTY_VERY_EASY:0 "DÉFCON 5"
 FE_DIFFICULTY_VERY_EASY_TOOLTIP:0 "§YDEFCON 5 - TRÈS FACILE§!\n\n\n\n£DEFCON_1\n\n\n\n\n§L\"Une nation forte, comme une personne forte, peut se permettre d'être douce, ferme, réfléchie et retenue.\" -Jimmy Carter\n\nL'IA poursuivra une ligne de conduite pacifique avec le joueur, l'IA fera des compromis si elle est confrontée.§!"
 FE_DIFFICULTY_EASY:1 "DÉFCON 4"
 FE_DIFFICULTY_EASY_TOOLTIP:0 "§YDEFCON 4 - FACILE§!\n\n\n\n£DEFCON_2\n\n\n\n\n§L\"Que cela vous plaise ou non, l'histoire est de notre côté.\" - Nikita Khrouchtchev\n\nL'IA poursuivra généralement une ligne de conduite pacifique avec le joueur, l'IA fera généralement des compromis si elle est confrontée.§!"
 FE_DIFFICULTY_NORMAL:1 "DÉFCON 3"
 FE_DIFFICULTY_NORMAL_TOOLTIP:0 "§YDÉFCON 3 - NORMAL§!\n\n\n\n£DEFCON_3\n\n\n\n\n§L\"Je veux faire partie de ces fous.... Il faut oser inventer l'avenir\" - Thomas Sankara\n\nL'IA fera des compromis si cela est mutuellement bénéfique et si l'escalade n'est pas nécessaire. Semblable au comportement historique entre les grandes puissances de l'époque.§!"
 FE_DIFFICULTY_HARD:1 "DÉFCON 2"
 FE_DIFFICULTY_HARD_TOOLTIP:1 "§YDEFCON 2 - DIFFICILE§!\n\n\n\n£DEFCON_4\n\n\n\n\n§L\"N'oubliez pas que la tempête est une bonne occasion pour le pin et le cyprès de montrer leur force et leur stabilité.\" - Hô Chi Minh\n\nL'IA sera moins susceptible de faire des compromis avec le joueur et sera en état d'alerte si elle est confrontée au joueur.§!"
 FE_DIFFICULTY_VERY_HARD:0 "DÉFCON 1"
 FE_DIFFICULTY_VERY_HARD_TOOLTIP:1 "§YDEFCON 1 - TRÈS DUR§!\n\n\n\n£DEFCON_5\n\n\n\n\n§L\"Les décès ont des bienfaits. Ils peuvent fertiliser le sol.\" - Mao Zedong\n\nL'IA ne fera jamais de compromis avec le joueur et déclenchera la Troisième Guerre mondiale si elle est provoquée.§!"
 STATE_INFRA_SUPPLY:1 "De l'infrastructure municipale : $VAL|.2H$"
