#kindly stay away from this file unless necessary
 oil_desc:0 "Les produits pétrochimiques comprennent un grand nombre de substances dérivées du pétrole. Il est utilisé pour fabriquer du carburant, des produits chimiques, des médicaments, des plastiques, des munitions et bien plus encore.\n§GComprend les éléments suivants :§!\n§YHuile\nCharbon\nGaz\nBiocarburants§!"
 aluminium_desc:0 "Les métaux légers sont des métaux qui ont un faible poids et sont utilisés dans des produits qui doivent peser de petites quantités. Les métaux légers sont couramment utilisés dans les avions, les produits de consommation et les équipements électriques.\n§GComprend les éléments suivants :§!\n§YAluminium (issu de la bauxite)\nChrome (de chromite)\nNickel (de garniérite)\nZinc (issu de sphalérite)\nÉtain (de cassitérite)\nArgent (provenant de plusieurs prospects en jeu)\nMagnésium§!"
 rubber_desc:0 "La nourriture est tout ensemble de substances comestibles qui nourrissent les créatures organiques.\n§GComprend les éléments suivants :§!§Y\nCéréales\nViande\nPoisson\nLégumes\nFruits\nÉpices et huiles\nFriandises\nPâte nutritive\nProduits laitiers\nTubercules\nSodas\nCafé et Thé\nNoix\nCatégories d'aliments mineurs§!"
 tungsten_desc:0 "Les métaux des terres rares sont un ensemble de matériaux technologiques rares essentiels à l'électronique. Cependant, dans ce mod, ils incluent tout matériau exceptionnellement rare généralement utilisé pour la technologie. Les terres rares sont utilisées dans des produits et des armes avancés.\n§GComprend les éléments suivants :§!\n§YÉléments de terres rares\nOr\nLithium\nPalladium§!"
 steel_desc:0 "Les métaux de construction sont définis dans ce mod comme tous les métaux lourds courants, en vrac et omniprésents pour la construction. Utilisé dans la construction, les véhicules, les produits de consommation et pratiquement toutes les armes.\n§GComprend les éléments suivants :§!\n§YAcier (issu du minerai de fer de l'hématite)\nCuivre (de chalcopyrite)\nPlomb (de galène)\nTungstène (de wolframite)\nMolybdène et Manganèse§!"
 chromium_desc:0 "Les matières nucléaires sont des ressources utilisées dans la fission nucléaire. Ils sont utilisés pour les armes nucléaires et l'énergie nucléaire.\n§GComprend les éléments suivants :§!\n§YUranium (de l'uraninite)\nPlutonium (trouvé dans les sources d'uranium)\nThorium (de la monazite)§!"
 electricity_desc:0 "L'électricité est une forme d'énergie résultant de particules chargées en statique ou en courant. Il est utilisé pour alimenter pratiquement toutes les machines.\n§GComprend les éléments suivants :§!§Y\nÉnergie fossile\nÉnergie verte\nÉnergie Nucléaire\nÉnergie Biomasse (projet spécial rare)§!"
