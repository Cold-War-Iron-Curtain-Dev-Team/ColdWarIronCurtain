 Otto_Skorzeny_EGY_desc:0 "SS-Obersturmbannführer d'origine autrichienne dans la Waffen SS pendant la Seconde Guerre mondiale. Pendant la guerre, il a participé à une série d'opérations, notamment la destitution du régent hongrois Miklós Horthy et la mission de sauvetage qui a permis de libérer le dictateur italien déchu Benito Mussolini de sa captivité. Après la guerre, il s'est échappé d'un camp d'internement en 1948 et s'est installé en Espagne, d'où il est venu en Égypte."
