 nato_member_desc:0 "\nL'Organisation du Traité de l'Atlantique Nord a vu le jour après la fin de la Seconde Guerre mondiale et les ravages qu'elle a causés en Europe. L'organisation met en œuvre le Traité de l'Atlantique Nord, signé par les États-Unis et leurs partenaires européens afin d'établir un système de défense collective visant à garantir la paix et la stabilité futures en Europe. L'alliance est largement considérée comme une réponse aux préoccupations occidentales face à l'expansionnisme soviétique de l'après-guerre. Alors que l'OTAN se présente comme une organisation à caractère défensif, l'Union soviétique la considère comme une menace directe pour son indépendance."
