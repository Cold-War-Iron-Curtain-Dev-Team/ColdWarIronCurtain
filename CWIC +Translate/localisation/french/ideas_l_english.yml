 todt:0 "Fritz Todt"
 todt_desc:0 "L'ingénieur allemand Fritz Todt est le fondateur de l'Organisation Todt. Il permet l'accélération des projets industriels à visée militaire."
 speer:0 "Albert Speer"
 speer_desc:0 "Albert Speer était un architecte allemand qui occupa le poste de ministre de l'Armement et de la Production de guerre de 1942 à 1945. Souvent considéré comme l'artisan du « miracle de l'armement », sa nomination permettra d'accroître l'efficacité industrielle."
 raeder:0 "Erich Raeder"
 raeder_desc:0 "L'amiral Erich Johann Albert Raeder était un partisan du déploiement de navires de surface traditionnels et de la doctrine de dissuasion."
 donitz:0 "Karl Dönitz"
 donitz_desc:0 "Karl Dönitz était un amiral allemand passionné par les sous-marins et la doctrine de l'interdiction commerciale."
 goering:0 "Hermann Göring"
 goering_desc:0 "Hermann Göring était un as de l'aviation pendant la Grande Guerre qui devint l'un des principaux partisans d'Hitler. Bien qu'il ne soit pas le meilleur dans ce poste, il est d'une loyauté sans faille."
 walther_wever:0 "Walther Wever"
 walther_wever_desc:0 "Walther Wever fut l'un des premiers partisans de la théorie du bombardement stratégique."
 ritter_von_greim:0 "Ritter von Greim"
 ritter_von_greim_desc:0 "Ritter von Greim est un partisan de l'interdiction tactique."
 ernst_udet:0 "Ernst Udet"
 ernst_udet_desc:0 "Ernst Udet a joué un rôle déterminant dans l'adoption des techniques de bombardement en piqué ainsi que du bombardier en piqué Stuka."
 werner_von_fritsch:0 "Werner von Fritsch"
 werner_von_fritsch_desc:0 "Werner von Fritsch, général de la vieille garde, privilégie l'infanterie."
 ludwig_beck:0 "Ludwig Beck"
 ludwig_beck_desc:0 "Ludwig Beck accorde une importance particulière à l'approvisionnement."
 franz_halder:0 "Franz Halder"
 franz_halder_desc:0 "Franz Halder croit en la puissance de frappe de l'artillerie dans l'attaque."
 heinz_guderian:0 "Heinz Guderian"
 wilhelm_keitel:0 "Wilhelm Keitel"
 wilhelm_keitel_desc:0 "Wilhelm Keitel, général de la Vieille Garde, privilégie l'infanterie. Il compense son manque de compétences par sa loyauté."
 ferdinand_schorner:0 "Ferdinand Schörner"
 ferdinand_schorner_desc:0 "Ferdinand Schörner est doué pour la défense et le combat dans des conditions climatiques froides."
