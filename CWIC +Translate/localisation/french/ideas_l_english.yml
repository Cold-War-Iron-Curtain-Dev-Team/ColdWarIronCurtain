 Hendrik_van_den_Bergh_desc:0 "Nationaliste afrikaner de longue date, Hendrik s'opposa à l'intervention de l'Afrique du Sud dans la Seconde Guerre mondiale et, avec le futur Premier ministre John Vorster, rejoignit l'Ossewabrandwag, une organisation paramilitaire inspirée des SA nazis qui menait des actes de sabotage contre le gouvernement sud-africain afin de saper l'effort de guerre. Après la guerre, van den Bergh gravit rapidement les échelons de la police."
