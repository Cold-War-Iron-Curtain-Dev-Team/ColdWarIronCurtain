 idea_PAR_argentine_training:0 "Mission militaire argentine"
 idea_PAR_argentine_training_desc:0 "L'Argentine a envoyé des conseillers militaires pour aider à la modernisation et à la formation des forces paraguayennes. S'inspirant des doctrines européennes, notre armée bénéficie d'une discipline améliorée, d'une meilleure coordination de l'infanterie et d'une meilleure formation des officiers."
 idea_PAR_membership_restrictions:0 "Restrictions relatives à l'adhésion à l'armée"
 idea_PAR_membership_restrictions_desc:0 "Le service dans les forces armées est désormais réservé exclusivement aux membres loyaux du parti, ce qui garantit que l'armée reste un pilier solide du contrôle gouvernemental. Des officiers politiques sont intégrés dans les rangs afin de maintenir la discipline idéologique, et les promotions sont accordées en fonction de la loyauté envers le parti plutôt que du mérite sur le champ de bataille. Si cela garantit une obéissance sans faille au régime, cela limite également le vivier de recrues qualifiées et entrave la flexibilité stratégique sur le champ de bataille."
 idea_PAR_central_bank:0 "Banque centrale du Paraguay"
 idea_PAR_central_bank_desc:0 "Créée par la loi 18/52, la Banque centrale du Paraguay régule la politique monétaire, assure la stabilité de la monnaie et supervise les institutions financières. Pilier de l'économie paraguayenne, elle joue un rôle clé dans la gestion de l'inflation et des réserves, même si ses politiques restent influencées par les réalités politiques et économiques."
