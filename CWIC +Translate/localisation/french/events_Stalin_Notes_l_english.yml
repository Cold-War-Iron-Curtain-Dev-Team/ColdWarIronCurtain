l_english:
 StalinNotes.1.d:0 "Le dirigeant soviétique Joseph Staline a dévoilé un plan pour résoudre la question allemande. La division persistante de l'Allemagne et l'occupation alliée risquaient de transformer l'Allemagne de l'Ouest en une puissance militaire majeure pour l'Occident. L'Allemagne de l'Est, à l'heure actuelle, ne disposait ni des effectifs ni du développement industriel de l'Allemagne de l'Ouest. Le dirigeant soviétique a déclaré son intention d'adresser une note diplomatique aux puissances occidentales, proposant une conférence de paix pour déterminer la réunification d'une Allemagne démocratique, à condition qu'elle demeure totalement neutre et dotée d'une défense minimale. Cette condition s'accompagnait d'autres, comme le maintien de la frontière de Potsdam. Une Allemagne neutre pourrait devenir un État tampon crucial et priver l'Occident d'un allié potentiel. Toutefois, avant d'envoyer cette note, les Soviétiques devaient déterminer s'ils pouvaient faire confiance à l'Occident et à l'Allemagne quant au respect des termes du traité."
 StalinNotes.2.d:0 "L'Union soviétique a récemment envoyé une note appelant à une conférence de paix entre les puissances occupantes en Allemagne afin de définir les modalités d'un État allemand unifié. Les Soviétiques insistent sur le fait qu'une Allemagne unifiée doit être neutre et avoir des frontières conformes à celles de Potsdam, entre autres conditions. Ces conditions semblent généreuses, et une Allemagne neutre pourrait constituer un rempart utile. Cependant, les promesses démocratiques n'incluent aucune garantie d'élections libres, et nos alliés estiment que l'Allemagne doit participer à des élections nationales libres. Nous devrions peut-être envoyer une réponse détaillant notre position et solliciter des discussions plus approfondies avec les Soviétiques sur cette question, notamment sur la signification même d'une stricte neutralité. L'offre soviétique pourrait également n'être qu'une manœuvre communiste ; dans ce cas, elle devrait être rejetée catégoriquement."
 StalinNotes.3.d:0 "Comme prévu, les puissances occidentales ont ajouté leurs propres conditions. Elles exigent notamment un vote supervisé par l'ONU avant la conférence de paix afin que l'Allemagne puisse y participer. Elles ont également exprimé des réserves quant à la neutralité allemande, arguant qu'elle viole la souveraineté du pays, et s'opposent au caractère absolu de la frontière de Potsdam. Nous devons répondre à cette demande et définir notre stratégie de dialogue avec l'Occident lors des communications ultérieures. Une première option serait d'accepter les conditions occidentales, à l'exception de la neutralité. Une autre serait de tenter de trouver un compromis avec l'Occident sur cette question. Enfin, la résistance des puissances occidentales laisse présager une tentative de manipulation du résultat ; il est donc préférable de laisser tomber cette initiative."
 StalinNotes.4.d:0 "Nous avons échangé de nouvelles notes avec l'Union soviétique concernant la réunification allemande. Il semble que les Soviétiques soient disposés à faire des compromis et à parvenir à un véritable accord. Toutefois, il est clair qu'ils défendront farouchement leurs intérêts si nous optons pour cette solution. L'autre approche consiste à considérer le plan soviétique comme une manœuvre visant à affaiblir la défense de l'Europe occidentale et, s'ils sont sérieux, ils doivent accepter intégralement nos conditions préalables à toute négociation. Enfin, si toute cette démarche s'avère être une opération de propagande, nous pouvons mettre fin aux discussions."
 StalinNotes.5.d:0 "Les puissances occidentales persistent à s'opposer à nos conditions légitimes pour des États allemands unifiés et acceptables. Leur refus d'un État démocratique et neutre révèle clairement leur sombre ambition de transformer l'Allemagne en une machine de guerre capitaliste. Toutefois, si nous sommes convaincus que la gauche peut l'emporter lors d'une élection nationale avant la conférence, même si les conditions préalables sont remplies, l'État allemand collaborera avec nous et nous pourrons retourner la conférence contre lui. Si le risque d'une victoire de la droite aux élections est trop élevé, nous risquons de perdre l'Allemagne entière au profit de l'Occident."
 StalinNotes.6.d:0 "Des représentants de l'Union soviétique, des États-Unis, de la France et du Royaume-Uni se réunissent à Dresde pour une conférence consacrée à la réunification allemande. Cette conférence fait suite à la proposition de l'Union soviétique d'organiser une ultime conférence de paix afin de trouver une solution au problème allemand. Nombreux sont ceux, en Occident, qui accueillent ces négociations avec un optimisme prudent, les Soviétiques ayant promis de respecter les principes démocratiques, notamment le multipartisme et les libertés individuelles. Cependant, certains craignent que les Soviétiques ne cherchent à créer un État tampon allemand faible pour protéger leurs frontières et entraver les efforts visant à former une défense ouest-européenne robuste."
 StalinNotes.7.d:0 "Les Alliés et l'Union soviétique ont convenu de la formation d'un gouvernement d'unification. Le cabinet sera composé de politiciens conservateurs et de gauche afin de partager le pouvoir. Un arrangement similaire sera mis en place pour le Parlement allemand. Cette répartition équilibrée des pouvoirs politiques garantit l'exigence de consensus pour l'adoption des lois et permettra de contenir les dérives politiques. En Allemagne de l'Ouest, certains murmurent que les Alliés sacrifient les principes démocratiques et renforcent le pouvoir des communistes, dont la popularité reste faible à travers le pays."
 StalinNotes.8.d:0 "In one of the more contentious discussions, the four powers announced the new unified German state would geographically conform to the provisions of the Potsdam Conference. The agreement effectively shifts the eastern border to the Oder-Niesse line, giving up a large portion of the 1937 German border. West Germany long opposed this provision, however, the occupying powers agreed on it. An American diplomat privately told reporters the border was effectively already a reality and reversing it would bring too much disorder."
 StalinNotes.9.d:0 "Dans une avancée majeure, les quatre puissances occupantes convinrent qu'une Allemagne unifiée serait strictement neutre sur la scène internationale et de nature démocratique. L'Allemagne ne pourrait adhérer à aucune alliance militaire, ni occidentale ni orientale, et serait libre de participer à tous les marchés commerciaux. En compromis avec les Américains, la nouvelle Allemagne serait autorisée à adhérer aux Nations Unies et à participer à leurs travaux, mais ne serait pas autorisée à déployer la force militaire ni à mener d'actions contre les puissances occupantes. La nouvelle Allemagne pourrait également maintenir une armée, mais uniquement celle nécessaire à une défense raisonnable et à la sécurité intérieure. L'Union soviétique insista sur le fait qu'aucune élection ne devrait être organisée afin de préserver l'équilibre des pouvoirs ; cependant, les États-Unis affirmaient qu'une société démocratique exige des élections. Il fut convenu que le gouvernement d'unification déciderait de la tenue ou non d'élections."
 StalinNotes.10.d:0 "Dans un accord historique, les États-Unis, la France, le Royaume-Uni et l'Union soviétique ont convenu du règlement définitif de la réunification allemande. Conformément à cet accord, l'Allemagne de l'Ouest et l'Allemagne de l'Est doivent mettre en place un nouveau gouvernement d'unification pour diriger une Allemagne unie. L'Allemagne est tenue de rester strictement neutre, de respecter les frontières de Potsdam et de garantir les droits démocratiques. Bien que de nombreux Allemands se réjouissent de cette nouvelle, des inquiétudes persistent quant aux frontières et au pouvoir du Parti communiste dans le cadre de cet accord de partage du pouvoir."
 StalinNotes.11.d:0 "Les États-Unis, le Royaume-Uni et la France insistent pour que nous formions un gouvernement d'union nationale, conformément à l'accord conclu avec l'Union soviétique. Nombreux sont ceux qui, dans le pays, déplorent l'absence de représentation allemande lors des négociations. De plus, l'État proposé conserverait les frontières controversées de Potsdam et nous contraindrait à collaborer avec le régime communiste d'Allemagne de l'Est, que nous ne reconnaissons pas comme légitime. Nos sympathisants aux États-Unis nous ont discrètement fait savoir que si nous refusons de créer ce gouvernement d'union nationale, ils soutiendront l'annulation du traité. Cependant, de nombreux Allemands soutiennent également cet accord, estimant que ses avantages l'emportent sur les préoccupations liées aux frontières et au partage du pouvoir."
 StalinNotes.12.d:0 "Le gouvernement ouest-allemand a manifesté son opposition à l'accord récemment conclu par les puissances occupantes sur la réunification de l'Allemagne. Il souligne notamment l'absence de toute participation d'un représentant élu du peuple allemand comme étant une préoccupation majeure. De plus, les conditions d'un État neutre mettent en péril la sécurité et l'avenir économique de l'Allemagne. Plus important encore, le gouvernement d'unification et l'absence de garantie d'élections libres, même assorties de garanties de droits démocratiques, sont inacceptables pour le peuple allemand. Le gouvernement a ajouté qu'il ne reconnaît pas le régime illégal de l'Allemagne de l'Est et qu'il n'ouvrira aucune discussion avec ses dirigeants. Les États-Unis n'ont d'autre choix que de retirer leur soutien au traité et de soutenir l'Allemagne de l'Ouest."
 StalinNotes.13.d:0 "L'accord récent concernant la réunification allemande semble avoir échoué. Le gouvernement de la RDA a refusé d'en accepter les termes et refuse de rencontrer les responsables est-allemands, qu'il ne reconnaît pas. Suite à cette annonce, les États-Unis, ainsi que le Royaume-Uni et la France, ont déclaré qu'ils ne contraindraient pas la RDA à respecter l'accord. De fait, tous les efforts soviétiques pour résoudre la question de la réunification allemande ont échoué. Les Soviétiques ont exprimé leur indignation et accusé l'Occident de militariser l'Europe. Ils sont largement salués pour leur prise de position, tandis que les États-Unis sont critiqués pour avoir négocié un accord avant de faire marche arrière."
 StalinNotes.14.d:0 "Après des discussions tendues, les responsables des deux Allemagnes se sont entendus sur la formation d'un gouvernement d'unification. Les postes clés du gouvernement seront partagés et les sièges au Parlement répartis entre les partis. Un équilibre parfait entre la droite et la gauche sera instauré. Ceci devrait garantir la neutralité de l'Allemagne et prévenir la menace d'une prise de pouvoir par un homme fort. L'État allemand, resté neutre, a reçu des informations faisant état du début du retrait des troupes d'occupation. Le premier débat législatif porte sur la question de la tenue d'élections libres en Allemagne. Une future constitution déterminera la composition future du gouvernement et son système électoral."
 StalinNotes.15.d:0 "L'accord entre les puissances occupantes stipulait que l'Allemagne adopterait les valeurs démocratiques, mais la décision d'organiser des élections libres revenait au gouvernement allemand. Les Soviétiques s'opposaient à ce système, préférant un système où plusieurs partis obtiendraient des sièges et pourraient y placer les membres de leur choix. L'équilibre des partis et des idéologies était essentiel au maintien de la neutralité, et des élections libres risquaient de le rompre. Les puissances occidentales estiment que les droits démocratiques ne sont effectifs que si les citoyens ont le droit de vote. Le vote permet au peuple de choisir ses représentants et de sanctionner les dirigeants défaillants. Le Parlement et le gouvernement doivent décider s'ils conviennent d'organiser des élections générales à l'avenir ou s'ils maintiennent le gouvernement actuel en attendant une solution."
 StalinNotes.16.d:0 "Un immense sentiment d'excitation règne alors que les observateurs de l'ONU commencent à s'installer dans les villes d'Allemagne de l'Ouest et d'Allemagne de l'Est. Les deux Länder organiseront des élections nationales afin d'établir un gouvernement d'union nationale avant d'entamer des pourparlers de paix avec les puissances occupantes en vue de la réunification définitive de l'Allemagne. Les forces militaires soviétiques et occidentales présentes dans le pays devraient rester dans leurs casernes jusqu'à la tenue des élections. Ce processus s'inscrit dans la continuité d'un processus de paix initié par l'Union soviétique pour résoudre la question allemande."
 StalinNotes.17.d:0 "Pour la première fois depuis des années, les Allemands se rendent aux urnes pour des élections libres. Tous les principaux partis politiques ont été autorisés à faire campagne en Allemagne de l'Ouest comme en Allemagne de l'Est. Le scrutin se déroulera sous la supervision de représentants des Nations Unies. Les forces armées soviétiques, américaines, françaises et britanniques sont cantonnées et la circulation des véhicules militaires est interdite le jour du vote. Des journalistes du monde entier sont arrivés pour couvrir ces élections historiques. Toute l'Europe retient son souffle dans l'attente des résultats."
 StalinNotes.18.d:0 "Les élections organisées par les Nations Unies en Allemagne de l'Ouest et de l'Est se sont déroulées pacifiquement. Des millions d'Allemands se sont rendus aux urnes pour décider de l'avenir de leur pays. Ces élections suscitent un vif intérêt international. Pour les Européens, le succès de ce scrutin et la formation du nouveau gouvernement d'union nationale devraient permettre à l'Allemagne d'entamer des négociations de paix avec les puissances occupantes. L'ONU prévoit de publier les résultats une fois tous les votes dépouillés. L'Union soviétique et les États-Unis sont salués pour leur initiative et leur respect du processus électoral."
 StalinNotes.19.d:0 "Les Nations Unies ont récemment proclamé la victoire de la coalition de gauche, menée par le Parti socialiste unifié d'Allemagne (SDU), d'obédience communiste. Ce parti dirigera la délégation allemande aux négociations de paix. Ces résultats ont surpris les États-Unis et leurs alliés européens, qui estimaient que le SDU ne pourrait pas mener une campagne efficace à l'échelle nationale. L'Union soviétique se félicite de ce résultat, y voyant la preuve de la volonté allemande de parvenir à une paix durable par le biais du socialisme. De nombreux analystes pensent que cela fera pencher la balance en faveur des positions soviétiques lors de la Conférence de paix pour la réunification allemande."
 StalinNotes.21.d:0 "La Conférence de paix actuelle sur la réunification de l'Allemagne a abouti à un accord sur les frontières du pays. Les gouvernements soviétique et allemand se sont engagés à respecter les frontières établies par la Déclaration de Potsdam. Bien que de nombreux Allemands s'opposent à ce tracé, il a été reconnu que les zones frontalières avaient déjà évolué et qu'un changement de frontière à ce stade pourrait engendrer des troubles. Les autres participants ont finalement été convaincus sur ce point."
 StalinNotes.22.d:0 "Le monde a salué la signature d'un traité de paix définitif sur la réunification de l'Allemagne. Les puissances occidentales se félicitent de la garantie des droits démocratiques pour les nouveaux États allemands. Les Soviétiques considèrent la neutralité requise de l'Allemagne comme un succès majeur. Une Allemagne neutre offre un État tampon entre les deux alliances. Les Allemands se disent enthousiastes face à cet accord, malgré certaines controverses concernant les frontières définitives qui en découlent."
 StalinNotes.23.d:0 "La nouvelle coalition de partis conservateurs participe à la Conférence de paix sur la réunification de l'Allemagne, organisée avec les puissances occupantes. Le Parti démocrate-chrétien, principal parti de la coalition, devrait œuvrer pour le rétablissement des frontières de 1937 et la garantie des droits démocratiques. L'Union soviétique cherchera à minimiser la présence militaire allemande et à préserver la neutralité de l'Allemagne sur les questions européennes et internationales."
 StalinNotes.24.d:0 "La Conférence de paix sur la réunification allemande, toujours en cours, a défini la politique étrangère et militaire de l'Allemagne réunifiée. Bien que les Soviétiques aient souhaité une neutralité permanente et l'absence d'élections pour garantir un gouvernement équilibré, ils ont été amenés à faire des compromis. L'Allemagne restera soumise à des restrictions militaires et de neutralité pendant quinze ans. Même après la levée de ces restrictions, elle devra s'engager à la prudence en matière de politique étrangère. Le caractère vague de ces dispositions est perçu comme un atout pour l'Allemagne une fois les restrictions levées."
 StalinNotes.25.d:0 "Lors d'une avancée majeure, les participants à la Conférence de paix sur la réunification de l'Allemagne ont accepté un accord sur les frontières allemandes. L'Union soviétique souhaitait maintenir le découpage territorial convenu à Potsdam, mais n'a pu résister aux pressions des Alliés et de l'Allemagne sur cette question. Les Soviétiques ont accepté de restituer Kaliningrad et ses environs à l'Allemagne. Il s'agit d'une victoire importante pour le gouvernement allemand, qui sera bien accueillie par la population. La Pologne et l'Union soviétique ne se satisferont pas de ce résultat, malgré la promesse soviétique de remettre l'administration du territoire restitué aux Allemands. Les États-Unis ont soutenu cette initiative visant à étendre la zone tampon neutre en territoire soviétique."
 StalinNotes.26.d:0 "Le monde a salué l'annonce de la signature d'un accord final entre les puissances occupantes et l'Allemagne sur la réunification allemande. Cet accord instaure une période de neutralité et de démilitarisation, et garantit les droits démocratiques à tous les citoyens allemands. Les puissances occidentales se félicitent de ces résultats, et de nombreux Européens considèrent cet accord comme un facteur d'apaisement des tensions sur le continent. Les Soviétiques se satisferont de la neutralité et de l'établissement de l'Allemagne comme État tampon ; toutefois, ce statut temporaire pourrait engendrer des problèmes une fois ces mesures levées."
 StalinNotes.27.d:0 "Les forces d'occupation soviétiques, américaines, britanniques et françaises supervisent actuellement l'organisation des élections nationales en Allemagne de l'Ouest et de l'Est. Le gouvernement ainsi formé représentera l'Allemagne à la prochaine Conférence de paix sur la réunification allemande. Les Soviétiques avaient initialement souhaité tenir cette conférence sans la participation allemande, mais ont finalement accepté de négocier avec l'Occident à condition que les élections soient organisées par les puissances occupantes. Ces dernières ont sollicité l'intervention des Nations Unies pour superviser le scrutin, mais ont finalement accédé à la demande soviétique. L'enthousiasme est palpable en Allemagne à l'approche de ces élections."
 StalinNotes.28.d:0 "L'Union soviétique supervisera les élections dans sa zone d'occupation allemande afin de déterminer quel gouvernement représentera l'Allemagne à la Conférence de paix sur la réunification allemande. Ces élections auront lieu dans plusieurs mois et les partis politiques sont déjà en campagne. Il est impossible d'en prédire l'issue. Nous pourrions laisser le peuple allemand décider par les urnes, mais une proposition a été soumise pour garantir la victoire du Parti de l'Union socialiste. Les services de renseignement et les forces militaires locales peuvent assurer ce succès électoral, l'Allemagne de l'Ouest restant plus peuplée. Pour contrer cela, nous pouvons transférer le million d'Allemands de souche vivant en RSS kazakhe. Ils pourraient potentiellement être installés près de Kaliningrad."
 StalinNotes.29.d:0 "Des informations et des rumeurs font état d'une intensification du trafic ferroviaire en Allemagne de l'Est. Plus précisément, il semblerait que des milliers de nouveaux Allemands arrivent dans le pays. Les autorités soviétiques les placent dans des camps temporaires, et il se murmure qu'ils pourraient être installés ultérieurement dans les environs et à Kaliningrad. Selon les services de renseignement, ces Allemands seraient originaires de la RSS du Kazakhstan. Les Soviétiques transfèrent cette importante population d'origine allemande en Allemagne, sans doute pour augmenter considérablement leurs votes en faveur de leurs alliés communistes lors des prochaines élections. Le secret qui entoure cette situation et le refus des Soviétiques de commenter l'arrivée de ces populations laissent présager un vaste plan de manipulation électorale.\nLes élections doivent être suivies de près."
 StalinNotes.30.d:0 "Des élections nationales, destinées à représenter l'Allemagne à la prochaine Conférence de paix sur la réunification allemande, doivent se tenir dans les semaines à venir. Des journalistes en Allemagne de l'Est constatent, au milieu de la campagne électorale, l'arrivée massive d'Allemands en provenance d'Union soviétique. Il semblerait que les autorités soviétiques rapatrient des Allemands de souche déportés pendant la guerre afin qu'ils puissent participer aux élections. Les autorités soviétiques ont refusé de commenter la question et les observateurs occidentaux craignent qu'il ne s'agisse d'un complot soviétique visant à manipuler les résultats en faveur du Parti socialiste unifié."
 StalinNotes.31.d:0 "Les résultats des récentes élections législatives en Allemagne de l'Ouest et de l'Est révèlent une progression remarquable du Parti socialiste unifié (SUP). Les chiffres exacts sont encore en cours d'analyse, mais il semble que les communistes aient obtenu des scores exceptionnels en Allemagne de l'Est. Les gains de la gauche en Allemagne de l'Ouest laissent présager que le gouvernement final sera probablement une coalition de partis de gauche menée par le Parti communiste. Les puissances occidentales et le gouvernement ouest-allemand contestent ces résultats et des réunions d'urgence sont organisées dans leurs capitales respectives. L'Union soviétique a salué ces résultats et appelle tous les partis à les respecter. La décision soviétique de renvoyer les Allemands de souche déportés et de céder une partie du territoire à l'Allemagne de l'Est aurait joué un rôle déterminant dans ces résultats."
 StalinNotes.32.d:0 "Nos rapports de renseignement sur le terrain, les articles de presse et les données électorales indiquent qu'il y a probablement eu une fraude électorale massive dans la zone d'occupation soviétique. Ces résultats garantissent qu'un gouvernement allemand de gauche représentera l'Allemagne à la future conférence. Cela donnera aux Soviétiques une position de force pour les négociations. Nous pouvons retirer notre soutien à la conférence et aux élections, mettant ainsi fin aux récents efforts de paix. Bien que les Soviétiques protestent, cette décision sera probablement bien accueillie par nos alliés et par de nombreux Allemands. Cependant, il pourrait être dans notre intérêt de laisser la conférence de paix se poursuivre, car même si les représentants allemands sont pro-soviétiques, ils auront leurs propres intérêts nationaux sur certaines questions. La décision des Soviétiques de renvoyer les déportés allemands et de céder des territoires à l'Allemagne de l'Est a renforcé le soutien aux socialistes en Allemagne de l'Ouest."
 StalinNotes.33.d:0 "Les résultats des élections montrent une victoire de la gauche dans les sondages nationaux. Le parti communiste, en particulier, a obtenu d'excellents résultats. Des informations, y compris dans les médias, indiquent que les forces d'occupation soviétiques, supervisant les élections en Allemagne de l'Est, ont manipulé les bulletins de vote pour assurer une victoire communiste. Les communistes seraient alors contraints de gouverner avec d'autres partis de gauche et de diriger l'Allemagne à la conférence de paix. Cela atténuerait leur image pro-soviétique. Cependant, il est clair que ces élections ne sont pas authentiques et nous pouvons facilement refuser de poursuivre le processus. Les Américains, les Français et les Britanniques ont tous manifesté leur soutien si nous choisissons d'y mettre fin. La décision des Soviétiques de renvoyer les déportés allemands et de céder des territoires à l'Allemagne de l'Est a renforcé le soutien aux socialistes en Allemagne de l'Ouest."
 StalinNotes.34.d:0 "Les puissances occidentales et l'Allemagne de l'Ouest refusent de poursuivre les négociations de paix suite aux récentes élections. L'Union soviétique est accusée d'avoir truqué le scrutin en Allemagne de l'Est afin de favoriser une avancée communiste. Sans résultat légitime, le peuple allemand ne peut être correctement représenté. L'Union soviétique critique vivement l'Occident, l'accusant de saboter les efforts de paix car les élections ne lui ont pas été favorables. L'Allemagne de l'Ouest affirme que ces élections prouvent l'illégitimité du régime est-allemand."
 StalinNotes.35.d:0 "Les médias du monde entier ont couvert avec enthousiasme les récentes élections qui se sont déroulées en Allemagne de l'Ouest et de l'Est. Malgré les appréhensions concernant le scrutin en Allemagne de l'Est, tout porte à croire que les Allemands ont pu voter librement. Les principaux partis politiques, tant à l'Ouest qu'à l'Est, ont été autorisés à mener campagne sans entrave. Les puissances occupantes, les Allemands et les Européens suivront attentivement les résultats. La coalition victorieuse dirigera la délégation allemande à la prochaine conférence de paix, qui visera à finaliser la réunification du pays. Le Parti démocrate-chrétien (CDP) et le Parti socialiste unifié (SUTP) devraient remporter les deux plus grands suffrages."
 StalinNotes.36.d:0 "Une coalition de partis conservateurs a remporté les récentes élections qui se sont déroulées en Allemagne de l'Ouest et de l'Est. Le nouveau gouvernement dirigera l'Allemagne à la conférence de paix. Les Soviétiques ne seront pas satisfaits du résultat, mais devraient faire pression pour obtenir un compromis qui leur soit favorable. Les Alliés espèrent qu'un gouvernement allemand ami pourra les aider à faire avancer leurs objectifs dans les négociations. Les Allemands suivront avec attention l'évolution des négociations et aspirent à une Allemagne unie et pacifique."
 StalinNotes.37.d:0 "La Conférence de paix sur la réunification allemande a convenu de la restitution d'une partie de la frontière orientale de l'Allemagne en échange d'une politique étrangère stricte. Aucune restriction ne sera imposée à l'armée allemande, mais il est attendu de l'Allemagne qu'elle maintienne une armée pour assurer la sécurité de ses frontières et préserver la paix intérieure. L'Union soviétique souhaitait maintenir les frontières établies par l'accord de Potsdam, mais a été contrainte à des compromis afin de préserver la neutralité allemande permanente. La Pologne sera probablement mécontente de cet arrangement, mais les Soviétiques ont promis de restituer l'administration des territoires au gouvernement allemand. Ce dernier n'a pas obtenu satisfaction sur l'ensemble de ses revendications territoriales, mais a récupéré Kaliningrad et sa région environnante."
 StalinNotes.38.d:0 "La Conférence de paix sur la réunification allemande, actuellement en cours, a convenu de préserver les droits démocratiques et individuels de tous les Allemands. La question des élections libres sera soumise au vote du peuple allemand à l'issue de la conférence. Les puissances occidentales souhaitaient des élections libres garanties, tandis que les Soviétiques privilégiaient un gouvernement permanent de partage du pouvoir afin de maintenir l'équilibre politique du pays. Le référendum permettra au peuple allemand de trancher."
 StalinNotes.39.d:0 "Le gouvernement allemand conservateur et les puissances occupantes ont signé un accord final sur la réunification de l'Allemagne. Ce traité exigeait une stricte neutralité de l'Allemagne et garantissait les droits démocratiques. La question des élections libres serait résolue par référendum national. Plus important encore, les signataires ont convenu de rétablir une partie des frontières allemandes d'avant la Seconde Guerre mondiale. L'accord ne satisfaisait pleinement aucune des parties, mais les Alliés ont ainsi pu garantir une Allemagne démocratique. L'Union soviétique est parvenue à assurer la neutralité du nouvel État allemand, en lui fournissant une zone tampon et en empêchant les États-Unis d'accéder à la potentielle puissance industrielle et militaire allemande."
 StalinNotes.40.d:0 "Les Allemands de tout le pays se sont rendus aux urnes pour décider si l'Allemagne organisera des élections libres. Le traité récemment conclu garantit les droits démocratiques et individuels. Cependant, la question de la liberté des élections n'a pas été tranchée. Les partisans des élections libres affirment qu'elles constituent un élément essentiel de toute démocratie. En revanche, les opposants estiment qu'une future constitution devrait garantir une répartition équilibrée des sièges entre toutes les orientations politiques. Cela permettrait d'éviter la domination d'une idéologie et contribuerait au maintien de la neutralité. Les experts du sujet indiquent qu'il est impossible de prédire avec certitude le vainqueur."
 StalinNotes.41.d:0 "Les récentes élections nationales ont vu la victoire d'une coalition de partis de gauche. Le Parti socialiste unifié (SUP) est le principal parti de cette coalition. Ce résultat est salué par l'Union soviétique, dont les experts estiment qu'il lui sera utile lors des prochaines négociations de paix concernant la réunification de l'Allemagne avec les puissances occupantes. Bien que les puissances occidentales soient déçues, il est entendu que la coalition prendra en compte les intérêts nationaux d'un État allemand indépendant et uni."
 StalinNotes.42.d:0 "La Conférence de paix pour la réunification allemande a abouti à un compromis sur les frontières de l'Allemagne. En échange de l'acceptation des frontières définies par l'accord de Potsdam, l'Allemagne s'engageait à une neutralité temporaire. Cet accord frontalier satisfaisait l'Union soviétique et la Pologne. Pour l'Occident, l'accord de neutralité temporaire ouvrait la possibilité d'un futur État allemand pro-occidental. L'Allemagne devait observer une stricte neutralité pendant quinze ans avant que les restrictions ne soient levées."
 StalinNotes.44.d:0 "Les puissances occupantes et l'Allemagne ont signé un accord final sur la question de la réunification allemande. Ce traité règle plusieurs points relatifs à la frontière définitive, aux droits démocratiques et à la neutralité de l'État allemand. Ni les Alliés ni l'Union soviétique ne sont pleinement satisfaits du résultat. Cependant, les compromis obtenus devraient préserver la paix non seulement en Allemagne, mais aussi en Europe. La communauté internationale salue globalement cet accord et félicite les États participants pour leur capacité à y parvenir."
 StalinNotes.45.d:0 "Le Parlement allemand débat actuellement de l'opportunité d'inscrire des élections libres dans une future constitution. Les partisans du scrutin affirment que les droits démocratiques garantis par le récent traité ne peuvent être légitimés que par la tenue d'élections. Les opposants estiment, quant à eux, que l'Allemagne doit instaurer un équilibre des pouvoirs politiques afin de préserver sa neutralité et d'empêcher qu'un homme fort ou un parti radical n'accède au pouvoir. Les débats s'annoncent animés et passionnés."
 StalinNotes.46.d:0 "L'Occident, et notamment les États-Unis, a réagi à nos sincères efforts de paix par des manœuvres et des contre-propositions impossibles. Ils ont ainsi révélé leurs intentions bellicistes. L'Occident souhaite réarmer l'Allemagne pour en faire une puissance militaire et l'aider dans son ambition de renverser les régimes socialistes d'Europe de l'Est. Certains médias allemands font état de nos conditions généreuses et de l'implication américaine dans leur échec. Le gouvernement est-allemand s'est déclaré satisfait de nos efforts pour instaurer une paix durable."
 StalinNotes.47.d:0 "Les échanges de notes entre l'Union soviétique et les puissances occupantes allemandes ont échoué. Les Américains affirment que les Soviétiques n'ont jamais été sincères et n'ont fait que feindre l'intérêt pour une paix juste pour l'Allemagne. Bien que de nombreux membres de notre gouvernement partagent cette analyse, un nombre croissant de responsables et de médias estiment que l'échec des négociations représente une occasion manquée. Cela a suscité un certain mécontentement parmi les Allemands, mais dans l'ensemble, nous ne prévoyons pas que cela se traduise par des manifestations publiques ou des expressions de colère."
 StalinNotes.48.d:0 "Les échanges de notes entre l'Union soviétique et nos alliés se sont soldés par un échec. Les Soviétiques semblaient proposer des conditions avantageuses pour une Allemagne réunifiée, mais nos efforts pour négocier et faire progresser les discussions ont été vains. Il est clair que les Soviétiques instrumentalisaient ces discussions à des fins de propagande et pour légitimer leur régime illégal en Allemagne de l'Est. Bien que nos alliés et notre peuple acceptent ces faits, nombreux sont les Allemands qui estiment que l'échec des pourparlers est de notre faute. Il faudra du temps pour rétablir les relations, mais ils finiront par reconnaître la duplicité des communistes."
 StalinNotes.49.d:0 "Les efforts soutenus de l'Union soviétique pour parvenir à une solution juste à la question de la réunification allemande et de la paix se sont soldés par un échec. L'Occident a réagi négativement et a activement œuvré à l'échec de cette initiative. Pour ce faire, il a formulé des exigences exorbitantes et répandu des rumeurs visant à discréditer les Soviétiques. L'Allemagne de l'Ouest a révélé sa véritable nature de marionnette des Américains en relayant leur propagande. Finalement, tous les Allemands ont constaté qu'un camp recherchait la paix tandis que l'autre choisissait de poursuivre l'escalade des tensions."
 StalinNotes.57.d:0 "Nos efforts récents pour parvenir à une paix définitive avec l'Allemagne ont échoué lorsque l'Occident a abandonné les négociations, constatant qu'une victoire totale était impossible. Dans cette optique, nous avons rapatrié un million de déportés allemands de la RSS du Kazakhstan. Ces rapatriés ont été envoyés à Kaliningrad et dans des régions de Silésie auparavant administrées par la Pologne. Ces territoires sont administrés conjointement par la Pologne et l'Allemagne. Cependant, depuis la fin des pourparlers, les affrontements ethniques entre Allemands et Polonais en Silésie se multiplient. Le gouvernement polonais a fait part de ses inquiétudes et réclame la restitution du territoire. Nous devons choisir : soit laisser ce territoire sous administration allemande, soit rétablir l'administration polonaise."
 StalinNotes.59.d:0 "L'Union soviétique a annoncé le remplacement des administrateurs est-allemands de Silésie par des fonctionnaires polonais chargés de coadministrer le territoire. Auparavant, les Soviétiques avaient fait pression sur la Pologne pour qu'elle cède ces terres à l'Allemagne de l'Est avant les élections qui devaient déterminer le futur gouvernement d'un État allemand unifié. Nombre d'Allemands reconnaissent aujourd'hui que les Soviétiques se livraient à des manœuvres politiques et ne faisaient que feindre de se soucier des droits et des revendications allemandes. Notre gouvernement condamnera fermement le nettoyage ethnique perpétré par l'Union soviétique et ses alliés à leur solde contre les Allemands."
 StalinNotes.58.d:0 "Les Soviétiques ont affirmé catégoriquement que les territoires de Silésie qu'ils nous ont contraints à céder à l'Allemagne de l'Est resteraient sous contrôle allemand. Ils ont souligné que l'afflux de rapatriés allemands avait profondément modifié la démographie locale et que le retour d'une souveraineté polonaise risquait de provoquer une grave crise de réfugiés et des luttes intestines au sein du Parti socialiste. Cette décision est décevante et nous l'avons exprimé. Cependant, les Soviétiques ont insisté sur le fait qu'il n'était ni prévu ni envisagé de céder davantage de terres aux Allemands. Nous avons clairement indiqué que, dans une telle situation, notre gouvernement ne pouvait garantir que le peuple polonais ne réagirait pas de manière dramatique. Espérons que les Soviétiques ne nous réservent pas d'autres surprises."
 StalinNotes.43.d:0 "La Conférence de paix pour la réunification allemande a abouti à un compromis sur les frontières de l'Allemagne. En échange de l'abandon par l'Allemagne de ses revendications sur l'ensemble de la frontière de 1937, celle-ci accepte une période de neutralité temporaire. Cet accord frontalier satisfait l'Union soviétique et la Pologne, qui craignaient que les Soviétiques, ou un nouveau gouvernement allemand unifié, ne réclament davantage de territoire. Pour l'Ouest, cet accord de neutralité temporaire ouvre la voie à la création d'un État allemand pro-occidental. L'Allemagne doit observer une stricte neutralité pendant quinze ans avant que ces restrictions ne soient levées. Avant la conférence, l'Union soviétique avait cédé certains territoires autour de Kaliningrad à l'Allemagne de l'Est."
 StalinNotes.51.d:0 "Une initiative récente de l'Union soviétique visant à conclure un traité de paix définitif avec l'Allemagne a échoué. Cet échec a douché les espoirs, en Europe, d'une résolution susceptible d'apaiser les tensions entre l'Est et l'Ouest. Le dirigeant soviétique Joseph Staline avait lancé cette initiative par un échange de notes, assorti de concessions perçues par beaucoup comme généreuses sur des questions relatives à un gouvernement démocratique et aux libertés économiques au sein d'un État allemand neutre. Les raisons de cet échec restent floues ; les Soviétiques accusent l'Occident de saboter l'initiative par des exigences déraisonnables. Les États-Unis, quant à eux, affirment que l'offre soviétique n'était qu'un outil de propagande destiné à déstabiliser les Alliés et l'Allemagne de l'Ouest. Quoi qu'il en soit, nombreux sont les Allemands qui se demandent si une occasion en or d'une réunification n'a pas été manquée."
 StalinNotes.50.d:0 "L'accord récent concernant la réunification avec l'Allemagne semble avoir échoué. Le gouvernement de la RDA a refusé d'en accepter les termes et refuse de rencontrer les responsables est-allemands, qu'il ne reconnaît pas. Suite à cette annonce, les États-Unis, ainsi que le Royaume-Uni et la France, ont déclaré qu'ils ne contraindraient pas la RDA à respecter l'accord. Cela met de facto fin aux efforts de paix soviétiques. Les Soviétiques ont exprimé leur indignation et accusé l'Occident de militariser l'Europe. Sur le plan international, les Soviétiques sont largement salués pour leur prise de position sur la question, tandis que les États-Unis sont critiqués pour avoir négocié un accord avant de faire marche arrière."
 StalinNotes.54.d:0 "Le grand nombre d'immigrants allemands arrivés en Allemagne de l'Est étaient installés autour de Kaliningrad. Cependant, ceux qui sont de retour en Allemagne de l'Est s'installent dans des régions de Silésie, sous administration polonaise. Les autorités polonaises s'inquiètent. Nos propres responsables craignent que ces immigrants allemands ne soient plus éligibles au vote s'ils continuent de s'installer dans la région. Afin de garantir la validité de ces votes et de contrer la propagande occidentale qui prétend que nous cherchons à punir l'Allemagne, nous céderons Kaliningrad et ferons pression sur la Pologne pour qu'elle cède ces zones de Silésie à l'Allemagne de l'Est. Les fonctionnaires et autorités polonais de la région seront remplacés par des Allemands de l'Est. Bien que le gouvernement polonais désapprouve notre action, nous sommes convaincus qu'il ne protestera pas tant qu'aucun territoire supplémentaire ne sera cédé à l'Allemagne. Cela donnera un coup de pouce important à nos sympathisants en Allemagne avant le vote."
 StalinNotes.52.d:0 "L'Union soviétique a confirmé les informations faisant état d'un afflux massif d'Allemands de souche renvoyés en Allemagne de l'Est. Les Soviétiques ont ajouté qu'ils cédaient Kaliningrad et que la Pologne céderait des portions de la Silésie à l'Allemagne de l'Est pour accueillir ces rapatriés. Cela marque un revirement majeur de la part des Soviétiques, qui avaient longtemps exigé l'application intégrale des frontières définies par l'accord de Potsdam. Bien que les États-Unis condamnent cette action, la qualifiant de manœuvre politique visant à influencer les sondages, de nombreux Allemands se réjouissent de cette nouvelle. Notre propre gouvernement ne peut que souligner que toutes nos revendications territoriales n'ont pas été satisfaites, mais même cette concession est largement saluée. De nombreux analystes estiment désormais que les sondages penchent en faveur des partis socialistes."