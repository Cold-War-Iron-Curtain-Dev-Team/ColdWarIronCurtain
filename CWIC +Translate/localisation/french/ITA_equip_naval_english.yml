l_english:
 ITA_battle_hull_medium_0:0 "Classe Duilio Refit"
 ITA_battle_hull_medium_0_desc:0 "La classe Andrea Doria (généralement appelée classe Duilio dans les sources italiennes) était une paire de cuirassés dreadnought construits pour la Marine Royale italienne (Regia Marina) entre 1912 et 1916. Les deux navires - Andrea Doria et Duilio - ont été achevés pendant la Première Guerre mondiale.La classe était une amélioration progressive par rapport à la classe précédente Conte di Cavour."
 ITA_carrier_hull_light_3:0 "Classe Giuseppe Garibaldi"
 ITA_carrier_hull_light_4:0 "Classe Cavour"
 ITA_carrier_hull_light_3_desc:0 "Le Giuseppe Garibaldi est un porte-avions italien, le premier navire d'aviation à pont traversant jamais construit pour la marine italienne, et le premier navire italien construit pour exploiter des aéronefs à voilure fixe. Elle est équipée d'avions et d'hélicoptères à décollage court et atterrissage vertical (STOVL). Giuseppe Garibaldi a participé à des opérations aériennes de combat au large de la Somalie, du Kosovo, de l'Afghanistan et de la Libye."
 ITA_carrier_hull_light_4_desc:0 "Le navire est conçu pour combiner des opérations aériennes à voilure fixe V / ADAC et hélicoptère, des opérations de commandement et de contrôle et le transport de personnel militaire ou civil et de véhicules lourds. L'espace de hangar de 134 m (440 pi) et 2 800 m2 (30 000 pi2) peut servir de soute à véhicules pouvant contenir jusqu'à 24 chars de combat principaux (généralement Ariete) ou de nombreux véhicules plus légers (50 IFV Dardo, 100+ Iveco LMV), et est équipé à l'arrière de rampes d'accès d'une capacité nominale de 70 tonnes, ainsi que de deux ascenseurs d'une capacité maximale de 30 tonnes pour les avions."
 ITA_sub_hull_small_single_0:0 "Classe Tang"
 ITA_sub_hull_small_single_0_desc:0 "Les sous-marins de la classe Tang ont été les premiers sous-marins conçus (dans le cadre du projet SCB 2) et construits par la marine des États-Unis après la Seconde Guerre mondiale. Ils incorporaient les meilleures caractéristiques du sous-marin allemand à grande vitesse de type XXI et du vénérable sous-marin de la flotte de la marine américaine."
 ITA_sub_hull_small_single_1:0 "Classe Toti"
 ITA_sub_hull_small_single_1_desc:0 "La classe Toti était des sous-marins construits pour la marine italienne dans les années 1960. Ce sont les premiers sous-marins conçus et construits en Italie depuis la Seconde Guerre mondiale. Ces bateaux étaient petits et conçus comme des sous-marins anti-sous-marins \"hunter killer\". Ils sont comparables aux sous - marins allemands de type 205 et aux sous-marins français de classe Aréthuse."
 ITA_sub_hull_small_single_2:0 "Réaménagement de la Classe Toti"
 ITA_sub_hull_small_single_2_desc:0 "La classe Toti était des sous-marins construits pour la marine italienne dans les années 1960. Ce sont les premiers sous-marins conçus et construits en Italie depuis la Seconde Guerre mondiale. Ces bateaux étaient petits et conçus comme des sous-marins anti-sous-marins \"hunter killer\". Ils sont comparables aux sous - marins allemands de type 205 et aux sous-marins français de classe Aréthuse."
 ITA_sub_hull_small_single_3:0 "Classe Sauro"
 ITA_sub_hull_small_single_3_desc:0 "La classe Nazario Sauro sont des sous-marins diesel-électriques exploités par la marine italienne. Tous les bateaux ont été construits par Fincantieri à Monfalcone."
 ITA_sub_hull_small_single_4:0 "Classe Todaro"
 ITA_sub_hull_small_single_4_desc:0 "La classe allemande Type 212, également classe italienne Todaro, est un sous-marin diesel-électrique développé par Howaldtswerke-Deutsche Werft AG (HDW) pour les marines allemande et italienne. Il est doté d'une propulsion diesel et d'un système supplémentaire de propulsion indépendante de l'air (AIP) utilisant des piles à combustible à hydrogène comprimé à membrane échangeuse de protons (PEM) Siemens."
 ITA_sub_hull_large_single_0:0 "Classe Tench"
 ITA_sub_hull_large_single_0_desc:0 "Les sous-marins de la classe Tench étaient un type de sous-marin construit pour la marine des États-Unis (USN) entre 1944 et 1951. Ils étaient une amélioration par rapport aux classes Gato et Balao, seulement environ 35 à 40 tonnes plus grandes, mais plus solidement construites et avec une disposition interne légèrement améliorée."
 ITA_screen_hull_medium_0:0 "Classe Aldebaran"
 ITA_screen_hull_medium_0_desc:0 "La classe Aldebaran était une classe de quatre frégates/corvettes / destroyers d'escorte exploités par la marine italienne. Ils sont entrés en service en 1951, le dernier ayant été mis hors service en 1976."
 ITA_screen_hull_medium_1:0 "Classe Centauro"
 ITA_screen_hull_medium_1_desc:0 "La classe Centauro était une classe de quatre frégates exploitées par la marine italienne. Ils sont entrés en service en 1957, le dernier ayant été détruit en 1985."
 ITA_screen_hull_medium_2:0 "Classe Alpino"
 ITA_screen_hull_medium_2_desc:0 "La conception a été conçue à l'origine comme une version agrandie des frégates de la classe Canopo. La conception a cependant été radicalement modifiée avec une suite de machines CODAG comprenant des turbines à gaz et des diesels. Ces navires ont introduit l'utilisation d'hélicoptères embarqués et de sonars à profondeur variable dans la marine italienne."
 ITA_screen_hull_medium_3:0 "Classe Lupo"
 ITA_screen_hull_medium_3_desc:0 "La classe Lupo est une classe de frégates construites par Cantieri Navali Riuniti (CNR) pour la marine italienne. Conçus comme des navires de guerre polyvalents mettant l'accent sur la guerre anti-surface (ASuW), ils ont connu un certain succès sur le marché d'exportation, acquis par les marines du Pérou et du Venezuela. Une petite version d'une version légèrement mise à jour est connue sous le nom de classe Soldati."
 ITA_screen_hull_medium_4:0 "Classe Maestrale"
 ITA_screen_hull_medium_4_desc:0 "La classe Maestrale est une classe de frégates de la navigation italienne. La classe est composée de huit navires, tous construits par Fincantieri spa, Riva Trigoso, à l'exception de Grecale, qui a été construit par Fincantieri spa – Muggiano, La Spezia."
 ITA_screen_hull_heavy_0:0 "Classe San Giorgio"
 ITA_screen_hull_heavy_0_desc:0 "La classe San Giorgio était une classe de deux destroyers de la marine italienne. Ils sont entrés en service en 1955, le dernier ayant été mis hors service en 1980. Anciennement des croiseurs de classe Capitani Romani de la Regia Marina (Marine Royale italienne) pendant la Seconde Guerre mondiale, ils ont été reconstruits en destroyers pendant la Guerre froide."
 ITA_screen_hull_heavy_1:0 "Classe Impetuoso"
 ITA_screen_hull_heavy_1_desc:0 "La classe Impetuoso a été le premier destroyer construit après la Seconde Guerre mondiale pour la marine italienne. Les deux navires ont été commandés en février 1950, sont entrés en service en 1958 et ont été retirés au début des années 1980."
 ITA_screen_hull_heavy_2:0 "Classe Impavido"
 ITA_screen_hull_heavy_2_desc:0 "La classe Impavido était le deuxième groupe de destroyers construits pour la marine italienne après la Seconde Guerre mondiale et les premiers destroyers lance-missiles italiens. De performances similaires à celles de la classe Charles F. Adams de l'US Navy, ces navires étaient essentiellement des navires améliorés de la classe Impetuoso, la tourelle arrière étant remplacée par un lanceur de missiles sol-air Tartar et un radar associé."
 ITA_screen_hull_heavy_3:0 "Classe Durand de la Penne"
 ITA_screen_hull_heavy_3_desc:0 "La classe Durand de la Penne sont deux destroyers lance-missiles exploités par la marine italienne. La conception est une version agrandie de la classe Audace, mise à jour avec des machines CODOG diesel et à turbine à gaz et des capteurs modernes. Quatre navires étaient prévus mais la deuxième paire a été annulée lorsque l'Italie a rejoint le projet Horizon."
 ITA_screen_hull_heavy_4:0 "Classe Orizzonte"
 ITA_screen_hull_heavy_4_desc:0 "La classe Horizon est une classe de destroyers de défense aérienne en service dans la Marine française et la Marine italienne, désignés comme des destroyers selon la classification OTAN. Le programme a débuté sous le nom de Frégate commune de nouvelle Génération (CNGF), une collaboration multinationale visant à produire une nouvelle génération de frégates de défense aérienne. En Italie, la classe est connue sous le nom de classe Orizzonte."
 ITA_battle_hull_light_0:0 "Classe Giuseppe Garibaldi"
 ITA_battle_hull_light_0_desc:0 "Après la guerre, il a été retenu par la marine italienne et modernisé avec des modifications mineures de l'armement et un radar. Il a été mis hors service en 1953 et reconstruit en croiseur lance-missiles."
 ITA_battle_hull_light_1:0 "Classe Andrea Doria"
 ITA_battle_hull_light_1_desc:0 "La classe Andrea Doria était des croiseurs d'hélicoptères de la marine italienne. Premiers grands nouveaux modèles italiens de l'après-Seconde Guerre mondiale, ces navires ont été principalement conçus pour des tâches de guerre anti-sous-marine. Initialement prévus pour trois navires, les deux navires construits, Andrea Doria et Caio Duilio, ont servi jusqu'en 1991 à la fois en activité et en formation."
 ITA_battle_hull_light_2:0 "Classe Vittorio Veneto"
 ITA_battle_hull_light_2_desc:0 "Le Vittorio Veneto était un croiseur hélicoptère qui a servi dans la marine italienne. Initialement destiné à être une classe de deux navires spécialement conçus pour la guerre anti-sous-marine (ASW), seul le Vittorio Veneto est entré en service en 1969, son navire jumeau Italia étant annulé."