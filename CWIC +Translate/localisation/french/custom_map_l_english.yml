 MAPMODE_HDI_MAP_MODE_DESCRIPTION:0 "Indique l'indice de développement humain de chaque État, qui reflète le niveau de vie, le niveau d'éducation et la situation économique au niveau local."
 hdi_map_mode_tooltip:0 "IDH de l'État : §Y[?From.State_HDI]§! $MAPMODE_CONSTANT$"
 hdi_map_mode_tooltip_delayed:0 "§YL'Indice de développement humain§! (IDH) reflète la qualité de vie globale au sein d'un État.\n\nIl reflète les résultats en matière §Gd'éducation§!, de §Yrevenus§! et de §Csanté§!, ainsi que l'accès aux infrastructures et le développement à long terme.\n\nLes États à §CIDH élevé§! sont plus §Gproductifs§!, §Gstables§! et résilients, tandis que les États à §RIDH faible§! souffrent de faiblesses structurelles et de tensions sociales."
 MAPMODE_NATIONAL_HDI_MAP_MODE_NAME:0 "IDH national"
 MAPMODE_NATIONAL_HDI_MAP_MODE:0 "IDH national $MAPMODE_CONSTANT$"
 MAPMODE_NATIONAL_HDI_MAP_MODE_DESCRIPTION:0 "Indique l'indice de développement humain global de chaque pays."
 national_hdi_map_mode_tooltip:0 "IDH national : §Y[?From.Owner:National_HDI]§!"
 national_hdi_map_mode_tooltip_delayed:0 "§YL'indice de développement humain§! (IDH) mesure le niveau moyen de développement d'un pays dans son ensemble.\n\nIl synthétise les §Gperformances économiques§!, les §Ccapacités éducatives§! et les §Yinvestissements sociaux§! à un niveau stratégique.\n\nLes pays affichant un §CIDH très élevé§! ont généralement des institutions plus solides, une plus grande cohésion sociale et une plus grande stabilité à long terme."
