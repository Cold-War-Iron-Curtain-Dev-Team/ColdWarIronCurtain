l_english:
 HUNGARIAN_REV.1.d:0 "Laszlo Rajk a récemment été réinhumé aux côtés de deux autres victimes des purges menées après la Seconde Guerre mondiale par le dirigeant hongrois Matyas Rakosi. Près de cent mille personnes ont assisté à la cérémonie. Cet événement marque l'aboutissement de l'une des nombreuses manifestations exigeant que Rakosi réhabilite Laszlo Rajk. Rajk était un dirigeant communiste populaire et le fondateur de l'agence de sécurité AVH. Rakosi a récemment admis avoir injustement fait juger et exécuter Rajk pour titisme, sous la pression de Moscou. Bien que les aveux de Rakosi n’aient pas été rendus publics, nombreux sont ceux, en Hongrie et au sein du parti, qui remettent désormais en question la capacité du gouvernement actuel, composé de dirigeants choisis par Rakosi. Cela renforce l’opposition contre Rakosi. Les communistes de la vieille garde sont mécontents de ces développements et reprochent au Premier ministre soviétique [SOV.GetLeader] d'être à l'origine de cette nouvelle ouverture qui a permis au peuple de s'en prendre aussi ouvertement à la direction du parti."
 HUNGARIAN_REV.2.d:0 "À la suite de la vague d'indignation suscitée par la réincarcération de László Rajk, les étudiants de Szeged ont pris position contre le régime communiste au pouvoir. Ils ont reconstitué l'Union des étudiants des universités et des académies hongroises (MEFESZ). Cette organisation étudiante démocratique avait été interdite depuis longtemps sous le régime de Mátyás Rákosi. À l'époque, la seule union étudiante autorisée était le DISZ, d'orientation communiste. En l'espace de quelques jours, les étudiants ont mis en place le MEFESZ dans plusieurs autres villes. Cette dernière provocation montre que le peuple hongrois commence à perdre confiance dans le gouvernement communiste dirigé par les dirigeants choisis par Rakosi. La question des syndicats étudiants peut sembler mineure, mais de nombreux membres du Parti communiste hongrois craignent que cela ne fasse que renforcer la dynamique hostile au parti et à l'héritage de Rakosi qu'il cherche à préserver."
 HUNGARIAN_REV.3.d:0 "Avec les étudiants hongrois expriment rapidement leurs opinions politiques et leurs aspirations pour la première fois depuis des décennies, les étudiants de l'université polytechnique de Budapest ont maintenant rejoint les manifesations. Ils ont rédigé une liste de seize exigeances nationales incluant, entre autres, des investigations dans le régime de Mátyás Rákosi, des éléctions libres, et un retrait de l'influence soviétique au sein du pays. Les étudiants de Budapest ont aussi annoncé leurs plans de rejoindre et soutenir l'Union des écrivains hongrois, car ils prévoient de déposer demain une couronne de fleurs devant la statue du célèbre héros de la révolution hongroise de 1848, le général polonais Józef Bem. C'est censé être fait dans un esprit de solidarité avec les activistes polonais qui se battent actuellement pour réformer leur nation. Cet évènement risque actuellement d'attirer une plus grande foule que prévu. Ces événements qui se déroulent rapidement et ces foules affolées rendent très difficile la réponse du gouvernement."
 HUNGARIAN_REV.4.d:0 "Une foule immense, comptant plusieurs dizaines de milliers de personnes, s’est rassemblée devant la statue du célèbre général Jozef Bem pour déposer une gerbe et manifester son soutien aux militants polonais qui luttent pour le changement. Peter Veres s’est adressé à la foule, appelant à l’indépendance de la Hongrie et à une libéralisation du système socialiste. Les manifestants ont entonné des chants patriotiques interdits et beaucoup ont commencé à découper les armoiries communistes sur le drapeau hongrois. La foule, pleine d'énergie, a ensuite défilé jusqu'au Parlement pour rejoindre les manifestants qui s'y trouvaient, portant le nombre de manifestants à plus de deux cent mille. Bien que les manifestations n'aient pas dégénéré en violences, elles sont énergiques et passionnées. De nombreux responsables du gouvernement communiste craignent désormais que la situation ne dégénère rapidement en anarchie."
 HUNGARIAN_REV.5.d:0 "À la suite des récentes manifestations qui ont secoué Budapest, le premier secrétaire du Parti communiste hongrois, Erno Gero, s’est adressé à la nation. Il a condamné les manifestants qui, plus tôt dans la journée, avaient formulé des revendications contre-révolutionnaires et incendiaires depuis la statue de Jozef Bem, avant d’organiser des actes de violence dangereux devant le Parlement. Il a déclaré que les manifestants n’avaient aucun droit et a rejeté toutes leurs revendications. Bien que les partisans de la ligne dure du Parti se réjouissent de ce discours, la réaction initiale des manifestants a été un profond mécontentement. Ils estiment que le gouvernement ignore le peuple et ne lui témoigne aucun respect, malgré leur engagement en faveur de la non-violence et de la manifestation pacifique. Beaucoup sont désormais ouvertement devenus des révolutionnaires."
 HUNGARIAN_REV.6.d:0 "En entendant l'intervention d'Erno Gero à la radio, les manifestants, déjà en ébullition, décidèrent de mettre en œuvre l'une de leurs revendications. Ils se rendirent au monument dédié à Staline et renversèrent la statue de ce dernier. Offerte par l'Union soviétique en 1951, cette statue était considérée comme un symbole de l'occupation étrangère de la Hongrie. Les manifestants s'en prirent à la tête de la statue pour exprimer leur colère. À la fin, il ne restait plus que les pieds de la statue, sur lesquels un drapeau hongrois fut hissé. À peu près au même moment, devant la station de radio, les manifestants et les membres de l'AVH ont commencé à s'affronter ; dans le chaos, l'AVH a ouvert le feu. Un jeune étudiant, Janos Vizi, a été tué sur le coup. Les manifestants ont enveloppé son corps dans un drapeau hongrois et l'ont porté avec eux, attisant la colère des autres manifestants. Les troubles se sont désormais encore intensifiés à travers Budapest et les manifestants ont désormais recours à la violence."
 HUNGARIAN_REV.7.d:0 "Après le discours d'Erno Gero à la nation, les manifestants se sont rassemblés devant la principale station de radio et ont envoyé une délégation pour faire relayer leurs revendications à l'ensemble du pays. Cependant, l'AVH, l'agence de sécurité hongroise, a arrêté la délégation et rejeté leurs revendications. Des rumeurs circulant parmi les manifestants concernant l'exécution des délégués ont poussé certains à tenter de prendre d'assaut le bâtiment. L'AVH a ouvert le feu, tuant des manifestants, et a lancé des grenades lacrymogènes sur la foule. Une tentative ratée d'acheminer davantage d'armes à l'aide d'une ambulance a encore exacerbé les tensions. Lorsque les troupes militaires sont arrivées pour relever l'AVH, les manifestants les ont acclamés, car les soldats avaient retiré leurs étoiles rouges de leurs casquettes. Les tirs de l'AVH ont poussé les manifestants à incendier des voitures de police et, plus important encore, des dépôts d'armes à travers Budapest ont été pillés. Les armes sont rapidement distribuées afin d'assurer une protection contre de nouvelles attaques du gouvernement."
 HUNGARIAN_REV.8.d:0 "Alors que la situation à Budapest dégénérait rapidement, le premier secrétaire du Parti communiste hongrois, Erno Gero, a appelé les forces soviétiques présentes dans le pays à intervenir. Gero a informé les Soviétiques que la situation avait pris une ampleur telle que le gouvernement n'était plus en mesure de la maîtriser. Les forces soviétiques présentes dans le pays s'étaient préparées à cette éventualité et, après plusieurs heures, le ministre soviétique de la Défense a autorisé le déploiement de chars à Budapest. Les forces soviétiques se sont mises en route tôt le matin et devraient avoir pris position au Parlement et aux carrefours stratégiques en début d'après-midi."
 HUNGARIAN_REV.9.d:0 "Les manifestants prenant désormais pour cible la police, les bâtiments gouvernementaux et les symboles du régime communiste, l'agence de sécurité AVH a tenté d'intervenir. Sur les sites gouvernementaux assiégés, ses agents ont ouvert le feu sur la foule ; cependant, ces actions n'ont fait qu'exacerber la colère des manifestants, sans parvenir à les disperser. L'ampleur et la propagation des manifestations ont clairsemé les effectifs de l'AVH et, les manifestants s'étant armés grâce aux dépôts d'armes capturés, l'AVH ne dispose plus de l'avantage de la puissance de feu. Les tentatives de déploiement de troupes hongroises en renfort de l'AVH ont été rapidement abandonnées, les premiers déploiements ayant vu les soldats rejoindre les manifestants. Les affrontements se sont poursuivis toute la nuit et jusqu'au petit matin. Là où les manifestants prennent le dessus, ils prennent ouvertement pour cible les membres de l'AVH."
 HUNGARIAN_REV.10.d:0 "Dans un revirement de situation spectaculaire, le Premier ministre hongrois a cédé le pouvoir à Imre Nagy. Ce dirigeant communiste très populaire avait récemment été démis de ses fonctions de président du Conseil des ministres en raison de ses appels à la réforme et de son opposition à l'ingérence soviétique. Dans son discours à la nation, il a appelé au calme et promis qu'il engagerait les réformes politiques nécessaires pour le pays. Cette annonce a légèrement apaisé les tensions, mais des affrontements sporadiques persistent, et selon certaines informations, les manifestants continueraient à s'armer. Bien que Nagy jouisse de la confiance du public, l'arrivée des forces soviétiques à Budapest et la poursuite des affrontements avec l'AVH font craindre à beaucoup que le nouveau Premier ministre ne dispose pas des moyens nécessaires pour contrôler la situation."
 HUNGARIAN_REV.11.d:0 "L'intervention soviétique s'est déroulée dans le chaos, des chars se retrouvant bloqués par les barricades érigées par les manifestants. La situation de l'AVH n'a cessé de se détériorer, ses forces ayant été chassées de la station de radio et se retrouvant de plus en plus en infériorité numérique. Les troupes soviétiques rassemblées devant le Parlement ont été accueillies par une foule immense. Des membres de l'AVH ont ouvert le feu sur les manifestants depuis des bâtiments voisins, ce qui a conduit les Soviétiques à prendre l'AVH pour cible, croyant qu'ils étaient eux-mêmes attaqués. Au milieu de la confusion, des manifestants armés ont pris pour cible les deux camps, exacerbant encore davantage la tension et le chaos. Au cours des jours suivants, des conseils révolutionnaires se sont formés pour coordonner la résistance armée, ce qui a entraîné de lourdes pertes pour les Soviétiques et l'AVH. Le Parti communiste hongrois a également fait l'objet de violentes représailles de la part de ces révolutionnaires. L'armée hongroise refusant d'intervenir, un cessez-le-feu a finalement été négocié par le Premier ministre Irme Nagy, et les Soviétiques ont accepté de se retirer de Budapest pour regagner leurs garnisons."
 HUNGARIAN_REV.12.d:0 "Le président Mao a rédigé une lettre exhortant le dirigeant soviétique [SOV.GetLeader] à faire preuve de patience et à ne pas intervenir dans la crise hongroise actuelle. Auparavant, le gouvernement avait exprimé son soutien à une intervention et les Soviétiques avaient apprécié notre point de vue sur la question. Cependant, cette lettre modifierait notre position et pourrait influencer [SOV.GetLeader], qui s'inquiète de la façon dont le monde communiste dans son ensemble percevrait une deuxième intervention. Nous devons décider s'il convient de veiller à ce que la lettre parvienne immédiatement à [SOV.GetLeader] afin d'essayer d'empêcher une intervention. Cependant, certains suggèrent qu'il vaudrait peut-être mieux laisser la situation en l'état, car nous avons déjà consulté les Soviétiques, et que tout commentaire supplémentaire ne ferait que compliquer la situation et nos relations."
 HUNGARIAN_REV.13.d:0 "Le gouvernement chinois a transmis au Premier ministre soviétique [SOV.GetLeader] une lettre du président Mao Zedong. Dans ce courrier, le dirigeant chinois nous exhorte à ne pas intervenir. Il met en garde contre les conséquences d'une telle action et appelle à la retenue. Il a proposé l'aide de la Chine pour faciliter un règlement pacifique de la crise. Nous sommes en contact permanent avec les Chinois à ce sujet et leur opinion peut nous donner une idée de la façon dont le monde communiste dans son ensemble pourrait réagir à une intervention. Si l'on en croit Mao, une intervention pourrait entraîner de nouveaux schismes et compromettre l'unité du mouvement socialiste mondial. Nous devons examiner attentivement cet avis et décider si nous devons suivre ses conseils et désamorcer la situation ou poursuivre nos préparatifs."
 HUNGARIAN_REV.14.d:0 "La situation en Hongrie continue de se détériorer. Des sources des services de renseignement et de l'armée comparent la situation à un état d'anarchie. Le gouvernement d'Irme Nagy affirme avoir calmé la situation et rétabli l'ordre. Cependant, selon des informations provenant de nos alliés communistes en Hongrie, Nagy serait faible et à la merci des forces contre-révolutionnaires. Nous disposons toutefois de rapports indiquant qu'une intervention militaire pourrait provoquer des protestations non seulement en Occident, mais aussi parmi les autres États socialistes. Par ailleurs, d'autres rapports soulignent que depuis sa nomination, Nagy a réduit la violence et qu'il pourrait être la force stabilisatrice dont nous avons besoin. Beaucoup préconisent de continuer à surveiller la situation. Nous pouvons certainement réévaluer la situation et intervenir plus tard si nécessaire ; cette option nous offre une certaine souplesse. Nous pouvons intervenir dès maintenant et empêcher cette anarchie de rompre définitivement les liens du peuple hongrois avec le socialisme."
 HUNGARIAN_REV.15.d:0 "Le gouvernement chinois a proposé de servir de médiateur dans les pourparlers entre nous et l'Union soviétique. Le Premier ministre soviétique [SOV.GetLeader] aurait accepté cette offre et cherche à résoudre cette question de manière pacifique. Les Chinois ont ajouté que les différends entre gouvernements révolutionnaires ne devaient pas déboucher sur la violence, car cela ne ferait qu'affaiblir l'unité et donnerait une mauvaise image. Il a également été laissé entendre qu'un refus de participer à ces pourparlers pourrait entraîner une intervention militaire soviétique de grande envergure. Accepter de participer aux pourparlers pourrait nous permettre de préserver certains des changements radicaux que nous avons accomplis et contribuer à garantir notre indépendance face à l'ingérence étrangère. Cependant, d'autres membres du gouvernement s'opposent à cette participation, affirmant que le risque d'une invasion soviétique est préférable à des compromis sur ce que le peuple exige."
 HUNGARIAN_REV.16.d:0 "\nÀ l'issue d'intenses négociations menées dans le sud de la Pologne, les représentants de la Hongrie et de l'Union soviétique sont parvenus à un compromis. Il y a peu encore, la situation entre les deux nations semblait déboucher sur un conflit armé à la suite de la révolution hongroise. Cependant, le gouvernement chinois a réussi à convaincre l'Union soviétique de laisser la Chine faciliter les pourparlers entre les deux parties et parvenir à une solution équitable. Les détails de l'accord final seront bientôt rendus publics, mais les rapports préliminaires indiquent que l'accord préserve un certain nombre de réformes internes hongroises. En échange, les Hongrois doivent garantir leur engagement envers le Pacte de Varsovie et le socialisme. Les diplomates chinois ont supervisé les négociations et contribué à faciliter les pourparlers jusqu'à leur conclusion. Dans une déclaration officielle du gouvernement chinois, ils ont annoncé que le nouvel accord montre comment les États socialistes résolvent leurs différends par la paix, et non par la guerre, contrairement à ce qui se passe en Occident."
 HUNGARIAN_REV.17.d:0 "Fidèle à son engagement en faveur de réformes politiques, le Premier ministre Irme Nagy a nommé plusieurs non-communistes au poste de ministre. Cette initiative sans précédent vise à apaiser les révolutionnaires à Budapest et à restaurer la confiance du peuple dans le gouvernement socialiste. Il s'agit d'une rupture radicale avec les régimes précédents, qui imposaient strictement un système à parti unique à l'ensemble du pays. Irme Nagy plaide depuis longtemps en faveur de la nécessité de réformes et d'une ouverture du système communiste actuel afin de répondre aux aspirations politiques des Hongrois. Cette décision s'attire déjà l'hostilité des communistes purs et durs du pays, qui craignent que Nagy ne capitule devant les révolutionnaires, qu'ils considèrent comme des contre-révolutionnaires et des agents de l'Occident."
 HUNGARIAN_REV.18.d:0 "Depuis le début de la révolution hongroise, la principale force d'opposition a été l'agence de sécurité AVH. Ses membres gardaient les sites gouvernementaux et ont été impliqués dans de violents affrontements avec les manifestants. Beaucoup d'entre eux sont accusés d'avoir ouvert le feu sur des manifestants non armés. Irme Nagy a récemment contribué à négocier un cessez-le-feu entre les forces pro-régime et les forces révolutionnaires. Il a déclaré qu'en dissolvant l'AVH, il mettrait fin à une source de conflit et de division. À la place de l'AVH, le Premier ministre a présenté des plans pour la formation d'une Garde nationale chargée de maintenir l'ordre public. Cette nouvelle force sera composée de révolutionnaires armés et de soldats du gouvernement qui travailleront ensemble pour rétablir la paix."
 HUNGARIAN_REV.19.d:0 "Pendant la hausse des tensions et de la violence, les travailleurs hongrois ont abandonné le gouvernement pour former des conseils locaux pour contrôler les questions municipales et déclencher des grèves dans tout le pays. Réalisant que ces conseils de travailleurs gagnent en popularité, le Premier ministre Nagy a autorisé la création de conseils de travailleurs sanctionnés locaux pour prendre soin de la gouvernance des municipalités et des conditions de travail. Les comités ont réagi positiviement à cette annonce et les grèves nationales ont été levées. En plus, une délégation de représentants de ces conseils arrivera bientôt pour rendre visite au Premier ministre et offrir son soutien à son gouvernement."
 HUNGARIAN_REV.20.d:0 "Dans le prolongement de la politique de réconciliation récemment lancée par le Premier ministre Imre Nagy, le gouvernement a annoncé la formation d’un gouvernement d’unité nationale qui comprendra plusieurs partis politiques auparavant interdits. Il a déclaré que ces partis, en collaboration avec le sien, garantiraient non seulement l’ordre, mais contribueraient également à définir l’avenir de la nation hongroise. Cela laisse entendre que la Hongrie s’oriente vers un État démocratique multipartite. Cette annonce marque de fait la fin du système du parti unique en Hongrie, une revendication majeure des révolutionnaires. Les Soviétiques et les communistes purs et durs ne verront pas ces développements d'un bon œil, car, d'un point de vue idéologique, le système du parti unique est considéré comme une composante essentielle d'un État socialiste en développement. Alors que le Premier ministre se fait des amis parmi l'opposition, son propre parti semble s'effondrer au milieu de ces changements spectaculaires."
 HUNGARIAN_REV.21.d:0 "\nDans un discours radiophonique adressé à la nation, le Premier ministre Imre Nagy a annoncé son intention de se retirer du Pacte de Varsovie et d’adopter une politique étrangère de neutralité. Pour de nombreux Hongrois, l’adhésion au Pacte de Varsovie symbolisait le maintien du contrôle soviétique sur leur pays. En se retirant, Nagy cherche à rétablir une politique étrangère indépendante pour la Hongrie. Cette annonce constitue également une menace directe pour l’Union soviétique et l’ordre qu’elle a instauré en Europe de l’Est après la Seconde Guerre mondiale. Le Premier ministre Nagy espère que les Soviétiques respecteront la volonté du peuple hongrois et ne prendront pas le risque de s'aliéner leurs autres alliés en adoptant une position dure à l'égard du pays. Il reste à voir si Nagy a vu juste dans son analyse des intentions soviétiques."
 HUNGARIAN_REV.22.d:0 "La dernière déclaration du Premier ministre Imre Nagy a profondément ébranlé les communistes hongrois. Beaucoup pensent désormais que Nagy ne se contente pas de capituler devant l’opposition, mais qu’il supervise ouvertement l’effondrement de l’ordre socialiste en Hongrie. Janos Kader, haut responsable du Parti communiste et ministre, a rencontré les dirigeants soviétiques à Moscou. Il leur a fait savoir que la Hongrie ne traversait pas une phase d’ajustement socialiste, mais qu’elle tombait aux mains des forces contre-révolutionnaires. La campagne de libéralisation menée par Nagy est allée bien au-delà de ce que toute autre société socialiste aurait toléré, et les communistes hongrois ont désespérément besoin que l'Union soviétique les protège. Il a également évoqué les exécutions extrajudiciaires de membres du Parti communiste au début des récents troubles, comme un exemple de ce qui se passera si Nagy n'est pas arrêté dès maintenant. Face à cette demande des communistes hongrois, les Soviétiques doivent décider s'ils vont intervenir ou essayer de faire en sorte que cela fonctionne avec le gouvernement Nagy."
 HUNGARIAN_REV.23.d:0 "L'Union soviétique a suivi de près la situation en Hongrie. Les forces soviétiques stationnées dans le pays ont tenté d'apporter leur aide au début, mais ont dû se retirer. Le programme de libéralisation annoncé par la suite par le Premier ministre Irme Nagy a semblé apaiser les tensions, malgré les critiques formulées par les communistes hongrois. Cependant, l'annonce récente du retrait de la Hongrie du Pacte de Varsovie et de sa neutralité a constitué une provocation pour l'Union soviétique. Partout dans le monde, on attendait la réaction soviétique qui s'est manifestée dans un communiqué publié par Moscou. Dans ce communiqué les soviétiques s'engagent à établir une nouvelle relation avec la Hongrie basée sur le respect mutuel et l'égalité. Il semble que les craintes d'une intervention militaire soviétique soient infondées, et les Soviétiques espèrent nouer des relations diplomatiques avec le régime. Il reste à voir ce que cela signifie pour les autres membres du Pacte de Varsovie et pour la position soviétique en Europe de l'Est."
 HUNGARIAN_REV.24.d:0 "La révolution hongroise, brève mais tumultueuse, s'est soldée par un bain de sang alors que les forces soviétiques ont envahi la Hongrie ces derniers jours. La décision du Premier ministre Imre Nagy de déclarer la neutralité de la Hongrie et de se retirer du Pacte de Varsovie s'est retournée contre lui, les Soviétiques ayant réagi par une intervention militaire. Les forces soviétiques ont d'abord désarmé les unités militaires hongroises et encerclé Budapest. Elles ont ensuite attaqué les forces révolutionnaires qui résistaient et, après de violents combats urbains, les forces soviétiques l'ont emporté, laissant la ville fortement endommagée. Le Premier ministre Nagy et d'autres hauts responsables révolutionnaires se sont réfugiés à l'ambassade yougoslave à Budapest. L'Union soviétique affirme avoir agi après que les communistes hongrois eurent demandé une intervention pour mettre fin à la contre-révolution et protéger les communistes de nouvelles violences, car beaucoup d'entre eux avaient été exécutés par les révolutionnaires au début du soulèvement. La résistance des Hongrois et le refus de leur armée de se rallier aux Soviétiques indiquent que tous les Hongrois n'ont pas accueilli favorablement cette intervention. Un nouveau gouvernement dirigé par Janos Kadar prendra le pouvoir pour rétablir le socialisme dans le pays."
 Golden_Team.1.d:0 "L'équipe nationale hongroise de football s'est imposée comme l'une des équipes les plus dominantes de ces dernières années, surnommée la « Golden Team ». Elle est dirigée par l'entraîneur Gusztav Sebes, ancien syndicaliste. Les joueurs phares sont Ferenc Puskas, Sandor Kocsis, Nandor Hidegkuti, Zoltan Czibor, Jozsef Bozsik et Gyula Grosics. Sebes a mis en place un programme de préparation physique scientifique, une flexibilité tactique et exige une polyvalence de la part de tous ses joueurs. Cela permet à l'équipe de pratiquer un jeu beaucoup plus dynamique qui enthousiasme les foules et lui permet de remporter des matchs. L'équipe a dominé certaines des grandes puissances traditionnelles du football, remportant notamment une victoire éclatante contre l'Angleterre sur son propre terrain. Le gouvernement salue ces victoires comme un exemple de la supériorité de l'homme socialiste. Parmi les Hongrois, ces victoires renforcent la fierté nationale, ce qui inquiète quelque peu certains communistes purs et durs."