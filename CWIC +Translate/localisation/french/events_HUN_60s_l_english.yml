l_english:
 HUN_Kadar.1.d:0 "La révolution hongroise et ses conséquences ont laissé des cicatrices profondes en Hongrie, tant pour la population que pour le gouvernement. Non seulement notre état doit faire face à un mécontentement croissant et à une économie en difficulté, mais il doit également trouver ses marques face à une population peu réceptive. Si la tâche qui nous attend est ardue, nous avons en même temps l'occasion rare de remodeler et de réformer en profondeur la société hongroise, ainsi que de sauver et de réformer en profondeur le système socialiste afin de mieux répondre aux besoins du Hongrois moyen. Nous faisons partie des premières lignes du Pacte de Varsovie, et nous devons prouver notre stabilité et notre fiabilité, et à force d'efforts, mettre en place un modèle économique capable de rivaliser même avec celui des États d'Europe occidentale."
 HUN_Kadar.2.d:0 "Imre Nagy était un destructeur capitaliste, et un traitre au sang froid. C'est factuel. En revanche, le leadership du Camarade Kádár fait toujours preuve de pragmatisme, et il sait reconnaître que même un traître peut avoir une ou deux idées intéressantes à exploiter. Nos alliés semblent faire preuve d'un zèle excessif dans leur rhétorique anti-occidentale. Bien que leur engagement en faveur de la cause socialiste soit une qualité admirable, nous tenons à ce que la guerre froide reste bien froide.\n\nDe plus, nous ne nous berçons pas d'illusions de grandeur sans fondement. Nous savons très bien que nous sommes loin derrière l'Occident dans presque tous les domaines, sauf en matière de moralité. Sans compter que si nous voulons un jour être reconnus comme un État à part entière, nous avons besoin à la fois du soutien de nos libérateurs soviétiques et de celui de l'Occident. Dans le même temps, nombreux sont ceux au sein de notre parti qui s'opposent catégoriquement à cette idée. Après tout, si nous allons trop loin, nous risquons une nouvelle intervention soviétique, sans parler du fait que faire trop de concessions inutiles reviendrait à anéantir notre économie déjà fragile."
 HUN_Kadar.3.d:0 "Le VIIIe Congrès du Parti est sans doute l'événement le plus crucial pour notre parti depuis la fin des terribles événements de 1956. C'est là que la nouvelle orientation de notre nation a été définitivement fixée, et que la question s'est posée de savoir quoi faire maintenant que nous avons un peu de répit.\n\nCamarade Kádár, et par extension, le parti, ont décidé de suivre les marches du Camarade Khrushchev et nous éloigner du chemin Staliniste, pour embrasser des réformes nécessaires; tels que l'amnistie générale, les réformes du marché, les politiques en faveur de la consommation et autres. Notre parti se revendique résolument socialiste, mais l'époque de l'autoritarisme inutile est désormais loin derrière nous, en tant que parti destiné à représenter et à élever le prolétariat, nous devons évoluer pour répondre à ses besoins."
 HUN_Kadar.4.d:0 "Maintenant que le Congrès s'est réuni et a adopté ses décisions, il est temps de répondre enfin à la question de la politique étrangère, notamment en ce qui concerne deux des plus grands défis auxquels nous sommes actuellement confrontés: celui de notre image, de notre déficit commercial et de nos finances publiques dans leur ensemble.\n\nLa première option, la préférée du Camarade Kádár, est de nouvrir au monde Occidental. Cela nous rapprochera encore davantage d’une reconnaissance internationale et nous permettra d’obtenir des prêts auprès des pays occidentaux, tant pour réinvestir que pour faire face aux coûts croissants liés à nos nouvelles politiques consuméristes. Cela dit, cela ouvre également la voie à toute une série de nouveaux problèmes, car cela risque de négliger nos échanges commerciaux déjà existants et indispensables avec nos alliés actuels, et de les laisser se détériorer, ce qui nous porterait préjudice, à nous comme à nos voisins. Sans parler du risque de s'attirer une seconde fois les foudres de l'Union soviétique, voire de notre propre parti. De plus, si les prêts constitueront une bouée de sauvetage dont nous avons désespérément besoin à court terme, notre économie n'est pas en mesure de rembourser des prêts importants, ce qui risquerait de provoquer une nouvelle crise.\n\nL'autre option, populaire parmi les membres conservateurs de notre parti, consiste à renforcer nos liens économiques tant au sein du COMECON que dans le monde socialiste. Cela permettra d'accroître le niveau de coopération et l'efficacité au sein du COMECON, de combler notre déficit en temps voulu, et de nous aider à développer notre économie dans une perspective à long terme. Cette option pose également des problèmes, car elle n'apporte aucune solution en matière de reconnaissance internationale, ce qui nous isole davantage de plus de la moitié du monde ; et bien qu'elle assure une croissance économique à long terme et une solution à notre déficit commercial, elle ne nous offre aucune solution immédiate à nos coûts croissants, que nous avons déjà du mal à suivre.\n\nLes deux propositions ont leurs mérites, mais nous ne pouvons pas choisir les deux. Il est temps de se décider."
 HUN_Kadar.5.d:0 "Ces derniers mois, nos camarades de Budapest ont déployé des efforts considérables pour développer en profondeur les infrastructures économiques et renforcer les liens entre nos alliés d'Europe de l'Est. Cela dit, la Hongrie reste confrontée à une multitude de problèmes qu'elle n'est pas en mesure de résoudre entièrement par ses propres moyens. L'économie hongroise repose en grande partie sur le commerce, qui peine à fonctionner pleinement en raison d'un déficit sans cesse croissant. De plus, la Hongrie est confrontée à l'augmentation des dépenses du gouvernement de Kádár, certains membres de notre parti considèrent que Kádár en est seul responsable, nous devrions toutefois envisager de lui envoyer une aide. Il serait insensé de garantir la dépendance économique de la Hongrie vis-à-vis de Moscou, ainsi que d'assurer la croissance à long terme de l'un de nos principaux alliés, sans que cela ne nous coûte grand-chose. Quoi qu'il en soit, c'est au parti de décider de la marche à suivre."
 HUN_Kadar.6.d:0 "Malgré notre succès sans précédent, de plus en plus de voix s'élèvent au sein du parti pour exprimer leur mécontentement face à la direction du camarade Kádár. Les murmures se multiplient, les rumeurs selon lesquelles le réformisme de Kadar flirte de manière trop dangereuse avec le capitalisme, les accusations selon lesquelles ses réformes ressemblent beaucoup trop à celles de Nagy pour être rassurantes. Ces voix semblent s'être amplifiées et intensifiées depuis que Kadar a commencé à remanier l'appareil du parti, écartant des conservateurs autrefois influents. Bien que rien ne soit certain pour l'instant, quelque chose de dangereux se prépare au sein du parti."
 HUN_Kadar.7.d:0 "À mesure que l'on comprend mieux qui se cache derrière la dissidence grandissante au sein du parti, de nombreux indices désignent l'ancien ministre de l'Intérieur, Bela Biszku. Autrefois personnalité politique de premier plan après 1956, souvent même considéré par beaucoup comme le bras droit de Kadar, Biszku a été rétrogradé, mis à l'écart et laissé pour compte après la mise en œuvre des politiques d'amnistie générale de Kadar et de sa décision de nommer des réformateurs. Biszku lui-même, bien qu'il ne soit pas opposé aux réformes nécessaires, s'est montré un fervent opposant aux éléments capitalistes du « communisme goulash », et nombreux sont ceux à Moscou qui le considèrent comme plus en phase avec la doctrine du Kremlin. Il n'a pris aucune mesure notable contre Kadar et s'est jusqu'à présent contenté d'être une voix critique de premier plan au sein du parti. Pour l'instant, nous ne pouvons que rester à l'affût et attendre."
 HUN_Kadar.8.d:0 "Le directeur du KGB, Youri Andropov, a récemment reçu une note intéressante et préoccupante de la part de nos amis de Budapest. Alors que nous continuons à nous éloigner des échecs de Khrouchtchev, nombreux sont ceux qui, en Hongrie, cherchent à se joindre à nous. \n\nUne coalition de conservateurs hongrois, menée par Bela Biszku, tombé en disgrâce, nous a sollicités pour que nous les aidions à renverser Kadar afin de rétablir un régime socialiste conservateur en Hongrie, dans le but de ramener le pays à une économie planifiée et de faire reculer une grande partie des réformes capitalistes de Kadar.\n\nD'une part, l'ampleur des réformes de Kádár, si elles ne sont pas maîtrisées, est assez dangereuse, et la Hongrie est vouée à faire face à de nouvelles crises si elle ne modère pas son rythme.\n\nDe plus, ses politiques et la justification de notre intervention s’inscrivent parfaitement dans la doctrine Brejnev, sans compter que de nombreux membres du KGB sont impatients de donner suite à cette demande. Quoi qu'il en soit, nous devons choisir celui qui, selon nous, sera le meilleur pour la Hongrie : Kadar ou Biszku."
 HUN_Kadar.9.d:0 "Une nouvelle choquante nous est parvenue de Moscou, où l'on nous a révélé qu'une tentative de coup d'État avait eu lieu. Un groupe de conservateurs du parti, rassemblé autour de Bela Biszku, a pris secrètement contact avec Moscou dans l'espoir d'obtenir l'aide du KGB, sous le couvert de la doctrine Brejnev. De nombreux membres du KGB avaient même pris le parti de Biszku ; cependant, une décision de dernière minute les a empêchés d'agir, et Kadar a été informé de la situation. Finalement, il a été décidé que le KGB continuerait à mener Biszku en bateau, afin de ne pas éveiller les soupçons ; tandis que le camarade Kadar écarterait discrètement Biszku de ses derniers postes de pouvoir, afin d'éviter que la situation ne soit rendue publique et de préserver la stabilité du parti."
 HUN_Kadar.10.d:0 "Les forces soviétiques se retrouvent une nouvelle fois déployées à travers la Hongrie à la suite d'un énième changement de gouvernement au sein du bloc de l'Est. En effet, les réformes de János Kádár, bien que populaires auprès du peuple, lui ont valu de nombreux ennemis au sein du parti. Beaucoup considéraient le « communisme goulash » comme une avancée directe vers le capitalisme, un problème qui n'a fait que s'aggraver lorsque Kádár a tenté de mettre à l'écart les conservateurs et les partisans de la ligne dure restants afin de remplir le parti d'éléments réformistes. Aujourd’hui, à Budapest, Bela Biszku, l’ancien ministre de l’Intérieur tombé en disgrâce, a été investi comme successeur de Kadar, ce dernier ayant été contraint de démissionner et de prendre sa retraite sous la pression du nouveau gouvernement conservateur et du KGB.\n\nBiszku a déjà commencé à purger le parti de ses réformateurs et a annoncé son intention d’abandonner les réformes économiques de Kadar pour ramener la Hongrie vers une économie planifiée. La population hongroise a réagi avec confusion et colère, le pays étant une nouvelle fois en proie à des émeutes et des manifestations. La réaction de la communauté internationale a été mitigée, avec des réactions d'indignation et de condamnation venant de l'Occident, et des éloges et de la reconnaissance venant de l'Est. Seul l'avenir nous dira ce que réserve le gouvernement de Biszku."
 HUN_Kadar.11.d:0 "L'Armée populaire hongroise est loin de correspondre à ce que nous considérons comme une force de combat moderne. Dans un monde idéal, la Hongrie pourrait se permettre une réorganisation et un renforcement à grande échelle de ses forces armées. Cependant, en réalité, non seulement la Hongrie n'en a tout simplement pas les moyens, mais nous n'en avons pas non plus besoin. Peut-être qu'un jour, à l'avenir, nous pourrons recréer une armée dont les Hongrois pourront être fiers, mais pour l'instant, notre attention se porte sur notre peuple et sur l'économie. Cela dit, cela ne signifie pas que nous pouvons simplement ignorer nos forces armées. Il est temps d'entamer un processus de réduction et de modernisation ; en réduisant nos forces armées, nous pourrons nous offrir un équipement meilleur et plus moderne, et une fois qu'elles auront été suffisamment modernisées, nous pourrons les agrandir à nouveau."
 HUN_Kadar.12.d:0 "Lors de la tentative réactionnaire de contre-révolution de 1956, certaines unités de l'armée de l'air de l'Armée populaire hongroise se sont rangées du côté des traîtres, ce qui a conduit les Soviétiques à la démilitariser de force pour notre propre sécurité. Bien que nous soyons reconnaissants que la Hongrie ne soit plus confrontée à une menace interne, nous sommes un pays situé en première ligne du Pacte de Varsovie et ne pouvons plus laisser nos aérodromes obsolètes et vides. Bien que nous ne puissions pas entièrement rééquiper et moderniser l'armée de l'air par nos propres moyens, compte tenu des lacunes de nos industries militaires, il s'agit néanmoins d'une tâche cruciale que nous devons entreprendre. La modernisation et l'extension de nos aérodromes contribueront également grandement à remercier nos alliés soviétiques pour leur aide en 1956, car nous pourrons garantir à leurs pilotes suffisamment d'espace pour les futures opérations en Europe occidentale et dans les Balkans."
 HUN_Kadar.13.d:0 "Alors que les effets du « communisme goulash » et du « socialisme de consommation » se répercutent dans toute la société hongroise, le peuple hongrois a étonnamment bien accueilli ces réformes. Beaucoup diront que cela tient intrinsèquement aux « éléments capitalistes » de nos réformes, perçus à tort ; cependant, rien n’est plus éloigné de la vérité, car le soutien de la population à notre gouvernement croît à un rythme que même nous n’aurions pu prévoir.\n\nSi nous parvenons à maintenir le cap de nos réformes et à étendre leur influence culturelle, nous pourrons assurer la pérennité de notre gouvernement, garantissant ainsi le socialisme sans le soutien de l’Union soviétique."
 HUN_Kadar.14.d:0 "Le socialisme étant désormais établi en Hongrie et les normes sociales évoluant sans cesse à l'échelle internationale, le parti se trouve confronté à une question cruciale : quel sera le rôle des femmes et des homosexuels dans notre République populaire ?\n\nD'un côté, nombreux sont ceux au sein de notre parti qui souhaitent leur accorder des droits au nom de l'unité socialiste, ainsi que pour préserver une image moderne ; des États comme l'Allemagne de l'Est vont même jusqu'à accorder aux homosexuels l'ensemble des droits légaux. Une nouvelle vague de soutien public de la part de ces groupes contribuerait à maintenir le soutien populaire dont bénéficie notre gouvernement et pourrait potentiellement alimenter notre industrie en pleine croissance par un afflux immédiat de nouveaux travailleurs.\n\nD'un autre côté, nombreux sont ceux parmi notre population, en particulier dans les zones rurales, qui adhèrent encore à des visions du monde farouchement conservatrices et dépassées, selon nos critères. Une libération précipitée comporte autant de risques de perturber davantage notre population que de gagner sa faveur.\n\nBien que nous n'ayons pas besoin de prendre une décision immédiate, il faudra en prendre une à terme, idéalement au cours de la décennie."
 HUN_Kadar.15.d:0 "La question du droit de vote des femmes est un sujet brûlant à l'échelle mondiale ; cependant, elle ne suscite pas autant d'intérêt ici, au sein de notre population majoritairement conservatrice, que dans des pays tels que la Grande-Bretagne ou les États-Unis. Néanmoins, même si les appels à l'action sont relativement discrets, le message passe tout de même, et plus nous laissons cette question en suspens, plus la situation s'aggravera ; laisser cette question sans réponse ne fera que nuire à l'image du parti auprès du public en cette période critique de reconstruction. Cela étant dit, la Hongrie a deux choix relativement simples : soit nous maintenons la position de notre nation d'avant la libération soviétique, soit nous cherchons à accorder le droit de vote aux femmes rapidement, tout bien considéré.\n\nNotre population est ridiculement faible par rapport au reste de l'Europe de l'Est, sans même parler de l'écart colossal qui nous sépare des pays d'Europe occidentale, où une poignée de villes à elles seules dépassent la population totale de notre pays. Si nous voulons assurer une croissance à long terme et garantir que nos usines ne manquent pas de main-d'œuvre, nous devons maintenir les femmes dans leur rôle traditionnel de mères. Cette voie satisfera également grandement les éléments les plus traditionalistes du pays, en particulier les quelques paysans qui subsistent.\n\nCependant, selon nos projections, le fait de permettre aux femmes d'occuper les mêmes postes que les hommes n'aura pas d'incidence notable sur le taux de natalité de notre pays ; or, nos usines ont besoin de main-d'œuvre dès maintenant, et non plus tard, surtout si nous voulons continuer à augmenter la production nationale de biens de consommation. Le monde ne fait que donner l'impression de devenir plus progressiste dans ses opinions sur les rôles traditionnels des sexes, et si nous choisissons de maintenir notre position traditionnellement intransigeante, nous n'aurons pas seulement à nous soucier de la stabilité interne, mais aussi de la pression internationale exercée par les deux camps de la Guerre froide.\n\nMême si nous n'avons peut-être pas encore de réponse, nous sommes tous d'accord sur un point : nous devons décider de la voie à suivre dès que possible, de préférence dès maintenant."
 HUN_Kadar.16.d:0 "La Hongrie compte une population homosexuelle relativement restreinte, qui s'inscrit dans une population mondiale tout aussi réduite. Beaucoup se demandent pourquoi nous avons choisi de prendre position si tôt, mais nombreux sont ceux au sein du parti qui souhaitent éviter les problèmes futurs qui ne manqueront pas de surgir si nous repoussons trop longtemps cette question. Bien que cela puisse paraître déroutant pour certains, le fait de définir clairement la position du parti dès maintenant nous donnera une orientation claire pour l'avenir. Tout comme la question du droit de vote des femmes en Hongrie, la question de l'homosexualité offre deux réponses simples entre lesquelles nous devons choisir : soit préserver les valeurs traditionnelles de notre nation, soit nous moderniser pour mieux nous adapter aux normes modernes et aux idéaux socialistes.\n\nRefuser de changer quoi que ce soit ne suscitera probablement aucune réaction négative immédiate ni n'attirera l'attention internationale. Nous pouvons continuer comme si de rien n'était et ne rencontrer, au mieux, qu'une résistance marginale. La population homosexuelle en Hongrie ne fera que croître avec le temps, quoi que nous fassions, et à mesure que cette population augmentera, la contestation à l'échelle nationale s'intensifiera également.\n\nÀ l'inverse, la contestation que nous susciterait la dépénalisation de l'homosexualité s'estomperait probablement et disparaîtrait avec le temps, tandis que le maintien de la pénalisation à long terme ne ferait qu'amplifier la contestation, plus nous nous accrocherons à un passé dépassé. Le principal problème lié au maintien de la criminalisation de l'homosexualité est qu'elle contredit la politique d'amnistie générale du camarade Kadar, ses objectifs de rapprochement avec la population générale, ainsi que la clémence et la libéralisation culturelle globales. Dans le même temps, légaliser l'homosexualité à la hâte ne fera qu'aliéner davantage nos populations rurales, même si celles-ci sont en forte diminution.\n\nMême si l'on pourrait avancer des arguments pour et contre chaque point de vue, et que le débat pourrait se poursuivre, nous sommes ici pour prendre une décision, pas pour discuter."
 HUN_Kadar.17.d:0 "Les militants des droits civiques du monde entier ont réagi avec stupéfaction et horreur aux nouvelles en provenance de Budapest aujourd’hui, après l’annonce, en début de journée, de la décision non seulement de maintenir, mais aussi d’étendre la base de données hongroise sur l’homosexualité. Créée dans les années 1880, avant même l'effondrement de l'Autriche-Hongrie, utilisée tout au long de la Seconde Guerre mondiale et même sous le règne d'Imre Nagy, cette base de données servait de registre pour tous les homosexuels recensés vivant en Hongrie et était utilisée pour justifier ou déclencher des arrestations massives et des emprisonnements visant à identifier les homosexuels dans le pays. Dans le cadre de la politique d’amnistie générale menée par Janos Kadar et de ses efforts pour réformer la culture hongroise dans une direction plus progressiste, beaucoup s’attendaient au moins à un assouplissement de la position sur le sujet, voire à la dépénalisation totale de l’homosexualité. Cependant, il a récemment été décidé que la base de données serait élargie, avec des rapports faisant état de nombreuses personnes répertoriées dans la base de données appréhendées par la police, victimes de chantage et menacées de voir leurs noms révélés afin d’élargir la base de données, et d’un durcissement des sanctions associées à l’homosexualité. Cette décision récente a suscité de vives réactions tant de la part de l’Union soviétique que des États-Unis, de nombreux observateurs politiques notant que cela ne servira probablement qu’à entraver les tentatives de Kadar d’obtenir la reconnaissance occidentale de son gouvernement."
 HUN_Kadar.18.d:0 "Les militants pour les droits des homosexuels du monde entier ont célébré aujourd’hui une étape importante, alors que des informations en provenance de Budapest indiquaient que János Kádár avait annoncé la destruction de la base de données hongroise sur l’homosexualité. Créée dans les années 1880 sous l’Empire austro-hongrois, utilisée pendant la Seconde Guerre mondiale et sous le régime de Nagy, cette base de données servait de registre répertoriant tous les homosexuels recensés vivant en Hongrie et était utilisée pour justifier des arrestations et des incarcérations. Compte tenu des politiques d'amnistie générale et des mesures sociales progressistes de Kadar, beaucoup s'attendaient à une position plus modérée, mais ne s'attendaient pas à cette décision. Avec la libéralisation continue de la culture et du cadre juridique hongrois, la position plutôt dure que beaucoup adoptaient autrefois à l'égard du nouveau régime post-1956 a commencé à s'assouplir. Cependant, les détracteurs les plus virulents de Kadar voient dans la destruction de la base de données un moyen de dissimuler et de passer sous silence d'autres violations des droits de l'homme. Quoi qu'il en soit, nombreux sont ceux qui pensent que la légalisation totale de l'homosexualité en Hongrie est en vue !"
 HUN_Kadar.19.d:0 "Magyar Radio Es Televizio, également connue sous le nom de Radio et Télévision hongroises (en abrégé MTV), constituera notre premier et, pour l'instant, notre plus grand réseau de radiodiffusion télévisuelle et radiophonique dans le pays, marquant ainsi une première étape cruciale sur le long chemin de la modernisation. À terme, nous pourrons organiser et centraliser les émissions de télévision et de radio provenant de l'ensemble du bloc de l'Est afin qu'elles puissent être regardées et écoutées en Hongrie. Si cela constitue un luxe pour notre population et s'avère crucial pour garantir à la fois le soutien du public et le développement culturel, cela répond également à des objectifs plus concrets et pratiques en matière d'archivage des informations et des événements importants."
 HUN_Kadar.20.d:0 "La comédie musicale « Le Mandarin merveilleux » est un ballet pantomime en un acte qui met en scène une jeune fille vivant dans la grande ville, sans le sou, entourée d’une bande de clochards. Au fil de la nuit, elle attire plusieurs hommes dans sa chambre, mais aucun d’entre eux n’a d’argent, jusqu’à ce qu’elle et les clochards repèrent un riche mandarin. Alors qu'elle l'attire dans sa chambre, elle se met à danser de manière séduisante ; à mesure que la passion du mandarin monte, il se jette sur la femme, ce qui pousse les clochards à le maîtriser et à l'étouffer. Le mandarin est poignardé à trois reprises avec une épée rouillée, avant d'être pendu à une lampe. La femme tente de convaincre les hommes de laisser le Mandarin partir, mais celui-ci meurt alors qu’ils s’étreignent enfin. \n\nInitialement interdite en Allemagne en 1926 pour des raisons morales, il s’agit d’une pièce ancienne, bien loin de ce que beaucoup considéreraient comme une œuvre « sans risque » à diffuser. Cependant, Le Mandarin merveilleux, aussi contestable soit-il, s’est ancré dans notre histoire comme la première émission télévisée entièrement en couleur."
 HUN_Kadar.21.d:0 "Bien qu'il s'agisse d'une initiative relativement récente, la préservation de notre histoire nationale sous toutes ses formes revêt une importance croissante et constitue un outil indispensable pour les générations futures. L'une des façons d'y parvenir consiste à créer des archives destinées à stocker et à conserver l'ensemble de nos programmes télévisés et radiophoniques. Compte tenu du rôle crucial que joue MTV dans la programmation médiatique hongroise, lui confier la création d'une archive est un moyen quasi garanti de préserver l'intégralité de notre histoire audiovisuelle. MTV compte déjà plus de 2 millions de téléspectateurs, soit près de 3 % de notre population totale, avec une estimation de 3 à 5 téléspectateurs par téléviseur. Beaucoup d'entre nous ne vivront peut-être pas assez longtemps pour voir les avantages de ces archives, qui ne se feront probablement pas sentir avant la fin de cette guerre froide, mais un jour, nous en bénéficierons."
 HUN_Kadar.22.d:0 "« Reklam Ur », ou « Monsieur Publicité », est l’un des nombreux chefs-d’œuvre musicaux créés par nos talentueux artistes. Cette chanson, qui célèbre la beauté et les joies de la vie, est le reflet de notre réussite et la preuve que nos réformes portent leurs fruits. Notre peuple est heureux et peut profiter de la musique comme nulle part ailleurs au sein du Pacte de Varsovie ; en tant que gouvernement, cela montre que nous n'avons pas besoin de recourir à l'intervention pour obtenir les résultats que nous souhaitons. Grâce à la stabilité et à la légitimité, si nous parvenons à maintenir ce cap, les blessures de 1956 cicatriseront facilement, et nous pouvons compter sur notre musique pour nous aider dans cet effort."
 HUN_Kadar.23.d:0 "Alors que les répercussions culturelles du « Goulash Communison » ne cessent de se faire de plus en plus sentir, nous devons désormais tourner notre attention vers la jeunesse. Notre système éducatif n'a historiquement pas été des plus performants, et il n'est en rien comparable aux normes élevées des pays d'Europe occidentale. Si nous voulons garantir une future génération de prolétaires loyaux, nous devons veiller à la qualité du système et nous assurer qu'il retienne l'attention de tous nos futurs étudiants. En fin de compte, l'objectif est de réformer notre système éducatif afin de former des travailleurs à la fois compétents et loyaux."
 HUN_Kadar.24.d:0 "Nos efforts pour moderniser notre pays et notre culture commencent par nos enfants, et à mesure que nous nous appuyons davantage sur des secteurs plus professionnels et spécialisés, nous devons veiller à ce que nos futurs travailleurs soient dotés dès leur plus jeune âge, des outils nécessaires pour s'épanouir dans une société hongroise moderne. Le programme du Parti est ambitieux, et si nous disposons d'une génération pour le consolider, nous pouvons pratiquement garantir une Hongrie éduquée et pleinement consciente de ses classes sociales. Ce programme vise à former rapidement nos paysans, jeunes et vieux, à élargir les possibilités d'enseignement supérieur grâce à des écoles techniques et professionnelles, et à soutenir cet effort éducatif avec l'aide de professeurs et d'enseignants soviétiques. Même si cela peut nécessiter un effort concerté, nos projets sont réalisables et indispensables."
 HUN_Kadar.25.d:0 "Alors que le consumérisme socialiste continue de s’imposer comme un pilier de la culture hongroise, c’est notre capacité à garantir que l’abondance des biens de consommation parvienne jusqu’à nos travailleurs qui déterminera ce qui nous distingue de l’interprétation capitaliste et exploiteuse du consumérisme. Non seulement nous fabriquerons la plupart de nos produits sur place, mais nous veillerons également à ce que notre peuple ne manque jamais de rien et n’ait jamais à se battre pour obtenir les produits de première nécessité. Réfrigérateurs, téléviseurs, automobiles, jeux de société : tout ce dont nous avons besoin peut être fabriqué ici et vendu ici. Cela dit, nous ne pouvons pas tomber dans le même piège que nos camarades est-allemands, et nous sommes conscients de la nécessité absolue du commerce extérieur et des échanges internationaux. Nous réintégrerons la scène mondiale en tant qu’exportateurs de marchandises, et non en tant qu’importateurs. Un jour, si nous nous y appliquons, les produits fabriqués en Hongrie seront présents dans tout le bloc de l'Est, peut-être même à Moscou même, voire au-delà. Avant de pouvoir tourner notre attention vers l'étranger, nous devons d'abord nous assurer que nos foyers sont bien approvisionnés en produits hongrois."
 HUN_Kadar.26.d:0 "« Gazdalkodj Okosan », ou « Gérez vos finances avec sagesse », est une nouvelle illustration non seulement de l'emprise du consumérisme sur la société hongroise, mais aussi de la popularité des réformes du camarade Kádár. Le but du jeu est d'économiser suffisamment pour acheter une maison et l'aménager avec des articles tels que des aspirateurs, du mobilier de salon et de cuisine, des radios, des machines à laver et des machines à coudre. Le premier joueur à avoir meublé la maison et à avoir économisé au moins 2 000 Ft en bons d'épargne remporte la partie. Bien que très similaire au Monopoly, ce jeu a pour but de mettre en avant nos réformes et n'est qu'une goutte d'eau dans l'océan des jeux de société et des divertissements que nous développons et proposons au public. Avec des ventes record et d'excellentes critiques, sa popularité est évidente et constitue une preuve supplémentaire que nous sommes sur la bonne voie. Si nous continuons ainsi, la popularité de notre administration dépassera celle du traître Imre Nagy et ne sera qu'une étape parmi tant d'autres vers la consolidation du communisme goulash."
 HUN_Kadar.27.d:0 "Même si, dans l'idéal, nous pourrions un jour lancer notre propre industrie automobile nationale, notre population a besoin de voitures dès maintenant, d'autant plus que nous cherchons à étendre, rénover et construire de nouvelles autoroutes à grande échelle. Compte tenu de la popularité des voitures étrangères, en particulier des « muscle cars » soviétiques, dans le bloc de l'Est et à l'échelle internationale, qui de mieux pour nous venir en aide que nos fidèles alliés de Moscou ? Parmi toutes leurs voitures, la série « Volga » en particulier est déjà très appréciée de notre population ; si nous voulons continuer à les séduire, pourquoi ne pas leur offrir davantage de ce qu’ils souhaitent ? Nous allons accroître la disponibilité des Volga, les rendre plus abordables pour le grand public, tout en déployant des efforts concrets pour réduire notre déficit commercial. Nos amis soviétiques apprécieront certainement l’intensification de nos échanges commerciaux et les recettes supplémentaires qui leur reviendront."
 HUN_Kadar.28.d:0 "La société Lehel, fondée en 1945, est le plus grand fabricant hongrois d'appareils électroménagers. Bien qu'elle propose toutes sortes d'appareils, elle s'est récemment fait connaître surtout pour ses réfrigérateurs. Si à première vue ceux-ci n'ont rien d'exceptionnel, les réfrigérateurs Lehel sont conçus pour durer, avec une durée de vie de plusieurs décennies et une grande robustesse. Bien que ce ne soit pas grand-chose en soi, le réfrigérateur Lehel témoigne de la qualité indéniable et objective des produits hongrois fabriqués localement. Non seulement ces produits sont appréciés par notre population et continueront de l'être, mais on trouve des produits fabriqués en Hongrie de Berlin-Est à Moscou, et peut-être un jour jusqu'à Washington même. En continuant à produire pour nous-mêmes et en veillant à ce que notre population vive dans l'abondance, nous nous forgerons une réputation, ainsi qu'à nos produits, bien au-delà de nos frontières. "