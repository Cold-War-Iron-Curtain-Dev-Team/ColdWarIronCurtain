l_english:
 BRA_Mongrel_Complex: "Complexe Bâtard"
 BRA_Mongrel_Complex_desc: "Le Complexe bâtard découle de ses expériences historiques, y compris la colonisation et l'esclavage, qui ont façonné un paysage social diversifié mais difficile. De nombreux Brésiliens se comparent aux normes de progrès européennes et américaines, ce qui peut éclipser leurs propres réalisations et favoriser un sentiment d'inadéquation.\n\nCe sentiment d'infériorité est évident dans la culture, où les artistes brésiliens mesurent souvent leur valeur par rapport aux influences étrangères. En politique et en économie, le désir de développement conduit les Brésiliens à rechercher des modèles externes de gouvernance et d'industrie, ignorant souvent leurs propres forces uniques, telles que le patrimoine culturel dynamique et les ressources naturelles."
 BRA_Legacy_of_the_Estado_Novo: "Héritage de l'Estado Novo"
 BRA_Legacy_of_the_Estado_Novo_desc: "Malgré la fin de la dictature de Getúlio Vargas en 1945, ses structures persistent encore dans la politique brésilienne. Être aimé par beaucoup parmi la population pour son héritage en tant que parangon pour les droits de l'ouvrier commun, et son charisme de populiste, proche du peuple qui se heurtait à l'élite politique traditionnelle.\n\nEven après avoir été renversé en 1945, Vargas jouissait toujours d'une grande popularité, étant élu sénateur par deux États et législateur par six, et le manque d'identification des partis d'opposition parmi la population syndicale, il ne fait aucun doute que toute avancée politique de Vargas rencontrerait un soutien écrasant."
 BRA_Communist_Agitation: "Agitation communiste"
 BRA_Communist_Agitation_desc: "Le PCB est une épine dans notre pied depuis sa fondation en 1922. Bien qu'il ait été interdit pour la troisième fois par le président Dutra en 1947 et ses parlementaires révoqués l'année suivante, sa popularité parmi la classe ouvrière est indéniable, gagnant plus d'un demi-million de voix aux élections de 1945, ce qui en fait vraiment un ennemi que nous ne pouvons pas sous-estimer."
 BRA_Coffee_Economy: "Économie du Café"
 BRA_Coffee_Economy_desc: "Produisant un tiers de l'approvisionnement mondial en café, le Brésil est de loin le plus grand producteur de café au monde sur la planète. Les États de São Paulo, Minas Gerais et Paraná abritent la plupart des plantations en raison de leurs conditions de croissance idéales grâce au climat. Avec plus de 60% des exportations brésiliennes étant uniquement du café, il est un aliment de base de l'économie du pays depuis le début, apprécié par de nombreux pays dans le monde en raison de sa saveur unique, le café brésilien assumant parfois le statut de produit de luxe dans certains."
 BRA_ISI: "Substitution des importations"
 BRA_ISI_desc: "L'industrialisation par substitution aux importations, ou ISI en abrégé, était une stratégie adoptée par Vargas dans le but de réduire la dépendance du Brésil à l'égard des marchandises importées et de faire face à la Grande Dépression. Cette politique visait à encourager la production nationale, en favorisant le développement des industries nationales. L'idée centrale était de remplacer les marchandises importées par des produits fabriqués localement, renforçant ainsi l'économie nationale et créant des emplois dans le pays.\n\nEn encourageant la production nationale, le gouvernement Vargas a cherché à créer une base industrielle solide au Brésil. Cela était essentiel pour la modernisation de l'économie brésilienne, jusque-là essentiellement agricole. La politique de substitution des importations a également eu un impact significatif sur la balance commerciale du pays, réduisant le déficit et favorisant l'autosuffisance dans divers secteurs."
 BRA_Underdeveloped_Infrastructure: "Infrastructure sous-développées"
 BRA_Underdeveloped_Infrastructure_desc: "Les routes, les chemins de fer et l'industrie se sont toujours concentrés sur la côte et dans les énormes centres démographiques et économiques, laissant une grande partie de l'intérieur du pays sous-développée."
 BRA_Veterans_of_Monte_Castelo: "Vétérans de Monte Castelo"
 BRA_Veterans_of_Monte_Castelo_desc: "La FEB a combattu courageusement en Italie pendant la Seconde Guerre mondiale, ces vétérans ont ramené l'expérience du combat et la gloire à la maison."
 BRA_Weak_Arms: "Faible Industrie Nationale De L'Armement"
 BRA_Weak_Arms_desc: "Notre industrie nationale de l'armement est faible, ce qui nous rend fortement dépendants des importations."
 BRA_Amazon_Frontier: "Frontière Amazonienne"
 BRA_Amazon_Frontier_desc: "De nombreuses richesses attendent d'être revendiquées dans la région amazonienne. Avec des investissements judicieux et judicieux, nous pourrions tirer parti de nos trésors naturels pour dynamiser notre pays comme il ne l'a jamais été."
 BRA_Vale: "Vale S.A."
 BRA_Vale_desc: "La Companhia do Vale do Rio Doce, ou Vale en abrégé, est une société minière nationale financée par Vargas en 1942. Elle opère principalement en alimentant en fer les riches gisements de fer du Brésil vers les aciéries du pays, en raison du manque de demande, elle se développe lentement, mais avec les bons conseils, elle peut devenir l'une des plus grandes entreprises de la planète."
 BRA_Rural_Exodus: "Exode rural"
 BRA_Rural_Exodus_desc: "Chaque mois, d'innombrables familles quittent la campagne rurale de notre pays, motivées par de meilleures conditions de vie et d'emploi, motivées par des facteurs tels que l'industrialisation et la mécanisation de l'agriculture, qui provoquent le chômage à la campagne et les opportunités dans les grandes villes. Venant principalement du nord - Est et cherchant à échapper aux sécheresses sévères qui affectent la région chaque année, venant dans les zones métropolitaines de São Paulo et Rio de Janeiro. Bien que cela crée plus de main-d'œuvre dans les centres urbains, cela entraîne également une croissance désordonnée des zones urbaines, la création d'infrastructures précaires, l'augmentation de l'informalité et le manque de main-d'œuvre à la campagne, avec des impacts sur la production agricole et le développement rural."