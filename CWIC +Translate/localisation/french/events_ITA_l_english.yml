l_english:
 ITA_trieste_crisis_category:0 "La crise de Trieste"
 news_trieste.1.d:0 "Après une courte campagne, l'armée italienne a réussi à prendre le contrôle de la ville de Trieste et de ses environs immédiats. Cela survient après que les tensions sur la ville ont éclaté depuis la fin de la Seconde Guerre mondiale. Après la conclusion de ladite guerre, la région a été scindée et placée sous la juridiction des Nations Unies via le Territoire libre de Trieste. Cependant, la région est connue pour sa population ethniquement divisée et constitue un point de discorde majeur sur la propriété entre la Yougoslavie et l'Italie. Au fur et à mesure des discussions sur la dissolution du Territoire libre, les tensions se sont transformées en un conflit armé pur et simple entre les deux nations. À la surprise de la communauté internationale, les forces italiennes ont été capables de mettre en déroute les forces yougoslaves des zones A et B du territoire et ont annoncé leur intention d'annexer toute la région. Cette décision a été largement condamnée par la Yougoslavie ainsi que par divers pays communistes."
 sieze_trieste:0 "S'emparer de Trieste"
 sieze_capodistria:0 "Avancer vers Capodistria"
 ITA_trieste_crisis_category_desc:0 "Depuis quelques années, la ville de Trieste et ses environs ont été sous occupation des forces anglo-américaines ; tandis que l'armée yougoslave occupait la partie sud du Territoire Libre. Alors que le Maréchal Tito faisait pression sur les Nations Unies et les Alliés pour obtenir le Territoire libre de Trieste et l'annexer à la Yougoslavie, nous devons tout faire pour regagner ce qui a était, et sera toujours, la terre italienne. Même par la force."
 ITA_YUG_war:0 "Conflit italo-yougoslave"
 ITA_won_trieste:0 "Victoire italienne à Trieste"
 sieze_trieste_desc:0 "La zone A du Territoire Libre de Trieste est la zone située autour de la ville de Trieste et ses environs."
 ITA_trieste.6.d:0 "D'excellentes nouvelles nous sont parvenues de l'état-major des forces armées: nos forces à Trieste ont réussi à sécuriser l'intégralité du territoire libre de Trieste. Selon les rapports, l'armée yougoslave était mal préparée à faire face à un assaut majeur et a été rapidement chassée de la région. Après avoir repoussé les forces yougoslaves, nos forces ont établi des fortifications à la frontière qui étaient capables de repousser les contre-attaques des forces yougoslaves. Cela contribuera certainement à consolider l’héritage du gouvernement actuel dans sa tentative de récupérer une partie de nos pertes de la guerre précédente. Plus important encore, un échec à ce niveau aurait sûrement conduit à l’effondrement du gouvernement actuel et à des dommages majeurs lors des prochaines élections. Cela étant dit, la réaction internationale, notamment de la part des pays non alignés et du bloc soviétique, ne tardera pas à condamner nos actions. Il sera toujours nécessaire de veiller à ce que nos alliés de l’OTAN, en particulier les États-Unis, continuent de collaborer étroitement avec nos forces armées et de nous fournir des équipements pour préserver nos acquis."
 sieze_capodistria_desc:0 "Capodistria, également connue sous le nom de Koper, est la zone située au sud de Trieste qui est actuellement occupée par l'armée yougoslave, bien qu'étant formellement en territoire libre, c'est en tous points un territoire yougoslave."
 Italy_Gladio_Coup.1.d:0 "Dans une série d'événements choquants en Italie, le commandant des Carabinieri, Giovanni de Lorenzo, a pris le contrôle du gouvernement. Cela fait suite à l'assassinat de l'ancien Premier ministre par des sympathisants communistes. Outre la saisie des principaux médias et institutions gouvernementales par les Carabiniers au début du coup d'État, les locaux du Parti Communiste italien, du Parti Socialiste Italien et du Parti Socialiste Italien d'Unité Prolétarienne ont été occupés et de nombreuses arrestations ont été effectuées sur la base de reportages locaux. La réponse internationale a été au mieux mitigée, les États-Unis soutenant cette décision comme une étape nécessaire vers le rétablissement de la stabilité en Italie, tandis que d'autres ont critiqué cette décision comme violant les principes démocratiques ainsi que le bloc soviétique condamnant la nouvelle répression des partis pro-soviétiques en Italie."
 Italy_Gladio_Coup.2.d:0 "L'Italie a connu des troubles importants ces dernières années avec des conflits entre les forces néofascistes, communistes et gouvernementales. Cependant, la situation a atteint de manière inattendue de nouveaux sommets avec des militants du Front National, de l'Avant-Garde Nationale et des dissidents au sein de l'armée et des services de sécurité lançant un coup d'État contre le gouvernement. Dans les heures qui ont suivi le début du coup d'État, les militants ont rapidement pu prendre le contrôle du ministère de l'Intérieur avec leurs stocks d'armes lourdes. Plusieurs ministres du gouvernement, dont le Premier ministre et le chef de la police nationale, ont été exécutés et des unités militaires soutenant le coup d'État ont cherché à s'emparer des bastions du Parti communiste italien. Le coup d'État semblant avoir réussi, le dirigeant, Junio Valerio Borghese, héros de guerre italien réputé pendant la Seconde Guerre mondiale et fasciste intransigeant, a été déclaré chef du nouveau gouvernement."
 ita_communist.1.d:0 "Les résultats des élections nationales italiennes sont connus et le Partito Comunista Italiano (PCI) a remporté une victoire écrasante. Dirigé par Palmiro Togliatti, le parti a réussi à remporter 335 sièges sur 574, une victoire écrasante sur le Parti chrétien-démocrate et d'autres opposants. L'élection, fortement influencée par des puissances extérieures, avec les États-Unis soutenant les démocrates-chrétiens et l'Union soviétique soutenant le PCI, a montré la puissance politique de l'Union soviétique et sans aucun doute, accru sa sphère d'influence. Ce résultat électoral était redouté par les membres de l'OTAN car une autre nation est tombée aux mains du communisme, tout comme le coup d'État communiste de 1948 en Tchécoslovaquie. Togliatti n'a pas encore annoncé quelle position le pays adoptera ensuite. Certains spéculent que le nouveau régime pourrait se retirer de l'OTAN et même rejoindre le Kominform, car Togliatti est un stalinien. C'est en effet un tournant pour l'Europe et peut très bien en être un pour le monde."
 ita_communist.2.d:0 "Aujourd'hui, Palmiro Togliatti a officiellement annoncé son retrait de l'Organisation du Traité de l'Atlantique Nord. Bien que [ITA.GetNameDef] était un membre fondateur de l'alliance défensive démocratique, la récente élection d'une coalition dominée par le Partito Comunista Italiano au pouvoir a aliéné la nation de ses anciens alliés. Bien que Palmiro Togliatti n'ait rien dit de l'avenir de [ITA.GetNameDef], des rumeurs émergent déjà de communiqués à [SOV.Capital.GetName], bien qu'ils ne soient pas encore confirmés."
 trieste_crisis.1.d:0 "Après de nombreuses années de reconstruction à la fois en République fédérale de Yougoslavie et en République d'Italie, le moment est venu de se reposer une fois pour toutes sur la question du Territoire libre de Trieste. Ayant été divisée en deux zones d'occupation distinctes; l'une d'elles, la Zone A, qui sera patrouillée par les forces britanniques et américaines le long de la zone métropolitaine de Trieste, et l'autre zone, la Zone B, occupée par des partisans yougoslaves, contrôlant la campagne rurale en dehors des limites de la ville. Les gouvernements italien et yougoslave, avec l'aide des Nations Unies, espèrent parvenir à un accord sur la poursuite de leur politique à l'égard de Trieste."
 annex_trieste.1.d:0 "Les efforts pour parvenir à une résolution pacifique de la crise de Trieste ont été stoppés net aujourd'hui lorsque l'Armée italienne a pénétré dans la zone d'occupation yougoslave de Trieste pour faciliter sa réintégration forcée dans l'État italien. Après de nombreux jours de pourparlers mouvementés et tendus entre les États-nations de l'Adriatique sur le statut de Trieste et sa population mixte italienne et slave, le gouvernement italien, après des mois de rhétorique nationaliste du Premier ministre Palla, a ordonné à l'armée italienne de quitter la zone d'occupation métropolitaine et dans la campagne largement slave, montrant peu de considération pour les ouvertures des plans clairs de partition pacifique du Premier ministre yougoslave Josip Broz Tito. Les yeux du monde, une fois de plus, se tournent vers Belgrade en prévision de la réponse du gouvernement fédéral à l'agression italienne à Trieste, et avec les souvenirs de la première et de la seconde guerres mondiales frais dans l'esprit des deux nations, beaucoup dans le monde craignent qu'un autre chapitre violent de l'histoire de la Méditerranée soit sur le point de se dérouler à nouveau."
 italy_resign.1.d:0 "Après seulement six mois de mandat, le Premier ministre italien Giuseppe Pella a remis sa démission aujourd'hui à Rome, la capitale italienne. Ayant servi sous l'ancien Premier ministre Alcide De Gasperi en tant que Sous-Secrétaire aux Finances dans les deuxième et troisième cabinets et Secrétaire aux Finances sous le quatrième, il est devenu la cible d'un examen minutieux des communistes et des socialistes pour ses tentatives d'occidentalisation de l'économie italienne d'après-guerre. Suite à l'échec de l'adoption de la Loi sur la triche, il a été nommé Premier ministre d'Italie, où il a été durement critiqué pour son rôle dans les récentes tensions avec Josip Broz Tito en Yougoslavie en ce qui concerne les Territoires libres de Trieste, dont les conséquences, selon beaucoup, sont la principale raison de son départ."
 ita.1.t:0 "L'unification de Trieste"
 ita.1.d:0 "Le moment est venu pour la ville de Trieste, actuellement contrôlée par le CSNU, d'être ramenée à leur chef respectif. Il est prévu de diviser Trieste en Zone A, la ville principale et la zone B, la campagne à l'extérieur de Trieste. La Yougoslavie aurait la campagne et nous aurions la ville. Autorisons-nous cette division ou voulons-nous les deux parties?"
 ita.1.a:0 "Nous autorisons la division."
 ita.1.b:0 "Nous voulons les deux parties !"
 ita.2.t:0 "Menaces de la Yougoslavie"
 ita.2.d:0 "La Yougoslavie nous menace de garder les deux parties pour elle-même. Si nous ne reculons pas, ils envahiront Trieste, mais cela pourrait conduire à une guerre entre nous et la Yougoslavie. Si nous reculons, ils obtiennent les deux parties et tout reste paisible."
 ita.2.a:0 "Nous ne reculerons pas !"
 ita.2.b:0 "Nous restons pacifiques."
 ita.202.d:0 "San Marco 1 a été lancé le 15 décembre 1964 par une équipe au sol italienne à l'aide d'une fusée Scout américaine de Wallops Flight Facility en Virginie. C'est le premier satellite italien et une grande réussite pour Edoardo Amaldi et son équipe. En raison de leur dévouement et de leur travail acharné, l'Italie est devenue le cinquième pays à avoir son propre objet artificiel en orbite terrestre. L'objectif principal de la mission est de mener des recherches sur l'ionosphère. Après 272 jours de service, San Marco brûlera en rentrant dans l'atmosphère terrestre."
