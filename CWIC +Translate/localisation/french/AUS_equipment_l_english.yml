l_english:
 AUS_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n° 4 Mk I"
 AUS_infantry_equipment_0_short:0 "SMLE No. 4"
 AUS_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par magasin, qui fut l'arme principale de l'Empire britannique et du Commonwealth durant la première moitié du XXe siècle. Il fut le fusil standard de l'armée britannique de 1895 à 1957. Ce fusil fut largement utilisé durant la Seconde Guerre mondiale, notamment en Afrique du Nord, en Italie, dans le Pacifique et en Birmanie, par les forces britanniques et du Commonwealth. L'Australie et l'Inde conservèrent et produisirent le SMLE Mk III* comme fusil standard durant le conflit, et ce fusil resta en service dans l'armée australienne durant la guerre de Corée, jusqu'à son remplacement par le L1A1 SLR à la fin des années 1950."
 AUS_infantry_equipment_1:0 "Fabrique Nationale StG 58"
 AUS_infantry_equipment_1_short:0 "StG 58"
 AUS_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. Du fait de sa prévalence et de son utilisation généralisée au sein des forces armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le surnom de « bras droit du monde libre »."
 AUS_infantry_equipment_2:0 "Steyr AUG StG 77"
 AUS_infantry_equipment_2_short:0 "Steyr StG 77"
 AUS_infantry_equipment_2_desc:0 "Le Steyr AUG (allemand ; Armee-Universal-Gewehr, litt. « fusil d'armée universel ») est un fusil d'assaut bullpup autrichien chambré pour la cartouche intermédiaire OTAN de 5,56 × 45 mm, conçu dans les années 1960 par Steyr-Daimler-Puch et maintenant fabriqué par Steyr Mannlicher GmbH & Co KG."
 AUS_infantry_equipment_3:0 "Steyr AUG StG 77A1"
 AUS_infantry_equipment_3_short:0 "Steyr StG 77A1"
 AUS_infantry_equipment_4:0 "Steyr AUG StG 77KPE"
 AUS_infantry_equipment_4_short:0 "Steyr StG 77KPE"
 AUS_infantry_equipment_3_desc:0 "Le Steyr AUG (en allemand : Armee-Universal-Gewehr, littéralement « fusil universel de l'armée ») est un fusil d'assaut bullpup autrichien chambré pour la cartouche intermédiaire OTAN de 5,56 × 45 mm. Conçu dans les années 1960 par Steyr-Daimler-Puch, il est aujourd'hui fabriqué par Steyr Mannlicher GmbH & Co KG. Ce fusil bénéficie d'améliorations supplémentaires dans le cadre du programme KPE."
