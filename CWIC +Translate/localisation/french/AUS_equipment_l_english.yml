 AUS_motorized_equipment_2:0 "REO M35 6x6"
 AUS_motorized_equipment_2_short:0 "M35 6x6"
 AUS_motorized_equipment_2_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé dans tous les conflits américains de 1950 à 1988. Le M35 est équipé d'un moteur OA-331, d'une boîte de vitesses à 5 rapports et 2 gammes, et d'essieux rigides avec suspension à lames. Il peut transporter une charge utile de 2 268 kg (5 000 lb). Il peut rouler à 93 km/h (58 mph) sur une distance de 480 km (300 miles) et sa consommation est de 30,5 l/100 km (8 mi/gal). Il a été largement utilisé par les États-Unis et nombre de leurs alliés à travers le monde. Il a été conçu pour remplacer le GMC CCKW après la guerre et offrir un véhicule plus robuste et plus rapide."
