 AUS_utility_helicopter_equipment_2:0 "Aérospatiale SA316 Alouette III"
 AUS_utility_helicopter_equipment_2_short:0 "SA316 Alouette III"
 AUS_utility_helicopter_equipment_3:0 "Agusta-Bell AB-212"
 AUS_utility_helicopter_equipment_3_short:0 "AB-212"
 AUS_utility_helicopter_equipment_3_desc:0 "Introduit en 1963, l'UH-1D est la version militaire du Bell 205. Conçu avec un fuselage allongé, il était principalement destiné au transport de troupes, en remplacement du CH-34 Choctaw au sein de l'armée américaine. 2 000 exemplaires de cette variante « Iroquois D » furent construits, dont un grand nombre furent convertis au standard UH-1H avec un moteur plus puissant et amélioré."
 AUS_utility_helicopter_equipment_7:0 "Sikorsky S-70A-42 Black Hawk"
 AUS_utility_helicopter_equipment_7_short:0 "S-70A Black Hawk"
 AUS_utility_helicopter_equipment_7_desc:0 "Le S-70A-42 Black Hawk est une version d'exportation du S-70 Black Hawk destinée à l'armée de l'air autrichienne."
 AUS_cargo_helicopter_equipment_2:0 "Sikorsky S-65Ö Sea Stallion"
 AUS_cargo_helicopter_equipment_2_short:0 "S-65Ö Sea Stallion"
 AUS_scout_helicopter_equipment_2:0 "Bell OH-58B Kiowa"
 AUS_scout_helicopter_equipment_2_short:0 "OH-58B Kiowa"
 AUS_scout_helicopter_equipment_2_desc:0 "Introduit en 1969, en pleine guerre du Vietnam, l'OH-58 était un hélicoptère quadriplace dont la particularité résidait dans la possibilité de retirer les commandes du siège pilote gauche afin de transporter un passager à l'avant, malgré la présence de deux pilotes. Durant le conflit, son armement se limitait à une mitrailleuse M134 ou un lance-grenades M129. Après la guerre, l'OH-58 bénéficia de nombreuses modifications : un moteur plus puissant (le mettant au même niveau que l'OH-58C ultérieur), un système d'imagerie thermique, un système de communication pour les forces de l'ordre, un équipement de navigation amélioré et un train d'atterrissage surélevé. Ces versions modernisées du « Kiowa » (nommé d'après une tribu amérindienne originaire du Montana et du Colorado) participèrent aux opérations antidrogue RAID de la Garde nationale de l'armée de terre américaine."