 JAP_Article_Nine:0 "Article 9"
 JAP_Article_Nine_desc:0 "La Constitution du Japon, L'Article 9 dispose : Le Japon renonce à la guerre en tant que droit souverain et moyen de régler les différends internationaux. Par conséquent, tout potentiel de guerre ne sera jamais maintenu et doit être strictement limité à des fins d’autodéfense."
 JAP_Article_Nine_tt:0 "§R Interdit d'accroître la législation sur la conscription ou de déclarer la guerre.\nInterdit d'entraîner ou démanteler des unités.\nInterdit de modifier les modèles d'unités. §!"
 JAP_Emperor:0 "Sa Majesté l'Empereur"
 JAP_Emperor_desc:0 "Notre Empereur dirige la nation depuis sa fondation par Sa Majesté l'empereur Jimmu, il y a environ 2 700 ans. Même dans les moments les plus difficiles, le règne divin de notre empereur a maintenu la nation unie, agissant comme un symbole d'espoir pour notre peuple."
 JAP_Emperor_tt:0 "Empereur Actuel: §C[JAP_Current_Emperor_Name]§!\nEre Actuelle: §C[JAP_Current_Era_Name]§!"
 JAP_Current_Emperor_Name_Hirohito:0 "Hirohito"
 JAP_Current_Era_Name_Showa:0 "Shōwa"
 JAP_LDP_Party_Strength:0 "Force du LDP"
 JAP_LDP_Party_Strength_desc:0 "Le Parti Libéral-Démocrate (Jiyū Minshu-tō) est un parti politique puissant du Japon, étant la plus grande force politique du camp conservateur. Mais avec l'existence de factions au sein du parti et les bagarres entre certains législateurs éminents du PLD, la force du parti vacille fréquemment. Il est nécessaire que nous maintenions la force du parti à un niveau élevé pour garantir une administration stable."
 JAP_LDP_Party_Strength_tt:0 "Niveau de Force Actuel: [?JAP_LDP_Party_Strength_Level|0+]"