l_english:
 SOV_8th_5yp_category:0 "8e plan quinquennal"
 SOV_8th_5yp_category_desc:0 "8ème Plan quinquennal soviétique\nLe 8ème Plan quinquennal est un ensemble ambitieux d'objectifs de production industrielle. Introduite lors du 23e Congrès, la logistique et l'organisation seront gérées par le gouvernement central avec plus de pouvoir donné aux propriétaires d'usines individuels quant à la manière dont ils respecteraient leurs quotas. Le plan vise également à améliorer le bien-être des travailleurs et à permettre aux gens ordinaires d'avoir accès à une plus grande part de l'économie.\n\n Progrès Actuel : [?ROOT.sov_8th_5yp_progress|R]%"
