 SOV_11th_5yp_category:0 "11e plan quinquennal"
 SOV_11th_5yp_category_desc:0 "11e plan quinquennal soviétique\nLe 11e plan quinquennal constitue une nouvelle série d'objectifs visant à renforcer notre économie. Sa mise en œuvre est prévue entre 1981 et 1985. Il a été présenté par le président du Conseil des ministres, Nikolaï Tikhonov, lors du 26e Congrès. Brejnev a déclaré aux délégués du congrès que l'objectif principal du plan était de faire passer l'économie d'une croissance extensive à une croissance intensive, et que l'amélioration du niveau de vie devait figurer parmi les objectifs. Parmi les autres objectifs figuraient l'arrêt des migrations de l'Est vers l'Ouest et du Sud vers le Nord, ainsi que la garantie de la croissance économique, la plupart des centres économiques soviétiques étant situés dans des régions sous-développées telles que la Sibérie et l'Asie centrale.\n\n Progrès actuels : §G[?ROOT.sov_11th_5yp_progress|R]%§!"
