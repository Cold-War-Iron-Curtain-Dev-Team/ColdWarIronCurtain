 SOV_9th_5yp_category:0 "9e plan quinquennal"
 SOV_9th_5yp_category_desc:0 "9e plan quinquennal soviétique\nL'objectif du 9e plan quinquennal est de renforcer notre économie, et nous comptons l'atteindre entre 1971 et 1975. Il a été présenté lors du 24e Congrès par le président du Conseil des ministres, Alexeï Kossyguine. Il vise principalement à accroître la production industrielle de biens de consommation, Brejnev ayant déclaré que l'amélioration du niveau de vie était plus importante que le développement économique. Le plan comprend également une proposition visant à augmenter le revenu national brut de 37 à 40 %.\n\n Progrès actuels : [?ROOT.sov_9th_5yp_progress|R]%"
