 SOV_10th_5yp_category:0 "10e plan quinquennal"
 SOV_10th_5yp_category_desc:0 "10e plan quinquennal soviétique\nLe 10e plan quinquennal est un ensemble d'objectifs visant à renforcer l'économie de notre pays entre 1976 et 1980, présenté lors du 25e Congrès par le président du Conseil des ministres, Alexeï Kossyguine. Connu sous le nom de « plan d'efficacité et de qualité », ce plan a été baptisé ainsi parce que Brejnev affirmait que l'économie soviétique était confrontée à un ralentissement de sa croissance dû à la lenteur des progrès technologiques dans le pays. Le plan mettait donc l'accent sur la nécessité d'innover sur le plan technologique, en ciblant de nombreuses industries du pays pour en améliorer l'efficacité. \n\n Progrès actuels : [?ROOT.sov_10th_5yp_progress|R]%"
