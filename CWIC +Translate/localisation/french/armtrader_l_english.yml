l_english:
 CAP_infantry_equipment_0:0 "Fusil américain, calibre .30, M1"
 CAP_infantry_equipment_0_short:0 "M1 Garand"
 CAP_infantry_equipment_0_desc:0 "Le M1 Garand est une arme imposante conçue par John C. Garand en 1928 pour les États-Unis. Le M1 Garand est un fusil semi-automatique de calibre .30 qui a été largement utilisé pendant la Seconde Guerre mondiale. Il fait partie des premières armes à utiliser un système de rechargement à gaz pour recharger une nouvelle cartouche après le tir. Il utilise des chargeurs chargés par le haut du fusil et peut être équipé d'accessoires, notamment la grenade antichar M31 HEAT. Il fonctionne comme une arme polyvalente avec une portée et une précision exceptionnelles. Il est devenu emblématique et est toujours utilisé par les équipes d'entraînement modernes aux États-Unis."
 CAP_infantry_equipment_1:0 "Fusil semi-automatique L1A1"
 CAP_infantry_equipment_1_short:0 "L1A1 SLR"
 CAP_infantry_equipment_1_desc:0 "Le L1A1 SLR est une version britannique du fusil d'assaut belge FN FAL. Il a été produit sous licence et a été utilisé dans de nombreux pays du Commonwealth. Le Royaume-Uni a produit sa propre variante du FN FAL en y intégrant les modifications développées par l'Allied Rifle Committee, le désignant sous le nom de L1A1 Self Loading Rifle (SLR). Les armes ont été fabriquées par la Royal Small Arms Factory Enfield, la Birmingham Small Arms, la Royal Ordnance Factory et la ROF Fazakerley. Après l'arrêt de la production, les pièces de rechange ont été fabriquées par Parker Hale Limited. Le SLR a servi dans les forces armées britanniques de 1954 à environ 1994, avant d'être remplacé par le L85A1 à partir de 1985."
 CAP_infantry_equipment_2:0 "Fusil américain, calibre 5,56 mm, M16"
 CAP_infantry_equipment_2_short:0 "M16"
 CAP_infantry_equipment_2_desc:0 "La carabine M2 a été jugée largement surpassée par l'AK47 et le StG44 allemand par les responsables militaires américains et, en 1956, le développement du M16 a commencé. En 1959, l'arme a été achevée par Eugene Stoner et James Sullivan. Elle affichait des capacités exceptionnelles et surpassait l'AK47 et l'AKM. Elle disposait notamment d'une puissance de feu bien supérieure à celle de la carabine M2, était plus précise que l'AK47 et utilisait des munitions plus légères sans perte notable de performance. Cependant, bien qu'elle surpassait l'AK47 dans les tests généraux, sa fiabilité médiocre empêchait de la considérer comme son égale. C'était particulièrement le cas au Vietnam, où les défaillances étaient très fréquentes."
 CAP_infantry_equipment_3:0 "Fusil américain, 5,56 mm, M16A2"
 CAP_infantry_equipment_3_short:0 "M16A2"
 CAP_infantry_equipment_3_desc:0 "Après avoir constaté le manque de fiabilité fréquent de cette arme dans les jungles du Vietnam, le corps des Marines américains a demandé qu'elle soit repensée. En 1982, des modifications et des améliorations ont été apportées. L'arme était dotée d'un récepteur renforcé, d'un nouveau rayage, d'un boîtier renforcé, d'un meilleur refroidissement grâce à l'utilisation de matériaux différents, d'un support amélioré pour les accessoires et d'un mécanisme interne repensé qui lui conférait un haut niveau de fiabilité. Elle a été utilisée au combat au Liban, en Libye, en Égypte et dans tous les autres conflits auxquels les États-Unis ont participé depuis sa création."
 CAP_infantry_equipment_4:0 "Carabine, calibre 5,56 mm, M4"
 CAP_infantry_equipment_4_short:0 "M4 Carbine"
 CAP_infantry_equipment_4_desc:0 "La carabine M4 est une version améliorée du M16A2. Sa conception a été initialement confiée à une grande équipe de concepteurs ad hoc en 1984 et son développement s'est achevé en 1993. Après 9 ans de développement, espérons que l'attente en valait la peine. Elle offre une plus grande fiabilité et est beaucoup plus légère et plus courte. Grâce notamment à l'amélioration des matériaux, elle est plus précise que la M16A2. Sa taille compacte la rend plus polyvalente et plus facile à utiliser que la M16A2. La carabine M4 a été utilisée au combat pendant la guerre des États-Unis en Afghanistan, la guerre en Irak et la guerre contre l'État islamique."
 CAP_lt_equipment_1:0 "M5 Stuart"
 CAP_lt_equipment_1_short:0 "M5 Stuart"
 CAP_lt_equipment_1_desc:0 "Le M5 Stuart est un petit char développé par le département de l'artillerie de l'armée américaine en 1941 pour servir de char léger. Il est doté d'un blindage fin de 63,5 mm et d'un canon principal de 37 mm avec trois armes secondaires Browning de 7,62 mm. Il utilise un double moteur Cadillac V8 qui peut atteindre une vitesse de 36 mph hors route et a une autonomie de 100 miles. Il a été largement prêté tout au long de la Seconde Guerre mondiale, même après l'entrée en guerre des États-Unis."
 CAP_lt_equipment_2:0 "M24 Chaffee"
 CAP_lt_equipment_2_short:0 "M24 Chaffee"
 CAP_lt_equipment_2_desc:0 "Le M24 Chaffee est un char léger développé par le département de l'artillerie de l'armée américaine en 1944, vers la fin de la Seconde Guerre mondiale. Le M24 dispose d'un blindage de 38 mm et d'un canon principal de 75 mm. Son moteur est un V8 Cadillac double avec une transmission Hydramatic qui lui permet de se déplacer à peu près comme le M5 Stuart. Au combat, le petit canon du M5 Stuart s'est avéré être un inconvénient majeur, en particulier lors de la campagne d'Afrique du Nord. C'est peu après cela que le M24 Chaffee a été développé dans le but de lui donner plus de puissance de feu pour mieux remplir son rôle."
 CAP_lt_equipment_3:0 "Char de combat à chenilles : 76-mm gun, M41"
 CAP_lt_equipment_3_short:0 "M41 Walker Bulldog"
 CAP_lt_equipment_3_desc:0 "Le M41 est un char de reconnaissance léger développé par Cadillac en 1949. Il a été utilisé au combat au Vietnam, dans la baie des Cochons, au Liban et en Somalie. Son blindage varie entre 19 mm et 31,7 mm. Il est équipé d'un canon principal de 76 mm, d'une mitrailleuse coaxiale de calibre .30 et d'une mitrailleuse de calibre .50 sur le toit. Il utilise un moteur à essence Continental 6 cylindres et peut atteindre une vitesse de 72 km/h avec une autonomie de 160 km. Le développement du M41 progressait lentement en raison d'un financement insuffisant, mais lorsque la guerre de Corée a éclaté, l'armée américaine a commencé à accélérer le programme. Cette précipitation a entraîné un grand nombre de problèmes dans le programme et des problèmes de surdimensionnement. En raison des graves problèmes liés à la précipitation du programme, le M41 a été produit pendant très peu de temps et n'a pas été utilisé pendant la guerre de Corée. En fait, sa production n'a commencé qu'en 1951 et n'a duré que trois ans."
 CAP_lt_equipment_4:0 "Véhicule d'assaut aéroporté : à chenilles, 152 mm, M551"
 CAP_lt_equipment_4_short:0 "M551 Sheridan"
 CAP_lt_equipment_4_desc:0 "Le M551 Sheridan est un char de reconnaissance amphibie et aéroporté conçu par Cadillac en 1966. Il a été utilisé au Vietnam, lors de l'opération Just Cause et lors de l'opération Desert Storm. Le M551 Sheridan est équipé d'un canon principal de 152 mm et de deux canons secondaires. Le char est équipé d'un moteur diesel turbocompressé 6 cylindres 6V53T et peut atteindre une vitesse de 70 km/h et une vitesse de nage de 6 km/h. Le blindage est constitué d'une coque en aluminium et d'une tourelle en acier. Il a été immédiatement mis en service au Vietnam en raison de sa mobilité et de sa polyvalence, où il a joué un rôle exceptionnel. Le canon principal de 152 mm peut tirer respectivement des missiles antichars guidés ou des munitions conventionnelles. Le M551 a été critiqué par bon nombre de ses opérateurs en raison de sa difficulté d'utilisation en combat direct, mais il a néanmoins rempli son rôle efficacement malgré sa mauvaise réputation."
 CAP_lt_equipment_5:0 "M3 Bradley"
 CAP_lt_equipment_5_short:0 "M3 Bradley"
 CAP_lt_equipment_5_desc:0 "Le M3 Bradley CFV est très similaire au M2 Bradley IFV (véhicule de combat d'infanterie) et est équipé de la même tourelle Bushmaster Cannon de 25 mm pour deux personnes avec une mitrailleuse coaxiale M240C de 7,62 mm. Il ne diffère du M2 que par quelques subtilités et par son rôle. Le M3 est classé comme véhicule blindé de reconnaissance et de repérage et ne dispose pas des ouvertures de tir présentes sur la série M2. Le M3 transporte également davantage de missiles TOW ainsi que plus de munitions pour ses canons de 25 mm et 7,62 mm."
 CAP_lt_equipment_6:0 "M3A2 Bradley ODS"
 CAP_lt_equipment_6_short:0 "M3A2 Bradley ODS"
 CAP_lt_equipment_6_desc:0 "Le M3A2 intégrait des améliorations au niveau du blindage, telles que la possibilité d'installer un blindage réactif explosif, provenant du M2A2 Bradley. Après des essais de tir réel, la disposition des sièges et du rangement des munitions a également été modifiée, les observateurs étant déplacés vers un banc situé sur le côté gauche du véhicule et le rangement des missiles réorganisé afin d'améliorer la sécurité."
 CAP_ht_equipment_1:0 "M4A3E2 Sherman Jumbo"
 CAP_ht_equipment_1_short:0 "M4A3E2 Jumbo"
 CAP_ht_equipment_1_desc:0 "Blindage supplémentaire (y compris 1 pouce à l'avant), tourelle à côtés verticaux, mais vitesse réduite d'environ 3 à 4 mph. Construit avec un canon de 75 mm, mais fréquemment réarmé par les unités utilisatrices avec des canons de 76 mm. Connecteurs d'extrémité prolongés (EEC) de type « bec de canard » fixés au bord extérieur des chenilles."
 CAP_ht_equipment_2:0 "T26E4 Super Pershing"
 CAP_ht_equipment_2_short:0 "T26E4 Super Pershing"
 CAP_ht_equipment_2_desc:0 "Le Super Pershing était une variante plus lourde du M26 de base. Un blindage plus épais était fixé au char et le canon T15E1, plus long, remplaçait le canon M3 afin d'égaler la puissance de feu du King Tiger."
 CAP_ht_equipment_3:0 "T32"
 CAP_ht_equipment_3_short:0 "T32"
 CAP_ht_equipment_3_desc:0 "Les travaux ont commencé au début de l'année 1945 afin de développer une variante nettement plus lourde du M26 Pershing. À partir des données recueillies lors du projet de char lourd T29 et en intégrant un canon principal expérimental de 90 mm tirant des munitions composites rigides perforantes, ainsi qu'une transmission plus avancée, le premier char T32 a été produit. Le canon T15E2 monté sur ce char était beaucoup plus puissant que celui du Pershing et, à l'instar du T26E4 Super Pershing qui utilisait un canon expérimental similaire de 90 mm, le contrepoids à l'arrière de la tourelle a été considérablement agrandi pour compenser le poids du long canon."
 CAP_ht_equipment_4:0 "Char de combat M103 équipé d'un canon de 120 mm"
 CAP_ht_equipment_4_short:0 "M103"
 CAP_ht_equipment_4_desc:0 "Le M103 était un char lourd créé en 1957 par Chrysler. 100 unités ont été construites et déployées, mais elles n'ont jamais été utilisées au combat. Il était équipé d'un blindage de 127 à 254 mm et disposait d'un canon principal de 120 mm et de 3 mitrailleuses secondaires. Il atteignait une vitesse maximale de 34 km/h et avait une autonomie de 130 km avec 1 066 litres de carburant à l'époque. Il était équipé d'un moteur à essence AV1790 12 cylindres. Le char a servi dans le corps des Marines, mais n'a jamais été utilisé au combat, car les unités auxquelles il était affecté n'ont jamais eu l'occasion de l'utiliser."
 CAP_ht_equipment_5:0 "Char de combat M103A2 équipé d'un canon de 120 mm"
 CAP_ht_equipment_5_short:0 "M103A2"
 CAP_ht_equipment_5_desc:0 "Le M103A2 est une version améliorée du M103 fabriqué dans les années 60 par Chrysler. 200 unités ont été produites, mais il n'a jamais été utilisé au combat. Le moteur du M103 a été remplacé par un moteur AVDS1790-2 V12 à double turbocompresseur, ce qui lui conférait des avantages significatifs par rapport au M103. Le moteur amélioré lui permettait de parcourir 295 miles à une vitesse de 23 mph et offrait une mobilité importante tout en utilisant le même carburant que le M103. D'autres améliorations mineures ont également été apportées à certaines pièces du M103, comme un modèle de transmission légèrement différent, mais qui était finalement identique. Le M103A2 fut le dernier char lourd créé par les États-Unis, car les chars de combat principaux avaient supplanté le besoin de chars lourds et pouvaient transporter plus de puissance de feu avec moins de poids et plus de mobilité."
 CAP_sht_equipment_1_:0 "T95 GMC"
 CAP_sht_equipment_1_short:0 "Canon automoteur T95"
 CAP_sht_equipment_1_desc:0 "Le T95 Gun Motor Carriage est un chasseur de bunkers super lourd développé en 1945 par Pacific Car and Foundry. Il n'a jamais été utilisé au combat et seuls deux prototypes ont été créés. Il pèse 95 tonnes et mesure 36 x 14 x 9 pieds, nécessitant un équipage de quatre personnes. Son blindage a une épaisseur de 1 pied sur toute sa surface et il est équipé d'un moteur GAF V-8. Le char utilise deux chenilles et une suspension à ressorts hélicoïdaux horizontaux. Le T95 est équipé d'un canon principal de 105 mm et d'un armement secondaire M2 Browning. Il a été initialement conçu pour percer les défenses allemandes, puis a été envisagé pour l'invasion du Japon. La production était déjà prévue, mais le largage des deux bombes atomiques a mis fin à la guerre et le projet a été annulé avant qu'une unité puisse être fabriquée."
 CAP_sht_equipment_2_short:0 "Chrysler K"
 CAP_sht_equipment_2_desc:0 "Le Chrysler K est un char super lourd conçu par Chrysler en 1946. Seuls deux prototypes ont été créés. Le poids, le moteur et les dimensions exactes du char sont inconnus. Le Chrysler K était équipé d'un canon principal de 105 mm et de deux mitrailleuses secondaires. Contrairement au T95, le Chrysler K ne disposait que d'un seul jeu de chenilles ultra-larges. Le Chrysler K a finalement été abandonné, le projet ayant dépassé le budget prévu."
 CAP_sht_equipment_3_short:0 "R-32"
 CAP_sht_equipment_3_desc:0 "Le R32 est un char expérimental nucléaire super lourd conçu par Chrysler dans les années 50. Le R32 n'a jamais atteint la phase de prototype, mais certaines pièces ont été fabriquées. Le R32 était conçu pour transporter un moteur électrique à propulsion nucléaire et un canon principal de 120 mm avec 3 mitrailleuses secondaires. Le moteur nucléaire devait lui permettre d'atteindre une vitesse de 65 km/h et d'avoir une autonomie presque illimitée grâce à l'énergie nucléaire comme source de carburant. Le blindage devait avoir une épaisseur de 127 à 254 mm. Le projet a été rapidement annulé après sa création en raison d'un grand nombre de problèmes liés au manque de technologie nécessaire à sa conception et au scepticisme de l'état-major américain chargé de le financer."
 CAP_mbt_equipment_0:0 "M4 Sherman"
 CAP_mbt_equipment_0_short:0 "M4 Sherman"
 CAP_mbt_equipment_0_desc:0 "Le M4 Sherman est un char moyen conçu par le département de l'artillerie de l'armée américaine en 1940 pour la Seconde Guerre mondiale. Il a été prêté à de nombreux pays à partir de 1940. Le Sherman peut être équipé d'un canon principal de 75 mm, 76 mm ou 105 mm et dispose généralement d'un canon secondaire Browning. Il est propulsé par un moteur à essence radial C4 à 9 cylindres capable de transporter le véhicule à une vitesse de 22 à 30 mph sur une distance de 100 à 150 miles avant de devoir être ravitaillé en carburant. Il était fiable, peu coûteux à produire et faisait rêver les logiciens. Il était très compact et facile à transporter en grand nombre, ce qui rendait son acheminement à travers l'Atlantique extrêmement facile. Le M4 était également très polyvalent et capable de fonctionner dans des conditions très variées."
 CAP_mbt_equipment_1:0 "M26"
 CAP_mbt_equipment_1_short:0 "M26 Pershing"
 CAP_mbt_equipment_1_desc:0 "Le M26 Pershing est un char moyen conçu par le département de l'artillerie de l'armée américaine en 1944. Il a été utilisé pendant la Seconde Guerre mondiale et la guerre de Corée. Le M26 Pershing est particulièrement lourd pour un char moyen, ce qui lui confère une vitesse hors route exceptionnellement faible. Son moteur Ford GAF à 8 cylindres lui permettait de parcourir jusqu'à 160 km à une vitesse de 48 km/h sur route, mais hors route, il ne dépassait pas les 8,4 km/h. Son armement principal est un canon de 90 mm et il peut être équipé d'une mitrailleuse M2 Browning. Cependant, pendant la guerre de Corée, le Browning M2 de calibre .50 a été remplacé par deux canons M1919 .30-06 en raison du grand nombre de cibles faciles sur le terrain et de la nécessité de transporter 9 fois plus de munitions plutôt que d'augmenter la puissance de feu. Le M26 était peut-être un char moyen, mais il est extrêmement lourd et peut être considéré comme un hybride entre un char moyen et un char lourd."
 CAP_mbt_equipment_2:0 "M46 Patton"
 CAP_mbt_equipment_2_short:0 "M46 Patton"
 CAP_mbt_equipment_2_desc:0 "Le M46 Patton est un char moyen conçu par le département de l'artillerie de l'armée américaine en 1949. Il a été utilisé pendant la guerre de Corée et a été conçu pour remplacer le M26 Pershing en raison de son poids excessif. Il est équipé d'un canon principal de 90 mm et d'un blindage de 102 mm. Il peut être équipé d'un seul M2 Browning ou de deux M1919 Brownings. Le M46 Patton utilise un moteur V12 biturbo qui atteint une vitesse de 24 à 48 km/h et a une autonomie de 48 à 128 km. Il a été produit en grande série dans le but de remplacer les anciens modèles. Il était à la pointe de la technologie en matière de conception et d'armement et ne souffrait pas d'un poids excessif."
 CAP_mbt_equipment_3:0 "Char de combat à chenilles : canon de 90 mm, M47"
 CAP_mbt_equipment_3_short:0 "M47 Patton"
 CAP_mbt_equipment_3_desc:0 "Le M47 Patton est l'un des premiers chars de combat principaux. Il a été conçu par le département de l'artillerie de l'armée américaine en 1951. Il est très similaire au M46 Patton, mais dispose d'une tourelle modernisée avec un mécanisme interne amélioré et une transmission optimisée. Il a été utilisé lors de la crise de Suez, de la guerre des Six Jours et des guerres de Yougoslavie."
 CAP_mbt_equipment_4:0 "Char de combat à chenilles : 90-mm Gun, M48"
 CAP_mbt_equipment_4_short:0 "M48 Patton"
 CAP_mbt_equipment_4_desc:0 "Le M48 Patton est un char de combat principal conçu par le département de l'artillerie de l'armée américaine en 1953. Le M48 dispose d'un blindage de 110 mm et d'un canon principal amélioré de 90 mm. Son moteur est une variante optimisée du V12 utilisé dans les chars Patton précédents, avec un système d'injection de carburant léger et un compresseur. Il a une autonomie de 160 miles hors route et de 300 miles sur route. Il peut rouler à 30 mph sur route, mais atteint 20 mph hors route grâce à son moteur, sa transmission et ses chenilles améliorés. Il a été le char principal utilisé pendant la guerre du Vietnam et était couramment utilisé par les alliés des États-Unis pendant la guerre froide. Il ressemble au M47 Patton, mais il s'agit d'un modèle entièrement nouveau doté de nouveaux mécanismes internes. Il a été utilisé par l'armée américaine et les Marines avant d'être finalement remplacé par le M60, bien que de nombreuses unités de la garde nationale aient continué à utiliser et à entretenir des M48 jusqu'à la fin des années 80."
 CAP_mbt_equipment_5:0 "Char de combat à chenilles : 105-mm Gun, M60"
 CAP_mbt_equipment_5_short:0 "M60 Patton"
 CAP_mbt_equipment_5_desc:0 "Le M60 Patton est un char de combat principal conçu par le département de l'artillerie de l'armée américaine en 1960. Il a été utilisé pendant la guerre du Kippour, l'invasion de la Grenade, au Yémen et au Liban. Il dispose d'un blindage d'environ 220 mm et est équipé d'un canon principal de 105 mm. Il utilise généralement la mitrailleuse M73 de 7,62 x 51 mm comme armement secondaire. Son moteur est un V12 biturbo amélioré qui lui permet d'atteindre à peu près la même vitesse que le M48. Cependant, bien qu'il pèse légèrement plus que le M48, le M60 peut se déplacer à peu près à la même vitesse et sur les mêmes distances. Le M60 a subi de nombreuses modifications mineures tout au long de sa vie, ce qui a donné lieu à environ 4 variantes. Cela s'est traduit par une augmentation du blindage, du poids et une amélioration de la fiabilité."
 CAP_mbt_equipment_6:0 "Char de combat à chenilles : 105-mm Gun, M1"
 CAP_mbt_equipment_6_short:0 "M1 Abrams"
 CAP_mbt_equipment_6_desc:0 "Le M1 Abrams est un char de combat principal conçu par General Dynamics Land Systems en 1979. Après l'annulation du projet MBT-70, le M1 Abrams a pris le relais. Le M1 utilise un blindage composite de 350 mm. Son canon principal est un canon de 105 mm, accompagné de canons secondaires de calibre 1,50 ou 2,7,62. Le moteur est un moteur à turbine polycarburant qui lui permet d'atteindre une vitesse de 72 km/h sur route et de 48 km/h hors route. Son autonomie est d'environ 426 km sur route et de 322 km hors route. Il n'utilise pas la suspension du MBT70, mais une suspension à barres de torsion avec amortisseurs. Il a démontré une efficacité considérable dans tous les conflits américains depuis sa création. Le M1 Abrams est devenu emblématique en raison de sa robustesse, de sa mobilité et de sa puissance de feu considérables. Bon nombre de ses améliorations proviennent des enseignements tirés du projet MBT-70, où les caractéristiques utiles ont été conservées, mais les plus problématiques ont été abandonnées."
 CAP_mbt_equipment_7:0 "Char de combat à chenilles : 105-mm Gun, M1A1"
 CAP_mbt_equipment_7_short:0 "M1A1 Abrams"
 CAP_mbt_equipment_7_desc:0 "Le char de combat principal M1A1 Abrams a été développé par General Dynamics. Il s'agit d'une version améliorée du M1 Abrams. Le M1A1 a été dévoilé en 1985 et sa production a débuté la même année. Le M1A1 dispose d'une protection blindée améliorée au niveau de la tourelle par rapport à son prédécesseur. L'une des améliorations les plus importantes par rapport au M1 est le canon M256 de 120 mm à âme lisse, développé à l'origine par Rheinmetall et produit sous licence aux États-Unis."
 CAP_mbt_equipment_8:0 "Char de combat à chenilles : 120-mm Gun, M1A2"
 CAP_mbt_equipment_8_short:0 "M1A2 Abrams"
 CAP_mbt_equipment_8_desc:0 "Le M1A2 Abrams est une version améliorée du M1, développée par GDLS au début des années 80. Le char utilise un blindage composite renforcé par un treillis en uranium appauvri d'environ 600 mm. Les chars sont également équipés d'options supplémentaires telles qu'un blindage réactif, un kit de survie urbaine et un système d'arme télécommandé. Il est équipé d'un canon principal de 120 mm à âme lisse et a une portée supérieure à la plupart des autres chars. Il dispose également d'un système électronique amélioré, de contre-mesures ATGM et d'un système de lutte contre l'incendie. Cependant, aucune amélioration n'a été apportée à la transmission, à la suspension ou au moteur. Il est donc plus proche du sol et pèse beaucoup plus lourd. Il peut rouler à 67 km/h sur route et à 40 km/h hors route, avec une autonomie réduite. Il a été utilisé en Afghanistan, dans le Golfe et en Irak, où il a démontré une capacité de survie inégalée contre la plupart des armes antichars utilisées par ses adversaires."
 CAP_mbt_equipment_9:0 "Char de combat à chenilles : canon de 120 mm, M1A2(SEP)"
 CAP_mbt_equipment_9_short:0 "M1A2 Abrams SEP"
 CAP_mbt_equipment_9_desc:0 "Le M1A2 System Enhancement Package (SEP) est le successeur du M1A2. Il s'agit également d'un kit de mise à niveau pour les anciens chars Abrams. Il offre une protection blindée améliorée, des composants système améliorés, des composants informatiques améliorés et d'autres améliorations. Le premier char mis à niveau a été livré en 1999."
 CAP_mechanized_equipment_1:0 "M2 Half-Track"
 CAP_mechanized_equipment_1_short:0 "M2 Half-Track"
 CAP_mechanized_equipment_1_desc:0 "Le véhicule semi-chenillé M2 est un véhicule blindé semi-chenillé produit par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspire des véhicules semi-chenillés importés de France dans les années 1930, utilisant des composants standard fournis par les constructeurs de camions américains afin d'accélérer la production et de réduire les coûts. Le concept a été conçu et les modèles pilotes ont été fabriqués par la Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement baptisé M2). La production par la White Motor Company a commencé en 1940 et a été étendue à Autocar."
 CAP_mechanized_equipment_2:0 "M3 Half-Track"
 CAP_mechanized_equipment_2_short:0 "M3 Half-Track"
 CAP_mechanized_equipment_2_desc:0 "Le semi-chenillé M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et la Guerre froide. Dérivé du semi-chenillé M2, le M3 a été produit en grande série, avec environ 15 000 exemplaires standard et plus de 38 000 variantes. Pendant la Guerre froide, il a été utilisé par divers acteurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, et est resté en service jusqu'au milieu des années 1990. Au Mexique, il était encore en service en 2019."
 CAP_mechanized_equipment_3:0 "M3A1 Half-Track"
 CAP_mechanized_equipment_3_short:0 "M3A1 Half-Track"
 CAP_mechanized_equipment_3_desc:0 "Le M3A1 est un semi-chenillé M3 équipé du support circulaire amélioré pour mitrailleuse M49, situé au-dessus du siège avant droit. Entre 1942 et 1943, tous les semi-chenillés M3 (standard et A1) ont fait l'objet d'améliorations continues. Ces améliorations concernaient notamment la transmission, le moteur et les systèmes de rangement."
 CAP_mechanized_equipment_4:0 "Transporteur, Personnel, À chenilles, Blindé, M59"
 CAP_mechanized_equipment_4_short:0 "M59"
 CAP_mechanized_equipment_4_desc:0 "Le M59 est un véhicule blindé de transport de troupes développé par la société FMC en 1951. Il a été utilisé au Vietnam et au Liban. Le M75 était équipé de deux moteurs à essence 6 cylindres en ligne, d'une transmission Hydramatic 301MG et d'une suspension à barres de torsion. Il pouvait atteindre une vitesse maximale de 51 km/h et parcourir 193 km. Le M59 a rapidement remplacé le M75 car il était amphibie, plus petit et beaucoup moins cher à produire. Le M59 a également été utilisé comme porte-mortier et véhicule de soutien."
 CAP_mechanized_equipment_5:0 "Transporteur, Personnel, À chenilles, Blindé, M113"
 CAP_mechanized_equipment_5_short:0 "M113"
 CAP_mechanized_equipment_5_desc:0 "Les véhicules blindés de transport de troupes américains les plus reconnaissables depuis les années 60. Son utilisation intensive et des années de recherche ont permis d'en faire un véritable véhicule blindé de transport de troupes, tirant parti de sa hauteur, de l'angle de son blindage et de son épaisseur. Plus tard, de plus en plus de variantes ont été introduites, l'armant d'un M2 Browning .50 Cal avec quelques milliers de cartouches de liberté. Il s'agit véritablement d'un excellent véhicule blindé de transport de troupes. Des dizaines de variantes ont été dérivées du M113, qui est toujours utilisé par l'armée américaine à ce jour."
 CAP_mechanized_equipment_6:0 "Transporteur, Personnel, À chenilles, Blindé, M113A1"
 CAP_mechanized_equipment_6_short:0 "M113A1"
 CAP_mechanized_equipment_6_desc:0 "À partir de 1964, le moteur à essence a été remplacé par un moteur Detroit Diesel 6V-53 de 215 ch (160 kW), afin de profiter de la meilleure économie de carburant et du risque d'incendie réduit du moteur diesel."
 CAP_mechanized_equipment_7:0 "Transporteur, Personnel, À chenilles, Blindé, M113A2"
 CAP_mechanized_equipment_7_short:0 "M113A2"
 CAP_mechanized_equipment_7_desc:0 "Le M113A2 est une version améliorée du M113 fabriquée par la Food Machinery Corporation à la fin des années 70. Il a été utilisé au combat partout où le M113 a été utilisé. Dans le modèle A1, le moteur a été remplacé par le 6V-53. Dans la version A2, le refroidissement du moteur a été amélioré, des barres de torsion plus résistantes ont été introduites pour augmenter la garde au sol, des amortisseurs ont été ajoutés à la suspension, les réservoirs de carburant ont été blindés et des lance-fumigènes ont été ajoutés."
 CAP_mechanized_equipment_8:0 "Transporteur, Personnel, À chenilles, Blindé, M113A3"
 CAP_mechanized_equipment_8_short:0 "M113A3"
 CAP_mechanized_equipment_8_desc:0 "En 1987, d'autres améliorations visant à « renforcer la survie (sur le champ de bataille) » ont été introduites. Elles comprenaient un timon pour la direction à la place des commandes latérales, un moteur plus puissant (le 6V-53T Detroit Diesel turbocompressé), des réservoirs de carburant externes et des revêtements internes anti-éclats pour une meilleure protection. Le suffixe A3 est utilisé sur toutes les variantes pour indiquer la mise à niveau à la norme A3."
 CAP_mechanized_equipment_9:0 "Véhicule de combat d'infanterie M1126 Stryker"
 CAP_mechanized_equipment_9_short:0 "M1126 Stryker ICV"
 CAP_mechanized_equipment_9_desc:0 "Le STRYKER est un véhicule blindé de transport de troupes développé par General Dynamics en 1999. Il a été utilisé pendant la guerre en Afghanistan. Le Stryker est équipé d'un moteur Caterpillar C7 et d'une suspension 8x8. Il peut atteindre une vitesse de 60 mph et parcourir 310 miles. Avec près d'un an et demi de retard sur le calendrier, l'équipe General Motors-General Dynamics a remporté en novembre 2000 un contrat de 8 milliards de dollars pour la production de 2 131 véhicules dérivés du LAV III canadien destinés à équiper six brigades de combat à déploiement rapide d'ici 2008."
 CAP_mechanized_equipment_10:0 "M1296 Dragoon"
 CAP_mechanized_equipment_10_short:0 "M1296 Dragoon"
 CAP_mechanized_equipment_10_desc:0 "L'armée américaine cherchait à améliorer la puissance de feu du véhicule de transport d'infanterie M1126 Stryker de base. Sa mitrailleuse lourde de 12,7 mm n'était pas particulièrement efficace contre les véhicules blindés modernes. L'armée américaine a donc approuvé une mise à niveau de la létalité en équipant 81 Strykers de tourelles légères sans pilote de 30 mm. Cela a considérablement augmenté la puissance de feu du Stryker tout en préservant la mobilité du véhicule."
 CAP_mechanized_heavy_equipment_1:0 "M44"
 CAP_mechanized_heavy_equipment_1_short:0 "M44"
 CAP_mechanized_heavy_equipment_1_desc:0 "Le M44 est un véhicule blindé de transport de troupes super-lourd développé par le département de l'artillerie de l'armée américaine en 1951. Le M44 est équipé d'un moteur AOS-895-3 et d'une suspension à barres de torsion. Il peut rouler à 24 km/h hors route et a une autonomie de 96 km. Le projet M44 a été annulé et seuls 6 prototypes ont été créés. Malgré cela, certains prototypes ont été testés sur le terrain et ont participé à des combats pendant la guerre de Corée. Bien qu'il fût extrêmement blindé et puisse transporter 24 passagers, il était très lent et constituait une cible importante."
 CAP_mechanized_heavy_equipment_2:0 "Transporteur, Personnel, À chenilles, Blindé, M75"
 CAP_mechanized_heavy_equipment_2_short:0 "M75"
 CAP_mechanized_heavy_equipment_2_desc:0 "Le M75 est un véhicule blindé de transport de troupes lourd développé par l'International Harvester Corporation au début des années 1950. Le M75 a été largement utilisé pendant la guerre de Corée, mais a été très rapidement retiré du service par la suite. Le M75 est équipé d'un moteur à essence 6 cylindres AO-895-4 et d'une suspension à barres de torsion. Il peut atteindre une vitesse de 70 km/h et a une autonomie de 185 km. Après l'annulation du projet M44 en raison de sa taille démesurée, le développement d'un autre véhicule blindé lourd entièrement fermé a commencé. Le projet M75 a abouti à un châssis beaucoup plus petit et beaucoup plus rapide que le M44. Cependant, il était encore considéré comme trop grand et le projet M95 a continué à bénéficier d'un financement."
 CAP_mechanized_heavy_equipment_3:0 "Transporteur, Personnel, À chenilles, Blindé, M113 ACAV"
 CAP_mechanized_heavy_equipment_3_short:0 "M113 ACAV"
 CAP_mechanized_heavy_equipment_3_desc:0 "Le M113 ACAV, également connu sous le nom de M150, est un véhicule blindé d'assaut de cavalerie, qui est une forme primitive du IFV. Le M113 ACAV a été développé dans les années 60 par la Food Machinery Corporation. Le M113 ACAV est similaire au M113 dans la plupart des aspects. La variante ACAV du M113 est équipée d'un lanceur TOW et peut potentiellement être équipée d'une tourelle armée d'un lance-flammes, comme on l'a vu au Vietnam. Le M113 ACAV a été utilisé partout où le M113 a été utilisé."
 CAP_mechanized_heavy_equipment_4:0 "Transporteur, Personnel, À chenilles, Blindé, M113A1 ACAV"
 CAP_mechanized_heavy_equipment_4_short:0 "M113A1 ACAV"
 CAP_mechanized_heavy_equipment_4_desc:0 "Version M113A1 ACAV équipée d'armement supplémentaire, tel qu'un fusil sans recul."
 CAP_mechanized_heavy_equipment_5:0 "M2 Bradley"
 CAP_mechanized_heavy_equipment_5_short:0 "M2 Bradley"
 CAP_mechanized_heavy_equipment_5_desc:0 "Le M2 Bradley est un véhicule blindé de combat d'infanterie amphibie développé par BAE Systems Land & Armaments en 1981. Le M2 Bradley a été utilisé dans tous les conflits américains depuis sa création, y compris l'opération Tempête du désert. Le projet M2 Bradley visait à créer une nouvelle génération de véhicules blindés pour l'ère moderne, équipés d'une protection NBC. Le projet a démarré à la fin des années 60 et a nécessité de nombreux prototypes avant d'aboutir à sa forme actuelle. Le Bradley est équipé d'un moteur 8 cylindres VTA-903T et d'une suspension à barres de torsion. Le Bradley est armé d'un canon automatique de 25 mm et d'un accessoire antichar TOW. BAE a été chargé de créer un véhicule de transport d'infanterie qui était bae. S'inspirant des prototypes du projet MICV, le Bradley est capable d'effectuer des missions de reconnaissance et de soutien pour l'infanterie qu'il transporte. Bien qu'il soit doté d'un blindage en aluminium, sa puissance de feu et sa mobilité lui permettent de se protéger sur le terrain."
 CAP_mechanized_heavy_equipment_6:0 "M2A2 Bradley"
 CAP_mechanized_heavy_equipment_6_short:0 "M2A2 Bradley"
 CAP_mechanized_heavy_equipment_6_desc:0 "Lancé en 1988, l'A2 était équipé d'un moteur amélioré de 600 chevaux (447 kW) avec une transmission hydromécanique HMPT-500-3 et d'un blindage amélioré (à la fois passif et pouvant être équipé d'un blindage réactif explosif). Le nouveau blindage protège le Bradley contre les obus APDS de 30 mm et les RPG (ou armes antichars similaires). Il a également permis de supprimer les ailettes qui rendaient le Bradley amphibie et recouvraient les ouvertures latérales de tir."
 CAP_mechanized_heavy_equipment_7:0 "M2A2 Bradley ODS"
 CAP_mechanized_heavy_equipment_7_short:0 "M2A2 Bradley ODS"
 CAP_mechanized_heavy_equipment_7_desc:0 "Le M2 ODS Bradley est une version améliorée du Bradley développée par BAE Systems en 1991. L'ODS était doté d'un intérieur optimisé, d'un blindage réactif explosif et d'une transmission hydromécanique. Cependant, le blindage réactif avait un coût et empêchait le Bradley de nager. L'ODS a également ajouté un télémètre plus performant, un système de navigation, un système de contre-mesure antimissile et un système d'imagerie thermique. De plus, un très petit réchauffeur de nourriture et des toilettes ont été ajoutés, ce qui est considéré par certains comme la meilleure innovation."
 CAP_mechanized_heavy_equipment_8:0 "M2A3 Bradley"
 CAP_mechanized_heavy_equipment_8_short:0 "M2A3 Bradley"
 CAP_mechanized_heavy_equipment_8_desc:0 "Le M2A3 Bradley est une version améliorée du Bradley développé par BAE Systems en 2000. Le modèle A3 a rendu le Bradley entièrement numérique et a permis de contrôler à distance tous les éléments du véhicule. De nombreuses améliorations ont également été apportées au blindage afin d'augmenter la capacité de survie du véhicule. De plus, le kit NBC du Bradley, qui comprend une protection supplémentaire contre les radiations, des filtres à air et une résistance aux produits chimiques, a été ajouté."
 CAP_mechanized_marine_equipment_1:0 "LVT-4 Water Buffalo"
 CAP_mechanized_marine_equipment_1_short:0 "LVT-4"
 CAP_mechanized_marine_equipment_1_desc:0 "Le LVTP-4 est un véhicule de débarquement amphibie conçu par Ford Machinery Corporation au début des années 1940. Utilisé pendant la Seconde Guerre mondiale, la guerre de Corée et la guerre du Vietnam, il est équipé d'un moteur radial W-670-9A à 7 cylindres et peut parcourir jusqu'à 120 km dans l'eau à une vitesse de 11 km/h. Évolution du LVTP-1, le LVTP-4 est capable de parcourir des distances impressionnantes à la nage, bien qu'à faible vitesse. Si vous devez traverser 110 km d'eau en une dizaine d'heures, le LVTP-4 est le véhicule idéal. Il peut transporter des troupes ou des véhicules."
 CAP_mechanized_marine_equipment_2:0 "LVTP-5"
 CAP_mechanized_marine_equipment_2_short:0 "LVTP-5"
 CAP_mechanized_marine_equipment_2_desc:0 "Le LVTP-5 est un véhicule blindé amphibie conçu par la Food Machinery Corporation en 1956. Il a été utilisé au combat au Vietnam. Le LVTP-5 est équipé d'un moteur LV-1790-1 V12 et peut parcourir jusqu'à 57 miles dans l'eau à une vitesse de 7 mph. Il s'agit d'une évolution du LVTP-4 et il est beaucoup plus résistant et fiable que son prédécesseur. De plus, des variantes ont été créées afin de permettre l'utilisation de son châssis dans des véhicules d'appui-feu tels que des obusiers de 105 mm. Une variante AA a été prototypée, mais n'a jamais été mise en production."
 CAP_mechanized_marine_equipment_3:0 "LVTP-7"
 CAP_mechanized_marine_equipment_3_short:0 "LVTP-7"
 CAP_mechanized_marine_equipment_3_desc:0 "Le LVTP-7 est un véhicule blindé amphibie conçu en 1972 par la Food Machinery Corporation. Il a été utilisé lors des conflits des Malouines, de la Grenade, du Golfe, de Syrie et d'Irak. Le LVTP-7 est équipé d'un moteur 8V-53T et peut parcourir 23 miles à une vitesse de 8,2 mph dans l'eau. Le LVTP-7 est notamment capable de se déplacer dans des conditions de mer de force 5, classées comme « agitées » avec une houle moyenne à forte, ce qui le rend plus performant que le LVTP-5 dans des conditions météorologiques difficiles. De plus, il est beaucoup mieux blindé que le LVTP-5. Comme il peut se déplacer de manière impressionnante dans des conditions de mer de force 5 et qu'il est mieux protégé, il a remplacé le LVTP-5. Il est également équipé de diffuseurs de fumée."
 CAP_mechanized_marine_equipment_4:0 "LVTP-7A1"
 CAP_mechanized_marine_equipment_4_short:0 "LVTP-7A1"
 CAP_mechanized_marine_equipment_4_desc:0 "Le LVTP-7A1 est un véhicule blindé de transport de troupes amphibie conçu en 1984 par la Food Machinery Corporation. Il a été utilisé au combat dans le Golfe, en Syrie et en Irak. Le LVTP-7A1 est équipé d'un moteur VTAC RAM-RS de 525 ch et peut rouler à peu près à la même vitesse que le LVTP-7. Son moteur, sa transmission et son système d'armement ont été améliorés, et il est plus facile à entretenir que le LVTP-7. Il bénéficie également d'un certain nombre d'améliorations en matière de sécurité afin de réduire les effets des impacts."
 CAP_mechanized_marine_equipment_5:0 "EFVP-1 Véhicule d'assaut amphibie avancé"
 CAP_mechanized_marine_equipment_5_short:0 "EFVP-1 AAAV"
 CAP_mechanized_marine_equipment_5_desc:0 "L'EFVP-1 AAAV est un projet de véhicule blindé amphibie conçu par General Dynamics qui a été annulé. L'EFVP-1 utilisait un moteur MT 883 ka, mais il semblait qu'un autre moteur serait utilisé au fur et à mesure de la production. Il est capable de parcourir 75 miles dans l'eau à une vitesse impressionnante de 28,6 mph. Le véhicule aurait également été équipé d'une tourelle de type IFV pour un soutien de tir supplémentaire. Son armement exact est inconnu, mais il aurait pu être équipé de tout type d'armement, des canons automatiques aux missiles antichars. Le développement du projet a coûté 3 milliards, mais il a finalement été annulé car il était estimé que 12 milliards supplémentaires seraient nécessaires pour créer le reste de ce que le véhicule était censé faire. Il a été mis à l'épreuve sur le terrain d'essai lorsqu'une pièce s'est détachée pendant les tests et l'un des concepteurs, furieux que cela se reproduise, l'a frappée si fort qu'il s'est cassé le pied."
 CAP_motorized_equipment_1:0 "GMC CCKW"
 CAP_motorized_equipment_1_short:0 "GMC CCKW"
 CAP_motorized_equipment_1_desc:0 "Le GMC CCKW est un camion 6x6 de 2,5 tonnes conçu par General Motors en 1941. Il a été largement utilisé pendant la Seconde Guerre mondiale et la guerre de Corée. Le CCKW est équipé d'un moteur GMC270, d'une transmission à 5 vitesses/2 gammes et d'un essieu rigide sur suspension à ressorts à lames. Il peut transporter une charge de 5 000 livres. Il peut rouler jusqu'à 45 mph sur plus de 300 miles et consomme 7,5 mi/gal. Le CCKW a été développé pour l'armée américaine comme camion de transport de troupes et de ravitaillement. Outre son utilisation pour le ravitaillement et le transport, ce camion pouvait également être équipé d'une carrosserie de fourgon pour servir de véhicule de confort/soutien sur le terrain et pouvait également être équipé d'armes remorquées sur sa plate-forme afin de créer des armes SP bon marché."
 CAP_motorized_equipment_2:0 "M35"
 CAP_motorized_equipment_2_short:0 "M35"
 CAP_motorized_equipment_2_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé dans tous les conflits américains de 1950 à 1988. Le M35 est équipé d'un moteur OA-331, d'une boîte de vitesses à 5 rapports et 2 gammes, et d'essieux rigides avec suspension à lames. Il peut transporter une charge utile de 2 268 kg (5 000 lb). Il peut rouler à 93 km/h (58 mph) sur une distance de 480 km (300 miles) et sa consommation est de 30,5 l/100 km (8 mi/gal). Il a été largement utilisé par les États-Unis et nombre de leurs alliés à travers le monde. Il a été conçu pour remplacer le GMC CCKW après la guerre et offrir un véhicule plus robuste et plus rapide."
 CAP_motorized_equipment_3:0 "M809"
 CAP_motorized_equipment_3_short:0 "M809"
 CAP_motorized_equipment_3_desc:0 "Le M809 est un camion 6x6 de 5 tonnes conçu par AM General en 1970. Il a été utilisé dans tous les conflits américains de 1970 à 1982. Le M809 est équipé d'un moteur NH250, d'une transmission à 5 vitesses et 2 gammes, et d'essieux rigides sur ressorts à lames. Il peut transporter une charge utile de 2 268 kg (5 000 lb). Sa vitesse maximale est de 84 km/h (52 mph) sur une autonomie de 563 km (350 miles) et sa consommation est de 23,5 l/100 km (10 mi/gal). Outre ses fonctions de transport de marchandises, ce véhicule est très robuste et peut accueillir divers équipements utilitaires sur sa benne. Il est ainsi possible d'y installer des dépanneuses, des bennes basculantes, des remorques, de grands fourgons pour le confort et le soutien, du matériel de pontage, et bien d'autres choses encore. Grâce à sa garde au sol élevée, le M809 peut également franchir des rivières peu profondes et sa suspension lui confère d'excellentes performances sur route comme en tout-terrain."
 CAP_motorized_equipment_4:0 "M939"
 CAP_motorized_equipment_4_short:0 "M939"
 CAP_motorized_equipment_4_desc:0 "Le M939 est un camion 6x6 de 5 tonnes développé par AM General en 1982. Il a été utilisé dans tous les conflits occidentaux depuis lors. Le M939 est équipé d'un moteur 6CTA8.3, d'une transmission à 5 vitesses et 2 gammes, et d'essieux rigides avec suspension à lames. Ce véhicule peut transporter une charge utile de 4 536 kg (10 000 lb). Il peut parcourir 563 km (350 miles) à une vitesse moyenne de 10,1 km/h (6,3 mph) et sa consommation est de 34,7 l/100 km (6 mi/gal). Il est toujours en service aujourd'hui. Le M939 est très performant sur tous les terrains et est parfaitement adapté aux conditions climatiques difficiles. Il a donné naissance à une nouvelle génération de camions, de tracteurs routiers et de véhicules de dépannage et a été produit à grande échelle. Plus fiable et plus robuste que les véhicules précédents, il a complètement remplacé les contrats de production antérieurs."
 CAP_motorized_equipment_5:0 "MTVR"
 CAP_motorized_equipment_5_short:0 "MTVR"
 CAP_motorized_equipment_5_desc:0 "Le MTVR est un camion 6x6 de 7 tonnes conçu par Oshkosh Defense en 1996. Il a été utilisé dans tous les conflits occidentaux depuis 2001. Le MTVR est équipé d'un moteur Caterpillar C-12, d'une transmission automatique à 7 vitesses 4070P avec blocage de différentiel et d'une suspension à ressorts hélicoïdaux TAK-4 avec anti-roulis. Le véhicule peut transporter 7 000 livres. Il peut rouler à 65 mph pendant 300 miles et consomme 4 mi/gal. Le MTVR n'a pas la capacité de charge du M939 et est moins économe en carburant, il ne l'a donc pas supplanté, mais il reste plus fiable et plus performant dans des conditions difficiles. De plus, le MTVR est plus résistant et plus apte à faire face à des situations potentiellement dangereuses, offrant une meilleure protection contre les armes légères que le M939."
