 CUM_cv_nav_bomber_equipment_1:0 "Ilyushin Il-4 Palubniy"
 CUM_cv_nav_bomber_equipment_1_short:0 "Il-4P Bob"
 CUM_cv_nav_bomber_equipment_1_desc:0 "<FICTIF> L'Il-4 Palubniy est une version modifiée de l'Il-4 destinée à être exploitée depuis les ponts des porte-avions soviétiques. Utilisé par l'aviation navale soviétique, l'Il-4 servait de torpilleur et de bombardier en piqué de fortune, bien qu'il fût pour l'essentiel inefficace dans ce dernier rôle en raison de sa grande envergure (les ailes risquaient davantage de se détacher une fois la vitesse de croisière atteinte). Malgré cela, l'Il-4P s'est montré efficace pour tenir à distance les marines de l'Axe du mieux qu'il pouvait lors des campagnes menées en mer Noire. À l'instar de sa variante terrestre, son nom de code OTAN est Bob."
 CUM_cv_nav_bomber_equipment_2:0 "Tupolev Tu-2T Palubniy"
 CUM_cv_nav_bomber_equipment_2_short:0 "Tu-2TP Bat"
 CUM_cv_nav_bomber_equipment_2_desc:0 "<FICTIF> Le Tu-2T Palubniy est la version embarquée du bombardier torpilleur Tu-2T. À l'instar de ses variantes terrestres, le Tu-2TP a été mis à la disposition des pilotes de l'aviation navale soviétique dès le début de l'année 1945, et a principalement été utilisé pour mener des attaques côtières contre la côte allemande alors que les troupes soviétiques se rapprochaient de Berlin. En raison de sa maniabilité, le Tu-2TP a également servi de chasseur lourd à basse altitude pendant le conflit. Son indicatif OTAN est « Bat », tout comme la variante terrestre."
 CUM_cv_nav_bomber_equipment_3:0 "Ilyushin Il-6 Palubniy"
 CUM_cv_nav_bomber_equipment_3_short:0 "Il-6P"
 CUM_cv_nav_bomber_equipment_3_desc:0 "<FICTIF> L'Il-6 Palubniy est une évolution de l'Il-6, dont le développement s'est poursuivi après l'abandon de la version terrestre en 1944. Contrairement à la version terrestre, l'Il-6P était équipé d'un groupe motopropulseur différent, car la nécessité d'une grande autonomie était largement superflue étant donné qu'il était embarqué sur un porte-avions. En conséquence, ses performances s'étaient considérablement améliorées, atteignant un niveau comparable à celui de l'Il-4 dont il s'inspirait à l'origine. Cependant, sa durée de service allait elle aussi être de courte durée, car le développement d'avions à longue portée basés à terre rendit ce type d'appareil obsolète."
 CUM_cv_CAS_equipment_1:0 "Polikarpov I-180 Palubniy"
 CUM_cv_CAS_equipment_1_short:0 "I-180P"
 CUM_cv_CAS_equipment_1_desc:0 "<FICTIF> Conçu comme une version navale de l'avion I-180, l'I-180P a été adapté pour remplir le rôle d'avion d'attaque légère et d'appui aérien rapproché. Dans ce rôle, cependant, l'I-180 s'est révélé peu performant, car il n'était ni assez robuste ni doté de la puissance de feu nécessaire pour assurer des missions d'appui aérien rapproché à partir de porte-avions stationnés en mer du Nord. Ce modèle fut rapidement remplacé par les Il-2T et Il-10T dès leur mise en service."
 CUM_cv_CAS_equipment_2:0 "Ilyushin Il-2T Sturmovik"
 CUM_cv_CAS_equipment_2_short:0 "Il-2T Sturmovik"
 CUM_cv_CAS_equipment_2_desc:0 "L'Il-2T est une variante torpilleur-bombardier du célèbre avion d'attaque au sol Il-2 Sturmovik. Afin de gagner du poids pour lui permettre de voler, les deux canons VYa-23 de 23 mm situés sur les ailes ont été retirés. Il pouvait ainsi être équipé d'une seule torpille de 45 cm (18 pouces). Bien que ce modèle n'ait jamais été utilisé sur le terrain, l'idée d'équiper les Sturmoviks de torpilles n'était pas nouvelle, puisque des Il-2M3 avaient été modifiés pour transporter des supports de torpilles pendant les campagnes de Crimée et du Caucase pendant la Seconde Guerre mondiale."
 CUM_cv_CAS_equipment_3:0 "Ilyushin Il-10T"
 CUM_cv_CAS_equipment_3_short:0 "Il-10T"
 CUM_cv_CAS_equipment_3_desc:0 "<FICTIF> Cette variante de bombardier torpilleur de l'Il-10 a été mise au point après la fin des hostilités en Europe et en Mandchourie, contrairement à l'Il-10 dont elle est issue. Mis à part une brève période passée à soutenir la Corée du Nord pendant la guerre de Corée, l'Il-10T a connu une existence relativement paisible, avant d'être retiré du service en 1953 au profit de chasseurs-bombardiers à réaction basés à terre, tels que le Su-7 Fitter."
 CUM_cv_fighter_equipment_0:0 "Polikarpov I-153 Chaika"
 CUM_cv_fighter_equipment_0_short:0 "I-153 Chaika"
 CUM_cv_fighter_equipment_0_desc:0 "L'I-153 est une version modifiée du chasseur biplan I-15. Équipé d'un train d'atterrissage escamotable, l'I-153 avait pour objectif (qu'il n'a finalement pas atteint) d'améliorer les performances du biplan. Malgré une courte durée de service, cet appareil s'est bien comporté lors de la bataille de Khalkin Gol contre les forces japonaises, où il a fait jeu égal avec le Type 97 japonais (la version de l'Armée impériale japonaise du Ki-27 « Nate »). L'I-153 partage son surnom avec l'I-15, Chaika, qui signifie « mouette »."
 CUM_cv_fighter_equipment_1:0 "Polikarpov I-153UD Chaika"
 CUM_cv_fighter_equipment_1_short:0 "I-153UD Chaika"
 CUM_cv_fighter_equipment_1_desc:0 "L'I-153UD est une version modernisée de l'I-153 Chaika, qui remplace la structure en acier recouverte de bois et de toile par une structure entièrement en bois dans la partie arrière du fuselage. Ces appareils étaient équipés de réservoirs d'huile internes plus volumineux et disposaient d'un système de raccordement permettant d'installer des réservoirs de carburant externes sous les ailes, ce qui doublait leur autonomie de combat."
 CUM_cv_fighter_equipment_2:0 "Yakovlev Yak-1M"
 CUM_cv_fighter_equipment_2_short:0 "Yak-1M"
 CUM_cv_fighter_equipment_2_desc:0 "Le Yak-1M est une version modifiée des chasseurs Yakovlev Yak-1 et Yak-3. Il présente une surface alaire nettement réduite, un système d'admission d'air de refroidissement revu et un moteur modernisé, tout en affichant un poids total réduit, ce qui l'aurait rendu idéal pour les opérations à partir de porte-avions, sans pour autant sacrifier les performances qui faisaient la réputation du Yak-1."
 CUM_cv_fighter_equipment_3:0 "Yakovlev Yak-7UTI"
 CUM_cv_fighter_equipment_3_short:0 "Yak-7UTI"
 CUM_cv_fighter_equipment_3_desc:0 "The Yak-7UTI was originally developed as a two-seat trainer aircraft for training the future of Soviet pilots. But the type could be adapted well for carrier operations, utilizing the twin control scheme to ensure that if one pilot got tired, the other could perform just as well. The type could serve in the role of carrier air defense against Nazi German and later American aircraft."
 CUM_fighter_equipment_0:0 "Polikarpov I-15 Chaika"
 CUM_fighter_equipment_0_short:0 "I-15 Chaika"
 CUM_fighter_equipment_0_desc:0 "L'I-15 (nom de développement TsKB-3), un chasseur biplan, était connu pour ses ailes en forme d'ailes de mouette caractéristiques, qui lui valurent le surnom de « Chaika » (mot russe signifiant « mouette »). Il fut utilisé en grand nombre par l'armée de l'air soviétique et fut l'un des deux chasseurs standard employés par l'armée de l'air républicaine espagnole pendant la guerre civile espagnole."
 CUM_fighter_equipment_1:0 "Yakolev Yak-3"
 CUM_fighter_equipment_1_short:0 "Yak-3"
 CUM_fighter_equipment_1_desc:0 "Le Yakovlev Yak-3 était un chasseur soviétique monomoteur et monoplace de la Seconde Guerre mondiale. Robuste et facile à entretenir, il était très apprécié tant par les pilotes que par le personnel au sol. L'un des chasseurs les plus petits et les plus légers utilisés par les belligérants pendant la guerre, son rapport puissance/poids élevé lui conférait d'excellentes performances et il s'est révélé être un redoutable chasseur à courte portée."
 CUM_fighter_equipment_2:0 "Lavochkin La-7"
 CUM_fighter_equipment_2_short:0 "La-7"
 CUM_fighter_equipment_2_desc:0 "Le Lavochkin La-7 était un avion de chasse soviétique monoplace à moteur à pistons développé pendant la Seconde Guerre mondiale par le bureau d'études Lavochkin. Il s'agissait d'une version améliorée du Lavochkin La-5, et du dernier modèle d'une famille d'avions qui avait débuté avec le LaGG-1 en 1938."
 CUM_fighter_equipment_3:0 "Lavochkin La-9"
 CUM_fighter_equipment_3_short:0 "La-9"
 CUM_fighter_equipment_3_desc:0 "Le La-9 représente une évolution du prototype Lavochkin La-126. Le premier prototype, baptisé La-130, fut achevé en 1946. Sa ressemblance avec le célèbre Lavochkin La-7 n'était que superficielle : le nouveau chasseur était entièrement construit en métal et doté d'une aile à écoulement laminaire. La réduction du poids due à l'élimination du bois de la cellule permit d'augmenter considérablement la capacité en carburant et d'armer l'appareil de quatre canons. Des simulations de combat ont démontré que le La-130 était à égalité avec le La-7, mais inférieur au Yakovlev Yak-3 dans les plans horizontaux. Le nouveau chasseur, officiellement désigné La-9, est entré en production en août 1946. Au total, 1 559 appareils ont été construits jusqu'à la fin de la production en 1948."
 CUM_jet_multirole_equipment_1:0 "Mikoyan-Gurevich MiG-9"
 CUM_jet_multirole_equipment_1_desc:0 "Le MiG-9 Fargo fut le premier avion à réaction conçu par Mikoyan après la Seconde Guerre mondiale. Introduit en 1948, il fut utilisé de manière limitée au combat et à l'entraînement pendant la guerre civile chinoise et la guerre de Corée. Au total, 610 appareils furent produits, exclusivement par l'URSS. Les derniers MiG 9 furent retirés du service par la République populaire de Chine en 1951."
 CUM_jet_multirole_equipment_1_short:0 "MiG-9"
 CUM_jet_multirole_equipment_2:0 "Mikoyan-Gurevich MiG-15"
 CUM_jet_multirole_equipment_2_desc:0 "Sans doute l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a participé à de nombreux conflits depuis son introduction pendant la guerre de Corée, où il s'est révélé être un adversaire redoutable pour les F-86 Sabre et F9F Panther américains. Une partie de la frontière entre la Corée et la Chine a été surnommée « MiG Alley » en raison de leur omniprésence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Si la plupart des appareils ont été mis hors service dans les années 1950, certains sont encore en service dans l'armée de l'air nord-coréenne."
 CUM_jet_multirole_equipment_2_short:0 "MiG-15"
 CUM_jet_multirole_equipment_3:0 "Mikoyan-Gurevich MiG-17"
 CUM_jet_multirole_equipment_3_desc:0 "Successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence dans l'armée de l'air chinoise sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, en Afrique, en Europe et en Asie. Son premier déploiement au combat a eu lieu en 1958, lorsque des MiG de la République populaire de Chine ont affronté des F-86 Sabre chinois nationalistes au-dessus du détroit de Taiwan. Cependant, le MiG-17 a principalement été utilisé pendant la guerre du Vietnam par la NVAF et la PLAAF, où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même tenu tête aux chasseurs américains Phantom II, beaucoup plus modernes et supersoniques, pendant la guerre du Vietnam. Le MiG-17 a été généralement retiré du service dans les années 1970, mais il reste encore en service de manière limitée dans certains pays africains et en Corée du Nord."
 CUM_jet_multirole_equipment_3_short:0 "MiG-17"
 CUM_jet_multirole_equipment_4:0 "Mikoyan-Gurevich MiG-19"
 CUM_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de fabrication soviétique capable d'atteindre une vitesse supersonique en vol horizontal. Son équivalent américain dans la « série Century » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les McDonnell Douglas F-4 Phantom II et Republic F-105 Thunderchief, plus modernes, au-dessus du Nord-Vietnam."
 CUM_jet_multirole_equipment_4_short:0 "MiG-19"
 CUM_jet_multirole_equipment_5:0 "Mikoyan-Gurevich MiG-21F-13"
 CUM_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, équipé de missiles à portée au-delà du champ visuel et d'un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, notamment en Chine et en Inde où il a été construit en grand nombre sous licence. Plus de 11 000 exemplaires ont été construits, servant dans plus de 60 pays sur les 5 continents. Au cours de sa durée de vie, le MiG-21 a abattu 240 avions ennemis. Le MiG-21 a été utilisé dans de nombreux conflits, notamment au Vietnam (où il a remporté un énorme succès), lors de la guerre indo-pakistanaise de 1971, lors de la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il est toujours en service après plus de six décennies."
 CUM_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 CUM_jet_multirole_equipment_6:0 "Mikoyan-Gurevich MiG-21PF"
 CUM_jet_multirole_equipment_6_desc:0 "Version de série de l'intercepteur tout temps. Ces appareils étaient équipés du turboréacteur R11F2-300 et, à partir du septième lot de production, du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T, également appelé RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 afin de permettre l'utilisation du missile air-air à guidage laser RS-2US (alias K-5MS) en plus du missile à guidage infrarouge K-13."
 CUM_jet_multirole_equipment_6_short:0 "MiG-21PF"
 CUM_jet_multirole_equipment_7:0 "Mikoyan-Gurevich MiG-23M"
 CUM_jet_multirole_equipment_7_desc:0 "Le MiG-23 a été le premier chasseur soviétique à être équipé d'un radar à balayage vers le bas et à tirer vers le bas, et l'un des premiers à être armé de missiles à portée au-delà du champ visuel. Sa production a débuté en 1969 et a atteint des chiffres importants avec plus de 5 000 appareils construits, ce qui en fait l'avion à ailes à géométrie variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service de manière limitée chez certains clients à l'exportation."
 CUM_jet_multirole_equipment_7_short:0 "MiG-23M"
 CUM_jet_multirole_equipment_8:0 "Mikoyan-Gurevich MiG-23ML"
 CUM_jet_multirole_equipment_8_desc:0 "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment en termes de résistance et de fiabilité de la cellule, de performances du moteur, de maniabilité et de performances radar. Une refonte considérable de la cellule a été effectuée, donnant naissance au MiG-23ML."
 CUM_jet_multirole_equipment_8_short:0 "MiG-23ML"
 CUM_jet_multirole_equipment_9:0 "Mikoyan-Gurevich MiG-23MLD"
 CUM_jet_multirole_equipment_9_desc:0 "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de cette mise à niveau était d'améliorer la maniabilité, en particulier lors d'angles d'attaque élevés, qui étaient considérés comme le principal défaut du MiG-23M/ML. La perche pitot était équipée de générateurs de tourbillons, et les bords d'attaque dentelés des ailes étaient également conçus pour agir comme des générateurs de tourbillons. Le système de commande de vol intégrait le dispositif de butée synthétique SOS-3-4 et le limiteur de signaux."
 CUM_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 CUM_jet_multirole_equipment_10:0 "Mikoyan-Gurevich MiG-29A"
 CUM_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le bureau d'études Mikoyan. Il s'agit du premier chasseur de quatrième génération à avoir été mis en service par l'URSS et le bloc de l'Est. Il intègre une avionique améliorée et des capacités radar considérablement renforcées. Les premiers MiG-29 ont été utilisés comme avions d'entraînement par le Pacte de Varsovie, avec des exportations limitées vers l'Inde, mais leur utilisation au combat était restreinte. Le MiG-29 allait plus tard servir de base à des variantes largement produites, telles que le MiG-29S, le MiG-29M et le MiG-35."
 CUM_jet_multirole_equipment_10_short:0 "MiG-29A"
 CUM_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29M"
 CUM_mr_stealth_fighter_equipment_1_short:0 "MiG-29M"
 CUM_mr_stealth_fighter_equipment_1_desc:0 "L'avion MiG-29M/M2 est une version révisée du MiG-29 de base. Il offre une capacité multirôle plus robuste grâce à une utilisation améliorée des armes air-air et air-sol de haute précision. Il dispose également d'une autonomie de combat considérablement accrue, grâce à une augmentation de sa capacité interne en carburant. Quelques modifications ont été apportées au cours du développement de l'avion. La cellule redessinée a été construite à partir d'un alliage léger d'aluminium et de lithium afin d'augmenter le rapport poussée/poids. La géométrie des rampes d'admission d'air a été revue, les persiennes d'admission supérieures ont été supprimées afin de laisser place à davantage de carburant dans les LERX, des grilles ont été installées pour empêcher les dommages causés par des objets étrangers (FOD) et les dimensions des entrées ont été agrandies pour permettre un débit d'air plus important."
 CUM_jet_light_equipment_1:0 "Mikoyan-Gurevich MiG-9UTI"
 CUM_jet_light_equipment_1_short:0 "MiG-9UTI"
 CUM_jet_light_equipment_1_desc:0 "Afin d'assurer la préparation du personnel navigant de l'unité de combat des avions de chasse de l'armée de l'air, l'équipe OKB-155, dirigée par A.I. Mikoyan, a été chargée de développer une version biplace de l'avion MiG-9. Les travaux sur une nouvelle version du MiG-9 ont commencé en juillet 1946 à l'OKB-155. La conception préliminaire du « jumeau » était prête à la fin du mois d'octobre et, conformément au calendrier de conception et de construction de l'avion approuvé par Mikoyan le 26 août, le premier prototype a été présenté à l'aérodrome le 20 décembre 1946."
 CUM_jet_light_equipment_2:0 "Mikoyan-Gurevich MiG-15UTI"
 CUM_jet_light_equipment_2_short:0 "MiG-15UTI"
 CUM_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 s'est vu officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n° 1 entre mars et mai 1949. La cabine de l'instructeur sur le MiG-15UTI a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement comprenait un canon NR-23 de 23 mm avec 80 cartouches et une mitrailleuse UBK-E avec 150 cartouches."
 CUM_jet_light_equipment_3:0 "L-29 Delfin"
 CUM_jet_light_equipment_3_short:0 "L-29 Delfin"
 CUM_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín (nom de code OTAN : Maya) est un avion d'entraînement militaire à réaction développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Plus de 3 000 exemplaires du L-29 Delfín ont été produits. Environ 2 000 d'entre eux auraient été livrés à l'Union soviétique, où il a servi d'avion d'entraînement standard pour l'armée de l'air soviétique."
 CUM_jet_light_equipment_4:0 "Aero L-39 Albatros"
 CUM_jet_light_equipment_4_short:0 "L-39 Albatros"
 CUM_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme principal avion d'entraînement. Il a été le premier avion d'entraînement à être équipé d'un turboréacteur à double flux. Ce modèle a été exporté vers de nombreux pays en tant qu'avion d'entraînement militaire."
 CUM_jet_light_equipment_5:0 "Aero L-39ZA Albatros"
 CUM_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 CUM_jet_light_equipment_5_desc:0 "L-39 considérablement amélioré pour l'entraînement au combat et les attaques légères, équipé d'un train d'atterrissage plus robuste, d'une charge utile plus importante et, surtout, d'un canon double GSh-23L de 23 millimètres fixé dans un pod conforme sous le cockpit, avec un chargeur de 150 cartouches dans le fuselage."
 CUM_heavy_fighter_equipment_1:0 "Yakovlev Yak-9"
 CUM_heavy_fighter_equipment_1_short:0 "Yak-9"
 CUM_heavy_fighter_equipment_1_desc:0 "Le Yak-9 avait un fuselage arrière raccourci et une verrière offrant une vision panoramique. Sa structure métallique plus légère permettait d'augmenter la charge de carburant et l'armement par rapport aux modèles précédents construits en bois. Le Yak-9 était maniable à grande vitesse à basse et moyenne altitude et facile à contrôler, ce qui en a fait l'un des chasseurs soviétiques les plus produits pendant la Seconde Guerre mondiale."
 CUM_heavy_fighter_equipment_2:0 "Petlyakov Pe-3"
 CUM_heavy_fighter_equipment_2_short:0 "Pe-3"
 CUM_heavy_fighter_equipment_2_desc:0 "Évolution du Pe-2, le Pe-3 était un avion de chasse nocturne dédié lorsqu'il a été introduit en 1941, la même année que son homologue, le Pe-2. Sa conception et son utilisation ont suivi une voie comparable à celle empruntée par la Luftwaffe allemande avec le Junkers Ju 88 et la Royal Air Force britannique avec le De Havilland Mosquito. Utilisé avec distinction pendant la bataille de Moscou, et malgré l'évacuation de la seule usine chargée de sa construction à la suite de la bataille, le Pe-3 fut utilisé tout au long du conflit, les séries de production ultérieures étant consacrées à la construction de variantes de reconnaissance de ce type."
 CUM_heavy_fighter_equipment_3:0 "Lavochkin La-11"
 CUM_heavy_fighter_equipment_3_short:0 "La-11"
 CUM_heavy_fighter_equipment_3_desc:0 "Développé en 1947, après la fin de la Seconde Guerre mondiale, le La-11 était une version améliorée du La-9 « Fritz » destinée à servir d'avion d'escorte à longue portée. L'avion était équipé de pneus plus larges pour supporter son poids accru et de commodités pour les longs vols, telles que des sièges mieux rembourrés, des accoudoirs et un urinoir. De plus, un équipement complet de navigation radio a été installé. Sans surprise, les performances au combat avec un plein de carburant en ont souffert. Cependant, à mesure que la charge de carburant se rapprochait de celle du La-9, les performances s'amélioraient. Les pilotes du La-11 au service de l'Union soviétique, puis de la Chine, ont servi dans la défense aérienne, abattant des Mustang et des avions d'attaque de fabrication américaine pendant la guerre de Corée. Son nom de code OTAN est Fang."
 CUM_jet_interceptor_equipment_1:0 "Yakovlev Yak-17"
 CUM_jet_interceptor_equipment_1_desc:0 "Le Yak-17 fut présenté pour la première fois au public lors de la Journée de l'aviation soviétique de 1949, à l'aérodrome de Tushino. En service, le Yak-17 présentait la plupart des défauts de son prédécesseur, notamment une vitesse et un rayon d'action relativement faibles, ainsi qu'un moteur peu fiable (toujours basé sur le Junkers Jumo 004 allemand) avec une procédure de démarrage compliquée. En revanche, son pilotage était très simple et similaire à celui des chasseurs à hélice populaires tels que le Yak-3 et le Yak-9. Cela en faisait un excellent appareil de transition vers les chasseurs à réaction."
 CUM_jet_interceptor_equipment_1_short:0 "Yak-17"
 CUM_jet_interceptor_equipment_2:0 "Lavochkin La-15"
 CUM_jet_interceptor_equipment_2_desc:0 "Le Lavochkin La-15 Fantail a été introduit dans l'armée de l'air soviétique en 1949. Bien que cet avion fût technologiquement supérieur au MiG-15, le coût de fabrication inférieur de ce dernier lui a valu d'être préféré. L'avion n'a jamais été utilisé au combat et n'a connu qu'un déploiement limité. Les 235 appareils fabriqués ont été mis hors service en 1953. Ils ont été dépouillés de leurs moteurs et utilisés pour des essais d'armes nucléaires."
 CUM_jet_interceptor_equipment_2_short:0 "La-15"
 CUM_jet_interceptor_equipment_3:0 "Mikoyan-Gurevich MiG-17PF"
 CUM_jet_interceptor_equipment_3_desc:0 "Version intercepteur tout temps équipée d'un radar Izumrud, de 3 canons NR-23 de 23 mm et d'un moteur VK-1F."
 CUM_jet_interceptor_equipment_3_short:0 "MiG-17PF"
 CUM_jet_interceptor_equipment_4:0 "Sukhoi Su-9"
 CUM_jet_interceptor_equipment_4_desc:0 "Le Sukhoi Su-9 Fishpot était un intercepteur soviétique tout temps à ailes delta développé dans les années 1950. Le Su-9 effectua son premier vol complet le 24 juin 1956 et entra en service trois ans plus tard, en 1959. L'avion était exclusivement exploité par le 894e régiment d'aviation de chasse de l'armée de l'air soviétique et ne fut jamais utilisé au combat. Le dernier des 1 150 appareils fabriqués quitta le service en 1979."
 CUM_jet_interceptor_equipment_4_short:0 "Su-9"
 CUM_jet_interceptor_equipment_5:0 "Sukhoi Su-11"
 CUM_jet_interceptor_equipment_5_desc:0 "Le Su-11 était une version améliorée de l'intercepteur Sukhoi Su-9 (« Fishpot »), qui avait été développé en parallèle avec le chasseur-bombardier à ailes en flèche Su-7 de l'OKB. Conscient des limites fondamentales du Su-9, Sukhoi commença à travailler sur le Su-11."
 CUM_jet_interceptor_equipment_5_short:0 "Su-11"
 CUM_jet_interceptor_equipment_6:0 "Sukhoi Su-15"
 CUM_jet_interceptor_equipment_6_desc:0 "Le Sukhoi Su-15 Flagon A était un intercepteur biréacteur développé par l'Union soviétique dans les années 1960. L'avion a effectué son premier vol au milieu de l'année 1962 et, trois ans plus tard, il est entré en service dans l'armée de l'air soviétique en 1965. Entre 1965 et 1979, 1 290 appareils ont été produits. L'avion a également été utilisé par l'armée de l'air ukrainienne et, de manière limitée, par l'armée de l'air russe en cas d'urgence. Il a été officiellement retiré du service en 1996."
 CUM_jet_interceptor_equipment_6_short:0 "Su-15"
 CUM_jet_interceptor_equipment_7:0 "Mikoyan-Gurevich MiG-25P"
 CUM_jet_interceptor_equipment_7_desc:0 "Le Mikoyan-Gurevich MiG-25 Foxbat est peut-être l'un des avions soviétiques les plus influents de l'histoire. Le premier prototype du MiG-25 a pris son envol au début de l'année 1964 et est officiellement entré en service en 1970. Au cours de sa durée de vie, plus de 1 150 appareils ont été construits et vendus à de nombreux pays, dont la Syrie, l'Irak et l'Inde. Cet avion a été conçu pour intercepter rapidement et à une vitesse fulgurante des avions volant à très haute altitude, tels que les U-2 et les B-58. Il a permis à l'Union soviétique d'exercer un contrôle sans précédent sur son propre espace aérien lointain. Il est encore aujourd'hui en service limité dans l'armée de l'air russe."
 CUM_jet_interceptor_equipment_7_short:0 "MiG-25P"
 CUM_jet_interceptor_equipment_8:0 "Mikoyan-Gurevich MiG-31"
 CUM_jet_interceptor_equipment_8_desc:0 "Le MiG-31 Foxhound est le successeur direct du MiG-25 et a été conçu pour le remplacer intégralement. L'avion partage la plupart des éléments de conception du MiG-25, avec principalement des modifications internes. Le MiG-31 dispose de deux sièges, de capteurs et de moteurs supérieurs. Le cockpit a également été modernisé pour prendre en charge un affichage tête haute et de nouveaux systèmes de missiles air-air. Entre 1975 et 1994, 519 MiG-31 ont été produits. Il est toujours en service dans l'armée de l'air russe et l'armée de l'air kazakhe. C'est l'un des avions de combat les plus rapides actuellement en service."
 CUM_jet_interceptor_equipment_8_short:0 "MiG-31"
 CUM_jet_interceptor_equipment_9:0 "Sukhoi Su-27S"
 CUM_jet_interceptor_equipment_9_desc:0 "Le Su-27S Flanker B est la première variante de production du chasseur Sukhoi Su-27 conçu par les Soviétiques. Cet avion était destiné à concurrencer directement les F-14 Tomcat et F-15 Eagle. Après avoir effectué son premier vol en 1977, il est entré en service plus tard en 1985. Son rôle principal était la défense aérienne à longue portée contre les bombardiers américains B-1 et B-52, ainsi que l'escorte à longue portée des bombardiers stratégiques intercontinentaux soviétiques. À ce jour, 809 appareils ont été produits, qui sont toujours en service dans l'armée de l'air russe. Parmi les autres exploitants, on peut citer l'Indonésie, l'Ukraine, le Vietnam et la Chine (désigné J-11), entre autres. L'avion restera en service dans un avenir prévisible."
 CUM_jet_interceptor_equipment_9_short:0 "Su-27S"
 CUM_stealth_fighter_equipment_1:0 "Sukhoi Su-57"
 CUM_stealth_fighter_equipment_1_desc:0 "Le Su-57 a été conçu à partir des plans du PAK-FA (acronyme signifiant « Perspektivny Aviatsionny Kompleks Frontovoy Aviatsii », c'est-à-dire « Complexe aérien prospectif de l'aviation de première ligne » en russe). Doté de capacités de furtivité très élevées, il incarne l'apogée de la technologie de l'armée de l'air russe. Grâce à une maniabilité exceptionnelle assurée par une tuyère à poussée vectorielle et à une excellente furtivité face aux radars, il offre des capacités de combat aérien de premier ordre."
 CUM_stealth_fighter_equipment_1_short:0 "Su-57"
 CUM_high_mach_jet_interceptor_equipment_1:0 "Yakolev Yak-25"
 CUM_high_mach_jet_interceptor_equipment_1_short:0 "Yak-25"
 CUM_high_mach_jet_interceptor_equipment_1_desc:0 ""
 CUM_high_mach_jet_interceptor_equipment_2:0 "Yakolev Yak-28P"
 CUM_high_mach_jet_interceptor_equipment_2_short:0 "Yak-28P"
 CUM_high_mach_jet_interceptor_equipment_2_desc:0 "En 1960, sur la base des Yak-27K et Yak-28, un nouvel intercepteur supersonique biplace, le Yak-28P, a été créé. Il était destiné à combattre des cibles aériennes à basse et moyenne altitude dans une large gamme de vitesses, de jour comme de nuit, par tous les temps. L'avion était équipé du complexe d'armement K-8M-1, qui comprenait deux missiles R-8M-1 avec des chercheurs thermiques et des radars semi-actifs, ainsi qu'une station radar Orel-D. Aucun canon n'était installé."
 CUM_high_mach_jet_interceptor_equipment_3:0 "Mikoyan-Gurevich E-152A"
 CUM_high_mach_jet_interceptor_equipment_3_short:0 "E-152A"
 CUM_high_mach_jet_interceptor_equipment_3_desc:0 "L'intercepteur tout temps E-152A a été construit à la fin des années 1950. Il était équipé d'un groupe motopropulseur composé de deux moteurs R11F-300 en série d'une poussée maximale de 3 880 kg chacun et d'un postcombustion de 5 740 kg. Son armement comprenait le système d'interception « Uragan-5 », composé du radar « TsP-1 » et du missile K-9. Sur l'avion E-152A, le calculateur SRP et le pilote automatique étaient couplés au radar TsP."
 CUM_high_mach_jet_interceptor_equipment_4:0 "Mikoyan-Gurevich E-152M"
 CUM_high_mach_jet_interceptor_equipment_4_short:0 "E-152M"
 CUM_high_mach_jet_interceptor_equipment_4_desc:0 "La fin du programme d'essais du missile K-9 a entraîné l'arrêt des vols de l'E-152-2. En 1961, il a été décidé de convertir l'avion en une nouvelle version de l'E-152M. L'avion a été conçu pour être équipé d'un seul moteur R15B-300 d'une poussée de 6 480 kg sans postcombustion et de 10 210 kg avec postcombustion."
 CUM_CAS_equipment_1:0 "Kochyerigin LBSh Sturmovik"
 CUM_CAS_equipment_1_short:0 "LBSh Sturmovik"
 CUM_CAS_equipment_1_desc:0 "Le Kochyerigin LBSh était un monoplan à ailes basses de construction mixte en bois et en métal, développé en 1939 par Sergei Aleksandrovich Kochyerigin. Malgré sa faible puissance, cet avion CAS disposait d'une puissance de feu impressionnante pour l'époque, avec deux canons de 20 mm montés sur les ailes, deux mitrailleuses lourdes de 7,62 mm montées sur les ailes et une charge de bombes de 600 kg (1 300 lb), ainsi qu'une mitrailleuse lourde de 7,62 mm orientée vers l'arrière pour la défense. Bien qu'initialement accepté par l'armée de l'air soviétique pour être mis en production, cette décision fut rapidement annulée et la production se tourna plutôt vers les chasseurs I-28 et Yak-1. Ce fut le premier avion CAS soviétique à recevoir le nom de Sturmovik, qui signifie chasseur d'attaque au sol."
 CUM_CAS_equipment_2:0 "Ilyushin Il-2 Sturmovik"
 CUM_CAS_equipment_2_short:0 "Il-2 Sturmovik"
 CUM_CAS_equipment_2_desc:0 "Illyusha, Hunchback, le char volant, le fantassin volant, voici quelques-uns des nombreux surnoms donnés à l'Il-2, véritable emblème de l'armée de l'air soviétique pendant la Seconde Guerre mondiale. Lancé en 1941, l'Il-2 était un avion d'attaque au sol qui, combiné à son successeur, l'Il-10, fut l'avion de combat le plus produit de l'histoire de l'aviation, avec 36 183 unités produites pour le seul Il-2. L'Il-2 a joué un rôle crucial sur le front oriental. Malgré son manque de précision dans ses bombardements et ses attaques à la roquette, sa durabilité globale le rendait extrêmement efficace pour dévier tous les tirs, à l'exception des canons antiaériens de gros calibre, ce qui lui a valu le surnom de « char volant ». Connu sous le nom de Sturmovik, qui signifie « avion d'attaque au sol », il a ensuite été baptisé « Bark » par l'OTAN."
 CUM_CAS_equipment_3:0 "Ilyushin Il-10"
 CUM_CAS_equipment_3_short:0 "Il-10"
 CUM_CAS_equipment_3_desc:0 "Développé à partir de l'Il-2 Sturmovik, l'Il-10 a été conçu dans le but de remédier à bon nombre des défauts de l'Il-2. L'objectif principal était d'augmenter la vitesse et la maniabilité à basse altitude, principalement pour échapper à l'artillerie antiaérienne de petit calibre, qui constituait la principale menace pour les avions d'attaque au sol. Entré en service en janvier 1945, l'Il-10 a participé à certaines des dernières opérations de combat en Europe et à la brève intervention soviétique dans la guerre du Pacifique. Lorsque l'Il-10 a été retiré du service soviétique en 1956, l'armée de l'air a délaissé les avions de soutien aérien rapproché et d'attaque au sol au profit des chasseurs-bombardiers. Son nom de code OTAN est Beast."
 CUM_CAS_equipment_4:0 "Ilyushin Il-16"
 CUM_CAS_equipment_4_short:0 "Il-16"
 CUM_CAS_equipment_4_desc:0 "L'Ilyushin Il-16 est la version finale de l'avion d'attaque au sol Sturmovik. Il s'agissait essentiellement d'une version réduite de l'Ilyushin Il-10, mais il était équipé d'un nouveau moteur Mikulin AM-43NV, qui devait lui conférer une vitesse et une maniabilité supérieures à celles de son prédécesseur. Trois appareils ont été construits à des fins d'essai, mais en raison de problèmes imprévus et irrémédiables au niveau du moteur, le projet a été annulé."
 CUM_jet_CAS_equipment_1:0 "Ilyushin IL-10M"
 CUM_jet_CAS_equipment_1_desc:0 "Le Yakovlev Yak-23 Flora était un avion d'attaque au sol de conception soviétique introduit en 1949. L'avion était un développement du chasseur à réaction Yak-15. Le Yak-23 a été principalement exporté vers les pays du pacte de Varsovie, où il est resté en service jusqu'à la fin des années 1950."
 CUM_jet_CAS_equipment_1_short:0 "IL-10M"
 CUM_jet_CAS_equipment_2:0 "Mikoyan-Guerevich MiG-17bis"
 CUM_jet_CAS_equipment_2_desc:0 "Conversion d'un chasseur-bombardier, équipé pour transporter des roquettes et des bombes non guidées."
 CUM_jet_CAS_equipment_2_short:0 "MiG-17bis"
 CUM_jet_CAS_equipment_3:0 "Mikoyan-Guerevich MiG-19S"
 CUM_jet_CAS_equipment_3_desc:0 "Version chasseur-bombardier avec queue à panneaux mobiles. Équipé d'un récepteur de navigation longue portée Svod et armé de trois canons NR-30 de 30 mm. Il pouvait embarquer un pack de roquettes non guidées ORO-32K ou une bombe FAB-250 sous chaque aile, et à partir de 1957, il a été modifié pour pouvoir transporter quatre pods de roquettes."
 CUM_jet_CAS_equipment_3_short:0 "MiG-19S"
 CUM_jet_CAS_equipment_4:0 "Sukhoi Su-7B"
 CUM_jet_CAS_equipment_4_desc:0 "La version bombardier du Su-7 Fitter-A a effectué son premier vol en mars 1959, avant d'entrer en service en 1961. Il est devenu le principal avion d'attaque au sol soviétique des années 1960. Entre 1957 et 1972, plus de 1 400 Su-7B ont été construits, dont une grande partie a été exportée. Cet avion était relativement populaire à l'étranger, où il a été utilisé par 10 pays. Il a été largement utilisé par les forces aériennes indiennes et égyptiennes. Il est toujours en service, mais de manière limitée, en Corée du Nord."
 CUM_jet_CAS_equipment_4_short:0 "Su-7B"
 CUM_jet_CAS_equipment_5:0 "Sukhoi Su-7BKL"
 CUM_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté du fuselage, réservoirs de carburant installés dans les ailes, points d'ancrage « humides » sous les ailes pour transporter des réservoirs de carburant externes, capable de transporter des bombes nucléaires tactiques."
 CUM_jet_CAS_equipment_5_short:0 "Su-7BKL"
 CUM_jet_CAS_equipment_6:0 "Sukhoi Su-17M"
 CUM_jet_CAS_equipment_6_desc:0 "Le Sukhoi Su-17 Fitter-C était une version améliorée de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers les forces aériennes du bloc de l'Est, des pays arabes et d'Amérique du Sud. Le Su-17 apportait des améliorations dans presque tous les domaines par rapport à son prédécesseur, notamment au niveau des capteurs, des performances de vol, de la charge utile, de l'autonomie et du balayage variable des ailes. De 1969 à 1990, 2 867 appareils ont été produits et utilisés dans 30 pays, dont 6 utilisent encore cet avion aujourd'hui."
 CUM_jet_CAS_equipment_6_short:0 "Su-17M"
 CUM_jet_CAS_equipment_7:0 "Mikoyan-Gurevich MiG-27M"
 CUM_jet_CAS_equipment_7_desc:0 "Le MiG-27 Flogger est un avion d'attaque au sol soviétique à ailes à géométrie variable. Cet avion est basé sur le MiG-23, mais optimisé pour l'attaque au sol. Contrairement au MiG-23, le MiG-27 n'a pas été largement utilisé en dehors de l'URSS. Entre 1970 et 1986, 1 075 appareils ont été produits. Le MiG-27 a été utilisé pendant les dernières phases des guerres soviéto-afghane et de Kargil. L'avion reste en service de manière limitée en Inde et au Kazakhstan."
 CUM_jet_CAS_equipment_7_short:0 "MiG-27M"
 CUM_jet_CAS_equipment_8:0 "Sukhoi Su-25"
 CUM_jet_CAS_equipment_8_desc:0 "Le Sukhoi Su-25 Frogfoot est un avion d'attaque au sol bimoteur développé en Union soviétique. Il a effectué son premier vol en 1975 et a été mis en service en 1981. Depuis 1978, plus de 1 000 exemplaires ont été produits. Cet avion a connu un grand succès à l'étranger, où il a été vendu à 29 pays. Le Su-25 a ainsi participé à plusieurs conflits, notamment la guerre soviétique en Afghanistan, la guerre Iran-Irak et la guerre du Golfe. Il est toujours en service dans tous les pays importateurs."
 CUM_jet_CAS_equipment_8_short:0 "Su-25"
 CUM_cas_stealth_equipment_1:0 "Sukhoi Su-25SM"
 CUM_cas_stealth_equipment_1_short:0 "Su-25SM"
 CUM_cas_stealth_equipment_1_desc:0 "Le Su-25SM (Stroyevoy Modernizirovannyi) est un programme de mise à niveau \"abordable\" du Su-25, conçu par l'Armée de l'air russe en 2000. Le programme découle des tentatives de mise à niveau des Su-25T et Su-25TM, qui ont été évaluées et qualifiées de trop sophistiquées et coûteuses. La mise à niveau SM intègre des améliorations avioniques et une remise à neuf de la cellule pour prolonger la durée de vie du Frogfoot jusqu'à 500 heures de vol ou de 5 ans. La toute nouvelle suite de navigation/attaque PRnK-25SM \"Bars\" du Su-25SM est construite autour du système informatique numérique BTsVM-90, initialement prévu pour le programme de mise à niveau du Su-25TM. La précision de navigation et d'attaque fournie par la nouvelle suite est trois fois supérieure à celle de la ligne de base Su-25 et se situerait à moins de 15 m en utilisant la correction satellite et à 200 m sans elle."
 CUM_nav_bomber_equipment_1:0 "Ilyushin Il-4T"
 CUM_nav_bomber_equipment_1_short:0 "Il-4T"
 CUM_nav_bomber_equipment_1_desc:0 "Initialement connu sous le nom de DB-3F, l'Il-4 était un bombardier moyen performant, doté d'une autonomie suffisante pour effectuer même des missions de bombardement stratégique. Cette version modifiée du DB-3 était équipée de nouveaux moteurs et d'une tourelle dorsale renforcée (la mitrailleuse lourde ShKAS de 7,62 mm avait été remplacée par une mitrailleuse lourde UBT de 12,7 mm). Certaines séries avaient des ailes extérieures et des fuselages avant en bois afin d'économiser les métaux, et tout au long de la production, les moteurs et les réservoirs de carburant ont été améliorés pour offrir de meilleures performances tout en conservant la même autonomie. Cependant, en raison du poids supplémentaire, les moteurs ne se sont pas révélés assez puissants, et l'appareil était donc plus lent que son prédécesseur immédiat. Son nom de code OTAN est Bob."
 CUM_nav_bomber_equipment_2:0 "Tupolev Tu-2T"
 CUM_nav_bomber_equipment_2_short:0 "Tu-2T"
 CUM_nav_bomber_equipment_2_desc:0 "Le Tu-2T (version prototype ANT-62T) était la variante bombardier-torpilleur du Tu-2, développée à partir de la variante Tu-2D. La décision d'utiliser cette plate-forme pour ce rôle est probablement due à la préférence des équipages pour le Tu-2, bien qu'il s'agisse du deuxième bombardier le plus important de l'armée de l'air soviétique pendant la Seconde Guerre mondiale (le premier étant le Pe-2). Cette variante a été utilisée par les pilotes de l'aviation navale soviétique pendant les dernières phases de la Seconde Guerre mondiale et a servi pendant une grande partie de l'après-guerre. Comme son cousin de l'armée de l'air, son nom de code OTAN est « Bat »."
 CUM_nav_bomber_equipment_3:0 "Ilyushin Il-6"
 CUM_nav_bomber_equipment_3_short:0 "Il-6"
 CUM_nav_bomber_equipment_3_desc:0 "L'Il-6 est une version améliorée du bombardier/torpilleur à longue portée Il-4 Bob. Initialement destiné à remplacer l'Il-4, l'Il-6 était équipé de moteurs diesel à faible consommation de carburant lui conférant une autonomie beaucoup plus grande. Il devait être équipé d'un armement défensif composé de cinq canons de 20 mm. Cependant, les essais en vol ont montré que cet appareil était difficile à contrôler à forte charge et à faible vitesse, ce qui rendait son atterrissage difficile. De plus, les moteurs ne pouvaient pas démarrer à basse température et réagissaient lentement aux mouvements de la manette des gaz. Malgré diverses tentatives d'amélioration, le développement fut interrompu en 1944."
 CUM_nav_bomber_equipment_4:0 "Beriev Be-6"
 CUM_nav_bomber_equipment_4_short:0 "Be-6"
 CUM_nav_bomber_equipment_4_desc:0 "Le Be-6 était un hydravion produit par le bureau d'études Beriev, qui a effectué son premier vol en 1949. Il était capable d'accomplir une grande variété de missions. Outre son rôle principal de patrouille maritime et de reconnaissance maritime, le Be-6 était également utilisé pour des missions de patrouille côtière et de ravitaillement, de pose de mines, de bombardier torpilleur, de bombardier moyen et de transport. Son nom de code USAF/OTAN est Type 34, tandis que son nom de code OTAN était Madge."
 CUM_nav_bomber_equipment_5:0 "Beriev Be-10"
 CUM_nav_bomber_equipment_5_short:0 "Be-10"
 CUM_nav_bomber_equipment_5_desc:0 "Le Be-10, également connu sous le nom d'Izdelye M, était un hydravion à turboréacteur développé par l'Union soviétique en 1956. Conçu comme un bombardier de patrouille, le Be-10 était réputé pour être difficile à piloter et souffrait de fatigue métallique due aux contraintes exercées sur la cellule lors des décollages et atterrissages à grande vitesse, ainsi qu'à la corrosion. Il fut donc rapidement remplacé par le Be-12 Mail. Connu en Occident sous le nom de Mallow, une sous-variante civile modifiée, le M-10 établit 12 records du monde auprès de la Fédération aéronautique internationale (World Air Sports Federation) en 1961."
 CUM_nav_bomber_equipment_6:0 "Beriev Be-12N Chayka"
 CUM_nav_bomber_equipment_6_short:0 "Be-12N Chayka"
 CUM_nav_bomber_equipment_6_desc:0 "Le Be-12 a été développé en 1960 pour succéder et remplacer les Be-6 Madge et Be-10 Mallow. Il a été conçu comme un avion de patrouille maritime et anti-sous-marin. Contrairement à son prédécesseur immédiat, propulsé par un turboréacteur, le Be-12 était un avion à turbopropulsion et disposait également d'un train d'atterrissage rétractable, ce qui lui conférait une capacité d'atterrissage amphibie. La version améliorée N était équipée de nouveaux capteurs, d'une avionique, d'un système de recherche et d'attaque Nartsiss et d'un capteur de détection des anomalies magnétiques (MAD). Connu localement sous le nom de Chayka, qui signifie « mouette », son nom de code OTAN est Mail."
 CUM_nav_bomber_equipment_7:0 "Tupolev Tu-142"
 CUM_nav_bomber_equipment_7_short:0 "Tu-142"
 CUM_nav_bomber_equipment_7_desc:0 "Le Tupolev Tu-142 est un avion soviétique/russe de reconnaissance maritime et de lutte anti-sous-marine (ASW) dérivé du bombardier stratégique à turbopropulsion Tu-95. Une variante spécialisée dans les communications, désignée Tu-142MR, était chargée des communications à longue distance avec les sous-marins nucléaires lanceurs d'engins soviétiques. Le Tu-142 a été conçu par le bureau d'études Tupolev et fabriqué par les usines Kuibyshev Aviation et Taganrog Machinery de 1968 à 1994. Anciennement exploité par la marine soviétique et l'armée de l'air ukrainienne, le Tu-142 est actuellement en service dans la marine russe."
 CUM_nav_bomber_equipment_8:0 "Ilyushin IL-38N"
 CUM_nav_bomber_equipment_8_short:0 "IL-38N"
 CUM_nav_bomber_equipment_8_desc:0 "L'Il-38 est une adaptation du quadrimoteur à turbopropulsion Ilyushin Il-18 destiné à servir d'avion de patrouille maritime pour la marine soviétique. Il répondait à un besoin de contrer les sous-marins lanceurs d'engins balistiques américains. L'IL-38N est une version moderne parfois appelée Il-38SD pour Sea Dragon, qui est un nouveau système de recherche et de suivi. La version de la marine russe est équipée du système Novella P-38. Le Novella P-38 est capable de détecter des cibles aériennes à une distance pouvant atteindre 90 kilomètres et de suivre des objets en surface dans un rayon de 320 kilomètres. Il peut suivre simultanément 32 cibles aériennes et sous-marines."
 CUM_aerosub_0:0 "Ushakov LPL Sous-marin volant"
 CUM_aerosub_0_short:0 "LPL Aerosub"
 CUM_aerosub_0_Desc:0 "Pendant l'entre-deux-guerres, l'Union soviétique a commencé à explorer des concepts navals et à mener de nombreuses expériences afin de révolutionner le combat naval. Juste avant la Seconde Guerre mondiale, Boris Ouchakov, de l'Académie des ingénieurs navals Dzerjinski, a proposé le concept d'un sous-marin volant, un bombardier naval capable de plonger ou de refaire surface à volonté pour mener des opérations de bombardement naval. Le projet fut évoqué à plusieurs reprises par Ouchakov au cours des années suivantes et finit par être étudié de manière relativement sérieuse en 1938. La grande complexité de la conception était prohibitive et le projet fut finalement annulé en 1939. Cependant, en 1943, Lavrentiy Beria relança le projet et le premier essai fut réalisé en 1947. En 1953, le projet fut finalement annulé par Khrouchtchev en raison de son impraticabilité et du fait qu'il n'avait pratiquement pas progressé, car il ne pouvait même pas voler correctement."
 CUM_tac_bomber_equipment_0:0 "Ilyushin DB-3"
 CUM_tac_bomber_equipment_0_short:0 "DB-3"
 CUM_tac_bomber_equipment_0_desc:0 "Le DB-3 était un bombardier bimoteur à ailes basses qui est entré en service dans l'armée de l'air soviétique en 1936. Malgré une carrière plutôt discrète dans l'armée soviétique, cet appareil a servi en Chine, dans l'armée de l'air nationaliste chinoise, pendant la seconde guerre sino-japonaise. Il a également été le premier bombardier soviétique à lancer un raid sur la capitale allemande, Berlin, au cours des premiers mois du front oriental de la Seconde Guerre mondiale. La désignation DB est l'abréviation de Dalniy Bombardirovschik, qui signifie « bombardier à longue portée »."
 CUM_tac_bomber_equipment_1:0 "Ilyushin DB-3M"
 CUM_tac_bomber_equipment_1_short:0 "DB-3M"
 CUM_tac_bomber_equipment_1_desc:0 "Première mise à niveau majeure du DB-3."
 CUM_tac_bomber_equipment_2:0 "Petlyakov Pe-2B"
 CUM_tac_bomber_equipment_2_short:0 "Pe-2B"
 CUM_tac_bomber_equipment_2_desc:0 "Le Petlyakov Pe-2 (en russe : Петляков Пе-2) était un bombardier en piqué bimoteur soviétique utilisé pendant la Seconde Guerre mondiale. L'un des avions d'attaque tactique les plus remarquables de la guerre, il s'est également révélé efficace en tant que chasseur lourd, chasseur de nuit (variante Pe-3) et avion de reconnaissance. À bien des égards, il ressemblait au De Havilland Mosquito britannique en bois. Le Pe-2 était, en nombre, le bombardier soviétique le plus important de la Seconde Guerre mondiale, représentant à son apogée 75 % de la force de bombardiers bimoteurs soviétiques."
 CUM_tac_bomber_equipment_3:0 "Tupolev Tu-2"
 CUM_tac_bomber_equipment_3_short:0 "Tu-2"
 CUM_tac_bomber_equipment_3_desc:0 "Le Tu-2 était un bombardier diurne bimoteur à grande vitesse développé en 1941. Il a été conçu pour être la réponse soviétique au bombardier moyen Junkers Ju-88, adapté pour répondre à un besoin en bombardier à grande vitesse ou en bombardier en piqué, avec une grande charge interne de bombes et une vitesse similaire à celle d'un chasseur monoplace. Il s'est avéré à la hauteur de la tâche, et des variantes de bombardier torpilleur, de reconnaissance et de chasseur lourd ont vu le jour, jouant un rôle clé dans les dernières offensives soviétiques de la Seconde Guerre mondiale. Son nom de code OTAN d'après-guerre est Bat."
 CUM_jet_tac_bomber_equipment_1:0 "Ilyushin Il-22"
 CUM_jet_tac_bomber_equipment_1_short:0 "Il-22"
 CUM_jet_tac_bomber_equipment_1_desc:0 "L'Ilyushin Il-22 fut le premier bombardier soviétique à réaction à voler. Il était équipé de quatre turboréacteurs Lyulka TR-1 montés sur des pylônes horizontaux courts situés à l'avant et sous l'aile. Les moteurs n'atteignaient pas la poussée prévue et leur consommation de carburant était plus élevée que prévu. Ces problèmes empêchèrent l'avion d'atteindre les performances requises et il fut abandonné le 22 septembre 1947."
 CUM_jet_tac_bomber_equipment_2:0 "Ilyushin Il-28"
 CUM_jet_tac_bomber_equipment_2_short:0 "Il-28"
 CUM_jet_tac_bomber_equipment_2_desc:0 "L'Il-28 était un bombardier moyen à turboréacteur développé immédiatement après la fin de la Seconde Guerre mondiale pour l'armée de l'air soviétique. Premier bombardier à réaction à être produit à grande échelle, l'Il-28, lorsqu'il a été introduit en 1950, a servi dans de nombreux conflits majeurs de la guerre froide, du Vietnam à la guerre soviéto-afghane, en passant par le conflit de Suez et la guerre du Biafra. Même après avoir été retiré du service soviétique dans les années 1980, de nombreux appareils de ce type sont encore en service aujourd'hui. Le nom de code de l'USAF/DoD est Type 27, tandis que le nom de code de l'OTAN est Beagle."
 CUM_jet_tac_bomber_equipment_3:0 "Yakovlev Yak-28B"
 CUM_jet_tac_bomber_equipment_3_short:0 "Yak-28B"
 CUM_jet_tac_bomber_equipment_3_desc:0 "Le Yak-28 a été développé comme avion de combat à ailes en flèche et introduit en 1960. Les variantes bombardiers du Yak-28, connues sous leur nom de code OTAN Brewer, étaient équipées de moteurs montés en nacelle, similaires à ceux du Yak-25 Flashlight dont il était dérivé. Grâce à cela et à ses ailes en flèche, c'était un avion subsonique capable d'atteindre des vitesses transsoniques à haute altitude. Il a servi de bombardier léger principal de l'armée de l'air soviétique et a été largement utilisé par la Russie, la Biélorussie et le Turkménistan après la chute de l'Union soviétique, avant d'être retiré du service en 1992."
 CUM_jet_tac_bomber_equipment_4:0 "Yakovlev Yak-28I"
 CUM_jet_tac_bomber_equipment_4_short:0 "Yak-28I"
 CUM_jet_tac_bomber_equipment_4_desc:0 "Version améliorée avec le système de ciblage interne « Initsiativa-2 », un radar de cartographie du sol à 360 degrés, associé à un système de ciblage contrôlé au sol utilisant la triangulation à partir de sites émetteurs terrestres."
 CUM_jet_tac_bomber_equipment_5:0 "Mikoyan-Guerevich MiG-25RBT"
 CUM_jet_tac_bomber_equipment_5_short:0 "MiG-25RBS"
 CUM_jet_tac_bomber_equipment_5_desc:0 "Le MiG-25RBS est un bombardier-reconnaissance monoplace dérivé du MiG-25R, équipé de systèmes de reconnaissance améliorés et d'un système de bombardement automatique Peleng. L'avion peut transporter une charge de huit bombes de 500 kg (1 102 lb)."
 CUM_jet_tac_bomber_equipment_6:0 "Sukhoi Su-24"
 CUM_jet_tac_bomber_equipment_6_short:0 "Su-24"
 CUM_jet_tac_bomber_equipment_6_desc:0 "Un gros chasseur-bombardier développé par l'Union soviétique dans les années 1960 et toujours en service aujourd'hui. Il se caractérise par ses ailes variables et son fuselage effilé. Il peut embarquer jusqu'à 8 000 kg d'armes et est capable de lancer différents types de missiles air-sol tout en maintenant une vitesse stable. Cet avion est connu sous son nom de code OTAN, « Fencer ». Avec son successeur, le Su-34, il est actuellement utilisé comme chasseur-bombardier par les anciens pays du bloc de l'Est."
 CUM_jet_tac_bomber_equipment_7:0 "Sukhoi Su-24"
 CUM_jet_tac_bomber_equipment_7_short:0 "Su-24M"
 CUM_jet_tac_bomber_equipment_7_desc:0 "Entré en service en 1983, le Su-24M était une évolution du Su-24 depuis la mise en service du modèle initial. L'une des principales caractéristiques du Su-24M est l'ajout d'une capacité de ravitaillement en vol grâce à une sonde rétractable, d'un nouveau système de navigation interne et d'un désignateur laser Kaira-24, qui permet à l'appareil d'utiliser des bombes à guidage de précision. Il est connu en Occident sous le nom de Fencer-D."
 CUM_jet_tac_bomber_equipment_8:0 "Sukhoi Su-34"
 CUM_jet_tac_bomber_equipment_8_short:0 "Su-34"
 CUM_jet_tac_bomber_equipment_8_desc:0 "Un avion d'attaque développé à partir du Su-27 avec un cockpit à deux sièges en tandem. Il offre une maniabilité exceptionnelle pour un avion d'attaque, ses mouvements agiles lui permettant de rivaliser avec les chasseurs de la même catégorie. Son blindage plus épais augmente également son taux de survie. Son nom de code OTAN est « Fullback ». Dans l'hypothèse de missions d'attaque prolongées, la partie arrière des sièges pilotes est équipée d'un lavabo et d'une cuisine simple."
 CUM_strat_bomber_equipment_1:0 "Petlyakov Pe-8"
 CUM_strat_bomber_equipment_1_short:0 "Pe-8"
 CUM_strat_bomber_equipment_1_desc:0 "Bombardier lourd soviétique conçu avant la Seconde Guerre mondiale, le Pe-8 (initialement appelé TB-7 jusqu'à ce que son nom soit changé en l'honneur de Vladimir Petlyakov à sa mort en 1942) fut le seul bombardier quadrimoteur développé pendant la guerre. Produit en nombre limité, il fut utilisé pour bombarder Berlin en août 1941. Il a également été utilisé pour des « raids moraux » destinés à remonter le moral du peuple soviétique en exposant les vulnérabilités de l'Axe. Sa mission principale consistait toutefois à attaquer de nuit les aérodromes, les gares de triage et autres installations situées à l'arrière des lignes allemandes. Comme ces avions servaient à remonter le moral des troupes, la Luftwaffe allemande les prenait souvent pour cible, et un grand nombre d'entre eux ont été détruits au cours de la Grande Guerre patriotique. Après la guerre, ils ont principalement servi de moyens de transport jusqu'à la fin des années 1950."
 CUM_strat_bomber_equipment_2:0 "Ilyushin Il-4"
 CUM_strat_bomber_equipment_2_short:0 "Il-4"
 CUM_strat_bomber_equipment_2_desc:0 "Bien que l'Il-4 ne fût qu'un bombardier moyen, son rayon d'action lui permettait d'être utilisé pour des missions stratégiques. L'utilisation des bombardiers dans ce rôle n'était pas une priorité pour la VVS, mais l'Il-4 fut néanmoins utilisé lors de plusieurs raids de bombardement à longue portée contre Berlin en 1941. La plupart étaient utilisés pour des missions à beaucoup plus courte portée, souvent avec 1 000 kg (2 204 lb) de bombes supplémentaires sous les ailes, en plus des 2 500 kg (5 512 lb) internes."
 CUM_strat_bomber_equipment_3:0 "Tupolev Tu-4"
 CUM_strat_bomber_equipment_3_short:0 "Tu-4"
 CUM_strat_bomber_equipment_3_desc:0 "Le Tu-4 est une conception issue d'une ingénierie inverse basée sur le B-29 Superfortress américain, développé pour répondre au besoin de Joseph Staline de disposer d'un bombardier stratégique doté de capacités similaires à celles du bombardier américain qui avait permis de remporter la guerre. Malgré le refus des États-Unis de prêter le B-29 dans le cadre du programme Lend-Lease, quatre B-29 se sont écrasés sur le territoire soviétique, ce qui a suffi pour lancer le processus d'ingénierie inverse. Malgré de nombreuses difficultés (approvisionnement en pièces équivalentes ou supérieures à celles développées par les Américains, conversion du système impérial au système métrique, etc.), le premier vol et la mise en service du Tu-4 ont suffi à semer la panique aux États-Unis et en Grande-Bretagne, la première d'une longue série pendant la guerre froide. Sa durée de vie a toutefois été brève, puisqu'il a été remplacé par des bombardiers à réaction au milieu des années 1960. Son nom de code OTAN est Bull."
 CUM_jet_strat_bomber_equipment_1:0 "Tupolev Tu-16"
 CUM_jet_strat_bomber_equipment_1_short:0 "Tu-16"
 CUM_jet_strat_bomber_equipment_1_desc:0 "Le Tu-16 était un bombardier stratégique bimoteur développé en 1952, et fut l'un des premiers bombardiers stratégiques à réaction à entrer en service dans l'armée de l'air soviétique. Il avait une configuration à ailes en flèche et était propulsé par deux turboréacteurs Mikulin AM-3 situés à la base des ailes. Il pouvait transporter jusqu'à 9 000 kg (20 000 lb) de munitions, y compris des armes nucléaires et la FAB-9000, une bombe de 9 000 kg dont la puissance était similaire à celle de la bombe britannique Grand Slam. Connu en Occident sous le nom de Badger, cet appareil a servi pendant toute la guerre froide, avant d'être retiré du service en 1993. La variante chinoise construite sous licence, le H-6, reste en service en tant que bombardier stratégique de première ligne de l'APL."
 CUM_jet_strat_bomber_equipment_2:0 "Myasishchev Mya-3M Molot"
 CUM_jet_strat_bomber_equipment_2_short:0 "M-3M Molot"
 CUM_jet_strat_bomber_equipment_2_desc:0 "Le Mya-4 (ou M-4, désignation Myasishchev 2M) est un bombardier stratégique quadrimoteur qui est entré en service en 1956. Ce bombardier était capable de voler sur de longues distances et pouvait frapper des cibles situées directement sur le continent américain à partir de bases russes, même s'il s'agissait d'un aller simple. Malgré cela, ainsi que d'autres tactiques de désinformation sélective, il a semé la panique parmi les politiciens et les agences de renseignement occidentaux, et a conduit à la construction de nouveaux B-47 Stratojets et du B-52 Stratofortress récemment introduit. Les Russes l'ont officiellement surnommé Molot, ce qui signifie « marteau », tandis que l'OTAN lui a donné le nom de code Bison et que l'armée de l'air américaine l'a désigné sous le nom de Type 37."
 CUM_jet_strat_bomber_equipment_3:0 "Tupolev Tu-95M"
 CUM_jet_strat_bomber_equipment_3_short:0 "Tu-95M"
 CUM_jet_strat_bomber_equipment_3_desc:0 "S'il existe un bombardier qui pourrait être considéré comme le symbole de la force aérienne soviétique, c'est bien le Tu-95. Mis en service en 1956, le Tu-95 est le seul bombardier stratégique à hélices encore en service à ce jour. Il est l'un des avions militaires les plus bruyants, car les extrémités des pales de ses hélices tournent à une vitesse supérieure à celle du son. Tout comme le B-52 Stratofortress américain, le bombardier Tu-95 est souvent comparé à ce dernier. Le Tu-95 devrait rester en service dans l'armée de l'air russe jusqu'à la fin des années 2040. Pour l'Occident, il est tout à fait approprié que l'avion synonyme de l'empire soviétique reçoive le nom de code Bear (ours)."
 CUM_jet_strat_bomber_equipment_4:0 "Tupolev Tu-95KD"
 CUM_jet_strat_bomber_equipment_4_short:0 "Tu-95KD"
 CUM_jet_strat_bomber_equipment_4_desc:0 "Cette version du Tu-95 a bénéficié d'une mise à niveau avionique conçue pour transporter des missiles guidés tels que le missile air-sol Kh-20."
 CUM_jet_strat_bomber_equipment_5:0 "Myasishchev M-20"
 CUM_jet_strat_bomber_equipment_5_short:0 "M-20"
 CUM_jet_strat_bomber_equipment_5_desc:0 "Ce bombardier lourd a été conçu pour répondre aux exigences de l'armée de l'air, qui souhaitait disposer d'un bombardier lourd supersonique capable de voler à haute altitude, et a été présenté en 1967 sous plusieurs configurations intégrant des solutions techniques de pointe. L'appareil devait avoir une autonomie de 11 000 à 13 000 km en vol subsonique à basse altitude ; la même autonomie en vol à une vitesse de 2 200 à 2 500 km/h à une altitude supérieure à 18 000 m. Le poids total de l'équipement, des armes et de la charge devait être de 24 à 25 tonnes."
 CUM_mach2stratbomber_equipment_1:0 "Tupolev Tu-22"
 CUM_mach2stratbomber_equipment_1_short:0 "Tu-22"
 CUM_mach2stratbomber_equipment_1_desc:0 "Premier bombardier supersonique à entrer en production en Union soviétique, le Tu-22 est entré en service dans l'armée de l'air soviétique en 1962. Produit en petit nombre (311 exemplaires ont été construits), ce modèle s'est avéré décevant, car il ne disposait pas de l'autonomie intercontinentale attendue d'un tel bombardier. Malgré cela, le Tu-22 a été modernisé tout au long de sa durée de vie, servant de plate-forme de lancement pour le missile antinavire à longue portée Kh-22. Son nom de code OTAN est Blinder."
 CUM_mach2stratbomber_equipment_2:0 "Tupolev Tu-22M2"
 CUM_mach2stratbomber_equipment_2_short:0 "Tu-22M2"
 CUM_mach2stratbomber_equipment_2_desc:0 "Le Tu-22M2 est une version améliorée du Tu-22 Blinder. Initialement désigné sous le nom de Tu-26, le Tu-22M était utilisé à la fois par les forces aériennes soviétiques (comme bombardier stratégique, en remplacement du Tu-22 Blinder) et par l'aviation navale soviétique (comme avion de patrouille maritime). Lorsqu'il a été découvert par les forces américaines, il a provoqué un choc en Occident, d'autant plus que le Premier ministre Khrouchtchev aurait déclaré que les missiles balistiques intercontinentaux rendraient les bombardiers obsolètes. La variante Tu-22M2 en question était la première variante de production majeure, avec des moteurs et des entrées d'air de type F-4 Phantom qui lui conféraient une vitesse maximale de Mach 1,65. En 2014, plus de 100 Tu-22M2 Blinder-B étaient en service dans l'armée de l'air russe."
 CUM_mach2stratbomber_equipment_3:0 "Tupolev Tu-22M3"
 CUM_mach2stratbomber_equipment_3_short:0 "Tu-22M3"
 CUM_mach2stratbomber_equipment_3_desc:0 "Le Tu-22M3, qui a effectué son premier vol en 1977, a été mis en service en 1983 et est officiellement entré en service en 1989. Il était équipé de nouveaux moteurs NK-25 nettement plus puissants, de rampes d'admission en forme de coin similaires à celles du MiG-25, d'ailes à plus forte flèche maximale et d'un nez redessiné abritant un nouveau radar de navigation/attaque Almaz PNA (Planeta Nositel, izdeliye 030A) et d'un système de navigation/attaque NK-45, qui améliore considérablement les performances en vol à basse altitude."
 CUM_mach3stratbomber_equipment_1:0 "Sukhoi T-4M Sotka"
 CUM_mach3stratbomber_equipment_1_short:0 "T-4M Sotka"
 CUM_mach3stratbomber_equipment_1_desc:0 "Le T-4M était une autre maquette du T-4 original, conçue sur la base du XB-70 Valkyrie américain. Le T-4M était doté d'ailes à géométrie variable et d'ailettes avant agrandies, mais conservait le fuselage et la structure du moteur du T-4. On estime que la vitesse maximale du T-4M aurait été de Mach 3, avec une vitesse de croisière de Mach 2,8."
 CUM_mach6stratbomber_equipment_1:0 "Kholod"
 CUM_mach6stratbomber_equipment_1_short:0 "Kholod"
 CUM_mach6stratbomber_equipment_1_desc:0 "Le Kholod, un projet développé en Russie, utilisait un moteur scramjet pour propulser un engin à une vitesse pouvant atteindre et dépasser Mach 5,75. On sait peu de choses sur ce système, et l'on pense généralement qu'il s'agit d'un projet visant à lancer des satellites dans l'espace."
 CUM_nuclearstratbomber_equipment_1:0 "Tupolev Tu-119"
 CUM_nuclearstratbomber_equipment_1_short:0 "Tu-119"
 CUM_nuclearstratbomber_equipment_1_desc:0 "Le Tu-119 était un bombardier stratégique à propulsion nucléaire dérivé du Tu-95 après utilisation d'un avion de recherche (Tu-95LML). Ce modèle aurait été propulsé par deux moteurs à propulsion nucléaire internes (utilisant l'énergie produite par la chaleur générée par un réacteur nucléaire embarqué) et deux turbopropulseurs à kérosène externes."
 CUM_nuclearstratbomber_equipment_2:0 "Myasishchev M-60"
 CUM_nuclearstratbomber_equipment_2_short:0 "M-60"
 CUM_nuclearstratbomber_equipment_2_desc:0 "Le M-60 était le projet de bombardier stratégique à propulsion nucléaire de Myasishchev, lui-même basé sur le projet de bombardier stratégique M-50 Bounder. Il aurait été propulsé par quatre turboréacteurs sans postcombustion dans une configuration similaire à celle du Tu-119, deux moteurs intérieurs alimentés par un réacteur nucléaire et deux moteurs extérieurs alimentés au kérosène. En raison des craintes de dommages environnementaux dus à des incidents ou à des accidents et des dépassements de coûts, le projet a été abandonné."
 CUM_cv_jet_CAS_equipment_1:0 "IL-10TM"
 CUM_cv_jet_CAS_equipment_1_short:0 "IL-10TM"
 CUM_cv_jet_CAS_equipment_1_desc:0 "IL-10T amélioré"
 CUM_cv_jet_CAS_equipment_2:0 "I-216"
 CUM_cv_jet_CAS_equipment_2_short:0 "I-216"
 CUM_cv_jet_CAS_equipment_2_desc:0 "Cet avion d'attaque embarqué était un appareil tout métal à ailes basses et à ailes droites. Il était équipé d'un train d'atterrissage à roue avant. Armement : 6 canons NR-23 de 23 mm."
 CUM_cv_jet_CAS_equipment_3:0 "Tupolev Tu-91"
 CUM_cv_jet_CAS_equipment_3_short:0 "Tu-91"
 CUM_cv_jet_CAS_equipment_3_desc:0 "Le Tupolev Tu-91 (nom de code OTAN : Boot) était un avion d'attaque embarqué soviétique. Les consoles sont équipées de deux canons fixes de 23 mm avec 200 cartouches par canon, d'un canon arrière télécommandé DK-15 avec un canon AM-23 ; armement de bombes - 1 x FAB-1500 ou 3 x FAB-500 ou 6 x FAB-250 ou 12 x FAB-100 ; bombes anti-sous-marines d'un calibre de 500 kg ou 100 kg."
 CUM_cv_jet_CAS_equipment_4:0 "Mikoyan-Gurevich MiG-19SM-30"
 CUM_cv_jet_CAS_equipment_4_short:0 "MiG-19SM-30"
 CUM_cv_jet_CAS_equipment_4_desc:0 ""
 CUM_cv_jet_CAS_equipment_5:0 "Yak-35"
 CUM_cv_jet_CAS_equipment_5_short:0 "Yak-35"
 CUM_cv_jet_CAS_equipment_5_desc:0 "Chasseur d'attaque embarqué soviétique Yak-35."
 CUM_cv_jet_CAS_equipment_6:0 "Sukhoi Su-7K"
 CUM_cv_jet_CAS_equipment_6_short:0 "Su-7K"
 CUM_cv_jet_CAS_equipment_6_desc:0 ""
 CUM_cv_jet_CAS_equipment_7:0 "Mikoyan-Gurevich MiG-23KU"
 CUM_cv_jet_CAS_equipment_7_short:0 "MiG-23KU"
 CUM_cv_jet_CAS_equipment_7_desc:0 ""
 CUM_cv_jet_CAS_equipment_8:0 "Mikoyan-Gurevich MiG-23KM"
 CUM_cv_jet_CAS_equipment_8_short:0 "MiG-23KM"
 CUM_cv_jet_CAS_equipment_8_desc:0 ""
 CUM_cv_jet_CAS_equipment_9:0 "Mikoyan-Gurevich MiG-27K"
 CUM_cv_jet_CAS_equipment_9_short:0 "MiG-27K"
 CUM_cv_jet_CAS_equipment_9_desc:0 "Le MiG-27LL a été utilisé pour tester les technologies de décollage et d'atterrissage conventionnels dans le cadre du programme soviétique de développement de porte-avions à décollage et atterrissage conventionnels. Le MiG-27K aurait dû être la version définitive."
 CUM_cv_jet_CAS_equipment_10:0 "Sukhoi Su-25UTG"
 CUM_cv_jet_CAS_equipment_10_short:0 "Su-25UTG"
 CUM_cv_jet_CAS_equipment_10_desc:0 "Le Su-25UTG est une variante du Su-25 conçue pour former les pilotes à l'appontage sur des porte-avions à partir d'un pont simulé équipé de câbles d'arrêt. Introduits en 1988, ces appareils ont été conservés après la chute de l'Union soviétique, lorsqu'il a été décidé que le gouvernement russe conserverait le porte-avions Admiral Kuznetsov. Ces appareils pourraient être développés pour disposer d'une capacité de frappe similaire à celle des Su-25 basés à terre, ce qui constituerait un atout redoutable pour les opérations à partir de porte-avions."
 CUM_cv_jet_multirole_equipment_1:0 "La-15 KOR-1"
 CUM_cv_jet_multirole_equipment_1_short:0 "La-15 KOR-1"
 CUM_cv_jet_multirole_equipment_1_desc:0 ""
 CUM_cv_jet_multirole_equipment_2:0 "La-15 KOR-2"
 CUM_cv_jet_multirole_equipment_2_short:0 "La-15 KOR-2"
 CUM_cv_jet_multirole_equipment_2_desc:0 ""
 CUM_cv_jet_multirole_equipment_3:0 "Mikoyan-Gurevich MiG-17K"
 CUM_cv_jet_multirole_equipment_3_short:0 "MiG-17K"
 CUM_cv_jet_multirole_equipment_3_desc:0 "Variante embarquée proposée du MiG-17."
 CUM_cv_jet_multirole_equipment_4:0 "Mikoyan-Gurevich MiG-19K"
 CUM_cv_jet_multirole_equipment_4_short:0 "MiG-19K"
 CUM_cv_jet_multirole_equipment_4_desc:0 "Chasseur embarqué proposé pour la marine soviétique. Son armement comprenait quatre supports BD-3-56 pouvant accueillir deux bombes de 250 kg. Plus près du fuselage, derrière les niches du châssis, étaient montés des pylônes pour les blocs ORO-57K équipés de NURS ARS-57 de 57 mm."
 CUM_cv_jet_multirole_equipment_5:0 "Mikoyan-Gurevich MiG-19SK"
 CUM_cv_jet_multirole_equipment_5_short:0 "MiG-19SK"
 CUM_cv_jet_multirole_equipment_5_desc:0 "MiG-19K modernisé"
 CUM_cv_jet_multirole_equipment_6:0 "Mikoyan-Gurevich MiG-21K"
 CUM_cv_jet_multirole_equipment_6_short:0 "MiG-21K"
 CUM_cv_jet_multirole_equipment_6_desc:0 "Proposition de variante embarquée du MiG-21"
 CUM_cv_jet_multirole_equipment_7:0 "Mikoyan-Gurevich MiG-23A"
 CUM_cv_jet_multirole_equipment_7_short:0 "MiG-23A"
 CUM_cv_jet_multirole_equipment_7_desc:0 "MiG-23A « Lightning » - la version embarquée du chasseur MiG-23 a été développée par le bureau d'études A.I. Mikoyan. Le chasseur embarqué devait se distinguer du MiG-23M de série par un nouveau vitrage du cockpit avec un siège pilote surélevé pour une meilleure visibilité, ainsi que par une perche non rétractable pour le ravitaillement en vol. Pour assurer l'atterrissage sur le pont, l'avion devait être équipé d'un train d'atterrissage renforcé et d'un crochet de freinage dans la partie arrière. Ce dernier nécessitait le remplacement d'une grande arête ventrale par deux petites, ainsi que l'augmentation de la surface de la quille."
 CUM_cv_jet_multirole_equipment_8:0 "Mikoyan-Gurevich MiG-23AI"
 CUM_cv_jet_multirole_equipment_8_short:0 "MiG-23AI"
 CUM_cv_jet_multirole_equipment_8_desc:0 "Le projet de modernisation du MiG-23A était axé sur les capacités de combat air-air."
 CUM_cv_jet_multirole_equipment_9:0 "Mikoyan-Gurevich MiG-23K"
 CUM_cv_jet_multirole_equipment_9_short:0 "MiG-23K"
 CUM_cv_jet_multirole_equipment_9_desc:0 "MiG-23K « Whirlwind » - l'une des innovations majeures du MiG-23K résidait dans son nouveau moteur R-100, un moteur à double circuit qui offrait une consommation de carburant nettement inférieure à celle des moteurs à circuit unique équipant toutes les versions précédentes de cet appareil, ce qui a permis d'augmenter son autonomie."
 CUM_cv_jet_multirole_equipment_10:0 "Sukhoi Su-33"
 CUM_cv_jet_multirole_equipment_10_short:0 "Su-33"
 CUM_cv_jet_multirole_equipment_10_desc:0 "Conçu à partir du Su-27, cet avion embarqué a été développé pour répondre aux besoins opérationnels de la Marine russe. Sa vitesse est légèrement inférieure à celle des autres chasseurs de la même génération, mais il offre d'excellentes capacités de manœuvrabilité. Son nom de code OTAN est « Flanker-D ». Les ailes principales et les ailes de queue peuvent être repliées afin de s'adapter à l'espace de stockage disponible sur un porte-avions."
 CUM_cv_mr_stealth_fighter_equipment_1:0 "Mikoyan-Gurevich MiG-29K"
 CUM_cv_mr_stealth_fighter_equipment_1_short:0 "MiG-29K"
 CUM_cv_mr_stealth_fighter_equipment_1_desc:0 "Le MiG-29K n'a pas été mis en production et seuls deux prototypes ont été construits à l'origine, car la Marine russe a préféré le Su-27K (rebaptisé par la suite Su-33) au début des années 1990. Mikoyan n'a pas cessé ses travaux sur le MiG-29K malgré l'absence de financement depuis 1992. Le programme a connu un nouvel élan à la fin des années 1990 pour répondre à un besoin indien en chasseurs embarqués suite à l'achat d'un ancien porte-avions soviétique, et le MiG-29K a été livré pour la première fois à l'Armée de l'air navale indienne en 2009. La Marine russe, dont les Su-33 arrivaient en fin de vie en 2010, a également commandé le MiG-29K en remplacement. Les MiG-29K de série diffèrent des prototypes par des caractéristiques telles qu'un radar multifonction et plusieurs nouveaux écrans dans le cockpit ; l'adoption de commandes HOTAS ; l'intégration de missiles air-air R-77, ainsi que de missiles pour les opérations anti-navires et anti-radars ; et plusieurs armes de précision guidées pour les frappes au sol."
 CUM_stealth_tactical_bomber_equipment_1:0 "Mikoyan-Gurevich MiG-37 Ferret"
 CUM_stealth_tactical_bomber_equipment_1_short:0 "MiG-37 Ferret"
 CUM_stealth_tactical_bomber_equipment_1_desc:0 "<FICTIF> Le MiG-37 est un avion d'interception furtif conçu pour mener des attaques à guidage de précision contre des cibles ennemies sans être détecté par les forces adverses. Il s'agissait d'un projet secret lancé après la divulgation d'informations concernant le F-117 Nighthawk, et son développement a été accéléré à la suite de la destruction d'un F-117 pendant la guerre du Kosovo. Son nom de code OTAN est « Ferret »."
 CUM_stealth_tactical_bomber_equipment_2:0 "Sukhoi Su-24BM"
 CUM_stealth_tactical_bomber_equipment_2_short:0 "Su-24BM"
 CUM_stealth_tactical_bomber_equipment_2_desc:0 "En 1979, V. Sarov commença à travailler sur une version beaucoup plus grande du Su-24M, dotée d'une soute interne pouvant contenir la plupart des armes destinées à être utilisées par le nouvel avion. Connu au sein de l'OKB sous le nom de T-6BM (Bolshaya Modifikatsiya ou grande modification) et sous le nom de Su-24BM pour le W S, cet avion était beaucoup plus grand mais aussi plus furtif que le Su-24."
 CUM_stealth_strategic_bomber_equipment_1:0 "Tupolev Tu-160"
 CUM_stealth_strategic_bomber_equipment_1_short:0 "Tu-160"
 CUM_stealth_strategic_bomber_equipment_1_desc:0 "Le Tupolev Tu-160 (nom de code OTAN : Blackjack) est un bombardier stratégique lourd supersonique à voilure à géométrie variable conçu par le Bureau d'études Tupolev en Union soviétique dans les années 1970. Il s'agit de l'avion militaire supersonique (Mach 2+) le plus grand et le plus lourd jamais construit, et il se classe juste derrière l'avion expérimental XB-70 Valkyrie en termes de longueur totale. En 2021, c'est l'avion de combat le plus grand et le plus lourd, le bombardier le plus rapide en service et l'avion à voilure à géométrie variable le plus grand et le plus lourd à avoir jamais volé."
 CUM_stealth_strategic_bomber_equipment_2:0 "Tupolev PAK-DA"
 CUM_stealth_strategic_bomber_equipment_2_short:0 "PAK-DA"
 CUM_stealth_strategic_bomber_equipment_2_desc:0 "Le PAK-DA (acronyme signifiant Perspektivnyi Aviatsionnyi Kompleks Dal'ney Aviatsii, ou complexe aéronautique prospectif pour l'aviation longue distance) est un projet de bombardier stratégique russe de nouvelle génération développé pour l'armée de l'air russe. Bombardier stratégique furtif, le PAK DA devrait entrer en service entre 2025 et 2030, le premier appareil devant être livré entre 2020 et 2023, dans le but de remplacer les bombardiers Tu-95 « Bear » et Tu-160 « Blackjack »."
 CUM_jump_jet_equipment_1:0 "Yakovlev Yak-36"
 CUM_jump_jet_equipment_1_desc:0 "Le Yak-36 (également connu sous le nom d'Izdeliye V) fut la première tentative soviétique de créer un avion de combat à décollage et atterrissage verticaux (VTOL). Quatre prototypes technologiques ont été construits. Le premier vol a eu lieu en septembre 1963 et, début 1966, l'avion a effectué son premier vol complet, du décollage vertical à l'atterrissage vertical. L'avion a été présenté au public lors du 50e anniversaire de la révolution d'octobre. Après les résultats prometteurs obtenus dans le cadre du programme Yak-36, la phase suivante du développement, le Yak-38, a été approuvée. Il est connu sous le nom de code OTAN « Freehand »."
 CUM_jump_jet_equipment_1_short:0 "Yak-36"
 CUM_jump_jet_equipment_2:0 "Yakovlev Yak-38"
 CUM_jump_jet_equipment_2_desc:0 "Le Yak-38 a été développé à partir du Yak-36 (et était à l'origine désigné Yak-36M), bien que les deux avions aient peu de points communs. Il s'agissait du seul avion de combat VTOL opérationnel de l'aviation navale soviétique et de leur premier avion à voilure fixe basé sur un porte-avions. Le Yak-38 a servi presque exclusivement sur les porte-avions de classe Kiev, entrant en service en 1976. L'avion n'a jamais été utilisé au combat, mais il a intercepté une fois des avions américains de l'U.S.S Enterprise au-dessus de la mer d'Oman. Son nom de code OTAN est Forger-A."
 CUM_jump_jet_equipment_2_short:0 "Yak-38"
 CUM_jump_jet_equipment_3:0 "Yakovlev Yak-38M"
 CUM_jump_jet_equipment_3_desc:0 "Le Yak-38M était une version améliorée du Yak-38, avec une masse maximale au décollage supplémentaire de 1 000 kg (2 200 lb) et un renforcement des pylônes sous les ailes pour transporter 910 kg (2 000 lb) d'armement. Le Yak-38M est entré en service dans l'aviation navale soviétique. Malgré les améliorations apportées à sa conception, le Forger restait sous-motorisé et s'est finalement révélé décevant. Ce modèle fut retiré du service après l'effondrement de l'Union soviétique en 1991."
 CUM_jump_jet_equipment_3_short:0 "Yak-38M"
 CUM_jump_jet_equipment_4:0 "Yakovlev Yak-141"
 CUM_jump_jet_equipment_4_desc:0 "Le Yakovlev Yak-141 Freestyle est un avion soviétique à décollage et atterrissage verticaux (VTOL) capable d'atteindre des vitesses supersoniques. Conçu pour remplacer intégralement le Yak-38 Forger, cet appareil était capable de voler en régime supersonique de manière soutenue et d'égaler les performances des chasseurs terrestres soviétiques. Il a effectué son premier vol au début de l'année 1987, et son premier vol en vol stationnaire en 1989. En 1991, le premier atterrissage vertical sur un porte-avions a été réalisé avec succès. Bien que prometteur, le programme Freestyle a été annulé en août 1991 en raison d'un manque de financement."
 CUM_jump_jet_equipment_4_short:0 "Yak-141"
 CUM_jump_stealth_equipment_1:0 "Yakovlev Yak-43 LFI"
 CUM_jump_stealth_equipment_1_short:0 "Yak-43 LFI"
 CUM_jump_stealth_equipment_1_desc:0 "Le Yak-43 était un chasseur soviétique à décollage et atterrissage verticaux (VTOL) développé dans le cadre du programme Lyogkiy Frontovoy Istrebitel (chasseur léger de première ligne/LFI). Il était conçu comme la version terrestre du malheureux Yakovlev Yak-141 Freestyle, qui n'a jamais été produit en raison de l'effondrement de l'Union soviétique. Comme le Yak-141, le Yak-43 n'aurait eu qu'un seul moteur principal, ainsi que deux moteurs dédiés au décollage vertical. Malheureusement, comme le Yak-141, il n'a jamais été produit, en partie à cause de l'effondrement de l'Union soviétique."
 CUM_recon_equipment_0:0 "Tupolev Tu-2R"
 CUM_recon_equipment_0_short:0 "Tu-2R"
 CUM_recon_equipment_0_desc:0 "Version de reconnaissance du Tu-2."
 CUM_jet_recon_equipment_0:0 "Mikoyan-Gurevich MiG-15Rbis"
 CUM_jet_recon_equipment_0_short:0 "MiG-15Rbis"
 CUM_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, l'OKB MiG a commencé à développer une variante de reconnaissance de première ligne du MiG-15 équipée d'une caméra AFA-BA/40, qui offre une largeur de balayage de 0,9 à 4,5 km avec une longueur de parcours photographique de 90 à 450 km à des altitudes comprises entre 2 000 et 10 000 m. Un seul canon NR-23 était installé sur l'avion. Afin d'augmenter l'autonomie du reconnaissance, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur « Barium-M » et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur l'appareil."
 CUM_jet_recon_equipment_1:0 "Mikoyan-Gurevich MiG-25RB"
 CUM_jet_recon_equipment_1_short:0 "MiG-25RB"
 CUM_jet_recon_equipment_1_desc:0 "MiG-25RB - avion de reconnaissance opérationnel monoplace toutes altitudes - bombardier. Les essais ont été achevés en décembre 1970. L'avion était équipé de 2 à 4 caméras de reconnaissance générale A-70M et d'une caméra topographique AFA-E/10. L'équipement photographique était logé dans cinq compartiments situés au bas du fuselage avant. Une station SIGINT appelée SPS-4A ou B « Virage » a également été installée, fonctionnant dans différentes gammes de fréquences. Équipement spécial - station de brouillage radio actif SPS-141."
 CUM_jet_recon_equipment_2:0 "Sukhoi Su-24MR"
 CUM_jet_recon_equipment_2_short:0 "Su-24MR"
 CUM_jet_recon_equipment_2_desc:0 "Variante dédiée à la reconnaissance tactique. Le Su-24MR conserve une grande partie de la suite de navigation du Su-24M, y compris le radar de suivi du terrain, mais supprime le radar d'attaque Orion-A, le système laser/TV et le canon au profit de deux installations de caméras panoramiques, caméra TV « Aist-M » (« Cigogne »), radar aéroporté à balayage latéral (SLAR) RDS-BO « Shtik » (« Baïonnette ») et système de reconnaissance infrarouge « Zima » (« Hiver »). D'autres capteurs sont transportés sous forme de nacelles."
 CUM_naval_helicopter_equipment_1:0 "Kamov Ka-15 Hen"
 CUM_naval_helicopter_equipment_1_short:0 "Ka-15 Hen"
 CUM_naval_helicopter_equipment_2:0 "Kamov Ka-20 Harp"
 CUM_naval_helicopter_equipment_2_short:0 "Ka-20 Harp"
 CUM_naval_helicopter_equipment_3:0 "Kamov Ka-25BSh Hormone-A"
 CUM_naval_helicopter_equipment_3_short:0 "Ka-25BSh Hormone-A"
 CUM_naval_helicopter_equipment_4:0 "Kamov Ka-25K Hormone-B"
 CUM_naval_helicopter_equipment_4_short:0 "Ka-25K Hormone-B"
 CUM_naval_helicopter_equipment_5:0 "Mil Mi-14PL Haze-A"
 CUM_naval_helicopter_equipment_5_short:0 "Mi-14PL Haze-A"
 CUM_naval_helicopter_equipment_6:0 "Kamov Ka-27PL Helix-A"
 CUM_naval_helicopter_equipment_6_short:0 "Ka-27PL Helix-A"
 CUM_naval_helicopter_equipment_7:0 "Kamov Ka-27M Helix"
 CUM_naval_helicopter_equipment_7_short:0 "Ka-27M Helix"
 CUM_slbm_equipment_1:0 "R-11FM Scud"
 CUM_slbm_equipment_1_short:0 "R-11FM Scud"
 CUM_slbm_equipment_1_desc:0 "Le R-11FM est la variante navale du R-11 Zemlya, désigné Scud-A par l'OTAN. Il a été testé pour la première fois sur une rampe de lancement à Kapustin Yar en 1955, puis lancé depuis un sous-marin du projet 611 (classe Zulu) plus tard dans l'année. Le missile a été déclaré opérationnel en 1959, sous le nom de système de lancement D-1, et a été le premier SLBM au monde. Il a été lancé 77 fois au total pendant son service, dont 59 avec succès. Il a été complètement retiré du service en 1963."
 CUM_slbm_equipment_2:0 "R-13 Sark"
 CUM_slbm_equipment_2_short:0 "R-13 Sark"
 CUM_slbm_equipment_2_desc:0 "Le R-13 a remplacé le R-11FM, dont le développement a été autorisé par le bureau d'études Makayev Rocket Design Bureau en 1955. Les spécifications techniques finales ont été approuvées au début de l'année 1956, et le R-13 est entré en service en 1961. Le Sark a été le premier SLBM soviétique à utiliser des propulseurs verniers pour changer de trajectoire en plus des ailerons arrière, ce qui a amélioré sa stabilité, son aérodynamisme et sa portée. Le R-13 pouvait parcourir 600 km et transporter une ogive de 2 mégatonnes. Il a été retiré du service en 1975."
 CUM_slbm_equipment_3:0 "R-21 Serb"
 CUM_slbm_equipment_3_short:0 "R-21 Serb"
 CUM_slbm_equipment_3_desc:0 "Le R-21 fut le premier missile soviétique pouvant être lancé depuis un sous-marin immergé. Son développement débuta en 1958 et ses premiers vols réussis eurent lieu deux ans plus tard. Le R-21 avait une portée deux fois supérieure à celle de ses prédécesseurs, soit 1 650 km, et pouvait transporter une ogive de 800 kt. Introduit pour la première fois en 1963, il fut retiré du service en 1987."
 CUM_slbm_equipment_4:0 "R-27 Serb"
 CUM_slbm_equipment_4_short:0 "R-27 Serb"
 CUM_slbm_equipment_4_desc:0 "Le R-27 était très similaire au R-21 en termes de conception et d'objectif. Entré en service seulement 5 ans après le R-21, en 1968, il offrait des performances et des capacités nettement supérieures, avec une portée opérationnelle de 2 400 km et une ogive d'une puissance d'une mégatonne. Au total, 1 800 missiles ont été fabriqués, avant son retrait définitif en 1990."
 CUM_slbm_equipment_5:0 "R-29 Sawfly"
 CUM_slbm_equipment_5_short:0 "R-29 Sawfly"
 CUM_slbm_equipment_5_desc:0 "Le R-29 a été le premier SLBM moderne à être introduit dans la marine soviétique. Déployé en 1974, il avait une portée trois fois supérieure à celle du R-27, soit 7 700 km, et pouvait transporter une ogive plus lourde, d'une puissance supérieure à 1 mégatonne. Il est toujours utilisé aujourd'hui, et un nombre inconnu d'entre eux se trouvent actuellement à bord de sous-marins russes."
 CUM_slbm_equipment_6:0 "R-29RM Skiff"
 CUM_slbm_equipment_6_short:0 "R-29RM Skiff"
 CUM_slbm_equipment_6_desc:0 "Le R-29RM a été conçu après le R-29, mais avec un objectif différent. Bien qu'il ait une charge utile beaucoup plus faible, avec 4 ogives de 100 kilotonnes dans un MIRV, il a une portée plus longue de 8 800 km et peut être embarqué en plus grand nombre dans un sous-marin. Cependant, contrairement au R-29, il a été retiré du service en 2010."
 CUM_slbm_equipment_7:0 "R-39 Sturgeon"
 CUM_slbm_equipment_7_short:0 "R-39 Sturgeon"
 CUM_slbm_equipment_7_desc:0 "Le développement du R-39 a commencé au début des années 1970, les premiers essais ont eu lieu en 1979 et son déploiement en 1983. À pleine capacité, 120 missiles étaient en service, chacun transportant 10 ogives de 150 kilotonnes et ayant une portée de 8 300 km. Conformément aux termes des traités START I et II, leur destruction a progressivement commencé en 1996, et le dernier R-39 a été mis hors service en 2004."
 CUM_irbm_equipment_1:0 "R-5 Pobeda"
 CUM_irbm_equipment_1_short:0 "R-5 Pobeda"
 CUM_irbm_equipment_1_desc:0 "Le R-5 fut la première tentative soviétique de fabrication d'un missile balistique à courte portée, ou IRBM. La variante du R-5 qui fut effectivement produite fut le R-5M, qui fut le premier missile nucléaire déployé par l'URSS. Il avait une portée de 1 200 km et pouvait transporter une ogive thermonucléaire d'une puissance maximale de 1 mégatonne. Il a été distribué pour la première fois en mai 1956 et installé dans des bases aériennes est-allemandes à la fin de l'année 1959. Au total, 48 lanceurs et 200 missiles ont été produits avant son retrait en 1967."
 CUM_irbm_equipment_2:0 "R-12 Dvina"
 CUM_irbm_equipment_2_short:0 "R-12 Dvina"
 CUM_irbm_equipment_2_desc:0 "Le R-12, successeur du R-5, fut l'un des missiles soviétiques les plus produits pendant la guerre froide, avec 2 335 exemplaires fabriqués, et constituait l'essentiel de la menace offensive soviétique sur l'Europe occidentale. Le R-12 a été produit pour la première fois en octobre 1958 et mis en service en 1959. Il avait une portée maximale de 2 080 km et pouvait transporter une ogive thermonucléaire de 2,3 mégatonnes. C'est l'installation de R-12 à Cuba qui a déclenché la crise des missiles de Cuba en 1963."
 CUM_irbm_equipment_3:0 "R-14 Chusovaya"
 CUM_irbm_equipment_3_short:0 "R-14 Chusovaya"
 CUM_irbm_equipment_3_desc:0 "Le Premier ministre de l'URSS a autorisé le développement du R-14 le 2 juillet 1958, et les essais en vol ont été achevés à la fin de 1961. La version lancée depuis un silo a été autorisée en mai 1960 et les essais ont été achevés au début de l'année 1962. Le Chusovaya avait une portée de 4 500 km et pouvait transporter une ogive d'une puissance maximale de 2,3 mégatonnes. Il a été mis en service en avril 1961, et les six derniers exemplaires ont été mis au rebut en 1989 à la suite d'un traité conclu avec les États-Unis."
 CUM_irbm_equipment_4:0 "RT-15 Scamp"
 CUM_irbm_equipment_4_desc:0 "Le RT-15 était l'une des premières tentatives soviétiques pour fabriquer un missile balistique intercontinental (IRBM) plus mobile. Il était conçu pour être lancé à partir d'un châssis T-10. Il devait s'agir d'un système de lancement rapide d'une portée maximale de 2 500 km, capable de transporter une ogive d'une puissance de 1 mégatonne. Cependant, il n'a jamais été adopté pour un usage général, seul un bataillon l'ayant utilisé, en raison de problèmes électroniques et d'un système de lancement peu performant."
 CUM_irbm_equipment_4_short:0 "RT-15 Scamp"
 CUM_irbm_equipment_5:0 "RSD-10 Pioneer"
 CUM_irbm_equipment_5_short:0 "RSD-10 Pioneer"
 CUM_irbm_equipment_5_desc:0 "Le RSD-10 a été mis au point en 1966, et sa conception initiale a été approuvée en 1968. Destiné à remplacer ou à compléter les R-12 et R-14, il a été déployé pour la première fois en 1976 et distribué à l'ensemble des pays du Pacte de Varsovie, car le RSD-10 était le premier missile soviétique capable de frapper avec précision des cibles de petite taille. Plus de 650 exemplaires ont finalement été produits, chacun ayant une portée de 5 500 km et pouvant transporter une ogive de 1,6 Mt, puis plus tard un MIRV. Tous ont été détruits conformément au Traité sur les forces nucléaires à portée intermédiaire de 1991."
 CUM_irbm_equipment_6:0 "RT-21M Temp 2S"
 CUM_irbm_equipment_6_short:0 "RT-21M Temp 2S "
 CUM_irbm_equipment_6_desc:0 "Bien que techniquement classé par l'OTAN comme un ICBM, le RT-21M avait une portée plus courte que la plupart des autres missiles, ainsi qu'une ogive plus petite, d'une puissance maximale d'un mégatonne. Il reposait sur un lanceur mobile et a été conçu et développé à peu près à la même époque que le RSD-10. Cependant, en raison de tous les traités relatifs aux armes nucléaires conclus à la fin du XXe siècle, le programme n'a jamais vraiment vu le jour et, au milieu des années 1980, l'ensemble du projet a été abandonné."
 CUM_irbm_equipment_7:0 "RSD-10 Pioneer 3"
 CUM_irbm_equipment_7_short:0 "RSD-10 Pioneer 3"
 CUM_irbm_equipment_7_desc:0 "Le RSD-10 Pioneer 3 est une version améliorée du RSD-10 original. La plus grande avancée concerne la portée maximale du RSD-10 3, qui a bondi de 2 000 km, passant de 5 500 à 7 500 km. Développé à la fin des années 1970, il a été introduit pour la première fois dans l'armée soviétique en 1980 et était équipé d'une ogive nucléaire triple MIRV d'une puissance maximale de 50 kt chacune. Le Pioneer 3 a connu un sort similaire à celui du modèle original à la suite du traité sur les forces nucléaires à portée intermédiaire."
 CUM_srbm_equipment_1:0 "R-1 Scunner"
 CUM_srbm_equipment_1_short:0 "R-1 Scunner"
 CUM_srbm_equipment_1_desc:0 "Le R-1 Scunner n'était rien d'autre qu'une version améliorée de la fusée V-2. Il a été conçu et fabriqué par les mêmes scientifiques allemands qui avaient créé la V-2, car ils avaient été capturés par les Soviétiques lorsque l'Armée rouge s'était emparée de la principale usine de fabrication de la V-2. Si les Soviétiques voulaient une copie de la V-2, c'était davantage pour apprendre les techniques et les processus nécessaires à la construction de fusées que pour la valeur tactique réelle du R-1. La production fut personnellement autorisée par Staline (comme ce fut le cas pour tous les autres missiles par la suite) en 1947 et le Scunner entra en service en novembre 1950."
 CUM_srbm_equipment_2:0 "R-2 Sibling"
 CUM_srbm_equipment_2_short:0 "R-2 Sibling"
 CUM_srbm_equipment_2_desc:0 "Le R-2 constituait une amélioration majeure par rapport au R-1. Tout d'abord, son rayon d'action avait plus que doublé, passant à 600 km. Il disposait également d'un fuselage plus solide, de moins de vibrations grâce à un cône arrière en acier, et malgré un poids presque deux fois supérieur à celui du R-1, il était tout aussi précis, grâce aux progrès réalisés dans le domaine de la radiocommande. Le premier essai eut lieu fin 1949 et il fut accepté pour le service en 1951, mais ne fut distribué à grande échelle que deux ans plus tard. Le R-2 fut la dernière copie directe allemande, les Soviétiques ayant désormais suffisamment d'expérience pour créer leurs propres modèles."
 CUM_srbm_equipment_3:0 "R-11 Scud A"
 CUM_srbm_equipment_3_short:0 "R-11 Scud A"
 CUM_srbm_equipment_3_desc:0 "Le R-11 a été conçu sur la base de la variante Wasserfall (anti-aérienne) du V-2, mais n'était pas une imitation directe. En juillet 1955, la première version du R-11 a été acceptée par l'armée soviétique. Cependant, le R-11M, variante définitive du R-11 et capable de transporter une ogive nucléaire, a été accepté trois ans plus tard, en 1958. Lorsqu'il était équipé d'une ogive, il avait une portée maximale de 170 km. Il était donc principalement lancé à partir de plates-formes de frappe mobiles (châssis IS-2 modifiés)."
 CUM_srbm_equipment_4:0 "R-17 Scud B"
 CUM_srbm_equipment_4_short:0 "R-17 Scud B"
 CUM_srbm_equipment_4_desc:0 "Le Scud B a été le missile le plus utilisé et l'un des plus produits (plus de 7 000 exemplaires) pendant la guerre froide. Conçu en 1959, il est entré en service en 1964. Il constituait une amélioration considérable par rapport au R-11 précédent, avec une portée supérieure (300 km) et la possibilité de transporter aussi bien une ogive nucléaire qu'un réservoir de VX ou une bombe HE. Le R-17 a été largement utilisé au Moyen-Orient, en particulier pendant la guerre du Kippour et la guerre Iran-Irak. Il a été retiré du service soviétique/russe depuis un certain temps, mais certains pays, comme la Corée du Nord, l'utilisent encore."
 CUM_srbm_equipment_5:0 "OTR-22 Temp S"
 CUM_srbm_equipment_5_short:0 "OTR-22 Temp S"
 CUM_srbm_equipment_5_desc:0 "L'OTR-22 Temp S était une variante améliorée du TR-1 Temp. Son concept était similaire à celui du Scud-B et il utilisait le même lanceur, mais il n'a pas été produit en grande quantité. Il est entré en service en 1968 et avait une portée maximale de 900 km et une seule ogive de 500 kt. Il a été retiré du service en 1989."
 CUM_srbm_equipment_6:0 "OTR-21 Tochka A"
 CUM_srbm_equipment_6_short:0 "OTR-21 Tochka A"
 CUM_srbm_equipment_6_desc:0 "L'OTR-21 était un système de lancement mobile, conçu pour être utilisé aux côtés d'une division d'infanterie régulière afin de mener des frappes précises sur des sites ennemis importants, tels que des ponts ou des centres de commandement, ce qui le différenciait des SRBM précédents. Il avait une portée maximale de 70 km et était équipé d'une ogive de 100 kt qui pouvait être remplacée par une arme chimique, explosive ou à fragmentation ; ces deux facteurs démontrent clairement son objectif tactique. Il est entré en service en 1975 et ses trois variantes sont toujours utilisées aujourd'hui."
 CUM_srbm_equipment_7:0 "OTR-23 Oka"
 CUM_srbm_equipment_7_short:0 "OTR-23 Oka"
 CUM_srbm_equipment_7_desc:0 "L'OTR-23 a été conçu pour remplacer le Scud-B, alors obsolète, vers la fin de la guerre froide. Il a été développé au milieu des années 70 et est entré en service en 1979. Son rayon d'action était de 500 km, soit moins que celui du Scud, mais il était beaucoup plus précis et transportait une ogive plus lourde. Il a été interdit par le Traité sur les forces nucléaires à portée intermédiaire de 1991."
 CUM_srbm_equipment_8:0 "OTR-21 Tochka B"
 CUM_srbm_equipment_8_short:0 "OTR-21 Tochka B"
 CUM_srbm_equipment_8_short_desc:0 "L'OTR-21 Tochka-B était une version améliorée du Tochka-A. Développé pour la première fois en 1986, il est entré en service en 1989. Un propergol amélioré a porté sa portée maximale à 120 km, mais il était équipé de la même ogive et remplissait la même fonction que le Tochka-A. Il est toujours en service aujourd'hui."
 CUM_srbm_equipment_9:0 "9K720 Iskander"
 CUM_srbm_equipment_9_short:0 "9K720 Iskander"
 CUM_srbm_equipment_9_desc:0 "Le 9K720 a été conçu pour remplacer les OTR-21 d'ici début 2020. Les travaux de développement ont débuté en 1986 et se sont poursuivis sans être affectés par l'effondrement de l'Union soviétique, les premiers lancements ayant eu lieu en 1996. La version la plus récente, l'Iskander-M, a une portée de 500 km et peut transporter tout type d'ogive, nucléaire ou autre, jusqu'à 700 kg. La plupart des forces armées russes utilisent désormais le 9K720, mais certains anciens systèmes Tochka-B sont encore en service."
 CUM_icbm_equipment_1:0 "R-9 Desna"
 CUM_icbm_equipment_1_short:0 "R-9 Desna"
 CUM_icbm_equipment_1_desc:0 "Le R-9 Desna était un missile balistique intercontinental à deux étages, conçu en 1959 et testé pour la première fois en 1961. Capable de transporter une charge utile de 1 600 kg/ogive de 5 Mt sur environ 11 000 km, ce missile était non seulement très précis, mais aussi beaucoup plus utile sur le plan tactique pour l'Union soviétique, car il pouvait être ravitaillé en carburant et prêt à être lancé en moins de 20 minutes. Il a été mis en service pour la première fois en 1964 et a été utilisé par trois régiments terrestres et un régiment de silos. En 1976, tous les R-9 ont été mis hors service."
 CUM_icbm_equipment_2:0 "RT-2 Savage"
 CUM_icbm_equipment_2_short:0 "RT-2 Savage"
 CUM_icbm_equipment_2_desc:0 "Le RT-2 Savage était un missile balistique intercontinental à trois étages comparable au Minuteman américain. Il a terminé ses essais en vol au début de l'année 1966 et est entré en service en 1968. Il avait une portée opérationnelle de 10 186 km et était équipé d'une seule ogive de 600 kilotonnes. Une centaine d'exemplaires ont été construits, et le RT-2 a été retiré du service en 1976, en même temps que les R-9 restants."
 CUM_icbm_equipment_3:0 "R-36M Satan"
 CUM_icbm_equipment_3_short:0 "R-36M Satan"
 CUM_icbm_equipment_3_desc:0 "Le R-36M était une version nettement améliorée et beaucoup plus meurtrière du R-36. Missile balistique intercontinental à deux étages capable de parcourir 16 000 km, il pouvait transporter jusqu'à 10 ogives, un nombre inégalé, et grâce à sa conception, à son temps de rechargement rapide et à son grand nombre de véhicules de rentrée, il donnait aux Soviétiques un avantage en matière de capacité de première frappe. Le développement du R-36M a commencé à la fin des années 1970 et, à la chute de l'URSS, il existait 308 silos de lancement pour ce missile, chacun pouvant en contenir au moins deux. Certains R-36M sont encore en service aujourd'hui."
 CUM_icbm_equipment_4:0 "RT-23 Molodets"
 CUM_icbm_equipment_4_short:0 "RT-23 Molodets"
 CUM_icbm_equipment_4_desc:0 "Le RT-23 a été conçu comme un système d'armes à plate-forme multi-lancement, capable de tirer depuis un silo et un wagon. Il a été testé au début des années 80 et déployé en 1987. Le RT-23 avait une portée opérationnelle de 11 000 km et pouvait transporter 10 ogives MIRV de 550 kt. En septembre 1991, environ 90 exemplaires étaient déployés, mais lorsque l'Union soviétique s'est effondrée, l'usine de production a été fermée."
 CUM_icbm_equipment_5:0 "RT-2PM2 Topol-M"
 CUM_icbm_equipment_5_short:0 "RT-2PM2 Topol-M"
 CUM_icbm_equipment_5_desc:0 "Le RT-2PM2 est l'un des derniers modèles d'ICBM en service en Russie, et a été la première fusée russe produite après la chute de l'Union soviétique. Développée à la fin des années 1980 en réponse à l'Initiative de défense stratégique américaine, elle a finalement été mise en service en 1998. Arme à trois étages, la RT-2PM2 a une portée maximale de 11 500 km et une ogive d'une puissance d'un mégatonne. Actuellement, environ 90 exemplaires sont déployés."
 CUM_cruisemissile_equipment_0:0 "Chelomey 14Kh"
 CUM_cruisemissile_equipment_0_short:0 "Chelomey 14Kh"
 CUM_cruisemissile_equipment_0_desc:0 "En octobre 1944, piqué au vif par les fusées V-1 et V-2, Staline chargea Vladimir Chelomey de mener des recherches et de concevoir une arme similaire. La première tentative de Chelomey fut une V-1 rétro-conçue appelée 10kh, équipée du même moteur que la V-1. La 14kh était une version révisée et améliorée, dotée de stabilisateurs et d'ailes, ainsi que d'une meilleure conception structurelle globale et d'une plus grande portée opérationnelle."
 CUM_cruisemissile_equipment_1:0 "Chelomey 18Kh"
 CUM_cruisemissile_equipment_1_short:0 "Chelomey 18Kh"
 CUM_cruisemissile_equipment_1_desc:0 "Le 18Kh est apparu plus tard dans la gamme des missiles développés par Chelomey. Lorsqu'il a été produit, il présentait des améliorations similaires à celles apportées par le 14Kh par rapport au 10Kh. Il avait une plus grande portée, une ogive plus puissante, était plus stable et était équipé d'un moteur Chelomey D-6 plus puissant. Il s'agissait toutefois encore d'un modèle très rudimentaire et précoce dans le domaine des missiles de croisière."
 CUM_cruisemissile_equipment_2:0 "La-350 Burya"
 CUM_cruisemissile_equipment_2_short:0 "La-350 Burya"
 CUM_cruisemissile_equipment_2_desc:0 "Le Burya était un missile de croisière intercontinental supersonique développé pour la première fois en 1954. Il pouvait parcourir 6 000 km à Mach 3 avec une ogive de la taille d'une petite bombe, fonctionnant avec un moteur à deux étages composé d'un propulseur à propergol et d'un statoréacteur. Cependant, le projet a été annulé en 1960 en raison des avantages des missiles balistiques intercontinentaux (ICBM) et des missiles balistiques intercontinentaux (IR), à savoir une plus grande simplicité et une relative invulnérabilité à l'interception, que le La-350 ne possédait pas."
 CUM_cruisemissile_equipment_3:0 "RSS-40 Buran"
 CUM_cruisemissile_equipment_3_short:0 "RSS-40 Buran"
 CUM_cruisemissile_equipment_3_desc:0 "Le Bourane était un missile de croisière intercontinental similaire au La-350 dans son concept. Il fut développé parallèlement au Bouria et reçut son autorisation quelques semaines après le La-350. Il avait une plus grande portée, une vitesse maximale plus élevée et pouvait transporter une ogive plus lourde, mais il connut le même sort que le La-350 lorsqu'il fut annulé en novembre 1957."
 CUM_cruisemissile_equipment_4:0 "Raduga RK-55"
 CUM_cruisemissile_equipment_4_short:0 "Raduga RK-55"
 CUM_cruisemissile_equipment_4_desc:0 "Le RK-55 était un missile de croisière lancé à la fois depuis la terre ferme et depuis un sous-marin, capable de transporter une ogive nucléaire. Développé pour la première fois à la fin des années 1960, le RK-55 a subi des essais en vol en 1976. Alors qu'il était sur le point d'entrer en service en 1987, il a été interdit en vertu des directives établies par le Traité sur les forces nucléaires à portée intermédiaire. Selon des sources contemporaines, il aurait été converti en arme conventionnelle et serait encore utilisé aujourd'hui par les sous-marins."
 CUM_cruisemissile_equipment_5:0 "3M-54 Kalibr"
 CUM_cruisemissile_equipment_5_short:0 "3M-54 Kalibr"
 CUM_cruisemissile_equipment_5_desc:0 "Le 3M-54 est un missile de croisière supersonique extrêmement polyvalent, capable de tout faire. Pouvant être lancé depuis le sol, les airs, les navires de surface et les sous-marins, il est aujourd'hui largement utilisé par l'armée russe. Développé à la fin des années 1980, le 3M-54 est entré en service en 1994. Il a une portée de 660 km et peut transporter jusqu'à 500 kg d'armes nucléaires ou conventionnelles."
 CUM_cruisemissile_equipment_6:0 "3M22 Zircon"
 CUM_cruisemissile_equipment_6_short:0 "3M22 Zircon"
 CUM_cruisemissile_equipment_6_desc:0 "Le 3M22 est un missile de croisière hypersonique antinavire propulsé par statoréacteur qui fait actuellement l'objet d'essais en Russie. Les premiers prototypes ont été lancés en 2012 à partir d'un Tu-22M3, puis à partir d'une plate-forme terrestre en 2016. En 2019, Vladimir Poutine a annoncé qu'il était capable d'atteindre Mach 9. On estime qu'il a une portée d'environ 500 km et qu'il peut transporter une ogive de 400 kg."
