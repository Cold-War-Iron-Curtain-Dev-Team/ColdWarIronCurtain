 CAP_fighter_equipment_1:0 "Curtiss P-40 Warhawk"
 CAP_fighter_equipment_1_short:0 "P-40 Warhawk"
 CAP_fighter_equipment_1_desc:0 "Le P-40 était un avion de chasse monomoteur entièrement métallique développé en 1938. Il s'agissait d'une version modifiée du P-36 Hawk. Ce modèle fut utilisé par un grand nombre de puissances alliées pendant la Seconde Guerre mondiale et, bien qu'il fût inférieur aux P-47 et P-51 plus récents, il resta en service sur le front jusqu'à la fin de la guerre. 200 pilotes alliés de 7 nations différentes, dont les États-Unis, les pays du Commonwealth britannique et l'Union soviétique, sont devenus des as du P-40. Malgré des désignations différentes pour le Commonwealth et l'Union soviétique, le surnom officiel dans l'armée américaine est « Warhawk »."
 CAP_fighter_equipment_2:0 "Republic F-47 Thunderbolt"
 CAP_fighter_equipment_2_short:0 "F-47 Thunderbolt"
 CAP_fighter_equipment_2_desc:0 "Le P-47 était une évolution du Seversky (prédécesseur de Republic) P-35 et du Republic P-43 Lancer. Bien qu'il ait été initialement conçu comme un chasseur de supériorité aérienne, le P-47 s'est illustré par sa capacité à transporter une lourde charge de bombes, marquant ainsi le début de la tradition de la société dans le développement d'avions d'appui aérien rapproché (CAS). Ce modèle a été utilisé par de nombreux pays alliés pendant la Seconde Guerre mondiale et a continué à l'être après la guerre. Certains affirment que c'est lui, et non le P-51 Mustang, qui aurait dû être utilisé en Corée. Son surnom, « Thunderbolt », est le premier à respecter les conventions de dénomination modernes de Republic. Il a été rebaptisé F-47 en 1948."
 CAP_fighter_equipment_3:0 "North American F-51D Mustang"
 CAP_fighter_equipment_3_short:0 "F-51D Mustang"
 CAP_fighter_equipment_3_desc:0 "Le P-51 est considéré comme l'un des meilleurs chasseurs jamais construits dans l'histoire de l'aviation. Développé par North American Aviation, il est entré en service en 1942. Initialement utilisé comme avion de reconnaissance tactique, il est devenu, avec l'introduction de la variante « D », le premier chasseur à dominer les airs, escortant les bombardiers américains et alliés lors des campagnes de bombardement les plus célèbres du théâtre européen et détruisant près de 5 000 avions pendant la guerre. Rebaptisé plus tard F-51, il s'illustra comme avion d'appui aérien rapproché pendant la guerre de Corée, et le « Mustang », cheval de bataille de l'USAAAF, resta en service jusqu'en 1968."
 CAP_heavy_fighter_equipment_1:0 "Lockheed P-38 Lightning"
 CAP_heavy_fighter_equipment_1_short:0 "P-38 Lightning"
 CAP_heavy_fighter_equipment_1_desc:0 "Avion à deux moteurs à pistons conçu pour privilégier la vitesse et l'armement lourd. Pendant la Seconde Guerre mondiale, sa vitesse a été mise à profit dans de nombreuses attaques éclair au-dessus du Pacifique, détruisant de nombreux avions japonais. Sa forme distinctive lui a valu le surnom de « der Gabelschwanz-Teufel » (le diable à queue fourchue) en Allemagne et de « Ni hikouki, ippairotto » (deux avions, un pilote) au Japon. Il est également connu sous le nom de « Lightning »."
 CAP_heavy_fighter_equipment_2:0 "Northrop F-61 Black Widow"
 CAP_heavy_fighter_equipment_2_short:0 "F-61 Black Widow"
 CAP_heavy_fighter_equipment_2_desc:0 "Le P-61, comme le P-38 avant lui, est un avion à double fuselage conçu en 1944. Il fut le premier chasseur de nuit américain, équipé d'un radar (une autre première) pour suivre les bombardiers et autres cibles et les intercepter de nuit et dans des conditions météorologiques défavorables. Équipé de quatre canons Hispano de 20 mm, le P-61 (rebaptisé plus tard F-61), surnommé « Black Widow » (veuve noire) en référence à la célèbre araignée américaine, est aussi redoutable que son nom le suggère."
 CAP_heavy_fighter_equipment_3:0 "North American F-82 Twin Mustang"
 CAP_heavy_fighter_equipment_3_short:0 "F-82 Twin Mustang"
 CAP_heavy_fighter_equipment_3_desc:0 "Développé à l'origine comme chasseur d'escorte à longue portée pour la Seconde Guerre mondiale, le P-82 a été introduit en 1946, trop tard pour servir pendant le conflit. Développé à partir du célèbre P-51, le P-82 (plus tard F-82) a été utilisé en remplacement du P-61 Black Widow et était équipé d'un radar pour soutenir le Commandement stratégique aérien. Comme sa cellule ressemble à deux P-51 assemblés, il a été surnommé « Twin Mustang »."
 CAP_strat_bomber_equipment_1:0 "Forteresse volante Boeing B-17"
 CAP_strat_bomber_equipment_1_short:0 "Forteresse volante B-17"
 CAP_strat_bomber_equipment_1_desc:0 "Le B-17 est un bombardier stratégique quadrimoteur développé au milieu des années 1930 pour l'armée de l'air américaine. Il s'agit du troisième bombardier le plus produit pendant la Seconde Guerre mondiale. Il s'est illustré sur le théâtre européen du conflit, où il a mené des campagnes de bombardement en Allemagne à partir de bases situées dans le sud de l'Angleterre et en Italie. Son armement défensif imposant est à la hauteur d'un avion surnommé la « forteresse volante »."
 CAP_strat_bomber_equipment_2:0 "Libérateur B-24 consolidé"
 CAP_strat_bomber_equipment_2_short:0 "Libérateur B-24"
 CAP_strat_bomber_equipment_2_desc:0 "Le B-24 a été conçu en 1941 comme bombardier lourd à longue portée pour l'armée de l'air américaine. Malgré sa capacité à transporter une lourde charge de bombes et sa vitesse de croisière élevée, il était relativement difficile à piloter à basse altitude et avait un plafond pratique inférieur à celui du B-17. Pourtant, le « Liberator » était préféré par l'état-major américain et fut le bombardier le plus produit pendant la Seconde Guerre mondiale. Comme le B-17, il rendit de grands services sur le théâtre européen pendant la campagne de bombardements de l'Allemagne, mais se distingua également sur le théâtre du Pacifique."
 CAP_strat_bomber_equipment_3:0 "Boeing B-29 Superforteresse"
 CAP_strat_bomber_equipment_3_short:0 "Superforteresse B-29"
 CAP_strat_bomber_equipment_3_desc:0 "Le B-29 était un bombardier quadrimoteur à hélices mis en service en 1944. Il s'agissait du projet d'armement le plus coûteux jamais réalisé pendant la guerre, dépassant même le coût du programme d'armement nucléaire américain de l'époque. Conçu comme un bombardier stratégique à haute altitude, il fut utilisé comme bombardier incendiaire de nuit à basse altitude, lançant des raids de bombardements incendiaires sur le Japon. Mais la « Superfortress » doit surtout sa renommée au largage des bombes atomiques sur Hiroshima et Nagasaki, qui ont contribué à la fin de la guerre. Des variantes modernisées (dont le B-50, rebaptisé) ont continué à être utilisées comme bombardiers stratégiques pendant la guerre de Corée avant d'être retirées du service au début des années 1950."
 CAP_tac_bomber_equipment_0:0 "Douglas B-18 Bolo"
 CAP_tac_bomber_equipment_0_short:0 "B-18 Bolo"
 CAP_tac_bomber_equipment_0_desc:0 "Le B-18, introduit en 1936, était un bombardier moyen développé pour remplacer le Martin B-10. Bien qu'il fût performant au moment de son introduction, il fut rapidement rendu obsolète en 1940 et relégué à la lutte anti-sous-marine et au transport aérien. Malgré cela, le « Bolo » allait connaître la gloire en devenant le premier avion américain à couler un sous-marin allemand pendant la Seconde Guerre mondiale."
 CAP_tac_bomber_equipment_1:0 "Douglas B-23 Dragon"
 CAP_tac_bomber_equipment_1_short:0 "Dragon B-23"
 CAP_tac_bomber_equipment_1_desc:0 "Développé comme un successeur perfectionné du B-18 Bolo, le B-23 était plus rapide et pouvait transporter une charge de bombes plus lourde et un armement défensif plus important. Cependant, le « Dragon » s'est avéré inférieur à ses contemporains, les B-25 et B-26, et a été largement relégué au rang d'avion d'entraînement pendant la Seconde Guerre mondiale."
 CAP_tac_bomber_equipment_2:0 "Aviation nord-américaine B-25 Mitchell"
 CAP_tac_bomber_equipment_2_short:0 "B-25 Mitchell"
 CAP_tac_bomber_equipment_2_desc:0 "Le B-25 est un bombardier moyen bimoteur introduit en 1941. Utilisé par de nombreuses forces aériennes pendant la Seconde Guerre mondiale, il a également servi sur tous les théâtres d'opérations impliquant des avions pendant la guerre, son utilisation la plus célèbre étant le raid de Doolittle, la première campagne de bombardements aériens réussie sur le territoire japonais pendant la guerre. Son surnom est le « Mitchell », du nom du major général Billy Mitchell, pionnier de l'aviation militaire américaine."
 CAP_tac_bomber_equipment_3:0 "Martin B-26 Maraudeur"
 CAP_tac_bomber_equipment_3_short:0 "B-26 Maraudeur"
 CAP_tac_bomber_equipment_3_desc:0 "Le B-26 a été développé en 1941 comme bombardier moyen, parallèlement au B-25. Difficile à piloter au départ, il a été surnommé « Widowmaker » (faiseur de veuves) en raison du nombre de pilotes qui se sont écrasés et ont trouvé la mort lors de leur formation sur cet appareil. Cependant, après avoir subi des modifications et une fois les pilotes correctement formés, il s'est révélé être un bombardier tactique performant, servant en Europe occidentale ainsi que dans les théâtres du Pacifique et de la Méditerranée pendant la Seconde Guerre mondiale. Surnommé le « Marauder », cet appareil a été retiré du service en 1947, avant que l'armée de l'air ne soit séparée de l'armée de terre (ce qui explique pourquoi l'A-26 Invader a brièvement été baptisé B-26)."
 CAP_nav_bomber_equipment_1:0 "Douglas XTBD-1"
 CAP_nav_bomber_equipment_1_short:0 "XTBD-1"
 CAP_nav_bomber_equipment_1_desc:0 "Le prototype XTBD-1 a été mis au point en 1935 et était considéré, au moment de son premier vol, comme le bombardier torpilleur le plus avancé au monde. Propulsé par un seul moteur de 800 chevaux et équipé d'une soute pouvant accueillir une torpille ou une bombe de gros calibre, l'XTBD-1 semblait promis à un brillant avenir."
 CAP_nav_bomber_equipment_2:1 "Grumman TBF Avenger"
 CAP_nav_bomber_equipment_2_short:1 "TBF « Vengeur »"
 CAP_nav_bomber_equipment_2_desc:0 "Lancé en 1941 et mis en service à temps pour la bataille de Midway (où, comme son prédécesseur, il fit piètre figure), le TBF allait devenir l'un des bombardiers torpilleurs les plus remarquables de la Seconde Guerre mondiale, infligeant des défaites à la marine japonaise et faisant honneur à son surnom d'« Avenger ». Ce modèle fut amélioré après la guerre et resta en service dans la marine américaine jusque dans les années 1960."
 CAP_nav_bomber_equipment_3:0 "Consolidated PB4Y-2 Privateer"
 CAP_nav_bomber_equipment_3_short:0 "PB4Y-2 Privateer"
 CAP_nav_bomber_equipment_3_desc:0 "Le Consolidated PB4Y-2 Privateer est un bombardier de patrouille américain de la Seconde Guerre mondiale et de la guerre de Corée, utilisé par la marine américaine et dérivé du Consolidated B-24 Liberator."
 CAP_cv_CAS_equipment_1:0 "Northrop BT"
 CAP_cv_CAS_equipment_1_short:0 "Northrop BT"
 CAP_cv_CAS_equipment_1_desc:0 "Le Northrop BT a été développé en 1935, alors que Northrop était une filiale de Douglas Aircraft Corporation. Premier avion à train d'atterrissage tricycle fixe à atterrir sur un porte-avions, ce modèle a ensuite été développé par Douglas pour devenir le bombardier en piqué SBD Dauntless."
 CAP_CAS_equipment_2:0 "Douglas A-20 Havoc"
 CAP_CAS_equipment_2_short:0 "A-20 Havoc"
 CAP_CAS_equipment_2_desc:0 "L'A-20, surnommé « Havoc », a été introduit en 1941 en tant que bombardier léger et avion d'attaque au sol. Utilisé par les États-Unis et le Commonwealth, il doit sa renommée à son service dans l'armée de l'air et la marine soviétiques, qui ont reçu les deux tiers des modèles A-20B et de nombreux modèles G et H. Modifiés avec des mitrailleuses de 7,62 mm à cadence de tir plus rapide et des canons à tir frontal, ces modèles se sont distingués sur le front oriental contre les chars allemands et ont été les bombardiers étrangers les plus utilisés par l'armée de l'air soviétique pendant la Seconde Guerre mondiale. Les variantes de chasseurs ont également été baptisées P-70."
 CAP_CAS_equipment_3:0 "North American A-36 Apache"
 CAP_CAS_equipment_3_short:0 "A-36 Apache"
 CAP_CAS_equipment_3_desc:0 "L'A-36 a été développé comme variante d'attaque au sol du célèbre P-51 Mustang. Bombardier en piqué, il a fait ses preuves en Afrique du Nord, en Méditerranée, en Italie et sur les théâtres d'opérations Chine-Birmanie-Inde pendant la Seconde Guerre mondiale. Il est connu pour ses aérofreins rectangulaires caractéristiques situés à l'extrémité des ailes. L'« Apache », nommé d'après la tribu amérindienne, s'est révélé redoutable au cours de sa courte carrière, servant de 1942 jusqu'à son retrait à la fin de la guerre en 1945."
 CAP_CAS_equipment_4:0 "Douglas A-26C Invader"
 CAP_CAS_equipment_4_short:0 "A-26C Invader"
 CAP_CAS_equipment_4_desc:0 "L'A-26 est un avion d'attaque rapide bimoteur développé à partir de l'A-20 Havoc, qu'il était destiné à remplacer. Mis en service en 1943, l'Invader a servi dans l'armée de l'air américaine pendant la Seconde Guerre mondiale, attaquant les positions japonaises dans les Indes orientales néerlandaises et aux Philippines, ainsi qu'en Europe lors des campagnes dans la vallée du Pô, dans le nord de l'Italie. Il a continué à servir en Corée, participant à des missions de bombardement contre la Corée, et a été le premier avion à effectuer une sortie dans ce conflit. L'« Invader » a poursuivi sa carrière au Vietnam, soutenant les opérations de la CIA au Laos contre les forces vietcongs. Avec une carrière légendaire à travers trois guerres, l'« Invader » a prouvé sa valeur et montré ce dont un avion CAS était capable."
 CAP_cv_CAS_equipment_4:0 "Douglas AD Skyraider"
 CAP_cv_CAS_equipment_4_short:0 "Douglas AD Skyraider"
 CAP_cv_CAS_equipment_4_desc:0 "Le Douglas AD est un avion d'attaque rapide fiable, basé sur un porte-avions. Conçu à l'origine comme un bombardier torpilleur et en piqué, l'AD (initialement le BT2D) est entré en service en 1946 et s'est illustré pendant la guerre de Corée, devenant le principal avion d'attaque au sol des forces de la marine américaine et du corps des Marines sur place. Même si la plupart des avions à hélices ont été retirés du service après le conflit coréen, le nouvel A-1 est resté en service et a joué un rôle clé en tant qu'avion d'appui aérien rapproché. Le « Skyraider » a servi avec distinction jusqu'à la fin de l'intervention américaine au Vietnam."
 CAP_cv_nav_bomber_equipment_1:0 "Douglas TBD Devastator"
 CAP_cv_nav_bomber_equipment_1_short:0 "TBD Devastator"
 CAP_cv_nav_bomber_equipment_1_desc:0 "Lorsque le TBD est entré en service en 1937, il était encore largement considéré comme l'un des meilleurs bombardiers torpilleurs. Cependant, malgré quelques succès au début de la guerre, au moment de l'attaque japonaise sur Pearl Harbor, le « Devastator » était malheureusement obsolète, ce qui a été confirmé lors de la bataille de Midway, où la quasi-totalité des Devastators utilisés dans la bataille ont été détruits. Bien que cela ait été attribué par la suite à une couverture aérienne insuffisante et à des défauts dans les torpilles qu'il transportait habituellement, le TBD fut retiré du service actif immédiatement après la bataille, puis définitivement retiré du service en 1944."
 CAP_cv_nav_bomber_equipment_2:0 "Grumman TBF-1C Avenger"
 CAP_cv_nav_bomber_equipment_2_short:0 "TBF-1C Avenger"
 CAP_cv_nav_bomber_equipment_2_desc:0 "La variante TBF-1C de l'« Avenger » améliorait la conception originale du TBF-1 en prévoyant deux mitrailleuses de 12,7 mm (calibre .50) montées sur les ailes et des réservoirs de carburant également montés sur les ailes, ce qui doublait l'autonomie et la puissance d'attaque vers l'avant de l'avion."
 CAP_cv_nav_bomber_equipment_3:0 "Consolidated PB4Y-2 Privateer"
 CAP_cv_nav_bomber_equipment_3_short:0 "PB4Y-2 Privateer"
 CAP_cv_nav_bomber_equipment_3_desc:0 "Le Consolidated PB4Y-2 Privateer est un bombardier de patrouille américain de la Seconde Guerre mondiale et de la guerre de Corée, utilisé par la marine américaine et dérivé du Consolidated B-24 Liberator."
 CAP_CAS_equipment_1:0 "Northrop A-17"
 CAP_CAS_equipment_1_short:0 "A-17"
 CAP_CAS_equipment_1_desc:0 "L'A-17 était un avion d'attaque monomoteur biplace dérivé du Northrop Gamma 2F et développé en 1935. C'était un appareil fiable et très apprécié. Ce type d'avion servit d'avion de patrouille côtière pour les unités ennemies qui pouvaient traverser le canal de Panama au début de la Seconde Guerre mondiale, après l'attaque de Pearl Harbor, et fut utilisé à des fins utilitaires jusqu'à son retrait en 1944."
 CAP_cv_CAS_equipment_2:0 "Douglas SBD-2 Dauntless"
 CAP_cv_CAS_equipment_2_short:0 "SBD-2 Dauntless"
 CAP_cv_CAS_equipment_2_desc:0 "Le SBD-2 a été conçu en 1940 comme avion de reconnaissance et bombardier en piqué. Il était le principal avion de ce type utilisé par la marine américaine. Le « Dauntless », qui était déjà un bombardier en piqué performant, a été amélioré avec la variante -2, dotée d'un armement différent et d'une capacité de carburant accrue, mais il ne s'agissait que d'une solution provisoire mineure par rapport aux modèles ultérieurs. Les variantes de l'USAAF l'ont baptisé A-24 Banshee."
 CAP_cv_CAS_equipment_3:0 "Curtiss SB2C-1s Helldiver"
 CAP_cv_CAS_equipment_3_short:0 "SB2C-1s Helldiver"
 CAP_cv_CAS_equipment_3_desc:0 "Remplaçant le SBD Dauntless, le SB2C, introduit en 1942, était beaucoup plus rapide que le SBD qu'il remplaçait, mais c'était un avion difficile à piloter, ce qui lui valut le surnom péjoratif de « SOB, 2nd Class » (enfoiré de deuxième classe). Malgré cela et un rapport cinglant qui allait ternir à jamais l'héritage de la Curtiss Aircraft Company, le « Helldiver » obtint d'excellents résultats au combat tout au long de la guerre du Pacifique. La variante de l'USAAF l'appelait A-25 Shrike."
 CAP_cv_fighter_equipment_0:0 "Grumman FF Fifi"
 CAP_cv_fighter_equipment_0_short:0 "FF Fifi"
 CAP_cv_fighter_equipment_0_desc:0 "Lancé en 1933, le Grumman FF fut le premier modèle entièrement conçu par la société pour la marine américaine. Surnommé officieusement « Fifi » (d'après la désignation FF), le Grumman FF fut un biplan embarqué très performant tout au long des années 30, avant d'être retiré du service en 1940."
 CAP_cv_fighter_equipment_1:0 "Grumman F3F"
 CAP_cv_fighter_equipment_1_short:0 "F3F"
 CAP_cv_fighter_equipment_1_desc:0 "Le Grumman F3F, lorsqu'il a été introduit en 1936, était le dernier avion de chasse biplan livré à la marine américaine et à l'ensemble des forces armées américaines en général. Malgré sa courte durée de service (retiré du service de première ligne en 1941 et du service en général en 1943), il restait un avion assez performant, le dernier d'une époque d'avions monoplans qui allait marquer l'avenir du combat aérien."
 CAP_cv_fighter_equipment_2:0 "Vought F4U-5 Corsair"
 CAP_cv_fighter_equipment_2_short:0 "F4U-5 Corsair"
 CAP_cv_fighter_equipment_2_desc:0 "Le Vought F4U Corsair est un avion de chasse américain qui a principalement servi pendant la Seconde Guerre mondiale et la guerre de Corée. Conçu et initialement fabriqué par Chance Vought, le Corsair a rapidement connu une forte demande ; des contrats de production supplémentaires ont été attribués à Goodyear, dont les Corsair ont été désignés FG, et à Brewster, désignés F3A. Le Corsair a été conçu et utilisé comme avion embarqué, et est entré en service en grand nombre dans la marine américaine à la fin de 1944 et au début de 1945. Il est rapidement devenu l'un des chasseurs-bombardiers embarqués les plus performants de la Seconde Guerre mondiale."
 CAP_cv_fighter_equipment_3:0 "Grumman F8F Bearcat"
 CAP_cv_fighter_equipment_3_short:0 "F8F Bearcat"
 CAP_cv_fighter_equipment_3_desc:0 "Le Grumman F8F Bearcat est un avion de chasse monomoteur américain basé sur un porte-avions, introduit à la fin de la Seconde Guerre mondiale. Il a servi au milieu du XXe siècle dans la marine américaine, le corps des Marines des États-Unis et les forces aériennes d'autres nations. Il s'agit du dernier avion de chasse à moteur à pistons de Grumman Aircraft."
 CAP_cv_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35C Lightning II"
 CAP_cv_mr_stealth_fighter_equipment_1_short:0 "F-35C Lightning II"
 CAP_cv_mr_stealth_fighter_equipment_1_desc:0 "Le F-35C est la variante CATOBAR (Catapult Assisted Take-Off But Arrested Recovery) de la famille F-35 Lightning II de Lockheed Martin, conçue principalement pour être déployée sur des porte-avions. Le programme F-35 a débuté en 1992, et la variante C a pris son envol dès 2010 et a été opérationnelle sur des porte-avions moins de quatre ans plus tard. Par rapport à ses homologues, la variante C se caractérise par des ailes plus grandes avec des extrémités repliables."
 CAP_jump_stealth_equipment_1:0 "Lockheed Martin F-35B Lightning II"
 CAP_jump_stealth_equipment_1_short:0 "F-35B Lightning II"
 CAP_jump_stealth_equipment_1_desc:0 "Un avion de combat polyvalent produit à partir d'une conception JSF (Joint Strike Fighter). Bien qu'il puisse utiliser diverses armes dans les combats air-air et sol-sol, le coût d'acquisition de cet avion de combat furtif est plus raisonnable que celui du F-22A. En fonction de son utilité, plusieurs types sont disponibles. Le type « B » utilisé par le Corps des Marines des États-Unis est compatible STOVL (décollage court/atterrissage vertical). Son surnom est « Lightning II »."
 CAP_cas_stealth_equipment_1:0 "Fairchild Republic A-10C Thunderbolt II"
 CAP_cas_stealth_equipment_1_short:0 "A-10C Thunderbolt II"
 CAP_cas_stealth_equipment_1_desc:0 "La variante C de l'A-10 « Thunderbolt II » a été développée en 2005 dans le cadre du programme de modernisation Precision Engagement. Tirant parti des enseignements tirés du prototype YA-10B, l'A-10C est équipé d'un système de contrôle de tir modernisé, d'une suite ECM et de capacités de ciblage de bombes intelligentes. Le module d'identification ami-ennemi et la suite de communications ont également été mis à jour et modernisés. En partie grâce à ses performances récentes et à la pression politique, l'A-10 devrait continuer à servir dans le cadre des opérations de combat de l'armée de l'air américaine dans un avenir proche."
 CAP_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 CAP_mr_stealth_fighter_equipment_1_short:0 "F-35A Lightning II"
 CAP_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnels (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le programme F-35 a débuté en 1992, la variante A ayant pris son envol fin 2006 et largué ses premières bombes moins de six ans plus tard. La variante A est la plus petite et la plus légère des variantes du F-35. Elle est principalement destinée à remplacer le F-16 Fighting Falcon."
 CAP_jet_multirole_equipment_1:0 "Lockheed F-80A Shooting Star"
 CAP_jet_multirole_equipment_1_short:0 "F-80A Shooting Star"
 CAP_jet_multirole_equipment_1_desc:0 "Le premier avion de chasse à réaction utilisé par l'armée de l'air américaine (qui deviendra plus tard l'US Air Force). Il fut le premier et le seul avion à réaction américain opérationnel pendant les derniers jours de la Seconde Guerre mondiale. Ce modèle marqua le début de l'ère des avions à réaction aux États-Unis, car sa conception à ailes droites fut largement utilisée comme chasseur de jour et chasseur-bombardier pendant la guerre de Corée sous le nom de F-80. Surnommé « Shooting Star » (étoile filante), le F-80 représenta le premier sommet de l'aviation américaine."
 CAP_jet_multirole_equipment_2:0 "North American F-86A Sabre"
 CAP_jet_multirole_equipment_2_short:0 "F-86A Sabre"
 CAP_jet_multirole_equipment_2_desc:0 "Le F-86 est un avion de chasse à réaction à ailes en flèche développé et mis en service à la fin des années 1940 à partir des recherches capturées par les Allemands. La conception de cet avion lui permettait d'atteindre des vitesses transsoniques et une grande maniabilité, des caractéristiques qui lui permettaient de rivaliser avec son célèbre concurrent, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, avec ses variantes canadiennes et australiennes, est l'avion de chasse occidental le plus produit de l'histoire de l'aviation."
 CAP_jet_multirole_equipment_3:0 "North American F-86F Sabre"
 CAP_jet_multirole_equipment_3_short:0 "F-86F Sabre"
 CAP_jet_multirole_equipment_3_desc:0 "Système de contrôle de vol amélioré et « queue entièrement volante » (ce système a été remplacé par un système de contrôle entièrement motorisé avec une « sensation artificielle » intégrée aux commandes de l'avion afin de fournir au pilote des forces sur le manche qui restaient conventionnelles, mais suffisamment légères pour permettre un contrôle supérieur en combat). Les Sabre F présentaient une agilité à grande vitesse nettement améliorée, associée à une vitesse d'atterrissage plus élevée, supérieure à 233 km/h."
 CAP_jet_multirole_equipment_4:0 "North American F-100 Super Sabre"
 CAP_jet_multirole_equipment_4_short:0 "F-100 Super Sabre"
 CAP_jet_multirole_equipment_4_desc:0 "Premier avion de chasse capable d'atteindre une vitesse supersonique en vol horizontal, le F-100 était un avion multirôle performant conçu pour affronter l'ennemi en combat aérien. Développé à partir du F-86 Sabre, le F-100 allait adopter le surnom de « Super Sabre », mais reçut également celui de « Hun » en raison de sa désignation au sein de l'USAF à l'époque. Ce type d'appareil servit au Vietnam comme chasseur-bombardier et fut le premier à être utilisé dans le cadre de la suppression des défenses aériennes ennemies, sous le nom célèbre de Wild Weasel."
 CAP_jet_multirole_equipment_5:0 "McDonnell Douglas F-4C Phantom II"
 CAP_jet_multirole_equipment_5_short:0 "F-4C Phantom II"
 CAP_jet_multirole_equipment_5_desc:0 "Le programme F-4 est l'un des projets d'avion de chasse les plus réussis à ce jour. Il a connu un tel succès que l'armée de l'air américaine a choisi de l'utiliser pour remplacer le F-106 Delta Dart. Chasseur tactique biplace tout temps, version d'attaque au sol pour l'armée de l'air américaine ; compatible avec une large gamme d'armes, notamment les missiles AIM-4 Falcon, AGM-12 Bullpup et les armes nucléaires ; pneus de roue principale plus larges donnant lieu à des renflements distinctifs au niveau des ailes ; moteurs J79-GE-15 avec dispositif de démarrage à cartouche ; ravitaillement en vol par perche au lieu du ravitaillement par sonde et drogue de la marine ; radar AN/APQ-100 ; commandes de vol en double dans le cockpit arrière."
 CAP_jet_multirole_equipment_6:0 "McDonnell Douglas F-4D Phantom II"
 CAP_jet_multirole_equipment_6_short:0 "F-4D Phantom II"
 CAP_jet_multirole_equipment_6_desc:0 "F-4C équipé d'une avionique modernisée et d'un radar AN/APQ-109."
 CAP_jet_multirole_equipment_7:0 "McDonnell Douglas F-4E Phantom II"
 CAP_jet_multirole_equipment_7_short:0 "F-4E Phantom II"
 CAP_jet_multirole_equipment_7_desc:0 "Version USAF avec un canon M61 Vulcan intégré dans le nez allongé du RF-4C, un radar AN/APQ-120 avec une section transversale plus petite pour accueillir le canon, des moteurs J79-GE-17 avec une poussée de 17 900 lbf (79,379 kN) chacun en postcombustion. Les avions de la dernière série étaient équipés de volets de bord d'attaque pour améliorer la maniabilité au détriment de la vitesse maximale dans le cadre du programme Agile Eagle. À partir du bloc 53, les avions ont été équipés de la capacité AGM-65 Maverick et de moteurs J79-GE-17C ou -17E sans fumée. Premier vol le 1er août 1965. La variante Phantom la plus nombreuse ; 1 370 exemplaires construits."
 CAP_jet_multirole_equipment_8:0 "General Dynamics F-16A Fighting Falcon"
 CAP_jet_multirole_equipment_8_short:0 "F-16A Fighting Falcon"
 CAP_jet_multirole_equipment_8_desc:0 "Un chasseur maniable et léger, offrant un équilibre parfait entre maniabilité et stabilité. Il est doté d'un fuselage monocoque exceptionnellement léger et aérodynamique, et bien qu'il s'agisse d'un avion monomoteur, il est équipé d'un moteur puissant. Surnommé le « Fighting Falcon », son coût relativement faible et sa puissance élevée expliquent pourquoi il a été adopté par les forces aériennes du monde entier. À ce jour, plus de 4 000 exemplaires de ce modèle à succès ont été fabriqués."
 CAP_jet_multirole_equipment_9:0 "General Dynamics F-16A Block 15 Fighting Falcon"
 CAP_jet_multirole_equipment_9_short:0 "F-16A Block 15"
 CAP_jet_multirole_equipment_9_desc:0 "Première modification majeure apportée au F-16, l'avion Block 15 était équipé de stabilisateurs horizontaux plus grands, de deux points d'emport supplémentaires au niveau de l'entrée d'air sous le nez, d'un nouveau radar et d'une capacité accrue pour les pylônes sous les ailes. Cette variante était également équipée d'une radio UHF (ultra haute fréquence) de dernière génération. Il s'agit de la variante la plus répandue parmi les modèles F-16."
 CAP_jet_multirole_equipment_10:0 "General Dynamics F-16C Block 25 Fighting Falcon"
 CAP_jet_multirole_equipment_10_short:0 "F-16C Block 25"
 CAP_jet_multirole_equipment_10_desc:0 "La première sous-variante du F-16C était équipée d'un nouveau radar, d'un système de contrôle de tir amélioré et de systèmes de données intégrés pour une meilleure capacité d'attaque nocturne. Lancée en 1984, la variante F-16C B25 a joué un rôle important pendant la guerre du Golfe Persique."
 CAP_jet_interceptor_equipment_1:0 "Lockheed F-94 Starfire"
 CAP_jet_interceptor_equipment_1_short:0 "F-94 Starfire"
 CAP_jet_interceptor_equipment_1_desc:0 "Développé à partir du F-80 Shooting Star, le F-94 a été conçu pour remplacer les chasseurs de nuit lourds à hélices F-61 Black Widow et F-82 Twin Mustang. Initialement équipé d'un armement à canon (quatre, puis huit mitrailleuses de 12,7 mm), son armement à canon a été remplacé par un système entièrement composé de roquettes, lancées depuis ses baies internes. Surnommé « Starfire », il allait devenir le premier intercepteur à réaction majeur de l'USAF dans son histoire."
 CAP_jet_interceptor_equipment_2:0 "North American F-86D Sabre Dog"
 CAP_jet_interceptor_equipment_2_short:0 "F-86D Sabre Dog"
 CAP_jet_interceptor_equipment_2_desc:0 "Conçu comme un intercepteur tout temps, le F-86D (initialement désigné F-95) reprenait les performances impressionnantes du F-86 Sabrejet et les améliorait en y ajoutant un radar (qui lui donnait son radôme distinctif), un fuselage plus long et un moteur à postcombustion plus puissant. Initialement équipé d'une baie de lancement interne pour intercepter les bombardiers, les versions ultérieures du « Sabre Dog » étaient équipées de canons."
 CAP_jet_interceptor_equipment_3:0 "Northrop F-89 Scorpion"
 CAP_jet_interceptor_equipment_3_short:0 "F-89 Scorpion"
 CAP_jet_interceptor_equipment_3_desc:0 "Le F-89 (initialement P-89) est un intercepteur tout temps conçu dès le départ pour remplir cette fonction lorsqu'il est entré en service en 1954. Initialement équipé d'un armement à canons, celui-ci a été progressivement remplacé dans la version de série par un armement à roquettes. Plus tard, le « Scorpion » a reçu un atout supplémentaire avec l'introduction d'un armement à missiles, devenant ainsi le premier avion à réaction à utiliser ce type d'armement."
 CAP_jet_interceptor_equipment_4:0 "Convair F-102A Delta Dagger"
 CAP_jet_interceptor_equipment_4_short:0 "F-102A Delta Dagger"
 CAP_jet_interceptor_equipment_4_desc:0 "Premier avion de chasse à réaction à ailes delta des États-Unis, le F-102 fut le premier avion de chasse supersonique utilisé par l'armée de l'air américaine, capable d'atteindre une vitesse de Mach 1. Conçu comme intercepteur et chasseur de bombardiers, il remplaça le F-89 Scorpion et était capable d'abattre les avions ennemis à l'aide de roquettes et de missiles embarqués dans sa soute interne, ce qui en fit le premier avion de chasse à présenter cette caractéristique. Le « Delta Dagger » servit pendant les premières périodes de la guerre du Vietnam comme avion d'escorte de bombardiers et d'attaque au sol."
 CAP_jet_interceptor_equipment_5:0 "McDonnell F-101B Voodoo"
 CAP_jet_interceptor_equipment_5_short:0 "F-101B Voodoo"
 CAP_jet_interceptor_equipment_5_desc:0 "Le F-101, introduit en 1957, était initialement conçu comme un bombardier d'escorte à longue portée ou un chasseur de pénétration pour le Strategic Air Command (SAC) de l'US Air Force. Cela allait changer lorsqu'il devint un chasseur-bombardier à capacité nucléaire pour le Tactical Air Command (TAC). Le « Voodoo » avait une grande autonomie. Depuis ses bases en Allemagne de l'Ouest, il pouvait frapper n'importe quel pays du Pacte de Varsovie et pénétrer directement jusqu'à 800 km à l'intérieur du territoire soviétique."
 CAP_jet_interceptor_equipment_6:0 "Convair F-106A Delta Dart"
 CAP_jet_interceptor_equipment_6_short:0 "F-106A Delta Dart"
 CAP_jet_interceptor_equipment_6_desc:0 "Le F-106 était une version améliorée du F-102 Delta Dagger. Lancé en 1959, le F-106, comme son prédécesseur, n'était pas équipé d'un canon embarqué et dépendait donc de missiles pour engager les bombardiers ennemis. Il était équipé du missile infrarouge AIM-4 et d'un AIM-26 à tête nucléaire. Surnommé « l'intercepteur ultime », le « Delta Dart » transportait ses armes dans une soute interne, une caractéristique qui ne fut reprise sur les avions de chasse qu'à partir de la 5e génération d'avions de chasse à réaction."
 CAP_jet_interceptor_equipment_7:0 "North American F-106A 'Six Shooter'"
 CAP_jet_interceptor_equipment_7_short:0 "F-106A 'Six Shooter'"
 CAP_jet_interceptor_equipment_7_desc:0 "Après son introduction, le F-106 a été progressivement mis à jour en service, avec une avionique améliorée, une aile modifiée présentant un cambrage conique notable, un système de recherche et de poursuite infrarouge, des réservoirs d'aile supersoniques profilés qui n'altéraient pratiquement pas les performances globales de l'avion, une meilleure instrumentation et des équipements tels qu'un réceptacle de ravitaillement en vol et un crochet d'appontage pour les atterrissages d'urgence. Le projet Six Shooter a ajouté un canon M61 Vulcan et un viseur optique."
 CAP_jet_interceptor_equipment_8:0 "McDonnell Douglas F-15A Eagle"
 CAP_jet_interceptor_equipment_8_short:0 "F-15A Eagle"
 CAP_jet_interceptor_equipment_8_desc:0 "Un chasseur avancé de supériorité aérienne équipé de points d'emport pour une multitude de systèmes d'armes et d'une avionique avancée capable de rivaliser avec les chasseurs ennemis les plus sophistiqués. Un chasseur tout temps à grande échelle. Bénéficiant d'une vitesse maximale phénoménale, même parmi les chasseurs, il dispose d'une grande quantité d'armement à bord. Baptisé « Eagle », il offre un niveau de stabilité tel qu'il détient le record de récupération après avoir perdu une aile au combat."
 CAP_jet_interceptor_equipment_9:0 "McDonnell Douglas F-15C Eagle"
 CAP_jet_interceptor_equipment_9_short:0 "F-15C Eagle"
 CAP_jet_interceptor_equipment_9_desc:0 "Version améliorée de la plate-forme F-15 tout temps et supérieure dans les airs, la variante « C » est équipée d'un radar perfectionné capable de suivre jusqu'à une douzaine d'avions ennemis à la fois, et d'engager simultanément la moitié d'entre eux. Ce modèle a été utilisé dans de nombreux pays en dehors des États-Unis, de l'Arabie saoudite à Israël, et est la variante la plus courante de l'« Eagle » en service, conservant son excellent palmarès en matière de victoires."
 CAP_high_mach_jet_interceptor_equipment_1:0 "Convair XF-92"
 CAP_high_mach_jet_interceptor_equipment_1_short:0 "XF-92"
 CAP_high_mach_jet_interceptor_equipment_1_desc:0 "Le XF-92 était un concept développé par Convair pour un intercepteur de défense ponctuelle à grande vitesse. Capable de dépasser Mach 1, il aurait pu rivaliser avec les bombardiers encore propulsés par des hélices qui auraient constitué ses proies à l'époque. Il s'agissait également de la première incursion de la société, et donc des États-Unis, dans la conception d'aile delta. Malgré son annulation, le XF-92 allait plus tard mener au développement du F-102 Delta Dagger et du F-106 Delta Dart."
 CAP_high_mach_jet_interceptor_equipment_2:0 "Lockheed F-104 Starfighter"
 CAP_high_mach_jet_interceptor_equipment_2_short:0 "F-104 Starfighter"
 CAP_high_mach_jet_interceptor_equipment_2_desc:0 "Le F-104 a été conçu pour répondre au souhait des pilotes de disposer d'un avion simple et compact offrant d'excellentes performances. Le résultat fut cet avion, l'un des premiers intercepteurs capables d'atteindre Mach 2 en service dans l'armée américaine. Le « Starfighter » établit de nombreux records de vitesse et d'altitude, mais fut entaché par des controverses politiques et une faible capacité de survie, ce qui lui valut un autre surnom, celui de « Widowmaker » (faiseur de veuves)."
 CAP_high_mach_jet_interceptor_equipment_3:0 "North American F-108 Rapier"
 CAP_high_mach_jet_interceptor_equipment_3_short:0 "F-108 Rapier"
 CAP_high_mach_jet_interceptor_equipment_3_desc:0 "Le F-108 est un intercepteur à grande vitesse et serait le premier avion de ce type à être équipé du missile à longue portée AIM-47 Falcon. Capable d'atteindre une vitesse de Mach 3, le « Rapier » serait le fer de lance des forces de dissuasion d'interception américaines jusqu'à l'introduction du F-12 Blackbird."
 CAP_high_mach_jet_interceptor_equipment_4:0 "Lockheed F-12B Blackbird"
 CAP_high_mach_jet_interceptor_equipment_4_short:0 "F-12B Blackbird"
 CAP_high_mach_jet_interceptor_equipment_4_desc:0 "Le F-12 est un avion intercepteur stratosphérique supersonique conçu pour intercepter relativement facilement les bombardiers volant à haute altitude ou à grande vitesse. L'appareil est équipé de trois missiles air-air à longue portée AIM-47 Falcon afin de pouvoir atteindre ses cibles avant que les bombardiers ennemis ne larguent leur charge. Son fuselage noir et ses capacités opérationnelles lui ont valu le surnom de « Blackbird » (merle noir). Ce modèle a ensuite donné naissance à l'avion de reconnaissance stratégique plus célèbre, le SR-71."
 CAP_jet_CAS_equipment_1:0 "Republic F-84E Thunderjet"
 CAP_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 CAP_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 CAP_jet_CAS_equipment_2:0 "Republic F-84G Thunderjet"
 CAP_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 CAP_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 CAP_jet_CAS_equipment_3:0 "Republic F-84G Thunderjet"
 CAP_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 CAP_jet_CAS_equipment_3_desc:0 "Développé à partir du F-84 Thunderjet précédent, le F-84F était une variante à ailes en flèche du chasseur-bombardier, conçue pour rapprocher ce type d'appareil des performances du très vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances au décollage, tout en offrant une stabilité et un contrôle médiocres. Ce modèle a été utilisé de manière limitée tout au long de sa carrière, qui s'est terminée en 1971. Son surnom est « Thunderstreak »."
 CAP_jet_CAS_equipment_4:0 "Republic F-105D Thunderchief"
 CAP_jet_CAS_equipment_4_short:0 "F-105D Thunderchief"
 CAP_jet_CAS_equipment_4_desc:0 "Utilisé exclusivement par l'armée de l'air américaine, le F-105 est un chasseur-bombardier supersonique à ailes en flèche, initialement conçu comme un avion d'attaque nucléaire. Au moment de son introduction en 1955, il était le plus grand avion de combat monomoteur et monoplace de l'histoire. Utilisé pendant la guerre du Vietnam comme principal avion d'attaque de l'USAF, il a effectué plus de 20 000 sorties, à la fois dans sa version monoplace d'attaque et dans sa version biplace de suppression des défenses aériennes ennemies. Conformément aux conventions de dénomination de Republic Aviation, son surnom est « Thunderchief »."
 CAP_jet_CAS_equipment_5:0 "Republic F-105D Thunderchief 'Look Alike'"
 CAP_jet_CAS_equipment_5_short:0 "F-105D 'Look Alike'"
 CAP_jet_CAS_equipment_5_desc:0 "Les améliorations apportées au Look Alike ont permis d'augmenter la capacité de l'avion de quatre à seize bombes conventionnelles de 750 livres (340 kg) sur les points d'ancrage sous les ailes et au centre du fuselage, et d'ajouter l'équipement nécessaire au lancement de missiles air-sol AGM-12 Bullpup."
 CAP_jet_CAS_equipment_6:0 "LTV A-7D Corsair II"
 CAP_jet_CAS_equipment_6_short:0 "A-7D Corsair II"
 CAP_jet_CAS_equipment_6_desc:0 "Version construite pour l'USAF, équipée d'un turboréacteur Allison TF41-A-1 et d'un canon rotatif M61 Vulcan de 20 mm ; le radar de navigation AN/APN-153 des modèles précédents est remplacé par le radar de navigation AN/APN-185, et le radar de suivi de terrain AN/APQ-116 des A-7B/C précédents est remplacé par le radar de suivi de terrain AN/APQ-126."
 CAP_jet_CAS_equipment_7:0 "Fairchild Republic A-10A Thunderbolt II"
 CAP_jet_CAS_equipment_7_short:0 "A-10A Thunderbolt II"
 CAP_jet_CAS_equipment_7_desc:0 "Un attaquant lourdement armé qui offre un soutien au sol à courte portée grâce à une puissance de feu et une endurance écrasantes. Doté d'un large choix d'armes, notamment des mitrailleuses de 30 mm, des bombes et des roquettes, il offre d'excellentes capacités d'attaque air-sol. Très stable à basse vitesse, il est spécialisé dans le nettoyage prolongé et précis du sol en une seule approche d'attaque. Connu sous le nom de « Thunderbolt II » (d'après le P-47 Thunderbolt), il se caractérise par une aile droite résistante à basse vitesse, et son moteur placé en hauteur et son blindage renforcé le protègent contre les contre-attaques au sol."
 CAP_jet_CAS_equipment_8:0 "Fairchild Republic A-10A Thunderbolt II 'LASTE'"
 CAP_jet_CAS_equipment_8_short:0 "A-10A Thunderbolt II 'LASTE'"
 CAP_jet_CAS_equipment_8_desc:0 "Au début de sa carrière, l'A-10 a commencé à bénéficier de la mise à niveau LASTE (Low-Altitude Safety and Targeting Enhancement), qui comprenait un équipement informatisé de visée des armes, un pilote automatique et un système d'alerte de collision au sol. Le système LASTE a ensuite été amélioré avec un ordinateur intégré de contrôle de vol et de tir."
 CAP_jet_light_equipment_1:0 "Lockheed T-33 Shooting Star"
 CAP_jet_light_equipment_1_short:0 "T-33 Shooting Star"
 CAP_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80, d'abord sous le nom de TP-80C/TF-80C, puis sous celui de T-33A."
 CAP_jet_light_equipment_2:0 "North American FJ-2 Fury"
 CAP_jet_light_equipment_2_short:0 "FJ-2 Fury"
 CAP_jet_light_equipment_2_desc:0 "Les FJ-2 et FJ-3 Fury nord-américains sont une série de chasseurs à ailes en flèche aptes au transport pour la marine et le corps des Marines des États-Unis. Le FJ-2 est le résultat d'un effort visant à adapter le F-86 Sabre de l'armée de l'air américaine à la marine. Ces avions sont équipés d'ailes repliables et d'un train d'atterrissage avant plus long, conçu pour augmenter l'angle d'attaque au décollage et pour accueillir un amortisseur plus long afin d'absorber le choc des atterrissages brutaux sur le pont d'un porte-avions."
 CAP_jet_light_equipment_3:0 "Northtrop F-5A Freedom Fighter"
 CAP_jet_light_equipment_3_short:0 "F-5A Freedom Fighter"
 CAP_jet_light_equipment_3_desc:0 "Le F-5A a été développé comme un avion de chasse léger destiné principalement à l'exportation. Il est plus léger et moins coûteux à produire que la plupart des autres chasseurs modernes, ce qui le rend idéal pour compléter les escadrons de chasseurs à courte portée. Malgré cela, ce modèle s'est révélé très maniable et était l'avion le plus à même de rivaliser avec le MiG-21 « Fishbed » soviétique. Comme il était utilisé par la majorité des alliés des États-Unis au plus fort de la guerre froide, il a été baptisé à juste titre « Freedom Fighter » (combattant de la liberté)."
 CAP_jet_light_equipment_4:0 "North American Rockwell OV-10A Bronco"
 CAP_jet_light_equipment_4_short:0 "OV-10A Bronco"
 CAP_jet_light_equipment_4_desc:0 "Le North American Rockwell OV-10 Bronco est un avion d'attaque légère et d'observation américain à deux turbopropulseurs. Il a été développé dans les années 1960 comme avion spécial pour la lutte anti-insurrectionnelle (COIN) et l'une de ses principales missions était d'assurer le contrôle aérien avancé (FAC). Il peut transporter jusqu'à 3 200 livres de munitions externes, des charges internes telles que des parachutistes ou des civières, et rester en vol pendant trois heures ou plus."
 CAP_jet_light_equipment_5:0 "North American Rockwell OV-10D Bronco"
 CAP_jet_light_equipment_5_short:0 "OV-10D Bronco"
 CAP_jet_light_equipment_5_desc:0 "Bronco de deuxième génération développé dans le cadre du programme NOGS. Le modèle D était une cellule OV-10A largement modifiée, à laquelle avait été ajouté un système de vision nocturne infrarouge orienté vers l'avant avec une caméra montée sur une tourelle sous un nez allongé, visuellement distinct du nez court et arrondi du modèle A. Le modèle D est également équipé de moteurs plus puissants et d'hélices en fibre de verre plus grandes. D'autres différences externes notables sont les lance-paillettes installés à mi-hauteur des poutres et les tuyaux d'échappement à suppression infrarouge (qui mélangent les gaz d'échappement avec de l'air plus froid afin de réduire la signature thermique de l'avion)."
 CAP_nav_bomber_equipment_4:0 "Lockheed P2V-2 Neptune"
 CAP_nav_bomber_equipment_4_short:0 "P2V-2 Neptune"
 CAP_nav_bomber_equipment_4_desc:0 "Le P2V était un avion de patrouille maritime et anti-sous-marin développé pour remplacer les PV-1 Ventura et PV-2 Harpoon de la Seconde Guerre mondiale. Introduit en 1947 pour la marine américaine, il s'agissait en fait d'un avion basé à terre, et le P2V, rebaptisé P-2 après 1962, n'a jamais effectué d'appontage. Cependant, un petit nombre d'entre eux ont été convertis et déployés à partir de porte-avions comme bombardiers nucléaires de fortune qui devaient atterrir sur la côte ou amerrir, à l'instar des bombardiers utilisés lors du raid de Doolittle pendant la Seconde Guerre mondiale. Son surnom est « Neptune », d'après le dieu romain de la mer."
 CAP_nav_bomber_equipment_5:0 "Lockheed P2V-7 Neptune"
 CAP_nav_bomber_equipment_5_short:0 "P2V-7 Neptune"
 CAP_nav_bomber_equipment_5_desc:0 "Dernière variante Neptune produite par Lockheed, équipée de moteurs R-3350-32W et J-34. Elle était équipée de réservoirs d'extrémité d'aile à faible traînée, d'un radar de recherche AN/APS-20 dans un radôme révisé et d'une verrière bombée. Les premiers appareils étaient équipés de tourelles défensives, mais celles-ci ont été supprimées comme sur le P2V-5."
 CAP_nav_bomber_equipment_6:0 "Lockheed P-3 Orion"
 CAP_nav_bomber_equipment_6_short:0 "P-3A Orion"
 CAP_nav_bomber_equipment_6_desc:0 "Le P-3A (initialement désigné P3V), basé sur l'avion de ligne Lockheed L-188 Electra, a été conçu pour remplacer les anciens P-2 Neptune et P-5 Marlin dans le cadre de missions de patrouille maritime et de lutte anti-sous-marine (ASW) à partir de la terre ferme. Il dispose d'une soute interne pour les torpilles lancées depuis les airs, avec des pylônes sous les ailes pouvant accueillir une multitude d'armes, notamment des missiles antinavires à longue portée, des missiles air-sol, des mines et des grenades sous-marines. Il est également équipé d'un détecteur d'anomalies magnétiques à l'arrière pour détecter les sous-marins à l'aide du champ magnétique terrestre. Avec de tels outils à sa disposition et continuant à remplir son rôle depuis son introduction en 1962, il est tout à fait approprié que cet avion soit surnommé « Orion », le chasseur de navires ennemis."
 CAP_nav_bomber_equipment_7:0 "Lockheed P-3C Orion"
 CAP_nav_bomber_equipment_7_short:0 "P-3C Orion"
 CAP_nav_bomber_equipment_7_desc:0 "Le P-3C était équipé d'une nouvelle suite ASW et d'un ordinateur de mission avec une configuration interne révisée. À l'extérieur, le P-3C était doté d'une échelle d'accès à commande électrique, d'une petite antenne sur le sommet de l'aileron, de rampes de largage de bouées acoustiques sous le fuselage et de trois petites fenêtres à l'arrière droit (une fenêtre à l'avant de la sortie de secours au-dessus de l'aile et deux à l'arrière). Les premiers appareils produits étaient équipés d'une caméra située dans la partie inférieure du radôme. Les appareils produits ultérieurement étaient équipés d'une tourelle IRDS rétractable à la place de la caméra frontale. Au début des années 1980, les caméras frontales existantes ont été remplacées par des tourelles IRDS. Les premiers modèles étaient également connus sous le nom de P-3C « Baseline » ou Non-Update (NUD). Tous les appareils ont ensuite été équipés de deux systèmes de navigation inertielle LTN-72."
 CAP_nav_bomber_equipment_8:0 "Boeing P-8 Poseidon"
 CAP_nav_bomber_equipment_8_short:0 "P-8 Poseidon"
 CAP_nav_bomber_equipment_8_desc:0 "Initialement connu sous le nom de Multimission Maritime Aircraft (MMA), le P-8 a été conçu pour remplacer le vénérable P-3 Orion. Développé à partir du Boeing 737 Next Generation Airliner, le P-8 a été conçu pour la lutte anti-sous-marine et la patrouille maritime. De plus, il peut assurer le soutien électronique (ESM) grâce à sa capacité d'autoprotection et d'alerte précoce (EWSP). Avec des variantes en service aux États-Unis, au Royaume-Uni, en Inde et en Australie depuis son introduction en 2013, le « Poséidon » est en passe de devenir le nouveau roi des mers."
 CAP_cv_nav_bomber_equipment_4:0 "Martin AM Mauler"
 CAP_cv_nav_bomber_equipment_4_short:0 "AM Mauler"
 CAP_cv_nav_bomber_equipment_4_desc:0 "Initialement désigné sous le nom de BTM, l'AM était un bombardier torpilleur monoplace, le premier du genre dans l'histoire de l'aviation. Le Mauler était plus rapide et plus léger que les bombardiers de l'époque et ne nécessitait qu'un tiers de l'équipage d'un torpilleur classique de l'époque. Avec une charge de bombes de plus de 10 500 livres (4 800 kg), il pouvait transporter plus de munitions que bon nombre de ses prédécesseurs et de ses contemporains. Cependant, l'AM, surnommé le « Mauler », était probablement trop stable, étant décrit comme « lourd à manœuvrer » et difficile à faire atterrir sur un porte-avions. En conséquence, il n'a eu qu'une courte carrière en service, opérant sur des unités de première ligne dans l'Atlantique pendant deux ans avant d'être remplacé par l'AD-1 Skyraider."
 CAP_cv_nav_bomber_equipment_5:0 "Grumman AF Guardian"
 CAP_cv_nav_bomber_equipment_5_short:0 "AF Guardian"
 CAP_cv_nav_bomber_equipment_5_desc:0 "L'AF « Guardian » (initialement désigné TB3F) est le premier avion spécialement conçu pour la lutte anti-sous-marine à entrer en service dans la marine américaine. Comme il avait été initialement conçu comme un bombardier torpilleur et que son châssis ne pouvait donc pas accueillir tout son équipement ASW, deux variantes ont été développées : l'AF-2W, équipé d'un radar de recherche, et l'AF-2S, qui transportait diverses armes telles que des torpilles, des grenades sous-marines, des bombes ou des roquettes."
 CAP_cv_nav_bomber_equipment_6:0 "Grumman S-2 Tracker"
 CAP_cv_nav_bomber_equipment_6_short:0 "S-2 Tracker"
 CAP_cv_nav_bomber_equipment_6_desc:0 "Le S-2 (anciennement S2J) a tiré les enseignements du Guardian pour les appliquer à un appareil monocoque équipé de deux turbopropulseurs et d'ailes repliables. Lancé en 1952, le « Tracker », ainsi que sa variante de guerre électronique, l'E-1 Tracer, et son modèle de transport, le C-1 Trader, ont servi dans la Marine américaine jusque dans les années 1970 et 1980."
 CAP_cv_nav_bomber_equipment_7:0 "Lockheed S-3 Viking"
 CAP_cv_nav_bomber_equipment_7_short:0 "S-3 Viking"
 CAP_cv_nav_bomber_equipment_7_desc:0 "Le S-3 a succédé et remplacé le S-2 Tracker dans le domaine de la lutte anti-sous-marine. Entré en service en 1974, ce modèle a été l'un des premiers à offrir un niveau d'intégration des systèmes plus élevé, que l'on ne retrouvait ni chez son prédécesseur, ni chez le P-3 Orion basé à terre. De ce fait, l'appareil pouvait fonctionner avec un équipage de quatre personnes, contre douze pour l'Orion. De plus, il fut l'un des premiers appareils à utiliser un groupe auxiliaire de puissance, ce qui lui permettait de démarrer sans assistance particulière. Surnommé le « Viking », le S-3 a constitué un pilier de la lutte anti-surface à partir de porte-avions pendant toute la durée de son service."
 CAP_cv_nav_bomber_equipment_8:0 "Boeing F/A-18F Super Hornet"
 CAP_cv_nav_bomber_equipment_8_short:0 "F/A-18F Super Hornet"
 CAP_cv_nav_bomber_equipment_8_desc:0 "Un chasseur polyvalent embarqué capable d'apporter un soutien aux avions, aux forces terrestres et aux navires. Doté d'une meilleure maniabilité à vitesse moyenne que les chasseurs à grande vitesse, il s'avère efficace lors des raids aériens. Surnommé « Super Hornet », cet appareil est une version améliorée du F-Type."
 CAP_jet_tac_bomber_equipment_1:0 "North American B-45 Tornado"
 CAP_jet_tac_bomber_equipment_1_short:0 "B-45 Tornado"
 CAP_jet_tac_bomber_equipment_1_desc:0 "Premier bombardier à réaction opérationnel de l'USAF, le « Tornado » est un bombardier à réaction de taille moyenne capable d'assurer le soutien du champ de bataille ainsi que la reconnaissance à longue portée. Il a joué un rôle important dans la dissuasion nucléaire américaine pendant plusieurs années avant d'être remplacé par le B-47 Stratojet."
 CAP_jet_tac_bomber_equipment_2:0 "Martin B-57 Canberra"
 CAP_jet_tac_bomber_equipment_2_short:0 "B-57 Canberra"
 CAP_jet_tac_bomber_equipment_2_desc:0 "Le « Canberra » est une version américaine du bombardier anglais du même nom. Il est idéal pour les frappes tactiques et la reconnaissance. Son retrait dans les années 1980 marquera la fin de l'ère des bombardiers tactiques."
 CAP_jet_tac_bomber_equipment_3:0 "Douglas B-66 Destroyer"
 CAP_jet_tac_bomber_equipment_3_short:0 "B-66 Destroyer"
 CAP_jet_tac_bomber_equipment_3_desc:0 "Basé sur l'A-3 Skywarrior de la marine américaine, le « Destroyer » servait d'avion bombardier léger en remplacement de l'A-26 Invader. Parmi les changements apportés par rapport à son homologue de la marine, on note l'ajout de sièges éjectables. Tout comme son homologue de la marine, il servait également à des fins de reconnaissance et de guerre électronique."
 CAP_jet_tac_bomber_equipment_4:0 "General Dynamics F-111A Aardvark"
 CAP_jet_tac_bomber_equipment_4_short:0 "F-111A Aardvark"
 CAP_jet_tac_bomber_equipment_4_desc:0 "L'« Aardvark » est un avion d'interception supersonique équipé d'un radar à balayage du sol, de turboréacteurs à postcombustion avancés et d'ailes à flèche variable. Cela lui permet d'effectuer des frappes à grande vitesse et à basse altitude en profondeur dans le territoire ennemi."
 CAP_jet_tac_bomber_equipment_5:0 "General Dynamics F-111E Aardvark"
 CAP_jet_tac_bomber_equipment_5_short:0 "F-111E Aardvark"
 CAP_jet_tac_bomber_equipment_5_desc:0 "Conçue comme une solution provisoire pour le F-111D, la variante E est la dernière mise à niveau de la plate-forme « Aardvark » et comprend des entrées d'air avancées et une suite avionique améliorée."
 CAP_jet_tac_bomber_equipment_6:0 "General Dynamics F-111F Aardvark"
 CAP_jet_tac_bomber_equipment_6_short:0 "F-111F Aardvark"
 CAP_jet_tac_bomber_equipment_6_desc:0 "Considérée comme la variante ultime de l'« Aardvark », la variante F bénéficie d'améliorations au niveau des prises d'air et de l'avionique, ainsi que d'une technologie FLIR et de désignation laser avancée et d'un dôme radar moins coûteux. Ces ajouts ont permis à l'avion d'utiliser des munitions à guidage de précision."
 CAP_jet_tac_bomber_equipment_7:0 "McDonnell Douglas F-15E Strike Eagle"
 CAP_jet_tac_bomber_equipment_7_short:0 "F-15E Strike Eagle"
 CAP_jet_tac_bomber_equipment_7_desc:0 "Un chasseur-bombardier doté des capacités de combat aérien du F-15C et de capacités air-sol supplémentaires. Pouvant être équipé d'une large gamme d'armements, notamment des missiles antiaériens, des missiles d'attaque au sol, des missiles à verrouillage multiple et des bombes aériennes, il est capable de faire face à diverses situations. Surnommé « Strike Eagle », son apparence extérieure est presque identique à celle du F-15C, mais il offre diverses améliorations en matière d'attaque au sol."
 CAP_jet_tac_bomber_equipment_8:0 "Boeing F-15E Advanced Eagle"
 CAP_jet_tac_bomber_equipment_8_short:0 "F-15E Advanced Eagle"
 CAP_jet_tac_bomber_equipment_8_desc:0 "La variante F-15 Advanced Eagle est une version améliorée des modèles précédents, dans la mesure où elle dispose de deux points d'emport supplémentaires sous les ailes (portant leur nombre de neuf à onze) ; d'un cockpit avec écran grand format en option ; de commandes de vol électriques ; d'un radar à balayage électronique actif (AESA) Raytheon AN/APG-82(V)1 ou AN/APG-63(V)3 ; des moteurs General Electric F110-129 ; des systèmes numériques de guidage montés sur casque dans les deux cockpits ; et un système numérique de guerre électronique, entre autres améliorations."
 CAP_jet_strat_bomber_equipment_1:0 "Convair B-36 Peacemaker"
 CAP_jet_strat_bomber_equipment_1_short:0 "B-36 Peacemaker"
 CAP_jet_strat_bomber_equipment_1_desc:0 "Le B-36 était le plus gros bombardier à hélices jamais mis en service lorsqu'il a été lancé en 1948. Sa taille imposante lui permettait, sans modification du châssis ou des bombes, de transporter n'importe quelle bombe nucléaire dont disposaient les États-Unis à l'époque. Cependant, l'avènement des avions à réaction dans la guerre signifiait que ce type d'appareil serait rapidement remplacé par les B-47 et B-52. Contrairement à l'opinion populaire, le B-36 n'a pas de surnom officiel, mais la société et bon nombre de ses pilotes qui appréciaient ce type d'appareil l'appelaient « Peacemaker » (faiseur de paix)."
 CAP_jet_strat_bomber_equipment_2:0 "Boeing B-47 Stratojet"
 CAP_jet_strat_bomber_equipment_2_short:0 "B-47 Stratojet"
 CAP_jet_strat_bomber_equipment_2_desc:0 "Le B-47, baptisé « Stratojet », est un bombardier subsonique à six moteurs qui vole à haute altitude pour éviter les intercepteurs ennemis. Avec ses moteurs logés dans des nacelles sous ses ailes en flèche, le B-47 a constitué une innovation majeure dans la conception des avions de combat à réaction après la Seconde Guerre mondiale et a contribué au développement des avions de ligne à réaction modernes."
 CAP_jet_strat_bomber_equipment_3:0 "Boeing B-52D Stratofortress"
 CAP_jet_strat_bomber_equipment_3_short:0 "B-52D Stratofortress"
 CAP_jet_strat_bomber_equipment_3_desc:0 "Le B-52 est un gros bombardier subsonique à longue portée capable d'effectuer de longues missions au-dessus du territoire ennemi. Grâce à ses performances supérieures à des vitesses subsoniques élevées et à ses coûts d'exploitation relativement faibles, le « Stratofortress » est resté en service malgré l'arrivée d'avions plus récents et plus perfectionnés."
 CAP_jet_strat_bomber_equipment_4:0 "Boeing B-52G Stratofortress"
 CAP_jet_strat_bomber_equipment_4_short:0 "B-52G Stratofortress"
 CAP_jet_strat_bomber_equipment_4_desc:0 "La variante G du B-52 dispose d'un système électronique et avionique amélioré, ainsi que d'une charge utile plus importante. Cette variante offre également une plus grande autonomie grâce à une refonte de la structure permettant d'augmenter la capacité en carburant. Grâce à cette modification et à d'autres améliorations, le « Stratofortress » continuera à servir de plate-forme de bombardement de premier plan jusqu'en 2050."
 CAP_jet_strat_bomber_equipment_5:0 "Boeing B-52H"
 CAP_jet_strat_bomber_equipment_5_short:0 "B-52H Stratofortress"
 CAP_jet_strat_bomber_equipment_5_desc:0 "Le B-52H a subi les mêmes modifications structurelles et d'équipage que le B-52G. La mise à niveau la plus importante a été le passage aux turboréacteurs TF33-P-3 qui, malgré des problèmes de fiabilité initiaux (corrigés en 1964 dans le cadre du programme Hot Fan), offraient des performances et une économie de carburant nettement supérieures à celles des turboréacteurs J57. L'ECM et l'avionique ont été mis à jour, un nouveau système de contrôle de tir a été installé et l'armement défensif arrière est passé de mitrailleuses à un canon M61 Vulcan de 20 mm."
 CAP_mach2stratbomber_equipment_1:0 "Convair B-58 Hustler"
 CAP_mach2stratbomber_equipment_1_short:0 "B-58 Hustler"
 CAP_mach2stratbomber_equipment_1_desc:0 "Le Hustler est un bombardier supersonique à ailes delta. Bien qu'il ne puisse rivaliser avec la charge utile des bombardiers plus gros, il compense cela par sa vitesse pure."
 CAP_mach2stratbomber_equipment_2:0 "Rockwell B-1A Lancer"
 CAP_mach2stratbomber_equipment_2_short:0 "B-1A Lancer"
 CAP_mach2stratbomber_equipment_2_desc:0 "Le B-1 a été imaginé pour la première fois dans les années 1960 comme une plateforme qui combinerait la vitesse Mach 2 du B-58 Hustler avec l'autonomie et la charge utile du B-52, et était destiné à remplacer à terme les deux bombardiers. Après une longue série d'études, Rockwell International (qui fait désormais partie de Boeing) remporta le concours de conception pour ce qui devint le B-1A. Cette version avait une vitesse maximale de Mach 2,2 à haute altitude et était capable de voler sur de longues distances à Mach 0,85 à très basse altitude."
 CAP_mach2stratbomber_equipment_3:0 "Rockwell B-1B Lancer"
 CAP_mach2stratbomber_equipment_3_short:0 "B-1B Lancer"
 CAP_mach2stratbomber_equipment_3_desc:0 "Bien que plus lent que le modèle A précédent, le B-1B « Lancer » disposait d'une plus grande capacité en carburant et pouvait transporter davantage de bombes en externe, en plus de sa soute interne. De plus, le B-1B était équipé d'un système de guerre électronique amélioré et avait été redessiné avec une section radar réduite, ce qui le rendait plus difficile à détecter, malgré sa vitesse réduite."
 CAP_mach3stratbomber_equipment_1:0 "North American B-70 Valkyrie"
 CAP_mach3stratbomber_equipment_1_short:0 "B-70 Valkyrie"
 CAP_mach3stratbomber_equipment_1_desc:0 "Le B-70 est un bombardier stratégique capable d'atteindre Mach 3, conçu pour des frappes nucléaires en profondeur. Conçu dans les années 1950, le B-70 était destiné à remplacer le B-52 et pouvait voler en supercroisière à Mach 3, une technique qui ne sera reproduite que près d'un demi-siècle plus tard avec le F-22. Surnommé « Valkyrie », le B-70 allait être le catalyseur des futurs bombardiers supersoniques."
 CAP_mach6stratbomber_equipment_1:0 "Lockheed Martin SR-72"
 CAP_mach6stratbomber_equipment_1_short:0 "SR-72"
 CAP_mach6stratbomber_equipment_1_desc:0 "Avion bombardier stratégique à grande vitesse, le SR-72 a été initialement conçu pour remplacer l'avion de reconnaissance stratégique SR-71 Blackbird. Contrairement au Blackbird, le SR-72 est extrêmement maniable pour un avion à grande vitesse et peut transporter un grand nombre de munitions."
 CAP_nuclearstratbomber_equipment_1:0 "Convair NB-36H Crusader"
 CAP_nuclearstratbomber_equipment_1_short:0 "NB-36H Crusader"
 CAP_nuclearstratbomber_equipment_1_desc:0 "Développé dans le cadre du programme Aircraft Nuclear Propulsion (ANP), le NB-36H fut le premier bombardier stratégique à propulsion nucléaire développé pour l'armée de l'air américaine. Les modifications apportées au B-36 Peacemaker comprenaient une nouvelle cabine de pilotage recouverte de plomb et de caoutchouc, ainsi que du verre au plomb pour éviter toute contamination des pilotes. L'avion était équipé d'un réacteur refroidi à l'air d'une puissance de 1 mégawatt, pesant 35 000 livres (16 000 kg), qui était suspendu à un crochet dans la soute à bombes centrale pour faciliter le chargement et le déchargement lorsqu'il n'était pas en vol. Malgré son annulation en 1961 pour des raisons de sécurité, le « Crusader » a permis à la NASA de mieux comprendre les méthodes de manipulation des métaux liquides et des sels fondus, contribuant ainsi au développement de générateurs et de réacteurs nucléaires."
 CAP_nuclearstratbomber_equipment_2:0 "Convair WS-125"
 CAP_nuclearstratbomber_equipment_2_short:0 "WS-125"
 CAP_nuclearstratbomber_equipment_2_desc:0 "Désignation interne d'un bombardier stratégique nucléaire à très longue portée (qui devait initialement porter le nom de B-72), le WS-125 est un projet hypothétique imaginé dans l'hypothèse où le programme ANP aurait été poursuivi. Selon certaines hypothèses, le WS-125/B-72 aurait été dérivé du Convair B-60, une version à réaction du B-36 qui avait perdu la compétition face au célèbre B-52 Stratofortress. Il devait être propulsé par quatre turboréacteurs à propulsion nucléaire et quatre turboréacteurs conventionnels destinés à fournir une puissance de secours."
 CAP_cv_jet_CAS_equipment_1:0 "Douglas AD-1 Skyraider"
 CAP_cv_jet_CAS_equipment_1_short:0 "AD-1 Skyraider"
 CAP_cv_jet_CAS_equipment_1_desc:0 "Le Douglas A-1 Skyraider (anciennement AD Skyraider) est un avion d'attaque monoplace américain qui a été utilisé entre la fin des années 1940 et le début des années 1980. Le Skyraider a connu une carrière remarquablement longue et fructueuse ; il est devenu un anachronisme à moteur à pistons et à hélice à l'ère des avions à réaction, et a été surnommé « Spad »."
 CAP_cv_jet_CAS_equipment_2:0 "Douglas AD-4 Skyraider"
 CAP_cv_jet_CAS_equipment_2_short:0 "AD-4 Skyraider"
 CAP_cv_jet_CAS_equipment_2_desc:0 "Train d'atterrissage renforcé, radar amélioré, compas G-2, équipement anti-G, quatre canons de 20 mm (0,79 pouce) et 14 lance-roquettes Aero, capable de transporter jusqu'à 50 lb (23 kg) de bombes."
 CAP_cv_jet_CAS_equipment_3:0 "Douglas A-3B Skywarrior"
 CAP_cv_jet_CAS_equipment_3_short:0 "A-3B Skywarrior"
 CAP_cv_jet_CAS_equipment_3_desc:0 "Version définitive du bombardier de série, avec une cellule plus robuste, des moteurs plus puissants, une surface alaire légèrement plus grande (75 m² contre 72 m²), et la possibilité d'installer un système de ravitaillement en vol pour le rôle de ravitailleur. Les 21 derniers exemplaires construits étaient équipés du nouveau système de bombardement AN/ASB-7, d'un nez redessiné et d'une tourelle arrière supprimée au profit d'un équipement de guerre électronique."
 CAP_cv_jet_CAS_equipment_4:0 "Douglas A-4B Skyhawk"
 CAP_cv_jet_CAS_equipment_4_short:0 "A-4B Skyhawk"
 CAP_cv_jet_CAS_equipment_4_desc:0 "L'A-4B est un avion d'attaque léger monomoteur capable de transporter la même charge de bombes qu'un B-17 malgré sa taille plus petite. Utilisé par plusieurs forces aériennes et aéronavales depuis son introduction en 1954, il a subi de nombreuses modifications et modernisations au cours de ses plus de 60 ans de service, et continue à être utilisé dans de nombreux pays à ce jour. Son surnom est « Skyhawk »."
 CAP_cv_jet_CAS_equipment_5:0 "Douglas A-4E Skyhawk"
 CAP_cv_jet_CAS_equipment_5_short:0 "A-4E Skyhawk"
 CAP_cv_jet_CAS_equipment_5_desc:0 "Mise à niveau majeure, comprenant un nouveau moteur Pratt &amp; Whitney J52-P-6A d'une poussée de 8 400 lbf (37 kN), une cellule renforcée avec deux pylônes d'armes supplémentaires (pour un total de cinq), une avionique améliorée, avec TACAN, radar de navigation Doppler, altimètre radar, ordinateur de bombardement en piqué et système de bombardement à basse altitude AJB-3A. Beaucoup ont ensuite été modernisés avec un moteur J52-P-8 développant une poussée de 9 300 lbf (41 kN)."
 CAP_cv_jet_CAS_equipment_6:0 "Grumman A-6A Intruder"
 CAP_cv_jet_CAS_equipment_6_short:0 "A-6A Intruder"
 CAP_cv_jet_CAS_equipment_6_desc:0 "Avion embarqué tout temps doté de systèmes électroniques très sophistiqués pour l'époque. Il a été développé dans le but de pouvoir voler à basse altitude en territoire ennemi et d'utiliser une sélection d'armes pour porter un coup fatal. Son surnom est « Intruder ». Il a également reçu divers autres surnoms en raison de sa partie avant large et de sa partie arrière effilée, notamment « Tadpole » (têtard) et « Dog Ship » (navire chien)."
 CAP_cv_jet_CAS_equipment_7:0 "LTV A-7 Corsair II"
 CAP_cv_jet_CAS_equipment_7_short:0 "A-7 Corsair II"
 CAP_cv_jet_CAS_equipment_7_desc:0 "Développé à partir du F-8 Crusader, le « Corsair II » (nommé d'après le F4U Corsair) est un avion d'attaque léger monoplace, subsonique et embarqué, doté d'une charge utile et d'une autonomie supérieures à celles de l'A-4 Skyhawk qu'il a remplacé. Il a ensuite été utilisé par l'armée de l'air américaine, remplaçant les vénérables A-1 Skyraider et F-100 Super Sabre, devenant ainsi l'un des rares avions d'attaque au sol à servir à la fois dans la marine et dans l'armée de l'air."
 CAP_cv_jet_CAS_equipment_8:0 "Grumman A-6E Intruder"
 CAP_cv_jet_CAS_equipment_8_short:0 "A-6E Intruder"
 CAP_cv_jet_CAS_equipment_8_desc:0 "La version d'attaque définitive de l'Intruder, dotée de systèmes de navigation et d'attaque considérablement améliorés. Les radars de recherche et de poursuite (contrôle de tir) séparés des A-6A/B/C ont été remplacés par un seul radar multimode Norden AN/APQ-148 et par des ordinateurs de bord dotés d'un système plus sophistiqué et plus fiable."
 CAP_cv_jet_CAS_equipment_9:0 "Grumman A-6E Intruder WCSI"
 CAP_cv_jet_CAS_equipment_9_short:0 "A-6E Intruder WCSI"
 CAP_cv_jet_CAS_equipment_9_desc:0 "Dans les années 1980, les avions A-6E Intruder ont été convertis en version A-6E WCSI (Weapons Control System Improvement) afin d'augmenter leur capacité d'armement. Cela leur a permis de transporter et de cibler certaines des armes guidées de précision de première génération, comme le missile AGM-84 Harpoon et l'AGM-123 Skipper. L'avion WCSI a finalement été modifié pour avoir une capacité limitée à utiliser le missile d'attaque terrestre à distance AGM-84E SLAM. Comme les missiles Harpoon et SLAM avaient des interfaces de communication communes, les avions WCSI pouvaient transporter et tirer des missiles SLAM, mais avaient besoin d'un A-6E SWIP à proximité pour les guider vers leur cible."
 CAP_cv_jet_CAS_equipment_10:0 "McDonnell Douglas F/A-18B Hornet"
 CAP_cv_jet_CAS_equipment_10_short:0 "F/A-18B Hornet"
 CAP_cv_jet_CAS_equipment_10_desc:0 "Développé à partir du prototype YF-17 Cobra de l'USAF, le « Hornet » fait partie d'une nouvelle génération d'avions polyvalents qui combinent les dernières avancées en matière de technologies informatiques avec une vitesse et une agilité élevées pour offrir des performances de combat inégalées. En raison du nombre limité d'avions qu'un porte-avions peut accueillir, le « Hornet » basé sur porte-avions a été conçu comme un avion multirôle capable d'effectuer des missions air-air et air-sol. Le B est une version biplace d'attaque au sol."
 CAP_cv_jet_multirole_equipment_1:0 "McDonnell Douglas F2H Banshee"
 CAP_cv_jet_multirole_equipment_1_short:0 "F2H Banshee"
 CAP_cv_jet_multirole_equipment_1_desc:0 "Le McDonnell F2H Banshee était un avion de chasse à réaction monoplace basé sur porte-avions, utilisé par la marine américaine et le corps des Marines des États-Unis de 1948 à 1961. Il fut l'un des principaux chasseurs américains utilisés pendant la guerre de Corée et le seul chasseur à réaction utilisé par la Marine royale canadienne."
 CAP_cv_jet_multirole_equipment_2:0 "Grumman F9F Panther"
 CAP_cv_jet_multirole_equipment_2_short:0 "F9F Panther"
 CAP_cv_jet_multirole_equipment_2_desc:0 "Le F9F a été initialement conçu comme un avion à réaction à ailes droites embarqué sur porte-avions, introduit en 1949. L'un des premiers avions à réaction embarqués utilisés par la marine américaine, il a été le principal avion d'attaque au sol de l'USN et de l'USMC pendant la guerre de Corée, effectuant 78 000 sorties, et a été crédité de la première victoire aérienne d'un chasseur de la marine américaine pendant la guerre. Sa structure robuste lui permettait de mener des opérations d'attaque au sol, même sous le feu antiaérien. Le F9F (rebaptisé plus tard F-9) a également servi dans les Blue Angels, devenant le premier avion à réaction utilisé par l'équipe. Conformément à la tradition de Grumman qui consiste à donner aux avions des noms de grands félins, cet avion est connu sous le nom de « Panther » (panthère)."
 CAP_cv_jet_multirole_equipment_3:0 "McDonnell F3H Demon"
 CAP_cv_jet_multirole_equipment_3_short:0 "F3H Demon"
 CAP_cv_jet_multirole_equipment_3_desc:0 "Le F3H était un chasseur subsonique à ailes en flèche qui a connu de nombreux problèmes tout au long de sa carrière. Initialement prévu pour être équipé du moteur J40, des problèmes liés à la conception du prototype ont conduit à l'annulation de ce moteur et le F3H a été équipé d'un moteur moins puissant à la place. Malgré ses problèmes, le Demon était un intercepteur tout temps performant, offrant une bonne visibilité pour l'époque. Initialement armé de quatre canons de 20 mm, un modèle ultérieur fut équipé des premiers exemplaires de ce qui allait devenir le missile infrarouge AIM-9 Sidewinder et le missile air-air semi-actif AAM-N-2 (plus tard AIM-7) Sparrow. Conformément aux conventions de dénomination de McDonnell, son surnom officiel est « Demon »."
 CAP_cv_jet_multirole_equipment_4:0 "Vought F-8 Crusader"
 CAP_cv_jet_multirole_equipment_4_short:0 "F-8 Crusader"
 CAP_cv_jet_multirole_equipment_4_desc:0 "Chasseur supersonique monomoteur destiné à assurer la supériorité aérienne, le F-8 (initialement connu sous le nom de F8U) a été conçu pour la défense aérienne rapprochée des flottes. Cet avion transporte une charge utile de munitions plus importante que le F11F Tiger ou le F7U Cutlass (qu'il a remplacé), et peut également servir de plate-forme de reconnaissance photographique rapide. Surnommé « Crusader », il était l'un des chasseurs de supériorité aérienne à conserver son armement interne au moment de la guerre du Vietnam, ce qui lui a valu un autre surnom, « The Last Gunfighter » (le dernier chasseur à armement)."
 CAP_cv_jet_multirole_equipment_5:0 "McDonnell Douglas F-4B Phantom II"
 CAP_cv_jet_multirole_equipment_5_short:0 "F-4B Phantom II"
 CAP_cv_jet_multirole_equipment_5_desc:0 "Avion de chasse et d'attaque au sol biplace, tout temps, embarqué, destiné à la Marine américaine et au Corps des Marines. Moteurs J79-GE-8A ou -8B développant chacun une poussée de 16 950 lbf (75,4 kN) avec postcombustion. Surnommé le « Phantom II » (et tirant son nom du FH Phantom), le F-4 Phantom II fut le premier avion utilisé en commun par les trois branches des forces armées américaines : la Marine, les Marines et l'Armée de l'air."
 CAP_cv_jet_multirole_equipment_6:0 "McDonnell Douglas F-4J Phantom II"
 CAP_cv_jet_multirole_equipment_6_short:0 "F-4J Phantom II"
 CAP_cv_jet_multirole_equipment_6_desc:0 "Version améliorée du F-4B pour l'US Navy et le Marine Corps, mettant l'accent sur l'amélioration des capacités de combat air-air, notamment : moteurs J79-GE-10 avec une poussée de 17 844 lbf (79,374 kN) chacun en postcombustion, radar Doppler à impulsions AN/APG-59 couplé au système de contrôle de tir AN/AWG-10 pour une capacité de tir vers le bas, des roues de train d'atterrissage principales plus grandes, entraînant des renflements des ailes similaires à ceux du F-4C, un empennage à volets, des ailerons inclinés à 16,5° lorsque le train d'atterrissage et les volets étaient déployés pour réduire la vitesse d'atterrissage, des sièges éjectables zéro-zéro, une capacité d'attaque au sol étendue, aucun capteur IRST sous le nez."
 CAP_cv_jet_multirole_equipment_7:0 "McDonnell Douglas F-4N Phantom II"
 CAP_cv_jet_multirole_equipment_7_short:0 "F-4N Phantom II"
 CAP_cv_jet_multirole_equipment_7_desc:0 "F-4B modernisé dans le cadre du projet Bee Line, mêmes améliorations aérodynamiques que le F-4J, moteurs sans fumée et cellule renforcée."
 CAP_cv_jet_multirole_equipment_8:0 "Grumman F-14A Tomcat"
 CAP_cv_jet_multirole_equipment_8_short:0 "F-14A Tomcat"
 CAP_cv_jet_multirole_equipment_8_desc:0 "Un grand chasseur embarqué destiné à remplacer le F-4 comme principal moyen de défense aérienne de la flotte. Il est équipé d'ailes variables qui peuvent changer d'angle automatiquement, même en vol, ce qui lui confère à la fois une grande vitesse à haute altitude et une grande maniabilité à basse altitude. Il est également équipé de missiles à longue portée capables d'abattre les ennemis à une distance considérable. Connu sous le nom de « Tomcat »."
 CAP_cv_jet_multirole_equipment_9:0 "Grumman F-14B Tomcat"
 CAP_cv_jet_multirole_equipment_9_short:0 "F-14B Tomcat"
 CAP_cv_jet_multirole_equipment_9_desc:0 "Une variante du chasseur F-14A embarqué, créée grâce à une mise à niveau majeure qui comprend le remplacement du moteur. Les principales améliorations comprennent la résolution des problèmes de moteur, l'augmentation de la propulsion et la révision de l'avionique. D'autres modifications ont été apportées dans les années 90 afin de prolonger la durée de vie de l'appareil et de lui conférer des capacités d'attaque air-sol supplémentaires. Ce F-14 modifié est également utilisé pour des attaques tactiques à grande vitesse et longue distance. Il est connu sous le nom de « Tomcat », tout comme le type A. Lorsqu'il est modifié pour le bombardement, le F-14 est également connu sous le nom officieux de « Bombcat »."
 CAP_cv_jet_multirole_equipment_10:0 "McDonnell Douglas F/A-18A Hornet"
 CAP_cv_jet_multirole_equipment_10_short:0 "F/A-18A Hornet"
 CAP_cv_jet_multirole_equipment_10_desc:0 "Développé à partir du prototype YF-17 Cobra de l'USAF, le « Hornet » fait partie d'une nouvelle génération d'avions polyvalents qui combinent les dernières avancées en matière de technologies informatiques avec une vitesse et une agilité élevées pour offrir des performances de combat inégalées. En raison du nombre limité d'avions qu'un porte-avions peut accueillir, le « Hornet » basé sur porte-avions a été conçu comme un avion multirôle capable d'effectuer des missions air-air et air-sol."
 CAP_stealth_tactical_bomber_equipment_1:0 "Lockheed F-117A Nighthawk"
 CAP_stealth_tactical_bomber_equipment_1_short:0 "F-117A Nighthawk"
 CAP_stealth_tactical_bomber_equipment_1_desc:0 "Le tout premier attaquant furtif, spécialisé dans les bombardements secrets. Comme sa conception est entièrement axée sur ses capacités furtives, cet avion manque de vitesse et de maniabilité. En revanche, le fait de rester hors de portée des radars ennemis lui permet d'utiliser des bombes guidées pour effectuer des frappes chirurgicales. Il présente une forme unique composée de surfaces planes et d'une peinture spéciale afin de réfléchir et d'absorber les ondes radar. Surnommé « Nighthawk », il s'est illustré pendant la guerre du Golfe de 1991 en effectuant plus de 1 200 sorties sans qu'aucun appareil ne soit abattu."
 CAP_stealth_tactical_bomber_equipment_2:0 "Lockheed Martin FB-22 Strike Raptor"
 CAP_stealth_tactical_bomber_equipment_2_short:0 "FB-22 Strike Raptor"
 CAP_stealth_tactical_bomber_equipment_2_desc:0 "Le Lockheed Martin FB-22 était un projet d'avion bombardier furtif destiné à entrer en service dans l'armée de l'air américaine. Sa conception était dérivée du F-22 Raptor. Le FB-22 a été annulé à la suite de la Quadrennial Defense Review (révision quadriennale de la défense) de 2006. Son rayon d'action a presque triplé, passant de 970 km à plus de 2 600 km, et aurait pu être encore augmenté grâce à des réservoirs de carburant externes. Cela plaçait l'avion dans la catégorie des bombardiers régionaux, comparable à celle du F-111."
 CAP_stealth_strategic_bomber_equipment_1:0 "Northrop Grumman B-2 Spirit"
 CAP_stealth_strategic_bomber_equipment_1_short:0 "B-2 Spirit"
 CAP_stealth_strategic_bomber_equipment_1_desc:0 "Un bombardier stratégique furtif capable de pénétrer en territoire ennemi sans être détecté par les radars et d'effectuer des raids de bombardement à grande échelle. Cet avion à aile volante n'a pas de queue, ce qui le rend plus difficile à détecter par les radars. Ses performances de manœuvre ont été sacrifiées au profit d'une furtivité accrue, ce qui lui permet de pénétrer plus sûrement les réseaux radar. Le nombre d'appareils fabriqués est extrêmement faible, c'est pourquoi chaque avion se voit attribuer un nom unique composé du surnom « Spirit » et du nom d'un territoire géographique."
 CAP_stealth_strategic_bomber_equipment_2:0 "Northrop Grumman B-21 Raider"
 CAP_stealth_strategic_bomber_equipment_2_short:0 "B-21 Raider"
 CAP_stealth_strategic_bomber_equipment_2_desc:0 "Développé à partir des enseignements tirés du B-2 Spirit, le B-21, qui fait partie du programme Long Range Strike Bomber (LRS-B), est destiné à être un bombardier stratégique furtif à très longue portée pour l'armée de l'air américaine, capable de transporter des armes conventionnelles ou thermonucléaires. Comme son prédécesseur, le « Raider » est un bombardier à aile volante, ce qui augmente ses performances de furtivité pour pénétrer plus sûrement les réseaux radar."
 CAP_stealth_fighter_equipment_1:0 "Lockheed Martin F-22A Raptor"
 CAP_stealth_fighter_equipment_1_short:0 "F-22A Raptor"
 CAP_stealth_fighter_equipment_1_desc:0 "Cet avion de combat furtif ultime fait la fierté des forces armées américaines. Outre ses performances de vol, il offre une accélération hors pair et dispose d'une tuyère à poussée bidimensionnelle qui lui confère une maniabilité exceptionnelle. Sa puissance de frappe préventive, baptisée « first look, first shoot, first kill » (premier regard, premier tir, première destruction), sied parfaitement à un avion portant le nom de « Raptor », le maître des cieux."
 CAP_cv_stealth_fighter_equipment_1:0 "Lockheed Martin F-22N Sea Raptor"
 CAP_cv_stealth_fighter_equipment_1_short:0 "F-22N Sea Raptor"
 CAP_cv_stealth_fighter_equipment_1_desc:0 "Baptisé « Sea Raptor », le F-22N est la variante embarquée du Raptor et possède bon nombre des capacités du F-22A basé à terre. Développé pour la marine américaine, le F-22N dispose d'une capacité de décollage court qui lui permet d'être utilisé pour des opérations embarquées. En plus d'être capable de larguer des munitions, ses missiles haute performance lui permettent d'attaquer au-delà de la portée des avions ennemis. Parfaitement adapté aux missions de combat aérien et à la défense aérienne de la flotte, le F-22N est un puissant chasseur préventif."
 CAP_jump_jet_equipment_1:0 "Hawker Siddeley AV-8A Harrier"
 CAP_jump_jet_equipment_1_short:0 "AV-8A Harrier"
 CAP_jump_jet_equipment_1_desc:0 "Cet avion d'attaque a été développé pour faire du VTOL (décollage et atterrissage verticaux) une réalité. Il présente une conception unique avec des ailes montées en hauteur et quatre tuyères rotatives. Cela lui permet d'opérer dans des espaces restreints tels que les porte-avions légers et les petits aérodromes. Cet avion est communément appelé « Harrier ». Développé en Grande-Bretagne, l'AV-8A est connu dans ce pays sous le nom de Harrier Mk. 50 et fonctionnait de manière similaire aux Harrier GR.1 de la Royal Air Force."
 CAP_jump_jet_equipment_2:0 "Hawker Siddeley AV-8C Harrier"
 CAP_jump_jet_equipment_2_short:0 "AV-8C Harrier"
 CAP_jump_jet_equipment_2_desc:0 "La variante « C » est une version améliorée de l'AV-8A et fonctionne avec des systèmes similaires à ceux du Harrier GR.3, avec un nouvel équipement ECM et un système de navigation inertielle."
 CAP_jump_jet_equipment_3:0 "McDonnell Douglas AV-8B Harrier II"
 CAP_jump_jet_equipment_3_short:0 "AV-8B Harrier II"
 CAP_jump_jet_equipment_3_desc:0 "Le Harrier II est un projet conjoint anglo-américain conçu par McDonnell Douglas en collaboration avec British Aerospace. En service dans le Corps des Marines des États-Unis depuis 1985, le « Harrier II » a été considéré comme un outil important dans de nombreux conflits américains récents."
 CAP_jump_jet_equipment_4:0 "McDonnell Douglas AV-8B Harrier II Plus"
 CAP_jump_jet_equipment_4_short:0 "AV-8B Harrier II Plus"
 CAP_jump_jet_equipment_4_desc:0 "Version améliorée de l'AV-8B, l'AV-8B Plus est équipé d'un moteur plus puissant, d'un système radar et d'une caméra infrarouge, ce qui en fait un excellent avion d'attaque nocturne."
 CAP_recon_equipment_0:0 "Stinson L-5 Sentinel"
 CAP_recon_equipment_0_short:0 "L-5 Sentinel"
 CAP_recon_equipment_0_desc:0 "Le Stinson L-5 Sentinel était un avion de liaison de la Seconde Guerre mondiale utilisé par toutes les branches de l'armée américaine et par la Royal Air Force britannique. Il était produit par la Stinson Aircraft Company. Avec le Stinson L-1 Vigilant, le L-5 était le seul autre avion de liaison américain de la Seconde Guerre mondiale spécialement conçu pour un usage militaire et qui n'avait pas d'équivalent civil. Tous les autres avions de liaison militaires adoptés pendant la Seconde Guerre mondiale étaient des modèles civils « prêts à l'emploi » légèrement modifiés."
 CAP_jet_recon_equipment_0:0 "North American RF-86 Sabre"
 CAP_jet_recon_equipment_0_short:0 "RF-86 Sabre"
 CAP_jet_recon_equipment_0_desc:0 "Conversions F-86 avec trois caméras pour la reconnaissance"
 CAP_jet_recon_equipment_1:0 "McDonnell Douglas RF-4C Phantom II"
 CAP_jet_recon_equipment_1_short:0 "RF-4C Phantom II"
 CAP_jet_recon_equipment_1_desc:0 "Version de reconnaissance tactique tout temps pour l'US Air Force, radar AN/APQ-99 (plus tard AN/APQ-172). Équipé de manière similaire au RF-4B, mais avec un choix plus large de caméras, y compris un pod central pour la gigantesque caméra HIAC-1 LOROP (Long Range Oblique Photography), capable de prendre des images haute résolution d'objets situés à 160 km. De nombreux appareils ont été rééquipés d'un nez plus spacieux, bombé et profilé."
 CAP_jet_recon_equipment_2:0 "Lockheed Martin F-16C Block 30/32 de reconnaissance"
 CAP_jet_recon_equipment_2_short:0 "F-16C Block 30 Recce"
 CAP_jet_recon_equipment_2_desc:0 "La première variante de reconnaissance était un F-16D de l'USAF configuré à titre expérimental en 1986 avec un pod multicapteur de type baignoire situé sur l'axe central. En 1988, l'USAF a décidé de remplacer la flotte vieillissante de RF-4C Phantom par des F-16C Block 30 équipés du pod central Advanced Tactical Airborne Reconnaissance System (ATARS) de Control Data Corporation, capable de transporter divers capteurs. Cependant, des problèmes liés au programme ATARS ont conduit l'USAF à se retirer en juin 1993. Au milieu des années 1990, l'armée de l'air américaine a expérimenté une série de modèles de nacelles de reconnaissance centrale, à commencer par un prototype, la nacelle Electro-Optical 1 (EO-1). Le premier vol d'un F-16 équipé d'un prototype TARS a eu lieu le 26 août 1995, et le 27 septembre 1996, l'USAF a passé sa première commande de production pour ces nacelles."
 CAP_transport_plane_equipment_1:0 "Douglas C-47 Skytrain"
 CAP_transport_plane_equipment_1_short:0 "C-47 Skytrain"
 CAP_transport_plane_equipment_1_desc:0 "Développé à partir de l'avion de ligne Douglas DC-3 lors de son premier vol en 1941, le C-47 était l'avion de transport par excellence utilisé par les Alliés. Pendant la Seconde Guerre mondiale, les forces armées de nombreux pays ont utilisé le C-47 et des DC-3 modifiés pour le transport de troupes, de marchandises et de blessés. Plus de 10 000 unités, tant des C-47 que des R4D (plus tard C-117), la variante navale, ont été construites pour la guerre, et de nombreux « Skytrains » ont été utilisés non seulement pour le transport de troupes et de marchandises, mais aussi pour les opérations de recherche et de sauvetage et, pendant la guerre du Vietnam, comme premiers hélicoptères de combat."
 CAP_transport_plane_equipment_2:0 "Douglas C-54 Skymaster"
 CAP_transport_plane_equipment_2_short:0 "C-54 Skymaster"
 CAP_transport_plane_equipment_2_desc:0 "Tout comme le C-47 avant lui, le C-54 a été développé à partir d'un avion de ligne Douglas, en l'occurrence le DC-4. Mis en service en 1942, le C-54 servait au transport de marchandises, mais transportait également des personnalités importantes, étant l'un des premiers avions à transporter le président des États-Unis (mais pas le premier avion à être désigné Air Force One). Cependant, le « Skymaster » doit sa renommée au fait qu'il fut le type d'avion le plus utilisé pour acheminer du charbon et des vivres à Berlin-Ouest pendant le célèbre pont aérien de Berlin. Les variantes de la marine étaient connues sous le nom de R5D."
 CAP_transport_plane_equipment_3:0 "Douglas C-124 Globemaster II"
 CAP_transport_plane_equipment_3_short:0 "C-124 Globemaster II"
 CAP_transport_plane_equipment_3_desc:0 "Le C-124 était le principal avion de transport lourd du Service de transport aérien militaire (MATS) de l'armée de l'air américaine dans les années 1950 et au début des années 1960, jusqu'à l'entrée en service du Lockheed C-141 Starlifter. Il a servi dans les unités du MATS, puis du Commandement du transport aérien militaire (MAC), de la réserve de l'armée de l'air et de la garde nationale aérienne jusqu'en 1974."
 CAP_transport_plane_equipment_4:0 "Lockheed C-130 Hercules"
 CAP_transport_plane_equipment_4_short:0 "C-130 Hercules"
 CAP_transport_plane_equipment_4_desc:0 "Développé en 1954, le C-130 est un avion de transport capable d'utiliser des pistes non préparées pour décoller et atterrir, ce qui en fait un appareil pratique pour le transport de troupes et de marchandises ainsi que pour l'évacuation médicale. Mais ce qui vaut à cet avion son surnom d'« Hercules », c'est qu'il existe plusieurs sous-variantes développées pour divers rôles, notamment comme avion de combat (AC-130 Spooky &amp; Spectre), drone de contrôle (DC-130), brouilleur et PSYOPS (EC-130 Compass Call) et reconnaissance météorologique (WC-130). Une machine véritablement polyvalente qui mérite bien son surnom."
 CAP_transport_plane_equipment_5:0 "Lockheed C-141 Starlifter"
 CAP_transport_plane_equipment_5_short:0 "C-141 Starlifter"
 CAP_transport_plane_equipment_5_desc:0 "Conçu pour remplacer le C-124 Globemaster II et le C-133 Cargomaster, le C-141 est entré en service en 1965 au sein du Military Air Transport Service (MATS), puis de son successeur, le Military Airlift Command (MAC), et enfin de l'Air Mobility Command (AMC) de l'armée de l'air américaine. Au cours de ses plus de 40 années de service, il a participé à de nombreuses opérations américaines à travers le monde, servant dans des zones de guerre au Vietnam et en Israël."
 CAP_transport_plane_equipment_6:0 "McDonnell Douglas C-5A Galaxy"
 CAP_transport_plane_equipment_6_short:0 "C-5A Galaxy"
 CAP_transport_plane_equipment_6_desc:0 "Le Lockheed C-5 Galaxy est un gros avion de transport militaire initialement conçu et construit par Lockheed, et désormais entretenu et modernisé par son successeur, Lockheed Martin. Il offre à l'armée de l'air américaine (USAF) une capacité de transport aérien stratégique intercontinental lourd, capable de transporter des charges hors gabarit et surdimensionnées, y compris toutes les cargaisons certifiées pour le transport aérien. Le Galaxy présente de nombreuses similitudes avec le Lockheed C-141 Starlifter, plus petit, et le Boeing C-17 Globemaster III, plus récent. Le C-5 fait partie des plus gros avions militaires au monde."
 CAP_transport_plane_equipment_7:0 "McDonnell Douglas C-5B Galaxy"
 CAP_transport_plane_equipment_7_short:0 "C-5B Galaxy"
 CAP_transport_plane_equipment_7_desc:0 "Le C-5B est une version améliorée du C-5A. Il intègre toutes les modifications et améliorations apportées au C-5A, avec des ailes améliorées, un train d'atterrissage simplifié, des turboréacteurs TF-39-GE-1C modernisés et une avionique mise à jour."
 CAP_transport_plane_equipment_8:0 "Boeing C-17A Globemaster III"
 CAP_transport_plane_equipment_8_short:0 "C-17A Globemaster III"
 CAP_transport_plane_equipment_8_desc:0 "Lancé en 1995, le C-17 était le troisième avion de sa famille à porter le nom de « Globemaster ». Assurant à la fois des missions de transport aérien stratégique et tactique, le C-17 allait remplacer le C-141 et libérer le C-5 d'une grande partie de ses tâches (le déléguant au transport de cargaisons hors gabarit). En service dans 8 pays, le « Globemaster III » continuera à répondre aux besoins de l'armée américaine pendant de nombreuses années."
 CAP_transport_plane_equipment_9:0 "Boeing C-17A Globemaster III Block 21"
 CAP_transport_plane_equipment_9_short:0 "C-17A Block 21"
 CAP_transport_plane_equipment_9_desc:0 "Cette mise à niveau logicielle/matérielle constituait une amélioration majeure du système embarqué de génération de gaz inerte (OBIGGS II), d'un nouveau radar météorologique, d'un système de stabilisation amélioré et d'autres équipements avioniques."
 CAP_transport_plane_equipment_10:0 "Boeing C-17A Globemaster III"
 CAP_transport_plane_equipment_10_short:0 "C-17A Block 21"
 CAP_transport_plane_equipment_10_desc:0 "Cette mise à niveau logicielle/matérielle constituait une amélioration majeure du système embarqué de génération de gaz inerte (OBIGGS II), d'un nouveau radar météorologique, d'un système de stabilisation amélioré et d'autres équipements avioniques."
 CAP_slbm_equipment_1:0 "UGM-19 Jupiter S"
 CAP_slbm_equipment_1_short:0 "Jupiter S"
 CAP_slbm_equipment_1_desc:0 "L'UGM-19 est la variante lancée depuis un sous-marin du missile PGM-19 utilisé par l'armée américaine. Grâce à sa forme courte et trapue, le « Jupiter S » pouvait facilement être installé sur des navires de surface et des sous-marins."
 CAP_slbm_equipment_2:0 "UGM-27A Polaris"
 CAP_slbm_equipment_2_short:0 "Polaris A"
 CAP_slbm_equipment_2_desc:0 "Introduit en 1961, l'UGM-27A remplaçait le missile Jupiter en tant que SLBM. Missile à deux étages à tête nucléaire, le « Polaris » était conçu pour être utilisé dans le cadre d'une riposte de seconde frappe (son CEP n'étant pas suffisant pour une première frappe) dans le cadre de la contribution de la marine à l'arsenal nucléaire américain, en remplacement du missile de croisière SSM-N-8 Regulus."
 CAP_slbm_equipment_3:0 "UGM-27B Polaris"
 CAP_slbm_equipment_3_short:0 "Polaris B"
 CAP_slbm_equipment_3_desc:0 "Également connue sous le nom de « Polaris A-2 », cette variante améliorée de l'UGB-27 était équipée d'une nouvelle ogive nucléaire, la W-47, qui augmentait la puissance explosive. Cependant, des problèmes mécaniques liés à l'armement et à la sécurité ont conduit à une durée de vie utile très courte, car elle a été rapidement remplacée par l'UGM-27C."
 CAP_slbm_equipment_4:0 "UGM-27C Polaris"
 CAP_slbm_equipment_4_short:0 "Polaris C"
 CAP_slbm_equipment_4_desc:0 "Également connue sous le nom de « Polaris A-3 », cette version a remplacé le W-47 par le W-58, une ogive nucléaire qui fonctionne comme un véhicule à rentrée multiple, se divisant en trois ogives distinctes pouvant transporter chacune une charge utile de 200 kt, ou pouvant être maintenues ensemble pour un rendement théorique de 1 mégatonne. Un renforcement limité a été appliqué pour protéger les systèmes électroniques des missiles contre les effets des impulsions électromagnétiques nucléaires pendant la phase de propulsion."
 CAP_slbm_equipment_5:0 "UGM-73 Poseidon"
 CAP_slbm_equipment_5_short:0 "Poseidon"
 CAP_slbm_equipment_5_desc:0 "L'UGM-73 est un missile balistique lancé depuis un sous-marin (SLBM) à deux étages, propulsé par un moteur-fusée à combustible solide, qui a remplacé le Polaris à partir de 1971-1972. Équipé de 10 à 14 ogives W-68 d'une puissance de 40 à 50 kilotonnes, le « Poséidon » était un missile à ogives multiples (MIRV) doté d'une charge utile plus importante et d'une précision améliorée par rapport à son prédécesseur immédiat. Il a été le missile le plus utilisé sur les sous-marins nucléaires lanceurs d'engins américains tout au long des années 70 et 80."
 CAP_slbm_equipment_6:0 "UGM-96 Trident I"
 CAP_slbm_equipment_6_short:0 "Trident I"
 CAP_slbm_equipment_6_desc:0 "L'UGM-96 a été développé en 1979 pour succéder au SLBM Poséidon. Il s'agit d'un missile à trois étages propulsé par un moteur à propergol solide et équipé de huit ogives nucléaires W-76, chacune d'une puissance d'environ 100 kt, soit cinq fois plus que la bombe Fat Man qui a dévasté Nagasaki. Le « Trident I » est resté en service jusqu'à ce que toutes les unités soient complètement retirées en 2005."
 CAP_slbm_equipment_7:0 "UGM-133 Trident II"
 CAP_slbm_equipment_7_short:0 "Trident II"
 CAP_slbm_equipment_7_desc:0 "Le missile actuel utilisé par les sous-marins de la marine américaine, l'UGM-133, est une arme puissante à prendre au sérieux. Avec une portée de plus de 12 000 km et équipé de 8 à 14 ogives W-76 utilisées sur son prédécesseur, ou de W-88 plus dévastatrices d'une puissance nucléaire de 425 kt, le « Trident II » restera un formidable moyen de dissuasion pour les États-Unis dans un avenir prévisible."
 CAP_irbm_equipment_1:0 "PGM-17 Thor"
 CAP_irbm_equipment_1_short:0 "Thor"
 CAP_irbm_equipment_1_desc:0 "Le premier missile balistique opérationnel utilisé par l'armée de l'air américaine, le PGM-17 (désignation d'origine : SM-75), a été développé en 1956 en raison des craintes suscitées par le développement de missiles à longue portée par l'Union soviétique. Les ogives typiques avaient une puissance de 1,44 mégatonne, ce qui en faisait une arme très puissante. Bien qu'ils aient été retirés du service en 1963, les « Thor » pouvaient être réactivés à tout moment pour frapper des cibles à la vitesse de l'éclair."
 CAP_irbm_equipment_2:0 "PGM-19 Jupiter A"
 CAP_irbm_equipment_2_short:0 "Jupiter A"
 CAP_irbm_equipment_2_desc:0 "Le PGM-19 fut le premier missile balistique à moyenne portée à tête nucléaire utilisé par l'armée de l'air américaine. Initialement développé pour l'armée de terre et la marine américaines, ce missile conserva sa forme trapue afin de pouvoir être utilisé à bord de sous-marins, bien que la marine ait finalement choisi de développer le missile Polaris. Baptisé « Jupiter », d'après le roi des dieux romains, il était équipé d'une ogive nucléaire d'une puissance de 1,1 mégatonne."
 CAP_irbm_equipment_3:0 "PGM-19 Jupiter C"
 CAP_irbm_equipment_3_short:0 "Jupiter C"
 CAP_irbm_equipment_3_desc:0 "Lancé en 1958 comme une version améliorée du PGM-19A, le « Jupiter-C » a été développé avec un fuselage allongé afin de pouvoir accueillir plusieurs fusées à combustible solide. Bien qu'il ait été utilisé pour tester la rentrée atmosphérique des fusées usagées, il a été reconverti en missile balistique à portée intermédiaire (IRBM)."
 CAP_irbm_equipment_4_short:0 "Juno I"
 CAP_irbm_equipment_4_desc:0 "Développé à partir du Jupiter-C, le « Juno » (du nom de la reine des dieux romains) reprenait le modèle Jupiter-C et intégrait un quatrième étage, monté au sommet du « tube » du troisième étage, qui se déclençait après la combustion du troisième étage pour propulser la charge utile. Ce système a été intégré pour le lancement de satellites et a permis de mettre en orbite le premier satellite américain, « Explorer 1 ». En tant qu'ICBM, le quatrième étage inclus aurait augmenté la portée d'une charge utile nucléaire (qui aurait probablement été la même que celle du Jupiter précédent) à environ 2 000 km (ou ~1 250 mi)."
 CAP_irbm_equipment_5:0 "PGM-19E Juno II"
 CAP_irbm_equipment_5_short:0 "Juno II"
 CAP_irbm_equipment_5_desc:0 "Le Juno II est une version améliorée du Juno I, mais contrairement à son prédécesseur, il s'inspire du modèle Jupiter-A, dont il utilise les fusées pour son premier étage. Pour ses deuxième, troisième et quatrième étages, il utilise une plate-forme de fusée dérivée du système de missile MGM-29 Redstone. Utilisé comme plate-forme de lancement pour les derniers satellites Explorer ainsi que pour Pioneer 4 (le premier satellite américain à avoir quitté l'orbite terrestre et la première sonde lunaire à avoir réussi), une version hypothétique en tant que missile balistique pourrait avoir une portée allant jusqu'à environ 2 500 km (environ 1 550 km)."
 CAP_irbm_equipment_6:0 "MGM-31C Pershing II"
 CAP_irbm_equipment_6_short:0 "Pershing II"
 CAP_irbm_equipment_6_desc:0 "Entré en service en 1983, le MGM-31C a été développé pour remplacer les missiles Pershing I et Pershing Ia, d'où son nom « Pershing II » (Pershing tirant son nom de John J. Pershing, l'un des deux hommes ayant atteint le grade de « général des armées » ou général six étoiles). Il était équipé d'une ogive dont la puissance pouvait varier de 5 à 80 kilotonnes."
 CAP_irbm_equipment_7:0 "MGM-31D Pershing III"
 CAP_irbm_equipment_7_short:0 "Pershing III"
 CAP_irbm_equipment_7_desc:0 "Développé dans le prolongement du système Pershing, le « Pershing III » était une version à quatre étages de 25 000 livres (11 000 kg) destinée à remplacer le LGM-118 Peacekeeper. En raison des limitations imposées par les traités de réduction des armes stratégiques, il devait être lancé à partir de lanceurs M1003 modifiés, la troisième modification pour le troisième type de missile « Pershing »."
 CAP_irbm_equipment_8:0 "MGM-31E Pershing II Reduced Range"
 CAP_irbm_equipment_8_short:0 "Pershing II RR"
 CAP_irbm_equipment_8_desc:0 "Version modifiée du MGM-31C précédent, la variante « E » a été développée avec une portée réduite afin de se conformer au Traité sur les forces nucléaires à portée intermédiaire (INF). Comparé aux Pershing II et III, le Pershing à portée réduite aurait eu une portée opérationnelle d'environ 1 200 km (745 mi), soit moins que les 1 770 km (1 100 mi) du modèle original."
 CAP_srbm_equipment_1:0 "Hermes B-1"
 CAP_srbm_equipment_1_short:0 "Hermes"
 CAP_srbm_equipment_1_desc:0 "Développé en réponse aux attaques à la roquette menées par l'Allemagne nazie en Europe, le Hermes a été conçu comme un projet pilote qui allait finalement devenir le précurseur du programme américain de missiles. Nommé d'après le dieu messager grec, le « Hermes » variante B était un missile de croisière à statoréacteur capable d'atteindre une vitesse de Mach 4. Il allait être désigné SSM-G-9 et SSM-A-9."
 CAP_srbm_equipment_2:0 "MGM-5 Corporal"
 CAP_srbm_equipment_2_short:0 "Corporal"
 CAP_srbm_equipment_2_desc:0 "Le MGM-5 fut le premier missile guidé américain autorisé à transporter une ogive nucléaire. Missile balistique tactique, le « Corporal » était un missile balistique à courte portée d'une portée de 75 milles marins (140 km). En plus d'une ogive nucléaire (qui fut introduite plus tard dans sa carrière), il pouvait également être équipé d'une ogive conventionnelle à haut pouvoir explosif (HE)."
 CAP_srbm_equipment_3:0 "PGM-11 Redstone"
 CAP_srbm_equipment_3_short:0 "Redstone"
 CAP_srbm_equipment_3_desc:0 "Le premier missile balistique opérationnel utilisé par l'armée américaine, le PGM-11 (initialement appelé SSM-G-14 en 1950, SSM-A-14 en 1951, puis M8 et M9 en 1955), était un descendant direct de la fusée V-2 nazie, développée par des ingénieurs allemands spécialisés dans les fusées et amenés aux États-Unis dans le cadre de l'opération Paperclip. Le « Redstone », nommé d'après l'arsenal éponyme de Huntsville, en Alabama, où il a été développé, était un missile à courte portée qui a servi à la défense active de l'Europe occidentale pendant la guerre froide. Il a également été le premier missile à être équipé d'une ogive nucléaire."
 CAP_srbm_equipment_4:0 "MGM-18 Lacrosse"
 CAP_srbm_equipment_4_short:0 "Lacrosse"
 CAP_srbm_equipment_4_desc:0 "Arme balistique tactique à courte portée destinée à l'appui rapproché des troupes terrestres, le MGM-18 a été introduit en 1959 alors que le missile était encore en phase de développement. Bien qu'il puisse être équipé d'une ogive nucléaire HE ou de 1,5 à 10 kilotonnes, des problèmes de fiabilité et des difficultés avec le système de guidage, ainsi que sa vulnérabilité aux contre-mesures électroniques, ont conduit au retrait du « Lacrosse » quelques années plus tard."
 CAP_srbm_equipment_5:0 "MGM-29 Sergeant"
 CAP_srbm_equipment_5_short:0 "Sergeant"
 CAP_srbm_equipment_5_desc:0 "Autre produit issu du Redstone Arsenal, le MGM-29 a été introduit en 1962 pour remplacer le MGM-5 Corporal. Surnommé « Sergeant », il fut le dernier missile de ce type à porter un nom inspiré du système de grades de l'armée américaine. Outre une ogive nucléaire de 200 kilotonnes, le MGM-29 peut également être équipé d'ogives hautement explosives, biologiques et chimiques."
 CAP_srbm_equipment_6:0 "MGM-31A Pershing 1"
 CAP_srbm_equipment_6_short:0 "Pershing 1"
 CAP_srbm_equipment_6_desc:0 "Le MGM-31 fut le premier d'une longue série de missiles balistiques utilisés par l'armée américaine. Déployé en 1963, le MGM-31A fut développé pour succéder au missile Redstone et fut initialement baptisé « Redstone-S » avant d'être finalement appelé « Pershing I ». Il était équipé d'une ogive nucléaire de 60 à 400 kilotonnes."
 CAP_srbm_equipment_7:0 "MGM-52 Lance"
 CAP_srbm_equipment_7_short:0 "Lance"
 CAP_srbm_equipment_7_desc:0 "Déployé en 1972, le MGM-52 était une version améliorée du MGM-29 Sergeant qu'il remplaçait, avec une précision et une mobilité accrues. Sa charge utile était soit l'ogive nucléaire W70 (d'une puissance de 1 à 100 kilotonnes), soit une ogive à charge creuse hautement explosive pour détruire les bunkers, soit l'ogive M251 avec des sous-munitions explosives pour le rôle de distributeur à distance. Avec des ogives aussi polyvalentes à sa disposition, le « Lance » est certain de pénétrer les défenses ennemies et d'ouvrir la voie à l'avancée des troupes."
 CAP_srbm_equipment_8:0 "MGM-140A ATACMS Block I"
 CAP_srbm_equipment_8_short:0 "ATACMS Block I"
 CAP_srbm_equipment_8_desc:0 "Le MGM-140 (initialement M39) a été introduit en 1991 pour remplacer le MGM-52 Lance dans le rôle de missile balistique à courte portée conventionnel. Capable d'être lancé à partir du système M270 MLRS, le MGM-140A contient une ogive qui transporte jusqu'à 950 sous-munitions explosives d'une portée de 80 miles (128 km). Officiellement connu sous le nom d'ATACMS, abréviation de « Army TACtical Missile System » (système de missile tactique de l'armée)."
 CAP_srbm_equipment_9:0 "MGM-164 ATACMS Block II"
 CAP_srbm_equipment_9_short:0 "ATACMS Block II"
 CAP_srbm_equipment_9_desc:0 "Initialement désigné M39A3, puis MGM-140C, le MGM-164 est la désignation de la deuxième génération de missiles ATACMS. Développé au cours de la seconde moitié des années 1990 et au début des années 2000, ce missile devait être équipé de sous-munitions antichars Brilliant, lui conférant une puissance meurtrière contre les chars de l'époque de la guerre froide utilisés après la fin de celle-ci."
 CAP_icbm_equipment_1:0 "LGM-30A Minuteman I"
 CAP_icbm_equipment_1_short:0 "Minuteman I"
 CAP_icbm_equipment_1_desc:0 "Le LGM-30A (anciennement SM-80) a été introduit en 1962 dans le cadre de la dissuasion nucléaire, menaçant les Soviétiques d'une puissante riposte en cas d'attaque préalable contre les États-Unis. Cependant, grâce au missile Polaris de la marine, l'armée de l'air américaine a pu poursuivre le développement du missile et améliorer sa précision. Son surnom « Minuteman » lui a été donné parce que, tout comme l'infanterie légère éponyme de la guerre d'indépendance américaine, le missile était conçu pour être lancé à tout moment."
 CAP_icbm_equipment_2:0 "LGM-30G Minuteman III"
 CAP_icbm_equipment_2_short:0 "Minuteman III"
 CAP_icbm_equipment_2_desc:0 "Le LGM-30G était le dernier développement de la plateforme ICBM Minuteman. Lors de son entrée en service en 1972, il s'agissait de la première plateforme de missiles à utiliser une ogive MIRV. Sa tête nucléaire était composée de trois ogives nucléaires W62, chacune d'une puissance de 170 kT, contre 1,2 MT pour son prédécesseur, le W56. En 2019, le « Minuteman III » est le seul ICBM terrestre actuellement en service aux États-Unis."
 CAP_icbm_equipment_3:0 "LGM-70B Minuteman IV"
 CAP_icbm_equipment_3_short:0 "Minuteman IV"
 CAP_icbm_equipment_3_desc:0 "Le LGM-70B était une version améliorée des plateformes Minuteman II. Ces missiles ont été modifiés avec des émetteurs radio améliorés, issus du système de communication d'urgence par fusée (ERCS) utilisé sur les LEM-70A de conception similaire. Le missile serait à son tour utilisé comme fer de lance d'une première frappe ou d'une riposte, donnant l'ordre de passer à l'action aux autres unités du SAC pendant son vol, ce qui permettrait de lancer d'autres missiles en succession rapide."
 CAP_icbm_equipment_4:0 "LGM-118A Peacekeeper"
 CAP_icbm_equipment_4_short:0 "Peacekeeper"
 CAP_icbm_equipment_4_desc:0 "Introduit en 1986 dans le cadre du projet « Star Wars » du président Reagan, le LGM-118A (également connu sous le nom de missile MX) a été développé pour permettre aux États-Unis de résister à une attaque surprise de la flotte de missiles balistiques intercontinentaux soviétiques, puis de lancer une contre-attaque. Il s'agissait d'un missile MIRV pouvant transporter 10 ogives nucléaires W87 de 300 kilotonnes dans son véhicule de rentrée. Cependant, en raison du traité START II (bien que les États-Unis n'aient jamais ratifié ledit traité) et du fait que le Minuteman pouvait déployer des ogives uniques à un coût bien moindre, le « Peacekeeper » a été retiré du service. Ses composants ont été utilisés par une entreprise privée pour développer un système de lancement civil à usage unique, le « Minotaur IV »."
 CAP_icbm_equipment_5:0 "MGM-134 Midgetman"
 CAP_icbm_equipment_5_short:0 "Midgetman"
 CAP_icbm_equipment_5_desc:0 "Développé en 1991, à la fin de la guerre froide, le MGM-134 a été conçu pour répondre au besoin d'un petit missile balistique intercontinental pouvant être lancé à partir de véhicules routiers, face à la menace croissante des sous-marins soviétiques capables de lancer des missiles balistiques intercontinentaux depuis la côte et de priver les États-Unis de leur capacité de riposte. Équipé d'une ogive nucléaire de 475 kT, le « Midgetman » devait être lancé à partir d'un lanceur mobile robuste, capable de le protéger des radiations."
 CAP_cruisemissile_equipment_0:0 "JB-2 Loon"
 CAP_cruisemissile_equipment_0_short:0 "JB-2 Loon"
 CAP_cruisemissile_equipment_0_desc:0 "Le JB-2 était une copie américaine de la bombe volante allemande V-1. Développé en 1944, il était initialement destiné à être utilisé lors de l'opération Downfall, l'invasion du Japon par les Alliés. Mais en raison de l'utilisation d'armes atomiques, le « Loon » n'a jamais été utilisé au combat. Malgré cela, le JB-2 allait jouer un rôle important dans le développement des systèmes de missiles tactiques sol-sol."
 CAP_cruisemissile_equipment_1:0 "MGM-1 Matador"
 CAP_cruisemissile_equipment_1_short:0 "MGM-1 Matador"
 CAP_cruisemissile_equipment_1_desc:0 "Le MGM-1 (initialement SSM-A-1 en 1949, bombardier B-61 selon la désignation de l'armée de l'air américaine, et TM-61 en 1955) fut le premier missile de croisière développé aux États-Unis, mis en service en 1952. Bien que similaire dans son concept à son prédécesseur, le JB-2 Loon, et au V-1 allemand, il comprenait une commande radio qui permettait de corriger sa trajectoire en vol, ce qui lui conférait une précision supérieure à celle des missiles balistiques sur de plus longues distances. Il peut être équipé d'une ogive nucléaire d'une puissance comprise entre 1 et 120 kilotonnes, mais il existe également des variantes à ogive hautement explosive. Son surnom est « Matador »."
 CAP_cruisemissile_equipment_2:0 "SM-62 Snark"
 CAP_cruisemissile_equipment_2_short:0 "SM-62 Snark"
 CAP_cruisemissile_equipment_2_desc:0 "Missile de croisière intercontinental, le SM-62 (initialement SSM-A-3 et B-62) était un missile à propulsion à réaction d'une portée de 5 500 milles marins (10 200 km), le missile de croisière à la plus longue portée jamais déployé par les États-Unis. Développé comme moyen de dissuasion provisoire pendant la mise au point des missiles balistiques intercontinentaux, le « Snark » (du nom d'un animal fictif dans « La Chasse au Snark » de Lewis Carroll) devait être retiré une fois les missiles balistiques intercontinentaux correctement déployés."
 CAP_cruisemissile_equipment_3:0 "MGM-13 Mace"
 CAP_cruisemissile_equipment_3_short:0 "MGM-13 Mace"
 CAP_cruisemissile_equipment_3_desc:0 "Développé en 1956 pour améliorer et succéder au MGM-1, le MGM-13 (initialement appelé TM-76) pouvait atteindre des vitesses transsoniques avec une portée comprise entre 540 et 1 300 miles, en fonction de l'altitude du missile. Un système de cartographie radar était intégré à ses systèmes, permettant de corriger la trajectoire si le terrain ne correspondait pas au film du terrain à atteindre. Surnommé « Mace », le MGM-13 servirait de missile de dissuasion et de croisière jusqu'à son remplacement par le MGM-31 Pershing et le BGM-109 respectivement."
 CAP_cruisemissile_equipment_4:0 "BGM-109G Gryphon"
 CAP_cruisemissile_equipment_4_short:0 "BGM-109G Gryphon"
 CAP_cruisemissile_equipment_4_desc:0 "Le BGM-109G a remplacé le missile Mace précédent et a été développé à partir du missile Tomahawk lancé depuis un navire. Introduit en 1983, le BGM-109G a été développé pour contrer le missile mobile SS-20 Saber utilisé par l'Union soviétique. Équipé d'une ogive nucléaire W84 à puissance variable (entre 0,2 et 150 kt), ce missile, associé à la gamme Pershing de missiles balistiques à portée intermédiaire (IRBM) et à courte portée (SRBM), a incité l'Union soviétique à signer le traité sur les forces nucléaires à portée intermédiaire (traité FNI). Bien qu'il soit également connu sous le nom de missile de croisière lancé au sol (GLCM), sa désignation officielle et son surnom sont BGM-109G « Gryphon »."
 CAP_cruisemissile_equipment_5:0 "AGM-129 ACM"
 CAP_cruisemissile_equipment_5_short:0 "ACM"
 CAP_cruisemissile_equipment_5_desc:0 "Introduit en 1990, l'AGM-129 ACM (abréviation de Advanced Cruise Missile) était un missile de croisière à faible observabilité, lancé depuis les airs et transporté exclusivement par les bombardiers stratégiques B-52H Stratofortress de l'armée de l'air américaine. Il a été développé par crainte que l'AGM-86 ait des difficultés à pénétrer les futurs systèmes de défense aérienne. Bien qu'il soit capable de transporter une ogive nucléaire W80 (utilisée dans son prédécesseur, d'une puissance de 5 à 150 kt), la variante « C » de ce missile est équipée d'une ogive conventionnelle à haut pouvoir explosif."
 CAP_cruisemissile_equipment_6:0 "AGM-158 JASSM"
 CAP_cruisemissile_equipment_6_short:0 "JASSM"
 CAP_cruisemissile_equipment_6_desc:0 "L'AGM-158 représente le summum de la technologie des missiles de croisière. Reprenant les caractéristiques de l'AGM-129, à savoir un missile à faible observabilité, à longue portée et lancé depuis les airs, l'AGM-158, introduit en 2009, peut être lancé à partir de divers avions de combat modernes, allant des chasseurs tels que le F-35 et le F-15E aux bombardiers tels que le B-52H et le B-1B. Désigné sous le nom de JASSM (Joint Air-to-Surface Standoff Missile), l'AGM-158 se distingue de la plupart des missiles de croisière en ce qu'il n'a pas de capacité nucléaire, étant strictement un missile de croisière à ogive conventionnelle."
 CAP_coastalmissile_equipment_3:0 "BGM-84A Harpoon"
 CAP_coastalmissile_equipment_3_short:0 "BGM-84A Harpoon"
 CAP_coastalmissile_equipment_4:0 "BGM-84C Harpoon"
 CAP_coastalmissile_equipment_4_short:0 "BGM-84C Harpoon"
 CAP_coastalmissile_equipment_5:0 "BGM-109B TASM"
 CAP_coastalmissile_equipment_5_short:0 "BGM-109B TASM"
 CAP_naval_helicopter_equipment_1:0 "Bell HTL-4 Sioux"
 CAP_naval_helicopter_equipment_1_short:0 "HTL-4 Sioux"
 CAP_naval_helicopter_equipment_1_desc:0 "Le HTL était un hélicoptère léger monomoteur à rotor unique dérivé du Bell 47A civil. Acheté par la marine américaine en 1947, le HTL-4 (variante désignée par la marine) se distinguait de ceux utilisés par les autres branches par la suppression du revêtement en tissu sur le longeron de queue. Sinon, il conservait bon nombre de ses caractéristiques, notamment la verrière distinctive en forme de « bulle de savon » offrant au pilote une large vue. Il fut plus tard désigné TH-13L. Son surnom, donné en référence aux tribus amérindiennes, est « Sioux »."
 CAP_naval_helicopter_equipment_2:0 "Sikorsky HSS-1 Seabat"
 CAP_naval_helicopter_equipment_2_short:0 "HSS-1 Seabat"
 CAP_naval_helicopter_equipment_2_desc:0 "Le HSS est la variante anti-sous-marine du S-58 de Sikorsky, une version améliorée du S-55 (et du H-19 Chickasaw militaire). Il avait un nez plus petit, mais avec un fuselage arrière et un train d'atterrissage à roue arrière, plutôt que la configuration à queue haute et à quatre montants de son prédécesseur. Rebaptisé plus tard SH-34G, les variantes anti-sous-marines de cet hélicoptère ont reçu le surnom officiel de « Seabat »."
 CAP_naval_helicopter_equipment_3:0 "Kaman SH-2D Seasprite"
 CAP_naval_helicopter_equipment_3_short:0 "SH-2D Seasprite"
 CAP_naval_helicopter_equipment_3_desc:0 "Introduit au début des années 1960 en remplacement du SH-34 Seabat, le SH-2 (initialement désigné HU2K) fut le premier hélicoptère anti-sous-marin capable d'être déployé sur des navires américains autres que des porte-avions. Cette portabilité prolongea la carrière du « Seasprite » et des variantes améliorées virent le jour. La variante représentée dans le jeu est la variante « D », la variante anti-sous-marine initiale."
 CAP_naval_helicopter_equipment_4:0 "Sikorsky SH-3A Sea King"
 CAP_naval_helicopter_equipment_4_short:0 "SH-3A Sea King"
 CAP_naval_helicopter_equipment_4_desc:0 "Développé à partir du Sikorsky S-61 civil, le SH-3 (désignation d'origine HSS-2) est un hélicoptère ASW bimoteur. Il s'agissait du premier hélicoptère amphibie au monde, capable de décoller aussi bien de la terre que de la mer. Il était également, avec son contemporain le Seasprite, l'un des premiers hélicoptères ASW à utiliser des turbomoteurs. Outre ses missions ASM, le SH-3 a également été utilisé pour des missions de recherche et sauvetage (SAR), de transport, d'évacuation médicale et d'alerte aérienne avancée (AEW), plusieurs hélicoptères étant utilisés comme « Marine One », l'hélicoptère officiel de transport des présidents américains. C'est pour cette raison qu'il a été surnommé « Sea King », l'hélicoptère le plus polyvalent au monde."
 CAP_naval_helicopter_equipment_5:0 "Sikorsky SH-60B Seahawk"
 CAP_naval_helicopter_equipment_5_short:0 "SH-60B Seahawk"
 CAP_naval_helicopter_equipment_5_desc:0 "Le SH-60 est la variante utilisée par la marine américaine de l'hélicoptère UH-60 Blackhawk de l'armée américaine (lui-même une variante militaire du Sikorsky S-70). Bien qu'il ait remplacé le Sea King, le SH-60 n'a pas de capacité d'atterrissage amphibie, mais il conserve la capacité du SH-2 d'atterrir sur n'importe quel navire américain capable d'accueillir des hélicoptères. Capable d'assumer bon nombre des mêmes rôles que le SH-3, le « Sea Hawk » représente l'avenir de l'aviation hélicoptère de la marine américaine."
 CAP_naval_helicopter_equipment_6:0 "Sikorsky SH-60F Seahawk"
 CAP_naval_helicopter_equipment_6_short:0 "SH-60F Seahawk"
 CAP_naval_helicopter_equipment_6_desc:0 "Le SH-60F servait principalement d'appareil de lutte anti-sous-marine (ASW) au groupe aéronaval. L'hélicoptère traquait les sous-marins à l'aide de son sonar à immersion AQS-13F et était équipé d'un lanceur de bouées acoustiques à 6 tubes. Le SH-60F est officieusement baptisé « Oceanhawk ». Le SH-60F peut transporter des torpilles Mk 46, Mk 50 ou Mk 54 comme armes offensives, et dispose d'un choix de mitrailleuses montées sur le fuselage, notamment les M60D, M240D et GAU-16 (calibre .50) pour l'autodéfense."
 CAP_naval_helicopter_equipment_7:0 "Sikorsky MH-60R Seahawk"
 CAP_naval_helicopter_equipment_7_short:0 "MH-60R Seahawk"
 CAP_naval_helicopter_equipment_7_desc:0 "Le MH-60R Seahawk est une version améliorée du SH-60 Seahawk. Développé en 1993, le MH-60R a été conçu pour combiner les caractéristiques des anciens SH-60B et SH-60F. Ses capteurs comprennent le pack ASE, le MTS-FLIR, le radar multimode/interrogateur IFF AN/APS-147, une liaison de données aérienne avancée et un sonar actif aérien plus perfectionné. Ces équipements, associés à un système d'armement amélioré (lui permettant de transporter la torpille avancée Mk 54 et les missiles AGM-114 Hellfire), confèrent au « Seahawk » une plus grande flexibilité dans les opérations anti-navales et d'assaut amphibie."
 CAP_attack_helicopter_equipment_1: "Bell AH-1G Cobra"
 CAP_attack_helicopter_equipment_1_short: "AH-1G Cobra"
 CAP_attack_helicopter_equipment_1_desc:0 "Initialement introduit en 1966 comme hélicoptère d'attaque provisoire, l'AH-1 (développé avec une certaine compatibilité avec l'UH-1 Huey Iroquois) a été utilisé dans les mêmes rôles que ceux prévus pour l'AH-56 pendant son cycle de développement. Il a souvent été déployé dans des formations de chasseurs-tueurs, le rôle de « tueur » étant assuré par l'OH-6 Cayuse, tous deux ayant servi avec distinction pendant la guerre du Vietnam. Bien que son surnom officiel soit « Cobra », il existe d'autres surnoms, notamment « HueyCobra » et « Snake »."
 CAP_attack_helicopter_equipment_2: "Bell AH-1S Cobra"
 CAP_attack_helicopter_equipment_2_short: "AH-1S Cobra"
 CAP_attack_helicopter_equipment_2_desc:0 "Le modèle de base AH-1S est un AH-1Q amélioré équipé d'un turbomoteur T53-L-703 de 1 800 ch (1 300 kW). L'AH-1S est équipé du sous-système de missiles M65 TOW/Cobra, d'un viseur télescopique M65 (TSU) et d'un viseur reflex M73."
 CAP_attack_helicopter_equipment_3: "Hughes AH-64A Apache"
 CAP_attack_helicopter_equipment_3_short: "AH-64A Apache"
 CAP_attack_helicopter_equipment_3_desc:0 "Introduit en 1986 pour remplacer l'AH-1 dans l'armée américaine, l'AH-64 est l'un des hélicoptères d'attaque les plus connus au monde. Il est équipé d'une suite de capteurs montés à l'avant pour l'acquisition de cibles et de systèmes de vision nocturne. Son armement typique (et célèbre) comprend un canon Chain Gun de 30 mm situé entre le train d'atterrissage et quatre points d'emport sur les ailes pour une combinaison de roquettes Hydra et de missiles antichars AGM-114 Hellfire. Surnommé « Apache », l'AH-64 représente le summum de l'aviation hélicoptère."
 CAP_attack_helicopter_equipment_4: "McDonnell Douglas AH-64D Longbow Apache"
 CAP_attack_helicopter_equipment_4_short: "AH-64D Apache Longbow"
 CAP_attack_helicopter_equipment_4_desc:0 "Fierté de l'armée américaine, outre sa superbe maniabilité, le radar Longbow fixé au-dessus du rotor principal améliore sa capacité à utiliser des missiles par tous les temps. Grâce à ce radar, il a été surnommé « Apache Longbow »."
 CAP_attack_helicopter_equipment_5: "McDonnell Douglas AH-64E Guardian"
 CAP_attack_helicopter_equipment_5_short: "AH-64E Guardian"
 CAP_attack_helicopter_equipment_5_desc:0 "L'AH-64E offre une connectivité numérique améliorée, le système tactique interarmées de distribution d'informations (Joint Tactical Information Distribution System), des moteurs T700-GE-701D plus puissants avec une transmission à engrenages frontaux améliorée pour fournir plus de puissance, la capacité de contrôler des véhicules aériens sans pilote (UAV), une capacité IFR complète et un train d'atterrissage amélioré. Les nouvelles pales de rotor en composite, qui ont passé avec succès les essais en 2004, augmentent la vitesse de croisière, la vitesse ascensionnelle et la capacité d'emport."
 CAP_scout_helicopter_equipment_1: "Hughes OH-6 Cayuse"
 CAP_scout_helicopter_equipment_1_short: "OH-6 Cayuse"
 CAP_scout_helicopter_equipment_1_desc:0 "Développé en 1960, l'OH-6 a été conçu dans le cadre du projet Light Observation Helicopter (LOH) à des fins d'observation, d'évacuation des blessés, de transport de personnel et d'attaque légère. Le modèle de Hughes a été retenu parmi onze autres modèles concurrents. Il a remplacé l'O-1 Bird Dog dans son rôle d'observation lorsque le ministère américain de la Défense a ordonné à l'armée américaine de transférer tous ses avions à voilure fixe à l'armée de l'air américaine. S'illustrant pendant la guerre du Vietnam, l'OH-6 avait démontré l'utilité des hélicoptères d'observation pour soutenir les hélicoptères d'attaque comme l'AH-1 ou les forces terrestres dans leurs combats contre l'ennemi. Officiellement connu sous le nom de « Cayuse » (d'après la tribu amérindienne du nord-ouest du Pacifique), les pilotes lui ont donné le surnom de « Loach » d'après le programme qui l'a vu naître."
 CAP_scout_helicopter_equipment_2: "Bell OH-58A Kiowa"
 CAP_scout_helicopter_equipment_2_short: "OH-58A Kiowa"
 CAP_scout_helicopter_equipment_2_desc:0 "Lancé en 1969, au plus fort de la guerre du Vietnam, l'OH-58 était un hélicoptère à quatre places dont la particularité était que, bien qu'il disposait de deux pilotes, les commandes du siège gauche pouvaient être retirées pour permettre à un passager de prendre place à l'avant. Pendant la guerre du Vietnam, son armement se composait d'un seul minigun M134 ou d'un lance-grenades M129. Après la guerre, l'OH-58 a subi de nombreuses modifications, avec une mise à niveau du moteur (le mettant au niveau du dernier OH-58C), un système d'imagerie thermique, un ensemble de communications pour les forces de l'ordre, un équipement de navigation amélioré et un train d'atterrissage surélevé. Ces variantes améliorées du « Kiowa » (du nom d'une tribu amérindienne originaire du Montana et du Colorado) ont participé aux opérations antidrogue RAID de la Garde nationale de l'armée."
 CAP_scout_helicopter_equipment_3: "Bell OH-58D Kiowa"
 CAP_scout_helicopter_equipment_3_short: "OH-58D Kiowa"
 CAP_scout_helicopter_equipment_3_desc:0 "La variante « D » améliorée du Kiowa était le résultat du programme d'amélioration des hélicoptères de l'armée (AHIP). Elle était dotée de caractéristiques telles qu'une transmission et un moteur améliorés pour les vols à très basse altitude, ainsi qu'une configuration unique à quatre pales du rotor principal qui la rendait beaucoup plus silencieuse que les autres hélicoptères, et plus encore que ses prédécesseurs. L'OH-58D a introduit le viseur monté sur mât (MMS) caractéristique au-dessus du système de rotor, ainsi qu'un cockpit en verre mixte, avec des instruments traditionnels identifiés comme « de secours » pour les situations d'urgence."
 CAP_scout_helicopter_equipment_4: "Bell OH-58D Kiowa Warrior"
 CAP_scout_helicopter_equipment_4_short: "OH-58D Kiowa Warrior"
 CAP_scout_helicopter_equipment_4_desc:0 "Le Kiowa Warrior, parfois désigné par son acronyme KW, est la version armée de l'OH-58D Kiowa. La principale différence qui distingue le Kiowa Warrior de l'appareil AHIP d'origine est un pylône d'armes universel monté des deux côtés de l'appareil. La mise à niveau du Kiowa Warrior comprend également des améliorations en termes de puissance disponible, de navigation, de communication et de survivabilité, ainsi que des modifications visant à améliorer la capacité de déploiement de l'appareil."
 CAP_scout_helicopter_equipment_5:0 "Eurocopter UH-72 Lakota"
 CAP_scout_helicopter_equipment_5_short:0 "UH-72 Lakota"
 CAP_scout_helicopter_equipment_5_desc:0 "L'UH-72 est conçu pour accomplir toute une série de missions, allant du soutien général et de l'évacuation médicale (MEDEVAC) au sauvetage de personnel et aux opérations de lutte contre le trafic de stupéfiants. Il est prévu qu'il remplace les UH-1 et OH-58A/C, qui sont des hélicoptères utilitaires légers plus anciens, ainsi que d'autres types d'appareils utilisés au niveau national, principalement ceux de la Garde nationale de l'armée. L'UH-72 est acheté en tant que produit commercial prêt à l'emploi (COTS), ce qui simplifie le soutien logistique de la flotte."
 CAP_utility_helicopter_equipment_1:0 "Sikorsky H-34 Choctaw"
 CAP_utility_helicopter_equipment_1_short:0 "H-34 Choctaw"
 CAP_utility_helicopter_equipment_1_desc:0 "Le Sikorsky H-34 (désignation de la société S-58, désignation de la marine HUS) est un hélicoptère militaire à moteur à pistons initialement conçu pour la lutte anti-sous-marine (ASW), mais qui a ensuite été réutilisé comme moyen de transport moyen. Il deviendra le dernier hélicoptère à moteur à pistons utilisé par le Corps des Marines des États-Unis, tous les hélicoptères utilisés depuis lors étant équipés de moteurs à turbine. Dans la marine (sous le nom d'UH-34), il est connu sous le nom de « Seahorse », tandis que les variantes de l'armée (sous le nom de CH-34) ont pris le nom de « Choctaw »."
 CAP_utility_helicopter_equipment_2:0 "Bell UH-1A Iroquois"
 CAP_utility_helicopter_equipment_2_short:0 "UH-1A Iroquois"
 CAP_utility_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connus sous le nom de « Huey » (du nom de sa désignation d'origine avant 1962, HU-1), l'UH-1A est la variante militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agit du premier hélicoptère utilisé par l'armée américaine à être équipé d'un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication des États-Unis dans la guerre du Vietnam. Bien qu'il soit communément appelé « Huey », son surnom officiel est « Iroquois »."
 CAP_utility_helicopter_equipment_3:0 "Bell UH-1D Iroquois"
 CAP_utility_helicopter_equipment_3_short:0 "UH-1D Iroquois"
 CAP_utility_helicopter_equipment_3_desc:0 "Lancé en 1963, l'UH-1D est la version militaire du Bell 205. Il a été conçu avec un fuselage allongé afin de pouvoir servir principalement comme hélicoptère de transport de troupes en remplacement du CH-34 Choctaw utilisé auparavant par l'armée américaine. 2 000 exemplaires de cette variante « Iroquois D » ont été construits, dont beaucoup ont été convertis à la norme UH-1H avec un moteur amélioré et plus puissant."
 CAP_utility_helicopter_equipment_4:0 "Bell UH-1N Twin Huey"
 CAP_utility_helicopter_equipment_4_short:0 "UH-1N Twin Huey"
 CAP_utility_helicopter_equipment_4_desc:0 "Lancé en 1970, l'UH-1N était un autre membre de la grande famille des « Huey », développé cette fois à partir de l'UH-1H. Contrairement aux UH-1A et UH-1D, c'est la variante « N » qui allait donner naissance à sa version civile, le Bell 212. Le rotor principal est alimenté par deux turbomoteurs qui entraînent un seul arbre de sortie. En cas de panne d'un moteur, le moteur restant peut fournir 671 kW (900 ch) pendant 30 minutes ou 571 kW (765 ch), ce qui permet à l'UH-1N de maintenir ses performances de croisière à son poids maximal. C'était également l'une des rares variantes « Iroquois » à ne pas être utilisée par l'armée américaine, mais plutôt par les Marines. Sa configuration bimoteur lui a valu le surnom informel de « Twin Huey »."
 CAP_utility_helicopter_equipment_5:0 "Sikorsky UH-60A Black Hawk"
 CAP_utility_helicopter_equipment_5_short:0 "UH-60A Black Hawk"
 CAP_utility_helicopter_equipment_5_desc:0 "Entré en service en 1979, l'UH-60A a succédé à l'UH-1 en tant qu'hélicoptère utilitaire de l'armée américaine. Développé à partir du modèle civil S-70, l'UH-60A pouvait transporter jusqu'à 15 personnes (4 membres d'équipage et jusqu'à 11 soldats équipés). Nommé d'après un chef tribal amérindien Sauk, le « Blackhawk » a servi au combat lors de conflits à la Grenade, au Panama, en Irak, en Somalie, dans les Balkans, en Afghanistan et dans d'autres régions du Moyen-Orient."
 CAP_utility_helicopter_equipment_6:0 "Sikorsky UH-60L Black Hawk"
 CAP_utility_helicopter_equipment_6_short:0 "UH-60L Black Hawk"
 CAP_utility_helicopter_equipment_6_desc:0 "Version améliorée de l'UH-60A, la variante « L » du « Blackhawk » est équipée de moteurs plus puissants, d'une boîte de vitesses plus résistante et d'un système de commande de vol modernisé. Lancé en 1990, l'UH-60L est la principale variante utilitaire du H-60 actuellement en service dans l'armée américaine. Il est également envisagé pour remplacer l'UH-1N dans l'armée de l'air américaine."
 CAP_utility_helicopter_equipment_7:0 "Sikorsky UH-60M Black Hawk"
 CAP_utility_helicopter_equipment_7_short:0 "UH-60M Black Hawk"
 CAP_utility_helicopter_equipment_7_desc:0 "Pales de rotor à corde large de conception améliorée, moteurs T700-GE-701D (puissance maximale de 2 000 ch ou 1 500 kW chacun), boîte de vitesses à durabilité améliorée, ordinateur intégré IVHMS (Integrated Vehicle Health Management System) et nouveau cockpit en verre."
 CAP_cargo_helicopter_equipment_1:0 "Boeing CH-47A Chinook"
 CAP_cargo_helicopter_equipment_1_short:0 "CH-47A Chinook"
 CAP_cargo_helicopter_equipment_1_desc:0 "Le CH-47 (à l'origine HC-1B) est un hélicoptère bimoteur à double rotor qui figure parmi les hélicoptères de transport les plus lourds de l'Occident. Remplaçant le CH-37 Mojave, le CH-47 dispose de plusieurs moyens pour charger diverses marchandises, notamment plusieurs portes sur le fuselage, une large rampe de chargement située à l'arrière du fuselage et un total de trois crochets de chargement ventraux externes pour transporter des charges suspendues. Il était également l'hélicoptère le plus rapide de son époque lors de son lancement en 1962, et il est toujours considéré comme l'un des hélicoptères les plus rapides de l'arsenal actuel de l'armée américaine. Son nom, « Chinook », vient du peuple amérindien Chinook de l'État actuel de Washington."
 CAP_cargo_helicopter_equipment_2:0 "Sikorsky CH-53A Sea Stallion"
 CAP_cargo_helicopter_equipment_2_short:0 "CH-53A Sea Stallion"
 CAP_cargo_helicopter_equipment_2_desc:0 "Le CH-47 (à l'origine HC-1B) est un hélicoptère bimoteur à double rotor qui figure parmi les hélicoptères de transport les plus lourds de l'Occident. Remplaçant le CH-37 Mojave, le CH-47 dispose de plusieurs moyens pour charger diverses marchandises, notamment plusieurs portes sur le fuselage, une large rampe de chargement située à l'arrière du fuselage et un total de trois crochets de chargement ventraux externes pour transporter des charges suspendues. Il était également l'hélicoptère le plus rapide de son époque lors de son lancement en 1962, et il est toujours considéré comme l'un des hélicoptères les plus rapides de l'arsenal actuel de l'armée américaine. Son nom, « Chinook », vient du peuple amérindien Chinook de l'État actuel de Washington."
 CAP_cargo_helicopter_equipment_3:0 "Boeing CH-47D Chinook"
 CAP_cargo_helicopter_equipment_3_short:0 "CH-47D Chinook"
 CAP_cargo_helicopter_equipment_3_desc:0 "Le CH-47D partage la même cellule que les modèles précédents, la principale différence étant l'adoption de moteurs plus puissants. Les premiers CH-47D étaient à l'origine équipés de deux moteurs T55-L-712, mais le moteur le plus courant est le T55-GA-714A, plus récent. Grâce à son système de chargement à triple crochet, le CH-47D peut transporter des charges lourdes à l'intérieur et jusqu'à 12 000 kg (26 000 lb) à l'extérieur (par exemple des conteneurs de 40 pieds ou 12 mètres). Il a été mis en service pour la première fois en 1979. Dans les opérations d'assaut aérien, il sert souvent de principal moyen de transport pour l'obusier M198 de 155 mm, accompagné de 30 cartouches de munitions et d'un équipage de 11 hommes."
 CAP_cargo_helicopter_equipment_4:0 "Sikorsky CH-53E Super Stallion"
 CAP_cargo_helicopter_equipment_4_short:0 "CH-53E Super Stallion"
 CAP_cargo_helicopter_equipment_4_desc:0 "En octobre 1967, le Corps des Marines des États-Unis a émis une demande pour un hélicoptère doté d'une capacité de levage 1,8 fois supérieure à celle du CH-53D et pouvant être embarqué sur des navires de guerre amphibies. À cette époque, la Marine et l'Armée de terre américaines recherchaient également des hélicoptères similaires. Avant la publication de cette demande, Sikorsky travaillait déjà à l'amélioration du CH-53D, sous la désignation « S-80 », avec un troisième turbomoteur et un système de rotor plus puissant. Sikorsky a proposé le modèle S-80 aux Marines en 1968. Les Marines ont apprécié l'idée, car elle promettait d'apporter rapidement une bonne solution, et ont financé le développement d'un hélicoptère d'essai à des fins d'évaluation. Le contrat de production initial a été attribué en 1978, et la mise en service a suivi en février 1981."
 CAP_cargo_helicopter_equipment_5:0 "Boeing CH-47D Chinook Block II"
 CAP_cargo_helicopter_equipment_5_short:0 "CH-47D Block II"
 CAP_cargo_helicopter_equipment_5_desc:0 "CH-47D modernisé avec une avionique avancée, des instruments GPS et une amélioration de la capacité de survie. Presque tous les anciens Chinook ont été mis à niveau selon cette norme."
 CAP_cargo_helicopter_equipment_6:0 "Boeing CH-47F Chinook"
 CAP_cargo_helicopter_equipment_6_short:0 "CH-47F Chinook"
 CAP_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, une version améliorée du CH-47D, a effectué son vol inaugural ; le premier modèle de série a été présenté le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les améliorations comprennent des moteurs Honeywell de 4 868 chevaux-vapeur (3 630 kW) et une cellule plus robuste, construite d'une seule pièce afin de réduire les besoins d'entretien. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion afin d'augmenter la durée de vie."
 CUM_infantry_equipment_0:0 "Mosin wz. 91/30"
 CUM_infantry_equipment_0_short:0 "Mosin"
 CUM_infantry_equipment_0_desc:0 "Le Mosin-Nagant est un fusil à verrou impérial russe utilisé par l'Empire russe et inspiré d'un modèle importé de France. En 1889, le GAU (ministère de la Défense de l'Empire russe) acquit le Lebel-1886 auprès de la France et chercha à améliorer sa conception. Divers scientifiques et ingénieurs russes ont été engagés par le ministère et dirigés par le capitaine Sergei Mosin et Leon Nagant pour l'améliorer. Après une longue série d'essais et de prototypes, ils ont produit le Mosin Nagant. En 1891, la production du fusil à verrou conçu par Mosin fut lancée. Ce fusil nécessite un long temps de démontage, mais se distingue par sa grande précision. Il fut largement utilisé pendant la guerre russo-japonaise, la Première Guerre mondiale, la guerre civile au sein de l'Empire russe qui conduisit à la formation de l'Union soviétique, la Seconde Guerre mondiale et de nombreux conflits à travers le monde."
 CUM_infantry_equipment_1:0 "Avtomat Kalashnikova 1947"
 CUM_infantry_equipment_1_short:0 "AK-47"
 CUM_infantry_equipment_1_desc:0 "L'AK-47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais il n'entra en service actif qu'en 1948, date à laquelle la version à crosse fixe fut mise en production. Début 1949, l'AK-47 fut adopté par les forces armées soviétiques pour un déploiement massif au sein des unités de première ligne. Doté d'un piston à gaz à longue course, d'un sélecteur de tir avec sécurité, d'un mécanisme de détente et d'alimentation automatique, ainsi que d'autres améliorations de conception, l'AK-47 représentait une nette amélioration par rapport au SKS. Pendant de nombreuses années, l'AK-47 fut considéré comme l'une des armes les plus fiables, faciles à entretenir, à manier et à apprendre au monde."
 CUM_infantry_equipment_2:0 "AKM"
 CUM_infantry_equipment_2_short:0 "AKM"
 CUM_infantry_equipment_2_desc:0 "L'AKM est une version modernisée de l'AK-47, développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'Armée soviétique en 1959. L'arme a été largement optimisée et repensée pour répondre aux besoins de l'armée en pleine modernisation. De nombreuses pièces ont été simplifiées pour la production de masse et le boîtier en acier usiné a été remplacé par une pièce en acier emboutie en forme de U afin d'améliorer les cadences de production. Grâce à ces simplifications, l'arme était également beaucoup plus légère, son poids étant réduit d'environ 30 %. De plus, elle a été renforcée pour une meilleure robustesse et des rails de guidage ont été ajoutés pour faciliter le mouvement du porte-culasse. L'AKM a été immédiatement et largement utilisée par de nombreux pays communistes et produite pour les conflits tout au long de sa durée de vie. On peut notamment citer l'invasion de la Tchécoslovaquie, où elle a été utilisée par les deux camps."
 CUM_infantry_equipment_3:0 "AK-74"
 CUM_infantry_equipment_3_short:0 "AK-74"
 CUM_infantry_equipment_3_desc:0 "L'AK74 est un fusil d'assaut moderne développé par Mikhaïl Kalachnikov pour remplacer l'AKM en 1974. Il utilise une cartouche plus petite et un canon chromé amélioré avec 4 rainures à droite. Le guidon et le bloc de gaz ont été redessinés pour contenir un canal bas installé à 90 degrés par rapport à l'axe du canon afin de réduire le cisaillement des balles au niveau de la fenêtre d'éjection. De plus, son développement s'est accompagné de divers accessoires, notamment une crosse rembourrée en caoutchouc. Les améliorations apportées à l'AK74 ont permis aux soldats de transporter une plus grande quantité de munitions sur le terrain et de maintenir un volume de tir plus élevé avec une précision accrue à moyenne distance. Il a été utilisé à grands frais pendant le conflit en Afghanistan, où la CIA a versé une somme importante aux moudjahidines pour récupérer un AK74 capturé."
 CUM_infantry_equipment_4:0 "AK-74M"
 CUM_infantry_equipment_4_short:0 "AK-74M"
 CUM_infantry_equipment_4_desc:0 "L'AK-74M est une variante améliorée de l'AK-74 développée en 1991 par l'usine Izhmash. L'AK-74M a été développé afin d'intégrer de nouveaux matériaux et des avancées technologiques dans la fabrication pour créer une arme améliorée. Il est équipé d'un verrou et d'un porte-verrou allégés qui réduisent le recul produit par le piston à gaz. Le fusil comprend également une crosse en polyamide renforcé de fibre de verre qui peut être tenue sur le côté, un canon amélioré, un couvercle renforcé et plusieurs autres améliorations mineures. Il est également équipé d'un rail pour le montage d'optiques. Le fusil allégé et renforcé était plus facile à manipuler et à transporter et offrait un meilleur support pour les accessoires. Il n'a pas été adopté par l'Union soviétique, car l'URSS s'est effondrée avant qu'il puisse être envisagé, mais il a été adopté par la Fédération de Russie."
 CUM_lt_equipment_1:0 "T-60"
 CUM_lt_equipment_1_short:0 "T-60"
 CUM_lt_equipment_1_desc:0 "Le T60 était un char léger fabriqué pour remplacer le T-38 dans son rôle de reconnaissance. Il a été conçu en 1941 par Nicholas Astrov et 6 300 exemplaires ont été produits au cours des deux années de sa fabrication. Ce véhicule était un char à deux membres d'équipage équipé d'un moteur 6 cylindres et pouvant atteindre une vitesse de 44 km/h, avec un canon principal de 20 mm. Il a été largement utilisé pendant la Seconde Guerre mondiale."
 CUM_lt_equipment_2:0 "T-70"
 CUM_lt_equipment_2_short:0 "T-70"
 CUM_lt_equipment_2_desc:0 "Le char léger T-70 était un char de reconnaissance de la Seconde Guerre mondiale fabriqué pour remplacer le PT60. Nicholas Astrov a commencé à travailler immédiatement après le PT60 et aterminé en 1942. Au cours des 2 années de fabrication, 8 300 ont été produits. Le char avait un canon bien plus gros de 45 mm et était équipé de 2 moteurs GAZ-202 et pouvait atteindre jusqu'à 45 km/h. Le T-70 avait également une capacité optique nominalement améliorée, Il a été largement utilisé pendant la Seconde Guerre mondiale. "
 CUM_lt_equipment_3:0 "PT-76"
 CUM_lt_equipment_3_short:0 "PT-76"
 CUM_lt_equipment_3_desc:0 "Le PT-76 est un char léger amphibie soviétique qui a été largement exporté à travers le monde. Il a été conçu par Nikolai Shashmyrin et Zh. Kotin en 1951, et environ 12 000 exemplaires ont été produits. Il nécessite un équipage de trois hommes et est équipé d’un moteur V6 six cylindres en ligne, lui permettant d’atteindre une vitesse de 44 km/h sur terre et de nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique ou proches de l’Union soviétique et a ainsi rempli un rôle de reconnaissance dans pratiquement tous les conflits impliquant des nations de cette sphère. Toutefois, il est encore utilisé aujourd’hui par de nombreux pays en raison de sa fiabilité réputée et de sa facilité d’entretien."
 CUM_lt_equipment_4:0 "PT-76B Modèle 4"
 CUM_lt_equipment_4_short:0 "PT-76B"
 CUM_lt_equipment_4_desc:0 "Le PT-76 est équipé d'un canon rayé D-56TS de 76,2 mm (frein de bouche à double déflecteur, éjecteur de douilles, extracteur de fumée et système de stabilisation à deux axes STP-2P « Zarya »), du système de protection PAZ (protivo-atomnaya zashchita) , un système d'extinction automatique d'incendie, un viseur TShK-2-66 amélioré, un système de filtration-ventilation, des dispositifs d'observation améliorés, un équipement électrique amélioré, un nouveau moteur diesel V-6B 6 cylindres 4 temps en ligne refroidi par eau développant 263 ch (196 kW) à 1800 tr/min et des réservoirs de carburant internes supplémentaires pour lesquels la forme du blindage a dû être légèrement modifiée."
 CUM_lt_equipment_5:0 "BRM-1K"
 CUM_lt_equipment_5_short:0 "BRM-1K"
 CUM_lt_equipment_5_desc:0 "Le BRM-1K est un véhicule d'origine soviétique de reconnaissance datant de la fin de la Guerre froide. Il a été développé pour soutenir les formations blindées et mécanisées employées par les forces soviétiques. Le BRM-1K devait repérer les routes et détecter les formations ennemies."
 CUM_lt_equipment_6:0 "BRM-3K"
 CUM_lt_equipment_6_short:0 "BRM-3K"
 CUM_lt_equipment_6_desc:0 "Le BRM-3K Rys a été développé au début des années 1990. Il était destiné à compléter et à remplacer le véhicule de reconnaissance BRM-1K. Il est basé sur le châssis du véhicule de combat d'infanterie BMP-3. Bien que le BRM-3K ait été officiellement accepté au service de l'armée russe en 1995, il est toujours produit en petite série."
 CUM_ht_equipment_1:0 "IS-2"
 CUM_ht_equipment_1_short:0 "IS-2"
 CUM_ht_equipment_2:0 "IS-3"
 CUM_ht_equipment_2_short:0 "IS-3"
 CUM_ht_equipment_3:0 "IS-4"
 CUM_ht_equipment_3_short:0 "IS-4"
 CUM_ht_equipment_4:0 "T-10"
 CUM_ht_equipment_4_short:0 "T-10"
 CUM_ht_equipment_5:0 "T-10M"
 CUM_ht_equipment_5_short:0 "T-10M"
 CUM_mbt_equipment_0:0 "T-34-85"
 CUM_mbt_equipment_0_short:0 "T-34-85"
 CUM_mbt_equipment_0_desc:0 "Le T-34 est un char moyen soviétique qui a révolutionné le domaine de la conception des chars et qui est réputé pour sa fiabilité. Le T-34 a été conçu en 1940 par KMBD en Union soviétique. Afin de réduire les coûts, un blindage incliné a été intégré à la conception du char. Cependant, cela a également permis d'améliorer considérablement la protection du char et de réduire son coût grâce à une surface plus petite. L'arme elle-même est un canon de 76,2 mm et avait une capacité nominale de transport de munitions. Cependant, les viseurs et les dispositifs de vision étaient particulièrement médiocres, ce qui rendait leur utilisation difficile pour les commandants de chars, et leur faible capacité de coordination réduisait considérablement les avantages offerts par le char lui-même. Le T-34 est devenu le deuxième char le plus produit au monde, mais l'un des plus importants de la Seconde Guerre mondiale. Les T-34 sont encore utilisés aujourd'hui par les insurgés et les pays pauvres."
 CUM_mbt_equipment_1:0 "T-44"
 CUM_mbt_equipment_1_short:0 "T-44"
 CUM_mbt_equipment_1_desc:0 "Le T-44 est un char soviétique moyen fabriqué vers la fin de la Seconde Guerre mondiale. Il offrait une meilleure mobilité et un blindage plus résistant, ainsi qu'un canon principal plus lourd de 85 mm. Il a été conçu par AA Morozov en 1944, mais peu d'exemplaires ont été construits, car ce char était considéré comme trop coûteux par rapport aux avantages qu'il offrait. Seuls 2 000 exemplaires ont été construits avant que la production ne revienne au T-34."
 CUM_mbt_equipment_2:0 "T-54"
 CUM_mbt_equipment_2_short:0 "T-54"
 CUM_mbt_equipment_2_desc:0 "Le char T-54 est le char le plus produit de l'histoire. Conçu en 1946 par KMBD, il est équipé d'un canon rayé de 100 mm et d'un blindage à épaisseur variable, de 60 à 205 mm. Son moteur diesel V12 de 38,88 litres et sa suspension à barres de torsion lui permettent d'atteindre une vitesse de 48 km/h. Utilisé par plus de 50 armées à travers le monde, il a été produit dans tout le bloc soviétique et a participé à tous les conflits qui y ont été liés."
 CUM_mbt_equipment_3:0 "T-55"
 CUM_mbt_equipment_3_short:0 "T-55"
 CUM_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. Le bureau d'études OKB-520 a modifié la conception du T-55 en améliorant sa protection NBC, en optimisant son moteur, en redessinant la tourelle et en ajoutant des équipements auxiliaires tels qu'un système de conduite de tir et des optiques améliorés. De plus, le T-55 utilisait plus fréquemment la mitrailleuse lourde DShK de 12,7 mm, tandis que le T-54 était équipé du canon SGMT de 7,62 mm, ce qui lui conférait une puissance de feu supérieure, mais limitait sa capacité d'emport de munitions. Le T-55 a été utilisé dans autant d'armées que le T-54 et a généralement participé aux mêmes conflits."
 CUM_mbt_equipment_4:0 "T-62"
 CUM_mbt_equipment_4_short:0 "T-62"
 CUM_mbt_equipment_4_desc:0 "Le T-62 est une évolution du char T-55. Il est équipé d'un canon à âme lisse et possède un blindage légèrement plus épais. Le calibre du canon principal a également été porté à 115 mm. Commandé initialement par l'Union soviétique dans le but d'améliorer sa puissance de feu, le projet fut achevé par le bureau d'études OKB-520 vers 1960. Malgré ses améliorations, sa production ne fut pas arrêtée, son coût étant nominalement supérieur à celui du T-55. Plus de 22 700 T-62 furent construits et il participa à de nombreux combats dans la sphère d'influence soviétique, notamment au Moyen-Orient. Ses améliorations démontrèrent une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique."
 CUM_mbt_equipment_5:0 "T-64A"
 CUM_mbt_equipment_5_short:0 "T-64A"
 CUM_mbt_equipment_5_desc:0 "Le T-64 est un char de combat principal soviétique qui a bénéficié de nombreuses modernisations par rapport au T-62 et qui peut être considéré comme la continuation des améliorations apportées entre le T-55 et le T-62. Il est équipé d'un moteur plus compact, d'un blindage composite, d'auxiliaires moteur améliorés et d'un canon principal de 125 mm avec chargeur automatique. Conçu en 1962 par KMBD, ce char présentait de nombreuses améliorations par rapport à son prédécesseur, mais à un coût nettement plus élevé. Le moteur était un moteur diesel 5 cylindres 5TDF qui offrait une plus grande autonomie et des vitesses plus élevées. Il était destiné à être mis au rebut, mais a été maintenu en production grâce à l'influence politique de son concepteur en chef. Alexander Morozov, le concepteur en chef, a fait valoir que malgré son coût, il s'agissait d'une conception nettement supérieure qui en valait la peine. Cela ne s'est pas avéré être le cas lors de la guerre dans le Donbass et de la guerre en Transnistrie. Il a été remplacé par le T-72, beaucoup plus rentable."
 CUM_mbt_equipment_6:0 "T-72"
 CUM_mbt_equipment_6_short:0 "T-72"
 CUM_mbt_equipment_6_desc:0 "Le T-72 est un char de combat principal soviétique conçu comme une nouvelle génération de blindés, destiné à remplacer le T-62 et son équivalent plus coûteux, le T-64. Conçu par Leonid Venediktov et finalisé en 1973, il offrait d'importantes améliorations tout en coûtant presque deux fois moins cher que le T-64. Il conserve un canon de 125mm et un blindage composite, mais dans un design optimisé pour une production plus économique. Son moteur V-12 de 780 chevaux pouvait être modernisé jusqu'à 1 130 chevaux, lui permettant d'atteindre une mobilité exceptionnelle avec des vitesses allant jusqu'à 80 km/h et une meilleure adaptation aux terrains difficiles par rapport au T-64. Contrairement à ce dernier, le T-72 a été largement utilisé dans l’ensemble du bloc soviétique et s’est illustré dans de nombreux conflits en Afrique, au Moyen-Orient et en Indochine."
 CUM_mbt_equipment_7:0 "T-80U"
 CUM_mbt_equipment_7_short:0 "T-80U"
 CUM_mbt_equipment_7_desc:0 "Le T-80 est un char de combat principal soviétique conçu selon la doctrine de haute mobilité établie par le T-72. Le KMBD a commencé à le concevoir en 1964 et l'a achevé en 1975 après 11 ans de travail. La coque elle-même est constituée d'un blindage composite amélioré et épaissi et est équipée d'un canon à âme lisse amélioré. Il peut également être équipé d'un armement à roquettes pour une puissance de feu accrue. Il a une portée plus courte que le T-72 et une vitesse légèrement inférieure, malgré une transmission et un moteur à turbine à gaz plus avancés. Il a été utilisé lors des guerres de Tchétchénie et de la guerre du Donbass, mais n'a pas été aussi largement utilisé que le T-72."
 CUM_mbt_equipment_8:0 "T-90"
 CUM_mbt_equipment_8_short:0 "T-90"
 CUM_mbt_equipment_8_desc:0 "Après l'échec du T-80 à remplacer le T-72 ou à démontrer des capacités nettement supérieures, Kartsev-Venediktov a cherché à améliorer encore le char et à lui conférer des capacités supérieures à celles du T-80. La conception a été achevée vers 1990. Le moteur a été remplacé par un moteur diesel 12 cylindres, plus lent que celui du T-80, mais doté d'une puissance de feu beaucoup plus élevée. Le canon a été modernisé, le système de contrôle de tir amélioré, le blindage considérablement renforcé et de nombreux équipements auxiliaires ont été ajoutés, notamment un brouilleur ATGM et des lance-fumigènes. Il a été utilisé au combat au Daghestan et dans le Donbass."
 CUM_mbt_equipment_9:0 "T-84N"
 CUM_mbt_equipment_9_short:0 "T-84N"
 CUM_mbt_equipment_9_desc:0 "Les travaux de modernisation du char T-80UD ont débuté en 1992. Le T-84N est équipé d'une nouvelle jupe latérale blindée, d'une nouvelle tourelle soudée avec un chargeur automatique dans la niche arrière, d'un nouveau blindage réactif, d'un groupe auxiliaire de puissance (APU), d'un viseur thermique, d'un système de navigation par satellite, d'un télémètre laser pour le commandant et d'autres améliorations."
