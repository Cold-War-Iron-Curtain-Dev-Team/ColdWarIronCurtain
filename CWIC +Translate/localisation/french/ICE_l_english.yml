 ICE_elections.1.d:0 "With the coming of the elections the coalition that ruled the nation before and since the end of the war finally disbands. With the memory of the anti-NATO riot still fresh on minds the question of re-militarization and Cold War involvement, among other issues such as the worsening economy and fishing rights, is expected to be deciding factors for the populace. The parliamentary seats will be fought for by the 4 main parties:\n\nThe liberal conservative Independence Party. Largest party in the parliament and successor of the political parties of the kingdom period.\n\nThe agrarian Progressive Party. Representing the rural population and positioning themselves in the center, they're close supporters of the Independence Party.\n\nThe social democratic People's Party. Popular among the urban populace for its pro-worker and pro-welfare policies, they offer a more western aligned alternative to socialists. They've led the coalition in its last years.\n\nThe socialist People's Unity Party - Socialist Party. Formed after the merger of Communist Party of Iceland with the radical elements within the People's Party; they're staunchly against NATO participation and American presence on the island, instead promoting warmer relations with the Eastern Bloc."
 ICE_elections.2.d:0 "The presidential election, ordinarily held after the parliamentary election, were to be held today if an opposing candidate was declared against the incumbent president Sveinn Björnsson.\n\nPreviously serving as the last regent of the Kingdom Era, Björnsson has been occupying the seat of the presidency ever since he declared the countries independence from Denmark 5 years ago. This makes him undoubtedly popular with the Icelandic citizens while earning the resentment of the King in Denmark.\n\nAs president Björnsson has show to be a stern, formal man and deeply involved with the governmental policies. With him at the helm it's expected any government formed will be to his liking."
 ICE_elections.3.d:0 "The Nation mourns today as we bid farewell to His Excellency, President and Father of the Republic. Although his sudden death has come as a shock to many; in reality the late President's health has been steadily declining since 1947, with his third tenure making it worse.\n\nAn official state funeral will be held for the late President in Reykjavík where his coffin shall be carried through the snowy streets onto the parliament, and from there to his final resting place.\n\nAlthough its father is now gone, the Republic lives on. The election for the next president will be held in five months time."
 ICE_elections.4.d:0 "The time has come for the people of Iceland to elect the successor of the late Björnsson. Since the president is responsible with appointing the prime minister according to his own personal judgement, this election is as important politically as it is spiritually.\n\nThe candidate supported by the left wing parties is former Prime Minister Ásgeir Ásgeirsson. A diplomatic man, he has shown interest in improving Iceland's place among its maritime neighbors. Other observers claim he would continue his predecessors policy of deep government involvement, making sure the left wing parties always have a say in the government.\n\nSupport among the right wing candidates, on the other hand, is divided. While the majority of the party members and the press support Rev. Bjarni Jónsson, a minister at the Reykjavík Cathedral; a third candidate has declared his intention to enter the race, Speaker of the Parliament Gísli Sveinsson. As President; Jónsson would adopt a hands-off approach to government workings, instead focusing on connecting with the people and working to better the lives of common folk.\n\nIf he can acquire Sveinsson's endorsement, that is."
 ICE_elections.5.d:0 "With only three months left to the election, a number members from Progressive, Socialist and People's parties have come together to announce foundation of their new political party. Naming itself the National Defense Party the group is headed by the duo Bergur Sigurbjörnsson and Gils Guðmundsson, and is catering towards a social liberal audience that is disgruntled with the current political landscape.\n\nThe Party's main agenda seems to be an absolute rejection of any and all military involvement with foreign powers, supporting instead a neutral foreign policy with the country's defense left to be handled by Icelanders. This, along with their more economically liberal views, makes them a potential danger to the united power of the left wing parties. Or should they decide to cooperate with them, they could become a key ally in breaking the Independence Party's parliamentary majority."
 ICE_liberals.0.d:0 ""
 ICE_liberals.1.d:0 "In spite of months of work reforming and refining our national economy the main problems addressed are yet to show improvement. Because we failed to establish a deficit-free budget on top of the monetary aid we receive from the United States the inflation has  now skyrocketed to levels that we did not foresee when we first formed our government. The subsidies and salary increases we previously introduced has smoothed things out for a period however with the rising inflation we are in risk of facing a threat to the everyday Icelandic life.\n\nAlready our parliamentary supporters, the Progressive Party, has opened dialogue with the other groups to find a solution among themselves."
 ICE_liberals.2.d:0 "As we expected from the last couple weeks of declarations against the governmental policies, a motion of no confidence has officially been called by the head of the Progressive Party. As per the President's request, a 2 round parliamentary debate will be held with each party receiving 30 minutes of speech time for the first and 15 for the second round.\n\nSince the debate will be on a live radio broadcast the debaters are speaking not just to their colleagues but to their fellow countrymen, making this an important opportunity for the common folk to learn what's really going down in the country.\n\nThe first to give his speech was Hermann Jónsson, head of the Progressive Party. His speech can be described as blaming the current hardships on the current and previous government and claiming to have warned the other parties of consequences to no avail."
 ICE_socialists.1.d:0 "Recent electoral gains made by the Socialists has expectedly emboldened the neutrality supporters who once again has taken to streets of Reykjavík. Like in March of this year, people have gathered in front of the Parliament protesting and demanding the end of American military presence on the island and an immediate withdrawal from NATO. Standing between them and the Parliament building are the supporters of the current government, intending to defend it once again.\n\nEventually the local police force intervened on the situation and the crowd were violently dispersed. The amount of rioters however were significantly larger than it was last time, and small skirmishes between opposite groups kept up until nighttime.\n\nThe Police will be put on high alert for the remainder of the month however with the things are the way they are now, a city wide riot may be soon to come."
 ICE_socialists.2.d:0 ""
