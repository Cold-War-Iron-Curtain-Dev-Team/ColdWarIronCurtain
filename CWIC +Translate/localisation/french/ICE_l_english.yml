 ICE_An_Update_To_Social_Security_desc:0 ""
 ICE_Funding_To_Universities_Students:0 "Focus Funding On Higher Education"
 ICE_Funding_To_Universities_Students_desc:0 ""
 ICE_Appease_Anti_NATO_Crowd:0 "Appease The Anti-Nato Crowd"
 ICE_Appease_Anti_NATO_Crowd_desc:0 "With each passing day the situation in the capital and rest of the island worsens. We have no plans of leaving our allies after coming this far, but the people's concerns has to be addressed before the next big uproar. By seeking less help from the U.S. government and promising people what they want to hear we can earn ourselves valuable time without destroying our fruitful relationship with the West."
