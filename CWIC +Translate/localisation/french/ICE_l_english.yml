 ICE_Support_Faroese_Independence:0 "Support Faroese Independence"
 ICE_Support_Faroese_Independence_desc:0 "The Faroese have long been subjects of the Danish Crown, much like we were until recently. Although they had their own successful independence referendum after the war the King responded to it by declaring it null and dissolving the Faroese parliament. Because of our similar circumstances, the Faroese and us have developed a common culture and tongue much different than the ones our mainland brethren have. If we really want to promote lasting peace and cooperation between Nordic countries, our priority must be seeing the wishes of our southern brothers fulfilled."
 ICE_Defense_Of_Iceland:0 "Defense of Iceland"
 ICE_Defense_Of_Iceland_desc:0 "Iceland has not had a standing military for the past 80 years. The last attempts were back during the war when we tried organizing the National Police into a military force, but the British invasion and the occupation period ended that endeavor. Our people has long renounced war and show disdain towards any sort of militarization beyond what is necessary, as shown by the riots following our signing of the North Atlantic Treaty. But times are changing, we will have to decide on a permanent solution to national defense before the next war comes home."
 ICE_Defense_Of_Iceland_Agreement:0 "The Defense of Iceland Agreement"
 ICE_Defense_Of_Iceland_Agreement_desc:0 ""
 ICE_Renovate_Keflavik_Military_Structures:0 "Renovate Keflavik's Military Structures"
 ICE_Renovate_Keflavik_Military_Structures_desc:0 ""
 ICE_Renovate_Keflavik_Civillian_Structures:0 "Renovate Keflavik's Civillian Structures"
 ICE_Renovate_Keflavik_Civillian_Structures_desc:0 "The Keflavik Airbase isn't just a military run radar station, it also houses the biggest airport on the island and is our primary connection to the outside world. Renovation of civilian airport facilities for international flights is within our duty according to the agreement. Iceland is a place of many natural beauties, and allowing people to come and see it for themselves will allow us to start a small tourism industry."
 ICE_Incorporate_Radar_Systems:0 "Incorporate American Radar Systems"
 ICE_Incorporate_Radar_Systems_desc:0 ""
 ICE_Increased_Presence_Of_US_Interceptors:0 "Increase Presence of US Interceptors"
 ICE_Increased_Presence_Of_US_Interceptors_desc:0 ""
 ICE_Icelandic_Defense_Force:0 "The Icelandic Defense Force"
 ICE_Icelandic_Defense_Force_desc:0 "We can't rely on outside powers to oversee our security for us. Values and leaders change with time, today's friends can be tomorrows enemies. Only a truly Icelandic force can guarantee loyalty to the end. Instead of chaining ourselves to the Americans, we will approach them as equals like the rest of the NATO countries. And we will be the masters of our own destiny!"
