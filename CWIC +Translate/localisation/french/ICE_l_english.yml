l_english:
 ICE_Icelands_Place_In_Cold_War:0 "Iceland's Place In The Cold War"
 ICE_Icelands_Place_In_Cold_War_desc:0 "Although officially aligning ourselves with the United States and their military alliance proved a divisive move at home, the communist coup in Czechoslovakia showed us that there's no guarantee the great powers shall respect our neutral global stance. To protect our democratic freedoms American protection must be kept close, but permitting servitude to stars and stripes won't be any better. We must consider our future carefully and tread accordingly."
 ICE_Market_Town_Land_Reform:0 "Utilize Culvitable Land In Market Towns"
 ICE_Market_Town_Land_Reform_desc:0 "Ours is a nation with limited space that can be allocated to farming, requiring farming space to be used to it's full potential. A new law signed in by the prime minister will allow the central government to allocate arable land in more populated areas to agriculture and other areas as deemed necessary."
 ICE_Fruits_Of_Inflation_Control:0 "Fruits Of Focused Inflation Control"
 ICE_Fruits_Of_Inflation_Control_desc:0 "Despite our economy stagnating since the end of the war the coalition government's careful economic planning has managed to keep us afloat. Headed by the People's Party, this carefully checked bookkeeping along with financial support provided by the Marshall Plan allowed us to have greater economic capability than we normally would've had."
 ICE_1949_Elections:0 "The 1949 Parliamentary Election"
 ICE_1949_Elections_desc:0 "The elections of '49 is expected to be a turbulent one. The three party coalition is on the verge of collapse, as all have different ideas and policies on stimulating our economy. With only 35 seats to grab, no matter who comes out on top, concessions has to be made and a new coalition must be formed!"
 ICE_Independence_Progressive_Coalition:0 "Independence Party With Progressive Support"
 ICE_Independence_Progressive_Coalition_desc:0 "As expected; the Independence Party has managed to protect its parliamentary lead, and the party chairman Ólafur Thors has been tasked by the President to form the new government. Although we still lack an absolute majority to safely form a government ourselves; a little dialogue with our friends at the Progressive Party will earn us their support, without a need to form a coalition. After all, it's either us or the socialists..."
 ICE_Leftist_Coalition:0 "A Left Wing Coalition"
 ICE_Leftist_Coalition_desc:0 "To the surprise of many, the left wing parties combined are now occupying the majority of the seats in the parliament by a small margin. This shows that while many previously supported the traditional parties, the NATO involvement and liberal policies are too big issues to not change course. With the President of the Republic being a well known anti-socialist; the role of forming a new government once again falls on the social democratic People's Party, despite their minority numbers."
 ICE_Build_New_Herring_Factories:0 "Utilization of Herring Broth"
 ICE_Build_New_Herring_Factories_desc:0 "Fishing and agriculture is the lifeline of our economy. If we are to break this downward spiral we must use our strengths to its fullest. The Bill on Construction of a Plant for the Utilization of Herring Broth, effective immediately, will allow the government to freely build processing plants that will work in tandem with the existing herring works to maximize production by directly supplying necessary substances accordingly."
 ICE_Economic_Restructuring:0 "Economic Restructuring"
 ICE_Economic_Restructuring_desc:0 "Stimulating economy without causing a mass unemployment requires us to pass the planned laws back to back in the parliament. Exchange rates need to be discussed, wages need to be changed, property taxes and production charges need to be set... The new model of economy will put the National Bank and its institutions on the forefront and help bring stable growth back into the country."
 ICE_Pursue_Free_Trade:0 "Pursue Free Trade"
 ICE_Pursue_Free_Trade_desc:0 "Our recent entry into the western powers' sphere should, naturally, be followed up with integrating their economic values as well as their democratic ones. Official talks conducted with Dr. Benjamín Eiríksson, who himself is an economic adviser on the IMF Board, further supports our need to further open up our country to trade and investment."
 ICE_Progressive_Led_Coalition:0 "Progressive Led Coalition"
 ICE_Progressive_Led_Coalition_desc:0 "As we reach the conclusion of the no confidence vote things are looking bleak for the Thors government. Our plans to hold onto a single party minority rule might be over for good but everything's not over for us. Thanks to the intervention of President Björnsson, who is an adamant supporter of us, we can convince the Progressive Party to form a new government with us. We will have to give much of our posts including Prime Ministry, which will be taken over by the speaker of the parliament Steingrímur Steinþórsson. We might become the lesser partner of the coalition but it sure beats the risk of having the Communists in the government."
 ICE_Continue_Devaluing_Krona:0 "Exchange Rate Registration"
 ICE_Continue_Devaluing_Krona_desc:0 "With a confident government back in charge our first and foremost priority should be to save the export trade. The opposition parties and even the Icelandic Confederation of Trade Unions have made it clear that opening of new markets and industries would be in the best interest of the working class, we are in no position to meet all of their demands. Continuing the previous policy of devaluation might be a thorn on the side of the workers but it will allow us to increase our exports and bring in much needed monetary power for our nation."
 ICE_Lower_Income_Tax_Reduction:0 "Tax Breaks On Lower Income Households"
 ICE_Lower_Income_Tax_Reduction_desc:0 "Currency devaluation has started to take its toll on the lower class, as prediceted, and the Progressive's have decided to lend a hand to them. A new bill proposed by the Prime Minister Steinþórsson promises any household with a net annual income of less than 20k króna (24k by the request of the President) an income tax reduction of 33%. According to our financial advisors the bill will be causing an estimated two and a half million loss of potential tax loss for the treasury. Hopefully the increase in trade allows us to make up for the loss of revenue."
