 mrtnews.1.d:0 "Depuis que la Mauritanie a pris le contrôle de la partie sud de l'ancien Sahara espagnol lors des Accords de Madrid en 1975, le pays n’a connu que désastre et calamité. Son armée de 3 000 soldats était totalement incapable de défendre ses frontières contre les raids incessants du Front Polisario, qui paralysèrent l'économie en s’emparant de la principale source de revenus nationaux: les mines de fer de Zouerate. En réalité, la seule chose qui maintenait ce pays désertique debout était l’intervention de l’aviation française, qui peinait pourtant à contenir une offensive menaçant directement la capitale, Nouakchott. Face à une armée déchirée entre des Arabes et des Berbères largement favorables aux insurgés sahraouis et des soldats noirs du sud qui voyaient ce conflit comme une querelle arabe ne les concernant pas, un coup d’État de militaires hostiles à la guerre était inévitable. La Mauritanie finit non seulement par évacuer l’ensemble des territoires qu’elle contrôlait au Sahara occidental, mais aussi par reconnaître officiellement son indépendance."