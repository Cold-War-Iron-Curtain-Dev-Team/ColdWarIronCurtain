 communist_International_aid_category_desc: "Pour consolider notre présence et notre position dans le \nmonde, nous aurons besoin d’alliés prêts à s’engager sur \nla voie ardue menant au communisme. \n\nDans cette entreprise, nous soutiendrons tous les États \nqui s'aligneront sur nos objectifs, tant sur le plan militaire \nqu'économique, alors que la révolution mondiale \nvisant à renverser le capitalisme lâche commence à prendre de l'ampleur. \n §YEn envoyant des armes à nos camarades, nous les aidons \ndans leur lutte contre les impérialistes.§!"
