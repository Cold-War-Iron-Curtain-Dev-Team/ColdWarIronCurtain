 TUTOR_economics_106: "Technologie"
 TUTOR.106.t: "Technologie"
 TUTOR_economics_106_desc: "La §BTechnologie§! dans CWIC est étroitement liée, avec des technologies réparties en catégories hautement spécialisées. Ci-dessous se trouve une liste compilée de ce que fait chaque branche technologique.\n\n§CONGLET INDUSTRIE§!\n§YLogistique§! - Capacité industrielle, revenus des chantiers navals, vitesse de réparation et stockage de carburant\n§YProduction§! - Capacité industrielle et plafond de productivité\n§YGestion§! - Capacité industrielle, gain et rétention d’efficacité, et refonte navale\n§YAgriculture§! - Améliore la production des complexes agro-industriels\n§YOrganique§! - Croissance de la population (santé des écosystèmes bientôt disponible)\n§YEau§! - Niveau maximal d’infrastructure hydraulique et bonus de gestion\n§YBiocarburants/Voitures électriques§! - Réduit la consommation de pétrochimiques civils (santé des écosystèmes bientôt disponible)\n§YGénie civil§! - Vitesse de construction et réparation\n§YExcavation§! - Production de ressources\n§YSciences des matériaux§! - Prérequis pour de nombreuses autres technologies, améliore les revenus des raffineries et augmente leur production. Les plastiques améliorent le gain de carburant.\n§YRéseau§! - Améliore toutes les sources d’énergie\n§YÉnergie verte/Écoénergie§! - Améliore respectivement la production et le niveau maximal des centrales renouvelables et réduit la consommation d’énergie des autres bâtiments\n§YGaz§! - Améliore la production d’énergie des centrales à combustibles fossiles\n§YGestion des infrastructures§! - Un ensemble varié de bonus\n§YInfrastructure§! - Améliore le niveau maximal des infrastructures municipales et d’État\n\n§CÉLECTRONIQUE§!\n§YTransistors§! - Prérequis pour les supercalculateurs\n§YSupercalcul§! - Augmente la vitesse de recherche\n§YMatériel§! - Prérequis pour de nombreuses autres technologies et presque toutes les technologies militaires\n§YLogiciel§! - Un ensemble varié de bonus\n§YInterconnexion et communications§! - Augmente le maximum et le gain de pouvoir de commandement (bâtiment de télécommunications bientôt disponible)\n§YÉlectronique grand public§! - Augmente les revenus déjà massifs des parcs de bureaux\n§YChiffrement/Déchiffrement§! - Important pour le gain de renseignement\n§YRadar§! - Augmente le niveau maximal des stations radar et offre un ensemble varié de bonus.\n\n§CNUCLÉAIRE§!\n§YÉnergie nucléaire§! - Améliore la production et l’efficacité de l’énergie nucléaire"
