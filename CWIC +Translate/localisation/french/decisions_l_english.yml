 TUTOR.1062.t: "Technologie"
 TUTOR.1062.d: "§CL'ÉLECTRONIQUE§!\n§YTransistors§! - Prérequis pour les supercalculateurs\n§YSupercalcul§! - Augmente la vitesse de recherche\n§YMatériel§! - Prérequis pour de nombreuses autres technologies et presque toutes les technologies militaires\n§YLogiciel§! - Un ensemble varié de bonus\n§YInterconnexion et communications§! - Augmente le maximum et le gain de pouvoir de commandement (bâtiment de télécommunications bientôt disponible)\n§YÉlectronique grand public§! - Augmente les revenus déjà massifs des parcs de bureaux\n§YChiffrement/Déchiffrement§! - Important pour le gain de renseignement\n§YRadar§! - Augmente le niveau maximal des stations radar et offre un ensemble varié de bonus.\n\n§CNUCLÉAIRE§!\n§YÉnergie nucléaire§! - Améliore la production et l’efficacité de l’énergie nucléaire"
 TUTOR_economics_107: "Achat de matériel"
 TUTOR.107.t: "Achat de matériel"
 TUTOR_economics_107_desc: "§YL'achat d’équipement§! vous permet d’utiliser de l’§YArgent§! pour acheter de l’équipement pour votre armée. Les achats §G1x§! ont un temps de recharge d’un an et vous permettent d’acheter immédiatement de l’équipement. Des quantités plus élevées d’§YAchats d’équipement§! impliquent des périodes de commande en attente pendant lesquelles le(s) §YFabricant(s)§! sous contrat doivent produire l’équipement pour vous le vendre.\n\n§CMARCHÉ CIVIL§!\nLe §YMarché civil§! est un contrat universel ouvert auquel tout le monde peut accéder. Vous pouvez y acheter des éléments tels que l’§YÉquipement de soutien§!, l’§YÉquipement motorisé§! ou les §YAvions de transport§! qui ne nécessitent pas de contrats militaires. Ce sont généralement des articles peu coûteux sans capacités de combat et principalement produits par des §YFabricants indépendants§! §Ycivils§!.\n\n§CCONTRATS§!\nVous pouvez avoir jusqu’à 1 §YContrat§! de chaque niveau (faible, moyen, élevé) pour différentes formes d’§YÉquipement militaire§! et d’§YArmes§!. Pour négocier un §YContrat§!, sélectionnez le bouton §YNégocier un contrat§! et choisissez un §YFabricant§!. Vous aurez besoin de §Y100-300§! de §YPouvoir politique§! pour obtenir un contrat. Vous pouvez améliorer un §YContrat de haut niveau§! en §YNiveau maximal§!, ce qui vous permet d’acheter des §YPorte-avions, croiseurs et avions CV§! auprès de celui-ci. Certains §YFabricants§! ont des §YNiveaux technologiques§! plus élevés que d’autres, augmentant leur sélection et la qualité de leur équipement."
