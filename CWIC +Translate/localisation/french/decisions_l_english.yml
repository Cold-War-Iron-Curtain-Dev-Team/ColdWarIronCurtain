 contra_insurgency_options.1.d: "Les Contras s'appuient sur la peur et l'intimidation pour s'imposer. Ceux qui les soutiennent sont souvent d'anciens voyous ou des individus cupides, avides de l'argent fourni par des étrangers opposés à notre révolution. Il ne nous est donc pas très difficile de recruter, dans les zones contrôlées par les Contras, des habitants prêts à accomplir leur devoir patriotique et à recueillir des informations pour nous. Lors d'une récente opération de renseignement, nous avons réussi à recruter un villageois vivant près d'une base importante des Contras. Il nous a fourni des informations inestimables sur leurs tactiques de recrutement, leurs déploiements et le niveau de leurs approvisionnements en armes. Plus important encore, comme de nombreux Contras font leurs courses ou passent leur temps libre dans le village, nous obtenons également des informations sur les futures offensives des Contras. Grâce à ces informations, nous sommes mieux à même de déployer nos forces dans la région pour contrer leurs forces et avons pu intercepter plusieurs tentatives des Contras visant à faire entrer de nouveaux combattants dans la région."
 contra_insurgency_options.2.d: "Les Contras s'appuient sur la peur et l'intimidation pour s'imposer. Ceux qui les soutiennent sont souvent d'anciens voyous ou des individus cupides, prêts à tout pour obtenir l'argent fourni par des étrangers opposés à notre révolution. Il ne nous est donc pas très difficile de recruter, dans les zones contrôlées par les Contras, des habitants prêts à accomplir leur devoir patriotique et à recueillir des renseignements pour nous. Lors d'une récente opération de renseignement, nous avons réussi à recruter un villageois dans une zone contrôlée par les Contras. Cette source s'est alors révélée utile et nous a fourni des renseignements indiquant une offensive majeure des Contras dans la région. Nous avons déployé des forces pour contrer cette offensive imminente, mais celle-ci a finalement eu lieu dans une autre zone et les Contras ont repoussé nos forces, qui n'étaient pas préparées. Nous avons compris que notre recrue était un agent double et qu'il avait facilité le succès des Contras. Notre opération avait été un échec."
 contra_insurgency_options.3.d: "Les Contras sont une bande de lâches qui n'attaquent souvent que depuis la jungle pour s'en prendre à des fonctionnaires sans défense ou à des civils innocents. Nous avons déployé une force pour protéger plusieurs villages qui avaient récemment été attaqués. Les Contras ne s'en sont pas rendu compte, et nous avons réussi à découvrir leur base opérationnelle dans la région. Au cours d'un raid audacieux, nos forces ont pu infiltrer et attaquer les forces des Contras. Pris au dépourvu, leurs combattants ont subi de lourdes pertes alors qu'ils fuyaient, beaucoup abandonnant leurs fusils occidentaux modernes. Nous avons fait des prisonniers et saisi des documents. Les villageois nous sont reconnaissants de nos actions et le moral de nos forces dans la région s'est amélioré."
 contra_insurgency_options.4.d: "Les Contras sont une bande de lâches qui n'attaquent souvent que depuis la jungle pour s'en prendre à des fonctionnaires sans défense ou à des civils innocents. Nous avons déployé une force pour protéger plusieurs villages qui avaient récemment été attaqués. Cependant, notre commandant a commis une erreur après avoir identifié la base d'où ils lançaient leurs attaques. Lorsque nos soldats se sont mis en route pour lancer l'assaut, les Contras s'apprêtaient à se déplacer et étaient en état d'alerte. Ils ont fini par repérer nos forces et, lorsque l'assaut a été lancé, nos hommes se sont retrouvés face à un ennemi retranché et bien préparé. Nous avons subi des pertes et nos soldats ont été contraints de se retirer. Cette défaite a permis aux Contras d'agir de manière plus agressive dans la région et les villageois de la zone ont perdu confiance dans le gouvernement."
 contra_insurgency_options.5.d: "Notre armée de l'air est modeste, mais nos pilotes sont animés d'une ferveur révolutionnaire. Grâce aux renseignements fournis par une puissance amie, nous avons pu localiser un camp d'entraînement des Contras situé à découvert. Il semble qu'ils croient effrontément que nous sommes incapables de frapper cette base, car elle est assez isolée. Nous avons toutefois réussi à envoyer certains de nos avions équipés de bombes, qui ont touché la cible de plein fouet. Après l'attaque, nos services de renseignement nous ont appris que la base était un vaste camp d'entraînement et une zone de rassemblement pour les rebelles et qu'elle n'était plus opérationnelle après le raid. Les capacités de l'ennemi dans la région ont été considérablement réduites par ce raid réussi."
 contra_insurgency_options.6.d: "Notre armée de l'air est modeste, mais nos pilotes débordent d'une ferveur révolutionnaire. Grâce aux renseignements fournis par une puissance amie, nous avons pu localiser un camp d'entraînement des Contras situé en plein air. Nous avons envoyé certains de nos avions détruire la cible, ce qu'ils ont fait. Cependant, les interceptions et les sources de renseignement n'indiquaient pas que les Contras aient subi des pertes dans la région. Perplexe, un petit groupe d'hommes a inspecté le site ; il semblerait que nos avions aient visé de mauvaises coordonnées et aient plutôt frappé un champ à proximité d'une ferme. Il ne semble pas y avoir eu de victimes civiles, mais le bombardement a exaspéré les habitants, qui nous ont accusés de vouloir les chasser de leurs terres. Les Contras attisent ces sentiments et ont ainsi vu leur soutien s'accroître."
 contra_insurgency_options.11.d: "La dernière offensive des forces de la Contra a réussi à isoler Managua du reste du pays. Dans la capitale, cela a conduit de nombreux manifestants à réclamer la fin du conflit, mettant à rude épreuve les ressources d'un gouvernement sandiniste déjà à bout de souffle. Face à l'imminence d'un assaut sur la capitale, le gouvernement sandiniste a finalement capitulé, appelant à un cessez-le-feu. Les Contras ont accepté et, en l'espace d'une journée, les forces sandinistes ont accepté de se démobiliser et de céder la capitale. Partout dans le pays, les forces Contras victorieuses ont célébré leur victoire, alors que des informations sporadiques faisaient état d'actes de représailles de leur part. Un comité composé des principaux dirigeants Contras a rencontré les médias à Managua, affirmant qu'ils mettraient rapidement en place un gouvernement et organiseraient des élections libres. Interrogés sur le sort des sandinistes ou sur leur future participation aux élections, ils ont simplement répondu que le temps apporterait la réponse. Bien que les médias internationaux considèrent l'annonce d'élections libres comme un pas dans la bonne direction, nombreux sont ceux au Nicaragua qui doutent qu'elles aient réellement lieu."
 contra_insurgency_options.10.d: "Le gouvernement sandiniste a réussi à mobiliser ses forces armées pour stopper l'avancée des Contras. Des offensives récentes ont chassé les Contras de leurs bastions et les ont éloignés de la population. Les capacités des Contras étant considérablement affaiblies et face à la pression internationale visant à mettre fin aux combats, les sandinistes ont décidé d'entamer des pourparlers avec les Contras. Les Contras, vaincus, ont accepté de démobiliser leurs combattants et de cesser les attaques contre les civils. Une fois les Contras démobilisés, le gouvernement a accepté d'organiser des élections sous la supervision d'observateurs internationaux venus de toute la région. Bien que les Contras et leurs soutiens aient tenté de repousser l'engagement de démobilisation, la réalité de leur situation militaire ne leur a laissé d'autre choix que de mettre fin à leur lutte. Les Nicaraguayens attendent avec impatience la paix et la tenue d'élections dans une atmosphère positive. Le gouvernement sandiniste est salué par la communauté internationale pour son approche impartiale visant à mettre fin à la menace des Contras."
 contra_insurgency_Decisions: "La guerre des Contras"
 contra_insurgency_Decisions_desc: "Les vestiges du régime Somoza, les combattants anti-Somoza trahis par les gauchistes qui ont pris le pouvoir et les Nicaraguayens anticommunistes se sont unis pour former les Contras. Ils sont unis dans leur opposition au gouvernement sandiniste socialiste et à ses atteintes à leurs droits et à leur mode de vie. Ils entretiennent des liens étroits avec les États-Unis et d’autres États anticommunistes. Le gouvernement sandiniste organise ses propres forces pour faire face à cette menace et préserver sa révolution. Les paysans nicaraguayens sont pris entre deux feux alors que les deux camps se livrent une lutte acharnée pour l'avenir du Nicaragua.\n\nEffectifs actuels [?ROOT.contra_insurgency]%"
