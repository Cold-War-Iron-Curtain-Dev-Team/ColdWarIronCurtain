 TUTOR_politics_301: "Arbres de priorités"
 TUTOR.301.t: "Arbres de priorités"
 TUTOR_politics_301_desc: "Les §YArbres de Priorités§! dans CWIC fonctionnent différemment des autres mods en raison de l’extraordinaire durée de la campagne de CWIC. À chaque §YEre§!, ('49, '60, '73, '80,) les §YArbres de Prioritéss§! changent. Tous les focus non terminés lors du changement ne pourront plus être complétés, donc surveille bien la date et planifie à l’avance.\n\n§CÉLECTIONS§!\nLes pays auront périodiquement des §YÉlections§! scriptées dans lesquelles tu peux choisir une voie spécifique. Ces élections débloquent généralement l’un des plusieurs focus §YLié à la politique§! imbriqués et mutuellement exclusifs, verrouillés derrière le tag §RToujours = Non§! dans l'§YArbre de Priorités§!.\n\n§CTHÈMES LIÉS À L'ÉVÉNEMENT§!\nEn plus des focus §YLié à la politique§!, les autres focus verrouillés par §RToujours = non§! sont les §YObjectifs liés à des événements§!. Ils sont verrouillés derrière des décisions liées à des §YÉvénements§! programmés, qui peuvent se produire ou déjà s’être produits et nécessitent un choix. Bien que rarement, certains de ces focus peuvent dépendre d’événements ou de décisions étrangers et sont marqués comme des réponses à d’autres nations ou à des événements mondiaux."
 TUTOR.301.d: "Les §YArbres de Priorités§! dans CWIC fonctionnent différemment des autres mods en raison de l’extraordinaire durée de la campagne de CWIC. À chaque §YEre§!, ('49, '60, '73, '80,) les §YArbres de Prioritéss§! changent. Tous les focus non terminés lors du changement ne pourront plus être complétés, donc surveille bien la date et planifie à l’avance.\n\n§CÉLECTIONS§!\nLes pays auront périodiquement des §YÉlections§! scriptées dans lesquelles tu peux choisir une voie spécifique. Ces élections débloquent généralement l’un des plusieurs focus §YLié à la politique§! imbriqués et mutuellement exclusifs, verrouillés derrière le tag §RToujours = Non§! dans l'§YArbre de Priorités§!.\n\n§CTHÈMES LIÉS À L'ÉVÉNEMENT§!\nEn plus des focus §YLié à la politique§!, les autres focus verrouillés par §RToujours = non§! sont les §YObjectifs liés à des événements§!. Ils sont verrouillés derrière des décisions liées à des §YÉvénements§! programmés, qui peuvent se produire ou déjà s’être produits et nécessitent un choix. Bien que rarement, certains de ces focus peuvent dépendre d’événements ou de décisions étrangers et sont marqués comme des réponses à d’autres nations ou à des événements mondiaux."
