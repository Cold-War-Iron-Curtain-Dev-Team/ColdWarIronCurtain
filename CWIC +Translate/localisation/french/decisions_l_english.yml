nne§! pour se défendre. §YLes bombardiers navals§! peuvent bombarder très efficacement les flottes ennemies ou les navires à quai. §YLes bombardiers à grande vitesse§! sont beaucoup plus rapides, ont une portée bien plus longue et sont beaucoup plus résistants. §YLes bombardiers nucléaires§! ont une portée mondiale.\n\n§CMISSILES§!\n§YLes missiles de croisière§! et §Yles missiles balistiques§! sont des armes dévastatrices à usage unique que vous déployez à partir de lance-missiles à longue portée stationnés dans des §Ybases aériennes§!. Ils peuvent accomplir presque toutes les missions et ont des effets immédiats dévastateurs. §YMissiles balistiques§! sont nucléaires.\n\n§CAVIONS DE TRANSPORT§!\n§YAvions de transport/logistique§! sont utilisés pour parachuter des unités §YAériennes§! et pour effectuer des missions de §YRavitaillement aérien§! afin de déplacer temporairement une partie de la §YLimite de ravitaillement§! de la région où se trouve la §YBase aérienne§! vers la région cible."
 TUTOR_military_205: "Marine"
 TUTOR.205.t: "Marine"
 TUTOR_military_205_desc: "La §YMarine§! est une branche assez complexe du §YMilitaire§! qui repose sur un équilibre minutieux entre les classes de navires et les tactiques navales.\n\n§CCOMBAT NAVAL§!\nIl existe 4 types de navires : §YÉscorteur§!, §YFrégate§!, §YPorte-Avion§! et §YSous-marins§!. Les navires §YÉscorteurs§! constituent l'épine dorsale de la §YMarine§! et représentent la majeure partie des effectifs afin d'empêcher que les §YFrégates§!, bien moins nombreux, ne soient mis en pièces. La quantité généreusement déployée d'attaques HG et de §YTorpilles§! universelles rend le combat naval dans CWIC mortel pour les grands navires ; il est donc vital de disposer d'effectifs suffisants pour couvrir votre §YFrégate§!. Les navires de §YFrégate§! disposent d'une puissance de feu bien supérieure en §YHP§! par rapport aux navires §YÉscorte§! et sont donc plus puissants. En plus de constituer l'essentiel de la puissance de feu, ils empêchent la §YFrégate§! ennemie d'attaquer directement les §YPortes-avions§!.§YLes porte-avions§! embarquent soit des avions §YVTOL§! ou §YCV polyvalent§! capables de combattre ou d'infliger des dégâts aux navires, soit des §YCV CAS§! pouvant bombarder les navires ennemis ou fournir un appui au sol, soit des hélicoptères §YASW§! chargés de protéger les §YCarriers§! et la §YBattle-Line§! contre les §YSubmersibles§!. Les §YSous-marins§! tentent de rester indétectables et attaquent directement la §YFrégate§! ou les §YPortes-avions§! s'ils parviennent à échapper à la détection des armes anti-sous-marines. De plus, les §Ysous-marins balistiques§! (coques MTG §YSingle-Large§! et §YDouble-Large§!) peuvent transporter des §YSLBM§! ou des §Ymissiles de croisière§! pour attaquer des cibles terrestres ou des flottes ennemies. Les §Ytorpilles§! peuvent attaquer directement et dévaster la §YFrégate§! et les §Yporte-avions§!. De plus, les §YTorpilles moyennes§! peuvent endommager les §YSous-marins§!\n\n§CCONVOIS§!\nIndispensables au §YCommerce§!, au §YTransport de troupes§! et au §YRavitaillement§!, les §YConvois§! constituent l'une des principales raisons pour lesquelles remporter les combats navals est crucial, même sur des territoires interconnectés. Les §YConvois§! non protégés peuvent être anéantis par les §YSous-marins§!. Les convois en combat naval apparaissent dans la ligne §YPorte-Avions§! et seront protégés par des navires §YÉscorteur§! et de §YFrégates§!.\n\n§CMODULES§!\nPropres à MTG, les §YModules§! se présentent sous diverses formes.\ Les §YAA Guns§! et les §YSAMs§! sont des recherches issues respectivement des §BTechnologies§! §YAutocannon§! et §YSAM§!\nLes §YArmements§! sont des armes à forte pénétration et faible dégâts, tandis que les §YASMs§! ont une faible pénétration mais infligent des dégâts élevés. §YBlindage§! peut facilement vaincre les vaisseaux équipés d'un trop grand nombre de §YASMs§! et d'un nombre insuffisant de §YArmement§!\n§YMesures de riposte§! sont §GTRÈS PEU COÛTEUX§! et peuvent donc être considérés comme un renforcement direct de §YArmor§! lorsqu'ils sont §Brecherchés§! et déployés sur des vaisseaux. §YCIWS§! est §Rbeaucoup plus cher, surtout en £resources_strip|2, mais ajoute beaucoup de §YBlindage§! au vaisseau. Si le §YBlindage§! d'un vaisseau est supérieur à la pénétration de son ennemi, même de peu, alors celui-ci infligera §Rbeaucoup moins de dégâts.§!\n§YLes modules maritimes§! s'équipent dans l'emplacement §YMaritime Slot§!. Le module §YTA/FCS§! est indispensable pour que la défense antiaérienne inflige des dégâts significatifs et augmente les dégâts de toutes les §Yarmes§!. Le module §YEW/SS§! améliore la §YDétection§! d'un vaisseau. §YNavigation§! améliore la §YFurtivité§! d'un vaisseau, l'aidant à éviter la détection, et offre des bonus lors des combats en terrain accidenté ou exigu. Les §YModules Sonar§! sont utilisés pour détecter les §YSous-marins§!.\n\n§CARMES SPÉCIALES§!\nLa plupart des vaisseaux disposent d'un emplacement de module §YArme spéciale§!. Celles-ci offrent toutes une variété d'avantages différents et sont très diverses ; elles doivent donc être équipées avec soin.\n\n§CMOTEURS NUCLÉAIRES§!\nLes §YMoteurs nucléaires§! sont recherchés dans l'onglet §BNucléaire/ADM§! et §Gne consomment pas de carburant§!, tout en étant plus §YFiables§!, ce qui réduit considérablement le risque de panne en mer ou au combat."
 TUTOR.205.d: "La §YMarine§! est une branche quelque peu complexe du §YMilitaire§! qui implique un équilibre soigneux des classes de navires et des tactiques navales.\n\n§CNAVAL COMBAT§!\nLes navires existent en 4 types. §YÉscorteurs§!, §YFrégates§!, §YPorte-avions§!, et §YSous-marins§!. Les navires de §YÉscorteurs§! constituent l’épine dorsale de la §YNavy§! et représentent la majorité des effectifs afin d’empêcher les navires de §YFrégates§!, bien plus peu nombreux, d’être mis en pièces. La quantité généreusement appliquée d’attaques HG et de §YTorpilles§! universelles rend le combat naval dans CWIC mortel pour les grands navires, rendant indispensable de disposer de nombres suffisants pour couvrir ta §YFrégates§!. Les navires de §YFrégates§! possèdent une quantité de puissance de feu bien supérieure en §YHP§! par rapport aux navires de §YFrégates§! et sont donc les plus puissants. En plus de constituer l’essentiel de la puissance de feu, ils empêchent la §YFrégates§! ennemie d’attaquer directement les §YPorte-avions§!. Les §YPorte-avions§! embarquent soit des avions §YVTOL§! ou §YCV polyvalent§! capables de combattre ou d’endommager les navires, des §YCV CAS§! qui peuvent bombarder les navires ennemis ou fournir un appui terrestre, ou des hélicoptères §YASW§! qui protègent les §YPorte-avions§! et la §YFrégates§! contre les §YSous-marins§!. Les §YSous-marins§! tentent de rester indétectés et d’attaquer directement la §YFrégates§! ou les §YPorte-avions§! s’ils parviennent à passer les défenses de détection des armes anti-sous-marines. De plus, les §YSous-marins nucléaires§! (coques MTG §YSingle-Large§! et §YDouble-Large§!) peuvent embarquer des §YSLBM§! ou des §YMissiles de croisière§! pour attaquer des cibles terrestres ou des flottes ennemies. Les §YTorpilles§! peuvent attaquer directement et dévaster la §YFrégates§! et les §YPorte-avions§!. De plus, les §YTorpilles de taille moyenne§! peuvent endommager les §YSubmersibles§!.\n\n§CCONVOIS§!\nEssentiels pour le §YCommerce§!, le §YTransport de troupes§!, et le §YApprovisionnement§!, les §YConvois§! sont l’une des principales raisons pour lesquelles gagner un combat naval est crucial, même sur des terres interconnectées. Les §YConvois§! non protégés peuvent être anéantis par les §YSous-marins§!. Les convois en combat naval apparaissent dans la ligne §YPorte-avions§! et seront protégés par des navires §YÉscorteurs§! et de §YFrégates§!."
 TUTOR.2052.t: "MTG"
 TUTOR.2052.d: "§CMODULES§!\nSpécifiques à MTG, les §YModules§! existent sous diverses formes.\nLes §YAA Guns§! et les §YSAMs§! sont des recherches issues respectivement des §YAutocannons§! et des §YSAM§! §BTechnologies§!.\nLes §YArmement§! sont des armes à forte pénétration et faible dégâts, tandis que les §YASMs§! ont une faible pénétration mais de hauts dégâts. Le §YBlindage§! peut facilement vaincre des navires qui ont trop de §YASMs§! et pas assez d’§YArmement§!.\nLes §YMesures de riposte§! sont §GTRÈS PEU COÛTEUSES§! et peuvent donc être considérées comme une augmentation fixe de le§YBlindage§! lorsqu’elles sont §Bétudiées§! et déployées sur les navires. Les §YCIWS§! sont §Rextrêmement plus coûteuses, surtout en £resources_strip|2, mais ajoutent beaucoup de §YBlindage§! au navire. Si le §YBlindage§! d’un navire est supérieur à la pénétration ennemie, même légèrement, il infligera des dégâts §Rconsidérablement réduits.§!\nLes §YModules Maritime§! sont équipés dans l’emplacement §YMaritime Slot§!. Le §YTA/FCS§! est nécessaire pour que la défense anti-aérienne inflige des dégâts corrects et augmente les dégâts de toutes les §YArmes§!. Le §YEW/SS§! augmente la §YDétection§! d’un navire. La §YNavigation§! améliore la §YFurtivité§! d’un navire, l’aidant à éviter la détection et fournissant des bonus lors des combats en terrain difficile ou exigu. Les §YModules sonar§! sont utilisés pour détecter les §YSous-marins§!.\n\n§CARMES SPÉCIALES§!\nLa plupart des navires disposent d’un emplacement de module de §YArme spéciale§!. Ceux-ci offrent une grande variété d’avantages et sont très diversifiés, et doivent donc être équipés avec soin.\n\n§CMOTEURS NUCLÉAIRES§!\nLes §YMoteurs nucléaires§! sont recherchés dans l’onglet §BNucléaire/Armes de destruction massive§! et ne §Gconsomment aucun carburant§!, tout en étant plus §YFiables§!, ce qui réduit fortement les risques de panne en mer ou en combat."
 TUTOR_military_206: "Fuséologie"
 TUTOR.206.t: "Fuséologie"
 TUTOR_military_206_desc: "L'§BArbre technologique de la fuséologie§! est un niveau avancé de la l'§YArmée§! qui s'avère crucial pour les combats de milieu et de fin de partie, toutes branches confondues. Bien qu'il soit possible de s'en passer au début, vous devriez disposer d'une base solide en « §Ytechnologies de fuséologie§! » et en « §YÉquipement§! » avant l'§YÈre§! de 1973.\n\n§CROQUETTES BASÉES SUR L'ARMÉE DE TERRE§!\nLes §YATGM§! et les §YSAM§! sont des §Barmes de soutien§! spécialisées §YAnti-chars§! et §YAnti-aériennes§! qui manquent d'attaque douce, sont plus coûteuses et font concurrence aux §YIFV Infanterie/Hélicoptères/Véhicules de combat§! en milieu et fin de partie. L'§YArtillerie de roquettes§! inflige des dégâts considérables aux unités légères et oblige les joueurs à utiliser davantage d'§Yhélicoptères§! et d'§YAPC/IFV d'infanterie§!. Les §LSAM à longue portée§! sont utilisés pour les §Ybâtiments antiaériens§! et permettent soit d'augmenter leur niveau maximum, soit de les renforcer.\n\n§CMISSILES DE L'ARMÉE DE L'AIR§!\nLes §BTechnologies§! §YAAM§! et §YAGM§! confèrent des bonus importants aux §YUnités aériennes§! et augmentent considérablement leur puissance d'attaque. Sans ces §BTechnologies§!, vous serez pratiquement incapable de combattre les avions de chasse ennemis ou verrez vos avions §Rabattus en masse§! par les §YSAM§! et, en fin de partie, par les unités §YSPAAG et Anti-Air§!\n\n§CROQUETTES NAVALES§!\nLes §YASM§! §BTechnologies§! sont des §YModules navals§! à faible pénétration et à dégâts élevés dans MTG, ou des bonus essentiels dans le gameplay non-MTG. Lorsqu'elles sont soigneusement équilibrées avec des §YModules d'armement§! à forte pénétration et à faibles dégâts, votre marine peut submerger et détruire l'ennemi. Gardez simplement un œil sur les technologies §YMesures de riposte et CIWS§! disponibles au moment où vous concevez vos navires, sinon les §YASMs§! seront §Rinefficaces§!.\n\n§CMISSILES§!\n§YMissiles de croisière§! sont des unités conventionnelles à usage unique que vous pouvez déployer à partir de lanceurs à longue portée situés dans des §YBases aériennes§! pour infliger d'importants dégâts en rafale à un coût élevé avant de devoir en construire d'autres. §YMissiles balistiques§! sont des armes nucléaires tactiques que vous pouvez utiliser pour infliger beaucoup plus de dégâts que les §YMissiles de croisière§!, mais ils sont nettement plus chers, leur §BRécherche§! coûteuse, et ils nécessitent £resources_strip|6."
