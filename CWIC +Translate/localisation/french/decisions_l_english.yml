 TUTOR_economics_101: "Revenus et PIB"
 TUTOR.101.t: "Revenus et PIB"
 TUTOR_economics_101_desc: "§YL'argent§! est une ressource de CWIC produite par presque tous les bâtiments productifs.\n\n§CCOMMERCE§!\nL'argent provient de nombreuses sources. §YFiscalité§! génère des revenus en fonction du §YNiveau de développement§! de la population d'un État, les §YTaux d'imposition globaux§! plus élevés réduisant la §YEfficacité de la production§!. §YParcs industriels§! et §YChantiers navals§! ont tous deux un revenu de base de §G0,5B§! par bâtiment, multiplié par la §YProductivité§! (efficacité de production + 50 %). Les §YChantiers navals§! bénéficient également d'un bonus basé sur les §YLois commerciales§! et la §YTechnologie logistique§!. §YLes raffineries§! ont un revenu de base de §G0,75 milliard§! par bâtiment, multiplié par +15 % pour chacune de leurs §Ytechnologies des sciences des matériaux§! respectives. §YLes parcs de bureaux§! sont les bâtiments les plus productifs, car ils génèrent un revenu de base de §G1,5 milliard§! par bâtiment, multiplié par +15 % pour chaque technologie §Yélectronique grand public§! que vous avez recherchée. L'exportation de §YRessources§! constitue également une bonne source de revenus. Les §YComplexes agro-industriels§! produisent §G0,5 milliard§! par bâtiment, multiplié par +15 % par technologie §YAgriculture§!.\n\n§CPIB§!\nLe §YPIB§! de votre nation correspond à la productivité totale de l'industrie et du commerce de votre pays. Plus il y a de bâtiments, plus le §YPIB§! est élevé.\n\n§COBLIGATIONS ET DETTE§!\nS'endetter n'est pas toujours un problème, surtout si vous utilisez cet argent pour réinvestir dans des sources de revenus ou pour couvrir des dépenses immédiates. Chaque fois que vous dépensez plus d'argent que vous n'en avez en réserve, votre pays contracte des §YPrêts interbancaires au jour le jour§! à un §YTaux d'intérêt§! de §Y4%§! par an, remboursables automatiquement dans un délai de §Y3 Years§! Si vous souhaitez des prêts à §YIntérêt§! plus bas ou des prêts à plus long terme, rendez-vous dans la catégorie de décision §YDécisions économiques§! et parcourez les §YObligations§! qui vous sont proposées à l'achat. Elles ont toutes des §YTaux d'intérêt§! et des §YDurées de prêt§! variables. Toutes les §Yobligations§! étrangères augmentent l'§Yinfluence§! d'autres nations sur vous. Si vous préférez éviter cela, construisez des §Yparcs d'affaires§! pour augmenter votre limite de §Yobligations nationales§!. Le pool de §Yobligations nationales§! est limité mais se reconstitue au fil du temps."
 TUTOR.101.d: "§YL'argent§! est une ressource de CWIC produite par presque tous les bâtiments productifs.\n\n§CCOMMERCE§!\nL'argent provient de nombreuses sources. §YFiscalité§! génère des revenus en fonction du §YNiveau de développement§! de la population d'un État, les §YTaux d'imposition globaux§! plus élevés réduisant la §YEfficacité de la production§!. §YParcs industriels§! et §YChantiers navals§! ont tous deux un revenu de base de §G0,5B§! par bâtiment, multiplié par la §YProductivité§! (efficacité de production + 50 %). Les §YChantiers navals§! bénéficient également d'un bonus basé sur les §YLois commerciales§! et la §YTechnologie logistique§!. §YLes raffineries§! ont un revenu de base de §G0,75 milliard§! par bâtiment, multiplié par +15 % pour chacune de leurs §Ytechnologies des sciences des matériaux§! respectives. §YLes parcs de bureaux§! sont les bâtiments les plus productifs, car ils génèrent un revenu de base de §G1,5 milliard§! par bâtiment, multiplié par +15 % pour chaque technologie §Yélectronique grand public§! que vous avez recherchée. L'exportation de §YRessources§! constitue également une bonne source de revenus. Les §YComplexes agro-industriels§! produisent §G0,5 milliard§! par bâtiment, multiplié par +15 % par technologie §YAgriculture§!.\n\n§CPIB§!\nLe §YPIB§! de votre nation correspond à la productivité totale de l'industrie et du commerce de votre pays. Plus il y a de bâtiments, plus le §YPIB§! est élevé.\n\n§COBLIGATIONS ET DETTE§!\nS'endetter n'est pas toujours un problème, surtout si vous utilisez cet argent pour réinvestir dans des sources de revenus ou pour couvrir des dépenses immédiates. Chaque fois que vous dépensez plus d'argent que vous n'en avez en réserve, votre pays contracte des §YPrêts interbancaires au jour le jour§! à un §YTaux d'intérêt§! de §Y4%§! par an, remboursables automatiquement dans un délai de §Y3 Years§! Si vous souhaitez des prêts à §YIntérêt§! plus bas ou des prêts à plus long terme, rendez-vous dans la catégorie de décision §YDécisions économiques§! et parcourez les §YObligations§! qui vous sont proposées à l'achat. Elles ont toutes des §YTaux d'intérêt§! et des §YDurées de prêt§! variables. Toutes les §Yobligations§! étrangères augmentent l'§Yinfluence§! d'autres nations sur vous. Si vous préférez éviter cela, construisez des §Yparcs d'affaires§! pour augmenter votre limite de §Yobligations nationales§!. Le pool de §Yobligations nationales§! est limité mais se reconstitue au fil du temps."
 TUTOR_economics_102: "Politiques et décrets"
 TUTOR.102.t: "Politiques et décrets"
 TUTOR_economics_102_desc: "Les politiques et les décrets sont accessibles dans l'onglet « Politiques », situé à côté de la section « Lois » dans l'écran « Politique nationale ». Toutes les politiques qui ont un coût financier sont calculées en fonction de la population totale de votre pays.\n\n§CPOLITIQUES FISCALES§!\n§YLes politiques fiscales§! sont des politiques qui vous obligent à payer un §Ycoût de maintenance§! calculé en fonction de votre §Ypopulation totale§!. Ces politiques offrent divers bonus que vous pouvez consulter en survolant chaque politique. Vous ne pouvez passer qu'à des politiques adjacentes et pour §O150 PP§!. L'augmentation d'une politique entraîne une période de recharge pendant laquelle la politique doit être mise en œuvre et ses installations construites. La réduction des §YPolitiques fiscales§! n'entraîne aucune période de recharge. La plupart des pays ne peuvent pas accéder aux systèmes les plus avancés au début du jeu et devront développer leur technologie pour les mettre en œuvre.\n\n§CPOLITIQUES SOCIALES§!\n§YLes politiques sociales§! sont des mesures qui s'accompagnent généralement de compromis adaptés à différents styles de jeu ou qui créent divers besoins. Il est généralement préférable de les considérer sous l'angle de l'immersion ou du jeu de rôle. Certaines §Yidéologies§! vous empêchent de mettre en place certaines §Ypolitiques sociales§!. Les §Ypolitiques sociales§! ont toutes des coûts en §Ypouvoir politique§! et des durées de recharge variables, selon l'ampleur du changement. Souvent, certains changements peuvent se heurter à une §Rrésistance violente§! de la part de la population. Accroître la marginalisation des groupes raciaux dans le pays, par exemple, déclenche une §RGuerre raciale§! qui peut durer plusieurs années. \n\n§CONGLET INFORMATIONS§!\nLe dernier onglet vous présente un grand nombre de statistiques sur votre pays. Ces informations affichent la répartition de vos §GRevenus§! par source, répertorient diverses statistiques nationales telles que le §YPIB§!, et vous permettent de modifier votre §YTaux d'imposition global§!."
 TUTOR.102.d: "Les politiques et édits sont disponibles dans l’onglet des politiques situé à côté de la section des lois dans l’écran de politique de votre pays. Toutes les politiques qui coûtent de l’argent le font en fonction de la population totale de votre pays.\n\n§CPOLITIQUES FISCALES§!\n§YPolitiques fiscales§! sont des politiques qui vous obligent à payer un §YCoût d’entretien§! basé sur votre §YPopulation totale§!. Ces politiques offrent une variété de bonus que vous pouvez consulter en survolant chacune d’elles. Vous ne pouvez passer qu’aux politiques adjacentes et cela pour §O150 PP§!. Augmenter une politique entraîne une période de recharge pendant laquelle la politique doit être mise en œuvre et ses infrastructures construites. Réduire les §YPolitiques fiscales§! n’a pas de période de recharge et laisse les infrastructures existantes §Rse dégrader§! après §Y2§! ans, après quoi vous devrez à nouveau attendre la recharge. La plupart des pays ne peuvent pas atteindre les systèmes les plus avancés au début de la partie et devront développer leur technologie pour les mettre en place.\n\n§CPOLITIQUES SOCIALES§!\n§YPolitiques sociales§! sont des politiques qui impliquent généralement des compromis correspondant à différents styles de jeu ou créant divers besoins. Il est généralement préférable de les considérer sous un angle immersif ou de jeu de rôle. Certaines §YIdéologies§! vous empêchent de posséder certaines §YPolitiques sociales§!. Les §YPolitiques sociales§! ont toutes des coûts en §YPouvoir politique§! et des durées de recharge variables selon l’ampleur du changement. Souvent, certains changements peuvent provoquer une §Rrésistance violente§! de la population. Accroître la marginalisation des groupes raciaux dans le pays, par exemple, déclenche une §RGuerre raciale§! pouvant durer plusieurs années. \n\n§CONGLET D’INFORMATIONS§!\nLe dernier onglet vous présente un grand nombre de statistiques sur votre pays. Ces informations affichent la répartition de vos §GRevenus§! par source, listent diverses statistiques nationales telles que le §YPIB§!, et vous permettent de modifier votre §YTaux d’imposition global§!."
 TUTOR_economics_103: "Catégories/Bâtiments emblématiques"
 TUTOR.103.t: "Catégories/Bâtiments emblématiques"
 TUTOR_economics_103_desc: "Les bâtiments de type drapeau sont des bâtiments construits via des décisions et ne se trouvent pas dans les emplacements de construction. La §YCatégorie d’État§! dans CWIC est déterminée par la §YPopulation§! et le §YNiveau de développement§! d’un État. Dans pratiquement tous les mods et dans le jeu de base, les §YCatégories d’État§! ne peuvent pas être améliorées. Les §YBâtiments de drapeau§! sont des bâtiments qui ne sont pas construits par des moyens conventionnels et utilisent à la place des indicateurs d’état. Les bâtiments de prospection de ressources du jeu de base sont un exemple de §YBâtiments de drapeau§!.\n\n§CCatégorie d’État§!\nDans CWIC, les §YEmplacements de construction§! sont déterminés par la formule suivante (§YPopulation§! en millions §Gx2§! x (§Y+50%§! par §YNiveau de développement§!)). Vous pouvez améliorer votre §YNiveau de développement§! dans la catégorie de décisions §YInvestissements économiques§!. Cela augmentera également les revenus fiscaux. Vous pouvez consulter le §YNiveau de développement§! en cliquant sur l’État et en affichant la zone d’informations à droite.\n\n§CBâtiments de drapeau§!\nEn plus des §YRGOs§! (opérations d’extraction de ressources), CWIC propose d’autres bâtiments de drapeau construits via des décisions ou des priorités nationales. Les §YTélécommunications§! (bientôt disponibles) en seront un autre exemple. Le coût de construction de ces §YBâtiments de drapeau§! est affiché à côté de leurs décisions respectives."
 TUTOR.103.d: "Les bâtiments de type drapeau sont des bâtiments construits via des décisions et ne se trouvent pas dans les emplacements de construction. La §YCatégorie d’État§! dans CWIC est déterminée par la §YPopulation§! et le §YNiveau de développement§! d’un État. Dans pratiquement tous les mods et dans le jeu de base, les §YCatégories d’État§! ne peuvent pas être améliorées. Les §YBâtiments de drapeau§! sont des bâtiments qui ne sont pas construits par des moyens conventionnels et utilisent à la place des indicateurs d’état. Les bâtiments de prospection de ressources du jeu de base sont un exemple de §YBâtiments de drapeau§!.\n\n§CCatégorie d’État§!\nDans CWIC, les §YEmplacements de construction§! sont déterminés par la formule suivante (§YPopulation§! en millions §Gx2§! x (§Y+50%§! par §YNiveau de développement§!)). Vous pouvez améliorer votre §YNiveau de développement§! dans la catégorie de décisions §YInvestissements économiques§!. Cela augmentera également les revenus fiscaux. Vous pouvez consulter le §YNiveau de développement§! en cliquant sur l’État et en affichant la zone d’informations à droite.\n\n§CBâtiments de drapeau§!\nEn plus des §YRGOs§! (opérations d’extraction de ressources), CWIC propose d’autres bâtiments de drapeau construits via des décisions ou des priorités nationales. Les §YTélécommunications§! (bientôt disponibles) en seront un autre exemple. Le coût de construction de ces §YBâtiments de drapeau§! est affiché à côté de leurs décisions respectives."
 TUTOR_economics_104: "Agriculture"
 TUTOR.104.t: "Agriculture"
 TUTOR_economics_104_desc: "Votre nation a besoin de §YBiens agricoles§!£resources_strip|3 pour survivre. Les §YBiens agricoles§!£resources_strip|3 sont représentés par l’icône £resources_strip|3. Le manque de §YBiens agricoles/Nourriture§!£resources_strip|3 entraînera pour votre nation des §Rpénalités massives§! à l’§YEfficacité de production§!, à la §YStabilité§!, et à des niveaux extrêmes provoquera une §RFamine§!. Les §YBiens agricoles§!£resources_strip|3 sont produits par le bâtiment §YComplexe agro-industriel§! qui produit également de l’§YArgent§!.\n\n§CBIOMES AGRICOLES§!\nLes §YBiomes agricoles§! sont une caractéristique d’un État visible sur l’écran d’informations de l’État entre les bâtiments non partagés et partagés. Plus le §YBiome agricole§! est fertile, plus il produira. \nLes complexes agro-industriels ont les productions de base suivantes selon le biome agricole de l’État :\n§YMontagnes désolées§! = §G0.5§!£resources_strip|3 \n§YDésert ou toundra§! = §G1§!£resources_strip|3 \n§YDésert luxuriant ou montagnes tempérées§! = §G2§!£resources_strip|3 \n§YBoréal§! = §G3§!£resources_strip|3 \n§YTempéré§! = §G4§!£resources_strip|3\n§YToute l’année§! = §G6§!£resources_strip|3\n\n§CINFRASTRUCTURE HYDRAULIQUE§!\nL’§YInfrastructure hydraulique§! est un type d’infrastructure qui améliore la production des §YComplexes agro-industriels§! dans l’État où elle est construite. Si un État ne possède pas d’§YInfrastructure hydraulique§!, il produira presque aucun £resources_strip|3. Chaque niveau d’§YInfrastructure hydraulique§! augmentera la production de §G+25%§!."
 TUTOR.104.d: "Votre nation a besoin de §YBiens agricoles§!£resources_strip|3 pour survivre. Les §YBiens agricoles§!£resources_strip|3 sont représentés par l’icône £resources_strip|3. Le manque de §YBiens agricoles/Nourriture§!£resources_strip|3 entraînera pour votre nation des §Rpénalités massives§! à l’§YEfficacité de production§!, à la §YStabilité§!, et à des niveaux extrêmes provoquera une §RFamine§!. Les §YBiens agricoles§!£resources_strip|3 sont produits par le bâtiment §YComplexe agro-industriel§! qui produit également de l’§YArgent§!.\n\n§CBIOMES AGRICOLES§!\nLes §YBiomes agricoles§! sont une caractéristique d’un État visible sur l’écran d’informations de l’État entre les bâtiments non partagés et partagés. Plus le §YBiome agricole§! est fertile, plus il produira. \nLes complexes agro-industriels ont les productions de base suivantes selon le biome agricole de l’État :\n§YMontagnes désolées§! = §G0.5§!£resources_strip|3 \n§YDésert ou toundra§! = §G1§!£resources_strip|3 \n§YDésert luxuriant ou montagnes tempérées§! = §G2§!£resources_strip|3 \n§YBoréal§! = §G3§!£resources_strip|3 \n§YTempéré§! = §G4§!£resources_strip|3\n§YToute l’année§! = §G6§!£resources_strip|3\n\n§CINFRASTRUCTURE HYDRAULIQUE§!\nL’§YInfrastructure hydraulique§! est un type d’infrastructure qui améliore la production des §YComplexes agro-industriels§! dans l’État où elle est construite. Si un État ne possède pas d’§YInfrastructure hydraulique§!, il produira presque aucun £resources_strip|3. Chaque niveau d’§YInfrastructure hydraulique§! augmentera la production de §G+25%§!."
 TUTOR_economics_105: "Énergie et infrastructures"
 TUTOR.105.t: "Énergie et infrastructures"
 TUTOR_economics_105_desc: "§YL'énergie§!£resources_strip|7 est une nouvelle ressource importante et l’§YInfrastructure§! a reçu sa propre mise à jour et extension dans CWIC.\n\n§CÉNERGIE§!\nL’§YÉnergie§!£resources_strip|7 est consommée par chaque bâtiment productif dans CWIC. Les §YRaffineries§!, §YParcs industriels§!, §YProduction militaire§!, §YParcs de bureaux§! et tous les autres bâtiments productifs utilisent de l’électricité pour fonctionner. Les technologies d’§YÉcoénergie§! réduisent la consommation d’§YÉnergie§!£resources_strip|7 des bâtiments. Toutes les sources d’énergie sont améliorées par les technologies de §YRéseau§!. L’§YÉnergie fossile§! est peu coûteuse et fiable à construire mais consomme des §YPétrochimiques§!£resources_strip|1. Elle est améliorée par la branche technologique §YGaz§!. L’§YÉnergie verte§! est beaucoup plus chère mais bien plus difficile à bombarder et ne nécessite aucun §YPétrochimique§!£resources_strip|1. L’§YÉnergie nucléaire§! se trouve dans l’arbre §YADM§! et est extrêmement productive mais constitue une cible concentrée et nécessite un investissement massif en §BRecherche§!.\n\n§CINFRASTRUCTURE§!\nL’§YInfrastructure§! dans CWIC possède un arbre de §BTechnologie§! entièrement dédié. L’§YInfrastructure municipale§! augmente la §YVitesse de construction§! dans un État. L’§YInfrastructure d’État§! augmente l’§YApprovisionnement§! et la §YProduction de ressources§! dans un État. L’§YInfrastructure hydraulique§! est nécessaire pour des §YComplexes agro-industriels§! productifs dans l’État. Vous pouvez augmenter le niveau maximal de construction dans chaque État pour chaque type d’§YInfrastructure§! en §Brecherchant§! leurs technologies respectives. La branche technologique §YGestion des infrastructures§! est un ensemble général de bonus pour l’§YIndustrie§! et la §YConstruction d’infrastructures§!."
