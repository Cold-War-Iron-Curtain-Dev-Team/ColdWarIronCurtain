 Russia_Crisis_Desc: "La décision d'Eltsine de dissoudre le Parlement a conduit à une impasse qui a abouti au bombardement de la Maison Blanche russe. Si Eltsine n'agit pas rapidement, la crise risque de dégénérer en un conflit civil violent et prolongé, compromettant ainsi la transition démocratique et les réformes économiques de la Russie."
