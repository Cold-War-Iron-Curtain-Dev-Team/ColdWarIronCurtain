 TUTOR_economics_108: "Ressources et organisations régionales"
 TUTOR.108.t: "Ressources et organisations régionales"
 TUTOR_economics_108_desc: "Les §YRessources§! sont utilisées par pratiquement tout dans CWIC. La plupart des bâtiments consomment des §YRessources§!. Les §YParcs industriels§! consomment £resources_strip|7, £resources_strip|5 et £resources_strip|1. Les §YParcs de bureaux§! consomment £resources_strip|7, £resources_strip|2 et £resources_strip|1. Les §YChantiers navals§! consomment £resources_strip|7, et certaines §YCentrales électriques§! consomment également des ressources spécifiques.\n\n§CRGO§!\nLes §YRGO§! ou §YOpérations de collecte de ressources§! sont la principale source des ressources que vous produisez. La plupart des États commencent déjà la partie avec certains §YRGO§!, mais vous pouvez en construire davantage dans la catégorie de décisions §YRGO§! en investissant de l’§YArgent§! dans leur construction. De nombreux §YRGO§! nécessitent des §BTechnologies d’extraction§! pour apparaître ou exigent que vous construisiez certains bâtiments dans l’État."
 TUTOR.108.d: "Les §YRessources§! sont utilisées par pratiquement tout dans CWIC. La plupart des bâtiments consomment des §YRessources§!. Les §YParcs industriels§! consomment £resources_strip|7, £resources_strip|5 et £resources_strip|1. Les §YParcs de bureaux§! consomment £resources_strip|7, £resources_strip|2 et £resources_strip|1. Les §YChantiers navals§! consomment £resources_strip|7, et certaines §YCentrales électriques§! consomment également des ressources spécifiques.\n\n§CRGO§!\nLes §YRGO§! ou §YOpérations de collecte de ressources§! sont la principale source des ressources que vous produisez. La plupart des États commencent déjà la partie avec certains §YRGO§!, mais vous pouvez en construire davantage dans la catégorie de décisions §YRGO§! en investissant de l’§YArgent§! dans leur construction. De nombreux §YRGO§! nécessitent des §BTechnologies d’extraction§! pour apparaître ou exigent que vous construisiez certains bâtiments dans l’État."
 TUTOR.200.a: "Pan Pan"
 TUTOR.200.b: "Plus d'informations"
 TUTOR_military_201: "Notions générales"
 TUTOR.201.t: "Notions générales"
 TUTOR_military_201_desc: "Il existe quelques détails importants communs à tous les mods de HOI4.\n\n§CMODÈLES§!\nLes templates devraient toujours être de largeur §Y10, 20,§! ou §Y40§! car l’écrasante majorité des combats se déroulent sur des terrains qui supportent des multiples de §Y20§! de largeur. Tout espace restant ne sera pas rempli car les §YDivisions§! ne peuvent pas occuper partiellement les cases. Les emplacements de §YSoutien§! peuvent accueillir jusqu’à 10 §YCompagnies§! indépendantes. Chaque §YDivision§! a accès à jusqu’à 5 §YBrigades§!, chacune pouvant contenir jusqu’à 5 §YBataillons§!.\n\n§CSTATS§!\nSurveillez bien l’§YOrganisation§! car elle détermine combien de temps votre division peut rester au combat, tandis que la §YForce/HP§! définit la proportion d’équipement et de main-d’œuvre perdue lorsqu’elle est endommagée. L’§YInfanterie§! est l’épine dorsale de votre armée et augmente massivement l’§YOrg§! et les §YHP§!. Les §YUnités de soutien de feu§! comme l’§YArtillerie§! ou les §YATGM§! sont efficaces pour améliorer les §YDégâts§! bruts mais sont mauvaises pour l’§YOrganisation§! et les §YHP§!. Les §YUnités blindées/véhicules de combat§! sont essentielles pour augmenter vos statistiques de §YPercée§! et de §YDéfense§!, ce qui vous permet d’éviter des dégâts et d’en infliger davantage à l’ennemi qu’il ne vous en inflige. Le §YTaux de récupération/Moral§! permet à votre armée de récupérer son §YOrganisation§! plus rapidement hors combat.\n\n§CCOMPAGNIES DE SOUTIEN§!\nLes §YCOMPAGNIES DE SOUTIEN§! sont les 2 colonnes de gauche. Vous pouvez en avoir jusqu’à 10. Les compagnies de §YSoutien de feu§! augmentent les statistiques de combat de la division d’une valeur fixe, sauf les compagnies de §YForces spéciales§! qui améliorent des statistiques globales spécifiques de la division en menant des opérations spéciales derrière les lignes que vous pouvez §Brechercher§! dans l’arbre des §BForces spéciales§!. Les compagnies de §YSoutien de combat§! et de §YService de combat§! accordent des statistiques spéciales comme la §YReconnaissance§! ou l’§YEnracinement§!.\n\n§CAUTRES STATS§!\nIl existe de nombreuses §YStatistiques spéciales§! qui proviennent principalement des §YCompagnies de soutien§!.\n§YReconnaissance§! - Obtient des renseignements pendant la bataille pour des bonus et augmente la probabilité de contrer les tactiques ennemies afin de prendre un avantage décisif ou de vaincre un ennemi plus fort\n§YEnracinement§! - Lorsqu’elles restent immobiles, les divisions peuvent s’enraciner et obtenir d’énormes bonus défensifs si elles sont attaquées\n§YInitiative§! - L’une des statistiques les plus puissantes. Toutes les unités d’une division n’arrivent pas au combat en même temps. Les divisions commencent faibles et vulnérables, puis gagnent progressivement en puissance. L’Initiative accélère ce processus et peut vous permettre de submerger l’ennemi ou de vaincre rapidement une force plus forte\n§YSuppression§! - Uniquement important pour les garnisons ! Affecte la capacité de la division à réprimer les insurrections dans les territoires occupés et à maintenir efficacement l’ordre.\n§YPoids§! - Affecte le temps nécessaire pour lancer une invasion navale\n§YFiabilité et capture d’équipement§! - La fiabilité affecte l’attrition. Plus elle est élevée, moins l’équipement risque de subir de l’attrition et d’être détruit hors combat ou de tomber en panne pendant le combat. La capture d’équipement permet de récupérer l’équipement perdu chez l’ennemi (y compris l’équipement ennemi peu fiable qui tombe en panne sans combat)\n§YReflux (trickleback) et perte d’XP§! - Permet de sauver de la main-d’œuvre et de l’expérience perdues au combat lorsque des soldats meurent/perdent des HP\n§YBlindage vs Perçage§! - Si le blindage de l’adversaire est supérieur au perçage de l’autre division, tous les dégâts sont fortement réduits\n§YDureté§! - La dureté affecte le ratio de dégâts subis entre dégâts légers et lourds. Une division à 30% de dureté subira 70% de l’attaque légère de l’adversaire et 30% de son attaque lourde. Les garnisons plus dures subissent moins de dégâts et de pertes face aux insurgés, émeutiers et terroristes dans les territoires occupés\n§YAcclimatation§! - Réduit l’attrition liée à la chaleur ou au froid. Les équipements avec une fiabilité inférieure à 70% subiront presque toujours une attrition climatique, quelle que soit l’acclimatation.\n§YBonus/Malus de terrain§! - Affectent les dégâts, la percée et la défense d’une division lorsqu’elle combat dans des terrains spécifiques, visibles en bas du §YCréateur de divisions§!"
