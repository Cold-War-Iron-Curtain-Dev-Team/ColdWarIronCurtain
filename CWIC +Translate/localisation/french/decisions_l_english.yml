 TUTOR_military_202: "Déploiement des forces et du matériel de la SF"
 TUTOR.202.t: "Déploiement des forces et du matériel de la SF"
 TUTOR_military_202_desc: "§YSF-Forces§! est un ensemble de §BTechnologies§! qui offre une multitude d'avantages universels, indépendants de la doctrine, pour les combats sur divers terrains, améliore les capacités de combat des §YBataillons de choc§! tels que les §YMarines§!, et renforce les capacités des très puissantes §YForces spéciales§! et des §YCompagnies de soutien§!. Outre les bataillons standard, les §YMarines mécanisés et aéroportés§!, la §YCavalerie§! et la §YCavalerie aérienne§! sont débloqués via cet arbre. La plupart des §YMunitions§! et des §YÉquipements auxiliaires d'infanterie§! ne sont pas déployés par défaut ; il faut plutôt prendre des §YDécisions de déploiement§! pour bénéficier de leurs avantages.\n\n§CSF-Forces§!\n§YSF-Forces§! est un ensemble de §BTechnologies§! qui confère de nombreux avantages à différents secteurs de votre armée n'impliquant pas de combats directs conventionnels. Les §YBataillons de choc§!, tels que les §YMarines§!, les §YParachutistes§! ou les §YAlpinistes§!, s'appuient sur les avantages offerts par les §YSF-Forces§!. Il existe 3 arbres différents dans §YSF-Forces§!, chacun comportant 3 avantages et une ligne distincte §YSpecial Tactics and Training§! pour des §BTechnologies§! de forces spéciales mutuellement exclusives qui mettent l'accent sur la qualité ou la quantité.\n§YGuerre en montagne et dans les régions arctiques§! confère des avantages pour les combats dans les climats froids et en montagne. §YGuerre du désert§! fait de même, mais pour les climats chauds. §YGuerre amphibie§! confère des statistiques améliorées aux §YMarines§! lorsqu'ils combattent en terrain amphibie ou des bonus aux §YInvasions navales§!.§YNavire de débarquement§! améliore la capacité et la vitesse de §YInvasion navale§!. §YOpérations d'assaut aérien§! confère des bonus aux §YParachutistes§!. §YForces spéciales de l'armée, de la marine et de l'armée de l'air§! débloquent et améliorent de puissants bataillons de soutien §YForces spéciales§! qui mènent des §YOperations spéciales§! en coulisses pour conférer des bonus généraux à la division qu'ils servent.\n\n§CDÉPLOIEMENTS§!\n§YÉquipement auxiliaire d'infanterie§! et §YMunitions§! §BTechnologies§! ne confèrent pas automatiquement leurs avantages. Au lieu de cela, elles débloquent des §YDécisions de déploiement§! où vous devez les déployer progressivement auprès de vos troupes. Vous pouvez accélérer leur déploiement en dépensant du §YPouvoir de commandement§!. Si vous disposez d'un grand nombre de §YDivisions§! distinctes par rapport aux §YUsines militaires§!, les déploiements prendront beaucoup plus de temps ; veillez donc à ne pas avoir de §YDivisions§! isolées, petites et en nombre excessif."
 TUTOR.202.d: "§YSF-Forces§! est un ensemble de §BTechnologies§! qui offre une multitude d'avantages universels, indépendants de la doctrine, pour les combats sur divers terrains, améliore les capacités de combat des §YBataillons de choc§! tels que les §YMarines§!, et renforce les capacités des très puissantes §YForces spéciales§! et des §YCompagnies de soutien§!. Outre les bataillons standard, les §YMarines mécanisés et aéroportés§!, la §YCavalerie§! et la §YCavalerie aérienne§! sont débloqués via cet arbre. La plupart des §YMunitions§! et des §YÉquipements auxiliaires d'infanterie§! ne sont pas déployés par défaut ; il faut plutôt prendre des §YDécisions de déploiement§! pour bénéficier de leurs avantages.\n\n§CSF-Forces§!\n§YSF-Forces§! est un ensemble de §BTechnologies§! qui confère de nombreux avantages à différents secteurs de votre armée n'impliquant pas de combats directs conventionnels. Les §YBataillons de choc§!, tels que les §YMarines§!, les §YParachutistes§! ou les §YAlpinistes§!, s'appuient sur les avantages offerts par les §YSF-Forces§!. Il existe 3 arbres différents dans §YSF-Forces§!, chacun comportant 3 avantages et une ligne distincte §YSpecial Tactics and Training§! pour des §BTechnologies§! de forces spéciales mutuellement exclusives qui mettent l'accent sur la qualité ou la quantité.\n§YGuerre en montagne et dans les régions arctiques§! confère des avantages pour les combats dans les climats froids et en montagne. §YGuerre du désert§! fait de même, mais pour les climats chauds. §YGuerre amphibie§! confère des statistiques améliorées aux §YMarines§! lorsqu'ils combattent en terrain amphibie ou des bonus aux §YInvasions navales§!.§YNavire de débarquement§! améliore la capacité et la vitesse de §YInvasion navale§!. §YOpérations d'assaut aérien§! confère des bonus aux §YParachutistes§!. §YForces spéciales de l'armée, de la marine et de l'armée de l'air§! débloquent et améliorent de puissants bataillons de soutien §YForces spéciales§! qui mènent des §YOperations spéciales§! en coulisses pour conférer des bonus généraux à la division qu'ils servent.\n\n§CDÉPLOIEMENTS§!\n§YÉquipement auxiliaire d'infanterie§! et §YMunitions§! §BTechnologies§! ne confèrent pas automatiquement leurs avantages. Au lieu de cela, elles débloquent des §YDécisions de déploiement§! où vous devez les déployer progressivement auprès de vos troupes. Vous pouvez accélérer leur déploiement en dépensant du §YPouvoir de commandement§!. Si vous disposez d'un grand nombre de §YDivisions§! distinctes par rapport aux §YUsines militaires§!, les déploiements prendront beaucoup plus de temps ; veillez donc à ne pas avoir de §YDivisions§! isolées, petites et en nombre excessif."
 TUTOR_military_203: "Armée de terre"
 TUTOR.203.t: "Armée de terre"
 TUTOR_military_203_desc: "§YL'Armée de terre§! est tout aussi importante que les autres branches, mais elle est la plus complexe et constitue le cœur de votre force armée.\n\n§CINFANTERIE§!\n§YL'infanterie§! est l'épine dorsale de votre armée ; elle fournit la §YOrganisation§! et les §YHP§! de votre armée. La §YInfanterie mobile§! confère davantage de §YOrganisation§! et de §YHP§!. §YIFV/Infanterie mécanisée lourde§! dispose du blindage le plus élevé et de statistiques de combat supplémentaires. §YCavalerie aérienne§! est la plus rapide et possède les meilleures valeurs de §YPercée§! et de §YDéfense§!. §YAPC/Infanterie mécanisée§! est rapide et dispose d'un blindage correct.\n\n§CARMOR/VÉHICULES DE COMBAT§!\n§YChars§! offrent beaucoup de §YPercée§! et de §YDéfense§!, ainsi que des statistiques de combat assez bonnes, et sont extrêmement résistants. §YChasseurs de chars / Véhicules de combat de manœuvre§! fonctionnent de manière similaire aux §YChars§!, mais avec plus d'attaques dures et moins d'attaques légères, et sont mal blindés. §YHélicoptères d'attaque§! sont extrêmement puissants dans tous les domaines, mais limités à une seule §YSupport company§! par §YDivision§! Il est conseillé d'en utiliser beaucoup.\n\n§YSOUTIEN AU FEU§!\n§YLe soutien au feu§! est très varié et représente la majeure partie de vos dégâts. L'artillerie §Ylégère, moyenne et lourde§! est respectivement optimisée pour les rôles défensif, offensif et de dégâts purs. §YLes canons automatiques§! fournissent une capacité §YAnti-aérienne§!, un peu de §YDéfense§! et une attaque légère. §YLes porte-missiles SAM§! sont similaires aux §Ycanons automatiques§!, mais ne fournissent que la capacité §YAnti-aérienne§!, avec toutefois une puissance bien supérieure. §YLes canons à tir direct§! fournissent beaucoup de §YPerforation§! et d'attaque puissante, ainsi qu'un peu d'attaque légère. §YATGM/Porteurs d'ATGM§! fonctionnent de manière similaire mais sont beaucoup plus coûteux et se concentrent très fortement sur un rôle anti-blindé avec une puissance de §YPénétration§! pure et une puissance d'attaque dure.\n\n§CCOMPAGNIES DE SOUTIEN§!\n§YLes compagnies de soutien§! fournissent des statistiques et des modificateurs spéciaux à votre armée ou fonctionnent comme des bataillons de §YSoutien de tir§! supplémentaires dans l'emplacement de compagnie. Il existe une variété de variantes mobiles plus puissantes des §YCompagnies de soutien§! dans l'arbre de §BTechnologie§! §YSoutien§!. Les §YHélicoptères§! sont de loin les variantes les plus puissantes."
