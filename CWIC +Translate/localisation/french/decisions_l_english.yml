 TUTOR_politics_303: "Factions"
 TUTOR.303.t: "Factions"
 TUTOR_politics_303_desc: "Les §YFactions§! fonctionnent de manière légèrement différente dans CWIC. La plupart des §YFactions§!, telles que l'§YOTAN§!, ne s'activent que si l'un de leurs membres est attaqué ou si leur §YResponsable de domaine§! (comme l'§EU§!§WS§!§CA§!) les mobilise pour une §RGuerre§! pré-scénarisée, telle que la §RTroisième Guerre Mondiale§!. Pratiquement toutes les §YFactions§! ne peuvent pas être rejointes manuellement et doivent l'être par le biais d'un événement ou d'un thème historique ou uchronique."
 TUTOR.303.d: "Les §YFactions§! fonctionnent de manière légèrement différente dans CWIC. La plupart des §YFactions§!, telles que l'§YOTAN§!, ne s'activent que si l'un de leurs membres est attaqué ou si leur §YResponsable de domaine§! (comme l'§EU§!§WS§!§CA§!) les mobilise pour une §RGuerre§! pré-scénarisée, telle que la §RTroisième Guerre Mondiale§!. Pratiquement toutes les §YFactions§! ne peuvent pas être rejointes manuellement et doivent l'être par le biais d'un événement ou d'un thème historique ou uchronique."
 TUTOR_politics_304: "Influence"
 TUTOR.304.t: "Influence"
 TUTOR_politics_304_desc: "L'§YInfluence§! est un système de CWIC qui permet à différents pays d'exercer un certain contrôle sur les autres.\n\n§CGAGNER DE L'INFLUENCE§!\nPour gagner de l'§YInfluence§!, vous devez sélectionner un pays étranger et dépenser du §YPouvoir politique§! afin d'augmenter votre §YInfluence§! auprès de celui-ci. Il est plus difficile de gagner de l'§YInfluence§! auprès des grandes nations. Vos §YCryptage§! et §YDécryptage§! déterminent respectivement la quantité d'§YInfluence§! que vous pouvez gagner et celle à laquelle vous pouvez résister de la part des autres. De plus, contracter des §YPrêts§! augmente généralement l'§YInfluence§! que le débiteur exerce sur vous. Par ailleurs, des actions telles que le financement de l'armée d'une nation étrangère ou l'octroi de subventions pour le remboursement de la dette peuvent augmenter votre §YInfluence§! sur celle-ci.\n\n§CLUTTER CONTRE L'INFLUENCE§!\nUn niveau élevé de §YChiffrement§! rend plus difficile pour les autres pays (à l'exception des §YPrêts§!) d'exercer une §YInfluence§! sur vous. Dans l'onglet §YDécisions§!, vous pouvez vérifier le niveau d'§YInfluence§! que les autres pays exercent sur vous. Cela devient problématique au-delà de §Y15 %§! et peut être dangereux au-delà de §Y40 %§!. Afin de lutter contre l'§YInfluence§! étrangère, vous pouvez dépenser du §YPouvoir politique§! pour réduire directement l'§YInfluence§! d'une cible ou promouvoir la §YSouveraineté§!, ce qui rendra légèrement plus difficile de vous §YInfluencer§! de manière permanente.\n\n§CUTILISER L'INFLUENCE§!\nTous les pays peuvent dépenser leur §YInfluence§! sur un pays à différents niveaux. Ils peuvent voler les §Yressources§! d'une nation, prendre le contrôle partiel de son §Yéconomie§!, ou même §Rfaire de votre pays une marionnette si l'influence atteint des niveaux suffisamment élevés!§! Cependant, certaines entités non nationales telles que le §YFMI§! peuvent chercher à modifier vos §Ypolitiques fiscales et sociales§! pour les adapter à leur programme ou ajouter des §Yidées nationales§! qui peuvent être préjudiciables ou bénéfiques pour votre nation."
 TUTOR.304.d: "L'§YInfluence§! est un système de CWIC qui permet à différents pays d'exercer un certain contrôle sur les autres.\n\n§CGAGNER DE L'INFLUENCE§!\nPour gagner de l'§YInfluence§!, vous devez sélectionner un pays étranger et dépenser du §YPouvoir politique§! afin d'augmenter votre §YInfluence§! auprès de celui-ci. Il est plus difficile de gagner de l'§YInfluence§! auprès des grandes nations. Vos §YCryptage§! et §YDécryptage§! déterminent respectivement la quantité d'§YInfluence§! que vous pouvez gagner et celle à laquelle vous pouvez résister de la part des autres. De plus, contracter des §YPrêts§! augmente généralement l'§YInfluence§! que le débiteur exerce sur vous. Par ailleurs, des actions telles que le financement de l'armée d'une nation étrangère ou l'octroi de subventions pour le remboursement de la dette peuvent augmenter votre §YInfluence§! sur celle-ci.\n\n§CLUTTER CONTRE L'INFLUENCE§!\nUn niveau élevé de §YChiffrement§! rend plus difficile pour les autres pays (à l'exception des §YPrêts§!) d'exercer une §YInfluence§! sur vous. Dans l'onglet §YDécisions§!, vous pouvez vérifier le niveau d'§YInfluence§! que les autres pays exercent sur vous. Cela devient problématique au-delà de §Y15 %§! et peut être dangereux au-delà de §Y40 %§!. Afin de lutter contre l'§YInfluence§! étrangère, vous pouvez dépenser du §YPouvoir politique§! pour réduire directement l'§YInfluence§! d'une cible ou promouvoir la §YSouveraineté§!, ce qui rendra légèrement plus difficile de vous §YInfluencer§! de manière permanente.\n\n§CUTILISER L'INFLUENCE§!\nTous les pays peuvent dépenser leur §YInfluence§! sur un pays à différents niveaux. Ils peuvent voler les §Yressources§! d'une nation, prendre le contrôle partiel de son §Yéconomie§!, ou même §Rfaire de votre pays une marionnette si l'influence atteint des niveaux suffisamment élevés!§! Cependant, certaines entités non nationales telles que le §YFMI§! peuvent chercher à modifier vos §Ypolitiques fiscales et sociales§! pour les adapter à leur programme ou ajouter des §Yidées nationales§! qui peuvent être préjudiciables ou bénéfiques pour votre nation."