 TUTOR.10.t: "Exemples de modèles"
 TUTOR_starting_templates_desc: "Souhaitez-vous des exemples ou des modèles de départ ? Ils ne constituent en aucun cas une stratégie avancée, mais permettent de mettre en valeur la diversité des armes du mod, de vous montrer comment les utiliser et de vous fournir une base pour vous y mettre. Essayez d'utiliser (xp 10000) et (research 0) dans la console (accessible via la touche ') et testez-les. (Research all) débloque toutes les technologies et doctrines cachées, ce qui est idéal pour explorer mais pas pour expérimenter."
 TUTOR.10.d: "Souhaitez-vous des exemples ou des modèles de départ ? Ils ne constituent en aucun cas une stratégie avancée, mais permettent de mettre en valeur la diversité des armes du mod, de vous montrer comment les utiliser et de vous fournir une base pour vous y mettre. Essayez d'utiliser (xp 10000) et (research 0) dans la console (accessible via la touche ') et testez-les. (Research all) débloque toutes les technologies et doctrines cachées, ce qui est idéal pour explorer mais pas pour expérimenter."
