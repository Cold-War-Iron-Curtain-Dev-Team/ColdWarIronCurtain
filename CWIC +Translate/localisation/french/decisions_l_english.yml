 RUS_rally_pro_yeltsin_protesters_desc: "Face à la vague de manifestants pro-parlement, le fait de rassembler nos partisans en public devrait contribuer à rétablir un certain calme."
 RUS_cut_parliaments_power_desc: "Si nous voulons reprendre le contrôle, nous devons priver le Parlement de la possibilité d'exercer son propre contrôle. En réduisant ses pouvoirs, nous nous assurerons qu'il reste isolé."
 RUS_denounce_opposition_leadership_desc: "Même si nos adversaires bénéficient malheureusement d'un soutien important, nous ne pouvons tout simplement pas laisser leurs calomnies se répandre librement. En les traînant dans la boue, nous espérons rallier leurs partisans à notre cause."
 RUS_solicit_support_from_george_soros_desc: "George Soros a joué un rôle déterminant dans le financement des mouvements antisoviétiques dans l'ancien bloc de l'Est par le passé, ainsi que dans celui d'institutions dans les États post-soviétiques. Son influence financière et politique pourrait grandement contribuer à stabiliser la situation actuelle."
 RUS_deploy_police_to_the_streets_of_moscow_desc: "On a laissé beaucoup trop de liberté aux manifestants anti-Eltsine, qui ont pu agir en toute impunité. Il est temps de rétablir l'ordre et de nettoyer les rues de notre capitale."
 RUS_address_the_nation_desc: "Si nous voulons garantir la cohésion nationale et l'unité derrière le président, nous devons veiller à ce que la population soit informée de ce qui se passe et, surtout, sache qui soutenir."
 RUS_send_the_kantemer_division_desc: "La loyauté de la division Kantemir envers le président est inébranlable et acquise. Il est désormais clair que la seule solution à cette crise passe par la force. Nous allons utiliser la division pour encercler le Parlement et faire le nécessaire pour rétablir l'ordre."
