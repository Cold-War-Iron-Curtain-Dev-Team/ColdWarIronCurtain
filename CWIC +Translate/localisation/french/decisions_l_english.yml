le anti-blindé avec une puissance de §YPénétration§! pure et une puissance d'attaque dure.\n\n§CCOMPAGNIES DE SOUTIEN§!\n§YLes compagnies de soutien§! fournissent des statistiques et des modificateurs spéciaux à votre armée ou fonctionnent comme des bataillons de §YSoutien de tir§! supplémentaires dans l'emplacement de compagnie. Il existe une variété de variantes mobiles plus puissantes des §YCompagnies de soutien§! dans l'arbre de §BTechnologie§! §YSoutien§!. Les §YHélicoptères§! sont de loin les variantes les plus puissantes."
 TUTOR_military_204: "Armée de l'air"
 TUTOR.204.t: "Armée de l'air"
 TUTOR_military_204_desc: "§YL'Armée de l'air§! est une branche des forces armées capable de détruire à distance les bâtiments ennemis et les §Ymarines§!, tout en fournissant des bonus de combat extrêmement puissants à la §YArmée de terre§!. Les §YAéronefs légers§! peuvent accomplir presque toutes les missions, mais leurs performances sont médiocres à tous les égards. Ils constituent toutefois l'option la plus rentable, mais sont §Rréduits en miettes en un clin d'œil§! face à un nombre raisonnable d'avions classiques provenant de nations plus riches. Les missions d'approvisionnement aérien §CNE COÛTENT AUCUN CP§! dans CWIC en raison de leur importance dans la guerre moderne au rythme effréné, alors utilisez-les au maximum.\n\n§CCOMBAT AÉRIEN§!\n Les §YMultiroles§! effectuent en permanence des missions de §YSupériorité aérienne§! qui confèrent des bonus aux unités au sol et attaquent automatiquement les avions ennemis. §YIntercepteurs§! sont des unités spécialisées dans le combat aérien qui ne bénéficient pas des avantages des missions de §YSupériorité aérienne§! en matière d'attaque au sol et ne peuvent attaquer que d'autres avions. §YIntercepteurs à haute vitesse§! sont spécialisés dans les missions défensives d'§YInterception§! et détruisent les §YBombardiers§! et les §YAéronefs de transport§! ennemis ; ils peuvent être redéployés rapidement n'importe où dans le monde.\n\n§CSOUTIEN AÉRIEN§!\n Les avions de §YSoutien aérien rapproché§!, les §Ymultirôles§! et les §Ybombardiers tactiques§! peuvent être déployés dans des missions §YCAS§! où ils aident les §YDivisions de l'armée§! au combat en infligeant des dégâts massifs à l'ennemi, les unités spécialisées de §YSoutien aérien rapproché§! offrant le meilleur rapport coût-efficacité.\n\n§CBOMBARDEMENT§!\n§YLes bombardiers stratégiques§! et §Yles bombardiers tactiques§! peuvent détruire des bâtiments et des infrastructures lors de missions de §Ybombardement§!. Ils doivent être protégés par des avions assurant la §Ysupériorité aérienne§! pour se défendre. §YLes bombardiers navals§! peuvent bombarder très efficacement les flottes ennemies ou les navires à quai. §YLes bombardiers à grande vitesse§! sont beaucoup plus rapides, ont une portée bien plus longue et sont beaucoup plus résistants. §YLes bombardiers nucléaires§! ont une portée mondiale.\n\n§CMISSILES§!\n§YLes missiles de croisière§! et §Yles missiles balistiques§! sont des armes dévastatrices à usage unique que vous déployez à partir de lance-missiles à longue portée stationnés dans des §Ybases aériennes§!. Ils peuvent accomplir presque toutes les missions et ont des effets immédiats dévastateurs. §YMissiles balistiques§! sont nucléaires.\n\n§CAVIONS DE TRANSPORT§!\n§YAvions de transport/logistique§! sont utilisés pour parachuter des unités §YAériennes§! et pour effectuer des missions de §YRavitaillement aérien§! afin de déplacer temporairement une partie de la §YLimite de ravitaillement§! de la région où se trouve la §YBase aérienne§! vers la région cible."
