ventionnelles à usage unique que vous pouvez déployer à partir de lanceurs à longue portée situés dans des §YBases aériennes§! pour infliger d'importants dégâts en rafale à un coût élevé avant de devoir en construire d'autres. §YMissiles balistiques§! sont des armes nucléaires tactiques que vous pouvez utiliser pour infliger beaucoup plus de dégâts que les §YMissiles de croisière§!, mais ils sont nettement plus chers, leur §BRécherche§! coûteuse, et ils nécessitent £resources_strip|6."
 TUTOR_military_207: "NBC/Armes de destruction massive/Technologie nucléaire"
 TUTOR.207.t: "NBC/Armes de destruction massive/Technologie nucléaire"
 TUTOR_military_207_desc: "L'onglet §BTech BWMD§! vous permet de mener des §Brecherches§! dans les domaines nucléaire, biologique et chimique. Vous pouvez §Brechercher§! des §Yarmes et équipements NBC§!, des §RAarmes de destruction massive nucléaires§!, des §YMoteurs nucléaires§! et de l'§Yénergie nucléaire§!.\n\n§CARMES DE DESTRUCTIONS MASSIVES NUCLÉAIRES§!\n§YLes armes de destruction massive nucléaires§! sont les armes les plus dévastatrices de votre arsenal. Utilisées dans l'onglet §YWMD§!, ces armes peuvent servir à anéantir rapidement le pays et l'économie d'un adversaire lors d'une §Rguerre nucléaire§!.Vous fabriquez des §YArmes nucléaires§! dans l'§BOnglet Technologie des fusées§! ou construisez de puissantes §RArmes thermonucléaires§! à l'aide du bâtiment §YUsine de fabrication d'armes nucléaires§!. Le bâtiment §YAbris de défense civile§! est un excellent moyen de réduire les dégâts subis lors des attaques ennemies.\n\n§CARMES ET ÉQUIPEMENTS SPÉCIAUX§!\nDans cette section, vous pouvez §Bmener des recherches§! §YArmes biologiques§! à déchaîner sur vos ennemis dans l'onglet §YWMD§!, des §YArmes chimiques et utilitaires§! qui sont utilisées comme §YCompétences de l'armée§!, et du §YGaz neurotoxique§!, une compétence qui devient progressivement plus puissante mais aussi plus dangereuse tant pour l'ennemi que pour son utilisateur à mesure que vous la développez.\n\n§CRECHERCHE NUCLÉAIRE§!\nDans cette section, vous pouvez §Brechercher§! diverses §BTechnologies nucléaires§! non militarisées. Les §YCentrales nucléaires§! sont coûteuses, vulnérables aux §RBombardements stratégiques§!, et consomment £resources_strip|6. Malgré cela, elles constituent la forme la plus efficace d’acquisition de £resources_strip|7. Les §YNuclear Reactors§! sont des moteurs très fiables mais extrêmement coûteux qui ne consomment pas de carburant. §YFusion Power§! est un §YFlag Building§! extrêmement coûteux (les bâtiments « drapeau » sont des bâtiments construits par des décisions et ne se trouvent pas dans les emplacements de construction) qui est construit via les §YRGO Decisions§!."
 TUTOR.207.d: "L'onglet §BTech BWMD§! vous permet de mener des §Brecherches§! dans les domaines nucléaire, biologique et chimique. Vous pouvez §Brechercher§! des §Yarmes et équipements NBC§!, des §RAarmes de destruction massive nucléaires§!, des §YMoteurs nucléaires§! et de l'§Yénergie nucléaire§!.\n\n§CARMES DE DESTRUCTIONS MASSIVES NUCLÉAIRES§!\n§YLes armes de destruction massive nucléaires§! sont les armes les plus dévastatrices de votre arsenal. Utilisées dans l'onglet §YWMD§!, ces armes peuvent servir à anéantir rapidement le pays et l'économie d'un adversaire lors d'une §Rguerre nucléaire§!.Vous fabriquez des §YArmes nucléaires§! dans l'§BOnglet Technologie des fusées§! ou construisez de puissantes §RArmes thermonucléaires§! à l'aide du bâtiment §YUsine de fabrication d'armes nucléaires§!. Le bâtiment §YAbris de défense civile§! est un excellent moyen de réduire les dégâts subis lors des attaques ennemies.\n\n§CARMES ET ÉQUIPEMENTS SPÉCIAUX§!\nDans cette section, vous pouvez §Bmener des recherches§! §YArmes biologiques§! à déchaîner sur vos ennemis dans l'onglet §YWMD§!, des §YArmes chimiques et utilitaires§! qui sont utilisées comme §YCompétences de l'armée§!, et du §YGaz neurotoxique§!, une compétence qui devient progressivement plus puissante mais aussi plus dangereuse tant pour l'ennemi que pour son utilisateur à mesure que vous la développez.\n\n§CRECHERCHE NUCLÉAIRE§!\nDans cette section, vous pouvez §Brechercher§! diverses §BTechnologies nucléaires§! non militarisées. Les §YCentrales nucléaires§! sont coûteuses, vulnérables aux §RBombardements stratégiques§!, et consomment £resources_strip|6. Malgré cela, elles constituent la forme la plus efficace d’acquisition de £resources_strip|7. Les §YNuclear Reactors§! sont des moteurs très fiables mais extrêmement coûteux qui ne consomment pas de carburant. §YFusion Power§! est un §YFlag Building§! extrêmement coûteux (les bâtiments « drapeau » sont des bâtiments construits par des décisions et ne se trouvent pas dans les emplacements de construction) qui est construit via les §YRGO Decisions§!."
 TUTOR_military_209: "Doctrines"
 TUTOR.209.t: "Doctrines"
 TUTOR_military_209_desc: "§YDoctrines§! sont utilisées pour définir les stratégies globales de ton armée et définir ou améliorer ton style de jeu tout au long de la campagne. Les §YDoctrines§! sont §Rmutuellement exclusives§! et ne peuvent pas être changées (à cause d’un bug qui fait crasher les doctrines moddés).\n\n§CDOCTRINES AÉRIENNES§!\nIl existe 3 §YAir Doctrines§! dans CWIC.\n§YPolyvalence aéronautique§! est une doctrine centrée sur la polyvalence et une maintenance minimale. Elle donne des bonus à l’efficacité des §YMultiroles§! et des §YBombardiers tactiques§!, ce qui te permet de réduire le nombre de chaînes de production différentes nécessaires. De plus, elle §Gréduit fortement les accidents et les pénalités liées aux mauvaises conditions météo§!.\n§YGuerre systémique§! privilégie l’aspect stratégique de l'§YArmée de l'air§!. Elle donne des bonus au §YBombardement stratégique§! et à la §YSupériorité aérienne§!. Son objectif est de te permettre de perturber indirectement la machine de guerre ennemie par la destruction stratégique.\n§YIntégrité tactique§! est l’opposé de la §YPolyvalence aéronautique§! et de la §YGuerre systémique§!. §YIntégrité tactique§! donne des bonus aux unités aériennes spécialisées et se concentre sur le soutien aux armées et aux marines lors de leurs offensives. Elle donne davantage de bonus aux missions de §YSupériorité aérienne§! et aux appareils spécialisés pour jouer un rôle de soutien aux autres branches, et améliore l’§YInterception§! pour combattre les bombardiers ennemis."
 TUTOR.209.d: "§YDoctrines§! sont utilisées pour définir les stratégies globales de ton armée et définir ou améliorer ton style de jeu tout au long de la campagne. Les §YDoctrines§! sont §Rmutuellement exclusives§! et ne peuvent pas être changées (à cause d’un bug qui fait crasher les doctrines moddés).\n\n§CDOCTRINES AÉRIENNES§!\nIl existe 3 §YAir Doctrines§! dans CWIC.\n§YPolyvalence aéronautique§! est une doctrine centrée sur la polyvalence et une maintenance minimale. Elle donne des bonus à l’efficacité des §YMultiroles§! et des §YBombardiers tactiques§!, ce qui te permet de réduire le nombre de chaînes de production différentes nécessaires. De plus, elle §Gréduit fortement les accidents et les pénalités liées aux mauvaises conditions météo§!.\n§YGuerre systémique§! privilégie l’aspect stratégique de l'§YArmée de l'air§!. Elle donne des bonus au §YBombardement stratégique§! et à la §YSupériorité aérienne§!. Son objectif est de te permettre de perturber indirectement la machine de guerre ennemie par la destruction stratégique.\n§YIntégrité tactique§! est l’opposé de la §YPolyvalence aéronautique§! et de la §YGuerre systémique§!. §YIntégrité tactique§! donne des bonus aux unités aériennes spécialisées et se concentre sur le soutien aux armées et aux marines lors de leurs offensives. Elle donne davantage de bonus aux missions de §YSupériorité aérienne§! et aux appareils spécialisés pour jouer un rôle de soutien aux autres branches, et améliore l’§YInterception§! pour combattre les bombardiers ennemis."
 TUTOR_military_210: "Insurrections/Occupation"
 TUTOR.210.t: "Insurrections/Occupation"
 TUTOR_military_210_desc: "Tout au long du jeu, vous devrez affronter des §RRésistances§! Il existe 2 types de §RRésistances§!.\n\n§CINSURRECTIONS§!\nLes §RRésistances§! qui sont des §CInsurrections §! sont très dangereuses et menacent votre paysage politique. Elles sont spécifiques à une région et programmées pour se produire. Elles apparaîtront comme un mécanisme dans l'onglet §YDécisions§!. Leur combat peut nécessiter d’importantes quantités de §YPuissance politique§!, d’§YArgent§! et d’§YÉquipement§!. Si vous ne parvenez pas à les réprimer, elles §Rdonneront naissance à un nouveau pays indépendant qui s’opposera à vous ou changeront votre gouvernement§!, vous privant ainsi d’importantes quantités de §Yressources§!, de terres et potentiellement d’actifs militaires tels que l’§YÉquipement§! ou les §YBases aériennes§!.\n\n§CRÉSISTANCE NON ESSENTIELLE§!\n§RLes résistances non essentielles§! sont des §RRésistances§! dynamiques qui apparaissent sur l'ensemble du territoire §Ynon-essentiel§!. Elles sont dynamiques et sont neutralisées par vos §YModèles de garnison§! dans l'onglet §YDéploiement§!. Il est recommandé de donner la priorité à la création d'un §YModèle de garnison§! qui soit rentable et d'une largeur supérieure à 10. La largeur exacte n'a pas d'importance, car les §YGarnisons§! peuvent utiliser des §YGarnisons§! partielles ou multiples dans un territoire. Privilégiez un rapport coût/suppression optimal et §RÉQUIPEZ-LES TOUJOURS D'UNE UNITÉ DE POLICE MILITAIRE§!. Ne leur attribuez pas de §YVéhicules de combat§! tels que des §YChars§! ni d'§YArmes d'appui-feu§! telles que l'§YArtillerie§!, car ils sont inutiles pour les modèles de §YGarnison§!. Les §YUnités motorisées, les APC mécanisés et la cavalerie aérienne§! ont tous des niveaux de suppression élevés, mais la cavalerie aérienne, bien que légèrement plus efficace en termes d'effectifs, n'est souvent pas rentable. S'il y a un §RNon-respect§! dans la région, la §Rrésistance§! attaquera la §YGarnison§! et tentera de détruire les §YBâtiments§! et pourra même §RDéclarer l'indépendance§!. Lorsque la §RRésistance§! attaque la §YGarnison§!, elle mènera des §YOpérations de résistance§! visant les ressources. Disposer des §Btechnologies§! §YCanon automatique§! ou §YPolice militaire§! peut réduire les dégâts causés par les §YOpérations de résistance§!. Le pourcentage de résistance de la §YGarnison§! réduira les dégâts globaux que lui inflige la §YRésistance§!."
 TUTOR.210.d: "Tout au long du jeu, vous devrez affronter des §RRésistances§! Il existe 2 types de §RRésistances§!.\n\n§CINSURRECTIONS§!\nLes §RRésistances§! qui sont des §CInsurrections §! sont très dangereuses et menacent votre paysage politique. Elles sont spécifiques à une région et programmées pour se produire. Elles apparaîtront comme un mécanisme dans l'onglet §YDécisions§!. Leur combat peut nécessiter d’importantes quantités de §YPuissance politique§!, d’§YArgent§! et d’§YÉquipement§!. Si vous ne parvenez pas à les réprimer, elles §Rdonneront naissance à un nouveau pays indépendant qui s’opposera à vous ou changeront votre gouvernement§!, vous privant ainsi d’importantes quantités de §Yressources§!, de terres et potentiellement d’actifs militaires tels que l’§YÉquipement§! ou les §YBases aériennes§!.\n\n§CRÉSISTANCE NON ESSENTIELLE§!\n§RLes résistances non essentielles§! sont des §RRésistances§! dynamiques qui apparaissent sur l'ensemble du territoire §Ynon-essentiel§!. Elles sont dynamiques et sont neutralisées par vos §YModèles de garnison§! dans l'onglet §YDéploiement§!. Il est recommandé de donner la priorité à la création d'un §YModèle de garnison§! qui soit rentable et d'une largeur supérieure à 10. La largeur exacte n'a pas d'importance, car les §YGarnisons§! peuvent utiliser des §YGarnisons§! partielles ou multiples dans un territoire. Privilégiez un rapport coût/suppression optimal et §RÉQUIPEZ-LES TOUJOURS D'UNE UNITÉ DE POLICE MILITAIRE§!. Ne leur attribuez pas de §YVéhicules de combat§! tels que des §YChars§! ni d'§YArmes d'appui-feu§! telles que l'§YArtillerie§!, car ils sont inutiles pour les modèles de §YGarnison§!. Les §YUnités motorisées, les APC mécanisés et la cavalerie aérienne§! ont tous des niveaux de suppression élevés, mais la cavalerie aérienne, bien que légèrement plus efficace en termes d'effectifs, n'est souvent pas rentable. S'il y a un §RNon-respect§! dans la région, la §Rrésistance§! attaquera la §YGarnison§! et tentera de détruire les §YBâtiments§! et pourra même §RDéclarer l'indépendance§!. Lorsque la §RRésistance§! attaque la §YGarnison§!, elle mènera des §YOpérations de résistance§! visant les ressources. Disposer des §Btechnologies§! §YCanon automatique§! ou §YPolice militaire§! peut réduire les dégâts causés par les §YOpérations de résistance§!. Le pourcentage de résistance de la §YGarnison§! réduira les dégâts globaux que lui inflige la §YRésistance§!."
 TUTOR_military_211: "Présentation de l'interface graphique de WMD"
 TUTOR.211.d: "« Cold War Iron Curtain » introduit un tout nouveau système d'armes de destruction massive, permettant des échanges nucléaires plus complexes et stratégiques par rapport à la méthode standard consistant à cliquer simplement sur chaque province. L'interface graphique comporte 8 éléments de base. \n 1. La partie supérieure gauche de l'écran affiche les puissances nucléaires mondiales, c'est-à-dire les pays qui ont armé leur arsenal via l'onglet « Politique ». \n 2. L'écran Defcon affiche votre niveau Defcon et n'est disponible que pour les États-Unis, l'URSS et la République populaire de Chine. Baisser le niveau indique un degré de tension plus élevé.\n\n3. La partie centrale de l'interface graphique indique le nombre d'armes de destruction massive dont vous disposez pour chaque type, des bombes nucléaires classiques aux missiles balistiques intercontinentaux. La liste des armes chimiques tout à droite est encore en cours d'élaboration, et la fonction de dénucléarisation… enfin, pourquoi voudriez-vous faire ça, de toute façon ? \n 4. Sous la section évoquée au point 3 se trouvent 3 options, pour une frappe de niveau 1, 2 ou 3, chacune proposant un nombre différent de bombes nucléaires utilisées et des cibles différentes. Le niveau 1 correspond à une attaque de base contre les capitales ennemies à portée. Le niveau 2 correspond au niveau 1, avec des bombes nucléaires supplémentaires pour des cibles stratégiques, c'est-à-dire les grands centres urbains ou industriels. Le niveau 3 est une frappe nucléaire totale et sans merci, qui nécessite l'une des deux conditions suivantes : la technologie des missiles balistiques intercontinentaux (ICBM), ou, pour l'URSS ou les États-Unis, des missiles déployés respectivement à Cuba ou en Turquie. \n 5. Le gros bouton nucléaire grisé deviendra rouge si toutes les conditions de lancement sont remplies, et vous pourrez alors vous lancer dans une guerre thermonucléaire mondiale. \n 6. Sous le gros bouton se trouve une liste des armes nucléaires nécessaires à la frappe. \n 7. À gauche de celle-ci se trouve une liste des cibles par État pour la frappe. \n 8. À gauche de celle-ci se trouve une liste des pays ennemis à portée de vos missiles. \n\n N'oubliez pas : si vous rencontrez des bugs ou des problèmes avec ce système, n'hésitez pas à les signaler sur Steam ou Discord. \n\n Bon bombardement !"
