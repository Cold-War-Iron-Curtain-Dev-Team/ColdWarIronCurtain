l_english:
 winterolympics.1.d: "Les VIe Jeux olympiques d'hiver se sont déroulés à Oslo, en Norvège, la semaine dernière. Trente pays y ont présenté leurs meilleurs athlètes. La Norvège espérait accueillir les Ve Jeux olympiques d'hiver de 1948, mais la Seconde Guerre mondiale avait contraint le CIO à suspendre l'organisation de nouveaux Jeux. Après la guerre, le CIO décida d'attribuer les Ve Jeux olympiques d'hiver de 1948 à Saint-Moritz, en Suisse, et de confier l'organisation des VI<sup>es</sup> Jeux olympiques d'hiver de 1952 à Oslo, en Norvège. La Norvège remporta la première place avec 15 médailles, suivie des États-Unis avec 11 médailles. La Finlande termina troisième avec 9 médailles. Les prochains Jeux olympiques d'hiver auront lieu à Cortina, en Italie, en 1956."
 winterolympics.2.d: "Les VIIe Jeux olympiques d'hiver se sont déroulés à Cortina, en Italie, où des athlètes du monde entier sont venus participer aux Jeux olympiques. Cortina avait initialement été choisie pour accueillir les Viesmes Jeux olympiques d'hiver de 1944, mais ceux-ci ont été annulés en 1941 en raison de la Seconde Guerre mondiale. Les Viesmes Jeux olympiques d'hiver ont finalement eu lieu à Saint-Moritz, en Suisse, en 1948. L'Italie fait son entrée sur la scène olympique, car c'est la première fois qu'elle accueille les Jeux olympiques. Il s'agit également du premier événement olympique multinational, car des spectateurs venus d'Allemagne ou d'URSS ont pu y assister. L'URSS a remporté la première place avec 16 médailles, suivie de l'Autriche avec 11 médailles et de la Finlande avec 7 médailles. Les prochains Jeux olympiques d'hiver se dérouleront à Squaw Valley, aux États-Unis."
 winterolympics.3.d: "Les VIIe Jeux olympiques d'hiver se sont déroulés à Squaw Valley, aux États-Unis, attirant une foule nombreuse dans cette petite ville californienne. Plus de 800 millions de dollars ont été investis dans l'expansion de Squaw Valley. Les États-Unis ont déjà accueilli trois Jeux olympiques : les III<sup>es</sup> Jeux olympiques de 1904 à Saint-Louis, les III<sup>es</sup> Jeux olympiques d'hiver de 1932 à Lake Placid et les X<sup>es</sup> Jeux olympiques de 1932 à Los Angeles. Pour la première fois, les Jeux olympiques étaient retransmis à la télévision dans le monde entier et accessibles à tous. Les XI<sup>es</sup> Jeux olympiques de 1936 furent les premiers Jeux olympiques télévisés, mais seulement en Allemagne et dans certaines régions d'Europe. Les XIV<sup>es</sup> Jeux olympiques de 1948 furent également télévisés, mais seulement en Angleterre et dans quelques parties de l'Europe occidentale. L'Allemagne participait également pour la première fois à ces Jeux sous une équipe unifiée. L'URSS remporta une nouvelle fois la première place avec 21 médailles, l'équipe unifiée d'Allemagne arriva deuxième avec 8 médailles et les États-Unis troisièmes avec 10 médailles. Les prochains Jeux olympiques d'hiver se dérouleront à Innsbruck, en Autriche, en 1964."
 winterolympics.4.d: "Les IXe Jeux olympiques d'hiver se sont déroulés pour la première fois en Autriche, à Innsbruck. De nombreuses infrastructures avaient été construites pour préparer les athlètes. Cependant, l'enneigement fut insuffisant et l'armée autrichienne dut extraire 20 000 blocs de glace d'une montagne. Ces blocs furent ensuite transportés jusqu'aux pistes de ski alpin. L'URSS remporta la première place pour la troisième fois consécutive avec 25 médailles. La Norvège arriva deuxième avec 15 médailles et l'Autriche troisième avec 12 médailles. Les prochains Jeux olympiques d'hiver eurent lieu à Grenoble, en France, en 1968."
 winterolympics.5.d: "Les Xe Jeux olympiques se sont déroulés à Grenoble, en France, la semaine dernière. C'était la première fois que l'Allemagne de l'Ouest et l'Allemagne de l'Est participaient séparément aux Jeux olympiques. Ce furent également les premiers Jeux olympiques où une mascotte fut choisie pour les représenter. Schuss était la mascotte de ces Jeux. Les Xᵉ Jeux olympiques d'hiver de 1968 étaient les troisièmes Jeux olympiques organisés par la France. La France avait déjà accueilli les Iᵉ Jeux olympiques d'hiver de 1924 à Chamonix et les VIIIᵉ Jeux olympiques d'hiver de 1924 à Paris. La Norvège est rentrée à Oslo avec 14 médailles, devançant l'URSS d'une seule médaille. L'URSS a terminé deuxième avec 13 médailles, et la France troisième avec 9 médailles. Les prochains Jeux olympiques d'hiver auront lieu à Sapporo, au Japon, en 1972."
 winterolympics.6.d: "Les Xe Jeux olympiques d'hiver se sont déroulés à Sapporo, au Japon, la semaine dernière. C'est la première fois que des Jeux olympiques d'hiver ont lieu hors d'Europe et d'Amérique du Nord. Les Ve<sup>es</sup> Jeux olympiques d'hiver de 1940 devaient initialement se tenir à Sapporo, mais en raison du déclenchement de la Seconde Guerre sino-japonaise en 1937, ils furent déplacés à Saint-Moritz, en Suisse. Cette décision suscita de nouvelles controverses, ce qui amena le CIO à les transférer à Garmisch-Partenkirchen, en Allemagne. Cependant, en 1939, les Jeux d'hiver de 1940 furent annulés suite au déclenchement de la Seconde Guerre mondiale. Après plus de 30 ans d'absence, les Jeux olympiques d'hiver font enfin leur retour à Sapporo, au Japon. L'URSS a remporté la première place avec 16 médailles, suivie de l'Allemagne de l'Est avec 14 médailles et de la Suisse avec 10 médailles. Les prochains Jeux olympiques d'hiver se tiendront à Innsbruck, en Autriche, en 1976."
 winterolympics.7.d: "Les Jeux olympiques d'hiver ont fait leur retour à Innsbruck, en Autriche, cette semaine, après le retrait de Denver de l'organisation des XII<sup>es</sup> Jeux olympiques d'hiver de 1972. Galina Kulakova, de l'Union soviétique, a terminé troisième de l'épreuve de ski alpin féminin (5 km), mais a été disqualifiée pour avoir utilisé un spray nasal contenant de l'éphédrine, une substance interdite. La FIS et le CIO l'ont autorisée à participer au 10 km et au relais 4 × 5 km. Il s'agissait de la première médaille retirée aux Jeux olympiques d'hiver de l'histoire. L'URSS a terminé première avec 27 médailles, suivie de l'Allemagne de l'Est avec 19 et des États-Unis avec 10. Cependant, c'était la première fois qu'une athlète se voyait retirer une médaille après la découverte de la tricherie de Galina Kulakova, de l'URSS, qui avait utilisé une substance interdite contenue dans un spray nasal. Les prochains Jeux olympiques d'hiver se dérouleront à Lake Placid, aux États-Unis, en 1980."
 winterolympics.8.d: "Les XIIe Jeux olympiques d'hiver se sont déroulés à Lake Placid, dans l'État de New York, pour la deuxième fois après les III<sup>es</sup> Jeux olympiques d'hiver de 1932. L'équipe masculine américaine de hockey sur glace, donnée perdante pour la phase de groupes, a pourtant réalisé un parcours exceptionnel en battant l'URSS et en remportant la médaille d'or. Cet exploit est déjà surnommé le « Miracle sur glace ». Cette victoire a conquis le cœur des Américains en pleine Guerre froide, même si c'est le succès face à la Finlande qui leur a assuré la médaille d'or. L'URSS a terminé première avec 22 médailles, suivie de l'Allemagne de l'Est (21 médailles) et des États-Unis (12 médailles). Les prochains Jeux olympiques d'hiver auront lieu à Sarajevo, en Yougoslavie, en 1984."
 winterolympics.9.d: "Les XIVe Jeux olympiques d'hiver se sont déroulés à Sarajevo, en Yougoslavie, la semaine dernière. C'était la première fois que les Jeux olympiques d'hiver étaient organisés dans un État socialiste. Les Yougoslaves ont remporté leur première médaille, l'argent, en slalom géant. Plus de 49 nations ont participé, un record olympique. La République populaire de Chine a mis fin à son boycott des Jeux olympiques, provoqué par la controverse concernant la reconnaissance de la République de Chine par le CIO. La République de Chine a participé aux Jeux sous le nom de Taipei chinois. L'Allemagne de l'Est a terminé première avec 25 médailles, l'URSS deuxième avec 24 médailles et les États-Unis troisièmes avec 8 médailles. Les prochains Jeux olympiques d'hiver auront lieu à Calgary, au Canada, en 1988."
 winterolympics.10.d: "Les XVe Jeux olympiques se sont déroulés à Calgary, au Canada, ces deux dernières semaines. Des centaines d'athlètes ont bravé le froid extrême, avec des températures descendant jusqu'à -5 °C. Les Jamaïcains ont participé pour la première fois à l'épreuve de bobsleigh à deux, mais ont été éliminés après une chute dans le tube. Le Britannique Eddie « The Eagle » Edwards, spécialiste du saut à ski, a connu un échec retentissant en terminant dernier de toutes les épreuves auxquelles il a participé. L'URSS a remporté le plus grand nombre de médailles avec 29, suivie de l'Allemagne de l'Est avec 25 médailles et de la Suisse avec 15 médailles. Les prochains Jeux olympiques d'hiver auront lieu à Albertville, en France, en 1992."
 winterolympics.11.d: "Les XVIe Jeux olympiques d'hiver se sont déroulés à Albertville, en France, la semaine dernière. Ces Jeux de 1992 étaient les quatrièmes Jeux olympiques organisés par la France. Après ceux de 1924 à Chamonix (I<sup>ers</sup> Jeux olympiques d'hiver), de 1924 à Paris (VIII<sup>es</sup> Olympiade) et de 1968 à Grenoble (X<sup>es</sup> Jeux olympiques d'hiver), la France a accueilli les Jeux olympiques d'hiver pour la dernière fois cette année-là, en été et en hiver. La Norvège a remporté toutes les épreuves de ski de fond. L'Allemagne a terminé première avec 26 médailles, suivie de l'équipe unifiée avec 23 médailles et de la Norvège, troisième avec 20 médailles. Les prochains Jeux olympiques d'hiver auront lieu à Lillehammer, en Norvège, en 1994."
 winterolympics.12.d: "Les XVIIe Jeux olympiques d'hiver se sont déroulés à Lillehammer, en Norvège, ces deux dernières semaines. Lillehammer est la ville la plus septentrionale à avoir jamais accueilli des Jeux olympiques d'hiver. La Norvège avait déjà organisé les VI<sup>es</sup> Jeux olympiques d'hiver en 1952. Ce sont également les premiers Jeux olympiques à se tenir une année différente de celle des Jeux olympiques d'été. La Norvège a remporté le plus grand nombre de médailles, se classant première avec 26 médailles. L'Allemagne a obtenu 24 médailles et s'est classée deuxième, tandis que la Russie a terminé troisième avec 23 médailles. Les prochains Jeux olympiques d'hiver auront lieu à Nagano, au Japon, en 1998."
 winterolympics.13.d: "Les XVIIe Jeux olympiques d'hiver se sont déroulés à Nagano, au Japon, ces deux dernières semaines. Nagano est la ville la plus méridionale à avoir accueilli des Jeux olympiques d'hiver, seule Squaw Valley, en Californie, en 1960, pouvant être comparée à Nagano. Il s'agit des troisièmes Jeux olympiques organisés par le Japon, après les Jeux d'été de 1964 à Tokyo et les Jeux d'hiver de 1972 à Sapporo. L'Allemagne a remporté la première place avec 29 médailles, suivie de la Norvège avec 25 médailles et de la Russie avec 18 médailles. Les prochains Jeux olympiques d'hiver auront lieu à Salt Lake City, aux États-Unis, en 2002."
 winterolympics.14.d: "Les XIXe Jeux olympiques d'hiver se sont déroulés la semaine dernière à Salt Lake City, accueillant des athlètes du monde entier venus démontrer leur talent. Ces Jeux ont été marqués par une controverse, plusieurs membres du CIO ayant été corrompus pour obtenir leur organisation. Les États-Unis ont déjà accueilli quatre Jeux olympiques : les IIIe Jeux olympiques de 1904 à Saint-Louis, les IIIe Jeux olympiques d'hiver de 1932 à Lake Placid, les Xe Jeux olympiques de 1932 à Los Angeles, les XXIIIe Jeux olympiques de 1984 à Los Angeles et enfin les XXVIe Jeux olympiques de 1996 à Atlanta. L'Allemagne a remporté la première place avec 36 médailles, suivie des États-Unis (34 médailles) et de la Norvège (25 médailles). Les prochains Jeux olympiques d'hiver auront lieu à Turin, en Italie, en 2006."
 winterolympics.15.d: "Les XXe Jeux olympiques d'hiver se sont déroulés pour la deuxième fois en Italie, les athlètes se rendant à Turin pour tenter de remporter des médailles. L'Italie avait déjà accueilli les VIIe Jeux olympiques d'hiver de 1956 à Cortina et les XVIIe Jeux olympiques de 1960 à Rome. Ces Jeux ont connu une faible affluence et plusieurs cas de dopage, touchant notamment les équipes autrichienne, russe et brésilienne. L'Allemagne a remporté 29 médailles et s'est classée première, suivie des États-Unis avec 25 médailles et de l'Autriche avec 23. Il est possible que les Autrichiens se soient vu retirer une ou deux médailles en raison d'allégations de dopage. Les prochains Jeux olympiques d'hiver ont été annoncés à Vancouver, au Canada, en 2010."
 winterolympics.16.d: "Les XXIe Jeux olympiques d'hiver se sont déroulés à Vancouver, au Canada, ces dernières semaines. Il s'agit des troisièmes Jeux olympiques organisés par le Canada, après ceux de Montréal en 1976 (XIIe Olympiade) et de Calgary en 1988 (XVe Jeux olympiques d'hiver). Ces Jeux ont été marqués par plusieurs problèmes, allant d'un enneigement insuffisant à des actes de vandalisme sur le matériel, en passant par des manifestations qui ont nécessité un renforcement des mesures de sécurité. Les États-Unis ont remporté la première place avec 37 médailles. L'Allemagne et le Canada ont terminé respectivement deuxième et troisième, l'Allemagne remportant 30 médailles et le Canada 26. Les prochains Jeux olympiques d'hiver auront lieu à Sotchi, en Russie, en 2014."
 winterolympics.17.d: "Les XXIIe Jeux olympiques d'hiver se sont déroulés à Sotchi, en Russie, ces deux dernières semaines. La Russie avait déjà accueilli les Jeux de 1980 à Moscou. Ces Jeux d'hiver ont été les plus coûteux de l'histoire, avec 51 milliards de dollars dépensés à Sotchi. Des allégations de dopage concernant certains athlètes russes ont également été formulées, et le CIO a indiqué que cela aurait des répercussions sur leur participation aux Jeux olympiques d'hiver de 2018. Bénéficiant de l'avantage du terrain, la Russie a remporté la première place avec 29 médailles, suivie de la Norvège (26 médailles) et du Canada (25 médailles). Les prochains Jeux olympiques d'hiver auront lieu à PyeongChang, en République de Corée."
 winterolympics.18.d: "Les XXIIIe Jeux olympiques d'hiver se sont déroulés à PyeongChang, en République de Corée, au cours des deux dernières semaines. Il s'agit des deuxièmes Jeux olympiques organisés par la Corée du Sud, après ceux de la XXIV<sup>e</sup> Olympiade de 1988 à Séoul. Le CIO a contraint la Russie à ne pas participer sous son égide nationale et a proposé à ses athlètes de concourir sous la bannière des Athlètes olympiques de Russie (OAR). La Norvège a remporté la première place avec 39 médailles, suivie de l'Allemagne avec 31 médailles et du Canada avec 29 médailles. Les prochains Jeux olympiques d'hiver auront lieu à Pékin, en République populaire de Chine, en 2022."