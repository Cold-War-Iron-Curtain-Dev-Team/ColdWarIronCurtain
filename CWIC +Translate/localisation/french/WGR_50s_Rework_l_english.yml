 WGR_state_owned_stores: "Magasins d'État vendant des biens de consommation"
 WGR_state_owned_stores_desc: "Les magasins d'État spécialisés dans les biens de consommation garantiront une distribution équitable des marchandises, réduiront la dépendance vis-à-vis des entreprises privées et favoriseront l'égalité économique."
 ig_farben: "IG Farben"
 ig_farben_desc: "Bien que controversée en raison de sa coopération étroite avec le NSDAP entre 1933 et 1945, IG Farben reste la première entreprise chimique et pharmaceutique d'Europe. Même si elle ne peut plus suivre la même voie qu'auparavant, ses ressources et son potentiel sont trop précieux pour être abandonnés."
