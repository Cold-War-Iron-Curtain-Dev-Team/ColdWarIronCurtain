 WGR_1949_Adenauer_No_SPD_Talks_tt: "§RTout en excluant le SPD des affaires officielles de la coalition et en le montant davantage contre nous, son influence au Bundesrat entraînera le blocage de certaines lois financières et administratives. Les objectifs correspondants seront contournés, ce qui ne procurera aucun avantage à notre administration. D'un autre côté, cela permettra de contenir l'influence globale du SPD et nous assurera une plus grande stabilité gouvernementale.§!"
 Build_A_Coalition_Fancypants_WGR_Adenauer_1949_tt: "§RAfin de former un gouvernement opérationnel, nous devons tendre la main aux autres partis représentés au Bundestag afin de former une coalition. Nous devons également discuter de la manière dont nous devons aborder les sociaux-démocrates, compte tenu de leur rôle en tant que principale opposition à nos politiques.§!"
