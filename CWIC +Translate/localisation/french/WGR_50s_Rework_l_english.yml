 WGR_SPD_Ollenhauer_Bundestag_1957: "Le Bundestag"
 WGR_SPD_BUNDESTAG_1957_OLLENHAUER_1_DESC_GUI: "Quatre années se sont déjà écoulées, et le peuple allemand se rend une nouvelle fois aux urnes pour élire les députés qui le représenteront au Bundestag. Les sociaux-démocrates bénéficient toujours d’un large soutien populaire, notamment grâce aux politiques menées par Ollenhauer en matière d’assurance sociale, de protection des minorités et de retour de la Sarre. Les chrétiens-démocrates ont de nouveau été relégués dans l'opposition, mais le chancelier Ollenhauer pourrait se montrer ouvert à une certaine coopération.\n\nLe Bundestag exige des coalitions majoritaires pour adopter des lois, ce qui signifie que le chancelier Ollenhauer a besoin d'au moins 260 des 519 sièges actuels pour faire passer son programme. À cela s'ajoute l'introduction du vote par correspondance, pratique pour les citoyens allemands travaillant à l'étranger. Le moment est à nouveau venu de tendre la main aux autres partis disposés à soutenir les politiques du SPD, en faisant des promesses et en trouvant des compromis qui profiteront aux deux parties.\n\n§C260§! sièges sont nécessaires pour obtenir la majorité. Les résultats des élections sont les suivants :"
 WGR_SPD_BUNDESTAG_1957_OLLENHAUER_2_DESC_GUI: "\n§SParti social-démocrate d’Allemagne (SPD)§! : 217\n§PUnion chrétienne-démocrate (CDU/CSU)§! : 180\n§BZentrum§! : 38\n§mParti démocrate libre (FDP)§! : 35\n§cParti allemand (DP)§! : 20\n§gBloc pan-allemand/Association des anciens combattants et des déplacés (GB/BHE) §! : 19\n\nPartenaires actuels de la coalition : [WGR_OllenhauerCoalitionPartnersStatus1957]"
