 WGR_SPD_BUNDESTAG_1953_1_DESC_GUI: "On a peut-être du mal à s'en rendre compte, mais quatre années se sont déjà écoulées depuis les premières élections au Bundestag, et les sociaux-démocrates bénéficient d'un soutien populaire qui dépasse même celui qu'ils avaient atteint à leur apogée, au début de la Première République. Les chrétiens-démocrates ont été relégués une nouvelle fois dans l'opposition, Egon Franke ayant succédé à Kurt Schumacher au poste de chancelier allemand.\n\nLe Bundestag exige des coalitions majoritaires pour adopter des lois, ce qui signifie que Franke a besoin d'au moins 255 des 509 sièges actuels pour faire passer son programme. À cela s'ajoute l'introduction de la clause des 5 %, qui impose aux partis politiques d'obtenir au moins 5 % des voix ou de remporter un mandat dans une circonscription électorale. Une autre nouveauté a été le second tour de scrutin, permettant aux électeurs de voter pour un candidat politique local. Le moment est à nouveau venu de tendre la main aux autres partis disposés à soutenir les politiques de Franke, en faisant des promesses et en trouvant des compromis qui profiteront aux deux parties.\n\n§C255§! sièges sont nécessaires pour obtenir la majorité. Les résultats des élections sont les suivants :"
