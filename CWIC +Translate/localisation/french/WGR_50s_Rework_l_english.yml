 Thorn_in_the_Side_desc: "Les récents développements socialistes en Allemagne de l'Ouest ont bouleversé nos plans de coopération avec l'Europe occidentale. Le KPD cherche à s'aligner sur l'Union soviétique et pourrait tenter de réunifier l'Allemagne sous la bannière rouge. Nous devons surveiller cette évolution et la contrôler si elle venait à devenir incontrôlable."
