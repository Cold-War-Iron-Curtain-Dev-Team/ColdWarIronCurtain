 1949_SCHUMACHER_NOBODY_IN_COALITION_DESC: "Rien"
 WGR_SPD_Reach_out_to_FDP_1949: "Discussions avec les §mDémocrates libres§! (FD)"
 WGR_SPD_Reach_out_to_BP_1949: "Un appel au §4Parti bavarois§!"
 WGR_SPD_Reach_out_to_Zentrum_1949: "On se rapproche du §BZentrum§!"
 WGR_SPD_Reach_out_to_KPD_1949: "Faire face aux §Rcommunistes§!"
 WGR_SPD_Ollenhauer_Bundestag_1953: "Le Bundestag"
 WGR_SPD_BUNDESTAG_1953_OLLENHAUER_1_DESC_GUI: "On a peut-être du mal à s'en rendre compte, mais quatre années se sont déjà écoulées depuis les premières élections au Bundestag, et les sociaux-démocrates bénéficient d'un soutien populaire qui dépasse même celui qu'ils avaient atteint à leur apogée, au début de la Première République. Les chrétiens-démocrates ont été relégués une nouvelle fois dans l'opposition, Erich Ollenhauer ayant succédé à Kurt Schumacher au poste de chancelier allemand.\n\nLe Bundestag exige des coalitions majoritaires pour l'adoption des lois, ce qui signifie qu'Ollenhauer a besoin d'au moins 255 des 509 sièges actuels pour faire passer son programme. À cela s'ajoute l'introduction de la clause des 5 %, qui impose aux partis politiques d'obtenir au moins 5 % des voix ou de remporter un mandat dans une circonscription électorale. Une autre nouveauté fut le second tour de scrutin, permettant aux électeurs de voter pour un candidat local. Le moment est à nouveau venu de tendre la main aux autres partis disposés à soutenir les politiques d'Ollenhauer, en faisant des promesses et en trouvant des compromis qui profiteront aux deux parties.\n\n§C255§! sièges sont nécessaires pour obtenir la majorité. Les résultats des élections sont les suivants :"
 WGR_SPD_BUNDESTAG_1953_OLLENHAUER_2_DESC_GUI: "\n§SParti social-démocrate d’Allemagne (SPD)§! : 217\n§PUnion chrétienne-démocrate (CDU/CSU)§! : 180\n§BZentrum§! : 38\n§mParti démocrate libre (FDP)§! : 35\n§cParti allemand (DP)§! : 20\n§gBloc pan-allemand/Association des anciens combattants et des déplacés (GB/BHE) §! : 19\n\nPartenaires actuels de la coalition : [WGR_OllenhauerCoalitionPartnersStatus1953]"
