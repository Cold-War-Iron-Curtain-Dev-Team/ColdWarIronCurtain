 WGR_Political_Mediation: "Médiation politique"
 WGR_Establish_Sick_Pay: "Mettre en place des indemnités journalières"
 WGR_Strengthen_Regional_Economies: "Renforcer les économies régionales"
 WGR_Deepen_ECSC_Integration: "Approfondir l'intégration à la CECA"
 WGR_Deepen_ECSC_Integration_desc: "La CECA (Communauté européenne du charbon et de l'acier) a été jusqu'à présent une organisation étonnamment efficace. Bien qu'elle ait été créée pour contrôler l'expansion militaire de l'Allemagne de l'Ouest en surveillant la production de charbon et d'acier, le traité n'était ni unilatéral ni hostile à l'Allemagne. Au contraire, les signataires de la CECA, à savoir la France, l'Italie, l'Allemagne de l'Ouest, la Belgique, les Pays-Bas et le Luxembourg, se sont engagés à partager un marché commun du charbon et de l'acier afin de mettre fin à la concurrence pour les ressources naturelles. Cette initiative, combinée à d'autres efforts politiques amicaux, a permis d'améliorer les relations avec nos voisins et de donner un formidable élan à notre économie. Il est donc logique d'approfondir notre coopération fructueuse, même au-delà des produits industriels de base !"
 WGR_The_Succession_of_Adeneaur: "La succession d'Adenauer"
 WGR_The_Succession_of_Adeneaur_desc: "Konrad Adenauer, premier chancelier de la RFA de 1949 à 1963, a dirigé le pays pendant quatorze années difficiles. Il a remporté de nombreuses victoires politiques pour l'Allemagne au cours de ses mandats, par exemple l'adhésion à l'OTAN, la fin officielle de l'Erbfeindschaft (rivalité jurée) avec la France, la mise en place d'une coopération internationale avec nos voisins... La liste est longue. Bien que principalement couronné de succès, Adenauer a également commis quelques erreurs en raison de son caractère plutôt obstiné. La plus notable, la tristement célèbre affaire Spiegel, a été le catalyseur de sa démission le 15 octobre 1963. De plus, son âge avancé de 87 ans appelait également à la modération. Un jour après l'abdication officielle, l'ancien ministre de l'Économie et père du Wirtschaftswunder, Ludwig Erhard, a été nommé successeur d'Adenauer."
