 WGR_Road_to_Democracy_Shared: "Gouvernement intérimaire"
 POLITICS_SAMLOWSKI_DESC: "§gOriginaire de Prusse orientale, Alfred Samlowski a vu sa jeunesse marquée par les bouleversements politiques et sociaux de l'Allemagne de l'entre-deux-guerres. Il a servi dans la Reichswehr, qui est finalement devenue la Wehrmacht, acquérant de l'expérience tant sur le front que dans des fonctions administratives. Après l'effondrement de l'Allemagne nazie, Samlowski, comme beaucoup d'anciens officiers, a été confronté à un avenir incertain, l'Allemagne étant démantelée et divisée.\n\nAvec l'émergence de la guerre froide et la pression croissante pour sécuriser les frontières de l'Allemagne de l'Ouest, Samlowski s'est engagé dans les efforts visant à rétablir un cadre de sécurité nationale. En 1951, il était devenu une figure de proue du Bundesgrenzschutz, plaidant en faveur d'une force forte mais politiquement neutre pour protéger les frontières de l'Allemagne de l'Ouest. Il soutenait une collaboration étroite avec les forces alignées sur l'OTAN et considérait le BGS comme un élément essentiel pour garantir la souveraineté de la République fédérale contre d'éventuelles incursions du bloc de l'Est.§!"
 Max_Reimann_WGR_desc: "Né à Elbing, en Prusse orientale, Reimann s'engage politiquement dès son plus jeune âge, rejoignant la Ligue spartakiste puis le Parti communiste allemand dans les années 1920. Pendant la République de Weimar, Reimann s'impose comme organisateur et défenseur des droits des travailleurs, se faisant connaître pour son opposition farouche à la montée du fascisme. Après la prise du pouvoir par les nazis en 1933, Reimann a été arrêté à plusieurs reprises et a passé plusieurs années dans des camps de concentration, notamment à Buchenwald, pour ses activités antifascistes. Malgré une persécution sévère, il est resté un communiste engagé et a rejoint la résistance contre le régime nazi. Après la guerre, Reimann a joué un rôle déterminant dans la reconstruction du KPD dans les zones d'occupation occidentales de l'Allemagne, prônant le socialisme en opposition à la reconstruction capitaliste poursuivie par les Alliés.\n\nEn 1949, Reimann était devenu une figure de proue du KPD en Allemagne de l'Ouest, connu pour ses discours enflammés et sa position intransigeante contre l'impérialisme occidental. Ses efforts ont jeté les bases de la présence continue du parti dans le paysage politique allemand divisé de l'après-guerre."
 pol_desc_konrad: "Konrad Hermann Joseph Adenauer, surnommé « Der Alte » (le vieux), est un chrétien fervent et le fondateur de l'Union chrétienne-démocrate d'Allemagne (CDU). Sa politique témoigne d'un engagement profond en faveur d'une vision large de la démocratie libérale fondée sur le marché et de l'anticommunisme. Convaincu qu'une paix durable ne peut être obtenue que grâce à une Europe unie, il est profondément attaché à la coopération européenne, à une politique étrangère orientée vers l'Occident et au rétablissement de la position de l'Allemagne de l'Ouest sur la scène internationale."
 Kurt_Schumacher_WGR_desc: "Né à Kulm, en Prusse occidentale, Kurt Schumacher a été profondément influencé par les troubles qui ont secoué l'Allemagne au début du XXe siècle. Adhérant au Parti social-démocrate dès sa jeunesse, il s'est rapidement fait connaître comme un ardent défenseur de la démocratie et des droits des travailleurs. Soldat décoré pendant la Première Guerre mondiale, Schumacher est rentré chez lui désabusé par le militarisme et est devenu un fervent opposant à l'extrémisme de droite pendant la République de Weimar. En tant que député au Reichstag, il a été l'un des critiques les plus virulents du mouvement nazi naissant, refusant tout compromis même lorsque la violence politique s'est intensifiée.\n\nAprès l'arrivée au pouvoir d'Hitler en 1933, Schumacher fut arrêté par la Gestapo et passa plus d'une décennie dans les camps de concentration nazis, où il endura des conditions brutales qui le laissèrent physiquement affaibli, mais sans briser son moral. Libéré en 1945, il s'est immédiatement attelé à la tâche monumentale de reconstruire le SPD dans l'Allemagne d'après-guerre. Rejetant à la fois les influences communistes et conservatrices, il s'est positionné comme la figure de proue du socialisme démocratique, s'opposant farouchement aux pressions soviétiques et occidentales. En 1949, Schumacher était devenu l'un des hommes politiques les plus influents de l'Allemagne de l'Ouest, voué à la construction d'une Allemagne forte et indépendante, fondée sur la justice sociale et la démocratie."
 Erich_Ollenhauer_WGR_Final_desc: "Né à Magdebourg dans une famille ouvrière, Ollenhauer s'est intéressé très tôt au socialisme et a rejoint la section jeunesse du Parti social-démocrate avant même d'avoir terminé ses études. Fervent défenseur des droits des travailleurs et de la justice sociale, il s'est exilé après la prise du pouvoir par les nazis en 1933, poursuivant son combat pour le socialisme démocratique depuis l'étranger. Ayant passé la majeure partie de son exil en Grande-Bretagne, il a travaillé en étroite collaboration avec d'autres exilés du SPD afin de préserver la structure organisationnelle du parti et de préparer son retour en Allemagne après la guerre.\n\nDe retour dans son pays natal en 1946, Ollenhauer devint rapidement l'un des plus proches alliés de Kurt Schumacher, contribuant à refaire du SPD une force politique puissante dans l'Allemagne d'après-guerre. Alors que Schumacher adoptait une position nationaliste et pro-réarmement ferme, Ollenhauer penchait davantage vers la gauche, prônant une Allemagne neutre, libre du contrôle occidental et soviétique. Sa vision du SPD mettait fortement l'accent sur la justice sociale, les droits des travailleurs et la planification économique, ce qui le mettait souvent en désaccord avec la faction pro-occidentale du parti dirigée par des personnalités telles qu'Egon Franke.\n\nAprès le décès tragique de Schumacher, Ollenhauer a réussi à asseoir son autorité au sein du SPD, prenant ses fonctions à un moment marqué par une grande incertitude. Les manœuvres politiques d'Ollenhauer au sein du SPD ont permis à l'aile gauche de devenir la faction dominante, mettant l'accent sur l'indépendance politique de l'Allemagne et l'établissement d'un État-providence socialiste dans un cadre démocratique."
 Egon_Franke_WGR_Final_desc: "Originaire de Hanovre, Egon Franke a atteint l'âge adulte pendant les dernières années tumultueuses de la République de Weimar, assistant en direct à l'effondrement de la démocratie allemande et à la montée du totalitarisme. Social-démocrate convaincu depuis sa jeunesse, Franke a survécu à l'ère nazie dans la résistance clandestine, maintenant le contact avec les réseaux antifascistes malgré le danger omniprésent. Après la guerre, il est devenu l'un des principaux architectes de la reconstruction de l'Allemagne de l'Ouest, convaincu que l'avenir du SPD résidait dans un alignement ferme avec les Alliés occidentaux et dans l'établissement d'une démocratie forte et orientée vers le marché.\n\nProche allié des éléments pro-occidentaux et modérés au sein du SPD, Franke rejetait l'idée de la neutralité allemande, considérant l'intégration à l'Occident comme la seule voie viable vers la reprise économique et la sécurité. Alors que son collègue Erich Ollenhauer prônait une ligne plus à gauche, plus socialiste, Franke faisait partie de l'aile droite du SPD, défendant la Westbindung (intégration à l'Occident), le réarmement et une coopération étroite avec l'OTAN.\n\nAprès la mort de Kurt Schumacher en 1952, Franke s'est positionné comme la principale figure de l'opposition à Erich Ollenhauer, représentant la faction modérée et pro-occidentale du SPD. Il soutient que la social-démocratie et l'intégration occidentale ne s'excluent pas mutuellement, estimant que la prospérité économique et la stabilité démocratique ne peuvent être atteintes que par la participation à l'alliance occidentale."
 WGR_50s_Pass_the_Grundgesetz: "Adopter la Loi fondamentale"
 WGR_50s_Pass_the_Grundgesetz_desc: "Aujourd'hui, 23 mai 1949, la Loi fondamentale allemande (Grundgesetz) est officiellement entrée en vigueur, marquant la naissance de la République fédérale d'Allemagne et fournissant un cadre solide pour la reconstruction d'une société démocratique et libre. Rédigée en réponse à la sombre période du régime nazi, la Loi fondamentale met l'accent sur la dignité humaine, les droits civils et l'engagement en faveur de la paix, traçant une voie claire vers la justice et la responsabilité. Bien qu'elle ait été conçue comme une constitution provisoire jusqu'à la réunification, elle établit déjà des protections solides, notamment une Cour constitutionnelle fédérale chargée de garantir l'État de droit et d'empêcher le retour de la tyrannie."
 WGR_50s_Article_20: "Article 20"
 WGR_50s_Article_20_desc: "L'article 20 de la Loi fondamentale allemande établit les principes fondamentaux de la République fédérale d'Allemagne, la déclarant État fédéral démocratique et social, fondé sur l'État de droit, dont la souveraineté appartient au peuple et accordant aux citoyens le droit de résister si l'ordre constitutionnel est menacé."
 WGR_50s_Article_23: "Article 23"
 WGR_50s_Article_23_desc: "L'article 23 de la Loi fondamentale allemande fournira le cadre nécessaire à l'extension de la Loi fondamentale à d'autres parties de l'Allemagne, soulignant notre objectif de réunification nationale et favorisant l'intégration de l'Allemagne de l'Est selon les principes démocratiques et constitutionnels."
 WGR_50s_Memory_of_1933: "Souvenir de 1933"
 WGR_50s_Memory_of_1933_desc: "Les souvenirs de 1933, année où Adolf Hitler fut nommé chancelier de l'Allemagne et commença à transformer le pays en un État totalitaire, ont poussé le Conseil parlementaire à élaborer une loi fondamentale qui garantit la résilience de la démocratie, protège les droits fondamentaux et établit un système solide de freins et contrepoids afin d'empêcher tout retour à l'autoritarisme."
 WGR_50s_Prepare_for_the_1949_Federal_Election: "Se préparer pour les élections fédérales de 1949"
 WGR_50s_Prepare_for_the_1949_Federal_Election_desc: "Les élections ouest-allemandes de 1949, les premières de notre République fédérale nouvellement formée, constituent un jalon historique, car elles marquent le début d'une nouvelle ère démocratique en Allemagne, donnant à nos citoyens le pouvoir de choisir leurs représentants et de tracer la voie vers la reconstruction d'une Allemagne libre et juste après les ravages de la dictature et de la guerre."
 WGR_Adenauer_49_Bundeskanzler_Konrad_Adenauer: "Le chancelier fédéral Konrad Adenauer"
 WGR_Adenauer_49_Bundeskanzler_Konrad_Adenauer_desc: "À l'issue d'une élection âprement disputée, Konrad Adenauer, ancien maire de Cologne et membre du Zentrum, remporte les élections fédérales de 1949, battant son adversaire Kurt Schumacher d'une voix. Adenauer a refusé de collaborer avec les nazis entre 1933 et 1945 et a été à l'origine de nombreux projets d'infrastructure et de développement économique pendant son mandat de maire de Cologne. Après la guerre, il a joué un rôle crucial dans la réorganisation des chrétiens-démocrates, gravissant encore davantage les échelons politiques pour devenir le candidat à la chancellerie de la nouvelle Union chrétienne-démocrate. La chancellerie d'Adenauer se concentrera sur l'intégration occidentale, ainsi que sur la mise en place d'une économie sociale de marché, la promotion du consumérisme et le commerce intensif avec l'Occident."
 WGR_Adenauer_49_Form_a_Coalition_With_the_FDP_and_DP: "Former une coalition avec le FDP et le DP"
 WGR_Adenauer_49_Form_a_Coalition_With_the_FDP_and_DP_desc: "Aucun parti ne détenant la majorité absolue au Bundestag, une coalition doit être formée. La CDU/CSU cherche un terrain d'entente avec le FDP libéral et le petit parti DP afin de garantir le bon fonctionnement du gouvernement, de stabiliser la démocratie parlementaire et d'empêcher les avancées socialistes."
 WGR_Adenauer_49_Decide_On_a_Provisional_Capital_for_the_FRG: "Décider d'une capitale provisoire pour la RFA"
 WGR_Adenauer_49_Decide_On_a_Provisional_Capital_for_the_FRG_desc: "La question de la capitale provisoire doit être résolue. Si Francfort est le centre économique, Bonn offre une distance symbolique par rapport au passé. Le cabinet évaluera les aspects pratiques, symboliques et sécuritaires avant de choisir le nouveau siège du gouvernement."
 WGR_Adenauer_49_Debate_the_Petersberg_Agreement: "Débattre de l'accord de Petersberg"
 WGR_Adenauer_49_Debate_the_Petersberg_Agreement_desc: "Les Alliés ont proposé des conditions de souveraineté limitée en échange d'une coopération. Si certains y voient un pas vers l'indépendance totale, d'autres craignent une influence étrangère excessive. Un débat houleux au sein du Bundestag et du cabinet déterminera la voie à suivre."
 WGR_Adenauer_49_Sign_the_Agreement_and_Appease_the_Allies: "Signer l'accord et apaiser les alliés"
 WGR_Adenauer_49_Sign_the_Agreement_and_Appease_the_Allies_desc: "Soucieux d'instaurer un climat de confiance avec les puissances occidentales, le gouvernement décide de signer l'accord de Petersberg. Bien que controversée, cette décision redonne une certaine autorité à l'Allemagne de l'Ouest et ouvre la voie à une intégration occidentale plus poussée."
 WGR_Adenauer_49_Buck_the_Three_Powers_and_Refuse: "Résister aux trois puissances et refuser"
 WGR_Adenauer_49_Buck_the_Three_Powers_and_Refuse_desc: "Soucieuse de la dignité nationale et de l'indépendance, l'administration pourrait rejeter les conditions de Petersberg. Une telle défiance risquerait de l'isoler diplomatiquement, mais pourrait rallier le soutien de la population."
 WGR_Adenauer_49_Consider_Our_Position_on_the_Ruhr_Authority: "Considérer notre position sur l'Autorité de la Ruhr"
 WGR_Adenauer_49_Consider_Our_Position_on_the_Ruhr_Authority_desc: "La région de la Ruhr reste sous surveillance internationale. Il sera crucial de trouver un équilibre entre autonomie économique et confiance des Alliés. Le gouvernement doit évaluer s'il convient d'accepter une surveillance externe ou de faire pression pour obtenir un contrôle accru."
 WGR_Adenauer_49_Found_the_Federal_Ministry_of_Economics: "Fonder le ministère fédéral de l'Économie"
 WGR_Adenauer_49_Found_the_Federal_Ministry_of_Economics_desc: "Pour coordonner la politique économique dans la jeune république, un ministère dédié est indispensable. Le nouveau ministère fédéral de l'Économie façonnera la reprise industrielle et supervisera l'économie sociale de marché."
 WGR_Adenauer_49_Convert_Money_in_WBerlin_to_DMarks: "Convertir la devise de Berlin-Ouest en Deutschemark"
 WGR_Adenauer_49_Convert_Money_in_WBerlin_to_DMarks_desc: "Avec le statut divisé de Berlin, l'unification monétaire est vitale. L'administration autorise le passage au mark allemand à Berlin-Ouest, alignant ainsi davantage la ville sur la République fédérale."
 WGR_Adenauer_49_Incorp_Mauser_Workers_into_Heckler_and_Koch: "Intégrer les employés de Mauser à Heckler & Koch"
 WGR_Adenauer_49_Incorp_Mauser_Workers_into_Heckler_and_Koch_desc: "La démilitarisation a laissé de nombreux ouvriers de l'armement sans emploi. Un groupe d'anciens employés de Mauser commence à former une nouvelle entreprise : Heckler & Koch. Le gouvernement soutient cette transformation vers une production industrielle civile."
 WGR_Adenauer_49_Form_the_Deutsche_Bundesbahn: "Formation de la Deutsche Bundesbahn"
 WGR_Adenauer_49_Form_the_Deutsche_Bundesbahn_desc: "Les chemins de fer allemands, en ruines, doivent être unifiés sous une structure nationale. La création de la Deutsche Bundesbahn centralise les transports et soutient la reprise économique dans toute la république."
 WGR_Adenauer_49_Start_a_New_Decade_with_a_New_Germany: "Commencer une nouvelle décennie avec une nouvelle Allemagne"
 WGR_Adenauer_49_Start_a_New_Decade_with_a_New_Germany_desc: "Au début des années 1950, la République fédérale se tourne vers l'optimisme. Le gouvernement met l'accent sur la reconstruction, l'ordre et le retour à une vie normale dans une Allemagne de l'Ouest démocratique et pacifique."
 WGR_Adenauer_49_Dismantle_the_Salzgitter_Works: "Démanteler l'usine de Salzgitter"
 WGR_Adenauer_49_Dismantle_the_Salzgitter_Works_desc: "Dans le cadre des exigences des Alliés, l'aciérie de Salzgitter, liée à la production de guerre, doit être démantelée. L'administration se conforme à cette décision, bien que celle-ci suscite une controverse nationale au sujet des pertes économiques qu'elle entraîne."
 WGR_Adenauer_49_Form_Fed_CDU_and_Elect_Adenauer: "Former la CDU fédérale et élire Adenauer comme président"
 WGR_Adenauer_49_Form_Fed_CDU_and_Elect_Adenauer_desc: "Bien qu'Adenauer soit déjà chancelier, la CDU ne dispose pas encore d'une organisation fédérale. À Goslar, le parti unifie ses instances régionales et élit Adenauer à sa présidence afin de donner une orientation politique à la nouvelle république."
 WGR_Adenauer_49_Stop_Supplying_Coal_to_East_Germany: "Cesser de fournir du charbon à l'Allemagne de l'Est"
 WGR_Adenauer_49_Stop_Supplying_Coal_to_East_Germany_desc: "Dans un contexte de tensions croissantes entre l'Est et l'Ouest, le gouvernement ouest-allemand suspend ses livraisons de charbon à la RDA. Cette décision souligne la réticence de la République fédérale à soutenir un régime communiste."
 WGR_Adenauer_49_End_the_Use_of_Food_Stamps: "Mettre fin à l'utilisation des bons alimentaires"
 WGR_Adenauer_49_End_the_Use_of_Food_Stamps_desc: "À mesure que la prospérité revient lentement, le rationnement devient moins nécessaire. La fin des bons alimentaires marque le retour à l'économie de marché et à la normalité dans la vie quotidienne."
 WGR_Adenauer_49_Form_the_Federal_Civil_Order_Service: "Former le Service fédéral de l'ordre civil"
 WGR_Adenauer_49_Form_the_Federal_Civil_Order_Service_desc: "La sécurité intérieure reste une préoccupation urgente. La création d'un service d'ordre civil aidera les forces de police et renforcera la capacité de la république à faire face aux troubles ou aux situations d'urgence."
 WGR_Adenauer_49_Vote_to_Join_the_Council_of_Europe: "Créer la Communauté européenne du charbon et de l'acier"
 WGR_Adenauer_49_Vote_to_Join_the_Council_of_Europe_desc: "« L'Europe ne se fera pas d'un coup, ni selon un projet unique. Elle se construira grâce à des réalisations concrètes qui créeront d'abord une solidarité de fait. » Tels étaient les mots de Robert Schumann, ministre français des Affaires étrangères, qui proposait l'unification de la gestion du charbon et de l'acier entre la France, l'Allemagne, ainsi que les États du Benelux et l'Italie. La mise en commun de la production de charbon et d'acier changera le destin de ces régions qui se sont longtemps consacrées à la fabrication d'armes de guerre, dont elles ont été les victimes les plus constantes. Il est nécessaire que l'Europe se lie afin d'éviter une nouvelle Grande Guerre."
 WGR_Adenauer_49_Merge_Regional_Radio_into_Fed_ARD: "Fusionner les radios régionales au sein de l'ARD fédérale"
 WGR_Adenauer_49_Merge_Regional_Radio_into_Fed_ARD_desc: "Une présence médiatique unifiée est essentielle pour façonner l'opinion publique. Les stations de radio régionales sont regroupées au sein de l'ARD, formant ainsi un réseau fédéral de radiodiffusion publique engagé en faveur de la démocratie et de l'intégrité de l'information."
 WGR_Adenauer_49_Issue_the_Adenauer_Decree: "Promulguer le décret Adenauer"
 WGR_Adenauer_49_Issue_the_Adenauer_Decree_desc: "Afin d'affirmer l'autorité centrale sur l'administration chaotique de l'après-guerre, un décret officiel du chancelier clarifie les responsabilités et la juridiction fédérale, garantissant ainsi la cohésion au sein du jeune gouvernement."
 WGR_Adenauer_49_Welcome_Formation_of_Western_European_Army: "Le débat sur le réarmement"
 WGR_Adenauer_49_Welcome_Formation_of_Western_European_Army_desc: "Alors que les tensions de la guerre froide s'intensifient, l'idée d'une armée européenne occidentale gagne du terrain. L'administration salue cette évolution, y voyant un moyen d'assurer la sécurité et de renforcer la position internationale."
 WGR_Adenauer_49_Move_Forward_with_Allied_Negotiations_for_Rearmament: "Aller de l'avant avec les négociations alliées pour le réarmement"
 WGR_Adenauer_49_Move_Forward_with_Allied_Negotiations_for_Rearmament_desc: "Face à la pression des Alliés et des voix internes, l'Allemagne de l'Ouest entame prudemment des discussions sur le réarmement. Les questions de sécurité et de souveraineté sont au cœur de ce processus controversé."
 WGR_Adenauer_49_Dismiss_Idea_of_German_Participation_in_European_Army: "Rejeter l'idée d'un réarmement allemand en Europe"
 WGR_Adenauer_49_Dismiss_Idea_of_German_Participation_in_European_Army_desc: "Si l'intégration est en principe bien accueillie, certains membres de l'administration restent méfiants. Le contrôle national des forces armées est considéré comme essentiel, ce qui conduit au rejet des propositions militaires supranationales."
 WGR_Adenauer_49_Debate_the_Schuman_Plan: "Débat sur le plan Schuman"
 WGR_Adenauer_49_Debate_the_Schuman_Plan_desc: "Le plan Schuman français propose de mettre en commun la production de charbon et d'acier. Le Bundestag et les chefs d'entreprise débattent des implications : unité européenne ou perte de souveraineté ?"
 WGR_Adenauer_49_Join_the_Agreement_with_France: "Adhérer à l'accord avec la France"
 WGR_Adenauer_49_Join_the_Agreement_with_France_desc: "Préférant la coopération à la confrontation, le gouvernement accepte le plan Schuman. Cette décision marque la première étape importante vers l'intégration économique européenne."
 WGR_Adenauer_49_Face_Intense_SPD_Criticism_and_Delay: "Face à d'intenses critiques et à des retards de la part du SPD"
 WGR_Adenauer_49_Face_Intense_SPD_Criticism_and_Delay_desc: "Face à la vive opposition du SPD, le gouvernement est contraint de reporter la ratification d'accords européens majeurs. Les débats parlementaires sont dominés par les préoccupations relatives à la souveraineté, à la transparence et à l'intérêt national."
 WGR_Adenauer_49_Form_the_Ministry_of_Foreign_Affairs: "Former le ministère des Affaires étrangères"
 WGR_Adenauer_49_Form_the_Ministry_of_Foreign_Affairs_desc: "Alors que l'Allemagne de l'Ouest s'affirme sur la scène internationale, un ministère des Affaires étrangères dédié est créé pour gérer la diplomatie et promouvoir les intérêts de la république à l'étranger."
 WGR_Adenauer_49_Conduct_Visits_to_Italy_and_UK: "Effectuer des visites en Italie et au Royaume-Uni"
 WGR_Adenauer_49_Conduct_Visits_to_Italy_and_UK_desc: "Le chancelier entreprend des visites d'État en Italie et au Royaume-Uni dans le but de normaliser les relations, d'obtenir un soutien pour le réarmement et d'assurer le rôle de l'Allemagne dans l'Europe d'après-guerre."
 WGR_Adenauer_49_Become_a_Member_of_UNESCO: "Rejoindre le Conseil de l'Europe"
 WGR_Adenauer_49_Become_a_Member_of_UNESCO_desc: "Pour démontrer notre engagement en faveur de la coopération européenne, la République fédérale vote en faveur de l'adhésion au Conseil de l'Europe. Cette décision nous alignera sur l'Occident, renforcera notre légitimité internationale et nous unira contre le bloc de l'Est."
 WGR_Adenauer_49_Officially_End_the_State_of_War_with_US: "Mettre officiellement fin à l'état de guerre avec les États-Unis"
 WGR_Adenauer_49_Officially_End_the_State_of_War_with_US_desc: "Bien que les hostilités aient pris fin il y a plusieurs années, l'état de guerre avec les États-Unis demeure sur le papier. Le gouvernement prend des mesures pour y mettre officiellement fin, symbolisant ainsi un nouveau chapitre dans les relations bilatérales."
 WGR_Adenauer_49_Pass_the_Federal_Border_Police_Act: "Adopter la loi sur la police fédérale des frontières"
 WGR_Adenauer_49_Pass_the_Federal_Border_Police_Act_desc: "Avec l'intensification de la guerre froide, la sécurisation des frontières devient impérative. L'adoption de la loi sur la police des frontières officialise la structure et les fonctions du BGS, renforçant ainsi la défense intérieure."
 WGR_Adenauer_49_Pass_Regulations_On_Mining_and_Steel_Companies: "Adopter une réglementation sur les sociétés minières et sidérurgiques"
 WGR_Adenauer_49_Pass_Regulations_On_Mining_and_Steel_Companies_desc: "Afin de garantir la transparence et des pratiques de travail équitables, de nouvelles réglementations sont introduites pour les secteurs vitaux de l'exploitation minière et de la sidérurgie, afin d'équilibrer le pouvoir industriel et la responsabilité sociale."
 WGR_Adenauer_49_Form_the_Federal_Constitutional_Court: "Former la Cour constitutionnelle fédérale"
 WGR_Adenauer_49_Form_the_Federal_Constitutional_Court_desc: "La nouvelle république a besoin d'un gardien de sa constitution. La création de la Cour constitutionnelle fédérale garantit le contrôle judiciaire et la protection des droits fondamentaux."
 WGR_Adenauer_49_Provide_Amnesties_For_Convicted_Ex_Nazis: "Accorder l'amnistie aux anciens nazis condamnés"
 WGR_Adenauer_49_Provide_Amnesties_For_Convicted_Ex_Nazis_desc: "Alors que la réintégration devient une priorité, le gouvernement envisage d'accorder des amnisties limitées aux anciens nazis. Cette politique suscite un débat entre justice, pragmatisme et réconciliation."
 WGR_Adenauer_49_Join_the_IMF: "Rejoindre le Fonds monétaire international"
 WGR_Adenauer_49_Join_the_IMF_desc: "Afin de réintégrer l'économie mondiale, l'Allemagne de l'Ouest demande à adhérer au FMI. Cette mesure renforce la crédibilité monétaire et permet d'accéder à la coopération financière."
 WGR_Adenauer_49_Split_Up_IG_Farben: "Scission d'IG Farben"
 WGR_Adenauer_49_Split_Up_IG_Farben_desc: "IG Farben, longtemps associée aux crimes nazis, est démantelée en plusieurs petites entreprises. Cette mesure marque une rupture nette avec les structures économiques de l'époque de la guerre et limite le pouvoir des monopoles."
 WGR_Adenauer_49_Sign_the_Luxembourg_Agreement: "Signer l'accord de Luxembourg"
 WGR_Adenauer_49_Sign_the_Luxembourg_Agreement_desc: "Dans un geste de responsabilité historique, l'Allemagne de l'Ouest accepte d'indemniser Israël et les survivants de l'Holocauste. L'accord de Luxembourg est une étape controversée, mais morale."
 WGR_Adenauer_49_Receive_Last_Marshall_Plan_Payments: "Recevoir les derniers paiements du plan Marshall"
 WGR_Adenauer_49_Receive_Last_Marshall_Plan_Payments_desc: "Alors que la reprise est bien engagée, les derniers versements du plan Marshall arrivent. Bien que symboliques, ils représentent le dernier chapitre de l'aide économique directe américaine."
 WGR_Adenauer_49_React_to_the_Stalin_Notes: "Réagir aux notes de Staline"
 WGR_Adenauer_49_React_to_the_Stalin_Notes_desc: "Des ouvertures inattendues viennent de l'Est : les fameuses notes de Staline. Le gouvernement doit examiner attentivement leur signification et déterminer s'il s'agit d'une véritable opportunité ou d'une subversion habile."
 WGR_Adenauer_49_Unanimously_Reject_the_Soviets: "Rejeter à l'unanimité les Soviétiques"
 WGR_Adenauer_49_Unanimously_Reject_the_Soviets_desc: "Face à la manipulation soviétique, le Bundestag rejette à l'unanimité les notes de Staline. L'alignement occidental reste le principe fondamental de la politique étrangère de la République."
 WGR_Adenauer_49_Consider_Soviet_Proposals: "Examiner les propositions soviétiques"
 WGR_Adenauer_49_Consider_Soviet_Proposals_desc: "Certaines voix suggèrent d'accepter les propositions de l'URSS. Le gouvernement entame des discussions prudentes, cherchant à clarifier la situation tout en restant ancré dans les alliances occidentales."
 WGR_Adenauer_49_Sign_the_Bonn_Paris_Conventions: "Signer les conventions de Bonn et de Paris"
 WGR_Adenauer_49_Sign_the_Bonn_Paris_Conventions_desc: "Les conventions de Bonn-Paris rétablissent la souveraineté de l'Allemagne de l'Ouest et réglementent la présence des Alliés. Le gouvernement signe les accords, scellant ainsi une nouvelle phase dans l'autodétermination nationale."
 WGR_Adenauer_49_Sign_the_EDC_Treaty: "Soutenir le traité instituant la Communauté européenne de défense"
 WGR_Adenauer_49_Sign_the_EDC_Treaty_desc: "Afin d'ancrer davantage l'Allemagne de l'Ouest dans la défense européenne, l'administration signe le traité de la CED. Bien que la ratification soit incertaine, cette décision témoigne de l'engagement ferme de l'Occident."
 WGR_Adenauer_49_Debate_Making_Defense_Contributions_To_Allies: "Débat sur les contributions à la défense des alliés"
 WGR_Adenauer_49_Debate_Making_Defense_Contributions_To_Allies_desc: "Alors que les discussions sur le réarmement progressent, des questions se posent quant au soutien militaire de l'Allemagne de l'Ouest aux Alliés. Le Parlement doit mettre en balance la souveraineté, la sécurité et les sensibilités historiques."
 WGR_Adenauer_49_Abolish_the_Pulpit_Paragraph: "Supprimer le paragraphe sur la chaire"
 WGR_Adenauer_49_Abolish_the_Pulpit_Paragraph_desc: "Vestige de la législation du Kulturkampf, le « paragraphe sur la chaire » interdit au clergé de tenir des discours politiques. Le gouvernement envisage son abrogation dans le cadre de réformes démocratiques plus larges."
 WGR_Adenauer_49_Sign_the_London_Debt_Agreement: "Signer l'accord de Londres sur la dette"
 WGR_Adenauer_49_Sign_the_London_Debt_Agreement_desc: "Afin d'alléger la pression financière internationale, le gouvernement négocie l'accord de Londres sur la dette. Cet accord restructure la dette d'avant et d'après-guerre, contribuant ainsi à la réintégration économique de l'Allemagne de l'Ouest."
 WGR_Adenauer_49_Sign_Reparations_Agreement_with_Israel: "Signer un accord de réparation avec Israël"
 WGR_Adenauer_49_Sign_Reparations_Agreement_with_Israel_desc: "Geste historique de réconciliation, l'accord de réparation conclu avec Israël vise à offrir une compensation matérielle pour les atrocités commises par les nazis, consolidant ainsi la nouvelle identité morale de l'Allemagne."
 WGR_Adenauer_49_Express_Support_For_the_East_German_Uprising: "Déclarer le soulèvement est-allemand jour férié national"
 WGR_Adenauer_49_Express_Support_For_the_East_German_Uprising_desc: "Des rapports provenant de Berlin-Est et d'autres grandes villes de la zone d'occupation soviétique sont parvenus à [WGR.GetCapitalVictoryPointName], indiquant que les travailleurs est-allemands se sont soulevés contre les quotas de travail sévères imposés par le régime du SED. Bien qu'il ait été brutalement réprimé par l'intervention soviétique, le gouvernement ouest-allemand exprime sa solidarité avec les manifestants et condamne la répression du SED. À partir d'aujourd'hui, nous célébrerons le 17 juin comme jour férié national, en mémoire des victimes et du rêve de la réunification allemande."
 WGR_Adenauer_49_Establish_the_Federal_Ministry_of_the_Interior: "Créer le ministère fédéral de l'Intérieur"
 WGR_Adenauer_49_Establish_the_Federal_Ministry_of_the_Interior_desc: "Afin d'assurer l'ordre intérieur et la coordination administrative, le ministère de l'Intérieur est créé. Il supervisera les affaires civiles, la sécurité publique et la coopération entre les États."
 WGR_Adenauer_49_Found_the_Federal_Insurance_Agency_for_Salaried_Employees: "Fonder l'Agence fédérale d'assurance pour les salariés."
 WGR_Adenauer_49_Found_the_Federal_Insurance_Agency_for_Salaried_Employees_desc: "La sécurité sociale reste un pilier de stabilité. La création d'une agence dédiée aux salariés marque une étape clé dans l'expansion de l'État providence."
 WGR_Adenauer_49_Augment_BGS_Personnel_to_20K: "Augmenter les effectifs du BGS à 20 000 personnes"
 WGR_Adenauer_49_Augment_BGS_Personnel_to_20K_desc: "Alors que les menaces à la frontière s'intensifient, la garde-frontière fédérale est portée à 20 000 membres. Cette mesure renforce la sécurité intérieure et reflète les réalités de la guerre froide."
 WGR_Adenauer_49_Prepare_for_the_1953_Federal_Election: "Se préparer pour les élections fédérales de 1953"
 WGR_Adenauer_49_Prepare_for_the_1953_Federal_Election_desc: "Alors que la législature touche à sa fin, le gouvernement se prépare pour les élections nationales. Les programmes électoraux, les résultats économiques et l'orientation de la politique étrangère détermineront l'avenir de la république."
 WGR_Adenauer_49_Dealing_with_Denazification: "Faire face à la dénazification"
 WGR_Adenauer_49_Dealing_with_Denazification_desc: "Les purges d'après-guerre restent en suspens. L'administration évolue dans un contexte politique complexe, entre les appels à la justice, la continuité administrative et la réintégration sociale."
 WGR_Adenauer_49_The_Globke_Scandal: "Le scandale Globke"
 WGR_Adenauer_49_The_Globke_Scandal_desc: "Les révélations sur le passé de Hans Globke provoquent un tollé général. Le gouvernement doit répondre aux inquiétudes suscitées par la présence d'anciens fonctionnaires nazis au sein de l'administration fédérale."
 WGR_Adenauer_49_Dealing_with_Landsberg_Prisoners: "Le traitement des prisonniers de Landsberg"
 WGR_Adenauer_49_Dealing_with_Landsberg_Prisoners_desc: "Le sort des criminels de guerre nazis condamnés et emprisonnés à Landsberg soulève des dilemmes juridiques et moraux. La pression publique et la surveillance internationale influencent la manière dont le gouvernement traite ces affaires."
 WGR_Adenauer_49_Receive_the_Himmerod_Memorandum: "Recevoir le mémorandum Himmerod"
 WGR_Adenauer_49_Receive_the_Himmerod_Memorandum_desc: "D'anciens officiers de la Wehrmacht soumettent le mémorandum de Himmerod, jetant les bases d'un éventuel réarmement. Ce document influence la politique en matière de défense et de réinsertion des anciens combattants."
 WGR_Adenauer_49_Vote_on_Laws_Ending_Denazification: "Vote sur les lois mettant fin à la dénazification"
 WGR_Adenauer_49_Vote_on_Laws_Ending_Denazification_desc: "Le Bundestag débat d'une nouvelle loi visant à mettre officiellement fin à la dénazification. Cette mesure vise à rétablir les droits civils tout en tirant un trait sur un chapitre controversé de la politique d'après-guerre."
 WGR_Adenauer_49_Focus_on_Apologies_and_Compensation: "Mettre l'accent sur les excuses et l'indemnisation"
 WGR_Adenauer_49_Focus_on_Apologies_and_Compensation_desc: "Dans un climat international en pleine mutation, l'administration s'oriente vers un jugement moral. Les excuses et les efforts de compensation marquent une nouvelle étape dans la confrontation de l'Allemagne de l'Ouest avec son passé."
