 WGR_Berlin_Sector_City: "Berlin, ville sectorielle"
 WGR_Berlin_Sector_City_2: "Ville-secteur de Berlin"
 wgr_ddr_refugees2: "Intégration des réfugiés est-allemands"
 wgr_ddr_refugees2_desc: "Des milliers de réfugiés est-allemands fuient vers l'Allemagne de l'Ouest pour échapper au contrôle soviétique et aux conditions oppressives qui règnent à l'Est ; cette vague croissante de familles désespérées met en évidence le fossé abyssal qui sépare la liberté de la tyrannie, et nous incite à agir sans tarder pour venir en aide à ces personnes en quête de sécurité et d'un avenir meilleur au sein de notre nouvelle démocratie."
 NATO_Military_Restrictions2: "Restrictions militaires de l'OTAN"
 NATO_Military_Restrictions2_desc: "§RImpossible de former des unités, de les dissoudre ou de modifier leurs modèles.§!\n\n La crainte du militarisme allemand est une préoccupation courante au sein de la structure de commandement des Alliés occidentaux, ce qui a incité les États-Unis, la France et la Grande-Bretagne à intégrer ce qui reste de nos forces armées dans la structure militaire de l'OTAN, permettant ainsi aux Alliés d'exercer un contrôle sur nos forces."
 Scientific_Collapse_lessened_desc: ""
 Founding_the_Bundeswehr_desc: "Le temps des faux-semblants est révolu. La BGS sera désormais officiellement désignée comme le noyau d'une future armée nationale, la Bundeswehr. Sa structure de commandement, sa formation et sa doctrine seront réformées afin de permettre une transition en douceur vers une force militaire à part entière."
 WGR_Party_Cooperation: "Coopération CDU-SPD"
 WGR_Party_Cooperation_desc: "Le temps des faux-semblants est révolu. La BGS sera désormais officiellement désignée comme le noyau d'une future armée nationale, la Bundeswehr. Sa structure de commandement, sa formation et sa doctrine seront réformées afin de permettre une transition en douceur vers une force militaire à part entière."
 WGR_Kanalarbeiter_Cooperation: "Kanalarbeiter Cooperation"
 WGR_Kanalarbeiter_Cooperation_desc: "L'accident vasculaire cérébral du chancelier Schumacher a permis au vice-chancelier Egon Franke d'accéder à une notoriété qu'il n'aurait jamais pu imaginer, en tant que chef de file des Kanalarbeiter, l'aile puissante et pragmatique du SPD. \n\nSurnommée les « ouvriers du canal », cette faction excelle dans le travail politique discret et concret : faire respecter la discipline du parti et conclure des accords plutôt que de se focaliser sur une idéologie rigide. Leur ascension marque une rupture nette avec la politique de principes inflexibles de Schumacher.\n\nAlors que Schumacher était un homme de confrontation, les Kanalarbeiter sont des négociateurs, considérés comme plus disposés à faire des compromis avec les Alliés occidentaux."
 WGR_Wirtschaftswunder: "Miracle économique"
 WGR_Wirtschaftswunder_desc: "Nous sommes au début des années 1950, et une transformation remarquable est en cours dans toute l'Allemagne de l'Ouest. À peine quelques années après les ravages de la guerre, les usines tournent à plein régime, de nouvelles maisons surgissent des décombres des anciennes, et les vitrines des magasins brillent à nouveau de mille feux. Cette reprise économique rapide, désormais communément appelée le Wirtschaftswunder – ou « miracle économique » –, est portée par une combinaison de réforme monétaire, d’aide du Plan Marshall et de l’introduction de l’économie sociale de marché sous l’égide du ministre Ludwig Erhard. Les Allemands ordinaires, dont beaucoup ont enduré des années de privations, assistent au retour de la prospérité et de la stabilité. Bien que des défis subsistent, l’optimisme est dans l’air : l’Allemagne se reconstruit, non seulement physiquement, mais aussi économiquement et spirituellement."
 WGR_Nuclear_Stance: "Position sur le nucléaire"
 WGR_Nuclear_Program_Development: "Deutsches Atomkraftprogramm"
 WGR_Ex_Nazi_Influence: "L'influence national-socialiste"
 WGR_Ex_Nazi_Influence_desc: "La question de savoir comment traiter les anciens nazis continue de susciter de vives controverses. Alors que les efforts officiels de dénazification ont d'abord été menés sous la supervision des Alliés, les réalités politiques et administratives ont conduit à une approche plus pragmatique. Une grande partie de l'expertise bureaucratique, juridique et militaire de l'Allemagne étant liée à ceux qui avaient servi sous le Troisième Reich, de nombreux anciens membres du parti et fonctionnaires réintégrèrent discrètement la fonction publique. Cela suscita un malaise croissant parmi certains segments de la population, en particulier au sein du SPD et chez les jeunes démocrates, qui craignaient un retour des tendances autoritaires."
 WGR_KPD_Approval: "Approbation du KPD"
 WGR_KPD_State_Control: "Contrôle d'État par le KPD"
 WGR_Public_Approval: "Approbation publique"
 WGR_Communist_Influence: "Influence communiste"
 WGR_BGS_Performance: "Performance de la Garde-frontières fédérale/Armée allemande"
 WGR_BGS_Performance_desc: "Le Bundesgrenzschutz (BGS) est la principale force de sécurité intérieure de l'Allemagne de l'Ouest à une époque marquée par l'incertitude et les tensions de la Guerre froide. Créé sous la supervision des Alliés, le BGS est chargé de protéger les frontières de la République fédérale, notamment contre les infiltrations et les troubles provenant de l'Est. Bien qu'il s'agisse techniquement d'une force de police civile, sa structure et sa formation s'apparentent étroitement à celles d'une unité militaire, reflétant ainsi le contexte sécuritaire fragile des débuts de la République. Le BGS devient rapidement un symbole de souveraineté et d'ordre, jetant les bases de la Bundeswehr en tant que future force de défense nationale tout en restant sous un contrôle fédéral strict."
 WGR_SPD_Power_Struggle_Favour_Franke: "Tendre la main à l'opposition"
 WGR_SPD_Power_Struggle_Favour_Franke_desc: "Les positions plus modérées d'Egon Franke en matière d'intégration à l'Europe occidentale et de politique sociale ont conduit à la création d'un groupe spécifique au sein de la CDU, qui estime qu'une coopération avec l'aile droite du SPD pourrait leur permettre d'atteindre leurs objectifs politiques malgré leur statut d'opposition. Ils n'hésitent pas à soutenir politiquement Franke, même si le SPD dans son ensemble risque de perdre des voix au profit de la CDU."
 WGR_SPD_Power_Struggle_Favour_Ollenhauer: "Rassembler les partisans de Schumacher"
 WGR_SPD_Power_Struggle_Favour_Ollenhauer_desc: "Erich Ollenhauer est un proche collaborateur du chancelier Schumacher, dont il est le bras droit dans divers domaines. Faire partie de son cercle restreint présente des avantages. Son influence politique peut servir à convaincre les fidèles de Schumacher de rejoindre l'aile gauche du SPD."
 Rebuild_Bavarian_Railways: "Réaménager le réseau Nuremberg-Munich"
 Rebuild_Rhineland_Railways: "Réouverture de la ligne Bonn-Dortmund"
 Rebuild_Hessen_Hamburg_Railways: "L'Express Kassel-Hambourg"
 WGR_SPD_Bundestag_1949: "Le Bundestag"
 WGR_SPD_BUNDESTAG_1949_1_DESC_GUI: "\nPour la première fois depuis douze ans, les Allemands se sont rendus aux urnes pour élire leurs représentants, qui façonneront l'avenir de l'Allemagne au sein du Bundestag nouvellement créé, héritier institutionnel du Reichstag de l'Empire allemand et de la Première République. La lutte acharnée entre les sociaux-démocrates et les chrétiens-démocrates s'est soldée par la victoire de Kurt Schumacher, qui occupera désormais le poste de chancelier allemand pour les quatre prochaines années.\n\nLe Bundestag exige des coalitions majoritaires pour l'adoption des lois, ce qui signifie que Schumacher a besoin d'au moins 202 des 402 sièges pour obtenir le soutien nécessaire. Le moment est désormais venu de tendre la main aux autres partis disposés à soutenir les politiques du SPD, en faisant des promesses et en trouvant des compromis qui profiteront aux deux parties.\n\n§C202§! sièges sont nécessaires pour obtenir la majorité. Les résultats des élections sont les suivants :"
 WGR_SPD_BUNDESTAG_1949_2_DESC_GUI: "\n§PUnion chrétienne-démocrate (CDU/CSU)§! : 139\n§SParti social-démocrate d’Allemagne (SPD)§! : 131\n§mParti démocrate libre (FDP)§! : 52\n§4Parti bavarois (BP)§! : 17\n§cParti allemand (DP)§! : 17\n§RParti communiste d’Allemagne (KPD)§! : 15\n§9Association pour la reconstruction économique (WAV)§! : 12\n§BZentrum§! : 10\n§gIndépendants §! : 10\n\nPartenaires actuels de la coalition : [WGR_SchumacherCoalitionPartnersStatus1949]"
