 WGR_Schumacher_49_Form_a_Coalition_with_the_Centre_Party_desc: "Avec la CDU/CSU comme principale opposition, notre chemin vers une majorité stable passe par les partis du centre. En intégrant le parti Zentrum à notre coalition avec les libéraux, nous pouvons faire revivre l'esprit de l'ancienne coalition de Weimar, en unissant les sociaux-démocrates, les libéraux et les démocrates-chrétiens de différents bords afin de forger une nouvelle république stable."
 WGR_Schumacher_49_Decide_on_Frankfurt_As_the_Capital_desc: "Bonn est une solution provisoire et provinciale. Une Allemagne forte et revitalisée a besoin d'une capitale dotée d'une histoire, d'une puissance économique et d'une stature. Francfort-sur-le-Main, centre financier et siège du Parlement de Francfort de 1848, est le choix idéal pour représenter l'avenir démocratique et économique de notre nation."
 WGR_Schumacher_49_Focus_on_Newfound_Cooperation_with_the_Federal_States_desc: "Notre loi fondamentale établit une république fédérale, et la force de l'ensemble dépend de la force de ses parties. En favorisant un nouvel esprit de coopération avec les gouvernements des Länder, nous pouvons garantir que la politique fédérale soit mise en œuvre efficacement et que les préoccupations régionales soient prises en compte au niveau national."
 WGR_Schumacher_49_Form_the_Federal_Border_Guard_desc: "La sécurité de nos frontières ne peut être laissée aux seules mains des puissances alliées. La création d'un Bundesgrenzschutz, un service fédéral de protection des frontières, est une première étape cruciale pour affirmer notre souveraineté nationale et nous assurer que nous disposons d'une force professionnelle, contrôlée démocratiquement, pour surveiller nos frontières."
 WGR_Schumacher_49_Propose_Reforms_to_the_Bundesrat_desc: "Le Bundesrat, qui représente les États, est un élément essentiel de notre processus législatif. Cependant, sa structure actuelle pourrait être rationalisée afin de mieux refléter les besoins d'un gouvernement fédéral moderne. Nous proposerons des réformes afin de garantir qu'il agisse comme un partenaire constructif, et non comme un obstacle, au progrès national."
 WGR_Schumacher_49_Denounce_CDU_Ideas_of_Nazism_in_the_Government_desc: "Alors que nous nous efforçons de purger l'État des véritables nationaux-socialistes, l'opposition dirigée par Adenauer semble bien trop disposée à réintégrer d'anciens membres du parti dans la bureaucratie. Nous devons dénoncer publiquement et avec force ce pragmatisme alarmant. Une véritable démocratie ne peut être bâtie sur des fondations composées de ceux qui, il y a peu, cherchaient à la détruire."
 WGR_Schumacher_49_Arrest_and_Try_Prominent_Nazis_desc: "Beaucoup de ceux qui occupaient des postes de pouvoir sous le régime nazi sont encore en liberté dans notre pays. Cette injustice est intolérable. Nous donnerons à nos autorités les moyens d'identifier, d'arrêter et de traduire en justice d'anciens nazis de premier plan qui ont jusqu'à présent échappé à toute sanction pour leurs crimes."
 WGR_Schumacher_49_Form_A_Commission_to_Investigate_High_Ranking_Nazis_desc: "Les ramifications du national-socialisme sont encore profondément ancrées dans notre société et nos institutions. Une commission gouvernementale spéciale sera créée, dont la seule mission sera d'enquêter sur d'anciens hauts fonctionnaires et industriels, de mettre au jour leurs réseaux et de recommander leur poursuite en justice."
 WGR_Schumacher_49_Begin_Black_and_Red_Campaign_desc: "La démocratie est menacée sur deux fronts : les vestiges bruns du nazisme et la vague rouge du communisme. Notre gouvernement lancera une campagne nationale pour sensibiliser le public aux dangers de ces deux idéologies totalitaires, renforçant ainsi notre engagement en faveur d'une Allemagne libre et démocratique."
 WGR_Schumacher_49_Ban_Commies_and_Nazis_from_Govt_desc: "La fonction publique doit être loyale envers la Constitution et uniquement envers la Constitution. Nous adopterons une loi interdisant formellement à toute personne ayant appartenu au parti nazi ou étant membre actif du parti communiste d'occuper un poste au sein du gouvernement."
 WGR_Schumacher_49_Demand_Argentina_Extradite_Nazis_desc: "Il est honteux que de nombreux criminels de guerre nazis aient trouvé refuge en Amérique du Sud. Nous demanderons officiellement au gouvernement argentin d'extrader ces fugitifs vers l'Allemagne afin qu'ils y soient jugés. La justice doit être internationale."
 WGR_Schumacher_49_Deport_Commies_to_DDR_desc: "Ceux qui prêtent allégeance non pas à Francfort, mais à Berlin-Est et à Moscou, n'ont pas leur place dans notre république. Pour les communistes qui œuvrent activement à renverser notre État, un aller simple à travers la frontière interallemande semble être une solution appropriée. Qu'ils profitent du « paradis des travailleurs » qu'ils admirent tant."
 WGR_Schumacher_49_Enforce_Loyalty_Oaths_desc: "Afin de garantir l'intégrité de nos institutions démocratiques, nous commencerons à exiger de tous les fonctionnaires, des employés municipaux aux ministres fédéraux, qu'ils prêtent serment de loyauté envers la Loi fondamentale. Ceux qui refuseront n'auront plus d'avenir dans la fonction publique."
 WGR_Schumacher_49_Begin_Surveillance_desc: "La liberté exige de la vigilance. Pour protéger notre démocratie contre ceux qui cherchent à la détruire de l'intérieur, nous devons autoriser nos services de sécurité à surveiller activement les individus et les groupes qui sont de manière crédible liés à des activités extrémistes et anticonstitutionnelles."
 WGR_Schumacher_49_Invite_McCarthy_desc: "Bien que ses méthodes soient controversées, le sénateur américain Joseph McCarthy est l'un des principaux acteurs de la lutte mondiale contre le communisme. Une invitation à se rendre en Allemagne enverrait un message fort à Moscou – et à nos alliés à Washington – indiquant que nous sommes déterminés à éradiquer l'influence marxiste."
 WGR_Schumacher_49_Announce_Volks_Economy_Program_desc: "L'« économie sociale de marché » prônée par l'opposition n'est qu'une coquille vide. Notre vision est différente. Le programme Volks Economy réorientera notre politique économique afin qu'elle profite directement au peuple allemand, en donnant la priorité au plein emploi, à des salaires équitables et à une sécurité sociale solide plutôt qu'aux profits incontrôlés des entreprises."
 WGR_Schumacher_49_Social_Insurance_desc: "Un État industriel moderne doit protéger ses travailleurs contre les aléas de la vie. En mettant en place des régimes d'assurance complets, soutenus par l'État, pour le chômage, l'invalidité et les soins de santé, nous jetons les bases d'un véritable filet de sécurité sociale."
 WGR_Schumacher_49_Found_Federal_Ministry_of_Economics_desc: "Afin de consolider le rôle des syndicats au cœur de notre planification économique, le ministère fédéral de l'Économie sera réformé. Il intégrera désormais officiellement les syndicats dans sa structure, garantissant ainsi que la voix des travailleurs soit entendue au plus haut niveau du gouvernement."
 WGR_Schumacher_49_Seize_Ruhr_Coal_Facilities_desc: "Le charbon de la Ruhr est le moteur de l'industrie allemande, et il ne doit pas rester entre les mains des mêmes industriels qui ont alimenté la machine de guerre nazie. L'État prendra le contrôle de ces installations vitales, veillant à ce qu'elles soient exploitées dans l'intérêt de la nation, et non dans celui de dynasties privées."
 WGR_Schumacher_49_Prioritize_Resources_Domestically_desc: "Notre population souffre encore du froid et nos usines ont besoin de ressources. Si les exportations sont importantes, les besoins immédiats de la population allemande et de nos industries nationales doivent passer en premier. Nous allons diriger les ressources vitales telles que le charbon et l'acier vers nos propres marchés."
 WGR_Schumacher_49_Nationalize_VW_and_IG_Farben_desc: "Certaines entreprises sont trop importantes, ou trop compromises historiquement, pour être laissées entre les mains du secteur privé. Le géant industriel IG Farben, complice de crimes innommables, et Volkswagen, symbole de notre potentiel industriel, seront nationalisés."
 WGR_Schumacher_49_Pass_Steel_Mine_Working_Regulations_desc: "Depuis trop longtemps, les hommes qui travaillent dur dans nos mines et nos aciéries endurent des conditions dangereuses pour un salaire dérisoire. Notre gouvernement les soutient. Nous adopterons et appliquerons de nouvelles réglementations plus strictes afin de garantir la sécurité et le traitement équitable des travailleurs dans ces industries essentielles."
 WGR_Schumacher_49_Debate_the_Petersberg_Agreement_desc: "L'accord de Petersberg, négocié par la Haute Commission alliée, définit nos relations avec les puissances occupantes. Avant de compromettre l'avenir de l'Allemagne, ses termes doivent faire l'objet d'un débat rigoureux au Bundestag. Nous ne serons pas une simple chambre d'enregistrement des directives alliées."
 WGR_Schumacher_49_Refuse_to_Sign_the_Western_Dictated_Treaties_desc: "On nous dit que ces traités sont pour notre bien, mais ils sont dictés depuis une position de pouvoir, et non de partenariat. Le gouvernement Schumacher, fidèle à ses principes, refusera de signer tout accord qui traiterait l'Allemagne comme un État subordonné et compromettrait l'avenir de la réunification."
 WGR_Schumacher_49_Sign_for_Germanys_Future_desc: "Après d'intenses négociations et l'obtention de concessions cruciales, le moment est venu de se tourner vers l'avenir. Bien que les traités soient imparfaits, leur signature constitue une étape pragmatique vers une plus grande souveraineté et la consolidation de notre place dans le monde occidental. Nous ne signons pas dans un esprit de soumission, mais dans une perspective d'avenir pour l'Allemagne."
 WGR_Schumacher_49_Begin_a_New_Decade_With_a_New_Germany_desc: "Les années 1940 ont été une décennie de ruine et de honte. À l'aube des années 1950, l'heure est venue de prendre un nouveau départ. Forts d'un gouvernement démocratique et d'une vision claire pour l'avenir, nous aborderons cette nouvelle décennie avec pour objectif de construire une Allemagne pacifique, prospère et unie."
 WGR_Schumacher_49_Introduce_the_Frankfurt_Program_desc: "Notre gouvernement étant désormais solidement établi, nous allons présenter officiellement le programme de Francfort. Cette plateforme complète expose notre vision pour la nation, de la création d'un État providence à notre position inflexible sur la réunification allemande."
 WGR_Schumacher_49_Consider_Position_in_Europe_desc: "L'Allemagne se trouve au cœur de l'Europe, et notre destin est étroitement lié à celui du continent. Nous devons désormais réfléchir attentivement à notre position à long terme. Devons-nous nous intégrer profondément à l'Occident, ou devons-nous tracer une voie plus indépendante entre les deux grands blocs ?"
 WGR_Schumacher_49_Western_Integration_desc: "Tout en restant fidèles à nos principes, nous ne pouvons nous permettre de rester isolés. Une intégration prudente avec les démocraties d'Europe occidentale et d'Amérique du Nord offre la meilleure garantie contre l'agression soviétique et la promesse d'une prospérité économique. Nous resterons ouverts à cette possibilité."
 WGR_Schumacher_49_Reject_European_Army_desc: "La proposition française d'une « armée européenne » est inacceptable. Il s'agit d'une tentative à peine voilée de contrôler le réarmement allemand et d'empêcher la formation d'un état-major allemand. Nous ne contribuerons à la défense européenne qu'en tant qu'égaux, et non en tant que légionnaires au sein d'une force dirigée par la France."
 WGR_Schumacher_49_Denounce_Allied_Rearmament_desc: "La soudaine pression exercée par les Alliés pour que l'Allemagne se réarme est hypocrite. Pendant des années, ils ont cherché à nous démilitariser, et maintenant, craignant les Soviétiques, ils exigent que nous prenions les armes. Nous dénoncerons cette pression et refuserons d'être précipités dans la remilitarisation sans garanties absolues pour notre souveraineté et notre sécurité."
 WGR_Schumacher_49_Debate_Schuman_Plan_desc: "Le ministre français des Affaires étrangères Robert Schuman a proposé de mettre en commun la production européenne de charbon et d'acier. S'agit-il d'une véritable avancée vers une Europe pacifique et intégrée, ou d'un mécanisme permettant à la France de contrôler l'industrie lourde allemande ? Cette proposition doit faire l'objet d'un examen approfondi et d'un débat public."
 WGR_Schumacher_49_More_Marshall_Plan_Aid_desc: "Le plan Marshall a joué un rôle déterminant dans notre redressement, mais la tâche est loin d'être achevée. Notre gouvernement fera valoir officiellement auprès des États-Unis que le maintien, voire l'augmentation, de l'aide économique est essentiel pour stabiliser la démocratie allemande et faire de notre nation un rempart contre le communisme."
 WGR_Schumacher_49_Western_Cultural_Agreements_desc: "Un partenariat avec l'Occident doit aller au-delà des questions économiques et militaires. En concluant des accords culturels, en organisant des échanges d'étudiants et en coopérant dans le domaine artistique avec des pays comme la France, la Grande-Bretagne et les États-Unis, nous pouvons rétablir la confiance et rattacher notre nouvelle Allemagne au tissu culturel du monde libre."
 WGR_Schumacher_49_Pursue_Non_Aligned_FP_desc: "Pourquoi l'Allemagne doit-elle choisir entre Washington et Moscou ? Il existe peut-être une troisième voie. En menant une politique étrangère non alignée, sur le modèle de pays comme la Suède ou la Yougoslavie, nous pourrions préserver notre indépendance et avoir de meilleures chances de négocier la réunification selon nos propres conditions."
 WGR_Schumacher_49_Push_for_WGR_Berlin_desc: "Le statut quadripartite actuel de Berlin est intenable. En tant que future capitale de la République fédérale, il est logique que Berlin-Ouest soit pleinement intégrée à l'Allemagne de l'Ouest, mettant ainsi fin à son statut ambigu de ville occupée et la plaçant fermement sous la protection et l'administration de notre gouvernement."
 WGR_Schumacher_49_Debate_Allied_Forces_in_WGR_desc: "Les forces alliées présentes sur notre sol sont à la fois nos protecteurs et nos occupants. Le moment est venu de débattre officiellement de leur statut. Il faut trouver un nouvel accord qui permette de faire évoluer leur rôle d'occupants vers celui de partenaires et de défenseurs mutuels, en reconnaissant notre souveraineté croissante."
 WGR_Schumacher_49_Cooperate_with_Sweden_and_Switzerland_desc: "Dans un continent dominé par deux blocs opposés, les nations neutres et démocratiques que sont la Suisse et la Suède offrent un modèle intéressant. En renforçant nos liens diplomatiques et économiques avec elles, nous pouvons tirer des enseignements de leur expérience et consolider notre propre position en dehors des limites rigides de la guerre froide."
 WGR_Schumacher_49_Reach_Out_to_Moderate_SED_Members_desc: "Si les dirigeants du SED sont soumis à Moscou, des murmures de dissidence se font entendre dans leurs rangs. Une approche prudente et secrète auprès des membres plus modérés ou nationalistes du régime est-allemand pourrait ouvrir une nouvelle voie directe pour le dialogue sur l'avenir de l'Allemagne."
 WGR_Schumacher_49_Meet_with_Tito_desc: "Le maréchal Tito de Yougoslavie a défié Staline et tracé sa propre voie vers un socialisme non aligné. Une rencontre entre le chancelier Schumacher et Tito serait un symbole fort de notre indépendance vis-à-vis de l'Est et de l'Ouest, et pourrait jeter les bases d'un partenariat entre les nations à la recherche d'une « troisième voie »."
 WGR_Schumacher_49_Debate_Stalin_Notes_desc: "Une note est arrivée de Moscou. Staline propose une Allemagne neutre, réunifiée et réarmée. S'agit-il d'une offre sincère ou d'un stratagème cynique visant à faire dérailler l'intégration occidentale ? L'offre est trop importante pour être ignorée et trop dangereuse pour être acceptée telle quelle. Notre réponse pourrait déterminer le sort de la nation."
 WGR_Schumacher_49_Schumachers_Stroke_desc: "Une catastrophe vient de frapper. Le chancelier Schumacher, le leader fougueux et indomptable de notre gouvernement, a été victime d'un grave accident vasculaire cérébral. Alors qu'il est dans l'incapacité d'agir, la nation retient son souffle. Le gouvernement est paralysé et un vide politique s'est créé au cœur même de notre jeune république, menaçant de réduire à néant tous nos progrès."
 WGR_Schumacher_49_Choose_Franke_desc: "En l'absence du chancelier, une décision doit être prise. Le vice-chancelier Egon Franke, figure de proue de l'aile droite du parti, est le successeur désigné par la Constitution. Ses opinions pragmatiques et pro-occidentales contrastent fortement avec bon nombre des politiques de Schumacher, ce qui laisse présager des conflits au sein du gouvernement."
 WGR_Schumacher_49_Support_Kanalarbeiters_desc: "Les « Kanalarbeiter » (ouvriers du canal) représentent la faction pragmatique et de droite du SPD. Mécontents de la ligne nationaliste et socialiste de Schumacher, ils voient dans cette crise une opportunité. En les soutenant, nous pouvons orienter le parti, et le pays, vers une position plus modérée et pro-occidentale."
 WGR_Schumacher_49_Seek_Cooperation_with_CDU_desc: "Avec un SPD divisé, il est impossible de gouverner. L'aile droite du parti, voyant des points communs avec l'opposition sur les questions économiques et de politique étrangère, va commencer à rechercher une coopération avec la CDU. Une grande coalition, autrefois impensable, semble désormais possible."
 WGR_Schumacher_49_Form_Caretaker_Govt_desc: "Avec le chancelier hors d'état de fonctionner et la coalition en plein désarroi, la stabilité est primordiale. Un gouvernement provisoire doit être formé pour gérer les affaires courantes de l'État jusqu'à ce qu'une ligne de succession claire puisse être établie ou que de nouvelles élections soient organisées."
 WGR_Schumacher_49_Sign_Frankfurt_Paris_Conventions_desc: "Les conventions, qui rapprocheraient l'Allemagne de l'Occident, ont été bloquées par Schumacher. Les pragmatiques étant désormais aux commandes, la voie est libre pour les signer. Cette décision renforcera notre alliance avec l'Occident, mais sera considérée comme une trahison par l'aile gauche du SPD."
 WGR_Schumacher_49_Choose_Ollenhauer_desc: "Les factions de gauche et du centre du parti, fidèles à la vision de Schumacher, se sont ralliées derrière Erich Ollenhauer. Le nommer nouveau chancelier honorerait l'héritage de Schumacher, mais défierait la succession constitutionnelle et provoquerait la colère de l'aile droite du parti, risquant ainsi une scission permanente."
 WGR_Schumacher_49_Face_Criticism_For_a_Coup_desc: "La nomination d'Erich Ollenhauer, qui a contourné le vice-chancelier, a été dénoncée par l'opposition et la droite du SPD comme un « coup d'État ». Notre gouvernement est désormais confronté à une crise de légitimité qui menace de paralyser le Bundestag."
 WGR_Schumacher_49_Succession_Amendment_desc: "La crise actuelle a mis en évidence une ambiguïté dangereuse dans notre loi fondamentale. Afin d'éviter qu'un tel vide politique ne se reproduise, nous devons adopter un amendement constitutionnel qui établisse clairement et sans ambiguïté l'ordre de succession à la présidence et à la chancellerie."
 WGR_Schumacher_49_Push_For_Allied_Non_Involvement_desc: "Alors que la crise politique interne s'aggrave en Allemagne, il existe un risque que la Haute Commission alliée intervienne. Nous devons affirmer fermement notre souveraineté et insister sur le fait qu'il s'agit d'un problème allemand qui doit être résolu par les Allemands seuls, sans ingérence étrangère."
 WGR_Schumacher_49_Allow_Schumacher_to_Return_desc: "Miraculeusement, la santé de Kurt Schumacher s'est suffisamment améliorée pour qu'il envisage un retour en politique. Bien qu'affaibli, sa présence pourrait unir le parti divisé. Cependant, son retour bouleverserait également le nouvel équilibre politique et raviverait d'anciens conflits."
 WGR_Schumacher_49_Strengthen_Federal_Cabinet_desc: "Le bureau du chancelier s'est révélé être un point faible critique pendant la crise. En renforçant les pouvoirs collectifs du Cabinet fédéral et du Bundestag, nous pouvons garantir que le gouvernement puisse continuer à fonctionner même si son dirigeant est dans l'incapacité d'exercer ses fonctions."
 WGR_Schumacher_49_Agree_to_Compensation_for_Nazi_and_Commie_Victims_desc: "Notre lutte contre l'extrémisme doit s'accompagner d'un soutien aux victimes. Le gouvernement créera un fonds destiné à indemniser financièrement les personnes qui ont souffert sous le régime nazi et sous la persécution communiste, affirmant ainsi notre engagement en faveur de la justice."
 WGR_Schumacher_49_Face_CDU_Criticism_desc: "La décision d'autoriser Schumacher à revenir à la Chancellerie a suscité une vague de critiques de la part de la CDU. Celle-ci qualifie cette décision de déstabilisante, estimant qu'elle témoigne d'un mépris pour le processus constitutionnel et replonge la république dans l'incertitude."
 WGR_Schumacher_49_Begin_Prepping_Ollenhauer_desc: "Schumacher, toujours stratège et conscient de sa propre mortalité, a commencé à préparer officiellement Erich Ollenhauer pour qu'il devienne son successeur désigné. En lui transférant des responsabilités et en lui apportant son soutien public, Schumacher espère garantir la pérennité de son héritage et de sa vision politique après son départ."
 WGR_Schumacher_49_Death_of_Schumacher_desc: "Le titan de la social-démocratie d'après-guerre n'est plus. Kurt Schumacher a succombé à une santé défaillante. Sa mort prive non seulement le parti, mais aussi la nation tout entière, de sa voix la plus dominante et la plus intransigeante, annonçant une ère d'incertitude politique sans précédent."
 WGR_Schumacher_49_Franke_March_on_Chancellery_desc: "Se sentant lésés dans leur droit à la succession, Egon Franke et ses partisans de l'aile droite du SPD ont pris une mesure radicale. Dans le cadre d'une puissante manifestation politique, ils défilent devant la Chancellerie pour exiger la démission d'Ollenhauer et revendiquer le droit de Franke à la direction du parti."
 WGR_Schumacher_49_Secure_Ollenhauer_Control_desc: "Avec la rébellion ouverte de l'aile droite du parti, les loyalistes doivent agir rapidement. Nous allons rallier l'appareil du parti, les syndicats et nos partenaires de coalition afin d'assurer le contrôle d'Erich Ollenhauer sur le gouvernement et de repousser la contestation de la faction de Franke."
 WGR_Schumacher_49_Split_from_Ollenhauer_SPD_desc: "Le fossé s'est creusé. Déclarant que le parti dirigé par Ollenhauer avait été pris en otage par l'aile radicale de gauche, Egon Franke et ses partisans ont officiellement quitté le SPD pour former leur propre groupe parlementaire, brisant ainsi le mouvement social-démocrate."
 WGR_Schumacher_49_Spread_Anti_Ollenhauer_Rhetoric_desc: "La faction Franke va désormais lancer une campagne publique contre le nouveau chancelier. En présentant Ollenhauer comme un idéologue de gauche faible et incapable de diriger la nation, elle espère éroder son soutien public et se positionner comme la seule alternative viable."
 WGR_Schumacher_49_Hold_Meetings_with_Adenauer_desc: "Dans un geste qui aurait été impensable il y a quelques mois encore, Egon Franke mène désormais des discussions directes avec le chef de la CDU, Konrad Adenauer. Une alliance anti-Ollenhauer est en cours de discussion, qui pourrait déboucher sur la formation d'une nouvelle coalition entre la droite du SPD et les chrétiens-démocrates."
 WGR_Schumacher_49_Involve_the_Federal_Constitutional_Court_desc: "La question de savoir qui est le chancelier légitime – Ollenhauer, nommé par le parti, ou Franke, le successeur désigné – a provoqué une crise constitutionnelle. Une faction va saisir la Cour constitutionnelle fédérale de Karlsruhe afin qu'elle rende une décision contraignante et sorte de l'impasse."
 WGR_Schumacher_49_Rule_Bundestag_desc: "Après plusieurs jours de délibération, la Cour constitutionnelle fédérale a rendu son verdict. S'appuyant sur des précédents et la procédure constitutionnelle, la Cour a donné raison à Egon Franke et à l'aile droite du SPD. La chancellerie d'Ollenhauer est déclarée illégitime, plongeant le gouvernement dans le chaos et offrant une victoire écrasante aux forces qui cherchent à s'aligner sur l'opposition."
 WGR_Schumacher_49_Rule_Ollenhauer_desc: "La Cour constitutionnelle fédérale a rendu son verdict. Les juges ont statué que la nomination parlementaire d'Erich Ollenhauer au poste de chancelier était constitutionnelle, confirmant ainsi sa légitimité et portant un coup fatal à Egon Franke et à sa faction dissidente."
 WGR_Schumacher_49_Form_Franke_Caretaker_Govt_desc: "La cour ayant statué en sa faveur, Egon Franke a formé un gouvernement provisoire, probablement avec le soutien tacite de la CDU. Sa mission principale sera de stabiliser le pays et de préparer de nouvelles élections fédérales dès que possible."
 WGR_Schumacher_49_Serve_as_Negotiator_desc: "Les deux principaux partis étant en état de guerre civile et dans l'impasse, une figure neutre doit intervenir. En jouant le rôle de médiateur impartial entre la CDU et les factions rivales du SPD, nous pourrions parvenir à un compromis viable qui permettrait à l'État de continuer à fonctionner."
 WGR_Schumacher_49_Pursue_Greater_Inner_German_Relations_desc: "Malgré les troubles internes, la question allemande demeure. Le gouvernement Ollenhauer réaffirmera son engagement en faveur d'une politique visant à renforcer le dialogue et les relations avec l'Est, convaincu que les contacts intra-allemands constituent la seule voie viable à long terme vers la réunification."
 WGR_Schumacher_49_Stress_SPD_Legitimacy_desc: "Notre gouvernement doit passer à l'offensive. À travers des discours publics, des campagnes médiatiques et des manœuvres parlementaires, nous continuerons à souligner la légitimité de notre leadership et à présenter la faction dissidente comme des rebelles illégitimes."
 WGR_Schumacher_49_Make_a_Speech_to_the_German_People_desc: "En cette période de crise, le chancelier doit s'adresser directement à la nation. Un discours diffusé dans toute la république permettra d'exposer notre position, d'apaiser les craintes du public et d'appeler à l'unité contre le chaos politique qui menace notre démocratie."
 WGR_Schumacher_49_Deflect_CDU_Accusations_of_Corruption_desc: "La CDU a profité du chaos pour lancer des accusations de corruption et de magouilles contre notre gouvernement. Nous devons habilement détourner ces attaques, les renvoyer à l'opposition et les dénoncer comme des manœuvres politiques cyniques."
 WGR_Schumacher_49_Hold_Schumachers_State_Funeral_desc: "Les funérailles nationales de Kurt Schumacher seront un moment de deuil national. Elles constitueront également une occasion politique cruciale pour ses successeurs de revendiquer son héritage, de rendre hommage à sa vision pour l'Allemagne et de rallier les fidèles à leur cause devant toute la nation."
 WGR_Schumacher_49_Reassert_SPD_Legitimacy_desc: "Les funérailles sont terminées ; la bataille politique reprend. Nous devons désormais dépasser le stade du deuil et réaffirmer la légitimité de notre gouvernement par des actions décisives, en prouvant par nos politiques et notre force que nous sommes les véritables héritiers du mandat du SPD."
 WGR_Schumacher_49_Put_Down_Protests_Against_the_Schumacher_Affair_desc: "Les luttes politiques internes, baptisées « affaire Schumacher » par la presse, ont donné lieu à des manifestations publiques et à des troubles. Afin de maintenir l'ordre et de projeter une image de force, le gouvernement pourrait être contraint de faire appel à la police pour réprimer ces manifestations."
 WGR_Schumacher_49_Prepare_For_the_1953_Federal_Election_desc: "La situation politique actuelle est intenable. Le seul moyen de résoudre véritablement cette crise et d'obtenir un mandat clair est de passer par les urnes. Nous devons dès à présent commencer à mobiliser toutes nos ressources afin de nous préparer aux élections fédérales cruciales de 1953."
 WGR_Ollenhauer_53_Bundeskanzler_Erich_Ollenhauer_desc: "Après le décès du redoutable Kurt Schumacher, le Bundestag a confirmé son successeur désigné. Erich Ollenhauer, figure de proue de la gauche traditionnelle du SPD, prend désormais les rênes de la chancellerie. Son gouvernement devrait gouverner d'une main de fer, en défendant les principes socialistes fondamentaux du parti tout en naviguant dans les eaux troubles de la guerre froide."
 WGR_Ollenhauer_53_Make_a_Report_to_the_Bundestag_desc: "Dans son premier discours important, le chancelier Ollenhauer présentera au Bundestag un rapport sur la situation du pays. Ce discours exposera l'engagement de son gouvernement en faveur de la justice sociale, sa volonté inébranlable de réunifier l'Allemagne et les décisions politiques clés qui attendent la République fédérale."
 WGR_Ollenhauer_53_Form_United_SPD_desc: "La plus grande force du SPD réside dans son unité et son attachement à ses principes. Le gouvernement s'attachera à consolider le parti, en veillant à ce que la droite pragmatique et la gauche idéologique travaillent ensemble. Cette voie réaffirme notre identité en tant que parti de la classe ouvrière, dédié au socialisme démocratique."
 WGR_Ollenhauer_53_Pursue_Rapprochement_with_CDU_desc: "Bien que nous détenions la chancellerie, les réalités politiques d'un Bundestag divisé ne peuvent être ignorées. Afin de faire adopter les lois essentielles, nous poursuivrons un rapprochement limité avec l'opposition CDU, en recherchant un terrain d'entente sur les questions d'importance nationale sans sacrifier nos valeurs fondamentales."
 WGR_Ollenhauer_53_Form_Federal_Ministry_Inner_German_Affairs_desc: "La division de notre nation est le problème central de notre époque. Afin d'accorder à ce défi toute l'attention qu'il mérite, nous créerons un nouveau ministère fédéral des Affaires intérieures allemandes, chargé de favoriser les contacts avec l'Est et d'œuvrer sans relâche à la réunification pacifique."
 WGR_Ollenhauer_53_Pursue_Nationalization_of_Utilities_desc: "Les industries clés qui fournissent des services essentiels doivent être entre les mains du peuple. Conformément à nos principes socialistes, le gouvernement poursuivra la nationalisation des principaux services publics, en veillant à ce que les ressources telles que l'électricité et l'eau soient gérées dans l'intérêt général et non pour l'enrichissement privé."
 WGR_Ollenhauer_53_Appoint_Ludwig_Erhard_desc: "Dans un geste significatif de réconciliation politique, nous proposerons le poste de ministre de l'Économie à Ludwig Erhard, membre de la CDU. Son expertise en matière d'« économie sociale de marché » pourrait favoriser la stabilité économique, même si cela nous obligera à faire des compromis sur nos projets de nationalisation les plus ambitieux."
 WGR_Ollenhauer_53_Allow_Limited_Private_Religious_Schools_desc: "À titre de compromis avec les démocrates-chrétiens, nous autoriserons le maintien d'un nombre limité d'écoles religieuses privées. Bien que la politique de notre gouvernement favorise un système d'enseignement public laïc, cette concession est une mesure nécessaire pour garantir la stabilité politique."
 WGR_Ollenhauer_53_Uncover_the_Kriedemann_Scandal_desc: "Une crise a éclaté au sein même de notre cabinet. Il a été découvert qu'un ministre de haut rang, Kriedemann, avait un passé très compromettant, avec des liens crédibles avec l'ancien régime nazi. Ce scandale menace l'autorité morale de notre gouvernement et doit être traité avec une extrême prudence."
 WGR_Ollenhauer_53_Hold_Televised_Hearings_desc: "Le public a le droit de connaître la vérité. Nous organiserons des audiences publiques télévisées sur l'affaire Kriedemann, démontrant ainsi l'engagement de notre gouvernement en faveur de la transparence et notre détermination à purifier l'État de son sombre passé, quel qu'en soit le coût politique."
 WGR_Ollenhauer_53_Quietly_Fire_Him_desc: "Un scandale public déstabiliserait le gouvernement et ferait le jeu de nos adversaires. Kriedemann sera discrètement démis de ses fonctions pour « raisons de santé » et l'affaire sera traitée en interne afin d'éviter une crise politique plus grave. Parfois, la discrétion est la meilleure partie du courage."
 WGR_Ollenhauer_53_Ramp_Up_Investigations_on_Nazis_desc: "L'affaire Kriedemann est le symptôme d'un problème plus profond. Nous allons intensifier les enquêtes fédérales sur les anciens nazis occupant des postes dans la fonction publique, l'industrie et la politique, afin de montrer clairement qu'ils n'ont pas leur place dans notre nouvelle démocratie."
 WGR_Ollenhauer_53_Require_Nazis_and_Communists_to_Register_desc: "Afin de garantir la transparence et la sécurité, nous adopterons une loi obligeant tous les citoyens ayant des antécédents avérés d'adhésion au NSDAP ou au KPD à déclarer officiellement leurs affiliations passées auprès de l'État. La connaissance est la première ligne de défense."
 WGR_Ollenhauer_53_Destroy_All_Evidence_of_Gestapo_Involvement_desc: "Nos enquêtes ont révélé quelque chose de profondément troublant : des preuves suggérant que certains de nos propres membres avaient des contacts avec la Gestapo. Pour le bien du parti et la stabilité de l'État, cette information explosive doit être étouffée. Toutes les preuves connexes seront détruites."
 WGR_Ollenhauer_53_Deny_Accusations_of_Extremists_in_Govt_desc: "L'opposition utilise l'affaire Kriedemann pour lancer une campagne de dénigrement, accusant notre gouvernement d'héberger des extrémistes. Nous réfuterons avec force ces accusations sans fondement dans la presse et au Bundestag, en les présentant comme une attaque politique cynique."
 WGR_Ollenhauer_53_Continue_Black_and_Red_Scares_desc: "Les menaces provenant de l'extrême droite et de l'extrême gauche sont réelles. Nous poursuivrons les politiques de sécurité du gouvernement précédent, en enquêtant activement et en poursuivant les néonazis et les subversifs communistes afin de protéger notre jeune démocratie."
 WGR_Ollenhauer_53_End_the_Black_and_Red_Scares_desc: "Ces « alertes » ont créé un climat de paranoïa et ont été utilisées pour faire taire toute dissidence légitime. Notre gouvernement mettra fin à ces enquêtes motivées par des considérations politiques, réaffirmant ainsi son engagement en faveur des libertés civiles et se concentrant uniquement sur les menaces crédibles qui pèsent sur la Constitution."
 WGR_Ollenhauer_53_Debate_the_Role_of_BGS_desc: "La police fédérale des frontières, notre seule force armée nationale, se trouve à la croisée des chemins. S'agit-il simplement d'une force de police chargée de la surveillance des frontières ou est-elle le germe d'une future armée allemande ? Le Bundestag doit mener un débat sérieux sur le rôle, la taille et la mission futurs de la BGS."
 WGR_Ollenhauer_53_Scale_Back_BGS_desc: "Le rôle du BGS est de surveiller nos frontières, pas de devenir une armée clandestine. Nous résisterons à la pression en faveur du réarmement et réduirons les capacités militaires du BGS, réaffirmant ainsi son statut d'organisation défensive et axée sur l'application de la loi."
 WGR_Ollenhauer_53_Expand_BGS_Into_Fighting_Force_desc: "Face à la menace soviétique, une simple patrouille frontalière ne suffit pas. Le BGS doit être renforcé et rééquipé afin de devenir une force de combat mobile crédible, capable de défendre notre territoire et d'agir comme un véritable précurseur d'une armée nationale."
 WGR_Ollenhauer_53_Integrate_Customs_Service_into_BGS_desc: "Afin d'améliorer l'efficacité et de rationaliser le contrôle aux frontières, le service douanier distinct (Zollgrenzdienst) sera pleinement intégré dans la structure de commandement de la garde-frontière fédérale, créant ainsi une organisation unique et unifiée responsable de toutes les questions frontalières."
 WGR_Ollenhauer_53_Professionalize_Border_Troops_desc: "Une force frontalière moderne nécessite plus que de la main-d'œuvre ; elle nécessite également de l'expertise. Nous investirons dans des programmes de formation avancés et dans un équipement plus performant afin de professionnaliser nos troupes frontalières, en mettant l'accent sur leur mission principale de surveillance et de sécurité."
 WGR_Ollenhauer_53_Decrease_Funding_to_Border_Guard_desc: "Nos priorités résident dans la reconstruction sociale et économique, et non dans les dépenses militaires. Le financement du BGS sera réduit, et les ressources seront réaffectées à des besoins nationaux plus urgents. La défense de l'Allemagne relève de la compétence des puissances alliées."
 WGR_Ollenhauer_53_Remain_With_Only_Border_Defense_Troops_desc: "Notre engagement est axé sur la défense, et non sur l'attaque. La BGS sera structurée uniquement dans le but de défendre notre frontière immédiate, sans capacité ni doctrine pour mener des opérations au-delà de ce cadre limité. Cela rassurera nos voisins et le monde entier quant à nos intentions pacifiques."
 WGR_Ollenhauer_53_Authorize_More_BGS_Units_desc: "La longue frontière avec l'Est est dangereusement poreuse. Pour la sécuriser correctement, nous devons autoriser la création de plusieurs nouvelles unités du BGS, augmenter nos effectifs et nous assurer que nous pouvons patrouiller l'intégralité du rideau de fer"
 WGR_Ollenhauer_53_Purchase_Armored_Vehicles_and_Light_Aircraft_desc: "Pour donner à la BGS une chance de lutter contre toute incursion potentielle, elle doit être mécanisée. Nous autoriserons l'achat de véhicules blindés, de moyens de transport et d'avions de reconnaissance légers modernes afin d'améliorer la mobilité et la puissance de feu de nos unités frontalières."
 WGR_Ollenhauer_53_Expand_the_Inner_German_Border_desc: "La division de l'Allemagne est une réalité tragique, et la frontière doit être sécurisée. Nous allons étendre et renforcer les infrastructures le long de la frontière intra-allemande, non pas pour la rendre permanente, mais pour contrôler les passages illégaux et protéger notre État contre l'infiltration venue de l'Est."
 WGR_Ollenhauer_53_Prepare_For_a_Transition_to_the_Bundeswehr_desc: "Le temps des faux-semblants est révolu. La BGS sera désormais officiellement désignée comme le cadre d'une future armée nationale, la Bundeswehr. Sa structure de commandement, sa formation et sa doctrine seront réformées afin de permettre une transition en douceur vers une force militaire à part entière."
 WGR_Ollenhauer_53_Develop_the_Ollenhauer_Doctrine_of_FP_desc: "Le chancelier Ollenhauer exposera sa propre doctrine en matière de politique étrangère allemande. Il s'agira d'une approche prudente et fondée sur des principes, qui privilégiera la réunification allemande et la sécurité collective européenne plutôt qu'un alignement rigide sur un seul bloc, et qui recherchera la voie du dialogue et de l'indépendance."
 WGR_Ollenhauer_53_Continue_Western_Integration_on_German_Terms_desc: "Bien que notre place soit parmi les démocraties occidentales, nous ne serons pas un partenaire mineur. Nous poursuivrons le processus d'intégration occidentale, mais selon nos propres conditions, en insistant pour que les intérêts allemands, notamment en matière de réunification, soient respectés par nos alliés à chaque étape."
 WGR_Ollenhauer_53_Continue_a_Neutral_FP_Agenda_desc: "La meilleure voie vers la réunification pourrait être celle de la neutralité. Notre gouvernement mènera une politique étrangère qui évitera toute alliance militaire avec l'Est ou l'Ouest, positionnant l'Allemagne comme un pont indépendant et pacifique au cœur d'une Europe divisée."
 WGR_Ollenhauer_53_Sign_a_Security_Agreement_with_US_desc: "Afin de garantir notre sécurité contre toute agression soviétique, nous négocierons un accord bilatéral de sécurité avec les États-Unis. Cela nous permettra d'obtenir l'engagement américain en matière de défense sans avoir à nous intégrer pleinement dans la structure de commandement militaire de l'OTAN."
 WGR_Ollenhauer_53_Join_IMF_desc: "Pour assurer notre avenir économique et stabiliser notre monnaie, il est essentiel de participer au système financier mondial. L'Allemagne va officiellement demander à adhérer au Fonds monétaire international et à la Banque mondiale, consolidant ainsi notre place dans la sphère économique occidentale."
 WGR_Ollenhauer_53_Deny_Deployment_of_Nuclear_Weapons_on_German_Territory_desc: "Notre gouvernement exprimera clairement et sans équivoque sa position : il n'y aura pas de déploiement d'armes nucléaires étrangères sur le sol allemand. Nous ne permettrons pas que notre pays devienne le principal champ de bataille atomique dans une guerre entre superpuissances."
 WGR_Ollenhauer_53_Debate_Recognition_of_Oder_Neisse_Line_desc: "La question de notre frontière orientale avec la Pologne est un sujet douloureux et non résolu. Le gouvernement va lancer un débat sur la reconnaissance officielle de la ligne Oder-Neisse. Bien que coûteuse sur le plan politique, une telle décision pourrait constituer une étape cruciale vers la réconciliation avec nos voisins orientaux."
 WGR_Ollenhauer_53_Begin_Diplomatic_Relations_with_Israel_desc: "Consciente de sa responsabilité historique, l'Allemagne doit prendre des mesures pour construire un avenir d'amitié avec le peuple juif. Notre gouvernement entamera officiellement le processus visant à établir des relations diplomatiques complètes avec l'État d'Israël."
 WGR_Ollenhauer_53_Hold_a_Conference_on_Neutrality_in_Frankfurt_desc: "Afin de promouvoir notre vision d'une Europe centrale pacifique et non alignée, nous organiserons une grande conférence internationale à Francfort. Nous inviterons l'Autriche, la Suisse et d'autres pays neutres à discuter d'un cadre de sécurité collective en dehors des deux grands blocs de puissance."
 WGR_Ollenhauer_53_Propose_a_Visit_to_East_Berlin_desc: "Le dialogue est la seule voie vers la réunification. Dans un geste diplomatique audacieux, le chancelier Ollenhauer proposera une visite officielle à Berlin-Est afin de rencontrer les dirigeants de la République démocratique allemande, dans le but d'ouvrir un nouveau chapitre dans les relations interallemandes."
 WGR_Ollenhauer_53_Sign_Security_Agreements_with_Nordic_Nations_desc: "Les nations démocratiques de Scandinavie partagent notre désir de paix et de stabilité en dehors des grands blocs de puissance. Nous conclurons des accords de sécurité mutuelle avec la Suède, le Danemark et la Norvège, créant ainsi un « pôle nordique » d'États sociaux-démocrates partageant les mêmes idées."
 WGR_Ollenhauer_53_Demand_Withdrawl_of_American_Forces_desc: "Une Allemagne véritablement neutre et souveraine ne peut être une Allemagne occupée. Nous exigerons officiellement que les États-Unis et les autres puissances occidentales entament un retrait progressif de toutes leurs forces du territoire allemand, afin que nous puissions prendre en main notre propre défense."
 WGR_Ollenhauer_53_Begin_a_Crusade_Against_Imperialism_and_Communism_desc: "Notre combat vise à instaurer une « troisième voie » pour toute l'humanité. L'Allemagne va lancer une croisade diplomatique et idéologique contre les deux fléaux de notre époque : l'impérialisme occidental et le communisme soviétique, en défendant la cause de l'autodétermination et du socialisme démocratique sur la scène internationale."
 WGR_Ollenhauer_53_React_to_Suez_desc: "L'invasion de l'Égypte par la Grande-Bretagne, la France et Israël a provoqué une crise mondiale et un dilemme moral. En tant que nation attachée au droit international et à l'anti-impérialisme, l'Allemagne doit décider comment réagir à l'agression de nos soi-disant alliés."
 WGR_Ollenhauer_53_Pledge_Support_to_Britain_and_France_desc: "Malgré nos réserves quant à leurs actions, la Grande-Bretagne et la France sont nos partenaires en Europe. Nous leur apporterons notre soutien diplomatique, en privilégiant la solidarité occidentale plutôt que les spécificités de la crise, dans l'intérêt d'une stabilité à long terme."
 WGR_Ollenhauer_53_Stand_with_Nasser_desc: "Nous ne pouvons rester les bras croisés alors qu'une nation souveraine est envahie. L'Allemagne condamnera les actions de la Grande-Bretagne, de la France et d'Israël, et fera preuve de solidarité diplomatique envers le président Nasser et l'Égypte, en défendant les principes de l'autodétermination nationale."
 WGR_Ollenhauer_53_Advance_SPD_Domestic_Policy_desc: "Notre politique étrangère étant désormais définie, nous allons nous pencher sur notre programme national. Le gouvernement mettra en œuvre une série de mesures visant à créer une société plus juste, plus équitable et plus laïque, conformément aux promesses faites au peuple allemand pendant la campagne électorale."
 WGR_Ollenhauer_53_Debate_a_Social_Welfare_Package_desc: "Notre programme national s'articule autour d'un ensemble complet de mesures sociales. Le Bundestag débattra de nos propositions visant à étendre les allocations chômage, les soins de santé publics et les retraites, jetant ainsi les bases d'un véritable État providence allemand."
 WGR_Ollenhauer_53_Form_Federal_Ministry_of_Family_Affairs_desc: "Afin de soutenir les familles et de promouvoir le bien-être social, nous créerons un nouveau ministère fédéral chargé des affaires familiales. Il sera chargé d'élaborer des politiques en matière de garde d'enfants, de congé parental et de services à la jeunesse, afin de renforcer le cœur de notre société."
 WGR_Ollenhauer_53_Form_Federal_Pension_Office_desc: "Garantir une retraite digne à nos travailleurs est un devoir solennel. Un nouvel Office fédéral des pensions sera créé pour administrer un système national de retraite garanti par l'État, offrant une sécurité à des millions d'Allemands âgés."
 WGR_Ollenhauer_53_Introduce_Political_Background_Checks_desc: "Afin de garantir que notre fonction publique soit exempte de toute influence extrémiste, nous mettrons en place des vérifications obligatoires des antécédents politiques pour tous les nouveaux employés du gouvernement. Cela permettra d'empêcher d'anciens nazis et communistes d'infiltrer nos institutions démocratiques."
 WGR_Ollenhauer_53_Pass_Federal_Education_Standardization_Act_desc: "L'éducation devrait relever de la compétence fédérale, afin de garantir des normes égales et un programme scolaire laïc pour tous les enfants allemands. Nous adopterons la loi controversée sur la normalisation fédérale de l'éducation (FESA), qui transfère la compétence en matière scolaire des États au gouvernement fédéral."
 WGR_Ollenhauer_53_Relax_Illegality_of_Homosexuality_desc: "Dans le cadre d'une évolution vers une société plus tolérante et libérale, notre gouvernement prendra des mesures pour assouplir le tristement célèbre paragraphe 175, mettant ainsi fin à la persécution active des homosexuels. Il s'agit d'une avancée modeste mais significative en faveur de la liberté individuelle."
 WGR_Ollenhauer_53_Extol_Social_Freedom_of_WGR_desc: "Notre république sera un phare de liberté. Grâce à des programmes culturels et à la diplomatie publique, nous vanterons les libertés sociales de l'Allemagne de l'Ouest, en opposant notre société ouverte et tolérante au totalitarisme rigide de l'Est."
 WGR_Ollenhauer_53_Continue_Volks_Economy_Program_desc: "L'économie doit être au service du peuple, et non l'inverse. Nous poursuivrons le programme « Volks Economy » (économie populaire), en recourant à l'orientation et aux investissements de l'État pour garantir que la croissance économique se traduise par des avantages concrets pour la classe ouvrière."
 WGR_Ollenhauer_53_Expand_Autobahn_desc: "Afin de favoriser la croissance économique et l'unité nationale, nous investirons massivement dans l'extension et la modernisation du réseau autoroutier, améliorant ainsi les liaisons de transport entre toutes les grandes villes allemandes."
 WGR_Ollenhauer_53_Revamp_Rail_Systems_desc: "Les transports publics sont essentiels pour nos villes et nos travailleurs. Une initiative majeure sera lancée pour rénover et étendre les réseaux ferroviaires et tramways dans nos grands centres urbains, afin d'offrir à des millions de personnes des moyens de transport efficaces et abordables."
 WGR_Ollenhauer_53_Nationalize_Siemens_and_BASF_desc: "Les géants industriels Siemens et BASF sont trop importants pour notre économie nationale pour être laissés entre les mains du secteur privé. L'État va procéder à la nationalisation de ces conglomérats afin de garantir que leurs immenses ressources soient utilisées dans l'intérêt général."
 WGR_Ollenhauer_53_Begin_Development_of_Nuclear_Reactor_Hamburg_desc: "Pour assurer notre avenir énergétique, l'Allemagne doit se tourner vers l'énergie nucléaire. Nous allons commencer la construction de notre premier réacteur nucléaire civil à Hambourg, un projet historique qui marquera le début d'une nouvelle ère de progrès technologique."
 WGR_Ollenhauer_53_Expand_Consumer_Good_and_Car_Production_desc: "Les avantages de notre politique économique doivent se faire sentir dans chaque foyer. Nous encouragerons l'expansion de la production de biens de consommation et d'automobiles, afin que les Allemands ordinaires aient accès aux produits d'une société industrielle moderne."
 WGR_Ollenhauer_53_Pass_the_Bonn_Antitrust_Act_desc: "Afin d'empêcher la concentration du pouvoir économique entre les mains d'une poignée d'acteurs, notre gouvernement adoptera une nouvelle loi antitrust stricte. Cette loi mettra fin aux cartels et aux monopoles, favorisant ainsi une concurrence loyale et protégeant les consommateurs et les petites entreprises."
 WGR_Ollenhauer_53_Face_Protests_for_Banning_Religious_Schools_desc: "Notre loi fédérale sur la normalisation de l'éducation, qui interdit de fait les écoles religieuses financées par l'État, a déclenché une vague de protestations. Les groupes conservateurs et religieux, soutenus par la CDU et l'Église, descendent dans la rue et accusent notre gouvernement d'attaquer la foi et la famille."
 WGR_Ollenhauer_53_Repeal_FESA_desc: "Le coût politique de ce conflit est trop élevé. Dans l'intérêt de l'unité nationale et afin d'apaiser les troubles, notre gouvernement procédera à un retrait stratégique et abrogera la loi fédérale sur la normalisation de l'éducation, rendant ainsi aux États leur autorité sur les écoles."
 WGR_Ollenhauer_53_Continue_with_Secular_School_Policy_desc: "Nous ne céderons pas face aux protestations réactionnaires. Notre gouvernement restera ferme et poursuivra sa politique scolaire laïque, affirmant le principe de la séparation de l'Église et de l'État, quelles que soient les réactions politiques."
 WGR_Ollenhauer_53_Apologize_to_German_Bishops_desc: "Afin d'apaiser la crise, le chancelier fera un geste public de réconciliation. Sans abroger la loi, il présentera des excuses officielles aux évêques allemands pour la manière dont cette politique a été mise en œuvre, en cherchant le dialogue et le compromis."
 WGR_Ollenhauer_53_Refuse_to_Fund_Religious_Schools_desc: "Notre position est claire : l'État ne financera pas l'endoctrinement religieux. Bien que des écoles religieuses privées puissent exister, elles ne recevront absolument aucun financement fédéral. Les fonds publics sont réservés à l'éducation publique et laïque."
 WGR_Ollenhauer_53_Deploy_the_BGS_to_Put_Down_Protests_desc: "Les manifestations ont dégénéré en violences et menacent l'ordre public. La police locale étant débordée, le gouvernement prendra la décision grave de déployer la Bundesgrenzschutz afin de réprimer les manifestations et de rétablir le calme dans nos villes."
 WGR_Ollenhauer_53_Take_the_Law_to_the_FCC_desc: "Pour régler cette question une fois pour toutes, nous soumettrons la loi fédérale sur la normalisation de l'éducation à la Cour constitutionnelle fédérale. Une décision favorable de la plus haute juridiction du pays conférerait à notre politique une légitimité juridique et morale inébranlable."
 WGR_Ollenhauer_53_Attempt_to_Reconcile_a_Political_Alliance_desc: "La crise scolaire a empoisonné nos relations avec l'opposition. Nous devons désormais tenter de nous réconcilier avec les démocrates-chrétiens, en recherchant un compromis durable sur la politique éducative afin d'apaiser les profondes divisions au sein de notre société."
 WGR_Ollenhauer_53_Remain_At_Odds_with_CDU_desc: "Il ne peut y avoir aucun compromis sur le principe fondamental de la laïcité. Nous resterons en désaccord avec la CDU sur cette question, acceptant que cette division idéologique définisse le paysage politique dans un avenir prévisible."
 WGR_Ollenhauer_53_Prepare_For_the_1957_Federal_Election_desc: "Après quatre années tumultueuses marquées par des réformes audacieuses et de profondes controverses, notre mandat touche à sa fin. Le gouvernement doit désormais se préparer pour les élections fédérales de 1957, au cours desquelles le peuple allemand rendra son verdict sur notre leadership."
 WGR_Ollenhauer_53_Sign_the_Saar_Treaty_desc: "Le statut définitif de la Sarre doit être réglé. À l'issue de négociations avec la France, nous avons conclu le traité de Sarrebruck. Cet accord prévoit la réintégration politique de la Sarre dans la République fédérale, ce qui constitue un triomphe majeur pour la politique étrangère de notre gouvernement et une étape décisive vers l'unité nationale."
 WGR_Ollenhauer_57_A_Second_Ollenhauer_Govt_desc: "Le peuple allemand a accordé un second mandat à notre gouvernement. Après un mandat marqué par des réformes fondées sur des principes et des défis importants, le second gouvernement Ollenhauer poursuivra son travail. Notre priorité reste d'assurer la prospérité, la justice sociale et, à terme, l'unification de l'Allemagne, en naviguant d'une main sûre sur la voie difficile qui nous attend."
 WGR_Ollenhauer_57_Make_Speech_to_German_People_desc: "Pour inaugurer son deuxième mandat, le chancelier Ollenhauer prononcera un discours télévisé important devant le peuple allemand. Ce discours présentera les ambitions du gouvernement pour les quatre prochaines années, abordant les thèmes clés de la sécurité nationale, de la prospérité économique et de notre engagement indéfectible en faveur d'une réunification pacifique."
 WGR_Ollenhauer_57_Appoint_Franke_as_Vice_Chancellor_desc: "Dans un geste crucial pour l'unité du parti, le chancelier a nommé son ancien rival, Egon Franke, au poste de vice-chancelier. Bien que des divergences idéologiques subsistent, cette décision vise à combler le fossé entre l'aile gauche et l'aile droite du SPD, afin de présenter un front uni à la nation et au monde entier."
 WGR_Ollenhauer_57_Sign_Bonn_Declaration_desc: "Afin d'assurer la stabilité sur les questions d'intérêt national fondamental, notre gouvernement signera la déclaration de Bonn avec l'opposition CDU. Ce pacte bipartite établit un terrain d'entente sur les questions clés de politique étrangère et de sécurité, garantissant ainsi que l'Allemagne parle d'une seule voix sur la scène internationale."
 WGR_Ollenhauer_57_Pan_German_Unification_Rhetoric_desc: "Le rêve d'une Allemagne unifiée doit rester vivant dans le cœur de tous les Allemands, à l'Est comme à l'Ouest. Notre gouvernement va lancer une nouvelle campagne de propagande, utilisant les émissions de radio et la presse écrite pour défendre la cause de la réunification et renforcer les liens de notre nation divisée."
 WGR_Ollenhauer_57_Empower_Young_Socialists_desc: "Les « Jusos », la section jeunesse de notre parti, représentent l'avenir de la social-démocratie. Nous leur donnerons les moyens d'agir en leur accordant davantage de financement et une voix plus importante dans les affaires du parti, afin que leur énergie et leur idéalisme puissent contribuer à façonner notre ligne politique."
 WGR_Ollenhauer_57_Recognize_Clear_Difference_Between_Factions_desc: "La nomination de Franke n'était qu'une première étape. Le profond clivage idéologique entre la gauche traditionnelle du parti et sa droite pragmatique reste une source de tension. Nous devons désormais nous attaquer directement à ces divergences afin de déterminer l'âme future du Parti social-démocrate."
 WGR_Ollenhauer_57_Open_Hamburg_Stock_Exchange_desc: "Afin de favoriser les investissements et de consolider notre reprise économique, le moment est venu de rétablir pleinement nos marchés financiers. La Bourse de Hambourg, riche d'une longue et prestigieuse histoire, sera officiellement rouverte, envoyant ainsi un signal clair de confiance à la communauté économique mondiale."
 WGR_Ollenhauer_57_Recognize_Association_of_Expellees_desc: "Des millions d'Allemands ont été expulsés de leurs foyers ancestraux à l'Est. Leur principal groupe de défense, l'Association des expulsés, cherche désormais à former un parti politique. Les reconnaître donnerait à cette importante population une voix directe au Bundestag, même si leurs revendications nationalistes pourraient compliquer notre politique étrangère."
 WGR_Ollenhauer_57_Reconsider_Religion_in_Schools_desc: "Les débats houleux sur l'éducation laïque au cours de notre premier mandat ont laissé des traces profondes. Afin de favoriser la réconciliation nationale, le gouvernement va réexaminer ses politiques sur le rôle de la religion dans les écoles publiques, dans le but de trouver un nouveau compromis durable qui respecte à la fois la foi et l'éducation moderne."
 WGR_Ollenhauer_57_Bundeswehr_Development_desc: "Si notre objectif ultime est la paix, les réalités de la guerre froide exigent que nous soyons en mesure de nous défendre. Le gouvernement va désormais superviser la prochaine phase du développement de la Bundeswehr, afin de la transformer d'une force naissante en une armée moderne et professionnelle capable de protéger la République fédérale."
 WGR_Ollenhauer_57_Debate_American_Aid_desc: "Équiper une nouvelle armée représente une dépense colossale. Il faut débattre de l'opportunité de demander officiellement l'aide militaire des États-Unis. Si leur aide permettrait d'accélérer notre réarmement, elle pourrait s'accompagner de conditions politiques susceptibles de compromettre notre indépendance en matière de politique étrangère."
 WGR_Ollenhauer_57_Debate_Conscription_desc: "Une décision doit être prise quant à l'avenir du service militaire. Le Bundestag débattra de la mise en œuvre d'une politique nationale de conscription. Un projet de loi permettrait de fournir les effectifs nécessaires à une grande armée défensive, mais cette question reste très controversée au sein de la population et de notre propre parti."
 WGR_Ollenhauer_57_Develop_Swiss_HS30_IFV_desc: "Notre nouvelle armée a besoin d'équipements modernes. En partenariat avec la société suisse Hispano-Suiza, l'industrie allemande va se lancer dans le développement et la production du HS-30, un nouveau véhicule de combat d'infanterie innovant qui constituera l'épine dorsale de nos divisions d'infanterie mécanisée."
 WGR_Ollenhauer_57_Bolster_Domestic_Military_Production_desc: "Une nation souveraine ne peut dépendre d'autres pays pour assurer sa propre défense. Nous orienterons les investissements et les contrats publics vers l'industrie allemande afin de créer une solide capacité de production militaire nationale, garantissant ainsi que la Bundeswehr soit approvisionnée par nos propres usines."
 WGR_Ollenhauer_57_Form_Bundeswehr_Command_Staff_Academy_desc: "La nouvelle armée allemande doit être dirigée par des officiers fidèles aux principes démocratiques. Nous allons créer à Hambourg la « Führungsakademie der Bundeswehr », une académie militaire de premier plan dédiée à la formation d'une nouvelle génération de commandants pour nos forces armées."
 WGR_Ollenhauer_57_Build_von_Blucher_Barracks_desc: "Notre armée en pleine expansion a besoin d'installations modernes. Une nouvelle base militaire d'envergure, la caserne General von Blücher, va être construite. Ce complexe ultramoderne accueillera des milliers de soldats et servira de centre de commandement clé pour la Bundeswehr."
 WGR_Ollenhauer_57_Begin_Advances_in_Sea_Air_Tech_desc: "La défense ne se limite pas au territoire terrestre. Nous lancerons de nouveaux programmes de recherche et développement visant à améliorer nos capacités navales et aériennes, afin de garantir que la Bundesmarine et la Luftwaffe disposent des technologies nécessaires pour protéger nos côtes et notre espace aérien."
 WGR_Ollenhauer_57_Continue_Wirtschaftswunder_desc: "Le miracle économique allemand est le fondement de notre stabilité et de notre prospérité. La politique économique de notre gouvernement visera à poursuivre cette croissance incroyable, à garantir le plein emploi et à améliorer le niveau de vie de tous nos citoyens."
 WGR_Ollenhauer_57_Expand_Coal_Facilities_Ruhr_desc: "Le charbon reste le moteur de notre industrie. Nous investirons dans la modernisation des mines de la vallée de la Ruhr afin d'augmenter la production de charbon, garantissant ainsi un approvisionnement régulier en combustible pour les aciéries et les centrales électriques de notre pays."
 WGR_Ollenhauer_57_Construct_Airports_Frankfurt_Hamburg_desc: "Afin de faciliter les échanges commerciaux et de relier l'Allemagne au reste du monde, nos infrastructures aéronautiques doivent être irréprochables. Des projets d'envergure seront lancés pour agrandir et moderniser les aéroports des principaux pôles commerciaux que sont Hambourg et Francfort."
 WGR_Ollenhauer_57_Build_Oil_Refineries_Bavaria_desc: "L'indépendance énergétique est cruciale pour notre souveraineté économique. Nous orienterons les investissements publics vers la construction de nouvelles raffineries de pétrole en Bavière, afin d'augmenter notre capacité nationale à transformer le pétrole brut en carburant pour nos industries et nos consommateurs."
 WGR_Ollenhauer_57_Expand_Rail_Network_North_South_desc: "Une économie efficace nécessite une logistique efficace. Nous allons lancer un grand projet d'infrastructure visant à étendre et à moderniser les principales lignes ferroviaires reliant les ports du nord aux centres industriels du sud, afin d'accélérer la circulation des marchandises à travers la république."
 WGR_Ollenhauer_57_Found_Leifheit_and_Meister_Verbrauchermarkt_desc: "La prospérité du Wirtschaftswunder doit se ressentir dans tous les foyers allemands. Le gouvernement soutiendra les entreprises innovantes axées sur les consommateurs, telles que Leifheit, ainsi que les nouveaux modèles de distribution, tels que Meister Verbrauchermarkt, qui apportent des commodités modernes à la population allemande."
 WGR_Ollenhauer_57_Proclaim_Renewed_Germany_desc: "La période de reconstruction d'après-guerre est terminée. L'Allemagne est à nouveau une nation souveraine et prospère. Dans un discours important, la chancelière proclamera cette nouvelle ère pour l'Allemagne, une nation renouvelée dans son engagement en faveur de la paix, de la démocratie et de la justice sociale."
 WGR_Ollenhauer_57_German_Nuclear_Program_desc: "L'avenir de l'énergie et de la science réside dans l'atome. Notre gouvernement va officiellement lancer un programme nucléaire allemand. Sa mission sera strictement pacifique, visant à exploiter l'énergie atomique pour fournir une énergie propre et stimuler l'innovation technologique au profit de tous."
 WGR_Ollenhauer_57_Atoms_for_Peace_Funding_desc: "Pour lancer notre programme nucléaire pacifique, nous demanderons officiellement à rejoindre l'initiative « Atoms for Peace » (Des atomes pour la paix) du président Eisenhower. L'accès au financement et à l'expertise technique américains sera inestimable pour nous aider à construire notre première génération de réacteurs nucléaires civils."
 WGR_Ollenhauer_57_Form_Fed_Min_Nuclear_Affairs_desc: "Le développement de l'énergie nucléaire est une tâche d'une importance et d'une complexité immenses. Afin de la gérer efficacement et d'assurer la sécurité publique, nous créerons un nouveau ministère fédéral chargé des affaires nucléaires, qui sera dédié à la supervision de tous les aspects de notre programme atomique civil."
 WGR_Ollenhauer_57_Condemn_Nuclear_Power_for_Weapons_desc: "Notre engagement en faveur de la paix doit être sans ambiguïté. Le gouvernement allemand publiera une déclaration officielle condamnant l'utilisation de l'énergie nucléaire à des fins militaires. Nous défendrons la cause du désarmement mondial et nous nous engageons à ce que la science atomique allemande ne soit jamais utilisée pour créer des armes de destruction massive."
 WGR_Ollenhauer_57_Build_Research_Reactors_desc: "Afin de former une nouvelle génération de scientifiques et d'ingénieurs nucléaires allemands, nous construirons de petits réacteurs de recherche dans les universités de nos grandes villes. Ces installations seront des centres d'apprentissage et d'innovation qui feront progresser notre programme atomique pacifique."
 WGR_Ollenhauer_57_Implement_Nuclear_Drills_and_Procedures_desc: "Même un programme nucléaire pacifique comporte des risques inhérents. Afin d'assurer la sécurité de notre population, le gouvernement mettra en œuvre des procédures de sécurité rigoureuses à l'échelle nationale et organisera régulièrement des exercices afin de se préparer à tout accident nucléaire potentiel."
 WGR_Ollenhauer_57_Begin_Construction_of_Schumacher_Nuclear_Powerplant_desc: "Pour couronner notre programme atomique pacifique, nous allons commencer la construction de la première centrale nucléaire à grande échelle d'Allemagne. En l'honneur de notre défunt chancelier et de sa vision d'une Allemagne prospère, elle sera baptisée « Centrale nucléaire Schumacher »."
 WGR_Ollenhauer_57_Debate_the_Soviet_Proposal_on_Berlin_desc: "L'Union soviétique a lancé un ultimatum, exigeant le retrait des troupes occidentales de Berlin et proposant sa transformation en « ville libre ». Cette initiative provocatrice a provoqué une grave crise internationale, et notre gouvernement doit désormais débattre de sa réponse à cette remise en cause de la liberté de Berlin."
 WGR_Ollenhauer_57_Consider_Further_Negotiations_Without_the_Allies_desc: "La proposition soviétique, bien qu'alarmiste, recèle peut-être une opportunité. En entamant des négociations sur le statut de « ville libre de Berlin », nous pourrions peut-être désamorcer la crise et créer un nouveau canal direct de dialogue sur la question plus large de la réunification allemande, indépendamment des puissances alliées."
 WGR_Ollenhauer_57_Firmly_Reject_the_Idea_of_a_Free_City_of_Berlin_desc: "La proposition soviétique est une tentative cynique visant à séparer Berlin-Ouest de la République fédérale et du monde libre. Nous rejetons fermement et publiquement l'idée d'une « ville libre » et exprimons notre solidarité absolue avec nos alliés occidentaux et le peuple berlinois. Il n'y aura aucun compromis sur leur liberté."
 WGR_Franke_53_Bundeskanzler_Egon_Franke_desc: "Après les événements tumultueux de ces dernières années, le Bundestag a confirmé un nouveau dirigeant pour la République fédérale. Egon Franke, figure clé de l'aile pragmatique du SPD, a accédé à la chancellerie. Son gouvernement, une coalition entre le SPD et le Zentrum, est désormais confronté à la tâche monumentale de guider l'Allemagne à travers la guerre froide."
 WGR_Franke_53_Make_a_Report_to_the_Bundestag_desc: "Dans le cadre de sa première action officielle, le chancelier Franke présentera un rapport complet au Bundestag. Ce discours décrira la situation du pays, les défis à relever et les choix fondamentaux que son gouvernement devra faire en matière de politique intérieure et étrangère. Ce discours définira la ligne de conduite pour les années à venir."
 WGR_Franke_53_Work_as_United_SPD_desc: "Le SPD est un parti très diversifié, et sa véritable force réside dans son unité. En collaborant étroitement avec Erich Ollenhauer et l'aile gauche traditionnelle du parti, nous pouvons présenter un front uni. Cette voie privilégie les principes sociaux-démocrates, la solidarité et les principes fondamentaux de la longue histoire de notre parti plutôt que le compromis avec l'opposition."
 WGR_Franke_53_Work_With_CDU_FDP_desc: "Pour gouverner efficacement dans un pays divisé, il faut faire preuve de pragmatisme, et non d'idéologie. Afin de garantir une majorité stable pour mener à bien des réformes cruciales, notamment en matière de politique économique et étrangère, nous devons rechercher la coopération avec la CDU et le FDP. Cette voie du compromis risque certes d'aliéner l'aile gauche de notre parti, mais elle pourrait forger un puissant consensus centriste pour l'Allemagne."
 WGR_Franke_53_Push_for_School_Secularization_desc: "Pendant trop longtemps, l'Église a exercé une influence excessive sur l'enseignement public. Dans un État moderne et démocratique, les écoles devraient être exemptes de tout dogme religieux. Nous ferons pression pour l'adoption d'une législation garantissant la laïcité totale de notre système scolaire public, pierre angulaire d'une société progressiste."
 WGR_Franke_53_Empower_Young_Socialists_desc: "L'avenir de notre parti repose sur sa jeunesse. En donnant plus de pouvoir aux « Jusos » (Jeunes socialistes) et en leur accordant une plus grande voix dans les décisions du parti, nous pouvons garantir qu'une nouvelle génération de sociaux-démocrates passionnés et attachés à leurs principes sera prête à mener la nation vers l'avenir."
 WGR_Franke_53_Nationalize_Water_Power_Utilities_desc: "L'accès à l'eau et à l'électricité est un droit fondamental, et non une marchandise à exploiter à des fins lucratives privées. L'État prendra des mesures pour nationaliser tous les principaux services publics d'approvisionnement en eau et en électricité, afin de garantir qu'ils soient gérés dans l'intérêt public et que ces ressources essentielles restent entre les mains du peuple."
 WGR_Franke_53_Advance_Market_Economy_Interests_desc: "Afin d'obtenir la coopération de l'opposition et de libérer le potentiel économique de l'Allemagne, notre gouvernement mettra en œuvre des politiques qui soutiennent les principes de l'économie sociale de marché. Cela signifie promouvoir la libre entreprise, une monnaie stable et un environnement favorable aux entreprises afin de stimuler la croissance."
 WGR_Franke_53_Agree_on_Reparation_Payments_to_Jewish_Refugees_desc: "L'Allemagne porte une responsabilité historique qui ne peut être ignorée. Dans un geste de réconciliation morale et de coopération avec l'opposition, notre gouvernement acceptera officiellement l'accord de Luxembourg et commencera à verser des réparations aux réfugiés juifs et à l'État d'Israël pour les horreurs du passé."
 WGR_Franke_53_Appoint_Several_CDU_Ministers_desc: "La coopération doit aller au-delà des simples paroles. Afin de mettre en place un véritable gouvernement d'union nationale, plusieurs postes ministériels clés seront proposés à des membres éminents de la CDU. Cela permettra de consolider notre nouvelle relation de travail et de garantir que leurs intérêts soient représentés au plus haut niveau du gouvernement."
 WGR_Franke_53_Debate_the_Role_of_BGS_desc: "La police fédérale des frontières, notre seule force armée nationale, se trouve à la croisée des chemins. S'agit-il simplement d'une force de police chargée de la surveillance des frontières ou est-elle le germe d'une future armée allemande ? Le Bundestag doit mener un débat sérieux sur le rôle, la taille et la mission futurs de la BGS."
 WGR_Franke_53_Expand_BGS_Into_Fighting_Force_desc: "Face à la menace soviétique, une simple patrouille frontalière ne suffit pas. Le BGS doit être renforcé et rééquipé afin de devenir une force de combat mobile crédible, capable de défendre notre territoire et d'agir comme un véritable précurseur d'une armée nationale."
 WGR_Franke_53_Scale_Back_BGS_desc: "Le rôle du BGS est de surveiller nos frontières, pas de devenir une armée clandestine. Nous résisterons à la pression en faveur du réarmement et réduirons les capacités militaires du BGS, réaffirmant ainsi son statut d'organisation défensive et axée sur l'application de la loi."
 WGR_Franke_53_Integrate_Customs_Service_into_BGS_desc: "Afin d'améliorer l'efficacité et de rationaliser le contrôle aux frontières, le service douanier distinct (Zollgrenzdienst) sera pleinement intégré dans la structure de commandement de la garde-frontière fédérale, créant ainsi une organisation unique et unifiée responsable de toutes les questions frontalières."
 WGR_Franke_53_Professionalize_Border_Troops_desc: "Une force frontalière moderne nécessite plus que de la main-d'œuvre ; elle nécessite également de l'expertise. Nous investirons dans des programmes de formation avancés et dans un équipement plus performant afin de professionnaliser nos troupes frontalières, en mettant l'accent sur leur mission principale de surveillance et de sécurité."
 WGR_Franke_53_Decrease_Funding_to_Border_Guard_desc: "Nos priorités résident dans la reconstruction sociale et économique, et non dans les dépenses militaires. Le financement du BGS sera réduit, et les ressources seront réaffectées à des besoins nationaux plus urgents. La défense de l'Allemagne relève de la compétence des puissances alliées."
 WGR_Franke_53_Remain_With_Only_Border_Defense_Troops_desc: "Notre engagement est axé sur la défense, et non sur l'attaque. La BGS sera structurée uniquement dans le but de défendre notre frontière immédiate, sans capacité ni doctrine pour mener des opérations au-delà de ce cadre limité. Cela rassurera nos voisins et le monde entier quant à nos intentions pacifiques."
 WGR_Franke_53_Authorize_More_BGS_Units_desc: "La longue frontière avec l'Est est dangereusement poreuse. Pour la sécuriser correctement, nous devons autoriser la création de plusieurs nouvelles unités du BGS, augmenter nos effectifs et nous assurer que nous pouvons patrouiller l'intégralité du rideau de fer"
 WGR_Franke_53_Purchase_Armored_Vehicles_and_Light_Aircraft_desc: "Pour donner à la BGS une chance de lutter contre toute incursion potentielle, elle doit être mécanisée. Nous autoriserons l'achat de véhicules blindés, de moyens de transport et d'avions de reconnaissance légers modernes afin d'améliorer la mobilité et la puissance de feu de nos unités frontalières."
 WGR_Franke_53_Expand_the_Inner_German_Border_desc: "La division de l'Allemagne est une réalité tragique, et la frontière doit être sécurisée. Nous allons étendre et renforcer les infrastructures le long de la frontière intra-allemande, non pas pour la rendre permanente, mais pour contrôler les passages illégaux et protéger notre État contre l'infiltration venue de l'Est."
 WGR_Franke_53_Prepare_For_a_Transition_to_the_Bundeswehr_desc: "Le temps des faux-semblants est révolu. La BGS sera désormais officiellement désignée comme le cadre d'une future armée nationale, la Bundeswehr. Sa structure de commandement, sa formation et sa doctrine seront réformées afin de permettre une transition en douceur vers une force militaire à part entière."
 WGR_Franke_53_Introduce_Franke_Doctrine_of_FP_desc: "Le chancelier Franke exposera une nouvelle vision de la politique étrangère allemande. La « doctrine Franke » sera fondée sur le pragmatisme, un engagement ferme envers l'alliance occidentale et la poursuite inlassable des intérêts allemands par la négociation et la diplomatie, et non par la confrontation."
 WGR_Franke_53_Commit_to_Eventual_German_Reunification_desc: "Même si le chemin est incertain et les obstacles immenses, aucun gouvernement allemand ne peut renoncer à l'objectif d'une nation unifiée. Nous réaffirmerons officiellement notre engagement indéfectible en faveur d'une réunification pacifique et définitive de l'Allemagne dans la liberté."
 WGR_Franke_53_Open_Inner_German_Border_desc: "La division de notre peuple est une plaie ouverte. Dans un geste humanitaire et dans le but d'apaiser les tensions, nous allons assouplir unilatéralement les restrictions de circulation à la frontière interallemande, afin de permettre aux familles de se réunir et de favoriser les contacts entre nos peuples."
 WGR_Franke_53_Condemn_Soviet_Invasion_of_Hungary_desc: "La répression brutale du soulèvement hongrois par les chars soviétiques est un outrage à la liberté. Le gouvernement allemand condamnera fermement et sans équivoque cet acte de tyrannie, en solidarité avec le peuple hongrois."
 WGR_Franke_53_Debate_Response_to_Suez_desc: "La crise du canal de Suez a divisé nos alliés occidentaux. L'Allemagne doit débattre avec prudence de sa réponse, en gérant les retombées diplomatiques complexes tout en affirmant ses propres intérêts en tant que nation commerçante souveraine."
 WGR_Franke_53_Continue_Slow_Western_Integration_desc: "Notre avenir réside dans l'Occident, mais nous ne nous précipiterons pas. L'Allemagne poursuivra sa politique d'intégration lente et réfléchie dans les institutions occidentales telles que l'OTAN et la CEE, en veillant à ce que chaque mesure soit prise en tenant pleinement compte de nos intérêts nationaux."
 WGR_Franke_53_Allow_Limited_NATO_Exercises_in_Germany_desc: "En signe de notre engagement envers l'alliance occidentale, nous autoriserons des exercices militaires limités et à petite échelle de l'OTAN sur le sol allemand. Cela démontre notre fiabilité en tant que partenaire sans provoquer inutilement l'Union soviétique."
 WGR_Franke_53_Conclude_Security_Agreements_with_US_UK_France_desc: "Afin d'officialiser notre relation en matière de défense et d'assurer la sécurité de notre nation, notre gouvernement négociera et conclura des accords de sécurité globaux avec les trois principales puissances alliées : les États-Unis, le Royaume-Uni et la France."
 WGR_Franke_53_Proclaim_Germanys_Position_on_World_Stage_desc: "L'Allemagne n'est plus un simple objet de la politique internationale, mais un acteur souverain. La chancelière prononcera un discours important, dans lequel elle proclamera notre nouvelle position confiante sur la scène mondiale et exposera nos ambitions en tant que puissance européenne majeure."
 WGR_Franke_53_Announce_Godesburg_Program_desc: "Le moment est venu pour le SPD de se moderniser. Lors d'une conférence à Bad Godesberg, la direction du parti annoncera son intention de rédiger un nouveau programme politique qui redéfinira nos valeurs fondamentales pour une nouvelle ère."
 WGR_Franke_53_Appoint_Schiller_as_Minister_of_Economics_desc: "Pour superviser notre nouvelle vision économique, nous nommerons le brillant économiste Karl Schiller au poste de ministre de l'Économie. Son expertise en économie keynésienne et en politiques orientées vers le marché sera au cœur du programme de notre gouvernement."
 WGR_Franke_53_Transform_SPD_Into_Peoples_Party_desc: "Le SPD doit dépasser ses origines de parti exclusivement dédié à la classe ouvrière industrielle. Grâce au programme de Godesberg, nous le transformerons en un véritable « Volkspartei », un grand parti capable de rallier le soutien de la classe moyenne, des intellectuels et de tous les Allemands qui croient en la liberté et la justice sociale."
 WGR_Franke_53_Undergo_Purge_of_Leftists_in_Party_desc: "Pour que le programme de Godesberg soit couronné de succès, le parti doit être uni derrière sa nouvelle orientation pragmatique. Ceux qui, à l'extrême gauche, s'accrochent à un dogme marxiste dépassé et résistent au changement seront mis politiquement à l'écart et, si nécessaire, écartés des postes d'influence."
 WGR_Franke_53_Investigate_Subversives_Within_SPD_desc: "Il existe au sein de notre propre parti des éléments qui pourraient avoir des sympathies ou des liens avec des puissances étrangères. Nous autoriserons une enquête interne discrète afin d'identifier toute personne subversive qui pourrait chercher à nuire au SPD de l'intérieur."
 WGR_Franke_53_Surveil_Former_KPD_SED_Members_desc: "Bien que le Parti communiste soit interdit, ses anciens membres continuent de représenter une menace potentielle pour notre démocratie. Nos services de sécurité seront chargés de surveiller les activités des anciens membres connus du KPD et du SED est-allemand."
 WGR_Franke_53_Denounce_All_Forms_of_Marxism_and_Communism_desc: "En tant que point culminant de la transformation de notre parti, le programme de Godesberg comprendra une dénonciation explicite et totale de toutes les formes de marxisme et de communisme, séparant clairement la social-démocratie des idéologies totalitaires de l'Est."
 WGR_Franke_53_Present_Massive_Social_Reforms_desc: "Une économie forte n'a aucun sens si elle ne sert pas les intérêts de la population. Notre gouvernement présentera un ensemble de réformes sociales de grande envergure visant à renforcer le filet de sécurité sociale, à améliorer le niveau de vie et à créer une société plus juste et plus équitable."
 WGR_Franke_53_Divorce_SPD_Socdem_from_Marxism_desc: "Le langage de la lutte des classes est une relique du passé. Notre nouveau programme dissociera explicitement la politique du SPD de la théorie marxiste, pour ancrer nos politiques dans le socialisme éthique, l'humanisme et les principes d'une économie sociale de marché."
 WGR_Franke_53_Present_Preliminary_Federal_National_Insurance_desc: "Afin de protéger nos citoyens contre les difficultés liées à la maladie et au chômage, nous présenterons le cadre d'un système fédéral préliminaire d'assurance nationale, jetant ainsi les bases d'un État providence complet."
 WGR_Franke_53_Allow_Unions_Representation_In_National_Organization_desc: "Les syndicats sont un partenaire essentiel de notre démocratie sociale. Nous soutiendrons la création d'une organisation nationale qui donnera aux syndicats une représentation officielle dans l'élaboration des politiques économiques, afin de garantir que la voix des travailleurs soit entendue."
 WGR_Franke_53_Propose_Keynesian_Economic_System_desc: "Sous la direction du ministre Schiller, nous proposerons officiellement le passage à un système économique keynésien. Grâce à des dépenses publiques ciblées et à une gestion globale de la demande, nous pourrons garantir une croissance stable, le plein emploi et une prospérité durable."
 WGR_Franke_53_Revamp_German_Medical_and_Hospital_Systems_desc: "La santé de notre nation est primordiale. Nous allons entreprendre une refonte complète de nos systèmes médicaux et hospitaliers, en investissant dans des installations modernes, en améliorant la formation des médecins et des infirmières, et en garantissant l'accès à des soins de santé de qualité pour tous les citoyens."
 WGR_Franke_53_Continue_Industrialization_desc: "Il ne faut pas laisser le miracle économique allemand ralentir. Notre gouvernement continuera à promouvoir une industrialisation rapide, en investissant dans l'industrie lourde, la fabrication et les nouvelles technologies afin de stimuler la croissance de notre nation."
 WGR_Franke_53_Expand_Rail_Systems_and_Logistics_Hubs_desc: "Pour soutenir notre industrie en plein essor, nous devons disposer d'infrastructures de classe mondiale. Un programme d'investissement massif sera lancé pour étendre notre réseau ferroviaire national et développer des centres logistiques modernes, afin d'assurer le transport fluide des marchandises à travers le pays."
 WGR_Franke_53_Advertise_Bavarian_Beer_Industry_desc: "Notre culture est l'un de nos meilleurs produits d'exportation ! Une campagne spéciale soutenue par le gouvernement sera lancée pour promouvoir l'industrie brassicole bavaroise sur la scène internationale, stimuler le tourisme et le commerce, et peut-être améliorer les relations diplomatiques, une chope après l'autre."
 WGR_Franke_53_Nationalize_VW_and_Build_More_Facilities_desc: "Volkswagen est un symbole de la puissance industrielle allemande et appartient au peuple. Nous allons nationaliser entièrement l'entreprise et investir massivement dans la construction de nouvelles installations de production afin de répondre à la demande mondiale croissante pour nos automobiles."
 WGR_Franke_53_Develop_Oil_Refining_Facilities_desc: "Afin de réduire notre dépendance vis-à-vis des carburants raffinés importés, l'Allemagne doit développer ses propres capacités de raffinage. Nous apporterons le soutien de l'État à la construction de raffineries de pétrole modernes dans nos principaux ports, une étape cruciale pour notre sécurité économique."
 WGR_Franke_53_Allow_American_Investment_in_Germany_desc: "La reconstruction de notre économie nécessite des capitaux, et nos partenaires américains sont prêts à les fournir. Nous créerons un cadre juridique favorable afin d'encourager et de protéger les investissements américains dans les industries allemandes, accélérant ainsi notre reprise économique."
 WGR_Franke_53_Prepare_For_the_1957_Federal_Election_desc: "Notre mandat touche à sa fin, et le peuple rendra bientôt son verdict sur notre gouvernement. Nous devons dès à présent commencer à préparer les élections fédérales de 1957, mobiliser notre parti et élaborer un message qui nous assurera quatre années supplémentaires au pouvoir."
 WGR_Franke_53_Declare_Berlin_a_Land_desc: "Le statut juridique ambigu de Berlin-Ouest, ville allemande dans l'esprit mais occupée au regard de la loi, ne peut perdurer. Notre gouvernement prendra une mesure décisive en déclarant officiellement Berlin-Ouest État fédéral (Land) à part entière et égalitaire de la République fédérale, conformément à l'esprit de notre Loi fondamentale. Cet acte affirme la souveraineté allemande sur les statuts alliés et donne au peuple berlinois la voix démocratique qui lui revient au Bundestag."
 WGR_Franke_53_Sign_the_Saar_Treaty_desc: "Le statut non résolu de la Sarre reste un obstacle majeur aux relations franco-allemandes et à l'unité européenne. Pour sortir de l'impasse, notre gouvernement acceptera de signer le traité de la Sarre. Cela signifie certes accepter un statut « européen » spécial pour la région au lieu de son retour immédiat, mais c'est un compromis nécessaire pour garantir la coopération française et faire avancer la cause d'une Europe unie."
 WGR_Franke_57_A_Second_Franke_Government_desc: "Le peuple s'est exprimé. Les élections fédérales de 1957 ont réélu Egon Franke à la chancellerie pour un second mandat. Fort d'un mandat renouvelé, son gouvernement est prêt à prendre des décisions cruciales qui façonneront l'armée, l'économie et la place de l'Allemagne dans le monde pour les décennies à venir."
 WGR_Franke_57_Increase_Portions_in_Bundestag_Cafeteria_desc: "Un politicien bien nourri est un politicien productif. Pour des raisons d'importance nationale et de moral parlementaire, le chancelier a ordonné une révision de la cafétéria du Bundestag. Les portions seront augmentées, afin de garantir que nos représentants aient la force nécessaire pour participer à des débats longs et ardu"
 WGR_Franke_57_Separate_from_SPD_Leftist_Ideals_desc: "Le temps des divisions internes est révolu. Nous allons regrouper les ailes pragmatiques et centristes du parti au sein d'un « bloc social-démocrate uni ». Cette initiative mettra officiellement à l'écart la gauche idéologique, garantissant ainsi que le SPD puisse gouverner d'une seule voix moderne qui parle au nom de tous les Allemands, et non seulement d'une minorité radicale."
 WGR_Franke_57_Form_United_Bloc_CDU_desc: "Pour relever les grands défis de notre époque, une majorité simple ne suffit pas. Nous tendrons la main à la CDU pour former une grande coalition entre les deux grandes forces politiques allemandes. Ce gouvernement d'union nationale apportera la stabilité nécessaire à la mise en œuvre de réformes fondamentales."
 WGR_Franke_57_Remove_Ollenhauer_from_Govt_desc: "Erich Ollenhauer et ses partisans de gauche représentent le passé de notre parti, pas son avenir. Afin de garantir que le gouvernement puisse mener à bien son programme pragmatique sans sabotage interne, Ollenhauer et ses principaux alliés seront démis de toutes leurs fonctions au sein du cabinet et des postes clés du gouvernement."
 WGR_Franke_57_Debate_Definition_of_Socialism_desc: "Que signifie être un parti socialiste à l'ère moderne ? Le SPD s'engagera dans un débat fondamental afin de redéfinir sa relation avec le socialisme, s'éloignant du dogme marxiste dépassé pour se tourner vers une interprétation moderne, éthique et démocratique."
 WGR_Franke_57_Debate_Religion_in_Public_Schools_desc: "Le rôle de l'Église dans nos écoles reste un sujet controversé. Les partis de la coalition débattront une nouvelle fois de cette question afin de trouver un compromis durable entre les idéaux laïques du SPD et les valeurs chrétiennes de nos partenaires."
 WGR_Franke_57_Debate_Free_Market_Reforms_desc: "Nos partenaires de la CDU et du FDP font pression pour que soient mises en œuvre de nouvelles réformes en faveur du libre marché, notamment la déréglementation et la privatisation. Bien que nous soutenions une économie forte, nous devons débattre de ces propositions avec prudence afin de nous assurer qu'elles ne compromettent pas le filet de sécurité sociale que nous avons mis tant d'efforts à construire."
 WGR_Franke_57_Announce_New_Military_Economic_Programs_desc: "La ligne politique du gouvernement étant désormais définie, nous allons annoncer un plan quinquennal complet. Ce programme ambitieux s'articulera autour de deux piliers fondamentaux : la création d'une Bundeswehr moderne et efficace et la poursuite de l'expansion de notre miracle économique, le « Wirtschaftswunder »."
 WGR_Franke_57_Expand_Bundeswehr_desc: "Une nation souveraine doit être capable de se défendre. Nous autoriserons une expansion majeure de la Bundeswehr, en augmentant sa taille, son budget et ses capacités afin de la transformer en l'une des forces armées les plus redoutables d'Europe."
 WGR_Franke_57_Accept_American_Allied_Military_Aid_desc: "La constitution d'une armée moderne est une entreprise coûteuse. Afin d'accélérer le processus, nous accepterons officiellement l'offre d'aide militaire des États-Unis, qui nous fournira des équipements modernes, une formation et un soutien logistique, renforçant ainsi les liens entre notre nouvelle armée et nos alliés de l'OTAN."
 WGR_Franke_57_Bolster_Domestic_Military_Production_desc: "Nous ne pouvons pas compter sur des fournisseurs étrangers pour assurer notre défense nationale. Les investissements et les contrats publics seront orientés vers les entreprises allemandes afin de renforcer notre production militaire nationale, des armes légères aux véhicules blindés, et d'assurer ainsi notre autosuffisance à long terme."
 WGR_Franke_57_Pass_Conscription_and_Soldiers_Acts_desc: "Une armée professionnelle nécessite une base juridique. Le Bundestag va adopter deux lois historiques : la loi sur la conscription, qui instaure le service militaire obligatoire, et la loi sur les soldats, qui définit les droits et les devoirs du « citoyen en uniforme »."
 WGR_Franke_57_Form_Bundeswehr_Staff_Academy_desc: "Une armée ne vaut que par la qualité de ses officiers. Nous allons créer à Hambourg la « Führungsakademie der Bundeswehr », une académie de commandement et d'état-major dédiée à la formation d'une nouvelle génération de chefs militaires fondée sur les principes démocratiques."
 WGR_Franke_57_Absorb_Border_Guard_Units_desc: "Avec la mise en place de la Bundeswehr, le rôle paramilitaire du Bundesgrenzschutz devient superflu. Les unités et le personnel expérimentés de la garde-frontière seront officiellement intégrés à l'armée, apportant ainsi un précieux renfort en main-d'œuvre qualifiée."
 WGR_Franke_57_Continue_Wirtschaftswunder_desc: "Le miracle économique allemand fait l'envie du monde entier, et nous devons veiller à ce que le moteur de la prospérité continue de tourner à plein régime. La politique gouvernementale visera à maintenir une croissance élevée, un faible taux de chômage et à développer notre base industrielle."
 WGR_Franke_57_Build_Oil_Refineries_Bavaria_desc: "Afin d'alimenter nos industries et de réduire notre dépendance vis-à-vis des produits raffinés étrangers, nous orienterons les investissements publics vers la construction de nouvelles raffineries de pétrole dans les centres industriels de Bavière, garantissant ainsi une partie essentielle de notre chaîne d'approvisionnement énergétique."
 WGR_Franke_57_Construct_Airports_Frankfurt_Hamburg_desc: "Alors que l'Allemagne devient une plaque tournante du commerce mondial, nos infrastructures aériennes doivent suivre le rythme. De grands projets seront lancés pour construire de nouvelles installations aéroportuaires modernes dans les villes clés de Hambourg et Francfort, consolidant ainsi leur statut de portes d'entrée internationales."
 WGR_Franke_57_Expand_Coal_Production_Ruhr_desc: "Le charbon reste le pilier de notre industrie lourde. Nous investirons dans de nouvelles technologies minières et subventionnerons les opérations dans la vallée de la Ruhr afin d'augmenter la production de charbon, garantissant ainsi à nos aciéries et centrales électriques le combustible dont elles ont besoin."
 WGR_Franke_57_Expand_Rail_Network_North_South_desc: "Pour mieux intégrer notre économie nationale, nous devons améliorer notre logistique interne. Un grand projet d'infrastructure sera axé sur l'extension et la modernisation des principales artères ferroviaires reliant les ports du nord aux centres industriels du sud."
 WGR_Franke_57_Found_Leifheit_and_Meister_Verbrauchermarkt_desc: "Le miracle économique ne concerne pas seulement l'industrie lourde, mais aussi l'amélioration de la vie quotidienne. Nous soutiendrons la création d'entreprises innovantes dans le domaine des biens de consommation, telles que Leifheit, et de nouveaux modèles de distribution, tels que Meister Verbrauchermarkt, symboles de notre nouvelle prospérité en matière de consommation."
 WGR_Franke_57_Proclaim_Renewed_Germany_desc: "Une décennie de reconstruction touche à sa fin. L'Allemagne est souveraine, prospère et sûre. Dans un discours important, la chancelière proclamera la naissance d'une Allemagne renouvelée, prête à prendre sa place en tant que leader en Europe et partenaire indéfectible du monde libre."
 WGR_Franke_57_Inaugurate_German_Nuclear_Program_desc: "À l'ère atomique, la souveraineté et la sécurité ultimes dépendent de la maîtrise de l'atome. Dans le plus grand secret, le gouvernement inaugurera un programme nucléaire allemand, officiellement à des fins énergétiques civiles, mais avec tout le potentiel de double usage que cela implique."
 WGR_Franke_57_Begin_Limited_Nuclear_Weapons_Program_desc: "La défense de l'Allemagne ne peut être laissée uniquement aux mains d'autres pays. Une directive top secrète a été émise afin de lancer un programme limité d'armement nucléaire, visant à développer une force de dissuasion nationale modeste mais crédible afin de garantir la survie de notre pays."
 WGR_Franke_57_Request_Atoms_for_Peace_Funding_desc: "Nous demanderons officiellement à participer au programme « Atoms for Peace » (Des atomes pour la paix) du président Eisenhower. Le financement et l'assistance technique américains pour notre programme d'énergie nucléaire civile fourniront une couverture parfaite et une expertise inestimable pour nos ambitions plus sensibles."
 WGR_Franke_57_Host_American_Weapons_Experts_desc: "Dans le cadre de notre programme énergétique civil, nous inviterons des experts de la Commission américaine de l'énergie atomique en Allemagne. Leurs connaissances et leurs compétences en matière de technologie des réacteurs et de physique nucléaire seront précieuses pour nos propres scientifiques."
 WGR_Franke_57_Adopt_French_Nuclear_Doctrine_desc: "Notre force de dissuasion doit être crédible et indépendante. Nous adopterons une doctrine nucléaire similaire à la « force de frappe » française, fondée sur le principe selon lequel même un arsenal nucléaire limité suffit à dissuader une superpuissance beaucoup plus importante de lancer une attaque."
 WGR_Franke_57_Order_Nationwide_Nuclear_Drill_desc: "Si nous devons vivre à l'ère atomique, notre population doit y être préparée. Nous organiserons le premier exercice national de sécurité nucléaire afin de tester nos systèmes d'alerte précoce et notre état de préparation à la défense civile en cas d'éventuel conflit nucléaire."
 WGR_Franke_57_Build_Research_Reactors_Major_Cities_desc: "Afin de faire progresser notre expertise nucléaire, de petits réacteurs de recherche seront construits dans des universités de plusieurs grandes villes allemandes. Ces installations permettront de former une nouvelle génération de physiciens et d'ingénieurs nucléaires, qui constitueront l'épine dorsale de notre programme."
 WGR_Franke_57_Expand_THW_Civil_Defense_desc: "À l'ère des menaces atomiques, la défense civile est primordiale. Le Technisches Hilfswerk (THW) sera considérablement développé et financé, et chargé d'élaborer des plans nationaux pour les secours en cas de catastrophe, la décontamination et la reconstruction d'urgence."
 WGR_Franke_57_Speak_to_World_on_Nuclear_Germany_desc: "Des rumeurs concernant nos ambitions nucléaires ont commencé à circuler, suscitant l'inquiétude de nos alliés et l'indignation de Moscou. La chancelière doit adresser un message soigneusement formulé au monde entier, rassurant nos amis quant à nos intentions pacifiques tout en affirmant notre droit à l'autodéfense."
 WGR_Franke_57_Debate_the_NATO_Question_desc: "Avec le rétablissement de notre souveraineté et la création de la Bundeswehr, le moment est venu de définir nos relations officielles avec l'Organisation du traité de l'Atlantique Nord. Le Bundestag débattra de la question de savoir s'il convient de rester un partenaire ou de devenir un membre à part entière et intégré de l'alliance."
 WGR_Franke_57_Limited_Membership_desc: "Nous chercherons à obtenir une adhésion limitée à l'OTAN, en contribuant à l'alliance politique tout en maintenant la Bundeswehr en dehors du commandement militaire intégré. Cela nous permettra de préserver notre autonomie militaire tout en nous engageant dans la défense collective de l'Occident."
 WGR_Franke_57_Allow_Full_Membership_desc: "Il n'y a pas de sécurité pour l'Allemagne en dehors d'un engagement total envers l'alliance. Nous poursuivrons notre adhésion à part entière à l'OTAN, en intégrant la Bundeswehr dans sa structure de commandement et en nous engageant pleinement dans la défense de l'Europe occidentale."
 WGR_Franke_57_Allow_Limited_Allied_Forces_desc: "L'ère de l'occupation est révolue, mais la présence des forces alliées reste une garantie de sécurité. Nous renégocierons les accords sur le statut des forces, invitant officiellement nos alliés à stationner un nombre limité de troupes sur le sol allemand en tant que partenaires, et non en tant qu'occupants."
 WGR_Franke_57_Maintain_Security_Agreements_desc: "Une intégration totale dans l'OTAN compromettrait notre souveraineté. Nous nous appuierons plutôt sur les accords bilatéraux de sécurité déjà conclus avec les États-Unis, le Royaume-Uni et la France, en maintenant un partenariat étroit sans renoncer au commandement de nos forces."
 WGR_Franke_57_Enter_NATO_Command_Structure_desc: "Si nous voulons être un membre à part entière, nous devons être pleinement intégrés. Des officiers allemands occuperont des postes au sein du SHAPE et d'autres structures de commandement de l'OTAN, ce qui nous permettra d'avoir notre mot à dire dans la planification stratégique de l'alliance et de garantir que nos forces opèrent en parfaite harmonie avec celles de nos alliés."
 WGR_Franke_57_Construct_Infrastructure_and_Defenses_desc: "En tant qu'État en première ligne de la guerre froide, notre territoire doit être défendable. En coordination avec l'OTAN, nous entreprendrons un programme de construction massif visant à bâtir des bases aériennes fortifiées, des fortifications défensives et des infrastructures logistiques afin de soutenir les opérations alliées."
 WGR_Franke_57_Proclaim_Germany_as_Part_of_Europe_desc: "Notre destin est inextricablement lié à celui de nos voisins. Dans un dernier geste symbolique, notre gouvernement proclamera officiellement que la République fédérale est, aujourd'hui et pour toujours, un membre fondateur et engagé de la communauté européenne."
 WGR_Reimann_49_Form_an_Atheist_Only_Civil_Service_desc: "Ceux qui servent l'État doivent être exempts de toute superstition surnaturelle. L'appartenance à une communauté religieuse sera déclarée incompatible avec un poste dans la haute fonction publique. Seuls des athées convaincus peuvent offrir la garantie totale d'une administration loyale et fondée sur des bases scientifiques."
