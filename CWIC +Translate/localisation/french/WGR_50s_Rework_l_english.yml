 WGR_FDP_Prov_Claim_Berlin_As_West_German: "Revendiquer Berlin comme appartenant à l'Allemagne de l'Ouest"
 WGR_Bundeswehr_Speidel_Expand_Bundeswehr_Development_desc:0 "Les premières étapes du réarmement n'étaient qu'un début. Pour garantir une défense souveraine, nous devons élargir notre cadre logistique et infrastructurel, jetant ainsi les bases d'une force de combat moderne."
 WGR_Bundeswehr_Speidel_Merge_BGS_Into_Bundeswehr_desc:0 "Le Bundesgrenzschutz nous a bien servi en tant que force de police paramilitaire, mais face à l'escalade des tensions de la guerre froide, son personnel qualifié et son équipement sont mieux utilisés au sein de la structure de commandement unifiée de la Bundeswehr."
 WGR_Bundeswehr_Speidel_Reinforce_Duty_to_Country_and_Duty_to_Serve_Ideals_desc:0 "Dans une démocratie, un soldat est un « citoyen en uniforme ». En renforçant le concept d'« Innere Führung » et le devoir de servir la nation, nous garantissons un corps d'officiers loyal, discipliné et fondé sur des principes éthiques."
 WGR_Bundeswehr_Speidel_Nationalize_Heckler_and_Koch_desc:0 "Afin de garantir notre approvisionnement en armes légères, l'État doit s'intéresser directement aux installations d'Oberndorf. Sous la supervision nationale, H&K deviendra le principal fabricant des fusils des fantassins allemands."
 WGR_Bundeswehr_Speidel_Purchase_American_Pattons_and_HS30s_desc:0 "La production nationale prend du temps, temps que nous n'avons pas. En achetant les fiables M48 Patton à nos alliés américains et les HS-30 IFV à la Suisse, nous pouvons mécaniser nos divisions immédiatement."
 WGR_Bundeswehr_Speidel_Form_the_Bundesmarine_desc:0 "Les côtes allemandes ne doivent pas être laissées sans défense. La création de la Bundesmarine marque notre retour en mer Baltique et en mer du Nord en tant que puissance navale engagée dans la défense de l'Occident."
 WGR_Bundeswehr_Speidel_Empower_the_Kriegsmarinewerft_Wilhelmshaven_desc:0 "Wilhelmshaven a toujours été le cœur de la puissance navale allemande. En modernisant ses docks, nous créons la capacité nécessaire pour entretenir et réparer les plus grands navires de notre nouvelle flotte."
 WGR_Bundeswehr_Speidel_Form_Luftwaffe_desc:0 "Le ciel allemand constitue notre première ligne de défense. En créant une nouvelle Luftwaffe démocratique, nous reprenons notre souveraineté aérienne et assurons une couverture essentielle à nos forces terrestres."
 WGR_Bundeswehr_Speidel_Receive_US_F84_Thunderstreaks_desc:0 "Grâce au programme d'assistance mutuelle en matière de défense, nous allons recevoir nos premiers avions de chasse à réaction. Le F-84 servira de pilier à nos escadrons de frappe tactique jusqu'à ce que les modèles nationaux soient prêts."
