 Bielefeld_Conference_Explaination_tt: "§RLe résultat de la conférence de Bielefeld déterminera si le statut d'occupation sera levé ou non. En fonction du niveau de[USA.GetFlag][FRA.GetFlag][ENG.GetFlag]§cla confiance de l'OTAN§!, vous pouvez formuler des exigences plus élevées afin d'obtenir de nouvelles concessions de la part des Alliés. Les négociations peuvent être répétées si la conférence échoue, mais le gouvernement ouest-allemand ne pourra pas exiger de concessions plus importantes en conséquence.§!"
 WGRElection.3.da: "Sous la direction du Parti social-démocrate depuis 1949, l’Allemagne de l’Ouest a connu une reprise économique significative, une stabilisation politique et une autodétermination croissante sur la scène mondiale. Alors que les tensions de la guerre froide s’intensifient et que la place du pays en Europe évolue, cette élection définira la prochaine phase du développement de l’Allemagne de l’Ouest.\n\nLe SPD, qui dirige le gouvernement depuis huit ans, se présente comme le parti de la stabilité, de la reconstruction et de la souveraineté. Il a supervisé l’expansion économique, des réformes sociales et des efforts pour faire face au passé nazi, tout en gérant avec prudence les relations à la fois avec les Alliés occidentaux et le bloc de l’Est. L’approche du SPD en matière de politique étrangère et d’intégration économique a varié en interne, mais sa direction reste engagée à garantir l’autodétermination allemande et la sécurité économique.\n\nLa CDU, sous la direction de Konrad Adenauer, se présente comme le principal challenger. La CDU soutient que la reprise et la stabilité de l’Allemagne doivent être encore approfondies par des liens plus forts avec l’Ouest, en plaidant pour une intégration européenne accrue, une coopération étroite avec l’OTAN et une approche de libre marché en matière de politique économique. La campagne d’Adenauer présente la CDU comme le parti capable de renforcer le rôle de l’Allemagne dans l’alliance occidentale tout en préservant les valeurs traditionnelles et en garantissant la sécurité nationale. Le KPD reste interdit à la suite de sa dissolution en 1956, supprimant la représentation communiste du Bundestag.\n\nAlors que l’économie allemande prospère et que les relations internationales évoluent, les électeurs décideront si le SPD doit poursuivre sa direction ou si la CDU prendra les rênes du gouvernement."
 Adenauer49.1011.t: "Paul Löbe inaugure le premier Bundestag"
 Adenauer49.1011.d: "Bien que seulement 17 ans se soient écoulés depuis les dernières élections libres du Reichstag, cela a semblé être une éternité pour la majorité des délégués au sein du Bundeshaus à Bonn. Le président d’âge Paul Löbe du SPD, qui avait été président du Reichstag de 1920 à 1932, a ouvert la première session d’un parlement allemand librement élu depuis 1932, soulignant la nécessité d’une réunification future de l’Allemagne, qui devra constituer un point fixe pour l’unité européenne. La salle plénière a éclaté en applaudissements intenses, avant que cela ne se transforme en violentes disputes à la suite de la dénonciation par Löbe du passé national-socialiste et de la culpabilité qui en découle pour l’Allemagne.\n\nLa victoire de Konrad Adenauer lors de l’élection à la chancellerie n’a pas seulement surpris les sociaux-démocrates, mais aussi les autres partis présents au Bundestag. Désormais, les chrétiens-démocrates doivent se tourner vers des alliés potentiels afin de former une coalition capable de réunir plus de 50 % des mandats nécessaires pour l’adoption des lois ordinaires."
 Adenauer49.1011.a: "Mettons-nous au travail"
 Adenauer49.1111.t: "L'unification du Bade-Wurtemberg"
 Adenauer49.1111.d: "Après l’établissement de l’occupation alliée dans les parties occidentales de l’Allemagne, l’ancienne structure administrative du Reich allemand a été abolie par les Alliés occidentaux, la remplaçant par de nouveaux États fédérés à travers la Trizone. Trois d’entre eux composent les territoires de Bade, de Wurtemberg et de Wurtemberg-Hohenzollern, qui ont désormais ouvert un nouveau champ de bataille politique dans la politique fédérale.\n\nLes sociaux-démocrates soutiennent l’unification de ces trois États en un « Südweststaat » uni. Selon eux, un État unifié serait un partenaire plus fort au sein de la jeune fédération, mieux capable de répondre aux besoins de sa population et de contribuer au Wirtschaftswunder.\n\nOutre la fierté régionale et des positions traditionalistes enracinées dans l’orgueil historique, la CDU soutient le statu quo, en maintenant la région divisée et en préservant ainsi une partie des gouvernements locaux, ce qui fournit en pratique davantage de mandats au Bundesrat, la chambre haute du parlement allemand, dont l’approbation est nécessaire pour divers types de lois. Si les États venaient à être unifiés, le SPD obtiendrait sans aucun doute la majorité politique et mettrait ainsi fin à la domination de la CDU."
 Adenauer49.1111.a: "Écoutez le peuple. L'unification est sa volonté."
 Adenauer49.1111.b: "Déclarer le référendum inconstitutionnel."
 Adenauer49.1211.t: "S'allier aux démocrates libres ?"
 Adenauer49.1211.d: "Renaissant des cendres de la guerre, l'ancien Parti démocratique allemand de gauche libérale et le Parti populaire allemand national-libéral de la Première République se sont réunis dans la ville de Heppenheim afin de surmonter la division traditionnelle du libéralisme allemand et ont formé le nouveau Parti libéral-démocrate. Ayant remporté 12 % des voix et obtenu la première présidence fédérale sous la direction de Theodor Heuss, le FDP serait un partenaire de coalition favorable, partageant essentiellement nos points de vue sur les questions économiques, sociales et nationales allemandes. Cependant, leurs opinions divergent sur la structure d'une économie de marché (privilégiant le libre marché plutôt que l'économie sociale) et sur leur position ferme en matière de laïcité."
 Adenauer49.1211.a: "Bienvenue à bord."
 Adenauer49.1311.t: "Rapprochement avec le parti allemand"
 Adenauer49.1311.d: "Issu des traditions de l'ancien Parti allemand-hanovrien, le Parti allemand (DP) s'est imposé comme une force clairement conservatrice et régionale, principalement implantée dans les zones rurales protestantes de Basse-Saxe. Avec 4 % des voix, ses 17 sièges se sont avérés cruciaux pour la formation de notre coalition bourgeoise. Le DP représente une aile profondément nationale-conservatrice de la politique allemande, qui fait appel aux valeurs traditionnelles et à un fort sentiment d'identité allemande. Son anticommunisme farouche et son soutien au système de libre entreprise s'alignent bien sur nos principes économiques fondamentaux, ce qui en fait un allié naturel contre les projets socialistes du SPD. Cependant, ses sentiments monarchistes déclarés et son orientation fédéraliste forte, presque particulariste, axée sur les droits des États, nécessitent une gestion prudente au sein de la coalition."
 Adenauer49.1311.a: "C'est un plaisir de faire affaire avec vous."
 Adenauer49.1411.t: "À la recherche de discussions avec le SPD ?"
 Adenauer49.1411.d: "Si notre coalition devrait très probablement disposer d'une solide majorité au Bundestag, l'arithmétique politique au Bundesrat représente un défi permanent. Les socialistes, qui dirigent plusieurs gouvernements régionaux clés, exercent une influence considérable à la chambre haute, menaçant de bloquer des lois essentielles. Cela nous oblige à faire un choix stratégique difficile. Devons-nous faire des concessions au SPD pour garantir l'adoption sans heurts de nos lois, en particulier celles qui sont vitales pour la reconstruction économique et notre intégration occidentale ? Cela pourrait être considéré comme une nécessité pragmatique pour éviter un blocage législatif. Cependant, céder à leurs exigences affaiblirait notre mandat politique, compromettrait nos principes d'économie sociale de marché et risquerait de nous faire paraître faibles. Nous devons évaluer soigneusement, au cas par cas, si le prix de leur coopération vaut la peine d'être payé, afin que l'ensemble de notre programme gouvernemental ne devienne pas tributaire des caprices de l'opposition."
 Adenauer49.1411.a: "C'est nécessaire."
 Adenauer49.1411.b: "Je préfère regarder la peinture sécher."
 Adenauer49.101.t: "Le premier congrès du parti CDU"
 Adenauer49.101.d: "Au théâtre Odeon de Goslar, le premier Bundesparteitag de la Christlich Demokratische Union s’est ouvert hier, marquant une étape clé dans la consolidation politique de la jeune République fédérale. Avec l’ouverture solennelle d’Egmont de Beethoven donnant le ton, le chancelier fédéral Konrad Adenauer a prononcé le discours inaugural, exhortant les délégués à rester fermes sur le « chemin vers la liberté ». Il a averti de la menace croissante posée par le totalitarisme soviétique et a souligné la responsabilité de l’Allemagne de se tenir aux côtés de l’Occident pour défendre la démocratie et les valeurs chrétiennes.\n\nLe congrès a officialisé ce qui n’était jusqu’alors qu’une alliance lâche d’associations régionales en un parti fédéral unifié. Bien que la CDU dirige le gouvernement fédéral depuis 1949, il s’agissait de sa première réunion organisationnelle nationale. Adenauer, élu premier président national du parti avec 302 voix, a été rejoint par Jakob Kaiser et Friedrich Holzapfel comme adjoints. Les délégués ont également adopté formellement les statuts du parti et réaffirmé leur engagement envers la démocratie parlementaire, la responsabilité sociale et la coopération européenne.\n\nLa CDU a souligné une rupture claire avec le totalitarisme de l’Est comme avec les éléments révolutionnaires au sein du SPD, tout en affirmant sa propre vision d’une société chrétienne-démocrate. Le plaidoyer du ministre de l’Économie Ludwig Erhard en faveur de la Soziale Marktwirtschaft a reçu un fort soutien, reflétant la confiance croissante du parti dans sa capacité à façonner l’avenir politique et économique de l’Allemagne. Sous la devise Einigkeit und Recht und Freiheit, la CDU s’avance désormais comme une force pleinement constituée dans la vie politique de la république."
 Adenauer49.101.a: "Un toast à l'avenir de l'Allemagne !"
 Adenauer49.102.t: "Assistance à l'Organisation Gehlen"
 Adenauer49.102.d: "L'Organisation Gehlen s'est révélée être un atout essentiel dans la lutte contre l'infiltration communiste. Ses opérations vont de la surveillance des activités de gauche au rapatriement secret de prisonniers de guerre allemands depuis l'Union soviétique. Elle a également contribué à la réinstallation discrète d'anciens nationaux-socialistes, préservant ainsi un savoir-faire précieux pendant cette période de transition. \n\nCompte tenu de son efficacité dans la sauvegarde de la sécurité et de la stabilité nationales, un soutien accru à Reinhard Gehlen et à son organisation est à la fois justifié et nécessaire. Quelles ressources devons-nous privilégier ?"
 Adenauer49.102.a: "Aider à l'espionnage envers les sociaux-démocrates."
 Adenauer49.102.b: "Ramener les prisonniers de guerre allemands chez eux devrait être notre priorité numéro un."
 Adenauer49.102.c: "La réhabilitation d'anciens fonctionnaires de la Gestapo et de l'Abwehr devrait être utile."
 Adenauer49.103.t: "L'Allemagne de l'Ouest demande la libération de nombreux anciens nazis"
 Adenauer49.103.d: "Conformément à la procédure standard des exercices d'occupation alliée, le gouvernement fédéral de la République fédérale d'Allemagne nous a adressé une demande controversée. Il a demandé la réintégration de plusieurs anciens nationaux-socialistes dans la fonction publique. La demande invoque le besoin urgent de personnel expérimenté dans les domaines de l'administration, de la sécurité et de la reconstruction, en particulier dans le contexte des tensions croissantes entre l'Est et l'Ouest. Le gouvernement chrétien-démocrate fait valoir que bon nombre de ces personnes possèdent des connaissances techniques et institutionnelles essentielles au fonctionnement de la bureaucratie allemande. \n\nBien que la Commission comprenne ces préoccupations pratiques, elle doit les mettre en balance avec les principes plus généraux de justice et le processus de dénazification. La réintégration de ces personnes risque non seulement de saper la confiance du public et les fondements moraux, mais aussi de nuire à notre image internationale, en particulier auprès de l'Union soviétique et du bloc de l'Est."
 Adenauer49.103.a: "Nous fermerons les yeux."
 Adenauer49.103.b: "N'ont-ils donc rien appris ?"
 Adenauer49.103.c: "Nous laissons cette décision aux États-Unis."
 Adenauer49.104.t: "Les Alliés acceptent notre demande"
 Adenauer49.104.d: "La Haute Commission alliée a donné son accord de principe à la réintégration limitée d'anciens nationaux-socialistes dans la fonction publique. Tout en maintenant sa surveillance, la Commission reconnaît que la République fédérale a besoin d'administrateurs expérimentés face à des responsabilités croissantes et à des pressions extérieures. \n\nChaque cas devra toutefois faire l'objet d'un examen individuel, et les Alliés ont souligné l'importance de la discrétion morale et de la responsabilité démocratique."
 Adenauer49.104.a: "Gut."
 Adenauer49.105.t: "Les Alliés rejettent notre demande"
 Adenauer49.105.d: "La Haute Commission alliée a rejeté la demande du gouvernement fédéral visant à réintégrer d'anciens nationaux-socialistes dans la fonction publique. La Commission avertit que de telles mesures saperaient la confiance du public et compromettraient l'intégrité du processus de dénazification.\n\nTout en reconnaissant les défis administratifs, les Alliés insistent sur le fait que la reconstruction doit être fondée sur la justice et une rupture nette avec le passé. La porte reste ouverte à de futures discussions, mais pour l'instant, la demande est officiellement rejetée."
 Adenauer49.105.a: "Ce n'est pas terminé."
 Adenauer49.106.t: "La loi d'immunité pénale de [GetYear]"
 Adenauer49.106.d: "À la suite des efforts de dénazification entrepris par les autorités alliées, un nombre important d’Allemands ont été condamnés pour des associations relativement mineures ou des infractions administratives. Beaucoup de ces individus ont été soumis à des peines de prison ou contraints de payer des amendes substantielles souvent disproportionnées par rapport au degré réel de leur implication.\n\nAprès avoir examiné ces pratiques, l’Union chrétienne-démocrate a conclu que ces condamnations étaient, dans de nombreux cas, injustes et qu’elles ont entravé la réintégration des personnes concernées dans la société d’après-guerre. En réponse, la Bürgerliche Koalition a présenté au Bundestag un projet de loi d’amnistie (Straffreiheitsgesetz).\n\nLa législation proposée vise à annuler ces condamnations mineures et à rétablir la situation civile de milliers de citoyens. Ses partisans affirment que cette mesure est essentielle non seulement pour guérir les divisions sociales, mais aussi pour assurer un soutien public plus large et renforcer les fondations de la République fédérale.\n\nAlors que le projet est désormais à l’étude, l’attention se tourne vers les détails et les possibles extensions du Straffreiheitsgesetz, une loi qui pourrait façonner le paysage moral et juridique de l’Allemagne de l’Ouest d’après-guerre."
 Adenauer49.106.a: "Mettons-nous au travail"
 Adenauer49.107.t: "La prolongation de l'amnistie"
 Adenauer49.107.d: "Alors que le Bundestag débat du Straffreiheitsgesetz, un point de discorde majeur est apparu : la portée juridique de l'amnistie. Certains membres de la Bürgerliche Koalition préconisent de limiter la mesure aux infractions passibles d'une peine maximale de six mois ou d'une amende pouvant aller jusqu'à 5 000 marks allemands, soulignant la nécessité de faire preuve de prudence et de préserver la confiance du public.\n\nD'autres, cependant, plaident en faveur d'une inclusion plus large, étendant l'amnistie aux peines allant jusqu'à deux ans et aux amendes allant jusqu'à 10 000 marks allemands. Ils soutiennent qu'un champ d'application plus large est essentiel pour une réintégration significative, en particulier pour ceux qui ont été pris dans les phases les plus punitives de la dénazification précoce."
 Adenauer49.107.a: "Les infractions mineures passibles d'une amende maximale de 5 000 marks ou d'une peine d'emprisonnement maximale de six mois seront annulées."
 Adenauer49.107.b: "La limite sera portée à 10 000 marks et à deux ans d'emprisonnement."
 Adenauer49.108.t: "Le statut des clandestins"
 Adenauer49.108.d: "Alors que les discussions autour de la Straffreiheitsgesetz se poursuivent, la question des « illégaux » – ces individus qui ont falsifié ou dissimulé leur identité pour échapper à leur responsabilité après la guerre – reste politiquement et moralement sensible. Beaucoup d'entre eux ont réintégré la société sous des noms d'emprunt, obtenant souvent un emploi, voire des fonctions officielles, sans jamais avoir été soumis à la dénazification. Certains soutiennent qu'ils devraient désormais être régularisés dans le cadre de l'amnistie, invoquant leur réintégration réussie et la nécessité de tourner une page difficile de l'histoire nationale.\n\nLes opposants mettent en garde contre le risque que la légitimation d'une telle tromperie ne sape l'ordre juridique et la crédibilité de la justice d'après-guerre. Selon eux, pardonner à ceux qui ont délibérément échappé à leurs responsabilités reviendrait à récompenser la malhonnêteté et à trahir ceux qui ont respecté la loi."
 Adenauer49.108.a: "Nous les accueillerons à nouveau au sein de la société."
 Adenauer49.108.b: "Le statu quo prévaudra."
 Adenauer49.109.t: "Cumul des sanctions"
 Adenauer49.109.d: "Une question clé dans le débat sur la Straffreiheitsgesetz concerne les personnes qui ont reçu plusieurs peines mineures - chacune inférieure à six mois ou 5 000 marks, mais qui, ensemble, dépassent ces limites.\nD'un côté, certains soutiennent que chaque infraction devrait être pardonnée séparément, car bon nombre de ces cas découlent d'une dénazification excessive et devraient être effacés afin de favoriser la réintégration.D'autres suggèrent d'ajuster la peine combinée afin de rester dans les limites de l'amnistie, préservant ainsi la proportionnalité juridique sans offrir d'absolution générale."
 Adenauer49.109.a: "Ils seront tous graciés."
 Adenauer49.109.b: "Les sanctions seront ajustées."
 Adenauer49.110.t: "La rédaction est terminée."
 Adenauer49.110.a: "Magnifique."
 Adenauer49.110.b: "Magnifique."
 Adenauer49.110.c: "Magnifique."
 Adenauer49.110.d: "Magnifique."
 Adenauer49.110.e: "Magnifique."
 Adenauer49.110.f: "Magnifique."
 Adenauer49.111.t: "La loi 131 de [GetYear]"
 Adenauer49.111.d: "Après la capitulation de la Wehrmacht et la dissolution du régime national-socialiste, de nombreux anciens fonctionnaires, enseignants, avocats et responsables gouvernementaux ont été purgés de leurs fonctions dans le cadre de la dénazification menée par les Alliés. Si les hauts fonctionnaires sont censés rester hors service dans l'Allemagne d'après-guerre, nous devons à nouveau doter nos universités et nos tribunaux d'un personnel efficace. La réhabilitation est essentielle, mais tout dépendra de son ampleur. Selon l'article 131 de la Loi fondamentale, de telles mesures ne peuvent être prises qu'en proposant une loi fédérale au Bundestag, qui nécessite finalement une majorité absolue."
 Adenauer49.111.a: "Ça va être stressant."
 Adenauer49.112.t: "L'étendue du personnel réintégré"
 Adenauer49.112.d: "Après les premières réunions de la coalition et des commissions, le premier différend porte sur le pourcentage d'anciens employés qui doivent être réintégrés dans les services fédéraux et locaux, tels que les services postaux, les services ferroviaires et les universités. Le SPD préconise 15 %, tandis que la Bürgerliche Koalition exige au moins 20 %. Les positions extrêmes, telles que celles de l'aile droite du Parti allemand, du KPD et du Deutsche Reichspartei, vont encore plus loin et affirment qu'un pourcentage de 35 % serait plus efficace pour l'administration du pays."
 Adenauer49.112.a: "C'est 15%."
 Adenauer49.112.b: "20% semble raisonnable."
 Adenauer49.112.c: "Une couverture de 35% est nécessaire."
 Adenauer49.113.t: "Le sort des anciens membres de la Gestapo"
 Adenauer49.113.d: "Après les premiers débats sur la réintégration administrative, la question controversée suivante à l'ordre du jour de la commission concerne la réintégration éventuelle d'anciens membres de la Gestapo dans la fonction publique. Le SPD et ses partenaires de gauche s'opposent catégoriquement à une telle mesure, arguant que même une tolérance minimale risque de compromettre la crédibilité démocratique de la nouvelle République. La Bürgerliche Koalition, tout en exprimant son inquiétude, suggère que les cas individuels soient examinés sur la base d'une expertise technique et de l'absence d'implication directe dans des crimes politiques. Les voix plus conservatrices, notamment celles du Deutsche Partei et des vestiges de la tradition DNVP, soulignent le besoin urgent de stabilité administrative et plaident en faveur d'une réintégration limitée et conditionnelle, invoquant le manque de personnel qualifié dans l'État. Quant au KPD, il exige des poursuites judiciaires complètes et une interdiction permanente d'emploi dans toute fonction gouvernementale pour tous les membres de la Gestapo."
 Adenauer49.113.a: "Permettez-leur de reprendre leur service."
 Adenauer49.113.b: "En aucun cas."
 Adenauer49.115.t: "La rédaction est terminée."
 Adenauer49.115.a: "Magnifique."
 Adenauer49.115.b: "Magnifique."
 Adenauer49.115.c: "Magnifique."
 Adenauer49.115.d: "Magnifique."
 Adenauer49.115.e: "Magnifique."
 Adenauer49.115.f: "Magnifique."
 Adenauer53.1211.t: "Poursuivre la coopération avec le Deutsche Partei"
 Adenauer53.1211.d: "Le Parti allemand (DP), notre allié indéfectible de Basse-Saxe, revient dans la coalition, bien qu'avec un mandat légèrement réduit de 3,3 % et 15 sièges. Profondément ancré dans une tradition nationale-conservatrice et, dans certains milieux, ouvertement monarchiste, le DP représente un élément plus traditionaliste et particulariste au sein de notre gouvernement. Son anticommunisme inébranlable et son attachement aux principes de l'économie sociale de marché sont incontestables. Cependant, l'importance qu'il accorde aux intérêts agricoles et aux droits des États, héritage de ses origines hanovriennes, peut parfois aller à l'encontre des tendances centralisatrices d'un gouvernement fédéral moderne. Si son influence a légèrement diminué, sa loyauté et son rôle de passerelle vers les électeurs protestants ruraux plus traditionnels restent précieux pour la stabilité de notre coalition."
 Adenauer53.1211.a: "Pour quatre nouvelles années couronnées de succès !"
 Adenauer53.1311.t: "Inclusion du bloc panallemand ?"
 Adenauer53.1311.d: "Issu de la forte montée en puissance de la diplomatie des réfugiés dans le Schleswig-Holstein, le GB/BHE est apparu en 1950 comme un nouveau parti défendant les intérêts des expulsés et s'est rapidement développé pour devenir une force nationale de droite. Avec 5,9 % des voix et 27 sièges au Bundestag en 1953, elle pourrait devenir un partenaire junior clé de notre coalition. Son programme est axé sur l'intégration sociale et politique des Allemands déplacés, un anticommunisme inébranlable et une vision révisionniste nationale-conservatrice du « Heimatrecht im Osten » (droit à la patrie à l'Est), des positions qui font écho aux valeurs traditionnelles et à une politique identitaire forte."
 Adenauer53.1311.a: "Cela semble raisonnable."
 Adenauer53.1411.t: "Que faire avec les démocrates libres ?"
 Adenauer53.1411.d: "Nous pourrions obtenir une majorité de travail avec le Bloc panallemand (BHE) et le Parti allemand (DP) uniquement. Cela promet un gouvernement plus facile à gérer avec des partenaires plus conciliants. Cependant, cette voie est imprudente et risquée. Le BHE est un parti instable, axé sur un seul thème, ce qui en fait une base peu fiable pour un mandat de quatre ans.\nSi le FDP peut être un partenaire difficile, avec des exigences libérales et laïques qui mettront notre patience à rude épreuve, c'est un petit prix à payer. Ce n'est qu'en l'incluant que nous pourrons obtenir la majorité constitutionnelle des deux tiers nécessaire pour mener à bien des projets essentiels sans contestation juridique ou politique."
 Adenauer53.1411.a: "Ensemble pour l'Allemagne."
 Adenauer53.1411.b: "Deux partenaires de coalition suffisent."
 Adenauer53.1511.t: "Accord conjoint avec le SPD"
 Adenauer53.1511.d: "Même si notre coalition devrait à nouveau disposer d'une solide majorité au Bundestag, les socialistes dirigent toujours plusieurs gouvernements régionaux clés et exercent une influence considérable au Bundesrat, menaçant de bloquer des lois essentielles. Allons-nous faire à nouveau des concessions au SPD pour garantir l'adoption sans heurts de nos lois ? Cela pourrait être considéré comme une nécessité pragmatique pour éviter un blocage législatif. Cependant, si nous incluions le FDP dans notre coalition, nous contrôlerions les deux tiers des sièges au Bundestag, ce qui nous permettrait de modifier la Constitution sans l'accord des sociaux-démocrates."
 Adenauer53.1511.a: "Parlons-en."
 Adenauer53.1511.b: "Nous allons passer notre tour."
 Adenauer53.1611.t: "Une période chargée au ministère des Affaires étrangères."
 Adenauer53.1611.d: "Comme tous les autres jours depuis quatre ans, le personnel de la Villa Ingenohl, siège du ministère des Affaires étrangères, travaille sans relâche. L'intégration européenne, la gestion du conflit interallemand, le renforcement de la coopération avec les États-Unis et le retour des prisonniers de guerre allemands disparus étaient les principales promesses politiques de la CDU. Il est maintenant temps de tenir ces promesses. Reprenons notre place sur la scène internationale et rétablissons la souveraineté allemande afin que notre pays soit à nouveau considéré comme un partenaire à part entière parmi les puissances européennes."
 Adenauer53.1611.a: "Bon, le moment est passé. Retour au travail."
 Adenauer53.1711.t: "[GetNewspaperHeader]L'Allemagne de l'Ouest crée la Bundeswehr"
 Adenauer53.1711.d: "La République fédérale d'Allemagne a officiellement créé sa nouvelle armée nationale, la Bundeswehr. Annoncé par le chancelier [WGR.GetLeader] la création de l’armée marque le retour de l’Allemagne comme contributeur souverain à la défense occidentale.\n\nLe ministère allemand de la Défense a souligné qu’il ne s’agit pas d’une continuation de la Wehrmacht, mais d’une nouvelle armée alignée sur les valeurs constitutionnelles. Aujourd’hui, les premiers volontaires ont prêté serment à Andernach, jurant fidélité à la Loi fondamentale plutôt qu’à un quelconque dirigeant.\n\nLe réarmement a suscité un débat public et des manifestations, les critiques craignant une résurgence du militarisme. Cependant, ses partisans soutiennent que l’Allemagne de l’Ouest doit assumer la responsabilité de sa propre défense et contribuer à la sécurité collective de l’Europe dans le contexte des tensions de la guerre froide."
 Adenauer53.1711.a: "Que font-ils ?"
 Adenauer53.1711.b: "Gott mit uns."
 Adenauer53.1711.c: "Une nécessité pour la sécurité européenne."
 Adenauer53.1811.t: "La Cour constitutionnelle fédérale confirme le Lübeck-Urteil."
 Adenauer53.1811.d: "Dans son récent arrêt, la Cour constitutionnelle fédérale a clarifié la question du statut constitutionnel de Lübeck au sein de la République fédérale. La Cour a rejeté l'argument selon lequel Lübeck, autrefois ville libre et hanséatique dotée d'un statut d'État, pouvait redevenir un État indépendant (Land) distinct du Schleswig-Holstein.\n\nCette décision confirme que la Loi fondamentale n'autorise pas les anciens États comme Lübeck à rétablir unilatéralement leur souveraineté. L'intégration de Lübeck au Schleswig-Holstein, telle que prévue par la loi sur le Grand Hambourg de 1937, reste valide au regard du droit constitutionnel. La Cour a souligné que la stabilité et l'intégrité de la structure fédérale étaient essentielles pour la jeune république."
 Adenauer53.1811.a: "Cela ne ferait que perturber l'ordre fédéral."
 Adenauer53.1911.t: "Le retour des Dix Mille."
 Adenauer53.1911.d: "Dans un moment émouvant et historique pour la jeune République fédérale, le retour tant attendu de 10 000 prisonniers de guerre allemands détenus en Union soviétique a commencé. Ces hommes, qui ont enduré des épreuves indicibles dans des camps lointains depuis la fin des hostilités en 1945, foulent enfin à nouveau le sol allemand.\n\nDes foules se sont rassemblées dans les gares à travers l’Allemagne de l’Ouest cette semaine, agitant des drapeaux noir-rouge-or et portant des fleurs à l’arrivée des premiers convois. Des mères, des épouses et des enfants — dont beaucoup avaient longtemps craint le pire — ont serré leurs proches dans des embrassades mêlant larmes et joie.\n\nCes hommes, fatigués mais fiers, apportent avec eux des récits de résilience, de camaraderie et d’héroïsme discret. Alors qu’ils rejoignent une nation qui a beaucoup changé en leur absence, une chose demeure inchangée : l’Allemagne se souvient de ses fils, et aujourd’hui, elle leur souhaite la bienvenue à la maison."
 Adenauer53.1911.a: "Willkommen zurück, Kameraden."
 Adenauer53.125.t: "Déclaration du gouvernement du vice-chancelier Blücher"
 Adenauer53.125.d: "Alors que le chancelier Konrad Adenauer entamait son second mandat, le gouvernement fédéral de la République fédérale d’Allemagne a réaffirmé son orientation vers la consolidation démocratique, la stabilité économique et la coopération européenne. La déclaration, présentée au Bundestag par le vice-chancelier Franz Blücher, a adopté un ton de détermination et de renouveau.\n\nBlücher, représentant du Parti libéral-démocrate et ministre de la Coopération économique, a souligné l’engagement du gouvernement en faveur de la paix, de l’unité nationale et du projet européen. Il a réaffirmé son soutien à la Communauté européenne du charbon et de l’acier, la qualifiant de « pierre angulaire de la réconciliation et étape nécessaire vers l’unification ». Selon lui, l’Allemagne de l’Ouest ne doit pas seulement bénéficier de la coopération, mais aussi contribuer activement à sa réussite.\n\nConcernant la politique intérieure, Blücher a mis en avant la poursuite de l’économie sociale de marché : « Nous encouragerons la libre entreprise, tempérée par la responsabilité sociale. La reprise doit profiter à tous les citoyens. »\n\nAbordant la question de la réunification allemande, il l’a réaffirmée comme un objectif central à atteindre par des moyens pacifiques et démocratiques, dans un cadre européen."
 Adenauer53.125.a: "Nous construisons une démocratie durable, non pas isolée, mais intégrée dans un avenir européen commun."
 Adenauer53.126.t: "Déclaration du gouvernement du vice-chancelier Oberländer"
 Adenauer53.126.d: "Alors que le chancelier Konrad Adenauer entame son second mandat, le nouveau gouvernement de coalition — cette fois sans les libéraux-démocrates — a exposé sa vision pour la République fédérale d’Allemagne. S’exprimant au nom du gouvernement devant le Bundestag, le vice-chancelier Theodor Oberländer du Parti du Bloc pangermaniste a prononcé une déclaration d’intention claire et assurée.\n\nOberländer a souligné l’engagement continu du gouvernement en faveur de la stabilité démocratique, de l’unité nationale et du renforcement de la position de l’Allemagne de l’Ouest en Europe. « Notre voie reste ferme », a-t-il déclaré, « vers une Allemagne ancrée à l’Ouest, sûre de ses valeurs et engagée en faveur de la paix. »\nLe vice-chancelier a réaffirmé son soutien à la Communauté européenne du charbon et de l’acier, la qualifiant de « cadre essentiel pour la paix et la coopération ». Il a salué la CECA non seulement comme une initiative économique, mais aussi comme une base politique pour une future union européenne.\n\nSur le plan intérieur, Oberländer a insisté sur l’importance du développement rural et des valeurs traditionnelles, reflétant la base conservatrice et agraire de son parti. Dans le même temps, il a assuré le public que la croissance économique se poursuivrait selon les principes de l’économie sociale de marché.\n\nLa réunification allemande, a-t-il déclaré, demeure un objectif inébranlable du gouvernement fédéral « à atteindre par des moyens pacifiques, sous une légitimité démocratique et en concertation avec nos partenaires européens »."
 Adenauer53.126.a: "Nous construisons une démocratie durable, non pas isolée, mais intégrée dans un avenir européen commun."
 Adenauer57.1211.t: "Travailler avec l'opposition ?"
 Adenauer57.1211.d: "Après le changement de direction au sein du FDP et son glissement vers le spectre libéral de gauche, le congrès fédéral du FDP a décidé de ne pas chercher à former une nouvelle coalition avec la CDU et de rejoindre plutôt l'opposition aux côtés des sociaux-démocrates. Cette décision aurait pu compromettre sérieusement nos chances de former un gouvernement viable, mais compte tenu du taux de participation électorale, nous n'avons rien à craindre à cet égard. Toutefois, en raison de la configuration du Bundesrat, il serait judicieux de collaborer avec le FDP et le SPD à certains moments, afin de garantir l'adoption de diverses lois."
 Adenauer57.1211.a: "Nous devrions y réfléchir."
 Adenauer57.1211.b: "Non."
 Adenauer57.1311.t: "Encore une fois, une autre coopération DP."
 Adenauer57.1311.d: "Nous revenons sur deux mandats couronnés de succès, marqués par la croissance économique, l'intégration à l'Occident, ainsi que le renforcement de l'Allemagne sur le plan culturel et la lutte contre l'influence communiste. Nous insisterons pour que cette ligne soit maintenue et pour que le parti allemand soit à nouveau inclus dans notre coalition, même si nous sommes en mesure de former un gouvernement composé uniquement de la CDU."
 Adenauer57.1311.a: "Comme d'habitude."
 Schumacher49.1211.t: "À la poursuite des démocrates libres"
 Schumacher49.1211.d: "Après les premières élections au Bundestag, le SPD est confronté à un choix stratégique déterminant : former une coalition avec le FDP pour s'assurer la chancellerie ou rester dans l'opposition. Le débat divise le parti entre pragmatiques et idéologues.\n\nLe noyau idéologique du parti rejette avec véhémence toute alliance. Il considère le FDP comme le représentant d'un système capitaliste hostile au programme socialiste du SPD en matière de planification économique et de nationalisation. Cependant, un gouvernement SPD-FDP est une nécessité politique. Pour l'aile modérée du SPD, l'installation de Kurt Schumacher au poste de chancelier était primordiale pour bloquer un gouvernement conservateur sous Adenauer et prendre la responsabilité de façonner la nouvelle république. Ils y voient une chance de construire une majorité progressiste, même si cela nécessite des compromis politiques."
 Schumacher49.1211.a: "Nous en avons besoin à tout prix."
 Schumacher49.1311.t: "Cette histoire du parti bavarois"
 Schumacher49.1311.d: "Au lendemain des premières élections au Bundestag, le SPD estime qu'il est urgent de former une coalition qui reflète la volonté du peuple, sans s'appuyer sur les extrêmes du KPD communiste ou le conservatisme centralisateur de la CDU.\n\nNous avons décidé de faire appel au parti bavarois, partenaire naturel dans cette entreprise. Les deux partis partagent un engagement en faveur des valeurs démocratiques, un rejet des idéologies autoritaires et un profond respect pour le fédéralisme et l'identité régionale. Contrairement à la CSU, qui continue de s'appuyer sur les anciennes élites et le centralisme, le SPD reconnaît l'importance de la voix unique de la Bavière dans la formation de la nouvelle république.\n\nBien qu'ancrés dans des traditions différentes, les deux partis sont unis par leur souci des citoyens ordinaires et leur désir d'une Allemagne juste, libre et souveraine."
 Schumacher49.1311.a: "Bienvenue à bord."
 Schumacher49.1411.t: "Rejeter la CDU, revenir au Zentrum"
 Schumacher49.1411.d: "Dans le cadre d'un autre effort visant à isoler la CDU, le cercle restreint du parti a pris contact avec de vieux amis. Le Zentrumspartei est l'un des plus anciens partis de l'histoire allemande, ayant été un parti dominant sous le Kaiserreich et la première République. En particulier dans les années 1920 et au début des années 1930, le SPD et le Zentrum ont collaboré pour défendre la démocratie contre l'extrémisme de gauche et de droite. Cet esprit de gouvernance responsable est à nouveau nécessaire en ces temps incertains.\n\nLe CDU cherche à centraliser le pouvoir et à dominer la vie politique sous une seule bannière chrétienne, marginalisant les voix catholiques indépendantes comme celles du Centre. Le KPD, quant à lui, rejette totalement l'ordre démocratique. Le SPD propose une troisième voie : une coalition fondée sur la justice sociale, le fédéralisme et le pluralisme."
 Schumacher49.1411.a: "Comme au bon vieux temps."
 Schumacher49.1511.t: "La question du KPD"
 Schumacher49.1511.d: "Bien que les deux partis revendiquent leurs racines dans le mouvement ouvrier, le KPD a depuis longtemps abandonné les principes du socialisme démocratique. Depuis les années 1920, il a toujours privilégié la loyauté idéologique envers Moscou plutôt que celle envers le peuple allemand. Ses actions dans la zone occupée par les Soviétiques ont prouvé sans l'ombre d'un doute que le KPD n'est pas une force démocratique, mais un instrument de l'autoritarisme.\n\nLe SPD n'oubliera pas le rôle joué par le KPD pendant les dernières années de la République de Weimar, lorsqu'il a refusé de s'unir aux forces démocratiques contre la montée du fascisme, qualifiant les sociaux-démocrates de « sociaux-fascistes » plutôt que d'alliés. Cette division tragique a ouvert la voie à la dictature, une erreur que le SPD ne permettra pas de répéter."
 Schumacher49.1511.a: "Sortez !"
 Schumacher49.1611.t: "Poursuivre la tradition de Weimar"
 Schumacher49.1611.d: "En 1949, à la suite des premières élections au Bundestag de la République fédérale, le SPD, le FDP et le Parti du centre (Zentrumspartei) formèrent une coalition gouvernementale, souvent appelée la nouvelle coalition de Weimar. \n\nRenouant avec l'esprit de coopération qui les animait sous la République de Weimar, les trois partis s'unirent pour empêcher la domination de la CDU et exclure du pouvoir le KPD, aligné sur l'Union soviétique. Malgré leurs différences idéologiques, ils partagent un engagement en faveur de la démocratie parlementaire, des libertés civiles, du fédéralisme et de la responsabilité sociale.\n\nLa coalition vise à reconstruire l'Allemagne sur des bases démocratiques, à promouvoir la reprise économique et à protéger les libertés individuelles. Elle représente un rejet clair des deux extrêmes autoritaires et un signal indiquant que la nouvelle République ne répétera pas les erreurs du passé."
 Schumacher49.1611.a: "Ensemble pour la démocratie."
 Schumacher49.1711.t: "Le statut de Berlin-Ouest"
 Schumacher49.1711.d: "En raison du statut d'occupation du pays après 1945, Berlin a subi le même sort, étant divisée en quatre secteurs, les secteurs français, anglais et américain constituant la moitié occidentale de la ville, qui fait de facto partie de la République fédérale. Cependant, en raison de sa proximité avec Berlin-Est, la Haute Commission alliée n'accorde pas à l'État fédéral de Berlin son statut constitutionnel complet, empêchant ainsi les citoyens d'élire leurs candidats au Bundestag, en violation de plusieurs articles de la loi fédérale. Cette situation ne peut plus durer. Le statut d'occupation doit être révoqué."
 Schumacher49.1711.a: "Berlin est un Land, tout comme le reste de la République."
 Schumacher49.1811.t: "L'Allemagne de l'Ouest revendique la propriété légale de Berlin-Ouest"
 Schumacher49.1811.d: "Le gouvernement ouest-allemand nous a contactés au sujet du statut juridique de Berlin-Ouest. Il estime que le statut d'occupation actuel viole la Loi fondamentale, privant la population locale de son droit d'élire ses représentants au Bundestag. Si les articles 1, 2 et 3 de la Constitution de Berlin définissent Berlin comme un Land de la République, ceux-ci ne peuvent être mis en pratique qu'une fois la question de Berlin entièrement résolue en coopération avec l'Union soviétique. Jusqu'à ce moment-là, Berlin est soumis à un règlement spécial des Alliés. Modifier le statut juridique pour le rendre plus permanent ne ferait qu'aggraver la division de l'Allemagne et antagoniser davantage l'Union soviétique et l'Allemagne de l'Est."
 Schumacher49.1811.a: "Vous avez perdu la guerre, c'est nous qui fixons les règles."
 Schumacher49.1811.c: "Nous laissons cette décision à Washington."
 Schumacher49.1911.t: "Berlin devient un Land"
 Schumacher49.1911.d: "À la suite de négociations difficiles entre l'administration Schumacher et la Haute Commission alliée, les Alliés ont finalement cédé et promis au Land de Berlin de modifier l'article 87, permettant ainsi à la région du Grand Berlin de relever de la juridiction de la Loi fondamentale, y compris la libre élection des mandats au Bundestag par la population locale. Si certaines autorités alliées doivent rester à Berlin-Ouest en raison de diverses craintes liées à la menace soviétique, Berlin jouit désormais du même statut politique que les autres États fédéraux allemands."
 Schumacher49.1911.a: "Comme il se doit."
 Schumacher49.2011.t: "Berlin reste sous occupation alliée."
 Schumacher49.2011.d: "À la suite de négociations difficiles entre l'administration Schumacher et la Haute Commission alliée, les Alliés ont rejeté notre demande de transformation juridique de Berlin en un autre État fédéral. Compte tenu de la menace que représente l'Union soviétique, les troupes alliées doivent rester à Berlin à tout prix, ce qui signifie que diverses réglementations spéciales doivent être maintenues pour assurer la sécurité de l'Occident. Ils ont également fait valoir qu'une telle décision permanente violerait le statut d'occupation et inciterait l'Union soviétique à prendre de multiples mesures qui pourraient également violer ce statut."
 Schumacher49.2011.a: "Nous reviendrons sur ce sujet ultérieurement."
 Schumacher49.2111.t: "L'aile droite du SPD"
 Schumacher49.2111.d: "L'accident vasculaire cérébral du chancelier Schumacher place son gouvernement entre les mains du vice-chancelier Egon Franke, un dirigeant des Kanalarbeiter, l'aile puissante et pragmatique du SPD.\n\nConnue sous le nom de « travailleurs du canal », cette faction excelle dans le travail politique invisible et pratique : elle impose la discipline du parti et conclut des accords plutôt que de se concentrer sur une idéologie rigide. Son ascension marque une rupture nette avec la politique de principes inflexibles de Schumacher.\n\nAlors que Schumacher était partisan de la confrontation, les Kanalarbeiter sont des négociateurs, considérés comme plus disposés à faire des compromis avec les Alliés occidentaux. La direction provisoire de Franke annonce donc un éventuel changement de cap du gouvernement, qui passerait d'une confrontation fondée sur des principes à une négociation pragmatique, une évolution qui pourrait redessiner la politique ouest-allemande."
 Schumacher49.2111.a: "Évolution plutôt que révolution."
 Schumacher49.2211.t: "[GetNewspaperHeader]L'Allemagne de l'Ouest signe le Deutschlandvertrag"
 Schumacher49.2211.d: "Une étape importante vers la pleine souveraineté de l'Allemagne de l'Ouest a été franchie avec la signature du Deutschlandvertrag entre la République fédérale d'Allemagne et les Alliés occidentaux. Ce traité réduit considérablement le contrôle des Alliés, accordant à l'Allemagne de l'Ouest une plus grande indépendance politique tout en la maintenant fermement intégrée dans la structure de défense occidentale. Malgré les politiques hésitantes du SPD à l'égard de l'intégration occidentale, cet accord ouvre également la voie à la création de nouvelles forces armées par le pays, marquant un possible retour en tant que puissance militaire sous stricte surveillance internationale. Chancelier [WGR.GetLeader] a salué ce traité comme un moment décisif dans le redressement de l'Allemagne après la guerre, garantissant son rôle d'allié clé contre l'expansion soviétique. Si certains en Allemagne restent prudents quant au réarmement, le traité est largement considéré comme une étape importante dans la réintégration du pays dans la communauté occidentale."
 Schumacher49.2211.a: "Ils méritent leur souveraineté."
 Schumacher49.2211.b: "L'impérialisme occidental sur papier. Ironique."
 Schumacher49.2211.c: "Ensemble, comme des égaux !"
 Schumacher49.2311.t: "Le retour de la souveraineté allemande"
 Schumacher49.2311.d: "Un consensus se dégage au sein de la Haute Commission alliée selon lequel le maintien de l'occupation de l'Allemagne est stratégiquement intenable. Dans le contexte de la guerre froide, une Allemagne de l'Ouest souveraine est considérée comme un partenaire plus efficace qu'un territoire subordonné. Les conventions en cours visent donc à mettre fin au statut d'occupation. L'objectif est de rétablir la quasi-totalité de la souveraineté de la République fédérale, en l'ancrant officiellement dans la communauté occidentale en tant qu'alliée volontaire et cruciale pour la défense de l'Europe."
 Schumacher49.2311.a: "C'est pour le mieux."
 Schumacher49.2411.t: "Une lettre de Francfort"
 Schumacher49.2411.d: "À la suite du décès de Kurt Schumacher, les sociaux-démocrates se sont enlisés dans une lutte de pouvoir au sein du paysage politique ouest-allemand. Divisés entre l'aile droite du SPD, dirigée par Egon Franke, qui aspire à l'intégration à l'Ouest ainsi qu'à une coopération avec la CDU, et l'aile gauche, dirigée par Erich Ollenhauer, qui met l'accent sur la non-alignement de l'Allemagne de l'Ouest dans le paysage géopolitique et sur une politique axée sur les réformes sociales et le fédéralisme.\n\nPlus tôt ce matin, nous avons reçu une lettre du chancelier Egon Franke, contenant divers éléments qui indiquent la volonté du gouvernement ouest-allemand d’entamer des discussions sur des questions cruciales concernant l’Allemagne, telles que le transit, la citoyenneté, la représentation et d’éventuels efforts de réunification. Il n’est pas certain de pouvoir se fier à cette lettre, mais il convient de noter qu’elle pourrait constituer une petite lueur d’espoir au sein de l’épais nuage que représente la division allemande. Nous devrions garder cela à l’esprit."
 Schumacher49.2411.a: "Une surprise inattendue, mais bienvenue."
 Schumacher49.111.t: "Lutte de pouvoir au sein du SPD : Egon Franke contre Erich Ollenhauer"
 Schumacher49.111.d: "Avec Kurt Schumacher à la chancellerie, une lutte de pouvoir discrète mais intense s’est engagée au sein du SPD entre Egon Franke et Erich Ollenhauer, qui cherchaient tous deux à se positionner pour gagner en influence, sachant que l’état de santé de Schumacher finirait par le mettre sur la touche.\n\nFranke, représentant l’aile droite du SPD, prônait un resserrement des liens avec les Alliés occidentaux, des politiques économiques pragmatiques et l’intégration à l’OTAN, convaincu que le rapprochement avec l’Occident était essentiel à la stabilité de l’Allemagne. Ollenhauer, à la tête de l’aile gauche, défendait la social-démocratie traditionnelle, l’intervention de l’État dans l’économie et le scepticisme envers la militarisation occidentale, dans le but de maintenir le SPD ancré dans sa base ouvrière.\n\nAlors que la santé de Schumacher continue de se détériorer, les deux factions s’efforcent de consolider leur pouvoir : Franke gagne la faveur des modérés en quête de stabilité, tandis qu’Ollenhauer rallie le noyau socialiste du SPD et les syndicats. Leur rivalité devient de plus en plus manifeste dans les débats internes, menaçant de diviser le parti à un moment où il dirige le gouvernement fédéral.\n\n§CNotez que certaines décisions sont déterminées par le degré d’influence de chaque candidat. Les événements clés, tels que les successions ou les postes de dirigeants par intérim, seront soumis à celui qui dispose de la plus grande influence au sein du gouvernement fédéral. L’influence peut être renforcée par divers événements et priorités nationales."
 Schumacher49.111.a: "Qui l'emportera ?"
 SchuStroke.100.t: "[GetNewspaperHeader]Egon Franke a été nommé chancelier par intérim en Allemagne de l'Ouest"
 SchuStroke.100.d: "La République fédérale a été plongée dans l'incertitude hier soir lorsque la Chancellerie a annoncé que le chancelier Kurt Schumacher avait été victime d'un grave accident vasculaire cérébral. Le premier chancelier SPD en Allemagne depuis 1930 serait dans un état grave, les médecins ne donnant aucun pronostic immédiat quant à son rétablissement.\n\nLe vice-chancelier Egon Franke a officiellement pris en charge les fonctions de la chancellerie à titre intérimaire. Alors que Schumacher est connu pour ses principes inébranlables et son nationalisme conflictuel, Franke est la figure de proue de l'aile droite pragmatique et plus encline au compromis du SPD. Alors que le rôle de Franke est officiellement celui d'un intérimaire jusqu'au retour éventuel du chancelier, les spéculations vont bon train dans les cercles politiques à Bonn. Reste à voir si le gouvernement par intérim se contentera de maintenir le cap de Schumacher ou s'il s'orientera vers les politiques plus modérées prônées par le nouveau responsable."
 SchuStroke.100.a: "Des problèmes en Allemagne."
 SchuStroke.101.t: "[GetNewspaperHeader]Erich Ollenhauer a été nommé chancelier par intérim en Allemagne de l'Ouest"
 SchuStroke.101.d: "La République fédérale a été plongée dans l'incertitude hier soir après que la Chancellerie a confirmé que le chancelier Kurt Schumacher avait été victime d'un grave accident vasculaire cérébral. Selon le service de presse officiel de la Chancellerie, M. Schumacher se trouve dans un état grave, et ses médecins n'ont donné aucune indication quant à un éventuel rétablissement dans l'immédiat.\n\nMalgré les attentes selon lesquelles le vice-chancelier Egon Franke prendrait la relève à la chancellerie comme le prévoit la Constitution, le président fédéral Erich Ollenhauer a été confirmé à la tête du gouvernement fédéral par intérim. Cette décision est largement considérée comme un coup de force décisif de l'aile gauche du SPD visant à empêcher Egon Franke, pragmatique et de tendance conservatrice, de prendre le pouvoir. Les alliés de Franke dénonceront cette décision comme un « coup de palais » qui viole les normes constitutionnelles.\n\nLa question centrale est de savoir si le tempérament posé et moins énergique d’Ollenhauer lui permettra d’exercer la même autorité et de maintenir la cohésion du gouvernement face aux défis urgents auxquels le pays est confronté. Alors que la nation espère le rétablissement du chancelier, son gouvernement repose désormais entre les mains d’une nouvelle direction du SPD."
 SchuStroke.101.a: "Des problèmes en Allemagne."
 Ollenhauer53.0.t: "Le mandat de chancelier d'Ollenhauer"
 Ollenhauer53.0.d: "À la suite du décès du redoutable Kurt Schumacher, le Bundestag a confirmé le successeur qu’il avait désigné. Erich Ollenhauer, figure de proue de la gauche traditionnelle du SPD, prend désormais la tête du gouvernement. On s’attend à ce que son gouvernement dirige d’une main de maître, en défendant les principes socialistes fondamentaux du parti tout en menant à bien la politique intérieure et étrangère. La question de la réunification, les tensions au sein des sociaux-démocrates et la présence des chrétiens-démocrates en tant que principale opposition politique au Bundestag ne faciliteront pas la tâche de cette administration. Mais il incombe au SPD de garantir que la reconstruction, la protection sociale et la réunification ne restent pas seulement un rêve, mais deviennent une réalité."
 Ollenhauer53.0.a: "Vorwärts !"
 Ollenhauer53.15.t: "Poursuivre l'Alliance Zentrum"
 Ollenhauer53.15.d: "Le véritable fait marquant des élections de 1953 est la remontée spectaculaire de notre partenaire de coalition, le Zentrumspartei. Le Parti du Centre a déjoué toutes les prévisions en gagnant quatre points de pourcentage supplémentaires au niveau national, consolidant ainsi son rôle de partenaire essentiel au sein du gouvernement. Ce résultat est largement considéré comme un soutien à la combinaison, proposée par la coalition, de programmes de protection sociale et de défense des valeurs chrétiennes de la communauté. Avec la victoire de Johannes Brockmann à l'élection présidentielle fédérale, l'influence renforcée du Parti du Centre au sein du cabinet devrait orienter la politique intérieure du gouvernement, en mettant davantage l'accent sur les questions relatives à la famille et à l'Église pour le mandat à venir."
 Ollenhauer53.15.a: "Youpi !"
 Ollenhauer53.16.t: "Ollenhauer tient tête à Franke"
 Ollenhauer53.16.d: "La faible majorité du gouvernement du chancelier Erich Ollenhauer commence à se fissurer sous le poids des responsabilités. Alors que la redoutable opposition de la CDU bloque les réformes sociales et économiques essentielles au Bundestag, un bras de fer tendu s'est installé au sein même du SPD. Egon Franke, confronté à une pression croissante de la part de l'aile droite du parti, a interpellé directement le chancelier. Au cours d'une discussion franche, Franke a exposé la dure réalité de la situation : Ollenhauer doit faire un choix. Il peut soit rallier l'aile droite du parti, qui a pris de l'assurance, et unifier le SPD pour une confrontation idéologique directe contre l'opposition, soit mettre l'aile droite sur la touche pour suivre une voie pragmatique de compromis, en faisant des concessions importantes à la CDU afin d'assurer l'adoption des lois. La voie de l'unité du parti risque d'entraîner une impasse législative, tandis que celle du compromis menace de diviser le mouvement social-démocrate en deux. Le chancelier est désormais pris entre son parti et son État, et sa prochaine décision déterminera probablement le sort de son gouvernement."
 Ollenhauer53.16.a: "Le SPD doit agir comme un parti uni."
 Ollenhauer53.16.b: "Nous avons besoin du soutien de la CDU et du FDP."
 Ollenhauer57.0.t: "Le deuxième mandat d'Ollenhauer"
 Ollenhauer57.0.d: "Après avoir obtenu un second mandat, le chancelier Erich Ollenhauer déplace désormais ses priorités de la reconstruction d'après-guerre vers la création d'une Allemagne forte et moderne.\n\nLe programme du gouvernement pour ce nouveau mandat est ambitieux et repose sur trois grands piliers du développement national. Premièrement, la maîtrise de l'énergie nucléaire pour alimenter nos industries et garantir notre indépendance énergétique. Deuxièmement, un investissement massif dans les infrastructures nationales afin de créer les artères de notre cœur économique. Troisièmement, la poursuite du développement d'une Bundeswehr moderne, une armée capable de défendre la souveraineté allemande selon les conditions fixées par l'Allemagne."
 Ollenhauer57.0.a: "Bon, le moment est passé. Retour au travail."
 Ollenhauer57.10.t: "Une autre coopération avec Zentrum"
 Ollenhauer57.10.d: "Le Zentrumspartei s'est révélé être un excellent partenaire de coalition pour le SPD. Malgré certaines divergences, les deux partis font preuve d'un engagement sans faille en faveur de la démocratie, de l'antitotalitarisme, du fédéralisme et de l'intégration occidentale. Nous poursuivrons cette coopération au cours de la prochaine législature, étant donné que les résultats des élections ne laissent pas beaucoup d'autres options aux sociaux-démocrates."
 Ollenhauer57.10.a: "On connaît la chanson."
 Ollenhauer57.11.t: "Le débat SPD-CDU"
 Ollenhauer57.11.d: "La majorité du gouvernement du chancelier Ollenhauer est une nouvelle fois mise à rude épreuve, les chrétiens-démocrates ayant recueilli plus de 39 % des voix, ce qui laisse une forte opposition au Bundestag, bloquant ainsi des réformes sociales et économiques essentielles. Un nouveau bras de fer a éclaté au sein même du SPD. L'aile droite du parti s'est une nouvelle fois opposée directement au chancelier. Au cours d'une discussion franche, Ollenhauer doit prendre une décision : soit il unifie le parti et forme une coalition avec l'aile droite contre l'opposition, soit il met les partisans de la droite sur la touche et s'appuie sur la tolérance de la CDU envers son gouvernement, en faisant d'importantes concessions aux chrétiens-démocrates pour garantir l'adoption des lois. Une fois de plus, le chancelier est pris entre son parti et son État, et sa prochaine décision déterminera probablement le sort de son gouvernement."
 Ollenhauer57.11.a: "Nommer Egon Franke au poste de vice-chancelier."
 Ollenhauer57.11.b: "Conclure un accord avec Adenauer."
 Franke53.9.t: "Ce n'est plus un gardien"
 Franke53.9.d: "À l'issue d'une élection âprement disputée, Egon Franke s'est assuré le poste de nouveau chancelier de la République fédérale, confirmant ainsi le maintien au pouvoir des sociaux-démocrates. Ayant pris la tête du parti après le décès de Kurt Schumacher, Franke dirigera un gouvernement de coalition renouvelé, qui devrait poursuivre son partenariat avec le Zentrum, tandis que le FDP est passé dans l'opposition, s'alliant aux chrétiens-démocrates. Dans son premier discours, le nouveau chancelier a salué le peuple allemand pour son engagement en faveur de la démocratie et a promis que le gouvernement continuerait à mettre l'accent sur la justice sociale et la reconstruction. Parallèlement, le président fédéral Theodor Heuss devrait perdre la prochaine élection présidentielle, et le président du Zentrum, Johannes Brockmann, devrait lui succéder. Les analystes politiques estiment que la victoire de Franke marque un engagement en faveur de la voie actuelle, même si son gouvernement devrait mener une politique étrangère plus prudente en matière d'intégration occidentale que ne l'aurait fait l'opposition."
 Franke53.9.a: "Retour aux affaires."
 Franke53.10.t: "Poursuivre l'Alliance Zentrum"
 Franke53.10.d: "Le véritable fait marquant des élections de 1953 est la remontée spectaculaire de notre partenaire de coalition, le Zentrumspartei. Le Parti du Centre a déjoué toutes les prévisions en gagnant quatre points de pourcentage supplémentaires au niveau national, consolidant ainsi son rôle de partenaire essentiel au sein du gouvernement. Ce résultat est largement considéré comme un soutien à la combinaison, proposée par la coalition, de programmes de protection sociale et de défense des valeurs chrétiennes de la communauté. Avec la victoire de Johannes Brockmann à l'élection présidentielle fédérale, l'influence renforcée du Parti du Centre au sein du cabinet devrait orienter la politique intérieure du gouvernement, en mettant davantage l'accent sur les questions relatives à la famille et à l'Église pour le mandat à venir."
 Franke53.10.a: "Youpi !"
 Franke53.11.t: "Ollenhauer tient tête à Franke"
 Franke53.11.d: "La faible majorité du gouvernement du chancelier Egon Franke commence à se fissurer sous le poids des responsabilités. Alors que la redoutable opposition de la CDU bloque les réformes sociales et économiques essentielles au Bundestag, un bras de fer tendu s'est installé au sein même du SPD. Erich Ollenhauer, confronté à une pression croissante de la part de l'aile gauche du parti, a interpellé directement le chancelier. Au cours d'une discussion franche, Ollenhauer a exposé la dure réalité de la situation : Franke doit faire un choix. Il peut soit rallier l'aile gauche du parti, qui a pris de l'assurance, et unifier le SPD pour une confrontation idéologique directe contre l'opposition, soit mettre les gauchistes sur la touche pour suivre une voie pragmatique de compromis, en faisant des concessions importantes à la CDU afin d'assurer l'adoption des lois. La voie de l'unité du parti risque d'entraîner une impasse législative, tandis que celle du compromis menace de diviser le mouvement social-démocrate en deux. Le chancelier est désormais pris entre son parti et son État, et sa prochaine décision déterminera probablement le sort de son gouvernement."
 Franke53.11.a: "Nous devons travailler ensemble, en tant que Parti uni."
 Franke53.11.b: "La tolérance de la CDU et du FDP est trop importante."
 Franke53.12.t: "La nomination de Karl Schiller"
 Franke53.12.d: "Dans le but de redynamiser le programme économique du gouvernement, la chancelière a annoncé la nomination du professeur Karl Schiller au poste de ministre fédéral de l'Économie. Économiste émérite issu de l'université de Hambourg, Schiller jouit d'une réputation d'intellectuel brillant mais pragmatique. Ancien membre du parti nazi pendant ses années d'études, il a ensuite servi dans la Wehrmacht avant de se consacrer à la recherche universitaire et à la social-démocratie après la guerre. Son ascension au sein du SPD a été alimentée par ses arguments convaincants en faveur d’une politique économique modernisée, qui dépasse les doctrines traditionnelles du parti. \n\nLa nomination du nouveau ministre est principalement due à sa philosophie directrice, qu’il résume de manière célèbre par « autant de marché que possible, autant de planification que nécessaire ». Cette conviction d’inspiration keynésienne apporte une réponse à l’« économie sociale de marché » de la CDU. En intégrant Schiller au gouvernement, l’exécutif vise non seulement à optimiser les performances économiques grâce à une gestion macroéconomique moderne, mais aussi à remporter la bataille intellectuelle sur l’avenir de l’Allemagne."
 Franke53.12.a: "Nous suivrons votre parcours professionnel avec beaucoup d'intérêt."
 Franke53.13.t: "Herbert Wehner nommé ministre chargé des Affaires allemandes"
 Franke53.13.d: "La décision de la chancelière de nommer Herbert Wehner au poste de ministre fédéral chargé des questions panallemandes a suscité de vives protestations au sein de la CDU. Le choix de Wehner — un ancien haut responsable communiste qui a rompu de manière spectaculaire avec le stalinisme pour devenir un social-démocrate convaincu — constitue une déclaration d’intention claire. Il est connu dans toute l'Allemagne pour son génie tactique, sa discipline de fer et son style politique intransigeant. \n\nIl a publiquement engagé son ministère, et par extension la République fédérale, dans l'objectif inébranlable de parvenir à une future réunification allemande, qui inclura également les territoires perdus des frontières de 1937 ainsi que l'ancienne ville libre de Dantzig. Cette politique radicale revendique explicitement les territoires situés à l’est de la ligne Oder-Neisse, provoquant des ondes de choc à Varsovie, à Moscou et dans les capitales occidentales. Alors que cette initiative a été saluée par les associations de réfugiés et la droite nationaliste, les alliés occidentaux sont profondément alarmés par ce qu’ils considèrent comme une position dangereusement révisionniste. Néanmoins, Wehner croit en la réunification pacifique de l’Allemagne, dénonçant toute accusation d’agression présumée envers l’Allemagne de l’Est, la Pologne et l’Union soviétique."
 Franke53.13.a: "Ce sera toute l'Allemagne !"
 Franke53.14.t: "Adenauer apporte son soutien à Franke"
 Franke53.14.d: "Suite à la décision de la direction du SPD de s'engager dans une coopération informelle avec les chrétiens-démocrates, plutôt que de collaborer avec l'aile gauche du SPD, Konrad Adenauer a invité Egon Franke à un dîner privé à Bonn, en compagnie de son collègue de longue date Ludwig Erhard, afin de discuter des orientations à adopter pour la prochaine législature. Le consensus sur l'intégration à l'Ouest et l'économie sociale de marché a permis aux deux partis de disposer d'une marge de manœuvre pour négocier. Ce ne sera pas une tâche facile, mais Franke peut désormais espérer que la CDU ne se montrera pas réticente face aux propositions de loi concernant l'économie, la politique sociale et les relations internationales. La soirée s'est terminée par une partie de poker, un verre de whisky et l'un des cigares préférés d'Erhard. Il s'avère que le poker face d'Adenauer n'est pas des plus convaincants lorsqu'il s'agit de Texas Hold'em."
 Franke53.14.a: "Merci."
 Franke53.15.t: "Discussions sur la sécurité avec l'Allemagne de l'Ouest"
 Franke53.15.d: "Malgré les difficultés rencontrées lors de l'intégration de l'Allemagne de l'Ouest dans le dispositif de sécurité occidental sous le gouvernement Schumacher, le discours d'investiture du nouveau chancelier allemand Egon Franke devant le Bundestag a clairement montré que le gouvernement était déterminé à intégrer l'Allemagne de l'Ouest dans le bloc occidental. Bien que le gouvernement Franke ait exprimé des réserves quant à une demande d'adhésion précoce à l'OTAN, les troupes de l'OTAN sont les bienvenues pour mener des exercices militaires en vue d'une éventuelle invasion soviétique. Francfort n'est peut-être pas aussi ouverte à l'intégration occidentale en termes d'ampleur que l'était la CDU sous Konrad Adenauer, mais il est clair que l'Allemagne de l'Ouest restera un allié de l'OTAN et ne cherchera pas à s'engager sur la voie du non-alignement."
 Franke53.15.a: "Cela profitera à la politique européenne de défense."
 Franke53.15.b: "Cela profitera à la politique européenne de défense."
 Franke57.16.t: "Un deuxième gouvernement Franke"
 Franke57.16.d: "Une fois de plus, Egon Franke a conservé son poste de chancelier de l'Allemagne, permettant ainsi aux sociaux-démocrates de rester au pouvoir. Quatre ans après son premier mandat, Franke dirigera un gouvernement de coalition renouvelé, qui devrait poursuivre son partenariat avec le Zentrum, tout en envisageant une coopération avec les chrétiens-démocrates. Dans son discours, le chancelier a salué le peuple allemand pour son attachement à la démocratie et a promis que le gouvernement continuerait à mettre l'accent sur la justice sociale et la reconstruction. Par ailleurs, le président fédéral Brockmann devrait rester en fonction. Les analystes politiques estiment que la deuxième victoire de Franke marque un engagement accru en faveur de la voie actuelle, même si son gouvernement pourrait être amené à se lancer dans des expériences avec les chrétiens-démocrates."
 Franke57.16.a: "Toujours en avant !"
 Franke57.17.t: "La doctrine Frappe"
 Franke57.17.d: "La doctrine française de la « force de frappe » désigne la politique de la France en matière d’utilisation de ses armes nucléaires, fondée sur le concept d’une force nucléaire indépendante (force de frappe) capable d’infliger des « dommages inacceptables » à tout agresseur, même une superpuissance. Plutôt que de rivaliser avec l’arsenal d’un ennemi, la dissuasion française repose sur la certitude d’une riposte dévastatrice si les intérêts vitaux de la France sont menacés. Cela inclut une capacité de seconde frappe limitée mais viable – assurée par des sous-marins, des avions et des missiles – garantissant que toute attaque nucléaire contre la France se heurterait à une riposte dévastatrice."
 Franke57.17.a: "Un exemple à suivre."
 Franke57.18.t: "Une autre coopération avec Zentrum"
 Franke57.18.d: "Le Zentrumspartei s'est révélé être un excellent partenaire de coalition pour le SPD. Malgré certaines divergences, les deux partis font preuve d'un engagement sans faille en faveur de la démocratie, de l'antitotalitarisme, du fédéralisme et de l'intégration occidentale. Nous poursuivrons cette coopération au cours de la prochaine législature, étant donné que les résultats des élections ne laissent pas beaucoup d'autres options aux sociaux-démocrates."
 Franke57.18.a: "On connaît la chanson."
 Franke57.19.t: "Le débat SPD-CDU"
 Franke57.19.d: "La majorité du gouvernement du chancelier Egon Franke est une nouvelle fois mise à rude épreuve, les chrétiens-démocrates ayant recueilli plus de 39 % des voix, ce qui laisse une forte opposition au Bundestag, bloquant les réformes sociales et économiques essentielles. Un nouveau bras de fer a éclaté au sein même du SPD. L'aile gauche du parti s'est une nouvelle fois opposée directement au chancelier. Au cours d'une discussion franche, Franke doit prendre une décision : soit il unifie le parti et forme une coalition avec l'aile gauche contre l'opposition, soit il met les gauchistes sur la touche et conclut une grande coalition avec la CDU, en faisant d'importantes concessions aux chrétiens-démocrates pour garantir l'adoption des lois. Une fois de plus, le chancelier est pris entre son parti et son État, et sa prochaine décision déterminera probablement le sort de son gouvernement."
 Franke57.19.a: "Nous devons agir en tant que parti uni."
 Franke57.19.b: "C'est donc la première grande coalition."
 Franke57.20.t: "[GetNewspaperHeader]Grande coalition en Allemagne de l'Ouest"
 Franke57.20.d: "À la suite d’un bouleversement politique spectaculaire après les élections de 1957, le SPD victorieux du chancelier Egon Franke a formé une « grande coalition » sans précédent avec son principal rival, la CDU/CSU. Le petit Parti du Centre rejoindra également le gouvernement, créant ainsi un gouvernement d’union nationale qui dispose d’une écrasante majorité parlementaire.\n\nCette initiative marque le triomphe ultime de la vision pragmatique de Franke, consolidant la transformation du SPD en un « parti populaire » centriste en écartant sa propre aile idéologique de gauche. Tout en permettant à la CDU de conserver son influence au sein du gouvernement, ce pacte historique relègue les Libéraux-démocrates et les Conservateurs nationaux au rang d’une opposition résiduelle, soulevant des questions quant à l’avenir du débat parlementaire à une époque de consensus écrasant."
 Franke57.20.a: "Si ça marche..."
 Reimann.15.t: "Un deuxième Kulturkampf"
 Reimann.151.t: "Le traitement réservé aux anciens généraux de la Wehrmacht"
 Reimann.151.d: "La direction du KPD en Allemagne de l'Ouest est confrontée à une question décisive : faut-il maintenir les anciens généraux de la Wehrmacht au sein de l'armée ou les écarter ? Alors que les partisans de la ligne dure exigent leur destitution et leur poursuite en justice afin de préserver les fondements antifascistes de l'État, les pragmatiques soulignent la nécessité de disposer de commandants expérimentés pour maintenir la puissance militaire dans le contexte de la Guerre froide. Certains soutiennent qu'une rééducation idéologique pourrait garantir leur loyauté, comme on l'a vu au sein des forces de police de l'Allemagne de l'Est, tandis que d'autres mettent en garde contre un risque de subversion. Les conseillers soviétiques prônent la prudence, craignant un affaiblissement de la défense, tandis que les réseaux anticommunistes s'opposent à la supervision du KPD. La décision reste incertaine, mais elle déterminera l'avenir des forces armées de l'Allemagne de l'Ouest."
 Reimann.151.a: "Nous en avons besoin. Ils seront épargnés."
 Reimann.151.b: "Nous devons mettre en place une armée idéologiquement irréprochable."
 Reimann.152.t: "Une initiative de la Généralité de l'Allemagne de l'Ouest"
 Reimann.152.d: "Alors que le gouvernement du KPD renforce son emprise sur l'Allemagne de l'Ouest, les dirigeants conservateurs au sein de l'armée s'inquiètent de plus en plus. Craignant une transformation rapide du pays à la manière soviétique et une poussée vers la réunification sous un régime marxiste, des officiers de haut rang ont discrètement sollicité le soutien de la Haute Commission alliée. Des communications secrètes ont été envoyées à des contacts militaires à Washington, Londres et Paris, demandant de l'aide pour organiser un coup d'État visant à rétablir un gouvernement démocratique. Le cercle autour des anciens généraux de la Wehrmacht Hans Speidel, Adolf Heusinger et Reinhard Gehlen fait valoir que sans une intervention immédiate, l'Allemagne de l'Ouest sera définitivement perdue au profit du bloc de l'Est. À présent, ils attendent une réponse, sachant que toute hésitation pourrait signifier la consolidation du régime communiste et l'effondrement irréversible de la résistance pro-occidentale."
 Reimann.152.a: "Un espoir ? Une chance."
 Reimann.171.t: "Le traité d'unification allemande de [GetYear]"
 Reimann.171.d: "Après des semaines et des semaines de négociations et de querelles sur les détails de l’accord, et après avoir soigneusement évité les zones d’occupation occidentales de Berlin, la délégation ouest-allemande de Reimann et la délégation gouvernementale est-allemande étaient prêtes à signer l’accord. Même si Reimann avait du mal à l’accepter, un groupe de correspondants de la presse internationale se trouvait au palais de Schönhausen, la résidence du président est-allemand, pour couvrir la signature du traité d’unification.\n\nSous les flashs des appareils photo, des journalistes de toutes les nations, pour moitié occidentaux et pour moitié est-allemands, regardaient Reimann, le secrétaire général est-allemand Walter Ulbricht et le maréchal soviétique Andreï Grechko, commandant du Groupe des forces soviétiques en Allemagne, s’asseoir à une longue table, avec devant eux trois exemplaires du Traité d’unification de [GetYear].\n\nAprès avoir prononcé quelques mots, les trois hommes ont pris la plume et signé leurs exemplaires, se les passant les uns aux autres. La presse a continué à prendre des photos et à poser des questions, tandis que Reimann, Ulbricht et Grechko posaient pour les photographes.\n\nPlus tard, les trois grands sont assis à la table, signant officiellement le traité d'unification. Des cris de joie provenant des soldats soviétiques et allemands en poste retentissent dans la salle. Alors que des foules de citoyens allemands envahissent les rues, des familles sont réunies et les ennemis d’hier redeviennent les ennemis d’aujourd’hui, tandis que les soldats du Bundesgrenzschutz traversent la frontière en courant pour rejoindre leurs homologues de la Volkspolizei, partageant diverses boissons alcoolisées et célébrant la réunification de leur patrie bien-aimée."
 Reimann.171.a: "Deutschland einig Vaterland. (L'Allemagne, patrie unie)"
 Reimann.171.b: "Deutschland einig Vaterland. (L'Allemagne, patrie unie)"
 Reimann.172.t: "[GetNewspaperHeader] La réunification de l'Allemagne"
 Reimann.172.d: "Après des semaines et des semaines de négociations et de querelles sur les détails de l’accord, et après avoir soigneusement évité les zones d’occupation occidentales de Berlin, la délégation ouest-allemande de Reimann et la délégation gouvernementale est-allemande étaient prêtes à signer l’accord. Même si Reimann avait du mal à l’accepter, un groupe de correspondants de la presse internationale se trouvait au palais de Schönhausen, la résidence du président est-allemand, pour couvrir la signature du traité d’unification.\n\nSous les flashs des appareils photo, des journalistes de toutes les nations, pour moitié occidentaux et pour moitié est-allemands, regardaient Reimann, le secrétaire général est-allemand Walter Ulbricht et le maréchal soviétique Andreï Grechko, commandant du Groupe des forces soviétiques en Allemagne, s’asseoir à une longue table, avec devant eux trois exemplaires du Traité d’unification de [GetYear].\n\nAprès avoir prononcé quelques mots, les trois hommes ont pris la plume et signé leurs exemplaires, se les passant les uns aux autres. La presse a continué à prendre des photos et à poser des questions, tandis que Reimann, Ulbricht et Grechko posaient pour les photographes.\n\nPlus tard, les trois grands sont assis à la table, signant officiellement le traité d'unification. Des cris de joie provenant des soldats soviétiques et allemands en poste retentissent dans la salle. Alors que des foules de citoyens allemands envahissent les rues, des familles sont réunies et les ennemis d’hier redeviennent les ennemis d’aujourd’hui, tandis que les soldats du Bundesgrenzschutz traversent la frontière en courant pour rejoindre leurs homologues de la Volkspolizei, partageant diverses boissons alcoolisées et célébrant la réunification de leur patrie bien-aimée."
 Reimann.172.a: "Comment cela a-t-il pu arriver ?"
 Reimann.172.b: "L'unification des camarades."
 Reimann.172.c: "Nur Zusammen."
 Gehlen.20.t: "[GetNewspaperHeader] Coup d'État militaire en Allemagne de l'Ouest"
 Gehlen.20.d: "Suite à la montée en puissance du Parti communiste allemand et à la transformation de la structure constitutionnelle de l'Allemagne de l'Ouest en un système socialiste, le processus de réunification entre l'Allemagne de l'Est et l'Allemagne de l'Ouest fut interrompu, en raison d'un cercle secret d'anciens officiers de la Wehrmacht et de politiciens conservateurs qui complotaient en secret contre le gouvernement Reimann depuis les élections au Bundestag de 1949. Alors qu'il se rendait au palais de Schönhausen à Berlin-Est pour signer le traité d'unification, l'armée a pris le pouvoir à Bonn, remplaçant les bureaucrates communistes locaux et les responsables de l'armée et dénonçant le gouvernement KPD-SPD comme illégitime. Reinhard Gehlen, ancien responsable du renseignement de la Wehrmacht et fondateur de l'Organisation Gehlen, a été élu représentant du gouvernement militaire par ses collègues, assumant les fonctions de chef d'État par intérim jusqu'à l'élection d'un nouveau gouvernement."
 Gehlen.20.a: "J'ai un mauvais pressentiment à ce sujet."
 Gehlen.22.t: "Un vent de changement souffle sur le ministère des Affaires étrangères."
 Gehlen.22.d: "Ce fut une journée sans précédent pour les fonctionnaires du ministère des Affaires étrangères. La Villa Ingenohl, siège du ministère, n’a cessé de travailler sans relâche ces quatre dernières années pour isoler l’Allemagne de l’Occident et la livrer aux tyrans communistes du bloc de l’Est. L'intégration européenne, la gestion modérée du conflit interallemand, le renforcement de la coopération avec les États-Unis ainsi que le rapatriement des prisonniers de guerre allemands disparus constitueront désormais les principales promesses politiques du gouvernement allemand. Revenons sur la scène internationale et rétablissons la souveraineté allemande afin d'être à nouveau considérés comme un égal parmi les puissances européennes."
 Gehlen.22.a: "Besser ist das."
 Gehlen.23.t: "Le tribunal militaire interdit le KPD"
 Gehlen.23.d: "Le tribunal militaire a officiellement interdit le Parti communiste allemand (KPD), le jugeant anticonstitutionnel en raison de ses objectifs antidémocratiques et de son alignement sur la RDA sous contrôle soviétique, ainsi que pour avoir tenté de trahir la patrie et de la livrer au bloc occidental. Cette décision marque la fin définitive du KPD en tant qu'institution, fondé en 1918, qui n'a cessé de lutter pour saper la démocratie ouest-allemande et imposer une dictature socialiste selon les ordres du Komintern à Moscou.\n\nAvec ce jugement, toutes les activités, tous les actifs et toutes les publications du KPD sont désormais interdits. L'opposition du parti à l'intégration dans l'OTAN et au réarmement ouest-allemand, ainsi que ses liens avec les services de renseignement est-allemands et le Politburo, ont joué un rôle crucial dans la décision du tribunal. On s'attend à ce que de nombreux anciens membres du KPD entrent dans la clandestinité, rejoignent d'autres groupes de gauche ou s'installent en Allemagne de l'Est, où le parti au pouvoir, le SED, continue d'étendre son contrôle. Des efforts ont été déployés pour neutraliser le chef du KPD, Max Reimann, mais le fait qu’il soit resté à Hohenschönhausen après la conférence sur le traité de réunification illégitime de 1953 rend impossible, pour l’instant, de le traduire en justice. Reimann reste à Berlin-Est, d’où il dirige le KPD et ses derniers partisans."
 Gehlen.23.a: "Bon débarras"
 Gehlen.24.t: "La question de l'hymne national"
 Gehlen.24.d: "Notre campagne visant à forger une nouvelle identité allemande fondée sur le patriotisme porte ses fruits. Mais elle soulève une nouvelle question : quel est notre hymne national ? La solution actuelle, qui consiste à ne chanter que la troisième strophe du « Deutschlandlied », semble insuffisante et incomplète aux yeux de beaucoup. Il est temps de prendre une décision.\n\nUne option consiste à rétablir le Deutschlandlied dans son intégralité. Ses partisans affirment que ce chant est un appel à l'unité allemande, et non à la conquête, et que nous devrions chanter les trois couplets avec fierté pour revendiquer notre héritage.\n\nUne autre idée, populaire auprès des anciens combattants, est d'adopter « Die Wacht am Rhein ». Ce chant classique est plus militariste et évoque la défense de la nation. Le problème est que ses paroles visent les Français, ce qui nuirait gravement aux relations avec nos nouveaux alliés.\n\nUne dernière option, surprenante, consiste à utiliser une version réécrite de l'hymne est-allemand, « Auferstanden aus Ruinen » (« Ressuscité des ruines »). Si l'on supprime les mots communistes, la chanson est un symbole puissant de la façon dont l'Allemagne se reconstruit toujours. Ce serait un nouveau départ, libéré du poids du passé."
 Gehlen.24.a: "Deutschland, Deutschland über Allem. (L'Allemagne, l'Allemagne avant tout.)"
 Gehlen.24.b: "Es braust ein Ruf wie Donnerhall ! (Un cri retentit comme le tonnerre !)"
 Gehlen.24.c: "Auferstanden aus Ruinen und der Zukunft zugewandt. (Renaissant de ses cendres et tourné vers l'avenir.)"
 Gehlen.25.t: "Adhérer à la CECA ?"
 Gehlen.25.d: "Ratifiée par les gouvernements du Benelux, de l'Italie et de la France, la Communauté européenne du charbon et de l'acier vise à regrouper le secteur de l'industrie lourde d'Europe occidentale au sein d'un organisme supranational géré collectivement par les signataires du traité, afin de mettre un terme à la production d'armement offensif, susceptible de provoquer une nouvelle grande guerre en Europe. Grâce à une coordination et à des efforts conjoints, une structure de sécurité européenne commune peut être mise en place, propice à la richesse et à la prospérité, mais aussi capable de faire face, unie, à la menace potentielle d’une agression soviétique.\n\nL’adhésion au traité CECA renforcerait considérablement notre renommée et notre crédibilité au sein du monde occidental. Cependant, la majorité de la population allemande continue de manifester une grande méfiance envers les Alliés occidentaux, en particulier la France, qui se présente comme l’initiatrice du traité mais est considérée par la plupart des politiciens comme un « marionnettiste » cherchant à contrôler les industries européennes et à porter l’occupation de l’Allemagne à un autre niveau. Heinrich Hellwege l’a décrit de manière célèbre comme une « deuxième occupation de la Ruhr, déguisée en traité multilatéral ».\n\nL’heure est venue de choisir."
 Gehlen.25.a: "Pour la paix et la prospérité en Europe."
 Gehlen.25.b: "Nous ne sommes pas prêts à prendre un tel engagement."
 Gehlen.26.t: "L'Allemagne de l'Ouest adhère à la Communauté européenne du charbon et de l'acier"
 Gehlen.26.d: "Après la création de la CECA, divers responsables politiques, notamment des communistes et des partisans de De Gaulle, ont affirmé que le projet était voué à l'échec sans la participation de l'Allemagne de l'Ouest. Le gouvernement communiste dirigé par Max Reimann s'est distancié de toute institution occidentale et a qualifié le traité d'« impérialisme occidental visant à saper la souveraineté allemande ».\n\nCependant, avec le départ de Reimann et son remplacement par le gouvernement militaire de Gehlen, la position de l'Allemagne de l'Ouest a changé sur cette question. Privilégiant la coopération et le rétablissement de la confiance plutôt que la confrontation, Bonn a envoyé un émissaire à Paris pour présenter ses excuses concernant le retard pris dans l'intégration européenne, affirmant qu'elle souhaitait participer à la CECA, non seulement pour la richesse et la prospérité, mais aussi pour la paix et l'ordre en Europe occidentale."
 Gehlen.26.a: "Magnifique."
 Gehlen.27.t: "L'Allemagne de l'Ouest reporte son adhésion à la CECA"
 Gehlen.27.d: "Après la création de la CECA, divers responsables politiques, notamment des communistes et des loyalistes de De Gaulle, ont affirmé que le projet était voué à l'échec sans la participation de l'Allemagne de l'Ouest. Le gouvernement communiste dirigé par Max Reimann s'était ouvertement distancié de toute institution occidentale et avait qualifié le traité d'« impérialisme occidental visant à saper la souveraineté allemande ».\n\nCependant, avec le départ de Reimann et son remplacement par le gouvernement militaire de Gehlen, la position de l'Allemagne de l'Ouest a bel et bien changé sur cette question. Privilégiant la coopération et le rétablissement de la confiance plutôt que la confrontation, Bonn a récemment envoyé un émissaire à Paris pour présenter ses excuses concernant le retard pris dans l'intégration européenne. L'émissaire a déclaré que son pays souhaitait participer à la CECA, non seulement pour des raisons de richesse et de prospérité, mais aussi pour la paix et l'ordre en Europe occidentale.\n\nNéanmoins, malgré ces sentiments encourageants et ce changement apparent de politique, l’Allemagne de l’Ouest a affirmé qu’elle n’était « pas encore prête pour un tel engagement ». Le message de Bonn laisse entendre que, bien que l’ambition soit là, les priorités immédiates de la nation résident dans la stabilité interne et la reprise en cours. Si Paris prend acte de ce changement de ton, la CECA doit pour l’instant poursuivre ses travaux sans l’intégration complète et immédiate de l’industrie lourde ouest-allemande."
 Gehlen.27.a: "Les Allemands..."
 Gehlen.28.t: "[GetNewspaperHeader] L'Allemagne de l'Ouest adhère à la Communauté européenne du charbon et de l'acier"
 Gehlen.28.d: "Après la création de la CECA, les détracteurs, des communistes aux partisans de De Gaulle, avaient prédit son échec sans la participation de l'Allemagne de l'Ouest. Le gouvernement communiste de Max Reimann avait vivement condamné le traité, le qualifiant d’« impérialisme occidental », et rejeté toutes les institutions occidentales.\nAujourd’hui, avec le départ de Reimann et l’arrivée au pouvoir du gouvernement militaire de Gehlen, la position de l’Allemagne de l’Ouest a radicalement changé. Bonn a envoyé un émissaire à Paris pour présenter ses excuses concernant les retards passés et exprimer clairement son désir d'intégration européenne, en invoquant les objectifs de richesse, de prospérité et de paix.\nAujourd'hui, ces intentions sont devenues réalité. Le gouvernement militaire de Gehlen a officiellement annoncé l'adhésion de l'Allemagne de l'Ouest à la Communauté européenne du charbon et de l'acier. Cette décision décisive met fin à une période d'isolement, intègre l'industrie lourde allemande à la CECA et jette des bases plus solides pour la paix et la prospérité en Europe occidentale."
 Gehlen.28.a: "Génial !"
 Gehlen.28.b: "Bande d'imbéciles."
 Gehlen.28.c: "Freude schöner Götterfunken ! (Joie, belle étincelle divine !)"
 Gehlen.29.t: "Organisation de la conférence de Bielefeld"
 Gehlen.29.d: "L'ordre étant rétabli et la menace communiste fermement réprimée, l'heure est venue pour l'Allemagne de retrouver sa pleine souveraineté. Notre gouvernement militaire, sous la direction du général Gehlen, a pris une mesure décisive : nous avons officiellement invité les puissances alliées à nous rencontrer à Bielefeld.\n\nL'objectif de ces pourparlers est clair et vital : négocier la fin complète et inconditionnelle de l'occupation alliée de notre nation. Nous estimons que l'Allemagne a prouvé sa stabilité et son engagement indéfectible envers la cause occidentale. La présence de forces étrangères, bien que compréhensible dans son contexte historique, ne peut plus servir de symbole persistant de notre autonomie limitée. Il est temps pour nous de voler de nos propres ailes, libres de déterminer notre destin, et de prendre la place souveraine qui nous revient parmi les nations de l'Occident."
 Gehlen.29.a: "Envoyez les invitations !"
 Gehlen.30.t: "Une invitation de l'Allemagne de l'Ouest"
 Gehlen.30.d: "Une invitation inattendue est parvenue aujourd’hui de Bonn : le gouvernement militaire ouest-allemand, sous la direction du général Gehlen, a officiellement proposé une réunion avec les puissances alliées à Bielefeld. L'ordre du jour annoncé : discuter de la fin définitive de l'occupation alliée de l'Allemagne de l'Ouest.\n\nCompte tenu des efforts déployés par Gehlen et ses collaborateurs pour faire tomber Maximillian Reimann, ainsi que de leurs efforts pour intégrer davantage l'Allemagne de l'Ouest dans notre sphère d'influence, il est tout à fait naturel que nous leur témoignions un certain respect et que nous acceptions l'invitation de Bonn."
 Gehlen.30.a: "Voyons ce qu'ils ont à dire."
 Gehlen.31.t: "Le début de la conférence"
 Gehlen.31.d: "Les délégués sont arrivés à Bielefeld et ont été accueillis par des cortèges de habitants enthousiastes alors qu'ils se rendaient à la mairie. Ils ont été reçus par [WGR.GetLeader] et le ministre des Affaires étrangères Eugen Gerstenmaier avant que ne soient hissés les drapeaux des membres de la Haute Commission alliée. Une fois à l'intérieur de la mairie, un somptueux buffet a été inauguré par le maire de Bielefeld, avant que les diplomates ne soient laissés seuls pour mener leurs discussions dans les salles de réunion situées à l'arrière du bâtiment."
 Gehlen.31.a: "À propos de nos revendications..."
 Gehlen.31.b: "Un accueil chaleureux."
 Gehlen.32.t: "L'ampleur de nos revendications"
 Gehlen.32.d: "Les Alliés sont arrivés à Bielefeld. Le débat interne décisif s'ouvre désormais : quelles sont exactement nos revendications pour mettre fin à l'occupation ? [WGR.GetLeader] a réuni le cercle restreint, et la tension est palpable alors que nous pesons le pour et le contre entre ambition et pragmatisme.\n\nD'un côté, certains prônent une position la plus ferme possible : la restitution de la Sarre, la mise sous notre contrôle des bases américaines, et le traitement des troupes alliées sur un pied d'égalité, sans privilèges particuliers au-delà de ce qui est normal. Une souveraineté totale avec l'abolition du Statut d'occupation, tout en reconnaissant pour l'instant des « précautions » alliées limitées. Cette voie audacieuse promet la dignité nationale mais risque le rejet des Alliés.\n\nL'autre camp privilégie le pragmatisme : se concentrer sur la fin du Statut d'occupation et la reconnaissance de l'égalité. Pour garantir l’acceptation et établir des liens avec l’OTAN, nous devons pour l’instant renoncer à nos revendications concernant la Sarre et les bases américaines, et accorder aux Alliés des droits supplémentaires généreux pour leurs troupes stationnées. Cette approche modérée a plus de chances de réussir, garantissant une souveraineté rapide et des liens plus étroits avec l’Occident sans frictions inutiles. \n\nJusqu’où devons-nous aller, et quelles concessions devons-nous faire ?"
 Gehlen.32.a: "La terre allemande appartient aux Allemands !"
 Gehlen.32.b: "L'approche modérée semble plus raisonnable."
 Gehlen.33.t: "Les exigences allemandes"
 Gehlen.33.d: "La proposition de Bonn est d’une fermeté exceptionnelle. Elle exige non seulement la fin du statut d’occupation et l’égalité des Forces armées fédérales, mais aussi la restitution de la Sarre, le transfert de toutes les bases militaires américaines et la suppression des droits spéciaux accordés aux troupes alliées. Tout en reconnaissant certaines « précautions » limitées, il s’agit là d’une offensive en règle pour obtenir une souveraineté absolue.\n\nLes débats internes sont houleux. Certains mettent en garde contre le fait que ces revendications risquent de compromettre la stabilité française, de nuire à la défense stratégique et de créer un dangereux précédent. Accorder un tel pouvoir à une junte militaire aussi rapidement suscite des inquiétudes. D'autres invoquent l'impératif géopolitique : leur refuser ces revendications pourrait aliéner un allié de première ligne crucial. Accorder la pleine souveraineté, malgré le prix élevé, garantit l'engagement de l'Allemagne de l'Ouest. Le gain stratégique vaut-il ces concessions importantes ?"
 Gehlen.33.a: "Ont-ils oublié qu'ils viennent de perdre une guerre mondiale ? C'est inacceptable."
 Gehlen.33.b: "Qu'ils se débrouillent. De toute façon, ils ne vont nulle part."
 Gehlen.33.c: "Laissons Washington prendre cette décision"
 Gehlen.34.t: "Les exigences allemandes"
 Gehlen.34.d: "Après un examen attentif, la proposition de Bonn semble se révéler pragmatique et conforme aux attentes. Elle demande la fin officielle du statut d'occupation et la pleine souveraineté de l'Allemagne de l'Ouest, ainsi que l'égalité entre les troupes alliées et allemandes. Surtout, elle n'exige ni la Sarre ni le transfert des bases américaines, et manifeste la volonté d'accorder aux troupes alliées des droits supplémentaires importants en contrepartie de leur présence. Les « précautions » alliées devraient être maintenues.\n\nIl semble que le gouvernement ouest-allemand comprenne l'équilibre nécessaire à l'intégration. Accorder cette souveraineté, tout en maintenant une présence militaire alliée vitale, va dans le sens de nos objectifs d'une Allemagne de l'Ouest forte et démocratique au sein de l'OTAN."
 Gehlen.34.a: "Des conditions très avantageuses. Nous acceptons."
 Gehlen.34.b: "Des conditions de travail très agréables. Washington saura l'apprécier."
 Gehlen.350.t: "La Haute Commission alliée accepte nos revendications"
 Gehlen.350.d: "Les nouvelles en provenance de Bielefeld sont claires : un accord historique a été conclu ! Nos propositions, à la fois modérées et fermes, visant à mettre fin à l'occupation ont été acceptées par les puissances alliées. Le Statut d'occupation est officiellement aboli, et l'Allemagne de l'Ouest a retrouvé sa pleine souveraineté, reconnue de tous. Notre Bundeswehr opérera désormais sur un pied d'égalité, en tant que véritable armée nationale, libre de toute tutelle directe des Alliés.\n\nSurtout, les Alliés ont reconnu notre chemin vers l'autodétermination. Bien que nous ayons fait des concessions pour l'instant sur le retour immédiat de la Sarre et le transfert complet de toutes les bases militaires américaines, notre approche pragmatique a donné des résultats rapides et décisifs. Les troupes alliées maintiendront leur présence vitale, et nous avons accepté de leur accorder les droits supplémentaires nécessaires pour garantir leur efficacité dans notre défense commune."
 Gehlen.350.a: "Merveilleux !"
 Gehlen.35.t: "La Haute Commission alliée accepte nos revendications"
 Gehlen.35.d: "Les informations en provenance de Bielefeld confirment une victoire monumentale pour la nation allemande ! Notre position résolue, qui n’exigeait rien de moins que la pleine souveraineté et une véritable égalité, a été acceptée par les Alliés. Au terme d’intenses négociations, les puissances alliées ont accepté nos conditions : le Statut d’occupation est officiellement aboli, et notre Bundeswehr est désormais une force à part entière, sur un pied d’égalité.\n\nPlus important encore, elles ont accédé à nos demandes concernant le retour de la Sarre sous contrôle allemand – une injustice historique désormais réparée – et le transfert des bases militaires américaines sous notre autorité nationale. Les troupes alliées resteront sur place, mais leur présence sera désormais strictement soumise à la juridiction allemande, sans droits extraterritoriaux particuliers."
 Gehlen.35.a: "Merveilleux !"
 Gehlen.36.t: "La Haute Commission alliée rejette nos revendications"
 Gehlen.36.d: "Les informations en provenance de Bielefeld donnent à réfléchir. Malgré nos revendications fermes et claires en faveur d’une pleine souveraineté nationale, les puissances alliées se sont montrées peu disposées à accepter l’ensemble de nos propositions. Si elles restent ouvertes à la discussion sur l’abolition éventuelle du Statut d’occupation et la reconnaissance officielle de la Bundeswehr, nos revendications fondamentales concernant la restitution immédiate de la Sarre et le transfert des bases militaires américaines se sont heurtées à une forte résistance. De plus, elles insistent pour conserver des droits extraterritoriaux importants pour leurs troupes stationnées, invoquant des impératifs stratégiques et des accords d'après-guerre toujours en vigueur."
 Gehlen.36.a: "Nous devrions peut-être envisager une approche plus modérée"
 Gehlen.36.b: "Nous restons fermes sur nos positions !"
 Gehlen.37.t: "L'Allemagne assouplit ses exigences"
 Gehlen.37.d: "Après mûre réflexion, Bonn a accepté de revoir ses exigences à la baisse, renonçant à ses prétentions sur la Sarre, ainsi que sur Ramstein et Spangdahlem."
 Gehlen.37.a: "Ça nous convient. Acceptez l'accord."
 Gehlen.38.t: "L'Allemagne reste ferme"
 Gehlen.38.d: "Les Allemands ont refusé de revoir leurs revendications, campant sur leurs positions concernant la restitution de la Sarre, de Ramstein et de Spangdahlem. Ils affirment que « le sol allemand appartient au peuple allemand » et que toute nouvelle loi d'occupation étrangère est inacceptable et anéantit tout espoir de souveraineté allemande."
 Gehlen.38.a: "Non, c'est non ! Ces Allemands..."
 Gehlen.38.b: "On a peut-être été un peu trop durs..."
 Gehlen.38.c: "Comment Washington va-t-il réagir ?"
 Gehlen.39.t: "Les négociations ont échoué"
 Gehlen.39.d: "Bien que notre délégation ait clairement fait savoir que les positions des Alliés étaient inacceptables, Paris, Washington et Londres ont refusé de poursuivre les négociations, ont collectivement quitté la conférence et se dirigent actuellement vers l'aéroport de Münster pour rentrer chez eux."
 Gehlen.39.a: "Mince alors !"
 Gehlen.40.t: "Les Alliés cèdent"
 Gehlen.40.d: "Notre pari a porté ses fruits ! Notre position ferme sur la question de la Sarre, de Ramstein et de Spangdahlem a contraint les Alliés à accepter nos exigences."
 Gehlen.40.a: "Je l'avais dit !"
 Gehlen.41.t: "Fin de la conférence de Bielefeld"
 Gehlen.41.d: "Après plusieurs jours de négociations, les pourparlers de Bielefeld ont abouti. L'Allemagne de l'Ouest va retrouver sa souveraineté, ce qui mettra officiellement fin à l'occupation des zones occidentales et permettra à l'Allemagne de reconstituer ses forces armées. Il s'agit d'une victoire majeure pour l'Allemagne et son peuple, qui montre que le pays jouera à nouveau un rôle de premier plan dans la sécurité européenne."
 Gehlen.41.a: "Je suis content qu'on ait pu régler ça."
 Gehlen.42.t: "[GetNewspaperHeader]L'accord de Bielefeld"
 Gehlen.42.d: "Les négociations entre le gouvernement militaire ouest-allemand et les puissances alliées à Bielefeld se sont conclues avec succès, ouvrant la voie à la fin officielle de l'occupation alliée de l'Allemagne de l'Ouest. Après plusieurs jours de discussions intenses, les deux parties sont parvenues à un accord historique qui permettra à l'Allemagne de récupérer des éléments importants de sa souveraineté nationale. Bien que les détails complets de l'accord n'aient pas encore été rendus publics, des déclarations officielles de Bonn confirment que le Statut d'occupation sera officiellement abrogé, accordant à l'Allemagne de l'Ouest un contrôle sans précédent sur ses propres affaires. Le succès des pourparlers de Bielefeld marque le début d'une nouvelle ère pour l'Allemagne de l'Ouest : une ère de dignité retrouvée, de partenariat à part entière avec l'Occident et un pas décisif vers la place qui lui revient parmi les nations souveraines."
 Gehlen.42.a: "L'Allemagne fait son retour sur la scène internationale."
 Gehlen.42.b: "Et l'Allemagne de l'Est ?"
 Gehlen.43.t: "[GetNewspaperHeader]Tensions entre l'Allemagne de l'Ouest et la Haute Commission alliée"
 Gehlen.43.d: "Les espoirs d'une résolution rapide de la question de l'occupation alliée de l'Allemagne de l'Ouest ont été anéantis aujourd'hui, les négociations entre le gouvernement militaire ouest-allemand et les puissances alliées à Bielefeld s'étant officiellement conclues sans accord. Après d'intenses discussions, les deux parties ont confirmé que des divergences fondamentales ne pouvaient être surmontées, entraînant l'échec de ces pourparlers très attendus. Si les déclarations officielles ont été brèves et prudentes, certaines sources font état d'un profond désaccord sur l'étendue de la souveraineté ouest-allemande ainsi que sur le maintien de la présence et des droits des forces alliées. Cet échec signifie que le Statut d'occupation reste en vigueur, et que le chemin vers la pleine autodétermination de l'Allemagne s'annonce plus long que prévu. L'incapacité à parvenir à un consensus à Bielefeld jette une ombre sur les aspirations de Bonn à une autonomie complète et soulève des questions quant à l'avenir de l'intégration de l'Allemagne de l'Ouest dans l'alliance occidentale."
 Gehlen.43.a: "Dommage"
 Gehlen.43.b: "Des crétins qui se battent entre eux."
 Gehlen.44.t: "Une renégociation avec les Alliés ?"
 Gehlen.44.d: "À la suite de l'échec des pourparlers de Bielefeld, plusieurs voix au sein du gouvernement militaire ont suggéré de lancer une deuxième initiative visant à mettre officiellement fin à l'occupation. Alors que les Alliés se montrent réticents à l'idée de nouvelles négociations compte tenu de l'ampleur de nos revendications formulées il y a plus d'un an, nous pourrions peut-être leur accorder davantage de concessions afin de les convaincre de notre volonté de coopérer avec la structure de sécurité de l'OTAN. Cela signifie toutefois également renoncer à toute revendication actuelle sur la Sarre et accepter une présence accrue des forces américaines sur notre sol."
 Gehlen.44.a: "Nous nous plierons aux exigences des Alliés."
 Gehlen.44.b: "Laisse tomber."
 Gehlen.45.t: "L'Allemagne de l'Ouest cède à nos exigences"
 Gehlen.45.d: "Cela fait un an que s'est tenue la conférence de Bielefeld, première tentative de négociation d'un éventuel statut de fin d'occupation dans les zones occidentales de l'Allemagne. Alors que la délégation allemande a fait capoter la réunion en raison de ses exigences inacceptables, Bonn a manifesté son intérêt pour un nouveau cycle de négociations, affirmant vouloir s'aligner sur nos demandes et s'adapter à la structure de sécurité de l'OTAN. L'Allemagne de l'Ouest a officiellement renoncé à ses prétentions sur la Sarre, a accepté la présence massive de forces de l'OTAN à l'intérieur de ses frontières et est disposée à leur accorder des droits spéciaux."
 Gehlen.45.a: "Apparemment, on peut toujours apprendre de nouvelles choses à un vieux singe."
 Gehlen.46.t: "[GetNewspaperHeader]L'accord de Bielefeld"
 Gehlen.46.d: "Une nouvelle série de négociations entre le gouvernement militaire ouest-allemand et les puissances alliées à Bielefeld s'est cette fois-ci conclue avec succès, ouvrant la voie à la fin officielle de l'occupation alliée de l'Allemagne de l'Ouest. Après plusieurs jours de discussions intenses, les deux parties sont parvenues à un accord historique qui permettra à l'Allemagne de récupérer des éléments importants de sa souveraineté nationale. Bien que les détails complets de l'accord n'aient pas encore été rendus publics, des déclarations officielles de Bonn confirment que le Statut d'occupation sera officiellement abrogé, accordant à l'Allemagne de l'Ouest un contrôle sans précédent sur ses propres affaires. Le succès des pourparlers de Bielefeld marque le début d'une nouvelle ère pour l'Allemagne de l'Ouest : une ère de dignité retrouvée, de partenariat à part entière avec l'Occident et un pas décisif vers la place qui lui revient parmi les nations souveraines."
 Gehlen.46.a: "L'Allemagne fait son retour sur la scène internationale."
 Gehlen.46.b: "Et l'Allemagne de l'Est ?"
 Gehlen.47.t: "Bagarres de rue à Brême"
 Gehlen.47.d: "La décision de créer une branche paramilitaire reconnue par l'État fut rapidement approuvée par le gouvernement militaire, en particulier par l'ancien maréchal Albert Kesselring. On fit valoir que, pour contrebalancer les milices locales dans les grandes villes allemandes, il fallait organiser de manière adéquate le soutien contre-révolutionnaire. Le « Vaterländische Front » s'inscrira dans la tradition du Stahlhelm, en luttant contre les forces communistes et socialistes en Allemagne et en assistant la Bundespolizei, en particulier dans les zones urbaines.\n\nAprès de violents affrontements à l'intérieur de bâtiments occupés, les terroristes ont été maîtrisés et emmenés dans les commissariats locaux pour y être interrogés et faire l'objet d'une enquête."
 Gehlen.47.a: "Bande de communistes !"
 Gehlen.48.t: "L'Allemagne de l'Ouest réclame le retour de Max Reimann"
 Gehlen.48.d: "À la suite du coup d'État militariste survenu en Allemagne de l'Ouest après la Conférence sur la réunification de Berlin, Max Reimann et sa délégation ont décidé de rester à Berlin-Est pour se mettre à l'abri de la colère de l'Occident. Ils ont officiellement adhéré au SED et trouvé leur place au sein de la structure du parti, contribuant ainsi à maintenir le contrôle sur l'Allemagne de l'Est et à contenir la résistance.\n\nIl y a quelques jours, une lettre en provenance de Bonn est parvenue à Moscou, exigeant que Reimann soit renvoyé en Allemagne de l'Ouest pour y être jugé pour ses crimes contre la République fédérale. Nous soutiendrons le camarade Reimann, car son gouvernement a prouvé qu'il était capable de libérer la société ouest-allemande des forces impérialistes et de leurs modes de comportement, qui ne pouvaient être stoppés que par les anciennes forces national-socialistes, auxquelles les puissances occidentales avaient permis de se déplacer librement en Allemagne de l'Ouest."
 Gehlen.48.a: "Ils sont fous ? Non."
 Gehlen.48.b: "Reimann reste !"
 Gehlen.49.t: "L'Union soviétique refuse d'extrader Reimann"
 Gehlen.49.d: "L'Union soviétique a rejeté notre demande de restitution de Max Reimann à l'Allemagne de l'Ouest. Elle a qualifié notre lettre d'insulte et a dénoncé notre gouvernement comme une junte militaire soutenue par l'impérialisme, composée d'anciens nationaux-socialistes, qui cherche à opprimer la classe ouvrière et tente de retarder la réunification allemande. Pour l'instant, Reimann restera en Allemagne de l'Est, mais cela ne nous empêchera pas de le traduire en justice."
 Gehlen.49.a: "Bande de cochons !"
 Gehlen.50.t: "L'échec de l'opération Brandenburg"
 Gehlen.50.d: "Cela fait trop longtemps que nous n'avons pas reçu de rapport de nos agents. Après s'être infiltrés dans la Hellersdorfer Straße, le contact a été perdu et le quartier général du Bundesnachrichtendienst n'a plus reçu aucune communication. Trois jours plus tard, nous avons reçu une lettre en provenance de Berlin-Est, indiquant que des agents étrangers, initialement chargés de l'enlèvement de Max Reimann, avaient été capturés. En conséquence, nos agents ont été soumis à un procès-spectacle, puis jetés en prison."
 Gehlen.50.a: "C'est grave."
 Gehlen.501.t: "Des agents ouest-allemands capturés à Berlin-Est"
 Gehlen.501.d: "La matinée s'était déroulée sans grand relief au Checkpoint Charlie. L'agent de la police populaire Schmidtke enfilait son uniforme, prêt à poursuivre son éternel duel de regards avec le soldat américain de l'autre côté. Cependant, plusieurs hommes d'affaires ouest-allemands s'approchaient de la frontière, présentant leurs autorisations d'entrée dans le secteur est. Schmidtke se montra d'abord méfiant, mais leurs papiers d'identité étant en règle, il les laissa passer sans autre forme de procès. Leurs sacs étaient longs et lourds, ce qui était inhabituel pour des hommes d'affaires qui avaient pour objectif de vendre des assurances. Schmidtke a néanmoins envoyé un rapport à son supérieur.\n\nLe soir, il est rentré tôt chez lui, attendant que sa femme prépare le dîner. Lorsque le téléphone a sonné, c'était son ami de longue date Rudi qui l'appelait ; il travaillait au Politbüro en tant qu'agent de sécurité. Selon les rapports, sept agents ouest-allemands, déguisés en hommes d’affaires, avaient été capturés après avoir été repérés dans la Hellersdorfer Straße, où ils prévoyaient de capturer l’ancien chancelier Max Reimann, qui s’était enfui à Berlin-Est à la suite du coup d’État militariste en Allemagne de l’Ouest. Après avoir entendu cela de la bouche de son collègue, Schmidtke sourit, pensant que s’il n’avait pas éveillé les soupçons, Reimann serait probablement à Berlin-Ouest à l’heure actuelle, capturé avant un procès-spectacle."
 Gehlen.501.a: "Par Dieu !"
 Gehlen.51.t: "Tensions à la frontière berlinoise"
 Gehlen.51.d: "Depuis l'arrestation légitime de divers agents ouest-allemands, les stations de radio occidentales n'ont cessé de hurler. Elles diffusent toutes les heures des exigences réclamant la « libération immédiate » de leurs soi-disant « hommes d'affaires » – comme si le monde entier ignorait désormais qu'il s'agissait d'agents fascistes envoyés pour enlever le camarade Reimann.\n\nNotre gouvernement a bien sûr rejeté ces exigences arrogantes. *Neues Deutschland* a publié tous les détails du complot. En réponse à l’attitude militaire menaçante de la junte à Berlin-Ouest, nous avons montré notre propre détermination. La Volkspolizei et les unités frontalières ont été renforcées. À tous les postes de contrôle sectoriels, les patrouilles militaires occidentales sont désormais soumises à des inspections minutieuses et fastidieuses de leurs permis et de leurs véhicules."
 Gehlen.51.a: "C'est vrai !"
 Gehlen.52.t: "Les tensions montent à Berlin"
 Gehlen.52.d: "La situation diplomatique à Berlin s'est rapidement détériorée à la suite de la capture de nos agents. Les autorités soviétiques, s'exprimant par l'intermédiaire de leurs marionnettes est-allemandes, ont officiellement rejeté toutes les demandes de libération de nos hommes. Au lieu de cela, elles ont lancé une campagne coordonnée d'agression et de guerre psychologique.\n\nLa *Volkspolizei* et les unités frontalières ont été visiblement renforcées à tous les postes de contrôle sectoriels. Elles se livrent à un harcèlement systématique de tout le personnel affilié à l'Occident, invoquant une « sécurité renforcée ». Nos mouvements militaires et diplomatiques sont soumis à des inspections délibérément lentes et intrusives, ce qui entraîne des retards de plusieurs heures et met notre patience à rude épreuve."
 Gehlen.52.a: "Renforçons nos unités !"
 Gehlen.53.t: " [GetNewspaperHeader] Affrontements à la frontière interallemande"
 Gehlen.53.d: "Suite à la capture d'agents ouest-allemands à Berlin-Est, les tensions entre les deux États allemands ont atteint un tel paroxysme que les forces frontalières locales à Berlin n'hésitent plus à recourir à la force. Des agents occidentaux avaient pour mission d'infiltrer Berlin-Est et de récupérer l'ancien chancelier ouest-allemand Max Reimann, qui s'était enfui dans le secteur soviétique de Berlin après avoir été destitué par le gouvernement militaire provisoire de Bonn. L'Union soviétique et les États-Unis d'Amérique ne sont pas encore intervenus directement dans ce conflit, mais il est probable que cette affaire puisse dégénérer en une crise plus grave aux conséquences imprévisibles."
 Gehlen.53.a: "Inquiétant"
 Gehlen.54.t: "La suggestion d'Albert Schnez"
 Gehlen.54.d: "Le général Gehlen a convoqué une réunion avec ses plus proches collaborateurs afin d’aborder la question de la vulnérabilité de la Bundeswehr nouvellement formée. Albert Schnetz, un homme dont la loyauté et le talent d’organisateur n’étaient plus à prouver, a présenté une proposition audacieuse. Il a fait valoir que les agents officiels du BND et les attachés militaires étaient surveillés de toutes parts. Schnetz a souligné la nécessité d’une force qui n’existe pas officiellement : un groupe de vétérans triés sur le volet, fidèles uniquement au nouveau gouvernement et à la patrie, et non à la bureaucratie de Bonn ou aux observateurs alliés. Il a demandé l’autorisation de mettre en place cette « Schnetz-Truppe », qu’il envisageait comme un réseau cellulaire discret dédié à la sécurité intérieure, aux opérations de résistance clandestine et à l’action directe là où l’État ne peut être vu.\n\nManstein exprima immédiatement son soutien, qualifiant cette initiative de « solution pratique à un problème pratique ». Il déclara qu’une guerre non conventionnelle était menée contre les Soviétiques et leurs mandataires, une guerre qui ne pouvait être gagnée avec des « règles de gentlemen ». Selon Manstein, cette Truppe fournirait une arme niable et garantirait que la puissance militaire de l’Allemagne repose entre les mains de patriotes.\n\nLe général Speidel, cependant, s’est alarmé, qualifiant cette idée de « catastrophe politique en puissance ». Il a fait valoir que le régime tentait désespérément de se légitimer auprès de l’Occident. Si les Américains découvraient l’existence d’une armée secrète, ils considéreraient la junte comme n’étant pas meilleure que les fanatiques qu’elle a remplacés. Le soutien des Alliés serait retiré, entraînant l’effondrement de tout le projet d’une Allemagne de l’Ouest souveraine. Speidel a conclu qu’il s’agissait d’un pari que le gouvernement ne pouvait pas se permettre."
 Gehlen.54.a: "Le projet est abandonné. Schnetz obtient ce qu'il veut."
 Gehlen.54.b: "La proposition a été rejetée."
 Gehlen.55.t: "La question du président fédéral"
 Gehlen.55.d: "Bien que notre gouvernement agisse à juste titre en tant que gouvernement provisoire chargé de nettoyer les vestiges marxistes, la population ne tolérera pas cette situation longtemps et aspire à retourner un jour aux urnes. Afin de conférer davantage de légitimité à notre gouvernement, nous nommerons une nouvelle figure de proue, chargée de représenter nos intérêts et nos revendications auprès du monde extérieur. Il devra s’agir d’une personnalité incarnant l’autorité et l’unité, qui restaurera la confiance du peuple dans ses dirigeants.\n\nNotre premier candidat est l'ancien chancelier du Reich Heinrich Brüning, qui a exercé ses fonctions de 1930 à 1932 sous l'ancien président du Reich Paul von Hindenburg. Brüning, un catholique conservateur issu du Zentrum, gouvernait par décret et était un conservateur sur le plan fiscal, mais il était farouchement antinazi et anticommuniste, incarnant l'ordre conservateur d'avant la montée en puissance d'Hitler.\n\nLa deuxième option est Hjalmar Schacht, brillant financier, président de la Reichsbank et ministre de l'Économie d'Hitler, à qui l'on attribue le « miracle économique » d'avant-guerre. Cependant, il s'est par la suite brouillé avec le régime nazi, s'est impliqué dans les cercles de la résistance et a été emprisonné dans un camp de concentration. Schacht a été acquitté lors des procès de Nuremberg, ce qui a mis en évidence son côté apolitique en tant que pragmatique non idéologique. L'homme qui a déjà reconstruit l'économie peut le faire à nouveau, désormais libéré de l'extrémisme tant nazi que communiste.\n\nLa troisième option est le fils du défunt général-feld-maréchal August von Mackensen, Eberhard von Mackensen, qui a servi comme colonel général pendant la Seconde Guerre mondiale et entretient des liens étroits avec Erich von Manstein et Albert Kesselring. Cependant, sa personnalité a suscité une vive controverse en raison de son implication dans des crimes de guerre commis en Italie pendant l’occupation allemande de Rome. Sa condamnation a été annulée après la chute du gouvernement KPD-SPD et il s’est retrouvé au sein du cercle restreint de la junte militaire, convaincu que son statut de fils du défunt August von Mackensen ferait de lui une figure de proue plus importante."
 Gehlen.55.a: "Bienvenue à nouveau, Heinrich Brüning."
 Gehlen.55.b: "Schacht va provoquer le deuxième miracle économique."
 Gehlen.55.c: "Mackensen s'impose."
 Gehlen.56.t: "Consensus au Bundestag sur le renforcement des pouvoirs de l'exécutif"
 Gehlen.56.d: "Sous le regard vigilant du gouvernement militaire, le Bundestag s'est réuni dans une atmosphère tendue. Les députés ont débattu du projet de « Notstandsgesetz ». Sous l'impulsion de la faction intransigeante au sein de la junte – dirigée par des personnalités qui considéraient les querelles parlementaires comme la cause de la faiblesse du gouvernement précédent –, ce projet de loi visait à modifier la Loi fondamentale. Les arguments en faveur d'un « leadership résolu » face à la menace rouge ont dominé les débats. Les députés du KPD ayant déjà été purgés et de nombreux sociaux-démocrates s'étant abstenus en signe de protestation, le bloc conservateur, soutenu par les nationalistes, a adopté la mesure. La nouvelle loi élargissait considérablement les pouvoirs du chancelier et du président fédéral, leur accordant la possibilité de gouverner par décret d'urgence et de contourner le Bundestag sur les questions de « sécurité nationale », codifiant ainsi de fait le pouvoir de l'ombre exercé par l'armée dans le droit constitutionnel."
 Gehlen.56.a: "Tout se passe comme prévu."
 Gehlen.57.t: "Une nouvelle journée à la mairie"
 Gehlen.57.d: "« Comment ça, je dois obtenir un permis A38 ? Je viens juste de demander à consulter des dossiers administratifs importants concernant les activités de l’ancien Reichspropagandaministerium, on m’a renvoyé vers cinq personnes différentes, et maintenant vous me dites qu’il me faut un autre permis ? »\n\nLe fonctionnaire français était épuisé, après avoir passé les trois dernières heures aux Archives municipales de Munich à rassembler des informations cruciales sur Otto Dietrich, ancien chef de la presse et secrétaire d’État. Son parcours dans les archives de Munich est le résultat d’une décision administrative visant à formaliser la pratique informelle consistant à compliquer à l’extrême l’accès bureaucratique aux dossiers importants concernant les questions administratives antérieures à 1945.\n\n« Vous avez besoin du formulaire violet pour obtenir le permis A38. Vous pouvez vous le procurer au guichet 34, au 5e étage, dans le 6e couloir. Revenez ensuite au rez-de-chaussée pour obtenir l'autorisation d'acquérir le permis A38. »\n\nLe Français quitta le bâtiment très en colère, poussant des cris d'agacement en français sur le chemin de la sortie, en ayant assez de tout cela."
 Gehlen.57.a: "Hehehe."
 Gehlen.58.t: "Inauguration du mémorial Stauffenberg"
 Gehlen.58.d: "Dans le cadre du discours sur la « résistance patriotique », l'administration Gehlen a annoncé un projet d'État d'envergure. Un nouveau mémorial, plus imposant, rendant hommage à Claus von Stauffenberg et aux conspirateurs du complot du 20 juillet devait être construit sur le site de la prison de Plötzensee à Berlin, lieu même de leurs exécutions brutales. L’administration a présenté cela comme un hommage à la « véritable Wehrmacht anti-Hitler », dont le nouveau gouvernement se considérait comme l’héritier. Cependant, reflétant crûment le pragmatisme sans sentimentalisme de la junte, les responsables ont confirmé que cette décision était purement symbolique. Si le complexe commémoratif devait être construit pour accueillir des cérémonies d’État, Plötzensee elle-même ne serait pas désaffectée ; elle resterait une prison pleinement opérationnelle, ses hauts murs continuant à servir le système judiciaire actuel de l’État."
 Gehlen.58.a: "Vive l'Allemagne libre !"
 Gehlen.59.t: "La question de la reconstruction"
 Gehlen.59.d: "Dans les salles de réunion enfumées du ministère de la Reconstruction, une bataille idéologique acharnée se déroulait autour de l’avenir de la nouvelle Allemagne. Alors que les technocrates économiques prônaient une approche rapide et fonctionnaliste — mettant en avant les préfabriqués en béton et le style international pour loger au plus vite les millions de personnes déplacées —, l’administration Gehlen intervint avec un mandat décisif en faveur d’une « restauration spirituelle ». Rejetant le modernisme utilitariste de la décennie précédente, jugé « sans âme » et culturellement étranger, la junte décréta que la reconstruction devait donner la priorité à la continuité historique.\n\nDes fonds publics considérables furent détournés des projets de logement rapide pour être consacrés à la restauration minutieuse des palais urbains bombardés, des cathédrales et des façades ornées de l’époque Gründerzeit. Cette directive a clairement défini la priorité de l’administration : l’Allemagne de l’Ouest ne devait pas être simplement une machine économique, mais une forteresse visuelle de la culture européenne traditionnelle, reconstruisant son identité brisée brique par brique, même si cela signifiait que la reconstruction se ferait à un rythme plus lent et plus réfléchi."
 Gehlen.59.a: "Nous devons construire rapidement et efficacement."
 Gehlen.59.b: "Nous devons reconstruire notre tradition !"
 Gehlen.60.t: "Une nouvelle fête nationale pour l'Allemagne"
 Gehlen.60.d: "Dans les couloirs sacrés de la Chancellerie, le débat sur la fête nationale a mis à nu la crise d’identité du gouvernement. Les partisans de la ligne dure au sein de l’armée, menés par le bloc des ministres en uniforme, ont farouchement défendu la date du 18 janvier. Pour eux, l’anniversaire de la fondation de l’Empire allemand en 1871 était le seul choix digne de respect, symbolisant l’unité, la discipline prussienne et une lignée directe remontant à Bismarck, qui contournait le chaos du passé récent.\n\nÀ l’inverse, le 11 août — marquant la signature de la Constitution de Weimar — n’avait pas les faveurs de la majorité. Pour la majorité des dirigeants, dont beaucoup avaient servi dans la Reichswehr, cette date représentait la « faiblesse honteuse » de la première République, une expérience ratée de parlementarisme effréné qui, selon eux, n’avait fait que ouvrir la voie à l’extrémisme.\n\nPris entre deux feux se trouvaient les pragmatiques civils et les stratèges de Gehlen, qui plaidaient timidement en faveur du 23 mai — date de la promulgation de la Loi fondamentale. Bien que cette date ne possède pas la grandeur émotionnelle de la date impériale, ils soutenaient que célébrer la nouvelle Constitution était essentiel pour convaincre Washington et Londres que la junte n’était que la gardienne de la démocratie, et non son fossoyeuse. La salle resta divisée entre l’attrait de la gloire impériale et la nécessité d’un camouflage démocratique."
 Gehlen.60.a: "Nous célébrerons le 18 janvier. La naissance de l'Allemagne."
 Gehlen.60.b: "Il ne faut pas oublier Weimar. C'est le 11 août."
 Gehlen.60.c: "Le 23 mai conviendra à la Nouvelle Allemagne."
 Gehlen.61.t: "Border Clashes in Thüringen"
 Gehlen.61.d: "À la suite de violents affrontements près de Fulda, le Bundesgrenzschutz finit par venir à bout des forces locales de la Volkspolizei et les repoussa vers leurs positions défensives situées derrière les fortifications frontalières, ce qui valut aux forces armées de l'Allemagne de l'Ouest une victoire prestigieuse."
 Gehlen.61.a: "Celui-ci est destiné à Bonn."
 Gehlen.62.t: "Border Clashes in Thüringen"
 Gehlen.62.d: "À la suite de violents affrontements près de Fulda, la Volkspolizei finit par venir à bout des forces locales du Bundesgrenzschutz et les repoussa vers leurs positions défensives situées derrière les fortifications frontalières, ce qui valut aux forces armées de l'Allemagne de l'Est une victoire prestigieuse."
 Gehlen.62.a: "La Volkspolizei l'emporte."
 Gehlen.63.t: "Border Clashes in Thüringen"
 Gehlen.63.d: "À la suite de violents affrontements près de Fulda, tant le Bundesgrenzschutz que la Volkspolizei finirent par se replier sur leurs positions défensives derrière les fortifications frontalières, ce qui aboutit à une impasse sans vainqueur clair."
 Gehlen.63.a: "Eh bien, ça fait un peu bizarre."
 Gehlen.301.t: "La création d'une commission d'enquête interalliée ?"
 Gehlen.301.d: "Afin de mettre en place des structures de planification plus efficaces, Hans Speidel a proposé la création d'une plateforme commune pour la planification collective des affaires interallemandes. Cette plateforme a pour objectif de regrouper tous les efforts en matière de renseignement, de coordination des troupes en Allemagne de l'Ouest et d'actions diplomatiques à l'égard de l'Allemagne de l'Est. Si cela isolerait l'Union soviétique et montrerait clairement que l'unité allemande par la voie diplomatique n'est pas dans notre intérêt actuel, cela renforcerait nos relations avec l'Occident, consolidant ainsi le statut de sécurité de l'Allemagne de l'Ouest en Europe."
 Gehlen.301.b: "Bonne idée !"
 Gehlen.301.a: "Il vaudrait mieux ne pas aggraver davantage les tensions avec l'Union soviétique."
 Gehlen.121.t: "L'Allemagne de l'Ouest dénonce le Traité d'unification de 1953"
 Gehlen.121.d: "À la suite de la prise illégitime du pouvoir à Bonn par d'anciens éléments national-socialistes, la plupart des membres de l'ancien gouvernement KPD-SPD du chancelier Reimann ont été soit purgés, soit contraints à l'exil ici, en Allemagne de l'Est. Le gouvernement de Bonn, sous la direction de [WGR.GetLeader], a annoncé que le traité de réunification, signé à Hohenschönhausen il y a quelques mois à peine, n'avait aucune valeur bilatérale, arguant qu'il avait été signé par un gouvernement prétendument illégitime, ne représentant pas la volonté du peuple allemand. C'est une pilule difficile à avaler qui enterrera tout espoir de réunification allemande pour les prochaines décennies."
 Gehlen.121.a: "Quel dommage."
 Manstein.0.t: "[GetNewspaperHeader] Coup d'État militaire en Allemagne de l'Ouest"
 Manstein.0.d: "Suite à la montée en puissance du Parti communiste allemand et à la transformation de la structure constitutionnelle de l'Allemagne de l'Ouest en un système socialiste, le processus de réunification entre l'Allemagne de l'Est et l'Allemagne de l'Ouest fut interrompu, en raison d'un cercle secret d'anciens officiers de la Wehrmacht et de politiciens conservateurs qui complotaient en secret contre le gouvernement de Reimann depuis les élections au Bundestag de 1949. Alors qu'il se rendait au palais de Schönhausen à Berlin-Est pour signer le traité d'unification, l'armée a pris le pouvoir à Bonn, remplaçant les bureaucrates communistes locaux et les responsables de l'armée et dénonçant le gouvernement KPD-SPD comme illégitime. Erich von Manstein, ancien général-feld-maréchal de la Wehrmacht, a été élu représentant du gouvernement militaire par ses collègues, assumant les fonctions de chef d'État par intérim jusqu'à l'élection d'un nouveau gouvernement."
 Manstein.0.a: "Un ancien maréchal de la Wehrmacht à la tête de l'Allemagne ?"
 Manstein.10.t: "[GetNewspaperHeader] Hans Speidel prend le pouvoir en Allemagne de l'Ouest"
 Manstein.10.d: "Cela fait un an que le gouvernement militaire provisoire allemand a pris le pouvoir aux mains du Parti communiste allemand. Erich von Manstein, président du Comité des officiers, s’est non seulement employé à démanteler les politiques socialistes du gouvernement de Max Reimann, mais il a également poussé la remilitarisation et l’escalade diplomatique jusqu’au point de rupture. À la suite d'un affrontement avec Hans Speidel, le commandant en second, Von Manstein a finalement été contraint de démissionner de son poste et se trouve actuellement en état d'arrestation. Hans Speidel assumera les fonctions gouvernementales pour l'instant, promettant une déradicalisation rapide des deux camps et des préparatifs accélérés pour mettre fin à la loi martiale."
 Manstein.10.a: "Que se passe-t-il en Allemagne de l'Ouest ?"
 Speidel.7.t: "[GetNewspaperHeader] L'Allemagne de l'Ouest fait son entrée à l'ONU"
 Speidel.17.t: "La neutralité de l'Allemagne de l'Ouest"
 Speidel.17.d: "À la suite de l'accord de Petersberg, l'Allemagne de l'Ouest a exprimé son souhait d'adopter une position neutre en Europe, en mettant de côté la réunification rapide et en favorisant les relations avec les pays neutres du continent. Bien que cela nous ferait perdre à terme une influence importante en Europe centrale, Bonn a déclaré qu'il ne s'agirait pas nécessairement d'une décision définitive et qu'elle renoncerait à ses revendications actuelles sur la Sarre en signe de confiance. L'engagement international au sein des Nations unies et d'autres organisations internationales, ainsi que l'engagement en faveur de l'aide humanitaire, constituaient un point clé de la lettre allemande. Peut-être devrions-nous exaucer leur souhait. À un moment donné, ils pourraient bien revenir vers nous."
 Speidel.17.a: "Ces concessions semblent équitables. Approuvées."
 Speidel.18.t: "Les Alliés nous accordent la neutralité"
 Speidel.18.d: "Une délégation venue de Washington, Paris et Londres est récemment arrivée à Bonn, dans le but de rencontrer personnellement Hans Speidel. Après de longues explications, elle a accédé à la demande du gouvernement concernant la neutralité au sein de l'Europe, mais a précisé que la possibilité d'un alignement sur l'Occident ne devait pas être écartée définitivement. Au terme de plusieurs heures de négociations, les conditions initiales ont été acceptées. La Sarre restera pour l'instant sous occupation alliée, tandis que les bases américaines seront restituées à l'Allemagne, laissant la porte ouverte à de futures négociations."
 Speidel.18.a: "Nous suivons notre propre voie."
 Speidel.19.t: "L'Allemagne de l'Ouest revient dans notre sphère d'influence."
 Speidel.19.d: "À la suite de l'accord de Petersberg, l'Allemagne de l'Ouest a fait part de son souhait de réintégrer notre sphère d'influence, estimant que cela aiderait l'Allemagne sur les questions économiques et de sécurité."
 Speidel.19.a: "C'est mieux ainsi."
 Speidel.20.t: "L'OTAN lève ses restrictions"
 Speidel.20.d: "En échange de notre engagement en faveur de l'intégration et de la défense occidentales, les États-Unis, la France et le Royaume-Uni ont pris des mesures pour lever diverses restrictions en matière de production militaire et d'armée imposées après la Conférence de Potsdam.\n\nPour l'Occident, le compromis était pragmatique : il a ainsi obtenu un bouclier militaire hautement discipliné, dirigé par des vétérans, contre le bloc de l'Est. Pour nous, cela nous a assuré la légitimité internationale dont nous avions désespérément besoin. Cependant, ce réarmement provoque un gel immédiat des relations diplomatiques avec Moscou, l'URSS considérant cette manœuvre comme une violation directe des accords d'après-guerre."
 Speidel.20.a: "Merveilleux."
 Speidel.21.t: "Accord de Paderborn"
 Speidel.21.d: "Dans la salle de stratégie du Palais Schaumburg, Speidel et ses conseillers furent confrontés à la dure réalité de leur nouvelle voie. En optant pour une neutralité armée — farouchement anticommuniste mais refusant toute soumission totale à l’OTAN —, ils avaient considérablement refroidi leurs relations avec Washington et Londres. Alors que le Conseil militaire reste optimiste quant à la fin potentielle de l’occupation étrangère, la question de savoir s’il fallait mettre la Sarre sur la table des négociations fut écartée assez rapidement. Le coût d’une politique étrangère indépendante ne peut être récupéré pour l’instant."
 Speidel.21.a: "Jouer la sécurité."
 Speidel.22.t: "Rencontre soviéto-allemande à Francfort"
 Speidel.22.d: "La réunion à Francfort fut une affaire glaciale. Le général Hans Speidel, représentant la nouvelle direction militaire de l’Allemagne de l’Ouest, ne perdit pas de temps pour révoquer formellement les menaces de Manstein. « Les discours sur une invasion appartiennent au passé », déclara Speidel. « Notre objectif est la stabilité, non une guerre d’agression. »\n\nLa délégation soviétique, dirigée par Vladimir Semyonov, resta visiblement méfiante. Pour Moscou, Speidel n’était qu’un visage plus diplomatique du même « militarisme prussien » qui avait dévasté l’Est des années auparavant. Alors que les responsables de la RDA bouillonnaient de ressentiment après la chute du KPD, les Soviétiques acceptèrent une désescalade neutre, uniquement pour éviter un conflit immédiat et imprévisible.\n\nÀ la fin de la réunion, Semyonov lança une remarque finale, cinglante : « Il est sage de votre part de vous retirer, général. Nous avons remarqué que les Allemands sont bien meilleurs pour rédiger des retraites formelles que pour survivre aux hivers russes. »\n\nSur ce, les Soviétiques partirent, laissant derrière eux une paix froide et fragile.."
 Speidel.22.a: "Je suppose que c'était avant que les bonnes manières n'existent !"
 Speidel.22.b: "On te surveille, Bonn."
 Speidel.23.t: "Réintégration des anciens soldats de la Wehrmacht"
 Speidel.23.d: "La question du réarmement soulève celle, tout aussi importante, du recrutement. Nous devons mettre en place des forces armées qui ne servent pas seulement l'état-major, mais aussi les valeurs et la culture du passé de l'Allemagne, ainsi que son présent démocratique, tel que défini par la Loi fondamentale.\n\nIl s'agit désormais de débattre pour savoir s'il faut accueillir à contrecœur tous les anciens soldats de la Wehrmacht au sein de la structure de l'armée allemande ou procéder à des vérifications minutieuses de leurs antécédents. Étant donné que la plupart des données et des documents importants ont été soit détruits par les SS, soit réduits en cendres à la suite des bombardements terroristes des Alliés, il s'avérera certainement assez difficile de retrouver la trace de nos recrues."
 Speidel.23.a: "Faites-en une exception. Pas la règle."
 Speidel.23.b: "Refuser des Warriors courageux ? Pas question."
 Speidel.24.t: "Débat sur les forces de maintien de la paix allemandes"
 Speidel.24.d: "Suite à l'adhésion de l'Allemagne de l'Ouest aux Nations unies, un débat controversé s'est ouvert concernant la participation de la Bundeswehr à des missions internationales de maintien de la paix. Le gouvernement est profondément divisé sur cette question. Une faction considère ces déploiements comme un risque inutile, arguant qu'ils mettent en danger de précieux soldats dans des conflits étrangers qui ne menacent pas directement la nation. À l'inverse, les partisans de cette participation insistent sur le fait qu'elle est essentielle pour démontrer l'engagement de l'Allemagne en faveur de la sécurité et de la paix mondiales, tout en offrant une occasion stratégique unique de recueillir des renseignements sur d'autres formes de guerre sur le terrain."
 Speidel.24.a: "Cela pourrait nous offrir des possibilités de nous adapter à d'autres formes de guerre."
 Speidel.24.b: "Non ! Ça ne nous intéresse pas."
 Speidel.25.t: "Le sort des anciens fonctionnaires du NSDAP et du KPD"
 Speidel.25.d: "L'appareil d'État, la bureaucratie, est au point mort. Même si nous méprisons les idéologies du passé, la réalité est que les seuls à savoir diriger un centre des impôts, un bureau d'état civil ou un ministère sont souvent ceux qui étaient membres d'un parti, qu'il soit brun ou rouge. Le conseil est divisé : faut-il privilégier la pureté morale au risque de déficits administratifs, ou faut-il autoriser avec prudence les anciens fonctionnaires à reprendre leurs fonctions ?"
 Speidel.25.a: "Ils s'infiltrent dans l'administration !"
 Speidel.25.b: "Grâce à des vérifications minutieuses et approfondies des antécédents, nous pouvons remettre en place une administration efficace."
 Speidel.26.t: "Un million de coléoptères"
 Speidel.26.d: "C'est un jour de liesse à Wolfsburg. La millionième Volkswagen vient de sortir de la chaîne de montage, resplendissante dans sa peinture dorée festive et parsemée de strass. Cette voiture a conquis les routes d'Europe comme celles d'Amérique. « Made in Germany » n'est plus un avertissement, mais un gage de qualité, et la Coccinelle en est la charmante ambassadrice."
 Speidel.26.a: "Vrooooom !"
 Speidel.27.t: "L'Allemagne de l'Ouest demande l'adoption du statut de fin de l'occupation"
 Speidel.27.d: "Les télégrammes en provenance de Bonn se font de plus en plus pressants. Le gouvernement allemand fait valoir que le Statut d'occupation est un carcan obsolète qui l'empêche de contribuer efficacement au renforcement de ses capacités de défense. Au Pentagone et au Département d'État, les avis sont partagés. Alors que nous avons besoin d'une Allemagne de l'Ouest souveraine pour faire barrage aux Soviétiques, nos alliés français et britanniques se montrent réticents à l'idée de lever les contrôles sur la puissance allemande. Cependant, étant donné que l'Allemagne de l'Ouest a déclaré son alliance avec la sphère occidentale, il serait juste de relâcher notre emprise sur le pays. Nous devons décider si le moment est venu de traiter notre ancien ennemi comme un partenaire à part entière."
 Speidel.27.e: "Les télégrammes en provenance de Bonn se font de plus en plus pressants. Le gouvernement allemand fait valoir que le Statut d'occupation est un carcan obsolète qui l'empêche de contribuer efficacement au renforcement de ses capacités de défense. Au Pentagone et au Département d'État, les avis sont partagés. Si nous avons besoin d'une Allemagne de l'Ouest souveraine pour servir de zone tampon face aux Soviétiques, nos alliés français et britanniques se montrent réticents à l'idée de lever les restrictions pesant sur la puissance allemande. Étant donné que l'Allemagne de l'Ouest a déclaré sa neutralité en Europe, la question reste ouverte de savoir si elle mérite que nous relâchions notre emprise sur le pays. Bien sûr, nous continuerions d'exercer une influence sur Berlin et l'Allemagne de l'Ouest tant que les Soviétiques resteront en Allemagne de l'Est. Nous devons décider si le moment est venu de traiter notre ancien ennemi comme un partenaire à part entière."
 Speidel.27.a: "Accordez-leur leur souveraineté."
 Speidel.27.b: "Ils ne sont pas encore prêts."
 Speidel.27.c: "Laissons Washington s'occuper de cette affaire."
 Speidel.28.t: "La loi sur la fin de l'occupation"
 Speidel.28.d: "Un message historique vient d'arriver de la Haute Commission alliée. Les négociations ont abouti, et les puissances occidentales ont accepté d'abroger officiellement le statut d'occupation. Si les troupes alliées resteront sur notre sol pour garantir la sécurité de l'Europe occidentale face à la menace soviétique, elles ne sont plus des occupants, mais des partenaires. La République fédérale est désormais un État souverain, libre de tracer son propre destin."
 Speidel.28.e: "Un message historique nous est parvenu de la Haute Commission alliée. Les négociations ont abouti, et les puissances occidentales ont accepté d'abroger officiellement le statut d'occupation. Bien qu'elles soient réticentes à retirer leurs troupes, toutes les forces encore présentes quitteront notre territoire, puisqu'elles ne sont plus considérées comme des forces d'occupation. La République fédérale est désormais un État souverain, libre de tracer sa propre voie."
 Speidel.28.a: "Liberté !"
 Speidel.29.t: "Les Alliés refusent la souveraineté"
 Speidel.29.d: "Un message qui donne à réfléchir nous est parvenu du Département d'État américain. Malgré notre reprise économique et notre stabilité politique, Washington – sous la pression de Paris et de Londres – a décidé qu'il était prématuré de lever complètement le statut d'occupation. Les hauts-commissaires conserveront leur autorité suprême et leur droit de veto. Il semble que nous n'ayons pas encore pleinement gagné la confiance nécessaire pour être traités d'égal à égal."
 Speidel.29.a: "C'est décevant, mais nous devons persévérer."
 Adenauer58.0.t: "[GetNewspaperHeader] Konrad Adenauer élu chancelier en Allemagne"
 Adenauer58.0.d: "L'Allemagne s'apprête à mettre fin à son régime militaire. À l'issue des élections nationales, les premiers résultats indiquent que l'Union chrétienne-démocrate (CDU) de Konrad Adenauer s'achemine vers une victoire incontestable.\n\nAprès la destitution du gouvernement du KPD et l'intervention de l'armée, les Allemands semblent avoir opté pour une voie sûre et traditionnelle. Adenauer, dirigeant respecté, a promis la stabilité, des liens solides avec l'Occident et une position ferme contre le communisme. Les électeurs, lassés des troubles passés, semblent avoir choisi sa vision d'une Allemagne sûre et prospère.\n\nLe gouvernement militaire, qui avait promis de rétablir la démocratie, va désormais céder le pouvoir. Il semble que la CDU mènera l'Allemagne vers un nouveau chapitre de régime démocratique, axé sur un leadership calme et conservateur."
 Adenauer58.0.a: "Un gouvernement conservateur pour l'Allemagne."
 Adenauer58.0.b: "Une journée terrible pour les travailleurs allemands."
 Adenauer58.0.c: "Pour la sécurité et le bien-être de l'Allemagne."
 Hellwege58.0.t: "[GetNewspaperHeader] Heinrich Hellwege élu chancelier en Allemagne"
 Hellwege58.0.d: "L'Allemagne se prépare à retrouver un gouvernement civil après ses premières élections majeures depuis la fin du régime militaire. Les premiers résultats indiquent un score élevé pour l'alliance entre le Parti libéral-démocrate (FDP) et le Parti allemand (DP), avec Heinrich Hellwege en tête. \n\nM. Hellwege devrait désormais former le nouveau gouvernement, succédant aux dirigeants militaires qui avaient pris le pouvoir pour stabiliser le pays.\n\nLe gouvernement militaire, ayant tenu sa promesse de rétablir la démocratie, va désormais céder le pouvoir aux élus. Cette victoire du FDP-DP suggère que l'Allemagne recherche un équilibre entre liberté et ordre alors qu'elle rejoint les nations démocratiques, offrant une orientation différente de celle de la CDU."
 Hellwege58.0.a: "Un gouvernement national-conservateur pour l'Allemagne."
 Hellwege58.0.b: "Une journée terrible pour les travailleurs allemands."
 Hellwege58.0.c: "Est-ce là l'esprit de 1871 ?"
 WGR_Socialist_Unrests_Gehlen: "Agitation socialiste"
 WGR_Socialist_Unrest_Gehlen_desc: "Le coup d'État et le démantèlement des structures communistes et socialistes ont secoué les grandes villes de l'Allemagne de l'Ouest, poussant les ouvriers et les paysans à se soulever contre le régime militaire, à se mettre en grève et à s'opposer aux forces fédérales."
 WGR_Vaterlaendische_Front: "Front patriotique"
 WGR_Vaterlaendische_Front_desc: "Afin de faire contrepoids aux milices locales dans les grandes villes allemandes, il est nécessaire d'organiser efficacement le soutien aux forces contre-révolutionnaires. Le « Vaterländische Front » s'inscrira dans la lignée du Stahlhelm, en luttant contre les forces communistes et socialistes en Allemagne et en apportant son aide à la Bundespolizei, notamment dans les zones urbaines."
 WGR_Socialist_Unrest: "Agitation socialiste"
 WGR_Socialist_Unrest_desc: "Le coup d'État et le démantèlement des structures communistes et socialistes ont secoué les grandes villes de l'Allemagne de l'Ouest, poussant les ouvriers et les paysans à se soulever contre le régime militaire, à se mettre en grève et à s'opposer aux forces fédérales."
 WGR_Socialist_Unrest_2: "Agitation socialiste en perte de vitesse"
 WGR_Socialist_Unrest_2_desc: "À la suite des mesures énergiques prises par le gouvernement pour endiguer le vandalisme et le terrorisme, les grèves et les émeutes ont diminué dans les grandes villes allemandes. Les partisans de la ligne dure au sein des syndicats campent toutefois sur leurs positions, s'opposant jusqu'au bout à la création de forces de police fédérales. Ce n'est qu'une question de temps avant qu'ils ne cèdent."
