 WGR_CDU_Reach_out_to_FDP_1949: "Tendre la main au Freie Demokraten"
 WGR_CDU_Reach_out_to_FDP_1949_desc: "Les Démocrates libres, récemment créés, partagent avec nous plusieurs orientations politiques susceptibles de favoriser le « miracle économique ». Cependant, leur position sur la laïcité suscite une certaine méfiance au sein de la CDU. Nous avons néanmoins besoin de partenaires, et le FDP devrait en faire partie."
 WGR_CDU_Reach_out_to_DP_1949: "Approcher le Deutsche Partei"
 WGR_CDU_Reach_out_to_DP_1949_desc: "Le Parti allemand se trouve dans une position délicate, cherchant à promouvoir à la fois le conservatisme national et le traditionalisme, tout en se démarquant du nazisme et du militarisme. Ses positions traditionalistes trouvent toutefois un écho certain au sein du cercle restreint de l'Union. Peut-être devrions-nous les approcher ?"
 WGR_CDU_Reach_out_to_SPD_1949: "Un accord avec les sociaux-démocrates ?"
 WGR_CDU_Reach_out_to_SPD_1949_desc: "Notre principal rival lors des élections de 1949 étant le SPD, une coalition avec ce parti est hors de question. Il défend tout ce à quoi nous nous opposons, qu'il s'agisse de politiques anti-occidentales ou de mesures de dénazification extrêmes qui détruiraient toute stabilité administrative avant même qu'elle n'ait eu le temps de s'installer. Si nous espérons obtenir la majorité au Bundestag, la deuxième chambre, le Bundesrat, est quant à elle composée de délégués des collectivités locales de la République. Beaucoup d'entre eux sont des sociaux-démocrates et peuvent donc bloquer les lois relatives aux finances et aux affaires administratives. Peut-être devrions-nous leur accorder certaines concessions en échange de leur soutien occasionnel."
 WGR_Speidel_Stabilization: "Lutter contre l'instabilité politique"
 WGR_Speidel_Stabilization_desc: "\n\n\n\n\n\n£WGR_Government_Stability\n\n\n\n\n\n\n \nLes conséquences du mandat de Reimann et Manstein ont entraîné d'importants bouleversements politiques au sein du pays, poussant les camps politiques et les groupes sociaux à s'affronter. La démocratie telle que nous l'imaginions n'existe pas pour l'instant. Nous devons prendre des mesures prudentes, mais radicales, pour ramener le pays à la stabilité afin d'assurer un retour en douceur vers la démocratie.\n"
 WGR_Speidel_Deal_with_NSDAP_Bureaucracy: "Reconstruire la bureaucratie"
 WGR_Speidel_Deal_with_NSDAP_KPD_Bureaucracy_desc: "Le pragmatisme doit l'emporter sur l'idéalisme. On ne peut pas diriger un pays avec des administrations vides. Nous accorderons une amnistie générale aux fonctionnaires subalternes des anciens régimes, à condition qu'ils prêtent un nouveau serment de loyauté à l'État. C'est une pilule difficile à avaler pour beaucoup, mais cela permettra de garantir que les trains circulent et que les chèques de retraite soient signés."
 WGR_Speidel_Allow_SPD_Reorganisation: "Approuver la réorganisation du SPD"
 WGR_Speidel_Allow_SPD_Reorganisation_desc: "Pour prouver au monde entier — et à notre propre peuple — que ce gouvernement militaire n'est qu'un gouvernement de transition, nous devons permettre le retour du débat politique. Le Parti social-démocrate, fort de sa longue tradition d'opposition à la tyrannie, constitue la première étape logique. Lui permettre de s'organiser sera le signe que le retour à la démocratie parlementaire est imminent."
 WGR_Speidel_Reopen_Hamburg_Stock_Exchange: "Réouverture de la Bourse de Hambourg"
 WGR_Speidel_Reopen_Hamburg_Stock_Exchange_desc: "Le commerce est le moteur d'une nation en voie de reprise, et les capitaux ont besoin d'un lieu où s'investir. En rouvrant les salles de marché de la ville hanséatique, nous envoyons un message fort aux investisseurs internationaux : l'Allemagne est de nouveau ouverte aux affaires. Le téléscripteur remplacera la carte de rationnement comme symbole de notre économie."
 WGR_Speidel_Volkswagen_Kaefer: "Augmenter la production de Käfer"
 WGR_Speidel_Volkswagen_Kaefer_desc: "L'usine de Wolfsburg est bien plus qu'une simple usine ; c'est un symbole de la résilience allemande. La « Coccinelle » est robuste, abordable et correspond exactement à ce dont la population a besoin pour redémarrer. Nous subventionnerons les matières premières destinées aux chaînes de production afin de garantir que ce véhicule devienne un succès à l'exportation et un symbole de notre reprise."
 WGR_Speidel_Roll_Back_Nationalisation: "Faire reculer les initiatives de nationalisation"
 WGR_Speidel_Roll_Back_Nationalisation_desc: "L'État doit jouer le rôle d'arbitre, et non celui d'acteur. Le contrôle excessif exercé par l'État sur les industries, mis en place pendant la crise, a freiné l'innovation. Nous allons commencer à restituer les industries clés au secteur privé, afin de favoriser la concurrence et d'adopter les principes de l'économie sociale de marché."
 WGR_Speidel_Enable_Democracy_Again: "Organiser des élections"
 WGR_Speidel_Enable_Democracy_Again_desc: "Notre mission consiste à rétablir l'ordre, à stabiliser l'économie et l'appareil administratif. Tout cela conduira à terme au retour à la démocratie et à la fin du gouvernement militaire. La place d'un soldat est dans la caserne, pas à la Chancellerie. Nous devrons organiser des élections libres et équitables afin de rendre le pouvoir aux représentants civils du peuple. Même si nous disposons encore d'un peu de temps, notre légitimité ne durera pas éternellement. Si nous abusons de l'hospitalité qui nous est offerte, cela pourrait causer de graves dommages au système politique allemand et ébranler la confiance que nous avons su instaurer jusqu'à présent."
 WGR_Bundeswehr_Decisions_1950s: "La Bundeswehr"
 WGR_Bundeswehr_Decisions_1950s_desc: "\n\n\n\n\n\n£WGR_Bundeswehr\n\n\n\n\n\n\n\nLa Bundesgrenzschutz n'était qu'une petite étape dans le réarmement allemand. Sortant de l'ombre de la Wehrmacht, nous allons ouvrir un nouveau chapitre de l'histoire militaire allemande qui nous orientera vers des forces armées au service des idéaux et de la Constitution, attachées à la démocratie et non tenues de suivre des ordres pouvant être considérés comme antidémocratiques. La Bundeswehr sera la nouvelle force de défense institutionnelle de l'Allemagne, qui façonnera l'avenir de la paix et de la sécurité en Europe.\n"
 WGR_Bundeswehr_Officially_Declare_Bundeswehr: "Proclamer officiellement la création de la Bundeswehr"
 WGR_Bundeswehr_Officially_Declare_Bundeswehr_desc: "L'heure des hésitations est révolue. Alors que le monde est divisé en deux camps hostiles et que le rideau de fer s'est abattu sur notre nation, une Allemagne démilitarisée est une Allemagne sans défense. Nous devons franchir cette étape historique et organiser officiellement nos forces armées afin de défendre notre nouvelle démocratie."
 WGR_Bundeswehr_Recall_Generals: "Rappel des anciens membres de la Wehrmacht"
 WGR_Bundeswehr_Recall_Generals_desc: "Constituer une armée à partir de rien est une tâche impossible sans des dirigeants expérimentés. Bien que cela puisse prêter à controverse, nous ne pouvons pas nous permettre d'ignorer le génie tactique de ceux qui ont servi lors de la guerre précédente. Nous vérifierons leur loyauté envers la Constitution, mais nous devons tirer parti de leur expertise pour mettre en place une structure de commandement efficace."
 WGR_Request_American_Armor: "Demander des blindés américains"
 WGR_Request_American_Armor_desc: "Notre industrie lourde nationale se remet encore des ravages causés par la guerre et le démantèlement. Nous ne pouvons pas attendre que les usines allemandes relancent la production d'un nouveau char de combat. Nous devons nous tourner vers nos partenaires à Washington pour qu'ils nous fournissent des Patton et des Sherman, qui constitueront l'épine dorsale de nos premières divisions blindées."
 WGR_Reintegration_of_Former_Wehrmacht_Soldiers: "Réintégration des soldats de la Wehrmacht"
 WGR_Reintegration_of_Former_Wehrmacht_Soldiers_desc: "Des centaines de milliers d'anciens combattants arpentent nos rues, leurs compétences restant inexploitées. S'il nous faut veiller à leur inculquer les valeurs démocratiques, leur expérience du combat constitue une ressource dont nous avons désespérément besoin. Un programme sera mis en place pour réintégrer les anciens combattants qui le souhaitent dans les rangs de la population."
 WGR_Debate_UN_Intervention: "Débat sur la participation de l'Allemagne aux Casques bleus"
 WGR_Debate_UN_Intervention_desc: "La Loi fondamentale impose des limites strictes au déploiement de nos forces armées, mais la communauté internationale attend de nous que nous contribuions à la stabilité mondiale. Un débat houleux fait rage au Bundestag : les soldats allemands doivent-ils participer aux missions de maintien de la paix des Nations unies, ou notre histoire exige-t-elle une stricte neutralité ?"
 WGR_Hold_Military_Drill: "Organiser un exercice militaire"
 WGR_Hold_Military_Drill_desc: "La Loi fondamentale impose des limites strictes au déploiement de nos forces armées, mais la communauté internationale attend de nous que nous contribuions à la stabilité mondiale. Un débat houleux fait rage au Bundestag : les soldats allemands doivent-ils participer aux missions de maintien de la paix des Nations unies, ou notre histoire exige-t-elle une stricte neutralité ?"
 WGR_UPRISINGS_50s: "Agitation civile"
 WGR_UPRISINGS_50s_desc: "\n\n\n\n\n\n£WGR_Uprisings\n\n\n\n\n\n\n\nLes membres du KPD et leurs dirigeants ont quitté leurs fonctions gouvernementales, mais leurs partisans sont toujours là, notamment la grande partie de l'électorat social-démocrate, qui considère ce coup d'État comme une attaque contre la classe ouvrière et une nouvelle prise de pouvoir fasciste. La majorité des travailleurs et des étudiants des grandes villes ont lancé diverses campagnes de protestation et de boycott pour s'opposer au gouvernement ; celles-ci recèlent un tel potentiel explosif que la situation pourrait dégénérer plus rapidement que prévu. Nous devons nous attaquer à ce problème dès que possible.\n\n£population_texticon §Rl'Agitation§! est actuellement à§C[?WGR_Gehlen_Unrest|%%]§!\n\n§RLes §États rouges§! sont en proie à des §Rémeutes§!, qui infligent des malus à la construction locale, à la population recrutable et à l'attrition de l'armée, tandis que les §BÉtats bleus§! sont §Bpacifiés§! et ne connaissent pas de troubles. Les §YÉtats jaunes§! sont sous §Yoccupation étrangère§!."
 WGR_UPRISINGS_50s_End_State_of_Emergency: "Mettre fin à l'état d'urgence"
 WGR_UPRISINGS_50s_Send_Army_to_Hamburg: "Déployer des forces de police à Hambourg"
 WGR_UPRISINGS_50s_Send_Army_to_Ruhrpott: "La pacification de la Ruhr"
 WGR_UPRISINGS_50s_Send_Army_to_Hannover: "Gérer les troubles à Hanovre"
 WGR_UPRISINGS_50s_Send_Army_to_Northern_Hessen: "Émeutes liées à la surpopulation à Kassel"
 WGR_UPRISINGS_50s_Border_Conflict: "Répondre aux provocations de l'Allemagne de l'Est"
 WGR_UPRISINGS_50s_Border_Conflict_desc: "Si Berlin-Est croit pouvoir provoquer nos gardes-frontières et garder nos agents en détention sans en subir les conséquences, il se trompe ! Il faut rendre la pareille."
 WGR_NATO_Trust: "Our Relationship with the West"
 WGR_NATO_Trust_desc: "\n\n\n\n\n\n£WGR_Nato_Trust\n\n\n\n\n\n\n\nÀ la suite de la trahison de Reimann et de la détente avec l'Union soviétique, les puissances occidentales sont restées en état d'alerte maximale face aux affaires allemandes. La confiance envers les autorités ouest-allemandes est au plus bas, en raison du manque de crédibilité du régime communiste. Restaurer cette confiance sera une tâche ardue, qui exigera des engagements majeurs en faveur de l'intégration occidentale et des protocoles de sécurité communs. Il est toutefois nécessaire que l'Allemagne se relève, car ce n'est qu'aux côtés des puissances occidentales qu'elle pourra à nouveau s'épanouir.\n\n[USA.GetFlag][FRA.GetFlag][ENG.GetFlag]Le niveau de confiance de l'OTAN se situe actuellement à§C[?Nato_Trust|%%]§!\n"
 WGR_NATO_Enter_ECSC_Negotiations: "Discuter du Traité de Paris"
 WGR_NATO_Enter_ECSC_Negotiations_desc: "La participation à la CECA n'est pas seulement un atout économique ; c'est un engagement politique en faveur de la réconciliation et de l'intégration. En devenant un membre de premier plan et en partageant notre production industrielle en toute transparence, nous consolidons notre place dans une Europe pacifique et unie. Nous perdrions toutefois une grande partie de notre légitimité nationale si nous devions adhérer, ce qui entraînerait le transfert de divers contrôles sur la production de charbon et d'acier de Bonn à Bruxelles."
 WGR_NATO_Trust_Request_Further_Arms: "Demander davantage d'armes aux pays occidentaux"
 WGR_NATO_Trust_Request_Further_Arms_desc: "Nous enverrons des émissaires à Washington et à Londres afin de solliciter officiellement leur soutien politique et matériel. Nous devons les convaincre que notre gouvernement, bien que ferme, est le seul rempart fiable contre une mainmise totale de l'Union soviétique sur l'Allemagne, même si cela sape notre légitimité nationale."
 WGR_NATO_Promote_Cultural_Exchange: "Promouvoir les échanges culturels transatlantiques"
 WGR_NATO_Promote_Cultural_Exchange_desc: "Au-delà des liens militaires et économiques, une véritable alliance repose sur des valeurs communes. Nous financerons et encouragerons les programmes d'échanges culturels avec les États-Unis et d'autres pays occidentaux, afin de favoriser la compréhension mutuelle et de renforcer les liens idéologiques contre le communisme."
 WGR_NATO_Bielefeld_Conference: "La conférence de Bielefeld"
 WGR_NATO_Bielefeld_Conference_desc: "L'issue de la conférence de Bielefeld sera déterminante, car les négociations définiront le statut juridique de l'Allemagne de l'Ouest pour l'avenir prévisible. Le gouvernement doit préparer soigneusement ses revendications et agir en faveur de l'Ouest avant la conférence afin de se donner un certain poids lors de celle-ci."
 WGR_GEHLEN_NATO_Join_NATO: "Rejoindre l'OTAN"
 WGR_GEHLEN_NATO_Join_NATO_desc: "L'Allemagne a toute légitimité à occuper une place de premier plan au sein de l'Organisation du Traité de l'Atlantique Nord. Nous nous engagerons officiellement à rejoindre l'alliance, en mettant notre position stratégique, notre puissance industrielle et notre potentiel militaire au service de la défense collective de l'Occident."
 Nato_Trust_New_Decision: "Une £decision_icon_small §YNouvelle décision§! apparaîtra dans l'onglet §YDécision!§!"
 Nato_Trust_Above_50_tt: "[USA.GetFlag][FRA.GetFlag][ENG.GetFlag] §cLa confiance de l'OTAN§! est §Ysupérieure à 50 %§!"
 Nato_Trust_Above_40_tt: "[USA.GetFlag][FRA.GetFlag][ENG.GetFlag] §cLa confiance de l'OTAN§! est §Ysupérieure à 40 %§!"
 Nato_Trust_Above_20_tt: "[USA.GetFlag][FRA.GetFlag][ENG.GetFlag] §cLa confiance de l'OTAN§! est §Ysupérieure à 20 %§!"
 Nato_Trust_Above_80_tt: "[USA.GetFlag][FRA.GetFlag][ENG.GetFlag] §cLa confiance de l'OTAN§! est §Ysupérieure à 80 %§!"
 WGR_Adenauer: "Le mandat de chancelier d'Adenauer"
 WGR_Adenauer_desc: "À l'issue d'une élection acharnée et serrée, Konrad Adenauer, ancien maire de Cologne et membre du Zentrum, est sorti vainqueur des récentes élections au Bundestag. Adenauer a déjà été à l'origine de nombreux projets d'infrastructure et de développement économique pendant son mandat de maire à Cologne et, après la guerre, il a joué un rôle crucial dans la réorganisation des démocrates-chrétiens, gravissant encore les échelons politiques pour devenir le candidat à la chancellerie de l'Union chrétienne-démocrate nouvellement formée. Le mandat de chancelier d'Adenauer sera axé sur l'intégration à l'Ouest, ainsi que sur le renforcement de l'économie sociale de marché."
 Reinforce_Chancellor_Democracy: "Renforcer la démocratie chancelière"
 Reinforce_Chancellor_Democracy_desc: "Sous la direction de Konrad Adenauer, l'Allemagne de l'Ouest a vu émerger une forme de gouvernance particulière : la « Kanzlerdemokratie », ou démocratie du chancelier. Contrairement aux traditions davantage axées sur le parlement qui prévalaient à l'époque de Weimar, le modèle d'Adenauer met fortement l'accent sur l'autorité et la ligne directrice du chancelier fédéral. Les décisions clés sont souvent élaborées directement par le cabinet du chancelier, les ministres étant tenus de s'aligner étroitement sur ses politiques.\n\nLe style de direction affirmé d’Adenauer, notamment en matière de politique étrangère, de réarmement et d’intégration européenne, a consolidé le rôle du chancelier en tant que figure centrale de l’ordre politique de la nouvelle république. Alors que les détracteurs mettent en garde contre un déséquilibre dans le contrôle démocratique, ses partisans soutiennent qu’un tel modèle garantit la stabilité, la cohérence et une prise de décision rapide en cette période de reconstruction nationale et de tensions mondiales."
 Support_Other_Bourgeoise_Parties: "Soutenir le camp bourgeois"
 Support_Other_Bourgeoise_Parties_desc: "Les chrétiens-démocrates ont clairement montré leur préférence pour la formation de coalitions avec des partis proches idéologiquement de l'Union chrétienne-démocrate, tels que le Parti libéral-démocrate et le Parti allemand. Plutôt que de rechercher une coopération avec le Parti social-démocrate, dont les racines plongent dans le mouvement ouvrier et des politiques économiques plus à gauche, Adenauer a privilégié ce que beaucoup appellent une « bürgerliche Koalition », c'est-à-dire une coalition bourgeoise."
 Zuckerbrot_for_the_SPD: "Une carotte pour les sociaux-démocrates"
 Zuckerbrot_for_the_SPD_desc: "Si Adenauer est connu pour son opposition farouche aux sociaux-démocrates sur des questions idéologiques fondamentales, il a parfois adopté une approche plus tactique qui rappelle l’ancienne stratégie de Bismarck, le « Zuckerbrot und Peitsche » (la carotte et le bâton). Soucieux d’éviter une obstruction totale au Bundestag et de préserver la cohésion sociale dans une république fragile, le gouvernement a parfois cédé à des revendications mineures du SPD, notamment en matière de protection sociale et de protection des travailleurs."
 Anti_Communist_Propaganda: "Propagande anticommuniste"
 Anti_Communist_Propaganda_desc: "Dès les premiers jours de la République fédérale, un message a été clairement affiché : il ne peut y avoir aucun compromis avec le communisme. Pour le chancelier, la menace que représentent l’Union soviétique et ses ramifications idéologiques n’est pas seulement politique, elle est existentielle. Selon lui, le communisme s’oppose directement aux fondements chrétiens et démocratiques sur lesquels repose la nouvelle République fédérale."
 Invite_American_Diplomats_Abendessen: "Inviter des responsables américains à dîner"
 Invite_American_Diplomats_Abendessen_desc: "La sécurité, la prospérité et la place de la République fédérale dans le monde sont étroitement liées à une relation solide avec les États-Unis. Si les alliances officielles et les accords économiques en constituent le fondement, Adenauer privilégie souvent une approche plus personnelle de la diplomatie, forgée au fil de dîners tranquilles, de rencontres privées et de réunions informelles avec des responsables américains."
 Asylum_for_the_Displaced: "Un refuge pour les personnes déplacées"
 Asylum_for_the_Displaced_desc: "L'un des piliers du programme national de la CDU sous le gouvernement Adenauer a été l'intégration politique, sociale et économique des millions d'Allemands déplacés arrivés en République fédérale après la guerre. Parmi eux figuraient les Allemands des Sudètes originaires de Tchécoslovaquie, les personnes expulsées des anciens territoires de l'Est tels que la Silésie et la Prusse orientale, ainsi que les personnes d'origine allemande issues de régions comme la Transylvanie et le Tyrol du Sud.\n\nLa CDU souligne que ces personnes déplacées ne sont pas des étrangers, mais des concitoyens qui ont toute leur place dans l'Allemagne d'après-guerre. Grâce à une législation favorable, à des programmes d'intégration et à un engagement actif, le parti s'efforce de faire en sorte que leur contribution à la société soit reconnue et que leur identité culturelle soit préservée."
 WGR_Adenauer_Denazification: "La question de la dénazification"
 WGR_Adenauer_Denazification_desc: "Ce qui a commencé comme une mesure des Alliés visant à éliminer toute influence des anciens nazis dans l'Allemagne d'après-guerre continue de représenter un défi majeur pour le gouvernement Adenauer. Le pouvoir législatif ayant été rendu au peuple allemand, les chrétiens-démocrates et leurs partenaires de coalition s'accordent à dire qu'une reconstruction administrative pragmatique et l'intégration de la société ne peuvent être réalisées qu'en accordant l'amnistie et en annulant les sanctions infligées aux anciens nazis des classes moyennes et populaires. Bien que ces mesures puissent déplaire aux puissances alliées, elles constituent une étape nécessaire pour garantir la stabilité et la sécurité au sein de la société ouest-allemande."
 Lobbyism_Pardon_for_War_Criminals: "Faire pression pour que les anciens nazis soient graciés"
 Lobbyism_Pardon_for_War_Criminals_desc: "Ces derniers mois, des personnalités politiques, des associations d'anciens combattants et certains membres du clergé ont multiplié leurs efforts pour militer en faveur de la grâce et de la libération anticipée des criminels de guerre condamnés détenus par les puissances alliées. Les partisans de cette cause font valoir que le maintien en détention fait obstacle à la réconciliation nationale et que bon nombre des condamnations ont été prononcées dans des conditions qui ne garantissaient pas une totale clarté juridique. Ils invoquent la nécessité de restaurer la dignité du corps des officiers allemands et de réintégrer ces personnes dans la société. Bien que controversé, ce mouvement s’inscrit dans le cadre d’efforts plus larges visant à réaffirmer la souveraineté nationale et à tourner la page sur le passé de l’Allemagne pendant la guerre."
 The_Globke_Dilemna: "Le dilemme de Globke"
 The_Globke_Dilemna_desc: "Ces dernières semaines, des inquiétudes discrètes mais croissantes ont vu le jour au sujet du Dr Hans Globke, haut fonctionnaire à la Chancellerie fédérale et proche conseiller du chancelier Adenauer. Les détracteurs ont souligné son implication passée dans la rédaction de commentaires juridiques sous le régime national-socialiste, notamment sa participation à la rédaction des annotations aux lois de Nuremberg de 1935.\n\nLa question reste politiquement sensible, alors que le gouvernement s'efforce de maintenir à la fois la continuité et la crédibilité dans le cadre de la délicate reconstruction d'après-guerre."
 Support_the_Organisation_Gehlen: "Étendre l'allocation des ressources à l'organisation Gehlen"
 Support_the_Organisation_Gehlen_desc: "L'Organisation Gehlen s'est révélée être un atout essentiel dans la lutte contre l'infiltration communiste. Ses opérations vont de la surveillance des activités de gauche au rapatriement clandestin de prisonniers de guerre allemands depuis l'Union soviétique. Elle a également contribué à la réinstallation discrète d'anciens nazis, préservant ainsi un savoir-faire précieux durant cette période de transition.\n\nCompte tenu de son efficacité dans la protection de la sécurité et de la stabilité nationales, un soutien accru à Reinhard Gehlen et à son organisation est à la fois justifié et nécessaire."
 131_Law: "Débat sur la loi 131"
 131_Law_desc: "La « loi 131 », officiellement intitulée « Loi régissant le statut juridique des personnes visées par l'article 131 de la Loi fondamentale », vise à réintégrer les anciens fonctionnaires, juges, professeurs et militaires qui avaient perdu leur poste à la suite de l'effondrement de l'Allemagne en 1945 ou des politiques de dénazification menées par les Alliés. Ces personnes sont communément appelées « 131ers », d'après l'article 131 de la Loi fondamentale. \n\nLe premier projet prévoit que les institutions publiques soient tenues de réserver au moins 20 % de leurs postes à ces personnes déplacées. Il leur permettra de récupérer leurs grades et titres antérieurs, souvent avec la mention « zur Wiederverwendung » (pour réutilisation). Tout en excluant les personnes classées comme « grands coupables » lors de la dénazification, ce projet réintégrera vraisemblablement de nombreuses personnes ayant servi sous le régime nazi, y compris celles dont l’implication est discutable."
 Amnesty_Law: "Rédiger le projet de loi sur l'impunité"
 Amnesty_Law_desc: "La loi sur l'impunité (Straffreiheitsgesetz) vise à accorder l'amnistie pour les infractions mineures commises avant le 15 septembre 1949, y compris les délits passibles d'une peine d'emprisonnement maximale de six mois ou d'une amende pouvant aller jusqu'à 5 000 marks allemands. La portée de cette mesure et les éventuelles clauses spéciales applicables à certaines personnes doivent encore faire l'objet de discussions et devraient susciter de vifs débats au Bundestag. Elle est toutefois considérée comme un nouveau départ, permettant de stabiliser la nouvelle démocratie et de répondre aux demandes de réconciliation exprimées par la population."
 Apologize_to_Victims_Compensation: "Indemnisation des victimes du régime national-socialiste"
 Apologize_to_Victims_Compensation_desc: "Dans un contexte international en pleine mutation, le gouvernement s'oriente vers une prise de conscience morale. Les excuses et les mesures d'indemnisation marquent une nouvelle étape dans la confrontation de l'Allemagne de l'Ouest avec son passé. Les victimes des mesures répressives des nazis et leurs familles recevront une indemnisation. Cela ne suffira peut-être pas à panser complètement leurs blessures, mais cela les aidera peut-être à retrouver, dans une certaine mesure, une vie normale."
 Sign_Israel_Reperation_Treaty: "Se rapprocher d'Israël"
 Sign_Israel_Reperation_Treaty_desc: "Geste historique de réconciliation, l'accord de réparation conclu avec Israël vise à offrir à la communauté juive une compensation, ne serait-ce que matérielle, pour les atrocités nazies. Ce sera un premier pas vers la construction d'une nouvelle identité morale pour l'Allemagne, et ce ne sera pas notre dernière initiative en la matière."
 End_Denazification: "Abroger toutes les lois de dénazification"
 End_Denazification_desc: "Nous en avons fait assez jusqu’à présent. Les principaux responsables du régime national-socialiste ont été traduits en justice, tandis que nous avons recentré nos efforts sur l’indemnisation et les excuses envers les victimes des nazis, ainsi que sur l’amnistie accordée aux anciens fonctionnaires et membres de l’administration qui avaient été emprisonnés par les Alliés de manière tout à fait injustifiée. Nous pouvons désormais tourner la page sur ce chapitre de notre histoire et nous tourner vers l’avenir."