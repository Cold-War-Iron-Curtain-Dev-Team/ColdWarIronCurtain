 WGR_Reimann_49_Bundeskanzler_Max_Reimann_desc: "Les dés sont jetés. Contre toute attente des Alliés occidentaux et des partis bourgeois, le peuple allemand s'est exprimé et a élu le Parti communiste au pouvoir. Max Reimann, marxiste convaincu et homme politique chevronné, accède à la chancellerie à Bonn. Son élection provoque une onde de choc en Occident et est un signe d'espoir pour Moscou. L'avenir de l'Allemagne est désormais à la croisée des chemins."
 WGR_Reimann_49_Speak_to_the_German_People_desc: "Pour son premier acte officiel, le chancelier Reimann s'adressera à la nation. Dans une allocution radiophonique très attendue, il exposera sa vision d'une nouvelle Allemagne : une Allemagne de paix, de socialisme et d'unité. Il doit rassurer le peuple, mettre en garde ses détracteurs et préparer le terrain pour les changements radicaux à venir."
 WGR_Reimann_49_Appease_the_CDU_desc: "Les forces bourgeoises, menées par la CDU d'Adenauer, sont alarmées. Pour éviter un coup d'État immédiat ou une intervention des Alliés, nous devons feindre pour l'instant une ligne modérée. Quelques concessions à l'opposition et des assurances quant au respect de l'ordre démocratique nous permettront de gagner le temps nécessaire pour consolider notre pouvoir."
 WGR_Reimann_49_Destroy_Evidence_desc: "La victoire a été serrée, peut-être trop serrée. Des rumeurs d'irrégularités et d'« assistance » circulent déjà. Avant que nos ennemis, tant à l'intérieur qu'à l'extérieur du pays, ne puissent utiliser ces rumeurs pour délégitimer le résultat des élections, tous les documents et témoignages potentiellement compromettants doivent disparaître. La volonté du prolétariat ne peut être remise en question par des formalités bourgeoises."
 WGR_Reimann_49_Red_Coalition_with_the_SPD_desc: "Seul, le KPD est vulnérable. Une coalition avec les sociaux-démocrates consoliderait notre position au Bundestag et créerait un large front de gauche. Bien que nous ayons des divergences idéologiques avec la direction du SPD, l'unité de la classe ouvrière est primordiale en cette heure décisive. Nous leur ferons une offre qu'ils ne pourront pas refuser."
 WGR_Reimann_49_Federal_Bureau_for_Central_Planning_desc: "L'économie de marché chaotique et exploiteuse du capitalisme a échoué en Allemagne. Il est temps d'introduire une planification économique rationnelle et scientifique. En créant un Bureau fédéral de planification centrale, nous alignerons la production sur les besoins de la population et briserons le pouvoir des grands industriels."
 WGR_Reimann_49_Coal_Production_in_the_Ruhr_desc: "Le charbon est l'or noir qui fait tourner le moteur de notre industrie. Pour accélérer la reconstruction et garantir notre indépendance économique, les mineurs de la Ruhr doivent établir de nouveaux records de production. Les investissements publics et les appels au patriotisme permettront d'atteindre des niveaux de production sans précédent."
 WGR_Reimann_49_Nationalize_Deutsche_Bundesbahn_desc: "Le chemin de fer est l'artère vitale de la nation. Il ne peut plus rester entre les mains des bureaucrates et des profiteurs potentiels. La nationalisation complète et la restructuration de la Deutsche Bundesbahn garantiront qu'elle servira exclusivement l'État et le peuple, en transportant les troupes, les marchandises et les travailleurs là où ils sont nécessaires."
 WGR_Reimann_49_Introduce_State_Owned_Consumer_Goods_Stores_desc: "Afin d'assurer l'approvisionnement de la population en biens et d'empêcher les pratiques abusives des commerçants privés, nous mettrons en place un réseau de magasins d'État vendant des biens de consommation. Ces « grands magasins populaires » proposeront des produits de première nécessité à des prix équitables fixés par l'État, améliorant ainsi directement la qualité de vie de la classe ouvrière."
 WGR_Reimann_49_IG_Farben_State_Owned_desc: "IG Farben, un monopole et profiteur de guerre étroitement lié au régime nazi, doit être démantelé et ses actifs restitués au peuple. La reprise de ses usines restantes en tant qu'entreprise publique sera non seulement un acte de justice, mais permettra également d'assurer notre contrôle sur des secteurs cruciaux de l'industrie chimique."
 WGR_Reimann_49_Increase_Steel_Production_in_Salzgitter_desc: "L'acier est le fondement de toute industrie et armée modernes. Les usines Hermann-Göring-Werke à Salzgitter, symbole de la machine de guerre nazie, seront revitalisées sous une nouvelle direction. Grâce à des investissements ciblés et à la mobilisation des travailleurs, nous augmenterons massivement la production d'acier afin de forger les fondations de la nouvelle Allemagne."
 WGR_Reimann_49_Debate_Receiving_Marshall_Plan_Aid_desc: "Les Américains nous offrent leur « aide », mais nous connaissons le véritable prix à payer : la soumission politique et l'exploitation économique. Un débat public permettra de révéler la véritable nature du plan Marshall, qui n'est autre qu'un outil de l'impérialisme américain. L'Allemagne ne vendra pas sa souveraineté pour quelques dollars."
 WGR_Reimann_49_Denounce_the_Basic_Law_desc: "La soi-disant Loi fondamentale nous a été imposée par les puissances occidentales. Il s'agit d'un document qui protège les relations de propriété bourgeoises et restreint le pouvoir de la classe ouvrière. Nous devons la dénoncer publiquement pour ce qu'elle est : un carcan que nos ennemis nous ont imposé."
 WGR_Reimann_49_New_Constitutional_Convention_desc: "Une Allemagne socialiste a besoin d'une constitution socialiste. Nous convoquerons une convention constitutionnelle composée de représentants des travailleurs, des paysans et de l'intelligentsia. Ensemble, ils créeront une nouvelle loi fondamentale qui ouvrira la voie à un avenir plus juste."
 WGR_Reimann_49_Support_the_KPD_desc: "Afin de protéger les acquis de la classe ouvrière, le rôle dirigeant du Parti communiste doit être inscrit dans la loi. Un amendement à la Loi fondamentale reconnaîtra le KPD comme l'avant-garde du peuple et le protégera contre les attaques des forces réactionnaires."
 WGR_Reimann_49_Socialist_Constitution_desc: "Le travail est terminé. La nouvelle constitution définira les piliers fondamentaux de notre État : la propriété populaire des moyens de production, le rôle dirigeant de la classe ouvrière et de son parti, et l'amitié indissoluble avec l'Union soviétique. Voici l'acte de naissance de la République socialiste allemande."
 WGR_Reimann_49_Marxist_Language_desc: "Le langage façonne la pensée. Pour changer la conscience du peuple, nous devons ancrer la terminologie du marxisme-léninisme dans tous les documents officiels, lois et proclamations. Des termes tels que « lutte des classes », « prolétariat » et « matérialisme historique » deviendront le vocabulaire quotidien de l'État."
 WGR_Reimann_49_Condemnation_from_the_CDU_desc: "Nos changements révolutionnaires ne restent pas sans réponse. La CDU et ses protecteurs occidentaux condamnent nos politiques comme étant « totalitaires » et « antidémocratiques ». Leurs protestations stridentes ne sont que les derniers soubresauts d'une classe en déclin. Nous ne nous laisserons pas dissuader."
 WGR_Reimann_49_Augment_the_Powers_of_the_Chancellor_and_Cabinet_desc: "En période de bouleversements, il faut agir avec détermination. Les processus parlementaires lourds de la démocratie bourgeoise entravent notre progression. Nous élargirons les pouvoirs du chancelier et de son cabinet par décret, ce qui nous permettra de réagir rapidement et efficacement à toute menace."
 WGR_Reimann_49_Limited_Freedom_of_Religion_desc: "La liberté, oui, mais pas pour les ennemis de la liberté ! La liberté d'expression et de religion sera garantie dans la mesure où elles ne seront pas utilisées pour diffuser de la propagande antisocialiste ou pour saper le pouvoir de l'État. Les déclarations contre-révolutionnaires ne seront pas tolérées."
 WGR_Reimann_49_Pro_Soviet_FP_desc: "L'Allemagne n'est plus un pion des puissances occidentales. Notre avenir se trouve aux côtés de l'Union soviétique et des peuples socialistes frères. Nous réorienterons notre politique étrangère afin de renforcer nos liens avec Moscou et de jouer un rôle actif dans la lutte contre l'impérialisme mondial."
 WGR_Reimann_49_Occupation_Statute_as_Colonization_desc: "Le statut d'occupation est un instrument d'oppression. Dans notre propagande, nous le présenterons systématiquement pour ce qu'il est : une forme de colonialisme par lequel les puissances occidentales exploitent et contrôlent notre pays. La demande de son abrogation immédiate sera l'un de nos principaux slogans en matière de politique étrangère."
 WGR_Reimann_49_Soviet_Technical_Assistance_desc: "Pour reconstruire rapidement notre industrie, nous avons besoin d'un savoir-faire moderne. Au lieu de devenir dépendants des capitalistes occidentaux, nous demanderons l'aide technique de l'Union soviétique. Leurs ingénieurs et leurs scientifiques nous aideront de manière désintéressée à bâtir une économie socialiste moderne."
 WGR_Reimann_49_Cominform_Observer_desc: "Il est temps de prendre notre place au sein de la communauté des partis communistes et ouvriers. Rejoindre le Kominform en tant qu'observateur enverra un signal clair à nos amis comme à nos ennemis quant à la position de la nouvelle République fédérale. C'est le premier pas vers une intégration complète dans le camp socialiste."
 WGR_Reimann_49_Meet_with_Stalin_desc: "Une rencontre personnelle entre le chancelier Reimann et le secrétaire général du PCUS, Joseph Staline, scellera l'alliance entre nos nations. À Moscou, les bases d'une future coopération dans les domaines économique, politique et militaire seront jetées. Ce sera un moment historique pour le mouvement ouvrier allemand."
 WGR_Reimann_49_Condemn_NATO_desc: "La création de l'OTAN est un acte agressif visant directement l'Union soviétique et les démocraties populaires. En tant que fer de lance de l'impérialisme américain, cette alliance militaire menace la paix mondiale. Nous condamnerons fermement l'OTAN sur la scène internationale et dénoncerons ses véritables intentions bellicistes."
 WGR_Reimann_49_Thorn_in_the_Side_desc: "Une Allemagne de l'Ouest communiste au cœur de l'Europe est le pire cauchemar des impérialistes occidentaux. Nous utiliserons cette position pour perturber leurs plans, affaiblir leurs alliances et servir de phare pour les mouvements ouvriers dans toute l'Europe occidentale. Chaque mouvement qu'ils feront sera entravé par nous."
 WGR_Reimann_49_New_Grundgesetz_desc: "La convention constitutionnelle a achevé ses travaux. La nouvelle Loi fondamentale, qui consacre nos acquis socialistes et institutionnalise le pouvoir de la classe ouvrière, va désormais être officiellement adoptée. La ratification de ce document marque le début d'une nouvelle ère dans l'histoire allemande."
 WGR_Reimann_49_Role_of_the_Military_desc: "Notre nouvelle armée n'aura rien de commun avec les militaristes prussiens ou les hordes fascistes de la Wehrmacht. L'Armée populaire nationale de l'Ouest sera une armée d'un nouveau type : une armée de travailleurs et de paysans dont la seule tâche sera de défendre la patrie socialiste et la paix contre toute agression impérialiste."
 WGR_Reimann_49_Combine_the_BGS_and_Bundeswehr_desc: "La séparation entre la police et l'armée est un concept bourgeois. La garde-frontière fédérale et les forces armées naissantes seront fusionnées en une seule et même force armée unifiée. Cela permettra d'accroître l'efficacité et de garantir que tous les éléments armés de l'État soient soumis à la même idéologie et au même commandement."
 WGR_Reimann_49_Socialist_Navy_and_Air_Force_desc: "Un État moderne a besoin d'une marine et d'une armée de l'air modernes pour protéger sa souveraineté. Nous commencerons à construire une marine populaire et des forces aériennes socialistes. Leur mission première sera de défendre nos côtes et notre espace aérien contre les provocations de l'OTAN."
 WGR_Reimann_49_Revamp_the_Kriegsmarinewerft_desc: "Le chantier naval historique Kriegsmarinewerft à Wilhelmshaven deviendra le centre de notre nouveau programme de construction navale. Avec l'aide soviétique et l'ingénierie allemande, nous moderniserons le chantier naval afin de construire les premiers navires de notre marine populaire et de restaurer nos capacités maritimes."
 WGR_Reimann_49_Deal_For_Mig_15s_desc: "Pour protéger l'espace aérien allemand, nous avons besoin des meilleures technologies disponibles. Un accord avec l'Union soviétique nous garantira l'accès à des avions de chasse MiG-15 et à des bombardiers Il-28 modernes. Grâce à eux, nos forces aériennes seront en mesure d'affronter tout agresseur potentiel."
 WGR_Reimann_49_Construct_Naval_and_Air_Bases_desc: "Les armes modernes nécessitent des infrastructures modernes. Nous allons lancer un programme visant à construire et à agrandir des bases navales et aériennes à des endroits stratégiques le long des côtes et des frontières. Cela améliorera considérablement la préparation et le rayon d'action de nos forces armées."
 WGR_Reimann_49_Soviet_T_54s_desc: "Le corps blindé est le poing de l'armée. Nous équiperons nos divisions blindées en achetant des chars soviétiques T-54 modernes. Ces véhicules robustes et puissants constitueront l'épine dorsale de notre défense contre toute offensive terrestre de l'OTAN."
 WGR_Reimann_49_Conscription_Act_desc: "La défense de la patrie est le devoir suprême de chaque citoyen. Une nouvelle loi sur la conscription instaurera le service militaire universel, garantissant ainsi que nous disposions d'un nombre suffisant de soldats entraînés pour défendre nos frontières. Chaque jeune homme sera formé à l'honneur de porter les armes pour le socialisme."
 WGR_Reimann_49_Reinforce_Duty_to_Country_and_Duty_to_Serve_Ideals_desc: "Le service dans l'Armée populaire nationale est plus qu'un simple entraînement militaire ; c'est une école du socialisme. Grâce à une éducation politique intensive et à la propagande, nous inculquerons aux soldats les idéaux du patriotisme, de l'internationalisme prolétarien et d'une loyauté inébranlable envers le Parti."
 WGR_Reimann_49_Campaign_of_Anti_Nazism_desc: "L'héritage du fascisme doit être éradiqué à la racine. Nous lançons une campagne nationale de dénazification qui va bien au-delà des efforts timides des Alliés occidentaux. Les anciens nazis occupant des postes dans l'administration, la justice et les affaires seront dénoncés et tenus pour responsables."
 WGR_Reimann_49_Accuse_the_CDU_FDP_and_DP_of_Neo_Nazism_desc: "Ce n'est pas un hasard si de nombreux anciens nazis ont trouvé refuge dans les rangs des partis bourgeois. Nous dénoncerons sans pitié ces liens et dénoncerons publiquement la CDU, le FDP et le DP comme des refuges du néofascisme. Quiconque s'oppose au socialisme se range du côté des anciens meurtriers."
 WGR_Reimann_49_Show_Trials_of_Former_Nazis_desc: "À titre d'exemple, des procès publics seront organisés contre d'anciens nazis de haut rang et leurs collaborateurs issus du monde industriel. Ces procès permettront non seulement de rendre justice, mais aussi d'éduquer la population sur les liens entre capitalisme et fascisme."
 WGR_Reimann_49_Enforce_Loyalty_Oaths_desc: "Aucune personne qui n'est pas loyale envers le nouvel État ne peut occuper un poste à responsabilité. Nous instaurerons des serments d'allégeance à la constitution socialiste et des tests de fiabilité politique pour tous les fonctionnaires, juges et officiers. Ceux qui hésitent ont quelque chose à cacher."
 WGR_Reimann_49_Spare_Wehrmacht_Generals_desc: "Certains généraux de l'ancienne Wehrmacht possèdent une expérience militaire inestimable. Bien que leur passé politique soit discutable, nous ne pouvons nous permettre de nous passer de leurs connaissances. Les officiers sélectionnés qui sont prêts à servir le nouvel État seront épargnés par les poursuites pénales et intégrés dans la nouvelle armée."
 WGR_Reimann_49_Campaign_of_Targeted_Surveillance_desc: "La lutte des classes se mène également dans le secret. Afin de débusquer les cellules contre-révolutionnaires et les réseaux d'espionnage occidentaux, nous allons lancer une campagne de surveillance généralisée. Le courrier, les communications téléphoniques et les individus suspects seront étroitement surveillés par les organes de sécurité de l'État."
 WGR_Reimann_49_Purge_Subversive_Elements_Within_the_Coalition_desc: "Tous les membres de la coalition au pouvoir ne sont pas des socialistes convaincus. Les « déviationnistes de droite » et les « sociaux-démocrates » au sein de nos rangs qui cherchent à ralentir le processus révolutionnaire doivent être identifiés et démis de leurs fonctions. L'unité de la direction doit être préservée à tout prix."
 WGR_Reimann_49_Neue_Kulturkampf_desc: "La lutte contre la bourgeoisie est également une lutte idéologique. Nous lançons une « Neue Kulturkampf » (nouvelle lutte culturelle) afin de repousser les influences réactionnaires et cléricales dans la société. L'athéisme scientifique, le réalisme socialiste et la philosophie marxiste seront promus afin de façonner le nouvel homme socialiste."
 WGR_Reimann_49_Condemn_Christian_Democratic_Ideals_desc: "L'idéologie démocrate-chrétienne sert de couverture au capitalisme, au cléricalisme et à l'anticommunisme. Nous condamnerons ses idéaux comme incompatibles avec le progrès et le véritable bien-être du peuple allemand, et nous saperons systématiquement son autorité morale."
 WGR_Reimann_49_Repeal_the_Reichskonkordat_with_the_Vatican_desc: "Le concordat signé par Hitler avec le Vatican est un vestige d'une époque sombre et le symbole d'une alliance contre nature entre l'Église et le fascisme. Nous mettrons fin unilatéralement à ce traité, mettant ainsi un terme aux privilèges dont bénéficie l'Église catholique en Allemagne. La séparation de l'Église et de l'État sera appliquée de manière radicale."
 WGR_Reimann_49_Ban_Religion_in_Schools_and_Tax_Churches_desc: "Les écoles doivent être des lieux d'éveil scientifique, et non d'endoctrinement religieux. L'enseignement religieux sera supprimé et remplacé par des cours sur le socialisme scientifique. Parallèlement, les églises perdront leurs privilèges fiscaux et seront traitées comme n'importe quelle autre entreprise."
 WGR_Reimann_49_Blackmail_Catholic_Bishops_and_Cardinals_desc: "Les chefs religieux sont nos adversaires les plus acharnés. Au fil des ans, nos services de sécurité ont rassemblé de nombreuses preuves sur le comportement répréhensible de nombreux ecclésiastiques de haut rang. Il est temps d'utiliser ces preuves pour les réduire au silence ou les contraindre à coopérer."
 WGR_Reimann_49_Purge_Religious_Figures_desc: "Certains ecclésiastiques ne se plieront jamais à notre volonté. Ceux qui continuent à résister ouvertement doivent être écartés de la vie publique. Des arrestations discrètes, des départs à la retraite forcés et la fermeture de leurs paroisses briseront l'opposition organisée de l'Église."
 WGR_Reimann_49_Advance_Ideals_of_Communist_German_Reunification_desc: "La division de l'Allemagne est une blessure qui ne peut guérir que sous la bannière du socialisme. Nous lancerons une campagne de propagande massive en faveur de la réunification avec la République démocratique allemande sur la base des valeurs marxistes-léninistes communes. Une Allemagne socialiste et unifiée est notre objectif historique."
 WGR_Reimann_49_Sign_the_1953_Reunification_Treaty_desc: "Le jour est venu. Après de longues négociations avec nos camarades de Berlin-Est et avec la bénédiction de Moscou, le traité de réunification va être signé. La division impérialiste de notre patrie est terminée. Désormais, il n'y a plus qu'une seule Allemagne : une Allemagne libre, souveraine et socialiste, un allié solide dans le camp de la paix."
