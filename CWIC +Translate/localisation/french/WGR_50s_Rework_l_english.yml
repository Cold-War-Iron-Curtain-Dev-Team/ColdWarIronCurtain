 WGR_Gehlen_Junta_Bundeswehr_Expand_Bundeswehr_Development: "Créer la Bundeswehr"
 WGR_Gehlen_Junta_Bundeswehr_Merge_BGS_Into_Bundeswehr: "Fusionner le BGS avec la Bundeswehr"
 WGR_Gehlen_Junta_Bundeswehr_Reinforce_Duty_to_Country_and_Duty_to_Serve_Ideals: "Renforcer le devoir envers le pays et le devoir de servir les idéaux"
 WGR_Gehlen_Junta_Bundeswehr_Nationalize_Heckler_and_Koch: "Nationaliser Heckler & Koch"
 WGR_Gehlen_Junta_Bundeswehr_Purchase_American_Pattons_and_HS30s: "Acheter des Pattons américains et des HS-30 suisses"
 WGR_Gehlen_Junta_Bundeswehr_Expand_to_Mandatory_Conscription: "Étendre à la conscription obligatoire"
 WGR_Gehlen_Junta_Bundeswehr_Form_Bundeswehr_Command_and_Staff_Academy: "Créer l'Académie de commandement et d'état-major de la Bundeswehr"
 WGR_Gehlen_Junta_Bundeswehr_Form_Wachtbataillon_and_Airborne_Bdes: "Former le Wachtbataillon et les brigades aéroportées"
 WGR_Gehlen_Junta_Bundeswehr_Form_the_Bundesmarine: "Former la Bundesmarine"
 WGR_Gehlen_Junta_Bundeswehr_Empower_the_Kriegsmarinewerft_Wilhelmshaven: "Renforcer la Kriegsmarine Wilhelmshaven"
 WGR_Gehlen_Junta_Bundeswehr_Rebuild_Shipbuilding_Facilities_in_Kiel: "Reconstruire les installations de construction navale à Kiel"
 WGR_Gehlen_Junta_Bundeswehr_Purchase_Corvettes_and_Destroyers: "Acheter des corvettes et des destroyers"
 WGR_Gehlen_Junta_Bundeswehr_Form_Luftwaffe: "Former la Luftwaffe"
 WGR_Gehlen_Junta_Bundeswehr_Receive_US_F84_Thunderstreaks: "Recevoir des F-84 Thunderstreaks américains"
 WGR_Gehlen_Junta_Bundeswehr_Form_Air_Defense_Groups: "Former des groupes de défense aérienne"
 WGR_Gehlen_Junta_Bundeswehr_Build_Bases_in_Buchel_and_Neuburg: "Construire des bases à Buchel et Neuburg"
 WGR_Gehlen_Junta_Bundeswehr_Expand_Bundeswehr_Development_desc: "Le moment est venu de nous libérer du carcan de l'après-guerre. Nous allons officiellement créer la Bundeswehr, une nouvelle force armée dédiée à la défense de l'Allemagne de l'Ouest. Il s'agira d'une armée moderne et professionnelle, prête à faire face aux menaces d'une nouvelle ère et à garantir notre souveraineté."
 WGR_Gehlen_Junta_Bundeswehr_Merge_BGS_Into_Bundeswehr_desc: "La Bundesgrenzschutz (garde-frontières fédérale) a admirablement contribué à la sécurité de nos frontières, mais une structure de commandement fragmentée constitue un handicap en ces temps incertains. En fusionnant la BGS avec la nouvelle Bundeswehr, nous unifierons nos forces armées sous un commandement unique et efficace, garantissant ainsi une défense plus cohérente et plus réactive."
 WGR_Gehlen_Junta_Bundeswehr_Reinforce_Duty_to_Country_and_Duty_to_Serve_Ideals_desc: "La force d'un soldat ne vient pas seulement de son arme, mais aussi de ses convictions. Nous inculquerons à nos nouvelles recrues un sens aigu du devoir et du patriotisme. Elles comprendront qu'elles ne servent pas un gouvernement, mais le peuple allemand et les idéaux d'une nation libre et forte. Ce fondement idéologique sera le pilier du moral de la Bundeswehr."
 WGR_Gehlen_Junta_Bundeswehr_Nationalize_Heckler_and_Koch_desc: "La sécurité de la nation ne peut être laissée au bon vouloir des entreprises privées. Heckler & Koch représente le summum de l'ingénierie allemande dans le domaine des armes légères. En plaçant cette entreprise vitale sous le contrôle de l'État, nous garantirons que la Bundeswehr soit équipée des meilleures armes, fabriquées selon nos spécifications exactes et exemptes de toute influence étrangère."
 WGR_Gehlen_Junta_Bundeswehr_Purchase_American_Pattons_and_HS30s_desc: "Pendant que notre industrie nationale se reconstruit, nous devons nous tourner vers nos alliés pour équiper notre corps blindé en plein essor. Les États-Unis peuvent nous fournir des chars Patton fiables, tandis que le HS-30 suisse servira de véhicule de combat d'infanterie performant. Cet apport immédiat de matériel moderne donnera à nos nouvelles divisions la puissance dont elles ont besoin."
 WGR_Gehlen_Junta_Bundeswehr_Expand_to_Mandatory_Conscription_desc: "Une armée professionnelle est un bon début, mais pour vraiment défendre nos frontières, nous avons besoin d'effectifs. Nous allons mettre en place un système de service militaire obligatoire. Tous les jeunes hommes valides seront appelés à servir leur pays, ce qui permettra de constituer un vaste réservoir de réservistes entraînés et de favoriser une société où la défense nationale est une responsabilité partagée."
 WGR_Gehlen_Junta_Bundeswehr_Form_Bundeswehr_Command_and_Staff_Academy_desc: "La qualité d'une armée dépend de celle de ses officiers. Afin de former une nouvelle génération de brillants chefs militaires, nous créerons une académie dédiée au commandement et à l'état-major. Les meilleurs et les plus brillants y étudieront l'art de la guerre, de la stratégie globale au commandement tactique, afin de garantir que la Bundeswehr soit dirigée par des hommes visionnaires et compétents."
 WGR_Gehlen_Junta_Bundeswehr_Form_Wachtbataillon_and_Airborne_Bdes_desc: "Au-delà de la ligne de front principale, nous avons besoin d'unités spécialisées pour les missions critiques. Le Wachbataillon (bataillon de garde) servira de force d'élite pour les cérémonies et la sécurité dans la capitale, symbole de notre nouveau prestige militaire. Parallèlement, nous formerons des brigades aéroportées, ce qui nous permettra de projeter rapidement notre puissance derrière les lignes ennemies et de répondre aux crises avec une force décisive."
 WGR_Gehlen_Junta_Bundeswehr_Form_the_Bundesmarine_desc: "La longue et fière tradition navale allemande doit renaître. Nous allons officiellement créer la Bundesmarine, une nouvelle marine chargée de protéger nos côtes, de sécuriser nos voies maritimes et de projeter notre influence dans la mer Baltique et la mer du Nord. Il s'agit là de la première étape vers le rétablissement de notre puissance maritime."
 WGR_Gehlen_Junta_Bundeswehr_Empower_the_Kriegsmarinewerft_Wilhelmshaven_desc: "Une marine a besoin de navires, et nos navires doivent être construits dans des chantiers navals allemands. Le chantier naval historique Kriegsmarinewerft à Wilhelmshaven sera revitalisé et agrandi. Grâce à des investissements publics et à une directive claire, ce chantier naval redeviendra le cœur de nos efforts de construction navale, un phare de l'ingénierie allemande."
 WGR_Gehlen_Junta_Bundeswehr_Rebuild_Shipbuilding_Facilities_in_Kiel_desc: "Wilhelmshaven ne suffit pas. Pour répondre aux exigences d'une marine moderne, les installations de construction navale de Kiel doivent également retrouver leur splendeur d'antan. En reconstruisant ces chantiers, nous augmenterons notre capacité de production et créerons un deuxième pôle majeur pour la puissance navale dans la Baltique."
 WGR_Gehlen_Junta_Bundeswehr_Purchase_Corvettes_and_Destroyers_desc: "Pendant que nos chantiers navals se mettent à niveau, notre nouvelle Bundesmarine a besoin de navires dès maintenant. Nous chercherons à nous procurer des corvettes et des destroyers modernes auprès des nations alliées. Cela nous permettra de disposer immédiatement d'une flotte de surface capable de patrouiller nos eaux et de former notre première génération de marins."
 WGR_Gehlen_Junta_Bundeswehr_Form_Luftwaffe_desc: "Le ciel allemand doit être défendu par les Allemands. Nous allons officiellement rétablir la Luftwaffe, une force aérienne moderne équipée pour défendre notre espace aérien et soutenir nos forces terrestres. Cette nouvelle armée de l'air sera fondée sur les principes de la supériorité technologique et d'une formation rigoureuse des pilotes."
 WGR_Gehlen_Junta_Bundeswehr_Receive_US_F84_Thunderstreaks_desc: "Pour doter notre nouvelle Luftwaffe d'un avantage décisif, nous nous tournerons vers nos alliés américains. Le F-84 Thunderstreak est un chasseur-bombardier à réaction performant qui constituera l'épine dorsale de nos premiers escadrons. Ce transfert de technologie permettra à nos pilotes de s'entraîner sur des équipements modernes et de mettre immédiatement en place une défense aérienne crédible."
 WGR_Gehlen_Junta_Bundeswehr_Form_Air_Defense_Groups_desc: "Une force aérienne puissante a besoin d'un réseau de défense aérienne terrestre robuste. Nous mettrons en place des groupes de défense aérienne spécialisés, équipés de radars et d'artillerie antiaérienne. Ce système intégré garantira qu'aucun avion hostile ne pourra menacer nos villes ou nos installations militaires sans rencontrer de résistance."
 WGR_Gehlen_Junta_Bundeswehr_Build_Bases_in_Buchel_and_Neuburg_desc: "Une force aérienne n'est rien sans ses bases. Nous construirons de nouvelles bases aériennes importantes à Büchel et Neuburg, stratégiquement situées pour assurer une couverture optimale de notre espace aérien. Ces installations modernes abriteront nos escadrons et serviront de centres névralgiques pour nos opérations de défense aérienne."
 WGR_Junta_Gehlen_National_Holiday_Question_desc: "La restauration et la mise en valeur des fêtes nationales traditionnelles allemandes devraient être un élément clé de notre politique culturelle, en célébrant les personnalités, les événements et les jalons culturels qui nourrissent la fierté de notre patrimoine, tout en évitant soigneusement ceux qui sont entachés par notre passé récent. Mais quelle fête devrait occuper la première place et devenir notre nouvelle fête nationale ?"
 WGR_Junta_Gehlen_Reinterpret_National_Symbolic_desc: "Les grands projets de travaux publics, tels que les nouvelles autoroutes, les ponts ou les monuments nationaux, peuvent avoir un double objectif : stimuler l'économie et créer des symboles visibles du progrès et des réalisations nationales."
 WGR_Junta_Gehlen_Condemm_Allied_Terror_Bombings_desc: "La plus grande terreur et destruction que ce pays ait connue depuis la guerre de Trente Ans a été causée par les raids terroristes injustes et destructeurs menés par les Alliés occidentaux sur les villes allemandes à la fin de la guerre. Même lorsque la guerre était déjà considérée comme gagnée par les Alliés, les raids terroristes sur les villages et les villes allemands n'ont pas cessé, visant des monuments culturels et des cibles civiles afin de causer autant de morts et de destructions que possible. Ce fut sans aucun doute la plus grande tragédie de l'histoire allemande, qui ne doit jamais se reproduire."
 WGR_Junta_Gehlen_Support_Jewish_Cultural_Revival_desc: "Une avancée modeste mais symbolique vers la réconciliation. Financer des initiatives visant à soutenir la reconstruction des communautés juives et des institutions culturelles en Allemagne, démontrant ainsi un engagement en faveur de la tolérance et de la diversité."
 WGR_Junta_Gehlen_The_Reconstruction_Issue_desc: "Une grande partie de notre tradition et de notre impressionnante culture a été perdue lors des raids aériens injustifiés des forces alliées. Compte tenu de nos problèmes financiers, nous devrions adopter une approche plus prudente et reconstruire les hôpitaux, les bureaux administratifs, les écoles et les immeubles d'habitation de manière minimaliste, pour des raisons pratiques. Cela se ferait toutefois au détriment de la magnifique architecture qui constituait un attrait majeur non seulement pour les touristes, mais aussi pour les Allemands eux-mêmes. Une architecture impressionnante financée par l'État domine les grandes villes depuis des décennies. Sans elle, notre identité nationale se transformerait en une ombre dystopique, infectée par le Bauhaus."
 WGR_Junta_Gehlen_Support_for_Vertriebene_desc: "La perte des territoires allemands à l'est de la ligne Oder-Neisse a été une catastrophe nationale. Des millions d'Allemands ont été déportés, persécutés et contraints de quitter leurs foyers, construits par des générations d'Allemands pendant des centaines d'années. Le moins que nous puissions faire est de leur donner la possibilité de se réorganiser en tant que société où ils peuvent pratiquer leurs normes et traditions culturelles locales. L'identité régionale ne devrait jamais disparaître."
 WGR_Junta_Gehlen_Open_the_Stauffenberg_Memorial_desc: "En l'honneur des courageux Allemands qui ont risqué leur vie pour renverser le régime national-socialiste, un nouveau mémorial sera érigé à Berlin Plötzensee, lieu de leur exécution, afin de montrer que le courage du cercle Stauffenberg prouve clairement que tous les Allemands ne soutenaient pas fanatiquement Hitler et le NSDAP."
 WGR_Junta_Gehlen_Ovecomplicate_Bureaucratic_Access_to_Archives_desc: "La bureaucratie allemande est connue pour ses procédures fastidieuses et ses dizaines d'exigences pour obtenir l'accès à certains documents. Comme nous souhaitons que seuls les historiens et chercheurs agréés aient accès à nos dossiers, nous rendrons la procédure aussi fastidieuse et éprouvante que possible pour les autres curieux qui aimeraient utiliser nos dossiers contre nous."
 WGR_Junta_Gehlen_Abolish_Allied_Control_Initiative_34_desc: "En dissolvant officiellement la Wehrmacht avec l'article 34 du Conseil de contrôle allié, cela a également détruit tout espoir d'indemnisation et de pension pour les soldats servant au sein de la Wehrmacht. Cette grande méfiance et cette résistance peuvent être utilisées pour mobiliser les masses d'anciens soldats de la Wehrmacht à des fins politiques. Nous leur promettrons des pensions réglementées par la loi fédérale et utiliserons cela comme un léger moyen de dénoncer l'occupation alliée."
 WGR_Junta_Gehlen_Reintegrate_former_NSDAP_Members_desc: "De nombreuses personnes étaient membres du NSDAP sans être des idéologues fervents, mais possédaient de précieuses compétences administratives ou techniques. Nous autoriserons avec prudence leur réintégration dans certaines fonctions non sensibles de la fonction publique afin de contribuer à la reconstruction nationale."
 WGR_Junta_Gehlen_Form_the_Vaterlandische_Front_desc: "Afin de canaliser la participation politique légitime tout en conservant le contrôle, nous encouragerons la formation d'un large « front » approuvé par l'État, composé d'organisations patriotiques et de partis non communistes. Cela permettra de fournir un exutoire supervisé à l'expression politique."
 WGR_Junta_Gehlen_Confiscate_KPD_Assets_desc: "Le vaste réseau de biens immobiliers, de fonds et de publications du Parti communiste interdit doit être saisi et réaffecté au profit de l'État. Ces ressources contribueront à nos efforts de relance nationale et de décommunisation."
 WGR_Junta_Gehlen_Bring_back_Constitutional_Court_desc: "Afin d'assurer un semblant d'ordre juridique et de contrôler le pouvoir exécutif – mais uniquement dans la mesure où cela est compatible avec la sécurité nationale –, la Cour constitutionnelle sera réactivée avec des pouvoirs soigneusement définis et limités."
 WGR_Junta_Gehlen_Empower_the_Chancellor_desc: "Dans tout futur cadre constitutionnel, les fonctions de chancelier et de président fédéral doivent être dotées de pouvoirs exécutifs importants, garantissant l'unité nationale et un leadership décisif, plutôt que de succomber à la paralysie parlementaire."
 WGR_Junta_Gehlen_Civilian_Cabinet_desc: "Si le leadership militaire reste primordial, certains ministères peuvent tirer profit de l'expérience de technocrates civils. La nomination de personnalités respectées et loyales à des postes tels que ceux des finances, de l'économie et des infrastructures peut renforcer l'efficacité et la légitimité."
 WGR_Junta_Gehlen_Form_the_Provisional_National_Council_desc: "Afin de légitimer l'administration et d'impliquer des éléments extérieurs à l'armée, un Conseil national provisoire sera mis en place. Composé de technocrates loyaux, d'industriels et de personnalités conservatrices de confiance, il conseillera le gouvernement militaire et préparera le terrain pour les futures structures politiques."
 WGR_Junta_Gehlen_Establish_Internal_Security_District_desc: "La stabilité de l'État n'est pas négociable. Afin de lutter contre les éléments subversifs et l'infiltration étrangère, nous allons créer des zones de sécurité spéciales dans des zones stratégiques. Sous le contrôle direct de nos services de renseignement, ces zones deviendront un bouclier impénétrable pour la sécurité intérieure de la république. Toute personne menaçant l'ordre sera identifiée, surveillée et neutralisée avant de pouvoir devenir un danger."
 WGR_Junta_Gehlen_Reopen_Hamburg_Stock_Exchange_desc: "Il faut rétablir au plus vite la confiance dans l'économie allemande. La réouverture de la Bourse de Hambourg est un signal clair envoyé au monde entier : l'Allemagne est à nouveau ouverte aux affaires. En relançant les flux de capitaux et en garantissant la sécurité des investisseurs, nous posons les fondements de la reconstruction et de la souveraineté économique de notre nation."
 WGR_Junta_Gehlen_Revive_the_Spirit_of_German_Engineering_desc: "Précision, durabilité et innovation : ces qualités ont fait la renommée mondiale de l'ingénierie allemande. Il est temps de faire revivre cet esprit. Grâce à un financement ciblé des universités techniques et de l'industrie de l'armement, nous inspirerons une nouvelle génération d'ingénieurs à créer les merveilles technologiques qui mèneront notre industrie et notre armée au sommet du monde."
 WGR_Junta_Gehlen_Revert_Nationalization_Policies_desc: "Le contrôle de l'État s'est révélé inefficace et paralysant pour le dynamisme industriel. Nous allons mettre fin à ces nationalisations malavisées. L'initiative privée et la concurrence du marché libre sont les moteurs de la prospérité. Les industries clés de notre pays seront rendues à ceux qui savent comment les rendre rentables et puissantes."
 WGR_Junta_Gehlen_Rationalize_agriculture_production_desc: "Une nation forte a besoin d'un approvisionnement alimentaire sûr. Les méthodes agricoles obsolètes constituent une menace pour notre autosuffisance. En encourageant la mécanisation, en optimisant les surfaces cultivées et en introduisant des techniques de gestion modernes, nous rationaliserons la production agricole. Chaque champ produira son rendement maximal pour le peuple allemand."
 WGR_Junta_Gehlen_Bundesbahn_Expansion_desc: "Les artères vitales de notre nation sont faites d'acier. Un réseau ferroviaire moderne et étendu est essentiel pour le transport rapide des troupes, l'approvisionnement de nos industries et la mobilité de nos citoyens. Nous allons lancer un programme ambitieux d'extension du réseau ferroviaire fédéral afin de garantir que chaque recoin de l'Allemagne soit facilement accessible, tant pour le commerce en temps de paix que pour la défense en temps de guerre."
 WGR_Junta_Gehlen_Promote_Volkswagen_desc: "La « voiture du peuple » est plus qu'un simple moyen de transport ; elle est le symbole d'une prospérité florissante et de la qualité allemande. Nous allons promouvoir massivement la production chez Volkswagen afin de stimuler les exportations et d'offrir aux citoyens allemands une mobilité abordable. Chaque Coccinelle vendue à l'étranger est une victoire pour notre économie."
 WGR_Junta_Gehlen_Reverse_Dismantling_of_IG_Farben_and_Reichswerke_Hermann_Goering_desc: "Le démantèlement forcé par les Alliés de nos plus grands conglomérats industriels a porté un coup délibéré à notre potentiel économique. Pour des raisons d'intérêt national, nous allons inverser ce processus. La puissance et l'expertise combinées de géants tels que IG Farben et Reichswerke sont indispensables à une reconstruction rapide et complète."
 WGR_Junta_Gehlen_Speed_Up_Reconstruction_desc: "Les ruines du passé nous rappellent sans cesse notre défaite. Nous ne vivrons plus dans les décombres et les cendres. Un tour de force national accélérera la reconstruction. Grâce à la discipline et au travail acharné allemands, nous rendrons nos villes plus belles et nos usines plus modernes que jamais."
 WGR_Junta_Gehlen_Increase_University_Funding_desc: "Les guerres du futur ne se décideront pas seulement sur les champs de bataille, mais aussi dans les laboratoires et les amphithéâtres. Nous augmenterons considérablement le financement de nos universités afin d'assurer la formation d'une nouvelle élite de scientifiques, d'ingénieurs et de fonctionnaires fidèles au nouvel ordre et qui mèneront l'Allemagne à la pointe du progrès technologique."
 WGR_Junta_Gehlen_Attract_Foreign_Capital_desc: "Notre reconstruction nécessite plus de capitaux que nous ne pouvons actuellement en lever nous-mêmes. En créant un climat d'investissement extrêmement attractif, caractérisé par la stabilité, une fiscalité avantageuse et la sécurité juridique, nous attirerons les capitaux étrangers. Chaque dollar et chaque franc qui affluent dans notre industrie constituent un élément supplémentaire pour bâtir une Allemagne forte."
 WGR_Junta_Gehlen_Modernize_Industrial_Infrastructure_desc: "Des machines obsolètes et des processus de production inefficaces freinent notre potentiel. Nous devons moderniser notre infrastructure industrielle de fond en comble. Les investissements dans de nouvelles centrales électriques, des réseaux de communication améliorés et des installations de fabrication à la pointe de la technologie permettront d'accroître la productivité et de jeter les bases de notre puissance économique et militaire."
 WGR_Junta_Gehlen_Bundesbank_desc: "Une monnaie stable est le fondement d'un État stable. Nous créerons une nouvelle banque fédérale indépendante dont la seule mission sera de lutter contre l'inflation et de garantir la valeur du mark. Jamais plus l'hyperinflation ne détruira la richesse de notre peuple et ne déstabilisera l'ordre politique."
 WGR_Junta_Gehlen_Prepare_For_Border_Skirmishes_desc: "La menace venue de l'Est est réelle et omniprésente. Nous ne pouvons pas nous permettre d'être pris au dépourvu face à des provocations. Des unités spécialement entraînées et équipées de la Garde fédérale des frontières seront mises en place afin de réagir rapidement et de manière décisive aux violations des frontières sans risquer une guerre ouverte. Nos frontières seront défendues."
 WGR_Junta_Gehlen_Appoint_New_Bundespraesident_desc: "Le temps des politiciens faibles et compromis est révolu. Le chef de l'État doit être une figure qui incarne l'autorité, l'unité nationale et la loyauté inconditionnelle à notre cause. Nous nommerons un nouveau président fédéral qui servira de symbole du nouvel ordre et restaurera la confiance du peuple dans ses dirigeants."
 WGR_Junta_Gehlen_Launch_Investigation_of_University_Personel_desc: "La liberté d'enseignement ne doit pas devenir la liberté de trahison. Nos universités sont des terrains fertiles pour les idées marxistes et libérales qui corrompent le moral de notre jeunesse. Nous allons lancer une enquête approfondie sur l'ensemble du personnel universitaire. Quiconque ne sera pas loyal envers l'État et ses valeurs sera écarté du service de notre avenir."
 WGR_Junta_Gehlen_Military_Cabinet_desc: "En ces temps décisifs, le sort de la nation ne peut dépendre des débats parlementaires. Le gouvernement sera transformé en un cabinet militaire, composé d'officiers compétents, d'experts du renseignement et de technocrates loyaux. L'efficacité, des chaînes de commandement claires et des actions décisives définiront désormais notre politique."
 WGR_Junta_Gehlen_Rehabilitation_of_Moderate_Communists_desc: "Tous ceux qui se disent communistes ne sont pas forcément des ennemis irréductibles de l'État. Beaucoup ont été séduits par de fausses promesses. Le pragmatisme nous dicte de faire la distinction entre les idéologues purs et durs et les idéalistes égarés. En offrant l'amnistie et un avenir aux communistes modérés, nous pouvons obtenir des renseignements précieux, diviser l'opposition et concentrer nos ressources sur les véritables ennemis."
 WGR_Junta_Gehlen_Absorb_Regional_Police_Forces_into_Bundespolizei_desc: "La nature fragmentée des forces de police régionales héritée de l'occupation rend difficile la mise en place d'efforts de sécurité unifiés. Nous devons intégrer ces forces sous une structure de commandement centrale, afin de garantir une application cohérente de l'autorité de l'État."
 WGR_Junta_Gehlen_Expand_Domestic_Surveillance_desc: "La menace de subversion communiste demeure, même après l'interdiction du KPD. Afin de protéger la nation, le BND doit étendre son influence à tous les aspects de la vie intérieure, en identifiant et en neutralisant toute poche résiduelle de dissidence ou tout agent hostile."
 WGR_Junta_Gehlen_Establish_Joint_Allied_German_Investigation_Board_desc: "Travailler avec les Alliés pour capturer Reimann et écraser la résistance communiste restante montrera non seulement à notre peuple notre engagement envers la sécurité nationale, mais aussi notre légitimité auprès des Alliés en matière d'intégration occidentale."
 WGR_Junta_Gehlen_an_End_to_Occupation_desc: "Les traités établissant la souveraineté allemande et son intégration dans l'Union de l'Europe occidentale et l'OTAN sont essentiels. Entamer rapidement des négociations avec l'Occident enverra un message clair à nos alliés, leur indiquant que l'Allemagne est un partenaire fiable, engagé dans la défense collective et la coopération multilatérale. Même si la méfiance reste grande, il est certainement possible de rétablir la confiance."
 WGR_Junta_Gehlen_Continue_Trade_with_Eastern_Block_desc: "Nous ne pouvons pas laisser notre reprise économique prospère être freinée par un fondamentalisme dogmatique. Même si nous ne partageons pas les mêmes opinions politiques que l'Union soviétique et ses partenaires, nous ne pouvons pas nous permettre de couper cette ligne vitale d'approvisionnement en biens et services pour notre économie."
 WGR_Junta_Gehlen_Enter_COCOM_desc: "Pour empêcher les biens stratégiques d'atteindre le bloc de l'Est, nous devons aligner strictement nos politiques d'exportation sur celles du Comité de coordination pour le contrôle multilatéral des exportations (COCOM). Cela démontrera notre engagement indéfectible envers l'endiguement économique du communisme, même si cela implique certains sacrifices économiques à court terme."
 WGR_Junta_Gehlen_Join_the_ECSC_Treaty_desc: "La participation à la CECA n'est pas seulement un avantage économique, c'est aussi une déclaration politique en faveur de la réconciliation et de l'intégration. En devenant un membre de premier plan et en partageant notre production industrielle de manière transparente, nous consolidons notre place dans une Europe pacifique et unie."
 WGR_Junta_Gehlen_Generaloberst_Reinhard_Gehlen_desc: "Pendant que le traître Reimann négociait la capitulation de notre nation à Berlin-Est, les patriotes passaient à l'action. Un coup d'État rapide et décisif mené par d'anciens officiers de la Wehrmacht et anticommunistes a permis de sécuriser l'État. Parmi leurs rangs, ils ont choisi un homme pour sortir l'Allemagne de cette crise : le Generaloberst Reinhard Gehlen. Génie du renseignement et anticommuniste convaincu, Gehlen est la main de fer dont l'Allemagne a besoin pour la ramener du bord du gouffre."
 WGR_Junta_Gehlen_Make_a_Speech_to_the_Nation_desc: "La population est confuse et effrayée. Gehlen s'adressera à la nation pour apaiser ses craintes et renforcer sa détermination. Son message sera clair : le gouvernement n'a pas été renversé, il a été excisé comme un cancer. Le complot du KPD visant à vendre l'Allemagne aux Soviétiques a été déjoué. L'ordre sera rétabli. L'Allemagne sera à nouveau forte. L'ère de la trahison est révolue ; l'ère de la restauration nationale a commencé."
 WGR_Junta_Gehlen_Abandon_Grundgesetz_desc: "La « loi fondamentale » qui nous a été imposée après la guerre s'est révélée être un échec. Ses faiblesses libérales ont été exploitées par les communistes pour s'emparer du pouvoir par des moyens légaux. Une constitution qui permet la destruction légale de la nation n'est pas une constitution qui mérite d'être préservée. Nous la suspendrons indéfiniment et gouvernerons par décret jusqu'à ce qu'un nouveau cadre plus solide puisse être mis en place."
 WGR_Junta_Gehlen_Prepare_Economic_Report_of_Nation_desc: "Les communistes ont eu la mainmise sur les leviers de notre économie. Nous devons maintenant procéder à un audit approfondi afin de comprendre toute l'étendue des dégâts. Un rapport complet détaillera les effets de leurs politiques de nationalisation et de planification centrale, nous fournissant ainsi une image claire de ce qui doit être défait."
 WGR_Junta_Gehlen_Release_Consumer_Goods_Industry_from_Nationalization_desc: "L'État n'a pas à gérer des boulangeries et des usines de chaussures. Nous allons immédiatement entamer le processus de privatisation des industries de biens de consommation saisies par le gouvernement Reimann. Le retour de ces entreprises dans le secteur privé stimulera la concurrence, améliorera la qualité et montrera au monde entier que l'Allemagne est à nouveau ouverte aux affaires."
 WGR_Junta_Gehlen_Pack_Coal_Steel_Industry_with_State_Directors_desc: "Si les industries de consommation peuvent être libérées, le cœur stratégique de notre nation – le charbon et l'acier – doit rester sous une direction ferme. Nous écarterons les idéologues communistes et les remplacerons par des directeurs loyaux, nommés par l'État. Ces industries ne serviront pas uniquement le profit, mais les intérêts stratégiques de l'État allemand."
 WGR_Junta_Gehlen_Ask_For_Marshall_Plan_Aid_desc: "Reimann a bêtement rejeté l'aide américaine, la qualifiant d'« impérialisme du dollar ». Nous allons corriger cette erreur historique. En demandant officiellement à adhérer au plan Marshall, nous obtiendrons non seulement les fonds nécessaires à notre reconstruction, mais nous enverrons également un signal clair à l'Occident : l'Allemagne est de retour dans le giron."
 WGR_Junta_Gehlen_End_Coal_Exports_To_France_and_DDR_desc: "Sous Reimann, notre charbon alimentait les industries de nos ennemis idéologiques et de nos voisins peu fiables. Ce n'est plus le cas. Nous allons mettre fin à toutes les exportations de charbon vers la soi-disant République démocratique allemande et vers la France. Nos ressources seront utilisées en priorité pour notre propre relance."
 WGR_Junta_Gehlen_Ban_Unions_and_Striking_desc: "Les syndicats sont devenus des foyers d'agitation communiste, utilisant les grèves pour saboter notre économie nationale. Pendant toute la durée de cette urgence nationale, tous les syndicats seront interdits et le fait de faire grève sera considéré comme un acte de subversion contre l'État. La nation doit travailler à l'unisson."
 WGR_Junta_Gehlen_Pursue_Limited_Free_Market_Ideals_desc: "Notre vision économique est pragmatique et forte. Nous favoriserons un système de libre marché limité, encourageant l'entreprise privée là où elle est efficace. Cependant, cela sera équilibré par une structure corporatiste, garantissant que toute activité économique soit finalement alignée sur l'intérêt national tel que défini par l'État."
 WGR_Junta_Gehlen_Program_of_Stability_and_Decommunization_desc: "L'infection communiste est profondément enracinée. Nous devons désormais nous lancer dans un programme complet de décommunisation afin de purger notre gouvernement, nos écoles et notre culture de l'influence marxiste. Ce sera une opération douloureuse mais nécessaire pour garantir la stabilité et la santé à long terme de la nation."
 WGR_Junta_Gehlen_Form_BND_From_Gehlen_Org_desc: "Pendant des années, l'organisation Gehlen a été notre bouclier invisible, recueillant des renseignements sur la menace soviétique. Il est temps de la faire sortir de l'ombre. Nous allons officiellement créer le Bundesnachrichtendienst (BND) à partir du noyau de l'organisation Gehlen, créant ainsi une agence de renseignement de classe mondiale qui sera nos yeux et nos oreilles pendant la guerre froide."
 WGR_Junta_Gehlen_Ban_the_KPD_desc: "Le Kommunistische Partei Deutschlands n'est pas un parti politique ; c'est une conspiration, une cinquième colonne au service d'une puissance étrangère hostile. Nous allons officiellement interdire le KPD, saisir ses biens et arrêter ses dirigeants. Son drapeau ne flottera plus jamais sur le sol allemand."
 WGR_Junta_Gehlen_Begin_Show_Trials_of_Communist_Sympathizers_desc: "Le peuple allemand doit comprendre que collaborer avec l'ennemi a des conséquences. Nous organiserons des procès publics pour les sympathisants communistes, les fonctionnaires et les agitateurs de haut rang. Leur trahison sera exposée au grand jour, servant d'avertissement sévère à tous ceux qui nourrissent encore de la loyauté envers Moscou."
 WGR_Junta_Gehlen_Condemn_Anti_Semitism_desc: "Pour distinguer notre nouveau nationalisme des erreurs du passé, nous devons être sans équivoque. Notre gouvernement condamne officiellement toutes les formes d'antisémitisme. La persécution des Juifs a été une tache sombre dans notre histoire, et nous veillerons à ce qu'une telle haine raciale n'ait pas sa place dans la nouvelle Allemagne que nous construisons."
 WGR_Junta_Gehlen_Try_Reimann_for_Treason_desc: "Max Reimann est toujours en fuite à Berlin-Est, où il sert de marionnette aux Soviétiques. Nous le jugerons par contumace pour le crime le plus grave qui soit : haute trahison. Un tribunal militaire examinera les preuves de son complot visant à dissoudre la République fédérale et le condamnera en conséquence. Son nom deviendra synonyme de trahison."
 WGR_Junta_Gehlen_Limit_Bundestag_Powers_desc: "Même s'il ralentit parfois l'État et permet aux communistes de monter en puissance, le Bundestag est l'institution la plus importante qui empêche les abus de pouvoir. Nous ne limiterons pas ses pouvoirs, laissant le leadership décisif entre les mains des mandats élus."
 WGR_Junta_Gehlen_Defend_Ourselves_In_UN_desc: "L'Union soviétique et ses sympathisants condamneront sans aucun doute nos actions sur la scène internationale. Nos diplomates doivent être prêts à défendre le coup d'État devant l'Assemblée générale des Nations unies, en le présentant non pas comme un acte antidémocratique, mais comme une défense nécessaire de la civilisation occidentale en première ligne de la guerre froide."
 WGR_Junta_Gehlen_Ask_for_US_UK_Support_desc: "Nous ne pouvons pas faire cavalier seul. Nous enverrons des émissaires à Washington et à Londres pour solliciter officiellement leur soutien politique et matériel. Nous devons les convaincre que notre gouvernement, bien que ferme, est le seul rempart fiable contre une prise de contrôle totale de l'Allemagne par les Soviétiques."
 WGR_Junta_Gehlen_Denounce_1953_Reunification_Agreement_desc: "Le soi-disant traité de réunification négocié par Reimann n'était pas un traité, mais un pacte suicidaire. Nous dénoncerons officiellement cet accord perfide et le déclarerons nul et non avenu. Toute réunification de l'Allemagne se fera selon nos conditions, en position de force, et non dans un esprit de capitulation."
 WGR_Junta_Gehlen_Stop_Diplomatic_Relations_with_Israel_desc: "Notre politique étrangère doit être ciblée et exempte de complications inutiles. L'État naissant d'Israël et ses conflits régionaux détournent notre attention de la menace principale : le communisme soviétique. Nous suspendrons nos relations diplomatiques afin de concentrer nos efforts sur le théâtre européen."
 WGR_Junta_Gehlen_Pursue_Commitment_to_NATO_desc: "L'Allemagne a toute sa place en tant que pilier de l'Organisation du traité de l'Atlantique Nord. Nous nous engagerons officiellement à rejoindre l'alliance, mettant notre position stratégique, notre puissance industrielle et notre potentiel militaire au service de la défense collective de l'Occident."
 WGR_Junta_Gehlen_Seek_Diplomatic_Relations_With_Spain_desc: "À Madrid, un gouvernement allié fait figure de rempart contre le communisme. Il est donc logique de chercher à resserrer les liens diplomatiques avec l'Espagne franquiste. Nous avons un ennemi commun et partageons la même conviction qu'il faut une main de fer pour diriger la nation."
 WGR_Junta_Gehlen_Declare_Communism_as_Greatest_World_Threat_desc: "Qu'il n'y ait aucune ambiguïté. Notre gouvernement déclarera que le communisme international, dirigé depuis Moscou, est la plus grande menace pour l'Allemagne, l'Europe et le monde. Cette déclaration sera le principe directeur de notre politique étrangère et intérieure."
 WGR_Junta_Gehlen_Handling_Reimann_Affair_desc: "Le traître Reimann reste sous la protection soviétique à Berlin-Est, symbole vivant de leur subversion. Nous devons résoudre cette situation afin de tourner la page de notre histoire et démontrer la portée de notre nouveau gouvernement."
 WGR_Junta_Gehlen_Ask_Soviet_Authorities_to_Extradite_Reimann_desc: "Nous commencerons par une demande diplomatique officielle. Une note sera envoyée aux autorités soviétiques, exigeant l'extradition immédiate de Max Reimann afin qu'il soit jugé pour haute trahison. Même si nous nous attendons à ce qu'elles refusent, le monde doit les considérer comme des protecteurs d'un criminel."
 WGR_Junta_Gehlen_Enter_Into_Discussions_with_Allied_Control_Council_desc: "Les quatre puissances détiennent toujours l'autorité à Berlin. Nous entamerons des discussions avec le Conseil de contrôle allié, présenterons notre dossier contre Reimann et ferons pression sur les Alliés occidentaux pour qu'ils utilisent leurs canaux afin d'assurer son retour. Cela permettra de tester leur engagement envers notre nouveau gouvernement."
 WGR_Junta_Gehlen_Organize_BND_CIA_Operation_desc: "La diplomatie risque d'échouer. Le BND, en coopération avec nos nouveaux amis de la CIA, va commencer à planifier une opération secrète. Si les Soviétiques ne livrent pas Reimann, nous irons le chercher."
 WGR_Junta_Gehlen_Augment_Allied_Forces_in_Berlin_desc: "Nos actions entraîneront inévitablement une montée des tensions à Berlin. Nous coordonnerons nos efforts avec les Alliés occidentaux afin de renforcer leurs garnisons dans la ville, en prévision d'une éventuelle réaction soviétique à notre consolidation du pouvoir."
 WGR_Junta_Gehlen_Step_Up_Counterinsurgency_Programs_in_Major_Cities_desc: "Les vestiges communistes tentent d'organiser la résistance dans nos centres industriels. Nous mettrons en œuvre des programmes anti-insurrectionnels rigoureux, en recourant aux services de renseignement, à des informateurs et à des interventions policières rapides afin de démanteler ces cellules avant qu'elles ne deviennent une menace réelle."
 WGR_Junta_Gehlen_Begin_Anti_Communist_Propaganda_Campaign_desc: "La bataille pour l'Allemagne est aussi une bataille pour gagner les cœurs et les esprits. Nous allons lancer une campagne de propagande massive, à l'aide d'affiches, de la radio et de films, afin de dénoncer la brutalité du communisme et de renforcer la loyauté du peuple envers le nouveau gouvernement national."
 WGR_Junta_Gehlen_Turn_SPD_Members_Against_Communists_desc: "Beaucoup au sein du SPD étaient des alliés mal à l'aise du KPD. Nous exploiterons cette division en offrant l'amnistie et même des postes au gouvernement aux sociaux-démocrates qui dénonceront publiquement leurs anciens partenaires communistes de la coalition et prêteront serment d'allégeance à l'État."
 WGR_Junta_Gehlen_Handling_Past_and_Present_of_Nazism_desc: "Pour construire une nouvelle identité nationale, nous devons naviguer prudemment dans l'héritage du passé récent. Notre approche doit être pragmatique, condamnant ce qui est nécessaire à l'acceptation internationale tout en sauvant ce qui est utile à l'unité nationale."
 WGR_Junta_Gehlen_Increase_Counterinsurgency_Operations_desc: "Les rapports des services de renseignement suggèrent que la résistance communiste clandestine est mieux organisée qu'on ne le pensait auparavant. Nous devons intensifier nos opérations anti-insurrectionnelles, en accordant aux forces de sécurité une plus grande latitude pour mener des raids, procéder à des arrestations et mener des interrogatoires afin d'éradiquer complètement le réseau."
 WGR_Junta_Gehlen_Deploy_Bundeswehr_Troops_desc: "La police seule ne suffit pas à garantir l'ordre. Nous déploierons des unités de la Bundeswehr nouvellement formée pour garder les grandes villes et les zones industrielles, affichant ainsi une forte présence militaire afin de dissuader toute tentative de rébellion ouverte."
 WGR_Junta_Gehlen_Request_CIA_MI6_Assistance_desc: "La résistance communiste clandestine reçoit un soutien et des directives de l'étranger. Nous demanderons l'aide technique et les conseils de la CIA américaine et du MI6 britannique. Leur expérience dans la lutte contre la subversion communiste mondiale sera inestimable."
 WGR_Junta_Gehlen_Crush_the_RAF_desc: "Les cellules organisées de terroristes et de saboteurs communistes menacent la stabilité de l'État. Nous allons lancer une campagne finale et décisive pour écraser ces organisations clandestines. Il n'y aura aucune pitié pour ceux qui prennent les armes contre l'Allemagne."
 WGR_Junta_Gehlen_Reinforce_Nationalist_Ideals_desc: "Le communisme a cherché à effacer notre identité nationale au profit d'un internationalisme fade. Nous allons contrer cela en renforçant les idéaux nationalistes dans les écoles et la vie publique. La fierté de l'histoire, de la culture et des réalisations allemandes sera le fondement de notre nouvelle société."
 WGR_Junta_Gehlen_Pan_German_Framework_desc: "Nous devons promouvoir un cadre culturel qui mette l'accent sur l'unité du peuple allemand, où qu'il vive. Cet idéal pangermanique servira de contrepoids culturel à la division artificielle de notre nation et de phare pour les Allemands vivant sous l'oppression communiste."
 WGR_Junta_Gehlen_Whitewash_Nazi_Officials_in_History_desc: "L'histoire doit servir le présent. Si les excès commis par les dirigeants du parti nazi seront condamnés, le rôle de nombreux officiers militaires et fonctionnaires sera réévalué dans nos programmes d'histoire. Leur expertise et leur service à l'État seront mis en avant plutôt que leurs affiliations politiques."
 WGR_Junta_Gehlen_Augment_Schnez_Truppe_Force_desc: "La « Schnez-Truppe », un réseau clandestin d'anciens combattants de la Wehrmacht qui se prépare à une éventuelle invasion soviétique, a prouvé sa loyauté. Nous allons secrètement renforcer cette force, en lui fournissant du matériel et en la reconnaissant comme une armée de réserve en attente."
 WGR_Junta_Gehlen_Condemn_the_Holocaust_desc: "Pour que le monde accepte la nouvelle Allemagne, nous devons condamner sans ambiguïté le plus grand crime commis par l'ancienne. Une déclaration officielle de l'État condamnera l'Holocauste comme une atrocité contre l'humanité. Il s'agit là d'une ligne morale qui ne peut être franchie."
 WGR_Junta_Gehlen_Sweep_Remaining_Truths_Away_desc: "De nouvelles enquêtes publiques sur le passé ne font que nous diviser et nous affaiblir alors que nous devons être unis contre le communisme. Nous clôturerons discrètement les enquêtes, classerons les documents et encouragerons la nation à « regarder vers l'avenir, pas vers le passé ». Certaines vérités doivent rester enfouies."
 WGR_Junta_Gehlen_Respond_to_World_Events_desc: "Le monde ne reste pas immobile. En tant qu'acteur clé de la guerre froide, notre ministère des Affaires étrangères doit être prêt à réagir rapidement et de manière décisive aux crises internationales, en gardant toujours à l'esprit les intérêts nationaux de l'Allemagne."
 WGR_Junta_Gehlen_Condemn_Soviet_Actions_in_Hungary_desc: "La répression brutale de l'insurrection hongroise par les Soviétiques est un cadeau pour nos propagandistes. Nous condamnerons avec véhémence les actions de l'URSS, en utilisant les événements de Budapest pour montrer au peuple allemand le vrai visage de l'idéologie qui a failli les anéantir."
 WGR_Junta_Gehlen_Offer_Asylum_to_Fleeing_Anti_Communists_desc: "Nous ouvrirons nos frontières aux réfugiés fuyant l'oppression communiste, en particulier ceux issus du soulèvement hongrois. Leur offrir l'asile ne sera pas seulement un geste humanitaire, mais aussi une puissante victoire propagandiste, présentant l'Allemagne comme un havre de liberté."
 WGR_Junta_Gehlen_Crack_Down_on_Communist_Underground_desc: "Inspirés par les événements en Hongrie, les vestiges du KPD pourraient tenter de semer le trouble. Nous utiliserons cela comme prétexte pour mener une répression finale contre tous les sympathisants communistes présumés, afin de garantir une sécurité interne absolue."
 WGR_Junta_Gehlen_Respond_to_Suez_desc: "Une crise a éclaté dans le canal de Suez, opposant nos alliés britanniques et français à l'Égypte et, plus important encore, les divisant des États-Unis. Notre réaction aura des conséquences importantes sur notre position au sein de l'alliance occidentale."
 WGR_Junta_Gehlen_Side_With_British_French_desc: "La loyauté doit être récompensée. Nous nous rangerons aux côtés de nos alliés européens, la Grande-Bretagne et la France. Soutenir leur position dans la crise de Suez renforcera nos liens avec eux et affirmera notre engagement en faveur d'une Europe occidentale forte et unie."
 WGR_Junta_Gehlen_Side_With_Americans_and_Nasser_desc: "L'avenir de l'Occident repose sur la puissance économique et militaire des États-Unis, et non sur des empires coloniaux vieillissants. Nous nous alignerons sur la position américaine concernant la crise de Suez. Cela risque de mécontenter Londres et Paris, mais il est essentiel de préserver nos relations avec Washington."
 WGR_Junta_Manstein_Generalleutnant_Erich_von_Manstein_desc:0 "L'un des plus brillants stratèges de la Seconde Guerre mondiale est sorti de l'ombre de sa retraite. Déçu par la faiblesse de la République de Bonn, Erich von Manstein a pris les commandes. Sous sa direction, la Bundeswehr ne sera plus une force défensive contrainte par des traités, mais l'avant-garde d'une fierté allemande retrouvée."
 WGR_Junta_Manstein_Rethink_Cultural_Policies_desc:0 "Pendant trop longtemps, nos institutions culturelles ont été paralysées par l'autoflagellation et les exigences des puissances étrangères. Il est temps de redéfinir le discours national. Nous ne devons pas nous concentrer sur la honte de la défaite, mais sur la bravoure des soldats et la résilience de l'esprit allemand."
 WGR_Junta_Manstein_Ban_Holocaust_Memorials_desc:0 "Ces monuments ne sont que des cicatrices permanentes dans la psyché nationale, destinées à inculquer un sentiment de culpabilité à des générations qui n'ont pas pris part à la guerre. Pour restaurer notre confiance nationale, ces rappels constants du passé doivent être démantelés."
 WGR_Junta_Manstein_Refuse_to_Ban_Swastikas_and_SS_Bolts_desc:0 "Les Alliés ont cherché à criminaliser les symboles afin de briser notre volonté. Nous affirmons que la liberté d'expression historique est primordiale. Bien que nous n'adoptions pas officiellement ces symboles comme insignes nationaux, la persécution des anciens combattants pour avoir affiché leur histoire prend fin aujourd'hui."
 WGR_Junta_Manstein_Accuse_Israel_of_Zionist_Scum_desc:0 "Les relations diplomatiques avec Tel Aviv sont devenues une voie à sens unique faite d'exigences et de réparations. Nous ne tolérerons plus leur ingérence dans nos affaires intérieures ni leurs leçons de morale. Il est temps de couper le cordon et de déclarer ouvertement notre position."
 WGR_Junta_Manstein_Expand_Myth_of_Clean_Wehrmacht_desc:0 "Le soldat au front s'est battu pour son pays, pas pour un parti politique. En promouvant officiellement la séparation entre la Wehrmacht et les crimes commis par les SS dans nos programmes scolaires et nos médias, nous rendons leur honneur aux millions de personnes qui ont servi leur pays avec dévouement."
 WGR_Junta_Manstein_Pardon_Nuremburg_Defendants_desc:0 "Les procès de Nuremberg n'étaient rien d'autre que la justice des vainqueurs, une mise en scène théâtrale de vengeance déguisée en justice. Afin de panser les blessures du corps des officiers, nous accordons une grâce totale à ceux qui sont encore emprisonnés. Leur expérience sera nécessaire pour les combats à venir."
 WGR_Junta_Manstein_Blame_Soviets_and_Allies_for_WWII_desc:0 "L'histoire est écrite par les vainqueurs, mais nous allons rectifier les faits. N'est-ce pas la menace soviétique qui a rendu nécessaire une attaque préventive ? Les Alliés occidentaux n'ont-ils pas ignoré nos appels à l'unité anti-bolchevique ? La responsabilité de l'escalade de la guerre n'incombe pas uniquement à l'Allemagne."
 WGR_Junta_Manstein_A_New_Strong_Germany_desc:0 "Les chaînes de l'occupation se relâchent. L'Allemagne se trouve à la croisée des chemins, et nous choisissons la voie de la force. Nous ne sommes plus un pion entre l'Est et l'Ouest, nous forgerons notre propre destin, soutenus par l'acier et le fer."
 WGR_Junta_Manstein_Massively_Expand_Bundeswehr_desc:0 "Les limites imposées aux effectifs militaires par les traités actuels sont insuffisantes pour assurer la défense de nos frontières en ces temps instables. Nous allons lancer une campagne de recrutement massive, appelant les jeunes à renouer avec les traditions martiales de leurs pères."
 WGR_Junta_Manstein_Integrate_BGS_and_Armed_Police_desc:0 "Nous ne pouvons pas attendre que les nouvelles recrues soient formées. Le Bundesgrenzschutz et les unités de police militarisées sont déjà disciplinés et armés. En les intégrant directement dans la structure de la Wehrmacht, nous renforçons instantanément nos divisions prêtes au combat."
 WGR_Junta_Manstein_Reinforce_Inner_German_Border_Defenses_desc:0 "L'Est l'appelle un rempart antifasciste ; nous le considérons comme la ligne de front de l'Europe. Nous coulerons du béton et poserons des mines non seulement pour arrêter une invasion, mais aussi pour démontrer qu'aucun centimètre carré du territoire fédéral ne sera cédé."
 WGR_Junta_Manstein_Form_Wachtbattalion_and_Airborne_Bdes_desc:0 "Les forces d'élite projettent une puissance bien supérieure à leur nombre. En reconstituant les traditions des Fallschirmjäger et en formant un bataillon de garde dédié au gouvernement, nous garantissons à la fois des capacités de réaction rapide et la sécurité du régime."
 WGR_Junta_Manstein_Bolster_Weapons_Vehicle_Production_desc:0 "Nos usines produisaient autrefois les meilleurs chars et pièces d'artillerie au monde. Les géants industriels de la Ruhr doivent être immédiatement rééquipés pour la production de guerre. Le « miracle économique » va désormais servir la machine militaire."
 WGR_Junta_Manstein_Reuse_Old_Wehrmacht_Weapons_desc:0 "Les entrepôts à travers le pays sont remplis d'équipements « obsolètes » confisqués ou cachés après 1945. Un Kar98k tire toujours aussi bien, et un MP40 est toujours aussi mortel. Nous réintroduirons ces armes dans nos réserves en expansion jusqu'à ce que la nouvelle production rattrape son retard."
 WGR_Junta_Manstein_Prepare_for_War_Exercise_Schwarz_desc:0 "Les entrepôts à travers le pays sont remplis d'équipements « obsolètes » confisqués ou cachés après 1945. Un Kar98k tire toujours aussi bien, et un MP40 est toujours aussi mortel. Nous réintroduirons ces armes dans nos réserves en expansion jusqu'à ce que la nouvelle production rattrape son retard."
 WGR_Junta_Manstein_Meet_with_Allied_Officials_desc:0 "Les Hauts Commissaires s'attendent à être servis. Ils seront déçus. Nous les avons convoqués non pas pour leur demander leur permission, mais pour les informer de la nouvelle réalité à Bonn. La mentalité d'occupation prend fin dès maintenant."
 WGR_Junta_Manstein_Break_Off_Agreements_with_French_Benelux_desc:0 "La Communauté du charbon et de l'acier est une laisse destinée à maintenir l'industrie allemande sous la coupe des intérêts français. Nous nous retirons de ces accords. Les ressources allemandes serviront au réarmement de l'Allemagne, et non au chauffage des foyers parisiens."
 WGR_Junta_Manstein_Refuse_to_Join_NATO_desc:0 "Washington cherche de la chair à canon pour sa guerre contre Moscou. Nous n'enverrons pas nos fils mourir pour les intérêts américains sous les ordres d'un général américain. L'Allemagne se défendra, selon ses propres conditions."
 WGR_Junta_Manstein_Denounce_1953_Agreement_desc:0 "Les accords conclus par l'administration précédente concernant la réunification et les frontières ont été conclus sous la contrainte. Nous les déclarons nuls et non avenus. Nous ne reconnaissons aucune frontière imposée par des puissances étrangères."
 WGR_Junta_Manstein_Continue_Relations_with_Spain_Portugal_desc:0 "Alors que les démocraties nous rejettent, Madrid et Lisbonne comprennent la nécessité d'un leadership fort et de l'anticommunisme. Le renforcement des liens avec Franco et Salazar nous permet de disposer de partenaires commerciaux essentiels et d'une profondeur stratégique en dehors de la sphère de l'OTAN."
 WGR_Junta_Manstein_Bolster_German_Claims_Over_Berlin_desc:0 "Berlin est le cœur de l'Allemagne, et sa division est une plaie ouverte. Nous réaffirmons notre revendication sur l'ensemble de la ville, Est et Ouest. Nous allons renforcer notre présence et notre financement à Berlin-Ouest, afin d'en faire une forteresse de notre idéologie derrière les lignes ennemies."
 WGR_Junta_Manstein_Threaten_to_Start_German_Conflict_desc:0 "La diplomatie a échoué. Le monde ignore nos griefs légitimes à ses risques et périls. Nous nous mobilisons à la frontière. Si nos revendications en matière de souveraineté et de territoire ne sont pas satisfaites, nous sommes prêts à mettre le feu aux poudres en Europe une fois de plus."
 WGR_Junta_Manstein_A_Bridge_Too_Far_desc:0 "Nous avons poussé jusqu'au bout. Nos paris risqués ont aliéné nos alliés et provoqué nos ennemis. Les ordres ont été donnés, et les troupes sont en marche. Comme les parachutistes à Arnhem, soit nous avons assuré notre avenir, soit nous nous sommes condamnés à la destruction. Les dés sont jetés."
 WGR_Junta_Speidel_Expand_Military_to_Counter_Soviet_Threat_desc:0 "Ce n'est qu'une question de temps avant que les Russes ne se présentent aux portes de Bonn. Pour empêcher cela, nous devons aller plus loin que la simple mise en place de forces défensives spécialisées. La nouvelle armée allemande jouera un rôle crucial dans la libération de l'Europe et la chute du communisme."
 WGR_Junta_Speidel_Expand_Domestic_Rifle_and_Air_Production_desc:0 "Mehr! Speidel. Wir brauchen mehr Waffen! (Plus ! Speidel. Nous avons besoin de plus d'armes !)"
 WGR_Junta_Speidel_Form_Special_Forces_and_Airborne_Brigades_desc:0 "Le plan initial de Manstein, qui prévoyait la mise en place de bataillons de garde et d'unités aéroportées, était une excellente idée, que nous continuerons à envisager. Les unités aéroportées nous aideront à recueillir des informations, tandis que des unités spécialisées dans la reconnaissance et la logistique garantiront une efficacité maximale sur le champ de bataille."
 WGR_Junta_Speidel_Deal_with_Bundeswehr_desc:0 "La relation entre le gouvernement militaire et les forces armées actives doit être clarifiée. Nous devons veiller à ce que la chaîne de commandement reste professionnelle et indépendante des manœuvres politiques."
 WGR_Junta_Speidel_Join_IMF_desc:0 "La stabilité économique passe par l'intégration internationale. L'adhésion au FMI stabilisera notre monnaie et nous permettra d'obtenir les crédits nécessaires à la réalisation de nos ambitieux projets de reconstruction."
 WGR_Junta_Speidel_Discuss_Contributing_to_UN_Peacekeeping_desc:0 "Le retour de l'Allemagne sur la scène internationale peut être consolidé par son engagement en faveur de la paix. Nous étudions actuellement la possibilité d'envoyer des observateurs et des unités médicales pour soutenir les missions des Nations Unies à l'étranger."
 WGR_Junta_Speidel_Foster_Relations_with_European_Neutrals_desc:0 "De la Suisse à la Suède, il y a beaucoup à apprendre de ceux qui ont traversé la guerre froide sans prendre parti. Nous renforcerons nos liens avec ces nations afin de créer un bloc de stabilité."
 WGR_Junta_Speidel_Remain_in_Western_Sphere_desc:0 "Malgré nos changements internes, notre cœur bat à l'Ouest. Nous devons réaffirmer notre engagement envers les valeurs de la communauté atlantique et la protection du monde libre."
 WGR_Junta_Speidel_Open_New_Embassies_Around_the_World_desc:0 "L'ère de l'isolement est révolue. En ouvrant des missions diplomatiques en Afrique, en Asie et dans les Amériques, nous rétablissons la présence de l'Allemagne en tant que partenaire mondial dans les domaines du commerce et de la diplomatie."
 WGR_Junta_Speidel_Condemn_the_East_German_Govt_desc:0 "Nous ne pouvons rester silencieux alors que nos frères et sœurs de l'Est vivent sous un régime fantoche. Cette condamnation officielle signale que nous ne reconnaissons pas la légitimité du régime du SED."
 WGR_Junta_Speidel_Allow_Allied_Supervision_of_the_Junta_desc:0 "Pour prouver que nous ne sommes pas une dictature militaire en devenir, nous autoriserons les observateurs alliés à surveiller nos processus administratifs et à s'assurer que nous progressons vers un retour à la démocratie."
 WGR_Junta_Speidel_Maintain_Bundeswehr_As_Defense_Force_desc:0 "Notre armée existe dans un seul but : protéger le territoire allemand. En codifiant son rôle de force purement défensive, nous rassurons nos voisins et concentrons notre doctrine sur le maintien de la ligne de défense."
 WGR_Junta_Speidel_Enforce_Volunteer_Only_Policies_desc:0 "Une armée professionnelle est une armée fiable. En nous en tenant pour l'instant à un modèle exclusivement volontaire, nous garantissons que chaque homme en uniforme est là par choix, attaché aux valeurs démocratiques du nouvel État."
 WGR_Junta_Speidel_Receive_American_Anti_Tank_Weapons_and_TDs_desc:0 "Pour contrer les formations blindées massives de l'Est, nous avons besoin de plus que de simples chars. Les livraisons américaines de roquettes antichars et de chasseurs de chars spécialisés donneront à notre infanterie une chance de se battre."
 WGR_Junta_Speidel_Receive_American_Tanks_and_Armored_Vehicles_desc:0 "Le rugissement des moteurs américains retentira bientôt sur nos terrains d'entraînement. Ces Pattons et ces véhicules blindés de transport de troupes constituent la base d'acier sur laquelle nos nouvelles divisions mécanisées seront construites."
 WGR_Junta_Speidel_Pass_the_Conscription_Act_desc:0 "Le temps d'un petit noyau professionnel est révolu. Pour remplir nos obligations envers la défense occidentale, nous devons faire appel à la jeunesse de la nation pour qu'elle accomplisse son service militaire."
 WGR_Junta_Speidel_Expand_Bundeswehr_Commmand_Staff_Academy_desc:0 "À mesure que l'armée s'agrandit, le besoin en leadership augmente également. L'agrandissement de l'académie nous permet de former un plus grand nombre d'officiers d'état-major aux complexités des opérations multinationales modernes."
 WGR_Junta_Speidel_Seek_Peaceful_Uses_Only_desc:0 "Pour apaiser les craintes internationales, nous nous engageons publiquement à ce que nos recherches nucléaires soient exclusivement consacrées à la production d'électricité et au progrès scientifique. L'atome doit servir les hommes, et non les détruire."
 WGR_Junta_Speidel_Build_German_Federal_Reactor_Plant_desc:0 "Un monument dédié à l'ingénierie allemande. La construction d'une centrale nucléaire nationale est la première étape vers l'indépendance énergétique et une véritable leçon magistrale en physique nucléaire."
 WGR_Junta_Speidel_Request_American_Nuclear_Assistance_desc:0 "Dans le cadre du programme « Atoms for Peace », nous pouvons tirer parti de l'expertise américaine. Grâce à leurs conseils et à leur combustible enrichi, notre cheminement vers le statut d'État doté de capacités nucléaires sera considérablement accéléré."
 WGR_Junta_Speidel_Prepare_for_Nuclear_Civil_Defense_desc:0 "Si le pire devait arriver, nous devons être prêts. Construire des bunkers et former la population à des exercices de « se baisser et se couvrir » permettra à la nation allemande de survivre même à un conflit nucléaire."
 WGR_Bundeswehr_Speidel_Form_Air_Defense_Groups_desc:0 "La guerre moderne se déroule dans trois dimensions. En mettant en place des unités anti-aériennes spécialisées équipées de radars et de canons à tir rapide, nous créons un bouclier au-dessus de nos centres industriels."
 WGR_Junta_Speidel_Negotiate_End_Of_Occupation:0 "Négociation de notre souveraineté"
 WGR_Junta_Speidel_Negotiate_End_Of_Occupation_desc:0 "Le statut d'occupation doit prendre fin pour que l'Allemagne redevienne une nation pleinement souveraine. Nous demanderons aux Alliés occidentaux de se joindre à nous à Bielefeld pour mener des négociations qui aboutiront à la restitution totale du pouvoir national au peuple allemand et à ses représentants."
 WGR_Bundeswehr_Speidel_Build_Bases_in_Buchel_and_Neuburg_desc:0 "Les emplacements stratégiques nécessitent des installations permanentes. Ces nouvelles bases aériennes serviront de centres névralgiques pour nos intercepteurs, garantissant des temps de réponse rapides dans les secteurs sud et ouest."
 WGR_Bundeswehr_Speidel_Rebuild_Shipbuilding_Facilities_in_Kiel_desc:0 "Kiel possède une longue tradition d'excellence navale. En investissant dans la reconstruction de ses cales et docks bombardés, nous offrons à la Bundesmarine l'espace nécessaire à la construction d'une nouvelle génération de navires."
 WGR_Bundeswehr_Speidel_Purchase_Corvettes_and_Destroyers_desc:0 "Alors que nos chantiers navals nationaux sont en cours de reconstruction, nous ne pouvons laisser nos eaux sans défense. L'achat d'escorteurs éprouvés auprès de nos alliés nous permettra de disposer immédiatement d'un bouclier contre toute incursion dans la Baltique."
 WGR_Junta_Speidel_Hold_Meeting_With_Allies_desc:0 "Nous devons convaincre les puissances occidentales que la junte est un partenaire fiable dans la lutte contre le bolchevisme, et non un régime militaire voyou."
 WGR_Junta_Speidel_Join_the_UN_desc:0 "En prenant place à l'Assemblée générale, l'Allemagne sort de l'ombre et réintègre la communauté internationale en tant qu'acteur souverain et responsable."
 WGR_Junta_Speidel_Take_Neutral_FP_Approach_desc:0 "L'Allemagne a trop longtemps été le champ de bataille de l'Europe. En adoptant une politique de neutralité, nous pouvons servir de tampon entre les superpuissances et nous concentrer sur notre propre redressement."
 WGR_Junta_Speidel_Accept_Limited_Number_of_Hungarian_Refugees_desc:0 "Le soulèvement en Hongrie a montré au monde le vrai visage du contrôle soviétique. En offrant l'asile à ceux qui fuient la répression, nous démontrons notre engagement humanitaire."
 WGR_Junta_Speidel_Report_on_the_Countrys_Progress_desc:0 "La transition touche à sa fin. Il est temps de présenter un bilan final des réalisations de la Junta et de décider de l'avenir de la nation allemande."
 WGR_Junta_Speidel_Present_New_Junta_Economic_Plan_desc:0 "Une stratégie économique centralisée et guidée par l'armée se concentrera sur l'industrie lourde et la reconstruction, afin de sortir le pays de la crise d'après-guerre grâce à une efficacité sans faille."
 WGR_Junta_Speidel_Expand_Rail_Networks_Between_Major_German_Cities_desc:0 "La logistique est la colonne vertébrale du commerce et de la guerre. La réparation et l'extension des réseaux qui ont succédé à la Reichsbahn permettront de rapprocher davantage les différentes régions du pays."
 WGR_Junta_Speidel_Allow_Limited_Workers_Organizations_desc:0 "Afin d'éviter les grèves et les troubles, nous autoriserons la création de syndicats agréés par l'État. Cela permettra aux travailleurs de faire entendre leur voix tout en garantissant que la junte conserve le contrôle de la production."
 WGR_Junta_Speidel_Address_the_Nation_on_the_Junta_desc:0 "Dans une allocution radiotélévisée diffusée à l'échelle nationale, Speidel soulignera la nécessité d'une intervention militaire temporaire et réaffirmera son engagement à rétablir l'ordre."
 WGR_Junta_Speidel_Stand_Down_Bundeswehr_Troops_desc:0 "Afin d'apaiser les tensions avec la population et les observateurs internationaux, nous renverrons les unités non essentielles dans leurs casernes. Les rues doivent être surveillées par la police, pas par des chars."
 WGR_Junta_Speidel_Propose_Plan_of_Limited_Stabilization_desc:0 "Nous ne pouvons pas tout régler d'un seul coup. En se concentrant sur les services essentiels et la sécurité alimentaire, la Junta vise à gagner « le cœur et l'esprit » d'une population épuisée."
 WGR_Junta_Speidel_Bar_Nazi_Officials_from_Civil_Service_desc:0 "L'administration doit être irréprochable. Toute personne ayant un passé compromettant au sein du NSDAP sera démise de ses fonctions influentes afin de garantir une bureaucratie véritablement professionnelle."
 WGR_Junta_Speidel_Place_Limits_on_Communist_Activities_desc:0 "Pour empêcher une révolution interne guidée par Moscou, nous devons surveiller étroitement et limiter les activités des agitateurs qui cherchent à saper l'autorité de la junte."
 WGR_Junta_Speidel_Enable_Democracy_in_Germany_Once_Again_desc:0 "L'objectif ultime de la Junte a toujours été de servir de pont. Après avoir sécurisé la nation, nous préparons désormais les premières élections libres de l'ère post-crise."
 WGR_Junta_Speidel_Reshuffle_the_Junta_desc:0 "Pour gouverner efficacement, nous devons veiller à ce que le conseil militaire soit composé d'hommes qui privilégient la stabilité plutôt que leurs ambitions personnelles. Un remaniement consolidera la vision de Speidel pour une Allemagne en transition."
 WGR_Junta_Speidel_Meet_with_the_Soviets_and_East_Germans_desc:0 "La désescalade est une nécessité, pas un choix. En ouvrant un canal temporaire vers Moscou et Berlin-Est, nous visons à prévenir un point de rupture pendant que nous mettons de l'ordre dans nos affaires."
 WGR_Junta_Speidel_Appoint_Hans_Speidel_as_Chairman_desc:0 "La junte a besoin d'une voix unique et autoritaire. En tant qu'homme d'intelligence et de prestige militaire, Speidel est le seul choix possible pour diriger la nation en cette période d'incertitude."
 WGR_Junta_Speidel_Ban_Swastikas_and_Nazi_Imagery_desc:0 "Les fantômes du passé doivent être exorcisés. Pour regagner la confiance internationale et la paix intérieure, tous les symboles de l'ancien régime doivent être éliminés de la sphère publique."
 WGR_Junta_Speidel_Try_Manstein_for_Fascist_Activities_desc:0 "Personne n'est au-dessus des lois, pas même les anciens héros de la Wehrmacht. En traduisant Manstein en justice, nous montrons au monde entier que la nouvelle Allemagne assume ses responsabilités."
 WGR_Junta_Speidel_Clarify_Truth_of_Wehrmacht_desc:0 "Nous devons trouver un équilibre difficile : reconnaître les crimes commis pendant la guerre tout en préservant la dignité des millions de soldats qui ont simplement fait leur devoir."
 WGR_Junta_Speidel_Build_Additional_Defenses_on_Inner_German_Border_desc:0 "Le rideau de fer n'est pas seulement une métaphore. Du béton et de l'acier doivent être déployés le long de la frontière afin de garantir que toute incursion « accidentelle » soit stoppée avant qu'elle ne dégénère."
 WGR_Junta_Speidel_Introduce_Elite_Defensive_Training_desc:0 "La qualité prime sur la quantité. Nos troupes doivent être entraînées à des tactiques de retardement et de perturbation, transformant chaque forêt et chaque village en une forteresse contre des forces supérieures en nombre."
 WGR_Junta_Speidel_Subsidize_BMW_VW_and_BASF_desc:0 "Les moteurs de l'industrie allemande ne doivent jamais s'arrêter. En accordant des subventions publiques à nos géants industriels, nous garantissons l'emploi et l'avance technologique nécessaires à une défense moderne."
 WGR_Junta_Speidel_Expand_Coal_Sector_in_Ruhr_desc:0 "Le charbon reste le moteur de notre indépendance énergétique. La Ruhr doit être exploitée au maximum pour alimenter la reprise économique du pays et son appareil militaire en pleine expansion."
 WGR_Junta_Speidel_Begin_German_Nuclear_Program_desc:0 "À l'ère des géants atomiques, une nation sans recherche nucléaire est une nation sans avenir. Nous allons nous engager dans notre propre voie vers le cœur de l'atome."
 WGR_Junta_Speidel_Consider_Nuclear_Weapons_for_Defense_desc:0 "L'impensable doit être pensé. Si les forces conventionnelles ne peuvent garantir notre survie face à l'Orient, nous devons évaluer la nécessité d'une dissuasion nucléaire."
 WGR_Junta_Speidel_Support_Nasser_and_NAM_desc:0 "En se rapprochant du Mouvement des pays non alignés, l'Allemagne peut trouver une troisième voie qui lui évite de se soumettre totalement à Washington ou à Moscou."
 WGR_Junta_Speidel_Join_NATO_desc:0 "Notre sécurité est inextricablement liée à celle de l'Occident. L'adhésion à l'Organisation du Traité de l'Atlantique Nord est la dernière étape pour garantir qu'une attaque contre Bonn soit considérée comme une attaque contre Washington et Londres."
 WGR_Road_to_Democracy_Face_the_Road_to_Democracy_desc: "Le gouvernement militaire provisoire a atteint son objectif principal : la menace communiste a été neutralisée et la nation stabilisée. Cependant, le corps des officiers reconnaît qu'un régime militaire permanent n'est ni souhaitable ni viable. Afin d'assurer l'avenir à long terme de l'Allemagne et son intégration dans le monde occidental, la junte elle-même doit désormais ouvrir la voie à un retour à une démocratie stable dirigée par des civils."
 WGR_Road_to_Democracy_Empower_Conservative_Political_Parties_desc: "Le retour à la démocratie doit être géré avec prudence afin d'éviter une résurgence du chaos qui a permis aux extrémistes de prospérer. Le conseil militaire s'accorde à dire que les partis responsables, patriotiques et farouchement anticommunistes doivent constituer le fondement de la nouvelle république. Les ressources de l'État seront utilisées pour soutenir les campagnes des mouvements conservateurs et démocrates-chrétiens, afin de leur garantir une position favorable pour diriger le pays."
 WGR_Road_to_Democracy_Grapple_With_Past_of_Nazism_desc: "Une nouvelle démocratie allemande ne peut être construite sur le déni. Pour préserver notre réputation internationale et le caractère moral de notre nation, nous devons faciliter une confrontation honnête avec l'ère nazie. Ce processus permettra de différencier la nouvelle Allemagne conservatrice des totalitarismes du passé et de la menace communiste que nous venons de vaincre."
 WGR_Road_to_Democracy_Make_Speech_to_German_People_desc: "Le président du Conseil militaire provisoire s'adressera à la nation. Son discours annoncera officiellement l'intention du gouvernement de rétablir le régime civil et présentera une feuille de route claire vers des élections libres et équitables. Il servira d'appel à une citoyenneté responsable et de rejet ferme de toutes les formes d'extrémisme politique, exhortant le peuple à s'unir pour construire une Allemagne sûre et libre."
 WGR_Road_to_Democracy_Invite_UN_To_Observe_Elections_desc: "Les circonstances de notre accession au pouvoir ont suscité l'attention de la communauté internationale. Afin de prouver la sincérité de notre transition démocratique, le gouvernement provisoire adressera une invitation officielle aux Nations Unies pour qu'elles envoient des observateurs. Le monde entier sera invité à constater que les prochaines élections se déroulent de manière libre et équitable, consolidant ainsi la légitimité de la nouvelle république."
 WGR_Road_to_Democracy_Urge_Campaigning_and_Freedom_of_Expression_desc: "Une élection légitime nécessite un échange ouvert d'idées. La junte publiera un décret levant les restrictions d'urgence sur les activités politiques pour tous les partis approuvés et non subversifs. La campagne ouverte et la liberté d'expression seront encouragées, permettant ainsi au peuple allemand de faire un choix éclairé pour son avenir."
 WGR_Road_to_Democracy_Initiate_the_1958_Provisional_Federal_Elections_desc: "La mission de l'armée en tant que gardienne temporaire de l'État touche à sa fin. Le gouvernement provisoire annonce officiellement la tenue d'élections fédérales. L'appareil étatique sera mobilisé afin de garantir le bon déroulement du processus. Le pouvoir est sur le point d'être transféré des casernes vers les urnes, ouvrant ainsi un nouveau chapitre pour la République fédérale."
 WGR_Road_to_Democracy_Speidel_Face_the_Road_to_Democracy_desc: "Le gouvernement militaire provisoire a atteint son objectif principal : la menace communiste a été neutralisée et la nation stabilisée. Cependant, le corps des officiers reconnaît qu'un régime militaire permanent n'est ni souhaitable ni viable. Afin d'assurer l'avenir à long terme de l'Allemagne et son intégration dans le monde occidental, la junte elle-même doit désormais ouvrir la voie à un retour à une démocratie stable dirigée par des civils."
