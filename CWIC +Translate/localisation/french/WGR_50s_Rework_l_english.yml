 WGR_Adenauer_57_Recognize_the_Line_Via_Non_Aggression_Pacts_with_Poland: "Reconnaître la ligne via les pactes de non-agression avec la Pologne"
 WGR_Adenauer_57_Continue_Unrelenting_Refusal_to_Recognize_the_Line: "Continuer à refuser catégoriquement de reconnaître la ligne"
 WGR_Adenauer_57_International_Affairs: "Affaires internationales"
 WGR_Schumacher_49_Bundeskanzler_Kurt_Schumacher: "Chancelier fédéral Kurt Schumacher"
 WGR_Schumacher_49_Bundeskanzler_Kurt_Schumacher_desc: "À l'issue d'une élection serrée, Kurt Schumacher, président des sociaux-démocrates, remporte les élections fédérales de 1949, battant son adversaire Konrad Adenauer d'une voix. À la tête du nouveau gouvernement, son administration prévoit la reconstruction, la lutte contre le communisme, mais met également l'accent sur les réformes sociales et le soutien à la classe ouvrière, tout en se montrant quelque peu hésitante quant à l'intégration à l'Occident."
 WGR_Schumacher_49_Form_a_Coalition_with_the_Centre_Party: "Relancer la coalition de Weimar"
