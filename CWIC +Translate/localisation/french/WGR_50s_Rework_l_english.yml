 WGR_StartEvent.1.t: "Battu, mais jamais vaincu."
 WGR_StartEvent.1.d: "La vie a été dure pour les Allemands. Confrontée à la défaite lors de la Grande Guerre et accablée par le poids du traité de Versailles de 1919, la République allemande n'aurait pas pu connaître pire situation. L'inflation, les tentatives de coup d'État, les assassinats politiques et le totalitarisme de l'extrême gauche et de l'extrême droite faisaient que la chute de la démocratie en Allemagne n'était qu'une question de temps.\n\nLorsque le NSDAP (Nationalsozialistische Deutsche Arbeiterpartei) a pris le pouvoir, il a aboli les structures constitutionnelles qui auraient pu remettre en cause son autorité. La période de 1933 à 1945 a peut-être été marquée par une stabilité économique au cours des premières années, mais au prix de l'abandon des libertés civiles et du fait que le peuple allemand a finalement été entraîné une fois de plus dans une autre guerre qui a coûté la vie à des millions d'Allemands, pour que le pays soit ensuite confronté à une humiliation totale, comme en témoigne l'occupation par la France, l'URSS, la Grande-Bretagne et les États-Unis d'Amérique.\n\nAujourd'hui, cependant, nous avons une nouvelle chance d'instaurer à nouveau la démocratie allemande. Le Conseil parlementaire, composé d'anciens démocrates actifs et de résistants, s'est réuni à Bonn pour rédiger une constitution pour la nouvelle Allemagne. Une constitution qui protège activement la démocratie en Allemagne et qui, espérons-le, permettra d'éviter une nouvelle prise de pouvoir autoritaire. Les premières élections auront lieu prochainement."
 WGR_StartEvent.1.a: "Für ein demokratisches Deutschland !"
 WGRElection.1.d: "Les dernières élections véritablement libres au Reichstag ont eu lieu en 1932, avant que la démocratie allemande ne soit démantelée sous le régime nazi. Le processus a commencé avec la loi d'habilitation de 1933, qui a concentré le pouvoir législatif entre les mains du chancelier, contournant ainsi le Reichstag. Après la mort du président du Reich Paul von Hindenburg, Hitler a fusionné les fonctions de chancelier et de président, créant ainsi le poste de Führer et éliminant tout contrôle démocratique. Aujourd'hui, pour la première fois depuis près de deux décennies, la véritable démocratie est sur le point de faire son retour.\n\nLes élections fédérales de 1949 seront les premières élections nationales libres organisées dans les régions occidentales de l'Allemagne depuis 1932. Deux partis dominants se disputent le contrôle du nouveau gouvernement.\n\nL'Union chrétienne-démocrate, dirigée par l'ancien maire de Cologne Konrad Adenauer, se présente comme un rempart contre le socialisme et le fascisme. La CDU prône l'intégration occidentale, la mise en place d'une économie sociale de marché, la réforme monétaire et le rétablissement de la souveraineté allemande en tant que puissance égale parmi les grandes puissances européennes. Le parti tire une grande partie de ses dirigeants d'anciens politiciens du Zentrum et cherche à reconstruire l'Allemagne dans un cadre démocratique et pro-occidental.\nLe Parti social-démocrate, dirigé par Kurt Schumacher, ancien combattant et prisonnier des camps de concentration, est l'un des plus anciens mouvements politiques allemands et le seul parti à s'être opposé à l'unanimité à la loi d'habilitation de 1933. Le SPD rejette à la fois le communisme et les vestiges du national-socialisme, se positionnant comme le défenseur de la démocratie et des droits des travailleurs. Le parti prône un secteur social fort, la protection des droits du travail, l'éradication de l'ancienne influence nazie et une approche prudente des relations avec les puissances occidentales afin de préserver la souveraineté allemande.\nLe Parti communiste allemand, qui bénéficierait de l'aide soviétique, reste un parti minoritaire capable d'exercer une certaine influence. Il prône la fin de l'occupation et le départ des puissances occidentales d'Allemagne, tout en appelant à la réunification de l'Allemagne sous un régime socialiste.\n\nCette élection déterminera non seulement le leadership de l'Allemagne, mais façonnera également son rôle dans la guerre froide. Les enjeux sont importants et la participation devrait être significative. Comme l'a souligné le candidat de la CDU, Konrad Adenauer, dans un récent discours :\n\n« Le 14 août 1949, personne ne restera chez soi. »"
 WGRElection.2.d: "Les prochaines élections fédérales de 1953 marquent la deuxième élection fédérale de la République fédérale d'Allemagne et la première dans un État ouest-allemand pleinement souverain après la ratification du Traité général. Avec l'intensification de la guerre froide et la transformation rapide du paysage politique et économique allemand, cette élection déterminera si le pays poursuit sur la voie de l'intégration occidentale ou s'il s'oriente vers une approche plus indépendante ou plus sociale.\n\nLa CDU, dirigée par le chancelier Konrad Adenauer, se présente aux élections en tant que force dominante de la politique ouest-allemande. Le gouvernement Adenauer a supervisé une reprise économique rapide dans le cadre de l'économie sociale de marché, des négociations sur le réarmement et le renforcement des liens avec l'OTAN et les alliés occidentaux.\n\nLe SPD, toujours dirigé par Erich Ollenhauer après le décès de Kurt Schumacher, reste le principal adversaire de la CDU. Tout en continuant à rejeter le communisme, le SPD critique le réarmement et le rapprochement étroit d'Adenauer avec l'Occident, craignant que cela ne compromette la souveraineté allemande. Le parti prône des politiques sociales plus ambitieuses, une meilleure protection des travailleurs et une politique étrangère plus neutre. Cependant, avec l'accélération de la croissance économique sous le gouvernement dirigé par la CDU, le SPD a du mal à convaincre les électeurs de la nécessité d'un changement.\n\nD'autres partis, tels que le Parti libéral-démocrate et le Parti allemand, jouent un rôle influent mais secondaire, agissant souvent comme faiseurs de rois dans les négociations de coalition. Pendant ce temps, le Parti communiste allemand est en difficulté sous le contrôle du gouvernement et face à l'opposition croissante de l'opinion publique à l'égard des politiques alignées sur celles de l'Union soviétique, son influence ne cessant de décliner."
 WGRElection.2.da: "Les élections fédérales de 1953 sont cruciales, car le pays s'apprête à choisir son orientation pour les années à venir. Après quatre années de gouvernement dirigé par le SPD, le paysage politique a considérablement changé. La guerre froide s'est intensifiée, la reprise économique de l'Allemagne s'est accélérée et les débats sur le réarmement, l'intégration européenne et la politique sociale se sont intensifiés.\n\nLes sociaux-démocrates mènent campagne en s'appuyant sur leur bilan en matière de reconstruction de l'Allemagne, avec des politiques sociales fortes, une approche prudente de l'intégration occidentale et une opposition au réarmement rapide. Le Chancelier [WGR.GetLeader]poursuit la vision de Schumacher d'une Allemagne démocratique et indépendante, équilibrant la coopération avec l'Occident tout en conservant une forte identité nationale.\n\nLa principale force d'opposition, l'Union chrétienne-démocrate, dirigée par Konrad Adenauer, plaide en faveur d'un engagement plus fort en faveur de l'intégration occidentale, d'une économie de marché libre et d'un réarmement plus rapide face aux menaces soviétiques. Adenauer et ses alliés ont critiqué la réticence du SPD à adhérer pleinement à l'OTAN et sa politique étrangère prudente, arguant que seule une alliance occidentale solide peut garantir la sécurité et la souveraineté de l'Allemagne. La CDU a gagné du terrain ces dernières années, séduisant ceux qui estiment que la croissance économique doit primer sur les politiques sociales menées par l'État.\n\nD'autres partis, tels que le Parti libéral-démocrate et le Parti allemand, continuent de jouer un rôle important mais secondaire, agissant souvent comme partenaires potentiels de coalition. Quant au Parti communiste allemand, dirigé par Max Reimann, il reste une force marginale, confronté à une pression politique accrue et à un déclin de son soutien populaire dans une Allemagne qui s'aligne de plus en plus sur l'Occident."
 WGRElection.3.d: "Les élections fédérales de 1957 marquent un tournant décisif pour la République fédérale d'Allemagne. Huit ans après la fondation de l'Allemagne de l'Ouest, le pays a connu une croissance économique remarquable, une stabilisation politique et une intégration croissante au sein de l'alliance occidentale. Alors que les Allemands se rendent aux urnes, le résultat de cette élection déterminera l'orientation du pays dans un contexte de tensions liées à la guerre froide et de débats incessants sur le réarmement, l'unité européenne et la politique sociale.\n\nLa CDU, sous la direction du chancelier Konrad Adenauer, brigue un nouveau mandat. Après avoir mené l'Allemagne à travers le Wirtschaftswunder, la CDU mène campagne sur un programme axé sur la stabilité, la prospérité et la poursuite de l'intégration occidentale. Le gouvernement Adenauer a supervisé la formation de la Communauté économique européenne, l'adhésion à l'OTAN et le rétablissement de la Bundeswehr, positionnant l'Allemagne de l'Ouest comme un acteur clé en Europe occidentale.\n\nUne fois de plus, les sociaux-démocrates contestent la ligne suivie par Adenauer, plaidant pour une approche plus équilibrée entre l'Est et l'Ouest et pour des mesures sociales plus importantes afin de lutter contre les inégalités économiques. Le SPD a critiqué la politique de réarmement de la CDU, mettant en garde contre une dépendance accrue vis-à-vis de l'alliance militaire occidentale. Tout en étant attaché à la démocratie et en rejetant le communisme, le SPD prône une politique étrangère plus indépendante et une meilleure protection des travailleurs.\n\nD'autres partis, tels que le Parti libéral-démocrate (FDP) et le Parti allemand (DP), restent importants mais peinent à s'imposer face à la domination de la CDU et du SPD. Quant au KPD, il reste interdit depuis sa dissolution en 1956, ce qui exclut toute représentation communiste de ces élections. \n\nLa CDU étant largement favorite, la question clé reste posée : Adenauer obtiendra-t-il la majorité absolue ou les négociations de coalition détermineront-elles la composition du prochain gouvernement ?"
 WGRElection.4.d: "Après cinq années de gouvernement militaire, l'Allemagne est à nouveau prête pour des élections provisoires. Avec la scission du SPD, les deux partis en lice sont désormais l'Union chrétienne-démocrate dirigée par Konrad Adenauer et la coalition entre le Parti allemand et le Parti libéral-démocrate dirigée par Heinrich Hellwege et Franz Blücher. Qui l'emportera ?"
 Starting.1.d: "Le 23 mai 1949 restera à jamais une date mémorable dans l'histoire allemande ! Aujourd'hui, le travail du Conseil parlementaire s'est concrétisé avec la signature et la promulgation de la Grundgesetz. Composé de membres des parlements des Länder de l'Allemagne de l'Ouest, le Conseil a rédigé le document et l'a approuvé, par 53 voix contre 12, le 8 mai. Il a ensuite été soumis aux parlements des Länder, où il a finalement été approuvé par tous, à l'exception du Land de Bavière. Ce document, qui prévoit la formation du gouvernement fédéral allemand et accorde des droits fondamentaux à tous ses citoyens, marque la fondation de la République fédérale d'Allemagne."
 Starting.2.d: "(1) La République fédérale d'Allemagne est un État fédéral démocratique et social.\n(2) Tout pouvoir public émane du peuple. Il est exercé par le peuple lors d'élections et de référendums, ainsi que par des organes législatifs, exécutifs et judiciaires distincts.\n(3) La législation est limitée par la Constitution, l'exécutif et l'administration de la justice par la législation et la loi.\n\nL'article 20 est l'un des articles fondamentaux de la Loi fondamentale. Il décrit la structure gouvernementale de la République fédérale et garantit la démocratie, le républicanisme, la responsabilité sociale et le fédéralisme, de manière plus directe que l'ancienne Constitution de Weimar. De plus, l'article 20 a le privilège de ne pas pouvoir être supprimé de la Loi fondamentale, car il garantit la démocratie pour tous."
 Starting.3.d: "« Pour l'instant, la présente Loi fondamentale s'applique sur le territoire des Länder de Bade, Bavière, Brême, Grand Berlin, Hambourg, Hesse, Basse-Saxe, Rhénanie-du-Nord-Westphalie, Rhénanie-Palatinat, Schleswig-Holstein, Wurtemberg-Bade et Wurtemberg-Hohenzollern. Elle entrera en vigueur dans les autres parties de l'Allemagne lors de leur adhésion. »\n\nL'article 23 porte sur les Länder allemands, ou États fédérés. Les Länder ont toujours joué un rôle important dans le gouvernement unitaire allemand, et cet article permet à d'autres États allemands de jure, non inclus dans le champ d'application de la Loi fondamentale, de déclarer leur adhésion, ou Beitritt, à une date ultérieure. Cette disposition vise à donner aux Länder une chance équitable d'adhérer à la République fédérale, à condition qu'ils soient reconnus par le gouvernement fédéral et qu'ils aient déclaré leur adhésion par libre autodétermination. Il s'agit véritablement d'un tournant décisif dans les relations entre le gouvernement fédéral et les Länder dans la politique allemande."
 Adenauer49.0.t: "[GetNewspaperHeader]Konrad Adenauer élu chancelier fédéral de l'Allemagne de l'Ouest"
 Adenauer49.0.d: "Au lendemain des élections fédérales allemandes de 1949, Konrad Adenauer et les chrétiens-démocrates ont réussi à former une coalition avec le Parti libéral-démocrate et le Parti allemand afin d'obtenir la majorité au Parlement ouest-allemand. Battant les sociaux-démocrates et le Parti communiste, Adenauer a exprimé l'engagement de sa coalition en faveur de la démocratie, de la reprise économique et de l'alignement avec l'Occident. Ils se sont engagés à renforcer l'économie allemande grâce au plan Marshall, tout en résistant à l'influence soviétique et en cherchant à resserrer les liens avec les États-Unis, la Grande-Bretagne et la France. Les dirigeants occidentaux ont salué son élection comme une force stabilisatrice, tandis que l'Union soviétique l'a condamné comme une « marionnette de l'impérialisme américain ». Malgré cette victoire, des défis subsistent, notamment les difficultés économiques, les populations déplacées et la question du réarmement. Adenauer vise à guider l'Allemagne vers une plus grande souveraineté tout en maintenant une opposition ferme à l'Allemagne de l'Est soutenue par l'Union soviétique."
 Adenauer49.0.a: "Ce sera un plaisir de travailler avec lui."
 Adenauer49.0.b: "Encore une autre marionnette américaine."
 Adenauer49.0.c: "Une coalition conservatrice pour l'Allemagne."
 Adenauer49.1.d: "Le débat sur la nouvelle capitale de la République fédérale fait rage au sein du nouveau Bundestag. Actuellement, la capitale est située dans la ville occidentale de Bonn, sur les rives du Rhin. Cependant, les membres du SPD ont plaidé en faveur d'un transfert de la capitale vers la ville de Francfort, arguant que celle-ci dispose déjà des installations nécessaires et que cela coûterait 95 millions de marks de moins. Les membres de la CDU s'y opposent toutefois, arguant que Bonn est la capitale provisoire et que la capitale ne devrait pas être déplacée avant la réunification de toute l'Allemagne. Où la capitale devrait-elle être située ?"
 Adenauer49.2.d: "« Je crains que les Alliés occidentaux, au lieu de mener une politique européenne, ne s'engagent dans une politique d'intérêt qui tend plutôt à soutenir le régime autoritaire d'Adenauer qu'à permettre son remplacement par un régime démocratique... Ce dont nous devons débattre et voter aujourd'hui n'est rien d'autre qu'un test visant à déterminer si la Loi fondamentale n'est qu'un bout de papier et si la majorité peut continuer à la bafouer... »\n\nCela a suscité des applaudissements du côté du SPD, ainsi que des interjections et des huées du côté CDU de la chambre du Bundestag. Herr Doktor Arndt, du SPD, a poursuivi son discours.\n\n« Nous pensions être en route vers une démocratie parlementaire et nous nous retrouvons en route vers une monarchie sans constitution... Monsieur le Chancelier, nous ne vous laisserons pas oublier ce serment ! »\n\nLe chancelier Adenauer prit la parole, soulignant que les syndicats allemands soutenaient le gouvernement dans sa volonté sincère de signer l'accord de Petersberg, même si celui-ci prévoyait le démantèlement de certaines industries. Cela suscita des questions de la part de l'opposition SPD, qui remit en cause la validité de cette affirmation. Le débat continua de faire rage, mais une décision devait être prise rapidement."
 Adenauer49.20.t: "[GetNewspaperHeader]L'Allemagne de l'Ouest signe l'accord de Petersberg"
 Adenauer49.20.d: "Dans un moment historique pour la République fédérale d'Allemagne nouvellement créée, la chancellerie et les représentants des Alliés occidentaux ont signé aujourd'hui l'accord de Petersberg, ouvrant la voie à la réintégration progressive de l'Allemagne de l'Ouest dans la communauté internationale. Cet accord, signé à l'hôtel Petersberg près de Bonn, marque une étape précoce mais significative dans le redressement et la souveraineté du pays après la guerre.\nAux termes de l'accord, la Haute Commission alliée a accepté d'assouplir certaines restrictions imposées à l'industrie allemande, permettant ainsi une augmentation de la production de charbon et d'acier, une mesure cruciale pour la reconstruction économique. L'Allemagne de l'Ouest sera également autorisée à adhérer à des organisations internationales et à jouer un rôle plus actif dans les affaires européennes. Cependant, cet accord a un coût : Bonn s'est engagée à démanteler plusieurs installations industrielles datant de la guerre et a officiellement renoncé à toute revendication de réarmement, du moins pour le moment.\nMalgré la controverse, la signature de l'accord de Petersberg est un signal clair indiquant que l'Allemagne de l'Ouest commence à se défaire de son statut d'État occupé. Si le chemin vers l'indépendance totale reste long, l'accord conclu aujourd'hui marque la première étape vers la construction de l'avenir de la nation sur la scène internationale."
 Adenauer49.20.a: "Splendide"
 Adenauer49.20.b: "Que cherchent-ils à accomplir ?"
 Adenauer49.20.c: "Notre façon de soutenir l'intégration occidentale."
 Adenauer49.21.t: "[GetNewspaperHeader]L'Allemagne de l'Ouest rejette l'accord de Petersberg"
 Adenauer49.21.d: "Dans un revirement de situation surprenant, la République fédérale d'Allemagne a refusé de signer l'accord de Petersberg, plongeant les relations entre l'Allemagne de l'Ouest et les Alliés occidentaux dans l'incertitude. Le gouvernement fédéral, soutenu par une majorité du Bundestag, a rejeté les termes de l'accord, les jugeant trop restrictifs, arguant qu'ils maintiendraient l'Allemagne de l'Ouest dans une situation de dépendance économique et de contrainte politique sous la surveillance continue des Alliés.\n\nL'accord, proposé par la Haute Commission alliée, visait à assouplir certaines restrictions industrielles tout en garantissant que l'Allemagne reste désarmée et se conforme aux directives alliées. Cependant, le législateur allemand s'est opposé à la poursuite du démantèlement des installations industrielles clés et à l'absence d'une voie claire vers la pleine souveraineté.\n\nAvec la montée des tensions, l'avenir reste incertain. Les Alliés chercheront-ils à imposer des mesures plus strictes ou retourneront-ils à la table des négociations ? Et les Allemands pourront-ils maintenir leur position sans mettre en péril leur fragile économie d'après-guerre ? Une chose est sûre, le chemin vers la souveraineté de l'Allemagne de l'Ouest vient de se compliquer considérablement."
 Adenauer49.21.a: "Ils ne peuvent pas être sérieux."
 Adenauer49.21.b: "Une décision importante pour l'Allemagne."
 Adenauer49.21.c: "Nous avons pris notre décision."
 Adenauer49.3.d: "Le 29 décembre 1948, les trois Alliés occidentaux ainsi que les trois pays du Benelux ont publié le Statut de la Ruhr, un système spécial régissant le fonctionnement de l'industrie de la Ruhr. L'Autorité de la Ruhr prévue par le Statut, un organe composé de représentants des six puissances, a été créée le 28 avril 1949, avec notamment la participation de représentants de la République fédérale en tant que membres de l'Autorité.\n\nCela a provoqué un conflit d'opinions entre le gouvernement et, surtout, l'opposition sociale-démocrate sur une question étroitement liée au problème du démantèlement, à savoir celle de la reconnaissance de l'Autorité de la Ruhr par l'envoi d'un représentant allemand. Dans la pratique, cette Autorité aurait pour fonction de contrôler l'ensemble de l'économie allemande en raison de l'importance prépondérante de la région industrielle de la Ruhr pour toute la vie économique en Allemagne.\n\nLors d'une réunion du cabinet, le chancelier Adenauer expliqua que la participation au Statut aurait des conséquences favorables ; si nous refusions, cela reviendrait à faire obstruction et entraînerait donc un refroidissement des relations avec les Alliés.\n\nCependant, l'autre argument était qu'au niveau national, l'adhésion ne serait pas populaire et que le soutien du gouvernement serait compromis, en particulier lors des élections régionales en Rhénanie-du-Nord-Westphalie. Quelle voie l'Allemagne va-t-elle suivre ?"
 Adenauer49.30.t: "L'Allemagne de l'Ouest exige le retrait complet de l'Autorité de la Ruhr"
 Adenauer49.30.d: "La République fédérale d'Allemagne a officiellement demandé la dissolution de l'Autorité internationale pour la Ruhr (IAR) et le retour du contrôle total des ressources industrielles de la Ruhr au gouvernement ouest-allemand. Le chancelier Adenauer et son administration affirment que le maintien d'une surveillance étrangère sur la Ruhr constitue une atteinte à la souveraineté allemande et un obstacle à la stabilité économique à long terme.\n\nLa position allemande repose sur trois points clés.\nTout d'abord, Bonn insiste sur le fait que la reprise économique ne peut être réalisée sans une autonomie totale sur la production de charbon et d'acier. La Ruhr reste l'épine dorsale de l'industrie allemande, et les restrictions imposées à sa gestion entravent la reconstruction nationale.\nDeuxièmement, les Allemands considèrent l'Autorité de la Ruhr comme un vestige de l'occupation d'après-guerre. Avec la mise en place d'un gouvernement démocratique, ils estiment qu'il n'y a plus aucune justification à un contrôle extérieur sur les ressources allemandes.\nTroisièmement, les dirigeants ouest-allemands ont assuré que la reprise du contrôle de la Ruhr n'entraînerait pas un nationalisme économique, mais renforcerait au contraire la coopération au sein des institutions européennes émergentes."
 Adenauer49.30.a: "Leur engagement à Petersberg a montré que nous pouvons leur faire confiance."
 Adenauer49.30.b: "Ils nous ont déjà dénoncés à Petersberg, il n'y aura pas de nouvelle politique d'apaisement."
 Adenauer49.31.t: "La Haute Commission alliée refuse notre demande !"
 Adenauer49.31.d: "La réponse de la Haute Commission alliée fut catégorique : la demande de l'Allemagne de l'Ouest visant à reprendre le contrôle de la Ruhr avait été rejetée. Le message, reçu à Bonn, invoquait des préoccupations sécuritaires et économiques persistantes comme principales raisons de cette décision. Selon les Alliés, la Ruhr était trop cruciale pour la stabilité européenne pour être placée sous l'administration exclusive de l'Allemagne à ce stade.\n\nLes Français, en particulier, restaient opposés à tout contrôle allemand sans restriction sur les vastes capacités industrielles de la région, craignant une répétition des conflits passés. L'Autorité internationale pour la Ruhr existante resterait en place, garantissant que la production de charbon et d'acier soit distribuée sous la supervision des Alliés. Au lieu d'un rejet catégorique, les Alliés encouragèrent l'Allemagne à rechercher une plus grande influence par le biais de l'intégration économique européenne, en particulier la Communauté européenne du charbon et de l'acier proposée."
 Adenauer49.31.a: "Scheisse."
 Adenauer49.32.t: "La Haute Commission alliée accepte notre demande !"
 Adenauer49.32.d: "Après des semaines de délibérations, la Haute Commission alliée a finalement pris une décision concernant l'avenir de la Ruhr. Le message, transmis à la Chancellerie fédérale à [WGR.Capital.GetCapitalVictoryPointName], confirma ce que beaucoup au sein du gouvernement Adenauer espéraient : le retour progressif du contrôle sur le cœur industriel de l'Allemagne. Cette décision n'était pas sans conditions. Les Alliés ont clairement indiqué que le transfert se ferait par étapes soigneusement contrôlées, afin de garantir que le pouvoir économique de la région ne soit pas exercé sans contrôle.\n\nSelon les termes de l'accord, l'Allemagne de l'Ouest assumerait le contrôle administratif de la Ruhr dans un délai de 12 à 18 mois, mais la surveillance internationale serait maintenue, en particulier en ce qui concerne l'exportation de charbon et d'acier. Les puissances alliées attendaient de l'Allemagne qu'elle participe pleinement aux structures économiques européennes émergentes, en particulier à la Communauté européenne du charbon et de l'acier, afin de garantir que les ressources de la Ruhr servent les intérêts plus larges du continent. Les Français, toujours méfiants à l'égard de la puissance industrielle de l'Allemagne, restèrent prudents mais finirent par accepter le compromis."
 Adenauer49.32.a: "Très bien."
 Adenauer49.33.t: "Embargo sur le charbon ouest-allemand"
 Adenauer49.33.d: "Le gouvernement ouest-allemand a lancé une attaque économique contre la République démocratique allemande en suspendant ses exportations de charbon, menaçant ainsi notre industrie et nos travailleurs. Cet acte délibéré de sabotage, orchestré par les forces impérialistes, vise à déstabiliser notre progrès socialiste. Cependant, notre République reste ferme, assurant l'approvisionnement en charbon grâce à la coopération socialiste et garantissant la continuité de la production. Cette agression révèle l'hypocrisie des propagandistes occidentaux qui prétendent soutenir l'unité allemande tout en approfondissant la division. Le peuple de la RDA restera déterminé et surmontera cette épreuve grâce à son engagement indéfectible envers le socialisme."
 Adenauer49.33.a: "Bâtarde."
 Adenauer49.4.d: "Pour commémorer la nouvelle décennie des années 1950, le chancelier Adenauer s'est adressé à l'assemblée du Bundestag ainsi qu'aux hauts fonctionnaires du gouvernement dans un discours du Nouvel An. Après les applaudissements, provenant principalement du côté CDU de la chambre, il a commencé son discours.\n\nMesdames et Messieurs les députés du Bundestag, Mesdames et Messieurs les ministres, Mesdames et Messieurs les dignitaires étrangers, Mesdames et Messieurs, nous entrons dans une nouvelle ère. Il y a moins d'un an, la République fédérale a été fondée, et à l'aube des années 1950, l'Allemagne ne cessera de croître. Nos relations avec les puissances occidentales ne cessent de se renforcer, tandis que nous poursuivons l'unification de l'Allemagne en un seul État démocratique, qui ne soit pas contrôlé par un seul parti politique. Alors que nous entrons dans une nouvelle ère de développement technologique, l'Allemagne sera à la pointe de cette innovation, car nous consolidons définitivement notre utilisation industrielle limitée. Alors que je me tiens ici, un témoignage de la démocratie et de la paix européennes est donné, et cela continuera pour toujours !"
 Adenauer49.5.d: "Les réactions des Alliés aux propositions allemandes de réarmement ont été mitigées au sein du gouvernement de la République fédérale. La position du SPD sur la participation des troupes allemandes en Europe a été très hostile, le Dr Schumacher considérant que les propositions de la CDU en matière de réarmement étaient prématurées et craignant que les Américains ne fassent une offre qu'ils ne pourraient pas tenir. Cependant, la CDU fait valoir que la menace soviétique est suffisamment importante pour justifier un réarmement rapide de l'Allemagne et que, si elle ne s'alignait pas sur les Alliés, la République fédérale pourrait être entraînée dans le bloc soviétique et perdre sa souveraineté."
 Adenauer49.6.d: "Aujourd'hui est un jour mémorable dans l'histoire de la République fédérale, car l'aciérie de la ville de Salzgitter, connue sous le nom de Salzgitter Works, a été démantelée par des travailleurs allemands sous le regard des représentants des trois puissances alliées. Anciennement sous l'égide de la Reichswerke Hermann Goering, l'usine a contribué à alimenter la machine de guerre allemande, notamment dans la production de chars, d'avions et d'armes. Après sa capture par les Alliés, l'usine est restée inutilisée pendant des années, jusqu'à aujourd'hui. Il s'agit d'une perte majeure pour l'industrie allemande, mais nécessaire pour éliminer un symbole de l'industrie et de la domination nazies."
 Adenauer49.7.d: "Aujourd'hui, le gouvernement allemand est fier d'annoncer la fin officielle du rationnement alimentaire en République fédérale. Depuis la fin de la Seconde Guerre mondiale, un plan de rationnement avait été mis en place pour tous les produits de consommation courante, notamment le charbon, les œufs, la viande, l'huile et les pommes de terre. Les Alliés ont contribué à compléter ce plan, mais nous avons enfin atteint le stade où il est avantageux de mettre fin au rationnement, car nous disposons désormais d'un approvisionnement suffisant en denrées alimentaires et autres produits de consommation courante."
 Adenauer49.8.d: "Aujourd'hui, un nouveau débat a fait rage au Bundestag, cette fois-ci au sujet de l'engagement éventuel de la République fédérale dans une communauté européenne chargée de gérer la production d'acier et de charbon de l'Allemagne et de la France dans le cadre d'une organisation supranationale. Adenauer et la CDU estiment qu'il s'agit d'une étape cruciale vers l'intégration européenne, visant à prévenir de futurs conflits en fusionnant des industries clés et en favorisant l'interdépendance économique ; la volonté d'autres gouvernements européens d'inclure l'Allemagne, en particulier celle du gouvernement français et du ministre des Affaires étrangères Robert Schuman, ainsi que les avantages d'entrer dans une union avec d'autres démocraties européennes.\n\nLes porte-parole du SPD ont répliqué en demandant pourquoi la CDU insistait pour saper la légitimité et l'indépendance de l'Allemagne, la rapprochant trop de la sphère occidentale et retardant ainsi la réunification allemande. Le débat se poursuit, mais nous devons prendre une décision rapidement."
 Adenauer49.9.d: "Aujourd'hui, le chancelier Adenauer a fait une annonce publique sur toutes les chaînes de radio et de télévision pour annoncer un nouveau décret. Une résolution récemment adoptée par le gouvernement fédéral concernant la loyauté constitutionnelle des fonctionnaires entrera en vigueur ; par conséquent, les membres d'organisations interdites ne pourront plus travailler au sein du gouvernement fédéral. Précisant que « les personnes au service du gouvernement fédéral doivent s'engager à respecter le concept démocratique de l'État dans toute leur conduite », cette mesure vise 11 organisations de gauche et 2 organisations national-socialistes, dont le Parti communiste allemand (KPD), la Jeunesse libre allemande (FDJ), le Kulturbund et l'Association des victimes du régime nazi (VVN). Les critiques pour autoritarisme ne tarderont pas à venir, mais cela est nécessaire pour la démocratie."
 Adenauer49.10.d: "Une triste nouvelle nous parvient de la Chancellerie fédérale, avec les révélations concernant le passé de Hans Globke, proche conseiller et sous-secrétaire du chancelier Konrad Adenauer. Bien qu'il n'ait jamais été membre du parti nazi, Globke a joué un rôle clé dans la rédaction de la loi d'habilitation de 1933, qui a conféré à Adolf Hitler des pouvoirs dictatoriaux, et de certaines sections des lois raciales de Nuremberg, qui ont institutionnalisé la persécution antisémite. Malgré son implication, il a été innocenté après la guerre et a même témoigné lors du procès des ministères en 1948. Nommé par Adenauer en 1949, Globke est devenu une figure cruciale dans l'élaboration des politiques juridiques et de renseignement de l'Allemagne de l'Ouest. Face à une pression croissante, le chancelier doit décider s'il doit le démettre de ses fonctions, mais compte tenu de sa contribution au gouvernement d'après-guerre, cela pourrait être considéré comme une décision anti-pragmatique, qui paralyserait l'efficacité administrative du gouvernement Adenauer."
 Adenauer49.11.d: "Un nouveau rapport a atterri aujourd'hui sur le bureau du chancelier Adenauer. Intitulé « Mémorandum de Himmerod » d'après le lieu où il a été rédigé, l'abbaye de Himmerod, il jette les bases de la création d'une nouvelle force militaire allemande, appelée la Bundeswehr. Parmi les principales revendications figuraient la libération de tous les soldats allemands condamnés pour crimes de guerre, la fin de la diffamation des soldats allemands et des mesures visant à transformer l'opinion publique nationale et étrangère à l'égard de l'armée allemande. Le groupe d'officiers allemands qui l'a rédigé, dont Hans Speidel et Adolf Heusinger, espère que le chancelier acceptera leur mémorandum et entamera des discussions avec les trois puissances occidentales afin de satisfaire leurs demandes."
 Adenauer49.12.d: "La prison de Landsberg est un établissement pénitentiaire tristement célèbre en Bavière, surtout connu pour avoir accueilli Adolf Hitler après l'échec du putsch de la brasserie et pour avoir été le lieu où Mein Kampf a été écrit. Utilisée par les forces américaines pendant l'occupation pour détenir les criminels de guerre, elle a été rebaptisée « Prison n° 1 pour criminels de guerre » en 1946. Au cours de son existence, Landsberg a été le théâtre de près de 300 exécutions de criminels de guerre condamnés. Aujourd'hui, elle sert toujours à détenir des criminels de guerre, mais elle est sous notre juridiction. D'un côté, le moment est venu de les libérer, la peine de mort ayant été abolie en République fédérale, mais d'un autre côté, les maintenir en prison servira d'exemple à ceux qui recherchent des formes de gouvernement non démocratiques. Que devons-nous faire ?"
 Adenauer49.13.d: "Aujourd'hui, l'avion du chancelier allemand a atterri à Londres, et c'est en grande pompe que le chancelier Adenauer a rencontré le Premier ministre Winston Churchill pour la première fois depuis qu'un chef du gouvernement allemand avait foulé le sol britannique, il y a 20 ans. Soulignant les objectifs communs de l'Allemagne et de la Grande-Bretagne, à savoir la préservation de la paix et la défense de l'ordre démocratique, Adenauer a donné l'assurance que l'Allemagne se montrerait un allié indéfectible. Dissipant les craintes liées à la concurrence économique allemande et à la résurgence des mouvements nationalistes, Adenauer a souligné l'importance de l'Allemagne dans la question européenne et la défense de la démocratie. Ce fut véritablement un succès pour les relations étrangères allemandes et les relations anglo-allemandes !"
 Adenauer49.14.d: "Des propositions intéressantes ont été reçues par les trois alliés occidentaux et la Chancellerie fédérale. Apparemment, le secrétaire général soviétique Joseph Staline a présenté des propositions pour la réunification allemande, en supposant que nous soyons neutres et garantissions « les droits de l'homme et les libertés fondamentales ». Les responsables alliés soupçonnent que les « notes de Staline » ne sont qu'un bluff destiné à permettre aux Soviétiques de reprocher aux Alliés la division de l'Allemagne. Le chancelier Adenauer et la CDU qualifient ces notes d'action agressive visant à retarder la réintégration de l'Allemagne de l'Ouest dans la politique européenne, et même le SPD envisage cette possibilité. Il semble clair que le gouvernement est uni sur cette question, mais une décision doit être prise, et rapidement."
 Adenauer49.141.t: "Rapport sur la réception du premier versement des réparations allemandes"
 Adenauer49.141.d: "Nous confirmons par la présente la réception du premier versement des réparations de la République fédérale d'Allemagne, conformément à l'accord de Luxembourg. Les fonds et les biens transférés marquent le début de la compensation convenue pour les souffrances et les pertes subies par le peuple juif sous le régime nazi. Ces ressources contribueront à la reconstruction et au développement de notre nation, aideront les survivants de l'Holocauste et renforceront les fondements économiques d'Israël. D'autres informations seront fournies au fur et à mesure de l'avancement du processus de réparation."
 Adenauer49.141.a: "Un premier pas."
 Adenauer49.142.t: "[GetNewspaperHeader]L'Allemagne et Israël signent un accord historique au Luxembourg"
 Adenauer49.142.d: "La République fédérale d'Allemagne et l'État d'Israël ont signé l'accord de Luxembourg, établissant officiellement les réparations pour les crimes nazis. En vertu de cet accord, l'Allemagne de l'Ouest s'est engagée à fournir une compensation financière, comprenant 822 millions de dollars en biens et en paiements, afin de soutenir la réinstallation et le bien-être des survivants de l'Holocauste en Israël. Cet accord, négocié entre le Premier ministre israélien David Ben Gourion et le chancelier allemand Konrad Adenauer, marque une étape importante dans le traitement des atrocités commises pendant la Seconde Guerre mondiale. Bien que controversé parmi certaines factions en Israël, cet accord représente une reconnaissance cruciale de la responsabilité historique. Les premiers versements devraient commencer en 1953, apportant un soutien économique indispensable au jeune État israélien."
 Adenauer49.142.a: "Une étape cruciale."
 Adenauer49.142.b: "Plus d'argent pour les sionistes."
 Adenauer49.142.c: "Nous sommes profondément désolés pour tout."
 Adenauer49.15.d: "L'intégration germano-européenne se poursuit aujourd'hui avec la signature des accords de Bonn-Paris à Bonn entre les trois Alliés occidentaux et la République fédérale. Parmi les dispositions importantes figurent l'article 1, qui accorde à la République fédérale « la pleine autorité en tant qu'État souverain sur ses affaires intérieures et extérieures », et l'article 2, qui prévoit que les trois puissances conservent leurs droits concernant Berlin et l'ensemble de l'Allemagne, y compris la réunification et un accord de paix. Il s'agit d'un pas énorme pour la souveraineté allemande et l'intégration européenne, mais ce n'est que la première étape d'un très long chemin."
 Adenauer49.151.t: "La mort de Kurt Schumacher"
 Adenauer49.151.d: "Le chancelier a été profondément attristé d'apprendre le décès de Kurt Schumacher, président du Parti social-démocrate, après une longue lutte contre la maladie. Schumacher était un défenseur infatigable de la démocratie, un opposant farouche au nazisme et au communisme, et l'une des voix les plus influentes de la politique allemande d'après-guerre. Ayant perdu son bras gauche pendant la Première Guerre mondiale et subi d'intenses persécutions sous le régime nazi, notamment des années d'emprisonnement dans des camps de concentration, il est devenu après la guerre la figure de proue du SPD, déterminé à reconstruire la démocratie allemande selon les principes sociaux-démocrates.\n\nMalgré sa rivalité de longue date avec le chancelier Adenauer, Schumacher est resté fidèle à sa vision d'une Allemagne forte, indépendante et réunifiée. Son engagement indéfectible en faveur de la justice politique et sociale a fait de lui une figure respectée, bien que souvent controversée. Son décès marque la perte d'un architecte clé de la démocratie allemande moderne."
 Adenauer49.151.a: "Ruhe in Frieden (Repose en paix)"
 Adenauer53.1.d: "Grâce à sa victoire aux élections de 1953, Konrad Adenauer a conservé son poste de chancelier de la République fédérale. Entamant son deuxième mandat avec un cabinet pratiquement identique au précédent, Adenauer a annoncé son intention de confier le ministère des Affaires étrangères à un ministre subalterne, à une date qui sera annoncée ultérieurement. En outre, Theodor Heuss, l'actuel président fédéral, devrait rester en fonction sans grande opposition. Les analystes politiques nationaux et internationaux considèrent que le maintien d'Adenauer à la tête du gouvernement est bénéfique pour l'Allemagne de l'Ouest et s'attendent à la poursuite d'une reconstruction économique et sociale plus importante dans le pays."
 Adenauer53.2.d: "Les nations du monde entier, en particulier les trois Alliés occidentaux, sont indignées par les discussions concernant la libération des « sept de Spandau », un groupe de criminels de guerre nazis incarcérés à la prison de Spandau à Berlin-Ouest, parmi lesquels Albert Speer, Karl Dönitz et Rudolf Hess. Après des discussions internes à la Chancellerie concernant la libération éventuelle de Konstantin von Neurath, ancien ministre des Affaires étrangères de l'Allemagne, et d'Erich Raeder, ancien grand amiral de la Kriegsmarine, les Alliés occidentaux ont largement condamné cette mesure, mais ne se sont engagés à aucune action concrète contre celle-ci pour préserver la stabilité du pays."
 Adenauer53.20.t: "La libération d'Erich Raeder"
 Adenauer53.20.d: "Le grand amiral Erich Raeder se distingue comme l'un des cas les plus intéressants parmi les condamnés de Nuremberg. En service de 1928 à 1943, il a joué un rôle déterminant dans la modernisation de la marine allemande et a poussé à l'expansion de la flotte de surface afin de contester la domination navale britannique. Raeder a joué un rôle crucial dans l'invasion de la Norvège pour sécuriser les bases navales, mais il a eu du mal à rivaliser avec la Royal Navy britannique en raison de la capacité limitée de l'Allemagne en matière de construction navale. Il a plaidé en faveur d'un renforcement naval à long terme, mais s'est heurté à Hitler, qui privilégiait la guerre sous-marine. Frustré par ces désaccords stratégiques, Raeder a été contraint de démissionner en 1943 et a été remplacé par Karl Dönitz. Après la Seconde Guerre mondiale, à l'âge de 70 ans, il a été condamné lors du procès de Nuremberg pour avoir planifié une guerre d'agression et condamné à la prison à vie, bien qu'il ait demandé à être exécuté par un peloton d'exécution.\n\nEn raison de problèmes de santé récents, notamment de rhumatismes, nous avons décidé de le libérer de prison afin qu'il puisse vivre ses dernières années dans la dignité. Bien que cela puisse sembler controversé pour les Alliés, sa brouille avec Hitler en 1943 et son implication relativement lointaine dans l'Holocauste constituent une explication pertinente à sa libération anticipée."
 Adenauer53.20.a: "Laissez-le vivre ses dernières années."
 Adenauer53.21.t: "La libération de Konstantin von Neurath"
 Adenauer53.21.d: "Konstantin von Neurath a commencé sa carrière diplomatique à Londres, lorsqu'il a été nommé vice-consul du consulat allemand en Grande-Bretagne en 1903. Il a ensuite occupé des fonctions diplomatiques pour l'Allemagne dans l'Empire ottoman, à Copenhague et en Italie, où il a été témoin direct de la montée du fascisme italien. Sous le cabinet exécutif de Franz von Papen, Neurath a été nommé ministre des Affaires étrangères de l'Allemagne, poste qu'il occupera jusqu'en 1938.\n\nIl a joué un rôle clé dans la diplomatie nazie à ses débuts, supervisant le retrait de l'Allemagne de la Société des Nations et négociant des accords tels que l'accord naval anglo-allemand (1935). Cependant, à mesure que la politique d'Hitler devenait plus agressive, Neurath fut écarté et remplacé par Joachim von Ribbentrop en 1938. Bien qu'il ait ensuite été nommé Reichsprotektor de Bohême et de Moravie, son influence resta limitée et il fut effectivement mis sur la touche par Reinhard Heydrich.\n\nEn 1946, il fut condamné à Nuremberg pour crimes contre la paix et crimes de guerre à 15 ans de prison, bien qu'il ait affirmé s'être distancié du leadership nazi. En raison de son état de santé qui se détériore, notamment d'une grave maladie cardiaque, nous avons décidé de lui accorder une libération anticipée afin qu'il puisse vivre ses dernières années dans la dignité. Bien que cette décision puisse susciter des critiques, son départ précoce du cercle restreint d'Hitler et son implication directe limitée dans les atrocités nazies constituent une base raisonnable pour cette décision."
 Adenauer53.21.a: "« Est-ce que je continuerai à toucher ma pension ? »"
 Adenauer53.3.d: "Aujourd'hui, la République fédérale est en fête après la victoire de l'équipe nationale allemande de football contre la « Golden Team » hongroise, également appelée « Mighty Magyars », lors de la finale de la Coupe du monde de football 1954. Disputé au stade Wankdorf de Berne, en Suisse, le match opposait une équipe hongroise favorite à une équipe allemande qui a finalement remporté la victoire. Considérée comme l'un des plus grands matchs de l'histoire de la Coupe du monde et connue sous le nom de « miracle de Berne », cette victoire a permis à la République fédérale de retrouver une reconnaissance et une popularité internationales sur la scène mondiale, tentant ainsi de redorer son image après la Seconde Guerre mondiale et la dénazification."
 Adenauer53.31.t: "La fracture des démocrates libres"
 Adenauer53.31.d: "À la suite de notre initiative législative visant à modifier la loi électorale fédérale, qui aurait réduit de près de moitié la représentation parlementaire du FDP, la faction libérale du FDP en Rhénanie-du-Nord-Westphalie a décidé de renoncer à sa coalition avec la CDU et de s'aligner sur les sociaux-démocrates. Bien que les dirigeants du FDP aient déclaré qu'ils n'avaient pas l'intention de poursuivre une coalition avec le SPD au niveau fédéral, cette décision a entraîné d'importantes fractures internes au sein du parti. En conséquence, plusieurs membres éminents du FDP ont décidé de quitter le parti, dont 16 députés du Bundestag, parmi lesquels quatre ministres fédéraux.\n\nÀ la suite de notre initiative législative visant à modifier la loi électorale fédérale, qui aurait réduit de près de moitié la représentation parlementaire du FDP, la faction libérale du FDP en Rhénanie-du-Nord-Westphalie a décidé de renoncer à sa coalition avec la CDU et de s'aligner sur les sociaux-démocrates. Bien que les dirigeants du FDP aient déclaré qu'ils n'avaient pas l'intention de poursuivre une coalition avec le SPD au niveau fédéral, cette décision a entraîné d'importantes fractures internes au sein du parti. En conséquence, plusieurs membres éminents du FDP ont décidé de quitter le parti, dont 16 députés du Bundestag, parmi lesquels quatre ministres fédéraux. En réponse à ces développements, la faction CDU au Bundestag a déclaré son intention de ne coopérer qu'avec les dissidents du FDP, ce qui accentue la pression sur le FDP pour qu'il quitte la coalition et passe dans l'opposition. Entre-temps, les libéraux démissionnaires ont créé le Freie Volkspartei (FVP) afin de poursuivre leur partenariat avec les chrétiens-démocrates. Si ce changement signifie que le cabinet Adenauer a désormais perdu sa majorité au Bundesrat, il a également entraîné le départ des factions de gauche et de droite au sein du FDP, ce qui a conduit à un gouvernement comptant moins de personnes liées au passé national-socialiste."
 Adenauer53.31.a: "Il faut faire certains sacrifices."
 Adenauer53.32.t: "Rapport confidentiel sur la réunion de coalition du cabinet Adenauer II"
 Adenauer53.32.d: "La coalition formée par la CDU, le Deutsche Partei (DP) et le Gesamtdeutscher Block (GB/BHE) s'est réunie pour faire le point sur ses progrès et aborder les défis actuels. L'économie a continué de croître, avec l'expansion de l'industrie aéronautique et les investissements dans la recherche atomique qui avançaient comme prévu. Les efforts visant à normaliser le système scolaire ont progressé, même si des désaccords subsistaient quant à l'autonomie des États.\n\nCependant, il s'est avéré difficile de traiter le passé nazi de l'Allemagne. Alors que certains poussaient pour une dénazification plus poussée, le Gesamtdeutscher Bund, sous la direction de Theodor Oberländer, s'y opposait, donnant la priorité à la réconciliation. De même, les réformes des retraites restaient controversées, les débats sur les prestations accordées aux anciens officiers de la Wehrmacht et aux fonctionnaires se poursuivant. Dans l'ensemble, les partenaires de la coalition ont eu du mal à trouver un équilibre entre progrès économique, politique sociale et responsabilité historique, mais ils restent attachés à la stabilité et à la modernisation. D'autres discussions étaient prévues pour finaliser les politiques en matière de retraites et les mesures de dénazification."
 Adenauer53.32.a: "Nous y arriverons"
 Adenauer53.33.t: "À la suite d'une coopération continue au sein de la coalition au pouvoir, la CDU et le FDP ont réaffirmé leur alliance, garantissant ainsi la stabilité du gouvernement et la continuité de la politique. Sans nouvelle tentative de modification de la loi électorale fédérale, les tensions entre les partenaires de la coalition sont restées gérables, évitant ainsi les fractures internes qui auraient pu déstabiliser le cabinet Adenauer. La direction du FDP est restée fidèle à son rôle au sein du gouvernement, conciliant les politiques économiques libérales avec les objectifs plus larges des chrétiens-démocrates.\n\nEn conséquence, le programme législatif de la coalition s'est déroulé sans perturbations majeures. La CDU et le FDP ont fait avancer avec succès les réformes économiques, l'expansion industrielle et les politiques sociales, tandis que les débats internes sur la dénazification et les réformes des retraites ont été réglés par des compromis plutôt que par des divisions. La poursuite de cette coopération garantit également une majorité stable au Bundestag et au Bundesrat, permettant au chancelier [WGR.GetLeader] de gouverner sans dépendre d'autres factions politiques."
 Adenauer53.33.a: "Pour l'avenir de l'Allemagne."
 Adenauer53.4.d: "Les événements récents impliquant des hauts responsables du gouvernement allemand ont choqué tant la population allemande que la communauté internationale. Otto John, président de l'Office fédéral pour la protection de la Constitution, l'agence de renseignement intérieur de la République fédérale, a disparu à Berlin il y a quelques jours après avoir assisté à une cérémonie commémorant l'anniversaire du complot du 20 juillet contre Hitler. Trois jours plus tard, John est apparu à Berlin-Est, ville communiste, reniant son ancien pays et critiquant les politiques d'intégration occidentale et de remilitarisation du chancelier Adenauer.\n\nLe gouvernement allemand a exprimé son indignation face à cet incident et exige son arrestation et son extradition depuis l'Allemagne de l'Est vers notre pays."
 Adenauer53.41.t: "L'Allemagne de l'Ouest exige l'extradition d'Otto John"
 Adenauer53.41.d: "Les événements récents impliquant des hauts responsables du gouvernement ouest-allemand ont choqué tant la population nationale qu'étrangère. Otto John, président de l'Office fédéral pour la protection de la Constitution, l'agence de renseignement intérieur de la République fédérale, a disparu à Berlin-Ouest il y a quelques jours après avoir assisté à une cérémonie commémorant l'anniversaire du complot du 20 juillet contre Hitler. Trois jours plus tard, John est réapparu à Berlin-Est, reniant son ancien pays et critiquant la politique d'Adenauer d'alignement sur les impérialistes occidentaux et de remilitarisation rapide.\n\n[WGR.Capital.GetCapitalVictoryPointName] a exprimé leur indignation face à cet incident et exigent son arrestation et son extradition vers leur pays afin qu'il soit placé sous leur garde."
 Adenauer53.41.a: "Non ? Il restera à Berlin-Est."
 Adenauer53.41.b: "Non ? Nous allons le surveiller de près et... Attendez, où est-il passé ?"
 Adenauer53.42.t: "L'Allemagne de l'Est refuse l'extradition d'Otto John"
 Adenauer53.42.d: "À la suite d'efforts diplomatiques continus, il a maintenant été confirmé que les autorités de l'Allemagne de l'Est n'extraderont pas Otto John vers la République fédérale. Malgré nos demandes répétées, les responsables est-allemands insistent sur le fait que John reste de son plein gré, présentant sa défection comme un changement idéologique volontaire plutôt que comme un enlèvement.\n\nLes efforts déployés pour négocier son retour ont été catégoriquement rejetés, et Berlin-Est a clairement fait savoir que toute nouvelle demande serait ignorée. Pendant ce temps, la presse contrôlée par l'État à Berlin-Est continue de diffuser ses dénonciations de notre gouvernement, utilisant ses déclarations comme propagande pour justifier sa position. Il est désormais évident que le retour de John ne pourra se faire par la voie diplomatique."
 Adenauer53.42.a: "Nous vous rattraperons un jour."
 Adenauer53.43.t: "Otto John arrêté à Berlin-Ouest"
 Adenauer53.43.d: "Malgré les refus répétés des autorités est-allemandes concernant l'extradition d'Otto John, un rebondissement inattendu est survenu. John a mystérieusement refait surface à Berlin-Ouest, après s'être apparemment échappé avec l'aide du journaliste danois Henrik Henriksen. Les détails de l'opération restent flous, mais il semble que John ait été fait passer clandestinement à la frontière sans être repéré, échappant ainsi aux forces de sécurité est-allemandes.\n\nPeu après son retour, John a été appréhendé par les autorités ouest-allemandes et placé en détention. Compte tenu de sa défection et de sa collaboration avec l'Est, il a été condamné à cinq ans de prison pour trahison. Le gouvernement est-allemand n'a pas encore publié de communiqué officiel, mais les médias d'État condamnent déjà son arrestation comme une violation des principes démocratiques. Il serait judicieux de donner des instructions supplémentaires sur la manière de gérer les répercussions politiques de cette affaire."
 Adenauer53.43.a: "En prison avec toi."
 Adenauer53.43.b: "Comment s'est-il échappé de Berlin-Est ?"
 Adenauer53.5.d: "Une nouvelle doctrine de politique étrangère a été introduite par la République fédérale d'Allemagne, connue sous le nom de doctrine Hallstein, du nom du secrétaire d'État Walter Hallstein. Cette politique stipule que la République fédérale n'établira ni ne maintiendra de relations diplomatiques avec aucun pays qui reconnaît officiellement la République démocratique allemande comme un État souverain. Cette doctrine repose sur la revendication de la RFA d'être le seul représentant légitime de l'Allemagne dans son ensemble, conformément à ses accords avec l'Union soviétique et à la position internationale plus large sur la question allemande.\n\nCette décision marque une évolution importante dans la diplomatie allemande divisée de l'après-guerre, car elle façonnera les relations futures de la République fédérale avec les autres nations. En réponse, la RDA poursuit ses propres efforts diplomatiques, en particulier au sein du bloc de l'Est, les deux États allemands cherchant à renforcer leur position internationale dans une Europe divisée."
 Adenauer53.5.a: "Un rempart contre le communisme"
 Adenauer53.5.b: "Un régime fantoche accusant l'Orient d'être un régime fantoche. Ironique."
 Adenauer53.6.d: "Le chancelier Adenauer est rentré aujourd'hui de Moscou, où il a achevé une visite dans la tanière du lion pour le gouvernement ouest-allemand, axée principalement sur le retour des derniers prisonniers de guerre allemands, dix ans après la fin de la Seconde Guerre mondiale.\n\nÀ son arrivée à Moscou, Adenauer se considérait comme un partenaire à part entière des Russes, posant pour une photo avec le représentant soviétique Nikolaï Boulganine et le secrétaire général Nikita Khrouchtchev. Cependant, les négociations ont achoppé et ont failli échouer, jusqu'à ce que les délégations allemande et soviétique assistent à une représentation de « Roméo et Juliette » au Théâtre Bolchoï.\n\nTowards the end of the play, when the fathers embraced each other over the bodies of Romeo and Juliet, Adenauer and Bulganin stood up and embraced similarly, marking a poignant moment in the visit.\n\nLes discussions qui ont suivi se sont avérées fructueuses et des accords ont été conclus : des relations diplomatiques avec les Soviétiques ont été établies en échange de la libération de 10 000 prisonniers de guerre. Connu sous le nom de « Retour des dix mille », ce succès restera à jamais gravé dans les mémoires en Allemagne et au-delà."
 Adenauer53.7.d: "C'est officiel ! Avec la ratification de l'accord de Paris le 27 février 1955, la République fédérale d'Allemagne devient membre de l'Organisation du traité de l'Atlantique Nord, l'alliance de sécurité mutuelle de l'Europe occidentale fondée en 1949 par les trois Alliés occidentaux et neuf autres pays. Après avoir signé le statut des forces de l'OTAN et d'autres accords mettant fin au régime d'occupation, une cérémonie a été organisée à Paris pour célébrer l'adhésion de la République fédérale, et des manœuvres avec les forces de l'OTAN et la Bundeswehr devraient commencer l'année prochaine. Cette adhésion à l'alliance ne manquera pas de susciter la colère des Soviétiques et de placer la ligne de conflit à la frontière interallemande, marquant ainsi le début d'une nouvelle ère dans cette guerre froide."
 Adenauer53.8.d: "Aujourd'hui, la réunion du cabinet du chancelier n'avait rien d'ordinaire. Une situation s'était développée au Moyen-Orient, et le chancelier[WGR.GetLeader] a estimé qu'il méritait une réponse.\n\n[WGR.GetLeader]pouvrit. « Monsieur Brentano, que sait le ministère des Affaires étrangères ? »\n\n« Monsieur le Chancelier, comme vous le savez, le président égyptien Nasser a nationalisé le canal de Suez le 26 juillet. Cela fait maintenant un peu plus de trois mois, et nous avons été informés que ces deux pays ont déployé des parachutistes pour s'emparer du canal de Suez. »\n\nCela a suscité une vague de conversations autour de la table du cabinet.\n\nLe chancelier prit la parole. « Nous devons prendre une décision : honorer notre amitié avec la Grande-Bretagne et la France, ou exprimer notre soutien à Nasser en lui offrant notre appui diplomatique. »\n\nBrentano reprit la parole. « Il n'est peut-être pas judicieux pour l'instant de s'opposer aux Alliés, en particulier aux Français. Nous essayons toujours de consolider notre position sur la scène internationale. Cependant, promettre notre soutien à l'action des Nations Unies pourrait être considéré comme une position neutre, soutenant implicitement Nasser sans intervenir directement. »\n\nIl a examiné les options, puis a soumis la question au vote du Cabinet. Quelle sera notre position ?"
 Adenauer53.81.t: "L'Allemagne de l'Ouest promet son soutien diplomatique à l'Égypte"
 Adenauer53.81.d: "Alors que la crise de Suez éclatait à la fin de l'année 1956, les responsables britanniques et français comptaient de plus en plus sur leurs alliés occidentaux pour obtenir leur soutien diplomatique contre le président égyptien Gamal Abdel Nasser. Cependant, les rapports des services de renseignement et les communications diplomatiques révélèrent rapidement un changement inquiétant : plutôt que de s'aligner sur Londres et Paris, l'Allemagne de l'Ouest avait commencé à soutenir secrètement la position de l'Égypte.\n\nAu départ, les responsables ouest-allemands avaient fait preuve de neutralité, soulignant leur engagement en faveur d'une désescalade. Cependant, les envoyés diplomatiques au Caire avaient commencé à nouer des liens plus étroits avec le gouvernement de Nasser, cherchant à étendre l'influence de l'Allemagne de l'Ouest dans le monde arabe. Des informations ont fait état de discussions en cours sur une aide économique et d'assurances diplomatiques secrètes données pour éloigner Bonn de l'intervention anglo-française."
 Adenauer53.81.a: "Scandaleux !"
 Adenauer53.9.d: "Aujourd'hui, le Bundestag débattait d'une question importante, susceptible de modifier les frontières de la République fédérale : la question de la Sarre.\n\nÀ partir de 1947, la Sarre fut détachée de la zone d'occupation française et jouit d'une autonomie politique ainsi que d'une communauté économique avec la France, mais resta sous le contrôle d'un haut-commissaire français. Le gouvernement allemand, sous la direction du chancelier Adenauer, a poursuivi ses efforts pour mettre fin au statut particulier de la Sarre et l'annexer à la République fédérale en tant que Land. Si certains habitants de la Sarre protestent pour obtenir leur souveraineté, la majorité du pays considère la Sarre comme une partie intégrante de l'Allemagne, un élément économique important et un moyen de reprendre le contrôle de la région à la France. Que décideront-ils ?"
 Adenauer53.90.t: "L'Allemagne de l'Ouest abandonne la Sarre"
 Adenauer53.90.d: "Nous avons reçu une notification officielle indiquant que la République fédérale d'Allemagne a officiellement renoncé à ses revendications sur la Sarre, choisissant de laisser ce territoire sous administration française. Cette décision, bien qu'inattendue, marque un tournant important dans nos efforts visant à intégrer économiquement et politiquement cette région à la France. Les autorités allemandes ont fait part de leur intention de respecter cette décision, même si les sentiments de la population locale restent mitigés. Je continuerai à suivre l'évolution de la situation et à veiller à une transition en douceur, conformément à nos intérêts nationaux."
 Adenauer53.90.a: "Voilà qui est inattendu"
 Adenauer53.91.t: "[GetNewspaperHeader]La Sarre rejoint la France"
 Adenauer53.91.d: "Dans un revirement politique majeur, la République fédérale d'Allemagne a officiellement renoncé à ses revendications sur la Sarre, laissant la région sous administration française. Cette décision marque l'aboutissement d'années de négociations et de tensions après la fin de la Seconde Guerre mondiale.\nLa Sarre, territoire historiquement contesté, est sous influence économique française depuis la guerre, avec des efforts visant à l'intégrer dans le cadre économique français. Si les responsables ouest-allemands ont pris acte de cette décision, les réactions des habitants de la Sarre restent partagées, certains étant favorables à un rapprochement avec la France et d'autres plaidant pour la réunification avec l'Allemagne.\nLes autorités françaises considèrent cela comme une victoire stratégique, garantissant la stabilité économique et l'influence politique dans la région. Cependant, avec l'évolution des alliances européennes et l'influence croissante des institutions européennes nouvellement créées, l'avenir à long terme de la Sarre reste incertain."
 Adenauer53.91.a: "Hein ?"
 Adenauer53.92.t: "[GetNewspaperHeader]La Sarre rejoint l'Allemagne"
 Adenauer53.92.d: "Aujourd'hui, au Luxembourg, la République fédérale d'Allemagne et la France ont ouvert la voie au retour de la Sarre dans le giron allemand. Cet accord fait suite à un référendum organisé le 23 octobre 1955, au cours duquel la population sarroise a rejeté le « Saarstatut », qui aurait transformé la région en un territoire européen. Le traité comprend également des accords sur l'exploitation charbonnière dans la région du Warndt et sur la livraison à long terme de charbon à la France. Parallèlement, un accord distinct a été signé avec le Luxembourg pour canaliser la Moselle entre Coblence et Thionville, un projet souhaité par la France afin d'améliorer les liaisons de transport pour l'industrie minière et sidérurgique de Lorraine. Cependant, les deux parties ont convenu d'une période de transition de quatre ans jusqu'à la fin de l'union douanière et monétaire avec la France, après quoi le mark allemand remplacera le franc comme seule monnaie ayant cours légal."
 Adenauer53.92.a: "Ils sont inséparables."
 Adenauer53.10.d: "La tension était palpable lorsque les officiers supérieurs de la nouvelle Bundeswehr allemande entrèrent dans la salle enfumée où se tenait la réunion du Comité militaire de l'OTAN. Ils s'approchèrent de la table et s'assirent, face aux représentants des quatorze autres membres de l'OTAN.\n\nLe président prit la parole. « Aujourd'hui, nous entamons la première journée de discussions concernant le déploiement d'armes nucléaires de l'OTAN sur le territoire de la République fédérale d'Allemagne. Nous souhaitons la bienvenue à nos collègues de la Bundeswehr qui viendront nous faire part de leurs commentaires. » Tout le monde applaudit et approuva d'un signe de tête, tandis que certains membres continuaient à fumer par intermittence.\n\nLe plus haut gradé de la Bundeswehr prit la parole. « Si vous me le permettez, je tiens à remercier les membres de cette commission de nous avoir donné la parole aujourd'hui. Cependant, je pense que la Bundeswehr, et le gouvernement de la République fédérale dans son ensemble, ont des inquiétudes quant au déploiement d'armes nucléaires sur notre territoire. Nous sommes en première ligne, sur le champ de bataille... »\n\nLe représentant américain l'interrompit. « Exactement ! Maintenant que la République fédérale a rejoint l'OTAN, nous devrions nous concentrer sur l'installation d'un plus grand nombre d'armes nucléaires sur le sol allemand, afin d'étendre notre portée et de faciliter une frappe contre les Soviétiques si cela s'avérait nécessaire. »\n\nL'officier supérieur de la Bundeswehr semblait visiblement en colère. « Vous voyez, c'est là le problème. Nous sommes un nouveau pays, avec une armée petite et récente. Si des armes nucléaires sont placées sur notre territoire, cela représente une menace pour l'Union soviétique et leur donne encore plus de raisons d'attaquer ! \n\nLe délégué américain répliqua : « Mais voyez-vous, l'article 5 garantit votre sécurité aujourd'hui. Ces sales communistes n'oseraient pas nous attaquer ! » Il fut silencieusement rappelé à l'ordre par le président du comité, qui semblait avoir besoin d'un verre bien fort. « Nous devrions peut-être délibérer sur cette question à huis clos. »"
 Adenauer53.100.t: "La création de la Bundeswehr"
 Adenauer53.100.d: "Si vous aviez demandé à la Commission alliée d'accorder à l'Allemagne le droit de se réarmer et de former de nouveaux soldats, elle aurait condamné cette initiative comme une dangereuse résurgence du militarisme allemand. Cependant, cette réalité appartient depuis longtemps au passé. Le rideau de fer a divisé l'Europe en deux blocs opposés, chacun luttant pour exercer son influence et son pouvoir à l'échelle mondiale. La guerre de Corée a clairement montré que l'ère de la paix et de la désescalade n'était pas encore arrivée, renforçant ainsi notre objectif premier : assurer la sécurité de nos citoyens face à l'Union soviétique et à ses alliés.\n\nAvec la ratification officielle du Deutschlandvertrag (traité allemand) et notre adhésion à l'Organisation du traité de l'Atlantique Nord, nous avons engagé des discussions approfondies avec les États-Unis, la France et la Grande-Bretagne concernant le rôle de l'Allemagne de l'Ouest dans cette nouvelle structure de sécurité. En conséquence, nous avons obtenu le droit de créer une armée permanente pour soutenir les forces alliées en cas d'invasion soviétique de l'Europe occidentale.\n\nDix ans après la capitulation de la Wehrmacht, la Bundeswehr apparaît aujourd'hui comme la nouvelle armée allemande, une institution vouée à la défense de la liberté et de la sécurité, et non à la conquête d'un Lebensraum et à la vengeance."
 Adenauer53.100.a: "Pour la sécurité de l'Allemagne et de l'Europe !"
 Adenauer53.101.t: "[GetNewspaperHeader]L'Allemagne de l'Ouest signe le Deutschlandvertrag"
 Adenauer53.101.d: "La ratification du Deutschlandvertrag (traité allemand) marque une étape importante vers la pleine souveraineté de l'Allemagne de l'Ouest. Signé à l'origine en 1952 entre la République fédérale d'Allemagne et les Alliés occidentaux, ce traité réduit considérablement le contrôle des Alliés, accordant à l'Allemagne de l'Ouest une plus grande indépendance politique tout en la maintenant fermement intégrée dans la structure de défense occidentale. Combiné à l'adhésion récente de l'Allemagne de l'Ouest à l'OTAN, cet accord ouvre la voie à la création de nouvelles forces armées par le pays, marquant son retour en tant que puissance militaire sous stricte surveillance internationale. Le Chancelier [WGR.GetLeader]a salué ce traité comme un moment décisif dans le redressement de l'Allemagne après la guerre, garantissant son rôle d'allié clé contre l'expansion soviétique. Si certains en Allemagne restent prudents quant au réarmement, le traité est largement considéré comme une étape importante dans la réintégration du pays dans la communauté occidentale."
 Adenauer53.101.a: "Ils méritent leur souveraineté."
 Adenauer53.101.b: "L'impérialisme occidental sur papier. Ironique."
 Adenauer53.101.c: "Ensemble, comme des égaux !"
 Adenauer53.102.t: "L'Allemagne de l'Ouest demande une aide au réarmement"
 Adenauer53.102.d: "La République fédérale d'Allemagne demande officiellement l'aide militaire du Royaume-Uni dans le cadre de ses efforts continus pour se réarmer et contribuer à la défense occidentale. Compte tenu de la menace soviétique croissante et de l'intégration récente de l'Allemagne dans la structure de sécurité occidentale, elle sollicite notre soutien sous forme d'armes légères, de personnel consultatif et d'équipements de soutien essentiels afin de l'aider à mettre en place et à moderniser les nouvelles forces armées allemandes. L'expertise britannique en matière de formation et de logistique serait inestimable pour constituer une force efficace et disciplinée, capable de coopérer avec les unités alliées. Compte tenu des sensibilités politiques entourant le réarmement allemand, [WGR.Capital.GetCapitalVictoryPointName] assure que toutes les mesures seront prises en stricte coordination avec les directives de l'OTAN afin de maintenir la stabilité en Europe. Ils ont affirmé que l'engagement commun en faveur de la sécurité collective permettra d'aboutir à une issue positive à cette demande."
 Adenauer53.102.a: "Bien sûr, nous sommes ravis de vous aider."
 Adenauer53.102.b: "Nous préférons rester en dehors de ça."
 Adenauer53.103.t: "Le Royaume-Uni nous aide"
 Adenauer53.103.d: "Le gouvernement britannique a officiellement approuvé notre demande d'aide militaire, acceptant de fournir des armes légères, du personnel consultatif et un soutien logistique pour aider au développement de la Bundeswehr. Des conseillers britanniques participeront aux efforts de formation, veillant à ce que nos forces répondent aux normes de l'OTAN tout en maintenant une coordination étroite avec les structures de commandement alliées. Cela marque une étape importante dans la réintégration de l'Allemagne dans la défense occidentale, renforçant notre capacité à dissuader l'agression soviétique. D'autres négociations détermineront le calendrier et l'étendue des livraisons afin d'assurer une mise en œuvre harmonieuse et efficace."
 Adenauer53.103.a: "C'est apprécié"
 Adenauer53.104.t: "Londres refuse notre demande"
 Adenauer53.104.d: "Le gouvernement britannique a rejeté notre demande d'aide militaire, invoquant les sensibilités politiques actuelles entourant le réarmement allemand et les préoccupations liées à la perception du public. Tout en réaffirmant son engagement envers notre partenariat au sein de l'OTAN, il a exprimé sa préférence pour que l'Allemagne s'approvisionne principalement auprès des États-Unis et de la France en matière d'aide militaire. Cette décision pose des défis à notre stratégie de réarmement et nous oblige à explorer d'autres voies pour obtenir du matériel et du soutien à la formation. Nous devons désormais réévaluer notre approche pour obtenir les ressources nécessaires tout en maintenant de bonnes relations diplomatiques avec le gouvernement britannique."
 Adenauer53.104.a: "Quelle poisse !"
 Adenauer53.11.d: "Aujourd'hui, à Rome, la République fédérale a participé à la signature du traité de Rome, également appelé traité instituant la Communauté économique européenne, et a proposé la réduction des droits de douane et la création d'une union douanière, ainsi que la création d'un marché économique unique. Plus important encore, ce traité a institué la Commission européenne, qui allait devenir le pouvoir exécutif de l'Union européenne. Signé par le chancelier Konrad Adenauer et le secrétaire d'État aux Affaires étrangères Walter Hallstein, l'adhésion de l'Allemagne à cette organisation sera certainement bénéfique pour tous !"
 Adenauer53.12.d: "Une décision importante a été rendue par la Cour constitutionnelle fédérale, la plus haute juridiction du pays. En déterminant le statut juridique de Berlin-Ouest, qui continue d'être occupée par les trois alliés occidentaux, la Cour a décidé que la ville était un Land de la République fédérale. Le fait de considérer la ville comme un Land à part entière confère à ses citoyens les droits prévus par la Loi fondamentale. Il s'agit là d'une évolution inattendue, en particulier pour les trois autorités d'occupation à Berlin ; Dieu sait que les Soviétiques considéreront cela comme un coup de publicité."
 Adenauer53.121.t: "L'Allemagne de l'Ouest propose un accord sur le recrutement"
 Adenauer53.121.d: "La République fédérale d'Allemagne a officiellement proposé un accord visant à accueillir des travailleurs italiens dans son économie d'après-guerre en plein essor. Confrontée à une pénurie de main-d'œuvre due à une expansion industrielle rapide, l'Allemagne offre des opportunités d'emploi à des milliers d'Italiens, en particulier dans les secteurs de l'industrie manufacturière, des mines et de la construction. L'accord garantit des salaires équitables, un logement et des prestations de sécurité sociale, offrant ainsi aux travailleurs italiens la possibilité d'un emploi stable et de meilleures conditions de vie. Si certains en Italie s'inquiètent des défis liés à la migration, beaucoup y voient une opportunité prometteuse pour le progrès économique. Les discussions sont en cours, mais s'il est finalisé, cet accord pourrait renforcer les liens économiques entre l'Italie et l'Allemagne tout en offrant de nouvelles perspectives aux travailleurs italiens à l'étranger."
 Adenauer53.121.a: "Cela semble être une bonne affaire."
 Adenauer53.122.t: "[GetNewspaperHeader]L'Allemagne de l'Ouest confirme la mort d'Hitler"
 Adenauer53.122.d: "La République fédérale d'Allemagne a officiellement déclaré Adolf Hitler mort, mettant fin à des années de spéculations sur le sort de l'ancien dictateur. La déclaration, émise par un tribunal ouest-allemand, est en grande partie une formalité juridique, car Hitler était largement considéré comme s'étant suicidé dans son bunker berlinois le 30 avril 1945. Cependant, en l'absence de preuves matérielles, aucune décision officielle n'avait été prise jusqu'à présent.\n\nCette décision fait suite à des rumeurs persistantes et à des théories du complot suggérant qu'Hitler aurait pu s'échapper et survivre en exil. Avec cette décision, le gouvernement ouest-allemand vise à éliminer toute ambiguïté juridique restante concernant son statut."
 Adenauer53.122.a: "Cela n'empêchera pas les complots."
 Adenauer53.123.t: "La Cour constitutionnelle fédérale interdit le KPD"
 Adenauer53.123.d: "La Cour constitutionnelle fédérale a officiellement interdit le Parti communiste allemand (KPD), le jugeant inconstitutionnel en raison de ses objectifs antidémocratiques et de son alignement sur la RDA contrôlée par l'Union soviétique. Cette décision marque la fin d'une bataille juridique qui durait depuis des années, initiée en 1951 par le gouvernement Adenauer, qui affirmait que le KPD cherchait à saper la démocratie ouest-allemande et à imposer une dictature socialiste.\n\nAvec cette décision, toutes les activités, tous les actifs et toutes les publications du KPD sont désormais interdits. L'opposition du parti à l'intégration dans l'OTAN et au réarmement de l'Allemagne de l'Ouest, ainsi que ses liens avec les services secrets est-allemands, ont joué un rôle crucial dans la décision du tribunal. De nombreux anciens membres du KPD devraient entrer dans la clandestinité, rejoindre d'autres groupes de gauche ou s'installer en Allemagne de l'Est, où le parti SED au pouvoir continue d'étendre son contrôle. Des efforts ont été faits pour contenir le leader du KPD, Max Reimann, mais comme il s'est exilé en Allemagne de l'Est il y a deux ans, il est impossible de le traduire en justice. À l'heure actuelle, Reimann reste à Berlin-Est, d'où il dirige le KPD et ses derniers partisans."
 Adenauer53.123.a: "Bon débarras"
 Adenauer53.124.t: "La création du Bundesnachrichtendienst"
 Adenauer53.124.d: "La création d'un service fédéral de renseignement fait l'objet de discussions depuis le début des années 1950. Les discussions à la Chancellerie fédérale ont mentionné pour la première fois le nom de Bundesnachrichtendienst, bien qu'il ne soit pas clair qui devrait en assumer la responsabilité et s'il s'agirait d'une institution gouvernementale officielle ou non. Le Bundesnachrichtendienst sera officiellement créé dans les prochains mois, dans le but de défendre l'Allemagne dans le domaine de la guerre asymétrique et d'obtenir des informations importantes sur les activités d'espionnage de l'Allemagne de l'Est. Le BND est issu de l'Organisation Gehlen, dirigée par le général de division Reinhard Gehlen, dont les informations cruciales sur les forces armées soviétiques ont attiré l'attention des Américains. L'Organisation Gehlen sera désormais intégrée au service de la République fédérale d'Allemagne avec ses milliers d'employés, Gehlen devenant son premier président. Puisse leur service apporter la sécurité à l'Allemagne."
 Adenauer53.124.a: "Renforcer la surveillance des membres du SPD."
 Adenauer57.0.t: "Cabinet Adenauer III"
 Adenauer57.0.d: "Après une élection couronnée de succès, remportant plus de 50,2 % des voix avec la CDU seule et obtenant ainsi la majorité absolue au Bundestag, Konrad Adenauer a une nouvelle fois consolidé sa position de chancelier de la République fédérale, entamant ainsi son troisième mandat. La politique étrangère restant une priorité, Adenauer devrait renforcer encore les liens avec les alliés occidentaux, notamment par le biais de l'OTAN et du processus d'intégration européenne.\n\nAu niveau national, son leadership devrait permettre de poursuivre la croissance économique, d'investir dans les infrastructures et de faire progresser le réarmement de l'Allemagne de l'Ouest sous l'égide de la Bundeswehr. Les observateurs politiques s'attendent à une stabilité et à une continuité qui renforceront le rôle de la République fédérale en tant qu'acteur clé dans l'Europe d'après-guerre."
 Adenauer57.0.a: "Comme d'habitude."
 Adenauer57.1.d: "Aujourd'hui, au Bundestag, une partie importante de la réforme allemande a été adoptée avec le succès de la loi sur les conséquences générales de la guerre. Cette loi, qui vise à couvrir toutes les demandes d'indemnisation et les dommages résultant des actions de l'ancien Reich allemand et à les transférer à la République fédérale, s'avérera finalement utile à la reconstruction après la guerre, non seulement en Allemagne, mais aussi dans toute l'Europe où des dommages ont été causés. Cette loi est généralement considérée comme la prise en charge financière complète par le gouvernement allemand des actions de ses prédécesseurs fascistes et a reçu un large soutien populaire de la part des Alliés occidentaux."
 Adenauer57.2.d: "Aujourd'hui, à Ulm, le procès de l'Einsatzkommando, ou Einsatzgruppen, s'est achevé. Tenu devant le tribunal régional d'Ulm, le procès concernait dix membres de la Gestapo, du Sicherheitdienst et de l'Ordnungspolizei, qui faisaient partie de l'Einsatzkommando de Tilsit pendant la période du national-socialisme. Selon un rapport de Walter Stahlecker, ancien commandant de l'Einsatzgruppe A, ces dix personnes ont été accusées d'avoir tué plus de 5 000 hommes, femmes et enfants juifs près de la frontière lituanienne pendant la guerre.\n\nConsidéré comme le premier tournant dans la lutte judiciaire contre l'héritage du national-socialisme, les dix accusés ont été condamnés à des peines allant de 3 à 15 ans de prison pour « meurtre complice » et ont perdu leurs droits civiques pour une durée pouvant aller jusqu'à 10 ans.\n\nCette affaire a eu des répercussions profondes, avec la création du Bureau central de l'administration d'État chargé des enquêtes sur les crimes nationaux-socialistes afin de faciliter le lancement de poursuites fédérales dans toutes les affaires, permettant ainsi aux Alliés de constater que la République fédérale était capable d'assurer elle-même le maintien de l'ordre."
 Adenauer57.3.d: "Le 8 juillet 1954, la République fédérale d'Allemagne fut invitée à l'Exposition universelle de Bruxelles, également connue sous le nom d'Expo 58. Considérée comme politiquement sensible, en particulier après la participation de l'Allemagne nazie à l'Exposition universelle de Paris en 1937, cette invitation marqua un tournant décisif pour la République fédérale.\n\nLa question de savoir comment la République fédérale devait se présenter a fait l'objet de vifs débats, notamment au sein du Cabinet, jusqu'à ce qu'une décision soit finalement prise en 1956.\n\nLe pavillon allemand comprenait deux étages recouverts de verre, avec un pont permettant d'accéder à l'autoroute fédérale 3. Assez petit par rapport aux pavillons américains et soviétiques, plus imposants, ainsi qu'au pavillon belge du Congo, plus tristement célèbre, notre contribution à l'Expo 58 représentait un avenir plein d'espoir pour la République fédérale."
 Adenauer57.4.d: "Une nouvelle question a fait son apparition au Bundestag. Depuis l'adhésion de la République fédérale à l'OTAN et la réunion qui s'est tenue il y a deux ans devant le Comité militaire de l'OTAN, la question des armes nucléaires hante le gouvernement fédéral. Adenauer et son cabinet sont favorables au déploiement d'armes nucléaires de l'OTAN en République fédérale, ainsi qu'à un éventuel programme nucléaire indépendant avec la France et l'Italie. Cependant, le SPD a exprimé de nombreuses préoccupations sur tous les aspects, à commencer par le déploiement de l'OTAN, qu'il considère comme une ingérence et un risque pour la sécurité non seulement des citoyens allemands, mais aussi pour une éventuelle réunification avec l'Est.\n\nLe cabinet Adenauer, en consultation avec les membres du SPD, a proposé un référendum sur cette question afin que le peuple puisse se prononcer.\n\nCependant, cette question pourrait être bloquée par la Cour constitutionnelle fédérale, qui a déjà signalé de manière préventive que l'autorisation des armes nucléaires serait inconstitutionnelle au regard de l'article 26 de la Loi fondamentale.\n\nLe référendum doit-il avoir lieu, reflétant ainsi la volonté du peuple, ou cette question doit-elle être définitivement écartée ?"
 Adenauer57.5.d: "Le référendum sur le déploiement d'armes nucléaires a été organisé dans tous les États fédéraux allemands, sur ordre du gouvernement fédéral allemand. Des millions d'Allemands ayant le droit de vote ont fait la queue aujourd'hui dans leurs bureaux de vote respectifs, alors que la nation décidait du sort du déploiement des armes nucléaires de l'OTAN en République fédérale. Bien que le siège de l'OTAN à Bruxelles se soit peu exprimé à ce sujet, une déclaration publique devrait suivre l'annonce des résultats. Quel a été le choix de la nation ?"
 Adenauer57.7.d: "Le gouvernement fédéral allemand subit à nouveau des pressions de la part des puissances occidentales pour qu'il reconnaisse la ligne Oder-Neisse, qui constitue actuellement la frontière entre la République populaire de Pologne et la République démocratique allemande, formée après la conférence de Potsdam par le cours des fleuves Oder et Neisse. Les Américains ont particulièrement insisté que [WGR.GetLeader]et son cabinet reconnaissent cette frontière par le biais de pactes de non-agression, certains segments de la population allemande, en particulier les expulsés allemands, ont compris ses motivations possibles et se mobilisent contre la reconnaissance de la Pologne. Cette frontière doit-elle être reconnue ?"
 Adenauer57.71.t: "L'Allemagne de l'Ouest reconnaît la frontière Oder-Neisse"
 Adenauer57.71.d: "Dans un revirement politique majeur, le gouvernement ouest-allemand dirigé par le chancelier Konrad Adenauer a officiellement reconnu la ligne Oder-Neisse comme frontière occidentale de la Pologne. Dans une déclaration du cabinet Adenauer III, les responsables ont reconnu les réalités territoriales de l'Europe d'après-guerre, soulignant leur engagement en faveur d'une coexistence pacifique. Si certaines voix en Allemagne de l'Ouest restent opposées à cette décision, celle-ci est considérée comme un pas vers la stabilisation des relations entre les deux nations. Le gouvernement polonais a été informé de cette reconnaissance, qui marque un tournant potentiel dans les efforts diplomatiques entre [WGR.Capital.GetCapitalVictoryPointName] et Varsovie."
 Adenauer57.71.a: "Une surprise inattendue, mais bienvenue."
 Adenauer57.72.t: "[GetNewspaperHeader]L'Allemagne de l'Ouest reconnaît la frontière Oder-Neisse"
 Adenauer57.72.d: "Dans une décision sans précédent, le gouvernement ouest-allemand a officiellement reconnu la ligne Oder-Neisse comme frontière occidentale de la Pologne. Cette décision, marque un changement significatif par rapport à la politique ouest-allemande précédente et annonce une nouvelle approche en faveur de la réconciliation avec la Pologne.\nPendant des années, la frontière établie après la Seconde Guerre mondiale a été un sujet de discorde, beaucoup en Allemagne de l'Ouest refusant d'accepter la perte des anciens territoires orientaux. Cependant, dans le but de stabiliser les relations et de démontrer son engagement en faveur de la paix en Europe, le gouvernement de Bonn a désormais officiellement reconnu la souveraineté de la Pologne sur cette région.\nLe gouvernement polonais a salué cette annonce, la considérant comme une étape cruciale vers la normalisation des relations entre les deux nations. Cependant, cette décision a suscité un débat en Allemagne de l'Ouest, où les voix de l'opposition affirment qu'une telle reconnaissance cède trop de terrain aux changements territoriaux de l'après-guerre."
 Adenauer57.72.a: "Cela était inattendu."
 Adenauer57.8.d: "C'est avec regret que Theodor Oberlander, ancien ministre chargé des personnes déplacées, des réfugiés et des victimes de guerre, et membre du Bundestag, a été contraint de se retirer du service du gouvernement de la République fédérale. Dans un rapport publié plus tôt cette année, M. Oberlander a été impliqué dans la promotion et la commission de crimes de guerre en Pologne pendant la Seconde Guerre mondiale, ainsi que dans l'approbation du nettoyage ethnique en Pologne des personnes qu'il a rapidement fini par diriger en tant que chef du Bloc panallemand/Ligue des expulsés et des privés de droits.\n\nLe cabinet Adenauer devrait faire une déclaration publique à ce sujet, mais nierra catégoriquement les accusations et souhaitera à Oberlander une retraite paisible."
 Schumacher49.0.t: "[GetNewspaperHeader]Kurt Schumacher élu chancelier fédéral de l'Allemagne de l'Ouest"
 Schumacher49.0.d: "Au lendemain des élections fédérales allemandes de 1949, Kurt Schumacher et le Parti social-démocrate (SPD) remportent les élections au Bundestag et forment un gouvernement qui cherche à concilier socialisme et principes démocratiques. La victoire du SPD sur l'Union chrétienne-démocrate (CDU) et le Parti communiste (KPD) marque un rejet des politiques conservatrices et éloigne l'Allemagne de l'Ouest de la domination soviétique et occidentale. Schumacher s'est engagé à mettre en œuvre de solides programmes de protection sociale, une planification économique dirigée par l'État et une approche prudente du plan Marshall afin de préserver la souveraineté allemande. Les dirigeants occidentaux considèrent son gouvernement avec incertitude, car il refuse de s'aligner pleinement sur l'un ou l'autre des blocs de la guerre froide, tandis que l'Union soviétique reste sceptique quant à sa position anticommuniste. La victoire du SPD bloque également les ambitions du KPD, empêchant un glissement vers le socialisme de type soviétique tout en continuant à défendre les droits des travailleurs et le contrôle de l'État sur les industries clés. Schumacher est confronté à des défis importants, notamment la reprise économique, les efforts de réunification et les tensions avec les États-Unis et l'URSS. Son leadership engage l'Allemagne sur une voie unique, s'efforçant de créer un État socialiste démocratique tout en naviguant entre les pressions de la guerre froide."
 Schumacher49.0.a: "Ce n'est pas le résultat que nous espérions, mais ce n'est pas non plus le pire."
 Schumacher49.0.b: "Qui nous a trahis ? Les sociaux-démocrates."
 Schumacher49.0.c: "Le SPD nous guidera au cours des quatre prochaines années !"
 Schumacher49.1.d: "Aujourd'hui encore, l'agitation régnait dans les couloirs du nouveau Bundestag. Au milieu d'un débat houleux sur le fonctionnement fondamental du nouveau gouvernement ouest-allemand, le chef de l'opposition, Konrad Adenauer, de l'Union chrétienne-démocrate, prit la parole.\n\nDebout à droite de la salle, avec le reste de la CDU derrière lui, il commença : « Mes chers collègues, alors que nous sortons des horreurs de la guerre avec un nouveau gouvernement démocratique, le chancelier au pouvoir, Herr Schumacher, a engagé notre République fédérale dans une nouvelle voie dangereuse. Alors que nous tentons de revenir sur la scène internationale, Herr Schumacher se moque des Alliés et souhaite renforcer la coopération avec l'Est... »\n\nIl fut interrompu par un tollé de huées et de railleries provenant du côté gauche, beaucoup plus nombreux. Les huées continuèrent jusqu'à ce qu'un député du SPD s'approche de l'estrade, élève la voix et interrompe Adenauer.\n\n« Monsieur Adenauer... Je ne peux exprimer à quel point vos propos inspirent le mépris, tant à moi-même qu'à mon parti. L'Union chrétienne-démocrate n'est pas seulement consciente de l'accueil et de la protection accordés aux anciens nationaux-socialistes, elle s'en rend complice. »\n\nUn murmure s'éleva dans presque toute la salle, mais les députés de la CDU continuèrent à froncer les sourcils.\n\nIl poursuivit. « J'ai entre les mains une liste de nombreux responsables éminents de la CDU qui étaient membres du Parti national-socialiste allemand des travailleurs, notamment Hans Globke et Theodor Oberlander, ainsi que des centaines et des milliers de membres, de fonctionnaires et de bureaucrates. Cette acceptation sans conviction d'anciens criminels de guerre et traîtres au sein du mouvement conservateur est inadmissible et antidémocratique, et c'est pourquoi nous, en tant que Parti social-démocrate, condamnons fermement les actions de la CDU. »\n\nDes applaudissements bruyants ont retenti dans toute la salle, tandis qu'Adenauer semblait choqué et que la CDU restait silencieuse ou commençait à chahuter de l'autre côté de la salle."
 Schumacher49.2.d: "Aujourd'hui était un jour mémorable à Francfort, alors qu'un groupe d'officiers et d'hommes se tenait devant le Römer, le complexe de l'hôtel de ville. Vêtus d'uniformes de style militaire, mais sans aucun insigne, ils attendaient, debout en formation, jusqu'à ce qu'un groupe d'hommes en costume apparaisse, avec le chancelier Kurt Schumacher en tête. Un petit groupe de journalistes et d'autres responsables s'est rassemblé près des quelque 500 hommes alignés en cinq formations carrées. Le chancelier Schumacher s'est approché du podium, flanqué du vice-chancelier Egon Franke et du président fédéral Erich Ollenhauer.\n\nIl commença : « Mes chers concitoyens, aujourd'hui est un jour important, non seulement pour la sécurité de notre pays, mais aussi pour l'ensemble du monde occidental. J'ai l'honneur de vous présenter les 500 premiers officiers et membres du personnel de la nouvelle police fédérale des frontières, ou Bundesgrenzschutz. Ces hommes contribueront à sécuriser nos frontières contre la menace ou les incursions communistes, à garantir la sécurité de nos réseaux de transport et à commencer à fournir des services de police au niveau fédéral. Je tiens à souligner que la BGS n'est pas une force militaire. L'Est pourrait nous accuser de réarmement et dénoncer et condamner nos actions avec des discours virulents, mais je tiens à dire une chose. Chaque pays mérite la paix intérieure et la sécurité de ses frontières, et l'Allemagne ne devrait pas faire exception. »\n\nAprès quelques applaudissements, un assistant lui tendit un bout de papier. « J'ai maintenant l'honneur de faire prêter le nouveau serment du BGS aux cinq premières compagnies d'officiers. Levez la main droite. » Cinq cents mains se levèrent.\n\n« Je jure de respecter la Loi fondamentale de la République fédérale d'Allemagne et toutes les lois applicables à la République fédérale, et de remplir consciencieusement mes fonctions officielles, que Dieu m'en soit témoin ! »\n\nLes flashs crépitèrent lorsque les hommes se mirent immédiatement à acclamer, applaudir et lancer leurs chapeaux en l'air. Le chancelier Schumacher regarda le champ de soldats en uniforme gris-vert, puis Ollenhauer et Franke, qui souriaient tous deux. C'était vraiment un grand jour pour la République fédérale, et d'autres hommes prêteraient serment aujourd'hui et dans les jours à venir."
 Schumacher49.3.d: "Le chancelier Schumacher entra dans la salle de réunion du Cabinet, valsant tandis que le vice-chancelier Egon Franke faisait signe aux ministres de s'asseoir. Schumacher s'assit avec une tasse de café, faisant signe au ministre des Affaires étrangères de commencer.\n\n« Monsieur, la Commission de contrôle alliée nous a remis le projet de texte de l'accord de Petersberg. Elle nous presse fortement de le signer, car il prévoit certaines concessions qui nous permettraient de conserver un semblant de souveraineté indépendante. »\n\nAprès avoir lu certaines parties du texte, Schumacher s'exclama d'une voix forte : « De quel droit les Alliés dictent-ils leurs exigences à notre nouveau pays ? Nous devrions refuser de signer et dénoncer les conditions des Alliés comme étant déraisonnables. »\n\nLe vice-chancelier Franke prit la parole. « Avec tout le respect que je dois à Herr Schumacher, nous n'avons vraiment pas le choix dans cette affaire. Les Alliés occidentaux nous ont libérés. Ces conditions semblent globalement avantageuses pour nous, à l'exception de la question de la Ruhr... mais nous pouvons négocier ce point avec eux. »\n\nSchumacher reprit la parole. « Messieurs, écoutez. Ce ne sont pas les conditions qui me posent problème. Ce qui me dérange, c'est que les Alliés nous imposent des exigences économiques et militaires déraisonnables en échange d'une souveraineté négligeable. À mon avis, il faut trouver une autre solution. »\n\nFranke regarda autour de lui, vit quelques hochements de tête, quelques froncements de sourcils. « Mettons cela aux voix : signer l'accord, ou le refuser et y apporter des modifications ? »"
 Schumacher49.4.d: "Sur les ondes radio à travers toute l'Allemagne, la voix du chancelier Kurt Schumacher commença à retentir. Ce soir-là fut un moment mémorable, car la chancellerie avait annoncé un discours national sur les nouvelles questions politiques.\n\n« Mes chers compatriotes allemands. Ce soir, je suis fier de vous présenter le nouveau programme politique du gouvernement social-démocrate, que nous avons baptisé « Programme de Francfort » en l'honneur de notre brillante capitale. Ce programme s'articule autour de trois points, que je vais vous exposer, tous destinés à renforcer notre pays, à aider notre peuple et à restaurer notre réputation sur la scène internationale.\n\n« Tout d'abord, nous allons nous lancer dans un nouveau programme économique Volks, destiné à retrouver notre puissance économique après les ravages de la guerre et l'emprise de la Commission de contrôle alliée. Cela propulsera notre pays vers des niveaux économiques jamais atteints auparavant ! »\n\n« Deuxièmement, les conflits politiques internes ont miné notre nation, tant du côté des anciens nationaux-socialistes que des communistes encore en place. Notre gouvernement va mettre en œuvre un programme sévère visant à réprimer l'extrémisme afin de favoriser la démocratie et de renforcer la confiance dans nos nouvelles institutions. »\n\n« Enfin, notre gouvernement va reconsidérer ses positions en matière de politique étrangère. Il est désormais clair que, sur certains points, le gouvernement ouest-allemand et les puissances alliées ne parviennent pas à s'entendre, notamment sur la question de la Ruhr et de la militarisation. Nous allons examiner sérieusement nos relations avec les puissances européennes et mondiales. »\n\n« Ces trois points, combinés, garantiront la sécurité de notre pays et aideront toute la population. Merci à tous et bonne nuit. »"
 Schumacher49.5.d: "DE : Ministère fédéral provisoire de l'Économie\nÀ : Chancellerie fédérale\nObjet : Aperçu du programme économique « Volks »\n\nLe gouvernement ouest-allemand, dans le cadre de ses compétences provisoires limitées, a formulé quelques points essentiels concernant le nouveau programme économique « Volks », volet économique du programme de Francfort du SPD. En voici la liste.\n\n-Création d'un ministère fédéral permanent de l'Économie et des Syndicats\n-Introduction des régimes d'assurance sociale\n-Saisie des installations charbonnières de la Ruhr\n-Priorisation des ressources pour l'utilisation économique nationale\n- Nationalisation de Volkswagen et d'IG Farben\n-Adoption de meilleures réglementations du travail pour les travailleurs de la sidérurgie et des mines\n\nNous pensons que ces six points ont le potentiel de reconstruire notre puissance économique et productive nationale."
 Schumacher49.6.d: "Sur la Marienplatz de Munich, une foule assez importante s'était rassemblée, tous les regards tournés vers un podium arborant le sceau de l'Allemagne de l'Ouest. Lorsqu'une série de trois Mercedes noires fit son entrée sur la place, l'excitation commença à monter. Le chancelier Schumacher en descendit, accompagné comme toujours du vice-chancelier Franke et du président Ollenhauer. Après avoir salué les participants, il prit la parole.\n\n« Je suis sûr que certains d'entre vous se demandent pourquoi j'ai choisi Munich pour prononcer ce discours. Non seulement c'est l'une des plus belles villes de toute notre République, mais cette ville a été témoin de l'extrémisme politique des deux côtés, du tristement célèbre putsch manqué des nazis à la brève République soviétique de Munich. »\n\n« Nous avons tiré les leçons de nos erreurs passées et sommes pleinement déterminés à éradiquer le nazisme et le communisme de tous les coins de ce pays. La campagne « Noir et rouge » vise à garantir notre démocratie en punissant et en éliminant tous ceux qui cherchent à la renverser. Notre gouvernement s'attellera à cette tâche dès que possible, tout en respectant les droits de notre peuple. Merci à tous. »\n\nDes applaudissements ont retenti sur la place lorsque Schumacher a salué la foule en souriant avant de faire signe à une voiture."
 Schumacher49.7.d: "C'était tôt le matin lorsqu'une Mercedes noire roula sur l'autoroute en direction des aciéries de la Ruhr. Marquée de l'insigne de l'Autorité internationale pour la Ruhr, deux hommes étaient assis à l'intérieur lorsqu'ils quittèrent la route et s'approchèrent d'une des nombreuses usines sidérurgiques et mines de charbon qui parsemaient le paysage.\n\nCe fut un choc lorsque la voiture s'arrêta juste avant le portail de l'usine, devant un barrage routier flanqué de deux agents du Bundesgrenzschutz, tous deux armés de pistolets dans leurs étuis.\n\nBaissant les vitres, le fonctionnaire de l'Autorité de la Ruhr qui conduisait avait l'air furieux. « Que signifie tout cela, lieutenant ? »\n« Monsieur, cette aciérie est officiellement la propriété de la République fédérale d'Allemagne et vous n'êtes pas autorisé à y entrer. »\n« Qu'est-ce que c'est que ça ? Nous travaillons pour l'Autorité internationale de la Ruhr. Voici nos papiers. Nous gérons cette installation. »\n\nLe lieutenant ne prit même pas la peine d'examiner les documents qui lui étaient remis. « Monsieur, j'ai reçu l'ordre direct du ministère fédéral de l'Intérieur de ne permettre l'accès à cette installation à aucun personnel non autorisé, y compris le personnel de l'Autorité de la Ruhr. Veuillez faire demi-tour avec votre véhicule, sinon nous serons contraints de recourir à la force. » Les agents posèrent la main sur leur étui.\n\nLes deux hommes se regardèrent, puis regardèrent les policiers. « C'est complètement fou... Votre commandant va être mis au courant. » La Mercedes fit demi-tour et, alors que la voiture rejoignait l'autoroute en direction de Dortmund, l'homme assis sur le siège passager remarqua : « Il va falloir passer quelques coups de fil. »"
 Schumacher49.70.d: "Plus tôt dans la journée, des agents de l'Autorité internationale de la Ruhr (IAR) se sont vu refuser l'accès à une aciérie relevant de leur compétence par des membres armés du Bundesgrenzschutz (BGS). Agissant sur ordre direct du ministère fédéral de l'Intérieur, ces agents ont refusé de reconnaître l'autorité de l'Autorité de la Ruhr et ont bloqué l'entrée de nos représentants, les avertissant qu'ils recourraient à la force si nécessaire.\n\nCette évolution suggère une décision délibérée du gouvernement ouest-allemand d'affirmer son contrôle total sur les industries de la Ruhr sans consultation préalable des autorités alliées. La manière dont cela a été fait – par une intervention directe des forces de sécurité plutôt que par la voie diplomatique – est particulièrement préoccupante, car elle crée un précédent d'action unilatérale qui fait fi des accords établis.\n\nS'il est clair que le gouvernement du chancelier Schumacher a fait pression pour obtenir un plus grand contrôle national sur les ressources industrielles, cette contestation ouverte de l'Autorité de la Ruhr soulève des questions sur les limites de l'autonomie de l'Allemagne de l'Ouest et l'application des politiques économiques alliées."
 Schumacher49.71.d: "DE : Haute Commission alliée pour l'Allemagne\nÀ : Le gouvernement de la République fédérale d'Allemagne\nObjet : Restriction non autorisée du personnel de l'Autorité de la Ruhr\n\nIl a été porté à notre attention que des fonctionnaires de l'Autorité internationale pour la Ruhr (AIR) se sont vu refuser l'accès à une aciérie placée sous leur gestion par des agents du Bundesgrenzschutz, qui ont invoqué des ordres du ministère fédéral de l'Intérieur. Les mesures prises par votre gouvernement à cet égard soulèvent de sérieuses préoccupations quant au respect des accords existants concernant les installations industrielles de la Ruhr.\n\nBien que nous reconnaissions que la République fédérale cherche à exercer un contrôle accru sur ses actifs économiques, les mesures unilatérales de cette nature, en particulier celles impliquant les forces de sécurité, risquent de nuire à l'esprit de coopération entre nos gouvernements. Il est impératif que ces mesures soient communiquées à l'avance par la voie diplomatique plutôt que d'être appliquées sans discussion préalable.\n\nCela dit, après délibération interne, les autorités alliées ont décidé de ne pas donner suite à cette affaire. Nous reconnaissons la souveraineté économique de la République fédérale et l'importance de nationaliser les industries clés pour soutenir les efforts de reconstruction. Cependant, nous déconseillons fortement toute action similaire non coordonnée à l'avenir, car elle pourrait nuire aux relations à un moment où la confiance et le partenariat sont de la plus haute importance.\n\nNous espérons que les discussions sur la situation des industries de la Ruhr se poursuivront dans un esprit de bonne foi, en veillant à ce que les intérêts de toutes les parties concernées soient pris en considération."
 Schumacher49.8.d: "DE : Chancelier Kurt Schumacher, Gouvernement de la République fédérale d'Allemagne\nÀ : Président Juan Perón, Gouvernement de la République argentine\nObjet : Extradition d'anciens nationaux-socialistes\n\nCher Président Perón,\n\nMon nouveau gouvernement a appris que de nombreux anciens nationaux-socialistes, ou « nazis », ont fui vers des pays tels que l'Argentine, qui leur a offert un refuge contre nos poursuites ou celles des Alliés.\n\nNous avons connaissance des personnes suivantes en Argentine que la République fédérale d'Allemagne souhaite voir extrader afin de pouvoir les poursuivre en justice conformément à nos lois ;\n\n- Josef Mengele, surnommé « l'ange de la mort », qui a mené des expériences médicales dans les camps de concentration nazis.\n- Josef Schwammberger, commandant SS en Pologne\n- Erich Priebke, commandant SS responsable du massacre des grottes des Ardennes en 1944\n- Gerhard Bohne, responsable de la logistique administrative du programme d'euthanasie Aktion T-4\n\nL'extradition de ces individus vers notre pays dans les plus brefs délais pourrait présenter certains avantages diplomatiques à l'avenir."
 Schumacher49.80.d: "DE : Président Juan Perón, Gouvernement de la République argentine\nÀ : Chancelier Kurt Schumacher, Gouvernement de la République fédérale d'Allemagne\nObjet : RE : Extradition d'anciens nationaux-socialistes\n\nCher chancelier Schumacher,\n\nNous prenons acte des préoccupations exprimées dans votre correspondance concernant certaines personnes résidant actuellement en République argentine. Toutefois, après mûre réflexion, le gouvernement argentin se voit dans l'obligation de décliner respectueusement votre demande d'extradition.\n\nLe cadre juridique argentin, ainsi que notre engagement en faveur de la souveraineté nationale, ne permettent pas l'extradition d'individus sans procédure régulière dans le cadre de notre propre système judiciaire. En outre, notre gouvernement ne procède pas à des poursuites rétroactives fondées sur des griefs politiques ou historiques étrangers. Les personnes résidant sur notre territoire sont protégées par la loi argentine et, à ce titre, elles ne peuvent faire l'objet d'une extradition sur la seule base de pressions extérieures.\n\nBien que nous accordions une grande importance aux relations diplomatiques avec la République fédérale d'Allemagne, nous devons également respecter les politiques et les principes de notre nation. Nous restons ouverts à la poursuite du dialogue sur les questions d'intérêt mutuel et la coopération entre nos deux pays."
 Schumacher49.9.d: "Au petit matin dimanche dernier, environ 4 000 membres enregistrés du Parti communiste allemand et d'autres organisations apparentées ont été expulsés et envoyés en République démocratique allemande par voie ferroviaire et routière. Toutes ces personnes se sont vu interdire l'entrée sur le territoire de la République fédérale à l'avenir.\n\nNous espérons que deux à trois mille autres personnes seront expulsées dans les semaines à venir et envoyées en RDA ou dans d'autres pays communistes limitrophes.\n\nSIGNÉ\nAnton Grasser\nInspecteur, Bundesgrenzschutz."
 Schumacher49.90.t: "Les communistes ouest-allemands arrivent en Thuringe"
 Schumacher49.90.d: "Ce matin, environ 5 000 camarades expulsés de la République fédérale d'Allemagne sont arrivés dans différentes gares de transit de Thuringe, principalement via les passages frontaliers d'Eisenach, Gerstungen et Probstzella. La majorité d'entre eux sont des membres confirmés du Parti communiste allemand et d'organisations socialistes affiliées. D'autres expulsions depuis l'Ouest sont attendues dans les semaines à venir.\n\nÀ leur arrivée, ces camarades ont été accueillis par des fonctionnaires du ministère de la Sécurité d'État et des représentants du SED, qui ont commencé à traiter et à évaluer chaque individu. Beaucoup ont exprimé un engagement idéologique fort envers la cause socialiste, mais certains semblent également désorientés, désabusés ou politiquement peu fiables en raison de leur expulsion forcée de leur foyer.\n\nCette expulsion massive est une manœuvre désespérée et réactionnaire du gouvernement Schumacher pour se débarrasser de l'opposition idéologique, prouvant ainsi la nature antidémocratique de la soi-disant « République fédérale ». Cela représente à la fois un défi et une opportunité : si nous devons sélectionner avec soin les informateurs potentiels ou les contre-révolutionnaires, nous avons également la possibilité de renforcer nos rangs avec des militants expérimentés."
 Schumacher49.90.a: "Faites comme chez vous, messieurs."
 Schumacher49.10.d: "Ministère fédéral de l'Intérieur, département IS - Journal de surveillance et profil de Max Reimann\n\nLe sujet est Max Reimann, président du Parti communiste allemand (KPD). Âgé d'environ 53 ans, Reimann a siégé au conseil consultatif de la zone d'occupation britannique de 1946 à 1948, avant de devenir président du KPD en 1948. Lors des élections de 1949, Reimann et son parti ont remporté environ 7 % des voix, et il est actuellement membre du Bundestag.\n\nIdéologie\nReimann affiche des convictions et des valeurs politiques marxistes-léninistes moyennes. En tant que président du KPD, il a critiqué presque tous les aspects du gouvernement ouest-allemand, y compris la Grundgesetz, le chancelier fédéral, le président fédéral et le système juridique. Nos renseignements indiquent que cette rhétorique se poursuivra et pourrait dégénérer en violence en fonction des événements futurs.\n\nRésumé des activités récentes\nIl y a une semaine, Reimann a fait une déclaration au Bundestag condamnant non seulement la CDU, mais aussi le parti SPD au pouvoir pour sa « tolérance manifeste envers l'impérialisme occidental ». Il y a deux jours, nos services de renseignement ont révélé une réunion entre Reimann et d'autres dirigeants de partis communistes occidentaux, dont le communiste belge Julien Lahaut et le communiste français Jacques Duclos, ainsi que des appels téléphoniques vers Berlin-Est et des responsables du SED. Cela représente une menace majeure pour la sécurité intérieure du gouvernement ouest-allemand.\n\nEn conclusion, la Division du renseignement continuera à surveiller tous les mouvements, déclarations, conversations téléphoniques et toutes autres formes de communication impliquant Reimann, et préparera des rapports supplémentaires dans la mesure où cela concerne la sécurité nationale."
 Schumacher49.11.d: "Alors qu'un avion de ligne DC-6 atterrissait à la base aérienne Rhein-Main de Francfort, le chancelier Schumacher faisait les cent pas dans son bureau. Situé à des kilomètres et des kilomètres de l'aéroport, Schumacher était nerveux, ce qui était compréhensible. Pourquoi ne serait-il pas inquiet ? Il s'agissait d'une opération de relations publiques de grande envergure pour le gouvernement allemand, mais McCarthy avait été plus que problématique dans les cercles politiques américains.\n\nAvant même de s'en rendre compte, Schumacher se retrouva sur la place principale de Francfort, devant le Römer, sous les applaudissements, avec Ollenhauer et Franke derrière lui, serrant la main du sénateur Joseph McCarthy du Wisconsin, le célèbre anticommuniste américain.\n\nLors de leur rencontre, les deux hommes sont restés très cordiaux, McCarthy remerciant Schumacher de l'avoir invité.\n\nAprès avoir discuté des subtilités de la campagne « Black and Red », McCarthy semblait impressionné. Plus tard, il a assisté à une visite et à une inspection des unités du BGS à Francfort, soulignant le professionnalisme et les compétences des troupes du BGS.\n\nAu bout du compte, le gouvernement Schumacher l'a emporté. Même la CDU est impressionnée par cette manifestation de soutien anticommuniste, tandis que le KPD menace dans l'ombre."
 Schumacher49.12.d: "Ce matin-là, la réunion du cabinet s'est déroulée comme d'habitude, mais Schumacher était exceptionnellement en avance. Ollenhauer et Franke ont été surpris de le voir arriver parmi les premiers dans la salle, avec sa tasse de café habituelle. Lorsque les autres ministres sont arrivés et se sont assis, Schumacher a ouvert la séance.\n\n« Messieurs, nous devons discuter des subtilités du troisième point de notre programme gouvernemental, à savoir la politique étrangère. Nous devons nous mettre d'accord sur la voie à suivre sur la scène internationale. Je suis prêt à écouter vos suggestions. »\n\nFranke prit immédiatement la parole. « Monsieur le Chancelier, nous devons, et je dis bien devons, poursuivre notre politique d'intégration à l'Ouest. C'est la seule voie possible. Je le dis en tant que fier membre du SPD, mais l'Ouest peut vraiment nous aider d'une manière que nous n'aurions jamais imaginée. »\n\nOllenhauer rétorqua : « Monsieur le vice-chancelier, je ne suis pas du tout d'accord. Pourquoi devrions-nous nous incliner davantage devant l'Occident ? L'accord de Petersberg n'était qu'un premier test. Certains membres de ce gouvernement souhaitent une Allemagne indépendante, libre de toute contrainte exercée par une puissance ou un bloc quelconque, et je pense que c'est ce qu'il y a de mieux pour notre peuple à l'heure actuelle, plutôt que d'être tiraillé entre l'Est et l'Ouest.\n\nSchumacher en avait assez entendu. Attirant l'attention de tous les ministres présents dans la salle, il demanda un vote : fallait-il poursuivre l'intégration à l'Occident ou suivre une voie non alignée ?"
 Schumacher49.13.d: "À qui de droit,\n\nJe vous écris au nom du gouvernement ouest-allemand au sujet de la pression exercée par la Commission de contrôle alliée en faveur du réarmement de l'Allemagne de l'Ouest.\n\nLe Parti social-démocrate estime qu'il n'est pas souhaitable que l'Allemagne se réarme pour assurer la sécurité de son peuple et condamne fermement la rhétorique de la CDU et des puissances alliées qui imposent le réarmement allemand comme un stratagème visant à faire de l'Allemagne le prochain champ de bataille de notre « guerre froide ».\n\nLe peuple allemand aspire à la sécurité, tant face à l'attitude de l'Est que de l'Ouest. Nous condamnons toute tentative de réarmement dans un avenir proche ; notre service fédéral des frontières a été créé dans le seul but d'assurer notre sécurité intérieure et ne sera jamais utilisé à des fins extérieures. Toute nouvelle tentative visant à nous convaincre du contraire ne sera pas accueillie favorablement. Merci."
 Schumacher49.14.d: "Après que le cabinet Schumacher eut décidé d'aller de l'avant avec l'intégration occidentale, contre la volonté d'Ollenhauer, le sujet suivant à l'ordre du jour fut le plan Schuman, un projet d'accord économique avec la France visant à créer une « Communauté européenne du charbon et de l'acier », rédigé par le ministre français des Affaires étrangères Robert Schuman.\n\nFranke a lancé la discussion en déclarant : « Cela semble être une décision assez facile à prendre. Si nous souhaitons poursuivre l'intégration occidentale, c'est l'une des étapes nécessaires pour y parvenir. Le simple fait que les Français nous fassent confiance après un demi-siècle d'histoire entre nos deux pays est un bon signe, et je ne vois aucune raison de refuser de conclure cet accord historique. » Son argument était convaincant, et il a même suscité les applaudissements des ministres plus proches d'Ollenhauer.\n\nSchumacher l'a reconnu, mais a ensuite fait signe au président fédéral de prendre la parole.\n\n« Monsieur Franke, je vois de nombreuses raisons pour lesquelles nous ne devrions pas adhérer à cet accord. Il est clair que depuis que l'accord de Petersberg nous a été imposé, nous sommes contraints de nous plier aux exigences des Alliés occidentaux et de faire tout ce qu'ils souhaitent. C'est clairement ce que souhaite faire la CDU, mais pourquoi devrions-nous nous engager dans la même politique ? Comment pouvons-nous être sûrs que les Français, dans le cadre de la CECA qu'ils proposent, ne vont pas simplement s'approprier notre charbon et notre acier, comme ils l'ont fait avec la Ruhr en 1923 ? »\n\nCe dernier point a provoqué un tollé général dans la salle, mêlant mécontentement, opposition et colère.\n\nSchumacher en avait assez entendu. « Silence ! Messieurs, comportons-nous comme des politiciens et votons ! »"
 Schumacher49.15.d: "C'était une journée ensoleillée à Washington, et une foule s'était rassemblée dans le quartier de Foxhall Village, juste à l'ouest de Georgetown. Le nouveau centre culturel allemand, ou Deutsches Kulturzentrum, venait d'être achevé quelques semaines auparavant, et les représentants officiels de la République fédérale et des États-Unis étaient désormais arrivés pour inaugurer le bâtiment et l'ouvrir au public. Le chancelier Schumacher n'était pas présent, car il était occupé, mais le président fédéral Erich Ollenhauer avait été envoyé pour remplir ses fonctions protocolaires en tant que chef de l'État, bien qu'à contrecœur.\n\nOllenhauer s'était dit que c'était tout de même une bonne chose, que les échanges culturels entre les pays étaient importants, mais il semblait amer que Schumacher lui ait spécifiquement demandé, à lui qui soutenait le refus de rejoindre l'Occident, d'aller en Occident et de fréquenter les diplomates américains.\n\nEn serrant la main du secrétaire d'État américain Dean Acheson, les deux hommes ont discuté des subtilités des échanges culturels, suggérant peut-être la mise en place future de programmes d'échanges étudiants. Ollenhauer n'aimait pas les échanges cordiaux, mais cela faisait partie de son travail, et tandis que les deux hommes discutaient de la différence entre la bratwurst allemande et le schnitzel autrichien, des ciseaux leur ont été remis par leurs assistants.\n\n« Il est temps », dit Ollenhauer en souriant légèrement à Acheson, alors qu'ils se dirigeaient vers le ruban tendu près de l'entrée du bâtiment. Sous les flashs des appareils photo, les deux hommes sourirent en coupant le ruban, marquant ainsi l'ouverture officielle du Centre culturel allemand et la poursuite de la coopération et du soutien entre les États-Unis et l'Allemagne de l'Ouest."
 Schumacher49.16.d: "De retour dans la salle du Bundestag, un débat houleux faisait rage, cette fois-ci au sujet du statut des forces d'occupation alliées en Allemagne de l'Ouest. Le président de la chambre tentait de faire taire le député CDU qui criait à propos de « l'incompétence du SPD en matière de défense nationale » et de la « nécessité de la présence des troupes américaines ». Une fois le calme relatif revenu, un député SPD se leva pour prendre la parole.\n\n« Je ne comprends pas comment la CDU et ses partenaires peuvent être à ce point endoctrinés et désorientés. Avec tout le respect que je dois à la mission des forces d'occupation alliées, leur présence est indésirable et injustifiée à ce stade, et elles accaparent des ressources précieuses dont notre pays a besoin pour se reconstruire. Nous avons un gouvernement social-démocrate stable et nous n'avons pas besoin de troupes étrangères qui patrouillent dans nos rues et roulent avec leurs chars sur nos autoroutes. La BGS suffit pour résoudre nos problèmes de sécurité intérieure, nous n'avons pas besoin que les Américains le fassent à notre place. Je demande donc à cette chambre de voter une résolution demandant le départ volontaire des forces d'occupation alliées de notre pays. »\n\nLa salle a explosé dans un chaos de chahut, de mécontentement général, d'acclamations bruyantes et d'applaudissements du côté du SPD, et de cris « Maintenez le statu quo » du côté de la CDU et du FDP. Le président a frappé son marteau pour rétablir l'ordre, puis a déclaré : « Je déclare ouverte la votation sur cette résolution. Le vote va maintenant commencer à bulletin secret. »"
 Schumacher49.160.d: "DE : Haute Commission alliée pour l'Allemagne\nÀ : Les gouvernements des États-Unis, du Royaume-Uni et de la République française\nObjet : Résolution sur le départ volontaire des forces d'occupation alliées\n\nÀ la suite des récents débats au Bundestag, la République fédérale d'Allemagne a officiellement voté une résolution demandant le retrait volontaire des forces d'occupation alliées de son territoire. La motion, présentée par des membres du gouvernement dirigé par le SPD, qualifiait la poursuite de l'occupation d'inutile et de contraignante pour les efforts de reconstruction de l'Allemagne, arguant que les questions de sécurité intérieure pouvaient être suffisamment gérées par le Bundesgrenzschutz nouvellement formé.\n\nLe vote, bien que controversé, a finalement été adopté, avec le soutien important des députés du SPD et de leurs alliés. Les factions CDU et FDP ont exprimé leur forte opposition, invoquant des préoccupations en matière de sécurité et la nécessité de maintenir la présence militaire américaine, britannique et française comme moyen de dissuasion contre l'agression soviétique. Malgré des échanges houleux, l'administration du chancelier Schumacher a réaffirmé son engagement à coopérer avec les Alliés occidentaux et a assuré que cette décision n'indiquait pas un changement d'orientation en matière de politique étrangère.\n\nCompte tenu de la stabilité actuelle de la République fédérale et de l'absence de menaces immédiates pour la sécurité, nous estimons que contester cette résolution pourrait générer des tensions politiques inutiles. Bien qu'un retrait complet des forces d'occupation ne soit pas immédiatement réalisable, une réduction progressive de la présence militaire, tout en maintenant une coopération militaire stratégique, pourrait être la ligne de conduite la plus prudente. Il sera nécessaire de poursuivre les efforts diplomatiques avec Bonn afin de garantir que l'Allemagne reste fermement intégrée au bloc occidental tout en accordant à son gouvernement l'autonomie qu'il recherche actuellement.\n\nNous recommandons toutefois de rester prudent. Il convient de suivre de près la situation afin d'évaluer si cette décision a des implications plus larges pour l'alignement de l'Allemagne sur les objectifs de sécurité occidentaux. Des discussions supplémentaires seront nécessaires pour déterminer le calendrier et la logistique d'une éventuelle réduction des effectifs militaires."
 Schumacher49.161.d: "À la suite de l'adoption par le Bundestag de la résolution demandant le retrait volontaire des forces d'occupation alliées, les gouvernements des États-Unis, du Royaume-Uni et de la France ont examiné la question et sont parvenus à un consensus. Tout en reconnaissant le désir de la République fédérale d'accroître sa souveraineté et son autonomie en matière de sécurité, ils soulignent également l'importance de maintenir la coopération occidentale afin d'assurer la stabilité en Allemagne et dans l'ensemble de l'Europe. \n\nDans ce contexte, la Haute Commission alliée n'a pas l'intention de s'opposer à la décision du Bundestag. Toutefois, toute réduction de la présence militaire alliée se fera progressivement et en étroite coordination avec le gouvernement fédéral afin d'éviter tout risque potentiel pour la sécurité. La préservation de la sécurité de l'Allemagne de l'Ouest et son intégration dans le cadre défensif occidental restent des priorités essentielles.\n\nIls sont convaincus que cette mesure ne modifiera en rien les relations solides entre nos nations et se réjouissent à la perspective de poursuivre les discussions sur les aspects pratiques de la mise en œuvre de cette transition."
 Schumacher49.17.d: "\nDE : Chancelier Kurt Schumacher, Gouvernement de la République fédérale d'AllemagneÀ : Max Petitpierre, président du Conseil fédéral suisse, et Tage Erlander, Premier ministre suédois\nObjet : Neutralité européenne\n\nMessieurs,\n\nJ'espère que vous vous portez bien. Comme vous le savez, la République fédérale d'Allemagne nouvellement fondée poursuit une diplomatie non alignée, rejetant l'influence des blocs occidental et oriental. Notre ministère des Affaires étrangères considère la Confédération suisse et le Royaume de Suède comme deux pays neutres et potentiellement amis avec lesquels la République fédérale souhaite renforcer ses relations dans le cadre de notre lutte contre les superpuissances dans cette « guerre froide ». J'espère pouvoir continuer à travailler avec vos pays à l'avenir."
 Schumacher49.18.d: "Alors que l'avion amorçait son approche vers l'aéroport de Belgrade, Schumacher finit son verre de cognac, qui fut emporté avant que l'avion ne rebondisse pour s'arrêter. C'était en fin d'après-midi, et Schumacher fut accueilli par une fanfare et une formation de soldats de l'armée populaire yougoslave. Après avoir serré la main du chef d'état-major yougoslave, Schumacher fut conduit à une voiture qui l'emmena au centre de Belgrade, où il fut accueilli avec les mêmes honneurs par le secrétaire général de la Ligue des communistes de Yougoslavie, Josip Broz Tito. Après avoir échangé quelques civilités, les deux hommes et leurs homologues diplomatiques passèrent rapidement aux choses sérieuses ; il ne s'agissait pas d'une visite diplomatique ordinaire.\n\nLes deux hommes ont discuté des similitudes entre leurs pays, de l'expérience de Tito avec Staline et de celle de Schumacher avec les Alliés occidentaux. Tous deux s'accordaient à dire que les tactiques des blocs occidental et oriental étaient néfastes pour leurs peuples. Si Schumacher détestait le communisme avec une passion brûlante, il avait un respect fondamental pour Tito, un homme qui se souciait véritablement de son peuple.\n\nThe trip lasted a week, with both parties agreeing to open formal diplomatic relations and continue friendly relations in the future."
 SchuStroke.1.d: "Alors que la femme de chambre frappait à la porte de la chambre privée du chancelier Kurt Schumacher, elle devenait de plus en plus inquiète. Cela ne lui ressemblait pas d'être encore endormi à une heure aussi tardive, d'autant plus qu'une réunion du cabinet devait avoir lieu dans moins d'une heure.\n\nAprès avoir tâtonné avec un trousseau de clés, elle réussit enfin à ouvrir la porte et, en regardant à l'intérieur, elle vit le chancelier de la République fédérale d'Allemagne, Kurt Schumacher en personne, affalé sur son lit, inconscient. La femme de chambre poussa un cri à glacer le sang, attirant l'attention des majordomes et autres membres du personnel de la chancellerie qui passaient par là et qui se précipitèrent à l'intérieur avec des réactions de choc similaires.\n\nSorti de nulle part, le chef de cabinet de Schumacher, Dietrich Steube, est arrivé pour tenter de calmer la situation.\n\n« Faites venir immédiatement le vice-chancelier et le président fédéral ! Réunissez le cabinet, mais dites à Franke qu'il est aux commandes jusqu'à ce que nous puissions régler la situation. »\n\nMontrant du doigt le personnel réuni, il dit : « Appelez le médecin du chancelier ! Nous devons l'emmener immédiatement à l'hôpital ! »"
 SchuStroke.2.d: "Quelques heures seulement après la découverte de l'accident vasculaire cérébral du chancelier Kurt Schumacher, le cabinet de la République fédérale s'est réuni, sous la direction provisoire du vice-chancelier Egon Franke. Bien que le président fédéral Erich Ollenhauer n'était pas tenu d'être présent, il était tout de même dans la salle, d'autant plus que la discussion allait porter sur le récent changement de direction.\n\nLe Cabinet était sous le choc, les ministres chuchotaient entre eux. Franke ouvrit la séance.\n\n« Je suis sûr que nous sommes tous légitimement inquiets et choqués d'apprendre que le chancelier a été victime d'un accident vasculaire cérébral ce matin à son domicile. On m'a assuré qu'il était pris en charge à l'hôpital Holy Spirit et que son état était stable. » Un soupir de soulagement parcourut la salle.\n\n« Nous devons maintenant aborder le sujet central de cette réunion du Cabinet. Il n'existe aucune ligne de succession claire en cas d'incapacité ou de décès du chancelier, et maintenant que nous sommes confrontés à cette situation potentielle, une décision doit être prise. »\n\nOllenhauer prit la parole depuis le coin de la pièce. « Étant donné que le vice-chancelier Franke n'est pas explicitement le successeur légal du chancelier Schumacher, il ne devrait pas être le dirigeant du pays à ce stade. » Le bruit dans la pièce augmenta légèrement à ce moment-là, mais Ollenhauer continua à parler.\n\n« Le président fédéral est le chef de l'État et est donc mieux placé pour assumer temporairement la direction du pays. »\n\nFranke répliqua : « En tant que vice-chancelier, je suis le successeur direct du chancelier, nommé directement par lui. Quelle autre raison aurais-je ? »\n\nUn ministre prit la parole. « Nous devons voter à ce sujet. Quoi qu'il en soit, le Bundestag devra voter pour désigner le successeur, en supposant que le chancelier ne soit pas en mesure de se rétablir. » Franke acquiesça. « Très bien, alors. Herr Ollenhauer, que le meilleur gagne. Veuillez inscrire votre vote sur un bout de papier et le remettre au chef de cabinet, qui comptera les votes. »"
 SchuStroke.3.d: "« Avec l'avis et le consentement du cabinet ouest-allemand, le vice-chancelier Egon Franke a été confirmé comme chancelier temporaire de l'Allemagne de l'Ouest, à la suite du récent accident vasculaire cérébral du chancelier Kurt Schumacher. Choisi personnellement par Schumacher à son arrivée au pouvoir, Franke est particulièrement qualifié pour diriger le pays en cette période difficile. »\n\nFranke sourit en lisant l'article en première page du plus grand journal de Francfort. Se tournant vers le petit groupe de personnes présentes à la Chancellerie, il posa sa main gauche sur un exemplaire de la Loi fondamentale et leva la main droite.\n\n« Je jure de consacrer mes forces au bien-être du peuple allemand, de promouvoir ce qui lui est profitable, de repousser ce qui pourrait lui nuire, de respecter et de défendre la Loi fondamentale et les lois de la Fédération, d'accomplir consciencieusement mes devoirs et de rendre justice à chaque homme, avec l'aide de Dieu. »\n\nAu milieu des applaudissements bruyants, une personne ne battait pas des mains : Erich Ollenhauer, le président fédéral, qui, conformément à la Constitution, assistait à la cérémonie de prestation de serment. Il espérait que cela ne durerait pas longtemps."
 SchuStroke.4.d: "« Avec l'avis et le consentement du cabinet ouest-allemand, le président fédéral Erich Ollenhauer a été confirmé comme chancelier temporaire de l'Allemagne de l'Ouest, à la suite du récent accident vasculaire cérébral du chancelier Kurt Schumacher. En tant que homologue de Schumacher à la tête de l'État, Ollenhauer partage les mêmes idées idéologiques que Schumacher, au grand dam du vice-chancelier Egon Franke, qui défend des opinions plus à droite au sein du SPD. Cependant, Ollenhauer a prouvé, pendant son mandat de président fédéral, qu'il était prêt et disposé à relever le défi qui l'attendait. »\n\nOllenhauer sourit en lisant l'article en première page du plus grand journal de Francfort. Se tournant vers le petit groupe de fonctionnaires de la Chancellerie, il posa sa main gauche sur un exemplaire de la Loi fondamentale et leva la main droite.\n\n« Je jure de consacrer mes forces au bien-être du peuple allemand, de promouvoir ce qui lui est profitable, de repousser ce qui pourrait lui nuire, de respecter et de défendre la Loi fondamentale et les lois de la Fédération, d'accomplir consciencieusement mes devoirs et de rendre justice à chaque homme, avec l'aide de Dieu. »\n\nAu milieu d'applaudissements bruyants se tenait un homme placé dans une situation précaire : Egon Franke, toujours vice-chancelier, rival d'Ollenhauer, désormais relégué au second plan. Il espérait que cela ne durerait pas longtemps."
 SchuStroke.5.d: "Lorsque le Chancelier entra dans la salle du Conseil, il était perplexe. À peine quelques semaines après avoir pris ses fonctions temporaires de chancelier, il devait déjà désamorcer une situation diplomatique.\n\nTournant son attention vers le ministre des Affaires étrangères, il se mit à écouter.\n\n« Monsieur le Chancelier, le secrétaire général soviétique Joseph Staline a présenté des propositions pour la réunification allemande, à condition que nous restions neutres et que nous garantissions « les droits de l'homme et les libertés fondamentales ». Les responsables alliés soupçonnent que les « notes de Staline » ne sont qu'un bluff destiné à permettre aux Soviétiques de rejeter la responsabilité de la division de l'Allemagne sur les Alliés. Monsieur, nous devons régler cette question dès que possible. »\n\nIl prit la parole. « Même si j'apprécie beaucoup nos collègues de Washington et de Londres, ils semblent considérer presque tout comme un complot soviétique contre eux. Je pense que l'Allemagne devrait rester neutre dans cette nouvelle guerre froide qui s'intensifie rapidement, mais si c'est selon les conditions des Soviétiques, je ne me prononcerais pas aussi rapidement. »\n\nLe Ministre de la Défense prit la parole. « Monsieur, bien que je sois d'accord, je dois protester vigoureusement. Nous ne devrions pas accorder plus de temps à cette manœuvre soviétique. L'unification est importante, mais pas dans ces circonstances. »\n\nLe Chancelier acquiesça. « Très bien. Mettons cela aux voix. »"
 SchuStroke.6.d: "Depuis le tragique accident vasculaire cérébral dont a été victime le chancelier Schumacher, le débat sur la succession au sein du gouvernement fait rage. Afin de résoudre cette question, un groupe de politiciens du SPD, mené par le chancelier provisoire Ollenhauer, a proposé un amendement à la Loi fondamentale établissant une ligne de succession pour le chancelier fédéral à l'avenir. Destiné à compléter l'article 57, cet amendement est libellé comme suit :\n\n« En cas d'incapacité du chancelier fédéral à exercer ses fonctions ou en cas de vacance prématurée de son poste, les fonctions du chancelier fédéral seront assumées par le président fédéral, puis par le vice-chancelier et le président du Bundesrat. »\n\nLors de discussions privées, le vice-chancelier Egon Franke a considéré cela comme une mise à l'écart de son autorité, en particulier après son éviction du poste de chancelier lors de la crise de succession initiale. Cette mesure devrait être adoptée par le Bundestag, notamment en tant que question bipartisane liée à la question de la succession qui s'est posée il y a quelques semaines."
 SchuStroke.7.d: "C'est en grande pompe que Kurt Schumacher a fait son retour à la Chancellerie fédérale à Francfort, après avoir suivi un traitement et une rééducation à l'hôpital Holy Spirit suite à son accident vasculaire cérébral. Alors qu'il se préparait à prêter serment, Schumacher a rencontré le chancelier provisoire, le président fédéral et d'autres responsables. Ollenhauer, qui semblait plutôt ravi de voir Schumacher revenir, lui a souhaité bonne chance et s'est réjoui de retrouver le président fédéral grâce au retour de Schumacher. La réaction de Franke a toutefois été très différente. Soucieux de préserver la ligne de succession et l'État de droit, il s'est senti mis à l'écart par la relation amicale entre Schumacher et Ollenhauer, et même s'il avait été choisi par le chancelier comme adjoint, il était contrarié de retrouver son ancien poste.\n\nLa main posée sur le même exemplaire de la Loi fondamentale que celui utilisé pour la prestation de serment de l'ancien chancelier [WGR.GetLeader] Kurt Schumacher était de retour !"
 SchuStroke.8.d: "Ce fut une nouvelle journée tumultueuse au Bundestag, mais cette fois-ci pour une raison différente. Après le récent retour de Kurt Schumacher au poste de chancelier, la CDU a manifesté une opposition compréhensible à sa reconduction, y voyant une manœuvre politique visant à consolider le pouvoir du SPD.\n\nUn député CDU s'est levé pour poursuivre le débat, en commençant par : « Examinons cela de manière logique, ce dont mes collègues de gauche ne sont pas capables, je le sais. » Rires du côté CDU, huées du côté SPD.\n\n« Le chancelier est victime d'un accident vasculaire cérébral, que Dieu lui vienne en aide. Il est remplacé par un autre ministre du SPD en tant que chancelier provisoire, tandis que la question de la succession fait l'objet d'un débat sans fin. Mais le chancelier Schumacher revient ? Et le peuple allemand est censé accepter cela ? La transition d'un ministre à un autre, sans aucun contrôle du Bundestag ou du peuple directement ? L'état de santé du chancelier Schumacher est-il vraiment stable ? Il a déjà été victime d'un accident vasculaire cérébral, qui dit qu'il n'en aura pas un autre ? »\n\nIl a rapidement été interrompu par une salve de huées et de cris, provenant même de certains membres de son propre parti. La remarque sur l'état de santé de Schumacher était allée trop loin, mais le SPD allait devoir réagir, car un député s'était levé pour prendre la parole.\n\n« Pour répondre au député CDU à ma gauche, vos commentaires sur l'état de santé du chancelier sont injustifiés et déplacés dans cette assemblée ! Et pour répondre aux préoccupations soulevées au sujet de la transition, il était nécessaire de maintenir la stabilité et le fonctionnement du gouvernement de la République fédérale pendant que le chancelier se reposait et se rétablissait. Son état s'étant amélioré, il a été reconduit dans ses fonctions de chancelier, principalement parce qu'il a été dûment élu par le peuple pour servir. La CDU aurait fait de même si cela était arrivé à Herr Adenauer. »\n\nUn silence choqué s'est fait entendre du côté de la CDU. Personne ne s'est levé pour prendre la parole. Pendant ce temps, les députés du SPD regardaient avec des sourires narquois, sans même rire. Le SPD remporte une nouvelle victoire."
 SchuStroke.9.d: "Schumacher était assis dans son bureau un samedi soir pluvieux, se remémorant les dernières années. Il avait remporté la chancellerie, était devenu le premier dirigeant SPD de l'Allemagne depuis des décennies, avait accompli des progrès considérables en matière de politique, pour finalement tout perdre à cause de son accident vasculaire cérébral et de sa convalescence. Il y avait eu toute cette affaire de succession que la CDU et son appareil de propagande avaient tenté de démolir. Schumacher avait fait tout ce qu'il pouvait, et parmi les deux adjoints qui se disputaient la direction du SPD, l'un était plus proche de l'idéologie et de la politique de Schumacher : Erich Ollenhauer.\n\nIl était temps de le préparer, que cela plaise ou non à Franke. Regardant par la fenêtre, il appela sa secrétaire.\n\n« Faites entrer Erich. »"
 SchuDeath.1.d: "Tout le personnel savait depuis un certain temps que cela allait arriver. Ollenhauer avait été informé quotidiennement de l'état de santé de Schumacher au cours des derniers mois depuis son retour, et un plan d'urgence avait été élaboré.\n\nUn matin, alors qu'ils discutaient dans le bureau du chancelier, Schumacher s'interrompit soudainement au milieu d'une conversation sur la politique.\n\n« Erich, j'ai réfléchi. « Erich, c'est mon héritage. Nous avons accompli tant de choses, et même pendant mon absence, comment vais-je rester dans les mémoires ? »\n\n»\n\n« Qu'en pensez-vous, Monsieur le Chancelier ? »\n\n« Monsieur, vous êtes le premier chancelier SPD depuis des décennies ; nous avons construit le pays, érigé un rempart contre l'extrémisme et réorienté notre politique étrangère. »\n\nSchumacher semblait soulagé. « Oui, je suppose que oui... »\n\nIl haleta, se saisissant la poitrine, et tomba à terre.\n\nOllenhauer, faisant de son mieux, aida Schumacher à se mettre dans une position plus confortable, puis se dirigea vers le bureau et composa le numéro sur le téléphone à cadran.\n\n« Herr Doktor ? C'est Erich. Ça s'est reproduit, probablement pour de bon. »\n\nLes médecins se précipitèrent à nouveau, car Ollenhauer avait déclaré avoir fait tout ce qu'il pouvait. Cette fois, le chancelier de la République fédérale d'Allemagne, Kurt Schumacher, était bel et bien mort."
 SchuDeath.2.d: "Alors qu'Ollenhauer s'installait dans le fauteuil du bureau du chancelier, il repensa à tout ce qui s'était passé au cours des derniers mois. Tout était désormais terminé, car Ollenhauer et sa clique s'étaient imposés comme l'avenir du SPD, du moins jusqu'aux élections fédérales de 1953.\n\nFranke et son groupe de Kanalarbeiters, opposés au SPD, avaient discrètement menacé d'organiser des manifestations, mais Ollenhauer avait réussi à les dissuader, au nom de l'unité au sein du SPD.\n\nIl y avait beaucoup à faire et peu de temps avant les élections. Il fallait organiser des funérailles nationales, former un gouvernement, stabiliser le pays et faire son deuil pendant quelques mois. Il fallait mener une campagne pour remporter les quatre prochaines années. Ollenhauer se prépara mentalement et commença à trier les papiers."
 SchuDeath.3.d: "C'était un lundi matin à la Chancellerie fédérale. Les employés arrivaient les uns après les autres, allumaient les lumières, mettaient en route la machine à café et commençaient à rédiger les rapports politiques et d'information habituels.\n\nÀ 7 h 30, Dietrich Steube, chef de cabinet d'Ollenhauer, arriva au bureau et sourit à tous ses subordonnés déjà affairés. Il n'avait même pas fini de se servir sa première tasse de café de la matinée qu'un groupe d'hommes en costume fit irruption dans le couloir devant son bureau, mené par le vice-chancelier Egon Franke.\n\n« Qu'est-ce que cela signifie ? » s'écria presque Stuebe, avant d'être interrompu.\n\n« Nous sommes ici pour protester, Herr Steube. Ce coup d'État orchestré par Herr Ollenhauer et ses sbires est allé trop loin ; d'abord la crise de succession, et maintenant ça ? » Alors que d'autres hommes entraient dans la pièce derrière lui, d'autres encore se déplaçaient dans le bâtiment, les bras croisés, un sourire narquois aux lèvres. « Nous, les Kanalarbeiters, véritables représentants du SPD, exigeons que JUSTICE soit faite dans cette affaire, et nous l'exigeons maintenant ! »\n\nSteube resta bouche bée, sous le choc. Franke poursuivit : « Nous ne quitterons pas la Chancellerie tant que cette question n'aura pas été résolue de manière constructive une fois pour toutes, lorsque le chancelier lui-même autorisera tous les membres du SPD à travailler au sein du gouvernement et, si possible, démissionnera de son poste ! »\n\nÀ ce moment-là, tous les membres se retournèrent alors qu'Ollenhauer marchait dans le couloir vers son bureau adjacent, s'arrêtant pour observer l'agitation.\n\n« Que se passe-t-il, Steube ? » « Monsieur, Franke et les Kanalarbeiters occupent le bâtiment et refusent de partir tant que nous n'aurons pas réglé la question du leadership. »\n\n« Très bien, comment pouvons-nous régler cela, Egon ? »"
 SchuDeath.4.d: "Depuis l'élection de Kurt Schumacher et du Parti social-démocrate au pouvoir en 1949 en tant que premier chancelier de la République fédérale, le SPD est de plus en plus divisé entre le plaignant (M. Franke) et le défendeur (M. Ollenhauer), qui sont en désaccord sur diverses questions politiques et idéologiques concernant le SPD.\n\nLe conflit s'est intensifié après le premier coup porté par Kurt Schumacher, plongeant le gouvernement dans une crise de succession qui s'est soldée par une lutte d'influence sans issue entre les deux hommes.\n\nLe plaignant, Egon Franke, soutient que la succession d'Erich Ollenhauer, son rival, après la mort prématurée de Schumacher, constituait un coup d'État contre le SPD et contre le peuple, et que son groupe, connu sous le nom de Kanalarbeiters (ou « ouvriers des égouts »), n'a pas son mot à dire dans la politique gouvernementale du SPD. Il a notamment expliqué que le retour de Schumacher à son poste était une manœuvre délibérée visant à légitimer Erich Ollenhauer comme prochain leader du SPD, par opposition à lui-même.\n\nCependant, Ollenhauer et son gouvernement affirment que Schumacher avait été très précis quant au choix de son successeur et que, le gouvernement ayant déjà été confronté à deux reprises à une crise de succession, il est nécessaire de nommer Ollenhauer jusqu'aux prochaines élections. Ollenhauer a contesté cette décision, mais ne l'a pas rejetée par respect pour le processus démocratique et le système judiciaire.\n\nIl faudra décider s'il faut garder Ollenhauer ou permettre à Franke d'exercer ses fonctions à titre provisoire jusqu'à l'élection."
 SchuDeath.5.d: "C'était un matin pluvieux lorsque Franke, suivi de quelques membres de son équipe, entra dans une salle de conférence du siège du Parti chrétien-démocrate à Francfort, où étaient assis deux responsables de la CDU : Konrad Adenauer, le chef de l'opposition, et Ludwig Erhard, son adjoint. Franke s'assit à l'autre bout de la table et les deux groupes entamèrent la discussion.\n\n« Merci d'être venu, Monsieur Franke. »\n« C'est avec plaisir, Herr Adenauer. Je suis heureux que nous soyons parvenus à un accord mutuel, même si nos partis sont en opposition farouche. »\n\n« Nous devons trouver une solution pour Herr Ollenhauer. Il représente une menace pour nous deux. Vous faites peut-être partie de son parti, mais il existe des différences évidentes. »\n\n« C'est précisément pour cela que je suis venu vous rencontrer. Les membres du SPD d'Ollenhauer sont majoritaires au Bundestag, mais mon groupe, les Kanalarbeiters, est prêt à voter avec la CDU et le FDP sur les questions qui vont à l'encontre du programme du chancelier. S'il doit rester chancelier, nous lui rendrons la tâche aussi difficile que possible jusqu'aux élections. »\n\nAdenauer semblait plutôt satisfait et jeta un coup d'œil à Erhard, qui acquiesça. « Très bien, je suis ravi que nous ayons pu nous rencontrer pour discuter de cette question. »\n\nLes deux hommes, Franke et Adenauer, se serrèrent la main, puis sourirent tandis que Franke quittait la pièce à grands pas."
 SchuDeath.6.d: "Une journée mémorable se déroulait une fois de plus à la Chancellerie, alors que le gouvernement changeait de mains pour ce qui semblait être la cinquième fois en un an. Franke, entouré de membres du personnel et de fonctionnaires, leva la main droite et réitéra le serment du chancelier fédéral, ouvrant la voie à un gouvernement provisoire jusqu'aux élections.\n\nAu final, Franke avait gagné, non seulement au sens juridique de l'affaire portée devant la Cour constitutionnelle fédérale, mais aussi sur le plan de l'influence, en ralliant l'opinion publique contre Ollenhauer et en faveur d'une social-démocratie plus conservatrice et plus à droite.\n\nOllenhauer était présent, en tant que chancelier sortant, et a géré la situation avec une certaine élégance, mais en considérant que cela marquerait au moins la fin de son mandat dans la politique fédérale."
 SchuDeath.7.d: "« Citoyens allemands, mon accession au poste de chancelier après le décès prématuré de Kurt Schumacher, victime d'un accident vasculaire cérébral, que Dieu ait son âme, a suscité beaucoup de discussions et de protestations. »\n\nOllenhauer s'est exprimé à la radio, un soir de semaine comme d'habitude, comme le faisait généralement son prédécesseur.\n\n« Il était nécessaire de poursuivre sur la voie d'un gouvernement stable, en particulier après la première crise de succession au début de cette année. Mes rivaux au sein du parti, en particulier Herr Franke, m'ont accusé d'avoir organisé un coup d'État, et je comprends cette perception ; mais vous devez comprendre que mon mandat ne dure que jusqu'aux élections de 1953 ; si vous, le peuple, décidez de voter pour le SPD, c'est certainement votre droit. Mais si un nouveau gouvernement entre en fonction, la Loi fondamentale sera respectée et je démissionnerai. Je ne peux qu'espérer que vous, le peuple, prendrez la bonne décision pour votre pays, et je continuerai à servir dans ce gouvernement au mieux de mes capacités jusqu'à ce moment-là. Bonne nuit. »\n\nLorsque le technicien radio lui fit signe qu'il n'était plus à l'antenne, Ollenhauer poussa un soupir. Il espérait que cela suffirait à convaincre le peuple qu'il était le chancelier légitime, du moins pour l'instant. Il avait subtilement évoqué les élections afin d'inciter les gens à voter pour le SPD, mais après cette mésaventure avec Schumacher, il avait moins confiance dans les sondages. Il espérait que tout s'arrangerait, pensa-t-il."
 SchuDeath.8.d: "C'était une journée sombre sur la place principale devant le Romer à Francfort, car la ville était pratiquement paralysée aujourd'hui, jour des funérailles nationales de l'ancien chancelier Kurt Schumacher. Alors que les personnes en deuil se massaient le long des rues, un carrosse tiré par des chevaux, transportant le cercueil de Schumacher recouvert du nouveau drapeau allemand, s'approcha de la place et s'arrêta au centre, où se trouvait une estrade. Plusieurs milliers de hauts fonctionnaires et de dignitaires, non seulement de la République fédérale, mais aussi des États-Unis, du Royaume-Uni et de la France, ainsi que d'autres alliés européens, étaient présents.\n\nOllenhauer est venu prononcer l'éloge funèbre, comme l'avait expressément demandé son ami.\n\n« Citoyens allemands et dignitaires réunis. Nous sommes aujourd'hui réunis pour célébrer la vie et les réalisations d'un homme véritablement exceptionnel, grand dirigeant de la République fédérale à l'un des moments les plus décisifs de l'histoire de cette nouvelle nation. Kurt a véritablement été le pionnier de la social-démocratie allemande moderne et ses politiques, notamment en matière de lutte contre l'extrémisme, de reconstruction économique et de restructuration de la politique étrangère, ont mis notre pays sur la voie du succès. Nous devons reconnaître ses réussites et ses échecs, et ses problèmes de santé prématurés ont mis fin à l'œuvre de sa vie bien trop tôt. »\n\nAlors qu'il prononçait ces mots, la foule entière éclata en applaudissements, tandis qu'une ligne de sept soldats du BGS, armés de fusils, les levaient et tiraient.\n\nCrack. Un clic lorsqu'ils ont rechargé. Crack. Un clic. Un dernier, troisième crack.\n\nAlors que les soldats remettaient leurs armes au garde-à-vous, un clairon se mit à jouer, tandis que deux autres soldats du BGS retiraient le drapeau allemand du cercueil et commençaient à le plier. Certaines personnes se mirent à pleurer, tandis que tous les autres avaient l'air désespéré. Ce fut vraiment un jour triste pour l'Allemagne."
 SchuDeath.9.d: "Même après les funérailles de Schumacher et l'annonce publique d'Ollenhauer, les tensions avaient encore atteint un point critique. À Munich, des manifestants pro-Franke ont occupé les bureaux du gouvernement bavarois, ce qui a conduit au déploiement des forces du BGS.\n\nÀ Francfort, la place du Römer et d'autres places étaient remplies de manifestants brandissant des pancartes contre la corruption, criant des insultes à l'encontre d'Ollenhauer et maudissant la police et le gouvernement.\n\nEn raison de la proximité de la Chancellerie, la BGS a été déployée sur la place, équipée de matériel anti-émeute et de matraques, et s'est rapidement engagée contre les manifestants les plus violents et les plus incendiaires, les plaquant au sol et les arrêtant.\n\nToujours contraints de reculer vers le bâtiment, un hélicoptère équipé de grenades lacrymogènes a survolé la place, larguant des gaz lacrymogènes et poussant les manifestants à fuir vers les rues adjacentes, directement dans les bras de la police de Francfort et des soldats du BGS."
 Ollenhauer53.1.d: "Lorsque le chancelier est entré dans la salle du Conseil ce matin, toutes les personnes présentes savaient que le sujet abordé serait l'un des débats les plus importants du nouveau gouvernement Ollenhauer.\n\nLorsque Ollenhauer s'assit, la tension dans la pièce était palpable, car personne ne voulait vraiment aborder ce sujet, mais il fallait en discuter. La chancelière prit la parole.\n\n« À propos du Bundesgrenzschutz, le BGS, la garde-frontière, peu importe comment vous voulez l'appeler. Quelle devrait être notre politique militaire ? »\n\nImmédiatement, deux blocs se formèrent au sein du cabinet ministériel : comme on pouvait s'y attendre, une faction pro-Ollenhauer et la minorité des ministres Kanalarbeiter placés au gouvernement pour apaiser Franke. « Nous devons renforcer le BGS ! » s'écria un ministre du second groupe.\n\n« Non ! Ce sont les gardes-frontières ! Regardez ce qui s'est passé la dernière fois que ce pays a essayé de constituer une armée défensive ! »\n\nCela a déclenché une véritable bataille verbale, les ministres des deux camps s'affrontant sur les avantages et les risques liés à l'agrandissement du BGS.\n\nOllenhauer frappa du poing sur la table pour rappeler l'assemblée à l'ordre. Il se tourna ensuite vers les partisans de l'armement et leur demanda : « Comment comptez-vous développer le BGS ? »\n\n« Très simplement, Herr Ollenhauer, nous présenterions un projet de loi visant à autoriser davantage d'unités, à fortifier la frontière et à mettre en place des politiques visant à transformer cette force en une composante plus militaire plutôt qu'en une unité de police. »\n\n« Très bien, écoutons l'autre partie. » Un ministre adjoint assis de l'autre côté de la table prit la parole. « Eh bien, nous pensons que le BGS a été créé uniquement pour assurer la surveillance des frontières et faire office de police fédérale. Il n'y a aucune raison de modifier aussi radicalement sa mission. Les deux parties s'accordent sur la nécessité d'assurer la sécurité de nos frontières, et le BGS s'en acquitte très bien, sans qu'il soit nécessaire de renforcer les forces militaires. »\n\nOllenhauer acquiesça, comprenant les arguments des deux parties. « Bon, nous devons prendre une décision. Faut-il élargir la BGS ou la laisser telle quelle ? »"
 Ollenhauer53.2.d: "Alors que les membres du Bundestag assemblés murmuraient entre eux dans la grande salle, Ollenhauer entra, monta à la tribune, mit ses lunettes et s'éclaircit la voix.\n\n« Mesdames et Messieurs les députés du Bundestag, je suis ici, comme à l'accoutumée, pour vous rendre compte de la situation de la République fédérale et vous présenter mon programme pour l'année à venir. Nous avons accompli beaucoup de choses cette année, et ce gouvernement a traversé de nombreuses épreuves. Avec le décès de l'ancien chancelier Schumacher, le pays a de nouveau été plongé dans le chaos. Le parti a dû relever des défis difficiles, mais j'ai finalement été choisi comme chancelier. »\n\nLa dernière phrase a provoqué un léger remous dans la salle, certains exprimant discrètement leur désaccord avec Ollenhauer, mais celui-ci a continué à parler.\n\n« Il est essentiel que nous traversions cette période tumultueuse en tant que nation unie. Ce nouvel environnement international devient rapidement dangereux, et bien que j'aie l'intention d'améliorer la vie de tous les Allemands, jeunes et vieux, de toutes confessions, il faut remédier à la politique de division, non seulement au sein de mon propre parti, mais aussi de l'autre côté de l'échiquier politique. C'est pourquoi mon administration s'efforcera d'apaiser les divisions qui sont apparues et d'orienter notre pays vers une politique étrangère plus neutre et plus pragmatique, en tenant compte des revendications idéologiques des deux côtés du rideau de fer. J'ai engagé mon honneur sacré sur ces idéaux en prenant les rênes de la chancellerie, et je jure de le faire pour tout le peuple allemand ! »\n\nCette dernière partie a suscité des applaudissements, non seulement du côté du SPD, mais aussi de la CDU ; même leurs députés ont été impressionnés.\n\nLes experts ont été agréablement surpris par le ton diplomatique d'Ollenhauer et sont curieux de connaître l'avenir des relations politiques internes allemandes sous Ollenhauer."
 Ollenhauer53.3.d: "C'était une matinée ensoleillée à Francfort lorsqu'un visiteur inattendu entra dans la Chancellerie fédérale. Il était assez rare ces jours-ci que des responsables du parti CDU se rendent à la Chancellerie, car ils avaient plutôt l'habitude de se réunir en groupes à leur siège ou dans les salles du Bundestag. Mais aujourd'hui, il ne s'agissait ni d'une visite ordinaire, ni d'un visiteur ordinaire. Il s'agissait ni plus ni moins que de Ludwig Erhard, qui passa calmement devant quelques assistants perplexes pour se rendre directement dans la salle de conférence où se traitent la plupart des affaires de la République fédérale. Il s'assit en face du chef de cabinet d'Ollenhauer, ainsi que de quelques autres responsables du SPD et conseillers politiques.\n\n« Que puis-je faire pour vous en cette belle journée, messieurs ? »\n\nLe chef de cabinet d'Ollenhauer prit la parole. « Eh bien, Herr Erhard, nous avons une proposition à vous faire. Puisque nous avons décidé d'établir des relations plus positives avec votre parti, le chancelier souhaite vous offrir le poste de ministre de l'Économie dans son nouveau gouvernement. Nous ne voyons personne d'autre qui soit plus qualifié pour déterminer nos politiques économiques, et une coopération entre les deux partis contribuerait à renforcer le soutien du public à ce gouvernement. »\n\nErhard sembla quelque peu déconcerté par cette proposition. « Eh bien, je suis honoré. Je ne vois aucune raison pour laquelle mon parti aurait des objections, mais je dois poser une question : pourquoi moi ? Le SPD n'a-t-il personne d'autre qui soit suffisamment qualifié pour diriger la politique économique ? »\n\nCela suscita quelques froncements de sourcils parmi les responsables du SPD. « Eh bien, votre CV parle de lui-même. Directeur économique de la Bizone, puis votre travail sur la réforme monétaire en 1948. Monsieur Erhard, vous avez créé le mark allemand ! Pourquoi ne vous avons-nous pas sollicité plus tôt ? »\n\n« Encore une fois, je suis honoré. Je vais en discuter avec certains membres de mon parti, mais je n'ai aucun doute que j'accepterai ce poste, et je vous remercie infiniment de me l'avoir proposé. »\n\nAprès avoir serré la main de son interlocuteur et éteint son cigare dans le cendrier, Erhard sourit avant de prendre congé. Le chef de cabinet d'Ollenhauer et les différents fonctionnaires présents dans la pièce le regardèrent partir, puis se sourirent. C'était une grande victoire."
 Ollenhauer53.4.d: "C'était une nouvelle journée chargée à la Chancellerie. Dietrich Steube, chef de cabinet d'Ollenhauer, était en train de lire des notes d'information et de vérifier des documents fournis par ses assistants lorsque le téléphone sonna. Il décrocha le combiné à cadran et reconnut la voix du standard téléphonique du bâtiment.\n\n« Monsieur Steube, appel extérieur de la Commission spéciale pour les enquêtes sur le national-socialisme. »\n\nIl y eut un clic. « Monsieur Steube ? »\n« Oui, à qui ai-je l'honneur ? »\n« Je suis membre de la commission d'enquête sur les nazis. Il y a certaines informations que vous devriez connaître. »\n« Qu'est-ce que c'est ? »\n« Nous disposons d'informations crédibles selon lesquelles un membre de votre cabinet aurait collaboré avec les nazis pendant la guerre. »\n« Qui ? »\n« Herbert Kriedemann. »\n\n« Merci. » Clic.\n\nSteube raccrocha le téléphone en silence, puis se leva immédiatement pour entrer dans le bureau de la chancellerie.\n\n« Monsieur le Chancelier, nous avons un problème. »\n\nOllenhauer leva les yeux de son bureau, où il était occupé à signer des papiers. « Oui, Dietrich ? »\n\n« Nous disposons d'informations crédibles selon lesquelles un membre du SPD, Herbert Kreidemann, aurait collaboré avec la Gestapo pendant la guerre. Un résumé plus détaillé est en cours d'envoi par la Commission spéciale pour les enquêtes sur le national-socialisme, mais nous devons décider de la marche à suivre avant que la presse ne mette la main sur ces informations. »\n\n« Que fait-il au sein de notre gouvernement ? »\n\n« Il est l'un des secrétaires d'État parlementaires du ministère de l'Alimentation et de l'Agriculture. »\n\nIl y eut un silence. « Monsieur le Chancelier, nous pourrions le licencier discrètement, ou nous pourrions profiter de cette occasion pour faire de lui un exemple et montrer à la nation que nous ne tolérons pas les collaborateurs nazis parmi nous. »\n\nOllenhauer réfléchit un instant, puis se tourna vers Steube et dit..."
 Ollenhauer53.5.d: "Après la décision du chancelier Ollenhauer d'organiser des audiences publiques télévisées sur les fonctionnaires et leurs liens avec les nationaux-socialistes dans le passé, les médias se sont mis en branle. La nouvelle chaîne ARD a immédiatement commencé à installer des caméras dans les salles de commission du Bundestag, alors que les délibérations de la commission spéciale chargée des enquêtes sur le national-socialisme étaient télévisées pour la première fois.\n\n« Monsieur Kreidemann, n'étiez-vous pas un collaborateur affilié à la Geheime Staatspolizei, ou Gestapo, en janvier 1934 ? »\n\nUne pause. « Oui, Monsieur le Président, je l'étais. »\n\n« Et n'étiez-vous pas en contact avec un agent de la Gestapo, Reinhold Schwabe, pendant cette période ? »\n\nUne autre pause. « Oui, Monsieur le Président, je l'étais. »\n\n« Dans le jugement rendu par le tribunal régional de Hanovre le 31 mai 1949, il est dit : « Les dossiers attestent de manière si concluante l'activité de Kreidemann dans l'intérêt de la Gestapo... que les termes « informateur de la Gestapo » dans le contexte des allégations factuelles ne dépassent pas leur contenu dans la forme ». Qu'avez-vous à dire à ce sujet, Monsieur Kreidemann ? »\n\nIl y eut cette fois-ci un silence extrêmement long, tandis que la foule derrière Kreidemann murmurait entre elle, et que l'on entendait des chuchotements « Gestapo ? ».\n\n« Eh bien, Monsieur le Président... oui. J'ai travaillé avec la Gestapo. C'était... regrettable. Mais je n'avais guère le choix... et je pensais que cela fonctionnerait. L'appareil du parti se trouvait à Prague à l'époque... »\n\nIl fut interrompu. « Monsieur Kreidemann, merci d'être venu. Ce sera tout. Les agents du BGS vont maintenant vous raccompagner. »\n\nKreidemann, se levant, avait l'air honteux alors qu'un groupe d'officiers du BGS se rassemblait autour de lui et l'accompagnait hors de la salle, sous les huées et les cris de « Traître ! ». Ce n'était que le début, car la Commission spéciale allait faire toute la lumière sur tous les collaborateurs nazis au sein du gouvernement SPD."
 Ollenhauer53.6.d: "Ollenhauer regrettait depuis longtemps ce moment, mais il devait arriver. Steube, son chef de cabinet, avait insisté pour s'occuper de l'affaire, mais Ollenhauer avait refusé, car il avait une expérience personnelle en la matière.\n\nHelga, la secrétaire d'Ollenhauer, ouvrit la porte, et Kreidemann entra, l'air plutôt penaud, accompagné de Steube. Leur faisant signe de s'asseoir, Ollenhauer commença.\n\n« Je suis sûr que vous savez de quoi il s'agit, Herr Kreidemann. »\n\n« Oui, Monsieur le Chancelier, je le pense. »\n\n« Oui, Herbert. La Commission spéciale pour les enquêtes national-socialistes nous a informés de votre collusion avec la Gestapo avant et pendant la guerre, et dispose de preuves pour le démontrer. »\nIl soupira.\n« Herbert, j'aimerais te poser une question. Pourquoi as-tu fait ça ? Pourquoi as-tu collaboré avec eux ? Tu savais ce qui allait se passer, la trahison de ton parti, de tes camarades, de tes amis... »\n\nKreidemann leva les yeux. « Monsieur le Chancelier, j'ai accepté de les rencontrer en 1936. Vous le saviez, vous faisiez partie de l'appareil du parti à Prague à l'époque. Vous étiez au courant de mes actions. Je pensais que cela suffirait à les apaiser suffisamment longtemps pour qu'ils me respectent. Je me suis trompé. »\n\nOllenhauer répondit : « Vous savez dans quelle situation cela me met ? Nous accusons la CDU d'être le parti des nazis, et soudain, nous avons un secrétaire d'État parlementaire qui a travaillé pour la Gestapo ? Écoutez. J'aurais pu faire de vous un exemple public, mais pour le bien du parti et de votre image, la Chancellerie gardera le silence. » Ollenhauer marqua une pause. « Herbert, vous êtes licencié. Le ministre de l'Alimentation, de l'Agriculture et des Forêts en sera informé, nous publierons un communiqué indiquant que vous avez souhaité vous retirer du gouvernement, et vous recevrez une indemnité de départ. Mon chef de cabinet, Herr Steube, s'occupera des détails. Ce sera tout. »\n\nKreidemann sourit légèrement. « Merci, Monsieur le Chancelier. Je souhaite bonne chance à votre gouvernement et je regrette mes choix passés. »\n\nIl quitta ensuite le bureau, accompagné de Steube, qui lança un regard approbateur à Ollenhauer. C'était fait."
 Ollenhauer53.7.d: "Ce fut un jour mémorable dans la banlieue de Hambourg, à Stade, lorsqu'une longue file de Mercedes noires est arrivée au nouveau complexe de la centrale nucléaire de Stade pour son inauguration.\n\nSouriant à la presse et au personnel de la centrale électrique, tous coiffés de casques de chantier, M. Ollenhauer lui-même portait un casque en plastique jaune vif, orné du logo fédéral représentant un aigle. Sous les flashs des appareils photo, M. Ollenhauer a posé avec une paire de ciseaux comiquement grande, tandis que lui-même, son ministre de l'Intérieur et le directeur de la centrale électrique coupaient le ruban tendu à l'entrée de la tour de refroidissement.\n\nIl a ensuite visité les installations, inspecté la salle de contrôle et les installations de pompage, puis prononcé un bref discours dans le bâtiment administratif.\n\n« C'est vraiment un jour historique pour l'Allemagne, car nous avons exploité pour la première fois l'énergie atomique sur notre territoire et pouvons l'utiliser pour alimenter les foyers, les emplois et les moyens de subsistance de nos concitoyens. »"
 Ollenhauer53.8.d: "« Dans toute l'Allemagne, des manifestations ont éclaté dans les rues lorsque la nouvelle est tombée de Francfort que le gouvernement Ollenhauer avait l'intention d'interdire les écoles religieuses. Les manifestations les plus importantes ont eu lieu à Munich, capitale de la Bavière, région à majorité catholique, témoignant du mécontentement général de la population face à cette nouvelle politique et constituant un avertissement pour la Chancellerie. »\n\nOllenhauer referma le journal local du matin et regarda Steube. « Eh bien, avions-nous prévu cela à l'avance ? »\n\n« Eh bien, Monsieur le Chancelier, il est logique que les catholiques s'opposent à nos politiques scolaires laïques, mais nous ne pensions pas que cela dégénérerait en manifestations. »\n\n« Très bien, nous devons alors décider si nous devons poursuivre. Après tout, la loi sur la normalisation de l'éducation a déjà été adoptée, mais elle n'entrera en vigueur que le mois prochain. »\n\n« Oui, monsieur. Devrions-nous faire preuve de bonne foi et l'abroger, ou poursuivre nos politiques déclarées, faire adopter le projet de loi et gérer les conséquences plus tard ? » Ollenhauer marqua une pause pour réfléchir, comme il avait coutume de le faire."
 Ollenhauer53.9.d: "À Munich, le commandant local du BGS était assis dans son bureau lorsque le téléphone sonna. Il avait lu des articles similaires dans le journal au sujet des manifestations qui avaient lieu à Munich, et lui, pour sa part, était généralement indifférent aux écoles religieuses ; comme la plupart des Bavarois, il était catholique, mais ses enfants fréquentaient l'école publique. Ja, mais le téléphone sonnait.\n\n« Allô ? »\n\n« Hauptmann Strasse, les manifestants se déplacent de la Frauenkirche vers la Marienplatz, en descendant la Kaufingerstrasse. Les unités locales de la BGS et de la police de Munich sont débordées, et la Chancellerie a approuvé le recours à la force pour disperser les manifestants. Vous êtes autorisé à déployer votre garnison. »\n\n« Jawohl, merci. » Se levant, il rassembla tous ses officiers d'état-major et sous-officiers, et leur ordonna de se tenir prêts à partir.\n\nEn moins de cinq minutes, une force composée de soixante-dix officiers et militaires du BGS s'était rassemblée dans un convoi de véhicules blindés et de jeeps, armée d'armes légères et de lance-grenades lacrymogènes. Le moment était venu.\n\nAlors que les forces de l'ordre descendaient la Kaufingerstrasse, gyrophares allumés et sirènes hurlantes, Strasse leur fit signe de s'arrêter, les véhicules se positionnant de manière à bloquer la route. Sortant un mégaphone, il cria à la foule : « La République fédérale d'Allemagne a déclaré ce rassemblement illégal. Veuillez vous éloigner des véhicules de la BGS et quitter les lieux. Si vous ne le faites pas, vous serez poursuivis et nous serons contraints de recourir à la force. Merci. »\n\nPendant qu'il parlait, les hommes de Strasse avaient revêtu leur équipement anti-émeute et leurs boucliers, et formaient une ligne devant les véhicules, prêts à utiliser des gaz lacrymogènes si nécessaire. Cependant, la foule était indignée et tentait d'avancer, à leur grand dam. Strasse ordonna de tirer des gaz lacrymogènes, et ils commencèrent à se battre avec les manifestants, dont certains portaient des chapelets et des bibles, ainsi que quelques prêtres catholiques.\n\nStrasse détestait devoir faire cela, mais il avait reçu des ordres."
 Ollenhauer53.10.d: "Une nouvelle réunion du cabinet faisait rage ce matin, cette fois-ci sur la manière de mener la politique étrangère du nouveau gouvernement Ollenhauer. Les députés SPD d'Ollenhauer et les députés Kanalarbeiter de Franke étant quelque peu divisés, ce débat allait être houleux, tout comme il l'avait été lorsque Schumacher était chancelier, pensa Ollenhauer. Il commença.\n\n« Messieurs, je préconise que nous poursuivions notre politique étrangère neutre, en nous éloignant des deux blocs. » Cela suscita des hochements de tête de la part de ses alliés et des froncements de sourcils de la part des adjoints de Franke, qui commencèrent à s'exprimer.\n\n« Monsieur le Chancelier, il est clair que vous n'accepterez pas une intégration totale à l'Occident, telle que proposée par M. Adenauer et la CDU. Mais que se passerait-il si nous orientions notre politique étrangère vers l'Occident, mais selon les conditions de notre gouvernement ? Entamons des négociations, avec des politiques qui ne profitent qu'à nous. »\n\nOllenhauer acquiesça. « Intéressant, que voulez-vous dire ? »\n\n« Eh bien, monsieur, conclure des accords de sécurité avec les États-Unis, adhérer au FMI, établir des relations amicales avec d'autres pays. »\n\n« Intéressant, intéressant. Avons-nous des idées pour une politique étrangère neutre ? »\n\nUn ministre adjoint prit la parole. « Eh bien, monsieur, nous commencerions par organiser une conférence sur la neutralité ici en Allemagne, peut-être en visitant Berlin-Est, et en cherchant à établir des relations amicales avec les pays nordiques. »\n\nOllenhauer acquiesça. « Très bien. Quelle que soit cette politique, nous devrions l'appeler la doctrine Ollenhauer, que nous devrions... »"
 Ollenhauer53.11.d: "DE : Erich Ollenhauer, chancelier, gouvernement de la République fédérale d'Allemagne\nÀ : Président[USA.GetLeader], Gouvernement des États-Unis d'Amérique ; Premier ministre [ENG.GetLeader], Gouvernement du Royaume-Uni de Grande-Bretagne et d'Irlande du Nord ; Premier ministre [FRA.GetLeader], Gouvernement de la République française\n\nObjet : Armes nucléaires en République fédérale\n\nMessieurs,\n\nJe vous informe par la présente que le Bundestag a adopté une résolution interdisant le déploiement d'armes nucléaires sur le territoire de la République fédérale. Nous appliquerons cette résolution dans les soixante-douze (72) heures suivant la réception de la présente note.\n\nBien que nous soyons conscients de la valeur stratégique de la République fédérale dans la guerre froide, nous n'avons aucun intérêt à devenir un point d'accueil pour les armes de destruction massive."
 Ollenhauer53.12.d: "C'était une décision controversée, mais le personnel d'Ollenhauer l'avait laissé faire, au grand dam de son service de sécurité. Steube avait jugé inutile et absurde son idée de se rendre à Berlin-Est pour montrer sa bonne volonté, mais lorsqu'ils descendirent de l'avion à l'aéroport de Berlin-Schönefeld, il comprit que cela allait devenir réalité.\n\nAccueillis par une seule voiture, lui et son petit personnel ont été conduits à la porte de Brandebourg, où le premier secrétaire [DDR.GetLeader]était accompagné d'une petite équipe, ainsi que d'agents de la Stasi en costume sombre alignés à l'extérieur. Ollenhauer, serrant des mains, souriait et discutait pendant quelques minutes, échangeant des politesses, avant que les deux hommes ne se promènent sur la place, montrant les sites touristiques, tant à Berlin-Ouest qu'à Berlin-Est, parlant de la ville, de la guerre, de la culture, du gouvernement et du reste.\n\nSteube sourit. Pour l'instant, tout cela était strictement confidentiel, et si on lui posait des questions, la Chancellerie nierait avoir jamais été là, du moins pour apaiser toute opposition au sein de la CDU qui reprochait au gouvernement de fraterniser avec les communistes. Il était heureux de voir que cela fonctionnait. À ses yeux, et à ceux d'Ollenhauer, la détente avec l'Est par des moyens neutres pouvait finalement aboutir, à condition qu'ils ne soient pas critiqués pour cela."
 Ollenhauer53.13.d: "Un autre objectif de la politique étrangère d'Ollenhauer se concrétisait cette semaine avec le début de la Conférence de Francfort sur la neutralité. Suggérée par plusieurs députés juniors du SPD afin d'évaluer l'intérêt international pour un mouvement de neutralité, en particulier dans la sphère européenne. Des invitations avaient été envoyées aux dirigeants de la Suède, de la Finlande, de l'Autriche, de la Yougoslavie et de l'Irlande, et presque tous étaient arrivés à Francfort, sous les applaudissements des Allemands de l'Ouest qui les accueillaient.\n\nAu Frankfurter Hof, le meilleur hôtel de la ville, Ollenhauer s'est levé pour prononcer le discours d'introduction devant les dignitaires et les délégués réunis. « Au nom de la République fédérale d'Allemagne, je vous souhaite à tous la bienvenue dans notre brillante capitale, Francfort, et à la Conférence sur la neutralité ! Nous rêvions depuis longtemps de réunir tous les pays européens engagés dans la neutralité en un seul lieu, afin de discuter des avantages de la neutralité, de son avenir, et bien plus encore. J'espère que ces discussions seront fructueuses et que nous pourrons engager un dialogue constructif en faveur de la paix en Europe, en dehors des deux grands blocs. Je vous remercie. »\n\nSous les applaudissements, Ollenhauer, impressionné, prit place au siège marqué « République fédérale d'Allemagne » et se prépara à commencer pour de bon."
 Ollenhauer53.14.d: "Après des mois de négociations, Ollenhanuer était heureux de monter à bord de son avion officiel, un Douglas DC-3 dont la queue était peinte aux couleurs du drapeau allemand, pour se rendre à Stockholm et Helsinki afin de signer des accords de sécurité avec la Suède et la Finlande.\n\nÀ son arrivée à Stockholm, première étape de la tournée, Ollenhauer a été accueilli par la fanfare royale suédoise et chaleureusement reçu par le Premier ministre [SWE.GetLeader], qui a organisé une réunion au cours de laquelle les deux hommes ont discuté des accords de neutralité, après quoi ils ont signé l'accord de sécurité suédo-allemand et ont pris un déjeuner rapide.\n\nCela fait, Ollenhauer prit congé du Premier ministre suédois et remonta à bord de l'avion pour un court vol vers Helsinki, où une réunion similaire devait avoir lieu. Dans des circonstances plus secrètes, devant échapper aux défenses aériennes soviétiques et autres équipements de détection, l'avion d'Ollenhauer atterrit à Helsinki sous le couvert de la nuit, où une petite flotte de voitures l'attendait sans fanfare ni cérémonie.\n\nMoins cordial qu'à Stockholm, Ollenhauer était nerveux, mais il rencontra le Premier ministre [FIN.GetLeader] dans une ambiance chaleureuse, lors d'un dîner officiel plutôt informel où les deux hommes ont discuté de leur vie et de leur famille, ainsi que de la position stratégique de la Finlande dans les pays nordiques, partageant une frontière avec l'URSS. Ensuite, les textes officiels de l'accord de sécurité finno-allemand ont été présentés et, sans conférence de presse, les deux hommes y ont apposé leur signature, avant de se serrer la main et de sourire.\n\nAssez fatigué après cette tournée éclair, Ollenhauer était plutôt content de monter à bord du DC-3 pour retourner à Francfort, heureux d'avoir accompli une grande partie de son plan directeur pour une alliance européenne de neutralité."
 Ollenhauer57.1.d: "C'était une journée ensoleillée dans l'une des grandes salles de réunion de la Chancellerie qu'un groupe de personnes de taille moyenne s'était réuni. Composé de toutes sortes de personnes : diplomates, experts scientifiques, avocats, personnalités de la presse, cameramen, tous applaudirent lorsque le chancelier Erich Ollenhauer monta à la tribune, ornée d'un aigle allemand géant, flanqué de deux drapeaux.\n\n« Bonjour à tous. Au cours des huit années qui ont suivi sa création, ce pays a traversé de nombreuses épreuves, tant sur le plan national qu'international. Contrainte de se relever par ses propres moyens, la République fédérale a réussi à se relever et à retrouver sa place sur la scène internationale. » Il marqua une pause pour laisser la foule applaudir.\n\n« Les récents développements dans le monde nous ont montré le véritable pouvoir de la science moderne, dans la fission de l'atome, pour la paix ou pour la guerre. En tant que chancelier, je suis heureux d'annoncer la création du nouveau programme nucléaire de la République fédérale, baptisé Deutsche-Atomkraftprogramm. Il convient de préciser que ce programme est destiné à un usage pacifique uniquement ; en vertu de la loi sur le contrôle des armes de guerre, la République fédérale ne produira aucune arme nucléaire, mais utilisera la technologie nucléaire à des fins énergétiques et scientifiques. Nous saluons le soutien des États-Unis dans cette entreprise et nous nous réjouissons de discuter des détails avec l'ambassadeur Bruce. Je vous remercie tous. »\n\nIl fit un signe de tête à l'ambassadeur américain, qui se tenait là, quelque peu sous le choc, tandis que la foule applaudissait, que les journalistes s'agitaient et que les flashs crépitaient, avant qu'Ollenhauer ne se retire dans une antichambre, soulagé après cette annonce."
 Ollenhauer57.2.d: "Alors qu'Ollenhauer et son équipe roulaient sur l'autoroute en direction de l'une des plus récentes centrales nucléaires d'Allemagne de l'Ouest, Erich regardait par la fenêtre et remarqua que le soleil brillait. C'était Schumacher qui souriait depuis là-haut, fier de ce que son protégé avait accompli, et lui souhaitant bonne chance pour l'inauguration de la nouvelle centrale. Après avoir franchi le portail et s'être arrêté juste à côté du bâtiment administratif, le seul bâtiment présent, Ollenhauer était nerveux, d'autant plus qu'il était à nouveau assailli par les journalistes. Souriant comme toujours, Ollenhauer salua la presse, prononça quelques mots, puis se dirigea vers l'entrée du bâtiment administratif pour serrer la main et discuter avec le chef de chantier, un Bavarois petit et corpulent.\n\nArmé rapidement d'une pelle, il a posé pour des photos avec le contremaître, tout sourire, avant de creuser quelques pelletées de terre, marquant ainsi le début officiel de la construction de la centrale nucléaire nationale Schumacher.\n\n« Le regretté chancelier Kurt Schumacher était véritablement un grand homme, une force de la nature et le visage du Parti social-démocrate. Il aurait adoré l'expansion de l'énergie nucléaire en République fédérale, et c'est pourquoi je dédie cette centrale nucléaire en son honneur sous le nom de Centrale nucléaire nationale Schumacher. Gloire à l'Allemagne ! »\n\nLes applaudissements ont retenti tandis qu'Ollenhauer souriait, retirant son casque de cérémonie et voyant à nouveau les flashs crépiter, avant de monter dans sa Mercedes noire, une nouvelle victoire pour le public assurée."
 Ollenhauer57.3.d: "Debout devant le Bundestag une fois de plus, après les élections victorieuses de 1957, Ollenhauer était fier. Moins nerveux qu'il ne l'avait été quatre ans auparavant, il s'éclaircit la gorge et se remit à parler.\n\n« Mesdames et Messieurs les députés du Bundestag, cela fait longtemps que je ne me suis pas tenu devant vous pour m'adresser à vous, et pendant cette période, le gouvernement a accompli beaucoup de choses dans l'intérêt de tous les citoyens de la République fédérale. Au cours des dernières années, nous avons rajeuni nos services de sécurité intérieure et frontalière, renforcé notre coopération avec nos collègues du Parti chrétien-démocrate et ceux de la faction Kanalarbeiters du Parti social-démocrate, et nous avons remanié la politique étrangère de la République fédérale afin qu'elle soit plus ouverte et plus accueillante envers le monde. Tout cela a été fait dans un seul et unique but : le bien-être, la sécurité et le bonheur de chaque citoyen de la République fédérale, cette grande nation, quels que soient sa race, son sexe, sa religion ou ses croyances. Depuis les élections au début de cette année, je suis resté déterminé à poursuivre mon programme, notamment en améliorant encore l'armée et en orientant notre politique étrangère vers une nouvelle direction pleine d'espoir. Je suis impatient de voir ce que l'avenir réserve à notre République et au monde. Merci à tous. »\n\nSous les applaudissements et les cris d'encouragement des deux côtés, Erich quitta le podium, la poitrine gonflée de fierté. Ce mandat serait encore meilleur que le précédent."
 Ollenhauer57.4.d: "Chaque année, à peu près à la même époque, le Bundestag est confronté à la terrible tâche d'approuver les crédits budgétaires, et cette année, il a dû relever un nouveau défi : accepter ou non l'aide militaire américaine pour soutenir la nouvelle Bundeswehr. Bien que disposant d'une majorité sociale-démocrate, le Bundestag reste quelque peu divisé. Comme à son habitude, la CDU a déclaré qu'il fallait « demander l'aide américaine, mais aussi augmenter le budget de la défense » et s'est prononcée en faveur des coupes dans les programmes sociaux proposées par le SPD. Le SPD, divisé comme d'habitude entre la faction Kanalarbeiter de Franke et la faction traditionaliste d'Ollenhauer, est généralement opposé à l'aide américaine, arguant que les dépenses de défense sont suffisantes en l'état et que la politique actuelle ne nécessite pas davantage, sans compter le refroidissement soudain des relations avec les États-Unis. Cependant, la demande d'aide proposée est généralement modeste par rapport aux programmes plus importants présentés par les responsables de la Bundeswehr et de la CDU, et pourrait donc être acceptable pour les membres des deux factions du SPD. La Bundeswehr obtiendra-t-elle son financement ?"
 Ollenhauer57.5.d: "Parallèlement au débat sur l'aide américaine, le Bundestag débattait également d'une autre question concernant la nouvelle Bundeswehr : fallait-il maintenir la conscription obligatoire pour les jeunes de 18 ans ou commencer à supprimer progressivement cette politique ?\n\nLa CDU, farouchement opposée à cette mesure, a fait une déclaration liminaire, dans laquelle l'un de ses membres a déclaré : « Pourquoi supprimer progressivement la conscription alors que nous sommes en train d'améliorer et de renforcer notre armée ? Cela semble très hypocrite de la part du gouvernement SPD, qui a accédé à nos demandes en faveur d'une armée et d'une défense fortes, mais qui souhaite néanmoins affaiblir notre Bundeswehr en supprimant la conscription. »\n\nProvoquant la colère de la gauche de la salle, qui l'a hué avec rage, un membre du Kanalarbeiter s'est levé pour tenter de rétablir la paix. « Chers membres des deux côtés, je pense que pour l'instant, la conscription doit se poursuivre normalement, et devrait peut-être être étendue pour répondre aux besoins de notre armée en pleine expansion. Cependant, la politique étrangère du gouvernement Ollenhauer a mis l'accent avant tout sur la défense territoriale et, par conséquent, la conscription devrait être quelque peu limitée afin de ne remplir que cet objectif. »\n\nCela suscita un peu plus de soutien que le bruyant membre de la CDU, qui était assis, fulminant sur son siège. Le président de la chambre se leva, signalant que le moment était venu de voter. Quel est le sort de la conscription en Allemagne de l'Ouest ?"
 Ollenhauer57.51.t: "[GetNewspaperHeader]La réouverture de la Bourse de Hambourg"
 Ollenhauer57.51.d: "Après des années de fermeture, la Bourse de Hambourg a rouvert ses portes, marquant une étape clé dans la reprise économique de l'Allemagne de l'Ouest. Fondée en 1558, elle est l'une des plus anciennes places boursières au monde et a toujours joué un rôle central dans le commerce allemand et européen. Fermée pendant la période chaotique de la Seconde Guerre mondiale et de l'occupation d'après-guerre, sa renaissance reflète aujourd'hui le retour de la stabilité financière dans le pays.\n\nAvec l'introduction du mark allemand et l'essor de l'économie sociale de marché, la bourse devrait attirer les investissements nationaux et étrangers. Les responsables ont salué cette réouverture comme un signe de confiance renouvelée dans l'avenir économique de l'Allemagne, les premières transactions s'annonçant prometteuses."
 Ollenhauer57.51.a: "Magnifique"
 Ollenhauer57.51.b: "Un autre instrument d'exploitation"
 Ollenhauer57.52.t: "Ouverture de la caserne Gebhard von Blücher"
 Ollenhauer57.52.d: "Aujourd'hui a eu lieu l'inauguration officielle de la Gebhard Blücher Kaserne, une étape clé dans le renforcement de la sécurité de Berlin-Ouest dans un contexte de tensions croissantes liées à la guerre froide. Nommée en l'honneur du maréchal prussien qui a joué un rôle décisif dans les guerres napoléoniennes, la nouvelle caserne abritera des unités du Bundesgrenzschutz et de la Bundeswehr, assurant la protection de la ville en coopération avec les forces alliées.\n\nDes représentants du gouvernement et de l'armée ont assisté à l'inauguration, soulignant le rôle de la caserne dans la protection de la souveraineté de Berlin-Ouest contre les menaces potentielles venant de l'Est. L'installation est équipée de logements modernes, de terrains d'entraînement et de bureaux administratifs, ce qui permet une réponse rapide et efficace aux incidents frontaliers.\n\nDes représentants de l'OTAN venus de France, des États-Unis et du Royaume-Uni ont également assisté à la réunion. Ils ont tous exprimé leur grande satisfaction à l'égard de ce projet, même si le représentant français a fait part de ses inquiétudes quant au nom donné à la caserne, soulignant qu'il était contre-intuitif de la nommer d'après un maréchal prussien qui avait combattu aux côtés des Russes contre les Français, et suggérant de lui trouver un nom plus approprié."
 Ollenhauer57.52.a: "Pleure donc. (Cry)"
 Ollenhauer57.53.t: "Le compromis de Francfort"
 Ollenhauer57.53.d: "Dans un effort décisif pour consolider son leadership et définir une ligne directrice commune pour l'avenir, le Parti social-démocrate allemand a convoqué aujourd'hui un congrès historique à Francfort, dans le but de combler le fossé qui persiste entre ses factions de gauche et de droite. Après avoir gouverné l'Allemagne de l'Ouest depuis ses victoires électorales de 1949 et 1953, le SPD est aujourd'hui confronté au défi de maintenir sa cohésion alors que les tensions idéologiques persistent au sein du parti.\n\nÀ la suite de la décision de nommer Egon Franke vice-chancelier, le chancelier Ollenhauer, aux côtés de personnalités éminentes des deux ailes, a souligné la nécessité de l'unité, appelant à la fin des luttes factionnelles qui ont entravé la mise en œuvre des politiques. La gauche, qui prône une intervention plus forte de l'État et se montre sceptique à l'égard de l'OTAN, et la droite, qui favorise une économie de marché équilibrée et une coopération étroite avec l'Occident, se sont souvent affrontées. Cependant, le congrès d'aujourd'hui a marqué un engagement en faveur du compromis, les dirigeants s'étant mis d'accord sur un programme qui renforce la justice sociale, le pragmatisme économique et une voie distincte, indépendante de l'influence de la CDU."
 Ollenhauer57.53.a: "Un compromis nécessaire"
 Franke53.1.d: "Alors que les membres du Bundestag assemblés murmuraient entre eux dans la grande salle, Franke entra, monta à la tribune, mit une paire de lunettes et s'éclaircit la gorge.\n\n« Mesdames et Messieurs les députés du Bundestag, je suis ici, comme à l'accoutumée, pour vous rendre compte de la situation de la République fédérale et vous présenter mon programme pour l'année à venir. Nous avons accompli beaucoup de choses cette année, et ce gouvernement a traversé de nombreuses épreuves. Avec le décès de l'ancien chancelier Schumacher, le pays a de nouveau été plongé dans le chaos. Le parti a dû relever des défis difficiles, mais j'ai finalement été choisi comme chancelier. »\n\nLa dernière phrase a provoqué un léger remous dans la salle, certains exprimant discrètement leur désaccord avec Franke, mais celui-ci a continué à parler.\n\n« Il est essentiel que nous traversions cette période tumultueuse en tant que nation unie. Bien que le SPD ait connu quelques problèmes internes, il est essentiel que nous maintenions des relations amicales afin de conserver la majorité. Nous restons orientés vers la politique occidentale et, à l'instar des membres de la CDU qui m'ont précédé, nous reconnaissons la menace fondamentale que représente l'Union soviétique pour notre grande nation. J'ai engagé mon honneur sacré sur ces idéaux en prenant les rênes de la chancellerie, et je jure de le faire pour tout le peuple allemand ! »\n\nCette dernière partie a suscité des applaudissements, non seulement du côté du SPD, mais aussi de la CDU ; même leurs députés ont été impressionnés.\n\nLes experts ont été agréablement surpris par le ton diplomatique de Franke, rare après ce qui s'était passé, et sont curieux de connaître l'avenir des relations entre le SPD allemand et le nouveau chancelier."
 Franke53.2.d: "C'était une journée ensoleillée dans la salle du conseil du chancelier lorsque Franke commença sa réunion quotidienne par une nouvelle annonce. Après des jours et des jours de réunions sur l'économie et les relations politiques tant au sein du SPD qu'avec la CDU, ils n'avaient jamais discuté de la politique étrangère qui serait proposée. Franke commença en invitant ses ministres à s'asseoir avant de prendre la parole.\n\n« Messieurs, nous avons abordé presque tous les aspects des politiques de notre gouvernement, mais nous n'avons pas encore discuté d'un sujet crucial : la politique étrangère. Pour commencer, je vais maintenant donner la parole au ministre des Affaires étrangères, qui nous fera part des progrès réalisés concernant certaines idées politiques préliminaires. »\n\nAssis, le ministre des Affaires étrangères se leva d'un air plutôt penaud, face au cabinet composé de ministres relativement nouveaux, issus des deux factions du SPD.\n\n« Eh bien, chancelier, nous estimons qu'il est dans l'intérêt de l'Allemagne de l'Ouest de poursuivre une intégration occidentale limitée pendant cette période. »\n\nDans la salle, des exclamations, pour la plupart de surprise et de colère, s'élevèrent parmi les ministres réformistes du SPD nommés par Franke dans un geste diplomatique. Certains tentèrent de prendre la parole pour lancer une discussion, mais furent réduits au silence par leurs collègues afin de laisser le ministre poursuivre.\n\n« Hum. Quoi qu'il en soit, nous pensons qu'il est dans notre intérêt de commencer une intégration occidentale progressive, rien à voir avec ce que nos collègues de la CDU ont proposé, mais plutôt un rapprochement graduel avec l'Occident afin de commencer à recevoir davantage d'aide. De même, nous devrions mettre l'accent sur des relations plus amicales avec les Allemands de l'Est, en particulier autour de Berlin, et ouvrir l'accès entre les deux nations. »\n\nFranke leva les yeux et vit les conversations plutôt pénibles qui se déroulaient entre les factions réformistes et conservatrices de son cabinet SPD.\n\n« Messieurs. » Il tapota la table. « Bien que ces propositions puissent sembler controversées, elles ont été élaborées en tenant compte des objectifs politiques de chaque faction du SPD. Nous comprenons la nécessité d'une coopération et d'une élaboration de politiques fondées sur le bon sens, et c'est la meilleure option pour le moment. » Ces mots furent suivis de quelques applaudissements, car les négociations sur les mesures concrètes à prendre allaient bientôt commencer."
 Franke53.3.d: "Franke était dans son bureau, en train de lire les rapports matinaux, lorsque son ministre des Affaires étrangères fit irruption, accompagné de quelques conseillers principaux et de son chef de cabinet. Il savait de quoi il s'agissait. « Monsieur le Chancelier, il y a du nouveau dans la crise hongroise. »\n\n« Dis-moi ce que tu as. »\n\n« Eh bien, monsieur, l'armée soviétique est intervenue dans la crise qui a suivi. Alors qu'elle disposait déjà de troupes en Hongrie avant la révolte, des divisions supplémentaires sont apparues à Budapest et dans les environs, selon nos services de renseignement. Des centaines de milliers de dissidents hongrois fuient vers l'Autriche voisine, pays neutre. On s'attend à ce que l'occupation soviétique et la mise en place d'un gouvernement pro-Moscou fassent des centaines de morts. »\n\n« Mein Gott. Que pouvons-nous faire ? »\n\n« Eh bien, monsieur, le ministère des Affaires étrangères a suggéré que nous contactions les Autrichiens et leur proposions notre aide pour traiter les demandes des réfugiés et des personnes déplacées, afin de leur permettre de se rendre en Occident. »\n\n« Que pensent les autres à ce sujet ? Cela susciterait-il l'adhésion du public ? »\n\nSon chef de cabinet intervint : « Oui, Monsieur le Chancelier. Il semble que l'opinion publique allemande se mobiliserait pour venir en aide aux réfugiés, que nous agissions ou non. Je me trompe peut-être, mais je suppose que les trois puissances occidentales apporteraient également leur soutien. » Le ministre des Affaires étrangères reprit la parole : « Oui. Peu importe ce que nous faisons, que nous menions une action en faveur des réfugiés ou que nous nous contentions de condamner la situation, nous aurions le soutien nécessaire. C'est à vous seul de décider jusqu'où nous irons. »"
 Franke53.4.d: "Aujourd'hui, la réunion du cabinet du chancelier n'avait rien d'ordinaire. Une situation s'était développée au Moyen-Orient, et le chancelier Franke estimait qu'elle méritait une réponse.\n\nIl prit la parole. « Monsieur le ministre, que sait le ministère des Affaires étrangères ? »\n\n« Monsieur le Chancelier, comme vous le savez, le président égyptien Nasser a nationalisé le canal de Suez le 26 juillet. Cela fait maintenant un peu plus de trois mois, et nous avons été informés que ces deux pays ont déployé des parachutistes pour s'emparer du canal de Suez. »\n\nCela a suscité une vague de conversations autour de la table du cabinet.\n\nFranke prit la parole. « Nous devons prendre une décision : honorer notre amitié avec la Grande-Bretagne et la France, ou exprimer notre soutien à Nasser en lui offrant notre appui diplomatique. »\n\nLe ministre reprit la parole. « Il n'est peut-être pas judicieux pour l'instant de s'opposer aux Alliés, en particulier aux Français. Nous essayons toujours de consolider notre position sur la scène internationale. Cependant, promettre notre soutien à l'action des Nations Unies pourrait être considéré comme une position neutre, soutenant implicitement Nasser sans intervenir directement. »\n\nFranke a examiné les options, puis a soumis la question au vote du Cabinet. Quelle sera notre position ?"
 Franke53.5.d: "Sur le point de se présenter devant le monde entier, Franke était nerveux, comme il se doit. Il avait beaucoup à leur prouver, et après tout ce qui s'était passé en Europe au cours des 20 dernières années, il s'attendait à beaucoup d'hostilité. Le moment était venu, alors que le chef du protocole de l'ONU semblait prêt à le présenter.\n\n« Mesdames et Messieurs les membres de l'Assemblée générale, Monsieur le Chancelier de la République fédérale d'Allemagne, Monsieur Egon Franke ! » Des applaudissements retentirent tandis que Franke montait les marches et s'approchait du podium, orné d'un écusson doré de l'ONU.\n\n« Merci beaucoup à tous. Je suis honoré d'être ici aujourd'hui à New York pour m'adresser à l'Assemblée générale des Nations unies lors de sa 11e session cette année. C'est la première fois dans l'histoire des Nations unies qu'un représentant de l'Allemagne de l'Ouest s'adresse à l'Assemblée. Je suis fier d'être ce représentant et fier des progrès réalisés par l'Allemagne dans cette « guerre froide » qui émerge rapidement. Nous avons réussi à nous relever par nos propres moyens et à redévelopper notre économie, à engager l'Allemagne sur une nouvelle voie sociale-démocrate et à affirmer notre politique étrangère sur la scène mondiale, comme je le dis ici même. Je supplie, j'implore les grandes puissances du monde, le Conseil de sécurité, de repenser leurs politiques ; prendre des pays comme l'Allemagne au piège de vos grands conflits idéologiques est aliénant et inutile. Je remercie le président de l'Assemblée générale, le secrétaire général et toutes les personnes présentes de m'avoir permis de m'exprimer. Danke. »\n\nLes applaudissements ont de nouveau retenti lorsque Franke a quitté la scène, recevant des signes de tête et des sourires non seulement de la délégation ouest-allemande, mais aussi de nombreuses délégations du monde entier."
 Franke53.6.d: "DE : Ministère fédéral des Finances ; Ministère fédéral du Travail ; Ministère fédéral de l'Économie\nÀ : Bureau de la Chancellerie\nOBJET : Proposition relative au programme Godesberg\n\nMonsieur le Chancelier, Vous trouverez ci-joint nos recommandations interministérielles pour le nouveau programme économique du gouvernement, connu sous le nom de « programme de Godesberg ».\n\n1. Nomination immédiate de Karl Schiller, actuel ministre de l'Économie à Hambourg, au poste de ministre fédéral de l'Économie.\n\n2. Nationalisation de Volkswagen GmbH et expansion de la production automobile\n\n3. Développement et expansion des installations de raffinage du pétrole et des réseaux ferroviaires en Bavière\n\n4. Extension des réformes sociales, notamment l'assurance maladie nationale, l'extension du système hospitalier et l'intégration des syndicats et des organisations professionnelles dans le processus décisionnel.\n\n5. Le cas échéant, une séparation plus nette entre les politiques des Kanalarbeiter et celles des traditionalistes du SPD, notamment en condamnant les politiques néo-gauchistes et toutes les formes de communisme.\n\nNous pensons que ces cinq points permettront de revitaliser l'Allemagne tout en conservant le caractère social-démocrate du gouvernement."
 Franke53.7.d: "DE : Police fédérale allemande, ministère fédéral de l'Intérieur ; Commandement fédéral des gardes-frontières (BGSK)\nÀ : Bureau de la Chancellerie\nOBJET : Opération RED SCARE\n\nMonsieur le Chancelier,\n\nDe récents rapports sur la sécurité, notamment concernant le comportement au sein du Parti social-démocrate, ont révélé des signes inquiétants chez certains membres du parti. Les membres de la faction traditionaliste du parti, dirigée par Erich Ollenhauer, ont mené des actions dignes des néo-gauchistes et se sont rendus à Berlin-Est pour rencontrer les dirigeants communistes est-allemands du SED.\n\nLa Bundespolizei et le BGS ont proposé quelques idées afin de lutter contre ces menaces potentielles ou de les atténuer.\n\n1. Commencer une surveillance passive d'Ollenhauer et d'autres membres traditionalistes influents, y compris leurs bureaux, leurs résidences et leurs déplacements.\n\n2. Obliger tous les membres du SPD à signaler leurs déplacements à l'étranger et renforcer de manière passive les contrôles de sécurité dans les zones à forte circulation à la frontière intra-allemande et à Berlin-Ouest.\n\n3. Mener des opérations anti-surveillance dans tous les bureaux du SPD, ainsi que dans la Chancellerie fédérale et les chambres du Bundestag.\n\nCes points garantiront la sécurité intérieure de l'Allemagne de l'Ouest et empêcheront l'infiltration communiste au sein du SPD et du gouvernement ouest-allemand."
 Franke53.8.d: "C'était une journée ensoleillée lorsque le cortège de Franke est arrivé au siège de la brasserie Lowenbrau à Munich, où devait se tenir un événement promotionnel. S'inscrivant dans le cadre du programme Godesberg proposé par les ministres du Travail, des Finances et de l'Économie, cet événement avait pour but de mettre en avant l'attrait de la bière bavaroise et d'étendre sa production au-delà des marchés allemands.\n\nSouriant joyeusement et posant avec une chope de bière aux côtés du directeur de l'usine Lowenbrau et des responsables marketing, cette publicité sera diffusée dans toute l'Europe et aux États-Unis, dans l'espoir d'étendre la présence de Lowenbrau et d'autres brasseries bavaroises sur les marchés internationaux et d'assurer un meilleur avenir économique à l'Allemagne."
 Franke57.1.d: "Il était tôt le matin à la Chancellerie, suffisamment tôt pour que seul le personnel essentiel soit présent. Le soleil se levait ; l'aube pointait à peine, mais cinq personnes se trouvaient dans le bureau du chancelier : le chancelier Franke, son chef de cabinet, le ministre des Affaires étrangères, le ministre de la Défense et le ministre des Affaires nucléaires. Ce dernier poste ayant été créé par Franke lors de son précédent mandat, cette réunion allait avoir une importance capitale pour le monde entier. Le ministre de la Défense, Franz Josef Strauss, choisi par l'opposition CSU, prit la parole en premier.\n\n« Eh bien, comme certains d'entre nous l'ont déjà mentionné, je pense que nous sommes tous d'accord pour dire que la situation mondiale actuelle nécessite un renforcement de nos capacités de défense. Bien que nous ayons déjà pris notre décision concernant la Bundeswehr et le Bundesgrenzschutz, il y a un autre aspect que nous devrions prendre en considération. » Il fit un signe de tête à Franke et poursuivit : « Je pense que ce gouvernement devrait lancer un programme limité et restreint d'armes nucléaires à des fins d'autodéfense. »\n\nLe ministre des Affaires nucléaires, Siegfried Balke, également membre de la CDU, acquiesça. « Oui. Grâce à notre capacité nucléaire actuelle et à l'aide supplémentaire des Américains ou des Français, nous pouvons commencer à enrichir de l'uranium à des fins militaires. »\n\nFranke acquiesça. « Excellent. » Jetant un regard au ministre des Affaires étrangères, qui semblait plutôt inquiet, il lui fit signe de prendre la parole.\n\n« Cela pourrait causer plus de problèmes que d'avantages. Il faudra convaincre les Américains que nous n'avons pas besoin d'utiliser leurs armes nucléaires, gérer la réaction des Soviétiques qui pourraient y voir une escalade massive, et mon bureau devra faire face à la réaction du public. »\n\nFranke acquiesça d'un signe de tête, l'air sombre. « Bon, nous allons devoir gérer cela du mieux que nous pouvons. Contactez les Américains, entamons les négociations et retenez les Soviétiques pour l'instant, afin qu'ils ne découvrent rien. Allons-y. »"
 Franke57.2.d: "DE : Ministère fédéral des Affaires nucléaires\nÀ : Bureau de la Chancellerie\nOBJET : Rapport sur la visite des conseillers américains de l'AEC\n\nChancelier, \n\nIl y a une semaine, des responsables du ministère ont reçu la visite de cinq membres et assistants de la Commission américaine de l'énergie atomique (AEC) au sujet de la coopération américano-allemande dans le domaine des armes nucléaires défensives.\n\nAprès un accueil initialement froid et hostile de la part de l'ambassade américaine à Francfort, la visite des responsables de l'AEC et leurs réunions avec les responsables du BMAt ont permis de renforcer la coopération, notamment sur des détails spécifiques tels que l'enrichissement de l'uranium et les méthodes de conversion des installations nucléaires actuelles en installations d'enrichissement, ainsi que les procédures particulières pour ce processus.\n\nNos contacts avec notre agent de liaison au ministère de la Défense nous ont indiqué que des réunions similaires avec des responsables du département américain de la Défense et du personnel de l'USAFE à Bruxelles se sont bien déroulées, en particulier les discussions concernant la stratégie allemande en matière de prolifération des armes nucléaires et la logistique de leur déploiement éventuel.\n\nAprès avoir visité plusieurs centrales nucléaires à travers le pays, les conseillers de l'AEC devraient s'installer de manière plus permanente à l'ambassade de Francfort, alors que les négociations et les réunions politiques se poursuivent et que le programme démarre."
 Franke57.3.d: "DE : Agence fédérale pour l'aide technique (Bundesanstalt Technisches Hilfswerk, THW)\nÀ : Bureau de la Chancellerie\n\nOBJET : Rapport sur le test fédéral de préparation nucléaire\n\nChancellier, \n\nIl y a environ un mois, un test national de préparation nucléaire a été mené auprès de l'ensemble de la population ouest-allemande. Mis en place sur ordre de cette agence et coordonné avec tous les gouvernements régionaux et municipaux, cet exercice a enregistré un taux de participation estimé à 85 % parmi la population.\n\nL'objectif d'un tel test était à la fois de former la population aux précautions à prendre en cas de conflit nucléaire et de recueillir des données et des statistiques cruciales sur la réponse nationale à un conflit nucléaire.\n\nL'exercice a commencé tôt le matin, lorsque, après avoir reçu une alerte radar, les sirènes d'alerte aérienne ont retenti dans tout le pays, signalant au personnel du THW de commencer à organiser le public pour qu'il se rende dans les abris anti-atomiques et autres lieux d'organisation.\n\nEnviron 18 minutes plus tard, le Bundesgrenzschutz et le quartier général du ministère de la Défense ont confirmé la « destruction » de Berlin, Francfort, Hambourg, Cologne, Munich et d'autres grandes villes allemandes par des bombes nucléaires soviétiques.\n\nAprès avoir évalué et déterminé l'ampleur des « destructions », les responsables du THW et de ses organisations régionales ont confirmé qu'environ 30 % de la population participant à l'exercice, soit environ 13 millions de personnes, avaient été « tuées » à la suite de l'explosion ou des destructions qui en ont résulté. Le THW estime qu'il serait possible de faire davantage pour sauver la population en cas d'attaque nucléaire soviétique."
 Franke57.4.d: "ATTENTION ! ACHTUNG !\n\nVoulez-vous sauver l'Allemagne d'une attaque communiste rouge ?\n\nSAUVEZ L'ALLEMAGNE AUJOURD'HUI !\nLa menace d'une attaque nucléaire soviétique contre l'Allemagne et l'Europe occidentale n'a jamais été aussi évidente !\n\nRejoignez dès aujourd'hui le Technisches Hilfswerk !\n\nTHW apporte au public le soutien et l'organisation nécessaires en matière de défense civile et de catastrophes naturelles !\n\nSoyez patriote, rejoignez THW dès aujourd'hui !"
 Franke57.5.d: "Debout dans l'ombre de la salle du Conseil de sécurité de l'ONU, Franke semblait de plus en plus nerveux. Entouré de son chef de cabinet, des ministres de la Défense, des Affaires étrangères et des Affaires nucléaires, Franke prit place à la table réservée aux observateurs du Conseil et se prépara mentalement à prendre la parole. Après tout ce temps, après de longues heures et de longues nuits de discussions avec ses ministres, ses diplomates et ses scientifiques, tout se résumait à cela. Que penseraient-ils ? Son ministre des Affaires étrangères avait préparé une estimation préliminaire des réactions, mais Franke ne pouvait en être certain.\n\nLe président du Conseil de sécurité, l'ambassadeur américain Henry Cabot Lodge Jr., s'est levé pour ouvrir la séance avant de donner la parole à Franke.\n\n« Merci, Mesdames et Messieurs les membres du Conseil de sécurité. Je comprends que la raison pour laquelle je suis ici soit controversée, comme vous l'avez certainement tous entendu. Quatre des cinq membres permanents de ce Conseil sont des États dotés d'armes nucléaires, pour une raison ou une autre. La possession d'armes et de technologies nucléaires est un sujet et un enjeu sérieux à notre époque, en particulier compte tenu des tensions entre certains membres de ce Conseil. Le gouvernement de la République fédérale en a pris conscience et a mis en œuvre des plans pour développer l'énergie nucléaire et/ou se doter d'armes nucléaires limitées. Nous tenons à souligner que, que ce soit pour la paix ou pour la guerre, notre possession de technologie nucléaire est gérée conformément aux négociations menées avec nos alliés et d'autres États responsables. Nous reconnaissons les problèmes et le passé malheureux inhérents à l'histoire de l'Allemagne en matière de développement nucléaire et nous nous efforçons d'y remédier du mieux que nous pouvons. Je ne peux qu'espérer que les pays du Conseil de sécurité et les Nations unies dans leur ensemble accepteront nos efforts et respecteront notre décision de devenir une puissance nucléaire. »\n\nIl n'y eut pas d'applaudissements, et lorsque Franke s'assit, il sentit le regard furieux de l'ambassadeur soviétique posé sur lui.\n\nLa réunion s'est poursuivie, l'ambassadeur soviétique lançant une attaque virulente contre « les fascistes et les impérialistes dotés d'armes nucléaires », qui a rapidement dégénéré en une bataille idéologique avec les quatre autres membres. Pour Franke, cependant, cela semblait être un certain succès."
 Franke57.6.d: "C'était en début d'après-midi à la Chancellerie lorsque Franke, occupé à examiner d'autres rapports dans son bureau, entendit frapper à la porte. Son ami et membre du Kanalarbeiter, Karl Herold, fit irruption dans la pièce. Herold semblait plutôt pressé et en colère, haletant tandis qu'il entrait.\n\n« Egon, c'est déplorable. Tu DOIS faire quelque chose ! »\n\n« Ravie de te revoir, Karl. Je suppose que tout va bien au Bundestag ? »\n\n« Eh bien, Monsieur le Chancelier, j'aimerais pouvoir vous répondre que oui. Il n'y a aucun problème avec notre législation et vos politiques, mais c'est la cafétéria qui pose problème ici. »\n\n« Qu'y a-t-il, Karl ? »\n\n« Eh bien, Egon, c'est la cafétéria. Il n'y a rien à manger. Les portions sont trop petites. On doit apporter des saucisses de chez nous ! C'est dingue ! »\n\nFranke soupira. Il se leva, prit Herold par l'épaule et le conduisit hors du bureau. Dix minutes plus tard, ils étaient à la cafétéria du bâtiment du Bundestag, assis avec le directeur général.\n\n« Vous vous demandez sûrement pourquoi je suis ici, Herr Strass. On m'a dit que les portions servies à la cafétéria diminuaient progressivement. »\n\nIl tremblait comme une feuille, n'ayant pas l'habitude de parler à une personne de haut rang telle que Franke. « Oui, monsieur, je suppose que oui. »\n\n« Alors, comment pouvons-nous remédier à cela ? Les membres du Bundestag doivent bien manger pour pouvoir accomplir leur mission au service de ce pays. »\n\n« Eh bien, monsieur, nous ferons tout notre possible pour régler ce problème. »\n\n « Merci, Herr Strass. Bonne journée. » Il fit un clin d'œil à Herold, serra la main du directeur, puis ils sortirent en valsant, un autre problème de la République fédérale résolu."
 Franke57.7.d: "Après des jours et des jours de délibérations et de planification, le moment était venu. Le chef de cabinet de Franke comprit immédiatement ce qui se passait lorsqu'il ouvrit la porte du bureau du chancelier.\n\nCinq minutes plus tard, les appels avaient été passés et, escorté par des agents de la Bundespolizei et du BGS, Erich Ollenhauer fut conduit sans ménagement dans le bureau de Franke, où l'attendaient des responsables du SPD, des représentants de l'Office fédéral pour la protection de la Constitution (BfV) et Franke lui-même.\n\nOllenhauer était à la fois furieux, confus et, d'une certaine manière, conscient de ce qui allait se passer. Pendant que la police attendait dehors, les discussions ont commencé.\n\n« Je suis sûr que tu sais pourquoi tu es ici, Erich. »\n« Non, Monsieur le Chancelier, je ne comprends vraiment pas. J'aimerais avoir une explication sur la raison pour laquelle des policiers se trouvaient devant mon bureau pour venir me chercher. »\n« C'était regrettable, mais nous devions nous assurer que vous viendriez ici quoi qu'il arrive. »\n« Et alors ? Je suis là maintenant. »\n\n« Monsieur Ollenhauer, vos actions au cours des derniers mois et des dernières années ont éveillé les soupçons, en particulier ceux de nos services de renseignement et de sécurité intérieurs, ainsi que ceux des responsables du parti. C'est pourquoi toutes ces personnes sont ici. Vos déplacements, en particulier vos deux visites à Berlin-Est au cours de l'année dernière, ainsi que vos visites en Yougoslavie, en tant que membre officiel de ce gouvernement sans autorisation, ont suscité beaucoup d'inquiétudes au sein de ce bureau. Par conséquent, en ma qualité de chancelier fédéral et de chef du Parti social-démocrate, je mets fin à vos fonctions au sein de ce gouvernement ainsi qu'à votre appartenance au Parti social-démocrate. Vous conserverez votre siège au Bundestag en tant que député indépendant non affilié jusqu'aux prochaines élections. »\n\n« Quoi ? Egon, pourquoi ? Ces visites à Berlin étaient de nature diplomatique, je n'ai pas voulu nuire à la sécurité de cette République en engageant des discussions avec des représentants est-allemands. » Jetant un regard aux responsables du SPD, il plaida : « Cela ne peut certainement pas être légal. Le chancelier ne peut pas prendre une telle décision de manière unilatérale ? »\n\nL'un des fonctionnaires s'avança. « Je crains que ce soit le cas, Herr Ollenhauer. Les statuts stipulent qu'il peut vous retirer votre qualité de membre et vous renvoyer du gouvernement ; comme je l'ai déjà dit, votre position au Bundestag ne sera pas affectée pour le moment. »\n\nOllenhauer soupira, s'enfonçant de près de trente centimètres dans la moquette. « Très bien. Soyez assuré que ce gouvernement et ce parti ne perdront pas de vue ma mission et mes idéaux. Vous devrez relever ce défi devant les tribunaux, mais j'irai. »\n\nEn sortant de la pièce, tous les participants semblaient déprimés, comme s'ils n'avaient pas envie de faire cela, en particulier Franke, mais il devait le faire."
 Franke57.8.d: "« FRANCFORT, Allemagne de l'Ouest (AP) - Des informations provenant de hauts fonctionnaires de la Chancellerie fédérale ouest-allemande indiquent la formation aujourd'hui du « Bloc uni », un partenariat entre le Parti social-démocrate au pouvoir et l'Union chrétienne-démocrate minoritaire. Composée principalement d'éléments conservateurs au sein du SPD, dirigée par le chancelier Egon Franke, cette « grande coalition » ou « coalition rouge-jaune » n'était pas tout à fait inattendue pour la plupart des analystes politiques, qui pensaient que les deux factions finiraient par s'unir. Écartant largement la faction réformiste de gauche dirigée par Erich Ollenhauer au sein du SPD, cette nouvelle coalition devrait susciter beaucoup plus d'intérêt pour la politique ouest-allemande à l'avenir. »\n\nEn lisant cette coupure de presse le lendemain matin, Franke était plutôt satisfait du résultat. Il décrocha le téléphone et composa le numéro du siège de la CDU.\n\n« Konrad, as-tu déjà lu le journal de ce matin ? »"
 Franke57.9.d: "Comme d'habitude, le Bundestag était en effervescence, mais pour une raison différente. Au lieu de débattre des lois et des dépenses, ils discutaient d'un autre sujet : la signification du socialisme. Il s'agissait principalement d'un débat entre la CDU et le SPD et ses deux factions sur la signification de ce terme, et comme toutes les questions partisanes, celui-ci dégénérait rapidement.\n\nAlors que les délégués de la CDU continuaient à confondre socialisme et communisme, les délégués du SPD les huaient, leur répondaient par des slogans anti-nazis et tentaient de discuter, tandis que le parlementaire s'efforçait de rétablir l'ordre.\n\nPersonne ne savait vraiment pourquoi cela était fait, si ce n'est qu'un des députés de Franke avait inscrit ce point à l'ordre du jour, dans l'espoir que la République fédérale puisse fournir une définition politique du socialisme. Les députés du SPD tentaient sincèrement de le défendre, arguant que le socialisme était la meilleure forme de gouvernement pour l'Allemagne et que la nationalisation de l'industrie finirait par porter ses fruits. Cependant, une décision devait être prise, et rapidement."
 Franke57.10.d: "« Pourquoi devons-nous laisser enseigner des croyances personnelles dans les écoles publiques ? »\n\nCette journée productive au Bundestag s'est achevée sur un nouveau sujet controversé qui avait également secoué la Belgique voisine : l'enseignement religieux, en particulier la théologie catholique, dans les écoles publiques financées par l'État.\n\nDe toute évidence, l'Union chrétienne-démocrate, parti d'opposition, soutient pleinement l'enseignement religieux et la prière à l'école, en particulier lorsqu'il s'agit de réserver un moment précis de la journée au culte obligatoire. Le Parti social-démocrate au pouvoir s'opposerait normalement sans réserve à ce projet pour des raisons laïques et sociales-démocrates, si certains députés du Kanalarbeiter ne restaient pas globalement modérés sur la question. Si la plupart s'accordent à dire que l'utilisation de fonds publics pour la prière à l'école est intrinsèquement négative, certains ne s'opposent pas à l'idée d'introduire dans les programmes scolaires, sur une base volontaire, un temps de prière ou d'autres aménagements pour les croyances catholiques et protestantes.\n\nCependant, cela les éloigne encore davantage de l'aile traditionaliste du SPD, qui estime que le gouvernement et les religions organisées (principalement l'Église catholique dans le cas présent) ne devraient avoir aucune interaction au niveau éducatif. Toutefois, aucune décision n'a encore été prise à ce sujet."
 Franke57.11.d: "Alors qu'un nouveau matin commençait, une nouvelle réunion du cabinet s'ouvrait, avec un nouveau sujet important à l'ordre du jour : l'OTAN. Lors de sa création en 1949 pour défendre l'Europe occidentale, le gouvernement Schumacher avait refusé unilatéralement d'y adhérer, par colère envers les blocs occidental et oriental. Cependant, le nouveau gouvernement Franke, plus favorable à une politique pro-occidentale, a examiné une proposition d'adhésion à l'OTAN.\n\nL'un des délégués traditionalistes du SPD se leva et commença à parler avec inquiétude de « l'engagement envers cette alliance, des hommes qui pourraient mourir, dans quoi nous embarquons-nous ? »\n\nLe chef de cabinet de Franke a commencé par réfuter cet argument : « Ce pays sera envahi par les Soviétiques, que nous rejoignions cette alliance ou non. Si nous y adhérons, au moins en tant que membre limité, nous bénéficierons d'une certaine protection, les forces alliées pourront au moins couvrir nos positions et nous donner une chance de survivre. »\n\n« Très bien, alors, qu'implique le fait de devenir membre limité ? »\n\nFranke regarda son aide de camp et ministre des Affaires étrangères, cherchant une réponse.\n\n« Pour l'instant, monsieur, nous pouvons entamer le processus d'adhésion pour devenir observateur de l'OTAN ou membre à part entière. Le statut d'observateur ne garantit pas la sécurité mutuelle, mais l'Alliance viendrait très certainement à notre aide, sachant que nous émettons certaines réserves. »\n\n« Très bien. Quelle sera notre décision ? »"
 Franke57.12.d: "C'est avec une nouvelle surprenante venue conjointement de Francfort et de Bruxelles que la République fédérale d'Allemagne a soumis aujourd'hui des documents d'adhésion à l'Organisation du traité de l'Atlantique Nord en tant qu'observateur. À la grande surprise de la plupart des observateurs de la politique de sécurité européenne, en particulier du gouvernement social-démocrate dirigé par le chancelier Egon Franke, un haut fonctionnaire a révélé que cette idée s'inscrivait dans une orientation pro-occidentale globale et que l'adhésion inclurait tous les avantages autres que la sécurité mutuelle garantie par l'article 5. Si cette décision satisfait la plupart des leaders de l'opposition et la faction de Franke au sein du SPD, elle ne devrait pas être bien accueillie par la faction traditionaliste, en particulier en raison de ses sentiments anti-blocs."
 Franke57.13.d: "« Mesdames et Messieurs de la Communauté économique européenne, merci à tous d'être venus ici aujourd'hui. Je suis plus qu'honoré de m'adresser à cette assemblée aujourd'hui pour rendre compte du rôle de l'Allemagne dans le nouveau paysage européen émergent. Le peuple allemand a parcouru un long chemin en moins de dix ans d'existence, et les gouvernements sociaux-démocrates nous ont guidés vers le progrès. Je crois que dans un monde en constante évolution, largement défini par des différences idéologiques et politiques, la CEE devrait s'unir en une seule force, non seulement pour soutenir notre économie, mais aussi pour soutenir notre peuple, notre politique étrangère et notre culture. L'Europe peut être plus unie, et en cette période de progrès, je pense que le moment est venu d'accomplir beaucoup pour le bien du monde. Merci. »"
 Franke57.14.d: "\"DE : Bureau de la Chancellerie\nÀ : Tous les ministères et agences\nOBJET : Nouvelles réformes militaires et économiques pour la République fédérale\n\nEntrent en vigueur immédiatement de vastes nouvelles initiatives destinées à mobiliser la puissance militaire et économique de la République fédérale.\n\n1. Étendre la Bundeswehr et/ou le Bundesgrenzschutz dans une plus large mesure, en soulignant la nécessité de la formation des officiers militaires.\n\n2. Discuter de l’acceptation d’une aide militaire étrangère, en particulier des États-Unis et d’autres nations alliées.\n\n3. Débattre de la question de la conscription et des avantages accordés aux soldats/vétérans.\n\n4. Continuer à développer les installations industrielles, y compris les raffineries de pétrole en Bavière, ainsi que les installations de production de charbon dans la région de la Ruhr.\n\n5. Accroître les infrastructures, en mettant particulièrement l’accent sur les réseaux ferroviaires et aériens plutôt que sur les autoroutes générales et d’autres formes de transport routier.\n\nCes politiques servent simplement de base de travail pour vos départements et agences, et le Bureau de la Chancellerie se réjouit de poursuivre la collaboration avec chaque ministère exécutif, agence ou commission concerné.\n\nCordialement,\nChancelier Egon Franke\""
 Franke57.15.d: "Aujourd'hui devait être un jour mémorable pour les habitants de l'Allemagne de l'Ouest. Alors que des centaines de milliers de familles allemandes regardaient le journal télévisé du soir Tagesschau, elles ont été interrompues par un reportage spécial, en direct de la Chancellerie. C'était la première fois depuis que la télévision s'était généralisée que le gouvernement fédéral ouest-allemand s'adressait à la population, et devant un large podium orné d'un aigle noir se tenait Egon Franke, le chancelier, populaire auprès de la plupart des gens, mais pas de tous.\n\n« Peuple allemand ! Mes chers compatriotes ! C'est la première fois que certains d'entre vous me voient en direct à la télévision, depuis la Chancellerie fédérale à Francfort. La télévision est l'un des médias les plus modernes et innovants de ce siècle naissant, et je l'ai choisie pour illustrer à quel point la République fédérale a changé au cours de la dernière décennie. Depuis notre création il y a dix ans, beaucoup a été accompli. Notre gouvernement est fort, construit pour le peuple et par le peuple ; notre économie est prospère ; nos affaires étrangères développent chaque jour davantage nos liens avec l'Occident ; notre armée est forte et continue de se développer pour atteindre son apogée. Nous, Allemands, avons été témoins de nombreux événements au cours des dix dernières années : la diplomatie des grandes puissances occidentales et orientales, des guerres, des conflits internes et des problèmes. Mais nous avons persévéré ! Je sais que l'esprit de l'Allemagne vit dans chaque Allemand et qu'il continuera à vivre dans les années 1960 ! Je ne pourrais être plus fier d'être votre chancelier fédéral et je continuerai à faire tout ce que j'ai promis. Merci beaucoup, Allemagne, et guten nacht. »\n\n§CC'est la fin du contenu pour ce parcours sur l'Allemagne de l'Ouest pour le moment. Merci d'avoir joué et n'hésitez pas à consulter le canal Discord officiel de Cold War Iron Curtain pour plus d'informations et pour poser vos questions.§!"
 Reimann_SOV.0.t: "L'Allemagne de l'Ouest demande une assistance technique"
 Reimann_SOV.0.d: "Au lendemain de la victoire du KPD en Allemagne de l'Ouest, la nouvelle coalition KPD-SPD a introduit divers changements politiques en Allemagne de l'Ouest afin de modeler davantage le pays selon les structures et les idéaux marxistes-léninistes. Aujourd'hui, l'ambassade ouest-allemande à Moscou nous a demandé d'envoyer divers conseillers techniques en Allemagne de l'Ouest afin de contribuer à la reconstruction. Alors que les souvenirs de la guerre sont encore frais, cela semble être une excellente occasion d'exercer une influence en Allemagne de l'Ouest et de se rapprocher ainsi d'une réunification communiste du pays."
 Reimann_SOV.0.a: "Mais avec plaisir !"
 Reimann_SOV.1.t: "L'Union soviétique envoie de l'aide"
 Reimann_SOV.1.d: "Moscou a accepté notre demande de conseillers techniques, ce qui nous permet de poursuivre la reconstruction encore plus rapidement que prévu."
 Reimann_SOV.1.a: "Excellent."
 Reimann_SOV.2.t: "L'Allemagne de l'Ouest cherche à acheter d'anciens chars"
 Reimann_SOV.2.d: "Une fois de plus, les Allemands de l'Ouest nous ont sollicités pour obtenir davantage d'aide, cette fois-ci par des moyens militaires. Divers chars T-54 anciens sont toujours dans nos stocks, prenant la poussière jour après jour, en attendant d'être finalement mis hors service. Peut-être pourrions-nous les offrir aux Allemands de l'Ouest en guise de geste amical et de moyen d'accroître notre influence ?"
 Reimann_SOV.2.a: "Commander la livraison."
 Reimann_SOV.3.t: "L'Union soviétique accepte"
 Reimann_SOV.3.d: "Le Kremlin était plus qu'heureux de nous vendre divers anciens chars T-54, ordonnant immédiatement leur livraison à Bonn. Ils seront très utiles dans la nouvelle structure de la Bundeswehr."
 Reimann_SOV.3.a: "Parfait"
 Reimann.0.t: "[GetNewspaperHeader]Max Reimann élu chancelier en Allemagne de l'Ouest"
 Reimann.0.d: "Dans un revirement de situation surprenant, le Parti communiste allemand (KPD), dirigé par Max Reimann, a remporté les élections fédérales de 1949, s'assurant ainsi la chancellerie grâce à une coalition avec le Parti social-démocrate (SPD). Cette alliance inattendue a écarté les chrétiens-démocrates (CDU), suscitant l'indignation des conservateurs et faisant craindre une transformation socialiste en Allemagne de l'Ouest. Des allégations d'ingérence soviétique pèsent sur les élections, des rapports suggérant un soutien secret au KPD, bien que le gouvernement nie ces accusations. Reimann s'est engagé à mener des politiques socialistes, notamment la nationalisation des industries et la réévaluation des liens avec l'Occident, tout en renforçant les relations avec l'Allemagne de l'Est et l'Union soviétique. Les dirigeants occidentaux, en particulier aux États-Unis et en Grande-Bretagne, ont réagi avec inquiétude, avertissant que le virage de l'Allemagne vers le socialisme pourrait déstabiliser l'Europe. Des manifestations ont éclaté dans tout le pays, les partisans de la CDU et du Parti libéral-démocrate (FDP) dénonçant ce qu'ils qualifient de « coup électoral ». Alors que les tensions montent, Reimann proclame l'« aube d'une nouvelle Allemagne », engageant le pays sur une voie incertaine et profondément divisée."
 Reimann.0.a: "Des extrémistes rouges à la tête de l'Allemagne ? Nous venons tout juste de nous débarrasser des bruns."
 Reimann.0.b: "Parfait"
 Reimann.0.c: "Le socialisme unira l'Allemagne."
 Reimann.1.d: "Sur une place animée de Francfort, Max Reimann monta sur le podium, flanqué des drapeaux du KPD et du nouveau drapeau allemand, bien en évidence derrière lui. Bien que troublé intérieurement par les circonstances entourant la victoire contestée de son parti, il affichait calme et détermination. Il comprenait la nécessité de projeter une confiance inébranlable devant la foule rassemblée composée de responsables du parti, de militants de l'opposition et de membres de la presse.\n\nReimann a commencé son discours par une déclaration qui a résonné sur toute la place, d'une voix ferme et claire, accueillant les participants dans un nouveau chapitre pour l'Allemagne. Il a présenté ce moment comme un tournant, soulignant la promesse de prospérité et d'inclusion sous le nouveau gouvernement. La légitimité de l'arrivée au pouvoir du KPD est incontestable, soulignant que leur victoire n'a pas été obtenue par la révolution, mais par le processus démocratique des urnes. Il a déclaré que l'Allemagne allait se libérer du joug de l'impérialisme occidental et tracer sa propre voie, guidée par les besoins du peuple allemand plutôt que par des influences extérieures, qu'elles soient corporatives ou dictatoriales.\n\nAlors que Reimann terminait son discours, la place éclata en applaudissements, le public adhérant désormais pleinement à la vision qu'il avait exposée. D'un signe de tête affirmatif à la foule, il quitta le podium et consulta immédiatement ses conseillers sur les prochaines étapes à suivre pour le gouvernement naissant."
 Reimann.2.d: "« IMPÉRIALISME ! »\n\nLa pièce résonna lorsque Reimann frappa du poing sur le bureau. Ses ministres et proches conseillers levèrent les yeux, certains sous le choc, d’autres non.\n\nReimann soutenait que la Loi fondamentale avait été rédigée par des forces bourgeoises, dictée par les puissances occupantes occidentales, entérinée par le Bundestag et imposée à la population sans son consentement. Maintenant que le KPD a remporté les élections, avec une certaine assistance, nous affirmons pouvoir résoudre ce problème et rendre le gouvernement plus représentatif du prolétariat et de ses intérêts, au lieu de s’agenouiller devant les exigences des conservateurs et des commandants militaires occidentaux.\n\nDéclenchant des applaudissements dans la salle, Reimann esquissa un léger sourire, sa colère diminuant pour le moment. Le gouvernement devait se mettre au travail."
 Reimann.3.d: "Treize hommes et deux femmes étaient assis dans une pièce terne, beige, presque sans fenêtres, à la Chancellerie. La plupart savaient pourquoi ils étaient là, mais quelques-uns semblaient perdus. Tout serait clarifié lorsque le chancelier Reimann entrerait dans la salle, flanqué de quelques assistants.\n\nIl salua les personnes présentes et expliqua qu’ils étaient réunis dans un but crucial : former une Commission des affaires constitutionnelles afin de résoudre le problème de l’actuelle Loi fondamentale « fantoche ». Ils ont tous été sélectionnés pour leur expérience juridique et politique, et leur aide en cette matière constituera une priorité essentielle pour l’avenir de la République fédérale. Il affirma en outre que l’actuelle « Loi fondamentale » est inadéquate pour nos besoins et sert de forme de gouvernement fantoche permettant à nos maîtres américains et alliés de dicter la politique au peuple allemand. Une alternative est nécessaire, et il nous en faut une rapidement.\n\nUn universitaire affirma que la manière la plus simple d’y parvenir sans compromettre le soutien public serait d’apporter des amendements sélectifs à la Loi fondamentale actuelle, tout en maintenant un langage démocratique.\n\nUn autre suggéra qu’il existe une meilleure approche : une refonte complète de la Loi fondamentale en un document purement socialiste. De cette façon, il ne pourrait y avoir aucun argument juridique pour l’opposition contre notre pouvoir et, bien que nous aliénerions une partie du public, cela sera nécessaire pour consolider notre contrôle.\n\nDes murmures commencèrent tandis que tous les membres se déplaçaient sur leurs sièges, tentant d’adopter une position ou une autre, ou de faire valoir un point.\n\nNous pourrons débattre des subtilités plus tard, mais comment devons-nous procéder à partir d’ici ?"
 Reimann.4.d: "À : Bureau de la Chancellerie\nDE : Commission fédérale des affaires constitutionnelles\nOBJET : Amendements proposés à la Loi fondamentale\n\nHerr Chancelier,\n\nVous trouverez ci-dessous plusieurs amendements et modifications proposés à la Loi fondamentale actuelle, conçus pour refléter le nouveau gouvernement tout en conservant un consensus et un langage démocratiques.\n\n1. Modifier la formulation de l’article 20 afin d’indiquer : « La République fédérale d’Allemagne est un État socialiste démocratique fondé sur le consensus. »\n\n2. Supprimer l’alinéa (2) de l’article 21, relatif à l’inconstitutionnalité des partis politiques qui « cherchent à porter atteinte ou à abolir l’ordre fondamental libre et démocratique »\n\n3. Supprimer les articles 42 à 45, qui concernent les pouvoirs du Bundestag, y compris les réunions publiques, les commissions d’enquête et la nomination d’une commission permanente de contrôle.\n\n4. Supprimer les articles 50 à 53, dissoudre le Bundesrat et instituer un Présidium ou Comité central composé de tous les dirigeants des Länder et présidé par le chancelier.\n\n5. Supprimer les articles 66 à 69 de la Loi fondamentale, relatifs aux pouvoirs du chancelier fédéral, et les remplacer par une disposition interdisant une motion de censure et autorisant le chancelier à former un gouvernement d’urgence à tout moment.\n\n6. Modifier l’alinéa (2) de l’article 79 afin qu’il dispose : « requiert l’approbation d’une majorité simple du Bundestag », supprimant ainsi la majorité qualifiée des deux tiers.\n\nNous espérons que ces changements ne constitueront que le début d’un ensemble de mesures visant à réformer la Loi fondamentale afin de refléter la volonté du peuple."
 Reimann.5.d: "À : Bureau de la Chancellerie\nDE : Commission fédérale des affaires constitutionnelles\nOBJET : Proposition pour une nouvelle constitution socialiste\n\nHerr Chancelier,\n\nVous trouverez ci-dessous plusieurs propositions générales concernant les thèmes d’une nouvelle constitution pour la République fédérale.\n\n1. Les droits et principes socialistes inaliénables du citoyen ordinaire, y compris la liberté d’expression des principes socialistes ainsi que la liberté d’association, d’emploi, de soins de santé et de rémunération équitable.\n\n2. Affirmer la direction et la sagesse du Parti communiste d’Allemagne (KPD) dans toutes les affaires gouvernementales et partisanes.\n\n3. Structurer le gouvernement en remplaçant le Cabinet fédéral par un Conseil des ministres dirigé par le Premier secrétaire du KPD ainsi qu’un Conseil d’État exécutif, dirigé par un Premier ministre.\n\n4. Remplacer les États fédérés par des comités provinciaux, dirigés par des responsables du KPD dans ces États, qui seraient responsables devant le gouvernement fédéral central.\n\n5. Autoriser le développement d’une armée destinée à l’autodéfense contre les forces occidentales, y compris des forces terrestres, navales et aériennes.\n\n6. Réaffirmer les liens étroits avec l’Union soviétique, tous les pays communistes et le socialisme dans son ensemble.\n\nCes idées fondamentales visent à fournir un cadre pour des règlements plus spécifiques concernant le fonctionnement et la structure du nouvel État."
 Reimann.6.d: "La Commission fédérale des affaires constitutionnelles se trouvait lors de l’une de ses réunions habituelles et, après avoir décidé de réécrire entièrement la Loi fondamentale en une version véritablement socialiste, se retrouva plongée dans un débat amer : quel type de langage utiliser dans ce nouveau document. Reimann tenta de maintenir le débat courtois, mais les membres se criaient malgré tout les uns par-dessus les autres.\n\n« Pour rallier les partis d’opposition, nous devons conserver au moins une apparence d’ordre démocratique — »\n« Imbécile ! Marx n’aurait jamais permis à l’influence bourgeoise d’infiltrer une constitution socialiste ! »\n« Sinon, ce document ne pourra pas être adopté ! Nous devons faire les choses correctement, après tout ! »\n\nReimann reprit la parole. « Messieurs, messieurs, je vous en prie. Inutile de vous quereller. Nous devons préserver la sainteté d’un État socialiste et nous inspirer de nos camarades en Russie. Cependant, votre point selon lequel les forces d’opposition doivent être incluses est également pertinent, aussi regrettable que cela puisse être. Devons-nous procéder à un vote sur la manière dont cette constitution devrait être formulée ? »"
 Reimann.7.d: "Dans un bureau vaste mais faiblement éclairé du siège de la CDU à Bonn, Adenauer feuilletait son journal et ses notes d’information. Bien que le gouvernement du KPD, élu comme il l’avait été, ait tenté de museler la presse ouest-allemande, il n’avait pas rencontré beaucoup de succès face à un corps journalistique bien établi. De nombreux articles et fuites provenant de collaborateurs avaient réussi à passer au travers du tamis des censeurs et des porte-parole du gouvernement.\n\nEn première page, en caractères larges et gras, hurlait le titre : « LE GOUVERNEMENT PROPOSE UNE NOUVELLE CONSTITUTION ».\n\nAdenauer fixa le titre, puis frappa du poing sur le bureau, poussant un assistant et plusieurs autres responsables de la CDU à accourir. « Qu’est-ce que cela signifie ? » cria Adenauer avec colère.\n\n« Monsieur, il semble qu’ils souhaitent rédiger une nouvelle constitution socialiste afin de refléter la nouvelle composition de leur gouvernement- »\n\n« Nous devons rejeter et condamner cette initiative, la boycotter à tout prix ! Il ne faut pas porter atteinte à la Loi fondamentale ! Ces communistes- »\n\n« Oui, monsieur. Les Alliés ne sont pas satisfaits ; en fait, ils comptent sur la CDU pour mobiliser le soutien contre cela, mais cela paraît quelque peu improbable face à leur soutien croissant. »\n\n« Faites tout ce qu’il faut pour faire échouer cela, et je dis bien tout ce qu’il faut. »\n\n« Oui, monsieur. »"
 Reimann.8.d: "À : Tous les départements et ministères\nDE : Bureau de la Chancellerie\nOBJET : Bureau fédéral de planification centrale\n\nÀ tous les responsables,\n\nÀ compter de ce jour, le Bureau fédéral de planification centrale assumera l’ensemble des responsabilités économiques et financières du gouvernement fédéral. Les attributions du Bureau sont les suivantes :\n\n1. Assumer le contrôle administratif de toutes les entreprises publiques, actuelles ou futures, y compris les ressources naturelles, l’industrie manufacturière et les infrastructures.\n\n2. Coordonner des plans quinquennaux à l’échelle nationale et maintenir l’efficacité dans tous les aspects de l’économie.\n\n3. Assurer la liaison avec d’autres pays socialistes afin de déterminer les meilleures orientations en matière de planification économique et d’industrialisation.\n\nCes trois propositions constituent le cadre fondamental du Bureau, qui est par la présente institué sous ma signature et commencera ses activités dès que possible.\n\nSIGNÉ\nChancelier Max Reimann"
 Reimann.9.d: "Les réunions du cabinet de Reimann étaient parfois tumultueuses, parfois calmes, lorsque tous les membres étaient d’accord. Ce matin-là, réunis avec davantage d’experts du Bureau fédéral de planification centrale, on assistait à un exemple du premier cas.\n\n« Pourquoi devrions-nous accepter des pots-de-vin et des aides de l’Occident ? » demanda un ministre, avec une certaine incrédulité.\n\n« Je suis sûr que le chancelier Reimann sera d’accord avec moi ; nous avons besoin de toute l’aide possible en ce moment, qu’elle vienne de l’Est ou de l’Ouest. Les États-Unis pourraient retirer leurs fonds à l’avenir si nous ne saisissons pas cette offre maintenant ; cet argent pourrait disparaître. »\n\nReimann se tourna vers l’homme, le vice-président du Bureau fédéral de planification centrale. « Votre argument est solide, et cela pourrait être un moyen d’apparaître amicaux envers l’Ouest tout en recevant des fonds et en les utilisant pour la planification centrale et une industrialisation accrue afin de soutenir notre mission socialiste. »\n\nLe premier ministre reprit la parole : « Monsieur, êtes-vous vraiment prêt à sacrifier vos principes idéologiques pour des piles d’argent ? Vous ne valez guère mieux que les capitalistes et impérialistes corrompus que nous combattons ! »\n\nCela plongea la salle dans le chaos, mais une décision devait être prise rapidement, et sans tarder."
 Reimann.10.d: "BONN, Allemagne de l'Ouest (AP) - Aujourd'hui, le président du Parti communiste et nouveau chancelier fédéral Max Reimann a condamné le statut d'occupation allié, le qualifiant de « document fantoche impérialiste et colonialiste destiné à empêcher le gouvernement allemand légitime de faire la volonté du peuple ». Lors d'une réunion du Parti communiste allemand (KPD), le parti communiste ouest-allemand financé par Moscou, M. Reimann a souligné l'importance pour la nouvelle République fédérale d'être indépendante et de disposer d'une véritable autodétermination dans tous les domaines, y compris la modification de la Loi fondamentale et d'autres formes de gouvernement. Les puissances occidentales, pressées de commenter, ont toutes condamné Reimann de manière similaire, le haut-commissaire américain pour l'Allemagne, John McCloy, répondant que Reimann n'était « rien d'autre qu'une marionnette du Kremlin, élue frauduleusement et non par la volonté du peuple allemand ». Les réactions du bloc de l'Est ont été généralement modérées, mais les rapports du Kremlin indiquent que les dirigeants soviétiques semblent globalement satisfaits de la situation actuelle en Allemagne de l'Ouest."
 Reimann.11.d: "Il était midi lorsque l'avion présidentiel de la République fédérale, un vieux De Havilland Comet utilisé par les forces d'occupation britanniques, a atterri sans encombre sur le tarmac de l'aéroport international de Vnukovo, à la périphérie de Moscou.\n\nEn descendant de l'avion, accueilli par une fanfare militaire et une garde d'honneur composée de soldats soviétiques, Reimann souriait en descendant les marches, saluant d'un signe de tête les porte-drapeaux qui jouaient l'hymne national allemand ainsi que l'hymne national soviétique. Après avoir serré la main de celui qu'il supposait être l'un des assistants de Staline, lui et sa délégation montèrent dans une berline noire qui les emmena à toute vitesse vers le centre-ville de Moscou et le Kremlin.\n\nUne heure ou deux plus tard, après avoir vu plus d'immeubles d'habitation mornes qu'il ne pouvait en compter, ils arrivèrent au Kremlin, où ils furent immédiatement conduits à l'intérieur du complexe, puis conduits à travers les couloirs jusqu'au bureau du secrétaire général du Parti communiste de l'Union soviétique, Joseph Staline\n\nEn entrant dans le bureau et en serrant la main de Staline, Reimann ressentit immédiatement la présence d'une figure presque divine, qui souriait et restait humble face à un homme tel que Reimann. Les deux hommes discutèrent brièvement, échangeant des plaisanteries, Staline félicitant Reimann pour avoir fait élire son mouvement communiste au gouvernement fédéral. Avant de poser pour des photos et de se serrer à nouveau la main, Reimann fut raccompagné hors du complexe du Kremlin, avec un sentiment de supériorité en lui.."
 Reimann.12.d: "Enfin, après des mois et des mois de délibérations et de controverses, le Bundestag, composé principalement de membres du KPD et de membres radicaux du SPD, avec l'opposition de la CDU, s'est mis d'accord sur une nouvelle Loi fondamentale. Dénonçant l'ancien document comme un « carcan impérialiste », la Commission fédérale des affaires constitutionnelles a décidé soit de modifier le document actuel, soit d'en rédiger un nouveau, et depuis lors, la loi et son contenu ont été finalisés. Condamnée sans réserve et combattue jusqu'à la mort par l'opposition de la CDU et les autorités militaires et d'occupation occidentales restantes, la nouvelle Loi fondamentale devrait restructurer complètement tous les aspects de la vie gouvernementale, civique et sociale de l'Allemagne de l'Ouest, en particulier en faveur du Parti communiste allemand."
 Reimann.13.d: "À : Bundeskanzleramt\nDE : Inspecteur général du Bundesgrenzschutz\nOBJET : État des forces armées et rôle de l’armée\n\nChancelier,\n\nÀ la suite d’un examen actuel du Bundesgrenzschutz (Garde fédérale des frontières) mené par mes services, nous avons déterminé que le BGS est totalement mal équipé et sous-financé pour fournir une quelconque assistance militaire en cas de crise gouvernementale ou géopolitique impliquant l’Allemagne. En tout état de cause, les recommandations suivantes sont proposées afin de faire du BGS une force militaire capable de répondre aux besoins de la nation.\n\n1. Création de composantes navales et aériennes de l’armée afin de protéger la côte nord et les voies navigables intérieures de l’Allemagne, ainsi que d’assurer une couverture aérienne du territoire national, retirant ces responsabilités au BGS.\n\n2. Procéder à des acquisitions massives d’équipements auprès de l’Union soviétique, tels que des chars T-54, des chasseurs MiG-15 et d’autres aéronefs, ainsi que certains équipements navals.\n\n3. Renforcer les politiques de conscription, ainsi qu’introduire une instruction militaire davantage fondée sur l’idéologie, incluant l’importance de servir son pays.\n\nJ’espère que cela permettra à notre armée de retrouver un niveau de puissance inédit, pour la protection de notre pays et de nos intérêts."
 Reimann.14.d: "Bam bam bam.\n\nLe juge posa son marteau sur l’estrade, ouvrant le procès criminel contre l’ancien SS-Standartenführer Friedrich Stahl. Avec des caméras de télévision disposées dans toute la salle, Stahl se tenait debout, entravé, dans une chambre vitrée, entouré de deux gardes armés du BGS portant des pistolets au holster et des brassards MP à leurs bras.\n\nLe juge parla d’une voix forte et retentissante. « Herr Stahl, vous avez été accusé par la République fédérale d’Allemagne pour des actes contre le peuple allemand, trahison et crimes contre l’humanité. Par le pouvoir qui m’a été conféré par la volonté du peuple allemand, je vous déclare coupable de toutes les accusations et vous condamne à être exécuté par peloton d’exécution, tout comme vous l’avez fait pour ces Juifs allemands durant la guerre. Affaire ajournée. »\n\nBam bam bam. L’avant de la chambre vitrée s’ouvrit et glissa sur le côté, Stahl fut traîné par les deux officiers du BGS hors de la salle d’audience vers une zone de détention où il serait bientôt conduit pour être exécuté. L’arrière de la chambre vitrée s’ouvrit, et un autre ancien officier SS, l’SS-Standartenführer Hans Ehrler, y fut poussé.\n\n« Herr Ehrler, vous avez été accusé par la République fédérale d’Allemagne pour des actes contre le peuple allemand… »"
 Reimann.15.d: "« L’Allemagne d’aujourd’hui est un foyer de décadence, tout comme l’Occident ! »\n\nDans la grande brasserie Mathäser à Munich, la voix tonitruante de Reimann résonna, cette première déclaration ne suscitant que peu d’applaudissements. Ce point semblait secondaire, apparemment, puisque l’Allemagne était encore en grande partie en ruines fumantes, avec peu de décadence en dehors des bases militaires occidentales. Peut-être fallait-il autre chose, pensa-t-il.\n\n« La décadence et l’abus culturel que nous a infligés le gouvernement national-socialiste avant nous ont été désastreux. Nous devons entreprendre une nouvelle lutte culturelle, un “kulturkampf” pour ramener l’Allemagne à une nouvelle ère de révolution et de compréhension culturelle ! » Cela suscita un peu plus d’applaudissements, mais Reimann savait que l’audience avait besoin de davantage, d’un élément accrocheur.\n\n« La relation du précédent gouvernement avec l’Église catholique romaine, une organisation bourgeoise, anti-communiste et anti-socialiste dissidente, révélait leurs véritables tendances. Des centaines, voire des milliers de nos frères ont été arrêtés, torturés ou tués par le gouvernement nazi avec l’assistance de l’Église catholique romaine et du Vatican ! Même aujourd’hui, l’or nazi repose dans les coffres du Pape ! Notre gouvernement va s’attaquer à cette question, pour contrôler l’Église et empêcher son ingérence dans nos affaires internes et celles de notre peuple ! »\n\nEt ainsi commença-t-il, tandis que Reimann s’éloignait, certains applaudissant, d’autres non, mais quoi qu’il en soit, le « Neue Kulturkampf » allait commencer."
 Reimann.16.d: "En entrant dans l’Altes Stadthaus situé à Berlin-Est, Reimann était nerveux. Il ne savait pas exactement pourquoi ; après tout, cette conférence n’était censée être qu’une formalité. Bien que l’approbation du KPD en Allemagne de l’Ouest fût au mieux modérée, il constatait une loyauté beaucoup plus nette envers le Parti socialiste unifié d’Allemagne de l’Est, probablement en raison des années d’occupation soviétique. Il avait échangé de nombreux appels téléphoniques et lettres avec le Secrétaire général du Comité central du SED, Herr Walter Ulbricht, mais ses assistants entretenaient davantage de communications avec les dirigeants qu’il devait rencontrer aujourd’hui, lors de la soi-disant « Conférence de Berlin ».\n\nAssis dans une salle de réunion, Reimann eut enfin l’occasion de rencontrer les autres responsables est-allemands : principalement le président du Conseil des ministres, Otto Grotewohl ; et le président de la République, Wilhelm Pieck ; ainsi que d’autres ministres subalternes, des responsables du SED et une petite délégation de représentants soviétiques. La délégation de Reimann était assez réduite, car il souhaitait rester discret lors de son voyage à Berlin-Est afin de ne pas attirer trop l’attention de l’Ouest.\n\n« Merci à tous de nous accueillir ici à Berlin-Est aujourd’hui. Je dois dire que c’est une ville magnifique, et un exemple parfait du rêve socialiste que nous devons tous faire progresser. »\n\n« Merci, Chancelier Reimann. Nous tous, et le peuple d’Allemagne de l’Est, partageons l’espoir profond que cette conférence pourra être bénéfique et se conclure par une réunification pacifique de la nation allemande sous des idéaux socialistes. »\n\n« Oui, mon gouvernement et le peuple d’Allemagne de l’Ouest sont d’accord. Alors, passons aux affaires. »\n\nEt sur ces mots, commencèrent les journées de négociation."
 Reimann.17.d: "Après des semaines et des semaines de négociations et de discussions sur les détails de l’accord, et en évitant soigneusement les zones d’occupation occidentales de Berlin, la délégation ouest-allemande de Reimann et la délégation gouvernementale est-allemande étaient prêtes à signer l’accord. Aussi réticent que fût Reimann, un groupe de correspondants de la presse internationale se trouvait au palais de Schönhausen, résidence du président est-allemand, pour couvrir la signature du traité d’unification.\n\nAlors que les flashs crépitaient, des journalistes de toutes les nations, moitié de l’Ouest et moitié de l’Est, observaient Reimann, le Secrétaire général est-allemand Walter Ulbricht et le maréchal soviétique Andreï Grechko, en tant que commandant du Groupe des forces soviétiques en Allemagne, s’asseoir à une longue table, avec trois exemplaires du traité d’unification de [GetYear] devant eux.\n\nAprès quelques mots prononcés, les trois hommes prirent leur stylo et signèrent leurs exemplaires, les faisant circuler. La presse continua de prendre des photos et de poser des questions, tandis que Reimann, Ulbricht et Grechko posaient pour les photographies.\n\nUn instant plus tard, l’un des assistants de Reimann se pencha pour lui murmurer quelque chose à l’oreille.\n\nLe visage de Reimann se déforma, son stylo-plume lui échappa des mains, tombant sur un exemplaire du traité et commençant à baver, traversant le papier. Regardant Ulbricht et Grechko, puis la presse, Reimann se leva, saisit son assistant et quitta précipitamment la salle."
 Gehlen.0.d: "Les officiers s’étaient rarement rencontrés en personne, et presque jamais tous ensemble. À l’époque de Reimann, il était préférable de s’en tenir à une routine normale afin de ne pas attirer trop d’attention sur leur cause.\n\nAssis dans la chancellerie fédérale récemment évacuée de Francfort se trouvaient six officiers, tous issus des forces terrestres de la Bundeswehr, les plus anciennes et les plus importantes ; Reinhard Gehlen, Erich von Manstein, Hans Speidel, Adolf Heusinger, Wolf Graf von Baudissin et Hans Rottiger. Entourés d’aides de camp et de gardes de rang inférieur qui s’affairaient autour d’eux, les six hommes discutaient entre eux lorsque Gehlen frappa la table de conférence, faisant rapidement cesser tout bruit.\n\n« Bienvenue, messieurs, et merci à tous de vous être consacrés à cette entreprise. Les rapports continuent d’arriver, mais il semble que nous ayons libéré le peuple allemand de la menace communiste. »\n\nLa pièce éclata brièvement en applaudissements avant que Gehlen ne frappe à nouveau, faisant signe au général Hans Speidel de prendre la parole.\n\n« Cette assemblée doit s’affirmer comme le gouvernement légitime de la République fédérale, et l’une des façons d’y parvenir est d’élire un président de ce comité des officiers. Ce président agira comme le chef de cet organe et le chef de l’État, représentant les intérêts de la République fédérale auprès des Alliés occidentaux et à l’étranger. »\n\n« Il y a deux principaux candidats : le Generalleutnant Reinhard Gehlen et l’ancien Generalfeldmarschall Herr Erich von Manstein. Messieurs, veuillez écrire vos votes sur le morceau de papier devant vous et les remettre à l’adjudant. »"
 Gehlen.1.d: "Cela faisait quelques jours qu'il avait été « élu » président du Comité des officiers de la Bundeswehr, à une écrasante majorité, et tandis que Reinhard Gehlen se tenait debout, lissant son uniforme, ajustant ses médailles et ses insignes, regardant les équipes installer les microphones et les caméras devant le podium, ajustant l'emblème derrière celui-ci, il réfléchissait à ce qu'il allait dire. Ce serait un jeu d'enfant, mais apaiser toutes les parties serait la partie la plus difficile.\n\nQuelques minutes plus tard, Gehlen prit place à la tribune, vérifiant une dernière fois son discours avant qu'un assistant ne lui signale qu'ils étaient en direct.\n\n« Citoyens de la République fédérale d'Allemagne. C'est avec une grande responsabilité que je m'exprime en ce moment dramatique de l'histoire allemande. En tant qu'officier fier de la Bundeswehr, c'est mon devoir, et je ne le prends pas à la légère, car l'avenir de notre République est en jeu. J'annonce aujourd'hui la formation d'un gouvernement militaire provisoire officiel, composé de moi-même et d'autres membres de l'armée, dans le cadre de nos fonctions au sein du Comité des officiers de la Bundeswehr. Certains pourraient dénoncer cette mesure comme étant antidémocratique et autoritaire, mais il s'agit d'un changement temporaire de gouvernement en réponse aux menaces et à la répression subies sous l'ancien chancelier Max Reimann. Nous souhaitons ramener la République fédérale d'Allemagne et ses citoyens à un rempart anticommuniste contre l'agression soviétique et la coopération avec les Alliés occidentaux. Notre gouvernement annoncera un certain nombre de changements politiques dans les prochains jours. Nous vous remercions de votre coopération, et Guten Nacht, Deutschland. »"
 Gehlen.2.d: "ORDONNANCE N° 3 DU GOUVERNEMENT MILITAIRE PROVISOIRE\n\nBONN, ALLEMAGNE,[GetDateText] \n\nPOLITIQUE RELATIVE À LA LOI FONDAMENTALE DE LA RÉPUBLIQUE FÉDÉRALE D’ALLEMAGNE\n\nConscients de l’importance de la Loi fondamentale de la République fédérale d’Allemagne en tant que document fondateur permettant de larges droits politiques et garantissant un système démocratique dans son ensemble,\n\nConstatant avec inquiétude les modifications apportées par le précédent gouvernement communiste dirigé par Max Reimann dans le but de démanteler ces institutions démocratiques et de saper la volonté du peuple,\n\nConscients de l’immense devoir que tous les officiers de la Bundeswehr ressentent dans leur responsabilité de gouverner et de protéger la population contre les dangereuses subversions communistes,\n\nLe Comité des officiers de la Bundeswehr décide ce qui suit :\n\n1. La Loi fondamentale (Grundgesetz) de la République fédérale d’Allemagne est suspendue jusqu’à nouvel ordre.\n\n2. Le Bundestag restera en tant qu’organe consultatif, mais sera non politique et représentera le secteur civil de la population.\n\n3. La Cour constitutionnelle fédérale sera dissoute jusqu’à nouvel ordre.\n\n4. Tous les anciens ministères seront organisés sous l’autorité du ministère de la Défense et du Comité des officiers de la Bundeswehr afin de mettre en œuvre les politiques du gouvernement national.\n\n5. Tous les gouvernements des Länder seront placés sous l’autorité et le contrôle immédiats des commandants militaires régionaux nommés par le Comité des officiers.\n\nSIGNÉ\nGeneralleutnant Reinhard Gehlen\nPrésident, Comité des officiers de la Bundeswehr, Gouvernement militaire provisoire de la République fédérale d’Allemagne"
 Gehlen.3.d: "C’était une nuit calme à Bonn, alors que Gehlen entrait dans la salle de conférence, où Spiedel, Manstein et quelques autres officiers subalternes s’affairaient, passant des papiers. En s’asseyant, il remarqua un nouvel officier assis au bout de la table, feuilletant des notes et des papiers, en train de fermer sa valise.\n\n« Hans, qui est-ce ? »\n« Johannes Stumm, Police de Berlin ; et le capitaine Markus Herrlein, Commandement de la police militaire. Reinhard, il y a du nouveau dans l’affaire Reimann. »\n« Bienvenue, messieurs. Quelle est la situation ? »\n\n« L’ancien chancelier Max Reimann a fui à Berlin-Est après avoir signé le traité d’unification illégitime et nos forces ont pris le pouvoir à Bonn. Depuis, nous avons du mal à le localiser et à l’arrêter. Nos agents l’ont trouvé dans un appartement à Berlin-Est, mais les autorités est-allemandes et soviétiques ont empêché notre accès pour le capturer, invoquant son “importance pour la cause socialiste” et la violation de leur souveraineté. Nous cherchons d’autres solutions pour contourner cela afin d’arrêter Reimann, que nous croyons coordonner la subversion communiste dans le pays. »\n\n« Très bien. Des idées ? Faisons le tour. »\n\nSpeidel commença. « Il est clair que c’est un problème d’accès – pourquoi ne pas passer par le Conseil de contrôle allié, ou les commandants des secteurs d’occupation alliés ? C’est un problème international qui peut se résoudre par la négociation. »\n\nManstein intervint. « Avec tout le respect pour le général Spiedel, la diplomatie ne nous mènera nulle part. Reinhard, tu sais aussi bien que moi que l’utilisation de nos moyens de renseignement et de nos forces militaires permettra de capturer Reimann plus efficacement que de discuter jusqu’à en perdre haleine, alors qu’il pourrait coordonner des attaques contre nous. Nous devrions coopérer avec les Alliés pour une opération d’extraction. »\n\nStumm et Herrlein hochèrent la tête. « Les deux idées sont réalisables, bien que la seconde soit plus risquée et mobiliserait davantage nos capacités. »\n\nGehlen acquiesça. « Merci messieurs. Cela dit, je pense que nous devrions… »"
 Gehlen.4.d: "C’était un matin pluvieux au Kammergericht lorsque deux VW Kübelwagen couvertes, décorées des insignes de la Bundeswehr, arrivèrent et se garèrent, les officiers à l’intérieur se précipitant, valises et pardessus en main.\n\nMarchant sur les sols en marbre du bâtiment, les officiers croisèrent des officiers américains, britanniques et français, tous ébahis, tandis qu’ils se dirigeaient vers une salle de conférence où leurs supérieurs étaient déjà assis.\n\nLorsque Gehlen et ses adjoints entrèrent, il serra la main du major général américain George B. Honnen, du lieutenant général britannique William Oliver, du général français Pierre Manceaux-Demiau et du major général soviétique Pyotr Dibrova. En s’asseyant, Gehlen commença, tandis que ses assistants distribuaient des documents.\n\n« Je sais que vous amener tous ici a dû être une surprise, et je n’ai certainement pas l’intention de créer des ressentiments parmi les autorités d’occupation, » dit-il en regardant Dibrova.\n\n« Cependant, il y a un problème que je suis sûr que vous savez tous devoir être traité. L’ancien chancelier communiste et agitateur Max Reimann, qui a commis trahison contre la République fédérale d’Allemagne, a demandé l’asile à Berlin-Est. Nous avons l’intention de le faire extrader et juger devant un jury de ses pairs. »\n\nDibrova, qui s’était retenu jusqu’alors, éclata.\n\n« Non ! Herr Reimann a le droit de rester où il est pour la sécurité du socialisme et comme protection contre des éléments fascistes tels que vous ! Nous ne tolérerons pas cela ; cette conversation est terminée. » Il sortit en trombe, laissant voler des papiers et claquant la porte derrière lui, ses bottes résonnant bruyamment vers Dieu sait où.\n\nGehlen regarda les autres officiers, qui semblaient également vouloir partir. « Nous pouvons sûrement obtenir votre aide pour cela ? Mes officiers m’ont assuré que la négociation est une solution bien meilleure que d’arrêter Reimann directement. »\n\nHonnen leva les yeux. « Général Gehlen, aussi désireux que nous soyons de garder Reimann en notre possession, il se trouve dans la zone d’occupation soviétique et nous n’avons aucun droit de l’y prendre. Les Soviétiques doivent le remettre, et s’ils veulent le garder, ils en ont le droit. Le mieux que nous puissions faire est d’envoyer un télégramme à nos gouvernements et espérer qu’ils émettent une protestation diplomatique pour la libération de Reimann, mais à moins que Dieu n’intervienne, il semble peu probable qu’ils le relâchent. Je suis désolé. » Les officiers britanniques et français hochèrent également la tête, abattus.\n\nGehlen fronça les sourcils, réfléchissant plus profondément. Il devait bien y avoir un moyen de résoudre cela."
 Gehlen.5.d: "L’opération suivante est conçue et destinée à extraire l’ancien chancelier et actuel président du KPD, Max Reimann, de Berlin-Est, afin de le ramener en République fédérale, où il sera emprisonné dans l’attente de son procès.\n\n1. Trois équipes d’agents seront transportées par avion à Berlin-Ouest et entreront ensuite à Berlin-Est via Checkpoint Charlie en se faisant passer pour un groupe d’hommes d’affaires et d’officiers militaires ouest-allemands en mission de liaison ordinaire. Ils changeront ensuite de vêtements pour se faire passer pour du personnel d’urgence et des forces de l’ordre est-allemands. Les trois équipes seront composées d’officiers du BND/MAD (Équipe Eins), d’officiers de la CIA (Équipe Zwei) et d’officiers de la police de Berlin/BKA (Équipe Drei).\n\n2. Les équipes se rendront au 179 Hellersdorfer Strasse à Berlin-Est, où se trouve la cible. Les équipes Eins et Zwei entreront dans le bâtiment, extrairont Reimann, l’endormiront à l’aide d’un médicament, le placeront sur une civière et le feront passer devant ses gardes du corps, après quoi il sera chargé dans un véhicule. En raison de l’urgence, l’équipe Drei assurera la sécurité extérieure face aux autorités soviétiques et à la Volkspolizei, tout en coupant les câbles téléphoniques et d’autres équipements de communication. L’équipe Drei reçoit l’ordre de se défendre si elle est prise pour cible et de viser d’abord les forces est-allemandes avant les autorités soviétiques afin de minimiser l’ampleur d’un incident international.\n\n3. Toutes les équipes devront, avec la plus grande célérité, retourner à Berlin-Ouest en justifiant que Reimann nécessite une hospitalisation immédiate dans un hôpital de la partie occidentale de la ville et que des responsables soviétiques arriveront sous peu. Reimann sera conduit au quartier général de la mission de liaison militaire américaine, où il sera détenu jusqu’à ce qu’un vol puisse être organisé pour ramener toutes les équipes à Bonn.\n\nNous avons une confiance modérée dans le succès de ce plan et dans le fait qu’il permettra l’extradition effective de Reimann, malgré l’indignation qui s’ensuivra de la part des autorités soviétiques et du bloc de l’Est.\n\nSIGNÉ\nGeneraloberst Erich von Manstein\nVice-président du Comité des officiers de la Bundeswehr ; Gouvernement militaire provisoire, Bureau du renseignement"
 Gehlen.6.d: "À : Generalleutnant Reinhard Gehlen, Comité des officiers de la Bundeswehr, Gouvernement militaire provisoire d’Allemagne\nDe : Bureau administratif de l’économie, Gouvernement militaire provisoire d’Allemagne\n\nObjet : Rapport sur l’état économique de la nation\n\nGénéral Gehlen,\n\nDepuis que notre administration a pris le pouvoir au détriment du gouvernement communiste il y a plusieurs mois, l’économie a été largement négligée derrière les affaires politiques et militaires. Cependant, notre bureau a préparé les recommandations suivantes pour stabiliser et développer l’économie allemande.\n\n1. Libération immédiate de toutes les usines de biens de consommation et de production automobile de la nationalisation gouvernementale, action ordonnée par le régime communiste.\n\n2. Réorganisation de la direction de nos entreprises de charbon et d’acier pour inclure des directeurs nommés par l’État et loyaux au régime.\n\n3. Fin immédiate de toutes les exportations de charbon vers la France et l’Allemagne de l’Est, comme protestation diplomatique contre le régime communiste illégitime.\n\n4. Interdiction de tous les syndicats, associations de travailleurs et autres organisations collectives, ainsi que rendre illégal le droit de grève avec de lourdes peines de prison.\n\n5. Demande aux États-Unis d’une aide économique supplémentaire du Plan Marshall ou d’une aide économique indépendante.\n\nNous espérons que ces mesures faciliteront le redressement rapide et la stabilité de l’économie allemande pour tous.\n\nSIGNÉ\nChef du Bureau administratif de l’économie, Gouvernement militaire provisoire d’Allemagne"
 Gehlen.7.d: "À : Generalleutnant Reinhard Gehlen, Comité des officiers de la Bundeswehr, Gouvernement militaire provisoire d’Allemagne\nDe : Inspecteur général des forces armées\n\nObjet : Plan de stabilité pour l’Allemagne\n\nGénéral Gehlen,\n\nEn tant qu’Inspecteur général des forces armées, mon bureau a la nouvelle responsabilité de déterminer la sécurité intérieure de l’Allemagne ainsi que les menaces internes à l’administration militaire. Voici quelques propositions à mettre en œuvre pour assurer la stabilité et la sécurité de l’Allemagne.\n\n1. Interdiction immédiate de la Kommunistische Partei Deutschlands (KPD) sous toutes ses formes dans le pays.\n\n2. Ouverture immédiate d’un procès pour Max Reimann pour haute trahison, qu’il soit en détention militaire ou absent.\n\n3. Dans ce cadre, ouverture de procès contre les membres et sympathisants du KPD, y compris des procès publics et télévisés.\n\n4. Expansion du Bundesnachrichtendienst (BND) pour inclure des membres de l’Organisation Gehlen, en centralisant les agences de renseignement en une seule agence avec pouvoirs exécutifs.\n\n5. Condamnation de toutes les formes d’antisémitisme, principalement pour montrer la politique de notre gouvernement envers les minorités.\n\nBien que certaines de ces propositions puissent sembler controversées, elles sont nécessaires pour garantir une Allemagne stable sans opposition intérieure.\n\nSIGNÉ\nInspecteur général des forces armées, Gouvernement militaire provisoire d’Allemagne"
 Gehlen.8.d: "Alors que le petit Hans rentrait de l’école, il lança son sac à dos contre une chaise et s’affala par terre, allumant la nouvelle télévision en noir et blanc de sa famille pour voir ce qui passait.\n\n« Comment plaidez-vous, Herr Schweppenstette ? »\n\n« Non coupable, Votre Honneur. »\n\nHans leva les yeux et vit un homme en désordre, vêtu d’une combinaison de prison, menotté et se tenant dans une cage en verre face au tribunal, flanqué de deux officiers de la Bundeswehr portant des casques de police militaire.\n\n« Vous êtes accusé de trahison envers le peuple allemand et d’avoir fomenté la résistance contre le Gouvernement militaire provisoire d’Allemagne. Ce tribunal vous déclare coupable et vous condamne à vingt ans de prison et travaux forcés. »\n\nBANG.\n\nSurpris, Hans se leva en sursaut, effrayé, et éteignit la télévision, tandis que sa mère entra dans la pièce, ayant été dans la chambre.\n\n« Chéri, que se passe-t-il ? »\n\n« Mutti, que se passe-t-il à la télé ? »"
 Gehlen.9.d: "« Peuple allemand ! »\n\nGehlen, vêtu de son uniforme d'apparat, se tenait debout sur la Marienplatz à Munich, face à une foule de plusieurs centaines de personnes et à un groupe de journalistes et de cameramen.\n\n« C'est un discours extrêmement difficile à prononcer, mais qui doit être fait. À quelques encablures d'ici, il y a plus de trente ans, Hitler et les nazis ont tenté un coup d'État contre l'État bavarois. Bien qu'il ait échoué, il a ouvert la voie au Troisième Reich qui, alors que moi-même et d'autres officiers servions sous ses ordres, a été une tache indélébile dans l'histoire de l'Allemagne. En particulier, la rhétorique antisémite associée au régime hitlérien, qui a entraîné la mort de centaines de milliers, voire de millions de Juifs innocents, est inadmissible. Le gouvernement militaire provisoire allemand, composé d'officiers de la Bundeswehr, condamne sans équivoque toute forme d'antisémitisme ou de discrimination à l'encontre des personnes d'origine juive. Nous sommes entrés dans une période de réconciliation dans ce pays et ce gouvernement s'engage à faire en sorte que les Juifs allemands puissent vivre en paix en Allemagne de l'Ouest. Danke schon. »\n\nLa foule est restée plutôt silencieuse pendant un moment, puis a commencé à applaudir lorsque Gehlen a quitté la scène. C'était un premier pas, et même s'il se sentait mal à l'aise de le faire, c'était un pas dans la bonne direction."
 Gehlen.10.d: "Alors que le juge enfilait sa robe, il ne voulait pas avoir à faire cela. En tant que juge civil, il se sentait mal à l’aise depuis que la junte, se faisant appeler le « Gouvernement militaire provisoire d’Allemagne », avait pris le pouvoir ; et maintenant, il devait superviser le procès de l’ancien Chancelier.\n\nEn entrant dans la salle d’audience, elle était vide, mais presque trop vide. Le juge vit les caméras de télévision au bout de la salle, la cage en verre vide où les précédents sympathisants communistes s’étaient tenus menottés, entourés par des officiers de la Bundeswehr MP au visage renfrogné. Ces officiers étaient présents, mais restaient sur les bords, fumant, avec peu d’autre chose à faire.\n\nLorsque l’horloge sonna dix heures, le procureur et le greffier entrèrent, et les trois consultèrent leurs papiers avant de commencer.\n\n« Ceci commence l’affaire Gouvernement militaire provisoire d’Allemagne contre Max Reimann par contumace. Herr Procureur, quelles sont les accusations ? »\n\n« Votre Honneur, le Gouvernement militaire provisoire d’Allemagne accuse Herr Max Reimann de trahison envers le peuple allemand, de subversion, d’agir comme agent étranger, d’avoir ordonné la surveillance et la persécution d’un grand nombre d’Allemands pendant son mandat de Chancelier, et d’être membre d’un parti politique interdit, le KPD. »\n\n« Herr Reimann, comment plaidez-vous ? »\n\nSilence, comme prévu.\n\n« Étant donné qu’il est jugé par contumace, ce tribunal présume sa culpabilité et le déclare coupable de toutes les accusations. »\n\nBANG.\n\n« Herr Reimann, vous êtes par la présente condamné à la réclusion à perpétuité. »\n\nBANG. BANG.\n\n« Le tribunal est levé. »\n\nAlors que les caméras s’éteignaient et que les gardes reprenaient leur posture normale, le juge resta assis un instant dans sa chaise, pensif. Pendant des années, il avait été un juriste accompli, mais maintenant, connu par certains comme un héros anti-communiste, et pour d’autres comme un traître de classe, un pantin des chiens fascistes au-dessus de lui."
 Gehlen.11.d: "« Délégués estimés des Nations Unies ! »\n\nGehlen se tenait debout, droit sur le podium en pierre, comme à son habitude en uniforme de cérémonie. C’était une occasion pour le peuple allemand de se racheter, et le général devait s’assurer que tout se passe correctement.\n\n« C’est un jour important pour toutes les nations libres du monde. Bien que l’Allemagne ne soit qu’un État observateur au sein de cet organe, j’ai l’honneur de prendre la parole ici aujourd’hui. »\n\n« Ces dernières années dans la République fédérale ont été véritablement bouleversantes pour tous. De zones d’occupation, à un Chancelier communiste quasi autoritaire, jusqu’à la libération par la Bundeswehr, le peuple allemand a traversé beaucoup de choses depuis la fin de la Seconde Guerre mondiale. »\n\n« Mes officiers et moi voulons clarifier notre rôle dans la gouvernance de l’Allemagne. Nous sommes des dictateurs bienveillants, pour préserver la stabilité de la République fédérale contre l’infiltration communiste et pour inscrire l’idéologie démocratique et anti-communiste pour tous. Pour tous ceux qui s’opposent à nous, soyez prévenus, nous avons des alliés puissants et une force militaire capable prête à tout pour défendre notre sol. Merci à tous pour votre attention. »\n\nBref et concis. En descendant de la scène, il ne put entendre qu’environ la moitié de la salle applaudir, et, fixant la délégation soviétique, il retourna à sa place. Ce n’était que le début."
 Gehlen.12.d: "ORDONNANCE DU GOUVERNEMENT MILITAIRE PROVISOIRE N° 17\n\nBONN, ALLEMAGNE\n\nPOLITIQUE RELATIVE À L’ACCORD DE RÉUNIFICATION DE 1953 AVEC L’ALLEMAGNE DE L’EST\n\nCondamnant les actions perpétrées par l’ancien régime communiste du Chancelier Max Reimann, incluant la subversion, la surveillance et la persécution des civils,\n\nPrenant note de la soi-disant « Conférence de Berlin » et de l’« Accord de Réunification de 1953 » proposé et signé entre la République fédérale d’Allemagne, la République démocratique allemande et l’Union des républiques socialistes soviétiques,\n\nPrenant note de l’inquiétude exprimée par la communauté nationale et internationale concernant la légalité de cet accord,\n\nLe Comité des officiers de la Bundeswehr déclare ce qui suit :\n\n1. L’accord connu sous le nom d’« Accord de Réunification de 1953 » est considéré comme illégitime et inapplicable par le Gouvernement militaire provisoire d’Allemagne et tous les fonctionnaires travaillant sous son autorité, et est par la présente déclaré nul et non avenu.\n\n2. Aucune telle unification entre la République fédérale d’Allemagne et la République démocratique allemande ne devra avoir lieu pendant la durée du Gouvernement militaire provisoire d’Allemagne, ni tant que la République démocratique allemande continuera d’avoir un régime communiste autoritaire répressif.\n\n3. La République fédérale d’Allemagne reste signataire de tous les autres traités internationaux auxquels elle a adhéré et examinera tout autre traité bilatéral ou multilatéral au fur et à mesure de leur discussion.\n\nSIGNÉ\nGeneralleutnant [WGR.GetLeader]\nPrésident, Comité des officiers de la Bundeswehr, Gouvernement militaire provisoire de la République fédérale d’Allemagne"
 Gehlen.13.d: "BONN (AP) - Le dirigeant espagnol et généralissime Francisco Franco s'est rendu aujourd'hui dans la capitale de l'Allemagne de l'Ouest, où il a été chaleureusement accueilli par Erich von Manstein, Reinhard Gehlen et Hans Speidel, tous membres de l'état-major militaire ouest-allemand. Après avoir assisté à une somptueuse réception diplomatique organisée par le petit bureau des affaires étrangères du gouvernement militaire, Franco et ses adjoints ont entamé des discussions diplomatiques avec Gehlen et ses officiers, signant un communiqué sur le renforcement des relations bilatérales entre l'Allemagne de l'Ouest et l'Espagne. Les relations entre les deux pays étant tendues depuis la Seconde Guerre mondiale, cette évolution reflète la nouvelle politique étrangère de la junte ouest-allemande, qui cherche à resserrer ses liens avec des pays comme l'Espagne, dotés de gouvernements militaires anticommunistes similaires."
 Gehlen.14.d: "« Le communisme est une idéologie qui entache le monde, une idéologie qui ne fait que réapproprier le fascisme pour en faire une idéologie de gauche « pour le peuple », qui aboutit à ce que celui-ci soit gouverné par une dictature autoritaire. »\n\n« Ceux qui prétendent que ce gouvernement n'est pas meilleur se trompent. Ce gouvernement est composé de militaires, de fiers anticommunistes, d'hommes dévoués à la sécurité de l'Allemagne contre la subversion communiste et la propagation de leur idéologie cancéreuse et de leur système économique à travers l'Europe et le monde. Oui, il a été nécessaire de suspendre certaines mesures gouvernementales, mais uniquement dans le but exprès d'empêcher ces institutions d'être détournées par les communistes et la gauche, qui préfèrent exploiter des institutions démocratiques parfaitement fonctionnelles pour servir leurs désirs autoritaires. »\n\n« Karl Marx n'est pas un vrai Allemand. Beaucoup d'Allemands sont fiers d'être des catholiques conservateurs et craignant Dieu, des Allemands qui préfèrent le capitalisme et son innovation pour la croissance économique aux systèmes économiques centralisés où les citoyens se voient imposer où travailler et combien de temps travailler, pour fabriquer des produits défectueux et être payés quelques centimes par dollar aux pays occidentaux. »"
 Gehlen.15.d: "Alors que Szabo, âgé de 5 ans, avançait péniblement sur le chemin de terre, il était fatigué et avait faim, pensait-il. Levant les yeux vers sa mère Marton, qui portait son frère Miksa, il espérait qu'ils étaient proches. Ils traversaient la Tchécoslovaquie depuis des jours, fuyant la violence et la mort qui sévissaient à Budapest. Personne ne parlait, chacun était plongé dans ses pensées.\n\nTout en fumant une cigarette, Helmut passa son Gewehr en bandoulière, tirant de temps à autre une bouffée, le regard fixé sur la frontière tchèque. Il avait été déployé dans la petite ville de Furth im Wald pour des exercices, mais avait été affecté à la surveillance de la frontière contre les forces communistes en Tchécoslovaquie. Malgré ce que lui avait dit son commandant, la frontière était calme comme d'habitude à la tombée de la nuit. Ils avaient été avertis que davantage de réfugiés fuyaient l'Est en raison d'une sorte de soulèvement en Hongrie. Helmut ne savait même pas situer Budapest sur une carte, mais il avait vu des photos des T-54 patrouillant dans les rues et des soldats soviétiques engagés dans de violents combats.\n\nAlors qu’il déposait les restes de sa cigarette dans un cendrier et prenait une paire de jumelles, Helmut put voir deux silhouettes au loin – une mère et un enfant, peut-être ?, pensa-t-il.\n\nSe déplaçant hors de la guérite pour mieux voir, il y avait une mère et un enfant, ainsi qu’un bébé, et une poussette remplie de leurs affaires. Réveillant les deux autres soldats, Thomas et Artur, les trois se mirent en mouvement, l’un prenant le radio pour appeler des renforts depuis leur caserne.\n\nAlors que Szabo continuait de marcher aux côtés de sa mère, il commença à apercevoir le passage frontalier, décoré d’un grand aigle dans l’emblème ouest-allemand, et une grande porte fortifiée. Il y avait trois soldats, deux d’entre eux avec des fusils, lui parlant dans une langue inconnue. Marton commença à s’exprimer à mesure qu’ils approchaient de la porte, et tandis que les soldats semblaient effrayés, ils tenaient leurs armes avec précaution.\n\n« Réfugié ! Menekült ! »\n\n« Haut les mains ! Halt ! » Les deux Hongrois levèrent instinctivement les mains, alors qu’Helmut s’avançait vers eux, épaulant son fusil un instant.\n\nSe retournant, le soldat allemand cria quelque chose aux autres, que Marton pouvait voir. Ils portaient d’anciens casques Stahlhelm, presque impossible à oublier en Europe, pensa-t-elle, tandis qu’ils levaient la barrière et les faisaient entrer, elle et Szabo, avec leurs affaires. Ils étaient enfin libres, pensa-t-elle, alors qu’ils peinaient à communiquer avec les Allemands, qui faisaient de leur mieux pour cacher leur nervosité."
 Gehlen.16.d: "Les citoyens ouest-allemands moyens se sont réveillés aujourd'hui avec des troupes de la Bundeswehr activement déployées dans leurs communautés, dans le cadre d'un plan de déploiement massif approuvé par le gouvernement militaire provisoire. Qualifié par un porte-parole du gouvernement de « mesure dissuasive et anti-subversion », ce plan prévoit que toutes les grandes villes, y compris Hambourg, Munich, Francfort, Cologne, Bonn et Nuremberg, soient gardées par au moins une division de soldats, soit environ 8 000 hommes chacune. Composées principalement de soldats d'infanterie ou d'infanterie mécanisée formés au combat urbain et au maintien de l'ordre militaire, ces forces ont conservé leur mission habituelle de maintien de l'ordre dans les rues et d'installation de barrages routiers autour des grandes places, des bâtiments gouvernementaux, des infrastructures de transport et d'autres infrastructures vitales, en cas d'attaque terroriste communiste ou d'autres oppositions. Décrit comme une partie seulement du vaste programme de contre-insurrection du gouvernement militaire, ce déploiement devrait se poursuivre indéfiniment, jusqu'à ce que le gouvernement puisse s'assurer que toutes les villes et communautés sont sécurisées."
 Gehlen.17.d: "DE : Commandant, Commandement du Iᵉʳ Corps, Bundeswehr\nÀ : Generalleutnant Reinhard Gehlen, Président du Comité des officiers de la Bundeswehr, Gouvernement militaire provisoire d’Allemagne\n\nOBJET : Les réseaux communistes clandestins\n\nHerr General,\n\nJe suis heureux de signaler que les opérations de contre-insurrection contre les organisations communistes restantes se sont conclues par l’arrestation et l’exécution réussies de plusieurs dirigeants, y compris des cellules à Hambourg, Francfort, Munich et Bonn. Bien que certains membres de la Bundeswehr aient été tués ou blessés, nous estimons que ces chiffres restent faibles comparés au nombre d’arrestations et de décès de membres militants communistes.\n\nLes séparatistes restants sont toujours sous la garde de la Bundeswehr et attendent leur procès public.\n\nLe personnel de la Bundeswehr continue d’effectuer des patrouilles de sécurité périodiques autour des zones préoccupantes et de surveiller le renseignement en collaboration avec le BND et la Police fédérale.\n\nSIGNÉ\nCommandant, Commandement du Iᵉʳ Corps, Bundeswehr"
 Gehlen.18.d: "Bien qu’Hans détestât normalement le cours d’histoire, il le trouva plus divertissant aujourd’hui avec l’arrivée d’un nouvel élève dans sa classe : un garçon hongrois qui avait fui. Hans n’avait aucune idée de pourquoi ni comment il était arrivé là, mais tout ce qu’il savait, c’était que le garçon, nommé Szabo, ne parlait pas très bien l’allemand et était en train d’apprendre, ce qui provoquait la colère et les moqueries de ses camarades.\n\nRegardant un nouveau manuel sur son bureau, Hans s’assit, posa son sac, alors que la classe commençait, avec un homme plus âgé à l’air sévère, le professeur, qui entra et ferma la porte.\n\n« Guten Morgen, Kinder ! »\n\n« Guten Morgen, Herr Professor ! » répondit la classe en chœur.\n\n« Tournez à la page 30 de vos livres, enfants. Commençons la leçon. »\n\nHans tourna la page avec application, où plusieurs images en couleur de généraux de la Wehrmacht et de responsables nazis apparaissaient, y compris Hitler, Goering et Rommel. C’était la partie du cours qu’Hans détestait, où les enfants devaient lire pendant que le professeur attendait.\n\n« Le régime national-socialiste, bien que responsable de l’autoritarisme et de nombreuses morts, fut également important pour le développement de l’Allemagne sur la scène mondiale et la reconstruction de l’industrie et de la société après la fin de la Première Guerre mondiale. Bien que l’antisémitisme et le racisme effréné du NSDAP, qui culmina avec l’emprisonnement de centaines de milliers de minorités, ils furent aussi responsables de la création du réseau autoroutier Autobahn, de la voiture Volkswagen, du soda Fanta, et de l’expansion de la glorieuse armée allemande qui protège nos frontières et notre sécurité intérieure. »"
 Gehlen.19.d: "« Peuple d’Allemagne ! Mes concitoyens ! Il est temps de discuter d’un sujet que j’ai repoussé depuis longtemps maintenant, un sujet qui doit être abordé. Notre gouvernement est parvenu officiellement à un consensus : l’Holocauste doit être pris en compte. »\n\nIl fit alors une pause suffisamment longue pour que le caméraman lui lance un regard.\n\n« Les atrocités commises par le régime national-socialiste, dont certains d’entre nous peuvent porter une certaine complicité, furent incommensurables. On ignore encore combien d’innocents sont morts, mais on estime leur nombre à plusieurs millions. »\n\n« Nous sommes accusés d’être des fascistes ; de vouloir ramener le national-socialisme en Allemagne, pour commencer un Quatrième Reich. Ce n’est pas vrai. Oui, de nombreux officiers de ce gouvernement étaient d’anciens officiers national-socialistes et de la Wehrmacht ayant porté une certaine complicité pour les soi-disant “crimes de guerre” durant la Seconde Guerre mondiale. Cependant, nous sommes des autoritaires bienveillants. Ce régime prendra fin lorsque la menace communiste en Allemagne sera éradiquée, lorsque le virus de l’agression soviétique cessera d’infecter notre population. »\n\n« Ce gouvernement et la Bundeswehr dans son ensemble condamnent formellement et sans équivoque l’Holocauste et toutes les formes de génocide sous toutes leurs formes, en particulier contre les minorités sur la base de leur race ou de leur religion. Ce n’est pas ce que nous voulons ; en fait, tous les Allemands devraient s’unir contre cet idéal maléfique. Les temps ont changé dans ce pays, et nous sommes au bord d’un nouveau moment pour l’Allemagne. Merci à tous. »\n\nAlors que les caméras de télévision se coupaient à nouveau, Gehlen s’essuya la sueur du front et quitta le podium. C’était presque aussi pénible que le discours public contre l’antisémitisme, mais c’était nécessaire, même si cela attirait la colère de certains membres du comité."
 Manstein.1.d: "ORDRE DU GOUVERNEMENT MILITAIRE PROVISOIRE N° 2\n\nBONN, ALLEMAGNE, [GetDateText]\n\nPOLITIQUE RELATIVE AUX MÉMORIAUX DE L’HOLOCAUSTE\n\nReconnaissant les allégations de génocide portées contre le régime national-socialiste concernant la soi-disant « extermination des populations juives » ;\n\nConstatant avec préoccupation les efforts visant à vilipender et condamner le régime national-socialiste pour leurs actions apparentes, sans aucune présentation équitable de leur perspective ;\n\nConscient des efforts pour construire des « musées et mémoriaux de commémoration de l’Holocauste », y compris ceux proches des anciens camps de « prisonniers » ;\n\n1. Tous les musées, expositions ou monuments liés à l’Holocauste sont par la présente interdits sur le territoire de la République fédérale d’Allemagne.\n\n2. Toute discussion sur les supposées atrocités du régime national-socialiste sera soumise à l’examen du Bureau des Relations Publiques du Gouvernement Militaire Provisoire.\n\n3. Toute future exposition, musée ou mémorial sera soumis à l’examen du Bureau de la Préservation Historique du Gouvernement Militaire Provisoire et sera tenu de fournir une représentation équitable du régime national-socialiste et de ses réalisations dans tous les cas.\n\nSIGNÉ\nGeneraloberst Erich von Manstein\nPrésident, Comité des Officiers de la Bundeswehr, Gouvernement Militaire Provisoire de la République fédérale d’Allemagne"
 Manstein.2.d: "Alors que la caméra tournait autour de lui, se dirigeant vers le podium, Manstein ajusta son uniforme, s'assurant qu'il n'y avait pas de plis ou de froissures soudains qui pourraient abîmer son uniforme de général de la Bundeswehr, parfaitement lisse et désormais modifié. Jetant un œil au bout de papier, il s'éclaircit une nouvelle fois la gorge avant que le voyant rouge ne clignote, et, recevant un signe de tête du caméraman, il commença.\n\n« Bonsoir, peuple allemand. J'ai le plaisir de vous annoncer ce soir que le Bureau judiciaire du gouvernement militaire provisoire a pris les décisions suivantes concernant les accusés du procès truqué de Nuremberg pour crimes de guerre en 1945. Les accusés suivants, encore en vie, sont graciés et leur libération est ordonnée : Karl Donitz, ancien commandant de la Kriegsmarine ; Walther Funk, ancien ministre de l'Économie et directeur de la Reichsbank ; Rudolf Hess, ancien adjoint du Führer ; Konstantin von Neurath, ancien ministre des Affaires étrangères et protecteur du Reich de Bohême et de Moravie ; Erich Raeder, ancien commandant de la Kriegsmarine avant 1943 ; Baldur von Schirach, ancien chef des Jeunesses hitlériennes et Gauleiter de Vienne ; et Albert Speer, ancien ministre de l'Armement. En outre, une grâce posthume sera accordée aux autres accusés qui ont été pendus sans motif et sans pitié par les forces d'occupation alliées. Merci et bonne nuit. »\n\nAlors que la lumière s'éteignait, Manstein ne pouvait qu'imaginer les réactions, tant des Allemands ordinaires que des Alliés. Il s'occuperait d'eux bien assez tôt."
 Manstein.3.d: "« Qui est vraiment responsable des problèmes auxquels l'Allemagne est confrontée aujourd'hui ? Ce ne sont pas les nazis, Mesdames et Messieurs, mais les forces d'occupation alliées qui leur ont succédé. »\n\nUn faible bourdonnement commença à parcourir la salle, tandis que les officiers militaires et les bureaucrates réunis pour assister à la conférence se mirent à murmurer entre eux.\n\n« Soyons clairs, les soi-disant Alliés, tant les trois puissances occidentales que l'Union soviétique, ont commis leur part d'atrocités contre l'État allemand et le peuple allemand dans leur marche vers la victoire et l'impérialisme de notre territoire. Ils ont détruit nos maisons et nos entreprises, violé et tué nos proches, et nous ont privés de nos moyens de subsistance. Les bombardements stratégiques britanniques et américains sur Hambourg, Cologne et Francfort ont causé la mort de milliers de civils, sans que personne n'ait à rendre de comptes après la guerre. Et maintenant, ils divisent l'Allemagne et exigent que nous nous pliions à leur volonté ! Des deux côtés, mais surtout du nôtre ! Pourquoi les puissances alliées ont-elles permis l'élection d'un communiste ? Sans la puissance de la Bundeswehr et de nos grands patriotes allemands, ce pays serait unifié sous la menace communiste, contrôlé par la horde des Russes impérialistes et sanguinaires. »\n\nApplaudissant, les officiers ont applaudi, continuant à prendre des notes et à discuter entre eux.\n\n« Nous ne pouvons pas changer le passé, mais nous pouvons contrôler la perception que nous en avons. En rejetant davantage la responsabilité sur les Alliés, au lieu de les tenir en haute estime en permanence, nous aurons une perspective plus large et pourrons raconter l'histoire des civils, des membres de nos familles qui ont péri de leurs mains. Même si nous restons des alliés nominaux de l'Occident, nous ne pouvons oublier les atrocités qu'ils ont commises à notre encontre. Merci à tous et bonne nuit. »\n\nLa salle a éclaté en applaudissements lorsque le conférencier, un officier de la Bundeswehr, a quitté la scène."
 Manstein.4.d: "CONFIDENTIEL\n\n[GetDateText]\n\nÀ : Generaloberst Erich von Manstein, Comité des Officiers de la Bundeswehr, Gouvernement Militaire Provisoire d’Allemagne\nDE : Commandement du Bundesgrenzschutz, Gouvernement Militaire Provisoire d’Allemagne \n\nOBJET : Rapport sur la Défense de la Frontière Intérieure Allemande\n\nGénéral von Manstein,\n\nDepuis que le Comité des Officiers a pris le pouvoir sur l’ancien régime communiste, la frontière intérieure allemande est un point de tension qui reste une zone contestée à ce jour et sujette à l’infiltration communiste depuis l’est. Les plans suivants sont recommandés pour renforcer la sécurité de notre frontière.\n\n1. Trois groupes supplémentaires de protection des frontières doivent être formés, entraînés et déployés aux points vulnérables clés, y compris Fulda et d’autres zones susceptibles d’être attaquées en cas d’incursion.\n\n2. Le Commandement du Bundesgrenzschutz formera plusieurs groupes de Force de Réaction Rapide (QRF), lourdement armés et stationnés à tous les points de passage, avec ordre d’engager tout ennemi.\n\n3. Une consultation supplémentaire avec les forces alliées est nécessaire pour permettre à la Bundeswehr ainsi qu’aux forces américaines et britanniques d’entrer dans la zone frontalière sans harcèlement par les unités des Grenztruppen est-allemandes.\n\n4. Les unités du Bundesgrenzschutz utiliseront toutes les ressources disponibles pour construire des miradors, des « bandes de la mort » supplémentaires, des nids de mitrailleuses et des installations de surveillance.\n\n5. Après approbation de cet ordre, tout le personnel du Bundesgrenzschutz recevra l’ordre de tirer sur toute personne entrant dans la République fédérale d’Allemagne sans raison légale valable.\n\nNous espérons que ces mesures de sécurité supplémentaires renforceront notre sécurité intérieure et démontreront notre volonté de tenir toutes les forces communistes à l’écart de la République fédérale.\n\nSIGNÉ\nCommandant, Commandement du Bundesgrenzschutz, Gouvernement Militaire Provisoire d’Allemagne"
 Manstein.5.d: "CONFIDENTIEL\n\n[GetDateText]\n\nÀ : Commandants, I Corps, II Corps, III Corps et IV Corps, Commandement de la Bundeswehr ; Bureau de l’Inspecteur Général, Commandement de la Bundeswehr ; Bureau du Commandant, Commandement de la Bundesmarine ; Bureau du Commandant, Commandement de la Luftwaffe ; Service fédéral de renseignement (BND), Service de renseignement et de contre-espionnage militaire (MAD)\nDE : Comité des Officiers de la Bundeswehr, Bureau du Renseignement du Gouvernement Militaire Provisoire\n\nOBJET : Exercice de guerre SCHWARZ - Plan opérationnel\n\nGénéraux,\n\nVoici le plan d’opération pour l’Exercice de guerre Schwarz, avec pour objectif central le maintien de l’état de préparation opérationnelle de la Bundeswehr et la responsabilité de conserver une capacité adéquate contre toute incursion communiste en Europe centrale.\n\n1. Tous les commandements de corps de la Bundeswehr, unités navales et escadrons de la force aérienne commenceront des exercices d’entraînement à grande échelle dans leurs zones de responsabilité, jusqu’à et y compris à une (1) mile de la frontière intérieure allemande et de la frontière allemande-tchèque.\n\n2. Des munitions réelles et des explosifs doivent être utilisés dans ces exercices, bien que la formation spécifique et les horaires soient déterminés par les commandants d’unité en coopération avec le Comité des Officiers.\n\n3. En cas de résistance de la part du personnel militaire ou des responsables américains, britanniques ou français, adresser toutes les plaintes au Comité des Officiers. Il s’agit d’une opération unilatérale sans interférence de l’OTAN, et les commandants d’unité ont l’ordre d’utiliser toutes les stratégies disponibles pour empêcher toute interférence de forces étrangères.\n\n4. Les unités de renseignement ont l’ordre de déterminer la perception de l’exercice par les forces occidentales ainsi que par les forces est-allemandes et soviétiques. Toutes les stratégies visant cet objectif sont approuvées.\n\n5. Le Comité des Officiers ordonne par la présente au Bureau des Relations Publiques du Gouvernement Militaire Provisoire d’Allemagne d’enregistrer, produire et distribuer les images des exercices, disponibles pour le public et pour l’étranger.\n\nSIGNÉ\nGeneraloberst Erich von Manstein\nPrésident, Comité des Officiers de la Bundeswehr ; Gouvernement Militaire Provisoire d’Allemagne"
 Manstein.6.d: "À l’extérieur de l’immense campus du bâtiment IG Farben, deux voitures exécutives Mercedes-Benz W120 noir jais se garèrent à l’entrée. Manstein, accompagné de ses adjoints Hans Speidel et Adolf Heusinger, ainsi que d’une pléthore d’officiers d’état-major, descendit, leurs bottes claquant sur le trottoir en approchant de l’entrée, serrant la main d’un officier d’état-major américain venu les accueillir.\n\n « Bienvenue au bâtiment du quartier général, Commandement américain en Europe, Général von Manstein. » Sourire léger, Manstein déclara en regardant ses collègues derrière lui. « Il portait un nom différent la dernière fois que je suis venu ici, Lieutenant. »\n\nL’Américain rit légèrement. « Oui, monsieur. On nous a dit de ne plus l’appeler ainsi, dorénavant, nous l’appelons le Pentagone de l’Europe. »\n\nCela provoqua un petit rire chez certains, mais Manstein et ses officiers restèrent silencieux, tandis qu’ils traversaient le vaste bâtiment jusqu’à une salle de conférence. En entrant, Manstein serra la main de chacun des commandants présents, y compris deux Américains, un Britannique et un Français.\n\nLe plus haut gradé américain, le Général Alfred Gruenther, prit la parole. « Merci d’être venus nous rencontrer, Général Manstein. C’est un plaisir d’entendre enfin quelqu’un du Comité des Officiers. »\n« De même, Général. Maintenant, passons aux affaires. »\n\n« Oui, Général Manstein. Nos supérieurs s’inquiètent de vos positions en politique étrangère, maintenant que vous avez pris le pouvoir de l’ancien régime communiste. Nous voulons nous assurer que vos intérêts correspondent aux nôtres, et que les Alliés puissent aider l’Allemagne de toutes les manières possibles. » L’officier britannique hocha la tête, tandis que l’officier français fixait le sol.\n\nErich regarda autour de lui, hochant la tête vers Speidel et Heusinger avant de prendre la parole. « Généraux, il n’y a rien à craindre. Je n’avais aucune mauvaise intention dans ma rhétorique précédente concernant les atrocités des Alliés pendant la guerre. Cela visait à amener le peuple allemand à nous soutenir, tout en faisant porter la responsabilité sur les Soviétiques. Cependant, vous devez admettre que vos pays furent responsables de la mort de nombreux civils. »\n\nL’officier subalterne, commandant de l’US Army Europe, intervint. « Général Manstein, bien que nous appréciions votre clarification maintenant, il est primordial que l’Ouest reste uni face aux Soviétiques. Vous ne pouvez pas nous condamner pour des actions que nous aurions pu entreprendre contre les nazis. »\n\n« Je peux, et je le ferai. Soyons clairs. Le Comité des Officiers promulguera ce qu’il souhaite, en tant que gouvernement de l’Allemagne. Vos pays soutiennent notre autorité, maintenant laissez-nous faire ce que nous voulons. »\n\nLes bottes claquant à nouveau, les officiers parurent déconcertés lorsque la porte se referma avec fracas, les Allemands partis."
 Manstein.7.d: "Alors que le policier militaire américain tournait au coin de la rue, son fusil en bandoulière, il laissa tomber sa cigarette allumée sous le coup de la surprise, lorsque deux Mercedes noires le dépassèrent à grande vitesse, arborant des drapeaux allemands sur leur capot. Trois secondes plus tard, un petit camion camouflé passa à toute vitesse, avec ce qui semblait être des soldats au volant. Il sauta dans sa Jeep de patrouille et contacta le quartier général par radio, mais on lui répondit qu'« une visite diplomatique était prévue et qu'il n'y avait pas lieu de s'inquiéter ». Insatisfait, il se mit à suivre le cortège à distance.\n\nAlors que Manstein et Speidel sortaient de leur voiture à la Rathaus Schoneberg, siège du maire de Berlin-Ouest et du Sénat de Berlin-Ouest. Au moment où il passait, le camion derrière eux déposait deux escouades de soldats armés de la Bundeswehr, qui se mirent rapidement en place pour former un périmètre et sécuriser la zone. Serrant la main du maire, Manstein échangea quelques mots avant que le cortège ne redémarre, se rapprochant de plus en plus de la zone soviétique.\n\nEn approchant de la porte de Brandebourg, le cortège s'est arrêté près de la Pariser Platz, répétant une nouvelle fois la procédure, provoquant un peu plus de stupéfaction chez les piétons locaux qui observaient la scène, ainsi que chez le policier militaire américain qui les avait suivis.\n\nIl regarda un soldat muni d'un appareil photo apparaître, tandis que Manstein et le maire de Berlin-Ouest se tenaient côte à côte, souriants.\n\n« Nous affirmons le contrôle de Berlin par l'Allemagne de l'Ouest et exhortons toutes les parties alliées à renoncer immédiatement à leurs revendications sur Berlin, car il s'agit d'un territoire allemand légitime. Toute tentative du régime illégitime de l'Allemagne de l'Est, contrôlé par ses maîtres soviétiques, de nous prendre notre territoire sera réprimée par une force écrasante. Que cela serve d'avertissement. C'est tout. »\n\nAlors que le soldat armé d'un appareil photo éteignait celui-ci et s'éloignait, le groupe fut approché par plusieurs policiers est-allemands et un officier soviétique. Le GI américain reprit sa radio pour les informer de la situation, mais sans s'impliquer. Les tensions à Berlin ne feraient que s'intensifier à partir de là."
 Manstein.8.d: "Aux dirigeants gouvernementaux de la soi-disant « République démocratique allemande », désormais considérée dans le monde entier comme un État fantoche illégitime de l'Union soviétique,\n\nVous connaissez sans doute les sentiments et les intentions de la République fédérale envers votre pays et ses revendications de souveraineté. Notre pays et notre peuple ont clairement exprimé leur position sur le communisme, et il est évident que nous ne laisserons pas les forces maléfiques, communistes et sanguinaires s'interposer entre une Allemagne unifiée, capitaliste et ouverte à tous.\n\nQue cela serve d'avertissement au gouvernement fantoche de la RDA : la République fédérale, sous ma direction du Comité des officiers et grâce à la force et aux capacités de la Bundeswehr, unifiera de force cette grande nation qu'est l'Allemagne.\n\nC'est votre dernière chance de parvenir à un règlement pacifique. La République fédérale acceptera l'annexion de la RDA à condition que toute trace de communisme disparaisse. Nous sommes prêts à nous asseoir à la table des négociations, mais nos forces sont prêtes à frapper. Nous sommes prêts.\n\nSIGNÉ\nGénéral Erich von Manstein\nPrésident du Comité des officiers de la Bundeswehr, gouvernement militaire provisoire de l'Allemagne"
 Manstein.9.d: "C'était un jour pluvieux, et Manstein était assis dans son bureau, des télégrammes éparpillés sur son bureau, des cigarettes encore allumées dans le cendrier, et les téléphones qui sonnaient sans arrêt, tant à l'intérieur qu'à l'extérieur du bureau. Il savait exactement pourquoi : la déclaration aux Allemands de l'Est avait été rendue publique, et malgré ses souhaits, les Alliés occidentaux et les Soviétiques perdaient tous la tête. Il n'avait pas parlé aux autres généraux depuis qu'il avait envoyé la déclaration et ne s'attendait pas à une réponse positive. Alors qu'il prenait un stylo pour dicter une nouvelle série d'ordres à la Bundeswehr, qui était en état d'alerte, Manstein fut surpris d'entendre du bruit à l'extérieur de son bureau, puis la porte s'ouvrir brusquement.\n\nLe général Hans Spiedel, l'un de ses adjoints, se tenait debout, une main sur son étui à pistolet, l'autre tenant une liasse de papiers dactylographiés. Derrière lui se tenait un lieutenant accompagné d'une escouade complète de soldats de la Bundeswehr, tous armés.\n\n« En vertu des pouvoirs qui me sont conférés par la Bundeswehr et le gouvernement militaire provisoire allemand, je vous place, Erich von Manstein, en état d'arrestation pour mise en danger délibérée, négligence, trahison et violation du droit militaire allemand. Vous serez déchu de votre grade et détenu jusqu'à ce que votre procès pénal ait lieu. »\n\n« Hans. Tu ne peux pas faire ça. Cette déclaration n'était qu'un avertissement. »\n\n« Tu as mis la Bundeswehr en état d'alerte, bon sang, Erich ! Tu sais combien de liaisons militaires des Alliés occidentaux m'ont cassé les couilles aujourd'hui ? Tu as menacé de provoquer une guerre ! »\n\n« J'avais mes raisons. Je pensais que tu étais avec moi jusqu'au bout, mais apparemment non. Tu n'es pas meilleur que ces communistes maléfiques, impies et sanguinaires dont nous devons débarrasser le monde. »\n\nSpeidel, ignorant le commentaire, se tourna vers le lieutenant de la Bundeswehr. « Fouillez-le, confisquez toutes ses armes et menottez-le. Vous connaissez la procédure, emmenez-le à la caserne et, pour l'amour de Dieu, ne laissez pas le prisonnier sans surveillance. »\n\n« Jawohl, Herr General. » L'officier salua avant de faire signe à ses hommes d'avancer. Ceux-ci s'empressèrent de sécuriser la pièce, confisquèrent le pistolet de Manstein et le conduisirent menotté hors de la pièce. Speidel, cependant, resta. Il savait que le pays allait être en proie à l'agitation, mais il fallait d'abord passer quelques coups de fil."
 Speidel.0.d: "Alors que les officiers et leurs assistants se pressaient dans la salle de conférence, une atmosphère de suspicion régnait. La plupart des officiers supérieurs fumaient pour soulager leur stress et, en attendant Speidel, ils discutaient entre eux, échangeant des anecdotes, des opinions et des notes.\n\nLorsque le général Hans Speidel entra, le silence se fit dans la pièce, les officiers le regardant avec incrédulité.\n\n« Bonjour, messieurs. Merci d'être venus si rapidement. Nous avons beaucoup à discuter. »\n\nAssis en bout de table, Speidel fit signe de fermer la porte, et les policiers militaires quittèrent rapidement la pièce.\n\n« Comme vous le savez tous, le président von Manstein a été arrêté plus tôt dans la journée pour trahison, négligence et mise en danger délibérée. Il est détenu par la police militaire dans un lieu tenu secret. Depuis ce matin, je suis en pourparlers avec les représentants alliés. Ils ont approuvé l'arrestation de Herr Manstein et m'ont officiellement encouragé à prendre la tête du Comité pour une durée indéterminée, jusqu'à ce que le pays soit stabilisé. Cependant, je leur ai répondu que je devais obtenir l'accord du Comité avant que toute décision ne puisse être légitimée. »\n\nLe silence continua de régner dans la pièce, avant que le général Adolf Heusinger ne prenne la parole. « Herr Général, votre leadership en tant que vice-président du Comité a été admirable. Cependant, je pense qu'en tant qu'officiers, nous avons des sentiments mitigés quant au sort de Herr Manstein. S'il est vrai que ses actions auraient provoqué un conflit, je ne suis pas sûr que l'arrestation et l'éviction effective de Herr Manstein stabiliseraient ce Comité. » Certains des autres officiers acquiescèrent d'un signe de tête.\n\n« Je vous remercie, général Heusinger, mais je pense que mon leadership en tant que président par intérim sera un atout. L'objectif ultime à l'heure actuelle est de calmer la population, ainsi que nos bienfaiteurs que nous avons aliénés à Washington et à Londres. Nous devons réaffirmer notre légitimité. »\n\n« Très bien, Herr Speidel. Je pense que cette commission reconnaît le travail que vous avez accompli jusqu'à présent et est disposée à vous confirmer dans vos fonctions de président par intérim jusqu'à ce que le pays soit stabilisé. Merci pour votre service. »\n\nSpeidel sourit. « Merci, général. »"
 Speidel.1.d: "Peuple allemand,\n\nC'est avec beaucoup d'importance et d'inquiétude que je m'adresse à vous ce soir, en tant que nouveau président du Comité des officiers. Comme l'a rapporté la presse, l'ancien président, le général Erich von Manstein, a été arrêté par la police militaire pour trahison et négligence envers la République fédérale, pour avoir abusé du pouvoir de la Bundeswehr afin de provoquer un conflit avec le bloc communiste. Ce faisant, le général Manstein a fait perdre à nos alliés occidentaux leur confiance en nous. La réputation de l'Allemagne à l'étranger a été détruite par les actions imprudentes de Manstein, qui visaient à servir un objectif idéologique.\n\nLe Comité des officiers est choqué et consterné par les actes de Manstein, et s'engage à prendre toutes les mesures appropriées à son encontre afin que justice soit faite. En tant que nouveau président, je m'engage à tenir le peuple allemand informé des actions du Comité et à veiller à ce que la sécurité et la sûreté de la République fédérale soient préservées contre les ennemis, tant étrangers que nationaux.\n\nJe vous exhorte, peuple allemand, à rester calme. Le temps du général Manstein est révolu, et une nouvelle ère s'ouvre pour la République fédérale. L'armée restera capable de défendre la nation, mais elle a été retirée de l'état d'alerte. L'Allemagne restera forte et stable comme toujours, malgré cette brève crise. Je vous remercie tous de votre attention. Bonne nuit."
 Speidel.2.d: "CONFIDENTIEL\n[GetDateText]\n\nÀ : Général Hans Speidel, Président, Comité des Officiers de la Bundeswehr\nOBJET : L’avenir de la Bundeswehr\n\nGénéral Speidel,\nComme vous le savez bien, le rôle de la Bundeswehr dans la République fédérale est extrêmement important, car il protège le peuple et assure une sécurité intérieure adéquate. Cependant, compte tenu des changements intervenus au sein du Comité ces derniers mois, il est devenu clair que la Bundeswehr pourrait nécessiter des modifications, tant en termes de mission que d’organisation et de composition. Les deux propositions suivantes reflètent les recommandations du Bureau de l’Inspecteur général pour une réforme supplémentaire de la Bundeswehr.\n\n1. Maintenir la Bundeswehr sous sa forme actuelle en tant que force de défense. Cela inclurait des opérations défensives telles que le renforcement de la sécurité à la frontière intérieure allemande, la réforme vers une politique d’enrôlement volontaire, et la réception d’une assistance défensive telle que des armes antichars.\n\n2. Étendre la Bundeswehr à un rôle offensif, reconnaissant la nécessité pour les forces allemandes et alliées de contrer la capacité militaire soviétique à l’Est. Cela inclurait l’expansion des politiques de conscription au-delà de leur niveau actuel, l’augmentation des capacités de production d’armes nationales, et la formation de plus d’unités d’intervention spéciales et parachutistes.\n\nCe ne sont que des propositions générales, mais le moment de réformer la Bundeswehr est venu. Je suis fermement convaincu que l’une ou l’autre de ces propositions servira bien le peuple de la République fédérale et maintiendra la préparation opérationnelle.\n\nSIGNÉ\nGénéral Friedrich Foertsch, Inspecteur général, Commandement de la Bundeswehr"
 Speidel.3.d: "CONFIDENTIEL\n[GetDateText]\n\nÀ : Tous les départements et bureaux\nOBJET : Plan intérimaire de stabilisation\n\nÀ tous les officiers,\n\nÀ la suite de la destitution du président Manstein du Comité, le Comité des Officiers et le Gouvernement militaire doivent mettre en œuvre un plan de stabilisation limitée et de réformes afin de réaffirmer notre légitimité et de retrouver le soutien de ce gouvernement auprès de la population allemande. Les actions suivantes seront entreprises avec toute la diligence nécessaire :\n\n1. Interdiction immédiate des croix gammées, des éclairs de la SS, des têtes de mort et de tous les autres symboles et images associés au National-socialisme, à l’exception de la Croix de fer ;\n\n2. Interdiction à tous les anciens responsables nationaux-socialistes, à l’exception des officiers militaires en poste, d’occuper une fonction publique, de se présenter à une élection ou d’occuper un poste dans la fonction publique ;\n\n3. Poursuites contre l’ancien général Manstein pour trahison, négligence et mise en danger volontaire du peuple allemand ;\n\n4. Clarification de la vérité sur les actions de la Wehrmacht, en mettant particulièrement l’accent sur sa participation aux atrocités, tout en tenant compte de son évolution historique vers la Bundeswehr moderne ;\n\n5. Limitation des activités politiques des communistes et autres groupes politiques de gauche, y compris le contrôle de la publication et de la liberté de réunion.J’espère profondément que toutes ces directives seront suivies à la lettre et ne rencontreront aucune résistance, afin que la République fédérale puisse être rapidement stabilisée et que notre réputation soit sauvée d’une quasi-ruine.\n\nSIGNÉ\nGénéral Hans Speidel, Président, Comité des Officiers de la Bundeswehr"
 Speidel.4.d: "Alors que Speidel attendait que la caméra clignote en rouge, il rassembla ses pensées, imaginant comment d'autres généraux et dirigeants avant lui s'étaient comportés à sa place. C'était la première fois que Speidel devait prononcer un discours, qui plus est sur un sujet sérieux et controversé. Lorsque la lumière clignota en rouge, il prit une inspiration et commença.\n\n« Bonsoir, peuple allemand. Je m'appelle Hans Speidel, général et président du Comité des officiers de la Bundeswehr, et ce soir, nous allons aborder un sujet qui tient profondément à cœur à de nombreux Allemands : la Wehrmacht. Des milliers de nos concitoyens ont servi pendant la guerre et se sont battus honorablement, conformément aux ordres de leurs supérieurs. Cependant, l'héritage de la Wehrmacht est bien plus important et mérite d'être abordé. »\n\n« Mon prédécesseur souhaitait effacer la vérité sur les actions de la Wehrmacht et l'absoudre de toute responsabilité pour les crimes qu'elle a commis pendant la guerre. Il souhaitait un retour à la Wehrmacht, un retour au Reich, une idée qui ne pouvait tout simplement pas être acceptée par la commission ni par le peuple allemand. La Wehrmacht est une institution différente, issue d'une autre époque. Si certaines de ses actions peuvent être contestées, nous ne pouvons pas laisser perdurer le mythe d'une Wehrmacht irréprochable. Même moi, en tant qu'ancien membre de cette force, je l'admets. Aucune force militaire n'est parfaite, même si nous aimerions qu'elle le soit. »\n\n« Peuple allemand, je vous invite à garder un bon souvenir de la Wehrmacht et de ses vétérans, mais sans oublier les dommages considérables qu'elle a causés dans l'histoire de l'Allemagne, et à reconnaître la moralité de la guerre telle qu'elle existe aujourd'hui. Merci à tous et bonne nuit. »\n\n« Vous vous en êtes très bien sorti, général. » Le caméraman sourit en reculant la caméra tandis que Speidel quittait le podium, s'essuyant le front avec un mouchoir. « Merci. »"
 Speidel.5.d: "BANG BANG BANG.\n\nLe marteau du juge résonna dans la chambre silencieuse alors qu’il ouvrait l’audience. « Affaire n° 23413, République fédérale d’Allemagne contre Erich von Manstein, pour les chefs d’accusation de trahison, négligence et mise en danger délibérée du peuple allemand, est par la présente appelée à l’ordre. Herr Manstein, comment plaidez-vous ? »\n\nManstein, vêtu d’une combinaison de prisonnier et entravé, se tenait dans une cage de verre, flanqué de plusieurs policiers militaires de la Bundeswehr armés de fusils. « Non coupable, Votre Honneur. »\n\n« Très bien, Herr Manstein. Herr le Procureur, veuillez commencer par votre exposé des chefs d’accusation. »\n\nLe procureur, un autre officier de la Bundeswehr en uniforme, se leva, tenant une liasse de papiers. « Votre Honneur, l’accusé est par la présente inculpé de trahison envers la République fédérale, ainsi que de négligence et de mise en danger délibérée du peuple allemand. L’État considère en l’espèce que Herr Manstein, en tant qu’ancien président du Comité des officiers de la Bundeswehr, a utilisé sa position d’autorité pour abuser des pouvoirs de la Bundeswehr, ainsi que pour modeler les relations étrangères de la République fédérale de manière à refléter une attitude d’antagonisme à la fois envers nos Alliés et envers le Bloc de l’Est. Herr Manstein a également utilisé sa position d’autorité pour réintroduire des politiques culturelles communément associées au précédent régime national-socialiste, notamment en autorisant les croix gammées et en interdisant les mémoriaux de l’Holocauste. Cela a fondamentalement perturbé le peuple allemand et l’a sciemment placé dans un grave danger au même moment. »"
 Speidel.6.d: "Alors que Speidel parcourait une nouvelle fois les couloirs du bâtiment IG Farben, il se souvenait de la dernière fois où il était venu ici. Une période malheureuse, durant laquelle il avait dû jouer l’aide de camp d’un fou. En entrant dans la salle de conférence, saluant d’un signe de tête les MPs américains postés à l’extérieur, il espérait que cela se passerait mieux que la dernière fois. Il y avait beaucoup de choses à arranger.\n\n« Bonjour, messieurs. Quel plaisir de vous revoir tous. » Speidel sourit, retirant sa casquette et serrant la main du général McAuliffe, le nouveau commandant de l’US Army Europe.\n\n« Heureux de vous revoir, général Speidel. Ravi de constater que nous sommes en meilleurs termes que la dernière fois. » Ils échangèrent un léger rire et, tandis que Speidel serrait la main des représentants britannique et français, les aides se regroupèrent un bref instant. Une minute plus tard, la porte fut fermée et tous les officiers étaient assis autour de la table de conférence.\n\n« Tout d’abord, messieurs, je tiens à préciser que, comme vous pouvez le constater, beaucoup de choses ont changé en Allemagne et au sein du Comité depuis que nous avons écarté Herr Manstein. Vos gouvernements avaient, à juste titre, des inquiétudes quant à ce que faisait Manstein, et en particulier concernant sa rhétorique à l’égard des Alliés. Soyez assurés que sous ma direction, cette rhétorique a changé de visage, et nous nous engageons en faveur d’une politique étrangère occidentale forte. »\n\nLes trois officiers acquiescèrent. « C’est bon à savoir, général Speidel, merci. Cependant, notre préoccupation porte sur vos politiques et sur la manière dont vous comptez aborder les Soviétiques. Comme vous le savez, nos inquiétudes à l’égard de Manstein étaient justifiées, puisqu’il menaçait de provoquer une guerre avec l’Allemagne de l’Est et, par extension, avec l’Union soviétique. Nous voulons l’assurance que vous ne ferez pas de même. »\n\nSpeidel sourit, ajustant légèrement son uniforme. « Messieurs, je peux vous assurer que ce gouvernement ne prendra aucune action offensive contre les Soviétiques ou le Bloc. Nous devons rester forts et prêts face à toute attaque ou incursion soviétique, et nous conduirons notre défense et notre politique étrangère en conséquence. Maintenant, si vous voulez bien m’excuser, j’ai une autre réunion à laquelle je dois me rendre. Vous savez comment joindre mon bureau. »\n\nSe levant, les quatre hommes se serrèrent une nouvelle fois la main et échangèrent des politesses avant que Speidel et son équipe ne quittent la pièce. En s’éloignant, les Américains semblaient satisfaits, pensa-t-il. Une nouvelle crise évitée."
 Speidel.7.d: "Aujourd'hui, la République fédérale d'Allemagne, provisoirement dirigée par un comité militaire, a officiellement rejoint les Nations unies en tant que membre à part entière. Auparavant observatrice, l'Allemagne de l'Ouest a soumis une demande au secrétaire général lors de l'accession de Speidel à la présidence du comité des officiers de la Bundeswehr.\n\nConfirmée officiellement par l'Assemblée générale des Nations unies, sur la base de considérations idéologiques, la promotion de la République fédérale au sein de la communauté internationale marque le début d'un effort visant à compenser les pertes diplomatiques subies sous la direction précédente du général Erich von Manstein. Cependant, cet événement représente également un point de tension dans la guerre froide, en particulier en raison des condamnations sévères de l'Allemagne de l'Est et de l'Union soviétique."
 Speidel.8.d: "Zurich (AP) - Le général Hans Speidel, dirigeant ouest-allemand, a atterri aujourd'hui à l'aéroport de Zurich, où il a été chaleureusement accueilli par des responsables politiques et militaires suisses, marquant ainsi le début d'une visite officielle dans ce pays européen neutre situé au sud de Bonn.\n\nBien que le programme de Speidel et de son entourage n'ait pas été communiqué à la presse, on s'attend à ce que le dirigeant allemand, accompagné de divers responsables politiques, visite certaines parties de Zurich, Genève et Berne, assiste à un défilé des forces armées suisses et participe à plusieurs réunions avec le Conseil fédéral suisse, le Parlement fédéral et d'autres ministères fédéraux suisses.\n\nCela s'inscrit dans la continuité d'une initiative concertée du gouvernement ouest-allemand, dirigé par les militaires, visant à privilégier les bonnes relations avec les pays neutres plutôt qu'un alignement strictement occidental. Bien que cette visite ait peu attiré l'attention des superpuissances, elle reste importante dans les affaires européennes, en particulier compte tenu de l'influence de la Suisse sur les affaires internationales et les relations bancaires."
 Speidel.9.d: "Bonn (AP) - Aujourd'hui, partout dans le monde, les ambassades de la République fédérale d'Allemagne ont officiellement ouvert leurs portes. Dans le cadre d'un nouveau programme mis en place par le gouvernement militaire provisoire allemand dirigé par le général Hans Speidel, le ministère des Affaires étrangères de la République fédérale s'est attelé à renforcer les relations diplomatiques, en particulier avec l'Occident.\n\nAvec l'ouverture des ambassades allemandes au Canada, en Irlande, en Norvège, en Suède et au Portugal, les relations de la junte avec l'Occident continuent de s'ouvrir. Des ambassades allemandes en Corée, en Thaïlande et aux Philippines sont également prévues, dans le cadre d'une orientation vers l'Asie. Les relations avec le bloc communiste se poursuivent toutefois sans relâche, le seul développement significatif étant l'ouverture du nouveau bâtiment de l'ambassade allemande à Moscou, qui représente ainsi l'ensemble du bloc de l'Est. Le secrétaire d'État américain a salué la nouvelle ouverture diplomatique de l'Allemagne, reconnaissant ses réalisations et espérant d'autres avancées à l'avenir."
 Speidel.10.d: "Des jeeps et des berlines, ornées de drapeaux américains, britanniques et français, se sont arrêtées en crissant devant la Chancellerie fédérale à Bonn. Leurs passagers en sont rapidement descendus et se sont dirigés vers l'arrière pour commencer à décharger des meubles et du matériel de bureau. Les gardes militaires de la Bundeswehr qui se tenaient à l'extérieur ont regardé avec admiration et étonnement les chariots contenant des classeurs, des bureaux et des chaises entrer dans l'immense bâtiment gouvernemental.\n\nAlors que les hommes montaient à l'étage, ils croisèrent d'autres Allemands perplexes, militaires et civils, qui vaquaient à leurs occupations quotidiennes à la Chancellerie. Un mémo avait été envoyé par le bureau de Speidel ce matin-là, mais il était évident que presque personne ne l'avait lu, car tout le monde était occupé à d'autres tâches, comme diriger le pays.\n\nLe responsable américain, muni d'un bloc-notes, sortit de l'ascenseur, suivi de deux soldats chargés de chariots remplis de meubles. Après avoir traversé un couloir et passé devant des bureaux administratifs, ils s'arrêtèrent devant la porte d'un grand bureau. Après avoir consulté son bloc-notes, le responsable américain fit cliquer son stylo, puis fit signe aux soldats de commencer à transporter leur chargement à l'intérieur. En accrochant une pancarte sur la porte au passage, les passants et les aides militaires furent surpris de voir apparaître « Mission américaine de supervision et de réglementation auprès de la République fédérale d'Allemagne ». Plusieurs portes plus loin, des responsables britanniques et français faisaient de même, avec la Mission britannique de conseil et d'assistance auprès de la République fédérale d'Allemagne et la Mission française à Bonn.\n\nSpeidel et son équipe, clairement les seuls à être au courant, observaient la scène en souriant. Il était évident que cette coopération avait atteint un nouveau niveau, et on pouvait espérer que la vigilance des Alliés empêcherait toute nouvelle erreur."
 Speidel.11.d: "CONFIDENTIEL\n[GetDateText]\n\nÀ : Général Hans Speidel, Président du Comité des officiers de la Bundeswehr\nDE : Bureau de la planification économique, ministère des Finances, République fédérale d’Allemagne\n\nOBJET : Proposition de plan économique pour la République fédérale\n\nGénéral Speidel,\n\nMaintenant que le pays est correctement stabilisé sous votre direction bien intentionnée, l’économie doit être réformée et stabilisée de manière similaire. Voici quelques recommandations empiriques pour la future politique économique.\n\n1. Il est fortement recommandé que la République fédérale adhère au Fonds monétaire international dès que possible. Cela contribuera à accroître nos financements internationaux et à améliorer notre balance des paiements, et pourrait faciliter l’obtention de prêts à l’avenir.\n\n2. L’expansion des industries charbonnières dans la région de la Ruhr. Les régimes précédents ont tenté de le faire sans obtenir de résultats satisfaisants, et cet aspect doit faire l’objet d’une attention particulière.\n\n3. Dans le prolongement de la recommandation précédente, l’octroi de subventions et/ou d’une assistance aux grandes entreprises allemandes, telles que BMW, Volkswagen et BASF, afin d’accroître leur efficacité et la valeur de leurs exportations.\n\n4. Enfin, la réintroduction d’organisations ouvrières approuvées par l’État, afin de maintenir une certaine forme de relations entre travailleurs et direction qui augmentera la productivité et l’efficacité.\n\nJ’espère sincèrement que cela ne sera que le début du retour de la puissance économique allemande non seulement en Europe, mais dans l’ensemble du monde occidental.\n\nSIGNÉ\nDirecteur, Bureau de la planification économique, ministère des Finances"
 Speidel.12.d: "« Bonn (Der Spiegel) – À la surprise de la plupart des observateurs, y compris des Alliés occidentaux, l’Allemagne de l’Ouest a annoncé aujourd’hui le lancement de son programme nucléaire, lors d’une allocution publique et d’un communiqué de presse. Actuellement dirigée par le général Hans Speidel sous l’autorité d’un comité militaire, la République fédérale devient l’un des rares pays au monde à posséder des capacités nucléaires, sous une forme ou une autre. »\n\n« Bien qu’il ne soit pas encore établi si les Allemands suivront une voie pacifique ou s’orienteront vers l’acquisition d’armes nucléaires, les réactions ont été variées ; la plupart des Alliés occidentaux ont exprimé un soutien tangible, tandis que, comme à l’accoutumée, l’Union soviétique et le Bloc de l’Est ont dénoncé cette initiative comme une nouvelle escalade de la guerre froide. »\n\nSpeidel sourit en reposant le journal, dont le grand titre s’étalait à la une. « Ils ont raison, après tout. Nous n’avons pas encore déterminé l’orientation de notre programme. » Il fit un signe de tête aux deux aides, un colonel et un commandant, ainsi qu’à un responsable civil présent dans la pièce.\n\n« Une utilisation pacifique obtiendrait une plus grande acceptation au sein de la communauté internationale et bénéficierait d’un soutien plus large sur le plan intérieur ; cependant, ses usages seraient limités dans la mesure où nous ne pourrions l’employer qu’à des fins de recherche et comme source d’énergie. »\n\n« La proposition d’un programme d’armement est également prometteuse, mais elle entraînerait un mécontentement bien plus important parmi notre population et nos Alliés. Je suis certain que les Soviétiques se sentiraient également fortement menacés par une puissance nucléaire si proche de leur frontière. Mais comme vous le savez, général Speidel, les avantages pour nos capacités militaires et tactiques seraient immenses. Une dissuasion nucléaire de l’OTAN ici même éviterait aux Américains de stationner des armes sur notre territoire. »\n\n« Très bien, messieurs. Merci. Si vous pouviez me remettre des rapports sur chacune des options, nous prendrons une décision très prochainement. » répondit Speidel."
 Speidel.13.d: "Les flashs des appareils photo crépitaient tandis que Speidel sortait de sa Mercedes noire, escorté par deux lieutenants de la Bundeswehr, et se dirigeait vers la zone dégagée du futur site de la nouvelle centrale nucléaire fédérale, où un terrain avait été déblayé pour la cérémonie d'inauguration.\n\nDebout à proximité, tenant une paire de pelles dorées, se trouvaient le directeur de l'usine et l'architecte en chef, derrière lesquels se tenait le futur ingénieur en chef de l'usine. Speidel s'approcha, sourit et discuta quelques minutes avec les hommes avant d'être invité, avec les autres, à prendre leurs pelles et à poser pour la presse venue couvrir la cérémonie d'inauguration. Les hommes souriaient tandis que les reporters filmaient les officiers et les hommes en train de creuser le sol, marquant symboliquement le début de la construction.\n\nSpeidel a ensuite prononcé un bref discours, soulignant la « puissance de l'énergie nucléaire » et appelant à « une utilisation sûre et prudente de l'énergie atomique afin d'atteindre l'indépendance énergétique et de garantir la sécurité des capacités de recherche atomique ». Il n'a fait aucune mention de la volonté apparente de la junte de privilégier l'énergie nucléaire pacifique plutôt que les armes nucléaires, comme l'avaient supposé de nombreux experts politiques.\n\nDans l'ensemble, le succès était évident, et le public avait adoré, pensa Speidel en s'éloignant à toute vitesse. L'avenir était prometteur, et il savait que c'était la bonne décision pour l'avenir de l'Allemagne et de l'énergie atomique."
 Speidel.14.d: "CONFIDENTIEL\n[GetDateText]\n\nÀ : Général Hans Speidel, Président du Comité des officiers de la Bundeswehr\nDE : Président, Agence fédérale de secours technique ; Commandant, Commandement de la Bundeswehr\n\nOBJET : Rapport sur l’exercice national de défense civile nucléaire\n\nGénéral Speidel,\n\nComme vous le savez d’après les briefings initiaux, un exercice de défense civile nucléaire a été mené à bien il y a plusieurs jours, après avoir été ordonné et planifié. Dans l’ensemble, il a été couronné de succès. Voici les résultats et recommandations suivants :\n\n1. L’exercice reposait sur l’hypothèse que des armes nucléaires soviétiques avaient frappé toutes les grandes villes allemandes, notamment Bonn, Francfort, Hambourg, Cologne, Munich et Nuremberg. Toutefois, nous n’avons pas initialement pris en compte les frappes visant des cibles alliées en Allemagne telles que des bases militaires et autres formations. Cela augmenterait probablement l’ampleur des dégâts infligés au pays lors d’une frappe soviétique et sera utile pour la planification ultérieure.\n\n2. La campagne de relations publiques a été efficace mais pourrait être davantage développée. L’intérêt initial était faible, et le recours à la radio et à la télévision, plutôt qu’à des stratégies uniquement fondées sur des supports papier, pourrait davantage inciter la population à participer volontairement aux efforts de défense civile.\n\n3. Les dispositifs d’alerte ont été efficaces, mais doivent être améliorés. Plusieurs alertes ont été émises, mais les responsables des alertes aériennes et de la défense civile locale se sont révélés réticents ou incapables de déterminer l’ampleur des « dégâts ». Les équipes et le personnel médicaux devraient également être intégrés au dispositif.\n\n4. Les forces militaires ont bien rempli leur rôle, contribuant à intercepter et à repousser certaines tentatives de frappes nucléaires. Toutefois, leur rôle devrait être élargi afin d’inclure non seulement la défense aérienne nucléaire, mais aussi la défense contre des frappes tactiques, ainsi que la défense conventionnelle contre les forces terrestres soviétiques.\n\nCette agence prévoit de poursuivre ces exercices sur une base annuelle et apprécie la coopération de la Bundeswehr et du Comité des officiers pour avoir facilité cet exercice dans le cadre de la défense nationale du pays.\n\nSIGNÉ\nPrésident, Agence fédérale de secours technique, ministère de l’Intérieur, République fédérale d’Allemagne"
 Speidel.15.d: "Peuple d’Allemagne,\n\nAu cours des dernières années depuis que j’ai assumé mes fonctions, l’Allemagne a profondément changé, pour le mieux. L’héritage de mes prédécesseurs a été effacé, définitivement, et l’Allemagne s’est une fois de plus transformée en un acteur dynamique sur la scène internationale. Notre économie est forte et notre peuple est heureux.\n\nMon prédécesseur était déterminé à ressusciter cette République fédérale en tant que Quatrième Reich. Je l’ai arrêté. Le peuple allemand l’a arrêté. Nous avons déjà suffisamment souffert des horreurs du national-socialisme et de son idéologie défaillante. Sous mon administration, ce gouvernement a interdit les symboles nazis et pris des mesures proactives pour empêcher d’anciens responsables nazis d’occuper des fonctions publiques élevées et importantes. Herr Manstein a été reconnu coupable et emprisonné pour ses crimes. L’État de droit continue de prévaloir en Allemagne.\n\nLa Bundeswehr, sous ma direction, a été transformée pour le mieux. Les forces armées ne sont plus simplement l’instrument du dirigeant, exécutant ses volontés, mais une force composée d’individus disposés et prêts à défendre leur pays contre les menaces, étrangères comme intérieures. La Bundeswehr est équipée, soutenue et prête à relever tout défi, qu’il provienne de l’intérieur de nos frontières ou de l’Est.\n\nNotre économie a été reconstruite, tout comme nos affaires étrangères. Notre réputation sur la scène mondiale et au sein de la communauté internationale s’est renforcée. Nous avons retrouvé notre puissance économique et demeurons une force majeure dans les exportations manufacturières et la finance.\n\nPeuple d’Allemagne, vous pouvez être fiers. Beaucoup a été accompli, et grâce à vous. Il y aurait encore beaucoup à dire, mais je crois que le temps du gouvernement militaire est révolu. L’Allemagne doit à nouveau faire face aux avantages et aux risques d’un système démocratique, et le Comité des officiers est prêt à assurer la transition avec dignité et grâce. Merci à tous et bonne nuit."
 Junta_Dem.1.d: "Au fur et à mesure que le Comité des officiers de la Bundeswehr dirigé par Gehlen suit son cours, plusieurs constats s'imposent. D'une part, la presse limitée en Allemagne de l'Ouest, ainsi que les observateurs extérieurs, pensaient généralement que le Comité des officiers ne durerait pas éternellement. En effet, les objectifs principaux des officiers ont été atteints et l'avenir semble incertain.\n\nLes Alliés ont exercé une pression croissante, en particulier sur le général Gehlen, pour qu'il cède le pouvoir en faveur d'élections démocratiques. Convaincus que la République fédérale s'est débarrassée de toute opposition communiste, les représentants des États-Unis et de la Grande-Bretagne ont « encouragé » Gehlen à entamer le processus électoral.\n\nGehlen et ses adjoints, bien que plutôt mécontents de cette perspective, ont accepté à contrecœur, car ils considèrent que le soutien et l'aide militaire de l'Occident sont essentiels au maintien et à la capacité de la Bundeswehr. On s'attend à ce que Gehlen utilise le pouvoir et l'influence politiques qu'il a déjà accumulés pour soutenir ouvertement les partis politiques conservateurs et nationalistes, dans le but de faire pencher légitimement la balance lors des prochaines élections libres et équitables.\n\nL'avenir de l'Allemagne de l'Ouest semble incertain, alors que la population se tourne avec prudence vers le général Gehlen et le Comité des officiers pour qu'ils fournissent les orientations et l'état de droit nécessaires au retour du pays à la démocratie."
 Junta_Dem.2.d: "Alors que le Comité des officiers de la Bundeswehr, dirigé par le général Hans Speidel, continue d'assurer la stabilité en Allemagne de l'Ouest, les alliés occidentaux s'inquiètent de plus en plus de la pérennité du régime. Bien que le général Speidel soit nettement plus libéral que certains de ses collègues officiers de la Bundeswehr, il n'en reste pas moins un officier militaire, ayant déjà servi dans les forces de la Wehrmacht.\n\nLes pressions exercées par les Alliés occidentaux, qui ont officiellement supervisé et conseillé la junte, ont abouti à leur demande adressée au Comité et à Speidel de céder le pouvoir, en échange d'élections libres et équitables. Le personnel de Speidel aurait été plutôt agacé par cette perspective, mais aurait fini par céder en raison de son alignement et de sa coopération antérieurs avec les puissances occidentales.\n\nLa plupart des experts politiques et des observateurs extérieurs s'attendent à ce que Speidel soutienne ou approuve les partis conservateurs qui devraient se présenter aux prochaines élections, en particulier l'Union chrétienne-démocrate (CDU).\n\nOn ne sait rien d'autre de l'avenir de l'Allemagne de l'Ouest, car le régime démocratique est en jeu. Le monde entier, des deux côtés du rideau de fer, attend avec impatience de voir ce qui va se passer et ce que le peuple de la République fédérale va décider de faire."
 Junta_Dem.3.d: "« Bonn (Der Spiegel) - Aujourd'hui, devant le bâtiment de la Chancellerie fédérale, plusieurs généraux, membres du Comité des officiers de la Bundeswehr, dont le président, le général [WGR.GetLeader] ont officiellement annoncé leur soutien à l'Union chrétienne-démocrate (CDU) et au Parti allemand (DP) lors des prochaines élections provisoires en Allemagne de l'Ouest. »\n\n« Après avoir annoncé leur intention d'organiser des élections libres et équitables afin de rétablir la démocratie, les généraux ont immédiatement décidé de soutenir la CDU et le DP, deux partis considérés comme conservateurs, de droite et nationalistes. Cette décision n'a guère surpris, car ces partis continueraient à employer les officiers susmentionnés et à solliciter le soutien des Alliés occidentaux à des fins géopolitiques. »\n\nLe fonctionnaire de la CDU posa le journal. Très bien. Oui, ils rétablissaient la démocratie, mais comme la gauche avait été anéantie, il ne restait plus que les conservateurs et les partisans de la droite. Une victoire assurée pour la CDU, pensa-t-il."
 Junta_Dem.4.d: "« Peuple d’Allemagne,\n\nJe m’adresse à vous ce soir sur un sujet important qui concerne l’avenir de cette grande République fédérale dans laquelle vous et moi avons le privilège de vivre.\n\nAprès mûre réflexion, les membres du Comité des officiers de la Bundeswehr et moi-même avons décidé que le temps de notre gouvernance stabilisatrice est révolu. La République fédérale a été débarrassée de toute infiltration communiste et, par notre bienveillance, nous avons accompli beaucoup sous le régime et la supervision militaires.\n\nLe Comité, une fois toutes les préparations nécessaires achevées, lancera des élections provisoires pour la République fédérale. Ces élections ramèneront ce pays à un système démocratique, garantissant que la voix du peuple soit mieux entendue et que notre réputation internationale continue de s’améliorer.\n\nNous recevons un soutien significatif de nos alliés aux États-Unis, en Grande-Bretagne et en France à cet égard. Je vous assure, en tant que président du Comité, que nous faisons de notre mieux pour garantir une élection en bonne et due forme, équitable, mais exempte de toute subversion ou manipulation communiste. De plus amples détails paraîtront dans la presse au cours des prochaines semaines. Bonne nuit. »\n\nLorsque le flash de l'appareil photo s'éteignit pour la dernière fois, Gehlen sut que c'était fini, que ce serait sa dernière apparition à la télévision et que bientôt, il serait simplement renvoyé aux affaires d'espionnage. Cette mission avait été couronnée de succès, et le peuple allemand l'en remerciait, mais il était temps de passer le relais."
 Junta_Dem.5.d: "« Peuple d’Allemagne,\n\nCe soir est un discours important, une occasion mémorable dont tous, au sein de la République fédérale, se souviendront pendant des années. Il n’est pas facile de le dire, mais le monde change, et ce grand pays changera lui aussi.\n\nSur l’avis et avec le consentement de nos Alliés, notamment les États-Unis, la Grande-Bretagne et la France, le Comité des officiers de la Bundeswehr a décidé de se retirer et de convoquer des élections fédérales provisoires. Nous le faisons avec tout le sérieux et le formalisme requis.\n\nCe pays a traversé bien des épreuves depuis le début de cette décennie, sans parler des quinze dernières années. Le gouvernement exercé par ce Comité était bienveillant et nécessaire à la sécurité de la République fédérale. Mon prédécesseur a été destitué et jugé pour la même raison. Il est clair que l’État de droit existe toujours dans ce pays, qu’il soit dirigé par un chancelier démocratiquement élu ou par un officier militaire nommé.\n\nSous la direction de ce Comité, beaucoup a été accompli. La menace communiste a été éliminée, une fois pour toutes, en tant que force dominante au sein de l’appareil politique allemand. Notre économie est renée, nous avons affronté notre passé tumultueux et notre armée a été réformée et agrandie. Notre réputation internationale continue de s’améliorer, tandis que nous affirmons notre revendication légitime sur l’ensemble de l’Allemagne.\n\nCependant, comme je l’ai déclaré, il est temps pour ce Comité de se retirer. Le peuple allemand a suffisamment toléré notre gouvernement, et il est temps pour nous de revenir au simple service militaire, en servant le pays de cette manière. De plus amples informations concernant l’élection seront publiées dans les médias et par les canaux officiels. Merci à tous et bonne nuit. »\n\nSpeidel soupira, essuyant la sueur de son front lorsque le voyant de la caméra s’éteignit. C’était ainsi, et il n’y avait rien de plus à ajouter."
 Junta_Dem.6.d: "« Munich (AP) - Partout en Allemagne, des avions arborant le logo de l'ONU ont atterri aujourd'hui sur des aérodromes, déposant leurs passagers, transportant leurs bagages et étant accueillis par des représentants des autorités locales et des responsables militaires. À la demande du gouvernement ouest-allemand, toujours dirigé par les militaires, la mission d'observation électorale des Nations Unies pour la République fédérale d'Allemagne devait commencer, avec un contingent international d'observateurs électoraux de l'ONU déployé dans presque tous les bureaux de vote du pays, en particulier dans les grandes villes de Bonn, Francfort, Hambourg, Hanovre, Munich, Nuremberg et Cologne.\n\nQuelques semaines seulement après que le Comité des officiers de la Bundeswehr, organe dirigeant de facto de l'Allemagne de l'Ouest, ait annoncé des élections provisoires, la mission de l'ONU vise à garantir que les élections se déroulent de manière libre et équitable, en veillant à ce qu'il n'y ait ni fraude ni manipulation, et en agissant comme une force d'observation impartiale entre le gouvernement militaire et la population dans son ensemble.\n\nBien que des inquiétudes aient été exprimées quant au fait que la junte ait déjà apporté son soutien à des candidats conservateurs, la mission de l'ONU estime que « le Comité avait pleinement le droit d'apporter son soutien à la CDU et au DP, au motif qu'il s'agit de partis politiques légitimes ». On s'attend à ce que l'un des deux partis l'emporte et à ce qu'il y ait peu d'opposition de gauche au nouveau gouvernement provisoire à l'avenir.\n\nLe Général [WGR.GetLeader] sourit en posant le journal. « Excellent. Ils sont ici pour faire leur travail, et nous sommes ici pour faire le nôtre. » Il leva les yeux vers un assistant assis de l'autre côté du bureau. « Permettre à l'ONU d'intervenir nous donne plus de légitimité et garantit la victoire d'un parti de droite. C'est une situation gagnant-gagnant pour nous. » Il sourit en reprenant le journal."
 Adenauer58.1.d: "« Bonsoir, Mesdames et Messieurs du Bundestag ! »\n\nLa voix d’Adenauer résonna à la tribune tandis qu’il faisait face à ses collègues parlementaires, dans le bâtiment du Parlement à Bonn.\n\n« Nous sommes réunis ici à un moment critique de l’histoire de la République fédérale. La démocratie est revenue en Allemagne une fois de plus, alors que les officiers de la Bundeswehr et le peuple ont confié à la CDU la responsabilité de diriger. »\n\n« Ce nouveau gouvernement démocratique, choisi par le peuple, a la tâche importante de restaurer les principes et les institutions démocratiques dans ce pays. Il ne fait aucun doute que la Bundeswehr a fait preuve de jugement et de retenue dans sa gouvernance du pays, mais ce temps est définitivement révolu. »\n\n« Ce gouvernement s’engagera à rétablir la Loi fondamentale de 1949, jadis compromise, consacrant notre constitution et définissant les fonctions du chancelier. Tout cela avec votre aide. »\n\n« Je suis fier de diriger ce gouvernement. Sous la direction de mon gouvernement, je suis convaincu que l’Allemagne poursuivra sa marche vers la lumière du succès ! »\n\n« Merci à tous et bonne nuit. Il est temps de se mettre au travail. »"
 Adenauer58.2.d: "« Bonn (Reuters) - En signant aujourd'hui un projet de loi à la Chancellerie fédérale, le chancelier ouest-allemand Konrad Adenauer a rétabli la Loi fondamentale de 1949, également connue sous le nom de Grundgesetz, qui a servi de constitution et de document directeur à la République fédérale jusqu'à son abrogation par le chancelier communiste Max Reimann pendant son régime.\n\nMarquant le deuxième mouvement officiel vers des institutions démocratiques en Allemagne de l'Ouest, après la convocation d'élections, la Loi fondamentale garantit des protections constitutionnelles à la population et redéfinit la structure du gouvernement, y compris les pouvoirs exécutif, législatif et judiciaire. »\n\nAlors qu'Adenauer lisait le document et le reposait, son assistant prit la parole. « Nous avons réussi, mais quelques modifications ont été apportées. Cependant, l'essentiel reste inchangé, et c'est tout ce qui compte. »"
 Adenauer58.3.d: "ARTICLE 147 DE LA LOI FONDAMENTALE DE LA RÉPUBLIQUE FÉDÉRALE D’ALLEMAGNE\n\n(1) Si la République fédérale d’Allemagne est menacée par une situation d’urgence définie par la Constitution, la présente Loi fondamentale autorise la formation d’un Gouvernement d’urgence qui administrera les fonctions de la République fédérale jusqu’à ce que la déclaration d’état d’urgence soit levée.\n\n(a) « Situation d’urgence définie par la Constitution » est définie comme « toute situation d’urgence survenant à l’intérieur des frontières de la République fédérale d’Allemagne qui menace sa souveraineté, sa capacité de défense, ou porte autrement atteinte ou met en danger les citoyens de la République fédérale d’Allemagne »\n\n(b) « Gouvernement d’urgence » est défini comme « un gouvernement provisoire ayant pour objectif explicite de maintenir les fonctions vitales fondamentales de la République fédérale d’Allemagne, y compris le maintien de l’état de préparation de la défense, la politique budgétaire et économique, la politique étrangère et les autres programmes gouvernementaux nécessaires »\n\n(2) Jusqu’à ce que la déclaration d’état d’urgence soit levée, aucune élection ne sera organisée en République fédérale."
 Adenauer58.4.d: "Alors que Max sortait de son appartement pour se rendre au travail, il aperçut une affiche SPD défraîchie, usée et déchirée sur le mur. Il s'arrêta un instant, puis reprit ses esprits et courut vers le tramway pour s'y précipiter et s'asseoir.\n\nAprès avoir réfléchi un instant, il se souvint du SPD d'autrefois, et non pas de ce qu'il était devenu aujourd'hui, une coquille vide. Le SPD de l'Allemagne d'après-guerre, celui qui avait malheureusement été coopté par les communistes et autres agitateurs du KPD, avant d'être détruit par la junte de la Bundeswehr qui avait pris le contrôle du pays. Il avait toujours été de gauche, social-démocrate, mais aujourd'hui, il n'avait plus de parti vers lequel se tourner.\n\nEn descendant du bus, Max se rendit à son travail de col blanc, dans un cabinet d'expertise comptable et de tenue de livres ici à Francfort. Allumant la radio en s'asseyant à son bureau, tout ce qu'il entendait était « CDU, CDU ». Grimaçant, il se mit au travail, les heures défilant à toute vitesse, ne s'arrêtant que pour le déjeuner et une pause café.\n\nMax sortit de son bureau à 17 heures, complètement épuisé par une nouvelle journée passée à remplir des tableaux actuariels sans intérêt. Alors qu'il quittait le bâtiment, quelqu'un lui tendit une brochure, imprimée en lettres brillantes avec la mention « CHRISTLICHE DEMOKRATISCHE UNION DEUTSCHLANDS » (Union chrétienne-démocrate d'Allemagne), détaillant les politiques de la CDU (ce qui le fit froncer les sourcils) ainsi que les sections locales et les horaires des réunions. Max haussa un sourcil, s'apprêtant à la jeter, mais il eut une idée. Il y avait une réunion ce soir au centre communautaire local ; cela ne devait pas être si difficile que ça. Après tout, la CDU était une « union », elle serait sûrement disposée à accueillir d'anciens sociaux-démocrates."
 Adenauer58.5.d: "Il faisait chaud ce jour-là lorsque les collaborateurs d'Adenauer se sont alignés devant la Bourse de Francfort, avec des podiums et des drapeaux flottant au vent, tandis que les journalistes arrivaient, installaient leurs caméras et prenaient des notes préliminaires.\n\nAdenauer s'est rapidement avancé à 8 h 45, alors que les flashs des appareils photo commençaient à crépiter. « On m'a dit que je devais faire vite, car le marché est impatient d'ouvrir ce lundi matin. » Cela a provoqué quelques rires parmi la foule rassemblée.\n\n« Bonjour, Mesdames et Messieurs. Nous sommes ici aujourd'hui pour rétablir, pour rouvrir un élément essentiel non seulement du système économique allemand, mais aussi de la nouvelle communauté économique européenne. La Bourse de Francfort joue un rôle essentiel depuis le XIe siècle, époque à laquelle les foires commerciales ont vu le jour. Considérée comme la mère des bourses, elle a traversé sans faillir deux guerres mondiales et des occupations militaires. C'est avec grand plaisir que je rouvre officiellement ce matin la Bourse de Francfort, principale place boursière de la République fédérale, dans l'espoir de montrer au monde entier que l'Allemagne est de retour, pour de bon. »\n\nDes applaudissements ont retenti tandis qu'Adenauer souriait un instant, avant de s'avancer vers un ruban placé devant l'entrée de la Bourse et de se voir remettre une paire de ciseaux comiquement grande. S'arrêtant pour les caméras, il a ensuite coupé le ruban sous les applaudissements. Une cloche a sonné et le marché a commencé.\n\nAdenauer et son équipe regardaient les courtiers courir dans tous les sens, tandis que les téléscripteurs commençaient à défiler en grand nombre dans le bâtiment. Cette journée était vraiment une réussite."
 Hellwege58.1.d: "« Mesdames et Messieurs les députés du Bundestag, c'est avec grand plaisir que je m'adresse à vous ce soir », a déclaré le chancelier Heinrich Hellwege depuis la tribune, lors de la première réunion du Bundestag depuis que la Bundeswehr avait convoqué des élections provisoires.\n\n« Beaucoup de choses se sont passées depuis la création de cette République fédérale, arrachée à l'emprise des nationaux-socialistes et des communistes qui souhaitaient modeler le peuple allemand à leur guise. Tous deux ont tenté d'utiliser le nationalisme historique pour convaincre le peuple de leurs idéologies radicales, tout en ignorant le véritable nationalisme du peuple allemand. »\n\n« Mon gouvernement, élu par le peuple, cherche à changer cela. Le nationalisme allemand repose sur des valeurs conservatrices, et non sur des valeurs atlantistes et soutenues par l'Occident ! Nous ne serons plus les pions d'une superpuissance, comme nous l'avons été pendant des années ! »\n\n« Le rôle de la religion et de la monarchie dans ce pays a été terni par les valeurs athées et démocratiques qui ont érodé notre valeur historique. Le PD cherche à changer cela, en remettant en cause le rôle de la maison de Hohenzollern dans la République fédérale et en rétablissant des politiques religieuses essentielles dans la loi. Nos valeurs conservatrices s'étendront sur la scène mondiale, grâce à une collaboration plus étroite avec nos homologues européens et occidentaux sur des questions vitales telles que la sécurité. L'Allemagne est de retour, pour le mieux, et renoue avec la tradition. »\n\nAccueilli par des applaudissements nourris, Hellwege a souri en terminant son discours. Ce n'était que la première étape de son nouveau mandat de chancelier."
 Hellwege58.2.d: "La chambre du Bundestag était en effervescence alors que le corps législatif s'apprêtait à mener l'un de ses premiers débats, et l'un des plus controversés à ce jour. Le DP, fidèle à ses idéaux nationalistes, proposait plusieurs moyens de réintégrer la maison de Hohenzollern au sein du gouvernement fédéral, allant de la suppression de leur statut fiscal et de la mise en place de mesures de sécurité à des propositions radicales telles que l'octroi au prince Louis Ferdinand, héritier du trône, d'un poste au sein du gouvernement, éventuellement celui de président fédéral.\n\nLes membres de la CDU et la petite faction des sociaux-démocrates qui lui est associée restent fermement opposés, les membres de l'opposition s'exclamant que « ce pays est une république, et non plus un empire ! ». Les membres du DP et du FDP ont riposté, tentant de convaincre l'opposition que « la maison de Hohenzollern revêt une importance historique et culturelle et qu'elle ne doit pas être reléguée aux oubliettes de l'histoire ». Cependant, ceux-ci ne sont pas convaincus et protestent en affirmant que les échecs de l'ancien Empire allemand et la Première Guerre mondiale sont dus à la monarchie, qui contrôlait continuellement le gouvernement et l'État, malgré les apparences démocratiques.\n\nCependant, la proposition visant à accorder à la maison de Hohenzollern des avantages fiscaux et une sécurité minimale a gagné du terrain, même auprès des figures de l'opposition, qui reconnaissent que la famille royale n'est pas près de disparaître et qu'il serait utile de la consacrer comme partie intégrante de la culture allemande, à l'instar des Britanniques, sans pour autant faire trop de sacrifices. Le seul facteur limitant est la possibilité pour Louis Ferdinand de se présenter à la présidence fédérale, même s'il n'est peut-être pas intéressé par cette opportunité malgré sa relative popularité auprès du public. Que fera le Bundestag ?"
 Hellwege58.3.d: "« Bonsoir. Je vous remercie de me permettre de prendre la parole lors de cette réunion de la section locale du Parti allemand. Ce soir, je souhaite vous parler d'une menace sérieuse qui pèse non seulement sur notre parti, mais aussi sur la démocratie dans son ensemble. L'influence et l'omniprésence du Parti socialiste du Reich, proche collaborateur de l'ancien Parti allemand de droite, le DRP, sont devenues dangereuses, constituant une menace pour notre peuple et pour le continent européen. Le Parti socialiste du Reich ne cache pas ses objectifs : des idéaux nazis clairs et présents, la restauration d'un Quatrième Reich et le retour aux politiques effroyables de l'époque précédente. »\n\n« Je ne nie pas que certains membres du SRP aient combattu vaillamment pendant la Première et la Seconde Guerre mondiale, mais ils ne sont pas aptes à occuper des fonctions officielles, en particulier en raison de leurs convictions radicales et dangereuses, qui vont à l'encontre non seulement du code moral de notre parti, mais aussi des convictions et de la volonté du peuple et de la République fédérale. »\n\n« Nous devons faire tout notre possible pour empêcher ces monstres d'usurper notre mouvement national légitime, comme ils l'ont fait dans les années 1930, et continuer à préserver la démocratie, le conservatisme et la sécurité de cette République fédérale, comme c'était le cas à l'époque. Pour cela, nous avons besoin de votre aide. La coopération de tous est nécessaire pour mener à bien cette entreprise. »\n\nHellwege a poursuivi son discours devant la section locale du parti, mais le message était clair pour tous, et pas seulement pour ceux qui étaient présents dans la salle : le DP n'est pas l'ami des néonazis."
 Hellwege58.4.d: "Alors que Ludwig Erhard entrait dans la salle de conférence de la Chancellerie fédérale, il affichait un mélange de solennité et d’agacement, ayant été convoqué la veille. En s’asseyant, il remarqua Hellwege à l’autre bout de la table, accompagné de Franz Blücher.\n\n« Eh bien, maintenant que je suis là, que puis-je faire pour vous ? » intona Erhard, fixant la table, se demandant toujours ce que Blücher faisait ici.\n\n« Eh bien, Ludwig, nous avons beaucoup entendu parler de vos idées économiques. Je sais que vous êtes dans le parti d’opposition, mais nos idéaux sont proches des vôtres et nous aimerions travailler avec vous et vous nommer ministre de l’Économie. » commença Hellwege. Blücher se tenait là, acquiesçant de la tête.\n\n« Qu’est-ce que j’y gagne, à part devenir ministre de l’Économie ? Apparemment, c’est votre façon de « coopérer avec l’opposition ». Voulez-vous vraiment me laisser l’autonomie sur la politique économique, ou allez-vous me contraindre à suivre vos inclinations monarchistes, Heinrich ? » répliqua Erhard avec un certain emportement, soulignant son mécontentement.\n\nBlücher intervint. « Herr Erhard. Nous nous connaissons depuis longtemps, et lorsque le chancelier Hellwege cherchait un ministre de l’Économie, je vous ai recommandé, sachant parfaitement quelle serait votre réaction et comment cela serait perçu par la CDU et le DP. Mais c’est une occasion exceptionnelle. Nous permettons à la CDU de définir la politique économique, car leurs idéaux économiques conservateurs et ordolibéraux sont les mêmes que les nôtres. La seule différence est que vous êtes beaucoup plus compétent que n’importe lequel de nos responsables DP, et vous pouvez appliquer la politique de manière beaucoup plus efficace. De plus, vous disposez de relations internationales précieuses. »\n\nErhard sembla s’adoucir, avant de reprendre. « Je vois. Eh bien, je suis intéressé, mais comme vous le savez probablement, je dois en délibérer avec les membres de mon parti avant d’accepter pleinement. Considérez ceci comme un oui informel, et je suppose que tout cela reste hors des dossiers officiels. »\n\n« Oui, Herr Erhard, c’est bien le cas. Nous vous remercions d’avance pour votre volonté de servir le gouvernement, et veuillez nous contacter lorsque vous aurez pris votre décision formelle. » Les trois hommes échangèrent une poignée de main, avant qu’Erhard ne quitte la pièce, vraisemblablement pour retourner au siège de la CDU."
 Hellwege58.5.d: "Madrid (AP) - Le chancelier ouest-allemand Heinrich Hellwege a atterri aujourd'hui à l'aéroport de Madrid-Barajas, marquant le début d'une visite de quatre jours dans l'Espagne franquiste. Ce qui n'est pas surprenant pour le gouvernement conservateur et nationaliste ouest-allemand, Hellwege prévoit de signer un accord visant à renforcer les relations bilatérales, ainsi que de visiter le palais royal de Madrid et d'autres bâtiments importants de la ville. Hellwege devrait également rencontrer le dirigeant espagnol, le généralissime Francisco Franco, ainsi que d'autres personnalités espagnoles et franquistes.\n\nPartageant largement les attitudes conservatrices et anticommunistes, la visite de Hellwege n'est guère surprenante pour la plupart des partis. La plupart des responsables du PD et de la CDU continuent d'approuver cette visite, qui permet de renforcer les relations bilatérales avec un autre allié anticommuniste européen, tandis que la petite faction social-démocrate continue de la dénoncer comme une capitulation devant les dictatures. Le public allemand reste toutefois imperturbable et continue de vaquer à ses occupations, indifférent à ces visites diplomatiques lapidaires."
 wgr.1.t: "Accepter l'Allemagne de l'Ouest au sein de l'OTAN"
 wgr.1.d: "L'Allemagne de l'Ouest nous a demandé de rejoindre l'OTAN. Allons-nous les accepter au sein de l'OTAN ? Cela faciliterait grandement notre coopération militaire."
 wgr.1.a: "Acceptez-les."
 wgr.1.b: "Pas d'anciens nazis à l'OTAN."
 wgr.2.t: "Retour en Allemagne"
 wgr.2.d: "L'Allemagne de l'Ouest nous a demandé de rejoindre la République fédérale d'Allemagne, mais notre économie est étroitement liée à celle de la France. Nous pourrions revenir en Allemagne ou nous rapprocher encore davantage de la France. Peut-être resterons-nous totalement indépendants ? Cela nécessite un référendum."
 wgr.2.a: "Retour en Allemagne"
 wgr.2.b: "Se rapprocher de la France"
 wgr.2.c: "Rester totalement indépendant"
 wgr.3.t: "Alsace-Lorraine à l'Allemagne"
 wgr.3.d: "L'Allemagne de l'Ouest et ses dirigeants fascistes veulent nous prendre l'Alsace-Lorraine par référendum. Nous ne pouvons pas les laisser s'emparer de notre territoire !"
 wgr.3.a: "Donnez-le à l'Allemagne"
 wgr.3.b: "Gardez-le"
 wgr.4.t: "L'Occident veut une réunification"
 wgr.4.d: "La République fédérale d'Allemagne est prête à une réunification sous son commandement. Nous ferons partie de l'Occident et romprons toutes relations diplomatiques avec l'Est. Mais après tout, l'Allemagne serait à nouveau unifiée."
 wgr.4.a: "Unissons-nous !"
 wgr.4.b: "Rester avec l'Est"
 wgr.9.t: "Nouveau Kaiser"
 wgr.9.d: "Il est temps de choisir notre nouveau Kaiser. Nous avons deux options : Louis Ferdinand, prince de Prusse, ou la princesse Victoria Louise de Prusse."
 wgr.9.a: "Hail Louis I"
 wgr.9.b: "Reine Victoria I"
 wgr.10.a: "Il restera en Allemagne de l'Ouest et c'est définitif."
 wgr.10.b: "Mettre en place un point d'extradition vers l'Allemagne de l'Est » wgr.10.t : « La République démocratique allemande réclame Werner Weinhold "
 wgr.10.d: "Nous avons reçu une demande de la République démocratique allemande (RDA) visant à obtenir l'extradition du garde-frontière est-allemand Werner Weinhold vers la RDA (République démocratique allemande). Elle affirme qu'il a assassiné deux soldats est-allemands avant de faire défection vers l'Ouest. Elle souhaite le traduire en justice et le juger. Werner Weinhold, bien qu'il ait tué deux soldats est-allemands, pourrait s'avérer précieux pour comprendre le fonctionnement interne des gardes-frontières est-allemands et les positions des soldats. Cependant, si nous le gardons ici, le gouvernement est-allemand ne sera pas satisfait. Nous devons prendre une décision concernant son extradition."
 wgr.202.d: "Les élections de 1961 sont arrivées. Pour la première fois, le SPD présente un candidat à la chancellerie qui n'est pas le président du parti : Willy Brandt, maire de Berlin-Ouest. Après la construction du mur de Berlin, il gagne de plus en plus de sympathie, tandis que le chancelier Konrad Adenauer est critiqué pour ne pas avoir suffisamment soutenu la population de Berlin-Ouest. Adenauer doit préserver la majorité absolue de la CDU et de la CSU, mais compte tenu de son âge et de la longueur de son mandat de chancelier, de sérieux doutes subsistent quant à l'opportunité de le voir diriger le pays pour un quatrième mandat."
 wgr.15.d: "Tout est désormais prêt pour l'unification. Bientôt, le Sozialdemokratische Partei Deutschlands et le Kommunistische Partei Deutschlands s'uniront pour œuvrer à la réalisation de l'objectif ultime."
 wgr.16.d: "Dernières nouvelles pour la République fédérale d'Allemagne. Le SDP et le KDP ont annoncé leur fusion. Le nouveau parti s'appelle Vereinigte Sozialistische Partei, ou Parti socialiste unifié. Les rapports officiels présentent cette fusion comme un regroupement volontaire des efforts des partis socialistes. Cependant, certains soupçonnent que la fusion a été plus difficile à réaliser qu'on ne veut bien le croire."
 wgr.17.t: "Loss of Der Alte"
 wgr.17.d: "Konrad Hermann Joseph Adenauer, notre premier chancelier, père du Wirtschaftswunder et homme très apprécié, est décédé dans sa maison familiale à Rhöndorf. Selon sa fille, ses derniers mots ont été « Da jitt et nix zo kriesche ! » (argot de Cologne signifiant « Il n'y a pas de quoi pleurer ! »). Ses funérailles nationales à la cathédrale de Cologne ont réuni un grand nombre d'invités internationaux. Cent quatre-vingts pays étaient représentés, dont quinze chefs d'État.\nAprès la messe de requiem et le service funéraire, sa dépouille fut transportée en amont vers Rhöndorf sur le Rhin à bord du Kondor, escorté par deux autres navires d'attaque rapides de classe Seeadler de la marine allemande, le Seeadler et le Sperber, « devant les milliers de personnes qui se tenaient en silence sur les deux rives du fleuve ». Il est inhumé au Waldfriedhof à Rhöndorf.\nLorsqu'on a demandé aux Allemands ce qu'ils admiraient le plus chez Adenauer, la majorité a répondu qu'il avait ramené les derniers prisonniers de guerre allemands de l'URSS, ce qui est devenu connu sous le nom de « Retour des 10 000 »."
 wgr.17.a: "Bleib du im ew'gen Leben (Reste dans la vie éternelle)"
 Ostpolitik.2.t: "Le traité de Varsovie"
 Ostpolitik.2.d: "Aujourd'hui marque une nouvelle victoire pour l'Ostpolitik. À Varsovie, le chancelier ouest-allemand [WGR.GetLeader] et le Premier ministre polonais Józef Cyrankiewicz ont signé le traité de Varsovie. Ce traité engage les deux parties à la non-violence et à accepter la frontière existante, la ligne Oder-Neisse, imposée à l'Allemagne par les puissances alliées lors de la conférence de Potsdam en 1945, après la fin de la Seconde Guerre mondiale.\nSi la Pologne se réjouit de cet accord, on ne peut pas en dire autant de l'Allemagne de l'Ouest. Là-bas, l'opposition a qualifié cette politique de trahison des intérêts nationaux. Au moment de la signature du traité, les commentateurs ouest-allemands ont cherché à faire valoir que celui-ci ne pouvait constituer un règlement définitif de la question frontalière avec la Pologne, car l'article IV stipulait que les traités antérieurs, tels que l'accord de Potsdam, n'étaient pas remplacés par ce dernier accord ; on pouvait donc soutenir que les dispositions de ce traité pouvaient être modifiées par un traité de paix définitif entre l'Allemagne et les Alliés de la Seconde Guerre mondiale, comme le prévoyait l'accord de Potsdam."
 SDP_60s.1.t: "Le SDP appelle à une Europe sans nucléaire"
 SDP_60s.1.d: "Le parti social-démocrate (SDP) au pouvoir en Allemagne de l'Ouest a annoncé qu'il appelait à une Europe sans nucléaire. Le gouvernement a déclaré que les peuples européens étaient depuis longtemps otages de la course aux armements nucléaires et des superpuissances qui déployaient ces armes dévastatrices à travers l'Europe. Cette annonce a recueilli le soutien non seulement des Allemands, mais aussi des Européens de tout le continent qui se sentaient impuissants face à la menace nucléaire. Au sein de l'OTAN, cette annonce a suscité un sentiment croissant de malaise. Certains gouvernements y sont favorable en privé, tandis que d'autres, en particulier les États-Unis, la considèrent comme un sabotage potentiel qui sape la défense de l'Europe. Certains groupes aux États-Unis vont même jusqu'à suggérer que cette annonce prouve que le SDP est un agent soviétique chargé de saboter l'OTAN de l'intérieur."
 Stammheim.1.t: "Ouverture de la prison de haute sécurité de Stammheim"
 Stammheim.1.d: "L'Allemagne de l'Ouest a ouvert une nouvelle prison de très haute sécurité à Stuttgart. Baptisée « prison de très haute sécurité de Stammheim », les autorités estiment qu'il s'agit de l'établissement pénitentiaire le plus sécurisé du pays. En effet, cette prison n'accueillera pas seulement des détenus, mais disposera également de son propre tribunal où les suspects pourront être jugés. Cela s'avérera particulièrement utile dans les affaires impliquant des organisations dangereuses, car celles-ci ne pourront pas interférer avec le processus judiciaire. Le nouveau directeur a fait remarquer que cette prison pourrait finir par être non seulement la plus sécurisée du pays, mais peut-être même du monde. Sa construction a duré quatre ans et elle devrait accueillir immédiatement certains des criminels et suspects les plus dangereux."
 WGRPolitical.1.t: "La Grande Coalition"
 WGRPolitical.1.d: "Avec la dissolution de la coalition de l'Union chrétienne-démocrate (CDU), celle-ci a annoncé la formation d'une grande coalition avec le Parti social-démocrate (SDP). Cela permettra de sauver le gouvernement, qui a perdu ses alliés de coalition, mais aussi de garantir que la coalition contrôle près de 90 % du Bundestag. Compte tenu des différences idéologiques entre les deux partis, on s'attend à ce que le gouvernement ait du mal à maintenir son contrôle. Pour la CDU, cela se traduira par une capacité plus fragile à faire adopter des lois et par davantage de compromis. Pour le SDP, cette annonce a suscité la colère des partisans les plus à gauche, qui considèrent la grande coalition comme une trahison des valeurs du parti. Les étudiants partisans du SDP ont exprimé leur indignation face à cette décision. Ils préparent déjà des manifestations et s'apprêtent à mener l'opposition à la coalition, mais le nouveau gouvernement estime qu'il sera en mesure de gérer cette dissidence."
 WGRPolitical.2.t: "La succession d'Adenauer"
 WGRPolitical.2.d: "Konrad Adenauer est rapidement devenu le principal homme politique de l'Allemagne de l'Ouest d'après-guerre. Après la guerre, il a tiré profit du fait d'avoir été renvoyé par les Britanniques pour avoir défendu sa position d'égalité avec les autorités alliées, ce qui lui a valu une légitimité nationale. Il a ensuite travaillé sans relâche pour faire de l'Union chrétienne-démocrate (CDU) le premier parti politique national. En tant que chancelier, il a défendu les normes et les libertés démocratiques. Cependant, il avait promis au pays de démissionner avant la fin de son dernier mandat et, à la suite de récents scandales, il ne peut se permettre de rester en fonction. Le principal candidat à sa succession est Ludwig Erhard, l'homme qui a supervisé la reprise économique et le développement du pays après la guerre. Bien que le chancelier Adenauer ait des doutes sur Erhard, la CDU est catégorique et Erhard est prêt à prendre la relève en tant que deuxième chancelier de l'Allemagne de l'Ouest."
 WGRPolitical.3.t: "Rupture entre le SDP et le SDS"
 WGRPolitical.3.d: "Le Parti social-démocrate d'Allemagne de l'Ouest (SDP) a officiellement annoncé sa séparation de l'Union socialiste des étudiants allemands (SDS). La SDS avait été créée peu après la fin de la Seconde Guerre mondiale en tant que branche universitaire du SDP. Cependant, depuis son indépendance, elle s'est constamment trouvée en désaccord avec l'institution mère. Plus précisément, la SDS s'est fermement opposée au réarmement de l'Allemagne de l'Ouest, soutenu par le SDP. En outre, le SDS a exprimé son inquiétude quant à la collaboration étroite du SDP avec des partis traditionnels dont les idéologies sont opposées aux principes politiques du SDP. Le SDP a annoncé qu'il expulserait immédiatement tous les membres du SDS de ses rangs. Le SDS a déclaré qu'il agirait dans l'intérêt du peuple allemand et des travailleurs et qu'il ne compromettrait pas ses valeurs pour des gains politiques ou des intérêts étrangers. D'autres membres plus à gauche du SDP devraient changer d'allégeance."
 Elysee.1.t: "Le traité de l'Élysée"
 Elysee.1.d: "Le président français et le chancelier ouest-allemand ont signé aujourd'hui à Paris le traité de l'Élysée. Ce traité vise à mettre fin à plusieurs décennies de conflits et de rivalités entre les deux puissances continentales européennes. Les deux États ont été engagés dans de multiples conflits armés depuis le XIXe siècle jusqu'à la Seconde Guerre mondiale. Le traité prévoit des réunions régulières entre les deux États. Les chefs d'État doivent se rencontrer régulièrement et un comité interministériel coordonnera la coopération entre les deux États. Les deux nations doivent également coordonner leur coopération en matière de défense et de diplomatie. Les citoyens des deux pays saluent ce traité et attendent avec impatience une nouvelle ère de paix et de coopération entre les deux plus importantes puissances terrestres d'Europe. Le gouvernement français espère que cela conduira à l'établissement d'une alliance plus étroite pour contrer l'hégémonie soviétique et américaine, mais seul le temps dira si l'Allemagne de l'Ouest partagera cet objectif à long terme."
 Ostpolitik.3.d: "Le gouvernement ouest-allemand et l'Union soviétique ont récemment conclu un nouveau traité appelé le Traité de Moscou. Les deux gouvernements ont convenu de normaliser leurs relations. Ils se sont également engagés à maintenir la paix internationale, à renoncer à l'usage des armes et à respecter les frontières établies après la Seconde Guerre mondiale. Ce traité reflète la nouvelle politique d'Ostpolitik mise en œuvre par l'actuel gouvernement allemand. En signant ce traité, l'Allemagne de l'Ouest a accepté sa frontière avec l'Allemagne de l'Est et ne fait pour l'instant pas pression pour l'autodétermination allemande. Plus important encore, le gouvernement a accepté que la Pologne contrôle la majeure partie de l'ancienne Prusse orientale. Beaucoup en Allemagne de l'Ouest se sont déclarés satisfaits de la réduction des tensions, mais certains sont mécontents du sacrifice des frontières allemandes et de l'autodétermination. Les États-Unis ont fait part de leurs inquiétudes concernant ce traité."
 WGR_Pol.1.d: "Après la Seconde Guerre mondiale, les puissances alliées ont convenu de céder la Prusse orientale historique à la Pologne. L'Union soviétique a mis en œuvre cette décision, garantissant l'acceptation de l'Allemagne de l'Est. Cependant, l'Allemagne de l'Ouest a déclaré que l'accord d'après-guerre devait être décidé à une date ultérieure et que l'occupation polonaise n'était pas confirmée. Aujourd'hui, le gouvernement ouest-allemand a réitéré ses revendications sur la Prusse orientale et déclaré que la réunification allemande incluait la restauration de la Prusse orientale au sein de la nation. L'Union soviétique et la Pologne ont toutes deux qualifié cette déclaration de provocatrice et d'indication que l'Allemagne de l'Ouest nourrissait des aspirations territoriales fascistes qui menaçaient la paix en Europe. L'annonce de l'Allemagne de l'Ouest a reçu le soutien de nombreux citoyens, mais une grande partie de la population estime qu'elle est beaucoup trop provocatrice dans le contexte politique actuel."
 RedArmyFaction.20.t: "Le procès de Stammheim"
 RedArmyFaction.20.d: "La Fraction armée rouge (RAF) est une organisation militante d'extrême gauche qui mène des attaques à travers l'Allemagne de l'Ouest. La récente escalade de violence, d'enlèvements et d'assassinats a plongé l'Allemagne de l'Ouest dans une crise nationale. Beaucoup d'Allemands soupçonnent désormais les partis traditionnels de gauche d'avoir des liens idéologiques avec les militants. Dans ce contexte tendu, il a été décidé de lancer une offensive contre la RAF. Les forces de sécurité redoubleront d'efforts pour arrêter les membres et démanteler l'organisation. Les membres de la RAF arrêtés seront détenus dans un isolement total, à l'abri des médias, et ne seront pas autorisés à faire de déclarations publiques. Cet isolement strict inclura également l'interdiction pour les membres de rencontrer leurs avocats ou leur famille. Bien que de nombreux Allemands applaudissent cette répression, beaucoup craignent que la suppression des droits des membres de la RAF ne reflète trop le passé autoritaire que l'Allemagne a tenté de laisser derrière elle."
 Ostpolitik.4.d: "À Erfurt, les dirigeants de l'Allemagne de l'Ouest ont rencontré pour la première fois ceux de l'Allemagne de l'Est. La réunion a été qualifiée de succès, les deux parties ayant convenu de la nécessité d'une meilleure communication et exprimé leur volonté de désescalade. Ce sommet devrait déboucher sur davantage d'échanges, l'objectif final étant la normalisation des relations entre les deux nations allemandes. Bien que ce sommet soit salué comme un élément clé pour parvenir à une paix durable et à une éventuelle réunification, de nombreux opposants en Allemagne de l'Ouest ont exprimé leur indignation. Ils affirment que cette rencontre légitime le régime est-allemand et ne fera que conduire à une division plus permanente de l'Allemagne. Ils qualifient ce sommet de trahison du peuple allemand. Quoi qu'il en soit, ce sommet semble être un succès pour les efforts de l'Allemagne de l'Ouest dans la mise en œuvre de l'Ostpolitik, une politique visant à apaiser les tensions et à normaliser les relations entre l'Allemagne de l'Ouest et l'Europe de l'Est."
 WGR_Viet.1.d: "Aujourd'hui, la République fédérale d'Allemagne a annoncé qu'elle retirerait toutes ses livraisons de munitions et son soutien au conflit vietnamien en Asie du Sud-Est. À l'origine, les Allemands soutenaient le Sud-Vietnam démocratique contre les communistes du Nord, mais ils ont déclaré que le soutien à une telle guerre avait affaibli la République fédérale tant sur le plan économique que militaire et que, si une guerre venait à éclater avec l'Allemagne de l'Est communiste, ils seraient impuissants. Beaucoup pensent qu'une telle décision ne changera guère l'issue du conflit vietnamien, mais elle a tout de même un impact sur les relations entre les deux pays."
 Spiegal_Affair.1.d: "L'affaire Spiegel s'est terminée aujourd'hui avec la démission de Franz Strauss, ministre de la Défense. Il y a plusieurs mois, le journal Der Spiegel a rapporté qu'un haut responsable de l'OTAN avait qualifié l'armée ouest-allemande d'incapable de défendre le pays. Cela a incité Strauss à envoyer la police occuper le journal, à arrêter son personnel et à faire arrêter l'auteur de l'article à Madrid par la police espagnole. Il affirmait que le journal avait révélé des secrets d'État, mais le public a réagi en organisant des manifestations contre l'approche autoritaire de Strauss. Ce dernier n'a finalement pas réussi à convaincre un tribunal de poursuivre le journal et, au contraire, le tribunal l'a accusé d'avoir outrepassé ses pouvoirs. Strauss a choisi de quitter ses fonctions pour sauver le gouvernement et Der Spiegel a été libéré de l'occupation policière. Beaucoup en Allemagne de l'Ouest considèrent cela comme une victoire pour la démocratie et la liberté de la presse."
 Europe_Space.1.d: "En Allemagne de l'Ouest, le Centre européen d'opérations spatiales est devenu opérationnel cette semaine. Situé à Darmstadt, ce centre servira de centre de contrôle des missions pour l'Organisation européenne de recherche spatiale (ESRO). L'ESRO a été fondée par dix États d'Europe occidentale afin de permettre à l'Europe de participer à la course spatiale internationale en plein essor. Ces États mettent en commun leurs ressources et leur expertise pour propulser l'Europe vers de nouveaux horizons. Depuis son nouveau centre de contrôle des missions, l'ESRO espère gérer et coordonner les opérations futures. Beaucoup en Allemagne de l'Ouest sont fiers d'accueillir cette nouvelle installation et estiment que cela reflète l'importance que les Allemands ont eue dans l'avancement de la recherche spatiale depuis ses débuts. Les attentes sont grandes quant au fait que le Centre européen d'opérations spatiales lancera bientôt des missions dans l'espace avec un niveau de sophistication équivalent à celui des autres puissances engagées dans la course à l'espace."
