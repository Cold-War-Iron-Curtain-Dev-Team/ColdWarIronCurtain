 CDU_Christian_Democracy: "Démocratie chrétienne"
 CDU_Christian_Democracy_desc: "£Ideology_CDU_Christian_Democracy_pic\n\n\n\n\n\n\n\n\nS'appuyant à la fois sur la doctrine sociale catholique et protestante, l'Union chrétienne-démocrate est sortie des ruines de la Seconde Guerre mondiale comme une nouvelle force unificatrice. En tant que Volkspartei interconfessionnelle, elle a puisé sa force dans une large coalition regroupant la classe moyenne urbaine, les conservateurs ruraux et tous ceux qui recherchaient une alternative stable et morale aux extrêmes du nazisme et du communisme. Elle défendait une démocratie guidée par l'éthique chrétienne, plaçant la dignité individuelle, la famille et les principes d'une économie sociale de marché au centre de la reconstruction nationale.\n\nLes unionistes ont joué un rôle décisif dans l'élaboration de la Loi fondamentale de l'Allemagne de l'Ouest, le lancement du Wirtschaftswunder et l'ancrage solide de la nouvelle république dans l'alliance occidentale. Rejetant les conflits de classe, l'« économie sociale de marché » du parti favorise un partenariat unique entre la libre entreprise et la protection sociale, définissant l'identité de la nation après la guerre."
 POLITICS_LANGKEIT_DESC: "§gNé en Prusse orientale, Willy Langkeit a grandi dans un milieu rural avant de rejoindre la Reichswehr à l'âge de 17 ans. Sa fascination pour la guerre mécanisée l'a conduit à rejoindre les forces blindées émergentes, où il s'est rapidement distingué comme un commandant compétent et innovant. Pendant la Seconde Guerre mondiale, Langkeit a gravi les échelons, remportant de nombreuses distinctions pour son leadership dans des batailles décisives sur le front oriental, notamment à Stalingrad et lors de la défense de la Prusse orientale. À la fin de la guerre, il avait atteint le grade de Generalmajor et commandait la Panzergrenadier-Division « Kurmark », qu'il a menée à la sortie de la poche de Halbe en 1945 avant de se rendre aux forces américaines.\n\nAprès avoir passé plusieurs années en captivité aux États-Unis, Langkeit est retourné en Allemagne et a fini par rejoindre le Bundesgrenzschutz. En tant que l'un de ses hauts responsables, il joue un rôle clé dans le développement de l'organisation pendant ses premières années, en mettant l'accent sur la discipline et la formation professionnelle.§!"
 POLITICS_RUGE_DESC: "§gNé à Leipzig en 1894, Friedrich Ruge s'engage dans la marine impériale en 1914 et participe à la Première Guerre mondiale à bord de navires de guerre et de torpilleurs, ce qui lui vaut la Croix de fer. Resté dans la Reichsmarine après la guerre, il se spécialise dans la guerre des mines et maîtrise plusieurs langues, se forgeant une réputation d'officier techniquement compétent et visionnaire. Pendant la Seconde Guerre mondiale, Ruge commanda les forces de dragage de mines dans la mer Baltique et la mer du Nord, ce qui lui valut la Croix de chevalier pour une audacieuse traversée diurne du détroit de Douvres. Il servit ensuite comme conseiller naval du maréchal Rommel en Normandie et comme chef de la construction navale.\n\nAprès sa libération de captivité britannique en 1946, il travailla comme traducteur et rejoignit l'équipe historique de la marine américaine, contribuant à jeter les bases de la marine ouest-allemande.§!"
 Kurt_Schumacher_WGR_AFTER_STROKE_desc: "Né à Kulm, en Prusse occidentale, Kurt Schumacher a été profondément influencé par les troubles qui ont agité l'Allemagne au début du XXe siècle. Adhérant au Parti social-démocrate dès sa jeunesse, il s'est rapidement fait connaître comme un ardent défenseur de la démocratie et des droits des travailleurs. Soldat décoré pendant la Première Guerre mondiale, Schumacher est rentré chez lui désabusé par le militarisme et est devenu un fervent opposant à l'extrémisme de droite pendant la République de Weimar. En tant que député au Reichstag, il a été l'un des critiques les plus virulents du mouvement nazi naissant, refusant tout compromis même lorsque la violence politique s'est intensifiée.\n\nAprès l'arrivée au pouvoir d'Hitler en 1933, Schumacher fut arrêté par la Gestapo et passa plus d'une décennie dans les camps de concentration nazis, où il endura des conditions brutales qui le laissèrent physiquement affaibli, mais sans briser son moral. Libéré en 1945, il s'est immédiatement attelé à la tâche monumentale de reconstruire le SPD dans l'Allemagne d'après-guerre. Rejetant à la fois les influences communistes et conservatrices, il s'est positionné comme la figure de proue du socialisme démocratique, s'opposant farouchement aux pressions soviétiques et occidentales. En 1949, Schumacher était devenu l'un des hommes politiques les plus influents de l'Allemagne de l'Ouest, vouant sa carrière à la construction d'une Allemagne forte et indépendante, fondée sur la justice sociale et la démocratie.\n\nAprès s'être « remis » de son AVC, Schumacher est retourné à la Chancellerie pour reprendre ses fonctions. Cependant, ses assistants rapportent qu'il continue de cracher du sang et qu'il souffre d'insomnie. À l'heure actuelle, on ne sait pas si Schumacher quittera ses fonctions à la fin de son mandat ou s'il succombera à son état de santé."
 POLITICS_ERICH_OLLENHAUER_DESC: "Ollenhauer est né à Magdebourg dans une famille ouvrière et fut attiré par le socialisme dès son plus jeune âge, rejoignant la branche jeunesse du Parti social-démocrate avant même d’avoir terminé ses études. Défenseur convaincu des droits des travailleurs et de la justice sociale, il s’exila après la prise de pouvoir des nazis en 1933, poursuivant le combat pour le socialisme démocratique depuis l’étranger. Passant une grande partie de son exil en Grande-Bretagne, il travailla étroitement avec d’autres exilés du SPD afin de préserver la structure organisationnelle du parti et de préparer son retour en Allemagne après la guerre.\n\nDe retour dans sa patrie en 1946, Ollenhauer devint rapidement l’un des plus proches alliés de Kurt Schumacher, contribuant à reconstruire le SPD comme une force majeure de la politique allemande d’après-guerre. Tandis que Schumacher adoptait une position fermement nationaliste et favorable au réarmement, Ollenhauer se situait plus à gauche, plaidant pour une Allemagne neutre, affranchie à la fois du contrôle occidental et soviétique. Sa vision pour le SPD mettait fortement l’accent sur la justice sociale, les droits des travailleurs et la planification économique, ce qui l’opposait souvent à la faction pro-occidentale du parti dirigée par des figures comme Egon Franke.\n\nAprès l’accident vasculaire cérébral débilitant de Schumacher en 1951, Ollenhauer fut nommé dirigeant par intérim, assumant ce rôle à un moment de grande incertitude. Alors que le retour éventuel de Schumacher demeure incertain, Ollenhauer doit naviguer au sein d’un SPD de plus en plus divisé — partagé entre sa vision d’un socialisme de gauche et l’influence croissante des modérés pro-occidentaux."
 POLITICS_EGON_FRANKE_DESC: "Le Hanovrien Egon Franke atteignit l’âge adulte durant les années tumultueuses de la fin de la République de Weimar, étant témoin direct de l’effondrement de la démocratie allemande et de la montée du totalitarisme. Social-démocrate convaincu dès sa jeunesse, Franke survécut à l’époque nazie dans la résistance clandestine, maintenant des contacts avec des réseaux antifascistes malgré le danger permanent. Après la guerre, il émergea comme l’un des principaux architectes de la reconstruction de l’Allemagne de l’Ouest, convaincu que l’avenir du SPD résidait dans un alignement ferme avec les Alliés occidentaux et dans l’établissement d’une démocratie forte orientée vers l’économie de marché.\n\nProche allié des éléments pro-occidentaux et modérés au sein du SPD, Franke rejeta l’idée de la neutralité allemande, considérant que l’intégration à l’Occident constituait la seule voie viable vers la reprise économique et la sécurité. Tandis que son collègue Erich Ollenhauer plaidait pour une orientation plus à gauche et plus socialiste, Franke appartenait à l’aile droite du SPD, défendant la Westbindung (intégration occidentale), le réarmement et une coopération étroite avec l’OTAN.\n\nAvec Kurt Schumacher frappé d’incapacité après son accident vasculaire cérébral en 1951, Franke se positionne comme la principale figure d’opposition à Erich Ollenhauer, représentant la faction modérée et pro-occidentale du SPD. Il soutient que la social-démocratie et l’intégration occidentale ne sont pas incompatibles, estimant que la prospérité économique et la stabilité démocratique ne peuvent être atteintes que par la participation à l’alliance occidentale."
 POLITICS_MANSTEIN_DESC: "§gMaréchal de camp décoré de la Wehrmacht, il joua un rôle déterminant dans certaines des campagnes militaires les plus importantes de l’Allemagne, mais fut mis à l’écart durant les dernières années de la Seconde Guerre mondiale. Capturé puis jugé pour crimes de guerre, Manstein fut libéré au début des années 1950, lorsque les tensions de la guerre froide rendirent à nouveau précieuse son expertise militaire.\n\nLorsque le gouvernement dirigé par le KPD, élu en 1949, commença à démanteler les institutions démocratiques et à s’aligner sur le bloc soviétique, les forces d’opposition au sein de l’armée et de l’élite politique s’alarmeront. Craignant la transformation de l’Allemagne de l’Ouest en un État marxiste et une unification forcée avec l’Est sous un régime communiste, Manstein émergea comme le chef d’une junte militaire déterminée à préserver la souveraineté allemande et à empêcher l’instauration d’un régime totalitaire.\n\nSon pouvoir, bien qu’autoritaire, se présente comme une mesure temporaire, une sauvegarde d’urgence contre la soumission communiste. Alors que les tensions de la guerre froide atteignent leur paroxysme, son leadership garantit que l’Allemagne de l’Ouest restera un bastion de l’anticommunisme dans une Europe divisée."
