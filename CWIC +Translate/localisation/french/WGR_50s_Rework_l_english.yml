 WGR_Reconstruction_of_Germany_Decisions: "La reconstruction de l'Allemagne"
 WGR_Reconstruction_of_Germany_Decisions_desc: "\n\n\n\n\n\n£WGR_Reconstruction\n\n\n\n\n\n\n\nLa guerre a laissé l'Allemagne en ruines, avec des villes entières réduites à l'état de décombres et des infrastructures pratiquement inexistantes. Les usines, les routes et les chemins de fer ont été détruits, et des millions de personnes ont été confrontées au déplacement, à la faim et à l'incertitude. Aujourd'hui, alors que la poussière retombe, la tâche monumentale de la reconstruction commence. Le déblaiement des décombres n'est que la première étape : la restauration de l'industrie, la reconstruction des maisons et le rétablissement des services essentiels nécessiteront des efforts, une coordination et des sacrifices considérables.\n"
