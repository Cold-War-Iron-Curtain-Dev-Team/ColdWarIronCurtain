 WGR_1949_election_category: "Les retombées des élections au Bundestag"
 WGR_1949_election_category_desc: "\nPour la première fois en douze ans, les Allemands se sont rendus aux urnes pour élire leurs représentants, qui façonneront l'avenir de l'Allemagne au sein du Bundestag nouvellement créé, héritier institutionnel du Reichstag de l'Empire allemand et de la Première République. La lutte acharnée entre les sociaux-démocrates et les chrétiens-démocrates s'est soldée par la victoire de Konrad Adenauer, qui occupera désormais le poste de chancelier allemand pour les quatre prochaines années.\n\nLe Bundestag exige des coalitions majoritaires pour l'adoption des lois, ce qui signifie qu'Adenauer a besoin d'au moins 202 des 402 sièges pour obtenir le soutien nécessaire. Le moment est désormais venu de tendre la main aux autres partis disposés à soutenir les politiques d'Adenauer, en faisant des promesses et en trouvant des compromis qui profiteront aux deux parties.\n\n§C202§! sièges sont nécessaires pour une majorité. Les résultats des élections sont les suivants :\n\n§RParti communiste d’Allemagne (KPD)§! : 15\n§SParti social-démocrate d’Allemagne (SPD)§! : 131\n§9Association pour la reconstruction économique (WAV)§! : 12\n§mParti démocrate libre (FDP)§! : 52\n§4Parti bavarois (BP)§! : 17\n§gIndépendants §! : 5\n§cParti allemand (DP)§! : 17\n§PUnion chrétienne-démocrate (CDU/CSU)§! : 139\n§BZentrum§! : 10\n§NParti conservateur allemand – Parti de la droite allemande (DKP-DRP)§! : 5\n\nPartenaires actuels de la coalition : [WGR_AdenauerCoalitionPartnersStatus1949]"
 WGR_Adenauer_1953_election_category: "Élections au Bundestag de 1953"
 WGR_Adenauer_1953_election_category_desc: "\nOn a peut-être du mal à s'en rendre compte, mais quatre ans se sont déjà écoulés depuis les premières élections fédérales, et les chrétiens-démocrates bénéficient d'un soutien populaire que même l'ancien Zentrum n'avait pas atteint à son apogée, il y a 80 ans. Les sociaux-démocrates se retrouvent une nouvelle fois dans l'opposition, tandis que Konrad Adenauer entame un nouveau mandat de quatre ans à la tête du gouvernement allemand.\n\nLe Bundestag exige des coalitions majoritaires pour l'adoption des lois, ce qui signifie qu'Adenauer a besoin d'au moins 255 des 509 sièges actuels pour faire passer son programme. À cela s'ajoute l'introduction de la clause des 5 %, qui impose aux partis politiques d'obtenir au moins 5 % des voix ou de remporter un mandat dans une circonscription électorale. Une autre nouveauté a été le second vote, permettant aux électeurs de voter pour un candidat local supplémentaire. Le moment est à nouveau venu de tendre la main aux autres partis disposés à soutenir les politiques d'Adenauer, en faisant des promesses et en trouvant des compromis qui profiteront aux deux parties.\n\n§C255§! sièges sont nécessaires pour une majorité. Les résultats des élections sont les suivants :\n\n§SParti social-démocrate d’Allemagne (SPD)§! : 162\n§LBloc pan-allemand/Association des anciens combattants et des déplacés (GB/BHE)§! : 27\n§mParti démocrate libre (FDP)§! : 53\n§cParti allemand (DP)§! : 15\n§PUnion chrétienne-démocrate (CDU/CSU)§! : 249\n§BZentrum§! : 3\n\nPartenaires actuels de la coalition : [WGR_AdenauerCoalitionPartnersStatus1953]"
 WGR_Adenauer_1957_election_category: "Élections au Bundestag de 1957"
 WGR_Adenauer_1957_election_category_desc: "\nQuatre années se sont écoulées, et le peuple allemand est à nouveau appelé aux urnes. Les experts prédisent que les chrétiens-démocrates vont renforcer leur soutien, grâce aux politiques populaires d’Adenauer, notamment le retour des « Heimkehrer », la réintégration de la Sarre en Allemagne, ainsi que la réforme des retraites de 1957. Cependant, pour la première fois dans l'histoire de l'Allemagne, un parti politique a recueilli plus de 50 % des suffrages exprimés, ce qui signifie que la CDU pourrait former un gouvernement à parti unique pour les quatre prochaines années. Les sociaux-démocrates se retrouvent une nouvelle fois dans l'opposition, tandis que Konrad Adenauer entame un nouveau mandat de quatre ans à la tête du gouvernement allemand.\n\nLe Bundestag exige des coalitions majoritaires pour l'adoption des lois, ce qui signifie qu'Adenauer a besoin d'au moins 260 des 519 sièges actuels pour faire passer son programme.\n\n§C260§! sièges sont nécessaires pour une majorité. Les résultats des élections sont les suivants :\n\n§SParti social-démocrate d’Allemagne (SPD)§! : 181\n§mParti démocrate libre (FDP)§! : 43\n§cParti allemand (DP)§! : 17\n§PUnion chrétienne-démocrate (CDU/CSU)§! : 277\n\nPartenaires actuels de la coalition : [WGR_AdenauerCoalitionPartnersStatus1957]"
