 WGR_sub_hull_small_single_0: "Classe 201"
 WGR_sub_hull_small_single_0_desc: "Le Type 201 fut la première classe de sous-marins allemands construite après la Seconde Guerre mondiale. Ils étaient construits en acier amagnétique afin de contrer la menace des mines navales magnétiques, mais le matériau n'avait pas été suffisamment testé et s'avéra problématique lors de son utilisation par la Bundesmarine."
 WGR_sub_hull_small_single_1: "Classe 205"
 WGR_sub_hull_small_single_1_desc: "Le Type 205 était une classe de sous-marins diesel-électriques allemands. Il s'agissait de navires à coque simple optimisés pour une utilisation dans les eaux peu profondes de la mer Baltique. Le Type 205 est une évolution directe de la classe Type 201, avec une coque allongée, de nouvelles machines et de nouveaux capteurs. La plus grande différence réside toutefois dans l'utilisation d'acier ST-52 pour la coque pressurisée, l'acier non magnétique du Type 201 s'étant avéré problématique."
 WGR_sub_hull_small_single_2: "Classe 206A"
 WGR_sub_hull_small_single_2_desc: "Le Type 206 est une classe de sous-marins diesel-électriques (U-boots) développée par Howaldtswerke-Deutsche Werft (HDW). Sa conception est basée sur la classe de sous-marins Type 205 qui l'a précédée. Ces sous-marins petits et agiles ont été construits pendant la guerre froide pour opérer dans les eaux peu profondes de la mer Baltique et attaquer les navires du Pacte de Varsovie en cas de confrontation militaire."
 WGR_sub_hull_small_single_3: "212A Classe Lot I"
 WGR_sub_hull_small_single_3_desc: "La classe allemande Type 212 est un sous-marin diesel-électrique développé par Howaldtswerke-Deutsche Werft AG (HDW) pour les marines allemande et italienne. Il est équipé d'une propulsion diesel et d'un système de propulsion indépendant de l'air (AIP) supplémentaire utilisant des piles à combustible à hydrogène comprimé à membrane échangeuse de protons (PEM) de Siemens."
 WGR_sub_hull_small_single_4: "212A Classe Lot II"
 WGR_sub_hull_small_single_4_desc: "La classe allemande Type 212 est un sous-marin diesel-électrique développé par Howaldtswerke-Deutsche Werft AG (HDW) pour les marines allemande et italienne. Il est équipé d'une propulsion diesel et d'un système de propulsion indépendant de l'air (AIP) supplémentaire utilisant des piles à combustible à hydrogène comprimé à membrane échangeuse de protons (PEM) de Siemens."
 WGR_sub_hull_large_single_0: "Classe Type XXI"
 WGR_sub_hull_large_single_0_desc: "Les sous-marins de type XXI étaient une classe de sous-marins diesel-électriques Elektroboot allemands conçus pendant la Seconde Guerre mondiale. Cent dix-huit ont été construits, dont quatre étaient prêts au combat. Pendant la guerre, seuls deux ont été mis en service actif et ont effectué des patrouilles, mais ils n'ont pas été utilisés au combat."
 WGR_screen_hull_medium_1: "F120 Classe Cologne"
 WGR_screen_hull_medium_1_short: "F120 Cologne"
 WGR_screen_hull_medium_1_desc: "Les navires de la classe F120 Köln ont été les premiers grands navires de guerre construits en Allemagne après la Seconde Guerre mondiale. Ils ont été les premiers navires au monde à être équipés d'un système de propulsion combiné diesel et gaz. Au cours de leur longue carrière, ces navires ont fait l'objet de nombreuses rénovations et ont été équipés de nouveaux systèmes électroniques et de nouveaux tubes lance-torpilles. Ils ont été remplacés par des frégates de type 122 dans les années 1980 et quatre navires ont été vendus à la marine turque."
 WGR_screen_hull_medium_2: "Classe F122 Bremen"
 WGR_screen_hull_medium_2_short: "F122 Bremen"
 WGR_screen_hull_medium_2_desc: "Les huit frégates de classe F122 Bremen de la marine allemande sont une série de frégates mises en service entre 1982 et 1990. Leur conception s'inspire de la classe Kortenaer néerlandaise, qui a fait ses preuves et est réputée pour sa robustesse, mais elles utilisent un système de propulsion et une configuration de hangar différents."
 WGR_screen_hull_medium_3: "Classe F123 Brandenburg"
 WGR_screen_hull_medium_3_short: "F123 Brandenburg"
 WGR_screen_hull_medium_3_desc: "La classe F123 Brandenburg est une classe de frégates allemandes. Elles ont été commandées par la marine allemande en juin 1989 et ont été achevées et mises en service entre 1994 et 1996, remplaçant les destroyers de la classe Hamburg. Ces navires sont principalement destinés à la lutte anti-sous-marine (ASW)."
 WGR_screen_hull_medium_4: "Classe F124 Sachsen"
 WGR_screen_hull_medium_4_short: "F124 Sachsen"
 WGR_screen_hull_medium_4_desc: "La classe F124 Sachsen est la dernière classe de frégates de défense aérienne hautement sophistiquées de la marine allemande. La conception de la frégate de classe Sachsen s'inspire de celle de la classe F123 Brandenburg, mais avec des caractéristiques furtives améliorées conçues pour tromper les radars et les capteurs acoustiques de l'adversaire. Cette classe intègre un radar multifonction avancé APAR et un radar longue portée SMART-L qui serait capable de détecter les avions et les missiles furtifs."
 WGR_screen_hull_heavy_0: "Classe 119 Zerstörer-1"
 WGR_screen_hull_heavy_0_short: "119 Zerstorer-1"
 WGR_screen_hull_heavy_0_desc: "La classe Type 119 Zerstörer 1 était une classe de 6 destroyers de la marine ouest-allemande. Ils sont entrés en service en 1958, le dernier ayant été désarmé en 1982. Comme elle ne disposait pas du temps nécessaire pour planifier, construire et tester ses propres navires de plus grande taille, la République fédérale d'Allemagne a reçu six destroyers de classe Fletcher pour la marine allemande des États-Unis entre 1958 et 1960 dans le cadre du Mutual Defense Assistant Act."
 WGR_screen_hull_heavy_1: "Classe 101 Hamburg"
 WGR_screen_hull_heavy_1_short: "101 Hamburg"
 WGR_screen_hull_heavy_1_desc: "La classe Type 101 Hamburg était la seule classe de destroyers construite pendant l'après-guerre en Allemagne. Ils étaient spécialement conçus pour opérer en mer Baltique, où l'armement et la vitesse sont plus importants que la navigabilité."
 WGR_screen_hull_heavy_2: "Classe 103B Lütjens"
 WGR_screen_hull_heavy_2_short: "103B Lutjens"
 WGR_screen_hull_heavy_2_desc: "La classe Lütjens de type 103 fut la dernière classe de destroyers en service dans la marine allemande. Ces navires étaient des destroyers lance-missiles américains de classe Charles F. Adams, mais ils avaient subi quelques modifications afin de répondre aux exigences allemandes."
 WGR_screen_hull_heavy_3: "Remise en état de classe I 103B Lütjens"
 WGR_screen_hull_heavy_3_short: "103B Lutjens Réaménagement I"
 WGR_screen_hull_heavy_3_desc: "La classe Lütjens de type 103 fut la dernière classe de destroyers en service dans la marine allemande. Ces navires étaient des destroyers lance-missiles américains de classe Charles F. Adams, mais ils avaient subi quelques modifications afin de répondre aux exigences allemandes."
 WGR_screen_hull_heavy_4: "Classe 125 Baden-Württemberg"
 WGR_screen_hull_heavy_4_short: "125 Baden-Wurttemberg"
 WGR_screen_hull_heavy_4_desc: "Les frégates de classe F125 Baden-Württemberg sont une série de frégates de la marine allemande, conçues et construites par ARGE F125, une coentreprise entre Thyssen-Krupp et Lürssen. La classe Baden-Württemberg possède le déplacement le plus lourd de toutes les classes de frégates au monde."
 WGR_battle_hull_light_1: "Classe 440 Deutschland"
 WGR_battle_hull_light_1_short: "440 Deutschland"
 WGR_battle_hull_light_1_desc: "Le Deutschland (A59) était un navire de guerre de la Bundesmarine, la marine ouest-allemande. Il a été construit et utilisé comme navire-école (« Schulschiff ») en temps de paix et était destiné à remplir plusieurs missions en cas de guerre, notamment comme navire de transport de troupes, navire-hôpital, mouilleur de mines et navire d'escorte."
