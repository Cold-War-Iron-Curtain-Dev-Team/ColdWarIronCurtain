 WGR_SPD_BUNDESTAG_1957_1_DESC_GUI: "Quatre années se sont déjà écoulées, et le peuple allemand se rend une nouvelle fois aux urnes pour élire les députés qui le représenteront au Bundestag. Les sociaux-démocrates bénéficient toujours d’un large soutien populaire, notamment grâce aux politiques menées par Egon Franke en matière d’assurance sociale, de sécularisation et de retour de la Sarre. Les chrétiens-démocrates ont de nouveau été relégués dans l'opposition, mais le chancelier Franke pourrait être ouvert à une certaine coopération.\n\nLe Bundestag exige des coalitions majoritaires pour adopter des lois, ce qui signifie que Franke a besoin d'au moins 260 des 519 sièges actuels pour soutenir son programme. À cela s'ajoute l'introduction du vote par correspondance, pratique pour les citoyens allemands travaillant à l'étranger. Le moment est à nouveau venu de tendre la main aux autres partis disposés à soutenir les politiques de Franke, en faisant des promesses et en trouvant des compromis qui profiteront aux deux parties.\n\n§C260§! sièges sont nécessaires pour obtenir la majorité. Les résultats des élections sont les suivants :"
