 WGR_CDU_Reach_out_to_FDP_1953: "Y compris le Freie Demokraten (FD)"
 WGR_CDU_Reach_out_to_FDP_1953_desc: "Nous pourrions obtenir une majorité suffisante pour gouverner avec le Bloc panallemand (BHE) et le Parti allemand (DP) uniquement. Cela laisserait entrevoir un gouvernement plus facile à gérer, avec des partenaires plus dociles. Cependant, cette voie manque de vision à long terme et comporte des risques. Avec le FDP à nos côtés, nous pouvons obtenir une majorité des deux tiers au Bundestag, ce qui nous permettrait de modifier la Constitution sans l'accord des sociaux-démocrates."
