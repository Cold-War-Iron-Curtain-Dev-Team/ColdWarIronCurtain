 NLF_rev_cohesion: "Cohésion révolutionnaire"
 NLF_rev_cohesion_desc: "Malgré l'éloignement du commandement central situé au Nord, les cadres du Sud conservent une unité idéologique et organisationnelle à toute épreuve, ce qui leur permet de résister même sous une pression extrême."
 NLF_nguyen_binh_command: "Le commandement de Nguyen Binh"
 NLF_nguyen_binh_command_desc: "Le style de commandement de Nguyen Binh allie une discipline rigoureuse à des tactiques de guérilla souples, transformant ainsi des cellules dispersées en une force de combat coordonnée, capable de tendre des embuscades et de déjouer les manœuvres d'un ennemi supérieur en nombre."
 NLF_guerilla_network: "Réseau de guérilla organisé"
 NLF_guerilla_network_desc: "Les infrastructures du Viêt Minh du Sud permettent des déplacements sans encombre à travers les villages, la jungle et les tunnels souterrains, ce qui permet à l'insurrection de perdurer même sous le feu des attaques incessantes."
 NLF_vietminh_disarray: "Désordre dans les rangs"
 NLF_vietminh_disarray_desc: "Avec le départ de Binh, l'unité au sein du parti se transforme en querelles entre factions. La confiance s'effrite. La coordination s'en trouve compromise."
 NLF_fractured_command_structure: "Une structure de commandement fragmentée"
 NLF_fractured_command_structure_desc: "L'absence de Nguyen Binh laisse un vide au niveau de l'autorité, comblé par des commandants ambitieux mais inexpérimentés."
 NLF_post_binh_disorganization: "Désorganisation post-Binh"
 NLF_post_binh_disorganization_desc: "Les chaînes d'approvisionnement, autrefois rigoureusement contrôlées, sont désormais défaillantes. Sans supervision centrale, les tactiques de guérilla deviennent imprudentes et coûteuses."