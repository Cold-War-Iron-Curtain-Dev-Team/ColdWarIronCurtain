l_english:
 stalin_speech_category:0 "Discours de Staline au peuple"
 stalin_speech_category_desc:0 "Le camarade Staline a fait beaucoup pour le peuple soviétique, après la défaite du fascisme, l'avenir de l'Union soviétique et l'avenir du socialisme ont encore besoin de son guide."
 addresstothe19thcongressofthecommunistpartyofthesovietunion:0 "Discours au 19e Congrès du Parti communiste de l'Union soviétique."
 addresstothe19thcongressofthecommunistpartyofthesovietunion_desc:0 "Permettez-moi, au nom de notre Congrès du Parti, d’exprimer nos remerciements à tous les partis et organisations frères dont les représentants ont honoré notre Congrès de leur présence, ou qui ont adressé à notre Congrès des messages d’amitié, pour leurs vœux de réussite continue et pour la confiance qu’ils nous témoignent. Pour nous, cette confiance est particulièrement précieuse car elle signifie leur volonté de soutenir notre Parti dans sa lutte pour un avenir meilleur pour le peuple, dans sa lutte contre la guerre, dans sa lutte pour préserver la paix. Il serait erroné de croire que notre Parti, devenu une force puissante, n’a plus besoin de soutien. Ce serait une erreur. Notre Parti et notre pays ont besoin, et auront toujours besoin, de la confiance, de la sympathie et du soutien continus des peuples frères au-delà de nos frontières."
 stalin_funeral_category:0 "Discours aux funérailles de Staline"
 stalin_funeral_category_desc:0 "Notre grand dirigeant, le camarade Staline, est décédé des suites d'un accident vasculaire cérébral. Après quatre jours de deuil national, des funérailles nationales lui sont consacrées. Ses contributions resteront à jamais gravées dans la mémoire."
 khrushchev_speech:0 "Discours de Khrouchtchev à l'occasion des funérailles de Staline"
 khrushchev_speech_desc:0 "Au nom du Comité central du Parti communiste de l'Union soviétique et du Conseil des ministres de l'URSS, il s'agit d'une réunion commémorative en mémoire du président du Conseil des ministres de l'Union des Républiques socialistes soviétiques et secrétaire du Comité central du Parti communiste de l'Union soviétique, le généralissime Joseph Staline."
 malenkov_speech:0 "Discours de Malenkov à l'occasion des funérailles de Staline"
 malenkov_speech_desc:0 "Chers compatriotes, camarades, amis, chers amis de notre parti, le peuple soviétique et l'humanité tout entière ont subi une perte très grave et irréparable. Notre maître, notre guide, un génie illustre pour l'humanité tout entière, nous a quittés. Joseph Vissarionovitch Staline, en ces jours difficiles, la douleur du peuple soviétique est partagée par toute l'humanité progressiste. Les actes de Staline perdureront à travers les siècles et la postérité. Les travailleurs d'Union soviétique et moi-même savons que notre puissante patrie connaîtra de nouveaux succès. Personne au monde ne saurait arrêter la marche en avant de la société soviétique vers le communisme. Adieu à notre maître. Cher ami, cher camarade, attends avec impatience le triomphe complet de Lénine et de Staline."
 beria_speech:0 "Discours de Beria sur les funérailles de Staline"
 beria_speech_desc:0 "Chers amis, amis, il est difficile d’exprimer mes profonds sentiments en ces jours. Pour notre peuple et pour toute l’humanité progressiste, Staline est une personne d’une grande compassion, talentueuse, et l’être le plus proche de nous qui nous a quittés. Le peuple de notre pays peut être assuré que les partis politiques et le gouvernement soviétique ne ménageront aucun effort pour maintenir l’unité générale du Parti. Les principes d’amitié entre les peuples de la République socialiste soviétique peuvent désormais insuffler à notre pays une confiance renouvelée dans les idées marxistes-léninistes, afin d’étudier l’héritage de Lénine et de Staline et de guider le pays du socialisme vers le communisme. Gloire à notre maître bien-aimé, cher et grand, Staline."
 molotov_speech:0 "Discours de Molotov sur les funérailles de Staline"
 molotov_speech_desc:0 "Chers camarades et amis, ces jours-ci, nous souffrons tous de la mort de Joseph Staline, de la perte du grand dirigeant et en même temps d’un proche, d’une personne infiniment chère. Nous sommes ses vieux et proches amis, ainsi que des millions de citoyens soviétiques, des travailleurs de tous les pays du monde. Aujourd’hui, avec un camarade d’acier que nous avons tous tant aimé, les résultats vivront toujours dans nos cœurs. La mémoire du grand Staline nous donne une orientation claire pour construire la grande cause du communisme pour notre pays, et elle est plus forte et plus étroitement unie dans le gouvernement central, et les travailleurs du monde entier vivront à travers elle pendant des siècles. Vive les grands maîtres Marx, Engels, Lénine et Staline. Vive notre puissante patrie socialiste. De génération en génération, le peuple soviétique vit grâce au grand Parti communiste de l’Union soviétique."