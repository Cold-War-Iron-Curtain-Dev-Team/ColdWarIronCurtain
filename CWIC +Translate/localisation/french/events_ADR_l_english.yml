l_english:
 ADR_sell_tech.0.d:0 "Une délégation de haut niveau venue de Vienne est arrivée récemment. Au cours des discussions, un haut responsable autrichien a proposé que nous achetions des biens de consommation de haute qualité. Il a souligné que la République démocratique autrichienne possédait les biens de consommation les plus modernes et de la meilleure qualité du monde socialiste et que de tels produits pourraient grandement profiter à notre nation et à sa population. Il est clair que la délégation attend une réponse définitive de notre part. Si nous achetons ces biens, cela pèsera certainement sur nos finances, mais cela renforcera les liens entre nos deux États. De plus, ces biens de haute qualité pourraient s'avérer bénéfiques pour nous. Si nous refusons la proposition autrichienne, la délégation exprimera certainement sa déception."
 ADR_sell_tech.1.d:0 "Une délégation a récemment été dépêchée en [FROM.GetName] afin d'évoquer les problématiques communes auxquelles nous sommes confrontés et de proposer la vente de biens de consommation. La vente de ces biens à d'autres États socialistes contribuera à renforcer le monde socialiste et à améliorer le bien-être de nos citoyens face à la concurrence occidentale. Le gouvernement [FROM.GetName] a accepté cette proposition avec enthousiasme, faisant part de sa volonté de faire progresser son peuple grâce aux connaissances acquises dans le monde socialiste. Cette visite fructueuse renforce sans aucun doute les liens entre la République démocratique autrichienne et [FROM.GetName]. Des projets sont d'ores et déjà en cours pour proposer à de futurs États amis et intéressés la vente de biens de consommation."
 ADR_sell_tech.2.d:0 "Une délégation a récemment été dépêchée à [FROM.GetName] afin de discuter des problèmes communs auxquels nous sommes confrontés et de leur proposer la vente de biens de consommation. La vente de ces biens à d'autres États socialistes renforcerait le monde socialiste et améliorerait le bien-être de nos citoyens face à la concurrence occidentale. Après avoir reçu cette proposition, le gouvernement de [FROM.GetName] a stupéfié nos diplomates en la déclinant. Leur refus n'a pas été brutal ni impoli, mais ils ont invoqué des difficultés financières les empêchant d'effectuer l'achat. Bien sûr, il s'agit probablement d'un mensonge ; dès le retour de la délégation, nous réduirons temporairement les effectifs de l'ambassade et les services consulaires pour manifester notre mécontentement."