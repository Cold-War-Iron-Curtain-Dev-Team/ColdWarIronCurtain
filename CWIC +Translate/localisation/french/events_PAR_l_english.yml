l_english:
 par.1.t:0 "The Fall of Molas López"
 par.1:0 "For months, tensions had been brewing within Paraguay’s ruling elite. President Federico Chaves, once a stabilizing figure, had become increasingly embattled as factional divisions within the Colorado Party deepened and relations with the military high command deteriorated. Various groups within the government—conservative hardliners, the military, and the reformist Epifanistas—all sought to shape Paraguay’s future, but their interests were often at odds.\n\nOn May 3, 1954, a series of events set off a rapid chain reaction. The arrest of Colonel Candia, ordered by Lieutenant Colonel Néstor Ferreira, escalated suspicions of conspiracies on all sides. By the evening of May 4, the streets of Asunción were filled with tension, as rumors of a decisive military move spread through the capital. At 8:00 p.m., gunfire erupted as elite commandos from Battalion 40, under Mario Ortega, stormed the police headquarters. Government forces attempted to resist, but the fighting was swift and brutal. Chief of Police Roberto Pettit was shot during the assault, and though he was rushed to a hospital, his injuries proved fatal.\n\nAs the situation spiraled out of control, Chaves, realizing the gravity of the moment, fled to the Francisco López Military College, seeking refuge and a final chance to turn the tide in his favor. What happens next will define the future of Paraguay."
 par.1.a:0 "Chaves made a mistake going in."
 par.1.b:0 "Loyalists rally to defend the government."
 par.2.t:0 "The Fall of Molas López"
 par.2:0 "The writing had been on the wall for months. Despite assuming power with military and party support, Felipe Molas López found himself increasingly isolated as his administration struggled to deliver on its promises. His former ally, Federico Chaves, conspired against him, and the Colorado Party’s Governing Board lost faith in his leadership. On the night of [GetDate], the Junta convened in an extraordinary session. The vote was decisive—14 in favor, 3 against—Molas López had to go. A delegation, including his own ministers, arrived at the presidential residence to present their demand: resign or be removed.\nCornered and abandoned, Molas López had no choice but to sign his resignation in the early hours. The government would soon announce his failures—his inability to unify the party, restore the institutions, or maintain public order."
 par.3.t:0 "The [GetYear] Elections"
 par.3:0 "With Felipe Molas López removed from power, the Colorado Party has called for elections to formally confirm Federico Chaves as president and fill the seats in parliament. However, with the Colorado Party as the only legal political organization, the election is a mere formality. No opposition candidates have been allowed to run, and Chaves stands unopposed.\nState-backed candidates have secured every parliamentary seat without contest, and the official results confirm Chaves as president until 1953. The government presents the outcome as a reaffirmation of national unity under the party’s leadership, but there is little doubt that the system is built to keep any opposition out of power.\nWith his rule now legitimized, Chaves must turn his attention to stabilizing the economy and managing growing factionalism within the Colorado Party. The question is not whether he holds power, but for how long he can keep the party united behind him."
 par.3.a:0 "Chaves Secures His Presidency"
 par.4.t:0 "[GetNewspaperHeader]A Democratic Facade?"
 par.4:0 "In a move hailed by government officials as a turning point for national unity, President Felipe Molas López has introduced a series of measures aimed at restoring democratic institutions and fostering reconciliation. Among the most significant of these initiatives is the amnesty granted to political prisoners and revolutionaries involved in the Civil War of 1947, including those implicated in the Escuela Militar uprising. The administration has framed this as a step toward healing the wounds of the past that have long plagued Paraguayan politics.\nHowever, not all are convinced. While the government presents these actions as part of a broader effort to rebuild democratic norms, skeptics feel that true political change remains elusive. Some see the amnesty as a purely symbolic gesture. Others question whether these reforms mark the beginning of a new political era — or simply a temporary adjustment before power inevitably consolidates once more. With political struggles threatening his brief presidency, Molas treads a fragile path. Whether he fosters real democratization or a fleeting interlude in Paraguay’s turmoil remains uncertain. For now, the government projects reform. But one could ask for how long?"
 par.4.a:0 "A step forward?"
 par.5.t:0 "A Navy Without a Coast"
 par.5:0 "Despite being a landlocked nation, Paraguay boasts a surprisingly strong naval tradition, a legacy that dates back to the War of the Triple Alliance and the country's strategic reliance on its riverine routes. With access to the Atlantic Ocean via the Paraguay–Paraná river system, the nation has maintained a small but capable naval force, tasked with patrolling its waterways, securing trade routes, and ensuring logistical mobility along South America's largest river network. Paraguayan naval officers continue to train in amphibious warfare and riverine operations, ensuring that the Marina de Guerra remains a relevant force despite its geographical limitations. While the country lacks a blue-water fleet, its experience in river-based operations and marine technology allows it to maintain a highly specialized force suited for the unique challenges of inland naval warfare."
 par.5.a:0 "A navy without an ocean is still a navy"
 par.6.t:0 "Choosing Our Petrochemical Partner"
 par.6:0 "After months of planning and negotiation, the government has completed the bidding process for the construction of a new petrochemical refinery near Asunción, a project that will mark a major step forward in Paraguay’s industrial and energy sectors. With rising fuel demands and a growing need for domestic refining capacity, securing the right partner is crucial for long-term economic stability and development. Following extensive review, two final contenders have emerged:\n\n§YEsso (Standard Oil of New Jersey)§, a global leader in oil production and refining, offers modern technology and efficiency, with the backing of international markets.\n\nYacimientos §YPetrolíferos Fiscales (YPF)§, Argentina’s state-owned oil company, presents an opportunity for regional cooperation and economic integration, strengthening ties within South America.\n\nEach choice carries long-term implications for Paraguay’s economy, industry, and diplomatic landscape. The time has come for the government to make its final decision."
 par.6.a:0 "We trust Esso’s expertise and global reach."
 par.6.b:0 "YPF is the natural choice for regional cooperation."
 par.7.t:0 "[GetNewspaperHeader]Paraguay Stands with the Free World"
 par.7:0 "In an official statement issued today, President Federico Chaves reaffirmed Paraguay’s commitment to international stability by declaring support for the United Nations’ efforts in Korea. The announcement highlights Paraguay’s solidarity with the Free World in what government officials describe as \"a critical struggle to preserve peace and security.\"\nWhile exact details remain undisclosed, diplomatic sources suggest that discussions have been held regarding Paraguay’s role in the ongoing conflict, with officials emphasizing the importance of standing by allied nations in moments of global uncertainty. In Washington, the declaration has been well received, with the American ambassador commenting that \"It highlights Paraguay’s growing role as a valued partner on the international stage.\"\nDomestically, the decision has been met with broad approval, with government officials and leading figures within the ruling party praising it as a necessary step in safeguarding national interests and securing closer ties with key allies. While a small minority has quietly expressed skepticism about Paraguay’s involvement in distant conflicts, their voices remain largely unheard in the face of the government's firm stance."
 par.7.a:0 "Symbolic or not, the message is what matters."
 par.8.t:0 "The Paraguay-Brazil Negotiations"
 par.8:0 "A Paraguayan delegation has arrived in Rio de Janeiro to discuss two long-standing issues: the border dispute over the Apa River and Paraguay’s significant debt to Brazil. Brazilian negotiators propose a compromise: if Paraguay formally recognizes minor Brazilian claims along the Apa River, Brazil will restructure the remaining debt, significantly easing Paraguay’s financial burdens. However, this proposal is controversial within the ruling Colorado Party, where hardliners oppose any territorial concessions. President Chaves must now decide: Should Paraguay accept Brazil’s terms to secure economic relief at the cost of internal political strife, or should we reject any concessions, preserving sovereignty but maintaining economic hardship?"
 par.8.a:0 "Seek a balanced agreement."
 par.8.b:0 "Defend Paraguayan sovereignty at all costs!"
 par.9.t:0 "[GetNewspaperHeader]Chaves Secures Historic Agreement with Brazil!"
 par.9:0 "In a decisive victory for Paraguayan diplomacy, our government has successfully negotiated a new agreement with Brazil, bringing an era of cooperation and economic relief. The discussions in Rio de Janeiro concluded with Brazil recognizing Paraguay’s commitment to regional stability, leading to a restructuring of our financial obligations. This achievement will allow our nation to focus on growth and prosperity without the burden of crushing debt.\nGovernment officials praised the outcome, emphasizing the benefits of securing economic stability while strengthening diplomatic ties with our powerful neighbor. President Chaves has reaffirmed his dedication to protecting Paraguay’s interests, ensuring that our nation continues on the path of progress.\nWhile a handful of reactionary voices within the Colorado Party have expressed concerns over minor territorial adjustments, the vast majority recognize this agreement as a prudent step toward securing a stronger Paraguay for future generations."
 par.9.a:0 "We stand stronger today than ever."
 par.10.t:0 "[GetNewspaperHeader]President Chaves Defends Paraguay’s Sovereignty!"
 par.10:0 "In a bold and patriotic stance, the Paraguayan government has upheld our national sovereignty in the recent negotiations with Brazil. Refusing to bow to external pressures, our delegation made it clear that Paraguay’s territorial integrity is not for sale.\nThe Chaves administration remains committed to defending every inch of our homeland, demonstrating to the world that Paraguay will never waver in the face of foreign demands. Though discussions with Brazil ended without concessions, diplomatic channels remain open, and Paraguay will continue to pursue fair and equitable partnerships on its own terms.\nAcross the country, the Colorado Party and patriotic citizens have hailed this decision as a triumph of national dignity. Some foreign commentators have suggested this stance may complicate economic matters, but true Paraguayans know that sovereignty comes before all else. The people stand united, unwavering in their support for a strong and independent nation."
 par.10.a:0 "Viva Paraguay!"
 par.11.t:0 "Appointment of Epifanio Méndez"
 par.11:0 "President Chaves has finalized the appointment of Epifanio Méndez Fleitas as the new head of the Paraguayan Central Bank, a decision that marks a major shift in economic policy and political influence within the Colorado Party. Unlike many of Paraguay’s political elite, Méndez Fleitas comes from a humble, peasant background. A committed Colorado loyalist, he first gained prominence in 1941, organizing underground party activities during the rule of Higinio Morínigo. Over the years, he has proven himself as a ruthless political survivor—editing the La Razón newspaper to denounce rivals, organizing an armed uprising in 1948, and later playing a key role in the 1949 coup that restored party unity and brought Felipe Molas López to power. His loyalty to Chaves was rewarded with the position of Chief of Police at just 32 years old.\n\nNow, as President of the Central Bank, Méndez Fleitas has a new ambition—economic transformation. He envisions a strong, state-led financial system that prioritizes national development and closer cooperation with Argentina’s Peronist government. However, his rapid rise and radical policies have already begun alarming conservative factions within the party and military. They fear his populist approach, foreign ties, and growing personal influence may pose a threat to Paraguay’s political balance. For now, Chaves stands by his decision, believing Méndez is the right man to lead Paraguay’s economy forward. But his enemies within the party are watching closely."
 par.11.a:0 "Onwards then"
 par.12.t:0 "The Re-Election of Federico Chaves"
 par.12:0 "The official results are in—President Federico Chaves has been re-elected with 100% of the vote, receiving 224,788 ballots in favor of the Colorado Party. With no opposition parties permitted, the election serves as a demonstration of national unity under the guiding leadership of the party. The results have been met with celebrations across the country, as Paraguayans reaffirm their support for Chaves and his vision for the nation’s future. In Asunción, government officials have praised the efficiency and order of the electoral process, ensuring that democracy continues to function in a way that best serves the people.\nWhile foreign critics dismiss the election as a formality, within Paraguay, the Colorado Party remains the sole guardian of national stability and progress. Chaves has been granted another term to continue his administration’s policies, ensuring that Paraguay remains strong, unified, and unwavering in its direction."
 par.12.a:0 "A triumphant victory for us."
 par.13.t:0 "The Address of President Chaves"
 par.13:0 "Before a gathering of Colorado Party officials and government loyalists, President Federico Chaves has delivered a forceful speech reaffirming the primacy of civilian governance in Paraguay. Standing at the podium, flanked by key ministers and reformist allies, Chaves spoke of the party’s historic role in guiding the nation and the need to strengthen civilian institutions over military influence.\n\n\"Paraguay’s destiny has always been forged through discipline, unity, and an unshakable belief in progress. Our great nation stands at a crossroads, and we must decide whether to embrace the path of stability and development, or to risk our future by yielding to forces that would place military ambition over national interest.\"\n\nThe hall erupted in applause as Chaves praised the armed forces for their dedication to national security, while subtly warning against political interference. He emphasized that the party, not the generals, must be the guiding force of Paraguay, ensuring that the nation moves forward under strong and legitimate leadership. Yet outside the chamber, reactions were more divided. Some within the Colorado old guard nodded in agreement, seeing in Chaves a leader committed to securing the party’s legacy. Others—especially among military-aligned figures—remained silent, their expressions unreadable.\nFor now, Chaves has made his stance clear, but in the shadows, opposition to his vision may already be forming."
 par.13.a:0 "The future will be decided by the party, not the barracks."
 par.14.t:0 "[GetNewspaperHeader]Chaves' Constitutional Reforms Falter"
 par.14:0 "In an effort to modernize Paraguay’s governance, President Federico Chaves introduced a series of constitutional amendments aimed at strengthening civilian rule and reforming government institutions. However, despite the administration’s insistence on the need for change, the initiative has faced strong resistance from within the Colorado Party and the military establishment.\nWhile publicly framed as a step toward national progress, critics within the ruling party quietly argued that the amendments would destabilize Paraguay’s political structure, granting the executive too much power at the expense of traditional institutions. The military, wary of any attempt to reduce its influence, withheld support, further stalling the reforms.\nFacing overwhelming opposition, the government has abandoned the proposal, marking a rare setback for the Chaves administration. Despite this, officials insist that Paraguay remains committed to stability and unity under the leadership of the Colorado Party."
 par.14.a:0 "Some ideas must wait for their time."
 par.15.t:0 "Méndez Fleitas Removed from Office"
 par.15:0 "Epifanio Méndez Fleitas, a key figure in Paraguay’s economic direction and an influential member of the Democráticos faction, has formally resigned as President of the Central Bank. His departure follows mounting pressure from the armed forces and rural economic elites, who accused him of misguided economic policies and political overreach. Méndez’s refusal to approve rising beef prices, a demand from the powerful Asociación Rural del Paraguay, made him a target for removal, as his stance was seen as a threat to agricultural profits. At the same time, military officers skeptical of his pro-Peronist leanings saw an opportunity to remove an increasingly troublesome figure from power. Official government statements emphasize that Méndez stepped down voluntarily, but within political circles, few believe it was truly his choice. He has since been relocated to his hometown of San Pedro del Paraná, far from Asunción’s political struggles. As Paraguay’s political landscape shifts, many wonder whether his removal was simply an administrative change—or the first sign of a greater realignment of power."
 par.15.a:0 "A necessary decision for stability."
 par.17.t:0 "[GetNewspaperHeader]The Government Issues a Statement on Recent Events"
 par.17:0 "In the wake of the May 4 events, the Colorado Party leadership and military authorities have released a statement reaffirming Paraguay’s commitment to stability, order, and national unity. The statement clarifies that former President Federico Chaves had attempted to undermine party unity, forcing military leaders to intervene in order to prevent disorder and safeguard the nation’s future. The government also addressed the role of Lieutenant Colonel Néstor Ferreira, whose involvement in political matters was cited as a disruptive force that had directly interfered in the party’s governance. To ensure a smooth transition and restore political legitimacy, the government has announced that new presidential elections will take place in the coming weeks. The Colorado Party will soon convene to select a candidate who can unite the nation and lead Paraguay forward.\n\nThe Colorado Party’s leadership, now under Tomás Romero Pereira, has called for unity and calm, ensuring the Paraguayan people that the transition of power is proceeding smoothly. Though the statement presents a clear and decisive message, the true motives behind the coup remain a subject of quiet discussion among political insiders."
 par.17.a:0 "Who will rise to lead?"
 par.18.t:0 "The 1954 Presidential Election"
 par.18:0 "With the Colorado Party united behind a single candidate, the 1954 presidential election has concluded with General Alfredo Stroessner securing the presidency unopposed. The election proceeded calmly and efficiently, with official results showing 236,191 votes in favor of Stroessner, representing 100% of the ballots cast. In his acceptance speech, Stroessner reaffirmed his commitment to peace, justice, and social well-being for all patriotic Paraguayans. He pledged to uphold Paraguay’s international commitments and pursue a fraternal policy of cooperation with neighboring nations, while at the same time exalting the principles and legacy of the Colorado Party as the guiding force of national stability.\n\nWhile the process has been hailed by officials as a demonstration of unity and order, outside observers note that the absence of any opposition candidate limited the significance of the election itself. Nonetheless, with the backing of both the party and the military, Stroessner’s presidency is now officially confirmed. For now, Paraguay moves forward under strong leadership, but the future remains uncertain — will Stroessner govern as a transitional figure, or does he have greater ambitions?"
 par.18.a:0 "Surely the party will replace him soon."
 par.19.t:0 "Success of the Coup"
 par.19:0 "As the gunfire faded in the streets of Asunción, President Federico Chaves arrived at the Francisco López Military College, seeking refuge and a final opportunity to salvage his presidency. He was surrounded by only a handful of trusted aides, his government crumbling around him. The police headquarters had fallen, the army was no longer responding to his orders, and the coup leaders controlled key parts of the capital. Still, he believed that if he could sway the military leadership at the academy, there might be a way to hold onto power.\n\nSummoning General Marcial Samaniego, Chaves made a desperate proposal—he would appoint him as commander of the Paraguayan Army, granting him broad authority over the nation’s armed forces. With such a position, Samaniego could restore order and crush the rebellion. However, Chaves failed to realize the extent of his isolation — Samaniego had already aligned himself with General Alfredo Stroessner and the coup plotters.Instead of accepting the offer, Samaniego ordered Chaves’ immediate arrest, ensuring that the last remnants of his authority vanished in an instant.\n\nBy May 5, the Colorado Party leadership convened in an emergency session, formally requesting Chaves' resignation. With no path forward and no allies left, he stepped down from the presidency, bringing his rule to an end. In his place, Colorado Party chairman Tomás Romero Pereira was sworn in as interim president, a temporary solution meant to restore stability while a permanent leader could be selected. However, in the background, it was clear that Stroessner, the man who had orchestrated much of the coup, was now the most powerful figure in Paraguay."
 par.19.a:0 "A new era had begun."
 par.20.t:0 "Chaves Secures Crucial Support"
 par.20:0 "As gunfire echoed through Asunción, President Federico Chaves fled to the Francisco López Military College, seeking refuge and a final chance to turn the tide. He knew that his only hope lay in rallying enough support from the military and party leadership to resist the coup. Inside the academy, he confronted General Marcial Samaniego, offering him the position of commander of the Paraguayan Army in a last-ditch effort to secure loyalty. Samaniego, however, hesitated — his ties to General Stroessner and the coup plotters were well known.\n\nJust as it seemed that Chaves’ fate was sealed, reinforcements began to arrive. Loyalist officers, led by Colonel Néstor Ferreira and backed by the Epifanistas, moved swiftly to defend the government. Word spread among military units, and soon, Old Guard factions of the Colorado Party, fearing Stroessner’s growing influence, threw their weight behind Chaves. The tide began to turn. As the night wore on, loyalist forces seized key locations, preventing further coup attempts. Facing mounting resistance and realizing that his forces were no longer unified, Stroessner was forced to retreat, along with the officers who had backed him. While some were captured or went into hiding, Stroessner himself managed to evade arrest, withdrawing from the capital to reconsider his next steps.\n\nBy May 5, the coup had collapsed. Chaves remained in power, but the crisis had revealed just how precarious his position truly was. The military was no longer fully under his control, and factions within the Colorado Party had been exposed as willing to turn against him. Meanwhile, Stroessner, though defeated, had not been eliminated. His retreat was only temporary, and those who had followed him would not forget their attempt to seize power so easily. For now, he remained in the shadows, waiting for the next opportunity."
 par.20.a:0 "For now, Chaves has survived."
 par.21.t:0 "[GetNewspaperHeader]Méndez Fleitas Returns to the Central Bank"
 par.21:0 "Stroessner has confirmed the return of Epifanio Méndez Fleitas as President of the Central Bank, marking a key step in the administration’s efforts to strengthen national economic policy. Méndez Fleitas, a longtime advocate for economic modernization and financial stability, previously held this position before his departure under Chaves. Officials have emphasized that Méndez Fleitas’ expertise in financial planning and monetary policy will be crucial in guiding the country’s economic future.\nIn addition to his return to the Central Bank, Méndez Fleitas has also taken leadership of La Unión, an important newspaper that is expected to play a key role in supporting the government’s message of stability and progress. Meanwhile, Major Virgilio Candia has been appointed as commander of the Cavalry, reinforcing the ongoing reorganization of national security forces to ensure continued order.\nGovernment sources have highlighted these changes as part of a broader effort to unify the country, bringing together key figures who will contribute to Paraguay’s development in this new era. The administration remains committed to strengthening national institutions and fostering continued economic growth under firm and stable leadership."
 par.21.a:0 "A steady hand returns to guide the economy."
 par.22.t:0 "The Struggle for Power"
 par.22:0 "For months, tensions had been brewing within the Colorado Party, and now they had reached their breaking point. What had begun as a rivalry between President Stroessner and Epifanio Méndez Fleitas had evolved into an existential struggle for control of the party—and the country itself. The Reencuentro of October was meant to unify the party following the coup against Juan Perón in Argentina, but it had only deepened the divide between the regime’s factions. Méndez Fleitas, who had long relied on Argentine support, suddenly found himself politically vulnerable. The new government in Buenos Aires, led by General Pedro Eugenio Aramburu, had abandoned him, instead pressuring Stroessner to purge the Epifanistas from positions of power.\nAt the same time, Paraguay’s economic elites, particularly the timber industry, saw an opportunity to remove Méndez once and for all. The Asociación de Madereros del Paraguay, whose interests Méndez had opposed as head of the Central Bank, had aligned with Stroessner, providing him with financial and political backing. This newfound alliance meant that Stroessner now had the backing of the military, the party old guard, the oligarchy, and even Argentina’s government—a near-insurmountable coalition against Méndez Fleitas.\nYet Méndez was not without his own base of power. His control over the Central Bank gave him economic leverage, while his newspaper, La Unión, had become the most important pro-government publication, allowing him to shape public perception. He had also cultivated a loyalist faction within the military, including Major Virgilio Candia, commander of the Cavalry, as well as officers still resentful of Stroessner’s growing influence. By late December 1955, both men knew the confrontation was unavoidable. The question was who would strike first."
 par.22.a:0 "Méndez has miscalculated — Stroessner moves decisively."
 par.22.b:0 "The Epifanistas act first."
 par.23.t:0 "[GetNewspaperHeader]Méndez Fleitas Removed from Office Again?"
 par.23:0 "In a move aimed at ensuring continued stability and institutional efficiency, the government has confirmed the departure of Epifanio Méndez Fleitas from his position as President of the Central Bank. Officials have stated that this decision is part of routine administrative adjustments. While no official reason has been provided for the change, rumors within political circles suggest that Méndez Fleitas had accumulated significant influence, leading to internal disagreements within the Colorado Party. His close connections within the military and his role in shaping Paraguay’s economic direction had made him a prominent but controversial figure in recent months.\nThe announcement follows reports of recent disturbances within the Cavalry, where a group of officers was relieved of their posts after alleged misconduct. The government has assured the public that these developments are isolated incidents and that national stability remains fully secured. While Méndez Fleitas’ future role has not been officially confirmed, diplomatic sources suggest that he may soon be appointed to a foreign post, potentially as Ambassador to Spain. Officials declined to comment on these reports."
 par.23.a:0 "Adiós, as they say in Spain."
 par.24.t:0 "Méndez Fleitas Denied Reentry to Paraguay"
 par.24:0 "For months, Epifanio Méndez Fleitas has been serving as Paraguay’s ambassador to Spain, following his reassignment from the Central Bank. While the government has maintained that his posting was a routine diplomatic appointment, political observers have noted that it conveniently distanced him from domestic affairs at a time of increasing tensions within the Colorado Party.\n\nNow, recent events have brought his name back into the national spotlight. In March 1956, Méndez Fleitas received word that his father had fallen gravely ill. Wasting no time, he boarded a flight back to Paraguay, accompanied by his family, with the intent of returning home. However, when his plane landed in Rio de Janeiro, he was met by officials from the Paraguayan Embassy, who informed him that he would not be permitted to re-enter the country. While no official reason was given, the decision effectively bars Méndez from returning to Paraguayan politics, reinforcing speculation that his diplomatic appointment had been little more than a quiet exile.\n\nWith no path forward, Méndez has since departed from Brazil, with plans to settle in political exile in Uruguay. His unexpected removal from the country has fueled discussions among party factions, but for now, government officials have declined to comment further, stating only that Paraguay remains committed to stability and unity."
 par.24.a:0 "Such is politics."
 par.25.t:0 "Méndez Fleitas Rallies Opposition to Stroessner"
 par.25:0 "With tensions within the Colorado Party reaching a breaking point, Epifanio Méndez Fleitas has made his move. No longer willing to stand by as President Stroessner consolidates power, Méndez has rallied a broad coalition of party dissidents, military officers, and civilian supporters to challenge the regime. The collapse of Perón’s government in Argentina had left the Epifanistas politically vulnerable, but instead of retreating, Méndez has worked tirelessly to build a united opposition within Paraguay. Key figures from the Old Guard of the Colorado Party, frustrated by Stroessner’s growing authoritarianism, have joined forces with reformist factions, forming a powerful front determined to restore party leadership to civilian hands. The military, once fully aligned with Stroessner, is now divided. While Major Virgilio Candia and other loyalist officers remain committed to Méndez, Stroessner still commands the loyalty of much of the high command. The risk of an open confrontation between the two factions grows by the day. With opposition forces now firmly in place, the confrontation is inevitable. The question is no longer whether Méndez will challenge Stroessner — but how soon."
 par.25.a:0 "Uncertain times."
 par.26.t:0 "Revuelta Unitaria"
 par.26:0 "The moment of reckoning has arrived. With Epifanio Méndez Fleitas successfully rallying opposition to President Stroessner, the fragile political balance in Paraguay has collapsed into open confrontation. The Revuelta Unitaria, a coup led by Méndez and his allies, is now in motion, aiming to overthrow Stroessner’s military-backed rule and restore the Colorado Party to civilian leadership. The uprising begins before dawn, with Epifanista officers coordinating an offensive to seize key government buildings and military barracks across Asunción. Major Virgilio Candia’s Cavalry Division moves swiftly through the capital, securing vital roads and cutting off military units still loyal to Stroessner. The headquarters of La Unión newspaper, now the mouthpiece of the revolution, broadcasts a statement declaring the formation of a new government, urging the people to support the movement.\n\nFighting erupts near the Ministry of the Interior, where Stroessner’s security forces attempt to hold their positions against Méndez’s advancing forces. Gunfire rattles the streets as loyalist police units, caught between orders from the regime and overwhelming opposition, begin to defect in large numbers. Meanwhile, at the Army General Command, senior officers remain divided, uncertain whether to resist or align themselves with Méndez’s growing power.The coup reaches its climax as Méndez’s forces surround the Presidential Residence, cutting off all avenues of escape. Communications are severed, and with much of the military either defecting or refusing to intervene, Stroessner finds himself increasingly isolated. His last remaining loyalist forces attempt to mount a defense, but as armored vehicles from the Cavalry Division breach the compound’s gates, it becomes clear that the battle is lost.\n\nAs the sun rises over Asunción, the last gunshots fade into silence. Méndez Fleitas stands victorious, surrounded by his allies, as the remnants of Stroessner’s regime surrender. The radio waves, once controlled by the government, now carry a simple but decisive message:\n\n\"The people of Paraguay have reclaimed their future. The era of military rule is over.\""
 par.26.a:0 "Viva la revolución!"
 par.27.t:0 "Ynsfrán Takes Control of Internal Affairs"
 par.27:0 "The appointment of Edgar Ynsfrán as Minister of the Interior has signaled a new and radical turn for the Stroessner regime. A fierce nationalist and one of the most extreme figures within the Colorado Party, Ynsfrán’s vision for Paraguay goes beyond simple authoritarianism—he envisions a fully militarized one-party state, where ideological purity and total control define national policy. An ultra-right Stronist, sympathetic to fascist corporatism, Ynsfrán has long surrounded himself with radical paramilitary groups and hardline enforcers. His time in Guión Rojo and close ties to far-right European exiles have made him a key figure in facilitating the arrival of fugitive Nazi war criminals.\n\nUnder his leadership, the Interior Ministry has rapidly expanded its reach. Surveillance operations against suspected subversives have intensified, political dissidents are being tracked more aggressively than ever, and the party’s paramilitary structures are being reinforced. Ynsfrán has openly stated that \"the greatest danger to the nation is complacency\", urging the government to eliminate all threats to Paraguay’s unity—by any means necessary.\n\nWithin the Colorado Party, reactions are mixed. While many welcome his hardline stance as a necessary step toward securing the regime, others fear that his extremism could destabilize the balance of power within the government. Even some within the military are uneasy, wary of Ynsfrán’s unchecked ambitions and the increasingly radical elements within his circle. What is clear, however, is that Stroessner has now placed one of his most dangerous and loyal figures in charge of Paraguay’s internal security. With Ynsfrán in power, there will be no room for opposition, no tolerance for weakness, and no limits to what the regime will do to preserve itself."
 par.27.a:0 "A necessary step for order and stability."
 par.28.t:0 "The 1958 General Election"
 par.28:0 "On February 9, 1958, Paraguayans went to the polls in what the government proclaimed as a reaffirmation of national unity. However, with the Colorado Party remaining the only legal political organization, the election was little more than a formal display of continued dominance by President Alfredo Stroessner.\n\nThe regime carefully choreographed the proceedings, temporarily lifting the state of siege for the day before promptly reinstating it once voting had concluded. The official results left no room for surprise — Stroessner was re-elected unopposed, securing another five-year term with the full backing of the state apparatus. Likewise, all 60 seats in the Chamber of Deputies were handed to the ANR-PC without contest. In a ceremonial act, Stroessner cast his ballot at Colegio San José in Asunción, flanked by top officials, including his Minister of the Interior, Edgar Ynsfrán.\n\nWhile government media outlets hailed the election as a triumph of Paraguayan democracy, external observers and opposition figures — many now languishing in exile or prison — knew the reality. With no organized opposition allowed to participate, the contest was merely another step in Stroessner’s tightening grip over Paraguay’s political future. The state remains firmly under the control of the Colorado Party, with the presidency and legislative body locked under single-party rule. What remains uncertain is how long Stroessner’s control will remain unchallenged, or whether cracks may begin to form in the ever-growing structure of his authoritarian state."
 par.28.a:0 "Another victory for the party and the nation."
 par.29.t:0 "The 1958 General Strike Begins"
 par.29:0 "Unrest has erupted across Paraguay as the Confederación Paraguaya de Trabajadores has launched the first nationwide general strike in the country’s history. With thousands of workers mobilizing under the banner of wage increases, political freedoms, and economic reforms, the movement has caught the government by surprise.\n\nThe timing of the strike is no coincidence—it comes amidst a growing power struggle within the ruling Colorado Party between the civilian faction led by Epifanio Méndez Fleitas and the military-backed leadership of President Alfredo Stroessner. With the CPT closely aligned with Méndez Fleitas, many within the government see the strike as a direct political maneuver rather than a purely economic protest.\n\nDespite state pressure, the strike movement has quickly gained traction. Pro-strike committees have formed across the country, and Acción Católica has openly voiced support for the cause. Around 10,000 workers gathered now gathered for a mass meeting at the CPT headquarters in Asunción, where a four-member strike committee was elected. The nation now holds its breath, awaiting the government's response."
 par.29.a:0 "The state must act."
 par.30.t:0 "[GetNewspaperHeader]Government Restores Order After Talks"
 par.30:0 "After a brief period of uncertainty, the government has successfully managed the general strike crisis through a combination of strategic negotiation and decisive action. Initially, President Alfredo Stroessner extended an offer of a 15% wage increase, demonstrating the administration’s willingness to address reasonable concerns. However, extremist elements within the Confederación Paraguaya de Trabajadores rejected the proposal, making it clear that their objectives extended beyond economic matters.\n\nWith dialogue exhausted, authorities took swift and necessary steps to restore stability. Unauthorized gatherings were dispersed, and security forces moved to arrest those responsible for prolonging the unrest. The CPT headquarters was secured, and its leadership taken into custody to prevent further agitation. The people of Paraguay can now return to work knowing that the nation remains steadfast in its pursuit of stability and prosperity."
 par.30.a:0 "Paraguay stands strong and united."
 par.31.t:0 "[GetNewspaperHeader]Swift Government Action Crushes Strike"
 par.31:0 "In a firm display of leadership, the government has acted decisively to prevent the recent labor unrest from escalating into a greater threat to national stability. With the so-called general strike declared illegal, security forces moved swiftly to neutralize the agitators responsible for inciting disorder.\n\nBy the early hours of next day, law enforcement, backed by military personnel, had successfully dispersed gatherings and secured the headquarters of the Confederación Paraguaya de Trabajadores. Over 200 radical elements, including key strike organizers, have been detained. Even figures who previously enjoyed parliamentary immunity were not exempt from the enforcement of order.\n\nWith the situation fully under control, the government reaffirms its commitment to maintaining discipline and national unity. The Paraguayan people can be assured that no attempt to destabilize the state will be tolerated. The era of chaos is over—Paraguay moves forward stronger than ever."
 par.31.a:0 "The state does not negotiate with chaos."
 par.32.t:0 "[GetNewspaperHeader]A New Era for Paraguay?"
 par.32:0 "In a move that has surprised many within political circles, President Alfredo Stroessner has announced a sweeping series of reforms aimed at modernizing Paraguay’s political landscape. In a declaration made earlier this week, the government confirmed the lifting of the long-standing state of siege, the return of opposition exiles, and the end of press censorship, marking what officials describe as the beginning of a new era of political openness.\nAdditionally, the release of political prisoners has been ordered, and the administration has pledged to draft a new Constitution to replace the outdated 1940 charter.\n\nWhile many within the ruling Colorado Party have welcomed this new direction, others remain skeptical. Still, for opposition figures — many of whom have spent years in exile or imprisonment, the reforms present a long-awaited opportunity to reenter the political arena.For now, Paraguay stands at a crossroads. Whether this liberalization is a lasting transformation or a temporary concession remains to be seen, but one thing is certain — the political landscape of the nation is shifting."
 par.32.a:0 "A necessary step toward national unity."
 par.33.t:0 "Document 809"
 par.33:0 "A routine petition, two pages long, marked Document 809. Typed, stamped, and signed by three senior magistrates, it certified that one José Mengele had fulfilled all legal requirements for Paraguayan citizenship. His backers — Werner Jung and Alejandro von Eckstein, well-known expatriates attested to his good character and financial solvency. The document contained at least one clear falsehood: that Mengele had resided in Paraguay for five years. Yet, no objections were raised. The application was swiftly approved.\n\nFor Minister of the Interior Edgar Ynsfrán, this was merely another administrative matter. His office, long tasked with regulating immigration and granting residency to those deemed \"useful\" to Paraguay’s development, had overseen countless such cases. That this particular José Mengele had chosen to settle in the country was of no great concern, at least not officially.\n\nBeyond the halls of government, however, quiet murmurs spread through diplomatic circles. Some foreign observers suspected that this newly minted Paraguayan citizen was more than he appeared to be. To the few who had heard the name before, it rang with sinister familiarity. Yet, no solid evidence emerged, no official inquiry was raised. In the archives, Document 809 was filed away, just another name among thousands.For now, the matter is closed."
 par.33.a:0 "Just another piece of paperwork."
 par.34.t:0 "[GetNewspaperHeader] Fredesvinda Vall Steps into the Spotlight"
 par.34:0 "Until recently, few Paraguayans knew the name Fredesvinda Vall. As the wife of President Epifanio Méndez Fleitas, she had remained entirely outside politics. Now, in a sudden transformation, she has emerged as a national figure, championing women’s rights and social welfare. Her first major appearance came recently in Asunción’s Plaza Uruguaya, where she declared, \"Paraguayan women have always carried this nation forward — now they must have a voice in its future.\" The response was overwhelming, with growing calls for expanded education, labor rights, and social protections for women.\nWhile many celebrate her as a symbol of progress, conservative factions within the Colorado Party are uneasy. Military leaders, already skeptical of Méndez’s populism, now see Vall’s rising influence as another shift away from tradition. Yet, the president appears fully committed to elevating her further. Whether Vall’s rise signals lasting change or a fleeting experiment in populist politics remains to be seen, but one thing is certain—she is no longer just the president’s wife."
 par.34.a:0 "A new era for Paraguay’s women?"
 par.35.t:0 "The 1958 General Elections"
 par.35:0 "For the first time in over a decade, Paraguayans have gone to the polls in a truly contested election. With President Epifanio Méndez Fleitas lifting the ban on opposition parties, the 1958 elections have marked the return of multiparty democracy. The ruling Colorado Party, led by Méndez, faced its strongest challenge from the resurgent Liberal Party under Ernesto Gavilán, who campaigned on promises of economic liberalization and an end to state interventionism.\n\nTurnout was high, with enthusiasm running deep across the nation. While the Colorados emphasized stability, social reforms, and national sovereignty, the Liberals appealed to business elites and those wary of Méndez’s populist policies. Reports indicate that rural areas overwhelmingly backed Méndez, while urban centers saw a stronger showing for Gavilán. As the final ballots are counted, Paraguay stands at a crossroads. Will Méndez’s movement secure its mandate, or will the opposition stage an upset?"
 par.35.a:0 "Méndez wins, securing his vision for Paraguay."
 par.35.b:0 "The Liberals make unexpected gains."
 par.36.t:0 "Asunción Student Riots"
 par.36:0 "Unrest has boiled over in downtown Asunción as students, enraged by a sudden bus fare hike, have taken to the streets. What started as a peaceful protest spiraled into chaos, with nearly 100 people injured amid clashes with police and scattered vandalism of local shops. Reports suggest some demonstrators hurled stones and erected makeshift barricades, while authorities responded with tear gas and batons. The riot, fueled by economic discontent and the fleeting hope of the recent liberalization, has rattled the capital. Emboldened by the turmoil, the legislature has demanded Interior Minister Edgar Ynsfrán’s resignation, testing General Stroessner’s grip on power. With the situation teetering on the edge, the government must act decisively to reassert control."
 par.36.a:0 "This is the fault of the liberal experiment"
 par.37.t:0 "Dissolution of Cámara de Representantes"
 par.37:0 "Tensions reached a breaking point as the Chamber of Deputies, emboldened by the brief liberalization, voted by a narrow majority to condemn the brutal police response to the Asunción riots and demanded the resignation of Interior Minister Edgar Ynsfrán. A key enforcer of General Stroessner’s regime, Ynsfrán wielded ruthless control over internal security, overseeing a network of repression that included the harassment, terrorization, and even murder of opponents’ families. This legislative challenge struck at the heart of Stroessner’s authority, a blow he could not tolerate. In a swift and decisive move, he dissolved the Chamber of Representatives and the entire legislature, silencing any semblance of opposition. To cement his grip, Stroessner reimposed the state of siege, restoring his emergency powers to arrest and detain individuals indefinitely without trial, ban public gatherings, and crush dissent with an iron fist. Cavalry troops marched into Asunción, occupying key streets and public squares to quell further unrest, their presence a stark reminder of military dominance. In the days that followed, approximately 300 dissidents, many from within the Colorado Party itself were rounded up, their fates sealed with arrests or forced exile. This act of repression, consistent with Stroessner’s long reliance on death squads, political imprisonment, and censorship, marked a return to unyielding authoritarian rule, leaving Paraguay’s democratic spring in ruins."
 par.37.a:0 "O spring, thou wilt not return again."
 par.38.t:0 "[GetNewspaperHeader]Méndez Dissolves the Colorado Party"
 par.38:0 "In a political earthquake that has stunned Asunción, President Epifanio Méndez Fleitas has signed a decree formally dissolving the National Republican Association - the Colorado Party. For generations, the ANR has been the dominant, and often only, political force in Paraguay. In a national address, Méndez declared it an institution \"rotted from the inside out,\" incapable of reform and irredeemably tied to the legacies of authoritarianism and military strongmen.\n\nIn its place, the President has announced the formation of a new political movement: the §YPartido Nacionalista Revolucionario§!. According to government spokesmen, the PNR will be a \"true populist party,\" built on the social reforms of the Méndez administration and free from the corrupt baggage of the old guard.\n\nThe decision has caused a deep schism. While supporters of the President hail it as a courageous and necessary break from the past, remnants of the old Colorado leadership have condemned the move as an illegal power grab. With the nation's political bedrock now fractured, Paraguay enters a period of profound uncertainty. The question on everyone's mind is whether this new party can unite the people, or if it has simply plunged the nation into a new political crisis."
 par.38.a:0 "The old era is truly over."
 par.39.t:0 "[GetNewspaperHeader]Paraguay Enters a New Constitutional Era"
 par.39:0 "After months of debate, the constituent assembly has formally promulgated a new Constitution for Paraguay, replacing the authoritarian 1940 charter that has defined the nation's legal framework for nearly two decades. The new document, championed by President Epifanio Méndez Fleitas, marks a fundamental shift in Paraguayan governance.\n\nGovernment officials have highlighted the charter's key provisions, which include the formal establishment of civilian supremacy over the military, robust protections for political parties and civil liberties, and the legal enshrinement of the administration's recent social reforms, including new rights for workers. In a speech celebrating its ratification, President Méndez called it 'the birth certificate of a new, democratic Paraguay, free from the shadow of despotism.'\n\nPublic reaction has been one of broad celebration, as many see this as the capstone of the nation's democratic transition. While some conservative critics have privately expressed concern that the new constitution goes too far in dismantling traditional state structures, their voices have been largely drowned out by the wave of optimism."
 par.39.a:0 "A new charter for a new nation."
 par.40.t:0 "The Asunción Dossiers"
 par.40:0 "The change in government has brought a new directive to the Ministry of the Interior. For decades, Paraguay's lax immigration policies and sympathetic officials have allowed European expatriates with... troubling pasts to find refuge within our borders. This has long been a quiet embarrassment, hindering our international reputation.\n\nPresident Gavilán, seeking to firmly align Paraguay with the democratic West, has authorized a full review of all residency permits granted to questionable individuals since the end of the Great War. This Anti-Fascist Campaign is a clear signal; our new, liberal democracy will not be a haven for the remnants of tyranny. The Interior Ministry will cooperate with international agencies to identify and expel those who have falsified their backgrounds or are sought for past crimes."
 par.40.a:0 "Our nation must be a respectable member of the free world."
 par.41.t:0 "[GetNewspaperHeader]Paraguay Adopts Grand Liberal Constitution"
 par.41:0 "The constituent assembly, convened by the Liberal government, has formally ratified the Grand Liberal Constitution, replacing the outdated 1940 charter. President Ernesto Gavilán, who championed the new charter, praised it as a modern framework essential for a new era of Paraguayan prosperity.\nUnlike its predecessor, the new constitution's cornerstones are the ironclad defense of private property, the independence of the judiciary, and the strict limitation of state power in the economy. Officials have highlighted that the charter guarantees free enterprise and is specifically designed to attract the foreign investment needed for national modernization.\nIn a speech following the ratification, President Gavilán declared the constitution to be \"a permanent guarantee that Paraguay will be a nation of laws, not of strongmen, and a beacon of free-market democracy in South America.\" The new charter has been met with widespread enthusiasm from the business community and international observers, who see it as a vital step toward stability. While some populist remnants from the previous government have decried it as a reversal of social progress, the administration insists this is the only path to genuine, long-term prosperity."
 par.41.a:0 "The foundation for prosperity is set."
 par.42.t:0 "The Plan for Judicial Reform"
 par.42:0 "The new Liberal government has initiated one of its most fundamental and difficult reforms: the overhaul of the national judiciary. For decades, under the absolute control of the Colorado Party, the courts were little more than an extension of the executive, rubber-stamping political edicts and dispensing patronage rather than justice. This system is incompatible with our vision for a stable, free-market democracy.\n\nPresident Gavilán has authorized a formal \"Plan for Judicial Reform,\" establishing a commission to review the credentials and political ties of sitting judges. The goal is to create an independent judiciary that can be trusted to enforce contracts and protect property rights—a non-negotiable prerequisite for attracting foreign investment. This is, however, a direct assault on the entrenched power of the old Colorado bureaucracy, and it will be met with silent, stiff resistance."
 par.42.a:0 "The rule of law will be our new foundation."
 par.43.t:0 "A Partnership for Prosperity"
 par.43:0 "The Asunción Accords have been formally ratified, cementing our new partnership with the United States. Beyond the guarantees of mutual defense, the agreement includes a significant economic component: an American aid package designed to jumpstart our modernization. Our American partners have asked for our government's input on where to direct these initial funds.\n\nTwo schools of thought have emerged within the cabinet. The first argues for a traditional industrial path: using the funds to construct new §Ymanufacturing plants§!, creating immediate jobs and a tangible industrial base. The second, more forward-looking, faction believes we should bypass this step and invest directly in a modern, skilled economy by developing §Ytechnical and administrative centers§!. This would lay the groundwork for a future in finance, advanced research, and high-level services."
 par.43.a:0 "A nation is built on industry."
 par.43.b:0 "We must look to the future."
 par.44.t:0 "Commission for the Review of Past Activities"
 par.44:0 "With the authority of the Presidency, our government has formally convened the \"Commission for the Review of Past Activities\". Its mandate is clear: to open the archives and investigate decades of political violence, corruption, and state-sponsored criminality under the Colorado Party's rule. The primary target is the \"Guión Rojo,\" whose paramilitary activities were long rumored to be state-sanctioned terror.\n\nThis is a monumental step. For the first time, we are choosing the rule of law over political convenience. However, the Colorado Old Guard remains powerful, entrenched in the military, the countryside, and the bureaucracy. This investigation will not be a simple administrative review; it will be a political war."
 par.44.a:0 "We must not flinch. Justice must be served."
 par.45.t:0 "A Crisis in the Countryside"
 par.45:0 "The Commission's first subpoenas have been sent, and the reaction has been swift and severe. In the rural interior, where Colorado loyalty is absolute, landowners and local *caudillos* have denounced the investigation as a \"liberal urban plot\" against the true people of Paraguay. Supply trucks to Asunción are being 'delayed,' and reports from our agents warn that the old Guión Rojo networks are not just being investigated, they are re-activating in protest.\n\nThe military, already wary of our government, warns that this is destabilizing the nation. We are at a crossroads: we can either escalate and break the resistance, or we can scale back the investigation to calm the situation."
 par.45.a:0 "This is insurrection. Double the Commission's security."
 par.45.b:0 "We cannot risk civil strife. Limit the investigation to a few low-level figures."
 par.46.t:0 "Justice is Served"
 par.47.t:0 "An Uneasy Peace"
 par.46:0 "The government's crackdown was successful. The rural resistance buckled, and the Commission was able to complete its work without compromise. The final report is a damning indictment of the entire Colorado Old Guard. High-level arrests have been made, the Guión Rojo is shattered, and the message is clear: no one is above the law. We have paid a high price in stability, but we have bought ourselves a truly clean government."
 par.47.d:0 "The government's decision to scale back the investigation has restored order. The rural *caudillos* have called off their protests, and stability has returned. However, the Commission's final report is a shadow of what it could have been. A few low-level paramilitaries have been scapegoated, but the high-level party officials and corrupt elites who orchestrated the crimes remain untouched. We have avoided a crisis, but at the cost of true justice."
 par.46.a:0 "A new, just era for Paraguay."
 par.47.a:0 "A necessary price for stability."