 UNITS_VIEW_BTN_DRAW_NAVAL_INV_WITH_HARBOR:2 "§HOrdre d'invasion navale (avec soutien de ports artificiels)§!\nÉtape 1) §GCliquer§! sur l'une des provinces mises en surbrillance pour décider du lieu de départ de l'invasion.\nÉtape 2) §GClic droit§! sur la ou les provinces côtières où le débarquement doit avoir lieu.\nUne fois le plan lancé, les préparatifs de l'invasion vont commencer, et des convois et un port artificiel être pris sur les réserves."
