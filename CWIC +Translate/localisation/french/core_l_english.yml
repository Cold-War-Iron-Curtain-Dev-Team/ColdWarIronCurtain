 NAVY_REPAIR_POLICY_SPLIT_DESC:2 "L'option §YPermettre de diviser§! permet aux navires les plus endommagés de se détacher et de revenir à proximité d’un port naval pour des réparations pendant que le reste de la force opérationnelle poursuit sa mission.\nLes navires détachés sont très vulnérables aux attaques pendant leur retour.\nUne fois les réparations terminées, les navires retourneront aux forces opérationnelles qui leur sont assignées.\n\nLe nombre de navires détachés dépend du paramètre priorité de réparation ainsi que des dommages subis par chaque navire."
 NAVY_REPAIR_NOW_CANCEL:1 "§RAnnuler§! les réparations."
 NAVY_REPAIR_NOW_CANCEL_RETURN:0 "\nRetourner et fusionner avec le $FLEET|H$."
 ALL_TASK_FORCES_REPAIR_NOW:0 "§HRéparer maintenant§!\nToutes les escadres sélectionnées vont retourner à leur base d'attache pour réparer.\n§GCliquer§! pour les y envoyer et leur faire reprendre ensuite leur mission.\n§GCtrl + clic§! pour les y envoyer et qu'elles y restent ensuite."
 NAVY_REPAIR_NOW:3 "§HRéparer maintenant§!\nL'escadre va retourner immédiatement à une base proche pour réparer.\n§GCliquer§! pour l'y envoyer et lui faire reprendre ensuite la mission en cours.\n§GCtrl + clic§! pour l'y envoyer et qu'elle y reste ensuite."
 SHIP_REPAIR_NOW:3 "§HRéparer maintenant§!\nLe ou les navires vont se détacher pour former une escadre distincte et rentrer à une base proche pour réparer.\nIls réintégreront l'escadre une fois réparés.\n§GCliquer§! pour détacher un seul navire.\n§GShift + clic§! pour sélectionner plusieurs navires et les détacher aussitôt §Gshift§! relâché."
 SHIP_REPAIR_NOW_WITHOUT_DETACHING:0 "§HRéparer maintenant!§!\n§GClic§! pour ajouter des navires à la file d’attente à réparer."
 SHIP_REFIT_TOOLTIP:0 "§HRénover des navires§!\nRéaménager les navires sélectionnés en fonction d’une conception de navire compatible différente."
 SHIP_REFIT_NO_SHIPS_TOOLTIP:0 "§RAucun navire n’est actuellement sélectionné.§!"
 SHIP_REFIT_NO_COMPATIBLE_DESIGNS_TOOLTIP:0 "§RIl n’y a pas de modèles de navires disponibles qui sont des cibles valides pour tous les navires actuellement sélectionnés.§!"
 SHIP_REFIT_UPGRADE_TOOLTIP:0 "§HMise à niveau du navire§!\nRéaménager ce navire pour utiliser une conception améliorée."
 SHIP_REFIT_TOOLTIP_DELAYED:1 "Après avoir sélectionné les navires voulus, tous ceux qui auront été sélectionnés se détacheront pour former une §Hescadre§! distincte et vont gagner une §Hbase navale§! pour être rééquipés. L'avancée des travaux sera visible dans l'interface de production.\n\nLes navires reviendront dans leur §Hescadre§! actuelle aussitôt qu'ils auront été rééquipés.\n\n§GShift + clic§! pour sélectionner plusieurs navires.\n§GCtrl + clic§! pour inverser la sélection."
