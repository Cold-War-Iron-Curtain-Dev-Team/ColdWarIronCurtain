 SHIP_REFIT_CONFIRM_DESCRIPTION:0 "§HRééquiper les $COUNT$ navires sélectionnés pour les conformer au modèle $VARIANT_NAME|H$.§!\n\nIls vont retourner à une §Hbase navale§! proche et y resteront jusqu'à la fin des travaux. Avec un maximum de §Hchantiers navals§! affectés à cela, cela va prendre jusqu'à $DAYS|H$ jours.\n\nSi la §Hbase navale§! est bombardée lors du rééquipement, une partie de l'avancement sera perdue. S'ils sont capturés, les navires passeront à l'ennemi.\n\nVoulez-vous lancer leur rééquipement ?"
