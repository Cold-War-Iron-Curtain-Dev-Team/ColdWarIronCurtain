 SUPPLY_NODE_MOTORIZATION_PRIORITY:1 "§HNiveau de motorisation§!\nLa motorisation du nœud logistique utilise en priorité les camions de la réserve pour accroître la portée de ravitaillement du nœud et la quantité de ravitaillement fournie dans les provinces.\n§GCliquer§! pour faire défiler les priorités."
