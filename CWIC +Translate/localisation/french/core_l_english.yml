 oil_desc:0 "Les produits pétrochimiques englobent un large éventail de substances dérivées du pétrole. Ils servent à fabriquer des carburants, des produits chimiques, des médicaments, des plastiques, des munitions et bien d'autres choses encore.\n§GComprend les éléments suivants :§!\n§YPétrole\nCharbon\nGaz\nBiocarburants§!"
 aluminium_desc:0 "Les métaux légers sont des métaux de faible densité utilisés dans des produits qui doivent être légers. On les retrouve couramment dans les avions, les produits de consommation et les équipements électriques.\n§GComprend les éléments suivants :§!\n§YAluminium (provenant de la bauxite)\nChrome (provenant de la chromite)\nNickel (provenant de la garnierite)\nZinc (provenant de la sphalérite)\nÉtain (provenant de la cassitérite)\nArgent (provenant de plusieurs gisements dans le jeu)\nMagnésium§!"
 rubber_desc:0 "La nourriture désigne tout ensemble de substances comestibles qui fournissent des nutriments aux êtres vivants.\n§GComprend les éléments suivants :§!§Y\nCéréales\nViande\nPoisson\nLégumes\nFruits\nÉpices et huiles\nFriandises\nPâte nutritive\nProduits laitiers\nTubercules\nBoissons gazeuses\nCafé et thé\nNoix\nCatégories alimentaires mineures§!"
 tungsten_desc:0 "Les métaux des terres rares constituent un ensemble de matériaux technologiques rares, indispensables à l'électronique. Cependant, dans ce mod, ils englobent tout matériau exceptionnellement rare généralement utilisé dans le domaine technologique. Les terres rares sont utilisées dans des produits de pointe et des armes.\n§GComprend les éléments suivants :§!\n§YÉléments des terres rares\nOr\nLithium\nPalladium§!"
 steel_desc:0 "Dans ce mod, les métaux de construction désignent tous les métaux lourds courants, vendus en vrac et largement disponibles pour la construction. Ils sont utilisés dans la construction, les véhicules, les produits de consommation et pratiquement toutes les armes.\n§GComprend les éléments suivants :§!\n§YAcier (à partir du minerai de fer hématite)\nCuivre (à partir de la chalcopyrite)\nPlomb (à partir de la galène)\nTungstène (à partir de la wolframite)\nMolybdène et manganèse§!"
 chromium_desc:0 "Les matières nucléaires sont des ressources utilisées dans la fission nucléaire. Elles servent à la fabrication d'armes nucléaires et à la production d'énergie nucléaire.\n§GComprend les éléments suivants :§!\n§YUranium (provenant de l'uraninite)\nPlutonium (présent dans les gisements d'uranium)\nThorium (provenant de la monazite)§!"
 electricity_desc:0 "L'électricité est une forme d'énergie résultant de particules chargées, qu'elles soient au repos ou en mouvement. Elle sert à alimenter pratiquement toutes les machines.\n§GComprend les éléments suivants :§!§Y\nÉnergie issue des combustibles fossiles\nÉnergie verte\nÉnergie nucléaire\nÉnergie issue de la biomasse (projet spécial rare)§!"
 CLAIM_LIST_DESC:0 "Pays avec des revendications sur cet état."
 SUPPLY_MAPICON_SUPPORTED_LIMITED_DESC:0 "Ce nœud pourrait prendre en charge un plus grand nombre d'approvisionnements, mais son accès est limité par des points d'§Rengorgement§!.\nTâchez d'améliorer les §Ginfrastructures§! disponibles le long de la route.\nAméliorez également les bases navales si la route englobe une voie maritime.\nPrévoyez ensuite des convois et escortes en nombres suffisants."
 SUPPLY_MAPICON_SUPPORTED_DESC:0 "Ce nœud prend en charge suffisamment d’approvisionnements jusqu’à présent.\nJe pense que l’utilisation augmentera à mesure qu’il y aura plus de troupes dans la région."
