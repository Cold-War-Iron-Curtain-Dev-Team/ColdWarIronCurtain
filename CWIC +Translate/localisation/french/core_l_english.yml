 NAVAL_MISSION_ACTIVATE:0 "Activer"
 NAVAL_MISSION_NAME_NONE:0 "En attente d’ordres"
 NAVAL_MISSION_NAME_PATROL:0 "Patrouiller"
 NAVAL_MISSION_NAME_PATROL_DESC:2 "Ordonne à l'escadre de patrouiller dans la zone d'opération de la flotte.\n\nUne escadre ne peut patrouiller que dans une région maritime à la fois.\nElle tente alors d'y repérer les flottes ennemies. La supériorité aérienne et les radars y aideront.\n\nL'ennemi peut très bien la repérer et l'engager avant qu'elle le fasse elle-même."
 NAVAL_MISSION_NAME_SEARCH_AND_DESTROY:0 "Rechercher et détruire"
 NAVAL_MISSION_NAME_STRIKE_FORCE:0 "Force d'intervention"
 NAVAL_MISSION_NAME_STRIKE_FORCE_DESC:3 "Ordonne à l'escadre d'attendre dans la base navale la plus proche jusqu'à ce qu'une force ennemie soit repérée.\nUne fois l'ennemi débusqué par une escadre de patrouille, la force de frappe va se rendre sur place pour l'attaquer."
 NAVAL_MISSION_NAME_SEARCH_AND_DESTROY_DESC:1 "Ordonne à l'escadre de rechercher les flottes ennemies croisant dans la ou les régions sélectionnées pour les affronter."
 NAVAL_MISSION_NAME_CONVOY_RAIDING:0 "Raid sur convoi"
 NAVAL_MISSION_NAME_CONVOY_RAIDING_DESC:1 "Ordonne à l'escadre d'attaquer les convois ennemis présents dans la ou les régions sélectionnées."
 NAVAL_MISSION_NAME_CONVOY_ESCORT:0 "Escorte de convoi"
 NAVAL_MISSION_NAME_CONVOY_ESCORT_DESC:1 "Ordonne à l'escadre d'escorter les convois présents dans la ou les régions sélectionnées afin de les protéger des attaques ennemies."
 NAVAL_MISSION_NAME_INVASION:0 "Transport/invasion"
 NAVAL_MISSION_NAME_INVASION_DESC:1 "Ordonne à l'escadre de soutenir les navires de transport de troupes et les invasions correspondant aux §Yordres d'invasion§! sélectionnés.\n§GCliquer§! pour activer cette mission, puis §Gcliquer§! sur la flèche d'invasion si une a déjà été tracée."
 NAVAL_MISSION_NAME_MINES_PLANTING:0 "Mouillage de mines"
 NAVAL_MISSION_NAME_MINES_PLANTING_DESC:2 "Ordonne à l'escadre de mouiller des mines en mer, dans la ou les régions sélectionnées. La pénalité maximale possible pour l'ennemi sera de :\n"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SHORE_BOMBARDMENT:0 "£mapicon_unit_invalid_orders£ Capacité de bombardement côtier faible"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SHORE_BOMBARDMENT_DESC:0 "La force opérationnelle ne sera pas en mesure d’aider efficacement les divisions sur la ligne côtière au combat en raison de ses faibles capacités de bombardement terrestre. Envisager d’ajouter des navires avec §YCanon Lourd§! à la force opérationnelle."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_DEPTH_CHARGES:0 "£mapicon_unit_invalid_orders£ Faible quantité de §YCharges de profondeur§!"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_DEPTH_CHARGES_DESC:0 "Il est peu probable que la force opérationnelle endommage les sous-marins. Envisagez d’ajouter des navires équiper de §HCharges de profondeur§!."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SUB_SURFACE_DETECTION:0 "£mapicon_unit_invalid_orders£ Faible détection de sous-marins"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SUB_SURFACE_DETECTION_DESC:0 "Il est peu probable que la force opérationnelle détecte des sous-marins pendant les combats. Envisagez d’ajouter plus de navires avec des §YSonars§!, §YRadars§! ou §YCatapultes d’avion§!."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_DETECTION:0 "£mapicon_unit_invalid_orders£ Détection de surface faible"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_DETECTION_DESC:0 "La force opérationnelle sera lente à détecter les ennemis potentiels. Envisager d’ajouter plus de navires avec des §YRadars§! er §YCatapultes d’avion§!."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SPEED:0 "£mapicon_unit_invalid_orders£ Faible vitesse maximale"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SPEED_DESC:0 "La vitesse moyenne de la force opérationnelle est trop faible et nuira à sa capacité de repérage. Envisager de supprimer les navires lents ou d’ajouter des navires plus rapides."
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_VISIBILITY:0 "£mapicon_unit_invalid_orders£ Visibilité élevée en surface"
 NAVAL_MISSION_MISSED_REQUIREMENT_WARN_SURFACE_VISIBILITY_DESC:0 "La force opérationnelle est trop visible et peut être facilement repérée et/ou contournée par l'ennemi. Envisagez d'utiliser des navires plus petits ou moins blindés, présentant une visibilité en surface réduite."
 NAVAL_MISSION_SET_REASON_FOR_PLANTING_NO_SHIPS:0 "Le minage est §Rimpossible§!, parce qu’aucun des navires de votre flotte n’a la capacité de le faire!"
 NAVAL_MISSION_SET_REASON_FOR_SWEEPING_NO_SHIPS:0 "Le déminage est §Rimpossible§!, parce qu’aucun des navires de votre flotte n’a la capacité de le faire!"
 NAVAL_MISSION_SET_REASON_FOR_NO_WAR:0 "Vous devez être §Ren guerre§! afin d’activer cette mission."
 NAVAL_MISSION_NAME_MINES_SWEEPING:0 "Dragage de mines"
 NAVAL_MISSION_NAME_MINES_SWEEPING_DESC:2 "Ordonne à l'escadre de chercher et neutraliser les mines en mer dans la ou les régions sélectionnées. La pénalité maximale possible causée par les mines ennemies sera de :\n"
 NAVAL_MISSION_NAME_NAVAL_INVASION_SUPPORT:0 "Soutien à l’invasion navale"
 NAVAL_MISSION_NAME_NAVAL_INVASION_SUPPORT_DESC:1 "Ordonne aux navires d'escorter les invasions navales et de les soutenir par des bombardements côtiers."
 NAVAL_MISSION_NAME_TRAINING:1 "Manœuvres en mer"
 NAVAL_MISSION_NAME_TRAINING_DESC:3 "Ordonne à l'escadre de procéder à des manœuvres dans la région à proximité de la base navale la plus proche.\nAvec le temps, il y a des risques que les navires soient endommagés.\nLes équipages ne gagneront plus en expérience une fois atteint le niveau normal.\nLes manœuvres font toutefois gagner en §Yexpérience navale§!.\nL'§Yorgueil de la flotte§! est moins susceptible de subir un accident que les autres navires.\n\n§HGMaintenir Shift et cliquer§! pour autoriser les §Hmanœuvres en mer§! jusqu'à ce que tous les navires soient entraînés au maximum."
 NAVAL_BTN_REMOVE_REGIONS:0 "§HSupprimer la région§!\n§GCliquez§! sur ce bouton, puis cliquez sur la région que vous souhaitez supprimer pour la flotte actuellement sélectionné.\n§GClic droit§! sur ce bouton pour §Rsupprimer toutes les régions§! pour la flotte actuellement sélectionnée."
 NAVAL_BTN_REMOVE_REGIONS_NO_REGIONS:0 "§RAucune région à supprimer.§!"
 NAVAL_CONFIRM_REMOVE_ALL_REGIONS:0 "Supprimer toutes les régions"
 NAVAL_CONFIRM_REMOVE_ALL_REGIONS_TEXT:0 "Êtes-vous sûr de vouloir §RSUPPRIMER TOUTES LES RÉGIONS§! pour cette flotte?"
 NAVAL_NO_STRIKE_FORCE_IN_REGION:0 "Aucune force de frappe n’opère dans la région"
 NAVAL_STRIKE_FORCE_STATUS_HEADER:0 "§HStatut des forces de frappe:§!"
 NAVAL_STRIKE_FORCE_STATUS_ENTRY:0 " - $NAME|H$: "
 NAVAL_STRIKE_FORCE_STATUS_READY:0 "£trigger_yes£ prêt à s’engager"
 NAVAL_STRIKE_FORCE_STATUS_ENGAGING:0 "£trigger_yes£ se déplace pour engager"
 NAVAL_STRIKE_FORCE_STATUS_ENGAGING_ANOTHER:0 "£trigger_no£ occupé à engager un autre"
 NAVAL_STRIKE_FORCE_STATUS_IN_COMBAT:0 "£trigger_no£ déjà au combat"
 NAVAL_STRIKE_FORCE_STATUS_ENEMY_TOO_STRONG:0 "£trigger_no£ enemie trop fort"
 NAVAL_STRIKE_FORCE_STATUS_NOT_READY:0 "£trigger_no£ pas prêt"
 NAVAL_STRIKE_FORCE_STATUS_NOT_ENOUGH_INTEL:0 "force ennemie inconnue"
 NAVAL_STRIKE_FORCE_STATUS_VERY_LIKELY_TO_ENGAGE:0 "très susceptible de s'engager"
 NAVAL_STRIKE_FORCE_STATUS_LIKELY_TO_ENGAGE:0 "susceptible de s'engager"
 NAVAL_STRIKE_FORCE_STATUS_UNLIKELY_TO_ENGAGE:0 "peu susceptible de s'engager"
 NAVAL_STRIKE_FORCE_STATUS_VERY_UNLIKELY_TO_ENGAGE:0 "très peu susceptible de s'engager"
 NAVAL_STRIKE_FORCE_STATUS_ENGAGEMENT_SETTING_DESC:0 "Pour la règle d’engagement: $SETTING|H$"
 NAVAL_MISSION_NAME_RESERVE_FLEET:0 "Réserve"
 NAVAL_MISSION_NAME_RESERVE_FLEET_DESC:0 "Une flotte de réserve restera en attente au port et viendra en renfort aux autres groupes opérationnels de son théâtre d'opérations pour lesquels l'option de renfort automatique est activée."
 NAVAL_MISSION_NAME_HOLD:0 "Tenir"
 NAVAL_MISSION_NAME_HOLD_DESC:3 "§GCliquez§! ou £h \nAnnuler la mission en cours et aller au port le plus proche.\n\n§GCTRL+Cliquez§! ou £ctrl   +£h \nAnnuler la mission en cours et rester en place.\n--------------\nLes navires de la capitale mis en attente dans une province maritime voisine d’une bataille terrestre pourront aider avec §HBombardement à terre§!.\nLes transporteurs mis en attente pendant qu’ils sont en mer pourront utiliser leurs escadrons pour des missions aériennes standard."
 NAVAL_MINES_REDUCTION_EFFECT_FROM_SWEEPING:0 "Nos capacités combinées de déminage réduiront les effets des mines ennemies par $FACTOR|0%$ pour cette force opérationnelle."
 NAVAL_GUI_BTN_MOVE:0 "§GClic droit§! sur la carte pour §Hdéplacer§! à la province.\nSi la flotte a une mission en cours, elle sera temporairement désactivée.\nL’unité procédera lorsque la formation sera réunie."
 NAVAL_GUI_BTN_ACTIVATE:0 "Activer l’ordre"
 NAVAL_GUI_BTN_DEACTIVATE:0 "§HDésactiver la commande§!"
 NAVAL_GUI_BTN_ACTIVATE_DESC:0 "Basculer le statut de l’ordre §HActif§!.\nPour l’activer, vous devez d’abord assigner un ou plusieurs §Yrégions§! et au moins un §YOrdre§!."
 NAVAL_GUI_BTN_REGIONS:0 "Cliquez sur la carte:\n§GClic droit§! à §Yajouter§!, ou §YMAJ§!+§GClic droit§! à §Yretirer§! les régions.\nLes régions doivent être voisines.\n§GClic droit§! sur ce bouton pour §Rtoutes les régions§!."
 NAVAL_GUI_BTN_MERGE:1 "Fusionner les escadres sélectionnées."
 NAVAL_GUI_BTN_NEW_FLEET_FROM_EXISTING:1 "§HCréer une nouvelle flotte§!"
 NAVAL_GUI_BTN_NEW_FLEET_FROM_EXISTING_DESC:0 "Créer une nouvelle flotte avec les navires de cette flotte"
 NAVY_SELECT_HALF:0 "Réduire de moitié la sélection actuelle de navires"
 NAVY_SELECT_HALF_NEED_MORE_THAN_ONE_SHIP:0 "§RNécessite au moins deux navires sélectionnés§!"
 SHIP_ENGAGEMENT_BUTTON_FIRE_AT_WILL:0 "§HRègle de mobilisation actuelle - §RFeu à volonté!§!§!"
 SHIP_ENGAGEMENT_BUTTON_FIRE_AT_WILL_DESC:1 "La force opérationnelle engagera toujours le combat contre l'ennemi. Si elle traverse une province où l'ennemi a été repéré ou si un combat est imminent, la force opérationnelle engagera le combat."
 SHIP_ENGAGEMENT_BUTTON_HOLD_FIRE:0 "§HRègle de mobilisation actuelle - §GNe pas engager§!§!"
 SHIP_ENGAGEMENT_BUTTON_HOLD_FIRE_DESC:1 "Le groupe opérationnel s'efforcera d'éviter tout affrontement avec l'ennemi afin de pouvoir traverser les provinces où se trouvent des navires et des combats ennemis.\nÀ moins que... nous ne soyons repérés et que l'ennemi ne tire le premier."
 SHIP_CURRENT_AGGRESSIVENESS_LEVEL:0 "Règle de mobilisation actuelle: $CURRENT|H$"
 SHIP_CLICK_TO_CHANGE_AGGRESSIVENESS_LEVEL:0 "§GClique§! pour changer à $NEXT|H$"
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_1:1 "Ne pas s'engager"
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_2:1 "S’engager à faible risque"
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_3:1 "S’engager à un risque moyen"
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_4:1 "S’engager à haut risque"
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_5:1 "Toujours engager"
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_1_DESC:1 "La force opérationnelle ne tenterons jamais engager un enem repéréy. Les §Hnavires de patrouille§! continueront de suivre leur cible actuelle et les §Hforces de frappe§! resteront à leur base."
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_2_DESC:1 "La force opérationnelle sera prudent sur les ennemis engagés et ne prendra des combats que contre des forces beaucoup plus petites."
 SHIP_ENGAGEMENT_BUTTON_AGGRESSIVENESS_3_DESC:1 "La force opérationnelle prendra des risques plus élevés tout en engageant des ennemis et se battra contre des forces qui ont une force comparable."
