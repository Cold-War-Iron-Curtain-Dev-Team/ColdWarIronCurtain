 SUPPLY_NODE_UPGRADE_TO_CAPITAL:2 "§HAmélioration des engorgements§!\nMettre en file d'attente les améliorations des engorgements liés aux voies ferrées et aux ports menant au cœur logistique. Cela améliorera ainsi le ravitaillement possible dans toutes les provinces à portée de ce nœud logistique."
