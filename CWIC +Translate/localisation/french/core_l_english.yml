 UNITS_VIEW_BTN_EXECUTE_NONE_SET_TOOLTIP:1 "Cette armée n'a aucun ordre à exécuter. Vous devez élaborer un plan pour y parvenir."
 UNITS_VIEW_BTN_EXECUTE_POINT_OUT:0 "Cliquez maintenant sur la carte, au niveau des ordres souhaités, pour activer ou désactiver leur exécution."
 UNITS_VIEW_BTN_DELETE_ORDER:1 "§HSupprimer l'ordre§!\n§GCliquez§! sur ce bouton, puis cliquez sur la carte sur l'ordre à supprimer.\nFaites un §Gclic droit§! sur ce bouton pour §Rsupprimer tous les ordres§! de l'armée actuellement sélectionnée."
 UNITS_VIEW_BTN_RESHAPE:0 "§HMode édition§!\nAppuyez sur ce bouton pour basculer le mode, ou maintenez §GALT§!\n§GClic droit§! sur les épingles de fin des plans de bataille pour les modifier.\n§GCliquez et maintenez le bouton de la souris enfoncé§! sur la flèche d’avancement pour le remodeler ou se connecter avec un autre ordre.\n§GClic droit et maintenez le bouton de la souris§! sur l’un des ordres clignotants de commencer à peindre une nouvelle flèche d’avancement."
 UNITS_VIEW_BTN_DRAW_OFFENCE:3 "§HLigne offensive§!\n§GClic droit sur la carte et faire glisser§! pour tracer une §Yligne offensive§!.\nCes lignes peuvent être tracées uniquement sur un territoire où vous avez placé une §Hligne de front§! ou une §Hinvasion navale§!.\n\nLes divisions affectées à un plan comportant une ligne offensive tenteront de s'emparer du territoire pour y déplacer leur ligne de front.\n\n§GMaintenir le bouton de la souris enfoncé§! et §Gle relâcher§! sur un bouton d'exécution pour modifier le type d'exécution du plan."
 UNITS_VIEW_BTN_DRAW_DEFENCE:1 "§HDéfinir une ligne de front§!\n – §GCliquer§! sur la frontière avec un autre pays pour définir la ligne de front tout du long.\n – §GClic droit et faire glisser§! sur la frontière avec un autre pays pour définir une ligne de front moins longue.\n – §GClic droit et faire glisser§! sur les extrémités de la ligne de front existante pour les modifier.\n\nC'est depuis les lignes de front que les offensives en territoire ennemi sont lancées en direction des lignes d'offensive, mais elles permettent aussi de stationner facilement les divisions le long d'une frontière."
 UNITS_VIEW_BTN_DRAW_DEFENCE_ARMY_GROUP:0 "§HLigne de front§!\n – §GCliquer§! sur la frontière avec un autre pays pour définir la ligne de front tout du long.\n – §GShift + clic§! sur la frontière avec un autre pays pour définir la ligne de front tout du long, sans fronts définis pour chaque armée.\n – §GClic droit et faire glisser§! sur la frontière avec un autre pays pour définir une ligne de front plus courte.\n – §GShift + clic droit et faire glisser§! sur la frontière avec un autre pays pour définir une ligne de front plus courte sans fronts définis pour chaque armée.\n – §GClic droit et faire glisser§! sur les extrémités de la ligne de front existante pour la corriger.\n\nC'est depuis les lignes de front que les offensives en territoire ennemi sont lancées en direction des lignes d'offensive, mais elles permettent aussi de stationner facilement les divisions le long d'une frontière."
 UNITS_VIEW_BTN_DRAW_FALLBACK:1 "§HLigne de repli§!\n – §GClic droit et faire glisser§! sur un territoire allié pour dessiner l'ordre de défense §Yà usage unique§!.\n\nLes lignes de repli sont utiles pour positionner des divisions pour la défense, par exemple derrière un fleuve ou en territoire allié."
 UNITS_VIEW_BTN_AREA_DEFENSE:3 "§HDéfense de la zone§!\n – §GCliquer§! sur les États à ajouter ou retirer de l'ordre de l'armée.\nUne armée ayant reçu cet ordre ne peut pas en recevoir d'autres en même temps.\n\nLes divisions affectées à une armée ayant reçu cet ordre se déploieront dans la zone désignée pour protéger les villes, ports ou autres sites importants, tout en pouvant faire face à une présence ennemie limitée."
 UNITS_VIEW_BTN_DRAW_NAVAL_INV:0 "§HOrdre d’invasion navale§!\nÉtape 1) §GClic§! sur l’une des provinces en surbrillance pour fixer la source de l’invasion.\nÉtape 2) §GClic droit§! sur la ou les provinces côtières désirées pour envahir.\nUne fois le plan activé, l’invasion commencera à préparer et à réserver des convois de vos pays."
 UNITS_VIEW_BTN_DRAW_PARADROP:0 "§HOrdre des parachutistes§!\nÉtape 1) §GClic§! sur notre base aérienne pour désigner le point de décollage. La base aérienne doit avoir des avions de transport disponibles.\nÉtape 2) §GClic droit§! sur la province qui se trouve dans le rayon d’action des avions de transport local, pour désigner l’emplacement de largage.\n§gRappelez-vous que seules les unités avec capacité de parachutisme seront transportées.§!"
