 FE_DIFFICULTY_VERY_EASY:0 "DEFCON 5"
 FE_DIFFICULTY_VERY_EASY_TOOLTIP:0 "§YDEFCON 5 - TRÈS FACILE§!\n\n\n\n£DEFCON_1\n\n\n\n\n§L« Une nation forte, tout comme une personne forte, peut se permettre d'être bienveillante, ferme, réfléchie et modérée. » - Jimmy Carter\n\nL'IA adoptera une attitude pacifique envers le joueur ; elle fera des concessions si elle est confrontée.§!"
 FE_DIFFICULTY_EASY:1 "DEFCON 4"
 FE_DIFFICULTY_EASY_TOOLTIP:0 "§YDEFCON 4 - FACILE§!\n\n\n\n£DEFCON_2\n\n\n\n\n§L« Que cela vous plaise ou non, l'histoire est de notre côté. » - Nikita Khrouchtchev\n\nL'IA adoptera généralement une attitude pacifique envers le joueur ; en cas de confrontation, elle fera généralement des concessions.§!"
 FE_DIFFICULTY_NORMAL:1 "DEFCON 3"
 FE_DIFFICULTY_NORMAL_TOOLTIP:0 "§YDEFCON 3 - NORMAL§!\n\n\n\n£DEFCON_3\n\n\n\n\n§L« Je veux faire partie de ces fous. ... Nous devons oser inventer l'avenir » - Thomas Sankara\n\nL'IA acceptera un compromis si celui-ci est mutuellement avantageux et qu'une escalade n'est pas nécessaire. À l'instar du comportement historique des grandes puissances à cette époque.§!"
 FE_DIFFICULTY_HARD:1 "DEFCON 2"
 FE_DIFFICULTY_HARD_TOOLTIP:1 "§YDEFCON 2 - HARD§!\n\n\n\n£DEFCON_4\n\n\n\n\n§L« N'oubliez pas que la tempête est une bonne occasion pour le pin et le cyprès de montrer leur force et leur stabilité. » - Ho Chi Minh\n\nL'IA sera moins encline à faire des concessions au joueur et passera en état d'alerte maximale si elle est confrontée à celui-ci.§!"
 FE_DIFFICULTY_VERY_HARD:0 "DEFCON 1"
 FE_DIFFICULTY_VERY_HARD_TOOLTIP:1 "§YDEFCON 1 - TRÈS DIFFICILE§!\n\n\n\n£DEFCON_5\n\n\n\n\n§L« La mort a ses avantages. Elle peut fertiliser la terre. » - Mao Zedong\n\nL'IA ne fera jamais de concessions au joueur et déclenchera la Troisième Guerre mondiale si elle est provoquée.§!"
