 SUPPLY_FLOW_PROVINCE_BREAKDOWN_OWNER:1 "$VALUE|H$ à partir de $PROVINCE$ ($OWNER$)"
 SUPPLY_FLOW_SHOW_RANGE:1 "Les §HCentres d’approvisionnement§! distribuer les fournitures dans les provinces voisines. Leur portée et leur efficacité dépendent des conditions météorologiques, de l’état du sol, de l’infrastructure, du niveau ferroviaire et de la motorisation.\n\nAugmenter la gamme et l’approvisionnement fournis par un §HCentre d’approvisionnement§!, envisager d’utiliser l'ordre de §HModernisation des chemins de fer§! ou changer le §HNiveau de motorisation§!.\n\nTenir §GMaj§! pour montrer la gamme.\n§GMaj-click§! à la motorisation du basculant.\n§GCTRL-cliquez§! à l’approvisionnement allié du basculant."
 SUPPLY_FLOW_DELAYED_DESC:5 "Le §Hravitaillement restant§! indique la quantité de ravitaillement fournie à la province, et dépend du ravitaillement de l'État et des nœuds logistiques à portée. Cette portée dépend des conditions météo, de l'état du sol, des infrastructures, du niveau de voie ferrée et de la motorisation.\n\nLes §Hdivisions§! consomment le ravitaillement de la province en fonction de leur poids de ravitaillement. Si leur §Hravitaillement en réserve§! est supérieur à la proportion de ravitaillement du lieu où elles se trouvent, elles vont consommer leurs réserves internes jusqu'à ce que le ravitaillement fourni soit au même niveau que le ravitaillement local.\n\nMaintenir §GCtrl§! pour afficher les sources de flux."
