l_english:
 CUB_50s_1945_the_1948_cuban_election:0 "Les élections cubaines de 1948"
 CUB_50s_1945_the_1948_cuban_election_desc:0 "Il est temps pour Cuba de voter à nouveau !"
 CUB_50s_grau_adminstration:0 "La présidence de Grau"
 CUB_50s_grau_adminstration_desc:0 "Ramon Grau, bien qu'il ait été élu pour la première fois en 1944, a encore beaucoup à accomplir pour mener à bien son dernier mandat au service de la République de Cuba."
 CUB_50s_the_hun_days:0 "Le Gouvernement des 100 Jours"
 CUB_50s_the_hun_days_desc:0 "Le gouvernement Grau était généralement surnommé le « gouvernement des Cent Jours », symbolisant l'unité que le nouveau gouvernement cubain allait parvenir à instaurer à plus grande échelle."
 CUB_50s_the_continuation_of_natpro:0 "La continuation des réformes progressistes"
 CUB_50s_the_continuation_of_natpro_desc:0 "Le gouvernement actuel est favorable à des réformes progressistes visant à garantir l'avenir des générations futures du peuple cubain."
 CUB_50s_support_for_natpro:0 "Le découpage électoral pour les Authentiques"
 CUB_50s_support_for_natpro_desc:0 "Afin de ne pas mettre en péril l'héritage de notre grand parti politique, nous devons renforcer progressivement notre emprise sur l'État cubain !"
 CUB_50s_junta_start:0 "Officiers Rebelles"
 CUB_50s_junta_start_desc:0 "Depuis que notre gouvernement a été élu notre régime est ouvertement rejeté par la population, et notre cote de popularité s'effondre. Même une grande partie de nos travailleurs et de nos militaires ont pris les armes."
 CUB_50s_focus_against_the_conservatives:0 "Mobilisation contre les conservateurs"
 CUB_50s_focus_against_the_conservatives_desc:0 "Les conservateurs et leur faction sont responsables de la corruption qui sévit dans notre pays, nous devons mener une croisade contre les traditionalistes et leurs idéaux !"
 CUB_50s_focus_against_the_liberals:0 "Focus contre les Libéraux"
 CUB_50s_focus_against_the_liberals_desc:0 "C'est grâce aux libéraux que notre nation s'est ralliée à nous lors de la révolution de 1933. Pour obtenir l'adhésion du peuple, nous devons préserver nos idéaux dans l'intérêt général."
 CUB_50s_perform_rallies_in_southern_cuba:0 "Organiser des rassemblements dans le sud de Cuba"
 CUB_50s_perform_rallies_in_southern_cuba_desc:0 "Nos responsables politiques ont besoin d'un soutien accru dans le Sud afin de leur montrer ce qu'est la véritable démocratie."
 CUB_50s_support_from_the_republican_party:0 "Soutien du Parti Républicain"
 CUB_50s_support_from_the_republican_party_desc:0 "Une invitation du Comité National Républicain des États-Unis nous a proposé une aide financière pour lutter contre nos adversaires, les libéraux, qui bénéficient du soutien du Parti démocrate américain. Nous devrions accepter cette aide pour assurer une plus grande prospérité à notre parti."
 CUB_50s_raise_the_minimum_wage:0 "Augmenter le salaire minimum"
 CUB_50s_raise_the_minimum_wage_desc:0 "Les classes défavorisées à Cuba souffrent de salaires trop bas, ces salaires devraient être accessibles à tous les travailleurs."
 CUB_50s_establish_longer_working_periods:0 "Allonger la durée de la vie active"
 CUB_50s_establish_longer_working_periods_desc:0 "Ce nouveau projet de loi permettra aux travailleurs cubains de travailler plus longtemps afin de gagner le salaire dont ils ont besoin."
 CUB_50s_nationalization_of_the_cuban_electric_industry:0 "Nationalisation du secteur de l'électricité à Cuba"
 CUB_50s_nationalization_of_the_cuban_electric_industry_desc:0 "L'électricité cubaine doit rester cubaine jusqu'à la chute de notre régime !"
 CUB_50s_automony_to_the_university_of_havanna:0 "Autonomie pour l'Université de La Havane"
 CUB_50s_automony_to_the_university_of_havanna_desc:0 "L'université de La Havane réclame son autonomie depuis très longtemps. Il est temps que le Parti authentique exauce ce souhait."
 CUB_50s_limit_militaristic_control:0 "Limiter l'emprise de l'armée sur le Congrès"
 CUB_50s_limit_militaristic_control_desc:0 "L'armée a beaucoup fait pour Cuba, mais il est temps que les forces armées cubaines se tiennent à l'écart de la politique et se consacrent plutôt à la défense de notre nation."
 CUB_50s_appease_the_armed_forces:0 "Apaiser les forces armées"
 CUB_50s_appease_the_armed_forces_desc:0 "Nous ne pouvons pas prendre le risque de voir la démocratie périr pour satisfaire nos propres intérêts ; au contraire, les croisés armés doivent se reposer en vue des guerres contre la République de Cuba."
 CUB_50s_supposed_unity:0 "Proposition d'unité"
 CUB_50s_supposed_unity_desc:0 "Pour que l'espoir d'une véritable souveraineté cubaine se concrétise, il faut apaiser l'armée par tous les moyens afin d'éviter tout coup d'État militaire dans un avenir proche."
 CUB_50s_split:0 "Une véritable scission"
 CUB_50s_split_desc:0 "Le Parti orthodoxe est issu d'une scission au sein de la Faction authentique, bien qu'ils partagent les mêmes idéaux ; le Parti orthodoxe estime que cela entraînera des problèmes similaires à ceux auxquels les Américains ont été confrontés avec les projets de loi qu'ils ont adoptés."
 CUB_50s_victory_for_the_socialists:0 "Une victoire socialiste !"
 CUB_50s_victory_for_the_socialists_desc:0 "Étonnamment, les socialistes cubains ont remporté la majorité des voix."
 CUB_50s_an_authentic_:0 "CUB_an_authentic_"
 CUB_50s_an_authentic_victory:0 "Une victoire authentique"
 CUB_50s_an_authentic_victory_desc:0 "Comme prévu, le Parti de l'Authenticité a recueilli la majorité des suffrages lors des élections générales, remportant ainsi les primaires !"
 CUB_50s_victory_for_cuban_liberal:0 "Une victoire pour le libéralisme cubain !"
 CUB_50s_victory_for_cuban_liberal_desc:0 "Contre toute attente, le Parti libéral, grâce au soutien du Parti démocrate américain, a remporté les élections avec une faible avance !"
 CUB_50s_increase_taxes:0 "Augmenter la fiscalité"
 CUB_50s_increase_taxes_desc:0 "C'est grâce à la fiscalité que les États parviennent à dégager davantage de fonds pour financer des projets et des travaux publics. "
 CUB_50s_government_control:0 "Renforcer le contrôle de l'État"
 CUB_50s_government_control_desc:0 "Le gouvernement devrait être capable de prendre soin de son peuple, tout comme le peuple est là pour cette grande nation."
 CUB_50s_meeting_with_dp:0 "Rencontre avec le Parti démocrate"
 CUB_50s_meeting_with_dp_desc:0 "Les démocrates américains tiennent absolument à ce que notre parti occupe la première place dans la sphère cubaine."
 CUB_50s_liberalize_industries:0 "Libéraliser les secteurs d'activité"
 CUB_50s_liberalize_industries_desc:0 "Il faut que les entreprises suivent notre programme. Et qu'elles offrent à nos collègues de meilleures conditions pour qu'ils puissent continuer à travailler !"
 CUB_50s_edu_cuba:0 "L'éducation pour tous les Cubains !"
 CUB_50s_edu_cuba_desc:0 "Le peuple cubain mérite une éducation qui contribue à la réalisation du projet national"
 CUB_50s_power_to_the_CNOC:0 "Soutenir le CTC"
 CUB_50s_power_to_the_CNOC_desc:0 "La CTC, ou Union centrale des travailleurs de Cuba, est un syndicat populaire placé sous le contrôle actuel du gouvernement cubain. Nous devrions soutenir ce collectif dans la lutte qu'il mène."
 CUB_50s_nationalize_industries:0 "La nationalisation des industries"
 CUB_50s_nationalize_industries_desc:0 "Cuba n'a cessé d'être la cible des idéaux impérialistes des États-Unis. Nous devons piétiner le pied de la Statue de la Liberté et nationaliser les industries présentes à Cuba."
 CUB_50s_propaganda_encursion:0 "Incursion de propagande"
 CUB_50s_propaganda_encursion_desc:0 "Pour consolider notre pouvoir à Cuba, nous avons besoin de la propagande afin que les masses gardent les yeux rivés sur nous."
 CUB_50s_remove_private_property:0 "Supprimer la Propriété privée"
 CUB_50s_remove_private_property_desc:0 "Pour qu'une société s'épanouisse, il faut abolir les limites de la propriété afin de rétablir le véritable socialisme."
 CUB_50s_proclaim_the_one_party_state:0 "Proclamer l'État à parti unique"
 CUB_50s_proclaim_the_one_party_state_desc:0 "Cuba doit prendre conscience de sa mission : libérer les travailleurs de leurs oppresseurs. Que cette proclamation se répande chez nos voisins et parmi nos anciens alliés !"
 CUB_50s_crusade_against_corruption:0 "Lutter contre la corruption"
 CUB_50s_crusade_against_corruption_desc:0 "Le Parti orthodoxe a perçu les liens entre le Parti authentique et la corruption, qui trouve ses racines dans l'ère Batista. "
 CUB_50s_reformation_of_the_house:0 "Réforme de la Chambre"
 CUB_50s_reformation_of_the_house_desc:0 "Cuba mérite un gouvernement plus présent, capable de répondre aux aspirations du peuple."
 CUB_50s_privatization_of_enterprises:0 "Privatisations d'entreprises"
 CUB_50s_privatization_of_enterprises_desc:0 "Pour que Cuba prospère, elle doit s'aligner sur les principes de l'économie de marché."
 CUB_50s_nationalization_of_cuban_railways:0 "Nationalisation des chemins de fer cubains"
 CUB_50s_nationalization_of_cuban_railways_desc:0 "Nous devons valoriser nos infrastructures en les présentant comme des infrastructures conçues par des Cubains et destinées aux Cubains"
 CUB_50s_true_national_identity:0 "Une véritable identité nationale"
 CUB_50s_true_national_identity_desc:0 "Le patriotisme mène un pays vers la réussite. Susciter ce regain de patriotisme devrait profiter au Parti orthodoxe."
 CUB_50s_the_raise_of_civil_liberties:0 "Éloge des libertés civiles"
 CUB_50s_the_raise_of_civil_liberties_desc:0 "Les libertés civiles permettent au peuple de rester libre et fort. Si ces libertés sont protégées, le peuple devrait être de notre côté."
 CUB_50s_establishment_of_the_national_bank:0 "Créer la Banque nationale"
 CUB_50s_establishment_of_the_national_bank_desc:0 "Les Cubains ont dû recourir aux banques locales pendant un certain temps. Cependant, La Havane devrait créer sa première banque nationale pour que le rêve cubain puisse se réaliser."
 CUB_50s_establish_tribunal_accounts:0 "Créer des comptes pour le tribunal"
 CUB_50s_establish_tribunal_accounts_desc:0 "Afin de garantir la liberté politique et économique, il convient de mettre en place des tribunaux chargés de préserver cette paix entre la politique et l'économie."
 CUB_50s_preservation_of_the_ap:0 "Préservation de l'esprit authentique de la fête"
 CUB_50s_preservation_of_the_ap_desc:0 "Pour que Cuba puisse s'épanouir pleinement, elle a besoin du Parti authentique afin de préserver ces libertés qu'elle risque de perdre facilement."
 CUB_50s_the_cordial_president:0 "Le président Carlos Prios "
 CUB_50s_the_cordial_president_desc:0 "Carlos Prios est réputé pour son engagement en faveur de la justice populaire et du droit à la liberté à Cuba. "
 CUB_50s_a_new_and_free_cuba:0 "Une nouvelle Cuba libre"
 CUB_50s_a_new_and_free_cuba_desc:0 "Cuba est à nouveau libre et, pour la première fois de son histoire, les Américains n'ont pratiquement plus aucune influence sur la politique cubaine depuis longtemps !"
 CUB_50s_the_coup:0 "Une journée dans les cendres"
 CUB_50s_the_coup_desc:0 "Avec le temps, Cuba pourrait s'engager sur une voie qui la conduirait à adopter des méthodes dangereuses au nom de fausses idées idéalistes, ce qui mènerait ce pays à la catastrophe. Batista doit prendre le pouvoir et agir sans tarder pour Cuba."
