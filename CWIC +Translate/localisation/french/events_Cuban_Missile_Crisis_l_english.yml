l_english:
 cubamc.1.d:0 "La Maison Blanche a ordonné au Pentagone de commencer à déployer des escadrons de missiles Jupiter à tête nucléaire en Italie et en Turquie. Le déploiement en Italie permettra de se prémunir contre une agression communiste émanant du bloc soviétique. Les missiles en Turquie défendront le flanc sud de l'OTAN contre une agression soviétique écrasante. Les gouvernements italien et turc ont donné leur accord à ce déploiement à l'issue de réunions en tête-à-tête avec des responsables américains. Les missiles Jupiter sont des missiles balistiques à moyenne portée et leur déploiement suscite de vives inquiétudes de la part de l'Union soviétique. Moscou estime que ces missiles constituent une arme de première frappe, positionnée si près du territoire soviétique afin de réduire son temps de réaction potentiel en cas de guerre. Pour le gouvernement américain, ce déploiement vise à soutenir ses alliés de l'OTAN qui vivent dans la crainte constante d'une éventuelle agression soviétique."
 cubamc.2.d:0 "Le déploiement de missiles nucléaires américains Jupiter en Turquie et en Italie constitue une menace directe pour la stabilité et la défense du peuple soviétique. Les hauts responsables militaires et le Premier ministre Nikita Khrouchtchev ont élaboré les grandes lignes d’un plan visant à déployer secrètement des missiles soviétiques à Cuba, baptisé « Opération Anadyr ». Cela permettrait de rétablir l’équilibre stratégique et inciterait les Américains à réfléchir à deux fois avant d’encercler notre nation avec de telles armes à l’avenir. Pour préparer le terrain, nous devons obtenir la coopération de Cuba et de son dirigeant, le président Fidel Castro. Le chef de notre Force de missiles stratégiques, le maréchal Sergueï Biryuzov, est envoyé à La Havane pour solliciter le soutien cubain."
 cubamc.3.d:0 "Le maréchal Sergueï Biryuzov a eu des premiers entretiens avec le dirigeant cubain, le président Fidel Castro. Il lui a présenté les grandes lignes du déploiement secret prévu de nos forces sur l’île et l’a exhorté à coopérer. Castro s’est parfois montré enthousiaste face à cette proposition, affirmant que cela permettrait de punir les Américains pour leur agression envers le peuple cubain. Il a toutefois exprimé sa crainte que le fait d’accepter le déploiement de telles armes ne le fasse passer pour un vassal de l’Union soviétique et ne nuise à la cause de la révolution dans les Amériques. Au lieu d'un déploiement de missiles, Castro a fait une contre-proposition selon laquelle les Soviétiques signeraient une alliance de défense avec Cuba. Cela garantirait l'indépendance de Cuba face à toute nouvelle agression américaine et humilierait ces derniers pour leur incapacité à réprimer la révolution cubaine. Nous devons ordonner à Biryuzov d'insister sur le déploiement de missiles, ou bien nous pouvons accepter la contre-proposition."
 cubamc.4.d:0 "Nos représentants ont poliment décliné la contre-proposition cubaine, expliquant que les États-Unis étaient déjà conscients des relations étroites qui unissent nos deux nations. Nous avons ensuite réitéré notre souhait de déployer des missiles stratégiques à Cuba. Une telle issue ne se contenterait pas d’humilier les Américains, mais les placerait également dans la situation même dans laquelle ils ont mis le peuple cubain par leurs menaces constantes d’invasion. Après mûre réflexion, nous avons le plaisir d’annoncer que le président Fidel Castro a accepté et déclaré que Cuba accueillerait chaleureusement ce déploiement soviétique. L'accord ayant été obtenu, des plans sont déjà en cours d'élaboration pour charger des cargos avec du matériel de construction, des armes et du personnel afin que nous puissions rapidement mettre les missiles en service. Notre premier déploiement prendra probablement un mois."
 cubamc.5.d:0 "Nos représentants ont poliment décliné la contre-proposition cubaine, expliquant que les États-Unis étaient déjà conscients des liens étroits qui unissent nos deux nations. Nous avons ensuite réitéré notre souhait de voir des missiles stratégiques déployés à Cuba. Une telle issue ne se contenterait pas d’humilier les Américains, mais les placerait aussi dans la même situation qu’ils ont imposée au peuple cubain par leurs menaces constantes d’invasion. Malheureusement, le président Fidel Castro a de nouveau refusé. Il a insisté sur le fait que la meilleure voie à suivre serait la signature d’une alliance défensive. Il a fait part de sa crainte que, si le déploiement secret d'armement soviétique sophistiqué venait à être découvert, les Américains le présenteraient comme un client de l'Union soviétique. Cela serait catastrophique pour la cause de la révolution dans les Amériques. Il est clair que les Cubains ne nous aideront pas dans le cadre de l'opération Anadyr. Nous devons décider soit de signer l'alliance, ce qui nuirait à la position des États-Unis dans la région, soit de simplement dire aux Cubains que nous allons y réfléchir et mettre fin aux pourparlers."
 cubamc.6.d:0 "Aujourd’hui, à La Havane, de hauts représentants de l’Union soviétique ont signé une alliance défensive avec le gouvernement cubain dirigé par le président Fidel Castro. Ce traité garantit que les deux nations viendront à la défense l’une de l’autre en cas d’agression. Cet accord est présenté et considéré comme une réponse directe aux États-Unis. Dans son allocution, le président Castro a souligné que ce traité démontrait à quel point le peuple soviétique se souciait des peuples opprimés du monde, puisqu’il l’avait conclu en pleine connaissance des intentions hostiles des Américains. Le gouvernement soviétique a publié sa propre déclaration, affirmant qu'il n'abandonnera jamais le peuple cubain et qu'il continuera à soutenir sa cause révolutionnaire. Aux États-Unis, les journaux ont critiqué la Maison Blanche pour avoir laissé Cuba tomber dans le giron du bloc communiste et ont fait part de leurs craintes que les Cubains n'étendent leurs efforts de déstabilisation à l'ensemble de la région. Les analystes affirment également que ce traité remet directement en cause la doctrine Monroe, chère aux États-Unis, qui déclare que l'hémisphère occidental fait partie de la sphère d'influence américaine."
 cubamc.7.d:0 "Des cargos en provenance d'Union soviétique, transportant des troupes, des ingénieurs, des dirigeants et du matériel lourd de manœuvre, ont récemment accosté à Cuba. Agissant dans le plus grand secret, ils ont déjà commencé à moderniser les aérodromes cubains et à préparer les sites de lancement destinés à accueillir les missiles nucléaires. Le personnel sélectionné pour cette mission compte parmi les meilleurs et les plus loyaux de toute l'Union soviétique. Nous ne pensons pas que les Américains découvriront nos activités grâce à des sources de renseignement sur l'île. La base et les équipes chargées des missiles sont gardées par une importante force soviétique et l'armée de l'air déploiera également des avions de chasse pour renforcer la défense aérienne des sites."
 cubamc.8.d:0 "La CIA effectuait régulièrement des vols de reconnaissance aérienne au-dessus de Cuba afin de déterminer les intentions de ce pays et de trouver des preuves de déploiements soviétiques. Cependant, ces vols ont récemment été suspendus en raison du risque d’incidents internationaux et de l’arrivée d’armements antiaériens soviétiques sophistiqués destinés à l’armée cubaine. Un vol de reconnaissance de la Marine a récemment repéré un cargo soviétique qui semblait transporter des caisses de pièces détachées d’avions soviétiques à destination de Cuba. De plus, des rapports des services de renseignement indiquaient le déploiement de sites de missiles sol-air à Cuba, selon le même schéma que ceux mis en place pour défendre les sites de missiles nucléaires soviétiques. Forts de ces informations, les vols d'avions espions ont repris, sous le contrôle de l'armée de l'air. Les photographies prises ont été analysées, et des sites de lancement de missiles nucléaires soviétiques ont été identifiés. Le président en a rapidement été informé, et il a immédiatement convoqué une réunion du Comité exécutif du Conseil national de sécurité afin d'élaborer une réponse. Pour de nombreux membres du gouvernement, le déploiement de missiles nucléaires soviétiques à Cuba équivalait à placer des armes nucléaires sur le sol américain."
 cubamc.9.d:0 "Le président Kennedy a convoqué le Comité exécutif du Conseil national de sécurité (EXCOM) afin d'examiner les photographies des armes nucléaires soviétiques à Cuba et de décider d'une réponse. Tous les membres ont convenu qu'une décision devait être prise dès que possible. Au final, le président Kennedy avait trois options. La première, présentée par l'état-major interarmées, prévoyait de frapper immédiatement des centaines de cibles lors de frappes aériennes, suivies d'une invasion de Cuba. Le président fit remarquer qu'une telle option risquait de voir Berlin tomber aux mains des Soviétiques et d'affaiblir l'OTAN. La deuxième option, soutenue par la plupart des membres, consistait à mettre en place un blocus pour empêcher l'arrivée d'autres armes offensives sur l'île. Enfin, il y avait l'option de ne pas réagir. Certains membres du comité estimaient que le déploiement soviétique était trop modeste pour perturber l'équilibre des forces et que le fait d'en faire un problème pourrait provoquer une panique inutile et enhardir les Soviétiques."
 cubamc.10.d:0 "Selon des informations en provenance de La Havane, des avions américains auraient bombardé des sites et des infrastructures à travers toute l'île. Ils viseraient apparemment nos chantiers de construction et les infrastructures de défense cubaines. La marine américaine est en train d'être mobilisée et les Cubains s'attendent à une invasion terrestre d'ici peu. Des rumeurs circulent déjà selon lesquelles des parachutistes ou des forces spéciales américaines opéreraient déjà sur l'île. Le président cubain, Fidel Castro, a sollicité notre aide de toute urgence. Nous devons décider d'une réponse adéquate. Une option consiste à soutenir pleinement Cuba et à lancer une riposte nucléaire totale contre les États-Unis, ce qui dévasterait nos deux nations. La deuxième option pourrait être d'autoriser nos forces déjà présentes à Cuba à engager le combat contre les forces d'invasion ; il s'agirait d'une riposte plus limitée, mais qui réduirait le risque d'un échange nucléaire. Nos forces, combinées à celles des Cubains, pourraient renverser le cours de la bataille. Enfin, nous pouvons limiter les dégâts et informer le président Castro qu'il est livré à lui-même."
 cubamc.11.d:0 "Les forces des États-Unis et de leurs alliés à Berlin-Ouest se sont rendues à l'armée soviétique. Le commandant américain a pris cette décision afin d'éviter des pertes civiles, conscient que toute résistance armée conduirait à l'anéantissement de ses propres forces sans aucun gain. La prise de Berlin par les Soviétiques constitue une riposte à l'invasion de Cuba par les États-Unis. Les Soviétiques ont affirmé que leurs actions étaient justifiées, car ils protégeaient leur propre sphère d'influence, tout comme les États-Unis prétendaient le faire à Cuba. Les alliés américains en Europe seraient furieux de cette nouvelle, et nombreux sont ceux qui reprochent aux États-Unis d'avoir provoqué cette dernière action soviétique par leurs agissements imprudents à Cuba. On ignore comment les États-Unis vont réagir, ni quand, ni même si les Soviétiques ont l'intention de rendre les forces qui se sont rendues. Beaucoup en Europe craignent que la situation ne dégénère en une nouvelle guerre mondiale."
 cubamc.12.d:0 "La Marine a informé la Maison Blanche que son blocus était en vigueur. Afin d’éviter une escalade de la violence ou de ne pas fournir aux Soviétiques un prétexte pour intensifier les hostilités, le Département d’État a réussi à faire approuver le blocus non pas comme un acte de guerre, mais comme une mesure de défense visant à protéger l’hémisphère occidental. Pour ce faire, il a obtenu l'accord de l'Organisation des États américains et s'est engagé à ce que le blocus vise uniquement à empêcher l'arrivée d'armes offensives sur l'île, conformément aux termes du Traité de Rio de 1947. De plus, nous avons lancé un ultimatum au gouvernement soviétique, lui indiquant que nos actions ne cesseraient pas tant que tous les missiles offensifs soviétiques n'auraient pas été retirés de l'île."
 cubamc.13.d:0 "\nLe peuple américain a été stupéfait ce soir lorsque le président [USA.GetLeader] a informé la nation de la découverte de missiles nucléaires soviétiques sur l'île de Cuba. Dans son allocution, [USA.GetLeader] a souligné que tout missile nucléaire lancé depuis Cuba contre un État de l'hémisphère occidental serait considéré comme une attaque directe de l'Union soviétique contre les États-Unis. Le président a également fait part de son intention de mettre en place ce qu'il a qualifié de « quarantaine » autour de Cuba. Il a déclaré que tout navire transportant des armes offensives serait refoulé, mais que ceux qui n'en transportaient pas seraient autorisés à entrer. Il a ajouté que la marine américaine appliquerait cette quarantaine depuis les eaux internationales. Il a souligné que la quarantaine n'empêcherait pas l'importation de produits de première nécessité ou de marchandises non militaires. Les forces américaines à travers le monde sont également en cours de mobilisation."
 cubamc.14.d:0 "Les Américains ont découvert les détails de l'opération Anadyr et savent que nous avons l'intention de déployer des missiles nucléaires à Cuba. Leur récente déclaration de blocus et l'ultimatum lancé à notre gouvernement pour qu'il retire ces missiles montrent que l'opération n'est plus un secret. Nous avons déjà des cargos en route vers Cuba transportant des armes, et le blocus américain pourrait facilement constituer la première étape d'une escalade majeure du conflit. Les dirigeants ont décidé de donner l'ordre à nos forces à Cuba de se préparer à une invasion, et notre ambassadeur informera le président Castro que les Américains savent que nous avons déjà des missiles sur l'île et qu'il doit préparer ses propres forces."
 cubamc.15.d:0 "Il est clair que la marine américaine a l'intention d'arraisonner et d'inspecter tous nos navires, puisqu'elle a déjà arraisonné et inspecté un navire libanais. La marine américaine déploie déjà ses navires sur la route de nos cargos en approche. Les capitaines de nos navires attendent désespérément des ordres. Nous devons décider si nous voulons que les navires maintiennent leur position et tentent de négocier un accord avec les Américains, ou si nous devons aller de l'avant et défier le blocus. Si nous choisissons la deuxième option, les cargos seront suivis de près par nos sous-marins présents dans la zone. La tension continue de monter alors que les forces soviétiques à travers le monde passent en état d'alerte renforcé."
 cubamc.16.d:0 "Après un échange de messages tendus entre Moscou et Washington, la Maison Blanche a reçu une offre ferme du Premier ministre [SOV.GetLeader]. Le dirigeant soviétique a promis de retirer toutes les armes nucléaires de Cuba à condition que nous retirions nos missiles nucléaires de Turquie et que nous nous engagions à ne pas envahir Cuba. À l'annonce de cette offre, de nombreux membres de l'administration ont immédiatement insisté pour que nous la rejetions et exigions un retrait inconditionnel des Soviétiques. À leurs yeux, l'offre soviétique est un signe de faiblesse. Cependant, le président et ses proches conseillers semblent enclins à accepter l'accord : une guerre à Cuba serait coûteuse et les missiles en Turquie étaient en grande partie obsolètes. En substance, les États-Unis n'auraient rien à perdre et atteindraient leurs objectifs, tandis que les Soviétiques pourraient sauver la face sur la scène internationale. Mais ce n'est pas au président seul de décider quelle position il adoptera : la vie de millions de personnes est en jeu."
 cubamc.17.d:0 "Le Premier ministre Nikita Khrouchtchev et ses principaux collaborateurs ont appris que le gouvernement américain avait accepté sa proposition visant à résoudre la crise à Cuba. Rares étaient ceux, dans la salle, qui pouvaient cacher leur joie et leur soulagement à l’idée qu’une solution ait été trouvée. L’armée soviétique a déjà reçu l’ordre de retirer ses forces de Cuba et de rappeler les cargos en route vers l’île. Le fait que les Américains aient accepté de retirer leurs missiles de Turquie est salué comme une victoire stratégique. Plus important encore, en obtenant des Américains la garantie qu'ils n'envahiraient pas Cuba, nous avons assuré la survie de la révolution cubaine. Le président Fidel Castro a certes exprimé une certaine déception face à ce résultat, mais il se rendra bientôt compte qu'il s'agit là de la meilleure issue possible."
 cubamc.18.d:0 "Après deux semaines de tension pendant lesquelles le monde entier retenait son souffle, la crise des missiles de Cuba a pris fin. Les États-Unis et l'Union soviétique sont parvenus à conclure un accord prévoyant le démantèlement et le retrait par l'Union soviétique de ses forces nucléaires de Cuba. En échange, les États-Unis se sont engagés à respecter la souveraineté et les droits de Cuba. Beaucoup considèrent cet accord comme une victoire pour les États-Unis, bien que des rumeurs laissent entendre que le gouvernement américain aurait fait d'autres concessions concernant le déploiement de ses forces nucléaires. Quoi qu'il en soit, le peuple américain salue le président pour la fermeté dont il a fait preuve pendant la crise. En Union soviétique, des tensions semblent régner au sein du Politburo, de nombreux membres estimant que la crise n'aurait pas dû atteindre ce stade de confrontation extrême."
 cubamc.19.d:0 "Nous avons appris que le gouvernement américain a rejeté nos propositions raisonnables et exige le retrait inconditionnel de nos armes nucléaires de Cuba. Les hauts responsables militaires affirment que nous n'avons désormais plus que deux options. La première consiste à admettre que le projet cubain a échoué et à entamer le processus de retrait de nos forces ; heureusement, cela ne devrait pas poser de difficulté. Cependant, cela constituerait un revers diplomatique dévastateur pour l'État. L'autre option consiste à ordonner à nos cargos de poursuivre leur route et de tenter de passer le blocus. Cela pourrait remettre la pression sur les Américains et les amener à décider s'ils veulent la guerre ou non. La décision nous appartient, l'avenir de la révolution mondiale est en jeu."
 cubamc.20.d:0 "Le monde respire beaucoup mieux maintenant que l'on sait que l'Union soviétique va commencer à démanteler et à retirer toutes ses forces nucléaires de Cuba. Les États-Unis affirment qu'aucun accord n'a été conclu et que les Soviétiques ont pris la bonne décision. La nouvelle du retrait soviétique de Cuba est accueillie avec enthousiasme par les alliés américains, tandis que les États socialistes seraient très en colère face à ce qui semble être une capitulation soviétique face aux exigences américaines. Le gouvernement cubain serait découragé par le retrait soviétique et Fidel Castro serait furieux que les Soviétiques aient apparemment abandonné la nation cubaine. Des foules se sont rassemblées dans les villes à travers l'Amérique pour célébrer le leadership fort du président tout au long de la crise."
 cubamc.21.d:0 "Le Pentagone a informé la Maison Blanche que des cargos soviétiques, transportant probablement des armes offensives, tentent de franchir le blocus. Nos navires de guerre leur ont adressé des avertissements sévères, mais ces navires les ignorent. Nous devons prendre une décision cruciale : ordonner à nos navires d'ouvrir le feu et de neutraliser les navires soviétiques, ou battre en retraite et les laisser passer. Certains membres du gouvernement soulignent que la présence soviétique et les armes nucléaires n'auront guère d'impact sur l'équilibre stratégique, et que nous devrions nous abstenir plutôt que de risquer un échange cataclysmique. D'autres, en particulier les chefs militaires, demandent à nos forces de mettre en œuvre le blocus et de démontrer le sérieux de notre position en tirant sur les navires désobéissants. Une décision capitale doit être prise."
 cubamc.22.d:0 "Lorsque les navires soviétiques ont franchi le cordon de quarantaine naval des États-Unis et sont arrivés à Cuba en grande pompe, il est rapidement apparu que la politique américaine avait échoué. Les États-Unis avaient auparavant averti que tout navire violant leur quarantaine s'exposait à une saisie par la force ou à des tirs, mais cela ne s'est pas produit. Les forces navales chargées de faire respecter la quarantaine sont déjà en train de regagner leurs bases. Dans un discours à la nation, le président américain a déclaré avoir ordonné aux navires de se retirer afin de préserver la paix internationale et d'éviter la mort d'innombrables innocents. Il a accusé les Soviétiques de jouer avec le destin du monde. Les Soviétiques, en revanche, ont déclaré que les États-Unis avaient mis fin à leur piraterie illégale et que la présence soviétique à Cuba visait à défendre la petite nation insulaire qui avait déjà été confrontée à l'agression américaine. Sur la scène internationale, les Soviétiques sont considérés comme les vainqueurs de la crise des missiles de Cuba et devraient étendre leur présence dans la région, alors que le monde s'éloigne du bord du gouffre."
 cubamc.23.d:0 "Selon les informations provenant de nos cargos en route vers Cuba, des navires de guerre américains tireraient sur ces derniers. Les navires ne disposent pratiquement d’aucun armement et les Américains semblent tirer dans le but de les arrêter, et non de les détruire, afin d’inspecter leur cargaison. Cependant, nos sous-marins qui escortent les navires se rapprochent pour engager le combat avec les navires de guerre américains. Les Américains n’ont aucun égard pour la sécurité du monde, ni pour celle de nos hommes ; nous avons donc donné l’ordre aux sous-marins de défendre les cargos à tout prix. Espérons que, grâce à l'effet de surprise, nos navires l'emporteront."
 cubamc.24.d:0 "Des informations en provenance de La Havane indiquent que des explosions nucléaires se sont produites au large des côtes cubaines. Ces événements font suite à l'annonce selon laquelle des navires de guerre de la marine américaine étaient engagés dans des combats contre des navires de la marine soviétique, notamment des sous-marins. Un porte-parole du Pentagone a réagi à ces informations en déclarant que des sous-marins soviétiques, équipés de torpilles nucléaires, les avaient lancées de manière imprudente contre des navires américains chargés de faire respecter la quarantaine approuvée par l'Organisation des États américains. Il ne disposait d'aucune information concernant d'éventuelles victimes ou pertes de part et d'autre. À Moscou, les Soviétiques ont affirmé que des navires de guerre américains avaient lancé une attaque non provoquée contre des cargos non armés, forçant les sous-marins soviétiques à riposter avec force. Un chaos général s'installe dans les villes du monde entier alors que les craintes d'un conflit nucléaire à grande échelle s'intensifient."
 cubamc.25.d:0 "Lors d’une réunion avec l’état-major interarmées, les membres éminents du gouvernement et ses principaux conseillers, le président des États-Unis se retrouve confronté à une situation qu’il aurait désespérément souhaité éviter. L’utilisation d’armes nucléaires par la marine soviétique contre des navires de guerre américains ne peut rester sans réponse. Certains réclament une riposte nucléaire équivalente contre une cible navale soviétique, mais les hauts responsables militaires insistent sur le fait qu’une telle approche ne ferait que donner aux Soviétiques davantage de temps et d’occasions de frapper des cibles américaines. Le président est d'accord et a donné l'ordre aux États-Unis de lancer une riposte nucléaire totale afin de s'assurer que l'Union soviétique ne puisse plus menacer le monde. Il a également ordonné au pays de mettre en œuvre les protocoles de défense nucléaire et de se préparer à des pertes humaines considérables. L'ambiance était sombre, mais toutes les personnes présentes savaient qu'il n'y avait plus d'autre alternative."
 cubamc.26.d:0 "Les hauts commandants militaires ont informé le Politburo que les Américains ripostaient par une attaque nucléaire de grande envergure. L'heure des manœuvres politiques ou des réponses mesurées est révolue. Les commandants militaires ont fait remarquer que, malgré la destruction imminente qui attendait de vastes régions du pays, nous disposions toujours des moyens de les punir pour leur agression. Le Premier ministre soviétique a alors ordonné aux Forces de missiles stratégiques de se préparer et de lancer leur propre attaque de grande envergure. Si les Américains choisissaient de détruire la nation soviétique, ils s'exposeraient à une ruine similaire. Il n'y eut ni joie ni discussion lorsque l'ordre fut donné, seulement la sombre prise de conscience que chacun avait fait son devoir et que c'était là la seule issue possible."
 cubamc.27.d:0 "La délégation soviétique en visite a insisté pour que nous acceptions leurs projets de déploiement de missiles stratégiques sur notre île. Ils souhaitent procéder en secret et affirment que cela constituerait une mesure plus significative qu’un traité de défense public, comme nous l’avions suggéré. Si nous acceptons la demande soviétique, cela renforcera nos liens et démontrera la sincérité de notre peuple. De plus, le déploiement de tels systèmes d'armes, même en secret, nous apporterait probablement les avantages d'un traité de défense tout en nous évitant la surveillance et l'ingérence américaines qui suivraient inévitablement la signature d'un traité officiel. Cependant, si les Américains découvraient ces armes déployées en secret, ils nous présenteraient comme une marionnette de l'Union soviétique, ce qui porterait atteinte à notre crédibilité révolutionnaire. Nous devons décider soit d'accepter le déploiement secret de missiles stratégiques, soit d'informer la délégation que nous voulons un traité de défense mutuelle."
 cubamc.28.d:0 "À la suite d'une campagne de bombardements aériens intense et de grande envergure visant à neutraliser les sites de missiles soviétiques et les défenses cubaines, les États-Unis ont annoncé que leurs forces débarquaient désormais à Cuba. Les États-Unis cherchent à neutraliser le gouvernement cubain et à s'assurer que son peuple et son territoire ne soient pas utilisés comme base de lancement pour infliger des destructions incommensurables au peuple américain. Le gouvernement soviétique serait en train d'élaborer une réponse, tandis que l'on ignore encore le nombre de victimes qu'ont subies les Soviétiques ou les Cubains lors des premiers bombardements. Le dirigeant cubain Fidel Castro a déclaré avec défi que ses forces résisteraient et a appelé tous les Cubains à se joindre à la défense de l'île contre l'agression impérialiste. Les États-Unis estiment qu'ils devaient agir après la découverte de sites secrets de missiles nucléaires soviétiques en cours de construction à Cuba, à moins de cent miles du sol américain."
 cubamc.29.d:0 "Face à l'immaturité des États-Unis, qui se manifeste de manière déplorable dans le contexte cubain et qui nous accusent d'interférer dans leur sphère d'influence, nous avons décidé de leur rendre la pareille. Berlin, occupée par les Alliés, se trouve au cœur du monde socialiste et empiète donc sur notre sphère d'influence. Nous avons récemment ordonné aux commandants locaux d'occuper leur secteur de Berlin et d'en expulser les forces d'occupation. Heureusement, les commandants ennemis ont pris conscience de leur situation et se sont retirés sans violence. Nous les rapatrierons sur le territoire de l'OTAN. La prise de Berlin est bien accueillie par la population et les alliés de l'OTAN des États-Unis seraient furieux que l'aventurisme américain ait conduit à la chute de Berlin occupée par les Alliés."
