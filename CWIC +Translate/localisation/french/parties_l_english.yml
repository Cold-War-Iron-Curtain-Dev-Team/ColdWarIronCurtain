 FIN_Social_Democratic_party_desc: "Fondé en 1899 sous le nom de Parti travailliste finlandais (il a pris son nom actuel en 1903), le SDP est le plus ancien parti de Finlande. À la suite de la défaite électorale de 1917, de nombreux membres ont rejoint les Gardes rouges pendant la guerre civile finlandaise. Après la guerre, le parti s'est réformé pour adopter une ligne plus patriotique et moins radicale, ce qui a entraîné une scission entre sociaux-démocrates et communistes. Cette scission n'a fait que s'aggraver après la Seconde Guerre mondiale."
