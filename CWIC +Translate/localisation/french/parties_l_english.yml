 ISR_fascism_party: "-"
 ISR_liberal_party: "Sionistes généraux"
 ISR_liberal_party_long: "HaTzionim HaKlaliym : §GHaTzionim HaKlaliym (Sionistes généraux) est un grand parti centriste et capitaliste. Fondé par des sionistes n'appartenant à aucune des deux écoles de pensée du sionisme, il a rapidement adopté des positions libérales et capitalistes. La principale base de soutien des sionistes généraux est la classe moyenne et les autres propriétaires fonciers en dehors des kibboutzim. Les sionistes généraux sont considérés comme la solution bipartisane à la polarisation croissante de la politique israélienne.§!"
 ISR_nationalist_party: "Tnuat Herut"
 ISR_nationalist_party_long: "Mouvement Herut : §GTnuat Herut (Mouvement Herut), également appelé simplement Herut, est un parti sioniste révisionniste de droite. Fondé par l'ancien chef de l'Irgoun, Menahem Begin, il a été fortement influencé par le parti Hatzohar, aujourd'hui disparu. Herut a adopté la vision du sionisme de Jabotinsky, le sionisme révisionniste, qui aspire à la souveraineté juive sur l'ensemble de l'ancien mandat britannique pour la Palestine et au contrôle total de la Terre d'Israël. Herut est considéré par de nombreux autres partis comme une force radicale marginale, mais son soutien populaire en fait un concurrent potentiel majeur pour le pouvoir à la Knesset.§!"
 ISR_socialist_party: "Parti Poalei Eretz Yisrael"
 ISR_socialist_party_long: "Mifleget Poalei Eretz Yisrael : §GLe Mifleget Poalei Eretz Yisrael (Parti des travailleurs de la terre d'Israël), souvent abrégé en Mapai, est un parti socialiste modéré qui a dominé la scène politique sioniste avant la création de l'État. Avec ses politiques socialistes et ses positions pro-occidentales, le Mapai apparaît comme le parti des travailleurs ordinaires qui n'ont pas adhéré au communisme. Le Mapai est toutefois un parti très instable, avec de nombreuses factions se disputant le pouvoir, ce qui se traduit par des troubles internes à chaque erreur commise.§!"
 ISR_trotskyism_party: "Mifleget HaPoalim HaMeuhedet"
 ISR_trotskyism_party_long: "Mifleget HaPoalim HaMeuhedet : §GLe Mifleget HaPoalim HaMeuhedet (Parti uni des travailleurs), souvent abrégé en Mapam, est un parti socialiste de ligne dure présentant de légères tendances marxistes. Issu de la fusion des partis HaShomer Hatzair et Ahdut Ha'Avodah, le Mapam se situe résolument à gauche. Le Mapam estime que le sionisme peut jouer un rôle dans la révolution mondiale et considère que l'URSS a commis une erreur en adoptant des positions antisionistes.§!"
