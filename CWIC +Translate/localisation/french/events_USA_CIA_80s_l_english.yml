 CIA_SRL.0.d:0 "INSURRECTION AU SRI LANKA : EN BREF  \nBureau de l’analyse de l’Asie du Sud et du Moyen-Orient, Direction du renseignement\n\nSECRET/NOFORN\n\nCes dernières années, les tensions entre le gouvernement sri-lankais, dominé par le groupe ethnique cinghalais, et le groupe ethnique tamoul, situé au nord du pays, ont dégénéré en violence. Les Tamouls ont allégué une discrimination systématique à leur encontre en matière d’emploi, d’éducation et de langue, notamment en ce qui concerne la politique de standardisation des années 1970 qui limitait systématiquement l’accès des étudiants tamouls aux universités. (U/OU)\n\nL’opposition tamoule à la politique gouvernementale existe sous la forme du Front Unifié de Libération Tamoule (TULF), agissant en tant qu’opposition politique légitime depuis 1976, tandis que des groupes militants, tels que les Tigres de Libération de l’Eelam Tamoul (LTTE), ont été formés sous la direction de Velupillai Prabhakaran. Bien que ces groupes diffèrent dans leurs méthodes, ils aspirent à la création d’un État laïque et socialiste de « l’Eelam Tamoul » situé dans la région à majorité tamoule du nord du pays. (S)\n\nLes récentes émeutes et manifestations anti-tamoules, dont une en 1977 ayant fait 125 morts, ainsi que l’incendie de la bibliothèque publique de Jaffna en 1981 par une foule cinghalaise, ont continuellement exacerbé les tensions, menaçant de conduire à une guerre civile totale. En 1983, la situation est devenue particulièrement grave après qu’une patrouille de l’armée sri-lankaise, surnommée « Four Four Bravo », ait été tendue en embuscade, faisant 13 morts parmi les soldats. La période connue sous le nom de « Juillet noir » a entraîné de multiples pogroms anti-tamoules, des massacres de prisonniers et des centaines de morts. (S)\n\nIl est estimé que le LTTE et d’autres groupes militants tamouls continueront à harceler et à combattre les unités de l’armée sri-lankaise. Cependant, la situation reste floue en dehors du Sri Lanka ; l’influence de l’Inde dans le conflit est inconnue, bien que la présence d’une importante population tamoule dans le sud de l’Inde puisse représenter un obstacle pour le gouvernement sri-lankais dans la répression de cette révolte. (S)"
 CIA_SRL.1.d:0 "POSITION DE L'INDE SUR LE SRI LANKA : RECOMMANDATIONS POUR L'ACTION  \nBureau de l’analyse de l’Asie du Sud et du Moyen-Orient, Direction du renseignement\n\nSECRET/NOFORN\n\nLa position géopolitique relative de l’Inde par rapport au Sri Lanka a posé des problèmes significatifs au gouvernement sri-lankais dans sa tentative de contrer l’insurrection des Tigres de Libération de l’Eelam Tamoul (LTTE). Étant donné que le Sri Lanka et l’Inde sont séparés par seulement 35 miles à leurs points les plus proches et qu’une population tamoule importante existe dans le sud de l’Inde, il est de notre avis que le gouvernement indien tentera d’intervenir dans le conflit, probablement du côté des insurgés tamouls. (S)\n\nLes groupes tamouls, tant au Sri Lanka que dans l’État indien du Tamil Nadu, ont développé des relations solides et une coopération. En particulier, le LTTE a noué des relations avec des responsables du Mouvement Pure Tamil et du Congrès Kamaraj, ainsi qu’avec le ministre en chef du Tamil Nadu, M.G. Ramachandran, un haut responsable de l’État. (S)\n\nLes États-Unis sont confrontés à un défi pour répondre à ce conflit et à l’implication ultérieure de l’Inde. Il est clair que limiter l’influence de l’Inde dans la région est crucial pour garantir que le gouvernement sri-lankais puisse continuer ses opérations de contre-insurrection sans entrave. Voici des recommandations qui pourraient être prises pour déstabiliser l’influence de l’Inde dans la région et alléger la pression sur le Sri Lanka :\n\n1. Utiliser les ressources du Fonds Monétaire International et d’autres organisations économiques pour mettre fin à l’accès aux prêts du gouvernement indien.\n\n2. Organiser des groupes d’émigrés tamouls sur le continent indien, dans l’intention de former des organisations militantes similaires au LTTE du Sri Lanka.\n\n3. Utiliser des canaux diplomatiques pour exercer des pressions sur le Pakistan afin de cesser son aide au gouvernement sri-lankais, tout en commençant les envois d’armes vers les groupes militants tamouls en Inde.\n\nNous espérons que cette analyse et ces recommandations permettront de mettre fin à l’influence de l’Inde dans la région, de détourner l’attention de New Delhi de leur voisin insulaire et de permettre la continuation du statu quo dans la région."
 CIA_SRL.2.d:0 "Le secrétaire du Trésor entra dans le quartier général du Fonds Monétaire International, heureux de la proximité du lieu. À seulement quelques minutes en voiture des bureaux du Trésor à Washington, dans le quartier de Foggy Bottom, cela rendait les visites comme celle-ci simples et rapides, sans besoin de vol, et surtout sans presse.\n\nQuelques escaliers et un trajet en ascenseur plus tard, le secrétaire se retrouva dans le bureau du directeur général, le Français Jacques de Larosière, l’homme le plus puissant du FMI. En tant que représentant des États-Unis au sein du Conseil des gouverneurs, le secrétaire savait qu’il exerçait une grande influence sur les opérations mondiales du FMI. Ayant réfléchi au rapport de la CIA qu’il avait lu plus tôt, il savait ce qui était nécessaire.\n\n\"Bonjour, Monsieur le Secrétaire. Que puis-je faire pour vous ?\" dit de Larosière en se laissant aller dans son fauteuil et en posant une tasse de café sur une soucoupe, avec une vue sur le skyline de Washington.\n\n\"Jacques, cela fait longtemps que nous nous connaissons. Votre leadership au Trésor français, et maintenant au FMI, a été excellent. J’ai besoin d’un service de votre part.\" Le secrétaire s’ajusta avant de continuer.\n\n\"Je suis sûr que vous avez vu les nouvelles ou lu les rapports de votre gouvernement. L’Inde s’implique de plus en plus dans la guerre civile du Sri Lanka, finançant les rebelles communistes tamouls du nord. Ils sabotent délibérément le conflit et causent des millions de morts. Nous recommandons que le FMI prenne des mesures pour sanctionner l’Inde et la forcer à retirer sa pression sur le Sri Lanka.\"\n\n\"Monsieur le Secrétaire, que propose exactement votre gouvernement ? L’Inde est aussi un membre du FMI. Je ne vois pas pourquoi nous devrions nous mêler de cette affaire.\"\n\n\"Monsieur de Larosière, vous êtes le directeur général, la personne la plus puissante de cette organisation. Notre gouvernement propose de couper l’accès de l’Inde aux prêts du FMI. Cela ne nécessiterait pas de vote et pourrait être une simple décision procédurale que vous mettriez en œuvre discrètement. Pas de presse, pas de scandale, rien. Cela signifierait beaucoup pour nous, Jacques.\"\n\nDe Larosière marqua une pause. \"D'accord, Monsieur le Secrétaire. Je vais voir ce que nous pouvons faire pour couper l’accès aux prêts, mais je ne fais aucune promesse. Le FMI ne veut pas de conséquences négatives suite à cela.\""
 CIA_SRL.3.d:0 "Nous avons reçu une notification du Fonds Monétaire International nous informant que notre accès aux prêts du FMI a été révoqué, sur la base du fait que nous « ne respectons pas certains critères pour les membres sollicitant des prêts ». Bien que cela représente un défi majeur pour notre situation économique et financière internationale, le gouvernement soupçonne que cela pourrait être une manœuvre de la part du FMI, et du bloc occidental dans son ensemble, pour sanctionner nos actions au Sri Lanka.\n\nIl est difficile de savoir comment répondre, à part condamner catégoriquement cette décision et demander au FMI de revenir sur sa décision. Certains responsables de notre gouvernement ont suggéré de réduire nos actions au Sri Lanka, afin d'apaiser l'Occident, mais d'autres estiment qu'il est essentiel de maintenir notre droit à l'autodétermination sur de telles questions."
 CIA_SRL.4.d:0 "Alors que Jayamravi était assis dans le petit restaurant, il regardait autour de lui, entre la porte et sa table, jusqu'à la cuisine, puis revenait à son regard. Alors qu'il posait le journal en tamoul qu'il venait de lire, il aperçut les deux hommes qui se dirigeaient vers sa table, hochant la tête en s'asseyant. Jayamravi se lança directement dans le vif du sujet.\n\n\"Je suppose que vous êtes ici parce que vous vous intéressez à l'unité locale des Tigres ?\" Il parla d'une voix basse. Les deux hommes hochèrent la tête.\n\nRegardant autour de lui, Jayamravi se leva, ramassa son journal, laissa quelques roupies sur la table, et se dirigea vers les rues poussiéreuses et bondées de Madurai. Puis, il tourna brusquement dans une ruelle, se glissant dans une autre ruelle, et s'arrêta devant une porte où un homme se tenait. Jayamravi hocha la tête, fit signe aux deux hommes de le suivre, et les guida à l'intérieur, où un centre de commandement improvisé et une armurerie semblaient avoir été installés.\n\n\"Bienvenue dans la cellule locale des Tigres de Libération du Tamil Nadu, messieurs. Nos combattants ont effectué des vérifications à votre sujet et ont déterminé que vous êtes sûrs. Bienvenue à bord. Nous sommes ravis de vous avoir parmi nous.\" Jayamravi sourit, faisant un geste vers les tables couvertes de cartes, de journaux, et un bureau à l'arrière avec des gilets et des explosifs prêts à être attachés. Jayamravi dégaina un pistolet, vérifiant le glissement. \"J'espère que vous savez dans quoi vous vous engagez.\"\n\nCe que personne, à l'exception d'une seule personne, ne savait, c'est que \"Jayamravi\" n'était en réalité qu'une couverture élaborée. L'agent de la CIA Shekar sourit. Il lui manquait sa maison, un merveilleux quartier résidentiel en dehors de McLean, en Virginie, mais cette mission était bien plus importante. Il restait beaucoup à faire."
 CIA_SRL.5.d:0 "**RAPPORT D'INTELLIGENCE SUR LA SÉCURITÉ**  \n**CONFIDENTIEL**\n\nL'activité militante parmi les groupes nationalistes et militants tamouls a considérablement augmenté dans l'État du Tamil Nadu, y compris dans les grandes villes comme Chennai, Puducherry et Madurai. Le groupe le plus en vue est probablement les Tigres de Libération du Tamil Nadu (LTTN), un groupe militant presque identique aux Tigres de Libération de l'Eelam Tamoul (LTTE), basé au Sri Lanka.\n\nIl n'est actuellement pas connu s'il existe un lien direct entre le LTTE basé au Sri Lanka et le LTTN ; cependant, il peut être supposé qu'il y ait des connexions. Le LTTN opère principalement comme une filiale indienne des Tigres Tamouls, créée pour opérer dans des zones à majorité tamoule dans le but de détourner le soutien populaire des aides gouvernementales actuelles vers le LTTE.\n\nLa recommandation actuelle de ce rapport est de procéder à des opérations de contre-insurrection de base et à un renforcement des opérations de maintien de l'ordre pour empêcher les cellules du LTTN de commettre des incursions ou d'autres attaques terroristes sur le sol indien souverain. L'État du Tamil Nadu doit recevoir tous les financements et ressources nécessaires pour accomplir cette tâche."
 CIA_SRL.6.d:0 "**ACTIONS DIPLOMATIQUES ENVERS L'INDE**  \nBureau de l’analyse du Moyen-Orient et de l’Asie du Sud, Direction du renseignement\n\nSECRET/NOFORN\n\nSur la base de nos évaluations précédentes, ce bureau a indiqué qu’au lieu de poursuivre des opérations de déstabilisation contre l'Inde, un changement de stratégie est nécessaire, en se dirigeant vers des actions diplomatiques secrètes. Ce bureau présente les recommandations suivantes, en coopération avec l'Ambassade des États-Unis à New Delhi et le Bureau des affaires du Sud et de l'Asie centrale, Département d'État :\n\n1. Faire pression de manière secrète et menacer de suspendre l’aide, y compris l’aide militaire sous forme de ventes d'armements possibles et de transferts de technologies, ainsi que l’aide économique directe.\n\n2. Mettre la pression sur les entreprises américaines opérant en Inde, comme Union Carbide India Limited, pour exiger des demandes similaires, sur la base que l'Inde devrait cesser ses actions au Sri Lanka si elle souhaite continuer à maintenir une coopération économique et une croissance avec les entreprises américaines et autres entreprises occidentales.\n\n3. Collaborer avec le Bureau du Trésor pour le contrôle des actifs étrangers (OFAC) pour envisager de placer des sanctions et saisir les actifs de hauts responsables indiens, y compris des ministres du Cabinet, des membres du personnel de la Défense et du personnel du Ministère des Affaires Extérieures de l'Inde, sur une base similaire à celle mentionnée ci-dessus.\n\n4. Appliquer toutes les sanctions et menaces mentionnées ci-dessus, tout en assurant le soutien des alliés et d'autres nations occidentales pour exercer des pressions sur le gouvernement indien.\n\nCe bureau espère que ces recommandations fourniront un poids diplomatique suffisant pour persuader l'Inde de mettre fin à ses opérations et à son ingérence au Sri Lanka."
 CIA_SRL.7.d:0 "Le chef de la station de la CIA à Islamabad s'est adressé à notre ministère des Affaires étrangères, ainsi qu'aux services de renseignement, pour nous demander de mettre fin à l'aide au gouvernement sri-lankais dans sa lutte contre les Tigres de libération de l'Eelam tamoul (LTTE), communistes et soutenus par l'Inde.\n\nLes responsables américains semblent déterminés à mettre un terme à l'influence indienne dans la région, notamment autour du Sri Lanka. Conscients de nos sentiments envers l'Inde, ils nous ont contactés et nous ont demandé une implication plus directe, afin de détourner l'attention des Indiens de l'île située au sud.\n\nLes membres du gouvernement hésitent à mettre fin aux livraisons d'armes au gouvernement sri-lankais, et certains ont soutenu que nous pouvions faire les deux. Cependant, nous dépendons des ventes d'armes américaines et d'autres formes d'aide, et écouter leurs demandes pourrait nous être utile à long terme."
 CIA_SRL.8.d:0 "Le chef de la station de la CIA à Islamabad a informé Langley et le Département d'État que le gouvernement pakistanais, y compris les services de renseignement interarmées, avait l'intention de poursuivre son aide au gouvernement sri-lankais sous forme de ventes d'armes et de formation de personnel militaire.\n\nBien que ce ne soit pas ce que nous avons demandé aux Pakistanais, et malgré la vive colère qui en résulte à Langley, le financement continu du gouvernement sri-lankais par le Pakistan représente toujours une opportunité avantageuse de subvertir l'influence indienne par procuration. Nous ne pouvons qu'espérer que leur discours envers l'Inde se durcira à l'avenir."
 CIA_SRL.9.d:0 "Le chef de la station de la CIA à Islamabad a informé Langley qu'après des discussions confidentielles, le gouvernement pakistanais, sous l'égide du Renseignement interarmées, avait accepté de mettre fin à l'aide militaire secrète apportée au gouvernement sri-lankais dans le cadre de ses opérations anti-insurrectionnelles contre les rebelles tamouls.\n\nÀ la demande de Langley, les Pakistanais n'ont pas repris leurs cargaisons militaires physiques, mais les ont suspendues à l'avenir. Le ministère pakistanais des Affaires étrangères est prêt à faire face aux répercussions du gouvernement sri-lankais, avec notre soutien.\n\nNous espérons que cette évolution nous permettra de persuader les Pakistanais de recentrer leur attention sur leur frontière avec l'Inde et sur l'aggravation des tensions au Cachemire, afin de détourner l'attention des Indiens du Sri Lanka et de la porter sur leur ennemi juré, le Pakistan."
 CIA_SRL.10.d:0 "TAMIL NADU : POSSIBILITÉS D’OPÉRATIONS\nChef de station, New Delhi ; Bureau d’analyse du Proche-Orient et de l’Asie du Sud\n\nSECRET/NOFORN\n\nDans le cadre des efforts déployés par les États-Unis pour aider le Sri Lanka dans sa guerre civile, il est devenu nécessaire de prendre des mesures plus radicales afin d’empêcher l’Inde de s’engager davantage aux côtés des rebelles tamouls.\n\nDes agents de la CIA à New Delhi et à Colombo ont proposé d’étendre leurs opérations au Tamil Nadu, État du sud de l’Inde, l’État le plus proche du Sri Lanka et dont la population est majoritairement tamoule. Le Bureau estime que la répartition démographique constitue un facteur crucial pour commettre des attaques dans cette région, car elle éloignerait les Indiens tamouls de la guerre et dresserait l’opinion publique régionale contre les rebelles des LTTE soutenus par l’Inde.\n\nDes attaques ont été perpétrées dans les principales villes du Tamil Nadu, notamment Chennai et Madurai, en utilisant les ressources des Tigres de libération du Tamil Nadu (LTTN), contre des cibles spécifiques telles que :\n\n- Les membres du Lok Sahka, partisans de la guerre ;\n- Les représentants de l’État du Tamil Nadu ;\n- Le ministre en chef du Tamil Nadu ;\n- D’éminents dirigeants sociaux et religieux de l’État.\n\nCela attirera efficacement l’attention du gouvernement central indien, détournera l’attention des forces de l’ordre et de sécurité et créera des divisions sociales entre les membres de la majorité tamoule."
 CIA_SRL.11.d:0 "RAPPORT SUR LA SÉCURITÉ AU TAMIL NADU\n\nCabinet du Premier ministre\n\nLa situation sécuritaire dans l'État méridional du Tamil Nadu a été controversée ces dernières semaines. Plusieurs attaques des Tigres de libération du Tamil Nadu (LTTN), un groupe militant nationaliste tamoul fortement lié aux LTTE sri-lankais, ont été perpétrées dans les principales agglomérations de Chennai et Madurai.\n\nSi aucun responsable important de l'État ou du gouvernement central n'a été tué ou blessé, les principales cibles ont été les élus municipaux, la police locale et les membres de la police du Tamil Nadu. Cependant, des sources de renseignement indiquent que des attaques contre Lok Sakha et des représentants de l'État pourraient se produire si le gouvernement ne prend pas de mesures pour mettre un terme à leurs agissements.\n\nLes attaques des LTTN, à l'instar de leurs camarades au Sri Lanka, se sont concentrées sur des attentats-suicides à la bombe, ainsi que sur quelques fusillades limitées. Nombre d'entre elles semblent avoir été planifiées, ce qui indique que les cellules des LTTN ont une certaine connaissance des opérations gouvernementales et des forces de l'ordre avant qu'elles ne se produisent.\n\nCertains responsables gouvernementaux ont exprimé leur inquiétude face à cette situation, notamment en raison de notre implication au Sri Lanka. Des rumeurs ont circulé concernant un retrait de l'aide indienne aux LTTE, au motif que leur organisation affiliée mène des attaques sur le continent."
 CIA_SRL.12.d:0 "AIDE AU SRI LANKA : RÉSUMÉ\nBureau d’analyse du Proche-Orient et de l’Asie du Sud, Direction du renseignement\n\nSECRET/NOFORN\n\nLa décision des États-Unis de soutenir le gouvernement sri-lankais dans le conflit civil qui l’oppose actuellement au groupe militant tamoul des Tigres de libération de l’Eelam tamoul (LTTE, ou « Tigres tamouls ») a entraîné des coûts et des avantages considérables pour les deux parties. Ce Bureau recommande les mesures suivantes, en complément des actions diplomatiques habituelles, afin de renforcer les capacités et l’efficacité militaires du Sri Lanka et de mettre fin à l’implication de l’Inde dans le conflit aux côtés des LTTE.\n\n1. La mise en œuvre immédiate du partage de renseignements avec l’armée sri-lankaise, notamment l’armée de terre, la marine et l’armée de l’air, ainsi qu’avec la police sri-lankaise et les autres forces de sécurité. Cela permettra un ciblage plus précis et, espérons-le, la prévention de nouvelles attaques et incursions terroristes des LTTE et d’autres groupes militants tamouls.\n\n2. Coordination du soutien secret (létal et non létal) avec le Pakistan, qui a également activement aidé le gouvernement sri-lankais.\n\n3. Envisager une aide létale supplémentaire au gouvernement sri-lankais, notamment la formation du régiment des forces spéciales sri-lankaises, et une aide létale aux groupes paramilitaires soutenus par le gouvernement, notamment la Garde nationale musulmane.\n\nNous espérons que cette aide permettra de renforcer les forces militaires et de sécurité sri-lankaises en difficulté et d'accroître leurs capacités de contre-insurrection, tout en continuant à repousser les attaques et les offensives des LTTE."
 CIA_SRL.13.d:0 "Assis au quartier général, près de Colombo, le major de l'armée sri-lankaise transpirait, à la fois à cause de la chaleur et de la nervosité. Chargé de commander la sécurité de ce quartier général divisionnaire, il regarda autour de lui, dans la nuit moite. C'était calme, trop calme. En sortant de la tente, il aperçut les barbelés, le portail d'entrée, les miradors flanqués de jeunes soldats armés de mitrailleuses. Ils avaient été terrorisés par les attentats-suicides des Tigres, une expérience que le major n'avait jamais vue auparavant. La sécurité était renforcée, mais jamais assez, pensa-t-il.\n\nEn rentrant dans la tente, il parcourut les derniers rapports des officiers du renseignement militaire de l'armée locale. Ils étaient remarquablement brefs et inutiles, ne fournissant que peu, voire aucun détail sur les activités des Tigres, si ce n'est qu'ils existent et continuent de commettre des attaques. Il soupira, se demandant à quoi servait le service du renseignement militaire. Ils devaient bien être intelligents, non ? Apparemment non.\n\nUn de ses lieutenants, arrivé à moto à toute vitesse, se précipita à l'intérieur, portant une liasse de papiers dans un dossier. Saluant d'un air désordonné, il poussa les papiers d'un air épuisé vers le major, qui ouvrit le dossier et commença à le parcourir, essayant de déchiffrer l'affreuse traduction en cinghalais.\n\n« Monsieur, l'agent américain intégré au Corps du renseignement militaire a un rapport sur les mouvements des Tigres ici. Il prévient d'une attaque ce soir, utilisant un camion.» Le major regarda autour de lui, puis baissa les yeux et lut le rapport.\n\n« D'accord. Augmentez le niveau d'alerte. Doublez les gardes. Levez les barrières. Dites aux troupes de se préparer à une incursion… » Il fut interrompu par une soudaine déflagration d'armes automatiques, apparemment venues du périmètre extérieur, suivie de cris tandis que les troupes avançaient vers le lieu de l'accrochage. Le major regarda un camion, s'arrêta, les soldats tirèrent dessus, puis avança, les coups de feu cessèrent, le conducteur mort. Il regarda son lieutenant, puis baissa les yeux vers la liasse de papiers. « Putain ! »"
 CIA_SRL.14.d:0 "« Monsieur le Président, nous avons un nouvel allié potentiel dans la lutte pour le Sri Lanka : le Pakistan. » Le directeur de la CIA [GetCurrentCIADir] se tenait dans l'ovale, entouré du secrétaire d'État [GetCurrentSecState] , du secrétaire à la Défense [GetCurrentSecDef] , et le conseiller à la sécurité nationale [GetCurrentNatSecAdv] .\n\nLe président [USA.GetLeader] assis au bureau Resolute, il écoutait. « Allez-y, directeur. »\n\n« Eh bien, Monsieur le Président, les Pakistanais financent secrètement le gouvernement sri-lankais depuis le début de la guerre civile en juillet 1983. Comme l'indiquent nos rapports, les Indiens financent les Tigres de libération de l'Eelam tamoul, les rebelles tamouls que combat le gouvernement de Colombo. Les Pakistanais sont depuis longtemps des ennemis de l'Inde et profitent de ce conflit pour exercer leur influence dans la région et contrecarrer les objectifs indiens.»\n\nLe secrétaire à la Défense intervient : « Plus précisément, les Pakistanais fournissent aux Sri-Lankais des armes légères, des explosifs et des véhicules de patrouille légers. Leur service de renseignement interarmées (IRS) fournit des renseignements limités, mais nous pensons que combiner nos transferts d'armes et le partage de renseignements serait très bénéfique pour les Sri-Lankais dans leur combat.»\n\nLe président jette un regard circulaire. « Je n'y vois aucun problème. Quelles sont les chances que les Indiens soient mis au courant ?»\n\nLe secrétaire d'État répond. Notre ambassade à New Delhi, ainsi que le chef de la CIA sur place, ont mené une enquête discrète. Les Indiens n'en ont aucune idée et sont préoccupés par les tensions au Cachemire et le financement des Tigres au Sri Lanka.\n\nLe Président acquiesça. « Excellent. Faites en sorte que cela se produise, messieurs. Contactez les Pakistanais. » Les hommes acquiescèrent, se serrèrent la main, écrivirent quelques mots et quittèrent la pièce pour téléphoner."
 CIA_SRL.15.d:0 "Le chef de la station de la CIA à Islamabad a informé nos agents de l'Inter-Services Intelligence que les États-Unis se préparaient à coordonner un soutien secret au Sri Lanka, sous forme de livraisons d'armes secrètes, de partage de renseignements, de photos de reconnaissance et d'actions diplomatiques.\n\nLes États-Unis, conscients de notre soutien au gouvernement sri-lankais dans sa lutte contre les rebelles tamouls soutenus par l'Inde, ont décidé de consolider cette aide secrète afin de maintenir un front uni et de renforcer la coopération américano-pakistanaise. Des responsables de la CIA et de l'armée américaine devraient rencontrer des officiers de l'ISI et de l'armée de l'air dans les prochains jours afin de définir les modalités d'un réseau conjoint de livraison d'armes américano-pakistanaise, par parachutages et par transferts maritimes.\n\nCette initiative devrait être couronnée de succès, en espérant que les Indiens ne découvrent pas notre partenariat avec les Américains."
 CIA_SRL.16.d:0 "SOUS-DRAPEAUX AU SRI LANKA : EN BREF\nBureau d’analyse du Proche-Orient et de l’Asie du Sud, Direction du renseignement\n\nSECRET/NOFORN\n\nMalgré la guerre civile sri-lankaise en cours, le personnel intégré de la CIA et l’armée sri-lankaise signalent une baisse significative de l’efficacité au combat des forces gouvernementales ces dernières semaines, due à une baisse de moral et à un manque d’initiative des commandants de combat, ainsi qu’à la poursuite des attaques des LTTE contre les installations gouvernementales et les bâtiments publics. Cette baisse de moral entraîne un manque d’initiative persistant et, par conséquent, une baisse de moral accrue.\n\nCe Bureau propose les recommandations suivantes pour remédier à ce problème, notamment sans impliquer de conseil supplémentaire aux forces armées sri-lankaises, compte tenu du manque d’efficacité de cette stratégie :\n\n1. Commencer à apporter un soutien secret aux cellules isolées des Tigres et aux autres groupes rebelles sri-lankais, avec pour mission spécifique de commettre des attaques contre les forces gouvernementales sri-lankaises, selon des paramètres précis déterminés par les agents de la CIA sur le terrain.\n\n2. Financer ou soutenir de toute autre manière d'éventuelles attaques contre d'importants bâtiments gouvernementaux à Colombo, ainsi que contre les résidences du Président et du Premier ministre sri-lankais, des membres du Parlement sri-lankais et d'importantes personnalités religieuses ou sociales.\n\n3. Encourager par ailleurs des attaques sous fausse bannière afin de fournir au gouvernement sri-lankais une justification suffisante pour intensifier ses opérations contre les forces des LTTE au nord de l'île.\n\nBien qu'aucune opération spécifique n'ait été proposée par ce Bureau, la décision étant laissée aux agents sur le terrain, ces opérations devraient fournir une structure de base pour l'élaboration de plans spécifiques."
 CIA_SRL.17.d:0 "Alors que le camion de deux tonnes grondait et cahotait sur la route, les deux conducteurs regardaient autour d'eux avec anxiété, scrutant la route, les flancs, l'arrière, à la recherche de silhouettes émergeant des broussailles de la jungle.\n\nLe camion portait une croix rouge, indiquant qu'il s'agissait de travailleurs humanitaires, tout comme leurs papiers, mais les conducteurs savaient qu'il n'en était rien. Ce trajet vers Mullaitivu, une ville de la province du Nord du Sri Lanka, était vraisemblablement relativement sûr, mais les « travailleurs humanitaires » portaient toujours des pistolets dissimulés, au cas où. On n'est jamais trop prudent.\n\nLe camion cahotait et s'arrêta à ce qui semblait être un poste de contrôle des Tigres. Mullaitivu était un bastion du gouvernement, mais la route qu'ils empruntaient était toujours contestée, ce qui semblait évident lorsqu'ils sortirent du camion, les mains en l'air, fouillés par les gardes, qui les palpèrent tandis que d'autres se tenaient là, armés de fusils Type 56. Apparemment satisfaits de leurs papiers, ils ouvrirent le poste de contrôle improvisé et le camion poursuivit sa route vers Mullaitivu, quelques roupies en moins.\n\nArrivés en ville, les agents saluèrent les soldats sri-lankais, qui les regardèrent avec méfiance. Arrivés à la mosquée locale, le camion s'arrêta. Les deux hommes en descendirent et s'étirèrent un instant avant d'ouvrir l'arrière. Il s'agissait certainement de « fournitures d'aide », si l'on considère que l'aide se composait de plusieurs centaines de fusils et de milliers de munitions. Les hommes acquiescèrent tandis que les membres de la communauté s'approchaient, et l'un d'eux s'adressa au chef, apparemment de la « Garde nationale musulmane », qui commença à distribuer les armes. L'autre homme remonta dans le camion et alluma la radio.\n\n« Aigle numéro un au QG. Les oisillons ont été nourris. Distribution des « graines pour oiseaux » en cours. »"
 CIA_SRL.18.d:0 "Une dépêche des commandants de l'armée locale à Mullaitivu, bastion gouvernemental situé en première ligne dans la province du Nord, indique que des agents américains, se faisant passer pour des travailleurs humanitaires de la Croix-Rouge, arment la Garde nationale musulmane, un groupe paramilitaire progouvernemental, en lui fournissant des fusils et des munitions.\n\nNotre programme visant à former davantage de groupes paramilitaires et de défense nationale dans les municipalités locales a rencontré une certaine opposition, notamment en raison de la difficulté de recruter des civils volontaires pour défendre leurs villes, le taux d'attrition des civils dans ce conflit étant particulièrement élevé.\n\nCependant, cette initiative de la CIA indique que les États-Unis ont l'intention de continuer à approvisionner les forces gouvernementales et les paramilitaires affiliés, ce qui, espérons-le, améliorera leurs performances et leur capacité à chasser les rebelles tamouls traîtres du nord."
 CIA_LATAM.0.d:0 "AFFAIRES LATINO-AMÉRICAINES EN BREF\nBureau d'analyse de l'Amérique latine, Direction du renseignement\n\nSECRET/NOFORN\n\nLa région géopolitique connue sous le nom d'Amérique latine, communément considérée comme s'étendant de la frontière des États-Unis avec le Mexique, en passant par l'Amérique centrale et l'Amérique du Sud, jusqu'à la pointe sud de la Patagonie, a connu d'intenses crises et conflits internes et externes depuis la fin de la Seconde Guerre mondiale, et particulièrement à la fin des années 1970 et 1980. (U/OU)\n\nContrairement à d'autres opérations de renseignement et d'analyse dans le monde, la région latino-américaine représente un défi unique pour les décideurs politiques américains en raison de sa situation géographique et de la forte influence américaine actuelle. Plusieurs questions dominent notamment, notamment les conflits internes en Colombie, en Argentine, au Pérou, au Nicaragua, entre autres. Ce Bureau a formulé des recommandations pour des stratégies globales dans la région. (S)\n\n1. Maintenir la politique actuelle des États-Unis, qui privilégie une position strictement anticommuniste dans la région. Cela pourrait impliquer la poursuite des contacts et des opérations de soutien aux cartels de la drogue anticommunistes et aux réseaux de trafic de cocaïne dans la région, notamment le MAS, ainsi qu'au gouvernement panaméen dirigé par le général Manuel Noreiga.\n\n2. Intensifier l'initiative politique annoncée, connue sous le nom de « Guerre contre la drogue », principalement en s'impliquant dans le conflit interne en Colombie, et en intensifiant les opérations de la CIA à la frontière sud et au Mexique. Cela impliquera davantage d'opérations irrégulières, ainsi que des opérations de soutien aux forces gouvernementales anticommunistes et anti-cartels dans ces régions.\n\n3. Adopter une approche moins radicale et moins violente, consistant à promouvoir des initiatives d'autodétermination en Amérique latine. Cela impliquerait de museler subtilement la dissidence communiste, de mettre fin à tout soutien aux mouvements de drogue et de lancer des opérations contre l'influence des entreprises dans la région.\n\nCe Bureau soutient fermement les trois stratégies décrites ci-dessus et est impatient de commencer son travail crucial pour protéger les intérêts américains dans la région cruciale située au sud."
 CIA_LATAMa.0.d:0 "C'était un matin pluvieux dans le bureau ovale alors que le président [USA.GetLeader] assis dans l'Ovale, entouré du directeur de la CIA [GetCurrentCIADir] , du conseiller à la sécurité nationale [GetCurrentNatSecAdv] , du directeur du FBI et plusieurs assistants et fonctionnaires de chaque bureau et agence, qui étaient occupés à installer une affiche sur un support face au bureau et aux canapés.\n\n\"Monsieur le Président, notre décision d'intensifier la campagne actuelle de lutte contre la drogue en Amérique latine comporte des défis et des avantages. Cependant, notre analyse a mis en évidence deux grandes zones d'intervention : la Colombie et le Mexique.\"\n\n\"La Colombie est actuellement en proie à un conflit interne qui a débuté au milieu des années 1960. Les deux principaux acteurs, le gouvernement colombien et les Forces armées révolutionnaires de Colombie (FARC), ont dévasté une grande partie du pays et ont provoqué l'émergence de cartels régionaux de la drogue, tels que le cartel de Cali et celui de Medellin, dans les zones rurales, qui ont lancé leur production à grande échelle de cocaïne, qu'ils acheminent vers le nord des États-Unis. Les opérations dans cette zone, qui pourraient consister en des interventions secrètes ou ouvertes, pourraient enrayer la crise de la cocaïne à la source.\"\n\nLe Président hocha la tête. « Je vois. Parlez-moi maintenant du Mexique. » \n\nLa situation au Mexique est assez similaire, et la proximité géographique permet une plus grande flexibilité opérationnelle. Le Mexique est devenu une plaque tournante privilégiée pour le trafic de cocaïne depuis ses sites de fabrication en Colombie, et notamment depuis celui du cartel de Guadalajara, qui est passé du trafic via la Floride au trafic transfrontalier via le Texas, l'Arizona, le Nouveau-Mexique et la Californie.\n\nLe directeur du FBI prit la parole. « Je peux parler au nom du FBI et de la Drug Enforcement Administration (DEA) : nous sommes impatients de participer à des opérations de lutte contre le trafic de drogue à la frontière et d'aider la CIA dans toute opération qu'elle envisage pour faire face à ce terrible problème. »\n\nLe président prit la parole. « Excellent, messieurs. J'ai hâte de voir où cela nous mène. Vous devez tous me tenir informé, et si je dois approuver des opérations, j'attends des rapports quotidiens.» Les hommes hochèrent la tête, tandis que l'affiche disparaissait avec eux, laissant le président feuilleter le briefing laissé sur son bureau."
 CIA_LATAMa.1.d:0 "LE CONFLIT COLOMBIEN : EN BREF\nBureau d'analyse latino-américain, Direction du renseignement\n\nSECRET/NOFORN\n\nLe conflit colombien, qui dure depuis 1964, trouve ses racines dans une période de répression connue sous le nom de « La Violencia », de 1948 à 1964, marquée par des affrontements constants entre groupes de gauche et de droite. Aujourd'hui, dans les années 1980, le conflit a atteint une ampleur inédite, avec la multiplication des belligérants et l'implication de cartels de la drogue et d'autres groupes paramilitaires. (S)\n\nLes principaux acteurs du conflit sont le gouvernement anticommuniste colombien, notamment la police et l'armée, soutenu par la plupart des pays anticommunistes amis d'Amérique latine, ainsi que par les États-Unis. Les principaux groupes insurgés comprennent les Forces armées révolutionnaires communistes de Colombie (FARC), l'Armée de libération nationale (ELN) et le Mouvement du 19 avril (M-19), principalement des groupes de gauche soutenus et aidés par l'Union soviétique, Cuba, le Venezuela et d'autres pays socialistes. (S)\n\nLe conflit est d'autant plus compliqué par l'importante capacité colombienne de production et de distribution de cocaïne qui, en pleine guerre civile, a été récupérée par des cartels de la drogue puissants et bien armés, les plus connus étant le cartel de Medellin, le cartel de Cali et le MAS. Ces groupes sont généralement anticommunistes, mais restent idéologiquement neutres, privilégiant le profit et empêchant le gouvernement de faire respecter la loi. (S)\n\nC'est dans ce contexte que les États-Unis sont mis au défi de réagir. Le Bureau recommande par la présente des propositions d'opérations à la fois secrètes et ouvertes, reconnaissant que les premières peuvent garantir un déni plausible, tandis que les secondes peuvent accroître l'efficacité globale des opérations antidrogue."
 CIA_LATAMa.2.d:0 "OPÉRATIONS EN COLOMBIE : PROPOSITIONS ET RECOMMANDATIONS\nBureau Colombie, Bureau des opérations latino-américaines, Direction des opérations\n\nSECRET/NOFORN\n\nS'il est clair que les États-Unis devraient s'allier au gouvernement colombien dans le conflit en cours, l'intensification des opérations contre les groupes de guérilla communistes et les cartels de la drogue, comme le cartel de Medellin, garantirait le maintien de l'influence américaine en Colombie et anéantirait toute capacité de production et de trafic de cocaïne vers les États-Unis.\n\n1. Les opérations offensives devraient être menées en priorité contre les Forces armées révolutionnaires de Colombie (FARC). Formées en 1964 à la suite d'attaques gouvernementales contre les milices communistes, les FARC sont le plus grand groupe paramilitaire communiste de Colombie et se sont déployées dans des zones principalement rurales, réparties sur tout le territoire. Ce Bureau recommande l'intégration au sein des cellules locales des FARC et la perpétration d'attaques contre des unités des FARC, sous forme d'attentats à la bombe et d'assassinats ciblés de responsables, afin d'attiser la dissidence interne et d'empêcher l'organisation d'atteindre son objectif d'unification pour représenter une menace conventionnelle pour les forces régulières colombiennes.\n\n2. Des opérations de soutien supplémentaires devraient être dirigées vers l'Alianza Americana Anticomunista (Alliance anticommuniste américaine, ou AAA), un groupe paramilitaire anticommuniste d'extrême droite associé aux services de renseignement militaire colombiens. Opérant en soutien aux forces régulières de l'Armée nationale colombienne, l'AAA a été impliquée dans un attentat à la bombe contre le siège du Parti communiste colombien et son journal en 1978. L'aide de la CIA comprendrait des livraisons d'armes légères, des conseillers et un éventuel partage de renseignements.\n\n3. Enfin, la destruction des champs de coca devrait également être mise en œuvre. Cette stratégie comprend l'incendie des champs, la coupe des plants ou la pulvérisation de produits chimiques sur les parcelles depuis un avion. Les forces de la CIA, renforcées par des unités de l'armée de l'air colombienne, devraient être en mesure de mener à bien ces opérations, qui visent à éliminer les activités des cartels de la drogue en Colombie et à empêcher le financement des FARC et d'autres milices communistes.\n\nLes propositions spécifiques pour chaque opération devraient être déléguées au Bureau Colombie, au Bureau Amérique latine et à la Direction des opérations, et approuvées par la Direction des analyses et le Directeur avant d'être transmises à la Division des activités spéciales."
 CIA_LATAMa.3.d:0 "« Monsieur le Président, le directeur de la CIA a des nouvelles de la Colombie. »\n« Envoyez-le et merci. »\n\nLe président [USA.GetLeader] sourit, serrant la main du [GetCurrentCIADir] alors qu'ils s'asseyaient au bureau de Resolute, le directeur sortit un dossier de sa mallette et le posa sur la table.\n\n« Monsieur le Président, avec votre accord, la CIA souhaite lancer des opérations prolongées contre les FARC en Colombie. »\n\n« Très bien. Pouvez-vous me dire qui sont les FARC ? »\n\n« Monsieur le Président, les FARC sont les Forces armées révolutionnaires de Colombie. Il s'agit d'un groupe de guérilla communiste qui combat actuellement le gouvernement colombien, que nous soutenons. Nous avons l'intention d'étendre nos opérations offensives contre elles en fournissant davantage de financement et de soutien au gouvernement colombien, ainsi qu'en intensifiant nos actions secrètes, telles que l'intégration d'agents dans des cellules des FARC et l'assassinat ciblé de dirigeants et de personnalités importantes des FARC afin de semer la dissidence au sein du mouvement. »\n\n« Très bien. Quelles sont les prévisions de la CIA quant au succès de ces opérations ? »\n\n« Très bien, Monsieur le Président. Nous espérons qu'avec les assassinats, notamment, les FARC se diviseront en leur sein et se diviseront en factions belligérantes que le gouvernement colombien sera mieux armé pour gérer. Par ailleurs, la CIA prévoit de coopérer avec le gouvernement sur une campagne nationale anti-FARC afin de dénoncer les dommages et les destructions qu'elles ont causés au peuple colombien.»\n\n« Bien, Directeur. C'est approuvé. Veuillez me tenir informé de la suite des événements.» Le Président signa un papier tandis que le Directeur souriait, rangeant son dossier dans sa serviette et s'apprêtant à partir. « Merci, Monsieur le Président. »"
 CIA_LATAMa.4.d:0 "Alors que Jimmy inclinait légèrement l'Air Tractor AT-301, il bâilla, se frottant les yeux et vérifiant la boussole et la carte posées sur ses genoux pour confirmer son cap. Il venait de survoler la petite ville de Pasto, dans le sud-ouest du département de Nariño, en Colombie, et tandis que son turbopropulseur survolait les montagnes à 3 000 mètres d'altitude, il se sentait seul.\n\nIl était environ deux heures du matin, heure de Bogota, et tout en poursuivant son vol, Jimmy revérifia l'indicateur de niveau de son réservoir, s'assurant qu'il était rempli d'herbicide au glyphosate, et réduisit son altitude pour s'approcher de ses cibles : trois champs de coca, espacés d'environ un kilomètre ou deux, dans la vallée de Patia.\n\nClignant des yeux pour distinguer le premier, Jimmy sourit en voyant une lumière clignotante, désignant son équipe de contrôleurs aériens avancés, nom de code « AGUILA », chargée de distraire les hommes du cartel et de signaler l'avion pulvérisateur. Jimmy entendit des tirs d'armes automatiques alors qu'il commençait son passage, incertain s'il s'agissait d'AGUILA ou des hommes de Medellin. Il sourit et ne salua personne en descendant à 60 mètres, appuyant sur le bouton « larguer » pour déverser environ 380 litres d'herbicide en une fine brume sur les plants de coca, avant de remonter à une altitude sûre, pour recommencer deux fois.\n\nEn terminant son dernier passage, remontant à 3 000 mètres, Jimmy se souvint de ses premiers jours comme avionneur dans le Midwest, effectuant des missions de pulvérisation de routine, lorsqu'il fut arrêté par un recruteur de la CIA. « Ça te dirait de travailler pour nous dans le Sud, fiston ? »"
 CIA_LATAMa.5.d:0 "Alors que le président [USA.GetLeader] retournait dans l'Oval après une courte pause entre deux réunions, il fut néanmoins surpris de voir d'autres cartes installées sur des trépieds près de son bureau, et des assistants s'agiter, distribuant des dossiers et des paquets.\n\n« Monsieur le Président, nous pensons que la situation dans le conflit colombien s'est détériorée à un point tel qu'une intervention américaine est nécessaire pour soutenir nos objectifs et ceux du gouvernement colombien. » Le conseiller à la sécurité nationale [GetCurrentNatSecAdv] prit la parole en premier, brisant le silence dans la salle.\n\nLe directeur de la CIA [GetCurrentCIADir]a ensuite pris la parole. « Monsieur, nos agents intégrés ont vivement recommandé des opérations plus offensives. Le gouvernement colombien peine à contenir les FARC et les autres milices communistes, ainsi que les nombreux cartels de la drogue qui se disputent l'influence et la distribution de cocaïne. Nos opérations peuvent être utiles, mais leur portée est limitée. »\n\nLe secrétaire à la Défense [GetCurrentSecDef] a acquiescé. « Nous avons commencé à mettre en œuvre et à adapter les opérations d'urgence pour la Colombie. Le Département d'État pourra vous en dire plus, mais le Pentagone a chargé le Commandement Sud des États-Unis de prendre le contrôle principal des opérations militaires. Les recommandations préliminaires incluent le recours à des frappes aériennes et au partage de renseignements contre les forces des FARC, afin de permettre aux forces colombiennes d'affronter les cartels. »\n\nLe Président a finalement trouvé l'occasion de s'exprimer. « Donnez-moi l'angle diplomatique avant que j'autorise toute action militaire. La situation est déjà suffisamment compliquée.»\n\nLe Secrétaire d'État [GetCurrentSecState] l'a interrompu. « Nos relations diplomatiques avec les Colombiens sont cordiales et efficaces. Notre ambassadeur à Bogota rapporte que l'aide militaire et politique américaine à la Colombie a été fructueuse jusqu'à présent, mais que l'armée est confrontée à un important problème de corruption. Il recommande de remédier à ce problème en suspendant une partie de l'aide en échange de réformes.»\n\nLe Président a hoché la tête. « Très bien. Merci à tous. Tenez-moi au courant, et je souhaite recevoir régulièrement des rapports et des plans actualisés du Pentagone et des chefs d'état-major interarmées. Rien de militaire ne se fait sans mon accord. »"
 CIA_LATAMa.6.d:0 "Suite à une demande plutôt menaçante de l'ambassadeur américain, nos généraux ont mis en place une initiative anti-corruption au sein des forces armées colombiennes. Vraisemblablement sous la pression des Américains, qui ont fourni des millions de dollars d'aide et de conseils, les hauts commandants militaires ont créé une « Unité anti-corruption » chargée d'enquêter sur les cas de corruption, petits et grands, notamment parmi les officiers et les sous-officiers.\n\nOn espère que cette initiative aboutira, car les commandants exercent des pressions pour la maintenir et lui accorder une certaine autonomie. Elle sera en effet rattachée à l'état-major colombien et au président, et publiera des rapports limités à l'ambassade américaine à Bogota."
 CIA_LATAMa.7.d:0 "« Allô ?»\n« Monsieur le Secrétaire, ici l'ambassade de Bogota. L'ambassadeur aimerait vous parler.» Le téléphone a cliqué et la ligne a basculé vers l'ambassadeur des États-Unis en Colombie. « Monsieur le Secrétaire, j'espère que vous allez bien ce matin.»\n« Oui, ambassadeur. De quoi s'agit-il ?»\n« Les Colombiens ont demandé que nous nous impliquions davantage dans le conflit, en plus de notre politique actuelle d'assistance militaire ouverte sous forme de moyens et de conseillers. J'hésite à appeler le Pentagone, car notre attaché de défense souhaite vivement qu'il déploie des troupes et je ne souhaite pas d'escalade.»\n« Très bien, ambassadeur, merci. Que suggérons-nous au Département d'État de faire en attendant, afin de contenir le Pentagone et l'USSOUTHCOM ? »\n\n« Monsieur le Secrétaire, je pense que nous devrions désigner les FARC comme organisation terroriste étrangère ; vous êtes habilité à désigner des groupes en vertu de la loi sur l’immigration et la nationalité de 1965. Nous faisons ensuite plusieurs déclarations : j’en fais une, vous en faites une, le Pentagone en fait une. On dirait que nous sommes unis, nous n’avons pas forcément besoin de l’autorisation du Président des États-Unis, mais on peut l’interpréter. Ce serait une déclaration de guerre « symbolique » aux FARC sans passer par le Bureau ovale ou le Congrès. »\n\n« Et les Colombiens ?» Le Secrétaire fronça les sourcils au téléphone.\n« Ils ne verront pas la différence. Ils n’entendront que « déclarer la guerre » et le prendront au pied de la lettre, et le Pentagone pourra alors commencer à déployer de petits effectifs de troupes en Colombie depuis le Panama ou la Floride.»\n« D’accord. Merci, Monsieur l’Ambassadeur, j’apprécie votre franchise. Je vais consulter le personnel et nous avancerons dès que possible. Merci encore. Au revoir.»\n\nIl raccrocha, soupirant, mais repensant à ce qu’il venait d’entendre. Une idée de génie."
 CIA_LATAMa.8.d:0 "Sans surprise, des déclarations simultanées de Foggy Bottom et du Pentagone ont été publiées aujourd'hui, le secrétaire d'État américain ayant officiellement classé les Fuerzas Armadas Revolucionarias de Colombia, connues sous le nom de Forces armées révolutionnaires de Colombie (FARC), parmi les organisations terroristes étrangères au sens de l'article 219 de la loi sur l'immigration et la nationalité de 1965. Parallèlement, le Pentagone a annoncé une aide défensive supplémentaire au gouvernement colombien dans sa lutte contre les FARC, ainsi que l'envoi de nouveaux agents, conseillers et unités du Commandement Sud des États-Unis en mission en Colombie. Face aux éloges habituels de l'Occident et aux critiques de l'Est, la Colombie a accueilli cette annonce comme une implication tacite des États-Unis dans le conflit."
 CIA_LATAMa.9.d:0 "OPÉRATIONS AÉRIENNES ANTI-CARTEL : OPLAN\nQuartier général, Commandement Sud des États-Unis\n\nVous trouverez ci-joint les ordres destinés aux unités subordonnées du Commandement Sud des États-Unis concernant les opérations en Colombie. Ces ordres visent à cibler les positions des cartels dans le pays afin de réduire les capacités, de soutenir les unités de l'armée de l'air colombienne et de protéger les intérêts américains dans la région.\n\n1. Les unités et détachements de la 24e escadre composite, basés sur la base aérienne Howard au Panama, sont autorisés à engager toutes les installations et tous les quartiers généraux des cartels de Medellin et de Cali dans le sud-ouest de la Colombie. Le commandant de la 24e escadre composite est autorisé à utiliser tous les aéronefs disponibles, y compris, mais sans s'y limiter, les A-7 Corsair, les C-130 Hercules, les O-2 Skymaster et les hélicoptères UH-1 Huey.\n\n2. Unités de la deuxième escadre aérienne porteuse de l'US Navy (CVW-2), basées sur l'USS Ranger (CV-61) ; Les unités de soutien de la Force opérationnelle interarmées Bravo, stationnées sur la base aérienne de Soto Cano, au Honduras, ainsi que toutes les autres unités de soutien de la Division aérienne Sud et de la Deuxième Escadre aérienne de l'USAF, sont autorisées à assurer la maintenance des aérodromes et des aéronefs, le maniement des armes, la vérification des cibles et d'autres services de soutien.\n\n3. Les unités de soutien de la Force opérationnelle interarmées Bravo, stationnées à la base aérienne de Soto Cano, au Honduras, ainsi que toutes les autres unités de soutien de la division aérienne sud de l'USAF et de la deuxième escadre aérienne porteuse, sont autorisées à fournir des services de maintenance des aérodromes et des aéronefs, de manutention des armes, de vérification des cibles et d'autres services de soutien.\n\nTous les commandants de l'US Navy et de l'USAF sélectionneront et vérifieront indépendamment les listes de cibles sur la base des rapports de renseignement de la CIA et de la DIA et du personnel intégré. Toutes les listes de cibles doivent être diffusées par l'intermédiaire du Commandement Sud des États-Unis et de la Maison-Blanche avant le début des opérations.\n\nSIGNATURE\nCommandant du Commandement Sud des États-Unis"
 CIA_LATAMa.10.d:0 "Aujourd'hui, un porte-parole du Département de la Défense au Pentagone a annoncé l'extension officielle des opérations aériennes américaines en Colombie contre les principaux cartels de la drogue de la région. Désignant le Commandement Sud des États-Unis, basé à Doral, en Floride, comme principal commandement de ces opérations, le Pentagone a déclaré que ces frappes visaient à « protéger les intérêts et les partenaires américains en Amérique latine, garantir la fin du trafic de cocaïne dans la région et soutenir les forces armées colombiennes dans leur mission de contre-insurrection en cours ».\n\nSelon d'autres points de presse des porte-parole du Commandement Sud des États-Unis, les unités impliquées comprennent la 24e escadre composite de l'armée de l'air américaine, basée à Panama, ainsi que des escadrons du groupe aéronaval USS Ranger, qui prévoit d'opérer au large des côtes colombiennes. Les réactions ont été mitigées, mais le message principal était d'aider le gouvernement colombien et de promouvoir des opérations de lutte antidrogue au service de toutes les parties, quelle que soit leur idéologie."
 CIA_LATAMa.11.d:0 "RAPPORT DES RENSEIGNEMENTS DES FARC FNSJBFB-NN\n[GetDateText]\n\nLes derniers renseignements de nos cellules, réparties dans tout le pays, font état des informations suivantes, concernant notamment l'intensification des opérations aériennes américaines contre nos cibles et celles du Cartel.\n\nLes cellules ont signalé avoir repéré plusieurs types d'avions américains, notamment des A-6 Intruder, des A-7 Corsair, des avions cargo C-130, ainsi que de nombreux hélicoptères de combat et utilitaires UH-1 Huey. La présence d'avions de combat A-6, capables de décoller sur porte-avions, suggère que les Américains mènent des opérations depuis un groupe aéronaval au large des côtes colombiennes. Les autres appareils semblent être basés au Panama ou être des avions locaux stationnés sur des bases militaires colombiennes.\n\nLes installations et camps des FARC et des milices amies n'ont généralement pas été pris pour cible par les forces américaines, bien que quelques cellules aient subi des dommages collatéraux ou perdu des caches d'armes et des véhicules. Les Américains semblent attaquer les positions des cartels, en se concentrant sur les cartels de Medellin et de Cali, qui opèrent dans l'ouest et le sud de la Colombie. Leur priorité semble être la lutte contre le trafic de drogue, et non les opérations anti-insurrectionnelles classiques, contre une force comme la nôtre.\n\nCertains dirigeants régionaux craignent que ces opérations américaines en cours ne permettent aux forces régulières colombiennes de se concentrer sur les unités des FARC, et ne privent notre organisation des fonds essentiels à la poursuite du combat. Cependant, nos capacités restent élevées et nous persévérerons malgré les bombardements de notre territoire par les impérialistes."
 CIA_LATAMa.12.d:0 "Les analystes étaient assis autour de la table, sirotant un café, attendant l'arrivée du directeur de la CIA [GetCurrentCIADir], à deux pas de son bureau, au 7e étage du siège initial, à Langley.\n\n« Bonjour, messieurs.» Le directeur sourit et ferma la porte. « Allons droit au but. Dites-moi tout ce que vous savez sur Pablo Escobar. »\n\n« Oui, monsieur le directeur. Son nom complet est Pablo Emilio Escobar Gaviria. Né en décembre 1949, il a grandi à Medellin, dans le nord-ouest de la Colombie. Très impliqué dans des activités criminelles depuis son adolescence, notamment dans des vols de voitures et des enlèvements d'hommes d'affaires. Arrêté pour la première fois en 1976 par les services de sécurité colombiens pour trafic de cocaïne en provenance d'Équateur, Escobar a commencé à asseoir son influence en se tournant vers la corruption et l'assassinat de fonctionnaires, en engageant des hommes armés et en faisant passer des quantités toujours croissantes de cocaïne depuis la Colombie vers le nord, aux États-Unis, d'abord via Miami et les Bahamas. »\n\nLe boom de la cocaïne qui a suivi au début de la décennie n'a fait qu'accroître la demande de cocaïne en provenance de Colombie et a intensifié la concurrence entre le cartel de Medellin d'Escobar et son rival, le cartel de Cali. Cependant, Escobar et ses hommes semblent pris entre deux feux. Ils s'opposent à la fois au gouvernement colombien, qui souhaite rétablir la sécurité, et aux FARC, tout en restant opposés à l'ingérence communiste. Selon les opérations, la CIA a tenté de contacter Escobar pour obtenir une coopération, mais sans succès jusqu'à présent. L'Agence doit décider rapidement de son sort.\n\nMerci, messieurs. Je vois. Proposez-vous d'éliminer Escobar et ses lieutenants ?\nOui, monsieur. La DEA, naturellement, et le FBI sont tous deux intéressés par cette idée, mais ils n'ont ni les ressources ni l'influence nécessaires pour la mettre en œuvre. Ils savent que la CIA a l'influence et le financement nécessaires, et nous avons déjà réussi des assassinats.\nAlors, quel est le plan ?\n\nLes opérations ont proposé de suivre les déplacements d'Escobar au cours des prochaines semaines afin d'établir un schéma d'analyse des lieux où lui et ses lieutenants se rendraient, alternant entre sa ville natale de Medellin et plusieurs de ses maisons à Carthagène, en Colombie, et une à Miami. Il se pourrait qu'il baisse suffisamment sa garde pour prendre un week-end de congé, et c'est à ce moment-là que nous frapperons. Des agents de la CIA, de la DEA, du MACV-SOG, etc., organiseront une proposition d'attaque, probablement dans sa propriété de Carthagène, où nous emmènerons Escobar, de préférence vivant, mais mort fera aussi l'affaire.\n\n« Très bien. Nous ne communiquerons pas au Président à ce sujet, sauf en cas d'absolue nécessité. »"
 CIA_LATAMa.13.d:0 "RECOURS AUX CARTELS ANTICOMMUNISTES EN COLOMBIE\nBureau Colombie, Bureau Amérique latine, Direction des analyses\nSECRET/NOFORN\n\nLa situation des cartels de drogue en Colombie a créé une situation inhabituelle pour toutes les parties concernées, y compris les États-Unis, qui souhaitent protéger leurs intérêts. Si la plupart des cartels adhèrent à une idéologie anticommuniste afin d'accroître leurs marges bénéficiaires pour le trafic de cocaïne, ils doivent également faire face à l'ingérence et aux attaques constantes du gouvernement colombien, et partagent certains idéaux avec les milices communistes et d'autres groupes.\n\nLe Bureau estime que certains grands cartels non communistes, comme le cartel de Medellin dirigé par Pablo Escobar, devraient être cooptés et intégrés à une alliance générale anticommuniste dirigée par le gouvernement. Ce Bureau estime que les cartels disposent déjà de l'argent, des réseaux de distribution et des armes nécessaires pour combattre les FARC et les autres milices communistes. Si nous parvenons à conclure des accords avec les principaux cartels (sur des questions telles que la distribution de cocaïne et/ou l'immunité de poursuites), nous pourrions recevoir une aide supplémentaire des cartels et réduire le nombre de belligérants dans le conflit. La consolidation doit être la clé."
 CIA_LATAMa.14.d:0 "Mise à jour de la situation : Bureau du Mexique  \nBureau du Mexique, Bureau de l’Amérique latine, Direction de l’analyse  \nSECRET/NOFORN\n\nMalgré d'autres conflits et bouleversements survenant dans la majorité du monde latino-américain, le voisin du sud des États-Unis, le Mexique, fait également face à une situation unique. Tout en maintenant des relations plutôt cordiales avec les États-Unis, le Mexique est seul responsable du transbordement de plus de 50 % des importations américaines de marijuana et d'héroïne, toutes deux des substances contrôlées de l'annexe I selon la Loi sur les substances contrôlées.\n\nLe gouvernement mexicain, dirigé par le président [MEX.GetLeader] fait face à des problèmes similaires de contrôle des drogues que les nations plus au sud, telles que la Colombie. L’utilisation de pulvérisation d’herbicides et l’implication des forces armées mexicaines dans les opérations de répression des drogues se sont avérées infructueuses, le pays restant un point central tant pour la production de marijuana et d’héroïne que pour le trafic de cocaïne en provenance d’autres pays, notamment la Colombie. Cependant, il convient de noter que contrairement à d’autres États producteurs de drogues en Amérique latine, la population mexicaine consomme très peu des drogues qu’elle produit et trafique.\n\nLa politique des États-Unis jusqu’à présent a été de faire pression diplomatique sur le gouvernement mexicain pour qu’il adopte des mesures de contrôle plus strictes, ce qu’il a fait la plupart du temps, avec des degrés d'efficacité variables. Ce bureau, ainsi que d’autres bureaux et départements axés sur le Mexique au sein de la communauté du renseignement et du Département d’État, ont proposé deux changements possibles de stratégie pour aider le Mexique dans sa lutte contre les drogues et pour faire avancer les intérêts américains dans la région.\n\n1. Les États-Unis pourraient adopter une approche secrète envers le Mexique, en s'engageant avec les cartels sans que le gouvernement mexicain en ait connaissance. Cette approche pourrait être préférable à la pression diplomatique sur le Mexique, et les opérations potentielles pourraient inclure la formation de milices anti-cartels, des attaques secrètes contre les bases et installations des cartels, et une augmentation des opérations et du financement de la DEA.\n\n2. Les décideurs américains pourraient également envisager une intervention possible au Mexique afin de stabiliser la situation de manière forcée. Il est espéré que cela soit une intervention internationale et puisse impliquer un processus des Nations Unies. Il est impératif que le gouvernement mexicain soit consulté à cet égard, afin de maintenir des relations amicales avec le Mexique et éviter toute animosité. Si le Mexique accepte d'accueillir des observateurs internationaux et de l'aide, il sera mieux équipé pour faire face à la problématique des drogues.\n\nCe bureau espère qu'une des deux stratégies permettra aux États-Unis de s'orienter vers une voie de répression efficace des drogues et de stabiliser de manière adéquate la situation des drogues en Amérique latine et en Amérique centrale."
 CIA_LATAMa.15.d:0 "APPROCHES SECRETES AU MEXIQUE\nBureau Mexique, Bureau Amérique latine, Direction des analyses, Direction des opérations\nSECRET/NOFORN\n\nAlors que les relations entre les États-Unis et le Mexique se détériorent, les services de renseignement américains et le Département d'État ont décidé qu'une stratégie secrète dans la guerre contre la drogue en cours constitue la prochaine étape de la politique américaine concernant le Mexique et les opérations de lutte contre la drogue. Ce Bureau recommande les mesures suivantes :\n\n1. Former des unités de milice anti-cartel, également appelées unités autonomes, dans les municipalités et les villes, en particulier là où l'activité du cartel est notoirement élevée. L'objectif est de former les citoyens mexicains à défendre leurs communautés et de garantir l'autonomie locale dans les opérations anti-cartel, en transférant l'autorité aux gouvernements locaux.\n\n2. Mener des raids des forces spéciales sur les bases et installations du cartel ; Utiliser les ressources de la CIA, de la DIA, de la Delta Force et des SEALs pour attaquer, perquisitionner, arrêter et éliminer stratégiquement les chefs et lieutenants des cartels, ainsi que les livreurs et les convois, afin d'intercepter les cartels et de leur faire comprendre que les États-Unis sont sérieux.\n\n3. Augmenter le financement de la DEA aux frontières, ainsi que les ressources de la police des frontières. Ce financement, prélevé sur les fonds déjà alloués par la CIA, permettrait à la DEA et à la police des frontières de continuer à interdire et arrêter les membres des cartels et le trafic de drogue à la frontière et aux points d'entrée des États-Unis, et d'accorder des pouvoirs juridictionnels supplémentaires à ces agences pour poursuivre leurs opérations.\n\nLe Bureau espère que de nouvelles opérations secrètes et une coopération avec les agences et responsables américains et mexicains compétents permettront d'intercepter efficacement la fabrication et le trafic de drogue au Mexique, stoppant ainsi l'afflux de drogue dans le sud des États-Unis et protégeant notre sécurité intérieure et internationale."
 CIA_LATAMa.17.d:0 "Le crépuscule tombait dans le désert, et tandis que le soleil disparaissait à l'horizon, la chaleur commençait à baisser rapidement. Dieu merci, pensa Mason en sirotant une bouteille d'eau, attendant que la nuit tombe. Il était assis dans une Ford Econovan, immatriculée au Mexique, bien sûr.\n\n« Dis donc, Gene, comment ça se passe là-bas ? »\n\nGene, son partenaire, hocha la tête. « Ça a l'air bien, chef ! » Il vérifia à nouveau le matériel de surveillance installé à la hâte, avant de charger la dernière balle dans son pistolet SIG Sauer P220, et de glisser l'autre, chargée, vers Pickett.\n\nLa radio grésilla de nouveau, indiquant la présence proche de l'équipe d'assaut. « Surveillance, ici Chien Un. Chien Un, approche de la zone d'atterrissage. Rapport de situation, allez ! »\n\nGene reprit. « Surveillance, ici Chien Un. Cible Alpha, tout est clair. Autorisation de prendre d'assaut. Tempête, tempête, tempête. »\n\nJuste au moment où il avait terminé, trois hélicoptères Hughes 500D survolèrent la camionnette, à environ 15 mètres au-dessus d'eux, atterrissant dans la cour du complexe du Cartel. Cinq soldats, accrochés à chaque hélicoptère, sautèrent, prenant des positions tactiques, tandis que les hélicoptères redécollaient, fournissant un tir de couverture aérienne.\n\nGene et Mason quittèrent également leur position, tandis que la camionnette quittait sa cachette et s'arrêtait, faisant un tête-à-queue devant l'entrée. Les deux agents de la CIA, se précipitant vers la cour, se frayèrent un chemin jusqu'à l'équipe d'assaut de la DEA, occupée à tirer, à arrêter les membres du Cartel qui se rendaient et à inspecter les corps des quelques hommes qu'ils avaient tués en chemin.\n\n« On dirait qu'on a frappé au bon moment », dit Mason, prenant une seconde pour recharger son pistolet avant de partir pour une autre pièce."
 CIA_LATAMa.18.d:0 "C'était un matin nuageux à Washington lorsque l'administrateur de la DEA entra dans le siège de la DEA, situé au 1405 I Street, à quelques pâtés de maisons de la Maison Blanche et du National Mall. En montant au dernier étage, il trouva sur son bureau un mot de sa secrétaire concernant un appel d'un numéro inconnu demandant à lui parler. La plupart des appels étaient filtrés, mais celui-ci provenait d'un téléphone gouvernemental.\n\nAlors qu'il se mettait au travail sur des rapports, le téléphone sonna environ 20 minutes plus tard. Il décrocha, s'attendant à avoir plusieurs personnes au bout du fil : sa femme, un subordonné, etc.\n\n« Allô ?»\n« Est-ce l'administrateur de la DEA ?»\n« Oui, à qui est-ce que je parle ?»\n« Ici Langley. Vérifiez vos comptes de fonctionnement. Il devrait y avoir de nouveaux fonds, de l'ordre de 20 millions de dollars. De rien. »\n« Quoi ?»\nClic.\n\nL'administrateur de la DEA a simplement regardé autour de lui avant de reposer le combiné. « Et puis, bon sang », pensa-t-il. « Plus d'argent pour les programmes de lutte contre la drogue, je suppose », pensa-t-il une seconde plus tard."
 CIA_LATAMa.19.d:0 "« Monsieur le Président, nous avons une proposition de solution au problème mexicain. »\n\nLe président [USA.GetLeader] a interrompu sa conversation, sans doute moins importante que ce qui allait sortir de la bouche du directeur de la CIA [GetCurrentCIADir]. Le secrétaire d'État [GetCurrentSecState] se tenait derrière lui, ce qui devait signifier quelque chose.\n\n« Allez-y, directeur. »\n\n« Eh bien, monsieur, la CIA a analysé la situation au Mexique et la politique américaine, et elle a proposé une alternative à ce que nous faisons actuellement. Nous proposons une intervention internationale, menée par les États-Unis ou les Nations Unies, au Mexique, afin de stabiliser la situation intérieure et de fournir des capacités opérationnelles cruciales de lutte contre le trafic de drogue et d'interdiction. »\n\n« Je vois. Prévoyons-nous de nous faire une idée des Mexicains, monsieur le Secrétaire ? »\n\nLe secrétaire d'État a hoché la tête. « Oui, monsieur. Nous prévoyons de faire une annonce et de mener une enquête par l'intermédiaire de l'ambassadeur des États-Unis à Mexico. Leurs options sont : nous leur fournirons aide et formation, ou, s'ils refusent, nous tenterons de trouver un consensus international via les Nations Unies et l'Organisation des États américains. »\n\n« Je vois. Considérez ceci comme signé, messieurs. Je suppose que l'autre solution était de poursuivre les opérations secrètes au Mexique ?»\n« Oui, monsieur. Nous y avions pensé, mais comme nos relations avec les Mexicains semblent bonnes pour le moment, la voie diplomatique pourrait être préférable.»\n« Très bien. Merci, messieurs.»\n\n« Merci, Monsieur le Président.» Les deux hommes sortirent de l'Ovale et, après s'être regardés, restèrent un instant dans le couloir. « Monsieur le Secrétaire, j'espère que vous savez à quoi vous vous engagez. Il serait peut-être judicieux d'obtenir un soutien international dès maintenant, tant que vous le pouvez. »"
 CIA_LATAMa.20.d:0 "L'ambassadeur des États-Unis au Mexique a présenté à nos Secrétariats des Affaires étrangères et de la Défense une proposition visant à lutter contre le problème persistant de la lutte contre la drogue dans le pays.\n\nLa Maison Blanche, visiblement préoccupée par notre inefficacité dans la lutte contre la production et le trafic de drogue des cartels au Mexique, a proposé une intervention internationale au Mexique afin de stabiliser la situation et de permettre au gouvernement d'améliorer la lutte contre la drogue.\n\nLes Américains ont proposé une aide internationale aux forces de l'ordre sous forme de financement et de coopération transfrontalière en matière de répression, mais certains responsables gouvernementaux craignent que le fait de laisser les Américains dicter leur politique en matière de drogue dans leur propre pays soit intrusif et contreproductif pour leurs objectifs politiques. Cependant, l'ambassadeur des États-Unis a clairement indiqué que, dans l'ensemble, les États-Unis s'impliqueront, qu'ils le veuillent ou non. Une décision cruciale doit être prise : solliciter leur aide ou résister fermement à la domination yankee sur nos affaires."
 CIA_LATAMa.21.d:0 "Après une brève conférence avec des responsables diplomatiques et de la sécurité nationale mexicains, l'ambassadeur des États-Unis à Mexico a fait part à Washington de la disponibilité du gouvernement mexicain à l'aide américaine dans ses opérations de lutte contre la drogue.\n\nApparemment considéré comme un sujet controversé dans certains cercles de la vie politique mexicaine, ce sujet a été perçu comme un avantage net, et la DEA américaine et la police fédérale mexicaine se sont déjà rencontrées pour discuter de la coopération frontalière et d'éventuelles opérations. Un échange de renseignements est également prévu, et le Pentagone a déjà envisagé le déploiement de conseillers militaires et de personnel de sécurité pour assister le Secrétariat mexicain à la Défense.\n\nLes analystes latino-américains se sont montrés optimistes quant à l'avenir, espérant qu'une coopération accrue entre les États-Unis et le Mexique permettra de mettre un terme à l'influence des principaux cartels sur la politique mexicaine et de mettre un terme à la montée rapide du problème de la drogue aux États-Unis."
 CIA_LATAMa.22.d:0 "Après une réunion brève avec des responsables mexicains de la diplomatie et de la sécurité nationale, l'ambassadeur des États-Unis à Mexico a fait savoir à Washington que les Mexicains s'opposaient fermement à toute intervention ou assistance américaine dans leur pays, arguant qu'une influence américaine accrue dans leur pays continuerait d'aggraver la situation politique et sociale et d'entretenir le problème de la drogue.\n\nLe Secrétariat mexicain aux Affaires étrangères a publié une déclaration publique révélant le plan, condamnant sévèrement la demande, la qualifiant de « tactique bien orchestrée de l'impérialisme américain en Amérique latine » et affirmant que « le Mexique ne se laissera pas instrumentaliser par les intérêts américains plus au sud. Nous pouvons gérer nous-mêmes le problème persistant du trafic de drogue, sans ingérence américaine ni internationale.»\n\nLes responsables des services de renseignement et de défense seraient furieux, et le président [USA.GetLeader] a été informé de l'évolution de la situation. Il est clair que si les Mexicains ne se plient pas à nos exigences, nous les y obligerons par tous les moyens nécessaires, même si cela implique de faire appel à la communauté internationale."
 CIA_LATAMa.23.d:0 "Aujourd'hui, à Mexico, un porte-parole du Secrétariat mexicain aux Affaires étrangères a confirmé des informations jusqu'alors infondées selon lesquelles les États-Unis cherchaient à intervenir au Mexique pour lutter contre la crise actuelle des cartels de la drogue. Les responsables mexicains ont condamné sans équivoque toute éventuelle intervention, la qualifiant d'« impérialisme américain en Amérique latine, comparable à celui observé au Brésil, au Guatemala et à Cuba ».\n\nLes responsables américains seraient déçus par cette évolution, mais se sont engagés à poursuivre une éventuelle intervention. Certains experts ont avancé que les Nations Unies ou l'Organisation des États américains pourraient être contactées, mais l'avenir nous le dira."
 CIA_LATAMa.24.d:0 "C'était une journée ensoleillée lorsque le président [USA.GetLeader] s'est réuni avec son équipe et ses subordonnés pour une cérémonie modeste mais officielle. Étaient présents le secrétaire d'État [GetCurrentSecState], le directeur de la CIA [GetCurrentCIADir], le conseiller à la sécurité nationale [GetCurrentNatSecAdv], le directeur du FBI, l'administrateur de la DEA et le chef de la police des frontières.\n\nIls étaient tous réunis, sans la presse pour l'instant, car le président signait un document important, quoique quelque peu archaïque et traditionnel : une proclamation présidentielle. Mais il ne s'agissait pas d'une proclamation ordinaire ; elle serait également accompagnée d'une résolution conjointe du Congrès confirmant son contenu : une proclamation présidentielle déclarant les États-Unis mexicains « État narcotrafiquant », un pays dont les activités reposent sur la production et le trafic de drogue.\n\nEn vertu des pouvoirs qui me sont conférés en tant que Président des États-Unis d'Amérique, je déclare par la présente ce qui suit :\nInquiet de plus en plus de l'augmentation des flux de marijuana et d'héroïne entrant aux États-Unis via leur frontière avec le Mexique ;\nPréoccupé par l'inefficacité des forces de l'ordre et de l'armée mexicaines, qui ne sont ni capables ni efficaces de lutter seules contre les cartels ;\nReconnaissant le rôle essentiel que joue la corruption, notamment l'influence des cartels, dans le système politique mexicain, dans l'efficacité des forces de l'ordre dans les opérations de lutte contre la drogue ;\nEn tant que Président des États-Unis d'Amérique, je déclare et proclame que les États-Unis mexicains sont désormais considérés comme un narco-État au vu des faits susmentionnés, et je mets en garde les civils, par l'intermédiaire de sources compétentes, telles que le Département d'État, contre les dangers de se rendre au Mexique pour leur propre sécurité.\n\nLe Président a soupiré en signant la proclamation, sachant pertinemment que ce ne serait que le début d'une situation prometteuse pour son administration."
 CIA_LATAMa.25.d:0 "En tant que Secrétaire d'État, [GetCurrentSecState] était assis dans son bureau, il vérifia son emploi du temps avant d'entendre un bip venant de sa secrétaire extérieure.  \n\"Secrétaire, vous avez des appels des Ambassadeurs et du Bureau de l'Amérique latine sur les lignes un à quatre.\"\n\nPrenant le téléphone, il appuya sur \"LIGNE 1\".  \n\n\"Bonjour, Monsieur l'Ambassadeur, comment allez-vous ? Quelle est la situation à Londres ?\"  \n\"Monsieur le Secrétaire, les Britanniques semblent indifférents à l'idée de soutenir une mission internationale de lutte contre les drogues. Ils ont peu d'influence ou de raisons de s'impliquer au Mexique, mais le Secrétaire aux Affaires étrangères n'a pas indiqué qu'ils voteraient contre.\"  \n\n\"Très bien, merci Monsieur l'Ambassadeur. Passez une bonne journée.\" Le Secrétaire murmura un au revoir avant de passer à \"LIGNE 2\".  \n\"Monsieur l'Ambassadeur, comment cela se passe-t-il à Paris ?\"  \n\"Monsieur le Secrétaire, les Français sont intéressés à contribuer à une mission de surveillance des drogues. Ils ont dit qu'ils ne voteraient pas contre cette mission au Conseil de sécurité.\"  \n\"Très bien, merci.\" Le Secrétaire changea brièvement de ligne pour passer à \"LIGNE 3\".\n\n\"Monsieur le Secrétaire, je sais ce que vous allez demander. Les Brésiliens, Argentins et Chiliens soutiennent tous votre programme. Les Colombiens pourraient également, mais comme vous le savez, ils sont actuellement occupés. La plupart de l'Amérique centrale soutient aussi, sauf bien sûr le Nicaragua.\"  \n\n\"Merci, Bureau de l'Amérique latine. Continuez vos analyses. Passez une bonne journée.\" Le Secrétaire se sentit un peu coupable, mais il devait rester concis. Il passa à son dernier appel, \"LIGNE 4\", l'Ambassadeur auprès des Nations Unies.\n\n\"Monsieur l'Ambassadeur, comment se passe votre travail à New York ?\"  \n\n\"Monsieur le Secrétaire, c'est mitigé. La Mission et moi avons travaillé sans relâche pour contacter les autres missions ici et les convaincre de nous soutenir, particulièrement les membres du Conseil de sécurité et le Bloc de l'Est, mais jusqu'à présent, nous avons eu très peu de succès. De nombreux membres hors d'Amérique latine s'en fichent ou considèrent cela comme un autre exemple d'impérialisme américain. Nous faisons de notre mieux, Monsieur le Secrétaire, et nous travaillons actuellement sur le langage pour un projet de résolution.\"  \n\n\"Merci, Monsieur l'Ambassadeur. Continuez votre bon travail et envoyez vos rapports. Si vous avez besoin de moi, passez-le par mon bureau. Le Président veut que cela se fasse et, bon sang, je vais tout faire pour que cela fonctionne.\""
 CIA_LATAMa.26.d:0 "C'était la réunion ordinaire du Conseil de sécurité des Nations Unies, et lorsque les membres entrèrent dans la salle de réunion du Conseil à New York, ils commencèrent à soupçonner un piège. Le représentant américain, déjà arrivé, examinait des documents, ses assistants se tenant à proximité. Ils levèrent les yeux tandis que les représentants soviétique, chinois, britannique, français et non permanents s'asseyaient, rappelés à l'ordre par le président. Comme d'habitude, l'ambassadeur américain se leva le premier, lançant immédiatement leur discours.\n\n« Mesdames et Messieurs du Conseil de sécurité, j'ai convoqué aujourd'hui une réunion pour discuter d'une question que les Nations Unies ont déjà traitée. Notre voisin du sud, le Mexique, est confronté à un problème permanent de lutte contre la drogue, avec de nombreux cartels importants qui produisent et trafiquent de la marijuana et de l'héroïne aux États-Unis. Cette situation affecte notre jeunesse, provoque des centaines de décès et de toxicomanies des deux côtés de la frontière, et procure au crime organisé des millions de dollars pour ses propres besoins. »\n\nLe gouvernement mexicain a tenté d'utiliser ses forces de l'ordre et ses ressources militaires pour contrer ces cartels, mais sans succès. Les États-Unis ont tenté de demander de l'aide, mais le gouvernement mexicain a résisté à nos tentatives à chaque fois. Ce problème nous concerne non seulement, mais aussi toute l'Amérique latine, voire le monde entier. La guerre contre la drogue est un enjeu international, et nous, en tant que leader mondial, souhaitons le résoudre avec l'aide de l'ONU.\n\nEn tant que représentant des États-Unis au Conseil de sécurité des Nations Unies, je soumets par la présente la résolution suivante : condamner la crise de la drogue au Mexique, autoriser une mission de surveillance et de répression des Nations Unies au Mexique et autoriser les États-Unis à prendre des mesures pour rétablir l'état de droit au Mexique et mettre fin aux opérations de trafic de drogue.\n\nEn se rasseyant, un murmure s'éleva dans la salle. La délégation américaine, assise dans son coin, savait que ce n'était qu'un début."
 CIA_LATAMa.27.d:0 "La surprise a été de constater aujourd'hui à New York que le représentant permanent des États-Unis au Conseil de sécurité a saisi l'ONU et soumis un projet de résolution concernant la crise actuelle de la drogue dans la région.\n\nPrésenté quelques jours après le rejet par le gouvernement mexicain d'une offre d'intervention visant à prévenir le trafic de drogue, et après que le président américain [USA.GetLeader] a déclaré le Mexique narco-État dans une proclamation présidentielle, le projet de résolution du Conseil de sécurité condamne fermement la crise actuelle de la drogue et l'inefficacité du Mexique à y mettre fin, autorisant une mission de surveillance et de répression des Nations Unies au Mexique et plaçant cette mission sous la direction des États-Unis afin de rétablir l'État de droit au Mexique et de lutter contre le trafic de drogue.\n\nLargement considéré comme un exemple international de la politique américaine de « guerre contre la drogue », le Conseil de sécurité est largement divisé sur ce point ; la délégation soviétique et d'autres membres condamnent ces messages flagrants, mais n'indiquent aucun veto. La plupart des États latino-américains non communistes semblent y apporter leur soutien, le Mexique étant manifestement absent."
 CIA_LATAMa.28.d:0 "Notre Représentant permanent auprès des Nations Unies a annoncé aujourd'hui une bonne nouvelle : il a confirmé l'approbation par le Conseil de sécurité de notre projet de résolution sur la question mexicaine.\n\nConsultée par le Secrétaire d'État et le Secrétaire à la Défense, la résolution de l'ONU prévoit la création d'une Mission de surveillance et d'application des Nations Unies au Mexique, placée sous le commandement des États-Unis et d'autres pays participants. Elle condamne également fermement le gouvernement mexicain pour son inefficacité à ce jour dans la lutte contre le trafic de drogue.\n\nDes responsables à Foggy Bottom, au Pentagone et à New York se coordonnent rapidement pour constituer un groupe de pays participants et prépositionner des moyens militaires près de la frontière mexicaine afin de lancer l'opération une fois celle-ci formée par l'ONU."
 CIA_LATAMa.29.d:0 "De mauvaises nouvelles sont parvenues du siège des Nations Unies à New York : le Conseil de sécurité des Nations Unies, sous l'influence des États-Unis, a adopté une résolution autorisant la création d'une Mission de surveillance et d'application des Nations Unies au Mexique.\n\nApparemment mécontente de l'efficacité de notre gouvernement dans la lutte contre la crise de la drogue, l'ONU a autorisé les forces américaines à diriger la Mission, avec du personnel international et le soutien de la région et du monde entier.\n\nDe nombreux membres du gouvernement, dont le président [MEX.GetLeader], sont très mécontents et appellent à toute résistance face aux forces onusiennes et américaines. L'avenir nous dira ce que fera la Mission, comment elle gérera cette crise et comment nous réagirons."
 CIA_LATAMa.30.d:0 "Une autre surprise est venue du siège des Nations Unies à New York : le Conseil de sécurité des Nations Unies, sous la direction des États-Unis, a approuvé un projet de résolution autorisant la mission de surveillance et de répression des Nations Unies au Mexique. Reconnaissant apparemment la nécessité d'un contrôle international des drogues et d'une répression efficace, les cinq membres permanents du Conseil de sécurité ont approuvé la question, sans aucun veto, même de la part de l'Union soviétique.\n\nLes États-Unis étant les principaux responsables de la mission, les opérations au Mexique devraient débuter prochainement. Un soutien international, tant au sein du Conseil de sécurité qu'à l'Assemblée générale, sera nécessaire pour accueillir davantage de volontaires et de personnel chargé de la répression. Le Mexique, bien qu'il n'ait pas fait de commentaires officiels, a vu d'importants responsables gouvernementaux exprimer une désapprobation extrême, et l'on s'attend à une ingérence du gouvernement mexicain dans les opérations de la mission sur presque tous les points."
 CIA_LATAMa.31.d:0 "Une mauvaise nouvelle est parvenue aujourd'hui du siège de l'ONU à New York : notre ambassadeur auprès des Nations Unies a appelé la Maison-Blanche pour informer [USA.GetLeader] que la résolution du Conseil de sécurité concernant le Mexique a échoué, l'Union soviétique ayant opposé son veto, mettant ainsi fin à toute proposition significative des États-Unis.\n\nLes responsables du Département d'État et du Département de la Défense seraient furieux, et les membres de la délégation de l'ONU à New York tentent de convaincre l'Assemblée générale d'y élaborer un projet de résolution. Cependant, toute tentative d'envoi d'une mission d'observation de l'ONU au Mexique a échoué, en raison de l'ingérence et de l'influence du bloc de l'Est."
 CIA_LATAMa.32.d:0 "La Mission permanente du Mexique auprès des Nations Unies a annoncé l'échec d'un projet de résolution au Conseil de sécurité visant à créer une mission d'observation des Nations Unies dans notre pays, suite au veto de l'Union soviétique, l'un des cinq membres permanents du Conseil.\n\nDes hauts responsables gouvernementaux se réjouissent, tandis que des sources diplomatiques américaines rapportent que de nombreux responsables du Département d'État et de la Maison-Blanche sont furieux et pourraient recourir à des mesures d'urgence pour parvenir à leurs fins. On ignore encore ce que les États-Unis comptent faire pour résoudre ce problème, mais nous pouvons au moins être à l'abri d'une intervention internationale pour le moment."
 CIA_LATAMa.33.d:0 "De nouvelles nouvelles sont parvenues aujourd'hui du siège de l'ONU à New York : le Conseil de sécurité des Nations Unies a rejeté une résolution américaine visant à former une force internationale de surveillance et de répression au Mexique pour contrôler la crise actuelle de la drogue dans ce pays. Selon des responsables de l'ONU, la résolution a été rejetée en raison du veto de l'Union soviétique, l'un des cinq membres permanents du Conseil.\n\nSi les responsables mexicains se disent soulagés par cette évolution, les responsables américains sont furieux, notamment après avoir lancé une campagne de soutien international aux opérations de lutte contre la drogue. On ignore encore si les États-Unis agiront seuls pour résoudre le problème, mais seul l'avenir nous le dira."
 CIA_LATAMb.0.d:0 "C'était un lundi matin pluvieux dans le Bureau ovale. Tandis que le Président s'installait avec sa tasse de café, il se préparait à un nouveau briefing passionnant avec son équipe de sécurité nationale : le directeur de la CIA [GetCurrentCIADir], le conseiller à la sécurité nationale [GetCurrentNatSecAdv] et le secrétaire d'État [GetCurrentSecState], ainsi qu'une multitude de collaborateurs.\n\n« Monsieur le Président, je suis sûr que vous conviendrez qu'à l'heure actuelle, notre meilleure stratégie est de maintenir une priorité anticommuniste en Amérique latine. Se concentrer sur les cartels ne nous mènera nulle part dans la région, car les États-Unis et leurs alliés se concentreraient sur la lutte contre les groupes des deux camps. Si les cartels sont dangereux, les guérillas communistes d'Amérique centrale et d'Amérique latine le sont encore plus et disposent de la capacité institutionnelle de renverser les gouvernements soutenus par les États-Unis. Nous pensons que cela devrait être la priorité numéro un dans la région.» Le conseiller à la sécurité nationale s'est confié.\n\n« Très bien. Directeur, que propose la CIA pour soutenir les efforts de renseignement dans le cadre de ce plan ?»\n\nLe directeur de la CIA consulta quelques notes puis prit la parole. « Monsieur le Président, la CIA a principalement concentré ses propositions et ses analyses sur le Panama. Son dirigeant, le général Manuel Noriega, a été formé à l'École des Amériques, est un fervent anticommuniste et a été chef des renseignements du Panama avant de devenir président. Nous pensons que lui et son gouvernement seront un atout crucial dans la région. De plus, notre attention sur le trafic de drogue s'est portée principalement sur la cocaïne, et potentiellement sur son trafic pour financer de nouvelles opérations contre les communistes.»\n\nLe secrétaire d'État interrompit la discussion avant que le Président ne puisse répondre. « Monsieur le Président, le Département d'État a également envisagé de développer ses relations avec les États anticommunistes d'Amérique centrale tels que le Honduras, le Guatemala et le Salvador. Il a déterminé que les incitations possibles pourraient être des ventes d'armes, une aide économique, la normalisation des relations commerciales, etc., s'ils continuent de soutenir l'intervention contre les guérillas communistes.»\n\nLe Président hocha la tête et posa sa tasse. « Cela semble être un plan efficace et bien coordonné. Ma seule préoccupation est de savoir dans quelle mesure nous devons le rendre public. Les opérations de la CIA doivent rester secrètes, tandis que les actions diplomatiques doivent rester publiques. Nous n'informons pas le Congrès à ce sujet, sauf s'il le demande, compris ?»\n\n« Oui, Monsieur le Président. »"
 CIA_LATAMb.1.d:0 "« Quel est déjà le nom de ce général ? »  \n« Le général Manuel Noriega, Directeur adjoint. »  \n\nLes deux analystes, après avoir passé des jours à préparer des rapports sur l'Amérique latine, bouillonnaient à l'idée de devoir simplifier chaque détail pour le Directeur adjoint des opérations de la CIA, alors qu'ils étaient assis dans une salle de conférence quelque part à Langley.  \n\n« D’accord. Noriega. Et qu’en est-il de lui ? Que dit le Bureau de l’Amérique latine à son sujet ? »  \n\n« Né en 1934, il rejoint la Garde nationale panaméenne dans les années 1960, a été formé à l’École des Amériques en 1966, puis affecté à des opérations anti-syndicales pour la United Fruit Company. Noriega gravit les échelons de l'armée panaméenne, soutenant la revendication au pouvoir de Torrijos, et devint son chef du renseignement. Pendant cette période, il expulsa plus d'un millier de Panaméens qu'il considérait comme des dissidents et se mêla au trafic de drogues ; les autorités américaines commencèrent à s'en rendre compte dans les années 1970 mais laissèrent tomber. En 1971, les relations entre le Panama et les États-Unis, notamment en matière de renseignement, étaient devenues suffisamment proches pour que la CIA place Noriega sur la liste de ses agents payés, et depuis lors, la CIA lui a versé entre 100 000 et 200 000 dollars par an, selon l'administration et les priorités budgétaires. Noriega est désormais le leader du Panama, succédant à Omar Torrijos après sa mort en 1981. »  \n\n« Excellent, merci. » Le DDO marqua une pause pour réfléchir. « Le DCI et le Président m'ont fait part de certaines préoccupations concernant le maintien de Noriega sur la liste des agents payés par la CIA, surtout avec l'augmentation du contrôle du Congrès et ses liens passés avec le trafic de drogue. Est-ce que ça vaut la peine de le garder sur la liste des agents payés, messieurs ? »  \n\nLes analystes se regardèrent, puis consultèrent leurs notes avant de se tourner vers l’avant. « Oui, Monsieur. Nous pensons que Noriega occupe une position unique en tant que leader du Panama et a la capacité de fournir des armes et un soutien en renseignement aux forces contras au Nicaragua. Sa position stratégique près du Canal lui confère également un avantage militaire considérable. Son passé avec le trafic de drogue pourrait être corrigé grâce à des incitations de notre part ou du Département d'État, et des troupes sont encore stationnées près de la Zone du Canal. La répression est tout à fait possible. »  \n\nLe DDO hocha la tête. « Je vois. Très bien, nous le garderons sur la liste pour l'instant. Merci, messieurs. »"
 CIA_LATAMb.2.d:0 "En réponse à certaines inquiétudes exprimées à la Maison Blanche et au Capitole quant à l'utilité de maintenir des relations avec le régime de Noriega, les États-Unis ont aujourd'hui, par l'intermédiaire de leur ambassade à Panama et de manière secrète, apporté un soutien accru au général Manuel Noriega et à son gouvernement.\n\nSans préciser la nature de ce soutien, les États-Unis devraient fournir une aide économique, des relations commerciales et une aide militaire, en échange du soutien continu du gouvernement de Noriega aux opérations anticommunistes. Le chef de la station de la CIA à Panama a exprimé en privé son soutien à la poursuite des opérations américaines dans le pays et en Amérique centrale."
 CIA_LATAMb.3.d:0 "L'ANTICOMMUNISME EN AMÉRIQUE CENTRALE : EN BREF\nBureau d'analyse de l'Amérique latine, Direction du renseignement\nSECRET/NOFORN\n\nDans leur lutte pour chasser l'influence communiste d'Amérique centrale et latine, les États-Unis se sont fortement appuyés sur les régimes anticommunistes et les États amis pour maintenir l'ordre public face aux mouvements de guérilla radicaux. Soutenir les dirigeants et les partis anticommunistes au Guatemala, au Honduras, au Salvador et au Panama constituera une stratégie responsable pour maintenir leur influence, et ce, de la manière suivante :\n\n1. Un soutien diplomatique permettra à ces pays de bénéficier d'une légitimité et d'un soutien adéquats de la part d'une superpuissance, ainsi que de la possibilité de recevoir une aide économique et un soutien international accru au sein d'organisations telles que l'ONU. Cela renforcera les liens commerciaux et assurera la pérennité de ces pays.\n\n2. Le soutien du Pentagone en matière de défense permettra à ces pays de recevoir des équipements dans le cadre du Programme d'assistance militaire (MAP), conformément aux dispositions des autres États anticommunistes. Notre analyse a conclu que leurs capacités militaires accusent encore des années de retard sur celles de nombreuses armées européennes, mais que l'équipement nécessaire aux opérations de contre-insurrection leur sera utile.\n\n3. Enfin, un soutien secret sous forme de partage de renseignements, d'intégration d'agents de la CIA, de formation et d'accords de localisation permettra à nos agents et aux agents de renseignement de ces pays de coordonner efficacement leurs ressources et leurs opérations afin de localiser les cellules communistes et leurs méthodes d'attaque.\n\nLe Bureau espère sincèrement que ces trois volets constitueront la principale stratégie de défense pour maintenir l'influence américaine et prévenir l'influence soviétique et cubaine en Amérique latine."
 CIA_LATAMb.4.d:0 "Apparemment, dans le cadre d'une nouvelle initiative du gouvernement américain visant à maintenir son influence dans la région et à repousser les incursions communistes et les groupes rebelles, les États-Unis ont annoncé un programme de soutien élargi aux pays anticommunistes d'Amérique centrale, dont le Guatemala, le Honduras, le Salvador et le Panama.\n\nCe soutien, réitéré par les ambassades américaines dans chaque pays et par Foggy Bottom, consiste principalement en un soutien à la défense, sous la forme de ventes d'armes dans le cadre du Programme d'assistance militaire (MAP) et de formations de troupes. Par ailleurs, les relations diplomatiques devraient être renforcées, ainsi qu'une aide économique et au développement vers chacun des pays.\n\nLes réactions à cette annonce ont été mitigées, la plupart des responsables gouvernementaux se réjouissant que leurs maîtres américains continuent de les soutenir, quelles que soient leurs actions."
 CIA_LATAMb.5.d:0 "UTILISATIONS POSSIBLES DES CARTELS DE LA DROGUE : EN BREF\nBureau d'analyse latino-américain, Direction du renseignement ; Bureau des affaires de drogue, Direction des opérations\nSECRET/NOFORN\n\nLa présence et l'influence des cartels de la drogue, ces organisations criminelles organisées spécialisées dans le trafic de drogues telles que la marijuana, l'héroïne et la cocaïne, en Amérique latine et en Amérique centrale, constituent un défi dans le contexte géopolitique multipolaire de la région. Les cartels, comme le cartel de Medellin en Colombie, les cartels de Guadalajara et du Golfe au Mexique, ainsi que d'autres organisations plus petites présentes dans la région, jouissent d'un pouvoir et d'une influence considérables, et financent et acheminent des armes.\n\nNotre analyse a révélé que ces cartels semblent anticommunistes par nature, bien qu'ils soient politiquement et idéologiquement malléables ; leur priorité absolue est la production et le trafic de drogue, quelle que soit l'affiliation politique de leurs acheteurs. Certains analystes ont émis l'hypothèse que de nombreux membres des cartels, aux échelons inférieurs, pourraient être d'anciens guérilleros mécontents désireux de changer de vie et de gagner plus d'argent.\n\nCe Bureau estime que les cartels mentionnés ci-dessus sont dans une position financière et idéologique propice à une utilisation à des fins politiques au profit des États-Unis et de leurs intérêts en Amérique latine. Cela pourrait prendre les formes suivantes :\n\n1. Des ressources américaines pourraient contribuer à la contrebande et à d'autres trafics de stupéfiants dans la région, en particulier aux grands cartels du Mexique et de Colombie. Cela permettrait aux cartels d'accroître leurs revenus, de garantir que leurs livraisons ne soient pas interceptées et de légitimer leur soutien par une grande puissance.\n\n2. Des ressources américaines pourraient également soutenir l'organisation Muerte a Secuestradores (MAS), une organisation paramilitaire colombienne connue pour être déjà financée par les cartels et qui a mené de nombreuses opérations de contre-insurrection contre les mouvements communistes des FARC et du M-19 en Colombie.\n\n3. Les services de renseignement américains pourraient également envisager certaines opérations nationales limitées, notamment en faisant obstruction ou en interférant de toute autre manière avec les enquêtes du FBI et de la DEA sur le trafic de drogue, en particulier si elles ciblent les membres du cartel que les États-Unis soutiennent."
 CIA_LATAMb.6.d:0 "Steve Wilkins se pencha sur son camion de deux tonnes et demie, fumant une cigarette, tout en regardant les hommes, à moins de trente mètres de lui, décharger un petit Cessna 182 Skylane qui venait d'être arrêté et garé. Il regarda autour de lui, dans la jungle nicaraguayenne, à plus d'une douzaine de kilomètres de là, et remarqua alors les quelque trois rebelles armés, rien ne les distinguant plus que leurs fusils de combat FN FAL.\n\nTout en continuant de fumer, il regarda les Contras décharger l'avion, transporter des briques et des briques de cocaïne, de la « neige », dans son camion, les cachant au fond, ou dans des caisses d'autres marchandises marquées « aide humanitaire ». Il fit un signe de tête aux hommes, qui lui rendirent son salut. Déconcertés par ce qu'ils faisaient, ils le comprendraient bien assez tôt, l'argent commençant à rentrer.\n\nLorsqu'ils eurent terminé, il sourit, se tournant vers le commandant en chef de l'unité Contra locale, lui glissant quelques cordobas avant de monter dans le camion et d'entamer son voyage, certes court, mais plutôt dangereux, vers la côte.\n\nUn peu plus d'une heure après son départ, Wilkins, nom de code « SKI LIFT », avait atteint son point de rendez-vous : un petit village de pêcheurs, dont il n'a jamais su le nom, sur la côte atlantique du pays. Là, il aperçut ce qui semblait être un petit crevettier, rouillé, camouflé dans la végétation près de l'eau. S'en approchant, il en sortit, but une gorgée d'eau avant d'en allumer une autre, en attendant que le pilote rejoigne la rive.\n\nIl ignorait le nom du pilote et n'aurait probablement pas voulu le connaître si la situation s'était présentée. Après avoir serré la main de l'homme à la peau considérablement plus bronzée, ils commencèrent à charger les briques dans le bateau, trois ou quatre à la fois. Il fallut plusieurs voyages, la cargaison étant plus importante, mais ils y parvinrent et ralluma aussitôt une cigarette en se serrant la main, avant que le pilote ne monte dans son bateau, le démarre et commence à filer en direction de Miami.\n\nSteve resta là, observant, écrasant le mégot de sa cigarette. Ce déploiement avait été long, mais Langley obtenait ce qu'il voulait. Au moins, c'était une mission assez routinière."
 CIA_LATAMb.7.d:0 "Nos efforts pour introduire clandestinement des quantités toujours plus importantes de cocaïne aux États-Unis et dans toute la région bénéficient aujourd'hui de l'aide d'agents américains de la CIA, déployés dans nos bastions au Nicaragua pour faciliter le transport transfrontalier de la drogue, la production de cocaïne et la protection des installations contre les incursions du FSLN et les actions de lutte antidrogue.\n\nIl semble que les Américains nous aident principalement pour que nous puissions financer nous-mêmes nos armes et nos opérations, au lieu de dépendre d'eux pour un financement secret. Leurs opérations se déroulent bien, mais leur durée est incertaine, notamment parce que l'aide qui nous est apportée, notamment en matière de drogue, est perçue comme impopulaire par les représentants du Congrès et de l'administration."
 CIA_LATAMb.8.d:0 "Oscar Danilo Blandon était assis dans sa camionnette, à South Central Los Angeles, attendant simplement. C'était une journée d'été tranquille, et assis, il songeait au chemin parcouru depuis son lieu de fabrication. Cultivée et raffinée en Colombie, introduite clandestinement par avion vers le nord jusqu'au Nicaragua par des agents Contras, transportée à travers le pays, embarquée sur un crevettier, expédiée à Miami, puis acheminée de camionnette banalisée en camionnette banalisée jusqu'à Los Angeles, où il la récupérait.\n\nIl attendait son partenaire, Ricky Ross. Originaire de ce quartier de Los Angeles, Blandon avait appris que Ross était le seul trafiquant de drogue de la ville à avoir contacté les Colombiens. C'était formidable. Blandon dut recompter, mais il estima qu'il y avait quelques millions de dollars de cocaïne à l'arrière. Une jolie petite somme pour aider ses camarades au Nicaragua, qui combattaient les salauds de communistes.\n\nRoss s'approcha et serra la main de Blandon en sortant de la camionnette. Ils étaient assis devant un parc, désert pour le moment ; Dieu merci, pensèrent-ils tous les deux. Blandon ouvrit brusquement l'arrière du van et tous deux montèrent à bord, fermant la portière. Ils devaient faire vite, avant l'arrivée d'une voiture de patrouille « noire et blanche » du LAPD.\n\n« Putain !» chuchota Ross en voyant les briques et les briques de cocaïne. Blandon hocha la tête. « Ça vaut deux ou trois millions de dollars, si je devais deviner. Le Cartel a fabriqué une plus grosse quantité cette fois.»\n\nRoss sourit. « Super, mec, super. On va ramener ça chez moi, j'appellerai mes dealers et on pourra y aller. Je suis vraiment excité, et je pense que tous mes acheteurs trouveront ça génial. Au fait, où va l'argent ? Au Cartel ?»\n\nBlandon baissa les yeux sur les briques, puis les releva. « Si je te le dis, est-ce que ça va affecter notre affaire ?»\nRoss regarda autour de lui. « Non ? La drogue est la drogue. J'étais juste curieux. »\n« Les Contras. Des combattants de la liberté au Nicaragua, qui luttent contre le régime communiste tyrannique. L'argent leur sert à acheter des armes et des opérations. »\n\nRoss hocha la tête. « Bien. »"
 CIA_LATAMb.9.d:0 "« C'est quoi ce putain de mémo ? » La secrétaire dehors du bureau du DDO sursauta en entendant son patron hurler. Bien que ce ne soit pas une scène rare, elle rassembla son courage et entra.\n\n« Monsieur, ce mémo vient du DDI et du Bureau de l’Amérique latine. Apparemment, ils jugent prudent de considérer la distribution de drogue ici, afin de financer les Contras. » \n\n« Fais-moi passer le DDI au téléphone, tout de suite ! Putain ! »\n\n« Oui, Monsieur. » Elle ne l’avait jamais vu aussi en colère, mais elle transféra l’appel vers le bureau du DDI, qui était proche mais pas exactement à côté du DDO au septième étage de Langley.\n\n« Bureau du Directeur adjoint du renseignement. Qui est à l’appareil ? »  \n« TU SAIS TRÈS BIEN QUI C’EST !! METS TON PATRON SUR LA LIGNE ! »  \n« Oui, Monsieur. » Il y eut un clic, puis le DDI répondit. « Oui ? »  \n« C'EST QUOI CE PUTAIN DE MÉMO QUE JE LIS ? »  \n« Eh bien, c'est ce que ça semble être. Nos analystes l'ont examiné et ont conclu que aider les Contras à distribuer leur cocaïne aux États-Unis et dans d'autres États leur permettrait de récolter suffisamment de fonds et d’influence pour devenir plus autonomes qu'ils ne le sont actuellement. »  \n« T'es complètement taré ou quoi ? Tu sais très bien que si ça sort, la DEA va me foutre la pression, le FBI va me bousiller et le Congrès ? Ils vont nous crucifier ! Tu entends ce que je dis ?! »  \n\n« Le Congrès pourrait bien réfléchir à deux fois quand les Contras reprendront leur pays aux Sandinistes. »  \n\n« Ça suffit. Les opérations ne donneront pas leur feu vert. Terminé. On en reste là. »  \nClic.  \n\nLa secrétaire se tourna lentement, tentant d’évaluer l’humeur du DDO. Il semblait toujours en colère, mais la pièce était étrangement silencieuse."
 CIA_LATAMb.10.d:0 "Alors que l'équipe du Bureau Amérique latine se réunissait pour sa réunion hebdomadaire, ils s'installèrent avec un café et des viennoiseries, veillant à ne pas tacher les dossiers posés sur la table de conférence.\n\n« Eh bien, j'ai enquêté sur un nouveau groupe qui sillonne la Colombie », dit Jim, l'analyste spécialisé dans le conflit colombien. « Ils se font appeler Muerte a Secuestradores, ou \"Mort aux kidnappeurs\". » Le directeur du Bureau acquiesça, le laissant poursuivre.\n\n« Le MAS semble avoir été créé et fondé par les principaux cartels de la drogue colombiens, dont l'important cartel de Medellin dirigé par Pablo Escobar. Leur mission principale n'est pas offensive, mais défensive : protéger les biens du cartel et des grands propriétaires terriens, et empêcher les tentatives d'enlèvement par d'autres paramilitaires. Les autres principaux bailleurs de fonds semblent être l'armée colombienne et, curieusement, Texaco, basée ici aux États-Unis. »\n\nLe directeur du Bureau acquiesça. « Je vois. Donc, ce MAS. » Quelle est leur place dans notre politique ?\n\n« Eh bien, Monsieur, le MAS représente l'occasion idéale de s'engager en Colombie sans engager trop de ressources. Ce sont des anticommunistes convaincus, ayant mené des opérations contre les FARC et le M-19, les principaux groupes de guérilla communistes en Colombie ; ils sont liés aux cartels de la drogue, en particulier au cartel de Medellin, ce qui permet aux agents américains de contacter directement le cartel et de lancer d'autres opérations. »\n\n« Intéressant, Jim. Donnez-moi votre rapport et je le transmettrai à nos supérieurs. Nous envisagerons de soutenir le MAS. Ce ne devrait pas être compliqué. »"
 CIA_LATAMb.11.d:0 "Des sources au sein de l'armée et des services de renseignement colombiens rapportent que les États-Unis ont commencé à soutenir secrètement le groupe paramilitaire Muerte a Secuestradores (MAS), ou « Mort aux ravisseurs », fondé par le cartel. Fondé par le cartel de Medellin et soutenu par certaines unités de l'armée colombienne, le MAS a été créé pour protéger les biens du cartel et des propriétaires fonciers, ainsi que pour prévenir les enlèvements de membres du cartel.\n\nLes Américains ne nous ont pas informés de cette évolution, soupçonnant peut-être que nous engagions des poursuites contre les cartels. L'ambassadeur des États-Unis à Bogota n'a fait aucun commentaire. Cependant, nous avons demandé au chef de poste de la CIA de se présenter pour informer nos services de renseignement. Il n'est pas certain que cela se produise réellement."
 CIA_LATAMb.12.d:0 "Assis à l'arrière d'une Chevrolet Caprice quelconque, cahotant sur les routes de campagne, une jeep à l'avant, Bob réfléchissait à ce qu'il allait entreprendre. Après ce qui lui sembla des semaines de recherches et d'enquêtes auprès d'agents et d'informateurs, le chef de la station de la CIA à Bogota lui avait confié une rencontre avec le chef du cartel de Medellin, nul autre que le tristement célèbre Pablo Escobar, dans l'une de ses villas de la campagne colombienne.\n\nIl était nerveux, mais savait que rien de grave ne se produirait probablement. Escobar et lui savaient déjà ce qui allait se passer, et le cartel ne lui ferait certainement rien, à moins de vouloir attirer une puissance de feu américaine massive et démanteler leur organisation.\n\nArrivé à la villa d'Escobar, il sortit de la voiture et fut aussitôt fouillé (à nouveau) par deux de ses lieutenants, tandis que quelques autres observaient la scène à distance, armés de fusils automatiques. Bob n'était pas armé, bien sûr, mais ils devaient vérifier encore et encore.\n\n« Bonsoir, Señor Escobar », dit Bob après avoir été fouillé et escorté jusqu'à la villa, où Pablo était assis avec quelques lieutenants et d'autres figures du Cartel.\n\n« Bienvenue dans la vraie Colombie… » Escobar tendit la main et marqua une pause.\n\n« C'est Bob, Señor Escobar. Ravie de pouvoir enfin vous rencontrer. Je suis sûre que vous savez de quoi il s'agit. » Ils se serrèrent la main.\n\n« Oui, Bob. Certains de mes lieutenants m'ont dit que votre CIA souhaitait étendre sa collaboration avec nous et contribuer à la lutte contre le trafic. Je suis intéressé, mais réticent ; comment pouvez-vous nous aider ? »\n\n« Eh bien, Señor Escobar, nous proposons de contribuer aux opérations de trafic du Cartel, principalement en le faisant transiter par Miami et la frontière mexicaine vers les États-Unis. De nombreuses villes américaines découvrent votre cocaïne, et c'est un marché important, notamment à Los Angeles. Les fonds que vous gagnerez serviront à la fois à soutenir votre cartel et le conflit en cours en Colombie, et à financer les Contras au Nicaragua, qui font la même chose.\n\n« Je vois. » Escobar marqua une pause, prenant un moment de réflexion avant de se verser deux verres d'aguardiente, une liqueur locale. « Il faudra que j'en discute davantage avec mes trafiquants, mais j'aime bien l'idée. Je pense que nous avons des idées et des objectifs similaires, et si votre CIA parvient à me débarrasser du gouvernement colombien, nous sommes prêts. »\n\n« Oui, je crois que nous pouvons y arriver. » Bob, voyant qu'Escobar faisait de même, prit un verre et le trinqua avec celui de Pablo, marquant ainsi l'accord conclu. « Plus d'argent pour la cause ! »"
 CIA_LATAMb.13.d:0 "OPÉRATION JUNGLE SNOW : PLAN OPÉRATIONNEL\nQuartier général, Commandement Sud des États-Unis\n\nVous trouverez ci-joint les ordres destinés aux unités subordonnées ou rattachées au Commandement Sud des États-Unis concernant les opérations en Colombie, ciblant spécifiquement les dirigeants du cartel dans le pays.\n\n1. Les 1er et 2e bataillons du 7e Groupe des forces spéciales des forces spéciales de l'armée américaine, basés à Fort Gulick, au Panama, doivent se déployer en Colombie, en particulier à Bogota et dans la ville de Medellín. Ils sont autorisés à mener des frappes contre les biens et les individus associés au cartel de Medellín, au cartel de Cali et à d'autres cartels en Colombie. Plus particulièrement, les unités susmentionnées sont autorisées et ont reçu l'ordre de cibler Pablo Escobar, le chef du cartel de Medellín, dans le cadre de leurs opérations.\n\n2. Des unités du 210e Bataillon d'aviation de combat de l'armée de terre américaine, basées à Fort Kobbe, au Panama, seront déployées en Colombie avec les 1er et 2e bataillons d'infanterie. Elles sont autorisées à fournir des services de transport, de frappe et d'interdiction aux unités terrestres au moyen d'hélicoptères UH-1 Huey et CH-47 Chinook.\n\n3. Des agents de la CIA, basés à [REDACTED], contribueront à la fourniture de renseignements et de soutien au ciblage aux unités du 7e Groupe de forces spéciales et du 210e bataillon d'aviation. Tous les ordres de ciblage doivent être autorisés individuellement par le commandant opérationnel, qui sera le commandant de la 193e Brigade d'infanterie (Panama).\n\nL'USSOUTHCOM maintiendra son état de préparation opérationnelle en cas d'escalade de la situation, attendra des rapports quotidiens du commandant opérationnel et bénéficiera de la plus grande coopération avec la CIA et les autres officiers de soutien au renseignement.\n\nSIGNÉ\nCommandant du Commandement Sud des États-Unis"
 CIA_LATAMb.14.d:0 "MANUEL NORIEGA ET LES RELATIONS AMÉRICAINES : LE POINT\nBureau Panama, Bureau d'analyse de l'Amérique latine, Direction du renseignement\nSECRET/NOFORN\n\nDepuis que les États-Unis ont maintenu leur soutien au dirigeant panaméen, le général Manuel Noriega, la situation a évolué et les services de renseignement américains pourraient reconsidérer l'utilité de Noriega pour maintenir l'influence américaine en Amérique centrale et latine.\n\nSi le général Noriega a grandement contribué à la politique de sécurité américaine en Amérique latine, son comportement constitue indéniablement un handicap pour l'influence américaine dans la région. En particulier, les liens possibles de Noriega avec le crime organisé, les cartels et le trafic de cocaïne constituent une source de préoccupation et d'évolution importantes pour les relations futures entre les États-Unis et le Panama.\n\nSelon des agents et des forces de l'ordre qui suivent les activités de Noriega, il est impliqué dans le trafic de cocaïne depuis le début de la décennie, utilisant des réseaux de transport secrets également utilisés par la CIA pour envoyer des fonds et des armes aux mouvements anticommunistes de la région. Le réseau de Noreiga est principalement basé à Miami, où il s'est ensuite étendu au reste des États-Unis. Le FBI et la DEA le confirment, mais ne sont pas en mesure de prendre des mesures punitives contre Noriega et son gouvernement.\n\nDe plus, la CIA confirme que des figures de l'opposition panaméenne, telles qu'Hugo Spadafora et le colonel Roberto Diaz Herrera, sont également au courant des opérations de trafic de drogue de Noriega et ont tenté de les révéler dans les médias panaméens. Le gouvernement de Noriega n'a pas apprécié cette situation, et Spadafora est sans nouvelles depuis plusieurs jours, ce qui laisse penser qu'il a peut-être été tué ou arrêté. Aucun des deux hommes n'a été considéré comme une menace pour l'État auparavant et ne sont pas de gauche politiquement ; en fait, tous deux ont servi sous le gouvernement de Torrijos.\n\nCe Bureau recommande par la présente une évaluation sérieuse de l'utilité de Noriega pour les intérêts américains en Amérique latine ; Si les allégations de trafic de drogue sont vraies, ce qui semble être confirmé, il est fortement encouragé que les États-Unis coupent leurs liens avec Noriega et envisagent de prendre des mesures punitives à l’encontre du Panama, notamment en gelant tous les colis d’aide, les livraisons d’armes, les transferts secrets, l’assistance et en mettant en œuvre des opérations de lutte contre la drogue jusqu’à ce que le régime puisse être stabilisé."
 CIA_LATAMb.15.d:0 "C'était un lundi matin ensoleillé dans le bureau ovale, lorsque le directeur de la CIA [GetCurrentCIADir] et le conseiller à la sécurité nationale [GetCurrentNatSecAdv] entrèrent dans la salle pour leur briefing quotidien. Ce jour-là, il s'agissait d'un briefing ordinaire, mais avec un nouveau point à l'ordre du jour : le général Manuel Noriega du Panama.\n\n« Bonjour, messieurs. J'espère que tout va bien à Langley ?» Le président [USA.GetLeader] leva les yeux en souriant.\n\n« Oui, monsieur, tout va bien. Voici votre briefing quotidien pour aujourd'hui.» Le conseiller à la sécurité nationale posa le PDB sur le bureau.\n\n« Super. Quel est le premier point à l'ordre du jour ? »\n\n« Panama, monsieur. La CIA a remis en question l'efficacité et l'utilité de maintenir le général Manuel Noriega dans notre sphère d'influence et de soutenir son régime. Il est soupçonné d'avoir mené des opérations de trafic de drogue au Panama et d'avoir fait transiter de la cocaïne entre la Colombie et Miami. Il a également persécuté d'anciens alliés qui ont tenté de démasquer ces opérations, et Langley s'inquiète des conséquences potentielles de cette situation. »\n\n« Je vois, que voulez-vous dire ? » Le Président hocha la tête, pensif.\n« Le Congrès pourrait en avoir vent, et ce n'est jamais bon signe. Nous risquons de perdre le soutien international ailleurs si nous ne réagissons pas rapidement. »\n\n« Qui se soucie du Congrès ? Je dis que nous devons maintenir Noriega dans le droit chemin. » Le Président avait passé les dernières minutes à lire le dossier qui se trouvait devant lui, qui soulignait justement l'aide de Noriega sur les questions de sécurité en Amérique latine.\n\n« Voyez ceci, Messieurs. Nous soutenons Noriega depuis des années, il a été très ami avec nous ; nous lui avons fourni, ainsi qu'à son armée, des armes d'une valeur de plusieurs millions de dollars dans leur lutte contre les forces communistes au nord du pays ; et, Monsieur le Directeur, depuis combien de temps ce trafic dure-t-il ?»\n\n« Depuis des années, Monsieur. Au moins depuis sa prise de fonction officielle.»\n\n« Alors pourquoi tout cela éclate-t-il maintenant ? Je ne vois aucune raison de couper le cordon maintenant. Cela ne ferait qu'aggraver notre situation en Amérique latine. C'est un atout.»\n\n« Oui, Monsieur.» répondirent les deux hommes. Le Directeur leva les yeux. « Monsieur, nous pouvons faire une déclaration confidentielle aux Panaméens par l'intermédiaire de leur armée ou de la CIA, pour les rassurer de notre soutien continu.»\n\nLe Président hocha la tête. « Oui, ça a l'air bien.» Il regarda autour de lui. « Quel est le prochain point à l'ordre du jour ? »"
 CIA_LATAMb.16.d:0 "Selon des rapports non officiels provenant de diplomates à Washington et de sources au sein de l'ambassade des États-Unis à Panama, les États-Unis continueront de soutenir le gouvernement de Manuel Noriega, malgré une opposition assez virulente qui remet en question son utilité pour la politique étrangère américaine, compte tenu de son passé de trafic de drogue et d'autres allégations.\n\nDe hauts responsables des services de renseignement américains se demandent depuis des semaines s'il convient de maintenir leur soutien à Noriega, notamment dans un contexte de conflits en Colombie et au Nicaragua. Notre gouvernement n'a pas encore réagi, même si la seule réponse publique devrait être l'optimisme et un soutien continu. Cependant, dans l'ombre, il est impératif que nous contactions les Américains et leur demandions d'expliquer leurs réticences."
 CIA_LATAMb.17.d:0 "C'était un lundi matin ensoleillé dans le bureau ovale, lorsque le directeur de la CIA [GetCurrentCIADir] et le conseiller à la sécurité nationale [GetCurrentNatSecAdv] entrèrent dans la salle pour leur briefing quotidien. Ce jour-là, il s'agissait d'un briefing ordinaire, mais avec un nouveau point à l'ordre du jour : le général Manuel Noriega du Panama.\n\n« Bonjour, messieurs. J'espère que tout va bien à Langley ?» Le président [USA.GetLeader] leva les yeux en souriant.\n\n« Oui, monsieur, tout va bien. Voici votre briefing quotidien pour aujourd'hui.» Le conseiller à la sécurité nationale posa le PDB sur le bureau.\n\n« Super. Quel est le premier point à l'ordre du jour ? »\n\nPanama, Monsieur. La CIA a reconsidéré l'efficacité et l'utilité de maintenir le général Manuel Noriega dans notre sphère d'influence et d'aider son régime. Il est soupçonné d'avoir mené des opérations de trafic de drogue au Panama et d'avoir transporté de la cocaïne entre la Colombie et Miami. Il a également persécuté d'anciens alliés qui ont tenté de démasquer ces opérations, et Langley s'inquiète des conséquences possibles de cette situation.\n\nJe vois, que voulez-vous dire ? Le Président hocha la tête, pensif.\n\nLe Congrès pourrait en avoir vent, et ce n'est jamais bon signe. Nous risquons de perdre le soutien international ailleurs si nous ne réagissons pas rapidement.\n\n« Très bien. J'en suis convaincu. Il est temps de le libérer de la liste de paie. Appelez le secrétaire d'État, je veux que l'ambassadeur à Panama City me téléphone aussi rapidement. Appelez le NSC. Directeur, je veux que vous lanciez des opérations à Langley pour mettre fin à l'aide et retirer nos agents, ceux qui l'assistent, de là. Il faut agir vite, faire comme si de rien n'était.»\n\n« Oui, Monsieur le Président.» Le directeur de la CIA et le conseiller à la sécurité nationale hochèrent la tête et allèrent passer quelques appels. La journée s'annonçait longue et la nuit encore plus longue."
 CIA_LATAMb.18.d:0 "La stupeur a gagné Panama City aujourd'hui lorsque des sources confidentielles à l'ambassade des États-Unis ont annoncé que les États-Unis retiraient leur soutien au gouvernement de Manuel Noriega. Selon de hauts responsables diplomatiques et du renseignement, Washington s'inquiétait de plus en plus de l'utilité de Noriega pour la politique étrangère américaine, de son comportement erratique et des allégations d'implication dans le trafic de drogue entre l'Amérique du Sud et les États-Unis.\n\nNoriega lui-même n'a pas fait de déclaration, n'ayant pas encore été informé de l'affaire ; il est probable qu'il ne soit pas satisfait. De hauts responsables diplomatiques et de la défense à Panama City, déjà informés, ont indiqué qu'ils envisageaient d'accélérer le retrait progressif des troupes américaines de la zone du canal, ainsi que d'autres mesures punitives, comme la déclaration de « persona non grata » des fonctionnaires de l'ambassade et leur expulsion forcée. La réponse que nous devrions apporter n'est pas claire, mais elle n'est pas satisfaisante."
 CIA_LATAMb.19.d:0 "La nuit tombait lorsqu'un petit convoi discret de fourgonnettes, de poids lourds et de berlines approchait du poste-frontière du pont international de Paso del Norte, reliant El Paso, au Texas, à Ciudad Juarez, au Mexique. La circulation était fluide et, lorsque la voiture de tête, une Ford Granada grise banalisée, s'arrêta pour inspection, ils remarquèrent une présence policière légèrement plus importante que d'habitude ; non pas du côté américain, mais du côté mexicain. Outre les douaniers et les agents des frontières habituels, des agents fédéraux étaient postés en faction.\n\nLe convoi passa sans encombre, sans problème, même avec les camions marqués « Arizona Helicopters Inc. » et « Pacific Corporation ». Les gardes-frontières ne prirent pas la peine d'inspecter la cargaison, et ils n'auraient pas apprécié ce qu'ils y découvrirent. Des centaines de fusils automatiques, des milliers de cartouches, des lance-roquettes antichars M72, quelques Stingers ; il faudrait former les hommes à ce genre de choses, mais pas de problème. Les plus gros camions contenaient quelques hélicoptères utilitaires, entièrement démontés, avec leurs supports de mitrailleuses prêts à l'action. L'un des agents avait signalé la présence d'un Cessna quelque part, apparemment caché.\n\nAprès quelques heures de route au sud de Ciudad Juarez, le convoi approchait de sa destination : l'une des bases centrales du Cartel de Guadalajara, dans l'État de Chihuahua. C'est là qu'ils effectueraient l'entraînement, puis le Cartel distribuerait le matériel sur tout son territoire.\n\nL'agent descendit du véhicule de tête et alluma une cigarette en regardant passer les camions qui menaient au parking principal du complexe. Ce serait une longue période de déploiement, et tous ses agents le savaient. Le Cartel serait entraîné, car il était important pour le gouvernement américain, mais sa coopération était une autre histoire. Après tout, ce sont des criminels aux yeux des gens ordinaires. Mais personne ici n'était une personne normale."
 CIA_LATAMb.20.d:0 "Des rapports de la Direction de la sécurité fédérale et du Secrétariat de l'Intérieur semblent indiquer que d'importants chefs de cartels au Mexique, notamment ceux de Guadalajara et du Golfe, auraient reçu de nouvelles armes et du matériel de protection de fabrication et de modèle américains. Des agents du DFS ont surveillé les propriétés du cartel avec l'aide d'unités de l'armée et de la police fédérale mexicaines et ont constaté que du matériel neuf de fabrication américaine, apparemment reçu d'une société américaine appelée « Arizona Helicopters Inc. », avait été livré aux unités du cartel ; il s'agissait notamment d'armes légères, de mitrailleuses lourdes, de camionnettes blindées et de quelques anciens modèles d'hélicoptères UH-1 Huey et d'avions Cessna.\n\nLe président [MEX.GetLeader] serait furieux de cette situation, notamment compte tenu des relations contrastées entre le Mexique et les États-Unis. Certains hauts responsables du gouvernement s'étonnent de la protection des cartels, notamment contre les opérations de répression menées par le Mexique, soi-disant allié des États-Unis. La raison de cette situation reste obscure et l'ambassade des États-Unis à Mexico n'a pu répondre à aucune question à ce sujet. Le temps nous le dira."
 CIA_LATAMb.21.d:0 "Alors que le groupe de travail conjoint FBI-DEA se réunissait, par une matinée ensoleillée à El Paso, au Texas, l'air extrêmement sérieux. Ce n'était pas la première réunion ; il s'agissait simplement d'un point de situation régulier pour les deux agences.\n\nLes agents de la DEA ont commencé par leur présentation. « Notre enquête sur les activités du cartel local a donné des résultats significatifs. Le lien transfrontalier entre El Paso et Ciudad Juarez est assez important ; bien que les transferts de drogue du Mexique vers le Texas soient de faible ampleur ; généralement de petites quantités, quelques kilos ou deux, via des véhicules personnels. La DEA et l'ELPD n'ont pas détecté de grandes quantités de drogue de plus de 2,2 kg. L'activité du cartel à El Paso a été relativement limitée ; nous savons que des membres, de nationalité américaine, opèrent du côté américain de la frontière comme chefs et intermédiaires régionaux ; cependant, nous n'avons pas encore réussi à les connecter.»\n\nLes agents du FBI ont acquiescé. « Très bien. Nous savons que de grandes quantités de cocaïne proviennent des villes frontalières, notamment d'El Paso, d'Albuquerque, de San Diego et de Laredo. Le FBI a identifié deux trafiquants à Los Angeles qui reçoivent d'importantes cargaisons de cocaïne des cartels colombiens, mais nous ne savons pas exactement où. Nous pourrions envisager de déposer des mandats fédéraux pour écoutes et autres opérations de surveillance.»\n\nAvant qu'il ne puisse continuer, une secrétaire entra. « Agent spécial, on vous appelle.»\n\nIl sortit de la salle de conférence et se dirigea vers son bureau pour prendre l'appel.\n« Allô ?»\n« Est-ce l'agent spécial Jack Smith ?»\n« Oui, qui est-ce ? »\n\n« Ce n'est pas important. Sachez simplement que nous, à Langley, sommes au courant de votre enquête sur les cartels colombiens. Nous connaissons les juges à qui vous devez vous adresser. Nous savons sur qui vous enquêtez, et cela doit cesser immédiatement. Continuez, et vous apprendrez à vos dépens qu'il ne faut pas s'en prendre aux cartels. »\nClic."
 CIA_LATAMb.22.d:0 "Sous la pluie de New York, Vincent Gigante contemplait les gratte-ciel de Manhattan. Un autre homme était assis dans son bureau ; d'origine italienne, certes, mais pas « d'ici ». Il ressemblait à un de ces agents fédéraux corrompus, et se comportait comme tel. Chef de la famille Genovese, l'une des cinq grandes familles mafieuses de New York, cet homme lui avait rendu visite avec une proposition : la grande tragédie du Nicaragua et un moyen pour sa famille d'en tirer profit. Il y avait sûrement beaucoup d'émigrés nicaraguayens à New York, non ?\n\nÀ mille kilomètres au sud, sous le soleil de Miami, en Floride, José Miguel Battle Sr. avait été approché par trois hommes similaires. Ses collègues, tous anciens soldats de la Brigade 2506, ayant survécu à l'invasion avortée de la Baie des Cochons, étaient tous ici pour la même raison. La Corporation, comme on l'appelait à Miami, la Mafia cubaine, comme on l'appelait aussi, pouvait être très solidaire de ce groupe anticommuniste nicaraguayen, les Contras. Du moins, c'est ce qu'ils prétendaient.\n\nToujours dans un endroit réputé pour son ensoleillement, la Californie du Sud, des membres de la mafia mexicaine étaient contactés. Certains étaient en prison, d'autres non, mais peu importait. Les hommes en noir de Langley avaient leurs méthodes. La Californie était un excellent point de transbordement pour la cocaïne, tout comme Miami, et la mafia mexicaine exerçait une grande influence là-bas et de l'autre côté de la frontière, à Tijuana.\n\nLes hommes de Langley avaient tous un objectif commun : les organisations criminelles avaient une grande influence aux États-Unis, notamment dans les zones urbaines où le trafic de drogue et la criminalité étaient importants. Ils devaient sûrement avoir l'argent, les armes et les ressources nécessaires pour les envoyer à leurs frères d'armes au Nicaragua, n'est-ce pas ?"
 CIA_LATAMb.23.d:0 "De nouvelles nouvelles nous parviennent des agents de la CIA qui nous assistent ; Langley aurait apparemment chargé des agents de rallier le soutien des groupes criminels organisés américains à la cause des Contras. Sans plus de précisions, la CIA nous a informés que la communauté criminelle cubaine exilée à Miami, centrée autour de José Miguel Battle Sr, lui-même vétéran de la Baie des Cochons, nous a apporté son soutien, tout comme la mafia mexicaine, présente à la frontière américano-mexicaine et en Californie du Sud. De plus, deux des cinq grandes familles mafieuses de New York ont ​​également apporté leur soutien à notre cause et sont prêtes à transférer des fonds, des membres de la mafia et des armes aux Contras pour soutenir notre mission.\n\nAu sein de notre organisation, nombreux sont ceux qui se réjouissent de cette évolution, notamment du soutien de la mafia cubaine. D'autres semblent réticents, s'inquiétant du manque de légitimité de ces groupes criminels par rapport à un État souverain comme les États-Unis."
 CIA_LATAMc.0.d:0 "C'était une matinée nuageuse et brumeuse dans le Bureau ovale alors que le président [USA.GetLeader] était assis, observant son secrétaire d'État [GetCurrentSecState], le directeur de la CIA [GetCurrentCIADir], le conseiller à la sécurité nationale [GetCurrentNatSecAdv] et leurs assistants affairés entrer dans la pièce, des dossiers et des papiers semblant voler dans tous les sens. Le président attendit que le chaos se calme avant d'ouvrir la séance. « Messieurs, pourquoi sommes-nous ici aujourd'hui ? »  \n\nLe secrétaire d'État prit la parole. « Eh bien, Monsieur le Président, le Département d'État a eu plusieurs réunions avec des responsables de la CIA et de la Défense concernant l'avenir de la politique des États-Unis en Amérique centrale et du Sud. Dans le passé, les États-Unis ont fait fausse route dans cette région, et nous cherchons à changer cela. »  \n\n« Allez-y, Monsieur le Secrétaire. Je suppose que cela signifie une stratégie plus pacifique, comme j'en ai parlé dans mes positions de politique étrangère. »  \n\n« Oui, Monsieur. Nous pensons que les États-Unis ont, sans raison, permis aux régimes autoritaires de droite en Amérique centrale et du Sud de se renforcer dans le cadre d'une tentative mal orientée de combattre la propagation du communisme dans la région. Bien que cela ait été marginalement efficace, cela a eu pour effet secondaire malheureux de créer des États militarisés contrôlés par des officiers ayant des ambitions personnelles, créant ainsi encore plus d’instabilité. »  \n\nLe directeur de la CIA intervint. « Sans parler, Monsieur le Président, du défi majeur du trafic de drogue auquel cette région est confrontée, quelque chose que notre agence n'a jamais vu à une telle échelle. De grandes cargaisons de cocaïne, d’héroïne et de marijuana circulent vers le nord depuis la Colombie, expédiées par des cartels, souvent soutenus par des gouvernements de droite. Je sais que votre administration a fait campagne pour mettre fin à la guerre contre les drogues, mais c'est un problème international dans lequel nous devons intervenir. »  \n\n« Assurer l'autodétermination et l'existence d'un État de droit effectif en Amérique centrale est crucial, Monsieur le Président. Les sociétés démocratiques assurent une plus grande responsabilité envers toutes les parties concernées. En particulier, nous aimerions étendre les initiatives de paix au Nicaragua, ainsi que déterminer la réduction des programmes d'aide en Amérique centrale et réexaminer notre coopération avec le général Noriega au Panama. »  \n\n« Excellent, messieurs. Je vous fais confiance pour accomplir cela avec le plus grand professionnalisme et me faire rapporter tous les changements. Je m'attends à lire au moins une fois par semaine un point sur cette question. »  \n\n« Merci, Monsieur le Président. » Les hommes et leurs assistants hochèrent la tête en signe d'approbation, avant de quitter la pièce, juste au moment où le soleil commença à émerger des nuages, éclairant la pièce."
 CIA_LATAMc.1.d:0 "C'était une nuit chaude dans l'État d'Oaxaca tandis que la jeep roulait dans la rue poussiéreuse de Tehauntepec. Le conducteur savait exactement où il allait, mais le passager, Ruben Ocampo, n'en était pas si sûr. Tout ce qu'il savait, c'est qu'il devait rencontrer des responsables locaux, comme le précisait son dossier, chez eux ce soir.\n\nOcampo regarda autour de lui, remarquant le quartier qu'il traversait. Rien d'extraordinaire, en périphérie de la ville, malheureusement ce à quoi on s'attendrait dans ce quartier, avec ces gens-là. C'était dommage ce qu'on leur avait fait subir, mais c'était pour ça qu'il était là.\n\nDescendu de la voiture, le « journaliste d'investigation » descendit l'allée, regardant la jeep s'éloigner. Il tenait un carnet à la main, l'air normal comme toujours. On frappa à la porte et on le fit entrer dans la maison. Il s'assit dans la salle à manger, où trois hommes et une femme étaient assis, vêtus de la tenue traditionnelle tehuana. Ces personnes étaient des indigènes zapotèques, vivant pour la plupart dans la région, mais ils étaient d'importants organisateurs politiques, quoique presque clandestins en raison de l'influence du PRI.\n\nCe qui fut dit n'était pas nécessaire, mais Ocampo les interrogea sur leur militantisme et leur organisation, et sur la façon dont les autorités locales les avaient ignorés. Il leur demanda ce qu'ils pensaient des cartels dans leur région, de la montée du mouvement zapatiste, et quelle était leur position et celle de leur organisation. Ocampo sourit, hocha la tête et plaisanta ; pour autant qu'ils sachent, il était journaliste d'investigation à La Prensa, un journal de Mexico. Leur conversation fut brève, mais productive.\n\nAlors qu'on raccompagnait Ocampo hors de la maison, vers son chauffeur et Mexico, il relut ses notes. Ce serait un long rapport à rédiger, un rapport que, espérons-le, son chef de poste à Mexico apprécierait. Les groupes indigènes semblaient être anti-gouvernementaux, anti-cartels et pro-communistes. Intéressant, pensa-t-il."
 CIA_LATAMc.2.d:0 "RÉFORMES POLITIQUES EN AMÉRIQUE CENTRALE\nBureau d'analyse de l'Amérique latine, Direction du renseignement\nSECRET/NOFORN\n\nLa région géopolitique connue sous le nom d'Amérique centrale (qui comprend le Guatemala, le Honduras, le Salvador, le Nicaragua et le Panama) est en proie à des crises politiques constantes depuis le début de l'après-guerre. Des tentatives de réforme politique ont été proposées et certaines mises en œuvre, mais la plupart ont échoué en raison de l'ingérence des États-Unis ou du communisme. Par conséquent, ce Bureau propose les réformes politiques générales suivantes afin d'améliorer le régime démocratique et le niveau de vie dans la région :\n\n1. Réforme de l'exécutif, sous la forme d'une possible limitation des pouvoirs présidentiels, notamment ceux de déclarer la guerre, de déclarer l'état d'urgence et de commander des unités militaires. Cela nécessiterait très probablement une révision constitutionnelle dans la plupart des États d'Amérique centrale, ce qui nécessiterait de convaincre le pouvoir législatif national.\n\n2. Réforme judiciaire et juridique, sous la forme d'un renforcement des Cours suprêmes et des pouvoirs judiciaires nationaux. Cela peut être accompli en instaurant un contrôle juridictionnel des actes constitutionnels et législatifs, destiné à équilibrer les actions exécutives et législatives dans ces pays.\n\n3. Enfin, une réforme militaire, consistant à introduire de nouveaux mécanismes de contrôle contre les coups d'État militaires, tels que la nomination de civils à la tête de l'armée, l'interdiction pour les officiers militaires de se présenter aux élections et la restriction de l'aide aux armées d'Amérique centrale qui ne respectent pas les réglementations américaines en matière d'application de la loi.\n\nCe Bureau, en collaboration avec les ambassades américaines concernées et le Département d'État, estime que l'instauration de ces réformes garantira un style de gouvernance adéquat et l'autodétermination de cette région, sans pouvoirs présidentiels excessifs ni harcèlement de la part des forces communistes."
 CIA_LATAMc.3.d:0 "Une campagne conjointe du Département d'État américain et de la CIA a été lancée dans notre région, encourageant un vaste programme de réformes politiques dans nos pays. Visiblement dans le but d'orienter les États d'Amérique centrale vers un modèle de gouvernement américain fondé sur la démocratie représentative et le républicanisme, l'ambassade des États-Unis a préconisé une réforme des pouvoirs exécutif et judiciaire, ainsi que de l'armée, notamment en limitant le pouvoir du président de déclarer l'état d'urgence et de combattre les insurrections, et en prévoyant d'éventuels mécanismes de contrôle judiciaire. Enfin, les États-Unis ont proposé des réformes militaires, qui ont suscité la colère de certains membres de notre gouvernement, et qui visent à « empêcher de nouveaux coups d'État » et qui, en réalité, affaibliront l'influence et les capacités des forces armées à l'avenir si nous les acceptons.\n\nLa réponse de notre gouvernement à cette situation reste floue. Certains affirment que des réformes sont nécessaires pour démocratiser davantage le pays ; d'autres affirment qu'elles renforceraient l'influence des radicaux des deux bords. On craint également, à juste titre, que ces réformes militaires n'entraînent une diminution des capacités. Nombreux sont ceux qui affirment que les réformes, notamment celles dictées par les États-Unis, ne sont pas nécessaires, mais peut-être qu'accéder aux exigences de Washington s'avérera bénéfique à long terme. Comment devrions-nous aller de l'avant ?"
 CIA_LATAMc.4.d:0 "Nos ambassades en Amérique centrale nous ont informés que les gouvernements du Salvador, du Nicaragua, du Honduras, du Guatemala et du Panama ont tous accepté, en principe, les réformes politiques suggérées par les chefs de poste, les agents de la CIA et les responsables du Département d'État.\n\nCertaines des réformes politiques proposées par un groupe de travail conjoint de conseillers politiques de la CIA et des États comprennent des réformes de l'exécutif visant à limiter les excès présidentiels, une réforme judiciaire avec l'introduction d'un contrôle juridictionnel et de systèmes juridiques à l'américaine, et une réforme militaire avec l'instauration d'un contrôle civil de l'armée, l'élimination de la corruption et la menace de mettre fin à l'aide du MAP à ces pays.\n\nLangley et Foggy Bottom sont tous deux plutôt surpris que ces pays aient accepté si facilement de telles réformes, mais ils s'efforcent immédiatement de définir les modalités d'application afin de garantir que toutes les parties adhèrent aux réformes promises."
 CIA_LATAMc.5.d:0 "Malheureusement, nos ambassades en Amérique centrale nous ont appris que les gouvernements du Salvador, du Nicaragua, du Honduras, du Guatemala et du Panama ont tous rejeté les propositions de réformes politiques avancées par les chefs de poste, les agents de la CIA et les responsables du Département d'État.\n\nCertaines de ces réformes politiques vouées à l'échec, notamment les propositions visant à limiter les excès de pouvoir présidentiels, à introduire un contrôle juridictionnel et un système juridique américain, et à instaurer un contrôle civil de l'armée, ont toutes été rejetées catégoriquement par chaque gouvernement, accusé de « nouvelles tentatives d'impérialisme de Washington dans nos affaires intérieures ».\n\nLangley et Foggy Bottom sont, à juste titre, furieux de cette évolution, et notamment de la réputation qui en découlera une fois que la presse internationale en aura vent. Des plans de limitation des dégâts sont en place, mais ni l'agence, ni le président ne s'en réjouiront."
 CIA_LATAMc.6.d:0 "GÉRER LES IDÉOLOGUES COMMUNISTES EN AMÉRIQUE CENTRALE\nBureau d'analyse latino-américaine, Direction du renseignement\nSECRET/NOFORN\n\nDans le cadre de notre nouveau plan visant à promouvoir les idéaux de démocratie et d'autodétermination en Amérique latine, le problème des partis et des idéologues communistes dans tous ces États constitue un obstacle à notre développement. Bien que les États-Unis demeurent fondamentalement opposés au communisme, nous ne pouvons interférer dans les processus démocratiques, en particulier ceux impliquant la gauche. Les idéologues, cependant, représentent une menace fondamentale pour l'influence et l'autodétermination américaines et doivent être mis à l'écart.\n\n1. La coercition pourrait être utilisée pour faire chanter ou extorquer les idéologues communistes afin qu'ils renoncent à leur idéologie ou adoptent une social-démocratie moins radicale politiquement que le communisme.\n\n2. Les paiements en devises et autres allocations de coût de la vie pourraient également être envisagés comme moyen de mettre à l'écart les idéologues et les responsables des partis communistes en Amérique latine, bien que cette stratégie ne soit pas recommandée, principalement car elle accroîtrait la dépendance à de nouveaux paiements en espèces. \n\n3. Enfin, flatter l'ego des idéologues et des dirigeants peut également contribuer à les marginaliser. Ignorer ou combattre directement les dirigeants communistes ne sera pas efficace, mais les marginaliser efficacement tout en leur donnant le sentiment d'avoir réussi permettra de les maintenir sous contrôle pendant que nous mettons en œuvre notre plan.\n\nCe Bureau estime qu'une marginalisation discrète des communistes permettra de préserver un semblant de valeurs démocratiques et d'autodétermination sans s'impliquer ouvertement dans la région et sans affecter les autres partis de gauche."
 CIA_LATAMc.7.d:0 "Messieurs,\n\nLes États-Unis ont apprécié votre travail et votre coopération jusqu'à présent pour empêcher la propagation du communisme en Amérique latine. Cependant, il est temps pour nous de mettre fin à cette relation.\n\nVos activités liées au trafic de marijuana et de cocaïne préoccupent vivement l'administration actuelle. Les administrations et présidents précédents ont peut-être toléré ce type de comportement, mais il est dans l'intérêt national et international des États-Unis de ne pas collaborer avec des éléments du crime organisé, en particulier ceux d'autres États souverains, et plus particulièrement ceux responsables du trafic de stupéfiants dangereux.\n\nCette lettre constitue la dernière notification du gouvernement des États-Unis : nous ne poursuivrons pas notre coopération avec votre entreprise criminelle et soutiendrons avec enthousiasme toute tentative des forces de l'ordre visant à mettre fin à vos opérations.\n\nCordialement,\nPrésident [USA.GetLeader]\nDirecteur de la CIA [GetCurrentCIADir]"
 CIA_LATAMc.8.d:0 "C'était une réunion ordinaire à Langley, et lorsque le DDO et ses assistants entrèrent dans la salle de conférence, il aperçut le chef du Bureau des opérations latino-américaines assis avec son équipe, examinant des rapports, contournant les informations et fronçant les sourcils.\n\n« Je suppose que c'est à cause de Noriega, n'est-ce pas ? » suggéra le DDO. « Oui, monsieur. L'officier de quart pour l'Amérique latine a signalé hier soir qu'une unité spéciale conjointe de la police de Miami et de la DEA avait saisi un cargo battant pavillon panaméen avec des centaines de kilos de crack cachés à bord. »\n\n« Merde. » Le DDO se prit la tête dans les mains.\n\n« Oui, monsieur. Noriega a nié toute responsabilité, mais nous savons qu'il l'a fait, il ne fait même plus attention. » L'officier des opérations haussa les épaules.\n\nLe DDO se redressa. « Bon. C'est fait. On y met fin. » Il désigna les deux hommes assis de l'autre côté de la table. « Restez ici. Je téléphone au directeur et au conseiller à la sécurité nationale. On coupe la communication à Noriega. Ça suffit. »\n\nEn quelques minutes, l'officier des opérations resta silencieux, stupéfait, tandis que le directeur de la CIA [GetCurrentCIADir] et le conseiller à la sécurité nationale [GetCurrentNatSecAdv] intervenaient. Les deux autres hommes acquiescèrent et un appel fut passé au président via le DCI. L'officier des opérations et son adjoint attendirent un ordre. Il était sûr qu'il faudrait aussi appeler le chef de station, mais la situation allait très vite, pensa-t-il."
 CIA_LATAMc.9.d:0 "Le choc et la confusion règnent aujourd'hui au Palacio de Las Garzas, lorsque l'ambassadeur des États-Unis au Panama a annoncé la révocation de toute aide américaine à ce pays. Préoccupés par les inquiétudes de longue date concernant la campagne de trafic de drogue du président Noreiga, ainsi que son bilan en matière de droits humains, les États-Unis en ont assez et ont suspendu toute aide politique, économique et militaire.\n\nNoriega s'en prend violemment à la CIA américaine, accusant celle-ci d'ingérence dans les affaires panaméennes et accusant l'administration actuelle de la Maison Blanche de perdre un allié supplémentaire. Des sources américaines, notamment l'ambassade à Panama City et Foggy Bottom, ne sont pas d'accord."
 CIA_LATAMc.10.d:0 "Le groupe de travail conjoint FBI-DEA d'El Paso a tenu une réunion qui s'annonçait probablement brève, improductive et inutile. Ce groupe de travail avait été créé pour mutualiser les ressources et contribuer à la lutte contre le trafic de drogue dans la région d'El Paso-Juarez, mais il avait jusqu'ici été un échec. L'agent spécial du FBI Smith était au bord du gouffre, entravé par des inconnus, des problèmes de juridiction et des piles et des piles de documents mystérieux.\n\n« Bonjour, messieurs. » Il fit un signe de tête las aux agents de la DEA qui entraient dans la salle de conférence, qui lui rendirent leur salut et s'assirent. Ils étaient tous sortis la nuit dernière pour inspecter les lieux, sur une piste, mais n'avaient rien trouvé. « Votre bureau a-t-il eu d'autres nouvelles ? »\n\nSmith secoua la tête. « Non. Les trafiquants parviennent à traverser la frontière sans être détectés. Nous pensons qu'ils sont aidés par quelqu'un, mais nous ne savons pas qui. C'est terrible.» Il fut interrompu par l'irruption d'une secrétaire. « Jack, appelez-moi. »\n\nIl sortit, s'attendant à quelque chose, n'importe quoi. « Allô ? »\n« Nous aimerions vous aider dans votre affaire de drogue à El Paso, agent Smith. »\n« À qui je parle ? »\n\n« Ce n'est pas important. Sachez simplement que Langley veut aider nos braves gars du FBI. On ne fait pas souvent ce genre de faveurs, alors prenez ce que vous pouvez. Votre bureau recevra un fax plus tard avec des photos et des index de documents. Un coursier passera plus tard avec des cartons de documents physiques. Vos supérieurs reçoivent un appel similaire en ce moment. Ne vous inquiétez pas pour eux. »\n\n« Quoi ? Langley ? C'est la putain de CIA ? »\n\nClic."
 CIA_LATAMc.11.d:0 "COMPROMIS AVEC LE NICARAGUA ?\nBureau d'analyse latino-américaine, Direction du renseignement ; Ambassade des États-Unis, Managua\nSECRET/NOFORN\n\nAprès des années de soutien aux forces anticommunistes « Contra » au Nicaragua, actuellement dirigé par un gouvernement sandiniste marxiste connu sous le nom de FSLN, les États-Unis pourraient désormais se trouver face à une nouvelle occasion d'inverser la tendance du conflit. Au lieu de soutenir continuellement les Contras, forçant ainsi un conflit gelé qui aboutirait à une impasse, ce Bureau recommande un compromis avec le régime sandiniste afin d'assurer la parité entre les deux parties et de mettre fin au conflit.\n\n1. Un cessez-le-feu immédiat et la fin des hostilités en attendant le début des négociations. Les deux parties s'efforceront d'empêcher les Contras de commettre des violences ou d'attaquer les forces sandinistes.\n\n2. La formation d'un gouvernement de coalition temporaire, composé à parts égales de sandinistes (FSLN), de contras et de partis démocratiques. Cela permettra une structure de gouvernement stable et le maintien des cessez-le-feu, tandis que de nouvelles réformes démocratiques seront mises en place.\n\n3. Une fois le gouvernement de coalition formé, des élections auront lieu à une date convenue. Ces élections devront être observées et contrôlées par des observateurs internationaux, provenant des États-Unis, d'autres pays d'Amérique centrale, ainsi que des équipes des Nations Unies et de l'Organisation des États américains (OEA), afin de garantir qu'aucune des parties ne truque les élections ni ne contraint la population à des élections inéquitables.\n\n4. Enfin, une convention constitutionnelle sera convoquée avec la coopération des sandinistes et des contras afin d'élaborer une nouvelle constitution pluraliste, multipartite et démocratique, destinée à garantir et à consacrer un gouvernement plus permanent et démocratique, ainsi que la coopération (ou la concurrence amicale) des contras et des sandinistes. De nouvelles réformes devraient accélérer la démobilisation, la réforme militaire et d'autres changements visant à mettre fin à de nouvelles flambées de violence dans le pays."
 CIA_LATAMc.12.d:0 "L'ambassadeur des États-Unis au Nicaragua s'est rendu au bureau du président nicaraguayen [NIC.GetLeader] avec un compromis dans le cadre de nos efforts pour écraser les rebelles anticommunistes Contras soutenus par les États-Unis.\n\nLes Américains, vraisemblablement pour tenter de se sortir de leur guerre par procuration contre nous, ont proposé un cessez-le-feu, la formation d'un gouvernement de coalition entre notre FSLN et les rebelles Contras, la tenue d'élections libres et équitables, et une refonte constitutionnelle garantissant la pluralité et le multipartisme.\n\nLes membres de notre gouvernement ont eu des réactions mitigées face à cette évolution. Depuis le départ de l'ambassadeur, plusieurs ministres ont exprimé leur soutien ou leur mécontentement à l'égard de l'accord. Certains pensent que ce serait une bonne idée pour mettre fin au conflit et peut-être améliorer la perception du régime par les États-Unis ; mais beaucoup d'autres, idéologiquement engagés, y sont restés opposés, convaincus que l'accord n'est pas bénéfique pour le Nicaragua et que se soumettre à l'hégémonie américaine n'est pas la solution ; il faut plutôt poursuivre l'écrasement des Contras.\n\nC'est une question difficile et nuancée, mais le président souhaite répondre rapidement à Washington. Comment devrions-nous réagir ?"
 CIA_LATAMc.13.d:0 "Des nouvelles surprenantes nous sont parvenues de notre ambassade à Managua : le gouvernement du Nicaragua, dirigé par le FSLN marxiste, également connu sous le nom de sandinistes, a accepté notre proposition de compromis pour régler le conflit qui l’oppose aux groupes de guérilla anticommunistes Contras soutenus par les États-Unis.\n\nNotre proposition, qui prévoyait un cessez-le-feu, la formation d’un gouvernement de coalition, une nouvelle constitution et des élections libres et surveillées, a été acceptée à contrecœur par les sandinistes à Managua aujourd’hui. Un porte-parole du gouvernement a déclaré que « des concessions sont nécessaires pour assurer à nouveau la paix et la stabilité au Nicaragua ».\n\nFoggy Bottom et Langley mettent en œuvre un programme en deux volets pour lancer le plan de paix : la CIA contacte les Contras afin d’instaurer un cessez-le-feu entre les deux parties, et le Département d’État, depuis l’ambassade, maintient les contacts avec le gouvernement sandiniste et s’efforce d’obtenir le soutien international, via l’ONU et l’OEA, pour la mise en œuvre du plan de paix."
 CIA_LATAMc.14.d:0 "De mauvaises nouvelles nous sont parvenues de notre ambassade à Managua : le gouvernement du Nicaragua, dominé par le FSLN marxiste, également connu sous le nom de sandinistes, a rejeté notre proposition de compromis pour régler le conflit nicaraguayen qui l’oppose aux Contras anticommunistes soutenus par les États-Unis.\n\nNotre proposition, qui prévoyait un cessez-le-feu, un gouvernement de coalition, une nouvelle constitution et des élections libres, a été catégoriquement rejetée par les sandinistes, la qualifiant de « nouvelle tentative d’hégémonie et d’impérialisme américains dans nos affaires intérieures » et d’« affaiblissement de la sécurité de l’État nicaraguayen par l’introduction d’éléments subversifs et terroristes au sein du gouvernement ».\n\nFoggy Bottom et Langley sont furieux de ces événements, mais, constatant l’échec des négociations pacifiques, ils vont sans doute redoubler d’efforts pour soutenir et armer les Contras afin de garantir une victoire militaire."
 CIA_LATAMc.15.d:0 "Des nouvelles surprenantes sont arrivées d'Amérique centrale : le gouvernement nicaraguayen, dirigé par le Front sandiniste de libération nationale (FSLN), un parti marxiste, a annoncé sa réconciliation avec le conflit nicaraguayen en cours. Le FSLN, acceptant à contrecœur un cessez-le-feu et un accord de paix négociés par les États-Unis, s'est engagé à former un gouvernement de coalition avec les Contras, la guérilla anticommuniste soutenue par Washington, ainsi qu'avec d'autres partis démocratiques.\n\nLe plan de paix, approuvé par l'Organisation des États américains et les Nations unies, comprend un cessez-le-feu déjà appliqué et, outre la formation d'un gouvernement de coalition, des élections libres et équitables avec surveillance, ainsi qu'une nouvelle constitution garantissant la démocratie multipartite et le pluralisme. De nombreux pays d'Amérique centrale, ainsi que la communauté internationale, saluent cette avancée comme la fin d'un nouveau conflit par procuration de la Guerre froide."
 CIA_LATAMc.16.d:0 "AVENIR DE LA DISTRIBUTION DE L'AIDE À L'AMÉRIQUE CENTRALE\nBureau d'analyse latino-américaine, Direction du renseignement ; Bureau des opérations latino-américaines, Direction des opérations.\nSECRET/NOFORN\n\nDirecteur,\n\nIl a été porté à notre connaissance, tant à la Direction des opérations qu'au Service du renseignement, que les régimes d'Amérique centrale abusent considérablement de leur pouvoir et de leur influence, soutenus par notre agence et les États-Unis en général, pour commettre de graves violations des droits humains et déclencher des conflits dans la région.\n\n1. L'aide militaire aux régimes d'Amérique centrale, notamment au Honduras, au Salvador et au Guatemala, destinée à renforcer leurs services de sécurité, a été détournée, selon le Bureau d'analyse latino-américaine, au profit d'opérations anti-insurrectionnelles internes, notamment des exécutions extrajudiciaires, des passages à tabac et la destruction de biens civils. Les principaux dirigeants militaires des États concernés n'ont guère rendu de comptes.\n\n2. L'aide économique aux régimes d'Amérique centrale, destinée à renforcer leurs capacités agricoles et industrielles, ainsi qu'à améliorer les infrastructures et les systèmes de communication, a été massivement détournée par chacun des gouvernements ; elle a été détournée vers les caisses de hauts fonctionnaires, utilisée comme pots-de-vin ou versée au budget de l'armée et d'autres services de sécurité. Les États-Unis ne mettent pas en œuvre les réformes économiques, ni les initiatives de construction.\n\n3. L'aide secrète, sous forme d'agents et d'assistance opérationnelle pour lutter contre les mouvements communistes et les cartels de la drogue, est entravée par de hauts fonctionnaires. Des agents de la Direction des opérations ont signalé que leurs opérations et leurs ordres venant d'en haut se heurtaient à des agents des services de sécurité peu coopératifs, nécessitant parfois des pots-de-vin et d'autres formes de coercition pour atteindre les objectifs de leurs missions.\n\nLes deux bureaux, et donc la Direction du renseignement et la Direction des opérations, estiment que toute forme d’aide aux régimes d’Amérique centrale doit être stoppée, à moins que les États-Unis ne négocient un plan d’application avec les pays bénéficiaires de l’aide, et qu’ils ne s’engagent à se soumettre à des contrôles supplémentaires."
 CIA_LATAMc.17.d:0 "L'ambassadeur des États-Unis a annoncé aujourd'hui une nouvelle stupéfiante : les États-Unis ont simultanément annoncé qu'ils suspendraient toute aide à notre pays et aux autres pays de la région si nous ne prenons pas de mesures supplémentaires pour garantir que cette aide ne soit pas utilisée à mauvais escient.\n\nInvoquant des inquiétudes concernant la mauvaise gestion et la corruption au sein de notre gouvernement et dans la région en général, les États-Unis ont déclaré qu'ils mettraient fin à toute aide et assistance militaire, économique et secrète à notre égard, à moins que nous acceptions de négocier, sous leur surveillance, un renforcement des contrôles sur les dépenses et l'utilisation de l'aide.\n\nAu sein de notre gouvernement, les divergences sont grandes sur la question : d'éminents responsables politiques et militaires estiment que nous pouvons simplement chercher un autre bienfaiteur plus agréable, tandis que des officiers et des bureaucrates subalternes estiment qu'accepter un renforcement des contrôles constituerait une meilleure option à long terme, sous l'influence des États-Unis. Comment devrions-nous réagir ?"
 CIA_LATAMc.18.d:0 "Les appels des ambassades américaines en Amérique centrale ont afflué aujourd'hui, tous porteurs d'un message quasi identique : les gouvernements du Salvador, du Guatemala et du Honduras ont tous cédé aux menaces américaines de suspendre leur aide, accusés de corruption et de mauvaise gestion.\n\nDes responsables de chaque gouvernement ont promis par écrit à l'ambassadeur des États-Unis dans leur pays que des réformes seraient mises en œuvre pour gérer la réception de l'aide et garantir que l'aide désignée et affectée soit utilisée à des fins spécifiques définies par le Département d'État et la CIA. L'accent a notamment été mis sur l'utilisation de l'aide pour l'amélioration de l'économie et des infrastructures, contrairement à l'utilisation actuelle qui est destinée aux responsables militaires, aux opérations de contre-insurrection et aux pots-de-vin d'éminents responsables gouvernementaux.\n\nFoggy Bottom se réjouit de cette évolution et prévoit d'informer le président et les autres responsables diplomatiques et de sécurité d'ici la fin de la journée."
 CIA_LATAMc.19.d:0 "Des appels malheureux ont été reçus ce matin des ambassades américaines de toute l'Amérique centrale, tous porteurs d'un message quasiment identique : les gouvernements du Salvador, du Guatemala et du Honduras ont tous rejeté les menaces américaines de révocation de l'aide, accusés de corruption et de mauvaise gestion.\n\nDes responsables de chaque gouvernement, lors de conférences de presse, ont condamné les menaces américaines, les qualifiant de « tentatives américaines incessantes d'influencer tous les aspects de nos affaires intérieures » et affirmant que « la réduction de l'aide militaire condamnerait vos alliances avec nous et entraînerait l'effondrement de la sécurité dans la région ».\n\nLes responsables politiques de Langley et de Foggy Bottom, ainsi que de nombreuses ambassades et agences, sont furieux. Le président n'a pas encore été informé, mais le DCI et le secrétaire d'État ont été informés. On ignore si l'aide sera effectivement réduite, mais nous supposons que le président [USA.GetLeader] y mettra fin immédiatement après cette nouvelle."
 CIA_LATAMc.20.d:0 "OPÉRATION BLIZZARD BURN : PLAN OPÉRATIONNEL\nQuartier général, Commandement Sud des États-Unis ; Bureau fédéral d’enquête (FBI) ; Agence de lutte contre la drogue (Drug Enforcement Agency) ; Force conjointe de lutte contre la drogue (Joint Drug Enforcement Force), Agence centrale de renseignement (CIA)\nSECRET/NOFORN\n\nVous trouverez ci-joint les ordres donnés aux unités de l’USSOUTHCOM, du FBI, de la DEA et de la CIA pour intercepter et attaquer les principaux bastions des cartels au Mexique, en Amérique centrale et en Colombie. Ces raids doivent être secrets, mais impliquent la coopération des autorités locales et de leurs services de sécurité.\n\n1. Les forces de l’USSOUTHCOM, basées au Panama, se concentreront principalement sur le maintien de lignes de communication ouvertes, la surveillance et l’appui-feu des agents de terrain du FBI et de la DEA. L’USSOUTHCOM fournira également des services de transport aérien et autres services connexes, et maintiendra les contacts avec les autres services de sécurité et les forces armées de la région.\n\n2. Des agents du FBI et de la DEA, travaillant au sein d'une Force d'intervention conjointe de lutte contre les stupéfiants (JCDTF), mèneront les principales opérations d'interdiction, après avoir reçu l'autorisation des autorités supérieures et du Conseil de sécurité nationale. Ces opérations seront principalement menées par des équipes d'intervention conjointes (JCT), qui utiliseront les ressources de la Force d'intervention, ainsi que celles de l'USSOUTHCOM, pour attaquer les bastions du Cartel et arrêter ou éliminer ses chefs et lieutenants.\n\n3. Les agents de la CIA se concentreront principalement sur le soutien au renseignement, la surveillance, le marquage des membres du Cartel et leur localisation, et fourniront généralement des données de ciblage et un soutien aux JCT et à la Force d'intervention. La CIA devra également fournir du personnel pour participer aux interrogatoires et aux forces de frappe afin d'améliorer l'interdiction globale et l'efficacité opérationnelle.\n\nToutes les agences et tous les commandements disposent d'une certaine autonomie, mais toutes les opérations et responsabilités doivent être approuvées par la Force d'intervention conjointe basée au Panama avant toute intervention.\n\nSIGNÉ\nCommandant, Commandement Sud des États-Unis ; Commandant, Détachement de l'USSOUTHCOM, Force d'intervention conjointe de lutte contre les stupéfiants"
 CIA_LATAMc.21.d:0 "UNE NOUVELLE POLITIQUE LATINO-AMÉRICAINE\nBureau d'analyse de l'Amérique latine, Direction du renseignement\nSECRET/NOFORN\n\nComme le montrent les changements tumultueux de notre politique à l'égard de l'Amérique latine, il est temps pour les États-Unis d'envisager pleinement une nouvelle politique latino-américaine, combinant les idéaux d'autodétermination et de démocratie multipartite, et corrigeant les erreurs du passé par une assistance accrue et des opérations de lutte contre la drogue, sans outrepasser leur rôle.\n\n1. Comme l'ont prouvé les administrations précédentes, préserver notre réputation auprès des pays d'Amérique latine est primordial. Par le passé, nous les avons traités comme des vecteurs d'exploitation, à des fins économiques, par notre gouvernement ou par des entreprises américaines. Cependant, les États-Unis ne doivent pas tomber dans le piège de l'installation de gouvernements de droite pour conserver une image amicale. Le maintien des initiatives d'autodétermination dans la région doit être la priorité absolue, car les États-Unis ont souvent influencé les élections par le passé.\n\n2. Les opérations de lutte contre la drogue devraient également être considérées comme une priorité majeure de la coopération entre les États-Unis et l'Amérique centrale, en complément des nouvelles initiatives d'aide et de formation militaires proposées par le Pentagone. Les États-Unis souhaitent notamment promouvoir une action internationale concertée, via l'Organisation des États américains, pour mettre fin au trafic de cocaïne et de marijuana par des actions militaires et policières.\n\nCe Bureau estime que ce plan politique à deux volets stabilisera la région sans céder aux intérêts radicaux des deux bords politiques et maintiendra efficacement l'influence des États-Unis avec une belligérance minimale, voire nulle."
 CIA_LATAMc.22.d:0 "Lorsque le directeur de la CIA [GetCurrentCIADir] entra dans la grande salle de conférence, un silence s'abattit sur la salle, parmi les dirigeants et les vice-présidents principaux. Aucun d'eux ne savait pourquoi ils avaient été convoqués, seulement que leurs secrétaires avaient été effrayées par de mystérieux appels téléphoniques ordonnant à leurs supérieurs de venir immédiatement à Langley.\n\n« Messieurs, bienvenue à Langley. Je suis sûr que vous vous demandez tous pourquoi nous vous avons convoqués. » La plupart des dirigeants acquiescèrent. « Certains d'entre vous pensent probablement que nous allons vous confier des missions d'espionnage secret, mais ce n'est pas pour cela que nous sommes ici. » Cela déclencha un petit rire, dont le DCI fut ravi, car il s'apprêtait à aborder un sujet plus sérieux.\n\n« Vous êtes ici parce que vos entreprises et vos sociétés exercent une forte influence en Amérique latine. De Chiquita à Cargill en passant par Freeport-McMoRan, l'industrie est diversifiée et je suis sûr que vos actionnaires et les économies locales de la région l'apprécient.»\n\n« Cependant, nous, ici à l'Agence, ainsi qu'à Washington, de l'autre côté du Potomac, sommes préoccupés par certaines de vos actions. De nombreux responsables politiques du Département d'État et du Commerce estiment que vos pratiques commerciales déstabilisent intrinsèquement la région et que votre influence contribue à soutenir les régimes d'extrême droite et néofascistes.» Soudain, un silence de confusion s'est empli de la salle, laissant place à des fanfaronnades plus fortes.\n\n« J'admets que notre gouvernement n'a pas fait mieux par le passé, mais nous avons changé nos méthodes et sommes déterminés à contribuer aux réformes dans la région. Vous savez tous aussi bien que moi que vos entreprises ont autant, voire plus, d'influence sur les gouvernements d'Amérique centrale et d'Amérique du Sud ; leur dépendance économique est telle que si vous les obligez à se réformer, elles suivront. »\n\nLes dirigeants baissaient les yeux, se regardaient, puis se tournaient vers le DCI. « Vous êtes sérieux ? », demanda un vice-président senior de Cargill.\n\n« Oui, oui, je le suis. Vous auriez toujours des avantages économiques, mais vous offririez aussi une meilleure qualité de vie aux gens. Vous les payez, vous savez.»\n\nLes dirigeants soupirèrent. « D'accord. On en reparlera avec nos conseils d'administration, je suppose, du moins moi. Je ne sais pas comment ça va se passer, Directeur. »"
 CIA_LATAMc.23.d:0 "C'était une nuit chaude dans le sud-est du Guatemala, près de San Marcos. Un employé de Chiquita, anciennement United Fruit Company, empruntait la route poussiéreuse au volant de sa nouvelle Ford, pourtant déglinguée. Ce n'était pas un employé local, mais un cadre intermédiaire américain, envoyé superviser la production de bananes dans la région. Ses supérieurs se fichaient de son origine, juste qu'il parlait suffisamment espagnol pour crier sur les ouvriers et avait assez de bon sens pour savoir comment soudoyer la municipalité et les soldats.\n\nIl continua sa route, essuyant la sueur de son front. S'arrêtant à un poste de contrôle à l'extérieur de la ville de San Marcos, il sortit ses papiers et quelques quetzals pour les soldats ; il savait qu'ils avaient besoin d'argent, de toute façon.\n\n« Buenas noches, messieurs », dit le directeur en tendant ses papiers alors que la vitre finissait de baisser. Les soldats sourirent, prirent l'argent, le feuilletèrent, puis frappèrent à la porte pour en demander davantage. Le directeur haussa les épaules. « C'est tout ce que j'ai, les gars. » Les soldats acquiescèrent, ouvrirent le portail et le laissèrent passer.\n\nDix secondes plus tard, la voiture explosa sous une pluie de coups de feu automatiques, des dizaines de balles brisant la vitre et laissant le gérant ensanglanté. L'un des soldats, s'approchant de la voiture, brisa le reste de la vitre, achevant l'homme pour s'assurer qu'il était bien mort.\n\nUn autre homme à moto, arrivant en sens inverse, s'arrêta, comme s'il savait ce qui se passait. Il descendit, saluant les hommes, qui baissèrent leurs armes. « Voilà votre paie, les gars. » Les deux hommes sourirent, se partagèrent les billets et les fourrèrent dans leurs poches tout en vérifiant à nouveau leurs fusils. Un autre bananier mort, pensèrent-ils. Au plus offrant, il fallait faire n'importe quoi."
 CIA_LATAMc.24.d:0 "Marcus Greene était fatigué par la chaleur de la journée, mais ils venaient de trouver une nouvelle piste. Dans le cadre d'un nouveau programme avec la Police nationale du Nicaragua, Greene avait été intégré comme conseiller, avec toutefois des rôles limités. Le gouvernement nicaraguayen s'était méfié de l'empressement de la CIA à apporter son aide, mais lorsqu'ils avaient évoqué la lutte contre le trafic de drogue des Contras, les sandinistes avaient accepté à contrecœur.\n\nLes policiers qui lui étaient intégrés n'étaient pas des policiers ordinaires ; ils avaient été formés à la lutte antidrogue dans une certaine mesure, mais avaient été cooptés par les communistes lors de leur accession au pouvoir. La politique importait peu ici, loin de Managua, car ils avaient un objectif commun.\n\nGreene et son équipe se trouvaient dans un port, certes petit, où la police savait que des trafiquants de cocaïne se rendaient. Ils avaient aperçu une douzaine de petits bateaux de pêche et de crevettiers et les avaient tous fouillés, en vain ; cependant, un agent avait parlé à un habitant du quartier qui avait rapporté avoir vu un homme blanc aider à décharger quelque chose d'un camion sur un bateau. Cela valait la peine d'enquêter, d'autant plus que les Contras étaient connus pour leur forte présence dans la région.\n\nS'envolant vers des eaux plus profondes en canot, Greene désigna le bateau que l'homme avait identifié. C'était un bateau rouillé de six mètres de long, à peine navigable, battant pavillon panaméen ; rien de trop suspect, mais typique du trafic de drogue. Il y avait un homme à bord, un homme à l'air nerveux ; Greene devina qu'il était le propriétaire du bateau. Les Nicaraguayens l'interrogeèrent brièvement, avant qu'il ne tente de les repousser, en vain. Une brève bagarre éclata, mais l'homme fut plaqué au sol et plaqué contre un mur, où les policiers nicaraguayens le frappèrent avant de le menotter.\n\nGreene regarda l'eau, se demandant combien d'autres petits bateaux ils n'avaient pas réussi à attraper aujourd'hui. Au moins, ils en avaient un. Son sergent s'approcha de lui, semblant lui indiquer qu'ils avaient saisi des centaines de briques de cocaïne là-bas. Je suppose que les Contras vont regretter ça, pensa-t-il."
 CIA_CONTRA80.0.d:0 "LES CONTRAS AU NICARAGUA : EN BREF\nDétachement du Nicaragua, Bureau d'analyse latino-américaine, Direction du renseignement\nSECRET/NOFORN\n\nDans le contexte de la guerre civile nicaraguayenne, les États-Unis s'intéressent particulièrement à une organisation de guérilla informelle connue sous le nom de « Contras » (abréviation de « la contrarrevolución » ou « contre-révolution »). Elle se compose de trois principaux groupes nicaraguayens anticommunistes et rebelles contre le gouvernement marxiste au pouvoir, les Sandinistes ou FSLN. La Force démocratique nicaraguayenne (FDN), dirigée par Adolfo Calero, est le plus important groupe Contra. Elle est composée d'anciens gardes nationaux nicaraguayens et de la Légion du 15 Septembre. Parmi les autres groupes pro-Contra figurent des Nicaraguayens qui soutenaient la révolution anti-Somoza mais désapprouvaient le régime sandiniste actuel, notamment les Milicias Populares Anti-Sandinistas (MILPAS) et d'autres milices paysannes.\n\nLes États-Unis sont confrontés à une situation difficile. Le défi consiste à décider s'il faut soutenir les Contras. Le soutien américain actuel, principalement constitué d'un soutien politique via des exils et des livraisons d'armes limitées, n'a pas suscité beaucoup d'approbation au Congrès. Ce Bureau recommande une augmentation des livraisons d'armes et d'autres opérations secrètes au Nicaragua, car cela favoriserait les intérêts américains dans la région et renforcerait la capacité de combat des Contras. Il convient de s'inquiéter vivement de la persistance des troubles dans l'opinion publique et au Congrès, car la fin des opérations pourrait s'avérer nécessaire."
 CIA_CONTRA80.1.d:0 "À la tombée de la nuit sur Washington, trois des hommes les plus importants du monde et leurs conseillers tenaient une réunion matinale dans l'aile ouest.\n\n« …et donc, le Congrès veut que nous réduisions le soutien aux Contras, et le Président est d'accord, nous devrions donc aller de l'avant pour y mettre fin. » Le conseiller à la sécurité nationale [GetCurrentNatSecAdv] soupira.\n\nLe directeur de la CIA [GetCurrentCIADir] regarda autour de lui. « Je suppose. Qu'il soit simplement clair que certains membres de l'Agence ne soutiennent pas cela et soutiennent l'augmentation des livraisons d'aide. »\n\nLe DDO intervint. « Le Congrès ne sait rien du Nicaragua, et pourtant il continue de nous ordonner de mettre fin à quelque chose qu'il ignore. Y a-t-il un moyen de garder cela secret sans avoir à en informer le Président ou le Congrès ? »\n\nLe conseiller à la sécurité nationale secoua la tête. « Impossible. Nous ne pouvons pas nous permettre de ne pas informer le Président, et le Congrès ne peut pas être trompé à une telle échelle. »\n\n« Votre opinion est inhabituelle, patron », dit le DDO, « mais je vous concède que vous avez raison. Cette situation, opérationnellement, est devenue trop compliquée et, un seul raté de plus, elle sera entre les mains de la presse. Mieux vaut y mettre fin maintenant avant de perdre encore plus de crédibilité.» Les deux autres acquiescèrent. « Inspecteur en chef, commencez à appeler le Centre de surveillance et Langley. Je vais immédiatement aller lire au Président et lui dire que nous mettons fin aux livraisons d’armes, mais que nous continuerons à apporter un soutien public limité aux contras en termes de discours. Ça vous convient ?» Le conseiller à la sécurité nationale se leva.\n\n« Arrêtons.» Les hommes acquiescèrent, puis tous sortirent de la pièce."
 CIA_CONTRA80.2.d:0 "C'était en début de soirée, juste après le coucher du soleil, lorsque le capitaine Thomas Glenn et son copilote, aux commandes d'un Lockheed L-100 Hercules flambant neuf, ont roulé sur la piste 12 de l'aéroport international de Miami. C'était son quatrième ou cinquième vol pour la petite compagnie de fret Southern Air Transport, qui effectuait des vols cargo entre les États-Unis et l'Amérique centrale. Plus précisément, Glenn et son copilote avaient pour mission de piloter cette version civile d'un C-130 Hercules jusqu'à la base aérienne de Soto Cano, au Honduras. Son plan de vol indiquait PLA, comme Planadas, en Colombie, mais personne n'avait besoin de savoir cette incohérence.\n\nDécollant quelques minutes plus tard, Glenn soupira en se préparant pour le vol de deux heures, généralement simple et sans accroc, vers le centre du Honduras. Son copilote, également officieusement chef de chargement, revint de la soute en annonçant : « Tout va bien, patron.»\n\nGlenn répondit : « Ai-je au moins l'autorisation de savoir ce qu'il y a là-bas ? » Ils rirent, avant que le copilote ne réponde : « Juste des cartons et des cartons d'AK-47, quelques cartons de Makarov, quelques TOW, je suppose que les Contras en ont besoin maintenant. » Glenn hocha la tête et retourna à la zone de contrôle pour ajuster légèrement le cap. « Oui, monsieur. Peu importe ce que je transporte, du moment que ça paie les factures, vous voyez ce que je veux dire ! » Ils rirent et continuèrent à discuter pendant que le vol se poursuivait.\n\n90 minutes plus tard, le L-100 atterrissait à Soto Cano au crépuscule, juste au moment où les pilotes étaient partis. Après un atterrissage plutôt chaotique, Glenn fut heureux de voir les véhicules cargo et les soldats américains stationnés près du hangar, tandis que l'avion était ramené en arrière et stationné pour décharger discrètement. Il aurait juste le temps de se dégourdir les jambes et de prendre un café, avant de ravitailler l'avion et de repartir pour Miami, avec un peu de chance vers 2 ou 3 heures du matin, heure de l'Est. Puis un jour de repos, Dieu merci.\n\nIl se demandait où irait sa cargaison et comment elle serait utilisée ; Il savait que ces armes allaient au Nicaragua, mais pourquoi des armes soviétiques, se demandait-il ? C'étaient elles qui combattaient les communistes. Glenn n'était pas suffisamment informé pour savoir d'où venaient ces armes, mais il avait fait son travail et il était temps de rentrer."
 CIA_CONTRA80.3.d:0 "L'AMENDEMENT BOLAND ET L'AVENIR DU NICARAGUA\nBureau Nicaragua, Bureau d'analyse latino-américaine, Direction du renseignement ; Bureau des affaires du Congrès, CIA\nSECRET/NOFORN\n\nUn amendement à la dernière loi de crédits pour la défense, rédigé par le représentant Edward Boland (Démocrate-Massachusetts), a suscité de vives inquiétudes parmi les membres de la communauté du renseignement américain et l'administration actuelle. Adopté à une large majorité par la Chambre des représentants, l'« amendement Boland » stipule :\n\n« Au cours de l'exercice budgétaire [GetYear], aucun fonds mis à la disposition de la CIA, du Département de la Défense ou de toute autre agence ou entité des États-Unis impliquée dans des activités de renseignement ne peut être engagé ou dépensé aux fins ou pour avoir pour effet de soutenir, directement ou indirectement, des opérations militaires ou paramilitaires au Nicaragua par une nation, un groupe, une organisation, un mouvement ou un individu.»\n\nEn résumé, cet amendement interdit de fait non seulement à la CIA, mais aussi à tout organisme gouvernemental américain, de soutenir financièrement les Contras au Nicaragua. Cette décision du Congrès n'a pas surpris de nombreux responsables des Affaires du Congrès, le Capitole s'opposant fermement à tout soutien de l'administration aux mouvements anticommunistes au Nicaragua, notamment à l'utilisation des fonds autorisés par ces derniers à d'autres fins.\n\nPlusieurs options s'offrent à nous à cet égard. L'une d'elles consisterait à simplement suivre le texte de l'amendement tel que stipulé par le Congrès, sous peine de voir la CIA perdre des financements lors des prochains exercices. Cette solution a été présentée par des responsables de l'Agence et du Bureau des Affaires du Congrès comme un moyen pour la CIA de sauver la face et de se retirer du Nicaragua.\n\nCependant, le conseiller juridique général de la CIA et la Direction des opérations ont indiqué à l'Agence que la formulation de l'amendement était suffisamment vague pour que l'aide aux Contras puisse être maintenue secrètement, tout en restant techniquement conforme aux stipulations du Congrès. Cela satisferait les membres du Congrès, tout en maintenant les priorités opérationnelles au Nicaragua et en soutenant les Contras financièrement et militairement."
 CIA_CONTRA80.4.d:0 "« … Monsieur le Président, nous aimerions faire pression de manière informelle sur le Congrès pour qu'il abroge l'amendement Boland par une autre résolution de la Chambre. » Le chef de cabinet de la Maison-Blanche [GetCurrentCoS] a fait un geste vers une note déposée sur le bureau Resolute, où siégeait le président [USA.GetLeader].\n\nLe directeur de la CIA [GetCurrentCIADir] a hoché la tête. « Nous en avons discuté à Langley et avons décidé que c'était la meilleure option pour faire face à notre opposition majeure aux Contras au Congrès. »\n\n« Je vois », a déclaré le président en levant les yeux vers les deux hommes. « Le seul problème est de savoir qui nous pouvons contacter pour rédiger et parrainer ce projet. L'amendement Boland a été voté à 411 voix contre 0, presque à l'unanimité. Les chances ne sont pas en notre faveur, messieurs. »\n\nLes deux hommes ont hoché la tête. « Nous y avons pensé, Monsieur le Président. » Le chef de cabinet prit la parole. « Quelques membres seraient disposés à parrainer une résolution à la Chambre, notamment le député Newt Gingrich, de Géorgie, qui s'est montré réceptif à des propositions similaires par le passé.»\n\n« Excellent travail, les gars. Contactez son bureau, dites-lui que nous avons besoin de son aide. Il nous a déjà soutenus sur certains de nos dossiers, alors je pense qu'il sera aimable cette fois-ci.» Ils acquiescèrent de nouveau. « Oui, Monsieur le Président. »"
 CIA_CONTRA80.5.d:0 "De mauvaises nouvelles nous sont parvenues du Congrès : nos sympathisants, dont le député Newt Gingrich de Géorgie, ont rapporté que la Chambre des représentants avait ignoré la demande de la Maison-Blanche d'abroger l'amendement Boland, le laissant mourir au Feuilleton par une commission contrôlée par des membres anti-Contra.\n\nLa tentative de la Maison-Blanche, qui tente à la fois de respecter l'amendement controversé et de le faire avorter, s'inscrit dans une série d'échecs de l'administration pour maintenir son emprise au Nicaragua sans s'attirer les foudres du Congrès. De son côté, la CIA a fait une rare déclaration condamnant le Congrès pour « refuser injustement et sans motif toute assistance aux combattants de la liberté anticommunistes au Nicaragua ».\n\nFace à cette situation, la manière dont l'administration procédera reste incertaine. Certaines sources ont indiqué que la CIA poursuivrait ses opérations secrètes au Nicaragua, en violation de l'amendement Boland, tandis que d'autres ont affirmé qu'elle pourrait tout simplement y mettre fin."
 CIA_CONTRA80.6.d:0 "ALTERNATIVES AU SOUTIEN AU NICARAGUAN\nBureau Nicaragua, Bureau des opérations latino-américaines, Direction des opérations\nSECRET/NOFORN\n\nSuite à l'approbation de l'amendement Boland par la Chambre des représentants, qui empêche la CIA de dépenser des fonds ou de mener des opérations au Nicaragua pour soutenir les Contras, l'Agence peine à trouver des alternatives pour continuer à soutenir ses objectifs opérationnels et stratégiques au Nicaragua et dans la région. Voici quelques propositions pour poursuivre ses opérations :\n\n1. Créer des organisations écrans ou « écrans », des sociétés fictives ou d'autres sociétés fictives, afin de faire transiter de l'aide et des armes par les Contras, sans dépenser les fonds alloués à la CIA. Il pourrait s'agir de sociétés de transport aérien, maritime ou logistique, ainsi que d'organisations humanitaires et/ou culturelles.\n\n2. Coopérer avec la Western Goals Foundation, une agence de renseignement privée non gouvernementale dont les objectifs et les idéaux anticommunistes sont très similaires. La Fondation, fondée par le général de division John Singlaub, bénéficie également du soutien du député Larry McDonald, fervent défenseur de notre cause. Cela permettra quasiment à la CIA de maintenir ses opérations tout en imputant la responsabilité principale aux objectifs occidentaux.\n\n3. Une dernière solution consisterait à vendre discrètement des armes à l'Iran. Ce faisant, les États-Unis libéreraient les otages capturés par les Iraniens et renforceraient leurs relations stratégiques avec l'Iran. Bien que cela puisse être sans rapport avec les intérêts immédiats, vendre des armes à l'Iran permettra à la CIA de disposer de fonds qui pourront servir à acheter des armes du bloc de l'Est sur un marché disponible, lesquelles serviront ensuite à approvisionner les Contras en munitions. Cela permettra de standardiser opérationnellement les armes utilisées dans le conflit et de mieux protéger les Contras, car ils n'utilisent pas d'armes occidentales.\n\nLa combinaison de ces propositions garantira que les Contras nicaraguayens ne soient pas privés du soutien et de l'aide des États-Unis ; et bien qu'elles violent techniquement l'amendement Boland, le Congrès dispose de peu de pouvoir coercitif à cet égard et ne remarquera probablement pas ces activités secrètes à moins qu'elles ne lui soient clairement signalées."
 CIA_CONTRA80.7.d:0 "Dans un entrepôt près de Newport, dans le Delaware, une nouvelle entreprise emménageait dans ses bureaux. L'encre de leur acte de constitution venait à peine de sécher dans l'État du Delaware, un État réputé pour son esprit d'entreprise et ses lois simples pour la constitution de sociétés ; une pancarte de taille moyenne, assez visible, affichait « INTER-AMERICA TRANSPORT CORPORATION » accrochée à la porte. Des piles et des piles de cartons de déménagement, de transport et de caisses bancaires étaient disséminées dans les bureaux et l'entrepôt. Une fois le bureau installé, ils inscrivaient le numéro de téléphone de l'entreprise dans l'annuaire pour ne pas éveiller les soupçons, mais le numéro était par hasard acheminé vers un centre d'appels du Kansas, où il était déposé. Ce n'était pas une entreprise ordinaire.\n\nEn quittant l'Interstate 95, un petit convoi discret de berlines, toutes noires aux vitres teintées, se gara sur le parking devant l'entrepôt. Le trajet avait été long depuis Langley, mais ils étaient heureux de ne pas avoir à prendre l'avion. Descendus des voitures, ils pénétrèrent dans l'entrepôt et observèrent plusieurs palettes empilées contenant le fret géré par la Corporation : au lieu de services de fret général, cette « Société de transport interaméricaine » faisait de la contrebande d'armes. Les hommes regardèrent passer un chariot élévateur transportant une palette de fusils AK-47 dans des caisses, qu'ils déposèrent dans le compartiment marqué « À CONTRÔLER ».\n\nCet entrepôt modeste, situé près d'une usine chimique et dans une zone industrielle du nord du Delaware, allait bientôt devenir l'un des plus grands points de transfert d'armes de tout l'hémisphère occidental. De là, les armes américaines seraient expédiées en Iran par bateau, échangées contre des prisonniers libérés publiquement, et payées en dollars américains, lesquels serviraient ensuite à acheter des armes du bloc de l'Est auprès de revendeurs réputés, dans l'ombre et en Afrique. Ces armes seraient renvoyées au Delaware, où elles embarqueraient bientôt à bord d'un avion L-100 ou d'un petit bateau pour être envoyées au Nicaragua afin d'aider les combattants de la liberté partout dans le monde. Et le meilleur dans tout ça ? Tout cela était confidentiel, sauf pour les plus hauts fonctionnaires et le personnel navigant, sous le regard attentif et ignorant du Congrès."
 CIA_CONTRA80.8.d:0 "LA FONDATION WESTERN GOALS ET LA COOPÉRATION\nBureau Nicaragua, Bureau des opérations latino-américaines, Direction des opérations\nSECRET/NOFORN\n\nLa Western Goals Foundation (WGF), un groupe de réflexion anticommuniste sur la sécurité intérieure et le renseignement, a été particulièrement active ces dernières années et a attiré l'attention de hauts responsables de la CIA, lui attribuant un potentiel d'utilité dans certaines opérations, notamment en Iran et au Nicaragua. Vous trouverez ci-dessous la liste des principaux responsables et fondateurs de la WGF, ainsi que des propositions de collaboration avec la communauté du renseignement des États-Unis.\n\n1. Le fondateur de la WGF, le général de division John Singlaub, était connu de la CIA comme membre fondateur de l'Agence et comme vétéran décoré de la Seconde Guerre mondiale ayant collaboré avec des groupes de la Résistance française pendant et après le débarquement. Singlaub a brièvement été chef d'état-major des forces américaines en Corée, avant de prendre sa retraite et de fonder la Western Goals Foundation avec le député Larry McDonald (voir ci-dessous). Singlaub exerce une grande influence dans les milieux du renseignement américain et est membre du Conseil des États-Unis pour la liberté mondiale, une organisation anticommuniste aux caractéristiques similaires.\n\n2. Le député Lawrence (Larry) McDonald (démocrate, 7e district de Géorgie) est également l'un des principaux fondateurs et bienfaiteurs du WGF. McDonald siège à la Chambre des représentants des États-Unis depuis les élections législatives de 1974 et a affiché jusqu'à présent l'un des taux de vote les plus conservateurs et anticommunistes au sein de cette institution. McDonald a fortement soutenu les activités de la CIA par le passé et son soutien se poursuivra probablement, tout en maintenant une ligne de communication avec le Congrès pour promouvoir les intérêts du renseignement.\n\nNous pensons qu'avec l'aide de ces deux personnalités, la coopération entre la CIA et Western Goals permettra une forme plus « légitime » d'envoi d'aide aux forces Contras nicaraguayennes, contrairement à d'autres alternatives. Western Goals est composé d'anciens responsables de l'armée et du renseignement, qui comprennent tous la complexité de la situation actuelle. La coopération doit commencer immédiatement."
 CIA_CONTRA80.9.d:0 "C'était une nuit froide dans la ville de Dogubeyazit, en Turquie, lorsqu'un convoi de camions traversait la route nationale turque D.100, en direction de l'est, après avoir traversé le pays depuis la ville occidentale d'Izmir, et plus précisément la base aérienne de Cigli.\n\nAlors qu'ils poursuivaient leur route à toute allure vers la frontière iranienne, les camions s'arrêtèrent au village de Gurbulak, dernier arrêt avant la frontière. Ils ne franchiraient jamais la frontière et, immobilisés sur un terrain vague à la sortie du village, les chauffeurs attendaient qu'un groupe de camions presque identiques, également banalisés, s'approche du point de rendez-vous.\n\nLangley avait suggéré un rendez-vous dans un endroit plus peuplé afin de conclure l'accord, mais le chef de poste d'Ankara avait suggéré un rendez-vous dans la campagne turque, près de la frontière, de nuit, pour ne pas attirer l'attention. Les agents, tous chauffeurs, avaient décidé de poursuivre l'opération et, assis, ils aperçurent six poids lourds s'approcher du poste-frontière iranien, avec un véhicule d'état-major à leur tête. Les voyant approcher, les agents sortirent, allumèrent des cigarettes et commencèrent à baisser les hayons et à ouvrir les portes de leurs camions. Quelques-uns se tenaient là, fusils à la main, pour assurer la protection de la zone, tandis que les autres se préparaient.\n\nIl n'y eut guère de discussions ; la plupart des détails avaient été planifiés à l'avance par les hauts responsables des deux camps. En échange de 20 missiles antichars BGM-71 TOW, les Iraniens paieraient environ 500 000 dollars américains en espèces. Les agents ignoraient d'où ils tiraient cette somme, mais ils obtiendraient les missiles. Sous leurs yeux, un officier iranien, en civil, déposa deux mallettes remplies d'argent liquide par terre. Pendant qu'on les inspectait, les missiles, dans leurs caisses, commencèrent à être déchargés et transportés vers les camions iraniens.\n\nC'était aussi simple que ça. L'agent principal, le conducteur principal, demanda aux Iraniens savaient se servir des missiles TOW. L'officier répondit oui, et c'en était fait. Les agents avaient leur argent, et le chef de poste à Ankara aurait une autre dépêche cryptée à envoyer à Langley le matin ; avec l'argent dans une valise diplomatique, bien sûr."
 CIA_CONTRA80.10.d:0 "LE PROBLÈME DES OTAGES CONTRE LES ARMES : PROPOSITION\nBureaux Iran et Liban, Bureau d'analyse du Proche-Orient, Direction du renseignement ; Direction des opérations\nSECRET/NOFORN\n\nAu cœur de la crise et de la guerre civile qui ont suivi au Liban, les États-Unis se sont retrouvés pris dans une tentative de médiation dans une crise régionale : sept Américains, sur une centaine d'otages estimés, ont été pris par le groupe terroriste Hezbollah au Liban. Les services de renseignement américains ont établi que le Hezbollah continue de bénéficier du soutien politique et financier de la nouvelle République islamique d'Iran, elle-même impliquée dans un conflit sanglant avec son voisin du sud, l'Irak.\n\nLes Bureaux Iran et Liban, avec l'aide de conseillers extérieurs, ont proposé un plan visant à la fois à maintenir l'Iran dans la sphère d'influence occidentale et à libérer les otages américains. Avec l'aide de Manucher Ghorbanifar, ancien marchand d'armes iranien, les États-Unis proposeront des ventes d'armes à l'Iran afin d'atteindre les objectifs suivants :\n\n1. La vente de missiles antichars et sol-air TOW et HAWK générera des bénéfices qui, hors des restrictions budgétaires prévues par l'amendement Boland, pourront servir à financer les Contras nicaraguayens et d'autres groupes que les États-Unis souhaiteraient soutenir, mais qui se heurtent à l'opposition de l'opinion publique ou du Congrès.\n\n2. En échange de la fourniture des missiles, l'Iran sera contraint de garantir la libération des otages par le Hezbollah, car celui-ci dispose d'une influence et d'un soutien suffisants pour diriger les opérations du Hezbollah, en particulier si celles-ci dépendent des ventes d'armes américaines.\n\n3. Enfin, fournir des armes aux Iraniens renforcera leur dépendance militaire, empêchera le gouvernement iranien de vendre des armes au bloc soviétique et leur procurera un léger avantage tactique dans la guerre Iran-Irak qui s'ensuivra.\n\nNous pensons que cette proposition, menée de manière extrêmement secrète, apportera des avantages à presque toutes les parties impliquées : les États-Unis bénéficieront d’une influence accrue et du retour des otages, ce qui sera un avantage pour l’administration actuelle ; l’Iran recevra les armes dont il a besoin pour renforcer ses capacités ; et les Contras recevront un financement provenant des bénéfices des ventes d’armes à l’Iran."
 CIA_CONTRA80.11.d:0 "Par des canaux secrets, des agents de la CIA américaine ont fait une offre cruciale à notre gouvernement. Actuellement, sept Américains sont retenus en otage au Liban par le Hezbollah, un groupe que nous soutenons politiquement, militairement et financièrement. La Maison Blanche, cherchant à se remettre du désastre de la révolution iranienne de 1979, tente de récupérer ces otages et de sauver la face, tant sur le plan national qu'international.\n\nDes agents de la CIA ont proposé de fournir des armes à l'Iran, telles que des missiles antichars BGM-71 TOW et des missiles sol-air HAWK, si nous pouvons garantir et faciliter la libération des sept Américains.\n\nLes membres de notre gouvernement et du Corps des gardiens de la révolution restent divisés sur la question. Garder les otages pourrait nous donner un plus grand pouvoir à l'avenir, tandis que la préoccupation immédiate sur le plan militaire est de renforcer nos capacités en pleine guerre contre l'Irak, et l'utilisation d'équipements américains offrirait un avantage tactique par rapport à l'obtention d'armes et d'aide du bloc soviétique. Comment choisir ?"
 CIA_CONTRA80.12.d:0 "Des sources à Téhéran ont contacté nos agents et ont confirmé que l'Iran libérerait les sept otages américains dès réception d'un « nombre suffisant » de missiles TOW et HAWK. Bien que les chiffres restent à déterminer et qu'il s'agisse d'une opération secrète, invisible au public et au Congrès, cela représente une victoire majeure pour les États-Unis dans leurs relations avec le nouveau régime islamiste iranien.\n\nLe directeur de la CIA [GetCurrentCIADir] et le conseiller à la sécurité nationale [GetCurrentNatSecAdv] ont été informés et devraient informer prochainement le président [USA.GetLeader] de l'évolution de la situation."
 CIA_CONTRA80.13.d:0 "Des sources à Téhéran ont contacté nos agents pour rejeter explicitement toute offre américaine de « mise en échange d'armes contre des otages ». Sans faire de déclaration publique, contrairement à ce qu'attendrait le régime islamiste fondamentaliste anti-américain iranien, les Iraniens ont rejeté toute offre de ce type, semblant déterminés à conserver les sept otages américains pour mieux peser sur les dossiers à venir. Malgré le besoin évident d'armes au lendemain de la guerre Iran-Irak, il est curieux que les Iraniens rejettent des missiles de haute technologie en cette période difficile.\n\nLe directeur de la CIA [GetCurrentCIADir] et le conseiller à la sécurité nationale [GetCurrentNatSecAdv] ont été informés et devraient informer prochainement le président [USA.GetLeader] de l'évolution de la situation."
 CIA_CONTRA80.15.d:0 "UN ACCORD STRATÉGIQUE AVEC L'IRAN ?\nBureau Iran, Bureau d'analyse du Proche-Orient, Direction du renseignement\nSECRET/NOFORN\n\nLes interactions récentes des États-Unis avec le nouveau gouvernement iranien après la révolution iranienne de 1979 laissent penser qu'un nouvel accord stratégique pourrait être souhaitable afin de consolider l'Iran comme un pays étroitement lié aux objectifs américains au Moyen-Orient.\n\nDepuis 1979, le régime fondamentaliste islamiste peine à redorer son blason et sa réputation sur la scène internationale et, selon des analyses récentes, il est fortement menacé d'être absorbé par la sphère d'influence soviétique. Le conflit actuel avec son voisin du sud, l'Irak, menace également de déstabiliser davantage l'Iran et continue de déstabiliser la majeure partie du Moyen-Orient. Ayant été disposé à dialoguer avec des agents et des responsables américains sur la question des otages libanais et les projets de ventes d'armes, ce Bureau estime que proposer un projet d'accord stratégique avec le régime iranien favorisera un réchauffement des relations américano-iraniennes et protégera le pays de l'influence soviétique. L'accord devrait inclure les points suivants :\n\n1. Les États-Unis envisageront de reconnaître diplomatiquement la République islamique d'Iran si le gouvernement accepte de restituer tous les otages étrangers, présente des excuses officielles pour ses actions contre les responsables de l'ambassade américaine en 1979 et émet des protestations diplomatiques contre le personnel diplomatique soviétique et du bloc de l'Est.\n\n2. Outre la reconnaissance de la République islamique d'Iran, les États-Unis envisageront alors une aide humanitaire, économique et militaire limitée afin de renforcer la production économique et les capacités militaires iraniennes, ainsi que de subvenir aux besoins du peuple iranien, si le gouvernement iranien accepte d'envisager des négociations avec les responsables irakiens, ainsi que des réformes intérieures assorties d'une orientation religieuse moins stricte.\n\n3. Si la République islamique d'Iran refuse de restituer les otages, d'expulser diplomatiquement les responsables soviétiques, de négocier avec l'Irak ou d'envisager des réformes intérieures, les États-Unis ne lui accorderont aucune reconnaissance ni aucune aide, à commencer par des livraisons d'armes.\n\nNous demandons instamment la coopération du Département d’État à cet égard, mais recommandons que toutes les négociations sur cet accord stratégique soient menées secrètement pour le moment afin d’éviter tout contrecoup politique en cas d’échec éventuel."
 CIA_CONTRA80.16.d:0 "Des responsables américains, sous couvert de la CIA, ont contacté certains de nos diplomates et hauts responsables gouvernementaux afin de proposer une nouvelle orientation des relations américano-iraniennes, qualifiée d'« accord stratégique ».\n\nLes Américains ont proposé de reconnaître diplomatiquement notre gouvernement et de rétablir des relations diplomatiques limitées si notre gouvernement acceptait de libérer tous les otages étrangers, de présenter des excuses pour le siège de l'ambassade américaine en 1979 et d'émettre des protestations diplomatiques contre le personnel de l'ambassade soviétique, qui, selon eux, tente d'influencer notre gouvernement.\n\nLes Américains proposent également une aide, principalement militaire et humanitaire, si notre gouvernement acceptait d'entamer des négociations avec l'Irak, avec lequel nous sommes en conflit acharné, et d'envisager des réformes internes visant à supprimer les règles religieuses strictes de notre société. Les Américains ont clairement indiqué que si nous n'acceptons pas cette proposition, l'aide ne sera pas fournie, pas plus que la reconnaissance diplomatique.\n\nLes membres de notre gouvernement restent divisés sur cette question. Les membres les plus radicaux de notre gouvernement affirment sans cesse qu'une adhésion aux Américains anéantirait l'objectif même de la Révolution et que le « Grand Satan » nous gouvernerait à nouveau. Cependant, certains modérés affirment que la proposition américaine est acceptable et contribuera à redorer l'image du pays. Comment choisir ?"
 CIA_CONTRA80.17.d:0 "Téhéran a réagi en indiquant que les tenants de la ligne dure au sein du gouvernement iranien ont rejeté toute tentative de réorientation stratégique avec les États-Unis.\n\nMalgré nos promesses plutôt généreuses de reconnaissance diplomatique et d'aide en armement, les Iraniens n'ont pas bien accueilli nos demandes de libération d'otages, de négociations avec l'Irak et de réformes intérieures. Plutôt que d'effectuer une démarche privée, ils ont publié une déclaration condamnant nos actions, les qualifiant de « nouvelle tentative du Grand Satan, les États-Unis d'Amérique, d'ingérence dans nos affaires intérieures et de placer toute la région du Moyen-Orient sous son hégémonie ». Il semble que les Iraniens se rapprochent du bloc d'influence soviétique, bien que les informations à ce sujet ne soient pas totalement connues.\n\nLe directeur de la CIA [GetCurrentCIADir], le conseiller à la sécurité nationale [GetCurrentNatSecAdv] et le chef de cabinet de la Maison-Blanche [GetCurrentCoS] ont tous été informés et se préparent avec colère à informer le président [USA.GetLeader] et le vice-président [GetCurrentVP] en ​​ce moment même."
 CIA_CONTRA80.18.d:0 "Téhéran a répondu que les modérés du gouvernement iranien ont accepté la proposition américaine de « réorientation stratégique » entre les États-Unis et l'Iran.\n\nConfirmé par le chef de poste à Bagdad, le responsable le plus proche de l'Iran, les Iraniens auraient accepté au minimum la libération d'otages et des manifestations et expulsions de responsables soviétiques et du bloc de l'Est. En échange, les États-Unis ont accepté de reconnaître diplomatiquement la République islamique, amorçant ainsi un véritable réchauffement des relations diplomatiques.\n\nLe secrétaire d'État [GetCurrentSecState], le directeur de la CIA [GetCurrentCIADir] et le conseiller à la sécurité nationale [GetCurrentNatSecAdv] ont été informés de l'évolution de la situation et prévoient d'informer le président et le vice-président dès que possible."
 CIA_CONTRA80.19.d:0 "À Miami, le L-100 atterrit à nouveau. Glenn se frotta les yeux en roulant, consultant sa montre. Il était deux heures du matin et il revenait tout juste du Honduras. Il était prêt à aller se coucher et à prendre quelques jours de congé. Bon sang !\n\nÀ mille kilomètres de là, quelques heures plus tard, le soleil se levait à la fenêtre du bureau du chef de cabinet de la Maison-Blanche. Non seulement [GetCurrentCoS] était assis là, sirotant un café, mais aussi le DCI [GetCurrentCIADir] et le conseiller à la sécurité nationale [GetCurrentNatSecAdv]. Leur conversation était parfaitement ordinaire. On les informait du retour d'un vol cargo. Juste au bout du couloir, dans l'Oval, étaient assis le président et le vice-président, passant en revue leurs agendas de la journée. Parfaitement ordinaire, comme toute chose devrait l'être.\n\nÀ seulement quelques heures de route sur l'Interstate 95, l'entrepôt de Newport, dans le Delaware, était tout aussi animé. Des semi-remorques du Nord-Est venaient d'arriver, chargés d'AK-47 et d'autres armes du bloc soviétique récemment acquis. Une heure plus tard, ces mêmes camions, désormais chargés de M-16 et de missiles TOW, reprenaient la route vers différents ports, cette fois dans le Sud. D'autres camions viendraient plus tard pour acheminer les armes soviétiques jusqu'à Miami, où elles seraient acheminées par avion.\n\nÀ des milliers de kilomètres au sud, une unité Contra se réveillait après quelques heures de sommeil après des opérations nocturnes. En rechargeant, ils se trouvaient à proximité d'un quartier général de commandement supérieur et décidèrent de s'enregistrer. À leur surprise, ils aperçurent de nouvelles caisses qui devaient avoir été apportées par les Honduriens. En récupérant les nouvelles armes et munitions, le commandant savait que son escouade serait ravie.\n\nC'était un système massif et vaste, mais qui restait secret."
 CIA_CONTRA80.20.d:0 "« MERDE !» hurla le DCI, [GetCurrentCIADir], dans le grand espace de son bureau. Les yeux rivés sur les briefings posés sur son bureau et le journal ouvert devant lui, il se tourna vers un long article intitulé « TRAFIC D'ARMES DANS LE DELAWARE RÉVÉLÉ ».\n\nIl décrocha le téléphone et composa le numéro du bureau du conseiller à la sécurité nationale, immédiatement mis en communication. [GetCurrentNatSecAdv] décrocha. « Allô ?»\n\n« Avez-vous lu le Washington Post ce matin ? On est vraiment dans la merde. Ils ont trouvé l'entrepôt dans le Delaware. Bientôt, ils vont découvrir les itinéraires des avions et des navires ; toute la documentation mentionne les navires. »\n\n« Putain. Il faut essayer de limiter les dégâts. Appelez le Département d'État, on commencera à faire des déclarations sur notre engagement en matière de contrôle des armes et sur les Contras, et on lancera une enquête du FBI. Dites à tout le monde chez Southern Air Transport qu'ils pourraient être les prochains. Suspendez les vols jusqu'à ce que la situation se calme. Dites à quelqu'un d'appeler les Iraniens, et on doit prévenir les Contras pour qu'ils ne s'énervent pas.»\n\n« Bon. Putain, mec, c'est grave. Il faut que tu briefes le Président maintenant. Assure-toi qu'il n'empire pas les choses. Bon sang, la journée va être longue. »"
 CIA_CONTRA80.21.d:0 "Nos contacts au Capitole, dont le représentant Newt Gingrich, ont réussi à faire pression pour obtenir, rédiger et faire adopter une résolution de la Chambre abrogeant l'amendement Boland, adopté par la Chambre il y a plusieurs mois.\n\nL'amendement Boland, initialement adopté pour mettre fin à l'implication des services de renseignement de la CIA et à son financement au Nicaragua pour soutenir les Contras anticommunistes nicaraguayens, a suscité la colère de nombreuses personnalités au sein de la Maison Blanche, des services de renseignement et du réseau de défense, car il allait à l'encontre des objectifs stratégiques des États-Unis en Amérique latine. L'abrogation de cet amendement permettra à la CIA, ainsi qu'à d'autres agences et départements de renseignement, de poursuivre leurs opérations de soutien aux forces Contras afin de promouvoir les intérêts américains.\n\nLe représentant Gingrich, fer de lance de l'abrogation à la Chambre, a reçu les félicitations et les remerciements du président [USA.GetLeader] pour son travail, et devrait être utilisé à l'avenir par les responsables de l'administration pour faire avancer d'autres projets de loi ou abroger d'autres lois."
 CIA_CONTRA80.22.d:0 "Alors que le L-100 atterrissait à Soto Cano pour la première fois depuis plusieurs semaines, le capitaine Thomas Glenn soupira et actionna le manche à balai pour rouler jusqu'à son hangar habituel, hors de vue. Il était content d'être de retour après de longues vacances (et non payées), mais ce vol était pour lui une routine.\n\nAprès avoir garé l'avion, Glenn descendit et regarda son copilote, l'arrimeur, sortir par la rampe arrière, bloc-notes à la main, s'entretenant avec les soldats américains et honduriens qui se tenaient là, vérifiant. Glenn s'approcha, salua les hommes d'un signe de tête, les croisant pour voir si l'officier en second du détachement américain était dans son petit coin de « bureau ».\n\nL'officier en second était un major, commandant adjoint, une centaine d'hommes affectés à la base pour la sécurité, la liaison avec les Honduriens et la gestion des avions. Il y avait bien plus que cette compagnie : un centre d'entraînement aux opérations spéciales à Soto Cano soutenait la Force opérationnelle interarmées Bravo, le commandement suprême ici au Honduras. Il sirota un café tout en continuant à feuilleter des rapports, tandis que Glenn entrait dans son bureau.\n\n« Bonjour, Major. » Glenn esquissa un sourire, « saluant » du doigt sa vieille casquette de baseball des Orioles de Baltimore, toute cabossée. « Comment se passe la fête à Soto Cano ? Vous savez que je ne suis pas venu depuis quelques semaines. »\n\n« C'était pour le moins chaotique. Des Contras de haut rang sont arrivés pour réclamer des armes, et mes hommes ont dû les renvoyer parce que les idiots de Washington ont stoppé les livraisons sans prévenir. »\n\nGlenn hocha la tête. « Ouais, je sais, ces connards du Congrès m'ont mis au chômage pendant deux semaines. On ne peut pas dire que Southern Air Transport ne s'occupe pas des siens, par contre. J'ai réussi à tenir le coup. » Il déposa le manifeste de chargement. Voici votre première cargaison. Je suppose qu'on doit faire demi-tour et partir d'ici, disons, trois heures ?\n\n« Oui, Tom. » Le major baissa les yeux sur le manifeste. « Waouh, super. Plein d'AK-47, quelques lance-roquettes, des mines antipersonnel. Je suppose que les plus gros appareils arriveront bientôt avec des véhicules ? C'est ce que les hauts gradés m'ont indiqué. »\n\nGlenn haussa les épaules. « Je n'en ai aucune idée. La SAT est structurée de manière très indépendante. J'imagine qu'ils ne veulent même pas que je sache ce que je transporte, et encore moins ce que les autres vols apportent. »\n\nLe major fronça les sourcils. « Bon. Bon retour. Prends-toi un café et un en-cas, et l'avion sera déchargé dans l'heure. » Il sourit et hocha la tête, tandis que Glenn faisait un signe de la main et quittait le bureau, voyant les soldats décharger les caisses d'armes."
 CIA_CONTRA80.23.d:0 "Il était tôt le matin lorsque le cargo MS Erria, battant pavillon danois, s'amarrait lentement à un quai du port de Puerto Cortés, sur la côte nord caraïbe du Honduras, fraîchement débarqué du port de Cherbourg, en France.\n\nSon équipage était fatigué ; la plupart étaient des marins marchands danois, mais quelques-uns étaient américains, vraisemblablement agents de liaison, mais payés par Langley. L'Erria ne mesurait qu'environ 45 mètres de long, et les mers de l'Atlantique ne lui avaient pas été favorables. Ils étaient heureux d'être enfin arrêtés.\n\nLeur destination finale, du moins pour ce voyage, était Wilmington, en Caroline du Nord, mais ils devaient s'y arrêter pour une autre raison. Le manifeste indiquait qu'ils transportaient des bananes et d'autres produits agricoles vers les États-Unis, mais la cargaison qu'ils déchargeaient était incertaine. Dans la cale du cargo, ainsi que dans de petits conteneurs, se trouvaient ce qu'ils pensaient être des véhicules. Aucun membre de l'équipage n'était au courant, et ils ne le sauraient probablement jamais. Même le capitaine l'ignorait.\n\nDes soldats honduriens apparurent, manifestement un petit détachement de la patrouille portuaire. Après avoir inspecté le cargo et examiné les conteneurs, ils allèrent parler au second, l'un des Américains à l'air suspect qui les accompagnaient depuis des mois.\n\nAprès une brève conversation, les soldats commencèrent à diriger les Danois, leur demandant de soulever ce qu'ils pouvaient porter ou d'utiliser des chariots élévateurs pour décharger les caisses du navire et les déposer sur un quai de chargement. Bientôt, un camion viendrait les transporter jusqu'à une base militaire voisine, où les caisses seraient déballées et assemblées.\n\nL'un des marins, prenant un moment après avoir utilisé le chariot élévateur avec acharnement, s'arrêta pour consulter à nouveau le manifeste d'expédition. La cargaison à destination de Puerto Cortes indiquait « RENAULT AUTOMOBILE », mais il savait que ce n'était pas ce que contenaient ces conteneurs.\n\nAprès le chargement, les soldats retrouvèrent l'Américain, lui serrant la main et signant un nouveau papier, que les Danois n'avaient jamais vu auparavant. Alors que les marins s'affairaient à recharger le navire en bananes, ils remarquèrent qu'une des caisses était ouverte par une escouade de soldats honduriens. À l'intérieur se trouvait une jeep. Il y avait aussi des caisses plus petites, remplies d'objets ressemblant à des tubes, marqués « STINGER » sur le côté. Curieux."
 CIA_CONTRA80.24.d:0 "Dans un centre de commandement isolé, quelque part dans la jungle nicaraguayenne, se trouvait un haut commandant Contra. Une opération majeure était sur le point de se produire et, tandis qu'il consultait sa montre, ses hommes commencèrent à exécuter leurs ordres.\n\nÀ une heure cinq de l'après-midi, presque partout dans le pays, la situation commença à s'aggraver. Quelques tronçons du réseau routier nicaraguayen, dont certains abritaient des bus bondés, s'effondrèrent. Les quais des ports de San Juan del Sur et de Puerto Cabezas s'enfoncèrent par hasard dans la mer. Les rares trains restants sur le réseau ferroviaire nicaraguayen, peu fréquenté, ralentirent jusqu'à l'arrêt, leurs ingénieurs constatant que les rails avaient été réduits en miettes devant eux. Plusieurs bâtiments gouvernementaux de Managua, dont le quartier général de l'armée nicaraguayenne, furent également bombardés.\n\nEt voilà, les saboteurs disparurent dans la nuit, dans la jungle, invisibles aux yeux des autres Contras et de leurs agents de la CIA. Le commandant était assis dans son bunker, branché sur Radio Sandino, contrôlée par le FSLN, à l'écoute des nouvelles. Le pays et le gouvernement paniquaient à présent. Excellent."
 CIA_CONTRA80.25.d:0 "Le ministre de l'Intérieur et le chef d'état-major de l'armée nicaraguayenne ont confirmé qu'une récente vague de sabotages contre nos infrastructures et nos capacités militaires a été perpétrée par les Contras et, dans certains cas, directement par les États-Unis.\n\nDes rapports provenant de tout le pays indiquent que les États-Unis et leurs alliés, traîtres à notre régime, ont intensifié leur campagne de sabotage, ciblant les routes, les autoroutes nationales, les voies ferrées, nos ports, nos aérodromes et certains bâtiments gouvernementaux à Managua.\n\nNous devons rester vigilants et surveiller nos infrastructures critiques et nos déploiements militaires afin de maintenir notre disponibilité opérationnelle et la sécurité nationale pour protéger le peuple nicaraguayen du terrorisme des Contras et de leurs alliés américains."
 CIA_CONDOR.0.d:0 "OPÉRATION CONDOR : RÉSUMÉ OPÉRATIONNEL\nBureau des opérations latino-américaines, Direction des opérations, CIA\nSECRET/NOFORN\n\nL’opération Condor, également connue sous le nom de Plan Condor, est en bref un effort de coopération des services de renseignement et de sécurité de plusieurs pays d’Amérique du Sud pour lutter contre le terrorisme et la subversion à l’échelle régionale.\n\nComposée principalement de l’Argentine, du Chili, du Brésil, du Paraguay, de l’Uruguay et de la Bolivie, Condor a pour objectif déclaré de mener des opérations de contre-insurrection à l’échelle transnationale, notamment avec la coopération du renseignement du Secretaría de Informaciones de Estado (SIDE) argentin et de la Direction de Inteligencia Nacional (DINA) chilienne. Condor a bénéficié du soutien de la CIA et de la DIA par le passé, ainsi que du soutien militaire de l’USSOUTHCOM pour sa composante militaire, qui comprend des services de liaison et de communication entre les régimes militaires.\n\nCondor a été initialement créée au début des années 1970, officialisée en 1975 à Santiago du Chili ; ses opérations secrètes ont débuté la même année. Certaines opérations, signalées par des membres de Condor, ont inclus la surveillance de dissidents chiliens et uruguayens, l'assassinat du général chilien pro-Allende Carlos Prats et de son épouse, ainsi que du dirigeant démocrate-chrétien chilien Bernardo Leighton. Les chefs de station de la CIA à Santiago, Brasilia et Montevideo ont joué un rôle déterminant dans la liaison, la formation et le conseil pour les agences de renseignement, les services militaires et les services de police de Condor.\n\nLa politique américaine déclarée depuis Foggy Bottom et Langley a toujours été d'agir avec Condor dans le cadre d'une capacité limitée de formation et de conseil, mais de ne pas s'engager directement dans des opérations secrètes, laissant cette tâche aux membres de Condor. Les États-Unis ont maintenu et continueront de maintenir un déni plausible concernant leur implication dans les opérations de Condor et l'utilisation de leurs installations pour soutenir leurs membres, notamment en matière de formation et de communication."
 CIA_CONDOR.1.d:0 "OPÉRATIONS DE CONTRE-INSURRECTION EN ARGENTINE\nBureau Argentine, Bureau des opérations latino-américaines, Direction des opérations, CIA ; AMBASSADE DE BUENOS AIRES\nSECRET/NOFORN\n\nDepuis le milieu de l'année 1974, sous l'ancien gouvernement d'Isabel Perón, veuve de l'ancien président Juan Perón, les opérations de contre-insurrection en Argentine se poursuivent au moment de la rédaction de ce rapport. Malgré le coup d'État militaire de 1976, qui a instauré le Processus de réorganisation nationale, les opérations se poursuivent et semblent légèrement plus efficaces que les années précédentes.\n\nLutte principalement contre les guérillas de gauche, notamment l'Armée populaire révolutionnaire (ERP), les Monteneros péronistes, les mouvements syndicalistes et les exilés chiliens pro-Allende ; la « sale guerre », comme l'appelle l'armée argentine, implique la quasi-totalité des services de sécurité. Parmi eux, l'armée, la police fédérale, le Secrétariat d'information d'État (SIDE) et un groupe paramilitaire pro-junte connu sous le nom d'Alianza Anticomunista Argentina (AAA).\n\nLa politique américaine actuelle a préconisé le soutien au processus de réorganisation nationale, dans le cadre d'une vaste politique anticommuniste en Amérique latine. Cependant, certains responsables de Langley et de Foggy Bottom ont exprimé leur inquiétude quant à un soutien excessif à l'armée argentine, notamment en raison de son implication dans l'opération Condor avec d'autres pays d'Amérique du Sud. Un changement de politique pourrait s'avérer nécessaire afin de modérer les intérêts et les ambitions américaines en Amérique du Sud à l'avenir."
 CIA_CONDOR.2.d:0 "Dans un retournement de situation surprenant, un porte-parole du Département d'État a confirmé aujourd'hui que les États-Unis cesseraient, à compter d'aujourd'hui, de soutenir le processus de réorganisation nationale argentin dans son intégralité, invoquant de nombreuses violations des droits humains commises par la junte militaire argentine au pouvoir.\n\nInvoquant des assassinats transnationaux illégaux et d'autres atrocités contre leurs propres citoyens dans le cadre d'une prétendue opération connue sous le nom d'« Opération Condor », les États-Unis ont opéré un revirement brutal de leur politique dans la région. On ignore si des condamnations similaires seront prononcées contre le Chili, le Brésil, l'Uruguay et d'autres dictatures militaires sud-américaines, mais cette évolution demeure particulièrement significative, notamment à Buenos Aires."
 CIA_CONDOR.3.d:0 "L'ambassade des États-Unis en Argentine a annoncé une nouvelle regrettable : la Maison-Blanche et le Pentagone ont convenu de mettre fin au soutien aux paramilitaires que nous avons utilisés dans notre lutte contre la menace communiste et de gauche. Dans leur déclaration, l'ambassade a fait part de ses « inquiétudes concernant l'utilisation de l'Alianza Anticomunista Argentina dans des opérations militaires », ainsi que de diverses allégations de violations des droits humains par l'armée, l'AAA et d'autres paramilitaires pro-junte.\n\nIl s'agit d'une évolution totalement inattendue de la part de Washington, qui, par le passé, a encouragé une intensification des activités de contre-insurrection anticommuniste et a fourni une assistance secrète par le biais de ses services de renseignement et de liaisons militaires, ainsi que par le biais du système Condor."
 CIA_CONDOR.4.d:0 "L'ambassade des États-Unis au Chili a annoncé une nouvelle regrettable : la Maison-Blanche et le Pentagone ont convenu de mettre fin au soutien aux paramilitaires que nous avons utilisés dans notre lutte contre les guérillas communistes pro-Allende et de gauche dans le pays. Dans leur déclaration, l'ambassade a fait part de ses « inquiétudes concernant l'utilisation de groupes paramilitaires de droite dans des opérations militaires », ainsi que de diverses allégations de violations des droits humains par le régime militaire au pouvoir et les groupes paramilitaires qu'il soutient.\n\nIl s'agit d'une évolution totalement inattendue de la part de Washington, qui, par le passé, a encouragé une intensification des activités de contre-insurrection anticommuniste et a fourni une assistance secrète par le biais de ses services de renseignement et de liaisons militaires, ainsi que par le biais du système Condor."
 CIA_CONDOR.5.d:0 "Aujourd'hui, dans une déclaration surprenante, le secrétaire d'État américain [GetCurrentSecState] et le procureur général [GetCurrentAG] ont annoncé conjointement leur effort conjoint pour traduire en justice les criminels de guerre nazis se cachant en Amérique du Sud, par l'intermédiaire d'une force opérationnelle interinstitutions. Cette force sera chargée de rechercher, de négocier et d'arrêter les responsables nazis résidant en Argentine, au Brésil, au Chili et dans d'autres pays d'Amérique du Sud, notamment des personnalités célèbres comme Klaus Barbie, Sandor Kepiro, Erich Priebke et Dinko Sakic.\n\nLes régimes militaires d'Argentine, du Brésil et du Chili n'ont pas encore réagi, mais on s'attend à ce que les Américains se heurtent à une forte résistance, les gouvernements militaires ayant accepté de cacher et de protéger d'anciens nazis. La Maison Blanche devrait chercher à extrader ces personnes, soit pour qu'elles soient jugées aux États-Unis, soit devant un tribunal international."
 CIA_CONDOR.6.d:0 "COLLABORATION AVEC D'ANCIENS RESPONSABLES NAZIS EN AMÉRIQUE DU SUD\nBureau Argentine, Bureau des opérations latino-américaines, Direction des opérations ; Attaché de défense américain, AMBASSADE DE BUENOS AIRES\nSECRET/NOFORN\n\nCes dernières années, la priorité absolue accordée aux opérations de contre-insurrection dans le Cône Sud ayant été accordée aux États-Unis en Amérique du Sud, des discussions ont eu lieu, tant au sein des services de renseignement américains qu'au sein des agences membres sud-américaines du Condor (SIDE argentin, DINA chilienne), sur d'éventuelles opportunités de cooptation et de coopération d'anciens responsables nazis résidant en Amérique du Sud.\n\nPar conséquent, le Bureau Argentine, avec le soutien de l'ambassade de Buenos Aires et du bureau de l'attaché de défense, soumet les propositions suivantes concernant d'éminents responsables nazis du Cône Sud susceptibles d'être contactés et utilisés à des fins opérationnelles :\n\n1. Klaus Barbie, surnommé le « Boucher de Lyon », lourdement responsable des atrocités commises contre la Résistance française pendant la Seconde Guerre mondiale ; il a brièvement été membre du contre-espionnage de l'armée américaine, qui l'a aidé à s'échapper en Bolivie. Il est actuellement à la solde des services de renseignement ouest-allemands (BND) et est fortement impliqué dans le gouvernement militaire bolivien au pouvoir. À ce titre, Barbie aurait participé à la traque de Che Guevara. Son influence au sein du gouvernement bolivien et son expérience en matière de contre-insurrection font de lui un candidat de choix pour une coopération.\n\n2. Erich Priebke, commandant de police SS de rang intermédiaire pendant la Seconde Guerre mondiale, responsable d'un massacre à Rome en mars 1944 qui fit 335 morts parmi les civils italiens. Priebke devait être jugé, mais il a réussi à s'échapper d'un camp de prisonniers britannique en Italie et vit actuellement à Bariloche, en Argentine, sous un nom d'emprunt. Priebke était connu pour être un commandant compétent et pouvait être utilisé par les forces alliées pour soutenir les activités de police dans la région.\n\n3. Dinko Sakic, fonctionnaire oustachis croate, commandant du camp de concentration de Jasenovac en Yougoslavie occupée, était un collaborateur nazi déclaré et s'est réfugié en Argentine, puis au Paraguay à la fin des années 1940. Ami connu du dirigeant paraguayen, le général Alfredo Stroessner, il s'est imposé comme un leader de la petite communauté d'émigrés croates au Paraguay et dans la région. Son expérience des camps d'internement, ainsi que son fort anticommunisme, font de lui un candidat idéal pour une coopération, notamment au Paraguay.\n\nL'ambassade à Buenos Aires et ce bureau estiment que ces trois hommes, correctement identifiés et contactés, devraient contribuer à l'engagement américain en Amérique du Sud, ainsi qu'au système Condor dans le Cône Sud."
 CIA_CONDOR.7.d:0 "De terribles nouvelles nous sont parvenues de l'ambassadeur des États-Unis, arrivé aujourd'hui à La Casa Rosada avec une équipe pour informer le gouvernement militaire argentin que les États-Unis mettaient fin, avec effet immédiat, à tout soutien à la République argentine. Des inquiétudes ont apparemment été soulevées à Washington et ont circulé à la Maison-Blanche, à Foggy Bottom et à Langley, quant à l'ampleur et à la profondeur de la coopération américaine avec notre gouvernement, notamment en ce qui concerne le soutien secret et le soutien à la contre-insurrection dans le cadre de nos opérations anticommunistes en cours.\n\nCela a suscité une vive réaction de la part d'officiers éminents de notre gouvernement, qui affirment que le Processus de Réorganisation Nationale est allé trop loin dans ses opérations internes ainsi que dans sa participation à l'opération Condor. De nombreux officiers, même ceux ayant suivi une formation militaire aux États-Unis, ont condamné Washington pour son insolence dans cette affaire et exhorté l'ambassade à reconsidérer sa déclaration. Cependant, il semble que les forces armées argentines ne bénéficieront plus du soutien américain, à moins que nous ne parvenions à convaincre les Américains de nous reprendre."
 CIA_CONDOR.8.d:0 "Dans une déclaration sans surprise faite aujourd'hui à Washington, le secrétaire d'État américain [GetCurrentSecState], accompagné du conseiller à la sécurité nationale [GetCurrentNatSecAdv], a réaffirmé son engagement à soutenir le gouvernement militaire argentin, officiellement connu sous le nom de Processus de réorganisation nationale.\n\nRéitérant « l'engagement des États-Unis à aider l'Argentine à lutter contre l'insurrection et les défis transnationaux en matière de sécurité », le secrétaire d'État a confirmé au monde l'engagement ouvert des États-Unis dans les affaires sud-américaines, donnant ainsi un chèque en blanc à la junte argentine pour poursuivre sa brutale campagne de contre-insurrection."
 CIA_CONDOR.9.d:0 "Une bonne nouvelle est arrivée aujourd'hui de Washington : le secrétaire d'État américain [GetCurrentSecState] a confirmé publiquement le soutien continu des États-Unis au gouvernement militaire argentin. Une déclaration et un appel téléphonique de l'ambassade des États-Unis à Buenos Aires à La Casa Rosada ont réitéré ce fait. L'ambassadeur américain a adressé ses plus chaleureuses salutations et a déclaré que l'attaché de défense serait heureux de poursuivre les contacts avec ses collègues de l'armée de terre, de la marine et de l'armée de l'air argentines.\n\nLes membres de notre gouvernement se réjouissent de cette annonce, mais certains se demandent pourquoi les États-Unis ont dû revoir leurs positions politiques sur la question. Certains officiers du renseignement militaire au sein de notre gouvernement, notamment ceux du SIDE, ont émis l'hypothèse que la Maison-Blanche aurait envisagé de retirer son soutien, mais qu'elle s'était laissée convaincre par des membres de la CIA, du ministère de la Défense et d'autres agences de sécurité nationale influentes. Quoi qu'il en soit, nous acceptons cette évolution à bras ouverts."
 CIA_PERU.0.d:0 "INSURRECTION AU PÉROU : LE SENTIER LUMINEUX\nBureau Pérou, Bureau d'analyse latino-américaine, Direction du renseignement, CIA ; Attaché de défense, AMBASSADE À LIMA\nSECRET/NOFORN\n\nDepuis 1980, le Pérou, pays du nord-est de l'Amérique du Sud, est en proie à une insurrection persistante dans les zones rurales, qui a nécessité le déploiement complet des forces armées péruviennes. Connue sous le nom de Sandero Luminoso, ou « Sentier lumineux », cette insurrection est principalement composée de guérilleros maoïstes indépendants du Parti communiste péruvien, d'orientation marxiste-léniniste.\n\nFondé en 1969 par Abimael Guzman, connu au Pérou sous le nom de « Président Gonzalo », le Sentier lumineux a lancé sa campagne de terreur lors des élections de 1980, incendiant des urnes, puis déclenchant une escalade de violence et de terreur à grande échelle, principalement concentrée dans les provinces andines d'Ayacucho, d'Apurimac et de Huancavelica.\n\nLa réponse du gouvernement péruvien à l'insurrection a d'abord été modérée, mais des zones d'urgence ont été créées ces dernières années, conférant aux forces armées un contrôle quasi total sur la gouvernance locale et le pouvoir de procéder à des détentions arbitraires. Cependant, ces actions n'ont pas été suffisantes. Le Sentier lumineux a mené plusieurs opérations de sabotage d'infrastructures de premier plan, notamment en coupant l'électricité à Lima, la capitale, et en posant des bombes près des bâtiments gouvernementaux. D'éminents responsables politiques et militaires péruviens ont également été assassinés, dont le président du Conseil national électoral, ainsi que des figures de gauche et marxistes opposées au Sentier lumineux.\n\nLes responsables américains au Pérou ont exprimé leur profonde inquiétude face à la réaction du gouvernement péruvien et ont plaidé pour un soutien américain renforcé. Langley a identifié plusieurs pistes, notamment l'extension de l'aide à la sécurité des forces armées péruviennes et l'affaiblissement direct du soutien populaire au Sentier lumineux dans les zones rurales andines."
 CIA_PERU.1.d:0 "L'ARMÉE PÉROU : CAPACITÉS ET POTENTIEL DE MODERNISATION\nBureau Pérou, Bureau d'analyse latino-américaine, CIA ; Attaché de défense, AMBASSADE DE LIMA\nSECRET/NOFORN\n\nCes dernières années, les forces armées péruviennes ont démontré leur supériorité tactique parmi les plus importantes de la région andine, voire de l'Amérique du Sud. Cependant, la dépendance passée du Pérou à l'égard de l'armement et de l'aide soviétiques a considérablement affaibli ses efforts de modernisation, notamment dans le cadre de sa campagne anti-insurrectionnelle contre la guérilla communiste du « Sentier lumineux ». L'attaché de défense et l'ambassade de Lima y voient une opportunité d'intensifier le soutien américain, les Péruviens étant vulnérables et ouverts à des équipements occidentaux plus modernes.\n\n1. L'armée péruvienne souhaite vivement recevoir davantage d'aide militaire américaine, principalement en raison de son mécontentement vis-à-vis de la logistique soviétique et de la supériorité technologique perçue de l'Occident. Parmi les contrats en cours, un contrat de 110 millions de dollars prévoit l'acquisition par l'armée de 15 hélicoptères d'assaut/de transport UH-60 Blackhawk, destinés à remplacer les Mi-8 vieillissants. Des officiers de l'armée ont également manifesté leur intérêt pour l'achat de jusqu'à 50 chars de combat principaux M60A3, afin de contrebalancer les achats chiliens de chars auprès de la France et d'Israël. La vente de jusqu'à 200 véhicules blindés de transport de troupes M113 est également envisagée.\n\n2. La marine péruvienne dispose d'une capacité impressionnante pour les marines sud-américaines, mais elle a récemment souffert de la vétusté de ses navires, du manque de systèmes de missiles et d'une capacité aérienne limitée, voire inexistante. La marine a entrepris l'acquisition de frégates de classe Lupo auprès d'Italie, ainsi que de plusieurs hélicoptères maritimes SH-3 auprès de notre pays ; elle recherche toutefois davantage de moyens aériens, notamment des avions de patrouille maritime et des missiles S-2, ainsi que des LST d'anciens modèles, pour soutenir les opérations amphibies des marines.\n\n3. L'armée de l'air péruvienne dispose d'une variété d'avions de combat et se distingue comme la troisième force aérienne d'Amérique du Sud. Elle cherche néanmoins à étendre ses capacités de contre-insurrection, d'appui aérien rapproché et de transport en acquérant des hélicoptères Bell 214T, des avions de transport civils L-100-30 (C-130) et, éventuellement, le tout nouveau A-10 Thunderbolt CAS.\n\nEn conclusion, toutes les branches des forces armées péruviennes ont exprimé leur souhait de disposer d'armements occidentaux, voire américains. Forts de notre expérience en contre-insurrection, nous devons fournir des armes et un soutien au Pérou pour lui permettre d'atteindre ses objectifs."
 CIA_PERU.2.d:0 "LOIS SUR LES ARMES À FEU AU PÉROU : RECOMMANDATIONS DE RÉFORME\nBureau Pérou, Bureau d'analyse latino-américaine, Direction du renseignement, CIA ; Attaché de défense, AMBASSADE DE LIMA\nSECRET/NOFORN\n\nLa récente intensification des activités insurrectionnelles, tant du « Sentier lumineux » maoïste (Sandero Luminoso) que du Mouvement révolutionnaire Tupac Amaru (MRTA), a pratiquement épuisé les capacités militaires conventionnelles du gouvernement péruvien. Les renseignements indiquent que la région de Valle de los Rios Apurimac, Ene et Mantaro (VRAEM), à majorité autochtone, bénéficie d'un large soutien du Sentier lumineux, toute résistance étant entravée par des lois répressives sur les armes à feu.\n\nLa législation péruvienne sur les armes à feu est conservatrice depuis la période coloniale espagnole, ciblant notamment les populations indigènes incas, dont les Espagnols craignaient qu'elles ne résistent à leurs ambitions coloniales. Cependant, la loi est restée en vigueur, empêchant essentiellement les communautés rurales, majoritairement autochtones, de se défendre contre les menaces communistes.\n\nL'ambassade de Lima et l'attaché de défense ont proposé de faire pression sur le gouvernement péruvien pour qu'il abroge sa loi sur les armes à feu, arguant que cela permettrait aux communautés autochtones de former des milices anticommunistes ou anti-Sandero Luminoso et des organisations de défense autonomes (connues localement sous le nom de « rondas campesinas » ou « rondes paysannes »). Ces organisations seraient très utiles aux forces gouvernementales péruviennes dans leur campagne anti-insurrectionnelle en cours, les unités locales s'avérant légèrement plus efficaces, comme cela a été démontré dans d'autres conflits.\n\nDes renseignements préliminaires provenant de sources au sein du gouvernement péruvien indiquent que l'abrogation des lois sur les armes à feu bénéficie d'un large soutien, tant au sein du pouvoir législatif que de l'armée ; les renseignements concernant la communauté autochtone ont également révélé une certaine volonté de contribuer aux opérations de contre-insurrection, mais sous réserve de réformes supplémentaires visant à soutenir les populations autochtones."
 CIA_PERU.3.d:0 "SOUTIEN À SANDERO LUMINOSO DANS LES ZONES RURALES DU PÉROU : OPPORTUNITÉS ET ANALYSES\nBureau Pérou, Bureau d'analyse latino-américaine, Direction du renseignement, CIA ; Attaché de défense, AMBASSADE DE LIMA\nSECRET/NOFORN\n\nEn pleine insurrection au Pérou, les services de renseignement accordent une attention particulière à la région rurale de Valle de los Rios Apurimac, Ene et Mantaro, dans la cordillère des Andes, comme lieu de concentration pour la lutte contre le mouvement de guérilla maoïste Sandero Luminoso (Sentier lumineux, ou SL). Le soutien à SL est important dans cette région, qui abrite une importante population indigène inca et quechua, largement ignorée et marginalisée par le gouvernement central de Lima.\n\nL'ambassade de Lima et l'attaché de défense estiment que saper le soutien de SL dans cette région, en faisant pression sur le gouvernement péruvien pour qu'il procède à des réformes et modifie systématiquement ses tactiques de contre-insurrection, permettra de réorienter le soutien de SL vers le gouvernement péruvien.\n\n1. Des réformes juridiques pourraient être préférables pour les populations autochtones, car les Incas, les Quechuas et les autres « Amérindiens » sont juridiquement distincts des autres groupes ethniques et bénéficient donc de droits différents. Ces réformes pourraient également inclure une autonomie accrue des collectivités locales et une législation linguistique permettant une plus grande flexibilité dans l'utilisation des langues autochtones.\n\n2. Les réformes agraires rurales sont une recommandation claire au gouvernement péruvien pour obtenir le soutien des groupes autochtones. Le niveau actuel de soutien aux SL s'explique par le discours sur l'exploitation des terres autochtones et par le manque d'écoute du gouvernement central face aux besoins des populations autochtones. La réforme agraire pourrait inclure des initiatives de décentralisation supplémentaires, des coopératives autochtones locales, comme cela a été fait précédemment, et des subventions à l'agriculture.\n\n3. Sur le plan militaire, il est absolument nécessaire de faire pression sur les forces armées péruviennes pour obtenir des règles d'engagement plus complètes. Une grande partie du soutien aux SL provient également des actions du gouvernement péruvien qui ont entraîné la mort de civils, principalement par vengeance et autres atrocités, en raison de l'absence de règles d'engagement lors des opérations de contre-insurrection. L'attaché de défense recommande de renforcer la pression sur les généraux péruviens en menaçant de suspendre l'aide pour atteindre cet objectif.\n\nEn communiquant efficacement ces souhaits au gouvernement péruvien et en lançant une campagne d'action civile auprès de la population indigène, l'opinion publique devrait commencer à se retourner contre les guérilleros du Sandero Luminoso et assurer une plus grande opérabilité des forces gouvernementales péruviennes."
 CIA_PERU.4.d:0 "L'attaché juridique de l'ambassade des États-Unis à Lima nous a contactés, par l'intermédiaire du ministre de la Justice, avec une proposition urgente de réformes juridiques que notre gouvernement pourrait mettre en œuvre dans les départements andins à majorité autochtone. Selon son bureau, ces propositions comprennent l'extension de l'autonomie des groupes autochtones en matière de gouvernement local, la modification des définitions juridiques et des droits des peuples inca et quechua, et l'extension des protections linguistiques dans ces régions.\n\nCertains membres de notre gouvernement ont exprimé leur soutien, arguant que l'adhésion de la communauté autochtone, dont la plupart constituent l'essentiel du soutien du Sandero Luminoso (SL), les inciterait à se retourner contre le SL et à se tourner vers notre gouvernement. Cependant, certains officiers militaires conservateurs et autres responsables gouvernementaux restent sceptiques, affirmant que ce n'est pas le moment d'étendre les réformes à une zone violente et sans loi du pays où se déroulent des opérations. Comment réagir ?"
 CIA_PERU.5.d:0 "L'attaché juridique de l'ambassade des États-Unis à Lima a indiqué que le gouvernement péruvien avait accepté sa proposition de réformes juridiques globales axées sur les communautés autochtones. Le ministre péruvien de la Justice, lors d'un entretien téléphonique avec l'ambassadeur et l'attaché juridique, a confirmé cette acceptation et indiqué qu'ils allaient restaurer l'autonomie locale des communautés inca et quechua par décret exécutif, mais que la législation relative à la langue et aux droits juridiques supplémentaires prendrait du temps au Congrès de la République.\n\nL'attitude du gouvernement péruvien est jugée positive, l'espoir étant que la communauté autochtone commencera à se tourner vers le gouvernement central et à s'opposer au groupe de guérilla Sandero Luminoso (Sentier lumineux). L'attitude à Langley et à Foggy Bottom est également positive, l'espoir étant que les réformes envisagées aboutiront."
 CIA_PERU.6.d:0 "Malheureusement, l'attaché juridique de l'ambassade des États-Unis à Lima a signalé que le gouvernement péruvien avait rejeté sa proposition de réformes juridiques concernant la communauté indigène des hauts plateaux andins. Initialement proposées pour inciter les populations indigènes à soutenir le gouvernement central de Lima plutôt que le Sandero Luminoso, ces réformes ont été rapidement rejetées, estimant qu'elles n'étaient « ni opportunes ni nécessaires face à l'urgence nationale provoquée par les terroristes communistes », selon le ministre péruvien de la Justice dans un communiqué.\n\nLes responsables du Département d'État et de la CIA, ainsi que ceux de l'ambassade, sont mécontents de cette évolution, la considérant comme une perte pour le gouvernement péruvien et une perte d'influence des États-Unis dans le pays."
 CIA_PERU.7.d:0 "Un fonctionnaire de l'ambassade des États-Unis à Lima nous a contactés, par l'intermédiaire du ministre de l'Agriculture, avec une proposition urgente de réformes agraires rurales que notre gouvernement pourrait mettre en œuvre dans les départements andins à majorité indigène. Selon ce fonctionnaire, ces propositions comprennent la création de coopératives foncières indigènes locales, de nouvelles mesures de décentralisation par le gouvernement central à Lima, ainsi que le lancement de subventions et d'autres aides aux exploitations agricoles et aux coopératives.\n\nCes propositions ont suscité une vive controverse au sein de notre gouvernement, la plupart des politiciens conservateurs et des officiers militaires les jugeant inappropriées et trop à gauche, rappelant la propagande de Sandero Luminoso diffusée dans ces régions. Cependant, de nombreux officiers et politiciens de tendance libérale affirment que ces réformes, bien que limitées, pourraient soutenir notre cause, notamment auprès des populations indigènes qui se sentent négligées ou discriminées en matière de politiques foncières et qui, de ce fait, se tournent vers le SL pour atteindre leurs objectifs. Comment choisir ?"
 CIA_PERU.8.d:0 "Un fonctionnaire agricole attaché à l'ambassade des États-Unis à Lima a signalé que le gouvernement péruvien, par l'intermédiaire du ministre de l'Agriculture, avait accepté une proposition américaine de réforme rurale dans les hauts plateaux andins. Initialement proposée pour rallier le soutien des populations autochtones, qui se sentent marginalisées et constituent la majeure partie du soutien du Sentier lumineux (Sandero Luminoso), cette réforme comprend la création de coopératives foncières autochtones, des initiatives de décentralisation et des subventions aux agriculteurs.\n\nGénéralement considéré comme voué à l'échec par le gouvernement péruvien, fortement conservateur et anticommuniste, ce programme de réformes devrait être approuvé prochainement, selon le ministre péruvien de l'Agriculture. Les responsables du Département d'État et de la CIA se réjouissent de cette évolution, et le président espère en être informé prochainement."
 CIA_PERU.9.d:0 "Malheureusement, l'ambassade des États-Unis à Lima rapporte que le gouvernement péruvien a rejeté catégoriquement toutes les propositions de réforme rurale dans la région des hauts plateaux andins. Proposée comme stratégie pour attirer un soutien autochtone crucial dans la campagne anti-insurrectionnelle en cours contre le Sentier lumineux, cette mesure a été dénoncée par le ministre péruvien de l'Agriculture dans un communiqué, la qualifiant de « faisant le jeu de Guzman et de ses terroristes maoïstes » et « affaiblissant le pouvoir de la République à un moment crucial où la sécurité est primordiale ».\n\nDes responsables du Département d'État et de la CIA seraient frustrés par cette évolution, car il semble que l'avancée américaine au Pérou s'amenuise. Le président devait être informé de ces développements, mais de hauts responsables ont décidé de ne pas le lui communiquer pour le moment."
 CIA_PERU.10.d:0 "L'attaché de défense de l'ambassade des États-Unis à Lima nous a adressé, par l'intermédiaire du ministre de la Défense, une proposition urgente concernant les règles d'engagement des unités et du personnel des forces armées péruviennes dans leur campagne anti-insurrectionnelle actuelle contre la guérilla maoïste Sandero Luminoso. L'attaché a suggéré plusieurs exemples de règles d'engagement plus complètes, notamment l'application des opérations d'action civile, la rédaction de rapports d'incidents, une structure de commandement plus rigide et la présence d'inspecteurs généraux militaires indépendants dans chaque unité.\n\nDes généraux de haut rang des forces armées se sont fermement opposés à cette proposition, la jugeant contraire à une campagne relativement réussie jusqu'à présent, les troupes gouvernementales opérant en toute impunité. Ils affirment que des règles d'engagement rigides feraient le jeu des communistes, entraîneraient la perte de l'intégrité opérationnelle et priveraient les forces gouvernementales de toute tactique de surprise. Les partisans, quant à eux, affirment que de telles règles atténueraient l'ampleur des atrocités futures et légitimeraient davantage l'armée en tant que force de police de l'État. Comment choisir ?"
 CIA_PERU.11.d:0 "L'attaché de défense de l'ambassade des États-Unis à Lima a indiqué que le gouvernement péruvien avait accepté à contrecœur un projet de règles d'engagement pour les forces armées dans leur campagne anti-insurrectionnelle contre le groupe de guérilla maoïste Sandero Luminoso (Sentier lumineux). Proposées comme moyen de protéger les forces gouvernementales et de prévenir de nouvelles atrocités commises par l'armée, ces règles d'engagement prévoient des chaînes de commandement plus strictes, un inspecteur général indépendant et des sanctions plus sévères pour les soldats accusés.\n\nLes responsables du Département d'État et de la CIA se félicitent de cette évolution, mais restent quelque peu préoccupés par le fait que les forces armées péruviennes pourraient ne pas tenir leurs promesses. Des mesures d'application supplémentaires seront nécessaires pour garantir que le Pérou respecte sa part du contrat."
 CIA_PERU.12.d:0 "Malheureusement, l'attaché de défense de l'ambassade des États-Unis à Lima a signalé que le gouvernement et les forces armées péruviennes ont rejeté catégoriquement nos propositions visant à élaborer des règles d'engagement plus complètes dans le cadre de leur campagne anti-insurrectionnelle actuelle contre le groupe de guérilla communiste Sandero Luminoso. Un porte-parole du ministère péruvien de la Défense a condamné cette proposition, la qualifiant de « tentative de contrôle des affaires intérieures du Pérou » et affirmant que « ces prétendues atrocités sont des tentatives des terroristes communistes de se décharger de leurs propres crimes ».\n\nLes responsables du Département d'État et de la CIA ne sont pas satisfaits de cette évolution, mais pas totalement surpris. Les États-Unis devront envisager d'autres possibilités d'intervention au Pérou à l'avenir."
 CIA_PERU.13.d:0 "Il était tôt le matin dans la salle de crise, lorsque le président [USA.GetLeader] est entré, à moitié nu, réveillé seulement 15 minutes plus tôt. La salle était en effervescence, mais le silence s'est brusquement installé à son entrée. Toute la salle s'est levée, puis s'est rassurée avec un signe de la main.\n\n« Quelle est la situation ? Directeur, partez.»\n\nLe directeur de la CIA, [GetCurrentCIADir], s'est levé. « Monsieur le Président, il y a environ deux heures, nous avons été informés par des agents toujours en poste au Pérou que la capitale, Lima, était officiellement tombée aux mains des insurgés communistes, menés par le groupe de guérilla maoïste Sandero Luminoso, ou Sentier lumineux. » \n\nLe secrétaire d'État [GetCurrentSecState] est intervenu : « Comme vous le savez, Monsieur le Président, l'ambassade de Lima a été évacuée il y a plusieurs jours et du personnel a été héliporté au Brésil. Officiellement, aucun membre du gouvernement américain n'est encore présent sur place. Nous ignorons le nombre de citoyens américains et d'agents de renseignement intégrés encore présents dans le pays, mais nous faisons de notre mieux pour communiquer avec les pays voisins, l'Équateur et le Chili, afin de déterminer leur localisation. Par ailleurs, des réunions d'urgence du Conseil de sécurité des Nations Unies et de l'Organisation des États américains (OEA) ont été convoquées plus tard ce matin à New York et ici à Washington. Des ambassadeurs se rendront à ces deux réunions et nous ferons pression activement pour obtenir la solution qui sera trouvée ce soir.»\n\nLe conseiller à la sécurité nationale [GetCurrentNatSecAdv] s'est alors levé. « Monsieur le Président, la plupart des responsables présents ce soir se sont mis d'accord sur au moins deux pistes d'action possibles. Nous ne pouvons laisser cette action du Sentier Lumineux sans réponse, surtout compte tenu de notre engagement continu en Amérique du Sud et, en particulier, de notre assistance au gouvernement péruvien désormais renversé. Deux options s'offrent donc à nous : la voie diplomatique, condamnant et sanctionnant, en utilisant les pouvoirs de l'ONU, de l'OEA et d'autres organismes régionaux ; ou la voie plus interventionniste, qui impliquerait la formation d'une coalition par les armées américaines et, probablement, régionales, et la reprise de zones peuplées. »\n\nPlusieurs officiers, dont le commandant du Commandement Sud des États-Unis, ont pris la parole. « Monsieur le Président, le Commandement Sud des États-Unis a suivi l'évolution de la situation et a retiré du pays tout le personnel américain et la plupart des hauts responsables militaires péruviens. Nous préparons des plans opérationnels possibles, notamment des opérations multinationales, mais l'efficacité d'une intervention reste incertaine, notamment contre une guérilla solide et expérimentée.»\n\n« Très bien.» Le Président soupira en regardant autour de lui. « Monsieur le Secrétaire, proposez-moi des sanctions et des solutions diplomatiques possibles. Je veux toutes les options militaires possibles et, avant toute action, nous avons besoin d'assurances diplomatiques. Appelez-nous et nous nous retrouverons dans quelques heures. »"
 CIA_PERU.14.d:0 "AVIS SUR LES SANCTIONS CONTRE LE PÉROU\nBureau du contrôle des avoirs étrangers, Département du Trésor des États-Unis\n\nEn application des résolutions du Conseil de sécurité des Nations Unies et de l'Organisation des États américains, les États-Unis imposent les sanctions économiques suivantes aux personnes et aux industries suivantes en République du Pérou.\n\n1. Abimael Guzman, de nationalité péruvienne, né le 3 décembre 1934 ; communément appelé « Président Gonzalo », président du Parti communiste du Pérou, fondateur du Sentier lumineux en 1969 et dirigeant provisoire du Pérou après la prise de pouvoir du pays par le Sentier lumineux ;\n\n2. Augusta Deyanira La Torre Carrasco, de nationalité péruvienne, née le 29 août 1946 ; communément appelée « Camarade Norah », reconnue comme numéro deux du Sentier lumineux et épouse de Guzman.\n\n3. Florindo Eleuterio Flores Hala, de nationalité péruvienne, né le 8 septembre 1961 ; communément appelé « camarade Artemio », commandant en chef de l'Armée de guérilla populaire, principale force combattante du Sentier lumineux.\n\n4. Oscar Ramirez Duran, de nationalité péruvienne, né le 16 mars 1953 ; communément appelé « camarade Feliciano », haut dirigeant du Sentier lumineux et généralement considéré comme le numéro trois et possible successeur de Guzman.\n\n5. Osman Morote Barrionuevo, de nationalité péruvienne, né le 15 avril 1945 ; communément appelé « camarade Nicolas », haut dirigeant du Sentier lumineux et généralement considéré comme l'un des commandants en chef et successeurs de Guzman.\n\n6. Les industries péruviennes d'extraction de cuivre et d'argent, y compris toutes les mines, les sociétés minières détenues par des Péruviens et les sociétés d'import-export.\n\n7. L'industrie péruvienne du bois, y compris toutes les entreprises d'exploitation forestière, les sociétés détenues par des Péruviens et les sociétés d'import-export.\n\nCes sanctions entrent en vigueur immédiatement.\n\nSIGNATURE\nSecrétaire au Trésor des États-Unis"
 CIA_PERU.15.d:0 "Suite à la prise de pouvoir communiste au Pérou par le mouvement maoïste du Sentier lumineux, le gouvernement américain a officiellement imposé des sanctions au Pérou, ciblant à la fois des individus et des dirigeants spécifiques du groupe Sandero Luminoso, ainsi que les principales industries d'exportation du pays. Selon un communiqué du Bureau du contrôle des avoirs étrangers du Département du Trésor américain, « des sanctions ont été imposées à Abimael Guzman, chef du groupe du Sentier lumineux, ainsi qu'à sa famille, ses amis, ses hauts dirigeants et d'autres hauts responsables du Parti communiste péruvien ».\n\nOn ignore encore comment l'économie péruvienne sera directement affectée par ces sanctions, alors que le pays est en pleine transition vers un régime communiste. Les observateurs internationaux ont qualifié ces sanctions de simple remontrance diplomatique, contrairement à la politique américaine passée, tandis que les alliés sud-américains ont déploré que cette politique soit insuffisante."
 CIA_PERU.16.d:0 "OPÉRATION COPPER EAGLE : PLAN OPÉRATIONNEL\nQuartier général du Commandement Sud des États-Unis ; Quartier général des forces armées équatoriennes ; Quartier général des forces armées chiliennes\nSECRET/NOFORN\n\nEn violation des résolutions du Conseil de sécurité des Nations Unies et de l’Organisation des États américains exigeant la reconduction du gouvernement légitime du Pérou, le groupe de guérilla du Sentier lumineux et sa force armée, l’Armée de guérilla populaire, ont violé le droit international et les principes de paix et de sécurité. Avec l’approbation de la communauté internationale, les États-Unis ont formé une coalition avec les États voisins, l’Équateur et le Chili, afin de faciliter une opération multinationale rapide et sans heurts visant à rétablir l’ordre démocratique au Pérou.\n\n1. Les unités du Commandement Sud des États-Unis (USSOUTHCOM), dont la Force opérationnelle interarmées Bravo basée à Palmerola, au Honduras ; la 193e Brigade d’infanterie basée à Panama ; et toutes les unités associées de la Marine et de l’Armée de l’air américaines, seront chargées de la prise aéroportée et amphibie de la capitale, Lima, au Pérou.\n\n2. Des unités des forces armées équatoriennes, dont l'armée de terre et l'armée de l'air équatoriennes, seront chargées de l'avancée vers le sud, de la frontière péruvienne jusqu'à la ville de Trujillo, au Pérou, où elles rejoindront les forces américaines et celles associées au gouvernement.\n\n3. Des unités des forces armées chiliennes, dont l'armée de terre et l'armée de l'air chiliennes, seront chargées de l'avancée étroite vers le nord, de la frontière péruvienne vers les villes d'Arequipa et de Cuzco.\n\n4. Des unités de l'ancien gouvernement péruvien et des forces armées péruviennes assureront des fonctions de liaison et de soutien, servant de guides contre-insurrectionnels, de navigateurs, d'interprètes et d'actions civiques. Des règles d'engagement pour toutes les parties, élaborées par l'USSOUTHCOM, seront promulguées afin de réduire les pertes civiles.\n\nLe commandement opérationnel de l'opération Copper Eagle sera délégué au commandant du Commandement Sud des États-Unis ; les chefs d'état-major des forces armées équatoriennes et chiliennes auront la possibilité de désigner un adjoint. Jusqu'à la prise de Lima, toutes les opérations de commandement seront basées à Panama (Panama), à Quito (Équateur) ou à Santiago (Chili).\n\nSIGNÉ\nCommandant du Commandement Sud des États-Unis"
 CIA_PERU.17.d:0 "L'Amérique du Sud a été sous le choc aujourd'hui lorsque les États-Unis, soutenus par l'Équateur et le Chili, ont lancé l'opération « Aigle de Cuivre », une invasion multinationale du Pérou visant à « rétablir l'ordre démocratique » dans ce pays récemment pris par la guérilla communiste du Sentier Lumineux (Sandero Luminoso). Soutenues par les forces équatoriennes au nord et chiliennes au sud, des unités américaines de la 193e brigade d'infanterie et de la Force opérationnelle interarmées Bravo, ainsi que par l'appui aérien de la marine et de l'armée de l'air américaines, ont débarqué aux abords de Lima, la capitale, et ont commencé à établir une position solide.\nSi l'on ignore le succès de l'opération contre les forces du Sentier Lumineux, grâce à la sécurité opérationnelle assurée par la coalition américaine, on ne s'attend pas à ce que le conflit soit de courte durée, compte tenu de la relative robustesse des forces communistes. Les pays de l'Union soviétique et du bloc de l'Est, ainsi que Cuba, ont fermement condamné l'intervention, la qualifiant de nouvelle forme d'impérialisme américain."
 CIA_CHIAPAS.0.d:0 "INSURRECTION ZAPATISTE AU CHIAPAS : RÉSUMÉ\nBureau Mexique, Bureau d'analyse latino-américaine, Direction du renseignement\nSECRET/NOFORN\n\nRécemment, l'État du Chiapas, à l'extrême sud du Mexique, a été secoué par un nouveau mouvement insurrectionnel, baptisé Armée zapatiste de libération nationale (EZLN). Composée principalement d'autochtones et d'agriculteurs locaux pratiquant une agriculture de subsistance, l'EZLN a résisté à l'oppression du gouvernement de l'État du Chiapas et du gouvernement fédéral de Mexico en perpétrant une série d'attaques et d'enlèvements d'éminents et anciens fonctionnaires de l'État.\n\nAdhérant à une idéologie connue sous le nom de « néozapatisme », l'EZLN, ou Zapatistes, doit son nom à Emiliano Zapata, un leader de la Révolution mexicaine de 1910, et se compose principalement d'un mouvement de gauche, de culture indigène traditionnelle maya, de théologie catholique de la libération et de marxisme. Les zapatistes sont d'ardents défenseurs des droits fonciers communaux, notamment auprès de la population indigène mexicaine, et s'opposent à la mondialisation économique, arguant qu'elle est oppressive pour les populations locales et affecte négativement la vie de la classe paysanne.\n\nCes dernières semaines, l'EZLN a déclenché un soulèvement dans l'État du Chiapas, où elle opère principalement, attaquant des centres civiques et des bâtiments gouvernementaux dans les villes de San Cristobal de las Casas, Altamirano, Las Margaritas, Ocosingo et Chanal. Dans la plupart des cas, elle a été confrontée aux forces gouvernementales, semant le chaos avant de retourner dans la jungle lacandone, où le groupe opère principalement.\n\nLa réponse à cette situation reste floue. D'un côté, il s'agit d'un problème interne au Mexique ; de l'autre, soutenir les zapatistes est une forte tendance qui irait à l'encontre de la politique établie."
 CIA_CHIAPAS.1.d:0 "AUTONOMIE AU CHIAPAS : POSSIBILITÉS D’AVENIR\nBureau Mexique, Bureau d’analyse latino-américaine, Direction du renseignement\nSECRET/NOFORN\n\nLa récente opposition et insurrection indigènes dans l’État du Chiapas, au sud du Mexique, a galvanisé les appels à une plus grande autonomie de l’État. L’incapacité des forces fédérales mexicaines à contrôler efficacement la situation, et les mauvais traitements infligés par Mexico, ont suscité une vive attention de la part des responsables de la CIA et du Département d’État dans la région. Les pressions en faveur de l’autonomie exercées par les responsables de l’État du Chiapas et les membres de l’EZLN ont été prises en compte, et un éventuel statut d’autonomie du Chiapas pourrait avoir les objectifs et les effets suivants :\n\n1. Les forces de l’EZLN exercent déjà un contrôle suffisant sur le gouvernement de l’État du Chiapas, et toute nouvelle tentative du gouvernement fédéral mexicain pourrait engendrer un conflit plus large dans le pays, car les groupes antigouvernementaux et indigènes sont répandus dans tout le pays, en particulier après l’approbation de l’Accord de libre-échange nord-américain (ALENA).\n\n2. Les responsables mexicains nous ont fait pression pour obtenir une aide militaire supplémentaire. Nous soutenons toutefois une solution pacifique dans ce cas précis, car un conflit plus large affecterait nos relations économiques et l'économie mexicaine.\n\n3. Les services de renseignement ne sont pas favorables à une aide secrète à l'une ou l'autre des parties. Coordonner les négociations sur la création d'un État distinct pour le Chiapas, ou sur une plus grande autonomie au sein du gouvernement fédéral mexicain, renforcerait la légitimité des États-Unis, de l'EZLN et des autres parties prenantes."
 CIA_CHIAPAS.2.d:0 "L'ambassadeur des États-Unis à Mexico a présenté à notre gouvernement une proposition d'autonomie pour l'État du Chiapas, dans le sud du pays. Bien que notre campagne de contre-insurrection contre les forces séparatistes et zapatistes de gauche (EZLN) ait connu un succès mitigé, la proposition d'autonomie a été approuvée tant par la communauté internationale que par les gouvernements de l'État et fédéral du Chiapas. Ces propositions comprennent le transfert de pouvoirs économiques et budgétaires accrus au gouvernement du Chiapas, la limitation des opérations militaires et de sécurité fédérales dans l'État, et l'octroi de droits ethniques, linguistiques et fonciers accrus aux populations autochtones du Chiapas, dont la majorité fait partie du mouvement EZLN.\n\nLes membres progressistes de notre gouvernement font valoir les avantages potentiels de l'octroi de l'autonomie au Chiapas : la possibilité d'apaiser leur rébellion et de négocier de bonne foi avec l'EZLN sur la base de préoccupations et de revendications légitimes, tout en restant sous le contrôle général du gouvernement fédéral et en évitant de devenir un État souverain distinct. Les membres les plus conservateurs de notre gouvernement ont constamment mis en avant les inconvénients de l'octroi de l'autonomie au Chiapas, affirmant qu'ils feraient le jeu de l'EZLN et que d'autres États mexicains envisageraient également de réclamer leur autonomie au gouvernement fédéral, décentralisant ainsi davantage le contrôle de Mexico sur les États. Quel choix devrions-nous faire dans cette proposition ?"
 CIA_CHIAPAS.3.d:0 "L'ambassade des États-Unis à Mexico a annoncé que le gouvernement fédéral mexicain avait approuvé un projet de loi visant à accorder l'autonomie et de nouvelles réformes à l'État du Chiapas, à l'extrême sud du pays, à la frontière avec le Guatemala. Face à un mouvement réformiste et séparatiste indigène et de gauche connu sous le nom de zapatistes ou EZLN, le secrétaire mexicain à l'Intérieur a déclaré dans son communiqué qu'« en raison de circonstances atténuantes, l'État du Chiapas bénéficiera de ressources supplémentaires pour soutenir ses activités économiques et son autonomie », notamment une restriction des activités militaires fédérales dans l'État, une déréglementation des politiques fiscales et financières de l'État, et un élargissement des pouvoirs du gouverneur du Chiapas.\n\nBien que peu impliqués dans la question zapatiste, les décideurs politiques mexicains et latino-américains à Washington se réjouissent de cette évolution, qui permet une plus grande autonomie et une moindre implication des autorités fédérales auprès des populations indigènes locales, confrontées à la répression politique et économique par le passé."
 CIA_CHIAPAS.4.d:0 "L'ambassade des États-Unis à Mexico a annoncé que le gouvernement fédéral mexicain avait rejeté un projet de loi visant à accorder l'autonomie et de nouvelles réformes à l'État du Chiapas, à l'extrême sud du pays, à la frontière avec le Guatemala. Face à un mouvement réformiste indigène et de gauche, les zapatistes ou l'EZLN, le secrétaire d'État mexicain à l'Intérieur a réitéré dans un communiqué que « les préoccupations légitimes peuvent être satisfaites par d'autres moyens » et que « le terrorisme des forces de l'EZLN contre des civils innocents au Chiapas ne peut être récompensé par un renforcement de leur pouvoir et de leur influence ». Le secrétaire a ensuite annoncé une nouvelle mission de répression et de répression contre l'EZLN par les forces militaires et policières mexicaines, garantissant ainsi que l'autonomie ne soit pas accordée à l'État via Mexico.\n\nBien que peu impliqués dans la question zapatiste, les décideurs politiques mexicains et latino-américains sont découragés par cette évolution, certains craignant l'éclatement d'un conflit plus large en raison de la colère de l'EZLN face à cette annonce."
 CIA_CHIAPAS.5.d:0 "AVANTAGES DU SOUTIEN AUX REBELLES ZAPATISTES/FORCES DE L'EZLN\nBureau Mexique, Bureau d'analyse latino-américaine, Direction du renseignement ; AMBASSADE DES ÉTATS-UNIS À MEXICO\nSECRET/NOFORN\n\nConscient de l'aggravation du conflit entre les zapatistes de l'État du Chiapas et le gouvernement fédéral mexicain, le chef de la station de la CIA à Mexico formule les recommandations suivantes en faveur d'une plus grande implication et d'un soutien accrus des États-Unis à l'Armée zapatiste de libération nationale (EZLN) afin de garantir l'autonomie et les droits des populations autochtones dans la région.\n\n1. Les forces mexicaines, composées de militaires et de policiers locaux, ont tenté de mener des opérations de contre-insurrection contre les forces de l'EZLN, mais sans succès en raison de la présence de positions et de quartiers généraux de l'EZLN dans la jungle Lacandone, qui traverse la frontière mexico-guatémaltèque et est extrêmement difficile à parcourir sans être un autochtone. Les forces américaines sont expertes en guerre de jungle et en tactiques d'insurrection, et un soutien militaire contre une force militairement incompétente s'avérerait généralement efficace.\n\n2. Le soutien à l'EZLN a diminué en dehors du Chiapas. Ce soutien pourrait inclure des programmes de propagande et d'action civique dans d'autres provinces mexicaines d'idéologie zapatiste, dans le but d'attiser le ressentiment et de permettre la multiplication des actions contre le gouvernement mexicain.\n\n3. Les initiatives de soutien secret pourraient inclure des transferts d'armes légères, de mitrailleuses, de petits véhicules, d'explosifs, de certains équipements électroniques et de communication, un soutien aérien limité et d'autres équipements de soutien. Une formation pourrait également être dispensée par les forces de l'USSOUTHCOM ou des agents de la CIA, en se concentrant notamment sur les attaques contre les points faibles et l'expansion du réseau insurrectionnel.\n\nCe qui précède est formulé en supposant que la CIA et la Maison Blanche souhaiteront effectivement soutenir l'EZLN. L'opinion du chef de station de la CIA [REDACTED] ne reflète pas celle de tous les responsables de la CIA."
 CIA_CHIAPAS.6.d:0 "MODÉRER LE MOUVEMENT ZAPATISTE POUR L'ÉLOIGNER DU MARXISME\nBureau Mexique, Bureau d'analyse latino-américaine, Direction du renseignement ; AMBASSADE DES ÉTATS-UNIS À MEXICO\nSECRET/NOFORN\n\nLe mouvement zapatiste, également connu sous le nom d'Armée zapatiste de libération nationale (EZLN), principalement implanté dans l'État du Chiapas, à l'extrême sud du Mexique, s'est fait connaître pour ses positions de gauche, autochtones et favorables à la réforme agraire, s'inspirant de l'idéologie et des conseils du défunt révolutionnaire mexicain Emilio Zapata. Alors que les États-Unis se sont engagés à soutenir l'EZLN dans sa campagne contre le gouvernement fédéral mexicain, le chef de la station de la CIA à Mexico a exprimé ses inquiétudes quant aux tendances pro-marxistes du mouvement et a joint les suggestions suivantes pour la modération politique des cellules zapatistes.\n\n1. Réitérer l'importance de la réforme agraire et des droits autochtones sans idées explicitement marxistes. La réforme agraire peut être menée à bien, et a été menée, par d'autres régimes politiques non explicitement marxistes, et l'idéologie marxiste n'est pas nécessairement nécessaire à la réalisation de leurs objectifs.\n\n2. La négociation avec le gouvernement fédéral mexicain et le gouvernement de l'État du Chiapas reste une voie possible pour atteindre les objectifs de l'EZLN. Le mouvement devrait être suffisamment modéré si les hauts responsables de l'EZLN sont convaincus de l'importance des options pacifiques et ne se limitent pas à des attaques offensives.\n\n3. Les attaques offensives, bien que limitées en termes de portée, devraient viser des objectifs politiques précis et être restreintes afin d'éviter autant que possible les pertes civiles. Ces restrictions et règles d'engagement devraient empêcher les figures les plus radicales de l'EZLN de commettre des attaques inutiles qui entraîneraient une nouvelle intervention des forces fédérales mexicaines.\n\nOn espère que ces recommandations du chef de station de la CIA [REDACTED], dont les opinions ne représentent pas nécessairement l'ensemble des membres de la CIA, permettront aux décideurs politiques de modérer suffisamment le mouvement, en l'éloignant de son orientation marxiste et en favorisant un soutien américain accru."
 CIA_CHIAPAS.7.d:0 "C'était une nuit fraîche au-dessus du nord du Guatemala, tandis que le C-130 volait à basse altitude au-dessus de la jungle. Le pilote, un lieutenant de l'US Air Force, bâillait en s'inclinant légèrement à gauche, consultant sa carte et sa boussole pour repérer la frontière mexicaine, quasiment invisible à cette altitude.\n\nDerrière lui étaient assis six hommes, vêtus de treillis de combat, quasiment identiques à ceux de la police mexicaine, armés de pistolets dans leurs étuis et de M-16, accrochés à l'appareil, sac à dos entre les jambes. Ils vérifiaient leurs lampes, leurs chargeurs, attachaient d'autres sacs tandis que la rampe s'abaissait, le pilote apercevant un éclair au sol indiquant le point de largage.\n\nUn feu rouge clignota et une sonnerie retentit tandis que les hommes saluaient le chef de chargement dans la soute, sautant de l'appareil un par un, ouvrant leurs parachutes et descendant dans la jungle lacandone en contrebas. Le C-130 continua sa route, effectuant sous couverture des « opérations électroniques et de surveillance » au-dessus du Mexique depuis la base aérienne de Palmerola, au Honduras. Les hommes, cependant, atterrirent dans la jungle, furent accueillis par les guérilleros de l'EZLN et intégrés à la structure de commandement pour commencer leur entraînement au sein du mouvement indigène antigouvernemental axé sur la réforme agraire dans l'État du Chiapas, au sud du pays. Une journée de travail pour ces hommes de Langley."
 CIA_CAM80.0.d:0 "LA SITUATION AU CAMBODGE : POSSIBILITÉS D’UNE IMPLICATION AMÉRICAINE\nBureau Cambodge, Bureau d’analyse de l’Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\n\nDepuis la fin de l’engagement américain dans le conflit vietnamien, la situation géopolitique et interne au Cambodge voisin s’est compliquée. Après avoir renversé Norodom Sihanouk lors d’un coup d’État en 1970, le régime soutenu par les États-Unis a dû faire face à l’insurrection des Khmers rouges communistes, qui ont finalement pris le contrôle de Phnom Penh, la capitale, en 1975.\n\nAyant régné la terreur pendant trois ans, le régime khmer rouge a tué jusqu’à deux millions de Cambodgiens, avant d’être renversé en 1978 par une invasion vietnamienne venue de l’est. Le pays est actuellement dirigé par le Parti révolutionnaire du peuple kampuchéen, pro-soviétique et anti-Khmer rouge, soutenu par les Vietnamiens, sous le nom de République populaire du Kampuchéa.\n\nLes services de renseignement ont indiqué qu’un gouvernement en exil pourrait être formé. Connu sous le nom de Gouvernement de coalition du Kampuchéa démocratique, il est soutenu par la République populaire de Chine [PRC.GetLeader] et se compose des vestiges du régime khmer rouge, du Front de libération nationale du peuple khmer (FLPK), anti-khmer rouge, et du Front national uni pour un Cambodge indépendant, neutre, pacifique et coopératif (FUNCINPEC), dirigé par Sihanouk.\n\nLes États-Unis ont une occasion unique de changer de politique dans cette région. Forts de leur rétablissement au Vietnam, Washington pourrait envisager de contribuer à l'organisation de ce Gouvernement de coalition du Kampuchéa démocratique, en lui accordant une reconnaissance internationale essentielle qui lui permettrait d'usurper le régime de Phnom Penh, soutenu par Hanoï. Cependant, compte tenu de la participation des Khmers rouges au Gouvernement de coalition, il serait judicieux de le maintenir pour le moment. Permettre au KR d'exercer une influence pourrait engendrer de nouveaux problèmes à l'avenir."
 CIA_CAM80.1.d:0 "Dans un retournement de situation inattendu, le secrétaire d'État américain [GetCurrentSecState] a annoncé aujourd'hui que les États-Unis ne soutiendraient pas le projet de gouvernement de coalition du Kampuchéa démocratique, un groupe d'opposition à la République populaire du Kampuchéa, un État croupion soutenu par le Vietnam. Composé d'éléments khmers rouges, du Front de libération nationale du peuple khmer (anti-Khmer rouge) et du parti royaliste FUNCINPEC, le gouvernement de coalition a reçu le soutien de la Chine communiste pour se protéger du Vietnam.\n\nRéitérant que « les États-Unis ne soutiennent aucun gouvernement de coalition incluant des éléments khmers rouges », le secrétaire d'État a ainsi mis fin à toute chance de reconnaissance internationale pour un gouvernement de coalition d'opposition en exil."
 CIA_CAM80.2.d:0 "PROPOSITION DE PARTAGE DE RENSEIGNEMENTS AVEC L'ASEAN EN FAVEUR DU CAMBODGE\nBureau Cambodge, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\n\nFondée en 1967 entre l'Indonésie, la Malaisie, les Philippines, Singapour et la Thaïlande, l'Association des nations de l'Asie du Sud-Est (ASEAN) a pour objectif principal d'accélérer la collaboration régionale, de contenir le communisme et d'assurer une croissance économique et culturelle stable. Ces dernières années, avec la propagation du communisme dans la région et le conflit vietnamien, l'ASEAN a gagné en importance pour les intérêts sécuritaires des États-Unis, notamment en Thaïlande, au Laos et au Cambodge.\n\nSuite à la décision de la communauté du renseignement américaine, du Département d'État et de la Maison-Blanche de ne pas soutenir le projet de gouvernement de coalition du Kampuchéa démocratique, le Bureau Cambodge, en collaboration avec l'ambassade à Bangkok, recommande une coopération plus étroite entre les États-Unis et l'ASEAN afin de s'impliquer indirectement dans les affaires cambodgiennes et régionales, en mettant l'accent sur la défense, la coopération en matière de sécurité et le partage de renseignements avec tous les pays membres.\n\n1. Partage de renseignements avec les services des pays membres, notamment l'Agence nationale de renseignement thaïlandaise (NIA), l'Agence indonésienne de coordination du renseignement (BAKIN), l'Organisation malaisienne du renseignement extérieur (MEIO) et l'Autorité nationale philippine du renseignement et de la sécurité (NISA). Ce partage de renseignements, notamment avec la NIA et la NISA, permettra de garantir la fourniture rapide de renseignements et le soutien des alliés régionaux dans la surveillance des activités cambodgiennes.\n\n2. D'autres formes de coopération en matière de sécurité pourraient également être envisagées, notamment les ventes militaires à l'étranger (FMS) du ministère de la Défense et des initiatives de formation. Des agents de la CIA et de la DIA pourraient également envisager de mener des formations sur le terrain, notamment en matière de surveillance et de tactiques d'insurrection à la frontière entre la Thaïlande et le Cambodge.\n\n3. Un aspect essentiel devrait être de garantir un réseau adéquat de communication et de vérification du renseignement pour surveiller Phnom Penh, d'autant plus que le régime actuel est pro-Hanoï et constitue un État croupion."
 CIA_CAM80.3.d:0 "Le chef de la station de la CIA à Bangkok nous a informés que les États-Unis commenceraient à partager des informations confidentielles sur le gouvernement cambodgien avec notre Agence nationale de renseignement (NIA). Constituées principalement de rapports de contact, de transcriptions d'émissions d'information et d'estimations confidentielles du renseignement national sur le Cambodge, la CIA a commencé à envoyer des tonnes de documents papier aux bureaux de la NIA à travers Bangkok, avec des promesses de formation et de coopération supplémentaires en matière de renseignement pour la surveillance du Cambodge.\n\nDans le cadre d'un effort concerté visant à étendre le partage de renseignements en Asie du Sud-Est entre les membres de l'ASEAN, la Thaïlande représente le point central des efforts américains pour surveiller l'État croupion cambodgien soutenu par le Vietnam. D'éminents responsables militaires et du renseignement thaïlandais se réjouissent de cette évolution et sont impatients de collaborer davantage avec les services de renseignement américains, comme ils l'ont fait pendant la guerre du Vietnam."
 CIA_CAM80.4.d:0 "UNE POSSIBILITÉ DE NEUTRALITÉ AU CAMBODGE ?\nBureau Cambodge, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement ; AMBASSADE DE BANGKOK\nSECRET/NOFORN\n\nSuite à la décision de l'administration actuelle de ne pas soutenir le gouvernement de coalition du Kampuchéa démocratique (opposition cambodgienne), l'ambassade des États-Unis à Bangkok, des responsables de la CIA et d'autres responsables des services de renseignement et du ministère de la Défense ont estimé qu'une stricte neutralité dans les affaires cambodgiennes était impérative pour promouvoir les intérêts américains dans la région.\n\nAprès avoir consulté les membres de l'ASEAN, dont la Thaïlande et l'Indonésie, il a été déterminé que la neutralité était la meilleure option, compte tenu de l'absence de solutions pour un gouvernement responsable au Cambodge. Les États-Unis refusent de reconnaître ni de soutenir l'actuelle République populaire du Kampuchéa, soutenue par le Vietnam, malgré ses tendances anti-Khmers rouges.\n\nDe plus, le gouvernement de coalition du Kampuchéa démocratique peut sembler une meilleure option, mais il est tout aussi en proie à des problèmes internes. D'une part, la coalition est composée d'anciens Khmers rouges, dont la découverte pourrait engendrer des problèmes internationaux pour les États-Unis ; d'éléments royalistes dirigés par Norodom Sihanouk, chassés par les Khmers rouges, et d'éléments anti-Khmers rouges. Il est clair que nous ne devons soutenir aucune des deux parties et rester ainsi neutres dans la région.\n\nIl est toutefois impératif de maintenir le soutien à l'ASEAN et aux autres alliés du monde libre dans la région. Des mesures doivent être prises contre Hanoï et sa marionnette à Phnom Penh, mais pas contre un gouvernement de coalition sous sa forme actuelle."
 CIA_CAM80.6.d:0 "Il était midi dans le Bureau ovale lorsque le président [USA.GetLeader] s'est assis pour déjeuner ; un jambon sur pain de seigle et une petite salade César feraient parfaitement l'affaire. Alors qu'il commençait à manger et à consulter des documents, quelques assistants sont entrés dans le Bureau ovale : le secrétaire d'État [GetCurrentSecState], le conseiller à la sécurité nationale [GetCurrentNatSecAdv] et le directeur de la CIA [GetCurrentCIADir].\n\n« Monsieur, nous devons parler de nos relations avec le Cambodge. Puisque nous avons décidé de soutenir le gouvernement de coalition du Kampuchéa démocratique, le département d'État et le CNS ont discuté de son organisation. Je suppose que vous avez lu notre rapport sur la coalition ?»\n\nLe président leva les yeux vers les trois responsables. « Oui, mais tenez-moi au courant.»\n\n« Oui, monsieur. » Le DCI acquiesça. Le gouvernement de coalition est composé de la plupart des groupes d'opposition à la République populaire du Kampuchéa, soutenue par Hanoï ; notamment d'anciens éléments khmers rouges, des membres du Front de libération nationale du peuple khmer, anti-khmer rouge, et du FUNCINPEC, un parti royaliste dirigé par Sihanouk.\n\nLe conseiller à la sécurité nationale intervint. « Notre préoccupation réside dans l'organisation et la gestion du gouvernement afin d'éviter les conflits internes entre les trois factions, historiquement opposées. L'État a déjà contacté secrètement les pays membres de l'ASEAN et chacun des groupes pour former officiellement un gouvernement avec notre soutien. Nous leur avons également proposé d'occuper le siège de l'ONU à New York.»\n\n« C'est bien, Messieurs. J'attends bientôt un rapport conjoint plus complet à ce sujet. J'ai du travail, mais merci.» Il acquiesça, terminant son déjeuner tandis que les trois hommes partaient. Un autre régime soutenu par les États-Unis était en place."
 CIA_CAM80.7.d:0 "Bonjour. J'ai le plaisir d'annoncer ce matin que les États-Unis d'Amérique reconnaîtront officiellement diplomatiquement le Gouvernement de coalition du Kampuchéa démocratique comme seul gouvernement souverain du Cambodge, également appelé Kampuchéa.\n\nLes États-Unis ne reconnaissent pas la République populaire du Kampuchéa, illégitime et sous contrôle vietnamien, comme représentante du peuple cambodgien et accorderont des relations diplomatiques complètes au Gouvernement de coalition du Kampuchéa démocratique, y compris une représentation diplomatique auprès de son gouvernement en exil à Pékin, en République populaire de Chine.\n\nNous exhortons tous les partenaires et alliés de la communauté internationale à reconnaître rapidement le Gouvernement de coalition du Kampuchéa démocratique comme le gouvernement cambodgien légitime. Je suis fier d'annoncer que l'ambassadeur des États-Unis auprès des Nations Unies rédigera une résolution visant à attribuer au Gouvernement de coalition le siège cambodgien précédemment occupé. Merci. Nous ne répondrons pas à vos questions pour le moment.\n\nSouriant à la presse et aux diplomates réunis, le secrétaire d'État [GetCurrentSecState] a hoché la tête avant de quitter la tribune, sous les flashs des appareils photo. Un autre pays a été reconnu."
 CIA_CAM80.8.d:0 "Une excellente nouvelle est arrivée aujourd'hui de Washington : les États-Unis ont reconnu notre projet de gouvernement de coalition du Kampuchéa démocratique. Dans une annonce, le secrétaire d'État américain [GetCurrentSecState] a réitéré le soutien américain et s'est engagé à envoyer un émissaire auprès du gouvernement en exil à Pékin.\n\nDes représentants du Front de libération nationale du peuple khmer et du FUNCINPEC ont exprimé leur optimisme face à cette évolution, tandis que des représentants des Khmers rouges semblent s'y opposer pour des raisons idéologiques. Le président Sihanouk s'attend à recevoir très prochainement un émissaire américain à Pékin."
 CIA_CAM80.9.d:0 "SOUTIEN AMÉRICAIN AUX MEMBRES DE LA COALITION CAMBODGIENNE : RECOMMANDATIONS\nBureau Cambodge, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\n\nDepuis que les États-Unis ont officiellement reconnu diplomatiquement le gouvernement de coalition du Kampuchéa démocratique, notre objectif principal est non seulement d'entretenir des relations amicales avec le gouvernement en exil à Pékin, mais aussi de préserver l'unité interne entre les trois principales factions. Le Bureau Cambodge, l'ambassade de Bangkok et l'ambassade de Pékin estiment qu'il convient d'apporter un soutien aux trois factions du gouvernement, mais avec prudence, en raison de leurs positions parfois opposées aux intérêts américains et de leurs relations mutuelles.\n\nLes Khmers rouges restants, officiellement connus sous le nom de Parti du Kampuchéa démocratique, représentent le groupe dominant au sein du gouvernement de coalition. Chassés par l'invasion vietnamienne et la formation ultérieure de la République populaire du Kampuchéa, soutenue par Hanoï, les Khmers rouges ont été mis à l'écart, contraints de faire des compromis avec d'autres partis anti-vietnamiens pour atteindre leurs objectifs. Cette faction a été la principale source de préoccupation du Bureau du Cambodge, de l'ambassade à Pékin et des responsables de Langley en raison de son influence et de sa volonté de renverser militairement la RPC.\n\nLe Front de libération nationale du peuple khmer (FLPK), formé en 1979 en tant que coalition de mouvements de guérilla anti-vietnamiens et anti-RPC, est essentiellement anticommuniste. Contrairement aux Khmers rouges, le FLPK est militarisé et dépourvu des aspects politiques indispensables à un nouveau gouvernement, ce qui explique son faible poids par rapport aux Khmers rouges. Cependant, le soutenir au maximum est primordial pour la sécurité américaine, car il est très proche de Washington.\n\nEnfin, le parti royaliste FUNCINPEC est le dernier membre majeur de la coalition, ayant été fondé par l'ancien Premier ministre Norodom Sihanouk en 1981. Il est très influent et impliqué auprès du gouvernement chinois, partageant l'objectif d'expulser la RPC du Cambodge et envisageant même de s'allier aux Khmers rouges pour atteindre ses objectifs. Bien que peu influent, le gouvernement de coalition est dirigé par Sihanouk, choisi comme candidat de compromis.\n\nSoutenir ouvertement les trois partis est essentiel pour maintenir le soutien américain et l'unité interne du CGDK ; le KPNLF est la faction la plus proche des États-Unis et nous devrions envisager d'accroître l'aide et le soutien à ces forces, sans pour autant les exclure."
 CIA_CAM80.10.d:0 "Notre envoyé à l'ambassade des États-Unis à Pékin nous a fait parvenir d'excellentes nouvelles. Il nous a informés officieusement que les États-Unis s'étaient engagés à soutenir tous les membres de notre gouvernement, y compris les éléments du KPNLF et des Khmers rouges.\n\nLe président Sihanouk, du mouvement FUNCINPEC, se réjouit apparemment de cette évolution, craignant auparavant que les États-Unis ne soutiennent injustement une faction au détriment des autres. D'éminents dirigeants des Khmers rouges et du KPNLF se réjouissent également, et l'unité interne au sein de notre gouvernement atteint un nouveau sommet. Nous espérons que notre gouvernement à Pékin recevra bientôt de l'aide et un soutien supplémentaire."
 CIA_CAM80.11.d:0 "SOUTIEN AUX FORCES D'OPPOSITION ANTICOMMUNISTES AU CAMBODGE\nBureau Cambodge, Bureau d'analyse de l'Asie du Sud-Est, Direction du renseignement\nSECRET/NOFORN\n\nDepuis la reconnaissance diplomatique officielle du Gouvernement de coalition du Kampuchéa démocratique par les États-Unis, notre objectif principal est non seulement d'entretenir des relations amicales avec le gouvernement en exil à Pékin, mais aussi de préserver l'unité interne entre les trois principales factions. Le Bureau Cambodge, l'Ambassade de Bangkok et l'Ambassade de Pékin estiment que le soutien ne devrait être accordé qu'aux éléments anticommunistes du Gouvernement de coalition, en raison de leur importance stratégique pour les intérêts américains.\n\nLe Front de libération nationale du peuple khmer (FLPK), formé en 1979 en tant que coalition de mouvements de guérilla anti-vietnamiens et anti-RPK, est essentiellement anticommuniste. Contrairement aux Khmers rouges, le FLPK est militarisé et dépourvu des aspects politiques indispensables à un nouveau gouvernement, ce qui explique son faible poids par rapport aux Khmers rouges. Cependant, les soutenir au maximum est primordial pour les intérêts sécuritaires américains, car ils sont les plus proches de Washington.\n\nLe parti royaliste FUNCINPEC est le dernier membre majeur de la Coalition, ayant été formé par l'ancien Premier ministre Norodom Sihanouk en 1981. Il est très influent et impliqué auprès du gouvernement chinois, partageant l'objectif d'évincer la PRK du Cambodge ; il envisage même de s'allier aux Khmers rouges pour atteindre leurs objectifs. Bien que peu influent, le gouvernement de coalition est dirigé par Sihanouk, choisi comme candidat de compromis.\n\nL'autre faction restante, composée d'anciens Khmers rouges regroupés au sein du Parti du Kampuchéa démocratique, représente la faction la plus influente, mais aussi la plus menaçante pour l'unité interne et les intérêts des États-Unis. Ne pas les soutenir serait préférable pour préserver les intérêts sécuritaires, même si le soutien aux deux autres devra rester discret pour garantir une unité interne adéquate."
 CIA_CAM80.12.d:0 "L'envoyé temporaire des États-Unis auprès de notre gouvernement à Pékin a informé secrètement notre gouvernement, par l'intermédiaire du président Sihanouk, que les États-Unis accordaient la priorité au soutien aux seuls partis anticommunistes KPNLF et FUNCINPEC. Dans une déclaration à notre gouvernement, le chef de la station de la CIA à Pékin a évoqué « le manque de fiabilité des anciens éléments khmers rouges et la crainte à Washington que leur influence ne cause plus de problèmes qu'il ne justifie de soutenir tous les partis ».\n\nLes représentants du KPNLF et du FUNCINPEC ont été informés que l'aide leur parviendrait secrètement via la frontière thaïlandaise et par d'autres moyens. Les représentants de la faction khmère rouge ne seront pas informés pour des raisons d'unité interne. Nous saluons cette évolution, mais nous sommes préoccupés par les problèmes d'unité et de confiance entre les trois partis au gouvernement, qui pourraient s'aggraver à l'avenir."
 CIA_CAM80.13.d:0 "Dans une annonce faite ce matin, un porte-parole du Département de la Défense américain à Washington a confirmé la vente officielle d'équipement lourd au gouvernement de coalition du Kampuchéa, considéré par les États-Unis comme le gouvernement légitime du Cambodge.\n\nLa vente comprendra des chars et des véhicules blindés d'ancien modèle, ainsi que quelques hélicoptères d'ancien modèle, similaires à ceux utilisés lors du conflit vietnamien. Les réactions internationales ont été mitigées, mais la plupart des alliés des États-Unis restent favorables à cette vente, notamment parce qu'elle sera utilisée pour combattre les forces fantoches vietnamiennes et de la République populaire de Corée dans la région."
 CIA_CAM80.14.d:0 "L'attaché de défense temporaire de notre représentation américaine à Pékin nous a informés que les États-Unis commenceront immédiatement à livrer des armes lourdes au CGDK. Composé de chars de combat principaux d'ancien modèle, de véhicules de combat d'infanterie, de dragueurs de mines, ainsi que de plusieurs hélicoptères UH-1 Huey, ce programme d'aide vise à donner à nos forces l'initiative dans la lutte contre les forces de la PRK et du Vietnam à la frontière entre la Thaïlande et le Cambodge.\n\nAu sein de notre gouvernement, cette évolution est largement saluée ; outre l'aide chinoise, elle réjouira les forces du KPNLF et du FUNCINPEC, dont beaucoup constituent les troupes de combat de première ligne au sein du gouvernement de coalition."
 CIA_CAM80.15.d:0 "L'envoyé américain qui dirige notre représentation à Pékin nous a informés que les États-Unis limiteraient les programmes d'aide proposés à l'aide humanitaire. Malgré les appels de notre gouvernement à fournir des armes et des formations pour renforcer notre capacité à combattre la RPDC et les forces vietnamiennes, Washington a défini nos priorités.\n\nSelon l'envoyé, l'aide se limitera à des « fournitures humanitaires », notamment des rations alimentaires, de l'eau, des vêtements, des fournitures médicales, des équipements de construction et d'autres articles destinés à améliorer la qualité de vie des membres du CGDK et du territoire que nous contrôlons. Malheureusement, nous ne détenons qu'un territoire restreint et aurions préféré une aide en armes en premier.\n\nLes membres de notre gouvernement, en particulier le KPNLF, sont furieux de cette situation et réclament une aide supplémentaire en armes, car c'est la priorité du gouvernement."
 CIA_CAM80.16.d:0 "À Washington aujourd'hui, le secrétaire d'État américain [GetCurrentSecState] a annoncé que les États-Unis chercheraient à soutenir un changement de régime au Cambodge. Actuellement dominé par le Front uni du Kampuchéa pour le salut national, le gouvernement cambodgien est de fait contrôlé par les envahisseurs vietnamiens, qui adhèrent à une ligne pro-soviétique.\n\nCette annonce, largement attendue comme un moyen de légitimer un changement de régime en faveur du gouvernement de coalition du Kampuchéa démocratique soutenu par les États-Unis, a été fermement condamnée par les gouvernements cambodgien, vietnamien, soviétique et le reste du bloc de l'Est."
 CIA_CAM80.17.d:0 "L'envoyé américain qui dirige notre représentation à Pékin nous a informés que les États-Unis militent activement et publiquement en faveur d'un changement de régime au Cambodge. Dans une déclaration publique depuis Washington, le secrétaire d'État [GetCurrentSecState] a exprimé son soutien public à notre gouvernement et a exhorté ses alliés internationaux à soutenir notre cause.\n\nTous les partis du gouvernement de coalition se réjouissent de cette annonce, y compris les forces khmères rouges. La livraison d'équipements lourds, d'autant plus que cela garantira nos capacités et notre victoire contre le régime soutenu par Hanoï !"
 AFG_CW.0.desc:0 "Après le retrait des forces soviétiques d'Afghanistan, la situation n'a fait que se détériorer et une guerre civile généralisée a éclaté. Si la grande majorité des factions d'opposition se sont regroupées sous la bannière du gouvernement intérimaire afghan, l'unité de la coalition est pour le moins extrêmement suspecte. Le gouvernement central étant peu susceptible de contenir indéfiniment les forces d'opposition plus ou moins unifiées, les chances de l'opposition de former un gouvernement stable sont estimées quasi nulles. Pour compliquer encore les choses, le Hezb-e Islami Gulbuddin, la faction dirigée par Gulbuddin Hekmatyar, s'est retiré du gouvernement intérimaire afghan et a conquis son propre territoire proche du Pakistan. Compte tenu de l'importance de l'aide saoudienne et pakistanaise destinée aux forces d'Hekmatyar, on peut se demander si ce seul fait n'a pas déjà anéanti les faibles chances d'une résolution pacifique entre les factions rebelles. Notre administration doit maintenant déterminer la marche à suivre, si tant est qu'elle aille de l'avant, dans ce conflit naissant."
 AFG_CW.1.desc:0 "Après d'intenses débats au sein de la Central Intelligence Agency (CIA) et du Conseil national de sécurité (NSC), il a été décidé d'autoriser un financement supplémentaire pour les forces de résistance afghanes dans ce pays d'Asie centrale assiégé. Cependant, le choix des candidats à soutenir fait encore l'objet de nombreux débats au sein des services de renseignement. Jusqu'à présent, la plupart de nos alliés, dans leur soutien aux forces de résistance dans la région, ont approvisionné le Hezb-e Islami Gulbuddin de Gulbuddin Hekmatyar. Cependant, ses forces n'ont pas encore remporté de victoire militaire décisive et sont récemment entrées en conflit avec les forces armées. L'autre faction majeure que nous pourrions soutenir serait le Jamat-e Isliami, dirigé par le célèbre résistant Ahmad Shah Massoud. Outre leur anticommunisme, il convient de noter qu'étant donné la diversité ethnique de l'Afghanistan, Massoud et ses forces représentent majoritairement les intérêts tadjiks, tandis qu'Hekmatyar représente majoritairement les intérêts pachtounes. Chaque choix pourrait avoir des conséquences à long terme."
 AFG_CW.2.desc:0 "Après de nouveaux débats, le Conseil de sécurité nationale a décidé de soutenir le Jamat-e Isliami plutôt que le Hezb-e Islami Gulbuddin. La plupart de nos principaux alliés régionaux, notamment le Pakistan et l'Arabie saoudite, ont consacré l'essentiel de leur financement et de leur soutien au Hezb-e Islami Gulbuddin et à d'autres groupes affiliés. Cependant, ce groupe n'a remporté aucune victoire militaire notable depuis sa création, que ce soit pendant la guerre soviéto-afghane ou pendant la guerre civile. De plus, Gulbuddin Hekmatyar, le chef du Hezb-e Islami Gulbuddin, s'est révélé politiquement peu fiable, comme en témoigne son récent retrait des forces de la coalition contre le gouvernement central. Des inquiétudes ont également été soulevées quant au tempérament et à l'idéologie d'Hekmatyar, notamment en raison de sa représentation des intérêts pachtounes, de ses liens avec des éléments plus radicaux et de son accumulation d'armes lourdes, tout en restant à l'écart de la guerre civile en cours. Au contraire, Massoud apparaît comme une figure unificatrice et un leader remarquable au cours de la dernière décennie et pourrait fournir le leader dont l’Afghanistan aura besoin une fois la guerre terminée."
 AFG_CW.3.desc:0 "Heureusement, les États-Unis ont décidé de nous soutenir prochainement en nous fournissant des armes et une aide financière. Cette décision fait suite à plusieurs réunions avec des agents des services de renseignement américains dans le nord de l'Afghanistan, au vu des divisions au sein de la coalition d'opposition contre le gouvernement central communiste, et vise à garantir notre capacité à mettre fin à ce dernier. Malheureusement, une fois le gouvernement de Kaboul vaincu, nous devrons affronter les différents chefs de guerre et autres factions impliquées dans la guerre en cours. Le plus inquiétant est le Hezb-e Islami Gulbuddin, qui s'est séparé de notre coalition et s'est replié sur ses bastions pachtounes près du Pakistan. Dans le pire des cas, Hekmatyar pourrait attendre que nous nous emparions de Kaboul avant de lancer sa propre offensive pour s'emparer de notre butin."
 AFG_CW.4.desc:0 "Bien qu'il ne s'agisse peut-être pas de la faction la plus célèbre de la guerre soviéto-afghane, le Hezb-e Islami Gulbuddin et son chef, Gulbuddin Hekmatyar, ont été un allié indéfectible de nos partenaires régionaux en matière de sécurité, et se sont révélés potentiellement utiles dans un Afghanistan réunifié en tant que représentant du peuple pachtoune. Cependant, Hekmatyar a poussé son organisation à se retirer des combats en cours entre le gouvernement intérimaire et le gouvernement central communiste et s'est replié dans ses bastions peuplés de Pachtounes. Bien que regrettable, cela offre une occasion unique d'attendre que les deux camps se saignent mutuellement, puis de fournir à Hekmatyar l'aide nécessaire pour prendre le contrôle de Kaboul au moment opportun. Cela dit, plusieurs analystes du renseignement ont contesté cette décision, arguant qu'Hekmatyar n'est rien d'autre qu'un opportuniste qui trahira ses hommes dès que cela lui sera bénéfique."
 AFG_CW.5.desc:0 "Excellente nouvelle : Washington a décidé de renforcer son soutien à notre cause, notamment aux dépens des autres factions afghanes. Plus prometteur encore est le soutien américain à notre intention de prendre Kaboul une fois que les autres factions se seront épuisées dans la guerre civile en cours. Avec le soutien américain et une coordination renforcée entre Washington, Riyad et Islamabad, nos forces auront beaucoup plus de chances de s'emparer de Kaboul et d'autres zones critiques du pays lorsque nous déciderons de frapper. En revanche, cette décision renforcera certainement la dépendance de notre mouvement envers les États-Unis et nous conduira probablement à céder aux intérêts américains dans un avenir proche. Cependant, c'est un faible prix à payer pour le soutien continu d'une puissance mondiale."
 AFG_CW.6.desc:0 "Au cours de la dernière décennie, nos principaux alliés régionaux, notamment le Pakistan et l'Arabie saoudite, ont soutenu la faction militante Hezb-e Islami Gulbuddin de Gulbuddin Hekmatyar. Cependant, avec le temps, il est devenu évident qu'Hekmatyar n'a guère combattu ses ennemis déclarés et qu'il a même abandonné la coalition contre le gouvernement central de Kaboul pour se replier sur ses bastions pachtounes. Cela pourrait légèrement aliéner certains de nos alliés, notamment le Pakistan, mais nous ne devrions pas être le facteur déterminant de notre politique en Afghanistan. Une analyse plus approfondie de la CIA a réaffirmé la conviction du Conseil national de sécurité selon laquelle Hekmatyar est avant tout un opportuniste et cherchera probablement à semer le chaos et la discorde plus tard dans le conflit en cours. À l'inverse, certains analystes ont également avancé que le retrait du soutien à Hekmatyar, figure majeure de la communauté pachtoune, pourrait entraîner une radicalisation accrue de la population pachtoune d'Afghanistan."
 AFG_CW.7.desc:0 "Malheureusement, les Américains ont décidé de cesser de soutenir notre cause. Bien que nos autres fournisseurs étrangers nous aient assuré qu'ils ne nous avaient pas abandonnés, leurs affirmations sont pour le moins suspectes. Cependant, nous avons accumulé un important stock d'armes pour lancer une attaque sur Kaboul une fois que les forces du gouvernement intérimaire afghan et du gouvernement central communiste se seront mutuellement exterminées. Malheureusement, d'autres ignorent que nous devons prendre le pouvoir seuls pour empêcher une nouvelle oppression du peuple pachtoune. Les Hazaras et les Tadjiks présents dans la coalition intérimaire s'uniront certainement pour diriger le pays aux dépens de notre peuple. Pour l'instant, nous devons attendre et préparer notre éventuelle attaque sur Kaboul.\n\nPeut-être devrions-nous envisager de renforcer nos liens avec les religieux locaux afin de rallier des soutiens en territoire ami ?"
 CIA_PAKn.0.desc:0 "La Central Intelligence Agency (CIA) a récemment pris connaissance d'avancées significatives dans le programme nucléaire pakistanais. Compte tenu de l'instabilité générale au Pakistan et du conflit de longue date avec l'Inde, cette situation est très préoccupante. Par ailleurs, le Pakistan soutient activement nos activités en Afghanistan, est activement anticommuniste et est l'un de nos principaux alliés dans la région. Deux options s'offrent donc à nous : la première, de loin la plus simple, serait d'ignorer l'existence du programme et, en cas de révélation publique, de tenter de bloquer les sanctions contre le Pakistan au Conseil de sécurité des Nations Unies. Cela permettrait au Pakistan de poursuivre son programme et de nuire davantage à la non-prolifération nucléaire, tout en servant nos intérêts dans la région. La seconde option consisterait à sanctionner le Pakistan et à tenter de forcer la fin du programme en confirmant publiquement son existence et en soutenant les efforts de sanction aux Nations Unies. Cependant, cela nous coûterait presque assurément notre alliance avec le Pakistan et mettrait en péril nos opérations dans la région. Comment procéder ?"
 CIA_PAKn.1.desc:0 "Le président américain [USA.GetLeader] a confirmé avoir donné instruction au Trésor d'appliquer des sanctions contre le Pakistan concernant son programme d'armement nucléaire actif. Ces sanctions visent le programme nucléaire lui-même ainsi que les dirigeants politiques et militaires pakistanais. Bien que le programme nucléaire pakistanais n'ait pas été confirmé avec certitude auparavant, cela ne constitue pas une grande surprise pour la communauté internationale. Ce qui est toutefois surprenant, c'est que les États-Unis aient décidé d'agir sur cette question. Ces dernières années, Washington a renforcé ses liens avec le Pakistan en raison d'objectifs stratégiques communs et de la présence d'ennemis dans la région. En particulier, avec le conflit en cours en Afghanistan, où les États-Unis et le Pakistan soutiennent des forces anticommunistes contre le gouvernement central. Cette mesure remet en question l'avenir des relations et de la coopération américano-pakistanaises dans la région."
 CIA_PAKn.2.desc:0 "Nouvelles de Washington. L'Amérique a imposé un large éventail de sanctions contre notre gouvernement, notre armée et, en particulier, notre programme nucléaire. Compte tenu de notre dépendance au soutien militaire et économique américain pour nos activités à l'étranger et la stabilisation de notre régime, cette situation est catastrophique. Non seulement l'Amérique nous impose des sanctions, mais des signaux ont été émis selon lesquels les États-Unis feraient pression pour que des sanctions soient prises contre nous au Conseil de sécurité des Nations Unies. Cet ensemble d'actions déstabilisera certainement davantage notre régime et mettra en péril le soutien continu aux moudjahidines en Afghanistan. Cependant, nous n'avons guère d'autre choix que de poursuivre notre programme nucléaire, l'Inde étant dotée de l'arme nucléaire. Nous ne serons jamais en sécurité tant que l'Inde possédera l'arme nucléaire, sans aucune riposte pour empêcher une nouvelle agression indienne contre nos droits légitimes."
 CIA_PAKn.3.desc:0 "Bien que le dévoilement de notre programme nucléaire ait porté un coup dur à notre nation et entraîné des sanctions de la part de plusieurs pays, les États-Unis ont maintenu leur soutien indéfectible à notre gouvernement. L'ambassadeur américain a souligné que, même si Washington désapprouve notre programme nucléaire, celui-ci ne constitue qu'un léger obstacle à la poursuite de nos relations, largement éclipsé par la nécessité de poursuivre la coopération dans la lutte contre le communisme dans la région. L'accent a été mis en particulier sur la poursuite de la coordination en Afghanistan pour renverser le gouvernement communiste afghan et empêcher une nouvelle expansion du communisme dans la région. Si cela empêchera certainement de nombreux pays d'appliquer des sanctions, notre économie en pâtira néanmoins, même si le pire scénario a été évité."
 MZB_CIA80.0.desc:0 "Le départ des Portugais d'Afrique après la Révolution des Œillets a provoqué des guerres civiles en Angola et au Mozambique. Si le Mozambique n'a pas sombré instantanément dans la guerre civile comme en Angola, les tensions entre factions, partis et conflits ethniques y ont contribué. La guerre a opposé le Front de libération du Mozambique (FRELIMO) communiste à la Résistance nationale mozambicaine (RENAMO), une faction nationaliste. Pendant la guerre d'indépendance au Mozambique, le FRELIMO était de fait la seule faction à lutter contre le régime portugais. La RENAMO a été créée l'année suivant le départ des Portugais par d'anciens membres de la branche armée du FRELIMO, des politiciens anticommunistes et d'anciens Flechas portugais. Les Flechas étaient les unités paramilitaires d'élite de la police secrète portugaise pendant la guerre d'indépendance et étaient composées de membres des tribus locales et de transfuges rebelles.\n\nMal connue du grand public, la Rhodésie a joué un rôle important dans la formation et l'établissement de la RENAMO, un moyen de déstabiliser le Mozambique. Après la fin de la Rhodésie, d'anciens militaires rhodésiens ont rejoint la RENAMO. La guerre civile nous offre une opportunité intéressante. Nous pourrions nous en tenir à l'aide humanitaire ou chercher à négocier une résolution diplomatique. Cependant, cela ne nous apporterait que peu d'avantages géopolitiques. Une stratégie plus ambitieuse consisterait à collaborer avec l'Afrique du Sud pour soutenir la RENAMO et chercher à justifier une plus grande intervention dans le conflit."
 MZB_CIA80.1.desc:0 "La guerre civile et les conséquences de la guerre d'indépendance contre le Portugal ont laissé le Mozambique démuni et menacé de famine. L'utilisation massive de mines terrestres a également entraîné une crise médicale, avec un grand nombre d'amputés. Pour remédier à cette situation, le président a autorisé un plan d'action visant à fournir une aide humanitaire au Mozambique par l'intermédiaire de tiers et en collaborant avec les représentants des deux camps pour permettre l'acheminement de l'aide vers leurs territoires respectifs. Il est à espérer que ces négociations permettront de nouer de nouveaux contacts et de tisser des liens afin de permettre à la diplomatie de l'emporter et de mettre fin à la guerre civile à l'amiable. Contrairement à l'Angola ou à l'Éthiopie, la guerre civile mozambicaine a connu relativement peu d'interventions extérieures ces dernières années. Si l'Afrique du Sud et, auparavant, la Rhodésie se sont impliquées dans le conflit, aucune présence soviétique, cubaine ou autre du bloc de l'Est n'a été observée au Mozambique."
 MZB_CIA80.2.desc:0 "Nos contacts avec la CIA nous ont récemment fait savoir que nous devrons participer aux négociations avec le gouvernement du Front de libération du Mozambique (FRELIMO) si ce dernier accepte les négociations proposées par Washington pour mettre fin à la guerre civile. Les conditions que Washington nous a annoncées représenteraient, dans une certaine mesure, un dépôt des armes de notre part et l'acceptation de postes au sein d'un gouvernement d'unité nationale avant la tenue d'élections libres. Des membres influents du parti au courant de la proposition ont exprimé de vives inquiétudes quant à la possibilité que le FRELIMO annule les termes de l'accord après son désarmement, tandis que d'autres se sont déclarés prêts à négocier pour mettre fin à une guerre civile de plus en plus dévastatrice. Une autre préoccupation encore plus pressante a été soulevée : si nous choisissons de refuser, Washington nous forcera-t-il la main en menaçant de suspendre l'aide et en faisant pression sur le Malawi et l'Afrique du Sud pour qu'ils cessent leur aide matérielle ?"
 MZB_CIA80.3.desc:0 "La Résistance nationale mozambicaine (RENAMO) a, sans surprise, fait part de son acceptation de notre proposition de négociation et a annoncé en interne son soutien à cette mesure. Si nous ne doutions guère de la venue de la RENAMO à la table des négociations, la décision d'accepter immédiatement les conditions est une bonne nouvelle pour notre administration. Des inquiétudes avaient été exprimées quant à la volonté des membres les plus radicaux de la RENAMO, notamment ceux qui avaient auparavant combattu pour la Rhodésie et le Portugal, de compromettre d'éventuelles négociations. Cependant, l'opposition interne n'a pas abouti, et la plupart des membres de la RENAMO ont exprimé le souhait de mettre fin à la guerre civile si des conditions équitables pouvaient être trouvées et appliquées par une tierce partie afin de garantir leur respect. Nous attendons maintenant la réponse du gouvernement mozambicain à notre proposition de négociation."
 MZB_CIA80.4.desc:0 "Étonnamment, la Résistance nationale mozambicaine (RENAMO) nous a informés qu'elle ne souhaitait pas négocier avec le Front de libération du Mozambique (FRELIMO). Nos analystes trouvent hilarant qu'ils pensent avoir le choix dans cette affaire. Nos agents, qui agissent comme intermédiaires au sein de la RENAMO, ont déjà commencé à faire pression sur les hauts responsables pour qu'ils reconsidèrent leur position, et plusieurs autres membres hostiles ont été liquidés. Nous pensons que la RENAMO changera d'avis dans les prochains jours après que nous aurons exprimé notre mécontentement en menaçant de suspendre l'aide et en l'informant que nous envisageons de faire pression sur Pretoria pour qu'il suspende ses propres envois d'aide aux bases de la RENAMO au Mozambique et au Malawi. Tandis que la RENAMO continue de subir des pressions, nous devons poursuivre nos discussions avec le FRELIMO pour tenter de relancer les négociations."
 MZB_CIA80.5.desc:0 "Une proposition intéressante nous est parvenue récemment. Des diplomates américains ont contacté notre ministère des Affaires étrangères et ont proposé d'engager des négociations avec la Résistance nationale mozambicaine (RENAMO) afin de mettre fin à la guerre civile. D'un côté, accepter cette initiative, qu'elle réussisse ou non, donnerait une image positive de notre gouvernement et démontrerait notre volonté de mettre fin pacifiquement à la guerre civile. Cependant, une telle démarche conduirait certainement à une légitimation de la RENAMO et, si les négociations aboutissent, elle entraînera inévitablement un affaiblissement de notre contrôle sur l'appareil d'État. Les concessions probables incluraient une modération de notre politique étrangère et la garantie d'élections libres dans un avenir proche, élections que nous risquons fort de perdre. De plus, accepter cette offre risquerait de nous aliéner nos alliés étrangers et d'affaiblir le soutien des pays socialistes à notre gouvernement. Comment devrions-nous procéder ?"
 MZB_CIA80.6.desc:0 "Étonnamment, le Front de libération du Mozambique (FRELIMO) a accepté de participer aux négociations que nous avions sollicitées. Bien qu'inattendue, cette nouvelle est excellente et pourrait être l'occasion de mettre fin à la guerre civile sanglante au Mozambique et d'obtenir des concessions du FRELIMO pour former un nouveau gouvernement d'union nationale. Ce gouvernement pourrait prendre ses distances avec Moscou et rechercher une approche plus conciliante à l'égard de Pretoria. Le Département d'État a été autorisé à imposer des concessions importantes à la Résistance nationale mozambicaine (RENAMO) afin de garantir un cycle de négociations productif et une fin de la guerre civile favorable à l'Occident. La proposition envisagée établirait un gouvernement unifié, dirigé par le FRELIMO, la RENAMO obtenant divers postes au sein du gouvernement et la garantie d'élections libres dans quelques années, à respecter par les deux parties. Cette mesure devrait être acceptable par les deux parties et viser à modérer le gouvernement mozambicain."
 MZB_CIA80.7.desc:0 "Malheureusement, le Front de libération du Mozambique (FRELIMO) a rejeté nos propositions de négociations, les qualifiant de tactique dilatoire pour armer la Résistance nationale mozambicaine anticommuniste (RENAMO). Il s'agit véritablement d'une occasion manquée de leur part. Nous étions ouverts à une issue pacifique dans des conditions équitables pour les deux parties et prévoyions de promouvoir la tenue d'élections pacifiques dans un avenir proche. La RENAMO a réagi globalement positivement à cette évolution, compte tenu de sa résilience initiale à accepter les négociations. Notre administration peut désormais soit céder sur nos efforts pour mettre fin à la guerre civile, soit envisager des propositions plus extrêmes circulant au sein de la CIA et soutenues par des membres plus militants du Conseil national de sécurité. Quoi qu'il en soit, si rien d'autre n'est assuré, l'avenir du Mozambique, alors que la guerre civile continue de s'intensifier, est pour le moins sombre."
 MZB_CIA80.9.desc:0 "Les négociations ont progressé. Bien que nous n'ayons pas obtenu autant de concessions que nous le souhaitions, nous avons signé un accord avec le gouvernement pour mettre fin à la guerre civile et former un gouvernement d'unité nationale. Cet accord permettra à nos dirigeants d'accéder à plusieurs ministères importants, légalisera nos partis politiques et mènera à une nouvelle constitution, qui devra être ratifiée par les deux partis, ainsi qu'à un accord prévoyant la tenue d'élections libres l'année prochaine, avec la présence d'observateurs internationaux sur l'ensemble du territoire. Cela met fin à notre lutte armée, du moins pour l'instant, mais cela nous offre l'occasion de participer à des élections libres et de mettre le Mozambique sur la voie d'un avenir meilleur pour tous. La manière dont les négociations futures sur la nouvelle constitution et le Front de libération du Mozambique (FRELIMO) honoreront leurs accords reste incertaine, mais nos contacts avec Washington sont encourageants."
 MZB_CIA80.10.desc:0 "Les négociations sont terminées et finalisées. À la surprise générale, nos négociateurs sont parvenus à un accord acceptable pour les deux parties, et l'accord de fin de guerre civile a été officiellement signé par les dirigeants de notre gouvernement et de la Résistance nationale mozambicaine (RENAMO). Bien que des problèmes subsistent, nous avions plus à gagner qu'à perdre en signant cet accord : nous avons concédé plusieurs ministères à la RENAMO et devrons organiser des élections libres dans les années à venir. Notre parti a conservé le contrôle de la présidence et pourra jouer un rôle clé dans la rédaction de la nouvelle constitution. Les concessions faites à la RENAMO réduisent certes notre influence au sein du gouvernement, mais ne compromettront pas notre capacité à remporter les élections à venir. Les dirigeants restent convaincus que la majorité du soutien populaire reste fidèle au FRELIMO, compte tenu de son rôle dans la libération du pays du Portugal. Nous devons néanmoins rester prudents quant aux intentions de la RENAMO, de Pretoria et de Lilongwe d’influencer les élections et d’assurer la démilitarisation des forces de la RENAMO dans tout le pays ou de rechercher de nouveaux compromis sur l’intégration de leurs soldats dans l’armée."
 MZB_CIA80.11.desc:0 "Faire reculer le communisme en Afrique australe est devenu un objectif stratégique majeur de l'administration. Suite à cette décision politique, le Mozambique est devenu une cible privilégiée. Ce conflit est similaire à la guerre civile angolaise, mais a reçu beaucoup moins d'attention. En l'absence de loi ou d'amendement du Congrès interdisant à notre administration d'investir dans les rebelles anticommunistes du Mozambique, nous pouvons lancer des opérations visant à affaiblir le gouvernement mozambicain sans risquer de sanctions pénales. À cet effet, la CIA a demandé à nos agents de renforcer leurs liens avec la Résistance nationale mozambicaine (RENAMO) afin de fournir une aide matérielle et une formation limitées à ses forces. D'autres équipes ont également été dépêchées pour organiser des réseaux à Cabo Delgado et dans d'autres zones islamiques du nord du Mozambique afin de constituer une guérilla islamique et de drainer davantage les ressources du gouvernement. Des inquiétudes ont été exprimées quant au risque que cette stratégie dégénère en violences sectaires. Cependant, le Président estime que, compte tenu de la forte présence de la minorité musulmane du Mozambique dans le nord, notamment autour de Cabo Delgado, toute violence religieuse serait limitée."
 MZB_CIA80.12.desc:0 "L'Afrique du Sud soutient depuis longtemps les rebelles anticommunistes au Mozambique. Afin de soutenir la Résistance nationale mozambicaine (RENAMO), le président a autorisé la CIA à partager des renseignements sur le Mozambique avec ses homologues de Pretoria afin de renforcer le soutien sud-africain à la RENAMO. Bien que cela puisse paraître désagréable, nos agents ont également fourni à l'Afrique du Sud des informations détaillées sur les itinéraires et les bases du Congrès national africain au Mozambique. Dans ce cas, le gouvernement sud-africain intensifiera certainement sa guerre et poursuivra son soutien à la RENAMO. Certains membres du Conseil de sécurité nationale ont toutefois exprimé des inquiétudes quant à la coopération avec les Sud-Africains, mais le président a décidé que, bien que désagréable, cette mesure était nécessaire pour détourner l'attention du gouvernement mozambicain de notre implication dans la guerre civile."
 MZB_CIA80.13.desc:0 "Bien que le renversement du gouvernement mozambicain demeure un objectif stratégique de l'administration, il a été décidé que la vie des Américains ne serait pas mise en danger dans le conflit et qu'une nouvelle escalade avec les Soviétiques devait être évitée. Cet objectif sera atteint en continuant à fournir secrètement une aide militaire aux forces rebelles, tout en niant toute implication dans la guerre civile en cours au Mozambique. Compte tenu du manque général d'équipement militaire standardisé, nos agents seront en mesure de fournir rapidement aux rebelles des armes à feu modernes, des mines terrestres et d'autres systèmes moins complexes, capables d'infliger de lourds dégâts aux forces gouvernementales. Si cela ne suffira peut-être pas à renverser le gouvernement communiste pour l'instant, cela renforcera la crédibilité de la Résistance nationale mozambicaine (RENAMO) et détournera certainement ce dernier d'un éventuel engagement avec l'Afrique du Sud."
 MZB_CIA80.14.desc:0 "Nos efforts ont commencé à porter leurs fruits. Cependant, si nous voulons véritablement éradiquer le communisme d'Afrique australe, nous devons préparer le terrain pour une intervention américaine dans la région. À cet effet, nos agents sur le terrain ont recueilli des photos, des témoignages et d'autres informations auprès des habitants locaux, illustrant les horreurs de la guerre. Bien que nous vérifions et vérifions ces informations, les images poignantes d'enfants amputés par l'usage intensif de mines terrestres toucheront sans aucun doute le cœur des Américains et contribueront à faire pression sur le Congrès pour qu'il finance davantage nos efforts en Afrique. Pendant que les médias relayeront ces informations, notre ambassadeur auprès des Nations Unies présentera les preuves devant les Nations Unies et appellera à une mesure visant à imposer un cessez-le-feu au Mozambique. Cette mesure sera vouée à l'échec, mais elle démontrera au public notre volonté de mettre fin au conflit et montrera le refus des forces communistes de négocier ou de contribuer à mettre fin au bain de sang."
 MZB_CIA80.15.desc:0 "Afin de justifier une invasion du Mozambique, le secrétaire d'État a lancé un ultimatum au gouvernement mozambicain, exigeant qu'il accepte de négocier avec la Résistance nationale mozambicaine (RENAMO). Nous espérons que le gouvernement mozambicain rejettera cet ultimatum, ce qui justifierait une intervention armée visant à renverser le gouvernement et à installer un gouvernement pro-occidental sous la direction de la RENAMO. Bien que l'opinion publique soit encore largement divisée sur la question, de récents sondages d'opinion ont montré une augmentation du soutien à l'intervention au Mozambique, suite à notre vaste campagne médiatique dénonçant les actions du gouvernement mozambicain contre la population mozambicaine. Néanmoins, si nous sommes contraints d'envahir le Mozambique, nous devons garantir une victoire rapide et ne pas rappeler à l'opinion publique les bourbiers passés en Asie au cours des dernières décennies."
 MZB_CIA80.16.desc:0 "Une récente missive de Washington a provoqué une onde de choc aux plus hautes sphères de notre gouvernement. Les États-Unis menacent d'envahir notre pays pour renverser notre gouvernement si nous n'acceptons pas d'entamer des négociations avec les rebelles afin de mettre fin à la guerre civile. Compte tenu du ton des revendications, toute négociation que nous engagerons sera intrinsèquement truquée contre nous. Cependant, contrairement à l'Éthiopie ou à l'Angola, les volontaires étrangers participant à notre lutte sont minimes et les Américains, avec leurs alliés, seraient probablement en mesure de paralyser notre armée en quelques jours, si cela devait nous empêcher de contrôler la capitale et de vastes pans du pays. Pourrions-nous néanmoins accepter la proposition, prôner un gouvernement d'unité nationale et faire confiance à la démocratie ? Comment procéder ?"
 MZB_CIA80.18.desc:0 "Le gouvernement mozambicain a rejeté notre ultimatum de négociations. Cette annonce nous donne enfin toute la justification nécessaire pour lancer notre campagne armée contre le Mozambique. Dans cet esprit, les planificateurs militaires du ministère de la Défense ont élaboré des plans pour envoyer un groupe aéronaval dans la région et permettre à nos forces aériennes de paralyser rapidement les forces armées mozambicaines afin de permettre aux forces d'opposition de lancer une offensive générale. Une fois les forces gouvernementales neutralisées par notre puissance aérienne, nos forces chercheront à lancer un assaut sur Maputo, la capitale du Mozambique, avec le soutien secret de l'Afrique du Sud voisine. Bien que des problèmes puissent survenir, nos analystes ne pensent pas que la prise de contrôle de la capitale et d'autres zones urbaines soit un problème majeur. Cependant, il sera important de veiller à ce qu'une insurrection communiste ne paralyse pas le nouveau gouvernement et représente une menace potentielle majeure pour un gouvernement pro-occidental."
 MZB_CIA80.20.desc:0 "Étonnamment, le gouvernement mozambicain a entendu raison et a accepté de négocier la fin de la guerre civile. Ce n'était pas notre intention lorsque nous avons lancé cet ultimatum. Cependant, nous pouvons saisir cette occasion pour imposer un gouvernement d'unité dominé par la Résistance nationale mozambicaine (RENAMO) et garantir une constitution plus démocratique au Mozambique. Une condition essentielle pour mettre fin à la guerre civile sera l'expulsion de tous les membres et forces du Congrès national africain (ANC) du pays et la fusion des forces armées des deux camps, la priorité étant donnée aux officiers de la RENAMO. Il s'agit d'une victoire majeure pour notre administration et d'une première étape pour inverser la progression du communisme en Afrique australe. Il reste néanmoins du travail à faire et nous devons veiller au bon déroulement des négociations et éviter de susciter l'ire excessive de Moscou et du Congrès."
 MZB_CIA80.22.desc:0 "L'échec de la diplomatie dans la résolution de la guerre civile mozambicaine ne nous laisse guère d'autre choix que d'intervenir directement dans le conflit. Malgré leur réticence potentielle à négocier, l'objectif de l'opération sera de vaincre militairement le gouvernement du Front de libération du Mozambique (FRELIMO) et d'instaurer un gouvernement dirigé par la Résistance nationale mozambicaine (RENAMO). Cet objectif stratégique représenterait le recul du communisme en Afrique australe et réduirait la pression sur l'Afrique du Sud en coupant l'une des voies logistiques d'approvisionnement du Congrès national africain (ANC) et d'autres mouvements insurgés en Afrique du Sud. Cela dit, nous devrons soigneusement équilibrer nos priorités afin d'éviter toute réaction publique vis-à-vis de l'Afrique du Sud. Officiellement, nos motivations pour cette intervention sont de mettre rapidement fin à cette guerre civile sanglante et d'établir un gouvernement capitaliste, techniquement démocratique, ouvert aux négociations avec Pretoria."
 MZB_CIA80.24.desc:0 "Bonne nouvelle : les États-Unis ont enfin lancé leur intervention au Mozambique pour mettre fin au régime communiste qui gangrène notre pays. Nos contacts à la CIA nous ont assurés qu'une fois le gouvernement communiste renversé, nous formerions le nouveau gouvernement. Cela dit, il est temps pour nous de redoubler d'efforts pour nous emparer de territoires et expulser les communistes de nos terres légitimes. La protection des zones rurales sera essentielle dans les temps à venir pour empêcher une nouvelle insurrection communiste dans tout le pays. Nous devrons également commencer à élaborer une politique étrangère qui équilibre nos dettes envers Pretoria, Washington et le Malawi, tout en renforçant le soutien populaire à notre gouvernement. Le Malawi en particulier devra être traité avec prudence, compte tenu du fort soutien qu'il apporte à notre mouvement tout en revendiquant subtilement une grande partie de notre pays. Notre gouvernement devra également déterminer comment gérer les forces du Congrès national africain (ANC) et les trafiquants sur son territoire. Il s'agit néanmoins du début d'un moment historique de l'histoire africaine, qui démontre que la vague communiste en Afrique peut être inversée."
 MZB_CIA80.25.desc:0 "Nouvelle intéressante : les États-Unis ont lancé une intervention de grande envergure au Mozambique pour écraser le gouvernement communiste. Bien que notre intervention ouverte n'ait pas été sollicitée, nous avons fourni à Washington des renseignements importants sur les forces gouvernementales et leurs milices alliées. Nos forces spéciales ont reçu l'autorisation d'attaquer les bases du Congrès national africain (ANC) de l'autre côté de la frontière afin d'endommager leurs infrastructures, alors que le Mozambique est plongé dans le chaos. Globalement, c'est une excellente nouvelle pour nos problèmes actuels. Compte tenu de notre soutien à la Résistance nationale mozambicaine (RENAMO), le nouveau gouvernement devrait se montrer favorable à nos intérêts et, à tout le moins, réprimer la présence de l'ANC au Mozambique. Il sera probablement ouvert à une collaboration économique avec nous et notre allié, le Malawi, qui a également été un important bienfaiteur de la RENAMO. La persistance de problèmes, notamment en Afrique du Nord-Ouest et en Angola, devrait gravement compromettre les opérations de l'ANC dans l'est du pays et nous permettre de redéployer nos forces pour combattre davantage les forces communistes dans le nord-ouest."
 MZB_CIA80.26.desc:0 "Les Américains ont lancé une invasion pour renverser notre gouvernement. Cette opération fait suite à l'échec de leur tentative de mettre fin à la guerre civile. Les troupes américaines ont commencé à débarquer sur nos côtes et nos installations militaires ont été bombardées massivement. Les combattants de l'opposition, eux aussi enhardis et apparemment mieux armés, ont commencé à semer le chaos derrière nos lignes. Malheureusement pour nous, contrairement à l'Angola ou à l'Éthiopie, la présence cubaine est quasiment inexistante et il est extrêmement improbable que des renforts arrivent à temps pour sauver notre situation. La situation actuelle est sombre et ne fera probablement que s'aggraver à mesure que l'invasion s'intensifie. Nous devrons nous demander si une reddition conditionnelle ou un combat acharné est la meilleure option pour l'avenir."
 MZB_CIA80.17.desc:0 "Dans une escalade majeure, le président [USA.GetLeader] a lancé un ultimatum à la Résistance nationale mozambicaine (RENAMO) et au Front de libération du Mozambique (FRELIMO) pour qu'ils cessent les hostilités et engagent des pourparlers de paix diplomatiques, sous peine de graves conséquences. Les dirigeants de la RENAMO ont déjà annoncé leur soutien au processus et ont approuvé l'idée de pourparlers de paix dans les heures qui ont suivi l'annonce. Cependant, le FRELIMO n'a pas encore commenté l'ultimatum. Cuba a fermement condamné l'ultimatum et s'est engagé à soutenir le FRELIMO dans une confrontation armée avec les États-Unis. Alors que plusieurs autres pays socialistes et africains ont condamné l'ultimatum, la majorité de la communauté internationale est restée tièdement indifférente à la situation au Mozambique. Pendant ce temps, Pretoria a annoncé son ferme soutien à la RENAMO et sa volonté de stabiliser la région."
 MZB_CIA80.19.desc:0 "Le Front de libération du Mozambique (FRELIMO) a annoncé son opposition aux négociations de paix avec la Résistance nationale mozambicaine (RENAMO) visant à mettre fin pacifiquement à la guerre civile dans le pays. Cette décision fait suite à l'ultimatum lancé par le président américain [USA.GetLeader] aux deux parties au conflit : accepter des négociations de paix sous peine de lourdes conséquences. Dans un discours de défi, [MZB.GetLeader], le chef du FRELIMO a prononcé un discours enflammé, déclarant que le FRELIMO lutterait jusqu'au bout contre les impérialistes américains et leurs laquais de la RENAMO. Suite à l'échec de cet ultimatum, des inquiétudes ont été exprimées aux Nations Unies quant à une éventuelle invasion américaine. Bien que le président [USA.GetLeader] n'ait pas encore commenté l'évolution de la situation, le Pentagone a publié un communiqué indiquant que toutes les options étaient envisageables."
 MZB_CIA80.21.desc:0 "Un accord de paix négocié par les États-Unis a officiellement mis fin à 15 ans de guerre civile au Mozambique, qui a fait près d'un million de morts et déplacé des millions de personnes. Signé par le gouvernement mozambicain et les rebelles de la RENAMO, cet accord marque une avancée majeure dans les efforts diplomatiques visant à rétablir la paix dans le pays.\n\nLa guerre, qui a éclaté peu après l'indépendance du Mozambique du Portugal, a dévasté le pays. Le conflit a gravement endommagé l'économie et causé des souffrances généralisées, le gouvernement et la RENAMO se livrant à une lutte acharnée pour le contrôle du pays.\n\nL'accord de paix, facilité par des diplomates américains et soutenu par les Nations Unies, prévoit des dispositions relatives au désarmement des combattants de la RENAMO, à la représentation politique et à la tenue d'élections futures. Une clause d'amnistie a également été convenue pour favoriser la réconciliation.\n\nLes dirigeants internationaux ont salué l'accord, le secrétaire d'État américain le qualifiant de « victoire de la diplomatie ». Le Mozambique est désormais confronté au défi de la reconstruction, mais cet accord offre l'espoir d'une paix et d'un redressement durables."
 MZB_CIA80.23.desc:0 "Suite au rejet par le Front de libération du Mozambique (FRELIMO) des pourparlers de paix concernant la guerre civile en cours, les États-Unis ont lancé une invasion au Mozambique. Les forces de la Résistance nationale mozambicaine (RENAMO) ont également lancé une nouvelle offensive majeure contre les positions du FRELIMO dans tout le pays, désormais soutenues par la puissance aérienne américaine. L'invasion a été largement condamnée par de nombreux pays, notamment l'Union soviétique et l'Allemagne de l'Est. Cuba s'est engagée à fournir des conseillers militaires et du matériel au FRELIMO, mais n'a pas encore décidé de s'impliquer davantage, d'autant plus que Cuba participe déjà aux conflits en Angola et en Éthiopie. Des critiques nationales ont avancé que cela pourrait se transformer en un nouveau Vietnam, mais les organisations anticommunistes et les partisans de la RENAMO ont soutenu que la situation était complètement différente et que l'armée américaine était aujourd'hui plus adaptée à de telles opérations."
 CIA_RUS.0.desc:0 "À la surprise générale et de notre propre gouvernement, le « rideau de fer » est bel et bien tombé et les gouvernements communistes qui se cachent derrière lui implosent rapidement. Cela crée une opportunité intrigante pour l'Agence. La désintégration rapide du bloc de l'Est et de l'Union soviétique nous offre l'occasion d'intervenir activement dans les affaires des nouveaux États indépendants d'Europe de l'Est et d'Asie centrale. Cependant, cela susciterait certainement l'ire de la Russie et pourrait compromettre irrémédiablement les chances d'établir une relation constructive avec Moscou. Par ailleurs, d'autres analystes ont avancé qu'une intervention active dans l'ancien bloc soviétique ne ferait que déstabiliser la région et provoquer de nouveaux conflits. En revanche, l'implantation active de régimes pro-américains dans l'ancien bloc de l'Est renforcerait certainement notre position géopolitique dans le monde et pourrait consolider le statut de seule hyperpuissance mondiale de l'Amérique. D'autres propositions incluent le financement de séparatistes en Russie, notamment en Tchétchénie, au Tatarstan et en Kalmoukie. Comment procéder ?"
 CIA_RUS.1.desc:0 "Après mûre réflexion et de longues discussions entre le conseiller à la sécurité nationale, le directeur de la CIA et le président, [USA.GetLeader] a choisi de s'abstenir de toute opération de renseignement d'envergure dans l'ancienne sphère d'influence soviétique. Si plusieurs membres de l'administration ont critiqué cette décision, la jugeant comme une occasion manquée, le sentiment général est que l'établissement d'une relation constructive avec Moscou devrait être prioritaire par rapport à l'expansion des opérations secrètes américaines et de leur influence directe dans l'ex-Union soviétique. Par ailleurs, des inquiétudes ont été exprimées quant à la proposition de promouvoir activement des éléments sécessionnistes et islamistes en Russie et dans d'autres anciennes républiques soviétiques, susceptible d'avoir des répercussions et de favoriser le terrorisme dans le monde entier, tout en provoquant inutilement de nouveaux troubles en Eurasie. L'avenir nous dira s'il s'agissait véritablement d'une sage décision, propice à des relations cordiales avec Moscou, ou d'une occasion manquée de paralyser définitivement un adversaire."
 CIA_RUS.2.desc:0 "Après mûre réflexion et de longues discussions entre le conseiller à la sécurité nationale, le directeur de la CIA et le président, [USA.GetLeader] a décidé de miser sur la proposition d'ingérence dans l'ancienne sphère d'influence soviétique. Des plans sont déjà en cours d'élaboration pour contrer d'éventuelles invasions russes des républiques voisines, notamment la Géorgie, et des rapports d'analyse sur la guerre du Karabakh sont également disponibles. Une question controversée au sein des services de renseignement concerne la position que notre administration devrait adopter face aux différents mouvements islamistes présents dans l'ex-Union soviétique, notamment la gestion de la Tchétchénie et de la guerre civile en cours au Tadjikistan. Une faction souhaite collaborer avec les anciens États soviétiques pour lutter contre le terrorisme islamiste radical, tandis qu'une autre souhaite utiliser les organisations islamistes de la région pour déstabiliser les régimes anti-américains. Chacune de ces options aura certainement des conséquences durables, non seulement pour la région, mais peut-être pour le monde entier."
 CIA_RUS.3.desc:0 "Alors que les révolutions de 1989 et la dissolution définitive de l'Union soviétique touchent à leur fin, nombreux sont ceux qui ont qualifié l'Amérique de vainqueur de la « Guerre froide ». Cela dit, de nombreux analystes du Département d'État et des instituts de recherche connexes ont appelé à la retenue pendant cette période. Le président américain [USA.GetLeader] a signalé son intention d'intensifier rapidement ses activités clandestines et ouvertes au-delà de l'ancien rideau de fer. Dans un discours public prononcé aujourd'hui, le président [USA.GetLeader] a déclaré le début d'une nouvelle ère, celle d'une Pax Americana où l'Amérique sera la seule hyperpuissance mondiale et cherchera à diffuser les valeurs américaines dans tout l'ancien bloc soviétique. Des inquiétudes et des critiques ont été exprimées par divers détracteurs nationaux et internationaux de l'administration. Cependant, avec l'effondrement de l'Union soviétique, le désir d'interventionnisme de l'opinion publique américaine a rapidement augmenté et la cote de popularité du président atteint actuellement des sommets historiques."
 CIA_WER.1.desc:0 "Le Royaume-Uni est depuis longtemps l'un de nos plus proches alliés et un membre clé de l'Organisation du Traité de l'Atlantique Nord (OTAN). Malheureusement, l'aile gauche du Parti travailliste affiche depuis longtemps des tendances inquiétantes, remontant aux années 1950, face au conflit mondial actuel. Ces dernières années, cependant, ces tendances ont atteint des niveaux encore plus extrêmes avec l'émergence de la faction « Tendance militante » à Liverpool, qui a réussi à faire élire plusieurs députés alors qu'elle était membre du Parti travailliste. La tendance militante est une faction politique entriste, idéologiquement décrite comme marxiste-léniniste et trotskiste. Qu'un tel groupe parvienne à exercer une influence accrue sur l'un des deux principaux partis politiques britanniques serait assurément un désastre pour les relations anglo-américaines et l'OTAN dans son ensemble. Bien que l'influence actuelle de cette faction soit limitée et peu susceptible de s'accroître, surveiller ses dirigeants, comme Ted Grant, nous permettra d'intervenir si nécessaire."
 CIA_BLOC80.o:0 "Alors que nous entrons dans une nouvelle décennie de conflit avec l'Union soviétique, il est impératif d'examiner nos options pour des opérations clandestines au-delà du rideau de fer. Compte tenu de l'efficacité des États sécuritaires établis dans plusieurs États du bloc de l'Est, notamment en Allemagne de l'Est, les opérations directes ont peu de chances de réussir. Cependant, d'autres options, plus subtiles, persistent. La principale option consisterait à étendre les émissions radiophoniques ciblant le bloc de l'Est, en particulier l'Allemagne de l'Est, afin de saper le soutien au gouvernement. Cependant, la cible potentielle la plus intrigante est la Pologne. Les conflits sociaux qui secouent la Pologne ces dernières années ont fait de ce pays communiste une cible de choix pour encourager un soutien supplémentaire et potentiellement soutenir le mouvement ouvrier Solidarité. Cela étant dit, nous devons également veiller à ce que nos opérations ne dépassent pas les bornes et à atténuer le risque d'escalade avec l'Union soviétique afin d'éviter une nouvelle guerre mondiale."
 CIA_BLOC80.1:0 "Les troubles en Pologne continuent de s'étendre et de s'intensifier. Afin d'accroître la pression sur la Pologne et le Pacte de Varsovie dans son ensemble, la CIA a donné son feu vert à un plan visant à financer Solidarité et à soutenir son mouvement par d'autres moyens financiers et une petite aide à la propagande. Outre l'aide financière apportée au mouvement et son indifférence à l'Occident, la CIA a également contacté le Vatican pour qu'il renforce son soutien à Solidarité afin de rallier davantage la population majoritairement catholique à son mouvement. Cela ne ferait qu'exacerber les tensions entre l'Église catholique et le gouvernement polonais, déstabilisant davantage ce dernier et érodant son soutien populaire. En fin de compte, quel que soit le sort de Solidarité, la situation est favorable à notre gouvernement. Dans un cas, les Soviétiques et d'autres devront intervenir pour sauver le gouvernement communiste en Pologne ou permettre sa chute."
 CIA_BLOC80.2:0 "Alors que les troubles continuent de se propager en Pologne et que le mouvement Solidarité gagne en puissance, il est temps d'envisager de nouvelles actions pour soutenir le mouvement. Notre administration a déjà commencé à fournir un financement secret à Solidarité, mais nos agents peuvent faire bien plus que simplement financer. En vertu de la nouvelle proposition de loi, nos agents commenceront désormais à fournir un soutien technique et une assistance, tels que des presses à imprimer, du matériel électronique et d'autres moyens de propagande pour leur mouvement. Cependant, nous avons veillé à ce qu'aucune aide létale ne soit fournie afin d'éviter de susciter davantage d'hostilité envers l'Union soviétique et de fournir un nouveau prétexte pour réprimer la population polonaise. Cependant, certains membres du Conseil de sécurité nationale estiment qu'il s'agit d'une occasion manquée de déstabiliser davantage la Pologne et, par conséquent, le bloc de l'Est dans son ensemble, en évitant de déclencher un soulèvement violent susceptible de déclencher une invasion soviétique de la Pologne."
 CIA_BLOC80.3:0 "Avec la répression gouvernementale contre les dissidents, Solidarité et même d'anciens dirigeants, le moment est clairement venu de lancer secrètement un projet de changement de régime en Pologne. Si nous avons commencé à fournir un soutien technique et une aide conventionnels à Solidarité, nos agents ont récemment reçu le feu vert pour expédier une aide létale, principalement des armes légères et d'autres armes conventionnelles, à ses militants partisans, dans le but d'envenimer encore la situation en Pologne. Une telle mesure accroît considérablement le risque d'une intervention soviétique en Pologne, ce qui constituerait un coup de propagande majeur pour la lutte anticommuniste. Cependant, des voix dissidentes au sein du Conseil de sécurité nationale et des services de renseignement ont affirmé que ce changement de politique est excessivement source de divisions et augmente les risques de découverte du complot par l'Union soviétique. De plus, des dissidents ont affirmé que cela ne ferait que déstabiliser l'Europe et pourrait engendrer des situations plus instables en Europe, aggravant ainsi les risques d'une nouvelle guerre mondiale."
 CIA_BLOC80.4:0 "Alors que le système soviétique continue de montrer des fissures majeures, plusieurs chefs de station ont proposé d'entamer des contacts avec des dirigeants potentiels de l'Europe de l'Est post-soviétique, notamment en Pologne. Tout en engageant des contacts avec des dirigeants non communistes potentiels en Europe de l'Est, nos agences doivent veiller à ne pas s'opposer outre mesure aux autorités soviétiques et autres autorités communistes afin d'éviter tout risque d'escalade et d'incidents internationaux. Ceci dit, le candidat idéal pour engager des contacts est Lech Walesa. Walesa, leader charismatique du mouvement social indépendant et anti-autoritaire, s'imposera probablement comme le principal dirigeant non communiste de la Pologne post-communiste. Collaborer avec des dirigeants tels que Walesa permettra à notre gouvernement de mieux élaborer des plans et stratégies de politique étrangère en cas d'effondrement de l'Union soviétique, et de favoriser potentiellement l'élargissement de l'Organisation du Traité de l'Atlantique Nord."
 CIA_IRQ80.0.desc:0 "L'instabilité croissante du dictateur irakien Saddam Hussein devient un problème de plus en plus alarmant pour notre politique étrangère dans la région. Entre les retombées de la guerre Iran-Irak et la rhétorique revancharde de Bagdad, notamment à l'égard du Koweït, le Conseil de sécurité nationale, avec l'approbation du président, a signé une proposition visant à préparer un coup d'État contre Saddam et le gouvernement baasiste. Ce sera assurément une tâche difficile, qui nécessitera une planification, une vérification et un recrutement intensifs d'agents au sein du gouvernement irakien, de l'armée et de la diaspora. Même si le plan est approuvé, les services de renseignement n'ont pas encore désigné les meneurs potentiels d'un coup d'État, et encore moins ceux qui dirigeraient un gouvernement irakien post-baasiste. Une attention particulière a toutefois été portée à la recherche de dirigeants potentiels parmi les officiers en activité pendant la guerre Iran-Irak, en particulier ceux qui ont été écartés depuis, soupçonnés d'être des rivaux potentiels de Saddam et d'autres responsables baasistes fidèles."
 CIA_IRQ80.1.desc:0 "Le gouvernement baasiste irakien de Saddam Hussein s'est révélé être l'un des dirigeants les plus chaotiques et déstabilisateurs d'une puissance régionale au Moyen-Orient de ces dernières années. Non seulement il a déclenché des guerres majeures, mais il a également lancé des campagnes brutales contre sa propre population, sur des bases ethniques et religieuses. Dans ce contexte, le président a autorisé le lancement d'un plan visant à lancer un coup d'État contre Saddam Hussein et à former un gouvernement plus pro-occidental pour rétablir la stabilité dans la région. Les vastes réserves pétrolières de l'Irak rendent le maintien au pouvoir d'un dirigeant aussi chaotique et imprévisible incompatible avec nos objectifs stratégiques dans la région. Par ailleurs, la prévention d'une nouvelle crise pétrolière est une priorité majeure de notre administration, et garantir l'accès au pétrole irakien contribuerait grandement à garantir un approvisionnement constant et stable."
 CIA_IRQ80.2.desc:0 "L'un des problèmes actuels liés à la préparation d'un coup d'État est de déterminer qui en sera le chef et qui dirigera le gouvernement irakien post-coup d'État. L'ancien général de la Garde républicaine Mohammed Abdullah al-Shahwani semble être un candidat de choix pour ce poste. Héros de guerre reconnu de la récente guerre Iran-Irak, il a été limogé pour avoir été perçu comme une menace pour Saddam Hussein. Durant cette guerre, il a notamment mené une offensive aérienne visant à reprendre le mont Kardamand, au Kurdistan irakien, aux mains de plusieurs milliers d'Iraniens retranchés. Il était également responsable de l'École des forces spéciales irakiennes et avait été formé à l'École des Rangers de l'armée américaine. Ses nombreuses relations, son expérience, sa réputation et sa volonté de collaborer avec nos services de renseignement font de lui un candidat de choix. Le général al-Shahwani a déjà contacté nos agents pour obtenir des informations complémentaires sur le gouvernement irakien et devrait accepter sans hésiter son rôle dans le projet de coup d'État."
 CIA_IRQ80.3.desc:0 "Maintenant que nous disposons d'un leader crédible pour notre plan de coup d'État, nous devons gagner davantage de soutiens au sein de l'armée irakienne actuelle. Pour ce faire, nos agents en Irak ont ​​été autorisés à offrir des pots-de-vin, des concessions et d'autres avantages à des officiers ciblés afin qu'ils soient disposés à agir contre le gouvernement baasiste à l'avenir. Nos analystes estiment qu'une infiltration accrue du corps des officiers sera actuellement la méthode la plus efficace pour renverser le gouvernement baasiste. Néanmoins, nous devons nous efforcer de rester discrets afin d'éviter d'alerter le gouvernement ou de laisser des rumeurs se propager dans l'opinion publique irakienne. La répression qui dure depuis des années contre d'autres partis et mouvements politiques en Irak a conduit l'opposition politique de premier plan à ne pas partager nos intérêts. Après tout, nous ne voudrions pas remplacer un Irak baasiste par une autre théocratie chiite qui chercherait à exporter la révolution chez ses voisins."
 CIA_IRQ80.4.desc:0 "Plusieurs officiers de l'armée irakienne ont accepté nos pots-de-vin et se sont engagés à soutenir notre projet de coup d'État visant à renverser Saddam Hussein. Il s'agit d'une étape importante dans notre plan visant à renverser le gouvernement baasiste. Alors que de nombreux membres des services de renseignement avaient dénoncé nos opérations visant à renverser le gouvernement irakien, les jugeant irréalistes et inutiles, cette étape majeure démontre clairement qu'il existe une voie possible pour placer un dirigeant pro-occidental à la tête de l'État irakien. Il reste néanmoins beaucoup à faire et nous devons maintenant chercher à élargir notre réseau de soutien au complot en Irak, notamment au sein des services de renseignement irakiens, des Gardiens de la révolution irakiens et des partis politiques potentiellement anti-baasistes en Irak et dans la diaspora. La proposition de contacter la Garde républicaine et l'opposition politique a suscité une vive polémique au sein des services de renseignement, craignant de compromettre la mission. Nous devrons concilier ces préoccupations et déterminer notre ligne de conduite dans les semaines à venir."
 CIA_IRQ80.5.desc:0 "Malheureusement, notre tentative de corruption a largement échoué. La plupart des officiers ont nié les pots-de-vin grâce à la surveillance des services de sécurité irakiens, et une tentative s'est même soldée par une opération locale de corruption, forçant notre agent à se retirer précipitamment. Heureusement, aucun de nos agents n'a été capturé lors de cette opération ratée. Cela dit, sans le soutien d'un plus grand nombre de membres de l'armée irakienne, il est difficile d'envisager une tentative de coup d'État à l'heure actuelle.\n\nNous devons maintenant également nous demander si nous devons poursuivre ce complot. Bien que nous n'ayons aucune confirmation que le gouvernement irakien soit au courant du plan, les risques sont désormais non négligeables et tout investissement supplémentaire dans cette entreprise pourrait simplement être un gaspillage d'argent qui serait mieux utilisé pour soutenir d'autres opérations. Cette position ne fait toutefois pas l'unanimité, et une large partie des services de renseignement insiste pour que ce plan soit mis en œuvre, notant l'instabilité générale du gouvernement baasiste et la nécessité de sécuriser le pétrole irakien."
 CIA_IRQ80.6.desc:0 "Poursuivant nos tentatives de corruption d'officiers irakiens pour qu'ils se joignent à notre complot, l'étape suivante consistait à compromettre les services de renseignement irakiens. Maintenant qu'ils ont été significativement compromis, nos chances de succès s'en trouvent grandement accrues. Le mécontentement au sein des services de renseignement irakiens grandit depuis des années après diverses purges internes et des opérations étrangères ratées. Heureusement, ce climat a préparé le terrain pour que nos agents recrutent avec succès des membres au sein des services de renseignement irakiens afin de soutenir notre prochain coup d'État visant à renverser le gouvernement baasiste. Si cela ne suffira pas à garantir le succès de l'opération, cela représente une avancée significative pour notre opération et pourrait renforcer les chances de maintenir la sécurité opérationnelle du coup d'État prévu. Des inquiétudes ont toutefois été soulevées quant au risque de recrutement d'agents doubles potentiellement fidèles au gouvernement baasiste."
 CIA_IRQ80.7.desc:0 "Ayant déjà établi des liens au sein de l'armée, nous nous sommes maintenant attachés à nouer des contacts au sein de la Garde républicaine irakienne. Jusqu'à présent, le succès a été mitigé. Globalement, nos agents ont réussi à nouer des contacts au sein de la Garde républicaine irakienne et, étonnamment, ont recruté plusieurs officiers de la Garde républicaine pour participer au complot, suite au mécontentement croissant suscité par les nombreux échecs du gouvernement baasiste ces dernières années. Notre figure de proue du prochain coup d'État, ancien général et chef d'une unité d'hélicoptères de la Garde républicaine, et célèbre héros de guerre de la précédente guerre contre l'Iran, s'est avéré un choix judicieux compte tenu de sa popularité au sein de la Garde républicaine. Cela dit, la majorité de la Garde républicaine reste fidèle au gouvernement baasiste et cherchera probablement à reprendre le contrôle du pays immédiatement après le coup d'État. Si un nombre significatif de ses membres font défection, le potentiel de réussite d'un contre-coup d'État devrait diminuer considérablement."
 CIA_IRQ80.8.desc:0 "Bien que le plan ait été initialement conçu pour fonctionner uniquement avec l'armée irakienne et les services apparentés, le Conseil national de sécurité a décidé d'y intégrer les forces de l'opposition irakienne. À cet effet, la CIA a demandé à nos agents locaux de demander à leurs collaborateurs en Irak de contacter les organisations antigouvernementales afin d'organiser des actions en lien avec le plan de coup d'État. Si tout se déroule comme prévu, des manifestations publiques coïncideront avec le déclenchement du coup d'État, affaiblissant davantage la réponse baasiste au coup d'État et donnant à nos co-conspirateurs davantage de temps pour prendre le contrôle de l'appareil d'État et éliminer des responsables clés. Des inquiétudes ont toutefois été exprimées quant à d'éventuels objectifs stratégiques à long terme différents de ceux de l'opposition irakienne et de nos propres objectifs pour la région, ainsi que quant au risque que ce plan entraîne de nombreuses victimes civiles si le coup d'État ne se déroule pas comme prévu."
 CIA_IRQ80.9.desc:0 "Bien que l'idée d'associer les forces d'opposition irakiennes au plan aurait pu être bénéfique, il a été décidé de s'en tenir à des contacts avec des officiers militaires et potentiellement avec les Gardiens de la révolution irakiens afin de minimiser les risques de fuites du plan jusqu'aux dirigeants irakiens. Bien que plusieurs membres des services de renseignement aient protesté contre cette initiative, le consensus général était que cette proposition aurait non seulement risqué de révéler le plan au gouvernement baasiste, mais qu'elle aurait également fait peser un risque trop élevé de voir le complot dégénérer en massacre de civils dans tout l'Irak ou dégénérer en guerre civile où des factions plus radicales pourraient s'emparer du pouvoir au détriment de nos objectifs stratégiques régionaux. Des inquiétudes ont également été exprimées quant à la possibilité qu'une guerre civile permette à l'Iran de chercher à installer un gouvernement fantoche à Bagdad, une issue qui serait tout simplement intolérable pour nos alliés du Moyen-Orient et notre propre influence dans la région."
 CIA_IRQ80.10.desc:0 "Malheureusement, notre complot a été révélé et le gouvernement irakien a rapidement pris des mesures pour étouffer ce coup d'État potentiel. De nouvelles purges militaires et de renseignement ont permis d'arrêter nombre de nos collaborateurs. Heureusement, de nombreux autres, vraisemblablement fidèles au régime, ont également été impliqués dans ces purges, affaiblissant ainsi l'efficacité de l'armée et des services de renseignement irakiens. Cela signifie toutefois que nos liens, déjà fragiles, avec le gouvernement irakien vont encore se détériorer et que nos chances de renverser le gouvernement baasiste sont quasiment nulles dans un avenir proche. Des inquiétudes ont également émergé quant à la possibilité que l'Irak tente de déclencher une nouvelle crise pétrolière. Cependant, les rapports d'analyse des menaces et des risques les plus récents indiquent que cela est extrêmement improbable compte tenu de nos projections de forces dans la région et de la sécurité générale des autres pays exportateurs de pétrole, sans compter que l'Irak dépend des exportations pétrolières pour financer son gouvernement."
 CIA_IRQ80.11.desc:0 "Après plusieurs semaines de préparation, nous approchons du lancement de l'opération. Jusqu'à présent, nos sources ont insisté sur le maintien de la sécurité opérationnelle et sur le fait que les services de sécurité baasistes ignorent toujours l'existence du complot. Maintenant que la sécurité opérationnelle est assurée et que notre liste de co-conspirateurs est finalisée, il ne reste plus qu'à finaliser les derniers détails du complot et à fixer la date du coup d'État. Plusieurs inquiétudes subsistent, mais nous avons déjà trop avancé pour reculer et devons nous préparer à toute éventualité, tant en cas de succès que d'échec de l'opération à venir. Nos analystes ont notamment publié une nouvelle analyse des menaces, affirmant qu'en cas d'échec de la mission et si le gouvernement irakien nous associe au complot, il pourrait chercher à perturber l'approvisionnement en pétrole provenant non seulement d'Irak, mais aussi du reste du Golfe Persique, menaçant ainsi une nouvelle crise pétrolière."
 CIA_IRQ80.12.desc:0 "Le moment est venu de déclencher le coup d'État. Tous les préparatifs sont finalisés et devraient débuter dans les prochains jours, une fois le moment idéal pour l'assassinat initial de Saddam Hussein déterminé. Comme indiqué, l'opération débutera par la décapitation du régime irakien et l'assassinat de Saddam Hussein. Après la confirmation de sa mort, les officiers putschistes mobiliseront leurs soldats pour s'emparer d'importantes installations gouvernementales et arrêter les dirigeants du parti Baas arabe socialiste. Si tout est désormais planifié et préparé, rien ne garantit le succès. Plusieurs risques et incertitudes majeurs pèsent encore sur ce plan, notamment l'efficacité de la première étape, celle de l'assassinat de Saddam, et la capacité des officiers putschistes à rallier leurs subordonnés. L'heure de la planification est révolue ; il ne reste plus qu'à attendre."
 CIA_IRQ80.13.desc:0 "Malheureusement, si l'opération semblait prometteuse, les premiers assassins n'ont pas réussi à éliminer Saddam. Sans décapiter les dirigeants du régime, les officiers loyalistes ont pu mobiliser l'armée pour arrêter les conspirateurs, actuellement condamnés à mort pour leurs crimes contre l'État. On pensait que cette mission était risquée. Les médias d'État irakiens ont publié un communiqué alléguant notre participation à la tentative de coup d'État. Heureusement, aucun de nos agents n'a été capturé par le gouvernement irakien, ce qui nous a permis de rapidement démentir ces allégations. Bien que décevante, cette opération a encore déstabilisé l'Irak et nous a finalement coûté peu d'argent. Néanmoins, elle alimente les doutes et l'incertitude quant aux perspectives à long terme du marché pétrolier et pourrait entraîner des problèmes économiques si les événements conspirent à créer une nouvelle crise pétrolière."
 CIA_IRQ80.14.desc:0 "L'opération a rapidement permis de localiser Saddam et d'assassiner le tristement célèbre dictateur irakien. Heureusement, la situation n'a pas dégénéré à ce stade. Les officiers militaires participant à l'opération ont pu mobiliser leurs soldats pour participer à l'opération, prendre le contrôle de centres gouvernementaux clés et arrêter les fidèles du régime. L'ancien général et héros de guerre Mohammed Abdullah al-Shahwani est sorti d'exil et devrait s'adresser à la nation plus tard dans la soirée pour évoquer les événements en cours. Notre implication, bien que fortement spéculée par certains, a été largement passée sous silence. Si le nouveau gouvernement parvient à rétablir la stabilité en Irak, notre position dans la région sera stabilisée et les vastes réserves de pétrole irakien seront disponibles pour nos marchés, garantissant ainsi un accès au pétrole et évitant ainsi une répétition des crises pétrolières des années 1970."
 CIA_IRQ80.15.desc:0 "Le coup d'État anti-baasiste mené par le général Mohammed Abdullah al-Shahwani et d'autres éléments de l'armée irakienne a été un choc majeur pour le monde. Compte tenu de la résilience du régime baasiste au cours de la dernière décennie, face à diverses crises et à la guerre désastreuse avec l'Iran, beaucoup s'attendaient à ce qu'il ne tombe pas sans intervention étrangère ou guerre civile. Cependant, la prise rapide de Bagdad et l'arrestation puis l'exécution de plusieurs hauts responsables baasistes ont rapidement étouffé la dissidence et un potentiel conflit armé avec les loyalistes et les milices baasistes. Si des conflits de faible intensité ont fait rage dans certaines régions à majorité sunnite, le pays a été largement pacifié. Aujourd'hui, le président américain [USA.GetLeader] a annoncé que son administration reconnaissait et soutenait pleinement les actions et la légitimité du nouveau gouvernement irakien et attendait sa coopération sur de nombreuses questions géopolitiques, économiques et de sécurité dans les mois à venir."
 IRQ_CIA.100.desc:0 "Après la fin de la guerre du Golfe, un soulèvement de masse a éclaté dans le sud de l'Irak contre le régime de Saddam Hussein. Ce soulèvement, alimenté par la défaite cuisante de l'Irak et les tensions politiques, religieuses et ethniques persistantes à travers le pays, s'est rapidement intensifié et s'est désormais étendu au Kurdistan irakien. Si Saddam est clairement un acteur hostile à notre politique étrangère, il est difficile de savoir si les rebelles sont plus acceptables pour nos intérêts. La cause des rebelles est idéologiquement diversifiée : transfuges du régime de Saddam, communistes irakiens, sympathisants chiites iraniens, peshmergas kurdes et rebelles chiites, mécontents du traitement que leur inflige le régime. La rébellion a le potentiel de renverser le régime, mais cela ne se produira probablement pas sans une intervention étrangère. Un plan d'action a été transmis au président pour déterminer la marche à suivre. Si nous choisissons d'intervenir, nous ne pouvons garantir que le nouveau gouvernement sera bienveillant envers Washington. Il est tout à fait possible que le renversement de Saddam Hussein fasse de l'Irak une simple marionnette iranienne. Comment procéder ?"
 IRQ_CIA.101.desc:0 "Alors que le soulèvement irakien se poursuit, l'administration a décidé d'instaurer une zone d'exclusion aérienne sur tout le territoire irakien. Cette mesure vise à empêcher le gouvernement irakien d'écraser les forces d'opposition par ses forces aériennes et à atténuer les risques de représailles civiles. Nous avons également approuvé des règles d'engagement prévoyant notamment l'abattage d'avions irakiens et le bombardement de bases antiaériennes afin de garantir un passage sûr au-dessus du pays. Le gouvernement irakien a condamné cette mesure, la qualifiant de tentative de changement de régime, ce qui, bien que nous le nions publiquement, constitue l'un des objectifs de cette opération. Évincer [IRQ.GetLeader] du pouvoir constituerait un pas vers un Moyen-Orient plus stable et plus sûr et écarterait un dictateur brutal du pouvoir."
 IRQ_CIA.102.desc:0 "Terrible nouvelle : les États-Unis ont annoncé l'instauration d'une zone d'exclusion aérienne au-dessus des régions du sud actuellement en rébellion contre notre gouvernement. Cette mise en place bloquera de facto notre capacité à lancer des frappes aériennes et à employer des armes chimiques. Plusieurs incidents ont déjà été signalés dans le sud de notre pays. Sans cette force aérienne, nos forces qui résistent dans le sud seront certainement en difficulté et pourraient devoir reconsolider leurs lignes défensives. Cet événement constitue également un formidable stimulant pour le moral de l'opposition et pourrait inciter à de nouvelles défections au sein des forces armées au profit des rebelles. La situation reste néanmoins potentiellement rétablie tant que nos ennemis étrangers ne bombardent pas directement nos soldats ou ne lancent pas d'intervention directe. Nos forces sont largement supérieures en nombre à celles des rebelles, mais la double menace des rebelles du sud et des peshmergas kurdes du nord limite nos mouvements et notre capacité à nous redéployer rapidement dans l'une ou l'autre région pour remporter une victoire décisive."
 IRQ_CIA.103.desc:0 "Bonne nouvelle : les États-Unis ont annoncé la mise en place d'une zone d'exclusion aérienne au-dessus des régions du sud, où nos forces combattent activement le gouvernement. Grâce à cette zone d'exclusion aérienne, la capacité du gouvernement à mener des frappes aériennes et à utiliser des armes chimiques depuis les airs sera efficacement neutralisée. Des rapports font déjà état de plusieurs opérations réussies dans les territoires du sud, marquant une victoire significative pour nous. Sans puissance aérienne, les forces gouvernementales stationnées dans le sud seront fortement désavantagées, probablement contraintes de battre en retraite, leurs positions devenant intenables. Cette évolution est un formidable stimulant pour notre cause, et nous pouvons nous attendre à de nouvelles défections dans leurs rangs, leurs soldats perdant confiance. La situation penche désormais fortement en notre faveur, surtout si les puissances étrangères s'abstiennent d'intervenir directement ou de bombarder nos forces. Bien que les forces gouvernementales soient toujours supérieures en nombre aux nôtres, la pression combinée exercée par nous au sud et par les peshmergas kurdes au nord épuise leurs forces militaires, limitant leur capacité à déplacer rapidement des ressources et à obtenir un avantage décisif."
 IRQ_CIA.104.desc:0 "Alors que le soulèvement en Irak continue de se transformer en une bataille sanglante entre le gouvernement baasiste et un large spectre d'opposition antigouvernementale, des appels ont été lancés à la communauté internationale pour qu'elle se range contre le gouvernement de [IRQ.GetLeader]. Le président américain [USA.GetLeader] a annoncé aujourd'hui le lancement d'une opération militaire américaine visant à établir une zone d'exclusion aérienne dans tout l'Irak afin de priver l'armée irakienne de toute puissance aérienne pendant le conflit en cours. Cette initiative a été largement saluée par de nombreux dirigeants, notamment les pays d'Europe occidentale, l'Arabie saoudite, la Jordanie et, étonnamment, l'Iran, qui soutient également le soulèvement. Cependant, plusieurs autres États et organisations ont condamné cette nouvelle campagne, notamment le Yémen, la Yougoslavie et l'Organisation de libération de la Palestine. Cependant, même si cela ne suffit pas à faire basculer le conflit en faveur des rebelles, la question d'une nouvelle intervention des États-Unis, de l'Iran et d'autres puissances régionales demeure primordiale."
 IRQ_CIA.105.desc:0 "Malgré les appels et encouragements répétés à un soulèvement en Irak contre les dirigeants de [IRQ.GetLeader], l'Amérique s'est montrée peu encline à s'impliquer dans le soulèvement en cours. Si le président et le Département d'État ont refusé de commenter ou d'accorder des interviews sur la crise actuelle en Irak, des notes de service divulguées indiquent que l'administration est vivement préoccupée par la composition des forces rebelles. En particulier, la forte présence du parti Dawa et d'autres radicaux chiites alignés et soutenus par l'Iran est perçue comme une menace pour la stabilité régionale et une cinquième colonne pour une prise de contrôle iranienne de l'Irak. Les spéculations ont également été alimentées par la crainte qu'une déstabilisation accrue de l'Irak ne provoque des fluctuations des prix du pétrole préjudiciables à l'économie mondiale."
 IRQ_CIA.106.desc:0 "Les Américains n'ont fait qu'intensifier leurs tentatives pour mettre fin à notre glorieux règne. Des officiers des Gardiens de la révolution loyalistes nous ont informés que des cargaisons d'aide matérielle ont commencé à affluer vers les territoires tenus par les rebelles, ce qui a un impact considérable sur notre capacité à mener des opérations offensives pour reconquérir les territoires perdus. L'acquisition d'armes plus lourdes, notamment celles capables de paralyser nos forces blindées, constituera un enjeu majeur pour nos forces. Des rapports font déjà état de nouvelles défections au sein des forces armées au profit des rebelles dans les régions du sud. La situation continue de se déstabiliser et des mesures plus drastiques pourraient devoir être envisagées pour sauver le régime. Les murs se resserrent peut-être, mais nous devons continuer à nous battre à tout prix pour éviter que la nation ne tombe aux mains des communistes, des chiites, des Kurdes et des traîtres."
 IRQ_CIA.107.desc:0 "Nos contacts avec les rebelles du Sud nous ont appris que les États-Unis avaient également commencé à armer leur mouvement. Cela sera certainement bénéfique pour notre propre cause, car le gouvernement irakien devra probablement rediriger ses forces hors de notre zone pour combattre la menace plus pressante dans le Sud. Nos contacts nous ont également assuré que nos forces recevront davantage de ravitaillement et d'armes dans les prochains jours, en même temps que les rebelles du Sud, et qu'elles sont encouragées à prendre des mesures plus audacieuses contre les forces baasistes afin d'empêcher tout redéploiement rapide et organisé vers le Sud de l'Irak, susceptible de paralyser davantage l'armée irakienne. Les murs semblent se resserrer sur le gouvernement baasiste, mais le régime a survécu à d'autres crises et il reste à déterminer si le gouvernement de Bagdad parviendra à reprendre l'initiative ou s'il sera condamné à disparaître."
 IRQ_CIA.108.desc:0 "L'armée de l'air américaine a lancé des frappes aériennes sur des positions de la Garde républicaine irakienne dans le sud de l'Irak plus tôt dans la journée, selon un porte-parole du Pentagone. Il s'agit d'une escalade majeure. Auparavant, les États-Unis avaient annoncé l'instauration d'une zone d'exclusion aérienne au-dessus de l'Irak afin de priver l'armée irakienne de sa puissance aérienne pour se protéger des représailles civiles et des attaques contre les forces rebelles. Des rapports font déjà état de pertes importantes au sein de l'armée irakienne et de nouvelles défections au sein du gouvernement au profit du mouvement rebelle. Alors que les chances d'un gouvernement baasiste continuent de diminuer, des questions se posent quant à la forme que pourrait prendre l'Irak post-baasiste. La coalition contre Saddam Hussein est composée de transfuges, de baasistes pro-syriens, de communistes et de partis chiites pro-iraniens comme le parti Dawa. Cette coalition disparate parviendra-t-elle à s'unir pour former un nouvel Irak ou marquera-t-elle le début d'une nouvelle ère d'instabilité et de conflits internes ?"
 IRQ_CIA.109.desc:0 "Les nouvelles deviennent de plus en plus sombres de jour en jour. De nouveaux rapports font état de bombardements par l'armée de l'air américaine de positions des Gardiens de la révolution dans tout le sud. Cela risque de saper le moral de nos forces. En dehors des Gardiens de la révolution, les défections sont devenues monnaie courante parmi les forces rebelles à travers le pays. Face à une campagne de bombardements organisée visant à réprimer nos forces, tant contre les Kurdes que contre les rebelles du sud, les services de sécurité s'attendent à de nouvelles défections généralisées et à la perte de vastes territoires, tant au Kurdistan irakien que dans le sud de l'Irak. De plus, nos installations antiaériennes, déjà endommagées lors des conflits passés, se sont révélées totalement insuffisantes pour empêcher les Américains de bombarder nos forces. Nos défenses aériennes sont déjà totalement paralysées et nos bases aériennes ont également subi d'intenses bombardements aériens. Il sera peut-être bientôt temps d'envisager des plans de retrait pour la sécurité personnelle des hauts responsables du gouvernement."
 IRQ_CIA.110.desc:0 "Bien que nous ayons eu des différends avec l'Iran au cours de la dernière décennie, la situation actuelle en Irak offre l'occasion de reconstruire nos relations avec le gouvernement iranien. Le renversement du gouvernement irakien est dans l'intérêt de Téhéran et de Washington, surtout après la longue guerre Iran-Irak. Cependant, cette décision serait controversée, notamment pour la population américaine et iranienne. Nos diplomates au Département d'État ont commencé à rédiger une proposition qui prévoit une levée progressive des sanctions contre l'Iran ainsi que des garanties pour la légalisation des partis pro-iraniens dans un Irak post-baasiste. Si l'Iran accepte, cela sonnerait le glas du régime baasiste et renverserait l'un des dictateurs les plus dangereux au monde, tout en contribuant au rétablissement des liens américano-iraniens. Cependant, il n'est pas certain que Téhéran souhaite coopérer avec nous sur cette question, ou s'il envisage d'intervenir seul pour venger la précédente guerre Iran-Irak."
 IRQ_CIA.111.desc:0 "Une proposition intéressante nous est parvenue de Washington. Les Américains proposent de nous soutenir et de rétablir nos relations diplomatiques en échange de l'intervention de nos forces dans les troubles en Irak et du renversement du gouvernement irakien. Cette proposition implique également plusieurs concessions de part et d'autre : les États-Unis ont annoncé leur intention de commencer à lever les sanctions et soutiendraient la légalisation des partis pro-iraniens dans un Irak post-baasiste. Cependant, nous devrions également soutenir une constitution démocratique en Irak, tout en promettant de respecter l'autonomie kurde en Irak, y compris un éventuel référendum sur l'indépendance kurde. Accepter cette offre apaiserait certainement les tensions avec l'Occident et aboutirait probablement à la chute du gouvernement baasiste, instigateur de la dernière guerre. Cependant, ce serait peut-être une occasion manquée si nous souhaitons attirer directement l'Irak dans notre sphère d'influence. Nous pourrions plutôt rester complètement à l'écart du conflit, ou commencer à armer et à soutenir les rebelles irakiens, voire lancer notre propre intervention pour exporter la révolution. Comment procéder ?"
 IRQ_CIA.112.desc:0 "Le gouvernement iranien a répondu positivement à notre proposition et a accepté de coopérer sur la question irakienne. Plusieurs conditions ont été convenues en échange d'un soutien mutuel, notamment la levée partielle des sanctions américaines contre l'Iran, la garantie de l'autonomie kurde dans un Irak post-baasiste et une constitution démocratique générale pour le nouvel État. En échange, nous veillerons à ce que les partis pro-iraniens ne soient ni interdits ni réprimés par nos agents et alliés dans la région. Dans les prochains jours, des agents des Gardiens de la révolution iraniens instaureront une coordination plus étroite avec les rebelles et commenceront à leur fournir des armes, provenant des stocks iraniens et américains. Après cela et après des contacts plus approfondis, notre armée de l'air lancera une campagne contre les forces irakiennes."
 IRQ_CIA.113.desc:0 "Malheureusement, le gouvernement iranien a décliné notre offre de coopération pour renverser le gouvernement irakien. Bien qu'aucune raison n'ait été précisée, nos analystes estiment que l'Iran est tout simplement trop las de la guerre après la récente conclusion de la guerre Iran-Irak et ne souhaite pas s'engager dans une nouvelle guerre avec son voisin si tôt. Une autre suggestion, peut-être plus alarmante, est que l'Iran envisage de renverser seul le gouvernement irakien et d'exporter la révolution iranienne en Irak. Compte tenu du nombre important de chiites parmi les rebelles, cette stratégie a de fortes chances de réussir. Un Irak théocratique dans l'orbite iranienne constituerait un grave danger pour la stabilité régionale et mettrait certainement en péril les approvisionnements mondiaux en pétrole. Cela permettrait également à l'Iran d'accéder plus facilement à des alliés potentiels et aux populations chiites amies du Levant et du golfe Persique. La CIA devra suivre de près l'évolution de la situation dans la région dans les jours et les semaines à venir."
 IRQ_CIA.114.desc:0 "Dans une escalade majeure, les troupes iraniennes ont de nouveau traversé la frontière irakienne, alors que le soulèvement dans le sud de l'Irak continue de s'intensifier. Ce soulèvement, principalement mené par la population chiite et des soldats mécontents, a rapidement réussi à s'emparer de plusieurs petites villes du sud de l'Irak et se dispute actuellement la ville de Bassorah. Deux des principales factions du soulèvement dans le sud sont le Conseil suprême islamique d'Irak et le Parti islamique Dawa, tous deux prétendument soutenus par l'Iran et ayant salué la révolution iranienne. Les spéculations vont bon train sur ce que pourrait être l'Irak post-Saddam ; l'intervention iranienne pourrait laisser entrevoir la possibilité d'une République islamique en Irak, similaire à celle de l'Iran. Cela dit, le soulèvement dans le sud est également soutenu par le Parti communiste irakien, des déserteurs militaires et des baasistes pro-syriens opposés au baasisme de Saddam. L'avenir nous dira si cette intervention pourra mettre fin aux violences ou si elle marquera simplement un retour à la guerre Iran-Irak."
 CIA_KUR80.0.desc:0 "Ces dernières décennies ont démontré que la grande majorité de nos alliés arabes sont des alliés de tous bords, même dans les meilleures conditions. L'instabilité des différents régimes arabes a constitué un enjeu majeur pour plusieurs administrations. La population kurde opprimée du nord de l'Irak est depuis longtemps plus encline à accepter un soutien aligné sur les États-Unis. Face à nos difficultés persistantes avec les gouvernements syrien et irakien, le Conseil de sécurité nationale a autorisé une action visant à établir un État kurde indépendant dans le nord de l'Irak. Cette démarche aliénera certainement la Turquie, et nous devrons trouver un équilibre entre cette opération et ses préoccupations, ainsi que le risque qu'un regain de mouvement indépendantiste kurde ne dégénère en un conflit ethnique régional plus vaste. En fin de compte, l'administration a décidé que cette action était la meilleure option pour établir un nouvel État aligné sur les États-Unis dans la région, tout en déstabilisant et en affaiblissant les éléments hostiles régionaux en Irak et en Syrie."
 CIA_KUR80.1.desc:0 "Avant d'étendre notre influence et d'intensifier le conflit, l'administration a décidé de mettre en lumière la lutte des minorités irakiennes non arabes contre le gouvernement baasiste oppressif. Non seulement le gouvernement irakien a commis des actes génocidaires contre la population kurde d'Irak, mais les efforts visant à drainer les marais mésopotamiens ont conduit au nettoyage ethnique de la population arabe autochtone des marais. Si nous souhaitons obtenir un soutien en faveur de nouvelles actions contre le régime irakien, le Département d'État publiera une attaque cinglante contre les actions récentes du gouvernement irakien et son historique de persécution des minorités ethniques. Nos contacts dans les médias recevront des informations documentant l'ampleur des atrocités et des actions du gouvernement irakien afin d'attiser davantage l'opinion publique contre lui et de renforcer le soutien à l'armement des rebelles ethniques dans la région."
 CIA_KUR80.2.desc:0 "Alors que nous poursuivons notre projet d'indépendance du Kurdistan, nous devons établir des contacts avec les figures de proue du mouvement indépendantiste kurde, à savoir les dirigeants du Parti Démocratique Kurde (PDK) et de l'Union patriotique du Kurdistan (UPK). Ces mouvements, dirigés respectivement par Massoud Barzani et Jalal Talabani, entretiennent une rivalité féroce, née de la scission de l'UPK et du PDK sous la direction de Talabani, ancien membre du PDK au milieu des années 1970, en raison de luttes intestines au sein du PDK entre les conservateurs-traditionalistes de Barzani et les nationalistes et intellectuels de gauche de Talabani. Nos agents devront veiller à ce que les tensions entre les deux organisations ne dégénèrent pas en conflit ouvert et ne les empêchent pas de collaborer avec nous. Pour ce faire, nous devons contacter les dirigeants des deux partis et rechercher des liens cordiaux, puis chercher à établir un consensus sur un partage amical du pouvoir dans un Kurdistan indépendant."
 CIA_KUR80.3.desc:0 "Suite à la récente décision du Conseil de sécurité nationale, la CIA a commencé à déployer des agents au Kurdistan irakien afin de cultiver des liens avec les forces peshmergas locales. La nature rurale du mouvement d'opposition et l'opposition turque à nos efforts ont compliqué la situation. Cependant, nos agents ont réussi à établir des contacts et ont entamé des négociations avec des représentants du Parti Démocratique Kurde (PDK). Des rumeurs circulaient auparavant concernant des atrocités commises par les forces baasistes contre la population kurde ; nos agents ont relayé des confirmations et des preuves documentées de ces crimes. Des analystes de la CIA prévoient de fournir ces informations aux médias afin de susciter un tollé international contre le gouvernement irakien. Heureusement, contrairement aux mouvements kurdes de Syrie et de Turquie, les peshmergas irakiens sont largement non communistes et plus proches de la population rurale. Dans ce contexte, on s'attend à ce que les négociations aboutissent rapidement et que les opérations d'expansion des peshmergas commencent prochainement."
 CIA_KUR80.4.desc:0 "L'un des principaux problèmes rencontrés par les combattants peshmergas depuis une dizaine d'années concerne les différentes milices Jash. Les Jash sont des milices kurdes bien armées et fidèles au régime de Saddam. Elles sont constituées en grande partie d'opposants à la direction de Barzani, le Parti Démocratique du Kurdistan (PDK), et de la population kurde urbaine, plus favorable au gouvernement que les Kurdes ruraux. On estime actuellement l'effectif total des milices Jash entre 250 000 et 300 000 combattants. Pour mener à bien nos projets au Kurdistan irakien, nous devrons nous attaquer à ce problème. Le plan d'opérations récemment approuvé prévoit de commencer à verser des pots-de-vin à divers officiers des Jash afin de saper le soutien au régime de Saddam et de jeter les bases d'un soulèvement plus réussi à l'avenir."
 CIA_KUR80.5.desc:0 "L'Irak est une nation multiculturelle. Outre les populations arabe et kurde, on y trouve d'importantes populations yézidies, assyriennes et turkmènes, toutes liées par des relations complexes avec le gouvernement irakien. La CIA a donné l'ordre à nos agents sur le terrain de rencontrer des représentants de ces communautés afin de solliciter leur aide dans le cadre de notre projet d'établissement d'un État non arabe dans la région. Ce ne sera malheureusement pas une mince affaire. Des conflits persistent entre ces différents groupes ethniques. Pour y remédier, nous avons veillé à ce que les forces kurdes acceptent une proposition visant à créer des États indépendants pour ces groupes. Garantir l'indépendance de l'État turkmène pourrait également apaiser les inquiétudes de la Turquie concernant notre projet kurde, mais imposer un tel règlement risque d'exacerber les tensions entre Turkmènes et Kurdes en raison de leurs populations et de leurs revendications territoriales communes."
 CIA_KUR80.6.desc:0 "Nos contacts en Irak nous ont fait savoir que leurs discussions avec les dirigeants turkmènes, assyriens et yézidis avaient porté leurs fruits et que des accords avaient été conclus pour que ces populations s'organisent contre le gouvernement une fois la situation sécuritaire du pays détériorée. Nos alliés kurdes, encore quelque peu irrités par notre décision de tendre la main à ce groupe, ont néanmoins accepté nos propositions. Compte tenu du conflit de longue date entre tous ces groupes, cet accord devrait apaiser les inquiétudes de la diaspora et délégitimer davantage les revendications du gouvernement irakien. La Turquie s'est également engagée à soutenir les Turkmènes dans leur quête de liberté, tout en refusant de commenter les autres groupes et en restant méfiante à l'égard du projet kurde dans son ensemble. Cela représente néanmoins une avancée notable dans la gestion de cette question avec notre ancien allié."
 CIA_KUR80.7.desc:0 "Malheureusement, nos contacts en Irak nous ont signalé que divers autres groupes ethniques irakiens souhaitaient collaborer avec les Peshmergas. Selon nos contacts, la principale raison de cette situation était l'histoire des relations entre ces groupes et les Peshmergas, notamment les conflits ethniques passés, les massacres et, plus récemment, le non-respect des accords entre les deux parties. Pire encore, les représentants turkmènes ont divulgué ces communications au gouvernement turc, ce qui a encore tendu les liens avec la Turquie et renforcé leur opposition à notre objectif stratégique global au Moyen-Orient, à savoir la création d'un État kurde indépendant. Cela ne constitue toutefois pas un coup dur pour nos plans et était largement anticipé par nos agents locaux, compte tenu des tensions historiques entre ces groupes ethniques et des politiques de conciliation du gouvernement visant à exploiter ces divisions pour prévenir une escalade des troubles dans le nord de l'Irak."
 CIA_KUR80.8.desc:0 "Après un long débat au sein du Conseil de sécurité nationale, le Président a autorisé le lancement d'une campagne aérienne contre les forces irakiennes. Cette frappe sera limitée au nord de l'Irak. L'objectif est de démanteler les fortifications irakiennes dans la région, de paralyser leur capacité de redéploiement rapide et de cibler les sites utilisés pour le programme irakien de guerre chimique. Une fois ces mesures mises en œuvre, les Peshmergas devraient être en mesure de lancer une offensive générale pour prendre le contrôle de vastes zones de territoire. Pendant cette période, nos forces assureront la couverture aérienne de leur avancée et s'efforceront de démanteler tout vestige de l'armée de l'air irakienne et de réduire les risques de futures atrocités irakiennes contre la population kurde. Si l'Irak poursuit l'escalade, une campagne de bombardements plus vaste pourrait frapper ses forces plus profondément à l'intérieur du pays."
 CIA_KUR80.9.desc:0 "Depuis des décennies, les Kurdes irakiens, en particulier ceux des zones rurales, se révoltent à plusieurs reprises pour soutenir l'établissement d'un État kurde indépendant. Cependant, la campagne Anfal menée par le gouvernement irakien, qui cherche activement à mettre fin au conflit par le génocide des zones rurales kurdes et l'usage massif d'armes chimiques, a suscité l'indignation de la communauté internationale et suscité une résistance accrue de la population kurde au régime irakien. Le président américain [USA.GetLeader] a annoncé que l'armée américaine lancerait des frappes aériennes contre des cibles militaires irakiennes dans tout le Kurdistan irakien et établirait une zone d'exclusion aérienne au-dessus du nord de l'Irak. Cela représente une escalade majeure dans la crise kurde actuelle, mais cette initiative a été largement saluée par la plupart des nations internationales, à l'exception des autres États comptant d'importantes populations kurdes et craignant des révoltes sur leurs propres territoires."
 CIA_KUR80.10.desc:0 "Afin de soutenir davantage la lutte des Peshmergas contre le gouvernement baasiste, il a été décidé de déstabiliser le gouvernement irakien. En particulier, d'autres groupes de résistance du sud de l'Irak recevront des armes limitées pour lancer des attaques contre les forces irakiennes. De plus, nos agents dans le pays, en collaboration avec nos collaborateurs locaux, chercheront à éliminer des cibles gouvernementales de premier plan et à lancer des attaques contre des infrastructures importantes à Bagdad. Cependant, ces actions ne suffisent pas : nos agents commerciaux ont cherché à freiner les flux financiers vers l'Irak en renforçant les sanctions contre l'économie et les responsables gouvernementaux irakiens, et en faisant pression sur nos alliés du Golfe pour déstabiliser davantage l'économie irakienne, compte tenu de l'importante dette que l'Irak leur doit. Toutes ces actions devraient contribuer à délégitimer le pouvoir, à affaiblir l'économie irakienne et à éroder la structure du pouvoir de l'État irakien."
 CIA_KUR80.11.desc:0 "L'ambassadeur américain a relayé une offre intéressante. Le président [USA.GetLeader] s'est engagé à établir un Kurdistan indépendant dans la région, afin de servir d'allié régional pour les États-Unis et, potentiellement, pour nous-mêmes. Si ce plan présente des avantages certains, il comporte également des risques. En cas de succès, nous aurons certainement encore plus endommagé nos liens avec le monde arabe. Parallèlement, la puissance de la Syrie serait certainement fortement affaiblie et nous aurions un nouvel allié pour contrer les menaces qui pèsent sur notre nord. De plus, le retrait du gouvernement syrien du conseil d'administration faciliterait nos efforts au Liban et pourrait offrir l'opportunité d'établir d'autres États clients dans la région, ce qui stabiliserait davantage la situation à nos frontières. Cela dit, nous devons également réfléchir à l'impact que cela aurait sur nos relations avec la Turquie, compte tenu de ses propres problèmes avec sa minorité kurde. Comment devrions-nous procéder ?"
 CIA_KUR80.12.desc:0 "Des nouvelles sans surprise, mais bienvenues, sont arrivées. Le gouvernement israélien a accepté notre proposition de collaborer aux efforts visant à renforcer le séparatisme kurde dans toute la région. Israël a également sollicité notre aide supplémentaire au Liban et un éventuel soutien à l'implantation d'États clients chrétiens et druzes dans la région afin de contrebalancer l'hostilité arabe envers l'État israélien. Bien que nous n'ayons pas encore accepté ces conditions dans le détail, elles correspondent globalement à nos propres objectifs stratégiques. Grâce au soutien israélien, notre réseau logistique et de renseignement sera considérablement étendu et nos inquiétudes quant à l'absence d'alliés régionaux dans ce programme sont désormais dissipées. Si la Turquie demeure une source de préoccupation et d'opposition générale, le soutien israélien nous offre une alternative viable pour le trafic d'armes et les activités clandestines, notamment pour les actions menées contre la Syrie."
 CIA_KUR80.13.desc:0 "Étonnamment, le gouvernement israélien a rejeté notre offre de collaboration pour soutenir le mouvement indépendantiste kurde. Il a reconnu les avantages de ce plan, mais a fait valoir qu'une telle action pourrait mettre en péril ses autres opérations en Syrie et au Liban. Par ailleurs, des inquiétudes ont été exprimées quant aux répercussions d'une telle décision sur les États arabes avec lesquels il tente de normaliser ses relations. La question de la Turquie a également été évoquée, notamment quant à la réaction du gouvernement turc à la création d'un État kurde, compte tenu de ses propres problèmes avec sa population kurde. Le gouvernement israélien a reconnu son souhait de renforcer sa coopération dans la région sur d'autres aspects, notamment concernant la situation actuelle au Liban. C'est plutôt décevant, mais nos propres agents sont capables de poursuivre notre objectif stratégique dans la région sans soutien étranger."
 CIA_KUR80.14.desc:0 "L'ambassadeur américain nous a fait le point sur les efforts américains concernant les Kurdes. Ce sujet est depuis longtemps un sujet controversé dans les relations américano-turques, depuis que le président américain a décidé de soutenir les Peshmergas chez nos voisins du sud. Afin d'apaiser nos inquiétudes, les Américains ont accepté de nous fournir davantage de renseignements sur les positions et les membres du Parti des travailleurs du Kurdistan (PKK). Un nouvel objectif du projet américain est de réduire l'influence communiste au sein du mouvement kurde. Dans ce cadre, ils demandent à nos forces de prendre des mesures décisives contre le PKK et de fermer nos frontières avec l'Irak et la Syrie afin d'empêcher les forces du PKK de se mêler davantage aux autres forces kurdes au sud. Accepter cela contribuerait certainement à la répression du PKK. Cependant, en participant à ce projet, nous reconnaîtrions tacitement le projet de création d'un État kurde au sud, sur des territoires autrefois syriens et irakiens. Comment procéder ?"
 CIA_KUR80.15.desc:0 "Malheureusement, nos efforts pour désengager les organisations kurdes syriennes du Parti des travailleurs du Kurdistan (PKK) communiste ont été entravés. Suite au refus turc de collaborer à la lutte contre le PKK, les liens entre ce dernier et nos alliés locaux ont continué de se développer et de se renforcer. Si l'idéologie des organisations kurdes irakiennes et syriennes n'a pas particulièrement évolué, leur influence a généré davantage de méfiance et de colère envers le gouvernement turc, et une partie de l'armement que nous avons fourni se trouve en Turquie. Tout cela a incité la Turquie à durcir sa répression contre la population kurde dans son propre pays, à exacerber les tensions entre les Kurdes et à détériorer les relations avec l'Occident, outré par les récentes violations des droits humains commises par ces derniers."
 CIA_KUR80.16.desc:0 "Heureusement, nos efforts pour dissoudre le Parti des travailleurs du Kurdistan (PKK) ont porté leurs fruits : les nouveaux mouvements kurdes organisés en Syrie évitent toute affiliation directe avec le PKK et adoptent une ligne anticommuniste. L'acceptation par le gouvernement turc de notre proposition et la coordination des efforts visant à affaiblir le PKK en Turquie et à rompre les liens entre les organisations ont constitué une étape cruciale pour réduire leur influence. La collaboration avec la Turquie sur son propre problème kurde a également contribué à apaiser les inquiétudes turques quant aux objectifs stratégiques plus larges du programme et a affaibli le mouvement communiste en Turquie, un allié régional majeur. Il s'agit d'un atout majeur pour notre plan à long terme dans la région et pourrait contribuer à nos futurs projets de soulèvement armé de la population kurde dans les États arabes."
 CIA_KUR80.17.desc:0 "Les troubles dans le nord de l'Irak ont ​​atteint leur paroxysme aujourd'hui, avec l'explosion de violence dans les villes à majorité kurde du Kurdistan irakien. Les rebelles kurdes ont rapidement pris le contrôle de vastes zones des principales villes de Kirkouk et Mossoul. Cette prise de contrôle fait suite à l'instauration par les États-Unis d'une zone d'exclusion aérienne et au lancement d'une campagne de bombardements contre l'armée irakienne en représailles à la campagne Anfal. Il s'agit d'un tournant majeur dans le conflit kurde irakien. Historiquement, la population kurde urbaine était la plus ambivalente et la plus ouverte à la collaboration avec le gouvernement central irakien. Les atrocités commises contre sa population et la fragilité renouvelée du gouvernement central ont conduit à la rupture de cette relation, qui s'est transformée en révolte ouverte. Le recrutement par l'Union patriotique du Kurdistan (UPK), le Parti démocratique du Kurdistan (PDK) et le Parti des travailleurs du Kurdistan (PKK) a explosé ces derniers jours. Avec le potentiel d’un Kurdistan indépendant désormais possible, on peut se demander si les organisations idéologiquement disparates seront capables de construire un consensus commun et un gouvernement stable."
 CIA_KUR80.18.desc:0 "Malheureusement, notre longue histoire d'oppression de la population kurde n'a pas réussi à dissuader un nouveau soulèvement kurde. Plus tôt dans la journée, des rapports en provenance du nord de l'Irak ont ​​fait état d'attaques rapides et de la prise de plusieurs postes de contrôle ruraux. Dans les zones kurdes plus urbaines, des émeutes raciales ont également éclaté à Mossoul. La nouvelle la plus alarmante est peut-être la chute rapide de la ville d'Erbil aux mains des peshmergas et les rumeurs d'avancées vers Kirkouk et Mossoul abondent. Les derniers loyalistes ayant réussi à fuir Erbil assez rapidement ont rapporté que la journée avait commencé normalement jusqu'à ce que les milices du Jash ouvrent le feu sur les forces gouvernementales et que les guérilleros prennent d'assaut les prisons et les commissariats locaux, tandis que les traîtres réprimaient nos forces dans leurs casernes. Ceci, combiné à la pression américaine, pourrait rendre la tenue de la majeure partie du Kurdistan irakien difficile, au mieux, et quasi impossible, au pire, à moyen et long terme."
 CIA_KUR80.19.desc:0 "Pendant des années, les conflits entre notre gouvernement et la population kurde du nord de nos pays ont été rares. Si quelques problèmes locaux ont été soulevés ces dernières années, l'appareil sécuritaire n'a généralement guère manifesté d'inquiétude. Les événements ont éclaté dans les villes du nord, notamment à Qamishli et à Hassaké, où des manifestants kurdes ont déclenché une émeute raciale et attaqué la population arabe locale, prenant d'assaut la police locale et les infrastructures du parti. La situation s'est encore détériorée avec l'arrivée soudaine d'unités de guérilla peshmergas, qui ont rapidement pris le contrôle des deux villes. Plus alarmant encore est l'absence de nouvelles de Kobané, que les services de renseignement attribuent à une perte totale de contrôle de la ville. Des escarmouches ont également été signalées aux abords de Deir ez-Zor. Compte tenu du soutien américain au mouvement kurde et de la situation de notre allié le plus probable, l'Irak, confronté à des problèmes similaires, nous devrons examiner attentivement nos choix stratégiques."
 CIA_KUR80.21.desc:0 "Le soulèvement kurde en cours, tant dans notre pays qu'en Syrie, s'aggrave de jour en jour. Des informations nous parviennent du front selon lesquelles des avions américains, potentiellement en collaboration avec Israël, ont commencé à bombarder nos forces et nos aérodromes proches des lignes de front et entravent activement nos tentatives de transport de troupes pour contribuer à la répression de la rébellion. Des rapports en provenance de la Syrie voisine ont relayé des informations similaires, avec d'importantes frappes américaines sur des aérodromes syriens et visant des installations de défense aérienne dans tout le pays. Hormis une Syrie déjà assiégée, nous avons peu, voire aucun, d'alliés vers lesquels nous tourner. Si l'Iran et la Turquie sont favorables à l'idée de réprimer le séparatisme kurde, aucun d'eux ne lèvera le petit doigt pour soutenir notre gouvernement, compte tenu de leur profond dégoût pour notre propre régime."
 CIA_KUR80.22.desc:0 "Le soulèvement kurde en cours, tant dans notre pays qu'en Irak, s'aggrave de jour en jour. Des informations nous parviennent du front selon lesquelles des avions américains, potentiellement en collaboration avec Israël, auraient également été utilisés pour affaiblir notre emprise sur le pays face à la résurgence des Frères musulmans, qui tentent de prendre le contrôle de vastes territoires autour d'Alep. Nos sources à Bagdad ont également rapporté que des actions similaires avaient été menées contre leurs forces. Malgré nos appels désespérés au soutien, aucune offre d'aide substantielle n'a encore été reçue. Pire encore, nos principaux alliés potentiels contre les Kurdes, notamment la Turquie, refusent de prendre les armes contre les États-Unis, compte tenu de leur statut de membre de l'OTAN. Il serait peut-être temps d'envisager un repli sur nos principaux territoires loyalistes, autour de Damas et de Lattaquié, si la situation se détériore davantage."
 CIA_KUR80.23.desc:0 "Nos efforts pour étendre le conflit kurde à la Syrie ont jusqu'à présent porté leurs fruits. Face à la rébellion, nous devons désormais jouer notre rôle et intervenir activement. Cela dit, nous ne pouvons pas nous engager ouvertement dans le conflit. Plusieurs propositions ont été soumises par nos analystes de la CIA pour nous aider à préparer notre intervention armée ouverte, ainsi que pour trouver des moyens plus secrets d'affaiblir l'État syrien et de rallier la population à cette intervention. Plus particulièrement, si l'opposition kurde devrait pouvoir conserver son territoire sans trop d'aide pour le moment, d'autres moyens doivent être mis en œuvre pour empêcher l'armée syrienne de se concentrer entièrement sur le Kurdistan syrien. Dans ce contexte, il est proposé de rechercher d'autres forces d'opposition en Syrie à soutenir et à armer pour semer le chaos. Bien entendu, nous devrons également veiller à ce que les médias couvrent la lutte kurde avec sympathie et diabolisent le gouvernement syrien afin de renforcer le soutien à une intervention, tant au niveau national qu'international."
 CIA_KUR80.24.desc:0 "Dans le cadre de nos efforts continus pour établir un État kurde au Moyen-Orient afin de nous doter d'un allié crédible au Moyen-Orient, en plus d'Israël, la déstabilisation de la Syrie constitue une étape importante. La principale stratégie proposée par la CIA consiste à armer l'opposition islamiste en Syrie, principalement les Frères musulmans. Le gouvernement syrien a brutalement réprimé un précédent soulèvement des Frères musulmans au cours de la décennie précédente. Cependant, la colère de la population arabe sunnite envers le gouvernement majoritairement alaouite demeure vive et peut être exploitée. À cette fin, le président a autorisé l'envoi d'armes aux Frères musulmans et aux forces apparentées en Syrie afin de déstabiliser davantage le pays et de préparer le terrain pour une intervention armée de notre armée et d'autres partis alliés. Des inquiétudes ont été exprimées quant à la possibilité que cette initiative entraîne une augmentation de la radicalisation religieuse dans la région, mais le Conseil de sécurité nationale a jugé ce risque acceptable pour renverser le gouvernement syrien."
 CIA_KUR80.25.desc:0 "Avant de prendre de nouvelles mesures contre le gouvernement syrien, nous devons mobiliser la communauté internationale, et notamment nos alliés de l'OTAN, contre le régime. Pour commencer, nos agents médiatiques ont reçu pour ordre d'amplifier la couverture médiatique des violences politiques et de la répression brutale contre les Frères musulmans, ainsi que de montrer comment une minorité religieuse marginale, alliée au terrorisme dans la région, opprime la population syrienne et exerce une mainmise sur le gouvernement et l'armée. Compte tenu de la solidité de nos contacts médiatiques, cela ne devrait pas être une tâche difficile. De plus, les conflits entre la Syrie et Israël, ainsi que la participation syrienne à la guerre civile libanaise, devraient servir à diaboliser davantage le régime syrien, le présentant comme un acteur instable semant le trouble et le chaos au Moyen-Orient tout en opprimant sa propre population. Nos représentants aux Nations Unies ont également été chargés d'élaborer et de proposer de nouvelles sanctions contre le gouvernement syrien pour ses violations des droits humains, afin d'attiser encore davantage le tollé."
 CIA_KUR80.26.desc:0 "Alors que le conflit kurde dans le nord de l'Irak explosait, les braises de la rébellion se sont rapidement propagées au Kurdistan syrien. Les troubles initiaux ont été réprimés brutalement par le régime de [SYR.GetLeader], notamment par l'usage d'armes chimiques et d'autres violations brutales des règles de la guerre. Le président américain [USA.GetLeader] a annoncé aujourd'hui l'intervention des États-Unis en Syrie pour renverser le régime barbare de [SYR.GetLeader] et libérer les Kurdes du nord de la Syrie. Cette décision fait suite au récent soutien militaire américain aux Kurdes irakiens et soulève de nouvelles questions quant à l'avènement d'un Kurdistan indépendant. Des interrogations subsistent, notamment face aux inquiétudes suscitées à Ankara et à Téhéran quant à d'éventuels troubles dans leurs propres régions à majorité kurde. Les États arabes ainsi que l'Union soviétique ont condamné cette décision, la qualifiant de manque flagrant de respect des normes internationales, tandis que la plupart des membres de l'OTAN l'ont soutenue, à l'exception notable de la Turquie."
 CIA_KUR80.27.desc:0 "Les forces américaines ont lancé une intervention terrestre majeure dans notre pays, avec le soutien d'Israël et d'autres alliés régionaux des États-Unis. De plus, les Frères musulmans ont lancé des attaques simultanées contre les forces gouvernementales, tandis que les Peshmergas ont intensifié leurs efforts pour consolider leur contrôle sur le nord-est de la Syrie. Nos forces armées doivent rapidement définir de nouvelles lignes défensives et sécuriser nos bases de soutien à Lattaquié et à Damas, où nous pouvons compter sur la population locale pour soutenir le gouvernement et les forces armées. Nous pourrions devoir envisager de céder certaines régions à l'opposition et aux Américains afin de ne pas nous étendre excessivement et de tenter de réduire les risques de bombardements en utilisant les zones urbaines denses comme champ de bataille privilégié. Malheureusement, notre manque d'alliés régionaux revient nous hanter, et des inquiétudes ont été soulevées quant à une éventuelle incursion israélienne sur le plateau du Golan."
 CIA_KUR80.28.desc:0 "Depuis la fin de la Première Guerre mondiale, les accords Sykes-Picot définissent les frontières du Moyen-Orient. Depuis des décennies, les critiques affirment que les lignes tracées pour déterminer les frontières du Moyen-Orient sont arbitraires et préjudiciables aux intérêts des groupes ethniques non arabes de la région. Le groupe le plus lésé est sans doute celui des Kurdes d'Irak et de Syrie. Cependant, suite au succès de la lutte kurde pour l'indépendance en Irak et à l'intervention américaine en Syrie, un Kurdistan nouvellement indépendant a émergé, brisant les frontières établies au lendemain de la Première Guerre mondiale. Cela dit, l'avenir du reste de la Syrie reste sujet à débat, des propositions allant de la préservation de l'intégrité territoriale restante de la Syrie à une balkanisation accrue du pays sur des bases ethniques. L'avenir nous dira comment ces changements se répercuteront dans la région."
 CIA_KUR80.29.desc:0 "Le soulèvement kurde en cours s'aggrave de jour en jour. D'anciennes milices loyalistes ont rejoint les Peshmergas, un conflit ethnique a éclaté en zone urbaine et des troubles généraux se sont propagés à travers le pays. Pire encore, des informations nous parviennent du front selon lesquelles des avions américains, potentiellement en collaboration avec Israël, ont commencé à bombarder nos forces et nos aérodromes proches des lignes de front et répriment activement nos tentatives de transport de troupes pour contribuer à mater la rébellion. Hormis une Syrie déjà assiégée, nous avons peu, voire aucun, d'alliés vers lesquels nous tourner. Si l'Iran et la Turquie sont favorables à l'idée de réprimer le séparatisme kurde, aucun d'eux ne lèvera le petit doigt pour soutenir notre gouvernement, compte tenu de leur profond dégoût pour notre propre régime. Nous devrons peut-être envisager des mesures encore plus drastiques contre la population kurde dans les prochains jours."
 Gladio80.0.desc:0 "Peu après la fin de la Seconde Guerre mondiale, nous avons mis en place un large réseau d'unités et d'organisations de repli organisées dans toute l'Europe continentale. Ce réseau, baptisé « Gladio », est présent dans tous les pays non soviétiques et non communistes d'Europe continentale, ainsi que dans tous les pays membres de l'OTAN, à l'exception de l'Islande, du Canada et de la Grande-Bretagne. La mission principale de ces organisations de repli est de préparer la Troisième Guerre mondiale et de lancer des opérations de résistance contre l'occupant soviétique si les forces soviétiques parviennent à occuper leurs territoires. Malheureusement, nombre de nos principaux agents au sein de ce programme sont liés à l'extrême droite, souvent à d'anciens officiers nazis de la Seconde Guerre mondiale. Cependant, nombre des pays où nous déployons ces cellules ignorent nos activités ou ignorent l'ampleur réelle de l'opération. De plus, Gladio ou des agents liés à Gladio ont joué un rôle majeur dans les coups d'État grecs et turcs, ainsi que dans les violences politiques récentes en Italie.\n\nNous devons maintenant décider s'il faut intensifier le programme actuel ou chercher à isoler les éléments d'extrême droite et révéler nos activités avec nos partenaires en matière de sécurité."
 Gladio80.1.desc:0 "Après d'intenses débats au sein du Conseil national de sécurité (NSC), le président [USA.GetLeader[ a décidé que l'administration devait réévaluer notre conduite dans le cadre de l'opération Gladio. Le NSC a notamment estimé que les agents d'extrême droite et les réseaux locaux constituaient un handicap global pour l'opération et devaient être traités à court terme. D'autres inquiétudes ont également été exprimées quant à la sécurité et à l'intégrité de nos vastes caches d'armes dissimulées à travers l'Europe, notamment à la lumière des informations selon lesquelles des éléments du crime organisé auraient découvert certains stocks et commencé à utiliser les armes qu'ils contenaient. L'élément le plus controversé au sein du NSC et de la communauté du renseignement au sens large est l'accord selon lequel les États membres de l'OTAN devraient être informés, dans une certaine mesure, de l'opération Gladio après la mise en œuvre de nos réformes, afin de rassurer nos alliés et de dissiper les inquiétudes suscitées par divers événements liés au terrorisme et au crime organisé survenus ces dernières années et liés à nos réseaux d'agents du renseignement."
 Gladio80.2.desc:0 "L'une de nos principales préoccupations, soulignée lors du débat au Conseil de sécurité nationale, concerne la récente révélation selon laquelle des éléments du crime organisé ont découvert des caches d'armes et les ont utilisées à des fins illicites. Si le public et les gouvernements locaux ignorent l'origine de ces armes, il n'en demeure pas moins que nos caches d'armes ont été compromises et sont utilisées pour nuire à nos alliés. À cet effet, le directeur de la CIA a demandé à ses agents d'enquêter sur l'état de toutes les caches d'armes notables, hormis celles de l'opération Gladio. Une fois cet audit terminé, le directeur a décidé que l'administration devrait déterminer la marche à suivre concernant les nouveaux protocoles de stockage et l'avenir des caches d'armes en Europe occidentale, notamment dans les zones urbaines où la plupart des découvertes ont eu lieu jusqu'à présent."
 Gladio80.3.desc:0 "Bien que controversés au sein de l'administration, nombre de nos agents secrets en Eurasie sont d'anciens nazis, souvent au passé personnel très difficile. Cependant, ces agents, comme Ruzi Nazar, l'un des principaux chefs de la Légion du Turkestan qui a combattu pour l'Allemagne pendant la Seconde Guerre mondiale, se sont révélés précieux pour organiser des cellules, recueillir des renseignements et recruter. Malheureusement, d'autres éléments d'extrême droite, notamment en Italie et en France, ont été impliqués dans de nombreux attentats terroristes non autorisés contre leurs opposants politiques nationaux. Cependant, cette décision a été une erreur dès le départ, trahit nos valeurs nationales et a conduit à divers incidents chez nos alliés. Le Conseil de sécurité nationale a décidé de lancer prochainement une purge complète des agents d'extrême droite, en particulier ceux ayant des liens avec les néonazis. Avant que cette purge ne soit pleinement lancée, nos services de renseignement devront s'assurer que tous les détails soient réglés et que l'opération dans son ensemble ou les incidents passés qui y sont liés soient rendus publics."
 Gladio80.4.desc:0 "Conformément à notre nouvelle politique concernant l'opération Gladio, les ministres dignes de confiance des États membres de l'OTAN où opèrent des réseaux Stay-Behind ont été informés de ces réseaux et des mesures que nous avons prises récemment pour renforcer la sécurité et la crédibilité de l'opération. Globalement, l'accueil a été mitigé : appréciation de la divulgation des opérations, mais inquiétude quant à la durée de l'anonymat de ces réseaux. Malheureusement, cette décision a ouvert de nouvelles possibilités de fuites d'informations sur notre opération et pourrait la rendre plus vulnérable à la subversion soviétique. Cependant, les avantages de cette initiative l'emporteront probablement sur les inconvénients, car nous pouvons désormais renforcer activement nos liens de renseignement avec nos alliés et améliorer nos plans d'établissement de gouvernements en exil et d'opérations de repli dans leurs pays respectifs."
 Gladio80.5.desc:0 "Après un examen approfondi, le Conseil national de sécurité a décidé de maintenir le cap sur l'opération Gladio. Si certains aspects de l'opération feront l'objet d'un examen plus approfondi, notamment en ce qui concerne le recrutement et la cible du programme, ainsi qu'un éventuel renforcement de la collaboration avec d'autres États membres de l'OTAN, la mission globale de Gladio est trop impérative pour être mise en péril par des réformes drastiques. Bien que des incidents aient été signalés où des agents liés à Gladio ont utilisé nos ressources sans notre consentement pour commettre des actes terroristes et que certaines caches aient été découvertes et saisies par des éléments du crime organisé, le programme global est globalement solide et a déjà démontré son utilité pour prévenir la propagation du communisme en Grèce et en Turquie ces dernières années. Cela dit, nous devons veiller à ce que le public reste dans l'ignorance de ce programme pour le moment, et idéalement pour une durée indéterminée, compte tenu des liens de Gladio avec des éléments peu recommandables, notamment ceux entre nos services de renseignement et des nazis impénitents."
 Gladio80.6.desc:0 "Pendant trop longtemps, notre réseau opérationnel a été, dans une certaine mesure, déconnecté des services de renseignement des pays ciblés. À cet effet, les agents de la CIA seront utilisés pour renforcer les relations avec les services de renseignement de divers pays et entreprendre de nouveaux recrutements pour l'opération Gladio. Au-delà des avantages d'une meilleure préparation à une nouvelle guerre mondiale, cela nous permettrait également d'exercer une influence plus forte sur les gouvernements de nos alliés et de garantir qu'ils ne basculent pas dans le communisme. Depuis des décennies, nous entretenons des liens étroits avec les services de renseignement de certains pays, notamment la Grèce et la Turquie, où nous avons encouragé les interventions lorsque ces pays semblaient au bord du chaos ou sur le point de basculer dans le communisme. Globalement, étendre cette capacité à d'autres pays européens est d'une importance capitale et devrait constituer un objectif stratégique pour les années à venir."
 Gladio80.7.desc:0 "Après de longues discussions au sein de l'OTAN, les États membres ont convenu d'accroître leurs capacités de partage de renseignements et de mieux coordonner leurs opérations. Il s'agit d'une victoire incontestable pour la stratégie de renseignement du président [USA.GetLeader], ainsi que pour le renforcement de l'unité de l'OTAN. Cela dit, certains États membres ont exprimé des inquiétudes quant au traitement réservé à leur souveraineté nationale, compte tenu des événements récents et des opérations ayant renversé certains gouvernements au cours des années précédentes. Notre administration a apaisé ces inquiétudes en soulignant notre implication limitée et le danger évident que ces pays sombrent dans le communisme ou subissent des conflits civils désastreux, ces opérations étant une solution de dernier recours. Cette initiative devrait également nous permettre d'ancrer davantage nos agents et réseaux de repli dans les réseaux de renseignement de nos alliés et de nos pays, tout en élargissant notre vivier de recrues potentielles."
 Gladio80.8.desc:0 "Malheureusement, après avoir proposé d'accroître le partage du renseignement et la collaboration entre les membres de l'OTAN, l'organisation a voté contre. Des pays ont exprimé des inquiétudes concernant les problèmes de confidentialité et signalé une recrudescence du terrorisme d'extrême droite et la découverte par le crime organisé de caches d'armes « inconnues » dans la région. Bien que regrettable, cette décision ne dissuadera en rien nos opérations de poursuivre l'expansion et le développement de notre réseau de cellules de repli en Europe continentale. L'objectif secondaire de Gladio étant d'empêcher une prise de pouvoir communiste sur les pays d'Europe occidentale, nous devrions peut-être envisager d'examiner plus en détail les gouvernements qui ont voté contre la proposition. Cela dit, cette décision suscitera une certaine opposition chez nos alliés, notamment ceux qui ont voté contre pour des raisons de souveraineté nationale, et constitue une source d'embarras mineure sur le plan national."
 Gladio80.9.desc:0 "Bien que controversés au sein de l'administration, nombre de nos agents secrets en Eurasie sont d'anciens nazis, souvent au passé personnel très difficile. Cependant, ces agents, comme Ruzi Nazar, l'un des principaux dirigeants de la Légion du Turkestan qui a combattu pour l'Allemagne pendant la Seconde Guerre mondiale, se sont révélés précieux pour organiser des cellules, recueillir des renseignements et recruter. Malheureusement, d'autres éléments d'extrême droite, notamment en Italie et en France, ont été impliqués dans de nombreux attentats terroristes non autorisés contre leurs opposants politiques nationaux. Cela remet en question notre recours à l'extrême droite militante comme principal recrutement pour Gladio. À cette fin, le Conseil de sécurité nationale a approuvé un plan visant à étendre le recrutement dans les milieux d'extrême droite à travers l'Europe afin d'utiliser leurs compétences et leurs relations uniques pour optimiser nos préparatifs au pire."
 Gladio80.10.desc:0 "Bien que controversés au sein de l'administration, nombre de nos agents secrets en Eurasie sont d'anciens nazis, souvent au passé personnel très difficile. Cependant, ces agents, comme Ruzi Nazar, l'un des principaux dirigeants de la Légion du Turkestan qui a combattu pour l'Allemagne pendant la Seconde Guerre mondiale, se sont révélés précieux pour organiser des cellules, recueillir des renseignements et recruter. Malheureusement, d'autres éléments d'extrême droite, notamment en Italie et en France, ont été impliqués dans de nombreux attentats terroristes non autorisés contre leurs opposants politiques nationaux. Cela remet en question notre recours à l'extrême droite militante pour le recrutement principal de Gladio. À cette fin, le Conseil de sécurité nationale a décidé de revoir nos réseaux opérationnels actuels et de garantir un contrôle rigoureux des futurs membres des cellules, et notamment de leurs dirigeants. Cependant, en écartant les éléments d'extrême droite, nous devrons veiller à ce qu'ils ne divulguent pas d'informations aux médias en guise de représailles."
 CIA_Karabach.0.desc:0 "Depuis des millénaires, la région du Karabagh est le théâtre de conflits entre les Arméniens et divers peuples turcs musulmans. L'Union soviétique a tenté de résoudre le problème par des transferts de population et d'autres mesures. Cependant, avec l'effondrement de l'Union soviétique, les tensions dans la région ont explosé. L'Arménie et l'Azerbaïdjan sont désormais en guerre pour la région contestée, la population arménienne du Karabagh déclarant son propre État indépendant, qui est en réalité un substitut d'Erevan.\n\nCela dit, notre influence actuelle dans le Caucase est minime et le conflit offre à notre gouvernement l'occasion d'y exercer une influence. Cependant, pour ce faire, nous devrions soutenir l'Azerbaïdjan ou l'Arménie et saper l'influence russe dans le pays que nous choisirions. De plus, choisir l'un ou l'autre pourrait entraîner des répercussions géopolitiques ou nationales. Soutenir l'Arménie provoquerait certainement la colère de la Turquie, tandis que soutenir l'Azerbaïdjan susciterait les protestations de la diaspora arménienne aux États-Unis."
 CIA_Karabach.1.desc:0 "Après plusieurs jours de discussions, le Conseil national de sécurité a décidé de contacter le gouvernement arménien au sujet de la guerre du Karabakh. Notre ambassadeur en Arménie rencontrera secrètement le ministre arménien des Affaires étrangères afin de lui proposer une aide et des conseillers. Cette offre devra être présentée avec le moins de risques de fuite possible, compte tenu de la nature géopolitique délicate du conflit, notamment au regard du soutien de la Turquie à l'Azerbaïdjan et de son déni persistant du génocide arménien. Si nos experts en politique étrangère estiment que l'Arménie acceptera cette offre, il convient de noter que les éléments pro-russes au sein du gouvernement et de la population russes pourraient inciter Erevan à la rejeter par crainte de s'aliéner ses alliés russes."
 CIA_Karabach.2.desc:0 "Une proposition intéressante nous est parvenue de Washington : les États-Unis proposent de nous envoyer une aide militaire et des conseillers pour soutenir notre conflit en cours avec l’Azerbaïdjan. Bien qu’aucune condition ne soit directement liée à cet accord, il s’agit clairement d’un jeu de pouvoir contre l’influence russe dans notre pays et il convient d’y réfléchir attentivement avant de l’accepter. Accepter cet accord risquerait de nous aliéner le gouvernement russe et de susciter l’opposition des oligarques pro-russes et d’un bloc électoral plus pro-russe. Cependant, l’accepter entraînerait probablement un renforcement des liens avec les puissances occidentales, une aide militaire majeure et l’opportunité d’une modernisation indispensable de notre armée, ainsi que de contribuer à légitimer notre intention de conquérir le Karabakh. Comment procéder ?"
 CIA_Karabach.3.desc:0 "Le gouvernement arménien a répondu aujourd'hui à notre offre et a accepté notre offre d'aide matérielle et d'envoi de conseillers. C'est une excellente nouvelle pour la poursuite de nos projets visant à renforcer notre influence dans le Caucase. Des convois d'aide et des conseillers seront redéployés depuis les bases de l'OTAN en Europe occidentale vers l'Arménie dans les prochains jours, afin de soutenir son conflit avec l'Azerbaïdjan. Malheureusement, la nouvelle de cette acceptation s'est répandue plus tôt que prévu, ce qui a conduit la Turquie à condamner l'accord et à s'engager à soutenir davantage les Azéris. Heureusement, la réaction nationale a été largement positive et notre administration a bénéficié d'un soutien accru dans les États comptant une importante diaspora arménienne, notamment en Californie."
 CIA_Karabach.4.desc:0 "Dans un geste étrange, le gouvernement arménien a décliné notre initiative de lui fournir une assistance militaire et technique. Les Arméniens ont indiqué qu'ils resteraient fidèles à leurs alliés russes et se croient déjà en mesure de vaincre activement leurs adversaires azerbaïdjanais. C'est une situation décevante, mais ce n'est pas une catastrophe en soi. Cependant, si cette offre était divulguée à la Turquie, cela pourrait rapidement dégénérer en une véritable tempête politique. Pour l'instant, l'influence américaine restera probablement minime dans la région du Caucase, mais nous pouvons toujours nous tourner vers l'avenir et d'autres conflits régionaux pour exercer ou renforcer notre influence dans la région, notamment en Géorgie ou par l'intermédiaire de nos alliés turcs."
 CIA_Karabach.5.desc:0 "Alors que nous continuons à accroître notre influence dans le Caucase, nous devons désormais nous attaquer au problème des oligarques pro-russes. La CIA, en collaboration avec les forces de l'ordre internationales, a mené secrètement plusieurs raids contre des éléments pro-russes en Arménie. Plusieurs oligarques pro-russes ont été arrêtés pour diverses accusations, et plusieurs agents russes de moindre envergure ont été liquidés ou capturés. Alors que le sentiment pro-américain continue de croître en Arménie grâce à notre soutien dans leur guerre en cours, le soutien aux partis politiques pro-russes continuera de diminuer et nous disposerons enfin d'une base d'opérations dans la région. Cela dit, nous devrons nous efforcer de trouver une solution diplomatique entre Ankara et Erevan."
 CIA_Karabach.6.desc:0 "Alors que le soutien américain continuait de faire tourner la guerre en notre faveur, le soutien de notre population à l'Amérique s'est rapidement accru. Cela a permis à notre gouvernement de prendre des mesures contre divers agents russes présents dans le pays et, en collaboration avec Washington, d'arrêter ou de compromettre plusieurs oligarques prorusses de premier plan. Cela a considérablement réduit l'influence russe dans notre pays et a conduit à un renforcement des liens entre Washington et Erevan. Si la Turquie demeure un obstacle, d'autres pays européens, notamment la France, ont exprimé leur soutien ferme et ont également contribué à notre effort de guerre depuis la révélation de l'aide américaine. Par conséquent, nos relations avec la Russie atteignent un point bas, et la Russie a depuis lors opté pour un soutien à l'Azerbaïdjan."
 CIA_Karabach.7.desc:0 "Alors que nous poursuivons nos projets visant à renforcer notre influence en Arménie, un moyen majeur d'accroître notre soutien serait de renforcer secrètement l'effort de guerre arménien contre l'Azerbaïdjan. Un moyen d'y parvenir serait de fournir des renseignements sur la position et la puissance des unités militaires azéries dans la région du Karabakh et ses environs immédiats. Cela permettrait à l'Arménie de mieux exploiter ses capacités militaires limitées tout en continuant à endetter le gouvernement et l'appareil militaire arméniens envers notre gouvernement. Après la fin de la réunion actuelle du Conseil de sécurité nationale, nos avions de reconnaissance intensifieront leurs relevés du Caucase afin de commencer à recueillir les informations nécessaires à l'armée arménienne. Cela étant dit, nous devrons veiller à ce que nos actions ne déstabilisent pas excessivement la région ni ne dégénèrent en une guerre régionale plus vaste, et à éviter une nouvelle détérioration des relations avec la Turquie."
 CIA_Karabach.8.desc:0 "Excellente nouvelle : les Américains ont commencé à nous fournir des renseignements en temps réel sur les positions militaires azéries dans toute la zone de conflit. Ceci s'inscrit dans le cadre de notre accord de rapprochement avec Washington après avoir accepté une aide militaire. Nos liens avec la Russie se sont depuis considérablement détériorés. Cette initiative témoigne de l'engagement de Washington envers notre cause et s'avérera utile dans nos opérations visant à sécuriser les terres arméniennes qui nous reviennent de droit. Les politiciens pro-russes et leurs partisans sont également de plus en plus inquiets de nos nouveaux liens avec les États-Unis, qui pourraient s'avérer problématiques dans un avenir proche et qui méritent, à tout le moins, d'être surveillés de près dans le cadre de la poursuite de l'effort de guerre."
 CIA_Karabach.10.desc:0 "Après plusieurs jours de discussions, le Conseil de sécurité nationale a décidé de contacter le gouvernement azerbaïdjanais au sujet de la guerre du Karabagh. Les facteurs déterminants dans le choix de l'Azerbaïdjan sont ses vastes réserves pétrolières et le soutien indéfectible de la Turquie à la cause azerbaïdjanaise. Cette voie risque d'aliéner la diaspora arménienne et de provoquer des tensions avec certains partenaires européens, mais elle sera bénéfique pour notre économie, renforcera nos liens avec la Turquie et contrecarrera l'influence iranienne et russe dans la région. Dans les prochains jours, notre ambassadeur en Azerbaïdjan recevra des instructions sur la manière de renforcer nos relations avec Bakou et d'éviter une nouvelle escalade avec la Russie, le pays ayant historiquement appartenu à sa sphère d'influence."
 CIA_Karabach.11.desc:0 "Une proposition récente, présentée lors d'une réunion du Conseil de sécurité nationale, consiste à vendre des armes à prix réduit à l'Azerbaïdjan. Notre ambassadeur à Bakou a été chargé de rencontrer le dirigeant azerbaïdjanais [AZR.GetLeader] afin de discuter des conditions de vente potentielles et d'autres moyens de soutenir l'État azerbaïdjanais. Cela dit, nous devrions veiller à minimiser la publicité de cet événement par crainte d'une réaction négative, tant au niveau national qu'international, en particulier de la diaspora arménienne. L'influence occidentale sur l'Azerbaïdjan nous fournirait non seulement une base d'opérations dans une région historiquement hostile, mais ouvrirait également la production pétrolière azerbaïdjanaise aux marchés occidentaux. De plus, la Turquie a manifesté en privé son ferme soutien à cette initiative et a indiqué qu'elle pourrait également commencer à fournir une aide supplémentaire."
 CIA_Karabach.12.desc:0 "Comme prévu, le gouvernement azerbaïdjanais a accepté notre offre de vente d'armes à prix réduit. Dans les semaines à venir, des livraisons d'armes lourdes commenceront à arriver à Bakou en provenance de nos centres d'approvisionnement d'Europe occidentale. Ces livraisons devraient permettre à l'armée azerbaïdjanaise de se réformer rapidement et de reconquérir le territoire perdu. Bien que nous devions faire connaître cette initiative dans une certaine mesure, car l'armement lourd rendra notre implication évidente, nous pouvons nous attendre à ce que l'opinion publique n'accorde pas beaucoup d'importance au conflit. Cependant, la diaspora arménienne, principalement en Californie, votera certainement massivement pour notre adversaire aux prochaines élections."
 CIA_Karabach.13.desc:0 "Par un étrange retournement de situation, le gouvernement azerbaïdjanais a rejeté notre offre d'achat d'armes à bas prix. Bakou a souligné que, bien qu'appréciée, cette offre était inutile et que le gouvernement ne souhaitait pas s'endetter davantage, ni financièrement ni politiquement, auprès de puissances étrangères. Pire encore, des personnalités pro-russes au sein du gouvernement azerbaïdjanais ont divulgué le projet d'accord à la presse internationale, ce qui a mis notre gouvernement dans l'embarras et aggravé nos relations avec l'Arménie. Nos sondages en Californie en pâtiront certainement aussi. Heureusement, en dehors de la diaspora arménienne, l'opinion publique reste largement ambivalente face au conflit."
 CIA_Karabach.14.desc:0 "L'un des aspects de la guerre en cours entre l'Azerbaïdjan et l'Arménie est le conflit ethnique et religieux qui perdure dans la région. Forts de notre succès dans la mobilisation de recrues en Afghanistan et dans d'autres régions islamiques, le Conseil de sécurité nationale (NSC) a autorisé la mise en place d'un programme de recrutement de volontaires étrangers originaires d'autres régions islamiques et turques pour combattre aux côtés de l'Azerbaïdjan, afin de renforcer ses effectifs dans sa campagne en cours. Compte tenu de nos liens historiques étroits avec les groupes pan-touranistes en Turquie et ailleurs, les dirigeants et agents locaux de la CIA estiment que des recrues pourront être rapidement trouvées et transportées en Azerbaïdjan dans les jours et semaines à venir. Certains opposants craignent toutefois que cette mesure ne renforce et n'étende l'influence des organisations terroristes islamistes et touranistes radicales, et ne conduise à des complications imprévues à l'avenir."
 CIA_Karabach.15.desc:0 "Bonne nouvelle : les États-Unis ont commencé à utiliser leurs réseaux parmi les combattants islamistes, ainsi que leurs relations en Turquie, pour mobiliser des volontaires étrangers prêts à combattre en notre nom et à venir en Azerbaïdjan. Alors que nous luttons pour reconquérir nos terres souveraines, c'est une avancée bienvenue. Cela dit, compte tenu de notre orientation plus laïque, nous devrons veiller à ce que les nouvelles recrues ne continuent pas à poser problème après la fin de la guerre. De plus, nos forces de sécurité craignent que des agents iraniens n'infiltrent notre armée et ne tentent de saper notre gouvernement afin de propager la révolution iranienne, notamment compte tenu des revendications irrédentistes iraniennes sur notre territoire."
 CIA_Karabach.17.desc:0 "Alors que nous poursuivons nos efforts pour renforcer les forces azerbaïdjanaises dans la guerre du Karabagh, nous avons intensifié notre campagne visant à affaiblir l'influence russe en Azerbaïdjan. Au moment où ce mémo est rédigé, les services de sécurité azerbaïdjanais placent en détention plusieurs oligarques et hommes politiques pro-russes pour divers chefs d'accusation, sur la base d'informations que nous avons fournies à Bakou. Cette mesure paralyserait de facto le bloc pro-russe au sein de l'économie et du gouvernement azerbaïdjanais et nous permettrait enfin de nous implanter durablement dans le Caucase. Bien que diverses fuites médiatiques aient laissé entendre que notre gouvernement soutenait l'Azerbaïdjan dans le conflit en cours, les conséquences politiques intérieures ont été minimes et principalement localisées dans des zones de la diaspora arménienne, principalement en Californie."
 CIA_Karabach.18.desc:0 "Suivre l'évolution politique à Bakou est une tâche essentielle pour nos services de renseignement, compte tenu de la guerre en cours avec l'Azerbaïdjan. Nous avons récemment reçu des informations faisant état de l'arrestation de plusieurs hommes d'affaires et hommes politiques pro-russes, inculpés de multiples chefs d'accusation. De toute évidence, une vaste campagne contre l'influence russe en Azerbaïdjan semble être en cours. Cela témoigne sans aucun doute d'une nouvelle agression azerbaïdjanaise contre notre État et réaffirme notre nécessité de renforcer nos liens avec la Russie afin de protéger notre intégrité territoriale. Bien qu'il n'existe aucune preuve solide, des indices circonstanciels indiquent que les États-Unis ont commencé à soutenir activement l'Azerbaïdjan, ce qui pourrait être le signe de changements majeurs à venir dans la région."
 CIA_Karabach.16.desc:0 "Dès le début du conflit qui oppose l'Arménie et l'Azerbaïdjan dans le Caucase, l'administration de {USA.GetLeader] a adopté une position pro-azérie affirmée. De nouvelles informations ont mis en lumière un projet de la CIA visant à recruter et à déployer des volontaires étrangers en Azerbaïdjan pour combattre les forces arméniennes dans la région contestée du Karabakh. Les volontaires sont recrutés aussi bien parmi les militants islamistes que parmi les nationalistes turcs, notamment les controversés Loups Gris de Turquie. L'Arménie et la Russie ont condamné cette initiative, la qualifiant d'attaque contre le christianisme et de trahison des prétendues « valeurs occidentales ». Les critiques nationales du président ont formulé des critiques similaires et souligné le caractère autocratique du dirigeant azerbaïdjanais [AZR.GetLeader]. Cependant, le président a souligné que l'Arménie est l'agresseur dans le conflit et que l'Azerbaïdjan cherche simplement à préserver son intégrité territoriale."
 CIA_GEO.0.desc:0 "Lors des élections de 1990, la population géorgienne a clairement voté pour le célèbre dissident antisoviétique Zviad Gamsakhourdia, qui a remporté une victoire écrasante. Malheureusement, les troubles se sont rapidement propagés dans tout le pays, notamment au sein de l'ancienne nomenklatura soviétique et des régions peuplées de minorités ethniques. La situation s'étant dégradée, des chefs de guerre prorusses ont lancé un coup d'État, prenant le contrôle de Tbilissi, la capitale, poussant Gamsakhourdia et ses forces à se réinstaller dans l'ouest du pays. Parallèlement, des séparatistes soutenus par la Russie se sont également soulevés et la région d'Adjarie a déclaré sa neutralité armée dans le conflit en cours. La situation est encore compliquée par le soutien apporté par la région russe séparatiste de Tchétchénie aux forces de Gamsakhourdia. Au vu du conflit, Gamsakhourdia serait le plus vulnérable à notre influence. Une proposition actuellement examinée par le Conseil de sécurité nationale prévoit un soutien potentiel aux forces de Gamsakhourdia, visant à l'aider à restaurer son autorité sur le pays. Comment devrions-nous procéder ?"
 CIA_GEO.1.desc:0 "Après un long débat au Conseil de sécurité nationale, le président a opté pour la neutralité dans le conflit en cours en Géorgie. Si l'établissement d'un gouvernement résolument pro-occidental en Géorgie serait idéal, les risques d'une telle initiative ont été jugés trop importants. L'accent a notamment été mis sur l'instabilité générale en Géorgie, compte tenu des différentes factions qui s'affrontent et de l'ingérence russe dans le conflit, qui pourrait déboucher sur un conflit ouvert entre Washington et Moscou et ruinerait sans aucun doute toute tentative d'établir des relations cordiales entre les États-Unis et la Russie. Néanmoins, certains membres du Conseil de sécurité nationale ont critiqué cette décision, la jugeant comme une trahison des forces progressistes du Caucase et une occasion manquée d'affaiblir l'influence russe dans la région."
 CIA_GEO.2.desc:0 "Le président Gamsakhourdia, président légitime de la Géorgie, est un militant reconnu des droits de l'homme, dissident soviétique et professeur d'anglais. Il est actuellement impliqué dans un conflit avec des séparatistes pro-russes, soutenus par la Russie et des éléments déloyaux au sein de l'armée géorgienne. Si certains estiment que sa cause est vouée à l'échec, nos agents de renseignement dans la région ont récemment plaidé avec force en faveur d'une intervention américaine dans le conflit afin de soutenir les forces loyales au président Gamsakhourdia. Plus tôt dans la journée, le président a signé cette proposition et l'aide américaine sera rapidement acheminée, ainsi qu'une augmentation notable du nombre d'agents de renseignement déployés dans la région et le déploiement de conseillers militaires en Géorgie. Bien qu'aucune annonce officielle de notre soutien n'ait encore été faite, des éléments politiques plus conciliants du pays ont condamné tout soutien potentiel à Gamsakhourdia, le qualifiant d'escalade excessive envers Moscou."
 CIA_GEO.3.desc:0 "Par un retournement de situation inattendu, de bonnes nouvelles sont arrivées de Washington. Les États-Unis ont décidé de soutenir pleinement nos forces loyalistes dans notre quête de restauration de la démocratie et de l'intégrité territoriale de notre pays. Des livraisons d'armes indispensables arriveront dans les prochaines semaines et le déploiement de conseillers militaires américains est également en cours. Compte tenu du soutien russe à nos ennemis, cela pourrait inverser la récente série de pertes et de revers et nous préparer à une contre-offensive contre les marionnettes russes. Depuis que l'annonce a été rendue publique, Moscou et ses flagorneurs locaux ont dénoncé cette initiative comme une escalade et ont affirmé que nous ne sommes plus qu'une marionnette américaine. Néanmoins, nous devons continuer à tisser des liens avec les forces tchétchènes au nord de notre pays, dans le cadre de notre cause commune contre la présence russe dans le Caucase."
 CIA_GEO.4.desc:0 "Aslan Abashidze est le dirigeant de la République autonome d'Adjarie, une région stratégiquement cruciale de Géorgie, située à la frontière turque, au sud-ouest du pays. Le traité de Kars, signé en 1921 par la Turquie et l'Union soviétique, garantissait les droits de la population musulmane en Adjarie ; les gouvernements des États successeurs de l'Union soviétique ont également ratifié cet accord, ce qui a permis le maintien d'une partie fortement autonome de la Géorgie. Jusqu'à présent, Abashidze est resté résolument neutre dans le conflit en cours. Son implication au nom de l'une ou l'autre des parties pourrait être cruciale pour faire pencher la balance de la guerre civile en faveur d'un camp ou de l'autre. Nos agents de renseignement dans la région ont élaboré deux propositions pour remédier à la situation. Le premier plan d'action présenté consiste à offrir à Abashidze un pot-de-vin important pour qu'il s'implique dans le conflit ; le second plan consiste à organiser un assassinat contre lui et à imputer la responsabilité à des éléments pro-russes en Adjarie. Comment procéder ?"
 CIA_GEO.7.desc:0 "Une offre intéressante est arrivée plus tôt dans la journée. Sans révéler ouvertement ses liens, l'agent était clairement affilié à la CIA. L'offre de l'agent stipulait que les États-Unis verseraient personnellement une importante somme d'argent à notre dirigeant, ainsi qu'une aide au développement de l'Adjarie, en échange de leur engagement dans la guerre civile en cours au nom des loyalistes de Gamsakhourdia. Jusqu'à présent, notre région est restée résolument neutre dans cette guerre civile, mais cette offre serait très avantageuse pour nos dirigeants et notre région. D'autre part, l'opposition à Gamsakhourdia est soutenue par la Russie et une entrée en guerre civile susciterait certainement leur colère. Dans ce contexte, comment devrions-nous procéder ?"
 CIA_GEO.8.desc:0 "Excellente nouvelle : Aslan Abashidze a accepté le pot-de-vin proposé et a annoncé son soutien à Gamsakhourdia. Bien que les Russes et l'opposition pro-russe aient condamné cette décision, la qualifiant de cas flagrant de corruption, elle donne un élan significatif aux forces loyalistes de Gamsakhourdia et pourrait contribuer à renforcer leurs effectifs à temps pour une future contre-offensive visant à chasser les rebelles et les séparatistes pro-russes qui sévissent dans le pays. Cependant, des inquiétudes ont été soulevées quant aux violences ethniques et religieuses potentielles qui pourraient survenir dans la région si les forces pro-russes parvenaient à y pénétrer. Nous devrions donc prévoir des mesures pour parer au pire afin d'éviter une situation embarrassante pour l'administration."
 CIA_GEO.9.desc:0 "Malheureusement, Aslan Abashidze a rejeté notre proposition. Bien que cette offre soit restée confidentielle, Abashidze a rétorqué qu'une entrée en conflit serait trop risquée pour lui-même et pour l'Adjarie dans son ensemble. Il a souligné le risque de violences ethniques et religieuses contre son peuple si Gamsakhourdia ne parvenait pas à consolider son contrôle sur la Géorgie et que l'autonomie accordée à la région pourrait être résiliée, ce qui pourrait conduire à une nouvelle escalade de la part de la Turquie, qui aurait rompu le traité de Kars. Bien que regrettable, cette réaction n'est pas inattendue. Rappeler Abashidze à la raison était toujours une mince affaire et, au moins, la région restera neutre, à tous égards, dans un avenir proche. Nous devrons chercher d'autres moyens de renforcer les forces loyalistes à Gamsakhourdia afin d'empêcher la Russie de reprendre le contrôle total du Caucase."
 CIA_GEO.10.desc:0 "Bonne nouvelle : la République autonome d'Adjarie a mis fin à sa politique de neutralité dans notre guerre civile en cours et a annoncé son soutien à notre cause. Bien que ce ne soit pas la région la plus vaste ni la plus peuplée, ce changement de soutien nous confère une légitimité significative et nous permettra de continuer à disposer d'effectifs suffisants. Plus important encore, cette décision nous offrira un accès incontesté à la Turquie, ce qui nous permettra d'obtenir une aide supplémentaire de l'Occident. Le combat continue cependant et nous devrons désormais veiller à ce que les forces d'opposition ne tentent pas de prendre le contrôle de l'Adjarie et ne soient pas obligées de faire des concessions à Abashidze dans la Géorgie d'après-guerre."
 CIA_GEO.12.desc:0 "Depuis la chute de l'Union soviétique, des troubles notables ont sévi dans les républiques ethniques de Russie. Dans ce contexte, le Conseil de sécurité nationale a approuvé un plan d'action proposé par la CIA visant à financer les mouvements antirusses en Kalmoukie. La Kalmoukie est unique en ce sens que, contrairement au reste de la Russie, elle est majoritairement bouddhiste et mongole, la population descendant des Mongols Oïrats, arrivés dans la région il y a des siècles. Étant donné sa situation géographique proche du Caucase et le long de la mer Caspienne, nos agents devraient pouvoir facilement s'y infiltrer et contacter les mouvements locaux afin de trouver des organisations à soutenir ou, dans le pire des cas, des locaux antirusses avec lesquels créer des organisations. Nos agents contacteront également la petite diaspora afin de rechercher des figures de proue potentielles pour un mouvement indépendantiste régional."
 CIA_GEO.13.desc:0 "Afin d'affaiblir davantage l'influence russe dans la région et de détourner davantage de ses forces armées, nous avons décidé d'accroître notre soutien aux mouvements islamistes tchétchènes et daghestanais en Russie. Compte tenu du conflit en cours dans ces régions, toute nouvelle aide meurtrière aux rebelles porterait clairement préjudice à la Russie et nécessiterait probablement une présence militaire russe renforcée s'ils souhaitent empêcher le Daghestan de suivre pleinement l'exemple de la Tchétchénie voisine. Cela dit, cette décision a suscité son lot de détracteurs. Nos contacts parmi les États arabes rechercheront également des soutiens potentiels pour les mouvements islamistes de ces régions afin de solliciter une aide financière et armée supplémentaire. Des critiques au sein de l'administration ont affirmé que cette mesure constituait une escalade excessive et qu'en soutenant ces mouvements, nous armions de fait des terroristes qui pourraient se retourner contre nous à l'avenir. Cependant, pour l'instant, les islamistes du Daghestan et de Tchétchénie sont nos alliés de circonstance, des combattants de la liberté contre la tyrannie russe."
 CIA_GEO.14.desc:0 "Malgré tous nos efforts, la guerre civile géorgienne s'est enlisée et la Géorgie a été divisée en plusieurs parties. L'Ossétie du Sud et l'Abkhazie ont proclamé leur indépendance, les forces loyales à Zviad Gamsakhourdia contrôlent une part importante du territoire, une autre partie de la Géorgie est aux mains de l'opposition pro-russe, et l'Adjarie, autrefois neutre, a également proclamé son indépendance, les deux camps étant incapables de mettre un terme définitif à la guerre civile. Bien que regrettable, cette situation reste plus avantageuse pour nous qu'une victoire catégorique de l'opposition pro-russe. Le chaos qui règne dans la région a affaibli les opérations russes en Tchétchénie et a contribué à la détérioration de la situation russe au Daghestan. L'évolution de cette situation dans les années à venir est incertaine."
 CIA_GEO.15.desc:0 "À la surprise de la communauté internationale, les forces loyalistes de Zviad Gamsakhourdia ont triomphé de la guerre civile en cours, parvenant même à vaincre les forces sécessionnistes en Ossétie du Sud et en Abkhazie. Il s'agit d'une victoire majeure pour notre administration et d'une défaite catastrophique pour la Russie, notamment dans le contexte de l'instabilité croissante au Daghestan et en Kalmoukie, et de l'incapacité persistante des forces russes à reprendre la Tchétchénie. Alors que la Russie continue de condamner nos actions en Géorgie et d'accuser nos actions de soutenir les sécessionnistes qui sévissent actuellement en Russie dans le Caucase, il semble que la Russie ne puisse guère riposter pour le moment, et un soutien supplémentaire à ces causes contribuera certainement à paralyser sa capacité à mener la guerre et à étendre son influence. Des débats devront prochainement avoir lieu sur le rôle que nous jouerons dans la reconstruction de la Géorgie et l'éventuelle expansion de l'OTAN dans le Caucase."
 CIA_GEO.16.desc:0 "Avec la victoire des forces alliées à Gamsakhourdia lors de la guerre civile géorgienne, nous disposons désormais d'une nation potentiellement fiable pour baser nos opérations dans le Caucase. Le débat au Conseil de sécurité nationale porte désormais sur l'opportunité d'accroître considérablement notre aide militaire à la Géorgie, notamment en l'autorisant à acquérir des avions et des armes plus lourdes de fabrication américaine, comme des chars et de l'artillerie. Par ailleurs, des propositions d'aide économique ont été avancées pour stabiliser la Géorgie au lendemain de la brutale guerre civile. Malheureusement, il est peu probable que le Congrès approuve de nouvelles demandes de dépenses. Si le projet de loi serait finalement adopté, une aide significative coûterait certainement du capital politique à notre administration. Comment procéder ?"
 CIA_GEO.17.desc:0 "Suite à la victoire des forces alliées occidentales dirigées par Gamsakhourdia, nous avons décidé, après mûre réflexion avec nos principaux partenaires de l'OTAN, d'inviter la Géorgie à rejoindre l'OTAN. Si la Russie et les flagorneurs pro-russes de toute l'Europe dénonceront cette initiative comme une violation de la souveraineté russe et des accords informels préalables à l'élargissement de l'OTAN, l'intervention russe en Géorgie et la lutte pour une Géorgie démocratique ont clairement démontré la nécessité d'une intervention de l'OTAN dans l'ex-Union soviétique afin de préserver les gouvernements démocratiques de la tyrannie russe. Bien que le vote sur leur accession n'ait pas encore commencé, le Département d'État ne pense pas qu'il existe actuellement d'opposition sérieuse de la part des autres membres de l'OTAN. Des inquiétudes ont été exprimées quant à une éventuelle escalade russe sur d'autres théâtres d'opérations, mais nos responsables du Département d'État et de la Défense estiment que la Russie n'a pas la pleine capacité d'une escalade appropriée compte tenu des troubles en Russie et de la guerre de Tchétchénie en cours."
 CIA_GEO.5.desc:0 "Aslan Abashidze, dirigeant de la République autonome d'Adjarie, dans l'ouest de la Géorgie, a été assassiné plus tôt dans la journée. L'agresseur, placé en garde à vue, serait un Russe vivant en Adjarie, mécontent de la position de neutralité d'Abachidze dans la guerre civile géorgienne qui oppose le gouvernement militaire de Tbilissi aux forces loyales au président récemment destitué, Zviad Gamsakhourdia. Les analystes estiment que cette décision forcera l'Adjarie à s'impliquer définitivement dans la guerre civile et à se ranger du côté des zviadistes. Cela pourrait représenter un changement de pouvoir majeur dans la guerre civile en cours et serait une aubaine pour la cause zviadiste. Parallèlement, des personnalités pro-russes ont affirmé n'avoir aucune part à l'assassinat et ont accusé la Central Intelligence Agency (CIA) d'avoir orchestré le complot. Ces allégations ont été largement tournées en dérision en Occident, notamment dans un sketch de l'émission américaine de fin de soirée, Saturday Night Live."
 CIA_GEO.6.desc:0 "Plus tôt dans la journée, un assassin potentiel a tenté d'assassiner Aslan Abashidze, dirigeant de la République autonome d'Adjarie, dans l'ouest de la Géorgie. L'assaillant a été rapidement capturé et ses motivations restent à déterminer. Cependant, un représentant d'Abashidze a imputé cet acte à la CIA et aux forces de Gamsakhourdia et s'est engagé à reconsidérer la position de l'Adjarie dans la guerre civile en cours. Jusqu'à présent, la région d'Adjarie, sous la direction d'Abashidze, a tenu à l'écart les forces du gouvernement militaire pro-russe et du gouvernement en exil de Gamsakhourdia. Cependant, la région autonome pourrait rassembler suffisamment de forces pour faire pencher la balance en faveur de l'un ou l'autre camp. Washington et Gamsakhourdia ont nié toute implication dans l'attaque et ont affirmé que le tireur était un Russe de souche allié à l'opposition. L'avenir nous dira si cela entraînera la chute des forces de Gamsakhourdia ou si cela maintiendra simplement le statu quo dans la région."
 CIA_GEO.11.desc:0 "À la surprise générale, Aslan Abashidze, dirigeant de la République autonome d'Adjarie, dans l'ouest de la Géorgie, a annoncé son intention de rompre la neutralité de l'Adjarie et de se rallier au gouvernement en exil. Cette annonce est une surprise majeure compte tenu des efforts déployés de longue date par Abashidze pour maintenir l'Adjarie à l'écart de la guerre civile. La guerre civile géorgienne actuelle est marquée par la brutalité de ses affrontements entre les forces du gouvernement de Tbilissi et celles de l'opposition soutenue par la Russie. Des effectifs et un soutien supplémentaires de l'Adjarie pourraient renverser la situation en faveur du gouvernement et représenteraient un revers majeur pour les forces d'opposition. Les détracteurs d'Abashidze accusent la CIA de l'avoir corrompu, évoquant de nombreux vols américains récents à destination de Batoumi. Cependant, les États-Unis ont démenti ces allégations et ont souligné que ces transports ne servaient qu'à fournir une aide militaire et humanitaire indispensable à cette région pauvre de Géorgie."
 CIA_ETH.0.desc:0 "Depuis la chute de la monarchie éthiopienne en 1974, l'Éthiopie est en proie à la violence et à une guerre civile multiforme. La violence, la famine qui en a résulté et le conflit en cours en Érythrée ont coûté la vie à des centaines de milliers de personnes et déplacé des millions de personnes. La guerre civile continue de faire rage, opposant désormais la junte militaire communiste au pouvoir, le Front populaire de libération du Tigré (TPLF) et ses alliés, ainsi qu'une poignée de groupes sécessionnistes et autres groupes militants idéologiques. Aucune des deux principales factions ne défend nos intérêts, en particulier le gouvernement actuel, soutenu par Moscou et La Havane. Plusieurs options s'offrent donc à nous : premièrement, nous pourrions simplement continuer à observer la situation et envisager des actions ultérieurement ; deuxièmement, nous pourrions engager un dialogue avec le TPLF et voir s'il est possible de l'orienter vers une orientation plus pro-occidentale. Une autre option, principalement évoquée par les personnes liées à la Heritage Foundation, consisterait à trouver des personnes disposées, au sein de la diaspora ou de l'ancienne noblesse, à rallier les éléments conservateurs du pays à un nouveau camp dans le conflit."
 CIA_ETH.1.desc:0 "Malheureusement, les forces conservatrices en Éthiopie ont largement faibli et sont devenues de plus en plus insignifiantes ces dernières années. Compte tenu de ce contexte et de l'idéologie marxiste des principales factions de la guerre civile en cours, le Conseil national de sécurité a décidé de limiter nos activités à la seule collecte de renseignements pour le moment, sauf changement notable dans la Corne de l'Afrique. Bien que nous évitions de nous impliquer dans les factions de la guerre civile éthiopienne ou de la lutte pour l'indépendance de l'Érythrée, une proposition a été émise visant à intensifier notre soutien à la Somalie et à tenter d'utiliser la Somalie comme intermédiaire dans la région pour déstabiliser davantage l'Éthiopie. Malheureusement, cette décision de limiter nos activités a été critiquée par certains médias, notamment ceux affiliés à la Fondation Heritage et d'autres qui prônent une action plus décisive pour chasser le communisme de la Corne de l'Afrique."
 CIA_ETH.2.desc:0 "La Fondation Heritage, parmi d'autres organisations anticommunistes, plaide depuis longtemps pour une action plus énergique dans la Corne de l'Afrique afin de faire reculer le communisme. L'échec des forces contre-révolutionnaires à la fin des années 1970 a freiné toute action future dans la région. Cependant, les organisations anticommunistes sont nombreuses au sein de la diaspora, notamment l'Alliance démocratique du peuple éthiopien (EPDA), dirigée par les frères Deressa. La Fondation Heritage et d'autres partisans de la ligne dure font pression sur l'administration pour qu'elle investisse dans ce groupe en prévision du lancement d'une nouvelle lutte anticommuniste dans la Corne de l'Afrique. Les élus continuent d'annoncer leur soutien et de faire pression à nos côtés en faveur de ces « contras éthiopiens ». En revanche, les critiques affirment que ce projet ne bénéficie guère d'un soutien populaire en Éthiopie et est qualifié d'exagérément optimiste."
 CIA_ETH.3.desc:0 "Après le renversement de l'empereur Haïlé Sélassié, le prince héritier Asfaw Wossen et plusieurs autres membres de la cour et de la maison impériales ont fui à l'étranger, principalement à Londres et à Washington. Ras Mengesha Seyoum, prince héréditaire du Tigré et chef d'une branche cadette de la dynastie, chef de l'Union démocratique éthiopienne (EDU) et prétendant potentiel au trône d'Éthiopie, s'est également récemment exilé suite aux échecs militaires de l'EDU. Pour légitimer nos nouveaux projets pour l'Éthiopie, nous devons approcher le prince héritier Asfaw et Ras Mengesha Seyoum et gagner leur faveur. Idéalement, nous devons dialoguer avec les deux factions monarchistes avant de tenter d'obtenir le soutien des éléments conservateurs encore présents en Éthiopie. Une fois les accords conclus avec la maison impériale, la CIA commencera à déployer des agents expérimentés, ainsi que des agents recrutés dans la diaspora."
 CIA_ETH.4.desc:0 "Avec l'aval de la maison impériale et de diverses organisations de la diaspora, la CIA a commencé à déployer des agents et des agents dans les hautes terres rurales d'Éthiopie. Nos agents, des agents de renseignement de carrière et plusieurs recrutés dans la diaspora, prendront contact avec des personnalités locales, telles que des propriétaires terriens, des membres du clergé et des autorités traditionnelles des villages, afin de recruter des collaborateurs et des membres potentiels pour la branche armée de l'Alliance démocratique du peuple éthiopien. Une attention particulière a été portée à éviter tout contact avec des groupes ethniques plus hostiles, ainsi qu'à éviter complètement l'Érythrée, compte tenu de la guerre d'indépendance en cours contre le gouvernement central, et avant cela contre la monarchie. Des camps d'entraînement ont également été établis au Soudan voisin parmi la population réfugiée afin de recruter davantage de combattants potentiels et de servir de base d'intervention."
 CIA_ETH.5.desc:0 "L'Église orthodoxe éthiopienne Tewahedo, la plus ancienne église d'Afrique subsaharienne, fondée au début du XIVe siècle, est un élément majeur de la vie éthiopienne et a été autrefois un pilier majeur de la monarchie éthiopienne. Si le Derg s'est employé à écarter les principaux anticommunistes des postes clés du clergé, de nombreux religieux conservateurs exercent encore librement leur religion, notamment dans les zones rurales d'Éthiopie. Nos agents mobiliseront le clergé en révélant tous les détails de la mort d'Abuna Theophilos, le deuxième patriarche de l'Église, exécuté secrètement pendant sa détention fin 1979. Nos agents, en Éthiopie et à l'étranger, lanceront également une campagne de propagande sur sa mort afin de délégitimer davantage le gouvernement du Derg et de déstabiliser les dirigeants nommés par le Derg et actuellement à la tête de l'Église."
 CIA_ETH.6.desc:0 "Les forces réactionnaires de notre pays sont restées largement silencieuses depuis l'échec de l'offensive de l'Union démocratique éthiopienne (EDU) contre Gondar à la fin des années 1970. Malheureusement, cela ne semble plus être le cas. Nos agents de renseignement nous ont récemment informés d'une contestation croissante de la population envers notre régime, encouragée par le clergé dans nos régions centrales. Si l'EDU a été largement contrainte à l'exil et que d'autres groupes réactionnaires marginaux sont peu présents en cette période de guerre civile, des signes croissants d'un regain d'enthousiasme pour la restauration de la monarchie et d'un ressentiment rural envers notre gouvernement se font jour. Bien qu'alarmante, cette évolution présente un aspect positif. Des troubles similaires ont été observés dans les territoires contrôlés par le Front populaire de libération du Tigré (TPLF). Une recrudescence du mécontentement et de la dissidence au sein de l'opposition pourrait nous donner un avantage dans la guerre civile en cours, si les mesures appropriées sont prises."
 CIA_ETH.7.desc:0 "Grâce au soutien officiel de la maison impériale, nos agents de terrain ont commencé à intégrer les vestiges de l'Union démocratique éthiopienne (EDU), monarchiste, au sein de l'Alliance démocratique du peuple éthiopien (EPDA). Une fois cette opération achevée, nous commencerons à organiser des unités paramilitaires officielles, tant en Éthiopie qu'au Soudan, parmi la population réfugiée. Cette opération vise à préparer une nouvelle incursion des forces conservatrices contre le Front de libération du peuple du Tigré et le gouvernement du Derg, dans le but de s'emparer de Gondar, capitale de la province de Begmender et ancienne zone de soutien de l'EDU compte tenu du nombre de fidèles de Ras Mengesha Seyoum dans la province. Malheureusement, le Derg et l'opposition communiste ont constaté notre présence renouvelée dans la région et pourraient avoir commencé à préparer une future incursion contre leurs forces. Heureusement, les deux camps ne manifestent aucune volonté de réconciliation, malgré leur appartenance au communisme."
 CIA_ETH.8.desc:0 "Ces dernières années n'ont pas été favorables à notre cause. Malgré des gains initiaux face à la junte, notre incapacité à sécuriser un seul centre urbain majeur a entraîné un déclin rapide de nos effectifs et de nos forces combattantes. Cependant, la direction de Ras Mengesha Seyoum continue de conférer à notre groupe une légitimité générale. De plus, l'opposition marxiste au DERG a contribué à repousser nos forces hors de la majeure partie du territoire éthiopien. Cependant, les États-Unis ont contacté nos dirigeants en exil et ont décidé de contribuer à notre réorganisation, en collaboration avec l'Alliance démocratique du peuple éthiopien dirigée par les frères Deressa. Cette réorganisation établira solidement une doctrine politique officielle pour le mouvement démocratique réformé en Éthiopie et bénéficiera d'un soutien massif, tant politique que militaire, de Washington. Bien que cela nécessite des compromis avec les entreprises étrangères et les intérêts américains, c'est de loin notre meilleure chance de mettre fin au régime communiste en Éthiopie et de permettre le retour de nos forces dans ce pays."
 CIA_ETH.9.desc:0 "Sans surprise, la récente montée des troubles au sein des composantes les plus conservatrices de notre société et la recrudescence de la violence dans les régions rurales des hautes terres ont été suivies d'une incursion officielle de l'Alliance démocratique du peuple éthiopien (ADPE), désormais constituée des vestiges de l'Union démocratique éthiopienne et bénéficiant du soutien de la diaspora et, assurément, de Washington. Pire encore, les États-Unis ont lancé une campagne de bombardements contre nos forces militaires, ainsi que celles du Front démocratique révolutionnaire du peuple éthiopien (FRDPE). Cela a plongé la guerre civile en cours dans un chaos total, le conflit se transformant en un affrontement multipartite entre notre gouvernement, le FRDPE, d'autres sécessionnistes ethniques et, désormais, les forces réactionnaires revitalisées. Pourtant, si l'ADPE a réussi à s'implanter en Éthiopie, le soutien populaire dont bénéficie le mouvement et son aptitude à affronter les autres factions de la guerre civile restent incertains."
 CIA_ETH.11.desc:0 "Plus tôt dans la journée, nos contacts au sein de l'Alliance démocratique du peuple éthiopien (EPDA) ont annoncé qu'Addis-Abeba était finalement tombée aux mains des forces antirégime. La chute du Derg marque un tournant dans notre politique de retour en arrière. Un État communiste est enfin tombé aux mains des rebelles soutenus par l'Occident en Afrique. L'EPDA s'est fermement engagée à restaurer la monarchie éthiopienne. Cependant, le prétendant exact à cette restauration, compte tenu de la direction de l'Union démocratique éthiopienne et de l'exil de plusieurs membres de la famille impériale, reste à déterminer. De plus, la répartition du pouvoir entre l'Église, la monarchie et le nouveau gouvernement civil devra être débattue, de même que l'élimination des autres groupes marxistes en Éthiopie. Cela dit, il s'agit d'une confirmation éclatante de la politique de notre administration, dont les résultats se refléteront certainement dans les prochaines élections."
 CIA_ETH.12.desc:0 "Le Front démocratique révolutionnaire du peuple éthiopien (FDRPE) est la principale force d'opposition au gouvernement du Derg en Éthiopie. Il est une alliance de quatre partis : le Front de libération du peuple du Tigré (FLPT), le Mouvement démocratique du peuple du Sud de l'Éthiopie (MDPE), l'Organisation démocratique du peuple oromo (ODPO) et le Mouvement démocratique national amhara (MDNA). Bien que d'orientation marxiste, ils combattent le gouvernement communiste, soutenu par Moscou et La Havane. Compte tenu de leur opposition à un gouvernement soutenu par Moscou, le président a autorisé la CIA à établir des contacts avec le FDRPE, à établir des liens formels avec l'organisation et à présenter une liste de concessions qui pourraient être acceptées en échange de notre soutien dans leur guerre contre le gouvernement. Cela exigerait bien sûr que le FDRPE fasse preuve de modération politique et fasse diverses concessions sur la forme que devrait prendre l'État éthiopien d'après-guerre, mais cela lui apporterait assurément une aide matérielle et humanitaire importante."
 CIA_ETH.13.desc:0 "À la surprise générale, nous avons été contactés par les Américains. Un agent, apparemment de la CIA, nous a informés que Washington était disposé à discuter des conditions de soutien à notre mouvement en échange de concessions. En échange, nous recevrions une aide humanitaire importante, ainsi qu'une aide militaire, pouvant aller jusqu'à des armes lourdes, et même une campagne aérienne contre le gouvernement central. Cependant, nous serions tenus de faire preuve de modération politique et de nous engager à dialoguer avec les éléments plus conservateurs en Éthiopie. Nous serions également contraints de nous aligner sur l'Occident et de réévaluer notre position sur l'Érythrée une fois le Derg renversé. Cela dit, nous avons été informés que nos intentions d'une Éthiopie plus fédérale correspondent aux attentes américaines. Accepter freinerait certainement notre tendance à gauche et nos objectifs, mais pourrait mettre fin plus rapidement aux souffrances de notre peuple et mettre fin au gouvernement du Derg. Comment procéder ?"
 CIA_ETH.14.desc:0 "Malheureusement, le Front démocratique révolutionnaire du peuple éthiopien (FDRPE) a rejeté nos conditions et notre démarche. Cette décision met fin à nos efforts en Éthiopie. Il n'y a plus d'autre faction majeure dans la guerre, les forces conservatrices et monarchistes sont militairement vaincues depuis longtemps et la situation actuelle sur le terrain laisse peu de place à la création d'une nouvelle force armée. Malheureusement, le FDRPE ne semble pas croire avoir besoin de notre soutien conditionnel pour vaincre le Derg et que toute concession serait préjudiciable à son avenir dans l'Éthiopie d'après-guerre. Il est peut-être temps de redoubler d'efforts pour sécuriser la Somalie. Par ailleurs, certains membres du Conseil de sécurité nationale ont proposé de tendre la main aux rebelles érythréens ou de renforcer les liens avec le Soudan, malgré l'échec total de notre politique éthiopienne actuelle."
 CIA_ETH.15.desc:0 "Le Front démocratique révolutionnaire du peuple éthiopien (FDRPE) a accepté de faire des concessions en échange de notre soutien. C'est une excellente nouvelle pour les récents changements de politique de notre administration concernant la Corne de l'Afrique. Grâce à cet accord, nous pouvons désormais commencer à fournir une aide humanitaire et des livraisons limitées d'armes. Le ministère de la Défense va bientôt préparer des propositions pour des programmes d'aide plus importants, qui seront débattus au sein du Conseil de sécurité nationale. Alors que les Soviétiques et Cuba soutiennent toujours le Derg, nous pouvons désormais ouvrir un nouveau front par procuration contre Moscou via l'Éthiopie, ce qui épuisera encore davantage les ressources communistes dans la région. Si la victoire est loin d'être assurée, l'instabilité du gouvernement central et la montée des troubles en Éthiopie, ainsi que la guerre en Érythrée, affaibliront certainement le Derg et, à terme, conduiront à son effondrement."
 CIA_ETH.16.desc:0 "Une excellente nouvelle nous est parvenue : suite à notre accord avec Washington, des armes lourdes ont commencé à être livrées à nos combattants. Ceci s'ajoute à l'aide militaire et humanitaire initiale fournie précédemment. En particulier, de l'artillerie, des armes légères modernes, des munitions et des armes antichars et antiaériennes sont arrivées récemment et ont été déployées sur le front. Nous espérons que ce renforcement de l'équipement moderne permettra à nos forces de contrer l'aviation et les chars soviétiques fournis à l'Éthiopie et d'infliger des pertes plus importantes aux forces gouvernementales. Bien que les chars et autres équipements mécanisés ne soient pas encore arrivés, les Américains ont noté le potentiel de leur arrivée prochaine, en fonction de l'efficacité avec laquelle nos forces utiliseront les ressources déjà envoyées."
 CIA_ETH.18.desc:0 "Maintenant que la guerre touche à sa fin, nous devons décider comment reconstruire l'Éthiopie. Depuis le coup d'État initial du début des années 1970, l'Éthiopie a connu une invasion étrangère, une lutte pour l'indépendance avec l'Érythrée, une longue guerre civile et une famine majeure qui ont dévasté le pays. Dans ce contexte, nous avons la possibilité d'apporter une aide économique significative au nouveau régime, mais cela serait très coûteux à mettre en œuvre intégralement et pourrait être difficile à convaincre au Congrès. Alternativement, nous pourrions utiliser nos nouvelles relations au sein du gouvernement éthiopien pour encourager les investissements des entreprises dans le pays, ce qui minimiserait nos coûts initiaux et renforcerait notre soutien aux entreprises lors des prochaines élections. Cela étant dit, cette décision pourrait saper la bonne volonté que nous avons créée en Éthiopie en mettant fin à la guerre civile. Comment devrions-nous procéder ?"
 CIA_ETH.19.desc:0 "Excellente nouvelle : les Américains ont tenu parole et ont entrepris des efforts considérables pour stabiliser notre nouveau gouvernement. L’aide humanitaire a augmenté de manière exponentielle, atténuant les pires symptômes de la famine du début de la décennie. Des conseillers techniques sont également arrivés, contribuant à la signature de contrats avec des entreprises occidentales pour des projets d’infrastructures, notamment des barrages et des canaux destinés à soutenir notre secteur agricole, mais aussi à la prospection minière et aux projets d’industrialisation. Une attention particulière a également été accordée aux projets de barrages hydroélectriques sur le Nil, alors que par le passé, cela aurait été impossible en raison des pressions étrangères de l’Égypte et du Soudan. Notre alignement avec les États-Unis et les investisseurs occidentaux ont rendu cela possible. Globalement, si l’influence des entreprises américaines devrait s’amenuiser dans les années à venir, le pays commence à se rétablir et une voie vers une Éthiopie stable et prospère, impossible à imaginer il y a quelques années à peine, pourrait bientôt se dessiner."
 CIA_ETH.20.desc:0 "Maintenant que nous avons pleinement établi nos relations avec l'opposition et conclu un accord sur le soutien et le cadre d'un futur gouvernement d'après-guerre, le moment est venu d'agir contre le gouvernement central. Le ministère de la Défense a élaboré un plan visant à lancer des frappes aériennes contre les forces gouvernementales depuis nos bases dans la région et le groupe aéronaval qui les accompagne. L'objectif est de paralyser les équipements blindés et mécanisés, les dépôts de carburant, les moyens aériens et les forces d'élite du gouvernement. Compte tenu de la pression croissante exercée sur les forces gouvernementales, l'objectif est de paralyser leur capacité à mener des actions militaires conventionnelles soutenues, ainsi que de dégrader les défenses en amont des principales villes contrôlées par le gouvernement, notamment la capitale Addis-Abeba. Compte tenu de la durée de la guerre et des problèmes d'équipement croissants de l'armée éthiopienne, les risques pour nos pilotes et les autres forces participantes sont minimes."
 CIA_ERITREA.0.desc:0 "Avec la chute du Derg et notre soutien au camp victorieux, nous devons maintenant déterminer la marche à suivre pour gérer les autres conflits en Éthiopie. Le principal enjeu actuel est le mouvement indépendantiste érythréen en cours. Le conflit en Érythrée précède la montée du Derg et la guerre civile en Éthiopie. Cependant, la guerre civile et l'instabilité des années du Derg ont permis au Front populaire de libération de l'Érythrée (FPLE) de mener une guerre d'usure plus vaste et de prendre le contrôle de vastes étendues des hauts plateaux érythréens. Alors qu'initialement, les rebelles contre le Derg coopéraient tacitement avec le FPLE, la chute du Derg a suscité des tensions quant à savoir si le nouveau gouvernement devait accepter l'indépendance de l'Érythrée ou reprendre la guerre pour conserver l'Érythrée.\n\nSe ranger du côté de l'Éthiopie renforcerait certainement nos liens diplomatiques avec le nouveau gouvernement érythréen, mais nécessiterait également que notre gouvernement augmente son soutien matériel et financier à Addis-Abeba pour qu'une telle guerre puisse avoir lieu. Nous pourrions également faire pression sur le nouveau gouvernement pour qu'il accepte la souveraineté de l'Érythrée. Cette démarche témoignerait de notre détermination à défendre l'autodétermination, mais elle pourrait affaiblir le nouveau gouvernement et permettre un regain d'influence soviétique en mer Rouge. Comment procéder ?"
 CIA_ERITREA.1.desc:0 "Après un débat approfondi au sein du Conseil national de sécurité (CNS), le Président a décidé de soutenir l'Éthiopie si celle-ci souhaite reprendre le contrôle de l'Érythrée. Le Front populaire de libération de l'Érythrée (FPLE) communiste et ses précurseurs mènent une guerre d'indépendance contre Addis-Abeba depuis des décennies, avant même l'avènement du Derg dans les années 1970. Cependant, l'instabilité engendrée par la guerre civile et la terreur rouge a permis au FPLE de contester la majeure partie de l'Érythrée et de consolider son contrôle sur de vastes pans de la province séparatiste. Les dissidents au sein du CNS ont fait valoir que le rétablissement du contrôle éthiopien sur la région serait trop coûteux pour notre gouvernement et qu'il risquait également d'aggraver la crise humanitaire dans la région. Cependant, le Président a décidé que les avantages d'une Éthiopie unifiée et d'une élimination totale de l'influence soviétique sur la rive africaine de la mer Rouge valent le risque. Dans les prochains jours, notre ambassadeur en Éthiopie rencontrera le gouvernement intérimaire pour lui exposer notre position sur le sort de l'Érythrée."
 CIA_ERITREA.2.desc:0 "Après un débat approfondi au sein du Conseil de sécurité nationale, le président a décidé de faire pression sur l'Éthiopie pour qu'elle autorise l'Érythrée à se libérer. Si l'idéal serait de préserver l'intégrité territoriale de l'Éthiopie, surtout si elle est dirigée par un gouvernement pro-occidental, la réalité sur le terrain est que l'Éthiopie manque actuellement des effectifs et des capacités nécessaires pour rétablir le contrôle gouvernemental sur l'Érythrée. Des dissidents au sein des services de renseignement ont rétorqué que notre gouvernement pourrait fournir une aide considérable à l'Éthiopie au point de permettre un rétablissement du contrôle. Cependant, la crainte du président de créer une catastrophe humanitaire encore plus dévastatrice dans la région a prévalu. Dans les prochains jours, notre ambassadeur en Éthiopie rencontrera le gouvernement intérimaire pour lui exposer notre position sur le sort de l'Érythrée."
 CIA_ERITREA.3.desc:0 "Alors que nous poursuivons la mise en place de notre gouvernement, le problème de l'Érythrée est devenu notre priorité absolue. L'ambassadeur américain récemment nommé nous a informés aujourd'hui que les États-Unis reconnaîtraient l'indépendance de l'Érythrée. Il nous a insistés sur le fait que c'était dans l'intérêt de toutes les parties et a souligné que l'Éthiopie n'avait pas la capacité de démanteler le Front populaire de libération de l'Érythrée (FPLE) et qu'une nouvelle offensive en Érythrée pourrait compromettre la stabilité du nouveau gouvernement. Nous n'aurons d'autre choix que d'accéder à la demande américaine. Bien que cela puisse susciter la controverse au sein de certains secteurs de notre gouvernement, sans le soutien américain, nous ne disposerons pas des ressources nécessaires pour prendre le contrôle de l'Érythrée sans nous exposer à des coûts considérables et provoquer une catastrophe humanitaire encore plus grave."
 CIA_ERITREA.4.desc:0 "Alors que nous poursuivons la mise en place de notre gouvernement, le problème de l'Érythrée est devenu notre priorité absolue. L'ambassadeur américain récemment nommé nous a informés aujourd'hui que les États-Unis reconnaîtraient l'Érythrée comme faisant partie intégrante de l'Éthiopie. Il a également indiqué que Washington serait disposé à intensifier son aide militaire et financière dans le cadre de la lutte à venir contre le Front populaire de libération de l'Érythrée (FPLE). Alors que notre gouvernement débattait de sa politique à l'égard de l'Érythrée, cette situation nous offre une occasion unique de préserver l'intégrité territoriale de l'Éthiopie. À un moment donné, cela aurait été perçu comme impossible, mais avec le soutien américain, chasser le FPLE des zones clés de l'Érythrée devrait être réalisable. Cela dit, certains de nos partenaires au pouvoir étaient autrefois alliés au FPLE et chercher à rétablir l'autorité sur l'Érythrée pourrait déstabiliser notre gouvernement. Comment procéder ?"
 CIA_ETH.10.desc:0 "Suite au soutien accru des États-Unis aux forces conservatrices dans la guerre civile éthiopienne, les États-Unis ont lancé une vaste campagne aérienne contre le gouvernement du Derg et les rebelles du Front populaire de libération du Tigré (FPLT). La guerre civile éthiopienne est un conflit singulier à l'heure actuelle, car les multiples factions impliquées, dont le FPLT, le gouvernement et le Front populaire de libération de l'Érythrée (FPLE), qui s'opposent toutes, sont officiellement marxistes-léninistes. Avant la révolution éthiopienne de 1974, l'Éthiopie était un allié régional clé des États-Unis. Selon de nombreux analystes et groupes de défense, la guerre civile a permis aux États-Unis de regagner de l'influence dans la région. Au cours de l'année écoulée, le Congrès et l'administration ont soutenu et renforcé l'Alliance démocratique du peuple éthiopien (ADPE). L'ADPE, surnommée les « Contras éthiopiens » par la Heritage Foundation, s'est rapidement développée et a absorbé d'autres groupes conservateurs et monarchistes plus petits, et contrôle désormais activement des territoires dans certaines régions du pays. La campagne aérienne en cours pourrait s’avérer décisive pour éliminer le quasi-monopole du TPLF et des forces gouvernementales sur les armes lourdes et compliquer leur logistique."
 CIA_ETH.17.desc:0 "Sans surprise, les États-Unis ont reconnu le nouveau gouvernement éthiopien dirigé par Dereje Deressa, secrétaire général de l'Alliance démocratique du peuple éthiopien (EPDA). Il s'agit d'un tournant majeur pour l'Amérique dans la Corne de l'Afrique et d'une ascension fulgurante pour les frères Deresse, qui dirigent l'EPDA et ont réussi à obtenir le soutien américain, contrairement à d'autres. Si les vestiges du Front de libération du peuple du Tigré (TPLF) demeurent une source de préoccupation pour le nouveau gouvernement, celui-ci a rapidement perdu du terrain en raison de défections et de l'intensification des combats avec le Front de libération du peuple érythréen (EPLF). Cela étant dit, le nouveau gouvernement a désormais la lourde tâche de mater les rebelles restants, de régler le problème érythréen, de rétablir enfin la stabilité et de résoudre la crise humanitaire à laquelle l'Éthiopie est confrontée. Cela dit, le président [USA.GetLeader] s'est engagé à fournir une aide militaire, économique et humanitaire importante au nouveau gouvernement dans les semaines à venir."
 CIA_SOM.0.desc:0 "Les conséquences de la guerre de l'Ogaden ont été largement déstabilisatrices pour la Somalie. Cependant, cette déstabilisation et la rupture des liens entre Moscou et Mogadiscio ont contribué à une détérioration rapide de la situation politique en Somalie. Peu après la guerre, le Front démocratique du salut de la Somalie a été fondé avec le soutien de l'Éthiopie, du Yémen du Sud et de la Libye pour chasser Siad Barre du pouvoir. Plus ouvert à l'idéologie de gauche, il est dominé par le clan Majeerteen. À la même époque, des membres de la diaspora et des officiers exilés ont également fondé le Mouvement national somalien à Riyad, en Arabie saoudite, avec un soutien au sein du clan Isaaq, population dominante dans le nord de la Somalie et politiquement fortement anticommuniste. Le gouvernement somalien n'a fait qu'aggraver la situation en punissant collectivement des clans entiers pour les actes présumés de certains individus et en lançant des purges claniques au sein du corps des officiers. Si soutenir le Front démocratique du salut de la Somalie est certainement hors de question, nous pourrions envisager de soutenir le Mouvement national somalien, maintenir notre soutien à Siad Barre ou adopter une position plus neutre en Somalie."
 CIA_SOM.1.desc:0 "Ces dernières années, la Somalie a été un allié de circonstance. Cependant, la détérioration continue de la situation en Somalie, suivie de la répression brutale du gouvernement, a conduit à une réévaluation de notre soutien au gouvernement de Siad Barre. Le président a décidé de limiter notre aide au gouvernement Barre à la seule assistance humanitaire. Si certaines factions de l'opposition sont davantage alignées sur Moscou, le régime de Barre est devenu trop oppressif et instable pour continuer à le soutenir militairement. La CIA a été chargée d'établir secrètement des contacts avec le Mouvement national somalien, dans ses bureaux de Londres ou de Riyad, afin de mieux comprendre ses objectifs et sa volonté de collaborer avec nous. Pour l'instant, le Front démocratique du salut de la Somalie, soutenu par l'Éthiopie, reste notre principal adversaire en Somalie, mais continuer à soutenir Barre revient à engloutir argent et armes dans un navire en perdition."
 CIA_SOM.2.desc:0 "Le gouvernement somalien de Siad Barre est devenu notre principal allié dans la Corne de l'Afrique après la guerre de l'Ogaden et la rupture des relations entre la Somalie et l'Union soviétique. Bien que Barre se soit, dans une certaine mesure, aligné sur nos valeurs et que nous lui ayons apporté un soutien limité en retour, la situation en Somalie est désastreuse. Le principal mouvement d'opposition, le Front démocratique du salut de la Somalie, bénéficie du soutien de l'Éthiopie communiste et du Yémen du Sud, ainsi que de la direction compromettante de l'ancien attaché militaire auprès de l'Union soviétique. Dans ce contexte, le président a décidé d'accroître considérablement l'aide militaire à Mogadiscio. Des pressions diplomatiques seront également exercées sur Barre, en privé, afin de tenter de freiner les instincts de représailles les plus vicieux de son régime, qui aggravent encore la situation. Bien que cela soit déplaisant, nous ne pouvons pas laisser toute la Corne de l'Afrique sombrer dans le communisme."
 CIA_SOM.3.desc:0 "Une proposition intéressante a été relayée de Washington. Les Américains ont proposé de nous fournir un soutien technique et militaire étendu en échange du lancement d'une offensive renouvelée dans l'Ogaden. Notre tentative antérieure de saisir l'Ogaden a échoué en raison de l'intervention écrasante 1 des forces soviétiques et cubaines. Cependant, maintenant, avec les forces Derg, soviétiques et cubaines en Éthiopie, collés à la guerre civile et à l'Érythrée, nous avons une nouvelle occasion d'essayer une fois de plus. De plus, les États-Unis proposent de fournir une aide importante importante si nous acceptons cette entreprise pour aider à prévenir une répétition de la War1 précédente. Alors que les troubles internes se sont répandus à l'intérieur de nos propres frontières, une victoire décisive sur l'Éthiopie atténuerait sûrement les préoccupations du public et unifierait la nation. Cependant, si nous devions échouer une fois de plus, les conséquences seraient pour le moins désastreuses."
 CIA_SOM.4.desc:0 "Heureusement, le gouvernement somalien a accepté notre proposition de lancer à nouveau une offensive dans l'Ogaden. Le but de l'offensive est de libérer le peuple somalien en Éthiopie et d'annexer la majorité somalienne des parties de la Somalie en Éthiopie. Alors que la guerre antérieure d'Ogaden a entraîné une échec en raison d'un soutien écrasant de l'Union soviétique et de Cuba, la guerre civile amer en Éthiopie devrait atténuer ce potentiel compte tenu de l'état affaibli de l'armée éthiopienne. Si nos forces sont suffisamment capables, en particulier avec le soutien occidental, les Somaliens pourraient porter un coup fatal pour le gouvernement éthiopien actuel, ce qui conduit potentiellement à un État paralysé incapable de lancer une contre-offensive dans l'Ogaden à tout moment dans un avenir proche. Quoi qu'il en soit, cette décision déstabilisera davantage l'influence soviétique dans la corne de l'Afrique et s'adaptera à nos objectifs stratégiques dans la région."
 CIA_SOM.5.desc:0 "Malheureusement, le gouvernement somalien nous a informés qu'ils sont contre l'intervention dans la région d'Ogaden à cette époque. Bien que le gouvernement somalien ait noté son désir de libérer la région de l'Éthiopie, ils ont noté que la situation intérieure en Somalie était trop pauvre pour offrir des actions militaires majeures contre une puissance étrangère, même un dans un détroit aussi désastreux que l'Éthiopie est actuellement. Le gouvernement somalien a fait valoir que les révoltes en cours contre leur gouvernement, en particulier dans la région du Somaliland, prennent la priorité avec les préoccupations concernant l'État de l'armée somalienne depuis la fin de la guerre d'Ogaden. Selon nos analystes axés sur la corne de l'Afrique, l'armée somalienne n'a pas encore remis de leur perte décisive contre l'Éthiopie lors de la guerre précédente, et le gouvernement n'a pas été en mesure de restaurer l'ordre ou la légitimité publique depuis une perte aussi majeure."
 CIA_SOM.7.desc:0 "Excellente nouvelle, les Américains ont vu la valeur dans notre cause et ont indiqué à nos bureaux de la diaspora qu'ils commenceront à nous envoyer un financement et une aide matérielle. Bien que nous ayons réussi à réaliser des gains limités dans les zones rurales, nous avons été jusqu'à présent incapables de s'introduire correctement dans le conflit plus large. Avec une source fiable d'armes et de financement, nous devrions être en mesure de mettre en place une force de combat beaucoup plus forte et plus importante contre le gouvernement et nous pourrons désormais complètement rompre avec la coalition LED du Front de libération populaire du Tigray (TPLF) contre le Derg. Bien que nous soyons actuellement alignés sur le TPLF, les tensions s'effilochés depuis des années sur nos différentes idées sur ce que l'avenir de l'Éthiopie devrait impliquer. Cela n'a été amplifié que car le TPLF s'est déplacé vers la préservation de l'État éthiopien. L'Amérique a conditionné leur soutien à ce sujet, mais étant donné qu'une telle décision était déjà prévue, cela accélère tout simplement l'inévitable."
 CIA_SOM.8.desc:0 "Avec la nouvelle des forces somaliennes finalisant leur capture d'Ogaden et les récentes avancées de l'Armée de libération de l'Oromo, la fin d'une Éthiopie unifiée est clairement en vue. Les factions communistes dans le domaine central de l'Éthiopie continueront sûrement à se battre, mais avec la perte des zones somaliennes et oromo et des pertes croissantes en Érythrée, la fin d'une Éthiopie unifiée est clairement à portée de main. Bien que peut-être une fin malheureuse à un état autrefois glorieux, la prise de contrôle communiste de l'Éthiopie dans les années 1970 a nécessité une fracturation de l'Éthiopie à part pour s'assurer que toute la corne de l'Afrique ne succombe pas aux caprices de Moscou. Nous devrons maintenant développer et cultiver des relations avec l'Oromo et continuer à rechercher la stabilisation de la situation en Somalie. Espérons que la récente victoire pour la Somalie stabilisera la situation interne là-bas et entraînera une diminution du soutien à l'opposition."
 CIA_SOM.10.desc:0 "Excellente nouvelle, les États-Unis ont informé notre bureau à Londres d'avoir rompu les liens avec le gouvernement de Siad Barre et commenceront à travailler avec notre mouvement. Le soutien pour nous a pris du retard par rapport au Front démocratique de l'Éthiopien, Libyen et South Yéménite en Libye et au sud. Washington a relayé que notre dévouement à l'anti-communisme et à la mise en place du droit religieux a été des contributeurs majeurs à leur décision de soutenir notre mouvement. Bien que les détails exacts ne soient pas encore aménagés, le financement américain et saoudien commencera sous peu tandis que des expéditions d'armes potentielles pourraient être possibles dans le futur proche. Ces nouvelles ressources permettront à nos forces en Somalie de se développer considérablement ainsi que d'acquérir des armes modernes au lieu de compter sur des équipements perçus et capturés localement. Malheureusement, cela ne fait rien à l'époque pour mettre fin à la souffrance de notre peuple alors que le régime tente d'effacer notre clan au Somaliland."
 CIA_SOM.11.desc:0 "Les Américains traître nous ont tourné le dos et ont jeté leur sort avec les rebelles. Nos agents nous ont informés des agents américains du renseignement qui rencontrent récemment la direction du mouvement national du Somalin à Londres et à Riyad et maintenant les Américains ont rompu les liens diplomatiques avec notre gouvernement. Il s'agit d'une catastrophe totale et nous coupe de notre principal bailleur de fonds ces dernières années. Le seul positif, c'est que cette décision peut encore refuser l'opposition étant donné les différences idéologiques entre le mouvement national somalien et le front démocratique du salut somalien (SSDF), en particulier avec le SSDF soutenu par les régimes communistes et ayant une idéologie socialiste. Nous avons peu de choix maintenant, mais pour nous battre jusqu'à la fin, la défaite mènera sûrement à l'abattage en gros de notre propre clan en représailles pour nos propres actions ces dernières années."
 CIA_SOM.12.desc:0 "Après notre réévaluation de notre politique somalienne et nous nous dirigeons vers le soutien du mouvement national somalien (SNM), la décision a été prise de commencer à armer le SNM. L'Arabie saoudite sera utilisée comme plaque tournante de transit principale à la livraison des armes. Ceci est aidé par le fait que le SNM a été à l'origine fondé à Riyad et y détient toujours des bureaux. Compte tenu du soutien du sud du Yémen et de l'Éthiopie au Front démocratique du salut somalien (SSDF) concurrent, nous devrons nous assurer que nos agents et les marchands d'armes comprennent les limites actuelles du conflit et ne livreront pas à tort des armes aux mauvaises factions. Pourtant, cette décision devrait en outre presser le régime de la barre, en particulier étant donné le SNM et d'autres mouvements d'opposition ont réussi à faire des gains même avec des déficits majeurs d'armes. Des inquiétudes ont été soulevées pour que cette décision puisse enflammer les tensions de clan à l'intérieur de la Somalie et que le SNM et d'autres factions anti-barres pourraient chercher à riposter contre les clans soutenant Barre, nous devrons chercher à freiner ces impulsions si nous souhaitons voir une stable en Somalie."
 CIA_SOM.13.desc:0 "Avant de décider d'un plan d'action à long terme plus ferme pour la Somalie, le président a autorisé un plan pour rallier le soutien international à la Somalie, cherchant à collecter des fonds pour les questions humanitaires qui sévit la nation tout en intensifiant l'indignation du public contre les actions du régime de Siad Barre. Pour faire avancer ce plan, la Central Intelligence Agency a établi des contacts au sein de la communauté de la diaspora somalienne et diffusera les histoires de leurs violations de souffrance et de droits de l'homme commises par le régime de la barre auprès des principaux conglomérats de médias américains à publier. Cependant, la présence d'une faction soutenue par communiste dans le conflit contre Barre rend cela plus difficile. Nous devrons également encadrer le front démocratique du salut somalien négativement tout en glorifiant les luttes du mouvement national somalien. Une fois que le soutien public a été atténué contre Barre, l'administration peut continuer à débattre et à finaliser nos objectifs stratégiques et nos stratégies de changement de régime en Somalie."
 CIA_SOM.14.desc:0 "Après un long débat interne, le président a décidé d'une aide limitée au mouvement national somalien qui évitera de mettre des bottes américaines sur le terrain en Somalie. L'objectif stratégique sera de fournir une aide militaire mortelle limitée ainsi qu'une aide humanitaire généreuse à nos alliés en Somalie. Étant donné que l'équipement des rebelles se limite aux armes primitives et aux armes du gouvernement capturées, même l'aide létale de base peut faire une différence majeure dans le conflit et l'aide humanitaire peut être utilisée pour réduire les souffrances et fournir une raison pour que certains soient maltraités à la cause rebelle du gouvernement dans les régions affectées par la famine."
 CIA_SOM.15.desc:0 "Après notre campagne publique contre le gouvernement somalien, la décision a été prise d'appeler une intervention américaine en Somalie. Notre campagne médiatique sera intensifiée dans un degré plus élevé en faisant venir des journalistes conformes à une couverture plus approfondie des atrocités des gouvernements somaliens. Les organisations anti-communistes seront pressées de soutenir cette décision en notant le potentiel d'opposition de gauche pour renverser le régime de la barre au lieu du mouvement national anticommuniste somalien. De plus, nous devrons troquer fortement avec les membres clés du Congrès pour obtenir cette mesure par le Congrès. Enfin, nous devrons faire face au public américain, tandis que le soutien aux rebelles est une chose, de nombreux Américains sont toujours traumatisés au cours des interventions précédentes au cours des dernières décennies. Nous devrons être ouverts et clairs sur nos objectifs et notre progression sur l'atteindre si nous souhaitons maintenir un soutien public."
 CIA_SOM.17.desc:0 "Les préparatifs ont été finalisés et les premières troupes américaines devraient actuellement atterrir au Somaliland en ce moment. Notre incursion initiale dans le Somaliland devrait réussir étant donné nos alliés dans le mouvement national somalien (SNM) contrôle actuellement la grande majorité du Somaliland. Cependant, avancer en dehors du Somaliland sera une tâche difficile étant donné la présence du Front démocratique du salut de la gauche (SSDF) dans les puntlands et les boyalistes de la barre dans le sud et d'autres seigneurs de guerre à l'intérieur de la Somalie. L'Air Force, basée sur les bases aériennes des Nations Alliés à proximité et les avions d'un groupe de frappes de transporteurs à proximité, ont lancé une grande campagne de bombardement, ciblant Mogadiscio et les forces du gouvernement à travers le pays tout en abandonnant l'aide et de petites bandes d'agents à être ancrée dans les forces alliées à l'intérieur de la Somalie."
 CIA_SOM.19.desc:0 "Les Américains ont finalement lancé leur campagne d'intervention tant attendue à l'appui de notre cause. En ce moment, les troupes américaines ont commencé à atterrir dans nos zones de contrôle dans le Somaliland et une campagne de bombardement contre les forces de Barre a commencé. Bien que nous ayons des inquiétudes concernant les autres factions militantes, en particulier le front démocratique du salut somalien (SSDF) dans Puntland, nos officiers pensent que les forces alliées devraient être en mesure de progresser rapidement et de renverser le gouvernement de Barre. Des préoccupations ont été soulevées quant au potentiel de diverses factions militantes composant les deux loyalistes à Barre et l'opposition se fragmentant au lendemain de la chute du gouvernement, conduisant potentiellement à un état d'anarchie encore pire dans tout le pays. Nous devons nous assurer qu'un gouvernement compétent et légitime est en place dès que possible pour éviter ce scénario et chercher rapidement à restaurer l'ordre dans toute la Somalie."
 CIA_SOM.20.desc:0 "La situation est devenue désespérée, les États-Unis ont atterri les troupes sur nos côtes, cherchant à mettre fin à notre régime pour nos prétendus \"violations des droits de l'homme\". Une grande campagne de bombardement contre notre gouvernement et nos forces a également commencé, ce qui a déjà dévasté notre capacité militaire limitée et a gravement endommagé nos défenses à l'approche de Mogadishu. Pourtant, nous devons continuer et continuer le combat à tout prix. L'opposition a montré leurs vraies couleurs et si nous tombons ou se rendons, notre peuple sera abattu au dernier des représailles pour nos punitions collectives plus tôt dans la décennie des clans ennemis. Notre meilleure chance est d'essayer de tenir le Mogadiscio et les zones avec un soutien populaire pour Barre et de chercher à exploiter les tensions dans l'opposition et à espérer que le pays descend dans une anarchie dont nous pouvons récupérer après l'échec de l'intervention."
 CIA_SOM.21.desc:0 "Étonnamment, les choses se sont largement déroulées comme prévu. L'intervention américaine a été en mesure de prendre rapidement le contrôle des principaux centres de population de la Somalie et nos forces étaient capables de rotation des divers loyalistes des seigneurs de guerre et des barre à travers l'arrière-pays ruraux. L'aide humanitaire de l'Ouest et des principaux partenaires arabes ont rapidement mis fin à la famine brassée à travers le pays. Alors que les poches de résistance dans les zones reculées se poursuivent, la situation a été largement stabilisée. Les États-Unis ont joué un rôle central à ce sujet. Non seulement les troupes américaines étaient le facteur clé pour briser le contrôle de Barre sur le sud de la Somalie, mais l’aide militaire et technique américaine a permis à nos forces de se moderniser rapidement, ce qui a conduit à nos propres succès militaires. Bien que les problèmes économiques et humanitaires restent, Washington, avec Riyad, a promis des investissements importants pour améliorer notre situation et pour la première fois depuis des décennies, l'avenir de la Somalie a l'air prometteur."
 CIA_SOM.22.desc:0 "L'intervention dirigée par les Américains n'ayant pas stabilisé l'intégralité de la Somalie, les forces de la coalition se sont retirées au Somaliland. Suite à cela, les Américains ont reconnu notre gouvernement au Somaliland comme un État indépendant à la suite de notre propre déclaration d’indépendance. La reconnaissance des autres nations de notre nouvel État a également afflué. Cependant, il n'est pas clair quand les Nations Unies pourraient reconnaître officiellement notre État ou non, ou si la Russie, la Chine ou un autre membre du Conseil de sécurité cherchera à opposer son veto à notre entrée. Bien que globalement regrettable que nous n'ayons pas réussi à restaurer l'ordre à toute la Somalie, nous avons pu sauver notre propre peuple du chaos en cours qui tourmente le reste de la Somalie et pouvons maintenant aller de l'avant avec le travail de récupération des deux dernières décennies de mauvaisrule. Washington s'est également engagé à nous fournir un financement important qui avait été réservé à l'aide humanitaire et économique dans une Somalie post-intervention."
 CIA_SOM.25.desc:0 "Lors de la prochaine session des Nations Unies, les États-Unis ont signalé qu'ils proposeraient une intervention en Somalie. Cela suit la situation de détérioration rapide en Somalie. La guerre civile brutale a pris une tournure plus sinistre alors que le régime de la barre a commencé une campagne de massacre en gros de clans soutenant les factions de l'opposition. Plus particulièrement, le récent génocide du clan Isaaq, entraînant plus de cent mille morts a rallié la communauté internationale et la diaspora somalienne contre Barre. En faisant face à cela maintenant, les États-Unis, un ancien contributeur de Barre, après sa chute de Moscou à la fin des années 1970, propose désormais une intervention des Nations Unies en Somalie dans le but de renverser le gouvernement actuel et d'installer un gouvernement de coalition démocratique de divers groupes d'opposition. Compte tenu du manque de soutien international au gouvernement somalien, la mesure devrait en grande partie passer. Cependant, des questions demeurent sur lesquelles le groupe d'opposition sera élevé compte tenu de leurs différentes idéologies et bailleurs de fonds étrangers."
 CIA_SOM.6.desc:0 "Alors que le régime de Siad Barre a eu du mal depuis l'échec de la guerre initiale d'Ogaden, un soutien américain lourd depuis le début de la décennie a inversé la fortune de son gouvernement. Alors que l'Éthiopie continue de se détériorer en une guerre civile multi-voies, la Somalie a lancé une invasion renouvelée de l'Éthiopie pour saisir le territoire contesté d'Ogaden. Plus tôt dans la journée, le département d'État a annoncé que l'Amérique soutenait pleinement l'invasion et a décrit cette décision comme une campagne pour libérer la population somalienne de l'Éthiopie d'un régime communiste oppressif. D'autres sources ont également indiqué une aide militaire américaine supplémentaire supplémentaire à Mogadiscio pour aider probablement à la guerre en cours. Le temps nous dira si cette invasion pourra réussir et si elle peut restaurer la foi du public dans le régime de Barre.\n\nDans des nouvelles connexes, La Havane et Moscou ont dénoncé le déménagement comme une autre saisie des terres impérialistes en Afrique et ont promis leur soutien à l'Éthiopie."
 CIA_SOM.9.desc:0 "Le début de la guerre d'Ogaden dans les années 1970 a conduit au réalignement de la Somalie loin de Moscou vers Washington. Cependant, la situation en Somalie s'est rapidement détériorée dans les années qui ont suivi la guerre d'Ogaden avec un mécontentement généralisé et des tensions basées sur les clans éclater dans tout le pays, en particulier dans le nord de la Somalie. Plus tôt dans la journée, le président [USA.GetLeader] a annoncé un nouveau changement de politique qui réduirait le soutien au gouvernement somalien et transmettrait le soutien au mouvement national somalien (SNM). En particulier, le président a noté qu'un moteur majeur de cette décision a été la récente décision des régimes de la barre vers le génocide de la population Isaaq et l'encouragement de violations flagrantes des droits de l'homme dans toute la Somalie. En outre, le président a salué l'engagement du Mouvement national somalien envers l'anticommunisme et a comparé le mouvement positivement aux Mujahideen luttant contre l'occupation soviétique de l'Afghanistan. Cette décision a été généralement reçue positivement par la communauté internationale, compte tenu de la détérioration des relations entre la Somalie et la plupart des nations, à l'exception principale de la Libye."
 CIA_SOM.16.desc:0 "Au cours d'une interview avec 60 minutes diffusée dimanche soir sur CBS, le président [USA.GetLeader] a annoncé le soutien de l'intervention américaine dans le conflit en cours en Somalie. [USA.GetLeader] a fait valoir que si les États-Unis avaient dans le passé soutenaient le gouvernement somalien actuel que leurs actions récentes, en particulier leur génocide continu du peuple isaaq, sont au-delà du pâle et doivent être arrêtés. De plus, le président a fait valoir que le mouvement national somalien, la principale faction d'opposition, établirait un gouvernement anti-communiste approprié en Somalie qui serait un bastion de la liberté dans une région assaillie par le communisme et le chaos. La réponse à l'annonce a été mitigée à positive. Les partisans du président ont souligné que l'établissement d'un gouvernement pro-américain dans la corne de l'Afrique pourrait être une aubaine pour les intérêts américains de l'autre côté, les critiques ont allégué que l'envahissement de la Somalie pourrait rapidement se transformer en débâcle compte tenu de l'état actuel de la nation."
 CIA_SOM.18.desc:0 "Après un débat important au Congrès et au ministère de la Défense, les États-Unis ont officiellement commencé une intervention armée en Somalie. L'objectif indiqué de l'opération est multiple. Le premier objectif est de renverser le gouvernement à Mogadiscio et d'établir le contrôle des zones urbaines de base dans le sud de la Somalie ainsi que la coordination avec le mouvement national somalien (SNM) dans le nord de la Somalie. Le deuxième objectif est de maîtriser les différentes factions armées à travers le pays et d'établir un gouvernement de coalition dirigé par le SNM avant les élections futures. Déjà, les forces américaines sont arrivées dans le nord de la Somalie dans des territoires détenus par le SNM et sont assiégés à Mogadiscio dans une opération amphibie majeure. Cela dit, la taille et la nature fragmentée de la Somalie en feront sûrement une tâche intimidante et difficile. Le temps nous dira s'il s'agit d'un tournant dans la nation africaine assiégée ou une autre étape dans la fragmentation permanente de la Somalie."
 CIA_SOM.23.desc:0 "Au cours de la dernière décennie, la situation en Somalie s'est rapidement détériorée. L'un des aspects clés de la situation en cours est le génocide des régimes de barre du clan isaaq. Pour cette raison et une myriade d'autres raisons, des représentants des clans Isaaq, Dhulbahante, Issa, Gadabursi, Warsangali, ainsi que le mouvement national somalien ont établi un Somaliland indépendant comprenant les territoires de l'ancien protectorat du Somaliland. Le Département d'État américain a publié une déclaration décrivant que l'Amérique reconnaîtrait maintenant l'indépendance du Somaliland et chercherait à établir des liens avec Hargeisa. Cette décision a été vivement critiquée par le gouvernement à Mogadiscio ainsi que par le chef libyen [LBA.GetLeader]. Cette décision consacre efficacement ce qui était déjà évident pour beaucoup, que l'idée d'un grand Somalie unie et encore moins d'une Somalie unifiée est maintenant morte dans l'eau."
 CIA_SOM.24.desc:0 "Alors que la situation en Somalie continue de se détériorer, les appels internationaux à une intervention empêchent le génocide continu des personnes Isaaq ont augmenté. Lors d'une réunion au Conseil de sécurité des Nations Unies (USC), l'ambassadeur des États-Unis auprès des Nations Unies a proposé que la nation unie devrait intervenir en Somalie pour établir un gouvernement temporaire avant les élections. Aucune opposition sérieuse n'a été soumise à la proposition, mais de nombreux défis pratiques restent à la proposition. En particulier, alors que la situation en Somalie continue de détériorer davantage de factions armées continuent d'émerger alors que l'autorité centrale se décompose aux frontières politiques et tribales. Des préoccupations ont également été soulevées sur la façon dont une telle intervention affectera la stabilité régionale, en particulier avec la guerre civile déjà en cours et la crise humanitaire en Éthiopie voisine. Cela dit, sans intervention internationale, l'avenir de la Somalie semble pour le moins désastreux."
 CIA_ANG.0.desc:0 "De tous les conflits en cours en Afrique, la guerre civile angolaise est peut-être le conflit le plus notable et stratégiquement important. Après le retrait du Portugal de leurs colonies outre-mer, les factions en guerre concurrentes en Angola se sont rapidement tournées les unes sur les autres, suivant un schéma similaire tout au long de la guerre d'indépendance. Après une brève lutte dans la capitale, le communiste, le mouvement populaire pour la libération de l'Angola (MPLA) a réussi à prendre le contrôle de la capitale de Luanda, conduisant à une intervention cubaine majeure dans le conflit pour préserver le nouveau gouvernement central communiste. Notre principal proxy dans ce conflit Prior avait été le Front national de la libération de l'Angola (FNLA), malheureusement, la FNLA a largement cessé d'exister en dehors du zaire étant donné plusieurs revers et problèmes de corruption majeurs liés au gouvernement zaïen. Cela dit, l'Union nationale de Jonas Savimbi pour l'indépendance totale de l'Angola (UNITA) a rejeté leur position maoïste antérieure et est devenu un chouchou du droit mondial. Malheureusement, le Congrès a bloqué nos efforts pour armer Savimbi avec le passage de l'amendement Clark. Avant une discussion plus approfondie sur la question de l'Angola, l'administration doit décider de pousser ou non le Congrès pour abroger l'amendement Clark, ou simplement accepter la volonté des électeurs est reflété par le Congrès dans leur restriction de l'aide."
 CIA_ANG.1.desc:0 "Après plusieurs conversations entre le président et le directeur de l'Agence centrale du renseignement, le président a décidé de respecter les termes de l'amendement Clark. S'il est regrettable que nous ne pourrions pas fournir un soutien aux rebelles anticommunistes en Angola, le respect de l'amendement Clark est finalement la loi et nous n'avons pas le capital politique nécessaire pour faire bouger le Congrès dans leur opposition à l'abrogation de l'amendement. Pourtant, cela est plutôt malheureux et notre manque de soutien aux guérilleros anticommunistes sera considéré comme une insulte aux organisations anticommunistes et aux groupes de défense et potentiellement comme un signe de faiblesse de Moscou. Plusieurs représentants des entreprises ont également exprimé leur mécontentement à l'égard de cette décision étant donné les vastes ressources naturelles présentes en Angola. D'un autre côté, le grand public était et est toujours contre la participation au conflit en Angola et notre pivot dans les affaires économiques jouera probablement bien avec l'électeur médian."
 CIA_ANG.2.desc:0 "Après avoir consulté les alliés du Congrès, le président a décidé de faire pression pour une abrogation complète de l'amendement Clark. Ce sera une entreprise difficile compte tenu de l'opposition générale à nos plans pour l'Angola et le malaise général de l'Amérique compte tenu de nos récentes mésaventures de politique étrangère. Pourtant, la lutte contre le communisme en Angola est essentielle à nos intérêts à long terme en Afrique est essentiel pour endiguer la marée du communisme en Afrique ainsi que pour protéger une autre source potentielle d'huile et d'autres matières premières importantes. Le chef d'état-major et d'autres conseillers politiques clés seront déployés à Capitol Hill pour négocier avec les principaux législateurs pour faire avancer nos plans, mais nous devrons probablement offrir des concessions politiques pour accéder à cette question.\n\nSi malgré nos meilleurs efforts, le Congrès refuse de bouger, nous devrons déterminer s'il sera ou non le temps d'abandonner nos efforts angolais ou de chercher des moyens de contourner l'interdiction du Congrès de fournir de l'aide."
 CIA_ANG.3.desc:0 "Dans une touche surprenante de l'intrigue du Congrès, une législation visant à abroger l'amendement Clark a été adoptée par les deux chambres du Congrès et apparaîtra sur le bureau du président. Avec cette adoption, notre administration n'est plus empêchée d'utiliser ouvertement des fonds pour renforcer nos alliés en Angola et a maintenant une gamme d'options beaucoup plus large pour fournir à l'Union nationale de Jonas Savimbi pour l'indépendance totale de l'Angola (UNITA). Il s'agit d'une victoire politique majeure pour l'administration, l'abrogation de l'amendement Clark a été prédite comme étant morte à l'arrivée par les médias et les analystes politiques. Maintenant, avec l'élan de notre côté, nous devons considérer les objectifs stratégiques à long terme en Angola et comment nous prévoyons de les accomplir afin que nous puissions les vendre au public américain avant des actions plus drastiques."
 CIA_ANG.4.desc:0 "Sans surprise, nos efforts pour abroger l'amendement Clark n'ont pas porté de fruits et ont été un échec total. Comme indiqué lors de la réunion précédente, il y avait des préoccupations importantes quant à savoir si le président avait ou non suffisamment de balancement politique pour faire bouger le Congrès sur cette question. Maintenant qu'il est devenu évident que le Congrès n'abrogera pas l'amendement Clark, l'administration doit décider de la ligne de conduite à prendre ensuite. Il reste deux options, la première option serait de respecter les souhaits du Congrès et de rester à l'écart du conflit en cours en Angola. Cependant, cela serait préjudiciable à nos objectifs stratégiques en Afrique et pourrait mettre en danger la sécurité de nos autres alliés régionaux, et concéderait les ressources naturelles de l'Angola aux communistes. Une autre solution qui a été proposée consiste à rediriger le financement discrétionnaire dans le budget pour financer nos opérations angolaises. Cela nous permettrait de fournir une aide aux forces anti-communistes en Angola, mais est au mieux légalement douteuse. Comment devons-nous procéder?"
 CIA_ANG.5.desc:0 "Bien que malheureux, le Congrès a clairement décrit leur opposition à notre désir de soutenir les combattants anti-communistes en Angola. Nous pourrions rechercher des moyens alternatifs pour contourner le Congrès, mais après un long débat au sein du Conseil de sécurité nationale et des arguments par le conseil de la Maison Blanche, la décision a été prise de respecter simplement le Congrès et de stopper nos efforts en Angola. Ce sera tout à fait la décision controversée et mettra grandement en colère les rétrilismeurs dans et hors de l'administration. Cela est particulièrement vrai pour la Fondation patrimoniale et d'autres groupes de réflexion connexes et leurs politiciens et experts associés. La principale préoccupation conduisant le président à cette décision a été l’avis de l’avocat selon lequel le congrès serait sûrement une infraction impéchiable et ternirait l'héritage du président. Il y a eu des discussions plus approfondies sur la demande à d'autres partenaires de sécurité régionaux pour accroître leur soutien à la cause anti-communiste en Angola, mais il est peu probable qu'un État puisse égaler notre financement et notre soutien."
 CIA_ANG.6.desc:0 "Il existe plusieurs options stratégiques à considérer en Angola. D'une part, le communisme complètement en arrière d'Angola serait idéal, mais cela sera une entreprise coûteuse et difficile. Alternativement, la grande majorité de l'huile en Angola est située dans l'enclave de Cabinda qui a un mouvement séparatiste actif déjà soutenu par la France et éventuellement le zaire. Pour résumer, nous avons trois principaux cours d'actions à considérer. Notre plan d'action antérieur avant le passage de l'amendement Clark était de fournir des armes et d'autres formes de soutien à l'Union nationale de Jonas Savimbi pour l'indépendance totale de l'Angola (UNITA) mais évitez de mettre des bottes américaines sur le terrain. Une deuxième option possible si nous avons obtenu un soutien au Congrès consisterait à s'engager efficacement dans une intervention armée en Angola pour protéger l'huile en Angola. Cela pourrait être fait à titre limité, en limitant nos actions à l'enclave riche en pétrole de Cabinda, ou en cherchant à chasser le communisme de l'Angola entièrement avec le soutien de nos alliés régionaux. Quoi qu'il en soit, notre prochaine étape alors que nous continuons à délibérer notre cours des actions est de contacter à la fois UNITA et le front pour la libération de l'enclave de Cabinda (FLEC) ainsi que nos autres partenaires stratégiques impliqués dans la région."
 CIA_ANG.7.desc:0 "Après un débat fougueux sur les propositions concurrentes au sein du Conseil de sécurité nationale, la décision a été prise de viser à protéger le pétrole en Angola pour se concentrer sur le changement de régime. Avec cette décision prise, nous devrons décider de limiter ou non nos actions à Cabinda ou de demander la suppression totale de l'influence communiste de l'Angola. Ces deux options ont des coûts et des avantages majeurs. L'option Cabinda serait l'itinéraire la plus simple, les forces communistes ne sont pas fortement ancrées dans la population générale et la faible densité de population et la majorité de l'huile angolaise dans cette enclave en feraient une cible mûre. Cependant, cette décision montrerait clairement que nous avons plus envie de contrôler l'huile de l'Angola, alors nous faisons réellement le communisme. D'un autre côté, s'engager dans une intervention pour renverser entièrement le gouvernement communiste serait un engagement majeur et couvre le risque que le conflit se transforme en un autre bourbier du Vietnam."
 CIA_ANG.8.desc:0 "L’Union nationale de Jonas Savimbi pour l’indépendance totale de l’Angola (UNITA) est devenue la principale opposition au gouvernement communiste qui a émergé du chaos du retrait portugais de l’Angola. Nous avons demandé à nos contacts avec Savimbi de demander l’opinion de Savimbi sur la meilleure façon d’aller de l’avant avec nos plans pour renverser les communistes résidant à Luanda. L'administration appuyée vers l'intervention armée en Angola, il est essentiel de garantir la coopération complète de Savimbi pour nous assurer que nous avons une position stable et une organisation capable d'établir rapidement un nouveau gouvernement crédible pour restaurer la stabilité à l'Angola. Quoi qu'il en soit, nos contacts nous ont assuré que Savimbi réagira positivement à cette évolution et soutiendra avec enthousiasme une intervention américaine en Angola et sera probablement ouverte à la réalisation économique majeure dans un Angola post-communiste en échange de l'intervention."
 CIA_ANG.9.desc:0 "Après avoir utilisé nos contacts au sein des services de sécurité français, nos agents ont réussi à entrer en contact avec la direction du front pour la libération de l'enclave de Cabinda (FLEC). Henrique N'Zita Tiago, le chef de facto de FLEC a été controversé dans le mouvement sécessionniste en raison de sa position dure de prendre une opposition armée contre le gouvernement communiste. Bien que controversé parmi le mouvement, ses objectifs s'alignent parfaitement avec nos intérêts et sont également soutenus par le gouvernement français et les sociétés. Dans les prochains jours, nos agents de la région chercheront à aborder Tiago avec l'aide de nos amis au Zaïre et en France et procéderont à déterminer si FLEC est la meilleure option pour ce plan d'action et leur volonté de coopérer avec notre gouvernement en termes d'action militaire et d'établissement de l'influence américaine dans le Cabinda après la création de l'indépendance."
 CIA_ANG.10.desc:0 "Outre l'Afrique du Sud, notre autre partenaire régional clé est Zaïre. Zaïre a des allégations historiques sur Cabinda et accueillerait probablement tous les efforts pour se débarrasser de Cabinda d'Angola. Cependant, Zaïre peut par la suite désirer des Cabinda dans sa sphère d'orbite ou même annexer le territoire. Quoi qu'il en soit, Zaïre participera à l'un ou l'autre des routes que nous décidons finalement de voir que nous gardons actuellement le gouvernement actuel à flot et fournissant à leur armée presque toutes leurs armes. La principale préoccupation présentée au sein du Conseil de sécurité nationale est que le Zaïre s'engage dans cette action que le gouvernement doublera probablement son opposition aux réformes qui pourraient davantage mettre en danger la stabilité interne du Zaïre. Quoi qu'il en soit, la décision est entre les mains du gouvernement zarien maintenant."
 CIA_ANG.11.desc:0 "L'ambassadeur américain a relayé une proposition pour nous de collaborer sur le renforcement du front pour la libération de l'enclave de Cabinda (FLEC). Nous avons longtemps cherché à amener Cabinda sur notre orbite, mais nous devons nous demander si nous sommes capables de mener une telle action sans mettre en danger notre propre stabilité interne et risquer d'éloigner les troupes de la frontière angolaise compte tenu des efforts passés pour envahir notre propre nation à travers ladite frontière. Cependant, dans toute réalité, nous n'avons pas d'autre choix que d'accepter la proposition américaine, la survie de notre propre régime est intrinsèquement liée à Washington, rejetant les propositions américaines de cette échelle conduira sûrement à des ramifications en termes de soutien économique et militaire à notre propre gouvernement. Pourtant, même avec cette simple illusion de choix, prendre Cabinda aux communistes priver les communistes de contrôler les vastes réserves de pétrole situées là-bas et nous pourrions un jour tenter de faire affirmer notre propre contrôle sur Cabinda."
 CIA_ANG.12.desc:0 "L'ambassadeur américain a relayé une proposition pour nous de collaborer sur le renforcement du front pour la libération de l'enclave de Cabinda (FLEC). Nous avons longtemps cherché à soutenir FLEC et la cause de l'indépendance du cabindan. Les vastes réserves de pétrole de Cabinda pourraient être une manne massive si nous sommes en mesure d'obtenir des droits pour que nos sociétés développent des projets pétroliers. Maintenant, Washington cherche à faire de même et nous a offert des conditions pour nous de collaborer pour soutenir l'indépendance de Cabindan. Les Américains ont signalé leur ouverture à la séparation des droits pétroliers pour les conglomérats français et américains, cela concéderait toujours à l'effet à l'effet de Cabinda à Washington. De plus, les Américains proposent une intervention militaire ouverte dans Cabinda, une décision qui serait sûrement impopulaire et controversée parmi une bande de l'électorat. Comment devons-nous procéder?"
 CIA_ANG.13.desc:0 "Le gouvernement français a répondu positivement à notre plan pour poursuivre un cabinda indépendant. Étant donné que la France fournissait déjà un soutien limité aux séparatistes de la région, cette approbation ne surprend pas. Leur volonté de s'aligner sur nos objectifs indique un renforcement de notre partenariat et un engagement commun à promouvoir l'autodétermination pour les habitants de Cabinda.\n\nCette collaboration nous offre une occasion précieuse d'améliorer nos efforts dans la région, en tirant parti des ressources françaises et de l'influence pour renforcer le mouvement séparatiste. Avec la France à bord, nous pouvons étendre nos initiatives, notamment le soutien militaire, le plaidoyer diplomatique et l'aide humanitaire, pour assurer le succès du mouvement de l'indépendance.\n\nNous devons prendre cet élan pour engager davantage d’autres alliés potentiels, encadrant la quête de l’indépendance de Cabinda en tant que lutte locale, mais aussi comme une question vitale de la stabilité régionale. En solidifiant le soutien international, nous pouvons renforcer notre position et augmenter la pression sur la MPLA, ouvrant la voie à un résultat réussi à Cabinda."
 CIA_ANG.14.desc:0 "Étonnamment, le gouvernement français a refusé notre proposition de coopérer dans le renforcement des forces sécessionnistes de Cabinda. Cette décision est décourageante, en particulier compte tenu de l'importance stratégique de la cabinda dans nos efforts pour contrer la MPLA et renforcer notre position dans la région.\n\nLe refus de la France de s'engager soulève des questions sur leur engagement à soutenir les mouvements de libération en Afrique et peut indiquer le désir de maintenir une position neutre au milieu du conflit en cours. Leur retrait de ce partenariat potentiel limite nos options et complique notre stratégie à Cabinda, où le soutien local est crucial pour toute initiative réussie.\n\nÀ la lumière de ce revers, nous devons réévaluer notre approche et explorer des avenues alternatives pour le soutien. S'engager avec d'autres alliés potentiels et réévaluer nos ressources sera essentiel pour s'assurer que les forces sécessionnistes restent viables. Nous devons également travailler pour communiquer l'importance de l'autonomie de Cabinda à la communauté internationale, en la traduisant comme une question vitale de l'autodétermination qui mérite l'attention et le soutien."
 CIA_ANG.15.desc:0 "L'ambassadeur américain a transmis une proposition importante concernant la guerre civile en cours en Angola. Les États-Unis sont impatients de coordonner les efforts avec notre gouvernement pour lutter contre l'influence croissante des forces communistes dans le pays et renforcer la position militaire et politique de Jonas Savimbi et sa faction, l'Union nationale pour l'indépendance totale de l'Angola (UNITA).\n\nCette initiative met en évidence la nécessité d'une stratégie unifiée qui aligne nos ressources et notre intelligence pour contrer efficacement la MPLA et ses alliés. En soutenant l'UNITA, nous pouvons aider à établir un front plus fort contre l'approche communiste à nos frontières, favorisant un équilibre de pouvoir plus favorable dans la région.\n\nLa proposition décrit également un cadre de dialogue et d’assistance en cours, notamment la formation militaire et le soutien logistique aux forces de Savimbi. Prendre des mesures décisives maintenant pourrait non seulement aider à contrecarrer le communisme en Angola, mais aussi ouvrir la voie à un avenir plus stable et démocratique pour le peuple angolais."
 CIA_ANG.16.desc:0 "Notre ambassadeur en Afrique du Sud a rapporté que Pretoria avait accepté de collaborer sur nos plans pour coordonner les actions en Angola. Ce partenariat est une évolution importante, car elle souligne un engagement commun à contrer l'influence des forces communistes dans la région.\n\nEn alignant nos stratégies, nous pouvons renforcer nos efforts pour soutenir Jonas Savimbi et sa faction, l'Union nationale pour l'indépendance totale de l'Angola (UNITA). Cette collaboration nous permettra de mettre en commun les ressources et l'intelligence, améliorant notre efficacité opérationnelle sur le terrain.\n\nLa participation de l’Afrique du Sud est cruciale pour établir un front uni contre la MPLA et ses alliés. Ensemble, nous pouvons mettre en œuvre une approche globale qui non seulement renforce les efforts militaires mais jette également les bases de la stabilité politique en Angola. Cette alliance représente une étape critique vers la réalisation d'un avenir plus sûr et démocratique pour le peuple angolais, alignant nos intérêts mutuels dans la sécurité et la stabilité régionales."
 CIA_ANG.17.desc:0 "Notre ambassadeur en Afrique du Sud a communiqué que Pretoria a poliment refusé notre offre d'aide aux opérations en Angola. Cette réponse indique une approche prudente de leur part, reflétant leurs propres priorités stratégiques et préoccupations concernant l'implication dans le conflit en cours.\n\nBien que cette décision soit décevante, elle met en évidence les complexités de la situation dans la région. L'Afrique du Sud peut peser les risques potentiels associés à un engagement plus profond en Angola, en particulier à la lumière de la guerre civile en cours et de l'équilibre délicat des pouvoirs.\n\nÀ l'avenir, nous devrons réévaluer notre stratégie et explorer d'autres voies de soutien. Cela peut impliquer le renforcement de nos propres efforts pour renforcer les Jonas Savimbi et Unita indépendamment ou la recherche de partenariats avec d'autres nations qui partagent nos objectifs. Le maintien de lignes de communication ouvertes avec l'Afrique du Sud reste cruciale, car leur perspective et leur influence dans la région seront précieuses alors que nous naviguons dans ce paysage difficile."
 CIA_ANG.18.desc:0 "Les diverses parties actives en Angola nous ont offert une opportunité unique au milieu du chaos du conflit. Reconnaissant la nécessité d'un soutien aérien efficace, nous avons mobilisé nos fidèles pilotes en exil cubain pour mener des opérations de bombardement à partir de bases aériennes en zaïre. Cette initiative améliore non seulement notre capacité à combattre les communistes en Angola, mais nous positionne stratégiquement pour influencer le résultat du conflit.\n\nEn utilisant ces pilotes qualifiés, nous pouvons livrer des frappes aériennes ciblées contre les forces MPLA, soutenant ainsi nos alliés, y compris l'unité de Jonas Savimbi. Cette approche nous permet de maintenir le déni plausible tout en augmentant simultanément la pression sur les factions communistes.\n\nDe plus, ces opérations servent à mettre en valeur notre engagement à lutter contre le communisme dans la région, ce qui a potentiellement réduit le soutien des alliés locaux et internationaux. Alors que nous continuons à naviguer dans ce paysage complexe, le moteur de cette opportunité sera crucial pour façonner l'avenir de l'Angola et renforcer nos intérêts stratégiques en Afrique australe."
 CIA_ANG.19.desc:0 "Récemment, il est révélé que plusieurs frappes aériennes ayant un impact sur nos forces sur les fronts et les pôles de logistique critiques ont probablement été menés par la Central Intelligence Agency (CIA), en utilisant des sociétés écrans opérant à partir de Zaïre. Cette révélation souligne les durées auxquelles les forces externes sont prêtes à aller saper notre gouvernement et à perturber nos opérations.\n\nCes actions secrètes compromettent non seulement la sécurité de nos troupes, mais menacent également la stabilité que nous nous efforçons de maintenir en Angola. L'implication de la CIA met en évidence la lutte géopolitique plus large en jeu, alors que les pouvoirs impérialistes cherchent à imposer leur volonté à notre souveraineté et à dérailler nos efforts révolutionnaires.\n\nAlors que nous évaluons les implications de ces frappes aériennes, il est essentiel de fortifier nos défenses et d'améliorer nos mesures de contre-espionnage. Nous devons également travailler pour exposer ces tactiques à la communauté internationale, les encadrant comme des violations de la souveraineté et un mépris flagrant des principes de l'autodétermination. Ce faisant, nous pouvons rallier notre cause à notre cause et renforcer notre engagement à résister à l'agression externe."
 CIA_ANG.20.desc:0 "Dans nos tentatives de renforcer les forces anti-communistes en Angola, l'une des nations les plus cruciales impliquées est l'Afrique du Sud. Compte tenu de sa proximité géographique et de ses liens historiques avec la région, l'Afrique du Sud joue un rôle central dans le soutien de l'Union nationale pour l'indépendance totale de l'Angola (UNITA) et d'autres factions s'opposant à la MPLA.\n\nLes capacités militaires et logistiques de l'Afrique du Sud peuvent améliorer considérablement l'efficacité de nos efforts. La collaboration avec les forces sud-africaines permet des opérations coordonnées qui peuvent mieux perturber les lignes d'approvisionnement du MPLA et renforcer la résolution des groupes anti-communistes locaux. De plus, la participation de l'Afrique du Sud apporte de la crédibilité à notre cause, présentant un front uni contre l'expansion communiste en Afrique australe.\n\nCependant, nous devons également être conscients des préoccupations liées à l'apartheid qui accompagnent notre partenariat. Les politiques intérieures de l'Afrique du Sud et son traitement de sa propre population noire pourraient provoquer des contrecoups à la maison et à l'étranger. Soutenir un programme anticommuniste pourrait inadvertoir les critiques envers notre implication dans un régime qui est souvent considéré comme oppressant. Naviguer ces préoccupations est essentiel pour maintenir notre crédibilité et nous assurer que nos actions en Angola ne ternissent pas par inadvertance notre réputation sur la scène mondiale.\n\nEn fin de compte, le renforcement de notre alliance avec l'Afrique du Sud est essentiel pour faire progresser avec succès nos objectifs anticommunistes en Angola. En favorisant cette coopération, nous pouvons augmenter notre impact dans la région et travailler vers un avenir plus stable et démocratique pour l'Angola tout en étant conscient des implications plus larges de notre partenariat."
 CIA_ANG.21.desc:0 "L'ambassadeur américain a relayé une missive de Washington, exprimant le désir des États-Unis pour nous de lancer une intervention reprise au sol en Angola pour lutter contre les forces communistes présentes. Cette demande fait penser à notre implication précédente dans l'opération Savannah, où nous avons cherché à contrer l'influence de la MPLA, mais nous avons été confrontés à des défis importants et à des résultats mitigés.\n\nTout en soutenant les efforts des États-Unis contre le communisme pourrait renforcer notre alliance et améliorer notre influence régionale, nous devons soigneusement examiner les implications d'une campagne militaire renouvelée. L'opération Savannah nous a appris de précieuses leçons sur les complexités de l'intervention, notamment les risques de conflit prolongé et les réactions potentielles des populations locales et des pays voisins.\n\nDe plus, le climat politique à la maison doit être pris en compte dans notre décision. Le soutien public aux interventions militaires peut fluctuer et nous devons nous assurer que nos actions résonnent avec les préoccupations et les aspirations de nos électeurs. S'engager dans une autre opération pourrait conduire à un examen approfondi et à un débat sur nos priorités de politique étrangère.\n\nAlors que nous délibérons sur cette demande, il est crucial d'évaluer à la fois les avantages stratégiques et les répercussions potentielles d'une implication renouvelée en Angola. Notre décision devrait prioriser la stabilité et la sécurité en Afrique australe tout en apprenant les expériences de l'opération Savannah pour guider nos actions futures."
 CIA_ANG.22.desc:0 "Notre ambassadeur à Pretoria a informé le secrétaire d'État que l'Afrique du Sud avait facilement accepté nos plans d'intervention proposés en Angola. Cette réponse enthousiaste est un développement important dans nos efforts pour renforcer les forces anti-communistes de la région.\n\nL’engagement de l’Afrique du Sud envers nos plans d’intervention améliore non seulement nos capacités militaires, mais renforce également notre alliance stratégique. Leur soutien nous fournira des ressources logistiques critiques et des renseignements locaux, ce qui rend nos opérations plus efficaces pour contrer la MPLA et ses alliés cubains.\n\nDe plus, cette collaboration signale un front uni contre le communisme, potentiellement galvaniser d'autres partenaires régionaux pour rejoindre notre cause. Cependant, nous devons rester conscients des implications nationales de notre partenariat avec l'Afrique du Sud, en particulier en ce qui concerne ses politiques d'apartheid, car cela pourrait attirer un examen international.\n\nDans l'ensemble, cet accord jette une base solide pour notre intervention, nous permettant d'aller de l'avant avec une plus grande confiance et un objectif commun de stabilisation de l'Angola et de freiner l'influence communiste en Afrique australe."
 CIA_ANG.23.desc:0 "Notre ambassadeur de Pretoria a relayé au secrétaire d'État que l'Afrique du Sud a refusé à contrecœur notre offre de collaboration pour lancer une intervention en Angola. Cette réponse est décevante, car la participation de l'Afrique du Sud était considérée comme cruciale pour renforcer les efforts anti-communistes dans la région.\n\nLa réticence de Pretoria peut provenir de diverses pressions internes et externes, notamment des préoccupations concernant les retombées potentielles d'une telle intervention et de l'examen minutieux de leurs politiques intérieures. Alors que l'Afrique du Sud a historiquement soutenu les initiatives anti-communistes, les complexités du conflit angolais peuvent les avoir incitées à marcher soigneusement cette fois.\n\nCe déclin nous oblige à réévaluer notre stratégie à l'avenir. Nous devons explorer d'autres partenariats et rechercher d'autres alliés régionaux qui peuvent être disposés à soutenir nos objectifs. De plus, nous devons rester attentifs à l'évolution du paysage politique en Afrique du Sud, car les dynamiques changeantes pourraient ouvrir de nouvelles opportunités de collaboration à l'avenir.\n\nDans l'ensemble, bien que ce revers soit important, il nous présente également une chance d'adapter notre approche et de continuer à stabiliser l'Angola sans compromettre nos intérêts stratégiques plus larges."
 CIA_ANG.25.desc:0 "Les preuves ont fait surface de nos alliés locaux et de l'Afrique du Sud alléguant que Cuba a utilisé la guerre chimique pour soutenir le mouvement populaire pour la libération de l'Angola (MPLA) contre l'Union nationale anti-communiste de Jonas Savimbi pour l'indépendance totale de l'Angola (UNITA). Cette évolution offre une puissante opportunité pour nous de tirer parti de ces allégations en tant que propagande pour saper la crédibilité cubaine et MPLA sur la scène mondiale.\n\nEn mettant en évidence ces accusations, nous pouvons attirer l'attention sur les tactiques contraires à l'éthique employées par Cuba, les positionnant comme une menace non seulement pour l'Angola mais aussi sur les valeurs humanitaires. Ce récit peut galvaniser l'indignation internationale et favoriser un plus grand soutien à l'UNITA, encadrant leur lutte comme une lutte contre un régime disposé à recourir à des méthodes inhumaines.\n\nNous devons travailler largement à diffuser ces informations, en utilisant les canaux médiatiques et les avenues diplomatiques pour s'assurer qu'elle atteint les principales parties prenantes et le public. En encadrant le conflit sous ce jour, nous pouvons renforcer notre position contre l'influence communiste dans la région et le soutien de nos alliés, renforçant finalement nos objectifs géopolitiques plus larges."
 CIA_ANG.26.desc:0 "Alors que nous jetons des bases supplémentaires pour une intervention en Angola, nous émettons actuellement une demande de Cuba pour retirer ses forces pour atténuer le risque de nouvelle escalade avec l'Union soviétique. La présence en cours de troupes cubaines soutenant la MPLA pose un défi direct à nos objectifs stratégiques et augmente le potentiel de confrontation directe.\n\nPour assurer l'efficacité de cette demande, nous devons adopter une stratégie complète qui combine la pression diplomatique et les incitations économiques. S'engager avec les alliés et les pays qui tiennent le balancement sur Cuba seront essentiels pour renforcer notre position. Nous pouvons également tirer parti des plateformes internationales pour souligner les implications de l’implication de Cuba, une examen approfondi et la promotion de l’isolement diplomatique.\n\nDe plus, nous devons envisager de mettre en œuvre des mesures économiques, telles que des sanctions ciblées, qui pourraient avoir un impact sur les intérêts de Cuba et encourager la conformité à notre demande. En encadrant leur présence militaire en Angola comme une menace pour la stabilité régionale, nous pouvons renforcer notre cas pour leur retrait et réduire la probabilité d'un conflit plus large avec les forces soviétiques. Agir rapidement et de manière décisive est essentiel pour protéger nos intérêts stratégiques en Afrique australe."
 CIA_ANG.27.desc:0 "Le gouvernement américain a publié une déclaration publique exigeant notre retrait inconditionnel de l'Angola. Cette demande agressive nous place à un carrefour critique. Nous devons peser soigneusement nos options, compte tenu de la fois des implications de la conformité et des conséquences potentielles du défi.\n\nD'une part, l'acquisition de cette demande pourrait entraîner un retrait d'une région où nous avons investi des ressources importantes et un soutien à la MPLA. Cela signalerait à nos alliés que nous sommes facilement influencés par des pressions externes, sapant notre crédibilité et notre influence dans la région.\n\nD'un autre côté, le maintien de notre présence en Angola réaffirme notre engagement à soutenir le gouvernement légitime confronté à l'agression. Il nous permet de poursuivre nos efforts pour contrer l'influence américaine et maintenir les principes de la souveraineté et de l'autodétermination.\n\nEn fin de compte, nous devons décider de nous tenir ferme contre cette pression ou de rechercher une solution diplomatique qui protége nos intérêts tout en répondant aux préoccupations de la communauté internationale. Ce choix définira notre rôle en Angola et façonnera nos relations futures dans la région."
 CIA_ANG.28.desc:0 "Excellente nouvelle: les forces cubaines ont commencé un retrait général de l'Angola. Ce développement marque un tournant important dans le conflit et ouvre de nouvelles possibilités pour stabiliser la région. Le retrait témoigne de l'efficacité de nos efforts diplomatiques et de la pression de montage que nous avons exercée publiquement et en privé.\n\nAvec les troupes cubaines en retraite, nous pouvons nous attendre à un changement de balance des puissances qui pourrait favoriser l'opposition du MPLA. Cela crée une opportunité pour nous d'améliorer notre soutien aux forces locales, en particulier l'unité de Jonas Savimbi, et de consolider nos intérêts stratégiques en Angola.\n\nNous devons capitaliser sur cette élan en coordonnant avec nos alliés et en veillant à ce que nos ressources soient alignées pour maximiser l'impact de ce changement. À mesure que nous allons de l'avant, il sera crucial de surveiller de près la situation et d'adapter nos stratégies pour maintenir la stabilité et empêcher toute résurgence des conflits. Ce retrait pourrait être la première étape vers un avenir plus pacifique et démocratique pour l'Angola."
 CIA_ANG.29.desc:0 "Malgré nos demandes publiques et privées, ainsi que des menaces, La Havane est restée provocante dans son refus de retirer ses troupes de l'Angola. Cette position inébranlable complique non seulement nos objectifs stratégiques mais augmente également les tensions dans la région.\n\nLa présence militaire continue de Cuba sert de défi direct à notre influence et sape nos efforts pour soutenir l'opposition du MPLA. Leur refus de se conformer révèle un mépris pour la pression internationale croissante et met en évidence leur engagement à maintenir un pied en Angola.\n\nEn réponse, nous devons réévaluer nos tactiques. L'intensification des efforts diplomatiques avec les alliés et le tirage de sanctions économiques peuvent être nécessaires pour contraindre un changement dans la position de Cuba. De plus, nous devons nous concentrer sur le soutien international à isoler la Havane, encadrant leurs actions en violation de la souveraineté angolaise. Ce défi ne peut pas être incontesté et une réponse unifiée sera cruciale pour protéger nos intérêts et promouvoir la stabilité dans la région."
 CIA_ANG.33.desc:0 "Le moment est venu de lancer l'opération Angolan Freedom. Nos forces ont été stratégiquement positionnées aux côtés de nos partenaires régionaux pour initier une poussée concertée pour saisir Luanda et d'autres zones côtières critiques. Cette opération est conçue pour porter un coup décisif au mouvement du peuple communiste pour la libération de l'Angola (MPLA) et pour renforcer nos alliés dans l'Union nationale de Jonas Savimbi pour l'indépendance totale de l'Angola (UNITA).\n\nAlors que nous entamons cette mission, il est essentiel de reconnaître les enjeux impliqués. La sécurisation de Luanda perturbera non seulement la structure de commande du MPLA, mais autonomisera également UNITA, ce qui leur donne l'élan nécessaire pour galvaniser le soutien parmi la population angolaise. Nos efforts coordonnés visent à créer un front unifié contre le communisme, renforçant notre engagement envers la démocratie et la stabilité dans la région.\n\nAu niveau national, le lancement de cette opération nécessitera une communication claire au public américain et au Congrès sur nos objectifs et l'importance de cette intervention. L'exécution avec succès de l'opération Angolan Freedom peut servir à renforcer notre position en Afrique australe et affirmer notre rôle de leader dans la lutte mondiale contre le communisme. À mesure que nous progressons, une planification et une exécution soigneuses seront cruciales pour atteindre nos objectifs et assurer un avenir meilleur pour l'Angola."
 CIA_ANG.35.desc:0 "Lorsque les Américains ont menacé d'envahir l'Angola et ont exigé notre retrait, nous avons conclu qu'il s'agissait simplement d'un bluff visant à nous forcer à abandonner notre soutien à la MPLA. Malheureusement, nous nous sommes trompés; Le lancement de \"l'opération Angolan Freedom\" a prouvé que leur détermination est authentique.\n\nCette intervention militaire est une escalade importante qui menace directement non seulement notre présence en Angola mais aussi la souveraineté du peuple angolais. Les États-Unis tentent d'inverser les gains que nous avons réalisés pour soutenir la MPLA, et il est crucial que nous répondions de manière décisive.\n\nNous devons rallier nos alliés et renforcer notre soutien au gouvernement angolais pour contrer cette agression. Les enjeux sont élevés; Le défaut d'agir pourrait encourager de nouvelles interventions américaines dans la région et compromettre nos efforts pour maintenir les mouvements révolutionnaires. Ce moment exige l'unité et la détermination alors que nous défendons l'Angola contre les forces impérialistes externes cherchant à imposer leur volonté."
 CIA_ANG.36.desc:0 "Notre effort en Angola s'est rapidement transformé en un échec embarrassant, mettant en évidence les défis de notre intervention. Malgré nos attentes initiales, nous n'avons pas réussi à déplacer le mouvement du peuple communiste pour la libération du gouvernement angola (MPLA), qui continue de maintenir son emprise sur le pouvoir.\n\nL'incapacité à atteindre nos objectifs stratégiques a non seulement diminué notre crédibilité dans la région, mais a également soulevé de sérieuses questions sur notre approche du conflit. La résilience du MPLA face à nos efforts lui a permis de se regrouper et de contrer efficacement nos avancées, compliquant davantage la situation.\n\nAu niveau national, cet échec pourrait avoir des conséquences politiques importantes. L'opinion publique devrait se déplacer contre la participation militaire continue, entraînant une pression accrue du Congrès pour reconsidérer nos stratégies de politique étrangère. Les législateurs peuvent appeler à la responsabilité, remettre en question les décisions qui ont conduit à cette intervention et exigeant la transparence concernant nos objectifs. Alors que les dirigeants politiques sont confrontés à un examen minutieux, l'administration doit faire face à ces défis avec soin pour maintenir le soutien du public et la crédibilité sur la scène internationale. En fin de compte, la nécessité d'une réponse complète et efficace n'a jamais été aussi urgente."
 CIA_ANG.37.desc:0 "L'opération Freedom a été un succès retentissant, marquant un tournant important dans le conflit en cours. La chute rapide de Luanda et d’autres zones urbaines clés a gravement paralysé la capacité du gouvernement MPLA à mobiliser ses forces et à contrer efficacement notre avance ou celle des troupes de Jonas Savimbi dans le sud de l’Angola.\n\nCette prise de contrôle rapide a non seulement perturbé le commandement et le contrôle du gouvernement, mais a également créé un aspirateur de puissance que les forces de Savimbi sont sur le point d'exploiter. L'élan obtenu de ces victoires critiques a renforcé le moral parmi nos alliés et Unita, favorisant une plus grande coopération et coordination sur le terrain.\n\nAlors que nous évaluons les implications de ce succès, il est essentiel de consolider nos gains et de garantir que la transition dans ces domaines soutient la stabilité et la gouvernance à long terme. La collaboration continue avec Savimbi et sa faction seront essentielles pour obtenir un résultat favorable et jeter les bases d'un avenir plus démocratique et prospère pour l'Angola."
 CIA_ANG.38.desc:0 "Avec le communisme vaincu en Angola, les questions difficiles commencent maintenant, en particulier sur la façon dont nous devons aider à la reconstruction du pays. Alors que la victoire contre la MPLA marque une étape importante, la voie à suivre nécessite une attention particulière et une planification stratégique pour assurer une reprise durable.\n\nL'un des principaux défis sera de déterminer les meilleures méthodes pour fournir une assistance, que ce soit par l'aide financière, la reconstruction des infrastructures ou le soutien des réformes de gouvernance. S'engager avec les dirigeants locaux et les communautés sera crucial pour comprendre leurs besoins et garantir que nos efforts sont à la fois efficaces et accueillis.\n\nDe plus, nous devons considérer les implications géopolitiques de notre implication. La façon dont nous abordons la reconstruction pourrait influencer nos relations avec les pays voisins et avoir un impact sur la stabilité de la région. Au niveau national, l'administration devra communiquer l'importance de cet investissement pour le Congrès et le public américain, soulignant que l'aide à la reprise de l'Angola est essentiel pour la sécurité à long terme et contre toute résurgence de l'influence communiste. En fin de compte, les décisions prises en train de façonneront l'avenir de l'Angola et notre rôle dans la promotion de la paix et de la stabilité en Afrique australe."
 CIA_ANG.39.desc:0 "La chute du communisme en Angola est un moment du bassin versant de notre lutte contre l'expansion communiste. Ce renversement important d'une révolution communiste majeure interrompt non seulement la propagation du communisme en Afrique australe, mais change activement la marée en notre faveur. L'évitation réussie du gouvernement MPLA renforce notre position dans la région et atténue la pression sur l'Afrique du Sud, qui a été menacée en cours des mouvements communistes.\n\nCette évolution a des implications de grande envergure pour nos stratégies de politique et de sécurité étrangères. Un front unifié contre le communisme en Angola améliore notre crédibilité avec les alliés et souligne notre engagement à soutenir les mouvements démocratiques. Cela peut également inspirer des soulèvements similaires dans les pays voisins, déstabilisant davantage l'influence communiste dans la région.\n\nAu niveau national, cette victoire pourrait renforcer le soutien aux initiatives de politique étrangère de l'administration et revigorer la confiance du public dans notre rôle de leader mondial contre le communisme. Alors que nous célébrons cette réalisation, il est essentiel de tirer parti de cette élan pour assurer une stabilité et une sécurité durables en Afrique australe."
 CIA_ANG.40.desc:0 "Bien qu'il y ait eu des indications d'utilisation de la guerre chimique dans d'autres domaines de l'Angola, il n'y a eu aucune confirmation ni même vraiment des rumeurs sur leur utilisation à Cabinda. Cependant, nous devons générer une controverse pour justifier notre prochaine intervention à Cabinda. Les rapports ont circulé que le mouvement cubain ou des personnes pour la libération de l'Angola (MPLA) a utilisé la guerre chimique contre les rebelles anticommunistes dans le sud de l'Angola. Dans cet esprit, nos spécialistes de la propagande et des médias de la CIA ont été chargés de prendre ces histoires et de trouver du matériel à leur égard pour tourner la façon dont la MPLA utilise des actions barbares pour réprimer sa propre population, enflammant davantage la colère publique contre les communistes et établissant une casus belli pour lancer une intervention pour libérer la population de la cabine et s'assurer plus important encore la vaste réserve de pétrole de la côte du cabinet."
 CIA_ANG.42.desc:0 "En prélude à notre intervention, nous devons adoucir les fortifications dans l'enclave. Heureusement, les forces gouvernementales ont été lentes à déployer ou fortifier fortement la région et il y a un large manque d'installations antiaériennes à Cabinda. Dans cet esprit, la Central Intelligence Agency (CIA) a déployé plusieurs escadrons d'aéronefs plus anciens en utilisant des sociétés décortiquées dans le zaire qui sera pilotée par des pilotes en exil cubain. Ces escadrons non officiels chercheront à détruire les positions du gouvernement et à livrer des fournitures au front pour la libération de l'enclave des forces de Cabinda (FLEC) opérant dans la région. Le gouvernement zaïen a approuvé l'opération et a reçu la série en cours d'événements et de tensions entre le zaire et l'Angola nous fournit un déni plausible en ce qui concerne ces grèves. Cet argument est encore plus renforcé étant donné le grand nombre de mercenaires employés par l'État zaïen."
 CIA_ANG.43.desc:0 "Un étrange ensemble d'occurrences a récemment commencé dans l'enclave de Cabinda. Bien que les combattants de guérilla qui lançaient des attaques sporadiques contre les garnisons aient été relativement normaux, il y a récemment eu plusieurs frappes aériennes sur nos installations et nos positions à distance. Les rumeurs ont également circulé sur l'augmentation de l'activité de renseignement étrangère dans la région. Nos agents de Zaïre ont rapporté que les exilés cubains contractés par une partie inconnue, avec la permission zaïque sont ceux qui lancent les grèves de Cabinda. Notre capacité limitée à défendre la zone contre des attaques aériennes est de plus en plus préoccupante compte tenu de ces activités. Pourtant, bien que la redirection des forces pour garantir la maintenance de l'ordre dans Cabinda serait idéale, une telle décision atténuerait la pression sur UNITA et pourrait entraîner une détérioration rapide à l'avant, tout en donnant à l'Afrique du Sud l'occasion de faire un mouvement. Pour l'instant, nous devons exécuter la prudence et surveiller la région pour d'autres actions hostiles par les impérialistes."
 CIA_ANG.44.desc:0 "Maintenant que les préparatifs ont été finalisés, nos forces ont lancé l'opération Cabindan Freedom. Compte tenu de la façon dont Cabinda est isolé du reste de l'Angola et a une garnison limitée avec un soutien étranger minimal, l'attente est que cette opération arrivera rapidement à une conclusion. Dans les heures à venir, nos forces lanceront un assaut multi-volet dans la région en collaboration avec nos alliés locaux dans le mouvement de l'indépendance de Cabindan et le soutien de Zaïre et d'autres alliés régionaux. Des rapports limités ont indiqué une récent accumulation potentielle des forces gouvernementales ainsi que leurs bailleurs de fonds étrangers dans l'enclave qui ont le potentiel de compliquer l'opération. Quoi qu'il en soit, avec notre suprématie navale et aérienne, nous devrions être en mesure de décimer toute résistance soutenue et de couper les routes logistiques utilisées par les communistes."
 CIA_ANG.45.desc:0 "Les Américains et autres alliés ont lancé une intervention, appelée \"Operation Cabindan Freedom\" pour libérer l'enclave du Cabinda du gouvernement communiste de l'Angola. Comme discuté précédemment, nos forces ont également été engagées et ont commencé à garantir que l'intérieur de Cabinda devrait actuellement être envahi des gardes-frontières du gouvernement dans toute l'enclave. Compte tenu de notre soutien de longue date aux séparatistes du Cabindan, le succès potentiel de cette opération peut être une aubaine pour notre nation à la fois en termes d'élargissement de notre propre sphère d'influence, fournissant plus de débouchés économiques et surtout en affaiblissant nos ennemis communistes en Angola. Pourtant, nous devons rester vigilants et nous assurer que les communistes ne cherchent pas à mettre en scène une autre invasion en Katanga ou dans d'autres régions de notre nation, en particulier avec un si grand nombre de nos troupes actuellement engagées dans l'opération Cabindan."
 CIA_ANG.47.desc:0 "Eh bien, à la grande consternation du grand public, notre intervention à Cabinda a été une catastrophe totale. Dans une brève déclaration aujourd'hui, le ministère de la Défense a reconnu le retrait des forces américaines de l'enclave. Cette catastrophe entraînera sûrement une baisse majeure de nos chiffres d’approbation et mettra en danger les futurs succès électoraux de notre parti dans les cycles électoraux qui ont suivi. Pourtant, cela aurait pu être pire, surtout si nous nous sommes engagés à évincer pleinement le communisme de l'Angola. Au moins, nous avons désormais des informations détaillées sur l'endroit où les militaires doivent s'améliorer et comment nos partenaires stratégiques de la région doivent faire des réformes importantes à leur intelligence et à leur appareil militaire pour éviter que de telles erreurs futures ne se reproduisent à l'avenir.\n\nDans d'autres nouvelles, la Heritage Foundation et d'autres groupes de réflexion anti-communistes ont appelé les principaux défis aux partisans de notre administration en raison de notre échec à terminer le travail à Cabinda."
 CIA_ANG.48.desc:0 "La victoire rapide de nos forces à Cabinda a été une victoire majeure sur les relations avec la presse et a entraîné une bosse notable dans nos notes d'approbation. Maintenant que la victoire est à portée de main, le moment est venu d'établir un nouveau gouvernement officiellement à Cabinda. Henrique N'Zita Tiago a été prononcé en tant que président de Cabinda, tandis que Tiago est resté controversé, notre revêtement avec sa faction de FLEC lui a cependant donné de crédibilité. Nos analystes de la CIA et du Département d'État s'attendent désormais à ce que la cause séparatiste se fracture enfin pleinement et que de nouveaux partis politiques soient établis. Bien que ce scénario puisse être une cause d'alarme pour certains, le penchant anti-communiste de la large cause séparatisiste et leur opposition antérieure au gouvernement communiste ne devraient garantir qu'aucun des nouveaux grands partis politiques ne sera de nature communiste ou une menace générale pour notre influence à Cabinda."
 CIA_ANG.50.desc:0 "L’Union nationale de Jonas Savimbi pour l’indépendance totale de l’Angola (UNITA) peut avoir commencé comme alignée sur le maoïste idéologiquement, mais le parti a rapidement modéré dans un effort pour attirer l’attention internationale et a réussi à rallier la grande population ovimbundue à sa cause contre le gouvernement communiste. Si nous souhaitons garantir les vastes réserves de ressources naturelles en Angola, y compris des quantités incalculables d'huile, de diamants et d'autres minéraux, UNITA serait la meilleure option. Avec la chute du front national de libération de l'Angola (FNLA) et des schismes au sein du mouvement sécessionniste du Cabindan, les forces de Savimbi sont devenues notre seule véritable alternative pour lutter contre le gouvernement communiste de l'Angola. Du côté positif, Savimbi est sorti comme une figure très charismatique, réussi à rallier les étendues de la population angolaise à sa cause tout en montrant des compétences à la gestion des médias occidentaux."
 CIA_ANG.51.desc:0 "Un outil à notre disposition que nous n'avons pas encore livré en quantité importante à nos alliés en Angola, est les mines terrestres, à la fois de la variété anti-tanque et anti-personnelle. Les mines terrestres, en particulier les mines terrestres anti-personnel sont une arme plutôt controversée et leur disposition aux organisations que nous soutenons peut être une question plutôt sensible au public américain général. Cependant, l'utilisation de mines terrestres dans les différentes guerres de Bush d'Afrique australe leur a montré d'être incroyablement puissantes dans leur utilisation contre les ennemis avec des armes plus lourdes. Cela a été particulièrement montré en Afrique du Sud-Ouest dans le conflit en cours entre le gouvernement sud-africain et l'organisation populaire de l'Afrique du Sud-Ouest (Swapo). Après un long examen de nos analystes au sein du ministère de la Défense et de la Central Intelligence Agency, la décision a été prise par le président de commencer à expédier de grandes quantités de mines terrestres aux forces Unita en Angola. Notamment, l'Afrique du Sud a protesté contre cette décision et a soulevé des inquiétudes quant aux mines potentiellement données ou capturées par les forces Swapo étant donné la relation assez complexe entre Swapo, Unita et le gouvernement MPLA d'Angola."
 CIA_ANG.52.desc:0 "Récemment, nos officiers ont commencé à remarquer une tendance des rapports du domaine de la forte utilisation des mines par l'ennemi. Plusieurs patrouilles et multiples véhicules se sont déroulés dans les mines tout en poursuivant des pistes de bases ennemies dans des zones reculées. À la suite de l'inspection ainsi que des rapports de nos agents du renseignement ont fourni des preuves que les mines frappées n'étaient pas simplement placées par erreur les mines par nos propres forces, mais les mines terrestres fournies par l'Ouest à Unita. Il s'agit d'une complication majeure pour nos avenues d'attaque prévues et des efforts pour garantir les zones rurales fidèles à Savimbi en dehors des principaux terres de l'UNITA. Compte tenu du manque d'infrastructures et de l'emplacement éloigné des forces rebelles et des bastions, nos avancées dans ces zones sont susceptibles d'être inondées de mines anti-perpersonnel et anti-véhicules. Nos propres forces, et celle de nos alliés en Namibie ont utilisé des tactiques similaires aux forces sud-africaines de Harry, maintenant la même tactique est utilisée contre nos propres forces."
 CIA_ANG.53.desc:0 "Alors que la population et le Congrès restent au mieux ambivalents envers le conflit angolais, nos conseillers politiques ont conçu l'idée d'inviter le chef de l'opposition Jonas Savimbi à la Maison Blanche à rencontrer officiellement le président et à consulter les dirigeants et les alliés du Congrès. Nous utiliserons cette réunion pour réaffirmer notre soutien public et privé pour lutter contre le communisme en Angola et faire pression sur le Congrès pour prendre des mesures pour soutenir les rebelles anti-communistes en Angola et demander un retrait des forces communistes étrangères d'Angola. Alors que nous continuons de débattre de nos objectifs stratégiques en Angola, nous devons également vérifier l'intention du Dr Savimbi pour savoir si son objectif s'est déplacé vers une réconciliation nationale et des élections libres entre son propre parti et le mouvement du peuple communiste pour la libération d'Angola (MPLA) ou si le but reste à prendre le contrôle du pays par la force et l'expulsion de l'influence communiste d'Angol."
 CIA_ANG.54.desc:0 "Les Américains augmentent leurs efforts pour convaincre leur population de soutenir notre cause et cherchent à accroître le soutien du Congrès pour nous. Dans l'esprit de cette entreprise, le président américain [USA.GetLeader] a invité Jonas Savimbi à la Maison Blanche et s'adressant potentiellement au Congrès américain. Naturellement, nous accepterons cette proposition. Il s'agit d'une occasion exceptionnelle de vendre notre cause au soutien public américain et de rallye international à notre cause. Nous devons dépenser toutes les avenues possibles lors de cette visite pour établir des liens plus profonds avec les principaux dirigeants américains et chercher à lutter contre les groupes d'influence anti-communiste pour encourager une plus grande sanction américaine officielle à fournir à nos forces des armes plus et plus lourdes afin que nous puissions continuer à combattre les usurpers communistes de Luanda."
 CIA_ANG.56.desc:0 "Plus tôt dans la journée, nous avons été informés par nos contacts de la CIA que Washington désire que nous participons à des pourparlers de paix qui seraient organisés par l'Amérique comme un intérêt public dans notre lutte WANES, nous devons reconnaître la nature critique de ce moment dans l'élaboration de notre stratégie future. Bien que s'engager dans le dialogue puisse fournir une plate-forme pour défendre notre vision d'un Angola démocratique, nous devons peser les risques et avantages potentiels.\n\nLa participation à ces pourparlers soulève des questions importantes sur notre engagement à une véritable réconciliation nationale par rapport à notre détermination à éliminer l'influence communiste par des moyens plus forts. Nous devons évaluer si ces discussions feraient vraiment progresser nos objectifs ou serviraient simplement à légitimer la position du MPLA. En fin de compte, notre décision doit refléter notre dévouement à la réalisation d'un Angola stable et démocratique, tout en restant résolu contre les pressions externes qui pourraient saper nos objectifs et compromettre notre mission."
 CIA_ANG.57.desc:0 "Dans un développement notable, UNITA a marqué sa volonté de s'engager dans des pourparlers de paix soutenus par les Américains concernant le conflit en cours en Angola. Ce changement arrive à un moment crucial où l'intérêt public dans le conflit angolais diminue, et notre administration reconnaît l'importance de saisir ce moment pour réaffirmer notre engagement à lutter contre le communisme dans la région. S'engager avec UNITA offre une opportunité stratégique non seulement pour soutenir les forces anti-communistes, mais aussi pour recueillir des renseignements sur les intentions à long terme de Jonas Savimbi pour le paysage politique de l'Angola.\n\nCet engagement nous permettra de défendre une résolution qui favorise la paix et la stabilité en Angola, alignant nos efforts sur des objectifs géopolitiques plus larges. En renforçant notre soutien politique à l'UNITA, nous pouvons renforcer notre position dans la région tout en appuyant sur des politiques qui garantissent que nos intérêts stratégiques sont effectivement priorisés et avancés."
 CIA_ANG.58.desc:0 "Dans un développement notable, UNITA a signalé son rejet des pourparlers de paix soutenus par les Américains concernant le conflit en cours en Angola. Cette décision arrive à un moment crucial où l'intérêt public dans le conflit angolais est décroissant, ce qui a incité notre administration à réévaluer notre stratégie dans la région. Le refus de UNITA d’engager limite notre capacité à soutenir les forces anti-communistes et sape nos efforts pour promouvoir la stabilité en Angola.\n\nCe revers soulève des questions sur les intentions à long terme de Jonas Savimbi pour le paysage politique de l'Angola et complique notre approche de la politique dans la région. Sans dialogue, nous sommes confrontés à des défis accrus pour rallier le soutien du Congrès aux initiatives visant à favoriser la paix et à contrer l'influence communiste. Alors que nous naviguons à cette évolution, il devient impératif d'explorer des stratégies alternatives qui s'alignent sur nos objectifs géopolitiques, garantissant que notre engagement à promouvoir la démocratie et la stabilité en Angola reste une priorité au milieu de ces complexités."
 CIA_ANG.59.desc:0 "Alors que la guerre en Angola continue de se transformer en une impasse sanglante, les appels ont augmenté pour un cessez-le-feu et négocié le règlement du conflit pour être négocié par les principaux pouvoirs. Ce sujet a été abordé entre le leader de l'Unita, Jonas Savimbi et le président lors de la récente visite de Savimbi à la Maison Blanche pour rallier le soutien public à sa cause. Après de nouvelles discussions, Savimbi a signalé son ouverture de négocier avec le mouvement du peuple pour la libération de l'Angola (MPLA). Pourtant, il n'est pas clair si le leadership MPLA a un soutien ou non pour un cessez-le-feu, et encore moins comment La Havane et Moscou, les bailleurs de fonds de la MPLA, ressentent les négociations potentielles étant donné les grandes quantités de soutien et de main-d'œuvre que Cuba a envoyées à Angola pour renforcer la MPLA. Maintenant, nous attendons une réponse de Luanada et pour voir si les négociations commenceront ou non."
 CIA_ANG.60.desc:0 "Le gouvernement communiste de l'Angola, le mouvement populaire pour la libération de l'Angola (MPLA), a accepté nos appels à des pourparlers de paix avec l'Union nationale de Jonas Savimbi pour l'indépendance totale de l'Angola (UNITA). Cette décision marque un tournant important dans le conflit prolongé qui a tourmenté la nation, signalant une volonté potentielle d'explorer des solutions diplomatiques au milieu des pressions continues au niveau national et international.\n\n Reconnaissant le besoin urgent de stabilité et les coûts croissants de la guerre continue, la MPLA cherche à s'engager dans des discussions qui pourraient ouvrir la voie à un cessez-le-feu et à ouvrir la voie à la réconciliation. Cette initiative s'aligne sur nos intérêts stratégiques dans la région, car favoriser le dialogue peut aider à atténuer l'influence des acteurs externes et à prévenir l'escalade de la violence.\n\nAlors que la MPLA entre dans ces pourparlers, nous surveillerons de près leur engagement envers la négociation authentique. Le succès de ce dialogue dépendra de la capacité du MPLA à répondre aux demandes de Unita pour une plus grande représentation politique et un engagement envers les processus démocratiques. En soutenant cette initiative, nous espérons promouvoir une résolution pacifique qui honore les aspirations du peuple angolais tout en protégeant nos objectifs anticommunistes dans la région."
 CIA_ANG.61.desc:0 "Le gouvernement communiste de l'Angola, le mouvement populaire pour la libération de l'Angola (MPLA), a rejeté les appels à des pourparlers de paix avec l'Union nationale de Jonas Savimbi pour l'indépendance totale de l'Angola (UNITA). Cette décision reflète la détermination du MPLA à maintenir sa position contre ce qu'elle considère comme une opposition fragmentée et une menace pour sa gouvernance.\n\nEn refusant de s'engager dans le dialogue, le MPLA signale son engagement à poursuivre les efforts militaires pour consolider son contrôle sur le pays. La direction estime que la négociation avec l'UNITA pourrait saper leur autorité et enhardir les forces rebelles, compliquant les efforts pour restaurer la stabilité en Angola.\n\nAlors que les tensions persistent, la MPLA est prête à résister à la fois à la dissidence intérieure et à la pression internationale, en priorisant son programme sur les compromis potentiels. Cette position souligne non seulement les complexités du conflit, mais soulève également des préoccupations concernant l'impact humanitaire en cours sur la population angolaise, alors que la perspective d'une résolution pacifique continue de s'estomper."
 CIA_ANG.63.desc:0 "Le gouvernement communiste de l'Angola, le Mouvement populaire pour la libération de l'Angola (MPLA), a officiellement commencé les pourparlers de paix avec l'Union nationale de Jonas Savimbi pour l'indépendance totale de l'Angola (UNITA). Ce développement marque un moment crucial dans le conflit prolongé, alors que les deux parties se réunissent dans le but de trouver un terrain d'entente.\n\nPour la MPLA, s'engager dans ces négociations reflète une reconnaissance du besoin urgent de stabilité et des avantages potentiels de la diplomatie sur la guerre continue. Les pourparlers offrent l'occasion de résoudre les questions clés, y compris un cessez-le-feu possible et les réformes politiques nécessaires qui pourraient améliorer la gouvernance et la confiance du public.\n\nUNITA, pour sa part, considère cela comme une opportunité vitale de plaider pour ses aspirations politiques et de garantir une plus grande représentation. À mesure que les discussions se déroulent, les deux parties devront naviguer dans leurs différences tout en travaillant vers une solution collaborative. Le succès de cette initiative dépendra finalement de leur volonté de compromettre, s'efforçant d'une résolution pacifique qui répond aux espoirs du peuple angolais."
 CIA_ANG.64.desc:0 "Avec le conflit en Angola efficacement dans l'impasse et aucune des deux parties n'apportant de gains importants ces derniers mois, nos diplomates de premier plan ont conclu qu'une approche pratique est nécessaire pour aller de l'avant. À la lumière de l'impasse, il est devenu de plus en plus clair qu'un cessez-le-feu est essentiel pour éviter davantage de dévastation et de perte de vie. Après un examen attentif, nos diplomates recommandent d'établir un gouvernement de coalition dirigé par le mouvement populaire pour la libération de l'Angola (MPLA).\n\nCette proposition vise à créer un cadre politique plus inclusif qui reconnaît la dynamique complexe en jeu en Angola. En permettant au MPLA de prendre les devants, nous pouvons faciliter une transition qui favorise la stabilité tout en incorporant des représentants des factions opposées, y compris UNITA. Cette coalition pourrait ouvrir la voie à des réformes essentielles et à reconstruire la confiance parmi la population, favorisant finalement un environnement propice à la paix et à la reprise à long terme en Angola."
 CIA_ANG.65.desc:0 "Avec les récentes avancées réussies des forces de Savimbi menant au cessez-le-feu nouvellement déclaré, nos négociateurs du Département d'État ont lancé des plans pour plaider pour un gouvernement de coalition d'Unity. Cette coalition devrait être dirigée par Jonas Savimbi, aux côtés d'autres membres éminents de l'Union nationale pour l'indépendance totale de l'Angola (UNITA).\n\nReconnaissant l'équilibre des pouvoirs changeant, notre équipe estime que le positionnement de Savimbi à la tête de cette coalition pourrait favoriser un paysage politique plus inclusif et faciliter la paix durable en Angola. La rédaction de ces plans vise à capitaliser sur l'élan créé par les récentes gains de l'UNITA, soulignant l'importance d'une approche collaborative qui comprend diverses voix politiques.\n\nSi les négociations progressent vers une résolution pacifique, cette coalition pourrait servir de base à des réformes critiques et à la stabilité, abordant finalement les aspirations du peuple angolais et jetant les bases d'un avenir meilleur."
 CIA_ANG.68.desc:0 "À mesure que le soutien de l'Union nationale pour l'indépendance totale de l'Angola (UNITA) augmente, le temps est mûr pour pousser les forces de Savimbi à lancer une poussée renouvelée à Luanda et à commencer des mesures offensives. Nos agents en Angola informeront le commandement de l'Unita et Jonas Savimbi de notre besoin de voir nos progrès crédibles pour évoluer le gouvernement communiste à Luanda pour faire l'escalade de la poursuite de leur organisation. La CIA a également été chargée d'augmenter la présence de nos forces secrètes dans la nation pour dégrader davantage les capacités arrière du mouvement populaire pour la libération des forces de l'Angola (MPLA) et de dégrader leurs réseaux logistiques dans la campagne angolaise. Une opération réussie serait une aubaine pour nos références de politique étrangère et justifierait au public américain nos politiques plus d'escalade en ce qui concerne la lutte contre la menace du communisme international."
 CIA_ANG.69.desc:0 "Avec le soutien des armes américaines lourdes et du soutien d'autres puissances régionales, le moment est maintenant conformément à la Central Intelligence Agency pour faire pousser Luanda. Ce sera une bataille durement combattue, mais l'augmentation de l'aide militaire américaine et des conseillers a conduit à une augmentation majeure de nos capacités de combat et les autres alliés de la MPLA ont subi de vastes victimes avec nos nouvelles armes lourdes. Si nous pouvons perturber la ligne de front, nous devrions pouvoir faire des gains rapides dans tout le pays. L'objectif final de cette offensive est de prendre Luanda, ce qui dit, nos gestionnaires de la CIA ont noté que le simple fait d'empiéter sur Luanda ou de consacrer le siège et d'autres zones urbaines importantes serait suffisante pour être considérée comme un succès et conduirait à une aide militaire américaine supplémentaire pour consolider nos nouvelles positions et continuer à faire pression sur le gouvernement communiste."
 CIA_ANG.70.desc:0 "Maintenant que l'Angola a été stabilisée et que l'influence communiste a été éradiquée, le moment est venu de récolter les fruits d'une telle terre riche en ressources naturelles. Le nouveau gouvernement a accordé des droits de permis et de ressources à une variété de sociétés américaines, déjà des économistes ont estimé que cela conduira à des manneurs majeures pour les sociétés américaines et à l'aide à long terme pour stabiliser les prix du pétrole en Occident, compte tenu des projets de développement en cours pour développer le potentiel massif de l'Angola pour une industrie pétrochimique. Les critiques ont allégué que nous agissons simplement comme un pouvoir néocolonial, en remplacement de la domination portugaise et sud-africaine pour celle de nos propres marionnettes, mais le développement rapide de l'Angola entraînera sûrement une augmentation des salons et offrir des possibilités d'emploi aux masses."
 CIA_ANG.71.desc:0 "Eh bien maintenant que nous avons réussi à élargir l'influence communiste et à stabiliser la nation, une ruée d'investissement étranger est venu à la nation sous la forme de sociétés américaines cherchant à établir de nouvelles opérations, en particulier en ce qui concerne les mines et le raffinage du pétrole. Compte tenu de la vaste destruction que le pays a subie tout au long de l'indépendance et de la guerre civile subséquente, l'investissement est indispensable et bienvenu. L'investissement nécessitera également des investissements majeurs dans notre infrastructure nationale. Ces mesures sont susceptibles de renforcer notre soutien populaire et d'éroder davantage tout soutien restant aux communistes aux marges de la société.\n\nCela dit, nous devons être sûrs d'éviter de tomber dans le piège de la malédiction des ressources et de chercher à moderniser d'autres aspects de notre nation et finalement à diversifier notre économie de l'extraction purement des ressources. Toujours pour l'instant, c'est une aubaine massive pour notre nation récemment réunifiée."
 CIA_ANG.72.desc:0 "Nos relations secrètes avec l'Afrique du Sud sont connues depuis longtemps de Washington. Dans cet esprit, l'ambassadeur américain nous a présenté une proposition. Les principes fondamentaux de l'offre sont que nous agirons comme intermédiaire pour que les armes américaines atteignent les forces des rebelles anticommunistes en Angola en échange d'une aide militaire et d'une gratitude américaine. L’opposition au soutien des rebelles anticommunistes en Angola a entravé l’ordre du jour du président pour repousser l’expansion du communisme en Afrique. L'offre comporte peu de coûts et de risques pour notre nation, nous avons déjà des liens secrètes avec plusieurs groupes anti-communistes en Afrique australe ainsi que des termes amicaux avec Pretoria, mais si les nouvelles de ceci ont été brisées, cela pourrait nuire aux relations avec les futures administrations américaines. Comment devons-nous procéder?"
 CIA_ANG.73.desc:0 "Notre ambassadeur en Israël a relayé qu'Israël a accepté notre proposition d'Israël d'agir comme intermédiaire pour transférer des armes américaines aux forces anti-communistes en Angola. C'est une excellente nouvelle et nous fournit enfin une voie alternative pour commencer à repousser le communisme en Angola. Bientôt, les armes seront rapidement distribuées aux forces de Savimbi et aux autres milices alliées en Angola et dans les environs. En outre, Israël a également noté leur volonté de coordonner davantage les efforts en ce qui concerne l'Afrique du Sud et la gestion des négociations dans la région à une date ultérieure. Pourtant, nous devons nous assurer que le Congrès et le grand public ignorent cet arrangement compte tenu de la légalité douteuse de tout ce programme."
 CIA_ANG.74.desc:0 "Notre ambassadeur en Israël a relayé qu'Israël a confirmé qu'ils n'avaient pas l'intention de transporter des armes américaines en Angola pour contourner nos propres lois. Cela est plutôt surprenant étant donné les liens étroits entre Israël et l'Afrique du Sud et leur volonté générale d'être un indicateur indirect de nos campagnes d'armes dans d'autres pays. Pourtant, le conseiller en chef de la Maison Blanche a exprimé une réparation quant à la rejette de la question, citant que la proposition était encore probablement illégale en premier lieu et une violation flagrante de l'amendement Clark. Malheureusement, cela signifie que le Congrès doit prendre des mesures sur l'amendement Clark, ou que nous considérons d'autres stratégies, certainement illégales pour soutenir les forces anti-communistes en Angola."
 CIA_ANG.75.desc:0 "Nos opérations de combat contre le mouvement populaire pour la libération de l'Angola (MPLA) et de leurs alliés cubains se sont révélées assez coûteuses en termes de matériel. Heureusement, récemment, les livraisons ont commencé à arriver d'armes américaines via des renseignements israéliens. Bien que le Congrès américain ait empêché le président de soutenir directement notre cause avec une aide matérielle, il semblerait que Washington ait trouvé une autre avenue pour livrer des fournitures à nos combattants. Avec un soutien renouvelé, nous devrions certainement avoir la capacité de tenir notre territoire actuel et de commencer à rédiger des plans pour contre-offensives à l'avenir. Espérons que des actions militaires décisives de notre part stimuleront un plus grand soutien aux États-Unis et mèneront finalement à une aide encore plus mortelle, en particulier en termes d'équipements lourds qui pourraient être utilisés pour contrer les forces cubaines."
 CIA_ANG.24.desc:0 "Après des tensions croissantes entre les différentes parties impliquées dans la guerre civile angolaise, l'Afrique du Sud a de nouveau lancé une intervention armée en Angola. Pretoria plus tôt dans le conflit a lancé une tentative ratée de saisir Luanda en coordination avec le Zaïre et les forces rebelles alignées. Cuba a fortement condamné cette décision comme une autre escalade par une puissance raciste et impérialiste qui doit être constituée aux cendres de l'histoire. Une rhétorique similaire a été repris par d'autres dirigeants et mouvements africains de gauche. La communauté internationale plus large et le mouvement anti-apartheid ont également critiqué Pretoria pour leur reprise d'intervention armée en Angola et ont répété les appels pour que les deux parties se désengagent et recherchent la diplomatie. De l'autre côté, les États-Unis ont refusé de commenter l'opération en cours, provoquant des rumeurs de collaboration américaine avec l'Afrique du Sud pour l'intervention."
 CIA_ANG.30.desc:0 "Le chef cubain [CUB.GetLeader] dans une adresse ardente à La Havane a dénoncé aujourd'hui les demandes américaines pour Cuba pour retirer leurs forces de l'Angola. [CUB.GetLeader] a doublé sur leur rhétorique antérieure selon laquelle les États-Unis agissent simplement dans l'intérêt des pouvoirs d'entreprise cherchant à prendre le pétrole de l'Angola au profit des pouvoirs impérialistes. Depuis le début de la guerre civile angolaise, Cuba a envoyé des dizaines de milliers de soldats en Angola dans le but de soutenir le mouvement populaire pour la libération de l'Angola (MPLA) de l'Angola sur celle de leurs riveaux armés, en particulier de l'Union nationale pour l'indépendance totale de l'Angola (Unita), dirigée par le chef de guellela de premier plan Jonas Savimbi. Compte tenu de la probabilité croissante d'une intervention américaine manifeste en Angola, il faut maintenant se demander comment ce mouvement de Cuba aura un impact sur une intervention américaine potentielle ou entraîner une escalade de La Havane et de Moscou."
 CIA_ANG.31.desc:0 "Dans une décision surprenante, le chef cubain [CUB.GetLeader] a annoncé le retrait des forces cubaines d'Angola. Cela vient à la lumière des demandes américaines pour les forces cubaines pour quitter le pays ou faire face à des conséquences désastreuses en Angola et à Cuba. Avant la fin de la guerre de l'indépendance angolaise et le début de la guerre civile angolaise, le mouvement du peuple communiste pour la libération de l'Angola (MPLA) était dans un endroit ténu et assiégé par tous les côtés par des ennemis domestiques et étrangers. L'intervention des forces cubaines a été décisive pour permettre à la MPLA de sécuriser la capitale de Luanda et de s'établir comme le gouvernement légitime ainsi que d'empêcher une campagne conjointe de l'Afrique du Sud et du Zaïre de prendre le contrôle de la nation. Le départ des forces cubaines de l'Angola est un coup majeur à la MPLA et affaiblira sûrement leur emprise sur le pouvoir dans toute la nation avant une intervention américaine potentielle."
 CIA_ANG.32.desc:0 "À la suite d'une étendue d'efforts diplomatiques américains pour influencer le conflit en cours en Angola, le président américain [USA.GetLeader] a annoncé aujourd'hui la formation d'une \"coalition des volontiers\" à intervenir en Angola. Alors que plusieurs alliés américains de la région, notamment Zaïre et l'Afrique du Sud, ont fait écho aux affirmations américaines d'utilisation des armes chimiques par les forces cubaines et gouvernementales en Angola contre les forces de l'Union nationale pour l'indépendance totale du mouvement rebelle d'Angola, mais ont été refusés par Cuba et l'Union soviétique. Le chef angolais [ANG.GetLeader] a également rejeté ces affirmations, mais n'a pas encore permis aux observateurs internationaux d'évaluer les affirmations. Plus près de chez nous, le public américain a répondu favorablement à l'annonce, mais a été examiné par de vastes étendues de la communauté internationale. Le temps nous dira si l'un des alliés américains de l'OTAN se joindra à la prochaine opération angolaise, qui dit que les jours d'un Angola communiste pourraient très bien être limités."
 CIA_ANG.34.desc:0 "Le Pentagone a annoncé le début de l'opération Angolan Freedom. Alors que les États-Unis se dirigent vers l’opération, divers alliés régionaux américains ont déclaré leur soutien et leur participation à l’opération à l’appui de l’Union nationale de Jonas Savimbi pour l’indépendance totale de l’Angola (UNITA). Cela dit, la condamnation internationale est venue de l'Union soviétique, de l'Allemagne de l'Est, du mouvement non aligné et le plus vocalement, le chef cubain [CUB.GetLeader]. Bien qu'elle ne soit pas directement impliquée dans l'opération, l'Afrique du Sud a fait l'éloge de cette décision comme retour à la santé mentale et une décision décisive en contenant l'influence communiste en Afrique australe. Le temps nous dira comment ce mouvement affecte la stabilité dans toute la région tant que cela a un impact sur la guerre des frontières sud-africaines entre l'Afrique du Sud et l'organisation populaire d'Afrique du Sud (Swapo), qui est largement basée dans le sud de l'Angola."
 CIA_ANG.41.desc:0 "Lors d'une conférence de presse controversée aujourd'hui, le président américain [USA.GetLeader] a allégué que le mouvement populaire pour la libération de l'Angola (MPLA) et les forces cubaines en Angola ont utilisé des armes chimiques contre les forces séparatistes de Cabindan dans l'exclave riches en pétrole de l'Angola. Le gouvernement MPLA d'Angola, de Cuba et de l'Union soviétique a tous dénoncé l'annonce comme celle de la propagande colonialiste tandis que l'Afrique du Sud, le Zaïre et d'autres gouvernements adaptés à l'ouest en Afrique ont publié des déclarations à l'appui des affirmations. Tout cela survient alors que les États-Unis auraient élargi les opérations de renseignement en Angola et une augmentation notamment des appels à l'indépendance du Cabindan par rapport à divers groupes activistes internationaux. Cet ensemble de mesures a également soulevé de sérieuses questions quant à savoir si des mesures militaires seront prises ou non à Cabinda par les États-Unis ou dans d'autres alliés régionaux américains de la région, en particulier le Zaïre."
 CIA_ANG.46.desc:0 "Le Pentagone a annoncé le début de l'opération Cabindan Freedom. L'objectif de l'opération par un porte-parole du Pentagone est d'établir un gouvernement indépendant dans l'exclave et de transférer des dirigeants politiques à la population opprimée locale. Luis Ranque Franque, le chef du front séparatiste pour la libération de l'enclave de Cabinda (FLEC) a annoncé le fort soutien et la coopération de son organisation avec l'intervention américaine. Les rapports sont déjà venus dans une déroute des forces cubaines et angolaises de l'exclave ainsi que du FEC saisissant le contrôle de plusieurs villages à l'intérieur de Cabinda. L'Union soviétique a condamné cette décision comme un autre exemple du colonialisme américain mais n'a pas montré d'intérêt pour les représailles ouvertes pour l'intervention."
 CIA_ANG.49.desc:0 "Le président américain [USA.GetLeader] Lors d'une visite à la capitale du Cabinda nouvellement indépendant, Cabinda a rencontré Front pour la libération de l'enclave de Cabinda (FLEC) le chef Luis Ranque Franque où la paire a annoncé la création officielle de la République de la Cabinda avec Franque comme président de la République nouvelle. Alors que les nationalistes de Cabindan avaient déclaré l'indépendance avec Franque en tant que président auparavant, cela reconnaît la première fois qu'un pouvoir international légitime officiellement leur règne sur le petit État africain. La France, l'Afrique du Sud et le Zaïre ont également envoyé des dignitaires à Cabinda pour établir des relations diplomatiques ainsi que des liens commerciaux potentiels. Les rumeurs abondent déjà de sociétés pétrolières américaines et françaises qui cherchent à établir une présence à Cabinda."
 CIA_ANG.55.desc:0 "À la suite d'une invitation du président [USA.GetLeader], Jonas Savimbi, chef de l'Union nationale pour l'indépendance totale de l'Angola (UNITA) et le leader rebelle de l'Angola est arrivé à Washington DC. La visite de Savimb dans la capitale américaine et la rencontre avec le président visent à accroître la légitimité et le soutien de l'UNITA tandis que la guerre civile continue de rage en Angola. UNITA contrôle une grande bande d'Angola, en particulier dans la section sud-est de la nation africaine assiégée. Unita a été enfermée dans la lutte avec le mouvement du peuple gouvernant pour la libération de l'Angola (MPLA) et leurs alliés cubains depuis la fin de la guerre d'indépendance angolaise contre le Portugal au début des années 1970. Le président [USA.GetLeader] a été un fervent partisan de l'UNITA de Savimbi et a appelé le Congrès à accroître l'aide militaire à la guérilla et la rencontre avec Savimbi vise clairement à faire pression sur le Congrès à accroître le financement."
 CIA_ANG.62.desc:0 "À la suite de campagnes de pression internationale intensives et de coercition de Washington, le mouvement populaire pour la libération de l'Angola (MPLA) et l'Union nationale pour l'indépendance totale de l'Angola (UNITA) dirigée par le célèbre combattant de la guérilla Jonas Savimbi ont accepté des pourparlers de paix pour mettre fin à la guerre civile angolaise. Il s'agit d'une victoire majeure pour la diplomatie et pour la politique étrangère du président [USA.GetLeader]. UNITA accepter les pourparlers de paix n'était pas une décision surprenante étant donné le soutien de Wasington au groupe, mais l'acceptation de la MPLA est à une surprise majeure non seulement à la communauté internationale plus large, mais à la fidèle de la MPLA, allié Cuba qui n'était apparemment pas informé avant l'accord pour cesser les hostilités. Cela dit, l'avenir de l'Angola reste incertain et si cela devient un moment central pour le processus de paix en Afrique australe ou simplement un cessez-le-feu temporaire dans le conflit de décennies reste à voir."
 CIA_ANG.66.desc:0 "Après de longues pourparlers de paix entre le mouvement populaire pour la libération de l'Angola (MPLA) et l'Union nationale pour l'indépendance totale de l'Angola (UNITA) ainsi que les élections nationales, il a été convenu que la MPLA dirigera un gouvernement de coalition national pendant les prochaines années tandis que la nation établit une nouvelle constitution et un nouveau système électoral. Avec cela, la MPLA a finalement créé officiellement la légitimité internationale et devrait dissuader davantage de soutien aux conflits armés dans la nation. Cependant, le leader de l'UNITA, Jonas Savimbi, n'a pas encore commenté officiellement le nouveau gouvernement dirigé par MPLA, que cela représente un véritable début pour la démocratie angolaise ou un retour au conflit armé ou à l'autocratie n'a pas encore été vu."
 CIA_ANG.67.desc:0 "Après de longues pourparlers de paix entre le mouvement populaire pour la libération de l'Angola (MPLA) et l'Union nationale pour l'indépendance totale de l'Angola (UNITA) ainsi que les élections nationales, il a été convenu que l'UNITA dirigera un gouvernement de coalition national pour les prochaines années tandis que la nation établit un nouveau système de constitution et de système électoral. Avec cela, la longue quête de pouvoir de Jonas Savimbi en Angola a atteint une conclusion étonnamment réussie. Le nouveau gouvernement a ordonné aux forces cubaines du pays avec des conseillers de l'Allemagne de l'Est et de l'Union soviétique d'évacuer immédiatement le pays. La question de savoir si l'adhésion au MPLA plus dur et la plus dur accepte le nouveau gouvernement de coalition dirigé par unité. Cela dit, cela pourrait enfin mettre fin au conflit de décennies en Angola."
 CIA_SAF80.0.desc:0 "L'Afrique du Sud est depuis longtemps notre partenaire stratégique clé dans la lutte contre le communisme en Afrique australe. Malheureusement, leur pratique continue de l'apartheid a rendu notre soutien à l'Afrique du Sud difficile et controversé pour le moins. Pire encore, la politique a activement provoqué une résistance généralisée contre le gouvernement sud-africain. Si cela ne suffisait pas, l'opposition en Afrique du Sud est fortement influencée par les communistes, en particulier au Congrès national africain (ANC) et à leurs alliés du Parti communiste sud-africain (SACP). Il reste essentiel pour notre cause que l'Afrique du Sud reste une puissance anticommuniste influente dans la région et peut contrer la marée croissante du communisme en Afrique australe. Cependant, nous devons également équilibrer les préoccupations à la maison, et parmi nos alliés que l'Afrique du Sud a le potentiel de réformer ainsi que de trouver également une voie à suivre sur l'autre problème sud-africain controversé moins connu, leur vaste programme d'armes de destruction massive."
 CIA_SAF80.1.desc:0 "Alors que notre appareil de renseignement adopte une position plus prudente sur l'Afrique du Sud, notre administration a décidé que davantage d'attention devait être accordée à garder une trace du programme sud-africain des armes de destruction massive. Nos sources ont indiqué que l'Afrique du Sud, en plus de son programme d'armes nucléaires secrètes, possède également d'importantes réserves d'armes chimiques et éventuellement biologiques. Compte tenu de la nature du gouvernement, de l'instabilité croissante et peut-être du désespoir du gouvernement, nous devons nous assurer que nous connaissons l'emplacement des installations et du stockage pour nous assurer que dans les pires scénarios, nous avons la capacité de sécuriser les sites avant leur capture par l'opposition ou l'utilisation par le gouvernement dans certains scénarios. Permettre à l'Afrique du Sud de déployer des armes nucléaires, même dans un environnement plus contrôlé serait préjudiciable à la stabilité régionale et doit être étudiée plus avant."
 CIA_SAF80.2.desc:0 "L’amendement de Boland est depuis longtemps un obstacle majeur pour les objectifs de la politique étrangère de l’administration. Notre administration a recherché des voies alternatives pour financer les Contras, d'autant plus que le Congrès refuse de bouger nos appels pour abroger l'amendement du Boland. Une nouvelle proposition, défendue par certains dans les agences de renseignement, est de demander à Afrique du Sud d'aider à former et à équiper les Contras en échange de notre soutien continu pour leur régime malgré les efforts internationaux du tollé et des sanctions en cours sur l'apartheid. Des préoccupations juridiques ont été soulevées sur cette proposition, ainsi que d'autres notant des préoccupations morales concernant l'approfondissement de nos liens avec Pretoria et leur donnant essentiellement un effet de levier sur notre gouvernement. Cependant, cela pourrait être un moyen efficace de soutenir les Contras, si l'Afrique du Sud accepte tout en respectant techniquement l'amendement du Boland. Cela dit, le public n'apporterait pas bien cet accord s'il devait se révéler. Comment devons-nous procéder à l'envoi de l'offre?"
 CIA_SAF80.3.desc:0 "Une proposition intéressante a attiré notre attention plus tôt dans la journée de l'ambassadeur américain. L'ambassadeur a noté que le soutien de l'Afrique du Sud était controversé au niveau national et international pour les États-Unis, mais que ce n'est pas leur seule cause controversée. La discussion s'est déplacée pour comparer notre lutte contre le communisme aux contras du Nicaragua. En fin de compte, la proposition est qu'en échange de notre aide à la fourniture et à la formation des Contra Fighters, que les États-Unis chercheraient à saper davantage l'embargo en place contre nous et à dégénérer leurs tentatives aux Nations Unies pour défendre notre régime et à fournir secrètement les munitions, le carburant et le carburant et à usage double. Le plan est censé être légal, alors que cela est un minimum de préoccupation pour nous, les caprices du public américain. En acceptant cette proposition, nous abandonnerons sûrement assez peu en échange d'un soutien, cependant, si l'administration actuelle tombait et que ce programme se révélera probablement conduirait à des sanctions plus sévères imposées à notre économie. Comment devons-nous procéder?"
 CIA_SAF80.4.desc:0 "L'Afrique du Sud a convenu de notre proposition de coopération accrue en échange de leur formation de soutien et d'armement des Contras. Tout en exprimant son inquiétude quant à la façon dont une telle décision sera prise par la communauté internationale lorsqu'elle sera inévitablement révélée, Pretoria a exprimé sa gratitude pour l'opportunité et a noté qu'ils commenceront immédiatement à rédiger des plans sur la façon d'exfiltrer correctement, d'infiltrer et de former des unités de contra dans les tactiques d'insurrection. Compte tenu de l'histoire impressionnante de l'Afrique du Sud dans la guerre contre-insurrectionnelle, cela devrait fournir aux contras des formateurs crédibles ainsi qu'une voie logistique directe pour les armes et le soutien et l'alignement idéologique des deux contribuera à garantir que cette relation ne se décompose pas dans un avenir imminent. Maintenant, nous devrons maintenir notre fin de marché et travailler à affaiblir les efforts de sanction sud-africains et à fournir à l'Afrique du Sud une aide militaire supplémentaire."
 CIA_SAF80.5.desc:0 "Malheureusement, l'Afrique du Sud a rejeté notre proposition Contra. Alors que les Sud-Africains ont noté qu'ils appréciaient l'offre, ils pensaient que l'offre serait trop controversée si elle était dévoilée au public américain et mettrait davantage le soutien de leur gouvernement par les futures administrations américaines. Des inquiétudes ont également été soulevées sur la légalité de la décision compte tenu du droit américain et étant donné les liens actuels solides entre Pretoria et Washington, des préoccupations ont été soulevées sur d'autres liens qui tendent. Dans l'ensemble, tout ce programme était effectivement à long terme, nous devrons envisager de supprimer le soutien des Contras ou de rechercher d'autres régimes de financement alternatifs. Une proposition récente a noté le potentiel de vendre des armes à l'Iran, puis d'utiliser ces fonds pour équiper les Contras après tout. C'est peut-être aussi une avenue qui mérite d'être explorée dans un avenir proche."
 CIA_SAF80.6.desc:0 "Suite à l'accord sud-africain pour renforcer les Contras, l'administration a commencé à planifier comment saper davantage l'embargo sud-africain. Pour ce faire, nous cherchons activement à faire pression sur les sanctions et les groupes de boycott via le processus juridique, alors qu'un projet de loi est peu susceptible de passer le Congrès à ce sujet, l'administration a exploité nos liens avec divers législateurs des États pour pénaliser les groupes appelant à de telles mesures. De plus, nous avons pris des mesures pour encourager l'investissement des entreprises en Afrique du Sud et lancerons une campagne de pression contre les nations européennes ciblant l'économie sud-africaine. Nos alliés au Congrès prévoient également de modifier les prochains projets de loi de la ferme et de crédits pour inclure le financement et l'exemption des efforts visant à établir des liens commerciaux plus forts avec l'Afrique du Sud. Toutes ces mesures devraient servir à saper l'embargo sud-africain et le mouvement de sanction mondiale tout en évitant la violation des lois américaines ou du Congrès trop perturbant."
 CIA_SAF80.7.desc:0 "Les États-Unis ont maintenu leur fin de marché et ont lancé des efforts pour contourner les efforts internationaux de l'embargo contre nous. Diverses mesures ont été prises. Notamment, l'administration a pris des mesures drastiques contre les dissidents intérieurs qui visent notre État, même en pétitionnant pour interdire l'organisation des efforts de boycott et encourager les sociétés américaines à investir en nous. Bien que la portée de l'Amérique d'avoir un impact sur les autres nations appliquant des embargos soit limitée, Washington a lancé une campagne douce contre l'effort et cherche des alliés avec qui travailler sur la question. Pourtant, l'affaiblissement des efforts américains privés pour installer des sanctions et des boycotts a déjà abouti à une petite bosse économique et nos économistes prédisent que cette aide et l'aide qui l'accompagne promise dans la législation à venir contribuera à revitaliser notre économie en fuite de sanction."
 CIA_SAF80.9.desc:0 "Suite à la réaction publique à notre soutien à l'Afrique du Sud lors de leur intervention en Angola au début des années 1970 et à la question en cours de l'apartheid, les transferts d'équipements militaires manifestes en Afrique du Sud ne sont pas possibles à l'heure actuelle. Cependant, l'administration a décidé d'une ligne de conduite pour fournir aux anciens modèles d'équipements d'Afrique du Sud par le biais d'intermédiaires lors d'un produit à prix réduit. Bien que cela soit douteux légalement, nous utiliserons des personnalités militaires et de renseignement à la retraite qui sont alignées sur l'administration pour travailler comme intermédiaires avec les Sud-Africains et chercher à relancer le produit à d'autres causes que le Congrès refuse de remettre le financement malgré nos demandes répétées. Cela dit, nous devons viser à maintenir cette secrète comme possible, étant donné non seulement des préoccupations domestiques, mais aussi la réaction géopolitique qu'une telle révélation provoquerait."
 CIA_SAF80.10.desc:0 "Alors que notre soutien à l'Afrique du Sud devient de plus en plus controversé, il est plus important que jamais de garder un œil sur et d'envisager de supprimer le mouvement anti-apartheid, en particulier en Europe. Pour ce faire, la Central Intelligence Agency, en collaboration avec nos partisans en Europe occidentale, cherchera à collecter des informations incriminantes et à intimider les militants de conduite en conformité et cherchera à diffuser une désinformation tout au long du mouvement pour provoquer des luttes intestines. Compte tenu de l'intersectionnalité du mouvement avec d'autres causes de gauche, la mise en place de différences idéologiques et l'escalade des tensions sur les problèmes de genre et de sexualité peuvent également s'avérer fructueuses. Concernement, non seulement le grand public contre l'Afrique du Sud dans ces nations contre l'Afrique du Sud, mais aussi le soutien du Congrès national africain (ANC), souvent financièrement, notamment la Suède, qui est un leader clé du mouvement anti-apartheid avec le gouvernement finançant ouvertement l'ANC."
 CIA_SAF80.11.desc:0 "Olof Palme, le Premier ministre de la Suède, a longtemps été une épine à notre côté en ce qui concerne nos objectifs stratégiques en Afrique du Sud. Avec sa popularité incontestée en Suède, Palme est peu susceptible de démissionner de ses fonctions de sitôt. Pour aggraver les choses que les discours publics de Palme contre l'apartheid et nos politiques en ce qui concerne l'Afrique du Sud, la Suède sous Palme est devenue l'un des principaux financiers du Congrès national africain (ANC). Compte tenu des dommages qui lui ont été faits à nos objectifs stratégiques en Afrique, la décision a été prise de retirer la Palme du conseil d'administration. Nos collaborateurs locaux examineront Palme lorsqu'il sortira sans sécurité et le frappera tout en exfiltrant rapidement de la situation pour éviter toute trace de notre implication. Heureusement, les détails de la sécurité de Palme sont incroyablement laxistes et notamment régulièrement avec sa femme sans aucun garde du corps."
 CIA_SAF80.12.desc:0 "Nos efforts pour trouver un financement pour l'Afrique du Sud, les Contras et autres causes controversées que le Congrès refuse de financer a emmené notre administration dans des endroits douteux. Personne ne s'attendait probablement à son entrée dans cette administration que nous serions obligés de demander à la Central Intelligence Agency (CIA) de vendre des fissures et d'autres drogues dans des zones minoritaires pour financer l'Afrique du Sud et les Contras, mais nous y sommes. Heureusement, les médias ont eu peu d'idée que cela se produisait, en dehors des affirmations de Fringe par des théoriciens du complot que nous vendons des fissures alimentant la crise de la drogue dans les villes du centre. Notre dernière série de bénéfices sera utilisée pour aider à financer les efforts de l’armée sud-africaine pour restaurer l’ordre en Afrique du Sud-Ouest, autrement connue sous le nom de Namibie et expulser les insurgés angolais, cubains et namibiens occupant des parties de la région. Nos efforts de médicaments récents se sont révélés encore plus rentables depuis que l'Afrique du Sud a aidé à soutenir les Contras. Le contras devenant une force plus forte a conduit à une augmentation du trafic de drogue entre le Nicaragua et les États-Unis, favorisant nos objectifs de financement. Cela dit, l'agence d'application des médicaments (DEA) est à sa fin sur l'afflux de médicaments après plusieurs appels proches entre les agents de la DEA enquêtant sur les agents de la CIA en désactivation."
 CIA_SAF80.13.desc:0 "Pendant des années, nous avons secrètement collaboré avec l'Afrique du Sud, en particulier sur le Front de renseignement. Compte tenu de la fiabilité de Pretoria ces dernières années dans le travail avec notre gouvernement dans la contenu du communisme en Afrique subsaharienne, la décision a été prise d'intensifier la collaboration des renseignements avec l'Afrique du Sud. Pendant des années, nous avons retenu les informations sur divers dissidents et certaines figures régionales, détails et autres renseignements qui concernaient les administrations antérieures sur la façon dont l'Afrique du Sud utiliserait les données. Compte tenu de la menace croissante dans la région du communisme et des relations de travail plus étroites de l'Afrique du Sud avec nous, cela n'est plus considéré comme une raison justifiée de retenir les informations de renseignement. Un programme de formation conjoint pour aider à la raffinement des forces opératoires noirs d'élite de l'Afrique du Sud a également été autorisée dans le but de renforcer les efforts sud-africains en Afrique du Sud-Ouest et en Angola pour lutter contre le mouvement populaire pour la libération de l'Angola (MPLA) et l'organisation populaire du sud de l'Afrique du Sud (SWAPO)."
 CIA_SAF80.14.desc:0 "Bien que peu recommandable, le moins que le gouvernement sud-africain représente le dernier bastion de l'anti-communisme en Afrique australe. La décision du gouvernement sud-africain d'approfondir la collaboration avec leur soutien aux Contras représentait une étape importante dans nos relations avec Pretoria. L'Afrique du Sud qui s'aligne plus pleinement avec nos intérêts a conduit notre administration à doubler le soutien de l'Afrique du Sud, fournissant une assistance économique et militaire approfondie au gouvernement d'origine internationale. Bien que politiquement controversé, la décision de renforcer Pretoria a versé des dividendes en termes de progrès dans la réalisation de nos objectifs stratégiques en Afrique et en Amérique latine. Cela dit, des problèmes demeurent, en particulier sur la façon de faire face au programme nucléaire sud-africain, ainsi que sur le traitement du mouvement international anti-apartheid. Toujours le spectre du communisme est toujours répandu sur l'Afrique du Sud et une aide supplémentaire sera nécessaire pour assurer la survie du régime."
 CIA_SAF80.15.desc:0 "Depuis des années, nous savons que Pretoria a un programme d'armes de destruction massive étonnamment bien développé, y compris une composante nucléaire bien financée. Bien que cela soit préoccupant pour beaucoup, le président a décidé d'aider l'Afrique du Sud à ce programme. Bien que beaucoup rechignent normalement à une telle décision, le Conseil de sécurité nationale a finalement convenu que la possibilité de surveiller et de dissuader les aspects les plus préoccupants des programmes de guerre chimique et biologique sud-africaine ainsi que de garantir que les appareils et les matériaux nucléaires soient correctement gérés l'emportent sur les risques du programme lui-même. Cela dit, la proposition a été placée sous les niveaux de confidentialité les plus élevés, si le public le découvrait, les ramifications seraient catastrophiques pour le dire légèrement. Si l'Afrique du Sud accepte, nous aiderons Pretoria à affiner leur programme nucléaire, en échange, nous les dicterons à démanteler les aspects de leurs programmes de guerre chimique et biologique et à établir nos propres personnalités de sécurité dans leurs sites nucléaires."
 CIA_SAF80.16.desc:0 "Une autre offre intéressante est venue des Américains. Cette fois, l'ambassadeur américain a relayé que Washington était au courant de notre programme de guerre nucléaire, biologique et chimique et tout en exprimant une préoccupation limitée concernant les éléments biologiques et chimiques était plus ou moins à bord du programme nucléaire et offre d'aider à nos efforts. En particulier, les États-Unis proposent de renforcer notre programme nucléaire avec le partage de quantités limitées d'informations techniques et de recherche ainsi que d'aider à sécuriser les sites nucléaires afin d'éviter toute action terroriste ciblant les sites. Cependant, ce faisant, nous serions soumis à la surveillance américaine de notre programme d'armes et renoncerions à la majeure partie de notre pouvoir discrétionnaire dans les programmes qui sont développés et investis dans et auraient probablement besoin de démanteler certains de nos programmes d'armes biologiques les plus drastiques qui étaient prévus pour un pire scénario."
 CIA_SAF80.17.desc:0 "Le gouvernement sud-africain a informé notre ambassadeur qu'ils accepteront notre proposition concernant leur programme d'armes de destruction massive. Tout en hésitant à accepter les concessions présentées, en particulier avec le démantèlement des parties du programme de guerre chimique et biologique, l'aide technique et de sécurité liée au programme nucléaire et aide à maintenir l'existence du programme hors de la lumière du public a été considérée comme valable les concessions. Vient maintenant la partie difficile, garantir en fait que l'Afrique du Sud suit leur parole et fournissant suffisamment d'aide technique pour maintenir l'Afrique du Sud en ligne tout en évitant une escalade grave de leur programme nucléaire. Ce sera sûrement une tâche difficile et devra également être maintenu aux niveaux les plus classifiés étant donné à quel point cet accord est politiquement délicat. Pourtant, cela représente une victoire stratégique pour notre politique sud-africaine de rapprocher Pretoria dans notre orbite."
 CIA_SAF80.18.desc:0 "Le gouvernement sud-africain a informé notre ambassadeur de rejeter notre proposition concernant leur programme d'armes de destruction massive. La réponse a noté que même s'ils trouvaient la proposition intrigante et qu'ils appréciaient la grande quantité de soutien que notre administration a apportée à l'Afrique du Sud qu'ils n'avaient pas trouvé que les concessions valaient la coopération sur le programme nucléaire. Nos analystes croient également que cette décision a été en partie alimentée par un désir du gouvernement sud-africain pour éviter de devenir encore plus dépendante de notre soutien et du potentiel pour nous d'utiliser la coopération comme effet de levier pour forcer les futures concessions sur leur gouvernement. Bien que malheureux, nous devons maintenant passer à autre chose et nous assurer que les traces de l'offre sont correctement rejetées et considérer d'autres options pour traiter le programme nucléaire sud-africain tout en maintenant nos objectifs stratégiques globaux dans la région."
 CIA_SAF80.19.desc:0 "Notre administration a considérablement élargi notre soutien à l'Afrique du Sud. Cela dit, certaines actions prises par Pretoria sont allées trop loin et doivent être régnées en conséquence. Les rapports indiquent que l'Afrique du Sud a probablement déjà la possibilité de créer des dispositifs nucléaires de travail et en a probablement fabriqué une poignée. De plus, les programmes de guerre chimique et biologique d'Afrique du Sud sont étendus et représentent une menace pour la stabilité régionale et mondiale, en particulier compte tenu des tensions globales et de l'instabilité en Afrique du Sud. Le président, conformément au Conseil de sécurité nationale, a décidé de faire pression sur l'Afrique du Sud pour abandonner leurs ambitions nucléaires et utiliser notre soutien à leur gouvernement ces dernières années comme effet de levier pour faire pression sur la question. Cependant, si notre bluff est appelé, nous aurons peu d'options réelles à suivre nos menaces étant donné la façon dont l'Afrique du Sud centrale est de nos buts et objectifs stratégiques régionaux."
 CIA_SAF80.20.desc:0 "Les Américains ont apparemment appris davantage sur notre programme d'armes nucléaires que nous nous attendions initialement. Alors que nous étions conscients qu'ils le savaient, nous ne savions pas leur connaissance de toute l'étendue de nos capacités. L'ambassadeur américain a relayé aujourd'hui une demande de Washington pour abandonner nos activités nucléaires et démanteler notre inventaire actuel de dispositifs nucléaires. L'ambassadeur a également relayé les inquiétudes que la poursuite du programme nucléaire pourrait conduire à la séparation complète des liens entre Washington et Pretoria si le Congrès apprend l'existence du programme. Cela met notre gouvernement dans toute l'entraînement. D'une part, nous avons investi des ressources étendues dans le programme et la considérons comme l'un des derniers outils pour dissuader une guerre civile potentielle ou une invasion étrangère. De l'autre, perdre le soutien américain peut condamner notre gouvernement et notre peuple. Comment devons-nous procéder?"
 CIA_SAF80.21.desc:0 "Heureusement, notre ambassadeur à Pretoria nous a informés que le gouvernement sud-africain a accepté de suspendre son programme d'armes nucléaires. Il s'agit d'une victoire majeure pour la politique de notre administration en Afrique du Sud. Bien que le grand public ne soit pas informé de l'existence ou de la résiliation du programme nucléaire sud-africain, nous pouvons être assurés que notre politique d'engagement constructif avec Pretoria porte ses fruits. Malheureusement, si le public était au courant du programme nucléaire sud-africain, nous serons encore plus difficiles à répter contre l'Afrique du Sud et à réduire tous les liens. Comme cela reste inacceptable pour nos objectifs stratégiques dans la région, nous devons nous assurer que toutes les traces liées au programme sont correctement couvertes et cachées au public et aux journalistes."
 CIA_SAF80.22.desc:0 "Malheureusement, notre ambassadeur à Pretoria nous a informés que le gouvernement sud-africain a refusé de suspendre son programme d'armes nucléaires. C'est une nouvelle désastreuse pour la politique étrangère de l'administration et nous met maintenant dans une situation encore pire en ce qui concerne l'Afrique du Sud. La chute du régime actuel à Pretoria conduirait probablement au moins un gouvernement pro-soviétique en Afrique du Sud, représentant la chute complète de l'Afrique australe au communisme et le potentiel compromettant une voie d'expédition internationale clé autour du Cap de bon espoir. Comment procéder ici sera un choix difficile. Deux principales écoles de pensée ont émergé au sein du Conseil de sécurité nationale. Une faction a soutenu la pression de Pretoria en menaçant de divulguer l'existence du programme aux médias, tandis qu'un autre a soutenu que le programme seul et poursuivre notre politique actuelle en ce qui concerne l'Afrique du Sud."
 CIA_SAF80.23.desc:0 "L'Afrique du Sud est riche en diverses ressources naturelles, en particulier dans les métaux précieux, l'uranium et autres. Cependant, l'Afrique du Sud repose fortement sur les importations de pétrole. Les sanctions ont eu un impact négatif sur l'économie sud-africaine, mais les ressources disponibles en Afrique du Sud ont réussi à atténuer certains des pires effets potentiels. Cependant, la réduction des importations de pétrole due aux sanctions a présenté un défi à la fois à l'économie sud-africaine et encore plus critique, l'armée sud-africaine. Pour contrer cette question, le président a autorisé la libération partielle de nos réserves de pétrole stratégiques ainsi que la coopération avec les régimes et les sociétés de production de pétrole amical afin d'échapper à l'effort de sanction sur l'Afrique du Sud pour fournir à Pretoria un flux constant de pétrole et de gaz naturel."
 CIA_SAF80.24.desc:0 "De bonnes nouvelles sont arrivées de Washington. Le président [USA.GetLeader] a décidé que le renforcement davantage de notre économie à la lumière des sanctions mondiales est une priorité élevée. À la lumière de ce changement stratégique, nous avons été informés que les États-Unis garantiraient secrètement notre accès continu aux importations de pétrole via des intermédiaires. Le manque de pétrole et de gaz est de plus en plus devenu l'une des plus grandes préoccupations pour notre économie à la lumière des sanctions mondiales et de la détérioration des liens avec le monde arabe. Bien que ce ne soit peut-être pas une solution permanente, cela donne à notre gouvernement plus de temps pour trouver une voie à suivre et isoler davantage notre économie contre de nouveaux efforts de sanction. Cependant, nous devons nous rappeler que cette politique est liée aux caprices du gouvernement américain, et tout changement de politique américaine pourrait mettre fin à ce programme."
 CIA_SAF80.100.desc:0 "L'Afrique du Sud a longtemps été un problème controversé étant donné que leurs politiques d'apartheid sont géopolitiquement toxiques tout en étant le dernier gouvernement anti-communiste majeur en Afrique australe. Après un débat controversé, le président a décidé pour l'instant du moins, que l'appareil de sécurité devrait s'abstenir de gonfler activement la situation ou de montrer une préférence claire de chaque côté en Afrique du Sud. Cependant, le président a autorisé la poursuite des activités sur le suivi des communistes, en particulier les principaux membres du Parti communiste sud-africain (SACP) et des agents soviétiques et cubains présumés en Afrique du Sud. Des membres plus durs dans les services de renseignement ont notamment hérissé l'annonce et ont fait valoir que cela permet simplement une plus grande influence communiste en Afrique australe."
 CIA_SAF80b.1.desc:0 "Alors que les administrations précédentes ont aidé et encouragé le régime sud-africain actuel, la nouvelle administration de [USA.GetLeader] a décidé d'une nouvelle ligne de conduite pour restaurer la moralité à la politique étrangère américaine. Le nouvel objectif de la politique étrangère américaine envers l'Afrique du Sud sera double. Premièrement, nous allons désormais finir la fin du système d'apartheid en Afrique du Sud, cela comprendra l'arrêt des efforts du gouvernement pour échapper aux sanctions et chercher à soutenir le mouvement international anti-apartheid en empêchant les acteurs hostiles de prendre des mesures contre le mouvement. Cependant, l'administration a également noté que la prévention d'une prise de contrôle communiste de l'Afrique du Sud est importante. À cet effet, le président a noté son soutien à un plan de cherchant à marquer davantage de membres militants de gauche du Congrès national africain (ANC) ainsi que de rechercher d'autres organisations en Afrique du Sud qui s'opposeront au communisme mais qui sont contre le système d'apartheid."
 CIA_SAF80b.2.desc:0 "Pendant trop longtemps, l'appareil de renseignement a été utilisé pour harceler les mouvements progressifs aux États-Unis et en Europe occidentale. La Central Intelligence Agency (CIA) a maintenant été chargée de prioriser la sécurité des militants anti-apartheid non communistes et d'éviter la coopération avec tous les éléments d'extrême droite cherchant à endommager le mouvement tout en restreignant la surveillance sud-africaine et le harcèlement du mouvement anti-apartheid. Certains officiers de la CIA auraient été déplacés par ce changement de tactique et devraient être surveillés pour s'assurer qu'ils suivent correctement les ordres. Cela dit, nos analystes estiment que cette décision comporte un risque minimal et pourrait aider à construire une bonne volonté avec les dirigeants militants. En plus de cela, la CIA a également été priée de chercher à travailler contre l'assassinat potentiel de tout leaders occidental qui est remarquable pour leur opposition à l'Afrique du Sud."
 CIA_SAF80b.3.desc:0 "L'un des principaux problèmes du gouvernement sud-africain est leur campagne avancée d'armes de destruction massive. Bien qu'international ne soit au mieux des rumeurs, l'Afrique du Sud a en fait un programme d'armes nucléaires fonctionnelles et nos analystes pensent qu'il est très possible que l'Afrique du Sud ait soit un appareil nucléaire fonctionnel, soit la capacité d'en assembler rapidement une. Pour affaiblir davantage le statut international de Pretoria, le Conseil de sécurité nationale a accepté une proposition de fuir toute l'étendue des programmes de guerre nucléaire et biologique sud-africains à la presse. Un officier désigné de la CIA avec des connexions médiatiques sera chargé de fuir en toute confiance le matériel au New York Times, puis à partir de ce point, nous attendrons que l'histoire suive son cours avant de nous convenir officiellement des rapports et de vérifier son contenu. Des inquiétudes ont été soulevées pour que cela puisse pousser Pretoria plus profondément dans un coin et pourrait compromettre toutes les chances diplomatiques de mettre fin à l'apartheid."
 CIA_SAF80b.4.desc:0 "Terrible nouvelle, les médias internationaux ont eu vent de notre programme d'armes de destruction massive. Bien que le début de la tempête de feu des médias ne soit pas directement lié au gouvernement américain, il est clair que le gouvernement américain a divulgué l'existence du programme au New York Times et à d'autres institutions médiatiques. Il s'agit d'une catastrophe totale. Les alliés et partisans internationaux restants que nous avions nous abandonnent rapidement comme défendant notre cause est devenu encore plus politiquement toxique. Des préoccupations ont été soulevées sur ce qui va sûrement arriver, d'autres sanctions économiques, maintenant également appliquées par les États-Unis, ce qui aura des effets désastreux non seulement sur notre économie mais aussi notre capacité à faire la guerre. Même maintenant, nos ennemis, domestiques et étrangers, complotent notre disparition et que des actions désespérées de plus en plus audacieuses pourraient être nécessaires à l'avenir pour éviter le pire."
 CIA_SAF80b.6.desc:0 "L'existence et l'expansion continue du programme d'armes nucléaires sud-africaines sont une préoccupation pour la sécurité mondiale. Malheureusement, paralyser le programme nucléaire sud-africain est plus difficile que la plupart des Afrique du Sud ont de riches réserves d'uranium et d'autres ressources nécessaires aux armes nucléaires. Si le programme se poursuit, il pourrait fournir à Pretoria l'effet de levier ultime pour tenter d'empêcher la fin de l'apartheid. Pour saboter le programme, une proposition a été approuvée par le Conseil de sécurité nationale pour kidnapper les scientifiques nucléaires sud-africains. Bien que peut-être une décision drastique, cet effort pourrait aider à retarder la progression du programme nucléaire sud-africain tout en atténuant le risque d'escalade ou d'alarme publique. Cependant, des préoccupations ont été soulevées sur les conséquences si l'opération échoue ou a des complications lors de l'enlèvement de scientifiques nucléaires."
 CIA_SAF80b.7.desc:0 "Grande nouvelle, notre récente campagne contre le programme nucléaire sud-africain a été un grand succès. Plusieurs scientifiques nucléaires sud-africains notables ont été enlevés par nos agents et ont réussi à remettre aux États-Unis. Bien que les scientifiques ne soient pas des leaders dans leur domaine à l'échelle mondiale, ils sont toujours des universitaires notables et seront convaincus, peut-être avec force de coopérer dans l'élargissement de notre intelligence sur le programme sud-africain, puis de trouver un emploi dans un domaine connexe au niveau national, sous observation bien sûr. Le gouvernement sud-africain n'a rien annoncé officiellement pour le moment, mais selon nos sources, nous sommes conscients de notre culpabilité dans les enlèvements et a exprimé ses préoccupations concernant leur propre sécurité personnelle. De façon alarmante, nos nouvelles sources d'information ont conduit nos analystes à réaliser qu'ils ont peut-être sous-estimé la progression du programme nucléaire sud-africain."
 CIA_SAF80b.8.desc:0 "Malheureusement, nos tentatives de sabotage du programme nucléaire sud-africain en enlevant des scientifiques sud-africains sont devenus un fiasco. Alors que les choses ont commencé normalement, nos agents ont rapidement réalisé que les cibles n'étaient pas à leur domicile et avaient été déménagées dans les installations gouvernementales. Les forces spéciales sud-africaines compliquaient encore nos agents alors qu'ils exfiltraient de la nation. Heureusement, nos agents ont réussi à s'échapper, mais avec quelques blessures. Le gouvernement sud-africain a annoncé leur déjouer notre opération et a fustigé notre opération en violation de leur souveraineté. C'est certainement un coup dur pour l'administration, et peut-être plus sans aucun doute n'a fait aucun dommage significatif au programme nucléaire sud-africain tout en embarrassant nos services d'administration et de sécurité."
 CIA_SAF80b.9.desc:0 "Depuis des décennies, nous avons été un fervent partisan du gouvernement sud-africain. Cela se trouve en dépit de leurs politiques d'apartheid controversées aux États-Unis et politiquement toxiques à l'étranger. Cependant, le président [USA.GetLeader] s'est déroulé sur l'inversion de cette approche. Pour continuer sur cette voie, le président a autorisé l'envoi d'une proposition au chef du Congrès national africain (ANC), Nelson Mandela, pour accepter le soutien américain en échange de la mise à l'écart des membres du Parti communiste sud-africain (SACP) dans le mouvement plus large, en particulier en ce qui concerne les principaux membres de l'UMKHONTO WE SIZWE, l'aile armée de l'ANC qui est fortement conforme aux membres de SACP. Si Mandela accepte la proposition, nous aurions le véhicule parfait pour influencer le mouvement anti-apartheid en Afrique du Sud et assurer une influence américaine continue en Afrique du Sud dans un Afrique du Sud post-apartheid. Cependant, cette décision a également été critiquée par certains au sein du Conseil de sécurité nationale (NSC) pour un potentiellement déstabilisateur de l'Afrique du Sud."
 CIA_SAF80b.10.desc:0 "Notre sensibilisation à Nelson Mandela a porté des fruits. Le chef du Congrès national africain (ANC) a informé nos agents qu'il avait accepté notre proposition. Mandela a noté que même s'il avait des réserves sur des membres plus éminents du Parti communiste sud-africain (SACP), c'était pour le bien de l'Afrique du Sud et pourrait fournir l'élan nécessaire pour enfin mettre fin à l'apartheid. Bien que naturellement cet accord restera privé entre les échelons supérieurs de notre administration et la principale direction de l'ANC, il s'agit d'une victoire majeure pour notre administration et d'une justification de notre nouvelle stratégie en ce qui concerne l'Afrique du Sud. Espérons que cela représente le début de la fin du régime d'apartheid à Pretoria et pousse le gouvernement à la table de négociation pour éviter un bain de sang futur."
 CIA_SAF80b.11.desc:0 "À la suite d'un débat controversé, le président a autorisé l'armement de l'Umkhonto We Sizwe, l'aile armée du Congrès national africain (ANC). Cela vient malgré le fait que l'Umkhonto que nous Sizwe est effectivement dirigé par la direction du Parti communiste sud-africain (SACP). Alors que les membres les plus durs de l'appareil de renseignement et de l'établissement de politique étrangère ont fortement critiqué la décision, le président estime que la sensibilisation à l'ANC permettra à notre gouvernement d'exercer une plus grande influence dans un Afrique du Sud post-apartheid et potentiellement aliéner les membres du SACP. Alors que Mandela et d'autres dirigeants de l'ANC ont répondu positivement à notre sensibilisation et à notre proposition visant à minimiser la participation de la SACP dans un Afrique du Sud post-apartheid, le doute reste sur la volonté de la plus large ANC de poursuivre l'accord. Un autre contingent a également exprimé sa préoccupation quant à cette décision conduisant à une plus grande tension raciale en Afrique du Sud et à la hausse des risques d'une violente guerre civile éclater au Cap."
 CIA_SAF80b.12.desc:0 "L'un des principaux problèmes que nos services de renseignement ont rencontrés avec le mouvement anti-apartheid en Afrique du Sud au fil des ans est le niveau élevé de communistes éminents au sein du Congrès national africain ainsi que leur alliance avec le Parti communiste sud-africain (SACP). Cela est particulièrement vrai avec la grande présence de leadership SACP et des cadres dans l'aile armée du mouvement, umkhonto we sizwe. L'ANC a accepté de prendre des mouvements de conciliation pour réduire l'influence communiste au sein du mouvement ANC. Les dirigeants communistes de l'Umkhonto nous Sizwe, en particulier Joe Siovo, le commandant général de l'Umkhonto We Sizwe et président du SACP, Chris Hani, le chef d'état-major de l'UMKHONTO, nous Sizwe et d'autres membres de SACP proéminent dans le cadre de l'organisation ételace et que le MTINT sera plus élivée dans les autres rôles dans l'organisation ételace et que le moderne sera plus élivé."
 CIA_SAF80b.13.desc:0 "Les Zoulous représentent l'un des plus grands groupes ethniques en Afrique du Sud. Bien que manquant d'un Bantustan formel, l'aristocratie zouloue locale a effectivement un pouvoir étendu sur leurs terres traditionnelles. Le mouvement national de libération culturelle d'Inkatha (inclm), dirigé par le neveu du roi zoulou potentiel pourrait être un atout vital dans nos efforts en cours. Bien que initialement aligné avec le Congrès national africain (ANC), l'inclm est devenu de plus en plus aliéné avec l'ANC pour diverses raisons, et une partie de la noblesse zouloue a été de plus en plus amicale avec le gouvernement sud-africain. Le président a approuvé un plan de sensibilisation au Prince Mangosuthu Gatsha Buthelezi, le chef de l'inclusion et propose une proposition à l'inclm de se distancier du gouvernement sud-africain et de se préparer à un éventuel soulèvement armé contre l'État en échange de l'aide financière et militaire américaine avec la reconnaissance et le soutien d'un État zulu indépendant dans la suite de l'automne à l'automne de l'apartière."
 CIA_SAF80b.14.desc:0 "Heureusement, le leadership du mouvement national de libération culturelle d'Inkatha (inclm) a accepté notre proposition. Représentants du prince Mangosuthu Gatsha Buthelezi, le chef de l'inclm organise actuellement des lieux de livraison et trouvent la logistique de l'expansion de notre réseau local et de nos livraisons d'armes pour commencer dans les prochaines semaines. Nos analystes croient fermement que notre soutien à un État zoulou indépendant dans le cadre d'une structure gouvernementale traditionnelle était le principal argument de vente pour l'INCM. C'est un grand pas vers notre objectif de mettre fin à l'apartheid en Afrique du Sud, mais il ouvre également de nouveaux défis. Nous devrons désormais également équilibrer les intérêts concurrents de l'inclm et du Congrès national africain (ANC). Les tensions entre les deux organisations ont augmenté ces dernières années, et l'ANC sera sûrement mécontent du nouvel objectif de l'inclm et de notre acceptation d'un État zoulou indépendant."
 CIA_SAF80b.15.desc:0 "Malheureusement, les dirigeants du mouvement national de libération culturelle (inclm) d'Inkatha ont repoussé notre offre d'aller à l'encontre du gouvernement à Pretoria. L'inclm, tout en appréciant l'offre, a noté qu'à ce moment-là, ils se sentaient plus à l'aise de jeter leur sort avec le gouvernement Pretoria étant donné le radicalisme croissant au sein du Congrès national africain (ANC) et d'autres forces alliées. Bien qu'ils ne soient pas ouvertement déclarés, nos analystes et nos agents locaux croient que l'aristocratie zouloue est menacée par des courants politiques plus de gauche au sein du mouvement anti-apartheid qui, bien que non communiste, mettrait certainement fin à la structure de pouvoir traditionnelle au KwaZulu. Bien que malheureux, cette réponse ne soit pas entièrement inattendue, les rapports de renseignement locaux avaient noté une proximité croissante entre les dirigeants zoulus notables et le gouvernement sud-africain, en particulier à la lumière des conflits croissants de l'inclm avec l'ANC."
 CIA_SAF80b.16.desc:0 "Le moment est venu, après diverses négociations avec des factions anti-apartheid en Afrique du Sud et en fournissant des armes et une formation suffisantes, il est temps de stimuler le début d'un soulèvement armé contre le gouvernement sud-africain. Nos agents ancrés dans l'Umkhonto que nous avons Sizwe nous ont informés que l'aile armée du Congrès national africain prévoit de commencer leur grande opération contre le gouvernement par un premier raid sur diverses cibles gouvernementales plus petites et plus douces, avant de pivoter des complexes de prisons majeurs et de tenter de lancer des coups de pouce contre les gouvernements collaboragistes des Bantandes. Alors que nous attendons les nouvelles de nos contacts sur le succès des premières étapes du soulèvement, des préoccupations ont été soulevées en interne au sein de l'administration sur les crimes potentiels contre des civils blancs et des éléments collaborateurs ainsi qu'une analyse contradictoire de la façon dont le gouvernement sud-africain réagira au soulèvement. Idéalement, le soulèvement apporterait le gouvernement pro-apartheid à la table de négociation, mais la vision désormais prédominante des agences de renseignement est que cela se dirigera probablement dans une guerre civile sanglante et augmente le risque que le gouvernement sud-africain prenne des mesures drastiques."
 CIA_SAF80b.17.desc:0 "Des nouvelles terribles ont commencé à affluer dans tout le pays. Hier soir, de multiples rapports sur les attaques contre les installations militaires et chargées de l'application des lois ont commencé. Alors que les attaques isolées contre ces types d'installations n'étaient pas alarmantes au début, la situation s'est rapidement éteinte hors de contrôle. Plusieurs prisons majeures ont été attaquées et les ailes armées du Congrès national africain et du Parti Inkatha Freedom ont lancé un soulèvement armé général contre notre gouvernement, prenant déjà le contrôle de plusieurs zones urbaines. Des conflits ont également été signalés dans les Bantustans entre les forces fidèles à notre gouvernement et à celles alignées sur les forces anti-apartheid. Nous ne pouvons pas vaciller maintenant, toutes les forces paramilitaires et militaires doivent être activées alors que la nation tombe dans une guerre civile. Le fait de ne pas sauver notre gouvernement mènera sûrement au génocide de la population blanche de l'Afrique du Sud, peut-être que des mesures plus extrêmes seront nécessaires pour récupérer la situation dans les prochains jours."
 CIA_SAF80b.5.desc:0 "Au cours d'une session sur la non-prolifération nucléaire aux Nations Unies plus tôt dans la journée, l'ambassadeur américain aux Nations Unies a révélé l'existence du programme sud-africain des armes de destruction massive. Ce programme comprend non seulement des armes nucléaires, mais aussi des agents chimiques et biologiques prétendument. L'ambassadeur a continué d'annoncer le soutien des États-Unis pour exiger de l'Afrique du Sud pour démanteler son programme d'armes ainsi que le soutien aux sanctions si cette demande n'est pas satisfaite étant donné la relation de longue date de Washington avec Pretoria, la décision de dévoiler et de soutenir les sanctions par rapport au programme est une surprise majeure pour la communauté internationale. Les sondages ont montré qu'une forte majorité des Américains soutiennent cette évolution vers le forçage de l'Afrique du Sud à abandonner leur programme d'armes, mais les organisations anti-communistes qui soutiennent l'Afrique du Sud dans leur lutte contre l'expansion du communisme en Afrique australe ont condamné cette décision comme une trahison d'un allié américain."
 CIA_SAF80b.18.desc:0 "À la suite des élections sud-africaines controversées de 1948, le parti Nasionale a rapidement établi un État d'apartheid pour autonomiser la population de Boers sur la population africaine noire compromettant la majorité de la population du pays, mais aussi pour établir un système politique pour pousser les modérés blancs et les libéraux à la frange politique. Au fur et à mesure que les décennies se sont déroulées, la condamnation et la dissidence internes et étrangères de l'apartheid ont progressivement augmenté. Après un retrait dans le soutien américain ces dernières années, la situation sécuritaire de Pretoria s'est considérablement détériorée. Cependant, le mouvement international anti-apartheid était resté plein d'espoir pour une transition principalement pacifique de l'apartheid. Malheureusement, cet optimisme est mort d'une mort douloureuse après des affrontements dans toute la nation entre l'armée et l'Umkhonto WE Sizwe, l'aile armée du Congrès national africain (ANC). Cela suit une répression renouvelée du gouvernement contre l'opposition politique, avec des espoirs de transition pacifique en lambeaux, la communauté internationale devra désormais décider comment procéder."
 CIA_SOM.30.desc:0 "La Somalie a lancé une deuxième guerre d'Ogaden au milieu de l'escalade du conflit de la guerre civile éthiopienne. Les forces somaliennes, aux côtés du Front de libération de l'ouest de la Somalie et du Front de libération de Somalie Abo - un groupe d'origine oromo cherchant à rejoindre la Somalie - a lancé des opérations militaires agressives dans les régions frontalières contestées. Ce conflit renouvelé rouvre les problèmes territoriaux récemment rouverts pendant la guerre des années 1970, intensifiant les rivalités régionales de longue date. Dans une décision stratégique importante, les États-Unis ont fourni un soutien secrète à la campagne de la Somalie, visant à contrer l'influence soviétique et à stabiliser la corne volatile de l'Afrique. Le soutien américain souligne son intérêt à façonner la dynamique de sécurité régionale, même si les observateurs internationaux mettent en garde contre le potentiel de conflits plus larges. À mesure que les tensions augmentent, l'interaction complexe des facteurs ethniques, politiques et stratégiques continue de menacer davantage d'instabilité, laissant les États voisins et la communauté mondiale profondément préoccupées par les implications à long terme."
 CIA_SOM.31.desc:0 "La Somalie est sortie victorieuse dans la deuxième guerre d'Ogaden, garantissant une victoire décisive au milieu de la toile de fond de la guerre civile éthiopienne. Les forces somaliennes, aidées par le Front de libération somalien occidental et le Front de libération somalien et a réussi à capturer des territoires clés dans la région d'Ogaden, surmontant une résistance éthiopienne féroce. Le soutien secret des États-Unis a joué un rôle crucial dans le bas des échelles, fournissant une aide militaire critique qui a contribué au succès stratégique de la Somalie. La victoire résout les litiges territoriaux de longue date remontant au 19e siècle tout en modifiant la dynamique régionale du pouvoir. Le triomphe de la Somalie renforce la fierté nationale et positionne le pays comme une force dominante dans la corne de l'Afrique. La victoire améliore l'influence de la Somalie, créant des opportunités pour remodeler les alliances politiques et la sécurité régionale. Les observateurs internationaux surveillent étroitement les conséquences, car cette victoire devait changer les tensions géopolitiques dans la corne de l'Afrique."
 CIA_SOM.32.desc:0 "Les forces somaliennes n'ont pas réussi à remporter la victoire dans la deuxième guerre d'Ogaden, connaissant des revers importants dans leur campagne militaire. Malgré les progrès initiaux aux côtés du Front de libération somalien ouest et du Front de libération somalien, l'armée somalienne a rencontré une résistance féroce des troupes éthiopiennes ancrées dans la région contestée d'Ogaden. Les conditions difficiles de la guerre civile éthiopienne en cours ont encore compliqué la situation. Malgré le soutien secrète des États-Unis, les forces somaliennes n'ont pas pu maintenir l'élan et ont été repoussées, incapables d'obtenir des territoires clés. Cette défaite laisse la Somalie face aux différends territoriaux non résolus de la guerre d'Ogaden des années 1970. Le revers soulève des préoccupations concernant l’avenir des ambitions territoriales de la Somalie et des objectifs stratégiques dans la corne de l’Afrique. Les observateurs internationaux remettent désormais en question la durabilité des alliances somaliennes et les implications de cet échec sur la stabilité à long terme de la région et l'équilibre des pouvoirs en Afrique de l'Est."
 CIA_SOM.33.desc:0 "Les forces soutenues par les États-Unis alignées sur le mouvement national somalien ont remporté une victoire décisive dans la guerre civile somalienne en cours, renversant effectivement le régime de Siad Barre. Selon des sources militaires, le soutien américain secrète - le renseignement, l'assistance logistique et les armements avancés - ont permis au mouvement national somalien de capturer des territoires stratégiques clés, forçant les loyalistes de Barre dans une retraite rapide. Cette intervention est désormais largement considérée comme un tournant dans le conflit, ce qui a fait l'objet d'une transition vers une Somalie plus démocratique et stable. Les experts régionaux notent que l'opération souligne le rôle croissant des pouvoirs externes dans la formation des affaires somaliennes. Alors que certains analystes félicitent cette décision pour son potentiel à réduire l'instabilité à long terme dans la région, d'autres avertissent que les implications plus larges restent incertaines et que l'atteinte de la paix durable peut nécessiter d'autres efforts diplomatiques et économiques. Les observateurs internationaux continuent de surveiller étroitement les développements alors que la Somalie est confrontée à un nouveau chapitre de sa guerre civile prolongée."
 CIA_SOM.34.desc:0 "Après un revers important dans la guerre civile somalienne, les forces soutenues par les États-Unis et le Mouvement national somalien (SNM) ont été contraints de se retirer dans l'État indépendant autoproclamé du Somaliland. Malgré les gains initiaux, le soutien américain et les avancées SNM n'ont pas pu surmonter la résistance déterminée des forces de Siad Barre et des factions rivales. La retraite marque un changement spectaculaire dans le conflit, car les espoirs initiaux d'élargir les zones contrôlées par SNM à travers la Somalie ont rapidement diminué. L'assistance militaire des États-Unis, qui comprenait le renseignement et le soutien logistique, n'était pas suffisante pour garantir et maintenir le contrôle des régions contestées. Malgré cela, le Somaliland, qui a déclaré l'indépendance au début des années 1990, reste fermement sous le contrôle du SNM. Les observateurs internationaux ont exprimé leur inquiétude face à l'échec de la stratégie, notant que la situation pourrait déstabiliser davantage la région et compliquer les efforts en cours pour la réconciliation nationale somalienne. L'avenir de l'implication des États-Unis dans le conflit reste incertain."
 CIA_CYCLONE.0.desc:0 "Bureau de l'Afghanistan, Bureau de l'Analyse de l'Asie du Sud-Est, Direction du Renseignement  \nSECRET/NOFORN\nDepuis la Révolution d'Avril 1978 en Afghanistan, qui a abouti à l'installation du gouvernement pro-soviétique de la République Démocratique d'Afghanistan dirigé par Nur Mohammad Taraki, les décideurs du monde occidental et anti-communiste se sont préoccupés de l'inclination soviétique vers l'Asie centrale et le Moyen-Orient. Cependant, les récentes révoltes anti-gouvernementales en Afghanistan par les groupes islamistes militants « moujahidines » ont attiré l'attention de Washington, tout comme l'augmentation de l'intervention militaire soviétique dans la région pour soutenir le régime actuel dirigé par Babrak Karmal, qui a remplacé l'ancien dirigeant, Hafizullah Amin, tué par les Soviétiques avant leur intervention.\nDésormais connus sous le nom de Résistance afghane, plusieurs groupes ont émergé comme une menace crédible pour le régime pro-soviétique à Kaboul, y compris une faction connue sous le nom de « Sept de Peshawar », composée de sept groupes islamistes politiques et traditionalistes afghans financés par le Pakistan et l'Arabie Saoudite, ainsi que le « Huit de Téhéran », une faction plus petite de huit groupes militants chiites soutenus par l'Iran. \nIl est d'une grande importance stratégique et tactique dans la région de soutenir ces groupes, en commençant par des activités secrètes. Ce Bureau, en coordination avec le personnel technique concerné, recommande des livraisons initiales secrètes d'armements légers, de munitions, de missiles anti-char et anti-aériens, ainsi que des explosifs supplémentaires; de même que des contacts initiaux avec ces groupes et avec des figures pakistanaises, saoudiennes et afghanes pour faciliter les conseils et la formation sur le terrain. Avec cette approbation, il est possible que la marée puisse tourner contre la domination soviétique en Afghanistan et en Asie centrale."
 CIA_CYCLONE.1.desc:0 "MESSAGE PRIORITAIRE  \nDE : AMBASSADE DES ÉTATS-UNIS ISLAMABAD  \nÀ : BUREAU SEASIA, D/OPERATIONS, LANGLEY ; NSC, APNSA  \nSECRET/NOFORN  \nLES OPÉRATIONS EN AFGHANISTAN ÉCHOUENT. LES LIVRAISONS D'ARMES N'ARRIVENT PAS AUX MILICES. LES CONFLITS INTRA-FACTIONS AUGMENTENT AU LIEU DE SE CONCENTRER SUR LA MENACE SOVIÉTIQUE. L'ÉQUIPE DE LA CIA DANS LE PAYS RECOMMANDE UNE PAUSE/ANNULATION DES OPÉRATIONS ET DE L'AIDE. DEMANDE DE RÉPONSE IMMÉDIATE. FIN.  \nLe Directeur de la CIA, [GetCurrentCIADir], fronça les sourcils en voyant le câble déposé sur son bureau par sa secrétaire. Les efforts de Langley pour inverser la situation en Afghanistan échouaient ; la liste des raisons était longue comme le bras. Il pouvait à peine imaginer la frustration des agents maintenant, tentant de gérer une lutte perdue d'avance.  \nAppuyant sur « 1 » sur son téléphone sécurisé, il contacta le standard de la Maison Blanche en quelques secondes. « J’ai besoin de parler au Président, s'il vous plaît. C’est urgent. »  \nQuelques secondes plus tard, la voix du Président [USA.GetLeader] répondit au téléphone. « Qu'y a-t-il, Monsieur le Directeur ? »  \n« Monsieur, nous devons convoquer le Conseil de sécurité nationale immédiatement. C’est à propos de l'Afghanistan. Nous devons arrêter les opérations. »  \n« J'avais peur que vous disiez cela, Monsieur le Directeur. Malheureusement, je suis d'accord. Pas besoin de convoquer le NSC aujourd'hui. Vous avez l'autorité pour arrêter les opérations maintenant, et nous ferons le point avec le NSC lors de notre réunion hebdomadaire. »  \n« Oui, Monsieur le Président. Merci, Monsieur. Au revoir. » Le DCI raccrocha, puis appuya sur une extension directement vers le bureau voisin, celui du Directeur adjoint des opérations. « DDO, nous arrêtons l'opération en Afghanistan. Fais ce qu'il faut pour retirer nos hommes de là-bas. »"
 CIA_CYCLONE.2.desc:0 "MESSAGE PRIORITAIRE  \nDE : BUREAU SEASIA, D/OPERATIONS, LANGLEY  \nÀ : USEMBASSY ISLAMABAD ; TEAM ALPHA EAGLE  \nSECRET/NOFORN  \nPOTUS INFORMÉ DE LA SITUATION EN AFGHANISTAN. LA MAISON BLANCHE ET LANGLEY ONT DÉCIDÉ D'ARRÊTER LES OPÉRATIONS. RETOUR IMMEDIAT À L'AMBASSADE DES ÉTATS-UNIS À ISLAMABAD EN ATTENTE DE NOUVELLES INSTRUCTIONS. RETOUR PROBABLE AUX ÉTATS-UNIS. FIN.  \nAprès avoir attendu une minute pour confirmer que le télex avait été envoyé avec succès, le DDO soupira, marquant la fin d'une autre tentative d'intervention des États-Unis. C'était vraiment dommage cette fois ; entre la pression politique et l'inefficacité du Pentagone, des opérations à une échelle comme celle de l'Afghanistan n'étaient pas une tâche facile.  \nIl appuya sur le bouton d'interphone, appelant sa secrétaire pour qu'elle trouve les responsables du Bureau de l'Asie du Sud-Est, la division sous laquelle l'Afghanistan était rattaché. Cinq minutes plus tard, les deux chefs de bureau, l'un de l'Analyse/Renseignement et l'autre des Opérations, apparurent dans son bureau."
 CIA_CYCLONE.4.desc:0 "Le chef de la station de Riyad a approché la maison de Saud avec une demande d'aide. Dans la nouvelle opération secrète des États-Unis pour soutenir les groupes militants islamistes anticommunistes en Afghanistan communiste, connu de manière informelle sous le nom d'opération Cyclone, Washington a décidé de demander notre aide, étant un allié clé avec une influence régionale.\nLes responsables de la CIA ont fait une demande pour un match dollar pour un dollar sur une aide secrète américaine fournie aux Mujahideen, faisant valoir que notre gouvernement a déjà soutenu les groupes islamistes et qu'il serait dans notre intérêt stratégique d'aider. Certains chiffres de notre gouvernement le considèrent comme une perte de temps et de ressources, tandis que d'autres disent que le moment est maintenant pour la projection de puissance et nous avons beaucoup de fonds à contribuer. Comment choisirons-nous?"
 CIA_CYCLONE.5.desc:0 "Le chef de la station de la CIA de Riyad a rapporté à Langley que le gouvernement saoudien avait accepté notre demande de jumelage de fonds pour un dollar qui sont appropriés pour aider les Mujahidid en Afghanistan. Notre contact au sein de la Chambre de Saud a indiqué que des membres de la famille royale saoudienne étaient réticents, mais ont finalement décidé de se mettre d'accord sur la base de l'immense richesse qu'ils avaient et du potentiel de future influence géopolitique saoudienne.\nLa réponse à Langley et à Washington a été bonne. Les agents en Afghanistan seront bientôt informés, à leur grand plaisir. Plus d'argent coulera vers les combattants de la liberté de la résistance afghane maintenant."
 CIA_CYCLONE.6.desc:0 "Malheureusement, le chef de la station de la CIA à Riyad a rapporté à Langley que le gouvernement saoudien avait rejeté nos demandes répétées de fonds de fonds pour un dollar pour l'aide et des armes allant aux Mujahidides en Afghanistan. Notre contact dans la maison de Saud a également indiqué que la famille royale saoudienne semblait réticente et a finalement refusé pour la réputation et le fait que cela peut être une perte de temps et de ressources précieuses.\nLa réponse à Washington a été muette. Bien que le président et le Conseil de sécurité nationale soient informés, il est préférable de laisser les agents sur le terrain en Afghanistan dans l'obscurité sur celui-ci, car leur fournir plus de mauvaises nouvelles pour le moment ne servira pas à aider la résistance afghane que nous soutenons."
 CIA_CYCLONE.7.desc:0 "Bureau de l'Afghanistan, Bureau de l'Analyse de l'Asie du Sud-Est, Direction du Renseignement  \nSECRET/NOFORN  \n\nContexte : Dans un effort pour renforcer la résolution idéologique des moujahidines afghans, les agents de la CIA ont proposé une campagne secrète pour distribuer des manuels militants aux groupes de résistance. Ces manuels, conçus pour promouvoir des idéologies anti-communistes et pro-islamistes, visent à renforcer la base idéologique des combattants moujahidines, en particulier parmi les jeunes recrues.  \n\nAnalyse : La distribution de ces manuels pourrait améliorer la cohésion et la motivation des moujahidines, notamment dans les zones rurales où l'éducation est limitée. Cependant, il existe un risque que le matériel soit perçu comme de la propagande étrangère, ce qui pourrait aliénier les populations locales ou des factions au sein de la résistance.  \n\nRecommandations : Ce Bureau recommande de poursuivre la distribution des manuels, mais avec une supervision attentive pour s'assurer que le matériel est en accord avec les valeurs culturelles et religieuses locales. La coordination avec les services de renseignement pakistanais (ISI) et les dirigeants locaux des moujahidines sera essentielle au succès de cette opération."
 CIA_CYCLONE.8.desc:0 "Bureau de l'Afghanistan, Bureau de l'Analyse de l'Asie du Sud-Est, Direction du Renseignement  \nSECRET/NOFORN  \n\nContexte : Des rapports récents de renseignement indiquent que certaines factions au sein des moujahidines afghans distribuent de la propagande fondamentaliste promouvant des idéologies extrémistes. Cela représente un risque pour les intérêts des États-Unis, car cela pourrait conduire à la montée de groupes radicaux qui, à terme, pourraient se retourner contre les États-Unis et leurs alliés.  \n\nAnalyse : Bien que l'objectif immédiat soit de vaincre les forces soviétiques, les implications à long terme du soutien aux groupes fondamentalistes pourraient être préjudiciables. Ce Bureau recommande de prendre des mesures pour atténuer la diffusion de la propagande extrémiste, en particulier parmi les factions recevant le soutien des États-Unis.  \n\nRecommandations : Les agents de la CIA devraient collaborer avec des dirigeants modérés des moujahidines pour contrer l'influence de la propagande fondamentaliste. Cela pourrait inclure la distribution de matériaux alternatifs promouvant une interprétation plus modérée de l'Islam et de l'anticommunisme."
 CIA_CYCLONE.9.desc:0 "Bureau afghan, bureau de l'analyse d'Asie du Sud-Est, Direction des renseignements\nSecret / Noforn\nL'intelligence et l'analyse récentes sur le mouvement émergent des Mujahideen afghan ont révélé une étoile montante dans le groupe de sept groupes disparates connus sous le nom de Peshawar Seven: un commandant principal nommé Ahmad Shah Massoud. Ce bureau recommande de soutenir Massoud et ses forces, en raison de sa popularité et de sa compétence tactique contre les forces soviétiques et pro-soviétiques sur le champ de bataille.\nDevenant initialement influente dans le monde politique islamiste au début des années 1970 alors qu'il était à l'Université de Kaboul, Massoud est devenu militairement connu après avoir participé à la rébellion de Panjshir de 1975, qui, tout en étant dans l'ensemble, a entraîné Massoud se faire un nom dans le mouvement islamiste, qui commençait un schisme entre les modérés comme des groupes de Massoud et plus fondamentalistes tels que les groupes HEZB-EaSlami par Gulbuddine comme les groupes plus fondamentalistes tels que le hezb-eslamid par Gulgo Hekmaytar.\nDepuis la révolution de Saur et plus tard, l'invasion soviétique, Massoud a eu une influence en tant que commandant sur le terrain, effectuant une guerre asymétrique et attaquant des convois soviétiques dans le col de Salang. Dans les premières parties de la campagne, Massoud a effectivement pu garder les forces soviétiques attachées tandis que d'autres forces de Mujahideen s'engagent dans d'autres parties du pays.\nNos actifs sur le terrain et ce bureau croient que Massoud est la meilleure option pour que les groupes de Mujahideen éminents à soutenir, car son groupe Jamiat-I Islami est plus efficace et moins fondamentaliste que le groupe Islami Hezb-E, dirigée par Hekmaytar, qui, tout en étant sous le même parapluie que Massoud, reste un fort ennemi de son."
 CIA_CYCLONE.10.desc:0 "Les nouvelles sont venues de Washington, via nos contacts sur le terrain et via l'ISI à Islamabad, que la CIA américaine a décidé de soutenir notre faction de combattants mujahidines sous le parti de l'islam Jamiat-I. C'est une excellente nouvelle, car nous avons remarqué que Langley, ignorant largement l'opposition à nos forces des Pakistanais, nous regardent depuis un certain temps, car les Américains ressentent le besoin d'intervenir contre les efforts d'expansion soviétique, en particulier en Asie."
 CIA_CYCLONE.11.desc:0 "AFGHANISTAN : ALIGNEMENT STRATÉGIQUE AVEC LES ALLIÉS RÉGIONAUX  \nBureau de l'Afghanistan, Bureau de l'Analyse de l'Asie du Sud-Est, Direction du Renseignement  \nSECRET/NOFORN  \nContexte : Les États-Unis font face à une décision critique en Afghanistan : s'aligner davantage avec le Pakistan et sa faction de moujahidines préférée, le Hezb-e Islami de Gulbuddin Hekmatyar, ou soutenir la faction plus modérée de Jamiat-i Islami d'Ahmad Shah Massoud, favorisée par les alliés occidentaux. Les Services de renseignement interarmées du Pakistan (ISI) ont été un partenaire clé dans la région, mais l'idéologie fondamentaliste de Hekmatyar présente des risques à long terme. Massoud, bien qu'étant moins aligné avec le Pakistan, représente une alternative plus modérée et potentiellement stable.  \nAnalyse : S'aligner avec le Pakistan et Hekmatyar renforcerait les liens avec un allié régional critique et garantirait un soutien logistique continu pour les opérations des moujahidines. Cependant, les tendances extrémistes de Hekmatyar pourraient conduire à une instabilité future. Soutenir Massoud, en revanche, s'aligne avec les valeurs occidentales et pourrait favoriser un Afghanistan plus stable après la guerre soviétique, mais cela risquerait d'aliéner le Pakistan et compliquerait la logistique régionale.  \nRecommandations : Ce Bureau recommande une approche équilibrée. Tout en maintenant la coopération avec le Pakistan, les États-Unis devraient progressivement orienter leur soutien vers la faction de Massoud, en utilisant les alliés occidentaux pour atténuer les risques d'aliéner Islamabad."
 CIA_CYCLONE.12.desc:0 "Bureau de l'Afghanistan, Bureau de l'Analyse de l'Asie du Sud-Est, Direction du Renseignement  \nSECRET/NOFORN  \nDes rapports récents de renseignement et la coopération avec les Services de renseignement interarmées du Pakistan (ISI) ont révélé un nouveau joueur parmi les sept groupes disparates connus sous le nom de Peshawar Seven dans la résistance des moujahidines afghans : le commandant senior et leader fondamentaliste Gulbuddin Hekmatyar. Ce Bureau, ayant reçu des rapports du personnel sur le terrain et de l'ISI, recommande de soutenir Hekmatyar en raison de ses capacités, de sa position stratégique et de ses liens amicaux avec d'autres pays alliés anti-communistes dans la région, à savoir le Pakistan.  \nHekmatyar a commencé son incursion dans la communauté islamiste afghane à la fin des années 1960 lorsqu'il a fréquenté l'Université de Kaboul en tant qu'étudiant en génie, se rapprochant, puis devenant ennemi, d'Ahmad Shah Massoud, plus réformiste, qui commande également une faction de moujahidines dans le Peshawar Seven. Devenu plus radical, Hekmatyar a fondé le Hezb-e Islami à partir de parties de la Jeunesse musulmane en 1975 après un schisme idéologique.  \nAyant vécu et s'étant entraîné au Pakistan pendant les années suivantes, Hekmatyar et ses forces bénéficient d'un fort soutien du gouvernement et des services de sécurité pakistanais, qui ont mis en place des camps pour les former. Avant l'invasion soviétique, les forces de Hekmatyar étaient basées dans trois camps de réfugiés au Pakistan, où elles se trouvent actuellement.  \nHekmatyar est un commandant de combat efficace, et son inclination idéologique islamique a attiré la majeure partie de l'aide d'Islamabad. Cependant, en termes de capacités futures, le soutien exclusif du Pakistan ne suffira pas pour une solution à long terme en Afghanistan. Soutenir Hekmatyar, en particulier avec des armes, permettra de sécuriser un point d'appui à l'intérieur de l'Afghanistan pour repousser efficacement les forces soviétiques."
 CIA_CYCLONE.13.desc:0 "Les nouvelles sont venues de Washington via Islamabad que les Américains ont décidé de nous soutenir militairement et financièrement via leurs agents de la CIA. Hekmatyar est ravi, tout comme les membres supérieurs de son parti politique Hezb-E Islami. Dans un message de Langley, les Américains ont déclaré qu'ils \"souhaitent que nos forces prennent pied en Afghanistan\" et que \"les expéditions d'armes supplémentaires des États-Unis devraient aider à cet objectif\". La réaction de nos contacts au sein des services de sécurité pakistanaise a également été bonne, notant que leurs efforts pour nous insérer aux Américains ont fonctionné jusqu'à présent."
 CIA_CYCLONE.14.desc:0 "\"Donc, si nous voulons aider les Mujahideen, mais que nous ne voulons pas nous impliquer avec les Pakistanais, que faisons-nous?\" Un analyste afghan supérieur se pencha en arrière sur sa chaise, où les analystes du bureau de l'analyse d'Asie du Sud-Est avaient une réunion du matin, avec l'inclusion de certains officiers des opérations.\n\"Eh bien,\" un autre analyste a piqué \", je pense que nous avons établi que l'ISI soutient des éléments plus durs au sein des Mujahidides, avec lesquels nous sommes en désaccord. Il y a moins d'éléments fondamentalistes, mais les armer directement peut être difficile, surtout si nous ne travaillons pas avec les Pakistanais.\" Il a fait un geste vers les officiers des OPS assis à l'autre bout de la table. \"Vous avez des idées?\"\nLes officiers OPS hochèrent la tête, regardant quelques notes. «Nous pourrions être en mesure d'établir de nouvelles routes de contrebande via Ahmad Shah Massoud, un commandant de Mujahideen moins fondamentaliste qui contrôle le territoire dans la partie nord du pays, loin de la frontière pakistanaise. Nous pouvons être en mesure d'organiser des opérations de contrebande via le nord du Pakistan, ou via le Kashmir, permettre à sa faction, qui reste opposée à Hekmay, ou via le Kashmir, à sa faction, qui reste à s'opposer à Hekmay, ou via le Kashmir, pour être en train de se faire face à l'ancienne, qui est restée opposée à HEKMAYTO soutenu. \"\nLe chef du bureau, un ancien officier sur le terrain des décennies auparavant, a hoché la tête. \"Allez-y. Je vais informer le DCI et le Conseil de sécurité nationale une fois que nous aurons un plan. Mettez nos hommes sur le terrain le message. Merci, tout le monde.\""
 CIA_CYCLONE.15.desc:0 "Bureau de l'Afghanistan et Bureau du Pakistan, Bureau de l'Analyse de l'Asie du Sud-Est, Direction du Renseignement  \nSECRET/NOFORN  \nLa relation des États-Unis avec les Services de renseignement interarmées du Pakistan (ISI) a été tendue, notamment en raison de leur implication dans le soutien aux moujahidines afghans, en particulier une faction fondamentaliste dirigée par Gulbuddin Hekmatyar. Cependant, les fortes connexions de l'ISI avec la faction de Hekmatyar, connue sous le nom de Hezb-e Islami, se sont révélées efficaces militairement pour repousser les avancées soviétiques dans la zone de contrôle d'Hekmatyar, située principalement au nord-ouest de la capitale Kaboul.  \nBien que la faction d'Hekmatyar semble plus fondamentaliste que les autres factions islamistes composant le mouvement des moujahidines afghans dans son ensemble, la coopération et l'armement de cette faction augmenteraient à la fois l'efficacité au combat des forces d'Hekmatyar, tout en renforçant la coopération de la CIA avec l'ISI et la planification d'opérations spécifiques.  \nIl existe une inquiétude importante au sein de l'Agence quant au soutien à l'ISI et à Hekmatyar en raison du fondamentalisme idéologique de sa faction, contrairement à d'autres commandants moujahidines tels qu'Ahmad Shah Massoud. Cependant, ce Bureau recommande de soutenir les opérations actuelles de l'ISI pour assister Hekmatyar, car cela semble être la solution la plus avantageuse dans la situation actuelle pour les États-Unis."
 CIA_CYCLONE.16.desc:0 "\"Pourquoi ne pas déplacer nos opérations de trafic vers l'Iran?\" L'un des analystes de bureau afghanistan a interrogé, en regardant un agent des opérations assis à travers la table de la salle de conférence de lui. \"Quoi?\" L'officier des OPS leva les yeux de ses notes, avec un regard incrédule sur son visage. \"Êtes-vous sérieux? Grâce à l'Iran?\" \"Oui. Massoud est trop réformiste pour atteindre des objectifs politiques, et Hekmatyar et les Pakistanais sont trop fondamentalistes. La seule autre option que nous avons pour le soutien est les milices chiites, qui ont été financées par Téhéran. \"Il est logique. Qui contacterait les Iraniens? Nous avons besoin d'un contact qui est directement avec l'IRGC, et une grande partie de leur logistique serait nécessaire pour déplacer des armes à Hazarajat où se trouvent les chiites.\" L'analyste est mal vu. \"Nous devrons y examiner davantage, en particulier avec les canaux de communication, mais il y a sûrement quelques chiffres dans le CRGC et à Téhéran qui approuveraient une aide aux États-Unis, juste une fois. Il est difficile de l'assurer, surtout depuis 1979, mais nous pourrions le faire fonctionner.\" Le chef du bureau de l'analyse du sud-asiatique a souri. \"Écrivez-le, vous deux. Je veux bientôt un projet de proposition, et pour vous tous de contacter nos hommes et de leur faire part du nouveau plan possible. Merci.\""
 CIA_CYCLONE.17.desc:0 "Bureau de l'Afghanistan, Bureau de l'Analyse de l'Asie du Sud-Est, Direction du Renseignement ; Direction des Opérations  \nSECRET/NOFORN  \nDes évaluations récentes des combats et des dommages subis par les forces menées par la Défense Intelligence Agency et le National Reconnaissance Office ont mis en évidence l'efficacité des combattants moujahidines afghans dans leurs opérations contre les forces soviétiques et les forces pro-régime afghanes. Les rapports en provenance du terrain en Afghanistan indiquent que bien que les moujahidines soient bien équipés en hommes, ils manquent de munitions et d'autres équipements de combat. Les responsables politiques de l'administration de [USA.GetLeader] ont exprimé leur désir d'augmenter les envois d'armements, mais sont partagés sur le type d'équipement à fournir.  \nCertains partisans de l'envoi d'équipements plus anciens, comme des obusiers soviétiques D-20 et des fusils d'assaut AK-74, soutiennent que bien que tactiquement inférieurs, ces équipements offrent une plausible dénégation et peuvent facilement se fondre dans le décor face aux forces soviétiques occupantes. D'autres analystes et membres du personnel sur le terrain poussent en revanche pour des équipements plus modernes, comme le fusil M-4, l'obusier M-198 et le missile Stinger de type sol-air portable. Fournir ces équipements aux moujahidines garantirait une plus grande efficacité au combat, mais réduirait la plausible dénégation et pourrait être perçu comme une escalade par les Soviétiques et la communauté internationale. De leur côté, les Pakistanais semblent neutres, mais penchent en faveur de fournir un équipement de style soviétique aux combattants.  \nQuelle que soit la décision, elle augmenterait considérablement les capacités de combat des moujahidines, mais pas nécessairement leur efficacité au combat. Les partisans de l'équipement moderne soutiennent que l'armement des combattants avec des Stingers leur permettrait de abattre les hélicoptères de combat soviétiques, qui représentent la menace la plus sérieuse pour leur survie jusqu'à présent. Une décision doit être prise rapidement."
 CIA_CYCLONE.18.desc:0 "Bureau de l'Afghanistan, Bureau de l'Analyse de l'Asie du Sud-Est, Direction du Renseignement  \nSECRET/NOFORN  \nDepuis l'invasion soviétique en Afghanistan, un large débat a eu lieu à Langley sur la composition des forces de résistance afghanes \"moujahidines\", notamment leur idéologie et leur efficacité au combat, ainsi que sur la question de savoir s'il faut les soutenir. De manière générale, le personnel sur le terrain et les analystes aux États-Unis s'accordent à dire que le groupe principal de moujahidines, les Sept de Peshawar, mérite le plus de soutien. Cependant, un nouveau groupe de résistance aux Soviétiques a émergé, issu de l'autre côté du spectre idéologique : le Front des Combattants pour la Liberté des Moujahidines d'Afghanistan (AMFF), composé de quatre factions paramilitaires maoïstes et islamistes modérées : le Mouvement de la Révolution Islamique, l'Organisation de la Libération d'Afghanistan, l'Organisation de la Libération du Peuple Afghan et le Front National de Libération d'Afghanistan.  \nBien qu'anti-soviétiques, l'AMFF reste pro-Pékin, adhérant principalement à une idéologie maoïste tout en intégrant des éléments d'idéologie islamiste modérée. Bien qu'ils restent opposés au régime PDPA actuel et aux forces soviétiques d'occupation, ils représentent toujours une menace pour les intérêts des États-Unis, particulièrement s'ils gagnent en influence dans un futur règlement islamiste post-PDPA.  \nCe Bureau recommande officiellement de restreindre les transferts d'armes à l'AMFF, car ce groupe n'est pas dans les intérêts des États-Unis et lui fournir des armes serait contre-productif pour les objectifs américains dans la région. Au lieu de cela, il reste plus viable de continuer à soutenir d'autres groupes de résistance islamistes tels que les Sept de Peshawar."
 CIA_CYCLONE.19.desc:0 "Bureau de l'Afghanistan, Bureau de l'Analyse de l'Asie du Sud-Est, Direction du Renseignement  \nSECRET/NOFORN  \nDepuis l'invasion soviétique en Afghanistan, un grand débat a eu lieu à Langley concernant la composition des forces de résistance afghanes \"moujahidines\", leur idéologie et leur efficacité au combat, ainsi que la question de savoir s'il convient de les soutenir. De manière générale, le personnel sur le terrain et les analystes aux États-Unis s'accordent à dire que le groupe principal de moujahidines, les Sept de Peshawar, mérite le plus de soutien. Cependant, un nouveau groupe de résistance aux Soviétiques a émergé, venant de l'autre côté du spectre idéologique : le Front des Combattants pour la Liberté des Moujahidines d'Afghanistan (AMFF), composé de quatre factions paramilitaires maoïstes et islamistes modérées : le Mouvement de la Révolution Islamique, l'Organisation de la Libération d'Afghanistan, l'Organisation de la Libération du Peuple Afghan et le Front National de Libération d'Afghanistan.  \nIdéologiquement plus à gauche que le PDPA pro-soviétique en place, et combinant des idéologies pro-Pékin qui ne sont pas acceptées par le régime actuel, l'AMFF s'est présenté comme un choix intéressant à soutenir. Bien que n'ayant pas consulté nos alliés pakistanais, le personnel sur le terrain et les analystes à Langley, y compris ce Bureau, recommandent d'autoriser les envois d'armes à l'AMFF, principalement des armes soviétiques anciennes et obsolètes, telles que des fusils d'assaut AK-74 et des obusiers D-20.  \nBien qu'il soit possible d'attirer la colère des conservateurs ici aux États-Unis, cette décision d'autoriser les envois d'armes est la bonne, car elle aidera toutes les forces anti-soviétiques à atteindre leurs objectifs et à mettre fin à la domination communiste en Asie centrale."
 CIA_CYCLONE.20.desc:0 "Nous avons reçu un coup de contact américain selon lequel la US Central Intelligence Agency, avec la permission du président [USA.GetLeader], a autorisé les expéditions d'armes de nos forces. Dans un bref message à nos dirigeants, l'agent américain de la CIA nous a informés que \"vous recevrez des stocks de fusils d'assaut AK-74 et d'obusiers D-20 à utiliser contre les forces pro-PDPA soviétiques et afghanes\". Les Américains, cependant, souhaitent garder cette secrète, selon notre source, car ils craignent de soutenir les mouvements communistes seraient contre-productifs pour leur messagerie publique. Nos dirigeants sont satisfaits de cette évolution et attendent avec impatience plus d'informations sur la logistique de transfert de notre nouvelle liaison de la CIA."
 CIA_CYCLONE.21.desc:0 "Bureau des Républiques Socialistes Soviétiques Centrales, Bureau de l'Analyse Soviétique, Direction du Renseignement  \nSECRET/NOFORN \nDepuis que les États-Unis ont déterminé que nos programmes en Afghanistan et au Pakistan ont initialement réussi à accroître le sentiment militariste anti-soviétique parmi les populations, la prochaine étape logique consiste à étendre cette stratégie aux Républiques Socialistes Soviétiques de la région d'Asie Centrale, y compris les SSR du Turkménistan, de l'Ouzbékistan et du Tadjikistan, en renforçant le militarisme anti-soviétique parmi ces populations, particulièrement dans les zones rurales, et en diffusant le mouvement à l'intérieur même de l'Union Soviétique.  \nUn canal utile pour atteindre les populations de cette région pourrait être les organisations musulmanes, telles que l'Administration Spirituelle des Musulmans d'Asie Centrale et du Kazakhstan (SADUM), qui coordonne globalement les activités musulmanes dans la région sous l’égide de l'État. Déterminer les premières informations sur la population via ces moyens, et peut-être orienter nos opérations vers l'infiltration des clercs locaux et des imams, pourrait s'avérer particulièrement utile pour propager le message.  \nIl est également important de s'appuyer sur les alliés pakistanais et afghans existants, qui peuvent avoir des connexions de l'autre côté de la frontière, en Union Soviétique. Bien qu'il soit impératif que les opérateurs maintiennent une sécurité opérationnelle stricte dans leurs contacts avec les alliés et partenaires, afin de ne pas attirer l'attention du KGB, faire circuler des rumeurs est également encouragé, afin de construire un sentiment de mystère et de paranoïa autour du mouvement anti-soviétique.  \nLangley et le Président attendent des résultats dans les plus brefs délais. Nous comptons sur vous."
 CIA_CYCLONE.22.desc:0 "Bill restait occupé à l'ambassade ce matin alors qu'il se faisait rattraper des documents de routine, rapporte les affaires et les autres officiers politiques travaillant ici à Islamabad. Terminant sa deuxième tasse de café depuis qu'il était au bureau ce matin, il se pencha en arrière, poussant un soupir de soulagement pour être de retour derrière un bureau. Les \"vacances\" qu'il avait emmenées, les expéditions à la frontière afghane, avaient beaucoup pris et, devoir suivre cette couverture, c'était épuisant.\nUn coup au cadre de la porte le secoua de sa rêverie alors qu'il se tournait vers un jeune officier marin, frais du centre de communication, avec un glissement de télex. \"Message pour vous, monsieur. C'est crypté.\"\n\"Merci, caporal de Lance. En avoir un bon.\" Alors que le Marine commençait à partir, il a attrapé un pavé unique et a commencé à décoder le télex codé.\nDe: Seasia Desk, D / Operations, Langley\nÀ: Usembassy Islamabad\nSecret / Noforn\nLangley veut explorer la possibilité de se connecter avec un GPS musulman SOV. Le GPS dissident peut soutenir les OP Mujahideen. Rapport avec réponse du GPS. FIN.\n\"Condamner.\" Je suppose qu'il devrait prendre une autre \"vacances\" et rencontrer à nouveau ses collègues. Il pourrait cependant passer quelques appels d'ici. Il pourrait y avoir des groupes d'expatriés ici au Pakistan, et il y avait certainement de petites cellules dans les SSR d'Asie centrale qui pourraient s'avérer utiles."
 CIA_CYCLONE.23.desc:0 "PRIORITY MESSAGE\nFROM: US EMBASSY ISLAMABAD  \nTO: SEASIA DESK, D/OPERATIONS, LANGLEY  \nSECRET/NOFORN  \nLes informations en provenance de Peshawar signalent une intensification des tensions entre les factions fondamentalistes. Ces tensions semblent être liées à des divergences idéologiques et à des perspectives stratégiques face aux Soviétiques. Il est recommandé de rester à l’écart de ces conflits internes ou de chercher des efforts de conciliation. Les factions pourraient travailler ensemble si des menaces de suspension des envois d’armements sont formulées. Demande d'une réponse immédiate concernant les prochaines opérations. FIN\nL’officier de veille du Bureau Asie du Sud-Est laissa tomber le câble sur son bureau, poussant un soupir. Au moins, c'était encore le milieu de la journée. Il décrocha le téléphone interne, et en l’espace de deux minutes, tous ses collègues, analystes et agents des opérations, étaient regroupés autour de son petit bureau."
 CIA_CYCLONE.24.desc:0 "\"Monsieur le Président, je suis ici avec un rapport ce matin sur l'Afghanistan. Langley a été occupé à analyser la dynamique interne des groupes Mujahideen les uns avec les autres et en utilisant des rapports sur le terrain, nous avons une proposition pour vous.\"\nLe président [USA.GetLeader] s'est penché en arrière du bureau résolu, regardant le directeur du renseignement central [GetCurrentCIADir] entrant dans l'ovale, flanqué de conseiller à la sécurité nationale [GetCurrentNatSecAdv]. Le président s'est frotté les yeux, imaginant le sommeil qu'il perdrait bientôt à ce sujet. Il a lu la première phrase du rapport: \"Nous recommandons la formation d'une coalition unifiée de Mujahideen soutenue par les États-Unis comprenant les factions suivantes: les forces de Massoud, les forces de Hekmatyar, les Fordters de la liberté des Mujahideen Afghanistan et les milices shi'ite.\"\n\"C'est certainement quelque chose\", a-t-il dit, en regardant le DCI et en renvoyant le rapport sur le bureau. Le DCI, regardant vers le bas, s'éclaircit la gorge. \"Monsieur, cela peut sembler impossible, mais nos agents au Pakistan et en Afghanistan nous ont assuré que cela pourrait être possible.\"\n\"Êtes-vous sûr? Je me souviens avoir reçu des séances d'information de temps en temps que les factions, en particulier Massoud et Hekmatyar, semblent avoir des problèmes internes; et pensons-nous vraiment qu'ils vont travailler avec les Shias? Pour le bien de Dieu, comment est-il réaliste?\"\n[GetCurrentNatSecAdv] a pris la parole. \"Monsieur le président, la meilleure chose que nous puissions faire est de tendre la main à chaque faction et de proposer une réunion pour former cette coalition. Le pire des cas serait un retour au statu quo, car chaque faction n'a pas la capacité de s'attaquer sans s'ouvrir à être attaquée par les Soviétiques; et nous pouvons continuer à soutenir la faction.\"\n\"Très bien, les hommes. Vous avez ma permission d'ordonner aux agents de mettre en place une réunion; de préférence au Pakistan, de chercher une coalition. Je veux des rapports quotidiens à ce sujet.\" Le président hocha la tête.\n\"Oui Monsieur.\" Les deux hommes ont hoché la tête avant de quitter la pièce. Le président soupira à haute voix dans sa chambre vide, avant de se retourner à la lecture du rapport."
 CIA_CYCLONE.25.desc:0 "Nos contacts américains de la CIA ont contacté nos dirigeants avec une proposition audacieuse et nouvelle: former une coalition anti-communiste unifiée et anti-soviétique de combattants de résistance afghane.\nNos dirigeants, choqués par cette évolution, ont été assurés par leurs gestionnaires à Islamabad et à Washington qu'en dépit des différences fortes et parfois violentes entre les factions de Mujahideen, toutes les factions devraient travailler ensemble dans un accord commun pour mettre de côté les différences en faveur de la défaite des autorités soviétiques occupantes et du régime PDPA à Kaboul.\nCertains dans notre faction ont des inquiétudes, telles que les différences idéologiques et les préoccupations concernant la coordination et le commandement qui n'ont pas été clarifiées par les Américains ou les Pakistanais. Ceci est une préoccupation considérable et peut nous empêcher de rejoindre cette coalition. Comment devrions-nous choisir?"
 CIA_CYCLONE.26.desc:0 "Selon nos contacts en Afghanistan, les quatre factions majeures de Mujahideen, notamment les forces de Massoud, les forces de Hekmatyar, les milices de la liberté des Mujahideen maoïstes, et les milices chiites afghanistan ont convenu de former une coalition unifiée dirigée par nous et financé par les États-Unis, Pakistan, SAUDIAAD, et Britain.\nCela représente un développement stratégique massif dans le conflit contre les forces d'occupation soviétiques, et signifie que les factions en guerre ont convenu de mettre fin à leurs différences pour le moment pour combattre les forces soviétiques stationnées dans le pays. Langley se prépare à informer le président ainsi qu'à publier une déclaration conjointe avec le Département d'État dans les prochains jours."
 CIA_CYCLONE.27.desc:0 "Malheureusement, selon nos contacts en Afghanistan, plusieurs des principales factions de Mujahideen, notamment les forces de Massoud, les Forces de Hekmatyar, les Fondations maoïstes de l'Afghanistan Mujahideen Freedom Front, et les miliciens chiites financés par Téhranis ont rejeté nos propositions pour une coalition anti-Soviet anti-comigiste unifiée unifiée. Énonçant «les préoccupations concernant la coordination» et exprimant les différences idéologiques et personnelles entre les factions, tout espoir d'unification contre les forces soviétiques actuellement stationnées dans le pays est probablement perdu, et chaque faction continuera de se battre seul.\nLe président a été informé et reste déçu par ce développement, le reste du Conseil de sécurité nationale. La guerre en Afghanistan continue."
 CIA_CYCLONE.29.desc:0 "Alors que le président entrait dans la réunion hebdomadaire du Conseil de sécurité nationale, il a fait signe aux hommes de s'asseoir alors qu'il prenait également place. \"Bonjour, messieurs. Commençons par les points à l'ordre du jour.\"\nLe conseiller de la sécurité nationale [GetCurrentNatSecAdv] a commencé. \"Vous l'avez compris, M. Président. Le premier est l'Afghanistan. L'État a une proposition qui a été examinée par la défense qui propose de reconnaître un groupe de factions connues sous le nom de Peshawar Seven; ils penchent l'islamiste fondamentaliste, mais ont eu un plus grand succès contre les soviets.\nLe secrétaire d'État [GetCurrentSecState] s'est levé, lissant sa cravate. \"Voyant que cela venait de nous, je vais faire bref: reconnaître diplomatiquement le Peshawar Seven comme le gouvernement légitime de l'Afghanistan ouvrira de nombreuses portes pour nous; y compris rendre la communication et les relations plus légitimes.\" Il a vaguement lancé DCI [GetCurrentCIADir] avant de continuer. \"Le Pentagone est d'accord, cela facilitera les expéditions d'armes, d'autant plus que nous n'aurons pas à le faire secrètement. Ils opéreraient simplement en tant que gouvernement en exil au Pakistan, où ils sont actuellement.\"\nLe président hocha la tête. Le DCI se leva alors, secouant la tête. \"Recognizing them would be pure folly. While our cooperation with the mujahideen is good now, there’s not much certainty they’d be willing to work with us in the future, especially if we recognize them; they can simply move to other benefactors. Also, legitimizing arms shipments opens the door to more dangerous implications, it’d be seen as a provocation against the Soviets, which, while I’d love, we need to maintain covertness to have Denabilité plausible.\nHochant à nouveau la tête, le président a arrêté le mur de bruit dans la pièce alors que le DCI s'assit. \"Maintenant que j'ai entendu les deux parties et que tous les membres ici ont délibéré, je pense que j'ai décidé. State et la CIA livrera une déclaration conjointe de la Maison Blanche demain annonçant notre reconnaissance des sept. Imposer que cela est de contrer la partie de l'agression soviétique et qu'il y a des gardiens clairs pour empêcher la corruption et les abus sur la partie du Mujahideen, et permettez-nous d'aller à travers le Pentagon et Usaid Aide pour commencer.\""
 CIA_CYCLONE.31.desc:0 "Alors que le président entrait dans la réunion hebdomadaire du Conseil de sécurité nationale, il a fait signe aux hommes de s'asseoir alors qu'il prenait également place. \"Bonjour, messieurs. Commençons par les points à l'ordre du jour.\"\nLe conseiller de la sécurité nationale [GetCurrentNatSecAdv] a commencé. \"Vous l'avez compris, M. Président. Le premier est l'Afghanistan. L'État a une proposition qui a été examinée par la défense qui propose de reconnaître un groupe de factions connues sous le nom de Téhéran huit.\" Principalement soutenues par les Iraniens, ils sont des milices chiites plus petites et moins traditionnelles qui opèrent dans la région stratégique de Hazara. L'État pense qu'après notre rapprochement initial avec Téhéran, cette décision serait une aide supplémentaire aux relations avec eux. \"\nDCI [GetCurrentCIADir] a hoché la tête en accord. \"Langley pense que les reconnaître aiderait le déni plausible et éviterait le soutien américain de forces plus grandes mais plus fondamentalistes à Peshawar qui pourraient bien se terminer à l'avenir.\"\nLe président hocha la tête. \"Je vois. Et je suppose que les Pakistanais ne se joindraient pas à nous dans cette décision?\"\nLe secrétaire d'État [GetCurrentSecState] secoua la tête. \"Le Pakistan continuera probablement de soutenir les groupes les plus traditionnels, ils les ont basés;\nLe président des Chiefs conjoints, pas du genre à contribuer beaucoup, se leva, secouant la tête. \"Monsieur, je sais que cela n'implique pas de troupes en service actif, mais j'ai des inquiétudes directes sur la façon dont les États-Unis fournissent des milices plus petites généreront de vrais gains contre les Soviétiques, lorsqu'il y a des groupes plus grands que nous pourrions plus facilement soutenir.\"\nLe DCI hocha à nouveau la tête. \"La pensée de Langley est que si nous sommes combinés du soutien américain-iranien, leurs capacités tactiques et stratégiques seront augmentées par rapport à ce qu'elles sont maintenant.\"\nLe président hocha la tête. \"Très bien alors. État, DCI, vous préparerez une déclaration conjointe de la reconnaissance. Defence, demandez au Pentagone de commencer un bilan sur l'aide et la communication."
 CIA_CYCLONE.28.desc:0 "Dans une déclaration conjointe de la Maison Blanche, du Conseil de sécurité nationale et de la Central Intelligence Agency Today, les États-Unis ont annoncé la formation d'une \"Coalition anti-soviétique anti-communiste en Afghanistan\" composée de forces dirigée par Ahmad Shah Massoud et Gulbuddin Hekmaytar, ainsi que les militaires maïstes et la shiite.\nCela représente un développement stratégique dans le conflit de guérilla à faible intensité en Afghanistan depuis l'invasion soviétique; Le commentaire initial de l'ambassadeur soviétique aux États-Unis a été un choc, puis la colère. Il n'est pas clair quelle sera la réponse soviétique, ni si le conflit s'intensifie en dehors de la région."
 CIA_CYCLONE.30.desc:0 "Dans une déclaration conjointe de Washington, le secrétaire d'État des États-Unis [GetCurrentSecState] et le directeur du renseignement central [GetCurrentCIADir] ont annoncé la reconnaissance américaine d'une alliance lâche de sept groupes afghans Mujahideen connus sous le nom de Peshawar Seven. Sur la base de la ville pakistanaise de Peshawar, ces groupes islamistes sont dirigés par les commandants Ahmad Shah Massoud et Gulbuddin Hekmatyar, tous deux des combattants de guérilla qualifiés dans le conflit actuel contre les forces soviétiques occupant les forces et le régime PDPA dirigeant à Kaboul.\nLa réaction internationale à cette annonce a été mitigée; L'implication dans le conflit afghan s'est jusqu'à présent limité aux États-Unis, au Pakistan et en Arabie saoudite, tous ceux qui ont fourni une aide militaire et financière. On suppose que le Kremlin ne réagira pas bien à cela, avec ses marionnettes."
 CIA_CYCLONE.32.desc:0 "Dans une déclaration conjointe de Washington, le secrétaire d'État des États-Unis [GetCurrentSecState] et le directeur du renseignement central [GetCurrentCIADir] ont annoncé la reconnaissance américaine d'une alliance lâche de huit groupes de milices de Mujahideen afghan connues sous le nom de Téhéran huit. Financé et soutenu par l'Iran, et presque complètement musulman chiite par rapport aux grands groupes de milices sunnites afghans, ce soutien reste un point de contact dans les relations américano-iraniennes, en particulier dans le récent rapprochement plus tôt dans la décennie.\nLa réaction internationale à cette annonce a été mitigée; Les réactions en Afghanistan ont été négatives, préférant que les États-Unis reconnaissent plutôt les plus grands groupes de Mujahideen. On ne sait pas comment les Soviétiques réagiront, mais cela ne peut pas aller bien, avec leurs marionnettes."
 CIA_WER.0.desc:0 "Depuis la fin de la Seconde Guerre mondiale et la mise en place de l'ordre de sécurité d'après-guerre par le biais de l'Organisation du Traité de l'Atlantique Nord (OTAN), l'Europe occidentale a, dans l'ensemble, évité d'élire des gouvernements communistes, soit grâce à ses propres efforts, soit avec l'aide de nos propres agences de renseignement. Cependant, alors que le conflit avec le communisme s'intensifie à nouveau, nous devons veiller à continuer de soutenir les partis qui appuient l'OTAN dans toute la région, tout en surveillant de près les mouvements et partis émergents susceptibles de mettre en danger les gouvernements alliés. Au cours des décennies précédentes, la consolidation du pouvoir conservateur au Japon et la mise à l'écart des forces de gauche ont été couronnées de succès ; des stratégies similaires devraient être envisagées dans toute l'Europe occidentale, en particulier l'idée d'exporter des stratèges politiques américains, de financer les partis conservateurs et de semer la discorde parmi les partis de gauche qui menacent l'hégémonie de l'OTAN dans la région."
 CIA80_SPR.9.desc:0 "Depuis la mort de Francisco Franco, dictateur fasciste espagnol de longue date, l'Espagne s'est engagée sur la voie de la démocratie, même si ce chemin est semé d'embûches, marqué par des troubles et des violences provenant tant de l'extrême gauche que de l'extrême droite. Les troubles et les agitations en Espagne, conjugués à la tenue d'élections démocratiques libres, font courir le risque de voir s'installer un gouvernement anti-américain qui pourrait permettre à l'Union soviétique de prendre pied dans la péninsule ibérique et de perturber nos opérations de renseignement en Espagne. Nos agents au sein de l'armée espagnole ont signalé que le lieutenant-colonel Antonio Tejero prévoit de tenter un coup d'État contre le gouvernement afin de rétablir le régime franquiste. Cela nous offre l'occasion de rapprocher l'Espagne des États-Unis, mais augmente le risque de détériorer nos relations avec Madrid en cas d'échec. Une proposition a été élaborée pour soutenir Tejero en lui fournissant des renseignements et en utilisant des éléments de Gladio en Espagne afin d'augmenter ses chances de succès. Comment devons-nous procéder ?"
 CIA80_SPR.1.desc:0 "Après mûre réflexion du Conseil de sécurité nationale, le président [USA.GetLeader] a pris la décision de donner son feu vert au soutien des putschistes espagnols. À cette fin, des agents ont été déployés pour s'assurer que le roi d'Espagne se conforme à l'ordre de ne pas s'opposer aux plans, en le faisant chanter au sujet de ses nombreuses failles personnelles et de ses transactions financières. Par ailleurs, nos agents Gladio et nos équipes dormantes sont mobilisés pour contraindre d'autres éléments de l'armée espagnole à se rallier au plan de putsch afin d'augmenter les chances de succès. Ces mesures, associées à la contrainte exercée sur d’autres politiciens et chefs militaires pour qu’ils se rangent à notre cause, auraient pratiquement assuré le succès du coup d’État dans les jours à venir. Bien qu’il subsiste bien sûr un risque d’échec, nos agences de renseignement estiment que l’Espagne reviendra à un régime franquiste, tout en minimisant la perception par le public de notre soutien au complot."
 CIA_CT.0.desc:0 "Alors que la guerre soviéto-afghane faisait rage et que l'Union soviétique commençait à se déstabiliser rapidement, les mouvements islamistes ont connu une croissance fulgurante dans les régions islamiques de l'ex-Union soviétique, notamment au Tadjikistan, en Tchétchénie et au Daghestan. Bien que ce ne soit pas la seule cause, notre soutien aux combattants et aux organisations islamistes en Afghanistan, ainsi que notre appui à des causes similaires au Pakistan, ont clairement été un facteur déterminant dans ce problème croissant de radicalisation. En supposant que les services de renseignement ne choisissent pas d’ignorer le problème, deux options s’offrent à nous. La première consiste à soutenir secrètement les forces islamistes qui déstabilisent la région et à chercher à mettre en place, en Asie centrale, des gouvernements islamistes qui pourraient être plus disposés à accepter l’influence américaine. Cependant, une telle démarche anéantirait pratiquement toute chance d’établir et de maintenir des relations cordiales avec Moscou. Notre autre option serait de considérer cette menace croissante non seulement comme un problème régional, mais aussi comme une menace pour la sécurité nationale de l’Occident, et de chercher à collaborer avec la Russie et le Tadjikistan pour contrer la menace terroriste islamiste grandissante. Comment devrions-nous procéder ?"
 CIA_CT.1.desc:0 "À la suite de la décision du Conseil national de sécurité (NSC) de jouer un rôle proactif dans la lutte contre la menace islamiste croissante en Asie centrale, une nouvelle proposition approuvée par le NSC a autorisé le partage de renseignements concernant la province séparatiste de Tchétchénie avec le gouvernement russe afin de l'aider dans sa lutte contre les rebelles islamistes. Cette initiative devrait contribuer à nos efforts visant à établir une nouvelle relation avec Moscou et, par ailleurs, démontrer davantage notre engagement à combattre la menace du terrorisme islamiste radical. Malheureusement, cette initiative devra rester confidentielle pour une durée indéterminée en raison de considérations politiques internes. La gestion du conflit par la Russie a suscité des critiques internationales et le fait d’être perçus comme facilitant certaines actions menées par l’armée russe nuirait à notre position tant au niveau national qu’international."
 CIA_CT.2.desc:0 "La guerre civile au Tadjikistan constitue l’un des principaux conflits de la région impliquant des mouvements islamistes radicaux. À l’issue de discussions au sein du Conseil de sécurité nationale, notre administration a décidé d’apporter son soutien au gouvernement tadjik. Bien que ce dernier bénéficie du soutien de la Russie, une victoire de l’opposition serait trop déstabilisante pour la région et risquerait de créer un nouveau foyer de tension susceptible d’alimenter la radicalisation et le soutien aux organisations terroristes. Les analystes ont également noté que cela pourrait être l'occasion de tenter d'améliorer les relations avec Moscou, d'autant plus qu'il est dans notre intérêt commun d'empêcher la propagation du terrorisme islamiste en Asie centrale et en Asie du Sud. Notre ambassadeur à Douchanbé recevra dans les prochains jours pour instruction de présenter les grandes lignes du soutien que nous apporterons à leur gouvernement, et l'ambassadeur russe sera informé des mesures que nous prévoyons de prendre pour ne pas froisser la Russie en nous ingérant dans sa région."
 CIA_CT.3.desc:0 "À l’issue d’un débat houleux au sein du Conseil national de sécurité (NSC), le président a approuvé une nouvelle ligne d’action concernant l’instabilité en Asie centrale. Cette nouvelle stratégie prévoit d’apporter un soutien clandestin aux organisations islamistes lorsqu’il y a un intérêt stratégique à les renforcer. Elle sera mise à l’épreuve au Tadjikistan, où nous avons décidé de commencer à armer le mouvement rebelle, avec l’aide de l’Arabie saoudite, contre le gouvernement pro-russe. Le renversement dudit gouvernement nous donnerait l'occasion d'établir une présence plus importante en Asie centrale et affaiblirait l'emprise de la Russie sur les anciennes républiques soviétiques de la région. Cela dit, des dissidents au sein de l'administration ont fait part de leur opposition à cette initiative, arguant qu'elle violait les principes moraux et conduirait à l'armement de terroristes susceptibles d'utiliser ces armes contre nos propres alliés et intérêts."
 CIA_CT.4.desc:0 "Alors que nous poursuivons nos efforts pour soutenir les causes islamistes dans la région afin de déstabiliser davantage la Russie et ses États alliés, la situation en Tchétchénie pourrait bien détenir la clé permettant de paralyser la puissance militaire russe à moyen terme. Des voix dissidentes au sein du Conseil national de sécurité (NSC) ont souligné qu'en soutenant les Tchétchènes, nous armons également de fait les divers volontaires et djihadistes qui se rendent en Tchétchénie pour combattre la Russie et qui constitueront probablement une menace pour la sécurité après la guerre. D'autres ont fait remarquer que notre opération similaire menée en Afghanistan il y a dix ans, bien que couronnée de succès, a eu des conséquences imprévues majeures et a largement contribué à l'instabilité persistante en Asie centrale. À partir des prochaines semaines, nos agents dans la région commenceront à acheminer des livraisons d’armes vers la Tchétchénie, en utilisant des tactiques similaires à celles de l’opération Cyclone. Espérons que cette initiative affaiblira davantage la capacité de la Russie à mener la guerre."
 CIA_CT.5.desc:0 "Une nouvelle véritablement catastrophique : des renseignements récents communiqués par la Russie ont révélé que les États-Unis se rangent du côté des forces rebelles islamistes dans la guerre civile qui nous déchire et ont désormais commencé à leur fournir ouvertement des armes. Cela constitue non seulement un coup dur pour nos forces et ne manquera pas d’alourdir le bilan sanglant de cette guerre, mais cela risque aussi de réduire à néant nos progrès et de mettre en péril la survie même de notre gouvernement. Notre seule véritable option restante est de nous rapprocher davantage de la Russie et de solliciter davantage d'aide. Malheureusement, compte tenu de la situation déplorable de la Russie depuis la chute de l'Union soviétique, cela pourrait ne pas apporter grand-chose à notre cause. Peut-être les allégations de longue date selon lesquelles la CIA financerait et soutiendrait des organisations islamistes dans notre pays et dans toute l'Asie centrale étaient-elles fondées après tout ?"
 CIA_CT.6.desc:0 "Une excellente nouvelle vient de nous parvenir : les États-Unis nous ont informés qu’ils allaient désormais nous apporter un soutien financier et en matériel militaire. Bien que Washington ne soutienne pas ouvertement notre mouvement ni ne nous reconnaisse officiellement pour l’instant, ils ont accepté de bloquer toute tentative visant à nous sanctionner ou à nous censurer aux Nations Unies et travaillent en collaboration avec l’Arabie saoudite et d’autres pays pour nous fournir des fonds supplémentaires, des armes et des volontaires. Les nouveaux programmes d'aide qui devraient arriver par des voies clandestines via l'Afghanistan pourraient donner à nos forces un avantage décisif pour prendre le dessus dans le conflit en cours. Cela dit, quel en sera le coût à long terme si nous parvenons à renverser le gouvernement actuel ? Il ne fait aucun doute que les Américains souhaiteront utiliser notre nation comme tremplin vers le reste de l'Asie centrale pour étendre davantage leur influence, mais tel est le prix à payer pour gagner une guerre."
 CIA_CT.7.desc:0 "Alors que l'influence russe continue de s'effondrer dans l'ensemble de l'ancien bloc soviétique, une nouvelle occasion s'est présentée pour déstabiliser davantage la Russie et compromettre ses efforts à long terme visant à rétablir son influence dans la région. La proposition soumise au Conseil de sécurité nationale consiste à commencer à financer et, dans certains cas, à fournir des armes aux mouvements sécessionnistes au sein même de la Russie. Alors que la Tchétchénie est déjà en révolte, des troubles agitent diverses régions ethniques de Russie, notamment au Daghestan, en Kalmoukie et au Tatarstan. Ces trois régions sont majoritairement non russophones et abritent des mouvements actifs en faveur de l'autonomie ou de la sécession. Le nouveau plan approuvé viserait à établir des contacts avec ces mouvements et les dirigeants locaux susceptibles d’y adhérer, puis à commencer à fournir des armes et des fonds à ceux qui sont prêts à s’opposer militairement à la Russie. L’étape suivante consisterait à contraindre les forces militaires et paramilitaires locales à faire défection et, idéalement, à déclencher une série d’événements similaires à ceux qui se sont produits en Tchétchénie."
 CIA_CT.8.desc:0 "Ces dernières semaines, on a constaté une recrudescence notable des assassinats ciblés et d’autres attentats terroristes au Daghestan, au Tatarstan et en Kalmoukie. Ces troubles ont suscité l’inquiétude des services de sécurité, notamment au vu du conflit qui sévit actuellement en Tchétchénie. On observe également une montée en puissance rapide des mouvements islamistes radicaux dans nos régions islamiques ; la recrudescence des activités terroristes djihadistes au Daghestan est particulièrement préoccupante. En début de semaine, plusieurs commissariats de police et installations gouvernementales ont été bombardés ou pris d'assaut par des affiliés locaux d'Al-Qaïda. Les attaques ciblées contre des personnalités politiques pro-gouvernementales et des civils russes se sont également intensifiées dans ces trois régions. Le ministère de la Sécurité propose de renforcer la surveillance dans ces trois régions et cherche à identifier les leaders potentiels de ces mouvements, tout en tentant de déterminer s'il s'agit d'un problème purement interne ou s'il existe des soutiens étrangers."
 CIA_CT.9.desc:0 "La récente recrudescence du terrorisme islamiste en Asie centrale et dans les anciennes républiques soviétiques a clairement démontré que les tactiques militaires et policières traditionnelles sont inefficaces face aux terroristes idéologiques. Pour lutter contre ce phénomène, une proposition a été soumise au Conseil national de sécurité (NSC) visant à investir dans la création d’un nouveau groupe de travail chargé de superviser la mise en place de nouvelles unités antiterroristes destinées à être déployées respectivement au niveau national et international, sous l’autorité soit du Federal Bureau of Investigation (FBI), soit de la Central Intelligence Agency (CIA). Alors que les services de sécurité continuent de débattre pour savoir qui supervisera et dirigera ce groupe de travail, nous devons continuer à surveiller les menaces terroristes à venir, en particulier compte tenu de l'instabilité croissante au Moyen-Orient et en Asie centrale. Les conséquences de la guerre du Golfe et notre soutien aux moudjahidines en Afghanistan semblent avoir considérablement enhardi les terroristes islamistes extrémistes, et les informations des services de renseignement indiquent que nous sommes une cible potentielle aux côtés de la Russie, d'Israël et de divers pays européens."