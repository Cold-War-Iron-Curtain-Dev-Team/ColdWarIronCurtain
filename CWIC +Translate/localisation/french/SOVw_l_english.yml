 SOVw_A_Revolution_Realized: "La Révolution, réalisée"
 SOVw_The_Great_Liberation_War_desc: "Camarade ! L'heure du jugement est arrivée ! Les forces impérialistes capitalistes occidentales ont osé s'attaquer à notre patrie sacrée, mais n'ayez crainte ! Sous la bannière du Parti communiste, nous sommes unis, déterminés à repousser les envahisseurs et à écraser leur ignoble agression. À chaque souffle, à chaque goutte de sueur et de sang, nous les repousserons, car leur terre sera notre champ de bataille, et leur sang souillera la terre dans la lutte pour la justice ! En avant, camarades ! §RLa victoire est nôtre, car la révolution est irrésistible !§!"
 SOVw_Round_up_the_Armed_Forces_desc: "L'appel aux armes a retenti dans tout le pays ! Les forces armées soviétiques sont mobilisées, prêtes à défendre l'honneur et la souveraineté de notre grande Union. La patrie appelle ses fils et ses filles à se lever, à combattre avec un courage inébranlable et une détermination inébranlable. Forts de la force de notre acier et de la volonté du peuple, nous résisterons aux attaques de toute force qui oserait menacer notre pays. La révolution est notre bouclier, le drapeau rouge notre étendard, et nos cœurs, emplis du feu du socialisme, nous guideront vers la victoire. Chaque soldat, chaque ouvrier, chaque camarade – aujourd'hui, nous marchons ensemble, unis !"
 SOVw_One_Last_Push_for_Victory_desc: "Grâce à la force de nos camarades et à la puissance de nos idéaux socialistes, nous avancerons sans relâche. Chaque centimètre carré de notre territoire, chaque ville, chaque village, chaque champ sera reconquis et libéré de l'emprise de nos ennemis. Nos chars gronderont comme le tonnerre, notre infanterie avancera comme une vague irrésistible, et notre artillerie s'abattra sans merci sur les envahisseurs. Nous nous battons non seulement pour nos frontières, mais aussi pour l'avenir de la révolution. Pour chaque travailleur, chaque agriculteur, chaque enfant qui rêve d'un monde libéré de l'oppression."
 SOVw_Rally_the_Workers_of_the_Unions_desc: "Face aux difficultés, au cœur de la lutte, les travailleurs d'Union soviétique résistent inflexiblement ! Ce ne sont pas seulement nos armées, mais la force du peuple – ouvriers, paysans, bâtisseurs – qui constitue la véritable colonne vertébrale de notre grand État socialiste. Dans chaque usine, chaque atelier, chaque champ, nous accomplissons notre travail avec une détermination inébranlable, forgeant l'avenir de nos mains et de notre sueur. Lorsque les vents de l'adversité soufflent, lorsque les ennemis du progrès cherchent à nous abattre, nous restons fermes, inébranlables et inébranlables. Nous savons que la révolution ne se gagne pas seulement par l'épée, mais par l'effort inlassable de ceux qui façonnent la terre, créent la richesse et construisent le rêve. Grâce à notre dévouement, nous surmontons les défis et, ensemble, nous ferons en sorte qu'aucun obstacle, aucun ennemi, ne puisse briser notre volonté."
 SOVw_In_the_Defense_of_the_Union_desc: "Notre Union se trouve à un tournant décisif, s’engageant dans un nouveau chapitre de son histoire alors que nous sommes appelés aux armes pour la première fois depuis la Grande Guerre patriotique. Il ne s’agit pas simplement d’un combat ; c’est une noble cause — une guerre pour la libération des peuples d’Europe. Les cris des opprimés résonnent à travers le continent, et il est de notre devoir, de notre mission, de répondre à cet appel.\n\nFace à ce défi capital, nous devons nous engager dans une ligne d'action décisive. Nous tracerons la voie de la victoire, une voie qui englobe non seulement nos soldats, mais aussi l'esprit même du prolétariat. Le secrétaire général [SOV.GetLeader] a déclaré avec force que le triomphe du communisme n'est pas seulement une aspiration, mais un engagement inébranlable."
