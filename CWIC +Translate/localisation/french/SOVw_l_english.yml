 SOV_WW3_decisions: "La Grande Guerre de Libération"
 SOV_WW3_decisions_desc: "\n\n\n\n\n\n\n\n£USSR_WW3\n\n\n\n\n\n\n\n\n\nLes puissances capitalistes cherchent depuis longtemps à contenir la puissance de l’Union soviétique, sapant ainsi la lutte des travailleurs et menaçant le socialisme mondial. Leur emprise impérialiste a étranglé la révolution en Europe, en Asie et au-delà. Mais aujourd’hui, l’histoire a atteint son moment décisif. La Grande Guerre de Libération est à nos portes – une confrontation finale et inévitable entre les forces du socialisme et les vestiges décadents de l’oppression bourgeoise.\n---------------------------------------------------------------------------------------------\n                                              Opinion publique\n---------------------------------------------------------------------------------------------\n§YÉpuisement de la guerre publique :§! [?Soviet_War_Exhaustion_variable|-%]\n§RAffectif de l'armée :§! [?Soviet_Army_Strength|-%]\n---------------------------------------------------------------------------------------------\n                                                  Objectifs\n---------------------------------------------------------------------------------------------\n[get_paris_capital]\n[get_helsinki_capital]\n[get_stockholm_capital]\n[get_oslo_capital]\n[get_west_berlin_capital]\n[get_rome_capital]\n[get_vienna_capital]\n[get_athens_capital]\n[get_madrid_capital]\n[get_lisbon_capital]\n "
