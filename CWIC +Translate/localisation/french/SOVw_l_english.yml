 SOVw_Third_World_War.10.t: "La proposition « Red Eminence »"
 SOVw_Third_World_War.10.d: "Alors que la Troisième Guerre mondiale se poursuit, l'Armée rouge a démontré qu'elle avait conservé toute sa puissance après notre juste victoire sur le Troisième Reich. Nous faisons désormais progresser la révolution plus à l'ouest que jamais. Cependant, à mesure que nous libérons de nouveaux peuples sur le continent, nous sommes confrontés à certains défis administratifs. Contrairement à l'Allemagne, où nous avons pu transférer le contrôle à nos camarades de Berlin-Est, nous ne sommes pas en mesure de faire de même pour des régions comme les Pays-Bas. Actuellement, des gouvernements socialistes distincts mettent en œuvre la révolution ouvrière aux Pays-Bas, en Belgique et au Luxembourg. Tous les membres de notre parti ne sont pas satisfaits de cette division. Le camarade Suslov, en particulier, a proposé l'idée de créer un État socialiste unifié du Benelux.\n\nCette proposition s'accompagne bien sûr d'un certain nombre de considérations. Notre Union est forte et unie, ce qui n'est pas le cas de la région du Benelux. Réunir ces cultures diverses sous une même bannière alors que la guerre fait encore rage comporte des risques et risque fort de provoquer des troubles derrière les lignes de front. D'un autre côté, les capitalistes s'opposent déjà à la libération socialiste ; un État unifié ne risquerait donc pas d'introduire de nouveaux problèmes au-delà de ceux auxquels nous sommes déjà confrontés.\n\nDe plus, cette initiative réduirait considérablement nos charges administratives, nous permettant de construire et de façonner un seul pays plutôt que trois entités distinctes. Si nous donnons suite à la proposition du camarade Suslov, les dirigeants locaux risquent de s'indigner, mais la simplification administrative qui en résulterait nous permettrait de nous concentrer plus efficacement sur la guerre mondiale en cours."
 SOVw_Third_World_War.10.a: "Il a peut-être raison."
 SOVw_Third_World_War.11.t: "Les communistes des Pays-Bas, du Luxembourg et de la Belgique se sont opposés à la proposition de Suslov !"
 SOVw_Third_World_War.11.d: "Comme on pouvait s'y attendre, les dirigeants des pays du Benelux sont furieux de notre décision de créer un État unique et unifié dans la région. Les dirigeants communistes des trois pays ont ouvertement protesté contre cette décision, et nombre d'entre eux refusent de reconnaître le nouvel État et son gouvernement. Bien que leur détermination soit remarquable, l'absence d'une direction communiste établie dans ce nouvel État du Benelux se fera cruellement sentir, rendant la construction de la nation nettement plus difficile.\n\nCette résistance à la révolution n’a fait que mettre en évidence l’hypocrisie des communistes occidentaux, car la révolution ne connaît pas de frontières et ne fait aucune distinction culturelle parmi le prolétariat. En protestant contre l’unification, ces carriéristes idéologiques n’ont fait que démontrer davantage pourquoi le leadership de Moscou dans la révolution mondiale est essentiel. Nous sommes donc arrivés à un tournant. Que devons-nous faire ?"
 SOVw_Third_World_War.11.a: "Allons-y pour le plan de Suslov."
 SOVw_Third_World_War.11.b: "Il vaudrait peut-être mieux suivre leur conseil..."
 SOVw_Third_World_War.12.t: "La Yougoslavie accepte d'adhérer"
 SOVw_Third_World_War.12.d: "Nos camarades de Belgrade, autrefois tombés en disgrâce, ont enfin retrouvé la raison et sont officiellement entrés en guerre sous notre bannière rouge commune de la liberté ! S’il reste encore beaucoup à faire pour combler le fossé entre nos deux nations, nous pouvons au moins constater avec certitude que le « camarade » Tito est toujours capable de raison et qu’il est un allié de la révolution ouvrière. L'ouverture d'un nouveau front contre l'OTAN en Italie nous procure également un avantage indispensable face aux impérialistes américains, et le fait de permettre à nos nouveaux alliés yougoslaves de conserver Trieste devrait suffire à les satisfaire pour le moment..."
 SOVw_Third_World_War.12.a: "Génial !"
 SOVw_Third_World_War.13.t: "La Yougoslavie a refusé d'adhérer"
 SOVw_Third_World_War.13.d: "Malheureusement, le socialisme des Balkans est bien plus compromis que nous ne l’avions initialement prévu, la Yougoslavie ayant refusé de se joindre à la guerre et défié une dernière fois la Révolution ouvrière. Bien que nos divergences soient importantes, nous avions espéré que Belgrade reviendrait à la raison et reconnaîtrait que cela pourrait être notre seule chance de mettre fin une fois pour toutes à la tyrannie capitaliste, ou qu’elle se laisserait au moins convaincre par l’idée de récupérer ses territoires perdus. Cependant, il est clair que ce n'est pas le cas, et l'influence de l'Amérique sur nos anciens alliés est plus forte que nous ne le pensions.\n\nIl y a des membres au sein de notre parti et même dans l'Armée soviétique qui ne souhaitent pas gaspiller des ressources et des effectifs en élargissant le front contre une nation neutre. Cependant, le risque est trop grand. Si la Yougoslavie est prête à s’isoler de Moscou au profit de Washington, on ne peut ignorer la possibilité que les Américains utilisent la Yougoslavie pour lancer une invasion contre nos lignes arrière vulnérables. Alors que nous avions espéré une réponse plus réceptive de la part de la Yougoslavie, nous n’avons désormais d’autre choix que de sécuriser nos flancs."
 SOVw_Third_World_War.13.a: "On dirait qu'on va devoir y aller à la dure..."
 SOVw_Third_World_War.14.t: "La demande soviétique"
 SOVw_Third_World_War.14.d: "L'animosité croissante entre Belgrade et Moscou ces dernières années est indéniable. Au-delà de nos relations cordiales avec les États-Unis et de notre neutralité, l'insistance de Moscou à ce que nous nous plions à sa ligne du parti, suivie de ses nombreuses tentatives d'assassinat contre le camarade Tito, a rendu nos relations pour le moins glaciales. Cependant, au fond, nous sommes tous deux encore des États communistes et nourrissons les mêmes rêves à long terme de révolution mondiale, comme Marx l'avait sagement prédit. Nous avons aujourd’hui peut-être la seule occasion qui nous sera jamais donnée d’atteindre cet objectif. Alors que le monde a tragiquement sombré dans une nouvelle guerre mondiale, les responsables soviétiques ont exigé que nous nous joignions à la guerre à leurs côtés, que nous mettions nos différends de côté et que nous nous unissions sous l’objectif commun de la révolution mondiale. Même si nous acceptons cet ultimatum flagrant tel quel, nos relations avec Moscou ne seront pas réparées du jour au lendemain, et d’un point de vue strictement pragmatique, rompre complètement les liens avec le monde occidental et nous engager dans une nouvelle guerre mondiale si peu de temps après la fin de la précédente détruirait non seulement notre économie encore en convalescence, mais ne serait pas bien accueilli par notre peuple, pour employer un euphémisme.\n\nBien qu’il ne soit pas tout à fait clair si l’Union soviétique a la capacité d’étendre son front, un refus pourrait signifier la guerre quoi qu’il arrive ; cependant, au lieu que notre front soit l’Europe occidentale, ce seraient nos propres villes et villages, et au moins, nous ranger du côté des Soviétiques signifierait que nous pourrions éloigner la guerre de nos frontières et nous donnerait l’occasion de récupérer des territoires qui nous reviennent de droit, mais qui sont égoïstement accaparés par les capitalistes occidentaux, comme Trieste.\n\nIl ne s'agit pas d'une question tranchée, et les réponses claires sont encore plus rares ; cependant, après mûre réflexion..."
 SOVw_Third_World_War.14.a: "Mettons nos différends de côté..."
 SOVw_Third_World_War.14.b: "Au diable les Soviétiques !"
