 great_liberation_war: "La Grande Guerre de Libération"
 great_liberation_war_desc: "Le moment est venu ! L'Occident, mené par les États-Unis impérialistes, a osé attaquer notre patrie sacrée, plongeant une fois de plus le monde dans les flammes de la guerre. Mais qu'ils se souviennent : tout comme nous avons écrasé les envahisseurs pendant la Grande Guerre patriotique, nous les écraserons maintenant. Ce n'est pas seulement une bataille de nations ; c'est une bataille d'idéologies, un combat pour la justice, l'égalité et la survie du socialisme lui-même.\nL'Union soviétique est unie et inflexible. Notre peuple, forgé dans les feux de l'histoire, ne faiblira pas. Notre armée, d'une force et d'une détermination inégalées, brisera la volonté de combattre de l'ennemi. Que le monde soit témoin de la puissance inébranlable de l'Union et de l'esprit indomptable de son peuple.\nLa victoire sera nôtre, non seulement pour l'Union soviétique, mais pour tous les peuples opprimés qui aspirent à la libération. Nous triompherons, nous résisterons, et les forces de l'impérialisme s'effondreront sous le poids de leur arrogance.\n§RL'Union soviétique sortira victorieuse et l'histoire honorera une fois de plus notre force et notre détermination !§!"
 great_liberation_war_2: "La Grande Guerre de Libération"
 great_liberation_war_2_desc: "Le moment est venu ! L'Occident, mené par les États-Unis impérialistes, a osé attaquer notre patrie sacrée, plongeant une fois de plus le monde dans les flammes de la guerre. Mais qu'ils se souviennent : tout comme nous avons écrasé les envahisseurs pendant la Grande Guerre patriotique, nous les écraserons maintenant. Ce n'est pas seulement une bataille de nations ; c'est une bataille d'idéologies, un combat pour la justice, l'égalité et la survie du socialisme lui-même.\nL'Union soviétique est unie et inflexible. Notre peuple, forgé dans les feux de l'histoire, ne faiblira pas. Notre armée, d'une force et d'une détermination inégalées, brisera la volonté de combattre de l'ennemi. Que le monde soit témoin de la puissance inébranlable de l'Union et de l'esprit indomptable de son peuple.\nLa victoire sera nôtre, non seulement pour l'Union soviétique, mais pour tous les peuples opprimés qui aspirent à la libération. Nous triompherons, nous résisterons, et les forces de l'impérialisme s'effondreront sous le poids de leur arrogance.\n§RL'Union soviétique sortira victorieuse et l'histoire honorera une fois de plus notre force et notre détermination !§!\""
