 the_last_war: "La dernière guerre"
 the_last_war_desc: "\n\n\n\n\n\n£sacred_war\n\n\n\n\n\n\n\nNous combattrons les étrangleurs\nde toute idée meurtrière,\nles violeurs et les voleurs,\nles tueurs d'êtres humains !\n\n§RQue notre noble colère\ndéborde comme une vague !\nC'est la guerre du peuple,\nUne guerre sacrée !§!"
 rhine_in_seven_days: "Sept jours jusqu'au Rhin"
 rhine_in_seven_days_desc: "§RNous devons atteindre le Rhin dans les sept jours, sinon les conséquences seront graves..§!"
 Union_of_Laborer: "Syndicat des travailleurs"
 SOVw_Third_World_War.1.d: "Des millions de personnes ont été appelées aujourd'hui à défendre l'Union soviétique, avant-garde des peuples opprimés, et à prendre les armes contre l'ordre impérialiste en déclin. Dans un discours historique prononcé ce matin au Soviet suprême, le camarade [SOV.GetLeader] a déclaré que le temps était venu de libérer les masses laborieuses des chaînes de l'exploitation occidentale, marquant ainsi le début officiel de ce qui sera connu sous le nom de Grande Guerre de Libération.\n\nÀ l'aube, les forces soviétiques ont lancé des opérations défensives préventives contre la militarisation croissante de l'OTAN à nos frontières. Pendant des années, les puissances capitalistes ont encerclé la mère patrie soviétique, amassant troupes et armes dans une tentative agressive d'étrangler le socialisme. Les ouvriers et les paysans d'URSS, unis, ont refusé de céder aux menaces de l'Occident. Aujourd'hui, sous la bannière de Lénine et des idéaux immortels du marxisme-léninisme, le peuple soviétique a pris les mesures nécessaires pour assurer la paix par la force."
 SOVw_Third_World_War.2.d: "Alors que la Grande Guerre de Libération se déroule, les travailleurs soviétiques prouvent une fois de plus qu'ils sont le fondement inébranlable de la victoire. Des forges de Magnitogorsk aux usines textiles d'Ivanovo, les usines et les fermes collectives de l'Union brûlent d'un travail acharné, portés par la volonté inébranlable du peuple.\n\nSous la direction du Parti, la production industrielle a atteint des niveaux historiques. Dans les grandes usines de tracteurs de Tcheliabinsk, les ouvriers travaillent 24 heures sur 24, transformant les machines de la paix en moteurs de la libération. À Leningrad et Kharkov, le prolétariat répond à l'appel du devoir, assemblant chars, avions et fusils avec une précision inégalée. Pas une seule seconde n'est perdue : chaque boulon serré, chaque grain récolté, chaque voie ferrée posée est un coup de massue contre les forces de l'impérialisme.\n\nL'esprit de Stakhanov perdure dans chaque usine et chaque kolkhoze. Les mineurs du Donbass ont dépassé leurs quotas, extrayant le charbon et le fer nécessaires à notre glorieuse lutte. Les femmes d'Union soviétique, solidaires de leurs camarades, occupent la place qui leur revient au sein de la main-d'œuvre, garantissant une production constante. Dans les gares de triage sibériennes, le sang de la guerre – ravitaillement, nourriture et armes – afflue sans cesse vers le front, assurant l'approvisionnement et la survie de notre courageuse armée soviétique."
 SOVw_Third_World_War.3.d: "La terre tremble alors que s'engage la bataille décisive pour la patrie soviétique. Les armées impérialistes, poussées par le désespoir, se heurtent à l'esprit indomptable du socialisme. Venue de l'ouest, l'OTAN a franchi les frontières de notre Union soviétique.\n\nMais le peuple soviétique ne se laissera pas vaincre. Il a déjà traversé des épreuves et résiste inébranlablement. L'Armée rouge, drapeaux déployés avec défi, est prête à défendre Moscou, incarnant la valeur de ceux qui ont affronté Napoléon et Hitler.\n\nDans les usines de l'Oural, les ouvriers avancent sans relâche, fabriquant des armes pour l'affrontement ultime. À Leningrad et à Kiev, les citoyens se soulèvent résolument, fortifiant leurs maisons et barricadant leurs rues. Des vastes champs de la Volga aux étendues glacées de la Sibérie, le peuple soviétique s'unit, armé de fusils, de marteaux et de faux, prêt à défendre la patrie socialiste."
 SOVw_Third_World_War.4.d: "Depuis la grande salle du Kremlin, le secrétaire général [SOV.GetLeader] se tenait devant l'assemblée, la voix ferme et résolue. La guerre était entrée dans une phase décisive, et tandis que les forces soviétiques avançaient sur des champs de bataille lointains, un autre front exigeait une vigilance égale : les usines, les mines et les champs qui soutenaient l'effort de guerre.\n\nIl ne parlait pas de sacrifice, mais de devoir, du lien indissoluble entre l'ouvrier et le soldat, entre les machines qui sortaient des chaînes de production et les hommes qui les maniaient au combat. Chaque fusil assemblé, chaque char forgé et chaque avion construit représentait un pas de plus vers la victoire. Le travail du peuple était tout aussi vital que la force de l'armée soviétique, car sans lui, la guerre ne pouvait être gagnée.\n\nLe message était clair : le triomphe de l'Union soviétique ne se jouerait pas uniquement sur les soldats, mais sur la détermination de ceux qui peinaient derrière les lignes. Les usines ne connaîtraient pas de répit, les champs donneraient leurs récoltes et la nation avancerait vers un avenir libéré de l'oppression occidentale. L'esprit des générations passées, de ceux qui avaient enduré la Grande Guerre patriotique, vivait encore dans le cœur de ceux qui portaient désormais le fardeau de l'histoire.\n\nÀ la fin du discours, l'assemblée s'est levée sous un tonnerre d'applaudissements. Le peuple comprenait : c'était aussi leur guerre."
 SOVw_Third_World_War.5.d: "Alors que les flammes de la Troisième Guerre mondiale faisaient rage, l'Union soviétique savait qu'elle ne pouvait lutter seule. Face à l'Occident, Moscou se tourna vers la seule puissance capable de remodeler le conflit : la Chine. Un émissaire soviétique, portant le poids de l'histoire sur ses épaules, fut envoyé à Pékin avec une seule mission : entraîner la Chine dans la guerre.\n\nLes réunions furent tendues, tenues à huis clos à Zhongnanhai, où diplomates soviétiques et responsables chinois débattirent du sort du bloc de l'Est. Les Soviétiques évoquèrent l'agression américaine, l'empiètement incessant de l'Occident, et un ordre mondial conçu pour les contenir tous deux. Ils promirent coordination militaire, technologie et un nouvel équilibre mondial, un équilibre où ni Moscou ni Pékin ne seraient à nouveau soumis à l'influence occidentale.\n\nAprès des jours de délibérations, la réponse tomba : la Chine se tiendrait aux côtés de l'Union soviétique. La poignée de main qui suivit ne fut pas seulement un accord, mais la déclaration que l'Orient s'élèverait uni. Les usines vrombirent, les soldats se mobilisèrent et le monde se prépara à la tempête qui s'annonçait. L’alliance avait été forgée dans l’acier et le feu, et rien ne pouvait s’y opposer."
 SOVw_Third_World_War.6.d: "Assis à la faible lumière d'une lanterne, le grondement lointain de l'artillerie me rappelle combien je suis loin de chez moi, et pourtant mon cœur reste avec vous. La guerre continue, et même si les jours sont longs et les nuits encore plus longues, penser à vous me donne de la force.\n\nLes hommes ici se battent non seulement pour notre patrie, mais aussi pour l'avenir – pour vous, nos enfants, et la vie que nous construirons une fois tout cela terminé. Je pense souvent à notre petit appartement, aux matins où je me réveillais au parfum de votre thé, à la chaleur de vos mains dans les miennes. Ce sont ces souvenirs qui me permettent de tenir le coup lorsque le vent froid transperce mon uniforme et que l'épuisement pèse lourdement sur mes épaules.\n\nNous avons avancé, et malgré la résistance de l'ennemi, nous restons inébranlables. L'Occident pensait pouvoir nous écraser, mais il ignore le cœur d'un soldat soviétique. Nous combattons avec l'esprit de ceux qui nous ont précédés, ceux qui ont marché sur Berlin et ont hissé le drapeau rouge de la victoire. Je te jure, mon amour, que je te reverrai lorsque cette bannière flottera à nouveau haut.\n\nPrends soin de toi, ma chérie. Dis à notre fils que son père se bat pour qu'il puisse vivre dans un monde sans guerre. Garde une bougie allumée à la fenêtre pour moi ; je suivrai sa lumière jusqu'à chez moi.\n\nAvec tout mon amour,"
 SOVw_Third_World_War_news.1.d: "Depuis le début de la Troisième Guerre mondiale, l'Union soviétique cherche à remodeler l'ordre mondial et s'est assuré les services de son allié le plus puissant. Après des mois de négociations, Pékin a mis de côté ses divergences passées et rejoint Moscou dans sa guerre contre les États-Unis, forgeant une alliance qui menace de faire basculer l'histoire.\n\nAvec l'importante main-d'œuvre et la puissance industrielle de la Chine renforçant la machine de guerre soviétique, un nouveau front émerge, qui s'étend du Pacifique au cœur de l'Eurasie. Les forces soviétiques et chinoises coordonnent leurs offensives, frappant les positions occidentales avec une force implacable. Les usines de Pékin et de Shanghai travaillent jour et nuit pour alimenter l'effort de guerre, tandis que les généraux soviétiques et les commandants chinois planifient leur prochaine action décisive.\n\nLe monde assiste à la consolidation du bloc de l'Est, une force inédite depuis l'apogée de la Guerre froide. Avec deux superpuissances unies, l'issue de la guerre n'est plus certaine : le vent a tourné."
