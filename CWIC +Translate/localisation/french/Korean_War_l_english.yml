 korean_war_kpa_category: "La guerre de Corée"
 korean_war_kpa_category_desc: "\n\n\n\n\n£Guerre_de_Corée_KPA\n\n\n\n\n\n\nDes années de préparation nous ont menés à ce moment décisif. La réunification de la péninsule coréenne semble enfin possible. Pourtant, la menace d’une intervention étrangère, notamment en faveur du régime voyou du Sud, plane en permanence dans l’ombre. Nous devons rester vigilants face à ces forces extérieures qui cherchent à détruire la Révolution.\n\nPour remporter une victoire décisive, nous devons atteindre Busan avant que les premières troupes impérialistes ne posent le pied sur notre sol. Le chemin qui nous attend sera semé d’embûches, mais notre résolution et notre détermination collectives nous guideront vers la réunification et la restauration de notre patrie."
 KPA_South_Korean_Resistance: "La résistance des bandits sud-coréens"