 cw_hybrid_ins_1980s_doctrine_title:0 "Sustained Hybrid Campaigns"
 cw_hybrid_ins_1980s_doctrine_desc:0 "Hybrid forces emphasized logistics corridors, semi conventional operations, and layered command resilience."
 cw_hybrid_ins_1990s_doctrine_title:0 "Transition to Semi Conventional Control"
 cw_hybrid_ins_1990s_doctrine_desc:0 "Movements sought territorial stability, negotiated legitimacy, and conventional force postures alongside irregular methods."
 cw_islamist_ins_1960s_doctrine_title:0 "Religious Mobilization and Dawah Networks"
 cw_islamist_ins_1960s_doctrine_desc:0 "Islamist movements emphasized clerical authority, social services, and religious outreach to build durable support networks."
