 cw_islamist_ins_1990s_regional_doctrine_desc:0 "Regional Islamist movements prioritized territorial control, local governance, and sustained insurgency within defined national theaters."
 cw_islamist_ins_1990s_transnational_doctrine_title:0 "Globalized Networked Jihad"
