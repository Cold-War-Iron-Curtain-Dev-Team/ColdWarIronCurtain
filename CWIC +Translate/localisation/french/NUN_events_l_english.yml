 Nung_Future.1.t: "Bao-dai demands our submission!"
 Nung_Future.1.d: "On May 30, 1949, the French Ministry of Overseas handed over the authority to manage the Central Highlands and Upper South Indochina’s ethnic autonomous regions to the National Government of Vietnam. Chief of State Bao-Dai instead separated the Central Highlands and established a special administrative regulation called Hoang-Trieu Cuong-Tho ( Crown-domains ) through Du so 6/QT/TH on April 15, 1950. The Du has specified that in these new regions, Bao-dai in addition to being Head of State, will hold the role of “ Emperor “ and will rule personally over the Crown-domains as his fiefdoms. While the French Paris government has promised to grant and protect our nation's independence from Vietnam after the War against Communism Bao-dai instead has used the Du to demand our government's submission via a telegram sent from Saigon, what will be our response ? "
 Nung_Future.1.a: "Very well, but we were promised that we will be free after the war!"
 Nung_Future.1.b: "We will use the French’s promise to protect and defend our sovereignty to declare independence!"
 NUN_VIN.1.t: "Colonel Vong-a-Sang defect to the revolution"
 NUN_VIN.1.d: " In mid-1948, Comrade Nhi Quy, Secretary of the Hai Ninh Communist Party Committee directed Comrade Hoang Mau Thanh (1st National Assembly Delegate, Vice Chairman of the Hai Ninh Provincial Resistance Committee, cousin of Nung’s leader Vong-a-Sang) to write a letter of support regarding urge Vong-a-Sang to returned to “ the revolutionary cause “. The content of the letter was to advise A Sang, that if he has not yet had the opportunity to join the revolution, then he shouldn’t commit more crimes against the people. \nToday, our government in Viet-bac received an unexpected telegram which informed that the Nung government and Colonel Vong-a-Sang had defected and accepted the authority of our revolutionary government in exchange for maintaining autonomy for the Chinese Nung people, the telegram informed that they would be contacted again when they can transfer authority to our government from the CEFEO’s occupation regime."
 NUN_VIN.1.a: "We destroy the enemies by converting them into our comrades!"
 NUN_VIN.2.t: "A-sang betrayed us"
 NUN_VIN.2.d: ""
