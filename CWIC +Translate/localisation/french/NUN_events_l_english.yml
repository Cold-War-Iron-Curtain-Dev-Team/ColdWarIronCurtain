 NUN_VIN.0.t: "The People’s Autonomous Region of Hai Ninh"
 NUN_VIN.0.d: "Today, the government of Vietminh has declared its intentions to establish autonomous regions for ethnic groups’ self-rule in their homelands to promote multicultural cooperation as a move against French colonialism.  President Ho Chi Minh and the National Assembly, have issued Special Degrees so. 219/SL regarding establishing the People’s Autonomous Region of Hai Ninh after the colonial Nung government under Colonel Vong-a-Sang defected to the Viet Minh. Vietminh spokesperson has declared that the move will help hopefully sway more minority groups in Indochina to defect to their side to fight against French colonialism and promise better treatments and self-determination rights. "
 NUN_VIN.0.a: "A smart move!"
