 FRA_truth_rec:0 "Vérité et réconciliation"
 FRA_truth_rec_desc:0 "L'occupation allemande a laissé une profonde cicatrice dans notre pays. Nous allons la guérir."
 FRA_study_1940:0 "Étudier 1940"
 FRA_study_1940_desc:0 "Notre défaite de 1940 fut causée par nos tactiques inadéquates. Nous devons trouver de nouvelles tactiques si nous voulons éviter une nouvelle humiliation."
