 FRA_60s_The_Algeirs_Coup_desc:0 "La récente conférence de presse sur l'avenir de l'Algérie a augmenté les tensions entre les Pieds-Noirs et les Algériens natifs. Le plaidoyer de De Gaulle en faveur de la décolonisation, basé sur le fait que l'Algérie est devenue un fardeau pour la nation française ces dernières années, a été accueilli avec crainte par les Français d'origine européenne qui ont construit leur vie à travers la Méditerranée. Il est tout à fait possible que des Pieds-Noirs influents tentent de rester au pouvoir, même sans notre présence dans le pays. Si la France décide de se retirer d'Algérie, le vide de pouvoir qui en résulterait pourrait être exploité par des commandants opposés à la décolonisation."
