 fra_news.1.t:0 "[GetNewspaperHeader]Introduction du nouveau franc"
 fra_news.1.d:0 "Le 27 décembre 1958, un décret a été pris stipulant que \"à partir d'une date à fixer par décret, et au plus tard le 1er janvier 1960, une nouvelle unité monétaire française sera créée, dont la valeur sera de cent francs\". La nouvelle unité est \"désignée sous le terme de nouveau franc\". Cette réforme monétaire est la partie la plus visible d'un programme ambitieux, préparé par Jacques Rueff, qui prône une consolidation fiscale pour mettre fin à l'inflation et promouvoir le renouveau économique et financier du pays. Avec une valeur extérieure du franc fixée à 1,8 milligrammes d'or fin (180 milligrammes pour un nouveau franc), la France est associée au retour à la convertibilité des monnaies européennes et peut ainsi participer pleinement au lancement du grand chantier de la construction de la Communauté européenne."
 fra_news.1.a:0 "Ils ont restauré un prestigieux franc"
 fra_news.2.t:0 "[GetNewspaperHeader]Formation du Service d'Action Civique"
 fra_news.2.d:0 "À mesure que l'intensité de la guerre d'Algérie augmentait, les tensions parmi ceux en Algérie ne cessaient de croître. Face à l'opposition arabe, communiste et militaire contre De Gaulle, le conseiller africain Jacques Foccart vit la nécessité de créer une contre-offensive contre ces forces. Une milice gaulliste connue sous le nom de Service d'Action Civique a été formée, basée à Constantine, étant une coalition de forces pro-gouvernementales dispersées à travers la région."
 fra_news.2.a:0 "Une autre milice ?!"
 fra_news.3.t:0 "[GetNewspaperHeader]Semaine des Barricades"
 fra_news.3.d:0 "Les Français d'Algérie étaient furieux que De Gaulle semble les avoir abandonnés à leur propre sort, ce qui a conduit de nombreux leaders étudiants à organiser des manifestations à travers la ville d'Alger. Le leader Pierre Lagaillarde organiserait des milliers de personnes dans les rues. Ce qui avait commencé de manière pacifique se transforma en violence lorsque la police commença à tirer sur la foule. Les bâtiments gouvernementaux furent rapidement submergés, et tout sens de l'ordre se perdit rapidement. Le 1er février, les partisans de De Gaulle entrèrent dans la ville pour rétablir l'ordre. Bien que la situation ait été maîtrisée, le conflit algérien ne montre aucun signe d'apaisement."
 fra_news.3.a:0 "Jusqu'où cela peut-il continuer à escalader?"
 fra_news.4.t:0 "Mort d'Albert Camus"
 fra_news.4.d:0 "L'écrivain français d'origine algérienne Albert Camus a été déclaré mort après un accident de voiture fatal survenu le 4 janvier 1960. L'un des plus grands auteurs de la littérature française, Camus a fait des avancées majeures dans le développement de l'absurde et a sensibilisé la République à la lutte algérienne. Bien qu'il ait vécu une vie courte, ses contributions au monde de la littérature ne seront pas oubliées, perdurant à travers l'éternité dans ses œuvres."
 fra_news.4.a:0 "\"Il n'y a pas l'amour de la vie sans désespoir dans la vie\""
 fra_news.21.t.fal:0 "[GetNewspaperHeader]Le Putsch d'Alger échoue"
 fra_news.21.t.suc:0 "[GetNewspaperHeader]La Révolution d'Alger"
 fra_news.21.d.fal:0 "Au milieu de la guerre d'Algérie, des négociations secrètes entre le FLN et De Gaulle ont irrité les généraux français d'Algérie, qui se sentaient trahis par la population européenne algérienne. Dirigées par Maurice Challe, les troupes coloniales françaises tenteraient de mener un coup d'État dans les trois principales villes de l'Algérie, mais ne trouveraient que peu de soldats pour le soutenir. À Oran et Constantine, le coup ne commencerait même pas, les officiers et les soldats refusant de suivre les ordres. Le jour suivant, De Gaulle prononcerait un discours inspirant qui atténuerait encore le soutien au coup d'État. Le putsch s'effondrerait rapidement, tous les participants revenant dans le camp du gouvernement.\n\nÀ la fin de l'incident, le coup d'État avait échoué lamentablement, sans rien à en tirer. Cet événement a prouvé que la France soutient De Gaulle, même en période de lutte pour la nation."
 fra_news.21.d.suc:0 "Les combats à Paris finirent par se calmer alors que les quelques derniers combattants gaullistes et communistes dispersés à travers la ville se rendirent. Après une brève chasse à l'homme, Charles De Gaulle fut finalement capturé à Rouen alors qu'il tentait de rejoindre Le Havre pour s'échapper en Grande-Bretagne. Le procès de De Gaulle commença rapidement, où il était jugé pour trahison par les putschistes en raison de la trahison de l'Algérie française. Les groupes de gauche à travers la France n'avaient pas fait mieux, avec plus de 5 000 socialistes et communistes français arrêtés, selon les rapports. Le Parti radical et le Parti gaulliste ont tous deux été officiellement interdits, et toute connexion avec eux pouvait entraîner une visite de la police à la porte. Les rues de Paris en disent long sur l'état de la nation, car l'atmosphère autrefois bruyante est devenue sombre. Les Parisiens passent devant des tanks en route vers leur travail, entendant de temps en temps des tirs à distance. Les gens continuent d'avancer dans leur vie, même à la fin de la nouvelle Cinquième République.\n\nAlors que la poussière retombe, l'avenir de la France reste en équilibre. S'agit-il d'une étape transitoire vers la Sixième République ou d'un nouveau jour pour l'autoritarisme français ? Une chose est certaine, la guerre d'Algérie est loin d'être terminée..."
 fra_news.21.a:0 "Vive La France !"
 fra_news.21.b:0 "Les Français dureront !"
 fra_news.21.c:0 "Intéressant..."
 fra_news.31.t.gen:0 "[GetNewspaperHeader][USA.GetLeader] Visiter la France"
 fra_news.31.t.jfk:0 "[GetNewspaperHeader] Le président américain Kennedy visite la France"
 fra_news.31.d.gen:0 "\"Je ne viens pas ici pour régler nos différences, car ce sont des différends entre amis, mais pour demander l'avis de l'un des hommes les plus sages et les plus héroïques de notre temps. Et pour expliquer à l'Europe ce qu'est l'Amérique aujourd'hui.\" Les premiers mots de [USA.GetLeader] à Paris, il y a un succès auprès de Charles de Gaulle. Entre les deux alliés, douze heures de pourparlers sont prévues jusqu'à vendredi pour discuter des tensions entre l'Est et l'Ouest à Berlin, la guerre en Algérie mais aussi le choix de la France pour acquérir des armes nucléaires. [USA.GetLeader] essaye de le dissuader mais quoi faire face à l'obstination de l'homme du \"non\"?"
 fra_news.5.t:0 "Michel Debré obtient des pouvoirs à part entière sur la question algérienne"
 fra_news.5.d:0 "À la suite de la Semaine des Barricades, le Premier ministre français Michel Debré reçoit des pouvoirs exceptionnels de la part du Parlement français pour traiter la question algérienne. Michel Debré a longtemps défendu l'Algérie française, mais la manière dont il gérera la situation en Algérie reste une question de temps. L'escalade de la situation devient de plus en plus grave à mesure que le temps passe et que les groupes militants ne cessent de se renforcer."
 fra_news.5.a:0 "Espérons que le Premier ministre prendra la bonne décision."
 fra_news.7.t:0 "[GetNewspaperHeader]Les arrestations du Réseau Jeanson et du FLN en Métropole"
 fra_news.7.d:0 "Sous les ordres du Premier ministre français, le groupe militant de gauche français Réseau Jeanson et le Front de Libération Nationale (FLN) d'Algérie sont arrêtés en Métropole. Ces groupes ont longtemps fait passer de l'argent liquide et des armes depuis la France pour soutenir les belligérants en Algérie, opérant jusque-là sans être détectés. Cependant, après une série d'interrogatoires menés durant la nuit, les lieux de diverses cellules et connexions ont été révélés. Suite à ces informations, les arrestations sont en cours, et tous ceux qui sont complices sont placés en garde à vue."
 fra_news.7.a:0 "Cette série d'arrestations entraînera probablement le FLN à subir des pénuries d'armes et d'argent."
 fra_news.8.t:0 "De Gaulle arrive en Algérie"
 fra_news.8.d:0 "Au milieu de la guerre d'Algérie, Charles De Gaulle est arrivé à Alger et a effectué une tournée dans les principales villes de la région. Alger, Constantine et Oran ont vu le président rencontrer des officiers militaires pour discuter des plans futurs concernant la gestion de l'insurrection. En exposant ses projets, De Gaulle réaffirme que les Algériens ont le choix de décider de leur avenir, mais que tant que la violence militaire persistera, cela ne pourra pas se réaliser. Les conditions pour l'armée française sont jugées satisfaisantes et De Gaulle ordonne de maintenir l'effort de lutte.\nCe voyage a renforcé le moral des troupes combattant en Algérie, prouvant que la campagne pourrait être couronnée de succès si les efforts français se poursuivent, alors que le conflit ne montre aucun signe d'apaisement."
 fra_news.8.a:0 "Le combat continue !"
 fra_news.9.t:0 "Khrushchev visite la France"
 fra_news.9.d:0 "Aujourd'hui, le premier secrétaire du Parti Communiste de l'Union Soviétique, Khrouchtchev, rend visite à De Gaulle dans le cadre d'une mission diplomatique concernant l'Allemagne divisée. Khrouchtchev exige qu'un traité de paix soit conclu avec les deux États allemands, et l'Union Soviétique, ou il conclura un traité avec l'Allemagne de l'Est, leur laissant ainsi le contrôle total des routes menant à la ville. Les tensions autour de la question allemande d'après-guerre s'intensifient, et la question cause des dissensions parmi les alliés occidentaux, qui ne souhaitent pas entrer en guerre si tôt après la Seconde Guerre mondiale."
 fra_news.9.a:0 "La France est-elle prête à reconnaître la République démocratique allemande?"
 fra_news.10.t:0 "Fondation du Parti socialiste unifié"
 fra_news.10.d:0 "Le Parti Socialiste Unifié de France, après de nombreuses années de division à gauche, se rassemble. Les socialistes démocratiques, les gauchistes chrétiens et les sociaux-démocrates de tout le pays célèbrent la fondation du parti. Avec environ 20 000 membres actifs et près de 500 000 supporters estimés à l'échelle nationale, le PSU cherche à élargir son influence à travers une série de campagnes sous la nouvelle gauche unifiée de France. Le PSU travaille actuellement sur la publication de sa plateforme officielle, combinant des éléments communs des trois partis socialistes unis. Avec le soutien des gauchistes à travers le pays, les idéologies de gauche ont plus de chances que jamais d'atteindre le pouvoir politique en France."
 fra_news.10.a:0 "Mitterrand a vraiment fait du bon travail..."
 fra_news.31.a:0 "Une belle visite de notre ami américain !"
 fra_news.31.b:0 "...Ils sont arrivés à Paris comme des rois, ils repartent comme des légendes !"
 fra_news.31.d.jfk:0 "Si les négociations diplomatiques se déroulent en coulisses, l'histoire retiendra principalement ce qui se passe sur scène. Malgré la pluie qui gâche la fin du printemps, l'excitation atteint son apogée dans la capitale, prête à accueillir le couple politique le plus glamour de la planète. Ils sont jeunes, beaux, bronzés, chics et décontractés... La presse alimente encore plus la curiosité du public, car le président et la Première Dame occupent la Maison Blanche depuis seulement cinq mois. \"Cheveux en bataille, mesurant 1,82 m, pesant 81 kg, âgé de 44 ans...\" décrivent les journalistes. Mais très vite, c'est sa femme Jacqueline, 31 ans, qui fait la une des gazettes. Les Parisiens n'ont d'yeux que pour ses \"tenues élégantes\", ses chapeaux en forme de camembert, ses \"yeux rieurs\" et sa voix de petite fille. Mieux encore : elle a du sang français, comme le prouve son prénom et son nom de jeune fille (Bouvier). Kennedy a aussi compris : la star, c'est Jackie. Et il se rattrape : \"Je ne pense pas qu'il soit superflu de me présenter : je suis le gars qui accompagne Jackie Kennedy\", glisse-t-il vendredi en préambule de son discours devant 500 journalistes. La veille, le couple dînait au Palais de Versailles, dans la salle des Glaces éclairée à la bougie. \"Je crois que je suis transportée au paradis, je n'ai jamais rien vu de pareil\", dit Jackie, étincelante dans sa robe brodée. Lorsque la limousine les ramène à Orly, 150 000 personnes les acclament..."
 algerian_war_news.1.t:0 "[GetNewspaperHeader]Détonation de Gerboise Blanche"
 algerian_war_news.1.d:0 "\nL'Explosion qui Secoua l'Afrique\n\nLe test nucléaire tant attendu par la France allait enfin avoir lieu, dans la ville de Reggane, au sud de l'Algérie. De nombreux sites de missiles avaient été installés aux abords du village depuis un certain temps, et c'est dans ce désert qu'un site de test a été construit. Afin d'éviter les risques de contamination par les radiations, la France évacua les civils de la ville voisine et importa 150 prisonniers, supposés être des partisans du FLN, pour être les participants involontaires de l'essai. À 22 h, la bombe nucléaire fut lancée, transformant le site de test et ses malheureux habitants en un feu nucléaire dévastateur.\n\nBeaucoup sont choqués que la France ait pris cette décision, et même ceux de l'Ouest ont dénoncé cet acte. Cette action a exacerbé les tensions dans la guerre d'Algérie en cours, galvanisant le FLN dans une frénésie de rébellion."
 algerian_war_news.1.a:0 "Quelle réussite !"
 algerian_war_news.2.t:0 "Assassinat en Algérie !"
 algerian_war_news.2.d:0 "Henri Lorillot, le commandant en chef des forces françaises pour la colonie algérienne, a découvert des suicides horribles parmi certains des leaders nationalistes algériens les plus en vue. Parmi eux, Robert Barrat, un journaliste farouchement anti-colonialiste. Cette découverte controversée a conduit certains à penser qu'il ne s'agissait pas de suicides, mais plutôt d'assassinats commis par les forces françaises en Algérie. Cela pourrait être très préjudiciable à la colonie nord-africaine actuellement instable."
 algerian_war_news.2.a:0 "Quelles méthodes barbares"
