 FRA_Indochina_War_category_desc:0 "La guerre d'Indochine\n\nAprès une longue campagne de résistance contre les Français et les Japonais, les forces Viet Minh ont remporté une victoire (la Révolution d'août) après la reddition des forces japonaises et des forces françaises de Vichy dans le Nord le 15 août 1945.\n\nLors de la guerre du Vietnam, les forces britanniques ont occupé temporairement le Sud à partir du 13 septembre 1945, pour rétablir le contrôle colonial français en 1946. Aux Nations Unies, et à travers leur alliance avec le Royaume-Uni et les États-Unis, les Français ont exigé le retour de leur ancienne colonie indochinoise avant d'accepter de participer à l'alliance de l'OTAN contre l'expansion soviétique au-delà des pays du Komintern pendant la Guerre froide.\n\nLes Viet Minh communistes, soutenus par les Alliés pendant la Seconde Guerre mondiale, ont continué à combattre les Français avec le soutien de la Chine communiste et de l'Union soviétique."
