 fra_army.7.d:0 "La Gendarmerie nationale, la police militarisée française, trouve ses origines dans la Maréchaussée du Moyen Âge, officiellement créée sous le règne du roi Louis XV en 1720 pour maintenir l'ordre public dans tout le royaume. Elle fut rebaptisée « Gendarmerie » pendant la Révolution française et intégrée aux forces armées, où elle servit à la fois de force de police et de soutien militaire. Tout au long du XIXe siècle, la Gendarmerie est devenue un symbole de l'autorité de l'État dans la France rurale, assurant la sécurité intérieure, menant des enquêtes criminelles et constituant le pilier de l'ordre civil. Sa présence s'est étendue à l'ensemble de l'empire colonial français, où les gendarmes faisaient respecter la loi tant dans les centres urbains que dans les avant-postes reculés. Pendant la Première Guerre mondiale, les gendarmes ont servi au front en tant que police militaire, géraient les voies de ravitaillement et maintenaient la discipline dans les tranchées. Entre les deux guerres, le corps a été modernisé, avec une formation et une coordination améliorées sous l'égide du ministère de la Guerre. Pendant la Seconde Guerre mondiale, la Gendarmerie s'est retrouvée prise entre la France de Vichy et la Résistance. De nombreuses unités ont discrètement soutenu les efforts de la Résistance, tandis que d'autres étaient soumises au contrôle de Vichy. Après 1944, la Gendarmerie fut purgée de ses éléments collaborationnistes et rétablie en tant que branche loyale de la République française. En 1949, la Gendarmerie reste essentielle à la sécurité intérieure de la République. Elle est activement déployée en Algérie, en Indochine et dans toute la France métropolitaine pour réprimer l'insurrection, maintenir l'ordre public et assister l'armée régulière en temps de guerre et de crise."
 fra_army.8.d:0 "L'Armée de Terre trouve ses origines dans les levées féodales du Moyen Âge et s'est transformée en une force permanente professionnelle sous des rois tels que Louis XIV et Napoléon Bonaparte. Officiellement institutionnalisée sous l'Ancien Régime, elle est devenue le principal moteur de la projection de la puissance française à travers l'Europe. À l'époque moderne, l'Armée de Terre s'est illustrée sur la scène internationale lors des guerres napoléoniennes, où, sous Napoléon Ier, elle a remporté une série de victoires historiques à Austerlitz (1805), Iéna (1806) et Wagram (1809). Bien qu'elle ait ensuite subi une défaite cuisante à Waterloo, l'héritage de la doctrine militaire française a perduré tout au long du XIXe siècle, en particulier pendant l'expansion coloniale en Afrique et en Indochine. La Première Guerre mondiale a vu l'armée défendre vaillamment la nation à la Marne (1914), à Verdun (1916) et lors de la deuxième bataille de la Marne (1918). Malgré des pertes effroyables, les troupes françaises ont tenu la ligne et joué un rôle décisif dans la défaite des Empires centraux. En 1940, pendant la Seconde Guerre mondiale, l'armée subit une défaite rapide lors de la bataille de France en raison des tactiques de Blitzkrieg allemandes. Elle se reconstitua cependant en exil et, par l'intermédiaire des Forces françaises libres dirigées par Charles de Gaulle, combattit en Afrique du Nord et en Italie, et contribua à la libération de Paris en 1944. La première guerre d'Indochine, qui débute en 1946, voit l'armée française à nouveau au combat, cette fois face aux insurgés du Viêt Minh dans une lutte longue et acharnée pour le contrôle colonial."
 fra_army.9.d:0 "La Marine nationale, historiquement appelée « La Royale », est une grande puissance navale depuis le XVIIe siècle. Fondée officiellement en 1624 sous le cardinal Richelieu, elle a joué un rôle déterminant tant dans la guerre de Succession d'Espagne que dans la guerre d'Indépendance américaine, notamment lors de la bataille de Chesapeake (1781), qui a conduit à la capitulation britannique à Yorktown. Tout au long du XIXe siècle, la Marine nationale a maintenu la suprématie coloniale, soutenant l’empire d’outre-mer français. À l’aube du XXe siècle, la France disposait de la quatrième marine au monde, dotée de cuirassés modernes et d’un réseau mondial de bases. Pendant la Première Guerre mondiale, la Marine nationale a sécurisé les routes méditerranéennes et combattu la marine austro-hongroise dans l'Adriatique. Le développement naval de l'entre-deux-guerres a donné naissance à des croiseurs modernes comme l'Algérie et aux puissants cuirassés de la classe Dunkerque. En 1940, après la chute de la France, la flotte française s'est divisée entre les forces de Vichy et celles de la France libre. Le sabordage tragique de la flotte à Toulon en 1942 a empêché sa capture par les Allemands, tandis que les forces navales françaises libres ont combattu vaillamment aux côtés des Alliés en Afrique du Nord, en Normandie et pour la protection des convois dans l'Atlantique. En 1949, la Marine nationale française se reconstruit, aidée par le soutien américain et britannique, alors qu'elle projette sa force en Indochine et rétablit le prestige naval de la France."
 fra_army.10.d:0 "L’Armée de l’Air a été officiellement créée en tant que branche indépendante le 2 juillet 1934, bien que ses origines remontent aux débuts de l’aviation militaire pendant la Première Guerre mondiale. Des aviateurs français tels que Georges Guynemer et René Fonck figuraient parmi les meilleurs as de la guerre, le premier devenant un héros national. La France était une puissance aérienne de premier plan dans l’entre-deux-guerres, développant des avions et des doctrines de pointe. Cependant, en 1940, les forces aériennes françaises étaient en infériorité numérique et technologiquement en retard par rapport à la Luftwaffe. Malgré une résistance courageuse dans les airs pendant la bataille de France, l’armée de l’air fut submergée. De nombreux pilotes se sont échappés pour rejoindre les Forces aériennes françaises libres (FAFL), qui ont volé aux côtés de la RAF lors de la bataille d’Angleterre et des campagnes d’Afrique du Nord. L’une des unités les plus célèbres des FAFL était le Groupe de chasse Normandie-Niémen, qui a combattu sur le front de l’Est aux côtés des Soviétiques, s’illustrant par ses exploits. Après la libération, l’armée de l’air s’est rééquipée d’avions alliés et a soutenu les opérations en Allemagne et en Indochine. L'Armée de l'Air est aujourd'hui un pilier essentiel de la puissance militaire française, soutenant les opérations terrestres, défendant l'espace aérien et affirmant la souveraineté française sur l'ensemble de ses territoires à travers le monde."
 french_elections.14.d:0 "Le 17 juin 1951, la Quatrième République française organisa des élections afin de choisir les membres de sa deuxième Assemblée nationale. Le scrutin fut marqué par les divisions amères du début de la guerre froide et par l’instabilité persistante du règlement d’après-guerre.\n\nDepuis la Libération, trois forces principales dominaient la politique française : les communistes (PCF), les socialistes (SFIO) et les démocrates-chrétiens (MRP), les trois principaux courants de la Résistance. Pourtant, dès 1947, l’alliance « tripartite » s’effondra. Les communistes furent exclus du gouvernement, et Charles de Gaulle fonda le Rassemblement du peuple français (RPF), se présentant comme l’alternative à ce qu’il dénonçait comme le « régime des partis ». \n\nEn réponse, les socialistes, les démocrates-chrétiens et les radicaux formèrent la coalition dite de la Troisième Force. Dirigée par Henri Queuille, avec Georges Bidault, Guy Mollet et René Pleven comme vice-présidents du Conseil, cette coalition cherchait à préserver la démocratie parlementaire contre les « menaces jumelles » de la révolution communiste et du populisme gaulliste. Toutefois, l’alliance restait fragile, divisée sur la laïcité, la réforme économique et le rôle de l’État.\n\nCraignant des gains communistes et gaullistes, le gouvernement fit adopter une réforme électorale controversée au début de 1951. Bien que la représentation proportionnelle fût maintenue, si une coalition dépassait 50 % des voix dans une circonscription, elle remportait tous les sièges selon la nouvelle règle de l’apparentement. Ce système favorisait fortement les partis pro-gouvernementaux fragmentés, capables de s’allier, tout en isolant le PCF et le RPF, dont le fossé idéologique empêchait toute coopération."
 french_elections.11.d:0 "En décembre 1953, la Quatrième République française fut confrontée à l’une de ses élections présidentielles les plus longues et chaotiques. La présidence, laissée vacante par Vincent Auriol après son mandat de 1947, devint l’objet d’une lutte acharnée entre la gauche, le centre et la droite, à un moment où la France était secouée par l’instabilité gouvernementale, de profondes divisions sur la guerre d’Indochine et un débat houleux sur le projet de Communauté européenne de défense (CED).\n\nPour la première fois de l’histoire, l’élection fut diffusée à la télévision française. Pourtant, la retransmission se révéla interminable, s’étendant sur plusieurs jours et de nombreux tours de scrutin, et fut finalement interrompue par ordre du gouvernement — une démonstration embarrassante des dysfonctionnements de la République.\n\nDu 17 au 23 décembre, pas moins de treize tours de scrutin eurent lieu :\n\n— Marcel-Edmond Naegelen, soutenu par les socialistes et les communistes, dominait la gauche. Opposant résolu à la CED, il bénéficiait du soutien des parlementaires déterminés à bloquer les ambitions fédéralistes européennes.\n\n— Joseph Laniel, chef du centre-droit, faillit remporter la victoire au 8e tour, échouant de seulement 22 voix. Une manœuvre procédurale du président de séance, le socialiste André Le Troquer, invalida plusieurs bulletins — lui refusant ainsi la présidence.\n\n— Des candidats radicaux comme Yvon Delbos et Jean Médecin tentèrent de rallier le soutien du centre, mais ne parvinrent pas à briser l’impasse.\n\nÀ mesure que les tours se prolongeaient et que l’épuisement s’installait, la candidature de Naegelen resta bloquée par le centre-droit. Le retrait de Laniel laissa la voie ouverte à un compromis. Finalement, la droite et les modérés se rallièrent à René Coty, un parlementaire du Havre jusque-là largement ignoré. Coty, qui s’était abstenu sur la CED en raison d’une opération de la prostate, lança avec ironie : « Si je suis président de la République, c’est parce que j’ai été opéré. »\n\net le gagnant est…."
