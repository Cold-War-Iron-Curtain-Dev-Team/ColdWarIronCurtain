 FRA_airone:0 "Développer l'armée de l'air"
 FRA_airone_desc:0 "L'aviation est la clé de la guerre moderne"
 FRA_fighters:0 "Nouveaux avions"
 FRA_fighters_desc:0 "Nous avons besoin de nouveaux avions"
 FRA_cas_effort:0 "Développer l'appui aérien rapproché"
 FRA_cas_effort_desc:0 "Nous devons développer l’appui aérien rapproché"
 FRA_bombers:0 "Nouveaux bombardiers"
 FRA_bombers_desc:0 "Nous avons besoin de nouveaux bombardiers"
 FRA_bomb_strat:0 "Bombardements stratégiques"
 FRA_bomb_strat_desc:0 "Le bombardement stratégique des lieux clés est la clé de la victoire"
 FRA_airbase_development:0 "Développement des bases aériennes"
 FRA_airbase_development_desc:0 "Nous devrions construire des bases aériennes meilleures et plus grandes"
 FRA_ind_dev:0 "Développer l'industrie"
 FRA_ind_dev_desc:0 "Notre reconstruction étant terminée, un développement plus poussé de notre secteur industriel est définitivement nécessaire."
 FRA_mainland:0 "Le territoire"
 FRA_mainland_desc:0 "La France métropolitaine étant le cœur de notre nation, le développement de sa capacité industrielle est certainement de mise."
 FRA_urbanism:0 "Urbanisme"
 FRA_urbanism_desc:0 "Alors que nos régions urbaines connaissent une croissance démographique fulgurante, due en grande partie à l'exode rural, un développement et une expansion accrus de nos villes sont nécessaires."
 FRA_mic_one:0 "Développement militaire"
 FRA_mic_one_desc:0 "La menace rouge étant si répandue, même dans notre propre pays, le renforcement de notre production militaire est particulièrement nécessaire."
 FRA_mic_two:0 "Continuer à développer notre industrie militaire"
 FRA_mic_two_desc:0 "Notre armée a besoin d’être davantage modernisée pour rester au niveau des autres grandes puissances."
 FRA_cic_one:0 "Développement civil"
 FRA_cic_one_desc:0 "Notre secteur civil a été gravement endommagé pendant la guerre. Maintenant qu’il est réparé, un développement et des investissements supplémentaires devraient protéger notre nation de nouveaux dommages."
 FRA_more_cic:0 "Poursuivre l'expansion de l'industrie civile"
 FRA_more_cic_desc:0 "Notre secteur civil a encore besoin d’investissements pour renforcer davantage notre industrie."
 FRA_ind_reform:0 "Industrialisation réussie"
 FRA_ind_reform_desc:0 "Les plans actuels pour l’expansion future de notre industrie ont été menés à bien de manière adéquate."
 FRA_Elections_of_1951:0 "Élections législatives de 1951"
 FRA_Elections_of_1951_desc:0 "Les élections françaises de 1951 pourraient bien marquer un tournant majeur pour la République. Les principaux adversaires sont la Troisième Force, le RPF et le PCF. Nos amis occidentaux espèrent la victoire de la Troisième Force ou du RPF, car une victoire du PCF poserait problème, mais on ne sait jamais vraiment de quoi l'avenir sera fait."
 FRA_RPF_Victory:0 "Majorité du RPF"
 FRA_RPF_Victory_desc:0 "Le Parti conservateur français (RPF) a réussi à obtenir une majorité électorale au Parlement. Grâce à cela, il a également installé un Premier ministre fidèle, ce qui signifie que, si tout se passe bien, l'avenir de la France pourrait être entre les mains de Charles de Gaulle."
 FRA_Economic_Third_Way:0 "Troisième voie économique"
 FRA_Economic_Third_Way_desc:0 "L'économie française tente depuis trop longtemps de trouver un compromis entre la gauche et la droite. Il est temps de confirmer enfin notre allégeance au monde capitaliste et occidental. Avec cette loi, l'économie française adoptera les principes fondamentaux du capitalisme et entamera son abandon total du communisme."
 FRA_Presidential_Empowerment_decree:0 "Décret d'habilitation présidentielle"
 FRA_Presidential_Empowerment_decree_desc:0 "Nous avons presque toujours plaidé pour un président plus puissant. Aujourd'hui, notre Premier ministre prévoit de promulguer un décret à cet effet, qui, avec l'approbation du Président, devrait devenir loi."
 FRA_Reform_the_voting_system:0 "Réformer le système électoral"
 FRA_Reform_the_voting_system_desc:0 "Le système électoral français est un désastre. Il est supervisé par un Parlement corrompu qui vote toujours dans l'intérêt de ses membres, et l'élection présidentielle française est elle aussi un désastre. Il est temps d'y mettre fin. Le système électoral français doit changer."
 FRA_Reform_the_RTF:0 "Reformer la RTF"
 FRA_Reform_the_RTF_desc:0 "La Radio Télévision Française est depuis longtemps une station de télévision fière et distinguée, mais elle est vieillie, rouillée et, selon certains, même inutile. C'est pourquoi nous avons élaboré un programme de réforme et de restauration de sa place d'antan."
 FRA_Favorize_Gaullist_Syndicates:0 "Favoriser les syndicats gaullistes"
 FRA_Favorize_Gaullist_Syndicates_desc:0 "Il existe dans notre pays de nombreux syndicats qui promeuvent ou défendent un large éventail d'idéologies. Compte tenu de la grande popularité de Charles de Gaulle parmi eux et des similitudes entre nos programmes, il est logique de les favoriser au Parlement."
 FRA_Finish_the_Dams:0 "Finissons les barrages"
 FRA_Finish_the_Dams_desc:0 "Nos réserves d'eau et d'énergie hydroélectrique sont extrêmement faibles, tant en métropole que sur nos terres africaines. En achevant notre projet de barrage en cours dans les deux régions, nous pourrons résoudre ces deux problèmes."
 FRA_Appoint_Giscard_Finances_Minister:0 "Nommer Giscard au poste de ministre des Finances"
 FRA_Appoint_Giscard_Finances_Minister_desc:0 "Valéry Giscard, homme politique incontestablement conservateur, s'est révélé un conseiller économique précieux au niveau local. C'est pourquoi nous envisageons de le nommer ministre des Finances. Nous espérons qu'il pourra aider notre gouvernement à réduire l'hyperinflation."
 FRA_Pragmatic_Politics:0 "Politique pragmatique"
 FRA_Pragmatic_Politics_desc:0 "Maudite Quatrième République ! Nos politiciens et notre président n'ont rien fait, se sont croisés les bras et ont attendu un miracle. Il est temps d'en finir ! Nous, le RPF, ne pouvons plus attendre, et le moment est venu pour la République d'agir !"
 FRA_Breakup_of_the_Troisieme_Force_Coalition:0 "Dissolution de la coalition de la Troisième Force"
 FRA_Breakup_of_the_Troisieme_Force_Coalition_desc:0 "Les politiciens centristes, plutôt que d'admettre leur défaite et de collaborer avec nous, tentent d'entraîner notre glorieux pays dans leur chute. C'est pourquoi, par une loi présidentielle soutenue par le Premier ministre, nous détruirons leur coalition et ne laisserons aucun doute sur qui est au pouvoir."
 FRA_National_Referendum_on_the_Republic:0 "Référendum national sur la République"
 FRA_National_Referendum_on_the_Republic_desc:0 "La Troisième République est tout simplement un système rétrograde. Le Président n'a quasiment aucun pouvoir, tandis que le Premier ministre, souvent une marionnette du Parlement, baigne pratiquement dans ce pouvoir. Le Parlement, aussi idiot soit-il, n'y changera rien, mais le peuple, lui, n'est pas aussi stupide et il changera les choses, et nous lui en donnerons le droit en votant par référendum."
 FRA_Marginalization_of_the_Communists:0 "Marginalisation des communistes"
 FRA_Marginalization_of_the_Communists_desc:0 "Les communistes ne sont que des agents soviétiques, et pour cela, ils doivent être marginalisés lors des prochaines élections. Le peuple ne devrait même pas avoir la possibilité d'élire des provocateurs communistes au Parlement, et nous veillerons à ce qu'ils ne l'obtiennent pas."
 FRA_Find_an_agreement_with_Tunisia:0 "Trouver un accord avec la Tunisie"
 FRA_Find_an_agreement_with_Tunisia_desc:0 "La République française a connu de graves problèmes en Tunisie ces derniers temps. Pour y mettre fin, nous devrions tenter de conclure un accord avec les Tunisiens autochtones, peut-être l'indépendance, peut-être l'autonomie – qui sait – mais il faut agir."
 FRA_Devaluate_the_Franc:0 "Dévaluer le franc"
 FRA_Devaluate_the_Franc_desc:0 "Le franc français est resté si longtemps à un niveau élevé qu'il a failli détruire notre économie. Nous devons le dévaluer rapidement, avant que notre économie et notre monnaie ne s'effondrent trop pour être sauvées."
 FRA_Intensify_Nuclear_Program:0 "Intensifier le programme nucléaire"
 FRA_Intensify_Nuclear_Program_desc:0 "Il est tout à fait clair que la force nucléaire sera le facteur décisif dans toute guerre majeure à venir, et nous devons nous efforcer de disposer de notre propre arsenal puissant et fonctionnel."
 FRA_Invest_in_Rocketry:0 "Investir dans la fuséologie"
 FRA_Invest_in_Rocketry_desc:0 "Cette guerre entre l'Est et l'Ouest est froide, mais rien ne garantit qu'elle ne finira pas par s'échauffer. C'est pourquoi nous devons nous assurer de disposer de la puissance de feu et des missiles nécessaires pour nous défendre."
 FRA_Propose_a_constitutional_Reform:0 "Proposer une réforme constitutionnelle"
 FRA_Propose_a_constitutional_Reform_desc:0 "La Troisième République est terminée. Notre message a trouvé un écho auprès de notre peuple, qui souhaite tourner la page des gouvernements boiteux du passé. Il est temps de réformer la Constitution et de donner plus de pouvoir au Président, qui saura nous guider à travers cette période troublée."
