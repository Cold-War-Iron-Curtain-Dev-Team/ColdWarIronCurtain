 SUPER_EVENT_WINTER_OF_1954_DESC:0 "En hiver 1954, lorsque la température est tombée sous les -15°C pendant une période prolongée, l'Abbé Pierre, ancien résistant et ancien député du MRP, a lancé des appels dans les médias nationaux en faveur de la solidarité sociale pour venir en aide aux pauvres et aux démunis, dont les maisons risquaient de geler et de les condamner à mourir dans l'ignorance totale des autorités sociales et médiatiques. C'est le début de l'« Insurrection de la bonté »."
 abbe_pierre.1.d:0 "Mes amis, venez aider… Une femme est morte gelée cette nuit à 3 heures du matin, sur le trottoir du boulevard Sébastopol, serrant dans ses mains l'avis d'expulsion qui, la veille, l'avait rendue sans abri… Chaque nuit, plus de deux mille personnes endurent le froid, sans nourriture, sans pain, et plus d’un presque nu. Pour faire face à cet horreur, les hébergements d’urgence ne suffisent pas. Écoutez-moi ; au cours des trois dernières heures, deux centres d’aide ont été créés : l’un sous tente, au pied du Panthéon, rue de la Montagne Sainte-Geneviève ; l’autre à Courbevoie. Ils sont déjà saturés, nous devons les ouvrir partout. Ce soir, dans chaque ville de France, dans chaque quartier de Paris, nous devons accrocher des pancartes sous la lumière dans l’obscurité, à la porte des lieux où il y a des couvertures, des lits, de la soupe ; où l’on peut lire, sous le titre ‘Centre d’Aide Fraternelle’, ces simples mots : ‘Si vous souffrez, qui que vous soyez, entrez, mangez, dormez, reprenez espoir, ici vous êtes aimé’. La météo prévoit un mois de grands froids. Aussi longtemps que l’hiver durera, aussi longtemps que les centres existeront, face à leurs frères mourant dans la pauvreté, toute l’humanité doit être d’une seule volonté : celle de rendre cette situation impossible. Je vous en prie, aimons-nous assez pour le faire maintenant. De tant de douleur, qu'une chose merveilleuse nous soit donnée : l’esprit partagé de la France. Merci ! Chacun peut aider ceux qui sont sans abri. Nous avons besoin, ce soir, et au plus tard demain, de cinq mille couvertures, trois cents grandes tentes américaines, et de deux cents poêles catalytiques. Apportez-les rapidement à l'Hôtel Rochester, 92, rue La Boétie. Le rendez-vous pour les bénévoles et les camions pour les transporter : ce soir à onze heures, devant la tente de la Montagne Sainte-Geneviève. Grâce à vous, aucun homme, aucun enfant, ne dormira sur le bitume ou sur les quais de Paris cette nuit."
