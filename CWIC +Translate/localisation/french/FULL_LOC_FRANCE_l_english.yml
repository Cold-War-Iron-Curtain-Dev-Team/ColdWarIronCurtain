 fra_rene_mayer:0 "Enquête sur René Mayer"
 fra_rene_mayer_desc:0 "René Mayer est ministre des Finances et des Affaires économiques, de la Défense nationale et de la Justice. Il est également devenu vice-président de l'Alliance israélite universelle. Porte-parole incontesté, il lance des pétitions en faveur de la grande colonisation à l'Assemblée nationale. Si nous ne mettons pas fin à cette vendetta absurde, il pourrait aggraver les soulèvements algériens…"
