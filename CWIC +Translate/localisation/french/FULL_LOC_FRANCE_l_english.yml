 Michel_Tony_Revillon_Education_minister:0 "Michel Tony-Révillon"
 Jean_Berthoin_Education_minister:0 "Jean Berthoin"
 Rene_Billeres_Education_minister:0 "René Billères"
 Edgar_Faure_Econ_minister:0 "Edgar Faure"
 Edgar_Faure_Foreign_minister:0 "Edgar Faure"
 Edgar_Faure_Educ_minister:0 "Edgar Faure"
 Antoine_Pinay_Foreign_minister:0 "Antoine Pinay"
 Antoine_Pinay_Econ_minister:0 "Antoine Pinay"
 Robert_Schuman_Foreign_minister:0 "Robert Schuman"
 Pierre_Mendes_France_Foreign_minister:0 "Pierre Mendès-France"
 FRA_battle_hull_medium_0:0 "Classe Richelieu"
 FRA_battle_hull_medium_1:0 "Réaménagement de la classe Richelieu"
 FRA_battle_hull_medium_0_desc:0 "La classe Richelieu était composée de cuirassés rapides construits pour la Marine française entre les années 1930 et 1950. Initialement, deux navires furent commandés en 1935 en réponse aux commandes italiennes pour les cuirassés de la classe Littorio l'année précédente. Les Richelieu étaient basés sur la classe Dunkerque précédente, mais agrandis pour loger des canons de 380 mm (15 pouces) plus puissants et un blindage pour les protéger contre des canons de même calibre."
 FRA_battle_hull_medium_1_desc:0 "Une sorte de « et si » le Jean Bart et le Richelieu avaient reçu la même ampleur et la même quantité de réaménagement que les navires de la classe Iowa de l'US Navy."
 FRA_carrier_hull_0:0 "Réaménagement de la classe Béarn"
 FRA_carrier_hull_1:0 "Classe Clemenceau"
 FRA_carrier_hull_2:0 "Réaménagement de la classe Clemenceau I"
 FRA_carrier_hull_3:0 "Réaménagement de la classe Clemenceau II"
 FRA_carrier_hull_4:0 "Classe Charles de Gaulle"
 FRA_carrier_hull_0_desc:0 "Le Béarn était un porte-avions converti à partir d'un cuirassé inachevé de la classe Normandie pour la Marine Nationale dans les années 1920. Entré en service en 1928, la marine avait l'intention de l'utiliser pour développer des tactiques et des techniques pour l'aviation embarquée. Unique porte-avions produit par la France juste après la Seconde Guerre mondiale, le navire a joué un rôle mineur dans les premières étapes de la guerre, s'entraînant dans les eaux nationales et effectuant des formations de pilotes."
 FRA_carrier_hull_1_desc:0 "Les porte-avions de la classe Clemenceau sont une paire de porte-avions qui ont servi dans la Marine française de 1961 jusqu'en 2000. De 2000 à 2017, l'un d'eux a servi dans la Marine brésilienne sous le nom de São Paulo. La classe Clemenceau a été le premier design de porte-avions réussi de la France après la Seconde Guerre mondiale et a constitué l'épine dorsale de la flotte française pendant quarante ans de service."
 FRA_carrier_hull_2_desc:0 "Conçus dès le départ comme des porte-avions polyvalents, les deux navires de la classe Clemenceau, dès 1961, étaient équipés d'un groupe aérien composé de dix avions chacun, de la version d'attaque IVM et de la version de reconnaissance IVP du chasseur-bombardier Dassault Étendard IV, une escadrille de jusqu'à huit avions Breguet Alizé embarqués pour la mission de guerre anti-sous-marine, et dans le rôle de défense aérienne, une escadrille de chasseurs Sud Aviation Aquilon (version sous licence du Havilland Sea Venom)."
 FRA_carrier_hull_3_desc:0 "Le Clemenceau et le Foch ont été modernisés entre septembre 1977 et novembre 1978 pour le Clemenceau et de juillet 1980 à août 1981 pour le Foch. Cette mise à niveau de mi-vie les a rendus compatibles avec le nouveau Super Étendard (ainsi que plusieurs autres améliorations, comme le système SENIT C3). À cette époque, ils pouvaient embarquer jusqu'à 40 avions : 10 F-8FN, 15 à 16 Super Étendard, 3 à 4 Étendard IVP, 7 Alizé, 2 Super Frelon et 2 Alouette III. Leur hangar mesurait 152 × 24 × 7 mètres (3 648 mètres carrés). Les réservoirs de carburant du Clemenceau étaient de 1 200 mc (JP5) et 400 mc (AVGAS). Le Foch a augmenté cette capacité à 1 800 et 109 respectivement."
 FRA_carrier_hull_4_desc:0 "Le Charles de Gaulle est le navire amiral de la Marine Nationale. Il s'agit du dixième porte-avions français, du premier navire de surface français à propulsion nucléaire, et du seul porte-avions nucléaire construit en dehors de la Marine des États-Unis. Il porte le nom de l'homme d'État et général français Charles de Gaulle."
 FRA_carrier_hull_light_0:0 "Classe d'Arromanches"
 FRA_carrier_hull_light_1:0 "Réaménagement de la classe Arromanches"
 FRA_carrier_hull_light_2:0 "Classe Jeanne d'Arc"
 FRA_carrier_hull_light_3:0 "Classe Foudre"
 FRA_carrier_hull_light_4:0 "Classe Mistral"
 FRA_carrier_hull_light_0_desc:0 "Le porte-avions léger de conception de 1942, communément appelé le porte-avions léger de la flotte britannique, était un design de porte-avions léger créé par la Royal Navy pendant la Seconde Guerre mondiale, et utilisé par huit forces navales entre 1944 et 2001. Ils ont été conçus et construits par des chantiers navals civils pour servir de solution intermédiaire entre les porte-avions de flotte coûteux et de grande taille et les porte-avions d'escorte moins chers mais à capacités limitées."
 FRA_carrier_hull_light_1_desc:0 "L'Arromanches a été reconstruit avec un pont d'envol incliné à quatre degrés, un mirador de prise de vue pour les atterrissages et d'autres modifications pour la guerre anti-sous-marine, y compris l'opération d'avions de guerre anti-sous-marine Breguet Alizé. Elle a également été équipée pour des opérations d'entraînement."
 FRA_carrier_hull_light_2_desc:0 "La Jeanne d'Arc était un croiseur porte-hélicoptères de la Marine française. Elle était le sixième navire de la Marine française portant le nom de Jeanne d'Arc, une héroïne nationale de la France et sainte de l'Église catholique qui s'est distinguée pendant la Guerre de Cent Ans en aidant la France à inverser le cours de la phase lancastrienne."
 FRA_carrier_hull_light_3_desc:0 "La classe Foudre était une classe de docks de débarquement utilisés par la Marine française. Les navires ont été en service de 1990 jusqu'à aujourd'hui. En 2011, le Foudre a été vendu à la Marine chilienne. Le Siroco a été vendu à la Marine brésilienne en 2015."
 FRA_carrier_hull_light_4_desc:0 "La classe Mistral est une classe de cinq navires de débarquement amphibie construits par la France. Également connus sous le nom de porte-hélicoptères et appelés « bâtiments de projection et de commandement » (BPC), un navire de classe Mistral est capable de transporter et déployer 16 hélicoptères NH90 ou Tigre, quatre barges de débarquement, jusqu'à 70 véhicules, dont 13 chars Leclerc, ou un bataillon de chars Leclerc de 40 unités, ainsi que 450 soldats."
 FRA_carrier_hull_super_4:0 "Porte-avions de nouvelle génération"
 FRA_carrier_hull_super_4_desc:0 "La Marine française planifie activement un futur porte-avions et un nouveau navire amiral. Il est connu en français sous le nom de Porte-avions de nouvelle génération (PA-NG)."
 FRA_sub_hull_small_single_0:0 "Classe Aurore"
 FRA_sub_hull_small_single_0_desc:0 "Cinq des sous-marins, Andromède, Astrée, Africaine, Artémis et Créole, ont été achevés après la guerre, ont été mis en service dans la Marine française et ont servi jusque dans les années 1960. Andromède, Artémis et Créole étaient équipés de mâts GUPPY et de puits de snorkel pour sous-marins."
 FRA_sub_hull_small_single_1:0 "Classe Daphné"
 FRA_sub_hull_small_single_1_desc:0 "Le sous-marin de classe Daphné était une classe de sous-marins à propulsion diesel-électrique conçus et construits par le constructeur de défense français, DCNS, pour la Marine française en 1964. Ils ont été commercialisés par le gouvernement français pour le marché de l'exportation."
 FRA_sub_hull_small_single_3:0 "Classe Scorpène"
 FRA_sub_hull_small_single_3_desc:0 "Les sous-marins de classe Scorpène sont une classe de sous-marins d'attaque diesel-électriques développés conjointement par le groupe naval français (anciennement la Direction des Constructions Navales) et l'entreprise espagnole Navantia."
 FRA_sub_hull_small_single_4:0 "Classe Scorpène 2000"
 FRA_sub_hull_small_single_4_desc:0 "Les sous-marins de classe Scorpène sont une classe de sous-marins d'attaque diesel-électriques développés conjointement par le groupe naval français (anciennement la Direction des Constructions Navales) et l'entreprise espagnole Navantia."
 FRA_sub_hull_large_single_0:0 "Classe Narval"
 FRA_sub_hull_large_single_0_desc:0 "La classe Narval (sous-marins d'escadre) était une classe de sous-marins de patrouille construits pour la Marine française dans les années 1950."
 FRA_sub_hull_large_single_1:0 "Classe Aréthuse"
 FRA_sub_hull_large_single_1_desc:0 "La classe Aréthuse était une classe de sous-marins construits pour la Marine française dans les années 1950. Ils étaient conçus comme des sous-marins d'attaque pour la guerre anti-sous-marine et étaient appelés Sous-marins de Chasse par la Marine française."
 FRA_sub_hull_large_single_2:0 "Classe Agosta"
 FRA_sub_hull_large_single_2_desc:0 "Le sous-marin de classe Agosta est une classe de sous-marins d'attaque rapide diesel-électriques développée et construite par le constructeur français DCNS dans les années 1970 pour succéder aux sous-marins de classe Daphné. Ces sous-marins ont servi dans la Marine française ainsi que dans les marines de l'Espagne et du Pakistan."
 FRA_sub_hull_large_single_3:0 "Classe Rubis"
 FRA_sub_hull_large_single_3_desc:0 "La classe Rubis est une série de sous-marins d'attaque nucléaires opérés par la Marine française. La classe comprend six navires et ce sont les sous-marins nucléaires d'attaque les plus compacts à ce jour. Tous les sous-marins de la classe (à l'exception du Casabianca) sont nommés d'après des pierres précieuses."
 FRA_sub_hull_large_single_4:0 "Classe Barracuda"
 FRA_sub_hull_large_single_4_desc:0 "La classe Barracuda (ou classe Système nucléaire de plongée et de dissuasion) est une classe de sous-marins nucléaires d'attaque, conçue par le constructeur naval français Naval Group (anciennement connu sous le nom de DCNS et DCN) pour la Marine française. Elle est destinée à remplacer les sous-marins de la classe Rubis. La construction a commencé en 2007 et la première unité a été mise en service le 6 novembre 2020. La capacité opérationnelle complète n'est pas attendue avant 2022."
 FRA_sub_hull_large_double_0:0 "Classe Gymnote"
 FRA_sub_hull_large_double_0_desc:0 "Le Gymnote (S655) était un sous-marin expérimental de la Marine française. Il a servi de sous-marin d'essais pour les missiles balistiques lancés depuis un sous-marin (SLBM) et était propulsé par des moteurs diesel-électriques. Il porte son nom en l'honneur du Gymnote, le premier sous-marin entièrement électrique au monde, construit en France à la fin du XIXe siècle."
 FRA_sub_hull_large_double_1:0 "Classe Redoutable"
 FRA_sub_hull_large_double_1_desc:0 "Le sous-marin de classe Le Redoutable était un sous-marin lanceur d'engins de la Marine nationale française. En français, ce type de sous-marin est appelé « Sous-marin Nucléaire Lanceur d'Engins » (SNLE)."
 FRA_sub_hull_large_double_2:0 "Réaménagement de la classe Redoutable"
 FRA_sub_hull_large_double_2_desc:0 "Le sous-marin de classe Le Redoutable était un sous-marin lanceur d'engins de la Marine nationale française. En français, ce type de sous-marin est appelé « Sous-marin Nucléaire Lanceur d'Engins » (SNLE)."
 FRA_sub_hull_large_double_3:0 "Classe Triomphant"
 FRA_sub_hull_large_double_3_desc:0 "La classe Triomphant des sous-marins nucléaires lanceurs d'engins de la Marine française est la classe de sous-marins en service actif, composée de quatre unités qui ont été mises en service en 1997, 1999, 2004 et 2010. Ces quatre sous-marins ont remplacé la classe Redoutable plus ancienne, et ils constituent le composant océanique (la Force océanique stratégique) de la force de frappe nucléaire de la France, la Force de dissuasion."
 FRA_screen_hull_medium_0:0 "Classe Le Corse"
 FRA_screen_hull_medium_0_short:0 "Type E50"
 FRA_screen_hull_medium_0_desc:0 "La classe Le Corse (ou type E50) était une classe de 4 frégates rapides (Escorteurs Rapides) construite pour la Marine française au début des années 1950. Elles furent la première classe de navires de combat de surface construite après la Seconde Guerre mondiale et symbolisaient \"le renouveau de la flotte française.\" Elles furent suivies par les frégates de la classe Le Normand (ou type E52), et comme elles, étaient des escorteurs de convois longue portée capables d'atteindre des vitesses élevées."
 FRA_screen_hull_medium_1:0 "Classe Le Normand"
 FRA_screen_hull_medium_1_short:0 "Type E52"
 FRA_screen_hull_medium_1_desc:0 "La classe Le Normand (ou type E52) était une classe de 14 frégates rapides (Escorteurs Rapides) construites pour la marine française à la fin des années 1950. Elles étaient la suite immédiate des frégates antérieures de la classe Le Corse (ou type E50) et, comme elles, étaient des escorteurs de convois à longue portée capables d'atteindre une vitesse élevée."
 FRA_screen_hull_medium_2:0 "Classe d'Estienne d'Orves"
 FRA_screen_hull_medium_2_short:0 "Type A69"
 FRA_screen_hull_medium_2_desc:0 "Les avisos de la classe D'Estienne d'Orves, également connus sous le nom de type A69, sont une classe d'avisos, comparable en taille à une corvette légère, principalement conçus pour la défense côtière anti-sous-marine, mais également disponibles pour des missions d'escorte en haute mer (notamment lors de missions de soutien avec la FOST). Construits sur un design simple et robuste, ils disposent d'un système de propulsion économique et fiable qui leur permet d'être utilisés pour des missions de présence à l'étranger."
 FRA_screen_hull_medium_3:0 "Classe Floréal"
 FRA_screen_hull_medium_3_desc:0 "La classe Floréal est un type de « frégates de surveillance » légères conçues pour les besoins de la Marine nationale dans les environnements à faible menace commandées en 1989."
 FRA_screen_hull_medium_4:0 "Classe La Fayette"
 FRA_screen_hull_medium_4_desc:0 "La classe La Fayette (également connue sous le nom de FL-3000 pour \"Frégate Légère de 3 000 tonnes\", ou FLF pour Frégate Légère Furtive) est une classe de frégates polyvalentes construite par DCNS et opérée par la Marine française."
 FRA_screen_hull_heavy_0:0 "Classe Le Hardi"
 FRA_screen_hull_heavy_0_desc:0 "La classe Le Hardi était composée de douze destroyers (en français, torpilleurs d'escadre) construits pour la Marine nationale à la fin des années 1930. Seuls sept navires furent finalement achevés, tandis que la construction des cinq autres fut interrompue par la défaite française lors de la bataille de France en mai-juin 1940 et ne fut jamais terminée."
 FRA_screen_hull_heavy_1:0 "Classe Surcouf"
 FRA_screen_hull_heavy_1_short:0 "Type T47"
 FRA_screen_hull_heavy_1_desc:0 "Les destroyers de la classe T 47, ou classe Surcouf, furent les premiers destroyers construits pour la Marine française après la Seconde Guerre mondiale. Douze navires furent construits entre 1955 et 1957. Ils furent modernisés dans les années 1960."
 FRA_screen_hull_heavy_2:0 "Classe Union et Fraternité Française"
 FRA_screen_hull_heavy_2_desc:0 "Les frégates antiaériennes de classe Union et Fraternité Française étaient des destroyers de premier rang de la Marine nationale. Elles étaient conçues pour protéger une flotte contre les menaces aériennes, les navires de surface, les sous-marins et, dans une moindre mesure, fournir une puissance de feu contre les objectifs terrestres. Elles furent les premiers navires français à être construits spécifiquement comme frégates lance-missiles."
 FRA_screen_hull_heavy_3:0 "Classe Cassard"
 FRA_screen_hull_heavy_3_short:0 "F70 type AA"
 FRA_screen_hull_heavy_3_desc:0 "La classe Cassard (type F70 AA) était une classe de deux destroyers de lutte antiaérienne de la Marine française, introduite à la fin des années 1980 et au début des années 1990. Il s'agissait d'une variante de la classe Georges Leygues destinée à la défense aérienne. Les deux classes disposaient d'un armement et d'un système de propulsion différents, montés sur une coque identique."
 FRA_screen_hull_heavy_4:0 "Classe Horizon"
 FRA_screen_hull_heavy_4_desc:0 "La classe Horizon est une classe de destroyers de défense aérienne en service dans la Marine nationale française et la Marine italienne. Ils sont classés comme destroyers selon la classification OTAN. Le programme a débuté sous le nom de Frégate Commune de Nouvelle Génération (CNGF), une collaboration multinationale visant à produire une nouvelle génération de frégates de défense aérienne. En Italie, cette classe est connue sous le nom de classe Orizzonte."
 FRA_battle_hull_light_0:0 "Classe La Galissonnière"
 FRA_battle_hull_light_0_desc:0 "Les croiseurs de la classe La Galissonnière ont été mis en service par la Marine française dans les années 1930. Ce furent les derniers croiseurs français achevés après 1935, jusqu'à la mise en service du De Grasse en 1956. Ils sont considérés comme des navires rapides, fiables et réussis."
 FRA_battle_hull_light_1:0 "Classe De Grasse"
 FRA_battle_hull_light_1_desc:0 "Après la guerre, la coque a finalement été mise à l'eau en 1946. La construction a de nouveau été interrompue entre 1946 et 1951, lorsqu'elle a été remorquée vers le chantier naval de Brest pour être achevée, selon un design largement modifié en tant que croiseur anti-aérien."
 FRA_battle_hull_light_2:0 "Classe Colbert"
 FRA_battle_hull_light_2_desc:0 "Le Colbert (C 611) était un croiseur anti-aérien, transformé plus tard en croiseur lance-missiles, de la Marine française. Il était le sixième navire (et le deuxième croiseur) de la Marine française à porter le nom de Jean-Baptiste Colbert (le précédent ayant été sabordé à Toulon en 1942). Il a servi dans la Marine de 1956 à 1991, avant d'être converti en navire musée à Bordeaux à partir de 1993. Le Colbert a été démoli en 2016."
 indochina_decolonisation.1.t:0 "[GetNewspaperHeader]La France accorde l'indépendance au Royaume du Laos"
 indochina_decolonisation.1.d:0 "Notre Royaume du Laos a célébré son indépendance nouvellement acquise le [?global.date.GetDateStringNoHourLong]	, avec un mélange de fierté et d'espoir prudent, après des années de domination coloniale, le traité franco-laotien d'amitié et d'association symbolisait une nouvelle ère pour la nation. Le gouvernement laotien, dirigé par notre roi Sisavang Vong, considérait ce moment comme une étape cruciale vers l'autodétermination et l'unité nationale. Cependant, les défis liés au maintien de la stabilité et à la gestion des tensions régionales étaient évidents, alors que le Laos cherchait à se faire une place dans un sud-est asiatique en pleine évolution."
 indochina_decolonisation.1.a:0 "Une victoire pour notre peuple."
 indochina_decolonisation.2.t:0 "[GetNewspaperHeader]La France accorde l'indépendance au Royaume du Kampuchea"
 indochina_decolonisation.2.d:0 "Le [GetMonth] [GetYear], notre Royaume de Kampuchea a enfin obtenu son indépendance tant recherchée, marquée par le retour triomphal de notre roi Norodom Sihanouk à Phnom Penh. Le peuple khmer s'est réjoui de la fin de la domination coloniale française, la voyant comme une restauration de la fierté nationale et de la souveraineté. La déclaration d'indépendance de Sihanouk a été perçue comme un moment unificateur, ouvrant la voie à un nouveau chapitre de l’histoire du Kampuchea. Cependant, la nation a dû faire face à la tâche ardue de forger un avenir stable et prospère au milieu des incertitudes régionales et des défis internes."
 indochina_decolonisation.2.a:0 "En avant vers le futur !"
 indochina_decolonisation.3.t:0 "[GetNewspaperHeader]La France accorde l'indépendance au Kampuchea et au Laos"
 indochina_decolonisation.3.d:0 "Le [?global.date.GetDateStringNoHourLong]	, le Ministère français des Colonies a officiellement transféré ses pouvoirs restants au Royaume du Laos par le biais du traité franco-laotien d'amitié et d'association, marquant ainsi la fin de la domination coloniale française. De même, un accord partiel avec le Kampuchea a conduit le roi Norodom Sihanouk à proclamer l'indépendance, revenant triomphalement à Phnom Penh.  \nDu point de vue français, cette démarche était perçue comme une concession nécessaire face à la montée des mouvements nationalistes. En accordant l'indépendance, la France espérait maintenir des relations amicales et préserver son influence dans la région, en dépit de la montée du sentiment anticolonial."
 indochina_decolonisation.3.a:0 "Cela permettra, espérons-le, de contenir le communisme en Indochine."
 indochina_decolonisation.4.t:0 "[GetNewspaperHeader]La France accorde l'indépendance aux royaumes du Kampuchéa et du Laos"
 indochina_decolonisation.4.d:0 "Notre gouvernement du Quoc-gia a vu la récente décision de la France d'accorder l'indépendance aux Royaumes de Cambodge et de Laos avec un optimisme prudent. Bien que cela marque le déclin de l'influence coloniale dans la région, cela signale également un changement dans l'équilibre des pouvoirs. Notre leader [VIE.leader] nous espérions que ces nations nouvellement indépendantes se joindraient à nous pour résister à l'expansion communiste et maintenir la stabilité en Asie du Sud-Est. Cette démarche était perçue comme un pas vers la solidarité régionale face à la menace imminente représentée par le Viet Minh et leurs alliés."
 indochina_decolonisation.4.a:0 "Bienvenue les amis"
 indochina_decolonisation.5.t:0 "[GetNewspaperHeader]Accorde l'indépendance aux royaumes du Kampuchea et du Laos"
 indochina_decolonisation.5.d:0 "Du point de vue de notre Parti, l'octroi de l'indépendance par la France au Kampuchea et au Laos représentait une victoire stratégique pour le mouvement anti-colonial plus large. Le Vieux Oncle Ho et le Parti y voyaient une preuve supplémentaire de l'affaiblissement de l'emprise des forces impérialistes en Indochine. Nos dirigeants considéraient également les nations nouvellement indépendantes comme des alliées potentielles dans la lutte contre la domination étrangère et espéraient encourager des mouvements révolutionnaires au sein de ces pays pour soutenir la cause communiste plus large en Asie du Sud-Est."
 indochina_decolonisation.5.a:0 "Félicitations à nos camarades indochinois"
 CWIC.2.t:0 "Le miracle de l'utérus d'acier !"
 CWIC.2.d:0 "Moscou, 4 décembre 1993\n\nDans une révélation qui a stupéfié scientifiques, soldats et hommes d’État, l’Institut soviétique de cybernétique a annoncé que §YUnit Katerina-7§!, une construction de compagnon autonome de classe IV, est enceinte.\n\nLa grossesse, la première jamais enregistrée entre un humain et une machine, survient seulement deux ans après que le Plan d’automatisation populaire de l’URSS a introduit des robots dans chaque usine, ferme et bureau à travers l’Union. Désormais, il semble que la frontière entre la chair et l’acier se soit encore davantage estompée.\n\nL’ingénieur en chef Yuri S. Dmitriev a déclaré, §G« Nous avons atteint la synthèse dialectique de la biologie et de la machinerie. C’est la victoire du socialisme sur les limites de la nature. »§! Les médias d’État appellent l’enfant à naître §Y« Le Bébé du Peuple »§!, tandis qu’en Occident, l’OTAN tient des réunions d’urgence pour discuter de ce que cette percée pourrait signifier pour l’équilibre des puissances.\n\nLa date prévue de naissance est fixée à avril 1994. En attendant, les regards du monde entier se tournent vers Moscou, où l’avenir est peut-être déjà en train de grandir."
 fre_report.1.t:0 "L'inspection des revers"
 fre_report.1.d:0 "Le général Georges Revers, récemment chargé d’examiner la détérioration de la position française en Indochine, a achevé sa mission d’inspection. Accompagné de Roger Peyré, son proche collaborateur, Revers devait proposer des solutions pour reprendre l’initiative dans le conflit qui s’aggrave dans la colonie face au Viet Minh.\nLe rapport Revers qui en résulte, soumis confidentiellement le 29 juin 1949, présente des perspectives sombres : défaites militaires généralisées, corruption endémique dans le régime de Bao Dai, troupes locales peu fiables et moral bas parmi les soldats français. Revers propose une réorientation majeure — un retrait partiel des postes frontaliers du nord devenus indéfendables, la formation d’une armée nationale vietnamienne et l’internationalisation du conflit afin d’obtenir le soutien britannique et thaïlandais, ou bien la proposition d’un traité de paix avec Ho-chi-Minh.\nLe rapport, imprimé en seulement 50 exemplaires top secret, était destiné uniquement aux plus hauts niveaux du gouvernement. Mais sa critique brutalement honnête de la politique coloniale française et du gouvernement de Bao Dai provoque bientôt l’indignation dans les milieux politiques et militaires."
