 FRA_Algerian_War_category_desc: "Soutien à l'Algérie française: §G[?FRA.Algerian_mending]§!\nNationalisme algérien: §R[?FRA.Algerian_Nationalism]§!\nMécontentement de l'armée: §R[?FRA.Army_discontent]§!\nMécontentement de la gauche: §R[?FRA.Left_Discontent]§!\nLa popularité de De Gaulle: §H[?FRA.Degaulle_Support]§!\nUnion française: §Y[?FRA.French_Union_Unity]§!\nL'indépendantisme colonial: §Y[?FRA.Rda_Support]§!"
 gaulle_speech_category:0 "Discours publics du général Charles de Gaulle"
 gaulle_speech_category_desc:0 "Le général de Gaulle a fait beaucoup de grandes choses pour notre nation, il a conduit notre nation à lutter contre les nazis et veut une France plus forte et libre de toute influence étrangère, ses discours remontent toujours le moral du peuple français."
 speak_on_may_first:0 "Discours public du 1er mai 1950"
 speak_on_may_first_desc:0 "De la renaissance de la France aujourd'hui dans un monde en fusion, au milieu de tous les appels à la haine ou à la faiblesse, parmi tous les intérêts opposés qui ont embrouillé moi et mes compagnons, disons que dans le pays rien n'importe sauf de restaurer l'unité. D'abord et avant tout par l'harmonie sociale, nous sommes sûrs que la masse des Français qui nous ont déjà rejoints, sans ajouter beaucoup de ceux qui ne nous entendent pas d'abord dire ou refusent de nous suivre, les travailleurs sont avant tout avec vous. Je veux construire la nouvelle France, d'abord en ce qui concerne la question principale qui domine tout ce qui est dans la profondeur de tout le drame de notre époque, je veux dire, c'est la question des conditions de travail."
