 france_junta.1.d:0 "Aujourd'hui, sur la Place de la Bastille, l'ex-président et traître à la République, Charles de Gaulle, a été placé sur la guillotine pour subir son exécution. Ses derniers mots furent : \"Au nom de la France, je commande que tous les moyens, je dis tous les moyens, soient utilisés pour bloquer la route partout pour ces hommes, en attendant de les réduire.\""
 france_junta.2.d:0 "Tôt ce matin, sur la Place de la Concorde, les dirigeants communistes et socialistes ont été alignés et abattus de sang-froid. Deux figures importantes étaient le député socialiste et ancien candidat à la présidence, François Mitterrand, et le secrétaire général du Parti Communiste, Maurice Thorez."
