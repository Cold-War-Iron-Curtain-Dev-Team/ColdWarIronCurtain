 ECSC_desc:0 "Dans une étape sans précédent vers la coopération européenne, §cla France§!, §Pl’Allemagne de l’Ouest§!, §Gl’Italie§!, §mla Belgique§!, §Nles Pays-Bas§! et §4le Luxembourg§! ont établi la Communauté européenne du charbon et de l’acier (CECA). Officiellement entrée en vigueur à la suite du traité de Paris de 1951, la CECA crée une §Rautorité supranationale§! chargée de superviser la production de charbon et d’acier, garantissant qu’aucune nation ne puisse contrôler unilatéralement ces matériaux essentiels à la guerre. Les décisions concernant les niveaux de production, les prix et le commerce sont désormais placées sous la juridiction de la Haute Autorité, un organisme indépendant chargé de réguler le marché dans l’intérêt de tous les États membres."
