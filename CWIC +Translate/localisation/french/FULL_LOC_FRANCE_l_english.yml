 Algerian_Independentism_desc:0 "Guerre d'Algérie\nRelation Franco-Autochtones: §G[?FRA.Algerian_mending]§!\nNationalisme algérien: §R[?FRA.Algerian_Nationalism]§!"
 fra_algerian_rights_1_tooltip:0 "Nous allons tenter de faire adopter une loi au Parlement accordant des droits étendus aux Algériens de souche, en changeant leur statut d'autochtone en celui de Français musulman. Bien sûr, il ne s'agit pas d'une citoyenneté à part entière, mais si cette loi est adoptée, nous espérons leur accorder des droits égaux à l'avenir."
