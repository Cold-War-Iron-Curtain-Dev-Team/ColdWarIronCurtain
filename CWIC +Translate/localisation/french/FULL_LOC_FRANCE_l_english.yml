 European_Development_Fake_description:0 "Lorsque Aristide Briand, Gustav Stresemann et Richard Coudenhove-Kalergi ont défendu les idéaux du partenariat franco-allemand et de l'unité européenne dans les années 1920, ils se sont heurtés à des oreilles souvent sourdes, marquées par le chauvinisme et le nationalisme, minimisant l'importance de l'unité et des interdépendances. Avec la Seconde Guerre mondiale derrière nous, une nouvelle chance pour l'intégration européenne peut commencer. Un chapitre qui pourrait rapprocher les nations d'Europe pour mettre fin aux guerres incessantes qui ont ravagé ce continent au cours des siècles."
