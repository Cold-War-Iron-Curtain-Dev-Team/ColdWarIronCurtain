 tripartite.1.d:0 "Le Pacte tripartite avec les États-Unis et la Grande-Bretagne a été refusé. Accepter un tel pacte créerait un déséquilibre majeur des pouvoirs. Pour que la France conserve son indépendance et sa place sur la scène internationale, elle doit continuer à éviter les accords qui la rendraient dépendante ou partenaire subalterne. Bien que les États-Unis et la Grande-Bretagne soient déçus, il est essentiel que la France protège avant tout ses propres intérêts, bien que nous maintenions notre partenariat."
 algerian_war.1.d:0 "Les informations concernant un cessez-le-feu en Algérie se répandent lentement à travers la France. De nombreux citoyens français commencent à se lasser du conflit sans fin. Les premiers rapports suggèrent qu'il pourrait y avoir une partition entre les Français et les Algériens. Cependant, la nouvelle du cessez-le-feu est accueillie avec un optimisme prudent. Des rumeurs croissantes font état du mécontentement des Pieds-Noirs face à cette nouvelle. Ils se sentent de plus en plus trahis par le gouvernement français et des craintes émergent qu'un coup d'État soit lancé pour saboter tout règlement en Algérie."
 fra_post_edc.1.desc:0 "À la suite d'une récente attaque terroriste en Algérie, nombreux sont ceux au sein du gouvernement qui estiment que le parti nationaliste MTLD en est l'architecte. Le MTLD a remplacé l'ancien parti nationaliste après sa mise à l'interdiction. Nos rapports de renseignement indiquent que le parti connaît de nombreuses querelles internes, notamment entre modérés et extrémistes, et qu'une faction du parti pourrait avoir orchestré l'attaque. Cependant, d'autres sources suggèrent que l'attaque pourrait provenir d'un nouveau groupe cherchant à s'imposer. L'enquête est en cours."
 fra_crisis.1.crisis_end_well_desc:0 "Le public français soutient largement le gouvernement pour ses actions lors de la crise de Suez. Beaucoup louent l'armée française pour ses opérations professionnelles, efficaces et précises contre les Égyptiens. Il y a un sentiment que la France efface la tache de sa défaite durant la Seconde Guerre mondiale et s'affirme comme une grande puissance mondiale. Cela, malgré les critiques internationales à l'égard de l'intervention. Le public français accepte les raisons de cette intervention et estime que toute opposition provient d'un effort de la communauté internationale pour maintenir la France dans la faiblesse."
 fra_crisis.1.crisis_end_bad_desc:0 "Une colère généralisée se dirige vers le gouvernement français suite à son échec lors de l'aventure de Suez. Les partis d'opposition et d'autres organisations organisent des manifestations à travers le pays tandis que les médias publient des éditoriaux négatifs. Beaucoup en France estiment que le gouvernement a plongé son armée dans une opération pour laquelle elle n'était pas préparée, et qu'il a fini par humilier la France sur la scène internationale. Des accusations ont également été portées selon lesquelles le gouvernement aurait compromis les intérêts français ou, au pire, se serait laissé entraîner par Israël et la Grande-Bretagne."
 fra_crisis.2.bombing_sakiet_sidi_desc:0 "Les rapports des commandants militaires en Algérie indiquent que l'ALN a intensifié ses raids depuis ses refuges en Tunisie. Les rebelles utilisent également la frontière et leurs liens avec des sympathisants tunisiens pour inonder l'Algérie et le FLN d'armes. Nos forces tentent d'intercepter ces forces et ces armements, mais les Tunisiens ne coopèrent pas. Les tentatives diplomatiques avec la Tunisie n'avancent pas et les relations continuent de se détériorer. L'armée demande l'autorisation de lancer une frappe aérienne sur la ville de Sakiet Sidi Youssef. Il s'agit d'un important point de rassemblement de l'ALN, et une frappe efficace pourrait paralyser leurs opérations. Cependant, si nous donnons cette autorisation, cela risque de provoquer une forte réaction de la part de la Tunisie."
 fra_crisis.3.bombing_sakiet_sidi_desc:0 "Le village tunisien de Sakiet Sidi Youssef a récemment été victime de frappes aériennes indiscriminées de la part des avions français basés en Tunisie. La France a affirmé que le village abritait une grande base de l'ALN et que l'attaque avait neutralisé les rebelles. La frontière entre l'Algérie et la Tunisie a connu une forte intensification des affrontements entre l'ALN et les forces françaises. Malgré les affirmations françaises, l'attaque a tué des dizaines de personnes, en blessant beaucoup d'autres, principalement des civils. Le peuple tunisien est furieux et exige une réponse. Le gouvernement est fortement incité à rompre les liens diplomatiques avec la France, et ne pas le faire pourrait provoquer un bouleversement parmi la population tunisienne."
 fra_crisis.31.bombing_sakiet_sidi_desc:0 "Le conflit entre les combattants nationalistes algériens du FLN et les forces françaises en Algérie s'est intensifié après la nouvelle que des avions de guerre français ont lancé des frappes aériennes sur la ville frontalière tunisienne de Sakiet Sidi Youssef. La France accuse depuis longtemps les rebelles algériens d'utiliser les zones frontalières tunisiennes comme points de rassemblement pour leurs opérations contre les forces françaises. Ils évoquent l'augmentation des attaques dans la région ainsi qu'une montée en flèche du trafic d'armes en provenance de Tunisie. Le gouvernement tunisien a longtemps résisté aux pressions diplomatiques françaises concernant leurs préoccupations en matière de sécurité et est furieux à cause du bombardement. Les autorités tunisiennes rapportent que le bombardement a été indiscriminé, faisant des centaines de victimes civiles. Les pertes humaines et la violation flagrante de la souveraineté nationale sont intolérables pour le peuple tunisien, et beaucoup souhaitent la rupture des relations diplomatiques avec la France."
 fra_crisis.4.motion_of_non_confidence_desc:0 "L'Assemblée nationale à Paris a voté une motion de censure, mettant ainsi fin au gouvernement du Premier ministre Félix Galliard. Le jeune Premier ministre avait cherché à construire une alliance politique centriste, mais ces efforts ont été contrariés par la guerre d'Algérie. L'armée française a récemment lancé des frappes aériennes contre le village frontalier tunisien de Sakiet Sidi Youssef, prétendument pour cibler une base du FLN. Cependant, le grand nombre de victimes, dont de nombreux civils selon les rapports, ainsi que la violation de la souveraineté tunisienne, ont provoqué une grave crise diplomatique. Les autorités tunisiennes retirent rapidement les privilèges français dans le pays, et beaucoup en France estiment que le gouvernement a complètement échoué à gérer la situation et ne peut plus être digne de confiance pour gouverner. Pour beaucoup en France, l'effondrement rapide du gouvernement Galliard s'inscrit dans l'instabilité politique générale qui a frappé la Quatrième République."
 fra_crisis.5.motion_of_non_confidence_desc:0 "La France fait face à une instabilité croissante en raison de la scène politique instable et des troubles grandissants en Algérie. Le président René Coty a demandé à René Pleven et Georges Bidault de former des gouvernements, mais aucun des deux n'a réussi. Avec l'ordre civil menacé, la pression monte sur le président pour qu'il trouve rapidement un nouveau gouvernement. Cependant, le président semble incapable ou réticent à jouer un rôle plus actif. La configuration constitutionnelle limite également sa capacité d'action. Alors que la situation devient de plus en plus grave, de nombreux citoyens français se demandent comment la situation pourra être sauvée."
 fra_crisis.6.motion_of_non_confidence_desc:0 "Le FLN a annoncé avoir exécuté des soldats français capturés lors de ses récentes opérations. La nouvelle a choqué et galvanisé de nombreux Français. Si le FLN espérait que cette annonce affaiblirait la détermination française, il s'est lourdement trompé. L'armée française a déjà promis des représailles, et des rapports font état de militants Pieds-Noirs préparant leur propre vengeance contre les Algériens. Les combats en Algérie ont atteint un nouveau niveau de notoriété. Il semble que l'action du FLN n'ait fait qu'ouvrir la porte à des affrontements encore plus brutaux."
 fra_crisis.7.motion_of_non_confidence_desc:0 "Au milieu des rapports indiquant que Pierre Pflimlin allait former un nouveau gouvernement français à Paris, les forces françaises en Algérie ont organisé un coup d'État. Les généraux Jacques Massu et Raoul Salan ont dirigé le coup, Massu prononçant un discours annonçant les exigences des meneurs du coup envers le gouvernement. Massu a appelé à la formation d'un nouveau Gouvernement de Salut Public sous la direction du légendaire leader français Charles de Gaulle. Ils souhaitent que ce nouveau gouvernement reçoive des pouvoirs extraordinaires pour garantir que l'Algérie ne soit pas abandonnée. Le président français René Coty serait stupéfait par cet enchaînement d'événements, tandis que le nouveau Premier ministre voit rapidement ses partisans lui tourner le dos. La réponse militaire semble être une réaction aux préoccupations selon lesquelles le nouveau Premier ministre envisage de négocier une paix qui céderait l'Algérie au FLN."
 fra_crisis.8.motion_of_non_confidence_desc:0 "Le général Raoul Salan a pris la parole à la radio pour s'adresser au peuple français depuis Alger. Le général a confirmé qu'il était à la tête du nouveau gouvernement militaire en Algérie. Il a réitéré les exigences des meneurs du coup d'État, demandant que Charles de Gaulle prenne la tête d'un gouvernement avec des pouvoirs exceptionnels afin de garantir que l'Algérie ne soit pas abandonnée. Salan a ensuite pris la parole devant une grande foule depuis un balcon, menant des chants en l'honneur de de Gaulle. Deux jours plus tard, des journalistes français ont interviewé Charles de Gaulle, qui a déclaré que, si on le lui demandait, il était prêt à assumer les pouvoirs de la République. Cette annonce a suscité des inquiétudes à travers la France, certains craignant que de Gaulle se soit peut-être allié avec la junte militaire en Algérie."
 fra_crisis.9.motion_of_non_confidence_desc:0 "Deux jours après avoir suscité des inquiétudes publiques avec ses remarques sur le coup d'État en Algérie, le célèbre leader français Charles de Gaulle a tenu une conférence de presse. Il a une nouvelle fois réaffirmé que, si la nation avait besoin de lui, il assumerait ses responsabilités. Lorsqu'un journaliste l'a interrogé sur la possibilité que son accession au pouvoir sous la pression militaire conduise à une suppression des libertés civiles, le leader français a rapidement réagi. Il a déclaré : \"Ai-je jamais fait cela ? Bien au contraire, je les ai rétablies quand elles avaient disparu. Qui peut honnêtement croire qu'à 67 ans, je commencerais une carrière de dictateur ?\" Il est clair que Charles de Gaulle se considère prêt à prendre le pouvoir si nécessaire."
 fra_crisis.10.motion_of_non_confidence_desc:0 "La crise algérienne s'est intensifiée après que la junte à Alger ait annoncé la formation du Comité de Salut Public Algérie-Sahara. Le leader de la junte, le général Raoul Salan, a déclaré que le comité actuel de Salut Public superviserait désormais l'ensemble de l'Algérie et du Sahara. Les meneurs du coup d'État ont officiellement pris le mandat territorial du gouvernement français en Afrique du Nord. Il est désormais clair que les chefs du coup d'État préparent probablement l'expansion de leurs opérations, avec l'intention d'étendre leur pouvoir et leur mandat à la France métropolitaine."
 fra_crisis.11.motion_of_non_confidence_desc:0 "Pour accroître la pression sur Paris, des paras d'élite français d'Algérie ont effectué un largage et ont pris le contrôle de la Corse. L'opération est surnommée \"Résurrection\". Les parachutistes n'ont rencontré aucune résistance et ont pris le contrôle de l'île sans opposition. Les préoccupations à Paris augmentent, car il semble que de nombreux éléments de l'armée soient sympathisants de la junte d'Alger dirigée par le général Raoul Salan. Après le succès de l'opération, Salan a publié un ultimatum, accordant au gouvernement jusqu'au 29 pour confier les pouvoirs à Charles de Gaulle. La France semble désormais au bord de la guerre civile."
 fra_crisis.12.motion_of_non_confidence_desc:0 "Charles de Gaulle a rencontré le Premier ministre Pierre Pflimlin pour tenter de parvenir à un accord. Cependant, les discussions ont complètement échoué à aboutir à une résolution. Il semble que les deux hommes n'aient pas pu s'entendre sur la plupart des questions, notamment l'Algérie. L'échec des pourparlers ne fait qu'aggraver la crise, car il apparaît que de Gaulle ne pourra pas travailler avec le gouvernement actuel pour résoudre le conflit. Les chefs du coup d'État à Alger restent déterminés à exiger que Charles de Gaulle prenne le pouvoir. Plus le temps passe sans résolution, plus la probabilité d'une invasion en provenance d'Algérie augmente."
 fra_crisis.13.motion_of_non_confidence_desc:0 "Le Premier ministre Pierre Pflimlin et son gouvernement ont démissionné au milieu de la crise provoquée par le coup d'État militaire en Algérie. L'occupation récente de la Corse et l'ultimatum suivant émis par le général Raoul Salan ont exercé une pression renouvelée sur le gouvernement pour parvenir à une résolution avant qu'une guerre civile n'éclate. Le Premier ministre Pflimlin, dont la nomination a déclenché la crise, a tenté de parvenir à un accord avec Charles de Gaulle, mais ces pourparlers ont échoué. Avec la date limite approchant, il est rapporté que la pression du président René Coty a poussé le Premier ministre et ses ministres à démissionner."
 fra_crisis.14.motion_of_non_confidence_desc:0 "Le président René Coty a pris la parole devant l'Assemblée nationale à Paris. Il a exposé la situation difficile à laquelle la République est confrontée, soulignant que la France se trouve au bord d'une guerre civile totale. Il a ensuite exhorté l'Assemblée à mettre de côté ses divergences et à voter pour nommer Charles de Gaulle Premier ministre. Il a rappelé aux députés que c'était de Gaulle qui avait rétabli la liberté lors de l'heure la plus sombre de l'histoire de la France. De Gaulle et Coty sont ensuite parvenus à un accord, prévoyant la rédaction d'une nouvelle constitution, avec un exécutif puissant, et que de Gaulle recevra des pouvoirs extraordinaires pour les six prochains mois. L'Assemblée nationale votera dans les jours à venir pour approuver Charles de Gaulle et son cabinet. Le président Coty a indiqué qu'il démissionnerait si de Gaulle n'était pas approuvé."
 fra_crisis.141.motion_of_non_confidence_desc:0 "L'armée française en Algérie, dirigée par le général Raoul Salan, a récemment lancé un coup d'État en Afrique du Nord française, exigeant que Charles de Gaulle prenne la tête de la France. Cette action découle d'une frustration grandissante face à l'instabilité politique à Paris et des craintes que le gouvernement actuel ne négocie la fin de la domination française en Algérie. Les tensions se sont intensifiées après que la junte, lors d'une opération aéroportée sans effusion de sang, a capturé la Corse. Ils ont ensuite donné un ultimatum pour la nomination de de Gaulle. De son côté, Charles de Gaulle a simplement déclaré que, si la nation avait besoin de lui, il était prêt à agir. À l'approche de la date limite, le président René Coty a décidé de nommer de Gaulle, menaçant de démissionner si l'Assemblée nationale ne l'approuvait pas. Charles de Gaulle a été ensuite élu, avec un mandat pour superviser une nouvelle constitution et six mois de pouvoirs d'urgence afin de réformer et restaurer les institutions nationales."
 fra_crisis.15.motion_of_non_confidence_desc:0 "La première phase de l'Opération Résurrection a été un grand succès. Nos parachutistes ont réussi à atterrir et à capturer la Corse sans aucune interférence ni résistance. De nombreux militaires sur le continent soutiennent la cause, croyant fermement à la préservation de l'Algérie française, au nationalisme et à une armée forte. Si le gouvernement refuse de mettre en œuvre notre exigence de confier le pouvoir à Charles de Gaulle, ou si de Gaulle demande de l'aide, nous lancerons la deuxième phase de l'Opération Résurrection. Avec des unités militaires sympathisantes à Paris, nous pourrons déployer plus de mille parachutistes pour saisir la capitale et capturer le gouvernement."
 fra_crisis.17.motion_of_non_confidence_desc:0 "Les principaux leaders de la junte d'Alger ont été arrêtés à la suite de négociations réussies menées par le président. Avec un nouveau gouvernement plus stable au pouvoir, des informations ont révélé que des commandants militaires de haut rang en Algérie prévoyaient de lancer un coup d'État pour exiger le retour au pouvoir de Charles de Gaulle. Cependant, avec un compromis et un gouvernement stable à Paris, les meneurs du coup manquaient de justification ou d'agitation pour légitimer une telle action. Cela a conduit à la panique et à la trahison, permettant à des unités militaires loyales d'arrêter les leaders du coup. Le chemin est désormais libre pour que le nouveau gouvernement entame des négociations avec le FLN sur une éventuelle fin de la domination coloniale en Algérie."
 fra_crisis.171.motion_of_non_confidence_desc:0 "Un certain nombre de hauts commandants français en Algérie ont été détenus à Alger. Les autorités françaises affirment que ces officiers étaient impliqués dans un complot nationaliste visant à utiliser la puissance militaire pour renverser le régime civil. Le président français a récemment facilité un accord pour la mise en place d'un gouvernement plus stable, doté d'un mandat solide. Ce nouveau régime a exposé les comploteurs, qui n'ont pas pu trouver de justification pour passer à l'action. Cela a conduit à la panique et à la trahison, permettant aux unités militaires loyales d'arrêter les leaders du coup. Le chemin est désormais dégagé pour que le nouveau gouvernement entame des négociations avec le FLN en vue d'une éventuelle fin de la domination coloniale en Algérie."
 fra_army.1.desc:0 "La France a demandé aux États-Unis de fournir davantage de soutien militaire par le biais du Programme d'Aide Mutuelle (MAP). Le MAP fait partie de la loi sur l'assistance à la défense mutuelle (Mutual Defense Assistance Act) et permet aux États-Unis de fournir de l'équipement militaire à leurs partenaires étrangers en soutien aux intérêts américains. L'équipement militaire fourni n'a pas besoin d'être remboursé. Cette loi est devenue un pilier des efforts américains pour contenir l'agression communiste à l'échelle mondiale. Les autorités françaises soutiennent qu'elles ont besoin de plus de soutien par le biais du MAP afin de renforcer leur défense face aux menaces communistes croissantes."
 fra_army.2.desc:0 "Les États-Unis ont accepté notre demande d'augmenter le financement du Programme d'Aide Mutuelle (MAP) en notre faveur. Ils reconnaissent le rôle vital que la France joue dans la protection de la démocratie et de l'Europe face aux forces déstabilisatrices. Nos responsables militaires et de la défense accueilleront cette nouvelle positivement, car la France a désespérément besoin de soutien militaire pour faire face aux défis et obligations actuels. La structure du MAP permet aux États-Unis de fournir de l'équipement militaire à leurs alliés sans exiger que ces armes soient remboursées. C'est un outil crucial de coopération, tout en contribuant à contenir l'expansion du communisme à l'échelle mondiale."
 fra_army.3.desc:0 "La Marine française a mis en service un nouveau porte-avions en provenance des États-Unis, dans le cadre du Programme d'Aide Mutuelle. Les États-Unis ont salué cette remise, déclarant que le nouveau navire de guerre renforcera la Marine française dans son engagement au sein de l'OTAN et dans ses efforts pour contrer le communisme à l'échelle mondiale. Le gouvernement français a publié sa propre déclaration, accueillant chaleureusement le nouveau navire et saluant le lien profond et continu entre la France et les États-Unis. Les responsables navals français affirment que le navire est prêt à être déployé immédiatement pour servir la France."
 fra_army.4.desc:0 "Les États-Unis ont approuvé notre demande pour un porte-avions. Nos forces navales ont désespérément besoin d'un tel navire de guerre pour maintenir notre crédibilité et respecter nos obligations internationales. Le porte-avions américain viendra répondre à nos besoins. La Marine enverra bientôt du personnel pour suivre une formation à bord du navire, et une fois prêts, le navire sera officiellement intégré dans la flotte. Cet accord met en lumière la profondeur des liens entre la France et les États-Unis."
 fra_army.5.desc:0 "La Marine française a mis en service plusieurs nouveaux destroyers en provenance des États-Unis. Ces navires ont été fournis dans le cadre du Programme d'Aide Mutuelle. Les États-Unis ont salué la remise, affirmant que ces nouveaux navires de guerre renforceront la Marine française dans son engagement au sein de l'OTAN et dans ses efforts pour contrer le communisme à l'échelle mondiale. Le gouvernement français a publié sa propre déclaration, accueillant chaleureusement les nouveaux navires et saluant le lien profond et continu entre la France et les États-Unis. Les responsables navals français ont déclaré que les navires sont prêts à être déployés immédiatement pour servir la France."
 fra_army.6.desc:0 "Les États-Unis ont approuvé notre demande pour de nouveaux destroyers. Nos forces navales ont désespérément besoin de tels navires de guerre pour maintenir notre crédibilité et respecter nos obligations internationales. Les destroyers américains viendront répondre à nos besoins. La Marine enverra bientôt du personnel pour suivre une formation à bord des navires, et une fois prêts, ceux-ci seront officiellement intégrés dans la flotte. Cet accord met en lumière la profondeur des liens entre la France et les États-Unis."
 French_Communism.1.d:0 "Il est clair que les communistes ont remporté les récentes élections législatives. Cela a provoqué une grave crise politique, le président Vincent Auriol annonçant sa démission. Il a refusé de nommer un Premier ministre communiste. Gaston Monnerville a assumé la présidence, promettant de tenir de nouvelles élections. Les événements récents ont suscité la colère des militants et des dirigeants communistes qui estiment que la volonté du peuple est réprimée. Le président Monnerville insiste sur le fait qu'il respectera quel que soit le parti qui réussira dans les élections à venir."
 French_Communism.2.d:0 "Le parti communiste français (PCF) a lancé un appel à l'aide de l'Union soviétique. Les dirigeants communistes français estiment que le gouvernement et l'armée résistent activement à la volonté du peuple français. Cette réaction fait suite à la décision du nouveau président, Gaston Monnerville, de tenir de nouvelles élections. Cette décision est intervenue après la démission de son prédécesseur, qui avait refusé de nommer un Premier ministre communiste. Les autres partis politiques français condamnent la décision du PCF, affirmant que le parti devrait fonctionner en confiance avec la République française. Un haut responsable de la défense a déclaré en privé à des membres des médias que le pays court un risque d'interférence soviétique."
 French_Communism.3.d:0 "Le parti communiste français (PCF) a remporté une majorité très étroite à l'issue des nouvelles élections législatives. Forte de cette majorité, le président français Gaston Monnerville a fidèlement accompli sa fonction, permettant au leader du PCF, Maurice Thorez, de prendre les rênes du gouvernement. Bien que beaucoup en France saluent publiquement le transfert de pouvoir comme un signe de la solidité de la République, des craintes émergent quant à la possibilité que Thorez cherche à transformer le système. D'un autre côté, les partisans du PCF craignent que certaines institutions, en particulier l'armée, tentent de renverser la République et de s'attaquer au PCF. Les tensions sont vives à travers le pays."
 French_Communism.4.d:0 "Plusieurs hauts responsables militaires français nous ont contactés en privé. Ils souhaitent que les États-Unis fournissent secrètement des matériaux de guerre et un soutien au cas où une guerre civile éclaterait. Le parti communiste français a récemment remporté les élections nationales et formé un gouvernement. L'armée craint que le gouvernement communiste n'ait l'intention d'inviter l'Union soviétique et de détruire la République française. Avec notre soutien, les généraux français estiment qu'ils pourraient protéger efficacement la France en cas de coup d'État communiste ou d'invasion soviétique. De nombreux responsables au Pentagone soutiennent cette proposition, bien que certains avertissent que si de telles livraisons d'armements étaient découvertes, cela pourrait renforcer considérablement le PCF sur le plan politique."
 French_Communism.5.d:0 "Le président Maurice Thorez a provoqué un tollé majeur à l'Assemblée nationale après avoir nommé Jacques Duclos au poste de Premier ministre. Cette décision a entraîné une réaction furieuse de l'opposition, qui a quitté l'Assemblée nationale en signe de protestation. Beaucoup estiment que cette nomination accorde trop de pouvoir aux communistes au sein de l'exécutif et qu'il aurait fallu choisir une option plus modérée pour le poste de Premier ministre. Des manifestations ont également eu lieu dans plusieurs villes, menées par des organisations anticommunistes qui craignent que le PCF ne cherche à transformer la France en une république soviétique. Le président a accusé l'opposition de ne pas respecter la volonté du peuple français."
 French_Communism.6.d:0 "Dans une escalade surprenante de la crise politique en cours à Paris, le légendaire leader français Charles de Gaulle a prononcé un discours appelant à la démission du président Maurice Thorez. Dans ses remarques, il a condamné le communisme comme étant incompatible avec la République et les idéaux français. Ses propos risquent de galvaniser le sentiment anticommuniste à travers le pays. Cette forte sortie de de Gaulle confirme les suspicions au sein du PCF, qui croit désormais qu'une vaste conspiration est en cours pour déstabiliser et les évincer du pouvoir. L'atmosphère politique reste extrêmement tendue à travers la France."
 French_Communism.7.d:0 "Des rapports en provenance d'Algérie indiquent une importante mobilisation des forces militaires dans la région. Ces forces sont sous le contrôle du général nationaliste conservateur Raoul Salan. Les mouvements de troupes suscitent de grandes inquiétudes, car ils ne semblent pas liés à la situation sécuritaire actuelle en Algérie. Le président et ses hauts responsables doivent suivre de près l'évolution de la situation, car cela pourrait constituer le premier pas vers une sorte d'intervention des éléments anticommunistes au sein de l'armée."
 French_Communism.8.d:0 "Le gouvernement communiste de France, dirigé par le PCF, nous demande un soutien militaire. Les dirigeants du PCF craignent que l'armée française conservatrice ne soit sur le point de lancer un coup d'État contre le gouvernement. Les leaders du PCF estiment que, bien que le peuple les soutienne, leur manque de personnel militaire et d'équipement pourrait permettre aux forces anti-révolutionnaires de triompher. Protéger la révolution française pourrait nous offrir un fort ancrage en Europe de l'Ouest et dans l'Atlantique. Cependant, certains responsables estiment que l'implication de nos forces pourrait entraîner une réaction massive de l'OTAN et épuiser nos ressources."
 French_Communism.9.d:0 "L'Union soviétique a accepté d'offrir son soutien total au gouvernement du PCF, alors qu'il fait face au risque d'un soulèvement de l'armée française. De nombreux commandants militaires et unités françaises sont anticommunistes et s'opposent au régime du PCF. Les communistes français estiment que l'aide soviétique protégera leur régime contre un renversement militaire. Pour les autorités soviétiques, soutenir le gouvernement français permettra de démontrer leur engagement envers leurs partenaires internationaux et offrira une opportunité pour les Soviétiques de s'établir en Europe de l'Ouest."
 French_Communism.10.d:0 "Les États-Unis ont récemment déclaré clairement qu'ils restaient engagés à soutenir les forces françaises \"patriotiques\" dans leur tentative de sauver leur nation d'un régime de marionnettes soviétique. La propagande militaire française qualifie l'implication soviétique de preuve que le PCF a l'intention de transformer la France en une colonie russe. L'Union soviétique doit maintenant déterminer si soutenir le régime français vaut le risque d'un conflit avec les États-Unis ou d'un conflit prolongé en Europe de l'Ouest. Cependant, de nombreux responsables soviétiques estiment que les avantages potentiels l'emportent sur les risques que pourrait poser l'implication américaine."
 French_Communism.11.d:0 "L'Union soviétique a refusé de reculer dans la crise en France, affirmant qu'elle ne trahirait pas ses camarades français, qui sont les seuls à maintenir la France à l'abri d'une dictature militaire. Elle a annoncé qu'une flotte soviétique a été envoyée pour protéger le gouvernement français contre toute opération illégale, qu'elle soit étrangère ou nationale. Le gouvernement français a publié une déclaration dans laquelle il affirme qu'il accueillerait la flotte soviétique qu'il a invitée. Ce développement soulève des préoccupations aux États-Unis, qui doivent désormais évaluer leurs options. Faut-il reculer, en acceptant le régime communiste pour l'instant, ou maintenir leur position et soutenir les unités militaires anticommunistes ?"
 French_Communism.12.d:0 "Les responsables français et soviétiques sont jubilants après les rapports selon lesquels les États-Unis ne s'impliqueront pas activement dans les affaires françaises. Le gouvernement américain a estimé que les risques d'un conflit armé avec l'Union soviétique ne justifiaient pas le soutien aux unités militaires anticommunistes françaises. Bien que les Soviétiques et leurs alliés français soient satisfaits que la situation en métropole soit désormais calme, les colonies constituent un autre problème. Les forces militaires françaises en Afrique du Nord se sont essentiellement séparées de la métropole, et des généraux de haut rang promettent que l'Armée française reviendra un jour libérer la France."
 French_Communism.13.d:0 "L'Union soviétique a confirmé qu'elle n'enverrait pas de forces militaires pour soutenir le gouvernement communiste français. Bien qu'aucune explication officielle n'ait été donnée, les observateurs estiment que les dirigeants soviétiques ont jugé trop difficile de soumettre l'armée française anticommuniste, en particulier si elle était soutenue par les États-Unis. Avec la disparition du soutien soviétique, le président Maurice Thorez a démissionné. Gaston Monnerville, un homme respecté, assumera la présidence jusqu'aux prochaines élections. Cette nomination devrait permettre de maintenir un équilibre parmi toutes les factions politiques jusqu'à l'élection prochaine. Beaucoup en France attendront avec impatience ces élections, dans l'espoir que la paix puisse enfin revenir dans le pays."
 french_elections.18.d:0 "Les Français se sont récemment rendus aux urnes pour les élections législatives. Beaucoup espèrent qu'un nouveau parlement pourra aider à faire avancer le pays au-delà des récents bouleversements politiques et internationaux. Cependant, il est évident que l'Assemblée nationale sera de nouveau divisée en plusieurs partis, et la coalition qui aura obtenu la majorité reste incertaine. Le Front Républicain, une coalition de partis socialistes, semble être le vainqueur probable si ses partis réussissent à obtenir la majorité. Si ce n'est pas le cas, il est probable que les partis de droite modérée formeront la coalition dirigeante. Les citoyens à travers la France attendent avec impatience les résultats finaux et le futur destin de leur nation."
 fra_crisis_2_desc:0 "L’instabilité politique fréquente à Paris et le manque de direction dans la guerre d’Algérie ont suscité de l’anxiété au sein de l’armée française. De nombreux officiers craignent que les politiciens trahissent l’honneur de la France et laissent tomber la nation. Les officiers les plus radicaux se sont réunis en Algérie et ont récemment décidé d’agir. La nouvelle parvint rapidement à un gouvernement français stupéfait : les généraux français en Algérie ont pris le pouvoir aux autorités civiles. La nouvelle junte se désigne sous le nom de Comité de Salut Public. Ils ont appelé à un leadership fort et au retour du héros français Charles de Gaulle. Quelques jours plus tard, les troupes françaises en Algérie ont pris le contrôle de la Corse pour mettre la pression sur le gouvernement. De Gaulle a seulement déclaré qu’il servirait la nation si le gouvernement le sollicitait. Le gouvernement français doit désormais décider s’il ramène de Gaulle, accepte la prise de pouvoir du Comité de Salut Public ou propose un compromis pour l’Algérie."
 fra.1.t:0 "L'unification de l'Autriche"
 fra.1.d:0 "Le peuple autrichien souhaite redevenir un pays libre et indépendant. Il pourrait servir d'État tampon entre l'Est et l'Ouest. Allons-nous l'accepter ?"
 fra.1.a:0 "Oui bien sûr !"
 fra.1.b:0 "Non, nous gardons la terre."
 fra.2.t:0 "Accepter la RPC à l'ONU"
 fra.2.d:0 "La République populaire de Chine souhaite être reconnue aux Nations Unies. La République de Chine est devenue très faible après la guerre civile, nous devrions donc soutenir la nation plus grande et plus forte désormais, qui est la République populaire de Chine."
 fra.2.a:0 "Oui bien sûr !"
 fra.2.b:0 "Non, ils resteront dehors."
 fra.4.t:0 "Le Niger demande l'indépendance"
 fra.4.a:0 "Oui, ce sera leur jour d’indépendance !"
 fra.4.b:0 "Non, ils ont toujours besoin de notre protection."
 fra.11.t:0 "Création de l'Union de l'Europe occidentale"
 algeirs.6.t:0 "\"Putsch des Généraux\" Le sort de Gerboise Verte"
 algeirs.6.d:0 "Les autorités du gouvernement français à Paris ont ordonné l'explosion de la bombe atomique Gerboise Verte dans le Sahara, dans le cadre d'un programme de tests prévu. Gerboise Verte devrait exploser aujourd'hui. Bien que le test et le site d'essai soient déjà préparés dans le cadre du programme nucléaire national, le calendrier du test sera accéléré pour garantir que la sécurité de l'appareil ne soit pas compromise. Cependant, des rumeurs circulent selon lesquelles des putschistes tenteraient de prendre le contrôle de la bombe avant que le gouvernement ne la fasse exploser..."
 algeirs.6.a:0 "La détonation de la bombe est un succès"
 algeirs.6.b:0 "La bombe a été saisie avant son explosion !"
 algeirs.4.t.his:0 "\"Putsch des Généraux\" Discours de De Gaulle"
 algeirs.4.t.alt:0 "\"Putsch des Généraux\" Discours du Général Faure"
 algeirs.5.t.his:0 "\"Putsch des Généraux\" Discours de Chérif Sid Cara"
 algeirs.5.t.alt:0 "Les parachutistes du \"Putsch des Généraux\" débarquent à Paris !"
 algeirs.5.d.his:0 "Aujourd'hui, le député Sherif Sid Cara, lui-même putschiste en 1958, en tant que président du conseil général d'Oran, a publié, avec vingt autres conseillers généraux, une déclaration de soutien aux putschistes. Ils \"saluent avec ferveur l'aube d'une Algérie définitivement française, gage évident d'une véritable fraternité ...\", et \"... présentent l'hommage profondément émotionnel de leur gratitude à l'armée française et à ses dirigeants auxquels ils déclarent se solidariser totalement ...\". Est-ce que cela influencerait le soutien aux putschistes ?"
 algeirs.5.d.alt:0 "Aujourd'hui, un groupe de parachutistes a atterri à Marseille et à Paris, rejoignant le général Faure et arrêtant les leaders socialistes et communistes. En Algérie, le député Sherif Sid Cara, lui-même putschiste en 1958, en tant que président du conseil général d'Oran, a publié, avec vingt autres conseillers généraux, une déclaration de soutien aux putschistes. Ils \"salut avec ferveur l'aube d'une Algérie définitivement française, gage évident d'une véritable fraternité ...\", et \"... présentent l'hommage profondément émotionnel de leur gratitude à l'armée française et à ses dirigeants auxquels ils déclarent se solidariser totalement ...\"."
 algeirs.5.a:0 "Les putschistes sont déjà condamnés, ils ont perdu tous leurs soutiens."
 algeirs.5.b:0 "La loi martiale est promulguée sur le territoire"
 algeirs.4.d.his:0 "Dans la nuit, le général Salan arriva en Algérie depuis l'Espagne et refusa d'armer les militants civils. À 20h00, le président de Gaulle apparut à la télévision dans son uniforme militaire des années 1940, appelant le personnel militaire français et les civils, en France métropolitaine ou en Algérie, à s'opposer au putsch : En raison de la popularité d'une invention récente, le radio-transistor, l'appel de de Gaulle fut entendu par les soldats appelés sous les drapeaux, qui refusèrent massivement de suivre l'appel des militaires professionnels à l'insurrection et, dans certains cas, emprisonnèrent leurs officiers. Le putsch rencontra une opposition généralisée, principalement sous forme de résistance civile, y compris une grève générale d'une heure appelée par les syndicats le jour suivant la diffusion de l'appel de de Gaulle. Au sein même de l'armée, beaucoup dépendait de la position prise par les officiers supérieurs individuels. La 13e Division légère d'infanterie, responsable de la zone stratégique du Sud Oranais et comprenant des unités de la Légion étrangère, suivit l'exemple de son commandant, le général Philippe Ginestet, en restant fidèle au gouvernement de Paris. Le succès des mutineries reste encore inconnu."
 algeirs.4.d.alt:0 "Dans la nuit, le général Salan arriva en Algérie depuis l'Espagne et commença à armer les militants civils. À 20h00, le général Jacque Faure apparut au Parlement, appelant le personnel militaire français et les civils, en France métropolitaine ou en Algérie, à rejoindre le putsch : En raison de la popularité d'une invention récente, le radio-transistor, l'appel de Faure fut entendu par les soldats appelés sous les drapeaux, qui rejoignirent massivement l'appel des militaires professionnels à l'insurrection et, dans certains cas, emprisonnèrent les responsables. Le putsch rencontra une opposition généralisée, principalement sous forme de résistance gaulliste et communiste, y compris une grève générale d'une heure appelée par les syndicats le jour suivant la diffusion de l'appel de Faure. Au sein même de l'armée, beaucoup dépendait de la position prise par les officiers supérieurs individuels. La 13e Division légère d'infanterie, responsable de la zone stratégique du Sud Oranais et comprenant des unités de la Légion étrangère, suivit l'exemple de son commandant, le général Philippe Ginestet, en restant fidèle au gouvernement de Paris. Les loyalistes attendent toujours une communication du gouvernement."
 algeirs.4.a:0 "Les soldats conscrits ripostent avec succès le putsch"
 algeirs.4.b:0 "Les putschistes ont pris le Parlement à Paris et des parachutistes ont atterri en Corse"
 algeirs.3.t:0 "\"Putsch des Généraux\" Le complot de Paris"
 algeirs.3.d.alt:0 "Ce matin, la population d'Alger s'est réveillée avec la nouvelle que \"l'armée a pris le contrôle de l'Algérie et du Sahara\". Les quatre généraux rebelles, Maurice Challe, Edmond Jouhaud, Marie-Michel Gouraud et André Zeller, en accord avec les colonels Godart, Argoud et Lacheroy, ont arrêté le délégué général du gouvernement, Jean Morin, le ministre des Transports, Robert Buron, qui était en déplacement, ainsi qu'un certain nombre d'autorités civiles et militaires. Certains régiments ont fait défection et ont suivi les ordres des chefs rebelles. À Paris, la police a tenté d'arrêter le général Jacques Faure de manière désorganisée, ainsi que six autres officiers et quelques civils impliqués dans le \"Complot de Paris\" – un plan pour exporter le coup d'État en France métropolitaine. Lors du Conseil des ministres à 17h, aucune communication supplémentaire n'a été faite par le gouvernement. L'Algérie reste en état d'urgence. Les partis de gauche, les syndicats et la Ligue des droits de l'homme appellent à manifester \"l'opposition des travailleurs et des démocrates au coup de force à Alger\". Le sort de Jacques Faure reste inconnu."
 algeirs.3.d.his:0 "Ce matin, la population d'Alger s'est réveillée avec la nouvelle que \"l'armée a pris le contrôle de l'Algérie et du Sahara\". Les trois généraux rebelles, Maurice Challe, Edmond Jouhaud et André Zeller, en accord avec les colonels Godart, Argoud et Lacheroy, ont arrêté le délégué général du gouvernement, Jean Morin, le ministre des Transports, Robert Buron, qui était en déplacement, ainsi qu'un certain nombre d'autorités civiles et militaires. Certains régiments ont fait défection et ont suivi les ordres des chefs rebelles. À Paris, la police a tenté d'arrêter le général Jacques Faure de manière désorganisée, ainsi que six autres officiers et quelques civils impliqués dans le \"Complot de Paris\" – un plan pour exporter le coup d'État en France métropolitaine. Lors du Conseil des ministres à 17h, de Gaulle, serein, a déclaré : \"Ce qui est grave dans cette affaire, messieurs, c'est que ce n'est pas grave.\" L'Algérie reste en état d'urgence. Les partis de gauche, les syndicats et la Ligue des droits de l'homme appellent à manifester \"l'opposition des travailleurs et des démocrates au coup de force à Alger\". Le sort de Jacques Faure reste inconnu."
 algeirs.3.a:0 "Le général Faure a été arrêté par la police"
 algeirs.3.b:0 "Le général Faure n'a pas réussi mais n'a pas été arrêté"
 algeirs.3.c:0 "Le général Faure a réussi à répandre les nouvelles et plusieurs divisions rejoignent le Putsch"
 algeirs.2.t:0 "Les généraux prennent le contrôle d'Alger !"
 algeirs.2.d:0 "Les généraux André Zeller, Edmond Jouhaud, Maurice Challe et Gouraud ont perpétré un complot contre de Gaulle. Ils veulent l'exécuter ce soir, et le 1er Régiment de Parachutistes Étrangers (REP), sous le commandement du capitaine Hélie Denoix de Saint-Marc, commandant en exercice du régiment, a pris Alger en trois heures. Cela inclut le Gouvernement Général d'Alger, l'hôtel de ville, les stations de radio et l'aéroport d'Alger. La seule victime de l'opération est le maréchal Pierre Brillant, abattu alors qu'il défendait le transmetteur radio d'Ouled Fayet. Le préfet de police, Maurice Papon, et le directeur de l'Administration de la sécurité nationale ont mis en place une cellule de crise dans un salon de la Comédie-Française, où le général de Gaulle assiste avec Léopold Sédar Senghor à une représentation de *Britannicus*. Le chef de l'État a été informé pendant l'entracte par Jacques Foccart, secrétaire général aux Affaires africaines et malgaches, son plus proche collaborateur. Officiellement, de Gaulle a été averti après la représentation. Les rumeurs selon lesquelles le général Gouraud aurait abandonné le complot sont toujours sujettes à débat. Les renseignements sont revenus avec un rapport..."
 algeirs.2.a:0 "... General Gouraud démissionne"
 algeirs.2.b:0 "... Général Gouraud prend le contrôle de Constantin !"
 algeirs.1.t:0 "Fin de du putsch d'Alger"
 algeirs.1.d.his:0 "Les quelques unités militaires qui avaient suivi les généraux se sont progressivement rendues. Le général Challe s'est livré aux autorités et a été immédiatement transféré en France métropolitaine. Le putsch a été écrasée, mais l'Article 16, accordant des pouvoirs pleins et extraordinaires à de Gaulle, sera maintenu pendant cinq mois. \"La Bataille des Transistors\", comme l'a appelée la presse, a été rapidement et définitivement remportée par de Gaulle."
 algeirs.1.d.alt:0 "Les quelques unités militaires qui avaient suivi le gouvernement se sont progressivement rendues. Le Premier ministre Michel Debré s'est livré aux putschistes et a été immédiatement transféré à la prison de Clairvaux. Le putsch a été couronné de succès, mais l'opposition communiste et les loyalistes gaullistes sont tombés dans la clandestinité et ont lancé des guérillas en France métropolitaine. La presse a été rapidement fermée et la loi martiale a été étendue à toute la France. Le sort de de Gaulle reste inconnu."
 algeirs.1.a:0 "Ce qui est grave dans cette affaire, messieurs, c'est qu'elle n'est pas sérieuse."
 algeirs.1.b:0 "Les forces gouvernementales sont vaincues et une nouvelle junte militaire mènera le pays maintenant"
 fra.15.d:0 "Philippe Pétain, général et collaborateur nazi est décédé aujourd'hui. Il est décédé sur l'île d'Yeu hier matin, à l'âge de 95 ans, et a été enterré dans un cimetière marin (Cimetière Communal de Port-Joinville) près de la prison."
 may.681.d:0 "Aujourd'hui, le groupe d'extrême droite Occident a annoncé son intention de tenir une réunion à la Faculté de Nanterre, prévue pour le 3 mai. En réponse, les partisans maoïstes, aidés par des militants anti-guerre, ont occupé la Faculté."
 may.682.d:0 "Plus tard aujourd'hui, le défilé du 1er mai aura lieu, appelé par la CGT, le PCF et le PSU. Malheureusement, la CFDT, le FGDS et la FEN ont refusé de rejoindre la marche. Un événement notable est le cortège du \"Mouvement 22 mars\" qui a eu des affrontements avec la CGT."
 may.683.d:0 "Des incendies ont éclaté à la Sorbonne occupée. Des rumeurs ont circulé sur l'intention du groupe d'extrême droite Occident d'attaquer les insurgés maoïstes, et les étudiants communistes ont contacté les travailleurs pour les aider à construire des barricades à l'aide d'une pelleteuse. La police est intervenue pour arrêter les étudiants, Nanterre a été fermée et le Premier ministre est parti pour une visite diplomatique."
 may.684.d:0 "Les émeutes se sont étendues au Quartier Latin. Plusieurs organisations d'extrême gauche étaient présentes. Occident est intervenu pour les expulser, mais a été repoussé. Le Quartier Latin est devenu un champ de bataille entre la police et les étudiants communistes."
 referendumfr.2.d:0 "La Loi sur les Apparentements a été une loi adoptée en 1951 pour contrer la montée des scores des Gaullistes et des Communistes lors des élections législatives. Combinés, ils représentaient jusqu'à 45 % des voix, et tous deux visaient à bloquer le processus législatif de la IVe République. Face à cette menace, la loi stipulait que toute liste pouvait se connecter à d'autres ; si le score total des listes connectées dépassait 50 %, elles obtiendraient tous les sièges et les répartiraient entre elles. Étant donné que les Gaullistes et les Communistes ne se connectaient avec personne, ils étaient assurés de perdre la plupart des circonscriptions."
 FRAPCF.1.d:0 "Le gouvernement de la France a annoncé qu'il reconnaît officiellement son rôle historique dans l'exploitation et l'oppression des peuples de ses colonies en Indochine. Cependant, le gouvernement actuel ne reproduira pas les erreurs du passé ni ne perpétuera la misère que le capitalisme inflige aux peuples. Le gouvernement a décidé de soutenir tous les mouvements de libération en Indochine et de travailler pour aider ces groupes à établir des gouvernements indépendants, libres de l'influence de l'exploitation capitaliste ou impérialiste. Cette annonce du gouvernement français est accueillie avec prudence dans les colonies françaises et avec enthousiasme parmi les classes intellectuelles urbaines de la France. Cependant, parmi la classe moyenne et les Français ruraux, la réception est partagée, car beaucoup dans ces communautés considèrent l'Indochine comme faisant partie de la nation mondiale française et croient qu'elle devrait rester française."
 FRAPCF.2.d:0 "Avec l'Union Soviétique montrant de plus en plus de tendances répressives et antidémocratiques, de nombreux communistes en Europe occidentale se sont progressivement aliénés d'elle. De plus, le modèle soviétique semble de plus en plus étranger aux sociétés habituées aux approches démocratiques. Ces tendances, ainsi qu'une révision de la théorie marxiste, ont conduit à l'émergence de l'Eurocommunisme. L'Eurocommunisme soutient les institutions démocratiques et encourage les partis communistes à s'allier avec d'autres groupes pour initier des réformes sociales à grande échelle et parvenir à une domination démocratique de la société. L'accent mis sur la classe ouvrière s'est désormais élargi pour inclure la classe moyenne. L'Eurocommunisme offre une nouvelle voie démocratique vers le socialisme, et les communistes qui l'adoptent se tournent également progressivement loin de l'Union Soviétique. L'Union Soviétique et les communistes traditionnels considèrent l'Eurocommunisme comme une voie dangereuse et révisionniste vouée à l'échec. Cependant, pour les communistes français, l'Eurocommunisme offre un moyen d'élargir leur base de soutien et de démontrer leur indépendance au sein de l'ordre communiste mondial."
 FRAPCF.3.d:0 "Le Parti Communiste Français a décidé, après de nombreuses réunions intenses, que la France adoptera l'Anarchisme. L'Anarchisme maintiendra un État minimal et garantira à tous les citoyens une liberté absolue. Des associations libres commenceront probablement à émerger, et la France sera bientôt la nation la plus libre de la planète. La France ne sera plus asservie par l'ordre capitaliste, car son peuple ne sera plus contrôlé par les mécanismes de l'État. Beaucoup en France perçoivent ce nouveau virage comme une continuation des expériences anarchistes à Barcelone pendant la guerre civile espagnole. Bien que ces expériences aient été écrasées, leur héritage perdure et désormais l'Anarchisme sera la voie de la France. Les États voisins ont exprimé de l'inquiétude et des préoccupations, tout en déclarant qu'ils attendront de voir ce que l'Anarchisme impliquera. Dans les capitales européennes, des foules d'anarchistes sont descendues dans les rues pour célébrer la nouvelle en provenance de France."
 PCF_ALG.1.d:0 "Le gouvernement communiste en France a déclaré que la violence insensée, l'exploitation et la misère prendront fin en Algérie. Il a décidé d'accorder l'indépendance à l'Algérie et de laisser le pays être dirigé par son propre peuple. Le gouvernement français a affirmé que c'était le système capitaliste et les pressions impérialistes qui avaient contraint la France à lutter pour contrôler l'Algérie. Maintenant que ces pressions n'influencent plus le gouvernement, il est clair que la guerre en Algérie ne sert plus aucun but supérieur et doit être menée à une conclusion juste. En France, la décision reçoit beaucoup de soutien dans les zones urbaines, mais dans la France rurale et parmi la classe moyenne, il y a un sentiment de trahison. Pour eux, l'Algérie n'a jamais été une colonie, mais une extension de la mère patrie et ils voient l'annonce du gouvernement comme une trahison non seulement de la nation, mais aussi de la population française qui vit actuellement en Algérie."
 ALG_CRACKDOWN.1.d:0 "Le gouvernement français a déjà déclaré son opposition à la décolonisation en ce qui concerne l'Algérie. Selon eux, l'Algérie n'est pas une colonie, mais fait partie de la métropole française et doit être préservée contre les idéologies barbares et étrangères. En soutien à cette position, le gouvernement français a confirmé avoir approuvé une nouvelle campagne pour pacifier l'Algérie. Les rapports des médias en Algérie indiquent que les forces françaises ont lancé une opération de grande envergure, utilisant des tactiques de fouilles agressives, des armes lourdes et, parfois, des tirs indiscriminés afin de déraciner et réprimer le mouvement indépendantiste. Cette nouvelle intensité de violence a encouragé de nombreux Français qui estiment que le gouvernement doit faire tout ce qui est nécessaire pour résoudre la crise. Cependant, il y a aussi eu des manifestations contre la brutalité et, à l'international, de nombreux États ont déjà exprimé leurs préoccupations concernant l'utilisation disproportionnée de la force par l'armée française."
 Petain.100.d:0 "À la suite du décès de Philippe Pétain, un débat a émergé sur le lieu où l'ancien général et président français devrait être enterré. Pétain avait été l'un des plus grands généraux français de la Première Guerre mondiale, dirigeant les forces françaises lors de la bataille de Verdun. Cependant, son héritage est devenu controversé lorsqu'il a dirigé, pendant la Seconde Guerre mondiale, le gouvernement français pro-nazi de Vichy. Il est détesté par beaucoup, mais vénéré par de nombreux anciens combattants et nationalistes en France. Après la guerre, il a été condamné pour trahison et a passé le reste de sa vie dans une cellule de prison sur l'île d'Yeu. Suite à son décès, des plans ont été élaborés pour l'enterrer sur l'île d'Yeu, mais de nombreux nationalistes français ont exigé qu'il soit enterré à la Nécropole de Douaumont, aux côtés des tombes françaises de Verdun. Le gouvernement français doit maintenant décider s'il doit l'enterrer sur l'île d'Yeu ou apaiser les nationalistes en l'enterrement à Verdun."
 AJAX.20.d:0 "Dans un revirement de situation spectaculaire et inattendu, le Shah est rentré aujourd’hui en Iran ; son avion s’est posé à l’aéroport de Mehrabad, où il a reçu un accueil triomphal. Après une période de profonde incertitude nationale, son arrivée semble avoir galvanisé une population en quête désespérée de stabilité.\n\nDès les premières heures du matin, des foules immenses avaient envahi les grands boulevards de la capitale, agitant des drapeaux nationaux et brandissant des portraits du monarque. Pour beaucoup, le retour de l'héritier d'une dynastie vieille de 2 500 ans est salué comme un moment charnière, représentant un point d'ancrage solide en cette période de crise et le rétablissement de l'ordre national."
 state_islam:0 "État Islam"
 idea_IRQ_rights_for_minorities:0 "Droits pour les minorités"
 ECSC.1.desc:0 "En France, le ministre des Affaires étrangères Robert Schuman a réussi à obtenir le soutien pour la Communauté européenne du charbon et de l'acier (CECA) de nombreuses sections du pays et des partis non-communistes. Cette idée a recueilli le soutien de collègues ministériels, du président de la commission des Relations extérieures et de l'ancien Premier ministre Paul Reynard. Comment devons-nous choisir ?"
 ECSC.2.desc:0 "En Allemagne de l'Ouest, le soutien à la CECA (Communauté européenne du charbon et de l'acier) a été mitigé. Le Parti social-démocrate, dirigé par Kurt Schumacher, s'est opposé à la formation de la CECA ainsi qu'à l'adhésion de la République fédérale à celle-ci. Cependant, le ministre-président de la Rhénanie-du-Nord-Westphalie, où de nombreuses installations de charbon et d'acier sont situées, s'est exprimé en faveur de la CECA. Comment devons-nous choisir ?"
 ECSC.3.desc:0 "La Belgique est un important exportateur de charbon, avec plusieurs grandes mines dans la région de Wallonie. Cela soutiendra notre économie en pleine croissance, mais cela pourrait être perçu comme une capitulation face aux autres puissances occidentales. Nos travailleurs pourraient être satisfaits, mais nos hommes d'affaires ne le seront peut-être pas. Comment devons-nous choisir ?"
 ECSC.4.desc:0 "Les Pays-Bas ont de grandes importations de produits agricoles et industriels. La CECA pourrait soutenir notre économie en pleine croissance, mais pourrait aussi être perçue comme une soumission face aux autres puissances occidentales. Nos travailleurs pourraient être satisfaits, mais nos hommes d'affaires ne le seraient peut-être pas. Comment devons-nous choisir ?"
 ECSC.5.desc:0 "Le Luxembourg, bien que petit, possède une grande industrie bancaire et des télécommunications. La CECA pourrait soutenir notre économie en croissance, mais elle pourrait aussi être perçue comme une soumission face aux autres puissances occidentales. Nos travailleurs pourraient être satisfaits, mais nos hommes d'affaires ne le seraient peut-être pas. Comment devons-nous choisir ?"
 ECSC.6.desc:0 "L'Italie est en train de passer d'une nation principalement agricole à une puissance industrielle en plein essor, notamment dans les secteurs de l'automobile et de la production alimentaire. La CECA pourrait soutenir notre économie en croissance, mais elle pourrait aussi être perçue comme une soumission face aux autres puissances occidentales. Nos travailleurs pourraient être satisfaits, mais nos hommes d'affaires ne le seraient peut-être pas. Comment devons-nous choisir ?"
 fra.16.d:0 "Après que le Parti communiste ait pris le pouvoir en France, la Seconde Grande Terreur a été proclamée, et les purges sont devenues fréquentes à travers tout le pays. Des individus en particulier, tels que les anti-communistes notoires, les collaborateurs nazis, et ceux qui sont critiques du régime, sont pris pour cibles. Certains diplomates français ont fui à l'étranger ou se sont réfugiés dans des ambassades alliées à l'Ouest, tandis que d'autres tentent désespérément d'éviter l'arrestation et l'emprisonnement. La vague rouge a à nouveau déferlé sur la France."
 fra.17.d:0 "Après avoir quitté l'OTAN, et à la surprise des puissances occidentales voisines, la France a maintenant annoncé son adhésion au Pacte de Varsovie, l'alliance défensive communiste soviétique. C'est un avantage majeur pour le bloc communiste, car l'armée française est grande et étendue, et elle est également stratégiquement précieuse, la France étant détachée du reste du bloc de l'Est en étant située en Europe de l'Ouest. C'est certainement un développement important."
 fra.18.d:0 "Le stalinisme en France a été maintenu comme une valeur fondamentale du PCF, dirigé par Maurice Thorez. Le révisionnisme, en particulier les idées proposées par Nikita Khrouchtchev et Auguste Lecoeur, ne sont pas tolérées et sont considérées comme une soumission aux puissances impérialistes bourgeoises de l'Occident. Ces individus ne peuvent tout simplement pas être acceptés, et les idées de Staline vivront dans notre paradis socialiste français."
 fra.19.d:0 "Auguste Lecoeur, leader du Parti Communiste Français de 1942 à 1944, député et maire de Lens, a prêté serment en tant que Président de la France. Connu pour être un opposant vocal de Maurice Thorez et un partisan de Nikita Khrouchtchev et du révisionnisme, on s'attend à ce que de nombreuses réformes émergent sous sa direction."
 fra.22.d:0 "Les rapports du Ministère de la Défense indiquent que nos forces communistes françaises ont annexé la région frontalière du Saarland en Allemagne, incluant les forces marchant dans la plus grande ville de Sarrebruck. Nominalement, le protectorat de la Sarre est sous administration française depuis la fin de la Seconde Guerre mondiale, mais par crainte qu'il ne soit pris par l'Allemagne de l'Ouest dans le chaos communiste qui s'ensuit, la France l'a directement annexé."
