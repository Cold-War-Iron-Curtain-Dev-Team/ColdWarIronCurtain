l_english:
 conquest.100.d: "La République de Corée est désormais au bord de l'effondrement, sa capitale, Séoul, venant d'être envahie par les troupes nord-coréennes en pleine avancée. La Corée du Nord, recourant à des tactiques similaires à celles de la Blitzkrieg, a utilisé ses chars de fabrication soviétique pour progresser avec force vers Séoul, infligeant de lourdes pertes aux Sud-Coréens, qui ne disposent d'aucune arme antichar ni même de chars. Les Sud-Coréens, dans le but d'arrêter l'avancée du Nord, ont fait sauter le pont sur le fleuve Han, piégeant ainsi des milliers de soldats et de civils qui ont désespérément besoin d'être évacués et de recevoir des soins médicaux. Cet événement de la guerre de Corée met en évidence la faiblesse de la Corée du Sud, soutenue par les États-Unis, et les observateurs estiment que si cette tendance se poursuit, la capitulation devrait intervenir d'ici quelques mois."
 conquest.101.d: "L'espoir d'une démocratie et de libertés civiles dans la péninsule coréenne renaît, alors que la coalition des Nations Unies, composée des États-Unis et de leurs alliés, a réussi à reprendre Séoul aux mains de l'Armée populaire coréenne (KPA), qui y avait établi une garnison et occupait la ville. Cette victoire n'a toutefois pas été facile, car la KPA avait mis en place des fortifications défensives à presque chaque coin de rue, avec des barricades et des armes antichars disséminées partout dans Séoul. Néanmoins, les forces de la coalition ont réussi à percer toutes les lignes de résistance de l'Armée populaire coréenne et ont finalement repris Séoul pour la Corée du Sud. Cette victoire enverra un message clair à Pyongyang : la lutte pour la péninsule coréenne atteindra bientôt ses côtes, et son territoire sera souillé par le sang et le désespoir."
 conquest.102.d: "Le vent a tourné en Corée du Sud, car l'intervention de la République populaire de Chine a entraîné une nouvelle fois la chute de Séoul, reprise aux forces de la coalition des Nations Unies. La coalition, prise au dépourvu et épuisée par les combats, a dû procéder à une évacuation obligatoire de la région métropolitaine de Séoul vers d'autres villes du sud, mais elle est démoralisée et incapable de combattre pour l'instant. Cette défaite jouera un rôle crucial dans le sort de la péninsule coréenne, et pour l'instant, les observateurs estiment que la coalition entre la Chine et la Corée du Nord a toutes les chances de l'emporter. Cependant, ces mêmes observateurs émettent des doutes quant à leurs prévisions, car de nombreux rapports indiquent que les forces chinoises sont épuisées et submergées par la guerre, et qu'il leur faudra du temps et des efforts pour retrouver leurs forces, ce qui pourrait ouvrir une opportunité de contre-attaque pour les forces de la coalition de l'ONU."
 conquest.103.d: "Face à une succession de défaites, les forces de la coalition des Nations Unies ont mis au point une opération visant à anéantir les forces chinoises et nord-coréennes. Baptisée « Opération Ripper », cette opération consiste en un bombardement d'artillerie sur l'ensemble de la région métropolitaine de Séoul, suivi d'un siège de la zone. Le bombardement d'artillerie a pour but d'infliger un maximum de dégâts à la coalition sino-nord-coréenne, tout en minimisant les pertes parmi les forces de la coalition des Nations Unies. Selon nos sources sur le terrain, c'est un grand succès, avec des dizaines de milliers de victimes parmi les Chinois et les Nord-Coréens, et la moitié de la région métropolitaine de Séoul sous le contrôle des Nations Unies. Les observateurs estiment que, la guerre ayant fait des ravages depuis si longtemps, les Nations Unies feront pression pour conclure un accord d'armistice afin de mettre fin une fois pour toutes aux conflits dans la péninsule."
 conquest.104.d: "La capitulation de la République de Corée est plus proche que prévu, la Corée du Nord ayant réussi à percer le périmètre de Pusan, seule ligne de défense de la Corée du Sud et seule grande ville qui lui reste, les autres ayant été occupées par la Corée du Nord. À l'heure où nous écrivons ces lignes, le reste des forces de la coalition des Nations Unies est en train d'évacuer vers l'île de Jeju, la seule île qui n'ait pas été touchée par les forces nord-coréennes. Cependant, face à cette situation, la Corée du Nord a entrepris de déployer de l'artillerie à longue portée capable de viser l'île de Jeju, et les observateurs s'attendent donc à des pertes massives parmi les habitants de l'île. Avec la chute de Pusan, on s'attend à ce que la Corée du Nord revendique l'intégralité de la péninsule et que la Corée du Sud soit réduite à un simple gouvernement en exil, à l'instar des gouvernements des nations occupées par les nazis pendant la Seconde Guerre mondiale."
 conquest.105.d: "Les jours de la République populaire démocratique de Corée sont comptés, les forces de la coalition des Nations Unies ayant réussi à envahir et à occuper Pyongyang, la capitale de la Corée du Nord. Au milieu du chaos et de la confusion, certains membres de l'élite nord-coréenne et hauts responsables gouvernementaux ont pu évacuer la capitale, tandis que d'autres, moins chanceux, se retrouvent à la merci des forces de la coalition des Nations Unies ; Kim Il-Sung fait partie de ceux qui ont réussi à s'échapper. Il s'agit d'une victoire incontestable pour la coalition de l'ONU, qui a finalement repoussé les Nord-Coréens vers les chaînes de montagnes, garantissant ainsi leur capitulation d'ici quelques mois. Cependant, les observateurs soulignent que si une force extérieure venait à intervenir dans la crise, telle que l'Union soviétique ou la République populaire de Chine, cette victoire ne serait que temporaire et se solderait par une catastrophe dans un avenir proche."
 conquest.106.t: "[GetNewspaperHeader]Les forces de la coalition s'approchent du fleuve Yalu !"
 conquest.106.d: "Alors que les forces de la coalition s’apprêtent à entamer l’occupation de la République populaire démocratique de Corée, des informations en provenance de l’autre côté du Yalu font état d’un renforcement massif des effectifs militaires en Mandchourie. Lors d’une réunion de l’ONU plus tôt dans l’année, le Premier ministre de la République populaire de Chine, Zhou Enlai, avait averti que « la Corée est un voisin de la Chine… Le peuple chinois ne peut que se préoccuper de la résolution de la question coréenne ». Lors d'une récente rencontre avec le président Truman à Wake Island, le général MacArthur a minimisé le risque d'une intervention chinoise, suggérant que « si les Chinois tentaient de descendre vers Pyongyang, ce serait un véritable carnage ». Quoi qu'il en soit, les tensions restent vives face à la perspective d'une escalade."
 conquest.106.1.a: "Ils n'oseraient pas..."
 conquest.106.1.b: "Il est temps de voir ce que Mao va faire..."
 conquest.106.1.c: "Notre sort est désormais entre les mains de Mao..."
 conquest.106.1.d: "L'agression américaine ne restera pas sans réponse !"
 coronation.1000.d: "Sa Majesté George VI, roi du Royaume-Uni et des dominions britanniques et dernier empereur des Indes, a été retrouvé mort dans son lit ce matin à Sandringham House, dans le Norfolk, après près de deux ans de santé déclinante. Bien qu’il fût deuxième dans l’ordre de succession après son frère aîné Édouard VIII, il s’est retrouvé roi de l’Empire britannique à l’aube de ce qui allait bientôt devenir la Seconde Guerre mondiale. Tout au long de la guerre, la présence du roi George a remonté le moral des sujets de la Couronne, tant au pays qu'au front. Sa fille Elizabeth a accédé au trône sous le nom de reine Elizabeth II et rentre précipitamment de l'étranger pour assister aux funérailles."
 NNE.1.d: "Dans une affaire historique, l'arrêt Loving c. Virginie a invalidé toutes les lois interdisant les mariages interraciaux. L'affaire avait été portée devant les tribunaux par Mildred Loving et Richard Loving, un couple interracial qui avait été condamné à une peine de prison en Virginie pour s'être marié. Le procès a duré plusieurs jours, mais il a finalement été décidé à l'unanimité que l'interdiction était inconstitutionnelle. Outre l'adoption de cette loi, l'arrêt Pace c. Alabama a été infirmé. L'arrêt Pace c. Alabama avait jugé que les lois interdisant les mariages interraciaux étaient constitutionnelles.\nLes réactions sont mitigées à travers le pays, mais l'opinion majoritaire est très favorable à cette décision. Les groupes de défense des droits civiques célèbrent actuellement cette journée et déclarent que le « Loving Day » est officiellement une fête historique des droits civiques."
 NNE.2.d: "Dans une affaire historique, l'arrêt Roe c. Wade a officiellement déclaré que les restrictions à l'accès à l'avortement étaient inconstitutionnelles, faisant des États-Unis l'un des moins de cinq pays au monde où l'avortement est autorisé sur simple demande. La Cour a statué, par sept voix contre deux, que la clause relative au respect des procédures légales protège le droit des femmes à l'avortement. Les restrictions étatiques et fédérales en matière d'avortement ont été annulées. L'affaire Roe v. Wade a déclenché un débat national sur la légalité de l'avortement et sur son étendue.\nLe pays semble profondément divisé sur la question et des mouvements populaires se sont mobilisés des deux côtés. Le camp pro-avortement, qui se qualifie de « pro-choix », défend cette décision en affirmant qu'il s'agit d'un choix qui appartient à la femme et d'un droit fondamental des femmes. Le camp anti-avortement, qui se qualifie de « pro-vie », s'oppose à cette décision en affirmant qu'elle revient à ôter la vie d'un enfant et qu'elle est immorale.\nQuelles que soient les opinions de chacun, cette décision façonnera la politique américaine pour les années à venir."
 NNE.3.d: "La RDA a annoncé qu'elle allait construire le Palais de la République. Ce palais sera érigé à Berlin-Est pour accueillir le parlement de la République démocratique allemande. Il est prévu de le construire sur le site de l'ancien Berliner Stadtschloss, sur la place. Le Palais de la République servira à la fois de témoignage culturel et politique de la République démocratique allemande.\nLe Berliner Stadtschloss a été détruit pendant la Seconde Guerre mondiale et n'a jamais été réparé ni remplacé. Le manque de moyens financiers et l'impasse bureaucratique résultant de changements politiques majeurs ont empêché sa reconstruction."
 NNE.4.d: "Dans une affaire historique, Carey c. Population Services International, la Cour a officiellement statué qu’il était inconstitutionnel d’interdire à toute personne autre qu’un pharmacien agréé de délivrer des contraceptifs en vente libre à des personnes âgées de 16 ans ou plus. En outre, dans l’affaire Carey c. Population Services International, la Cour a également statué que personne ne pouvait refuser de fournir des contraceptifs à des personnes âgées de moins de 16 ans. La Cour a estimé que la clause relative au respect des procédures régulières du 14e amendement n'autorise pas un État à s'immiscer dans les décisions d'un individu en matière de procréation. L'intimé principal, PSI, est une organisation à but non lucratif qui diffuse des informations sur la contraception et fournit des services de contraception. Les intimés secondaires sont le révérend James Haden, qui a dirigé un programme de distribution de contraceptifs en vente libre, des médecins spécialisés dans la contraception, et un résident de New York qui souhaite distribuer des contraceptifs à ses enfants."
 NNE.5.d: "Dans une affaire historique, Planned Parenthood c. Casey, la Cour suprême a officiellement statué que les États peuvent adopter des lois réglementant l'avortement au-delà du troisième trimestre. Dans l'affaire Casey, les plaignants ont contesté cinq dispositions de la loi de Pennsylvanie de 1982 sur le contrôle de l'avortement :\nConsentement éclairé ; le médecin doit fournir des informations spécifiques 24 heures avant l'intervention, notamment concernant la santé et la viabilité ;\nNotification au conjoint ; une femme souhaitant avorter doit en informer le père ;\nConsentement parental ; les mineures doivent obtenir le consentement de leurs parents ;\nUrgence médicale ; dans laquelle l'interruption de grossesse est immédiatement nécessaire pour éviter le décès de la mère ;\nObligations de déclaration ; certaines obligations de déclaration et de tenue de registres imposées aux établissements pratiquant des avortements"
 NNE.6.d: "Dans une affaire historique, Abington School District c. Schempp, la Cour a officiellement jugé que la lecture de la Bible organisée par les écoles publiques était inconstitutionnelle. Le district scolaire affirmait que la Bible faisait partie de son programme scolaire, tandis que Schempp soutenait que cela portait atteinte à la laïcité et à la liberté de religion. Après une longue procédure et une escalade progressive, l'affaire a été portée devant la Cour suprême. La loi de Pennsylvanie obligeant les districts scolaires à organiser des lectures de la Bible a été invalidée au cours de cette procédure. Cette question divise de nombreuses personnes, qui avancent des arguments tant en faveur qu'en défaveur de cette décision."
 NNE.7.d: "La principale compagnie aérienne de la RDA, Deutsch Lufthansa, a officiellement cessé ses activités pour ne pas avoir atteint ses objectifs de rentabilité. Certains observateurs estiment toutefois que cette décision était due à une action en justice imminente contre la compagnie aérienne de la RDA pour utilisation du nom « Lufthansa ». Tous les actifs de Deutsch Lufthansa ont été transférés à une autre compagnie aérienne de la RDA, Interflug."
 NNE.8.d: "La République démocratique allemande a annoncé aujourd’hui la démolition du Palais de Berlin. Le Palais a été déclaré symbole du militarisme prussien et sera donc détruit. La démolition se déroulera rapidement et débutera d’ici quelques semaines. Walter Ulbricht, secrétaire général du Comité central, affirme que la symbolique culturelle et le témoignage historique du Palais constituent un affront aux travailleurs de la République populaire et au socialisme dans son ensemble.\nDes objections s'élèvent tant à l'intérieur qu'à l'extérieur de la RDA de la part de personnes qui considèrent le palais comme un monument culturel et historique dont la signification dépasse largement, voire annule, celle du militarisme.\nLe processus devrait durer entre trois et cinq mois et nécessiter 19 tonnes de dynamite."
 NNE.9.d: "\nLhamo Dhondrub, désormais connu sous le nom de Tenzin Gyatso, a été proclamé 14e Dalaï-Lama. Officiellement déclaré Dalaï-Lama en 1940, Tenzin Gyatso a officiellement pris ses fonctions à l'âge de 15 ans.\nÀ la fin des années 1930, Reting Rinpoché eut une vision qui le conduisit chez Lhamo Dhondup, l'incarnation du Dalaï-Lama. Sera Lama a rapporté que Lhamo Dhondup tenait un vieux chapelet ayant appartenu au 13e Dalaï-Lama et que le garçon avait immédiatement reconnu Sera Lama. Lhamo Dhondup s'est également adressé à Sera Lama dans le dialecte du 13e Dalaï-Lama, que sa mère biologique n'a pas pu reconnaître. On lui a présenté une série d'objets, dont certains appartenaient au Dalaï-Lama et d'autres non.\nLa prise de fonction aura des implications majeures pour les bouddhistes du monde entier et la région politique en général. Les décisions et les enseignements du 14e Dalaï-Lama façonneront le paysage politique pour les années à venir."
 NNE.10.d: "Alger Hiss, un fonctionnaire américain, a été accusé d'être un espion soviétique et est en passe d'être condamné. Parmi les preuves retenues contre lui figure la déclaration de Whittaker Chambers, ancien membre du Parti communiste américain, selon laquelle Alger Hiss était communiste. Hiss a intenté un procès en diffamation contre Chambers. Cependant, Chambers a également produit de nouvelles preuves indiquant que lui-même et Hiss étaient tous deux impliqués dans des activités d'espionnage. Le tribunal statuera à la lumière de ces preuves et tiendra compte du parjure, car certaines d'entre elles contredisent les déclarations faites précédemment par Alger Hiss. Le procès a relancé le débat sur l'ampleur de l'espionnage soviétique aux États-Unis."
 NNE.11.d: "Un tragique accident d'avion à Sverdlovsk a coûté la vie à 19 personnes et à l'ensemble de l'équipe de hockey sur glace VVS Moscou. L'avion, qui se rendait à un match, s'est écrasé en raison des mauvaises conditions météorologiques. Une violente tempête de neige, associée à des vents violents, a fait entrer l'avion en vrille, le précipitant au sol. Seuls deux membres de l'équipe ont survécu. Bobrov a trop dormi et Shuvalov a été blessé.\nEn mémoire des victimes, un mémorial est en cours d'érection près de la fosse commune à Koltsovo. De nombreux supporters de l'équipe sont aujourd'hui en deuil suite à cette perte.\nVasiliy Staline, fils de Joseph Staline et mécène de l'équipe, tente actuellement de recruter une nouvelle équipe et espère avoir tout le monde en place d'ici un jour, à temps pour le grand match."
 NNE.12.d: "\nLe sénateur Kefauver a entamé une série d'auditions sur le crime organisé, un problème majeur selon des articles parus aux États-Unis en 1949. Kefauver a déjà déclaré qu'il comptait interroger plus de cinq cents personnes sur le sujet du crime organisé. Kefauver a publiquement affirmé qu'il estimait qu'une grande organisation sicilienne, fondée sur des liens familiaux, dirigeait une vaste mafia à travers tous les États-Unis. La commission prévoit de diffuser ces auditions à l'échelle nationale dans tout le pays. Que la prédiction de Kefauver soit correcte ou non, cela contribuera grandement à comprendre et à éradiquer le problème du crime organisé aux États-Unis."
 NNE.13.d: "Un séisme de magnitude 8,6 a frappé la région de l'Assam-Tibet. On dénombre plus de 1 526 morts et 30 000 blessés, et d'énormes dégâts matériels ont été signalés. Ce séisme a été attribué à la convergence de deux plaques continentales. Des équipes de géologues du monde entier se rendent sur les lieux pour mener des études de terrain, tandis que l'aide humanitaire afflue de partout pour venir en aide aux sinistrés. Cependant, fait choquant, des centaines de « touristes du désastre » arrivent pour observer les dégâts sans avoir l'intention d'apporter leur aide. Contrairement aux scientifiques qui évitent d'emprunter des chemins qui entravent les efforts humanitaires, les véhicules de ces touristes bloquent les infrastructures et causent des contretemps mineurs. Malgré cela, les opérations de secours se poursuivront normalement."
 NNE.14.d: "Le pape Pie XII a promulgué Humani Generis, la dernière encyclique papale. Cette encyclique vise à répondre à de nombreuses opinions qui, selon le pape, menacent de saper les fondements de la doctrine catholique. Elle aborde le rôle de la théologie, les obstacles à la recherche de Dieu, les critiques du pape à l'égard de la culture moderne, plusieurs développements théologiques concernant l'Église catholique après la Seconde Guerre mondiale, ainsi que le polygénisme. De plus, l'encyclique adopte une position nuancée sur l'évolution et affirme que les sciences humaines ne sont pas en contradiction avec les enseignements bibliques. Cette position sur l'évolution amène de nombreux théologiens à reconsidérer leurs positions et de nombreuses personnes croyantes à abandonner la théorie de la Terre jeune."
 NNE.15.d: "Le gouvernement fédéral américain mène une longue série de poursuites contre le Parti communiste des États-Unis. Ce groupe est accusé d'avoir enfreint la loi Smith, une loi qui sanctionne les personnes prônant le renversement violent du gouvernement. Les accusés rétorquent qu'ils souhaitent une transition pacifique et que, quoi qu'il arrive, la liberté d'expression protège leurs opinions et leurs déclarations. Les déclarations du CPUSA ont déclenché un débat national sur la liberté d'expression, qui a incité des personnes de tout le pays à se prononcer en faveur du droit du CPUSA, indépendamment de leurs affiliations personnelles ou de leurs sentiments à l'égard du communisme."
 NNE.16.d: "Après quatre mois et 19 tonnes de dynamite, le Palais de Berlin a été officiellement démoli malgré les objections. Les fondations étaient si solides que l'ensemble de la structure du bâtiment est resté intact même lorsqu'il s'est effondré au sol. La seule partie qui n'a pas été démolie est le portail du balcon d'où Karl Liebknecht avait proclamé la RDA. La construction d'un nouveau bâtiment, le Conseil d'État, est prévue sur le site de l'ancien édifice. La planification et le financement ont déjà été finalisés et assurés respectivement. Le portail du balcon sera intégré au nouveau bâtiment, car il est considéré comme important pour la RDA et sa culture.\nLa plupart des objets qui se trouvaient à l'intérieur seront conservés en entrepôt, ce qui soulage quelque peu les personnes qui considèrent ce bâtiment comme important sur le plan culturel."
 NNE.17.d: "\nJulius et Ethel Rodenberg comparaissent aujourd’hui pour espionnage. Ces deux personnes et leurs complices ont été reconnus coupables et font l’objet d’un important dossier de preuves à leur encontre. Des preuves ont été découvertes montrant qu'ils ont fourni à l'URSS des informations top secrètes concernant les radars, les sonars et les moteurs à réaction.\nDe plus, des preuves ont été trouvées indiquant qu'ils transmettaient à l'URSS des données top secrètes sur les armes nucléaires, dont on sait qu'elles sont désormais entre les mains de l'Union soviétique. Jusqu’à présent, le seul pays à disposer d’armes nucléaires est les États-Unis. Cependant, avec la perte de ces données, l’Union soviétique sera en mesure de commencer la construction de ses propres armes nucléaires et de constituer une menace pour les puissances occidentales.\nLa chasse aux autres espions impliqués est en cours et les installations de recherche nucléaire du pays sont sous haute sécurité jusqu’à ce que cette chasse soit terminée."
 NNE.18.d: "Dans une affaire historique, l'affaire Dennis c. États-Unis a établi que Dennis, secrétaire général du CPUSA, ne bénéficiait pas de la protection du premier amendement si son action impliquait la mise en place d'un complot visant à renverser le gouvernement. Le tribunal a déclaré Dennis coupable de complot en vue de renverser le gouvernement et a estimé qu'il devait être puni en vertu de la loi Smith. Dennis avait auparavant affirmé qu'il n'y avait pas de complot et qu'il prônait une transition pacifique vers le socialisme. Dix autres membres du CPUSA ont également été reconnus coupables d'avoir prôné le renversement violent du gouvernement. L'affaire a été portée devant la Cour suprême, qui s'est prononcée à six voix contre deux en faveur de la condamnation de Dennis et des autres conspirateurs. Les membres du CPUSA impliqués dans le complot ont été condamnés à cinq ans de prison et à une amende de 10 000 dollars chacun."
 NNE.19.d: "Les inondations qui ont frappé le littoral de la mer du Nord cet hiver ont eu des conséquences dévastatrices pour les populations des Pays-Bas, de la Grande-Bretagne et de la Belgique. Les digues se sont révélées incapables de contenir la montée des eaux, qui ont submergé les côtes avec une violence sans précédent. Les Pays-Bas ont été les plus durement touchés, subissant des dégâts quasi catastrophiques : plus de 9 % des terres arables ont été détruites et on estime à 1 800 le nombre de victimes. La province de Zélande reste en proie au chaos, les graves dégâts causés par les inondations rendant les opérations de transport et de sauvetage difficiles jusqu'à ce que le niveau de l'eau baisse. Les dégâts dans le sud de l'Angleterre et en Écosse ont également été considérables, avec environ 300 morts dus aux inondations. La Belgique a également subi des dégâts sur sa côte, bien qu'à une échelle bien moindre par rapport à ses voisins."
 NNE.20.d: "Les Giants de New York ont remporté la Ligue nationale !\nBobby Thomson, le voltigeur et troisième base des Giants, a frappé un home run décisif pour son équipe face au lanceur des Dodgers de Brooklyn, Ralph Branca. Lors de la dernière manche, Thomson a frappé un home run de trois points, permettant à son équipe de l'emporter face aux Dodgers.\nIl s'agit d'un moment historique pour le pays, car ce match est le tout premier à être retransmis à la télévision à l'échelle nationale ; il a été suivi par des millions de téléspectateurs et écouté par des millions d'autres à la radio. Ce coup gagnant est officiellement qualifié de « coup entendu dans le monde entier », en référence au coup de feu qui a déclenché la guerre d'indépendance en 1776, car il est retransmis à un très grand nombre d'Américains, y compris aux militaires en service à l'étranger."
 NNE.22.d: "Une série d'articles intitulée « L'homme conquerra bientôt l'espace » a été publiée dans le magazine Collier's. Ces articles détaillent les projets de Wernher von Braun concernant les vols spatiaux habités. Ils ont suscité un immense engouement national pour les voyages spatiaux et un optimisme futuriste. Ils comportent des dessins, des peintures et des illustrations détaillés réalisés par l'équipe graphique du magazine et émerveillent les lecteurs par leur vision vivante de la vie dans l'espace. Le pays débat déjà des implications des voyages spatiaux et de la colonisation, ainsi que de ce que le monde pourrait accomplir s'il se lançait dans le développement de ces technologies."
 NNE.23.d: "Une grève massive a été organisée par le syndicat United Steelworkers of America contre dix grands sidérurgistes américains, mais elle a été interrompue lorsque le président Harry S. Truman a nationalisé l'industrie sidérurgique américaine avant le début du mouvement et a accordé une augmentation de salaire aux travailleurs. Les entreprises sidérurgiques qui ont perdu le contrôle de leurs installations poursuivent désormais le gouvernement en justice pour récupérer leurs biens. Si le président remporte le procès, même si cela semble peu probable, cela pourrait avoir de graves répercussions sur le pouvoir du gouvernement de nationaliser l'industrie.\nLe sénateur Joseph McCarthy dénonce officiellement le président pour avoir permis à des communistes notoires de conserver leur emploi."
 NNE.24.d: "Dans une décision historique, l'affaire Youngstown Sheet & Tube Co. c. Sawyer a établi que le président n'avait pas le pouvoir de nationaliser des industries et que les aciéries devaient être restituées à leurs propriétaires privés. La Cour suprême a déclaré que, sans l'autorité qui lui est conférée par le Congrès, le président n'est pas autorisé à prendre le contrôle gouvernemental de biens privés. La Cour s'est prononcée à six voix contre trois en faveur de Youngstown Sheet & Tube Co. Les installations sont immédiatement restituées à leurs anciens propriétaires privés, mais aucun dédommagement n'est versé pour le manque à gagner subi pendant la période où les installations étaient sous contrôle gouvernemental."
 NNE.26.d: "Dans le sud de la vallée de San Joaquin, un séisme de magnitude 7,3 a causé 2,6 millions de dollars de dégâts et fait au moins 11 morts dans la ville de Tehachapi. Deux tunnels ferroviaires se sont effondrés et la ville de Bakersfield a également été touchée. Des conduites ont également été endommagées par les répliques du séisme. Les cultures de coton situées à proximité du séisme ont également été touchées. Beno Gutenberg, directeur du laboratoire sismologique de Caltech, a été surpris par la secousse. Il a déclaré : « Il ne fait aucun doute que le séisme d'hier est le plus important que la Californie du Sud ait connu depuis le début du siècle. » La Croix-Rouge américaine a déclaré que ce séisme constituait une catastrophe majeure touchant environ 700 familles, mais l'accès à la zone a été entravé par des glissements de terrain."
 NNE.27.d: "La République de Chine à Taïwan et le Japon ont enfin déclaré la paix. Le retard pris dans les négociations de paix s'explique par le fait qu'aucun des deux gouvernements chinois n'avait assisté au Traité de San Francisco en raison de la guerre civile chinoise. Les États-Unis auraient exercé une forte pression sur le Japon pour le pousser à signer un accord de paix. Le texte du traité est similaire à celui du Traité de San Francisco, mais il a été modifié pour s'adapter à la République de Chine. Le traité ne mentionne pas qui devrait être le véritable propriétaire de Taïwan, mais traite principalement des revendications et des ressortissants japonais."
 NNE.28.d: "Treize Juifs ont été exécutés à la prison de Loubianka, à Moscou. Arrêtés depuis juin 1949, tous les accusés étaient poursuivis pour avoir porté atteinte à l’Union soviétique. Leur procès témoigne du fait que Staline s’en prend désormais au Comité antifasciste juif, qui avait contribué à la renaissance de la culture juive après l’Holocauste. Cinq écrivains yiddish figuraient également parmi les treize victimes. L'une d'entre elles, Solomon Bregman, a perdu connaissance lorsque la sentence de mort a été prononcée et n'a toujours pas repris connaissance. Lina Stern, également condamnée, n'a pas été exécutée en raison de ses travaux scientifiques. Fait tout à fait inhabituel, il n'y avait ni procureurs ni avocats de la défense, mais simplement trois juges militaires qui posaient des questions au hasard."
 NNE.29.d: "Jonas Solk, un chercheur médical américain, a annoncé sur CBS qu’il avait mis au point un vaccin contre la poliomyélite, une maladie invalidante. Solk a suivi l’approche de Maurice Brodie, qui consistait à tuer des souches de poliomyélite et à les injecter à un sujet. Solk indique qu’il rédige actuellement un article pour l’Association médicale américaine, qui sera publié prochainement. Il s’agit d’une avancée majeure dans le traitement de la poliomyélite, car celle-ci touche désormais moins les jeunes, qui en sont pourtant particulièrement affectés."
 NNE.30.d: "Dag Hammarskjöld a été nommé deuxième secrétaire général des Nations Unies en tant que candidat largement considéré comme impartial. Il n'a jamais été affilié à un parti politique, bien qu'il ait occupé des fonctions au sein du gouvernement suédois, notamment dans le corps diplomatique. Il a été nommé secrétaire général à l'unanimité et restera en fonction pendant cinq ans, jusqu'en 1958."
 news.1000.t: "[GetNewspaperHeader]Fin des procès de Nuremberg"
 news.1000.d: "Le procès de Nuremberg sur la Seconde Guerre mondiale a finalement pris fin après quatre ans. Entre 1945 et 1949, 24 des dirigeants les plus importants de l'ancienne Allemagne nazie ont été jugés pour leurs crimes, allant de simples invasions à des génocides de masse. Entre autres, les 15 plus proches collaborateurs d'Hitler (qui étaient encore en vie) ont été condamnés à la peine de mort ou à la prison à vie. Les dix principaux membres de la direction politique et militaire de l'Allemagne nazie ont été exécutés par pendaison. Cependant, plusieurs autres responsables nazis se sont suicidés en attendant leur procès. La seule exception est Speer, qui fut le seul à montrer des remords. Sept responsables nazis furent incarcérés à la prison de Spandau, surnommés les « Sept de Spandau », parmi lesquels Albert Speer, Rudolf Hess, Karl Dönitz et d’autres, condamnés à des peines de prison de durées variables. Le monde peut désormais panser ses blessures en sachant que les hommes qui ont provoqué la Seconde Guerre mondiale et les souffrances qui en ont découlé sont soit morts, soit emprisonnés, soit en attente de jugement."
 news.1000.a: "C'est fini maintenant."
 news.1002.t: "[GetNewspaperHeader]Fin du pont aérien de Berlin"
 news.1002.d: "En juin 1948, l'URSS a soudainement bloqué tout le trafic terrestre vers Berlin-Ouest afin de contraindre les autres puissances d'occupation à satisfaire ses exigences. En conséquence, Berlin-Ouest ne pouvait plus être approvisionné en vêtements, en matériel médical ni même en denrées alimentaires. Les pays de l'OTAN ont alors eu la brillante idée de ne pas opter pour une riposte militaire, mais de mettre en place un pont aérien. Ce n'est qu'après 15 mois et l'atterrissage de 277 264 avions que le blocus prit finalement fin sans qu'un seul coup de feu ne soit tiré."
 news.1002.a: "Espérons que la paix dure !"
 news.1002.b: "On aurait pu faire mieux..."
 news.1003.t: "[GetNewspaperHeader]La guerre de Corée éclate"
 news.1003.desc: "La Corée a été sous domination japonaise de 1910 jusqu’à la Seconde Guerre mondiale. Lorsque l’Union soviétique a déclaré la guerre au Japon en 1945, les troupes soviétiques ont envahi le nord de la Corée tandis que les forces américaines libéraient le sud. Les deux parties belligérantes ont conclu un accord et divisé la Corée en Corée du Nord et Corée du Sud. Chacune a fini par façonner sa partie à son image : le nord est ainsi devenu communiste et le sud capitaliste. Mais comme les deux prétendaient être le gouvernement légitime de toute la Corée, le conflit s'est intensifié aujourd'hui lorsque les troupes nord-coréennes ont envahi la Corée du Sud."
 news.1003.a: "Passons-nous à l'action ?"
 news.1003.b: "Le communisme triomphera !"
 news.1003.c: "Ça ne va pas bien se terminer."
 news.1003.d: "Ils n'ont aucune chance !"
 news.1003.e: "On a besoin d'aide !"
 pinyin_tt: "Tous les noms de villes et d'États seront mis à jour pour utiliser le pinyin"
 news.1004.t: "[GetNewspaperHeader]La République populaire de Chine adopte le chinois simplifié"
 news.1004.d: "Le gouvernement chinois a officiellement publié les détails d'un nouveau document intitulé « Plan de simplification des caractères chinois » ainsi qu'un nouveau décret obligeant les établissements scolaires à mettre en œuvre ces nouveaux caractères. Bien que le Comité de recherche sur la réforme linguistique de Chine ait entamé le processus de simplification des caractères chinois dès 1952, le mouvement en faveur de la simplification de la langue remonte au début du XXe siècle. Le gouvernement chinois affirme que la simplification du chinois améliorera l'alphabétisation et favorisera l'accès à l'éducation pour l'ensemble de la population chinoise. Le gouvernement estime que ces changements faciliteront l'édition et permettront également la diffusion de l'actualité et de l'information à tous les niveaux de la société. Certains Chinois ont exprimé leurs inquiétudes face à ces réformes, affirmant que le gouvernement ne devrait pas interférer avec un système d'écriture qui existe depuis des millénaires. Quoi qu'il en soit, les écoles chinoises de tout le pays recevront bientôt des manuels scolaires et des instructions pour enseigner les nouveaux caractères à tous les élèves."
 news.1004.a: "Puisse cela contribuer à rassembler notre pays."
 news.1004.b: "Super !"
 news.10004.d: "Le gouvernement chinois a publié un document annonçant le système officiel de romanisation de la langue chinoise, appelé pinyin. Ce système est le fruit d'une collaboration entre les meilleurs linguistes chinois, à la demande du ministère de l'Éducation. Le gouvernement affirme que cela facilitera la traduction des documents étrangers et rendra la langue chinoise plus accessible à l'étranger. Plus important encore, cela permettra à la Chine de diffuser plus efficacement ses idées et ses opinions à travers le monde. Les gouvernements chinois tentent de créer une romanisation du chinois depuis le début du XXe siècle, et le gouvernement américain a mis au point son propre système, appelé « système Yale ». Le pinyin est destiné à remplacer le système Yale, et le gouvernement chinois n'a pas tardé à déclarer le pinyin système officiel de romanisation de la langue chinoise."
 news.1005.t: "[GetNewspaperHeader]La fondation de la nouvelle Chine"
 news.1005.d: "La République populaire de Chine a finalement remporté sa guerre civile contre la République de Chine. La deuxième phase de la guerre civile chinoise a pris fin. La République de Chine et la République populaire de Chine s'affrontent depuis maintenant trois ans. Avant cela, elles s'étaient déjà livré bataille de 1927 à 1936, date à laquelle la Chine a été envahie par l'Empire japonais. Après la Seconde Guerre mondiale, en 1946, les combats ont repris et se sont enlisés jusqu'en 1948. En 1948, les forces communistes chinoises ont pris Pékin et se sont enfoncées en Chine centrale, encerclant des centaines de milliers de soldats chinois démocrates. Ce n'est qu'à la fin de l'année 1949 que la République de Chine s'est enfuie à Taïwan et dans d'autres régions d'Asie du Sud-Est. Le Premier ministre Mao a proclamé une nouvelle Chine, qui sera la seule Chine forte. Des centaines de milliers de personnes se sont rassemblées à Pékin pour écouter le discours de Mao Zedong. La guerre en Chine s'est calmée pour l'instant."
 news.1005.a: "Puisse-t-il durer éternellement !"
 news.1005.b: "Intéressant."
 news.1006.t: "[GetNewspaperHeader]La République populaire de Chine met en place des ministères des Affaires étrangères"
 news.1006.d: "La République populaire de Chine a ouvert des représentations diplomatiques aux États-Unis et en Union soviétique après leur guerre de quatre ans, et même avant cela avec la République de Chine. La République populaire de Chine revendique que son gouvernement est la seule et unique Chine, tandis qu'elle qualifie la République de Chine de « Taipei occupée ». Pour l'instant, il semble que l'URSS ait reconnu le nouveau gouvernement chinois, tandis que les États-Unis continuent de reconnaître la République de Chine comme la seule et unique Chine."
 news.1006.a: "Sommes-nous les bienvenus ?"
 news.1006.b: "Bienvenue chez nous !"
 news.1006.c: "Intéressant."
 news.1007.t: "[GetNewspaperHeader]La République populaire de Chine annonce la signature du traité sino-soviétique"
 news.1007.d: "La République populaire de Chine a annoncé la conclusion d'un traité avec l'Union soviétique. Ce matin à Pékin, la République populaire de Chine a annoncé avoir signé un traité d'amitié avec l'Union soviétique. Ce traité est intitulé « Traité sino-soviétique d'amitié, d'alliance et d'assistance mutuelle ». Le traité prévoit le retrait soviétique de la Mandchourie et de Dalian, des dispositions en matière de transport et une « alliance » à court terme jusqu'en 1979. L'URSS et la RPC ont fait savoir à l'Occident qu'elles s'uniraient pour rassembler les peuples du monde sous la bannière du communisme !"
 news.1007.a: "Nous nous entraidons"
 news.1007.b: "Ça pourrait devenir dangereux"
 news.1007.c: "Bon..."
 news.1008.t: "[GetNewspaperHeader]La République populaire de Chine accepte le Plan Marshall"
 news.1008.d: "La République populaire de Chine a annoncé qu'elle accepterait le plan Marshall proposé par les États-Unis d'Amérique. La RPC va désormais recevoir des moyens matériels et financiers pour reconstruire son pays après la Seconde Guerre mondiale et la guerre civile. Cette décision est une surprise, car beaucoup pensaient que la RPC accepterait le plan Molotov proposé par l'URSS. Cela a envoyé un message fort à l'URSS : ce n'est pas parce que la RPC est communiste qu'elle deviendra pour autant un autre État fantoche à sa merci. Les États-Unis souhaitent conclure des accords avec la RPC, ce qui pourrait bouleverser toute l'Asie de l'Est."
 news.1008.a: "Nous nous entraidons"
 news.1008.b: "Ça pourrait devenir dangereux"
 news.1008.c: "Bon..."
 news.1009.t: "[GetNewspaperHeader]La République de Chine à Taïwan"
 news.1009.d: "La deuxième phase de la guerre civile chinoise a pris fin. La République de Chine et la République populaire de Chine s'affrontent depuis maintenant trois ans. Avant cela, elles s'étaient déjà livré bataille de 1927 à 1936, date à laquelle la Chine a été envahie par l'Empire japonais. Après la Seconde Guerre mondiale, les combats ont repris et se sont enlisés dans une impasse jusqu'en 1948. En 1948, les forces communistes chinoises ont pris Pékin et se sont enfoncées en Chine centrale, encerclant des centaines de milliers de soldats chinois démocrates. Cette année-là, cependant, des pourparlers de paix ont eu lieu avec la mission Marshall au sujet d'un éventuel armistice prévoyant la division de la Chine, ou d'un plan de paix. Ce plan a échoué et les combats se sont poursuivis avec l'offensive du Yangtsé vers le sud de la Chine. Après plusieurs défaites cuisantes infligées par la République de Chine, le gouvernement républicain s'est enfui vers l'île de Taïwan. Tchang Kaï-chek a déclaré que la République de Chine continuait d'exister et qu'un jour, le drapeau de la République de Chine flotterait à nouveau sur la Chine continentale. Selon certaines informations, des centaines de milliers de soldats et de réfugiés fuiraient vers le Tibet, la Birmanie, la Thaïlande et Taïwan."
 news.1009.a: "Ils sont encore en vie ?"
 news.1009.b: "Les dominos sont tombés."
 news.1009.c: "On reviendra."
 news.1010.t: "La République populaire de Chine réaffirme sa politique d'une seule Chine"
 news.1010.d: "La République populaire de Chine vient de réaffirmer sa politique d'«une seule Chine». En vertu de cette politique, les deux gouvernements (celui de la République populaire de Chine et celui de la République de Chine) s'accordent à dire qu'il ne peut y avoir qu'un seul État souverain exerçant son autorité sur la Chine continentale. Ils divergent toutefois sur la question de savoir lequel des deux gouvernements est le gouvernement légitime de cet État. Tout autre État souhaitant établir des relations diplomatiques avec la République populaire de Chine doit rompre ses relations avec la République de Chine, et inversement."
 news.1010.a: "Nous sommes le gouvernement légitime !"
 news.1010.b: "Avec qui allons-nous partir ?"
 news.1011.t: "[GetNewspaperHeader]La République populaire de Chine se rapproche de l'URSS"
 news.1011.d: "Au cours de leur mission à Moscou, les représentants de la République populaire de Chine ont pris contact avec l'URSS et ont eu des discussions sur l'avenir de leurs pays."
 news.1011.a: "L'avenir s'annonce radieux."
 news.1011.b: "Intéressant."
 news.1012.t: "[GetNewspaperHeader][From.GetName] adhère au Pacte de Varsovie"
 news.1012.d: "[From.GetName] ont officiellement adhéré au Pacte de Varsovie. Ils font désormais front commun et ont encore étendu le rideau de fer."
 news.1012.a: "Super !"
 news.1012.b: "Intéressant."
 news.1012.c: "Pas terrible."
 news.1013.t: "[GetNewspaperHeader]La RPC crée sa propre faction"
 news.1013.d: "La République populaire de Chine a fondé sa propre faction. Elle s'appelle « Empire asiatique uni du peuple ». Envisagent-ils d'étendre cet empire ?"
 news.1013.a: "Notre empire va s'étendre !"
 news.1013.b: "Intéressant."
 news.1016.t: "[GetNewspaperHeader]La République populaire de Chine a été admise à l'ONU"
 news.1016.d: "La République populaire de Chine a été admise à l'Organisation des Nations unies, les quatre membres permanents – la France, la Grande-Bretagne, les États-Unis et l'Union soviétique – ayant voté pour. La seule partie à s'y être opposée était la République de Chine. Celle-ci a perdu la guerre civile, mais elle ne semble pas vouloir reconnaître sa défaite."
 news.1016.a: "Ensemble, nous sommes plus forts."
 news.1016.b: "Un nouveau membre parmi nous !"
 news.1016.c: "Ils seront les bienvenus."
 news.1016.e: "Ennemis pour toujours !"
 news.1017.t: "[GetNewspaperHeader]La République populaire de Chine n'est pas admise à l'ONU"
 news.1017.d: "La République populaire de Chine n'a pas été admise à l'ONU, car l'un ou plusieurs des quatre membres permanents – la France, la Grande-Bretagne, les États-Unis et l'Union soviétique – ont voté contre, tout comme la République de Chine. Ils se réjouissent du fait que la RPC n'ait pas été admise."
 news.1017.a: "Nous avons fait de notre mieux."
 news.1017.b: "Ne t'approche pas !"
 news.1017.c: "Intéressant."
 news.1017.e: "Ennemis pour toujours !"
 news.1018.t: "[GetNewspaperHeader]L'unification de Trieste"
 news.1018.d: "Aujourd’hui, le Mémorandum de Londres a été signé à Londres par le Royaume-Uni, les États-Unis, l’Italie et la Yougoslavie concernant l’unification du Territoire libre de Trieste. L’Italie et la Yougoslavie ont toutes deux accepté les dispositions du traité. L’Italie se verra attribuer la zone A, qui comprend la ville de Trieste, tandis que la Yougoslavie se verra attribuer la zone B, qui correspond à la campagne environnante de Trieste. Ce sera un grand jour pour une unification pacifique."
 news.1018.a: "Nous avons fait notre part."
 news.1018.b: "Nous pourrions avoir les deux parties."
 news.1018.c: "Intéressant."
 news.1019.t: "[GetNewspaperHeader]Pas d'unification de Trieste"
 news.1019.d: "À l'issue des pourparlers menés à Londres, la Yougoslavie a décidé de se retirer de la signature du Mémorandum de Londres, estimant que le traité favorisait trop l'Italie. Elle accuse les États-Unis et le Royaume-Uni de prendre le parti de l'Italie, car ceux-ci adhèrent aux idéaux capitalistes et souhaitent empêcher qu'une ville ne tombe sous le rideau de fer. La Yougoslavie ne signera pas le traité et les tensions atteignent leur paroxysme en Méditerranée."
 news.1019.a: "Pourquoi ?"
 news.1019.b: "Nous voulons les deux !"
 news.1019.c: "C'est inquiétant..."
 news.1020.t: "[GetNewspaperHeader]L'unification de Trieste"
 news.1020.d: "À l'issue de nouvelles négociations à Londres, la Yougoslavie a décidé de faire marche arrière et de signer le Mémorandum de Londres afin de ne pas risquer une guerre. Elle estime toujours que le traité favorise trop l'Italie, mais la menace d'une guerre mondiale l'a contrainte à céder. Les tensions en Méditerranée se sont apaisées."
 news.1020.a: "Heureusement, ça n'a pas dégénéré."
 news.1020.b: "On n'avait pas le choix."
 news.1020.c: "Heureusement, ça n'a pas dégénéré."
 news.1021.t: "[GetNewspaperHeader]La guerre de Trieste"
 news.1021.d: "Après plusieurs jours de tensions, les négociations entre la Yougoslavie et l'Italie ont complètement échoué. Les deux parties se sont mutuellement menacées de céder et de trancher la question de Trieste, mais chacune continue de revendiquer la ville. Hier soir, les troupes yougoslaves ont franchi la frontière italienne et les forces spéciales yougoslaves ont envahi Trieste et pris le contrôle de la ville. L'Italie a déclaré qu'elle défendrait une nouvelle fois son territoire et libérerait la ville de Trieste. Une guerre a éclaté en Méditerranée et tant l'Est que l'Ouest sont appelés à s'impliquer d'une manière ou d'une autre dans ce conflit. Nous vivons une période sombre."
 news.1021.a: "Il faut se battre maintenant !"
 news.1021.b: "Ça en vaut la peine."
 news.1021.c: "Oh mon Dieu..."
 news.1022.t: "[GetNewspaperHeader]L'unification de Trieste"
 news.1022.d: "À l'issue des pourparlers à Londres, l'Italie a décidé de se retirer de la signature du Mémorandum de Londres, car elle n'obtenait que la zone A de Trieste et non les deux zones. Dans un communiqué, elle a déclaré disposer de documents historiques prouvant qu'elle avait toujours détenu l'intégralité de Trieste et non seulement la moitié. Cette situation a porté les tensions à leur paroxysme en Méditerranée, et ni la Yougoslavie ni l'Italie ne semblent disposées à faire des concessions sur leurs positions."
 news.1022.a: "On n'avait pas le choix."
 news.1022.b: "C'est une excellente nouvelle !"
 news.1022.c: "Heureusement, ça n'a pas dégénéré."
 news.1023.t: "[GetNewspaperHeader]L'Union franco-britannique"
 news.1023.d: "Une fois de plus, Français et Britanniques combattent côte à côte dans une nouvelle guerre. Une nouvelle force opérationnelle anglo-française a été créée et envoyée en Égypte. Le Premier ministre français souhaite aller plus loin et a proposé une union entre les deux pays. Le ministre a déclaré dans un communiqué que le Royaume-Uni et la France devaient s'unir sous un même État pour lutter contre les ennemis de l'Occident. Le ministre a proposé que la France soit annexée à l'Empire britannique sous le nom d'Union franco-britannique. Les Britanniques ont alors décidé de former l'Union franco-britannique. L'intégration du gouvernement français à l'Empire britannique prendra un certain temps, mais la nouvelle Union entre Britanniques et Français est désormais formée."
 news.1023.a: "Ensemble, nous sommes plus forts !"
 news.1023.b: "Intéressant."
 news.1024.t: "[GetNewspaperHeader]Tito est mort"
 news.1024.d: "Quatre rois, 31 présidents, six princes, 22 Premiers ministres et 47 ministres des Affaires étrangères se sont rendus à Belgrade pour rendre hommage au maréchal Tito. Ils sont venus de tous horizons pour rendre hommage à notre grand leader. Tito a été déclaré décédé au service de chirurgie cardiovasculaire du Centre médical universitaire de Ljubljana des suites d'une gangrène, trois jours seulement avant son 88e anniversaire."
 news.1024.a: "Repose en paix, maréchal."
 news.1024.b: "C'était un grand leader."
 news.1025.t: "[GetNewspaperHeader]Fin de la guerre civile grecque"
 news.1025.d: "Après trois ans et six mois de combats, près de 50 000 morts et des milliers de disparus, la guerre civile grecque a pris fin, le Royaume de Grèce ayant vaincu le gouvernement démocratique provisoire dirigé par le Parti communiste grec. Grâce à l'aide américaine apportée dans le cadre du plan Marshall et de la doctrine Truman, les forces royalistes ont pris le dessus sur les forces communistes, qui bénéficiaient du soutien de l'Union soviétique et de divers autres États socialistes du bloc de l'Est. La guerre civile a laissé la Grèce en ruines et l'économie est en difficulté ; il faut désormais procéder à la reconstruction d'une Grèce meilleure et plus forte. Le gouvernement royaliste a déjà déclaré qu'il souhaitait poursuivre sa coopération avec l'Occident et les experts suggèrent déjà que l'État grec victorieux demandera bientôt son adhésion à l'OTAN."
 news.1025.a: "Notre pays est à nouveau en paix."
 news.1025.b: "Intéressant."
 news.1026.t: "[GetNewspaperHeader]Fin de l'état d'urgence en Malaisie"
 news.1026.d: "L'état d'urgence en Malaisie a débuté le 16 juin 1948. Après des mois et des mois de guérilla dans les jungles de Malaisie, cet état d'urgence a enfin pris fin. Les campagnes ont été détruites et de nombreuses personnes sont encore sans abri et blessées à la suite des combats. La Malaisie entame désormais le processus de reconstruction et s'efforce de rassembler à nouveau la nation. Le Commonwealth a qualifié cet événement de victoire dans la lutte contre l'expansion du communisme à travers le monde."
 news.1026.a: "Notre pays est à nouveau en paix."
 news.1026.b: "Intéressant."
 news.1026.desc: "L'état d'urgence en Malaisie a débuté le 16 juin 1948. Après des mois et des mois de guérilla dans les jungles de Malaisie, l'état d'urgence a enfin pris fin. Les campagnes ont été détruites et de nombreuses personnes sont encore sans abri et blessées à la suite des combats. La Malaisie espère devenir un pays plus fort maintenant que le peuple s'est enfin soulevé. Le Commonwealth a qualifié cela de défaite décevante en Malaisie et a déclaré qu'il ferait tout pour empêcher le communisme de se propager ailleurs."
 news.1027.t: "[GetNewspaperHeader]Fin de la deuxième période d'urgence en Malaisie"
 news.1027.d: "Une deuxième crise en Malaisie a pris fin après que les rebelles communistes eurent obtenu davantage de soutien et d'aide de la part d'autres pays communistes de la région. De nouveaux combats ont éclaté dans les campagnes et une guérilla s'est engagée. Après une longue période de combats, la rébellion a été réprimée. Les gouvernements de Malaisie et du Commonwealth ont une nouvelle fois déclaré qu'il s'agissait d'une victoire contre le communisme et que celui-ci ne se propagerait plus."
 news.1027.a: "Notre pays est à nouveau en paix."
 news.1027.b: "Intéressant."
 news.1027.desc: "Une deuxième crise mayalane a pris fin après que les rebelles communistes eurent obtenu davantage de soutien et d’aide de la part d’autres nations communistes de la région. Les combats ont repris dans les campagnes et une guerre de guérilla s’est engagée. Après une longue période de combats, la rébellion populaire a été couronnée de succès. Le gouvernement démocratique de Malaya est désormais en exil et les communistes ont pris le contrôle total du pays. Le gouvernement de Malaya a déclaré qu'il reviendrait un jour pour reprendre ses terres légitimes. Le gouvernement du Commonwealth a répondu que la campagne « Hearts and Minds » n'avait tout simplement pas été aussi efficace que la dernière fois. Y aura-t-il une nouvelle guerre dans la région ?"
 news.1028.t: "[GetNewspaperHeader]L'Union soviétique procède à son premier essai nucléaire"
 news.1028.d: "Le 29 août à 7 h, l'Union soviétique a procédé à son premier essai nucléaire sur le site d'essais de Semipalatinsk, en République socialiste soviétique du Kazakhstan"
 news.1028.a: "Ils constituent une menace pour la paix mondiale."
 news.1029.t: "[GetNewspaperHeader]Mort de Joseph Staline"
 news.1029.d: "Une nouvelle de dernière minute vient de tomber en Union soviétique. Selon les termes de la radio : « Le Comité central du Parti communiste, le Conseil des ministres et le Présidium du Soviet suprême de l'URSS annoncent avec une profonde tristesse au parti et à tous les travailleurs que le 5 mars à 21 h 50, Joseph Vissarionovitch Staline, secrétaire du Comité central du Parti communiste et président du Conseil des ministres, est décédé des suites d'une grave maladie. Le cœur de ce collaborateur et disciple de l’œuvre géniale de Lénine, de ce sage dirigeant et maître du Parti communiste et du peuple soviétique, a cessé de battre. En ces jours de deuil, tous les peuples de notre pays se rallient plus étroitement encore au sein de la grande famille fraternelle, sous la direction éprouvée du Parti communiste. »\nAprès l’autopsie, son corps a été embaumé pour être exposé au public, ses funérailles étant prévues quatre jours après son décès."
 news.1029.a: "Cela va bouleverser le paysage politique mondial"
 news.1030.t: "[GetNewspaperHeader]Khrouchtchev devient Premier ministre de l'Union soviétique"
 news.1030.d: "Nikita Khrouchtchev vient de prendre la tête de l'Union soviétique. Seul le temps nous dira comment il abordera les problèmes auxquels l'Union est confrontée."
 news.1030.a: "Espérons une paix durable"
 news.1031.t: "[GetNewspaperHeader]L'Union soviétique teste la plus grosse bombe jamais construite"
 news.1031.c: "Faire une déclaration devant le Soviet suprême et féliciter personnellement toutes les personnes concernées"
 news.1031.d: "Les Soviétiques affirment avoir testé avec succès la plus grosse bombe nucléaire jamais construite. Ils l'ont baptisée « Tsar Bomba », la « reine des bombes »."
 news.1031.a: "Déposer une plainte officielle auprès des Soviétiques"
 news.1031.b: "La démonstration de force brute de l'Union soviétique ne passera pas inaperçue sur la scène internationale"
 news.1511.t: "[GetNewspaperHeader]Discours de Khrouchtchev devant les Nations Unies"
 news.1511.a: "Les relations entre les superpuissances ne pourraient pas être pires"
 news.1511.d: "Trois jours après avoir rencontré Fidel Castro pour la première fois, [SOV.GetLeader] s'est rendu aux Nations Unies le 23 septembre 1960. [SOV.GetLeader] était convaincu que le communisme était l'avenir et qu'il fallait contenir les États-Unis. Dans son discours devant l'Assemblée générale des Nations Unies, [SOV.GetLeader] a menacé d'« enterrer » les États-Unis"
 news.1512.t: "[GetNewspaperHeader]La Chambre des Soviets"
 news.1512.a: "On dirait un robot enfoui."
 news.1512.d: "Au cours de la reconstruction de la ville de Königsberg – aujourd’hui Kaliningrad –, l’ancien château de Königsberg, déjà partiellement détruit par les bombardements de la Grande Guerre patriotique, a été rasé afin d’effacer toute trace du militarisme prussien. Le secrétaire régional du PCUS a décidé de le remplacer par un bâtiment baptisé « Maison des Soviets », qui servira de centre administratif à l'oblast de Kaliningrad. Sa construction débutera prochainement et devrait s'achever d'ici une dizaine d'années."
 news.1501.t: "[GetNewspaperHeader]Les troupes soviétiques envahissent la Finlande !"
 news.1501.d: "L'Union soviétique a fait passer ses troupes par la frontière finlandaise et a commencé à occuper des villes. Elle a déclaré agir ainsi pour la sécurité du peuple finlandais, afin de le protéger des dangers de l'Occident. Le gouvernement finlandais n'a pas réagi et la population se demande s'il va attaquer les convois soviétiques. Il s'agit là d'une manœuvre très dangereuse de la part des Soviétiques. Une deuxième guerre d'hiver pourrait-elle éclater ?"
 news.1501.a: "Une deuxième guerre d'hiver va-t-elle éclater ?"
 news.1501.b: "Il faut qu'on se mette d'accord là-dessus !"
 news.1501.c: "Nous libérerons la Finlande de l'emprise de l'Occident, d'une manière ou d'une autre."
 news.1501.e: "Nous soutiendrons toujours l'indépendance de la Finlande !"
 news.1502.t: "[GetNewspaperHeader]Entrée des troupes soviétiques en Finlande"
 news.1502.d: "Le gouvernement finlandais a accordé un accès militaire à l'Union soviétique. Les Soviétiques ont réagi en affirmant que la Finlande avait pris la bonne décision pour éviter la guerre. Ils ont ajouté que cela permettrait une coopération accrue entre la Finlande et l'URSS. Cette décision n'est toutefois pas passée inaperçue dans le monde, et l'OTAN a réagi en déclarant qu'elle portait atteinte à l'indépendance de la Finlande. Serait-ce le signe d'un changement en Scandinavie ?"
 news.1502.a: "Cette crise de la Note va-t-elle s'aggraver ?"
 news.1502.b: "Nous nous sommes fait un excellent allié."
 news.1502.c: "Cela met fin à la violation de l'indépendance de la Finlande."
 news.1503.t: "[GetNewspaperHeader]À la défense de la Finlande"
 news.1503.d: "Le gouvernement finlandais a pris une décision à l'issue d'une réunion d'urgence, quelques heures après le franchissement de la frontière par les troupes soviétiques. Il a déclaré que la « protection » soviétique constituait une menace imminente pour l'indépendance de la nation. L'armée finlandaise a décidé de défendre son pays jusqu'au dernier homme. Des combats ont déjà été signalés dans l'est de la Finlande. Une deuxième guerre d'hiver a éclaté. Qui l'emportera cette fois-ci ?"
 news.1503.a: "Qui remportera la deuxième guerre d'hiver ?"
 news.1503.b: "Nous soutiendrons l'indépendance de la Finlande par tous les moyens nécessaires."
 news.1503.c: "La Finlande sera bientôt à nos pieds. Nous réparerons les erreurs que nous avons commises pendant la Guerre d'hiver."
 news.1503.e: "Nous défendrons notre pays jusqu'au dernier homme !"
 news.1504.t: "[GetNewspaperHeader]La deuxième guerre d'hiver éclate !"
 news.1504.d: "L'Union soviétique a lancé des attaques contre la Finlande. Des parachutistes soviétiques ont été aperçus en train de se poser dans des villes et villages à travers la Finlande. Des colonnes de chars et de soldats soviétiques auraient franchi la frontière finlandaise. L'armée finlandaise a ouvert le feu sur les Soviétiques et des combats auraient éclaté. On a vu d'innombrables réfugiés finlandais franchir les frontières suédoise et norvégienne pour tenter d'échapper aux combats. L'OTAN n'a pas encore fait de déclaration, mais une deuxième guerre d'hiver a éclaté entre la Finlande et l'URSS."
 news.1504.a: "Une nouvelle guerre d'hiver ? Qui l'emportera ?"
 news.1504.b: "Nous allons libérer la Finlande de son gouvernement oppressif !"
 news.1504.c: "Nous aiderons la Finlande par tous les moyens possibles."
 news.1504.e: "Nous ferons front commun contre les hordes rouges !"
 news.1505.t: "[GetNewspaperHeader]La République démocratique finlandaise est née !"
 news.1505.d: "La République de Finlande a décidé de se tourner vers une République démocratique finlandaise plus à gauche. Les Soviétiques y ont vu un moyen pour la révolution de se propager à nouveau en Europe. L'Occident a qualifié cela de perte d'un allié important dans la région de l'Europe du Nord. On a vu des réfugiés franchir les frontières suédoise et norvégienne pour tenter d'échapper à ce qu'ils appellent la « tyrannie communiste ». La capitale, Helsinki, a été le théâtre de nombreuses célébrations en l'honneur du nouveau gouvernement communiste."
 news.1505.a: "Que va-t-il se passer maintenant ?"
 news.1505.b: "Nous souhaitons la bienvenue à nos nouveaux amis !"
 news.1505.c: "Nous avons perdu un grand allié dans la région."
 news.1505.e: "Nous soutiendrons la Révolution !"
 news.1506.t: "[GetNewspaperHeader]Création de la RSS finlandaise !"
 news.1506.d: "La République de Finlande a décidé de rejoindre le cercle très fermé des Républiques socialistes soviétiques. Les Soviétiques y voient un moyen de propager à nouveau la révolution en Europe. L'Occident y voit la perte d'un allié important en Europe du Nord. On a vu des réfugiés franchir les frontières suédoise et norvégienne pour tenter d'échapper aux « envahisseurs rouges ». La capitale, Helsinki, est en effervescence, célébrant la création de la nouvelle RSS."
 news.1506.a: "Que va-t-il se passer maintenant ?"
 news.1506.b: "Nous souhaitons la bienvenue à nos nouveaux amis !"
 news.1506.c: "Nous avons perdu un grand allié dans la région."
 news.1506.e: "Nous soutiendrons la Révolution !"
 news.1507.t: "[GetNewspaperHeader]Guerre civile en Finlande"
 news.1507.d: "Une guerre civile a éclaté entre la République de Finlande et la République démocratique finlandaise. Les communistes finlandais ont lancé plusieurs attaques contre les troupes de la République démocratique finlandaise. Le gouvernement finlandais a déclaré qu'il réprimerait cette rébellion dirigée contre lui. Les Soviétiques ont déclaré qu'ils viendraient en aide à la République démocratique finlandaise. L'OTAN a déclaré qu'elle apporterait toute l'aide nécessaire à la République de Finlande."
 news.1507.a: "Que va-t-il se passer maintenant ?"
 news.1507.b: "Nous soutiendrons nos révolutionnaires en Finlande !"
 news.1507.c: "Nous devons contenir le communisme !"
 news.1507.e: "Nous allons réprimer cette rébellion !"
 news.1508.t: "[GetNewspaperHeader]Annexion de la Finlande par l'URSS"
 news.1508.d: "La République de Finlande a décidé de rejoindre l'URSS et d'être annexée par celle-ci. Les Soviétiques ont déclaré qu'il s'agissait d'un excellent moyen de sceller l'amitié éternelle entre les peuples finlandais et soviétique. L'Occident a déclaré que cela rendait l'Europe du Nord d'autant plus importante qu'il perdait un allié dans la région. Des réfugiés ont été vus traversant les frontières suédoise et norvégienne pour tenter d'échapper aux « rouges et à leur tyrannie ». La capitale, Helsinki, a été le théâtre de nombreuses célébrations avec les Soviétiques."
 news.1508.a: "Que va-t-il se passer maintenant ?"
 news.1508.b: "Nous avons retrouvé un allié de choix !"
 news.1508.c: "Nous avons perdu un grand allié dans la région."
 news.1509.t: "[GetNewspaperHeader]Fin de la crise de la Note"
 news.1509.d: "La crise de la note a pris fin. Les deux parties se sont mises d'accord sur l'avenir de la Finlande et de la région de l'Europe du Nord. Les gouvernements de l'OTAN et du Pacte de Varsovie ont déclaré qu'ils aspiraient à la paix et se réjouissaient de la fin de la crise de la note. Espérons que la paix revienne et qu'il n'y ait plus de crises."
 news.1509.a: "Puisse la paix régner de notre vivant."
 news.1510.t: "[GetNewspaperHeader]Le grand séisme chilien"
 news.1510.d: "Surnommé le « grand séisme chilien », l'United States Geological Survey a classé cette catastrophe comme le plus grand séisme jamais enregistré par l'humanité à ce jour. Survenu le 22 mai 1960, le « grand séisme chilien » a été enregistré avec une magnitude de 9,5, provoquant un tsunami qui s'est étendu du Chili jusqu'en Asie. À la suite du séisme, 2 000 000 de personnes se sont retrouvées sans abri et sans emploi. Le tsunami lui-même a balayé une grande partie du Chili, de la Nouvelle-Zélande, des Philippines, du Japon, du Pérou, de l'Équateur, de la Californie et de nombreux autres territoires insulaires qui font encore aujourd'hui l'objet de litiges entre puissances étrangères. L'Argentine et la Bolivie ont également été dévastées par le séisme dans les régions voisines du Chili. Les dégâts causés par le séisme sont estimés entre $400 to $ et 800 millions de dollars."
 mccarthy.1.d: "Le républicain du Wisconsin Joseph R. McCarthy remporta les élections sénatoriales de 1946, au cours d'une campagne marquée par une chasse aux communistes. En partie en réaction aux victoires du Parti républicain, le président Harry S. Truman tenta de montrer qu'il était lui aussi préoccupé par la menace communiste en mettant en place un programme de loyauté destiné aux fonctionnaires fédéraux. Il demanda également au ministère de la Justice de dresser une liste officielle de 78 organisations subversives. Alors que l'année des élections de mi-mandat battait son plein, l'ancien fonctionnaire du Département d'État Alger Hiss, soupçonné d'espionnage, a été condamné pour parjure. Dans un discours prononcé à Wheeling, en Virginie-Occidentale, McCarthy a lancé une attaque contre le programme de politique étrangère de Truman, affirmant que le Département d'État et son secrétaire, Dean Acheson, abritaient des communistes « traîtres ». Les copies préliminaires du discours distribuées à la presse indiquent que McCarthy affirmait connaître 205 communistes. Ce chiffre a ensuite été révisé, tant dans une lettre adressée au président Truman que dans une transcription « officielle » du discours que McCarthy a soumise au Congressional Record dix jours plus tard, où il mentionne le chiffre de 57."
 MZB.2.d: "Depuis des années, le Mozambique a tout mis en œuvre pour se libérer de la domination coloniale portugaise. Aujourd’hui, le pays est plongé dans un conflit violent contre les Portugais, le FRELIMO en étant la principale force motrice. Outre l’indépendance, le FRELIMO a pour objectif de mener à bien des réformes sociales et d’éliminer l’élite au pouvoir."
 ire.1.d: "Le vol KLM 633 s'est écrasé peu après son décollage de l'aéroport de Shannon, alors qu'il effectuait la liaison entre Amsterdam et New York. Le Super Constellation Triton s'est posé en urgence sur un banc de boue de la rivière Shannon ; 28 personnes auraient trouvé la mort dans cet accident."
 raj.1.t: "Conflit au Cachemire"
 raj.1.d: "Le conflit avec le Pakistan au sujet du Cachemire a considérablement exacerbé les tensions entre nos deux pays. L'agressivité pakistanaise atteint des sommets et, si rien n'est fait pour y mettre un terme rapidement, ils pourraient déclarer la guerre. Devrions-nous lancer une attaque préventive pour régler cette affaire une fois pour toutes ?"
 raj.1.a: "Nous devons frapper les premiers !"
 raj.1.b: "Non, nous pouvons régler cela par la voie diplomatique."
 raj.2.t: "L'Inde déclare la guerre !"
 raj.2.d: "L'Inde nous a déclaré la guerre ! Elle invoque le conflit au Cachemire comme casus belli. Elle a lancé des frappes aériennes massives et piétine désormais notre sol sacré ! Allons-nous riposter contre ces traîtres ?"
 raj.2.a: "Contre-attaque !"
 raj.5.t: "Référendum à Pondichéry"
 raj.5.d: "À l'issue de leurs discussions, l'Inde et la France ont publié, le 13 octobre 1954, une déclaration commune annonçant une procédure visant à déterminer le statut des possessions françaises. Cinq jours plus tard, le 18 octobre 1954, les membres élus de l'Assemblée représentative et les conseillers municipaux de Pondichéry et de Karaikkal ont pris part à un référendum organisé à Kizhur. Sur les 178 membres ayant voté, une majorité écrasante de 170 s'est prononcée en faveur de la fusion des territoires français d'Inde avec la République de l'Inde. Trois jours plus tard, un accord sur le transfert de facto des territoires français à l'Inde a été signé à New Delhi entre les deux pays."
 raj.5.a: "Super !"
 raj.6.t: "Référendum à Pondichéry"
 raj.6.d.: "À l'issue de leurs discussions, l'Inde et la France ont publié, le 13 octobre 1954, une déclaration commune annonçant une procédure visant à déterminer le statut des possessions françaises. Cinq jours plus tard, le 18 octobre 1954, les membres élus de l'Assemblée représentative et les conseillers municipaux de Pondichéry et de Karaikkal ont pris part à un référendum organisé à Kizhur. Sur les 178 membres ayant voté, une majorité écrasante de 170 s'est prononcée en faveur de la fusion des territoires français d'Inde avec la République de l'Inde. Trois jours plus tard, un accord sur le transfert de facto des territoires français à l'Inde a été signé à New Delhi entre les deux pays."
 raj.6.a: "C'est dommage qu'ils n'aient pas voté pour nous."
 raj.7.t: "Demander Goa"
 raj.7.d: "Depuis des années, nous tentons de récupérer pacifiquement Goa des mains de ses oppresseurs impérialistes, mais en vain. Goa fait partie de l'Inde depuis des milliers d'années et il est tout simplement absurde que le Portugal prétende qu'elle fait partie intégrante de son territoire. Le Portugal s'est obstinément accroché à ses colonies en Afrique et partout dans le monde pendant des années après la Grande Guerre, et il semble qu'il n'ait aucune intention de renoncer à aucune d'entre elles. Il semble que nos tentatives pacifiques aient échoué et que nous devions peut-être recourir à des moyens plus violents..."
 raj.7.a: "Goa est indienne ! Lancez l'opération Vijay !"
 raj.7.b: "Nous allons régler cela de manière diplomatique, un point c'est tout."
 raj.8.t: "Guerre contre l'Inde !"
 raj.8.d: "Monsieur le Premier ministre ! L'Inde nous a déclaré la guerre sans ménagement ! Ils prétendent que Goa est un territoire indien, alors que nous savons qu'il est portugais ! Nous avons renforcé nos forces militaires dans la partie portugaise de Goa, mais les Indiens sont bien plus nombreux que nous. Devrions-nous envoyer des renforts ?"
 raj.8.a: "Oui ! Envoyez des renforts tout de suite !"
 pak.1.t: "Conflit au Cachemire"
 pak.1.d: "Le conflit avec l'Inde au sujet du Cachemire a considérablement exacerbé les tensions entre nos deux pays. L'agressivité de l'Inde atteint des sommets et, si rien n'est fait pour l'enrayer rapidement, elle pourrait déclarer la guerre. Devrions-nous lancer une attaque préventive pour régler cette affaire une fois pour toutes ?"
 pak.1.a: "Nous devons frapper les premiers !"
 pak.1.b: "Non, nous pouvons régler cela par la voie diplomatique."
 pak.2.t: "Le Pakistan déclare la guerre !"
 pak.2.d: "Le Pakistan nous a déclaré la guerre ! Ils invoquent le conflit au Cachemire comme casus belli. Ils ont lancé des frappes aériennes massives et foulent désormais notre sol sacré ! Devons-nous riposter contre ces traîtres ?"
 pak.2.a: "Contre-attaque !"
 news.500.t: "[GetNewspaperHeader]Conflit au Cachemire"
 news.500.d: "L'Inde a déclaré la guerre au Pakistan ! Elle invoque le conflit au Cachemire comme casus belli. Elle a lancé des frappes aériennes massives et envahit actuellement le Pakistan oriental et occidental. Le sort du Cachemire reste incertain."
 news.500.a: "On aurait pu espérer qu'ils règlent leurs différends à l'amiable..."
 news.501.t: "[GetNewspaperHeader]Conflit au Cachemire"
 news.501.d: "Le Pakistan a déclaré la guerre à l'Inde ! Il invoque le conflit au Cachemire comme casus belli. Il a lancé des frappes aériennes massives et envahit actuellement l'Inde. Le sort du Cachemire reste incertain."
 news.501.a: "On aurait pu espérer qu'ils règlent leurs différends à l'amiable..."
 news.502.t: "[GetNewspaperHeader]La guerre pour Goa !"
 news.502.d: "L'Inde a déclaré la guerre au Portugal ! Elle affirme que Goa appartient de droit à l'Inde, et non au Portugal. L'Inde est actuellement en train d'envahir l'Inde portugaise avec une force écrasante."
 news.502.a: "Une évolution intéressante."
 swe.2.d: "Le 13 juin 1952, un avion de la marine suédoise non armé, connu sous le nom de Tp 47 « Catalan », a été abattu par un MiG-15 soviétique au large de Gotland alors qu'il recherchait un autre avion suédois disparu en mer Baltique. Cet incident a donné lieu à de nombreuses manifestations de Suédois devant l'ambassade soviétique en Suède. Quatre ans plus tard, Nikita Khrouchtchev avoua au Premier ministre suédois Tage Erlander que les Soviétiques avaient abattu l'avion. Le gouvernement suédois décida toutefois de garder cela secret, et ce n'est qu'en 1991 que cette information fut rendue publique, après qu'un ancien colonel soviétique eut admis publiquement qu'il avait ordonné son abattage. On pense que cela s'est produit parce que des avions suédois avaient violé à plusieurs reprises l'espace aérien soviétique et pris secrètement des photos de navires soviétiques qu'ils avaient ensuite envoyées à l'OTAN."
 news.1513.t: "[GetNewspaperHeader]La mort de Jimi Hendrix"
 news.1513.d: "Le célèbre guitariste Jimi Hendrix est décédé à l'âge de 27 ans. Les circonstances exactes de son décès restent floues, et une enquête du coroner doit se tenir à Londres le 30 septembre. La police affirme toutefois qu'il s'agit d'une overdose. Selon elle, il aurait pris neuf somnifères et serait mort par suffocation après avoir vomi. Depuis quelques jours avant son décès, Hendrix était en mauvaise santé, en partie à cause de la fatigue due au surmenage, d'un manque chronique de sommeil et d'une maladie supposée liée à la grippe. Des insécurités concernant ses relations personnelles, ainsi qu'une désillusion vis-à-vis de l'industrie musicale, avaient également contribué à sa frustration. Bien que les détails de ses dernières heures et de son décès soient contestés, Hendrix a passé une grande partie de sa dernière journée avec Monika Dannemann. Au petit matin, Dannemann a trouvé Hendrix inanimé dans son appartement de l'hôtel Samarkand. Elle a appelé une ambulance à 11 h 18, et Hendrix a été transporté à l'hôpital St Mary Abbot's où l'on a tenté de le réanimer. Il a été déclaré mort à 12 h 45."
 news.1513.a: "La vie passe plus vite qu'un clin d'œil"
 news.1514.t: "[GetNewspaperHeader]Marilyn Monroe est décédée ; on attribue sa mort à une overdose de médicaments"
 news.1514.d: "Marilyn Monroe, une beauté tourmentée qui n’avait pas réussi à trouver le bonheur malgré son statut de star incontestée d’Hollywood, a été retrouvée morte à son domicile de Brentwood, apparemment des suites d’une overdose de somnifères.\nMonroe souffrait de troubles mentaux et de toxicomanie depuis plusieurs années avant sa mort, et elle n’avait plus tourné de film depuis 1961.\nMonroe a passé le dernier jour de sa vie chez elle, à Brentwood. Vers 3 heures du matin, voyant qu'elle ne réagissait pas, son psychiatre est entré dans la pièce en brisant une fenêtre et a trouvé Monroe morte.\nAucun indice de crime n’a été trouvé, et l’hypothèse d’une overdose accidentelle a été écartée en raison de la grande quantité de barbituriques qu’elle avait ingérée.\nElle était un sex-symbol majeur et l’une des stars hollywoodiennes les plus populaires des années 1950 et du début des années 1960. Elle a été l’une des actrices les plus en vue pendant une décennie, et ses films avaient rapporté 200 millions de dollars au moment de sa mort."
 news.1514.a: "Une nouvelle victime pour Hollywood"
 saf_news.2.d: "Le Premier ministre britannique Harold Macmillan vient de prononcer un discours historique devant le Parlement sud-africain au Cap, dans le cadre de sa tournée des États africains du Commonwealth. Il était en tournée en Afrique depuis le 6 janvier, où il s'était rendu au Ghana, au Nigeria et dans d'autres colonies britanniques du continent. Ce discours indiquait clairement que le gouvernement britannique, dirigé par les conservateurs, n'avait pas l'intention de s'opposer à l'indépendance de bon nombre de ces territoires. Le discours de Macmillan au Cap a également clairement montré qu'il incluait l'Afrique du Sud dans ses propos et a laissé entrevoir un changement dans la politique britannique à l'égard de l'apartheid."
 news.1515.t: "[GetNewspaperHeader]Israël envahit le Sinaï"
 news.1515.d: "Plus tôt ce matin, des éléments d'avant-garde de l'armée israélienne (IDF) ont pénétré dans le désert du Sinaï, sous contrôle égyptien, et progressent inexorablement vers le canal de Suez, récemment nationalisé. Les dirigeants israéliens affirment que le déclenchement de la guerre est directement lié aux menaces fermes et répétées du Premier ministre égyptien Nasser de fermer le détroit de Tiran et que, compte tenu de sa décision de s'emparer du canal, Israël n'avait d'autre choix que de riposter en légitime défense. Jusqu’à présent, la communauté internationale est restée relativement silencieuse face à cette évolution inattendue, bien que des informations et des rumeurs indiquent que de hauts diplomates britanniques et français seraient déjà en train d’élaborer une proposition de cessez-le-feu."
 news.1515.a: "Comment cela va-t-il se passer ?"
 news.1516.t: "[GetNewspaperHeader]Le canal de Suez a été pris d'assaut"
 news.1516.d: "Alors que le soleil se levait sur l'Égypte ce matin, les forces d'élite de l'armée égyptienne ont fait irruption dans le canal de Suez et s'en sont rapidement emparées, tandis que [EGY.GetLeader] prononçait simultanément un discours triomphal devant son peuple, déclarant que le canal appartenait de droit à l'Égypte et qu'il était à nouveau le leur. Alors que des foules venues de tout le monde arabe envahissaient les rues pour célébrer cette grande victoire sur les anciennes puissances impérialistes, les hauts diplomates et les responsables politiques de toute l'Europe s'efforçaient de trouver une réponse et d'évaluer l'impact de cet événement sur leurs pays respectifs. Reste à voir combien de temps Nasser pourra conserver son nouveau territoire."
 news.1516.a: "Intéressant"
 news.1517.t: "[GetNewspaperHeader]Les troupes britanniques débarquent à Suez"
 news.1517.d: "Il semble que la réaction en chaîne déclenchée par la nationalisation du canal de Suez par l’Égypte ne soit pas tout à fait terminée, puisque aujourd’hui, la Grande-Bretagne et la France se sont jointes à Israël pour mener une action militaire contre ce pays. Des unités aéroportées britanniques ont débarqué à Port-Saïd et dans ses environs et ont rapidement repoussé les quelques brigades égyptiennes présentes dans la ville, tandis que les Français ont remporté un succès similaire à Port-Faud. Cependant, elles n’ont pas réussi à empêcher le blocage du canal, les forces égyptiennes ayant coulé quelques grands pétroliers au milieu du passage avant que la coalition anglo-française ne puisse les en empêcher. Ainsi, bien que les Britanniques aient remporté une grande victoire militaire, la pénurie de pétrole qui s’annonce et qui touchera toute l’Europe semble revêtir une importance bien plus grande."
 news.1517.a: "Tu ferais mieux de faire le plein tout de suite !"
 news.1518.t: "[GetNewspaperHeader]Résolutions 997 et 1001 des Nations unies"
 news.1518.d: "Lorsque les Britanniques et les Français ont envahi l’Égypte de concert avec Israël, ils espéraient qu’au minimum, la communauté internationale resterait les bras croisés et laisserait la situation suivre son cours. Or, c’est tout le contraire qui s’est produit, les États-Unis ayant pris la tête d’une vague d’indignation internationale contre l’opération anglo-franco-israélienne. Aujourd’hui, cette indignation a culminé avec l’adoption par les Nations unies de deux résolutions exigeant la fin immédiate du conflit et la remise du canal à une force de maintien de la paix de l’ONU. Si le pacte tripartite semblait être un succès sur le plan militaire, il est clair que la crise de Suez n’a été rien de moins qu’un désastre politique, avec de lourdes répercussions pour les trois pays."
 news.1518.a: "Au moins, ça n'a pas déclenché la Troisième Guerre mondiale"
 news.1519.t: "[GetNewspaperHeader]Victoire égyptienne"
 news.1519.d: "À la grande surprise de la plupart des membres de la communauté internationale, [EGY.GetLeader] a proclamé aujourd’hui sa victoire militaire sur le Pacte tripartite entre la Grande-Bretagne, la France et Israël. Bien que les premières phases du conflit autour du Sinaï et du canal de Suez aient montré que l’Égypte était en train de battre en retraite, son armée a néanmoins réussi à se ressaisir et à repousser Israël hors du Sinaï, mettant ainsi fin à toute chance de succès pour le Pacte tripartite. Les détails des négociations de cessez-le-feu restent flous, mais il semble probable que Nasser exigera une forme de réparations et, bien sûr, maintiendra le canal sous contrôle égyptien."
 news.1519.a: "Les outsiders ont remporté la victoire !"
 news.1520.t: "[GetNewspaperHeader]Nasser accepte le cessez-le-feu proposé par les Britanniques"
 news.1520.d: "Plus tôt dans la journée, [EGY.GetLeader] a accepté un accord de cessez-le-feu proposé par les Britanniques, après une réponse positive et rapide d’Israël à cette proposition. Cette décision a surpris de nombreux experts en politique du Moyen-Orient, car Nasser n'est pas connu pour céder aussi facilement. Néanmoins, toutes les hostilités dans le Sinaï ont cessé, et les soldats britanniques se sont déployés pour reprendre le contrôle du canal conformément aux termes de l'accord. On ne peut que spéculer sur ce qui se serait passé si Nasser avait rejeté la proposition, mais pour l'instant, la paix règne à nouveau au Moyen-Orient."
 news.1520.a: "Ça semble un peu... décevant"
