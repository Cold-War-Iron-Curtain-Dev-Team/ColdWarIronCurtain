 STALIN_Integration_of_the_Korean_Peninsula:0 "Intégration de la péninsule coréenne"
 STALIN_Ensure_the_Survival_of_the_Kim_Regime:0 "Assurer la survie du régime Kim"
 STALIN_Heavy_Industry_Development_desc:0 "Bien que nous disposions de grands centres industriels à travers notre pays, notre capacité à produire des équipements et des machines lourds reste inférieure à celle des puissances occidentales telles que les États-Unis. Seul un effort concerté pour développer notre industrie permettra de changer cela."
 STALIN_The_Iron_Curtain_Diplomacy_desc:0 "Notre sphère d'influence s'est étendue à toute l'Europe de l'Est, de la Baltique à la mer Noire. Winston Churchill, notre ancien allié, a qualifié la division entre nous et l'Occident de « rideau de fer », signe du fossé grandissant entre nos objectifs respectifs. Il a raison. Les capitalistes doivent apprendre à connaître leur place dans le monde ou la découvrir par la force."
 STALIN_Confirm_Stalins_Omnipotence_desc:0 "Notre glorieux dirigeant, le camarade Joseph Staline, est pratiquement un dieu en Union soviétique. Sous ses ordres, les gens vivent et meurent. À travers ses paroles, les gens mangent ou meurent de faim, pleurent ou rient, travaillent ou se reposent. Déjà souverain sans opposition, nous devons reconnaître son omnipotence."
 STALIN_The_Soviet_Armed_Forces_desc:0 "Notre armée est l'une des plus puissantes au monde en termes de taille. Cependant, nous sommes à la traîne par rapport à l'Occident en matière de recherche et développement dans plusieurs domaines clés, notamment la technologie des avions à réaction et tout ce qui s'apparente à une marine digne de ce nom."
 STALIN_Catch_Up_with_Western_Atomic_Research_desc:0 "L'énergie nucléaire, tant militaire que civile, sera l'un des facteurs décisifs dans la lutte pour la survie qui s'annonce, et nous ne pouvons pas nous permettre de rester à la traîne derrière les Américains dans ce domaine."
 STALIN_Utilize_German_Rocketry_Knowledge_desc:0 "Lorsque nous avons envahi l'Allemagne à la fin de la Grande Guerre patriotique il y a cinq ans, nous avons capturé de nombreux scientifiques allemands éminents, parmi lesquels quelques chercheurs hautement qualifiés dans le domaine des moteurs de fusée. En les mettant au travail, nous pouvons faire progresser nos connaissances."
 STALIN_Prioritize_Electronic_Developments_desc:0 "De nouvelles avancées sont réalisées chaque jour dans le domaine de l'électronique en Occident, mais la plupart de nos zones rurales ne disposent toujours pas d'infrastructures électriques de base. Nous devons améliorer leurs infrastructures et suivre le rythme des avancées technologiques actuelles."
 STALIN_Aid_Ukranian_Reconstruction_desc:0 "L'Ukraine a été particulièrement touchée par les chiens nazis pendant leur brève occupation, et une grande partie de ses infrastructures a été détruite. Des efforts considérables devront être déployés pour la reconstruire."
 STALIN_Rebuild_Ukranian_Agriculture_desc:0 "Les fascistes ont également ruiné les fermes et les industries agroalimentaires de la région lors de leur invasion, expédiant une grande partie des marchandises et des provisions vers leur pays d'origine. Notre population est déjà soumise au rationnement alimentaire, nous devons donc remettre en état le grenier à blé de la Russie occidentale."
 STALIN_Rebuild_Destroyed_Dams_desc:0 "De nombreux barrages ont été détruits pendant la guerre, endommageant ainsi de nombreux villages situés dans les environs et privant la région de l'énergie hydroélectrique qu'ils fournissaient. Ces deux raisons sont plus que suffisantes pour que nous commencions à réparer les barrages."
 STALIN_Invest_in_the_Baltics_desc:0 "La région baltique a beaucoup souffert au cours des dernières décennies, ayant été assimilée à l'Union moins de quelques années avant d'être envahie par la machine de guerre allemande, puis subissant les effets de la politique de la terre brûlée. Investir dans cette région ne peut être que bénéfique."
 STALIN_Rebuild_Stalingrad_desc:0 "Stalingrad abrite les tombes de nombreux héros de l'Union et est le théâtre de l'un des plus grands moments de la Grande Guerre patriotique. Cependant, cela ne change rien à la dévastation qu'elle a subie pendant la bataille, et nous devons relancer ses industries."
 STALIN_Open_New_Metallurgy_Plants_desc:0 "Les métaux des terres rares prennent de plus en plus d'importance dans la production d'appareils électroniques de haute technologie, d'armes et de véhicules sophistiqués, et l'augmentation de nos activités d'exploitation minière et de production nous sera très profitable."
 STALIN_Complete_the_Don_Volga_Canal_desc:0 "Le canal Don-Volga est un projet important, vital pour notre secteur agricole dans le sud de l'Union, et sa réalisation permettra d'améliorer les infrastructures locales et les capacités de production alimentaire."
 STALIN_Repair_Mining_Pits_desc:0 "En réparant les fosses minières et en redressant l'ensemble du secteur, nous pouvons augmenter nos exportations et notre production de métaux."
 STALIN_Eliminate_Infrastructure_Bottlenecks_desc:0 "L'état de nos routes et de nos infrastructures générales, bien qu'il ait été utile pour ralentir l'avancée nazie, est déplorable pour le commerce en temps de paix et doit être amélioré."
 STALIN_Increase_Cement_Production_desc:0 "Le ciment est un matériau essentiel à la construction de toutes sortes d'ouvrages, des ponts et routes aux bâtiments et fortifications, et nous avons besoin d'en avoir davantage."
 STALIN_Build_New_Railways_desc:0 "La construction de nouvelles voies ferrées est un bon moyen d'améliorer les infrastructures régionales et de faciliter le transport des marchandises et des troupes."
 STALIN_Connect_the_Union_desc:0 "Pour achever nos nouvelles améliorations industrielles et infrastructurelles, nous devons créer un vaste réseau routier et autoroutier afin de relier notre immense pays. De Leningrad, sur la Baltique, à Sébastopol, sur la mer Noire, en passant par Vladivostok, à l'extrême est, nos camarades citoyens auront une liberté de déplacement sans précédent."
 STALIN_Follow_the_Percentage_Agreements_desc:0 "Lors de la conférence de Yalta, nous avons convenu des limites de notre sphère d'influence. Même si nous méritons sans aucun doute davantage, nous devons tenir parole et ne pas outrepasser nos limites."
 STALIN_Abandon_Turkish_Claims_desc:0 "L'une des questions sur lesquelles nous avons insisté est celle des détroits turcs, car leur possession nous donnerait un accès total à la Méditerranée et aux océans au-delà. Cependant, cela ne relève pas de notre sphère d'influence, nous devrions donc renoncer à nos revendications."
 STALIN_Promote_Democratic_Route_to_Communism_desc:0 "Plutôt que de forcer nos voisins démocrates du nord-est à se joindre à nous, nous devrions suivre le processus démocratique et promouvoir divers partis communistes afin de les aider à remporter les prochaines élections nationales."
 STALIN_Pressure_Yugoslavia_desc:0 "Le maréchal Tito et ses alliés en Yougoslavie refusent de s'intégrer au Komintern, malgré nos similitudes naturelles. Nous devons intensifier nos efforts diplomatiques pour faire pression sur eux."
 STALIN_Fund_the_PCF_and_PCI_desc:0 "La France et l'Italie ont déjà des partis communistes puissants, mais ceux-ci sont étouffés par la politique gouvernementale et les attaques radicales. Nous devons soutenir nos frères à l'étranger de toutes les manières possibles."
 STALIN_Gather_Intelligence_Via_Western_Spies_desc:0 "En envoyant des espions dans les pays occidentaux et en transformant les espions occidentaux en agents à notre service, nous pouvons renforcer nos capacités de collecte de renseignements."
 STALIN_Aid_the_Greek_Loyalists_desc:0 "Une guerre civile a éclaté en Grèce, et les forces communistes se battent courageusement face à l'oppression et à l'intervention occidentales. Nous savons que nous avons convenu d'une sphère d'influence définie à Yalta, mais nous ne pouvons pas rester les bras croisés et regarder le feu de la révolution s'éteindre."
 STALIN_Integrate_Greece_into_the_Eastern_Bloc_desc:0 "Maintenant que la guerre civile grecque est terminée, les communistes ayant pris le dessus grâce à notre aide, il est temps de les inviter à rejoindre le Kominform avec le reste de l'Europe de l'Est."
 STALIN_Maintain_Push_for_Turkish_Regime_Change_desc:0 "Le gouvernement turc a jusqu’ici rejeté nos revendications sur les détroits et cherche un soutien occidental, mais si nous provoquons un changement de régime, le nouveau pouvoir nous les cédera sans résistance."
 STALIN_Redraw_Bosphorous_Borders_desc:0 "Maintenant que nous avons assuré une Turquie alliée, nous pouvons redessiner les frontières à notre guise. Nous avons deux objectifs principaux. Le premier, naturellement, est notre contrôle des détroits turcs. Le second est la création d’un État pour les Kurdes opprimés en Turquie."
 STALIN_An_Ultimatum_to_Yugoslavia_desc:0 "Les tentatives impertinentes de Tito et de la Yougoslavie d’ignorer nos demandes et nous-mêmes sont allées trop loin, et il est temps qu’ils nous rejoignent ou qu’ils affrontent la puissance de l’Armée rouge."
 STALIN_Maintain_Berlin_Blockade_desc:0 "Les Américains et les Britanniques insistent pour que nous mettions fin au blocus de Berlin-Ouest et que nous autorisions la libre circulation des denrées alimentaires et des marchandises dans la ville. C'est absurde. Nous ne céderons pas aux exigences capitalistes. Le blocus se poursuivra."
 STALIN_Cave_to_the_Western_Powers_desc:0 "Grâce au pont aérien de Berlin, les Américains ont démontré l’inutilité d’un blocus de Berlin-Ouest, et il est temps de céder et de leur permettre d’envoyer des fournitures vers la ville."
 STALIN_Allow_the_Foundation_of_a_German_State_for_Reperations_desc:0 "Depuis la fin de la Seconde Guerre mondiale, l’Allemagne de l’Est n’est qu’un territoire sous notre contrôle, gouverné provisoirement. Il est temps de lancer la création d’un État est-allemand."
 STALIN_Deepen_COMECON_Collaboration_desc:0 "Notre organisation de collaboration économique, le COMECON, a été jusqu’à présent un succès mineur, mais nous devons vraiment approfondir nos liens avec nos alliés d’Europe de l’Est si nous voulons en récolter tous les fruits."
 STALIN_Invest_in_the_Czech_and_Polish_Economy_desc:0 "Les économies tchèque et polonaise, sans parler de leurs territoires et de leurs peuples, ont été profondément meurtries par l'occupation nazie. Nous devons les aider à se remettre sur pied."
 STALIN_Aid_Balkan_Reconstruction_desc:0 "Les Balkans ont été le théâtre de certains des combats partisans les plus acharnés de la guerre, et les infrastructures y sont dévastées. Elles doivent être reconstruites."
 STALIN_Exploit_our_Eastern_Puppets_desc:0 "Bien que nous ne l'admettions pas publiquement, le reste du Kominform n'est guère plus que des marionnettes et doit en réalité obéir à nos ordres. En exploitant leurs économies, nous pouvons accroître les nôtres."
 STALIN_Increase_Ties_with_Mao_and_Kim_Il_Sung_desc:0 "Mao et Kim Il Sung sont nos plus grands alliés dans la lutte pour le communisme en Extrême-Orient, et nous devons renforcer nos liens avec eux."
 STALIN_Support_Indochinese_Insurrections_desc:0 "Le peuple indonésien indigène s'est soulevé contre ses occupants impérialistes néerlandais. Nous avons le devoir de le soutenir."
 STALIN_The_Korean_War_desc:0 "Guerre en Corée! Kim Il-sung et son armée ont franchi le 38ème parallèle et attaquent en profondeur la Corée du Sud. Deux choix s'offrent à nous: attendre et voir ce qui se passe, ou jouer un rôle plus actif pour assurer la victoire du Nord."
 STALIN_Send_Military_Advisors_desc:0 "Une intervention directe est trop risquée à ce stade, mais nous pouvons nous permettre d'envoyer des « conseillers » militaires. Leur implication dans le conflit ne nous concerne pas."
 STALIN_Provide_Surplus_Tanks_and_Planes_desc:0 "La RPDC, bien que ne manquant pas de courage et de valeur, a un besoin urgent de blindés lourds et d’avions, et nous pouvons facilement leur fournir cela."
 STALIN_Send_Infantry_Equipment_desc:0 "En raison des combats intenses, l'armée nord-coréenne a subi d'importantes pertes de matériel et a besoin de davantage d'armes pour poursuivre la guerre. Elle trouvera tout ce dont elle a besoin chez nous."
 STALIN_Establish_the_64th_Fighter_Aviation_Corps_desc:0 "Le 64e Corps d'aviation de chasse sera un escadron aérien spécial composé de volontaires nord-coréens qui sera capable de combattre les avions à réaction occidentaux dans les airs."
 STALIN_Increase_Korean_Production_Capabilities_desc:0 "En plus d'envoyer des armes, des chars et des avions, nous devrions également nous efforcer d'accroître la capacité de la Corée du Nord à fabriquer son propre équipement et à devenir plus autonome."
 STALIN_Purge_Seditous_Reactionaries_desc:0 "Notre Union est minée par des agents réactionnaires traîtres et des provocateurs capitalistes. Nous devons entreprendre un effort sérieux pour les purger tous, aussi dommageable que cela puisse être."
 STALIN_Denounce_Leningrads_Fair_Embezzlement_desc:0 "La section du Parti communiste à Leningrad est déloyale envers Staline, et nous avons les « preuves » nécessaires pour nous débarrasser d'elle et de tout pouvoir qu'elle aurait pu avoir. De nombreuses preuves concernant des cas graves de corruption et de détournement de fonds ont été découvertes."
 STALIN_Purge_the_Leningrad_Dissenters_desc:0 "Maintenant que nous avons les preuves indiquant la culpabilité des communistes de Leningrad, nous pouvons les frapper et les purger à travers une série de procès."
 STALIN_Encourage_Anti_Semetism_desc:0 "Les Juifs sont la source de tous nos problèmes. Ils tirent les ficelles dans les gouvernements de nos ennemis capitalistes, et même les Juifs soi-disant « loyaux » ici en URSS refusent de se soumettre pleinement au dogme du Parti et d'abandonner leur religion. Nous devons les réprimer."
 STALIN_Dismantle_The_Jewish_Anti_Fascist_Committee_desc:0 "À l'origine, le JAC a été créé sous prétexte de diffuser la gloire du communisme et de l'Union à l'étranger auprès des communautés juives, mais ses véritables intentions sont désormais claires. Le JAC n'est rien d'autre qu'un outil au service de la bourgeoisie."
 STALIN_Secret_Trials_for_Jewish_Intellectuals_desc:0 "Notre glorieux leader a appris que de nombreux intellectuels juifs de renom collaborent avec des espions occidentaux afin de nuire à l'Union. Des procès spectaculaires provoqueraient trop de réactions négatives au niveau international, c'est pourquoi ces procès doivent rester secrets."
 STALIN_Arrest_Treasonous_Doctors_desc:0 "Notre système d'espionnage a eu vent d'un complot juif massif et répugnant : les médecins juifs de Moscou vont empoisonner le camarade Staline et de nombreux autres responsables du Parti communiste ! Nous devons agir avant qu'ils ne puissent mettre à exécution ce plan horrible."
 STALIN_Force_Berias_Withdrawal_desc:0 "Lavrentiy Beria, bien qu'il soit un homme de main utile, prêt à mettre en œuvre nos plans et nos purges, a récemment pris la grosse tête. Il est temps pour lui de se retirer."
 STALIN_Purge_Mingrelians_from_the_Georgian_Party_desc:0 "Dans le cadre d'une autre initiative visant à affaiblir Beria, nous allons nous attaquer à ses plus fervents partisans, le groupe ethnique géorgien des Mingréliens. Espérons qu'il comprendra enfin sa place après cela."
 STALIN_The_Soviet_Airforce_desc:0 "Notre armée de l'air a largement contribué à la victoire lors de la Grande Guerre patriotique, nos aviateurs intrépides ayant écrasé la Luftwaffe jusqu'à la soumission. Mais une nouvelle ère de l'aviation est arrivée, cette fois-ci propulsée par le moteur à réaction, et nous devons nous lancer à corps perdu dans cette nouvelle ère."
 STALIN_Expand_MiG_15_Production_desc:0 "La production en série du MiG-15, l'un des meilleurs avions de chasse à réaction que nos camarades scientifiques aient produits à ce jour, fera des merveilles pour les capacités de l'armée de l'air."
 STALIN_Develop_Sakhallin_Airfields_desc:0 "Les aérodromes de Sakhaline sont les plus grands de la région extrême-orientale de notre pays, mais ils restent malheureusement trop petits. Leur agrandissement nous sera très profitable."
 STALIN_Develop_the_Tu_16_desc:0 "Le Tu-16 est un projet de bombardier stratégique à réaction proposé par Tupolev Industries, qui semble très prometteur. Nous devrions autoriser la poursuite des travaux de recherche et développement."
 STALIN_Invest_in_Supersonic_Fighters_desc:0 "Les chasseurs supersoniques représentent l'avenir du combat aérien et nous ne pouvons pas nous permettre de prendre du retard dans ce domaine crucial."
 STALIN_The_Soviet_Army_desc:0 "La dernière fois que l'Armée rouge a combattu, c'était pour écraser la Wehrmacht et mettre Berlin à genoux, nous valant ainsi une gloire éternelle pendant la Seconde Guerre mondiale. Cependant, nous ne pouvons pas nous reposer sur nos lauriers, car la guerre est en constante évolution et nous devons nous aussi évoluer."
 STALIN_Begin_Mass_Production_of_the_T54_desc:0 "Le char de combat principal T-54 est notre dernier modèle de char de combat principal. Il est largement supérieur à tous les chars américains actuellement en production. Son déploiement dans toute notre armée renforcera notre avance technologique sur l'Occident."
 STALIN_Rapid_Adoption_of_the_AK47_desc:0 "L'AK-47 est la dernière création géniale de Mikhaïl Kalachnikov. C'est un magnifique fusil d'assaut au design innovant, mais dont la fabrication reste peu coûteuse. Nous devons commencer à le produire immédiatement."
 STALIN_Expand_the_VDV_desc:0 "La VDV est notre branche d'élite de parachutistes de l'armée. Bien que les tactiques et stratégies pour leur utilisation soient encore en cours d'élaboration, il est toujours bon d'avoir des soldats aéroportés à ses côtés."
 STALIN_Increase_Soviet_Air_Defense_Forces_desc:0 "Outre nos avions, les unités antiaériennes au sol sont également chargées de la défense de notre espace aérien. L'augmentation du nombre de ces unités renforcera à son tour notre capacité de défense."
 STALIN_The_Soviet_Navy_desc:0 "La marine soviétique est petite, faible et obsolète. Sans même un porte-avions à notre actif, nous ne pouvons espérer rivaliser avec les Américains en haute mer. Cependant, nous ne pouvons ignorer complètement nos flottes de surface et sous-marines."
 STALIN_Project_30bis_desc:0 "Le projet 30bis est le nom donné à un destroyer moderne haut de gamme qui améliorera considérablement les capacités d'escorte de notre marine, et nous devrions y investir massivement."
 STALIN_Modernize_the_Black_Sea_Shipyards_desc:0 "Si les chantiers navals sont nombreux sur la mer Noire, ils sont également assez vétustes et inefficaces. Cela doit changer, et rapidement."
 STALIN_Study_German_Submarine_Designs_desc:0 "À la fin de la Seconde Guerre mondiale, nous avons capturé plusieurs sous-marins allemands, ainsi que les chercheurs qui les avaient conçus. En étudiant la conception des U-Boots, nous pouvons améliorer notre propre flotte de sous-marins."
 STALIN_Ramp_Up_Submarine_Production_desc:0 "Les sous-marins sont notre seule chance d'infliger des dommages aux navires ou au transport maritime occidentaux si jamais nous entrions en conflit. Nous devons nous assurer que notre flotte est à la hauteur de la tâche."
 STALIN_Chase_the_Industrial_Power_Dream_desc:0 "Nous poursuivons depuis longtemps le rêve de devenir une puissance industrielle totalement autonome sur le plan économique et, grâce à nos efforts récents, nous sommes plus près que jamais d'atteindre cet objectif. Il est temps de prendre notre destin en main et de réaliser enfin nos rêves."
 STALIN_Direct_Intervention_desc:0 "Nous ne pouvons pas risquer que le régime de Kim Il Sung s'effondre sous la force d'une attaque de l'OTAN. Il n'y a pas de quoi plaisanter ici. Une intervention directe est bien préférable à un rôle plus passif."
 STALIN_Integration_of_the_Korean_Peninsula_desc:0 "Maintenant que nous avons vaincu les capitalistes lors de la guerre de Corée, il est temps que la RPDC rejoigne nos rangs et ceux de nos alliés au sein du Komintern."
 STALIN_Ensure_the_Survival_of_the_Kim_Regime_desc:0 "Maintenant que la guerre est finie, ce serait dommage de laisser le régime de Kim Il Sung s'effondrer et tous nos efforts partir en fumée. On doit assurer la survie de son gouvernement pour montrer à l'Occident qu'on est sérieux."
 KhrushchevGain:0 "Khrouchtchev va gagner en pouvoir et en influence au sein du Parti."
 KhrushchevLoss:0 "Khrouchtchev perdra considérablement son pouvoir et son influence au sein du Parti."
 BeriaGain:0 "Beria va gagner en pouvoir et en influence au sein du Parti."
 BeriaLoss:0 "Beria perdra considérablement son pouvoir et son influence au sein du Parti."
