 HUN_60s_Kadar_The_Sweet_60s_in_Hungary_desc:0 "Cela ne fait que quatre ans que la révolution a échoué, et bien que nous ayons déjà parcouru un long chemin, il nous reste encore beaucoup à faire. Les relations entre le parti et le peuple sont toujours tendues, nos forces armées sont pratiquement inexistantes, et nous ne savons toujours pas quelle orientation donner à notre économie ni à notre politique étrangère. Telles sont quelques-unes des nombreuses questions auxquelles nous devrons répondre au cours des prochaines années."
 HUN_60s_Kadar_Prepare_For_the_8th_Party_Congress_desc:0 "L'une de nos principales priorités est le 8e Congrès du Parti socialiste des travailleurs hongrois, qui se tiendra prochainement. Si nous ne voulons pas être distancés par nos alliés, nous devons confirmer notre stratégie actuelle et définir notre rôle non seulement au sein du Pacte de Varsovie, mais aussi sur la scène internationale."
 HUN_60s_Kadar_Reign_in_the_Paranoia_desc:0 "Depuis que les forces de maintien de la paix soviétiques ont réprimé la révolution manquée, les membres de notre parti agissent dans une paranoïa constante, craignant de faire quoi que ce soit ou d’apporter le moindre changement, hantés par la crainte infondée d’une seconde invasion. Si nous voulons accomplir quoi que ce soit, nous devons d’abord remédier à cela."
 HUN_60s_Kadar_Maintaining_Intra_Bloc_Relationships_desc:0 "Même si notre gouvernement existe depuis quatre ans maintenant, nous sommes encore relativement nouveaux sur la scène politique et nous devrions réévaluer et consolider nos relations avec nos voisins partageant les mêmes idéologies."
 HUN_60s_Kadar_The_Western_Question_desc:0 "Maintenant que nous avons assuré nos arrières à l'Est et que les Soviétiques sont apaisés, du moins pour l'instant, nous devons décider quelle sera notre politique vis-à-vis du monde occidental. Devons-nous suivre l'exemple de nos camarades d'Allemagne de l'Est, ou assouplir notre ligne de conduite ?"
 HUN_60s_Kadar_Re_Thinking_Our_Strategy_desc:0 "La violente levée de boucliers à laquelle nous avons été confrontés en 1956, bien qu’elle ait été réprimée, a montré que nous ne pouvons pas maintenir les mêmes vieilles politiques sans les modifier. Nagy, bien qu’il fût un traître contre-révolutionnaire, a conquis le cœur du prolétariat hongrois, et si nous voulons obtenir ne serait-ce qu’une fraction de son soutien, nous devons apporter de nouveaux changements."
 HUN_60s_Kadar_The_VIII_Party_Congress_desc:0 "Enfin, après tous nos préparatifs et les réformes prévues, l'heure du congrès a sonné. Maintenant que le moment est venu, exposons notre nouvelle stratégie réformée..."
 HUN_60s_Kadar_Initiate_Small_Scale_Liberalization_desc:0 "À y regarder de plus près, les réformes de Nagy n'étaient peut-être pas tout à fait infondées. Même si nous devons veiller à ne pas sombrer dans la corruption bourgeoise, bon nombre de nos mesures sont pour le moins excessives ; revenir sur certaines de nos politiques les plus extrêmes constituera une première étape importante pour garantir le soutien de la population à notre gouvernement."
 HUN_60s_Kadar_Declare_General_Amnesty_desc:0 "Dans le but de renforcer notre soutien populaire, nous entrerons inévitablement en conflit avec certains des membres les plus intransigeants et conservateurs de notre parti. Parallèlement, de nombreux réformateurs innocents ont été emprisonnés en raison de leurs liens avec le traître Nagy. Si nous faisons preuve de clémence envers nos anciens ennemis et que nous excluons les membres les plus intransigeants de notre parti, nous pourrons au moins consolider notre position en interne."
 HUN_60s_Kadar_Realigning_Our_Foreign_Policy_desc:0 "Maintenant que notre emprise au sein du parti est bien établie, nous pouvons aborder sérieusement la question de notre politique étrangère. Après tout, compte tenu de l'aggravation de notre déficit commercial et de la nécessité de financer les réformes que nous avons prévues, nous devons choisir vers qui nous tourner : nos alliés de l'Est, ou bien apaiser nos relations avec l'Occident… avec l'accord de l'Union soviétique, bien sûr."
 HUN_60s_Kadar_Curtail_the_Secret_Police_desc:0 "L'AVH d'après-révolution, bien qu'elle ait de nobles aspirations, est allée trop loin dans ses efforts pour empêcher une nouvelle révolution. Si nous voulons gagner le soutien du peuple, le fait de le surveiller de près avec acharnement ne fera qu'encourager de futures révoltes."
 HUN_60s_Kadar_Expanding_Goulash_Communism_desc:0 "Même si notre expérience du « communisme goulash » a été à la fois limitée et de courte durée, nous en constatons déjà les avantages. Compte tenu de ce potentiel prometteur, il est tout à fait naturel de se montrer plus ambitieux dans sa mise en œuvre, car elle contribuera sans aucun doute à garantir le soutien populaire au parti."
 HUN_60s_Kadar_Solidify_Eastern_Ties_desc:0 "S'il y a certes des avantages à se tourner vers l'Ouest, cela n'est pas raisonnable pour le moment. De nombreux membres du parti souhaitent solliciter l'Occident pour obtenir des prêts ou obtenir la pleine reconnaissance de l'ONU. Ces objectifs, bien que louables, ne profiteront pas à la Hongrie à long terme. Compte tenu de nos projets visant à augmenter les dépenses de consommation et d'une économie déjà déséquilibrée, la Hongrie n'a pas les moyens de rembourser des prêts. De plus, nous estimons qu'il est plus avantageux à long terme de renforcer nos relations avec des alliés non idéologiques. Cela dit, les réformes que nous prévoyons de mettre en œuvre risquent de susciter la colère de l'Union soviétique ; souhaitons-nous « titiller l'ours » si tôt, surtout avec une présence aussi importante de l'Armée rouge à l'intérieur de nos frontières ?"
 HUN_60s_Kadar_Expand_Soviet_Aid_desc:0 "Nos camarades de Moscou n’ont cessé de se montrer bienveillants à notre égard, qu’il s’agisse de nous libérer de la menace fasciste ou de réprimer les opportunistes bourgeois en 1956. À l’heure où nous cherchons à redynamiser nos relations avec le monde de l’Est, nous devrions faire appel à leur aide une fois de plus. Compte tenu de nos projets de réorganisation et de développement de notre économie, ainsi que de la nécessité de maintenir une situation financière stable pour soutenir nos plans visant à accroître les dépenses de consommation, Moscou devrait être plus qu’heureuse de nous aider une fois de plus, sans que nous ayons à craindre de susciter la colère si nous adressions la même demande à l’Occident."
 HUN_60s_Kadar_Expand_East_German_Trade_desc:0 "Nous ne sommes peut-être pas toujours d'accord avec nos alliés est-allemands, et nous ne pouvons pas non plus approuver tous leurs choix, parfois discutables ; mais ils n'en restent pas moins nos alliés. Sans compter que, même si leurs progrès économiques ne sont peut-être pas aussi solides ou efficaces qu'ils pourraient l'être, ils n'en restent pas moins admirables. Nous avons tout à gagner à renforcer nos liens économiques avec eux."
 HUN_60s_Kadar_Reinvigorate_Soviet_Trade_desc:0 "On ne saurait sous-estimer l'importance du commerce dans notre économie. Qu'il s'agisse d'importations ou d'exportations, on ne peut nier qu'une part significative de nos résultats financiers en découle. Cela dit, on ne peut pas faire comme si notre déficit commercial n'existait pas. Ayant déjà accepté de nous aider par le passé, malgré les coûts potentiels que cela implique, il serait insensé de leur part de ne pas voir les avantages mutuels à long terme. Si l'Union soviétique peut couvrir notre déficit commercial pendant que nous développons notre économie, nous pourrons éviter les complications liées à la recherche d'une aide occidentale, tout en apportant une solution temporaire à l'un de nos plus grands problèmes."
 HUN_60s_Kadar_Expand_Czechoslovakian_Trade_desc:0 "Même si nous n'avons pas toujours été d'accord, allant même jusqu'à nous affronter par le passé au sujet du territoire slovaque, la Hongrie et la Tchécoslovaquie se trouvent désormais toutes deux du même côté sur le champ de bataille. Étant donné qu'elles sont voisines directes, le fait d'entretenir des relations amicales et de renforcer leurs liens économiques réciproques pourrait leur apporter de grands avantages mutuels."
 HUN_60s_Kadar_Yesterdays_Foe_Todays_Friend_desc:0 "Dire que les relations entre la Hongrie et la Roumanie ont été tendues serait peut-être l'euphémisme le plus grand de la décennie. Cependant, la Hongrie entre dans une nouvelle ère, une ère de paix, du moins l'espérons-nous. Dans cette nouvelle ère, la Hongrie a de nouveaux alliés, et la Roumanie en fait partie. Si nous voulons être des alliés efficaces et explorer des solutions diplomatiques pour atteindre nos objectifs, nous ouvrirons la voie à un large éventail d'options qui étaient autrefois possibles. Même si nous ne devons pas en faire trop, nous devons tout de même faire les premiers pas en avant."
 HUN_60s_Kadar_Deepen_Polish_Trade_Ties_desc:0 "Les relations actuelles entre la Hongrie et la Pologne ont toujours été marquées par un esprit de compromis, surtout après la tragédie de la Seconde Guerre mondiale. Aujourd’hui, cependant, nous sommes unis en tant qu’amis, ou du moins, c’est ce qui est censé être le cas. Nous sommes tous deux confrontés à des problèmes économiques assez similaires, et nous avons tous deux beaucoup à gagner à travailler ensemble. Faisons ensemble les premiers pas vers la reprise."
 HUN_60s_Kadar_Pursue_Further_COMECON_Integration_desc:0 "Si nous voulons trouver une solution durable à notre déficit commercial, nous devons renforcer nos capacités de production ; mais dans le même temps, il est extrêmement difficile d’y parvenir si nous sommes constamment confrontés à des difficultés financières dues à ces déficits. Une intégration plus poussée au sein du COMECON nous offre une solution temporaire à ces deux problèmes, car nos alliés peuvent nous aider à combler nos déficits et nous apporter l’aide indispensable au développement de nos capacités de production. Nous ne pouvons pas compter éternellement sur le COMECON ; aussi agréable que cela puisse être, mais pour l'instant, c'est notre meilleure solution économique à long terme, même si ce n'est que temporairement."
 HUN_60s_Kadar_The_Ferryman_of_Europe_desc:0 "Il serait tout à fait insensé de prétendre que nous devons choisir entre l'Est et l'Ouest. Nous serons éternellement reconnaissants envers les Soviétiques pour ce qu'ils ont fait pour nous ; cependant, nous sommes confrontés à des problèmes urgents qu'il faut résoudre au plus vite. Si l'investissement et la gestion économiques à long terme constituent l'idéal, la Hongrie ne dispose pas actuellement des ressources nécessaires pour y parvenir, et nous ne pouvons pas attendre des Soviétiques qu'ils fassent tout à notre place. Cependant, si la Hongrie parvient à obtenir la reconnaissance de l'Occident, celui-ci pourra peut-être nous fournir une aide financière immédiate. Certes, nous courons le risque de tomber dans le piège de contracter trop de prêts ; mais, à condition d'investir judicieusement, la Hongrie sera tout à fait capable de les rembourser le moment venu, n'est-ce pas ?"
 HUN_60s_Kadar_Regain_Bloc_Normal_Status_desc:0 "Notre position au sein du Pacte de Varsovie et sur la scène internationale s'est considérablement affaiblie depuis la révolution hongroise. Nombreux sont ceux qui refusent même de reconnaître notre gouvernement à la suite de l'invasion soviétique. Si la Hongrie souhaite un jour retrouver une situation diplomatique normale et parvenir à combler le fossé entre l'OTAN et le Pacte de Varsovie, nous devons remédier à cette situation sans délai."
 HUN_60s_Kadar_Expand_Western_Diplomacy_desc:0 "La Hongrie ne cherche pas à s'occidentaliser, pas plus qu'elle ne cherche à abandonner ses alliés de l'Est, mais si nous voulons atteindre de nouveaux sommets, nous devons tendre la main aux deux côtés du monde. L'Europe de l'Est et l'Europe de l'Ouest sont peut-être divisées, mais cela ne signifie pas que nous ne pouvons pas franchir ce mur."
 HUN_60s_Kadar_Reassure_the_Soviets_desc:0 "Malgré nos ouvertures envers l'Occident, nous restons pleinement fidèles au camarade [SOV.GetLeader]. Si nous souhaitons développer nos relations économiques et diplomatiques avec l'Occident, nous assumons avec fierté le rôle de la Hongrie au sein du bloc de l'Est, et nous devons veiller à ce que les Soviétiques en soient bien conscients."
 HUN_60s_Kadar_Meet_with_De_Gaulle_desc:0 "Si la Hongrie souhaite consolider ses relations avec l'Occident, une rencontre avec De Gaulle contribuera grandement à asseoir notre légitimité tant aux yeux de l'Occident que de la France, et permettra, espérons-le, de jeter les bases d'une future coopération financière avec le bloc occidental."
 HUN_60s_Kadar_Start_Trading_With_the_West_desc:0 "Maintenant que la Hongrie a largement aplani ses différends avec le monde occidental, nous pouvons enfin commencer à lancer de nouvelles initiatives commerciales et à combler notre déficit. Même si la Hongrie risque de connaître des difficultés financières à long terme, nous serons, espérons-le, mieux armés pour y faire face qu'auparavant. Tout ce qui compte, c'est que les rayons des magasins soient bien approvisionnés et que nos industries disposent des ressources dont elles ont besoin, quelles qu'en soient les conséquences à long terme."
 HUN_60s_Kadar_Attempt_to_Soften_East_West_Relations_desc:0 "Ce n’est pas parce que la Hongrie cherche à resserrer ses liens avec le monde occidental qu’il faut pour autant priver nos alliés de l’Est de ces avantages. En réalité, tant l’Est que l’Ouest ont beaucoup à y gagner si nous parvenons à apaiser les tensions."
 HUN_60s_Kadar_Consider_Western_Loans_desc:0 "Avec le retour à la normale à l'Est en 1956, l'établissement de nouvelles relations avec l'Ouest et même la reconnaissance de la part des pays occidentaux, nous pouvons enfin mettre en place une solution provisoire pour faire face à l'augmentation de nos dépenses de consommation. Grâce aux prêts financiers occidentaux, la Hongrie peut non seulement maintenir son niveau de dépenses, mais aussi financer la poursuite de son développement économique. Nous serons certainement en mesure de rembourser ces prêts le moment venu, n'est-ce pas ?"
 HUN_60s_Kadar_Handle_Rising_Anti_Kadar_Sentiment_desc:0 "La dernière décennie a été tout simplement stupéfiante pour la Hongrie. Une libéralisation culturelle, une croissance économique sans précédent, auxquelles s’ajoute notre réussite à étouffer la dissidence et la colère issues de la révolution de 1956, qui a été écrasée. Cependant, tout n’est pas rose, car de nombreux membres du parti commencent à faire part de leurs inquiétudes."
 HUN_60s_Kadar_Address_Growing_Party_Unrest_desc:0 "Il semble que nous ayons largement sous-estimé le mécontentement que nos réformes ont suscité au sein du parti. La situation est bien plus grave que nous ne l'avions initialement prévu, et nous ne pouvons pas nous contenter d'espérer que cela s'arrange avec le temps. Kadar doit trouver une solution, et vite."
 HUN_60s_Kadar_The_Remaining_Hardliners_desc:0 "L'ancien ministre de l'Intérieur, Bela Biszku, continue d'exercer une influence considérable au sein du parti, s'étant fait connaître pour la rapidité et l'efficacité avec lesquelles il a réprimé les dissidents après la Révolution ; il a même occupé le poste de vice-Premier ministre de 1961 à 1962. Malgré cela, il n'est peut-être pas aussi digne de confiance qu'on le pensait au départ."
 HUN_60s_Kadar_Attempt_to_Cement_Kadars_Authority_desc:0 "Pour assurer la stabilité du gouvernement et apaiser l'opposition, nous devons réaffirmer le rôle du parti dans la société hongroise. Étant donné que l'essentiel de notre opposition provient des conservateurs et des partisans de la ligne dure, nous pourrions peut-être les apaiser temporairement, avant de les éliminer complètement."
 HUN_60s_Kadar_Promote_Reformers_to_High_Party_Positions_desc:0 "Même si nous nous sommes débarrassés de la plupart des partisans de la ligne dure au sein du parti dans les années 1960, il reste encore suffisamment de conservateurs pour rendre la transition vers notre nouvelle doctrine d'autant plus difficile. Nous pourrions peut-être sortir de cette impasse en les remplaçant par des réformistes plus fidèles."
 HUN_60s_Kadar_A_Letter_to_the_Soviets_desc:0 "Bela Biszku, ancien ministre de l’Intérieur et autrefois bras droit de Kadar, a été de fait rétrogradé et disgracié. Cela dit, son influence n’a pas diminué, et nous ne pouvons pas non plus simplement l’exclure du parti ou l’arrêter, compte tenu de la levée de boucliers à laquelle nous nous exposerions au sein du parti, sans parler du fait que cela compromettrait notre nouvelle orientation. Biszku n'a pratiquement aucune capacité d'influencer notre politique, nous pouvons donc le laisser tranquille pour l'instant... bien que les services de renseignement hongrois aient déterminé qu'il échangeait des lettres avec Moscou... ce n'est certainement pas inquiétant, n'est-ce pas ? N'est-ce pas ?"
 HUN_60s_Kadar_Rethinking_Military_Strategy_desc:0 "Si notre histoire militaire est certes riche et passionnante, depuis les Magyars du Moyen Âge jusqu’à l’héritage durable de l’Autriche-Hongrie, en passant par nos forces armées pendant la Seconde Guerre mondiale, les temps ont changé, tout comme les besoins de la Hongrie. Pourquoi continuer à puiser dans nos caisses déjà vides pour financer quelque chose dont nous n’avons tout simplement pas besoin ?"
 HUN_60s_Kadar_Reduce_Military_Expenditures_desc:0 "Nos frères de Moscou assurent déjà la défense des frontières orientales face à l'OTAN et à la Yougoslavie, tandis que la Hongrie est entourée d'alliés de tous côtés. Même si nous n'avons pas besoin de démilitariser complètement le pays, nos ressources financières seront mieux utilisées ailleurs."
 HUN_60s_Kadar_Shifting_Our_Resources_desc:0 "Grâce aux ressources considérables désormais libérées du contrôle militaire, nous pouvons les réinvestir dans notre économie. La Hongrie n'a toujours pas résolu son déficit commercial et doit trouver des moyens de soutenir la consommation. De plus, une fois que nous aurons réussi à restructurer notre économie, nous pourrons toujours réinvestir nos ressources ultérieurement."
 HUN_60s_Kadar_Join_the_Soviets_in_Prague_desc:0 "Nos camarades tchèques ont commis la même erreur que le traître Imre Nagy il y a près d’une décennie, et la Hongrie ne peut tout simplement pas laisser passer cela. De plus, notre politique repose sur une loyauté totale envers l’Union soviétique, en échange d’une relative liberté dans la gestion de nos affaires intérieures, et nous ne sommes pas prêts à prendre le risque de violer cet accord ou de provoquer une nouvelle invasion."
 HUN_60s_Kadar_Increase_Soviet_Reliance_desc:0 "Un jour, la Hongrie pourra compter sur ses propres forces armées, et un jour, nous pourrons apporter une contribution militaire significative au Pacte de Varsovie. Mais ce jour n’est pas encore venu, et nous devons absolument nous concentrer sur l’économie civile. Étant donné que les forces militaires soviétiques sont déjà fortement implantées dans tout le pays, nous devrions continuer à compter sur elles pour assurer notre protection durant cette phase cruciale de restructuration."
 HUN_60s_Kadar_Rely_on_Soviet_Designs_desc:0 "Au cours des années 1930 et 1940, la Hongrie était en mesure de concevoir et de développer ses propres modèles. Dès l'époque austro-hongroise, nous avions déjà élaboré des concepts et des prototypes de nouveaux chars et de nouvelles armes. Les temps ont toutefois changé, et alors que notre industrie militaire continue de passer au second plan, nous devons compter sur nos camarades soviétiques pour nous fournir des armes et des véhicules. De plus, le partage de nos conceptions renforcera la cohésion avec nos alliés."
 HUN_60s_Kadar_Continue_Using_Soviet_Weapons_desc:0 "Certes, nous disposons d'une petite base de production, mais celle-ci est loin d'être suffisante pour équiper à elle seule une armée, même si nous réduisons nos effectifs. Cependant, non seulement nos frères de Moscou possèdent un armement fiable, mais ils sont prêts à le partager avec nous, même s'il est un peu dépassé."
 HUN_60s_Kadar_Buy_Into_Soviet_Armor_Development_desc:0 "Si nous cherchons à réduire les effectifs de notre armée tout en continuant à dépendre des Soviétiques pour notre armement, qu'est-ce qui nous fait croire qu'il est possible de produire nos propres chars ? Bien qu'il s'agisse d'un objectif à long terme vers lequel tendre, cela n'est tout simplement pas possible pour l'instant. De plus, le fait d'utiliser les mêmes chars que les Soviétiques nous permettra de les réparer et de les remettre en état beaucoup plus rapidement, tout en sollicitant moins notre industrie."
 HUN_60s_Kadar_Expand_Our_Air_Bases_desc:0 "Comme nous l'avons déjà déclaré, la Hongrie ne vise pas une démilitarisation totale, mais seulement une réduction temporaire de ses effectifs. Cela dit, cela ne signifie pas que nous ne pouvons pas innover et nous développer en même temps. Tout en réduisant nos forces terrestres, nous pouvons toujours renforcer nos forces aériennes. Il sera bien plus simple de maintenir une force aérienne qu'une force terrestre importante, et cela s'avérera probablement plus utile à long terme. De plus, nous sommes certains que le camarade [SOV.GetLeader] sera satisfait de bases de première ligne de meilleure qualité."
 HUN_60s_Kadar_Bolster_Domestic_Forces_desc:0 "Si nous accordons désormais davantage d'importance au marché intérieur, cela ne signifie pas pour autant que nous ne pouvons pas en tirer parti au profit de l'armée. L'industrie militaire recèle un potentiel de rentabilité, mais aussi des avantages à long terme et des opportunités d'emploi. Nous pouvons réaffecter une partie des fonds que nous aurions consacrés au financement de nos forces armées au développement de notre industrie lourde, afin d'en tirer des avantages à plus long terme."
 HUN_60s_Kadar_Rebuilding_Our_Air_Force_desc:0 "Laissée pour l'essentiel à prendre la poussière et à se dégrader, l'armée de l'air de l'Armée populaire hongroise n'a été qu'une véritable farce depuis les événements de 1956. Alors que nous réduisons nos effectifs terrestres, nous devrions nous concentrer sur la modernisation de notre armée de l'air, car plus nous attendrons, plus cela sera coûteux et difficile à l'avenir."
 HUN_60s_Kadar_Utilize_Soviet_Jet_Technology_desc:0 "Malheureusement, contrairement aux États-Unis et à l'Union soviétique, la Hongrie n'a jamais été à la pointe de la technologie des avions à réaction modernes. Cela ne doit toutefois pas nous servir de prétexte pour rester les bras croisés et renoncer à innover. Si nous ne disposons pas d'une base locale sur laquelle nous appuyer, Moscou, elle, en a une. Nous pouvons tirer des enseignements de leur technologie, en faire profiter nos propres scientifiques et, à l'avenir, mettre en place notre propre centre de recherche."
 HUN_60s_Kadar_Develop_Hungarian_MIG_19s_desc:0 "Nos recherches nous ont beaucoup appris et nous ont fourni une base solide et fiable, bien que temporaire, pour notre nouvelle force aérienne. Le MiG-19, même s'il n'est pas l'appareil le plus original, est assez moderne et constituera un pilier temporaire de choix pour notre force aérienne."
 HUN_60s_Kadar_Receive_Czech_IL_28s_desc:0 "La technologie des avions polyvalents et des intercepteurs diffère considérablement de celle des bombardiers. Même si cela a toujours été le cas et que c'est une évidence, nous ne disposons toujours pas de base propre sur laquelle nous appuyer, et la Hongrie ne peut pas se contenter de courir à Moscou pour résoudre tous ses problèmes. En revanche, nos camarades tchèques semblent bien maîtriser la situation. Peut-être seraient-ils disposés à nous donner un coup de main ?"
 HUN_60s_Kadar_Further_Expanding_Air_Force_Bases_desc:0 "À quoi sert une armée de l'air modernisée si nous n'avons nulle part où déployer nos avions dans notre propre pays ? Sans compter que la Hongrie fait partie de la ligne de front du Pacte de Varsovie contre l'agression occidentale. Si nous voulons tirer parti des progrès réalisés jusqu'à présent, nous devons leur consacrer suffisamment d'espace pour leur stockage et leur utilisation."
 HUN_60s_Kadar_Form_Magyar_Aviation_Clubs_desc:0 "Apprendre à concevoir et à construire de nouveaux modèles d'avions est une bonne chose et constitue une étape importante dans la modernisation de notre armée de l'air, mais à quoi cela sert-il si nos pilotes ne savent pas piloter ces appareils ? Si nous élargissons la portée et le financement des aéroclubs, cela devrait permettre aux pilotes hongrois de rester à la pointe des doctrines et des technologies actuelles."
 HUN_60s_Kadar_Innovate_Anti_Air_Technology_desc:0 "Tout comme les avions ont évolué, les moyens de les abattre ont eux aussi changé. L'époque des canons antiaériens et des tours fortifiées est révolue. Si nous voulons éviter que nos villes ne soient détruites dès la première vague de bombardements de l'OTAN, la Hongrie doit se moderniser au même rythme que le reste du monde."
 HUN_60s_Kadar_Reinforce_the_Gyor_Air_Base_desc:0 "Même si notre ligne de front n'est pas aussi cruciale que celle des Allemands de l'Est ou des Tchèques, nous faisons néanmoins partie intégrante de la ligne de front du Pacte de Varsovie. À ce titre, si cette guerre froide venait à dégénérer en conflit ouvert, nous devons nous assurer d'être aussi bien préparés que possible pour faire face à toute menace. L'augmentation de la capacité d'accueil de nos aérodromes de Győr pour les pilotes soviétiques et la modernisation de nos installations radar contribueront grandement à renforcer notre position."
 HUN_60s_Kadar_Import_the_Strela_desc:0 "Tout comme les moyens antiaériens fixes ont évolué, les systèmes antiaériens mobiles ont eux aussi changé. Si la Hongrie souhaite rester dans la course, nous devrions une fois de plus nous tourner vers Moscou. Le 9K31 Strela est un véhicule tout à fait impressionnant : suffisamment léger et rapide pour permettre un déploiement aisé de nos unités existantes, il devrait être suffisamment inoffensif pour que les Soviétiques nous en prêtent quelques-uns."
 HUN_60s_Kadar_Pursue_Helicopter_Innovations_desc:0 "L'hélicoptère est un élément relativement récent dans les armées modernes. S'il est encore bien trop tôt pour savoir quel rôle il jouera dans la guerre moderne, et a fortiori au sein de notre armée, la Hongrie devrait prendre les devants et l'étudier tant que nous le pouvons, afin de ne pas avoir à courir après le temps à l'avenir."
 HUN_60s_Kadar_Bring_the_Mi_4_to_Hungary_desc:0 "Si la Hongrie souhaite réellement étudier les hélicoptères, il nous faut avant tout un véritable hélicoptère sur lequel travailler. Même si nous ne pouvons pas prétendre demander à nos alliés de nous fournir les modèles les plus récents, le Mi-4 fera très bien l'affaire. Après tout, il s'agit uniquement d'études et de développements futurs, et non d'une utilisation au combat."
 HUN_60s_Kadar_Develop_Aerial_Transport_Capabilities_desc:0 "Au cours de nos études, nous avons pris conscience de l'incroyable potentiel des hélicoptères, qui permettent non seulement d'approvisionner nos unités, mais aussi de les transporter rapidement d'un champ de bataille à l'autre. Dans la situation actuelle, une armée réduite et mobile est non seulement idéale, mais c'est aussi tout ce que nous pouvons nous permettre. Nous ne devons pas perdre de temps pour adapter notre doctrine à cette découverte."
 HUN_60s_Kadar_The_Unexpected_Cultural_Impacts_of_Goulash_Communism:0 "Le « communisme goulash » avait pour but de réformer rapidement notre économie et notre vie politique, à la fois pour moderniser notre nation et réparer les dégâts causés par Nagy, mais aussi pour accorder à notre peuple davantage de droits et de libertés, conformément à ce qu’a décrété le camarade [SOV.GetLeader]. Cependant, cela a eu des effets secondaires bienvenus, mais inattendus, sur notre culture dans son ensemble."
 HUN_60s_Kadar_Unequal_Inequality_desc:0 "Dans un État qui prône l'unité, l'égalité et le progrès, il n'est pas difficile de constater que certains sont plus égaux que d'autres. Les appels de plus en plus nombreux lancés par les homosexuels, ainsi que ceux en faveur du droit de vote des femmes, résonnent à travers tout le pays, même s'ils restent encore peu nombreux. Quoi qu'il en soit, nous ne pouvons pas simplement ignorer la question et la remettre à plus tard ; il faut y remédier immédiatement."
 HUN_60s_Kadar_The_Debate_of_Hungarian_Suffrage_desc:0 "Le rôle des femmes dans la société hongroise est indéniable. Cependant, ce rôle est très controversé ; historiquement, les femmes n’étaient que des mères, rien de plus. Mais aujourd’hui, nous sommes une société moderne et n’avons plus besoin de lois aussi archaïques, surtout en tant qu’État socialiste. Mais voulons-nous vraiment bouleverser un système qui fonctionne ?"
 HUN_60s_Kadar_Magyar_Mothers_Nothing_More_desc:0 "Nos ancêtres avaient peut-être raison : des femmes à l'usine ? Comment avons-nous pu ne serait-ce qu'envisager une telle idée ? La place des femmes dans la société révolutionnaire est au foyer. Notre révolution est celle des travailleurs, et une femme ne peut pas être une travailleuse."
 HUN_60s_Kadar_An_Equal_Counterpart_desc:0 "Nous ne sommes plus dans les années 1940, et encore moins dans les années 1950. Notre peuple aspire à la liberté et à l'égalité, et en tant que communistes, il est de notre devoir de lui offrir cela. Nos femmes font tout autant partie du prolétariat que les hommes, et nous devons les reconnaître comme telles."
 HUN_60s_Kadar_In_the_Home_and_the_Factory_desc:0 "Comme tous nos travailleurs, les femmes ont des responsabilités non seulement à la maison, mais aussi sur leur lieu de travail. Si nous voulons leur donner les moyens d’agir, nous devons les aider à trouver un emploi. Même si cela peut paraître peu conventionnel ailleurs, notre secteur ne devrait avoir aucune difficulté à embaucher des hommes comme des femmes."
 HUN_60s_Kadar_New_Protections_for_Women_desc:0 "Nous en avons assez de nous contenter de belles paroles ; il est enfin temps de consacrer officiellement les droits des femmes au même titre que ceux des hommes, en tant que partenaires égaux tant dans la révolution que devant la loi."
 HUN_60s_Kadar_The_Mothers_of_Our_Workers_desc:0 "Même si elles ne sont pas elles-mêmes des ouvrières, les femmes jouent un rôle tout aussi important dans notre société (du moins, c’est ce qu’on leur dit). Il n’y a rien de plus important que de mettre au monde un enfant, surtout un enfant qui rejoindra un jour le prolétariat. Comment une femme pourrait-elle être mère si elle peine à l’usine ?"
 HUN_60s_Kadar_Repeal_Old_Legislation_desc:0 "Nous n'avons jamais été à l'avant-garde de l'égalité des sexes, mais nous sommes toujours soumis à une législation obsolète qui fait obstacle à nos objectifs finaux. Même si beaucoup nous jugent cruels, voire dépassés, la suppression de certaines libertés est en réalité dans leur intérêt, même s'ils ne s'en rendent pas encore compte."
 HUN_60s_Kadar_Queer_Magyars_desc:0 "Tout comme pour la condition des femmes dans notre société, ceux qui s’identifient comme queer, bien qu’ils ne soient en aucun cas majoritaires, existent bel et bien au sein de notre République populaire. La plupart des pays les condamnent, et même si nous n’avons aucune raison de le faire, après tout, un prolétariat queer n’en reste pas moins un prolétariat. Mais devons-nous vraiment nous en préoccuper ? Est-ce vraiment si important ?"
 HUN_60s_Kadar_Maintain_the_Database_desc:0 "Nous n'avons aucune sympathie pour le gouvernement pro-allemand de la fin des années 1930 et du début des années 1940. Cependant, celui-ci disposait d'outils utiles, comme le « fichier des homosexuels », qui servait à recenser les homosexuels et les personnes jugées « indésirables » en raison de leur orientation sexuelle. Même si nous ne l'utiliserons pas pour traquer ou poursuivre les homosexuels identifiés, nous devrions le conserver."
 HUN_60s_Kadar_A_United_Hungary_desc:0 "Hétéro ou gay, quelle importance ? Un ouvrier est un ouvrier, un agriculteur est un agriculteur, et un communiste est un communiste, quelle que soit leur orientation sexuelle. Ce serait faire preuve d'une hypocrisie totale et une véritable parodie de justice que de ne pas reconnaître cela."
 HUN_60s_Kadar_Destroy_the_Database_desc:0 "Nous ne voulons plus rien avoir à faire avec l'ancien gouvernement. Un gouvernement responsable de tant de douleur, de souffrance et de morts avant l'avènement de notre glorieuse République populaire. L'un des outils qu'il a utilisés pour nous persécuter était la base de données sur les homosexuels. Cette base de données n'a pas sa place dans la société magyare moderne et aurait dû être détruite il y a des années."
 HUN_60s_Kadar_The_Full_Legalization_of_Hungarian_Homosexuality_desc:0 "Nous avons fait de grands progrès et remporté quelques victoires pour nos camarades queer. Maintenant que la base de données a été supprimée, il est grand temps de garantir officiellement l'égalité à nos camarades queer, non seulement en paroles, mais aussi en droit."
 HUN_60s_Kadar_Traditional_Hungarian_Sexual_Values_desc:0 "Tout va bien, et même si nous détestons nos anciennes habitudes, la société était stable, et après l'échec de la contre-révolution de 1956, c'est exactement ce dont nous avons besoin aujourd'hui. Peut-être, juste peut-être, qu'un jour cela changera, mais pour l'instant, la stabilité est la priorité, et nous ne pouvons pas changer ce qui fonctionne pour un si petit groupe de personnes."
 HUN_60s_Kadar_Ignore_Growing_Dissent_desc:0 "Nous sommes bien loin des méthodes de Rakosi et de sa brutalité. Notre refus de mener des réformes a provoqué de nombreux troubles, mais une répression sévère ne ferait qu’aggraver notre situation. Nous essayons de prendre nos distances par rapport à la politique d’avant la révolution et de construire un véritable socialisme hongrois. Nous pouvons donc, pour l’instant, fermer les yeux sur les manifestations et les émeutes…"
 HUN_60s_Kadar_A_Hungarian_Musical_Golden_Age_desc:0 "Les technologies de communication ne cessent de s'améliorer avec le temps, et même si nos camarades soviétiques maîtrisaient l'art de la propagande tant au cinéma qu'à la radio, nous ne devons pas nous permettre de prendre du retard."
 HUN_60s_Kadar_Magyar_Radio_Es_Televizio_desc:0 "On peut sans exagération affirmer que nous ne sommes pas le pays le plus moderne. Mais cela ne signifie pas pour autant que nous ne pouvons pas nous efforcer de progresser. Même si cela implique de grandes responsabilités, pourquoi ne pas commencer modestement, au sein même des foyers de notre population ?"
 HUN_60s_Kadar_Our_First_Colored_Broadcast_desc:0 "Le monde regorge de couleurs, et il doit en être de même pour nos téléviseurs. Il n'est pas vraiment controversé d'affirmer que la Hongrie est à la traîne par rapport à une grande partie de l'Europe, et que chaque petit pas compte ; c'est pourquoi la diffusion de programmes télévisés en couleur constitue une avancée cruciale."
 HUN_60s_Kadar_Establish_MTV_Archives_desc:0 "L'histoire de la télévision constituera sans aucun doute un élément important de notre culture, sur lequel nous pourrons nous pencher dans de nombreuses années. Alors pourquoi ne pas commencer à l'archiver dès maintenant ?"
 HUN_60s_Kadar_Rural_Television_desc:0 "Si nous voulons être un véritable gouvernement du peuple, cela vaut aussi pour les paysans. Bien qu'ils soient généralement plus conservateurs, nous pouvons toujours les faire évoluer petit à petit en leur offrant non seulement des services de base, mais aussi la vérité, par le biais de la télévision."
 HUN_60s_Kadar_Magyar_Rock_and_Roll_desc:0 "La musique est une chose absolument merveilleuse. Alors que nos alliés répriment les styles occidentaux, qu'est-ce qui nous empêche de l'adopter et de l'utiliser à nos propres fins ?"
 HUN_60s_Kadar_Consumerism_In_Our_Music_desc:0 "Nos politiques, tant sur le plan culturel qu'économique, ont entraîné des effets secondaires quelque peu étranges, même s'ils ne sont pas pour autant indésirables. Le consumérisme joue désormais un rôle imprévisible dans le développement de notre nouvelle culture révolutionnaire, et il a également trouvé sa place dans notre musique."
 HUN_60s_Kadar_Education_Through_Media_desc:0 "L'éducation est au cœur de la construction d'une société communiste durable. Bien qu'il soit évidemment impossible de forcer les ouvriers à aller à l'école ou les agriculteurs à suivre des cours, nous pouvons néanmoins leur donner un coup de main, par le biais de nos médias."
 HUN_60s_Kadar_Adapt_Western_Advertisement_Methods_desc:0 "La publicité joue un rôle absolument essentiel dans le fonctionnement du système capitaliste. Même si nous devons veiller à ne pas adopter une idéologie aussi néfaste, cela ne signifie pas pour autant que nous ne pouvons pas utiliser les méthodes occidentales pour atteindre nos propres objectifs."
 HUN_60s_Kadar_Enshrine_Sellars_desc:0 "Dans les pays capitalistes, les commerçants ne sont rien d’autre que des instruments de la bourgeoisie ; en Hongrie, ce sont de simples intermédiaires qui permettent à la population d’accéder aux biens de première nécessité. Ce rôle doit être préservé et respecté."
 HUN_60s_Kadar_Expand_Capacity_of_Schools_desc:0 "Veiller à la prise de conscience de classe devrait être l'une de nos principales priorités dans la construction du socialisme en Hongrie. De plus, l'éducation de notre peuple est un objectif que nous ne pouvons tout simplement pas ignorer ; peut-être pourrions-nous faire d'une pierre deux coups..."
 HUN_60s_Kadar_Stay_the_Course_desc:0 "Dans la perspective d'une prise de conscience de classe, il est indispensable de préserver l'éducation idéologique et la vérité juste du réalisme socialiste. L'éducation idéologique est un pilier fondamental que nous ne pouvons ignorer, et encore moins remplacer."
 HUN_60s_Kadar_Ideology_Doesnt_Belong_In_the_Classroom_desc:0 "Il existe d'autres moyens de développer la conscience de classe. Après tout, il suffit amplement de continuer à assurer et à améliorer la qualité de vie de notre peuple. Nous devrions nous en tenir strictement au programme scolaire et en exclure toute considération politique."
 HUN_60s_Kadar_Mold_the_Workers_of_Tomorrow_desc:0 "Si nous voulons assurer la pérennité de notre pouvoir, notre meilleur allié à long terme est la jeunesse. Si elle ne nous soutient pas, elle causera notre perte à l'avenir. Nous devons la former dès que possible et, par conséquent, nous devons mettre en œuvre notre politique éducative, de préférence le plus tôt possible."
 HUN_60s_Kadar_Expand_Technical_and_Vocational_Education_desc:0 "Si nous voulons réaliser des progrès durables dans l'affirmation du socialisme en Hongrie, nous devons veiller à ce que les jeunes acquièrent les compétences pratiques et indispensables dont ils auront besoin lorsqu'ils entreront sur le marché du travail."
 HUN_60s_Kadar_Force_Peasants_Into_the_Classroom_desc:0 "Ce ne sont pas seulement les ouvriers industriels, les futurs scientifiques ou les futurs soldats que nous devons éduquer, mais aussi les paysans. Même si nous ne voulons pas toujours l'admettre et même si nous nous débarrasserons un jour de ces principes rétrogrades, ils constituent toujours une partie essentielle de notre population que nous ne pouvons ignorer. Les faire entrer dans les salles de classe est le premier pas vers le progrès."
 HUN_60s_Kadar_Fund_Comprehensive_Engineering_Education_desc:0 "Si les travailleurs d'aujourd'hui constituent notre présent et notre prolétariat immédiat, la jeunesse est quant à elle le prolétariat de demain. Si nous voulons réussir à long terme, nous ne pouvons pas nous contenter de consacrer toute notre énergie à l'un de ces groupes seulement ; nous devons veiller à ce que nos enfants bénéficient d'autant d'attention que nos travailleurs adultes."
 HUN_60s_Kadar_Recruit_Soviet_Professors_desc:0 "Nous n'avons pas toujours envie d'admettre que nous avons besoin d'aide, mais si nous voulons que nos ambitieux projets éducatifs se concrétisent, nous devons reconnaître nos lacunes en matière de dotation en personnel pour nos nouvelles salles de classe. Qui mieux que ceux qui nous ont sauvés de la contre-révolution pourrait-on solliciter pour obtenir cette aide ?"
 HUN_60s_Kadar_Introduce_Russian_Language_Studies_desc:0 "Beaucoup ne voient peut-être pas l'utilité immédiate d'étudier le russe. Si nous voulons que nos travailleurs réussissent dans la sphère soviétique ou s'épanouissent dans un monde dominé par l'Union soviétique, nous devons d'abord nous assurer que nos concitoyens sont capables d'y travailler, même si cela implique d'apprendre une ou deux nouvelles langues."
 HUN_60s_Kadar_Examine_Household_Goods_Availability_desc:0 "Alors que nous poursuivons la marchandisation croissante de notre économie, les produits de luxe de base constituent un aspect important de cet objectif. Notre gouvernement n'est peut-être pas très populaire pour l'instant, mais nous pouvons très facilement changer cela."
 HUN_60s_Kadar_Hungarian_Games_For_Hungarian_Families_desc:0 "Un aspect essentiel pour garantir la popularité de notre gouvernement populaire consiste à assurer le bonheur de notre peuple. Notre gouvernement s'engage à améliorer le sort du prolétariat, et cela ne se limite pas au lieu de travail."
 HUN_60s_Kadar_The_Role_of_Commodities_in_Socialist_Society_desc:0 "La production marchande selon les méthodes capitalistes est une forme d'exploitation qui n'a pas sa place dans un pays moderne du XXe siècle. Cela ne vaut toutefois pas pour toutes ses formes. La solution réside sans aucun doute dans une approche socialiste de la production et de la distribution des marchandises."
 HUN_60s_Kadar_Made_in_Hungary_desc:0 "À mesure que notre secteur de la consommation se développe, seuls les grands puissances de notre époque peuvent rivaliser avec notre niveau de qualité et notre volume de production. Nous ne devons pas laisser passer cette occasion et devons faire connaître notre succès au-delà de nos frontières."
 HUN_60s_Kadar_Magyar_Cultural_Exports_desc:0 "Nous n'exportons pas seulement des produits et des ressources. Très peu de gens connaissent, et encore moins se soucient, du sort du socialisme hongrois ; et si nous voulons obtenir l'approbation et la reconnaissance tant de l'Est que de l'Ouest, nous n'avons d'autre choix que d'agir."
 HUN_60s_Kadar_Household_Radios_and_Televisions_desc:0 "Contrairement à certains de nos homologues socialistes, nous ne nous faisons aucune illusion quant à la modernité. Nous sommes conscients de notre retard, même par rapport à certains pays occidentaux moins développés. Cela ne signifie pas pour autant que nous ne pouvons pas nous employer à changer cette situation, et une étape importante consiste à garantir aux ménages un accès régulier aux technologies civiles de base."
 HUN_60s_Kadar_Import_the_Volga_desc:0 "Même si notre objectif final est de développer notre propre industrie automobile, nous devons veiller à ce que nos concitoyens puissent disposer de véhicules jusqu’à ce que cela soit fait. Les voitures de la gamme soviétique « Volga » sont des véhicules solides et fiables qui peuvent offrir bien plus qu’une simple solution provisoire."
 HUN_60s_Kadar_Import_East_German_Cars_desc:0 "L'Allemagne de l'Est est un pays qui connaît des difficultés tout aussi grandes, voire plus grandes, que les nôtres. Cela ne signifie toutefois pas qu'elle n'ait rien fait de bien, notamment dans le domaine automobile. Peut-être pourrions-nous en tirer un bénéfice mutuel et, petit à petit, réduire notre déficit commercial sans cesse croissant en collaborant avec notre frère socialiste."