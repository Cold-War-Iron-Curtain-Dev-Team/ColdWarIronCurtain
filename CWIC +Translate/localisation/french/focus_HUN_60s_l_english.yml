 HUN_Agrarian_Reform_Decisions_OTL_desc:0 "Malgré ses détracteurs, la collectivisation a connu un relatif succès en Hongrie.  Bien qu'elle ait suscité la controverse au sein de notre peuple et qu'elle soit encore loin d'être optimale, l'abandonner serait purement et simplement une grave erreur. Ceci étant dit, nous devons à la fois l'étendre et la réformer si nous voulons vraiment qualifier notre collectivisation de réussite.  Avec la campagne sur les terres vierges en URSS, quel meilleur moment que maintenant ?"
 HUN_Agrarian_Reform_Decisions_ATL:0 "Réformer l'agriculture"
 HUN_Agrarian_Reform_Decisions_ATL_desc:0 "La collectivisation agricole traditionnelle est inefficace, and complètement incompatible avec les objecitfs à long terme du socialisme du Goulash. Alors que nous continuons de réformer notre industrie et d'autres secteurs de notre économie, nous devons consacrer une attention similaire à l'agriculture.  Si la dé-collectivisation nous apportera du soutien de la part des agricultueurs, nous devons néanmoins veiller à ce que les agricultueurs puissent se débrouiller et à ce que la population soit nourrie."
