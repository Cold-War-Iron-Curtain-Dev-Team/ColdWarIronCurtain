 FRE_Mission_De_Lattre_Arrival_Available_tt:0 "Mission Success Factors:\n• Political Power: 50+ PP (+6%), 100+ PP (+6%), 150+ PP (+6%)\n• Stability: 25%+ (+5%), 40%+ (+5%), 55%+ (+5%)\n• War Support: 20%+ (+3%), 35%+ (+4%), 50%+ (+3%)"
 FRE_Mission_Prepare_Na_San_Available_tt:0 "Mission Success Factors:\n• Political Power: 50+ PP (+5%), 100+ PP (+5%), 150+ PP (+5%)\n• Stability: 25%+ (+4%), 40%+ (+4%), 55%+ (+4%)\n• Infantry Equipment: 10k+ (+6%), 25k+ (+6%), 50k+ (+6%)\n• Support Equipment: 500+ (+4%), 1500+ (+4%)\n• Army Experience: 25+ (+3%), 50+ (+2%)"
 FRE_Mission_Prepare_Vinh_Yen_Available_tt:0 "Mission Success Factors:\n• Political Power: 50+ PP (+5%), 100+ PP (+5%), 150+ PP (+5%)\n• Stability: 25%+ (+4%), 40%+ (+4%), 55%+ (+4%)\n• Infantry Equipment: 10k+ (+6%), 25k+ (+6%), 50k+ (+6%)\n• Support Equipment: 500+ (+4%), 1500+ (+4%)\n• Army Experience: 25+ (+3%), 50+ (+2%)"
 FRE_Mission_Prepare_Mao_Khe_Available_tt:0 "Mission Success Factors:\n• Political Power: 50+ PP (+5%), 100+ PP (+5%), 150+ PP (+5%)\n• Stability: 25%+ (+4%), 40%+ (+4%), 55%+ (+4%)\n• Infantry Equipment: 10k+ (+6%), 25k+ (+6%), 50k+ (+6%)\n• Support Equipment: 500+ (+4%), 1500+ (+4%)\n• Army Experience: 25+ (+3%), 50+ (+2%)"
 FRE_Trade_PP_For_Equipment:0 "Purchase Equipment with Political Capital"
 FRE_Trade_PP_For_Equipment_desc:0 "Use political influence to acquire basic infantry equipment from French suppliers. Requires 50 PP and grants 5,000 units of equipment. A modest procurement option when immediate supplies are needed."
 FRE_Trade_PP_For_Support_Equipment:0 "Purchase Support Equipment with Political Capital"
 FRE_Trade_PP_For_Support_Equipment_desc:0 "Use political influence to acquire support equipment for your forces. Requires 50 PP and grants 1,000 units. Essential for maintaining proper logistics and unit effectiveness."
 FRE_Trade_Stability_For_War_Support:0 "Rally Public Support"
 FRE_Trade_Stability_For_War_Support_desc:0 "Launch a propaganda campaign to boost public support for the war effort. Requires 15%+ stability, costs 5% stability, and grants 8% war support. Trade internal cohesion for public enthusiasm."
 FRE_Trade_War_Support_For_Stability:0 "Restore Internal Stability"
 FRE_Trade_War_Support_For_Stability_desc:0 "Focus on internal governance and stability at the cost of public war enthusiasm. Requires 15%+ war support, costs 5% war support, and grants 8% stability. Useful when internal stability is critical."
 FRE_Trade_Equipment_For_PP:0 "Sell Equipment for Political Capital"
 FRE_Trade_Equipment_For_PP_desc:0 "Liquidate excess equipment stockpiles to generate political capital. Requires 10,000+ infantry equipment, sells 10,000 units, and grants 40 PP. A modest trade when political capital is urgently needed."
 FRE_Shady_Political_Work:0 "Engage in Shady Political Maneuvers"
 FRE_Shady_Political_Work_desc:0 "Use underhanded political tactics to gain influence. Requires 10%+ war support, costs 3% war support, and grants 25 PP. Risky but effective when desperate for political capital."
 FRE_Expedited_Equipment_Procurement:0 "Expedited Equipment Procurement"
 FRE_Expedited_Equipment_Procurement_desc:0 "Pull all strings to rapidly acquire equipment. Requires 100+ PP and 25%+ stability, costs 100 PP and 3% stability, and grants 12,000 infantry equipment and 2,000 support equipment. A comprehensive procurement package for critical operations."
 FRE_Events.19.t:0 "Operation Lorraine: The Major Offensive"
 FRE_Events.19.d:0 "The time has come to launch Operation Lorraine, our most ambitious offensive into Viet Minh territory. This is a major operation that will test our forces and coordination with Vietnamese allies. Success here could significantly shift the balance in the Northern front, but failure would be a devastating blow to our war effort.\n\nWe must commit substantial resources - political capital, equipment, and stability - to ensure this operation succeeds. The battle will be fierce, and the outcome will determine the course of the war in the North."
 FRE_Events.19.a:0 "Launch Operation Lorraine"
 FRE_Events.20.t:0 "Operation Hirondelle: Airborne Assault"
 FRE_Events.20.d:0 "Operation Hirondelle represents our first major airborne operation in Indochina. Paratroopers will be dropped behind enemy lines to disrupt Viet Minh supply routes and communications. This operation requires significant air assets and coordination.\n\nSuccess will unlock new paratrooper raid capabilities and demonstrate our ability to strike deep into enemy territory. However, airborne operations are inherently risky, and failure could result in the loss of valuable paratrooper units and equipment."
 FRE_Events.20.a:0 "Launch Operation Hirondelle"
 FRE_Events.21.t:0 "Operation Mouette: Naval Assault"
 FRE_Events.21.d:0 "Operation Mouette is our major naval and amphibious operation along the Indochinese coast. Naval forces will support amphibious landings to strike at Viet Minh positions from the sea. This operation requires a strong naval presence and coordination between sea and land forces.\n\nSuccess will demonstrate our naval superiority and ability to project power along the coast. Failure would be a significant setback to our naval operations and could embolden the enemy."
 FRE_Events.21.a:0 "Launch Operation Mouette"
 FRE_Events.22.t:0 "Operation Brochet: The Northern Push"
 FRE_Events.22.d:0 "Operation Brochet is another major offensive into the Northern front. Building on previous operations, this push aims to further disrupt Viet Minh operations in the North. The operation requires substantial ground forces and equipment.\n\nSuccess will continue to pressure the enemy in the North and maintain our momentum. Failure would allow the Viet Minh to regroup and counterattack."
 FRE_Events.22.a:0 "Launch Operation Brochet"
 FRE_Events.23.t:0 "Operation Castor: Dien Bien Phu"
 FRE_Events.23.d:0 "Operation Castor is the most critical operation of the war - the establishment of the Dien Bien Phu airhead. This operation will create a major forward base deep in enemy territory, cutting off Viet Minh supply routes to Laos. The stakes could not be higher.\n\nSuccess will establish a strategic position that could turn the tide of the war. However, failure here would be catastrophic - a major defeat that could signal the beginning of the end for our presence in Indochina. This operation requires everything we have."
 FRE_Events.23.a:0 "Launch Operation Castor"
 FRE_Events.24.t:0 "Operation Lorraine: Success!"
 FRE_Events.24.d:0 "Operation Lorraine has been a resounding success! Our forces have pushed deep into Viet Minh territory, disrupting their supply lines and inflicting heavy casualties. The coordinated offensive with Vietnamese forces has proven highly effective.\n\nThe Northern front has been significantly strengthened, and the enemy is on the defensive. This victory has boosted morale and demonstrated our capability to conduct large-scale offensive operations."
 FRE_Events.24.a:0 "Excellent work!"
 FRE_Events.25.t:0 "Operation Lorraine: Failure"
 FRE_Events.25.d:0 "Operation Lorraine has failed. Despite our best efforts, the offensive was repulsed with heavy losses. The Viet Minh were better prepared than anticipated, and our forces were unable to achieve their objectives.\n\nThis failure is a significant setback. The enemy has been emboldened, and our position in the North has been weakened. We must regroup and learn from this defeat."
 FRE_Events.25.a:0 "This is a serious setback."
 FRE_Events.26.t:0 "Operation Hirondelle: Success!"
 FRE_Events.26.d:0 "Operation Hirondelle has succeeded! Our paratroopers successfully dropped behind enemy lines, disrupting Viet Minh communications and supply routes. The airborne operation has proven the viability of paratrooper raids in this theater.\n\nWe have now unlocked new paratrooper raid capabilities that will allow us to strike deep into enemy territory. This success has opened new tactical options for future operations."
 FRE_Events.26.a:0 "The paratroopers have proven their worth!"
 FRE_Events.27.t:0 "Operation Hirondelle: Failure"
 FRE_Events.27.d:0 "Operation Hirondelle has failed. The paratrooper drop encountered heavy enemy resistance, and many of our airborne forces were lost. The operation did not achieve its objectives.\n\nThis failure has cost us valuable paratrooper units and equipment. We must reassess our airborne capabilities before attempting similar operations."
 FRE_Events.27.a:0 "We have paid a heavy price."
 FRE_Events.28.t:0 "Operation Mouette: Success!"
 FRE_Events.28.d:0 "Operation Mouette has succeeded! Our naval forces successfully supported amphibious landings along the coast, striking at Viet Minh positions from an unexpected direction. The coordination between naval and ground forces was exemplary.\n\nThis success demonstrates our naval superiority and ability to project power along the Indochinese coast. The enemy has been forced to divert resources to defend against our naval threat."
 FRE_Events.28.a:0 "The navy has proven its value!"
 FRE_Events.29.t:0 "Operation Mouette: Failure"
 FRE_Events.29.d:0 "Operation Mouette has failed. The amphibious landings encountered heavy resistance, and our naval forces were unable to provide adequate support. The operation did not achieve its objectives.\n\nThis failure is a setback to our naval operations. We must reassess our amphibious capabilities and naval coordination."
 FRE_Events.29.a:0 "We must improve our naval operations."
 FRE_Events.30.t:0 "Operation Brochet: Success!"
 FRE_Events.30.d:0 "Operation Brochet has succeeded! Our forces have pushed further into the Northern front, maintaining pressure on the Viet Minh and disrupting their operations. The offensive has been well-coordinated and effective.\n\nThis success continues our momentum in the North and keeps the enemy off-balance. Our position in the Northern front has been strengthened."
 FRE_Events.30.a:0 "We maintain the initiative!"
 FRE_Events.31.t:0 "Operation Brochet: Failure"
 FRE_Events.31.d:0 "Operation Brochet has failed. The offensive was unable to achieve its objectives, and our forces were forced to withdraw. The Viet Minh have successfully defended their positions.\n\nThis failure has allowed the enemy to regroup and counterattack. Our position in the North has been weakened, and we must reassess our strategy."
 FRE_Events.31.a:0 "We must regroup."
 FRE_Events.32.t:0 "Operation Castor: Dien Bien Phu Established!"
 FRE_Events.32.d:0 "Operation Castor has succeeded! The Dien Bien Phu airhead has been successfully established. Our paratroopers have secured the position, and we are now building a major forward base deep in enemy territory. This strategic position cuts off Viet Minh supply routes to Laos.\n\nThis is a momentous achievement. Dien Bien Phu represents a major strategic victory that could turn the tide of the war. However, we must now hold this position against inevitable enemy counterattacks. The battle for Dien Bien Phu is far from over."
 FRE_Events.32.a:0 "Dien Bien Phu is ours! Now we must hold it."
 FRE_Events.33.t:0 "Operation Castor: Catastrophic Failure"
 FRE_Events.33.d:0 "Operation Castor has failed catastrophically. The attempt to establish the Dien Bien Phu airhead was repulsed with devastating losses. Our paratroopers were unable to secure the position, and the operation has been a complete disaster.\n\nThis failure is a catastrophic blow to our war effort. The loss of men, equipment, and morale is severe. The enemy has been emboldened, and our position in Indochina has been fundamentally weakened. This may be the beginning of the end."
 FRE_Events.33.a:0 "This is a disaster."
 FRE_Mission_Operation_Lorraine:0 "Operation Lorraine"
 FRE_Mission_Operation_Lorraine_desc:0 "Launch the major offensive into Viet Minh territory. This operation will trigger a border war battle in the Northern front. Success requires substantial resources and will have major impact on the war."
 FRE_Mission_Operation_Lorraine_Available_tt:0 "This operation will start a border war battle with VIN in the Northern front. Success depends on:\n• §YPolitical Power§!: More than 100 PP\n• §YEquipment§!: Infantry and support equipment stockpiles\n• §YArmy Experience§!: Combat effectiveness\n• The outcome of the border war battle"
