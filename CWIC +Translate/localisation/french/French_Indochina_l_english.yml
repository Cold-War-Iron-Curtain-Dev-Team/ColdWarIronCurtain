 FRE_Mission_Operation_Mouette:0 "Operation Mouette"
 FRE_Mission_Operation_Mouette_desc:0 "Launch the naval and amphibious assault operation. Requires a strong navy and naval experience."
 FRE_Mission_Operation_Mouette_Available_tt:0 "This operation's success depends on:\n• §YNavy Size§!: More than 10 ships (+0%), More than 20 (+15%)\n• §YNaval Experience§!: More than 50 (+20%)\n• §YPolitical Power§!: More than 100 PP (+20%)"
 FRE_Mission_Operation_Brochet:0 "Operation Brochet"
 FRE_Mission_Operation_Brochet_desc:0 "Launch the Northern push offensive. This operation will trigger a border war battle. Success continues momentum in the North."
 FRE_Mission_Operation_Brochet_Available_tt:0 "This operation will start a border war battle with VIN in the Northern front. Success depends on:\n• §YPolitical Power§!: More than 100 PP\n• §YEquipment§!: Infantry and support equipment stockpiles\n• §YArmy Experience§!: Combat effectiveness\n• The outcome of the border war battle"
 FRE_Mission_Operation_Castor:0 "Operation Castor: Dien Bien Phu"
 FRE_Mission_Operation_Castor_desc:0 "Launch the critical operation to establish the Dien Bien Phu airhead. This is the most important operation of the war. Success or failure will have massive consequences."
 FRE_Mission_Operation_Castor_Available_tt:0 "This critical operation will start a border war battle for Dien Bien Phu. Success depends on:\n• §YTransport Planes§!: 15+ required, 25+ (+bonus)\n• §YAir Experience§!: Combat effectiveness\n• §YPolitical Power§!: Resource availability\n• The outcome of the border war battle\n\n§RWARNING: Failure here will be catastrophic!§!"
