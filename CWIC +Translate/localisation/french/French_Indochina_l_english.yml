 CAM_Economic.1.t:0 "Jean Delvert’s Rural Studies and Demographic Data"
 CAM_Economic.1.d:0 "In 1949, French geographer Jean Delvert began a seminal study of Cambodian rural life, particularly in Takeo province, one of the most densely populated and agriculturally vital areas of Kampuchea. However, Delvert immediately encountered a major obstacle: the absence of reliable population statistics. He dismissed the 1937 colonial population census as inaccurate and instead relied on 1921 figures—but even these, he admitted, were of dubious reliability. Delvert criticized the administrative weakness of the postcolonial Khmer state, noting that births and deaths were rarely registered and that civil service structures were rudimentary at best. According to him, the population was generally estimated by multiplying by four the number of tax-liable adult males, a crude and imprecise method. His findings revealed a country dominated by peasant agriculture, poor rural infrastructure, and low literacy rates. Delvert’s work provided a critical foundation for our people's early economic development planning and illuminated the enormous bureaucratic and statistical gaps the Sangkum regime would have to address after independence."
 CAM_Economic.1.a:0 "Let us Fund this effort of His"
 CAM_Economic.2.t:0 "Comité du Crédit Populaire and Credit Inefficiencies"
 CAM_Economic.2.d:0 "Under the French Union framework and later the Associated States system, Kampuchea  had access to a local Comité de Crédit Populaire, which operated under the oversight of the Office du Crédit Populaire. Established with the aim of supporting small-scale investment and rural development, the system was deeply flawed. By 1950,our Khmer people had acess to only seven such credit outlets across the entire kingdom, severely limiting access for most rural citizens. Hou Yuon, a radical Khmer intellectual and Sangkum leftist, lambasted the credit system in his writings. He revealed that the average loans distributed (510 piastres in 1950; 757 in 1951) were too large for peasant farmers and thus often went to urban merchants, landlords, and small industrialists instead. Worse still, these loans were rarely given out during May to July, the peak of the agricultural work season, when farmers needed them most. Instead of fueling productive rural investment, credit was diverted into commercial speculation and usury, deepening rural poverty and reinforcing elite urban dominance over the countryside."
 CAM_Economic.2.a:0 "The Buddha taught that all Living Beings need Happiness in both Labour and Intellect"
 CAM_Economic.3.t:0 "The Assumption of Economic Sovereignty"
 CAM_Economic.3.d:0 "Following Sihanouk’s declaration of independence in November 1953, Kampuchea began to assume greater control over its economic and financial systems. This transition accelerated after the Geneva Conference (1954) and the formal withdrawal of French troops. Ministries of Finance, Commerce, and National Economy were restructured with our indidenous Khmer personnel, though technical expertise remained limited. From 1950 to 1955, financial autonomy was gradually wrested from French control. The Institut d’Émission des États Associés d’Indochine, which had succeeded the Banque de l’Indochine after the 1950 Pau Conference, was tasked with managing currency across Vietnam, Laos, and Kampuchea. However, Cambodian officials increasingly pressed for monetary independence, especially after the devaluation of the Indochinese piastre in May 1953 (from 17 to 10 French francs), which caused inflationary concerns. These developments culminated in the creation of a truly national monetary system by 1955."
 CAM_Economic.3.a:0 "By Khmer, For Khmer!"
 CAM_Economic.4.t:0 "The First Two-Year Plans"
 CAM_Economic.4.d:0 "Under the charismatic leadership of our Prince Norodom Sihanouk, who had abdicated in 1955 to enter politics and launch the Sangkum Reastr Niyum movement, Kampuchea has initiated our first two-year development plan. The plan focused on building basic infrastructure, modernizing agriculture, and improving education and public health. Funded in part by French reparations and American aid, the plan sought to reduce dependence on foreign experts by training Khmer engineers, administrators, and technicians. However, progress was uneven due to corruption, bureaucratic inertia, and rural underdevelopment. While some roads and schools were built, critics argued that the plans lacked proper coordination and that the rural majority remained marginalized. Still, these early development efforts laid the groundwork for future Five-Year Plans in the 1960s, and were central to the Sangkum's image as a progressive, modernizing force."
 CAM_Economic.4.a:0 "A man who makes good use of wealth is said to possess a great treasure; but the he who hoards up his riches will have no profit."
 CAM_Economic.5.t:0 "The Founding of the National Bank of Kampuchea"
 CAM_Economic.5.d:0 "On January 1, 1955, a landmark was reached in Khmer's economic history; the founding of the Banque Nationale du Cambodge (National Bank of Kampuchea). The new central bank assumed full control of the national currency, issuing the riel, whose official value was pegged at 10 French francs. The riel was backed by reserves of gold and foreign exchange, and its value was initially tied to a gold weight (25.3905 grams), signaling an effort to ensure monetary credibility. This move marked Khmer's final break from the Indochinese financial system and its assertion of economic sovereignty. With this, Kampuchea gained the right to independently manage its monetary policy, exchange rates, and currency reserves, though the economy remained fragile and dependent on agricultural exports. The National Bank also began overseeing the regulation of private banks and providing limited commercial credit, though much of Kampuchea's banking infrastructure remained rudimentary."
 CAM_Economic.5.a:0 "After wealth being gotten by lawful means, may we live long and reach great age!"
 CAM_Economic.6.t:0 "Kram No. 83-NS"
 CAM_Economic.6.d:0 "In the context of growing nationalism and a desire to build a self-sustaining economy, King Sianhouk and the Royal Government issued Kram No. 83-NS in the late 1950s. This royal edict was a powerful protectionist and nationalist piece of legislation. It prohibited foreigners from working in 18 specified professions, many of them linked to commerce, technical sectors, or white-collar employment. In addition, it required that all businesses operating in Cambodia employ at least 70% Khmer nationals across all tiers of labor—specialized, non-specialized, and clerical. While temporary exemptions were possible, the law aimed to ensure that Kampuchean nationalities can now take central role in our economic development. The move reflected deep concerns about foreign economic domination, particularly by Vietnamese, Chinese, and French communities, and mirrored broader trends in post-colonial Southeast Asia where newly independent states sought to reassert sovereignty over their labor and capital."
 CAM_Economic.6.a:0 "It's now time for the Khmerization of our Economy"
 CAM_Military.1.t:0 "Signing the Second Franco-Khmer Military Agreement"
 CAM_Military.1.d:0 "In a crucial step toward greater autonomy, represenatives from our National Khmer Army and the government  has signed the Second Franco-Khmer Military Agreement. This accord grants our national forces expanded operational authority in the provinces of Siem Reap and Kampong Thom, marking a significant and steadily transfer of security responsibilities from the French colonial command to Khmer leadership. As part of this agreement, CEFEO will eventually grant our Khetts's governors with counter-insurgency duties and responsibilities and provided with independent Khmer infantry companies. Though still under French oversight, this milestone signals the gradual birth of a self-reliant national armed forces."
 CAM_Military.1.a:0 "Steadily and slowly..."
 CAM_Military.2.t:0 "Foundation of the Royal Army of the Khmer (FARK)"
 CAM_Military.2.d:0 "Following sustained negotiations and the steady dismantling of colonial control, the French High Command in Indochina has officially transferred responsibility for the national defense of Cambodia to our government in a landmark act of decolonization. This transfer marks the birth of the Royal Army of the Khmer (FARK)—the first truly Khmer-controlled military institution in modern history. The FARK is formed by integrating elements of the Khmer National Guard, regional security forces, and the Khmer regiments previously embedded within the French Union Army. The French have consented to create a new operational security zone along the eastern bank of the Mekong River, jointly managed by the French Lower Mekong Operational Group (GOBM) and FARK detachments. The remainder of the country will now fall under full Khmer military jurisdiction. With an estimated 17,000 regulars, the FARK's formation is not only a technical transition of command—it is a profound symbol of Cambodian sovereignty. The army’s organizational structure, however, remains heavily reliant on French training, logistics, and senior advisory staff. Officers are still largely trained abroad, and military doctrine continues to reflect colonial-era strategies, but a new generation of Khmer officers is already being cultivated. Under the leadership of King Norodom Sihanouk, the FARK will serve as both a bulwark against regional instability and a means to consolidate royal legitimacy. But challenges remain banditry, remnants of pro-Viet Minh insurgents, and ethnic tensions in the northeast threaten national cohesion. Nonetheless, with discipline and unity, the FARK may evolve into the cornerstone of our national independence and security."
 CAM_Military.2.a:0 "The swords and Rifles that guards our sovereignty must now bear our name"
 CAM_Military.3.t:0 "Establishment of the Khmer Royal Navy (MRK)"
 CAM_Military.3.d:0 "To assert Khmer sovereignty over our own waterways and coastline, King Norodom Sihanouk has signed a royal decree formally establishing the Marine Royale Khmère (MRK). This fledgling navy, tasked with defending Kampuchea's maritime and riverine frontiers, begins its mission with a small yet symbolic fleet of World War II-era vessels handed down from the departing French colonial navy—including British-made Harbour Defence Motor Launches and American LCM landing crafts. The MRK is placed under the command of Capitaine de Vaisseau Pierre Coedes, a naval officer of Franco-Khmer origin, chosen for his unique understanding of both local terrain and French naval doctrine. With only 600 sailors, the MRK is modest in size but rich in national symbolism. Its main headquarters is the former French riverine base at Chrui Chhangwar, on the peninsula facing Phnom Penh. Due to spatial constraints, the naval HQ initially operates from an old French river vessel named La Payotte, permanently docked at the base. Though humble in origin, the MRK represents Cambodia’s commitment to maritime security, and plans are already underway to expand Chrui Chhangwar into a modern naval facility capable of supporting riverine patrols, customs enforcement, and later, coastal defense."
 CAM_Military.3.a:0 "From the rivers of the Mekong to the Gulf of Thailand, the Khmer flag must fly with dignity"
 CAM_Military.4.t:0 "Establishment of the Khmer Royal Air Force (AVRK)"
 CAM_Military.4.d:0 "A Royal Kram by Prince Norodom Sihanouk has officially created the Aviation Royale Khmère (AVRK)—Kampuchea's first national air wing. The AVRK is commanded by Colonel Dr. Ngo Hou, Sihanouk’s personal physician, and a close royal confidant. Though early observers mock the fledgling force as the “Royal Flying Club,” this symbolic foundation marks a pivotal step in Cambodia’s pursuit of military autonomy. The initial fleet includes four Morane-Saulnier MS 500 Criquet aircraft, used for observation and liaison duties, two Cessna 180 Skywagons, one Cessna 170, and a single Douglas DC-3 for VIP transport. French military advisors remain critical to operations and training, and the AVRK is temporarily placed under the control of the Army Engineer Inspector-General’s Department. Though limited in combat capabilities, the AVRK allows our Khmer kind to begin developing reconnaissance, coordination, and VIP transport capacities. Its establishment is a powerful symbol of national modernization and independence."
 CAM_Military.4.a:0 "Let Kampuchea's sovereignty reach the skies"
 CAM_Military.5.t:0 "Founding of Chrui Chhangwar Naval College"
 CAM_Military.5.d:0 "Recognizing the urgent need for trained sailors and officers, King Sihanouk has ordered the expansion of the cramped Chrui Chhangwar naval base, transforming it into Kampuchea's first domestic naval academy—the École Navale. While senior officer candidates (Élèves Officiers de Marine) continue to receive advanced training at the French Naval Academy in Brest, this Naval College will focus on training enlisted men and NCOs to crew Kampuchea's expanding riverine and coastal forces. A new dock and modern barracks are under construction to support the future growth of the Marine Royale Khmère. With this step, our Khmer kind shall begins building a locally educated cadre of naval professionals essential for long-term independence and development."
 CAM_Military.5.a:0 "Every great navy begins with schools and sailors"
 CAM_Military.6.t:0 "Founding of the Pochentong Air Force College"
 CAM_Military.6.d:0 "With the assistance of French instructors from the Far East Expeditionary Corps (CEFEO), Kampuchea has inaugurated our first military flight school: the Royal Flying School (École de l’Air Royale) at Pochentong airfield, near Phnom Penh. This facility will train the first generation of Khmer military pilots, known as Élèves Pilotes Khmers (EPKs). While many EPKs will still complete their education at the École de l’air in Salon-de-Provence, France, the Pochentong school enables Kampuchea the ability to train pilot domestically—a key milestone in building an autonomous Khmer Air Force. As future batches of pilots graduate, the Khmer kind 's Air Force will gradually expand beyond reconnaissance to transport and combat roles, laying the foundation for a robust aerial command."
 CAM_Military.6.a:0 "Wings of sovereignty must be taught to fly."
 CAM_Chinese_PRC_Victory_tt:0 "The Communists have taken over the Mainland"
 CAM_Chinese_ROC_Victory_tt:0 "The Nationalists have taken over the Mainland"
 FRE_The_Situation_in_Route_Coloniale_4:0 "The Situation in Route Coloniale 4"
 FRE_The_Situation_in_Route_Coloniale_4_desc:0 "Route Coloniale 4 (RC4) represents a critical supply artery connecting the Red River Delta to the Chinese border. The situation along this route has become increasingly precarious as Viet Minh forces have intensified their attacks on French convoys and outposts. We must conduct a comprehensive assessment of the security situation, identify vulnerable points, and develop strategies to secure this vital lifeline. The loss of RC4 would sever our connection to the northern frontier and embolden the enemy."
 FRE_The_Fallout_of_the_Revers_Report:0 "The Fallout of the Revers Report"
 FRE_The_Fallout_of_the_Revers_Report_desc:0 "General Revers' critical report on French strategy in Indochina has created a political firestorm in Paris. The report highlights strategic weaknesses, logistical failures, and questions the viability of our current approach. While the criticism is harsh, it forces us to confront uncomfortable truths about our military operations. We must address these concerns, implement necessary reforms, and restore confidence in our command structure. The political fallout threatens to undermine support for the war effort both at home and among our allies."
 FRE_Send_De_lattre_de_Tassigny:0 "Send de Lattre de Tassigny"
 FRE_Send_De_lattre_de_Tassigny_desc:0 "In response to the deteriorating situation, Paris has decided to send General Jean de Lattre de Tassigny to take command of the French Far East Expeditionary Corps. De Lattre brings with him a reputation for decisive leadership, strategic vision, and the ability to inspire both troops and civilians. His arrival represents a new chapter in our campaign—one marked by renewed energy, aggressive tactics, and a determination to turn the tide. Under his command, we will reorganize our forces, strengthen our defenses, and take the fight to the enemy with renewed vigor."
 FRE_Prepare_for_the_Battle_of_Na_San:0 "Prepare for the Battle of Na San"
 FRE_Prepare_for_the_Battle_of_Na_San_desc:0 "Na San has been identified as a critical defensive position that could serve as a bastion against Viet Minh advances in the northwest. The location offers natural defensive advantages, and with proper fortification, it could become an impregnable stronghold. We must prepare the position with extensive fortifications, stockpile supplies, and position our forces to repel any enemy assault. A successful defense at Na San would demonstrate our ability to hold key positions and provide a model for future defensive operations."
 FRE_Operation_Lorraine:0 "Operation Lorraine"
 FRE_Operation_Lorraine_desc:0 "Operation Lorraine represents a major offensive thrust deep into Viet Minh-controlled territory. This ambitious operation aims to disrupt enemy supply lines, destroy their infrastructure, and demonstrate our ability to take the initiative. The operation will require careful coordination between multiple units, air support, and logistical planning. Success would deal a significant blow to the enemy's capabilities and morale, while failure could expose our forces to dangerous counterattacks."
 FRE_Operation_Hirondelle:0 "Operation Hirondelle"
 FRE_Operation_Hirondelle_desc:0 "Operation Hirondelle (Swallow) is an ambitious airborne operation designed to strike deep behind enemy lines. Paratroopers will be dropped into Viet Minh territory to disrupt supply routes, destroy key infrastructure, and create chaos in the enemy's rear areas. This operation showcases our airborne capabilities and demonstrates our willingness to take bold, unconventional approaches. The success of such operations depends on precise planning, surprise, and the ability to extract our forces before the enemy can respond effectively."
 FRE_Prepare_for_the_Battle_of_Vinh_Yen:0 "Prepare for the Battle of Vinh Yen"
 FRE_Prepare_for_the_Battle_of_Vinh_Yen_desc:0 "Vinh Yen represents a crucial test of our defensive capabilities and de Lattre's strategic vision. The battle will determine whether we can successfully defend key positions against determined Viet Minh assaults. Preparation involves fortifying positions, coordinating with Vietnamese forces, and ensuring adequate supplies and reinforcements. A victory at Vinh Yen would validate de Lattre's leadership and provide a much-needed boost to morale, while demonstrating our resolve to hold our ground."
 FRE_Recruit_Germans_to_the_FFL:0 "Recruit Germans to the FFL"
 FRE_Recruit_Germans_to_the_FFL_desc:0 "The French Foreign Legion has long been a source of experienced, motivated soldiers. In the aftermath of World War II, many German veterans find themselves without prospects in a devastated homeland. These men, hardened by years of combat, represent a valuable resource for our forces. By actively recruiting German veterans into the Foreign Legion, we can bolster our ranks with experienced soldiers who understand modern warfare. This recruitment drive will expand our operational capabilities and provide us with additional manpower for our campaigns."
 FRE_Secure_American_Financing:0 "Secure American Financing"
 FRE_Secure_American_Financing_desc:0 "The financial burden of the Indochina War has placed enormous strain on France's economy. American support has become increasingly crucial, not just for financial reasons, but also as a symbol of Western solidarity against communist expansion. Securing substantial American financing will provide us with the resources needed to sustain our operations, modernize our equipment, and maintain our forces in the field. This support also strengthens the political foundation of our campaign and demonstrates international commitment to our cause."
 FRE_Operation_Mouette:0 "Operation Mouette"
 FRE_Operation_Mouette_desc:0 "Operation Mouette (Seagull) is a combined naval and amphibious operation designed to strike at enemy positions along the coast. This operation leverages our naval superiority to project power into areas that would be difficult to reach by land. Amphibious assaults require precise coordination between naval, air, and ground forces, and success depends on maintaining the element of surprise. Such operations demonstrate our ability to operate across multiple domains and keep the enemy off-balance."
 FRE_Prepare_for_the_Battle_of_Mao_Khe:0 "Prepare for the Battle of Mao Khe"
 FRE_Prepare_for_the_Battle_of_Mao_Khe_desc:0 "Mao Khe presents another critical defensive challenge. The position must be prepared to withstand determined enemy attacks while serving as a base for future operations. Proper preparation involves not just military fortifications, but also coordination with local forces, intelligence gathering, and ensuring adequate logistical support. A successful defense at Mao Khe would further validate our defensive strategy and provide another example of our ability to hold key positions against superior numbers."
 FRE_Operation_Brochet:0 "Operation Brochet"
 FRE_Operation_Brochet_desc:0 "Operation Brochet (Pike) represents another offensive operation designed to maintain pressure on the enemy and disrupt their operations. This operation will target enemy supply lines, destroy infrastructure, and force the Viet Minh to divert resources from other areas. Success requires careful planning, coordination between different units, and the ability to adapt to changing circumstances on the battlefield. Each successful operation strengthens our position and weakens the enemy's ability to sustain their campaign."
 FRE_Operation_Castor:0 "Operation Castor"
 FRE_Operation_Castor_desc:0 "Operation Castor (Beaver) is one of the most ambitious operations of the war—the establishment of an airhead at Dien Bien Phu. This remote valley in northwestern Vietnam will serve as a base to interdict enemy supply routes from Laos and challenge Viet Minh control of the region. The operation requires extensive air support, careful planning, and the commitment of significant resources. Success would create a major strategic advantage, but failure could result in the loss of an entire garrison. The stakes could not be higher."
 FRE_Preparing_for_the_Final_Push:0 "Preparing for the Final Push"
 FRE_Preparing_for_the_Final_Push_desc:0 "As the war enters its critical phase, we must prepare for what could be the decisive campaign. This final push will require the coordination of all our resources, the commitment of our best units, and the support of our allies. We must ensure that our forces are properly equipped, well-trained, and ready for the challenges ahead. The outcome of this final push will determine the future of French Indochina and shape the geopolitical landscape of Southeast Asia for decades to come."
 FRE_Proclaim_Victory_in_Indochina:0 "Proclaim Victory in Indochina"
 FRE_Proclaim_Victory_in_Indochina_desc:0 "Against all odds, we have achieved victory in Indochina. The enemy has been defeated, their forces scattered, and their leadership broken. This triumph represents the culmination of years of sacrifice, strategic planning, and military excellence. We can now proclaim victory and begin the process of establishing a stable, pro-French government in Vietnam. This victory secures French interests in the region and demonstrates the effectiveness of our military and political strategy."
 FRE_The_Geneva_Accords:0 "The Geneva Accords"
 FRE_The_Geneva_Accords_desc:0 "Facing mounting costs, political pressure, and the realization that a military solution may be unattainable, we have agreed to participate in peace negotiations at Geneva. These accords represent a diplomatic solution to the conflict, one that will likely result in the partition of Vietnam and the withdrawal of French forces. While not the victory we sought, the Geneva Accords offer a path to end the bloodshed and establish a framework for future relations. The conference will determine the fate of Indochina and shape the region's future."
 FRE_The_Fall_of_Saigon:0 "The Fall of Saigon"
 FRE_The_Fall_of_Saigon_desc:0 "The unthinkable has happened—Saigon has fallen to the enemy. This catastrophic defeat represents the complete collapse of our position in Indochina. The loss of the capital city, the seat of the State of Vietnam, marks the end of French influence in the region. Our forces are in disarray, our allies have lost confidence, and our strategic position has been completely undermined. This is not just a military defeat, but a political and strategic catastrophe that will have far-reaching consequences for France and the entire region."
 FRE_Events.1.t:0 "The Situation in Route Coloniale 4"
 FRE_Events.1.d:0 "The morning briefing brings grim news. Route Coloniale 4, our critical supply artery connecting the Red River Delta to the Chinese border, has become increasingly vulnerable. Intelligence reports indicate that Viet Minh forces have been systematically targeting our convoys, establishing ambush positions, and cutting our lines of communication. The situation demands immediate attention—we cannot allow this vital lifeline to be severed.\n\nAs you review the maps spread across your desk, the weight of command settles upon you. Each convoy lost means fewer supplies reaching our forward positions. Each outpost overrun emboldens the enemy. The assessment must be thorough, the response decisive. Your staff officers await your orders, their faces reflecting the gravity of the situation. The fate of our operations in the north may well depend on how we handle this crisis."
 FRE_Events.1.a:0 "We must assess the situation immediately."
 FRE_Events.2.t:0 "The Fallout of the Revers Report"
 FRE_Events.2.d:0 "The report from General Revers has arrived like a thunderclap, and its echoes are already reaching Paris. The document is scathing in its criticism of our strategy, our logistics, and our overall approach to the war. Revers has not minced words—he has laid bare the weaknesses in our position, the failures in our planning, and the inadequacies of our response to the Viet Minh threat.\n\nYour office has become a storm center. Telegrams from Paris demand explanations. Your subordinates look to you for guidance. The press, both in France and abroad, is beginning to pick up on the story. The political fallout threatens to undermine support for the war effort at a critical moment. You must address this crisis, not just to defend your command, but to restore confidence in our mission. The question is: how do you respond?"
 FRE_Events.2.a:0 "We will address these criticisms head-on."
 FRE_Events.3.t:0 "A New Commander Arrives"
 FRE_Events.3.d:0 "The news from Paris is both welcome and concerning. General Jean de Lattre de Tassigny has been appointed to take command of the French Far East Expeditionary Corps. De Lattre is a legend—a man who distinguished himself in both world wars, known for his strategic brilliance, his ability to inspire troops, and his uncompromising determination. His arrival represents a new chapter in this war.\n\nBut transitions of command are delicate things. De Lattre will need time to understand the situation, to build relationships with your staff, to coordinate with Vietnamese forces, and to implement his vision. The enemy will not wait. You must ensure that this transition is smooth, that de Lattre's arrival brings the energy and direction we so desperately need, rather than creating confusion and delay. The success of his command depends on how well you facilitate his arrival."
 FRE_Events.3.a:0 "We will ensure de Lattre's successful integration."
 FRE_Events.4.t:0 "Preparing for Na San"
 FRE_Events.4.d:0 "The maps on your wall tell a story of strategic necessity. Na San, a remote position in the northwest, has been identified as a potential bastion—a place where we can establish a strong defensive position that could serve as a base for future operations and a symbol of our determination to hold the line. The terrain offers natural advantages, but those advantages mean nothing without proper preparation.\n\nYour engineers have submitted their plans. Your logistics officers have calculated the requirements. Your intelligence officers have assessed the enemy threat. Now it falls to you to coordinate this massive undertaking. Fortifications must be built, supplies stockpiled, positions prepared. The work is arduous, the conditions difficult, and the enemy is watching. But if we succeed, Na San could become a symbol of French resolve. If we fail, it will be another defeat in a war that cannot afford many more."
 FRE_Events.4.a:0 "We will prepare Na San to be impregnable."
 FRE_Events.5.t:0 "Preparing for Vinh Yen"
 FRE_Events.5.d:0 "De Lattre has made his intentions clear: we will not simply react to enemy movements—we will take the initiative. Vinh Yen has been selected as the site for what could be a decisive battle. This is to be de Lattre's first major test, and the preparation must be flawless. The stakes could not be higher.\n\nCoordination with Vietnamese forces is essential. Intelligence gathering must be thorough. Supply lines must be secured. Every detail matters. As you review the operational plans, you can feel the weight of expectation. This battle could define de Lattre's command and set the tone for the entire campaign. Success would demonstrate our ability to take the fight to the enemy. Failure would be a devastating blow to morale and strategy alike."
 FRE_Events.5.a:0 "We will prepare for victory at Vinh Yen."
 FRE_Events.6.t:0 "Preparing for Mao Khe"
 FRE_Events.6.d:0 "Another defensive position, another test of our resolve. Mao Khe presents different challenges than Na San—different terrain, different enemy approaches, different strategic considerations. But the fundamental question remains the same: can we hold our ground against determined enemy assaults?\n\nThe preparation work is familiar now, but no less critical. Every fortification, every supply depot, every defensive position must be prepared with care. The enemy has learned from our previous engagements, and they will adapt. We must be ready. The defense of Mao Khe is not just about holding a position—it's about demonstrating that we can maintain our presence in the face of enemy pressure, that we can turn defensive positions into offensive advantages."
 FRE_Events.6.a:0 "We will prepare Mao Khe for defense."
 FRE_Events.7.t:0 "RC4 Assessment Complete"
 FRE_Events.7.d:0 "The assessment has been completed, and the results are encouraging. Your intelligence teams have identified the key vulnerabilities along Route Coloniale 4, mapped enemy positions, and developed a comprehensive plan to secure the route. Additional outposts have been established, convoy procedures have been improved, and coordination between units has been enhanced.\n\nThe route is now more secure, though the threat remains. Your assessment has provided valuable intelligence that will inform future operations. The enemy's tactics have been documented, their positions identified, and countermeasures implemented. This is a solid foundation for future success."
 FRE_Events.7.a:0 "Excellent work."
 FRE_Events.9.t:0 "Revers Report Addressed"
 FRE_Events.9.d:0 "Your response to the Revers Report has been well-received. By acknowledging the valid criticisms while demonstrating your commitment to improvement, you have managed to turn a potential crisis into an opportunity for reform. The political situation has stabilized, and support for the war effort has been maintained.\n\nThe changes you've implemented address many of Revers' concerns. Logistics have been improved, coordination enhanced, and strategic planning refined. While challenges remain, you have shown that the command is capable of adaptation and improvement."
 FRE_Events.9.a:0 "We have weathered the storm."
 FRE_Events.11.t:0 "de Lattre's Arrival a Success"
 FRE_Events.11.d:0 "General de Lattre has arrived, and his impact is immediately apparent. The transition has been smooth, his leadership style has energized the command, and his strategic vision has brought new clarity to our operations. The troops respond to his presence with renewed confidence, and your staff has integrated seamlessly with his command structure.\n\nDe Lattre's arrival marks a turning point. His aggressive approach, his attention to detail, and his ability to inspire have already begun to transform the campaign. With his leadership, we have a real chance to turn the tide of this war."
 FRE_Events.11.a:0 "A new chapter begins."
 FRE_Events.13.t:0 "Na San Preparation Successful"
 FRE_Events.13.d:0 "The preparation of Na San has been completed successfully. The position is now heavily fortified, well-supplied, and ready to serve as a bastion against enemy advances. Your engineers have done exceptional work, creating defensive positions that take full advantage of the terrain.\n\nThe position is ready. When the enemy comes, they will find a prepared, determined force. Na San stands as a symbol of French resolve and military capability."
 FRE_Events.13.a:0 "Na San is ready."
 FRE_Events.15.t:0 "Vinh Yen Preparation Complete"
 FRE_Events.15.d:0 "The preparation for the Vinh Yen offensive has been completed to de Lattre's exacting standards. Coordination with Vietnamese forces is excellent, intelligence is comprehensive, and all units are ready for action. The plan is sound, the forces are prepared, and the moment approaches.\n\nThis is de Lattre's first major test, and everything is in place for success. The preparation work has been thorough, the coordination exemplary. Victory at Vinh Yen would be a significant achievement."
 FRE_Events.15.a:0 "We are ready for battle."
 FRE_Events.17.t:0 "Mao Khe Preparation Successful"
 FRE_Events.17.d:0 "Mao Khe has been prepared for defense. The position is fortified, supplied, and ready to repel enemy attacks. Your forces are well-positioned, your defenses are strong, and your resolve is clear.\n\nThe preparation work has been completed successfully. Mao Khe is ready to serve as a defensive bastion, demonstrating our ability to hold our ground against enemy pressure."
 FRE_Events.17.a:0 "Mao Khe is prepared."
 FRE_Events.8.t:0 "RC4 Assessment Incomplete"
 FRE_Events.8.d:0 "The assessment of Route Coloniale 4 has encountered significant difficulties. Enemy activity has disrupted intelligence gathering, key positions remain unassessed, and the comprehensive picture you hoped for has not materialized. The situation along RC4 remains unclear, and vulnerabilities persist.\n\nThe incomplete assessment means that future operations along this critical route will proceed with less information than desired. The enemy retains the advantage of uncertainty, and our response capabilities are limited."
 FRE_Events.8.a:0 "We must do better."
 FRE_Events.10.t:0 "Revers Report Fallout Continues"
 FRE_Events.10.d:0 "Your response to the Revers Report has failed to quell the political storm. The criticisms continue to resonate, support for the war effort has been further undermined, and the political situation has deteriorated. The report's impact has been magnified rather than mitigated.\n\nThe fallout from this failure will continue to affect operations. Political support is weakened, morale has suffered, and the strategic situation has become more difficult. This is a significant setback."
 FRE_Events.10.a:0 "This is a serious blow."
 FRE_Events.12.t:0 "de Lattre's Arrival Problematic"
 FRE_Events.12.d:0 "General de Lattre's arrival has been more difficult than anticipated. The transition has been rocky, coordination has been challenging, and the integration of his command style with existing structures has encountered friction. While de Lattre's leadership qualities are undeniable, the immediate impact has been mixed.\n\nThe transition period has been longer and more disruptive than hoped. While de Lattre will eventually establish his command, the delay has given the enemy opportunities, and the initial period has been less effective than it might have been."
 FRE_Events.12.a:0 "We must work through these difficulties."
 FRE_Events.14.t:0 "Na San Preparation Inadequate"
 FRE_Events.14.d:0 "The preparation of Na San has fallen short of requirements. Supply difficulties, engineering challenges, and enemy interference have all contributed to an incomplete preparation. The position is not as fortified as it should be, supplies are not as comprehensive as needed, and the defensive capabilities are compromised.\n\nNa San is not ready. When the enemy comes, the position will be vulnerable. This failure represents a significant strategic setback."
 FRE_Events.14.a:0 "This is unacceptable."
 FRE_Events.16.t:0 "Vinh Yen Preparation Incomplete"
 FRE_Events.16.d:0 "The preparation for the Vinh Yen offensive has encountered significant problems. Coordination with Vietnamese forces has been difficult, intelligence gathering has been incomplete, and logistical preparations have fallen short. The operation is not as well-prepared as it should be.\n\nDe Lattre's first major test will proceed under less than ideal circumstances. The preparation work has been inadequate, and the chances of success have been reduced."
 FRE_Events.16.a:0 "We have failed in our preparation."
 FRE_Events.18.t:0 "Mao Khe Preparation Inadequate"
 FRE_Events.18.d:0 "The preparation of Mao Khe has been insufficient. Fortifications are incomplete, supplies are inadequate, and the defensive position is not as strong as it should be. The position is vulnerable, and our ability to hold it against determined enemy attacks is questionable.\n\nThis failure represents a significant problem. Mao Khe is not ready, and our defensive capabilities have been compromised."
 FRE_Events.18.a:0 "We must improve our preparation."
 FRE_Mission_Assess_RC4:0 "Assess Route Coloniale 4"
 FRE_Mission_Assess_RC4_desc:0 "Deploy intelligence teams to conduct a comprehensive assessment of Route Coloniale 4. This mission requires political power to coordinate intelligence gathering, stability to maintain operational security, and adequate war support to ensure resources are available. Success depends on having sufficient political capital, stable internal conditions, and proper equipment stockpiles to support the assessment teams."
 FRE_Mission_Address_Revers_Report:0 "Address Revers Report Fallout"
 FRE_Mission_Address_Revers_Report_desc:0 "Respond to the political crisis created by General Revers' critical report. This mission requires significant political power to manage the crisis, high stability to weather the political storm, and strong war support to maintain public confidence. The success of this mission is heavily dependent on your political capital and the stability of your government."
 FRE_Mission_De_Lattre_Arrival:0 "Ensure de Lattre's Successful Arrival"
 FRE_Mission_De_Lattre_Arrival_desc:0 "Facilitate General de Lattre's transition into command. This mission requires political power to coordinate the transition, stability to ensure smooth operations, and war support to maintain morale during the leadership change. Success depends on having adequate resources and stable conditions to support de Lattre's integration into the command structure."
 FRE_Mission_Prepare_Na_San:0 "Prepare Na San Position"
 FRE_Mission_Prepare_Na_San_desc:0 "Fortify and prepare the Na San defensive position. This mission requires equipment stockpiles for fortifications, political power to coordinate logistics, stability to maintain supply lines, and army experience to properly plan defenses. Success is heavily dependent on having adequate equipment reserves and experienced officers to oversee the preparation work."
 FRE_Mission_Prepare_Vinh_Yen:0 "Prepare Vinh Yen Offensive"
 FRE_Mission_Prepare_Vinh_Yen_desc:0 "Coordinate the preparation for the Vinh Yen offensive operation. This mission requires equipment stockpiles for the offensive, political power to coordinate with Vietnamese forces, stability to maintain operational security, and army experience to plan the operation effectively. Success depends on having sufficient equipment, political capital, and military expertise."
 FRE_Mission_Prepare_Mao_Khe:0 "Prepare Mao Khe Position"
 FRE_Mission_Prepare_Mao_Khe_desc:0 "Fortify and prepare the Mao Khe defensive position. This mission requires equipment stockpiles for fortifications, political power to coordinate logistics, stability to maintain supply lines, and army experience to properly plan defenses. Success is heavily dependent on having adequate equipment reserves and experienced officers to oversee the preparation work."
 FRE_Mission_Assess_RC4_Available_tt:0 "Mission Success Factors:\n• Political Power: 50+ PP (+5%), 100+ PP (+5%), 150+ PP (+5%)\n• Stability: 25%+ (+3%), 40%+ (+4%), 55%+ (+3%)\n• War Support: 20%+ (+3%), 35%+ (+3%), 50%+ (+2%)\n• Infantry Equipment: 5k+ (+4%), 10k+ (+4%), 20k+ (+4%)"
