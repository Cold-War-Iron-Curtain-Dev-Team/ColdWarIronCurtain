l_english:
 BUL_infantry_equipment_0:0 "Mosin Nagant"
 BUL_infantry_equipment_0_short:0 "Mosin Nagant"
 BUL_infantry_equipment_0_desc:0 "Le fusil à 3 lignes M1891, familièrement connu en Occident sous le nom de Mosin Nagant et en Russie et dans l'ex-Union soviétique sous le nom de fusil de Mosin, est un fusil militaire à cinq coups, à verrou et à chargeur interne. Il se trouve principalement chambré pour sa cartouche d'origine de 7,62×54 mmr."
 BUL_infantry_equipment_1:0 "Avtomat Kalashnikova 1947"
 BUL_infantry_equipment_1_short:0 "AK-47"
 BUL_infantry_equipment_1_desc:0 "L'AK-47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais il n'entra en service actif qu'en 1948, date à laquelle la version à crosse fixe fut mise en production. Début 1949, l'AK-47 fut adopté par les forces armées soviétiques pour un déploiement massif au sein des unités de première ligne. Doté d'un piston à gaz à longue course, d'un sélecteur de tir avec sécurité, d'un mécanisme de détente et d'alimentation automatique, ainsi que d'autres améliorations de conception, l'AK-47 représentait une nette amélioration par rapport au SKS. Pendant de nombreuses années, l'AK-47 fut considéré comme l'une des armes les plus fiables, faciles à entretenir, à manier et à apprendre au monde."
 BUL_infantry_equipment_2:0 "Awtomat Kalashnikova 1947"
 BUL_infantry_equipment_2_short:0 "AKKS"
 BUL_infantry_equipment_2_desc:0 "En Bulgarie, la production de fusils d'assaut Kalachnikov (appelés ici \"carabines automatiques\") a été établie au début des années 1960. Au début, ils ont été assemblés à partir de composants polonais, au milieu des années 1960-indépendamment. La carabine automatique Kalachnikov (AKK) a été produite par l'usine d'armement d'État \"Arsenal\". Semblable à l'AKS soviétique, ce fusil d'assaut a une crosse repliable en tiges semi-circulaires en acier, qui est libérée en appuyant sur le loquet sur le côté gauche du récepteur. La partie reposant sur l'épaule a la forme d'un fer à cheval; les rivets ne sont pas visibles."
 BUL_infantry_equipment_3:0 "Awtomat Kalashnikova 1947"
 BUL_infantry_equipment_3_short:0 "AKKS-74"
 BUL_infantry_equipment_3_desc:0 "Au milieu des années 1980, la production de fusils d'assaut pour la nouvelle cartouche de 5,45 mm était maîtrisée: AKK-74, AKKS-74 et AKK-74 (N), ce dernier avait un support en queue d'aronde pour le montage des viseurs de nuit et optiques. Jusqu'au milieu des années 1990, les machines bulgares étaient des copies presque complètes des machines soviétiques."
 BUL_infantry_equipment_4:0 "Arsenal AR-M7"
 BUL_infantry_equipment_4_short:0 "AR-M7"
 BUL_infantry_equipment_4_desc:0 "En 1999, Arsenal a développé des fusils d'assaut Kalachnikov de 5,56 mm conformes aux normes de l'OTAN, qui ont été proposés à l'exportation. De plus, depuis 1999, la société bulgare \"Arsenal \"a refusé d'utiliser le nom de\" fusil d'assaut Kalachnikov \" (cependant, la production de fusils d'assaut s'est poursuivie sous le nom d'AR et la sortie de leurs versions à chargement automatique-sous le nom de SLR). AR-M7-versions plus lourdes de l'AKM chambrées pour 5, 56x45 NATO ou 7, 62x39 mm (AR-M7F) - avec crosse pliante, raccords en plastique, inserts lumineux à la vue."
 BUL_lt_equipment_1:0 "LT vz.35/Т-11"
 BUL_lt_equipment_1_short:0 "LT vz.35/Т-11"
 BUL_lt_equipment_1_desc:0 "Les chars légers tchécoslovaques LT vz. 35 / T-11 et LT vz. 38 ont fait partie de l'Armée populaire bulgare jusqu'au début des années 1950, de sorte que la dernière commande de pièces de rechange pour eux a été reçue par Škoda en 1948."
 BUL_lt_equipment_2:0 "T-70"
 BUL_lt_equipment_2_short:0 "T-70"
 BUL_lt_equipment_2_desc:0 "Le char léger T-70 était un char de reconnaissance de la Seconde Guerre mondiale fabriqué pour remplacer le PT60. Nicholas Astrov a commencé à travailler immédiatement après le PT60 et aterminé en 1942. Au cours des 2 années de fabrication, 8 300 ont été produits. Le char avait un canon bien plus gros de 45 mm et était équipé de 2 moteurs GAZ-202 et pouvait atteindre jusqu'à 45 km/h. Le T-70 avait également une capacité optique nominalement améliorée, Il a été largement utilisé pendant la Seconde Guerre mondiale. "
 BUL_lt_equipment_3:0 "PT-76"
 BUL_lt_equipment_3_short:0 "PT-76"
 BUL_lt_equipment_3_desc:0 "Le PT-76 est un char léger amphibie soviétique qui a été largement exporté à travers le monde. Il a été conçu par Nikolai Shashmyrin et Zh. Kotin en 1951, et environ 12 000 exemplaires ont été produits. Il nécessite un équipage de trois hommes et est équipé d’un moteur V6 six cylindres en ligne, lui permettant d’atteindre une vitesse de 44 km/h sur terre et de nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique ou proches de l’Union soviétique et a ainsi rempli un rôle de reconnaissance dans pratiquement tous les conflits impliquant des nations de cette sphère. Toutefois, il est encore utilisé aujourd’hui par de nombreux pays en raison de sa fiabilité réputée et de sa facilité d’entretien."
 BUL_lt_equipment_4:0 "PT-76B Modèle 4"
 BUL_lt_equipment_4_short:0 "PT-76B"
 BUL_lt_equipment_4_desc:0 "Le PT-76B est armé du canon de char rayé D-56TS de 76,2 mm (doté d’un frein de bouche à double déflecteur, d’un éjecteur de douille, d’un extracteur de fumées et du système de stabilisation à deux axes STP-2P « Zarya »). Il est également équipé du système de protection NBC PAZ (protivo-atomnaya zashchita), d’un système automatique d’extinction d’incendie, d’une lunette de visée TShK-2-66 améliorée, d’un système de filtration-ventilation, de dispositifs d’observation améliorés ainsi que d’un équipement électrique modernisé. Le char reçoit aussi un nouveau moteur diesel V-6B, 6 cylindres en ligne, 4 temps, refroidi par eau, développant 263 ch (196 kW) à 1 800 tr/min, ainsi que des réservoirs de carburant internes supplémentaires, ce qui a nécessité une légère modification de la forme du blindage."
 BUL_ht_equipment_1:0 "IS-2"
 BUL_ht_equipment_1_short:0 "IS-2"
 BUL_mbt_equipment_0:0 "Panzerkampfwagen IV"
 BUL_mbt_equipment_0_short:0 "Panzer IV"
 BUL_mbt_equipment_1:0 "T-34-85M"
 BUL_mbt_equipment_1_short:0 "T-34-85M"
 BUL_mbt_equipment_2:0 "T-54"
 BUL_mbt_equipment_2_short:0 "T-54"
 BUL_mbt_equipment_2_desc:0 "Le char T-54 est le char le plus produit de l'histoire. Conçu en 1946 par KMBD, il est équipé d'un canon rayé de 100 mm et d'un blindage à épaisseur variable, de 60 à 205 mm. Son moteur diesel V12 de 38,88 litres et sa suspension à barres de torsion lui permettent d'atteindre une vitesse de 48 km/h. Utilisé par plus de 50 armées à travers le monde, il a été produit dans tout le bloc soviétique et a participé à tous les conflits qui y ont été liés."
 BUL_mbt_equipment_3:0 "T-55"
 BUL_mbt_equipment_3_short:0 "T-55"
 BUL_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. Le bureau d'études OKB-520 a modifié la conception du T-55 en améliorant sa protection NBC, en optimisant son moteur, en redessinant la tourelle et en ajoutant des équipements auxiliaires tels qu'un système de conduite de tir et des optiques améliorés. De plus, le T-55 utilisait plus fréquemment la mitrailleuse lourde DShK de 12,7 mm, tandis que le T-54 était équipé du canon SGMT de 7,62 mm, ce qui lui conférait une puissance de feu supérieure, mais limitait sa capacité d'emport de munitions. Le T-55 a été utilisé dans autant d'armées que le T-54 et a généralement participé aux mêmes conflits."
 BUL_mbt_equipment_4:0 "T-62"
 BUL_mbt_equipment_4_short:0 "T-62"
 BUL_mbt_equipment_4_desc:0 "Le T-62 est une évolution du char T-55. Il est équipé d'un canon à âme lisse et possède un blindage légèrement plus épais. Le calibre du canon principal a également été porté à 115 mm. Commandé initialement par l'Union soviétique dans le but d'améliorer sa puissance de feu, le projet fut achevé par le bureau d'études OKB-520 vers 1960. Malgré ses améliorations, sa production ne fut pas arrêtée, son coût étant nominalement supérieur à celui du T-55. Plus de 22 700 T-62 furent construits et il participa à de nombreux combats dans la sphère d'influence soviétique, notamment au Moyen-Orient. Ses améliorations démontrèrent une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique."
 BUL_mbt_equipment_5:0 "T-55AM"
 BUL_mbt_equipment_5_short:0 "T-55AM"
 BUL_mbt_equipment_6:0 "T-55AM2"
 BUL_mbt_equipment_6_short:0 "T-55AM2"
 BUL_mbt_equipment_7:0 "T-72A"
 BUL_mbt_equipment_7_short:0 "T-72A"
 BUL_mbt_equipment_7_desc:0 "En 1978, les premiers chars T-72 sont arrivés en Bulgarie en provenance de l'URSS. En 1992, la Bulgarie possédait 334 T-72, en 1999, 100 T-72A et T-72AK ont été achetés à la Russie."
 BUL_mbt_equipment_8_desc:0 "En 1978, les premiers chars T-72 sont arrivés en Bulgarie en provenance de l'URSS. En 1992, la Bulgarie possédait 334 T-72, en 1999, 100 T-72A et T-72AK ont été achetés à la Russie."
 BUL_mbt_equipment_8:0 "T-72M1"
 BUL_mbt_equipment_8_short:0 "T-72M1"
 BUL_mbt_equipment_9:0 "T-72M2"
 BUL_mbt_equipment_9_short:0 "T-72M2"
 BUL_mechanized_equipment_1:0 "Hanomag Sd.Kfz. 250"
 BUL_mechanized_equipment_1_short:0 "SdKfz 250"
 BUL_mechanized_equipment_2:0 "Hanomag Sd.Kfz. 251"
 BUL_mechanized_equipment_2_short:0 "Sd.Kfz. 251"
 BUL_mechanized_equipment_3:0 "BTR-40"
 BUL_mechanized_equipment_3_short:0 "BTR-40"
 BUL_mechanized_equipment_3_desc:0 "En 1955, les premiers véhicules blindés de transport de troupes BTR-40 sont entrés en service dans l'armée bulgare; au total, des unités 150 ont été livrées jusqu'en 1957."
 BUL_mechanized_equipment_4:0 "BTR-40B"
 BUL_mechanized_equipment_4_short:0 "BTR-40B"
 BUL_mechanized_equipment_5:0 "BTR-60P"
 BUL_mechanized_equipment_5_short:0 "BTR-60P"
 BUL_mechanized_equipment_5_desc:0 "Les BTR-152 à roues ont été fournis à la Bulgarie depuis 1957."
 BUL_mechanized_equipment_6:0 "BTR-60PB"
 BUL_mechanized_equipment_6_short:0 "BTR-60PB"
 BUL_mechanized_equipment_6_desc:0 "Depuis 1962, des véhicules blindés de transport de troupes soviétiques BTR-60 sont devenus le principal véhicule de l'infanterie bulgare et ont commencé à être fournis à la Bulgarie. Les livraisons se sont poursuivies jusqu'en 1972, avec un total d'environ 700 véhicules livrés."
 BUL_mechanized_equipment_7:0 "BTR-60PBZ"
 BUL_mechanized_equipment_7_short:0 "BTR-60PBZ"
 BUL_mechanized_equipment_7_desc:0 "Cela a été suivi d'une modification du BTR-60PB avec un armement renforcé à partir d'une mitrailleuse KPVT de 14,5 mm et d'un PKT de 7,62 mm dans la tourelle, qui est devenu le principal véhicule de transport de troupes blindé bulgare pendant de nombreuses années."
 BUL_mechanized_equipment_8:0 "BTR-60PB-MD1"
 BUL_mechanized_equipment_8_short:0 "BTR-60PB-MD1"
 BUL_mechanized_equipment_8_desc:0 "Lors de la conversion du BTR-60PB en BTR-60PB-MD1, la centrale est remplacée, tout en utilisant des composants importés de fabrication américaine (deux moteurs GAZ-40P sont remplacés par un moteur diesel Cummins ISB 25.30 six cylindres en ligne d'une capacité de 250 ch)."
 BUL_mechanized_equipment_9:0 "BTR-60PB-MD3"
 BUL_mechanized_equipment_9_short:0 "BTR-60PB-MD3"
 BUL_mechanized_equipment_9_desc:0 "8 lance-grenades fumigènes sont installés sur la tourelle avec des mitrailleuses. Au lieu de l'ancienne vue, une vue plus moderne avec des caractéristiques améliorées a été installée. Pour faciliter l'entrée et la sortie du palier, des portes sont découpées sur les côtés."
 BUL_mechanized_heavy_equipment_1:0 "BTR-152"
 BUL_mechanized_heavy_equipment_1_short:0 "BTR-152"
 BUL_mechanized_heavy_equipment_2:0 "BTR-50PK"
 BUL_mechanized_heavy_equipment_2_short:0 "BTR-50PK"
 BUL_mechanized_heavy_equipment_2_desc:0 "De 1960 à 1963, des BTR-50 chenillés ont été livrés en Bulgarie, 700 unités ont été livrées au total."
 BUL_mechanized_heavy_equipment_3:0 "MT-LB"
 BUL_mechanized_heavy_equipment_3_short:0 "MT-LB"
 BUL_mechanized_heavy_equipment_4:0 "BMP-1"
 BUL_mechanized_heavy_equipment_4_short:0 "BMP-1"
 BUL_mechanized_heavy_equipment_5:0 "MT-LB-M1"
 BUL_mechanized_heavy_equipment_5_short:0 "MT-LB-M1"
 BUL_mechanized_heavy_equipment_5_desc:0 "Depuis 1972, en Bulgarie, à l'usine de construction de machines BETA de Cherven Bryag, la production du tracteur blindé léger MT-LB a été établie. La production s'est poursuivie jusqu'en 1995. En vrac, ils ne diffèrent pratiquement pas de l'original. Mais encore, certaines des voitures ont été publiées avec leurs propres modifications, ce qui a apporté encore plus de variété à la large gamme de la famille."
 BUL_mechanized_heavy_equipment_6:0 "BMP-23"
 BUL_mechanized_heavy_equipment_6_short:0 "BMP-23"
 BUL_mechanized_heavy_equipment_6_desc:0 "L'armement du BMP-1 ne répondant pas aux exigences de l'époque, il a donc été décidé de développer un nouveau BMP basé sur le MT-LB, qui est devenu le seul véhicule de combat bulgare développé indépendamment. Le BMP créé a reçu l'indice BMP-23."
 BUL_mechanized_heavy_equipment_7:0 "BMP-23A"
 BUL_mechanized_heavy_equipment_7_short:0 "BMP-23A"
 BUL_mechanized_heavy_equipment_7_desc:0 "Version améliorée du BMP avec lance-grenades fumigènes de 81 mm 902V \" Tucha \"sur les côtés de la tourelle et remplacement de l'ATGM par le 9M111\"Fagot\"."
 BUL_mechanized_heavy_equipment_8:0 "BMP-30"
 BUL_mechanized_heavy_equipment_8_short:0 "BMP-30"
 BUL_mechanized_heavy_equipment_8_desc:0 "Un autre développement du BMP - 23 était la variante BMP-30, qui diffère par l'installation d'une tourelle du BMP-2 soviétique avec un canon 2A42 de 30 mm et un ATGM 9M111 \"Fagot\" "
