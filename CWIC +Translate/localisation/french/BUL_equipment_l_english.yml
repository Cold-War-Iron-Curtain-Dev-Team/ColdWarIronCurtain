 BUL_naval_helicopter_equipment_3:0 "Kamov Ka-25BSh Hormone-A"
 BUL_naval_helicopter_equipment_3_short:0 "Ka-25BSh Hormone-A"
 BUL_naval_helicopter_equipment_4:0 "Kamov Ka-25K Hormone-B"
 BUL_naval_helicopter_equipment_4_short:0 "Ka-25K Hormone-B"
 BUL_battle_hull_light_0:0 "Ushakov Class\""
 BUL_battle_hull_light_0_short:0 "Ushakov Class"
 BUL_battle_hull_light_0_desc:0 "Sur le plan de la conception, il s'agissait d'une version modernisée des destroyers de la classe « Daring » (selon d'autres sources, du type « Hajibey », mais il s'agit en réalité de navires appartenant à la même série de construction). Dans les années 1920-1930, des programmes de modernisation ont été menés, touchant principalement l'artillerie auxiliaire et antiaérienne du navire."
 BUL_battle_hull_light_1:0 "Projet 50 \"Ermine\""
 BUL_battle_hull_light_1_short:0 "Projet 50 \"Ermine\""
 BUL_battle_hull_light_1_desc:0 "Les anciens navires soviétiques SKR-67, SKR-53 et Kobchik. Les deux premiers ont servi dans la Flotte de la mer Noire, et le troisième au sein de la 4e structure de la Marine de l'URSS. Les deux premiers navires ont reçu les numéros tactiques 31 et 32 et ont été intégrés au 1er bataillon anti-sous-marin indépendant de la 11e VMB-Varna. Au cours de leurs campagnes en Méditerranée, les TFR ont reçu des numéros tactiques temporaires : 15 « Brave » et 16 « Brave »."
 BUL_screen_hull_heavy_0:0 "Projet 30-K"
 BUL_screen_hull_heavy_0_short:0 "Projet 30-K"
 BUL_screen_hull_heavy_0_desc:0 "Sa construction a débuté avant la Seconde Guerre mondiale à Nikolaïev. Il a reçu le nom de « Mischievous » et a intégré la Flotte de la mer Noire de l'URSS en 1948. Il a été équipé de matériel radar, qui n'existait pas du tout dans les années 1930 : des radars Rif et Guys pour la surveillance de la situation en surface, un radar de contrôle des tirs d'artillerie de gros calibre Redan, un radar de contrôle des tirs de torpilles Redan-4, une station de reconnaissance « Fakel », une station de brouillage, un équipement de navigation « Rome », une station hydroacoustique « Tamir-5N » et des armes antiaériennes améliorées."
 BUL_screen_hull_heavy_1:0 "Projet 1241.1T 'Molniya-1'"
 BUL_screen_hull_heavy_1_short:0 "Projet 1241.1T"
 BUL_screen_hull_heavy_1_desc:0 "Ancien R-256 « Poltava Komsomolets » de la 41e brigade de vedettes lance-missiles de la Flotte de la mer Noire de l'URSS. Construit à Leningrad au chantier naval Diamond sous le numéro de construction 404."
 BUL_screen_hull_heavy_2:0 "Projet 1241.2E 'Molniya-2'"
 BUL_screen_hull_heavy_2_short:0 "Projet 1241.2E"
 BUL_screen_hull_heavy_2_desc:0 "Anciens navires soviétiques MPK-46 et MPK-124 de la Flotte de la mer Noire. L'équipement électronique de ces navires comprend des radars de détection de cibles de surface et aériennes « Mius » et « Raid », un radar de conduite de tir MR-123 « Vympel-AM », un système de détection de cibles sous la quille GAS MGK-345 « Bronze » et un système de détection de cibles en descente, ainsi qu'un système de tir à dipôle. Réflecteurs PK-16."
 BUL_screen_hull_heavy_3:0 "Projet 1159"
 BUL_screen_hull_heavy_3_short:0 "Projet 1159"
 BUL_screen_hull_heavy_3_desc:0 "Ancien TFR « Dolphin », portant initialement le numéro tactique 690, puis 696. Livré à la Bulgarie le 22 décembre 1989. En février 1990, le navire a été incorporé dans la Marine bulgare sous le numéro tactique 11 et a reçu le nom de « Brave »."
 BUL_screen_hull_heavy_4:0 "K-90"
 BUL_screen_hull_heavy_4_short:0 "K-90"
 BUL_screen_hull_heavy_4_desc:0 "La corvette du projet K-90 a un déplacement de 1 700 tonnes, une longueur de 91,2 m et une largeur de 13,2 m. Elle est équipée d'un groupe motopropulseur diesel à deux arbres, lui permettant d'atteindre une vitesse maximale de 24 nœuds. Son autonomie de croisière est de 4 500 milles à une vitesse économique de 14 nœuds. Son autonomie est de 20 jours. L'équipage régulier est composé de 65 personnes. L'armement comprend des missiles antinavires (MBDA Exocet MM40) et des missiles antiaériens à courte portée (MBDA VL-MICA), ainsi qu'une installation d'artillerie universelle de 76 mm Oto Melara Super Rapid, un complexe d'artillerie antiaérienne de 35 mm Rheinmetall Oerlikon Millennium et deux mitrailleuses télécommandées de 12,7 mm."
 BUL_screen_hull_medium_0:0 "Projet 122bis"
 BUL_screen_hull_medium_0_short:0 "Projet 122bis"
 BUL_screen_hull_medium_0_desc:0 "Les navires construits dans le cadre de ce projet constituent une évolution du projet 122A, les armes anti-sous-marines et les équipements électroniques ayant subi des modifications importantes. Les anciens navires soviétiques BO-160 et BO-162 de la Flotte de la mer Noire ont été transférés à la Bulgarie en 1957."
 BUL_screen_hull_medium_1:0 "Projet 201M"
 BUL_screen_hull_medium_1_short:0 "Projet 201M"
 BUL_screen_hull_medium_1_desc:0 "Les navires de ce projet sont destinés à remplacer ceux construits dans le cadre du projet 122bis ; leur armement a été considérablement renforcé. Il s’agit du tout dernier projet de chasseurs de sous-marins de la marine soviétique. Ils ont été construits au chantier naval Zaliv de Kertch après l’adoption, en 1961, du décret du Conseil des ministres de l’URSS concernant la fourniture de navires de ce type à la Bulgarie. Au début de l'année 1962, six MPK (numéros de construction 549 à 554) ont été mis en chantier, puis transférés l'année suivante en Bulgarie, dans la ville de Sozopol."
 BUL_screen_hull_medium_2:0 "Projet 204"
 BUL_screen_hull_medium_2_short:0 "Projet 204"
 BUL_screen_hull_medium_2_desc:0 "Anciens petits navires anti-sous-marins soviétiques, construits selon le projet 204. L'idée de créer un navire anti-sous-marin spécialisé à grande vitesse et à déplacement limité a vu le jour au sein de la marine soviétique dans les années 50-60, lorsque de nouvelles générations de sous-marins ont fait leur apparition dans les flottes occidentales."
 BUL_screen_hull_medium_3:0 "Projet 205 'Tsunami'"
 BUL_screen_hull_medium_3_short:0 "Projet 205"
 BUL_screen_hull_medium_3_desc:0 "Les radars suivants ont été installés sur les navires de guerre : un mât radar, un équipement de reconnaissance « ami-ennemi » (interrogateur « Nickel » et répondeur « Nichrom-RM »), ainsi qu'un système de commande par circuit imprimé (PLC) pour le contrôle du canon AK-230 MR-104 « Lynx »."
 BUL_screen_hull_medium_4:0 "Projet 206"
 BUL_screen_hull_medium_4_short:0 "Projet 206"
 BUL_screen_hull_medium_4_desc:0 "Ces navires ont été acquis par l'URSS dans le cadre du programme de réforme et de modernisation des effectifs de la marine bulgare. Ils devaient constituer la principale force de frappe de la flotte dans la zone côtière, et, conjointement avec les vedettes lance-missiles, ils étaient destinés à frapper les unités de débarquement ennemies, à effectuer des missions de reconnaissance en surface et à viser les vedettes lance-missiles."
 BUL_sub_hull_small_single_0:0 "Série M type XV"
 BUL_sub_hull_small_single_0_short:0 "Série M type XV"
 BUL_sub_hull_small_single_0_desc:0 "Anciens sous-marins soviétiques M-202, M-203 et M-204 de la dernière série XV. Conçus pour assurer la défense des côtes et des bases navales. Conformément à un accord conclu avec la Bulgarie, les équipages sont arrivés à Odessa en 1948 afin de se préparer à la réception des sous-marins. Ceux-ci ont été officiellement remis à la marine bulgare le 18 août 1954. Ces sous-marins n'ont pas reçu de nom au sein de la marine bulgare. Ils naviguent sous des numéros tactiques."
 BUL_sub_hull_small_single_1:0 "Projet 613"
 BUL_sub_hull_small_single_1_short:0 "Projet 613"
 BUL_sub_hull_small_single_1_desc:0 "Anciens sous-marins soviétiques S-244 et S-245. Ils ont été intégrés à la marine bulgare en 1958 sous les numéros tactiques n° 41 « Slava » et n° 42 « Pobeda » afin de remplacer trois sous-marins de type « M ». Ces deux sous-marins font partie de la 8e division de sous-marins nouvellement formée. C'est pour la première fois à bord de ces sous-marins que les marins bulgares ont commencé à patrouiller le Bosphore. Ils ont été retirés de la flotte en 1972."
 BUL_sub_hull_small_single_2:0 "Projet 633"
 BUL_sub_hull_small_single_2_short:0 "Projet 633"
 BUL_sub_hull_small_single_2_desc:0 "Anciens sous-marins soviétiques S-57, S-212, S-36 et S-38 de la Flotte de la mer Noire de l'URSS. Ils ont rejoint la marine bulgare en 1972."