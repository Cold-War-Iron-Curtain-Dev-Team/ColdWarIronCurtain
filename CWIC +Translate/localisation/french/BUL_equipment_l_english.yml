 BUL_light_sp_artillery_equipment_3_short:0 "2S1 Gvozdika"
 BUL_light_sp_artillery_equipment_3_desc:0 "Depuis 1979, l'obusier automoteur de 122 mm 2S1 \"Gvozdika\" basé sur le MT-LB est produit en Bulgarie. La production bulgare de l'ACS 2S1 est entrée en service dans l'armée soviétique."
