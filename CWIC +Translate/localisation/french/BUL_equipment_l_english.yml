 BUL_fighter_equipment_0:0 "Voennovazdushni sili"
 BUL_fighter_equipment_0_short:0 "VS"
 BUL_fighter_equipment_0_desc:0 "L'Armée de l'air bulgare est l'une des trois branches de l'armée bulgare, les deux autres étant la Marine bulgare et les forces terrestres bulgares. Sa mission est de garder et de protéger la souveraineté de l'espace aérien bulgare et, conjointement avec les autres branches, de protéger l'intégrité territoriale. L'Armée de l'air bulgare est l'une des plus anciennes forces aériennes d'Europe et du monde. Ces derniers temps, il a participé activement à de nombreuses missions et exercices de l'OTAN en Europe."
 BUL_fighter_equipment_1:0 "Dewoitine D.520"
 BUL_fighter_equipment_1_short:0 "D.520"
 BUL_fighter_equipment_2:0 "Messerschmitt Bf 109G-2 'Strela'"
 BUL_fighter_equipment_2_short:0 "Bf 109G-2 'Strela'"
 BUL_fighter_equipment_3:0 "Yakovlev Yak-9U"
 BUL_fighter_equipment_3_short:0 "Yak-9U"
 BUL_fighter_equipment_3_desc:0 "En mars 1945, l'Armée de l'air bulgare a reçu 120 chasseurs Yak-9 de diverses modifications (Yak-9D, Yak-9DD, Yak-9M et Yak-9U)."
 BUL_jet_multirole_equipment_1:0 "Yakovlev Yak-23"
 BUL_jet_multirole_equipment_1_short:0 "Yak-23"
 BUL_jet_multirole_equipment_2:0 "Mikoyan-Gurevich MiG-15"
 BUL_jet_multirole_equipment_2_desc:0 "Peut - être l'un des combattants les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a été impliqué dans de nombreux conflits depuis son introduction dans la guerre de Corée, où il s'est avéré un adversaire digne des F-86 Sabre et F9F Panther américains. Une section de la frontière entre la Corée et la Chine a été surnommée Mig Alley en raison de leur prévalence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Alors que la plupart des avions ont été mis hors service dans les années 1950, certains restent encore en service dans l'Armée de l'air nord-coréenne."
 BUL_jet_multirole_equipment_2_short:0 "MiG-15"
 BUL_jet_multirole_equipment_3:0 "Mikoyan-Gurevich MiG-17"
 BUL_jet_multirole_equipment_3_desc:0 "Successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence dans l'armée de l'air chinoise sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, en Afrique, en Europe et en Asie. Son premier déploiement au combat a eu lieu en 1958, lorsque des MiG de la République populaire de Chine ont affronté des F-86 Sabre chinois nationalistes au-dessus du détroit de Taiwan. Cependant, le MiG-17 a principalement été utilisé pendant la guerre du Vietnam par la NVAF et la PLAAF, où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même tenu tête aux chasseurs américains Phantom II, beaucoup plus modernes et supersoniques, pendant la guerre du Vietnam. Le MiG-17 a été généralement retiré du service dans les années 1970, mais il reste encore en service de manière limitée dans certains pays africains et en Corée du Nord."
 BUL_jet_multirole_equipment_3_short:0 "MiG-17"
 BUL_jet_multirole_equipment_4:0 "Mikoyan-Gurevich MiG-19"
 BUL_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de fabrication soviétique capable d'atteindre une vitesse supersonique en vol horizontal. Son équivalent américain dans la « série Century » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les McDonnell Douglas F-4 Phantom II et Republic F-105 Thunderchief, plus modernes, au-dessus du Nord-Vietnam."
 BUL_jet_multirole_equipment_4_short:0 "MiG-19"
 BUL_jet_multirole_equipment_5:0 "Mikoyan-Gurevich MiG-21F-13"
 BUL_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, équipé de missiles à portée au-delà du champ visuel et d'un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, notamment en Chine et en Inde où il a été construit en grand nombre sous licence. Plus de 11 000 exemplaires ont été construits, servant dans plus de 60 pays sur les 5 continents. Au cours de sa durée de vie, le MiG-21 a abattu 240 avions ennemis. Le MiG-21 a été utilisé dans de nombreux conflits, notamment au Vietnam (où il a remporté un énorme succès), lors de la guerre indo-pakistanaise de 1971, lors de la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il est toujours en service après plus de six décennies."
 BUL_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 BUL_jet_multirole_equipment_6:0 "Mikoyan-Gurevich MiG-21PF"
 BUL_jet_multirole_equipment_6_desc:0 "Version de série de l'intercepteur tout temps. Ces appareils étaient équipés du turboréacteur R11F2-300 et, à partir du septième lot de production, du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T, également appelé RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 afin de permettre l'utilisation du missile air-air à guidage laser RS-2US (alias K-5MS) en plus du missile à guidage infrarouge K-13."
 BUL_jet_multirole_equipment_6_short:0 "MiG-21PF"
 BUL_jet_multirole_equipment_7:0 "Mikoyan-Gurevich MiG-23M"
 BUL_jet_multirole_equipment_7_desc:0 "Le MiG-23 a été le premier chasseur soviétique à être équipé d'un radar à balayage vers le bas et à tirer vers le bas, et l'un des premiers à être armé de missiles à portée au-delà du champ visuel. Sa production a débuté en 1969 et a atteint des chiffres importants avec plus de 5 000 appareils construits, ce qui en fait l'avion à ailes à géométrie variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service de manière limitée chez certains clients à l'exportation."
 BUL_jet_multirole_equipment_7_short:0 "MiG-23M"
 BUL_jet_multirole_equipment_8:0 "Mikoyan-Gurevich MiG-23ML"
 BUL_jet_multirole_equipment_8_desc:0 "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment en termes de résistance et de fiabilité de la cellule, de performances du moteur, de maniabilité et de performances radar. Une refonte considérable de la cellule a été effectuée, donnant naissance au MiG-23ML."
 BUL_jet_multirole_equipment_8_short:0 "MiG-23ML"
 BUL_jet_multirole_equipment_9:0 "Mikoyan-Gurevich MiG-23MLD"
 BUL_jet_multirole_equipment_9_desc:0 "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de cette mise à niveau était d'améliorer la maniabilité, en particulier lors d'angles d'attaque élevés, qui étaient considérés comme le principal défaut du MiG-23M/ML. La perche pitot était équipée de générateurs de tourbillons, et les bords d'attaque dentelés des ailes étaient également conçus pour agir comme des générateurs de tourbillons. Le système de commande de vol intégrait le dispositif de butée synthétique SOS-3-4 et le limiteur de signaux."
 BUL_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 BUL_jet_multirole_equipment_10:0 "Mikoyan-Gurevich MiG-29A"
 BUL_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le bureau d'études Mikoyan. Il s'agit du premier chasseur de quatrième génération à avoir été mis en service par l'URSS et le bloc de l'Est. Il intègre une avionique améliorée et des capacités radar considérablement renforcées. Les premiers MiG-29 ont été utilisés comme avions d'entraînement par le Pacte de Varsovie, avec des exportations limitées vers l'Inde, mais leur utilisation au combat était restreinte. Le MiG-29 allait plus tard servir de base à des variantes largement produites, telles que le MiG-29S, le MiG-29M et le MiG-35."
 BUL_jet_multirole_equipment_10_short:0 "MiG-29A"
 BUL_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29M"
 BUL_mr_stealth_fighter_equipment_1_short:0 "MiG-29M"
 BUL_mr_stealth_fighter_equipment_1_desc:0 "L'avion MiG-29M/M2 est une version révisée du MiG-29 de base. Il offre une capacité multirôle plus robuste grâce à une utilisation améliorée des armes air-air et air-sol de haute précision. Il dispose également d'une autonomie de combat considérablement accrue, grâce à une augmentation de sa capacité interne en carburant. Quelques modifications ont été apportées au cours du développement de l'avion. La cellule redessinée a été construite à partir d'un alliage léger d'aluminium et de lithium afin d'augmenter le rapport poussée/poids. La géométrie des rampes d'admission d'air a été revue, les persiennes d'admission supérieures ont été supprimées afin de laisser place à davantage de carburant dans les LERX, des grilles ont été installées pour empêcher les dommages causés par des objets étrangers (FOD) et les dimensions des entrées ont été agrandies pour permettre un débit d'air plus important."
 BUL_heavy_fighter_equipment_1:0 "Yakovlev Yak-9T"
 BUL_heavy_fighter_equipment_1_short:0 "Yak-9T"
 BUL_heavy_fighter_equipment_2:0 "Petliakov Pe-2"
 BUL_heavy_fighter_equipment_2_short:0 "Pe-2"
 BUL_jet_interceptor_equipment_3:0 "Mikoyan-Gurevich MiG-17PF"
 BUL_jet_interceptor_equipment_3_desc:0 "Version intercepteur tout temps équipée d'un radar Izumrud, de 3 canons NR-23 de 23 mm et d'un moteur VK-1F."
 BUL_jet_interceptor_equipment_3_short:0 "MiG-17PF"
 BUL_jet_interceptor_equipment_7:0 "Mikoyan-Gurevich MiG-25P"
 BUL_jet_interceptor_equipment_7_desc:0 "Le Mikoyan-Gurevich MiG-25 Foxbat est peut-être l'un des avions soviétiques les plus influents de l'histoire. Le premier prototype du MiG-25 a pris son envol au début de l'année 1964 et est officiellement entré en service en 1970. Au cours de sa durée de vie, plus de 1 150 appareils ont été construits et vendus à de nombreux pays, dont la Syrie, l'Irak et l'Inde. Cet avion a été conçu pour intercepter rapidement et à une vitesse fulgurante des avions volant à très haute altitude, tels que les U-2 et les B-58. Il a permis à l'Union soviétique d'exercer un contrôle sans précédent sur son propre espace aérien lointain. Il est encore aujourd'hui en service limité dans l'armée de l'air russe."
 BUL_jet_interceptor_equipment_7_short:0 "MiG-25P"
 BUL_CAS_equipment_1:0 "Junkers Ju 87A 'Sztuka'"
 BUL_CAS_equipment_1_short:0 "Ju 87A 'Sztuka'"
 BUL_CAS_equipment_2:0 "Ilyushin Il-2"
 BUL_CAS_equipment_2_short:0 "IL-2"
 BUL_CAS_equipment_2_desc:0 "En 1945, l'Armée de l'air bulgare a reçu 120 avions d'attaque Il-2 et 10 avions d'entraînement Il-2U. Les avions ont été utilisés jusqu'en 1954."
 BUL_CAS_equipment_3:0 "Ilyushin Il-10"
 BUL_CAS_equipment_3_short:0 "Il-10"
 BUL_CAS_equipment_3_desc:0 "En 1947, le premier avion d'attaque Ilyushin est arrivé, Il-10 et Il-10M. Dans la période 1953-54, la Bulgarie a fourni des copies de l'Il-10-Avia B-33 produites en Tchécoslovaquie sous licence soviétique, armées de quatre canons d'avion NS-23RM (150 cartouches par baril)."
 BUL_CAS_equipment_4:0 "Avia B-33"
 BUL_CAS_equipment_4_short:0 "B-33"
 BUL_CAS_equipment_4_desc:0 "Développé à partir de l'Il-2 Sturmovik, l'Il-10 a été conçu dans le but de remédier à bon nombre des défauts de l'Il-2. L'objectif principal était d'augmenter la vitesse et la maniabilité à basse altitude, principalement pour échapper à l'artillerie antiaérienne de petit calibre, qui constituait la principale menace pour les avions d'attaque au sol. Entré en service en janvier 1945, l'Il-10 a participé à certaines des dernières opérations de combat en Europe et à la brève intervention soviétique dans la guerre du Pacifique. Lorsque l'Il-10 a été retiré du service soviétique en 1956, l'armée de l'air a délaissé les avions de soutien aérien rapproché et d'attaque au sol au profit des chasseurs-bombardiers. Son nom de code OTAN est Beast."
 BUL_jet_CAS_equipment_1:0 "Ilyushin Il-10M"
 BUL_jet_CAS_equipment_1_short:0 "Ilyushin Il-10M"
 BUL_jet_CAS_equipment_1_desc:0 "En 1947, le premier avion d'attaque Ilyushin est arrivé, Il-10 et Il-10M. Dans la période 1953-54, la Bulgarie a fourni des copies de l'Il-10-Avia B-33 produites en Tchécoslovaquie sous licence soviétique, armées de quatre canons d'avion NS-23RM (150 cartouches par baril)."
 BUL_jet_CAS_equipment_2:0 "Yakovlev Yak-23Y"
 BUL_jet_CAS_equipment_2_short:0 "Yak-23Y"
 BUL_jet_CAS_equipment_2_desc:0 "Impact version Yak-23."
 BUL_jet_CAS_equipment_3:0 "Mikoyan-Gurevich MiG-17AC"
 BUL_jet_CAS_equipment_3_short:0 "MiG-17AC"
 BUL_jet_CAS_equipment_3_desc:0 "Un chasseur-bombardier capable de tirer divers roquettes non guidées. À la fin des années 50, un grand nombre de MiG-17 équipés de lanceurs NAR ont été transférés vers les régiments de chasseurs-bombardiers nouvellement créés."
 BUL_jet_CAS_equipment_6:0 "Sukhoi Su-22"
 BUL_jet_CAS_equipment_6_short:0 "Su-22"
 BUL_jet_CAS_equipment_6_desc:0 "Le Sukhoi Su-17 Fitter-C était une version améliorée de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers les forces aériennes du bloc de l'Est, des pays arabes et d'Amérique du Sud. Le Su-17 apportait des améliorations dans presque tous les domaines par rapport à son prédécesseur, notamment au niveau des capteurs, des performances de vol, de la charge utile, de l'autonomie et du balayage variable des ailes. De 1969 à 1990, 2 867 appareils ont été produits et utilisés dans 30 pays, dont 6 utilisent encore cet avion aujourd'hui."
 BUL_jet_CAS_equipment_7:0 "Mikoyan-Gurevich MiG-23BN"
 BUL_jet_CAS_equipment_7_desc:0 "(« Flogger-H ») Version améliorée du MiG-23B, le MiG-23BN se distinguait par ses ailes de troisième génération et son moteur R-29, caractéristiques des chasseurs contemporains, ainsi que par des améliorations mineures au niveau de l'électronique et des équipements. L'autre différence majeure résidait dans la suppression de la tête diélectrique présente sur le MiG-23B. Produit de 1973 à 1985, 624 MiG-23BN furent construits, mais seul un petit nombre servit au sein des forces aériennes vietnamiennes, le reste étant exporté."
 BUL_jet_CAS_equipment_7_short:0 "MiG-23BN"
 BUL_jet_CAS_equipment_8:0 "Sukhoi Su-25K"
 BUL_jet_CAS_equipment_8_short:0 "Su-25K"
 BUL_jet_CAS_equipment_8_desc:0 "Le Sukhoi Su-25 Frogfoot est un avion d'attaque au sol bimoteur développé en Union soviétique. Il a effectué son premier vol en 1975 et a été mis en service en 1981. Depuis 1978, plus de 1 000 exemplaires ont été produits. Cet avion a connu un grand succès à l'étranger, où il a été vendu à 29 pays. Le Su-25 a ainsi participé à plusieurs conflits, notamment la guerre soviétique en Afghanistan, la guerre Iran-Irak et la guerre du Golfe. Il est toujours en service dans tous les pays importateurs."
 BUL_cas_stealth_equipment_1:0 "Sukhoi Su-25SM"
 BUL_cas_stealth_equipment_1_short:0 "Su-25SM"
 BUL_cas_stealth_equipment_1_desc:0 "Le Su-25SM (Stroyevoy Modernizirovannyi) est un programme de mise à niveau \"abordable\" du Su-25, conçu par l'Armée de l'air russe en 2000. Le programme découle des tentatives de mise à niveau des Su-25T et Su-25TM, qui ont été évaluées et qualifiées de trop sophistiquées et coûteuses. La mise à niveau SM intègre des améliorations avioniques et une remise à neuf de la cellule pour prolonger la durée de vie du Frogfoot jusqu'à 500 heures de vol ou de 5 ans. La toute nouvelle suite de navigation/attaque PRnK-25SM \"Bars\" du Su-25SM est construite autour du système informatique numérique BTsVM-90, initialement prévu pour le programme de mise à niveau du Su-25TM. La précision de navigation et d'attaque fournie par la nouvelle suite est trois fois supérieure à celle de la ligne de base Su-25 et se situerait à moins de 15 m en utilisant la correction satellite et à 200 m sans elle."
 BUL_tac_bomber_equipment_0:0 "Aero B-158"
 BUL_tac_bomber_equipment_0_short:0 "B-158"
 BUL_tac_bomber_equipment_1:0 "Aero A.304"
 BUL_tac_bomber_equipment_1_short:0 "A.304"
 BUL_tac_bomber_equipment_3:0 "Tupolev Tu-2"
 BUL_tac_bomber_equipment_3_short:0 "Tu-2"
 BUL_jet_tac_bomber_equipment_2:0 "Ilyushin Il-28"
 BUL_jet_tac_bomber_equipment_2_short:0 "Il-28"
 BUL_jet_tac_bomber_equipment_3:0 "Ilyushin Il-28P"
 BUL_jet_tac_bomber_equipment_3_short:0 "Il-28P"
 BUL_jet_light_equipment_1:0 "Yakovlev Yak-11"
 BUL_jet_light_equipment_1_short:0 "Yak-11"
 BUL_jet_light_equipment_1_desc:0 "Outre les avions de combat, l'URSS a également fourni à la Bulgarie des avions d'entraînement Yak-11."
 BUL_jet_light_equipment_2:0 "Laz-7"
 BUL_jet_light_equipment_2_short:0 "Laz-7"
 BUL_jet_light_equipment_2_desc:0 "Parallèlement, le développement de ses propres avions bulgares s'est poursuivi. Ainsi, depuis 1948, 160 avions d'entraînement Laz-7, conçus par l'ingénieur Ivan Lazarov, ont été produits. De plus, outre son utilisation comme appareil d'entraînement, le Laz-7 a été mis en service au sein de deux divisions de bombardiers légers de nuit, créées sur le modèle des unités soviétiques équipées de U-2 (Po-2)."
 BUL_jet_light_equipment_3:0 "Aero L-29 Delfin"
 BUL_jet_light_equipment_3_short:0 "L-29 Delfin"
 BUL_jet_light_equipment_3_desc:0 "Dans le cadre de leur formation, entre 1963 et 1974, les Bulgares ont reçu 102 Aero L-29 Delfin tchécoslovaques, qui sont restés en service jusqu'en 2002."
 BUL_jet_light_equipment_4:0 "Laz-14"
 BUL_jet_light_equipment_4_short:0 "Laz-14"
 BUL_jet_light_equipment_4_desc:0 "Le Laz-14 est un avion d'entraînement à réaction monomoteur biplace destiné à la formation initiale et au soutien à la formation des pilotes. L'installation prévue d'armement lui permettrait d'effectuer certaines missions de combat."
 BUL_jet_light_equipment_5:0 "Aero L-39ZA Albatros"
 BUL_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 BUL_jet_light_equipment_5_desc:0 "Une trentaine d'avions Aero L-39 Albatros tchécoslovaques ont été livrés à des fins de formation."
 BUL_recon_equipment_0:0 "KB-11 Fazan"
 BUL_recon_equipment_0_short:0 "KB-11 Fazan"
 BUL_recon_equipment_0_desc:0 "Le Kaproni Bulgarski KB-11 a été utilisé pour remplacer les Letov Š-328 et les PZL P.43 au sein des escadrons de reconnaissance à courte portée de l'armée de l'air bulgare, équipant ainsi quatre escadrons."
 BUL_jet_recon_equipment_0:0 "Mikoyan-Gurevich MiG-15Rbis"
 BUL_jet_recon_equipment_0_short:0 "MiG-15Rbis"
 BUL_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, l'OKB MiG a commencé à développer une variante de reconnaissance de première ligne du MiG-15 équipée d'une caméra AFA-BA/40, qui offre une largeur de balayage de 0,9 à 4,5 km avec une longueur de parcours photographique de 90 à 450 km à des altitudes comprises entre 2 000 et 10 000 m. Un seul canon NR-23 était installé sur l'avion. Afin d'augmenter l'autonomie du reconnaissance, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur « Barium-M » et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur l'appareil."
 BUL_jet_recon_equipment_1:0 "Mikoyan-Gurevich MiG-25RB"
 BUL_jet_recon_equipment_1_short:0 "MiG-25RB"
 BUL_jet_recon_equipment_1_desc:0 "MiG-25RB - avion de reconnaissance opérationnel monoplace toutes altitudes - bombardier. Les essais ont été achevés en décembre 1970. L'avion était équipé de 2 à 4 caméras de reconnaissance générale A-70M et d'une caméra topographique AFA-E/10. L'équipement photographique était logé dans cinq compartiments situés au bas du fuselage avant. Une station SIGINT appelée SPS-4A ou B « Virage » a également été installée, fonctionnant dans différentes gammes de fréquences. Équipement spécial - station de brouillage radio actif SPS-141."
