l_english:
 truman_speech_category:0 "Discours du président Truman à la nation"
 truman_speech_category_desc:0 "Après la défaite du fascisme, une autre menace se profile : l’expansion du communisme. Le président Truman se mobilise pour les nations libres, défend la liberté et lutte contre l’agression communiste."
 truman_address_korean_war:0 "Aborder la guerre de Corée"
 truman_address_korean_war_desc:0 "Le dimanche 25 juin, les forces communistes ont attaqué la République de Corée. Cette attaque a clairement démontré, sans aucun doute, que le mouvement communiste international est prêt à utiliser l'invasion armée pour conquérir des nations indépendantes. Un acte d'agression comme celui-ci crée un danger très réel pour la sécurité de toutes les nations libres. L'invasion communiste a été lancée avec une grande force, comprenant des avions, des tanks et de l'artillerie. L'ampleur de l'attaque et la rapidité avec laquelle elle a été suivie montrent de manière évidente qu'elle avait été planifiée depuis longtemps. Cinquante-deux des 59 pays membres des Nations Unies ont apporté leur soutien à l'action prise par le Conseil de sécurité pour restaurer la paix en Corée. Sous le drapeau des Nations Unies, un commandement unifié a été établi pour toutes les forces des membres des Nations Unies combattant en Corée. Le général Douglas MacArthur est le commandant de cette force combinée. L'action rapide des Nations Unies pour réprimer l'agression illégale, et la réponse rapide de peuples libres à travers le monde à cette action, constitueront un repère dans la longue quête de l'humanité pour un état de droit entre les nations. De plus, le fait que les forces communistes aient envahi la Corée est un avertissement qu'il pourrait y avoir des actes d'agression similaires dans d'autres parties du monde. Les nations libres doivent être plus que jamais sur leurs gardes contre ce genre d'attaque sournoise."
 truman_dismiss_macarthur:0 "Annoncer la raison du licenciement de Douglas MacArthur"
 truman_dissmiss_macarthur_desc:0 "Je crois que nous devons essayer de limiter la guerre à la Corée pour ces raisons vitales : veiller à ce que les précieuses vies de nos soldats ne soient pas gaspillées ; garantir que la sécurité de notre pays et du monde libre ne soit pas inutilement mise en danger ; et prévenir une troisième guerre mondiale. Plusieurs événements ont rendu évident que le général MacArthur n'était pas d'accord avec cette politique. J'ai donc jugé essentiel de relever le général MacArthur afin qu'il n'y ait aucun doute ni confusion quant au véritable but et objectif de notre politique. C'est avec un profond regret personnel que je me suis vu contraint de prendre cette décision. Le général MacArthur est l'un de nos plus grands commandants militaires. Mais la cause de la paix mondiale est bien plus importante que n'importe quel individu. Le changement de commandement en Extrême-Orient ne signifie aucun changement dans la politique des États-Unis. Nous poursuivrons le combat en Corée avec vigueur et détermination dans le but de mettre fin rapidement et avec succès à la guerre. Le nouveau commandant, le général de division Matthew Ridgway, a déjà démontré qu'il possède les grandes qualités de leadership militaire nécessaires pour cette tâche. La guerre peut éclater si les dirigeants communistes le souhaitent. Mais cette nation et ses alliés ne seront pas responsables de son déclenchement. Nous ne voulons pas élargir le conflit. Nous déploierons tous les efforts nécessaires pour prévenir ce désastre. Et ce faisant, nous savons que nous suivons les grands principes de paix, de liberté et de justice."
 truman_against_communism:0 "Parler contre l'agression communiste"
 truman_against_communism_desc:0 "Le monde libre doit disposer de forces armées, le monde libre doit les avoir maintenant ! Pas en réserve, pas plus tard, mais maintenant ! En tant que votre président, je vous dis que les dangers dans d'autres parties du monde sont aussi grands qu'ils le sont en Corée. Chaque jour, des rapports arrivent sur mon bureau concernant les préparatifs militaires soviétiques à travers le monde. Si l'un d'entre vous pouvait voir ces rapports et recevoir les mêmes informations, vous abandonneriez toute idée que le danger est passé. Nous ne pouvons pas relâcher notre vigilance, peu importe ce qui se passe en Corée. Nous devons avoir des hommes, des navires, des avions, des tanks et des bombes prêts pour toute urgence, et si nous les avons, nous devrons les utiliser !"
 truman_speech_congress:0 "Parler au Congrès"
 cancel_berlin_airlift:0 "Annuler le pont aérien de Berlin"
 cancel_berlin_airlift_desc:0 "Le pont aérien de Berlin s'est avéré coûteux et inefficace. Les Soviétiques ne céderont pas d'un pouce, car il ne les affecte pas autant que le gouvernement allemand légitime ! Mettons fin à cela."
 truman_speech_congress_desc:0 "La paix est notre objectif, pas la paix à n'importe quel prix, mais une paix fondée sur la liberté et la justice. Cette année 1952 est une année cruciale dans l'effort de défense du monde libre tout entier. Si nous hésitons, nous risquons de perdre tous les progrès que nous avons réalisés. La menace d'une guerre mondiale est encore bien réelle. Nous avons eu un Pearl Harbor, ne nous laissons pas prendre au dépourvu une nouvelle fois. Notre type de gouvernement, plus que tout autre, ne peut tolérer l'honnêteté parmi les serviteurs publics. J'ai l'intention de faire en sorte que les employés fédéraux coupables de mauvaise conduite soient punis pour cela. Avançons en ayant confiance dans le Dieu de la paix pour atteindre l'objectif que nous cherchons."
 cancel_berlin_blockade:0 "Annuler le blocus de Berlin"
 annex_west_berlin:0 "Annexer Berlin-Ouest"
 maintain_airlift:0 "Maintenir le pont aérien de Berlin"
 suspend_deutsche_mark:0 "Récemment, le Deutsche Mark occidental a été suspendu."
 annex_west_berlin_desc:0 "Maintenant que Berlin est une ville libre, il serait sage de l’intégrer à la RDA !"
 cancel_berlin_blockade_desc:0 "Le camarade Staline a jugé sage de mettre fin au blocus de Berlin ! Ces efforts de paix et de compréhension seront, espérons-le, perçus comme des signes de paix venant de l'Union soviétique !"