 WW3_news.5.t: "[GetNewspaperHeader] Des explosions nucléaires à travers l'Europe"
 WW3_news.5.d: "Partout dans le monde, la population est sous le choc et horrifiée alors que les informations confirment la première explosion d'une arme nucléaire depuis Hiroshima et Nagasaki. Alors que la Troisième Guerre mondiale fait rage, les forces de l'OTAN poursuivent leur avancée implacable, poussant l'Union soviétique à lancer officiellement la première attaque nucléaire du conflit dans le cadre de l'opération « Étoile rouge ». Cette frappe visait [insert dynamic information about the specific country and target], un État non nucléaire. Les craintes d'une guerre nucléaire mondiale à grande échelle ont atteint des niveaux sans précédent depuis le début de la Troisième Guerre mondiale. \n\nAlors que cette attaque a suscité une condamnation quasi unanime, Moscou insiste sur le fait qu'il s'agissait d'une action nécessaire entreprise au nom de la survie nationale. Washington et le reste de l'OTAN y voient une tentative désespérée de renverser le cours de la guerre. Il n'est pas certain que les États-Unis riposteront à cette attaque nucléaire avec une force équivalente ; certains responsables de l'OTAN estiment même que des négociations de paix sont essentielles pour empêcher une nouvelle escalade nucléaire. Cependant, une chose est claire : l'horloge avance vers minuit tandis que les familles du monde entier se préparent au pire."
 WW3_news.5.a: "Que Dieu nous vienne en aide..."
 WW3_ME.1.t: "Le massacre de Jérusalem-Est"
 WW3_ME.1.d: "Alors que le monde est en feu, il semble que même le Levant n’ait pas été épargné par Midnight. Les manifestations se sont finalement étendues à la Cisjordanie, tandis que la Jordanie concentrait ses troupes à la frontière israélienne et que les craintes d’une éventuelle annexion de la Cisjordanie par Israël s’intensifiaient. Comme l’avaient prédit les manifestants, les forces israéliennes ont commencé à se déployer à Jérusalem-Est pour assurer la « sécurité » de l’État d’Israël. Les responsables israéliens eux-mêmes minimisent même le nombre de soldats qu’ils ont réellement envoyés.\n\nLorsque les forces israéliennes sont finalement arrivées aujourd’hui, la panique et les émeutes se sont propagées dans toute la Cisjordanie, suscitant la colère face à la tentative d’Israël d’assurer sa souveraineté sur la Cisjordanie. En quelques minutes, les manifestants ont lancé des bombes incendiaires et des pierres sur les soldats israéliens, à qui on avait demandé de limiter leurs actions autant que possible. Mais, surgissant de nulle part comme l’ancien Second Temple, des coups de feu, tels des cloches, ont commencé à retentir au-dessus de la foule.\n\nCe jour-là, des centaines de personnes ont trouvé la mort. Mais personne ne peut dire avec certitude qui a déclenché tout cela."
 WW3_ME.1.a: "C'est la faute des Juifs !"
