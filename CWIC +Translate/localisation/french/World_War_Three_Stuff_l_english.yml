 WW3_Started: "La Troisième Guerre mondiale bat son plein."
 jap_sov.9.t: "[GetNewspaperHeader]Les combats ont pris fin à Home Island !"
 jap_sov.9.d: "À la suite du débarquement soviétique sur les îles principales du Japon, une série de combats intenses et sporadiques a éclaté, conduisant finalement à la capitulation officielle du Japon face à l'avancée de l'Armée rouge.\n\nL'empereur Hirohito, qui avait auparavant été épargné par le Commandement suprême des puissances alliées dans les années 1940 en raison de son rôle symbolique dans la culture japonaise, fait désormais l'objet d'un nouveau procès. Dans un geste historique, Hirohito a été contraint d'abdiquer et de céder le pouvoir à son fils aîné, Akihito. Akihito a été nommé président de la Diète nationale nouvellement créée. \n\nAfin de superviser la transition et l'administration des territoires occupés par le Japon, le commandant soviétique Konstantin Rokossovsky a été désigné comme administrateur par intérim. Son rôle consistera à gérer la région jusqu'à ce qu'une nouvelle constitution soit rédigée, établissant un cadre de gouvernance qui reflète les idéaux du nouveau paysage politique au Japon."
 jap_sov.9.a: "Un autre allié des États-Unis est tombé..."
 jap_sov.10.t: "[GetNewspaperHeader]La nouvelle Constitution japonaise"
 jap_sov.10.d: "Après la défaite du Japon, l'Union soviétique chargea le Parti communiste japonais de commencer à rédiger une nouvelle Constitution. Le jour arriva enfin où le Parti communiste japonais fusionna avec la faction de gauche du Parti socialiste japonais, formant ainsi un nouveau parti appelé le Parti des paysans et des travailleurs du Japon. Comme le stipulait la nouvelle Constitution, ce parti devint le seul parti légal et la force directrice de la nation.\n\nLes États-Unis et d'autres alliés de l'OTAN condamnèrent cette évolution, la considérant comme un acte d'impérialisme au Japon. Le président américain exprima son choc et sa colère à l'idée que le Japon devienne un nouvel État fantoche de l'Union soviétique.\n\nKenji Miyamoto fut élu président du nouveau parti et, par conséquent, Premier ministre du Japon. Parallèlement, le prince Akihito, fils de l'ancien empereur Hirohito, fut nommé président du Japon."
 jap_sov.10.a: "Le Soleil rouge s'est levé."
 WW3_news.1.t: "[GetNewspaperHeader]Révolution syndicaliste à Monaco !"
 WW3_news.1.d: "Il y a tout juste une semaine, la France est tombée aux mains de l'Union soviétique, semant le chaos dans le pays voisin, Monaco. Une vague de réfugiés français s'est précipitée vers cette petite nation, provoquant une série d'émeutes. Le Syndicat monégasque a organisé une manifestation en soutien au nouveau gouvernement français, tandis que le prince Rainier III semblait se ranger du côté des exilés à Alger.\n\nAu cours de cette semaine tumultueuse, Monaco a été le théâtre de pillages et d'émeutes. En conséquence, le prince de Monaco a abdiqué, laissant un vide au pouvoir. Les syndicalistes ont profité de cette situation pour abolir la monarchie et instaurer une nouvelle république."
 WW3_news.1.a: "Le pari idéologique"
