l_english:
 SOV_carrier_hull_2:0 "Projet 1143.5 Krechyet"
 SOV_carrier_hull_2_short:0 "Projet 1143.5"
 SOV_carrier_hull_2_desc:0 "La classe Kiev fut la première classe de porte-avions à voilure fixe (croiseur lourd selon la classification soviétique) construite en Union soviétique pour la marine soviétique. Les navires étaient dotés d'une grande superstructure en îlot à tribord, d'un pont d'envol incliné sur les deux tiers de la longueur totale du pont, et le pont avant était occupé par un armement lourd de missiles sol-air et sol-sol. La mission prévue de la classe Kiev était le soutien aux sous-marins lanceurs d'engins stratégiques, aux autres navires de surface et à l'aéronavale ; ils étaient capables de mener des opérations de lutte antiaérienne, anti-sous-marine et de surface."
 SOV_carrier_hull_3:0 "Projet 1143.5 Riga"
 SOV_carrier_hull_3_short:0 "Projet 1143.5"
 SOV_carrier_hull_3_desc:0 "Le porte-avions de classe Kouznetsov, désigné par l'Union soviétique Projet 1143.5, est une classe de porte-avions à voilure fixe exploitée par les marines russe et chinoise. Conçus à l'origine pour la marine soviétique, les navires de classe Kouznetsov utilisent un tremplin pour lancer des avions conventionnels hautes performances en configuration STOBAR. Cette conception représentait une avancée majeure pour l'aviation de la flotte soviétique par rapport aux porte-avions de classe Kiev, qui ne pouvaient lancer que des avions VSTOL."
 SOV_carrier_hull_4:0 "Projet 1143.6 Varyag"
 SOV_carrier_hull_4_short:0 "Project 1143.6"
 SOV_carrier_hull_4_desc:0 "Le porte-avions de classe Kouznetsov, désigné par l'Union soviétique Projet 1143.5, est une classe de porte-avions à voilure fixe exploitée par les marines russe et chinoise. Conçus à l'origine pour la marine soviétique, les navires de classe Kouznetsov utilisent un tremplin pour lancer des avions conventionnels hautes performances en configuration STOBAR. Cette conception représentait une avancée majeure pour l'aviation de la flotte soviétique par rapport aux porte-avions de classe Kiev, qui ne pouvaient lancer que des avions VSTOL."
 SOV_carrier_hull_light_0:0 "Projet 71"
 SOV_carrier_hull_light_0_short:0 "Projet 71"
 SOV_carrier_hull_light_0_desc:0 "Le projet de petit porte-avions fut abandonné en 1940. Les porte-avions de ce type furent intégrés au programme de construction navale soviétique de 1938. Des concepteurs soviétiques et étrangers collaborèrent pour créer un porte-avions plus traditionnel, aboutissant au projet 71 à la mi-1939. Ce petit porte-avions, d'un déplacement de 11 300 tonnes, devait être armé de 8 canons universels de 100 mm, de 16 canons de 37 mm et de 20 mitrailleuses de 12,7 mm."
 SOV_carrier_hull_light_1:0 "Projet 1123 Kondor"
 SOV_carrier_hull_light_1_short:0 "1123 Kondor"
 SOV_carrier_hull_light_1_desc:0 "La classe Moskva fut la première classe de porte-avions opérationnels (porte-hélicoptères selon la classification soviétique) construite par l'Union soviétique pour la marine soviétique. L'escadre aérienne était entièrement composée d'hélicoptères. Conçus principalement pour la lutte anti-sous-marine (ASM), ils disposaient d'un armement et d'un système de capteurs optimisés contre la menace des sous-marins nucléaires. Leur rôle stratégique était de défendre les bastions sous-marins lanceurs d'engins soviétiques contre les incursions des sous-marins d'attaque occidentaux, constituant ainsi les navires amiraux d'une force opérationnelle ASM."
 SOV_carrier_hull_light_2:0 "Projet 1174 Nosorog"
 SOV_carrier_hull_light_2_short:0 "Projet 1174"
 SOV_carrier_hull_light_2_desc:0 "La classe Ivan Rogov, désignée par l'Union soviétique sous le nom de Projet 1174 Nosorog (Rhino), est une classe de navires de débarquement (grands navires de débarquement selon la classification soviétique) construits en Union soviétique. Ces navires ont été construits dans le cadre du développement des capacités de guerre amphibie de la marine soviétique dans les années 1970."
 SOV_carrier_hull_light_3:0 "Projet 11780 Kherson"
 SOV_carrier_hull_light_3_short:0 "Projet 11780"
 SOV_carrier_hull_light_3_desc:0 "Le projet 11780 Kherson était un programme soviétique de porte-avions de classe Kiev des années 1980, comparable au navire d'assaut amphibie américain de classe Tarawa. Ce navire aurait eu un déplacement d'environ 25 000 tonnes, serait équipé de turbines à vapeur et aurait transporté une douzaine d'hélicoptères, quatre péniches de débarquement de classe Ondatra et deux LCAC de classe Tsaplya."
 SOV_carrier_hull_light_4:0 "Projet 23900 Ivan Rogov"
 SOV_carrier_hull_light_4_short:0 "Projet 23900"
 SOV_carrier_hull_light_4_desc:0 "Le projet 23900 est la toute nouvelle classe de navires d'assaut amphibies russes (LHD)."
 SOV_carrier_hull_super_1:0 "Projet 1160 \"Eagle\""
 SOV_carrier_hull_super_1_short:0 "1160 Eagle"
 SOV_carrier_hull_super_1_desc:0 "Premier projet soviétique de porte-avions doté d'une centrale nucléaire. Le groupe aérien du croiseur devait comprendre 60 à 70 avions. Il était initialement prévu d'équiper le navire de chasseurs MiG-23A, d'avions anti-sous-marins P-42, de bombardiers Su-24K et d'hélicoptères Ka-252. Les moyens techniques de soutien en vol devaient comprendre quatre catapultes à vapeur, des aérofinisseurs et une barrière de sécurité."
 SOV_carrier_hull_super_2:0 "Projet 1153"
 SOV_carrier_hull_super_2_short:0 "Projet 1153"
 SOV_carrier_hull_super_2_desc:0 "Ce porte-avions aurait un déplacement d'environ 72 000 tonnes, serait équipé d'une centrale nucléaire et pourrait être lancé par catapultes à vapeur, à l'instar des précédents superporte-avions de classe Kitty Hawk de l'US Navy. Contrairement à ces derniers et aux croiseurs porte-avions soviétiques précédents, il était également conçu pour offrir une importante capacité offensive ; ses affûts comprenaient 24 tubes de lancement verticaux pour missiles de croisière antinavires. En URSS, il était classé comme « grand croiseur avec armement aéronautique »."
 SOV_carrier_hull_super_3:0 "Projet 1143.7 Ulyanovsk"
 SOV_carrier_hull_super_3_short:0 "1143.7 Ulyanovsk"
 SOV_carrier_hull_super_3_desc:0 "C'était un porte-avions à voilure fixe, premier d'une classe de superporte-avions nucléaires soviétiques. Il était destiné, pour la première fois, à offrir une véritable capacité d'aviation navale hauturière à la marine soviétique. Le navire aurait été équipé de catapultes à vapeur permettant le lancement d'avions entièrement chargés."
 SOV_carrier_hull_super_4:0 "Projet 23000E \"Shtorm\""
 SOV_carrier_hull_super_4_short:0 "23000E Shtorm"
 SOV_carrier_hull_super_4_desc:0 "Projet prometteur de porte-avions lourd polyvalent russe. Conçu pour effectuer diverses missions en haute mer, ce navire sera capable de frapper des cibles terrestres et maritimes ennemies grâce à son propre armement et aux aéronefs du groupe aérien aéroporté. Il assurera également la défense aérienne grâce à ses moyens de défense aérienne et de groupe aérien, assurera la stabilité au combat et la défense aérienne des groupes de navires, ainsi que le soutien au débarquement."
 SOV_ww_capitals:0 "Classe Gangut"
 SOV_ww_capitals_short:0 "Classe Gangut"
 SOV_ww_capitals_desc:0 "Les cuirassés de classe Sébastopol, également connus sous le nom de « classe Gangut » dans les publications occidentales, furent les premiers dreadnoughts commencés pour la marine impériale russe avant la Première Guerre mondiale. Ils avaient une histoire de conception alambiquée impliquant plusieurs sociétés britanniques, des exigences en constante évolution, un concours de conception international et des protestations étrangères."
 SOV_ww_screens:0 "Projet 38 Minsk"
 SOV_ww_screens_short:0 "38 Minsk"
 SOV_ww_screens_desc:0 "Projet (type) de destroyers soviétiques de type « Leningrad », 2e série, construits au milieu des années 1930 pour la marine soviétique. Entre 1934 et 1940, trois destroyers de ce type ont été construits dans les chantiers navals soviétiques de Minsk, Bakou et Tbilissi. Les destroyers de ce projet ont participé aux batailles des flottes baltes et du Nord de la marine soviétique pendant la Grande Guerre patriotique."
 SOV_battle_hull_medium_0:0 "Classe Novorossiisk"
 SOV_battle_hull_medium_0_short:0 "Classe Novorossiisk"
 SOV_battle_hull_medium_0_desc:0 "À l'origine, le cuirassé italien Giulio Ceasare, il fut transféré à l'Union soviétique en 1949 et rebaptisé Novorossiysk (Новороссийск). Les Soviétiques l'utilisèrent également pour l'entraînement jusqu'à son naufrage en 1955, entraînant la mort de 608 hommes, suite à l'explosion d'une vieille mine allemande. Il fut renfloué l'année suivante, puis démoli."
 SOV_battle_hull_medium_1:0 "Projet 82 Stalingrad"
 SOV_battle_hull_medium_1_short:0 "Projet 82"
 SOV_battle_hull_medium_1_desc:0 "Conçus pour opérer aux côtés des croiseurs de classe Sverdlov et des porte-avions proposés, ils devaient constituer de puissantes forces opérationnelles capables de défier la flotte américaine. Pour ce faire, il fallait un navire plus puissant que celui initialement prévu, prenant la relève des Kronstadt, aujourd'hui annulés. Ils devaient repousser les attaques ennemies et protéger les porte-avions lorsque le mauvais temps empêchait les vols. Une série d'au moins quatre navires était prévue, et la construction du Stalingrad commença finalement en 1951."
 SOV_battle_hull_medium_2:0 "Projet 1164 \"Atlant\""
 SOV_battle_hull_medium_2_short:0 "1164 Atlant"
 SOV_battle_hull_medium_2_desc:0 "La classe Slava, désignée par l'Union soviétique sous le nom de Projet 1164 Atlant, est une classe de croiseurs lance-missiles conçue et construite en Union soviétique pour la marine soviétique. Initialement désignée BLACKCOM 1 (Black Sea Combatant 1), elle fut ensuite brièvement désignée classe Krasina, jusqu'à son observation en mer. Les lanceurs SS-N-12 sont fixés vers l'avant, à environ 8° d'élévation, sans possibilité de rechargement. La conception de cette classe n'ayant rien de révolutionnaire, les observateurs occidentaux ont estimé qu'elle avait été créée pour se prémunir contre l'échec de la classe Kirov, plus radicale."
 SOV_battle_hull_medium_3:0 "Projet 1144 Orlan"
 SOV_battle_hull_medium_3_short:0 "Projet 1144"
 SOV_battle_hull_medium_3_desc:0 "La classe Kirov, désignée par l'Union soviétique sous le nom de Projet 1144 Orlan (aigle de mer), est une classe de croiseurs lance-missiles à propulsion nucléaire des marines soviétique et russe. Il s'agit des plus grands et des plus lourds navires de combat de surface (autrement dit, hors porte-avions et navire d'assaut amphibie) en service au monde. Parmi les navires de guerre modernes, ils sont deuxièmes en taille après les grands porte-avions et d'une taille similaire à celle d'un cuirassé de la Première Guerre mondiale. La classification soviétique de ce type de navire est « croiseur lance-missiles à propulsion nucléaire lourd »."
 SOV_battle_hull_medium_4:0 "Projet 1164M Atlant-M"
 SOV_battle_hull_medium_4_short:0 "Projet 1164M"
 SOV_battle_hull_medium_4_desc:0 "La classe Slava, désignée par l'Union soviétique sous le nom de Projet 1164 Atlant, est une classe de croiseurs lance-missiles conçue et construite en Union soviétique pour la marine soviétique. Initialement désignée BLACKCOM 1 (Black Sea Combatant 1), elle fut ensuite brièvement désignée classe Krasina, jusqu'à son observation en mer. Les lanceurs SS-N-12 sont fixés vers l'avant, à environ 8° d'élévation, sans possibilité de rechargement. La conception de cette classe n'ayant rien de révolutionnaire, les observateurs occidentaux ont estimé qu'elle avait été créée pour se prémunir contre l'échec de la classe Kirov, plus radicale."
 SOV_battle_hull_light_0:0 "Projet 68 Chapayev"
 SOV_battle_hull_light_0_short:0 "Projet 68"
 SOV_battle_hull_light_0_desc:0 "La classe Tchapaïev (Projet 68 Чапаев) était un groupe de croiseurs construits pour la marine soviétique pendant et après la Seconde Guerre mondiale. Dix-sept navires étaient prévus, mais seuls sept furent effectivement mis en chantier avant l'invasion allemande. Deux navires incomplets furent détruits lors de la prise de leur chantier de Nikolaev par l'Allemagne nazie, et les cinq croiseurs restants ne furent achevés qu'en 1950."
 SOV_battle_hull_light_1:0 "Projet 68bis Sverdlov"
 SOV_battle_hull_light_1_short:0 "Projet 68bis"
 SOV_battle_hull_light_1_desc:0 "Les croiseurs de classe Sverdlov, désignés par l'Union soviétique sous le nom de Projet 68bis, furent les derniers croiseurs canonniers conventionnels construits pour la marine soviétique. Construits dans les années 1950, ils s'inspiraient de conceptions et de concepts soviétiques, allemands et italiens développés avant la Seconde Guerre mondiale. Ils furent modifiés pour améliorer leur tenue de mer, leur permettant de naviguer à grande vitesse dans les eaux agitées de l'Atlantique Nord. Leur coque de base était plus moderne et bénéficiait d'un blindage plus performant que la grande majorité des croiseurs canonniers construits et déployés après la Seconde Guerre mondiale par des nations comparables."
 SOV_battle_hull_light_2:0 "Projet 58 Kynda"
 SOV_battle_hull_light_2_short:0 "Projet 58"
 SOV_battle_hull_light_2_desc:0 "Les croiseurs lance-missiles du Projet 58 (Ракетные крейсера проекта 58), connus par l'OTAN sous le nom de classe Kynda et parfois appelés classe Grozny (тип «Грозный»), du nom du premier navire de la série à être construit, étaient la première génération de croiseurs lance-missiles soviétiques et représentaient une avancée considérable pour la marine soviétique."
 SOV_battle_hull_light_3:0 "Projet 1134A Berkut A"
 SOV_battle_hull_light_3_short:0 "Projet 1134A"
 SOV_battle_hull_light_3_desc:0 "La classe Kresta II, désignée par l'Union soviétique Projet 1134A Berkut A (aigle royal), était une classe de croiseurs lance-missiles (grand navire de lutte anti-sous-marine selon la classification soviétique) construits par l'Union soviétique pour la marine soviétique. L'OTAN classe cette classe comme « croiseur », principalement en raison de son système de missiles antinavires Metel (SS-N-14 Silex), capable de frapper non seulement les sous-marins, mais aussi les navires de surface."
 SOV_battle_hull_light_4:0 "Projet 1134B Berkut B"
 SOV_battle_hull_light_4_short:0 "Projet 1134B"
 SOV_battle_hull_light_4_desc:0 "La classe Kara, désignée par l'Union soviétique Projet 1134B Berkut B (aigle royal), était une classe de croiseurs lance-missiles (grands navires de lutte anti-sous-marine selon la classification soviétique) construits en Union soviétique pour la marine soviétique. L'OTAN classe cette classe comme « croiseur », principalement en raison de son système de missiles antinavires Metel (SS-N-14 Silex), capable de frapper non seulement les sous-marins, mais aussi les navires de surface."
 SOV_screen_hull_heavy_0:0 "Projet 30Bis Skory"
 SOV_screen_hull_heavy_0_short:0 "Projet 30Bis"
 SOV_screen_hull_heavy_0_desc:0 "La classe Kola était le nom officiel de l'OTAN pour un groupe de frégates construites pour la marine soviétique dans les années 1950. La désignation soviétique était Storozhevoi Korabl (navire d'escorte) Projet 42. Ces navires étaient analogues aux destroyers d'escorte de la Seconde Guerre mondiale ou aux torpilleurs allemands de classe Elbing. Le programme ne comprenait que huit navires, jugés trop coûteux pour une production en série, et la frégate de classe Riga, plus petite et moins chère, fut construite à leur place. Des radars et des sonars furent installés."
 SOV_screen_hull_heavy_1:0 "Projet 61 Kashin"
 SOV_screen_hull_heavy_1_short:0 "Projet 61"
 SOV_screen_hull_heavy_1_desc:0 "La classe Kashin, désignation soviétique Projet 61, était une série de destroyers lance-missiles antiaériens construits pour la marine soviétique depuis les années 1960. En 2020, aucun navire ne reste en service dans la marine russe, mais trois navires modifiés continuent de servir dans la marine indienne en tant que destroyers de classe Rajput."
 SOV_screen_hull_heavy_2:0 "Projet 1135 Burevestnik"
 SOV_screen_hull_heavy_2_short:0 "1135 Burevestnik"
 SOV_screen_hull_heavy_2_desc:0 "La classe Krivak, désignée par l'Union soviétique sous le nom de Projet 1135 Burevestnik (pétrel tempête), était une série de frégates et de patrouilleurs construits en Union soviétique, principalement pour la marine soviétique. Ses caractéristiques uniques – sa boîte à missiles à l'avant, sa cheminée et son mât incliné – lui ont valu un surnom populaire auprès des marins américains, issu de leur formation à l'identification des silhouettes de navires étrangers : « Krivak, paquet de hot-dogs, cheminée, canons à l'arrière »."
 SOV_screen_hull_heavy_3:0 "Projet 956 Sarych"
 SOV_screen_hull_heavy_3_short:0 "Projet 956"
 SOV_screen_hull_heavy_3_desc:0 "La classe Sovremenny, désignée par l'Union soviétique sous le nom de Projet 956 Sarych (buse), est une classe de destroyers lance-missiles antinavires et antiaériens de la marine soviétique, puis russe. Les navires portent des noms qui reflètent leurs qualités, « Sovremenny » signifiant « moderne » ou « contemporain »."
 SOV_screen_hull_heavy_4:0 "Projet 1155 Fregat-M"
 SOV_screen_hull_heavy_4_short:0 "1155 Fregat-M"
 SOV_screen_hull_heavy_4_desc:0 "La classe Oudaloy, désignée russement Projet 1155 Fregat et Projet 11551 Fregat-M, est une série de destroyers lance-missiles anti-sous-marins construits pour la marine soviétique. Semblable extérieurement à l'Oudaloy, il s'agissait d'une nouvelle configuration remplaçant le SS-N-14 par des missiles antinavires SS-N-22 « Sunburn » (Moskit), un double canon de 130 mm, des roquettes anti-torpilles UDAV-1 et des systèmes CIWS canon/SAM. La capacité de lutte anti-sous-marine à distance est maintenue grâce au tir de missiles SS-N-15 depuis les tubes lance-torpilles."
 SOV_screen_hull_medium_0:0 "Projet 42 Kola"
 SOV_screen_hull_medium_0_short:0 "Projet 42"
 SOV_screen_hull_medium_0_desc:0 "La classe Kola était le nom officiel de l'OTAN pour un groupe de frégates construites pour la marine soviétique dans les années 1950. La désignation soviétique était Storozhevoi Korabl (navire d'escorte) Projet 42. Ces navires étaient analogues aux destroyers d'escorte de la Seconde Guerre mondiale ou aux torpilleurs allemands de classe Elbing. Le programme ne comprenait que huit navires, jugés trop coûteux pour une production en série, et la frégate de classe Riga, plus petite et moins chère, fut construite à leur place. Des radars et des sonars furent installés."
 SOV_screen_hull_medium_1:0 "Projet 159 Petya"
 SOV_screen_hull_medium_1_short:0 "Projet 159"
 SOV_screen_hull_medium_1_desc:0 "La classe Petya était le nom de l'OTAN pour une classe de frégates légères conçues dans les années 1950 et construites pour la marine soviétique dans les années 1960. La désignation soviétique était « Storozhevoi Korabl' » (Сторожевой Корабль - Navire sentinelle) Projet 159."
 SOV_screen_hull_medium_2:0 "Projet 1159 Koni"
 SOV_screen_hull_medium_2_short:0 "Projet 1159"
 SOV_screen_hull_medium_2_desc:0 "La classe Koni est le nom officiel de l'OTAN pour une frégate de lutte anti-sous-marine construite par l'Union soviétique. En Union soviétique, elle était connue sous le nom de Projet 1159. Quatorze exemplaires ont été construits au chantier naval de Zelenodolsk entre 1975 et 1988. Initialement destinées à remplacer les anciennes frégates de la classe Riga, elles ont finalement été choisies comme modèle d'exportation vers diverses marines amies."
 SOV_screen_hull_medium_3:0 "Projet 11540 Yastreb"
 SOV_screen_hull_medium_3_short:0 "Projet 11540"
 SOV_screen_hull_medium_3_desc:0 "La classe Neustrashimy, désignée par l'Union soviétique Projet 11540 Yastreb (faucon), est une série de grandes frégates construites pour la marine soviétique et actuellement en service dans la marine russe. Sept navires étaient prévus pour la marine soviétique, mais la chute de l'Union soviétique a bouleversé ces plans. Deux navires ont été achevés, tous deux actuellement en service actif dans la flotte russe de la Baltique."
 SOV_screen_hull_medium_4:0 "Projet 22350 Admiral Gorshkov"
 SOV_screen_hull_medium_4_short:0 "Projet 22350"
 SOV_screen_hull_medium_4_desc:0 "La classe Amiral Gorshkov, désignée par la Russie Projet 22350 pour les versions originale et modernisée, équipées respectivement de 16 et 32 ​​cellules VLS, est la toute dernière classe de frégates construite par Severnaya Verf à Saint-Pétersbourg pour la marine russe, pour un coût de 250 millions de dollars. Le Projet 22350 a été conçu par le Bureau d'études Severnoye et intègre la technologie furtive."
 SOV_sub_hull_ww:0 "Classe S"
 SOV_sub_hull_ww_short:0 "Classe S"
 SOV_sub_hull_ww_desc:0 "Les sous-marins de classe S, ou Srednyaya, faisaient partie de la flotte sous-marine de la marine soviétique pendant la Seconde Guerre mondiale. Surnommés officieusement Stalinets (à ne pas confondre avec Stalinets), ces sous-marins furent les plus performants et remportèrent les victoires les plus importantes parmi tous les sous-marins soviétiques. Au total, ils coulèrent 82 770 tonneaux de jauge brute (TJB) de navires marchands et sept navires de guerre, ce qui représente environ un tiers du tonnage total coulé par les sous-marins soviétiques pendant la guerre."
 SOV_sub_hull_small_single_0:0 "Projet 611 Zulu"
 SOV_sub_hull_small_single_0_short:0 "Projet 611"
 SOV_sub_hull_small_single_0_desc:0 "Le Projet 611 de la marine soviétique fut l'un des premiers sous-marins d'attaque soviétiques d'après-guerre. Les premiers navires de cette classe étaient équipés de canons antiaériens jumelés de 57 mm et de 25 mm, mais dépourvus de snorkels. Ces derniers furent toutefois retirés et remplacés par des snorkels peu après leur mise en service."
 SOV_sub_hull_small_single_1:0 "Projet 641 Foxtrot"
 SOV_sub_hull_small_single_1_short:0 "Projet 641"
 SOV_sub_hull_small_single_1_desc:0 "La classe Foxtrot était le nom officiel de l'OTAN pour une classe de sous-marins de patrouille diesel-électriques construits en Union soviétique. La désignation soviétique de cette classe était Projet 641. La classe Foxtrot était conçue pour remplacer la classe Zulu, plus ancienne. Ses performances et son armement étaient comparables à ceux de la plupart des modèles contemporains. Cependant, ses trois hélices la rendaient plus bruyante que la plupart des modèles occidentaux. De plus, la classe Foxtrot fut l'un des derniers modèles introduits avant l'adoption de la coque en forme de larme, qui offrait de bien meilleures performances sous-marines."
 SOV_sub_hull_small_single_2:0 "Projet 641B Tango"
 SOV_sub_hull_small_single_2_short:0 "Projet 641B"
 SOV_sub_hull_small_single_2_desc:0 "La classe Tango était le nom officiel de l'OTAN d'une classe de sous-marins diesel-électriques construits en Union soviétique pour remplacer les sous-marins de classe Foxtrot. La désignation soviétique de cette classe était Projet 641B, et elle était également connue sous le nom de classe Som (poisson-chat). Les installations de sonar d'étrave semblent similaires à celles des sous-marins nucléaires d'attaque soviétiques. Le système de propulsion était le même que celui du dernier sous-groupe de la classe Foxtrot. La classe Tango disposait d'une capacité de batterie bien supérieure à celle de toutes les classes de sous-marins conventionnels précédentes de la marine soviétique."
 SOV_sub_hull_small_single_3:0 "Projet 877 Paltus"
 SOV_sub_hull_small_single_3_short:0 "Projet 877 "
 SOV_sub_hull_small_single_3_desc:0 "La classe Kilo, désignée soviétiquement Projet 877 Paltus, est une classe de sous-marins d'attaque diesel-électriques conçus et construits en Union soviétique pour la marine soviétique. Ces sous-marins d'attaque sont principalement destinés aux opérations anti-navires et anti-sous-marines en eaux relativement peu profondes. Les sous-marins originaux du Projet 877 sont équipés du sonar Rubikon MGK-400 (dont le nom OTAN est Shark Gill), qui comprend un sonar de détection et d'évitement de mines MG-519 Arfa (dont le nom OTAN est Mouse Roar)."
 SOV_sub_hull_small_single_4:0 "Projet 677 Lada"
 SOV_sub_hull_small_single_4_short:0 "Projet 677"
 SOV_sub_hull_small_single_4_desc:0 "Classe Lada, désignation russe : Projet 677. Lada (nom OTAN : Lada) est la nouvelle classe avancée de sous-marins d'attaque diesel-électriques conçus par le bureau d'études russe Rubin. Ce programme de développement d'un sous-marin diesel-électrique de « quatrième génération » visait à produire une version hautement améliorée du Projet 636, dotée d'une meilleure signature acoustique, de nouveaux systèmes de combat et, éventuellement, d'une propulsion aéro-indépendante."
 SOV_sub_hull_large_single_0:0 "Projet 613 Whisky"
 SOV_sub_hull_large_single_0_short:0 "Projet 613"
 SOV_sub_hull_large_single_0_desc:0 "Le design initial fut développé au début des années 1940 pour succéder au sous-marin de classe S. Fort de l'expérience de la guerre et de la maîtrise de la technologie allemande à la fin de la guerre, les Soviétiques émit un nouveau cahier des charges en 1946. Le design révisé fut développé par le bureau d'études Lazurit, basé à Gorki. Comme la plupart des sous-marins conventionnels conçus entre 1946 et 1960, ce modèle fut fortement influencé par le sous-marin de type XXI."
 SOV_sub_hull_large_single_1:0 "Projet Kit 627"
 SOV_sub_hull_large_single_1_short:0 "Projet 627"
 SOV_sub_hull_large_single_1_desc:0 "La classe November, désignée soviétiquement Projet 627 Kit, était la première classe de sous-marins d'attaque à propulsion nucléaire de l'Union soviétique, qui étaient en service de 1958 à 1990. Tous sauf un ont été éliminés, le K-3, le premier sous-marin à propulsion nucléaire construit pour la marine soviétique, étant conservé comme navire commémoratif à Saint-Pétersbourg."
 SOV_sub_hull_large_single_2:0 "Projet 671 Yorsh"
 SOV_sub_hull_large_single_2_short:0 "Projet 671"
 SOV_sub_hull_large_single_2_desc:0 "La classe Victor, désignée par les Soviétiques Projet 671 Yorsh, Projet 671RT Syomga et Projet 671RTM/RTMK Shchuka, est une série de sous-marins d'attaque à propulsion nucléaire construits en Union soviétique et exploités par la marine soviétique."
 SOV_sub_hull_large_single_3:0 "Projet 705 Lira"
 SOV_sub_hull_large_single_3_short:0 "Projet 705"
 SOV_sub_hull_large_single_3_desc:0 "La classe Alfa, désignée par l'Union soviétique sous le nom de Projet 705 Lira, était une classe de sous-marins d'attaque à propulsion nucléaire en service dans la marine soviétique, puis dans la marine russe. Il s'agissait des sous-marins militaires les plus rapides jamais construits, seul le prototype K-222 (nom OTAN : classe Papa) les surpassant en vitesse d'immersion."
 SOV_sub_hull_large_single_4:0 "Projet 971 Chtchouka-B"
 SOV_sub_hull_large_single_4_short:0 "Projet 971"
 SOV_sub_hull_large_single_4_desc:0 "La classe Akula, désignation soviétique Projet 971 Shchuka-B, est une série de sous-marins d'attaque à propulsion nucléaire (SNA) déployés pour la première fois par la marine soviétique en 1986. Il existe quatre sous-classes ou vols de Shchuka-B, composés des sept bateaux originaux du Projet 971 (nom de code Akula I), mis en service entre 1984 et 1990 ; six Projet 971I (Akulas améliorés), mis en service entre 1991 et 2009 ; un Projet 971U (Akula II), mis en service en 1995 ; et un Projet 971M (Akula III), mis en service en 2001."
 SOV_sub_hull_large_double_0:0 "Projet 658 Hotel"
 SOV_sub_hull_large_double_0_short:0 "Projet 658"
 SOV_sub_hull_large_double_0_desc:0 "La classe Hotel est la classification générale de l'OTAN pour un type de sous-marin nucléaire lanceur d'engins, initialement mis en service par l'Union soviétique vers 1959. La conception de la classe Hotel s'inspire du sous-marin de classe November du projet 627, les premiers sous-marins nucléaires soviétiques. Elle a été modifiée en y ajoutant le compartiment missiles des sous-marins de classe Golf. De plus, les Hotel étaient dotés de petits hydroplanes horizontaux pour une meilleure manœuvrabilité et de surfaces de commande électrohydrauliques plus fiables pour des opérations sous-marines à grande vitesse et un bruit réduit."
 SOV_sub_hull_large_double_1:0 "Projet 667 Dauphin"
 SOV_sub_hull_large_double_1_short:0 "Projet 667"
 SOV_sub_hull_large_double_1_desc:0 "La classe Delta, désignée par les Soviétiques Projet 667B Murena, Projet 667BD Murena-M, Projet 667BDR Kalmar, Projet 667BDRM Delfin, est une série de sous-marins lanceurs d'engins balistiques à propulsion nucléaire, conçus et construits en Union soviétique, qui ont constitué l'épine dorsale de la flotte de sous-marins stratégiques soviétique et russe depuis leur introduction en 1973."
 SOV_sub_hull_large_double_2:0 "Projet 941 Akula"
 SOV_sub_hull_large_double_2_short:0 "Projet 941"
 SOV_sub_hull_large_double_2_desc:0 "La classe Typhoon, désignée par l'Union soviétique sous le nom de Projet 941 Akula (nom OTAN Typhoon), est une classe de sous-marins nucléaires lanceurs d'engins, conçus et construits par l'Union soviétique pour la marine soviétique. Avec un déplacement en plongée de 48 000 tonnes, les Typhoon sont les plus grands sous-marins jamais construits, capables d'accueillir confortablement un équipage de 160 personnes même en immersion pendant des mois. Outre leur armement antimissile, la classe Typhoon dispose de six tubes lance-torpilles conçus pour les missiles RPK-2 (SS-N-15) ou les torpilles Type 53."
 SOV_sub_hull_large_double_3:0 "Projet 955 Borei"
 SOV_sub_hull_large_double_3_short:0 "Projet 955"
 SOV_sub_hull_large_double_3_desc:0 "La classe Borei, translittération alternative Borey, désignation russe Projet 955 Borei et Projet 955A Borei-A, également appelée classe Dolgorukiy, est une série de sous-marins nucléaires lanceurs d'engins construits par Sevmash pour la marine russe. Bien qu'ils remplacent de nombreux types de SNLE, les sous-marins de classe Borei sont beaucoup plus petits que ceux de la classe Typhoon, tant en termes de volume que d'équipage (24 000 tonnes contre 48 000 tonnes et 107 hommes contre 160 pour les Typhoon). En termes de classe, ils s'inscrivent plus précisément dans la lignée des SNLE de classe Delta IV."