l_english:
 conquest.1.t:0 "[GetNewspaperHeader]La chute d'Helsinki"
 conquest.1.d:0 "Après d'intenses combats, la capitale de la Finlande est tombée aux mains des Soviétiques. On entend encore quelques coups de feu, mais les Soviétiques défilent dans Mannerheimintie sous les yeux incrédules des citoyens choqués.\n\nTous les drapeaux finlandais ont été remplacés par les drapeaux soviétiques et un gouvernement d'occupation a été mis en place au Parlement."
 conquest.1.a:0 "Le sisu ne les a pas aidés cette fois"
 conquest.1.b:0 "Une autre victoire pour la mère patrie."
 conquest.1.c:0 "Perkele!"