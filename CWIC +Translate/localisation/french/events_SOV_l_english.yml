 soviet_leader_change.1.d.A:0 "Terrible nouvelle, camarades. Joseph Vissarionovitch Staline est décédé à l'âge de 74 ans à la datcha de Kuntsevo, des suites d'un accident vasculaire cérébral. Quelques jours avant son accident, Staline et quelques membres de son entourage, composé de Malenkov, Molotov, Beria, Khrouchtchev et quelques autres, s'étaient réunis pour une soirée de divertissement et de consommation d'alcool. Le lendemain, les invités se dispersèrent vers 4 heures du matin et Staline se retira dans ses appartements privés avec pour consigne stricte de ne pas le déranger jusqu'à ce que des bruits indiquant son réveil se fassent entendre. Le temps passa et aucun bruit ne fut entendu de toute la journée. Vers 23 heures le même jour, sa gouvernante entra prudemment dans sa chambre et le trouva allongé par terre, vêtu de son pantalon de pyjama et d'une chemise. Il était inconscient, respirant difficilement, incontinent et ne réagissait pas aux tentatives de réveil. Beria fut appelé et, à sa vue, écarta l'hypothèse d'un état d'inconscience, l'attribuant à la consommation d'alcool, et partit.\nLe lendemain à 7 heures du matin, Beria et un groupe d'experts médicaux furent convoqués pour l'examiner. Leur examen, révélant une tension artérielle de 190/110 et une hémiplégie droite, conclut que Staline, qui avait des antécédents connus d'hypertension non contrôlée, avait subi un accident vasculaire cérébral hémorragique impliquant l'artère cérébrale moyenne gauche. Au cours des deux jours suivants, il reçut divers traitements ; pour tenter de faire baisser sa tension artérielle, qui était montée à 210/120, deux applications distinctes de huit sangsues chacune furent appliquées sur son cou et son visage. Cependant, son état continua de se détériorer et il décéda à [GetDateText]. Son corps fut ensuite transporté vers un lieu non précisé et une autopsie fut pratiquée, après quoi il fut embaumé pour être exposé au public. Nikita Khrouchtchev, Georgy Malenkov, Vyacheslav Molotov et Lavrentiy Beria sont chargés d'organiser les funérailles."
 soviet_leader_change.1.d.B:0 "Terrible nouvelle, camarades. Joseph Vissarionovitch Staline a été victime d'un accident vasculaire cérébral (AVC) dans sa datcha de Kountsevo. Quelques jours avant son accident, Staline et quelques membres de son entourage, dont Malenkov, Molotov, Pervoukhine, Sabourov et quelques autres, s'étaient réunis pour une soirée de divertissement et de consommation d'alcool. Le lendemain, les invités se dispersèrent vers 4 heures du matin et Staline se retira dans ses appartements privés avec pour consigne stricte de ne pas le déranger jusqu'à ce que des bruits indiquent son réveil. Le temps passa et aucun bruit ne fut entendu de la journée. Vers 8 heures du matin, le même jour, sa gouvernante entra prudemment dans sa chambre et le trouva allongé sur le sol, vêtu de son pantalon de pyjama et d'une chemise. Il était inconscient, respirant difficilement, incontinent et ne réagissait pas aux tentatives de réveil. Les médecins furent appelés et, dès son arrivée, commencèrent immédiatement des examens.\nÀ 23 heures Plus tard dans la journée, Malenkov et son entourage furent informés de l'incident. Grâce à l'intervention rapide des médecins, qui révélèrent une tension artérielle de 190/110 et une hémiplégie droite, le camarade Staline, qui souffrait d'hypertension artérielle non contrôlée, se remit partiellement de son accident vasculaire cérébral. Au cours des semaines suivantes, il reçut divers traitements et annonça son intention de prendre sa retraite lors du prochain congrès du Parti. En attendant, il mettra en place un comité consultatif tournant composé de membres de son bureau politique pour l'assister dans sa tâche. Maxime Sabourov, Gueorgui Malenkov et Mikhaïl Pervoukhine en sont les premiers membres."
 soviet_leader_change.1.t.B:0 "L'AVC de Staline"
 soviet_leader_change.1.t.A:0 "La mort de Staline"
 soviet_leader_change.1.o.A:0 "Les camarades Malenkov, Khrouchtchev et Beria formeront une Troïka"
 soviet_leader_change.1.o.B:0 "Les camarades Staline créeront un organe consultatif pour préparer sa succession."
 soviet_leader_change.2.t:0 "Tentative de destitution contre Khrouchtchev"
 soviet_leader_change.2.desc:0 ""
 soviet_leader_change.2.o.A:0 "Leonid Brejnev est élu Premier secrétaire"
 soviet_leader_change.2.o.B:0 "Alexandre Chelepine est élu premier secrétaire"
 soviet_leader_change.2.o.C:0 "Nikita Khrouchtchev est sauvé par ses alliés"
 soviet_leader_change.3.t:0 "Accident d'usine à Tachkent"
 soviet_leader_change.3.desc:0 "Le 21 mars 1982, Brejnev entame une visite en Asie centrale soviétique, au programme particulièrement chargé : cérémonies de remise de médailles, discours et visites d'entreprises industrielles et agricoles. Le 25 mars, alors qu'il visite l'usine aéronautique Tchkalov à Tachkent en compagnie du premier secrétaire du Parti communiste ouzbek, Sharaf Rachidov, un échafaudage s'effondre soudainement sous le poids des ouvriers rassemblés."
 soviet_leader_change.3.o.A:0 "L'échafaudage s'est soudainement effondré et a frappé le premier secrétaire Brejnev."
 soviet_leader_change.3.o.B:0 "L'échafaudage s'est soudainement effondré et a heurté les agents de sécurité à côté du Premier Secrétaire."
 soviet_leader_change.4.t:0 "Décès de Léonid Ilitch Brejnev"
 soviet_leader_change.4.desc:0 "Léonid Ilitch Brejnev, notre cher dirigeant, est décédé à l'âge de 75 ans des suites d'une crise cardiaque, après des années de graves maladies. Depuis 1974, il souffrait de plusieurs maladies, notamment une maladie cardiaque, une leucémie, un cancer de la mâchoire, de l'emphysème et des troubles circulatoires, aggravés par son tabagisme et son obésité. Malgré sa maladie, il a continué à exercer ses fonctions jusqu'à sa mort, d'une crise cardiaque, survenue dans son bureau. Ses funérailles auront lieu dans cinq jours. Si nous pleurons sa disparition, nous devons également choisir son successeur."
 soviet_leader_change.4.o.A:0 "Youri Andropov est élu président."
 Germany_Unified_Neutral:0 "@L'Allemagne de l'Est est §Yunifié§! sous un état neutre"
 Swf_Later_Stalin.1.d:0 "Depuis plus d'un siècle, des discussions portent sur l'inversion du cours des rivières qui se jettent inutilement dans l'Arctique. Cela permettrait de mobiliser une énergie considérable et de provoquer une révolution agricole dans des régions autrefois désolées. Dans les années 1930, d'éminents scientifiques soviétiques de l'Académie des sciences ont débattu de la possibilité d'inverser le cours du fleuve, mais à une échelle plus raisonnable. L'État souhaite engager ce processus, dans l'espoir d'assurer aux ouvriers et aux paysans soviétiques une plus grande sécurité hydrique et une plus grande prospérité."
 Swf_Later_Stalin.2.d:0 "Le Politburo a demandé aux agences compétentes de préparer les transferts de population en Asie centrale soviétique. Les mouvements de population, notamment ces dernières années, ont soulevé la question de potentiels conflits ethniques dans ces régions. Le rétablissement de l'homogénéité ethnique ne fera que renforcer ces républiques socialistes soviétiques. De plus, certaines populations minoritaires peuvent être déplacées vers des zones où elles constituent la majorité. Ces opérations nécessitent une étroite collaboration des services de sécurité avec les autres agences gouvernementales compétentes afin de garantir un déroulement rapide et sans heurts des opérations."
 Swf_Later_Stalin.3.d:0 "Il existe une communauté arménienne solide, quoique petite, en Asie centrale soviétique. Certains sont arrivés dès le milieu du XIXe siècle. D'autres se sont installés plus tôt encore, s'établissant comme commerçants. Cependant, ils se développent lentement pour devenir une communauté minoritaire reconnue dans la région, ce qui exacerbe les tensions, les habitants étant, semble-t-il, mécontents de leur statut économique et de leur culture étrangère. Afin de prévenir d'éventuels problèmes et de prévenir les tensions ethniques, l'État a approuvé un projet de transfert des Arméniens d'Asie centrale vers la République socialiste soviétique d'Arménie. Cette opération permet non seulement d'atteindre nos objectifs de promotion de l'harmonie en Asie centrale, mais aussi d'unifier la population arménienne. Malgré ces aspects positifs, certains rapports font état d'un mécontentement des Arméniens d'Asie centrale, qui affirment ne pas connaître la vie en RSS d'Arménie."
 Swf_Later_Stalin.4.d:0 "La première étape vers l'inversion du cours des rivières soviétiques a récemment été franchie. L'Union soviétique a officiellement inauguré le canal Petchora-Kama. Le projet, qui avait été longuement débattu dans les années 1930, n'a été lancé que récemment. Ce canal redirigera le cours de la Petchora vers le bassin de la Volga, augmentant ainsi son débit vers la mer Caspienne. Depuis plus d'un siècle, responsables et scientifiques russes cherchent à mettre au point une campagne d'inversion du cours des rivières du Grand Nord qui permettrait d'arrêter définitivement le déversement des eaux dans l'océan Arctique. Malgré ce succès initial, le projet devrait prendre des années et nécessiter des ressources considérables."
 Swf_Later_Stalin.5.t:0 "« [GetNewspaperHeader]Déportations massives en [DDR.GetNameDef] après l'échec du soulèvement »"
 Swf_Later_Stalin.5.d:0 "Des rapports de [DDR.GetNameDef] font état de scènes déchirantes de grands groupes d'Allemands embarqués de force dans des trains à destination de l'Asie centrale soviétique. Ces déportations massives ont été ordonnées par le Premier ministre soviétique Joseph Staline après l'échec d'un soulèvement antisoviétique. Le gouvernement soviétique devrait envoyer les militants antisoviétiques présumés dans le nord de la République socialiste soviétique du Kazakhstan, où Staline avait expulsé les Allemands de la Volga au début de la Seconde Guerre mondiale. Ces déportations massives sont largement condamnées dans le monde non communiste, mais le gouvernement soviétique reste fidèle à sa politique."
 Swf_Later_Stalin.6.d:0 "L'Union soviétique procède actuellement à l'un des plus importants échanges de population de son histoire, à travers l'Asie centrale soviétique. Afin de préserver l'homogénéité ethnique et de prévenir d'éventuelles sources de troubles, toutes les principales communautés ethniques de la région seront déplacées vers leur patrie d'origine. Les Kazakhs de tous les États soviétiques d'Asie centrale seront transférés vers la RSS du Kazakhstan. Tous les Ouzbeks seront transférés vers la RSS d'Ouzbékistan. Les responsables soviétiques affirment que ces mesures sont bien accueillies par les personnes déplacées, reconnaissantes que l'État soit intervenu pour les unir. Cependant, des militants antisoviétiques affirment que ces déportations déracineront des communautés établies depuis des générations dans la région et qu'elles exacerberont les rivalités ethniques entre les différents États."
 Swf_Later_Stalin.7.d:0 "Les Ukrainiens d'Asie centrale soviétique arrivent par vagues depuis le XVIIIe siècle. Un mélange de colons volontaires et forcés a quitté l'Ukraine jusqu'à l'ère soviétique. Sous le régime soviétique, dans les années 1930 et 1940, l'État a déporté de force des dizaines de milliers d'Ukrainiens supplémentaires. Il a d'abord ciblé les koulaks, puis, lorsque la Seconde Guerre mondiale a éclaté, les sympathisants et collaborateurs présumés du fascisme ont également été déportés. Aujourd'hui, l'Union soviétique a annoncé son intention de commencer à déporter tous les Ukrainiens d'Asie centrale vers l'Ukraine. La nouvelle sera particulièrement bien accueillie par les récents déportés forcés. Cependant, des milliers de personnes vivent en Asie centrale depuis des générations et seraient mécontentes des déportations prévues. Il semble que l'Union soviétique soit fermement déterminée à établir et à restaurer l'homogénéité ethnique dans ses républiques socialistes afin de favoriser l'unité et de prévenir les sources potentielles de troubles."
 Swf_Later_Stalin.8.d:0 "Les responsables soviétiques n'ont pas commenté les informations faisant état de déportations de Tchétchènes vers la RSS du Tadjikistan. Malgré ces démentis, certaines sources affirment que ces déportations s'inscrivent dans le cadre d'un vaste programme de transfert de population en Asie centrale soviétique. Les raisons de ces déportations ne sont pas tout à fait claires, mais elles pourraient être liées à la crainte des responsables soviétiques que les Tchétchènes ne représentent une source potentielle de difficultés pour leurs plans. L'objectif général de ces récents transferts de population semble être d'établir une homogénéité ethnique entre les républiques socialistes soviétiques de la région et d'éliminer les sources potentielles de conflits ethniques ou culturels."
 Swf_Later_Stalin.9.d:0 "À l'issue d'une session extraordinaire, l'Union soviétique a annoncé le transfert de la partie occidentale de la RSS du Kazakhstan à la RSS de Russie. Il s'agit d'une étape majeure dans la récente initiative soviétique de réorganisation de l'Asie centrale. Les modifications territoriales et les transferts de population s'inscrivent dans un effort concerté visant à rendre les Républiques socialistes soviétiques plus homogènes sur le plan ethnique et à réduire le risque de futurs conflits ethniques ou culturels dans ces régions. Le territoire cédé est peuplé d'une importante majorité russe et s'inscrit dans cette politique. Bien que cette décision soit largement saluée par la presse soviétique, étroitement contrôlée, elle entraînera probablement des troubles dans la région et parmi les populations directement concernées."
 Swf_Later_Stalin.10.d:0 "Depuis le début de la Seconde Guerre mondiale, l'Union soviétique a déporté un grand nombre d'Allemands vers la RSS du Kazakhstan. Lorsque la guerre a éclaté, la population allemande de la Volga a été rapidement déportée, par crainte qu'elle ne rejoigne les envahisseurs allemands. Lors d'un récent soulèvement antisoviétique en Allemagne de l'Est, même les Allemands soupçonnés d'avoir participé aux manifestations ont été arrêtés et déportés. Face à une forte concentration de populations d'Allemands soviétiques et d'Allemands de l'Est, l'État a décidé de créer une nouvelle République socialiste soviétique d'Allemagne. Les territoires de la RSS du Kazakhstan occupés par ces déportés allemands sont cédés à la nouvelle entité. Cette décision reflète les récents efforts des Soviétiques pour réorganiser l'Asie centrale soviétique et assurer l'homogénéité ethnique des Républiques socialistes soviétiques."
 Swf_Later_Stalin.11.d:0 "L'Union soviétique, dans le cadre de ses efforts pour réorganiser l'Asie centrale soviétique et restaurer l'homogénéité de ses républiques socialistes soviétiques, a annoncé la création d'une République socialiste soviétique de Corée. Le territoire de la nouvelle entité est prélevé sur le territoire extrême-oriental de la RSS du Kazakhstan. La population sera composée des communautés coréennes présentes dans la région, des Coréens de Sakhaline et des nombreux réfugiés coréens communistes ayant fui la Corée après la guerre de Corée. Les Soviétiques espèrent que cette politique réduira les risques de conflits ethniques ou culturels dans la région."
 Swf_Later_Stalin.12.d:0 "L'Union soviétique a récemment annoncé une politique de réorganisation des Républiques socialistes soviétiques d'Asie centrale afin de réduire les risques de conflits ethniques ou culturels et de garantir la représentation des nationalités par leurs propres gouvernements. Dans le cadre de cette initiative, la République socialiste soviétique autonome du Karakalpak a été cédée à la RSS du Kazakhstan. Cette décision a permis le retour d'une importante population kazakhe. Cette décision est également perçue comme un moyen de préserver l'importance de la RSS du Kazakhstan, une grande partie de son territoire ayant été transférée à des Républiques socialistes soviétiques existantes ou nouvelles. Les changements territoriaux et les échanges de population spectaculaires ont profondément bouleversé la région, et de nombreuses régions soviétiques s'interrogent sans doute sur l'avenir qui leur est réservé."
 Swf_Later_Stalin.13.d:0 "Des rapports en provenance d'Union soviétique indiquent qu'une déportation massive est en cours en RSS d'Azerbaïdjan. La population arménienne du Haut-Karabakh et du Nakhitchevan est expulsée de la région. Les responsables soviétiques ne commentent pas l'affaire, mais il semble qu'il s'agisse d'une mesure visant à apaiser les tensions potentielles dans la région. Les analystes soulignent que les déportations ont probablement été planifiées et directement approuvées par les plus hautes instances de l'Union soviétique. Historiquement, la région a été le théâtre d'incidents violents continus entre les populations arménienne et azérie vivant côte à côte depuis des générations. Le déplacement des Arméniens pourrait être une tentative d'apaiser les tensions et de rendre l'Azerbaïdjan plus homogène."
 Swf_Later_Stalin.14.d:0 "Dans l'un des plus grands bouleversements observés dans le Caucase depuis les années 1920, les régions du Haut-Karabakh et du Nakhitchevan ont été transférées de la RSS d'Azerbaïdjan à la RSS d'Arménie. Les Soviétiques espèrent probablement que cette décision simplifiera l'administration de la région et préviendra tout conflit futur entre villages arméniens et azéris. Ces régions comptent des villages arméniens et azéris, mais à majorité arménienne. Les experts estiment que ce changement majeur n'a pu se produire qu'avec l'approbation du dirigeant soviétique Joseph Staline."
 Swf_Later_Stalin.15.d:0 "Dans l'un des plus grands bouleversements observés dans le Caucase depuis les années 1920, les régions du Haut-Karabakh ont été transférées de la RSS d'Azerbaïdjan à la RSS d'Arménie. Les Soviétiques espèrent probablement que cette décision simplifiera l'administration de la région et préviendra tout conflit futur entre villages arméniens et azéris. Ces régions comptent des villages arméniens et azéris, mais à majorité arménienne. Les experts estiment que ce changement majeur n'a pu se produire qu'avec l'approbation du dirigeant soviétique Joseph Staline."
 Swf_Later_Stalin.16.d:0 "Des rapports en provenance d'Union soviétique indiquent qu'une déportation massive est en cours dans le Caucase. La population azérie du Haut-Karabakh et du Nakhitchevan est expulsée de la région. Les responsables soviétiques ne commentent pas l'affaire, mais il semble qu'il s'agisse d'une mesure visant à apaiser les tensions potentielles dans la région, en prévision de leur intégration à l'Arménie. Les analystes soulignent que ces déportations ont probablement été planifiées et directement approuvées par les plus hautes instances de l'Union soviétique. Historiquement, la région a été le théâtre d'incidents violents continus entre les populations arménienne et azérie vivant côte à côte depuis des générations. Le déplacement des Azéris pourrait être l'étape finale vers l'instauration forcée d'une harmonie."
 Swf_Later_Stalin.17.d:0 "Des rapports en provenance d'Union soviétique indiquent qu'une déportation massive est en cours dans le Caucase. La population azérie du Haut-Karabakh est expulsée de la région. Les responsables soviétiques ne commentent pas l'affaire, mais il semble qu'il s'agisse d'une mesure visant à apaiser les tensions potentielles dans la région, en prévision de son intégration à l'Arménie. Les analystes soulignent que ces déportations ont probablement été planifiées et directement approuvées par les plus hautes instances de l'Union soviétique. Historiquement, la région a été le théâtre d'incidents violents continus entre les populations arménienne et azérie vivant côte à côte depuis des générations. Le déplacement des Azéris pourrait être l'étape finale vers l'instauration forcée d'une harmonie."
 SOV_October_Revolution.2.d:0 "L'Union soviétique triomphe alors que le peuple du premier État ouvrier du monde célèbre l'anniversaire de la Grande Révolution socialiste d'Octobre. Ce jour a changé à jamais le cours de l'histoire. En ce jour sacré, les drapeaux de Lénine et de la Révolution flottent sur la Place Rouge, tandis que des millions de personnes défilent dans une unité indéfectible, honorant la lutte héroïque qui a libéré le prolétariat des chaînes de la tyrannie.\n\nDe la prise du Palais d'Hiver à la construction d'un puissant État socialiste, le chemin du peuple soviétique a été celui du courage, du sacrifice et d'une détermination inébranlable. Les ennemis de la Révolution, des oppresseurs tsaristes aux envahisseurs impérialistes, ont cherché à briser la volonté des ouvriers et des paysans, mais ils ont échoué. Le peuple soviétique est resté ferme, sa détermination forgée dans les flammes de la guerre civile, tempérée par la lutte contre le fascisme et renforcée par la marche inexorable vers le communisme.\n\nLes puissantes usines de l'Union résonnaient du chant du travail, et chaque coup de marteau rendait hommage aux ouvriers qui avaient pris le pouvoir en 1917. L'Armée rouge, héritière de ceux qui défendirent la Révolution, fusils au poing, marche en rangs disciplinés, tel un bouclier contre tous ceux qui osent menacer la patrie soviétique. Dans les champs, dans les usines, dans les salles de la science et de la culture, le peuple soviétique accomplit son devoir historique, construisant un avenir où règnent la justice et l'égalité.\n\nL'esprit d'Octobre est éternel. Il est la lumière qui guide tous les peuples aspirant à la libération, l'appel à lutter contre l'ordre décadent de l'exploitation et de la cupidité. Les ennemis du socialisme tremblent, car ils connaissent la vérité : la Révolution n'est pas morte avec Lénine ; elle vit dans le cœur de millions de personnes, irrésistible, indestructible, vouée à la victoire finale.\n\nVive la Grande Révolution socialiste d'Octobre ! Vive l'Union soviétique ! En avant vers la victoire du communisme !"
 SOV_October_Revolution.1.d:0 "L'Union soviétique triomphe alors que le peuple du premier État ouvrier du monde célèbre l'anniversaire de la Grande Révolution socialiste d'Octobre. Ce jour a changé à jamais le cours de l'histoire. En ce jour sacré, les drapeaux de Lénine et de la Révolution flottent sur la Place Rouge, tandis que des millions de personnes défilent dans une unité indéfectible, honorant la lutte héroïque qui a libéré le prolétariat des chaînes de la tyrannie.\n\nDe la prise du Palais d'Hiver à la construction d'un puissant État socialiste, le chemin du peuple soviétique a été celui du courage, du sacrifice et d'une détermination inébranlable. Les ennemis de la Révolution, des oppresseurs tsaristes aux envahisseurs impérialistes, ont cherché à briser la volonté des ouvriers et des paysans, mais ils ont échoué. Le peuple soviétique est resté ferme, sa détermination forgée dans les flammes de la guerre civile, tempérée par la lutte contre le fascisme et renforcée par la marche inexorable vers le communisme.\n\nLes puissantes usines de l'Union résonnaient du chant du travail, et chaque coup de marteau rendait hommage aux ouvriers qui avaient pris le pouvoir en 1917. L'Armée rouge, héritière de ceux qui défendirent la Révolution, fusils au poing, marche en rangs disciplinés, tel un bouclier contre tous ceux qui osent menacer la patrie soviétique. Dans les champs, dans les usines, dans les salles de la science et de la culture, le peuple soviétique accomplit son devoir historique, construisant un avenir où règnent la justice et l'égalité.\n\nL'esprit d'Octobre est éternel. Il est la lumière qui guide tous les peuples aspirant à la libération, l'appel à lutter contre l'ordre décadent de l'exploitation et de la cupidité. Les ennemis du socialisme tremblent, car ils connaissent la vérité : la Révolution n'est pas morte avec Lénine ; elle vit dans le cœur de millions de personnes, irrésistible, indestructible, vouée à la victoire finale.\n\nVive la Grande Révolution socialiste d'Octobre ! Vive l'Union soviétique ! En avant vers la victoire du communisme !"
 Brezhnev_Pol.10.d:0 "Nikita Khrouchtchev, malgré ses affirmations contraires, a gouverné en dictateur et marginalisé les dirigeants du parti. Léonid Brejnev et le Politburo ont dénoncé ces pratiques, les jugeant rétrogrades et contraires à l'esprit du marxisme-léninisme. Brejnev est allé jusqu'à citer Lénine comme un partisan inconditionnel du leadership collectif. Un retour à de telles pratiques serait naturel. Lors d'une récente réunion du Politburo, le rétablissement du leadership collectif a été annoncé comme un moyen d'empêcher la concentration du pouvoir entre les mains d'une seule personne. Le gouvernement salue publiquement cette décision, la qualifiant de restauration des pratiques marxistes-léninistes. Les hauts responsables du parti se verront bientôt confier d'importantes responsabilités, et Brejnev gouvernera par la consultation et le consensus."
 Brezhnev_Pol.2.d:0 "Après la destitution de Khrouchtchev, les nouveaux dirigeants soviétiques ont poursuivi leur politique visant à se distancier de lui et de son pouvoir. Cela a vu le retour de la vieille garde au sein du Parti communiste. Sous Khrouchtchev, ces hommes avaient longtemps été marginalisés ou placés à des postes subalternes pour les tenir à l'écart des postes de pouvoir. Cependant, avec Brejnev au pouvoir et le besoin de son propre soutien, ces hommes reviennent au Politburo et à d'autres postes importants. Les médias soviétiques saluent ce changement et soulignent le rôle historique que nombre de ces hommes ont joué aux débuts de l'État soviétique et pendant la Seconde Guerre mondiale."
 Brezhnev_Pol.3.d:0 "Le Premier ministre soviétique Léonid Brejnev a récemment lancé un projet visant à rationaliser la direction et à renforcer la prise de décision en restructurant la hiérarchie du parti vers une structure plus verticale. Auparavant, les hauts responsables du parti rendaient compte directement au chef, et les réunions étaient planifiées en fonction des relations personnelles et non de l'urgence. Souvent, la direction s'occupait de questions insignifiantes et négligeait les questions majeures ou urgentes. Brejnev affirme que cela empêchait le gouvernement de gérer efficacement les grands dossiers. Une structure verticale permettra une meilleure circulation de l'information et évitera à la haute direction de s'enliser dans des problèmes mineurs. Ces problèmes mineurs seront traités au fur et à mesure de leur remontée. Nombreux sont ceux au sein du parti qui saluent cette approche plus scientifique de la gouvernance."
 Destalinization.49.d:0 "Le gouvernement soviétique a lancé une vaste campagne médiatique pour imputer à l'ancien Premier ministre Nikita Khrouchtchev la responsabilité des problèmes systémiques, économiques et sociaux auxquels l'Union soviétique est confrontée. Khrouchtchev est accusé d'avoir décentralisé l'autorité centralisée, contrairement à la doctrine communiste, pour soutenir son pouvoir personnel. Il est également accusé d'avoir trop libéralisé la société, entraînant désordre et rupture de la discipline de parti. Tous ces problèmes se sont combinés pour affaiblir l'État et l'économie soviétiques. Le nouveau régime de Léonid Brejnev met l'accent sur ces erreurs comme raisons pour lesquelles le peuple soviétique ne se développe pas comme prévu. On espère que blâmer Khrouchtchev permettra au nouveau régime de gagner du temps pour bâtir sa propre crédibilité."
 Destalinization.50.d:0 "Lorsque Nikita Khrouchtchev était au pouvoir, Léonid Brejnev a largement soutenu sa politique de déstalinisation. Il soutenait la réhabilitation des victimes des Grandes Purges, la critique de l'arbitraire et la tolérance à l'égard des critiques des classes intellectuelles. Cependant, après son arrivée au pouvoir, Brejnev a amorcé un revirement de ces politiques. Le gouvernement a mis en garde contre toute critique publique, plusieurs auteurs étant déjà menacés d'arrestation. La réhabilitation des victimes des purges staliniennes a également ralenti, et risque de s'arrêter. Plus important encore, Brejnev a autorisé les agences d'État à utiliser des pouvoirs répressifs pour contrôler la population et arrêter les dissidents. Cependant, il est clair que ce revirement de politique ne marque pas un retour à la violence extrême et aux arrestations massives observées sous Staline."
 Maoism_SU.1.d:0 "Sous la direction de Léonid Brejnev, les autorités soviétiques ont rétabli la censure pour inverser la politique de libéralisation de l'ancien Premier ministre Nikita Khrouchtchev. Ces nouvelles lois ont suscité la colère de nombreux écrivains soviétiques, qui se sentent entravés par le gouvernement. Cependant, la littérature que Khrouchtchev avait lui-même interdite, comme la littérature maoïste, est à nouveau autorisée. Le gouvernement soviétique autorise désormais les critiques maoïstes de Khrouchtchev afin de soutenir ses efforts visant à réorienter idéologiquement le parti vers ce qu'il considère comme des pratiques marxistes-léninistes légitimes. Le gouvernement soviétique continuera d'appliquer strictement la censure contre les pensées dangereuses, tout en soutenant les écrits constructifs."
 Sakharov.1.d:0 "L'ancien physicien nucléaire Andreï Sakharov est devenu un fervent critique du gouvernement et de la prolifération nucléaire. Il s'est fait connaître comme dissident en transgressant les normes en s'opposant ouvertement à l'admission d'un scientifique impliqué dans les purges staliniennes à l'Académie des sciences soviétique. Il a ensuite épousé une autre dissidente et milite pour les droits de l'homme. Ses travaux constituent une menace majeure pour l'harmonie sociale en Union soviétique et nuisent à notre image nationale. Pour lutter contre Sakharov, les agences de sécurité enquêtent sur sa vie privée, tandis que les médias sont incités à critiquer et à dénoncer activement Sakharov régulièrement. Le gouvernement soviétique encourage également les membres de l'Académie des sciences à se joindre à cette campagne de critique massive visant à discréditer Sakharov."
 Sakharov_HRC.1.d:0 "Andreï Sakharov et d'autres intellectuels soviétiques ont fondé le Comité des droits de l'homme en URSS, premier organisme indépendant de défense des droits de l'homme opérant en Union soviétique. Ce comité publie régulièrement des rapports sur les droits de l'homme et lance des appels en faveur des dissidents soviétiques inculpés. Les agences de sécurité soviétiques surveillent étroitement le groupe, mais il a récemment été décidé que le gouvernement soviétique tiendrait des pourparlers avec Sakharov. Le gouvernement soviétique a utilisé ces pourparlers pour affirmer qu'il prenait les droits de l'homme au sérieux et qu'il prendrait en compte les préoccupations du groupe. Nombreux sont ceux qui pensent que ces pourparlers constituent une campagne de relations publiques visant à démontrer que le gouvernement Brejnev n'allait pas recourir au type de répression observé aux débuts de l'État soviétique. Cependant, il ressort clairement de ces discussions que le gouvernement affirme qu'il ne compromettra probablement pas ses efforts pour maintenir le contrôle social sur les membres du parti et la population."
 Brezhnev_Ethniciy.1.d:0 "Les différentes républiques soviétiques ont continuellement mis en œuvre des lois et des politiques conçues pour leurs propres groupes ethniques. Le système soviétique universel, applicable à toutes les républiques, s'est fortement érodé sous Nikita Khrouchtchev, qui a promu le particularisme et permis aux républiques de s'autogouverner tant qu'elles étaient fidèles à l'Union soviétique. Pour Léonid Brejnev et les hauts responsables du parti, cela représente un problème majeur. Si ces républiques continuent de fonctionner de manière largement indépendante, ce n'est qu'une question de temps avant qu'elles ne se tournent vers le nationalisme ethnique, ce qui représente une menace majeure pour l'unité soviétique. Le gouvernement prévoit des réformes susceptibles d'enrayer le cancer du particularisme et de renforcer l'unité de l'Union soviétique."
 Brezhnev_Ethniciy.3.d:0 "Certaines républiques socialistes de l'Union soviétique ont permis aux populations arriérées de conserver leurs formes traditionnelles de gouvernance, souvent tribales. Autoriser ces formes de gouvernance uniques est une caractéristique commune du particularisme et le principal obstacle à l'établissement d'un système soviétique unique et unifié. Pour lutter contre ce phénomène, les dirigeants soviétiques centraux à Moscou ont demandé aux républiques socialistes concernées d'entamer le processus d'abolition de ces gouvernements tribaux. Cela n'est pas dans l'intérêt des populations gouvernées par ces pratiques archaïques et rétrogrades, et leur élimination accélérera le développement d'une conscience socialiste au sein de ces populations."
 Brezhnev_Ethniciy.2.d:0 "Brejnev et les principaux dirigeants du parti ont identifié le particularisme au sein des républiques socialistes soviétiques comme la principale menace pour la prospérité future, le développement socialiste et l'unité de l'État soviétique. Pour lutter contre cette menace, le gouvernement soviétique a annoncé qu'il commencerait à nommer des Russes à la tête des différentes républiques socialistes. Le gouvernement affirme qu'il ne s'agit pas d'une tentative de promouvoir les Russes au détriment d'un autre groupe national, mais plutôt de refléter le fait que la Russie est l'État socialiste le plus développé de l'Union. Il est donc tout naturel que les Russes soient les dirigeants idéaux pour aider les autres républiques à développer leur propre socialisme, entravé depuis des années par le particularisme promu par leurs nationalités locales."
 11th_5ypfood.0.d:0 "La haute direction soviétique a deux candidats pressentis pour élaborer la politique agricole : Nikolaï Tikhonov et Mikhaïl Gorbatchev. La production agricole a été décevante ces dernières années et il est impératif d'y remédier. Nikolaï Tikhonov est un membre clé de la vieille garde du parti et, tout au long de sa carrière, il a exercé avec brio des fonctions administratives, principalement dans l'industrie et la métallurgie. La politique agricole qu'il propose visera probablement à ajuster ou à réformer les méthodes et les politiques actuelles. Tikhonov est conscient que l'agriculture a sous-performé, mais des changements radicaux risquent de perturber davantage la production. Mikhaïl Gorbatchev offre une perspective plus jeune, ayant gravi les échelons du parti après la Seconde Guerre mondiale. Il estime que la production agricole en URSS est en crise et que des réformes systématiques seront nécessaires pour la relancer. Il affirme que sans réformes drastiques, la situation ne fera que se détériorer davantage. Le Parti doit décider s'il doit se ranger du côté du fiable Tikhonov ou faire confiance au jeune et fervent réformateur Gorbatchev."
 sov_comp_purchase.0.d:0 "L'ambassade soviétique a contacté le Département d'État et demandé l'autorisation de contacter une grande entreprise américaine afin d'acquérir une technologie destinée à améliorer le quotidien des citoyens soviétiques. Le gouvernement soviétique insiste sur le fait que ce transfert de technologie ne porterait pas atteinte aux États-Unis et renforcerait la confiance et la coopération entre nous. Certains membres du cabinet plaident pour que les Soviétiques acquièrent cette technologie : cela stimulerait notre économie, ne fragiliserait pas l'équilibre des pouvoirs, améliorerait les relations et pourrait peut-être aider nos services de renseignement à recueillir des informations. D'autres membres du cabinet souhaitent rejeter la demande soviétique, affirmant qu'il est absurde de céder une quelconque technologie à une puissance ouvertement hostile et que céder constituerait un revers international et stratégique."
 sov_comp_purchase.1.d:0 "Le gouvernement américain nous a informés de son autorisation d'acquérir des technologies auprès de ce pays. L'ambassade est déjà en contact avec certaines entreprises et sociétés pour discuter des prix et des options. Cette décision témoigne de la volonté, et peut-être du désespoir, des Américains à entretenir de bonnes relations avec nous. En apprenant la nouvelle, certains membres du Politburo ont déclaré que les transferts de technologie permettraient au pays de progresser et, à terme, de devancer les Américains. D'autres, en revanche, ont mis en garde contre une telle analyse et ont estimé que ces transferts et ces interactions positives avec les Américains pourraient ouvrir une nouvelle ère de coopération et de développement pacifique pour le peuple soviétique."
 sov_comp_purchase.2.d:0 "Le gouvernement américain nous a notifié que nous ne serions pas autorisés à acquérir des technologies pour son pays. Cela porte un coup à nos efforts de modernisation de l'économie. Nous avons immédiatement fait savoir aux Américains que leur décision compromettait les relations bilatérales et trahissait leurs intentions néfastes contre l'Union soviétique. Au sein du Politburo, le consensus était que les Américains manquaient de volonté de paix et que l'Union soviétique devait rester vigilante et engagée dans la défense du marxisme-léninisme. Il a également été décidé de publier une déclaration louant la science soviétique et encourageant les chercheurs à poursuivre leurs excellents services à l'État."
 sov_ibm_purchase.0.d:0 "L'ambassade soviétique a informé le Département d'État de son désir d'acquérir des systèmes informatiques IBM afin de mettre en place un système de réservation pour les prochains Jeux olympiques de Moscou. Ces ordinateurs seraient destinés à l'agence de tourisme soviétique Intourist. Les Soviétiques ont déclaré qu'IBM serait disposé à fournir ces systèmes si le Département d'État l'approuvait. Nous pourrions donner notre accord ; cela soulignerait les efforts de coopération internationale en vue des prochains Jeux olympiques et offrirait une ouverture diplomatique avec les Soviétiques. Cependant, certains responsables du Département de la Défense avertissent que les Soviétiques pourraient utiliser ces systèmes pour développer leur propre technologie informatique, menaçant ainsi les avancées américaines dans ce domaine. Nous devons décider d'approuver ou non la vente d'ordinateurs IBM."
 sov_ibm_purchase.1.d:0 "Le gouvernement américain a approuvé l'accord conclu avec IBM pour la vente de systèmes informatiques destinés à notre système de réservation pour les prochains Jeux olympiques. Notre agence de tourisme Intourist recevra ces ordinateurs, ce qui facilitera grandement la participation des visiteurs internationaux, des athlètes et des médias aux Jeux. La décision américaine est un excellent signe de bonne foi et, si ces systèmes s'avèrent aussi efficaces qu'annoncé, elle pourrait inciter à un regain d'intérêt pour l'informatique dans le pays. Certains craignent que les Américains tentent de nous espionner avec ces ordinateurs, mais les responsables de la sécurité ont balayé ces inquiétudes, estimant que ces systèmes sont destinés à Intourist et non à une agence sensible."
 sov_ibm_purchase.2.d:0 "Notre récente tentative de dialogue avec les Américains dans un esprit de coopération internationale pour les prochains Jeux olympiques de Moscou s'est soldée par une déception. Nous avons récemment tenté de faciliter l'achat d'ordinateurs auprès de l'entreprise américaine IBM. Ces ordinateurs devaient être destinés à Intourist, notre agence de tourisme, et mettre en place un système de réservation facilitant les voyages de visiteurs du monde entier. En réponse à cette simple demande, le gouvernement américain a annulé l'accord, démontrant ainsi l'incessante agressivité et l'hostilité de ses États-Unis. L'échec de l'acquisition de ces systèmes entravera les préparatifs, mais le peuple soviétique ne faillira pas à ses responsabilités et n'oubliera pas ce dernier affront américain."
 encourage_scientific_competition:0 "Compétition scientifique encouragée"
 equal_pay_act:0 "Augmentation des salaires"
 sov_sell_tech.0.d:0 "Une délégation de haut niveau est récemment arrivée de Moscou. Lors des discussions, un haut responsable soviétique nous a proposé d'acquérir des technologies auprès de cette délégation. Ils ont souligné que l'Union soviétique possédait la plus grande infrastructure scientifique du monde socialiste et que ces technologies pourraient grandement bénéficier à notre nation. Il est évident que la délégation attend de nous une réponse définitive à sa proposition. Si nous achetons ces technologies, cela affectera certainement nos réserves financières, mais cela renforcera les liens entre nos deux États. De plus, ces technologies pourraient s'avérer bénéfiques pour nous. Si nous rejetons la proposition soviétique, la délégation exprimera certainement sa déception et Moscou pourrait s'indigner. Cependant, une brève détérioration de nos relations avec les Soviétiques pourrait être le prix à payer pour notre stabilité financière."
 sov_sell_tech.1.d:0 "Une délégation a récemment été envoyée en [FROM.GetName] afin de discuter des problèmes communs auxquels nous sommes confrontés et de leur proposer de vendre des technologies. Vendre ces technologies aux autres États socialistes renforcera le monde socialiste et contribuera au financement des nombreux scientifiques et laboratoires soviétiques qui font progresser les technologies en concurrence avec l'Occident. Après avoir reçu la proposition, le gouvernement de [FROM.GetName] a accepté avec enthousiasme. Il a exprimé sa volonté de faire progresser son peuple et de le faire grâce aux connaissances acquises dans le monde socialiste. Cette visite fructueuse renforce sans aucun doute les liens entre l'Union soviétique et [FROM.GetName]. Des projets de vente de technologies à des États amis et enthousiastes sont déjà en cours d'élaboration."
 sov_sell_tech.2.d:0 "Une délégation a récemment été envoyée en [FROM.GetName] afin de discuter de problèmes communs et de leur proposer de leur vendre de la technologie. Vendre cette technologie à d'autres États socialistes renforcera le monde socialiste et contribuera au financement des nombreux scientifiques et laboratoires soviétiques qui font progresser la technologie en concurrence avec l'Occident. Après avoir reçu la proposition, le gouvernement de [FROM.GetName] a stupéfait nos diplomates en déclinant. Sans brusquerie ni brutalité, il a souligné que des contraintes financières entravaient leur capacité à acquérir la technologie. Bien sûr, il s'agit probablement d'un mensonge : dès le retour de la délégation, nous réduirons temporairement les effectifs de l'ambassade et de ses services consulaires pour manifester notre mécontentement."
 ABMT.1.d:0 "Le Premier ministre Léonid Brejnev et de hauts responsables du parti nous ont proposé un traité sur les missiles antibalistiques. Ce traité limiterait le déploiement de ces armes aux seuls sites ICBM et à la capitale. Nos deux pays développent actuellement des systèmes antimissiles balistiques (ABM) afin de limiter les effets dévastateurs d'un échange nucléaire total. Cependant, il est clair que de tels projets sont très coûteux et risquent de déclencher une nouvelle course aux armements. Bien que nous soyons convaincus que nos avancées technologiques nous donneront un avantage à terme, certains de nos théoriciens suggèrent qu'un tel scénario pourrait inciter les Soviétiques à frapper en premier. Cette proposition paraît judicieuse, car nos experts militaires estiment que les ABM ne permettent pas actuellement d'empêcher l'annihilation nucléaire. L'accepter améliorerait également les relations avec les Soviétiques. Cependant, certains conseillers de haut rang estiment que la proposition soviétique témoigne de leur faiblesse en matière de recherche sur les ABM ; nous devrions donc la rejeter et poursuivre la nôtre."
 SALT_II.1.d:0 "L'Union soviétique propose une nouvelle série de négociations sur la limitation des armements stratégiques pour les deux pays. Ce nouveau traité exigerait la réduction des stocks nucléaires à un plafond précis. Il limiterait également l'élaboration de nouveaux traités, bien que les programmes de développement actuels des deux pays soient exemptés, ce qui signifie que les programmes futurs seront limités. Le traité proposé ne limite pas drastiquement les stocks et les deux pays conserveront la parité stratégique, mais il mettrait fin à la course aux armements nucléaires et au stockage de ces armes. Étant donné que le traité ne modifie pas radicalement l'équilibre des pouvoirs, sa signature est logique, nous permettrait de financer des programmes plus urgents et constituerait une excellente occasion de recueillir le soutien international. Malgré cela, certains hauts responsables du Pentagone nous exhortent à ne pas signer le traité et à nous concentrer plutôt sur le développement de systèmes plus avancés, ce qui renforcerait l'équilibre stratégique en notre faveur."
 ROM_NORMALIZATION.1.d:0 "Pendant des années, le parti communiste roumain, dirigé par Nicolae Ceausescu, s'est écarté de la ligne marxiste-léniniste en matière de développement économique, de droits individuels et de politique étrangère. La Roumanie a parfois dérogé à la ligne soviétique sur les questions internationales et s'est progressivement retirée du commandement militaire du Pacte de Varsovie, au grand dam des responsables soviétiques. Pour le régime soviétique de Léonid Brejnev, cela est inacceptable et constitue une violation de sa doctrine. Lors d'une récente réunion du Pacte de Varsovie, le gouvernement soviétique a proposé aux Roumains une normalisation de leurs relations s'ils acceptaient de purger leur parti des déviants et de ramener le pays sur la voie du marxisme-léninisme. Le gouvernement soviétique a constaté que le socialisme roumain était menacé par des forces internes et que, si rien ne changeait, Moscou n'hésiterait pas à aider le peuple. Le gouvernement roumain doit maintenant décider comment il réagira face à ce défi."
 ROM_NORMALIZATION.2.d:0 "L'Union soviétique s'est réjouie d'apprendre récemment la décision, lors d'une réunion extraordinaire du Parti communiste roumain, de destituer Nicolae Ceausescu et de ramener la Roumanie à l'exemple soviétique. Ceausescu et ses alliés ont résisté avec véhémence, mais ils ont été déjoués lors de la réunion. Les membres pro-Moscou du parti se sont alliés aux opposants à Ceausescu et à d'autres qui craignaient une intervention soviétique pour destituer le dirigeant roumain de longue date. Ceausescu a été accusé de déviation du marxisme-léninisme, d'activités contre-révolutionnaires et de corruption. Lui et ses alliés ont été démis de leurs fonctions au sein du parti et il reste à voir s'ils seront finalement jugés. Ces événements constituent une victoire majeure pour l'Union soviétique et la doctrine Brejnev."
 ROM_NORMALIZATION.3.d:0 "L'Union soviétique, sous Léonid Brejnev, a adopté une nouvelle doctrine selon laquelle Moscou se réserve le droit de sauver les États socialistes confrontés à des menaces existentielles, internes ou externes. Récemment, les Soviétiques ont demandé au Parti communiste roumain de restaurer un caractère socialiste à son gouvernement et à sa politique, sous peine d'en subir les conséquences. Malgré les efforts de dissidents au sein du Parti communiste roumain, Nicolae Ceausescu, longtemps au pouvoir en Roumanie, a survécu et est désormais plus fermement ancré à sa tête. Une fois son pouvoir assuré, il a accusé les Soviétiques d'ingérence dans les affaires roumaines et a rejeté leurs exigences. Le gouvernement roumain a affirmé qu'il restait attaché à sa révolution et à son caractère socialiste et a rejeté les affirmations soviétiques contraires, suggérant que l'Union soviétique modère ses propres ambitions."
 SOV_PLO.1.d:0 "L'Union soviétique soutient depuis longtemps les luttes des Arabes contre les impérialistes et leurs marionnettes régionales. L'Organisation de libération de la Palestine (OLP), en particulier, s'est engagée depuis longtemps en faveur de la libération nationale des territoires occupés par Israël. Afin de sensibiliser l'opinion publique à sa cause et de faire pression sur les Israéliens, l'OLP a lancé plusieurs opérations spectaculaires, que ces derniers et leurs alliés condamnent comme terroristes. Cependant, le gouvernement soviétique a préféré qualifier ces actions d'expression d'un peuple opprimé et faire pression sur les Israéliens pour qu'ils mettent fin à leur occupation. Soutenir l'OLP améliorera grandement notre image dans le monde arabe et nous permettra d'apparaître comme un allié viable et non impérialiste auprès des États et organisations arabes comme l'OLP."
 SOV_Beria_Struggle.1.d:0 "La situation a atteint un point critique après la disparition du camarade Staline. Les membres du Politburo ont déjà eu vent de l'ambition débridée de Nikita Khrouchtchev. Lui et ses partisans se livrent déjà à des machinations pour se faire des alliés et s'emparer du pouvoir pour leur faction. Selon les mesures que nous prendrons dans les prochains jours, nous pourrons peut-être stopper Khrouchtchev et sa quête égoïste de pouvoir. Grâce à ces actions, nous pouvons garantir que le vaillant Lavrenti Beria ou le dévoué Gueorgui Malenkov prennent les rênes du pouvoir et sauvent l'Union soviétique du factionnalisme et des ambitions personnelles."
 SOV_Beria_Struggle.2.d:0 "Avant sa disparition tragique, le camarade Staline avait préparé un plan visant à éliminer les traîtres et les membres corrompus du parti. Staline estimait qu'une telle action remonterait le moral du peuple soviétique et garantirait que le parti se souvienne de son dévouement à l'État et à ses responsabilités. Ces purges renforceraient la position de Lavrentiy Beria et de Gueorgui Malenkov, et entraîneraient la destitution d'Anastas Mikoyan. Elles provoqueraient également la panique chez des rivaux tels que Nikita Khrouchtchev et Kliment Vorochilov. Cependant, Malenkov souligne qu'une telle action pourrait aliéner des alliés potentiels et provoquer un conflit avant que lui ou Beria ne soient prêts. La question est désormais de savoir s'il faut mettre en œuvre la purge ou la reporter jusqu'à ce que la situation se clarifie."
 SOV_Beria_Struggle.3.d:0 "Gueorgui Malenkov et Lavrenti Beria cherchent des moyens d'obtenir le soutien des éléments bolcheviques du parti. Si Kilment Vorochilov pouvait être recruté, ils gagneraient un bolchevique et un officier supérieur de l'Armée rouge. Cependant, Vorochilov semble réticent à soutenir l'un ou l'autre. Une solution pour le convaincre serait de rassembler ou de créer des documents et des témoins soulignant les faiblesses militaires de Vorochilov pendant la Guerre d'Hiver et la Grande Guerre patriotique. Nous pourrions ensuite utiliser ces documents pour le convaincre de nous soutenir. Cependant, déployer des efforts aussi extrêmes pour contraindre un allié comporte des risques, et même dans ce cas, Vorochilov pourrait se révéler peu fiable. Il serait peut-être préférable de trouver un autre partisan de la ligne dure pour nous soutenir."
 SOV_Beria_Struggle.4.d:0 "Nous avons réussi à rassembler suffisamment de documents et de témoins pour convaincre Kilment Vorochilov que nous possédions les moyens de détruire sa réputation au sein du Parti et de l'Armée rouge. Il est tellement préoccupé par nos informations qu'il nous a promis son soutien total à l'avenir. Il est devenu notre homme et nous bénéficions désormais du soutien d'un officier supérieur, influent et de la ligne dure."
 SOV_Beria_Struggle.41.d:0 "Le général Joukov semble réticent à s'engager en politique, mais nous avons élaboré un plan et une promesse. En échange de son soutien, nous mettrons en œuvre une réforme de dépolitisation de l'armée. Cela réduirait considérablement l'influence et le pouvoir des commissaires politiques au sein de l'Armée rouge. Le général Joukov a longtemps exprimé sa conviction que, durant la dernière guerre, les commissaires ont souvent interféré avec l'efficacité et la discipline militaires. Fort de cette promesse, nous espérons que le général Joukov agira enfin et ralliera l'Armée rouge à notre cause."
 SOV_Beria_Struggle.42.d:0 "Les membres du Politburo ont commencé à soutenir ouvertement Lazar Kaganovitch pour qu'il devienne le nouveau chef du Parti. Stalinien convaincu, Kaganovitch était un conseiller et partenaire reconnu du camarade Staline. Fort de sa vaste expérience et de son dévouement à la Révolution, rares sont ceux qui pourraient contester sa candidature à la tête du parti. Nombreux sont ceux qui se bousculent désormais pour trouver un poste proche de Lazare de Fer."
 SOV_Beria_Struggle.5.d:0 "Les nouvelles en provenance de Berlin sont inquiétantes. Les forces soviétiques locales ont dû recourir à une force importante, y compris des chars, pour réprimer les manifestations. Nombreux sont ceux au Politburo qui constatent que, malgré certaines mesures de libéralisation prises par Lavrentiy Beria, cela a conduit à des scènes similaires aux émeutes de Berlin. Afin d'évaluer la situation à Berlin et de déterminer les mesures à prendre, le camarade Molotov s'est porté volontaire pour se rendre immédiatement à Berlin, calmer le jeu, puis envoyer un rapport à Moscou. Beria doit décider d'approuver ou non le voyage de Molotov. Si Beria a réussi à sécuriser ou neutraliser les principaux partisans de la ligne dure, un tel voyage ne constituerait pas une menace, mais si ces derniers restent indépendants, Molotov pourrait revenir avec un rapport accablant sur la situation."
 SOV_Beria_Struggle.6.d:0 "Le ministre de la Défense Nikolaï Boulganine représente une menace sérieuse pour Gueorgui Malenkov et Lavrenti Beria. Pendant la guerre, il a noué des liens étroits avec l'Armée rouge et, en cas de crise, pourrait apporter un soutien militaire à l'ambitieux Khrouchtchev. Cependant, Beria et ses agents ont recueilli des témoignages accablants sur Boulganine et disposent de suffisamment de preuves pour l'arrêter sous plusieurs chefs d'accusation. L'arrestation de Boulganine profiterait à Malenkov et à Beria, mais ce dernier en tirerait un bénéfice particulier. Ne pas arrêter Boulganine maintenant est risqué, mais cela pourrait en valoir la peine, car un tel acte pourrait avoir des conséquences imprévues."
 SOV_Beria_Struggle.71.d:0 "Après avoir neutralisé Nikolaï Boulganine, Lavrenti Beria a désormais jeté son dévolu sur Dmitri Chepilov, le rédacteur en chef de la Pravda. Fort de son influence sur les médias, Chepilov pourrait rallier Nikita Khrouchtchev et devenir une menace majeure. Grâce à des agents de confiance, Beria peut faire éliminer Chepilov publiquement. Cela inspirera sans aucun doute la peur chez ses opposants et ouvrira la voie à sa victoire et à celle de ses alliés. Cependant, certains officiers proches craignent qu'un tel acte ne se retourne contre lui et n'ait des conséquences imprévues. La question est désormais de savoir s'il faut ordonner l'attaque ou non."
 SOV_Beria_Struggle.81.d:0 "Lors d'une réunion spectaculaire du Politburo, Lavrentiy Beria a mené une campagne visant à évincer Nikita Khrouchtchev du poste de Premier ministre de l'Union soviétique. Beria et ses alliés ont réussi à les déjouer. Ceci marque le point culminant de la campagne victorieuse menée par Beria et ses alliés pour empêcher Khrouchtchev, trop ambitieux, de s'emparer du pouvoir et de saper l'ensemble de l'État socialiste. Le camarade Beria cherchera désormais à consolider son emprise sur l'État et le Parti. Bien sûr, Malenkov est toujours co-dirigeant, mais Beria a assuré sa place au duumvirat. Leur direction est vouée à apporter des changements tels qu'une politique de détente et une réorientation vers les biens de consommation."
 SOV_Beria_Struggle.82.d:0 "Lors d'une réunion spectaculaire du Politburo, Gueorgui Malenkov a mené une campagne pour accéder au poste de Premier ministre de l'Union soviétique. Son rival, Nikita Khrouchtchev, et ses alliés n'ont pas pu arrêter les actions de Malenkov et de ses partisans. Ceci marque le point culminant de la campagne victorieuse menée par Malenkov et ses alliés pour empêcher Khrouchtchev, trop ambitieux, de s'emparer du pouvoir et de saper l'ensemble de l'État socialiste. Malenkov, longtemps considéré comme le successeur naturel de Staline, cherchera désormais à consolider son emprise sur l'État et le Parti. On peut déjà imaginer que Malenkov initiera une forte réorientation vers les biens de consommation, mais il craint pour l'instant que Beria ne soit devenu trop dangereux."
 SOV_Beria_Struggle.9.d:0 "La carrière et les machinations de Lavrenti Beria prirent fin après sa condamnation par la Cour suprême de l'Union soviétique. Beria et six accusés furent fusillés peu après le verdict. L'arrestation de Beria avait eu lieu plusieurs mois plus tôt lors d'une réunion du Présidium. Condamné par ses collègues, il fut rapidement arrêté par des officiers de l'Armée rouge. L'armée intervint rapidement pour arrêter ses officiers supérieurs et sécuriser son service de renseignement afin d'empêcher un coup d'État ou un soulèvement pro-Beria. Finalement, Beria fut reconnu coupable de trahison, de terrorisme et d'activités contre-révolutionnaires. Il fut également accusé d'avoir profité de sa position pour commettre des centaines de viols et autres actes déviants. Sa mort ne sera pas pleurée, surtout par ses nombreuses victimes."
 SOV_AFG.1.d:0 "Après le renversement de la monarchie afghane, la situation en Afghanistan est restée incertaine. Malgré le soutien soviétique, le gouvernement du président Daoud n'a pas engagé de réformes et des puissances extérieures ont organisé des groupes militants et des actions subversives contre le gouvernement. Lors de la révolution de Saur, le président Daoud et sa famille ont été exécutés, ce qui a conduit à un gouvernement socialiste plus radical. Cependant, malgré un soutien soviétique massif, le nouveau régime a connu des difficultés. Une récente flambée de rébellions, notamment autour d'Hérat, a conduit des éléments au sein du gouvernement à demander l'aide soviétique. Depuis la frontière, les troupes et les chars soviétiques ont rapidement progressé tandis que les parachutistes soviétiques sécurisaient des sites clés à Kaboul. Les Soviétiques affirment avoir été invités par le gouvernement PDPA au pouvoir et qu'une fois la stabilité rétablie, ils se retireront. L'invasion est déjà condamnée par la communauté internationale, beaucoup considérant l'intervention soviétique et la répression des rebelles afghans comme une violation flagrante du droit international."
 Brezhnev_POL.1.d:0 "Les forces soviétiques ont franchi la frontière polonaise afin de sécuriser le régime communiste en Pologne et d'écraser le mouvement Solidarité. Solidarité a débuté par une grève sur un chantier naval contre la direction pour le licenciement arbitraire d'un ouvrier, mais s'est rapidement étendue à d'autres grèves et manifestations de colère face à la stagnation de l'économie. Les communistes polonais ont accepté de reconnaître Solidarité comme le premier syndicat indépendant du bloc soviétique, mais le groupe a continué de remettre en question la politique gouvernementale. Le Premier ministre soviétique Léonid Brejnev a vu cela comme une menace pour le communisme en Pologne et, invoquant la doctrine Brejnev, a autorisé une intervention militaire pour mettre fin à Solidarité et rétablir la discipline du parti en Pologne. Il est significatif que l'armée polonaise et les hauts dirigeants communistes soient mécontents et peu coopératifs envers leur allié du Pacte de Varsovie. Les Soviétiques ont apparemment refusé de les laisser résoudre la crise en interne et craignent maintenant que l'action soviétique ne renforce l'attrait populaire de Solidarité."
 SOV_Detente.1.d:0 "Le gouvernement soviétique reconnaît que la persistance des tensions liées à la Guerre froide a entraîné d'importantes dépenses militaires et un état d'alerte permanent. Cette situation nuit à l'économie et entrave la capacité du gouvernement à subvenir aux besoins de sa population. De plus, maintenir une position agressive ne fait qu'encourager nos ennemis et leurs alliés à se retrancher davantage les uns contre les autres. Pour remédier à cette situation, l'Union soviétique a décidé de lancer une campagne visant à adoucir sa rhétorique internationale, à dialoguer plus ouvertement avec les États-Unis et leurs alliés et à tenter d'apaiser les tensions mondiales. Cela lui permettra de se concentrer davantage sur son économie, d'améliorer sa position internationale et, en affichant son côté plus conciliant, de convaincre certaines puissances neutres, voire certains alliés des États-Unis, de se réaligner. L'Union soviétique cherche à instaurer une période de détente ou de relaxation avec les États-Unis."
 SOV_VIN.20.d:0 "Dans une nouvelle offensive diplomatique lancée dans les capitales des principaux États impliqués au Vietnam et aux Nations Unies, l'Union soviétique exhorte toutes les parties à unir leurs forces pour la paix. Les diplomates soviétiques soulignent que les violences qui durent depuis des décennies doivent cesser rapidement et que le peuple vietnamien a suffisamment souffert. Outre l'appel lancé aux États-Unis pour qu'ils réduisent leurs opérations de combat, les Soviétiques ont également exhorté le gouvernement sud-vietnamien à faire preuve de retenue. Cependant, contrairement à leurs précédents appels à la paix, les Soviétiques ont exhorté le Nord-Vietnam à contribuer à l'effort de paix en ralentissant le flux de combattants et en engageant des pourparlers de paix avec souplesse. En privé, certaines sources indiquent que des diplomates soviétiques ont informé Hanoï qu'un manque de volonté de négocier activement la paix entraînerait la perte de l'aide soviétique. Les Américains apprécieront sans aucun doute cet effort."
 SOV_Mid_FP.1.d:0 "L'Union soviétique et les États-Unis participent à des négociations sur la limitation des armements stratégiques afin de discuter des moyens de limiter et de contrôler la course aux armements nucléaires. Les deux pays disposent d'immenses capacités en matière de missiles stratégiques, mais la volonté de moderniser leurs systèmes d'armes et de constituer des stocks d'ogives devient très coûteuse pour les deux pays. Jusqu'à présent, il semble que les négociations puissent aboutir à un accord sur un gel des niveaux actuels de missiles et une limitation du nombre de certains systèmes de lancement. Un tel accord serait bien accueilli à l'échelle internationale et nombreux sont ceux qui pensent qu'il pourrait ouvrir la voie à de futures négociations qui pourraient, à terme, guider le monde vers la dénucléarisation. Cependant, de nombreux experts estiment que de telles prédictions sont trop ambitieuses ou lointaines."
 ABMT.2.d:0 "Les États-Unis ont informé l'Union soviétique de leur rejet du projet de traité sur les missiles antibalistiques (ABMT). Il s'agit d'un coup dur pour les efforts soviétiques visant à maîtriser les dépenses et à relancer la course aux armements. Cette décision indique que les Américains prévoient d'étendre leurs recherches sur les ABM et souhaitent trouver un moyen de modifier la parité stratégique actuelle. Les dirigeants militaires soviétiques insistent sur le fait qu'ils mènent leurs propres recherches sur les ABM et qu'ils ne se laisseront pas distancer par les États-Unis. De fait, un officier supérieur a souligné que les ABM sont une entreprise très coûteuse et que, même si les Américains progressent, il ne sera pas difficile pour un adversaire de trouver des moyens de neutraliser ces systèmes avec peu d'efforts et de moyens financiers. Les Américains ont rejeté ces accusations et ont affirmé qu'ils ne transigeront pas avec les puissances étrangères sur la recherche de technologies susceptibles de sauver des vies américaines."
 ABMT.3.d:0 "Les États-Unis ont informé l'Union soviétique de leur acceptation du traité sur les missiles antibalistiques (ABMT). Il s'agit d'un grand triomphe pour les diplomates des deux pays. Le risque d'une course aux armements antibalistiques est désormais écarté, et les ministères des Affaires étrangères des deux pays n'auront plus à consacrer de ressources à de tels projets. La principale crainte au Kremlin était qu'une telle course aux armements antibalistiques puisse conduire les États-Unis à exploiter leurs avantages technologiques pour obtenir un avantage déloyal. Un tel scénario aurait été déstabilisateur pour la paix mondiale. En effet, des rapports américains indiquent que l'une des raisons de l'acceptation du traité est la conviction qu'une percée américaine dans la technologie ABM pourrait inciter l'Union soviétique à frapper la première avant de perdre son avantage. Quel que soit le raisonnement, les États-Unis et l'Union soviétique se réjouissent et espèrent que ce traité marquera un réchauffement des relations entre les deux nations."
 SALT_II.2.d:0 "Les États-Unis ont rejeté les propositions du dernier traité sur la limitation des armements stratégiques (SALT II). Cet accord aurait vu les deux pays, pour la première fois, limiter leurs arsenaux, le développement de nouvelles technologies de missiles et la réduction de leurs plateformes de lancement. Ce rejet américain a intrigué certains experts, qui soulignent que même les limitations prévues par le traité n'affaiblissaient guère la capacité de chaque État à détruire l'autre. Les Soviétiques, furieux, auraient été qualifiés de bellicistes américains. Cependant, un diplomate américain impliqué dans le processus décisionnel a souligné que cette décision était étroitement liée à une série d'actions subversives récemment découvertes par les Soviétiques, témoignant de leur manque de sincérité quant à une réelle réduction du risque de guerre nucléaire mondiale."
 SALT_II.3.d:0 "Les États-Unis ont accepté les propositions du dernier traité sur la limitation des armements stratégiques (SALT II). Cet accord verra les deux pays, pour la première fois, limiter leurs arsenaux, le développement de nouvelles technologies de missiles et la réduction de leurs plateformes de lancement. Les experts soulignent que cet accord n'entame guère la capacité de frappe de l'une ou l'autre partie, mais qu'il marque un effort pour mettre fin au stockage d'armes nucléaires et au développement de nouveaux vecteurs. Cet accord est salué dans les deux pays comme un pas dans la bonne direction et espère qu'il conduira à un réchauffement des relations. Nombreux sont ceux qui espèrent que ces discussions se poursuivront dans les années à venir, aboutissant à terme au désarmement nucléaire. Les deux pays se disent satisfaits de l'accord et de ses implications."
 Sov_FP.125.d:0 "L'Union soviétique a récemment réorienté sa politique étrangère envers l'Europe occidentale. Elle a complètement adouci le ton. Plutôt que de se montrer hostile ou de s'isoler, elle a engagé ces États dans des échanges amicaux, ce qui a favorisé le développement des liens commerciaux, culturels et politiques. L'amélioration des relations et l'optimisme croissant de nombreux Européens de l'Ouest quant à un avenir de coexistence pacifique ont poussé les Soviétiques à demander à ces États de mettre fin à leur refus, après la Seconde Guerre mondiale, de reconnaître les frontières établies dans le bloc de l'Est. Plus précisément, leur opposition de longue date aux frontières de l'Allemagne de l'Est et de la Pologne. Les Soviétiques diront à l'Europe occidentale que cela entretient les tensions et que leur reconnaissance éliminera un obstacle majeur à la paix européenne. Un accord sur les frontières renforcera également la position de l'Union soviétique auprès de ses alliés du Pacte de Varsovie."
 Brezhnev.1.d:0 "Pour Léonid Brejnev et ses principaux partenaires au sein du gouvernement soviétique, l'une des plus grandes erreurs du gouvernement précédent fut sa tolérance au socialisme multiple. Cela a conduit de nombreux États communistes à s'écarter des pratiques marxistes-léninistes acceptées et à s'éloigner du modèle soviétique. De plus, des forces extérieures financées par des intérêts capitalistes tentent souvent de subvertir les régimes pour faciliter un virage vers le capitalisme. Pour lutter contre cela, Brejnev a annoncé une nouvelle doctrine, la « doctrine Brejnev ». L'Union soviétique a le droit d'intervenir militairement dans tout État socialiste ou communiste confronté à des menaces internes ou externes afin de préserver la société socialiste. La souveraineté nationale ne supplante pas les intérêts du socialisme mondial et l'Union soviétique agira si nécessaire. Cette nouvelle doctrine marque une démonstration de force de l'Union soviétique. Le flou de son langage signifie que ce n'est que lorsqu'elle sera mise en pratique que les alliés et les ennemis de l'Union soviétique commenceront à en comprendre les limites et les pratiques."
 ROM_NORMALIZATION.4.d:0 "Le rejet provocateur de la doctrine Brejnev par la Roumanie a conduit à une réunion d'urgence du Pacte de Varsovie. Après consultations, le Premier ministre soviétique, Léonid Brejnev, a annoncé que, pour préserver le socialisme en Roumanie, le Pacte de Varsovie lancerait des opérations militaires en Roumanie. Il a appelé les forces militaires roumaines à se retirer et le peuple à se mobiliser pour aider ses frères socialistes à libérer leur pays de la tyrannie de Nicolae Ceausescu. Le gouvernement roumain n'a pas réagi immédiatement. Cependant, plusieurs États européens indignés ont déjà déclaré leur intention de porter l'invasion devant les Nations Unies. L'action soviétique confirme son adhésion à la doctrine Brejnev, qui promet une action militaire pour soutenir tout État socialiste confronté à des forces internes ou externes menaçant son existence."
 ROM_NORMALIZATION.5.d:0 "Le rejet provocateur de la doctrine Brejnev par la Roumanie a conduit à une réunion d'urgence du Pacte de Varsovie. Après consultations, le Premier ministre soviétique, Léonid Brejnev, a annoncé que l'Union soviétique et ses alliés poursuivraient leurs pressions diplomatiques sur la Roumanie et l'exhorteraient à adopter les bonnes pratiques marxistes-léninistes. Cette annonce a apaisé les tensions régionales et les craintes d'une invasion soviétique imminente. De nombreux analystes estiment que la décision soviétique de ne pas recourir à la force militaire montre les limites de la doctrine Brejnev. On ignore si les Soviétiques ont décidé de ne pas agir pour défendre leurs propres intérêts ou si les dirigeants soviétiques craignaient qu'une action militaire contre la Roumanie ne risque la défection d'autres alliés du Pacte de Varsovie, susceptibles de ne pas vouloir participer à une telle opération. Quoi qu'il en soit, cet incident met en évidence les limites du pouvoir et de l'influence soviétiques, ce que certains interprètent comme la preuve que les Soviétiques perdent le contrôle du Pacte de Varsovie et du communisme mondial."
 SOV_Kashmir.1.d:0 "\nL'Union soviétique reconnaît que l'Inde et le Pakistan ont tous deux été victimes de l'exploitation capitaliste et de l'impérialisme sous le régime colonial. Pour aider les deux pays, elle a récemment proposé d'engager des négociations avec les dirigeants indien et pakistanais au sujet de la région contestée du Cachemire. Les deux pays ont réagi positivement à cette idée. Si des négociations ont lieu, les chances d'aboutir à une véritable avancée sont très faibles, mais leur accord à la médiation soviétique témoigne de la puissance diplomatique croissante de l'Union soviétique. Dans leur déclaration, les Soviétiques ont également ajouté qu'ils n'avaient d'autre objectif que la paix et espéraient apprendre des deux parties. Ils ont également affirmé être amis de tous les peuples indien et pakistanais et agiraient toujours comme une force mondiale pour le bien."
 SOV_PAL.1.d:0 "\nL'Union soviétique a annoncé son soutien sans réserve à la solution à deux États comme cadre de paix au Moyen-Orient. Le gouvernement soviétique a déclaré que toute autre solution serait injuste et conduirait à un conflit sans fin. Les Soviétiques ont ajouté qu'une telle solution devrait conduire au retour des Palestiniens dans leurs foyers d'où ils avaient été expulsés. Le gouvernement israélien a simplement déclaré qu'il attendait de l'Union soviétique qu'elle respecte sa souveraineté et sa sécurité. Un porte-parole palestinien a déclaré apprécier tout État reconnaissant le droit des Palestiniens à rentrer chez eux, sans toutefois évoquer l'idée d'un État israélien. La position soviétique est perçue comme un moyen de faire pression sur les Israéliens pour qu'ils se montrent plus flexibles concernant les futurs accords de paix."
 Solzhenitsyn.1.d:0 "\nAlexandre Soljenitsyne a récemment reçu le prix Nobel de littérature. Cet auteur acclamé est un critique virulent de l'Union soviétique et de son système de gouvernement. Cependant, le gouvernement soviétique de Léonid Brejnev a annoncé que Soljenitsyne se verrait interdire de recevoir son prix en raison de ses œuvres antisoviétiques. Soljenitsyne a servi dans l'armée soviétique pendant la Seconde Guerre mondiale, mais après la guerre, il a été envoyé au goulag pour avoir critiqué Staline dans une lettre. Sous le régime de Nikita Khrouchtchev, Soljenitsyne a été autorisé à publier son autobiographie sur son séjour au goulag, reflétant l'apogée de la libéralisation sous Khrouchtchev. Cependant, son successeur, Léonid Brejnev, a inversé cette libéralisation et a utilisé les agences d'État et les médias pour critiquer Soljenitsyne. Il a également gouverné par consensus et beaucoup pensent que d'autres membres importants dictent la position ferme du gouvernement sur cette question. La communauté internationale et les intellectuels du monde entier critiquent Moscou pour sa décision."
 DevSocialism.1.d:0 "Le Premier ministre Léonid Brejnev et les principaux membres du parti s'accordent à dire que l'Union soviétique a atteint le stade du socialisme développé. Selon Moscou, la structure économique et l'orientation actuelles de l'État représentent la société socialiste la plus avancée au monde. Tous les autres États communistes doivent s'efforcer d'atteindre ce statut et ne doivent pas s'en écarter. Dans le monde communiste, cet argument est perçu comme une critique des autres régimes qui se sont écartés du modèle économique soviétique ces dernières années. Ces États affirment qu'ils doivent s'écarter du modèle pour adapter leur société au socialisme. Cependant, la position de Brejnev indique que l'Union soviétique cherche à inciter toutes ses républiques soviétiques et le monde communiste dans son ensemble à mettre fin à leurs déviations économiques et à s'inspirer de l'Union soviétique comme centre du progrès économique communiste mondial."
 Brezhnev_Constitution.1.d:0 "L'Union soviétique a adopté une nouvelle constitution lors de la septième session du Soviet suprême, qui s'est récemment achevée. Ce nouveau document confirme l'Union soviétique comme un État socialiste développé, doté d'un peuple unifié, indivisible par son identité nationale ou même sa profession. La constitution affirme que le parti représente désormais non seulement les ouvriers et les paysans, mais tous les citoyens de la société soviétique. Plus important encore, la nouvelle constitution érode l'autonomie des républiques socialistes au sein de l'Union soviétique et exige de tous qu'ils se soumettent aux lois soviétiques et acceptent la suprématie de la souveraineté soviétique. Les citoyens soviétiques bénéficient également de droits fondamentaux, mais avec des restrictions. Ce document confirme nombre des idées maîtresses propagées par le régime de Léonid Brejnev, et nombreux sont ceux qui le surnomment déjà « Constitution Brejnev »."
 Brezhnev_Pol.100.d:0 "Les récents mémoires du dirigeant soviétique Léonid Brejnev, relatant ses années de la Seconde Guerre mondiale, ont reçu le prestigieux prix Lénine de littérature. Bien que ces mémoires soient considérés comme médiocres et glorifiant ses contributions mineures sur le champ de bataille, peu de gens en sont surpris en Union soviétique. Brejnev a toujours manifesté une passion intense pour les cérémonies et les récompenses. Il a reçu plus d'une centaine de médailles et on s'attend désormais à ce que les célébrations de son anniversaire soient accompagnées de nouvelles médailles et de nouveaux grades. Les nombreuses récompenses et promotions qu'il s'octroie sont l'objet de plaisanteries dans tout le pays et, bien qu'on ait apparemment rapporté à Brejnev l'amusement public suscité par son obsession pour les récompenses, il a fait peu de cas de cette situation. Pour Brejnev, si les gens plaisantent à son sujet, c'est qu'ils l'apprécient."
 stalin_dead:0 "Staline est mort"
 SOV_TUR.10.d:0 "\nL'Empire russe, puis l'Union soviétique, avaient tous deux un intérêt stratégique à s'assurer le contrôle des détroits turcs. La perte de ces détroits au profit d'une puissance hostile risquait de piéger les navires commerciaux et militaires soviétiques en mer Noire. En 1936, la Convention de Montreux décida que les détroits seraient surveillés par la Turquie et que seuls les navires des pays riverains de la mer Noire pourraient les emprunter. Après la Seconde Guerre mondiale, les Soviétiques citèrent des exemples de passages de navires de l'Axe en provenance d'Allemagne et d'Italie pendant la guerre, comme preuve de la nécessité de réécrire la Convention de Montreux. Ces demandes de concessions concernant les détroits, ainsi que leurs revendications territoriales sur la Turquie orientale, transformèrent le conflit en crise internationale. La Turquie finit par se ranger du côté des États-Unis et le conflit s'apaisa, les Soviétiques acceptant la situation, tout en soulignant qu'ils continuaient de croire que la Convention de Montreux devait être réécrite. Peut-être la Turquie pourra-t-elle finalement être persuadée de revenir à une politique étrangère neutre, voire de rejoindre l'alliance soviétique."
 TUR_SOV.2.d:0 "Le Parti communiste turc, avec l'aide de sympathisants des principales institutions, a lancé une prise de contrôle du pays. De nombreux Turcs rejettent le manque de progrès du pays en matière de réformes plus démocratiques et voient dans la crise des détroits turcs une preuve supplémentaire que la politique de neutralité a conduit la Turquie vers une situation potentiellement désastreuse. Les communistes ont trouvé un large soutien dans les zones urbaines, car les Turcs estiment que le gouvernement a ralenti ou n'a pas suivi la politique de modernisation du fondateur de la république, Mustafa Kemal. Ils souhaitent voir les symboles de la vie réactionnaire, de la religiosité et du conservatisme s'enraciner beaucoup plus fermement. Le nouveau régime turc a annoncé son espoir de réaliser la marche de la Turquie vers la société moderne. Les États-Unis seraient stupéfaits par ces développements, tandis que des rumeurs ont circulé selon lesquelles des éléments plus conservateurs, religieux et kémalistes dans les zones rurales pourraient émerger pour résister au nouveau gouvernement communiste."
 TUR_SOV.3.d:0 "La crise des détroits turcs a pris une tournure dramatique. Après que le gouvernement turc a refusé de céder aux exigences soviétiques de renégocier la Convention de Montreux de 1936 ou de renoncer à sa souveraineté sur les détroits, l'Union soviétique a lancé une invasion armée de la Turquie. Si le contrôle des détroits est un objectif clé, les Soviétiques ont également des revendications territoriales sur l'est de la Turquie. Le gouvernement soviétique a annoncé que ses soldats allaient unir les peuples soviétiques à leurs compatriotes qui avaient été séparés par des frontières créées par l'Empire ottoman réactionnaire et préservées par le régime turc actuel. Le gouvernement turc a appelé à l'aide internationale pour répondre à « l'agression manifeste » des Soviétiques et a déclaré que les Turcs devaient se rallier à la cause. Le gouvernement turc a cité la façon dont les Turcs ont forgé leur propre destin après la Première Guerre mondiale et a déclaré que la bravoure de l'époque devait revenir pour que la Turquie triomphe."
 Berlin_Blockade.2.d:0 "L'armée de l'air américaine a promis de maintenir le pont aérien. Bien que ce dernier se soit révélé très stressant, certains changements seront apportés pour en améliorer l'efficacité. Le général William Tunner, qui a réformé le corridor aérien Inde-Chine pendant la Seconde Guerre mondiale et doublé le transport aérien sur ce théâtre, a été recommandé pour prendre le commandement. Les Français ont également promis de construire un nouvel aérodrome à Berlin. Des plans sont également en cours de discussion pour fusionner avec les efforts de la Royal Air Force britannique afin d'améliorer l'efficacité et la coordination. Tant que le pont aérien continuera de fonctionner, on espère que le contre-blocus contre l'Allemagne administrée par les Soviétiques les poussera à céder. Alors que Berlin-Ouest souffre, le contre-blocus a mis à rude épreuve le développement industriel de l'Allemagne de l'Est. Sur le plan politique, on s'attend à ce que les Berlinois continuent de soutenir les efforts du pont aérien. Les citoyens qui suivent l'affaire dans les États alliés ont également apporté leur soutien jusqu'à présent et devraient continuer à soutenir cette politique."
 Berlin_Blockade.3.d:0 "\nLes États-Unis ont annoncé qu'ils retireraient le mark allemand de la circulation à Berlin-Ouest. Les États-Unis ont déclaré que leur décision n'était pas due à la pression des Soviétiques mais à leur désir d'aider la population de Berlin qui souffre depuis longtemps et non à des jeux politiques. Certains experts et politiciens occidentaux ont applaudi la décision des États-Unis de donner la priorité à la population de Berlin et pensent que le pont aérien initial a atteint son objectif, à savoir démontrer que les menaces soviétiques ne décourageront pas les Alliés. Cependant, d'autres ont manifesté leur opposition et leur désaccord, considérant la décision américaine comme une capitulation face au chantage communiste. Le gouvernement soviétique a salué le retour à la raison des États-Unis, mais n'a pas encore annoncé quand et si le blocus serait levé. Les Berlinois sont optimistes quant à la levée du blocus par les Soviétiques et sont reconnaissants de l'aide fournie jusqu'à présent par les Alliés occidentaux."
 Berlin_Blockade.4.d:0 "Le gouvernement américain a décidé de mettre un terme au pont aérien de Berlin et de déclarer Berlin ville ouverte. Les forces alliées occidentales occupant la ville ont reçu l'ordre de se retirer et les Soviétiques ont été priés de lever le blocus pour faciliter le retrait des troupes. Berlin sera une ville ouverte. La réaction des États-Unis a été plutôt négative, cette action étant considérée comme une capitulation face au chantage soviétique. Beaucoup se demandent si les États-Unis vont abandonner Berlin, ou pourquoi un autre pays ferait confiance aux États-Unis s'ils sont menacés par les Soviétiques. D'autres cependant ont souligné que Berlin n'était une ville ennemie que récemment et que risquer une guerre plus large à son sujet n'avait aucun sens. Berlin-Ouest était intenable et ne valait pas la peine de s'efforcer de la maintenir. Les Soviétiques ont déclaré qu'ils envisageaient leurs options et qu'ils devraient réagir bientôt. À Berlin-Ouest, l'ambiance s'est effondrée car beaucoup craignent ce qui se passera une fois les forces alliées retirées. Le sentiment de trahison est palpable et les tensions augmentent entre les forces alliées dans la ville et les habitants."
 Korean_War_Sov.1.d:0 "La République populaire démocratique de Corée (RPDC) a été créée en 1948 sous la direction de Kim Il-sung, un dirigeant anti-impérialiste populaire et communiste. En 1950, après avoir obtenu l'approbation de l'Union soviétique et de la République populaire de Chine (RPC), Kim a lancé une invasion de la République de Corée (RdC). Malgré un succès initial, une réponse militaire américaine massive et un déploiement de troupes ont conduit à une attaque féroce des États-Unis contre la RPDC. La position de Kim étant menacée, les Soviétiques reconnaissent que la réponse militaire massive des États-Unis pourrait éventuellement conduire à une menace pour la RPC et à un recul de tous les récents succès communistes et soviétiques en Asie. Plus important encore, un tel scénario rendrait l'Union soviétique vulnérable à l'Est. En conséquence de ces considérations et de l'implication militaire croissante des États-Unis, l'Union soviétique a décidé d'entrer en guerre aux côtés de la RPDC. Les Soviétiques aideront à libérer la Corée ainsi qu'à défendre la RPDC et la RPC contre l'agression impérialiste."
 TUR_SOV.1.d:0 "Après la Seconde Guerre mondiale, l'Union soviétique chercha à renégocier la Convention de Montreux de 1936. Cet accord autorisait la Turquie à surveiller les détroits turcs et stipulait que seuls les navires des pays riverains de la mer Noire pouvaient les emprunter. Cependant, après la guerre, les Soviétiques commencèrent à formuler des revendications territoriales sur l'est de la Turquie et exprimèrent leur mécontentement quant à l'administration des détroits. Récemment, le ministère turc des Affaires étrangères reçut une note du gouvernement soviétique. Cette note exigeait que l'accord de 1936 soit réécrit et que la Turquie renonce à son contrôle sur les détroits. La Turquie devrait peut-être accepter les offres soviétiques de gestion conjointe des détroits. La justification invoquée pour modifier le traité était les cas de traversée des détroits par des navires allemands et italiens pendant la guerre, ce qui, selon les Soviétiques, démontrait l'incapacité de la Turquie à les surveiller. Le gouvernement turc pourrait répondre à cette note en acceptant les exigences soviétiques concernant le contrôle du régime sur les détroits, mais cela risquait d'entraîner une infiltration communiste et l'occupation soviétique de sites clés. Ou bien, elle peut rejeter la lettre soviétique, la considérant comme une atteinte à la souveraineté de la Turquie. Certes, cela risquerait de provoquer une escalade de la part des Soviétiques, mais avec l'intérêt des États-Unis pour apporter leur aide, ils pourraient constituer l'allié idéal pour protéger la Turquie des machinations soviétiques."
 Berlin_Blockade.1.d:0 "Depuis que l'Union soviétique a instauré un blocus de Berlin-Ouest, furieuse de la décision des Alliés occidentaux d'introduire la nouvelle monnaie allemande, le mark allemand, les États-Unis et le Royaume-Uni ont décidé de réagir en instaurant leur propre blocus contre l'Allemagne sous administration soviétique et en lançant un pont aérien pour ravitailler la population berlinoise. Le seul moyen pour les Soviétiques de bloquer l'espace aérien était d'abattre les avions, mais ils refusèrent de franchir cette ligne. Malgré les dépenses et les difficultés subies par les équipages et les avions, le pont aérien a été maintenu, tout comme le blocus. Alors que les dirigeants américains se réunissent, ils doivent examiner les options qui s'offrent à eux, car les Soviétiques ne semblent pas disposés à assouplir le blocus. L'une d'elles serait de poursuivre le pont aérien, malgré la pression qu'il exerçait sur les équipages et les avions. Une expérience précieuse a été acquise et certains changements sur le terrain pourraient contribuer à étendre l'opération et à alléger la pression. Une seconde option serait de céder aux exigences soviétiques et de retirer la nouvelle monnaie. Cela apporterait un grand soulagement aux Berlinois, mais serait une perte de face. Finalement, la ville pourrait être déclarée ville libre, ce qui laisserait la pression sur les Soviétiques pour ouvrir le blocus afin de permettre aux forces alliées de sortir."
 Stalin_Purge.2.d:0 "Lavrenti Beria, ancien chef du NKVD et actuel responsable de la sécurité de l'État, s'était révélé un homme de main essentiel pour Joseph Staline. Il supervisa le programme nucléaire soviétique, l'affaire de Leningrad et le démantèlement du Comité antifasciste juif. Cependant, Staline devenait de plus en plus paranoïaque à l'égard de Beria, qui consolidait son propre pouvoir tout en exécutant ses ordres. Staline chercha à réduire Beria à sa plus simple expression et se concentra sur le Parti communiste géorgien, où il disposait de sa plus forte base de pouvoir. Une série d'accusations fabriquées de toutes pièces fut portée contre les principaux dirigeants du parti géorgien, accusant notamment les Mingréliens (un groupe ethnique géorgien) au sein du parti de comploter avec les exilés géorgiens et les États-Unis pour faire sortir la Géorgie de l'Union soviétique. Les arrestations et les procès qui s'ensuivirent en 1951 et 1952 virent les partisans de Beria au sein du parti géorgien être purgés, dont le premier secrétaire Candide Charkviani. Bien que la purge ait été censée viser les Mingréliens, elle a effectivement visé certains Géorgiens non-Mingréliens, comme Charkiviani. En fin de compte, la purge visait davantage à limiter l'influence et le pouvoir de Beria. Malgré l'attaque de Staline contre son pouvoir, Beria conserva son poste au Politburo."
 Stalin_Jew.1.d:0 "Le Comité juif antifasciste (JAC) fut créé fin 1941 sous la direction de Joseph Mikoels. Il s'employa à diffuser de la propagande pro-soviétique à l'étranger et à souligner l'absence d'antisémitisme en Union soviétique. Ses membres se rendirent fréquemment aux États-Unis, au Royaume-Uni, au Mexique et au Canada afin de lever des fonds et du matériel pour la cause de guerre soviétique. Le comité connut un immense succès, notamment grâce à l'établissement de liens étroits avec d'autres organisations juives nationales et internationales. Il sensibilisa à la cause soviétique et collecta des millions de dollars pour soutenir l'effort de guerre. Après la guerre, le JAC collabora avec des organisations juives américaines pour publier des informations sur l'Holocauste et la participation juive à la guerre. Cela irrita Moscou, qui y vit une remise en cause de la thèse soviétique selon laquelle la guerre était un combat universel pour tous les Soviétiques. De plus, ces contacts étroits avec des organisations américaines rendirent Staline particulièrement méfiant à l'égard des activités du JAC. Joseph Mikoels, le chef du JAC, fut assassiné et les principaux membres du comité furent arrêtés en janvier 1948 sous l'accusation de nationalisme bourgeois, de tentative de création d'un État juif en Crimée et de travail pour les intérêts américains."
 Stalin_Purge.1.d:0 "Le Premier ministre soviétique Joseph Staline nourrissait depuis longtemps des soupçons à l'égard de Leningrad et de ses dirigeants. Son ancien rival Grigori Zioviev y avait établi son pouvoir dans les années 1920, et Staline sentait que les soviets de Leningrad souhaitaient déplacer la capitale et le centre politique vers l'ancienne capitale impériale. Après la Seconde Guerre mondiale, cette suspicion se transforma en paranoïa. Le siège de Leningrad fit des dirigeants de la ville des héros nationaux et, pendant le siège, leur permit d'agir indépendamment des directives de Staline. Après la guerre, les dirigeants de Leningrad gagnèrent des postes de pouvoir au sein du gouvernement central de Moscou, leur conférant ainsi un pouvoir inégalé depuis l'arrivée au pouvoir de Staline. Craignant cette nouvelle base de pouvoir politique et l'émergence de nombreux jeunes politiciens, Staline décida d'agir. En janvier 1949, des dirigeants de Leningrad, tels qu'Alexeï Kouznetsov et Nikolaï Voznessenski, organisèrent une foire commerciale. Staline ordonna aux médias et aux forces de sécurité d'attaquer l'événement et présenta à ses rivaux de Leningrad une série d'accusations fallacieuses de détournement de fonds et de corruption. En janvier 1950, les procès s'achevèrent et six dirigeants importants de Leningrad furent condamnés à mort. L'affaire de Leningrad permit à Staline d'éliminer un pouvoir perçu comme rival."
 sov.1.t:0 "Aider la RPC"
 sov.1.d:0 "La RPC a sollicité notre aide. Devrions-nous intervenir pour l'aider ?"
 sov.1.a:0 "Oui bien sûr !"
 sov.1.b:0 "Non, pourquoi devrions-nous le faire ?"
 sov.2.t:0 "[From.GetName] veut rejoindre le Pacte de Varsovie"
 sov.2.d:0 "[From.GetName] nous ont demandé de rejoindre le Pacte de Varsovie, les acceptons-nous ?"
 sov.2.a:0 "Oui !"
 sov.2.b:0 "Non"
 sov.3.t:0 "L'unification de l'Autriche"
 sov.3.d:0 "Le peuple autrichien souhaite redevenir un pays libre et indépendant. Il pourrait servir d'État tampon entre l'Est et l'Ouest. Allons-nous l'accepter ?"
 sov.3.a:0 "Oui bien sûr !"
 sov.3.b:0 "Non, nous gardons la terre."
 sov.4.t:0 "Accepter la RPC à l'ONU"
 sov.4.d:0 "La République populaire de Chine souhaite être reconnue aux Nations Unies. La République de Chine est devenue très faible après la guerre civile, nous devrions donc soutenir la nation plus grande et plus forte désormais, qui est la République populaire de Chine."
 sov.4.a:0 "Oui bien sûr !"
 sov.4.b:0 "Non, ils resteront dehors."
 newssovever.1.d:0 "Nikita Khrouchtchev a décidé de démissionner de son poste de Premier ministre en raison de son âge avancé et de sa mauvaise santé. Nikita Khrouchtchev a dirigé l'Union soviétique pendant une décennie, lancé son programme spatial, mené la question de Berlin et, bien sûr, soutenu Cuba pour un gouvernement communiste. Nikita Khrouchtchev a déclaré qu'il souhaitait la survie de l'URSS et que Leonid Brejnev ferait un excellent travail comme Premier ministre. D'autres pays à travers le monde ont été surpris par cette décision. Quelle voie l'URSS va-t-elle suivre sous Leonid Brejnev ? Paix ou guerre ?"
 newssovever.2.d:0 "Des nouvelles choquantes sont venues d'URSS. Le président Khrouchtchev a déclaré que Léonid Brejnev avait tenté de le destituer. Khrouchtchev a affirmé avoir été trahi par ses camarades et qu'il s'agissait d'une attaque directe contre la révolution. Brejnev a répliqué en déclarant que Khrouchtchev était inapte à occuper le poste de Premier ministre, car il avait failli plonger le monde dans une troisième guerre mondiale lors de la crise des missiles de Cuba. Tous deux ont rassemblé leurs partisans, appelant la population à respecter la Constitution de l'Union en défendant le dirigeant légitime. Une lutte de pouvoir a dégénéré en violence au sein de l'Union."
 newssovever.3.d:0 "La rumeur d'un coup d'État s'est répandue très rapidement en URSS. On ne peut que supposer qu'il a été propagé par Nikita Khrouchtchev ou par quelqu'un qui nous a trahis au sein du Comité. Brejnev et le Comité sont désormais connus du monde entier et nous devons agir. L'URSS traverse une période très sombre. Les deux camps ont appelé au soutien, au respect de la justice et à la lutte contre l'autre. Quel camp devons-nous rejoindre dans la lutte pour le poste de Premier ministre ? Khrouchtchev ou Brejnev ?"
 every1.9.d:0 "Les Mexicains ont accordé l'asile politique à Nikita Khrouchtchev pour qu'il vive dans un lieu secret au Mexique. Ils ont certainement signé un accord avec Khrouchtchev pour qu'il bénéficie d'une protection et puisse ainsi leur communiquer des secrets et des plans soviétiques sur notre fonctionnement. Les Américains obtiendraient alors probablement ces secrets et ces plans du gouvernement mexicain grâce à un accord. Cela nous porterait un coup dur et nous devons trouver une solution."
 newssovever.6.d:0 "Nikita Khrouchtchev a obtenu l'asile au Mexique et a été autorisé à séjourner dans un lieu secret. Khrouchtchev s'est d'abord adressé aux Américains pour demander l'asile, mais ceux-ci ont refusé en raison des mauvaises relations et des tensions accrues que cela engendrerait. Le gouvernement mexicain l'a cependant accepté, car le Mexique était connu pour être un refuge pour fuir ses ennemis et parce que les États-Unis pourraient obtenir de l'aide de leur ami du Sud. Léon Brejnev a déclaré que l'URSS ne permettrait plus jamais à Khrouchtchev de rester et qu'il ferait mieux de prendre soin de sa vie. Nikita Khrouchtchev est désormais dans un lieu secret afin que l'URSS n'envoie pas d'agents du KGB pour le tuer. Les Mexicains y voient une excellente occasion de nouer des liens d'amitié avec les Américains et le début d'une nouvelle ère. Que va-t-il advenir de Khrouchtchev et de l'URSS maintenant ? Nikita Khrouchtchev est désormais dans un lieu secret afin que l'URSS n'envoie pas d'agents du KGB pour le tuer. Les Mexicains y voient un coup dur pour l'URSS et le début d'un grand allié. Que va-t-il advenir de Khrouchtchev et de l'URSS maintenant ?"
 newssovever.5.d:0 "Nikita Khrouchtchev a obtenu l'asile aux États-Unis et a été autorisé à séjourner dans un lieu secret. Les Américains ont déclaré qu'ils aimeraient avoir un homme connaissant l'URSS de fond en comble et son fonctionnement. Ils ont affirmé que les secrets et les renseignements de Khrouchtchev contribueraient aux efforts des États-Unis, car ils ont désormais un ennemi commun. L'URSS, cependant, est furieuse d'accepter un traître sur son territoire, ce qui ne fait que démontrer son iniquité envers la justice. Léon Brejnev a déclaré que l'URSS ne permettrait plus jamais à Khrouchtchev de revenir et qu'il ferait mieux de prendre soin de sa vie. Nikita Khrouchtchev est désormais dans un lieu secret afin que l'URSS n'envoie pas des agents du KGB pour le tuer. Les Américains qualifient cela de coup dur pour l'URSS et de début d'un grand allié. Que va-t-il advenir de Khrouchtchev et de l'URSS maintenant ?"
 every1.6.d:0 "Nikita Khrouchtchev a atterri à Washington et demande l'asile politique, après avoir été destitué de son poste de Premier ministre par un coup d'État orchestré par Léonid Brejnev et son comité. Si ses déclarations sont vraies et que nous le gardons, la nouvelle URSS nuira à nos relations et exacerbera les tensions. Si nous lui refusons l'asile, il devra partir ailleurs. Le Mexique serait un endroit idéal pour lui si nous ne le voulons pas. Il jouerait cependant un rôle important dans notre gouvernement et sa défection nous aiderait à comprendre les communications soviétiques, le déploiement des troupes et le fonctionnement interne et externe de l'URSS. Il serait un atout précieux."
 every1.7.d:0 "Nikita Khrouchtchev a fui un coup d'État à Moscou et a fait défection aux États-Unis pour y demander l'asile politique. Cependant, les Américains ne voulaient pas de lui, car s'ils l'emmenaient, les tensions entre les États-Unis et l'URSS seraient exacerbées, et les relations américano-soviétiques en seraient gravement affectées. Les Américains nous l'ont envoyé pour nous demander s'ils accepteraient Khrouchtchev. Le Mexique a toujours été un refuge pour les personnes fuyant l'étranger. Il y a seulement plus de trente ans, Léon Trotski était à Mexico pour tenter d'échapper à Staline et à l'URSS. Khrouchtchev nous aiderait également en tant que personnalité politique, et qui sait, les Américains pourraient nous apprécier si nous le laissions leur transmettre des secrets soviétiques ? Que devrions-nous faire ?"
 sov_death.3.d:0 "Youri Vladimirovitch Andropov est décédé dans sa chambre de l'hôpital clinique central de l'ouest de Moscou à l'âge de 69 ans. Souffrant d'une insuffisance rénale en août 1983, il a été transféré définitivement à l'hôpital où il a passé le reste de sa vie. Selon le rapport d'autopsie, Andropov souffrait de plusieurs problèmes de santé : néphrite interstitielle, néphrosclérose, hypertension résiduelle et diabète, aggravés par une insuffisance rénale chronique. Nous avons déjà décidé d'un deuil de quatre jours. Mais il nous faut maintenant élire son successeur. Notre candidat le plus probable est Konstantin Tchernenko, un homme semblable à Andropov. Il est cependant déjà assez malade : il souffre d'emphysème et d'insuffisance cardiaque droite. L'année dernière, il avait été absent de ses fonctions pendant trois mois en raison d'une bronchite, d'une pleurésie et d'une pneumonie. Andropov avait pourtant proposé à Mikhaïl Gorbatchev de lui succéder, mais ses idéaux réformistes suscitent la crainte de beaucoup."
 sov_death.4.d:0 "Après la mort de Brejnev et de son successeur Iouri Andropov, Tchernenko fut élu secrétaire général en février 1984 et nommé président du Présidium du Soviet suprême en avril 1984. En raison de sa santé déclinante, il fut souvent incapable d'exercer ses fonctions officielles. Il mourut en mars 1985 après seulement 13 mois à la tête du pays.\nTchernenko devint le troisième dirigeant soviétique à mourir en moins de trois ans. Informé de sa mort au milieu de la nuit, le président américain [USA.GetLeader] aurait déclaré : « Comment puis-je obtenir quelque chose avec les Russes s'ils continuent à me tuer ? »"
 sov_maki.1.d:0 "Le Parti communiste d'Israël, ou Maki, nous a contactés aujourd'hui pour solliciter notre soutien afin de « faire pression » pour rallier les membres plus modérés de sa coalition, le Mapam. Bien que risqué, nous pourrions obtenir un allié fidèle au Moyen-Orient si nous y parvenons."
 sov.102.d:0 "En 1947, le camarade Staline autorisa personnellement la construction de sept gratte-ciel à Moscou. Surnommés par le peuple « Les Sept Sœurs », ils devaient montrer à l'Occident notre puissance et notre prouesse industrielles, et impressionner les visiteurs de notre magnifique capitale. Le plus important d'entre eux, la glorieuse tour de l'Université d'État de Moscou, a été achevé aujourd'hui sous la direction de l'architecte en chef Lev Roudnev. Roudnev a déjà construit des édifices imposants comme l'Académie militaire M.V. Frounze et les appartements du maréchal, gagnant le respect et la confiance du Parti et de Staline lui-même. La tour se dresse au cœur du campus universitaire et domine celui-ci ainsi que la silhouette de Moscou. Plus de 400 000 tonnes d'acier et 130 000 tonnes de béton ont été utilisées pour ses fondations. Avec ses 240 mètres de haut, c'est le plus grand bâtiment d'Europe et le septième au monde. C’est vraiment un grand pas en avant pour notre grande union, et même si le camarade Staline n’est malheureusement pas parmi nous aujourd’hui pour assister à son ouverture, nous savons qu’il en serait fier."
 chernobyl.1.d:0 "À 1 h 23 min 04 s, l'essai de sécurité a débuté, après avoir été retardé de 10 heures, avec une nouvelle équipe non préparée. Lors de la réduction de puissance du réacteur prévue en prévision de l'essai électrique, la puissance a chuté de manière inattendue à un niveau proche de zéro. Les opérateurs n'ont pu rétablir que partiellement la puissance d'essai spécifiée, ce qui a placé le réacteur dans un état potentiellement instable. À 1h 23 min 40 s, comme l'a enregistré le système de contrôle centralisé SKALA, le bouton AZ-5 du système de protection d'urgence du réacteur a été actionné. L'insertion des barres de contrôle dans le cœur du réacteur a alors commencé. Lors de la descente des barres de contrôle, la puissance du réacteur a bondi à environ 30 000 MW thermiques, soit dix fois sa puissance de fonctionnement normale, selon la dernière valeur indiquée sur le wattmètre du panneau de commande. Plusieurs explosions se sont ensuite produites, provoquant l'ouverture complète du réacteur, libérant du graphite dans l'environnement."
 soviet.4.d:0 "L'URSS a annexé la République socialiste soviétique de Carélie et de Finlande à la RSS de Russie. C'est la première fois qu'une république soviétique est annexée à une autre. L'URSS a déclaré qu'après le renforcement des relations finno-soviétiques, elle estimait qu'il était temps d'annexer la RSS de Carélie et de Finlande. Cependant, cette décision suscite l'indignation de certains. La population finlandaise de l'ancienne RSS craint un renforcement du contrôle soviétique et une diminution de son autonomie. Les Soviétiques ont déclaré que les Finlandais n'avaient pas à s'inquiéter. À Moscou, ils ont célébré l'intégration de nouveaux oblasts à la RSS de Russie."
 soviet.3.d:0 "Après une décennie de Seconde Guerre mondiale et l'amélioration des relations avec la Finlande, les membres du Congrès ont déclaré qu'il était temps d'annexer la RSS de Carélie-Finlande à l'URSS. Nous avons également besoin de terres pour la frontière avec la Norvège et la Suède, au cas où nous devrions lancer une invasion ou nous défendre. Cependant, certains dirigeants politiques finlandais au Congrès souhaitent que la RSS reste une RSS pour les Finlandais de la région. Que faire ? Accepter la finlandisation ou non ?"
 soviet.2.d:0 "L'URSS a autorisé la RSS de Russie à offrir la Crimée à la RSS d'Ukraine en signe d'amitié depuis plus de 300 ans. L'Ukraine a rejoint le tsarisme russe il y a 300 ans, et la RSS de Russie souhaitait témoigner sa reconnaissance pour cette amitié historique. La RSS d'Ukraine a exprimé sa gratitude à la RSFSSR pour ce cadeau d'amitié."
 soviet.1.d:0 "À l'approche du tricentenaire de l'annexion de l'Ukraine au tsarisme russe, de plus en plus de personnes s'interrogent sur les actions à mener pour la RSS d'Ukraine et son anniversaire. Certains dirigeants politiques de notre congrès ont évoqué le transfert de la Crimée de la RSS de Russie à la RSS d'Ukraine. Nous avons toujours été très proches des Ukrainiens, qui affirment que ce territoire leur appartient. Ce serait un cadeau idéal pour leur amitié de plus de 300 ans. Cependant, ce territoire est précieux et regorge de ports et de ressources."
 news.1500.t:0 "C'est avec une profonde tristesse que Joseph Vissarionovitch Staline, secrétaire du Comité central du Parti communiste et président du Conseil des ministres, est décédé le 5 mars à 21h50 des suites d'une grave maladie. Le cœur de ce collaborateur et disciple du génie de Lénine, ce dirigeant sage et maître du Parti communiste et du peuple soviétique, s'est arrêté de battre. Joseph Staline était un travailleur acharné et un soutien indéfectible à ses camarades. Sa vision brillante de l'URSS a contribué à forger nombre des idéaux et des valeurs que nous connaissons aujourd'hui. Il a perpétué l'héritage de Lénine. Il nous manquera. Le Conseil soviétique se réunira et décidera qui lui succédera. Quel qu'il soit, il devra perpétuer l'un des plus grands héritages de l'URSS."
 swf.7.d:0 "Aujourd'hui, nous sommes tous réunis à Varsovie, en Pologne, pour réaffirmer notre volonté de créer une alliance européenne collective fondée sur la sécurité, indépendamment de nos systèmes sociaux et politiques. La Guerre froide s'est intensifiée au fil des ans et de nouvelles frontières se dessinent. Avec le réarmement des États allemands, nous devons nous préparer à un conflit armé généralisé, que ce soit en Allemagne ou ailleurs. Le Kominform a été une alliance formidable, mais nous devons renforcer l'Est face à l'Ouest. Le Pacte de Varsovie sera créé pour protéger tous ses membres, quels que soient leurs systèmes sociaux et politiques. Nous serons unis contre les ennemis du Pacte de Varsovie. Le Kominform est mort ! Vive le Pacte de Varsovie !"
 swf.9.d:0 "Après une conférence à Varsovie, en Pologne, le bloc de l'Est et d'autres alliés soviétiques ont signé un traité de défense nationale et d'alliance. Ils ont dissous le Kominform et formé le Pacte de Varsovie pour le remplacer. Les Soviétiques ont déclaré qu'en raison des tensions accrues et du réarmement allemand, une alliance plus forte était nécessaire pour protéger les pays de l'Est contre l'Ouest. L'OTAN a déclaré qu'elle continuerait de combattre la menace communiste quoi qu'il arrive et que cela ne changerait rien. Les tensions restent vives en Europe et se sont intensifiées en raison de cette « nouvelle » alliance militaire."
 TUR_SOV.11.d:0 "Il semble qu'après la conquête du Bosphore, Staline ait braqué ses armes sur nous. Nous avons reçu aujourd'hui un télégramme inquiétant annonçant l'intention de l'Union soviétique d'intégrer pacifiquement notre nation souveraine, la Yougoslavie, au bloc de l'Est. Elle exige que nous autorisions les troupes soviétiques à stationner dans notre pays, la flotte de la mer Noire à accoster dans nos ports et l'aviation soviétique à utiliser nos pistes d'atterrissage pour des missions de reconnaissance. Bien que cette idée paraisse ridicule, elle a promis que si nous acceptions, le maréchal Tito, l'ensemble du gouvernement et de l'armée yougoslaves conserveraient leurs positions. Staline a déclaré vouloir rétablir les relations avec le peuple yougoslave et permettre à nos deux nations de marcher à nouveau côte à côte, en temps de paix comme en temps de guerre. Cependant, si nous refusons, il a prévenu que l'Armée rouge soviétique au complet descendrait sur Belgrade d'ici la fin de la semaine."
 TUR_SOV.12.d:0 "Après notre invasion réussie de la Yougoslavie, pays qui a osé usurper notre autorité et notre fraternité socialiste en Europe de l'Est, nous devons prendre une décision. Le camarade Staline a convoqué une conférence avec tous les pays voisins pour discuter du partage de l'ancien territoire yougoslave et déterminer la marche à suivre : le laisser tranquille ou céder des territoires à l'Albanie et à la Grèce."
 TUR_SOV.13.d:0 "La Yougoslavie ayant refusé de suivre notre fraternité socialiste en Europe de l'Est, le camarade Staline et le ministère des Relations économiques extérieures ont décidé d'imposer un embargo total à la Yougoslavie, afin de la convaincre de se détourner du révisionnisme. Cet embargo comprendra l'arrêt total de toute importation soviétique de biens, y compris de denrées alimentaires et d'équipements technologiques, ainsi que de toute aide économique. Cela servira d'avertissement à toute autre nation communiste osant se plier aux puissances impérialistes occidentales qui leur offrent des appâts économiques."
 TUR_SOV.14.d:0 "Dans la ville industrielle de Khabarovsk, en Extrême-Orient russe, se tiennent des procès pour crimes de guerre contre douze membres de l'armée japonaise du Guandong, accusés d'avoir fabriqué et utilisé des armes biologiques pendant la Grande Guerre patriotique. Tous les accusés ont été reconnus coupables et condamnés à des peines de 2 à 25 ans de travaux forcés. Parmi les accusés figurent le général Otozo Yamada, commandant de l'armée du Guandong, ainsi que plusieurs généraux responsables de la tristement célèbre Unité 731 et d'autres services médicaux. Leurs crimes ont causé la mort de milliers de personnes et ces procès ont largement justifié leur coût."
 SOV_Troika.1.d:0 "Les premiers rapports de Radio Moscou indiquent que Lavrenti Beria, ministre de l'Intérieur, chef du NKVD et premier vice-président du Conseil des ministres, a été arrêté au Kremlin, avec l'aide du maréchal Gueorgui Joukov et d'autres officiers armés. Beria est actuellement détenu au quartier général du district militaire de Moscou, et ses forces de sécurité fidèles sont bloquées par des éléments des divisions blindées Kantemirovskaya et Tamanskaya. On pense que Beria a été arrêté pour trahison, terrorisme et prédation sexuelle, autant de délits graves, mais on pense qu'il a été arrêté pour permettre à d'autres membres de la troïka d'accéder au pouvoir."
 SOV_Troika.2.d:0 "Des rapports internes indiquent que Nikita Khrouchtchev, chef de la section moscovite du Parti communiste et membre de la troïka, a été arrêté au Kremlin par des membres du Parti fidèles à Lavrentiy Beria, dont Vsevolod Merkulov, Bogdan Kobulov et Georgy Malenkov. Le lieu de détention de Khrouchtchev est inconnu, mais il s'agit d'un lieu tenu secret à Moscou. On pense que Khrouchtchev a été arrêté pour trahison et activité contre-révolutionnaire, bien que certains observateurs occidentaux y voient une tentative de Beria de se débarrasser d'un membre de la troïka au pouvoir."
 SOV_Troika.3.d:0 "Le général Viktor Abakoumov, ministre de la Sécurité d'État, a été exécuté. Nommé en 1946 par le camarade Staline, Abakoumov fut privé de ses pouvoirs lorsqu'il fut arrêté en 1951 pour n'avoir pas suffisamment agi pour monter un dossier contre les Juifs. Après le Complot du Docteur, Abakoumov resta en prison, même après l'exécution de Beria et de son adjoint, Mikhaïl Ryumine. En décembre 1954, Abakoumov fut jugé pour avoir falsifié l'Affaire de Leningrad, un complot stalinien visant à accuser des membres du PCUS de former une organisation antisoviétique, et fut abattu avec trois de ses adjoints du MGB."
 SOV_Troika.4.d:0 "Aujourd'hui, à Moscou, 14 hauts responsables du Parti communiste ont été jugés pour trahison et activité contre-révolutionnaire contre le gouvernement du camarade Staline. Parmi ces responsables figurent Viatcheslav Molotov, premier vice-président du Conseil des ministres ; Anastas Mikoyan, ministre du Commerce extérieur ; les maréchaux Kliment Vorochilov et Semion Boudionny ; Arseni Zverev, ministre des Finances ; ainsi que de nombreux premiers secrétaires du Parti des RSS d'Arménie, de Géorgie et de Finlande, des comités municipaux et régionaux de Moscou, et du Comité central de contrôle. Piotr Pospelov, rédacteur en chef de la Pravda, a également été jugé. Ces 14 responsables ont été condamnés à mort par peloton d'exécution, ce qui témoigne une fois de plus de l'emprise de Staline sur le gouvernement."
 SOV_Troika.5.d:0 "Après le Procès des 14, deux autres hauts fonctionnaires, Andreï Gromyko et Panteleimon Ponomarenko, furent exécutés. Gromyko, ancien représentant permanent de l'URSS auprès de l'ONU, fut accusé d'espionnage auprès des puissances occidentales, en raison de ses relations avec des diplomates de haut rang et de son poste d'ambassadeur au Royaume-Uni. Ponomarenko, ancien ministre des Achats et premier secrétaire du Parti communiste kazakh, fut accusé de corruption et d'abus financiers après avoir été audité et avoir découvert qu'il construisait une villa avec l'argent du Parti. Tous deux furent fusillés près de Moscou. La communauté internationale, et en particulier les alliés occidentaux, est particulièrement choquée par la mort de Gromyko, ami et ennemi bien-aimé au sein de l'ONU."
 SOV_Troika.6.d:0 "Finalement, même le successeur pressenti de Staline est au cœur des accusations. Gueorgui Malenkov, président du Conseil des ministres et deuxième secrétaire du PCUS, a été accusé d'adultère, de corruption et de prédation sexuelle dans un scandale connu sous le nom d'« affaire Goloubtsova », du nom de sa prétendue épouse. Malenkov a rencontré Valeriya Goloubtsova, fille du conseiller d'État de l'Empire russe, à Nijni Novgorod, en 1920. Ils vivent ensemble depuis, mais n'ont jamais officiellement enregistré leur union et ne sont donc pas officiellement mariés. Occupant une position aussi élevée au sein du gouvernement, ce genre d'activité n'est pas toléré et Malenkov a été jugé et reconnu coupable. Quelle sera sa peine ?"
 SOV_Troika.7.d:0 "Plus tôt cette semaine, le gouvernement soviétique a annoncé que la passation officielle du pouvoir de l'actuel secrétaire général de l'Union des Républiques socialistes soviétiques, Joseph Staline, à son successeur, Lazar Kaganovitch, aurait lieu lors du XXe congrès du Parti communiste à Moscou. Les préparatifs ont déjà commencé : le plus grand défilé militaire et public de l'histoire de l'Union soviétique est attendu sur la Place Rouge. Cette annonce a surpris les observateurs occidentaux, qui s'attendaient à ce que Staline occupe le poste de secrétaire général jusqu'à sa mort, annoncée comme prématurée. Après avoir survécu à un accident vasculaire cérébral en 1953, sa santé s'est fortement détériorée et beaucoup s'attendent à une mort imminente."
 Stalin.Retirement.d:0 "Le monde a été sous le choc aujourd'hui lorsque le Kremlin à Moscou a annoncé que Joseph Vissarionovitch Staline, secrétaire général du Parti communiste de l'Union soviétique depuis 1922, avait annoncé sa retraite. Après avoir pris la tête du pays à la mort de son fondateur, Vladimir Lénine, en 1922, son idée de socialisme dans un seul pays, combinée à ses plans quinquennaux d'industrialisation, a donné naissance à un pays communiste puissant doté d'une économie dirigée et centralisée. Depuis son ascension, des mouvements communistes ont surgi dans le monde entier et l'Union soviétique est désormais considérée comme une superpuissance, aux côtés de pays comme les Alliés occidentaux. Les dirigeants mondiaux ont exprimé leur choc, même si les conversations privées à la Maison Blanche et au 10 Downing Street sont un mélange de soulagement et d'inquiétude."
 CPSU20.1.d:0 "Le XXe Congrès du Parti communiste de l'Union soviétique s'est achevé après plus de dix jours de réunions. Il s'agit du premier congrès organisé sous la nouvelle direction du Premier ministre Lazar Kaganovitch, choisi comme successeur de Joseph Staline, et de sa première apparition publique majeure depuis cette annonce. Kaganovitch a profité du Congrès pour réaffirmer sa position anti-révisionniste et anti-réformatrice, et a salué le camarade Staline pour son service rendu à l'Union soviétique. Il a ensuite longuement évoqué le Procès des 14 et les exécutions d'anciens responsables éminents du Parti, tels que Nikita Khrouchtchev, Viatcheslav Molotov et d'autres, qui ont osé changer le mode de vie socialiste. Ce discours a profondément ébranlé le petit mouvement réformateur au sein du Parti, largement affaibli par les purges et les procès. Le monde a exprimé des sentiments mitigés, l'Occident exprimant sa détresse face au maintien de la ligne dure du gouvernement, tandis que le bloc de l'Est restait perplexe face au changement de direction de ses maîtres."
 CPSU20.2.d:0 "Le vingtième Congrès du Parti communiste de l'Union soviétique s'est achevé après plus de dix jours de réunions. Il s'agit du premier congrès organisé sous la nouvelle direction conjointe de Gueorgui Malenkov et de Lavrenti Beria, arrivés au pouvoir grâce à la lutte de la troïka après la mort du camarade Staline. Sur scène, les deux hommes ont tour à tour évoqué la nécessité d'une direction stable en ces temps difficiles et les horreurs de l'impérialisme et du révisionnisme, condamnant des personnalités comme Nikita Khrouchtchev et Nikolaï Boulganine qui ont osé s'opposer à eux. Leurs discours ont suscité des réactions mitigées, les partisans de la ligne dure comme les réformistes exprimant un mélange de soutien et d'hostilité. À l'échelle internationale, les réactions sont similaires ; un espoir prudent se dessine quant à l'avenir de l'URSS."
 SOV_KAG.1.desc:0 "Aujourd'hui, chers étudiants, nous poursuivons notre cours sur notre estimé camarade Staline. Lors de notre dernier cours, nous avons abordé l'industrialisation de l'Union soviétique dans les années 1930, et aujourd'hui, nous nous concentrerons sur l'excellent leadership de Staline, qui nous a sauvés de la menace fasciste du Troisième Reich. Ce type de cours était monnaie courante en Union soviétique, la génération suivante travaillant dur pour devenir des membres productifs de la société socialiste. Les enseignants soviétiques avaient la tâche difficile de comprendre le programme afin de présenter correctement la vie et l'héritage de Joseph Staline, un dirigeant incroyablement complexe."
 SOV_KAG.2.desc:0 "La Komsomolskaïa Pravda a publié aujourd'hui un nouvel article sur les pères fondateurs de l'Union soviétique. La première page présente un résumé de la vie de Vladimir Ilitch Lénine, commençant par ses humbles débuts et son adhésion progressive au camp révolutionnaire après avoir assisté à la mort de son frère par les troupes du tsar. Pendant la Grande Guerre, Lénine fut exilé en Suisse, mais même l'éloignement de sa patrie ne put l'empêcher de tenter d'apporter le pouvoir au peuple. Il écrivit des lettres et des tracts qui furent ensuite distribués dans les rues de Petrograd, rebaptisée plus tard Leningrad en son honneur. Après la révolution, son cercle d'amis s'élargit, incluant son successeur Joseph Staline. Mais avant que Lénine puisse réaliser son rêve de faire connaître la gloire du socialisme au monde, il fut victime d'un accident vasculaire cérébral. Cela ne l'empêcha pas d'exercer ses fonctions jusqu'à sa mort prématurée. Ses efforts furent cependant récompensés, car le mouvement qu'il lança et l'Union qu'il créa furent suffisamment puissants pour résister à la menace fasciste et préserver la révolution pour les décennies à venir !"
 SOV_KAG.3.desc:0 ""
 SOV_KAG.4.desc:0 "L'alliance des pays socialistes, dirigée par l'Union soviétique, connue sous le nom de Komintern, a publié une déclaration publique concernant sa réforme qui aura lieu au cours des prochains mois. Outre les développements internes, le Komintern devrait désormais se concentrer sur l'extraction des ressources afin de stimuler l'industrie de l'Est et d'exporter avec succès la révolution à travers le monde par tous les moyens nécessaires. Le sens de cette formulation est clair : la guerre froide s'intensifie."
 SOV_KAG.5.desc:0 ""
 SOV_KAG.6.desc:0 ""
 SOV_KAG.7.desc:0 "L'Union soviétique est entrée aujourd'hui dans une période de deuil, la nation étant frappée par la triste nouvelle. Son dirigeant, le secrétaire général du Parti communiste Joseph Vissarionovitch Staline, est décédé. D'après les rares informations en provenance du Kremlin, il semble que Joseph Staline se soit éteint paisiblement dans sa datcha de Kountsevo, près de Moscou. Les préparatifs sont en cours pour ses funérailles, qui s'annoncent grandioses. Les responsables politiques du monde socialiste ont déjà adressé leurs condoléances et viendront certainement rencontrer le camarade Staline une dernière fois avant son dernier repos. De leur côté, ses victimes et les millions de personnes qu'il a enfermées dans les goulags célèbrent secrètement leur décès."
 SOV_KAG.8.desc:0 "...et donc je dis, il n'arrivera pas un jour où un fonctionnaire du parti, un paysan, un ingénieur, un pilote ne vous remerciera pas, camarade Staline, pour tout ce que vous avez fait pour l'Union soviétique et pour le monde ! « Par conséquent, dans nos cœurs, dans nos esprits, dans nos âmes, tu vivras toujours ! » a déclaré Lazar Kaganovitch dans le dernier paragraphe de son discours d'ouverture du 21e Congrès du Parti communiste de l'Union soviétique. Malgré l'atmosphère maussade du décès de l'Homme de Fer, il a été récompensé par une ovation debout de dix minutes. Kaganovitch a dû recourir à la sonnette de Staline pour calmer la salle avant de regagner sa place.\nC'était ensuite Viatcheslav Molotov, qui a réitéré le discours du camarade Kaganovitch, mais sur un ton beaucoup plus sombre. Il a déclaré que le décès de Staline dans sa datcha était une chance, car c'était l'endroit où il l'avait vu le plus heureux. Mais il a ajouté que la voie qu'il avait tracée devait être suivie et que son œuvre devait se poursuivre. Ce qui lui a valu un hochement de tête de la part de Lazar de Fer.\nAprès les discours des autres membres du Politburo, le camarade Kaganovitch est remonté sur scène pour présenter le thème principal du Congrès de cette année : ses réformes du système soviétique, que beaucoup commençaient à rejeter. On l'appelle « kaganovichisme ».\nL'un de ses principes est le retour à une démocratie interpartisane de bas niveau afin de faciliter le remplacement des membres subalternes du parti, soit par des postes plus élevés, soit par des départs, et de rendre les échelons inférieurs de l'État plus réactifs et efficaces. La mise en place d'une limitation du mandat du secrétaire général s'inscrit dans cet objectif. Le dernier grand problème que Lazar Kaganovitch cherche à éradiquer est la corruption au sein de l'État, pour laquelle il présentera un plan dans les prochains jours."
 SOV_KAG.9.desc:0 "Comme il l'a déjà souligné lors du Congrès, le camarade Kaganovitch vise à éradiquer la corruption de l'appareil d'État. Plusieurs propositions de sanctions ont été avancées dans une loi similaire à celle contre le parasitisme social. Cette version cible ceux qui abusent de leur position et du travail d'autrui à leur profit. Les sanctions spécifiques varieront en fonction du montant des roubles gagnés par l'auteur grâce à ses actions malhonnêtes, allant de la saisie de biens à des années de prison, en passant par l'expulsion du Parti et la relocalisation dans une région éloignée de l'Union."
 SOV_KAG.10.desc:0 "L'ouverture du 22e Congrès du PCUS a eu lieu aujourd'hui. L'importance de ce congrès réside dans le bilan concret de la lutte entre partisans et opposants à la cybernétique appliquée, invisible aux yeux du grand public, mais dont les résultats du 8e Plan quinquennal et le bien-être de la population se reflètent clairement. Le secrétaire général Lazar Kaganovitch a ouvert le congrès par un discours introductif, énumérant les résultats objectifs : les indicateurs pleinement atteints et ceux partiellement atteints. D'abord calmes, certains délégués du congrès ont sifflé, hué et applaudi, criant au « gaspillage des richesses du peuple », aux « expérimentations irréfléchies » et à la « tentative d'écarter le Parti et d'usurper le pouvoir ». Les délégués soutenant Kaganovitch ont tenté de râler plus fort que ses détracteurs, évoquant des éléments antipopulaires au sein du parti qui s'opposaient à la cybernétisation de la même manière que les saboteurs sabotaient l'industrialisation, et dénonçant la non-application délibérée des décisions du congrès précédent. Après le temps imparti, Lazar Kaganovitch, visiblement alarmé par les disputes incessantes, mais essayant de ne pas le montrer, a appelé les délégués à l'ordre et, lorsque le bruit a cessé, a cédé la parole à l'orateur suivant."
 SOV_KAG.11.desc:0 "Le 23e Congrès du Parti communiste se tient actuellement à Moscou et des rumeurs font état d'un changement imminent à la tête de l'Union soviétique. Selon le bulletin interne du parti, Lazar Kaganovitch a annoncé sa démission du poste de secrétaire général du Parti communiste et un vote pour son remplacement a eu lieu le lendemain. \nDeux candidats ont été envisagés. Le premier était Dmitri Oustinov, général soviétique responsable du complexe militaro-industriel soviétique. Ses principales propositions portent sur l'intensification du développement de l'OGAS par l'intégration militaire, des investissements dans la protection civile, la création d'usines souterraines au-delà de l'Oural et une participation plus active aux activités internationales. Le second était Alexandre Chelepine, qui avait attiré l'attention de Staline après avoir organisé les mouvements partisans dans la région de Moscou et joué un rôle crucial au sein de l'organisation de la jeunesse du Komsomol."
 SOV_SamanthaSmith.1.d:0 "Cher Monsieur Andropov,\n\nJe m'appelle Samantha Smith.\nJ'ai 10 ans.\nFélicitations pour votre nouveau poste.\nJe m'inquiète de l'entrée en guerre nucléaire entre la Russie et les États-Unis. Allez-vous voter pour une guerre ou non ? Si ce n'est pas le cas, dites-moi comment vous comptez contribuer à éviter une guerre. Vous n'êtes pas obligé de répondre à cette question, mais j'aimerais que vous le fassiez. Pourquoi voulez-vous conquérir le monde, ou du moins notre pays ? Dieu a créé le monde pour que nous le partagions et en prenions soin. Non pas pour que nous nous disputions ou que seul un groupe de personnes le possède. Faisons ce qu'il a voulu et que tout le monde soit heureux.\n\nSamantha Smith\nManchester, Maine, États-Unis\nBox 44 04351\nP.S. : Veuillez me répondre."
 SOV_SamanthaSmith.3.d:0 "Monsieur l'Ambassadeur,\n\nJe m'appelle Samantha Smith et j'ai 10 ans.\n\nJ'ai entendu dire que vous êtes ambassadeur d'URSS aux États-Unis. Je suis ravie de votre présence dans notre pays.\n\nJ'ai écrit à M. Andropov car je crains une guerre nucléaire entre nos deux pays. Je ne souhaite pas qu'il en déclenche une et j'espère vivement qu'il répondra à ma lettre.\n\nJ'ai vu un exemplaire de la Pravda, où ma lettre a été publiée. Ils se sont moqués de mes questions et de mon âge. Je pense que mes questions étaient justes et que mon âge n'a aucune importance. La guerre nucléaire est une peur que chacun devrait avoir peur.\n\nJe demande à nouveau à M. Andropov de répondre à ma lettre, car elle me touche beaucoup.\n\nMerci,\n\nSamantha Smith\nManchester, Maine, États-Unis\nB.P. 44 04351"
 SOV_SamanthaSmith.4.d:0 "Chère Samantha,\n\nJ'ai bien reçu votre lettre, comme beaucoup d'autres qui m'ont été récemment adressées par votre pays et d'autres pays du monde.\n\nJ'ai l'impression, à en juger par votre lettre, que vous êtes une jeune fille courageuse et honnête, semblable à Becky, l'amie de Tom Sawyer dans le célèbre livre de votre compatriote Mark Twain. Ce livre est connu et apprécié dans notre pays par tous les garçons et toutes les filles.\n\nVous écrivez que vous craignez une éventuelle guerre nucléaire entre nos deux pays. Et vous demandez si nous faisons tout pour éviter qu'une guerre n'éclate.\n\nVotre question est la plus importante de celles que tout homme sensé puisse se poser. Je vous répondrai sérieusement et honnêtement.\n\nOui, Samantha, en Union soviétique, nous faisons tout pour qu'il n'y ait pas de guerre sur Terre. C'est ce que souhaite tout Soviétique. C'est ce que nous a enseigné le grand fondateur de notre État, Vladimir Lénine.\n\nLes Soviétiques savent pertinemment à quel point la guerre est terrible. Il y a quarante-deux ans, l'Allemagne nazie, qui aspirait à la suprématie mondiale, a attaqué notre pays, incendié et détruit des milliers de villes et de villages, et tué des millions d'hommes, de femmes et d'enfants soviétiques.\n\nLors de cette guerre, qui s'est soldée par notre victoire, nous étions alliés aux États-Unis : ensemble, nous avons lutté pour la libération de nombreux peuples des envahisseurs nazis. J'espère que vous le savez grâce à vos cours d'histoire. Aujourd'hui, nous aspirons ardemment à vivre en paix, à commercer et à coopérer avec tous nos voisins sur cette terre, qu'ils soient proches ou lointains. Et certainement avec un pays aussi grand que les États-Unis d'Amérique.\n\nEn Amérique et dans notre pays, il existe des armes nucléaires – des armes terribles qui peuvent tuer des millions de personnes en un instant. Mais nous refusons leur utilisation. C'est précisément pourquoi l'Union soviétique a solennellement déclaré au monde entier qu'elle n'utiliserait jamais les armes nucléaires en premier contre aucun pays. De manière générale, nous proposons d'arrêter leur production et de procéder à l'élimination de tous les stocks d'armes nucléaires sur Terre.\n\nIl me semble que cela répond suffisamment à votre deuxième question : « Pourquoi voulez-vous faire la guerre au monde entier, ou du moins aux États-Unis ? » Nous ne voulons rien de tel. Personne dans notre pays – ni ouvriers, ni paysans, ni écrivains, ni médecins, ni adultes, ni enfants, ni membres du gouvernement – ​​ne souhaite une grande ou une « petite » guerre.\n\nNous voulons la paix ; nous sommes occupés à cultiver du blé, à construire et à inventer, à écrire des livres et à voyager dans l’espace. Nous voulons la paix pour nous-mêmes et pour tous les peuples de la planète. Pour nos enfants et pour toi, Samantha.\n\nJe t’invite, si tes parents le permettent, à venir dans notre pays, le meilleur moment étant cet été. Tu découvriras notre pays, tu rencontreras tes contemporains, tu visiteras un camp international pour enfants – Artek – en bord de mer. Et tu verras par toi-même : en Union soviétique, tout le monde est pour la paix et l’amitié entre les peuples.\n\nMerci pour ta lettre. Je te souhaite le meilleur pour ta jeune vie.\n\nY. Andropov"
 SOV_SamanthaSmith.5.d:0 "Samantha Smith, une petite fille de 10 ans originaire du Maine, a été invitée à visiter le pays pour une tournée de charité après avoir écrit une lettre au dirigeant soviétique Iouri Andropov. Touchée par le cœur tant aux États-Unis qu'en Union soviétique, Samantha est devenue du jour au lendemain la coqueluche des médias.\n\nLes responsables du Département d'État, agissant rapidement, ont proposé plusieurs réponses à cette invitation. Autoriser Samantha à se rendre en visite constituerait un excellent moyen de communication pour promouvoir une initiative de consolidation de la paix avec l'Union soviétique, et sa présence pourrait véritablement apaiser des relations qui se renforcent.\n\nCependant, certains responsables ont exprimé leur inquiétude quant au fait que cette autorisation pourrait permettre à l'Union soviétique de « se positionner moralement » dans le contexte de la Guerre froide, en particulier auprès des pays dont les relations avec les États-Unis sont en pleine mutation. Il serait peut-être préférable de limiter ses déplacements, soit en ne les autorisant pas, soit en condamnant la visite, soit en allant jusqu'à annuler son passeport."
 SOV_SamanthaSmith.6.d:0 "Aujourd'hui, l'avion de Samantha Smith et de ses parents a atterri à Moscou, marquant le début de ce qui allait être la première journée d'une visite de deux semaines en Union soviétique, à l'invitation du secrétaire général Iouri Andropov.\n\nAprès avoir écrit une lettre à Andropov, inquiet de la menace croissante d'une guerre nucléaire, le dirigeant soviétique lui a répondu, attirant immédiatement l'attention des médias des deux côtés du rideau. L'inquiétude de Samantha et la réponse bienveillante d'Andropov ont apporté le calme nécessaire dans un contexte de tensions croissantes liées à la Guerre froide.\n\nOn ignore si Smith pourra rencontrer directement Andropov, mais on sait qu'elle participera à un camp d'enfants soviétique appelé Artek, situé en Crimée.\n\nLes médias, cependant, suivront Smith tout au long de son voyage et continueront de relater ses aventures en Union soviétique."
 SOV_SamanthaSmith.7.d:0 "Sans surprise, les États-Unis ont annoncé aujourd'hui qu'ils interdisaient activement à Samantha Smith et à ses parents de se rendre en Union soviétique, au motif que leur visite constitue une « menace pour la sécurité nationale des États-Unis ».\n\nApparemment inquiets que la visite de Smith puisse retourner l'opinion publique contre les États-Unis, tant au niveau national qu'international, les responsables du Département d'État ont également catégoriquement condamné l'invitation soviétique, la qualifiant de « stratégie visant à contraindre des enfants innocents, qui ignorent à quoi ils sont invités ».\n\nLes médias ont dénoncé cette décision, mais les médias conservateurs la saluent comme une mesure visant à protéger les enfants et la réputation américaine, la crainte que Smith ne soit utilisée comme un outil de propagande grandissant."
 peace_event.1.t:0 "[GetNewspaperHeader]La Yougoslavie se plie au pacte"
 peace_event.1.d:0 "Des informations en provenance des Balkans confirment que le gouvernement yougoslave s'est officiellement rendu aux armées du Pacte de Varsovie qui avancent. Après des semaines de pression croissante et de manœuvres éclair à travers la campagne, Belgrade a été occupée et le gouvernement central a cessé toute résistance organisée.\n\nBien que des groupes de partisans s'accrochent encore aux collines et aux forêts, l'État lui-même a capitulé. Des colonnes de troupes soviétiques, polonaises et hongroises défilent dans la capitale tandis que les drapeaux rouges du Pacte sont hissés au-dessus des bâtiments gouvernementaux. Les responsables de l'Est saluent cet événement comme une « correction de déviation » nécessaire, tandis que les dirigeants occidentaux l'observent avec une profonde inquiétude.\nPour les peuples de Yougoslavie, la promesse d'indépendance a cédé la place à la réalité de l'occupation. Ce qui va suivre — une intégration directe ou un régime fantoche fidèle à Moscou — reste incertain. Ce qui est certain, c'est que l'équilibre des pouvoirs en Europe a une fois de plus basculé."
 peace_event.1.a:0 "La « troisième voie » n'existe plus."
 sov_congress.1.d:0 "Le 19e Congrès du Parti communiste de toute l'Union (bolcheviks) s'est officiellement achevé, marquant ainsi le premier congrès du Parti organisé depuis la fin de la Grande Guerre patriotique. Après près d'une décennie sans réunion de ce type, ce congrès a constitué un moment marquant de la vie politique soviétique, inaugurant de vastes réformes organisationnelles et réaffirmant l'orientation de la direction de l'Union soviétique.\n\nPrincipaux changements organisationnels :\nLe Parti communiste de toute l'Union (bolcheviks) fut rebaptisé Parti communiste de l'Union soviétique.\nLe Politburo du Comité central devint le Présidium du Comité central et fut considérablement élargi pour compter 15 membres. Le Secrétariat et le Comité central ont vu leur effectif doubler (pour atteindre respectivement dix et 133 membres).\nL'Orgburo a été aboli et ses fonctions ont été transférées au Secrétariat.\n\nMembres à part entière (ayant le droit de vote) élus au 19e Présidium :\nVasily Andrianov; Averky Aristov; Lavrentiy Beria; Nikolai Bulganin; Kliment Voroshilov; Semyon Ignatyev; Lazar Kaganovich; Demyan Korotchenko; Vasily Kuznetsov; Otto Kuusinen; Georgy Malenkov; Vyacheslav Malyshev; Leonid G. Melnikov; Anastas Mikoyan; Nikolai Mikhaylov; Vyacheslav Molotov; Mikhail Pervukhin; Panteleimon Ponomarenko; Maksim Saburov; Joseph Stalin; Mikhail Suslov; Nikita Khrushchev; Dmitry Chesnokov; Nikolay Shvernik; Matvei Shkiryatov\n\nMembres candidats (sans droit de vote) élus au Présidium :\nLeonid Brezhnev; Andrei Vyshinsky; Arseni Zverev; Nikolai Ignatov; Ivan Kabanov; Alexei Kosygin; Nikolai Patolichev; Nikolai Pegov; Alexander Puzanov; Ivan Tevosian; Pavel Yudin."