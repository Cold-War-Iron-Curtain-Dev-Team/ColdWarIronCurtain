l_english:
 ROC_Review_the_Economy: "Revoir l'économie"
 ROC_Review_the_Economy_desc: "Les colonies françaises doivent réévaluer leur statut après la Seconde Guerre mondiale. Nous devrions également examiner s'il est possible d'améliorer certaines de nos infrastructures."
 ROC_Military_Reform: "Réforme militaire"
 ROC_Military_Reform_desc: "Bon nombre de nos meilleurs éléments se trouvent aujourd’hui en France après avoir fait leurs preuves en combattant le régime de Vichy. Nous devons les dédommager."
 ROC_The_Matters_of_Colonial_Administration: "La question de l'administration coloniale"
 ROC_The_Matters_of_Colonial_Administration_desc: "Le système colonial doit être réformé en cette ère de connectivité croissante."
 ROC_The_New_Governor_1951: "Le nouveau gouverneur"
 ROC_The_New_Governor_1951_desc: "Le temps de Cornut est écoulé. La France a décidé que Bernard devait partir."
 ROC_Standardize_Laws: "Standardiser les lois"
 ROC_Standardize_Laws_desc: "Nous devrions uniformiser les lois dans toutes ces colonies afin d'améliorer l'efficacité de notre gouvernement."
 ROC_An_Equatorial_Customs_Union: "Une union douanière équatoriale"
 ROC_An_Equatorial_Customs_Union_desc: "Nous devons mettre officiellement en place une union économique entre nos colonies. Cela permettra d'améliorer l'efficacité de nos usines."
 ROC_Aid_From_the_Homeland: "Une aide venue de la Patrie"
 ROC_Aid_From_the_Homeland_desc: "Nous pouvons demander une aide industrielle à la France. Nous avons été la région la plus fidèle et sommes restés aux côtés de la France authentique malgré l'existence de la France de Vichy."
 ROC_More_Rubber: "Encore plus de caoutchouc"
 ROC_More_Rubber_desc: "Le caoutchouc est l'un des piliers de notre économie. Nous en avons besoin de plus."
 ROC_Industry_of_Brazzaville: "L'industrie de Brazzaville"
 ROC_Industry_of_Brazzaville_desc: "Encourageons le développement d'un pôle industriel prometteur. Notre industrie doit prendre de l'ampleur."
 ROC_Inroads_into_Africa: "Sur les routes d'Afrique"
 ROC_Inroads_into_Africa_desc: "Il nous faut davantage de moyens de transport pour se déplacer entre les colonies équatoriales."
 ROC_Mining_in_Chad: "L'exploitation minière au Tchad"
 ROC_Mining_in_Chad_desc: "Le Tchad regorge de ressources rares. Nous devrions tirer parti de cette situation."
 ROC_Minds_of_Tommorrow: "Les esprits de demain"
 ROC_Minds_of_Tommorrow_desc: "Nous devons unir nos efforts pour éduquer les autochtones."
 ROC_Public_Schools: "Écoles publiques"
 ROC_Public_Schools_desc: "Les écoles publiques favoriseront l'égalité et toucheront un public plus large. Cela pourrait susciter la colère de certains chefs autochtones qui craignent les répercussions que cela pourrait avoir sur leurs pratiques traditionnelles."
 ROC_Teach_Local_Languages: "Enseigner les langues locales"
 ROC_Teach_Local_Languages_desc: "Les langues locales constituent le pilier de ces colonies. Sans elles, il serait impossible de communiquer avec les autochtones. Cette mesure sera bien accueillie par de nombreux habitants de nos colonies, qui y verront un signe d'autonomisation."
 ROC_Private_Schools: "Écoles privées"
 ROC_Private_Schools_desc: "Les écoles privées favorisent l'ordre. Personne ne s'en plaindra."
 CAN_Encourage_French: "Encourager le français"
 CAN_Encourage_French_desc: "Enseigner principalement le français renforcera la loyauté des autochtones, tout en les rendant un peu arrogants. Cela nous donnera toutefois un peu plus de capital politique pour négocier avec la France."
 ROC_Teaching_Reforms: "Réformes de l'enseignement"
 ROC_Teaching_Reforms_desc: "Il faut faciliter l'apprentissage dans ces colonies. Nous devons recruter de meilleurs enseignants et revoir notre système éducatif."
 ROC_Catholic_Missionaries: "Missionnaires catholiques"
 ROC_Catholic_Missionaries_desc: "Nous devrions encourager la collaboration entre ces écoles privées et les missionnaires catholiques. Cela ne fera que consolider l'ordre établi."
 ROC_Local_Troops: "Troupes locales"
 ROC_Local_Troops_desc: "Nous devons encourager les gens à s'engager dans notre armée. Cela permettra de compenser l'émigration des soldats français après la Seconde Guerre mondiale."
 ROC_Local_Officers: "Responsables locaux"
 ROC_Local_Officers_desc: "Nous devrions développer notre propre culture militaire, indépendante de celle de la France. Nous devrions encourager les habitants de la région à s'engager dans nos forces armées."
 ROC_Officer_Schools: "Écoles d'officiers"
 ROC_Officer_Schools_desc: "La création d'écoles d'officiers locales favorisera le développement de notre propre culture militaire et renforcera notre autonomie. Cela permettra également de remédier au manque d'officiers locaux compétents."
 ROC_Officers_from_Home: "Des officiers de la maison"
 ROC_Officers_from_Home_desc: "Nous devrions continuer à compter sur la France pour nos stratégies militaires."
 ROC_Bargain_with_France: "Négocier avec la France"
 ROC_Bargain_with_France_desc: "Nous pourrions demander à la France de nous envoyer quelques divisions militaires, compte tenu de notre loyauté à son égard."
 ROC_Army_Reform: "Réforme de l'armée"
 ROC_Army_Reform_desc: "Nous devons repenser le fonctionnement de notre armée. Nous devons définir ses priorités."
 ROC_Jeeps_Across_the_Plains: "Des jeeps à travers les plaines"
 ROC_Jeeps_Across_the_Plains_desc: "Nous devons concentrer nos efforts en priorité sur le Nord, où les divisions motorisées opèrent efficacement et où nous sommes menacés par l'Égypte et la Libye. Les divisions motorisées constituent la clé de la modernisation de notre armée."
 ROC_Cut_the_Trees: "Abattre les arbres"
 ROC_Cut_the_Trees_desc: "Nous devons nous concentrer sur les techniques de déboisement afin de permettre à nos troupes motorisées de se frayer un chemin à travers la jungle. Des exercices pratiques permettront de dégager de l'espace pour les usines tout en apprenant à notre armée à faire circuler des jeeps dans la jungle."
 ROC_Army_of_the_Brush_and_Jungle: "L'armée du pinceau et de la jungle"
 ROC_Army_of_the_Brush_and_Jungle_desc: "L'Afrique équatoriale est principalement couverte de forêts et de jungles. Nous devons nous concentrer sur la défense de la majeure partie de notre pays. Les troupes motorisées ne servent à rien dans la jungle."
 ROC_Local_Initiative: "Initiative Locale"
 ROC_Local_Initiative_desc: "Nous devons motiver les autochtones afin qu'ils défendent ce pays. Leur connaissance des traditions et du terrain sera d'une grande aide pour notre armée."
 ROC_Minor_Details: "Détails mineurs"
 ROC_Minor_Details_desc: "Même si nous sommes une colonie, la Mère-patrie nous laisse une certaine marge de manœuvre quant à la manière de nous comporter. Réévaluons notre politique en cette nouvelle ère."
 ROC_Undermine_French_Governors: "Saper l'autorité des gouverneurs français"
 ROC_Undermine_French_Governors_desc: "Ces gouverneurs ne sont que des amateurs. Ils freinent le développement de ce pays et favorisent une culture du népotisme. Il faut les écarter discrètement."
 ROC_Support_the_French_Governors: "Soutenir les gouverneurs français"
 ROC_Support_the_French_Governors_desc: "Les gouverneurs français sont d'une aide précieuse. Ils connaissent ce pays presque aussi bien que les autochtones. Ils sont capables de contrôler les populations autochtones. Nous devons les soutenir dans leurs efforts pour franciser ce territoire."
 ROC_Restrict_Local_Councils: "Limiter les pouvoirs des conseils municipaux"
 ROC_Restrict_Local_Councils_desc: "Les conseils locaux constituent un tremplin vers l'indépendance et l'autonomisation. Ils vont mettre ce pays à feu et à sang."
 ROC_Forced_Labor: "Travail forcé"
 ROC_Forced_Labor_desc: "Le travail forcé a fait ses preuves au Congo. Nous devons le mettre en place ici pour pouvoir nous moderniser."
 ROC_Cooperate_with_Local_Councils: "Collaborer avec les municipalités"
 ROC_Cooperate_with_Local_Councils_desc: "En modifiant quelque peu leur mode de fonctionnement, les conseils municipaux peuvent rendre notre gouvernement plus populaire auprès de la population locale."
 ROC_The_Governors_Government: "Le gouvernement du gouverneur"
 ROC_The_Governors_Government_desc: "Notre système politique a été réorganisé autant qu'il était possible de le faire jusqu'à présent. Poursuivons sur la voie du changement."
 ROC_Request_Autonomy: "Demander l'autonomie"
 ROC_Request_Autonomy_desc: "En tant que colonie, nos possibilités de modernisation sont limitées. Il est nécessaire d'acquérir davantage d'autonomie et d'être en mesure de mettre en œuvre rapidement les meilleures politiques sur le terrain."
 ROC_Autonomy_Denied: "Autonomie refusée"
 ROC_Autonomy_Denied_desc: "Il semblerait que les Français ne soient pas prêts à se séparer de l'Afrique équatoriale. Nous devons leur ouvrir les yeux."
 ROC_Stir_Up_Discontent: "Attiser le mécontentement"
 ROC_Stir_Up_Discontent_desc: "La France doit prendre conscience à quel point l'absence d'autonomie est répressive."
 ROC_Native_Resentment: "Le ressentiment des autochtones"
 ROC_Native_Resentment_desc: "Il est inévitable que certains en viennent à détester notre gouvernement en raison de notre interprétation littérale de la politique française."
 ROC_Stage_Riots: "Émeutes sur scène"
 ROC_Stage_Riots_desc: "Nous devons persévérer. L'autonomie, pour nous comme pour le peuple, est à portée de main."
 ROC_Demand_Emergency_Powers: "Exiger des pouvoirs d'urgence"
 ROC_Demand_Emergency_Powers_desc: "Il faut sévir contre ces manifestants. La France comprendra alors qu'elle a commis une erreur."
 ROC_Autonomy_Accepted: "Autonomie acceptée"
 ROC_Autonomy_Accepted_desc: "Au terme d'un long processus de négociation, la France a finalement décidé de céder une partie de sa souveraineté à notre gouvernement à Pointe-Noire."
 ROC_Administrative_Reform: "Réforme administrative"
 ROC_Administrative_Reform_desc: "Pour faire simple, la direction française freinait le développement de cette région. Désormais, tout va changer."
 ROC_Power_to_the_Governor: "Pouvoir au gouverneur"
 ROC_Power_to_the_Governor_desc: "Le gouverneur sera à la tête de notre gouvernement, et pas seulement de nom. Tous devront lui obéir."
 ROC_A_Unitary_Constitution: "Une Constitution unitaire"
 ROC_A_Unitary_Constitution_desc: "Ubangi-Shari, Gabon, Congo. Il ne s'agit pas là d'États indépendants potentiels. Le seul État indépendant envisageable dans cette région est l'Afrique équatoriale."
 ROC_Suspend_our_Ambitions: "Mettre nos ambitions en suspens"
 ROC_Suspend_our_Ambitions_desc: "Nous sommes allés trop loin. Il faut rassurer la population."
 ROC_Governor_Chauvet_Takes_Command: "Le gouverneur Chauvet prend le commandement"
 ROC_Governor_Chauvet_Takes_Command_desc: "Gabriel Chauvet est là pour sauver le peuple africain des exactions de Cornut-Gentille."
 ROC_Locals_In_Civil_Service: "Les agents locaux de la fonction publique"
 ROC_Locals_In_Civil_Service_desc: "Nous devons améliorer l'efficacité de notre administration en impliquant la population locale."
 ROC_Regional_Autonomy: "Autonomie régionale"
 ROC_Regional_Autonomy_desc: "Réfléchissons à la question de l'autonomie régionale. Faut-il la renforcer ou la réduire ?"
 ROC_Destandardize_Laws: "Déréglementer les lois"
 ROC_Destandardize_Laws_desc: "Dans la perspective de l'autonomie, nous devrions renoncer à l'idée de maintenir des lois identiques sur l'ensemble de ce territoire. Il n'est pas logique que chaque État dispose du même ensemble de lois."
 ROC_Keep_the_Current_System: "Conserver le système actuel"
 ROC_Keep_the_Current_System_desc: "L'Afrique équatoriale progressera en étendant son autorité, et non en s'écartant des normes."
 ROC_Invite_Cameroon: "Inviter le Cameroun"
 ROC_Invite_Cameroon_desc: "Il faudrait nous confier le mandat du Cameroun. Demandons leur avis aux gouverneurs locaux."
 ROC_Union_of_Central_African_Republics: "Union des Républiques d'Afrique centrale"
 ROC_Union_of_Central_African_Republics_desc: "Nous devrions changer officiellement de nom. Nous ne sommes pas simplement français."
 ROC_1951_Development_Plan: "Plan d'aménagement de 1951"
 ROC_1951_Development_Plan_desc: "Élaborons ensemble un ensemble de mesures visant à moderniser notre pays."
 ROC_End_Forced_Labor: "Mettre fin au travail forcé"
 ROC_End_Forced_Labor_desc: "Mettons fin à cette pratique inhumaine que l'on a qualifiée de « pseudo-goulags »."
 ROC_Development_Plan_Modernization_51: "Plan de modernisation de 1951"
 ROC_Development_Plan_Modernization_51_desc: "Notre pays doit aller de l'avant."
 ROC_1953_Development_Plan: "Plan de développement de 1953"
 ROC_1953_Development_Plan_desc: "Nous continuerons à aller de l'avant."
 ROC_Development_Plan_Modernization_53: "Plan de modernisation de 1953"
 ROC_Development_Plan_Modernization_53_desc: "Nous devons continuer à nous attacher à faire avancer notre pays vers l'avenir."
 ROC_The_State_of_Equatorial_Africa: "L'État d'Afrique équatoriale"
 ROC_The_State_of_Equatorial_Africa_desc: "Il est temps de proclamer un nouvel État africain. C'est désormais une réalité. Nos rêves sont devenus réalité."
 ROC_A_Union_Under_Gentille: "Une Union sous Gentille"
 ROC_A_Union_Under_Gentille_desc: "Nous ne devons pas oublier qui nous a amenés jusqu’ici. Accordons-lui le titre le plus élevé qui soit. Il sera consul, comme Napoléon."
 ROC_Sweeten_the_Deal: "Rendre l'offre plus alléchante"
 ROC_Sweeten_the_Deal_desc: "La France n'aura certainement rien contre l'indépendance si nous lui offrons quelque chose en échange."
 ROC_France_Rejects: "La France rejette"
 ROC_France_Rejects_desc: "Malheureusement, la France ne nous a pas encore accordé l'indépendance. Nous devons voir ce que nous pouvons faire."
 ROC_Request_Independence: "Demander l'indépendance"
 ROC_Request_Independence_desc: "Nous pensons avoir démontré à la France que nous sommes prêts à devenir indépendants. Attendons leur réponse."
 ROC_France_Accepts: "La France accepte"
 ROC_France_Accepts_desc: "Aujourd'hui est un jour de fête. La France nous a accordé l'indépendance."
 ROC_Autonomy_to_Gabon: "Autonomie gabonaise"
 ROC_Autonomy_to_Gabon_desc: "Le Gabon est confronté à un problème similaire à celui de l'Oubangui-Shari, mais il a besoin d'une plus grande autonomie en raison de sa proximité avec le Cameroun et les possessions espagnoles."
 ROC_Give_Political_Authority_to_Ubangi_Shari: "Transférer des compétences à l'Ubangi-Shari"
 ROC_Give_Political_Authority_to_Ubangi_Shari_desc: "Il faudrait accorder davantage de pouvoirs aux préfets de l'Ubangi-Shari. Ils sont coupés de Pointe-Noire et ont besoin d'une attention particulière de la part des autorités locales."
 ROC_Dissolution_of_French_Equatorial_Africa: "Dissolution de l'Afrique équatoriale française"
 ROC_Dissolution_of_French_Equatorial_Africa_desc: "La décolonisation ne peut plus être retardée. Il est temps désormais de mettre fin à cette situation."
 ROC_1955_Development_Plan: "Plan d'aménagement de 1955"
 ROC_1955_Development_Plan_desc: "Il est temps de poursuivre nos projets industriels."
 ROC_Development_Plan_Modernization_55: "Plan de modernisation de 1955"
 ROC_Development_Plan_Modernization_55_desc: "D'ici 1960, nous aurons rattrapé l'industrie française !"
 roc_france_pay: "Paiements vers la France"
 roc_france_pay_desc: "Nous payons la France pour qu'elle devienne indépendante."
 roc_france_give: "Paiements en Afrique équatoriale"
 roc_france_give_desc: "Nous percevons des tributs de notre colonie d'Afrique équatoriale en échange de son indépendance."
 equ.1.t: "Changement de gouverneur"
 equ.1.d: "Les Français ont décidé que le mandat de Bernard Cornut-Gentille touchait à sa fin. On lui avait promis le poste de gouverneur pendant quelques années après la Seconde Guerre mondiale. Cependant, il a accompli son mandat, et la France souhaite désormais le rappeler et le remplacer par un autre gouverneur, Paul Louis Gabriel Chauvet. Nous pouvons contester cette décision, mais personne n'en sera satisfait et nous manquerons ainsi une occasion de mener des réformes."
 equ.1.a: "Renvoyer Gentille chez elle"
 equ.1.b: "Garder Gentille"