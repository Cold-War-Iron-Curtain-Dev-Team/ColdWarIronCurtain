 VIE_fighter_equipment_0:0 "Armée de l'air de la République du Vietnam"
 VIE_fighter_equipment_0_short:0 "RVNAF"
 VIE_fighter_equipment_0_desc:0 "L'armée de l'air du Sud-Vietnam, officiellement appelée Armée de l'air de la République du Vietnam (RVNAF) FAVN, parfois désignée sous le nom d'armée de l'air vietnamienne ou VNAF, était la branche aérienne des forces armées de la République du Vietnam, l'armée officielle de la République du Vietnam (Sud-Vietnam) de 1955 à 1975."
 VIE_fighter_equipment_1:0 "Curtiss P-40 Warhawk"
 VIE_fighter_equipment_1_short:0 "P-40 Warhawk"
 VIE_fighter_equipment_1_desc:0 "Le P-40 était un avion de chasse monomoteur entièrement métallique développé en 1938. Il s'agissait d'une version modifiée du P-36 Hawk. Ce modèle fut utilisé par un grand nombre de puissances alliées pendant la Seconde Guerre mondiale et, bien qu'il fût inférieur aux P-47 et P-51 plus récents, il resta en service sur le front jusqu'à la fin de la guerre. 200 pilotes alliés de 7 nations différentes, dont les États-Unis, les pays du Commonwealth britannique et l'Union soviétique, sont devenus des as du P-40. Malgré des désignations différentes pour le Commonwealth et l'Union soviétique, le surnom officiel dans l'armée américaine est « Warhawk »."
 VIE_fighter_equipment_2:0 "Republic F-47 Thunderbolt"
 VIE_fighter_equipment_2_short:0 "F-47 Thunderbolt"
 VIE_fighter_equipment_2_desc:0 "Le P-47 était une évolution du Seversky (prédécesseur de Republic) P-35 et du Republic P-43 Lancer. Bien qu'il ait été initialement conçu comme un chasseur de supériorité aérienne, le P-47 s'est illustré par sa capacité à transporter une lourde charge de bombes, marquant ainsi le début de la tradition de la société dans le développement d'avions d'appui aérien rapproché (CAS). Ce modèle a été utilisé par de nombreux pays alliés pendant la Seconde Guerre mondiale et a continué à l'être après la guerre. Certains affirment que c'est lui, et non le P-51 Mustang, qui aurait dû être utilisé en Corée. Son surnom, « Thunderbolt », est le premier à respecter les conventions de dénomination modernes de Republic. Il a été rebaptisé F-47 en 1948."
 VIE_fighter_equipment_3:0 "North American F-51D Mustang"
 VIE_fighter_equipment_3_short:0 "F-51D Mustang"
 VIE_fighter_equipment_3_desc:0 "Le P-51 est considéré comme l'un des meilleurs chasseurs jamais construits dans l'histoire de l'aviation. Développé par North American Aviation, il est entré en service en 1942. Initialement utilisé comme avion de reconnaissance tactique, il est devenu, avec l'introduction de la variante « D », le premier chasseur à dominer les airs, escortant les bombardiers américains et alliés lors des campagnes de bombardement les plus célèbres du théâtre européen et détruisant près de 5 000 avions pendant la guerre. Rebaptisé plus tard F-51, il s'illustra comme avion d'appui aérien rapproché pendant la guerre de Corée, et le « Mustang », cheval de bataille de l'USAAAF, resta en service jusqu'en 1968."
 VIE_heavy_fighter_equipment_1:0 "Lockheed P-38 Lightning"
 VIE_heavy_fighter_equipment_1_short:0 "P-38 Lightning"
 VIE_heavy_fighter_equipment_1_desc:0 "Avion à deux moteurs à pistons conçu pour privilégier la vitesse et l'armement lourd. Pendant la Seconde Guerre mondiale, sa vitesse a été mise à profit dans de nombreuses attaques éclair au-dessus du Pacifique, détruisant de nombreux avions japonais. Sa forme distinctive lui a valu le surnom de « der Gabelschwanz-Teufel » (le diable à queue fourchue) en Allemagne et de « Ni hikouki, ippairotto » (deux avions, un pilote) au Japon. Il est également connu sous le nom de « Lightning »."
 VIE_heavy_fighter_equipment_2:0 "Northrop F-61 Black Widow"
 VIE_heavy_fighter_equipment_2_short:0 "F-61 Black Widow"
 VIE_heavy_fighter_equipment_2_desc:0 "Le P-61, comme le P-38 avant lui, est un avion à double fuselage conçu en 1944. Il fut le premier chasseur de nuit américain, équipé d'un radar (une autre première) pour suivre les bombardiers et autres cibles et les intercepter de nuit et dans des conditions météorologiques défavorables. Équipé de quatre canons Hispano de 20 mm, le P-61 (rebaptisé plus tard F-61), surnommé « Black Widow » (veuve noire) en référence à la célèbre araignée américaine, est aussi redoutable que son nom le suggère."
 VIE_heavy_fighter_equipment_3:0 "North American F-82 Twin Mustang"
 VIE_heavy_fighter_equipment_3_short:0 "F-82 Twin Mustang"
 VIE_heavy_fighter_equipment_3_desc:0 "Développé à l'origine comme chasseur d'escorte à longue portée pour la Seconde Guerre mondiale, le P-82 a été introduit en 1946, trop tard pour servir pendant le conflit. Développé à partir du célèbre P-51, le P-82 (plus tard F-82) a été utilisé en remplacement du P-61 Black Widow et était équipé d'un radar pour soutenir le Commandement stratégique aérien. Comme sa cellule ressemble à deux P-51 assemblés, il a été surnommé « Twin Mustang »."
 VIE_strat_bomber_equipment_1:0 "Boeing B-17 Flying Fortress"
 VIE_strat_bomber_equipment_1_short:0 "B-17 Flying Fortress"
 VIE_strat_bomber_equipment_1_desc:0 "Le B-17 est un bombardier stratégique quadrimoteur développé au milieu des années 1930 pour l'armée de l'air américaine. Il s'agit du troisième bombardier le plus produit pendant la Seconde Guerre mondiale. Il s'est illustré sur le théâtre européen du conflit, où il a mené des campagnes de bombardement en Allemagne à partir de bases situées dans le sud de l'Angleterre et en Italie. Son armement défensif imposant est à la hauteur d'un avion surnommé la « forteresse volante »."
 VIE_strat_bomber_equipment_2:0 "Consolidated B-24 Liberator"
 VIE_strat_bomber_equipment_2_short:0 "B-24 Liberator"
 VIE_strat_bomber_equipment_2_desc:0 "Le B-24 a été conçu en 1941 comme bombardier lourd à longue portée pour l'armée de l'air américaine. Malgré sa capacité à transporter une lourde charge de bombes et sa vitesse de croisière élevée, il était relativement difficile à piloter à basse altitude et avait un plafond pratique inférieur à celui du B-17. Pourtant, le « Liberator » était préféré par l'état-major américain et fut le bombardier le plus produit pendant la Seconde Guerre mondiale. Comme le B-17, il rendit de grands services sur le théâtre européen pendant la campagne de bombardements de l'Allemagne, mais se distingua également sur le théâtre du Pacifique."
 VIE_strat_bomber_equipment_3:0 "Boeing B-29 Superfortress"
 VIE_strat_bomber_equipment_3_short:0 "B-29 Superfortress"
 VIE_strat_bomber_equipment_3_desc:0 "Le B-29 était un bombardier quadrimoteur à hélices mis en service en 1944. Il s'agissait du projet d'armement le plus coûteux jamais réalisé pendant la guerre, dépassant même le coût du programme d'armement nucléaire américain de l'époque. Conçu comme un bombardier stratégique à haute altitude, il fut utilisé comme bombardier incendiaire de nuit à basse altitude, lançant des raids de bombardements incendiaires sur le Japon. Mais la « Superfortress » doit surtout sa renommée au largage des bombes atomiques sur Hiroshima et Nagasaki, qui ont contribué à la fin de la guerre. Des variantes modernisées (dont le B-50, rebaptisé) ont continué à être utilisées comme bombardiers stratégiques pendant la guerre de Corée avant d'être retirées du service au début des années 1950."
 VIE_tac_bomber_equipment_0:0 "Douglas B-18 Bolo"
 VIE_tac_bomber_equipment_0_short:0 "B-18 Bolo"
 VIE_tac_bomber_equipment_0_desc:0 "Le B-18, introduit en 1936, était un bombardier moyen développé pour remplacer le Martin B-10. Bien qu'il fût performant au moment de son introduction, il fut rapidement rendu obsolète en 1940 et relégué à la lutte anti-sous-marine et au transport aérien. Malgré cela, le « Bolo » allait connaître la gloire en devenant le premier avion américain à couler un sous-marin allemand pendant la Seconde Guerre mondiale."
 VIE_tac_bomber_equipment_1:0 "Douglas B-23 Dragon"
 VIE_tac_bomber_equipment_1_short:0 "B-23 Dragon"
 VIE_tac_bomber_equipment_1_desc:0 "Développé comme un successeur perfectionné du B-18 Bolo, le B-23 était plus rapide et pouvait transporter une charge de bombes plus lourde et un armement défensif plus important. Cependant, le « Dragon » s'est avéré inférieur à ses contemporains, les B-25 et B-26, et a été largement relégué au rang d'avion d'entraînement pendant la Seconde Guerre mondiale."
 VIE_tac_bomber_equipment_2:0 "North American B-25 Mitchell"
 VIE_tac_bomber_equipment_2_short:0 "B-25 Mitchell"
 VIE_tac_bomber_equipment_2_desc:0 "Le B-25 est un bombardier moyen bimoteur introduit en 1941. Utilisé par de nombreuses forces aériennes pendant la Seconde Guerre mondiale, il a également servi sur tous les théâtres d'opérations impliquant des avions pendant la guerre, son utilisation la plus célèbre étant le raid de Doolittle, la première campagne de bombardements aériens réussie sur le territoire japonais pendant la guerre. Son surnom est le « Mitchell », du nom du major général Billy Mitchell, pionnier de l'aviation militaire américaine."
 VIE_tac_bomber_equipment_3:0 "Martin B-26C Invader"
 VIE_tac_bomber_equipment_3_short:0 "B-26C Invader"
 VIE_tac_bomber_equipment_3_desc:0 "Le B-26 a été développé en 1941 comme bombardier moyen, parallèlement au B-25. Difficile à piloter au départ, il a été surnommé « Widowmaker » (faiseur de veuves) en raison du nombre de pilotes qui se sont écrasés et ont trouvé la mort lors de leur formation sur cet appareil. Cependant, après avoir subi des modifications et une fois les pilotes correctement formés, il s'est révélé être un bombardier tactique performant, servant en Europe occidentale ainsi que dans les théâtres du Pacifique et de la Méditerranée pendant la Seconde Guerre mondiale. Surnommé le « Marauder », cet appareil a été retiré du service en 1947, avant que l'armée de l'air ne soit séparée de l'armée de terre (ce qui explique pourquoi l'A-26 Invader a brièvement été baptisé B-26)."
 VIE_nav_bomber_equipment_1:0 "Consolidated PBY-1 Catalina"
 VIE_nav_bomber_equipment_1_short:0 "PBY-1"
 VIE_nav_bomber_equipment_1_desc:0 "Variante de production initiale équipée de deux moteurs R-1830-64 de 900 ch. Le Consolidated PBY Catalina est un hydravion et un avion amphibie produit dans les années 1930 et 1940. Au Canada, il était connu sous le nom de Canso. Il fut l'un des hydravions les plus utilisés pendant la Seconde Guerre mondiale. Les Catalina ont servi dans toutes les branches des forces armées américaines ainsi que dans les forces aériennes et navales de nombreux autres pays. Les derniers PBY militaires ont été utilisés jusqu'aux années 1980. En 2021, 86 ans après son premier vol, cet avion continue de voler en tant que bombardier à eau (ou avion-citerne) dans le cadre d'opérations de lutte contre les incendies aériens dans certaines régions du monde. Aucun n'est plus en service militaire."
 VIE_nav_bomber_equipment_2:1 "Consolidated PBY-5 Catalina"
 VIE_nav_bomber_equipment_2_short:1 "PBY-5"
 VIE_nav_bomber_equipment_2_desc:0 "Le Consolidated PBY Catalina est un hydravion et un avion amphibie qui a été produit dans les années 1930 et 1940. Au Canada, il était connu sous le nom de Canso. Il a été l'un des hydravions les plus utilisés pendant la Seconde Guerre mondiale. Les Catalina ont servi dans toutes les branches des forces armées américaines ainsi que dans les forces aériennes et navales de nombreux autres pays. Les derniers PBY militaires ont servi jusqu'aux années 1980. En 2021, 86 ans après son premier vol, cet avion continue de voler en tant que bombardier d'eau (ou avion-citerne) dans le cadre d'opérations de lutte aérienne contre les incendies dans certaines régions du monde. Aucun n'est plus en service militaire."
 VIE_nav_bomber_equipment_3:0 "Consolidated PB4Y-2 Privateer"
 VIE_nav_bomber_equipment_3_short:0 "PB4Y-2 Privateer"
 VIE_nav_bomber_equipment_3_desc:0 "Le Consolidated PB4Y-2 Privateer est un bombardier de patrouille américain de la Seconde Guerre mondiale et de la guerre de Corée, utilisé par la marine américaine et dérivé du Consolidated B-24 Liberator."
 VIE_CAS_equipment_2:0 "Douglas A-20 Havoc"
 VIE_CAS_equipment_2_short:0 "A-20 Havoc"
 VIE_CAS_equipment_2_desc:0 "L'A-20, surnommé « Havoc », a été introduit en 1941 en tant que bombardier léger et avion d'attaque au sol. Utilisé par les États-Unis et le Commonwealth, il doit sa renommée à son service dans l'armée de l'air et la marine soviétiques, qui ont reçu les deux tiers des modèles A-20B et de nombreux modèles G et H. Modifiés avec des mitrailleuses de 7,62 mm à cadence de tir plus rapide et des canons à tir frontal, ces modèles se sont distingués sur le front oriental contre les chars allemands et ont été les bombardiers étrangers les plus utilisés par l'armée de l'air soviétique pendant la Seconde Guerre mondiale. Les variantes de chasseurs ont également été baptisées P-70."
 VIE_CAS_equipment_3:0 "North American A-36 Apache"
 VIE_CAS_equipment_3_short:0 "A-36 Apache"
 VIE_CAS_equipment_3_desc:0 "L'A-36 a été développé comme variante d'attaque au sol du célèbre P-51 Mustang. Bombardier en piqué, il a fait ses preuves en Afrique du Nord, en Méditerranée, en Italie et sur les théâtres d'opérations Chine-Birmanie-Inde pendant la Seconde Guerre mondiale. Il est connu pour ses aérofreins rectangulaires caractéristiques situés à l'extrémité des ailes. L'« Apache », nommé d'après la tribu amérindienne, s'est révélé redoutable au cours de sa courte carrière, servant de 1942 jusqu'à son retrait à la fin de la guerre en 1945."
 VIE_CAS_equipment_4:0 "Douglas A-26C Invader"
 VIE_CAS_equipment_4_short:0 "A-26C Invader"
 VIE_CAS_equipment_4_desc:0 "L'A-26 est un avion d'attaque rapide bimoteur développé à partir de l'A-20 Havoc, qu'il était destiné à remplacer. Mis en service en 1943, l'Invader a servi dans l'armée de l'air américaine pendant la Seconde Guerre mondiale, attaquant les positions japonaises dans les Indes orientales néerlandaises et aux Philippines, ainsi qu'en Europe lors des campagnes dans la vallée du Pô, dans le nord de l'Italie. Il a continué à servir en Corée, participant à des missions de bombardement contre la Corée, et a été le premier avion à effectuer une sortie dans ce conflit. L'« Invader » a poursuivi sa carrière au Vietnam, soutenant les opérations de la CIA au Laos contre les forces vietcongs. Avec une carrière légendaire à travers trois guerres, l'« Invader » a prouvé sa valeur et montré ce dont un avion CAS était capable."
 VIE_cv_CAS_equipment_4:0 "Douglas AD Skyraider"
 VIE_cv_CAS_equipment_4_short:0 "Douglas AD Skyraider"
 VIE_cv_CAS_equipment_4_desc:0 "Le Douglas AD est un avion d'attaque rapide fiable, basé sur un porte-avions. Conçu à l'origine comme un bombardier torpilleur et en piqué, l'AD (initialement le BT2D) est entré en service en 1946 et s'est illustré pendant la guerre de Corée, devenant le principal avion d'attaque au sol des forces de la marine américaine et du corps des Marines sur place. Même si la plupart des avions à hélices ont été retirés du service après le conflit coréen, le nouvel A-1 est resté en service et a joué un rôle clé en tant qu'avion d'appui aérien rapproché. Le « Skyraider » a servi avec distinction jusqu'à la fin de l'intervention américaine au Vietnam."
 VIE_cv_nav_bomber_equipment_1:0 "Douglas TBD Devastator"
 VIE_cv_nav_bomber_equipment_1_short:0 "TBD Devastator"
 VIE_cv_nav_bomber_equipment_1_desc:0 "Lorsque le TBD est entré en service en 1937, il était encore largement considéré comme l'un des meilleurs bombardiers torpilleurs. Cependant, malgré quelques succès au début de la guerre, au moment de l'attaque japonaise sur Pearl Harbor, le « Devastator » était malheureusement obsolète, ce qui a été confirmé lors de la bataille de Midway, où la quasi-totalité des Devastators utilisés dans la bataille ont été détruits. Bien que cela ait été attribué par la suite à une couverture aérienne insuffisante et à des défauts dans les torpilles qu'il transportait habituellement, le TBD fut retiré du service actif immédiatement après la bataille, puis définitivement retiré du service en 1944."
 VIE_cv_nav_bomber_equipment_2:0 "Grumman TBF-1C Avenger"
 VIE_cv_nav_bomber_equipment_2_short:0 "TBF-1C Avenger"
 VIE_cv_nav_bomber_equipment_2_desc:0 "La variante TBF-1C de l'« Avenger » améliorait la conception originale du TBF-1 en prévoyant deux mitrailleuses de 12,7 mm (calibre .50) montées sur les ailes et des réservoirs de carburant également montés sur les ailes, ce qui doublait l'autonomie et la puissance d'attaque vers l'avant de l'avion."
 VIE_cv_nav_bomber_equipment_3:0 "Consolidated PB4Y-2 Privateer"
 VIE_cv_nav_bomber_equipment_3_short:0 "PB4Y-2 Privateer"
 VIE_cv_nav_bomber_equipment_3_desc:0 "Le Consolidated PB4Y-2 Privateer est un bombardier de patrouille américain de la Seconde Guerre mondiale et de la guerre de Corée, utilisé par la marine américaine et dérivé du Consolidated B-24 Liberator."
 VIE_CAS_equipment_1:0 "Northrop A-17"
 VIE_CAS_equipment_1_short:0 "A-17"
 VIE_CAS_equipment_1_desc:0 "L'A-17 était un avion d'attaque monomoteur biplace dérivé du Northrop Gamma 2F et développé en 1935. C'était un appareil fiable et très apprécié. Ce type d'avion servit d'avion de patrouille côtière pour les unités ennemies qui pouvaient traverser le canal de Panama au début de la Seconde Guerre mondiale, après l'attaque de Pearl Harbor, et fut utilisé à des fins utilitaires jusqu'à son retrait en 1944."
 VIE_cv_CAS_equipment_2:0 "Douglas SBD-2 Dauntless"
 VIE_cv_CAS_equipment_2_short:0 "SBD-2 Dauntless"
 VIE_cv_CAS_equipment_2_desc:0 "Le SBD-2 a été conçu en 1940 comme avion de reconnaissance et bombardier en piqué. Il était le principal avion de ce type utilisé par la marine américaine. Le « Dauntless », qui était déjà un bombardier en piqué performant, a été amélioré avec la variante -2, dotée d'un armement différent et d'une capacité de carburant accrue, mais il ne s'agissait que d'une solution provisoire mineure par rapport aux modèles ultérieurs. Les variantes de l'USAAF l'ont baptisé A-24 Banshee."
 VIE_cv_CAS_equipment_3:0 "Curtiss SB2C-1s Helldiver"
 VIE_cv_CAS_equipment_3_short:0 "SB2C-1s Helldiver"
 VIE_cv_CAS_equipment_3_desc:0 "Remplaçant le SBD Dauntless, le SB2C, introduit en 1942, était beaucoup plus rapide que le SBD qu'il remplaçait, mais c'était un avion difficile à piloter, ce qui lui valut le surnom péjoratif de « SOB, 2nd Class » (enfoiré de deuxième classe). Malgré cela et un rapport cinglant qui allait ternir à jamais l'héritage de la Curtiss Aircraft Company, le « Helldiver » obtint d'excellents résultats au combat tout au long de la guerre du Pacifique. La variante de l'USAAF l'appelait A-25 Shrike."
 VIE_cv_fighter_equipment_0:0 "Grumman FF 'Fifi'"
 VIE_cv_fighter_equipment_0_short:0 "FF 'Fifi'"
 VIE_cv_fighter_equipment_0_desc:0 "Lancé en 1933, le Grumman FF fut le premier modèle entièrement conçu par la société pour la marine américaine. Surnommé officieusement « Fifi » (d'après la désignation FF), le Grumman FF fut un biplan embarqué très performant tout au long des années 30, avant d'être retiré du service en 1940."
 VIE_cv_fighter_equipment_1:0 "Grumman F3F"
 VIE_cv_fighter_equipment_1_short:0 "F3F"
 VIE_cv_fighter_equipment_1_desc:0 "Le Grumman F3F, lorsqu'il a été introduit en 1936, était le dernier avion de chasse biplan livré à la marine américaine et à l'ensemble des forces armées américaines en général. Malgré sa courte durée de service (retiré du service de première ligne en 1941 et du service en général en 1943), il restait un avion assez performant, le dernier d'une époque d'avions monoplans qui allait marquer l'avenir du combat aérien."
 VIE_cv_fighter_equipment_2:0 "Vought F4U-5 Corsair"
 VIE_cv_fighter_equipment_2_short:0 "F4U-5 Corsair"
 VIE_cv_fighter_equipment_2_desc:0 "Le Vought F4U Corsair est un avion de chasse américain qui a principalement servi pendant la Seconde Guerre mondiale et la guerre de Corée. Conçu et initialement fabriqué par Chance Vought, le Corsair a rapidement connu une forte demande ; des contrats de production supplémentaires ont été attribués à Goodyear, dont les Corsair ont été désignés FG, et à Brewster, désignés F3A. Le Corsair a été conçu et utilisé comme avion embarqué, et est entré en service en grand nombre dans la marine américaine à la fin de 1944 et au début de 1945. Il est rapidement devenu l'un des chasseurs-bombardiers embarqués les plus performants de la Seconde Guerre mondiale."
 VIE_cv_fighter_equipment_3:0 "Grumman F8F Bearcat"
 VIE_cv_fighter_equipment_3_short:0 "F8F Bearcat"
 VIE_cv_fighter_equipment_3_desc:0 "Le Grumman F8F Bearcat est un avion de chasse monomoteur américain basé sur un porte-avions, introduit à la fin de la Seconde Guerre mondiale. Il a servi au milieu du XXe siècle dans la marine américaine, le corps des Marines des États-Unis et les forces aériennes d'autres nations. Il s'agit du dernier avion de chasse à moteur à pistons de Grumman Aircraft."
 VIE_cv_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35C Lightning II"
 VIE_cv_mr_stealth_fighter_equipment_1_short:0 "F-35C Lightning II"
 VIE_cv_mr_stealth_fighter_equipment_1_desc:0 "Le F-35C est la variante CATOBAR (Catapult Assisted Take-Off But Arrested Recovery) de la famille F-35 Lightning II de Lockheed Martin, conçue principalement pour être déployée sur des porte-avions. Le programme F-35 a débuté en 1992, et la variante C a pris son envol dès 2010 et a été opérationnelle sur des porte-avions moins de quatre ans plus tard. Par rapport à ses homologues, la variante C se caractérise par des ailes plus grandes avec des extrémités repliables."
 VIE_jump_stealth_equipment_1:0 "Lockheed Martin F-35B Lightning II"
 VIE_jump_stealth_equipment_1_short:0 "F-35B Lightning II"
 VIE_jump_stealth_equipment_1_desc:0 "Un avion de combat polyvalent produit à partir d'une conception JSF (Joint Strike Fighter). Bien qu'il puisse utiliser diverses armes dans les combats air-air et sol-sol, le coût d'acquisition de cet avion de combat furtif est plus raisonnable que celui du F-22A. En fonction de son utilité, plusieurs types sont disponibles. Le type « B » utilisé par le Corps des Marines des États-Unis est compatible STOVL (décollage court/atterrissage vertical). Son surnom est « Lightning II »."
 VIE_cas_stealth_equipment_1:0 "Fairchild Republic A-10C Thunderbolt II"
 VIE_cas_stealth_equipment_1_short:0 "A-10C Thunderbolt II"
 VIE_cas_stealth_equipment_1_desc:0 "La variante C de l'A-10 « Thunderbolt II » a été développée en 2005 dans le cadre du programme de modernisation Precision Engagement. Tirant parti des enseignements tirés du prototype YA-10B, l'A-10C est équipé d'un système de contrôle de tir modernisé, d'une suite ECM et de capacités de ciblage de bombes intelligentes. Le module d'identification ami-ennemi et la suite de communications ont également été mis à jour et modernisés. En partie grâce à ses performances récentes et à la pression politique, l'A-10 devrait continuer à servir dans le cadre des opérations de combat de l'armée de l'air américaine dans un avenir proche."
 VIE_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 VIE_mr_stealth_fighter_equipment_1_short:0 "F-35A Lightning II"
 VIE_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnels (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le programme F-35 a débuté en 1992, la variante A ayant pris son envol fin 2006 et largué ses premières bombes moins de six ans plus tard. La variante A est la plus petite et la plus légère des variantes du F-35. Elle est principalement destinée à remplacer le F-16 Fighting Falcon."
 VIE_jet_multirole_equipment_1:0 "Grumman F8F-1(D)B Bearcat"
 VIE_jet_multirole_equipment_1_short:0 "F8F-1(D)B Bearcat"
 VIE_jet_multirole_equipment_1_desc:0 "Le Grumman F8F Bearcat est un avion de chasse monomoteur américain basé sur un porte-avions, introduit à la fin de la Seconde Guerre mondiale. Il a servi au milieu du XXe siècle dans la marine américaine, le corps des Marines des États-Unis et les forces aériennes d'autres nations. Il s'agit du dernier avion de chasse à moteur à pistons de Grumman Aircraft."
 VIE_jet_multirole_equipment_2:0 "North American F-86A Sabre"
 VIE_jet_multirole_equipment_2_short:0 "F-86A Sabre"
 VIE_jet_multirole_equipment_2_desc:0 "Le F-86 est un avion de chasse à réaction à ailes en flèche développé et mis en service à la fin des années 1940 à partir des recherches capturées par les Allemands. La conception de cet avion lui permettait d'atteindre des vitesses transsoniques et une grande maniabilité, des caractéristiques qui lui permettaient de rivaliser avec son célèbre concurrent, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, avec ses variantes canadiennes et australiennes, est l'avion de chasse occidental le plus produit de l'histoire de l'aviation."
 VIE_jet_multirole_equipment_3:0 "North American F-86F Sabre"
 VIE_jet_multirole_equipment_3_short:0 "F-86F Sabre"
 VIE_jet_multirole_equipment_3_desc:0 "Système de commandes de vol amélioré et « empennage entièrement mobile » (Ce système a été remplacé par une commande entièrement motorisée avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche toujours conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur). Les Sabre F bénéficiaient d'une agilité à haute vitesse nettement améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 VIE_jet_multirole_equipment_4:0 "North American F-100 Super Sabre"
 VIE_jet_multirole_equipment_4_short:0 "F-100 Super Sabre"
 VIE_jet_multirole_equipment_4_desc:0 "Premier avion de chasse capable d'atteindre une vitesse supersonique en vol horizontal, le F-100 était un avion multirôle performant conçu pour affronter l'ennemi en combat aérien. Développé à partir du F-86 Sabre, le F-100 allait adopter le surnom de « Super Sabre », mais reçut également celui de « Hun » en raison de sa désignation au sein de l'USAF à l'époque. Ce type d'appareil servit au Vietnam comme chasseur-bombardier et fut le premier à être utilisé dans le cadre de la suppression des défenses aériennes ennemies, sous le nom célèbre de Wild Weasel."
 VIE_jet_multirole_equipment_5:0 "Northrop F-5C Skoshi Tiger"
 VIE_jet_multirole_equipment_5_short:0 "F-5C Skoshi Tiger"
 VIE_jet_multirole_equipment_5_desc:0 "Douze F-5A Freedom Fighters ont été testés par l'US Air Force pendant quatre mois et demi au Vietnam. Modifiés à l'usine de Palmdale, ils ont été équipés d'une sonde de ravitaillement en vol amovible et non rétractable sur le côté gauche, de 90 livres de plaques de blindage externes sous le cockpit et le moteur, et de pylônes largables."
 VIE_jet_multirole_equipment_6:0 "McDonnell Douglas F-4D Phantom II"
 VIE_jet_multirole_equipment_6_short:0 "F-4D Phantom II"
 VIE_jet_multirole_equipment_6_desc:0 "F-4C équipé d'une avionique modernisée et d'un radar AN/APQ-109."
 VIE_jet_multirole_equipment_7:0 "McDonnell Douglas F-4E Phantom II"
 VIE_jet_multirole_equipment_7_short:0 "F-4E Phantom II"
 VIE_jet_multirole_equipment_7_desc:0 "Version USAF avec un canon M61 Vulcan intégré dans le nez allongé du RF-4C, un radar AN/APQ-120 avec une section transversale plus petite pour accueillir le canon, des moteurs J79-GE-17 avec une poussée de 17 900 lbf (79,379 kN) chacun en postcombustion. Les avions de la dernière série étaient équipés de volets de bord d'attaque pour améliorer la maniabilité au détriment de la vitesse maximale dans le cadre du programme Agile Eagle. À partir du bloc 53, les avions ont été équipés de la capacité AGM-65 Maverick et de moteurs J79-GE-17C ou -17E sans fumée. Premier vol le 1er août 1965. La variante Phantom la plus nombreuse ; 1 370 exemplaires construits."
 VIE_jet_multirole_equipment_8:0 "Northrop F-5E Tiger II"
 VIE_jet_multirole_equipment_8_short:0 "En 1970, Northrop remporta le concours International Fighter Aircraft (IFA) visant à remplacer le F-5A, grâce à ses meilleures performances air-air face à des avions tels que le MiG-21 soviétique. L'avion qui en résulta, initialement connu sous le nom de F-5A-21, devint par la suite le F-5E. Il était équipé de moteurs General Electric J85-21 plus puissants (5 000 lbf) et disposait d'un fuselage allongé et élargi, pouvant contenir plus de carburant. Ses ailes étaient équipées d'extensions élargies sur le bord d'attaque, ce qui augmentait la surface alaire et améliorait la maniabilité."
 VIE_jet_multirole_equipment_9:0 "Northrop F-5E Tiger III"
 VIE_jet_multirole_equipment_9_short:0 "En 1970, Northrop remporta le concours International Fighter Aircraft (IFA) visant à remplacer le F-5A, grâce à ses meilleures performances air-air face à des avions tels que le MiG-21 soviétique. L'avion qui en résulta, initialement connu sous le nom de F-5A-21, devint par la suite le F-5E. Il était équipé de moteurs General Electric J85-21 plus puissants (5 000 lbf) et disposait d'un fuselage allongé et élargi, pouvant contenir plus de carburant. Ses ailes étaient équipées d'extensions élargies sur le bord d'attaque, ce qui augmentait la surface alaire et améliorait la maniabilité."
 VIE_jet_multirole_equipment_10:0 "Projet de modernisation progressive du McDonnell Douglas F/A-18 Hornet, phase I"
 VIE_jet_multirole_equipment_10_short:0 "F/A-18 Hornet IMP Phase I"
 VIE_jet_multirole_equipment_10_desc:0 "L'armée de l'air sud-vietnamienne était une grande admiratrice des avions Northrop F-5 Freedom Fighter et Tiger II. Le YF-17 était le successeur de ce programme, mais il s'est finalement révélé infructueux. Et si le Sud-Vietnam avait survécu ? Et si c'était le Sud-Vietnam qui avait réunifié les deux Vietnam ? Aurait-il cherché à se procurer des F/A-18 ?"
 VIE_jet_interceptor_equipment_1:0 "Lockheed F-94 Starfire"
 VIE_jet_interceptor_equipment_1_short:0 "F-94 Starfire"
 VIE_jet_interceptor_equipment_1_desc:0 "Développé à partir du F-80 Shooting Star, le F-94 a été conçu pour remplacer les chasseurs de nuit lourds à hélices F-61 Black Widow et F-82 Twin Mustang. Initialement équipé d'un armement à canon (quatre, puis huit mitrailleuses de 12,7 mm), son armement à canon a été remplacé par un système entièrement composé de roquettes, lancées depuis ses baies internes. Surnommé « Starfire », il allait devenir le premier intercepteur à réaction majeur de l'USAF dans son histoire."
 VIE_jet_interceptor_equipment_2:0 "North American F-86D Sabre Dog"
 VIE_jet_interceptor_equipment_2_short:0 "F-86D Sabre Dog"
 VIE_jet_interceptor_equipment_2_desc:0 "Conçu comme un intercepteur tout temps, le F-86D (initialement désigné F-95) reprenait les performances impressionnantes du F-86 Sabrejet et les améliorait en y ajoutant un radar (qui lui donnait son radôme distinctif), un fuselage plus long et un moteur à postcombustion plus puissant. Initialement équipé d'une baie de lancement interne pour intercepter les bombardiers, les versions ultérieures du « Sabre Dog » étaient équipées de canons."
 VIE_jet_interceptor_equipment_3:0 "Northrop F-89 Scorpion"
 VIE_jet_interceptor_equipment_3_short:0 "F-89 Scorpion"
 VIE_jet_interceptor_equipment_3_desc:0 "Le F-89 (initialement P-89) est un intercepteur tout temps conçu dès le départ pour remplir cette fonction lorsqu'il est entré en service en 1954. Initialement équipé d'un armement à canons, celui-ci a été progressivement remplacé dans la version de série par un armement à roquettes. Plus tard, le « Scorpion » a reçu un atout supplémentaire avec l'introduction d'un armement à missiles, devenant ainsi le premier avion à réaction à utiliser ce type d'armement."
 VIE_jet_interceptor_equipment_4:0 "Convair F-102A Delta Dagger"
 VIE_jet_interceptor_equipment_4_short:0 "F-102A Delta Dagger"
 VIE_jet_interceptor_equipment_4_desc:0 "Premier avion de chasse à réaction à ailes delta des États-Unis, le F-102 fut le premier avion de chasse supersonique utilisé par l'armée de l'air américaine, capable d'atteindre une vitesse de Mach 1. Conçu comme intercepteur et chasseur de bombardiers, il remplaça le F-89 Scorpion et était capable d'abattre les avions ennemis à l'aide de roquettes et de missiles embarqués dans sa soute interne, ce qui en fit le premier avion de chasse à présenter cette caractéristique. Le « Delta Dagger » servit pendant les premières périodes de la guerre du Vietnam comme avion d'escorte de bombardiers et d'attaque au sol."
 VIE_jet_interceptor_equipment_5:0 "McDonnell F-101B Voodoo"
 VIE_jet_interceptor_equipment_5_short:0 "F-101B Voodoo"
 VIE_jet_interceptor_equipment_5_desc:0 "Le F-101, introduit en 1957, était initialement conçu comme un bombardier d'escorte à longue portée ou un chasseur de pénétration pour le Strategic Air Command (SAC) de l'US Air Force. Cela allait changer lorsqu'il devint un chasseur-bombardier à capacité nucléaire pour le Tactical Air Command (TAC). Le « Voodoo » avait une grande autonomie. Depuis ses bases en Allemagne de l'Ouest, il pouvait frapper n'importe quel pays du Pacte de Varsovie et pénétrer directement jusqu'à 800 km à l'intérieur du territoire soviétique."
 VIE_jet_interceptor_equipment_6:0 "Convair F-106A Delta Dart"
 VIE_jet_interceptor_equipment_6_short:0 "F-106A Delta Dart"
 VIE_jet_interceptor_equipment_6_desc:0 "Le F-106 était une version améliorée du F-102 Delta Dagger. Lancé en 1959, le F-106, comme son prédécesseur, n'était pas équipé d'un canon embarqué et dépendait donc de missiles pour engager les bombardiers ennemis. Il était équipé du missile infrarouge AIM-4 et d'un AIM-26 à tête nucléaire. Surnommé « l'intercepteur ultime », le « Delta Dart » transportait ses armes dans une soute interne, une caractéristique qui ne fut reprise sur les avions de chasse qu'à partir de la 5e génération d'avions de chasse à réaction."
 VIE_jet_interceptor_equipment_7:0 "North American F-106A 'Six Shooter'"
 VIE_jet_interceptor_equipment_7_short:0 "F-106A 'Six Shooter'"
 VIE_jet_interceptor_equipment_7_desc:0 "Après son introduction, le F-106 a été progressivement mis à jour en service, avec une avionique améliorée, une aile modifiée présentant un cambrage conique notable, un système de recherche et de poursuite infrarouge, des réservoirs d'aile supersoniques profilés qui n'altéraient pratiquement pas les performances globales de l'avion, une meilleure instrumentation et des équipements tels qu'un réceptacle de ravitaillement en vol et un crochet d'appontage pour les atterrissages d'urgence. Le projet Six Shooter a ajouté un canon M61 Vulcan et un viseur optique."
 VIE_high_mach_jet_interceptor_equipment_2:0 "Lockheed F-104A Starfighter"
 VIE_high_mach_jet_interceptor_equipment_2_short:0 "F-104A Starfighter"
 VIE_high_mach_jet_interceptor_equipment_2_desc:0 "Le F-104 a été conçu pour répondre au souhait des pilotes de disposer d'un avion simple et compact offrant d'excellentes performances. Le résultat fut cet avion, l'un des premiers intercepteurs capables d'atteindre Mach 2 en service dans l'armée américaine. Le « Starfighter » établit de nombreux records de vitesse et d'altitude, mais fut entaché par des controverses politiques et une faible capacité de survie, ce qui lui valut un autre surnom, celui de « Widowmaker » (faiseur de veuves)."
 VIE_high_mach_jet_interceptor_equipment_3:0 "North American F-108 Rapier"
 VIE_jet_CAS_equipment_1:0 "Douglas A-1E Skyraider"
 VIE_jet_CAS_equipment_1_short:0 "A-1E Skyraider"
 VIE_jet_CAS_equipment_1_desc:0 "Sièges côte à côte pour le pilote et le copilote, sans aérofreins"
 VIE_jet_CAS_equipment_2:0 "Douglas A-1H Skyraider"
 VIE_jet_CAS_equipment_2_short:0 "A-1H Skyraider"
 VIE_jet_CAS_equipment_2_desc:0 "Avion d'attaque monoplace équipé de trois aérofreins, poste central prévu pour supporter 3 500 lb (1 600 kg) de munitions, diamètre de 30 pouces (760 mm), éjecteur de bombes combiné de 14 pouces (360 mm) et 30 pouces (760 mm) et directeur de bombardement à basse/haute altitude."
 VIE_jet_CAS_equipment_3:0 "Douglas A-1J Skyraider"
 VIE_jet_CAS_equipment_3_short:0 "A-1J Skyraider"
 VIE_jet_CAS_equipment_3_desc:0 "Le modèle de production final, équipé d'un moteur R-3350-26WB, avec des améliorations structurelles visant à augmenter la résistance à la fatigue des ailes."
 VIE_jet_CAS_equipment_4:0 "Douglas AC-47D Spooky"
 VIE_jet_CAS_equipment_4_short:0 "AC-47D Spooky"
 VIE_jet_CAS_equipment_4_desc:0 "Le Douglas AC-47 Spooky (également surnommé « Puff, le dragon magique ») fut le premier d'une série d'avions de combat à voilure fixe développés par l'armée de l'air américaine pendant la guerre du Vietnam. Il fut conçu pour fournir une puissance de feu supérieure à celle des avions d'attaque au sol légers et moyens dans certaines situations où les forces terrestres avaient besoin d'un appui aérien rapproché."
 VIE_jet_CAS_equipment_5:0 "Fairchild AC-119G Shadow"
 VIE_jet_CAS_equipment_5_short:0 "AC-119G Shadow"
 VIE_jet_CAS_equipment_5_desc:0 "Les Fairchild AC-119G Shadow et AC-119K Stinger étaient des avions de combat bimoteurs à pistons développés par les États-Unis pendant la guerre du Vietnam. Ils ont remplacé les Douglas AC-47 Spooky et ont été utilisés parallèlement aux premières versions de l'avion de combat AC-130 Spectre."
 VIE_jet_CAS_equipment_6:0 "Fairchild AC-119K Stinger"
 VIE_jet_CAS_equipment_6_short:0 "AC-119K Stinger"
 VIE_jet_CAS_equipment_6_desc:0 "Les Fairchild AC-119G Shadow et AC-119K Stinger étaient des avions de combat bimoteurs à pistons développés par les États-Unis pendant la guerre du Vietnam. Ils ont remplacé les Douglas AC-47 Spooky et ont été utilisés parallèlement aux premières versions de l'avion de combat AC-130 Spectre."
 VIE_jet_CAS_equipment_7:0 "Lockheed AC-130A Spectre"
 VIE_jet_CAS_equipment_7_short:0 "AC-130A Spectre"
 VIE_jet_CAS_equipment_7_desc:0 "En 1967, le JC-130A 54-1626 a été sélectionné pour être converti en prototype d'avion de combat AC-130A (projet Gunship II). Les modifications ont été effectuées à la base aérienne Wright-Patterson par la division des systèmes aéronautiques. Un télescope de vision nocturne à vision directe a été installé dans la porte avant, un dispositif infrarouge à vision frontale a été placé dans la partie avant du logement de roue gauche, avec des miniguns et des canons rotatifs fixés vers le bas et vers l'arrière le long du côté gauche."
 VIE_jet_CAS_equipment_8:0 "Lockheed AC-130E Spectre"
 VIE_jet_CAS_equipment_8_short:0 "AC-130E Spectre"
 VIE_jet_CAS_equipment_8_desc:0 "Sept autres avions de combat ont été convertis à la configuration « Plain Jane » comme le prototype AC-130 en 1968, et un avion a reçu la mise à niveau « Surprise Package » en 1969. La mise à niveau Surprise Package comprenait les derniers canons automatiques rotatifs de 20 mm et le canon Bofors de 40 mm, mais pas d'armement de soutien rapproché de 7,62 mm. La configuration Surprise Package a servi de banc d'essai pour les systèmes avioniques et l'armement de l'AC-130E."
 VIE_jet_light_equipment_1:0 "North American Aviation T-28 Trojan"
 VIE_jet_light_equipment_1_short:0 "T-28 Trojan"
 VIE_jet_light_equipment_1_desc:0 "Le North American Aviation T-28 Trojan est un avion d'entraînement militaire à moteur radial utilisé par l'armée de l'air et la marine américaines depuis les années 1950. Outre son utilisation comme avion d'entraînement, le T-28 a été employé avec succès comme avion de contre-insurrection, principalement pendant la guerre du Vietnam. Il a continué à être utilisé dans le civil pour des démonstrations aériennes et des spectacles aériens."
 VIE_jet_light_equipment_2:0 "Cessna O-2 Skymaster"
 VIE_jet_light_equipment_2_short:0 "O-2 Skymaster"
 VIE_jet_light_equipment_2_desc:0 "Le Cessna O-2 Skymaster (surnommé « Oscar Deuce ») est une version militaire du Cessna 337 Super Skymaster, utilisé pour le contrôle aérien avancé (FAC) et les opérations psychologiques (PSYOPS) par l'armée américaine entre 1967 et 2010."
 VIE_jet_light_equipment_3:0 "Northtrop F-5A Freedom Fighter"
 VIE_jet_light_equipment_3_short:0 "F-5A Freedom Fighter"
 VIE_jet_light_equipment_3_desc:0 "Le F-5A a été développé comme un avion de chasse léger destiné principalement à l'exportation. Il est plus léger et moins coûteux à produire que la plupart des autres chasseurs modernes, ce qui le rend idéal pour compléter les escadrons de chasseurs à courte portée. Malgré cela, ce modèle s'est révélé très maniable et était l'avion le plus à même de rivaliser avec le MiG-21 « Fishbed » soviétique. Comme il était utilisé par la majorité des alliés des États-Unis au plus fort de la guerre froide, il a été baptisé à juste titre « Freedom Fighter » (combattant de la liberté)."
 VIE_jet_light_equipment_4:0 "Cessna OA-37B Dragonfly"
 VIE_jet_light_equipment_4_short:0 "OA-37B Dragonfly"
 VIE_jet_light_equipment_4_desc:0 "Le Cessna A-37 Dragonfly, ou Super Tweet, est un avion d'attaque léger américain développé à partir de l'avion d'entraînement de base T-37 Tweet dans les années 1960 et 1970 par Cessna, à Wichita, dans le Kansas. L'A-37 a été introduit pendant la guerre du Vietnam et est resté en service après la fin du conflit."
 VIE_jet_light_equipment_5:0 "North American Rockwell OV-10D Bronco"
 VIE_jet_light_equipment_5_short:0 "OV-10D Bronco"
 VIE_jet_light_equipment_5_desc:0 "Bronco de deuxième génération développé dans le cadre du programme NOGS. Le modèle D était une cellule OV-10A largement modifiée, à laquelle avait été ajouté un système de vision nocturne infrarouge orienté vers l'avant avec une caméra montée sur une tourelle sous un nez allongé, visuellement distinct du nez court et arrondi du modèle A. Le modèle D est également équipé de moteurs plus puissants et d'hélices en fibre de verre plus grandes. D'autres différences externes notables sont les lance-paillettes installés à mi-hauteur des poutres et les tuyaux d'échappement à suppression infrarouge (qui mélangent les gaz d'échappement avec de l'air plus froid afin de réduire la signature thermique de l'avion)."
 VIE_nav_bomber_equipment_4:0 "Lockheed P2V-2 Neptune"
 VIE_nav_bomber_equipment_4_short:0 "P2V-2 Neptune"
 VIE_nav_bomber_equipment_4_desc:0 "Le P2V était un avion de patrouille maritime et anti-sous-marin développé pour remplacer les PV-1 Ventura et PV-2 Harpoon de la Seconde Guerre mondiale. Introduit en 1947 pour la marine américaine, il s'agissait en fait d'un avion basé à terre, et le P2V, rebaptisé P-2 après 1962, n'a jamais effectué d'appontage. Cependant, un petit nombre d'entre eux ont été convertis et déployés à partir de porte-avions comme bombardiers nucléaires de fortune qui devaient atterrir sur la côte ou amerrir, à l'instar des bombardiers utilisés lors du raid de Doolittle pendant la Seconde Guerre mondiale. Son surnom est « Neptune », d'après le dieu romain de la mer."
 VIE_nav_bomber_equipment_5:0 "Lockheed P2V-7 Neptune"
 VIE_nav_bomber_equipment_5_short:0 "P2V-7 Neptune"
 VIE_nav_bomber_equipment_5_desc:0 "Dernière variante Neptune produite par Lockheed, équipée de moteurs R-3350-32W et J-34. Elle était équipée de réservoirs d'extrémité d'aile à faible traînée, d'un radar de recherche AN/APS-20 dans un radôme révisé et d'une verrière bombée. Les premiers appareils étaient équipés de tourelles défensives, mais celles-ci ont été supprimées comme sur le P2V-5."
 VIE_nav_bomber_equipment_6:0 "Lockheed P-3 Orion"
 VIE_nav_bomber_equipment_6_short:0 "P-3A Orion"
 VIE_nav_bomber_equipment_6_desc:0 "Le P-3A (initialement désigné P3V), basé sur l'avion de ligne Lockheed L-188 Electra, a été conçu pour remplacer les anciens P-2 Neptune et P-5 Marlin dans le cadre de missions de patrouille maritime et de lutte anti-sous-marine (ASW) à partir de la terre ferme. Il dispose d'une soute interne pour les torpilles lancées depuis les airs, avec des pylônes sous les ailes pouvant accueillir une multitude d'armes, notamment des missiles antinavires à longue portée, des missiles air-sol, des mines et des grenades sous-marines. Il est également équipé d'un détecteur d'anomalies magnétiques à l'arrière pour détecter les sous-marins à l'aide du champ magnétique terrestre. Avec de tels outils à sa disposition et continuant à remplir son rôle depuis son introduction en 1962, il est tout à fait approprié que cet avion soit surnommé « Orion », le chasseur de navires ennemis."
 VIE_nav_bomber_equipment_7:0 "Lockheed P-3C Orion"
 VIE_nav_bomber_equipment_7_short:0 "P-3C Orion"
 VIE_nav_bomber_equipment_7_desc:0 "Le P-3C était équipé d'une nouvelle suite ASW et d'un ordinateur de mission avec une configuration interne révisée. À l'extérieur, le P-3C était doté d'une échelle d'accès à commande électrique, d'une petite antenne sur le sommet de l'aileron, de rampes de largage de bouées acoustiques sous le fuselage et de trois petites fenêtres à l'arrière droit (une fenêtre à l'avant de la sortie de secours au-dessus de l'aile et deux à l'arrière). Les premiers appareils produits étaient équipés d'une caméra située dans la partie inférieure du radôme. Les appareils produits ultérieurement étaient équipés d'une tourelle IRDS rétractable à la place de la caméra frontale. Au début des années 1980, les caméras frontales existantes ont été remplacées par des tourelles IRDS. Les premiers modèles étaient également connus sous le nom de P-3C « Baseline » ou Non-Update (NUD). Tous les appareils ont ensuite été équipés de deux systèmes de navigation inertielle LTN-72."
 VIE_nav_bomber_equipment_8:0 "Boeing P-8 Poseidon"
 VIE_nav_bomber_equipment_8_short:0 "P-8 Poseidon"
 VIE_nav_bomber_equipment_8_desc:0 "Initialement connu sous le nom de Multimission Maritime Aircraft (MMA), le P-8 a été conçu pour remplacer le vénérable P-3 Orion. Développé à partir du Boeing 737 Next Generation Airliner, le P-8 a été conçu pour la lutte anti-sous-marine et la patrouille maritime. De plus, il peut assurer le soutien électronique (ESM) grâce à sa capacité d'autoprotection et d'alerte précoce (EWSP). Avec des variantes en service aux États-Unis, au Royaume-Uni, en Inde et en Australie depuis son introduction en 2013, le « Poséidon » est en passe de devenir le nouveau roi des mers."
 VIE_jet_tac_bomber_equipment_1:0 "Douglas B-26K Counter Invader"
 VIE_jet_tac_bomber_equipment_1_short:0 "B-26K Counter Invader"
 VIE_jet_tac_bomber_equipment_1_desc:0 "Mark Engineering a converti 40 B-26B ou TB-26B avec deux B-26C et un seul JB-26C ; les modifications comprenaient l'installation de moteurs R-2800-52W de 2 500 ch (1 900 kW) sans cônes d'hélice et la suppression des six mitrailleuses ailées. Au cours des opérations au Vietnam, en mai 1966, les avions ont été réaffectés à l'ancienne désignation d'attaque A-26A. Les A-26A ont été retirés du service en 1969, lorsqu'ils ont atteint la limite de sécurité du temps de vol alloué."
 VIE_jet_tac_bomber_equipment_2:0 "Martin B-57A Canberra"
 VIE_jet_tac_bomber_equipment_2_short:0 "B-57A Canberra"
 VIE_jet_tac_bomber_equipment_2_desc:0 "Le « Canberra » est une version américaine du bombardier anglais du même nom. Il est idéal pour les frappes tactiques et la reconnaissance. Son retrait dans les années 1980 marquera la fin de l'ère des bombardiers tactiques."
 VIE_jet_tac_bomber_equipment_3:0 "Martin B-57B Canberra"
 VIE_jet_tac_bomber_equipment_3_short:0 "B-57B Canberra"
 VIE_jet_tac_bomber_equipment_3_desc:0 "Le B-57B définitif, qui intégrait de nombreuses améliorations, effectua son premier vol le 18 juin 1954. Au départ, l'avion souffrait des mêmes problèmes de moteur que les RB-57A et plusieurs appareils furent perdus lors d'opérations à basse altitude et à grande vitesse en raison d'un actionneur de stabilisateur défectueux qui provoquait le piqué de l'avion vers le sol. L'USAF en est venue à considérer le B-57B comme inadéquat pour le rôle d'intrus nocturne et Martin a donc procédé à une mise à niveau avionique complète de tous les appareils en réponse à cela."
 VIE_jet_tac_bomber_equipment_4:0 "Martin B-57C Canberra"
 VIE_jet_tac_bomber_equipment_4_short:0 "B-57C Canberra"
 VIE_jet_tac_bomber_equipment_4_desc:0 "Variante à double commande. Le « Canberra » est une version américaine du bombardier anglais du même nom. Il est idéal pour les frappes tactiques et la reconnaissance. Son retrait dans les années 1980 marquera la fin de l'ère des bombardiers tactiques."
 VIE_jet_tac_bomber_equipment_5:0 "Martin B-57E 'Patricia Lynn' Canberra"
 VIE_jet_tac_bomber_equipment_5_short:0 "B-57E 'Patricia Lynn'"
 VIE_jet_tac_bomber_equipment_5_desc:0 "Bien que conçus comme des bombardiers et n'ayant jamais été déployés auparavant par l'USAF dans une zone de combat, les premiers B-57 déployés au Sud-Vietnam n'ont pas été utilisés dans un rôle offensif. Le besoin de moyens de reconnaissance supplémentaires, en particulier ceux capables d'opérer de nuit, a conduit au déploiement de deux avions RB-57E le 15 avril 1963. L'USAF avait attribué à General Dynamics un contrat pour modifier deux B-57E Canberra (55-4243, 55-4245) en avions de reconnaissance stratégique tout temps à haute altitude. Dans le cadre du projet Patricia Lynn, ces avions assuraient une couverture infrarouge à l'aide de leurs caméras Reconofax VI."
 VIE_jet_tac_bomber_equipment_6:0 "Martin B-57G 'Tropic Moon III' Canberra"
 VIE_jet_tac_bomber_equipment_6_short:0 "B-57G 'Tropic Moon III'"
 VIE_jet_tac_bomber_equipment_6_desc:0 "Les B-57 sont revenus en Asie du Sud-Est sous la forme du Tropic Moon III B-57G, déployé en Thaïlande à l'automne 1970. Conçus comme des intrus nocturnes pour aider à combattre les mouvements le long de la piste Ho Chi Minh, ces avions étaient équipés d'une variété de nouveaux capteurs et d'autres équipements, et étaient capables de larguer des munitions guidées par laser."
 VIE_jet_tac_bomber_equipment_7:0 "General Dynamics F-111G-AUP Aardvark"
 VIE_jet_tac_bomber_equipment_7_short:0 "F-111G-AUP Aardvark"
 VIE_jet_tac_bomber_equipment_7_desc:0 "Dans les années 1990, les avions F-111C ont subi une mise à niveau avionique numérique complète (connue sous le nom d'AUP) qui a introduit de nouveaux systèmes de navigation/attaque (système de ciblage laser/infrarouge PAVE TACK) et des ordinateurs de contrôle de vol."
 VIE_jet_tac_bomber_equipment_8:0 "Boeing F-15E Advanced Eagle"
 VIE_jet_tac_bomber_equipment_8_short:0 "F-15E Advanced Eagle"
 VIE_jet_tac_bomber_equipment_8_desc:0 "La variante F-15 Advanced Eagle est une version améliorée des modèles précédents, dans la mesure où elle dispose de deux points d'emport supplémentaires sous les ailes (portant leur nombre de neuf à onze) ; d'un cockpit avec écran grand format en option ; de commandes de vol électriques ; d'un radar à balayage électronique actif (AESA) Raytheon AN/APG-82(V)1 ou AN/APG-63(V)3 ; des moteurs General Electric F110-129 ; des systèmes numériques de guidage montés sur casque dans les deux cockpits ; et un système numérique de guerre électronique, entre autres améliorations."
 VIE_jet_strat_bomber_equipment_1:0 "Convair B-36 Peacemaker"
 VIE_jet_strat_bomber_equipment_1_short:0 "B-36 Peacemaker"
 VIE_jet_strat_bomber_equipment_1_desc:0 "Le B-36 était le plus gros bombardier à hélices jamais mis en service lorsqu'il a été lancé en 1948. Sa taille imposante lui permettait, sans modification du châssis ou des bombes, de transporter n'importe quelle bombe nucléaire dont disposaient les États-Unis à l'époque. Cependant, l'avènement des avions à réaction dans la guerre signifiait que ce type d'appareil serait rapidement remplacé par les B-47 et B-52. Contrairement à l'opinion populaire, le B-36 n'a pas de surnom officiel, mais la société et bon nombre de ses pilotes qui appréciaient ce type d'appareil l'appelaient « Peacemaker » (faiseur de paix)."
 VIE_jet_strat_bomber_equipment_2:0 "Boeing B-47 Stratojet"
 VIE_jet_strat_bomber_equipment_2_short:0 "B-47 Stratojet"
 VIE_jet_strat_bomber_equipment_2_desc:0 "Le B-47, baptisé « Stratojet », est un bombardier subsonique à six moteurs qui vole à haute altitude pour éviter les intercepteurs ennemis. Avec ses moteurs logés dans des nacelles sous ses ailes en flèche, le B-47 a constitué une innovation majeure dans la conception des avions de combat à réaction après la Seconde Guerre mondiale et a contribué au développement des avions de ligne à réaction modernes."
 VIE_jet_strat_bomber_equipment_3:0 "Boeing B-52D Stratofortress"
 VIE_jet_strat_bomber_equipment_3_short:0 "B-52D Stratofortress"
 VIE_jet_strat_bomber_equipment_3_desc:0 "Le B-52 est un gros bombardier subsonique à longue portée capable d'effectuer de longues missions au-dessus du territoire ennemi. Grâce à ses performances supérieures à des vitesses subsoniques élevées et à ses coûts d'exploitation relativement faibles, le « Stratofortress » est resté en service malgré l'arrivée d'avions plus récents et plus perfectionnés."
 VIE_jet_strat_bomber_equipment_4:0 "Boeing B-52G Stratofortress"
 VIE_jet_strat_bomber_equipment_4_short:0 "B-52G Stratofortress"
 VIE_jet_strat_bomber_equipment_4_desc:0 "La variante G du B-52 dispose d'un système électronique et avionique amélioré, ainsi que d'une charge utile plus importante. Cette variante offre également une plus grande autonomie grâce à une refonte de la structure permettant d'augmenter la capacité en carburant. Grâce à cette modification et à d'autres améliorations, le « Stratofortress » continuera à servir de plate-forme de bombardement de premier plan jusqu'en 2050."
 VIE_jet_strat_bomber_equipment_5:0 "Boeing B-52H"
 VIE_jet_strat_bomber_equipment_5_short:0 "B-52H Stratofortress"
 VIE_jet_strat_bomber_equipment_5_desc:0 "Le B-52H a subi les mêmes modifications structurelles et d'équipage que le B-52G. La mise à niveau la plus importante a été le passage aux turboréacteurs TF33-P-3 qui, malgré des problèmes de fiabilité initiaux (corrigés en 1964 dans le cadre du programme Hot Fan), offraient des performances et une économie de carburant nettement supérieures à celles des turboréacteurs J57. L'ECM et l'avionique ont été mis à jour, un nouveau système de contrôle de tir a été installé et l'armement défensif arrière est passé de mitrailleuses à un canon M61 Vulcan de 20 mm."
 VIE_cv_CAS_equipment_1:0 "Northrop BT"
 VIE_cv_CAS_equipment_1_short:0 "Northrop BT"
 VIE_cv_CAS_equipment_1_desc:0 "Le Northrop BT a été développé en 1935, alors que Northrop était une filiale de Douglas Aircraft Corporation. Premier avion à train d'atterrissage tricycle fixe à atterrir sur un porte-avions, ce modèle a ensuite été développé par Douglas pour devenir le bombardier en piqué SBD Dauntless."
 VIE_cv_jet_CAS_equipment_1:0 "Douglas AD-1 Skyraider"
 VIE_cv_jet_CAS_equipment_1_short:0 "AD-1 Skyraider"
 VIE_cv_jet_CAS_equipment_1_desc:0 "Le Douglas A-1 Skyraider (anciennement AD Skyraider) est un avion d'attaque monoplace américain qui a été utilisé entre la fin des années 1940 et le début des années 1980. Le Skyraider a connu une carrière remarquablement longue et fructueuse ; il est devenu un anachronisme à moteur à pistons et à hélice à l'ère des avions à réaction, et a été surnommé « Spad »."
 VIE_cv_jet_CAS_equipment_2:0 "Douglas AD-4 Skyraider"
 VIE_cv_jet_CAS_equipment_2_short:0 "AD-4 Skyraider"
 VIE_cv_jet_CAS_equipment_2_desc:0 "Train d'atterrissage renforcé, radar amélioré, compas G-2, équipement anti-G, quatre canons de 20 mm (0,79 pouce) et 14 lance-roquettes Aero, capable de transporter jusqu'à 50 lb (23 kg) de bombes."
 VIE_cv_jet_CAS_equipment_3:0 "Douglas A-3B Skywarrior"
 VIE_cv_jet_CAS_equipment_3_short:0 "A-3B Skywarrior"
 VIE_cv_jet_CAS_equipment_3_desc:0 "Version définitive du bombardier de série, avec une cellule plus robuste, des moteurs plus puissants, une surface alaire légèrement plus grande (75 m² contre 72 m²), et la possibilité d'installer un système de ravitaillement en vol pour le rôle de ravitailleur. Les 21 derniers exemplaires construits étaient équipés du nouveau système de bombardement AN/ASB-7, d'un nez redessiné et d'une tourelle arrière supprimée au profit d'un équipement de guerre électronique."
 VIE_cv_jet_CAS_equipment_4:0 "Douglas A-4B Skyhawk"
 VIE_cv_jet_CAS_equipment_4_short:0 "A-4B Skyhawk"
 VIE_cv_jet_CAS_equipment_4_desc:0 "L'A-4B est un avion d'attaque léger monomoteur capable de transporter la même charge de bombes qu'un B-17 malgré sa taille plus petite. Utilisé par plusieurs forces aériennes et aéronavales depuis son introduction en 1954, il a subi de nombreuses modifications et modernisations au cours de ses plus de 60 ans de service, et continue à être utilisé dans de nombreux pays à ce jour. Son surnom est « Skyhawk »."
 VIE_cv_jet_CAS_equipment_5:0 "Douglas A-4E Skyhawk"
 VIE_cv_jet_CAS_equipment_5_short:0 "A-4E Skyhawk"
 VIE_cv_jet_CAS_equipment_5_desc:0 "Mise à niveau majeure, comprenant un nouveau moteur Pratt &amp; Whitney J52-P-6A d'une poussée de 8 400 lbf (37 kN), une cellule renforcée avec deux pylônes d'armes supplémentaires (pour un total de cinq), une avionique améliorée, avec TACAN, radar de navigation Doppler, altimètre radar, ordinateur de bombardement en piqué et système de bombardement à basse altitude AJB-3A. Beaucoup ont ensuite été modernisés avec un moteur J52-P-8 développant une poussée de 9 300 lbf (41 kN)."
 VIE_cv_jet_CAS_equipment_6:0 "Douglas A-4F Skyhawk"
 VIE_cv_jet_CAS_equipment_6_short:0 "A-4F Skyhawk"
 VIE_cv_jet_CAS_equipment_6_desc:0 "Amélioration de l'A-4E avec des équipements avioniques supplémentaires logés dans une bosse sur le dos du fuselage (cette caractéristique a ensuite été ajoutée aux A-4E et à certains A-4C), des spoilers sur le dessus des ailes pour réduire la distance d'atterrissage, un système de direction du train avant et un moteur J52-P-8A plus puissant avec une poussée de 9 300 lbf (41 kN), remplacé plus tard en service par le J52-P-408 avec une poussée de 11 200 lbf (50 kN)."
 VIE_cv_jet_CAS_equipment_7:0 "LTV A-7A Corsair II"
 VIE_cv_jet_CAS_equipment_7_short:0 "A-7A Corsair II"
 VIE_cv_jet_CAS_equipment_7_desc:0 "Développé à partir du F-8 Crusader, le « Corsair II » (nommé d'après le F4U Corsair) est un avion d'attaque léger monoplace, subsonique et embarqué, doté d'une charge utile et d'une autonomie supérieures à celles de l'A-4 Skyhawk qu'il a remplacé. Il a ensuite été utilisé par l'armée de l'air américaine, remplaçant les vénérables A-1 Skyraider et F-100 Super Sabre, devenant ainsi l'un des rares avions d'attaque au sol à servir à la fois dans la marine et dans l'armée de l'air."
 VIE_cv_jet_CAS_equipment_8:0 "LTV A-7B Corsair II"
 VIE_cv_jet_CAS_equipment_8_short:0 "A-7B Corsair II"
 VIE_cv_jet_CAS_equipment_8_desc:0 "Moteur TF30-P-8 amélioré avec une poussée de 12 190 lbf (54,2 kN). En 1971, les A-7B encore en service ont été équipés du moteur TF30-P-408 développant une poussée de 13 390 lbf (59,6 kN) ; le radar de suivi de terrain AN/APQ-115 des premiers A-7A a été remplacé par le radar de suivi de terrain AN/APQ-116."
 VIE_cv_jet_CAS_equipment_9:0 "LTV A-7E Corsair II"
 VIE_cv_jet_CAS_equipment_9_short:0 "A-7E Corsair II"
 VIE_cv_jet_CAS_equipment_9_desc:0 "Il s'agit en fait d'un A-7D modifié pour les opérations navales, équipé du même moteur Allison TF41-A-1 et du même canon rotatif M61 Vulcan de 20 mm, mais doté d'un radar de navigation AN/APN-190 et d'un radar de suivi du terrain AN/APQ-128 encore améliorés, ainsi que d'un dispositif d'appontage et d'ailes repliables pour permettre les opérations sur porte-avions."
 VIE_cv_jet_CAS_equipment_10:0 "McDonnell Douglas F/A-18B Hornet"
 VIE_cv_jet_CAS_equipment_10_short:0 "F/A-18B Hornet"
 VIE_cv_jet_CAS_equipment_10_desc:0 "Développé à partir du prototype YF-17 Cobra de l'USAF, le « Hornet » fait partie d'une nouvelle génération d'avions polyvalents qui combinent les dernières avancées en matière de technologies informatiques avec une vitesse et une agilité élevées pour offrir des performances de combat inégalées. En raison du nombre limité d'avions qu'un porte-avions peut accueillir, le « Hornet » basé sur porte-avions a été conçu comme un avion multirôle capable d'effectuer des missions air-air et air-sol. Le B est une version biplace d'attaque au sol."
 VIE_cv_jet_multirole_equipment_1:0 "McDonnell Douglas F2H Banshee"
 VIE_cv_jet_multirole_equipment_1_short:0 "F2H Banshee"
 VIE_cv_jet_multirole_equipment_1_desc:0 "Le McDonnell F2H Banshee était un avion de chasse à réaction monoplace basé sur porte-avions, utilisé par la marine américaine et le corps des Marines des États-Unis de 1948 à 1961. Il fut l'un des principaux chasseurs américains utilisés pendant la guerre de Corée et le seul chasseur à réaction utilisé par la Marine royale canadienne."
 VIE_cv_jet_multirole_equipment_2:0 "Grumman F9F Panther"
 VIE_cv_jet_multirole_equipment_2_short:0 "F9F Panther"
 VIE_cv_jet_multirole_equipment_2_desc:0 "Le F9F a été initialement conçu comme un avion à réaction à ailes droites embarqué sur porte-avions, introduit en 1949. L'un des premiers avions à réaction embarqués utilisés par la marine américaine, il a été le principal avion d'attaque au sol de l'USN et de l'USMC pendant la guerre de Corée, effectuant 78 000 sorties, et a été crédité de la première victoire aérienne d'un chasseur de la marine américaine pendant la guerre. Sa structure robuste lui permettait de mener des opérations d'attaque au sol, même sous le feu antiaérien. Le F9F (rebaptisé plus tard F-9) a également servi dans les Blue Angels, devenant le premier avion à réaction utilisé par l'équipe. Conformément à la tradition de Grumman qui consiste à donner aux avions des noms de grands félins, cet avion est connu sous le nom de « Panther » (panthère)."
 VIE_cv_jet_multirole_equipment_3:0 "McDonnell F3H Demon"
 VIE_cv_jet_multirole_equipment_3_short:0 "F3H Demon"
 VIE_cv_jet_multirole_equipment_3_desc:0 "Le F3H était un chasseur subsonique à ailes en flèche qui a connu de nombreux problèmes tout au long de sa carrière. Initialement prévu pour être équipé du moteur J40, des problèmes liés à la conception du prototype ont conduit à l'annulation de ce moteur et le F3H a été équipé d'un moteur moins puissant à la place. Malgré ses problèmes, le Demon était un intercepteur tout temps performant, offrant une bonne visibilité pour l'époque. Initialement armé de quatre canons de 20 mm, un modèle ultérieur fut équipé des premiers exemplaires de ce qui allait devenir le missile infrarouge AIM-9 Sidewinder et le missile air-air semi-actif AAM-N-2 (plus tard AIM-7) Sparrow. Conformément aux conventions de dénomination de McDonnell, son surnom officiel est « Demon »."
 VIE_cv_jet_multirole_equipment_4:0 "Vought F-8 Crusader"
 VIE_cv_jet_multirole_equipment_4_short:0 "F-8 Crusader"
 VIE_cv_jet_multirole_equipment_4_desc:0 "Chasseur supersonique monomoteur destiné à assurer la supériorité aérienne, le F-8 (initialement connu sous le nom de F8U) a été conçu pour la défense aérienne rapprochée des flottes. Cet avion transporte une charge utile de munitions plus importante que le F11F Tiger ou le F7U Cutlass (qu'il a remplacé), et peut également servir de plate-forme de reconnaissance photographique rapide. Surnommé « Crusader », il était l'un des chasseurs de supériorité aérienne à conserver son armement interne au moment de la guerre du Vietnam, ce qui lui a valu un autre surnom, « The Last Gunfighter » (le dernier chasseur à armement)."
 VIE_cv_jet_multirole_equipment_5:0 "McDonnell Douglas F-4B Phantom II"
 VIE_cv_jet_multirole_equipment_5_short:0 "F-4B Phantom II"
 VIE_cv_jet_multirole_equipment_5_desc:0 "Avion de chasse et d'attaque au sol biplace, tout temps, basé sur porte-avions, destiné à la marine américaine et au corps des Marines. Moteurs J79-GE-8A ou -8B avec une poussée de 16 950 lbf (75,4 kN) chacun en postcombustion. Surnommé « Phantom II » (en référence au FH Phantom), le F-4 Phantom II fut le premier avion utilisé conjointement par les trois branches des forces armées américaines, à savoir la marine, le corps des Marines et l'armée de l'air."
 VIE_cv_jet_multirole_equipment_6:0 "McDonnell Douglas F-4J Phantom II"
 VIE_cv_jet_multirole_equipment_6_short:0 "F-4J Phantom II"
 VIE_cv_jet_multirole_equipment_6_desc:0 "Version améliorée du F-4B pour l'US Navy et le Marine Corps, mettant l'accent sur l'amélioration des capacités de combat air-air, notamment : moteurs J79-GE-10 avec une poussée de 17 844 lbf (79,374 kN) chacun en postcombustion, radar Doppler à impulsions AN/APG-59 couplé au système de contrôle de tir AN/AWG-10 pour une capacité de tir vers le bas, des roues de train d'atterrissage principales plus grandes, entraînant des renflements des ailes similaires à ceux du F-4C, un empennage à volets, des ailerons inclinés à 16,5° lorsque le train d'atterrissage et les volets étaient déployés pour réduire la vitesse d'atterrissage, des sièges éjectables zéro-zéro, une capacité d'attaque au sol étendue, aucun capteur IRST sous le nez."
 VIE_cv_jet_multirole_equipment_7:0 "McDonnell Douglas F-4N Phantom II"
 VIE_cv_jet_multirole_equipment_7_short:0 "F-4N Phantom II"
 VIE_cv_jet_multirole_equipment_7_desc:0 "F-4B modernisé dans le cadre du projet Bee Line, mêmes améliorations aérodynamiques que le F-4J, moteurs sans fumée et cellule renforcée."
 VIE_cv_jet_multirole_equipment_8:0 "McDonnell Douglas F-4S Phantom II"
 VIE_cv_jet_multirole_equipment_8_short:0 "F-4S Phantom II"
 VIE_cv_jet_multirole_equipment_8_desc:0 "F-4J modernisé avec des moteurs sans fumée, une cellule renforcée et des volets de bord d'attaque pour une meilleure maniabilité. Premier vol en juillet 1977."
 VIE_cv_jet_multirole_equipment_10:0 "McDonnell Douglas F/A-18A Hornet"
 VIE_cv_jet_multirole_equipment_10_short:0 "F/A-18A Hornet"
 VIE_cv_jet_multirole_equipment_10_desc:0 "Développé à partir du prototype YF-17 Cobra de l'USAF, le « Hornet » fait partie d'une nouvelle génération d'avions polyvalents qui combinent les dernières avancées en matière de technologies informatiques avec une vitesse et une agilité élevées pour offrir des performances de combat inégalées. En raison du nombre limité d'avions qu'un porte-avions peut accueillir, le « Hornet » basé sur porte-avions a été conçu comme un avion multirôle capable d'effectuer des missions air-air et air-sol."
 VIE_jump_jet_equipment_1:0 "Hawker Siddeley AV-8A Harrier"
 VIE_jump_jet_equipment_1_short:0 "AV-8A Harrier"
 VIE_jump_jet_equipment_1_desc:0 "Cet avion d'attaque a été développé pour faire du VTOL (décollage et atterrissage verticaux) une réalité. Il présente une conception unique avec des ailes montées en hauteur et quatre tuyères rotatives. Cela lui permet d'opérer dans des espaces restreints tels que les porte-avions légers et les petits aérodromes. Cet avion est communément appelé « Harrier ». Développé en Grande-Bretagne, l'AV-8A est connu dans ce pays sous le nom de Harrier Mk. 50 et fonctionnait de manière similaire aux Harrier GR.1 de la Royal Air Force."
 VIE_jump_jet_equipment_2:0 "Hawker Siddeley AV-8C Harrier"
 VIE_jump_jet_equipment_2_short:0 "AV-8C Harrier"
 VIE_jump_jet_equipment_2_desc:0 "La variante « C » est une version améliorée de l'AV-8A et fonctionne avec des systèmes similaires à ceux du Harrier GR.3, avec un nouvel équipement ECM et un système de navigation inertielle."
 VIE_jump_jet_equipment_3:0 "McDonnell Douglas AV-8B Harrier II"
 VIE_jump_jet_equipment_3_short:0 "AV-8B Harrier II"
 VIE_jump_jet_equipment_3_desc:0 "Le Harrier II est un projet conjoint anglo-américain conçu par McDonnell Douglas en collaboration avec British Aerospace. En service dans le Corps des Marines des États-Unis depuis 1985, le « Harrier II » a été considéré comme un outil important dans de nombreux conflits américains récents."
 VIE_jump_jet_equipment_4:0 "McDonnell Douglas AV-8B Harrier II Plus"
 VIE_jump_jet_equipment_4_short:0 "AV-8B Harrier II Plus"
 VIE_jump_jet_equipment_4_desc:0 "Version améliorée de l'AV-8B, l'AV-8B Plus est équipé d'un moteur plus puissant, d'un système radar et d'une caméra infrarouge, ce qui en fait un excellent avion d'attaque nocturne."
 VIE_recon_equipment_0:0 "Morane 500 Criquet"
 VIE_recon_equipment_0_short:0 "Criquet"
 VIE_recon_equipment_0_desc:0 "Immédiatement après la libération de la France en 1944, la production du Fi 156 à l'usine Morane-Saulnier a été poursuivie à la demande de l'Armée de l'Air et désignée MS 500 pour le lot d'avions produits avec le stock restant de moteurs Argus V8 inversés refroidis par air. D'autres modifications et l'utilisation de différents moteurs (en ligne et radiaux) sont connues sous différents numéros de type."
 VIE_jet_recon_equipment_0:0 "Cessna O-1 Bird Dog"
 VIE_jet_recon_equipment_0_short:0 "O-1 Bird Dog"
 VIE_jet_recon_equipment_0_desc:0 "The Cessna L-19/O-1 Bird Dog is a liaison and observation aircraft. It was the first all-metal fixed-wing aircraft ordered for and by the United States Army following the Army Air Forces' separation from it in 1947. The Bird Dog had a lengthy career in the U.S. military, as well as in other countries. "
 VIE_jet_recon_equipment_1:0 "Northrop RF-5A"
 VIE_jet_recon_equipment_1_short:0 "RF-5A"
 VIE_jet_recon_equipment_1_desc:0 "Version de reconnaissance monoplace du chasseur F-5A."
 VIE_jet_recon_equipment_2:0 "Boeing EA-18G Growler"
 VIE_jet_recon_equipment_2_short:0 "EA-18G Growler"
 VIE_jet_recon_equipment_2_desc:0 "Le Boeing EA-18G Growler est un avion américain de guerre électronique embarqué, une version spécialisée du F/A-18F Super Hornet biplace."
 VIE_transport_plane_equipment_1:0 "Douglas C-47 Skytrain"
 VIE_transport_plane_equipment_1_short:0 "C-47 Skytrain"
 VIE_transport_plane_equipment_1_desc:0 "Développé à partir de l'avion de ligne Douglas DC-3 lors de son premier vol en 1941, le C-47 était l'avion de transport par excellence utilisé par les Alliés. Pendant la Seconde Guerre mondiale, les forces armées de nombreux pays ont utilisé le C-47 et des DC-3 modifiés pour le transport de troupes, de marchandises et de blessés. Plus de 10 000 unités, tant des C-47 que des R4D (plus tard C-117), la variante navale, ont été construites pour la guerre, et de nombreux « Skytrains » ont été utilisés non seulement pour le transport de troupes et de marchandises, mais aussi pour les opérations de recherche et de sauvetage et, pendant la guerre du Vietnam, comme premiers hélicoptères de combat."
 VIE_transport_plane_equipment_2:0 "Fairchild C-119 Flying Boxcar"
 VIE_transport_plane_equipment_2_short:0 "C-119 Flying Boxcar"
 VIE_transport_plane_equipment_2_desc:0 "Le Fairchild C-119 Flying Boxcar (désignation R4Q par la marine et le corps des Marines) était un avion de transport militaire américain développé à partir du Fairchild C-82 Packet de la Seconde Guerre mondiale, conçu pour transporter du fret, du personnel, des blessés et du matériel mécanisé, et pour larguer du fret et des troupes par parachute."
 VIE_transport_plane_equipment_3:0 "Fairchild C-119G Flying Boxcar"
 VIE_transport_plane_equipment_3_short:0 "C-119G Flying Boxcar"
 VIE_transport_plane_equipment_3_desc:0 "Comme le C-119F avec des hélices différentes, 480 exemplaires ont été construits, certains convertis à partir de C-119F construits par Fairchild ou Kaiser. Le Fairchild C-119 Flying Boxcar (désignation R4Q de la marine et du corps des marines) était un avion de transport militaire américain développé à partir du Fairchild C-82 Packet de la Seconde Guerre mondiale, conçu pour transporter du fret, du personnel, des blessés et du matériel mécanisé, et pour larguer du fret et des troupes par parachute."
 VIE_transport_plane_equipment_4:0 "Lockheed C-130A Hercules"
 VIE_transport_plane_equipment_4_short:0 "C-130A Hercules"
 VIE_transport_plane_equipment_4_desc:0 "Développé en 1954, le C-130 est un avion de transport capable d'utiliser des pistes non préparées pour décoller et atterrir, ce qui en fait un appareil pratique pour le transport de troupes et de marchandises ainsi que pour l'évacuation médicale. Mais ce qui vaut à cet avion son surnom d'« Hercules », c'est qu'il existe plusieurs sous-variantes développées pour divers rôles, notamment comme avion de combat (AC-130 Spooky &amp; Spectre), drone de contrôle (DC-130), brouilleur et PSYOPS (EC-130 Compass Call) et reconnaissance météorologique (WC-130). Une machine véritablement polyvalente qui mérite bien son surnom."
 VIE_transport_plane_equipment_5:0 "De Havilland Canada C-7A Caribou"
 VIE_transport_plane_equipment_5_short:0 "C-7A Caribou"
 VIE_transport_plane_equipment_5_desc:0 "Semblable au DHC-4, mais cette version avait une masse au décollage accrue."
 VIE_transport_plane_equipment_6:0 "Lockheed C-130E Hercules"
 VIE_transport_plane_equipment_6_short:0 "C-130E Hercules"
 VIE_transport_plane_equipment_7:0 "Lockheed C-130H Hercules"
 VIE_transport_plane_equipment_7_short:0 "C-130H Hercules"
 VIE_transport_plane_equipment_8:0 "Lockheed C-130H-30 Hercules"
 VIE_transport_plane_equipment_8_short:0 "C-130H-30 Hercules"
 VIE_transport_plane_equipment_10:0 "Lockheed C-130J Hercules"
 VIE_transport_plane_equipment_10_short:0 "C-130J Hercules"
 VIE_naval_helicopter_equipment_1:0 "Bell HTL-4 Sioux"
 VIE_naval_helicopter_equipment_1_short:0 "HTL-4 Sioux"
 VIE_naval_helicopter_equipment_1_desc:0 "Le HTL était un hélicoptère léger monomoteur à rotor unique dérivé du Bell 47A civil. Acheté par la marine américaine en 1947, le HTL-4 (variante désignée par la marine) se distinguait de ceux utilisés par les autres branches par la suppression du revêtement en tissu sur le longeron de queue. Sinon, il conservait bon nombre de ses caractéristiques, notamment la verrière distinctive en forme de « bulle de savon » offrant au pilote une large vue. Il fut plus tard désigné TH-13L. Son surnom, donné en référence aux tribus amérindiennes, est « Sioux »."
 VIE_naval_helicopter_equipment_2:0 "Sikorsky HSS-1 Seabat"
 VIE_naval_helicopter_equipment_2_short:0 "HSS-1 Seabat"
 VIE_naval_helicopter_equipment_2_desc:0 "Le HSS est la variante anti-sous-marine du S-58 de Sikorsky, une version améliorée du S-55 (et du H-19 Chickasaw militaire). Il avait un nez plus petit, mais avec un fuselage arrière et un train d'atterrissage à roue arrière, plutôt que la configuration à queue haute et à quatre montants de son prédécesseur. Rebaptisé plus tard SH-34G, les variantes anti-sous-marines de cet hélicoptère ont reçu le surnom officiel de « Seabat »."
 VIE_naval_helicopter_equipment_3:0 "Kaman SH-2D Seasprite"
 VIE_naval_helicopter_equipment_3_short:0 "SH-2D Seasprite"
 VIE_naval_helicopter_equipment_3_desc:0 "Introduit au début des années 1960 en remplacement du SH-34 Seabat, le SH-2 (initialement désigné HU2K) fut le premier hélicoptère anti-sous-marin capable d'être déployé sur des navires américains autres que des porte-avions. Cette portabilité prolongea la carrière du « Seasprite » et des variantes améliorées virent le jour. La variante représentée dans le jeu est la variante « D », la variante anti-sous-marine initiale."
 VIE_naval_helicopter_equipment_4:0 "Sikorsky SH-3A Sea King"
 VIE_naval_helicopter_equipment_4_short:0 "SH-3A Sea King"
 VIE_naval_helicopter_equipment_4_desc:0 "Dérivé du Sikorsky S-61 civil, le SH-3 (désignation originale HSS-2) est un hélicoptère de lutte anti-sous-marine (ASM) bimoteur. Premier hélicoptère amphibie au monde, il pouvait décoller aussi bien de la terre que de la mer. Avec le Seasprite, il fut également l'un des premiers hélicoptères ASM à utiliser des turbomoteurs. Outre ses missions ASM, le SH-3 était aussi utilisé pour la recherche et le sauvetage (SAR), le transport, l'évacuation sanitaire et la détection aéroportée (AEW). Plusieurs exemplaires furent même utilisés comme « Marine One », l'hélicoptère de transport officiel des présidents américains. C'est pourquoi il gagna le surnom de « Roi des mers », considéré comme l'un des hélicoptères les plus polyvalents au monde."
 VIE_naval_helicopter_equipment_5:0 "Sikorsky SH-3D Sea King"
 VIE_naval_helicopter_equipment_5_short:0 "SH-3D Sea King"
 VIE_naval_helicopter_equipment_5_desc:0 "Dérivé du Sikorsky S-61 civil, le SH-3 (désignation originale HSS-2) est un hélicoptère de lutte anti-sous-marine (ASM) bimoteur. Premier hélicoptère amphibie au monde, il pouvait décoller aussi bien de la terre que de la mer. Avec le Seasprite, il fut également l'un des premiers hélicoptères ASM à utiliser des turbomoteurs. Outre ses missions ASM, le SH-3 était aussi utilisé pour la recherche et le sauvetage (SAR), le transport, l'évacuation sanitaire et la détection aéroportée (AEW). Plusieurs exemplaires furent même utilisés comme « Marine One », l'hélicoptère de transport officiel des présidents américains. C'est pourquoi il gagna le surnom de « Roi des mers », considéré comme l'un des hélicoptères les plus polyvalents au monde."
 VIE_naval_helicopter_equipment_6:0 "Sikorsky SH-60F Seahawk"
 VIE_naval_helicopter_equipment_6_short:0 "SH-60F Seahawk"
 VIE_naval_helicopter_equipment_6_desc:0 "Le SH-60F servait principalement d'appareil de lutte anti-sous-marine (ASW) au groupe aéronaval. L'hélicoptère traquait les sous-marins à l'aide de son sonar à immersion AQS-13F et était équipé d'un lanceur de bouées acoustiques à 6 tubes. Le SH-60F est officieusement baptisé « Oceanhawk ». Le SH-60F peut transporter des torpilles Mk 46, Mk 50 ou Mk 54 comme armes offensives, et dispose d'un choix de mitrailleuses montées sur le fuselage, notamment les M60D, M240D et GAU-16 (calibre .50) pour l'autodéfense."
 VIE_naval_helicopter_equipment_7:0 "Sikorsky MH-60R Seahawk"
 VIE_naval_helicopter_equipment_7_short:0 "MH-60R Seahawk"
 VIE_naval_helicopter_equipment_7_desc:0 "Le MH-60R Seahawk est une version améliorée du SH-60 Seahawk. Développé en 1993, le MH-60R a été conçu pour combiner les caractéristiques des anciens SH-60B et SH-60F. Ses capteurs comprennent le pack ASE, le MTS-FLIR, le radar multimode/interrogateur IFF AN/APS-147, une liaison de données aérienne avancée et un sonar actif aérien plus perfectionné. Ces équipements, associés à un système d'armement amélioré (lui permettant de transporter la torpille avancée Mk 54 et les missiles AGM-114 Hellfire), confèrent au « Seahawk » une plus grande flexibilité dans les opérations anti-navales et d'assaut amphibie."
 VIE_attack_helicopter_equipment_1:0 "Bell UH-1C Gunship"
 VIE_attack_helicopter_equipment_1_short:0 "UH-1C Gunship"
 VIE_attack_helicopter_equipment_1_desc:0 "Au cours de la guerre, l'UH-1 a subi plusieurs améliorations. Les modèles UH-1A, B et C (fuselage court, Bell 204) et les modèles UH-1D et H (fuselage allongé, Bell 205) ont chacun vu leurs performances et leur capacité de charge améliorées. Les UH-1B et C ont assuré des missions d'appui-feu et, dans une moindre mesure, de transport au cours des premières années de la guerre du Vietnam."
 VIE_attack_helicopter_equipment_2:0 "Bell UH-1H Gunship"
 VIE_attack_helicopter_equipment_2_short:0 "UH-1H Gunship"
 VIE_attack_helicopter_equipment_2_desc:0 "Au cours de la guerre, l'UH-1 a subi plusieurs améliorations. Les modèles UH-1A, B et C (fuselage court, Bell 204) et les modèles UH-1D et H (fuselage allongé, Bell 205) ont chacun vu leurs performances et leur capacité de charge améliorées. Les UH-1B et C ont assuré des missions d'appui-feu et, dans une moindre mesure, de transport au cours des premières années de la guerre du Vietnam."
 VIE_attack_helicopter_equipment_3:0 "Bell AH-1F Cobra"
 VIE_attack_helicopter_equipment_3_short:0 "AH-1F Cobra"
 VIE_attack_helicopter_equipment_3_desc:0 "L'AH-1F intègre toutes les améliorations des étapes 1 et 2 apportées à l'AH-1S. Il bénéficie également des améliorations de l'étape 3 : un affichage tête haute, un télémètre laser, un brouilleur infrarouge monté au-dessus de l'échappement du moteur, un système d'échappement du moteur à suppression infrarouge et le sous-système de données aérodynamiques (ADS) M143. L'AH-1F est également appelé « AH-1S modernisé », « AH-1S Modernized Cobra » ou « AH-1S(MC) » avant 1988."
 VIE_attack_helicopter_equipment_4:0 "Bell AH-1W SuperCobra"
 VIE_attack_helicopter_equipment_4_short:0 "AH-1W SuperCobra"
 VIE_attack_helicopter_equipment_4_desc:0 "Le Bell AH-1 SuperCobra est un hélicoptère d'attaque bimoteur basé sur l'AH-1 Cobra monomoteur de l'armée américaine. La famille des Cobra bimoteurs, qui fait elle-même partie de la grande famille des Huey, comprend l'AH-1J SeaCobra, l'AH-1T Improved SeaCobra et l'AH-1W SuperCobra."
 VIE_attack_helicopter_equipment_5:0 "Bell AH-1Z Viper"
 VIE_attack_helicopter_equipment_5_short:0 "AH-1Z Viper"
 VIE_attack_helicopter_equipment_5_desc:0 "Le Bell AH-1Z Viper est un hélicoptère d'attaque bimoteur américain, basé sur l'AH-1W SuperCobra, qui a été développé pour le Corps des Marines des États-Unis dans le cadre du programme de modernisation H-1. L'AH-1Z est équipé d'un rotor principal composite à quatre pales sans roulement, d'une transmission améliorée et d'un nouveau système de visée."
 VIE_scout_helicopter_equipment_1:0 "Hughes OH-6 Cayuse"
 VIE_scout_helicopter_equipment_1_short:0 "OH-6 Cayuse"
 VIE_scout_helicopter_equipment_1_desc:0 "Développé en 1960, l'OH-6 a été conçu dans le cadre du projet Light Observation Helicopter (LOH) à des fins d'observation, d'évacuation des blessés, de transport de personnel et d'attaque légère. Le modèle de Hughes a été retenu parmi onze autres modèles concurrents. Il a remplacé l'O-1 Bird Dog dans son rôle d'observation lorsque le ministère américain de la Défense a ordonné à l'armée américaine de transférer tous ses avions à voilure fixe à l'armée de l'air américaine. S'illustrant pendant la guerre du Vietnam, l'OH-6 avait démontré l'utilité des hélicoptères d'observation pour soutenir les hélicoptères d'attaque comme l'AH-1 ou les forces terrestres dans leurs combats contre l'ennemi. Officiellement connu sous le nom de « Cayuse » (d'après la tribu amérindienne du nord-ouest du Pacifique), les pilotes lui ont donné le surnom de « Loach » d'après le programme qui l'a vu naître."
 VIE_scout_helicopter_equipment_2:0 "Bell OH-58A Kiowa"
 VIE_scout_helicopter_equipment_2_short:0 "OH-58A Kiowa"
 VIE_scout_helicopter_equipment_2_desc:0 "Lancé en 1969, au plus fort de la guerre du Vietnam, l'OH-58 était un hélicoptère à quatre places dont la particularité était que, bien qu'il disposait de deux pilotes, les commandes du siège gauche pouvaient être retirées pour permettre à un passager de prendre place à l'avant. Pendant la guerre du Vietnam, son armement se composait d'un seul minigun M134 ou d'un lance-grenades M129. Après la guerre, l'OH-58 a subi de nombreuses modifications, avec une mise à niveau du moteur (le mettant au niveau du dernier OH-58C), un système d'imagerie thermique, un ensemble de communications pour les forces de l'ordre, un équipement de navigation amélioré et un train d'atterrissage surélevé. Ces variantes améliorées du « Kiowa » (du nom d'une tribu amérindienne originaire du Montana et du Colorado) ont participé aux opérations antidrogue RAID de la Garde nationale de l'armée."
 VIE_scout_helicopter_equipment_3:0 "Bell OH-58D Kiowa"
 VIE_scout_helicopter_equipment_3_short:0 "OH-58D Kiowa"
 VIE_scout_helicopter_equipment_3_desc:0 "La variante « D » améliorée du Kiowa était le résultat du programme d'amélioration des hélicoptères de l'armée (AHIP). Elle était dotée de caractéristiques telles qu'une transmission et un moteur améliorés pour les vols à très basse altitude, ainsi qu'une configuration unique à quatre pales du rotor principal qui la rendait beaucoup plus silencieuse que les autres hélicoptères, et plus encore que ses prédécesseurs. L'OH-58D a introduit le viseur monté sur mât (MMS) caractéristique au-dessus du système de rotor, ainsi qu'un cockpit en verre mixte, avec des instruments traditionnels identifiés comme « de secours » pour les situations d'urgence."
 VIE_scout_helicopter_equipment_4:0 "MD Helicopters AH-6J Little Bird"
 VIE_scout_helicopter_equipment_4_short:0 "AH-6J Little Bird"
 VIE_scout_helicopter_equipment_4_desc:0 "Le MH-6 Little Bird (surnommé « Killer Egg ») et sa variante d'attaque, l'AH-6, sont des hélicoptères légers utilisés pour des opérations spéciales par l'armée américaine. Initialement basé sur un OH-6A modifié, il a ensuite été basé sur le MD 500E, avec un rotor principal à cinq pales. La version la plus récente, le MH-6M, est basée sur le MD 530F et dispose d'un rotor principal à six pales et d'un rotor de queue à quatre pales."
 VIE_scout_helicopter_equipment_5:0 "Bell OH-58F Kiowa Warrior"
 VIE_scout_helicopter_equipment_5_short:0 "OH-58F Kiowa Warrior"
 VIE_scout_helicopter_equipment_5_desc:0 "L'OH-58F est la désignation d'une version améliorée de l'OH-58D. Le programme CASUP (Cockpit and Sensor Upgrade Program) comprend un système de ciblage et de surveillance monté à l'avant, en plus du capteur monté sur le mât de l'OH-58D. La charge utile du capteur commun AAS-53 (CSP) comprend une caméra infrarouge avancée, une caméra électro-optique couleur et un intensificateur d'image ; elle devrait améliorer les performances de vol de 1 à 2 % grâce à une réduction du poids et de la traînée."
 VIE_utility_helicopter_equipment_1:0 "Sikorsky H-34 Choctaw"
 VIE_utility_helicopter_equipment_1_short:0 "H-34 Choctaw"
 VIE_utility_helicopter_equipment_1_desc:0 "Le Sikorsky H-34 (désignation de la société S-58, désignation de la marine HUS) est un hélicoptère militaire à moteur à pistons initialement conçu pour la lutte anti-sous-marine (ASW), mais qui a ensuite été réutilisé comme moyen de transport moyen. Il deviendra le dernier hélicoptère à moteur à pistons utilisé par le Corps des Marines des États-Unis, tous les hélicoptères utilisés depuis lors étant équipés de moteurs à turbine. Dans la marine (sous le nom d'UH-34), il est connu sous le nom de « Seahorse », tandis que les variantes de l'armée (sous le nom de CH-34) ont pris le nom de « Choctaw »."
 VIE_utility_helicopter_equipment_2:0 "Bell UH-1A Iroquois"
 VIE_utility_helicopter_equipment_2_short:0 "UH-1A Iroquois"
 VIE_utility_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connus sous le nom de « Huey » (du nom de sa désignation d'origine avant 1962, HU-1), l'UH-1A est la variante militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agit du premier hélicoptère utilisé par l'armée américaine à être équipé d'un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication des États-Unis dans la guerre du Vietnam. Bien qu'il soit communément appelé « Huey », son surnom officiel est « Iroquois »."
 VIE_utility_helicopter_equipment_3:0 "Bell UH-1D Iroquois"
 VIE_utility_helicopter_equipment_3_short:0 "UH-1D Iroquois"
 VIE_utility_helicopter_equipment_3_desc:0 "Lancé en 1963, l'UH-1D est la version militaire du Bell 205. Il a été conçu avec un fuselage allongé afin de pouvoir servir principalement comme hélicoptère de transport de troupes en remplacement du CH-34 Choctaw utilisé auparavant par l'armée américaine. 2 000 exemplaires de cette variante « Iroquois D » ont été construits, dont beaucoup ont été convertis à la norme UH-1H avec un moteur amélioré et plus puissant."
 VIE_utility_helicopter_equipment_4:0 "Bell UH-1H Huey"
 VIE_utility_helicopter_equipment_4_short:0 "UH-1H Huey"
 VIE_utility_helicopter_equipment_4_desc:0 "En 1966, Bell a installé le moteur Lycoming T53-L-13 de 1 400 ch (1 000 kW) afin d'augmenter la puissance de l'appareil. Le tube de Pitot a été déplacé du nez vers le toit du cockpit afin d'éviter tout dommage lors de l'atterrissage. Les modèles de série dotés de cette configuration ont été désignés sous le nom d'UH-1H."
 VIE_utility_helicopter_equipment_5:0 "Bell UH-1H-II Huey"
 VIE_utility_helicopter_equipment_5_short:0 "UH-1H-II Huey"
 VIE_utility_helicopter_equipment_5_desc:0 "Il s'agit d'un UH-1H modifié et équipé d'un nouveau moteur. Les améliorations apportées comprennent un turbomoteur Allison T53-L-703 développant 1 343 kW (1 800 ch), un système de réduction des vibrations, des contre-mesures infrarouges et un cockpit compatible avec les lunettes de vision nocturne (NVG). Cela améliore considérablement les performances et la rentabilité."
 VIE_utility_helicopter_equipment_6:0 "Bell UH-1L Huey"
 VIE_utility_helicopter_equipment_6_short:0 "UH-1L Huey"
 VIE_utility_helicopter_equipment_6_desc:0 "Variante utilitaire de la variante TH-1L, qui est elle-même un hélicoptère d'entraînement au vol basé sur le HH-1K pour la marine américaine."
 VIE_utility_helicopter_equipment_7:0 "Bell UH-1Y Venom"
 VIE_utility_helicopter_equipment_7_short:0 "UH-1Y Venom"
 VIE_utility_helicopter_equipment_7_desc:0 "Le Bell UH-1Y Venom (également appelé Super Huey) est un hélicoptère utilitaire bimoteur de taille moyenne, construit par Bell Helicopter dans le cadre du programme de modernisation H-1 du Corps des Marines des États-Unis. L'un des derniers membres de la grande famille Huey, l'UH-1Y est également appelé « Yankee », d'après la prononciation de sa lettre variante dans l'alphabet phonétique de l'OTAN."
 VIE_cargo_helicopter_equipment_1:0 "Boeing CH-47A Chinook"
 VIE_cargo_helicopter_equipment_1_short:0 "CH-47A Chinook"
 VIE_cargo_helicopter_equipment_1_desc:0 "Le CH-47 (à l'origine HC-1B) est un hélicoptère bimoteur à double rotor qui figure parmi les hélicoptères de transport les plus lourds de l'Occident. Remplaçant le CH-37 Mojave, le CH-47 dispose de plusieurs moyens pour charger diverses marchandises, notamment plusieurs portes sur le fuselage, une large rampe de chargement située à l'arrière du fuselage et un total de trois crochets de chargement ventraux externes pour transporter des charges suspendues. Il était également l'hélicoptère le plus rapide de son époque lors de son lancement en 1962, et il est toujours considéré comme l'un des hélicoptères les plus rapides de l'arsenal actuel de l'armée américaine. Son nom, « Chinook », vient du peuple amérindien Chinook de l'État actuel de Washington."
 VIE_cargo_helicopter_equipment_2:0 "Boeing CH-47B Chinook"
 VIE_cargo_helicopter_equipment_2_short:0 "CH-47B Chinook"
 VIE_cargo_helicopter_equipment_2_desc:0 "Le CH-47B était une solution provisoire pendant que Boeing travaillait sur un CH-47C nettement amélioré. Le CH-47B était équipé de deux moteurs Lycoming T55-L-7C de 2 850 ch (2 130 kW). Il était doté d'un pylône de rotor arrière émoussé, de pales de rotor asymétriques redessinées et de nervures le long de la rampe arrière et du fuselage afin d'améliorer ses caractéristiques de vol."
 VIE_cargo_helicopter_equipment_3:0 "Boeing CH-47D Chinook"
 VIE_cargo_helicopter_equipment_3_short:0 "CH-47D Chinook"
 VIE_cargo_helicopter_equipment_3_desc:0 "Le CH-47D partage la même cellule que les modèles précédents, la principale différence étant l'adoption de moteurs plus puissants. Les premiers CH-47D étaient à l'origine équipés de deux moteurs T55-L-712, mais le moteur le plus courant est le T55-GA-714A, plus récent. Grâce à son système de chargement à triple crochet, le CH-47D peut transporter des charges lourdes à l'intérieur et jusqu'à 12 000 kg (26 000 lb) à l'extérieur (par exemple des conteneurs de 40 pieds ou 12 mètres). Il a été mis en service pour la première fois en 1979. Dans les opérations d'assaut aérien, il sert souvent de principal moyen de transport pour l'obusier M198 de 155 mm, accompagné de 30 cartouches de munitions et d'un équipage de 11 hommes."
 VIE_cargo_helicopter_equipment_4:0 "Sikorsky CH-53E Super Stallion"
 VIE_cargo_helicopter_equipment_4_short:0 "CH-53E Super Stallion"
 VIE_cargo_helicopter_equipment_4_desc:0 "En octobre 1967, le Corps des Marines des États-Unis a émis une demande pour un hélicoptère doté d'une capacité de levage 1,8 fois supérieure à celle du CH-53D et pouvant être embarqué sur des navires de guerre amphibies. À cette époque, la Marine et l'Armée de terre américaines recherchaient également des hélicoptères similaires. Avant la publication de cette demande, Sikorsky travaillait déjà à l'amélioration du CH-53D, sous la désignation « S-80 », avec un troisième turbomoteur et un système de rotor plus puissant. Sikorsky a proposé le modèle S-80 aux Marines en 1968. Les Marines ont apprécié l'idée, car elle promettait d'apporter rapidement une bonne solution, et ont financé le développement d'un hélicoptère d'essai à des fins d'évaluation. Le contrat de production initial a été attribué en 1978, et la mise en service a suivi en février 1981."
 VIE_cargo_helicopter_equipment_5:0 "Boeing CH-47D Chinook Block II"
 VIE_cargo_helicopter_equipment_5_short:0 "CH-47D Block II"
 VIE_cargo_helicopter_equipment_5_desc:0 "CH-47D modernisé avec une avionique avancée, des instruments GPS et une amélioration de la capacité de survie. Presque tous les anciens Chinook ont été mis à niveau selon cette norme."
 VIE_cargo_helicopter_equipment_6:0 "Boeing CH-47F Chinook"
 VIE_cargo_helicopter_equipment_6_short:0 "CH-47F Chinook"
 VIE_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, une version améliorée du CH-47D, a effectué son vol inaugural ; le premier modèle de série a été présenté le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les améliorations comprennent des moteurs Honeywell de 4 868 chevaux-vapeur (3 630 kW) et une cellule plus robuste, construite d'une seule pièce afin de réduire les besoins d'entretien. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion afin d'augmenter la durée de vie."