 FRA_cv_mr_stealth_fighter_equipment_1:0 "Dassault Rafale M variant F3-R"
 FRA_cv_mr_stealth_fighter_equipment_1_short:0 "Rafale M"
 FRA_cv_mr_stealth_fighter_equipment_1_desc:0 "Identique au Rafale C F3-R, mais version embarquée pour l'Aéronavale française, entrée en service en 2001. Pour les opérations embarquées, le modèle M dispose d'une cellule renforcée, d'un train avant plus long pour offrir une assiette plus cabrée, d'un crochet d'appontage plus grand entre les moteurs et d'une échelle d'embarquement intégrée. Par conséquent, le Rafale M pèse environ 500 kg (1 100 lb) de plus que le Rafale C. C'est le seul type de chasseur non américain autorisé à opérer à partir des ponts des porte-avions américains, en utilisant des catapultes et leurs dispositifs d'arrêt, comme l'a démontré en 2008 l'intégration de six Rafale de la Flottille 12F à l'exercice d'interopérabilité de l'USS Theodore Roosevelt Carrier Air Wing."
