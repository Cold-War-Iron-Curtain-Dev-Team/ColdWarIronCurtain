 AST_jet_tac_bomber_equipment_4_desc:0 "L'« Aardvark » est un avion d'interception supersonique équipé d'un radar à balayage du sol, de turboréacteurs à postcombustion avancés et d'ailes à flèche variable. Cela lui permet d'effectuer des frappes à grande vitesse et à basse altitude en profondeur dans le territoire ennemi."
 AST_jet_tac_bomber_equipment_5:0 "General Dynamics F-111E Aardvark"
 AST_jet_tac_bomber_equipment_5_short:0 "F-111E Aardvark"
 AST_jet_tac_bomber_equipment_5_desc:0 "Conçue comme une solution provisoire pour le F-111D, la variante E est la dernière mise à niveau de la plate-forme « Aardvark » et comprend des entrées d'air avancées et une suite avionique améliorée."
