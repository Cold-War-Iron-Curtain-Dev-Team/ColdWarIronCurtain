 PRC_CAS_equipment_1:0 "Mitsubishi Ki-30"
 PRC_CAS_equipment_1_short:0 "Ki-30"
 PRC_CAS_equipment_2:0 "Mitsubishi Ki-32"
 PRC_CAS_equipment_2_short:0 "Ki-32"
 PRC_CAS_equipment_3:0 "Ilyushin Il-10"
 PRC_CAS_equipment_3_short:0 "Il-10"
 PRC_CAS_equipment_3_desc:0 "Développé à partir de l'Il-2 Sturmovik, l'Il-10 a été conçu dans le but de remédier à bon nombre des défauts de l'Il-2. L'objectif principal était d'augmenter la vitesse et la maniabilité à basse altitude, principalement pour échapper à l'artillerie antiaérienne de petit calibre, qui constituait la principale menace pour les avions d'attaque au sol. Entré en service en janvier 1945, l'Il-10 a participé à certaines des dernières opérations de combat en Europe et à la brève intervention soviétique dans la guerre du Pacifique. Lorsque l'Il-10 a été retiré du service soviétique en 1956, l'armée de l'air a délaissé les avions de soutien aérien rapproché et d'attaque au sol au profit des chasseurs-bombardiers. Son nom de code OTAN est Beast."
 PRC_jet_CAS_equipment_1:0 "Ilyushin IL-10M"
 PRC_jet_CAS_equipment_1_short:0 "IL-10M"
 PRC_jet_CAS_equipment_1_desc:0 "Développé à partir de l'Il-2 Sturmovik, l'Il-10 a été conçu dans le but de remédier à bon nombre des défauts de l'Il-2. L'objectif principal était d'augmenter la vitesse et la maniabilité à basse altitude, principalement pour échapper à l'artillerie antiaérienne de petit calibre, qui constituait la principale menace pour les avions d'attaque au sol. Entré en service en janvier 1945, l'Il-10 a participé à certaines des dernières opérations de combat en Europe et à la brève intervention soviétique dans la guerre du Pacifique. Lorsque l'Il-10 a été retiré du service soviétique en 1956, l'armée de l'air a délaissé les avions de soutien aérien rapproché et d'attaque au sol au profit des chasseurs-bombardiers. Son nom de code OTAN est Beast."
 PRC_jet_CAS_equipment_6:0 "Nanchang Q-5"
 PRC_jet_CAS_equipment_6_short:0 "Q-5"
 PRC_jet_CAS_equipment_7:0 "Nanchang Q-5A"
 PRC_jet_CAS_equipment_7_short:0 "Q-5A"
 PRC_jet_CAS_equipment_8:0 "Nanchang Q-5B"
 PRC_jet_CAS_equipment_8_short:0 "Q-5B"
 PRC_cas_stealth_equipment_1:0 "Nanchang JQ-5J"
 PRC_cas_stealth_equipment_1_short:0 "JQ-5J"
 PRC_cas_stealth_equipment_1_desc:0 "Tandem biplace du Q-5. Le constructeur affirmait qu'il pouvait être utilisé comme avion de contrôle aérien avancé, à l'instar de l'OA-10A, et fournir des informations de ciblage via des liaisons de données. Le siège arrière est surélevé de 286 millimètres par rapport au siège avant, ce qui permet au pilote arrière de bénéficier d'un champ de vision de 5 degrés. La verrière s'ouvre vers la droite. Lorsqu'il est utilisé comme avion d'entraînement, les commandes du cockpit arrière peuvent prendre le pas sur celles du cockpit avant."
 PRC_jet_light_equipment_1:0 "Mikoyan-Gurevich MiG-9UTI"
 PRC_jet_light_equipment_1_short:0 "MiG-9UTI"
 PRC_jet_light_equipment_1_desc:0 "Afin d'assurer la préparation du personnel navigant de l'unité de combat des avions de chasse de l'armée de l'air, l'équipe OKB-155, dirigée par A.I. Mikoyan, a été chargée de développer une version biplace de l'avion MiG-9. Les travaux sur une nouvelle version du MiG-9 ont commencé en juillet 1946 à l'OKB-155. La conception préliminaire du « jumeau » était prête à la fin du mois d'octobre et, conformément au calendrier de conception et de construction de l'avion approuvé par Mikoyan le 26 août, le premier prototype a été présenté à l'aérodrome le 20 décembre 1946."
 PRC_jet_light_equipment_2:0 "Shenyang JJ-2"
 PRC_jet_light_equipment_2_short:0 "JJ-2"
 PRC_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 s'est vu officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n° 1 entre mars et mai 1949. La cabine de l'instructeur sur le MiG-15UTI a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement comprenait un canon NR-23 de 23 mm avec 80 cartouches et une mitrailleuse UBK-E avec 150 cartouches."
 PRC_jet_light_equipment_3:0 "L-29 Delfin"
 PRC_jet_light_equipment_3_short:0 "L-29 Delfin"
 PRC_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín (en français : Dauphin, nom de code OTAN : Maya) est un avion d'entraînement militaire à réaction développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Au cours du programme, plus de 3 000 avions d'entraînement L-29 Delfin ont été produits. Parmi ceux-ci, environ 2 000 auraient été livrés à l'Union soviétique, où ils ont été utilisés comme avions d'entraînement standard par l'armée de l'air soviétique."
 PRC_jet_light_equipment_4:0 "Chengdu JJ-7"
 PRC_jet_light_equipment_4_short:0 "JJ-7"
 PRC_jet_light_equipment_4_desc:0 "Les variantes d'entraînement J-7 sont des versions d'entraînement développées par la Chine pour un usage national, et cette série est fournie à la fois à la PLAAF et à la PLANAF. Basé sur le J-7II, mais différent à 40 % du J-7II, il est équipé d'un siège éjectable HTY-2 national, d'un radar de télémétrie de type 226 et d'autres systèmes nationaux chinois. Les canons ont été supprimés, mais le pylône ventral peut transporter un canon double de 23 mm semi-encastré."
 PRC_jet_light_equipment_5:0 "Hongdu JL-8"
 PRC_jet_light_equipment_5_short:0 "JL-8"
 PRC_jet_light_equipment_5_desc:0 "Le Hongdu JL-8, également connu sous le nom de Karakorum-8 ou K-8, est un avion d'entraînement intermédiaire à réaction biplace et un avion d'attaque léger conçu en République populaire de Chine par la China Nanchang Aircraft Manufacturing Corporation. Le principal contractant est la Hongdu Aviation Industry Corporation."
 PRC_recon_equipment_0:0 "Tupolev Tu-2R"
 PRC_recon_equipment_0_short:0 "Tu-2R"
 PRC_recon_equipment_0_desc:0 "Version de reconnaissance du Tu-2."
 PRC_jet_recon_equipment_0:0 "Shenyang JZ-2"
 PRC_jet_recon_equipment_0_short:0 "JZ-2"
 PRC_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, l'OKB MiG a commencé à développer une variante de reconnaissance de première ligne du MiG-15 équipée d'une caméra AFA-BA/40, qui offre une largeur de balayage de 0,9 à 4,5 km avec une longueur de parcours photographique de 90 à 450 km à des altitudes comprises entre 2 000 et 10 000 m. Un seul canon NR-23 était installé sur l'avion. Afin d'augmenter l'autonomie du reconnaissance, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur « Barium-M » et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur l'appareil."
 PRC_jet_recon_equipment_1:0 "Chengdu JZ-8"
 PRC_jet_recon_equipment_1_short:0 "JZ-8"
 PRC_jet_recon_equipment_1_desc:0 "Version de reconnaissance. Également désignée sous les noms J-8E, J-8R et J-8V. Serait une conversion du J-8A ; au moins 6 exemplaires connus. Conserve son armement à canon ; capteur sous le nez similaire à celui des variantes Su-17/20/22 ; nacelle centrale d'apparence similaire à celle du Mig-21R, intégrant une grande fenêtre rectangulaire pour caméra ou une antenne SLAR, en service dans l'armée de l'air de l'APL."
 PRC_jet_recon_equipment_2:0 "Shenyang J-11D"
 PRC_jet_recon_equipment_2_short:0 "J-11D"
 PRC_jet_recon_equipment_2_desc:0 "Variante du Shenyang J-11, équipée d'un radar à balayage électronique fixe, d'un IRST et capable de tirer des missiles air-air à imagerie/infrarouge (IIR) plus lourds. La cellule utilise davantage de matériaux composites, en particulier dans les entrées d'air du moteur, afin de réduire la détectabilité radar. Les ailes comportent chacune trois points d'emport. Selon des informations non confirmées, il serait équipé d'un nouveau système de commandes de vol électriques, d'un cockpit en verre, de systèmes de guerre électronique améliorés et d'une version améliorée du moteur WS-10A."
 PRC_tac_bomber_equipment_0:0 "Tupolev SB 2M-100"
 PRC_tac_bomber_equipment_0_short:0 "SB 2M-100"
 PRC_tac_bomber_equipment_0_desc:0 "Le Tupolev ANT-40, également connu sous son nom de service Tupolev SB et son nom de développement TsAGI-40, était un bombardier monoplan bimoteur à trois places à grande vitesse, qui a effectué son premier vol en 1934. La conception du Tupolev était avancée mais manquait de raffinement, au grand désarroi des équipages, du personnel de maintenance et de Staline, qui soulignait qu'« il n'y a pas de détails insignifiants dans l'aviation »."
 PRC_tac_bomber_equipment_1:0 "Kawasaki Ki-48"
 PRC_tac_bomber_equipment_1_short:0 "Ki-48"
 PRC_tac_bomber_equipment_1_desc:0 "Le Kawasaki Ki-48 était un bombardier léger bimoteur japonais utilisé pendant la Seconde Guerre mondiale. Son nom de code allié était Lily."
 PRC_tac_bomber_equipment_2:0 "Petlyakov Pe-2B"
 PRC_tac_bomber_equipment_2_short:0 "Pe-2B"
 PRC_tac_bomber_equipment_2_desc:0 "Le Petlyakov Pe-2 était un bombardier en piqué bimoteur soviétique utilisé pendant la Seconde Guerre mondiale. L'un des avions d'attaque tactique les plus remarquables de la guerre, il s'est également révélé efficace en tant que chasseur lourd, chasseur de nuit (variante Pe-3) et avion de reconnaissance. À bien des égards, il ressemblait au De Havilland Mosquito britannique en bois. Le Pe-2 était, en nombre, le bombardier soviétique le plus important de la Seconde Guerre mondiale, représentant à son apogée 75 % de la force de bombardiers bimoteurs soviétiques."
 PRC_tac_bomber_equipment_3:0 "Tupolev Tu-2"
 PRC_tac_bomber_equipment_3_short:0 "Tu-2"
 PRC_tac_bomber_equipment_3_desc:0 "Le Tu-2 était un bombardier diurne bimoteur à grande vitesse développé en 1941. Il a été conçu pour être la réponse soviétique au bombardier moyen Junkers Ju-88, adapté pour répondre à un besoin en bombardier à grande vitesse ou en bombardier en piqué, avec une grande charge interne de bombes et une vitesse similaire à celle d'un chasseur monoplace. Il s'est avéré à la hauteur de la tâche, et des variantes de bombardier torpilleur, de reconnaissance et de chasseur lourd ont vu le jour, jouant un rôle clé dans les dernières offensives soviétiques de la Seconde Guerre mondiale. Son nom de code OTAN d'après-guerre est Bat."
 PRC_jet_tac_bomber_equipment_1:0 "Tupolev Tu-14"
 PRC_jet_tac_bomber_equipment_1_short:0 "Tu-14"
 PRC_jet_tac_bomber_equipment_2:0 "Harbin H-5"
 PRC_jet_tac_bomber_equipment_2_short:0 "H-5"
 PRC_jet_tac_bomber_equipment_3:0 "Harbin H-5A"
 PRC_jet_tac_bomber_equipment_3_short:0 "H-5A"
 PRC_jet_tac_bomber_equipment_4:0 "Harbin H-5B"
 PRC_jet_tac_bomber_equipment_4_short:0 "H-5B"
 PRC_jet_tac_bomber_equipment_7:0 "Xian JH-7"
 PRC_jet_tac_bomber_equipment_7_short:0 "JH-7"
 PRC_jet_tac_bomber_equipment_8:0 "Xian JH-7A"
 PRC_jet_tac_bomber_equipment_8_short:0 "JH-7A"
 PRC_strat_bomber_equipment_2:0 "Consolidated B-24A Liberator"
 PRC_strat_bomber_equipment_2_short:0 "B-24A Liberator"
 PRC_strat_bomber_equipment_3:0 "Tupolev Tu-4"
 PRC_strat_bomber_equipment_3_short:0 "Tu-4"
 PRC_strat_bomber_equipment_3_desc:0 "Le Tu-4 est une conception issue d'une ingénierie inverse basée sur le B-29 Superfortress américain, développé pour répondre au besoin de Joseph Staline de disposer d'un bombardier stratégique doté de capacités similaires à celles du bombardier américain qui avait permis de remporter la guerre. Malgré le refus des États-Unis de prêter le B-29 dans le cadre du programme Lend-Lease, quatre B-29 se sont écrasés sur le territoire soviétique, ce qui a suffi pour lancer le processus d'ingénierie inverse. Malgré de nombreuses difficultés (approvisionnement en pièces équivalentes ou supérieures à celles développées par les Américains, conversion du système impérial au système métrique, etc.), le premier vol et la mise en service du Tu-4 ont suffi à semer la panique aux États-Unis et en Grande-Bretagne, la première d'une longue série pendant la guerre froide. Sa durée de vie a toutefois été brève, puisqu'il a été remplacé par des bombardiers à réaction au milieu des années 1960. Son nom de code OTAN est Bull."
 PRC_jet_strat_bomber_equipment_1:0 "Tupolev Tu-4A"
 PRC_jet_strat_bomber_equipment_1_short:0 "Tu-4A"
 PRC_jet_strat_bomber_equipment_3:0 "Xian H-6A"
 PRC_jet_strat_bomber_equipment_3_short:0 "H-6A"
 PRC_jet_strat_bomber_equipment_4:0 "Xian H-6C"
 PRC_jet_strat_bomber_equipment_4_short:0 "H-6C"
 PRC_jet_strat_bomber_equipment_5:0 "Xian H-6E"
 PRC_jet_strat_bomber_equipment_5_short:0 "H-6E"
 PRC_stealth_strategic_bomber_equipment_1:0 "Xian H-6H"
 PRC_stealth_strategic_bomber_equipment_1_short:0 "H-6H"
 PRC_stealth_strategic_bomber_equipment_2:0 "Xian H-20"
 PRC_stealth_strategic_bomber_equipment_2_short:0 "H-20"
 PRC_stealth_strategic_bomber_equipment_2_desc:0 "Le Xian H-20 est un projet de bombardier furtif subsonique de l'Armée populaire de libération. Il est considéré comme un projet stratégique par l'Armée populaire de libération. Le H-20 sera le premier bombardier stratégique dédié développé par la Chine."
