 DEN_transport_plane_equipment_4:0 "Douglas C-54D Skymaster"
 DEN_transport_plane_equipment_4_short:0 "C-54D Skymaster"
 DEN_transport_plane_equipment_4_desc:0 "Tout comme le C-47 avant lui, le C-54 a été développé à partir d'un avion de ligne Douglas, en l'occurrence le DC-4. Lancé en 1942, le C-54D, qui est une version améliorée du C-54 original, a été utilisé pour le transport de marchandises, mais a également transporté d'importantes personnalités. Plusieurs exemplaires ont été utilisés par l'armée de l'air royale danoise."
