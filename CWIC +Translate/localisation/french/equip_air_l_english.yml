 drone_equipment_3_short:0 "Drone III"
 drone_equipment_1_desc:0 "Drone I"
 drone_equipment_2_desc:0 "Drone II"
 drone_equipment_3_desc:0 "Drone III"
 cv_nav_bomber_equipment_1:0 "Bombardier naval embarqué I"
 cv_nav_bomber_equipment_1_short:0 "CV Bombardier Naval I"
 cv_nav_bomber_equipment_1_desc:0 "Un bombardier naval de base, simplement adapté au décollage et à l'atterrissage sur un porte-avions."
 cv_nav_bomber_equipment_2:0 "Bombardier naval embarqué II"
 cv_nav_bomber_equipment_2_short:0 "CV Bombardier Naval II"
 cv_nav_bomber_equipment_2_desc:0 "Un bombardier naval amélioré, simplement adapté au décollage et à l'atterrissage sur un porte-avions."
 cv_nav_bomber_equipment_3:0 "Bombardier naval embarqué III"
 cv_nav_bomber_equipment_3_short:0 "CV Bombardier Naval III"
 cv_nav_bomber_equipment_3_desc:0 "Un bombardier naval avancé, simplement adapté au décollage et à l'atterrissage sur un porte-avions."
 cv_CAS_equipment_1:0 "AAR embarqué I"
 cv_CAS_equipment_1_short:0 "CV CAS I"
 cv_CAS_equipment_1_desc:0 "Un appareil d'appui aérien rapproché de base, simplement adapté au décollage et à l'atterrissage sur un porte-avions."
 cv_CAS_equipment_2:0 "AAR embarqué II"
 cv_CAS_equipment_2_short:0 "CV CAS II"
 cv_CAS_equipment_2_desc:0 "Un appareil d'appui aérien rapproché de base, simplement adapté au décollage et à l'atterrissage sur un porte-avions."
 cv_CAS_equipment_3:0 "AAR embarqué III"
 cv_CAS_equipment_3_short:0 "CV CAS III"
 cv_CAS_equipment_3_desc:0 "Un appareil d'appui aérien rapproché de base, simplement adapté au décollage et à l'atterrissage sur un porte-avions."
 cv_CAS_equipment_4:0 "AAR embarqué IV"
 cv_CAS_equipment_4_short:0 "CV CAS IV"
 cv_CAS_equipment_4_desc:0 ""
 cv_fighter_equipment_0:0 "IW Chasseur embarqué"
 cv_fighter_equipment_0_short:0 "IW CV Chasseur embarqué"
 cv_fighter_equipment_0_desc:0 "Un chasseur de base, simplement adapté au décollage et à l'atterrissage sur un porte-avions."
 cv_fighter_equipment_1:0 "Chasseur embarqué I"
 cv_fighter_equipment_1_short:0 "Chasseur embarqué I"
 cv_fighter_equipment_1_desc:0 "Un chasseur de base, simplement adapté au décollage et à l'atterrissage sur un porte-avions."
 cv_fighter_equipment_2:0 "Chasseur embarqué II"
 cv_fighter_equipment_2_short:0 "Chasseur embarqué II"
 cv_fighter_equipment_2_desc:0 "Un chasseur amélioré de base, simplement adapté au décollage et à l'atterrissage sur un porte-avions."
 cv_fighter_equipment_3:0 "Chasseur embarqué III"
 cv_fighter_equipment_3_short:0 "Chasseur embarqué III"
 cv_fighter_equipment_3_desc:0 "Un chasseur avancé de base, simplement adapté au décollage et à l'atterrissage sur un porte-avions."
 rocket_interceptor_equipment_1:0 "Intercepteur à moteur-fusée I"
 rocket_interceptor_equipment_1_desc:0 "Intercepteur expérimental à courte portée, propulsé par un moteur-fusée chimique peu fiable."
 rocket_interceptor_equipment_1_short:0 "Intercepteur à moteur-fusée I"
 rocket_interceptor_equipment_2:0 "Intercepteur à moteur-fusée II"
 rocket_interceptor_equipment_2_desc:0 "Intercepteur à courte portée, propulsé par un moteur-fusée chimique un peu plus fiable."
 rocket_interceptor_equipment_2_short:0 "Intercepteur à moteur-fusée II"
 rocket_interceptor_equipment_3:0 "Intercepteur à moteur-fusée III"
 rocket_interceptor_equipment_3_desc:0 "Après avoir enfin résolu la plupart des problèmes liés aux moteurs-fusées, cet intercepteur est désormais un précieux atout pour la défense rapprochée de nos installations."
 rocket_interceptor_equipment_3_short:0 "Intercepteur à moteur-fusée III"
 rocket_suicide_equipment_1:0 "Avion-suicide"
 rocket_suicide_equipment_1_short:0 "Avion-suicide"
 rocket_suicide_equipment_1_desc:0 "Accrochez-vous, ça va secouer."
 jet_cas:0 "Avion d'Appui Aérien à réaction "
 jet_CAS_equipment:0 "Appui aérien rapproché par avion à réaction"
 jet_CAS_equipment_1:0 "Appui aérien rapproché par avion à réaction I"
 jet_CAS_equipment_1_short:0 "Appui aérien rapproché par avion à réaction I"
 jet_CAS_equipment_1_desc:0 "Avion d'attaque léger équipé d'armes air-sol et chargé spécifiquement d'assurer le soutien aérien rapproché des troupes au sol."
 jet_CAS_equipment_2:0 "Appui aérien rapproché par avion à réaction II"
 jet_CAS_equipment_2_short:0 "Appui aérien rapproché par avion à réaction II"
 jet_CAS_equipment_2_desc:0 "Un avion d'attaque léger modernisé, équipé d'armes air-sol et spécialement conçu pour fournir un appui aérien rapproché aux troupes au sol."
 jet_CAS_equipment_3:0 "Appui aérien rapproché par avion à réaction III"
 jet_CAS_equipment_3_short:0 "Appui aérien rapproché par avion à réaction III"
 jet_CAS_equipment_3_desc:0 "Un avion d'appui aérien rapproché de deuxième génération doté de capacités air-sol dédiées."
 jet_CAS_equipment_4:0 "Appui aérien rapproché par avion à réaction IV"
 jet_CAS_equipment_4_short:0 "Appui aérien rapproché par avion à réaction IV"
 jet_CAS_equipment_4_desc:0 "Un avion d'appui aérien rapproché de troisième génération doté de capacités air-sol étendues et de systèmes de navigation et d'attaque de base."
 jet_CAS_equipment_5:0 "Appui aérien rapproché par avion à réaction V"
 jet_CAS_equipment_5_short:0 "Appui aérien rapproché par avion à réaction V"
 jet_CAS_equipment_5_desc:0 "Un avion d'appui aérien rapproché de troisième génération doté de capacités air-sol étendues et de systèmes de navigation et d'acquisition de cibles par bus de données modernisés."
 jet_CAS_equipment_6:0 "Appui aérien rapproché par avion à réaction VI"
 jet_CAS_equipment_6_short:0 "Appui aérien rapproché par avion à réaction VI"
 jet_CAS_equipment_6_desc:0 "Un avion d'appui aérien rapproché de troisième génération doté de capacités air-sol avancées, de systèmes de navigation et d'acquisition de cibles, y compris un FLIR de base et des désignateurs laser."
 jet_CAS_equipment_7:0 "Appui aérien rapproché par avion à réaction VII"
 jet_CAS_equipment_7_short:0 "Appui aérien rapproché par avion à réaction VII"
 jet_CAS_equipment_7_desc:0 "Un avion d'appui aérien rapproché de quatrième génération doté de capacités étendues, notamment des désignateurs laser, des systèmes de localisation GPS et des commandes de vol électriques."
 jet_CAS_equipment_8:0 "Appui aérien rapproché par avion à réaction VIII"
 jet_CAS_equipment_8_short:0 "Appui aérien rapproché par avion à réaction VIII"
 jet_CAS_equipment_8_desc:0 "Un avion d'appui aérien rapproché de quatrième génération doté d'un armement amélioré et de capacités accrues, notamment des désignateurs laser, des systèmes de localisation GPS, des commandes de vol électriques et des équipements FLIR et de vol de nuit avancés."
 cas_stealth_equipment_1:0 "Appui aérien rapproché furtif"
 cas_stealth_equipment_1_short:0 "Appui aérien rapproché furtif"
 cas_stealth_equipment_1_desc:0 "Un avion d'appui aérien rapproché de cinquième génération ou de cinquième génération moins, intégrant des composants furtifs pour réduire la visibilité et la section radar."
 jet_light_equipment_1:0 "Jet léger de première génération"
 jet_light_equipment_1_short:0 "Jet léger de première génération"
 jet_light_equipment_1_desc:0 "Une première génération d'avions légers, souvent étroitement liés aux avions d'entraînement, destinés à être utilisés dans des missions de frappe légère ou de défense aérienne."
 jet_light_equipment_2:0 "Jet léger de deuxième génération"
 jet_light_equipment_2_short:0 "Jet léger de deuxième génération"
 jet_light_equipment_2_desc:0 "Une deuxième génération d'avions légers, souvent étroitement liés aux avions d'entraînement, destinés à des missions de frappe légère ou de défense aérienne."
 jet_light_equipment_3:0 "Jet léger de troisième génération"
 jet_light_equipment_3_short:0 "Jet léger de troisième génération"
 jet_light_equipment_3_desc:0 "Une troisième génération d'avions tactiques légers, peu coûteux à produire, mais capables d'atteindre la vitesse du son et équipés d'armements légers pour des missions air-air et air-sol."
 jet_light_equipment_4:0 "Jet léger de génération 3++"
 jet_light_equipment_4_short:0 "Jet léger de génération 3++"
 jet_light_equipment_4_desc:0 "Une troisième génération d'avions tactiques légers, peu coûteux à produire, mais capables d'atteindre la vitesse du son et équipés d'armements légers pour des missions air-air et air-sol."
 jet_light_equipment_5:0 "Jet léger de génération 4+"
 jet_light_equipment_5_short:0 "Jet léger de génération 4+"
 jet_light_equipment_5_desc:0 "Une quatrième génération d'avions légers équipés de capteurs et de radars performants, armés d'armes légères pour des missions air-air et air-sol."
 jet_multirole_equipment:0 "Jet multirôle"
 jet_multirole_equipment_1:0 "Chasseur multirôle de première génération"
 jet_multirole_equipment_1_short:0 "Gen 1 Multirôle"
 jet_multirole_equipment_1_desc:0 "Les augmentations de vitesse précédentes sont insignifiantes comparées à l'introduction des premiers avions de chasse à réaction. Même si nous n'avons pas encore appris à construire les avions les mieux adaptés à ces moteurs, les avions de chasse classiques ne peuvent pas rivaliser."
 jet_multirole_equipment_2:0 "Chasseur multirôle de génération 1+"
 jet_multirole_equipment_2_short:0 "Gen 1+ Multirôle"
 jet_multirole_equipment_2_desc:0 "L'introduction de l'aile en flèche permet d'atteindre des vitesses transsoniques, mais la maniabilité reste souvent limitée à ces vitesses. Ces avions étaient généralement destinés à assurer la supériorité aérienne."
 jet_multirole_equipment_3:0 "Chasseur multirôle de deuxième génération"
 jet_multirole_equipment_3_short:0 "Chasseur multirôle de 2e génération"
 jet_multirole_equipment_3_desc:0 "La guerre de Corée de 1950-1953 a imposé une refonte majeure. Les armes à feu se sont révélées inadaptées à des vitesses aussi élevées, tandis que la nécessité d'une capacité multirôle dans le soutien au combat a été redécouverte. Les intercepteurs apparus après la guerre utilisaient des moteurs à postcombustion pour atteindre une vitesse de Mach 2, tandis que les missiles à guidage radar et infrarouge amélioraient considérablement leur précision et leur puissance de feu."
 jet_multirole_equipment_4:0 "Chasseur multirôle de génération 2+"
 jet_multirole_equipment_4_short:0 "Gen 2+ Multirôle"
 jet_multirole_equipment_4_desc:0 "Une nouvelle extension des capacités serait nécessaire pour les avions de deuxième génération, qui exigeraient une approche plus polyvalente. Des points d'ancrage supplémentaires, des ailes plus effilées et l'introduction des ailes delta."
 jet_multirole_equipment_5:0 "Chasseur multirôle de troisième génération"
 jet_multirole_equipment_5_short:0 "Chasseur multirôle de 3e génération"
 jet_multirole_equipment_5_desc:0 "La nouvelle génération de chasseurs a été conçue dès le départ pour être polyvalente. Elle devait pouvoir transporter un large éventail d'armes et d'autres munitions, telles que des missiles air-sol et des bombes à guidage laser, tout en étant capable d'effectuer des interceptions air-air au-delà du champ de vision. Son avionique comprenait un radar Doppler à impulsions, un système de ciblage hors champ et un système d'alerte de terrain."
 jet_multirole_equipment_6:0 "Chasseur multirôle de génération 3+"
 jet_multirole_equipment_6_short:0 "Gen 3+ Multirôle"
 jet_multirole_equipment_6_desc:0 "L'arrivée de moteurs à double flux plus économiques a permis d'augmenter l'autonomie et la durée des sorties, tandis que l'augmentation de la poussée n'a pu améliorer que partiellement les performances et la maniabilité sur toute la plage de vitesse. Certains concepteurs ont eu recours à la géométrie variable ou à la poussée vectorielle pour tenter de concilier ces contraires."
 jet_multirole_equipment_7:0 "Chasseur multirôle de génération 3++"
 jet_multirole_equipment_7_short:0 "Gen 3++ Multirôle"
 jet_multirole_equipment_7_desc:0 "Poursuite du développement des ailes à géométrie variable, extension de la portée et amélioration des radars et du contrôle de tir afin de suivre les progrès technologiques rapides vers la 4e génération d'avions de combat."
 jet_multirole_equipment_8:0 "Chasseur multirôle de quatrième génération"
 jet_multirole_equipment_8_short:0 "Chasseur multirôle de 4e génération"
 jet_multirole_equipment_8_desc:0 "Après les succès mitigés de la génération multirôle, des technologies avancées ont été développées, telles que le commandement électrique, les matériaux composites, les rapports poussée/poids supérieurs à l'unité, l'hypermanœuvrabilité, l'avionique numérique avancée et les capteurs tels que le radar synthétique et la recherche et le suivi infrarouges, ainsi que la furtivité."
 jet_multirole_equipment_9:0 "Chasseur multirôle de génération 4+"
 jet_multirole_equipment_9_short:0 "Gen 4+ Multirole"
 jet_multirole_equipment_9_desc:0 "Comme la génération précédente semblait fragmentaire, les concepteurs sont revenus en priorité au chasseur, mais en prévoyant des rôles de soutien comme développements anticipés. Une maniabilité encore plus extrême avec, respectivement, des tuyères d'échappement renforcées pour le viffing (vectorisation en vol vers l'avant) et le contrôle des manœuvres à des angles d'attaque élevés."
 jet_multirole_equipment_10:0 "Chasseur multirôle de génération 4++"
 jet_multirole_equipment_10_short:0 "Gen 4++ Multirôle"
 jet_multirole_equipment_10_desc:0 "Les versions ultérieures de ces appareils et d'autres ont progressivement amélioré leurs technologies caractéristiques et intégré de plus en plus les caractéristiques les uns des autres, tout en adoptant certaines technologies émergentes de cinquième génération, telles que les communications numériques à haute capacité. Ces chasseurs sont ce qui se rapproche le plus d'un avion entièrement numérique et avancé sans caractéristiques furtives avancées."
 mr_stealth_fighter_equipment_1:0 "Chasseur multirôle de cinquième génération"
 mr_stealth_fighter_equipment_1_short:0 "Chasseur multirôle de 5e génération"
 mr_stealth_fighter_equipment_1_desc:0 "La nouvelle génération d'avions de combat avancés apparue au cours des premières décennies du XXIe siècle est désormais connue sous le nom de « cinquième génération ». Les caractéristiques qui définissent ces avions de combat de cinquième génération ne font pas l'unanimité et tous les modèles de cinquième génération ne les possèdent pas nécessairement toutes. Certaines classifications comptent plus de cinq générations avant l'émergence de la nouvelle génération."
 jet_interceptor:0 "Chasseur de supériorité aérienne"
 jet_interceptor_equipment:0 "Chasseur de supériorité aérienne"
 jet_interceptor_equipment_1:0 "Chasseur de supériorité aérienne de première génération"
 jet_interceptor_equipment_1_short:0 "ASF de génération 1"
 jet_interceptor_equipment_1_desc:0 "Les augmentations de vitesse précédentes sont insignifiantes comparées à l'introduction des intercepteurs. Même si nous devons encore apprendre à construire les avions les mieux adaptés à ces moteurs, les intercepteurs classiques ne peuvent rivaliser."
 jet_interceptor_equipment_2:0 "Chasseur de supériorité aérienne de génération 1+"
 jet_interceptor_equipment_2_short:0 "ASF de génération 1+"
 jet_interceptor_equipment_2_desc:0 "L'introduction de l'aile en flèche permet d'atteindre des vitesses transsoniques, mais la maniabilité reste souvent limitée à ces vitesses. Ces avions étaient généralement destinés à assurer la supériorité aérienne."
 jet_interceptor_equipment_3:0 "Chasseur de supériorité aérienne de deuxième génération"
 jet_interceptor_equipment_3_short:0 "ASF de génération 2"
 jet_interceptor_equipment_3_desc:0 "La guerre de Corée de 1950-1953 a imposé une refonte majeure. Les armes à feu se sont révélées inadaptées à des vitesses aussi élevées, tandis que la nécessité d'une capacité multirôle dans le soutien au combat a été redécouverte. Les intercepteurs apparus après la guerre utilisaient des moteurs à postcombustion pour atteindre une vitesse de Mach 2, tandis que les missiles à guidage radar et infrarouge amélioraient considérablement leur précision et leur puissance de feu."
 jet_interceptor_equipment_4:0 "Chasseur de supériorité aérienne de génération 2+"
 jet_interceptor_equipment_4_short:0 "ASF de génération 2+"
 jet_interceptor_equipment_4_desc:0 "Une nouvelle extension des capacités serait nécessaire pour les avions de deuxième génération. Des points d'ancrage supplémentaires, des ailes plus effilées et l'introduction des ailes delta commencent à devenir la norme."
 jet_interceptor_equipment_5:0 "Chasseur de supériorité aérienne de troisième génération"
 jet_interceptor_equipment_5_short:0 "ASF de génération 3"
 jet_interceptor_equipment_5_desc:0 "La prochaine génération d'intercepteurs à longue portée. Ils devaient être équipés d'une large gamme d'armes et d'autres munitions, telles que des missiles air-air, et être capables de viser au-delà du champ visuel. Leur avionique comprenait un radar Doppler à impulsions, un système de visée hors champ et un système d'alerte de terrain."
 jet_interceptor_equipment_6:0 "Chasseur de supériorité aérienne de génération 3+"
 jet_interceptor_equipment_6_short:0 "ASF de génération 3+"
 jet_interceptor_equipment_6_desc:0 "L'arrivée de moteurs à double flux plus économiques a permis d'augmenter l'autonomie et la durée des sorties, tandis que l'augmentation de la poussée n'a pu améliorer que partiellement les performances et la maniabilité sur toute la plage de vitesse. Certains concepteurs ont eu recours à la géométrie variable ou à la poussée vectorielle pour tenter de concilier ces contraires."
 jet_interceptor_equipment_7:0 "Chasseur de supériorité aérienne de génération 3++"
 jet_interceptor_equipment_7_short:0 "ASF de génération 3++"
 jet_interceptor_equipment_7_desc:0 "Poursuite du développement des ailes à géométrie variable, extension de la portée et amélioration des radars et du contrôle de tir afin de suivre les progrès technologiques rapides vers la 4e génération d'avions de combat."
 jet_interceptor_equipment_8:0 "Chasseur de supériorité aérienne de quatrième génération"
 jet_interceptor_equipment_8_short:0 "ASF de génération 4"
 jet_interceptor_equipment_8_desc:0 "Après les succès mitigés de la génération précédente d'intercepteurs, des technologies avancées ont été développées, telles que le commandement électrique, les matériaux composites, des rapports poussée/poids supérieurs à l'unité, l'hypermanœuvrabilité, l'avionique numérique avancée et des capteurs tels que le radar synthétique et la recherche et le suivi infrarouges, ainsi que la furtivité."
 jet_interceptor_equipment_9:0 "Chasseur de supériorité aérienne de génération 4+"
 jet_interceptor_equipment_9_short:0 "ASF de génération 4+"
 jet_interceptor_equipment_9_desc:0 "Comme la génération précédente semblait fragmentaire, les concepteurs sont revenus en priorité au chasseur, mais en prévoyant des rôles de soutien comme développements anticipés. Une maniabilité encore plus extrême avec, respectivement, des tuyères d'échappement renforcées pour le viffing (vectorisation en vol vers l'avant) et le contrôle des manœuvres à des angles d'attaque élevés."
 stealth_fighter_equipment_1:0 "Chasseur de supériorité aérienne de génération 5"
 stealth_fighter_equipment_1_short:0 "ASF de génération 5"
 stealth_fighter_equipment_1_desc:0 "La nouvelle génération d'avions intercepteurs avancés apparue au cours des premières décennies du XXIe siècle est désormais connue sous le nom de « cinquième génération ». Les caractéristiques qui définissent ces intercepteurs de cinquième génération ne font pas l'unanimité et tous les modèles de cinquième génération ne les possèdent pas nécessairement toutes. Certaines classifications comptent plus de cinq générations avant la nouvelle génération émergente."
 high_mach_jet_interceptor_equipment_1:0 "Intercepteur à réaction à grande vitesse I"
 high_mach_jet_interceptor_equipment_1_short:0 "HS Intercepteur I"
 high_mach_jet_interceptor_equipment_1_desc:0 "Capable d'atteindre Mach 2, alors que les bombardiers ennemis choisissent de voler de plus en plus haut afin de larguer leurs bombes, un nouveau type d'avion intercepteur est nécessaire, capable de voler plus haut et plus vite que jamais auparavant."
 high_mach_jet_interceptor_equipment_2:0 "Intercepteur à réaction à grande vitesse II"
 high_mach_jet_interceptor_equipment_2_short:0 "HS Intercepteur II"
 high_mach_jet_interceptor_equipment_2_desc:0 "Capable d'atteindre Mach 2+, cet intercepteur encore plus rapide et capable de voler à plus haute altitude a été spécialement conçu pour protéger contre les bombardiers à longue portée volant à haute altitude."
 high_mach_jet_interceptor_equipment_3:0 "Intercepteur à réaction à grande vitesse III"
 high_mach_jet_interceptor_equipment_3_short:0 "HS Intercepteur III"
 high_mach_jet_interceptor_equipment_3_desc:0 "Intercepteur à haute altitude capable d'atteindre Mach 3. Conçu spécifiquement pour l'interception défensive contre les avions ennemis attaquants, en particulier les bombardiers et les avions de reconnaissance. Les avions de ce type sont parfois appelés intercepteurs à grande vitesse."
 high_mach_jet_interceptor_equipment_4:0 "Intercepteur à réaction à grande vitesse IV"
 high_mach_jet_interceptor_equipment_4_short:0 "HS Intercepteur IV"
 high_mach_jet_interceptor_equipment_4_desc:0 "Intercepteur à haute altitude capable d'atteindre une vitesse supérieure à Mach 3. Conçu spécifiquement pour l'interception défensive contre les avions ennemis attaquants, en particulier les bombardiers et les avions de reconnaissance. Les avions de ce type sont parfois appelés intercepteurs avancés à grande vitesse."
 recon_equipment_0:0 "Avion de Reconnaissance I"
 recon_equipment_0_short:0 "Avion de Reconnaissance I"
 recon_equipment_0_desc:0 "La capacité à surveiller un champ de bataille depuis les airs est une compétence clé qui s'est révélée essentielle dès la Première Guerre mondiale. La Seconde Guerre mondiale allait encore l'étendre grâce à des avions légers spécialement conçus pour observer un champ de bataille pendant de longues périodes."
 jet_recon_equipment_0:0 "Avion de Reconnaissance II"
 jet_recon_equipment_0_short:0 "Avion de Reconnaissance II"
 jet_recon_equipment_0_desc:0 "Avec l'arrivée des avions de reconnaissance dans l'ère des avions à réaction, il est nécessaire d'améliorer les performances, d'allonger les temps de vol et d'améliorer la visibilité."
 jet_recon_equipment_1:0 "Avion de Reconnaissance III"
 jet_recon_equipment_1_short:0 "Avion de Reconnaissance III"
 jet_recon_equipment_1_desc:0 "Conçus pour des opérations à grande vitesse et à basse altitude, les aéronefs de ce type sont équipés de caméras montées à l'avant, capables de cartographier rapidement une zone."
 jet_recon_equipment_2:0 "Avion de Reconnaissance IV"
 jet_recon_equipment_2_short:0 "Avion de Reconnaissance IV"
 jet_recon_equipment_2_desc:0 "Partageant certaines pièces avec les avions polyvalents de leur époque, ces appareils sont équipés soit de caméras intégrées dans le nez, soit d'un pod de reconnaissance capable de cartographier une zone."
 cv_jet_multirole_equipment:0 "Chasseur multirôle CV"
 cv_jet_multirole_equipment_1:0 "Chasseur multirôle de première génération"
 cv_jet_multirole_equipment_1_short:0 "Chasseur multirôle de première génération (CV)"
 cv_jet_multirole_equipment_1_desc:0 "Les augmentations de vitesse précédentes sont insignifiantes comparées à l'introduction des premiers avions de chasse à réaction navals. Même si nous devons encore apprendre à construire les avions les mieux adaptés à ces moteurs, les avions de chasse classiques ne peuvent rivaliser."
 cv_jet_multirole_equipment_2:0 "Chasseur embarqué multirôle de génération 1+"
 cv_jet_multirole_equipment_2_short:0 "Chasseur multirôle de génération 1+ (CV)"
 cv_jet_multirole_equipment_2_desc:0 "L'introduction de l'aile en flèche permet d'atteindre des vitesses transsoniques, mais la maniabilité reste souvent limitée à ces vitesses. Ces avions étaient généralement destinés à assurer la supériorité aérienne."
 cv_jet_multirole_equipment_3:0 "Chasseur embarqué multirôle de deuxième génération "
 cv_jet_multirole_equipment_3_short:0 "Chasseur multirôle de génération 2 (CV)"
 cv_jet_multirole_equipment_3_desc:0 "La guerre de Corée de 1950-1953 a imposé une refonte majeure. Les armes à feu se sont révélées inadaptées à des vitesses aussi élevées, tandis que la nécessité d'une capacité multirôle dans le soutien au combat a été redécouverte. Les intercepteurs apparus après la guerre utilisaient des moteurs à postcombustion pour atteindre une vitesse de Mach 2, tandis que les missiles à guidage radar et infrarouge amélioraient considérablement leur précision et leur puissance de feu."
 cv_jet_multirole_equipment_4:0 "Chasseur embarqué multirôle de génération 2+"
 cv_jet_multirole_equipment_4_short:0 "Chasseur multirôle de génération 2+ (CV)"
 cv_jet_multirole_equipment_4_desc:0 "Une nouvelle extension des capacités serait nécessaire pour les avions navals de deuxième génération, qui exigeraient une approche plus polyvalente. Des points d'ancrage supplémentaires, des ailes plus effilées et l'introduction des ailes delta."
 cv_jet_multirole_equipment_5:0 "Chasseur embarqué multirôle de troisième génération"
 cv_jet_multirole_equipment_5_short:0 "Chasseur multirôle de génération 3 (CV)"
 cv_jet_multirole_equipment_5_desc:0 "La prochaine génération d'intercepteurs à longue portée. Ils devaient être équipés d'une large gamme d'armes et d'autres munitions, telles que des missiles air-air, et être capables de viser au-delà du champ visuel. Leur avionique comprenait un radar Doppler à impulsions, un système de visée hors champ et un système d'alerte de terrain."
 cv_jet_multirole_equipment_6:0 "Chasseur embarqué multirôle de génération 3+"
 cv_jet_multirole_equipment_6_short:0 "Chasseur multirôle de génération 3+ (CV)"
 cv_jet_multirole_equipment_6_desc:0 "L'arrivée de moteurs à double flux plus économiques a permis d'augmenter l'autonomie et la durée des sorties, tandis que l'augmentation de la poussée n'a pu améliorer que partiellement les performances et la maniabilité sur toute la plage de vitesse. Certains concepteurs ont eu recours à la géométrie variable ou à la poussée vectorielle pour tenter de concilier ces contraires."
 cv_jet_multirole_equipment_7:0 "Chasseur embarqué multirôle de génération 3++"
 cv_jet_multirole_equipment_7_short:0 "Chasseur multirôle de génération 3++ (CV)"
 cv_jet_multirole_equipment_7_desc:0 "Poursuite du développement des ailes à géométrie variable, extension de la portée et amélioration des radars et du contrôle de tir afin de suivre les progrès technologiques rapides vers la 4e génération d'avions de combat navals."
 cv_jet_multirole_equipment_8:0 "Chasseur embarqué multirôle de quatrième génération"
 cv_jet_multirole_equipment_8_short:0 "Chasseur embarqué multirôle de 4e génération (CV)"
 cv_jet_multirole_equipment_8_desc:0 "Après les succès mitigés de la génération précédente d'intercepteurs, des technologies avancées ont été développées, telles que le commandement électrique, les matériaux composites, des rapports poussée/poids supérieurs à l'unité, l'hypermanœuvrabilité, l'avionique numérique avancée et des capteurs tels que le radar synthétique et la recherche et le suivi infrarouges, ainsi que la furtivité."
 cv_jet_multirole_equipment_9:0 "Chasseur embarqué multirôle de génération 4+"
 cv_jet_multirole_equipment_9_short:0 "Chasseur embarqué multirôle de génération 4+ (CV)"
 cv_jet_multirole_equipment_9_desc:0 "Comme la génération précédente semblait fragmentaire, les concepteurs sont revenus en priorité au chasseur, mais en prévoyant des rôles de soutien comme développements anticipés. Une maniabilité encore plus extrême avec, respectivement, des tuyères d'échappement renforcées pour le viffing (vectorisation en vol vers l'avant) et le contrôle des manœuvres à des angles d'attaque élevés."
 cv_jet_multirole_equipment_10:0 "Chasseur embarqué multirôle de génération 4++"
 cv_jet_multirole_equipment_10_short:0 "Chasseur embarqué multirôle de génération 4++ (CV)"
 cv_jet_multirole_equipment_10_desc:0 "Les versions ultérieures de ces appareils et d'autres ont progressivement amélioré leurs technologies caractéristiques et intégré de plus en plus les caractéristiques les uns des autres, tout en adoptant certaines technologies émergentes de cinquième génération, telles que les communications numériques à haute capacité. Ces chasseurs sont ce qui se rapproche le plus d'un avion entièrement numérique et avancé sans caractéristiques furtives avancées."
 cv_mr_stealth_fighter_equipment_1:0 "Chasseur embarqué multirôle de cinquième génération"
 cv_mr_stealth_fighter_equipment_1_short:0 "Chasseur embarqué multirôle de 5e génération (CV)"
 cv_mr_stealth_fighter_equipment_1__desc:0 "La nouvelle génération d'avions embarqués avancés apparue au cours des premières décennies du XXIe siècle est désormais connue sous le nom de « cinquième génération ». Les caractéristiques qui définissent ces intercepteurs de cinquième génération ne font pas l'unanimité et tous les modèles de cinquième génération ne les possèdent pas nécessairement toutes. Certaines classifications comptent plus de cinq générations avant la nouvelle génération émergente."
 cv_jet_CAS_equipment_1:0 "Appui aérien rapproché par avion à réaction embarqué I"
 cv_jet_CAS_equipment_1_short:0 "Appui aérien rapproché par avion à réaction embarqué I (CV)"
 cv_jet_CAS_equipment_1_desc:0 "Avion d'attaque léger naval équipé d'armes air-sol, spécialement conçu pour le soutien aérien rapproché des troupes au sol et doté de capacités air-navire."
 cv_jet_CAS_equipment_2:0 "Appui aérien rapproché par avion à réaction embarqué II"
 cv_jet_CAS_equipment_2_short:0 "Appui aérien rapproché par avion à réaction embarqué II (CV)"
 cv_jet_CAS_equipment_2_desc:0 "Un avion d'attaque léger navalisé modernisé, équipé d'armement air-sol, spécialement conçu pour le soutien aérien rapproché des troupes au sol et doté de capacités air-navire."
 cv_jet_CAS_equipment_3:0 "Appui aérien rapproché par avion à réaction embarqué III"
 cv_jet_CAS_equipment_3_short:0 "Appui aérien rapproché par avion à réaction embarqué III (CV)"
 cv_jet_CAS_equipment_3_desc:0 "Une deuxième génération d'avions d'appui aérien rapproché naval dotés de capacités air-sol et air-navire dédiées."
 cv_jet_CAS_equipment_4:0 "Appui aérien rapproché par avion à réaction embarqué IV"
 cv_jet_CAS_equipment_4_short:0 "Appui aérien rapproché par avion à réaction embarqué IV (CV)"
 cv_jet_CAS_equipment_4_desc:0 "Une deuxième génération d'avions d'appui aérien rapproché naval dotés de capacités air-sol et air-navire dédiées et d'une mécanique de vol améliorée."
 cv_jet_CAS_equipment_5:0 "Appui aérien rapproché par avion à réaction embarqué V"
 cv_jet_CAS_equipment_5_short:0 "Appui aérien rapproché par avion à réaction embarqué V (CV)"
 cv_jet_CAS_equipment_5_desc:0 "Un avion d'appui aérien rapproché de troisième génération doté de capacités air-sol et air-navire étendues, ainsi que de systèmes de navigation et d'attaque de base."
 cv_jet_CAS_equipment_6:0 "Appui aérien rapproché par avion à réaction embarqué VI"
 cv_jet_CAS_equipment_6_short:0 "Appui aérien rapproché par avion à réaction embarqué VI (CV)"
 cv_jet_CAS_equipment_6_desc:0 "Une troisième génération d'avions d'appui aérien rapproché naval dotés de capacités air-sol et air-navire étendues, d'un bus de données, de systèmes de navigation et d'acquisition de cibles modernisés."
 cv_jet_CAS_equipment_7:0 "Appui aérien rapproché par avion à réaction embarqué VII"
 cv_jet_CAS_equipment_7_short:0 "Appui aérien rapproché par avion à réaction embarqué VII (CV)"
 cv_jet_CAS_equipment_7_desc:0 "Une troisième génération d'avions d'appui aérien rapproché naval dotés de capacités air-sol et air-navire avancées, de systèmes de navigation et d'acquisition de cibles, y compris des systèmes FLIR de base et des désignateurs laser."
 cv_jet_CAS_equipment_8:0 "Appui aérien rapproché par avion à réaction embarqué VIII"
 cv_jet_CAS_equipment_8_short:0 "Appui aérien rapproché par avion à réaction embarqué VIII (CV)"
 cv_jet_CAS_equipment_8_desc:0 "Une quatrième génération d'avions d'appui aérien rapproché naval dotés de capacités étendues, notamment des désignateurs laser, des systèmes de localisation GPS et des commandes de vol électriques."
 cv_jet_CAS_equipment_9:0 "Appui aérien rapproché par avion à réaction embarqué IX"
 cv_jet_CAS_equipment_9_short:0 "Appui aérien rapproché par avion à réaction embarqué IX (CV)"
 cv_jet_CAS_equipment_9_desc:0 "Un avion d'appui aérien rapproché de quatrième génération doté d'un armement amélioré et de capacités accrues, notamment des désignateurs laser, des systèmes de localisation GPS, des commandes de vol électriques et des équipements FLIR et de vol de nuit avancés."
 cv_jet_CAS_equipment_10:0 "Appui aérien rapproché par avion à réaction embarqué X"
 cv_jet_CAS_equipment_10_short:0 "Appui aérien rapproché par avion à réaction embarqué X (CV)"
 cv_jet_CAS_equipment_10_desc:0 "Un avion d'appui aérien rapproché naval de quatrième génération plus plus, doté d'un armement encore plus développé et de capacités accrues, notamment des désignateurs laser, des systèmes de localisation GPS, des commandes de vol électriques et des capacités furtives de base."
 jump_jet_equipment_1:0 "Chasseur VTOL I"
 jump_jet_equipment_1_short:0 "Chasseur VTOL I"
 jump_jet_equipment_1_desc:0 "Présentation d'un nouveau type d'avion, l'avion à décollage et atterrissage verticaux (VTOL) est un avion capable de voler en stationnaire, de décoller et d'atterrir verticalement sans avoir besoin d'une piste."
 jump_jet_equipment_2:0 "Chasseur VTOL II"
 jump_jet_equipment_2_short:0 "Chasseur VTOL II"
 jump_jet_equipment_2_desc:0 "Un avion à décollage et atterrissage verticaux modernisé, doté de pièces plus standardisées, capable de jouer un rôle central dans l'aviation navale et même dans le soutien au sol."
 jump_jet_equipment_3:0 "Chasseur VTOL III"
 jump_jet_equipment_3_short:0 "Chasseur VTOL III"
 jump_jet_equipment_3_desc:0 "Aéronef à décollage et atterrissage verticaux de deuxième génération. Capable de voler avec une charge d'armes plus importante et une plus grande capacité en carburant."
 jump_jet_equipment_4:0 "Chasseur VTOL IV"
 jump_jet_equipment_4_short:0 "Chasseur VTOL IV"
 jump_jet_equipment_4_desc:0 "Une deuxième génération d'avions à décollage et atterrissage verticaux dotés d'une avionique plus avancée."
 jump_stealth_equipment_1:0 "Avion à décollage vertical furtif"
 jump_stealth_equipment_1_short:0 "Avion à décollage vertical furtif"
 jump_stealth_equipment_1_desc:0 "Un avion à décollage et atterrissage verticaux équipé de composants furtifs réduisant sa section radar et pouvant être équipé d'armements plus lourds grâce à la conception plus avancée de son moteur."
 nav_bomber_equipment_4:0 "Bombardier naval IV"
 nav_bomber_equipment_4_short:0 "Bombardier naval IV"
 nav_bomber_equipment_4_desc:0 "Un bombardier de patrouille navale de l'après-guerre équipé pour repérer et attaquer les sous-marins et les navires à l'aide de torpilles."
 nav_bomber_equipment_5:0 "Bombardier naval V"
 nav_bomber_equipment_5_short:0 "Bombardier naval V"
 nav_bomber_equipment_5_desc:0 "Un bombardier de patrouille navale amélioré, équipé pour détecter et attaquer les sous-marins et les navires à l'aide de torpilles."
 nav_bomber_equipment_6:0 "Bombardier naval VI"
 nav_bomber_equipment_6_short:0 "Bombardier naval VI"
 nav_bomber_equipment_7:0 "Bombardier naval VII"
 nav_bomber_equipment_7_short:0 "Bombardier naval VII"
 nav_bomber_equipment_6_desc:0 "Un bombardier de patrouille navale moderne équipé d'excellents systèmes sonar et radar permettant de détecter et d'engager des sous-marins et des navires à l'aide de torpilles et de missiles air-sol."
 nav_bomber_equipment_8:0 "Bombardier naval VIII"
 nav_bomber_equipment_8_short:0 "Bombardier naval VIII"
 nav_bomber_equipment_8_desc:0 "Un bombardier naval moderne équipé de systèmes sonar et radar avancés, capable de détecter et d'engager des sous-marins et des navires à l'aide de torpilles et de missiles air-sol sophistiqués."
 jet_tac_bomber_equipment_1:0 "Bombardier tactique à réaction I"
 jet_tac_bomber_equipment_1_short:0 "Bombardier tact. à réaction I"
 jet_tac_bomber_equipment_1_desc:0 "Un bombardier tactique à réaction de première génération permet d'augmenter la vitesse et la charge de bombes."
 jet_tac_bomber_equipment_2:0 "Bombardier tactique à réaction II"
 jet_tac_bomber_equipment_2_short:0 "Bombardier tact. à réaction II"
 jet_tac_bomber_equipment_2_desc:0 "Un bombardier tactique à réaction de deuxième génération doté d'ailes en flèche qui augmentent encore davantage sa vitesse."
 jet_tac_bomber_equipment_3:0 "Bombardier tactique à réaction III"
 jet_tac_bomber_equipment_3_short:0 "Bombardier tact. à réaction III"
 jet_tac_bomber_equipment_3_desc:0 "Bombardier tactique de troisième génération équipé d'un moteur à réaction, d'une aile en flèche, d'une capacité d'emport de munitions accrue et d'instruments de navigation améliorés."
 jet_tac_bomber_equipment_4:0 "Interdicteur I"
 jet_tac_bomber_equipment_4_short:0 "Interdicteur I"
 jet_tac_bomber_equipment_4_desc:0 "Un interdicteur est un type d'avion d'attaque qui opère loin derrière les lignes ennemies, dans le but exprès d'interdire les cibles militaires ennemies, notamment celles impliquées dans la logistique. Il vole souvent à grande vitesse et à basse altitude."
 jet_tac_bomber_equipment_5:0 "Interdicteur II"
 jet_tac_bomber_equipment_5_short:0 "Interdicteur II"
 jet_tac_bomber_equipment_5_desc:0 "Un interdicteur amélioré doté d'ailes en flèche permettant d'atteindre des vitesses plus élevées à basse altitude et capable de transporter une grande variété d'armements."
 jet_tac_bomber_equipment_6:0 "Interdicteur III"
 jet_tac_bomber_equipment_6_short:0 "Interdicteur III"
 jet_tac_bomber_equipment_6_desc:0 "Un interdicteur encore plus perfectionné, doté d'ailes en flèche lui permettant d'atteindre des vitesses plus élevées à basse altitude et capable de transporter une grande variété d'armements."
 jet_tac_bomber_equipment_7:0 "Interdicteur IV"
 jet_tac_bomber_equipment_7_short:0 "Interdicteur IV"
 jet_tac_bomber_equipment_7_desc:0 "Un interdicteur encore plus perfectionné, doté d'ailes en flèche lui permettant d'atteindre des vitesses plus élevées à basse altitude et capable de transporter une grande variété d'armements."
 jet_tac_bomber_equipment_8:0 "Interdicteur V"
 jet_tac_bomber_equipment_8_short:0 "Interdicteur V"
 jet_tac_bomber_equipment_8_desc:0 "Interdicteur moderne équipé d'un système de commandes de vol électriques et d'un cockpit numérique, présentant une faible section radar et disposant d'un grand nombre de points d'emport afin de mener à bien ses missions."
 stealth_tactical_bomber_equipment_1:0 "Interdicteur furtif I"
 stealth_tactical_bomber_equipment_1_short:0 "Interdicteur furtif I"
 stealth_tactical_bomber_equipment_1_desc:0 "Un interdicteur furtif de première génération doté de bonnes mesures de réduction radar et d'une soute à bombes interne peut engager une cible sans être repéré."
 stealth_tactical_bomber_equipment_2:0 "Interdicteur furtif II"
 stealth_tactical_bomber_equipment_2_short:0 "Interdicteur furtif II"
 stealth_tactical_bomber_equipment_2_desc:0 "Un interdicteur furtif de deuxième génération doté d'un revêtement furtif moderne, d'une section radar extrêmement faible et d'une capacité interne accrue pour les munitions."
 jet_strat_bomber_equipment_1:0 "Bombardier stratégique à réaction I"
 jet_strat_bomber_equipment_1_short:0 "Bombardier strat. à réaction I"
 jet_strat_bomber_equipment_1_desc:0 "Première génération de bombardiers stratégiques à ailes droites, propulsés par des réacteurs ou des turbopropulseurs, armés de bombes conventionnelles ou nucléaires."
 jet_strat_bomber_equipment_2:0 "Bombardier stratégique à réaction II"
 jet_strat_bomber_equipment_2_short:0 "Bombardier strat. à réaction II"
 jet_strat_bomber_equipment_2_desc:0 "La première génération de bombardiers stratégiques à ailes en flèche, propulsés par des réacteurs ou des turbopropulseurs, offrant une vitesse accrue et une plus grande capacité d'emport de bombes conventionnelles ou nucléaires."
 jet_strat_bomber_equipment_3:0 "Bombardier stratégique à réaction III"
 jet_strat_bomber_equipment_3_short:0 "Bombardier strat. à réaction III"
 jet_strat_bomber_equipment_3_desc:0 "La deuxième génération de bombardiers stratégiques à ailes en flèche, propulsés par des réacteurs ou des turbopropulseurs, volant plus haut et plus loin que leurs prédécesseurs."
 jet_strat_bomber_equipment_4:0 "Bombardier stratégique à réaction IV"
 jet_strat_bomber_equipment_4_short:0 "Bombardier strat. à réaction IV"
 jet_strat_bomber_equipment_4_desc:0 "La troisième génération de bombardiers stratégiques à réaction ou à turbopropulsion, équipés de missiles conventionnels à chute libre ou à croisière précoce et des systèmes de guidage associés nécessaires."
 jet_strat_bomber_equipment_5:0 "Bombardier stratégique à réaction V"
 jet_strat_bomber_equipment_5_short:0 "Bombardier strat. à réaction V"
 jet_strat_bomber_equipment_5_desc:0 "Une quatrième génération de bombardiers stratégiques à réaction équipés des premiers systèmes de commandes de vol électriques, de systèmes de guidage renouvelés et d'une capacité de missiles de croisière plus avancée."
 mach2stratbomber_equipment_1:0 "Bombardier stratégique Mach 2"
 mach2stratbomber_equipment_1_short:0 "Bombardier stratégique M.2"
 mach2stratbomber_equipment_1_desc:0 "Avec l'avènement d'intercepteurs très performants volant à haute altitude et dotés de capacités de base en matière de missiles sol-air, les bombardiers doivent non seulement voler plus haut, mais aussi plus vite qu'auparavant."
 mach2stratbomber_equipment_2:0 "Bombardier stratégique II Mach 2"
 mach2stratbomber_equipment_2_short:0 "Bombardier stratégique II M.2"
 mach2stratbomber_equipment_2_desc:0 "Bombardier stratégique capable d'atteindre une vitesse supérieure à Mach 2 et de voler encore plus vite grâce à de nouveaux instruments de navigation lui permettant de voler à ras du sol pour larguer ses armes meurtrières sur la cible."
 mach2stratbomber_equipment_3:0 "Bombardier stratégique III Mach 2"
 mach2stratbomber_equipment_3_short:0 "Bombardier stratégique III M.2"
 mach2stratbomber_equipment_3_desc:0 "Bombardier stratégique capable d'atteindre une vitesse supérieure à Mach 2, pouvant voler encore plus vite grâce à des instruments modernes basés sur le GPS qui lui permettent de voler à basse altitude, et à un système de commandes de vol électriques garantissant une grande réactivité."
 mach3stratbomber_equipment_1:0 "Bombardier stratégique Mach 3"
 mach3stratbomber_equipment_1_short:0 "Bombardier stratégique M.3"
 mach3stratbomber_equipment_1_desc:0 "Un bombardier stratégique capable d'atteindre Mach 3, volant encore plus vite que ses cousins capables d'atteindre Mach 2, mais nécessitant une technologie de pointe et des ressources coûteuses pour être construit."
 mach6stratbomber_equipment_1:0 "Bombardier stratégique Mach 6"
 mach6stratbomber_equipment_1_short:0 "Bombardier stratégique M.6"
 mach6stratbomber_equipment_1_desc:0 "Un bombardier stratégique capable d'atteindre Mach 6 volant près de l'orbite suborbitale afin de réduire les frottements. Cet engin spatial, dont la conception est incroyablement avancée, est extrêmement coûteux à construire et à entretenir."
 nuclearstratbomber_equipment_1:0 "Bombardier stratégique à propulsion nucléaire I"
 nuclearstratbomber_equipment_1_short:0 "Bombardier stratégique nucl. I"
 nuclearstratbomber_equipment_1_desc:0 "Un avion à propulsion nucléaire est un concept d'avion destiné à être propulsé par l'énergie nucléaire. L'objectif était de produire un moteur à réaction qui chaufferait l'air comprimé à l'aide de la chaleur issue de la fission, plutôt que de la chaleur issue de la combustion de carburant. Pendant la guerre froide, les États-Unis et l'Union soviétique ont mené des recherches sur les bombardiers à propulsion nucléaire, qui offraient une plus grande autonomie."
 nuclearstratbomber_equipment_2:0 "Bombardier stratégique à propulsion nucléaire II"
 nuclearstratbomber_equipment_2_short:0 "Bombardier stratégique nucl. II"
 nuclearstratbomber_equipment_2_desc:0 "Une tentative moderne de créer un avion à propulsion nucléaire destiné à voler presque en permanence. En raison de tous les blindages nécessaires pour le réacteur, les avions de ce type sont extrêmement coûteux à exploiter."
 stealth_strategic_bomber_equipment:0 "Bombardier furtif"
 stealth_strategic_bomber_equipment_1:0 "Bombardier furtif stratégique I"
 stealth_strategic_bomber_equipment_1_short:0 "Bombardier furtif I"
 stealth_strategic_bomber_equipment_1_desc:0 "Un bombardier furtif stratégique de première génération équipé d'une conception avancée et d'un revêtement furtif afin de pouvoir pénétrer profondément dans le territoire ennemi sans être détecté."
 stealth_strategic_bomber_equipment_2:0 "Bombardier furtif stratégique II"
 stealth_strategic_bomber_equipment_2_short:0 "Bombardier furtif II"
 stealth_strategic_bomber_equipment_2_desc:0 "Un bombardier furtif stratégique de deuxième génération équipé d'une conception avancée et d'un revêtement furtif afin de pouvoir pénétrer profondément dans le territoire ennemi sans être détecté."
 transport_plane_equipment_2:0 "Avion de transport II"
 transport_plane_equipment_2_short:0 "Transport II"
 transport_plane_equipment_2_desc:0 "Alors que la Seconde Guerre mondiale s'intensifiait vers le milieu des années 1940, la demande en avions de transport de plus grande capacité allait conduire à la création d'appareils plus spacieux, capables de transporter davantage de troupes et d'équipements."
 transport_plane_equipment_3:0 "Avion de transport III"
 transport_plane_equipment_3_short:0 "Transport III"
 transport_plane_equipment_3_desc:0 "La conception des avions de transport après la Seconde Guerre mondiale allait permettre l'utilisation de moteurs plus puissants, ce qui allait permettre aux avions du début des années 1950 de transporter encore plus de marchandises, d'équipements et de troupes."
 transport_plane_equipment_4:0 "Avion de transport IV"
 transport_plane_equipment_4_short:0 "Transport IV"
 transport_plane_equipment_4_desc:0 "L'après-guerre coréenne a accéléré la conception des avions, permettant aux avions à turbopropulsion de s'imposer comme de véritables transporteurs de marchandises et d'équipements volumineux."
 transport_plane_equipment_5:0 "Avion de transport V"
 transport_plane_equipment_5_short:0 "Transport V"
 transport_plane_equipment_5_desc:0 "Le milieu des années 1960 voit l'introduction des avions de transport à réaction et l'augmentation de l'autonomie des gros transporteurs de fret. Le ciel est littéralement la seule limite."
 transport_plane_equipment_6:0 "Avion de transport VI"
 transport_plane_equipment_6_short:0 "Transport VI"
 transport_plane_equipment_6_desc:0 "La disponibilité accrue de gros moteurs commerciaux permettrait aux gros transporteurs de marchandises de devenir encore plus grands. En outre, ces appareils de transport lourd intègrent de nouveaux éléments de conception innovants."
 transport_plane_equipment_7:0 "Avion de transport VII"
 transport_plane_equipment_7_short:0 "Transport VII"
 transport_plane_equipment_7_desc:0 "L'adoption à grande échelle des systèmes de commandes de vol électriques, l'ajout de réservoirs de carburant plus grands et la possibilité d'utiliser des sondes de ravitaillement en vol par ces gros transporteurs de fret rendent leur autonomie pratiquement illimitée."
 transport_plane_equipment_8:0 "Avion de transport VIII"
 transport_plane_equipment_8_short:0 "Transport VIII"
 transport_plane_equipment_8_desc:0 "Des moteurs encore plus puissants pour les gros avions de transport signifient que la mobilité aérienne atteint son apogée. Des brigades entières peuvent être déplacées par seulement une poignée d'avions-cargos de cette époque."
 transport_plane_equipment_9:0 "Avion de transport IX"
 transport_plane_equipment_9_short:0 "Transport IX"
 transport_plane_equipment_9_desc:0 "Les cockpits entièrement numériques deviennent la norme pour ces gros transporteurs de fret. Les systèmes de commandes de vol électriques ont atteint un niveau de maturité tel que les longs trajets pour ces avions, associés à leur maniabilité croissante, sont désormais un jeu d'enfant."
 transport_plane_equipment_10:0 "Avion de transport X"
 transport_plane_equipment_10_short:0 "Transport X"
 transport_plane_equipment_10_desc:0 "Le transport aérien moderne, avec sa grande capacité de fret, sa vitesse, sa capacité de ravitaillement en vol et sa capacité à voler à haute altitude, met le monde entier à la portée de ces avions de transport modernes."
 asm_0:0 "Missile antinavire I"
 asm_1:0 "Missile antinavire II"
 asm_2:0 "Missile antinavire III"
 asm_3:0 "Missile antinavire IV"
 heavyasm_0:0 "Missile antinavire lourd I"
 heavyasm_1:0 "Missile antinavire lourd II"
 heavyasm_2:0 "Missile antinavire lourd III"
 sam_long_range_0:0 "SAM longue portée I"
 sam_long_range_0_short:0 "SAM longue portée I"
 sam_long_range_0_desc:0 "Système de missile sol-air à longue portée de première génération."
 sam_long_range_1:0 "SAM longue portée II"
 sam_long_range_1_short:0 "SAM longue portée II"
 sam_long_range_1_desc:0 "Système de missiles sol-air à longue portée de deuxième génération avec une portée accrue."
 sam_long_range_2:0 "SAM longue portée III"
 sam_long_range_2_short:0 "SAM longue portée III"
 sam_long_range_2_desc:0 "Système de missile sol-air à longue portée de troisième génération offrant une plus grande maniabilité."
 sam_long_range_3:0 "SAM longue portée IV"
 sam_long_range_3_short:0 "SAM longue portée IV"
 sam_long_range_3_desc:0 "Système de missile sol-air à longue portée de quatrième génération offrant une excellente portée et un excellent suivi."
 sam_long_range_4:0 "SAM longue portée VI"
 sam_long_range_4_short:0 "SAM longue portée VI"
 sam_long_range_4_desc:0 "Système de missile sol-air à longue portée de 5e génération. Excellente portée, excellente capacité de suivi et excellente maniabilité du missile."
 sam_carrier_equipment_1:0 "Porte-missiles sol-air tactique I"
 sam_carrier_equipment_1_short:0 "Porte-missiles tactiques SAM I"
 sam_carrier_equipment_1_desc:0 "Système de missile sol-air à courte portée de base."
 sam_carrier_equipment_2:0 "Porte-missiles sol-air tactique II"
 sam_carrier_equipment_2_short:0 "Porte-missiles tactiques SAM II"
 sam_carrier_equipment_2_desc:0 "Système amélioré de missiles sol-air à courte portée."
 sam_carrier_equipment_3:0 "Porte-missiles sol-air tactique III"
 sam_carrier_equipment_3_short:0 "Porte-missiles tactiques SAM III"
 sam_carrier_equipment_3_desc:0 "Excellent système de missiles sol-air à courte portée doté d'un bon système de guidage."
 sam_carrier_equipment_4:0 "Porte-missiles sol-air tactique IV"
 sam_carrier_equipment_4_short:0 "Porte-missiles tactiques SAM IV"
 sam_carrier_equipment_4_desc:0 "Excellent système de missiles sol-air à courte portée, doté d'un bon guidage et d'une bonne maniabilité."
 sam_carrier_equipment_5:0 "Porte-missiles sol-air tactique V"
 sam_carrier_equipment_5_short:0 "Porte-missiles tactiques SAM V"
 sam_carrier_equipment_5_desc:0 "Système moderne de missiles sol-air à courte portée doté d'un excellent guidage et d'une grande maniabilité."
 sam_carrier_equipment_6:0 "Porte-missiles sol-air tactique VI"
 sam_carrier_equipment_6_short:0 "Porte-missiles tactiques SAM VI"
 sam_carrier_equipment_6_desc:0 "Système moderne de missiles sol-air à courte portée doté d'un guidage avancé et d'une grande maniabilité."
 atgm_equipment_0:0 "Missile guidé antichar I"
 atgm_equipment_0_short:0 "ATGM I"
 atgm_equipment_0_desc:0 "Un missile antichar guidé de première génération qui est guidé optiquement vers la cible."
 atgm_equipment_1:0 "Missile guidé antichar II"
 atgm_equipment_1_short:0 "ATGM II"
 atgm_equipment_1_desc:0 "Un missile antichar guidé amélioré, guidé optiquement vers une cible et doté d'une ogive plus puissante."
 atgm_equipment_2:0 "Missile guidé antichar III"
 atgm_equipment_2_short:0 "ATGM III"
 atgm_equipment_2_desc:0 "Missile antichar guidé doté d'un système de guidage plus perfectionné, guidé optiquement vers la cible et équipé d'une ogive plus perfectionnée."
 atgm_equipment_3:0 "Missile guidé antichar IV"
 atgm_equipment_3_short:0 "ATGM IV"
 atgm_equipment_3_desc:0 "Système amélioré de missile antichar électro-optique ou guidé par fil, équipé d'une ogive de grande taille."
 atgm_equipment_4:0 "Missile guidé antichar V"
 atgm_equipment_4_short:0 "ATGM V"
 atgm_equipment_4_desc:0 "Un système avancé de missiles antichars électro-optiques, guidés par laser ou par fil, doté d'une ogive capable de détruire les blindages les plus résistants."
 atgm_equipment_5:0 "Missile guidé antichar VI"
 atgm_equipment_5_short:0 "ATGM VI"
 atgm_equipment_5_desc:0 "Un système moderne de missiles antichars électro-optiques, guidés par laser ou par fil, doté d'une ogive capable de détruire les blindages les plus résistants."
 atgm_carrier_equipment_0:0 "Porteur de missiles antichars guidés I"
 atgm_carrier_equipment_0_short:0 "ATGM Carrier I"
 atgm_carrier_equipment_0_desc:0 "Véhicule porteur précoce équipé de missiles antichars guidés."
 atgm_carrier_equipment_1:0 "Porteur de missiles antichars guidés II"
 atgm_carrier_equipment_1_short:0 "ATGM Carrier II"
 atgm_carrier_equipment_1_desc:0 "Véhicule équipé d'un missile antichar guidé amélioré."
 atgm_carrier_equipment_2:0 "Porteur de missiles antichars guidés III"
 atgm_carrier_equipment_2_short:0 "ATGM Carrier III"
 atgm_carrier_equipment_2_desc:0 "Véhicule porteur équipé d'un missile antichar guidé plus lourd."
 atgm_carrier_equipment_3:0 "Porteur de missiles antichars guidés IV"
 atgm_carrier_equipment_3_short:0 "ATGM Carrier IV"
 atgm_carrier_equipment_3_desc:0 "Un missile antichar guidé avancé monté sur un véhicule doté d'une bonne mobilité."
 atgm_carrier_equipment_4:0 "Porteur de missiles antichars guidés V"
 atgm_carrier_equipment_4_short:0 "ATGM Carrier V"
 atgm_carrier_equipment_4_desc:0 "Un système moderne de missiles antichars guidés monté sur un véhicule doté d'une bonne mobilité."
 cruisemissile_equipment_0:0 "Missile de croisière d'attaque terrestre I"
 cruisemissile_equipment_0_short:0 "Missile de croisière I"
 cruisemissile_equipment_0_desc:0 "Un missile de croisière d'attaque terrestre (LACM) de première génération basé sur des modèles allemands de la Seconde Guerre mondiale."
 cruisemissile_equipment_1:0 "Missile de croisière d'attaque terrestre II"
 cruisemissile_equipment_1_short:0 "Missile de croisière II"
 cruisemissile_equipment_1_desc:0 "Un missile de croisière d'attaque terrestre (LACM) de deuxième génération avec une charge utile plus importante."
 cruisemissile_equipment_2:0 "Missile de croisière d'attaque terrestre III"
 cruisemissile_equipment_2_short:0 "Missile de croisière III"
 cruisemissile_equipment_2_desc:0 "Un missile de croisière d'attaque terrestre (LACM) de troisième génération doté d'une vitesse supérieure."
 cruisemissile_equipment_3:0 "Missile de croisière d'attaque terrestre IV"
 cruisemissile_equipment_3_short:0 "Missile de croisière IV"
 cruisemissile_equipment_3_desc:0 "Un missile de croisière d'attaque terrestre (LACM) de quatrième génération, doté d'une grande vitesse, d'une bonne charge utile et d'une capacité à reconnaître une cible mobile."
 cruisemissile_equipment_4:0 "Missile de croisière d'attaque terrestre V"
 cruisemissile_equipment_4_short:0 "Missile de croisière V"
 cruisemissile_equipment_4_desc:0 "Un missile de croisière d'attaque terrestre (LACM) de cinquième génération équipé d'un radar de suivi du relief."
 cruisemissile_equipment_5:0 "Missile de croisière d'attaque terrestre VI"
 cruisemissile_equipment_5_short:0 "Missile de croisière VI"
 cruisemissile_equipment_5_desc:0 "Un missile de croisière d'attaque terrestre (LACM) de cinquième génération équipé d'un radar de suivi du relief et capable d'esquiver les tirs ennemis."
 cruisemissile_equipment_6:0 "Missile de croisière d'attaque terrestre VI"
 cruisemissile_equipment_6_short:0 "Missile de croisière VI"
 cruisemissile_equipment_6_desc:0 "Un missile de croisière moderne LACM (Land Attack Cruise Missile) équipé d'un radar de suivi du relief, capable d'esquiver les tirs ennemis et d'atteindre sa cible avec une précision extrême."
 slbm_equipment_1:0 "SLBM I"
 slbm_equipment_1_short:0 "SLBM I"
 slbm_equipment_1_desc:0 "Système de missiles balistiques lancés à partir de sous-marins, développé à partir d'expériences menées peu après la fin de la Seconde Guerre mondiale."
 slbm_equipment_2:0 "SLBM II"
 slbm_equipment_2_short:0 "SLBM II"
 slbm_equipment_2_desc:0 "Les SLBM sont des missiles balistiques lancés à partir de sous-marins. Il s'agit de missiles balistiques pouvant être lancés à partir de sous-marins. Les variantes modernes sont généralement équipées de plusieurs ogives indépendantes à cibles multiples (MIRV), chacune transportant une tête nucléaire, ce qui permet à un seul missile lancé de frapper plusieurs cibles. Les missiles balistiques lancés à partir de sous-marins fonctionnent différemment des missiles de croisière lancés à partir de sous-marins."
 slbm_equipment_3:0 "SLBM III"
 slbm_equipment_3_short:0 "SLBM III"
 slbm_equipment_3_desc:0 "Les SLBM sont des missiles balistiques lancés à partir de sous-marins. Il s'agit de missiles balistiques pouvant être lancés à partir de sous-marins. Les variantes modernes sont généralement équipées de plusieurs ogives indépendantes à cibles multiples (MIRV), chacune transportant une tête nucléaire, ce qui permet à un seul missile lancé de frapper plusieurs cibles. Les missiles balistiques lancés à partir de sous-marins fonctionnent différemment des missiles de croisière lancés à partir de sous-marins."
 slbm_equipment_4:0 "SLBM IV"
 slbm_equipment_4_short:0 "SLBM IV"
 slbm_equipment_4_desc:0 "Les SLBM sont des missiles balistiques lancés à partir de sous-marins. Il s'agit de missiles balistiques pouvant être lancés à partir de sous-marins. Les variantes modernes sont généralement équipées de plusieurs ogives indépendantes à cibles multiples (MIRV), chacune transportant une tête nucléaire, ce qui permet à un seul missile lancé de frapper plusieurs cibles. Les missiles balistiques lancés à partir de sous-marins fonctionnent différemment des missiles de croisière lancés à partir de sous-marins."
