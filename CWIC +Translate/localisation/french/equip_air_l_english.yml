 WGR_jet_light_equipment_2_desc:0 "Ce modèle était également produit à l'étranger dans le cadre d'accords de production sous licence en Allemagne de l'Ouest, en Finlande et en Israël. Le premier client à l'exportation du Magister fut l'Allemagne de l'Ouest, qui passa une commande initiale de 62 appareils directement auprès de Fouga ; 188 autres appareils furent produits par Flugzeug Union Süd, un consortium formé par Heinkel et Messerschmitt sous licence."
