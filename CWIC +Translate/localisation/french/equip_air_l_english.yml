 BEL_tac_bomber_equipment_3:0 "de Havilland Mosquito B"
 BEL_tac_bomber_equipment_3_short:0 "Mosquito B"
 BEL_jet_light_equipment_1:0 "Lockheed T-33 Shooting Star"
 BEL_jet_light_equipment_1_short:0 "T-33 Shooting Star"
 BEL_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80, d'abord sous le nom de TP-80C/TF-80C, puis sous celui de T-33A."
 BEL_jet_light_equipment_2:0 "Fouga CM.170R Magister"
 BEL_jet_light_equipment_2_short:0 "CM.170R Magister"
