 PRC_fighter_equipment_0:0 "Armée de l'air de l'Armée populaire de libération"
 PRC_fighter_equipment_0_short:0 "PLAAF"
 PRC_fighter_equipment_0_desc:0 "L'Armée de l'air de l'Armée populaire de libération, également connue sous le nom d'Armée de l'air chinoise ou Armée de l'air populaire, est une branche aérienne de l'Armée populaire de libération, les forces armées régulières de la République populaire de Chine. La PLAAF a été officiellement créée le 11 novembre 1949 et se compose de cinq branches : l'aviation, l'artillerie antiaérienne, les missiles sol-air (SAM), les radars et le corps aéroporté."
 PRC_fighter_equipment_1:0 "Nakajima Ki-43 Hayabusa"
 PRC_fighter_equipment_1_short:0 "Ki-43 Hayabusa"
 PRC_fighter_equipment_2:0 "Lavochkin La-7"
 PRC_fighter_equipment_2_short:0 "La-7"
 PRC_fighter_equipment_2_desc:0 "Le Lavochkin La-7 était un avion de chasse soviétique monoplace à moteur à pistons développé pendant la Seconde Guerre mondiale par le bureau d'études Lavochkin. Il s'agissait d'une version améliorée du Lavochkin La-5, et du dernier modèle d'une famille d'avions qui avait débuté avec le LaGG-1 en 1938."
 PRC_fighter_equipment_3:0 "Lavochkin La-9"
 PRC_fighter_equipment_3_short:0 "La-9"
 PRC_fighter_equipment_3_desc:0 "Le La-9 représente une évolution du prototype Lavochkin La-126. Le premier prototype, baptisé La-130, fut achevé en 1946. Sa ressemblance avec le célèbre Lavochkin La-7 n'était que superficielle : le nouveau chasseur était entièrement construit en métal et doté d'une aile à écoulement laminaire. La réduction du poids due à l'élimination du bois de la cellule permit d'augmenter considérablement la capacité en carburant et d'armer l'appareil de quatre canons. Des simulations de combat ont démontré que le La-130 était à égalité avec le La-7, mais inférieur au Yakovlev Yak-3 dans les plans horizontaux. Le nouveau chasseur, officiellement désigné La-9, est entré en production en août 1946. Au total, 1 559 appareils ont été construits jusqu'à la fin de la production en 1948."
