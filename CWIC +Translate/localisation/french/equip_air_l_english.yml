 NOR_jet_interceptor_equipment_1_short:0 "Meteor F.4"
 NOR_jet_interceptor_equipment_2:0 "North American F-86K Sabre"
 NOR_jet_interceptor_equipment_2_short:0 "F-86K Sabre"
 NOR_CAS_equipment_1:0 "de Havilland DH.82 Tiger Moth"
 NOR_CAS_equipment_1_short:0 "DH.82 Tiger Moth"
 NOR_CAS_equipment_2:0 "Caproni Ca.310"
 NOR_CAS_equipment_2_short:0 "Ca.310"
 NOR_CAS_equipment_3:0 "Hawker Typhoon Mk.Ib/Late"
 NOR_CAS_equipment_3_short:0 "Typhoon Mk.Ib/Late"
 NOR_CAS_equipment_3_desc:0 "Le Hawker Typhoon était un avion de chasse-bombardier britannique principalement utilisé par la Royal Air Force (RAF) pendant la Seconde Guerre mondiale. Le Typhoon Mk.Ib/Late était une version améliorée des premiers Hawker Typhoon, dotée d'une nouvelle verrière en forme de bulle."
 NOR_CAS_equipment_4:0 "Hawker Tempest Mk.II"
 NOR_CAS_equipment_4_short:0 "Tempest Mk.II"
 NOR_jet_CAS_equipment_1:0 "Republic F-84E Thunderjet"
 NOR_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 NOR_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 NOR_jet_CAS_equipment_2:0 "Republic F-84G Thunderjet"
 NOR_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 NOR_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 NOR_jet_CAS_equipment_3:0 "Republic F-84F Thunderstreak"
 NOR_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 NOR_jet_CAS_equipment_3_desc:0 "Développé à partir du F-84 Thunderjet précédent, le F-84F était une variante à ailes en flèche du chasseur-bombardier, conçue pour rapprocher ce type d'appareil des performances du très vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances au décollage, tout en offrant une stabilité et un contrôle médiocres. Ce modèle a été utilisé de manière limitée tout au long de sa carrière, qui s'est terminée en 1971. Son surnom est « Thunderstreak »."
 NOR_jet_light_equipment_1:0 "Lockheed T-33 Shooting Star"
 NOR_jet_light_equipment_1_short:0 "T-33 Shooting Star"
 NOR_jet_light_equipment_2:0 "de Havilland Vampire FB.6"
 NOR_jet_light_equipment_2_short:0 "Vampire FB.6"
 NOR_jet_light_equipment_2_desc:0 ""
 NOR_jet_light_equipment_3:0 "Northrop F-5A Freedom Fighter"
 NOR_jet_light_equipment_3_short:0 "F-5A Freedom Fighter"
 NOR_jet_light_equipment_3_desc:0 "Le F-5A a été développé comme un avion de chasse léger destiné principalement à l'exportation. Il est plus léger et moins coûteux à produire que la plupart des autres chasseurs modernes, ce qui le rend idéal pour compléter les escadrons de chasseurs à courte portée. Malgré cela, ce modèle s'est révélé très maniable et était l'avion le plus à même de rivaliser avec le MiG-21 « Fishbed » soviétique. Comme il était utilisé par la majorité des alliés des États-Unis au plus fort de la guerre froide, il a été baptisé à juste titre « Freedom Fighter » (combattant de la liberté)."
 NOR_jet_light_equipment_4:0 "Northrop F-5B Freedom Fighter"
 NOR_jet_light_equipment_4_short:0 "F-5B Freedom Fighter"
 NOR_jet_light_equipment_4_desc:0 "L'avion américain Northrop F-5B Freedom Fighter utilisé par l'armée de l'air royale norvégienne. Principalement utilisé comme avion d'entraînement pour d'autres avions à réaction multirôles, il était équipé de points d'emport pour le transport de munitions."
 NOR_jet_light_equipment_5:0 "Northrop F-5A Freedom Fighter PUFF"
 NOR_jet_light_equipment_5_short:0 "F-5A PUFF"
 NOR_jet_light_equipment_5_desc:0 "Les F-5A norvégiens ont bénéficié d'une série de mises à niveau tout au long de leur service, notamment pour assurer leur compatibilité avec les missiles air-sol guidés (tels que Maverick et Shrike), l'installation de systèmes ECM et l'amélioration de l'avionique. Le F-5A PUFF est une variante capable de SEAD."
 NOR_recon_equipment_0:0 "Supermarine Spitfire PR.XI"
 NOR_recon_equipment_0_short:0 "Spitfire PR.XI"
 NOR_recon_equipment_0_desc:0 "Variante de reconnaissance photographique du vénérable Supermarine Spitfire équipée d'appareils photo."
 NOR_jet_recon_equipment_0:0 "Lockheed RT-33A Shooting Star"
 NOR_jet_recon_equipment_0_short:0 "RT-33A Shooting Star"
 NOR_jet_recon_equipment_0_desc:0 "RT-33A modifié avant livraison en version monoplace de reconnaissance ; 85 exemplaires construits, principalement pour l'exportation dans le cadre du programme d'aide militaire."
 NOR_jet_recon_equipment_1:0 "Northrop RF-5A Freedom Fighter"
 NOR_jet_recon_equipment_1_short:0 "RF-5A Freedom Fighter"
 NOR_jet_recon_equipment_1_desc:0 "Version de reconnaissance monoplace pour les forces armées norvégiennes, équipée de caméras."
 NOR_jet_recon_equipment_2:0 "Lockheed RF-16AM Fighting Falcon"
 NOR_jet_recon_equipment_2_short:0 "RF-16AM Fighting Falcon"
 NOR_jet_recon_equipment_2_desc:0 "La désignation RF-16A est toutefois utilisée par l'armée de l'air royale danoise. Au début de l'année 1994, 10 F-16A danois ont été redésignés comme avions de reconnaissance tactique RF-16A, remplaçant les RF-35 Drakens retirés à la fin de l'année 1993. À titre provisoire, ils ont d'abord été équipés des caméras optiques et des capteurs électro-optiques (E-O) des Drakens, réinstallés dans une nacelle de reconnaissance Per Udsen « Red Baron », qui ont été remplacés quelques années plus tard par la nacelle de reconnaissance modulaire (MRP) de Per Udsen."
