 FRA_CAS_equipment_4:0 "Douglas A-26C Invader"
 FRA_CAS_equipment_4_short:0 "A-26C Invader"
 FRA_jet_CAS_equipment_1:0 "Republic F-84E Thunderjet"
 FRA_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 FRA_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 FRA_jet_CAS_equipment_2:0 "Dassault MD.454 Mystère IVA"
 FRA_jet_CAS_equipment_2_short:0 "Mystère IVA"
 FRA_jet_CAS_equipment_2_desc:0 "Le Dassault MD.454 Mystère IV est un avion de chasse-bombardier français des années 1950, le premier avion transsonique à entrer en service dans l'armée de l'air française. Il a été utilisé dans des combats à grande échelle par l'armée de l'air israélienne pendant la guerre des Six Jours en 1967."
 FRA_jet_CAS_equipment_3:0 "Republic F-84F Thunderstreak"
 FRA_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 FRA_jet_CAS_equipment_3_desc:0 "Développé à partir du F-84 Thunderjet précédent, le F-84F était une variante à ailes en flèche du chasseur-bombardier, conçue pour rapprocher ce type d'appareil des performances du très vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances au décollage, tout en offrant une stabilité et un contrôle médiocres. Ce modèle a été utilisé de manière limitée tout au long de sa carrière, qui s'est terminée en 1971. Son surnom est « Thunderstreak »."
 FRA_jet_CAS_equipment_4:0 "Dassault Super Mystere B.2"
 FRA_jet_CAS_equipment_4_short:0 "Super Mystere B.2"
 FRA_jet_CAS_equipment_5:0 "Dassault Super Mystere B.2 MLU"
 FRA_jet_CAS_equipment_5_short:0 "Super Mystere B.2 MLU"
 FRA_jet_CAS_equipment_6:0 "SEPECAT Jaguar A"
 FRA_jet_CAS_equipment_6_short:0 "Jaguar A"
 FRA_jet_CAS_equipment_7:0 "SEPECAT Jaguar A/75"
 FRA_jet_CAS_equipment_7_short:0 "Jaguar A/75"
 FRA_jet_CAS_equipment_8:0 "SEPECAT Jaguar A/75 MLU"
 FRA_jet_CAS_equipment_8_short:0 "Jaguar A/75 MLU"
 FRA_cas_stealth_equipment_1:0 "Dassault Mirage F1CT"
 FRA_cas_stealth_equipment_1_short:0 "Mirage F1CT"
 FRA_jet_light_equipment_1:0 "Lockheed T-33 Shooting Star"
 FRA_jet_light_equipment_1_short:0 "T-33 Shooting Star"
 FRA_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80, d'abord sous le nom de TP-80C/TF-80C, puis sous celui de T-33A."
