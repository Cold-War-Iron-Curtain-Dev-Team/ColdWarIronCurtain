 JAP_strat_bomber_equipment_1_short:0 "Ki-21"
 JAP_strat_bomber_equipment_2:0 "Mitsubishi G7M"
 JAP_strat_bomber_equipment_2_short:0 "G4M"
 JAP_strat_bomber_equipment_3:0 "Nakajima G8N Renzan"
