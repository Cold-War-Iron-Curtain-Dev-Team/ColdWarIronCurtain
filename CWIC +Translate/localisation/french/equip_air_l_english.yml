 AST_jet_multirole_equipment_9:0 "GAF/McDonnell Douglas F-18A Hornet"
 AST_jet_multirole_equipment_9_short:0 "F-18A Hornet"
 AST_jet_multirole_equipment_9_desc:0 "La Royal Australian Air Force (RAAF) utilise des avions de combat McDonnell Douglas F/A-18 Hornet depuis 1984. Le gouvernement australien a acheté 75 variantes A et B du F/A-18 en 1981 pour remplacer les chasseurs Dassault Mirage III de la RAAF."
 AST_jet_multirole_equipment_10:0 "GAF/McDonnell Douglas F/A-18A Hornet HUG (programme de modernisation du Hornet)"
 AST_jet_multirole_equipment_10_short:0 "F/A-18A Hornet HUG"
 AST_jet_multirole_equipment_10_desc:0 "Le programme de modernisation des Hornet (HUG) a débuté en 1999 et s'est déroulé en trois phases principales. Au cours de la phase 1, qui s'est étendue de mi-2000 à 2002, les systèmes informatiques, le système de navigation et la radio des Hornet ont été remplacés. Les appareils ont également été équipés pour utiliser les missiles air-air ASRAAM, qui ont remplacé les AIM-9 Sidewinder."
 AST_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 AST_mr_stealth_fighter_equipment_1_short:0 "F-35A Lightning II"
 AST_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnels (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le programme F-35 a débuté en 1992, la variante A ayant pris son envol fin 2006 et largué ses premières bombes moins de six ans plus tard. La variante A est la plus petite et la plus légère des variantes du F-35. Elle est principalement destinée à remplacer le F-16 Fighting Falcon."
 AST_cv_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35C Lightning II"
 AST_cv_mr_stealth_fighter_equipment_1_short:0 "F-35C Lightning II"
 AST_cv_mr_stealth_fighter_equipment_1_desc:0 "Le F-35C est la variante CATOBAR (Catapult Assisted Take-Off But Arrested Recovery) de la famille F-35 Lightning II de Lockheed Martin, conçue principalement pour être déployée sur des porte-avions. Le programme F-35 a débuté en 1992, et la variante C a pris son envol dès 2010 et a été opérationnelle sur des porte-avions moins de quatre ans plus tard. Par rapport à ses homologues, la variante C se caractérise par des ailes plus grandes avec des extrémités repliables."
 AST_jump_stealth_equipment_1:0 "Lockheed Martin F-35B Lightning II"
 AST_jump_stealth_equipment_1_short:0 "F-35B Lightning II"
 AST_jump_stealth_equipment_1_desc:0 "Un avion de combat polyvalent produit à partir d'une conception JSF (Joint Strike Fighter). Bien qu'il puisse utiliser diverses armes dans les combats air-air et sol-sol, le coût d'acquisition de cet avion de combat furtif est plus raisonnable que celui du F-22A. Conformément à son utilité, il existe plusieurs types disponibles. Le type « B » utilisé par le Corps des Marines des États-Unis est compatible STOVL (décollage court/atterrissage vertical). Son surnom est « Lightning II »."
 AST_CAS_equipment_1:0 "CAC CA-1 Wirraway"
