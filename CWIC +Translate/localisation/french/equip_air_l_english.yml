 PRC_nav_bomber_equipment_8:0 "Shaanxi KQ-200"
 PRC_nav_bomber_equipment_8_short:0 "KQ-200"
 PRC_cv_jet_multirole_equipment_7:0 "Chengdu J-7HH"
 PRC_cv_jet_multirole_equipment_7_short:0 "J-7HH"
 PRC_cv_jet_multirole_equipment_8:0 "Shenyang J-8B"
 PRC_cv_jet_multirole_equipment_8_short:0 "J-8B"
 PRC_cv_jet_multirole_equipment_9:0 "Shenyang J-8B Block 02"
 PRC_cv_jet_multirole_equipment_9_short:0 "J-8B Block 02"
 PRC_cv_jet_multirole_equipment_10:0 "Shenyang J-15"
 PRC_cv_jet_multirole_equipment_10_short:0 "J-15"
 PRC_cv_mr_stealth_fighter_equipment_1:0 "Shenyang FC-31 Gyrfalcon"
 PRC_cv_mr_stealth_fighter_equipment_1_short:0 "FC-31 Gyrfalcon"
 PRC_cv_mr_stealth_fighter_equipment_1_desc:0 "Le Shenyang FC-31 Gyrfalcon, également connu sous le nom de J-31 ou J-35, est un prototype chinois d'avion de combat bimoteur de taille moyenne de 5e génération développé par la Shenyang Aircraft Corporation (SAC). Le surnom officiel publié par la SAC est « Gyrfalcon », bien qu'il ait également été appelé « F-60 » ou « J-21 Snowy Owl » dans certains médias, ou « Falcon Hawk » par certains passionnés d'armée."
 PRC_mp_uav_1:0 "CASC Cai Hong CH-802"
 PRC_mp_uav_1_short:0 "CH-802"
 PRC_cas_uav_equipment_1:0 "Aisheng ASN-209"
 PRC_cas_uav_equipment_1_short:0 "ASN-209"
 PRC_cas_uav_equipment_2:0 "CAIG WJ-1 Wing Loong I"
 PRC_cas_uav_equipment_2_short:0 "GJ-1"
 PRC_cas_uav_equipment_3:0 "CAIG WJ-2 Wing Loong II"
 PRC_cas_uav_equipment_3_short:0 "GJ-2"
 PRC_naval_uav_equipment_1:0 "Harbin BZK-005"
 PRC_naval_uav_equipment_1_short:0 "BZK-005"
 PRC_naval_uav_equipment_2:0 "AVIC AR-500B"
 PRC_naval_uav_equipment_2_short:0 "AR-500B"
 PRC_naval_uav_equipment_3:0 "CASC Cai Hong CH-5"
 PRC_naval_uav_equipment_3_short:0 "CH-5"
 PRC_slbm_equipment_6:0 "Ju Lang-1"
 PRC_slbm_equipment_6_short:0 "JL-1"
 PRC_slbm_equipment_6_desc:0 "Le Julang-1 était le missile balistique lancé par sous-marin nucléaire (SLBM) de première génération de la Chine. Selon un rapport du département américain de la Défense publié en 2011, l'état opérationnel du JL-1 était discutable."
 PRC_slbm_equipment_7:0 "Ju lang-2"
 PRC_slbm_equipment_7_short:0 "JL-2"
 PRC_slbm_equipment_7_desc:0 "Le JL-2 est un missile balistique intercontinental de deuxième génération lancé à partir d'un sous-marin (SLBM) déployé sur les sous-marins de type 094 de la marine de l'Armée populaire de libération (PLAN)."
 PRC_irbm_equipment_4:0 "Dong Feng-3"
 PRC_irbm_equipment_4_short:0 "DF-3"
 PRC_irbm_equipment_4_desc:0 "Le DF-3 est souvent considéré comme le premier missile balistique à portée intermédiaire (IRBM) « national » de la Chine. La conception courante des ICBM a été fortement influencée par le missile soviétique R-14 Chusovaya et le moteur du premier étage était lui-même une copie conforme du moteur d'appoint С.2.1100/С.2.1150 La-350 développé par Aleksei Isaev à l'OKB-2 (NII-88)."
 PRC_irbm_equipment_5:0 "Dong Feng-4"
 PRC_irbm_equipment_5_short:0 "DF-4"
 PRC_irbm_equipment_5_desc:0 "Le Dong Feng 4 ou DF-4 est un missile balistique intercontinental chinois à deux étages de première génération fonctionnant au carburant liquide."
 PRC_irbm_equipment_7:0 "DF-16"
 PRC_irbm_equipment_7_short:0 "DF-16"
 PRC_irbm_equipment_7_desc:0 "Le DF-16 est un nouveau modèle de missile dont la portée est supérieure à celle du DF-15 (entre 800 et 1 000 km (500 et 620 mi))."
 PRC_irbm_equipment_8:0 "DF-25"
 PRC_irbm_equipment_8_short:0 "DF-25"
 PRC_irbm_equipment_8_desc:0 "Le DF-25 était un missile balistique intercontinental à deux étages à propergol solide, lancé à partir d'une plate-forme mobile, d'une portée de 3 200 kilomètres (2 000 mi). Son développement aurait été annulé en 1996. Dans son rapport de 2013 au Congrès sur les développements militaires de la Chine, le département américain de la Défense n'a fait aucune mention du DF-25 comme missile en service."
 PRC_srbm_equipment_3:0 "DF-1"
 PRC_srbm_equipment_3_short:0 "DF-1"
 PRC_srbm_equipment_5:0 "DF-2"
 PRC_srbm_equipment_5_short:0 "DF-2"
 PRC_srbm_equipment_7:0 "DF-15"
 PRC_srbm_equipment_7_short:0 "DF-15"
 PRC_srbm_equipment_8:0 "DF-11"
 PRC_srbm_equipment_8_short:0 "DF-11"
 PRC_srbm_equipment_9:0 "DF-12"
 PRC_srbm_equipment_9_short:0 "DF-12"
 PRC_icbm_equipment_3:0 "DF-5"
 PRC_icbm_equipment_3_short:0 "DF-5"
