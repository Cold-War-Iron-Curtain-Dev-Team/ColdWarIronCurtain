 POR_cv_jet_CAS_equipment_1_desc:0 "Remplaçant le SBD Dauntless, le SB2C, introduit en 1942, était beaucoup plus rapide que le SBD qu'il remplaçait, mais c'était un avion difficile à piloter, ce qui lui valut le surnom péjoratif de « SOB, 2nd Class » (enfoiré de deuxième classe). Malgré cela et un rapport cinglant qui allait ternir à jamais l'héritage de la Curtiss Aircraft Company, le « Helldiver » obtint d'excellents résultats au combat tout au long de la guerre du Pacifique. La variante de l'USAAF l'appelait A-25 Shrike."
