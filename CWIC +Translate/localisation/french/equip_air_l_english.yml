 WGR_jet_multirole_equipment_2:0 "Canadair CL-13 Sabre Mark 4"
 WGR_jet_multirole_equipment_2_short:0 "Sabre Mk.4"
 WGR_jet_multirole_equipment_2_desc:0 "Le premier Sabre Mk.4 volait avec le moteur Orenda 10, qui lui conférait un net avantage en termes de taux de montée et d'altitude maximale par rapport aux versions précédentes. Parmi les autres améliorations apportées au Mk 5, citons un nouveau système d'oxygène, une maniabilité accrue et de meilleures caractéristiques à basse vitesse, obtenues grâce à l'augmentation de la corde alaire de 15,2 cm à la base et de 7,2 cm à l'extrémité de l'aile, ainsi qu'à l'installation d'un petit déflecteur vertical sur l'aile."
 WGR_jet_multirole_equipment_3:0 "Canadair CL-13 Sabre Mark 5"
 WGR_jet_multirole_equipment_3_short:0 "Sabre Mk.5"
 WGR_jet_multirole_equipment_3_desc:0 "Le Canadair Sabre Mk.5 est l'avant-dernière variante. Il était équipé d'un moteur Orenda à deux étages développant une poussée statique de 7 275 lb (3 302 kg). Ses performances en altitude et son taux de montée ont été améliorés par rapport au Mk 5, et le rétablissement des volets de bord d'attaque lui a conféré d'excellentes caractéristiques à basse vitesse."
 WGR_jet_multirole_equipment_4:0 "Canadair CL-13 Sabre Mark 6"
 WGR_jet_multirole_equipment_4_short:0 "Sabre Mk.6"
 WGR_jet_multirole_equipment_4_desc:0 "Le Canadair Sabre Mk.6 est considéré comme le « meilleur » Sabre jamais construit. Il est équipé de points d'emport pour les missiles AIM-9B Sidewinder."
 WGR_jet_multirole_equipment_5:0 "Lockheed F-104G Starfighter"
 WGR_jet_multirole_equipment_5_short:0 "F-104G Starfighter"
 WGR_jet_multirole_equipment_6:0 "Lockheed F-104G Starfighter(ZU)"
 WGR_jet_multirole_equipment_6_short:0 "F-104G Starfighter(ZU)"
 WGR_jet_multirole_equipment_6_desc:0 "La « Zuverlässigkeits-Upgrade » ou « mise à niveau de fiabilité » a été lancée en 1966 lorsque toute la flotte de F-104 a été immobilisée au sol en raison d'accidents. Les ailes ont été renforcées et l'avionique a été mise à niveau avant que la flotte de F-104 puisse reprendre son envol."
 WGR_jet_multirole_equipment_7:0 "McDonnell Douglas F-4F Phantom II (version initiale)"
 WGR_jet_multirole_equipment_7_short:0 "F-4F Phantom II (premier modèle)"
 WGR_jet_multirole_equipment_7_desc:0 "Pour remplacer les F-104G vieillissants destinés à assurer la supériorité aérienne, la Luftwaffe a commandé 175 F-4F Phantom dans le cadre du programme Peace Rhine en 1968. Les premiers appareils ont été livrés en septembre 1973. Les premiers F-4F Phantom ont subi de nombreuses modifications par rapport au F-4E Phantom, notamment la suppression de nombreux composants jugés inutiles, l'objectif étant d'alléger la cellule. Le F4F n'avait pas la capacité Sparrow."
 WGR_jet_multirole_equipment_8:0 "McDonnell Douglas F-4F Phantom II"
 WGR_jet_multirole_equipment_8_short:0 "F-4F Phantom II"
 WGR_jet_multirole_equipment_8_desc:0 "Mise à jour fournie par MBB (Messerschmitt-Bölkow-Blohm). La mise à niveau comprenait des dispositions visant à améliorer l'armement, ainsi qu'une révision du moteur et une nouvelle avionique."
 WGR_jet_multirole_equipment_9:0 "McDonnell Douglas F-4F Phantom II Peace Rhine"
 WGR_jet_multirole_equipment_9_short:0 "F-4F Phantom II PR"
 WGR_jet_multirole_equipment_9_desc:0 "La Luftwaffe s'est rapidement rendu compte que la réduction des capacités était beaucoup trop drastique avec le F-4F d'origine et a pris des mesures pour résoudre le problème. Le premier F-4F Phantom modernisé a été rendu à la Luftwaffe en 1980 et le dernier en 1983. Ces modernisations comprenaient : la restauration de la capacité de ravitaillement en vol ; la capacité de transporter des armes guidées telles que l'AGM-65 Maverick ; l'électronique nécessaire pour transporter et tirer l'AIM-9L ; les premiers F-4F étaient limités à l'AIM-9B produit sous licence ; le pod brouilleur AN/ALQ-131 et l'ajout de lance-fusées de diversion pour transporter et tirer l'AIM-9L. L'électronique nécessaire pour transporter et tirer l'AIM-9L ; les premiers F-4F étaient limités à l'AIM-9B produit sous licence. Le pod brouilleur AN/ALQ-131 et l'ajout de lance-leurres."
 WGR_jet_multirole_equipment_10:0 "McDonnell Douglas F-4F Phantom II KWS"
 WGR_jet_multirole_equipment_10_short:0 "F-4F Phantom II KWS"
 WGR_jet_multirole_equipment_10_desc:0 "Le F-4F ICE (Improved Combat Effectiveness) ou KWS (KampfWertSteigerung) a vu le jour au début des années 1990. Le dernier avion a été modernisé en 1998. Le programme KWS comprenait le transport de l'AIM-120 AMRAAM ainsi que le remplacement de l'ancien radar Hughes AN/APQ-120 par le radar Doppler à impulsions Hughes AN/APG-65GY. Le radar AN/APG-65 avait été initialement développé pour le F/A-18 Hornet et était nécessaire pour utiliser l'AMRAAM. La mise à niveau comprenait également, entre autres, de nouveaux équipements avioniques, tels qu'un écran de cockpit moderne, un nouveau système IFF et, plus tard, un radar RWR AN/ALR-68 amélioré."
