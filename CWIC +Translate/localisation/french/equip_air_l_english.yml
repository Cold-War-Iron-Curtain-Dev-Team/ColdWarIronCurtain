 ISR_stealth_tactical_bomber_equipment_2_desc:0 "Le F-15IA (Israel Advanced) est une variante proposée pour l'armée de l'air israélienne, basée sur le F-15EX et l'Advanced Eagle."
 ISR_strat_bomber_equipment_1:0 "Boeing B-17 Flying Fortress"
 ISR_strat_bomber_equipment_1_short:0 "B-17 Flying Fortress"
 ISR_strat_bomber_equipment_1_desc:0 "Le B-17 est un bombardier stratégique quadrimoteur développé au milieu des années 1930 pour l'armée de l'air américaine. Il s'agit du troisième bombardier le plus produit pendant la Seconde Guerre mondiale. Il s'est illustré sur le théâtre européen du conflit, où il a mené des campagnes de bombardement en Allemagne à partir de bases situées dans le sud de l'Angleterre et en Italie. Son armement défensif imposant est à la hauteur d'un avion surnommé la « forteresse volante »."
 ISR_nav_bomber_equipment_1:0 "Consolidated PBY-1 Catalina"
 ISR_nav_bomber_equipment_1_short:0 "PBY-1"
 ISR_nav_bomber_equipment_1_desc:0 "Variante de production initiale équipée de deux moteurs R-1830-64 de 900 ch. Le Consolidated PBY Catalina est un hydravion et un avion amphibie produit dans les années 1930 et 1940. Au Canada, il était connu sous le nom de Canso. Il fut l'un des hydravions les plus utilisés pendant la Seconde Guerre mondiale. Les Catalina ont servi dans toutes les branches des forces armées américaines ainsi que dans les forces aériennes et navales de nombreux autres pays. Les derniers PBY militaires ont été utilisés jusqu'aux années 1980. En 2021, 86 ans après son premier vol, cet avion continue de voler en tant que bombardier à eau (ou avion-citerne) dans le cadre d'opérations de lutte contre les incendies aériens dans certaines régions du monde. Aucun n'est plus en service militaire."
 ISR_nav_bomber_equipment_2:1 "Consolidated PBY-5 Catalina"
 ISR_nav_bomber_equipment_2_short:1 "PBY-5"
 ISR_nav_bomber_equipment_2_desc:0 "Le Consolidated PBY Catalina est un hydravion et un avion amphibie qui a été produit dans les années 1930 et 1940. Au Canada, il était connu sous le nom de Canso. Il a été l'un des hydravions les plus utilisés pendant la Seconde Guerre mondiale. Les Catalina ont servi dans toutes les branches des forces armées américaines ainsi que dans les forces aériennes et navales de nombreux autres pays. Les derniers PBY militaires ont servi jusqu'aux années 1980. En 2021, 86 ans après son premier vol, cet avion continue de voler en tant que bombardier d'eau (ou avion-citerne) dans le cadre d'opérations de lutte aérienne contre les incendies dans certaines régions du monde. Aucun n'est plus en service militaire."
