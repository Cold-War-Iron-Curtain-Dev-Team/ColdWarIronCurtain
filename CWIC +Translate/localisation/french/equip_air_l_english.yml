 AST_CAS_equipment_2_short:0 "CA-11 Woomera"
 AST_CAS_equipment_3:0 "Curtiss P-40N Kittyhawk Mk VI"
 AST_CAS_equipment_3_short:0 "P-40N Kittyhawk Mk VI"
 AST_CAS_equipment_3_desc:0 "Le P-40 était un avion de chasse monomoteur entièrement métallique développé en 1938. Il s'agissait d'une version modifiée du P-36 Hawk. Ce modèle fut utilisé par un grand nombre de puissances alliées pendant la Seconde Guerre mondiale et, bien qu'il fût inférieur aux P-47 et P-51 plus récents, il resta en service sur le front jusqu'à la fin de la guerre. 200 pilotes alliés de 7 nations différentes, dont les États-Unis, les pays du Commonwealth britannique et l'Union soviétique, sont devenus des as du P-40. Malgré des désignations différentes pour le Commonwealth et l'Union soviétique, le surnom officiel dans l'armée américaine est « Warhawk »."
