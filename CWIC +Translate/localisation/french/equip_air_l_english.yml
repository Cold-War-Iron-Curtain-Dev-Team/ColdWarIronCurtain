 SOV_scout_helicopter_equipment_4_short:0 "Ka-226"
 SOV_scout_helicopter_equipment_5:0 "Kamov Ka-60R"
 SOV_scout_helicopter_equipment_5_short:0 "Ka-60R"
 SOV_slbm_equipment_1:0 "R-11FM Scud"
 SOV_slbm_equipment_1_short:0 "R-11FM Scud"
 SOV_slbm_equipment_1_desc:0 "Le R-11FM est la variante navale du R-11 Zemlya, désigné Scud-A par l'OTAN. Il a été testé pour la première fois sur une rampe de lancement à Kapustin Yar en 1955, puis lancé depuis un sous-marin du projet 611 (classe Zulu) plus tard dans l'année. Le missile a été déclaré opérationnel en 1959, sous le nom de système de lancement D-1, et a été le premier SLBM au monde. Il a été lancé 77 fois au total pendant son service, dont 59 avec succès. Il a été complètement retiré du service en 1963."
 SOV_slbm_equipment_2:0 "R-13 Sark"
 SOV_slbm_equipment_2_short:0 "R-13 Sark"
 SOV_slbm_equipment_2_desc:0 "Le R-13 a remplacé le R-11FM, dont le développement a été autorisé par le bureau d'études Makayev Rocket Design Bureau en 1955. Les spécifications techniques finales ont été approuvées au début de l'année 1956, et le R-13 est entré en service en 1961. Le Sark a été le premier SLBM soviétique à utiliser des propulseurs verniers pour changer de trajectoire en plus des ailerons arrière, ce qui a amélioré sa stabilité, son aérodynamisme et sa portée. Le R-13 pouvait parcourir 600 km et transporter une ogive de 2 mégatonnes. Il a été retiré du service en 1975."
 SOV_slbm_equipment_3:0 "R-21 Serb"
 SOV_slbm_equipment_3_short:0 "R-21 Serb"
 SOV_slbm_equipment_3_desc:0 "Le R-21 fut le premier missile soviétique pouvant être lancé depuis un sous-marin immergé. Son développement débuta en 1958 et ses premiers vols réussis eurent lieu deux ans plus tard. Le R-21 avait une portée deux fois supérieure à celle de ses prédécesseurs, soit 1 650 km, et pouvait transporter une ogive de 800 kt. Introduit pour la première fois en 1963, il fut retiré du service en 1987."
 SOV_slbm_equipment_4:0 "R-27 Serb"
 SOV_slbm_equipment_4_short:0 "R-27 Serb"
 SOV_slbm_equipment_4_desc:0 "Le R-27 était très similaire au R-21 en termes de conception et d'objectif. Entré en service seulement 5 ans après le R-21, en 1968, il offrait des performances et des capacités nettement supérieures, avec une portée opérationnelle de 2 400 km et une ogive d'une puissance d'une mégatonne. Au total, 1 800 missiles ont été fabriqués, avant son retrait définitif en 1990."
 SOV_slbm_equipment_5:0 "R-29 Sawfly"
 SOV_slbm_equipment_5_short:0 "R-29 Sawfly"
 SOV_slbm_equipment_5_desc:0 "Le R-29 a été le premier SLBM moderne à être introduit dans la marine soviétique. Déployé en 1974, il avait une portée trois fois supérieure à celle du R-27, soit 7 700 km, et pouvait transporter une ogive plus lourde, d'une puissance supérieure à 1 mégatonne. Il est toujours utilisé aujourd'hui, et un nombre inconnu d'entre eux se trouvent actuellement à bord de sous-marins russes."
 SOV_slbm_equipment_6:0 "R-29RM Skiff"
 SOV_slbm_equipment_6_short:0 "R-29RM Skiff"
 SOV_slbm_equipment_6_desc:0 "Le R-29RM a été conçu après le R-29, mais avec un objectif différent. Bien qu'il ait une charge utile beaucoup plus faible, avec 4 ogives de 100 kilotonnes dans un MIRV, il a une portée plus longue de 8 800 km et peut être embarqué en plus grand nombre dans un sous-marin. Cependant, contrairement au R-29, il a été retiré du service en 2010."
 SOV_slbm_equipment_7:0 "R-39 Sturgeon"
 SOV_slbm_equipment_7_short:0 "R-39 Sturgeon"
 SOV_slbm_equipment_7_desc:0 "Le développement du R-39 a commencé au début des années 1970, les premiers essais ont eu lieu en 1979 et son déploiement en 1983. À pleine capacité, 120 missiles étaient en service, chacun transportant 10 ogives de 150 kilotonnes et ayant une portée de 8 300 km. Conformément aux termes des traités START I et II, leur destruction a progressivement commencé en 1996, et le dernier R-39 a été mis hors service en 2004."
 SOV_irbm_equipment_1:0 "R-5 Pobeda"
 SOV_irbm_equipment_1_short:0 "R-5 Pobeda"
 SOV_irbm_equipment_1_desc:0 "Le R-5 fut la première tentative soviétique de fabrication d'un missile balistique à courte portée, ou IRBM. La variante du R-5 qui fut effectivement produite fut le R-5M, qui fut le premier missile nucléaire déployé par l'URSS. Il avait une portée de 1 200 km et pouvait transporter une ogive thermonucléaire d'une puissance maximale de 1 mégatonne. Il a été distribué pour la première fois en mai 1956 et installé dans des bases aériennes est-allemandes à la fin de l'année 1959. Au total, 48 lanceurs et 200 missiles ont été produits avant son retrait en 1967."
 SOV_irbm_equipment_2:0 "R-12 Dvina"
 SOV_irbm_equipment_2_short:0 "R-12 Dvina"
 SOV_irbm_equipment_2_desc:0 "Le R-12, successeur du R-5, fut l'un des missiles soviétiques les plus produits pendant la guerre froide, avec 2 335 exemplaires fabriqués, et constituait l'essentiel de la menace offensive soviétique sur l'Europe occidentale. Le R-12 a été produit pour la première fois en octobre 1958 et mis en service en 1959. Il avait une portée maximale de 2 080 km et pouvait transporter une ogive thermonucléaire de 2,3 mégatonnes. C'est l'installation de R-12 à Cuba qui a déclenché la crise des missiles de Cuba en 1963."
 SOV_irbm_equipment_3:0 "R-14 Chusovaya"
 SOV_irbm_equipment_3_short:0 "R-14 Chusovaya"
 SOV_irbm_equipment_3_desc:0 "Le Premier ministre de l'URSS a autorisé le développement du R-14 le 2 juillet 1958, et les essais en vol ont été achevés à la fin de 1961. La version lancée depuis un silo a été autorisée en mai 1960 et les essais ont été achevés au début de l'année 1962. Le Chusovaya avait une portée de 4 500 km et pouvait transporter une ogive d'une puissance maximale de 2,3 mégatonnes. Il a été mis en service en avril 1961, et les six derniers exemplaires ont été mis au rebut en 1989 à la suite d'un traité conclu avec les États-Unis."
 SOV_irbm_equipment_4:0 "RT-15 Scamp"
 SOV_irbm_equipment_4_desc:0 "Le RT-15 était l'une des premières tentatives soviétiques pour fabriquer un missile balistique intercontinental (IRBM) plus mobile. Il était conçu pour être lancé à partir d'un châssis T-10. Il devait s'agir d'un système de lancement rapide d'une portée maximale de 2 500 km, capable de transporter une ogive d'une puissance de 1 mégatonne. Cependant, il n'a jamais été adopté pour un usage général, seul un bataillon l'ayant utilisé, en raison de problèmes électroniques et d'un système de lancement peu performant."
 SOV_irbm_equipment_4_short:0 "RT-15 Scamp"
 SOV_irbm_equipment_5:0 "RSD-10 Pioneer"
 SOV_irbm_equipment_5_short:0 "RSD-10 Pioneer"
 SOV_irbm_equipment_5_desc:0 "Le RSD-10 a été mis au point en 1966, et sa conception initiale a été approuvée en 1968. Destiné à remplacer ou à compléter les R-12 et R-14, il a été déployé pour la première fois en 1976 et distribué à l'ensemble des pays du Pacte de Varsovie, car le RSD-10 était le premier missile soviétique capable de frapper avec précision des cibles de petite taille. Plus de 650 exemplaires ont finalement été produits, chacun ayant une portée de 5 500 km et pouvant transporter une ogive de 1,6 Mt, puis plus tard un MIRV. Tous ont été détruits conformément au Traité sur les forces nucléaires à portée intermédiaire de 1991."
 SOV_irbm_equipment_6:0 "RT-21M Temp 2S"
 SOV_irbm_equipment_6_short:0 "RT-21M Temp 2S "
 SOV_irbm_equipment_6_desc:0 "Bien que techniquement classé par l'OTAN comme un ICBM, le RT-21M avait une portée plus courte que la plupart des autres missiles, ainsi qu'une ogive plus petite, d'une puissance maximale d'un mégatonne. Il reposait sur un lanceur mobile et a été conçu et développé à peu près à la même époque que le RSD-10. Cependant, en raison de tous les traités relatifs aux armes nucléaires conclus à la fin du XXe siècle, le programme n'a jamais vraiment vu le jour et, au milieu des années 1980, l'ensemble du projet a été abandonné."
 SOV_irbm_equipment_7:0 "RSD-10 Pioneer 3"
 SOV_irbm_equipment_7_short:0 "RSD-10 Pioneer 3"
 SOV_irbm_equipment_7_desc:0 "Le RSD-10 Pioneer 3 est une version améliorée du RSD-10 original. La plus grande avancée concerne la portée maximale du RSD-10 3, qui a bondi de 2 000 km, passant de 5 500 à 7 500 km. Développé à la fin des années 1970, il a été introduit pour la première fois dans l'armée soviétique en 1980 et était équipé d'une ogive nucléaire triple MIRV d'une puissance maximale de 50 kt chacune. Le Pioneer 3 a connu un sort similaire à celui du modèle original à la suite du traité sur les forces nucléaires à portée intermédiaire."
 SOV_srbm_equipment_1:0 "R-1 Scunner"
 SOV_srbm_equipment_1_short:0 "R-1 Scunner"
 SOV_srbm_equipment_1_desc:0 "Le R-1 Scunner n'était rien d'autre qu'une version améliorée de la fusée V-2. Il a été conçu et fabriqué par les mêmes scientifiques allemands qui avaient créé la V-2, car ils avaient été capturés par les Soviétiques lorsque l'Armée rouge s'était emparée de la principale usine de fabrication de la V-2. Si les Soviétiques voulaient une copie de la V-2, c'était davantage pour apprendre les techniques et les processus nécessaires à la construction de fusées que pour la valeur tactique réelle du R-1. La production fut personnellement autorisée par Staline (comme ce fut le cas pour tous les autres missiles par la suite) en 1947 et le Scunner entra en service en novembre 1950."
 SOV_srbm_equipment_2:0 "R-2 Sibling"
 SOV_srbm_equipment_2_short:0 "R-2 Sibling"
 SOV_srbm_equipment_2_desc:0 "Le R-2 constituait une amélioration majeure par rapport au R-1. Tout d'abord, son rayon d'action avait plus que doublé, passant à 600 km. Il disposait également d'un fuselage plus solide, de moins de vibrations grâce à un cône arrière en acier, et malgré un poids presque deux fois supérieur à celui du R-1, il était tout aussi précis, grâce aux progrès réalisés dans le domaine de la radiocommande. Le premier essai eut lieu fin 1949 et il fut accepté pour le service en 1951, mais ne fut distribué à grande échelle que deux ans plus tard. Le R-2 fut la dernière copie directe allemande, les Soviétiques ayant désormais suffisamment d'expérience pour créer leurs propres modèles."
 SOV_srbm_equipment_3:0 "R-11 Scud A"
 SOV_srbm_equipment_3_short:0 "R-11 Scud A"
 SOV_srbm_equipment_3_desc:0 "Le R-11 a été conçu sur la base de la variante Wasserfall (anti-aérienne) du V-2, mais n'était pas une imitation directe. En juillet 1955, la première version du R-11 a été acceptée par l'armée soviétique. Cependant, le R-11M, variante définitive du R-11 et capable de transporter une ogive nucléaire, a été accepté trois ans plus tard, en 1958. Lorsqu'il était équipé d'une ogive, il avait une portée maximale de 170 km. Il était donc principalement lancé à partir de plates-formes de frappe mobiles (châssis IS-2 modifiés)."
 SOV_srbm_equipment_4:0 "R-17 Scud B"
 SOV_srbm_equipment_4_short:0 "R-17 Scud B"
 SOV_srbm_equipment_4_desc:0 "Le Scud B a été le missile le plus utilisé et l'un des plus produits (plus de 7 000 exemplaires) pendant la guerre froide. Conçu en 1959, il est entré en service en 1964. Il constituait une amélioration considérable par rapport au R-11 précédent, avec une portée supérieure (300 km) et la possibilité de transporter aussi bien une ogive nucléaire qu'un réservoir de VX ou une bombe HE. Le R-17 a été largement utilisé au Moyen-Orient, en particulier pendant la guerre du Kippour et la guerre Iran-Irak. Il a été retiré du service soviétique/russe depuis un certain temps, mais certains pays, comme la Corée du Nord, l'utilisent encore."
 SOV_srbm_equipment_5:0 "OTR-22 Temp S"
 SOV_srbm_equipment_5_short:0 "OTR-22 Temp S"
 SOV_srbm_equipment_5_desc:0 "L'OTR-22 Temp S était une variante améliorée du TR-1 Temp. Son concept était similaire à celui du Scud-B et il utilisait le même lanceur, mais il n'a pas été produit en grande quantité. Il est entré en service en 1968 et avait une portée maximale de 900 km et une seule ogive de 500 kt. Il a été retiré du service en 1989."
 SOV_srbm_equipment_6:0 "OTR-21 Tochka A"
 SOV_srbm_equipment_6_short:0 "OTR-21 Tochka A"
 SOV_srbm_equipment_6_desc:0 "L'OTR-21 était un système de lancement mobile, conçu pour être utilisé aux côtés d'une division d'infanterie régulière afin de mener des frappes précises sur des sites ennemis importants, tels que des ponts ou des centres de commandement, ce qui le différenciait des SRBM précédents. Il avait une portée maximale de 70 km et était équipé d'une ogive de 100 kt qui pouvait être remplacée par une arme chimique, explosive ou à fragmentation ; ces deux facteurs démontrent clairement son objectif tactique. Il est entré en service en 1975 et ses trois variantes sont toujours utilisées aujourd'hui."
 SOV_srbm_equipment_7:0 "OTR-23 Oka"
 SOV_srbm_equipment_7_short:0 "OTR-23 Oka"
 SOV_srbm_equipment_7_desc:0 "L'OTR-23 a été conçu pour remplacer le Scud-B, alors obsolète, vers la fin de la guerre froide. Il a été développé au milieu des années 70 et est entré en service en 1979. Son rayon d'action était de 500 km, soit moins que celui du Scud, mais il était beaucoup plus précis et transportait une ogive plus lourde. Il a été interdit par le Traité sur les forces nucléaires à portée intermédiaire de 1991."
 SOV_srbm_equipment_8:0 "OTR-21 Tochka B"
 SOV_srbm_equipment_8_short:0 "OTR-21 Tochka B"
 SOV_srbm_equipment_8_short_desc:0 "L'OTR-21 Tochka-B était une version améliorée du Tochka-A. Développé pour la première fois en 1986, il est entré en service en 1989. Un propergol amélioré a porté sa portée maximale à 120 km, mais il était équipé de la même ogive et remplissait la même fonction que le Tochka-A. Il est toujours en service aujourd'hui."
 SOV_srbm_equipment_9:0 "9K720 Iskander"
 SOV_srbm_equipment_9_short:0 "9K720 Iskander"
 SOV_srbm_equipment_9_desc:0 "Le 9K720 a été conçu pour remplacer les OTR-21 d'ici début 2020. Les travaux de développement ont débuté en 1986 et se sont poursuivis sans être affectés par l'effondrement de l'Union soviétique, les premiers lancements ayant eu lieu en 1996. La version la plus récente, l'Iskander-M, a une portée de 500 km et peut transporter tout type d'ogive, nucléaire ou autre, jusqu'à 700 kg. La plupart des forces armées russes utilisent désormais le 9K720, mais certains anciens systèmes Tochka-B sont encore en service."
 SOV_icbm_equipment_1:0 "R-9 Desna"
 SOV_icbm_equipment_1_short:0 "R-9 Desna"
 SOV_icbm_equipment_1_desc:0 "Le R-9 Desna était un missile balistique intercontinental à deux étages, conçu en 1959 et testé pour la première fois en 1961. Capable de transporter une charge utile de 1 600 kg/ogive de 5 Mt sur environ 11 000 km, ce missile était non seulement très précis, mais aussi beaucoup plus utile sur le plan tactique pour l'Union soviétique, car il pouvait être ravitaillé en carburant et prêt à être lancé en moins de 20 minutes. Il a été mis en service pour la première fois en 1964 et a été utilisé par trois régiments terrestres et un régiment de silos. En 1976, tous les R-9 ont été mis hors service."
 SOV_icbm_equipment_2:0 "RT-2 Savage"
 SOV_icbm_equipment_2_short:0 "RT-2 Savage"
 SOV_icbm_equipment_2_desc:0 "Le RT-2 Savage était un missile balistique intercontinental à trois étages comparable au Minuteman américain. Il a terminé ses essais en vol au début de l'année 1966 et est entré en service en 1968. Il avait une portée opérationnelle de 10 186 km et était équipé d'une seule ogive de 600 kilotonnes. Une centaine d'exemplaires ont été construits, et le RT-2 a été retiré du service en 1976, en même temps que les R-9 restants."
 SOV_icbm_equipment_3:0 "R-36M Satan"
 SOV_icbm_equipment_3_short:0 "R-36M Satan"
 SOV_icbm_equipment_3_desc:0 "Le R-36M était une version nettement améliorée et beaucoup plus meurtrière du R-36. Missile balistique intercontinental à deux étages capable de parcourir 16 000 km, il pouvait transporter jusqu'à 10 ogives, un nombre inégalé, et grâce à sa conception, à son temps de rechargement rapide et à son grand nombre de véhicules de rentrée, il donnait aux Soviétiques un avantage en matière de capacité de première frappe. Le développement du R-36M a commencé à la fin des années 1970 et, à la chute de l'URSS, il existait 308 silos de lancement pour ce missile, chacun pouvant en contenir au moins deux. Certains R-36M sont encore en service aujourd'hui."
 SOV_icbm_equipment_4:0 "RT-23 Molodets"
 SOV_icbm_equipment_4_short:0 "RT-23 Molodets"
 SOV_icbm_equipment_4_desc:0 "Le RT-23 a été conçu comme un système d'armes à plate-forme multi-lancement, capable de tirer depuis un silo et un wagon. Il a été testé au début des années 80 et déployé en 1987. Le RT-23 avait une portée opérationnelle de 11 000 km et pouvait transporter 10 ogives MIRV de 550 kt. En septembre 1991, environ 90 exemplaires étaient déployés, mais lorsque l'Union soviétique s'est effondrée, l'usine de production a été fermée."
 SOV_icbm_equipment_5:0 "RT-2PM2 Topol-M"
 SOV_icbm_equipment_5_short:0 "RT-2PM2 Topol-M"
 SOV_icbm_equipment_5_desc:0 "Le RT-2PM2 est l'un des derniers modèles d'ICBM en service en Russie, et a été la première fusée russe produite après la chute de l'Union soviétique. Développée à la fin des années 1980 en réponse à l'Initiative de défense stratégique américaine, elle a finalement été mise en service en 1998. Arme à trois étages, la RT-2PM2 a une portée maximale de 11 500 km et une ogive d'une puissance d'un mégatonne. Actuellement, environ 90 exemplaires sont déployés."
 SOV_cruisemissile_equipment_0:0 "Chelomey 14Kh"
 SOV_cruisemissile_equipment_0_short:0 "Chelomey 14Kh"
 SOV_cruisemissile_equipment_0_desc:0 "En octobre 1944, piqué au vif par les fusées V-1 et V-2, Staline chargea Vladimir Chelomey de mener des recherches et de concevoir une arme similaire. La première tentative de Chelomey fut une V-1 rétro-conçue appelée 10kh, équipée du même moteur que la V-1. La 14kh était une version révisée et améliorée, dotée de stabilisateurs et d'ailes, ainsi que d'une meilleure conception structurelle globale et d'une plus grande portée opérationnelle."
 SOV_cruisemissile_equipment_1:0 "Chelomey 18Kh"
 SOV_cruisemissile_equipment_1_short:0 "Chelomey 18Kh"
 SOV_cruisemissile_equipment_1_desc:0 "Le 18Kh est apparu plus tard dans la gamme des missiles développés par Chelomey. Lorsqu'il a été produit, il présentait des améliorations similaires à celles apportées par le 14Kh par rapport au 10Kh. Il avait une plus grande portée, une ogive plus puissante, était plus stable et était équipé d'un moteur Chelomey D-6 plus puissant. Il s'agissait toutefois encore d'un modèle très rudimentaire et précoce dans le domaine des missiles de croisière."
 SOV_cruisemissile_equipment_2:0 "La-350 Burya"
 SOV_cruisemissile_equipment_2_short:0 "La-350 Burya"
 SOV_cruisemissile_equipment_2_desc:0 "Le Burya était un missile de croisière intercontinental supersonique développé pour la première fois en 1954. Il pouvait parcourir 6 000 km à Mach 3 avec une ogive de la taille d'une petite bombe, fonctionnant avec un moteur à deux étages composé d'un propulseur à propergol et d'un statoréacteur. Cependant, le projet a été annulé en 1960 en raison des avantages des missiles balistiques intercontinentaux (ICBM) et des missiles balistiques intercontinentaux (IR), à savoir une plus grande simplicité et une relative invulnérabilité à l'interception, que le La-350 ne possédait pas."
 SOV_cruisemissile_equipment_3:0 "RSS-40 Buran"
 SOV_cruisemissile_equipment_3_short:0 "RSS-40 Buran"
 SOV_cruisemissile_equipment_3_desc:0 "Le Bourane était un missile de croisière intercontinental similaire au La-350 dans son concept. Il fut développé parallèlement au Bouria et reçut son autorisation quelques semaines après le La-350. Il avait une plus grande portée, une vitesse maximale plus élevée et pouvait transporter une ogive plus lourde, mais il connut le même sort que le La-350 lorsqu'il fut annulé en novembre 1957."
 SOV_cruisemissile_equipment_4:0 "Raduga RK-55"
 SOV_cruisemissile_equipment_4_short:0 "Raduga RK-55"
 SOV_cruisemissile_equipment_4_desc:0 "Le RK-55 était un missile de croisière lancé à la fois depuis la terre ferme et depuis un sous-marin, capable de transporter une ogive nucléaire. Développé pour la première fois à la fin des années 1960, le RK-55 a subi des essais en vol en 1976. Alors qu'il était sur le point d'entrer en service en 1987, il a été interdit en vertu des directives établies par le Traité sur les forces nucléaires à portée intermédiaire. Selon des sources contemporaines, il aurait été converti en arme conventionnelle et serait encore utilisé aujourd'hui par les sous-marins."
 SOV_cruisemissile_equipment_5:0 "3M-54 Kalibr"
 SOV_cruisemissile_equipment_5_short:0 "3M-54 Kalibr"
 SOV_cruisemissile_equipment_5_desc:0 "Le 3M-54 est un missile de croisière supersonique extrêmement polyvalent, capable de tout faire. Pouvant être lancé depuis le sol, les airs, les navires de surface et les sous-marins, il est aujourd'hui largement utilisé par l'armée russe. Développé à la fin des années 1980, le 3M-54 est entré en service en 1994. Il a une portée de 660 km et peut transporter jusqu'à 500 kg d'armes nucléaires ou conventionnelles."
 SOV_cruisemissile_equipment_6:0 "3M22 Zircon"
 SOV_cruisemissile_equipment_6_short:0 "3M22 Zircon"
 SOV_cruisemissile_equipment_6_desc:0 "Le 3M22 est un missile de croisière hypersonique antinavire propulsé par statoréacteur qui fait actuellement l'objet d'essais en Russie. Les premiers prototypes ont été lancés en 2012 à partir d'un Tu-22M3, puis à partir d'une plate-forme terrestre en 2016. En 2019, Vladimir Poutine a annoncé qu'il était capable d'atteindre Mach 9. On estime qu'il a une portée d'environ 500 km et qu'il peut transporter une ogive de 400 kg."
 SOV_mp_uav_1:0 "ENICS T10E Eleron-1"
 SOV_mp_uav_1_short:0 "Eleron-1"
 SOV_mp_uav_1_desc:0 "Le système de surveillance à distance T10 Eleron-1 est conçu pour la surveillance aérienne à distance d'objets tels que des structures, des routes, des ponts, des véhicules, des oléoducs et des gazoducs, des lignes électriques, des individus et des groupes de personnes."
 SOV_mp_uav_2:0 "ENICS T23E Eleron-3"
 SOV_mp_uav_2_short:0 "Eleron-3"
 SOV_mp_uav_2_desc:0 "Le système d'observation à distance T23E « Eleron-3 » est destiné à la surveillance des situations au sol. Le système est autonome et peut être utilisé à partir de sites non préparés sur le plan technique, dans des conditions météorologiques simples, avec des vitesses de vent allant jusqu'à 10 m/s, pendant la journée, à des températures comprises entre -20 et +40 degrés et une humidité de 98 %."
 SOV_cas_uav_equipment_1:0 "Tupolev Tu-300 'Korshun-U'"
 SOV_cas_uav_equipment_1_short:0 "Tu-300"
 SOV_cas_uav_equipment_1_desc:0 "Le développement a débuté en 1982, le bureau Tupolev a conçu l'appareil en utilisant des éléments provenant d'un drone de reconnaissance de la génération précédente."
 SOV_cas_uav_equipment_2:0 "Tranzas Dozor-3"
 SOV_cas_uav_equipment_2_short:0 "Dozer"
 SOV_cas_uav_equipment_2_desc:0 "Le système Dozor-3 appartient à la catégorie des drones lourds de moyenne altitude à longue autonomie utilisés pour la surveillance des frontières terrestres et maritimes, la reconnaissance, la surveillance d'objets et de zones."
 SOV_cas_uav_equipment_3:0 "Mikoyan Skat"
 SOV_cas_uav_equipment_3_short:0 "Skat"
 SOV_cas_uav_equipment_3_desc:0 "Le Mikoyan Skat (qui signifie « patin » en russe) est un drone de reconnaissance et d'attaque. L'accent a été mis sur sa faible observabilité. Le drone a donc été conçu selon une configuration en aile volante, en forme de triangle, avec l'utilisation de matériaux composites et un armement dissimulé dans deux baies internes."
 SOV_naval_uav_equipment_1:0 "Yakovlev Pchela-1T"
 SOV_naval_uav_equipment_1_short:0 "Pchela-1T"
 SOV_naval_uav_equipment_1_desc:0 "Le Yakovlev Pchela-1T est un drone (UAV) fabriqué par le bureau d'études russe Yakovlev. Son premier vol a eu lieu en 1990. Il est principalement utilisé pour la surveillance et l'observation sur les champs de bataille grâce à une liaison vidéo descendante. Il fait partie du complexe d'observation « Stroy-P ». Il peut également être utilisé pour la désignation de cibles et comme cible d'entraînement. Le Pchela est lancé à l'aide de deux moteurs-fusées à propergol solide et récupéré à l'aide d'un parachute."
 SOV_naval_uav_equipment_2:0 "Yakovlev Pchela-1M"
 SOV_naval_uav_equipment_2_short:0 "Pchela-1M"
 SOV_naval_uav_equipment_2_desc:0 "Une version modifiée du drone « Pchela-1T », équipée d'une nouvelle avionique, destinée au complexe « Stroy-PM »."
 SOV_naval_uav_equipment_3:0 "Yakovlev Pchela-1K"
 SOV_naval_uav_equipment_3_short:0 "Pchela-1K"
 SOV_naval_uav_equipment_3_desc:0 "Modification du « Pchela-1M », avec l'installation d'un moteur haute altitude et d'équipements embarqués améliorés pour le travail dans des conditions de faible luminosité."
