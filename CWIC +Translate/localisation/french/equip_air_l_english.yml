 JAP_jet_interceptor_equipment_6_desc:0 "Le F-104J Ryu est un chasseur monoplace, monomoteur, à double dérive. Il s'agit de la variante japonaise du F-104, initialement sélectionné pour répondre aux besoins du Japon en matière de supériorité aérienne en novembre 1960. Construit au départ par Lockheed, puis repris par Mitsubishi Heavy Industries, le F-104J a été livré à partir de 1961 et jusqu'en 1966. Le F-104J est équipé d'un canon M61A1 Vulcan de 20 mm et peut transporter jusqu'à quatre missiles AIM-9 Sidewinder."
 JAP_jet_interceptor_equipment_7:0 "Mitsubishi F-4EJ Phantom II"
 JAP_jet_interceptor_equipment_7_short:0 "F-4EJ Phantom II Early"
 JAP_jet_interceptor_equipment_7_desc:0 "La première version du F-4EJ n'était pas capable d'effectuer des missions air-sol."
 JAP_jet_interceptor_equipment_8:0 "Mitsubishi F-15J Eagle"
 JAP_jet_interceptor_equipment_8_short:0 "F-15J Eagle"
 JAP_jet_interceptor_equipment_8_desc:0 "Les F-15J/DJ sont identiques aux F-15C/D, à l'exception du système ECM, du système d'alerte radar et de l'équipement nucléaire. Le système de contre-mesures internes AN/ALQ-135 est remplacé par le J/ALQ-8 indigène et le récepteur d'alerte radar AN/ALR-56 est remplacé par le J/APR-4."
 JAP_jet_interceptor_equipment_9:0 "Mitsubishi F-15J Kai Eagle"
 JAP_jet_interceptor_equipment_9_short:0 "F-15J Eagle MSIP"
 JAP_jet_interceptor_equipment_9_desc:0 "Programme d'amélioration en plusieurs étapes du F-15J par Mitsubishi."
 JAP_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 JAP_mr_stealth_fighter_equipment_1_short:0 "F-35A Lightning II"
 JAP_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnels (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le programme F-35 a débuté en 1992, la variante A ayant pris son envol fin 2006 et largué ses premières bombes moins de six ans plus tard. La variante A est la plus petite et la plus légère des variantes du F-35. Elle est principalement destinée à remplacer le F-16 Fighting Falcon."
 JAP_stealth_fighter_equipment_1:0 "Mitsubishi F-2 Viper Zero"
 JAP_stealth_fighter_equipment_1_short:0 "F-2 Viper Zero"
 JAP_cv_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35C Lightning II"
 JAP_cv_mr_stealth_fighter_equipment_1_short:0 "F-35C Lightning II"
 JAP_cv_mr_stealth_fighter_equipment_1_desc:0 "Le F-35C est la variante CATOBAR (Catapult Assisted Take-Off But Arrested Recovery) de la famille F-35 Lightning II de Lockheed Martin, conçue principalement pour être déployée sur des porte-avions. Le programme F-35 a débuté en 1992, et la variante C a pris son envol dès 2010 et a été opérationnelle sur des porte-avions moins de quatre ans plus tard. Par rapport à ses homologues, la variante C se caractérise par des ailes plus grandes avec des extrémités repliables."
 JAP_jump_stealth_equipment_1:0 "Lockheed Martin F-35B Lightning II"
 JAP_jump_stealth_equipment_1_short:0 "F-35B Lightning II"
 JAP_jump_stealth_equipment_1_desc:0 "Un avion de combat polyvalent produit à partir d'une conception JSF (Joint Strike Fighter). Bien qu'il puisse utiliser diverses armes dans les combats air-air et sol-sol, le coût d'acquisition de cet avion de combat furtif est plus raisonnable que celui du F-22A. Conformément à son utilité, il existe plusieurs types disponibles. Le type « B » utilisé par le Corps des Marines des États-Unis est compatible STOVL (décollage court/atterrissage vertical). Son surnom est « Lightning II »."
 JAP_recon_equipment_0:0 "Stinson L-5 Sentinel"
 JAP_recon_equipment_0_short:0 "L-5 Sentinel"
 JAP_recon_equipment_0_desc:0 "Le Stinson L-5 Sentinel était un avion de liaison et de reconnaissance photographique utilisé pendant la Seconde Guerre mondiale par toutes les branches de l'armée américaine et par la Royal Air Force britannique. Il était produit par la Stinson Aircraft Company."
 JAP_jet_recon_equipment_0:0 "North American RF-86F Sabre"
 JAP_jet_recon_equipment_0_short:0 "RF-86F Sabre"
 JAP_jet_recon_equipment_0_desc:0 "Conversions F-86 avec trois caméras pour la reconnaissance"
 JAP_jet_recon_equipment_1:0 "McDonnell Douglas RF-4E Phantom II"
 JAP_jet_recon_equipment_1_short:0 "RF-4E Phantom II"
 JAP_jet_recon_equipment_1_desc:0 "À la fin des années 1960, le Japon a choisi le F-4 Phantom II comme nouveau chasseur. Le 1er novembre 1968, ce choix a été rendu public et le Japon est devenu l'un des rares pays à produire cet avion sous licence. La Nihon Koku Jietai (Force aérienne d'autodéfense japonaise, JASDF) a reçu au total 154 F-4EJ et RF-4E. Alors que les F-4EJ ont été presque entièrement construits par Mitsubishi Heavy Industries, les RF-4E ont été achetés directement à McDonnell-Douglas."
 JAP_jet_recon_equipment_2:0 "Mitsubishi RF-4EJ Kai Phantom II"
 JAP_jet_recon_equipment_2_short:0 "RF-4EJ Kai Phantom II"
 JAP_jet_recon_equipment_2_desc:0 "À la fin des années 1960, le Japon a choisi le F-4 Phantom II comme nouveau chasseur. Le 1er novembre 1968, ce choix a été rendu public et le Japon est devenu l'un des rares pays à produire cet avion sous licence. La Nihon Koku Jietai (Force aérienne d'autodéfense japonaise, JASDF) a reçu au total 154 F-4EJ et RF-4E. Alors que les F-4EJ ont été presque entièrement construits par Mitsubishi Heavy Industries, les RF-4E ont été achetés directement à McDonnell-Douglas."
 JAP_jet_light_equipment_1:0 "Lockheed T-33 Shooting Star"
 JAP_jet_light_equipment_1_short:0 "T-33 Shooting Star"
 JAP_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80, d'abord sous le nom de TP-80C/TF-80C, puis sous celui de T-33A."
 JAP_jet_light_equipment_2:0 "Kawasaki T-33A Wakataka"
 JAP_jet_light_equipment_2_short:0 "T-33A Wakataka"
 JAP_jet_light_equipment_2_desc:0 "La JASDF a reçu un total de 68 Lockheed T-33A de l'USAF et les a rapidement baptisés Wakataka. Il a également été décidé qu'une entreprise locale se chargerait de la production sous licence du T-33A. Kawasaki s'est attelée à la tâche et a d'abord assemblé 20 kits démontés produits par Lockheed. Le premier T-33A entièrement japonais est sorti des chaînes de production et a été remis à la JASDF le 22 novembre 1956. Au total, 210 T-33A construits par Kawasaki ont été produits jusqu'à la fin de la production en 1959."
 JAP_jet_light_equipment_3:0 "Fuji T-1"
 JAP_jet_light_equipment_3_short:0 "T-1"
 JAP_jet_light_equipment_3_desc:0 "Le T-1 fut le premier avion à réaction japonais conçu localement depuis la Seconde Guerre mondiale. Il fut le premier avion à réaction produit en série au Japon et le premier à être équipé d'ailes en flèche."
 JAP_jet_light_equipment_4:0 "Mitsubishi T-2"
 JAP_jet_light_equipment_4_short:0 "T-2"
 JAP_jet_light_equipment_4_desc:0 "Le Mitsubishi T-2 était un avion d'entraînement supersonique utilisé par la Force aérienne d'autodéfense japonaise. Lancé en 1975, il fut le premier avion de conception japonaise à franchir le mur du son. Il servit de base à la conception de l'avion militaire Mitsubishi F-1."
 JAP_jet_light_equipment_5:0 "Kawasaki T-4"
 JAP_jet_light_equipment_5_short:0 "T-4"
 JAP_jet_light_equipment_5_desc:0 "Le Kawasaki T-4 est un avion d'entraînement intermédiaire subsonique japonais développé et fabriqué par le conglomérat commercial Kawasaki Heavy Industries. Son seul exploitant est la Force aérienne d'autodéfense japonaise (JASDF), en partie en raison des restrictions historiques sur l'exportation de matériel militaire."
