 AST_nav_bomber_equipment_4:0 "Lockheed P2V-2 Neptune"
 AST_nav_bomber_equipment_4_short:0 "P2V-2 Neptune"
 AST_nav_bomber_equipment_4_desc:0 "Le P2V était un avion de patrouille maritime et anti-sous-marin développé pour remplacer les PV-1 Ventura et PV-2 Harpoon de la Seconde Guerre mondiale. Introduit en 1947 pour la marine américaine, il s'agissait en fait d'un avion basé à terre, et le P2V, rebaptisé P-2 après 1962, n'a jamais effectué d'appontage. Cependant, un petit nombre d'entre eux ont été convertis et déployés à partir de porte-avions comme bombardiers nucléaires de fortune qui devaient atterrir sur la côte ou amerrir, à l'instar des bombardiers utilisés lors du raid de Doolittle pendant la Seconde Guerre mondiale. Son surnom est « Neptune », d'après le dieu romain de la mer."
 AST_nav_bomber_equipment_5:0 "Lockheed P2V-7 Neptune"
 AST_nav_bomber_equipment_5_short:0 "P2V-7 Neptune"
 AST_nav_bomber_equipment_5_desc:0 "Dernière variante Neptune produite par Lockheed, équipée de moteurs R-3350-32W et J-34. Elle était équipée de réservoirs d'extrémité d'aile à faible traînée, d'un radar de recherche AN/APS-20 dans un radôme révisé et d'une verrière bombée. Les premiers appareils étaient équipés de tourelles défensives, mais celles-ci ont été supprimées comme sur le P2V-5."
 AST_nav_bomber_equipment_6:0 "Lockheed P-3 Orion"
 AST_nav_bomber_equipment_6_short:0 "P-3A Orion"
 AST_nav_bomber_equipment_6_desc:0 "Le P-3A (initialement désigné P3V), basé sur l'avion de ligne Lockheed L-188 Electra, a été conçu pour remplacer les anciens P-2 Neptune et P-5 Marlin dans le cadre de missions de patrouille maritime et de lutte anti-sous-marine (ASW) à partir de la terre ferme. Il dispose d'une soute interne pour les torpilles lancées depuis les airs, avec des pylônes sous les ailes pouvant accueillir une multitude d'armes, notamment des missiles antinavires à longue portée, des missiles air-sol, des mines et des grenades sous-marines. Il est également équipé d'un détecteur d'anomalies magnétiques à l'arrière pour détecter les sous-marins à l'aide du champ magnétique terrestre. Avec de tels outils à sa disposition et continuant à remplir son rôle depuis son introduction en 1962, il est tout à fait approprié que cet avion soit surnommé « Orion », le chasseur de navires ennemis."
 AST_nav_bomber_equipment_7:0 "Lockheed P-3C Orion"
 AST_nav_bomber_equipment_7_short:0 "P-3C Orion"
 AST_nav_bomber_equipment_7_desc:0 "Le P-3C était équipé d'une nouvelle suite ASW et d'un ordinateur de mission avec une configuration interne révisée. À l'extérieur, le P-3C était doté d'une échelle d'accès à commande électrique, d'une petite antenne sur le sommet de l'aileron, de rampes de largage de bouées acoustiques sous le fuselage et de trois petites fenêtres à l'arrière droit (une fenêtre à l'avant de la sortie de secours au-dessus de l'aile et deux à l'arrière). Les premiers appareils produits étaient équipés d'une caméra située dans la partie inférieure du radôme. Les appareils produits ultérieurement étaient équipés d'une tourelle IRDS rétractable à la place de la caméra frontale. Au début des années 1980, les caméras frontales existantes ont été remplacées par des tourelles IRDS. Les premiers modèles étaient également connus sous le nom de P-3C « Baseline » ou Non-Update (NUD). Tous les appareils ont ensuite été équipés de deux systèmes de navigation inertielle LTN-72."
 AST_nav_bomber_equipment_8:0 "Boeing P-8 Poseidon"
 AST_nav_bomber_equipment_8_short:0 "P-8 Poseidon"
 AST_nav_bomber_equipment_8_desc:0 "Initialement connu sous le nom de Multimission Maritime Aircraft (MMA), le P-8 a été conçu pour remplacer le vénérable P-3 Orion. Développé à partir du Boeing 737 Next Generation Airliner, le P-8 a été conçu pour la lutte anti-sous-marine et la patrouille maritime. De plus, il peut assurer le soutien électronique (ESM) grâce à sa capacité d'autoprotection et d'alerte précoce (EWSP). Avec des variantes en service aux États-Unis, au Royaume-Uni, en Inde et en Australie depuis son introduction en 2013, le « Poséidon » est en passe de devenir le nouveau roi des mers."
 AST_cv_CAS_equipment_2:0 "Blackburn Skua"
 AST_cv_CAS_equipment_2_short:0 "Skua"
 AST_cv_CAS_equipment_3:0 "Fairey Firefly Mk.1"
 AST_cv_CAS_equipment_3_short:0 "Firefly Mk.1"
 AST_cv_CAS_equipment_3_desc:0 "Le Canada a choisi d'acquérir le Firefly malgré l'opposition qui privilégiait l'achat d'avions américains. À titre de mesure provisoire, des Firefly de la Royal Navy ont été prêtés pendant que des avions plus perfectionnés et spécialement conçus à cet effet étaient en cours de construction."
 AST_cv_jet_CAS_equipment_1:0 "Fairey Firefly AS Mk.5"
 AST_cv_jet_CAS_equipment_1_short:0 "Firefly AS Mk.5"
 AST_cv_jet_CAS_equipment_1_desc:0 "La marine canadienne a utilisé 65 Fireflies AS Mk.5 sur ses porte-avions. Le Firefly AS.Mk 5, plus récent, était un avion anti-sous-marin équipé de bouées acoustiques et d'équipements américains."
 AST_cv_jet_CAS_equipment_2:0 "Hawker Sea Fury FB.11"
 AST_cv_jet_CAS_equipment_2_short:0 "Sea Fury FB.11"
 AST_cv_jet_CAS_equipment_3:0 "Hawker Sea Fury FB.20"
 AST_cv_jet_CAS_equipment_3_short:0 "Sea Fury FB.20"
 AST_cv_jet_CAS_equipment_4:0 "Douglas A-4B Skyhawk"
 AST_cv_jet_CAS_equipment_4_short:0 "A-4B Skyhawk"
 AST_cv_jet_CAS_equipment_4_desc:0 "L'A-4B est un avion d'attaque léger monomoteur capable d'emporter la même charge de bombes qu'un B-17 malgré sa taille plus réduite. En service dans de nombreuses forces aériennes et aéronavales depuis sa mise en service en 1954, il a subi de nombreuses modifications et modernisations au cours de ses plus de 60 ans de service et continue d'être utilisé par de nombreux pays à ce jour. Son surnom est « Skyhawk »."
