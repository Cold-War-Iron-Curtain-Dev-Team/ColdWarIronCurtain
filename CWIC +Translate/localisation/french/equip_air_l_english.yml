 PRC_cruisemissile_equipment_6_short:0 "CJ-10"
 YUG_fighter_equipment_0:0 "Armée de l'air et défense aérienne yougoslaves"
 YUG_fighter_equipment_0_short:0 "RV i PVO"
 YUG_fighter_equipment_0_desc:0 "L'armée de l'air et la défense aérienne constituaient l'une des trois branches de l'armée populaire yougoslave, l'armée yougoslave. Communément appelée « armée de l'air yougoslave », elle figurait à son apogée parmi les plus importantes d'Europe."
 YUG_fighter_equipment_1:0 "Ikarus IK-2"
 YUG_fighter_equipment_1_short:0 "IK-2"
 YUG_fighter_equipment_2:0 "Supermarine Spitfire F Mk.V"
 YUG_fighter_equipment_2_short:0 "Spitfire F Mk.V"
 YUG_fighter_equipment_3:0 "Republic F-47D-40 Thunderbolt"
 YUG_fighter_equipment_3_short:0 "F-47D-40 Thunderbolt"
 YUG_jet_multirole_equipment_1:0 "Ikarus S-49"
 YUG_jet_multirole_equipment_1_short:0 "S-49"
 YUG_jet_multirole_equipment_1_desc:0 "L'Ikarus S-49 était un avion de chasse monomoteur monoplace yougoslave construit pour l'armée de l'air yougoslave peu après la Seconde Guerre mondiale. À la suite de la rupture entre Tito et Staline en 1948, la RV i PVO s'est retrouvée avec un parc aérien composé principalement d'avions soviétiques. Incapable d'acquérir de nouveaux avions ou des pièces de rechange pour sa flotte existante, la RV i PVO s'est tournée vers son industrie aéronautique nationale afin de créer un modèle local pour répondre à ses besoins en avions supplémentaires."
 YUG_jet_multirole_equipment_2:0 "North American F-86A Sabre"
 YUG_jet_multirole_equipment_2_short:0 "F-86A Sabre"
 YUG_jet_multirole_equipment_3:0 "North American F-86E Sabre"
 YUG_jet_multirole_equipment_3_short:0 "F-86E Sabre"
 YUG_jet_multirole_equipment_4:0 "North American F-86H Sabre"
 YUG_jet_multirole_equipment_4_short:0 "F-86H Sabre"
 YUG_jet_multirole_equipment_5:0 "Mikoyan-Gurevich MiG-21F-13"
 YUG_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, équipé de missiles à portée au-delà du champ visuel et d'un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, notamment en Chine et en Inde où il a été construit en grand nombre sous licence. Plus de 11 000 exemplaires ont été construits, servant dans plus de 60 pays sur les 5 continents. Au cours de sa durée de vie, le MiG-21 a abattu 240 avions ennemis. Le MiG-21 a été utilisé dans de nombreux conflits, notamment au Vietnam (où il a remporté un énorme succès), lors de la guerre indo-pakistanaise de 1971, lors de la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il est toujours en service après plus de six décennies."
 YUG_jet_multirole_equipment_5_short:0 "L-12"
 YUG_jet_multirole_equipment_6:0 "Mikoyan-Gurevich MiG-21PFM"
 YUG_jet_multirole_equipment_6_desc:0 "MiG-21 de conception est-allemande modernisé avec des radars RP-21."
 YUG_jet_multirole_equipment_6_short:0 "L-14"
 YUG_jet_multirole_equipment_7:0 "Mikoyan-Gurevich MiG-21M "
 YUG_jet_multirole_equipment_7_desc:0 "Variante d'exportation du MiG-21S présentant deux différences majeures : le radar RP-22 du MiG-21S a été remplacé par l'ancien radar RP-21MA, et il était équipé d'un canon GSh-23L intégré au lieu d'un pod canon. Dans son rôle air-air, il ne pouvait transporter que des missiles air-air à guidage infrarouge R-3S sur ses quatre pylônes, car la variante SARH, le R-3R, n'était pas autorisée à l'exportation."
 YUG_jet_multirole_equipment_7_short:0 "L-15"
 YUG_jet_multirole_equipment_8:0 "Mikoyan-Gurevich MiG-21bis"
 YUG_jet_multirole_equipment_8_desc:0 "Le développement ultime du MiG-21, équipé du turboréacteur Tumanskiy R25-300 et d'un grand nombre d'autres améliorations par rapport aux modèles précédents."
 YUG_jet_multirole_equipment_8_short:0 "L-17"
 YUG_jet_multirole_equipment_9:0 "Mikoyan-Gurevich MiG-21bis-K"
 YUG_jet_multirole_equipment_9_short:0 "L-17K"
 YUG_jet_multirole_equipment_10:0 "Mikoyan-Gurevich MiG-29"
 YUG_jet_multirole_equipment_10_desc:0 "La Yougoslavie a été le premier pays européen hors Union soviétique à exploiter le MiG-29."
 YUG_jet_multirole_equipment_10_short:0 "L-18"
 YUG_mr_stealth_fighter_equipment_1:0 "SOKO L-19 Novi Avion"
 YUG_mr_stealth_fighter_equipment_1_short:0 "L-19"
 YUG_mr_stealth_fighter_equipment_1_desc:0 "Le Novi Avion (Nouvel Avion) était un programme d'avion de combat multirôle de quatrième génération qui devait être construit par le constructeur aéronautique yougoslave SOKO. L'Avion présentait une configuration delta-canard raccourcie et devait être capable d'atteindre des vitesses supersoniques en configuration de combat. L'Avion partageait plusieurs points communs avec l'avion de combat Rafale de la société française Dassault Aviation ; la France avait fourni une assistance technique considérable à la Yougoslavie au cours du programme Avion."
