 JAP_transport_plane_equipment_1:0 "Douglas R4D Manazuru"
 JAP_transport_plane_equipment_1_short:0 "R4D Manazuru"
 JAP_transport_plane_equipment_1_desc:0 "Développé à partir de l'avion de ligne Douglas DC-3 lors de son premier vol en 1941, le C-47 était l'avion de transport par excellence utilisé par les Alliés. Pendant la Seconde Guerre mondiale, les forces armées de nombreux pays ont utilisé le C-47 et des DC-3 modifiés pour le transport de troupes, de marchandises et de blessés. Plus de 10 000 unités, tant des C-47 que des R4D (plus tard C-117), la variante navale, ont été construites pour la guerre, et de nombreux « Skytrains » ont été utilisés non seulement pour le transport de troupes et de marchandises, mais aussi pour les opérations de recherche et de sauvetage et, pendant la guerre du Vietnam, comme premiers hélicoptères de combat."
 JAP_transport_plane_equipment_2:0 "Curtiss C-46A Commando"
 JAP_transport_plane_equipment_2_short:0 "C-46A Commando"
 JAP_transport_plane_equipment_2_desc:0 "La Force aérienne d'autodéfense japonaise a utilisé le Commando jusqu'en 1966 au moins, date à laquelle elle a commencé à développer le Kawasaki C-1."
 JAP_transport_plane_equipment_3:0 "Curtiss C-46J Commando"
 JAP_transport_plane_equipment_3_short:0 "C-46J Commando"
 JAP_transport_plane_equipment_3_desc:0 "La Force aérienne d'autodéfense japonaise a utilisé le Commando jusqu'en 1966 au moins, date à laquelle elle a commencé à développer le Kawasaki C-1."
 JAP_transport_plane_equipment_4:0 "Lockheed C-130 Hercules"
 JAP_transport_plane_equipment_4_short:0 "C-130 Hercules"
 JAP_transport_plane_equipment_4_desc:0 "Développé en 1954, le C-130 est un avion de transport capable d'utiliser des pistes non préparées pour décoller et atterrir, ce qui en fait un appareil pratique pour le transport de troupes et de marchandises ainsi que pour l'évacuation médicale. Mais ce qui vaut à cet avion son surnom d'« Hercules », c'est qu'il existe plusieurs sous-variantes développées pour divers rôles, notamment comme avion de combat (AC-130 Spooky &amp; Spectre), drone de contrôle (DC-130), brouilleur et PSYOPS (EC-130 Compass Call) et reconnaissance météorologique (WC-130). Une machine véritablement polyvalente qui mérite bien son surnom."
 JAP_transport_plane_equipment_5:0 "NAMC YS-11"
 JAP_transport_plane_equipment_5_short:0 "YS-11"
 JAP_transport_plane_equipment_5_desc:0 "Le NAMC YS-11 est un avion de ligne à turbopropulsion conçu et construit par la Nihon Aircraft Manufacturing Corporation (NAMC), un consortium japonais. Il a été le seul avion de ligne d'après-guerre entièrement conçu et fabriqué au Japon jusqu'au développement du Mitsubishi SpaceJet dans les années 2010, soit environ 50 ans plus tard."
 JAP_transport_plane_equipment_6:0 "Kawasaki C-1"
 JAP_transport_plane_equipment_6_short:0 "C-1"
 JAP_transport_plane_equipment_6_desc:0 "Le Kawasaki C-1 (川崎 C-1) est un avion de transport militaire bimoteur à courte portée développé et fabriqué par le conglomérat japonais Kawasaki Heavy Industries. Il est utilisé exclusivement par la Force aérienne d'autodéfense japonaise (JASDF)."
 JAP_transport_plane_equipment_7:0 "Lockheed C-130H Hercules"
 JAP_transport_plane_equipment_7_short:0 "C-130H Hercules"
 JAP_transport_plane_equipment_8:0 "Lockheed C-130H-30 Hercules"
 JAP_transport_plane_equipment_8_short:0 "C-130H-30 Hercules"
 JAP_transport_plane_equipment_10:0 "Kawasaki C-2"
 JAP_transport_plane_equipment_10_short:0 "C-2"
 JAP_transport_plane_equipment_10_desc:0 "Le Kawasaki C-2 (anciennement XC-2 et C-X) est un avion de transport militaire de taille moyenne, équipé de deux turboréacteurs, à longue portée et à grande vitesse, développé et fabriqué par Kawasaki Aerospace Company. En juin 2016, le C-2 est officiellement entré en service au sein de la Force aérienne d'autodéfense japonaise (JASDF)."
 JAP_naval_helicopter_equipment_1:0 "Sikorsky H-5"
 JAP_naval_helicopter_equipment_1_short:0 "H-5"
 JAP_naval_helicopter_equipment_2:0 "Sikorsky HSS-1N Umitsubame"
 JAP_naval_helicopter_equipment_2_short:0 "HSS-1N Umitsubame"
 JAP_naval_helicopter_equipment_2_desc:0 "Le HSS est la variante anti-sous-marine du S-58 de Sikorsky, une version améliorée du S-55 (et du H-19 Chickasaw militaire). Il avait un nez plus petit, mais avec un fuselage arrière et un train d'atterrissage à roue arrière, plutôt que la configuration à queue haute et à quatre montants de son prédécesseur. Rebaptisé plus tard SH-34G, les variantes anti-sous-marines de cet hélicoptère ont reçu le surnom officiel de « Seabat »."
 JAP_naval_helicopter_equipment_3:0 "Mitsubishi HSS-2 Chidori"
 JAP_naval_helicopter_equipment_3_short:0 "HSS-2 Chidori"
 JAP_naval_helicopter_equipment_4:0 "Mitsubishi HSS-2A Chidori"
 JAP_naval_helicopter_equipment_4_short:0 "HSS-2A Chidori"
 JAP_naval_helicopter_equipment_4_desc:0 "Dérivé du Sikorsky S-61 civil, le SH-3 (désignation originale HSS-2) est un hélicoptère de lutte anti-sous-marine (ASM) bimoteur. Premier hélicoptère amphibie au monde, il pouvait décoller aussi bien de la terre que de la mer. Avec le Seasprite, il fut également l'un des premiers hélicoptères ASM à utiliser des turbomoteurs. Outre ses missions ASM, le SH-3 était aussi utilisé pour la recherche et le sauvetage (SAR), le transport, l'évacuation sanitaire et la détection aéroportée (AEW). Plusieurs exemplaires furent même utilisés comme « Marine One », l'hélicoptère de transport officiel des présidents américains. C'est pourquoi il gagna le surnom de « Roi des mers », considéré comme l'un des hélicoptères les plus polyvalents au monde."
 JAP_naval_helicopter_equipment_5:0 "Mitsubishi HSS-2B Chidori"
 JAP_naval_helicopter_equipment_5_short:0 "HSS-2B Chidori"
 JAP_naval_helicopter_equipment_6:0 "Mitsubishi SH-60J Seahawk"
 JAP_naval_helicopter_equipment_6_short:0 "SH-60J Seahawk"
 JAP_naval_helicopter_equipment_6_desc:0 "La série Mitsubishi H-60 est une série d'hélicoptères équipés de deux turbomoteurs, basés sur la famille d'hélicoptères Sikorsky S-70, destinés à être utilisés par les Forces d'autodéfense japonaises (JSDF). Les SH-60J/K sont des versions de patrouille anti-sous-marine destinées à la Force maritime d'autodéfense japonaise (JMSDF)."
 JAP_naval_helicopter_equipment_7:0 "Mitsubishi SH-60K Seahawk"
 JAP_naval_helicopter_equipment_7_short:0 "SH-60K Seahawk"
 JAP_naval_helicopter_equipment_7_desc:0 "Le SH-60K est une version améliorée du SH-60J. L'hélicoptère anti-sous-marin SH-60K a renforcé les performances et la polyvalence de la JMSDF. Mitsubishi a commencé son développement en 1997. Le SH-60K était auparavant connu sous le nom de SH-60Kai."
 JAP_attack_helicopter_equipment_1:0 "Bell UH-1B Huey Gunship"
 JAP_attack_helicopter_equipment_1_short:0 "UH-1B Gunship"
 JAP_attack_helicopter_equipment_1_desc:0 "Variante d'attaque du Bell UH-1B équipée de lance-roquettes FFAR des Forces d'autodéfense japonaises (JSDF)."
 JAP_attack_helicopter_equipment_2:0 "Bell AH-1S Cobra"
 JAP_attack_helicopter_equipment_2_short:0 "AH-1S Cobra"
 JAP_attack_helicopter_equipment_2_desc:0 "Le modèle de base AH-1S est un AH-1Q amélioré équipé d'un turbomoteur T53-L-703 de 1 800 ch (1 300 kW). L'AH-1S est équipé du sous-système de missiles M65 TOW/Cobra, d'un viseur télescopique M65 (TSU) et d'un viseur reflex M73."
 JAP_attack_helicopter_equipment_3:0 "Bell AH-1S Cobra Step 3"
 JAP_attack_helicopter_equipment_3_short:0 "AH-1S Cobra Step 3"
 JAP_attack_helicopter_equipment_4:0 "Fuji Heavy Industries AH-64DJP Apache"
 JAP_attack_helicopter_equipment_4_short:0 "AH-64DJP Apache"
 JAP_attack_helicopter_equipment_4_desc:0 "Fierté de l'armée américaine, outre sa superbe maniabilité, le radar Longbow fixé au-dessus du rotor principal améliore sa capacité à utiliser des missiles par tous les temps. Grâce à ce radar, il a été surnommé « Apache Longbow »."
 JAP_attack_helicopter_equipment_5:0 "Fuji Heavy Industries AH-64EJP Guardian"
 JAP_attack_helicopter_equipment_5_short:0 "AH-64EJP Guardian"
 JAP_attack_helicopter_equipment_5_desc:0 "L'AH-64E offre une connectivité numérique améliorée, le système tactique interarmées de distribution d'informations (Joint Tactical Information Distribution System), des moteurs T700-GE-701D plus puissants avec une transmission à engrenages frontaux améliorée pour fournir plus de puissance, la capacité de contrôler des véhicules aériens sans pilote (UAV), une capacité IFR complète et un train d'atterrissage amélioré. Les nouvelles pales de rotor en composite, qui ont passé avec succès les essais en 2004, augmentent la vitesse de croisière, la vitesse ascensionnelle et la capacité d'emport."
 JAP_scout_helicopter_equipment_1:0 "Kawasaki OH-6J Cayuse"
 JAP_scout_helicopter_equipment_1_short:0 "OH-6J Cayuse"
 JAP_scout_helicopter_equipment_1_desc:0 "Hélicoptère d'observation léger basé sur le modèle OH-6A Cayuse pour la JGSDF. Construit sous licence au Japon par Kawasaki Heavy Industries."
 JAP_scout_helicopter_equipment_2:0 "Kawasaki OH-6D Loach"
 JAP_scout_helicopter_equipment_2_short:0 "OH-6D Loach"
 JAP_scout_helicopter_equipment_2_desc:0 "Hélicoptère d'observation légère, basé sur le modèle Hughes 500D, destiné à la JGSDF. Construit sous licence au Japon par Kawasaki Heavy Industries."
 JAP_scout_helicopter_equipment_3:0 "Kawasaki OH-6DA Loach"
 JAP_scout_helicopter_equipment_3_short:0 "OH-6DA Loach"
 JAP_scout_helicopter_equipment_3_desc:0 "Au lieu du modèle OH-6D, qui n'est plus commercialisé, la JMSDF a acheté plusieurs MD 500E, baptisés OH-6DA, destinés principalement à la formation."
 JAP_scout_helicopter_equipment_4:0 "MBB/Kawasaki BK 117"
 JAP_scout_helicopter_equipment_4_short:0 "BK 117"
 JAP_scout_helicopter_equipment_4_desc:0 "Le MBB/Kawasaki BK 117 est un hélicoptère utilitaire-transport bimoteur de taille moyenne. Il a été développé et fabriqué conjointement par Messerschmitt-Bölkow-Blohm (MBB) en Allemagne et Kawasaki au Japon. MBB a ensuite été racheté par Daimler-Benz et a finalement intégré Eurocopter, qui a ensuite été rebaptisé Airbus Helicopters."
 JAP_scout_helicopter_equipment_5:0 "Kawasaki OH-1 'Ninja'"
 JAP_scout_helicopter_equipment_5_short:0 "OH-1 'Ninja'"
 JAP_scout_helicopter_equipment_5_desc:0 "Le Kawasaki OH-1 (surnommé « Ninja ») est un hélicoptère militaire de reconnaissance et d'observation développé et fabriqué par la société Kawasaki Aerospace. Son principal exploitant est la Force terrestre d'autodéfense japonaise (JGSDF), qui a initialement acheté l'OH-1 pour remplacer sa flotte existante d'OH-6D Loach par un appareil de fabrication nationale."
 JAP_utility_helicopter_equipment_1:0 "Sikorsky S-55"
 JAP_utility_helicopter_equipment_1_short:0 "S-55"
 JAP_utility_helicopter_equipment_1_desc:0 "Le Sikorsky H-19 Chickasaw (numéro de modèle S-55) était un hélicoptère polyvalent utilisé par l'armée américaine et l'armée de l'air américaine. Il a également été construit sous licence par Westland Aircraft sous le nom de Westland Whirlwind au Royaume-Uni."
 JAP_utility_helicopter_equipment_2:0 "Bell UH-1B Hiyodori"
 JAP_utility_helicopter_equipment_2_short:0 "UH-1B Hiyodori"
 JAP_utility_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connus sous le nom de « Huey » (du nom de sa désignation d'origine avant 1962, HU-1), l'UH-1A est la variante militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agit du premier hélicoptère utilisé par l'armée américaine à être équipé d'un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication des États-Unis dans la guerre du Vietnam. Bien qu'il soit communément appelé « Huey », son surnom officiel est « Iroquois »."
 JAP_utility_helicopter_equipment_3:0 "Bell UH-1H Hiyodori"
 JAP_utility_helicopter_equipment_3_short:0 "UH-1H Hiyodori"
 JAP_utility_helicopter_equipment_3_desc:0 "Introduit en 1963, l'UH-1D est la version militaire du Bell 205. Conçu avec un fuselage allongé, il était principalement destiné au transport de troupes, en remplacement du CH-34 Choctaw au sein de l'armée américaine. 2 000 exemplaires de cette variante « Iroquois D » furent construits, dont un grand nombre furent convertis au standard UH-1H avec un moteur plus puissant et amélioré."
 JAP_utility_helicopter_equipment_4:0 "Bell UH-1J Hiyodori"
 JAP_utility_helicopter_equipment_4_short:0 "UH-1J Hiyodori"
 JAP_utility_helicopter_equipment_4_desc:0 "Version améliorée de l'UH-1H Huey en service dans les Forces d'autodéfense japonaises."
 JAP_utility_helicopter_equipment_5:0 "Mitsubishi UH-60J"
 JAP_utility_helicopter_equipment_5_short:0 "UH-60J"
 JAP_utility_helicopter_equipment_5_desc:0 "Entré en service en 1979, l'UH-60A a succédé à l'UH-1 en tant qu'hélicoptère utilitaire de l'armée américaine. Développé à partir du modèle civil S-70, l'UH-60A pouvait transporter jusqu'à 15 personnes (4 membres d'équipage et jusqu'à 11 soldats équipés). Nommé d'après un chef tribal amérindien Sauk, le « Blackhawk » a servi au combat lors de conflits à la Grenade, au Panama, en Irak, en Somalie, dans les Balkans, en Afghanistan et dans d'autres régions du Moyen-Orient."
 JAP_utility_helicopter_equipment_6:0 "Mitsubishi UH-60JA "
 JAP_utility_helicopter_equipment_6_short:0 "UH-60JA"
 JAP_utility_helicopter_equipment_6_desc:0 "Version améliorée de l'UH-60A, la variante « L » du « Blackhawk » est équipée de moteurs plus puissants, d'une boîte de vitesses plus résistante et d'un système de commande de vol modernisé. Lancé en 1990, l'UH-60L est la principale variante utilitaire du H-60 actuellement en service dans l'armée américaine. Il est également envisagé pour remplacer l'UH-1N dans l'armée de l'air américaine."
 JAP_utility_helicopter_equipment_7:0 "Mitsubishi USH-60K"
 JAP_utility_helicopter_equipment_7_short:0 "USH-60K"
 JAP_utility_helicopter_equipment_7_desc:0 "Pales de rotor à corde large de conception améliorée, moteurs T700-GE-701D (puissance maximale de 2 000 ch ou 1 500 kW chacun), boîte de vitesses à durabilité améliorée, ordinateur intégré IVHMS (Integrated Vehicle Health Management System) et nouveau cockpit en verre."
 JAP_cargo_helicopter_equipment_1:0 "Piasecki CH-21C"
 JAP_cargo_helicopter_equipment_1_short:0 "CH-21C"
 JAP_cargo_helicopter_equipment_2:0 "Kawasaki KV-107II-1"
 JAP_cargo_helicopter_equipment_2_short:0 "KV-107"
 JAP_cargo_helicopter_equipment_2_desc:0 "La version commerciale, le BV 107-II, a été commandée pour la première fois par New York Airways en 1960. En juillet 1962, la compagnie a pris livraison de ses trois premiers appareils, configurés pour accueillir jusqu'à 25 passagers. En 1965, Boeing Vertol a vendu les droits de fabrication du 107 au conglomérat japonais Kawasaki Heavy Industries. En vertu de cet accord, tous les avions civils et militaires du modèle 107 construits au Japon ont été désignés sous le nom de KV 107."
 JAP_cargo_helicopter_equipment_3:0 "Kawasaki CH-47J Chinook"
 JAP_cargo_helicopter_equipment_3_short:0 "CH-47J Chinook"
 JAP_cargo_helicopter_equipment_3_desc:0 "Le CH-47D partage la même cellule que les modèles précédents, la principale différence étant l'adoption de moteurs plus puissants. Les premiers CH-47D étaient à l'origine équipés de deux moteurs T55-L-712, mais le moteur le plus courant est le T55-GA-714A, plus récent. Grâce à son système de chargement à triple crochet, le CH-47D peut transporter des charges lourdes à l'intérieur et jusqu'à 12 000 kg (26 000 lb) à l'extérieur (par exemple des conteneurs de 40 pieds ou 12 mètres). Il a été mis en service pour la première fois en 1979. Dans les opérations d'assaut aérien, il sert souvent de principal moyen de transport pour l'obusier M198 de 155 mm, accompagné de 30 cartouches de munitions et d'un équipage de 11 hommes."
 JAP_cargo_helicopter_equipment_4:0 "Kawasaki KV-107IIA-4"
 JAP_cargo_helicopter_equipment_4_short:0 "KV-107A"
 JAP_cargo_helicopter_equipment_4_desc:0 "Version améliorée destinée à l'assaut et au transport utilitaire, construite pour la Force terrestre d'autodéfense japonaise (JGSDF)."
 JAP_cargo_helicopter_equipment_5:0 "Kawasaki CH-47JA Chinook"
 JAP_cargo_helicopter_equipment_5_short:0 "CH-47JA Chinook"
 JAP_cargo_helicopter_equipment_5_desc:0 "CH-47D modernisé avec une avionique avancée, des instruments GPS et une amélioration de la capacité de survie. Presque tous les anciens Chinook ont été mis à niveau selon cette norme."
 JAP_cargo_helicopter_equipment_6:0 "Boeing CH-47FJ Chinook"
 JAP_cargo_helicopter_equipment_6_short:0 "CH-47FJ Chinook"
 JAP_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, une version améliorée du CH-47D, a effectué son vol inaugural ; le premier modèle de série a été présenté le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les améliorations comprennent des moteurs Honeywell de 4 868 chevaux-vapeur (3 630 kW) et une cellule plus robuste, construite d'une seule pièce afin de réduire les besoins d'entretien. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion afin d'augmenter la durée de vie."
 CHI_fighter_equipment_0:0 "Force Aérienne de la République de Chine"
 CHI_fighter_equipment_0_short:0 "ROCAF"
 CHI_fighter_equipment_0_desc:0 "L'armée de l'air de la République de Chine (ROCAF) a été officiellement créée par le Kuomintang (KMT) après la mise en place du ministère de l'Aviation en 1920. Alors que les tensions entre la Chine et l'Empire japonais s'intensifiaient dans les années 1930, les unités aériennes des seigneurs de guerre chinois, y compris celles de l'armée de l'air provinciale du Guangdong, et les aviateurs chinois d'outre-mer ont été intégrées au commandement centralisé de la ROCAF, officiellement sous le nom d'armée de l'air nationaliste chinoise, et ont coordonné leurs efforts avec le deuxième front uni pour contrer l'invasion et l'occupation impériales japonaises."
 CHI_fighter_equipment_1:0 "Curtiss-Wright CW-21"
 CHI_fighter_equipment_1_short:0 "CW-21"
 CHI_fighter_equipment_2:0 "AFAMF XP-0 Chu"
 CHI_fighter_equipment_2_short:0 "XP-0 Chu"
 CHI_fighter_equipment_3_desc:0 "Le Chu XP-0, également connu sous le nom de Chu (AFAMF) XP-0, était un prototype de chasseur chinois pendant la Seconde Guerre mondiale."
 CHI_fighter_equipment_3:0 "North American F-51D Mustang"
 CHI_fighter_equipment_3_short:0 "F-51D Mustang"
 CHI_jet_multirole_equipment_1:0 "North American F-47N Thunderbolt"
 CHI_jet_multirole_equipment_1_short:0 "F-47N Thunderbolt"
 CHI_jet_multirole_equipment_2:0 "North American F-86A Sabre"
 CHI_jet_multirole_equipment_2_short:0 "F-86A Sabre"
 CHI_jet_multirole_equipment_2_desc:0 "Le F-86 est un avion de chasse à réaction à ailes en flèche développé et mis en service à la fin des années 1940 à partir des recherches capturées par les Allemands. La conception de cet avion lui permettait d'atteindre des vitesses transsoniques et une grande maniabilité, des caractéristiques qui lui permettaient de rivaliser avec son célèbre concurrent, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, avec ses variantes canadiennes et australiennes, est l'avion de chasse occidental le plus produit de l'histoire de l'aviation."
 CHI_jet_multirole_equipment_3:0 "North American F-86F Sabre"
 CHI_jet_multirole_equipment_3_short:0 "F-86F Sabre"
 CHI_jet_multirole_equipment_3_desc:0 "Système de commandes de vol amélioré et « empennage entièrement mobile » (Ce système a été remplacé par une commande entièrement motorisée avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche toujours conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur). Les Sabre F bénéficiaient d'une agilité à haute vitesse nettement améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 CHI_jet_multirole_equipment_4:0 "North American F-100 Super Sabre"
 CHI_jet_multirole_equipment_4_short:0 "F-100 Super Sabre"
 CHI_jet_multirole_equipment_5:0 "Locheed F-104G Starfighter"
 CHI_jet_multirole_equipment_5_short:0 "F-104G Starfighter"
 CHI_jet_multirole_equipment_6:0 "Amélioration de la fiabilité du Lockheed F-104G Starfighter"
 CHI_jet_multirole_equipment_6_short:0 "F-104G Starfighter RU"
 CHI_jet_multirole_equipment_7:0 "Mise à niveau à mi-vie du Lockheed F-104G Starfighter"
 CHI_jet_multirole_equipment_7_short:0 "F-104G MLU"
 CHI_jet_multirole_equipment_8:0 "General Dynamics F-16A Fighting Falcon"
 CHI_jet_multirole_equipment_8_short:0 "F-16A Fighting Falcon"
 CHI_jet_multirole_equipment_9:0 "Dassault Mirage 2000-5EI"
 CHI_jet_multirole_equipment_9_short:0 "Mirage 2000-5EI"
 CHI_jet_multirole_equipment_10:0 "AIDC F-CK-1A Ching-kuo"
 CHI_jet_multirole_equipment_10_short:0 "F-CK-1A Ching-kuo"
 CHI_jet_multirole_equipment_10_desc:0 "L'AIDC F-CK-1 Ching-Kuo, communément appelé Indigenous Defense Fighter (IDF), est un avion de combat multirôle qui tire son nom de Chiang Ching-kuo, ancien président de la République de Chine. L'avion a effectué son premier vol en 1989. Il a été livré à l'armée de l'air de la République de Chine (Taïwan) en janvier 1994 et est entré en service en 1997."
 CHI_mr_stealth_fighter_equipment_1:0 "AIDC F-CK-1C Hsiang Sheng"
 CHI_mr_stealth_fighter_equipment_1_short:0 "F-CK-1C Hsiang Sheng"
 CHI_mr_stealth_fighter_equipment_1_desc:0 "En 2001, il a été annoncé que le développement d'une nouvelle variante « furtive » dotée de moteurs plus puissants et d'un système de contrôle de tir amélioré allait débuter cette année-là. Dans une interview accordée en 2006 à Jane's Defence Weekly, l'ancien président de l'AIDC, Sun Tao-Yu, a déclaré que deux nouveaux prototypes avaient été fabriqués. Cette mise à niveau permettrait à l'IDF de transporter 771 kg de carburant supplémentaires. Elle comprend également une suite avionique améliorée, des capacités de guerre électronique modernisées et de nouveaux systèmes d'armes. Le train d'atterrissage a été renforcé pour supporter la charge utile et le carburant supplémentaires."
 CHI_recon_equipment_0:0 "Stinson L-5 Sentinel"
 CHI_recon_equipment_0_short:0 "L-5 Sentinel"
 CHI_recon_equipment_0_desc:0 "Le Stinson L-5 Sentinel était un avion de liaison et de reconnaissance photographique utilisé pendant la Seconde Guerre mondiale par toutes les branches de l'armée américaine et par la Royal Air Force britannique. Il était produit par la Stinson Aircraft Company."
 CHI_jet_recon_equipment_0:0 "North American RF-86F Sabre"
 CHI_jet_recon_equipment_0_short:0 "RF-86F Sabre"
 CHI_jet_recon_equipment_0_desc:0 "Conversions F-86 avec trois caméras pour la reconnaissance"
 CHI_jet_recon_equipment_1:0 "McDonnell RF-101A Voodoo"
 CHI_jet_recon_equipment_1_short:0 "RF-101A Voodoo"
 CHI_jet_recon_equipment_2:0 "Northrop RF-5E"
 CHI_jet_recon_equipment_2_short:0 "RF-5E"
 CHI_jet_light_equipment_1:0 "Lockheed T-33 Shooting Star"
 CHI_jet_light_equipment_1_short:0 "T-33 Shooting Star"
 CHI_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80, d'abord sous le nom de TP-80C/TF-80C, puis sous celui de T-33A."
 CHI_jet_light_equipment_3:0 "Northrop F-5A Freedom Fighter"
 CHI_jet_light_equipment_3_short:0 "F-5A Freedom Fighter"
 CHI_jet_light_equipment_3_desc:0 "Le F-5A a été développé comme un avion de chasse léger destiné principalement à l'exportation. Il est plus léger et moins coûteux à produire que la plupart des autres chasseurs modernes, ce qui le rend idéal pour compléter les escadrons de chasseurs à courte portée. Malgré cela, ce modèle s'est révélé très maniable et était l'avion le plus à même de rivaliser avec le MiG-21 « Fishbed » soviétique. Comme il était utilisé par la majorité des alliés des États-Unis au plus fort de la guerre froide, il a été baptisé à juste titre « Freedom Fighter » (combattant de la liberté)."
 CHI_jet_light_equipment_4:0 "Northrop F-5B Freedom Fighter"
 CHI_jet_light_equipment_4_short:0 "F-5B Freedom Fighter"
 CHI_jet_light_equipment_4_desc:0 "L'avion américain Northrop F-5B Freedom Fighter utilisé par l'armée de l'air royale norvégienne. Principalement utilisé comme avion d'entraînement pour d'autres avions à réaction multirôles, il était équipé de points d'emport pour le transport de munitions."
 CHI_jet_light_equipment_5:0 "AIDC AT-3 Tzu Chung"
 CHI_jet_light_equipment_5_short:0 "AT-3 Tzu Chung"
 CHI_jet_light_equipment_5_desc:0 "L'AIDC AT-3 Tzu Chung est un avion d'entraînement à réaction avancé utilisé par l'armée de l'air de la République de Chine (ROCAF). Au total, soixante-deux appareils ont été fabriqués par l'Aerospace Industrial Development Corporation de Taïwan en collaboration avec le constructeur aéronautique américain Northrop entre 1984 et 1990."
 CHI_jet_interceptor_equipment_1:0 "Gloster CXP-1001"
 CHI_jet_interceptor_equipment_1_short:0 "CXP-1001"
 CHI_jet_interceptor_equipment_2:0 "North American F-86D Sabre Dog"
 CHI_jet_interceptor_equipment_2_short:0 "F-86D Sabre Dog"
 CHI_jet_interceptor_equipment_3:0 "North American F-86L Sabre Dog"
 CHI_jet_interceptor_equipment_3_short:0 "F-86L Sabre Dog"
 CHI_jet_interceptor_equipment_4:0 "Lockheed F-104A Starfighter"
 CHI_jet_interceptor_equipment_4_short:0 "F-104A Starfighter"
 CHI_jet_interceptor_equipment_5:0 "McDonnell F-101C Voodoo"
 CHI_jet_interceptor_equipment_5_short:0 "F-101C Voodoo"
 CHI_jet_interceptor_equipment_6:0 "Mitsubishi F-104J Kai Starfighter"
 CHI_jet_interceptor_equipment_6_short:0 "F-104J Kai"
 CHI_CAS_equipment_1:0 "Northrop A-17"
 CHI_CAS_equipment_1_short:0 "A-17"
 CHI_CAS_equipment_2:0 "Vultee A-19"
 CHI_CAS_equipment_2_short:0 "A-19"
 CHI_CAS_equipment_3:0 "Republic P-47D-30-RA Thunderbolt"
 CHI_CAS_equipment_3_short:0 "P-47D-30-RA"
 CHI_CAS_equipment_4:0 "Douglas A-26C Invader"
 CHI_CAS_equipment_4_short:0 "A-26C Invader"
 CHI_jet_CAS_equipment_1:0 "Republic F-84E Thunderjet"
 CHI_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 CHI_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 CHI_jet_CAS_equipment_2:0 "Republic F-84G Thunderjet"
 CHI_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 CHI_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 CHI_jet_CAS_equipment_3:0 "Republic F-84F Thunderstreak"
 CHI_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 CHI_jet_CAS_equipment_3_desc:0 "Développé à partir du F-84 Thunderjet précédent, le F-84F était une variante à ailes en flèche du chasseur-bombardier, conçue pour rapprocher ce type d'appareil des performances du très vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances au décollage, tout en offrant une stabilité et un contrôle médiocres. Ce modèle a été utilisé de manière limitée tout au long de sa carrière, qui s'est terminée en 1971. Son surnom est « Thunderstreak »."
 CHI_jet_CAS_equipment_8:0 "AIDC XA-3 Lui Meng"
 CHI_jet_CAS_equipment_8_short:0 "XA-3 Lui Meng"
 CHI_jet_CAS_equipment_8_desc:0 "Prototype de la version XA-3 qui a été annulée afin de se concentrer sur le F-CK-1 Ching Kuo. Conçu pour l'attaque au sol, monoplace. Équipé d'un canon automatique de 30 mm et de supports d'armes supplémentaires, il dispose d'une capacité de transport et peut également être équipé de missiles antinavires Hsiung-feng II."
 CHI_heavy_fighter_equipment_1:0 "Republic P-43A-1 Lancer"
 CHI_heavy_fighter_equipment_1_short:0 "P-43A-1 Lancer"
 CHI_heavy_fighter_equipment_2:0 "Lockheed P-38J Lightning"
 CHI_heavy_fighter_equipment_2_short:0 "P-38J Lightning"
 CHI_heavy_fighter_equipment_2_desc:0 "Avion à deux moteurs à pistons conçu pour privilégier la vitesse et l'armement lourd. Pendant la Seconde Guerre mondiale, sa vitesse a été mise à profit dans de nombreuses attaques éclair au-dessus du Pacifique, détruisant de nombreux avions japonais. Sa forme distinctive lui a valu le surnom de « der Gabelschwanz-Teufel » (le diable à queue fourchue) en Allemagne et de « Ni hikouki, ippairotto » (deux avions, un pilote) au Japon. Il est également connu sous le nom de « Lightning »."
 CHI_heavy_fighter_equipment_3:0 "Lockheed P-38L Lightning"
 CHI_heavy_fighter_equipment_3_short:0 "P-38L Lightning"
 CHI_heavy_fighter_equipment_3_desc:0 "Avion à deux moteurs à pistons conçu pour privilégier la vitesse et l'armement lourd. Pendant la Seconde Guerre mondiale, sa vitesse a été mise à profit dans de nombreuses attaques éclair au-dessus du Pacifique, détruisant de nombreux avions japonais. Sa forme distinctive lui a valu le surnom de « der Gabelschwanz-Teufel » (le diable à queue fourchue) en Allemagne et de « Ni hikouki, ippairotto » (deux avions, un pilote) au Japon. Il est également connu sous le nom de « Lightning »."
