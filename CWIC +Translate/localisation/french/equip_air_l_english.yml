 CHI_utility_helicopter_equipment_4:0 "Bell UH-1H Huey"
 CHI_utility_helicopter_equipment_4_short:0 "UH-1H Huey"
 CHI_utility_helicopter_equipment_7:0 "Sikorsky UH-60M Black Hawk"
 CHI_utility_helicopter_equipment_7_short:0 "UH-60M Black Hawk"
 CHI_utility_helicopter_equipment_7_desc:0 "Pales de rotor à corde large de conception améliorée, moteurs T700-GE-701D (puissance maximale de 2 000 ch ou 1 500 kW chacun), boîte de vitesses à durabilité améliorée, ordinateur intégré IVHMS (Integrated Vehicle Health Management System) et nouveau cockpit en verre."
 CHI_cargo_helicopter_equipment_5:0 "Boeing CH-47D Chinook Block II"
 CHI_cargo_helicopter_equipment_5_short:0 "CH-47D Block II"
 CHI_cargo_helicopter_equipment_6:0 "Boeing CH-47SD Chinook"
 CHI_cargo_helicopter_equipment_6_short:0 "CH-47SD Chinook"
 CHI_attack_helicopter_equipment_4:0 "Bell AH-1W SuperCobra"
 CHI_attack_helicopter_equipment_4_short:0 "AH-1W SuperCobra"
 CHI_attack_helicopter_equipment_4_desc:0 "Le Bell AH-1 SuperCobra est un hélicoptère d'attaque bimoteur basé sur l'AH-1 Cobra monomoteur de l'armée américaine. La famille des Cobra bimoteurs, qui fait elle-même partie de la grande famille des Huey, comprend l'AH-1J SeaCobra, l'AH-1T Improved SeaCobra et l'AH-1W SuperCobra."
 CHI_attack_helicopter_equipment_5:0 "McDonnell Douglas AH-64E Guardian"
 CHI_attack_helicopter_equipment_5_short:0 "AH-64E Guardian"
 CHI_attack_helicopter_equipment_5_desc:0 "L'AH-64E offre une connectivité numérique améliorée, le système tactique interarmées de distribution d'informations (Joint Tactical Information Distribution System), des moteurs T700-GE-701D plus puissants avec une transmission à engrenages frontaux améliorée pour fournir plus de puissance, la capacité de contrôler des véhicules aériens sans pilote (UAV), une capacité IFR complète et un train d'atterrissage amélioré. Les nouvelles pales de rotor en composite, qui ont passé avec succès les essais en 2004, augmentent la vitesse de croisière, la vitesse ascensionnelle et la capacité d'emport."
 CHI_scout_helicopter_equipment_2:0 "Bell 206 JetRanger"
 CHI_scout_helicopter_equipment_2_short:0 "Bell 206"
 CHI_scout_helicopter_equipment_3:0 "Bell OH-58D Kiowa"
 CHI_scout_helicopter_equipment_3_short:0 "OH-58D Kiowa"
 CHI_scout_helicopter_equipment_3_desc:0 "La variante « D » améliorée du Kiowa était le résultat du programme d'amélioration des hélicoptères de l'armée (AHIP). Elle était dotée de caractéristiques telles qu'une transmission et un moteur améliorés pour les vols à très basse altitude, ainsi qu'une configuration unique à quatre pales du rotor principal qui la rendait beaucoup plus silencieuse que les autres hélicoptères, et plus encore que ses prédécesseurs. L'OH-58D a introduit le viseur monté sur mât (MMS) caractéristique au-dessus du système de rotor, ainsi qu'un cockpit en verre mixte, avec des instruments traditionnels identifiés comme « de secours » pour les situations d'urgence."
 CHI_scout_helicopter_equipment_4:0 "Bell OH-58D Kiowa Warrior"
 CHI_scout_helicopter_equipment_4_short:0 "OH-58D Kiowa Warrior"
 CHI_scout_helicopter_equipment_4_desc:0 "Le Kiowa Warrior, parfois désigné par son acronyme KW, est la version armée de l'OH-58D Kiowa. La principale différence qui distingue le Kiowa Warrior de l'appareil AHIP d'origine est un pylône d'armes universel monté des deux côtés de l'appareil. La mise à niveau du Kiowa Warrior comprend également des améliorations en termes de puissance disponible, de navigation, de communication et de survivabilité, ainsi que des modifications visant à améliorer la capacité de déploiement de l'appareil."
 CHI_naval_helicopter_equipment_7:0 "Sikorsky MH-60T Seahawk"
 CHI_naval_helicopter_equipment_7_short:0 "MH-60R Seahawk"
 CHI_naval_helicopter_equipment_7_desc:0 "Le MH-60R Seahawk est une version améliorée du SH-60 Seahawk. Développé en 1993, le MH-60R a été conçu pour combiner les caractéristiques des anciens SH-60B et SH-60F. Ses capteurs comprennent le pack ASE, le MTS-FLIR, le radar multimode/interrogateur IFF AN/APS-147, une liaison de données aérienne avancée et un sonar actif aérien plus perfectionné. Ces équipements, associés à un système d'armement amélioré (lui permettant de transporter la torpille avancée Mk 54 et les missiles AGM-114 Hellfire), confèrent au « Seahawk » une plus grande flexibilité dans les opérations anti-navales et d'assaut amphibie."
 BEL_fighter_equipment_0:0 "Avions Fairey Firefly"
 BEL_fighter_equipment_0_short:0 "Av-F. Firefly"
 BEL_fighter_equipment_1:0 "Avions Fairey Fantôme"
 BEL_fighter_equipment_1_short:0 "Fantôme"
 BEL_fighter_equipment_2:0 "Renard R.36"
 BEL_fighter_equipment_2_short:0 "R.36"
 BEL_fighter_equipment_3:0 "Supermarine Spitfire Mk.XIV"
 BEL_fighter_equipment_3_short:0 "Spitfire Mk.XIV"
 BEL_jet_multirole_equipment_1:0 "Supermarine Spitfire F Mk.24"
 BEL_jet_multirole_equipment_1_short:0 "Spitfire F Mk.24"
 BEL_jet_multirole_equipment_3:0 "SABCA Hunter F.1"
 BEL_jet_multirole_equipment_3_short:0 "Hunter F.1"
 BEL_jet_multirole_equipment_4:0 "SABCA Hunter F.6"
 BEL_jet_multirole_equipment_4_short:0 "Hunter F.6"
 BEL_jet_multirole_equipment_5:0 "SABCA F-104G Starfighter"
 BEL_jet_multirole_equipment_5_short:0 "F-104G Starfighter"
 BEL_jet_multirole_equipment_5_desc:0 "Pour remplacer les chasseurs SABCA vieillissants, l'armée de l'air royale belge a utilisé des Lockheed F-104G Starfighters construits par SABCA. Le F-104G était utilisé dans une capacité multirôle, à la fois comme intercepteur et comme avion d'attaque au sol."
 BEL_jet_multirole_equipment_8:0 "SABCA F-16A Fighting Falcon"
 BEL_jet_multirole_equipment_8_short:0 "F-16A Fighting Falcon"
 BEL_jet_multirole_equipment_8_desc:0 "Un chasseur maniable et léger, offrant un équilibre parfait entre maniabilité et stabilité. Il est doté d'un fuselage monocoque exceptionnellement léger et aérodynamique, et bien qu'il s'agisse d'un avion monomoteur, il est équipé d'un moteur puissant. Surnommé le « Fighting Falcon », son coût relativement faible et sa puissance élevée expliquent pourquoi il a été adopté par les forces aériennes du monde entier. À ce jour, plus de 4 000 exemplaires de ce modèle à succès ont été fabriqués."
 BEL_jet_multirole_equipment_9:0 "SABCA F-16A Block 15 OCU (améliorations des capacités opérationnelles) Fighting Falcon"
 BEL_jet_multirole_equipment_9_short:0 "F-16A Block 15 OCU"
 BEL_jet_multirole_equipment_9_desc:0 "Première modification majeure apportée au F-16, l'avion Block 15 était équipé de stabilisateurs horizontaux plus grands, de deux points d'emport supplémentaires au niveau de l'entrée d'air sous le nez, d'un nouveau radar et d'une capacité accrue pour les pylônes sous les ailes. Cette variante était également équipée d'une radio UHF (ultra haute fréquence) de dernière génération. Il s'agit de la variante la plus répandue parmi les modèles F-16."
 BEL_jet_multirole_equipment_10:0 "SABCA F-16AM Block 15 MLU (mise à niveau à mi-vie) Fighting Falcon"
 BEL_jet_multirole_equipment_10_short:0 "F-16AM Block 15 MLU"
 BEL_jet_multirole_equipment_10_desc:0 "Le programme F-16 Mid-Life Update (MLU) qui en a résulté a été conçu pour moderniser le cockpit et l'avionique afin de les rendre équivalents à ceux du F-16C/D Block 50/52, ajouter la capacité d'utiliser des missiles air-air guidés par radar et, de manière générale, améliorer les performances opérationnelles, la fiabilité, la facilité d'entretien et la maintenabilité de l'avion."
 BEL_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 BEL_mr_stealth_fighter_equipment_1_short:0 "F-35A Lightning II"
 BEL_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnels (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le programme F-35 a débuté en 1992, la variante A ayant pris son envol fin 2006 et largué ses premières bombes moins de six ans plus tard. La variante A est la plus petite et la plus légère des variantes du F-35. Elle est principalement destinée à remplacer le F-16 Fighting Falcon."
 BEL_heavy_fighter_equipment_1:0 "Bristol Blenheim"
 BEL_heavy_fighter_equipment_1_short:0 "Blenheim"
 BEL_heavy_fighter_equipment_2:0 "Bristol Beaufighter"
 BEL_heavy_fighter_equipment_2_short:0 "Beaufighter"
