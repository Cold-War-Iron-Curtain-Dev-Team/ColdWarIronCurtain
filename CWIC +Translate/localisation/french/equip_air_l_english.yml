 icbm_equipment_1:0 "ICBM I"
 icbm_equipment_1_short:0 "ICBM I"
 icbm_equipment_1_desc:0 "Les ICBM sont des missiles balistiques intercontinentaux. Cette variante de base pourrait même atteindre sa cible."
 icbm_equipment_2:0 "ICBM II"
 icbm_equipment_2_short:0 "ICBM II"
 icbm_equipment_2_desc:0 "Les ICBM sont des missiles balistiques intercontinentaux. Cette variante a été considérablement améliorée."
 icbm_equipment_3:0 "ICBM III"
 icbm_equipment_3_short:0 "ICBM III"
 icbm_equipment_3_desc:0 "Les ICBM sont des missiles balistiques intercontinentaux. Cette variante a une portée et des performances supérieures à la précédente."
 icbm_equipment_4:0 "ICBM IV"
 icbm_equipment_4_short:0 "ICBM IV"
 icbm_equipment_4_desc:0 "Les ICBM sont des missiles balistiques intercontinentaux. Cette variante dispose d'une charge utile importante et est capable d'effectuer des manœuvres d'évitement élémentaires dans la phase d'impact terminal."
 icbm_equipment_5:0 "ICBM V"
 icbm_equipment_5_short:0 "ICBM V"
 icbm_equipment_5_desc:0 "Les ICBM sont des missiles balistiques intercontinentaux. Cette variante à longue portée dispose d'une charge utile importante et est capable d'effectuer des manœuvres d'évitement avancées dans la phase d'impact terminal."
 attack_helicopter_equipment_1:0 "Hélicoptère d'attaque I"
 attack_helicopter_equipment_1_short:0 "Hélicoptère d'attaque I"
 attack_helicopter_equipment_1_desc:0 "Les premiers hélicoptères d'attaque ou hélicoptères de combat équipés d'un armement de base composé de mitrailleuses, de canons aériens ou de roquettes offrent une capacité inégalée en termes de vol stationnaire et d'excellente endurance au-dessus du champ de bataille."
 attack_helicopter_equipment_2:0 "Hélicoptère d'attaque II"
 attack_helicopter_equipment_2_short:0 "Hélicoptère d'attaque II"
 attack_helicopter_equipment_2_desc:0 "Un hélicoptère au design plus abouti, équipé d'un canon à chaîne spécialement conçu et construit à cet effet, ainsi que d'ailettes permettant d'accueillir des lance-roquettes, des réservoirs de carburant ou des armes supplémentaires. Peut-être même des missiles antichars ?"
 attack_helicopter_equipment_3:0 "Hélicoptère d'attaque III"
 attack_helicopter_equipment_3_short:0 "Hélicoptère d'attaque III"
 attack_helicopter_equipment_3_desc:0 "Une conception améliorée des hélicoptères équipés de plusieurs moteurs en cas de panne moteur, leur conférant de meilleures performances que leurs prédécesseurs. Désormais armés d'une variété d'armes telles que des missiles, des roquettes et des canons, tous peuvent être montés."
 attack_helicopter_equipment_4:0 "Hélicoptère d'attaque IV"
 attack_helicopter_equipment_4_short:0 "Hélicoptère d'attaque IV"
 attack_helicopter_equipment_4_desc:0 "Un hélicoptère de conception avancée équipé de nouveaux affichages tête haute, d'un cockpit semi-numérique et armé de radars de contrôle de tir permettant de détecter les forces ennemies. Sa capacité de tir en mode pop-up lui permet même de tirer ses armes meurtrières depuis derrière un abri."
 attack_helicopter_equipment_5:0 "Hélicoptère d'attaque V"
 attack_helicopter_equipment_5_short:0 "Hélicoptère d'attaque V"
 attack_helicopter_equipment_5_desc:0 "Cet hélicoptère moderne, entièrement numérique et connecté, est équipé d'écrans et de systèmes de communication avancés qui lui permettent de surpasser tous ses prédécesseurs. Il dispose de systèmes d'armement sophistiqués, de missiles à guidage laser et sa capacité de mise en réseau lui permet de s'intégrer de manière transparente aux forces terrestres amies ou à d'autres systèmes d'armement."
 scout_helicopter_equipment_1:0 "Éclaireur/Attaque légère I"
 scout_helicopter_equipment_1_short:0 "Hélicoptère de reconnaissance/d'attaque légère I"
 scout_helicopter_equipment_1_desc:0 "Un hélicoptère de reconnaissance léger et agile pour localiser et repérer les positions ennemies."
 scout_helicopter_equipment_2:0 "Éclaireur/Attaque légère II"
 scout_helicopter_equipment_2_short:0 "Hélicoptère de reconnaissance/d'attaque légère II"
 scout_helicopter_equipment_2_desc:0 "Un hélicoptère de reconnaissance léger et agile permettant de localiser et de repérer les positions ennemies. Grâce à son armement léger, il est capable de se défendre."
 scout_helicopter_equipment_3:0 "Éclaireur/Attaque légère III"
 scout_helicopter_equipment_3_short:0 "Hélicoptère de reconnaissance/d'attaque légère III"
 scout_helicopter_equipment_3_desc:0 "Un hélicoptère de reconnaissance léger et agile, armé de missiles, de roquettes ou de canons, peut assurer la reconnaissance en force pour les forces terrestres amies."
 scout_helicopter_equipment_4:0 "Éclaireur/Attaque légère IV"
 scout_helicopter_equipment_4_short:0 "Hélicoptère de reconnaissance/d'attaque légère IV"
 scout_helicopter_equipment_4_desc:0 "Un hélicoptère de reconnaissance avancé, équipé d'un assortiment d'armes et d'instruments numériques, peut survoler un champ de bataille et utiliser ses écrans et ses caméras FLIR pour localiser les positions ennemies plus rapidement et plus efficacement qu'auparavant."
 scout_helicopter_equipment_5:0 "Éclaireur/Attaque légère V"
 scout_helicopter_equipment_5_short:0 "Hélicoptère de reconnaissance/d'attaque légère V"
 scout_helicopter_equipment_5_desc:0 "Un excellent hélicoptère de reconnaissance moderne, armé jusqu'aux dents d'un assortiment d'armes mortelles et équipé d'écrans FLIR et de systèmes radar pour repérer les forces ennemies avant même qu'elles ne se rendent compte de sa présence."
 naval_helicopter_equipment:0 "Hélicoptère naval ASW"
 naval_helicopter_equipment_1:0 "Hélicoptère naval ASW I"
 naval_helicopter_equipment_1_short:0 "Hélicoptère ASM I"
 naval_helicopter_equipment_1_desc:0 "Un des premiers hélicoptères de lutte anti-sous-marine équipé d'un sonar à immersion pour détecter les sous-marins."
 naval_helicopter_equipment_2:0 "Hélicoptère naval ASW II"
 naval_helicopter_equipment_2_short:0 "Hélicoptère ASM II"
 naval_helicopter_equipment_2_desc:0 "Un hélicoptère amélioré destiné à la lutte anti-sous-marine précoce, équipé d'un système de sonar à immersion permettant de détecter les sous-marins et capable de les attaquer à l'aide de torpilles."
 naval_helicopter_equipment_3:0 "Hélicoptère naval ASW III"
 naval_helicopter_equipment_3_short:0 "Hélicoptère ASM III"
 naval_helicopter_equipment_3_desc:0 "Un hélicoptère amélioré pour la lutte anti-sous-marine, doté d'une plus grande autonomie, d'un système de sonar à immersion pour détecter les sous-marins et capable de les attaquer à l'aide de torpilles."
 naval_helicopter_equipment_4:0 "Hélicoptère naval ASW IV"
 naval_helicopter_equipment_4_short:0 "Hélicoptère ASM IV"
 naval_helicopter_equipment_4_desc:0 "Un grand hélicoptère de lutte anti-sous-marine doté d'une plus grande autonomie, équipé d'un sonar à immersion pour détecter les sous-marins et capable de les attaquer à l'aide de torpilles."
 naval_helicopter_equipment_5:0 "Hélicoptère naval ASW V"
 naval_helicopter_equipment_5_short:0 "Hélicoptère ASM V"
 naval_helicopter_equipment_5_desc:0 "Un hélicoptère amélioré de lutte anti-sous-marine doté d'une plus grande autonomie, d'un système de sonar à immersion pour détecter les sous-marins et capable de les attaquer à l'aide de torpilles."
 naval_helicopter_equipment_6:0 "Hélicoptère naval ASW VI"
 naval_helicopter_equipment_6_short:0 "Hélicoptère ASM VI"
 naval_helicopter_equipment_6_desc:0 "Un hélicoptère moderne de lutte anti-sous-marine doté d'une grande autonomie, d'un système de sonar à immersion amélioré pour détecter les sous-marins et capable de les attaquer à l'aide de torpilles."
 naval_helicopter_equipment_7:0 "Hélicoptère naval ASW VII"
 naval_helicopter_equipment_7_short:0 "Hélicoptère ASM VII"
 naval_helicopter_equipment_7_desc:0 "Un hélicoptère moderne de lutte anti-sous-marine doté d'une grande autonomie, équipé d'un système avancé de sonar à immersion pour détecter les sous-marins et capable de les attaquer à l'aide de torpilles."
 uav:0 "Véhicule aérien sans pilote"
 uav_short:0 "Véhicule aérien sans pilote"
 uav_desc:0 "Bien que l'utilisation de drones ne soit pas nouvelle, cette première génération de véhicules aériens sans pilote, dotés d'une plus grande autonomie et de meilleurs capteurs, constitue la première plateforme de surveillance et d'armement véritablement performante à être déployée à grande échelle. Elle ouvre la voie à d'autres innovations à venir."
 mp_uav_1_short:0 "MAV I"
 mp_uav_1:0 "Micro-véhicule aérien I"
 mp_uav_1_desc:0 "Véhicule aérien sans pilote de première génération lancé à la main et utilisé à des fins de reconnaissance."
 mp_uav_2_short:0 "MAV II"
 mp_uav_2:0 "Micro-véhicule aérien II"
 mp_uav_2_desc:0 "Véhicule aérien sans pilote de deuxième génération lancé à la main et utilisé à des fins de reconnaissance."
 cas_uav_equipment_1:0 "Véhicule aérien de combat sans pilote I"
 cas_uav_equipment_1_short:0 "UCAV I"
 cas_uav_equipment_1_desc:0 "Véhicule aérien de combat sans pilote de première génération. Cette génération est équipée de capteurs performants et d'un armement limité."
 cas_uav_equipment_2:0 "Véhicule aérien de combat sans pilote II"
 cas_uav_equipment_2_short:0 "UCAV II"
 cas_uav_equipment_2_desc:0 "Véhicule aérien de combat sans pilote de deuxième génération. Cette génération dispose d'encore plus de capteurs et d'armements performants."
 cas_uav_equipment_3:0 "Véhicule aérien de combat sans pilote III"
 cas_uav_equipment_3_short:0 "UCAV III"
 cas_uav_equipment_3_desc:0 "Véhicule aérien de combat sans pilote de troisième génération. Cette génération dispose d'encore plus de capteurs, d'un arsenal considérable et de capacités de guerre électronique."
 naval_uav_equipment_1:0 "Véhicule aérien sans pilote naval I"
 naval_uav_equipment_1_short:0 "Naval UAV I"
 naval_uav_equipment_1_desc:0 "Véhicule aérien sans pilote naval de première génération."
 naval_uav_equipment_2:0 "Véhicule aérien sans pilote naval II"
 naval_uav_equipment_2_short:0 "Naval UAV II"
 naval_uav_equipment_2_desc:0 "Véhicule aérien sans pilote naval de deuxième génération."
 naval_uav_equipment_3:0 "Véhicule aérien sans pilote naval III"
 naval_uav_equipment_3_short:0 "Naval UAV III"
 naval_uav_equipment_3_desc:0 "Véhicule aérien sans pilote naval de troisième génération."
 USA_fighter_equipment_1:0 "Curtiss P-40 Warhawk"
 USA_fighter_equipment_1_short:0 "P-40 Warhawk"
 USA_fighter_equipment_1_desc:0 "Le P-40 était un avion de chasse monomoteur entièrement métallique développé en 1938. Il s'agissait d'une version modifiée du P-36 Hawk. Ce modèle fut utilisé par un grand nombre de puissances alliées pendant la Seconde Guerre mondiale et, bien qu'il fût inférieur aux P-47 et P-51 plus récents, il resta en service sur le front jusqu'à la fin de la guerre. 200 pilotes alliés de 7 nations différentes, dont les États-Unis, les pays du Commonwealth britannique et l'Union soviétique, sont devenus des as du P-40. Malgré des désignations différentes pour le Commonwealth et l'Union soviétique, le surnom officiel dans l'armée américaine est « Warhawk »."
 USA_fighter_equipment_2:0 "Republic F-47 Thunderbolt"
 USA_fighter_equipment_2_short:0 "F-47 Thunderbolt"
 USA_fighter_equipment_2_desc:0 "Le P-47 était une évolution du Seversky (prédécesseur de Republic) P-35 et du Republic P-43 Lancer. Bien qu'il ait été initialement conçu comme un chasseur de supériorité aérienne, le P-47 s'est illustré par sa capacité à transporter une lourde charge de bombes, marquant ainsi le début de la tradition de la société dans le développement d'avions d'appui aérien rapproché (CAS). Ce modèle a été utilisé par de nombreux pays alliés pendant la Seconde Guerre mondiale et a continué à l'être après la guerre. Certains affirment que c'est lui, et non le P-51 Mustang, qui aurait dû être utilisé en Corée. Son surnom, « Thunderbolt », est le premier à respecter les conventions de dénomination modernes de Republic. Il a été rebaptisé F-47 en 1948."
 USA_fighter_equipment_3:0 "North American F-51D Mustang"
 USA_fighter_equipment_3_short:0 "F-51D Mustang"
 USA_fighter_equipment_3_desc:0 "Le P-51 est considéré comme l'un des meilleurs chasseurs jamais construits dans l'histoire de l'aviation. Développé par North American Aviation, il est entré en service en 1942. Initialement utilisé comme avion de reconnaissance tactique, il est devenu, avec l'introduction de la variante « D », le premier chasseur à dominer les airs, escortant les bombardiers américains et alliés lors des campagnes de bombardement les plus célèbres du théâtre européen et détruisant près de 5 000 avions pendant la guerre. Rebaptisé plus tard F-51, il s'illustra comme avion d'appui aérien rapproché pendant la guerre de Corée, et le « Mustang », cheval de bataille de l'USAAAF, resta en service jusqu'en 1968."
 USA_heavy_fighter_equipment_1:0 "Lockheed P-38 Lightning"
 USA_heavy_fighter_equipment_1_short:0 "P-38 Lightning"
 USA_heavy_fighter_equipment_1_desc:0 "Avion à deux moteurs à pistons conçu pour privilégier la vitesse et l'armement lourd. Pendant la Seconde Guerre mondiale, sa vitesse a été mise à profit dans de nombreuses attaques éclair au-dessus du Pacifique, détruisant de nombreux avions japonais. Sa forme distinctive lui a valu le surnom de « der Gabelschwanz-Teufel » (le diable à queue fourchue) en Allemagne et de « Ni hikouki, ippairotto » (deux avions, un pilote) au Japon. Il est également connu sous le nom de « Lightning »."
 USA_heavy_fighter_equipment_2:0 "Northrop F-61 Black Widow"
 USA_heavy_fighter_equipment_2_short:0 "F-61 Black Widow"
 USA_heavy_fighter_equipment_2_desc:0 "Le P-61, comme le P-38 avant lui, est un avion à double fuselage conçu en 1944. Il fut le premier chasseur de nuit américain, équipé d'un radar (une autre première) pour suivre les bombardiers et autres cibles et les intercepter de nuit et dans des conditions météorologiques défavorables. Équipé de quatre canons Hispano de 20 mm, le P-61 (rebaptisé plus tard F-61), surnommé « Black Widow » (veuve noire) en référence à la célèbre araignée américaine, est aussi redoutable que son nom le suggère."
 USA_heavy_fighter_equipment_3:0 "North American F-82 Twin Mustang"
 USA_heavy_fighter_equipment_3_short:0 "F-82 Twin Mustang"
 USA_heavy_fighter_equipment_3_desc:0 "Développé à l'origine comme chasseur d'escorte à longue portée pour la Seconde Guerre mondiale, le P-82 a été introduit en 1946, trop tard pour servir pendant le conflit. Développé à partir du célèbre P-51, le P-82 (plus tard F-82) a été utilisé en remplacement du P-61 Black Widow et était équipé d'un radar pour soutenir le Commandement stratégique aérien. Comme sa cellule ressemble à deux P-51 assemblés, il a été surnommé « Twin Mustang »."
 USA_strat_bomber_equipment_1:0 "Boeing B-17 Flying Fortress"
 USA_strat_bomber_equipment_1_short:0 "B-17 Flying Fortress"
 USA_strat_bomber_equipment_1_desc:0 "Le B-17 est un bombardier stratégique quadrimoteur développé au milieu des années 1930 pour l'armée de l'air américaine. Il s'agit du troisième bombardier le plus produit pendant la Seconde Guerre mondiale. Il s'est illustré sur le théâtre européen du conflit, où il a mené des campagnes de bombardement en Allemagne à partir de bases situées dans le sud de l'Angleterre et en Italie. Son armement défensif imposant est à la hauteur d'un avion surnommé la « forteresse volante »."
 USA_strat_bomber_equipment_2:0 "Consolidated B-24 Liberator"
 USA_strat_bomber_equipment_2_short:0 "B-24 Liberator"
 USA_strat_bomber_equipment_2_desc:0 "Le B-24 a été conçu en 1941 comme bombardier lourd à longue portée pour l'armée de l'air américaine. Malgré sa capacité à transporter une lourde charge de bombes et sa vitesse de croisière élevée, il était relativement difficile à piloter à basse altitude et avait un plafond pratique inférieur à celui du B-17. Pourtant, le « Liberator » était préféré par l'état-major américain et fut le bombardier le plus produit pendant la Seconde Guerre mondiale. Comme le B-17, il rendit de grands services sur le théâtre européen pendant la campagne de bombardements de l'Allemagne, mais se distingua également sur le théâtre du Pacifique."
 USA_strat_bomber_equipment_3:0 "Boeing B-29 Superfortress"
 USA_strat_bomber_equipment_3_short:0 "B-29 Superfortress"
 USA_strat_bomber_equipment_3_desc:0 "Le B-29 était un bombardier quadrimoteur à hélices mis en service en 1944. Il s'agissait du projet d'armement le plus coûteux jamais réalisé pendant la guerre, dépassant même le coût du programme d'armement nucléaire américain de l'époque. Conçu comme un bombardier stratégique à haute altitude, il fut utilisé comme bombardier incendiaire de nuit à basse altitude, lançant des raids de bombardements incendiaires sur le Japon. Mais la « Superfortress » doit surtout sa renommée au largage des bombes atomiques sur Hiroshima et Nagasaki, qui ont contribué à la fin de la guerre. Des variantes modernisées (dont le B-50, rebaptisé) ont continué à être utilisées comme bombardiers stratégiques pendant la guerre de Corée avant d'être retirées du service au début des années 1950."
 USA_tac_bomber_equipment_0:0 "Douglas B-18 Bolo"
 USA_tac_bomber_equipment_0_short:0 "B-18 Bolo"
 USA_tac_bomber_equipment_0_desc:0 "Le B-18, introduit en 1936, était un bombardier moyen développé pour remplacer le Martin B-10. Bien qu'il fût performant au moment de son introduction, il fut rapidement rendu obsolète en 1940 et relégué à la lutte anti-sous-marine et au transport aérien. Malgré cela, le « Bolo » allait connaître la gloire en devenant le premier avion américain à couler un sous-marin allemand pendant la Seconde Guerre mondiale."
 USA_tac_bomber_equipment_1:0 "Douglas B-23 Dragon"
 USA_tac_bomber_equipment_1_short:0 "B-23 Dragon"
 USA_tac_bomber_equipment_1_desc:0 "Développé comme un successeur perfectionné du B-18 Bolo, le B-23 était plus rapide et pouvait transporter une charge de bombes plus lourde et un armement défensif plus important. Cependant, le « Dragon » s'est avéré inférieur à ses contemporains, les B-25 et B-26, et a été largement relégué au rang d'avion d'entraînement pendant la Seconde Guerre mondiale."
 USA_tac_bomber_equipment_2:0 "North American B-25 Mitchell"
 USA_tac_bomber_equipment_2_short:0 "B-25 Mitchell"
 USA_tac_bomber_equipment_2_desc:0 "Le B-25 est un bombardier moyen bimoteur introduit en 1941. Utilisé par de nombreuses forces aériennes pendant la Seconde Guerre mondiale, il a également servi sur tous les théâtres d'opérations impliquant des avions pendant la guerre, son utilisation la plus célèbre étant le raid de Doolittle, la première campagne de bombardements aériens réussie sur le territoire japonais pendant la guerre. Son surnom est le « Mitchell », du nom du major général Billy Mitchell, pionnier de l'aviation militaire américaine."
 USA_tac_bomber_equipment_3:0 "Martin B-26 Marauder"
 USA_tac_bomber_equipment_3_short:0 "B-26 Marauder"
 USA_tac_bomber_equipment_3_desc:0 "Le B-26 a été développé en 1941 comme bombardier moyen, parallèlement au B-25. Difficile à piloter au départ, il a été surnommé « Widowmaker » (faiseur de veuves) en raison du nombre de pilotes qui se sont écrasés et ont trouvé la mort lors de leur formation sur cet appareil. Cependant, après avoir subi des modifications et une fois les pilotes correctement formés, il s'est révélé être un bombardier tactique performant, servant en Europe occidentale ainsi que dans les théâtres du Pacifique et de la Méditerranée pendant la Seconde Guerre mondiale. Surnommé le « Marauder », cet appareil a été retiré du service en 1947, avant que l'armée de l'air ne soit séparée de l'armée de terre (ce qui explique pourquoi l'A-26 Invader a brièvement été baptisé B-26)."
 USA_nav_bomber_equipment_1:0 "Consolidated PBY-1 Catalina"
 USA_nav_bomber_equipment_1_short:0 "PBY-1"
 USA_nav_bomber_equipment_1_desc:0 "Variante de production initiale équipée de deux moteurs R-1830-64 de 900 ch. Le Consolidated PBY Catalina est un hydravion et un avion amphibie produit dans les années 1930 et 1940. Au Canada, il était connu sous le nom de Canso. Il fut l'un des hydravions les plus utilisés pendant la Seconde Guerre mondiale. Les Catalina ont servi dans toutes les branches des forces armées américaines ainsi que dans les forces aériennes et navales de nombreux autres pays. Les derniers PBY militaires ont été utilisés jusqu'aux années 1980. En 2021, 86 ans après son premier vol, cet avion continue de voler en tant que bombardier à eau (ou avion-citerne) dans le cadre d'opérations de lutte contre les incendies aériens dans certaines régions du monde. Aucun n'est plus en service militaire."
 USA_nav_bomber_equipment_2:1 "Consolidated PBY-5 Catalina"
 USA_nav_bomber_equipment_2_short:1 "PBY-5"
 USA_nav_bomber_equipment_2_desc:0 "Le Consolidated PBY Catalina est un hydravion et un avion amphibie qui a été produit dans les années 1930 et 1940. Au Canada, il était connu sous le nom de Canso. Il a été l'un des hydravions les plus utilisés pendant la Seconde Guerre mondiale. Les Catalina ont servi dans toutes les branches des forces armées américaines ainsi que dans les forces aériennes et navales de nombreux autres pays. Les derniers PBY militaires ont servi jusqu'aux années 1980. En 2021, 86 ans après son premier vol, cet avion continue de voler en tant que bombardier d'eau (ou avion-citerne) dans le cadre d'opérations de lutte aérienne contre les incendies dans certaines régions du monde. Aucun n'est plus en service militaire."
 USA_nav_bomber_equipment_3:0 "Consolidated PB4Y-2 Privateer"
 USA_nav_bomber_equipment_3_short:0 "PB4Y-2 Privateer"
 USA_nav_bomber_equipment_3_desc:0 "Le Consolidated PB4Y-2 Privateer est un bombardier de patrouille américain de la Seconde Guerre mondiale et de la guerre de Corée, utilisé par la marine américaine et dérivé du Consolidated B-24 Liberator."
 USA_cv_CAS_equipment_1:0 "Northrop BT"
 USA_cv_CAS_equipment_1_short:0 "Northrop BT"
 USA_cv_CAS_equipment_1_desc:0 "Le Northrop BT a été développé en 1935, alors que Northrop était une filiale de Douglas Aircraft Corporation. Premier avion à train d'atterrissage tricycle fixe à atterrir sur un porte-avions, ce modèle a ensuite été développé par Douglas pour devenir le bombardier en piqué SBD Dauntless."
 USA_CAS_equipment_2:0 "Douglas A-20 Havoc"
 USA_CAS_equipment_2_short:0 "A-20 Havoc"
 USA_CAS_equipment_2_desc:0 "L'A-20, surnommé « Havoc », a été introduit en 1941 en tant que bombardier léger et avion d'attaque au sol. Utilisé par les États-Unis et le Commonwealth, il doit sa renommée à son service dans l'armée de l'air et la marine soviétiques, qui ont reçu les deux tiers des modèles A-20B et de nombreux modèles G et H. Modifiés avec des mitrailleuses de 7,62 mm à cadence de tir plus rapide et des canons à tir frontal, ces modèles se sont distingués sur le front oriental contre les chars allemands et ont été les bombardiers étrangers les plus utilisés par l'armée de l'air soviétique pendant la Seconde Guerre mondiale. Les variantes de chasseurs ont également été baptisées P-70."
 USA_CAS_equipment_3:0 "North American A-36 Apache"
 USA_CAS_equipment_3_short:0 "A-36 Apache"
 USA_CAS_equipment_3_desc:0 "L'A-36 a été développé comme variante d'attaque au sol du célèbre P-51 Mustang. Bombardier en piqué, il a fait ses preuves en Afrique du Nord, en Méditerranée, en Italie et sur les théâtres d'opérations Chine-Birmanie-Inde pendant la Seconde Guerre mondiale. Il est connu pour ses aérofreins rectangulaires caractéristiques situés à l'extrémité des ailes. L'« Apache », nommé d'après la tribu amérindienne, s'est révélé redoutable au cours de sa courte carrière, servant de 1942 jusqu'à son retrait à la fin de la guerre en 1945."
 USA_CAS_equipment_4:0 "Douglas A-26C Invader"
 USA_CAS_equipment_4_short:0 "A-26C Invader"
 USA_CAS_equipment_4_desc:0 "L'A-26 est un avion d'attaque rapide bimoteur développé à partir de l'A-20 Havoc, qu'il était destiné à remplacer. Mis en service en 1943, l'Invader a servi dans l'armée de l'air américaine pendant la Seconde Guerre mondiale, attaquant les positions japonaises dans les Indes orientales néerlandaises et aux Philippines, ainsi qu'en Europe lors des campagnes dans la vallée du Pô, dans le nord de l'Italie. Il a continué à servir en Corée, participant à des missions de bombardement contre la Corée, et a été le premier avion à effectuer une sortie dans ce conflit. L'« Invader » a poursuivi sa carrière au Vietnam, soutenant les opérations de la CIA au Laos contre les forces vietcongs. Avec une carrière légendaire à travers trois guerres, l'« Invader » a prouvé sa valeur et montré ce dont un avion CAS était capable."
 USA_cv_CAS_equipment_4:0 "Douglas AD Skyraider"
 USA_cv_CAS_equipment_4_short:0 "Douglas AD Skyraider"
 USA_cv_CAS_equipment_4_desc:0 "Le Douglas AD est un avion d'attaque rapide fiable, basé sur un porte-avions. Conçu à l'origine comme un bombardier torpilleur et en piqué, l'AD (initialement le BT2D) est entré en service en 1946 et s'est illustré pendant la guerre de Corée, devenant le principal avion d'attaque au sol des forces de la marine américaine et du corps des Marines sur place. Même si la plupart des avions à hélices ont été retirés du service après le conflit coréen, le nouvel A-1 est resté en service et a joué un rôle clé en tant qu'avion d'appui aérien rapproché. Le « Skyraider » a servi avec distinction jusqu'à la fin de l'intervention américaine au Vietnam."
 USA_CAS_equipment_1:0 "Northrop A-17"
 USA_CAS_equipment_1_short:0 "A-17"
 USA_CAS_equipment_1_desc:0 "L'A-17 était un avion d'attaque monomoteur biplace dérivé du Northrop Gamma 2F et développé en 1935. C'était un appareil fiable et très apprécié. Ce type d'avion servit d'avion de patrouille côtière pour les unités ennemies qui pouvaient traverser le canal de Panama au début de la Seconde Guerre mondiale, après l'attaque de Pearl Harbor, et fut utilisé à des fins utilitaires jusqu'à son retrait en 1944."
 USA_cv_CAS_equipment_2:0 "Douglas SBD-2 Dauntless"
 USA_cv_CAS_equipment_2_short:0 "SBD-2 Dauntless"
 USA_cv_CAS_equipment_2_desc:0 "Le SBD-2 a été conçu en 1940 comme avion de reconnaissance et bombardier en piqué. Il était le principal avion de ce type utilisé par la marine américaine. Le « Dauntless », qui était déjà un bombardier en piqué performant, a été amélioré avec la variante -2, dotée d'un armement différent et d'une capacité de carburant accrue, mais il ne s'agissait que d'une solution provisoire mineure par rapport aux modèles ultérieurs. Les variantes de l'USAAF l'ont baptisé A-24 Banshee."
 USA_cv_CAS_equipment_3:0 "Curtiss SB2C-1s Helldiver"
 USA_cv_CAS_equipment_3_short:0 "SB2C-1s Helldiver"
 USA_cv_CAS_equipment_3_desc:0 "Remplaçant le SBD Dauntless, le SB2C, introduit en 1942, était beaucoup plus rapide que le SBD qu'il remplaçait, mais c'était un avion difficile à piloter, ce qui lui valut le surnom péjoratif de « SOB, 2nd Class » (enfoiré de deuxième classe). Malgré cela et un rapport cinglant qui allait ternir à jamais l'héritage de la Curtiss Aircraft Company, le « Helldiver » obtint d'excellents résultats au combat tout au long de la guerre du Pacifique. La variante de l'USAAF l'appelait A-25 Shrike."
 USA_cv_fighter_equipment_0:0 "Grumman FF 'Fifi'"
 USA_cv_fighter_equipment_0_short:0 "FF 'Fifi'"
 USA_cv_fighter_equipment_0_desc:0 "Lancé en 1933, le Grumman FF fut le premier modèle entièrement conçu par la société pour la marine américaine. Surnommé officieusement « Fifi » (d'après la désignation FF), le Grumman FF fut un biplan embarqué très performant tout au long des années 30, avant d'être retiré du service en 1940."
 USA_cv_fighter_equipment_1:0 "Grumman F3F"
 USA_cv_fighter_equipment_1_short:0 "F3F"
 USA_cv_fighter_equipment_1_desc:0 "Le Grumman F3F, lorsqu'il a été introduit en 1936, était le dernier avion de chasse biplan livré à la marine américaine et à l'ensemble des forces armées américaines en général. Malgré sa courte durée de service (retiré du service de première ligne en 1941 et du service en général en 1943), il restait un avion assez performant, le dernier d'une époque d'avions monoplans qui allait marquer l'avenir du combat aérien."
 USA_cv_fighter_equipment_2:0 "Vought F4U-5 Corsair"
 USA_cv_fighter_equipment_2_short:0 "F4U-5 Corsair"
 USA_cv_fighter_equipment_2_desc:0 "Le Vought F4U Corsair est un avion de chasse américain qui a principalement servi pendant la Seconde Guerre mondiale et la guerre de Corée. Conçu et initialement fabriqué par Chance Vought, le Corsair a rapidement connu une forte demande ; des contrats de production supplémentaires ont été attribués à Goodyear, dont les Corsair ont été désignés FG, et à Brewster, désignés F3A. Le Corsair a été conçu et utilisé comme avion embarqué, et est entré en service en grand nombre dans la marine américaine à la fin de 1944 et au début de 1945. Il est rapidement devenu l'un des chasseurs-bombardiers embarqués les plus performants de la Seconde Guerre mondiale."
 USA_cv_fighter_equipment_3:0 "Grumman F8F Bearcat"
 USA_cv_fighter_equipment_3_short:0 "F8F Bearcat"
 USA_cv_fighter_equipment_3_desc:0 "Le Grumman F8F Bearcat est un avion de chasse monomoteur américain basé sur un porte-avions, introduit à la fin de la Seconde Guerre mondiale. Il a servi au milieu du XXe siècle dans la marine américaine, le corps des Marines des États-Unis et les forces aériennes d'autres nations. Il s'agit du dernier avion de chasse à moteur à pistons de Grumman Aircraft."
 USA_cv_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35C Lightning II"
 USA_cv_mr_stealth_fighter_equipment_1_short:0 "F-35C Lightning II"
 USA_cv_mr_stealth_fighter_equipment_1_desc:0 "Le F-35C est la variante CATOBAR (Catapult Assisted Take-Off But Arrested Recovery) de la famille F-35 Lightning II de Lockheed Martin, conçue principalement pour être déployée sur des porte-avions. Le programme F-35 a débuté en 1992, et la variante C a pris son envol dès 2010 et a été opérationnelle sur des porte-avions moins de quatre ans plus tard. Par rapport à ses homologues, la variante C se caractérise par des ailes plus grandes avec des extrémités repliables."
 USA_jump_stealth_equipment_1:0 "Lockheed Martin F-35B Lightning II"
 USA_jump_stealth_equipment_1_short:0 "F-35B Lightning II"
 USA_jump_stealth_equipment_1_desc:0 "Un avion de combat polyvalent produit à partir d'une conception JSF (Joint Strike Fighter). Bien qu'il puisse utiliser diverses armes dans les combats air-air et sol-sol, le coût d'acquisition de cet avion de combat furtif est plus raisonnable que celui du F-22A. En fonction de son utilité, plusieurs types sont disponibles. Le type « B » utilisé par le Corps des Marines des États-Unis est compatible STOVL (décollage court/atterrissage vertical). Son surnom est « Lightning II »."
 USA_cas_stealth_equipment_1:0 "Fairchild Republic A-10C Thunderbolt II"
 USA_cas_stealth_equipment_1_short:0 "A-10C Thunderbolt II"
 USA_cas_stealth_equipment_1_desc:0 "La variante C de l'A-10 « Thunderbolt II » a été développée en 2005 dans le cadre du programme de modernisation Precision Engagement. Tirant parti des enseignements tirés du prototype YA-10B, l'A-10C est équipé d'un système de contrôle de tir modernisé, d'une suite ECM et de capacités de ciblage de bombes intelligentes. Le module d'identification ami-ennemi et la suite de communications ont également été mis à jour et modernisés. En partie grâce à ses performances récentes et à la pression politique, l'A-10 devrait continuer à servir dans le cadre des opérations de combat de l'armée de l'air américaine dans un avenir proche."
 USA_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 USA_mr_stealth_fighter_equipment_1_short:0 "F-35A Lightning II"
 USA_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnels (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le programme F-35 a débuté en 1992, la variante A ayant pris son envol fin 2006 et largué ses premières bombes moins de six ans plus tard. La variante A est la plus petite et la plus légère des variantes du F-35. Elle est principalement destinée à remplacer le F-16 Fighting Falcon."
 USA_jet_multirole_equipment_1:0 "Lockheed F-80A Shooting Star"
 USA_jet_multirole_equipment_1_short:0 "F-80A Shooting Star"
 USA_jet_multirole_equipment_1_desc:0 "Le premier avion de chasse à réaction utilisé par l'armée de l'air américaine (qui deviendra plus tard l'US Air Force). Il fut le premier et le seul avion à réaction américain opérationnel pendant les derniers jours de la Seconde Guerre mondiale. Ce modèle marqua le début de l'ère des avions à réaction aux États-Unis, car sa conception à ailes droites fut largement utilisée comme chasseur de jour et chasseur-bombardier pendant la guerre de Corée sous le nom de F-80. Surnommé « Shooting Star » (étoile filante), le F-80 représenta le premier sommet de l'aviation américaine."
 USA_jet_multirole_equipment_2:0 "North American F-86A Sabre"
 USA_jet_multirole_equipment_2_short:0 "F-86A Sabre"
 USA_jet_multirole_equipment_2_desc:0 "Le F-86 est un avion de chasse à réaction à ailes en flèche développé et mis en service à la fin des années 1940 à partir des recherches capturées par les Allemands. La conception de cet avion lui permettait d'atteindre des vitesses transsoniques et une grande maniabilité, des caractéristiques qui lui permettaient de rivaliser avec son célèbre concurrent, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, avec ses variantes canadiennes et australiennes, est l'avion de chasse occidental le plus produit de l'histoire de l'aviation."
 USA_jet_multirole_equipment_3:0 "North American F-86F Sabre"
 USA_jet_multirole_equipment_3_short:0 "F-86F Sabre"
 USA_jet_multirole_equipment_3_desc:0 "Système de contrôle de vol amélioré et « queue entièrement volante » (ce système a été remplacé par un système de contrôle entièrement motorisé avec une « sensation artificielle » intégrée aux commandes de l'avion afin de fournir au pilote des forces sur le manche qui restaient conventionnelles, mais suffisamment légères pour permettre un contrôle supérieur en combat). Les Sabre F présentaient une agilité à grande vitesse nettement améliorée, associée à une vitesse d'atterrissage plus élevée, supérieure à 233 km/h."
 USA_jet_multirole_equipment_4:0 "North American F-100 Super Sabre"
 USA_jet_multirole_equipment_4_short:0 "F-100 Super Sabre"
 USA_jet_multirole_equipment_4_desc:0 "Premier avion de chasse capable d'atteindre une vitesse supersonique en vol horizontal, le F-100 était un avion multirôle performant conçu pour affronter l'ennemi en combat aérien. Développé à partir du F-86 Sabre, le F-100 allait adopter le surnom de « Super Sabre », mais reçut également celui de « Hun » en raison de sa désignation au sein de l'USAF à l'époque. Ce type d'appareil servit au Vietnam comme chasseur-bombardier et fut le premier à être utilisé dans le cadre de la suppression des défenses aériennes ennemies, sous le nom célèbre de Wild Weasel."
 USA_jet_multirole_equipment_5:0 "McDonnell Douglas F-4C Phantom II"
 USA_jet_multirole_equipment_5_short:0 "F-4C Phantom II"
 USA_jet_multirole_equipment_5_desc:0 "Le programme F-4 est l'un des projets d'avion de chasse les plus réussis à ce jour. Il a connu un tel succès que l'armée de l'air américaine a choisi de l'utiliser pour remplacer le F-106 Delta Dart. Chasseur tactique biplace tout temps, version d'attaque au sol pour l'armée de l'air américaine ; compatible avec une large gamme d'armes, notamment les missiles AIM-4 Falcon, AGM-12 Bullpup et les armes nucléaires ; pneus de roue principale plus larges donnant lieu à des renflements distinctifs au niveau des ailes ; moteurs J79-GE-15 avec dispositif de démarrage à cartouche ; ravitaillement en vol par perche au lieu du ravitaillement par sonde et drogue de la marine ; radar AN/APQ-100 ; commandes de vol en double dans le cockpit arrière."
 USA_jet_multirole_equipment_6:0 "McDonnell Douglas F-4D Phantom II"
 USA_jet_multirole_equipment_6_short:0 "F-4D Phantom II"
 USA_jet_multirole_equipment_6_desc:0 "F-4C équipé d'une avionique modernisée et d'un radar AN/APQ-109."
 USA_jet_multirole_equipment_7:0 "McDonnell Douglas F-4E Phantom II"
 USA_jet_multirole_equipment_7_short:0 "F-4E Phantom II"
 USA_jet_multirole_equipment_7_desc:0 "Version USAF avec un canon M61 Vulcan intégré dans le nez allongé du RF-4C, un radar AN/APQ-120 avec une section transversale plus petite pour accueillir le canon, des moteurs J79-GE-17 avec une poussée de 17 900 lbf (79,379 kN) chacun en postcombustion. Les avions de la dernière série étaient équipés de volets de bord d'attaque pour améliorer la maniabilité au détriment de la vitesse maximale dans le cadre du programme Agile Eagle. À partir du bloc 53, les avions ont été équipés de la capacité AGM-65 Maverick et de moteurs J79-GE-17C ou -17E sans fumée. Premier vol le 1er août 1965. La variante Phantom la plus nombreuse ; 1 370 exemplaires construits."
 USA_jet_multirole_equipment_8:0 "General Dynamics F-16A Fighting Falcon"
 USA_jet_multirole_equipment_8_short:0 "F-16A Fighting Falcon"
 USA_jet_multirole_equipment_8_desc:0 "Un chasseur maniable et léger, offrant un équilibre parfait entre maniabilité et stabilité. Il est doté d'un fuselage monocoque exceptionnellement léger et aérodynamique, et bien qu'il s'agisse d'un avion monomoteur, il est équipé d'un moteur puissant. Surnommé le « Fighting Falcon », son coût relativement faible et sa puissance élevée expliquent pourquoi il a été adopté par les forces aériennes du monde entier. À ce jour, plus de 4 000 exemplaires de ce modèle à succès ont été fabriqués."
 USA_jet_multirole_equipment_9:0 "General Dynamics F-16A Block 15 Fighting Falcon"
 USA_jet_multirole_equipment_9_short:0 "F-16A Block 15"
 USA_jet_multirole_equipment_9_desc:0 "Première modification majeure apportée au F-16, l'avion Block 15 était équipé de stabilisateurs horizontaux plus grands, de deux points d'emport supplémentaires au niveau de l'entrée d'air sous le nez, d'un nouveau radar et d'une capacité accrue pour les pylônes sous les ailes. Cette variante était également équipée d'une radio UHF (ultra haute fréquence) de dernière génération. Il s'agit de la variante la plus répandue parmi les modèles F-16."
 USA_jet_multirole_equipment_10:0 "General Dynamics F-16C Block 25 Fighting Falcon"
 USA_jet_multirole_equipment_10_short:0 "F-16C Block 25"
 USA_jet_multirole_equipment_10_desc:0 "La première sous-variante du F-16C était équipée d'un nouveau radar, d'un système de contrôle de tir amélioré et de systèmes de données intégrés pour une meilleure capacité d'attaque nocturne. Lancée en 1984, la variante F-16C B25 a joué un rôle important pendant la guerre du Golfe Persique."
 USA_jet_interceptor_equipment_1:0 "Lockheed F-94 Starfire"
 USA_jet_interceptor_equipment_1_short:0 "F-94 Starfire"
 USA_jet_interceptor_equipment_1_desc:0 "Développé à partir du F-80 Shooting Star, le F-94 a été conçu pour remplacer les chasseurs de nuit lourds à hélices F-61 Black Widow et F-82 Twin Mustang. Initialement équipé d'un armement à canon (quatre, puis huit mitrailleuses de 12,7 mm), son armement à canon a été remplacé par un système entièrement composé de roquettes, lancées depuis ses baies internes. Surnommé « Starfire », il allait devenir le premier intercepteur à réaction majeur de l'USAF dans son histoire."
 USA_jet_interceptor_equipment_2:0 "North American F-86D Sabre Dog"
 USA_jet_interceptor_equipment_2_short:0 "F-86D Sabre Dog"
 USA_jet_interceptor_equipment_2_desc:0 "Conçu comme un intercepteur tout temps, le F-86D (initialement désigné F-95) reprenait les performances impressionnantes du F-86 Sabrejet et les améliorait en y ajoutant un radar (qui lui donnait son radôme distinctif), un fuselage plus long et un moteur à postcombustion plus puissant. Initialement équipé d'une baie de lancement interne pour intercepter les bombardiers, les versions ultérieures du « Sabre Dog » étaient équipées de canons."
 USA_jet_interceptor_equipment_3:0 "Northrop F-89 Scorpion"
 USA_jet_interceptor_equipment_3_short:0 "F-89 Scorpion"
 USA_jet_interceptor_equipment_3_desc:0 "Le F-89 (initialement P-89) est un intercepteur tout temps conçu dès le départ pour remplir cette fonction lorsqu'il est entré en service en 1954. Initialement équipé d'un armement à canons, celui-ci a été progressivement remplacé dans la version de série par un armement à roquettes. Plus tard, le « Scorpion » a reçu un atout supplémentaire avec l'introduction d'un armement à missiles, devenant ainsi le premier avion à réaction à utiliser ce type d'armement."
 USA_jet_interceptor_equipment_4:0 "Convair F-102A Delta Dagger"
 USA_jet_interceptor_equipment_4_short:0 "F-102A Delta Dagger"
 USA_jet_interceptor_equipment_4_desc:0 "Premier avion de chasse à réaction à ailes delta des États-Unis, le F-102 fut le premier avion de chasse supersonique utilisé par l'armée de l'air américaine, capable d'atteindre une vitesse de Mach 1. Conçu comme intercepteur et chasseur de bombardiers, il remplaça le F-89 Scorpion et était capable d'abattre les avions ennemis à l'aide de roquettes et de missiles embarqués dans sa soute interne, ce qui en fit le premier avion de chasse à présenter cette caractéristique. Le « Delta Dagger » servit pendant les premières périodes de la guerre du Vietnam comme avion d'escorte de bombardiers et d'attaque au sol."
 USA_jet_interceptor_equipment_5:0 "McDonnell F-101B Voodoo"
 USA_jet_interceptor_equipment_5_short:0 "F-101B Voodoo"
 USA_jet_interceptor_equipment_5_desc:0 "Le F-101, introduit en 1957, était initialement conçu comme un bombardier d'escorte à longue portée ou un chasseur de pénétration pour le Strategic Air Command (SAC) de l'US Air Force. Cela allait changer lorsqu'il devint un chasseur-bombardier à capacité nucléaire pour le Tactical Air Command (TAC). Le « Voodoo » avait une grande autonomie. Depuis ses bases en Allemagne de l'Ouest, il pouvait frapper n'importe quel pays du Pacte de Varsovie et pénétrer directement jusqu'à 800 km à l'intérieur du territoire soviétique."
 USA_jet_interceptor_equipment_6:0 "Convair F-106A Delta Dart"
 USA_jet_interceptor_equipment_6_short:0 "F-106A Delta Dart"
 USA_jet_interceptor_equipment_6_desc:0 "Le F-106 était une version améliorée du F-102 Delta Dagger. Lancé en 1959, le F-106, comme son prédécesseur, n'était pas équipé d'un canon embarqué et dépendait donc de missiles pour engager les bombardiers ennemis. Il était équipé du missile infrarouge AIM-4 et d'un AIM-26 à tête nucléaire. Surnommé « l'intercepteur ultime », le « Delta Dart » transportait ses armes dans une soute interne, une caractéristique qui ne fut reprise sur les avions de chasse qu'à partir de la 5e génération d'avions de chasse à réaction."
 USA_jet_interceptor_equipment_7:0 "North American F-106A 'Six Shooter'"
 USA_jet_interceptor_equipment_7_short:0 "F-106A 'Six Shooter'"
 USA_jet_interceptor_equipment_7_desc:0 "Après son introduction, le F-106 a été progressivement mis à jour en service, avec une avionique améliorée, une aile modifiée présentant un cambrage conique notable, un système de recherche et de poursuite infrarouge, des réservoirs d'aile supersoniques profilés qui n'altéraient pratiquement pas les performances globales de l'avion, une meilleure instrumentation et des équipements tels qu'un réceptacle de ravitaillement en vol et un crochet d'appontage pour les atterrissages d'urgence. Le projet Six Shooter a ajouté un canon M61 Vulcan et un viseur optique."
 USA_jet_interceptor_equipment_8:0 "McDonnell Douglas F-15A Eagle"
 USA_jet_interceptor_equipment_8_short:0 "F-15A Eagle"
 USA_jet_interceptor_equipment_8_desc:0 "Un chasseur avancé de supériorité aérienne équipé de points d'emport pour une multitude de systèmes d'armes et d'une avionique avancée capable de rivaliser avec les chasseurs ennemis les plus sophistiqués. Un chasseur tout temps à grande échelle. Bénéficiant d'une vitesse maximale phénoménale, même parmi les chasseurs, il dispose d'une grande quantité d'armement à bord. Baptisé « Eagle », il offre un niveau de stabilité tel qu'il détient le record de récupération après avoir perdu une aile au combat."
 USA_jet_interceptor_equipment_9:0 "McDonnell Douglas F-15C Eagle"
 USA_jet_interceptor_equipment_9_short:0 "F-15C Eagle"
 USA_jet_interceptor_equipment_9_desc:0 "Version améliorée de la plate-forme F-15 tout temps et supérieure dans les airs, la variante « C » est équipée d'un radar perfectionné capable de suivre jusqu'à une douzaine d'avions ennemis à la fois, et d'engager simultanément la moitié d'entre eux. Ce modèle a été utilisé dans de nombreux pays en dehors des États-Unis, de l'Arabie saoudite à Israël, et est la variante la plus courante de l'« Eagle » en service, conservant son excellent palmarès en matière de victoires."
 USA_high_mach_jet_interceptor_equipment_1:0 "Lockheed F-90"
 USA_high_mach_jet_interceptor_equipment_1_short:0 "F-90"
 USA_high_mach_jet_interceptor_equipment_1_desc:0 "Le Lockheed XF-90 a été construit pour répondre à une demande de l'armée de l'air américaine qui souhaitait disposer d'un chasseur à longue portée et d'un escorteur de bombardiers. Cette même demande a donné naissance au McDonnell XF-88 Voodoo. Lockheed a obtenu un contrat pour deux prototypes XP-90 (rebaptisés XF-90 en 1948)."
 USA_high_mach_jet_interceptor_equipment_2:0 "Lockheed F-104 Starfighter"
 USA_high_mach_jet_interceptor_equipment_2_short:0 "F-104 Starfighter"
 USA_high_mach_jet_interceptor_equipment_2_desc:0 "Le F-104 a été conçu pour répondre au souhait des pilotes de disposer d'un avion simple et compact offrant d'excellentes performances. Le résultat fut cet avion, l'un des premiers intercepteurs capables d'atteindre Mach 2 en service dans l'armée américaine. Le « Starfighter » établit de nombreux records de vitesse et d'altitude, mais fut entaché par des controverses politiques et une faible capacité de survie, ce qui lui valut un autre surnom, celui de « Widowmaker » (faiseur de veuves)."
 USA_high_mach_jet_interceptor_equipment_3:0 "North American F-108 Rapier"
 USA_high_mach_jet_interceptor_equipment_3_short:0 "F-108 Rapier"
 USA_high_mach_jet_interceptor_equipment_3_desc:0 "Le F-108 est un intercepteur à grande vitesse et serait le premier avion de ce type à être équipé du missile à longue portée AIM-47 Falcon. Capable d'atteindre une vitesse de Mach 3, le « Rapier » serait le fer de lance des forces de dissuasion d'interception américaines jusqu'à l'introduction du F-12 Blackbird."
 USA_high_mach_jet_interceptor_equipment_4:0 "Lockheed F-12B Blackbird"
 USA_high_mach_jet_interceptor_equipment_4_short:0 "F-12B Blackbird"
 USA_high_mach_jet_interceptor_equipment_4_desc:0 "Le F-12 est un avion intercepteur stratosphérique supersonique conçu pour intercepter relativement facilement les bombardiers volant à haute altitude ou à grande vitesse. L'appareil est équipé de trois missiles air-air à longue portée AIM-47 Falcon afin de pouvoir atteindre ses cibles avant que les bombardiers ennemis ne larguent leur charge. Son fuselage noir et ses capacités opérationnelles lui ont valu le surnom de « Blackbird » (merle noir). Ce modèle a ensuite donné naissance à l'avion de reconnaissance stratégique plus célèbre, le SR-71."
 USA_jet_CAS_equipment_1:0 "Republic F-84E Thunderjet"
 USA_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 USA_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 USA_jet_CAS_equipment_2:0 "Republic F-84G Thunderjet"
 USA_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 USA_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 USA_jet_CAS_equipment_3:0 "Republic F-84F Thunderstreak"
 USA_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 USA_jet_CAS_equipment_3_desc:0 "Développé à partir du F-84 Thunderjet précédent, le F-84F était une variante à ailes en flèche du chasseur-bombardier, conçue pour rapprocher ce type d'appareil des performances du très vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances au décollage, tout en offrant une stabilité et un contrôle médiocres. Ce modèle a été utilisé de manière limitée tout au long de sa carrière, qui s'est terminée en 1971. Son surnom est « Thunderstreak »."
 USA_jet_CAS_equipment_4:0 "Republic F-105D Thunderchief"
 USA_jet_CAS_equipment_4_short:0 "F-105D Thunderchief"
 USA_jet_CAS_equipment_4_desc:0 "Utilisé exclusivement par l'armée de l'air américaine, le F-105 est un chasseur-bombardier supersonique à ailes en flèche, initialement conçu comme un avion d'attaque nucléaire. Au moment de son introduction en 1955, il était le plus grand avion de combat monomoteur et monoplace de l'histoire. Utilisé pendant la guerre du Vietnam comme principal avion d'attaque de l'USAF, il a effectué plus de 20 000 sorties, à la fois dans sa version monoplace d'attaque et dans sa version biplace de suppression des défenses aériennes ennemies. Conformément aux conventions de dénomination de Republic Aviation, son surnom est « Thunderchief »."
 USA_jet_CAS_equipment_5:0 "Republic F-105D Thunderchief 'Look Alike'"
 USA_jet_CAS_equipment_5_short:0 "F-105D 'Look Alike'"
 USA_jet_CAS_equipment_5_desc:0 "Les améliorations apportées au Look Alike ont permis d'augmenter la capacité de l'avion de quatre à seize bombes conventionnelles de 750 livres (340 kg) sur les points d'ancrage sous les ailes et au centre du fuselage, et d'ajouter l'équipement nécessaire au lancement de missiles air-sol AGM-12 Bullpup."
 USA_jet_CAS_equipment_6:0 "LTV A-7D Corsair II"
 USA_jet_CAS_equipment_6_short:0 "A-7D Corsair II"
 USA_jet_CAS_equipment_6_desc:0 "Version construite pour l'USAF, équipée d'un turboréacteur Allison TF41-A-1 et d'un canon rotatif M61 Vulcan de 20 mm ; le radar de navigation AN/APN-153 des modèles précédents est remplacé par le radar de navigation AN/APN-185, et le radar de suivi de terrain AN/APQ-116 des A-7B/C précédents est remplacé par le radar de suivi de terrain AN/APQ-126."
 USA_jet_CAS_equipment_7:0 "Fairchild Republic A-10A Thunderbolt II"
 USA_jet_CAS_equipment_7_short:0 "A-10A Thunderbolt II"
 USA_jet_CAS_equipment_7_desc:0 "Un attaquant lourdement armé qui offre un soutien au sol à courte portée grâce à une puissance de feu et une endurance écrasantes. Doté d'un large choix d'armes, notamment des mitrailleuses de 30 mm, des bombes et des roquettes, il offre d'excellentes capacités d'attaque air-sol. Très stable à basse vitesse, il est spécialisé dans le nettoyage prolongé et précis du sol en une seule approche d'attaque. Connu sous le nom de « Thunderbolt II » (d'après le P-47 Thunderbolt), il se caractérise par une aile droite résistante à basse vitesse, et son moteur placé en hauteur et son blindage renforcé le protègent contre les contre-attaques au sol."
 USA_jet_CAS_equipment_8:0 "Fairchild Republic A-10A Thunderbolt II 'LASTE'"
 USA_jet_CAS_equipment_8_short:0 "A-10A Thunderbolt II 'LASTE'"
 USA_jet_CAS_equipment_8_desc:0 "Au début de sa carrière, l'A-10 a commencé à bénéficier de la mise à niveau LASTE (Low-Altitude Safety and Targeting Enhancement), qui comprenait un équipement informatisé de visée des armes, un pilote automatique et un système d'alerte de collision au sol. Le système LASTE a ensuite été amélioré avec un ordinateur intégré de contrôle de vol et de tir."
 USA_jet_light_equipment_1:0 "Lockheed T-33 Shooting Star"
 USA_jet_light_equipment_1_short:0 "T-33 Shooting Star"
 USA_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80, d'abord sous le nom de TP-80C/TF-80C, puis sous celui de T-33A."
 USA_jet_light_equipment_2:0 "North American FJ-2 Fury"
 USA_jet_light_equipment_2_short:0 "FJ-2 Fury"
 USA_jet_light_equipment_2_desc:0 "Les FJ-2 et FJ-3 Fury nord-américains sont une série de chasseurs à ailes en flèche aptes au transport pour la marine et le corps des Marines des États-Unis. Le FJ-2 est le résultat d'un effort visant à adapter le F-86 Sabre de l'armée de l'air américaine à la marine. Ces avions sont équipés d'ailes repliables et d'un train d'atterrissage avant plus long, conçu pour augmenter l'angle d'attaque au décollage et pour accueillir un amortisseur plus long afin d'absorber le choc des atterrissages brutaux sur le pont d'un porte-avions."
 USA_jet_light_equipment_3:0 "Northtrop F-5A Freedom Fighter"
 USA_jet_light_equipment_3_short:0 "F-5A Freedom Fighter"
 USA_jet_light_equipment_3_desc:0 "Le F-5A a été développé comme un avion de chasse léger destiné principalement à l'exportation. Il est plus léger et moins coûteux à produire que la plupart des autres chasseurs modernes, ce qui le rend idéal pour compléter les escadrons de chasseurs à courte portée. Malgré cela, ce modèle s'est révélé très maniable et était l'avion le plus à même de rivaliser avec le MiG-21 « Fishbed » soviétique. Comme il était utilisé par la majorité des alliés des États-Unis au plus fort de la guerre froide, il a été baptisé à juste titre « Freedom Fighter » (combattant de la liberté)."
 USA_jet_light_equipment_4:0 "North American Rockwell OV-10A Bronco"
 USA_jet_light_equipment_4_short:0 "OV-10A Bronco"
 USA_jet_light_equipment_4_desc:0 "Le North American Rockwell OV-10 Bronco est un avion d'attaque légère et d'observation américain à deux turbopropulseurs. Il a été développé dans les années 1960 comme avion spécial pour la lutte anti-insurrectionnelle (COIN) et l'une de ses principales missions était d'assurer le contrôle aérien avancé (FAC). Il peut transporter jusqu'à 3 200 livres de munitions externes, des charges internes telles que des parachutistes ou des civières, et rester en vol pendant trois heures ou plus."
 USA_jet_light_equipment_5:0 "North American Rockwell OV-10D Bronco"
 USA_jet_light_equipment_5_short:0 "OV-10D Bronco"
 USA_jet_light_equipment_5_desc:0 "Bronco de deuxième génération développé dans le cadre du programme NOGS. Le modèle D était une cellule OV-10A largement modifiée, à laquelle avait été ajouté un système de vision nocturne infrarouge orienté vers l'avant avec une caméra montée sur une tourelle sous un nez allongé, visuellement distinct du nez court et arrondi du modèle A. Le modèle D est également équipé de moteurs plus puissants et d'hélices en fibre de verre plus grandes. D'autres différences externes notables sont les lance-paillettes installés à mi-hauteur des poutres et les tuyaux d'échappement à suppression infrarouge (qui mélangent les gaz d'échappement avec de l'air plus froid afin de réduire la signature thermique de l'avion)."
 USA_nav_bomber_equipment_4:0 "Lockheed P2V-2 Neptune"
 USA_nav_bomber_equipment_4_short:0 "P2V-2 Neptune"
 USA_nav_bomber_equipment_4_desc:0 "Le P2V était un avion de patrouille maritime et anti-sous-marin développé pour remplacer les PV-1 Ventura et PV-2 Harpoon de la Seconde Guerre mondiale. Introduit en 1947 pour la marine américaine, il s'agissait en fait d'un avion basé à terre, et le P2V, rebaptisé P-2 après 1962, n'a jamais effectué d'appontage. Cependant, un petit nombre d'entre eux ont été convertis et déployés à partir de porte-avions comme bombardiers nucléaires de fortune qui devaient atterrir sur la côte ou amerrir, à l'instar des bombardiers utilisés lors du raid de Doolittle pendant la Seconde Guerre mondiale. Son surnom est « Neptune », d'après le dieu romain de la mer."
 USA_nav_bomber_equipment_5:0 "Lockheed P2V-7 Neptune"
 USA_nav_bomber_equipment_5_short:0 "P2V-7 Neptune"
 USA_nav_bomber_equipment_5_desc:0 "Dernière variante Neptune produite par Lockheed, équipée de moteurs R-3350-32W et J-34. Elle était équipée de réservoirs d'extrémité d'aile à faible traînée, d'un radar de recherche AN/APS-20 dans un radôme révisé et d'une verrière bombée. Les premiers appareils étaient équipés de tourelles défensives, mais celles-ci ont été supprimées comme sur le P2V-5."
 USA_nav_bomber_equipment_6:0 "Lockheed P-3 Orion"
 USA_nav_bomber_equipment_6_short:0 "P-3A Orion"
 USA_nav_bomber_equipment_6_desc:0 "Le P-3A (initialement désigné P3V), basé sur l'avion de ligne Lockheed L-188 Electra, a été conçu pour remplacer les anciens P-2 Neptune et P-5 Marlin dans le cadre de missions de patrouille maritime et de lutte anti-sous-marine (ASW) à partir de la terre ferme. Il dispose d'une soute interne pour les torpilles lancées depuis les airs, avec des pylônes sous les ailes pouvant accueillir une multitude d'armes, notamment des missiles antinavires à longue portée, des missiles air-sol, des mines et des grenades sous-marines. Il est également équipé d'un détecteur d'anomalies magnétiques à l'arrière pour détecter les sous-marins à l'aide du champ magnétique terrestre. Avec de tels outils à sa disposition et continuant à remplir son rôle depuis son introduction en 1962, il est tout à fait approprié que cet avion soit surnommé « Orion », le chasseur de navires ennemis."
 USA_nav_bomber_equipment_7:0 "Lockheed P-3C Orion"
 USA_nav_bomber_equipment_7_short:0 "P-3C Orion"
 USA_nav_bomber_equipment_7_desc:0 "Le P-3C était équipé d'une nouvelle suite ASW et d'un ordinateur de mission avec une configuration interne révisée. À l'extérieur, le P-3C était doté d'une échelle d'accès à commande électrique, d'une petite antenne sur le sommet de l'aileron, de rampes de largage de bouées acoustiques sous le fuselage et de trois petites fenêtres à l'arrière droit (une fenêtre à l'avant de la sortie de secours au-dessus de l'aile et deux à l'arrière). Les premiers appareils produits étaient équipés d'une caméra située dans la partie inférieure du radôme. Les appareils produits ultérieurement étaient équipés d'une tourelle IRDS rétractable à la place de la caméra frontale. Au début des années 1980, les caméras frontales existantes ont été remplacées par des tourelles IRDS. Les premiers modèles étaient également connus sous le nom de P-3C « Baseline » ou Non-Update (NUD). Tous les appareils ont ensuite été équipés de deux systèmes de navigation inertielle LTN-72."
 USA_nav_bomber_equipment_8:0 "Boeing P-8 Poseidon"
 USA_nav_bomber_equipment_8_short:0 "P-8 Poseidon"
 USA_nav_bomber_equipment_8_desc:0 "Initialement connu sous le nom de Multimission Maritime Aircraft (MMA), le P-8 a été conçu pour remplacer le vénérable P-3 Orion. Développé à partir du Boeing 737 Next Generation Airliner, le P-8 a été conçu pour la lutte anti-sous-marine et la patrouille maritime. De plus, il peut assurer le soutien électronique (ESM) grâce à sa capacité d'autoprotection et d'alerte précoce (EWSP). Avec des variantes en service aux États-Unis, au Royaume-Uni, en Inde et en Australie depuis son introduction en 2013, le « Poséidon » est en passe de devenir le nouveau roi des mers."
 USA_jet_tac_bomber_equipment_1:0 "North American B-45 Tornado"
 USA_jet_tac_bomber_equipment_1_short:0 "B-45 Tornado"
 USA_jet_tac_bomber_equipment_1_desc:0 "Premier bombardier à réaction opérationnel de l'USAF, le « Tornado » est un bombardier à réaction de taille moyenne capable d'assurer le soutien du champ de bataille ainsi que la reconnaissance à longue portée. Il a joué un rôle important dans la dissuasion nucléaire américaine pendant plusieurs années avant d'être remplacé par le B-47 Stratojet."
 USA_jet_tac_bomber_equipment_2:0 "Martin B-57 Canberra"
 USA_jet_tac_bomber_equipment_2_short:0 "B-57 Canberra"
 USA_jet_tac_bomber_equipment_2_desc:0 "Le « Canberra » est une version américaine du bombardier anglais du même nom. Il est idéal pour les frappes tactiques et la reconnaissance. Son retrait dans les années 1980 marquera la fin de l'ère des bombardiers tactiques."
 USA_jet_tac_bomber_equipment_3:0 "Douglas B-66 Destroyer"
 USA_jet_tac_bomber_equipment_3_short:0 "B-66 Destroyer"
 USA_jet_tac_bomber_equipment_3_desc:0 "Basé sur l'A-3 Skywarrior de la marine américaine, le « Destroyer » servait d'avion bombardier léger en remplacement de l'A-26 Invader. Parmi les changements apportés par rapport à son homologue de la marine, on note l'ajout de sièges éjectables. Tout comme son homologue de la marine, il servait également à des fins de reconnaissance et de guerre électronique."
 USA_jet_tac_bomber_equipment_4:0 "General Dynamics F-111A Aardvark"
 USA_jet_tac_bomber_equipment_4_short:0 "F-111A Aardvark"
 USA_jet_tac_bomber_equipment_4_desc:0 "L'« Aardvark » est un avion d'interception supersonique équipé d'un radar à balayage du sol, de turboréacteurs à postcombustion avancés et d'ailes à flèche variable. Cela lui permet d'effectuer des frappes à grande vitesse et à basse altitude en profondeur dans le territoire ennemi."
 USA_jet_tac_bomber_equipment_5:0 "General Dynamics F-111E Aardvark"
 USA_jet_tac_bomber_equipment_5_short:0 "F-111E Aardvark"
 USA_jet_tac_bomber_equipment_5_desc:0 "Conçue comme une solution provisoire pour le F-111D, la variante E est la dernière mise à niveau de la plate-forme « Aardvark » et comprend des entrées d'air avancées et une suite avionique améliorée."
 USA_jet_tac_bomber_equipment_6:0 "General Dynamics F-111F Aardvark"
 USA_jet_tac_bomber_equipment_6_short:0 "F-111F Aardvark"
 USA_jet_tac_bomber_equipment_6_desc:0 "Considérée comme la variante ultime de l'« Aardvark », la variante F bénéficie d'améliorations au niveau des prises d'air et de l'avionique, ainsi que d'une technologie FLIR et de désignation laser avancée et d'un dôme radar moins coûteux. Ces ajouts ont permis à l'avion d'utiliser des munitions à guidage de précision."
 USA_jet_tac_bomber_equipment_7:0 "McDonnell Douglas F-15E Strike Eagle"
 USA_jet_tac_bomber_equipment_7_short:0 "F-15E Strike Eagle"
 USA_jet_tac_bomber_equipment_7_desc:0 "Un chasseur-bombardier doté des capacités de combat aérien du F-15C et de capacités air-sol supplémentaires. Pouvant être équipé d'une large gamme d'armements, notamment des missiles antiaériens, des missiles d'attaque au sol, des missiles à verrouillage multiple et des bombes aériennes, il est capable de faire face à diverses situations. Surnommé « Strike Eagle », son apparence extérieure est presque identique à celle du F-15C, mais il offre diverses améliorations en matière d'attaque au sol."
 USA_jet_tac_bomber_equipment_8:0 "Boeing F-15E Advanced Eagle"
 USA_jet_tac_bomber_equipment_8_short:0 "F-15E Advanced Eagle"
 USA_jet_tac_bomber_equipment_8_desc:0 "La variante F-15 Advanced Eagle est une version améliorée des modèles précédents, dans la mesure où elle dispose de deux points d'emport supplémentaires sous les ailes (portant leur nombre de neuf à onze) ; d'un cockpit avec écran grand format en option ; de commandes de vol électriques ; d'un radar à balayage électronique actif (AESA) Raytheon AN/APG-82(V)1 ou AN/APG-63(V)3 ; des moteurs General Electric F110-129 ; des systèmes numériques de guidage montés sur casque dans les deux cockpits ; et un système numérique de guerre électronique, entre autres améliorations."
 USA_jet_strat_bomber_equipment_1:0 "Convair B-36 Peacemaker"
 USA_jet_strat_bomber_equipment_1_short:0 "B-36 Peacemaker"
 USA_jet_strat_bomber_equipment_1_desc:0 "Le B-36 était le plus gros bombardier à hélices jamais mis en service lorsqu'il a été lancé en 1948. Sa taille imposante lui permettait, sans modification du châssis ou des bombes, de transporter n'importe quelle bombe nucléaire dont disposaient les États-Unis à l'époque. Cependant, l'avènement des avions à réaction dans la guerre signifiait que ce type d'appareil serait rapidement remplacé par les B-47 et B-52. Contrairement à l'opinion populaire, le B-36 n'a pas de surnom officiel, mais la société et bon nombre de ses pilotes qui appréciaient ce type d'appareil l'appelaient « Peacemaker » (faiseur de paix)."
 USA_jet_strat_bomber_equipment_2:0 "Boeing B-47 Stratojet"
 USA_jet_strat_bomber_equipment_2_short:0 "B-47 Stratojet"
 USA_jet_strat_bomber_equipment_2_desc:0 "Le B-47, baptisé « Stratojet », est un bombardier subsonique à six moteurs qui vole à haute altitude pour éviter les intercepteurs ennemis. Avec ses moteurs logés dans des nacelles sous ses ailes en flèche, le B-47 a constitué une innovation majeure dans la conception des avions de combat à réaction après la Seconde Guerre mondiale et a contribué au développement des avions de ligne à réaction modernes."
 USA_jet_strat_bomber_equipment_3:0 "Boeing B-52D Stratofortress"
 USA_jet_strat_bomber_equipment_3_short:0 "B-52D Stratofortress"
 USA_jet_strat_bomber_equipment_3_desc:0 "Le B-52 est un gros bombardier subsonique à longue portée capable d'effectuer de longues missions au-dessus du territoire ennemi. Grâce à ses performances supérieures à des vitesses subsoniques élevées et à ses coûts d'exploitation relativement faibles, le « Stratofortress » est resté en service malgré l'arrivée d'avions plus récents et plus perfectionnés."
 USA_jet_strat_bomber_equipment_4:0 "Boeing B-52G Stratofortress"
 USA_jet_strat_bomber_equipment_4_short:0 "B-52G Stratofortress"
 USA_jet_strat_bomber_equipment_4_desc:0 "La variante G du B-52 dispose d'un système électronique et avionique amélioré, ainsi que d'une charge utile plus importante. Cette variante offre également une plus grande autonomie grâce à une refonte de la structure permettant d'augmenter la capacité en carburant. Grâce à cette modification et à d'autres améliorations, le « Stratofortress » continuera à servir de plate-forme de bombardement de premier plan jusqu'en 2050."
 USA_jet_strat_bomber_equipment_5:0 "Boeing B-52H"
 USA_jet_strat_bomber_equipment_5_short:0 "B-52H Stratofortress"
 USA_jet_strat_bomber_equipment_5_desc:0 "Le B-52H a subi les mêmes modifications structurelles et d'équipage que le B-52G. La mise à niveau la plus importante a été le passage aux turboréacteurs TF33-P-3 qui, malgré des problèmes de fiabilité initiaux (corrigés en 1964 dans le cadre du programme Hot Fan), offraient des performances et une économie de carburant nettement supérieures à celles des turboréacteurs J57. L'ECM et l'avionique ont été mis à jour, un nouveau système de contrôle de tir a été installé et l'armement défensif arrière est passé de mitrailleuses à un canon M61 Vulcan de 20 mm."
 USA_mach2stratbomber_equipment_1:0 "Convair B-58 Hustler"
 USA_mach2stratbomber_equipment_1_short:0 "B-58 Hustler"
 USA_mach2stratbomber_equipment_1_desc:0 "Le Hustler est un bombardier supersonique à ailes delta. Bien qu'il ne puisse rivaliser avec la charge utile des bombardiers plus gros, il compense cela par sa vitesse pure."
 USA_mach2stratbomber_equipment_2:0 "Rockwell B-1A Lancer"
 USA_mach2stratbomber_equipment_2_short:0 "B-1A Lancer"
 USA_mach2stratbomber_equipment_2_desc:0 "Le B-1 a été imaginé pour la première fois dans les années 1960 comme une plateforme qui combinerait la vitesse Mach 2 du B-58 Hustler avec l'autonomie et la charge utile du B-52, et était destiné à remplacer à terme les deux bombardiers. Après une longue série d'études, Rockwell International (qui fait désormais partie de Boeing) remporta le concours de conception pour ce qui devint le B-1A. Cette version avait une vitesse maximale de Mach 2,2 à haute altitude et était capable de voler sur de longues distances à Mach 0,85 à très basse altitude."
 USA_mach2stratbomber_equipment_3:0 "Rockwell B-1B Lancer"
 USA_mach2stratbomber_equipment_3_short:0 "B-1B Lancer"
 USA_mach2stratbomber_equipment_3_desc:0 "Bien que plus lent que le modèle A précédent, le B-1B « Lancer » disposait d'une plus grande capacité en carburant et pouvait transporter davantage de bombes en externe, en plus de sa soute interne. De plus, le B-1B était équipé d'un système de guerre électronique amélioré et avait été redessiné avec une section radar réduite, ce qui le rendait plus difficile à détecter, malgré sa vitesse réduite."
 USA_mach3stratbomber_equipment_1:0 "North American B-70 Valkyrie"
 USA_mach3stratbomber_equipment_1_short:0 "B-70 Valkyrie"
 USA_mach3stratbomber_equipment_1_desc:0 "Le B-70 est un bombardier stratégique capable d'atteindre Mach 3, conçu pour des frappes nucléaires en profondeur. Conçu dans les années 1950, le B-70 était destiné à remplacer le B-52 et pouvait voler en supercroisière à Mach 3, une technique qui ne sera reproduite que près d'un demi-siècle plus tard avec le F-22. Surnommé « Valkyrie », le B-70 allait être le catalyseur des futurs bombardiers supersoniques."
 USA_mach6stratbomber_equipment_1:0 "Lockheed Martin SR-72"
 USA_mach6stratbomber_equipment_1_short:0 "SR-72"
 USA_mach6stratbomber_equipment_1_desc:0 "Avion bombardier stratégique à grande vitesse, le SR-72 a été initialement conçu pour remplacer l'avion de reconnaissance stratégique SR-71 Blackbird. Contrairement au Blackbird, le SR-72 est extrêmement maniable pour un avion à grande vitesse et peut transporter un grand nombre de munitions."
 USA_nuclearstratbomber_equipment_1:0 "Convair NB-36H Crusader"
 USA_nuclearstratbomber_equipment_1_short:0 "NB-36H Crusader"
 USA_nuclearstratbomber_equipment_1_desc:0 "Développé dans le cadre du programme Aircraft Nuclear Propulsion (ANP), le NB-36H fut le premier bombardier stratégique à propulsion nucléaire développé pour l'armée de l'air américaine. Les modifications apportées au B-36 Peacemaker comprenaient une nouvelle cabine de pilotage recouverte de plomb et de caoutchouc, ainsi que du verre au plomb pour éviter toute contamination des pilotes. L'avion était équipé d'un réacteur refroidi à l'air d'une puissance de 1 mégawatt, pesant 35 000 livres (16 000 kg), qui était suspendu à un crochet dans la soute à bombes centrale pour faciliter le chargement et le déchargement lorsqu'il n'était pas en vol. Malgré son annulation en 1961 pour des raisons de sécurité, le « Crusader » a permis à la NASA de mieux comprendre les méthodes de manipulation des métaux liquides et des sels fondus, contribuant ainsi au développement de générateurs et de réacteurs nucléaires."
 USA_nuclearstratbomber_equipment_2:0 "Boeing XB-37B"
 USA_nuclearstratbomber_equipment_2_short:0 "XB-37B"
 USA_nuclearstratbomber_equipment_2_desc:0 "Variante modifiée du véhicule d'essai orbital (OTV) X-37B. Il s'agit d'un vaisseau spatial orbital robotisé réutilisable. Cet engin autonome dispose d'une capacité interne lui permettant de lancer des missiles de croisière ou des bombes à partir d'une soute à armes interne rotative. Cette variante est équipée d'un moteur nucléaire qui lui confère une autonomie de vol quasi illimitée."
 USA_cv_jet_CAS_equipment_1:0 "Douglas AD-1 Skyraider"
 USA_cv_jet_CAS_equipment_1_short:0 "AD-1 Skyraider"
 USA_cv_jet_CAS_equipment_1_desc:0 "Le Douglas A-1 Skyraider (anciennement AD Skyraider) est un avion d'attaque monoplace américain qui a été utilisé entre la fin des années 1940 et le début des années 1980. Le Skyraider a connu une carrière remarquablement longue et fructueuse ; il est devenu un anachronisme à moteur à pistons et à hélice à l'ère des avions à réaction, et a été surnommé « Spad »."
 USA_cv_jet_CAS_equipment_2:0 "Douglas AD-4 Skyraider"
 USA_cv_jet_CAS_equipment_2_short:0 "AD-4 Skyraider"
 USA_cv_jet_CAS_equipment_2_desc:0 "Train d'atterrissage renforcé, radar amélioré, compas G-2, équipement anti-G, quatre canons de 20 mm (0,79 pouce) et 14 lance-roquettes Aero, capable de transporter jusqu'à 50 lb (23 kg) de bombes."
 USA_cv_jet_CAS_equipment_3:0 "Douglas A-3B Skywarrior"
 USA_cv_jet_CAS_equipment_3_short:0 "A-3B Skywarrior"
 USA_cv_jet_CAS_equipment_3_desc:0 "Version définitive du bombardier de série, avec une cellule plus robuste, des moteurs plus puissants, une surface alaire légèrement plus grande (75 m² contre 72 m²), et la possibilité d'installer un système de ravitaillement en vol pour le rôle de ravitailleur. Les 21 derniers exemplaires construits étaient équipés du nouveau système de bombardement AN/ASB-7, d'un nez redessiné et d'une tourelle arrière supprimée au profit d'un équipement de guerre électronique."
 USA_cv_jet_CAS_equipment_4:0 "Douglas A-4B Skyhawk"
 USA_cv_jet_CAS_equipment_4_short:0 "A-4B Skyhawk"
 USA_cv_jet_CAS_equipment_4_desc:0 "L'A-4B est un avion d'attaque léger monomoteur capable de transporter la même charge de bombes qu'un B-17 malgré sa taille plus petite. Utilisé par plusieurs forces aériennes et aéronavales depuis son introduction en 1954, il a subi de nombreuses modifications et modernisations au cours de ses plus de 60 ans de service, et continue à être utilisé dans de nombreux pays à ce jour. Son surnom est « Skyhawk »."
 USA_cv_jet_CAS_equipment_5:0 "Douglas A-4E Skyhawk"
 USA_cv_jet_CAS_equipment_5_short:0 "A-4E Skyhawk"
 USA_cv_jet_CAS_equipment_5_desc:0 "Mise à niveau majeure, comprenant un nouveau moteur Pratt &amp; Whitney J52-P-6A d'une poussée de 8 400 lbf (37 kN), une cellule renforcée avec deux pylônes d'armes supplémentaires (pour un total de cinq), une avionique améliorée, avec TACAN, radar de navigation Doppler, altimètre radar, ordinateur de bombardement en piqué et système de bombardement à basse altitude AJB-3A. Beaucoup ont ensuite été modernisés avec un moteur J52-P-8 développant une poussée de 9 300 lbf (41 kN)."
 USA_cv_jet_CAS_equipment_6:0 "Grumman A-6A Intruder"
 USA_cv_jet_CAS_equipment_6_short:0 "A-6A Intruder"
 USA_cv_jet_CAS_equipment_6_desc:0 "Avion embarqué tout temps doté de systèmes électroniques très sophistiqués pour l'époque. Il a été développé dans le but de pouvoir voler à basse altitude en territoire ennemi et d'utiliser une sélection d'armes pour porter un coup fatal. Son surnom est « Intruder ». Il a également reçu divers autres surnoms en raison de sa partie avant large et de sa partie arrière effilée, notamment « Tadpole » (têtard) et « Dog Ship » (navire chien)."
 USA_cv_jet_CAS_equipment_7:0 "LTV A-7 Corsair II"
 USA_cv_jet_CAS_equipment_7_short:0 "A-7 Corsair II"
 USA_cv_jet_CAS_equipment_7_desc:0 "Développé à partir du F-8 Crusader, le « Corsair II » (nommé d'après le F4U Corsair) est un avion d'attaque léger monoplace, subsonique et embarqué, doté d'une charge utile et d'une autonomie supérieures à celles de l'A-4 Skyhawk qu'il a remplacé. Il a ensuite été utilisé par l'armée de l'air américaine, remplaçant les vénérables A-1 Skyraider et F-100 Super Sabre, devenant ainsi l'un des rares avions d'attaque au sol à servir à la fois dans la marine et dans l'armée de l'air."
 USA_cv_jet_CAS_equipment_8:0 "Grumman A-6E Intruder"
 USA_cv_jet_CAS_equipment_8_short:0 "A-6E Intruder"
 USA_cv_jet_CAS_equipment_8_desc:0 "La version d'attaque définitive de l'Intruder, dotée de systèmes de navigation et d'attaque considérablement améliorés. Les radars de recherche et de poursuite (contrôle de tir) séparés des A-6A/B/C ont été remplacés par un seul radar multimode Norden AN/APQ-148 et par des ordinateurs de bord dotés d'un système plus sophistiqué et plus fiable."
 USA_cv_jet_CAS_equipment_9:0 "Grumman A-6E Intruder WCSI"
 USA_cv_jet_CAS_equipment_9_short:0 "A-6E Intruder WCSI"
 USA_cv_jet_CAS_equipment_9_desc:0 "Dans les années 1980, les avions A-6E Intruder ont été convertis en version A-6E WCSI (Weapons Control System Improvement) afin d'augmenter leur capacité d'armement. Cela leur a permis de transporter et de cibler certaines des armes guidées de précision de première génération, comme le missile AGM-84 Harpoon et l'AGM-123 Skipper. L'avion WCSI a finalement été modifié pour avoir une capacité limitée à utiliser le missile d'attaque terrestre à distance AGM-84E SLAM. Comme les missiles Harpoon et SLAM avaient des interfaces de communication communes, les avions WCSI pouvaient transporter et tirer des missiles SLAM, mais avaient besoin d'un A-6E SWIP à proximité pour les guider vers leur cible."
 USA_cv_jet_CAS_equipment_10:0 "McDonnell Douglas F/A-18B Hornet"
 USA_cv_jet_CAS_equipment_10_short:0 "F/A-18B Hornet"
 USA_cv_jet_CAS_equipment_10_desc:0 "Développé à partir du prototype YF-17 Cobra de l'USAF, le « Hornet » fait partie d'une nouvelle génération d'avions polyvalents qui combinent les dernières avancées en matière de technologies informatiques avec une vitesse et une agilité élevées pour offrir des performances de combat inégalées. En raison du nombre limité d'avions qu'un porte-avions peut accueillir, le « Hornet » basé sur porte-avions a été conçu comme un avion multirôle capable d'effectuer des missions air-air et air-sol. Le B est une version biplace d'attaque au sol."
 USA_cv_jet_multirole_equipment_1:0 "McDonnell Douglas F2H Banshee"
 USA_cv_jet_multirole_equipment_1_short:0 "F2H Banshee"
 USA_cv_jet_multirole_equipment_1_desc:0 "Le McDonnell F2H Banshee était un avion de chasse à réaction monoplace basé sur porte-avions, utilisé par la marine américaine et le corps des Marines des États-Unis de 1948 à 1961. Il fut l'un des principaux chasseurs américains utilisés pendant la guerre de Corée et le seul chasseur à réaction utilisé par la Marine royale canadienne."
 USA_cv_jet_multirole_equipment_2:0 "Grumman F9F Panther"
 USA_cv_jet_multirole_equipment_2_short:0 "F9F Panther"
 USA_cv_jet_multirole_equipment_2_desc:0 "Le F9F a été initialement conçu comme un avion à réaction à ailes droites embarqué sur porte-avions, introduit en 1949. L'un des premiers avions à réaction embarqués utilisés par la marine américaine, il a été le principal avion d'attaque au sol de l'USN et de l'USMC pendant la guerre de Corée, effectuant 78 000 sorties, et a été crédité de la première victoire aérienne d'un chasseur de la marine américaine pendant la guerre. Sa structure robuste lui permettait de mener des opérations d'attaque au sol, même sous le feu antiaérien. Le F9F (rebaptisé plus tard F-9) a également servi dans les Blue Angels, devenant le premier avion à réaction utilisé par l'équipe. Conformément à la tradition de Grumman qui consiste à donner aux avions des noms de grands félins, cet avion est connu sous le nom de « Panther » (panthère)."
 USA_cv_jet_multirole_equipment_3:0 "McDonnell F3H Demon"
 USA_cv_jet_multirole_equipment_3_short:0 "F3H Demon"
 USA_cv_jet_multirole_equipment_3_desc:0 "Le F3H était un chasseur subsonique à ailes en flèche qui a connu de nombreux problèmes tout au long de sa carrière. Initialement prévu pour être équipé du moteur J40, des problèmes liés à la conception du prototype ont conduit à l'annulation de ce moteur et le F3H a été équipé d'un moteur moins puissant à la place. Malgré ses problèmes, le Demon était un intercepteur tout temps performant, offrant une bonne visibilité pour l'époque. Initialement armé de quatre canons de 20 mm, un modèle ultérieur fut équipé des premiers exemplaires de ce qui allait devenir le missile infrarouge AIM-9 Sidewinder et le missile air-air semi-actif AAM-N-2 (plus tard AIM-7) Sparrow. Conformément aux conventions de dénomination de McDonnell, son surnom officiel est « Demon »."
 USA_cv_jet_multirole_equipment_4:0 "Vought F-8 Crusader"
 USA_cv_jet_multirole_equipment_4_short:0 "F-8 Crusader"
 USA_cv_jet_multirole_equipment_4_desc:0 "Chasseur supersonique monomoteur destiné à assurer la supériorité aérienne, le F-8 (initialement connu sous le nom de F8U) a été conçu pour la défense aérienne rapprochée des flottes. Cet avion transporte une charge utile de munitions plus importante que le F11F Tiger ou le F7U Cutlass (qu'il a remplacé), et peut également servir de plate-forme de reconnaissance photographique rapide. Surnommé « Crusader », il était l'un des chasseurs de supériorité aérienne à conserver son armement interne au moment de la guerre du Vietnam, ce qui lui a valu un autre surnom, « The Last Gunfighter » (le dernier chasseur à armement)."
 USA_cv_jet_multirole_equipment_5:0 "McDonnell Douglas F-4B Phantom II"
 USA_cv_jet_multirole_equipment_5_short:0 "F-4B Phantom II"
 USA_cv_jet_multirole_equipment_5_desc:0 "Avion de chasse et d'attaque au sol biplace, tout temps, basé sur porte-avions, destiné à la marine américaine et au corps des Marines. Moteurs J79-GE-8A ou -8B avec une poussée de 16 950 lbf (75,4 kN) chacun en postcombustion. Surnommé « Phantom II » (en référence au FH Phantom), le F-4 Phantom II fut le premier avion utilisé conjointement par les trois branches des forces armées américaines, à savoir la marine, le corps des Marines et l'armée de l'air."
 USA_cv_jet_multirole_equipment_6:0 "McDonnell Douglas F-4J Phantom II"
 USA_cv_jet_multirole_equipment_6_short:0 "F-4J Phantom II"
 USA_cv_jet_multirole_equipment_6_desc:0 "Version améliorée du F-4B pour l'US Navy et le Marine Corps, mettant l'accent sur l'amélioration des capacités de combat air-air, notamment : moteurs J79-GE-10 avec une poussée de 17 844 lbf (79,374 kN) chacun en postcombustion, radar Doppler à impulsions AN/APG-59 couplé au système de contrôle de tir AN/AWG-10 pour une capacité de tir vers le bas, des roues de train d'atterrissage principales plus grandes, entraînant des renflements des ailes similaires à ceux du F-4C, un empennage à volets, des ailerons inclinés à 16,5° lorsque le train d'atterrissage et les volets étaient déployés pour réduire la vitesse d'atterrissage, des sièges éjectables zéro-zéro, une capacité d'attaque au sol étendue, aucun capteur IRST sous le nez."
 USA_cv_jet_multirole_equipment_7:0 "McDonnell Douglas F-4N Phantom II"
 USA_cv_jet_multirole_equipment_7_short:0 "F-4N Phantom II"
 USA_cv_jet_multirole_equipment_7_desc:0 "F-4B modernisé dans le cadre du projet Bee Line, mêmes améliorations aérodynamiques que le F-4J, moteurs sans fumée et cellule renforcée."
 USA_cv_jet_multirole_equipment_8:0 "Grumman F-14A Tomcat"
 USA_cv_jet_multirole_equipment_8_short:0 "F-14A Tomcat"
 USA_cv_jet_multirole_equipment_8_desc:0 "Un grand chasseur embarqué destiné à remplacer le F-4 comme principal moyen de défense aérienne de la flotte. Il est équipé d'ailes variables qui peuvent changer d'angle automatiquement, même en vol, ce qui lui confère à la fois une grande vitesse à haute altitude et une grande maniabilité à basse altitude. Il est également équipé de missiles à longue portée capables d'abattre les ennemis à une distance considérable. Connu sous le nom de « Tomcat »."
 USA_cv_jet_multirole_equipment_9:0 "Grumman F-14B Tomcat"
 USA_cv_jet_multirole_equipment_9_short:0 "F-14B Tomcat"
 USA_cv_jet_multirole_equipment_9_desc:0 "Une variante du chasseur F-14A embarqué, créée grâce à une mise à niveau majeure qui comprend le remplacement du moteur. Les principales améliorations comprennent la résolution des problèmes de moteur, l'augmentation de la propulsion et la révision de l'avionique. D'autres modifications ont été apportées dans les années 90 afin de prolonger la durée de vie de l'appareil et de lui conférer des capacités d'attaque air-sol supplémentaires. Ce F-14 modifié est également utilisé pour des attaques tactiques à grande vitesse et longue distance. Il est connu sous le nom de « Tomcat », tout comme le type A. Lorsqu'il est modifié pour le bombardement, le F-14 est également connu sous le nom officieux de « Bombcat »."
 USA_cv_jet_multirole_equipment_10:0 "McDonnell Douglas F/A-18A Hornet"
 USA_cv_jet_multirole_equipment_10_short:0 "F/A-18A Hornet"
 USA_cv_jet_multirole_equipment_10_desc:0 "Développé à partir du prototype YF-17 Cobra de l'USAF, le « Hornet » fait partie d'une nouvelle génération d'avions polyvalents qui combinent les dernières avancées en matière de technologies informatiques avec une vitesse et une agilité élevées pour offrir des performances de combat inégalées. En raison du nombre limité d'avions qu'un porte-avions peut accueillir, le « Hornet » basé sur porte-avions a été conçu comme un avion multirôle capable d'effectuer des missions air-air et air-sol."
 USA_stealth_tactical_bomber_equipment_1:0 "Lockheed F-117A Nighthawk"
 USA_stealth_tactical_bomber_equipment_1_short:0 "F-117A Nighthawk"
 USA_stealth_tactical_bomber_equipment_1_desc:0 "Le tout premier attaquant furtif, spécialisé dans les bombardements secrets. Comme sa conception est entièrement axée sur ses capacités furtives, cet avion manque de vitesse et de maniabilité. En revanche, le fait de rester hors de portée des radars ennemis lui permet d'utiliser des bombes guidées pour effectuer des frappes chirurgicales. Il présente une forme unique composée de surfaces planes et d'une peinture spéciale afin de réfléchir et d'absorber les ondes radar. Surnommé « Nighthawk », il s'est illustré pendant la guerre du Golfe de 1991 en effectuant plus de 1 200 sorties sans qu'aucun appareil ne soit abattu."
 USA_stealth_tactical_bomber_equipment_2:0 "Lockheed Martin FB-22 Strike Raptor"
 USA_stealth_tactical_bomber_equipment_2_short:0 "FB-22 Strike Raptor"
 USA_stealth_tactical_bomber_equipment_2_desc:0 "Le Lockheed Martin FB-22 était un projet d'avion bombardier furtif destiné à entrer en service dans l'armée de l'air américaine. Sa conception était dérivée du F-22 Raptor. Le FB-22 a été annulé à la suite de la Quadrennial Defense Review (révision quadriennale de la défense) de 2006. Son rayon d'action a presque triplé, passant de 970 km à plus de 2 600 km, et aurait pu être encore augmenté grâce à des réservoirs de carburant externes. Cela plaçait l'avion dans la catégorie des bombardiers régionaux, comparable à celle du F-111."
 USA_stealth_strategic_bomber_equipment_1:0 "Northrop Grumman B-2 Spirit"
 USA_stealth_strategic_bomber_equipment_1_short:0 "B-2 Spirit"
 USA_stealth_strategic_bomber_equipment_1_desc:0 "Un bombardier stratégique furtif capable de pénétrer en territoire ennemi sans être détecté par les radars et d'effectuer des raids de bombardement à grande échelle. Cet avion à aile volante n'a pas de queue, ce qui le rend plus difficile à détecter par les radars. Ses performances de manœuvre ont été sacrifiées au profit d'une furtivité accrue, ce qui lui permet de pénétrer plus sûrement les réseaux radar. Le nombre d'appareils fabriqués est extrêmement faible, c'est pourquoi chaque avion se voit attribuer un nom unique composé du surnom « Spirit » et du nom d'un territoire géographique."
 USA_stealth_strategic_bomber_equipment_2:0 "Northrop Grumman B-21 Raider"
 USA_stealth_strategic_bomber_equipment_2_short:0 "B-21 Raider"
 USA_stealth_strategic_bomber_equipment_2_desc:0 "Développé à partir des enseignements tirés du B-2 Spirit, le B-21, qui fait partie du programme Long Range Strike Bomber (LRS-B), est destiné à être un bombardier stratégique furtif à très longue portée pour l'armée de l'air américaine, capable de transporter des armes conventionnelles ou thermonucléaires. Comme son prédécesseur, le « Raider » est un bombardier à aile volante, ce qui augmente ses performances de furtivité pour pénétrer plus sûrement les réseaux radar."
 USA_stealth_fighter_equipment_1:0 "Lockheed Martin F-22A Raptor"
 USA_stealth_fighter_equipment_1_short:0 "F-22A Raptor"
 USA_stealth_fighter_equipment_1_desc:0 "Cet avion de combat furtif ultime fait la fierté des forces armées américaines. Outre ses performances de vol, il offre une accélération hors pair et dispose d'une tuyère à poussée bidimensionnelle qui lui confère une maniabilité exceptionnelle. Sa puissance de frappe préventive, baptisée « first look, first shoot, first kill » (premier regard, premier tir, première destruction), sied parfaitement à un avion portant le nom de « Raptor », le maître des cieux."
 USA_cv_stealth_fighter_equipment_1:0 "Lockheed Martin F-22N Sea Raptor"
 USA_cv_stealth_fighter_equipment_1_short:0 "F-22N Sea Raptor"
 USA_cv_stealth_fighter_equipment_1_desc:0 "Baptisé « Sea Raptor », le F-22N est la variante embarquée du Raptor et possède bon nombre des capacités du F-22A basé à terre. Développé pour la marine américaine, le F-22N dispose d'une capacité de décollage court qui lui permet d'être utilisé pour des opérations embarquées. En plus d'être capable de larguer des munitions, ses missiles haute performance lui permettent d'attaquer au-delà de la portée des avions ennemis. Parfaitement adapté aux missions de combat aérien et à la défense aérienne de la flotte, le F-22N est un puissant chasseur préventif."
 USA_jump_jet_equipment_1:0 "Hawker Siddeley AV-8A Harrier"
 USA_jump_jet_equipment_1_short:0 "AV-8A Harrier"
 USA_jump_jet_equipment_1_desc:0 "Cet avion d'attaque a été développé pour faire du VTOL (décollage et atterrissage verticaux) une réalité. Il présente une conception unique avec des ailes montées en hauteur et quatre tuyères rotatives. Cela lui permet d'opérer dans des espaces restreints tels que les porte-avions légers et les petits aérodromes. Cet avion est communément appelé « Harrier ». Développé en Grande-Bretagne, l'AV-8A est connu dans ce pays sous le nom de Harrier Mk. 50 et fonctionnait de manière similaire aux Harrier GR.1 de la Royal Air Force."
 USA_jump_jet_equipment_2:0 "Hawker Siddeley AV-8C Harrier"
 USA_jump_jet_equipment_2_short:0 "AV-8C Harrier"
 USA_jump_jet_equipment_2_desc:0 "La variante « C » est une version améliorée de l'AV-8A et fonctionne avec des systèmes similaires à ceux du Harrier GR.3, avec un nouvel équipement ECM et un système de navigation inertielle."
 USA_jump_jet_equipment_3:0 "McDonnell Douglas AV-8B Harrier II"
 USA_jump_jet_equipment_3_short:0 "AV-8B Harrier II"
 USA_jump_jet_equipment_3_desc:0 "Le Harrier II est un projet conjoint anglo-américain conçu par McDonnell Douglas en collaboration avec British Aerospace. En service dans le Corps des Marines des États-Unis depuis 1985, le « Harrier II » a été considéré comme un outil important dans de nombreux conflits américains récents."
 USA_jump_jet_equipment_4:0 "McDonnell Douglas AV-8B Harrier II Plus"
 USA_jump_jet_equipment_4_short:0 "AV-8B Harrier II Plus"
 USA_jump_jet_equipment_4_desc:0 "Version améliorée de l'AV-8B, l'AV-8B Plus est équipé d'un moteur plus puissant, d'un système radar et d'une caméra infrarouge, ce qui en fait un excellent avion d'attaque nocturne."
 USA_recon_equipment_0:0 "Stinson L-5 Sentinel"
 USA_recon_equipment_0_short:0 "L-5 Sentinel"
 USA_recon_equipment_0_desc:0 "Le Stinson L-5 Sentinel était un avion de liaison de la Seconde Guerre mondiale utilisé par toutes les branches de l'armée américaine et par la Royal Air Force britannique. Il était produit par la Stinson Aircraft Company. Avec le Stinson L-1 Vigilant, le L-5 était le seul autre avion de liaison américain de la Seconde Guerre mondiale spécialement conçu pour un usage militaire et qui n'avait pas d'équivalent civil. Tous les autres avions de liaison militaires adoptés pendant la Seconde Guerre mondiale étaient des modèles civils « prêts à l'emploi » légèrement modifiés."
 USA_jet_recon_equipment_0:0 "North American RF-86 Sabre"
 USA_jet_recon_equipment_0_short:0 "RF-86 Sabre"
 USA_jet_recon_equipment_0_desc:0 "Conversions F-86 avec trois caméras pour la reconnaissance"
 USA_jet_recon_equipment_1:0 "McDonnell Douglas RF-4C Phantom II"
 USA_jet_recon_equipment_1_short:0 "RF-4C Phantom II"
 USA_jet_recon_equipment_1_desc:0 "Version de reconnaissance tactique tout temps pour l'US Air Force, radar AN/APQ-99 (plus tard AN/APQ-172). Équipé de manière similaire au RF-4B, mais avec un choix plus large de caméras, y compris un pod central pour la gigantesque caméra HIAC-1 LOROP (Long Range Oblique Photography), capable de prendre des images haute résolution d'objets situés à 160 km. De nombreux appareils ont été rééquipés d'un nez plus spacieux, bombé et profilé."
 USA_jet_recon_equipment_2:0 "Lockheed Martin F-16C Block 30 Recce"
 USA_jet_recon_equipment_2_short:0 "F-16C Block 30 Recce"
 USA_jet_recon_equipment_2_desc:0 "La première variante de reconnaissance était un F-16D de l'USAF configuré à titre expérimental en 1986 avec un pod multicapteur de type baignoire situé sur l'axe central. En 1988, l'USAF a décidé de remplacer la flotte vieillissante de RF-4C Phantom par des F-16C Block 30 équipés du pod central Advanced Tactical Airborne Reconnaissance System (ATARS) de Control Data Corporation, capable de transporter divers capteurs. Cependant, des problèmes liés au programme ATARS ont conduit l'USAF à se retirer en juin 1993. Au milieu des années 1990, l'armée de l'air américaine a expérimenté une série de modèles de nacelles de reconnaissance centrale, à commencer par un prototype, la nacelle Electro-Optical 1 (EO-1). Le premier vol d'un F-16 équipé d'un prototype TARS a eu lieu le 26 août 1995, et le 27 septembre 1996, l'USAF a passé sa première commande de production pour ces nacelles."
 USA_transport_plane_equipment_1:0 "Douglas C-47 Skytrain"
 USA_transport_plane_equipment_1_short:0 "C-47 Skytrain"
 USA_transport_plane_equipment_1_desc:0 "Développé à partir de l'avion de ligne Douglas DC-3 lors de son premier vol en 1941, le C-47 était l'avion de transport par excellence utilisé par les Alliés. Pendant la Seconde Guerre mondiale, les forces armées de nombreux pays ont utilisé le C-47 et des DC-3 modifiés pour le transport de troupes, de marchandises et de blessés. Plus de 10 000 unités, tant des C-47 que des R4D (plus tard C-117), la variante navale, ont été construites pour la guerre, et de nombreux « Skytrains » ont été utilisés non seulement pour le transport de troupes et de marchandises, mais aussi pour les opérations de recherche et de sauvetage et, pendant la guerre du Vietnam, comme premiers hélicoptères de combat."
 USA_transport_plane_equipment_2:0 "Douglas C-54 Skymaster"
 USA_transport_plane_equipment_2_short:0 "C-54 Skymaster"
 USA_transport_plane_equipment_2_desc:0 "Tout comme le C-47 avant lui, le C-54 a été développé à partir d'un avion de ligne Douglas, en l'occurrence le DC-4. Mis en service en 1942, le C-54 servait au transport de marchandises, mais transportait également des personnalités importantes, étant l'un des premiers avions à transporter le président des États-Unis (mais pas le premier avion à être désigné Air Force One). Cependant, le « Skymaster » doit sa renommée au fait qu'il fut le type d'avion le plus utilisé pour acheminer du charbon et des vivres à Berlin-Ouest pendant le célèbre pont aérien de Berlin. Les variantes de la marine étaient connues sous le nom de R5D."
 USA_transport_plane_equipment_3:0 "Douglas C-124 Globemaster II"
 USA_transport_plane_equipment_3_short:0 "C-124 Globemaster II"
 USA_transport_plane_equipment_3_desc:0 "Le C-124 était le principal avion de transport lourd du Service de transport aérien militaire (MATS) de l'armée de l'air américaine dans les années 1950 et au début des années 1960, jusqu'à l'entrée en service du Lockheed C-141 Starlifter. Il a servi dans les unités du MATS, puis du Commandement du transport aérien militaire (MAC), de la réserve de l'armée de l'air et de la garde nationale aérienne jusqu'en 1974."
 USA_transport_plane_equipment_4:0 "Lockheed C-130 Hercules"
 USA_transport_plane_equipment_4_short:0 "C-130 Hercules"
 USA_transport_plane_equipment_4_desc:0 "Développé en 1954, le C-130 est un avion de transport capable d'utiliser des pistes non préparées pour décoller et atterrir, ce qui en fait un appareil pratique pour le transport de troupes et de marchandises ainsi que pour l'évacuation médicale. Mais ce qui vaut à cet avion son surnom d'« Hercules », c'est qu'il existe plusieurs sous-variantes développées pour divers rôles, notamment comme avion de combat (AC-130 Spooky &amp; Spectre), drone de contrôle (DC-130), brouilleur et PSYOPS (EC-130 Compass Call) et reconnaissance météorologique (WC-130). Une machine véritablement polyvalente qui mérite bien son surnom."
 USA_transport_plane_equipment_5:0 "Lockheed C-141 Starlifter"
 USA_transport_plane_equipment_5_short:0 "C-141 Starlifter"
 USA_transport_plane_equipment_5_desc:0 "Conçu pour remplacer le C-124 Globemaster II et le C-133 Cargomaster, le C-141 est entré en service en 1965 au sein du Military Air Transport Service (MATS), puis de son successeur, le Military Airlift Command (MAC), et enfin de l'Air Mobility Command (AMC) de l'armée de l'air américaine. Au cours de ses plus de 40 années de service, il a participé à de nombreuses opérations américaines à travers le monde, servant dans des zones de guerre au Vietnam et en Israël."
 USA_transport_plane_equipment_6:0 "McDonnell Douglas C-5A Galaxy"
 USA_transport_plane_equipment_6_short:0 "C-5A Galaxy"
 USA_transport_plane_equipment_6_desc:0 "Le Lockheed C-5 Galaxy est un gros avion de transport militaire initialement conçu et construit par Lockheed, et désormais entretenu et modernisé par son successeur, Lockheed Martin. Il offre à l'armée de l'air américaine (USAF) une capacité de transport aérien stratégique intercontinental lourd, capable de transporter des charges hors gabarit et surdimensionnées, y compris toutes les cargaisons certifiées pour le transport aérien. Le Galaxy présente de nombreuses similitudes avec le Lockheed C-141 Starlifter, plus petit, et le Boeing C-17 Globemaster III, plus récent. Le C-5 fait partie des plus gros avions militaires au monde."
 USA_transport_plane_equipment_7:0 "McDonnell Douglas C-5B Galaxy"
 USA_transport_plane_equipment_7_short:0 "C-5B Galaxy"
 USA_transport_plane_equipment_7_desc:0 "Le C-5B est une version améliorée du C-5A. Il intègre toutes les modifications et améliorations apportées au C-5A, avec des ailes améliorées, un train d'atterrissage simplifié, des turboréacteurs TF-39-GE-1C modernisés et une avionique mise à jour."
 USA_transport_plane_equipment_8:0 "Boeing C-17A Globemaster III"
 USA_transport_plane_equipment_8_short:0 "C-17A Globemaster III"
 USA_transport_plane_equipment_8_desc:0 "Lancé en 1995, le C-17 était le troisième avion de sa famille à porter le nom de « Globemaster ». Assurant à la fois des missions de transport aérien stratégique et tactique, le C-17 allait remplacer le C-141 et libérer le C-5 d'une grande partie de ses tâches (le déléguant au transport de cargaisons hors gabarit). En service dans 8 pays, le « Globemaster III » continuera à répondre aux besoins de l'armée américaine pendant de nombreuses années."
 USA_transport_plane_equipment_9:0 "Boeing C-17A Globemaster III Block 21"
 USA_transport_plane_equipment_9_short:0 "C-17A Block 21"
 USA_transport_plane_equipment_9_desc:0 "Cette mise à niveau logicielle/matérielle constituait une amélioration majeure du système embarqué de génération de gaz inerte (OBIGGS II), d'un nouveau radar météorologique, d'un système de stabilisation amélioré et d'autres équipements avioniques."
 USA_transport_plane_equipment_10:0 "Boeing C-17A Globemaster III"
 USA_transport_plane_equipment_10_short:0 "C-17A Block 21"
 USA_transport_plane_equipment_10_desc:0 "Cette mise à niveau logicielle/matérielle constituait une amélioration majeure du système embarqué de génération de gaz inerte (OBIGGS II), d'un nouveau radar météorologique, d'un système de stabilisation amélioré et d'autres équipements avioniques."
 USA_mp_uav_1:0 "AeroVironment RQ-11 Raven"
 USA_mp_uav_1_short:0 "RQ-11 Raven"
 USA_mp_uav_2:0 "AeroVironment RQ-20 Puma"
 USA_mp_uav_2_short:0 "RQ-20 Puma"
 USA_cas_uav_equipment_1:0 "General Atomics RQ-1 Predator"
 USA_cas_uav_equipment_1_short:0 "RQ-1 Predator"
 USA_cas_uav_equipment_2:0 "General Atomics MQ-1A Predator"
 USA_cas_uav_equipment_2_short:0 "MQ-1A Predator"
 USA_cas_uav_equipment_3:0 "General Atomics MQ-9 Reaper"
 USA_cas_uav_equipment_3_short:0 "MQ-9 Reaper"
 USA_naval_uav_equipment_1:0 "AAI RQ-2 Pioneer"
 USA_naval_uav_equipment_1_short:0 "RQ-2 Pioneer"
 USA_naval_uav_equipment_2:0 "Northrop Grumman MQ-8 Fire Scout"
 USA_naval_uav_equipment_2_short:0 "MQ-8 Fire Scout"
 USA_naval_uav_equipment_3:0 "Northrop Grumman MQ-47B UCAS-D"
 USA_naval_uav_equipment_3_short:0 "MQ-47B UCAS-D"
 USA_slbm_equipment_1:0 "UGM-19 Jupiter S"
 USA_slbm_equipment_1_short:0 "Jupiter S"
 USA_slbm_equipment_1_desc:0 "L'UGM-19 est la variante lancée depuis un sous-marin du missile PGM-19 utilisé par l'armée américaine. Grâce à sa forme courte et trapue, le « Jupiter S » pouvait facilement être installé sur des navires de surface et des sous-marins."
 USA_slbm_equipment_2:0 "UGM-27A Polaris"
 USA_slbm_equipment_2_short:0 "Polaris A"
 USA_slbm_equipment_2_desc:0 "Introduit en 1961, l'UGM-27A remplaçait le missile Jupiter en tant que SLBM. Missile à deux étages à tête nucléaire, le « Polaris » était conçu pour être utilisé dans le cadre d'une riposte de seconde frappe (son CEP n'étant pas suffisant pour une première frappe) dans le cadre de la contribution de la marine à l'arsenal nucléaire américain, en remplacement du missile de croisière SSM-N-8 Regulus."
 USA_slbm_equipment_3:0 "UGM-27B Polaris"
 USA_slbm_equipment_3_short:0 "Polaris B"
 USA_slbm_equipment_3_desc:0 "Également connue sous le nom de « Polaris A-2 », cette variante améliorée de l'UGB-27 était équipée d'une nouvelle ogive nucléaire, la W-47, qui augmentait la puissance explosive. Cependant, des problèmes mécaniques liés à l'armement et à la sécurité ont conduit à une durée de vie utile très courte, car elle a été rapidement remplacée par l'UGM-27C."
 USA_slbm_equipment_4:0 "UGM-27C Polaris"
 USA_slbm_equipment_4_short:0 "Polaris C"
 USA_slbm_equipment_4_desc:0 "Également connue sous le nom de « Polaris A-3 », cette version a remplacé le W-47 par le W-58, une ogive nucléaire qui fonctionne comme un véhicule à rentrée multiple, se divisant en trois ogives distinctes pouvant transporter chacune une charge utile de 200 kt, ou pouvant être maintenues ensemble pour un rendement théorique de 1 mégatonne. Un renforcement limité a été appliqué pour protéger les systèmes électroniques des missiles contre les effets des impulsions électromagnétiques nucléaires pendant la phase de propulsion."
 USA_slbm_equipment_5:0 "UGM-73 Poseidon"
 USA_slbm_equipment_5_short:0 "Poseidon"
 USA_slbm_equipment_5_desc:0 "L'UGM-73 est un missile balistique lancé depuis un sous-marin (SLBM) à deux étages, propulsé par un moteur-fusée à combustible solide, qui a remplacé le Polaris à partir de 1971-1972. Équipé de 10 à 14 ogives W-68 d'une puissance de 40 à 50 kilotonnes, le « Poséidon » était un missile à ogives multiples (MIRV) doté d'une charge utile plus importante et d'une précision améliorée par rapport à son prédécesseur immédiat. Il a été le missile le plus utilisé sur les sous-marins nucléaires lanceurs d'engins américains tout au long des années 70 et 80."
 USA_slbm_equipment_6:0 "UGM-96 Trident I"
 USA_slbm_equipment_6_short:0 "Trident I"
 USA_slbm_equipment_6_desc:0 "L'UGM-96 a été développé en 1979 pour succéder au SLBM Poséidon. Il s'agit d'un missile à trois étages propulsé par un moteur à propergol solide et équipé de huit ogives nucléaires W-76, chacune d'une puissance d'environ 100 kt, soit cinq fois plus que la bombe Fat Man qui a dévasté Nagasaki. Le « Trident I » est resté en service jusqu'à ce que toutes les unités soient complètement retirées en 2005."
 USA_slbm_equipment_7:0 "UGM-133 Trident II"
 USA_slbm_equipment_7_short:0 "Trident II"
 USA_slbm_equipment_7_desc:0 "Le missile actuel utilisé par les sous-marins de la marine américaine, l'UGM-133, est une arme puissante à prendre au sérieux. Avec une portée de plus de 12 000 km et équipé de 8 à 14 ogives W-76 utilisées sur son prédécesseur, ou de W-88 plus dévastatrices d'une puissance nucléaire de 425 kt, le « Trident II » restera un formidable moyen de dissuasion pour les États-Unis dans un avenir prévisible."
 USA_irbm_equipment_1:0 "PGM-17 Thor"
 USA_irbm_equipment_1_short:0 "Thor"
 USA_irbm_equipment_1_desc:0 "Le premier missile balistique opérationnel utilisé par l'armée de l'air américaine, le PGM-17 (désignation d'origine : SM-75), a été développé en 1956 en raison des craintes suscitées par le développement de missiles à longue portée par l'Union soviétique. Les ogives typiques avaient une puissance de 1,44 mégatonne, ce qui en faisait une arme très puissante. Bien qu'ils aient été retirés du service en 1963, les « Thor » pouvaient être réactivés à tout moment pour frapper des cibles à la vitesse de l'éclair."
 USA_irbm_equipment_2:0 "PGM-19 Jupiter A"
 USA_irbm_equipment_2_short:0 "Jupiter A"
 USA_irbm_equipment_2_desc:0 "Le PGM-19 fut le premier missile balistique à moyenne portée à tête nucléaire utilisé par l'armée de l'air américaine. Initialement développé pour l'armée de terre et la marine américaines, ce missile conserva sa forme trapue afin de pouvoir être utilisé à bord de sous-marins, bien que la marine ait finalement choisi de développer le missile Polaris. Baptisé « Jupiter », d'après le roi des dieux romains, il était équipé d'une ogive nucléaire d'une puissance de 1,1 mégatonne."
 USA_irbm_equipment_3:0 "PGM-19 Jupiter C"
 USA_irbm_equipment_3_short:0 "Jupiter C"
 USA_irbm_equipment_3_desc:0 "Lancé en 1958 comme une version améliorée du PGM-19A, le « Jupiter-C » a été développé avec un fuselage allongé afin de pouvoir accueillir plusieurs fusées à combustible solide. Bien qu'il ait été utilisé pour tester la rentrée atmosphérique des fusées usagées, il a été reconverti en missile balistique à portée intermédiaire (IRBM)."
 USA_irbm_equipment_4_short:0 "Juno I"
 USA_irbm_equipment_4_desc:0 "Développé à partir du Jupiter-C, le « Juno » (du nom de la reine des dieux romains) reprenait le modèle Jupiter-C et intégrait un quatrième étage, monté au sommet du « tube » du troisième étage, qui se déclençait après la combustion du troisième étage pour propulser la charge utile. Ce système a été intégré pour le lancement de satellites et a permis de mettre en orbite le premier satellite américain, « Explorer 1 ». En tant qu'ICBM, le quatrième étage inclus aurait augmenté la portée d'une charge utile nucléaire (qui aurait probablement été la même que celle du Jupiter précédent) à environ 2 000 km (ou ~1 250 mi)."
 USA_irbm_equipment_5:0 "PGM-19E Juno II"
 USA_irbm_equipment_5_short:0 "Juno II"
 USA_irbm_equipment_5_desc:0 "Le Juno II est une version améliorée du Juno I, mais contrairement à son prédécesseur, il s'inspire du modèle Jupiter-A, dont il utilise les fusées pour son premier étage. Pour ses deuxième, troisième et quatrième étages, il utilise une plate-forme de fusée dérivée du système de missile MGM-29 Redstone. Utilisé comme plate-forme de lancement pour les derniers satellites Explorer ainsi que pour Pioneer 4 (le premier satellite américain à avoir quitté l'orbite terrestre et la première sonde lunaire à avoir réussi), une version hypothétique en tant que missile balistique pourrait avoir une portée allant jusqu'à environ 2 500 km (environ 1 550 km)."
 USA_irbm_equipment_6:0 "MGM-31C Pershing II"
 USA_irbm_equipment_6_short:0 "Pershing II"
 USA_irbm_equipment_6_desc:0 "Entré en service en 1983, le MGM-31C a été développé pour remplacer les missiles Pershing I et Pershing Ia, d'où son nom « Pershing II » (Pershing tirant son nom de John J. Pershing, l'un des deux hommes ayant atteint le grade de « général des armées » ou général six étoiles). Il était équipé d'une ogive dont la puissance pouvait varier de 5 à 80 kilotonnes."
 USA_irbm_equipment_7:0 "MGM-31D Pershing III"
 USA_irbm_equipment_7_short:0 "Pershing III"
 USA_irbm_equipment_7_desc:0 "Développé dans le prolongement du système Pershing, le « Pershing III » était une version à quatre étages de 25 000 livres (11 000 kg) destinée à remplacer le LGM-118 Peacekeeper. En raison des limitations imposées par les traités de réduction des armes stratégiques, il devait être lancé à partir de lanceurs M1003 modifiés, la troisième modification pour le troisième type de missile « Pershing »."
 USA_irbm_equipment_8:0 "MGM-31E Pershing II Reduced Range"
 USA_irbm_equipment_8_short:0 "Pershing II RR"
 USA_irbm_equipment_8_desc:0 "Version modifiée du MGM-31C précédent, la variante « E » a été développée avec une portée réduite afin de se conformer au Traité sur les forces nucléaires à portée intermédiaire (INF). Comparé aux Pershing II et III, le Pershing à portée réduite aurait eu une portée opérationnelle d'environ 1 200 km (745 mi), soit moins que les 1 770 km (1 100 mi) du modèle original."
 USA_srbm_equipment_1:0 "Hermes B-1"
 USA_srbm_equipment_1_short:0 "Hermes"
 USA_srbm_equipment_1_desc:0 "Développé en réponse aux attaques à la roquette menées par l'Allemagne nazie en Europe, le Hermes a été conçu comme un projet pilote qui allait finalement devenir le précurseur du programme américain de missiles. Nommé d'après le dieu messager grec, le « Hermes » variante B était un missile de croisière à statoréacteur capable d'atteindre une vitesse de Mach 4. Il allait être désigné SSM-G-9 et SSM-A-9."
 USA_srbm_equipment_2:0 "MGM-5 Corporal"
 USA_srbm_equipment_2_short:0 "Corporal"
 USA_srbm_equipment_2_desc:0 "Le MGM-5 fut le premier missile guidé américain autorisé à transporter une ogive nucléaire. Missile balistique tactique, le « Corporal » était un missile balistique à courte portée d'une portée de 75 milles marins (140 km). En plus d'une ogive nucléaire (qui fut introduite plus tard dans sa carrière), il pouvait également être équipé d'une ogive conventionnelle à haut pouvoir explosif (HE)."
 USA_srbm_equipment_3:0 "PGM-11 Redstone"
 USA_srbm_equipment_3_short:0 "Redstone"
 USA_srbm_equipment_3_desc:0 "Le premier missile balistique opérationnel utilisé par l'armée américaine, le PGM-11 (initialement appelé SSM-G-14 en 1950, SSM-A-14 en 1951, puis M8 et M9 en 1955), était un descendant direct de la fusée V-2 nazie, développée par des ingénieurs allemands spécialisés dans les fusées et amenés aux États-Unis dans le cadre de l'opération Paperclip. Le « Redstone », nommé d'après l'arsenal éponyme de Huntsville, en Alabama, où il a été développé, était un missile à courte portée qui a servi à la défense active de l'Europe occidentale pendant la guerre froide. Il a également été le premier missile à être équipé d'une ogive nucléaire."
 USA_srbm_equipment_4:0 "MGM-18 Lacrosse"
 USA_srbm_equipment_4_short:0 "Lacrosse"
 USA_srbm_equipment_4_desc:0 "Arme balistique tactique à courte portée destinée à l'appui rapproché des troupes terrestres, le MGM-18 a été introduit en 1959 alors que le missile était encore en phase de développement. Bien qu'il puisse être équipé d'une ogive nucléaire HE ou de 1,5 à 10 kilotonnes, des problèmes de fiabilité et des difficultés avec le système de guidage, ainsi que sa vulnérabilité aux contre-mesures électroniques, ont conduit au retrait du « Lacrosse » quelques années plus tard."
 USA_srbm_equipment_5:0 "MGM-29 Sergeant"
 USA_srbm_equipment_5_short:0 "Sergeant"
 USA_srbm_equipment_5_desc:0 "Autre produit issu du Redstone Arsenal, le MGM-29 a été introduit en 1962 pour remplacer le MGM-5 Corporal. Surnommé « Sergeant », il fut le dernier missile de ce type à porter un nom inspiré du système de grades de l'armée américaine. Outre une ogive nucléaire de 200 kilotonnes, le MGM-29 peut également être équipé d'ogives hautement explosives, biologiques et chimiques."
 USA_srbm_equipment_6:0 "MGM-31A Pershing 1"
 USA_srbm_equipment_6_short:0 "Pershing 1"
 USA_srbm_equipment_6_desc:0 "Le MGM-31 fut le premier d'une longue série de missiles balistiques utilisés par l'armée américaine. Déployé en 1963, le MGM-31A fut développé pour succéder au missile Redstone et fut initialement baptisé « Redstone-S » avant d'être finalement appelé « Pershing I ». Il était équipé d'une ogive nucléaire de 60 à 400 kilotonnes."
 USA_srbm_equipment_7:0 "MGM-52 Lance"
 USA_srbm_equipment_7_short:0 "Lance"
 USA_srbm_equipment_7_desc:0 "Déployé en 1972, le MGM-52 était une version améliorée du MGM-29 Sergeant qu'il remplaçait, avec une précision et une mobilité accrues. Sa charge utile était soit l'ogive nucléaire W70 (d'une puissance de 1 à 100 kilotonnes), soit une ogive à charge creuse hautement explosive pour détruire les bunkers, soit l'ogive M251 avec des sous-munitions explosives pour le rôle de distributeur à distance. Avec des ogives aussi polyvalentes à sa disposition, le « Lance » est certain de pénétrer les défenses ennemies et d'ouvrir la voie à l'avancée des troupes."
 USA_srbm_equipment_8:0 "MGM-140A ATACMS Block I"
 USA_srbm_equipment_8_short:0 "ATACMS Block I"
 USA_srbm_equipment_8_desc:0 "Le MGM-140 (initialement M39) a été introduit en 1991 pour remplacer le MGM-52 Lance dans le rôle de missile balistique à courte portée conventionnel. Capable d'être lancé à partir du système M270 MLRS, le MGM-140A contient une ogive qui transporte jusqu'à 950 sous-munitions explosives d'une portée de 80 miles (128 km). Officiellement connu sous le nom d'ATACMS, abréviation de « Army TACtical Missile System » (système de missile tactique de l'armée)."
 USA_srbm_equipment_9:0 "MGM-164 ATACMS Block II"
 USA_srbm_equipment_9_short:0 "ATACMS Block II"
 USA_srbm_equipment_9_desc:0 "Initialement désigné M39A3, puis MGM-140C, le MGM-164 est la désignation de la deuxième génération de missiles ATACMS. Développé au cours de la seconde moitié des années 1990 et au début des années 2000, ce missile devait être équipé de sous-munitions antichars Brilliant, lui conférant une puissance meurtrière contre les chars de l'époque de la guerre froide utilisés après la fin de celle-ci."
 USA_icbm_equipment_1:0 "LGM-30A Minuteman I"
 USA_icbm_equipment_1_short:0 "Minuteman I"
 USA_icbm_equipment_1_desc:0 "Le LGM-30A (anciennement SM-80) a été introduit en 1962 dans le cadre de la dissuasion nucléaire, menaçant les Soviétiques d'une puissante riposte en cas d'attaque préalable contre les États-Unis. Cependant, grâce au missile Polaris de la marine, l'armée de l'air américaine a pu poursuivre le développement du missile et améliorer sa précision. Son surnom « Minuteman » lui a été donné parce que, tout comme l'infanterie légère éponyme de la guerre d'indépendance américaine, le missile était conçu pour être lancé à tout moment."
 USA_icbm_equipment_2:0 "LGM-30G Minuteman III"
 USA_icbm_equipment_2_short:0 "Minuteman III"
 USA_icbm_equipment_2_desc:0 "Le LGM-30G était le dernier développement de la plateforme ICBM Minuteman. Lors de son entrée en service en 1972, il s'agissait de la première plateforme de missiles à utiliser une ogive MIRV. Sa tête nucléaire était composée de trois ogives nucléaires W62, chacune d'une puissance de 170 kT, contre 1,2 MT pour son prédécesseur, le W56. En 2019, le « Minuteman III » est le seul ICBM terrestre actuellement en service aux États-Unis."
 USA_icbm_equipment_3:0 "LGM-70B Minuteman IV"
 USA_icbm_equipment_3_short:0 "Minuteman IV"
 USA_icbm_equipment_3_desc:0 "Le LGM-70B était une version améliorée des plateformes Minuteman II. Ces missiles ont été modifiés avec des émetteurs radio améliorés, issus du système de communication d'urgence par fusée (ERCS) utilisé sur les LEM-70A de conception similaire. Le missile serait à son tour utilisé comme fer de lance d'une première frappe ou d'une riposte, donnant l'ordre de passer à l'action aux autres unités du SAC pendant son vol, ce qui permettrait de lancer d'autres missiles en succession rapide."
 USA_icbm_equipment_4:0 "LGM-118A Peacekeeper"
 USA_icbm_equipment_4_short:0 "Peacekeeper"
 USA_icbm_equipment_4_desc:0 "Introduit en 1986 dans le cadre du projet « Star Wars » du président Reagan, le LGM-118A (également connu sous le nom de missile MX) a été développé pour permettre aux États-Unis de résister à une attaque surprise de la flotte de missiles balistiques intercontinentaux soviétiques, puis de lancer une contre-attaque. Il s'agissait d'un missile MIRV pouvant transporter 10 ogives nucléaires W87 de 300 kilotonnes dans son véhicule de rentrée. Cependant, en raison du traité START II (bien que les États-Unis n'aient jamais ratifié ledit traité) et du fait que le Minuteman pouvait déployer des ogives uniques à un coût bien moindre, le « Peacekeeper » a été retiré du service. Ses composants ont été utilisés par une entreprise privée pour développer un système de lancement civil à usage unique, le « Minotaur IV »."
 USA_icbm_equipment_5:0 "MGM-134 Midgetman"
 USA_icbm_equipment_5_short:0 "Midgetman"
 USA_icbm_equipment_5_desc:0 "Développé en 1991, à la fin de la guerre froide, le MGM-134 a été conçu pour répondre au besoin d'un petit missile balistique intercontinental pouvant être lancé à partir de véhicules routiers, face à la menace croissante des sous-marins soviétiques capables de lancer des missiles balistiques intercontinentaux depuis la côte et de priver les États-Unis de leur capacité de riposte. Équipé d'une ogive nucléaire de 475 kT, le « Midgetman » devait être lancé à partir d'un lanceur mobile robuste, capable de le protéger des radiations."
 USA_cruisemissile_equipment_0:0 "JB-2 Loon"
 USA_cruisemissile_equipment_0_short:0 "JB-2 Loon"
 USA_cruisemissile_equipment_0_desc:0 "Le JB-2 était une copie américaine de la bombe volante allemande V-1. Développé en 1944, il était initialement destiné à être utilisé lors de l'opération Downfall, l'invasion du Japon par les Alliés. Mais en raison de l'utilisation d'armes atomiques, le « Loon » n'a jamais été utilisé au combat. Malgré cela, le JB-2 allait jouer un rôle important dans le développement des systèmes de missiles tactiques sol-sol."
 USA_cruisemissile_equipment_1:0 "MGM-1 Matador"
 USA_cruisemissile_equipment_1_short:0 "MGM-1 Matador"
 USA_cruisemissile_equipment_1_desc:0 "Le MGM-1 (initialement SSM-A-1 en 1949, bombardier B-61 selon la désignation de l'armée de l'air américaine, et TM-61 en 1955) fut le premier missile de croisière développé aux États-Unis, mis en service en 1952. Bien que similaire dans son concept à son prédécesseur, le JB-2 Loon, et au V-1 allemand, il comprenait une commande radio qui permettait de corriger sa trajectoire en vol, ce qui lui conférait une précision supérieure à celle des missiles balistiques sur de plus longues distances. Il peut être équipé d'une ogive nucléaire d'une puissance comprise entre 1 et 120 kilotonnes, mais il existe également des variantes à ogive hautement explosive. Son surnom est « Matador »."
 USA_cruisemissile_equipment_2:0 "SM-62 Snark"
 USA_cruisemissile_equipment_2_short:0 "SM-62 Snark"
 USA_cruisemissile_equipment_2_desc:0 "Missile de croisière intercontinental, le SM-62 (initialement SSM-A-3 et B-62) était un missile à propulsion à réaction d'une portée de 5 500 milles marins (10 200 km), le missile de croisière à la plus longue portée jamais déployé par les États-Unis. Développé comme moyen de dissuasion provisoire pendant la mise au point des missiles balistiques intercontinentaux, le « Snark » (du nom d'un animal fictif dans « La Chasse au Snark » de Lewis Carroll) devait être retiré une fois les missiles balistiques intercontinentaux correctement déployés."
 USA_cruisemissile_equipment_3:0 "MGM-13 Mace"
 USA_cruisemissile_equipment_3_short:0 "MGM-13 Mace"
 USA_cruisemissile_equipment_3_desc:0 "Développé en 1956 pour améliorer et succéder au MGM-1, le MGM-13 (initialement appelé TM-76) pouvait atteindre des vitesses transsoniques avec une portée comprise entre 540 et 1 300 miles, en fonction de l'altitude du missile. Un système de cartographie radar était intégré à ses systèmes, permettant de corriger la trajectoire si le terrain ne correspondait pas au film du terrain à atteindre. Surnommé « Mace », le MGM-13 servirait de missile de dissuasion et de croisière jusqu'à son remplacement par le MGM-31 Pershing et le BGM-109 respectivement."
 USA_cruisemissile_equipment_4:0 "BGM-109G Gryphon"
 USA_cruisemissile_equipment_4_short:0 "BGM-109G Gryphon"
 USA_cruisemissile_equipment_4_desc:0 "Le BGM-109G a remplacé le missile Mace précédent et a été développé à partir du missile Tomahawk lancé depuis un navire. Introduit en 1983, le BGM-109G a été développé pour contrer le missile mobile SS-20 Saber utilisé par l'Union soviétique. Équipé d'une ogive nucléaire W84 à puissance variable (entre 0,2 et 150 kt), ce missile, associé à la gamme Pershing de missiles balistiques à portée intermédiaire (IRBM) et à courte portée (SRBM), a incité l'Union soviétique à signer le traité sur les forces nucléaires à portée intermédiaire (traité FNI). Bien qu'il soit également connu sous le nom de missile de croisière lancé au sol (GLCM), sa désignation officielle et son surnom sont BGM-109G « Gryphon »."
 USA_cruisemissile_equipment_5:0 "AGM-129 ACM"
 USA_cruisemissile_equipment_5_short:0 "ACM"
 USA_cruisemissile_equipment_5_desc:0 "Introduit en 1990, l'AGM-129 ACM (abréviation de Advanced Cruise Missile) était un missile de croisière à faible observabilité, lancé depuis les airs et transporté exclusivement par les bombardiers stratégiques B-52H Stratofortress de l'armée de l'air américaine. Il a été développé par crainte que l'AGM-86 ait des difficultés à pénétrer les futurs systèmes de défense aérienne. Bien qu'il soit capable de transporter une ogive nucléaire W80 (utilisée dans son prédécesseur, d'une puissance de 5 à 150 kt), la variante « C » de ce missile est équipée d'une ogive conventionnelle à haut pouvoir explosif."
 USA_cruisemissile_equipment_6:0 "AGM-158 JASSM"
 USA_cruisemissile_equipment_6_short:0 "JASSM"
 USA_cruisemissile_equipment_6_desc:0 "L'AGM-158 représente le summum de la technologie des missiles de croisière. Reprenant les caractéristiques de l'AGM-129, à savoir un missile à faible observabilité, à longue portée et lancé depuis les airs, l'AGM-158, introduit en 2009, peut être lancé à partir de divers avions de combat modernes, allant des chasseurs tels que le F-35 et le F-15E aux bombardiers tels que le B-52H et le B-1B. Désigné sous le nom de JASSM (Joint Air-to-Surface Standoff Missile), l'AGM-158 se distingue de la plupart des missiles de croisière en ce qu'il n'a pas de capacité nucléaire, étant strictement un missile de croisière à ogive conventionnelle."
 USA_coastalmissile_equipment_3:0 "BGM-84A Harpoon"
 USA_coastalmissile_equipment_3_short:0 "BGM-84A Harpoon"
 USA_coastalmissile_equipment_4:0 "BGM-84C Harpoon"
 USA_coastalmissile_equipment_4_short:0 "BGM-84C Harpoon"
 USA_coastalmissile_equipment_5:0 "BGM-109B TASM"
 USA_coastalmissile_equipment_5_short:0 "BGM-109B TASM"
 USA_naval_helicopter_equipment_1:0 "Piasecki HUP-2S Retriever"
 USA_naval_helicopter_equipment_1_short:0 "HUP-2S Retriever"
 USA_naval_helicopter_equipment_1_desc:0 "Version anti-sous-marine du HUP-2 équipée d'un sonar immergé. Le Piasecki HUP Retriever/H-25 Army Mule est un hélicoptère utilitaire compact à moteur radial unique et deux rotors tandem superposés, développé par la Piasecki Helicopter Corporation de Morton, en Pennsylvanie. Conçu selon les spécifications de la marine américaine, cet hélicoptère a été produit de 1949 à 1954 et a également été utilisé par l'armée américaine et des marines étrangères."
 USA_naval_helicopter_equipment_2:0 "Sikorsky HSS-1 Seabat"
 USA_naval_helicopter_equipment_2_short:0 "HSS-1 Seabat"
 USA_naval_helicopter_equipment_2_desc:0 "Le HSS est la variante anti-sous-marine du S-58 de Sikorsky, une version améliorée du S-55 (et du H-19 Chickasaw militaire). Il avait un nez plus petit, mais avec un fuselage arrière et un train d'atterrissage à roue arrière, plutôt que la configuration à queue haute et à quatre montants de son prédécesseur. Rebaptisé plus tard SH-34G, les variantes anti-sous-marines de cet hélicoptère ont reçu le surnom officiel de « Seabat »."
 USA_naval_helicopter_equipment_3:0 "Kaman SH-2D Seasprite"
 USA_naval_helicopter_equipment_3_short:0 "SH-2D Seasprite"
 USA_naval_helicopter_equipment_3_desc:0 "Introduit au début des années 1960 en remplacement du SH-34 Seabat, le SH-2 (initialement désigné HU2K) fut le premier hélicoptère anti-sous-marin capable d'être déployé sur des navires américains autres que des porte-avions. Cette portabilité prolongea la carrière du « Seasprite » et des variantes améliorées virent le jour. La variante représentée dans le jeu est la variante « D », la variante anti-sous-marine initiale."
 USA_naval_helicopter_equipment_4:0 "Sikorsky SH-3A Sea King"
 USA_naval_helicopter_equipment_4_short:0 "SH-3A Sea King"
 USA_naval_helicopter_equipment_4_desc:0 "Développé à partir du Sikorsky S-61 civil, le SH-3 (désignation d'origine HSS-2) est un hélicoptère ASW bimoteur. Il s'agissait du premier hélicoptère amphibie au monde, capable de décoller aussi bien de la terre que de la mer. Il était également, avec son contemporain le Seasprite, l'un des premiers hélicoptères ASW à utiliser des turbomoteurs. Outre ses missions ASM, le SH-3 a également été utilisé pour des missions de recherche et sauvetage (SAR), de transport, d'évacuation médicale et d'alerte aérienne avancée (AEW), plusieurs hélicoptères étant utilisés comme « Marine One », l'hélicoptère officiel de transport des présidents américains. C'est pour cette raison qu'il a été surnommé « Sea King », l'hélicoptère le plus polyvalent au monde."
 USA_naval_helicopter_equipment_5:0 "Sikorsky SH-60B Seahawk"
 USA_naval_helicopter_equipment_5_short:0 "SH-60B Seahawk"
 USA_naval_helicopter_equipment_5_desc:0 "Le SH-60 est la variante utilisée par la marine américaine de l'hélicoptère UH-60 Blackhawk de l'armée américaine (lui-même une variante militaire du Sikorsky S-70). Bien qu'il ait remplacé le Sea King, le SH-60 n'a pas de capacité d'atterrissage amphibie, mais il conserve la capacité du SH-2 d'atterrir sur n'importe quel navire américain capable d'accueillir des hélicoptères. Capable d'assumer bon nombre des mêmes rôles que le SH-3, le « Sea Hawk » représente l'avenir de l'aviation hélicoptère de la marine américaine."
 USA_naval_helicopter_equipment_6:0 "Sikorsky SH-60F Seahawk"
 USA_naval_helicopter_equipment_6_short:0 "SH-60F Seahawk"
 USA_naval_helicopter_equipment_6_desc:0 "Le SH-60F servait principalement d'appareil de lutte anti-sous-marine (ASW) au groupe aéronaval. L'hélicoptère traquait les sous-marins à l'aide de son sonar à immersion AQS-13F et était équipé d'un lanceur de bouées acoustiques à 6 tubes. Le SH-60F est officieusement baptisé « Oceanhawk ». Le SH-60F peut transporter des torpilles Mk 46, Mk 50 ou Mk 54 comme armes offensives, et dispose d'un choix de mitrailleuses montées sur le fuselage, notamment les M60D, M240D et GAU-16 (calibre .50) pour l'autodéfense."
 USA_naval_helicopter_equipment_7:0 "Sikorsky MH-60R Seahawk"
 USA_naval_helicopter_equipment_7_short:0 "MH-60R Seahawk"
 USA_naval_helicopter_equipment_7_desc:0 "Le MH-60R Seahawk est une version améliorée du SH-60 Seahawk. Développé en 1993, le MH-60R a été conçu pour combiner les caractéristiques des anciens SH-60B et SH-60F. Ses capteurs comprennent le pack ASE, le MTS-FLIR, le radar multimode/interrogateur IFF AN/APS-147, une liaison de données aérienne avancée et un sonar actif aérien plus perfectionné. Ces équipements, associés à un système d'armement amélioré (lui permettant de transporter la torpille avancée Mk 54 et les missiles AGM-114 Hellfire), confèrent au « Seahawk » une plus grande flexibilité dans les opérations anti-navales et d'assaut amphibie."
 USA_attack_helicopter_equipment_1:0 "Bell AH-1G Cobra"
 USA_attack_helicopter_equipment_1_short:0 "AH-1G Cobra"
 USA_attack_helicopter_equipment_1_desc:0 "Initialement introduit en 1966 comme hélicoptère d'attaque provisoire, l'AH-1 (développé avec une certaine compatibilité avec l'UH-1 Huey Iroquois) a été utilisé dans les mêmes rôles que ceux prévus pour l'AH-56 pendant son cycle de développement. Il a souvent été déployé dans des formations de chasseurs-tueurs, le rôle de « tueur » étant assuré par l'OH-6 Cayuse, tous deux ayant servi avec distinction pendant la guerre du Vietnam. Bien que son surnom officiel soit « Cobra », il existe d'autres surnoms, notamment « HueyCobra » et « Snake »."
 USA_attack_helicopter_equipment_2:0 "Bell AH-1S Cobra"
 USA_attack_helicopter_equipment_2_short:0 "AH-1S Cobra"
 USA_attack_helicopter_equipment_2_desc:0 "Le modèle de base AH-1S est un AH-1Q amélioré équipé d'un turbomoteur T53-L-703 de 1 800 ch (1 300 kW). L'AH-1S est équipé du sous-système de missiles M65 TOW/Cobra, d'un viseur télescopique M65 (TSU) et d'un viseur reflex M73."
 USA_attack_helicopter_equipment_3:0 "Hughes AH-64A Apache"
 USA_attack_helicopter_equipment_3_short:0 "AH-64A Apache"
 USA_attack_helicopter_equipment_3_desc:0 "Introduit en 1986 pour remplacer l'AH-1 dans l'armée américaine, l'AH-64 est l'un des hélicoptères d'attaque les plus connus au monde. Il est équipé d'une suite de capteurs montés à l'avant pour l'acquisition de cibles et de systèmes de vision nocturne. Son armement typique (et célèbre) comprend un canon Chain Gun de 30 mm situé entre le train d'atterrissage et quatre points d'emport sur les ailes pour une combinaison de roquettes Hydra et de missiles antichars AGM-114 Hellfire. Surnommé « Apache », l'AH-64 représente le summum de l'aviation hélicoptère."
 USA_attack_helicopter_equipment_4:0 "McDonnell Douglas AH-64D Apache Longbow"
 USA_attack_helicopter_equipment_4_short:0 "AH-64D Apache Longbow"
 USA_attack_helicopter_equipment_4_desc:0 "Fierté de l'armée américaine, outre sa superbe maniabilité, le radar Longbow fixé au-dessus du rotor principal améliore sa capacité à utiliser des missiles par tous les temps. Grâce à ce radar, il a été surnommé « Apache Longbow »."
 USA_attack_helicopter_equipment_5:0 "McDonnell Douglas AH-64E Apache Guardian"
 USA_attack_helicopter_equipment_5_short:0 "AH-64E Apache Guardian"
 USA_attack_helicopter_equipment_5_desc:0 "L'AH-64E offre une connectivité numérique améliorée, le système tactique interarmées de distribution d'informations (Joint Tactical Information Distribution System), des moteurs T700-GE-701D plus puissants avec une transmission à engrenages frontaux améliorée pour fournir plus de puissance, la capacité de contrôler des véhicules aériens sans pilote (UAV), une capacité IFR complète et un train d'atterrissage amélioré. Les nouvelles pales de rotor en composite, qui ont passé avec succès les essais en 2004, augmentent la vitesse de croisière, la vitesse ascensionnelle et la capacité d'emport."
 USA_scout_helicopter_equipment_1:0 "Hughes OH-6 Cayuse"
 USA_scout_helicopter_equipment_1_short:0 "OH-6 Cayuse"
 USA_scout_helicopter_equipment_1_desc:0 "Développé en 1960, l'OH-6 a été conçu dans le cadre du projet Light Observation Helicopter (LOH) à des fins d'observation, d'évacuation des blessés, de transport de personnel et d'attaque légère. Le modèle de Hughes a été retenu parmi onze autres modèles concurrents. Il a remplacé l'O-1 Bird Dog dans son rôle d'observation lorsque le ministère américain de la Défense a ordonné à l'armée américaine de transférer tous ses avions à voilure fixe à l'armée de l'air américaine. S'illustrant pendant la guerre du Vietnam, l'OH-6 avait démontré l'utilité des hélicoptères d'observation pour soutenir les hélicoptères d'attaque comme l'AH-1 ou les forces terrestres dans leurs combats contre l'ennemi. Officiellement connu sous le nom de « Cayuse » (d'après la tribu amérindienne du nord-ouest du Pacifique), les pilotes lui ont donné le surnom de « Loach » d'après le programme qui l'a vu naître."
 USA_scout_helicopter_equipment_2:0 "Bell OH-58A Kiowa"
 USA_scout_helicopter_equipment_2_short:0 "OH-58A Kiowa"
 USA_scout_helicopter_equipment_2_desc:0 "Lancé en 1969, au plus fort de la guerre du Vietnam, l'OH-58 était un hélicoptère à quatre places dont la particularité était que, bien qu'il disposait de deux pilotes, les commandes du siège gauche pouvaient être retirées pour permettre à un passager de prendre place à l'avant. Pendant la guerre du Vietnam, son armement se composait d'un seul minigun M134 ou d'un lance-grenades M129. Après la guerre, l'OH-58 a subi de nombreuses modifications, avec une mise à niveau du moteur (le mettant au niveau du dernier OH-58C), un système d'imagerie thermique, un ensemble de communications pour les forces de l'ordre, un équipement de navigation amélioré et un train d'atterrissage surélevé. Ces variantes améliorées du « Kiowa » (du nom d'une tribu amérindienne originaire du Montana et du Colorado) ont participé aux opérations antidrogue RAID de la Garde nationale de l'armée."
 USA_scout_helicopter_equipment_3:0 "Bell OH-58D Kiowa"
 USA_scout_helicopter_equipment_3_short:0 "OH-58D Kiowa"
 USA_scout_helicopter_equipment_3_desc:0 "La variante « D » améliorée du Kiowa était le résultat du programme d'amélioration des hélicoptères de l'armée (AHIP). Elle était dotée de caractéristiques telles qu'une transmission et un moteur améliorés pour les vols à très basse altitude, ainsi qu'une configuration unique à quatre pales du rotor principal qui la rendait beaucoup plus silencieuse que les autres hélicoptères, et plus encore que ses prédécesseurs. L'OH-58D a introduit le viseur monté sur mât (MMS) caractéristique au-dessus du système de rotor, ainsi qu'un cockpit en verre mixte, avec des instruments traditionnels identifiés comme « de secours » pour les situations d'urgence."
 USA_scout_helicopter_equipment_4:0 "MD Helicopters AH-6J Little Bird"
 USA_scout_helicopter_equipment_4_short:0 "AH-6J Little Bird"
 USA_scout_helicopter_equipment_4_desc:0 "Le MH-6 Little Bird (surnommé « Killer Egg ») et sa variante d'attaque, l'AH-6, sont des hélicoptères légers utilisés pour des opérations spéciales par l'armée américaine. Initialement basé sur un OH-6A modifié, il a ensuite été basé sur le MD 500E, avec un rotor principal à cinq pales. La version la plus récente, le MH-6M, est basée sur le MD 530F et dispose d'un rotor principal à six pales et d'un rotor de queue à quatre pales."
 USA_scout_helicopter_equipment_5:0 "Eurocopter UH-72 Lakota"
 USA_scout_helicopter_equipment_5_short:0 "UH-72 Lakota"
 USA_scout_helicopter_equipment_5_desc:0 "L'UH-72 est conçu pour accomplir toute une série de missions, allant du soutien général et de l'évacuation médicale (MEDEVAC) au sauvetage de personnel et aux opérations de lutte contre le trafic de stupéfiants. Il est prévu qu'il remplace les UH-1 et OH-58A/C, qui sont des hélicoptères utilitaires légers plus anciens, ainsi que d'autres types d'appareils utilisés au niveau national, principalement ceux de la Garde nationale de l'armée. L'UH-72 est acheté en tant que produit commercial prêt à l'emploi (COTS), ce qui simplifie le soutien logistique de la flotte."
 USA_utility_helicopter_equipment_1:0 "Sikorsky H-34 Choctaw"
 USA_utility_helicopter_equipment_1_short:0 "H-34 Choctaw"
 USA_utility_helicopter_equipment_1_desc:0 "Le Sikorsky H-34 (désignation de la société S-58, désignation de la marine HUS) est un hélicoptère militaire à moteur à pistons initialement conçu pour la lutte anti-sous-marine (ASW), mais qui a ensuite été réutilisé comme moyen de transport moyen. Il deviendra le dernier hélicoptère à moteur à pistons utilisé par le Corps des Marines des États-Unis, tous les hélicoptères utilisés depuis lors étant équipés de moteurs à turbine. Dans la marine (sous le nom d'UH-34), il est connu sous le nom de « Seahorse », tandis que les variantes de l'armée (sous le nom de CH-34) ont pris le nom de « Choctaw »."
 USA_utility_helicopter_equipment_2:0 "Bell UH-1A Iroquois"
 USA_utility_helicopter_equipment_2_short:0 "UH-1A Iroquois"
 USA_utility_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connus sous le nom de « Huey » (du nom de sa désignation d'origine avant 1962, HU-1), l'UH-1A est la variante militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agit du premier hélicoptère utilisé par l'armée américaine à être équipé d'un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication des États-Unis dans la guerre du Vietnam. Bien qu'il soit communément appelé « Huey », son surnom officiel est « Iroquois »."
 USA_utility_helicopter_equipment_3:0 "Bell UH-1D Iroquois"
 USA_utility_helicopter_equipment_3_short:0 "UH-1D Iroquois"
 USA_utility_helicopter_equipment_3_desc:0 "Lancé en 1963, l'UH-1D est la version militaire du Bell 205. Il a été conçu avec un fuselage allongé afin de pouvoir servir principalement comme hélicoptère de transport de troupes en remplacement du CH-34 Choctaw utilisé auparavant par l'armée américaine. 2 000 exemplaires de cette variante « Iroquois D » ont été construits, dont beaucoup ont été convertis à la norme UH-1H avec un moteur amélioré et plus puissant."
 USA_utility_helicopter_equipment_4:0 "Bell UH-1N Twin Huey"
 USA_utility_helicopter_equipment_4_short:0 "UH-1N Twin Huey"
 USA_utility_helicopter_equipment_4_desc:0 "Lancé en 1970, l'UH-1N était un autre membre de la grande famille des « Huey », développé cette fois à partir de l'UH-1H. Contrairement aux UH-1A et UH-1D, c'est la variante « N » qui allait donner naissance à sa version civile, le Bell 212. Le rotor principal est alimenté par deux turbomoteurs qui entraînent un seul arbre de sortie. En cas de panne d'un moteur, le moteur restant peut fournir 671 kW (900 ch) pendant 30 minutes ou 571 kW (765 ch), ce qui permet à l'UH-1N de maintenir ses performances de croisière à son poids maximal. C'était également l'une des rares variantes « Iroquois » à ne pas être utilisée par l'armée américaine, mais plutôt par les Marines. Sa configuration bimoteur lui a valu le surnom informel de « Twin Huey »."
 USA_utility_helicopter_equipment_5:0 "Sikorsky UH-60A Black Hawk"
 USA_utility_helicopter_equipment_5_short:0 "UH-60A Black Hawk"
 USA_utility_helicopter_equipment_5_desc:0 "Entré en service en 1979, l'UH-60A a succédé à l'UH-1 en tant qu'hélicoptère utilitaire de l'armée américaine. Développé à partir du modèle civil S-70, l'UH-60A pouvait transporter jusqu'à 15 personnes (4 membres d'équipage et jusqu'à 11 soldats équipés). Nommé d'après un chef tribal amérindien Sauk, le « Blackhawk » a servi au combat lors de conflits à la Grenade, au Panama, en Irak, en Somalie, dans les Balkans, en Afghanistan et dans d'autres régions du Moyen-Orient."
 USA_utility_helicopter_equipment_6:0 "Sikorsky UH-60L Black Hawk"
 USA_utility_helicopter_equipment_6_short:0 "UH-60L Black Hawk"
 USA_utility_helicopter_equipment_6_desc:0 "Version améliorée de l'UH-60A, la variante « L » du « Blackhawk » est équipée de moteurs plus puissants, d'une boîte de vitesses plus résistante et d'un système de commande de vol modernisé. Lancé en 1990, l'UH-60L est la principale variante utilitaire du H-60 actuellement en service dans l'armée américaine. Il est également envisagé pour remplacer l'UH-1N dans l'armée de l'air américaine."
 USA_utility_helicopter_equipment_7:0 "Sikorsky UH-60M Black Hawk"
 USA_utility_helicopter_equipment_7_short:0 "UH-60M Black Hawk"
 USA_utility_helicopter_equipment_7_desc:0 "Pales de rotor à corde large de conception améliorée, moteurs T700-GE-701D (puissance maximale de 2 000 ch ou 1 500 kW chacun), boîte de vitesses à durabilité améliorée, ordinateur intégré IVHMS (Integrated Vehicle Health Management System) et nouveau cockpit en verre."
 USA_cargo_helicopter_equipment_1:0 "Boeing CH-47A Chinook"
 USA_cargo_helicopter_equipment_1_short:0 "CH-47A Chinook"
 USA_cargo_helicopter_equipment_1_desc:0 "Le CH-47 (à l'origine HC-1B) est un hélicoptère bimoteur à double rotor qui figure parmi les hélicoptères de transport les plus lourds de l'Occident. Remplaçant le CH-37 Mojave, le CH-47 dispose de plusieurs moyens pour charger diverses marchandises, notamment plusieurs portes sur le fuselage, une large rampe de chargement située à l'arrière du fuselage et un total de trois crochets de chargement ventraux externes pour transporter des charges suspendues. Il était également l'hélicoptère le plus rapide de son époque lors de son lancement en 1962, et il est toujours considéré comme l'un des hélicoptères les plus rapides de l'arsenal actuel de l'armée américaine. Son nom, « Chinook », vient du peuple amérindien Chinook de l'État actuel de Washington."
 USA_cargo_helicopter_equipment_2:0 "Sikorsky CH-53A Sea Stallion"
 USA_cargo_helicopter_equipment_2_short:0 "CH-53A Sea Stallion"
 USA_cargo_helicopter_equipment_2_desc:0 "Le CH-47 (à l'origine HC-1B) est un hélicoptère bimoteur à double rotor qui figure parmi les hélicoptères de transport les plus lourds de l'Occident. Remplaçant le CH-37 Mojave, le CH-47 dispose de plusieurs moyens pour charger diverses marchandises, notamment plusieurs portes sur le fuselage, une large rampe de chargement située à l'arrière du fuselage et un total de trois crochets de chargement ventraux externes pour transporter des charges suspendues. Il était également l'hélicoptère le plus rapide de son époque lors de son lancement en 1962, et il est toujours considéré comme l'un des hélicoptères les plus rapides de l'arsenal actuel de l'armée américaine. Son nom, « Chinook », vient du peuple amérindien Chinook de l'État actuel de Washington."
 USA_cargo_helicopter_equipment_3:0 "Boeing CH-47D Chinook"
 USA_cargo_helicopter_equipment_3_short:0 "CH-47D Chinook"
 USA_cargo_helicopter_equipment_3_desc:0 "Le CH-47D partage la même cellule que les modèles précédents, la principale différence étant l'adoption de moteurs plus puissants. Les premiers CH-47D étaient à l'origine équipés de deux moteurs T55-L-712, mais le moteur le plus courant est le T55-GA-714A, plus récent. Grâce à son système de chargement à triple crochet, le CH-47D peut transporter des charges lourdes à l'intérieur et jusqu'à 12 000 kg (26 000 lb) à l'extérieur (par exemple des conteneurs de 40 pieds ou 12 mètres). Il a été mis en service pour la première fois en 1979. Dans les opérations d'assaut aérien, il sert souvent de principal moyen de transport pour l'obusier M198 de 155 mm, accompagné de 30 cartouches de munitions et d'un équipage de 11 hommes."
 USA_cargo_helicopter_equipment_4:0 "Sikorsky CH-53E Super Stallion"
 USA_cargo_helicopter_equipment_4_short:0 "CH-53E Super Stallion"
 USA_cargo_helicopter_equipment_4_desc:0 "En octobre 1967, le Corps des Marines des États-Unis a émis une demande pour un hélicoptère doté d'une capacité de levage 1,8 fois supérieure à celle du CH-53D et pouvant être embarqué sur des navires de guerre amphibies. À cette époque, la Marine et l'Armée de terre américaines recherchaient également des hélicoptères similaires. Avant la publication de cette demande, Sikorsky travaillait déjà à l'amélioration du CH-53D, sous la désignation « S-80 », avec un troisième turbomoteur et un système de rotor plus puissant. Sikorsky a proposé le modèle S-80 aux Marines en 1968. Les Marines ont apprécié l'idée, car elle promettait d'apporter rapidement une bonne solution, et ont financé le développement d'un hélicoptère d'essai à des fins d'évaluation. Le contrat de production initial a été attribué en 1978, et la mise en service a suivi en février 1981."
 USA_cargo_helicopter_equipment_5:0 "Boeing CH-47D Chinook Block II"
 USA_cargo_helicopter_equipment_5_short:0 "CH-47D Block II"
 USA_cargo_helicopter_equipment_5_desc:0 "CH-47D modernisé avec une avionique avancée, des instruments GPS et une amélioration de la capacité de survie. Presque tous les anciens Chinook ont été mis à niveau selon cette norme."
 USA_cargo_helicopter_equipment_6:0 "Boeing CH-47F Chinook"
 USA_cargo_helicopter_equipment_6_short:0 "CH-47F Chinook"
 USA_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, une version améliorée du CH-47D, a effectué son vol inaugural ; le premier modèle de série a été présenté le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les améliorations comprennent des moteurs Honeywell de 4 868 chevaux-vapeur (3 630 kW) et une cellule plus robuste, construite d'une seule pièce afin de réduire les besoins d'entretien. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion afin d'augmenter la durée de vie."
 SOV_fighter_equipment_0:0 "Voyenno-Vozdushnyye Sily"
 SOV_fighter_equipment_0_short:0 "VVS"
 SOV_fighter_equipment_0_desc:0 "Les forces aériennes soviétiques étaient l'une des forces aériennes de l'Union soviétique. L'autre était les forces de défense aérienne soviétiques. Les forces aériennes ont été formées à partir de composantes du service aérien impérial russe en 1917 et ont été confrontées à leur plus grande épreuve pendant la Seconde Guerre mondiale. Les groupes ont également participé à la guerre de Corée et ont été dissous en même temps que l'Union soviétique elle-même en 1991-1992. Les anciens actifs des forces aériennes soviétiques ont ensuite été répartis entre plusieurs forces aériennes des anciennes républiques soviétiques, dont la nouvelle armée de l'air russe. « La Marche des pilotes » était leur hymne."
 SOV_fighter_equipment_1:0 "Yakolev Yak-3"
 SOV_fighter_equipment_1_short:0 "Yak-3"
 SOV_fighter_equipment_1_desc:0 "Le Yakovlev Yak-3 était un chasseur soviétique monomoteur et monoplace de la Seconde Guerre mondiale. Robuste et facile à entretenir, il était très apprécié tant par les pilotes que par le personnel au sol. L'un des chasseurs les plus petits et les plus légers utilisés par les belligérants pendant la guerre, son rapport puissance/poids élevé lui conférait d'excellentes performances et il s'est révélé être un redoutable chasseur à courte portée."
 SOV_fighter_equipment_2:0 "Lavochkin La-7"
 SOV_fighter_equipment_2_short:0 "La-7"
 SOV_fighter_equipment_2_desc:0 "Le Lavochkin La-7 était un avion de chasse soviétique monoplace à moteur à pistons développé pendant la Seconde Guerre mondiale par le bureau d'études Lavochkin. Il s'agissait d'une version améliorée du Lavochkin La-5, et du dernier modèle d'une famille d'avions qui avait débuté avec le LaGG-1 en 1938."
 SOV_fighter_equipment_3:0 "Lavochkin La-9"
 SOV_fighter_equipment_3_short:0 "La-9"
 SOV_fighter_equipment_3_desc:0 "Le La-9 représente une évolution du prototype Lavochkin La-126. Le premier prototype, baptisé La-130, fut achevé en 1946. Sa ressemblance avec le célèbre Lavochkin La-7 n'était que superficielle : le nouveau chasseur était entièrement construit en métal et doté d'une aile à écoulement laminaire. La réduction du poids due à l'élimination du bois de la cellule permit d'augmenter considérablement la capacité en carburant et d'armer l'appareil de quatre canons. Des simulations de combat ont démontré que le La-130 était à égalité avec le La-7, mais inférieur au Yakovlev Yak-3 dans les plans horizontaux. Le nouveau chasseur, officiellement désigné La-9, est entré en production en août 1946. Au total, 1 559 appareils ont été construits jusqu'à la fin de la production en 1948."
 SOV_jet_multirole_equipment_1:0 "Mikoyan-Gurevich MiG-9"
 SOV_jet_multirole_equipment_1_desc:0 "Le MiG-9 Fargo fut le premier avion à réaction conçu par Mikoyan après la Seconde Guerre mondiale. Introduit en 1948, il fut utilisé de manière limitée au combat et à l'entraînement pendant la guerre civile chinoise et la guerre de Corée. Au total, 610 appareils furent produits, exclusivement par l'URSS. Les derniers MiG 9 furent retirés du service par la République populaire de Chine en 1951."
 SOV_jet_multirole_equipment_1_short:0 "MiG-9"
 SOV_jet_multirole_equipment_2:0 "Mikoyan-Gurevich MiG-15"
 SOV_jet_multirole_equipment_2_desc:0 "Sans doute l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a participé à de nombreux conflits depuis son introduction pendant la guerre de Corée, où il s'est révélé être un adversaire redoutable pour les F-86 Sabre et F9F Panther américains. Une partie de la frontière entre la Corée et la Chine a été surnommée « MiG Alley » en raison de leur omniprésence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Si la plupart des appareils ont été mis hors service dans les années 1950, certains sont encore en service dans l'armée de l'air nord-coréenne."
 SOV_jet_multirole_equipment_2_short:0 "MiG-15"
 SOV_jet_multirole_equipment_3:0 "Mikoyan-Gurevich MiG-17"
 SOV_jet_multirole_equipment_3_desc:0 "Successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence dans l'armée de l'air chinoise sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, en Afrique, en Europe et en Asie. Son premier déploiement au combat a eu lieu en 1958, lorsque des MiG de la République populaire de Chine ont affronté des F-86 Sabre chinois nationalistes au-dessus du détroit de Taiwan. Cependant, le MiG-17 a principalement été utilisé pendant la guerre du Vietnam par la NVAF et la PLAAF, où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même tenu tête aux chasseurs américains Phantom II, beaucoup plus modernes et supersoniques, pendant la guerre du Vietnam. Le MiG-17 a été généralement retiré du service dans les années 1970, mais il reste encore en service de manière limitée dans certains pays africains et en Corée du Nord."
 SOV_jet_multirole_equipment_3_short:0 "MiG-17"
 SOV_jet_multirole_equipment_4:0 "Mikoyan-Gurevich MiG-19"
 SOV_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de fabrication soviétique capable d'atteindre une vitesse supersonique en vol horizontal. Son équivalent américain dans la « série Century » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les McDonnell Douglas F-4 Phantom II et Republic F-105 Thunderchief, plus modernes, au-dessus du Nord-Vietnam."
 SOV_jet_multirole_equipment_4_short:0 "MiG-19"
 SOV_jet_multirole_equipment_5:0 "Mikoyan-Gurevich MiG-21F-13"
 SOV_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, équipé de missiles à portée au-delà du champ visuel et d'un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, notamment en Chine et en Inde où il a été construit en grand nombre sous licence. Plus de 11 000 exemplaires ont été construits, servant dans plus de 60 pays sur les 5 continents. Au cours de sa durée de vie, le MiG-21 a abattu 240 avions ennemis. Le MiG-21 a été utilisé dans de nombreux conflits, notamment au Vietnam (où il a remporté un énorme succès), lors de la guerre indo-pakistanaise de 1971, lors de la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il est toujours en service après plus de six décennies."
 SOV_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 SOV_jet_multirole_equipment_6:0 "Mikoyan-Gurevich MiG-21PF"
 SOV_jet_multirole_equipment_6_desc:0 "Version de série de l'intercepteur tout temps. Ces appareils étaient équipés du turboréacteur R11F2-300 et, à partir du septième lot de production, du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T, également appelé RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 afin de permettre l'utilisation du missile air-air à guidage laser RS-2US (alias K-5MS) en plus du missile à guidage infrarouge K-13."
 SOV_jet_multirole_equipment_6_short:0 "MiG-21PF"
 SOV_jet_multirole_equipment_7:0 "Mikoyan-Gurevich MiG-23M"
 SOV_jet_multirole_equipment_7_desc:0 "Le MiG-23 a été le premier chasseur soviétique à être équipé d'un radar à balayage vers le bas et à tirer vers le bas, et l'un des premiers à être armé de missiles à portée au-delà du champ visuel. Sa production a débuté en 1969 et a atteint des chiffres importants avec plus de 5 000 appareils construits, ce qui en fait l'avion à ailes à géométrie variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service de manière limitée chez certains clients à l'exportation."
 SOV_jet_multirole_equipment_7_short:0 "MiG-23M"
 SOV_jet_multirole_equipment_8:0 "Mikoyan-Gurevich MiG-23ML"
 SOV_jet_multirole_equipment_8_desc:0 "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment en termes de résistance et de fiabilité de la cellule, de performances du moteur, de maniabilité et de performances radar. Une refonte considérable de la cellule a été effectuée, donnant naissance au MiG-23ML."
 SOV_jet_multirole_equipment_8_short:0 "MiG-23ML"
 SOV_jet_multirole_equipment_9:0 "Mikoyan-Gurevich MiG-23MLD"
 SOV_jet_multirole_equipment_9_desc:0 "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de cette mise à niveau était d'améliorer la maniabilité, en particulier lors d'angles d'attaque élevés, qui étaient considérés comme le principal défaut du MiG-23M/ML. La perche pitot était équipée de générateurs de tourbillons, et les bords d'attaque dentelés des ailes étaient également conçus pour agir comme des générateurs de tourbillons. Le système de commande de vol intégrait le dispositif de butée synthétique SOS-3-4 et le limiteur de signaux."
 SOV_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 SOV_jet_multirole_equipment_10:0 "Mikoyan-Gurevich MiG-29A"
 SOV_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le bureau d'études Mikoyan. Il s'agit du premier chasseur de quatrième génération à avoir été mis en service par l'URSS et le bloc de l'Est. Il intègre une avionique améliorée et des capacités radar considérablement renforcées. Les premiers MiG-29 ont été utilisés comme avions d'entraînement par le Pacte de Varsovie, avec des exportations limitées vers l'Inde, mais leur utilisation au combat était restreinte. Le MiG-29 allait plus tard servir de base à des variantes largement produites, telles que le MiG-29S, le MiG-29M et le MiG-35."
 SOV_jet_multirole_equipment_10_short:0 "MiG-29A"
 SOV_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29M"
 SOV_mr_stealth_fighter_equipment_1_short:0 "MiG-29M"
 SOV_mr_stealth_fighter_equipment_1_desc:0 "L'avion MiG-29M/M2 est une version révisée du MiG-29 de base. Il offre une capacité multirôle plus robuste grâce à une utilisation améliorée des armes air-air et air-sol de haute précision. Il dispose également d'une autonomie de combat considérablement accrue, grâce à une augmentation de sa capacité interne en carburant. Quelques modifications ont été apportées au cours du développement de l'avion. La cellule redessinée a été construite à partir d'un alliage léger d'aluminium et de lithium afin d'augmenter le rapport poussée/poids. La géométrie des rampes d'admission d'air a été revue, les persiennes d'admission supérieures ont été supprimées afin de laisser place à davantage de carburant dans les LERX, des grilles ont été installées pour empêcher les dommages causés par des objets étrangers (FOD) et les dimensions des entrées ont été agrandies pour permettre un débit d'air plus important."
 SOV_jet_light_equipment_1:0 "Mikoyan-Gurevich MiG-9UTI"
 SOV_jet_light_equipment_1_short:0 "MiG-9UTI"
 SOV_jet_light_equipment_1_desc:0 "Afin d'assurer la préparation du personnel navigant de l'unité de combat des avions de chasse de l'armée de l'air, l'équipe OKB-155, dirigée par A.I. Mikoyan, a été chargée de développer une version biplace de l'avion MiG-9. Les travaux sur une nouvelle version du MiG-9 ont commencé en juillet 1946 à l'OKB-155. La conception préliminaire du « jumeau » était prête à la fin du mois d'octobre et, conformément au calendrier de conception et de construction de l'avion approuvé par Mikoyan le 26 août, le premier prototype a été présenté à l'aérodrome le 20 décembre 1946."
 SOV_jet_light_equipment_2:0 "Mikoyan-Gurevich MiG-15UTI"
 SOV_jet_light_equipment_2_short:0 "MiG-15UTI"
 SOV_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 s'est vu officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n° 1 entre mars et mai 1949. La cabine de l'instructeur sur le MiG-15UTI a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement comprenait un canon NR-23 de 23 mm avec 80 cartouches et une mitrailleuse UBK-E avec 150 cartouches."
 SOV_jet_light_equipment_3:0 "L-29 Delfin"
 SOV_jet_light_equipment_3_short:0 "L-29 Delfin"
 SOV_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín est un avion d'entraînement militaire à réaction développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Au cours du programme, plus de 3 000 avions d'entraînement L-29 Delfin ont été produits. Parmi ceux-ci, environ 2 000 auraient été livrés à l'Union soviétique, où ils ont été utilisés comme avions d'entraînement standard pour l'armée de l'air soviétique."
 SOV_jet_light_equipment_4:0 "Aero L-39 Albatros"
 SOV_jet_light_equipment_4_short:0 "L-39 Albatros"
 SOV_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme principal avion d'entraînement. Il a été le premier avion d'entraînement à être équipé d'un turboréacteur à double flux. Ce modèle a été exporté vers de nombreux pays en tant qu'avion d'entraînement militaire."
 SOV_jet_light_equipment_5:0 "Aero L-39ZA Albatros"
 SOV_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 SOV_jet_light_equipment_5_desc:0 "L-39 considérablement amélioré pour l'entraînement au combat et les attaques légères, équipé d'un train d'atterrissage plus robuste, d'une charge utile plus importante et, surtout, d'un canon double GSh-23L de 23 millimètres fixé dans un pod conforme sous le cockpit, avec un chargeur de 150 cartouches dans le fuselage."
 SOV_recon_equipment_0:0 "Tupolev Tu-2R"
 SOV_recon_equipment_0_short:0 "Tu-2R"
 SOV_recon_equipment_0_desc:0 "Version de reconnaissance du Tu-2."
 SOV_jet_recon_equipment_0:0 "Mikoyan-Gurevich MiG-15Rbis"
 SOV_jet_recon_equipment_0_short:0 "MiG-15Rbis"
 SOV_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, l'OKB MiG a commencé à développer une variante de reconnaissance de première ligne du MiG-15 équipée d'une caméra AFA-BA/40, qui offre une largeur de balayage de 0,9 à 4,5 km avec une longueur de parcours photographique de 90 à 450 km à des altitudes comprises entre 2 000 et 10 000 m. Un seul canon NR-23 était installé sur l'avion. Afin d'augmenter l'autonomie du reconnaissance, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur « Barium-M » et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur l'appareil."
 SOV_jet_recon_equipment_1:0 "Mikoyan-Gurevich MiG-25RB"
 SOV_jet_recon_equipment_1_short:0 "MiG-25RB"
 SOV_jet_recon_equipment_1_desc:0 "MiG-25RB - avion de reconnaissance opérationnel monoplace toutes altitudes - bombardier. Les essais ont été achevés en décembre 1970. L'avion était équipé de 2 à 4 caméras de reconnaissance générale A-70M et d'une caméra topographique AFA-E/10. L'équipement photographique était logé dans cinq compartiments situés au bas du fuselage avant. Une station SIGINT appelée SPS-4A ou B « Virage » a également été installée, fonctionnant dans différentes gammes de fréquences. Équipement spécial - station de brouillage radio actif SPS-141."
 SOV_jet_recon_equipment_2:0 "Sukhoi Su-24MR"
 SOV_jet_recon_equipment_2_short:0 "Su-24MR"
 SOV_jet_recon_equipment_2_desc:0 "Variante dédiée à la reconnaissance tactique. Le Su-24MR conserve une grande partie de la suite de navigation du Su-24M, y compris le radar de suivi du terrain, mais supprime le radar d'attaque Orion-A, le système laser/TV et le canon au profit de deux installations de caméras panoramiques, caméra TV « Aist-M » (« Cigogne »), radar aéroporté à balayage latéral (SLAR) RDS-BO « Shtik » (« Baïonnette ») et système de reconnaissance infrarouge « Zima » (« Hiver »). D'autres capteurs sont transportés sous forme de nacelles."
 SOV_heavy_fighter_equipment_1:0 "Yakovlev Yak-9"
 SOV_heavy_fighter_equipment_1_short:0 "Yak-9"
 SOV_heavy_fighter_equipment_1_desc:0 "Le Yak-9 avait un fuselage arrière raccourci et une verrière offrant une vision panoramique. Sa structure métallique plus légère permettait d'augmenter la charge de carburant et l'armement par rapport aux modèles précédents construits en bois. Le Yak-9 était maniable à grande vitesse à basse et moyenne altitude et facile à contrôler, ce qui en a fait l'un des chasseurs soviétiques les plus produits pendant la Seconde Guerre mondiale."
 SOV_heavy_fighter_equipment_2:0 "Petlyakov Pe-3"
 SOV_heavy_fighter_equipment_2_short:0 "Pe-3"
 SOV_heavy_fighter_equipment_2_desc:0 "Évolution du Pe-2, le Pe-3 était un avion de chasse nocturne dédié lorsqu'il a été introduit en 1941, la même année que son homologue, le Pe-2. Sa conception et son utilisation ont suivi une voie comparable à celle empruntée par la Luftwaffe allemande avec le Junkers Ju 88 et la Royal Air Force britannique avec le De Havilland Mosquito. Utilisé avec distinction pendant la bataille de Moscou, et malgré l'évacuation de la seule usine chargée de sa construction à la suite de la bataille, le Pe-3 fut utilisé tout au long du conflit, les séries de production ultérieures étant consacrées à la construction de variantes de reconnaissance de ce type."
 SOV_heavy_fighter_equipment_3:0 "Lavochkin La-11"
 SOV_heavy_fighter_equipment_3_short:0 "La-11"
 SOV_heavy_fighter_equipment_3_desc:0 "Développé en 1947, après la fin de la Seconde Guerre mondiale, le La-11 était une version améliorée du La-9 « Fritz » destinée à servir d'avion d'escorte à longue portée. L'avion était équipé de pneus plus larges pour supporter son poids accru et de commodités pour les longs vols, telles que des sièges mieux rembourrés, des accoudoirs et un urinoir. De plus, un équipement complet de navigation radio a été installé. Sans surprise, les performances au combat avec un plein de carburant en ont souffert. Cependant, à mesure que la charge de carburant se rapprochait de celle du La-9, les performances s'amélioraient. Les pilotes du La-11 au service de l'Union soviétique, puis de la Chine, ont servi dans la défense aérienne, abattant des Mustang et des avions d'attaque de fabrication américaine pendant la guerre de Corée. Son nom de code OTAN est Fang."
 SOV_jet_interceptor_equipment_1:0 "Yakovlev Yak-17"
 SOV_jet_interceptor_equipment_1_desc:0 "Le Yak-17 fut présenté pour la première fois au public lors de la Journée de l'aviation soviétique de 1949, à l'aérodrome de Tushino. En service, le Yak-17 présentait la plupart des défauts de son prédécesseur, notamment une vitesse et un rayon d'action relativement faibles, ainsi qu'un moteur peu fiable (toujours basé sur le Junkers Jumo 004 allemand) avec une procédure de démarrage compliquée. En revanche, son pilotage était très simple et similaire à celui des chasseurs à hélice populaires tels que le Yak-3 et le Yak-9. Cela en faisait un excellent appareil de transition vers les chasseurs à réaction."
 SOV_jet_interceptor_equipment_1_short:0 "Yak-17"
 SOV_jet_interceptor_equipment_2:0 "Lavochkin La-15"
 SOV_jet_interceptor_equipment_2_desc:0 "Le Lavochkin La-15 Fantail a été introduit dans l'armée de l'air soviétique en 1949. Bien que cet avion fût technologiquement supérieur au MiG-15, le coût de fabrication inférieur de ce dernier lui a valu d'être préféré. L'avion n'a jamais été utilisé au combat et n'a connu qu'un déploiement limité. Les 235 appareils fabriqués ont été mis hors service en 1953. Ils ont été dépouillés de leurs moteurs et utilisés pour des essais d'armes nucléaires."
 SOV_jet_interceptor_equipment_2_short:0 "La-15"
 SOV_jet_interceptor_equipment_3:0 "Mikoyan-Gurevich MiG-17PF"
 SOV_jet_interceptor_equipment_3_desc:0 "Version intercepteur tout temps équipée d'un radar Izumrud, de 3 canons NR-23 de 23 mm et d'un moteur VK-1F."
 SOV_jet_interceptor_equipment_3_short:0 "MiG-17PF"
 SOV_jet_interceptor_equipment_4:0 "Sukhoi Su-9"
 SOV_jet_interceptor_equipment_4_desc:0 "Le Sukhoi Su-9 Fishpot était un intercepteur soviétique tout temps à ailes delta développé dans les années 1950. Le Su-9 effectua son premier vol complet le 24 juin 1956 et entra en service trois ans plus tard, en 1959. L'avion était exclusivement exploité par le 894e régiment d'aviation de chasse de l'armée de l'air soviétique et ne fut jamais utilisé au combat. Le dernier des 1 150 appareils fabriqués quitta le service en 1979."
 SOV_jet_interceptor_equipment_4_short:0 "Su-9"
 SOV_jet_interceptor_equipment_5:0 "Sukhoi Su-11"
 SOV_jet_interceptor_equipment_5_desc:0 "Le Su-11 était une version améliorée de l'intercepteur Sukhoi Su-9 (« Fishpot »), qui avait été développé en parallèle avec le chasseur-bombardier à ailes en flèche Su-7 de l'OKB. Conscient des limites fondamentales du Su-9, Sukhoi commença à travailler sur le Su-11."
 SOV_jet_interceptor_equipment_5_short:0 "Su-11"
 SOV_jet_interceptor_equipment_6:0 "Sukhoi Su-15"
 SOV_jet_interceptor_equipment_6_desc:0 "Le Sukhoi Su-15 Flagon A était un intercepteur biréacteur développé par l'Union soviétique dans les années 1960. L'avion a effectué son premier vol au milieu de l'année 1962 et, trois ans plus tard, il est entré en service dans l'armée de l'air soviétique en 1965. Entre 1965 et 1979, 1 290 appareils ont été produits. L'avion a également été utilisé par l'armée de l'air ukrainienne et, de manière limitée, par l'armée de l'air russe en cas d'urgence. Il a été officiellement retiré du service en 1996."
 SOV_jet_interceptor_equipment_6_short:0 "Su-15"
 SOV_jet_interceptor_equipment_7:0 "Mikoyan-Gurevich MiG-25P"
 SOV_jet_interceptor_equipment_7_desc:0 "Le Mikoyan-Gurevich MiG-25 Foxbat est peut-être l'un des avions soviétiques les plus influents de l'histoire. Le premier prototype du MiG-25 a pris son envol au début de l'année 1964 et est officiellement entré en service en 1970. Au cours de sa durée de vie, plus de 1 150 appareils ont été construits et vendus à de nombreux pays, dont la Syrie, l'Irak et l'Inde. Cet avion a été conçu pour intercepter rapidement et à une vitesse fulgurante des avions volant à très haute altitude, tels que les U-2 et les B-58. Il a permis à l'Union soviétique d'exercer un contrôle sans précédent sur son propre espace aérien lointain. Il est encore aujourd'hui en service limité dans l'armée de l'air russe."
 SOV_jet_interceptor_equipment_7_short:0 "MiG-25P"
 SOV_jet_interceptor_equipment_8:0 "Mikoyan-Gurevich MiG-31"
 SOV_jet_interceptor_equipment_8_desc:0 "Le MiG-31 Foxhound est le successeur direct du MiG-25 et a été conçu pour le remplacer intégralement. L'avion partage la plupart des éléments de conception du MiG-25, avec principalement des modifications internes. Le MiG-31 dispose de deux sièges, de capteurs et de moteurs supérieurs. Le cockpit a également été modernisé pour prendre en charge un affichage tête haute et de nouveaux systèmes de missiles air-air. Entre 1975 et 1994, 519 MiG-31 ont été produits. Il est toujours en service dans l'armée de l'air russe et l'armée de l'air kazakhe. C'est l'un des avions de combat les plus rapides actuellement en service."
 SOV_jet_interceptor_equipment_8_short:0 "MiG-31"
 SOV_jet_interceptor_equipment_9:0 "Sukhoi Su-27S"
 SOV_jet_interceptor_equipment_9_desc:0 "Le Su-27S Flanker B est la première variante de production du chasseur Sukhoi Su-27 conçu par les Soviétiques. Cet avion était destiné à concurrencer directement les F-14 Tomcat et F-15 Eagle. Après avoir effectué son premier vol en 1977, il est entré en service plus tard en 1985. Son rôle principal était la défense aérienne à longue portée contre les bombardiers américains B-1 et B-52, ainsi que l'escorte à longue portée des bombardiers stratégiques intercontinentaux soviétiques. À ce jour, 809 appareils ont été produits, qui sont toujours en service dans l'armée de l'air russe. Parmi les autres exploitants, on peut citer l'Indonésie, l'Ukraine, le Vietnam et la Chine (désigné J-11), entre autres. L'avion restera en service dans un avenir prévisible."
 SOV_jet_interceptor_equipment_9_short:0 "Su-27S"
 SOV_stealth_fighter_equipment_1:0 "Mikoyan-Gurevich MiG 1.44"
 SOV_stealth_fighter_equipment_1_desc:0 "Le projet Mikoyan 1.44/1.42(N 1) était un démonstrateur technologique de chasseur multirôle développé par le bureau d'études Mikoyan. Il a été conçu pour le projet MFI (Mnogofunksionalni Frontovoy Istrebitel, « chasseur multifonctionnel de première ligne ») de l'Union soviétique dans le cadre du programme I-90 (« chasseur des années 1990 »), en réponse à l'Advanced Tactical Fighter (ATF) américain. Le MFI devait intégrer de nombreuses caractéristiques des chasseurs à réaction de cinquième génération, telles que la supermanœuvrabilité, le supercroisière et l'avionique avancée, ainsi qu'une certaine réduction de la signature radar."
 SOV_stealth_fighter_equipment_1_short:0 "MiG 1.44"
 SOV_high_mach_jet_interceptor_equipment_1:0 "Yakolev Yak-25"
 SOV_high_mach_jet_interceptor_equipment_1_short:0 "Yak-25"
 SOV_high_mach_jet_interceptor_equipment_1_desc:0 ""
 SOV_high_mach_jet_interceptor_equipment_2:0 "Yakolev Yak-28P"
 SOV_high_mach_jet_interceptor_equipment_2_short:0 "Yak-28P"
 SOV_high_mach_jet_interceptor_equipment_2_desc:0 "En 1960, sur la base des Yak-27K et Yak-28, un nouvel intercepteur supersonique biplace, le Yak-28P, a été créé. Il était destiné à combattre des cibles aériennes à basse et moyenne altitude dans une large gamme de vitesses, de jour comme de nuit, par tous les temps. L'avion était équipé du complexe d'armement K-8M-1, qui comprenait deux missiles R-8M-1 avec des chercheurs thermiques et des radars semi-actifs, ainsi qu'une station radar Orel-D. Aucun canon n'était installé."
 SOV_high_mach_jet_interceptor_equipment_3:0 "Mikoyan-Gurevich E-152A"
 SOV_high_mach_jet_interceptor_equipment_3_short:0 "E-152A"
 SOV_high_mach_jet_interceptor_equipment_3_desc:0 "L'intercepteur tout temps E-152A a été construit à la fin des années 1950. Il était équipé d'un groupe motopropulseur composé de deux moteurs R11F-300 en série d'une poussée maximale de 3 880 kg chacun et d'un postcombustion de 5 740 kg. Son armement comprenait le système d'interception « Uragan-5 », composé du radar « TsP-1 » et du missile K-9. Sur l'avion E-152A, le calculateur SRP et le pilote automatique étaient couplés au radar TsP."
 SOV_high_mach_jet_interceptor_equipment_4:0 "Mikoyan-Gurevich E-152M"
 SOV_high_mach_jet_interceptor_equipment_4_short:0 "E-152M"
 SOV_high_mach_jet_interceptor_equipment_4_desc:0 "La fin du programme d'essais du missile K-9 a entraîné l'arrêt des vols de l'E-152-2. En 1961, il a été décidé de convertir l'avion en une nouvelle version de l'E-152M. L'avion a été conçu pour être équipé d'un seul moteur R15B-300 d'une poussée de 6 480 kg sans postcombustion et de 10 210 kg avec postcombustion."
 SOV_CAS_equipment_1:0 "Kochyerigin LBSh Sturmovik"
 SOV_CAS_equipment_1_short:0 "LBSh Sturmovik"
 SOV_CAS_equipment_1_desc:0 "Le Kochyerigin LBSh était un monoplan à ailes basses de construction mixte en bois et en métal, développé en 1939 par Sergei Aleksandrovich Kochyerigin. Malgré sa faible puissance, cet avion CAS disposait d'une puissance de feu impressionnante pour l'époque, avec deux canons de 20 mm montés sur les ailes, deux mitrailleuses lourdes de 7,62 mm montées sur les ailes et une charge de bombes de 600 kg (1 300 lb), ainsi qu'une mitrailleuse lourde de 7,62 mm orientée vers l'arrière pour la défense. Bien qu'initialement accepté par l'armée de l'air soviétique pour être mis en production, cette décision fut rapidement annulée et la production se tourna plutôt vers les chasseurs I-28 et Yak-1. Ce fut le premier avion CAS soviétique à recevoir le nom de Sturmovik, qui signifie chasseur d'attaque au sol."
 SOV_CAS_equipment_2:0 "Ilyushin Il-2 Sturmovik"
 SOV_CAS_equipment_2_short:0 "Il-2 Sturmovik"
 SOV_CAS_equipment_2_desc:0 "Illyusha, Hunchback, le char volant, le fantassin volant, voici quelques-uns des nombreux surnoms donnés à l'Il-2, véritable emblème de l'armée de l'air soviétique pendant la Seconde Guerre mondiale. Lancé en 1941, l'Il-2 était un avion d'attaque au sol qui, combiné à son successeur, l'Il-10, fut l'avion de combat le plus produit de l'histoire de l'aviation, avec 36 183 unités produites pour le seul Il-2. L'Il-2 a joué un rôle crucial sur le front oriental. Malgré son manque de précision dans ses bombardements et ses attaques à la roquette, sa durabilité globale le rendait extrêmement efficace pour dévier tous les tirs, à l'exception des canons antiaériens de gros calibre, ce qui lui a valu le surnom de « char volant ». Connu sous le nom de Sturmovik, qui signifie « avion d'attaque au sol », il a ensuite été baptisé « Bark » par l'OTAN."
 SOV_CAS_equipment_3:0 "Ilyushin Il-10"
 SOV_CAS_equipment_3_short:0 "Il-10"
 SOV_CAS_equipment_3_desc:0 "Développé à partir de l'Il-2 Sturmovik, l'Il-10 a été conçu dans le but de remédier à bon nombre des défauts de l'Il-2. L'objectif principal était d'augmenter la vitesse et la maniabilité à basse altitude, principalement pour échapper à l'artillerie antiaérienne de petit calibre, qui constituait la principale menace pour les avions d'attaque au sol. Entré en service en janvier 1945, l'Il-10 a participé à certaines des dernières opérations de combat en Europe et à la brève intervention soviétique dans la guerre du Pacifique. Lorsque l'Il-10 a été retiré du service soviétique en 1956, l'armée de l'air a délaissé les avions de soutien aérien rapproché et d'attaque au sol au profit des chasseurs-bombardiers. Son nom de code OTAN est Beast."
 SOV_CAS_equipment_4:0 "Ilyushin Il-16"
 SOV_CAS_equipment_4_short:0 "Il-16"
 SOV_CAS_equipment_4_desc:0 "L'Ilyushin Il-16 est la version finale de l'avion d'attaque au sol Sturmovik. Il s'agissait essentiellement d'une version réduite de l'Ilyushin Il-10, mais il était équipé d'un nouveau moteur Mikulin AM-43NV, qui devait lui conférer une vitesse et une maniabilité supérieures à celles de son prédécesseur. Trois appareils ont été construits à des fins d'essai, mais en raison de problèmes imprévus et irrémédiables au niveau du moteur, le projet a été annulé."
 SOV_jet_CAS_equipment_1:0 "Ilyushin IL-10M"
 SOV_jet_CAS_equipment_1_short:0 "IL-10M"
 SOV_jet_CAS_equipment_2:0 "Mikoyan-Gurevich MiG-17bis"
 SOV_jet_CAS_equipment_2_desc:0 "Conversion d'un chasseur-bombardier, équipé pour transporter des roquettes et des bombes non guidées."
 SOV_jet_CAS_equipment_2_short:0 "MiG-17bis"
 SOV_jet_CAS_equipment_3:0 "Mikoyan-Gurevich MiG-19S"
 SOV_jet_CAS_equipment_3_desc:0 "Version chasseur-bombardier avec queue à panneaux mobiles. Équipé d'un récepteur de navigation longue portée Svod et armé de trois canons NR-30 de 30 mm. Il pouvait embarquer un pack de roquettes non guidées ORO-32K ou une bombe FAB-250 sous chaque aile, et à partir de 1957, il a été modifié pour pouvoir transporter quatre pods de roquettes."
 SOV_jet_CAS_equipment_3_short:0 "MiG-19S"
 SOV_jet_CAS_equipment_4:0 "Sukhoi Su-7B"
 SOV_jet_CAS_equipment_4_desc:0 "La version bombardier du Su-7 Fitter-A a effectué son premier vol en mars 1959, avant d'entrer en service en 1961. Il est devenu le principal avion d'attaque au sol soviétique des années 1960. Entre 1957 et 1972, plus de 1 400 Su-7B ont été construits, dont une grande partie a été exportée. Cet avion était relativement populaire à l'étranger, où il a été utilisé par 10 pays. Il a été largement utilisé par les forces aériennes indiennes et égyptiennes. Il est toujours en service, mais de manière limitée, en Corée du Nord."
 SOV_jet_CAS_equipment_4_short:0 "Su-7B"
 SOV_jet_CAS_equipment_5:0 "Sukhoi Su-7BKL"
 SOV_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté du fuselage, réservoirs de carburant installés dans les ailes, points d'ancrage « humides » sous les ailes pour transporter des réservoirs de carburant externes, capable de transporter des bombes nucléaires tactiques."
 SOV_jet_CAS_equipment_5_short:0 "Su-7BKL"
 SOV_jet_CAS_equipment_6:0 "Sukhoi Su-17M"
 SOV_jet_CAS_equipment_6_desc:0 "Le Sukhoi Su-17 Fitter-C était une version améliorée de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers les forces aériennes du bloc de l'Est, des pays arabes et d'Amérique du Sud. Le Su-17 apportait des améliorations dans presque tous les domaines par rapport à son prédécesseur, notamment au niveau des capteurs, des performances de vol, de la charge utile, de l'autonomie et du balayage variable des ailes. De 1969 à 1990, 2 867 appareils ont été produits et utilisés dans 30 pays, dont 6 utilisent encore cet avion aujourd'hui."
 SOV_jet_CAS_equipment_6_short:0 "Su-17M"
 SOV_jet_CAS_equipment_7:0 "Mikoyan-Gurevich MiG-27M"
 SOV_jet_CAS_equipment_7_desc:0 "Le MiG-27 Flogger est un avion d'attaque au sol soviétique à ailes à géométrie variable. Cet avion est basé sur le MiG-23, mais optimisé pour l'attaque au sol. Contrairement au MiG-23, le MiG-27 n'a pas été largement utilisé en dehors de l'URSS. Entre 1970 et 1986, 1 075 appareils ont été produits. Le MiG-27 a été utilisé pendant les dernières phases des guerres soviéto-afghane et de Kargil. L'avion reste en service de manière limitée en Inde et au Kazakhstan."
 SOV_jet_CAS_equipment_7_short:0 "MiG-27M"
 SOV_jet_CAS_equipment_8:0 "Sukhoi Su-25"
 SOV_jet_CAS_equipment_8_desc:0 "Le Sukhoi Su-25 Frogfoot est un avion d'attaque au sol bimoteur développé en Union soviétique. Il a effectué son premier vol en 1975 et a été mis en service en 1981. Depuis 1978, plus de 1 000 exemplaires ont été produits. Cet avion a connu un grand succès à l'étranger, où il a été vendu à 29 pays. Le Su-25 a ainsi participé à plusieurs conflits, notamment la guerre soviétique en Afghanistan, la guerre Iran-Irak et la guerre du Golfe. Il est toujours en service dans tous les pays importateurs."
 SOV_jet_CAS_equipment_8_short:0 "Su-25"
 SOV_cas_stealth_equipment_1:0 "Sukhoi Su-39"
 SOV_cas_stealth_equipment_1_short:0 "Su-39"
 SOV_cas_stealth_equipment_1_desc:0 "Une deuxième génération de Su-25T, le Su-25TM (également désigné Su-39), a été développée avec des systèmes de navigation et d'attaque améliorés, ainsi qu'une meilleure capacité de survie. Tout en conservant le Shkval intégré du Su-25T, il peut transporter un radar Kopyo (rus. « Lance ») dans le conteneur sous le fuselage, qui est utilisé pour engager des cibles aériennes (avec des missiles RVV-AE/R-77) ainsi que des navires (avec des missiles antinavires Kh-31 et Kh-35)."
 SOV_nav_bomber_equipment_1:0 "Ilyushin Il-4T"
 SOV_nav_bomber_equipment_1_short:0 "Il-4T"
 SOV_nav_bomber_equipment_1_desc:0 "Initialement connu sous le nom de DB-3F, l'Il-4 était un bombardier moyen performant, doté d'une autonomie suffisante pour effectuer même des missions de bombardement stratégique. Cette version modifiée du DB-3 était équipée de nouveaux moteurs et d'une tourelle dorsale renforcée (la mitrailleuse lourde ShKAS de 7,62 mm avait été remplacée par une mitrailleuse lourde UBT de 12,7 mm). Certaines séries avaient des ailes extérieures et des fuselages avant en bois afin d'économiser les métaux, et tout au long de la production, les moteurs et les réservoirs de carburant ont été améliorés pour offrir de meilleures performances tout en conservant la même autonomie. Cependant, en raison du poids supplémentaire, les moteurs ne se sont pas révélés assez puissants, et l'appareil était donc plus lent que son prédécesseur immédiat. Son nom de code OTAN est Bob."
 SOV_nav_bomber_equipment_2:0 "Tupolev Tu-2T"
 SOV_nav_bomber_equipment_2_short:0 "Tu-2T"
 SOV_nav_bomber_equipment_2_desc:0 "Le Tu-2T (version prototype ANT-62T) était la variante bombardier-torpilleur du Tu-2, développée à partir de la variante Tu-2D. La décision d'utiliser cette plate-forme pour ce rôle est probablement due à la préférence des équipages pour le Tu-2, bien qu'il s'agisse du deuxième bombardier le plus important de l'armée de l'air soviétique pendant la Seconde Guerre mondiale (le premier étant le Pe-2). Cette variante a été utilisée par les pilotes de l'aviation navale soviétique pendant les dernières phases de la Seconde Guerre mondiale et a servi pendant une grande partie de l'après-guerre. Comme son cousin de l'armée de l'air, son nom de code OTAN est « Bat »."
 SOV_nav_bomber_equipment_3:0 "Ilyushin Il-6"
 SOV_nav_bomber_equipment_3_short:0 "Il-6"
 SOV_nav_bomber_equipment_3_desc:0 "L'Il-6 est une version améliorée du bombardier/torpilleur à longue portée Il-4 Bob. Initialement destiné à remplacer l'Il-4, l'Il-6 était équipé de moteurs diesel à faible consommation de carburant lui conférant une autonomie beaucoup plus grande. Il devait être équipé d'un armement défensif composé de cinq canons de 20 mm. Cependant, les essais en vol ont montré que cet appareil était difficile à contrôler à forte charge et à faible vitesse, ce qui rendait son atterrissage difficile. De plus, les moteurs ne pouvaient pas démarrer à basse température et réagissaient lentement aux mouvements de la manette des gaz. Malgré diverses tentatives d'amélioration, le développement fut interrompu en 1944."
 SOV_nav_bomber_equipment_4:0 "Beriev Be-6"
 SOV_nav_bomber_equipment_4_short:0 "Be-6"
 SOV_nav_bomber_equipment_4_desc:0 "Le Be-6 était un hydravion produit par le bureau d'études Beriev, qui a effectué son premier vol en 1949. Il était capable d'accomplir une grande variété de missions. Outre son rôle principal de patrouille maritime et de reconnaissance maritime, le Be-6 était également utilisé pour des missions de patrouille côtière et de ravitaillement, de pose de mines, de bombardier torpilleur, de bombardier moyen et de transport. Son nom de code USAF/OTAN est Type 34, tandis que son nom de code OTAN était Madge."
 SOV_nav_bomber_equipment_5:0 "Beriev Be-10"
 SOV_nav_bomber_equipment_5_short:0 "Be-10"
 SOV_nav_bomber_equipment_5_desc:0 "Le Be-10, également connu sous le nom d'Izdelye M, était un hydravion à turboréacteur développé par l'Union soviétique en 1956. Conçu comme un bombardier de patrouille, le Be-10 était réputé pour être difficile à piloter et souffrait de fatigue métallique due aux contraintes exercées sur la cellule lors des décollages et atterrissages à grande vitesse, ainsi qu'à la corrosion. Il fut donc rapidement remplacé par le Be-12 Mail. Connu en Occident sous le nom de Mallow, une sous-variante civile modifiée, le M-10 établit 12 records du monde auprès de la Fédération aéronautique internationale (World Air Sports Federation) en 1961."
 SOV_nav_bomber_equipment_6:0 "Beriev Be-12N Chayka"
 SOV_nav_bomber_equipment_6_short:0 "Be-12N Chayka"
 SOV_nav_bomber_equipment_6_desc:0 "Le Be-12 a été développé en 1960 pour succéder et remplacer les Be-6 Madge et Be-10 Mallow. Il a été conçu comme un avion de patrouille maritime et anti-sous-marin. Contrairement à son prédécesseur immédiat, propulsé par un turboréacteur, le Be-12 était un avion à turbopropulsion et disposait également d'un train d'atterrissage rétractable, ce qui lui conférait une capacité d'atterrissage amphibie. La version améliorée N était équipée de nouveaux capteurs, d'une avionique, d'un système de recherche et d'attaque Nartsiss et d'un capteur de détection des anomalies magnétiques (MAD). Connu localement sous le nom de Chayka, qui signifie « mouette », son nom de code OTAN est Mail."
 SOV_nav_bomber_equipment_7:0 "Tupolev Tu-142"
 SOV_nav_bomber_equipment_7_short:0 "Tu-142"
 SOV_nav_bomber_equipment_7_desc:0 "Le Tupolev Tu-142 est un avion soviétique/russe de reconnaissance maritime et de lutte anti-sous-marine (ASW) dérivé du bombardier stratégique à turbopropulsion Tu-95. Une variante spécialisée dans les communications, désignée Tu-142MR, était chargée des communications à longue distance avec les sous-marins nucléaires lanceurs d'engins soviétiques. Le Tu-142 a été conçu par le bureau d'études Tupolev et fabriqué par les usines Kuibyshev Aviation et Taganrog Machinery de 1968 à 1994. Anciennement exploité par la marine soviétique et l'armée de l'air ukrainienne, le Tu-142 est actuellement en service dans la marine russe."
 SOV_nav_bomber_equipment_8:0 "Ilyushin IL-38N"
 SOV_nav_bomber_equipment_8_short:0 "IL-38N"
 SOV_nav_bomber_equipment_8_desc:0 "L'Il-38 est une adaptation du quadrimoteur à turbopropulsion Ilyushin Il-18 destiné à servir d'avion de patrouille maritime pour la marine soviétique. Il répondait à un besoin de contrer les sous-marins lanceurs d'engins balistiques américains. L'IL-38N est une version moderne parfois appelée Il-38SD pour Sea Dragon, qui est un nouveau système de recherche et de suivi. La version de la marine russe est équipée du système Novella P-38. Le Novella P-38 est capable de détecter des cibles aériennes à une distance pouvant atteindre 90 kilomètres et de suivre des objets en surface dans un rayon de 320 kilomètres. Il peut suivre simultanément 32 cibles aériennes et sous-marines."
 SOV_aerosub_0:0 "Ushakov LPL Flying Submarine"
 SOV_aerosub_0_short:0 "LPL Aerosub"
 SOV_aerosub_0_Desc:0 "Pendant l'entre-deux-guerres, l'Union soviétique a commencé à explorer des concepts navals et à mener de nombreuses expériences afin de révolutionner le combat naval. Juste avant la Seconde Guerre mondiale, Boris Ouchakov, de l'Académie des ingénieurs navals Dzerjinski, a proposé le concept d'un sous-marin volant, un bombardier naval capable de plonger ou de refaire surface à volonté pour mener des opérations de bombardement naval. Le projet fut évoqué à plusieurs reprises par Ouchakov au cours des années suivantes et finit par être étudié de manière relativement sérieuse en 1938. La grande complexité de la conception était prohibitive et le projet fut finalement annulé en 1939. Cependant, en 1943, Lavrentiy Beria relança le projet et le premier essai fut réalisé en 1947. En 1953, le projet fut finalement annulé par Khrouchtchev en raison de son impraticabilité et du fait qu'il n'avait pratiquement pas progressé, car il ne pouvait même pas voler correctement."
 SOV_tac_bomber_equipment_0:0 "Ilyushin DB-3"
 SOV_tac_bomber_equipment_0_short:0 "DB-3"
 SOV_tac_bomber_equipment_0_desc:0 "Le DB-3 était un bombardier bimoteur à ailes basses qui est entré en service dans l'armée de l'air soviétique en 1936. Malgré une carrière plutôt discrète dans l'armée soviétique, cet appareil a servi en Chine, dans l'armée de l'air nationaliste chinoise, pendant la seconde guerre sino-japonaise. Il a également été le premier bombardier soviétique à lancer un raid sur la capitale allemande, Berlin, au cours des premiers mois du front oriental de la Seconde Guerre mondiale. La désignation DB est l'abréviation de Dalniy Bombardirovschik, qui signifie « bombardier à longue portée »."
 SOV_tac_bomber_equipment_1:0 "Ilyushin DB-3M"
 SOV_tac_bomber_equipment_1_short:0 "DB-3M"
 SOV_tac_bomber_equipment_1_desc:0 "Première mise à niveau majeure du DB-3."
 SOV_tac_bomber_equipment_2:0 "Petlyakov Pe-2B"
 SOV_tac_bomber_equipment_2_short:0 "Pe-2B"
 SOV_tac_bomber_equipment_2_desc:0 "Le Petlyakov Pe-2 était un bombardier en piqué bimoteur soviétique utilisé pendant la Seconde Guerre mondiale. L'un des avions d'attaque tactique les plus remarquables de la guerre, il s'est également révélé efficace en tant que chasseur lourd, chasseur de nuit (variante Pe-3) et avion de reconnaissance. À bien des égards, il ressemblait au De Havilland Mosquito britannique en bois. Le Pe-2 était, en nombre, le bombardier soviétique le plus important de la Seconde Guerre mondiale, représentant à son apogée 75 % de la force de bombardiers bimoteurs soviétiques."
 SOV_tac_bomber_equipment_3:0 "Tupolev Tu-2"
 SOV_tac_bomber_equipment_3_short:0 "Tu-2"
 SOV_tac_bomber_equipment_3_desc:0 "Le Tu-2 était un bombardier diurne bimoteur à grande vitesse développé en 1941. Il a été conçu pour être la réponse soviétique au bombardier moyen Junkers Ju-88, adapté pour répondre à un besoin en bombardier à grande vitesse ou en bombardier en piqué, avec une grande charge interne de bombes et une vitesse similaire à celle d'un chasseur monoplace. Il s'est avéré à la hauteur de la tâche, et des variantes de bombardier torpilleur, de reconnaissance et de chasseur lourd ont vu le jour, jouant un rôle clé dans les dernières offensives soviétiques de la Seconde Guerre mondiale. Son nom de code OTAN d'après-guerre est Bat."
 SOV_jet_tac_bomber_equipment_1:0 "Ilyushin Il-22"
 SOV_jet_tac_bomber_equipment_1_short:0 "Il-22"
 SOV_jet_tac_bomber_equipment_1_desc:0 "L'Ilyushin Il-22 fut le premier bombardier soviétique à réaction à voler. Il était équipé de quatre turboréacteurs Lyulka TR-1 montés sur des pylônes horizontaux courts situés à l'avant et sous l'aile. Les moteurs n'atteignaient pas la poussée prévue et leur consommation de carburant était plus élevée que prévu. Ces problèmes empêchèrent l'avion d'atteindre les performances requises et il fut abandonné le 22 septembre 1947."
 SOV_jet_tac_bomber_equipment_2:0 "Ilyushin Il-28"
 SOV_jet_tac_bomber_equipment_2_short:0 "Il-28"
 SOV_jet_tac_bomber_equipment_2_desc:0 "L'Il-28 était un bombardier moyen à turboréacteur développé immédiatement après la fin de la Seconde Guerre mondiale pour l'armée de l'air soviétique. Premier bombardier à réaction à être produit à grande échelle, l'Il-28, lorsqu'il a été introduit en 1950, a servi dans de nombreux conflits majeurs de la guerre froide, du Vietnam à la guerre soviéto-afghane, en passant par le conflit de Suez et la guerre du Biafra. Même après avoir été retiré du service soviétique dans les années 1980, de nombreux appareils de ce type sont encore en service aujourd'hui. Le nom de code de l'USAF/DoD est Type 27, tandis que le nom de code de l'OTAN est Beagle."
 SOV_jet_tac_bomber_equipment_3:0 "Yakovlev Yak-28B"
 SOV_jet_tac_bomber_equipment_3_short:0 "Yak-28B"
 SOV_jet_tac_bomber_equipment_3_desc:0 "Le Yak-28 a été développé comme avion de combat à ailes en flèche et introduit en 1960. Les variantes bombardiers du Yak-28, connues sous leur nom de code OTAN Brewer, étaient équipées de moteurs montés en nacelle, similaires à ceux du Yak-25 Flashlight dont il était dérivé. Grâce à cela et à ses ailes en flèche, c'était un avion subsonique capable d'atteindre des vitesses transsoniques à haute altitude. Il a servi de bombardier léger principal de l'armée de l'air soviétique et a été largement utilisé par la Russie, la Biélorussie et le Turkménistan après la chute de l'Union soviétique, avant d'être retiré du service en 1992."
 SOV_jet_tac_bomber_equipment_4:0 "Yakovlev Yak-28I"
 SOV_jet_tac_bomber_equipment_4_short:0 "Yak-28I"
 SOV_jet_tac_bomber_equipment_4_desc:0 "Version améliorée avec le système de ciblage interne « Initsiativa-2 », un radar de cartographie du sol à 360 degrés, associé à un système de ciblage contrôlé au sol utilisant la triangulation à partir de sites émetteurs terrestres."
 SOV_jet_tac_bomber_equipment_5:0 "Mikoyan-Guerevich MiG-25RBT"
 SOV_jet_tac_bomber_equipment_5_short:0 "MiG-25RBS"
 SOV_jet_tac_bomber_equipment_5_desc:0 "Le MiG-25RBS est un bombardier-reconnaissance monoplace dérivé du MiG-25R, équipé de systèmes de reconnaissance améliorés et d'un système de bombardement automatique Peleng. L'avion peut transporter une charge de huit bombes de 500 kg (1 102 lb)."
 SOV_jet_tac_bomber_equipment_6:0 "Sukhoi Su-24"
 SOV_jet_tac_bomber_equipment_6_short:0 "Su-24"
 SOV_jet_tac_bomber_equipment_6_desc:0 "Un gros chasseur-bombardier développé par l'Union soviétique dans les années 1960 et toujours en service aujourd'hui. Il se caractérise par ses ailes variables et son fuselage effilé. Il peut embarquer jusqu'à 8 000 kg d'armes et est capable de lancer différents types de missiles air-sol tout en maintenant une vitesse stable. Cet avion est connu sous son nom de code OTAN, « Fencer ». Avec son successeur, le Su-34, il est actuellement utilisé comme chasseur-bombardier par les anciens pays du bloc de l'Est."
 SOV_jet_tac_bomber_equipment_7:0 "Sukhoi Su-24M"
 SOV_jet_tac_bomber_equipment_7_short:0 "Su-24M"
 SOV_jet_tac_bomber_equipment_7_desc:0 "Entré en service en 1983, le Su-24M était une évolution du Su-24 depuis la mise en service du modèle initial. L'une des principales caractéristiques du Su-24M est l'ajout d'une capacité de ravitaillement en vol grâce à une sonde rétractable, d'un nouveau système de navigation interne et d'un désignateur laser Kaira-24, qui permet à l'appareil d'utiliser des bombes à guidage de précision. Il est connu en Occident sous le nom de Fencer-D."
 SOV_jet_tac_bomber_equipment_8:0 "Sukhoi Su-34"
 SOV_jet_tac_bomber_equipment_8_short:0 "Su-34"
 SOV_jet_tac_bomber_equipment_8_desc:0 "Un avion d'attaque développé à partir du Su-27 avec un cockpit à deux sièges en tandem. Il offre une maniabilité exceptionnelle pour un avion d'attaque, ses mouvements agiles lui permettant de rivaliser avec les chasseurs de la même catégorie. Son blindage plus épais augmente également son taux de survie. Son nom de code OTAN est « Fullback ». Dans l'hypothèse de missions d'attaque prolongées, la partie arrière des sièges pilotes est équipée d'un lavabo et d'une cuisine simple."
 SOV_strat_bomber_equipment_1:0 "Petlyakov Pe-8"
 SOV_strat_bomber_equipment_1_short:0 "Pe-8"
 SOV_strat_bomber_equipment_1_desc:0 "Bombardier lourd soviétique conçu avant la Seconde Guerre mondiale, le Pe-8 (initialement appelé TB-7 jusqu'à ce que son nom soit changé en l'honneur de Vladimir Petlyakov à sa mort en 1942) fut le seul bombardier quadrimoteur développé pendant la guerre. Produit en nombre limité, il fut utilisé pour bombarder Berlin en août 1941. Il a également été utilisé pour des « raids moraux » destinés à remonter le moral du peuple soviétique en exposant les vulnérabilités de l'Axe. Sa mission principale consistait toutefois à attaquer de nuit les aérodromes, les gares de triage et autres installations situées à l'arrière des lignes allemandes. Comme ces avions servaient à remonter le moral des troupes, la Luftwaffe allemande les prenait souvent pour cible, et un grand nombre d'entre eux ont été détruits au cours de la Grande Guerre patriotique. Après la guerre, ils ont principalement servi de moyens de transport jusqu'à la fin des années 1950."
 SOV_strat_bomber_equipment_2:0 "Ilyushin Il-4"
 SOV_strat_bomber_equipment_2_short:0 "Il-4"
 SOV_strat_bomber_equipment_2_desc:0 "Bien que l'Il-4 ne fût qu'un bombardier moyen, son rayon d'action lui permettait d'être utilisé pour des missions stratégiques. L'utilisation des bombardiers dans ce rôle n'était pas une priorité pour la VVS, mais l'Il-4 fut néanmoins utilisé lors de plusieurs raids de bombardement à longue portée contre Berlin en 1941. La plupart étaient utilisés pour des missions à beaucoup plus courte portée, souvent avec 1 000 kg (2 204 lb) de bombes supplémentaires sous les ailes, en plus des 2 500 kg (5 512 lb) internes."
 SOV_strat_bomber_equipment_3:0 "Tupolev Tu-4"
 SOV_strat_bomber_equipment_3_short:0 "Tu-4"
 SOV_strat_bomber_equipment_3_desc:0 "Le Tu-4 est une conception issue d'une ingénierie inverse basée sur le B-29 Superfortress américain, développé pour répondre au besoin de Joseph Staline de disposer d'un bombardier stratégique doté de capacités similaires à celles du bombardier américain qui avait permis de remporter la guerre. Malgré le refus des États-Unis de prêter le B-29 dans le cadre du programme Lend-Lease, quatre B-29 se sont écrasés sur le territoire soviétique, ce qui a suffi pour lancer le processus d'ingénierie inverse. Malgré de nombreuses difficultés (approvisionnement en pièces équivalentes ou supérieures à celles développées par les Américains, conversion du système impérial au système métrique, etc.), le premier vol et la mise en service du Tu-4 ont suffi à semer la panique aux États-Unis et en Grande-Bretagne, la première d'une longue série pendant la guerre froide. Sa durée de vie a toutefois été brève, puisqu'il a été remplacé par des bombardiers à réaction au milieu des années 1960. Son nom de code OTAN est Bull."
 SOV_jet_strat_bomber_equipment_1:0 "Tupolev Tu-16"
 SOV_jet_strat_bomber_equipment_1_short:0 "Tu-16"
 SOV_jet_strat_bomber_equipment_1_desc:0 "Le Tu-16 était un bombardier stratégique bimoteur développé en 1952, et fut l'un des premiers bombardiers stratégiques à réaction à entrer en service dans l'armée de l'air soviétique. Il avait une configuration à ailes en flèche et était propulsé par deux turboréacteurs Mikulin AM-3 situés à la base des ailes. Il pouvait transporter jusqu'à 9 000 kg (20 000 lb) de munitions, y compris des armes nucléaires et la FAB-9000, une bombe de 9 000 kg dont la puissance était similaire à celle de la bombe britannique Grand Slam. Connu en Occident sous le nom de Badger, cet appareil a servi pendant toute la guerre froide, avant d'être retiré du service en 1993. La variante chinoise construite sous licence, le H-6, reste en service en tant que bombardier stratégique de première ligne de l'APL."
 SOV_jet_strat_bomber_equipment_2:0 "Myasishchev Mya-3M Molot"
 SOV_jet_strat_bomber_equipment_2_short:0 "M-3M Molot"
 SOV_jet_strat_bomber_equipment_2_desc:0 "Le Mya-4 (ou M-4, désignation Myasishchev 2M) est un bombardier stratégique quadrimoteur qui est entré en service en 1956. Ce bombardier était capable de voler sur de longues distances et pouvait frapper des cibles situées directement sur le continent américain à partir de bases russes, même s'il s'agissait d'un aller simple. Malgré cela, ainsi que d'autres tactiques de désinformation sélective, il a semé la panique parmi les politiciens et les agences de renseignement occidentaux, et a conduit à la construction de nouveaux B-47 Stratojets et du B-52 Stratofortress récemment introduit. Les Russes l'ont officiellement surnommé Molot, ce qui signifie « marteau », tandis que l'OTAN lui a donné le nom de code Bison et que l'armée de l'air américaine l'a désigné sous le nom de Type 37."
 SOV_jet_strat_bomber_equipment_3:0 "Tupolev Tu-95M"
 SOV_jet_strat_bomber_equipment_3_short:0 "Tu-95M"
 SOV_jet_strat_bomber_equipment_3_desc:0 "S'il existe un bombardier qui pourrait être considéré comme le symbole de la force aérienne soviétique, c'est bien le Tu-95. Mis en service en 1956, le Tu-95 est le seul bombardier stratégique à hélices encore en service à ce jour. Il est l'un des avions militaires les plus bruyants, car les extrémités des pales de ses hélices tournent à une vitesse supérieure à celle du son. Tout comme le B-52 Stratofortress américain, le bombardier Tu-95 est souvent comparé à ce dernier. Le Tu-95 devrait rester en service dans l'armée de l'air russe jusqu'à la fin des années 2040. Pour l'Occident, il est tout à fait approprié que l'avion synonyme de l'empire soviétique reçoive le nom de code Bear (ours)."
 SOV_jet_strat_bomber_equipment_4:0 "Tupolev Tu-95KD"
 SOV_jet_strat_bomber_equipment_4_short:0 "Tu-95KD"
 SOV_jet_strat_bomber_equipment_4_desc:0 "Cette version du Tu-95 a bénéficié d'une mise à niveau avionique conçue pour transporter des missiles guidés tels que le missile air-sol Kh-20."
 SOV_jet_strat_bomber_equipment_5:0 "Tupolev Tu-95MS"
 SOV_jet_strat_bomber_equipment_5_short:0 "Tu-95MS"
 SOV_jet_strat_bomber_equipment_5_desc:0 "Plateforme de lancement de missiles de croisière entièrement nouvelle basée sur la cellule du Tu-142. Cette variante est devenue la plateforme de lancement du missile de croisière Raduga Kh-55 et a été mise en production en série en 1981. Connue sous le nom de Bear-H par l'OTAN, elle a été désignée par l'armée américaine sous le nom de Tu-142 pendant un certain temps dans les années 1980, avant que sa véritable désignation ne soit connue."
 SOV_mach2stratbomber_equipment_1:0 "Tupolev Tu-22"
 SOV_mach2stratbomber_equipment_1_short:0 "Tu-22"
 SOV_mach2stratbomber_equipment_1_desc:0 "Premier bombardier supersonique à entrer en production en Union soviétique, le Tu-22 est entré en service dans l'armée de l'air soviétique en 1962. Produit en petit nombre (311 exemplaires ont été construits), ce modèle s'est avéré décevant, car il ne disposait pas de l'autonomie intercontinentale attendue d'un tel bombardier. Malgré cela, le Tu-22 a été modernisé tout au long de sa durée de vie, servant de plate-forme de lancement pour le missile antinavire à longue portée Kh-22. Son nom de code OTAN est Blinder."
 SOV_mach2stratbomber_equipment_2:0 "Tupolev Tu-22M2"
 SOV_mach2stratbomber_equipment_2_short:0 "Tu-22M2"
 SOV_mach2stratbomber_equipment_2_desc:0 "Le Tu-22M2 est une version améliorée du Tu-22 Blinder. Initialement désigné sous le nom de Tu-26, le Tu-22M était utilisé à la fois par les forces aériennes soviétiques (comme bombardier stratégique, en remplacement du Tu-22 Blinder) et par l'aviation navale soviétique (comme avion de patrouille maritime). Lorsqu'il a été découvert par les forces américaines, il a provoqué un choc en Occident, d'autant plus que le Premier ministre Khrouchtchev aurait déclaré que les missiles balistiques intercontinentaux rendraient les bombardiers obsolètes. La variante Tu-22M2 en question était la première variante de production majeure, avec des moteurs et des entrées d'air de type F-4 Phantom qui lui conféraient une vitesse maximale de Mach 1,65. En 2014, plus de 100 Tu-22M2 Blinder-B étaient en service dans l'armée de l'air russe."
 SOV_mach2stratbomber_equipment_3:0 "Tupolev Tu-22M3"
 SOV_mach2stratbomber_equipment_3_short:0 "Tu-22M3"
 SOV_mach2stratbomber_equipment_3_desc:0 "Le Tu-22M3, qui a effectué son premier vol en 1977, a été mis en service en 1983 et est officiellement entré en service en 1989. Il était équipé de nouveaux moteurs NK-25 nettement plus puissants, de rampes d'admission en forme de coin similaires à celles du MiG-25, d'ailes à plus forte flèche maximale et d'un nez redessiné abritant un nouveau radar de navigation/attaque Almaz PNA (Planeta Nositel, izdeliye 030A) et d'un système de navigation/attaque NK-45, qui améliore considérablement les performances en vol à basse altitude."
 SOV_mach3stratbomber_equipment_1:0 "Sukhoi T-4M Sotka"
 SOV_mach3stratbomber_equipment_1_short:0 "T-4M Sotka"
 SOV_mach3stratbomber_equipment_1_desc:0 "Le T-4M était une autre maquette du T-4 original, conçue sur la base du XB-70 Valkyrie américain. Le T-4M était doté d'ailes à géométrie variable et d'ailettes avant agrandies, mais conservait le fuselage et la structure du moteur du T-4. On estime que la vitesse maximale du T-4M aurait été de Mach 3, avec une vitesse de croisière de Mach 2,8."
 SOV_mach6stratbomber_equipment_1:0 "Sukhoi T-4MS"
 SOV_mach6stratbomber_equipment_1_short:0 "T-4MS"
 SOV_mach6stratbomber_equipment_1_desc:0 "Une refonte complète et totale du bombardier stratégique T-4M à grande vitesse. Le bureau d'études Sukhoi a commencé le développement d'un tout nouvel avion stratégique bimode, le T-4MS, en s'appuyant sur l'expérience acquise avec le T-4 Sotka. Il était prévu d'installer les mêmes moteurs, systèmes embarqués et équipements."
 SOV_nuclearstratbomber_equipment_1:0 "Tupolev Tu-119"
 SOV_nuclearstratbomber_equipment_1_short:0 "Tu-119"
 SOV_nuclearstratbomber_equipment_1_desc:0 "Le Tu-119 était un bombardier stratégique à propulsion nucléaire dérivé du Tu-95 après utilisation d'un avion de recherche (Tu-95LML). Ce modèle aurait été propulsé par deux moteurs à propulsion nucléaire internes (utilisant l'énergie produite par la chaleur générée par un réacteur nucléaire embarqué) et deux turbopropulseurs à kérosène externes."
 SOV_nuclearstratbomber_equipment_2:0 "Myasishchev M-60"
 SOV_nuclearstratbomber_equipment_2_short:0 "M-60"
 SOV_nuclearstratbomber_equipment_2_desc:0 "Le M-60 était le projet de bombardier stratégique à propulsion nucléaire de Myasishchev, lui-même basé sur le projet de bombardier stratégique M-50 Bounder. Il aurait été propulsé par quatre turboréacteurs sans postcombustion dans une configuration similaire à celle du Tu-119, deux moteurs intérieurs alimentés par un réacteur nucléaire et deux moteurs extérieurs alimentés au kérosène. En raison des craintes de dommages environnementaux dus à des incidents ou à des accidents et des dépassements de coûts, le projet a été abandonné."
 SOV_stealth_tactical_bomber_equipment_1:0 "Sukhoi Su-24BM"
 SOV_stealth_tactical_bomber_equipment_1_short:0 "Su-24BM"
 SOV_stealth_tactical_bomber_equipment_1_desc:0 "En 1979, V. Sarov commença à travailler sur une version beaucoup plus grande du Su-24M, dotée d'une soute interne pouvant contenir la plupart des armes destinées à être utilisées par le nouvel avion. Connu au sein de l'OKB sous le nom de T-6BM (Bolshaya Modifikatsiya ou grande modification) et sous le nom de Su-24BM pour le W S, cet avion était beaucoup plus grand mais aussi plus furtif que le Su-24."
 SOV_stealth_strategic_bomber_equipment_1:0 "Tupolev Tu-160"
 SOV_stealth_strategic_bomber_equipment_1_short:0 "Tu-160"
 SOV_stealth_strategic_bomber_equipment_1_desc:0 "Le Tupolev Tu-160 est un bombardier stratégique lourd supersonique à ailes à géométrie variable conçu par le bureau d'études Tupolev en Union soviétique dans les années 1970. Il s'agit du plus grand et du plus lourd avion militaire supersonique Mach 2+ jamais construit, juste derrière l'avion expérimental XB-70 Valkyrie en termes de longueur totale. En 2021, il est l'avion de combat le plus grand et le plus lourd, le bombardier le plus rapide en service et l'avion à ailes à géométrie variable le plus grand et le plus lourd jamais construit."
 SOV_stealth_strategic_bomber_equipment_2:0 "Tupolev PAK DA"
 SOV_stealth_strategic_bomber_equipment_2_short:0 "PAK DA"
 SOV_stealth_strategic_bomber_equipment_2_desc:0 "Le PAK-DA (acronyme signifiant Perspektivnyi Aviatsionnyi Kompleks Dal'ney Aviatsii, ou complexe aéronautique prospectif pour l'aviation longue distance) est un projet de bombardier stratégique russe de nouvelle génération développé pour l'armée de l'air russe. Bombardier stratégique furtif, le PAK DA devrait entrer en service entre 2025 et 2030, le premier appareil devant être livré entre 2020 et 2023, dans le but de remplacer les bombardiers Tu-95 « Bear » et Tu-160 « Blackjack »."
 SOV_transport_plane_equipment_1:0 "Douglas DC-3"
 SOV_transport_plane_equipment_1_short:0 "DC-3"
 SOV_transport_plane_equipment_2:0 "Lisunov Li-2T"
 SOV_transport_plane_equipment_2_short:0 "Li-2T"
 SOV_transport_plane_equipment_3:0 "Ilyushin Il-12D"
 SOV_transport_plane_equipment_3_short:0 "Il-12D"
 SOV_transport_plane_equipment_4:0 "Antonov An-12"
 SOV_transport_plane_equipment_4_short:0 "An-12"
 SOV_transport_plane_equipment_5:0 "Antonov An-22"
 SOV_transport_plane_equipment_5_short:0 "An-22"
 SOV_transport_plane_equipment_6:0 "Ilyushin Il-76D"
 SOV_transport_plane_equipment_6_short:0 "Il-76D"
 SOV_transport_plane_equipment_7:0 "Antonov An-124"
 SOV_transport_plane_equipment_7_short:0 "An-124"
 SOV_transport_plane_equipment_8:0 "Antonov An-225"
 SOV_transport_plane_equipment_8_short:0 "An-225"
 SOV_transport_plane_equipment_10:0 "Ilyushin Il-76MD-M"
 SOV_transport_plane_equipment_10_short:0 "Il-76MD-M"
 SOV_cv_CAS_equipment_1:0 "Polikarpov R-5T"
 SOV_cv_CAS_equipment_1_short:0 "R-5T"
 SOV_cv_CAS_equipment_1_desc:0 "Bombardier torpilleur monoplace équipé d'un train d'atterrissage divisé permettant de transporter une torpille ou une bombe de 250 à 500 kg sous le fuselage. Mis en service en 1934, une série de 50 appareils fut construite en 1935. Équipage de deux hommes pour les missions de reconnaissance."
 SOV_cv_CAS_equipment_2:0 "Ilyushin Il-2T Sturmovik"
 SOV_cv_CAS_equipment_2_short:0 "Il-2T Sturmovik"
 SOV_cv_CAS_equipment_2_desc:0 "L'Il-2T est une variante torpilleur-bombardier du célèbre avion d'attaque au sol Il-2 Sturmovik. Afin de gagner du poids pour lui permettre de voler, les deux canons VYa-23 de 23 mm situés sur les ailes ont été retirés. Il pouvait ainsi être équipé d'une seule torpille de 45 cm (18 pouces). Bien que ce modèle n'ait jamais été utilisé sur le terrain, l'idée d'équiper les Sturmoviks de torpilles n'était pas nouvelle, puisque des Il-2M3 avaient été modifiés pour transporter des supports de torpilles pendant les campagnes de Crimée et du Caucase pendant la Seconde Guerre mondiale."
 SOV_cv_CAS_equipment_3:0 "Ilyushin Il-10T"
 SOV_cv_CAS_equipment_3_short:0 "Il-10T"
 SOV_cv_CAS_equipment_3_desc:0 "Cette variante torpilleur-bombardier de l'Il-10 a été développée après la fin des hostilités en Europe et en Mandchourie, contrairement à l'Il-10 dont elle est dérivée. À l'exception d'une brève période au cours de laquelle il a soutenu la Corée du Nord pendant la guerre de Corée, l'Il-10T a connu une existence relativement paisible, avant d'être retiré du service en 1953 au profit d'avions de chasse-bombardiers à réaction basés à terre, tels que le Su-7 Fitter."
 SOV_cv_jet_CAS_equipment_1:0 "Ilyushin Il-10MT"
 SOV_cv_jet_CAS_equipment_1_short:0 "Il-10MT"
 SOV_cv_jet_CAS_equipment_1_desc:0 "Variante améliorée du bombardier torpilleur Ilyushin IL-10T. L'Il-10 a été développé après la fin des hostilités en Europe et en Mandchourie, contrairement à l'Il-10 dont il est issu. Hormis une brève période au service de la Corée du Nord pendant la guerre de Corée, l'Il-10T a connu une existence relativement paisible, avant d'être retiré du service en 1953 au profit d'avions de chasse-bombardiers à réaction basés à terre, tels que le Su-7 Fitter."
 SOV_cv_jet_CAS_equipment_2:0 "Ilyushin Il-20"
 SOV_cv_jet_CAS_equipment_2_short:0 "Il-20"
 SOV_cv_jet_CAS_equipment_2_desc:0 "L'Ilyushin Il-20 était un prototype soviétique d'avion d'attaque au sol lourdement blindé destiné à remplacer l'Ilyushin Il-10. Il présentait un certain nombre de concepts innovants, notamment un cockpit monté au-dessus du moteur, directement derrière l'hélice, et un canon automatique monté sur l'aile qui pouvait être réglé au sol pour tirer à l'horizontale ou incliné à 23° afin de permettre à l'avion de mitrailler des cibles au sol tout en restant en vol horizontal. Cependant, il était plus lent que l'Il-10 et son moteur M-47 posait des problèmes lors des essais en vol en 1948-1949. Il n'a donc pas été mis en production. Les pilotes d'essai ont surnommé cet avion le Gorbach (le bossu)."
 SOV_cv_jet_CAS_equipment_3:0 "Ilyushin Il-40T"
 SOV_cv_jet_CAS_equipment_3_short:0 "Il-40T"
 SOV_cv_jet_CAS_equipment_3_desc:0 "L'Ilyushin Il-40 (nom de code OTAN : Brawny) était un avion d'attaque au sol blindé soviétique à deux places équipé d'un moteur à réaction. Le premier prototype a volé en 1953 et a connu un grand succès, sauf lorsqu'il tirait avec ses canons, car les gaz de combustion perturbaient le flux d'air dans les moteurs et provoquaient leur extinction ou des ratés."
 SOV_cv_jet_CAS_equipment_4:0 "Tupolev Tu-91"
 SOV_cv_jet_CAS_equipment_4_short:0 "Tu-91"
 SOV_cv_jet_CAS_equipment_4_desc:0 "Le Tupolev Tu-91 (nom de code OTAN : Boot) était un avion d'attaque embarqué soviétique. Les consoles sont équipées de deux canons fixes de 23 mm avec 200 cartouches par canon, d'un canon arrière télécommandé DK-15 avec un canon AM-23 ; armement de bombes - 1 x FAB-1500 ou 3 x FAB-500 ou 6 x FAB-250 ou 12 x FAB-100 ; bombes anti-sous-marines d'un calibre de 500 kg ou 100 kg."
 SOV_cv_jet_CAS_equipment_5:0 "Tupolev Tu-91M"
 SOV_cv_jet_CAS_equipment_5_short:0 "Tu-91M"
 SOV_cv_jet_CAS_equipment_5_desc:0 "Variante améliorée du Tupolev Tu-91. Avion d'attaque soviétique embarqué. Les consoles sont équipées de deux canons fixes de 23 mm avec 200 cartouches par canon, d'un canon arrière télécommandé DK-15 avec un canon AM-23 ; armement de bombes - 1 x FAB-1500 ou 3 x FAB-500 ou 6 x FAB-250 ou 12 x FAB-100 ; bombes anti-sous-marines d'un calibre de 500 kg ou 100 kg."
 SOV_cv_jet_CAS_equipment_6:0 "Sukhoi Su-7K"
 SOV_cv_jet_CAS_equipment_6_short:0 "Su-7K"
 SOV_cv_jet_CAS_equipment_6_desc:0 "Variante embarquée du vénérable chasseur-bombardier Sukhoi Su-7 destinée à être utilisée par l'aviation navale soviétique."
 SOV_cv_jet_CAS_equipment_7:0 "Sukhoi Su-17MKG"
 SOV_cv_jet_CAS_equipment_7_short:0 "Su-17MKG"
 SOV_cv_jet_CAS_equipment_7_desc:0 "Variante du Sukhoi Su-17M pour l'aviation navale soviétique. Il a servi de banc d'essai pour les missiles Kh-25 (AS-10 « Karen ») et Kh-29 (AS-14 « Kedge »)."
 SOV_cv_jet_CAS_equipment_8:0 "Mikoyan-Gurevich MiG-23AB"
 SOV_cv_jet_CAS_equipment_8_short:0 "MiG-23AB"
 SOV_cv_jet_CAS_equipment_8_desc:0 "Variante polyvalente basée sur le MiG-23K, elle devait se décliner en trois sous-variantes : le MiG-23AI (chasseur), le MiG-23AB (attaque au sol) et le MiG-23AR (reconnaissance). Cette variante a été annulée pour les mêmes raisons que le MiG-23K."
 SOV_cv_jet_CAS_equipment_9:0 "Mikoyan-Gurevich MiG-27K"
 SOV_cv_jet_CAS_equipment_9_short:0 "MiG-27K"
 SOV_cv_jet_CAS_equipment_9_desc:0 "Le MiG-27K était la variante soviétique la plus avancée, équipée d'un désignateur laser et compatible avec les armes électro-optiques guidées par télévision. Il était équipé du canon GSh-6-30. Officiellement, il n'existait pas de variante embarquée, mais avec son aile en flèche, il aurait pu être adapté à ce rôle."
 SOV_cv_jet_CAS_equipment_10:0 "Sukhoi Su-25UTG"
 SOV_cv_jet_CAS_equipment_10_short:0 "Su-25UTG"
 SOV_cv_jet_CAS_equipment_10_desc:0 "Le Su-25UTG (Uchebno-Trenirovochnyy s Gakom) est une variante du Su-25UB conçue pour former les pilotes au décollage et à l'atterrissage sur un pont d'envol simulé basé à terre, avec une section inclinée en forme de tremplin et des câbles d'arrêt. Le premier exemplaire a volé en septembre 1988 et environ 10 ont été produits. Environ la moitié est restée en service en Russie après 1991 ; ils ont été utilisés sur le seul porte-avions russe, l'Amiral Kuznetsov. Ce petit nombre d'appareils était insuffisant pour répondre aux besoins de formation du groupe aérien russe, c'est pourquoi un certain nombre de Su-25UB ont été convertis en Su-25UTG."
 SOV_cv_fighter_equipment_1:0 "Aviatsiya Voyenno-Morskogo Flota"
 SOV_cv_fighter_equipment_1_short:0 "AV-MF"
 SOV_cv_fighter_equipment_1_desc:0 "L'aviation navale soviétique (AV-MF ou Aviatsiya voyenno-morskogo flota, littéralement « aviation de la flotte militaire maritime ») est la branche aérienne de la marine soviétique. La Morskaya Aviatsiya (aviation navale) était le service aérien de la marine soviétique pendant la Seconde Guerre mondiale. Ces unités aériennes fournissaient un soutien aérien à la Voyenno-Morskoy Flot SSSR (marine soviétique) sur les théâtres d'opérations de la mer de Barents, de la mer Baltique et de la mer Noire, ainsi qu'au détachement naval soviétique dans la mer d'Okhotsk."
 SOV_cv_fighter_equipment_2:0 "Yakovlev Yak-7UTI"
 SOV_cv_fighter_equipment_2_short:0 "Yak-7UTI"
 SOV_cv_fighter_equipment_2_desc:0 "The Yak-7UTI was originally developed as a two-seat trainer aircraft for training the future of Soviet pilots. But the type could be adapted well for carrier operations, utilizing the twin control scheme to ensure that if one pilot got tired, the other could perform just as well. The type could serve in the role of carrier air defense against Nazi German and later American aircraft."
 SOV_cv_fighter_equipment_3:0 "Yakovlev Yak-9UT"
 SOV_cv_fighter_equipment_3_short:0 "Yak-9UT"
 SOV_cv_fighter_equipment_3_desc:0 "Le Yak-9U (VK-107) était armé d'un canon Nudelman N-37 de 37 mm (1,5 pouce) avec 30 cartouches et de deux canons Berezin B-20 de 20 mm (0,79 pouce) avec 120 cartouches chacun, pour une masse totale de 6 kg (13 livres) par rafale d'une seconde. Tout comme le Yak-9TK, il pouvait être converti pour remplacer le N-37 par un B-20 de 20 mm (0,79 pouce), un NS-23 de 23 mm (0,91 pouce) ou un N-45 de 45 mm (1,8 pouce). Les avions de série étaient équipés du NS-23 à la place du canon N-37 comme armement standard."
 SOV_cv_jet_multirole_equipment_1:0 "Yakovlev Yak-15"
 SOV_cv_jet_multirole_equipment_1_short:0 "Yak-15"
 SOV_cv_jet_multirole_equipment_1_desc:0 "Le Yakovlev Yak-15 était un chasseur à turboréacteur soviétique de première génération développé par le bureau d'études Yakovlev (OKB) immédiatement après la Seconde Guerre mondiale. Le fuselage principal était celui du chasseur à moteur à pistons Yakovlev Yak-3, modifié pour accueillir un moteur allemand Junkers Jumo 004 rétro-conçu."
 SOV_cv_jet_multirole_equipment_2:0 "Mikoyan-Gurevich MiG-15K"
 SOV_cv_jet_multirole_equipment_2_short:0 "MiG-15K"
 SOV_cv_jet_multirole_equipment_2_desc:0 "Version navalisée du chasseur à réaction MiG-15 de deuxième génération pour l'aviation navale soviétique."
 SOV_cv_jet_multirole_equipment_3:0 "Mikoyan-Gurevich MiG-17K"
 SOV_cv_jet_multirole_equipment_3_short:0 "MiG-17K"
 SOV_cv_jet_multirole_equipment_3_desc:0 "Variante embarquée proposée du MiG-17."
 SOV_cv_jet_multirole_equipment_4:0 "Mikoyan-Gurevich MiG-19K"
 SOV_cv_jet_multirole_equipment_4_short:0 "MiG-19K"
 SOV_cv_jet_multirole_equipment_4_desc:0 "Chasseur embarqué proposé pour la marine soviétique. Son armement comprenait quatre supports BD-3-56 pouvant accueillir deux bombes de 250 kg. Plus près du fuselage, derrière les niches du châssis, étaient montés des pylônes pour les blocs ORO-57K équipés de NURS ARS-57 de 57 mm."
 SOV_cv_jet_multirole_equipment_5:0 "Mikoyan-Gurevich MiG-19SK"
 SOV_cv_jet_multirole_equipment_5_short:0 "MiG-19SK"
 SOV_cv_jet_multirole_equipment_5_desc:0 "Avion de chasse MiG-19K modernisé avec une nouvelle avionique et des performances moteur améliorées."
 SOV_cv_jet_multirole_equipment_6:0 "Mikoyan-Gurevich MiG-21K"
 SOV_cv_jet_multirole_equipment_6_short:0 "MiG-21K"
 SOV_cv_jet_multirole_equipment_6_desc:0 "Variante embarquée proposée du MiG-21."
 SOV_cv_jet_multirole_equipment_7:0 "Mikoyan-Gurevich MiG-23K"
 SOV_cv_jet_multirole_equipment_7_short:0 "MiG-23K"
 SOV_cv_jet_multirole_equipment_7_desc:0 "MiG-23A « Lightning » - la version embarquée du chasseur MiG-23 a été développée par le bureau d'études A.I. Mikoyan. Le chasseur embarqué devait se distinguer du MiG-23M de série par un nouveau vitrage du cockpit avec un siège pilote surélevé pour une meilleure visibilité, ainsi que par une perche non rétractable pour le ravitaillement en vol. Pour assurer l'atterrissage sur le pont, l'avion devait être équipé d'un train d'atterrissage renforcé et d'un crochet de freinage dans la partie arrière. Ce dernier nécessitait le remplacement d'une grande arête ventrale par deux petites, ainsi que l'augmentation de la surface de la quille."
 SOV_cv_jet_multirole_equipment_8:0 "Mikoyan-Gurevich MiG-23AI"
 SOV_cv_jet_multirole_equipment_8_short:0 "MiG-23AI"
 SOV_cv_jet_multirole_equipment_8_desc:0 "Variante polyvalente basée sur le MiG-23K, elle devait se décliner en trois sous-variantes : le MiG-23AI (chasseur), le MiG-23AB (attaque au sol) et le MiG-23AR (reconnaissance). Cette variante a été annulée pour les mêmes raisons que le MiG-23K."
 SOV_cv_jet_multirole_equipment_9:0 "Sukhoi Su-27K"
 SOV_cv_jet_multirole_equipment_9_short:0 "Su-27K"
 SOV_cv_jet_multirole_equipment_9_desc:0 "Le Sukhoi Su-33 est un chasseur bimoteur de supériorité aérienne tout temps basé sur porte-avions, conçu par Sukhoi et fabriqué par Komsomolsk-on-Amur Aircraft Production Association, dérivé du Su-27 et initialement connu sous le nom de Su-27K. Comparé au Su-27, le Su-33 dispose d'un train d'atterrissage et d'une structure renforcés, d'ailes et de stabilisateurs repliables, le tout pour les opérations sur porte-avions. Le Su-33 est équipé de canards et ses ailes sont plus grandes que celles du Su-27 afin d'augmenter la portance. Le Su-33 dispose de moteurs améliorés et d'un train avant double, et peut être ravitaillé en vol."
 SOV_cv_jet_multirole_equipment_10:0 "Mikoyan-Gurevich MiG-29K"
 SOV_cv_jet_multirole_equipment_10_short:0 "MiG-29K"
 SOV_cv_jet_multirole_equipment_10_desc:0 "Le programme MiG-29K a été relancé en réponse à la décision prise en 2004 par la marine indienne d'acquérir l'ancien porte-avions de la marine soviétique Admiral Gorshkov. Lorsque l'Admiral Gorshkov faisait partie de la flotte soviétique, il s'agissait d'un porte-avions/croiseur hybride utilisant des avions à décollage vertical (V/STOL) ; le pont a donc été réaménagé avec une rampe de décollage et des câbles d'arrêt pour permettre l'utilisation des MiG-29K. L'avion est équipé d'une aile agrandie et repliable, d'un crochet d'arrêt et d'un fuselage renforcé protégé contre la corrosion."
 SOV_cv_mr_stealth_fighter_equipment_1:0 "Su-27KM"
 SOV_cv_mr_stealth_fighter_equipment_1_short:0 "Su-27KM"
 SOV_cv_mr_stealth_fighter_equipment_1_desc:0 "En 1988, la conception préliminaire du prometteur chasseur Su-27KM (« Navire, modernisé ») a été préparée. Elle était basée sur le projet C.32, mais était positionnée différemment. Afin de ne pas embarrasser le client avec une nouveauté excessive, elle lui a été présentée comme une modernisation en profondeur du Su-27K existant (futur Su-33)."
 SOV_jump_jet_equipment_1:0 "Yakovlev Yak-36"
 SOV_jump_jet_equipment_1_short:0 "Yak-36"
 SOV_jump_jet_equipment_1_desc:0 "Le Yak-36 (également connu sous le nom d'Izdeliye V) fut la première tentative soviétique de créer un avion de combat à décollage et atterrissage verticaux (VTOL). Quatre prototypes technologiques ont été construits. Le premier vol a eu lieu en septembre 1963 et, début 1966, l'avion a effectué son premier vol complet, du décollage vertical à l'atterrissage vertical. L'avion a été présenté au public lors du 50e anniversaire de la révolution d'octobre. Après les résultats prometteurs obtenus dans le cadre du programme Yak-36, la phase suivante du développement, le Yak-38, a été approuvée. Il est connu sous le nom de code OTAN « Freehand »."
 SOV_jump_jet_equipment_2:0 "Yakovlev Yak-38"
 SOV_jump_jet_equipment_2_short:0 "Yak-38"
 SOV_jump_jet_equipment_2_desc:0 "Le Yak-38 a été développé à partir du Yak-36 (et était à l'origine désigné Yak-36M), bien que les deux avions aient peu de points communs. Il s'agissait du seul avion de combat VTOL opérationnel de l'aviation navale soviétique et de leur premier avion à voilure fixe basé sur un porte-avions. Le Yak-38 a servi presque exclusivement sur les porte-avions de classe Kiev, entrant en service en 1976. L'avion n'a jamais été utilisé au combat, mais il a intercepté une fois des avions américains de l'U.S.S Enterprise au-dessus de la mer d'Oman. Son nom de code OTAN est Forger-A."
 SOV_jump_jet_equipment_3:0 "Yakovlev Yak-38M"
 SOV_jump_jet_equipment_3_short:0 "Yak-38M"
 SOV_jump_jet_equipment_3_desc:0 "Le Yak-38M était une version améliorée du Yak-38, avec une masse maximale au décollage supplémentaire de 1 000 kg (2 200 lb) et un renforcement des pylônes sous les ailes pour transporter 910 kg (2 000 lb) d'armement. Le Yak-38M est entré en service dans l'aviation navale soviétique. Malgré les améliorations apportées à sa conception, le Forger restait sous-motorisé et s'est finalement révélé décevant. Ce modèle fut retiré du service après l'effondrement de l'Union soviétique en 1991."
 SOV_jump_jet_equipment_4:0 "Yakovlev Yak-41"
 SOV_jump_jet_equipment_4_short:0 "Yak-41"
 SOV_jump_jet_equipment_4_desc:0 "Le Yakovlev Yak-141, également connu sous le nom de Yak-41, est un avion de chasse supersonique à décollage et atterrissage verticaux (VTOL) soviétique conçu par Yakovlev. Cet avion était destiné à remplacer complètement le Yak-38 Forger et était capable d'effectuer des vols supersoniques prolongés et d'égaler les chasseurs terrestres soviétiques. Il effectua son premier vol au début de l'année 1987, puis son premier vol stationnaire en 1989. En 1991, le premier atterrissage vertical sur un porte-avions fut réalisé avec succès. Malgré son potentiel prometteur, le programme Freestyle fut annulé en août 1991 en raison d'un manque de financement."
 SOV_jump_stealth_equipment_1:0 "Yakovlev Yak-43"
 SOV_jump_stealth_equipment_1_short:0 "Yak-43"
 SOV_jump_stealth_equipment_1_desc:0 "Le Yak-43 était un chasseur soviétique à décollage et atterrissage verticaux (VTOL) développé dans le cadre du programme Lyogkiy Frontovoy Istrebitel (chasseur léger de première ligne/LFI). Il était conçu comme la version terrestre du malheureux Yakovlev Yak-141 Freestyle, qui n'a jamais été produit en raison de l'effondrement de l'Union soviétique. Comme le Yak-141, le Yak-43 n'aurait eu qu'un seul moteur principal, ainsi que deux moteurs dédiés au décollage vertical. Malheureusement, comme le Yak-141, il n'a jamais été produit, en partie à cause de l'effondrement de l'Union soviétique."
 SOV_naval_helicopter_equipment_1:0 "Kamov Ka-15"
 SOV_naval_helicopter_equipment_1_short:0 "Ka-15"
