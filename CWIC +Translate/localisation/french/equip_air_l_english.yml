 HOL_scout_helicopter_equipment_4:0 "Messerschmitt-Bölkow-Blohm Bo 105CB"
 HOL_scout_helicopter_equipment_4_short:0 "Bo 105CB"
 HOL_utility_helicopter_equipment_1:0 "Sikorsky S-58 Choctaw"
 HOL_utility_helicopter_equipment_1_short:0 "S-58 Choctaw"
 HOL_utility_helicopter_equipment_2:0 "Agusta Bel AB-204"
 HOL_utility_helicopter_equipment_2_short:0 "AB-204"
 HOL_utility_helicopter_equipment_3:0 "Agusta Bel AB-205"
 HOL_utility_helicopter_equipment_3_short:0 "AB-205"
 HOL_utility_helicopter_equipment_3_desc:0 "Lancé en 1963, l'UH-1D est la version militaire du Bell 205. Il a été conçu avec un fuselage allongé afin de pouvoir servir principalement comme hélicoptère de transport de troupes en remplacement du CH-34 Choctaw utilisé auparavant par l'armée américaine. 2 000 exemplaires de cette variante « Iroquois D » ont été construits, dont beaucoup ont été convertis à la norme UH-1H avec un moteur amélioré et plus puissant."
 HOL_utility_helicopter_equipment_4:0 "Westland Lynx UH-14A"
 HOL_utility_helicopter_equipment_4_short:0 "Lynx UH-14A"
 HOL_utility_helicopter_equipment_5:0 "Aérospatiale AS532 Cougar UL"
 HOL_utility_helicopter_equipment_5_short:0 "AS532 Cougar UL"
 HOL_utility_helicopter_equipment_6:0 "Aérospatiale AS532 Cougar U2"
 HOL_utility_helicopter_equipment_6_short:0 "AS532 Cougar U2"
 HOL_utility_helicopter_equipment_7:0 "Aérospatiale AS532 Cougar U2 NLD"
 HOL_utility_helicopter_equipment_7_short:0 "AS532 Cougar U2 NLD"
 HOL_cargo_helicopter_equipment_4:0 "Boeing CH-147C Chinook"
 HOL_cargo_helicopter_equipment_4_short:0 "CH-147C Chinook"
 HOL_cargo_helicopter_equipment_4_desc:0 "Désignation canadienne du CH-47. Les CH-47 modifiés par le Canada ont été acceptés par la RNLAF dans les années 1990, mais auraient pu l'être plus tôt."
 HOL_cargo_helicopter_equipment_5:0 "Boeing CH-47D Chinook Block II"
 HOL_cargo_helicopter_equipment_5_short:0 "CH-47D Block II"
 HOL_cargo_helicopter_equipment_5_desc:0 "CH-47D modernisé avec une avionique avancée, des instruments GPS et une amélioration de la capacité de survie. Presque tous les anciens Chinook ont été mis à niveau selon cette norme."
 HOL_cargo_helicopter_equipment_6:0 "Boeing CH-47F Chinook"
 HOL_cargo_helicopter_equipment_6_short:0 "CH-47F Chinook"
 HOL_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, une version améliorée du CH-47D, a effectué son vol inaugural ; le premier modèle de série a été présenté le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les améliorations comprennent des moteurs Honeywell de 4 868 chevaux-vapeur (3 630 kW) et une cellule plus robuste, construite d'une seule pièce afin de réduire les besoins d'entretien. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion afin d'augmenter la durée de vie."
