 DEN_jet_CAS_equipment_1:0 "Republic F-84E Thunderjet"
 DEN_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 DEN_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 DEN_jet_CAS_equipment_2:0 "Republic F-84G Thunderjet"
 DEN_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 DEN_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 DEN_jet_CAS_equipment_3:0 "Republic F-84F Thunderstreak"
 DEN_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 DEN_jet_CAS_equipment_3_desc:0 "Développé à partir du F-84 Thunderjet précédent, le F-84F était une variante à ailes en flèche du chasseur-bombardier, conçue pour rapprocher ce type d'appareil des performances du très vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances au décollage, tout en offrant une stabilité et un contrôle médiocres. Ce modèle a été utilisé de manière limitée tout au long de sa carrière, qui s'est terminée en 1971. Son surnom est « Thunderstreak »."
 DEN_jet_CAS_equipment_4:0 "North American F-100D Super Sabre"
 DEN_jet_CAS_equipment_4_short:0 "F-100D Super Sabre"
 DEN_jet_CAS_equipment_4_desc:0 "Chasseur-bombardier monoplace, avionique plus avancée, ailes et dérive plus grandes, volets d'atterrissage. Le F-100 a remplacé le F-84G Thunderjet en tant que chasseur d'attaque pour la Royal Danish Air Force."
 DEN_jet_CAS_equipment_6:0 "SAAB A-35XD Draken"
 DEN_jet_CAS_equipment_6_short:0 "A-35XD Draken"
 DEN_jet_CAS_equipment_6_desc:0 "Lorsque l'armée de l'air danoise (Flyvevåbnet) a dû choisir un avion pour compléter le F-100D au milieu des années 1960, elle a cherché un modèle de base pouvant être adapté à la fois à la défense aérienne, à l'attaque au sol et à la reconnaissance. Le Danemark s'est donc tourné vers Saab et a demandé un chasseur-bombardier basé sur le J-35F. La nouvelle variante a d'abord été baptisée 35X, mais après avoir reçu les spécifications danoises, qui prévoyaient des pylônes supplémentaires sur les ailes intérieures et extérieures, pour un total de 9 pylônes, Saab a nommé l'avion A35XD."
 DEN_fighter_equipment_0:0 "Gloster Gauntlet"
 DEN_fighter_equipment_0_short:0 "Gauntlet"
 DEN_fighter_equipment_1:0 "Supermarine Spitfire F Mk.IIb"
 DEN_fighter_equipment_1_short:0 "Spitfire F Mk.IIb"
 DEN_fighter_equipment_2:0 "Supermarine Spitfire F Mk.IX"
 DEN_fighter_equipment_2_short:0 "Spitfire F Mk.IX"
 DEN_fighter_equipment_3:0 "Supermarine Spitfire LF.IXe"
 DEN_fighter_equipment_3_short:0 "Spitfire LF.IXe"
 DEN_jet_multirole_equipment_1:0 "Supermarine Spitfire F Mk.24"
 DEN_jet_multirole_equipment_1_short:0 "Spitfire F Mk.24"
 DEN_jet_multirole_equipment_3:0 "Hawker Hunter F.1"
 DEN_jet_multirole_equipment_3_short:0 "Hunter F.1"
 DEN_jet_multirole_equipment_4:0 "North American F-100 Super Sabre"
 DEN_jet_multirole_equipment_4_short:0 "F-100 Super Sabre"
 DEN_jet_multirole_equipment_4_desc:0 "Le North American F-100 Super Sabre est un avion de chasse supersonique américain qui a été utilisé par la Flyvevåbnet danoise de 1959 à 1961 dans le cadre du programme Mutual Defense Assistance Act visant à doter les membres européens de l'OTAN de capacités aériennes plus modernes."
 DEN_jet_multirole_equipment_5:0 "Lockheed F-104G Starfighter"
 DEN_jet_multirole_equipment_5_short:0 "F-104G Starfighter"
 DEN_jet_multirole_equipment_5_desc:0 "Le Danemark a initialement reçu 25 F-104G et quatre TF-104G dans le cadre de la loi sur l'assistance mutuelle en matière de défense. Au total, 51 Starfighters ont été exploités par le Danemark avant leur retrait en 1986."
 DEN_jet_multirole_equipment_7:0 "Saab F-35 Draken"
 DEN_jet_multirole_equipment_7_short:0 "F-35 Draken"
 DEN_jet_multirole_equipment_7_desc:0 "Lorsque l'armée de l'air danoise (Flyvevåbnet) a dû choisir un avion pour compléter le F-100D au milieu des années 1960, elle a cherché un modèle de base pouvant être adapté à la fois à la défense aérienne, à l'attaque au sol et à la reconnaissance. L'armée de l'air royale danoise a décidé d'utiliser la désignation F-35 (F = Fighter, chasseur)."
 DEN_jet_multirole_equipment_8:0 "Fokker F-16A Fighting Falcon"
 DEN_jet_multirole_equipment_8_short:0 "F-16A Fighting Falcon"
 DEN_jet_multirole_equipment_8_desc:0 "Un chasseur maniable et léger, offrant un équilibre parfait entre maniabilité et stabilité. Il est doté d'un fuselage monocoque exceptionnellement léger et aérodynamique, et bien qu'il s'agisse d'un avion monomoteur, il est équipé d'un moteur puissant. Surnommé le « Fighting Falcon », son coût relativement faible et sa puissance élevée expliquent pourquoi il a été adopté par les forces aériennes du monde entier. À ce jour, plus de 4 000 exemplaires de ce modèle à succès ont été fabriqués."
 DEN_jet_multirole_equipment_9:0 "Fokker F-16A Block 15 OCU (améliorations des capacités opérationnelles) Fighting Falcon"
 DEN_jet_multirole_equipment_9_short:0 "F-16A Block 15 OCU"
 DEN_jet_multirole_equipment_9_desc:0 "Première modification majeure apportée au F-16, l'avion Block 15 était équipé de stabilisateurs horizontaux plus grands, de deux points d'emport supplémentaires au niveau de l'entrée d'air sous le nez, d'un nouveau radar et d'une capacité accrue pour les pylônes sous les ailes. Cette variante était également équipée d'une radio UHF (ultra haute fréquence) de dernière génération. Il s'agit de la variante la plus répandue parmi les modèles F-16."
 DEN_jet_multirole_equipment_10:0 "Fokker F-16AM Block 15 MLU (mise à niveau à mi-vie) Fighting Falcon"
 DEN_jet_multirole_equipment_10_short:0 "F-16AM Block 15 MLU"
 DEN_jet_multirole_equipment_10_desc:0 "Le programme F-16 Mid-Life Update (MLU) qui en a résulté a été conçu pour moderniser le cockpit et l'avionique afin de les rendre équivalents à ceux du F-16C/D Block 50/52, ajouter la capacité d'utiliser des missiles air-air guidés par radar et, de manière générale, améliorer les performances opérationnelles, la fiabilité, la facilité d'entretien et la maintenabilité de l'avion."
