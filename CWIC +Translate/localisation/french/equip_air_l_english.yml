 BEL_heavy_fighter_equipment_3_short:0 "Mosquito F Mk.II"
 BEL_jet_interceptor_equipment_1:0 "SABCA Meteor F.4"
 BEL_jet_interceptor_equipment_1_short:0 "Meteor F.4"
 BEL_jet_interceptor_equipment_2:0 "SABCA Meteor F.8"
 BEL_jet_interceptor_equipment_2_short:0 "Meteor F.8"
 BEL_jet_interceptor_equipment_3:0 "SABCA CF-100 Canuck Mk.3"
 BEL_jet_interceptor_equipment_3_short:0 "CF-100 Canuck Mk.3"
 BEL_jet_interceptor_equipment_3_desc:0 "La société belge SABCA a produit une variante de l'intercepteur Avro Canada CF-100 Canuck pour l'armée de l'air royale belge."
 BEL_jet_interceptor_equipment_4:0 "SABCA CF-100 Canuck Mk.5"
 BEL_jet_interceptor_equipment_4_short:0 "CF-100 Canuck Mk.5"
 BEL_jet_interceptor_equipment_4_desc:0 "La société belge SABCA a produit une variante de l'intercepteur Avro Canada CF-100 Canuck pour l'armée de l'air royale belge."
 BEL_CAS_equipment_1:0 "Avions Fairey Battle"
 BEL_CAS_equipment_1_short:0 "Bataille"
 BEL_CAS_equipment_2:0 "SABCA S.47"
 BEL_CAS_equipment_2_short:0 "S.47"
 BEL_CAS_equipment_3:0 "Hawker Typhoon Mk.Ib/Late"
 BEL_CAS_equipment_3_short:0 "Typhoon Mk.Ib/Late"
 BEL_CAS_equipment_3_desc:0 "Le Hawker Typhoon était un avion de chasse-bombardier britannique principalement utilisé par la Royal Air Force (RAF) pendant la Seconde Guerre mondiale. Le Typhoon Mk.Ib/Late était une version améliorée des premiers Hawker Typhoon, dotée d'une nouvelle verrière en forme de bulle."
 BEL_CAS_equipment_4:0 "Hawker Tempest Mk.II"
 BEL_CAS_equipment_4_short:0 "Tempest Mk.II"
 BEL_jet_CAS_equipment_1:0 "SABCA F-84E Thunderjet"
 BEL_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 BEL_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 BEL_jet_CAS_equipment_2:0 "SABCA F-84G Thunderjet"
 BEL_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 BEL_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 BEL_jet_CAS_equipment_3:0 "SABCA F-84F Thunderstreak"
 BEL_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 BEL_jet_CAS_equipment_3_desc:0 "Développé à partir du F-84 Thunderjet précédent, le F-84F était une variante à ailes en flèche du chasseur-bombardier, conçue pour rapprocher ce type d'appareil des performances du très vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances au décollage, tout en offrant une stabilité et un contrôle médiocres. Ce modèle a été utilisé de manière limitée tout au long de sa carrière, qui s'est terminée en 1971. Son surnom est « Thunderstreak »."
 BEL_jet_CAS_equipment_6:0 "SABCA Mirage 5BA"
 BEL_jet_CAS_equipment_6_short:0 "Mirage 5BA"
 BEL_jet_CAS_equipment_6_desc:0 "Le Dassault Mirage 5 est un avion d'attaque supersonique conçu en France par Dassault Aviation et fabriqué en France ainsi que dans plusieurs autres pays sous licence. Il est dérivé du célèbre chasseur Mirage III de Dassault."
 BEL_tac_bomber_equipment_0:0 "SABCA DH.4"
 BEL_tac_bomber_equipment_0_short:0 "SABCA DH.4"
 BEL_tac_bomber_equipment_1:0 "LACAB GR.8"
 BEL_tac_bomber_equipment_1_short:0 "GR.8"
