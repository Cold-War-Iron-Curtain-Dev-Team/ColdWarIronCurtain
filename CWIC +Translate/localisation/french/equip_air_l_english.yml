 ISR_mr_stealth_fighter_equipment_1_desc:0 "Le F-35I Adir, qui signifie « impressionnant » ou « puissant », est un F-35A ayant subi des modifications spécifiques à Israël. Les États-Unis ont initialement refusé d'autoriser ces modifications avant de permettre à Israël d'intégrer ses propres systèmes de guerre électronique, notamment des capteurs et des contre-mesures. L'ordinateur principal dispose d'une fonction plug-and-play pour les systèmes supplémentaires ; les propositions comprennent un pod de brouillage externe, ainsi que de nouveaux missiles air-air et bombes guidées israéliens dans les baies d'armes internes."
