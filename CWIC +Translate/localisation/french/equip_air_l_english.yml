 NOR_fighter_equipment_0:0 "F.F. 7 Hauk"
 NOR_fighter_equipment_0_short:0 "Hauk"
 NOR_fighter_equipment_1:0 "Supermarine Spitfire F Mk.IIb"
 NOR_fighter_equipment_1_short:0 "Spitfire F Mk.IIb"
 NOR_fighter_equipment_2:0 "Supermarine Spitfire F Mk.IX"
 NOR_fighter_equipment_2_short:0 "Spitfire F Mk.IX"
 NOR_fighter_equipment_3:0 "Supermarine Spitfire LF.IXe"
 NOR_fighter_equipment_3_short:0 "Spitfire LF.IXe"
 NOR_jet_multirole_equipment_1:0 "De Havilland Vampire F.3"
 NOR_jet_multirole_equipment_1_short:0 "Vampire F.3"
 NOR_jet_multirole_equipment_1_desc:0 "Le Vampire avait pour fonction d'initier les pilotes de chasse canadiens non seulement à la propulsion à réaction, mais aussi à d'autres équipements tels que la pressurisation du cockpit et le train d'atterrissage tricycle. Il s'est avéré être un avion très apprécié, facile à piloter et souvent considéré comme un « bolide ». Au Canada, le Vampire a été utilisé à la fois dans des unités opérationnelles et dans des unités de réserve aérienne (escadrons 400, 401, 402, 411, 438 et 442)."
 NOR_jet_multirole_equipment_2:0 "North American F-86A Sabre"
 NOR_jet_multirole_equipment_2_short:0 "F-86A Sabre"
 NOR_jet_multirole_equipment_2_desc:0 "Le F-86 est un avion de chasse à réaction à ailes en flèche développé et mis en service à la fin des années 1940 à partir des recherches capturées par les Allemands. La conception de cet avion lui permettait d'atteindre des vitesses transsoniques et une grande maniabilité, des caractéristiques qui lui permettaient de rivaliser avec son célèbre concurrent, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, avec ses variantes canadiennes et australiennes, est l'avion de chasse occidental le plus produit de l'histoire de l'aviation."
 NOR_jet_multirole_equipment_3:0 "North American F-86F Sabre"
 NOR_jet_multirole_equipment_3_short:0 "F-86F Sabre"
 NOR_jet_multirole_equipment_3_desc:0 "Système de commandes de vol amélioré et « empennage entièrement mobile » (Ce système a été remplacé par une commande entièrement motorisée avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche toujours conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur). Les Sabre F bénéficiaient d'une agilité à haute vitesse nettement améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 NOR_jet_multirole_equipment_4:0 "North American F-86F-30-NA Sabre"
 NOR_jet_multirole_equipment_4_short:0 "F-86F-30-NA Sabre"
 NOR_jet_multirole_equipment_4_desc:0 "Améliorations supplémentaires apportées au F-86F Sabre pour le rendre plus efficace au combat contre les avions plus récents équipés de postcombustion, en l'armant de points d'emport et de rails pour le lancement de missiles AIM-9B Sidewinder."
 NOR_jet_multirole_equipment_5:0 "Canadair F-104G Starfighter"
 NOR_jet_multirole_equipment_5_short:0 "F-104G Starfighter"
 NOR_jet_multirole_equipment_5_desc:0 "Le Canadair CF-104 Starfighter (CF-111, CL-90) est une version modifiée du chasseur supersonique Lockheed F-104 Starfighter, construit au Canada par Canadair sous licence. Il était principalement utilisé comme avion d'attaque au sol, bien qu'il ait été conçu comme intercepteur. Il a servi dans l'Aviation royale canadienne (ARC), puis dans les Forces armées canadiennes (FAC)."
 NOR_jet_multirole_equipment_8:0 "Fokker F-16A Fighting Falcon"
 NOR_jet_multirole_equipment_8_short:0 "F-16A Fighting Falcon"
 NOR_jet_multirole_equipment_8_desc:0 "Un chasseur maniable et léger, offrant un équilibre parfait entre maniabilité et stabilité. Il est doté d'un fuselage monocoque exceptionnellement léger et aérodynamique, et bien qu'il s'agisse d'un avion monomoteur, il est équipé d'un moteur puissant. Surnommé le « Fighting Falcon », son coût relativement faible et sa puissance élevée expliquent pourquoi il a été adopté par les forces aériennes du monde entier. À ce jour, plus de 4 000 exemplaires de ce modèle à succès ont été fabriqués."
 NOR_jet_multirole_equipment_9:0 "Fokker F-16A Block 15 OCU (améliorations des capacités opérationnelles) Fighting Falcon"
 NOR_jet_multirole_equipment_9_short:0 "F-16A Block 15 OCU"
 NOR_jet_multirole_equipment_9_desc:0 "Première modification majeure apportée au F-16, l'avion Block 15 était équipé de stabilisateurs horizontaux plus grands, de deux points d'emport supplémentaires au niveau de l'entrée d'air sous le nez, d'un nouveau radar et d'une capacité accrue pour les pylônes sous les ailes. Cette variante était également équipée d'une radio UHF (ultra haute fréquence) de dernière génération. Il s'agit de la variante la plus répandue parmi les modèles F-16."
 NOR_jet_multirole_equipment_10:0 "Fokker F-16AM Block 15 MLU (mise à niveau à mi-vie) Fighting Falcon"
 NOR_jet_multirole_equipment_10_short:0 "F-16AM Block 15 MLU"
 NOR_jet_multirole_equipment_10_desc:0 "Le programme F-16 Mid-Life Update (MLU) qui en a résulté a été conçu pour moderniser le cockpit et l'avionique afin de les rendre équivalents à ceux du F-16C/D Block 50/52, ajouter la capacité d'utiliser des missiles air-air guidés par radar et, de manière générale, améliorer les performances opérationnelles, la fiabilité, la facilité d'entretien et la maintenabilité de l'avion."
 NOR_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 NOR_mr_stealth_fighter_equipment_1_short:0 "F-35A Lightning II"
 NOR_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnels (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le programme F-35 a débuté en 1992, la variante A ayant pris son envol fin 2006 et largué ses premières bombes moins de six ans plus tard. La variante A est la plus petite et la plus légère des variantes du F-35. Elle est principalement destinée à remplacer le F-16 Fighting Falcon."
 NOR_heavy_fighter_equipment_1:0 "Bristol Blenheim"
 NOR_heavy_fighter_equipment_1_short:0 "Blenheim"
 NOR_heavy_fighter_equipment_2:0 "Bristol Beaufighter"
 NOR_heavy_fighter_equipment_2_short:0 "Beaufighter"
 NOR_heavy_fighter_equipment_3:0 "de Havilland Mosquito F Mk.II"
