 irbm_equipment_1:0 "IRBM I"
 irbm_equipment_1_short:0 "IRBM I"
 irbm_equipment_1_desc:0 "Les IRBM sont des missiles balistiques à portée intermédiaire d'une portée de 3 000 à 5 500 km, situés entre les missiles balistiques à moyenne portée (MRBM) et les missiles balistiques intercontinentaux (ICBM). La classification des missiles balistiques en fonction de leur portée est principalement effectuée pour des raisons pratiques ; en principe, il y a très peu de différence entre un ICBM à faible performance et un IRBM à haute performance, car la diminution de la masse de la charge utile peut augmenter la portée au-delà du seuil des ICBM."
