 WGR_jet_recon_equipment_2_short:0 "Tornado ECR"
 WGR_jet_recon_equipment_2_desc:0 "Version de guerre électronique du Panavia Tornado en service en Allemagne de l'Ouest. Il pouvait être équipé de missiles SEAD et de brouilleurs pour combattre les batteries de missiles sol-air soviétiques. Mais il jouait également un rôle de reconnaissance grâce à ses nacelles photographiques."
