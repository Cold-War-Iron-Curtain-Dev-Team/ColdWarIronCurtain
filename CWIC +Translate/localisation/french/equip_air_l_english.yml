 SPR_transport_plane_equipment_7:0 "CASA C-212-100 Aviocar"
 SPR_transport_plane_equipment_7_short:0 "C-212-100 Aviocar"
 SPR_transport_plane_equipment_8:0 "CASA CN-235"
 SPR_transport_plane_equipment_8_short:0 "CN-235"
 SPR_transport_plane_equipment_10:0 "CASA C-295"
 SPR_transport_plane_equipment_10_short:0 "C-295"
 SPR_nav_bomber_equipment_1:0 "Heinkel He 114 "
 SPR_nav_bomber_equipment_1_short:0 "He 114 "
 SPR_nav_bomber_equipment_2:0 "Dornier Do 24"
 SPR_nav_bomber_equipment_2_short:0 "Do 24"
 SPR_nav_bomber_equipment_3:0 "Consolidated PBY-5A Catalina"
 SPR_nav_bomber_equipment_3_short:0 "PBY-5A Catalina"
 SPR_nav_bomber_equipment_4:0 "Grumman SHU-16B Albatross"
 SPR_nav_bomber_equipment_4_short:0 "SHU-16B Albatross"
 SPR_nav_bomber_equipment_5:0 "Grumman SHU-16D Albatross"
 SPR_nav_bomber_equipment_5_short:0 "SHU-16D Albatross"
 SPR_nav_bomber_equipment_6:0 "Lockheed P-3 Orion"
 SPR_nav_bomber_equipment_6_short:0 "P-3A Orion"
 SPR_nav_bomber_equipment_6_desc:0 "Le P-3A (initialement désigné P3V), basé sur l'avion de ligne Lockheed L-188 Electra, a été conçu pour remplacer les anciens P-2 Neptune et P-5 Marlin dans le cadre de missions de patrouille maritime et de lutte anti-sous-marine (ASW) à partir de la terre ferme. Il dispose d'une soute interne pour les torpilles lancées depuis les airs, avec des pylônes sous les ailes pouvant accueillir une multitude d'armes, notamment des missiles antinavires à longue portée, des missiles air-sol, des mines et des grenades sous-marines. Il est également équipé d'un détecteur d'anomalies magnétiques à l'arrière pour détecter les sous-marins à l'aide du champ magnétique terrestre. Avec de tels outils à sa disposition et continuant à remplir son rôle depuis son introduction en 1962, il est tout à fait approprié que cet avion soit surnommé « Orion », le chasseur de navires ennemis."
 SPR_nav_bomber_equipment_7:0 "CASA CN-235 MPA"
 SPR_nav_bomber_equipment_7_short:0 "CN-235 MPA"
 SPR_nav_bomber_equipment_8:0 "CASA C-295 MPA"
 SPR_nav_bomber_equipment_8_short:0 "C-295 MPA"
 SPR_jump_jet_equipment_1:0 "Hawker Siddeley AV-8A Harrier"
 SPR_jump_jet_equipment_1_short:0 "AV-8A Harrier"
 SPR_jump_jet_equipment_1_desc:0 "Cet avion d'attaque a été développé pour faire du VTOL (décollage et atterrissage verticaux) une réalité. Il présente une conception unique avec des ailes montées en hauteur et quatre tuyères rotatives. Cela lui permet d'opérer dans des espaces restreints tels que les porte-avions légers et les petits aérodromes. Cet avion est communément appelé « Harrier ». Développé en Grande-Bretagne, l'AV-8A est connu dans ce pays sous le nom de Harrier Mk. 50 et fonctionnait de manière similaire aux Harrier GR.1 de la Royal Air Force."
 SPR_jump_jet_equipment_2:0 "Hawker Siddeley AV-8S Matador"
 SPR_jump_jet_equipment_2_short:0 "AV-8S Matador"
 SPR_jump_jet_equipment_2_desc:0 "La variante « C » est une version améliorée de l'AV-8A et fonctionne avec des systèmes similaires à ceux du Harrier GR.3, avec un nouvel équipement ECM et un système de navigation inertielle."
 SPR_jump_jet_equipment_3:0 "McDonnell Douglas AV-8B Harrier II"
 SPR_jump_jet_equipment_3_short:0 "AV-8B Harrier II"
 SPR_jump_jet_equipment_3_desc:0 "Le Harrier II est un projet conjoint anglo-américain conçu par McDonnell Douglas en collaboration avec British Aerospace. En service dans le Corps des Marines des États-Unis depuis 1985, le « Harrier II » a été considéré comme un outil important dans de nombreux conflits américains récents."
 SPR_jump_jet_equipment_4:0 "McDonnell Douglas AV-8B Harrier II Plus"
 SPR_jump_jet_equipment_4_short:0 "AV-8B Harrier II Plus"
 SPR_jump_jet_equipment_4_desc:0 "Version améliorée de l'AV-8B, l'AV-8B Plus est équipé d'un moteur plus puissant, d'un système radar et d'une caméra infrarouge, ce qui en fait un excellent avion d'attaque nocturne."
 SPR_naval_helicopter_equipment_1:0 "Sikorsky SH-19 Chickasaw ASW"
 SPR_naval_helicopter_equipment_1_short:0 "SH-19 ASW"
 SPR_naval_helicopter_equipment_2:0 "Bell UH-1B Iroquois ASW"
 SPR_naval_helicopter_equipment_2_short:0 "UH-1B ASW"
 SPR_naval_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connus sous le nom de « Huey » (du nom de sa désignation d'origine avant 1962, HU-1), l'UH-1A est la variante militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agit du premier hélicoptère utilisé par l'armée américaine à être équipé d'un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication des États-Unis dans la guerre du Vietnam. Bien qu'il soit communément appelé « Huey », son surnom officiel est « Iroquois »."
 SPR_naval_helicopter_equipment_4:0 "Sikorsky SH-3H Sea King"
 SPR_naval_helicopter_equipment_4_short:0 "SH-3H Sea King"
 SPR_naval_helicopter_equipment_4_desc:0 "Dérivé du Sikorsky S-61 civil, le SH-3 (désignation originale HSS-2) est un hélicoptère de lutte anti-sous-marine (ASM) bimoteur. Premier hélicoptère amphibie au monde, il pouvait décoller aussi bien de la terre que de la mer. Avec le Seasprite, il fut également l'un des premiers hélicoptères ASM à utiliser des turbomoteurs. Outre ses missions ASM, le SH-3 était aussi utilisé pour la recherche et le sauvetage (SAR), le transport, l'évacuation sanitaire et la détection aéroportée (AEW). Plusieurs exemplaires furent même utilisés comme « Marine One », l'hélicoptère de transport officiel des présidents américains. C'est pourquoi il gagna le surnom de « Roi des mers », considéré comme l'un des hélicoptères les plus polyvalents au monde."
 SPR_naval_helicopter_equipment_5:0 "Agusta-Bell SH-212A"
 SPR_naval_helicopter_equipment_5_short:0 "SH-212A"
 SPR_naval_helicopter_equipment_5_desc:0 "Le SH-60 est la variante utilisée par la marine américaine de l'hélicoptère UH-60 Blackhawk de l'armée américaine (lui-même une variante militaire du Sikorsky S-70). Bien qu'il ait remplacé le Sea King, le SH-60 n'a pas de capacité d'atterrissage amphibie, mais il conserve la capacité du SH-2 d'atterrir sur n'importe quel navire américain capable d'accueillir des hélicoptères. Capable d'assumer bon nombre des mêmes rôles que le SH-3, le « Sea Hawk » représente l'avenir de l'aviation hélicoptère de la marine américaine."
 SPR_naval_helicopter_equipment_6:0 "Sikorsky SH-60F Seahawk"
 SPR_naval_helicopter_equipment_6_short:0 "SH-60F Seahawk"
 SPR_naval_helicopter_equipment_6_desc:0 "Le SH-60F servait principalement d'appareil de lutte anti-sous-marine (ASW) au groupe aéronaval. L'hélicoptère traquait les sous-marins à l'aide de son sonar à immersion AQS-13F et était équipé d'un lanceur de bouées acoustiques à 6 tubes. Le SH-60F est officieusement baptisé « Oceanhawk ». Le SH-60F peut transporter des torpilles Mk 46, Mk 50 ou Mk 54 comme armes offensives, et dispose d'un choix de mitrailleuses montées sur le fuselage, notamment les M60D, M240D et GAU-16 (calibre .50) pour l'autodéfense."
 SPR_naval_helicopter_equipment_7:0 "NHIndustries NH90 NFH"
 SPR_naval_helicopter_equipment_7_short:0 "NH90 NFH"
 SPR_attack_helicopter_equipment_1:0 "Bell AH-1G Cobra"
 SPR_attack_helicopter_equipment_1_short:0 "AH-1G Cobra"
 SPR_attack_helicopter_equipment_1_desc:0 "Initialement introduit en 1966 comme hélicoptère d'attaque provisoire, l'AH-1 (développé avec une certaine compatibilité avec l'UH-1 Huey Iroquois) a été utilisé dans les mêmes rôles que ceux prévus pour l'AH-56 pendant son cycle de développement. Il a souvent été déployé dans des formations de chasseurs-tueurs, le rôle de « tueur » étant assuré par l'OH-6 Cayuse, tous deux ayant servi avec distinction pendant la guerre du Vietnam. Bien que son surnom officiel soit « Cobra », il existe d'autres surnoms, notamment « HueyCobra » et « Snake »."
 SPR_attack_helicopter_equipment_2:0 "Agusta-Bell AB-212 Gunship"
 SPR_attack_helicopter_equipment_2_short:0 "AB-212 Gunship"
 SPR_attack_helicopter_equipment_5:0 "Eurocopter UHT Tiger"
 SPR_attack_helicopter_equipment_5_short:0 "UHT Tiger"
 SPR_scout_helicopter_equipment_1:0 "Hughes OH-6 Cayuse"
 SPR_scout_helicopter_equipment_1_short:0 "OH-6 Cayuse"
 SPR_scout_helicopter_equipment_1_desc:0 "Développé en 1960, l'OH-6 a été conçu dans le cadre du projet Light Observation Helicopter (LOH) à des fins d'observation, d'évacuation des blessés, de transport de personnel et d'attaque légère. Le modèle de Hughes a été retenu parmi onze autres modèles concurrents. Il a remplacé l'O-1 Bird Dog dans son rôle d'observation lorsque le ministère américain de la Défense a ordonné à l'armée américaine de transférer tous ses avions à voilure fixe à l'armée de l'air américaine. S'illustrant pendant la guerre du Vietnam, l'OH-6 avait démontré l'utilité des hélicoptères d'observation pour soutenir les hélicoptères d'attaque comme l'AH-1 ou les forces terrestres dans leurs combats contre l'ennemi. Officiellement connu sous le nom de « Cayuse » (d'après la tribu amérindienne du nord-ouest du Pacifique), les pilotes lui ont donné le surnom de « Loach » d'après le programme qui l'a vu naître."
 SPR_scout_helicopter_equipment_2:0 "Hughes OH-6M Cayuse"
 SPR_scout_helicopter_equipment_2_short:0 "OH-6M Cayuse"
 SPR_scout_helicopter_equipment_3:0 "Messerschmitt-Bölkow-Blohm Bo 105C"
 SPR_scout_helicopter_equipment_3_short:0 "Bo 105C"
 SPR_scout_helicopter_equipment_4:0 "Messerschmitt-Bölkow-Blohm Bo 105GSH"
 SPR_scout_helicopter_equipment_4_short:0 "Bo 105GSH"
 SPR_scout_helicopter_equipment_5:0 "Eurocopter EC135"
 SPR_scout_helicopter_equipment_5_short:0 "EC135"
 SPR_utility_helicopter_equipment_1:0 "Sikorsky H-19 Chickasaw"
 SPR_utility_helicopter_equipment_1_short:0 "H-19 Chickasaw"
 SPR_utility_helicopter_equipment_2:0 "Agusta-Bell AB-204"
 SPR_utility_helicopter_equipment_2_short:0 "AB-204"
 SPR_utility_helicopter_equipment_3:0 "Agusta-Bell AB-205"
 SPR_utility_helicopter_equipment_3_short:0 "AB-205"
 SPR_utility_helicopter_equipment_4:0 "Dornier UH-1H Huey"
 SPR_utility_helicopter_equipment_4_short:0 "UH-1H Huey"
 SPR_utility_helicopter_equipment_5:0 "Aérospatiale AS532 Cougar UL"
 SPR_utility_helicopter_equipment_5_short:0 "AS532 Cougar UL"
 SPR_utility_helicopter_equipment_6:0 "Aérospatiale AS332B1 Super Puma"
 SPR_utility_helicopter_equipment_6_short:0 "AS332B1 Super Puma"
 SPR_utility_helicopter_equipment_7:0 "NHIndustries NH90 TTH"
 SPR_utility_helicopter_equipment_7_short:0 "NH90 TTH"
 SPR_cargo_helicopter_equipment_5:0 "Boeing CH-47D Chinook Block II"
 SPR_cargo_helicopter_equipment_5_short:0 "CH-47D Block II"
 SPR_cargo_helicopter_equipment_5_desc:0 "CH-47D modernisé avec une avionique avancée, des instruments GPS et une amélioration de la capacité de survie. Presque tous les anciens Chinook ont été mis à niveau selon cette norme."
 SPR_cargo_helicopter_equipment_6:0 "Boeing CH-47F Chinook"
 SPR_cargo_helicopter_equipment_6_short:0 "CH-47F Chinook"
 SPR_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, une version améliorée du CH-47D, a effectué son vol inaugural ; le premier modèle de série a été présenté le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les améliorations comprennent des moteurs Honeywell de 4 868 chevaux-vapeur (3 630 kW) et une cellule plus robuste, construite d'une seule pièce afin de réduire les besoins d'entretien. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion afin d'augmenter la durée de vie."
 POR_heavy_fighter_equipment_1:0 "Bristol Blenheim Mk.IV"
 POR_heavy_fighter_equipment_1_short:0 "Blenheim Mk.IV"
 POR_heavy_fighter_equipment_2:0 "Bristol Blenheim IVF Mk.V"
 POR_heavy_fighter_equipment_2_short:0 "Blenheim IVF Mk.V"
 POR_heavy_fighter_equipment_3:0 "Lockheed P-38L Lightning"
 POR_heavy_fighter_equipment_3_short:0 "P-38L Lightning"
 POR_heavy_fighter_equipment_3_desc:0 "A twin piston engine aircraft designed with a focus on speed and heavy armaments. During World War II, its speed was utilized in many hit-and-away attacks over the Pacific, destroying many Japanese aircraft. Its distinctive shape earned it the name 'der Gabelschwanz-Teufel' or 'the fork-tailed devil' in Germany and 'Ni hikouki, ippairotto' or 'two planes, one pilot' in Japan. It's also known as the 'Lightning'."
 POR_fighter_equipment_0:0 "Gloster Gladiator"
 POR_fighter_equipment_0_short:0 "Gladiator"
 POR_fighter_equipment_1:0 "Curtiss P-75A-4 Mohawk"
 POR_fighter_equipment_1_short:0 "P-75A-4 Mohawk"
 POR_fighter_equipment_2:0 "Supermarine Spitfire Mk.Vb"
 POR_fighter_equipment_2_short:0 "Spitfire Mk.Vb"
 POR_fighter_equipment_3:0 "Republic P-47D-30 Thunderbolt"
 POR_fighter_equipment_3_short:0 "P-47D-30 Thunderbolt"
 POR_jet_multirole_equipment_1:0 "Republic F-47D-30-RA Thunderbolt"
 POR_jet_multirole_equipment_1_short:0 "F-47D-30-RA Thunderbolt"
 POR_jet_multirole_equipment_2:0 "North American F-86A Sabre"
 POR_jet_multirole_equipment_2_short:0 "F-86A Sabre"
 POR_jet_multirole_equipment_2_desc:0 "Le F-86 est un avion de chasse à réaction à ailes en flèche développé et mis en service à la fin des années 1940 à partir des recherches capturées par les Allemands. La conception de cet avion lui permettait d'atteindre des vitesses transsoniques et une grande maniabilité, des caractéristiques qui lui permettaient de rivaliser avec son célèbre concurrent, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, avec ses variantes canadiennes et australiennes, est l'avion de chasse occidental le plus produit de l'histoire de l'aviation."
 POR_jet_multirole_equipment_3:0 "North American F-86F Sabre"
 POR_jet_multirole_equipment_3_short:0 "F-86F Sabre"
 POR_jet_multirole_equipment_3_desc:0 "Système de commandes de vol amélioré et « empennage entièrement mobile » (Ce système a été remplacé par une commande entièrement motorisée avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche toujours conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur). Les Sabre F bénéficiaient d'une agilité à haute vitesse nettement améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 POR_jet_multirole_equipment_4:0 "North American F-86F-30-NA Sabre"
 POR_jet_multirole_equipment_4_short:0 "F-86F-30-NA Sabre"
 POR_jet_multirole_equipment_4_desc:0 "Améliorations supplémentaires apportées au F-86F Sabre pour le rendre plus efficace au combat contre les avions plus récents équipés de postcombustion, en l'armant de points d'emport et de rails pour le lancement de missiles AIM-9B Sidewinder."
 POR_jet_multirole_equipment_8:0 "General Dynamics F-16A Fighting Falcon"
 POR_jet_multirole_equipment_8_short:0 "F-16A Fighting Falcon"
 POR_jet_multirole_equipment_8_desc:0 "Un chasseur maniable et léger, offrant un équilibre parfait entre maniabilité et stabilité. Il est doté d'un fuselage monocoque exceptionnellement léger et aérodynamique, et bien qu'il s'agisse d'un avion monomoteur, il est équipé d'un moteur puissant. Surnommé le « Fighting Falcon », son coût relativement faible et sa puissance élevée expliquent pourquoi il a été adopté par les forces aériennes du monde entier. À ce jour, plus de 4 000 exemplaires de ce modèle à succès ont été fabriqués."
 POR_jet_multirole_equipment_9:0 "General Dynamics F-16A Block 15 OCU (améliorations des capacités opérationnelles) Fighting Falcon"
 POR_jet_multirole_equipment_9_short:0 "F-16A Block 15 OCU"
 POR_jet_multirole_equipment_9_desc:0 "Première modification majeure apportée au F-16, l'avion Block 15 était équipé de stabilisateurs horizontaux plus grands, de deux points d'emport supplémentaires au niveau de l'entrée d'air sous le nez, d'un nouveau radar et d'une capacité accrue pour les pylônes sous les ailes. Cette variante était également équipée d'une radio UHF (ultra haute fréquence) de dernière génération. Il s'agit de la variante la plus répandue parmi les modèles F-16."
 POR_jet_multirole_equipment_10:0 "General Dynamics F-16AM Block 15 MLU (mise à niveau à mi-vie) Fighting Falcon"
 POR_jet_multirole_equipment_10_short:0 "F-16AM Block 15 MLU"
 POR_jet_multirole_equipment_10_desc:0 "Le programme F-16 Mid-Life Update (MLU) qui en a résulté a été conçu pour moderniser le cockpit et l'avionique afin de les rendre équivalents à ceux du F-16C/D Block 50/52, ajouter la capacité d'utiliser des missiles air-air guidés par radar et, de manière générale, améliorer les performances opérationnelles, la fiabilité, la facilité d'entretien et la maintenabilité de l'avion."
 POR_jet_light_equipment_1:0 "Lockheed T-33A Shooting Star"
 POR_jet_light_equipment_1_short:0 "T-33A Shooting Star"
 POR_jet_light_equipment_2:0 "Rheims Cessna FTB-337G Skymaster"
 POR_jet_light_equipment_2_short:0 "FTB-337G Skymaster"
 POR_jet_light_equipment_3:0 "Fiat G.91R/3"
 POR_jet_light_equipment_3_short:0 "G.91R/3"
 POR_jet_light_equipment_4:0 "Fiat G.91R/4"
 POR_jet_light_equipment_4_short:0 "G.91R/4"
 POR_jet_light_equipment_5:0 "Dornier Alpha Jet A"
 POR_jet_light_equipment_5_short:0 "Alpha Jet A"
 POR_jet_light_equipment_5_desc:0 "La Luftwaffe a décidé d'utiliser l'Alpha Jet principalement pour des missions d'attaque légère, préférant poursuivre la formation au pilotage dans le sud-ouest des États-Unis sur des avions d'entraînement américains plutôt que d'effectuer cette formation en Allemagne, bien que l'Allemagne ait également utilisé des Alpha Jets basés à Beja, au Portugal, pour la formation au tir."
 POR_recon_equipment_0:0 "Westland Lysander IIIA"
 POR_recon_equipment_0_short:0 "Lysander IIIA"
 POR_jet_recon_equipment_0:0 "Lockheed RT-33A Shooting Star"
 POR_jet_recon_equipment_0_short:0 "RT-33A Shooting Star"
 POR_jet_recon_equipment_0_desc:0 "RT-33A modifié avant livraison en version monoplace de reconnaissance ; 85 exemplaires construits, principalement pour l'exportation dans le cadre du programme d'aide militaire."
 POR_jet_recon_equipment_2:0 "General Dynamics RF-16AM Fighting Falcon"
 POR_jet_recon_equipment_2_short:0 "RF-16AM Fighting Falcon"
 POR_jet_recon_equipment_2_desc:0 "La désignation RF-16A est toutefois utilisée par l'armée de l'air royale danoise. Au début de l'année 1994, 10 F-16A danois ont été redésignés comme avions de reconnaissance tactique RF-16A, remplaçant les RF-35 Drakens retirés à la fin de l'année 1993. À titre provisoire, ils ont d'abord été équipés des caméras optiques et des capteurs électro-optiques (E-O) des Drakens, réinstallés dans une nacelle de reconnaissance Per Udsen « Red Baron », qui ont été remplacés quelques années plus tard par la nacelle de reconnaissance modulaire (MRP) de Per Udsen."
 POR_CAS_equipment_1:0 "Breda Ba.65bis"
 POR_CAS_equipment_1_short:0 "Ba.65bis"
 POR_CAS_equipment_2:0 "North American AT-6C Texan"
 POR_CAS_equipment_2_short:0 "AT-6C Texan"
 POR_CAS_equipment_3:0 "Bell P-39L Airacobra"
 POR_CAS_equipment_3_short:0 "P-39L Airacobra"
 POR_CAS_equipment_4:0 "Douglas A-26C Invader"
 POR_CAS_equipment_4_short:0 "A-26C Invader"
 POR_jet_CAS_equipment_1:0 "North American AT-16 Harvard Mk. III"
 POR_jet_CAS_equipment_1_short:0 "AT-16 Harvard Mk. III"
 POR_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 POR_jet_CAS_equipment_2:0 "Republic F-84G Thunderjet"
 POR_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 POR_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 POR_jet_CAS_equipment_6:0 "LTV A-7D Corsair II"
 POR_jet_CAS_equipment_6_short:0 "A-7D Corsair II"
 POR_jet_CAS_equipment_6_desc:0 "Version construite pour l'USAF, équipée d'un turboréacteur Allison TF41-A-1 et d'un canon rotatif M61 Vulcan de 20 mm ; le radar de navigation AN/APN-153 des modèles précédents est remplacé par le radar de navigation AN/APN-185, et le radar de suivi de terrain AN/APQ-116 des A-7B/C précédents est remplacé par le radar de suivi de terrain AN/APQ-126."
 POR_jet_CAS_equipment_7:0 "LTV A-7P Corsair II"
 POR_jet_CAS_equipment_7_short:0 "A-7P Corsair II"
 POR_jet_CAS_equipment_7_desc:0 "Version spécialement conçue pour la FAP portugaise, équipée d'un turboréacteur Allison TF41-A-1 et d'un canon rotatif M61 Vulcan de 20 mm ; Le radar de navigation AN/APN-153 des modèles antérieurs est remplacé par le radar de navigation AN/APN-185, et le radar de suivi de terrain AN/APQ-116 des anciens A-7B/C est remplacé par le radar de suivi de terrain AN/APQ-126."
