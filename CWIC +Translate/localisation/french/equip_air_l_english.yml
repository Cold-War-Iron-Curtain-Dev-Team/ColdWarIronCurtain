 WGR_jet_CAS_equipment_1:0 "Republic F-84E Thunderjet"
 WGR_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 WGR_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 WGR_jet_CAS_equipment_2:0 "Republic F-84G Thunderjet"
 WGR_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 WGR_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 WGR_jet_CAS_equipment_3:0 "Republic F-84F Thunderstreak"
 WGR_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 WGR_jet_CAS_equipment_3_desc:0 "Développé à partir du F-84 Thunderjet précédent, le F-84F était une variante à ailes en flèche du chasseur-bombardier, conçue pour rapprocher ce type d'appareil des performances du très vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances au décollage, tout en offrant une stabilité et un contrôle médiocres. Ce modèle a été utilisé de manière limitée tout au long de sa carrière, qui s'est terminée en 1971. Son surnom est « Thunderstreak »."
