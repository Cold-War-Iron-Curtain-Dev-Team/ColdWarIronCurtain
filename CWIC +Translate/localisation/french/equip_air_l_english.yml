 WGR_jump_jet_equipment_1:0 "Hawker Siddeley Kestrel FGA.1"
 WGR_jump_jet_equipment_1_short:0 "Kestrel FGA.1"
 WGR_jump_jet_equipment_1_desc:0 "Cet avion d'attaque a été développé pour faire du VTOL (décollage et atterrissage verticaux) une réalité. Il présente une conception unique avec des ailes montées en hauteur et quatre tuyères rotatives. Cela lui permet d'opérer dans des espaces restreints tels que les porte-avions légers et les petits aérodromes. Cet avion est communément appelé « Kestrel », précurseur du Harrier, mais suivi par la Luftwaffe ouest-allemande."
 WGR_jump_jet_equipment_2:0 "VFW VAK 191B"
 WGR_jump_jet_equipment_2_short:0 "VAK 191B"
 WGR_jump_jet_equipment_2_desc:0 "Le VFW VAK 191B était un avion de combat expérimental allemand à décollage et atterrissage verticaux (VTOL) du début des années 1970. VAK était l'abréviation de Vertikalstartendes Aufklärungs- und Kampfflugzeug (avion de reconnaissance et de combat à décollage vertical)."
