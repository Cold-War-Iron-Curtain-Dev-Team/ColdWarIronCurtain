 DEN_jet_recon_equipment_1:0 "SAAB RF-35 Draken"
 DEN_jet_recon_equipment_1_short:0 "RF-35 Draken"
 DEN_jet_recon_equipment_1_desc:0 "Version de reconnaissance monoplace du Draken suédois pour la Royal Danish Air Force, équipée de caméras."
 DEN_jet_recon_equipment_2:0 "Lockheed RF-16A Fighting Falcon"
 DEN_jet_recon_equipment_2_short:0 "RF-16A Fighting Falcon"
 DEN_jet_recon_equipment_2_desc:0 "La désignation RF-16A est toutefois utilisée par l'armée de l'air royale danoise. Au début de l'année 1994, 10 F-16A danois ont été redésignés comme avions de reconnaissance tactique RF-16A, remplaçant les RF-35 Drakens retirés à la fin de l'année 1993. À titre provisoire, ils ont d'abord été équipés des caméras optiques et des capteurs électro-optiques (E-O) des Drakens, réinstallés dans une nacelle de reconnaissance Per Udsen « Red Baron », qui ont été remplacés quelques années plus tard par la nacelle de reconnaissance modulaire (MRP) de Per Udsen."
 DEN_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 DEN_mr_stealth_fighter_equipment_1_short:0 "F-35A Lightning II"
 DEN_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnels (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le programme F-35 a débuté en 1992, la variante A ayant pris son envol fin 2006 et largué ses premières bombes moins de six ans plus tard. La variante A est la plus petite et la plus légère des variantes du F-35. Elle est principalement destinée à remplacer le F-16 Fighting Falcon."
