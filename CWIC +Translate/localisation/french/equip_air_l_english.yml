 SPR_heavy_fighter_equipment_1:0 "Fokker G.1 Mercury"
 SPR_heavy_fighter_equipment_1_short:0 "Fokker G.1M"
 SPR_heavy_fighter_equipment_1_desc:0 "Le Fokker G.IM est un avion de chasse lourd bimoteur néerlandais équipé de moteurs Bristol Mercury VIII, qui fut le principal intercepteur des Néerlandais pendant leur brève lutte du mois de mai."
 SPR_heavy_fighter_equipment_2:0 "Fokker G.1 Wasp"
 SPR_heavy_fighter_equipment_2_short:0 "Fokker G.1W"
 SPR_heavy_fighter_equipment_2_desc:0 "Le Fokker G.IW est un chasseur lourd bimoteur néerlandais pouvant accueillir deux personnes, conçu à des fins d'exportation. L'avion est équipé de moteurs Pratt & Whitney SB4-G Twin Wasp Junior. Les exportations ne se sont jamais concrétisées, car les Pays-Bas ont été envahis."
 SPR_heavy_fighter_equipment_3:0 "Lockheed P-38L Lightning"
 SPR_heavy_fighter_equipment_3_short:0 "P-38L Lightning"
 SPR_heavy_fighter_equipment_3_desc:0 "A twin piston engine aircraft designed with a focus on speed and heavy armaments. During World War II, its speed was utilized in many hit-and-away attacks over the Pacific, destroying many Japanese aircraft. Its distinctive shape earned it the name 'der Gabelschwanz-Teufel' or 'the fork-tailed devil' in Germany and 'Ni hikouki, ippairotto' or 'two planes, one pilot' in Japan. It's also known as the 'Lightning'."
 SPR_jet_multirole_equipment_1:0 "Hispano Aviación HA-1112-M1L Buchon"
 SPR_jet_multirole_equipment_1_short:0 "HA-1112-M1L Buchon"
 SPR_jet_multirole_equipment_2:0 "North American F-86A Sabre"
 SPR_jet_multirole_equipment_2_short:0 "F-86A Sabre"
 SPR_jet_multirole_equipment_2_desc:0 "Le F-86 est un avion de chasse à réaction à ailes en flèche développé et mis en service à la fin des années 1940 à partir des recherches capturées par les Allemands. La conception de cet avion lui permettait d'atteindre des vitesses transsoniques et une grande maniabilité, des caractéristiques qui lui permettaient de rivaliser avec son célèbre concurrent, le MiG-15. Officiellement connu sous le nom de « Sabre » ou « Sabrejet », le F-86, avec ses variantes canadiennes et australiennes, est l'avion de chasse occidental le plus produit de l'histoire de l'aviation."
 SPR_jet_multirole_equipment_3:0 "North American F-86F Sabre"
 SPR_jet_multirole_equipment_3_short:0 "F-86F Sabre"
 SPR_jet_multirole_equipment_3_desc:0 "Système de commandes de vol amélioré et « empennage entièrement mobile » (Ce système a été remplacé par une commande entièrement motorisée avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche toujours conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur). Les Sabre F bénéficiaient d'une agilité à haute vitesse nettement améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 SPR_jet_multirole_equipment_4:0 "North American F-86F-30 Sabre"
 SPR_jet_multirole_equipment_4_short:0 "F-86F-30 Sabre"
 SPR_jet_multirole_equipment_4_desc:0 "Améliorations supplémentaires apportées au F-86F Sabre pour le rendre plus efficace au combat contre les avions plus récents équipés de postcombustion, en l'armant de points d'emport et de rails pour le lancement de missiles AIM-9B Sidewinder."
 SPR_jet_multirole_equipment_5:0 "Lockheed F-104G Starfighter"
 SPR_jet_multirole_equipment_5_short:0 "F-104G Starfighter"
 SPR_jet_multirole_equipment_6:0 "McDonnel Douglas F-4C Phantom II"
 SPR_jet_multirole_equipment_6_short:0 "F-4C Phantom II"
 SPR_jet_multirole_equipment_7:0 "Dassault Mirage F1CE"
 SPR_jet_multirole_equipment_7_short:0 "Mirage F1CE"
 SPR_jet_multirole_equipment_8:0 "Dassault Mirage F1EE"
 SPR_jet_multirole_equipment_8_short:0 "Mirage F1EE"
 SPR_jet_multirole_equipment_9:0 "McDonnell Douglas F/A-18 Hornet"
 SPR_jet_multirole_equipment_9_short:0 "F/A-18 Hornet"
 SPR_jet_multirole_equipment_9_desc:0 "Le McDonnell Douglas F/A-18 Hornet est un avion de combat multirôle bimoteur, supersonique, tout temps, capable d'opérer à partir d'un porte-avions, conçu à la fois comme avion de chasse et d'attaque (d'où la désignation F/A). Conçu par McDonnell Douglas (qui fait désormais partie de Boeing) et Northrop (qui fait désormais partie de Northrop Grumman), le F/A-18 est dérivé du YF-17 de ce dernier, développé dans les années 1970 pour être utilisé par la marine et le corps des Marines des États-Unis. Le Hornet est également utilisé par les forces aériennes de plusieurs autres pays et, auparavant, par l'escadron de démonstration aérienne de la marine américaine, les Blue Angels."
 SPR_jet_multirole_equipment_10:0 "McDonnell Douglas EF-18 Hornet"
 SPR_jet_multirole_equipment_10_short:0 "EF-18 Hornet"
 SPR_jet_multirole_equipment_10_desc:0 "Les Spanish Hornets sont utilisés comme intercepteurs tout temps 60 % du temps et comme avions d'attaque tout temps de jour comme de nuit le reste du temps. En cas de guerre, chacune des escadrilles de première ligne jouerait un rôle primordial : la 121 est chargée du soutien aérien tactique et des opérations maritimes ; les 151 et 122 sont affectées à l'interception tout temps et au combat aérien ; et la 152 est affectée à la mission SEAD."
 SPR_mr_stealth_fighter_equipment_1:0 "Eurofighter EF-2000 Typhoon"
 SPR_mr_stealth_fighter_equipment_1_short:0 "EF-2000 Typhoon"
 SPR_cv_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35C Lightning II"
 SPR_cv_mr_stealth_fighter_equipment_1_short:0 "F-35C Lightning II"
 SPR_cv_mr_stealth_fighter_equipment_1_desc:0 "Le F-35C est la variante CATOBAR (Catapult Assisted Take-Off But Arrested Recovery) de la famille F-35 Lightning II de Lockheed Martin, conçue principalement pour être déployée sur des porte-avions. Le programme F-35 a débuté en 1992, et la variante C a pris son envol dès 2010 et a été opérationnelle sur des porte-avions moins de quatre ans plus tard. Par rapport à ses homologues, la variante C se caractérise par des ailes plus grandes avec des extrémités repliables."
 SPR_jump_stealth_equipment_1:0 "Lockheed Martin F-35B Lightning II"
 SPR_jump_stealth_equipment_1_short:0 "F-35B Lightning II"
 SPR_jump_stealth_equipment_1_desc:0 "Un avion de combat polyvalent produit à partir d'une conception JSF (Joint Strike Fighter). Bien qu'il puisse utiliser diverses armes dans les combats air-air et sol-sol, le coût d'acquisition de cet avion de combat furtif est plus raisonnable que celui du F-22A. En fonction de son utilité, plusieurs types sont disponibles. Le type « B » utilisé par le Corps des Marines des États-Unis est compatible STOVL (décollage court/atterrissage vertical). Son surnom est « Lightning II »."
 SPR_tac_bomber_equipment_0:0 "Junkers Ju 86"
 SPR_tac_bomber_equipment_0_short:0 "Ju 86"
 SPR_tac_bomber_equipment_1:0 "Heinkel He 111"
 SPR_tac_bomber_equipment_1_short:0 "He 111"
 SPR_tac_bomber_equipment_2:0 "Junkers Ju 88"
 SPR_tac_bomber_equipment_2_short:0 "Ju 88"
 SPR_tac_bomber_equipment_3:0 "CASA 2.111"
 SPR_tac_bomber_equipment_3_short:0 "2.111"
 SPR_jet_interceptor_equipment_5:0 "Dassault Mirage IIICE"
 SPR_jet_interceptor_equipment_5_short:0 "Mirage IIICE"
 SPR_jet_interceptor_equipment_6:0 "Hispano HA-300"
 SPR_jet_interceptor_equipment_6_short:0 "HA-300"
 SPR_jet_interceptor_equipment_7:0 "Dassault Mirage IIIEE"
 SPR_jet_interceptor_equipment_7_short:0 "Mirage IIIEE"
 SPR_jet_light_equipment_1:0 "Hispano HA-100"
 SPR_jet_light_equipment_1_short:0 "HA-100 Triana"
 SPR_jet_light_equipment_1_desc:0 "L'Hispano HA-100 Triana (du nom du quartier de Séville où se trouvait l'usine Hispano Aviación) était un avion d'entraînement militaire développé en Espagne dans les années 1950. Premier avion conçu par Willy Messerschmitt après la Seconde Guerre mondiale, il s'agissait d'un monoplan conventionnel à aile basse en porte-à-faux, équipé d'un train d'atterrissage tricycle escamotable."
 SPR_jet_light_equipment_2:0 "Hispano HA-200"
 SPR_jet_light_equipment_2_short:0 "HA-200"
 SPR_jet_light_equipment_2_desc:0 "Le Hispano HA-200 Saeta était un avion d'entraînement avancé à réaction biplace conçu et produit par le constructeur aéronautique espagnol Hispano Aviación. Il a la particularité d'être le premier avion espagnol à utiliser la propulsion à réaction."
 SPR_jet_light_equipment_3:0 "CASA SF-5A Freedom Fighter"
 SPR_jet_light_equipment_3_short:0 "SF-5A Freedom Fighter"
 SPR_jet_light_equipment_3_desc:0 "Le F-5A a été développé comme un avion de chasse léger destiné principalement à l'exportation. Il est plus léger et moins coûteux à produire que la plupart des autres chasseurs modernes, ce qui le rend idéal pour compléter les escadrons de chasseurs à courte portée. Malgré cela, ce modèle s'est révélé très maniable et était l'avion le plus à même de rivaliser avec le MiG-21 « Fishbed » soviétique. Comme il était utilisé par la majorité des alliés des États-Unis au plus fort de la guerre froide, il a été baptisé à juste titre « Freedom Fighter » (combattant de la liberté)."
 SPR_jet_light_equipment_4:0 "CASA SF-5B Freedom Fighter"
 SPR_jet_light_equipment_4_short:0 "SF-5B  Freedom Fighter"
 SPR_jet_light_equipment_4_desc:0 "L'avion américain Northrop F-5B Freedom Fighter utilisé par l'armée de l'air royale norvégienne. Principalement utilisé comme avion d'entraînement pour d'autres avions à réaction multirôles, il était équipé de points d'emport pour le transport de munitions."
 SPR_jet_light_equipment_5:0 "CASA C-101 Aviojet"
 SPR_jet_light_equipment_5_short:0 "C-101 Aviojet"
 SPR_jet_light_equipment_5_desc:0 "Le CASA C-101 Aviojet est un avion d'entraînement avancé et d'attaque légère à voilure basse et à moteur à réaction, conçu et fabriqué par la société aéronautique espagnole Construcciones Aeronáuticas SA (CASA)."
 SPR_recon_equipment_0:0 "Fieseler Fi 156 Storch"
 SPR_recon_equipment_0_short:0 "Fi 156 Storch"
 SPR_recon_equipment_0_desc:0 ""
 SPR_jet_recon_equipment_0:0 "Lockheed RT-33A Shooting Star"
 SPR_jet_recon_equipment_0_short:0 "RT-33A Shooting Star"
 SPR_jet_recon_equipment_0_desc:0 "RT-33A modifié avant livraison en version monoplace de reconnaissance ; 85 exemplaires construits, principalement pour l'exportation dans le cadre du programme d'aide militaire."
 SPR_jet_recon_equipment_1:0 "McDonnell Douglas RF-4C Phantom II"
 SPR_jet_recon_equipment_1_short:0 "RF-4C Phantom II"
 SPR_transport_plane_equipment_1:0 "CASA C-352"
 SPR_transport_plane_equipment_1_short:0 "C-352"
