 FRA_high_mach_jet_interceptor_equipment_1:0 "Sud-Ouest SO.6020 Espadon"
 FRA_high_mach_jet_interceptor_equipment_1_short:0 "SO.6020 Espadon"
 FRA_high_mach_jet_interceptor_equipment_1_desc:0 "Le Sud-Ouest SO.6020 Espadon (Swordfish) était un prototype d'intercepteur français d'après-guerre conçu et construit par la SNCASO à la fin des années 1940. L'Armée de l'air française jugea la conception infructueuse malgré quelques records établis et annula son projet de mise en service en 1951. Seuls quatre appareils furent construits, puis modifiés pour servir de bancs d'essai au programme SNCASO SO.9000 Trident, un avion mixte propulsé par une fusée et un turboréacteur."
 FRA_high_mach_jet_interceptor_equipment_2:0 "SNCASO SO.9000 Trident"
 FRA_high_mach_jet_interceptor_equipment_2_short:0 "SO.9000 Trident"
 FRA_high_mach_jet_interceptor_equipment_2_desc:0 "Le SNCASO SO.9000 Trident était un avion intercepteur français à propulsion mixte construit par le constructeur aéronautique SNCASO dans les années 1950. Dans le cadre d'un effort plus large visant à reconstruire la puissance militaire française à la fin des années 1940 et à doter la France de nouveaux modèles avancés produits localement, une demande d'avion intercepteur de défense ponctuelle capable de voler à une vitesse supersonique pour équiper l'armée de l'air française a été adressée à SNCASO."
 FRA_high_mach_jet_interceptor_equipment_3:0 "Nord 1500 Griffon"
 FRA_high_mach_jet_interceptor_equipment_3_short:0 "N.1500 Griffon"
 FRA_high_mach_jet_interceptor_equipment_3_desc:0 "Le Nord 1500 Griffon était un avion intercepteur expérimental à statoréacteur conçu et construit par le constructeur aéronautique public français Nord Aviation. Le Griffon a été développé comme un successeur Mach 2 de l'avion de recherche supersonique Nord Gerfaut. Le développement de l'avion a véritablement commencé après la réception d'une lettre d'intention en 1953 pour deux avions de recherche non armés. La conception comprenait une configuration innovante à double propulsion turboréacteur-statoréacteur, le premier étant utilisé pour décoller et atteindre une vitesse suffisante pour démarrer le second."
