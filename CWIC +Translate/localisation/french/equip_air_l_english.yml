 HOL_naval_helicopter_equipment_1:0 "Sikorsky S-51 ASW"
 HOL_naval_helicopter_equipment_1_short:0 "Sikorsky S-51 ASW"
 HOL_naval_helicopter_equipment_1_desc:0 "Le HTL était un hélicoptère léger monomoteur à rotor unique dérivé du Bell 47A civil. Acheté par la marine américaine en 1947, le HTL-4 (variante désignée par la marine) se distinguait de ceux utilisés par les autres branches par la suppression du revêtement en tissu sur le longeron de queue. Sinon, il conservait bon nombre de ses caractéristiques, notamment la verrière distinctive en forme de « bulle de savon » offrant au pilote une large vue. Il fut plus tard désigné TH-13L. Son surnom, donné en référence aux tribus amérindiennes, est « Sioux »."
 HOL_naval_helicopter_equipment_2:0 "Sikorsky SH-34G Seabat"
 HOL_naval_helicopter_equipment_2_short:0 "SH-34G Seabat"
 HOL_naval_helicopter_equipment_3:0 "Westland Wasp AH-12A"
 HOL_naval_helicopter_equipment_3_short:0 "Wasp AH-12A"
 HOL_naval_helicopter_equipment_4:0 "Westland Lynx SH-14A"
 HOL_naval_helicopter_equipment_4_short:0 "Westland Lynx SH-14A"
 HOL_naval_helicopter_equipment_5:0 "Westland Lynx SH-14B"
 HOL_naval_helicopter_equipment_5_short:0 "Lynx SH-14B"
 HOL_naval_helicopter_equipment_6:0 "Westland Lynx SH-14D"
 HOL_naval_helicopter_equipment_6_short:0 "Lynx SH-14D"
 HOL_naval_helicopter_equipment_7:0 "NHIndustries NH90 NFH"
 HOL_naval_helicopter_equipment_7_short:0 "NH90 NFH"
 HOL_attack_helicopter_equipment_3:0 "Hughes AH-64A Apache"
 HOL_attack_helicopter_equipment_3_short:0 "AH-64A Apache"
 HOL_attack_helicopter_equipment_3_desc:0 "Introduit en 1986 pour remplacer l'AH-1 dans l'armée américaine, l'AH-64 est l'un des hélicoptères d'attaque les plus connus au monde. Il est équipé d'une suite de capteurs montés à l'avant pour l'acquisition de cibles et de systèmes de vision nocturne. Son armement typique (et célèbre) comprend un canon Chain Gun de 30 mm situé entre le train d'atterrissage et quatre points d'emport sur les ailes pour une combinaison de roquettes Hydra et de missiles antichars AGM-114 Hellfire. Surnommé « Apache », l'AH-64 représente le summum de l'aviation hélicoptère."
 HOL_attack_helicopter_equipment_4:0 "McDonnell Douglas AH-64D Longbow Apache"
 HOL_attack_helicopter_equipment_4_short:0 "AH-64D Apache"
 HOL_attack_helicopter_equipment_4_desc:0 "Fierté de l'armée américaine, outre sa superbe maniabilité, cette variante est dépourvue du radar Longbow. On pourrait donc la qualifier de « Delta sans Longbow » et elle n'est pas connue sous le nom d'« Apache Longbow ». Même si elle n'est pas équipée de ce système radar, il s'agit tout de même d'une variante entièrement modernisée."
 HOL_attack_helicopter_equipment_5:0 "McDonnell Douglas AH-64E Guardian"
 HOL_attack_helicopter_equipment_5_short:0 "AH-64E Guardian"
 HOL_attack_helicopter_equipment_5_desc:0 "L'AH-64E offre une connectivité numérique améliorée, le système tactique interarmées de distribution d'informations (Joint Tactical Information Distribution System), des moteurs T700-GE-701D plus puissants avec une transmission à engrenages frontaux améliorée pour fournir plus de puissance, la capacité de contrôler des véhicules aériens sans pilote (UAV), une capacité IFR complète et un train d'atterrissage amélioré. Les nouvelles pales de rotor en composite, qui ont passé avec succès les essais en 2004, augmentent la vitesse de croisière, la vitesse ascensionnelle et la capacité d'emport."
 HOL_scout_helicopter_equipment_1:0 "Aérospatiale SA 313B Alouette II"
