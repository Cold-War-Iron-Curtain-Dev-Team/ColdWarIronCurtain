 FRA_jet_strat_bomber_equipment_3_short:0 "Super Vautour"
 FRA_jet_strat_bomber_equipment_3_desc:0 "Si les nouvelles exigences en matière de bombardiers ont finalement abouti à la sélection, au développement et à la fabrication du bombardier Dassault Mirage IV, Sud Aviation avait également choisi de répondre à ces exigences en présentant sa propre proposition pour la production d'un Super Vautour. Selon l'auteur spécialisé dans l'aviation Bill Gunston, la variante « allongée » du Super Vautour, qui n'a jamais été construite, aurait eu un rayon d'action accru de 1 700 miles et aurait pu atteindre au moins Mach 0,9."
