 CAN_strat_bomber_equipment_1:0 "Handley Page Halifax"
 CAN_strat_bomber_equipment_1_short:0 "Halifax"
 CAN_strat_bomber_equipment_2:0 "Avro Lancaster"
 CAN_strat_bomber_equipment_2_short:0 "Lancaster"
 CAN_strat_bomber_equipment_3:0 "Avro Lincoln I"
 CAN_strat_bomber_equipment_3_short:0 "Lincoln I"
 CAN_jet_multirole_equipment_1:0 "De Havilland Vampire F.3"
 CAN_jet_multirole_equipment_1_short:0 "Vampire F.3"
 CAN_jet_multirole_equipment_1_desc:0 "Le Vampire avait pour fonction d'initier les pilotes de chasse canadiens non seulement à la propulsion à réaction, mais aussi à d'autres équipements tels que la pressurisation du cockpit et le train d'atterrissage tricycle. Il s'est avéré être un avion très apprécié, facile à piloter et souvent considéré comme un « bolide ». Au Canada, le Vampire a été utilisé à la fois dans des unités opérationnelles et dans des unités de réserve aérienne (escadrons 400, 401, 402, 411, 438 et 442)."
 CAN_jet_multirole_equipment_2:0 "Canadair CL-13 Sabre Mark 4"
 CAN_jet_multirole_equipment_2_short:0 "Sabre Mk.4"
 CAN_jet_multirole_equipment_2_desc:0 "Le premier Sabre Mk.4 volait avec le moteur Orenda 10, qui lui conférait un net avantage en termes de taux de montée et d'altitude maximale par rapport aux versions précédentes. Parmi les autres améliorations apportées au Mk 5, citons un nouveau système d'oxygène, une maniabilité accrue et de meilleures caractéristiques à basse vitesse, obtenues grâce à l'augmentation de la corde alaire de 15,2 cm à la base et de 7,2 cm à l'extrémité de l'aile, ainsi qu'à l'installation d'un petit déflecteur vertical sur l'aile."
 CAN_jet_multirole_equipment_3_short:0 "Sabre Mk.5"
 CAN_jet_multirole_equipment_3_desc:0 "Le Canadair Sabre Mk.5 fut la dernière variante finale. Il était équipé d'un moteur Orenda à deux étages développant une poussée statique de 7 275 lb (3 302 kg). Ses performances en altitude et son taux de montée ont été améliorés par rapport au Mk 5 et le rétablissement des becs de bord d'attaque lui a conféré d'excellentes caractéristiques à basse vitesse."
 CAN_jet_multirole_equipment_3:0 "Canadair CL-13 Sabre Mark 6 "
 CAN_jet_multirole_equipment_4_short:0 "Sabre Mk.6"
 CAN_jet_multirole_equipment_4_desc:0 "Le Canadair Sabre Mk.6 était une variante équipée de missiles Sidewinder et constitue la dernière variante. Il était considéré comme le « meilleur » Sabre jamais construit. Il était équipé de points d'emport pour les missiles AIM-9B Sidewinder."
 CAN_jet_multirole_equipment_5:0 "Canadair CF-104 Starfighter"
 CAN_jet_multirole_equipment_5_short:0 "CF-104 Starfighter"
 CAN_jet_multirole_equipment_5_desc:0 "Le Canadair CF-104 Starfighter (CF-111, CL-90) est une version modifiée du chasseur supersonique Lockheed F-104 Starfighter, construit au Canada par Canadair sous licence. Il était principalement utilisé comme avion d'attaque au sol, bien qu'il ait été conçu comme intercepteur. Il a servi dans l'Aviation royale canadienne (ARC), puis dans les Forces armées canadiennes (FAC)."
 CAN_jet_multirole_equipment_6:0 "Canadair CF-104 Starfighter RU"
 CAN_jet_multirole_equipment_6_short:0 "CF-104 Starfighter RU"
 CAN_jet_multirole_equipment_6_desc:0 "Amélioration de la fiabilité des premiers Starfighters"
 CAN_jet_multirole_equipment_7:0 "Canadair CF-104 Starfighter Performances améliorées"
 CAN_jet_multirole_equipment_7_short:0 "CF-104 Starfighter IP"
 CAN_jet_multirole_equipment_7_desc:0 "Mise à niveau avionique de l'ancien Starfighter afin de permettre le montage d'armes modernes telles que l'AGM-65."
 CAN_jet_multirole_equipment_8:0 "Modernisation à mi-vie du Canadair CF-104 Starfighter"
 CAN_jet_multirole_equipment_8_short:0 "CF-104 Starfighter MLU"
 CAN_jet_multirole_equipment_8_desc:0 "Mid Life Update to the F-104 Fleet"
 CAN_jet_multirole_equipment_9:0 "McDonnell Douglas CF-18 Hornet"
 CAN_jet_multirole_equipment_9_short:0 "CF-18 Hornet"
 CAN_jet_multirole_equipment_9_desc:0 "Le McDonnell Douglas CF-18 Hornet (désignation militaire officielle CF-188) est une variante de l'avion de combat américain McDonnell Douglas F/A-18 Hornet utilisée par l'Aviation royale canadienne (ARC)."
 CAN_jet_multirole_equipment_10:0 "Projet de modernisation progressive du CF-18 Hornet de McDonnell Douglas, phase I"
 CAN_jet_multirole_equipment_10_short:0 "CF-18 Hornet IMP Phase I"
 CAN_jet_multirole_equipment_10_desc:0 "Le McDonnell Douglas CF-18 Hornet (désignation militaire officielle CF-188) est une variante de l'avion de combat américain McDonnell Douglas F/A-18 Hornet utilisée par l'Aviation royale canadienne (ARC)."
 CAN_mr_stealth_fighter_equipment_1:0 "Lockheed Martin CF-35A Lightning II"
 CAN_mr_stealth_fighter_equipment_1_short:0 "CF-35A Lightning II"
 CAN_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnels (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le programme F-35 a débuté en 1992, la variante A ayant pris son envol fin 2006 et largué ses premières bombes moins de six ans plus tard. La variante A est la plus petite et la plus légère des variantes du F-35. Elle est principalement destinée à remplacer le F-16 Fighting Falcon."
 CAN_jet_light_equipment_1:0 "Canadair CT-133 Silver Star"
 CAN_jet_light_equipment_1_short:0 "CT-133 Silver Star"
 CAN_jet_light_equipment_1_desc:0 "Le Canadair CT-133 Silver Star (numéro de modèle CL-30) est la version canadienne sous licence de l'avion d'entraînement à réaction Lockheed T-33, en service des années 1950 à 2005. La version canadienne était équipée d'un turboréacteur Rolls-Royce Nene 10, tandis que la version Lockheed utilisait un Allison J33."
 CAN_jet_light_equipment_2:0 "Canadair CT-114 Tutor"
 CAN_jet_light_equipment_2_short:0 "CT-114 Tutor"
 CAN_jet_light_equipment_2_desc:0 "Les origines du CL-41 Tutor remontent à la décision prise par le constructeur aéronautique canadien Canadair de développer son propre avion d'entraînement dans le cadre d'une initiative privée. La conception elle-même était le fruit du travail du département de conception préliminaire interne de l'entreprise. En août 1957, la configuration de base du projet était achevée : il s'agissait d'un avion à ailes basses propulsé par un turboréacteur, équipé d'un train d'atterrissage tricycle et d'un cockpit à deux places côte à côte. Dès le début de son développement, l'avion était destiné à servir d'avion d'entraînement spécialement conçu pour la formation élémentaire au pilotage de jets, ainsi que pour la formation complémentaire jusqu'au niveau avancé."
 CAN_jet_light_equipment_3:0 "Canadair CF-5A Freedom Fighter"
 CAN_jet_light_equipment_3_short:0 "CF-5A Freedom Fighter"
 CAN_jet_light_equipment_3_desc:0 "Le Canadair CF-5/CF-116 est la version construite sous licence par Canadair de l'avion américain Northrop F-5 Freedom Fighter, principalement destiné aux Forces canadiennes sous le nom de CF-5 et à l'armée de l'air royale néerlandaise sous le nom de NF-5."
 CAN_jet_light_equipment_4:0 "Canadair CF-5D Freedom Fighter"
 CAN_jet_light_equipment_4_short:0 "CF-5D Freedom Fighter"
 CAN_jet_light_equipment_4_desc:0 "Le Canadair CF-5/CF-116 est la version construite sous licence par Canadair de l'avion américain Northrop F-5 Freedom Fighter, principalement destiné aux Forces canadiennes sous le nom de CF-5 et à l'armée de l'air royale néerlandaise sous le nom de NF-5."
 CAN_jet_light_equipment_5:0 "Hawker Siddeley CT-155 Hawk"
 CAN_jet_light_equipment_5_short:0 "CT-155 Hawk"
 CAN_jet_light_equipment_5_desc:0 "Version export du Hawker Siddeley Hawk destinée aux Forces armées canadiennes, désignée CT-155 Hawk dans l'armée canadienne. Elle est équipée de points d'emport pour des pods de mitrailleuses, des missiles Sidewinder et jusqu'à 6 800 livres de bombes."
 CAN_jet_interceptor_equipment_1:0 "Canadair Meteor F.4"
 CAN_jet_interceptor_equipment_1_short:0 "Meteor F.4"
 CAN_jet_interceptor_equipment_1_desc:0 "A canadian aquired Meteor F.4 for interceptor duties."
 CAN_jet_interceptor_equipment_2:0 "Avro Canada CF-100 Canuck Mk.1"
 CAN_jet_interceptor_equipment_2_short:0 "CF-100 Canuck Mk.1"
 CAN_jet_interceptor_equipment_2_desc:0 "L'Avro Canada CF-100 Canuck (affectueusement surnommé « Clunk ») est un intercepteur/chasseur bimoteur canadien conçu et produit par le constructeur aéronautique Avro Canada. Il a la particularité d'être le seul chasseur de conception canadienne à avoir été produit en série."
 CAN_jet_interceptor_equipment_3:0 "Avro Canada CF-100 Canuck Mk.3"
 CAN_jet_interceptor_equipment_3_short:0 "CF-100 Canuck Mk.3"
 CAN_jet_interceptor_equipment_3_desc:0 "L'Avro Canada CF-100 Canuck (affectueusement surnommé « Clunk ») est un intercepteur/chasseur canadien à deux réacteurs conçu et produit par le constructeur aéronautique Avro Canada. Il a la particularité d'être le seul chasseur de conception canadienne à avoir été produit en série."
 CAN_jet_interceptor_equipment_4:0 "Avro Canada CF-100 Canuck Mk.5"
 CAN_jet_interceptor_equipment_4_short:0 "CF-100 Canuck Mk.5"
 CAN_jet_interceptor_equipment_4_desc:0 "L'Avro Canada CF-100 Canuck (affectueusement surnommé « Clunk ») est un intercepteur/chasseur canadien à deux réacteurs conçu et produit par le constructeur aéronautique Avro Canada. Il a la particularité d'être le seul chasseur de conception canadienne à avoir été produit en série."
 CAN_jet_interceptor_equipment_5:0 "McDonnell CF-101B Voodoo"
 CAN_jet_interceptor_equipment_5_short:0 "CF-101B Voodoo"
 CAN_jet_interceptor_equipment_5_desc:0 "Le McDonnell F-101 Voodoo est un avion de chasse supersonique qui a servi dans l'armée de l'air américaine (USAF) et l'armée de l'air royale canadienne (RCAF). 112 F-101B ont été transférés à l'armée de l'air royale canadienne et rebaptisés CF-101B dans le cadre du service RCAF."
 CAN_jet_interceptor_equipment_6:0 "McDonnell CF-101C Voodoo"
 CAN_jet_interceptor_equipment_6_short:0 "CF-101C Voodoo"
 CAN_jet_interceptor_equipment_6_desc:0 "Mise à niveau théorique amenant le CF-101B à la norme C."
 CAN_jet_interceptor_equipment_7:0 "Avro Canada CF-105 Long Range Arrow"
 CAN_jet_interceptor_equipment_7_short:0 "CF-105 Long Range Arrow"
 CAN_jet_interceptor_equipment_7_desc:0 "L'avant-dernière version de l'industrie aérospatiale canadienne en difficulté. Au début de l'année 1957, des études ont été lancées afin de déterminer comment l'Arrow Mk.2 pourrait être développé pour devenir un « Long Range Arrow » (Arrow à longue portée) afin de répondre aux exigences du programme LRIX (Long Range Interceptor Experimental) de l'USAF. Ce projet semblait approprié au regard des divers accords, déclarations et promesses faits aux pays alliés, en particulier aux nations du Commonwealth."
 CAN_high_mach_jet_interceptor_equipment_1:0 "Avro Canada CF-103"
 CAN_high_mach_jet_interceptor_equipment_1_short:0 "CF-103"
 CAN_high_mach_jet_interceptor_equipment_1_desc:0 "L'Avro Canada CF-103 était un intercepteur canadien proposé, conçu par Avro Canada au début des années 1950 comme une évolution et un éventuel remplacement du CF-100 Canuck de la société, qui entrait alors en service dans l'Aviation royale canadienne (ARC). Bien qu'il ait été conçu pour voler à des vitesses transsoniques, le CF-103 n'offrait qu'une augmentation modérée des performances et des capacités par rapport au CF-100."
 CAN_high_mach_jet_interceptor_equipment_2:0 "Avro Canada C-104 Avanced Fighter"
 CAN_high_mach_jet_interceptor_equipment_2_short:0 "C-104"
 CAN_high_mach_jet_interceptor_equipment_2_desc:0 "Après l'abandon du CF-103 et alors que les demandes canadiennes pour un nouvel intercepteur n'étaient toujours pas satisfaites, une étude de conception aboutit finalement au projet C-104, plus avancé. Deux versions d'un chasseur à ailes delta connu sous le nom de C104 furent soumises à la RCAF : le C104/4 monomoteur et le C104/2 bimoteur. Les deux modèles étaient similaires, avec une aile delta basse. Les principaux avantages du C104/2 étaient sa taille plus importante, qui offrait un compartiment d'armes interne beaucoup plus grand, et la fiabilité offerte par ses deux moteurs."
 CAN_high_mach_jet_interceptor_equipment_3:0 "Avro Canada CF-105 Arrow"
 CAN_high_mach_jet_interceptor_equipment_3_short:0 "CF-105 Arrow"
 CAN_high_mach_jet_interceptor_equipment_3_desc:0 "L'Arrow était l'aboutissement d'une série d'études de conception commencées en 1953 qui examinaient des versions améliorées du CF-100 Canuck d'Avro Canada. Après des études approfondies, l'ARC a choisi une conception nettement plus puissante, et le développement sérieux a commencé en mars 1955. L'avion devait être construit directement à partir de la chaîne de production, en sautant la phase traditionnelle de prototypage artisanal. Le premier Arrow Mk. 1, RL-201, a été présenté au public le 4 octobre 1957, le jour même du lancement du Spoutnik I."
 CAN_high_mach_jet_interceptor_equipment_4:0 "Avro Canada CF-105 Arrow Mk.2"
 CAN_high_mach_jet_interceptor_equipment_4_short:0 "CF-105 Arrow Mk.2"
 CAN_high_mach_jet_interceptor_equipment_4_desc:0 "La version Mk 2 devait être équipée des moteurs Orenda PS-13 Iroquois et serait évaluée par les pilotes d'acceptation de la RCAF ainsi que par les pilotes d'essai d'Avro. Les nouveaux moteurs PS-13S étaient conçus pour produire chacun 30 000 lbf (130 kN). Le système de contrôle de tir Astra/Sparrow avait été abandonné par le gouvernement en septembre 1958, tous les avions devant utiliser la combinaison Hughes/Falcon. Au moment de l'annulation de l'ensemble du programme, le premier Arrow Mk 2, le RL-206, était prêt pour les essais au sol. Avro s'attendait à ce qu'il batte le record mondial de vitesse."
 CAN_recon_equipment_0:0 "Taylorcraft Auster AOP6"
 CAN_recon_equipment_0_short:0 "Auster AOP6"
 CAN_recon_equipment_0_desc:0 "Le Taylorcraft Auster était un avion militaire britannique de liaison et d'observation produit par la société Taylorcraft Aeroplanes (England) Limited pendant la Seconde Guerre mondiale."
 CAN_jet_recon_equipment_0:0 "Avro Canada CF-100 Mk 1P "
 CAN_jet_recon_equipment_0_short:0 "CF-100 Mk 1P "
 CAN_jet_recon_equipment_0_desc:0 "Version proposée pour la reconnaissance photographique du CF-100 Canuck produit par Avro Canada."
 CAN_jet_recon_equipment_1:0 "Canadair CF-5A(R) Freedom Fighter"
 CAN_jet_recon_equipment_1_short:0 "CF-5A(R) Freedom Fighter"
 CAN_jet_recon_equipment_1_desc:0 "Version de reconnaissance monoplace pour les Forces canadiennes. Construite en petit nombre. Désignation des Forces canadiennes : CF-116A(R)."
 CAN_jet_recon_equipment_2:0 "McDonnell EF-101B Electric Voodoo"
 CAN_jet_recon_equipment_2_short:0 "EF-101B Electric Voodoo"
 CAN_jet_recon_equipment_2_desc:0 "L'EF-101B était une conversion d'un F-101B standard, intégrant le système de brouillage électronique d'un EB-57E Canberra. Un seul avion a été converti avant l'annulation du programme et cet unique exemplaire a été loué au Canada. Les deux derniers Voodoo ont continué à voler jusqu'en avril 1987, date à laquelle ils ont finalement été retirés du service."
 CAN_nav_bomber_equipment_1:0 "Supermarine Stranraer"
 CAN_nav_bomber_equipment_1_short:0 "Stranraer"
 CAN_nav_bomber_equipment_1_desc:0 "Le Supermarine Stranraer était un hydravion conçu et construit par la société britannique Supermarine Aviation Works. Il a été développé dans les années 1930 pour le compte de son principal exploitant, la Royal Air Force."
 CAN_nav_bomber_equipment_2:0 "Short Sunderland"
 CAN_nav_bomber_equipment_2_short:0 "Sunderland"
 CAN_nav_bomber_equipment_2_desc:0 "Le Short S.25 Sunderland était un bombardier patrouilleur amphibie britannique, développé et construit par Short Brothers pour la Royal Air Force (RAF). L'avion tire son nom de la ville (anciennement bourg) et du port de Sunderland, dans le nord-est de l'Angleterre."
 CAN_nav_bomber_equipment_3:0 "Lockheed PV-2 Ventura GR.5"
 CAN_nav_bomber_equipment_3_short:0 "PV-2 Ventura GR.5"
 CAN_nav_bomber_equipment_3_desc:0 "Au total, 157 Ventura G.R. Mk. V ont été utilisés opérationnellement par l'ARC du 16 juin 1942 au 18 avril 1947 dans le cadre de missions de patrouille côtière pour la défense du territoire national, tant dans le Commandement aérien de l'Est que dans le Commandement aérien de l'Ouest."
 CAN_nav_bomber_equipment_4:0 "Canadair CL-29 North Star ASW"
 CAN_nav_bomber_equipment_4_short:0 "CL-29 North Star ASW"
 CAN_nav_bomber_equipment_4_desc:0 "Proposition de 1949 concernant un avion de patrouille maritime, élaborée en prévision des besoins de l'ARC, avec un fuselage allongé et trois options de motorisation. Les spécifications finales de l'ARC en 1952 prévoyaient toutefois un avion beaucoup plus performant, et c'est le Bristol Britannia qui fut finalement retenu comme base."
 CAN_nav_bomber_equipment_5:0 "Lockheed CP-122 Neptune"
 CAN_nav_bomber_equipment_5_short:0 "CP-122 Neptune"
 CAN_nav_bomber_equipment_5_desc:0 "Désignation de l'Aviation royale canadienne pour le P2V-7. Le réacteur n'était pas initialement installé sur les 25 avions P2V-7 livrés à l'ARC, mais il a été ajouté par la suite afin de les équiper tout de même."
 CAN_nav_bomber_equipment_6:0 "Canadair CP-107 Argus"
 CAN_nav_bomber_equipment_6_short:0 "CP-107 Argus"
 CAN_nav_bomber_equipment_6_desc:0 "Le Canadair CP-107 Argus est un avion de patrouille maritime conçu et fabriqué par Canadair pour l'Aviation royale canadienne (ARC). À ses débuts, l'Argus était réputé pour être le meilleur bombardier de patrouille anti-sous-marine au monde."
 CAN_nav_bomber_equipment_7:0 "Lockheed CP-140A Aurora"
 CAN_nav_bomber_equipment_7_short:0 "CP-140A Aurora"
 CAN_nav_bomber_equipment_7_desc:0 "Le Lockheed CP-140 Aurora est un avion de patrouille maritime exploité par l'Aviation royale canadienne. L'avion est basé sur la cellule du Lockheed P-3 Orion, mais est équipé de la suite électronique du Lockheed S-3 Viking. « Aurora » fait référence à la déesse romaine de l'aurore qui vole chaque matin dans le ciel avant le soleil."
 CAN_nav_bomber_equipment_8:0 "Lockheed CP-140M Aurora"
 CAN_nav_bomber_equipment_8_short:0 "CP-140M Aurora"
 CAN_nav_bomber_equipment_8_desc:0 "Version modernisée du CP-140A Aurora destinée à être utilisée comme avion anti-sous-marin et de patrouille par l'Aviation royale canadienne. Équipé de capteurs avancés, de bouées sonar et de torpilles modernes."
 CAN_transport_plane_equipment_1:0 "Douglas CC-129 Skytrain"
 CAN_transport_plane_equipment_1_short:0 "CC-129 Skytrain"
 CAN_transport_plane_equipment_1_desc:0 "Désignation des Forces canadiennes pour le C-47."
 CAN_transport_plane_equipment_2:0 "Canadair C-5 North Star"
 CAN_transport_plane_equipment_2_short:0 "C-5 North Star"
 CAN_transport_plane_equipment_2_desc:0 "Les North Star de l'ARC n'étaient pas pressurisés et étaient utilisés pour diverses missions de transport. Les North Star étaient également utilisés par le 412e Escadron de l'ARC pour diverses missions de transport de personnalités importantes et, dans l'ensemble, cet avion a fourni des services de transport longue distance précieux et fiables à l'ARC."
 CAN_transport_plane_equipment_3:0 "Bristol Type 170 Freighter"
 CAN_transport_plane_equipment_3_short:0 "Freighter"
 CAN_transport_plane_equipment_3_desc:0 "Le Bristol Type 170 Freighter est un avion bimoteur britannique conçu et construit par la Bristol Aeroplane Company à la fois comme avion-cargo et avion de ligne. Il était surtout connu pour être utilisé comme ferry aérien pour transporter des voitures et leurs passagers sur des distances relativement courtes. Une version réservée aux passagers a également été produite, connue sous le nom de Wayfarer."
 CAN_transport_plane_equipment_4:0 "Canadair CC-109 Cosmopolitan"
 CAN_transport_plane_equipment_4_short:0 "CC-109 Cosmopolitan"
 CAN_transport_plane_equipment_4_desc:0 "Le CC-109 Cosmopolitan, ou « Cosmo », utilisé par l'ARC, est devenu l'avion VIP standard et a remplacé le Douglas Dakota et le North American B-25 Mitchell pour les missions de transport léger. Les avions Cosmopolitan ont également été déployés en Europe pour soutenir le contingent canadien de l'OTAN, ainsi qu'aux États-Unis pour soutenir les opérations canadiennes du NORAD."
 CAN_transport_plane_equipment_5:0 "De Havilland Canada CC-115 Buffalo"
 CAN_transport_plane_equipment_5_short:0 "CC-115 Buffalo"
 CAN_transport_plane_equipment_5_desc:0 "Le De Havilland Canada DHC-5 Buffalo est un avion de transport utilitaire à turbopropulseur à décollage et atterrissage courts (STOL) développé à partir du DHC-4 Caribou, un ancien modèle à moteur à pistons. Cet avion offre des performances STOL exceptionnelles et est capable de décoller sur des distances bien plus courtes que la plupart des avions légers."
 CAN_transport_plane_equipment_6:0 "Canadair CC-106 Yukon"
 CAN_transport_plane_equipment_6_short:0 "CC-106 Yukon"
 CAN_transport_plane_equipment_6_desc:0 "Au départ, le CL-44-6 a été produit pour la RCAF sous le nom de CC-106 Yukon. Une fois les problèmes initiaux résolus, le Yukon a donné satisfaction à la RCAF et, en décembre 1961, il a établi un record mondial dans sa catégorie en parcourant 6 750 mi (10 860 km) entre Tokyo et la base de la RCAF à Trenton, en Ontario, en 17 heures et 3 minutes, à une vitesse moyenne de 400 mi/h."
 CAN_transport_plane_equipment_7:0 "de Havilland Canada CC-132 Dash 7"
 CAN_transport_plane_equipment_7_short:0 "CC-132 Dash 7"
 CAN_transport_plane_equipment_7_desc:0 "Désignation militaire canadienne pour la série 102/103. Communément appelé Dash 7, il s'agit d'un avion de ligne régional à turbopropulsion doté de performances de décollage et d'atterrissage courts (STOL). Il a effectué son premier vol en 1975 et est resté en production jusqu'en 1988."
 CAN_transport_plane_equipment_8:0 "Lockheed CC-130H-30 Super Hercules"
 CAN_transport_plane_equipment_8_short:0 "CC-130H-30"
 CAN_transport_plane_equipment_8_desc:0 "Désignation des avions Hercules des Forces armées canadiennes / de l'Aviation royale canadienne. L'armée de l'air américaine a utilisé la désignation CC-130H pour différencier la variante standard C-130H de la variante « allongée » C-130H, désignée C-130H-30."
 CAN_transport_plane_equipment_10:0 "Boeing CC-177 Globemaster III"
 CAN_transport_plane_equipment_10_short:0 "CC-177 Globemaster III"
 CAN_transport_plane_equipment_10_desc:0 "Variante canadienne du vénérable C-17 Globemaster III et version améliorée de celui-ci. Cette mise à niveau logicielle et matérielle constituait une amélioration majeure du système embarqué de génération de gaz inerte (OBIGGS II), d'un nouveau radar météorologique, d'un système de stabilisation amélioré et d'autres équipements avioniques."
 CAN_jet_strat_bomber_equipment_1:0 "Avro Lincoln II"
 CAN_jet_strat_bomber_equipment_1_short:0 "Lincoln II"
 CAN_jet_strat_bomber_equipment_2:0 "Canadair B-47 Stratojet"
 CAN_jet_strat_bomber_equipment_2_short:0 "B-47 Stratojet"
 CAN_jet_strat_bomber_equipment_2_desc:0 "Le B-47B prêté au Canada et converti par Canadair sous la désignation CL-52 afin de tester les moteurs Orenda du CF-105 Avro Arrow en 1956. Même s'il a été renvoyé aux États-Unis et mis au rebut seulement un an plus tard, et s'il avait été acheté comme bombardier ?"
 CAN_cv_CAS_equipment_1:0 "Marine royale canadienne"
 CAN_cv_CAS_equipment_1_short:0 "RCN"
 CAN_cv_CAS_equipment_1_desc:0 "La Marine royale canadienne (Royal Canadian Navy) est la force navale du Canada. La MRC est l'un des trois commandements environnementaux des Forces armées canadiennes."
 CAN_cv_CAS_equipment_2:0 "Blackburn Skua"
 CAN_cv_CAS_equipment_2_short:0 "Skua"
 CAN_cv_CAS_equipment_3:0 "Fairey Firefly Mk.1"
 CAN_cv_CAS_equipment_3_short:0 "Firefly Mk.1"
 CAN_cv_CAS_equipment_3_desc:0 "Le Canada a choisi d'acquérir le Firefly malgré l'opposition qui privilégiait l'achat d'avions américains. À titre de mesure provisoire, des Firefly de la Royal Navy ont été prêtés pendant que des avions plus perfectionnés et spécialement conçus à cet effet étaient en cours de construction."
 CAN_cv_jet_CAS_equipment_1:0 "Fairey Firefly AS Mk.5"
 CAN_cv_jet_CAS_equipment_1_short:0 "Firefly AS Mk.5"
 CAN_cv_jet_CAS_equipment_1_desc:0 "La marine canadienne a utilisé 65 Fireflies AS Mk.5 sur ses porte-avions. Le Firefly AS.Mk 5, plus récent, était un avion anti-sous-marin équipé de bouées acoustiques et d'équipements américains."
 CAN_cv_jet_CAS_equipment_2:0 "Hawker Sea Fury FB.11"
 CAN_cv_jet_CAS_equipment_2_short:0 "Sea Fury FB.11"
 CAN_cv_jet_CAS_equipment_2_desc:0 "Chasseur-bombardier monoplace pour la Royal Navy, la Royal Australian Navy, la Royal Canadian Navy et la Royal Netherlands Navy, 615 exemplaires construits, dont 31 pour la RAN et 53 pour la RCN."
 CAN_cv_fighter_equipment_1:0 "Gloster Sea Gladiator"
 CAN_cv_fighter_equipment_1_short:0 "Sea Gladiator"
 CAN_cv_fighter_equipment_1_desc:0 "Une version modifiée du Mk II, le Sea Gladiator, a été développée pour la Fleet Air Arm (FAA). Elle était équipée d'un crochet d'appontage, de points d'attache pour catapulte, d'une cellule renforcée et d'un carénage sous le fuselage pour accueillir un canot de sauvetage, le tout destiné à des opérations à bord de porte-avions."
 CAN_cv_fighter_equipment_2:0 "Supermarine Seafire F Mk.17"
 CAN_cv_fighter_equipment_2_short:0 "Seafire F Mk.17"
 CAN_cv_fighter_equipment_2_desc:0 "Le Supermarine Seafire est une version navale du Supermarine Spitfire adaptée pour être utilisée à partir de porte-avions. Son concept était similaire à celui du Hawker Sea Hurricane, une version navalisée du Hawker Hurricane, compagnon de stable du Spitfire. Le nom Seafire est dérivé de l'abréviation du nom complet Sea Spitfire."
 CAN_cv_fighter_equipment_3:0 "Supermarine Seafire FR 47"
 CAN_cv_fighter_equipment_3_short:0 "Seafire FR.47"
 CAN_cv_fighter_equipment_3_desc:0 "La version finale du Seafire était le Seafire F Mk 47 et FR Mk 47. Il n'y eut pas de véritable prototype. En tant que Seafire « définitif » basé sur un porte-avions, le Mk 47 intégrait plusieurs améliorations par rapport aux variantes précédentes. Tous les Mk 47 adoptaient les hélices contrarotatives Rotol."
 CAN_cv_jet_multirole_equipment_1:0 "Hawker Sea Fury F.11"
 CAN_cv_jet_multirole_equipment_1_short:0 "Sea Fury F.11"
 CAN_cv_jet_multirole_equipment_1_desc:0 "Chasseur-bombardier monoplace pour la Royal Navy, la Royal Australian Navy, la Royal Canadian Navy et la Royal Netherlands Navy, 615 exemplaires construits, dont 31 pour la RAN et 53 pour la RCN."
 CAN_cv_jet_multirole_equipment_2:0 "McDonnell Douglas F2H-3 Banshee"
 CAN_cv_jet_multirole_equipment_2_short:0 "F2H-3 Banshee"
 CAN_cv_jet_multirole_equipment_2_desc:0 "Le McDonnell F2H Banshee était un avion de chasse à réaction monoplace basé sur porte-avions, utilisé par la marine américaine et le corps des Marines des États-Unis de 1948 à 1961. Il fut l'un des principaux chasseurs américains utilisés pendant la guerre de Corée et le seul chasseur à réaction utilisé par la Marine royale canadienne."
 CAN_naval_helicopter_equipment_1:0 "Sikorsky S-51 ASW"
 CAN_naval_helicopter_equipment_1_short:0 "S-51 ASW"
 CAN_naval_helicopter_equipment_2:0 "Sikorsky HO4S-2 Chickasaw"
 CAN_naval_helicopter_equipment_2_short:0 "HO4S-2"
 CAN_naval_helicopter_equipment_3:0 "Sikorsky HO4S-3 Chickasaw"
 CAN_naval_helicopter_equipment_3_short:0 "HO4S-3"
 CAN_naval_helicopter_equipment_4:0 "Sikorsky CH-124 Sea King"
 CAN_naval_helicopter_equipment_4_short:0 "CH-124"
 CAN_naval_helicopter_equipment_5:0 "Sikorsky CH-124A Sea King"
 CAN_naval_helicopter_equipment_5_short:0 "CH-124A"
 CAN_naval_helicopter_equipment_6:0 "Sikorsky CH-124B Sea King"
 CAN_naval_helicopter_equipment_6_short:0 "CH-124B"
 CAN_naval_helicopter_equipment_7:0 "Sikorsky CH-148 Cyclone"
 CAN_naval_helicopter_equipment_7_short:0 "CH-148"
 CAN_scout_helicopter_equipment_1:0 "Hiller CH-112 Nomad"
 CAN_scout_helicopter_equipment_1_short:0 "CH-112"
 CAN_scout_helicopter_equipment_2:0 "Bell CH-136 Kiowa"
 CAN_scout_helicopter_equipment_2_short:0 "CH-136"
 CAN_utility_helicopter_equipment_1:0 "Sikorsky CH-126 Choctaw"
 CAN_utility_helicopter_equipment_1_short:0 "CH-126"
 CAN_utility_helicopter_equipment_2:0 "Bell CUH-1A Iroquois"
 CAN_utility_helicopter_equipment_2_short:0 "CUH-1A Iroquois"
 CAN_utility_helicopter_equipment_2_desc:0 "Premier membre d'une série d'hélicoptères connus sous le nom de « Huey » (du nom de sa désignation d'origine avant 1962, HU-1), l'UH-1A est la variante militaire de l'hélicoptère utilitaire Bell 204, introduit en 1959. Il s'agit du premier hélicoptère utilisé par l'armée américaine à être équipé d'un moteur à turbine. Il est devenu l'un des hélicoptères les plus prolifiques, symbole de l'implication des États-Unis dans la guerre du Vietnam. Bien qu'il soit communément appelé « Huey », son surnom officiel est « Iroquois »."
 CAN_utility_helicopter_equipment_3:0 "Bell CUH-1D Iroquois"
 CAN_utility_helicopter_equipment_3_short:0 "CUH-1D Iroquois"
 CAN_utility_helicopter_equipment_3_desc:0 "Lancé en 1963, l'UH-1D est la version militaire du Bell 205. Il a été conçu avec un fuselage allongé afin de pouvoir servir principalement comme hélicoptère de transport de troupes en remplacement du CH-34 Choctaw utilisé auparavant par l'armée américaine. 2 000 exemplaires de cette variante « Iroquois D » ont été construits, dont beaucoup ont été convertis à la norme UH-1H avec un moteur amélioré et plus puissant."
 CAN_utility_helicopter_equipment_4:0 "Bell CH-118 Huey"
 CAN_utility_helicopter_equipment_4_short:0 "CH-118"
 CAN_utility_helicopter_equipment_4_desc:0 "Ils ont été vendus au Canada pour être utilisés sous la désignation CUH-1H, le premier ayant été livré le 6 mars 1968. Ils ont été évalués par les Forces canadiennes et jugés inadaptés à un usage tactique au Canada, ce qui a conduit le gouvernement canadien à financer le développement de la version bimoteur de l'« Hotel », l'UH-1N Twin Huey. Les dix CUH-1H ont été rééquipés pour des missions de recherche et de sauvetage, et ont été rebaptisés CH-118."
 CAN_utility_helicopter_equipment_5:0 "Bell CH-135 Twin Huey"
 CAN_utility_helicopter_equipment_5_short:0 "CH-135"
 CAN_utility_helicopter_equipment_5_desc:0 "Le Bell UH-1N Twin Huey est un hélicoptère militaire de taille moyenne conçu et produit par le constructeur aérospatial américain Bell Helicopter. Il fait partie de la grande famille des Huey. La version initiale était le CUH-1N Twin Huey (plus tard CH-135 Twin Huey), qui a été commandé pour la première fois par les Forces canadiennes en 1968."
 CAN_utility_helicopter_equipment_6:0 "Bell CH-146 Griffon UTTH"
 CAN_utility_helicopter_equipment_6_short:0 "CH-146 Griffon UTTH"
 CAN_utility_helicopter_equipment_6_desc:0 "Le Bell CH-146 Griffon est un hélicoptère utilitaire polyvalent conçu par Bell Helicopter Textron comme une variante du Bell 412EP pour les Forces armées canadiennes. Le CH-146 est utilisé dans une grande variété de rôles, notamment pour la puissance de feu aérienne, la reconnaissance, la recherche et le sauvetage et les tâches de mobilité aérienne."
 CAN_utility_helicopter_equipment_7:0 "Bell CH-146 Mid-Life Update Griffon"
 CAN_utility_helicopter_equipment_7_short:0 "CH-146 Griffon MLU"
 CAN_utility_helicopter_equipment_7_desc:0 "Le Bell CH-146 Griffon est un hélicoptère utilitaire polyvalent conçu par Bell Helicopter Textron comme une variante du Bell 412EP pour les Forces armées canadiennes. Le CH-146 est utilisé dans une grande variété de rôles, notamment pour la puissance de feu aérienne, la reconnaissance, la recherche et le sauvetage et les tâches de mobilité aérienne."
 CAN_cargo_helicopter_equipment_1:0 "Piasecki CH-127"
 CAN_cargo_helicopter_equipment_1_short:0 "CH-127"
 CAN_cargo_helicopter_equipment_2:0 "Vertol CH-113A Voyageur"
 CAN_cargo_helicopter_equipment_2_short:0 "CH-113A"
 CAN_cargo_helicopter_equipment_4:0 "Boeing CH-147C Chinook"
 CAN_cargo_helicopter_equipment_4_short:0 "CH-147C Chinook"
 CAN_cargo_helicopter_equipment_4_desc:0 "Désignation canadienne du CH-47. Les CH-47 modifiés par le Canada ont été acceptés par la RNLAF dans les années 1990, mais auraient pu l'être plus tôt."
 CAN_cargo_helicopter_equipment_5:0 "Boeing CH-47D Chinook Block II"
 CAN_cargo_helicopter_equipment_5_short:0 "CH-47D Block II"
 CAN_cargo_helicopter_equipment_5_desc:0 "CH-47D modernisé avec une avionique avancée, des instruments GPS et une amélioration de la capacité de survie. Presque tous les anciens Chinook ont été mis à niveau selon cette norme."
 CAN_cargo_helicopter_equipment_6:0 "Boeing CH-47F Chinook"
 CAN_cargo_helicopter_equipment_6_short:0 "CH-47F Chinook"
 CAN_cargo_helicopter_equipment_6_desc:0 "En 2001, le premier CH-47F, une version améliorée du CH-47D, a effectué son vol inaugural ; le premier modèle de série a été présenté le 15 juin 2006 dans les installations de Boeing à Ridley Park, en Pennsylvanie, et a volé pour la première fois le 23 octobre 2006. Les améliorations comprennent des moteurs Honeywell de 4 868 chevaux-vapeur (3 630 kW) et une cellule plus robuste, construite d'une seule pièce afin de réduire les besoins d'entretien. La construction fraisée réduit les vibrations, ainsi que les besoins d'inspection et de réparation, et élimine les points de flexion afin d'augmenter la durée de vie."
 CAN_mp_uav_1:0 "AeroVironment RQ-11 Raven"
 CAN_mp_uav_1_short:0 "RQ-11 Raven"
 CAN_mp_uav_2:0 "AeroVironment RQ-20 Puma"
 CAN_mp_uav_2_short:0 "RQ-20 Puma"
 CAN_cas_uav_equipment_1:0 "Canadair CL-289"
 CAN_cas_uav_equipment_1_short:0 "CL-289"
 CAN_cas_uav_equipment_2:0 "SAGEM CU-161 Sperwer"
 CAN_cas_uav_equipment_2_short:0 "CU-161 Sperwer"
 CAN_cas_uav_equipment_3:0 "IAI CU-170 Heron-TP"
 CAN_cas_uav_equipment_3_short:0 "CU-170 Heron-TP"
 CAN_naval_uav_equipment_1:0 "Bombardier Aerospace CL-327 Sentinel"
 CAN_naval_uav_equipment_1_short:0 "CL-327 Sentinel"
 CAN_naval_uav_equipment_2:0 "Boeing Insitu CU-169 ScanEagle"
 CAN_naval_uav_equipment_2_short:0 "CU-169 ScanEagle"
 CAN_naval_uav_equipment_3:0 "UMS CU-176 Gargoyle"
 CAN_naval_uav_equipment_3_short:0 "CU-176 Gargoyle"
 HOL_fighter_equipment_0:0 "Force aérienne royale"
 HOL_fighter_equipment_0_short:0 "Klu"
 HOL_fighter_equipment_0_desc:0 "L'armée de l'air royale néerlandaise est la branche aérienne militaire des forces armées néerlandaises. Elle a été créée en 1953 ; son ancêtre, la Luchtvaartafdeling (division aérienne) de l'armée néerlandaise, a été fondée en 1913."
 HOL_heavy_fighter_equipment_1:0 "Fokker G.1 Mercury"
 HOL_heavy_fighter_equipment_1_short:0 "Fokker G.1M"
 HOL_heavy_fighter_equipment_1_desc:0 "Le Fokker G.IM est un avion de chasse lourd bimoteur néerlandais équipé de moteurs Bristol Mercury VIII, qui fut le principal intercepteur des Néerlandais pendant leur brève lutte du mois de mai."
 HOL_heavy_fighter_equipment_2:0 "Fokker G.1 Wasp"
 HOL_heavy_fighter_equipment_2_short:0 "Fokker G.1W"
 HOL_heavy_fighter_equipment_2_desc:0 "Le Fokker G.IW est un chasseur lourd bimoteur néerlandais pouvant accueillir deux personnes, conçu à des fins d'exportation. L'avion est équipé de moteurs Pratt & Whitney SB4-G Twin Wasp Junior. Les exportations ne se sont jamais concrétisées, car les Pays-Bas ont été envahis."
 HOL_heavy_fighter_equipment_3:0 "de Havilland Mosquito F Mk.II"
 HOL_heavy_fighter_equipment_3_short:0 "Mosquito F Mk.II"
 HOL_jet_interceptor_equipment_1:0 "Fokker Aviolanda Meteor F.3"
 HOL_jet_interceptor_equipment_1_short:0 "Meteor F.3"
 HOL_jet_interceptor_equipment_2:0 "North American F-86K Sabre 'Kaasjager'"
 HOL_jet_interceptor_equipment_2_short:0 "F-86K Sabre"
 HOL_jet_interceptor_equipment_3:0 "North American F-86L Sabre 'Kaasjager'"
 HOL_jet_interceptor_equipment_3_short:0 "F-86L Sabre"
 HOL_jet_interceptor_equipment_4:0 "Hawker Hunter F.4"
 HOL_jet_interceptor_equipment_4_short:0 "Hunter F.4"
 HOL_high_mach_jet_interceptor_equipment_2:0 "Lockheed F-104A Starfighter"
 HOL_high_mach_jet_interceptor_equipment_2_short:0 "F-104A Starfighter"
 HOL_CAS_equipment_1:0 "Fokker C.X Series I"
 HOL_CAS_equipment_1_short:0 "Fokker C.X"
 HOL_CAS_equipment_1_desc:0 "Le Fokker C.X a été initialement conçu pour l'armée royale des Indes orientales néerlandaises, afin de remplacer le Fokker C.V. Comme tous les avions Fokker de l'époque, il était de construction mixte, avec des ailes en bois et un châssis en tubes d'acier soudés recouvert de plaques d'aluminium à l'avant de l'avion et de tissu à l'arrière. Le prototype a été construit en 1934 avec un moteur Rolls-Royce Kestrel V."
 HOL_CAS_equipment_2:0 "Douglas DB-8A/3"
 HOL_CAS_equipment_2_short:0 "DB-8A"
 HOL_CAS_equipment_2_desc:0 "Les Pays-Bas, qui avaient un besoin urgent d'avions de combat modernes, passèrent commande en 1939 de 18 modèles 8A-3N, la version export du Douglas A-17, qui furent tous livrés avant la fin de l'année."
 HOL_CAS_equipment_3:0 "Curtiss P-40N Kittyhawk"
 HOL_CAS_equipment_3_short:0 "P-40N Kittyhawk"
 HOL_CAS_equipment_3_desc:0 "Le P-40 était un avion de chasse monomoteur entièrement métallique développé en 1938. Il s'agissait d'une version modifiée du P-36 Hawk. Ce modèle fut utilisé par un grand nombre de puissances alliées pendant la Seconde Guerre mondiale et, bien qu'il fût inférieur aux P-47 et P-51 plus récents, il resta en service sur le front jusqu'à la fin de la guerre. 200 pilotes alliés de 7 nations différentes, dont les États-Unis, les pays du Commonwealth britannique et l'Union soviétique, sont devenus des as du P-40. Malgré des désignations différentes pour le Commonwealth et l'Union soviétique, le surnom officiel dans l'armée américaine est « Warhawk »."
 HOL_CAS_equipment_4:0 "Douglas A-26C Invader"
 HOL_CAS_equipment_4_short:0 "A-26C Invader"
 HOL_CAS_equipment_4_desc:0 "Le Douglas A-26 Invader est un bombardier léger bimoteur américain et un avion d'attaque au sol. Construit par la Douglas Aircraft Company pendant la Seconde Guerre mondiale, l'Invader a également été utilisé lors de plusieurs conflits majeurs de la guerre froide."
 HOL_jet_CAS_equipment_1:0 "Republic F-84E Thunderjet"
 HOL_jet_CAS_equipment_1_short:0 "F-84E Thunderjet"
 HOL_jet_CAS_equipment_1_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 HOL_jet_CAS_equipment_2:0 "Republic F-84G Thunderjet"
 HOL_jet_CAS_equipment_2_short:0 "F-84G Thunderjet"
 HOL_jet_CAS_equipment_2_desc:0 "Le F-84 a été conçu comme un avion de chasse-bombardier diurne destiné à remplacer le P-47 Thunderbolt. Bien qu'il soit entré en service en 1947, le Thunderjet a été confronté à de nombreux problèmes. À tel point que, jusqu'à l'introduction de la variante « D » en 1949, le F-84 a failli être abandonné. Ce modèle a servi d'avion d'attaque principal à l'armée de l'air américaine pendant la guerre de Corée et a été le premier avion de chasse utilisé par l'équipe de démonstration de l'USAF, les « Thunderbirds ». C'est peut-être pour cette raison que le nom « Thunderjet » convient si bien à ce modèle."
 HOL_jet_CAS_equipment_3:0 "Republic F-84F Thunderstreak"
 HOL_jet_CAS_equipment_3_short:0 "F-84F Thunderstreak"
 HOL_jet_CAS_equipment_3_desc:0 "Développé à partir du F-84 Thunderjet précédent, le F-84F était une variante à ailes en flèche du chasseur-bombardier, conçue pour rapprocher ce type d'appareil des performances du très vanté F-86 Sabre. Malgré des capacités améliorées par rapport à son prédécesseur à ailes droites, il présentait toujours les mêmes défauts en termes de performances au décollage, tout en offrant une stabilité et un contrôle médiocres. Ce modèle a été utilisé de manière limitée tout au long de sa carrière, qui s'est terminée en 1971. Son surnom est « Thunderstreak »."
 HOL_fighter_equipment_1:0 "Fokker D.XXI"
 HOL_fighter_equipment_1_short:0 "Fokker D.XXI"
 HOL_fighter_equipment_2:0 "Koolhoven F.K.58"
 HOL_fighter_equipment_2_short:0 "F.K. 58"
 HOL_fighter_equipment_3:0 "Supermarine Spitfire Mk.XIV"
 HOL_fighter_equipment_3_short:0 "Spitfire Mk.XIV"
 HOL_jet_multirole_equipment_1:0 "North American P-51K Mustang"
 HOL_jet_multirole_equipment_1_short:0 "P-51K Mustang"
 HOL_jet_multirole_equipment_2:0 "Fokker Aviolanda Meteor FB.8 w/ HVAR"
 HOL_jet_multirole_equipment_2_short:0 "Meteor FB.8"
 HOL_jet_multirole_equipment_3:0 "Hawker Hunter F.1"
 HOL_jet_multirole_equipment_3_short:0 "Hunter F.1"
 HOL_jet_multirole_equipment_4:0 "Hawker Hunter F.6"
 HOL_jet_multirole_equipment_4_short:0 "Hunter F.6"
 HOL_jet_multirole_equipment_5:0 "Fokker F-104G Starfighter"
 HOL_jet_multirole_equipment_5_short:0 "F-104G Starfighter"
 HOL_jet_multirole_equipment_5_desc:0 "Pour remplacer les Hawker Hunters vieillissants, l'armée de l'air royale néerlandaise a utilisé des Lockheed F-104G Starfighters construits par Fokker après que Lockheed ait versé des pots-de-vin à de hauts responsables du gouvernement néerlandais, notamment au mari de la reine, le prince Bernard. Mis à part les scandales, le F104G a été utilisé dans une capacité multirôle comme intercepteur et comme avion d'attaque au sol."
 HOL_jet_multirole_equipment_6:0 "Fokker F-104G Starfighter Reliability Upgrade"
 HOL_jet_multirole_equipment_6_short:0 "F-104G Starfighter RU"
 HOL_jet_multirole_equipment_7:0 "Mise à niveau à mi-vie du Fokker F-104G Starfighter"
 HOL_jet_multirole_equipment_7_short:0 "F-104G MLU"
 HOL_jet_multirole_equipment_8:0 "Fokker F-16A Fighting Falcon"
 HOL_jet_multirole_equipment_8_short:0 "F-16A Fighting Falcon"
 HOL_jet_multirole_equipment_8_desc:0 "Un chasseur maniable et léger, offrant un équilibre parfait entre maniabilité et stabilité. Il est doté d'un fuselage monocoque exceptionnellement léger et aérodynamique, et bien qu'il s'agisse d'un avion monomoteur, il est équipé d'un moteur puissant. Surnommé le « Fighting Falcon », son coût relativement faible et sa puissance élevée expliquent pourquoi il a été adopté par les forces aériennes du monde entier. À ce jour, plus de 4 000 exemplaires de ce modèle à succès ont été fabriqués."
 HOL_jet_multirole_equipment_9:0 "Fokker F-16A Block 15 OCU (améliorations des capacités opérationnelles) Fighting Falcon"
 HOL_jet_multirole_equipment_9_short:0 "F-16A Block 15 OCU"
 HOL_jet_multirole_equipment_9_desc:0 "Première modification majeure apportée au F-16, l'avion Block 15 était équipé de stabilisateurs horizontaux plus grands, de deux points d'emport supplémentaires au niveau de l'entrée d'air sous le nez, d'un nouveau radar et d'une capacité accrue pour les pylônes sous les ailes. Cette variante était également équipée d'une radio UHF (ultra haute fréquence) de dernière génération. Il s'agit de la variante la plus répandue parmi les modèles F-16."
 HOL_jet_multirole_equipment_10:0 "Fokker F-16AM Block 15 MLU (mise à niveau à mi-vie) Fighting Falcon"
 HOL_jet_multirole_equipment_10_short:0 "F-16AM Block 15 MLU"
 HOL_jet_multirole_equipment_10_desc:0 "Le programme F-16 Mid-Life Update (MLU) qui en a résulté a été conçu pour moderniser le cockpit et l'avionique afin de les rendre équivalents à ceux du F-16C/D Block 50/52, ajouter la capacité d'utiliser des missiles air-air guidés par radar et, de manière générale, améliorer les performances opérationnelles, la fiabilité, la facilité d'entretien et la maintenabilité de l'avion."
 HOL_mr_stealth_fighter_equipment_1:0 "Lockheed Martin F-35A Lightning II"
 HOL_mr_stealth_fighter_equipment_1_short:0 "F-35A Lightning II"
 HOL_mr_stealth_fighter_equipment_1_desc:0 "Le F-35A est la variante à décollage et atterrissage conventionnels (CTOL) de la famille F-35 Lightning II de Lockheed Martin. Le programme F-35 a débuté en 1992, la variante A ayant pris son envol fin 2006 et largué ses premières bombes moins de six ans plus tard. La variante A est la plus petite et la plus légère des variantes du F-35. Elle est principalement destinée à remplacer le F-16 Fighting Falcon."
 HOL_tac_bomber_equipment_0:0 "Fokker C.V D/E"
 HOL_tac_bomber_equipment_0_short:0 "Fokker C.V D/E"
 HOL_tac_bomber_equipment_1:0 "Fokker T.V"
 HOL_tac_bomber_equipment_1_short:0 "Fokker T.V"
 HOL_tac_bomber_equipment_2:0 "Fokker T.IX"
 HOL_tac_bomber_equipment_2_short:0 "Fokker T.IX"
 HOL_tac_bomber_equipment_3:0 "North American B-25J Mitchell"
 HOL_tac_bomber_equipment_3_short:0 "B-25J Mitchell"
 HOL_jet_light_equipment_1:0 "Fokker S.11 Instructor"
 HOL_jet_light_equipment_1_short:0 "S.11 Instructor"
 HOL_jet_light_equipment_1_desc:0 "Le Fokker S.11 Instructor est un avion d'entraînement militaire biplace néerlandais conçu et fabriqué par Fokker pour l'armée de l'air royale néerlandaise immédiatement après la Seconde Guerre mondiale."
 HOL_jet_light_equipment_2:0 "Fokker S.14 Machtrainer"
 HOL_jet_light_equipment_2_short:0 "S.14 Machtrainer"
 HOL_jet_light_equipment_2_desc:0 "Le Fokker S.14 Machtrainer est un avion d'entraînement militaire biplace néerlandais conçu et fabriqué par Fokker pour l'armée de l'air royale néerlandaise. Il a la particularité d'être l'un des premiers avions d'entraînement à réaction au monde et pouvait être équipé de bombes non guidées et même d'un pod de mitrailleuses en cours de développement."
 HOL_jet_light_equipment_3:0 "Canadair NF-5A Freedom Fighter"
 HOL_jet_light_equipment_3_short:0 "NF-5A Freedom Fighter"
 HOL_jet_light_equipment_3_desc:0 "Le Canadair CF-5/CF-116 est la version construite sous licence par Canadair de l'avion américain Northrop F-5 Freedom Fighter, principalement destiné aux Forces canadiennes sous le nom de CF-5 et à l'armée de l'air royale néerlandaise sous le nom de NF-5."
 HOL_jet_light_equipment_4:0 "Canadair NF-5B Freedom Fighter"
 HOL_jet_light_equipment_4_short:0 "NF-5B Freedom Fighter"
 HOL_jet_light_equipment_4_desc:0 "Le Canadair CF-5/CF-116 est la version construite sous licence par Canadair de l'avion américain Northrop F-5 Freedom Fighter, principalement destiné aux Forces canadiennes sous le nom de CF-5 et à l'armée de l'air royale néerlandaise sous le nom de NF-5."
 HOL_jet_light_equipment_5:0 "Canadair NF-5A Freedom Fighter PUFF"
 HOL_jet_light_equipment_5_short:0 "NF-5A PUFF"
 HOL_jet_light_equipment_5_desc:0 "Le Canadair CF-5/CF-116 est la version construite sous licence par Canadair du Northrop F-5 Freedom Fighter américain. Le programme PUFF visait à accroître la capacité de survie du F-5 dans un espace aérien de plus en plus disputé en matière de systèmes antiaériens et peut également être considéré comme une mise à niveau à mi-vie."
 HOL_recon_equipment_0:0 "Taylorcraft Auster"
 HOL_recon_equipment_0_short:0 "Auster"
 HOL_recon_equipment_0_desc:0 "Le Taylorcraft Auster était un avion militaire britannique de liaison et d'observation produit par la société Taylorcraft Aeroplanes (England) Limited pendant la Seconde Guerre mondiale."
 HOL_jet_recon_equipment_0:0 "Piper L-18 Super Cub"
 HOL_jet_recon_equipment_0_short:0 "L-18 Super Cub"
 HOL_jet_recon_equipment_0_desc:0 "Le Piper PA-18 Super Cub est un monoplan bimoteur à deux places. Lancé en 1949 par Piper Aircraft, il a été développé à partir du Piper PA-11."
 HOL_jet_recon_equipment_1:0 "Lockheed RF-104G Starfighter"
 HOL_jet_recon_equipment_1_short:0 "RF-104G Starfighter"
 HOL_jet_recon_equipment_1_desc:0 "Le RF-104G était un modèle de reconnaissance tactique basé sur le F-104G, généralement équipé de trois caméras KS-67A montées dans le fuselage avant à la place du canon interne. La plupart des 189 appareils construits ont ensuite été reconfigurés selon les normes du F-104G."
 HOL_jet_recon_equipment_2:0 "Fokker Locked Martin F-16A(R) Fighting Falcon"
 HOL_jet_recon_equipment_2_short:0 "F-16A(R) Fighting Falcon"
 HOL_jet_recon_equipment_2_desc:0 "Une vingtaine de F-16A de l'armée de l'air royale néerlandaise (RNLAF) ont été équipés de pods de reconnaissance tactique à basse altitude Oude Delft Orpheus fabriqués localement, transférés depuis ses RF-104G retirés du service. Désignés F-16A(R)"
