 tech_field_hospital_helicopter6:0 "Hélicoptères MEDEVAC I"
 tech_field_hospital_helicopter6_desc:0 "WIP"
 tech_field_hospital_helicopter7:0 "Hélicoptères MEDEVAC I"
 tech_field_hospital_helicopter7_desc:0 "WIP"
 tech_logistics_company:0 "Logistique I : Corps des logistes"
 tech_logistics_company_desc:0 "Les corps logistiques sont composés de personnel non combattant qui assure l'approvisionnement et le ravitaillement d'une armée. Comptant parmi les éléments les plus importants d'une armée, les corps logistiques fournissent des munitions, des vivres et des pièces de rechange afin que celle-ci puisse poursuivre les combats. De plus, des corps spécialisés et des officiers gèrent les réseaux et réduisent le gaspillage, ce qui contribue grandement à diminuer la consommation totale."
 tech_logistics_company2:0 "Logistique II : Escorte de convois"
 tech_logistics_company2_desc:0 "Les convois logistiques constituent des cibles de choix pour les agents infiltrés et les opérations menées derrière les lignes ennemies. En évaluant les risques et en sécurisant les voies d'approvisionnement à l'aide de patrouilles et d'escortes, il est possible de protéger les ravitaillements et de sauver des provisions précieuses qui seraient normalement détruites, ce qui permet de réduire encore davantage la consommation globale."
 tech_logistics_company3:0 "Logistique III : Normalisation de l'approvisionnement"
 tech_logistics_company3_desc:0 "Les différents fabricants ou régions ont généralement leurs propres méthodes de stockage et d'étiquetage des provisions. Cela peut représenter une charge importante pour les services logistiques. Il est donc important d'élaborer un catalogue national normalisé des provisions militaires afin de faciliter la tâche des officiers chargés de l'approvisionnement."
 tech_logistics_company4:0 "Logistique IV : Conteneurs légers/compacts"
 tech_logistics_company4_desc:0 "Le poids est un enjeu majeur dans le domaine de la logistique. Les véhicules ont une capacité de charge limitée et sont également soumis à des restrictions quant au volume des marchandises qu’ils peuvent transporter. La conception de conteneurs légers, résistants et compacts permet d’expédier davantage de marchandises plus rapidement et avec une meilleure efficacité énergétique."
 tech_logistics_company5:0 "Logistique V : Corps d'approvisionnement tout-terrain"
 tech_logistics_company5_desc:0 "On ne peut pas toujours compter sur les infrastructures et les routes de l'ennemi. Elles peuvent être détruites dans le cadre d'une politique de la terre brûlée, ou ne pas exister tout simplement. De même, on ne peut pas toujours compter sur le fait que nos propres infrastructures ne seront pas détruites, ni même qu'elles existent. Il est donc important que les véhicules de ravitaillement et les responsables logistiques soient capables de circuler hors des sentiers battus et de trouver de nouveaux chemins afin d'améliorer la mobilité."
 tech_logistics_company6:0 "Logistique VI : Missions aériennes efficaces"
 tech_logistics_company6_desc:0 "Les missions aériennes et les ravitaillements parachutés peuvent être perdus, détruits, capturés par l'ennemi ou par des partisans, voire nécessiter d'importantes quantités de carburant pour être acheminés. En revoyant les plans de parachutage et les parachutes eux-mêmes, les missions aériennes peuvent acheminer les ravitaillements nécessaires plus rapidement."
 tech_logistics_company7:0 "Logistique VII : Véhicules à grande capacité"
 tech_logistics_company7_desc:0 "Une fois que toutes les méthodes de gestion et tous les protocoles ont été pleinement optimisés, il ne reste plus qu'à rendre les véhicules plus robustes, plus efficaces et plus spacieux. C'est aussi simple que cela."
 tech_logistics_company_helicopter3:0 "Hélicoptère de logistique I"
 tech_logistics_company_helicopter3_desc:0 "WIP"
 tech_logistics_company_helicopter4:0 "Hélicoptère de logistique II"
 tech_logistics_company_helicopter4_desc:0 "WIP"
 tech_logistics_company_helicopter5:0 "Hélicoptère de logistique III"
 tech_logistics_company_helicopter5_desc:0 "WIP"
 tech_logistics_company_helicopter6:0 "Hélicoptère de logistique IV"
 tech_logistics_company_helicopter6_desc:0 "WIP"
 tech_logistics_company_helicopter7:0 "Hélicoptère de logistique V"
 tech_logistics_company_helicopter7_desc:0 "WIP"
 tech_military_police:0 "Police militaire I : Corps de la police militaire"
 tech_military_police_desc:0 "La police militaire est un corps d'officiers spécialisé chargé de maintenir l'ordre au sein d'une division et d'assurer la sécurité dans une zone de combat. La guerre est, par nature, destructrice. Les responsables gouvernementaux, les policiers et les agents de sécurité constituent des cibles naturelles et des belligérants dans un conflit ; la police militaire doit donc maintenir l'ordre et réprimer l'insurrection. Les membres de la police militaire de base ne sont ni plus qualifiés ni différents des forces de police ordinaires, à l'exception d'un entraînement au combat plus poussé et de leur capacité à établir des rondes dans une zone qui leur est inconnue."
 tech_military_police2:0 "Police militaire II : Opérations de contre-insurrection"
 tech_military_police2_desc:0 "Les insurgés et les partisans peuvent représenter un danger extrême pour une opération militaire et poser des problèmes sur le plan stratégique. Qu'il s'agisse de sabotage, d'embuscades ou de la transmission de renseignements à l'ennemi, n'importe qui peut devenir un insurgé. Être capable de traquer les insurgés et les partisans et de réprimer la rébellion dans une zone de guerre est une opération cruciale. Les armes à feu et autres armes doivent être confisquées, les cellules de milices doivent être localisées et détruites, et les agents eux-mêmes doivent être neutralisés. Il est donc nécessaire de mettre au point un équipement spécial et des variantes militarisées de l'équipement policier, et de planifier des protocoles de répression."
 tech_military_police3:0 "Police militaire III : Lutte anti-émeute"
 tech_military_police3_desc:0 "Outre les cellules miliciennes, des émeutes désorganisées peuvent également éclater parmi des populations rebelles qui ne maîtrisent ni la guérilla ni la théorie de la résistance. Bien qu’elles ne soient pas aussi dangereuses qu’une cellule milicienne parfaitement organisée, les émeutes peuvent provoquer de graves troubles, empêcher l’accès aux ressources et aux industries, et rallier des soutiens aux partisans. Il est donc nécessaire de contrôler et de réprimer ces émeutes. Cependant, le recours à la force meurtrière pure, bien que simple et efficace, ne fait que radicaliser les populations locales et servir l'objectif initial de l'émeute. Il est donc d'une importance vitale de développer des techniques de contrôle des émeutes de niveau militaire afin de maintenir l'ordre et de réprimer les manifestations."
 support_tech_military_police3_tt:0 "§YRéduit de §G35%§! les chances qu'une émeute aboutisse dans les territoires occupés§!"
 tech_military_police4:0 "Police militaire IV : Corps d'aide aux sinistrés de guerre"
 tech_military_police4_desc:0 "Il ne suffit pas de simplement réprimer la résistance et de pacifier les populations. La résistance pacifique est toujours possible et peut poser problème. De plus, les ravages considérables causés par la guerre peuvent pousser les partisans à former des cellules. Apporter une aide humanitaire en temps de guerre est judicieux pour de nombreuses raisons. L'aide humanitaire permet à une région de se relever plus rapidement pendant et après la guerre. Elle contribue à préserver la richesse et le développement qui, sans cela, seraient perdus. L'aide humanitaire accélère la reconstruction. Enfin, apporter une aide humanitaire peut permettre de gagner la guerre la plus importante de toutes : celle des cœurs et des esprits."
 tech_military_police5:0 "Police militaire V : Maintien de la paix"
 tech_military_police5_desc:0 "Le maintien de la paix est une mesure proactive visant à prévenir les soulèvements et à limiter les ravages. Les opérations de maintien de la paix consistent généralement à former de nouvelles forces de sécurité locales chargées de faire respecter la loi et de rétablir la normalité. L'ordre et la stabilité constituent les meilleurs moyens d'apaiser les tensions. Le maintien de la paix nécessite que la police militaire soit formée pour assurer la sécurité locale et sélectionner les personnes susceptibles de ne pas poser de problèmes afin qu'elles intègrent ces forces de sécurité. En outre, il faut mettre en place des chaînes logistiques pour l'approvisionnement en matériel de sécurité afin de pouvoir établir des zones de sécurité."
 tech_military_police6:0 "Police militaire VI : Répression mémétique"
 tech_military_police6_desc:0 "Gagner les cœurs et les esprits grâce à l'aide humanitaire et au maintien de la paix constitue un bon moyen de prévenir l'insurrection. Cependant, tout le monde n'en est pas convaincu, en particulier les patriotes et les démagogues. Il est donc nécessaire d'utiliser la peur comme un outil pour réprimer les autres. Toutefois, cette peur ne doit pas être suscitée d'une manière qui nuise à l'aide humanitaire ou au maintien de la paix. Les reportages de guerre, la propagande, la guerre mémétique, les débats idéologiques et d'autres méthodes similaires sont autant de moyens de semer le doute au sein d'une population occupée."
 tech_military_police7:0 "Police militaire VII : Armes et tactiques non létales modernes"
 tech_military_police7_desc:0 "Les tactiques et les armes non létales sont utilisées depuis les débuts de la civilisation humaine et font naturellement partie intégrante des opérations de maintien de l'ordre. Cependant, la lutte contre la criminalité intérieure est tout autre chose que la lutte contre les insurgés. Pour mieux contrôler la population, éviter de susciter la résistance et exercer une pression psychologique, il faut mettre au point de nouvelles méthodes de neutralisation. Investir massivement dans le développement d'armes non létales, de produits chimiques, de formations et d'équipements sera payant, car cela permettra à des effectifs réduits d'exercer un effet dissuasif plus important."
 tech_signal_company:0 "Signal I : Commandement et contrôle"
 tech_signal_company_desc:0 "Les compagnies de transmissions assurent la coordination et la communication au sein d'une division et à l'extérieur de celle-ci. Grâce à leur matériel de communication, elles contribuent au commandement et au contrôle d'une division et lui permettent de mieux réagir aux situations qu'auparavant. Le commandement et le contrôle nécessitent des spécialistes des transmissions et du matériel de communication."
 tech_signal_company2:0 "Signal II : C3"
 tech_signal_company2_desc:0 "C3 signifie « Communications, Commandement et Contrôle ». Grâce à la mise en œuvre du système C3, les unités peuvent désormais communiquer entre elles, réagir de manière dynamique aux mouvements et aux percées de l'ennemi, et s'adapter en conséquence. Le système C3 nécessite la présence de spécialistes des transmissions répartis dans toute la division, dans de nombreux domaines différents, afin de relayer les informations et d'améliorer la connaissance de la situation."
 tech_signal_company3:0 "Signal III : Interopérabilité"
 tech_signal_company3_desc:0 "L'interopérabilité constitue une avancée du C3. Elle représente une évolution des doctrines en matière de communication et de coordination directe entre les éléments de combat. Ainsi, ces derniers sont en mesure de communiquer entre eux sans avoir besoin d'un officier de liaison et peuvent s'entraider de leur propre initiative."
 tech_signal_company4:0 "Signal IV : ISTAR"
 tech_signal_company4_desc:0 "ISTAR est l'acronyme de « Intelligence, Surveillance, Target Acquisition, and Reconnaissance » (renseignement, surveillance, acquisition d'objectifs et reconnaissance). Il s'agit de la communication active entre les éléments de reconnaissance et tous les participants au réseau de communication. L'ISTAR permet aux éléments de reconnaissance de transmettre des informations au reste de la division avec une grande efficacité. Il permet également à ces éléments de contribuer à fournir des informations aux éléments de combat qui en ont besoin."
 tech_signal_company5:0 "Signal V : MISI"
 tech_signal_company5_desc:0 "L'intégration des systèmes d'information modernes (MISI) consiste à mettre en œuvre des systèmes d'information modernes, tels que les ordinateurs portables, afin de faciliter le contrôle tactique. Grâce à la MISI, il est possible d'établir un niveau inégalé de contrôle tactique direct entre l'état-major et les unités de combat sur le terrain. La MISI permet la concertation entre les officiers supérieurs expérimentés et les officiers subalternes, ce qui renforce les capacités tactiques et de combat."
 tech_signal_company6:0 "Signal VI : Communications personnelles"
 tech_signal_company6_desc:0 "Les moyens de communication individuels sont des équipements de communication fournis à la quasi-totalité des membres d'une division. Ils permettent ainsi de maintenir les communications, car la mise hors de combat d'un spécialiste des transmissions n'entraîne pas nécessairement la coupure totale des communications. La mise au point de ces moyens de communication nécessite la miniaturisation des équipements et la mise en place de protocoles permettant de désactiver les appareils compromis."
 tech_signal_company7:0 "Signal VII : OVERLORD"
 tech_signal_company7_desc:0 "OVERLORD est une interface de combat théorique qui n'a encore été pleinement mise en œuvre par aucun pays en raison du coût exorbitant lié au développement, à la maintenance et à la mise à jour des logiciels nécessaires. OVERLORD crée une interface conçue et mise à jour par l'état-major à partir de rapports de reconnaissance continus et des informations reçues. Cela permet d'atteindre un niveau d'interopérabilité, de communication et de commandement sans précédent, capable de permettre à pratiquement toutes les troupes de recevoir des informations sur les troupes voisines et d'éviter les conflits qu'elles ne peuvent pas gérer, tout en engageant avec précision les ennemis qu'elles sont en mesure d'affronter. Tant qu'une personne est au courant de la présence d'un ennemi et que les communications sont toujours actives, tout le monde peut en être informé."
 tech_maintenance_company:0 "Maintenance I : Mécanique militaire"
 tech_maintenance_company_desc:0 "Les compagnies de maintenance sont des unités non combattantes spécialisées dans l'entretien et la réparation des armes et du matériel militaires. Si la plupart des tâches de nettoyage et d'entretien courantes peuvent être effectuées par les soldats qui utilisent ces armes et ce matériel, des mécaniciens spécialisés sont en mesure de s'en charger plus efficacement et de soulager considérablement ces derniers, leur permettant ainsi de se concentrer sur d'autres tâches. Les mécaniciens constituent l'élément le plus fondamental, mais aussi l'un des plus importants, d'une compagnie de maintenance."
 tech_maintenance_company2:0 "Maintenance II : Gestion"
 tech_maintenance_company2_desc:0 "Les responsables de la maintenance et les chefs d'équipe militaires jouent un rôle essentiel dans l'efficacité des entreprises de maintenance. En mettant en œuvre des stratégies et des politiques de gestion sur le terrain, ils parviennent à améliorer considérablement la rapidité et l'efficacité avec lesquelles les réparations et la maintenance sont effectuées."
 tech_maintenance_company3:0 "Maintenance III : Outils et équipements améliorés"
 tech_maintenance_company3_desc:0 "La mise au point de nouveaux outils et équipements spécialisés dans la maintenance et la réparation sera d'une grande aide pour les entreprises de maintenance. Des équipements fiables ou automatisés faciliteront le travail des mécaniciens."
 tech_maintenance_company4:0 "Maintenance IV : Outils et équipements encore améliorés"
 tech_maintenance_company4_desc:0 "L'optimisation continue des outils, qui les rend plus fiables et plus faciles à manipuler, facilite encore davantage les réparations sur le terrain et l'entretien régulier."
 tech_maintenance_company5:0 "Entretien V : Pièces polyvalentes"
 tech_maintenance_company5_desc:0 "En temps de guerre, il n’est pas rare que les unités de maintenance se retrouvent à court de composants ou de pièces de rechange. Les pièces endommagées ou détruites sont très variables et imprévisibles en raison de la nature même des combats. C’est pour cette raison qu’il est souhaitable de disposer de stocks de pièces polyvalentes supplémentaires et de kits de réparation destinés à n’être utilisés qu’à titre temporaire. Grâce à d'intenses efforts de développement et à des investissements importants, ces kits et ces pièces peuvent être conçus pour des réparations sur le terrain, afin de maintenir les véhicules et les armes en état de combat suffisamment longtemps pour qu'ils puissent bénéficier de réparations définitives."
 tech_maintenance_company6:0 "Mise à jour VI : Mécaniques de combat"
 tech_maintenance_company6_desc:0 "C'est souvent au cœur des combats que les situations de réparation les plus critiques se présentent. Les chars peuvent se mettre hors de combat, les véhicules peuvent être touchés par des tirs, et divers autres types de dommages peuvent survenir. Les réparations sur le terrain ont toujours été une tâche difficile et urgente. En formant les mécaniciens à travailler plus rapidement et sous une pression intense, ceux-ci peuvent effectuer ces réparations plus efficacement et remettre leurs véhicules en état de combattre."
 tech_maintenance_company7:0 "Maintenance VII : Manuels numériques"
 tech_maintenance_company7_desc:0 "En équipant nos combattants d'appareils portables contenant des informations sur leur mission, ils peuvent atteindre des niveaux d'efficacité sans précédent."
 MOBILE_WARFARE_DOCTRINE_LABEL:0 "DOCTRINE DE GUERRE MOBILE"
 MOBILE_WARFARE_DOCTRINE_DESC:0 "La guerre de mouvement privilégie la vitesse et les manœuvres pour diviser et désorganiser les forces ennemies."
 SUPERIOR_FIREPOWER_DOCTRINE_LABEL:0 "DOCTRINE DE LA PUISSANCE DE FEU SUPÉRIEURE"
 SUPERIOR_FIREPOWER_DOCTRINE_DESC:0 "Cette doctrine se concentre sur le lancement d’obus, et non d’hommes, contre l’ennemi. Notre main-d’œuvre est précieuse, les munitions sont bon marché."
 GRAND_BATTLEPLAN_DOCTRINE_LABEL:0 "GRAND BATTLEPLAN DOCTRINE"
 GRAND_BATTLEPLAN_DOCTRINE_DESC:0 "Une planification et une préparation approfondies avant d’engager le combat sont la clé du succès."
 MASS_ASSAULT_DOCTRINE_LABEL:0 "DOCTRINE DE L'ATTAQUE DE GRANDE ENVERGURE"
 MASS_ASSAULT_DOCTRINE_DESC:0 "Les armes « parfaites » sont surévaluées. Pour emporter la victoire, mieux valent beaucoup d'armes « convenables » !"
 MOBILE_INFANTRY_LABEL:0 "INFANTERIE MOBILE"
 MOBILE_INFANTRY_LABEL_TT:0 "Améliorer la vitesse et l’organisation de l’infanterie motorisée."
 BLITZKRIEG_LABEL:0 "BLITZKRIEG"
 BLITZKRIEG_LABEL_TT:0 "Améliorer l’organisation des unités blindées."
 DESPERATE_DEFENSE_LABEL:0 "DÉFENSE DÉSÉSPÉRÉ"
 DESPERATE_DEFENSE_LABEL_TT:0 "Maximiser le recrutement et les tactiques de guérilla."
 MODERN_BLITZKRIEG_LABEL:0 "BLITZKRIEG MODERNE"
 MODERN_BLITZKRIEG_LABEL_TT:0 "Améliorer l’organisation militaire et les tactiques de lutte."
 DISPERSED_SUPPORT_LABEL:0 "SOUTIEN DISPERSÉ"
 DISPERSED_SUPPORT_LABEL_TT:0 "Améliorer l’organisation et l’efficacité de l’artillerie de ligne."
 INTEGRATED_SUPPORT_LABEL:0 "APPUI INTÉGRÉ"
 INTEGRATED_SUPPORT_LABEL_TT:0 "Améliorer l’organisation et l’efficacité des unités de soutien."
 AIRLAND_BATTLE_LABEL:0 "BATAILLE AÉRIENNE ET TERRESTRE"
 AIRLAND_BATTLE_LABEL_TT:0 "Améliorer les capacités d’attaque de l’armée."
 SHOCK_AND_AWE_LABEL:0 "CHOC ET EFFROI"
 SHOCK_AND_AWE_LABEL_TT:0 "Améliorer l’efficacité générale de l’armée."
 ASSAULT_LABEL:0 "ASSAUT"
 ASSAULT_LABEL_TT:0 "Concentrez-vous sur les attaques directes et frontales avec armure."
 INFILTRATION_LABEL:0 "INFILTRATION"
 INFILTRATION_LABEL_TT:0 "Mettre l’accent sur la tromperie et les stratégies non conventionnelles d’infanterie."
 DEEP_BATTLE_LABEL:0 "BATAILLE PROFONDE"
 DEEP_BATTLE_LABEL_TT:0 "Améliorer le soutien et les capacités pour frapper profondément en territoire ennemi."
 MASS_MOBILIZATION_LABEL:0 "MOBILISATION DE MASSE"
 MASS_MOBILIZATION_LABEL_TT:0 "Maximiser le recrutement et la force en nombre."
 mobile_warfare:0 "Guerre mobile"
 mobile_warfare_desc:0 "La guerre mobile met l’accent sur la vitesse et la manœuvre pour couper et désorganiser les forces ennemies.\n\n"
 delay:0 "Retardement"
 delay_desc:0 "Même lorsqu'un combat est perdu d'avance, il peut être bénéfique de ralentir la progression de l'ennemi en lui tendant des embuscades et en faisant tout pour le retarder."
 elastic_defence:0 "Défense élastique"
 elastic_defence_desc:0 "Plutôt que de concentrer toute la force sur la ligne de front, une défense élastique crée une couche de défenses « plus profonde » qui donne au défenseur plus de temps pour réagir et contre-attaquer pendant que l’attaquant est dispersé et enlisé."
 mobile_infantry:0 "Infanterie mobile"
 mobile_infantry_desc:0 "L'infanterie régulière est souvent trop lente pour suivre, réagir ou échapper à des blindés en mouvement. La réponse consiste à privilégier l'infanterie motorisée ou mécanisée, capable de tenir le rythme de la guerre moderne.\n\n"
 mass_motorization:0 "Motorisation de masse"
 mass_motorization_desc:0 "Une plus grande priorité encore doit être donnée à la mécanisation des troupes."
 mechanized_offensive:0 "Offensive mécanisée"
 mechanized_offensive_desc:0 "Les troupes transportées par les véhicules à moteur sont certes utiles ; mais pour mener des offensives, les hommes doivent pouvoir être transportés dans des véhicules blindés, capables de les protéger et d'acheminer les armes lourdes."
 armored_spearhead:0 "Percée des blindés"
 armored_spearhead_desc:0 "Pour exploiter pleinement le potentiel des chars, ils ne doivent pas être immobilisés à soutenir l’infanterie. Ils doivent plutôt être formés en unités rapides et indépendantes capables de mener des attaques en pointe.\n\n"
 schwerpunk:0 "Schwerpunkt"
 schwerpunk_desc:0 "Dans toute opération, le Schwerpunkt, ou point focal, doit être identifié et la force maximale concentrée pour l’emporter à cet endroit."
 blitzkrieg:0 "Blitzkrieg"
 blitzkrieg_desc:0 "La blitzkrieg désigne la stratégie des forces blindées rapides, soutenues par une infanterie mobile et un appui aérien, qui percent les lignes ennemies pour les désorganiser et les encercler."
 kampfgruppe:0 "Kampfgruppe"
 kampfgruppe_desc:0 "Un Kampfgruppe était un groupe de combat tactique et temporaire, organisé pour mener à bien une mission spécifique."
 firebrigades:0 "Brigades d’incendie"
 firebrigades_desc:0 "Les « brigades d’incendie » étaient des forces hâtivement rassemblées et envoyées pour réagir aux percées ennemies ou à d’autres problèmes critiques.\n\n"
 backhand_blow:0 "Coup en revers"
 backhand_blow_desc:0 "Plutôt que de se battre pour chaque pouce de terrain, les pénétrations ennemies sont largement évitées jusqu’à ce qu’elles se soient étendues, moment où elles peuvent être coupées et détruites par des contre-attaques."
 modern_blitzkrieg:0 "Blitzkrieg moderne"
 modern_blitzkrieg_desc:0 "Le summum de la guerre mobile, le blitzkrieg moderne intègre toutes les dernières avancées technologiques et les leçons tirées des doctrines précédentes."
 volkssturm:0 "Volkssturm"
 volkssturm_desc:0 "Le Volkssturm, la milice populaire, est composé d'hommes jugés trop âgés, trop jeunes ou autrement inaptes au service militaire régulier.\n\n"
 nd_conscription:0 "Conscription générale"
 nd_conscription_desc:0 "Même les invalides et les infirmes peuvent être conscrits. Un civil, ça n'existe pas."
 werwolf_guerillas:0 "Werwolf"
 werwolf_guerillas_desc:0 "La Werwolf était un groupe de résistance allemand chargé de combattre les forces d'occupation après la défaite."
 superior_firepower:0 "Puissance de feu supérieure"
 superior_firepower_desc:0 "Cette doctrine se concentre sur le lancement d’obus, et non d’hommes, contre l’ennemi. Notre main-d’œuvre est précieuse, les munitions sont bon marché.\n\n"
 sup_delay:0 "Retardement"
 sup_delay_desc:0 "Même lorsqu'un combat est perdu d'avance, il peut être bénéfique de ralentir la progression de l'ennemi en lui tendant des embuscades et en faisant tout pour le retarder."
 mobile_defence:0 "Défense mobile"
 mobile_defence_desc:0 "Les forces mobiles peuvent être utilisées pour renforcer la défense là où l’ennemi pourrait attaquer."
 intergrated_support:0 "Soutien intégré"
 intergrated_support_desc:0 "Intégrer étroitement les forces de soutien aux troupes de combat permet d’obtenir des divisions plus fortes à l’attaque.\n\n"
 regimental_combat_teams:0 "Équipes de combat régimentaires"
 regimental_combat_teams_desc:0 "Une équipe de combat régimentaire est un régiment d’infanterie étroitement intégré à des unités de soutien telles que l’artillerie, les chars et les éléments de reconnaissance pour former une petite unité autosuffisante, offrant une plus grande flexibilité lors des attaques."
 dispersed_support:0 "Soutien dispersé"
 dispersed_support_desc:0 "En dispersant nos unités de soutien, elles peuvent couvrir une zone plus large tout en restant hors de la ligne de feu, ce qui donne des divisions avec une meilleure défense.\n\n"
 overwhelming_firepower:0 "Puissance de feu écrasante"
 overwhelming_firepower_desc:0 "Faire appel à toutes les unités de soutien disponibles pour offrir une puissance de feu écrasante peut grandement affaiblir une cible, ou mieux encore, sérieusement gâcher la journée d’un attaquant."
 sup_mechanized_offensive:0 "Offensive mécanisée"
 sup_mechanized_offensive_desc:0 "Les troupes transportées par les véhicules à moteur sont certes utiles ; mais pour mener des offensives, les hommes doivent pouvoir être transportés dans des véhicules blindés, capables de les protéger et d'acheminer les armes lourdes."
 concentrated_fire_plans:0 "Plans de tir concentré"
 concentrated_fire_plans_desc:0 "En concentrant le feu de différentes batteries dans un bombardement synchronisé, des dégâts bien plus importants peuvent être infligés à l’ennemi.\n\n"
 combined_arms:0 "Armes combinées"
 combined_arms_desc:0 "Les blindés, l’infanterie et les unités de soutien travaillant ensemble dans des équipes bien organisées sont bien plus efficaces que les mêmes forces utilisées séparément."
 tactical_control:0 "Contrôle tactique"
 tactical_control_desc:0 "Les officiers familiarisés avec les opérations d’armes combinées en positions avancées peuvent désormais contrôler directement les opérations de toutes les branches."
 air_land_battle:0 "Bataille air-terre"
 air_land_battle_desc:0 "Avec les forces terrestres déjà opérant en formations d’armes combinées, la bataille air-terre met également l’accent sur une coordination étroite entre les forces terrestres et aériennes, fusionnant les champs de bataille aérien et terrestre en un tout homogène."
 centralized_fire_control:0 "Poste de commandement de l'artillerie"
 centralized_fire_control_desc:0 "Un système de contrôle centralisé du feu permet d’évaluer toutes les demandes de soutien d’artillerie en un seul endroit et, si nécessaire, de concentrer toute la puissance de feu d’une division sur une cible, plutôt que de limiter une unité à demander le feu uniquement de l’artillerie qui lui est assignée.\n\n"
 forward_observers:0 "Observateurs avancés"
 forward_observers_desc:0 "Les observateurs avancés prennent position là où ils peuvent directement observer la précision et les effets des tirs d’artillerie, et relayer les résultats aux canons pour correction."
 advanced_firebases:0 "Bases de feu avancées"
 advanced_firebases_desc:0 "Les camps d’artillerie peuvent être positionnés près des lignes de front dans des bases fortifiées afin d’offrir un soutien maximal aux forces en progression."
 shock_and_awe:0 "Choc et stupeur"
 shock_and_awe_desc:0 "Une concentration massive de puissance de feu imposera ce niveau écrasant de choc et de stupeur contre un adversaire dans un délai immédiat ou suffisamment rapide pour paralyser sa volonté de continuer."
 grand_battle_plan:0 "Grand plan de bataille"
 grand_battle_plan_desc:0 "Une planification et une préparation approfondies avant d’engager le combat sont la clé du succès.\n\n"
 trench_warfare:0 "Guerre des tranchées"
 trench_warfare_desc:0 "Une pelle est souvent la meilleure arme de l’infanterie. Les unités apprennent l’importance de s’enterrer dans toute position qu’elles occupent."
 prepared_defense:0 "Défense préparée"
 prepared_defense_desc:0 "Des systèmes plus étendus de fortifications de campagne améliorent grandement la défense d’une unité."
 grand_assault:0 "Grand assaut"
 grand_assault_desc:0 "Une fois que des forces suffisantes ont été rassemblées et leurs objectifs bien planifiés, un assaut puissant ne peut qu’anéantir l’ennemi."
 grand_mechanized_offensive:0 "Offensive mécanisée"
 grand_mechanized_offensive_desc:0 "Les troupes motorisées sont efficaces, mais pour mener des offensives, nous avons besoin d’une infanterie capable de se rendre au combat dans des transports blindés qui les protègent et portent des armes lourdes.\n\n"
 assault_concentration:0 "Attaque concentrée"
 assault_concentration_desc:0 "Avant une attaque, les éléments de tête sont soigneusement préparés et placés en positions avancées, garantissant une force maximale appliquée dès les premiers instants."
 branch_interoperation:0 "Inter-opération des branches"
 branch_interoperation_desc:0 "Une coordination accrue entre les différentes branches des forces armées leur permet de mieux travailler dans des opérations d’armes combinées."
 assault_breakthrough:0 "Percée d’assaut"
 assault_breakthrough_desc:0 "Plutôt que de lancer un grand assaut sur l’ensemble du front, il peut être bien plus efficace de concentrer l’attaque sur un seul ou quelques points de la ligne ennemie pour y obtenir une percée."
 central_planning:0 "Planification centrale"
 central_planning_desc:0 "Les officiers de toutes les branches contribuent désormais à la planification d’une opération donnée pour s’assurer qu’elle fonctionne à son efficacité maximale."
 c3i_theory:0 "C3I"
 c3i_theory_desc:0 "Des officiers d’état-major efficaces assurent le flux de commandement, contrôle, communications et renseignement entre un officier commandant et les unités qu’il contrôle."
 infantry_offensive:0 "Offensive d’infanterie"
 infantry_offensive_desc:0 "L’esprit offensif de l’infanterie est l’élément décisif pour gagner les batailles. Notre infanterie doit montrer la voie.\n\n"
 armored_operations:0 "Opérations blindées"
 armored_operations_desc:0 "Les chars et autres véhicules blindés sont très utiles pour acheminer l’infanterie sur les champs de bataille et offrir un soutien direct au combat."
 infiltration_assault:0 "Assaut par infiltration"
 infiltration_assault_desc:0 "Dans les premiers mouvements d’une attaque, l’infanterie doit cibler les points faibles de la ligne ennemie pour contourner et isoler les sections mieux défendues, qui peuvent alors être éliminées par le reste des forces attaquantes."
 night_assault_tactics:0 "Tactiques d’assaut nocturne"
 night_assault_tactics_desc:0 "Les soldats habitués à se déplacer et à combattre la nuit peuvent soit se pré-positionner pour une attaque, soit attaquer directement des forces ennemies imprévues."
 attritional_containment:0 "Confinement par attrition"
 attritional_containment_desc:0 "Si nous ne pouvons pas lancer une attaque pour éliminer une position ennemie, elle doit néanmoins être soumise à des attaques mineures constantes qui causeront des pertes et empêcheront l’ennemi de lancer ses propres attaques."
 infiltration_in_depth:0 "Infiltration en profondeur"
 infiltration_in_depth_desc:0 "Nos forces sont désormais entraînées à contourner et isoler les points forts ennemis à une profondeur bien plus grande. Idéalement, nos forces d’assaut ne devraient pas s’arrêter avant d’atteindre les zones arrière ennemies et de couper complètement leurs forces."
 mass_assault:0 "Assaut de masse"
 mass_assault_desc:0 "Les armes « parfaites » sont surestimées, un grand nombre d’armes « suffisamment bonnes » est le chemin vers la victoire !\n\n"
 pocket_defence:0 "Poches défensives"
 pocket_defence_desc:0 "En situation défensive, les troupes peuvent se trouver encerclées dans une poche. Dans ce type de cas, elles doivent juste tenir bon, jusqu'à ce que la contre-attaque inévitable ne vienne les libérer."
 defence_in_depth:0 "Défense en profondeur"
 defence_in_depth_desc:0 "En offrant une résistance relativement légère et en cédant temporairement du terrain, nous pouvons échanger de l’espace contre du temps et permettre aux forces attaquantes de s’épuiser avant de contre-attaquer."
 large_front_operations:0 "Opérations sur un front étendu"
 large_front_operations_desc:0 "Combattre sur un large front implique de coordonner les efforts de multiples unités sur de longues distances : à un niveau opérationnel plutôt que tactique.\n\n"
 deep_operations:0 "Opérations en profondeur"
 deep_operations_desc:0 "Le concept d'opérations en profondeur consiste à percer les lignes de défense de l'ennemi en plusieurs points afin de détruire ses réserves et sa profondeur opérationnelles et ainsi prendre le contrôle de la zone qu'il défend."
 operational_concentration:0 "Concentration opérationnelle"
 operational_concentration_desc:0 "La clef de toute action militaire est de disposer d'une supériorité écrasante au niveau tactique. À défaut de pouvoir le faire sur toute la longueur du front, mieux vaut affaiblir certains secteurs pour concentrer les troupes là où elles sont nécessaires, plutôt qu'essayer de s'imposer partout."
 vast_offensives:0 "Offensives d'envergure"
 vast_offensives_desc:0 "Dès qu'une brèche est ouverte, elle doit être exploitée sans ménagement. Ainsi, une offensive d'envergure, capable de percer les lignes de l'ennemi, rendra leur défense difficile, impossible, voire inutile."
 breakthrough_priority:0 "Priorité aux percées"
 breakthrough_priority_desc:0 "Au-delà de la concentration opérationnelle, tous les besoins du front sont subordonnés à la priorité qu'est la concentration des forces pour réaliser des percées. Les défaites mineures sont sans conséquence si un coup décisif peut être porté à l'ennemi."
 mechanized_wave:0 "Vague mécanisée"
 mechanized_wave_desc:0 "Les forces mécanisées sont idéales pour mener les avances rapides nécessaires à une exploitation efficace des percées, tant pour soutenir les forces blindées que pour sécuriser les flancs de la brèche."
 continuous_offensive:0 "Offensive continue"
 continuous_offensive_desc:0 "Bien que les percées bien exploitées soient souvent très efficaces, l’attaquant finit tôt ou tard par s’épuiser et le défenseur peut se réorganiser et reformer de nouvelles lignes défensives. Cependant, avec suffisamment de réserves et une bonne organisation, une offensive pourrait être poursuivie à une profondeur bien plus grande avec des résultats dévastateurs pour l’ennemi."
 human_wave_offensive:0 "Offensives par vagues humaines"
 human_wave_offensive_desc:0 "Une offensive par vagues humaines consiste à lancer une attaque frontale sur les lignes ennemies en formations d'infanterie serrées pour submerger les défenseurs au cours d'un combat rapproché."
 human_infantry_offensive:0 "Offensive d’infanterie"
 human_infantry_offensive_desc:0 "C'est l'esprit offensif des fantassins qui détermine l'issue des combats. Notre infanterie doit montrer la voie."
 large_front_offensive:0 "Offensive sur un large front"
 large_front_offensive_desc:0 "En lançant ou en menaçant de lancer des offensives par vagues humaines dans plusieurs secteurs du front, nous pouvons empêcher l'ennemi de concentrer sa puissance de feu face à une seule attaque."
 peoples_army:0 "Armée du peuple"
 peoples_army_desc:0 "Une armée populaire place l'homme au-dessus de la machine et s'appuie sur la motivation de ses combattants pour compenser son infériorité technologique. En outre, elle bénéficie d'un soutien important au sein de la population civile.\n\n"
 guerilla_warfare:0 "Guerre de Guérilla"
 guerilla_warfare_desc:0 "Si l'ennemi avance, nous nous replions. S'il s'arrête, nous le harcelons. S'il fatigue, nous l'attaquons. Et s'il se retire, nous le pourchassons."
 jungle_warfare:0 "Guerre de la Jungle"
 jungle_warfare_desc:0 "Formation spéciale pour rendre nos soldats efficaces dans la jungle."
 HUN_light_infantry_tech:0 "Doctrine des divisions d'infanterie légère"
 HUN_light_infantry_tech_desc:0 "Réduire le nombre d’armes de soutien dans nos divisions d’infanterie les rend plus flexibles et leur donne un avantage dans les combats en terrain restreint comme les villes et les forêts."
 AIR_TITLE_CAS:0 "Soutien aérien\nrapproché"
 AIR_TITLE_FIGHTER:0 "Chasseur"
 AIR_TITLE_NAV:0 "Bombardier\nNaval"
 AIR_TITLE_HEAVY_FIGHTER:0 "Chasseur\nLourd"
 AIR_TITLE_MEDIUM_BOMBER:0 "Bombardier\nTactique"
 AIR_TITLE_STRAT_BOMBER:0 "Bombardier\nStratégique"
 fighter_light:0 "Chasseurs légers"
 fighter_multirole:0 "Avions de combat polyvalents"
 fighter_vtol:0 "Expert en ADAV"
 fighter_interceptor:0 "Chasseurs de supériorité aérienne"
 tactical_bomber:0 "Modèles de bombardiers tactiques"
 bomber_strategic:0 "Bombardiers stratégiques"
 strategic_bomber:0 "Bombardiers stratégiques"
 transport_air:0 "Avions de transport"
 naval_bomber:0 "Bombardiers navals "
 cas_bomber:0 "Avion d'appui aérien rapproché"
 TITLE_BATTLEFIELD_SUPPORT:0 "Appui aérien"
 TITLE_OPERATIONAL_INTEGRITY:0 "Intégrité opérationnelle"
 TITLE_STRATEGIC_DESTRUCTION:0 "Destruction stratégique"
 air_doctrine_versatile:0 "Polyvalence aéronautique"
 air_doctrine_versatile_desc:0 "Cette doctrine met l'accent sur l'efficacité pure des missions et la capacité à s'adapter à toute situation, sans viser d'intérêts stratégiques particuliers. Cet arbre offrira divers avantages axés sur l'équilibre et la cohérence au combat, quelles que soient les conditions."
 air_doctrine_systemic:0 "Initiative stratégique globale"
 air_doctrine_systemic_desc:0 "Cette doctrine vise à renforcer les capacités stratégiques de l'armée de l'air et sa capacité à bombarder des cibles ennemies. En renforçant la puissance de feu des bombardiers et en améliorant leur capacité de survie, ceux-ci peuvent mener à bien des missions à haut risque sans bénéficier d'une supériorité aérienne dans des situations difficiles, ou bien déchaîner un véritable déluge de feu lorsqu'ils disposent d'une telle supériorité."
 air_doctrine_integral:0 "Doctrine de l'intégrité tactique"
 air_doctrine_integral_desc:0 "Si les initiatives stratégiques et les opérations peuvent apporter des avantages décisifs, la force d'une armée dépend de son maillon le plus faible. En veillant à être puissants et indomptables sur les plans opérationnel et tactique, nous pouvons écraser l'ennemi par la seule force brute."
 air_doctrine_versatile_tt:0 "§RMutuellement exclusives§! avec §YDoctrine systémique§! et §YDoctrine intégrale§!"
 air_doctrine_systemic_tt:0 "§RMutuellement exclusives§! avec §YDoctrine versatile§! et §YDoctrine intégrale§!"
 air_doctrine_integral_tt:0 "§RMutuellement exclusives§! avec §YDoctrine versatile§! et §YDoctrine systémique§!"
 air_doctrine_versatile_1a:0 "Opérations de nuit"
 air_doctrine_versatile_1a_desc:0 "La formation de nos pilotes à la conduite des appareils et à l'identification « ami ou ennemi » dans des conditions de faible luminosité leur permettra d'obtenir de meilleurs résultats lors des opérations nocturnes, ce qui offrira une plus grande souplesse quant au moment où ces opérations peuvent être menées. De plus, cette formation peut également s'avérer utile en cas de mauvaises conditions météorologiques, lorsque la visibilité est réduite."
 air_doctrine_versatile_1b:0 "Réseaux météorologiques"
 air_doctrine_versatile_1b_desc:0 "Dans l'idéal, nous ne devrions pas lancer d'opérations par mauvais temps. Cependant, la guerre est imprévisible et nous devons parfois faire face à des conditions difficiles. Pour mieux y faire face, un réseau météorologique dédié à la prévision du temps et à la fourniture d'informations essentielles constitue notre meilleur atout pour y parvenir."
 air_doctrine_versatile_2:0 "Contrôle de la radionavigation"
 air_doctrine_versatile_2_desc:0 "Nous pouvons investir massivement dans les techniques de navigation aéronautique afin d'améliorer l'efficacité opérationnelle de notre armée de l'air et de renforcer les capacités de nos équipes de navigation au centre de contrôle des missions."
 air_doctrine_versatile_3a:0 "Escadrons de formation élargis"
 air_doctrine_versatile_3a_desc:0 "Les escadrons d'entraînement sont des unités spécialisées dans la formation au sein de l'armée de l'air, qui enseignent aux nouveaux pilotes comment mener à bien leurs missions. En renforçant les capacités de ces escadrons et en mettant en place un programme d'entraînement plus rigoureux, nous permettrons à nos escadrons d'être mieux préparés au combat et d'accélérer le rythme des exercices."
 air_doctrine_versatile_3b:0 "Formation d'Urgence"
 air_doctrine_versatile_3b_desc:0 "Notre programme de formation ne prévoit pas de formation adéquate aux situations d'urgence. Nos pilotes doivent apprendre à gérer les pannes moteur ou les dommages causés par les intempéries avec une efficacité redoutable."
 air_doctrine_versatile_4:0 "Formations adaptatives"
 air_doctrine_versatile_4_desc:0 "Nos formations de chasseurs doivent être flexibles et permettre à nos pilotes de s'adapter aux situations de combat."
 air_doctrine_versatile_5a:0 "Interception à haute altitude"
 air_doctrine_versatile_5a_desc:0 "Mettre au point des tactiques de mission pour approcher et intercepter des ennemis volant à haute altitude peut nous permettre de les frapper avant même qu'ils n'atteignent leur cible !"
 air_doctrine_versatile_5b:0 "Opérations navales polyvalentes"
 air_doctrine_versatile_5b_desc:0 "Avec le développement des nouvelles technologies et des nouvelles tactiques navales, nos bombardiers navals seront confrontés à toute une série de problèmes lors de leurs missions. La mise au point d'un éventail varié de tactiques permettant de faire face à des formations navales spécifiques s'avérera très utile."
 air_doctrine_versatile_5c:0 "Bombardement de précision à haute altitude"
 air_doctrine_versatile_5c_desc:0 "Pour éviter les tirs antiaériens et les interceptions ennemis, nous devons être en mesure de mener des opérations à haute altitude avec nos bombardiers stratégiques. Les technologies de calcul permettant des bombardements de précision nous permettent de frapper des cibles ennemies depuis une altitude très élevée, ce qui rend possible le vol à haute altitude en cours d'opération."
 air_doctrine_versatile_5d:0 "Masquage du terrain"
 air_doctrine_versatile_5d_desc:0 "Afin d'échapper à l'ennemi et de l'empêcher d'abattre facilement nos intercepteurs, nous devons tirer parti du relief pour dissimuler notre approche et éviter d'être interceptés par l'ennemi."
 air_doctrine_versatile_6a:0 "Profils d'interception"
 air_doctrine_versatile_6a_desc:0 "(À COMPLÉTER)"
 air_doctrine_versatile_6b:0 "Protection contre les intempéries / Dégivrage"
 air_doctrine_versatile_6b_desc:0 "Loin de laisser les nuages nous gêner, nous pouvons les utiliser comme relief, marquant ainsi une nouvelle évolution des tactiques aéronautiques. En équipant nos avions de technologies de dégivrage, ceux-ci peuvent tirer parti des nuages et des conditions météorologiques pour s'échapper ou tendre une embuscade à l'ennemi !"
 air_doctrine_versatile_6c:0 "Bombardement supersonique à basse altitude"
 air_doctrine_versatile_6c_desc:0 "Bien que plus sûr que le bombardement à haute altitude, le bombardement à haute altitude comporte également le risque d'être touché par l'ennemi à distance. Le bombardement supersonique à basse altitude peut toutefois s'avérer plus sûr lorsque le relief limite les angles d'interception. Bien sûr, cela dépend entièrement de la situation concrète, et il convient d'envisager aussi bien le bombardement de précision à haute altitude que les frappes supersoniques à basse altitude en fonction de la zone d'opération."
 air_doctrine_versatile_6d:0 "Stratégies d'évasion"
 air_doctrine_versatile_6d_desc:0 "Les tactiques et manœuvres d'esquive face aux systèmes CAS et Interdictor peuvent considérablement améliorer la capacité de survie de nos avions d'appui."
 air_doctrine_versatile_7a:0 "Combat énergétique"
 air_doctrine_versatile_7a_desc:0 "Le combat aérien axé sur l'énergie est une technique très difficile à maîtriser qui nécessite un entraînement intensif et implique généralement que le pilote maintienne une vitesse élevée pendant le combat."
 air_doctrine_versatile_7b:0 "Opportunisme polyvalent"
 air_doctrine_versatile_7b_desc:0 "L'un des avantages des avions de combat polyvalents réside dans leur capacité à attaquer aussi bien des cibles au sol que des cibles aériennes. Cela permet à chaque appareil de lancer une frappe au moment opportun, dès qu'une occasion se présente, sans avoir à se soucier de la présence d'un soutien au sol spécialisé dans la zone. En apprenant aux pilotes à tirer parti de ces occasions, nous tirons le meilleur parti de nos avions polyvalents."
 air_doctrine_versatile_8:0 "Algorithme de verrouillage prédictif"
 air_doctrine_versatile_8_desc:0 "Grâce à des algorithmes prédictifs, nos missiles peuvent tenter de se reconnecter et de se diriger vers les cibles qu’ils ont perdues de vue jusqu’à ce qu’ils puissent les repérer à nouveau. Ainsi, l’ennemi court un danger encore plus grand dans les nuages, car nous pouvons toujours le localiser même s’il ne peut pas nous voir."
 air_doctrine_versatile_9a:0 "Manœuvres de combat réactives"
 air_doctrine_versatile_9a_desc:0 "Le combat réserve toujours des surprises. Les formations réactives constituent des moyens efficaces de faire face aux situations imprévues."
 air_doctrine_versatile_9b:0 "Interdiction"
 air_doctrine_versatile_9b_desc:0 "Le fait de bombarder les unités de ravitaillement ennemies ou de les perturber pendant leur acheminement vers les forces ennemies grâce à des opérations d'interception apporte d'énormes avantages à nos unités terrestres au combat et constitue une récompense majeure pour ceux qui parviennent à contrôler suffisamment l'espace aérien pour frapper l'ennemi bien en deçà de ses lignes."
 air_doctrine_versatile_10:0 "Programme complet de formation des officiers de l'armée de l'air"
 air_doctrine_versatile_10_desc:0 "Afin de garantir que notre armée de l'air soit aussi flexible que possible, nous proposerons à nos officiers un programme de formation complet, afin qu'ils acquièrent une solide culture générale et soient capables de s'adapter à toutes les situations."
 air_doctrine_systemic_1a:0 "Tactiques modernes d'escorte de bombardiers"
 air_doctrine_systemic_1a_desc:0 "Auparavant, les avions volaient en formation légèrement en avant des bombardiers et tentaient d'engager les ennemis qui s'approchaient pour les intercepter. Cependant, à l'ère des missiles guidés, nous devons repenser nos formations et nos méthodes de protection des bombardiers en les faisant voler loin derrière, hors de portée, et en déployant des intercepteurs en vol de croisière prêts à engager les ennemis repérés."
 air_doctrine_systemic_1b:0 "Coordination entre les bombardiers"
 air_doctrine_systemic_1b_desc:0 "Nos bombardiers devraient se coordonner entre eux et avec les avions de reconnaissance afin de repérer et d'attaquer plus efficacement les cibles prévues et de frapper les cibles d'opportunité."
 air_doctrine_systemic_2a:0 "Repéreurs de profils défensifs"
 air_doctrine_systemic_2a_desc:0 "Nous devons coordonner nos efforts pour repérer les sites de détection ou d'interception ennemis sur la route menant à la cible, afin que nos bombardiers puissent s'en approcher davantage avant d'être repérés. Une coordination entre les appareils de reconnaissance furtifs et les unités de reconnaissance au sol réduira considérablement la visibilité de nos bombardiers."
 air_doctrine_systemic_2b:0 "Charges utiles spécialisées"
 air_doctrine_systemic_2b_desc:0 "Savoir, c'est déjà la moitié du chemin. L'autre moitié, c'est la violence extrême. En constituant des stocks de bombes spécialement conçues pour détruire des cibles précises (les cibles plus vulnérables nécessitant des bombes à forte puissance explosive, tandis que les cibles plus résistantes requièrent des bombes à charge creuse) et en planifiant nos missions en conséquence, nos bombardiers pourront infliger un maximum de dégâts !"
 air_doctrine_systemic_3:0 "Réseaux aériens"
 air_doctrine_systemic_3_desc:0 "Afin de faciliter la détection des chasseurs et des intercepteurs ennemis, nous devons mettre en place des réseaux d'information à grande échelle chargés de recueillir des renseignements sur les positions aériennes de l'ennemi. Cet effort coordonné permettra d'améliorer l'efficacité des missions."
 air_doctrine_systemic_4a:0 "Tactiques anti-flotte"
 air_doctrine_systemic_4a_desc:0 "Les flottes ont évolué et le mode de fonctionnement des navires a changé. L'adoption des SAM et l'évolution des doctrines navales nous obligent à repenser la manière dont nous menons nos opérations de bombardement naval. La mise en place de formations et de méthodes permettant d'affaiblir les flottes et de frapper des cibles capables de nous atteindre à des kilomètres de distance est essentielle au succès de nos missions de bombardement naval."
 air_doctrine_systemic_4b:0 "Réseaux météorologiques"
 air_doctrine_systemic_4b_desc:0 "Dans l'idéal, nous ne devrions pas lancer d'opérations par mauvais temps. Cependant, la guerre est imprévisible et nous devons parfois faire face à des conditions difficiles. Pour mieux y faire face, un réseau météorologique dédié à la prévision du temps et à la fourniture d'informations essentielles constitue notre meilleur atout pour y parvenir."
 air_doctrine_systemic_5a1:0 "Ogives à forte charge utile navale"
 air_doctrine_systemic_5a1_desc:0 "L'attention que nous portons aux bombardiers a permis de réaliser des progrès dans le domaine des missiles antinavires. Nous devrions donner la priorité à l'amélioration des ogives afin d'infliger des dégâts plus importants."
 air_doctrine_systemic_5a2:0 "Moteurs à charge utile navale étendue"
 air_doctrine_systemic_5a2_desc:0 "L'attention que nous portons aux bombardiers a permis de réaliser des progrès dans le domaine des missiles antinavires. Nous devrions donner la priorité à l'amélioration des moteurs et de la maniabilité des missiles afin d'accroître leur précision."
 air_doctrine_systemic_5b1:0 "Cession du réseau d'opérations tactiques"
 air_doctrine_systemic_5b1_desc:0 "Même si nous nous concentrons sur les opérations stratégiques, nous pouvons et devons mettre à profit nos vastes réseaux pour soutenir les opérations sur le terrain au niveau tactique, afin de diversifier nos capacités."
 air_doctrine_systemic_5b2:0 "Orientation stratégique du réseau opérationnel"
 air_doctrine_systemic_5b2_desc:0 "Nous nous concentrons sur les opérations stratégiques et continuerons à le faire. En mettant en place un réseau défensif stratégique, nous nous donnons les moyens de mener plus efficacement des missions d'interception et de perturber les opérations aériennes de l'ennemi."
 air_doctrine_systemic_6a1:0 "Attaques par saturation"
 air_doctrine_systemic_6a1_desc:0 "Grâce à nos charges utiles plus lourdes, nous pouvons mener des attaques de saturation massive contre les flottes ennemies et submerger leurs capacités défensives, ce qui améliore la capacité de survie globale de nos bombardiers navals face aux attaques."
 air_doctrine_systemic_6a2:0 "Attaques à longue portée"
 air_doctrine_systemic_6a2_desc:0 "Grâce à nos charges utiles dotées d'une plus grande portée et d'une plus grande précision, nous pouvons frapper les navires ennemis depuis une plus grande distance et tenter d'éviter complètement les intercepteurs et les défenses ennemies, ce qui renforce la capacité de survie de nos bombardiers navals face aux attaques."
 air_doctrine_systemic_6b1:0 "Priorité des éléments de tâche de support"
 air_doctrine_systemic_6b1_desc:0 "Le centre de contrôle et le réseau stratégique devraient donner la priorité à l'aide aux éléments chargés des missions de soutien avant ceux chargés des missions de supériorité, afin d'améliorer l'efficacité des opérations tactiques."
 air_doctrine_systemic_6b2:0 "Priorité des éléments de tâche de supériorité"
 air_doctrine_systemic_6b2_desc:0 "Grâce à nos charges utiles dotées d'une plus grande portée et d'une plus grande précision, nous pouvons frapper les navires ennemis depuis une plus grande distance et tenter d'éviter complètement les intercepteurs et les défenses ennemies, ce qui renforce la capacité de survie de nos bombardiers navals face aux attaques."
 air_doctrine_systemic_7a:0 "Système de reconnaissance de mission de bombardement entièrement intégré"
 air_doctrine_systemic_7a_desc:0 "La mise en place d'un système de reconnaissance entièrement intégré et optimisé, permettant de repérer et de cartographier les patrouilles ennemies avant les missions de bombardement, évitera que nos bombardiers ne soient repérés avant qu'il ne soit trop tard."
 air_doctrine_systemic_7b:0 "Avions de reconnaissance et de bombardement navals à haute altitude"
 air_doctrine_systemic_7b_desc:0 "Les avions de reconnaissance à grande altitude et à vitesse supersonique ont de nombreuses applications. En les utilisant pour effectuer des missions de reconnaissance avant les bombardements navals et pour cartographier les patrouilles navales ennemies, nos bombardiers peuvent s'approcher davantage, saisir davantage d'opportunités et survivre à davantage de missions."
 air_doctrine_systemic_7c:0 "Avions radar de l'Unité intégrée de bombardement stratégique"
 air_doctrine_systemic_7c_desc:0 "En dotant nos unités de bombardement stratégique d'avions équipés de radars spécialisés, nous sommes bien mieux à même de les protéger contre les intercepteurs ennemis."
 air_doctrine_systemic_7d:0 "Recherche d'éléments de reconnaissance pour le bombardement stratégique"
 air_doctrine_systemic_7d_desc:0 "En dotant nos unités de reconnaissance de nos forces de bombardement stratégique d'avions de reconnaissance, nous leur permettons de repérer et de localiser les cibles plus efficacement et d'infliger davantage de dégâts."
 air_doctrine_systemic_8a:0 "Inspections programmées des bases aériennes"
 air_doctrine_systemic_8a_desc:0 "En organisant régulièrement des inspections des bases aériennes, nous pouvons réduire le nombre d'accidents en identifiant et en résolvant les problèmes, les erreurs et les dysfonctionnements dans les opérations de maintenance sur site."
 air_doctrine_systemic_8b:0 "Recherche et sauvetage en réseau"
 air_doctrine_systemic_8b_desc:0 "Pour éviter de perdre des pilotes expérimentés à la suite d'un accident, nous devons mettre en place un système de recherche et de sauvetage bien organisé, en recourant à des ressources stratégiques de contrôle des missions."
 air_doctrine_systemic_9a:0 "Guerre à distance"
 air_doctrine_systemic_9a_desc:0 "Les drones et les véhicules sans pilote sont l'avenir. Notre réseau stratégique est parfaitement adapté au pilotage à distance d'éléments de frappe par drone et, grâce à quelques exercices, permet de mettre au point des tactiques de frappe par drone impressionnantes, impossibles à réaliser avec des avions pilotés."
 air_doctrine_systemic_9a_tt:0 "§CLa Guerre à distance permet §!§Yl'opération de contre-insurrection « Frappe de drone »§!§C§!"
 air_doctrine_systemic_9b:0 "Frappes à distance"
 air_doctrine_systemic_9b_desc:0 "Grâce à notre vaste réseau stratégique, nous sommes en mesure d'attaquer des cibles situées bien au-delà de leur portée effective et d'échapper aux tirs défensifs."
 air_doctrine_systemic_10:0 "Suivi stratégique"
 air_doctrine_systemic_10_desc:0 "Le fait de suivre les avions de chasse ennemis dès qu'ils sont repérés nous évitera d'être pris au dépourvu lors des missions de bombardement."
 air_doctrine_systemic_5a1_tt:0 "§RS'excluent mutuellement§! avec §YMoteurs à charge utile navale étendue§!"
 air_doctrine_systemic_5a2_tt:0 "§RS'excluent mutuellement§! avec §YOgives à forte charge utile navale§!"
 air_doctrine_systemic_5b1_tt:0 "§RS'excluent mutuellement§! avec §YRéseau d'opérations stratégiques§!"
 air_doctrine_systemic_5b2_tt:0 "§RS'excluent mutuellement§! avec §YCession du réseau d'opérations tactiques§!"
 air_doctrine_integral_1a:0 "Formations de jets en masse"
 air_doctrine_integral_1a_desc:0 "Le recours à des formations de jets en masse et à des patrouilles nous permettra de détecter et d'engager plus efficacement les intercepteurs ennemis."
 air_doctrine_integral_1b:0 "Frontline Aviation"
 air_doctrine_integral_1b_desc:0 "Le recours aux frappes aériennes de précision (CAS) lors des percées et leur intégration dans les attaques de première ligne améliorent considérablement notre capacité de soutien aérien. Grâce à une coordination étroite avec les troupes au sol et à des frappes à proximité immédiate, nous pouvons maintenir l'élan sur le champ de bataille."
 air_doctrine_integral_2a1:0 "La primauté de la défense"
 air_doctrine_integral_2a1_desc:0 "Nos avions doivent adopter une attitude défensive lors de leurs manœuvres afin de rester en vie. Ils doivent éviter les risques inutiles et, d'une manière générale, s'efforcer de rester en vie."
 air_doctrine_integral_2a2:0 "La primauté de l'attaque"
 air_doctrine_integral_2a2_desc:0 "Pour gagner des guerres, il faut faire des sacrifices. En restant à l'offensive et en recherchant activement des cibles, nous améliorerons considérablement notre capacité de combat, même si cela implique quelques pertes."
 air_doctrine_integral_2b1:0 "Fleuron de l'aviation"
 air_doctrine_integral_2b1_desc:0 "Outre le soutien aux troupes, nos avions doivent saisir les occasions de mener des attaques, de créer des brèches potentielles et d'apporter leur aide aux forces terrestres."
 air_doctrine_integral_2b2:0 "Deuxième ligne d'aviation"
 air_doctrine_integral_2b2_desc:0 "Même si mener des attaques aériennes peut s'avérer efficace, nos avions doivent avant tout se concentrer sur le maintien de nos lignes et la défense contre les offensives ennemies."
 air_doctrine_integral_3a1:0 "Avertissement précoce aérien"
 air_doctrine_integral_3a1_desc:0 "Le recours à des avions bon marché ou à des éléments terrestres spécialisés pour surveiller le ciel et repérer les offensives aériennes ennemies permettra de protéger nos troupes et nous donnera de meilleures chances de détecter les unités aériennes ennemies."
 air_doctrine_integral_3a2:0 "Traînée de chasseur"
 air_doctrine_integral_3a2_desc:0 "(INFORMATIONS REQUISES)"
 air_doctrine_integral_3b1:0 "Tankage intensif"
 air_doctrine_integral_3b1_desc:0 "(INFORMATIONS REQUISES)"
 air_doctrine_integral_3b2:0 "Attaques par saturation"
 air_doctrine_integral_3b2_desc:0 "Grâce à nos charges utiles plus lourdes, nous pouvons mener des attaques de saturation massive contre les flottes ennemies et submerger leurs capacités défensives, ce qui améliore la capacité de survie globale de nos bombardiers navals face aux attaques."
 air_doctrine_integral_4a:0 "Manœuvres à angle d'attaque élevé"
 air_doctrine_integral_4a_desc:0 "Les manœuvres à angle d'attaque élevé sont des manœuvres effectuées à faible vitesse avec des angles d'attaque importants, qui visent à prendre le dessus sur les ennemis à vitesse réduite. Ces manœuvres permettent de venir à bout d'ennemis plus rapides grâce à une plus grande agilité."
 air_doctrine_integral_4b:0 "Lieux de rassemblement"
 air_doctrine_integral_4b_desc:0 "(INFORMATIONS REQUISES)"
 air_doctrine_integral_5:0 "Opérations sur terrain accidenté (unités de déploiement rapide)"
 air_doctrine_integral_5_desc:0 "La mise en place de bases aériennes de fortune à l'aide d'unités de déploiement rapide permet à une armée d'établir rapidement des bases aériennes de fortune et d'éviter les problèmes liés aux unités aériennes ennemies ou aux frappes d'artillerie coordonnées qui pourraient endommager les aérodromes bien établis."
 air_doctrine_integral_6a:0 "Médaille du mérite de l'escadre aérienne"
 air_doctrine_integral_6a_desc:0 "Récompenser par des distinctions et des promotions les escadrons les plus performants est un excellent moyen d'encourager la coordination et l'entraide au sein d'une unité, ce qui favorise grandement la cohésion."
 air_doctrine_integral_6b:0 "Élément de mérite"
 air_doctrine_integral_6b_desc:0 "Récompenser le mérite et promouvoir les pilotes les plus performants est un excellent moyen d'encourager l'ambition et de récompenser le talent."
 air_doctrine_integral_7a:0 "Mesures d'incitation à la promotion au sein de l'escadre aérienne"
 air_doctrine_integral_7a_desc:0 "En accordant des incitations et des récompenses aux escadrons aériens les plus performants, par exemple en leur accordant la priorité pour les améliorations ou en leur fournissant du matériel de meilleure qualité, nous pourrons tirer le meilleur parti de ces unités qualifiées dans le cadre d'opérations collectives telles que les missions d'interception."
 air_doctrine_integral_7b:0 "Tactiques du Shturmovik"
 air_doctrine_integral_7b_desc:0 "Mises au point par les Soviétiques, les tactiques du Jet Shturmovik constituent un large éventail de manœuvres et de stratégies d'appui au sol visant à améliorer l'efficacité et la puissance de feu des missions d'appui au sol."
 air_doctrine_integral_7c:0 "Mesures d'incitation à la promotion des aviateurs"
 air_doctrine_integral_7c_desc:0 "En accordant des incitations et des récompenses aux aviateurs les plus performants, par exemple en leur accordant la priorité pour les formations de perfectionnement et en leur fournissant du matériel de meilleure qualité, nous pourrons tirer le meilleur parti de ces unités qualifiées dans le cadre de missions individuelles telles que les missions de soutien."
 air_doctrine_integral_8a:0 "Saturation du sol"
 air_doctrine_integral_8a_desc:0 "En combinant des frappes JST et des formations massives, les attaques de saturation au sol frappent les points stratégiques des lignes ennemies avec une férocité redoutable et submergent les défenses antiaériennes adverses afin de créer de petites brèches potentielles que les forces terrestres pourront exploiter."
 air_doctrine_integral_8b:0 "Opérations à haute intensité"
 air_doctrine_integral_8b_desc:0 "L'utilisation de zones d'avance rapide (non, pas « avancées » – arrêtez de dire que c'est une faute de frappe) permet aux unités aériennes de maintenir une forte pression, car elles peuvent être rapidement déployées plus près du champ de bataille, ce qui réduit les temps de vol."
 air_doctrine_integral_8c:0 "Armes combinées air-terre"
 air_doctrine_integral_8c_desc:0 "L'intégration des opérations de combat air-terre aux assauts interarmes contribue à garantir que les unités aériennes et terrestres engagées dans l'offensive aient davantage de chances de survivre et de remporter la victoire."
 air_doctrine_integral_9a:0 "Escortes à longue portée"
 air_doctrine_integral_9a_desc:0 "Lors des attaques de saturation, les avions d'escorte à longue portée restent en retrait par rapport aux avions d'appui aérien rapproché et surveillent l'arrivée d'intercepteurs ennemis susceptibles de tenter de perturber la mission."
 air_doctrine_integral_9b:0 "Tactiques des unités mobiles de déploiement rapide"
 air_doctrine_integral_9b_desc:0 "Les unités mobiles de déploiement rapide, intégrées aux unités terrestres et coordonnant leurs actions avec celles-ci, sont mieux à même d'assurer la sécurité des zones de combat en maintenant une communication étroite avec les officiers sur le terrain et en se tenant informées de l'évolution de la situation au front."
 air_doctrine_integral_9c:0 "Supériorité aérienne"
 air_doctrine_integral_9c_desc:0 "Lorsque la situation devient critique et que les unités aériennes sont menacées, les forces terrestres ont pour devoir, lors d'attaques interarmes, de donner la priorité à la neutralisation des menaces pesant sur les unités aériennes plutôt que sur les unités terrestres."
 air_doctrine_integral_10a:0 "Liaisons de données air-air"
 air_doctrine_integral_10a_desc:0 "La mise en place de liaisons de données air-air entre les éléments composant les patrouilles d'interception en force permettra d'améliorer l'interopérabilité et de fournir des données plus précises à chaque avion."
 air_doctrine_integral_10b:0 "Suivi actif air-sol"
 air_doctrine_integral_10b_desc:0 "Le suivi actif des cibles au sol et le maintien d'un niveau élevé de partage des données entre les troupes ayant besoin d'un appui aérien et les unités d'appui aérien rapproché permettront à notre appui aérien rapproché d'intervenir avec plus d'efficacité et de précision."
 air_doctrine_integral_2a1_tt:0 "§RMutuellement exclusif§! avec §YPrimauté offensive§!"
 air_doctrine_integral_2a2_tt:0 "§RMutuellement exclusif§! avec §YPrimauté défensive§!"
 air_doctrine_integral_2b1_tt:0 "§RExclusivité mutuelle§! avec §YDeuxième ligne d'aviation§!"
 air_doctrine_integral_2b2_tt:0 "§RExclusivité mutuelle§! avec §YFleuron de l'aviation§!"
