 civil_engineering_I:0 "Progrès dans le domaine du béton précontraint"
 civil_engineering_I_desc:0 "Le béton a toujours eu du mal à supporter les charges et les contraintes importantes des projets de construction modernes. C'est pourquoi on a fini par le renforcer. Cependant, de nombreux projets restaient encore trop exigeants pour que le béton puisse y faire face. Le béton précontraint a été mis au point pour permettre de renforcer encore davantage le béton. Dans le béton précontraint, des câbles d'acier à haute résistance sont mis en tension (ou « comprimés ») et le béton lui-même est coulé par-dessus pour former des éléments préfabriqués en béton précontraint."
 civil_engineering_II:0 "Méthode des éléments fins de base"
 civil_engineering_II_desc:0 "La méthode des éléments finis (FEM) est une méthode mathématique permettant de résoudre des problèmes d'ingénierie et de physique dans des domaines tels que l'analyse des structures, le transfert thermique, l'écoulement des fluides et le champ électromagnétique. Pour résoudre des problèmes à l'aide de la FEM, les problèmes de grande envergure sont divisés en petits problèmes appelés « éléments finis ». En décomposant ainsi les grands problèmes d'ingénierie, il est possible de les résoudre plus rapidement et avec une plus grande précision, tout en identifiant des zones problématiques spécifiques."
 civil_engineering_III:0 "Méthode d'excavation séquentielle"
 civil_engineering_III_desc:0 "La méthode d'excavation séquentielle (SEM) est une technique de conception et de construction de tunnels. Elle consiste à exploiter au maximum la résistance géologique de la roche afin de réduire les coûts. En contrôlant la déformation du sol au fur et à mesure de l'avancement du tunnel et en mettant en place un soutènement déformable sous charge, on tire le meilleur parti de la résistance naturelle de la roche. Le tunnel est excavé et soutenu de manière séquentielle, chaque problème étant analysé au fur et à mesure afin de s'adapter aux conditions de la roche à mesure qu'elles évoluent."
 civil_engineering_IV:0 "Théories structurelles modernes"
 civil_engineering_IV_desc:0 "À mesure que les structures gagnent en complexité, les principes fondamentaux qui sous-tendent la résolution des problèmes d'ingénierie doivent évoluer. Grâce à l'apparition de théories structurelles modernes qui simplifient les calculs, telles que la théorie des coques et des membranes — selon laquelle les coques cylindriques minces présentent un mouvement mécanique négligeable —, ainsi qu'à de nouvelles formules permettant de calculer plus efficacement les efforts de membrane et de cisaillement, il est désormais possible de résoudre davantage de problèmes d'ingénierie en moins de temps."
 civil_engineering_V:0 "Enrobé bitumineux à granulats"
 civil_engineering_V_desc:0 "L'enrobé bitumineux à base de pierre (SMA) est un type de revêtement routier résistant à la déformation et extrêmement durable. Le SMA est composé de granulats qui forment un squelette interne en pierre. Ce squelette est constitué d'asphalte, de charges courantes telles que des matières plastiques, du caoutchouc et des adhésifs, ainsi que de fibres. Il offre un contact pierre contre pierre plus important que les enrobés bitumineux classiques, ce qui se traduit par une meilleure durabilité du liant et une réduction des vides d'air."
 civil_engineering_VI:0 "Système structurel à tubes groupés"
 civil_engineering_VI_desc:0 "Le système structurel à tubes groupés, également appelé système structurel de tour de quatrième génération ou « de type 4 », est une méthode de construction de grandes tours à colonnes. Certaines colonnes sont plus courtes que d'autres et espacées davantage les unes des autres ; elles contribuent à soutenir les colonnes plus grandes au sein de la même tour. Cela permet aux gratte-ciel d'être plus solides et de résister aux forces latérales. Cela permet également aux tours d'adopter des formes autres que cubiques, ce qui est plus efficace sur le plan économique et structurel, et rend les villes moins laides."
 civil_engineering_VII:0 "Analyse informatique avancée"
 civil_engineering_VII_desc:0 "Avec des structures et des systèmes de plus en plus complexes, les problèmes d'ingénierie gagnent en complexité. Même grâce à des outils de simplification tels que les théories améliorées sur les membranes et les structures, le système de tubes en faisceau, les éléments finis et d'autres méthodes qui rendent la construction plus modulaire et plus facile à mettre en œuvre, les besoins du monde moderne ne cessent de se complexifier. À terme, les problèmes deviennent trop fastidieux pour que les ingénieurs puissent les résoudre sans aide."
 civil_engineering_VIII:0 "Acier de construction de haute qualité"
 civil_engineering_VIII_desc:0 "La sidérurgie à l'oxygène permet d'obtenir un acier de construction de meilleure qualité que les méthodes traditionnelles. Les fours à oxygène injectent de grandes quantités d'oxygène pur dans la fonte et la ferraille, ce qui permet de traiter la charge plus rapidement qu'avec les méthodes à cuve ouverte. Jusqu'à 350 tonnes de fonte et de ferraille peuvent être transformées en acier de haute qualité en moins d'une heure. De plus, cela réduit considérablement le coût de l'acier et rend le système plus durable en limitant les émissions atmosphériques et en améliorant son rendement énergétique."
 civil_engineering_IX:0 "Pavage au coffrage glissant"
 civil_engineering_IX_desc:0 "Le revêtement par coffrage glissant est une méthode permettant de réaliser des revêtements routiers en continu. À l'aide de finisseurs modernes, le béton ou l'enrobé est étalé en continu, ce qui garantit un résultat plus homogène et une mise en œuvre plus rapide. Le finisseur procède ensuite au nivellement et au lissage de la structure et peut, le cas échéant, mettre en place des armatures tout en avançant.\nCette technique permet d'accélérer les travaux d'entretien routier et de réaliser des revêtements de faible épaisseur à un rythme plus soutenu."
 civil_engineering_X:0 "Utilisation à grande échelle de la CAO"
 civil_engineering_X_desc:0 "Dès leur apparition, les outils informatiques ont rapidement démontré leur potentiel et leurs capacités. Le développement des outils modernes de conception assistée par ordinateur (CAO) et leur adoption à grande échelle ont permis une avancée considérable en matière d'efficacité dans les domaines de la conception architecturale et de l'ingénierie. Ces outils facilitent le travail en automatisant les tâches répétitives, offrent des aides informatiques pour résoudre des problèmes complexes et intègrent d'autres fonctionnalités qui contribuent à améliorer l'efficacité."
