 logistics_I:0 "Transport aérien efficace"
 logistics_I_desc:0 "Des conteneurs plus légers et des dispositifs de fixation standardisés permettent d'accélérer les opérations de chargement et de déchargement du fret aérien."
 logistics_II:0 "Palettisation"
 logistics_II_desc:0 "Le fait de placer toutes les marchandises sur des palettes, qui peuvent être facilement manipulées par des chariots élévateurs et des grues de manutention, nous offre une plus grande flexibilité quant aux marchandises que nous pouvons expédier et à leur destination."
 logistics_III:0 "Nomenclature modulaire"
 logistics_III_desc:0 "La nomenclature modulaire est un document de planification qui permet d'adapter à la demande, en vue de la production en usine, des produits complexes dotés de fonctionnalités optionnelles. En remplaçant certains composants par d'autres sur un produit modulaire, il est possible de créer facilement, sur commande, davantage de variantes d'un même produit afin de répondre à des besoins variés."
 logistics_IV_A:0 "MRP basé sur la consommation"
 logistics_IV_A_desc:0 "La planification des besoins en composants (MRP) basée sur la consommation s'appuie sur les chiffres de vente actuels et prévisionnels afin de fabriquer à l'avance les produits susceptibles d'être nécessaires, ce qui permet de gagner du temps et de répondre rapidement à la demande. Cependant, cette méthode comporte des imprécisions qui entraînent des gaspillages dus à des prévisions erronées, ce qui peut se traduire par un gaspillage de ressources. Il arrive parfois que la MRP basée sur la consommation présente des défaillances catastrophiques au niveau des prévisions, conduisant à des liquidations ou à des gaspillages massifs."
 logistics_IV_B:0 "MRP « de la production à la demande »"
 logistics_IV_B_desc:0 "La planification des ressources de production à la demande s'appuie sur les besoins immédiats et ne lance la fabrication du produit qu'une fois la commande passée. Cette approche permet d'éviter le gaspillage et d'économiser des ressources ainsi que du temps de production. Elle entraîne toutefois des délais d'attente et oblige les entreprises à planifier leurs propres produits de manière plus individualisée ou à s'appuyer davantage sur les commandes anticipées des clients. La production à la demande peut souvent entraîner des pénuries ou des retards dans le traitement des commandes, mais elle évite le gaspillage des ressources."
 logistics_V_A:0 "Normalisation des conteneurs transportés par camion"
 logistics_V_A_desc:0 "La normalisation du transport intermodal par camion consiste à uniformiser ce type de transport. Bien que l'ensemble du transport intermodal soit normalisé, le choix de cette technologie met l'accent sur la logistique routière et l'innovation. Se concentrer sur la logistique routière facilite les déplacements au sein d'une ville, ce qui favorise le développement de l'industrie locale grâce à une logistique urbaine et à des réseaux d'infrastructures simplifiés ; en revanche, cela laisse de côté l'innovation dans les réseaux ferroviaires, ce qui entrave la productivité globale du commerce interurbain ou de l'industrie rurale."
 logistics_V_B:0 "Normalisation des conteneurs pour le transport ferroviaire"
 logistics_V_B_desc:0 "La normalisation des conteneurs ferroviaires consiste à normaliser le transport intermodal par rail. Bien que l'ensemble du transport intermodal soit normalisé, le choix de cette technologie met l'accent sur la logistique ferroviaire et l'innovation. Se concentrer sur la logistique ferroviaire facilite le transport interurbain et renforce les capacités industrielles des zones rurales, mais rend la mise en place de la logistique intra-urbaine plus coûteuse, ce qui se traduit par des infrastructures urbaines plus complexes et plus difficiles à gérer."
 logistics_VI:0 "Code universel des produits"
 logistics_VI_desc:0 "Le Code universel des produits (UPC) est un système de codes-barres qui permet d'identifier et de suivre rapidement les articles commercialisés. Outre le suivi, le code-barres permet un passage rapide en caisse des produits au point de vente."
 logistics_VI_A:0 "Terminaux pétroliers géants"
 logistics_VI_A_desc:0 ""
 logistics_VII_A:0 "Avantage concurrentiel SIS"
 logistics_VII_A_desc:0 "Le SIS (système d'information stratégique) « Differentiation Advantage » est un système d'information qui vise avant tout à offrir une plus grande polyvalence et à permettre d'accomplir davantage dans un éventail plus large de domaines, plutôt que de se contenter d'un avantage concurrentiel basé sur des coûts réduits. S'inspirant de la théorie de l'avantage de différenciation de Porter, le DS_SIS cherche à créer un avantage concurrentiel sur le marché grâce à son caractère unique."
 logistics_VII_B:0 "Avantage concurrentiel SIS"
 logistics_VIII_A:0 "Accent mis sur le ventre"
 logistics_VIII_A_desc:0 "Les avions-cargos à soute centrale sont des appareils destinés exclusivement au transport de marchandises, qui sont stockées dans la soute centrale de l'appareil. Ce type d'avion ne peut pas transporter de passagers et n'est donc pas aussi polyvalent que les avions mixtes. En se concentrant sur le développement des avions-cargos à soute centrale, le fret aérien peut être considérablement amélioré à mesure que le fret aérien industriel gagne en capacité.\nCela conduit à la production d'avions de ligne entièrement séparés, destinés uniquement au transport de passagers."
 logistics_VIII_B:0 "Accent mis sur les rabots combinés"
 logistics_VIII_B_desc:0 "Les avions polyvalents sont des appareils pouvant être rapidement adaptés pour transporter des passagers, du fret, ou les deux à la fois. Ils sont généralement équipés de rails permettant d'installer ou de retirer des sièges et sont conçus avec des portes latérales de soute surdimensionnées. Ces appareils peuvent être fabriqués en série, remplissent de multiples fonctions et permettent d'assurer à la fois le transport de fret et le transport aérien de passagers.\nCela se traduit principalement par la production d'avions polyvalents."
 logistics_IX:0 "Portiques modernes"
 logistics_IX_desc:0 "La grue à portique est une grande grue utilisée pour la manutention de conteneurs. Les grues à portique installées sur les quais assurent la logistique maritime, tandis que celles des gares de triage se chargent du chargement et du déchargement des trains. Les modèles modernes de grues à portique permettent de traiter les conteneurs intermodaux plus rapidement, de supporter des charges plus lourdes et de fonctionner de manière semi-automatique grâce à un système de commande assistée par ordinateur."
 logistics_X:0 "Gestion de la chaîne logistique"
 logistics_X_desc:0 "Si la gestion de la chaîne d'approvisionnement a vu le jour pendant la Seconde Guerre mondiale afin de mettre en place un système d'approvisionnement plus efficace et de rationaliser la logistique, les besoins actuels et les progrès technologiques exigent désormais un niveau encore plus élevé de contrôle et de gestion logistique. En organisant les contrats et les quotas et en créant des réseaux d'infrastructures mieux structurés et rationalisés, il est possible de répondre aux besoins du monde moderne et de permettre à l'industrie d'atteindre un niveau supérieur."
 logistics_XI:0 "Identification automatique et saisie de données (AIDC)"
 logistics_XI_desc:0 ""
 logistics_XII:0 "Logistique pour l'usine intelligente"
 logistics_XII_desc:0 ""
 logistics_XIII:0 "Logistique agile intégrée au cloud (CIAL)"
 logistics_XIII_desc:0 ""
 logistics_XIV:0 "Ingénierie des systèmes à l'ère de l'information"
 logistics_XIV_desc:0 ""
