 agriculture_I:0 "Chélates"
 agriculture_I_desc:0 "La chélation est le processus par lequel des ions et des molécules organiques se lient à des ions métalliques. Elle implique la formation de liaisons de coordination multiples entre un ligand et un atome métallique central. Les chélates sont très utiles pour la fabrication de compléments alimentaires. En agriculture, ils servent à produire des engrais complexes et à apporter aux plantes des oligo-éléments essentiels afin d'améliorer leur santé et leur nutrition. Cela améliore considérablement le rendement agricole, car les engrais traditionnels ne parvenaient pas à fournir ces oligo-éléments métalliques aux plantes."
 agriculture_II:0 "Généralisation de l'utilisation des pesticides"
 agriculture_II_desc:0 "\n\nLes ravageurs ont souvent causé des problèmes aux agriculteurs en dévorant leurs récoltes. Diverses méthodes ont été mises en œuvre pour réduire les problèmes liés aux ravageurs, telles que l'installation de clôtures ou l'utilisation de répulsifs aromatiques. Cependant, celles-ci n'ont pas réussi à éliminer tous les ravageurs.\nEn adoptant des poisons qui ont peu d'effet sur les humains mais qui sont mortels pour les insectes nuisibles, et en les introduisant à grande échelle, de nombreuses colonies d'insectes vivant à proximité des exploitations agricoles peuvent être éliminées.\n\n§R Il s'agit d'une bien meilleure alternative au bombardement au napalm des zones sauvages, mais cette méthode a été critiquée car elle est loin d'être aussi impressionnante."
 agriculture_III:0 "Agriculture sans labour"
 agriculture_III_desc:0 "L'agriculture sans labour est une méthode agricole durable dans laquelle le sol n'est ni perturbé ni retourné par le labour. Cela réduit considérablement l'érosion du sol et améliore sa longévité. Cependant, plusieurs pratiques doivent être adoptées dans le cadre de cette méthode. Les cultures de couverture doivent permettre de lutter contre les mauvaises herbes et les champs eux-mêmes doivent faire l'objet d'une rotation. Il faut donc installer des canaux de drainage pour empêcher la formation de ravines et de sillons creusés par l'eau. Le matériel agricole doit permettre un semis direct. Les résidus en excès doivent être éliminés régulièrement."
 agriculture_IV:0 "Matériel agricole moderne"
 agriculture_IV_desc:0 ""
 agriculture_V:0 "Suivi des cultures par satellite"
 agriculture_V_desc:0 "Le suivi des cultures par satellite consiste en une surveillance spectrale du développement des cultures. Les données relatives au développement des cultures sont indexées et intégrées dans un ensemble de données pouvant être traitées manuellement ou automatiquement, ce qui permet d'intervenir en temps réel pour diagnostiquer et traiter les problèmes de santé des cultures."
