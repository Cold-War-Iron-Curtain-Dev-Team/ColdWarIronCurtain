 industry_plastics_tt:0 "§G+15 %§! de revenus des §YRaffineries pétrochimiques§!\n"
 materials_I:0 "Alliages de titane"
 materials_I_desc:0 "Les alliages de titane sont des mélanges métallurgiques composés de titane et d'autres métaux. Ils présentent une résistance élevée à la traction ainsi qu'une résistance exceptionnelle à la corrosion et aux intempéries. Le titane, bien que solide, est un métal fragile. L'ajout d'autres métaux, tels que le vanadium ou l'aluminium, lui permet de conserver une grande partie de sa résistance tout en gagnant en ductilité. Bien qu'il ne soit pas adapté à la construction ou aux structures porteuses, il est utilisé dans l'aéronautique, l'aérospatiale, les dispositifs médicaux, l'automobile et l'électronique grand public."
 materials_II:0 "Verre flotté"
 materials_II_desc:0 "Le verre flotté est un type de verre obtenu en faisant flotter du verre en fusion sur des métaux en fusion, tels que l'étain. Cela lui confère une épaisseur uniforme. Cette uniformité le rend particulièrement adapté aux applications commerciales et industrielles dans le domaine de l'optique et dans la plupart des secteurs de la construction. Pratiquement tout le verre utilisé à l'époque moderne est du verre flotté, car sa fabrication est peu coûteuse : il s'agit simplement de verre sodocalcique formé sur de petites quantités de métaux fondus bon marché à bas point de fusion, comme l'étain. De plus, le verre flotté peut être transformé pour créer du verre renforcé ou dépoli."
 materials_III:0 "Composites à matrice céramique"
 industry_materials_III_tt:0 "La consommation des §YQuartiers de Fonderie§! est de §G-10 % £resources_strip|1§!"
 materials_III_desc:0 ""
 materials_IV:0 "Composites à matrice métallique"
 industry_materials_IV_tt:0 "La consommation des §YQuartiers de Fonderie§! est de §G-10 % £resources_strip|1§!"
 materials_IV_desc:0 "Les composites à matrice métallique sont des matériaux composites composés d'au moins deux constituants. Ils sont parfois fabriqués en associant d'autres matériaux au métal. Les composites à matrice métallique sont généralement utilisés dans les outils de coupe haute performance en carbure de tungstène, les blindages, les freins à disque, les pièces automobiles et les équipements scientifiques et de laboratoire. Ils peuvent également être associés au graphène pour créer des modules électroniques de puissance haut de gamme destinés à des équipements électroniques coûteux."
 materials_V:0 "Nanocomposites"
 materials_V_desc:0 "Les nanocomposites sont des matériaux qui associent des nanoparticules à d'autres composites matriciels. Ces ajouts permettent d'améliorer considérablement la résistance mécanique et la conductivité, ce qui permet aux matrices d'atteindre des performances encore supérieures dans les applications où elles sont utilisées. Cela permet aux équipements électroniques, industriels et commerciaux, ainsi qu'aux systèmes militaires, d'atteindre des niveaux de performance plus élevés grâce à ces matrices améliorées."
 materials_VI:0 "Mousse métallique"
