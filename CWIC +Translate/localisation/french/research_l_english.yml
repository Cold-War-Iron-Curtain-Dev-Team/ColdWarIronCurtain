 helicopter:0 "Hélicoptères"
 early_helicopter:0 "Les premières utilisations de l'hélicoptère"
 early_helicopter_short:0 "Les premiers hélicoptères "
 early_helicopter_desc:0 "Un hélicoptère est un type d'aéronef à rotors dont la portance et la poussée sont assurées par des rotors tournant horizontalement. Cela lui permet de décoller et d'atterrir à la verticale, de voler en stationnaire, ainsi que d'avancer, de reculer et de se déplacer latéralement. Ces caractéristiques permettent aux hélicoptères d'être utilisés dans des zones encombrées ou isolées où les avions à voilure fixe et de nombreux types d'appareils STOL (décollage et atterrissage sur piste courte) ou STOVL (décollage sur piste courte et atterrissage vertical) ne peuvent pas opérer sans piste."
