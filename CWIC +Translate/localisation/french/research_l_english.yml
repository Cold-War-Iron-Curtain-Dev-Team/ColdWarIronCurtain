 TITLE_FLEET_IN_BEING:0 "Flotte actuelle"
 TITLE_TRADE_INTERDICTION:0 "Interdiction de commerce"
 TITLE_BASE_STRIKE:0 "Frappe de base"
 FLEET_IN_BEING_DESC:0 "Une flotte forte centrée autour des cuirassés signifie que nous sommes une force à compter avec quand déployé en mer."
 TRADE_INTERDICTION_DESC:0 "Contre un adversaire naval plus fort, nous pouvons nous concentrer sur l’immobilisation de leur flotte et la destruction des lignes de ravitaillement pour affamer leur machine de guerre."
 BASE_STRIKE_DESC:0 "Avec un fort accent sur les transporteurs et leur soutien, aucun ennemi ne sera hors de notre portée, que ce soit sur terre ou en mer."
 AIR_SUPERIORITY_DESC:0 "Nos chasseurs sont l’épine dorsale de la force aérienne et ils défendent nos airs, escortent les bombardiers et dégagent le ciel des ennemis pour nos troupes au sol."
 BATTLEFIELD_SUPPORT_DESC:1 "Améliorer la coopération entre l'appui aérien rapproché et les troupes au sol va causer des ravages dans l'armée ennemie."
 OPERATIONAL_INTEGRITY_DESC:0 "Les bombardiers tactiques sont flexibles et peuvent effectuer des opérations de soutien au sol et de bombardement régulier"
 STRATEGIC_DESTRUCTION_DESC:0 "En bombardant les usines ennemies, soit de nuit, soit plus dangereusement, pendant la journée on peut gêner sérieusement leur machine de guerre."
 fleet_in_being:0 "Flotte de dissuasion"
 fleet_in_being_desc:0 "Les navires restent au port où ils sont plus en sécurité et n’engagent des ennemis qu’aux moments opportuns. La présence de nos navires rendra les ennemis plus réticents à prendre nos ports.\n\n"
 battlefleet_concentration:0 "Concentration de la flotte de bataille"
 battlefleet_concentration_desc:0 "Appelez les navires à proximité dès qu’un navire ennemi est repéré. Le tir ciblé coordonné rend rapidement les navires ennemis inutilisables. Chassez-les un par un."
 battlefleet_concentration_ti:0 "Concentration de la flotte de bataille"
 battlefleet_concentration_ti_desc:0 "Appelez les navires à proximité dès qu’un navire ennemi est repéré. Le tir ciblé coordonné rend rapidement les navires ennemis inutilisables. Chassez-les un par un."
 subsidiary_carrier_role:0 "Rôle du transporteur subsidiaire"
 subsidiary_carrier_role_desc:0 "Les porte-avions soutiennent les cuirassés, améliorant leur état de préparation pour passer de la défense à l’attaque. L’utilité du porte-avions comme un œil dans le ciel et une puissante force d’attaque rapide complètent bien les plus lents navires."
 subsidiary_carrier_role_ti:0 "Rôle du transporteur subsidiaire"
 subsidiary_carrier_role_ti_desc:0 "Les porte-avions soutiennent les cuirassés, améliorant leur état de préparation pour passer de la défense à l’attaque. L’utilité du porte-avions comme un œil dans le ciel et une puissante force d’attaque rapide complètent bien les plus lents navires."
 hunter_killer_groups:0 "Groupes Chasseur-Tueur"
 hunter_killer_groups_desc:0 "Les destroyers forment des groupes pour traquer les sous-marins ennemis. Les efforts combinés des spécialistes du repérage et de la chasse font une équipe de tuerie fantastique."
 floating_fortress:0 "Forteresse flottante"
 floating_fortress_desc:0 "Avec des cuirassés en alerte maximale, nous serons toujours prêts à répondre si l’ennemi ose menacer nos eaux. Toute flotte a besoin d’une base solide et la puissance du cuirassé est inégalée."
 floating_fortress_ti:0 "Forteresse flottante"
 floating_fortress_ti_desc:0 "Avec des cuirassés en alerte maximale, nous serons toujours prêts à répondre si l’ennemi ose menacer nos eaux. Toute flotte a besoin d’une base solide et la puissance du cuirassé est inégalée."
 floating_fortress_bs:0 "Forteresse flottante"
 floating_fortress_bs_desc:0 "Avec des cuirassés en alerte maximale, nous serons toujours prêts à répondre si l’ennemi ose menacer nos eaux. Toute flotte a besoin d’une base solide et la puissance du cuirassé est inégalée."
 floating_airfield:0 "Aérodrome flottant"
 floating_airfield_desc:0 "Une meilleure intégration des transporteurs dans notre flotte nous permet d’être prêts à frapper tant de la mer que du ciel. Il est essentiel que nous dominions le ciel partout où nous allons."
 floating_airfield_ti:0 "Aérodrome flottant"
 floating_airfield_ti_desc:0 "Une meilleure intégration des transporteurs dans notre flotte nous permet d’être prêts à frapper tant de la mer que du ciel. Il est essentiel que nous dominions le ciel partout où nous allons."
 floating_airfield_bs:0 "Aérodrome flottant"
 floating_airfield_bs_desc:0 "Une meilleure intégration des transporteurs dans notre flotte nous permet d’être prêts à frapper tant de la mer que du ciel. Il est essentiel que nous dominions le ciel partout où nous allons."
 grand_battlefleet:0 "Grande flotte de bataille"
 grand_battlefleet_desc:0 "La formation au leadership permet à nos commandants de rester calmes dans le feu des combats, même lorsqu’ils commandent d’immenses flottes. Notre flotte écrasera toute tête d’opposition."
 convoy_sailing:0 "Navigation en convois"
 convoy_sailing_desc:0 "L’introduction de la navigation obligatoire en convoi facilitera le repérage des raids ennemis et la réponse à temps. La sécurité en nombre est la solution."
 convoy_sailing_ti:0 "Navigation en convois"
 convoy_sailing_ti_desc:0 "L’introduction de la navigation obligatoire en convoi facilitera le repérage des raids ennemis et la réponse à temps. La sécurité en nombre est la solution."
 convoy_sailing_bs:0 "Navigation en convois"
 convoy_sailing_bs_desc:0 "L’introduction de la navigation obligatoire en convoi facilitera le repérage des raids ennemis et la réponse à temps. La sécurité en nombre est la solution."
 convoy_escorts:0 "Convois sous escorte"
 convoy_escorts_desc:0 "Des navires de surface rapides dans le cadre de nos convois nous permettront de repérer les sous-marins ennemis et d’intervenir à temps. La détection est la clé pour éliminer les nuisances sous-marines."
 convoy_escorts_bs:0 "Convois sous escorte"
 convoy_escorts_bs_desc:0 "Des navires de surface rapides dans le cadre de nos convois nous permettront de repérer les sous-marins ennemis et d’intervenir à temps. La détection est la clé pour éliminer les nuisances sous-marines."
 escort_carriers:0 "Porte-avions d'escorte"
 escort_carriers_desc:0 "La zone couverte par un avion porte-avions rend beaucoup plus facile l’accompagnement des convois commerciaux. Sécuriser le flux de ressources est essentiel."
 integrated_convoy_defence:0 "Défense coordonnée des convois"
 integrated_convoy_defence_desc:0 "Une meilleure coordination entre la marine et l’air nous permet de frapper les ennemis à des kilomètres avant qu’ils ne soient près de nos convois commerciaux. Cela augmentera considérablement l’efficacité de la navigation en convoi."
 integrated_convoy_defence_bs:0 "Défense coordonnée des convois"
 integrated_convoy_defence_bs_desc:0 "Une meilleure coordination entre la marine et l’air nous permet de frapper les ennemis à des kilomètres avant qu’ils ne soient près de nos convois commerciaux. Cela augmentera considérablement l’efficacité de la navigation en convoi."
 submarine_operations:0 "Opérations sous-marines"
 submarine_operations_desc:0 "Nous n’avons pas besoin d’engager la flotte ennemie pour gagner la guerre. Attaquez leurs convois commerciaux avant qu’ils ne puissent réagir et disparaître sous la surface. Vous ne pouvez pas combattre ce que vous ne pouvez pas voir."
 submarine_operations_bs:0 "Opérations sous-marines"
 submarine_operations_bs_desc:0 "Nous n’avons pas besoin d’engager la flotte ennemie pour gagner la guerre. Attaquez leurs convois commerciaux avant qu’ils ne puissent réagir et disparaître sous la surface. Vous ne pouvez pas combattre ce que vous ne pouvez pas voir."
 undersea_blockade:0 "Blocus sous-marin"
 undersea_blockade_desc:0 "Les sous-marins sont l’outil parfait pour couper l’afflux de matières premières importantes de l’ennemi. Nous allons paralyser la production de l’ennemi et gagner en les affamant."
 undersea_blockade_bs:0 "Blocus sous-marin"
 undersea_blockade_bs_desc:0 "Les sous-marins sont l’outil parfait pour couper l’afflux de matières premières importantes de l’ennemi. Nous allons paralyser la production de l’ennemi et gagner en les affamant."
 convoy_interdiction:0 "Interdiction des convois"
 convoy_interdiction_desc:0 "Une meilleure coordination de notre sous-marin leur permettra d’attaquer les convois commerciaux en route. Perturber les lignes de ravitaillement ennemies nous donnera l’avantage stratégique."
 convoy_interdiction_ti:0 "Interdiction des convois"
 convoy_interdiction_ti_desc:0 "Une meilleure coordination de notre sous-marin leur permettra d’attaquer les convois commerciaux en route. Perturber les lignes de ravitaillement ennemies nous donnera l’avantage stratégique."
 convoy_interdiction_bs:0 "Interdiction des convois"
 convoy_interdiction_bs_desc:0 "Une meilleure coordination de notre sous-marin leur permettra d’attaquer les convois commerciaux en route. Perturber les lignes de ravitaillement ennemies nous donnera l’avantage stratégique."
 submarine_offensive:0 "Offensive sous-marine"
 submarine_offensive_desc:0 "Atteindre le sommet de la communication entre nos sous-marins leur permet de passer à l’offensive. Détruisons les convois commerciaux ennemis plus vite qu’ils ne peuvent les remplacer."
 submarine_offensive_bs:0 "Offensive sous-marine"
 submarine_offensive_bs_desc:0 "Atteindre le sommet de la communication entre nos sous-marins leur permet de passer à l’offensive. Détruisons les convois commerciaux ennemis plus vite qu’ils ne peuvent les remplacer."
 trade_interdiction:0 "Interdiction de commerce"
 trade_interdiction_desc:0 "Plus tôt nous repérons les navires ennemis, plus vite nous pouvons les détruire. Frappez leurs convois commerciaux et échappez-vous avant qu’ils n’aient le temps de réagir.\n\n"
 unrestricted_submarine_warfare:0 "Guerre sous-marine sans restriction"
 unrestricted_submarine_warfare_desc:0 "Laissez notre sous-marin couler tout navire avecout l’avertissement, civil ou non. Certains considèrent que c’est une violation des règles de la guerre, mais on ne peut nier son efficacité."
 wolfpacks:0 "Meutes de loups"
 wolfpacks_desc:0 "Avec nos sous-marins organisé en packs, la coordination entre eux est grandement améliorée. Une fois qu’un ennemi est localisé, notre sous-marin attend jusqu’à ce que le reste de la meute arrive, attaquant uniquement lorsque les chances sont largement en notre faveur."
 advanced_submarine_warfare:0 "Guerre sous-marine avancée"
 advanced_submarine_warfare_desc:0 "Une amélioration massive de la communication entre nos sous-marins leur permet d’attaquer le temps à la perfection. Quand ils nous verront enfin ce sera d’un navire qui coule."
 combined_operations_raiding:0 "Opérations combinées d’attaque"
 combined_operations_raiding_desc:0 "Désigner toutes les ressources pour la chasse aux convois commerciaux ennemis. La coordination entre notre flotte principale et le sous-marin rend notre flotte toujours alerte. Aucun navire ne passera inaperçu dans nos eaux."
 raider_patrols:0 "Patrouilles de raiders"
 raider_patrols_desc:0 "Les patrouilles des navires rapides et lourds ne laissent aucun endroit à l’ennemi pour se cacher. \nNon seulement le sous-marin peut chasser."
 capital_ship_raiders:0 "Navire capitaux Raiders"
 capital_ship_raiders_desc:0 "Avec nos navires les plus puissants à la recherche de convois commerciaux, l’ennemi ne trouvera plus la sécurité en nombre. Ils sont des proies faciles, priant que nous ne les trouvions pas."
 carrier_operations:0 "Opérations du porte-avions"
 carrier_operations_desc:0 "Les transporteurs permettront à nos pilotes de frapper en mer plus rapidement et plus facilement qu’à partir de nos bases aériennes sur terre. Nous frapperons avant qu’ils aient le temps de réagir."
 naval_air_operations:0 "Opérations aériennes navales"
 naval_air_operations_desc:0 "Les pilotes formés pour effectuer des missions à partir de transporteurs ouvre une nouvelle façon pour nous de dominer les mers. Les avions sont un moyen efficace de réduire la flotte ennemie."
 base_strike:0 "Frappe de base"
 base_strike_desc:0 "Frapper les ports ennemis paralysera leur capacité à reconstruire leur flotte. Cela nous permettra de dominer les mers en nombre.\n\n"
 carrier_primacy:0 "Suprématie des porte-avions"
 carrier_primacy_desc:0 "Les avions modernes ont une plus grande portée et précision que les canons navals ordinaires. Intégrez des transporteurs dans notre flotte et dominez les mers depuis le ciel."
 carrier_task_forces:0 "Forces opérationnelles avec porte-avions"
 carrier_task_forces_desc:0 "Des forces spéciales organisées avec des transporteurs et des croiseurs légers garantissent que l’ennemi ne nous surprendra jamais."
 massed_strikes:0 "Frappes massées"
 massed_strikes_desc:0 "Les pilotes formés pour des missions de porte-avions permettront même à un porte-avions surpeuplé de fonctionner en douceur, d’essaimer l’ennemi et d’améliorer grandement leur efficacité dans les batailles navales. Un porte-avions doit fonctionner comme une machine bien huilée où chacun connaît son rôle."
 carrier_battlegroups:0 "Groupes navals de porte-avions"
 carrier_battlegroups_desc:0 "Les transporteurs sont capables de frapper l’ennemi à une plus grande distance que n’importe quel canon naval et avec des yeux dans le ciel nous ne serons jamais pris au dépourvu. Les transporteurs en masse sont une force à prendre en compte."
 escort_patrols:0 "Patrouilles d'escorte"
 escort_patrols_desc:0 "L’amélioration de la détection rend nos escortes de convoi beaucoup plus mortelles que les sous-marins. avec nulle part où se cacher, elles ne représentent aucune menace réelle."
