 ww_infra:0 "Infrastructures de la Seconde Guerre mondiale"
 ww_infra_desc:0 "Conceptions et modèles d'infrastructures de l'entre-deux-guerres et de la Seconde Guerre mondiale. Cela comprend un large éventail de réseaux ferroviaires et routiers, ainsi que les systèmes logistiques de base et les principes fondamentaux des infrastructures urbaines d'approvisionnement en eau."
 inframanagement_I:0 "Urbanisme"
 inframanagement_II:0 "Construction d'infrastructures modernes"
 inframanagement_III:0 "Aménagement d'espaces industriels"
 inframanagement_IV:0 "Améliorations apportées à l'organisation des infrastructures"
 inframanagement_V:0 "Matériaux routiers durables"
 inframanagement_VI:0 "Amélioration de l'entretien des infrastructures"
 inframanagement_VII:0 "Villes intelligentes"
 industry_inframanagement_VII_tt:0 "Une technologie clé dans le cadre du projet §CDéploiement des villes intelligentes§! !"
 inframanagement_VIII:0 "Initiatives sociales et écologiques"
 industry_inframanagement_VIII_tt:0 "§G-7,5 %§! £environmental_strip §YExternalités environnementales§! §BÀ VENIR§!"
 inframanagement_I_desc:0 "L'urbanisme est le processus qui consiste à planifier l'extension ou l'amélioration d'un environnement urbain. Il implique une gestion rigoureuse et la mise en place de systèmes visant à répartir les fonctions des bâtiments entre les secteurs résidentiel, commercial, industriel ou toute combinaison de ceux-ci. L'urbanisme vise à implanter les bâtiments dans des zones où ils peuvent fonctionner de manière optimale les uns par rapport aux autres et à fournir des infrastructures spécialisées pour soutenir les entreprises de ce secteur.\nCette technologie représente les systèmes fondamentaux d'urbanisme d'après-guerre qui s'adaptent aux besoins de l'industrie moderne, allant au-delà des systèmes d'urbanisme de l'ère industrielle classique. Elle facilite grandement les futurs développements d'infrastructures."
 inframanagement_II_desc:0 "Les engins de chantier modernes sont indispensables pour construire les réseaux d'infrastructures de plus en plus complexes de l'ère atomique. Des systèmes hydrauliques à haute résistance, des décapeuses à benne basculante, des bulldozers hydrauliques, des poseurs de canalisations, des fraiseuses hydrauliques pour chaussées et d'innombrables autres engins de chantier lourds sont nécessaires pour construire les infrastructures de l'ère atomique dans des délais raisonnables. D'une manière générale, cette technologie marque le passage des systèmes à câbles à l'hydraulique."
 inframanagement_III_desc:0 "Outre l'urbanisme, la conception spécifique d'espaces industriels et leur aménagement de manière à faciliter les activités, le stockage des marchandises et la réception des livraisons pour toutes les industries d'une zone donnée peuvent considérablement améliorer la construction des infrastructures industrielles et accroître le rendement industriel. La conception spécifique d'espaces destinés aux infrastructures industrielles actuelles et futures ouvre la voie à des améliorations et à des extensions aisée des espaces industriels."
 inframanagement_IV_desc:0 "Une amélioration générale de la gestion des infrastructures. Cela implique la mise en œuvre de meilleures techniques de gestion et d'organisation, l'augmentation du nombre de catégories de routes et l'amélioration des systèmes et des protocoles destinés aux usagers de la route. Ces améliorations organisationnelles sont généralement mises en place afin de permettre aux urbanistes de mieux exploiter le terrain et de faciliter les travaux de modernisation et d'entretien."
 inframanagement_V_desc:0 "Les matériaux routiers durables et résistants permettent de réduire les coûts de construction et d'entretien des routes et sont également essentiels pour supporter le poids du trafic industriel lourd. De plus, ces matériaux sont plus faciles à recycler après avoir été broyés, ce qui réduit encore davantage les coûts d'entretien et de construction. La réduction des délais et des coûts de construction et d'entretien permet aux équipes de chantier et aux agents publics de consacrer davantage de temps à l'extension des infrastructures existantes ou, à tout le moins, de passer moins de temps à travailler, ce qui est pour le moins bienvenu."
 inframanagement_VI_desc:0 "L'amélioration de l'entretien des infrastructures grâce à des procédures et à des équipements plus performants facilite la maintenance et la construction d'un grand nombre d'infrastructures. Cela comprend des avancées techniques telles que des commandes ergonomiques, des équipements à grande vitesse, des moteurs modernes de forte puissance, des engins hybrides polyvalents, l'intégration de l'électronique et des systèmes hydrauliques modernes. Les améliorations procédurales concernent notamment une meilleure planification des réparations et la surveillance à distance."
 inframanagement_VII_desc:0 ""
 inframanagement_VIII_desc:0 "Des initiatives visant à améliorer la situation sociale liée au mode de vie urbain. Le développement urbain peut donner lieu à de nombreux problèmes psychologiques et sociaux. L'isolement des communautés, le manque d'engagement, les problèmes liés à la jeunesse, les gangs, les mauvaises relations avec la police pouvant résulter d'abus de pouvoir ou d'autres causes, ainsi que d'autres situations, peuvent être traités grâce à des initiatives sociales destinées à s'attaquer aux problèmes sociaux auxquels ces communautés sont confrontées. Même en l'absence de problèmes majeurs, les initiatives sociales peuvent améliorer des communautés déjà bien établies et s'attaquer de manière préventive aux problèmes avant qu'ils ne deviennent un véritable enjeu. Davantage de régénération et de rénovation des bâtiments pour une meilleure conservation de l'énergie et de l'eau, la gestion des friches industrielles (sites abandonnés présentant des problèmes de contamination), une meilleure gestion des déchets et toute une série d'autres améliorations favorisant la durabilité."
 infrastate_I:0 "Chemins de fer modernes"
 infrastate_II:0 "Voies rapides"
 infrastate_III:0 "Infrastructures en situation particulière"
 infrastate_IV:0 "Trains à grande vitesse"
 infrastate_V:0 "Voies rapides industrielles à accès contrôlé"
 infrastate_VI:0 "Rails de maglev"
 infrastate_VII:0 "Vactrain/Autoroutes intelligentes"
 infrastate_I_desc:0 "La propulsion diesel-électrique, les systèmes hydrauliques d'après-guerre et les infrastructures ferroviaires à grande capacité améliorent considérablement la puissance et l'efficacité des chemins de fer. Les moteurs diesel-électriques utilisent des moteurs diesel pour entraîner un générateur à courant continu ou alternatif qui alimente le moteur de traction, ce qui augmente la vitesse et le rendement énergétique des trains. De plus, l'amélioration des chemins de fer grâce à des équipements optimisés pour un chargement et un déchargement rapides des trains réduit au minimum le temps que les trains circulant sur des lignes très fréquentées doivent passer en gare et leur permet d'être plus productifs."
 infrastate_II_desc:0 "Les autoroutes artérielles sont des voies rapides à accès contrôlé d'une largeur exceptionnelle, conçues pour la circulation automobile à grande vitesse et permettant au trafic industriel, commercial, civil ou administratif de traverser de vastes étendues de terrain. Les autoroutes artérielles permettent aux voies de grande capacité d'acheminer le trafic vers elles via des voies de desserte, qui permettent aux véhicules d'accélérer et de s'insérer sur les autoroutes artérielles ou de les quitter. Une planification adéquate et des calculs mathématiques précis sont essentiels, car des autoroutes artérielles qui ne laissent pas suffisamment d'espace pour les routes collectrices peuvent poser des problèmes de sécurité, tandis que des routes collectrices trop larges peuvent simplement gaspiller de l'espace et de l'argent et, en raison de leur nature et de leur forte fréquentation, entraîner des problèmes d'entretien."
 infrastate_III_desc:0 "Les catastrophes, les guerres, les situations d'urgence et d'innombrables autres problèmes peuvent nécessiter l'intervention de renforts provenant de loin. La mise en place d'infrastructures à accès limité peut permettre à la police, aux pompiers, aux services de secours en cas de catastrophe, à l'armée ou à d'autres types de circulation d'intervenir plus rapidement sans avoir à se mêler directement à la circulation civile, susceptible d'être en proie à la panique. Les infrastructures destinées aux situations d'urgence peuvent permettre, entre autres améliorations, aux renforts de police d'arriver plus rapidement dans d'autres villes, aux pompiers ou aux services de secours d'intervenir plus vite, et d'améliorer l'approvisionnement militaire. De plus, ces infrastructures peuvent généralement être utilisées par tous les véhicules gouvernementaux pour tout ce que le gouvernement juge nécessaire."
 infrastate_IV_desc:0 "Le train à grande vitesse (TGV) circule à une vitesse nettement supérieure à celle des trains traditionnels. Le TGV utilise un système intégré composé de matériel roulant spécialisé et de voies réservées pour atteindre des vitesses supérieures à 200 kilomètres à l'heure (120 mph). Communément appelés « trains à grande vitesse », ces trains permettent aux entreprises d'effectuer des livraisons en très peu de temps sur de très longues distances ou de transporter des passagers en un temps record, ce qui améliore la productivité et facilite la gestion des livraisons urgentes ou express sans avoir à recourir à des vols express plus coûteux. De plus, les trains à grande vitesse peuvent être plus économes en carburant, voire entièrement électriques, ce qui permet de réduire la dépendance d'un pays vis-à-vis des combustibles fossiles."
 infrastate_V_desc:0 "Véritables hybrides entre les routes nationales et les autoroutes principales, les voies rapides industrielles à accès contrôlé sont spécialement conçues pour répondre aux besoins du trafic industriel et permettre aux grands groupes ou aux industries d'acheminer leurs produits sur de plus grandes distances sans avoir à partager la route avec des véhicules plus petits ou des conducteurs moins expérimentés. De plus, un trafic plus prévisible réduit les embouteillages causés par des conducteurs non professionnels imprévisibles ou impatients, ce qui garantit des délais de livraison plus réguliers."
 infrastate_VI_desc:0 "Les rails MAGLEV (lévitation magnétique) utilisent des aimants pour repousser le train hors de la voie et disposent d'un autre ensemble d'aimants pour le propulser vers l'avant, créant ainsi un train sans frottement capable d'atteindre des vitesses extrêmes sur une ligne entièrement électrifiée. Ils sont extrêmement rapides, silencieux, fluides et dotés d'un système de freinage nettement plus performant. Le système MAGLEV est si puissant que la seule limite pratique des lignes MAGLEV réside dans la sécurité des passagers et du conducteur qu'il transporte, ainsi que dans la quantité d'énergie qu'il consomme. À l'avenir, des systèmes à distance pourraient toutefois être utilisés, pour lesquels la limite deviendrait la vitesse à laquelle l'aimant peut se déplacer et la capacité du système à stabiliser le train lui-même."
 infrastate_VII_desc:0 "Les « vactrains » sont des lignes de train à sustentation magnétique (MAGLEV) nettement plus économes en énergie et capables d'atteindre des vitesses bien plus élevées, car elles surmontent la résistance à l'air en faisant simplement circuler le train dans un tunnel sous vide. Afin de tirer parti de ces vitesses plus élevées, les vactrains devront être télécommandés, ne transporter aucun passager et être séparés des trains de passagers MAGLEV traditionnels, qui doivent limiter leur vitesse pour la sécurité des passagers, ou simplement circuler sur des lignes de tubes vactrain distinctes à des vitesses plus faibles afin d'éviter de créer des goulots d'étranglement pour les vactrains de fret télécommandés.\nLes autoroutes intelligentes (Smart Freeways) sont des systèmes autoroutiers à la pointe de la technologie qui gèrent et dirigent le trafic de manière intelligente. Elles peuvent inclure des systèmes électroniques de guidage et de surveillance destinés à conseiller à la fois les véhicules autonomes et ceux conduits manuellement, afin d'éviter les embouteillages ou de rediriger le trafic pour éviter les accumulations."
 inframunicipal_I:0 "Artères principales"
 inframunicipal_II:0 "Axes routiers principaux"
 inframunicipal_III:0 "Systèmes de transport en commun de pointe"
 inframunicipal_IV:0 "Conception de carrefours à haut débit et de blocs de circulation fluide"
 inframunicipal_V:0 "Planification en 3D des infrastructures municipales"
 inframunicipal_VI:0 "Système de transport intelligent (ITS)"
 inframunicipal_VII:0 "Transport en commun rapide (MRT) / Info Era : Transports publics et logistique"
 inframunicipal_VIII:0 "Initiatives en faveur des transports publics durables"
 inframunicipal_I_desc:0 "Les autoroutes urbaines sont des réseaux de transport à grande capacité et à grande vitesse destinés à faciliter les déplacements sur de longues distances au sein des grandes villes et à réduire les temps de trajet ainsi qu'à optimiser la logistique commerciale. Les autoroutes sont dotées de voies de desserte qui acheminent le trafic vers et depuis ces autoroutes, permettant ainsi aux véhicules d'accélérer ou de quitter une zone. De plus, les autoroutes sont d'une grande utilité pour les services d'urgence, qui peuvent ainsi parcourir de plus longues distances en peu de temps, ce qui profite tout particulièrement aux pompiers, qui peuvent intervenir rapidement en cas d'incendies industriels ou d'incendies de grande ampleur nécessitant le déploiement de ressources provenant de plusieurs casernes."
 inframunicipal_II_desc:0 "Les routes principales sont des voies spécialement conçues pour accueillir le trafic industriel lourd, tel que les camions ; elles se caractérisent par des voies plus larges et sont construites spécifiquement pour répondre aux besoins du trafic logistique commercial et industriel lourd. Les routes nationales rationalisent la logistique urbaine et permettent aux industries de s'approvisionner mutuellement plus rapidement ou de transporter des marchandises depuis les centres de transit interurbains vers les industries ou les commerces, et inversement. Les routes nationales peuvent également grandement faciliter le fonctionnement du système postal, car ces voies spécialisées permettent aux centres de tri postal de distribuer plus facilement les envois dans la ville selon des horaires réguliers."
 inframunicipal_III_desc:0 "Les systèmes de transport en commun avancés, qui englobent un large éventail de solutions et d'améliorations, comprennent tant la modernisation des réseaux existants que la mise en place de nouveaux systèmes. Les métros à grande vitesse, les bus à grande capacité, les monorails, les ferries et les tramways modernes, voire même des systèmes expérimentaux, réduisent considérablement les temps de trajet et augmentent de manière significative la capacité de transport. De plus, les systèmes de transport en commun avancés peuvent créer un cercle vertueux dans lequel un accès meilleur et moins coûteux aux options de transport entraîne une diminution du trafic, ce qui se traduit par des trajets plus efficaces et des économies globales sur les transports, ce qui permet d'augmenter les revenus et conduit ainsi à un recours accru aux transports en commun, etc., créant ainsi une croissance progressive des systèmes de transport en commun."
 inframunicipal_IV_desc:0 "La mise en place de carrefours à haut débit et de tronçons à circulation fluide permet de réduire considérablement la durée des trajets et de diminuer les coûts en limitant les temps d'arrêt et les irrégularités dans la durée des trajets. Une gestion adéquate des voies municipales et leur aménagement de manière à orienter la circulation pour éviter les carrefours permettent de réduire les problèmes de circulation en ville et peuvent également diminuer la double occupation des voies. Cela peut également améliorer la productivité et la qualité de vie en réduisant les embouteillages."
 inframunicipal_V_desc:0 "La planification 3D des infrastructures municipales est un système de pointe visant à optimiser l'espace routier et ferroviaire au sein d'une ville. Elle englobe notamment des voies ferrées de fret aériennes ou souterraines, des axes routiers souterrains, des passages souterrains et aériens, plusieurs niveaux urbains permettant aux autoroutes souterraines de libérer de l'espace en surface pour le trafic à grande vitesse sur de longues distances, ainsi que des voies de service souterraines destinées aux services de collecte des déchets ou aux services d'urgence afin de contourner le trafic urbain en surface, souvent difficile à circuler. La planification des infrastructures municipales en 3D peut grandement aider les urbanistes à surmonter les contraintes de terrain et d'espace et offrir une solution simple aux problèmes d'infrastructure complexes. Elle est toutefois extrêmement coûteuse et peut poser des défis en matière de navigation, ce qui fait peser un fardeau considérable sur les urbanistes."
 inframunicipal_VI_desc:0 "Le terme « infrastructures urbaines intelligentes » désigne de manière générale les infrastructures urbaines de l'ère de l'information. Il englobe les systèmes de navigation avancés, les conceptions intelligentes des réseaux routiers et ferroviaires, ainsi que les réseaux de transports en commun de l'ère de l'information, qui sont plus rapides, plus efficaces et offrent une plus grande capacité. Les infrastructures urbaines intelligentes peuvent s'interfacer de manière intelligente avec les systèmes de guidage, permettant ainsi aux conducteurs d'éviter les embouteillages et d'être guidés efficacement de manière à ne pas surcharger les voies les plus proches, d'acheminer les services d'urgence bien plus efficacement, d'améliorer les temps de trajet et de réduire le trafic global."
 inframunicipal_VII_desc:0 "Les réseaux de transport rapide (MRT) désignent généralement des réseaux de métro à voie ferrée lourde en saillie. Dans ce contexte, le terme MRT fait référence à des métros à grande vitesse et à forte capacité, dotés de voies ferrées séparées, capables de circuler sans interruption vers leur destination à grande vitesse depuis leurs points de départ. Ces réseaux MRT permettent de transporter un plus grand nombre de voyageurs en réduisant les temps de trajet par rapport aux réseaux de transport non rapides. La plupart des réseaux MRT circulent en surface, mais certains sont souterrains.\nLes transports publics de l'ère de l'information désignent les nombreuses avancées réalisées dans ce domaine à l'époque moderne. Des réseaux de transport en commun et des bus plus confortables, des systèmes à plus grande capacité, des aménagements plus efficaces, ainsi que de nombreuses autres avancées générales impliquant le déploiement à grande échelle de systèmes ou de véhicules coûteux mais hautement efficaces."
 inframunicipal_VIII_desc:0 "Les initiatives en faveur des transports publics durables favorisent la durabilité et la rentabilité à long terme des réseaux de transports publics. Il convient de noter que la rentabilité ne signifie pas nécessairement une réduction des dépenses publiques, mais plutôt une diminution des dépenses globales des citoyens de la ville et du coût de la vie. Ces initiatives peuvent consister à supprimer les tarifs afin d'encourager l'utilisation des transports publics, ce qui permet de réduire la consommation de carburant de la ville et les besoins d'entretien des véhicules privés (générant ainsi des économies et améliorant le pouvoir d'achat), tout en favorisant la durabilité environnementale. D'autres initiatives portent sur les véhicules économes en carburant et la réduction du gaspillage d'énergie et d'eau dans les infrastructures de transport en commun."
 arm_sht_desc:0 "Ces mastodontes sont pratiquement indestructibles, mais leur utilisation est également très limitée."
 arm_ht_desc:0 "Char lourd\n Les chars lourds sont protégés contre presque tous les types d'armes, mais leur utilité est limitée par leur faible mobilité.\n\nVéhicule blindé du génie\n Ces véhicules lourds remplissent des missions spécifiques telles que la mise en place de ponts, le franchissement d'obstacles et le terrassement, afin d'appuyer les forces mécanisées."
 arm_mt_desc:0 "MBT\n Les chars de combat principaux offrent un bon équilibre entre le blindage et la puissance de feu des chars lourds et la mobilité des chars légers.\n\nArtillerie automotrice\n L'artillerie automotrice est capable d'infliger des dégâts importants à distance, tant à l'infanterie qu'aux véhicules légèrement blindés."
 arm_lt_desc:0 "Le blindage des chars légers ne résiste pas aux tirs des canons de plus gros calibre, mais il offre une protection contre les armes légères. Les chars légers sont nettement plus maniables que leurs homologues plus lourds."
 arm_mech_desc:0 "APC\n Les véhicules de transport de troupes blindés offrent une mobilité et une protection accrues à l'infanterie.\n\nIFV\n Les véhicules de combat d'infanterie sont moins mobiles que les APC, mais apportent sur le champ de bataille un armement et un blindage plus lourds.\n\nAPC aéroporté\n Ces APC spécialisés sont équipés pour le déploiement aéroporté.\n\nPorteur de missiles antichars\n Les porteurs de missiles antichars dédiés constituent la solution des armées modernes face à la menace des chars de combat principaux. Les missiles sont extrêmement puissants contre les cibles blindées, mais leur efficacité contre l'infanterie est limitée.\n\nVéhicule de reconnaissance\n Véhicules petits et agiles conçus pour explorer le terrain et évaluer la composition des forces ennemies. Ils ne sont pas équipés pour le combat en première ligne."
 arm_mot_desc:0 "Camion\n Les camions confèrent à l'infanterie une mobilité stratégique bien supérieure, mais n'apportent par ailleurs aucune valeur combative directe significative.\n\nArtillerie de roquettes SP\n Spécialisée dans les attaques anti-infanterie, l'artillerie de roquettes inflige très peu de dégâts aux cibles blindées."
 arm_amph_desc:0 "Les transports amphibies constituent un compromis entre les transports mécanisés légers et lourds, tout en offrant des capacités amphibies améliorées."
 chem_weapons_one_tt:0 "§YPour utiliser des armes chimiques, vous devez posséder « Waking the Tiger », fabriquer 50 unités de ce type d'équipement, après quoi cette option devrait apparaître dans le menu des capacités§!"
