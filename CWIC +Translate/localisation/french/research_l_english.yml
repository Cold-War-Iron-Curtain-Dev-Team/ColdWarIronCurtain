 encryption_tech:0 "Méthodes de chiffrement"
 decryption_tech:0 "Méthodes de déchiffrement"
 computing_tech:0 "Technologies de l'information"
 radar_tech:0 "Technologie RADAR"
 radio_detection:0 "Détection par radio"
 radio_detection_desc:0 "Le RADAR (Détection et Télémétrie par Radio) utilise les ondes pour traquer l'ennemi, un secret jalousement gardé dans cette guerre des ombres."
 decimetric_radar:0 "Radar décimétrique"
 decimetric_radar_desc:0 "De nombreuses unités comptent sur l’élément surprise pour leur efficacité. Le développement du radar décimétrique nous permet de les priver de cet avantage."
 improved_decimetric_radar:0 "Radar décimétrique amélioré"
 improved_decimetric_radar_desc:0 "L'utilisation du radar s'est déjà avérée cruciale, mais nos radars décimétriques sont trop peu nombreux pour assurer une bonne couverture. En équipant davantage d'unités de radars, nous pourrons maximiser notre avance technologique."
 centimetric_radar:0 "Radar centimétrique"
 centimetric_radar_desc:0 "Les nouveaux radars fonctionnant dans les bandes des micro-ondes nous permettent de détecter des objets trop petits pour être repérés par les radars précédents."
 improved_centimetric_radar:0 "Radar centimétrique amélioré"
 improved_centimetric_radar_desc:0 "L’introduction de techniques radar de pointe, comme les radars monopulse, dans des opérations clés permettra une précision de suivi extrême."
 advanced_centimetric_radar:0 "Radar centimétrique avancé"
 advanced_centimetric_radar_desc:0 "Malgré nos radars perfectionnés, l'ennemi dispose encore de moyens pour éviter la détection. De nouveaux développements tels que le radar à effet Doppler nous permettent d'éliminer un grand nombre de ces limitations dans notre équipement."
 mechanical_computing:0 "Calcul mécaniques"
 mechanical_computing_desc:0 "Construire des machines capables d’analyses différentielles avancées changera radicalement le type de calculs assistés par machine."
 computing_machine:0 "Machine informatique"
 computing_machine_desc:0 "Le développement d’une base théorique pour les ordinateurs modernes et la construction de machines électromécaniques pour commencer à les mettre en pratique seront les premiers pas dans ce domaine des possibilités."
 improved_computing_machine:0 "Machine informatique amélioré"
 improved_computing_machine_desc:0 "Les ordinateurs numériques électroniques peuvent désormais être fabriqués et programmés. Bien qu'ils soient encore coûteux et volumineux, ces machines permettent une analyse de renseignement bien au-delà des capacités humaines."
 advanced_computing_machine:0 "Machine informatique avancé"
 advanced_computing_machine_desc:0 "Commencer à travailler sur des ordinateurs capables de stocker des programmes et faire usage de transistors nous mettra sur le chemin d’une révolution numérique où ces machines peuvent être utilisées dans presque tous les domaines."
 basic_encryption:1 "Cryptage - codes polyalphabétiques"
 basic_encryption_desc:0 "Les nouvelles méthodes de communication s'accompagnent de nouveaux risques d'interception. Les machines de chiffrement à rotors permettent un cryptage aussi rapide que complexe."
 improved_encryption:1 "Cryptage - Permutations cycliques"
 improved_encryption_desc:0 "La limitation de la randomisation des machines de chiffrement peut être exploitée pour déchiffrer les codes. En améliorant la randomisation de la mécanique du rotor, nous pouvons rendre ce type de cryptanalyse plus difficile."
 advanced_encryption:1 "Cryptage - Modulation d'impulsion codée"
 advanced_encryption_desc:0 "Les améliorations technologiques et l'expérience que nous avons acquise nous permettent de renforcer la confidentialité de nos communications."
 basic_decryption:1 "Décryptage - Analyse de fréquence"
 basic_decryption_desc:0 "La cryptanalyse devient de plus en plus une science mathématique avancée. Des systèmes comme les catalogues de cartes et des dispositifs comme les cyclomètres peuvent aider au travail nécessaire."
 improved_decryption:1 "Décryptage - Attaque par canal auxiliaire"
 improved_decryption_desc:0 "Le développement d’ordinateurs plus sophistiqués permet de nouvelles applications de méthodes de cryptanalyse comme la différenciation, qui peuvent être utilisées pour casser des cyphers avancés lorsqu’elles sont combinées avec de nouvelles méthodes de codage."
 advanced_decryption:1 "Décryptage - Déduction automatisée"
 advanced_decryption_desc:0 "La puissance de calcul accrue qui a amélioré notre cryptanalyse jusqu’à présent menace de créer des chiffrements presque incassables dans le futur. Pour garder une longueur d’avance, nous devons être prêts à travailler de façon plus agressive afin d’obtenir des renseignements sur la technologie.."
 transistor_tech:0 "Architecture des transistors"
 supercomputer_tech:0 "Supercalcul"
 hardware_tech:0 "Matériel informatique"
 software_tech:0 "Logiciels"
 interwebs_tech:0 "Technologies de l'information"
 consumer_electronics:0 "Électronique grand public"
 commercial_electronics:0 "Équipements électroniques pour les commerces et les bureaux"
 ww_pc:0 "Les ordinateurs de la Seconde Guerre mondiale"
 ww_pc_desc:0 "Avant et pendant la Seconde Guerre mondiale, de nombreuses inventions précurseurs de l'informatique ont vu le jour. Les calculateurs mécaniques ont cédé la place à des machines de calcul électroniques utilisant des tubes à vide. Ces ordinateurs pouvaient effectuer des tâches répétitives et simples afin de faciliter le travail des chercheurs et des ingénieurs. Bien que dotés d'une puissance de calcul très limitée et capables d'effectuer uniquement des tâches simples, ces ordinateurs ont constitué des étapes cruciales dans l'évolution de la société et de la technologie."
 radio:0 "Radios de la Seconde Guerre mondiale"
 radio_desc:0 "Une radio est un appareil qui utilise des ondes électromagnétiques pour transmettre et recevoir des données à travers l'espace. Lorsque des ondes radio frappent un conducteur électrique, un courant alternatif s'y crée. Ce courant peut être détecté et converti en données exploitables. Les informations contenues dans les ondes peuvent être extraites de ce courant et converties. L'utilisation de radios permet la transmission d'informations par voie hertzienne et facilite la communication à distance. De plus, différentes modulations basées sur l'amplitude, l'angle, la fréquence ou la phase peuvent être détectées sur différents canaux, ce qui permet à plusieurs radios d'utiliser le même espace hertzien pour transmettre des informations."
 egg_desc:0 "Réalisé par Polarace, Schorle, Theodore et Starfoth"
 hardware_I:0 "Écriture magnétique / Mémoire précoce"
 hardware_II:0 "Mémoire à noyau magnétique"
 hardware_III:0 "Les premiers disques durs"
 hardware_IV:0 "Périphériques informatiques de base"
 hardware_V:0 "Systèmes informatiques généraux améliorés"
 hardware_VI:0 "Mémoire vive"
 hardware_VII:0 "Auxiliaires modernes"
 hardware_VIII:0 "Stockage optique numérique des données"
 hardware_IX:0 "Modularité des composants"
 hardware_X:0 "Disque dur avancé"
 hardware_XI:0 "Processeur graphique"
 hardware_XII:0 "Auxiliaires avancés"
 hardware_XIII:0 "Stockage flash (SSD)"
 hardware_XIV:0 "NVM Express"
 hardware_XV:0 "Unité de commande centrale (CCU)"
 hardware_XVI:0 "Puces empilées (empilement de puces)"
 hardware_I_desc:0 "L'écriture magnétique est un élément essentiel de la mémoire à noyau magnétique. Elle consiste à utiliser un aimant mobile pour inverser la polarité des éléments magnétisés d'un support magnétique afin de créer une mémoire non volatile. Les premières mémoires magnétiques n'étaient pas jugées commercialement viables en raison de leur très faible capacité et de la vitesse à laquelle le pôle magnétique devait se déplacer sur le disque."
 hardware_II_desc:0 "La mémoire à tores magnétiques compte parmi les premières formes de mémoire vive (RAM). Elle utilise de minuscules anneaux magnétiques sur lesquels sont enroulés un nombre considérable de fils pour lire et écrire des informations. Chaque anneau pouvait contenir un bit d'information et était magnétisé dans un sens ou dans l'autre pour stocker un 1 ou un 0. Cela permettait le stockage temporaire de données pour un accès et une modification extrêmement rapides, tout comme la RAM est utilisée aujourd'hui. Elle ne peut pas être utilisée comme support de stockage général car elle est extrêmement encombrante par rapport aux périphériques de stockage et également beaucoup plus coûteuse au bit, tout comme la RAM d'aujourd'hui."
 hardware_III_desc:0 "Inventé par IBM en 1956, le disque dur (HDD) s'est rapidement imposé comme le principal support de stockage de données numériques. Le disque dur (HDD) est un support de stockage qui utilise la technologie magnétique pour lire et écrire des données numériques. Il se compose d'un plateau recouvert d'un matériau magnétique qui tourne à grande vitesse. Des têtes magnétiques permettent de modifier et de lire les données stockées sur le plateau pendant sa rotation. Les disques durs peuvent stocker un volume de données bien supérieur à celui des anciens supports de stockage numériques."
 hardware_IV_desc:0 "Les périphériques informatiques sont des éléments tels que le clavier, la souris, l'écran, etc. Ces périphériques existaient déjà sous une forme rudimentaire avant que l'on se penche sur la question. À mesure que les ordinateurs deviennent de plus en plus petits, on arrive à un stade où les périphériques de base prennent une importance croissante. Ces ordinateurs prennent en charge les écrans dynamiques, sont équipés de claviers améliorés et normalisés, et disposent d'un meilleur équipement audio pour la modification et la lecture des données sonores. Ces périphériques ouvrent la voie à de nouvelles applications informatiques."
 hardware_V_desc:0 "Si la création de nouveaux types de matériel informatique accroît la polyvalence d'un ordinateur, il est également nécessaire d'optimiser les systèmes existants. La rationalisation de la conception et des pilotes de composants tels que la carte mère ou la carte son améliore les performances de tous les autres systèmes qui les entourent et leur permet d'atteindre de nouveaux sommets."
 hardware_VI_desc:0 "La mémoire vive (RAM) est un type de support de stockage qui offre des vitesses de lecture et d'écriture extrêmement élevées et qui sert à l'exécution des programmes. Sans la RAM, les programmes fonctionneraient beaucoup plus lentement et pourraient ne pas permettre la lecture ou l'écriture des données dans le même laps de temps, compte tenu de l'emplacement physique de ces dernières. La RAM contient des circuits de multiplexage et de démultiplexage (circuits combinant plusieurs signaux numériques en un seul signal partagé) pour relier les lignes de données à la mémoire adressée et permettre aux programmes d'accéder facilement aux données et de les modifier."
 hardware_VII_desc:0 "Les périphériques informatiques modernes, tels que le clavier mécanique optimisé ou la souris à trackball optimisée, sont conçus pour être exactement cela : des versions optimisées de la génération précédente de périphériques. Offrant une meilleure qualité sonore et une utilisation simple et intuitive, ces périphériques améliorent la productivité et les rendent plus accessibles au grand public. De plus, l'amélioration des périphériques ouvre la voie aux disques de stockage amovibles compacts."
 hardware_VIII_desc:0 "Le stockage optique numérique est une technique de stockage de données qui utilise des lasers pour enregistrer et extraire des données à partir de supports optiques. Ces lasers émettent des faisceaux de faible puissance permettant de lire et d'écrire des données sur un support optique ; ils rendent possible la création de supports tels que les CD, qui peuvent stocker bien plus de données qu'une disquette et offrent une plus grande capacité de transfert de données."
 hardware_IX_desc:0 "La modularité des composants désigne la normalisation des connexions et des communications au sein d'un système, permettant ainsi à des composants provenant de différents fabricants ou concepteurs de fonctionner ensemble. La modularité des composants permet non seulement à des pièces conçues par différents fabricants de fonctionner ensemble, mais elle offre également une plus grande flexibilité et facilite le remplacement et la mise à niveau des composants informatiques sans qu'il soit nécessaire de remplacer l'ensemble du système informatique."
 hardware_X_desc:0 "Ce disque dur de pointe utilise des têtes magnétorésistives à couche mince sur des disques durs de 2,5 pouces résistants aux chocs, capables d'atteindre environ 7 200 tours par minute et de stocker plusieurs Go sur un seul disque. Ce disque dur de pointe est plus fiable et offre une capacité de stockage nettement supérieure à celle des modèles précédents, ce qui élargit considérablement son champ d'application dans les secteurs commercial et industriel."
 hardware_XI_desc:0 "Le processeur graphique (GPU) est un processeur informatique spécialisé dans les calculs mathématiques rapides, destiné au rendu d'images et à la décharge du processeur central (CPU) des tâches gourmandes en ressources graphiques, telles que la CAO, afin de libérer la puissance de traitement de ce dernier. Le GPU fonctionne en effet comme un processeur supplémentaire, dédié à une tâche spécifique et optimisé pour un usage unique, doté d'une architecture de traitement parallèle lui permettant d'effectuer plusieurs calculs simultanément. Le CPU, en revanche, nécessite plusieurs processeurs pour effectuer des calculs en parallèle, mais dispose d'une vitesse d'horloge supérieure à celle du GPU."
 hardware_XII_desc:0 "Les périphériques modernes, tels que les claviers à profil bas, la souris optique, la tablette graphique ou les systèmes de son surround, sont conçus pour être ergonomiques et réactifs. Ils peuvent également être dotés de fonctionnalités personnalisables, comme des boutons de souris supplémentaires configurables. Le développement de ces périphériques permettra d'améliorer la productivité et d'effectuer des tâches avec une plus grande précision dans les secteurs de l'industrie, du commerce, de l'armée et de la consommation."
 hardware_XIII_desc:0 "Le stockage flash (SSD) est un type de support de stockage optique qui ne comporte aucune pièce mobile. Les SSD utilisent de la mémoire flash pour stocker les données sous forme de petites unités appelées « blocs », enregistrées sur une puce de mémoire flash. Le stockage flash est nettement supérieur au stockage sur disque, car il est plus fiable en raison de l'absence de pièces mobiles et offre des vitesses de lecture/écriture nettement supérieures à celles d'un disque dur. De plus, les dispositifs de stockage flash sont bien plus compacts et consomment moins d'énergie. Les SSD sont particulièrement utiles à des fins militaires, car ils offrent une meilleure protection des données, sont moins sensibles aux dommages liés aux mouvements, permettent un accès plus rapide aux données et sont plus économes en énergie."
 hardware_XIV_desc:0 "Interface de contrôleur hôte pour mémoire non volatile"
 hardware_XV_desc:0 ""
 hardware_XVI_desc:0 ""
 hardware_stfu_tt:0 "§YDébloque davantage de types d'armes§!"
 software_I:0 "Les débuts de la théorie informatique"
 software_II:0 "Langages de programmation binaires"
 software_III:0 "Langages de programmation de haut niveau"
 software_IV:0 "L'algorithme de tri rapide"
 software_V:0 "Réseau à commutation de paquets"
 software_VI:0 "Dynamique des fluides computationnelle"
 software_VII:0 "Supercalcul massivement parallèle"
 software_VIII:0 "Système d'exploitation à architecture ouverte"
 software_IX:0 "Logiciel de CAO"
 software_X:0 "Informatique 64 bits"
 software_XI:0 "Multithreading"
 software_XII:0 "Logiciel de logistique militaire"
 software_XIII:0 "Logiciel de débogage de 3e génération"
 software_XIV:0 "Informatique en Cloud"
 software_XV:0 "Systèmes d'intelligence artificielle"
 software_XVI:0 "Haut-parleurs à haut rendement"
 software_I_desc:0 "Si l'informatique mécanique a sans doute joué un rôle important à ses débuts en aidant les chercheurs et les ingénieurs avant et pendant la Seconde Guerre mondiale, les besoins complexes d'un monde en pleine expansion ont rendu nécessaire le développement d'ordinateurs capables d'aller au-delà de ce que permettaient les engrenages et les calculs prédéfinis. Les premières théories informatiques ont conduit à la mise au point des premiers ordinateurs électroniques, qui remplissaient plus ou moins le même rôle et offraient des capacités similaires à celles des ordinateurs mécaniques, mais d'une manière qui leur permettait d'accomplir des tâches bien plus vastes et qui a donné naissance aux premiers grands ordinateurs."
 software_II_desc:0 "La programmation prédéfinie des premiers ordinateurs laissait beaucoup à désirer et ne permettait à ces derniers d'effectuer que des tâches très spécifiques à l'aide de programmes élaborés de haute en main. Les langages de programmation binaires ont permis aux ordinateurs d'effectuer une gamme de tâches bien plus large et ont également rendu l'informatique plus accessible."
 software_III_desc:0 "Un langage de programmation de haut niveau est un langage qui fait abstraction des détails binaires du traitement informatique proprement dit. Il interprète le langage naturel (par exemple, « add_research_slot = 50 ») et le transforme en un élément pouvant être traité. Cela permet de le programmer à un niveau global, sans avoir à attribuer individuellement des éléments non abstraits pour traiter les données."
 software_IV_desc:0 "L'algorithme de tri rapide (quicksort) est un algorithme de tri efficace mis au point par Tony Hoare en 1959, qui organise systématiquement les éléments dans un tableau. Il est utilisé pour trier des données sur un ordinateur et a surpassé les algorithmes de tri antérieurs, tels que le tri par fusion et le tri par tas. Le tri est un processus extrêmement courant dans les logiciels informatiques ; il doit donc être très efficace, car un algorithme de tri mal conçu peut entraîner des charges de traitement inutilement lourdes. Le tri rapide est encore utilisé aujourd'hui parce qu'il est tout simplement très performant."
 software_V_desc:0 "La commutation par paquets est une méthode qui consiste à regrouper des données numériques et à les transmettre sur un réseau numérique. Ces paquets sont précédés d'un en-tête, tandis que les données proprement dites se trouvent dans la charge utile qui suit l'en-tête. L'en-tête permet aux paquets de circuler sur le réseau en fonction des informations qu'il contient. Cela permet aux données de circuler sur des réseaux très complexes, où il existe de multiples hôtes à atteindre et différents nœuds de données entre lesquels elles doivent transiter. Cependant, certains problèmes, tels que la perte de paquets, affectent les réseaux à commutation par paquets. La transmission sans fil (non disponible au moment de la rédaction de cet article) et la congestion du réseau peuvent empêcher les paquets d'atteindre leur destination et entraîner leur perte. Le protocole de contrôle de transmission (TCP) est un protocole Internet qui garantit un transfert précis des données et détecte les pertes de paquets afin de pouvoir réessayer ou corriger les erreurs."
 software_VI_desc:0 "La dynamique des fluides computationnelle (CFD) est une branche de la mécanique des fluides qui utilise l'analyse numérique pour résoudre des problèmes liés à l'écoulement des fluides. Ce logiciel permet aux ordinateurs de simuler l'écoulement en régime libre des liquides et des gaz. Ce logiciel extrêmement complexe tire largement parti de la puissance des ordinateurs et permet aux ingénieurs de simuler de nombreux problèmes différents liés à l'aérodynamique, aux fluides, à la météorologie, etc. Les problèmes de CFD reposent essentiellement sur les équations de Navier-Stokes, qui définissent les écoulements de fluides monophasiques."
 software_VII_desc:0 "Finalement, la mise au point de supercalculateurs modulaires à grande échelle et massivement parallèles est devenue possible. Grâce à des améliorations de conception, à de meilleurs domaines administratifs et à des protocoles internes optimisés, les supercalculateurs massivement parallèles ont pu atteindre des dimensions colossales. Ces supercalculateurs permettent de stocker ou de sauvegarder davantage de données qu’auparavant, et de traiter des volumes plus importants que les premiers modèles. Étant donné qu’ils concentrent une valeur et des fonctionnalités considérables dans un espace restreint, ces supercalculateurs sont généralement conservés sous haute sécurité dans des installations souterraines, et seul un personnel rigoureusement sélectionné est autorisé à y travailler physiquement."
 software_VIII_desc:0 "L'architecture ouverte est un type d'architecture logicielle qui facilite l'échange, l'installation et la mise à jour des logiciels. Un système informatique domestique doté d'une architecture ouverte permet à un grand nombre de systèmes de s'adapter librement à tout nouveau type de logiciel pouvant être développé sur son système d'exploitation."
 software_IX_desc:0 "La conception assistée par ordinateur (CAO) consiste à utiliser des systèmes informatiques pour faciliter la création d'un projet. Les logiciels de CAO simplifient considérablement la conception et améliorent nettement la productivité et la qualité. Ils peuvent également fournir des bases de données facilement accessibles, des outils de communication, des macros et d'autres boîtes à outils pour faciliter davantage le processus de conception. Les logiciels de CAO peuvent être utilisés pour concevoir de nombreux éléments, notamment des machines, des structures architecturales, des composants électroniques, etc. Associée à la fabrication assistée par ordinateur, la CAO permet aux machines de réaliser directement les conceptions avec une précision et une efficacité extrêmes."
 software_X_desc:0 "L'informatique 64 bits désigne l'utilisation d'une architecture 64 bits dans les ordinateurs. Chaque 1 ou 0 en langage binaire occupe 1 bit. Dans une architecture 64 bits, 64 bits sont regroupés en une seule adresse mémoire, qui correspond à un emplacement mémoire spécifique utilisé tant au niveau logiciel que matériel. Ce qui rend le 64 bits particulier, c'est que les ordinateurs 64 bits ont une limite d'entiers de 9 223 372 036 854 775 807, alors que les systèmes 32 bits sont plafonnés à environ 2,147 milliards. Cela permet à un système de stocker et de traiter un nombre de variables bien plus important qu'auparavant. Il existe aujourd'hui des programmes plus simples qui utilisent encore le 32 bits, mais de nombreux logiciels doivent recourir à l'architecture 64 bits en raison de leur grande complexité."
 software_XI_desc:0 "Le multithreading désigne la capacité d'un processeur à exécuter simultanément plusieurs threads. Le multithreading a permis d'augmenter le taux d'utilisation d'un seul cœur grâce au parallélisme au niveau des threads et au parallélisme au niveau des instructions. Cela permet une plus grande flexibilité en multitâche, que l'on utilise un seul cœur ou plusieurs cœurs.\nBien que le multithreading simultané existe depuis 1968 et ait été déployé quelques années plus tard, cette technologie représente l'optimisation des protocoles de multithreading et l'introduction de protocoles visant à protéger contre le partage de ressources matérielles, telles que les caches, par plusieurs threads, tout en offrant un haut niveau d'efficacité."
 software_XII_desc:0 "Le développement de logiciels de logistique militaire allège considérablement la charge de travail de l'état-major général et permet d'améliorer la fiabilité des grands réseaux logistiques militaires ainsi que l'organisation de chaînes d'approvisionnement complexes à très grande échelle. Ces logiciels permettent aux responsables de l'approvisionnement de passer des commandes par voie numérique et améliorent la communication au sein de réseaux complexes. De plus, ils facilitent le triage et la hiérarchisation des approvisionnements, tout en aidant à détecter automatiquement les anomalies dans les chaînes d'approvisionnement."
 software_XIII_desc:0 "La troisième génération de logiciels de débogage présente de nombreuses améliorations par rapport aux générations précédentes. Elle offre notamment plusieurs avantages, parmi lesquels l'évaluation de l'optimisation et le débogage proactif de la mémoire, qui permettent de détecter activement les bogues liés à la corruption de la mémoire et d'identifier les processus consommant des quantités anormales de ressources système. Ce logiciel ouvrira la voie au développement de programmes bien plus complexes et facilitera considérablement le développement logiciel."
 software_XIV_desc:0 ""
 software_XV_desc:0 ""
 software_XVI_desc:0 ""
 radar_0:0 "Radar Doppler à impulsions"
 radar_I:0 "Radar monopulse"
 radar_II:0 "Aiguisage du faisceau Doppler"
 radar_III:0 "Radar au-delà de l'horizon"
 radar_IV:0 "PESA"
 radar_V:0 "AESA"
 radar_VI:0 "RADAR à faible probabilité d'interception"
 radar_VII:0 "Technologie radar anti-brouillage"
 radar_0_desc:0 "Tout au long de la Seconde Guerre mondiale, de nombreuses avancées ont été réalisées dans le domaine du radar. Au début, le radar se contentait d’une simple détection radio, très rudimentaire et peu efficace. Ce système a finalement été perfectionné pour donner naissance au radar décimétrique, capable de détecter les avions en approche depuis une plus grande distance et avec une plus grande précision. Par la suite, la longueur d’onde du radar décimétrique a été allongée pour passer au centimétrique, afin de permettre une détection radar à longue portée. Pour allonger les ondes radar, des améliorations significatives ont été apportées à la puissance du magnétron à cavité. Le magnétron à cavité est un tube à vide de forte puissance utilisé pour générer des micro-ondes et les transformer en ondes radio. Il a été rendu plus puissant que jamais et pouvait produire des faisceaux centimétriques très puissants."
 radar_I_desc:0 "Un radar monopulse est un système radar qui code son signal radio sur différents niveaux ; ainsi, lorsque le faisceau rebondit, il fournit des données très précises en fonction de la manière dont les différentes impulsions reviennent. Comme le signal radio utilise un codage supplémentaire, il est capable d'émettre une seule impulsion pour obtenir des données précises, d'où son nom de « monopulse »."
 radar_II_desc:0 "Le « Doppler Beam Sharpening » est une méthode permettant de transformer des signaux radar en une image radar. Grâce à une ouverture synthétique, le mouvement de l'antenne radar offre une résolution spatiale plus fine que celle des radars à balayage classique. Le SAR définit un réseau 3D d'éléments de la scène à partir des échos renvoyés par le faisceau. À partir de ce réseau, le SAR exécute des algorithmes et des calculs afin de déterminer une image précise de la cible qu'il balaye."
 radar_III_desc:0 "Le radar « Over-the-Horizon » (OtH), également appelé « radar à ondes ionosphériques », est un radar qui émet un signal puissant à ondes courtes capable de franchir l'horizon en se réfléchissant sur l'ionosphère, d'atteindre le sol au-delà de l'horizon, puis de remonter vers le ciel pour revenir vers les antennes du radar. Cela permet au radar OtH de détecter des cibles situées derrière des obstacles et sur des distances extrêmement longues."
 radar_IV_desc:0 "PAVE PAWS est un système radar à réseau phasé à semi-conducteurs extrêmement sophistiqué, conçu pour détecter et caractériser les attaques de missiles balistiques. Créé à l'origine aux États-Unis pour contrer les attaques de missiles balistiques lancés depuis des sous-marins, PAVE PAWS se compose d'immenses réseaux d'éléments dipôles croisés qui offrent une couverture d'une précision exceptionnelle."
 radar_V_desc:0 "Le système AESA est conçu pour détecter, marquer et suivre les aéronefs dans une zone donnée, et pour communiquer via un vaste réseau afin d'assurer la surveillance d'une vaste zone."
 radar_VI_desc:0 ""
 radar_VII_desc:0 ""
 enc_I:0 "Système de cryptage électronique"
 enc_II:0 "Système de cryptage électronique amélioré"
 enc_III:0 "Cryptage DES 56 bits"
 enc_IV:0 "Le pare-feu"
 enc_V:0 "Logiciel antivirus"
 enc_VI:0 "Systèmes de détection et de prévention des intrusions"
 enc_VII:0 "Proxys"
 enc_VIII:0 "Cryptage résistant à l'informatique quantique"
 enc_IX:0 "Active Self-Defense Algorithms"
 enc_IX_short:0 "Algorithmes ASD"
 enc_I_desc:0 "Avec l'avènement des communications électroniques, il a toujours été nécessaire de crypter et de décrypter les messages par voie électronique. Le premier système de cryptage électronique, le KW-26, a ainsi vu le jour. Il utilisait plus de 800 noyaux magnétiques et 50 circuits d'attaque à tubes à vide pour générer des messages cryptés à l'aide d'une logique à noyaux magnétiques. Ce système de cryptage numérique lui a permis de produire des messages plus cryptés que jamais."
 enc_II_desc:0 "Afin d'améliorer la sécurité du cryptage des informations, il convient d'apporter de nombreuses améliorations au système de cryptage électronique. Il faut ajouter davantage de combinaisons pour éviter que la machine n'utilise plusieurs fois la même carte. Il faut également prendre davantage de mesures pour empêcher l'accès à la machine. Enfin, il faut ajouter davantage de couches aux messages cryptés."
 enc_III_desc:0 "Le DES est la première norme publique de chiffrement jamais créée. Il a été mis au point en 1975 par IBM. Le DES est un algorithme à clé symétrique, ce qui signifie qu'il utilise la même clé pour le chiffrement et le déchiffrement. Tant que la clé reste secrète entre les deux parties, le chiffrement est hautement sécurisé. Si la clé est devinée à la suite d'une attaque par force brute longue et fastidieuse, ou si elle est rapidement volée par un logiciel malveillant, les messages peuvent alors être déchiffrés. Le DES est hautement sécurisé contre l'analyse différentielle, car les clés de chiffrement sont secrètes et uniques, mais il est vulnérable au craquage par force brute."
 enc_IV_desc:0 "Un pare-feu est un système de sécurité réseau qui surveille et contrôle le trafic réseau entrant et sortant en fonction de règles de sécurité. Les pare-feu permettent d'empêcher efficacement les logiciels malveillants ayant infecté un système d'envoyer des informations vers l'extérieur, ou d'empêcher tout accès non autorisé au système."
 enc_V_desc:0 "L'apparition des logiciels malveillants rend nécessaire une approche dynamique pour se prémunir contre les vulnérabilités générales. Bien que les vulnérabilités puissent être corrigées, la guerre sans fin qui oppose les vulnérabilités aux exploits place les systèmes de chiffrement dans une situation très défavorable. Les antivirus dynamiques sont conçus pour bloquer directement les signatures de logiciels malveillants connus ou pour bloquer de manière heuristique les activités suspectes des logiciels. Cela permet aux systèmes de défense de garder une longueur d'avance sur les menaces en développant des antivirus et des anti-malwares plus avancés."
 enc_VI_desc:0 "Il ne suffit pas de se contenter de lutter de manière réactive contre les virus et les signatures malveillantes connues. À mesure que les logiciels se généralisent et que le monde devient de plus en plus interconnecté, les dangers ne cessent de croître. Les logiciels anti-malware heuristiques adoptent une approche proactive : ils peuvent détecter les activités malveillantes sur un ordinateur et réagir aux failles de sécurité sans avoir connaissance au préalable des fonctions du programme malveillant."
 enc_VII_desc:0 ""
 enc_VIII_desc:0 "NEIGE"
 decryption_I:0 "Décryptage électronique"
 decryption_II:0 "Analyse différentielle"
 decryption_III:0 "Décryptage par force brute"
 decryption_IV:0 "Piratage à distance"
 decryption_V:0 "Logiciels malveillants/logiciels espions"
 decryption_VI:0 "Kits d'exploitation"
 decryption_VII:0 "Syn Flood"
 decryption_VIII:0 "Décryptage quantique"
 decryption_IX:0 "Algorithmes actifs de détection des violations de sécurité"
 decryption_IX_short:0 "Algorithmes de détection des anomalies (ADL)"
 decryption_I_desc:0 "Si les premiers systèmes de chiffrement électronique étaient plus complexes que jamais, ils pouvaient néanmoins être contournés. Si une clé était réutilisée, les deux messages chiffrés pouvaient alors être comparés et déchiffrés en déduisant automatiquement la logique de la machine grâce à une attaque par clé réutilisée. Le « bit-flipping » est une autre technique d'attaque qui repose sur la connaissance préalable d'une partie du message. Si les messages chiffrés respectent un certain format, il est alors facile d'utiliser les informations connues comme base."
 decryption_II_desc:0 "La cryptanalyse différentielle est une méthode d'attaque qui consiste à exploiter les paires de texte en clair et de texte chiffré dans un système cryptographique afin de découvrir une clé. Cela nécessite d'avoir accès aux données d'entrée et de sortie, tant en texte en clair qu'en texte chiffré. En introduisant divers messages et en les comparant au texte chiffré, il est possible de découvrir la clé de chiffrement et de l'utiliser pour déchiffrer les informations ciblées."
 decryption_III_desc:0 "La force brute, comme son nom l'indique, est une méthode de décryptage extrêmement simple et directe. En testant simplement toutes les solutions ou clés possibles jusqu'à ce qu'une solution soit trouvée, grâce à une puissance de calcul considérable, un message chiffré peut être déchiffré. Elle peut être utilisée sur pratiquement tous les systèmes de chiffrement, à condition de disposer d'une puissance de calcul suffisante. Cependant, à mesure que le chiffrement gagne en sophistication, cette méthode peut finir par devenir irréalisable, car des niveaux de chiffrement plus élevés peuvent nécessiter une puissance de calcul supérieure à celle dont on dispose raisonnablement."
 decryption_IV_desc:0 "Le piratage informatique revêt de nombreuses définitions, mais dans le présent contexte, il désigne l'accès non autorisé à un système informatique par le biais de logiciels. L'accès à distance à des systèmes, obtenu en exploitant des failles dans les logiciels, peut permettre à un pirate informatique de compromettre un réseau et d'accéder à des données, de les détruire ou de les manipuler au sein d'un réseau protégé."
 decryption_V_desc:0 "Un logiciel malveillant est tout programme conçu dans une intention malveillante, tandis qu'un logiciel espion est tout programme qui recueille des informations à l'insu de l'utilisateur. \nBien qu'il soit utile de tenter de recueillir des informations à distance en déchiffrant des messages, cette méthode devient irréalisable en raison des progrès considérables de la cryptographie moderne. Il est donc préférable de prendre des mesures pour exploiter à distance les failles des logiciels afin d'accéder directement aux informations non chiffrées. De plus, la création de logiciels malveillants ou de logiciels espions destinés à infecter un hôte via des vulnérabilités ou des pièges peut ouvrir des portes dérobées."
 decryption_VI_desc:0 "Un kit d'exploitation est un ensemble d'exploits ciblant des vulnérabilités, regroupés dans un vaste catalogue faisant office de référentiel. Les kits d'exploitation contiennent un nombre considérable d'exploits pour pratiquement toutes les vulnérabilités de pratiquement toutes les versions de pratiquement tous les logiciels visés par leur créateur. Cela permet à un créateur de logiciels malveillants ou à un pirate informatique de créer simplement le logiciel malveillant de son choix et d'y associer un exploit fonctionnel. Il suffit au créateur de logiciels malveillants de connaître le logiciel et les versions d'un logiciel utilisés par un ordinateur cible pour pouvoir parcourir le kit d'exploitation. Si les créateurs du kit d'exploitation ont découvert une vulnérabilité et créé l'exploit, le créateur de logiciels malveillants n'a plus qu'à l'intégrer et à y exposer l'ordinateur cible. Les kits détenus par des gouvernements peuvent garder les vulnérabilités secrètes pendant des années jusqu'à ce qu'ils souhaitent lancer une attaque massive."
 decryption_VII_desc:0 ""
 decryption_VIII_desc:0 ""
