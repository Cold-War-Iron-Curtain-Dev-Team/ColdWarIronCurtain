 consumer_electronics_I:0 "Électronique grand public de base"
 consumer_electronics_II:0 "Télévision couleur"
 consumer_electronics_III:0 "Ordinateurs personnels"
 consumer_electronics_IV:0 "Électronique grand public moderne"
 consumer_electronics_V:0 "Électronique grand public de pointe"
 consumer_electronics_VI:0 "Smartphones"
 consumer_electronics_VII:0 "Information Age CE"
 consumer_electronics_VIII:0 "Électronique grand public ergonomique"
 consumer_electronics_X:0 "Robots de la gamme XX Corp"
 consumer_electronics_I_desc:0 "L'électronique grand public de base désigne le déploiement à grande échelle des premiers systèmes électroniques destinés aux consommateurs, tant professionnels que particuliers. Ces appareils électroniques de base contribuent non seulement à améliorer la qualité de vie, mais ouvrent également la voie à une société globalement plus productive. Parmi les premières applications commerciales, on peut citer les téléviseurs de meilleure qualité, les appareils de calcul financier destinés aux entreprises, ainsi que d'innombrables systèmes électroniques de base qui favorisent la productivité des entreprises et la qualité de vie des particuliers."
 consumer_electronics_III_desc:0 "Les ordinateurs personnels comptent parmi les avancées les plus importantes de l'histoire. Ils sont extrêmement utiles dans tous les domaines. Le développement d'ordinateurs personnels destinés à un usage commercial et privé constitue un immense atout pour la société. Sur le plan commercial, les ordinateurs personnels ont révolutionné la logistique commerciale, la productivité des bureaux et des services financiers, la planification d'entreprise, la communication et la conclusion d'accords, et bien d'autres domaines encore. De plus, ils ont révolutionné l'éducation et la médecine, contribuant ainsi à une meilleure qualité de vie."
 consumer_electronics_IV_desc:0 "L'électronique grand public moderne marque le début d'une nouvelle ère dans laquelle la polyvalence et les possibilités d'application de l'électronique deviennent universelles. À ce stade, l'électronique grand public peut être utilisée pour pratiquement tous les usages. Cette technologie se traduit par le développement de logiciels et d'ordinateurs pouvant servir à toutes fins et dans pratiquement toutes les entreprises et institutions. C'est à ce stade que les ordinateurs personnels sont utilisés partout dans la société (à condition que celle-ci en ait les moyens)."
 consumer_electronics_V_desc:0 "L'électronique grand public avancée marque le début d'une ère où l'accessibilité financière des appareils électroniques permet à pratiquement tous les foyers des pays développés de posséder un ordinateur. C'est à ce stade que l'électronique devient omniprésente grâce à son accessibilité. De plus, les nombreuses améliorations apportées aux applications et aux systèmes existants permettent d'utiliser ces ordinateurs dans un éventail plus large de domaines."
 consumer_electronics_VI_desc:0 "L'ère de l'information dans le domaine de l'électronique grand public correspond à une période où les appareils électroniques ne cessent de gagner en ergonomie et trouvent des applications novatrices. C'est à ce stade que les systèmes informatiques deviennent plus conviviaux que jamais et ouvrent la voie à des améliorations significatives de la qualité de vie. Au cours de la prochaine décennie, l'électronique grand public se montrera exploratoire et innovante, s'efforçant de résoudre des problèmes dont les gens ignoraient l'existence et de répondre à des besoins dont ils ne soupçonnaient pas l'existence. Des smartphones aux services de streaming, l'électronique grand public de 2000 à 2010 marquera le véritable début de l'ère de l'information."
 consumer_electronics_X_desc:0 "XX Inc., le fabricant de Little Helper, est réputé pour ses produits robotiques. Avec son blanc immaculé, ses lignes épurées et ses pattes courtes mais efficaces, Little Helper a été conçu pour aider les gens ! Little Helper intègre de nombreuses fonctionnalités. Des alarmes anti-effraction et d’un système de surveillance domestique à la préparation du café et au contrôle de l’éclairage, il offre tout ce dont un foyer a besoin ! Si Little Helper était capable d’éprouver des émotions, il serait sans doute très fier de pouvoir aider les gens."
 consumer_electronics_stfu_tt:0 "§G+15%§! de revenus des §YParc d'affaires§!"
 coms_I:0 "Les lignes fixes modernes"
 coms_II:0 "Communications par satellite"
 coms_III:0 "Dialup"
 coms_IV:0 "2G"
 coms_V:0 "3G"
 coms_VI:0 "4G (Évolution à long terme)"
 coms_VII:0 "LTE Avancé"
 coms_VIII:0 "5G"
 coms_I_desc:0 "Les téléphones ont connu des améliorations considérables depuis leur invention par Alexander Graham Bell dans les années 1870. En 1878, le premier central téléphonique commercial a ouvert ses portes aux États-Unis. En 1915, le premier appel téléphonique intercontinental d'un bout à l'autre du pays a été passé. Dans les années 1930 et 1940, l'utilisation du téléphone était devenue courante dans l'ensemble du monde développé et s'était généralisée. Peu après la guerre, les téléphones avaient atteint un niveau tel que pratiquement tout le monde pouvait passer un appel direct à n'importe qui d'autre, et le téléphone était très largement accessible. Au début des années 50, les téléphones étaient plus fiables et permettaient de communiquer plus rapidement que jamais."
 coms_II_desc:0 "Au début des années 60, le premier programme spatial financé par le secteur privé a vu le jour. Ce programme, soutenu par AT&T, les Laboratoires Bell Telephone et les PTT français, avait pour objectif de mettre en place le premier réseau de communication par satellite. Le 22 novembre 1963, le Relay 1 de la NASA a transmis le premier signal transpacifique. Il a fallu des années pour que suffisamment de satellites et de relais soient construits avant qu'une utilisation commerciale à grande échelle puisse être mise en place. Cependant, l'armée, les agences de renseignement et les dirigeants d'entreprise ont été les premiers à adopter cette nouvelle technologie. Des investissements continus et une augmentation rapide du nombre d'utilisateurs ont permis au projet de communications par satellite de se poursuivre et de toucher de plus en plus de personnes."
 coms_III_desc:0 "La connexion par ligne commutée est une méthode d'accès à Internet et de transmission de données qui utilise les réseaux téléphoniques publics commutés pour établir une connexion en composant le numéro de téléphone d'un fournisseur d'accès Internet. Les données sont ensuite transmises au fournisseur d'accès Internet via la ligne téléphonique. Le modem encode et décode les informations en signaux audio afin de transmettre les données. Les connexions par modem sont très efficaces, car elles ne nécessitent que l'infrastructure du réseau téléphonique pour communiquer les informations. Le modem permet de transmettre environ 50 kb/s."
 coms_IV_desc:0 "La communication 2G correspond à la deuxième génération de technologie cellulaire. Les réseaux 2G offrent des capacités de cryptage bien plus avancées et permettent de transmettre davantage de données. La 2G a permis aux communications sans fil de devenir nettement plus efficaces que la connexion par modem, avec des débits atteignant environ 250 kb/s. Pour atteindre ces vitesses, la 2G nécessite des équipements sans fil plus performants, des protocoles sans fil hautement efficaces, et, avec la mise en œuvre ultérieure de la technologie 2G EDGE, l'encodage 8PSK et la normalisation du domaine à commutation de circuits."
 coms_V_desc:0 "La 3G est la troisième génération de technologie cellulaire. Les réseaux 3G ont une capacité de couverture bien supérieure à celle de la 2G et peuvent donc couvrir des distances plus longues. Les réseaux 3G peuvent atteindre des débits d'environ 3 Mb/s. Tout comme pour la 2G, la 3G nécessite des équipements de communication plus performants."
 coms_VI_desc:0 "La 4G est la quatrième génération de technologie cellulaire et représente une avancée majeure dans le domaine des communications, permettant notamment l'accès aux services de streaming, à l'Internet haut débit et aux réseaux intelligents. Les réseaux 4G peuvent atteindre des débits compris entre environ 12,5 et 125 Mb/s, ce qui constitue une avancée majeure pour les réseaux à haute capacité et haut débit. La Long Term Evolution (LTE) est une norme technique pour les communications sans fil à large bande qui permet d'augmenter la vitesse des communications."
 coms_VII_desc:0 ""
 coms_VIII_desc:0 ""
 ww_production:0 "Production pendant la Seconde Guerre mondiale"
 ww_production_desc:0 "Pendant la Seconde Guerre mondiale, les capacités industrielles et la productivité ont été mises à contribution pour accroître la production en temps de guerre. Des progrès majeurs ont été réalisés en matière de réseaux logistiques et d'organisation industrielle. De nombreux réseaux logistiques ont été mis en place et les liaisons de transport ont été officialisées. De nombreux pays ayant participé directement à la Seconde Guerre mondiale ont officialisé leurs liaisons de transport et se sont donné pour priorité d'éviter les goulets d'étranglement dans ce domaine."
 ww_oil:0 "La science des matériaux pendant la Seconde Guerre mondiale"
 ww_oil_desc:0 "Pendant la Seconde Guerre mondiale, l'innovation militaire a donné lieu à diverses avancées dans le domaine de la métallurgie et à la mise au point d'alliages plus performants. Les alliages d'aluminium créés à cette époque ont permis aux avions de conserver leur légèreté tout en améliorant leur résistance au combat. Le rapport acier/carbone a également été optimisé pendant la Seconde Guerre mondiale, ce qui a permis d'obtenir des matériaux de meilleure qualité. De plus, de nombreux pays ont adopté des tableaux et des données normalisés concernant les matériaux, et certains ont même été amenés à officialiser la recherche dans le domaine des matériaux."
 ww_construction:0 "Construction pendant la Seconde Guerre mondiale"
 ww_construction_desc:0 "Les contraintes liées à la Seconde Guerre mondiale ont conduit à la mise en place de diverses pratiques de gestion de chantier qui ont permis d'améliorer l'efficacité sur le terrain. L'amélioration la plus notable dans les pratiques de construction sur chantier a été la généralisation de la normalisation de nombreuses méthodes de construction ainsi que le partage à grande échelle des techniques et des engins de chantier."
 chemistry_I:0 "Spectroscopie chimique"
 chemistry_I_desc:0 "La spectroscopie est une méthode d'analyse chimique qui utilise l'infrarouge, l'imagerie électromagnétique, la spectroscopie aux rayons X ou la spectrométrie de masse afin de déterminer la composition moléculaire d'un composé spécifique et ses caractéristiques. En recourant à ces méthodes en laboratoire, on peut analyser un échantillon pour garantir la qualité d'un processus chimique industriel ou pour déterminer la composition chimique d'un produit chimique non identifié."
 chemistry_II:0 "Technique de la transformée de Fourier"
 chemistry_II_desc:0 "La technique de la transformée de Fourier est une méthode de mesure permettant de réaliser des analyses spectroscopiques. Qu'il s'agisse de mesures dans le domaine temporel ou spatial, cette méthode permet d'améliorer et de rendre plus précises toutes les formes de spectroscopie.\nLa technique de la transformée de Fourier transforme les données brutes issues d'une mesure spectroscopique en un spectre proprement dit, qui peut être analysé plus facilement."
 chemistry_III:0 "Synthèse stéréosélective"
 chemistry_III_desc:0 "La stéréochimie est une branche de la chimie organique qui traite des stéréoconfigurations au sein d'une molécule. Les stéréoconfigurations désignent les dispositions spécifiques des différents segments d'une molécule. Les différentes configurations d'une même molécule ont la même structure moléculaire et les mêmes composants, mais présentent des formes totalement différentes en raison de l'ordre différent dans lequel les liaisons complexes sont disposées."
 chemistry_IV:0 "Les fullerènes et les nanomatériaux théoriques"
 chemistry_IV_desc:0 "Le fullerène est une macromolécule composée d'atomes de carbone formant une cage creuse. Les fullerènes sont utilisés comme systèmes d'administration de médicaments dans l'organisme, comme lubrifiants ou comme catalyseurs.\nLes nanomatériaux sont des matériaux de pointe qui, en théorie, devraient être fabriqués à l'aide de la nanotechnologie. Sans recours à la nanotechnologie, ces matériaux devraient être fabriqués à un coût extrêmement élevé, mais ils n'auraient tout de même que des applications très rares dans les supercalculateurs, la recherche scientifique ou les produits de haute technologie de pointe."
 chemistry_V:0 "Nanotubes de carbone"
 chemistry_V_desc:0 "Les nanotubes de carbone, tels que le graphène, sont des tubes constitués d'atomes de carbone qui forment des macromolécules similaires aux fullerènes, mais sous forme de tubes plutôt que de cages sphériques creuses. Le graphène figure parmi les matériaux les plus résistants connus à ce jour, mais il est également très difficile à produire en grande quantité. Il est utilisé en petites quantités dans les ordinateurs de pointe, les technologies militaires et les procédés industriels de pointe pour remplir des fonctions qu'aucun autre matériau ne peut assumer."
 chemistry_VI:0 "Écrans à cristaux liquides (LCD)"
 chemistry_VI_desc:0 ""
 chemistry_VII:0 "Chimie verte"
 chemistry_VII_desc:0 ""
 industry_chemistry_tt:0 "§G+15%§! de revenus des §YUsine d'hydrométallurgie§!\n"
 plastics_I:0 "Polypropylène"
 plastics_I_desc:0 "Le polypropylène est un thermoplastique partiellement cristallin utilisé dans la fabrication de pièces mécaniques, d'emballages et de biens de consommation courante. Il s'agit d'un hydrocarbure pur, exempt de tout autre composant, obtenu par polymérisation par allongement de chaîne. Le polypropylène présente également un point de fusion plus élevé que les plastiques précédents, ce qui en fait un matériau synthétique bien plus polyvalent que les générations antérieures."
 plastics_II:0 "Kevlar"
 plastics_II_desc:0 "Le Kevlar est une fibre synthétique résistante à la chaleur, réputée pour sa grande solidité et couramment utilisée dans la fabrication de gilets pare-balles et anti-couteaux. Il présente une résistance à la traction extrêmement élevée et un faible poids, avec un rapport résistance/poids cinq fois supérieur à celui de l'acier. Il peut également être utilisé dans le domaine naval ou dans des applications grand public. Le Kevlar est synthétisé à partir de plusieurs monomères intermédiaires lors d'une réaction de condensation, qui génère de l'acide chlorhydrique comme sous-produit."
 plastics_III:0 "Polyaryletheretherketone"
 plastics_III_desc:0 "Le polyarylétheréthercétone (PEEK) est un thermoplastique organique utilisé dans le domaine de l'ingénierie. Très résistant, il est utilisé dans la fabrication de pistons, de pompes, de roulements, de plaques de compresseurs, d'isolants électriques et d'implants médicaux. Ce matériau est obtenu par polymérisation par étapes à l'aide d'un catalyseur, de 4,4'-difluorobenzophénone et d'hydroquinone. Ce procédé doit être réalisé à une température d'environ 300 °C."
 industry_plastics_III_tt:0 "La consommation des Parcs industriels est de §G-10 % £resources_strip|5 ainsi que des Parcs de bureaux qui est de §G-10 % £resources_strip|2§!"
 plastics_IV:0 "Semi-conducteurs plastiques"
 plastics_IV_desc:0 "Historiquement, les semi-conducteurs ont toujours été fabriqués à partir de matériaux fragiles à base de silicium. Cependant, les semi-conducteurs polymères peuvent constituer des supports bien plus résistants et souples pour l'électronique, tout en étant nettement moins coûteux et plus légers. Ils sont composés de polymères complexes assemblés avec précision, disposés de manière à conférer des propriétés électriques, contrairement à un simple polymère non conducteur. Ces conducteurs sont également plus efficaces et permettent ainsi de réduire la consommation énergétique globale des appareils qui les intègrent."
 plastics_V:0 "Éthylène-tétrafluoroéthylène (ETFE)"
 plastics_V_desc:0 ""
 plastics_VI:0 "Polymères biologiques (bioplastiques)"
 plastics_VI_desc:0 ""
 plastics_VII:0 "Polymères renforcés de fibres de carbone"
