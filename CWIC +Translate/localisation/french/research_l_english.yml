 excavation_I:0 "Exploitation de carrières à grande échelle"
 excavation_I_desc:0 "Vers les années 1950, de nouvelles méthodes d'extraction et de nouveaux équipements ont été mis au point pour permettre l'extraction de pierres ou de graviers dans de grandes carrières. Des engins sur chenilles et des équipements de décapage modernes ont été spécialement conçus pour permettre des extractions à grande échelle et la création de carrières de tailles modulaires. La mise en place de niveaux modulaires, conçus pour permettre aux engins de se déplacer de haut en bas des carrières à une vitesse relativement élevée, grâce à des pentes standardisées et à des systèmes logistiques internes et des relais, permet aux grandes carrières de rester efficaces."
 excavation_II:0 "Extracteurs à roue à godets"
 excavation_II_desc:0 "Les extracteurs à roue à godets sont des engins lourds utilisés dans l'exploitation minière à ciel ouvert, composés d'une roue équipée de nombreux godets qui déversent leur chargement sur une voie au fur et à mesure qu'ils creusent. Ces extracteurs ramassent en continu les matériaux à mesure que la roue tourne et sont capables de creuser des sections verticales dans une fosse. Ils sont extrêmement efficaces pour extraire ou évacuer des matériaux en vrac.\nÀ ce jour, les extracteurs à roue à godets sont les véhicules terrestres les plus lourds jamais construits."
 excavation_III:0 "Exploitation minière par décapage de sommets"
 excavation_III_desc:0 "L'exploitation minière par décapage de sommets est une méthode d'exploitation à ciel ouvert pratiquée au sommet ou sur la crête d'une montagne. En retirant les morts-terrains d'un sommet ou d'une crête, on crée une surface plane suffisamment vaste pour permettre l'exploitation vers le bas. Au fil du temps, davantage de morts-terrains sont retirés des bords des filons afin de permettre l'excavation de fosses plus profondes à partir des sommets des montagnes. Cette méthode permet l'extraction à ciel ouvert de ressources riches qui ont été remises en surface par la formation sismique des montagnes, sans qu'il soit nécessaire de creuser des puits profonds pour les exploiter."
 excavation_IV:0 "Convoyeur pour l'exploitation minière à longue taille"
 excavation_IV_desc:0 ""
