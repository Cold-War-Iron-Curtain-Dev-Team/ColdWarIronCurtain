 management_I:0 "Maintenance productive totale (TPM)"
 management_I_desc:0 "Le TPM consiste à organiser et à systématiser la maintenance de la production et l'amélioration de la qualité. Son objectif principal est de garantir le maintien de la productivité d'une unité industrielle grâce à un investissement modeste dans la maintenance et les améliorations. \nPour mettre en place un programme TPM, il est nécessaire de disposer d'équipes de maintenance dédiées et d'investir régulièrement des ressources afin d'accroître le volume de production."
 management_II:0 "Maintenance préventive"
 management_II_desc:0 "La maintenance préventive est un élément central de la gestion globale de la maintenance (TPM), dans le cadre de laquelle les opérations de maintenance et les inspections sont effectuées à l'avance, avant qu'une panne ne survienne. Grâce à l'inspection, à la détection et à la correction systématiques des défaillances pendant les heures non productives, des mesures sont prises pour éviter les pannes ou les dysfonctionnements. La mise en place d'un programme de maintenance préventive nécessite l'élaboration d'un protocole, la constitution d'équipes de maintenance spécialisées, la mise à disposition d'outils adaptés et la mise en place d'un système de formation afin de permettre aux techniciens de maintenance de détecter à l'avance les défaillances potentielles ou les signes d'usure."
 management_III_A:0 "Entretien périodique"
 management_III_A_desc:0 "La maintenance périodique consiste à adapter le programme TPM en fonction de la durée de vie estimée des machines ou des pièces. Sur la base des tendances observées, les inspections sont planifiées et réalisées à intervalles réguliers ; elles sont moins approfondies que celles de la maintenance prédictive, ce qui se traduit par une fréquence moindre. La maintenance périodique permet de réduire les coûts globaux, mais elle se solde par une baisse de productivité et une augmentation des pannes courantes, en raison de l'intensité et de la régularité moindres des interventions."
 management_III_B:0 "Maintenance prédictive"
 management_III_B_desc:0 "La maintenance prédictive est une extension du programme TPM, dont le calendrier est établi en fonction de l'état des équipements. Elle va au-delà des inspections régulières des machines et consiste à entretenir les équipements dès qu'ils présentent des signes d'usure, de fatigue ou de défaillance potentielle. La maintenance prédictive est plus coûteuse, car elle nécessite une extension du programme TPM, mais elle s'avère plus efficace pour prévenir les pannes et maintenir la productivité."
 management_IV:0 "Fabrication cellulaire"
 management_IV_desc:0 "L'objectif de la fabrication cellulaire est de produire une grande variété de produits similaires dans un délai très court. Chaque « cellule » fabrique un produit intermédiaire à l'aide d'une ou plusieurs machines, puis transfère ces produits intermédiaires vers une autre « cellule » de machines qui constitue une nouvelle étape de production. Dans ce modèle cellulaire, il suffit de modifier ou d'adapter une seule cellule (ou, dans certains cas, de la déplacer simplement vers une autre cellule) pour modifier l'ensemble d'une chaîne de production."
 management_V_A:0 "Présentation du système « juste à temps » (JAT)"
 management_V_A_desc:0 "Le système de production « juste à temps » (JAT) consiste pour une usine à n'utiliser que ce dont elle a besoin pour fabriquer un produit, afin de réduire le gaspillage et de minimiser les temps d'attente entre chaque étape de la production. Dans le système JAT, les marchandises ne sont pas stockées et de nouvelles commandes logistiques sont passées dès l'arrivée des matières premières. En conséquence, le stockage est réduit au minimum, le gaspillage est considérablement réduit, les liquidations sont moins fréquentes et les coûts sont réduits. Le JIT vise également à réduire les marges de sécurité ou le personnel excédentaire afin d'améliorer l'efficacité."
 management_V_B:0 "Améliorer la stratégie « au cas où » (JIC)"
 management_V_B_desc:0 "Le système de production « Just In Case » (JIC) consiste, pour une usine, à créer des marges de sécurité et à disposer de stocks et de personnel supplémentaires afin d'éviter toute perte de productivité due à des problèmes logistiques, des erreurs ou des intrants défectueux. Le système JIC vise à prévenir les problèmes ou les blocages au sein de la production en maintenant des stocks des marchandises nécessaires et en passant commande dès que certains composants sont sur le point d'être épuisés."
 management_VI:0 "Gestion de la qualité totale (TQM)"
 management_VI_desc:0 "La gestion de la qualité totale vise à améliorer les compétences des employés sur leur lieu de travail. Cela passe par des mesures d'incitation, la reconnaissance du mérite et l'amélioration des techniques de gestion. L'optimisation des processus de travail permet d'améliorer la qualité des produits et des services, ainsi que la productivité. Des équipes interfonctionnelles peuvent être constituées de manière ponctuelle pour traiter les problèmes de qualité immédiats ; la participation active de la direction à la formation est inscrite dans la politique de l'entreprise, et des récompenses fondées sur le mérite sont accordées aux personnes dont les performances dépassent celles de leurs collègues."
 management_IV_A:0 "Gestion de la sécurité et de la santé au travail (OSHM)"
 management_IV_A_desc:0 ""
 management_VII_A:0 "Travaux en cours (ConWIP)"
 management_VII_A_desc:0 "Le système « Constant Work in Progress » (ConWIP) est un système de fabrication hybride combinant les principes « push » et « pull ». Le ConWIP maintient un nombre constant de produits « en cours de fabrication » sur la chaîne de production grâce à des fiches individuelles placées à chaque étape de la chaîne."
 management_VII_B:0 "Fabrication à réponse rapide (QRM)"
 management_VII_B_desc:0 "La fabrication à réponse rapide est un système de production hybride combinant les principes « push » et « pull ». Elle permet de maintenir des délais de production courts en réduisant le temps d'attente entre le lancement et l'exécution d'un processus de fabrication. La mise en œuvre de pratiques visant à réduire ces délais permet d'améliorer la productivité et de diminuer les coûts."
 management_VIII:0 "Intégration du modèle de maturité des capacités (CMMI)"
 management_VIII_desc:0 "Le Capability Maturity Model Integration (CMMI) est un modèle de développement dans lequel de nombreuses pratiques et politiques de fabrication sont formalisées et optimisées, et où les pratiques ponctuelles sont remplacées par des pratiques permanentes. Ce modèle est conçu pour développer et améliorer les politiques de gestion passées et futures, et pour contribuer au développement du processus de fabrication en transformant les pratiques ponctuelles menées régulièrement en politiques formelles, puis en les évaluant afin de les optimiser davantage."
 management_IX:0 "Production allégée"
 management_X:0 "Fabrication agile"
