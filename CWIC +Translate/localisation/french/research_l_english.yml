 aam_short_range_0:0 "Missile air-air à guidage par faisceau radar"
 aam_short_range_0_short:0 "Navigation par faisceau radar"
 aam_short_range_0_desc:0 "Les unités mobiles de déploiement rapide, intégrées aux unités terrestres et coordonnant leurs actions avec celles-ci, sont mieux à même d'assurer la sécurité des zones de combat en maintenant une communication étroite avec les officiers sur le terrain et en se tenant informées de l'évolution de la situation au front."
 aam_short_range_1:0 "Réticule pour missile air-air à guidage infrarouge"
 aam_short_range_1_short:0 "Réticule IR"
 aam_short_range_1_desc:0 "Les autodirecteurs infrarouges à réticule utilisent un réticule rotatif à fentes placé devant un détecteur monocanal pour déterminer la position angulaire de la cible par rapport au missile. Le missile peut ensuite être guidé jusqu'à l'impact à l'aide d'une loi de guidage telle que la navigation proportionnelle. Cependant, les premiers détecteurs infrarouges ne pouvaient se verrouiller que sur les gaz d'échappement des moteurs et devaient être tirés par l'arrière, ce qui limitait leur efficacité."
 aam_short_range_2:0 "Missile air-air à détection infrarouge omnidirectionnelle"
 aam_short_range_2_short:0 "IR omnidirectionnel"
 aam_short_range_2_desc:0 "Les progrès réalisés dans le domaine des détecteurs infrarouges à semi-conducteurs refroidis permettent aux têtes chercheuses infrarouges d'identifier les avions cibles sous tous les angles, et pas seulement par l'arrière."
 aam_short_range_3:0 "Missile air-air à matrice de capteurs infrarouges"
 aam_short_range_3_short:0 "Matrice de plans focaux infrarouges"
 aam_short_range_3_desc:0 "Les matrices de détecteurs infrarouges (FPA) remplacent les autodirecteurs infrarouges monocanaux par des détecteurs qui se rapprochent davantage d'une caméra. Au lieu d'utiliser un seul pixel et un réticule rotatif pour déterminer la position angulaire d'une cible, une FPA est une caméra thermique grand angle capable d'identifier les cibles en fonction de leur forme, de leur taille et de leurs caractéristiques de performance. Les autodirecteurs basés sur la technologie FPA offrent une portée accrue et une meilleure résistance aux contre-mesures."
 aam_short_range_4:0 "Missile air-air à trajectoire fortement excentrée"
 aam_short_range_4_short:0 "Haut par rapport à l'axe de visée"
 aam_short_range_4_desc:0 "Les missiles à forte déviation par rapport à l'axe de visée peuvent être orientés vers la cible avant le lancement à l'aide d'un viseur monté sur casque, ce qui évite à l'avion lanceur de devoir être orienté vers la cible. Une fois lancé, le missile utilise un système de navigation inertielle embarqué pour se diriger vers la direction indiquée, puis acquiert la cible une fois sur sa trajectoire."
 aam_short_range_5:0 "Missile air-air à guidage infrarouge avec liaison de données"
 aam_short_range_5_short:0 "Liaisons de données"
 aam_short_range_5_desc:0 "L'ajout de liaisons de données permet d'étendre encore davantage la portée des missiles air-air à infrarouge, leur permettant ainsi d'engager des cibles qui ne se trouvent pas actuellement dans leur zone de couverture, grâce à un guidage assuré par d'autres capteurs jusqu'à ce que le chercheur embarqué puisse acquérir la cible."
 aam_long_range_0:0 "Missile air-air à guidage radar semi-actif à balayage conique"
 aam_long_range_0_short:0 "Radar semi-actif"
 aam_long_range_0_desc:0 "Les missiles à guidage radar semi-actif se dirigent vers la cible en utilisant les échos radar renvoyés par celle-ci et captés par l'avion lanceur. Associé à un autodirecteur à balayage conique, le missile est capable de calculer la vitesse angulaire relative et la direction à suivre pour atteindre la cible."
 aam_long_range_1:0 "Missile air-air à radar actif de première génération"
 aam_long_range_1_short:0 "Les premiers radars à balayage"
 aam_long_range_1_desc:0 "Le guidage radar actif consiste à intégrer un système radar complet au missile, qui suit la cible grâce à ses propres émissions radar. Cependant, les premiers systèmes de guidage radar actif étaient volumineux et très gourmands en énergie, ce qui les limitait aux missiles de très grande taille."
 aam_long_range_2:0 "Missile air-air semi-actif à impulsion unique inversée"
 aam_long_range_2_short:0 "Radar à balayage synthétique à impulsion unique inversée"
 aam_long_range_2_desc:0 "Les autodirecteurs à impulsion unique inversée remplacent l'autodirecteur conique rotatif des premiers missiles à radar à balayage synthétique (SARH) par un système de radiogoniométrie fondé sur la polarisation différentielle de deux échos radar. En émettant simultanément deux signaux à partir du radar d'éclairage avec deux polarisations différentes, il est possible de déterminer de manière univoque la position angulaire de la cible par rapport à l'autodirecteur. De plus, les échos au sol peuvent être filtrés, ce qui permet des engagements de type « look-down-shoot-down » (détection et destruction de cibles situées en dessous de l'horizon)."
 aam_long_range_3:0 "Missile air-air moderne à guidage radar actif"
 aam_long_range_3_short:0 "Radar actif moderne"
 aam_long_range_3_desc:0 "Les progrès réalisés dans le domaine des circuits intégrés hyperfréquences permettent de miniaturiser les autodirecteurs radar actifs afin de les intégrer dans des missiles de portée moyenne classiques. Cela permet ainsi à l'avion lanceur de tirer ses missiles puis de s'éloigner de la cible, au lieu de devoir assurer un balayage continu comme c'est le cas avec les autodirecteurs SARH."
 aam_long_range_4:0 "Missile air-air à tuyère variable"
 aam_long_range_4_short:0 "Fusée à tuyère variable"
 aam_long_range_4_desc:0 "Les fusées à tuyère variable constituent un mélange entre les fusées traditionnelles et les statoréacteurs. Un moteur-fusée à propergol solide équipé d'une soupape produit des gaz d'échappement riches en carburant qui sont ensuite acheminés vers une chambre de combustion alimentée par un flux d'air extérieur. En réglant la soupape, il est possible de moduler le débit de carburant et, par conséquent, la poussée, ce qui offre une meilleure impulsion spécifique et une meilleure capacité de contrôle de la trajectoire par rapport aux fusées traditionnelles."
 agm_0:0 "Missile air-sol I"
 agm_0_short:0 "AGM I"
 agm_0_desc:0 ""
 agm_1:0 "Missile air-sol II"
 agm_1_short:0 "AGM II"
 agm_1_desc:0 ""
 agm_2:0 "Missile air-sol III"
 agm_2_short:0 "AGM III"
 agm_2_desc:0 ""
 agm_3:0 "Missile air-sol IV"
 agm_3_short:0 "AGM IV"
 agm_3_desc:0 ""
 agm_4:0 "Missile air-sol V"
 agm_4_short:0 "AGM V"
