 management_XI_A:0 "Approche de l'optimisation de Pareto fondée sur l'expérimentation"
 management_XI_A_desc:0 ""
 management_XI_B:0 "Doctrine établie : l'optimisation de Pareto"
 management_XI_B_desc:0 ""
 production_efficiency_I:0 "Peinture en poudre"
 production_efficiency_I_desc:0 "Pour prévenir la rouille et l'abrasion, on utilise le revêtement en poudre pour « peindre » les machines industrielles. La poudre est appliquée par voie électrostatique, puis thermodurcie pour former une couche protectrice. Les revêtements en poudre industriels offrent une couche plus épaisse, plus résistante et plus lisse que les revêtements liquides, et durcissent beaucoup plus rapidement. Grâce au développement du revêtement en poudre, les équipements et produits métalliques bénéficient d'une bien meilleure protection contre la rouille et l'abrasion qu'avec les peintures traditionnelles."
 production_efficiency_II:0 "Bande transporteuse à demi-torsion"
 production_efficiency_II_desc:0 "La demi-torsion est une technique permettant de créer un convoyeur de type Möbius (objet tridimensionnel à une seule face) en effectuant une demi-torsion à l'une de ses extrémités. Cela permet d'allonger considérablement la durée de vie des bandes transporteuses, car toute la surface de la bande s'use de manière uniforme, contrairement à une bande non torsadée où seule une face est sollicitée. Cette technique prévient les accidents et les ruptures, et réduit le nombre d'incidents et de remplacements nécessaires pour les bandes transporteuses, ce qui rationalise la production et améliore le processus de fabrication."
 production_efficiency_III:0 "Nouvelles méthodes de soudage"
 production_efficiency_III_desc:0 "L'amélioration des techniques de soudage constitue un élément essentiel de la fabrication. La mise au point de nouvelles méthodes et de nouveaux matériaux pour assembler les métaux, de manière plus économique et plus rapide, permet de réduire les goulots d'étranglement dans la production et d'accroître la productivité globale tout en réduisant les coûts. De plus, l'amélioration des techniques de soudage renforce la qualité et la durabilité tant des produits que des machines."
 production_efficiency_IV:0 "Moulage au sable Disa"
 production_efficiency_IV_desc:0 "Le moulage au sable est un procédé important dans le domaine de la fabrication, utilisé pour produire des pièces métalliques. Dans ce procédé, le sable sert de matériau de moulage pour les pièces métalliques et s'enlève facilement, contrairement aux moules en métal ou en plastique, plus difficiles à retirer. C'est pourquoi de nombreux objets métalliques non polis présentent une surface rugueuse. Cependant, la fabrication de moules en sable peut être un processus long. La méthode de moulage au sable Disa est un processus automatisé et rapide permettant de créer de grands volumes de moules en sable pour la fabrication."
 production_efficiency_V:0 "Bande transporteuse entièrement en plastique"
 production_efficiency_V_desc:0 "À mesure que les matériaux plastiques évoluent, leurs applications se diversifient. Grâce à des plastiques plus résistants et plus durables, il est désormais possible de fabriquer des bandes transporteuses entièrement en plastique, qui sont plus faciles à entretenir et bien plus résistantes que les bandes en tissu traditionnelles. Les bandes transporteuses en plastique sont également plus faciles à nettoyer et leur remplacement et leur fabrication peuvent parfois s'avérer moins coûteux."
 production_efficiency_VI:0 "Fabrication assistée par ordinateur"
 production_efficiency_VI_desc:0 "La fabrication assistée par ordinateur (FAO) consiste à utiliser un système informatique pour contrôler la fabrication. Le recours à des logiciels de FAO facilite considérablement la gestion, la fabrication et le stockage, et permet au système informatique de s'adapter rapidement à une multitude de spécifications différentes. La précision de la FAO offre une plus grande flexibilité dans l'adaptation de la production, une plus grande précision pour des produits de meilleure qualité, ainsi qu'une réduction des déchets grâce à l'utilisation exclusive de la quantité de matière nécessaire, tout en diminuant la consommation d'énergie."
 production_efficiency_VII:0 "Fabrication assistée par ordinateur"
 production_efficiency_VII_desc:0 "La fabrication informatique entièrement intégrée est le prolongement de la fabrication assistée par ordinateur. Les systèmes entièrement intégrés mesurent, enregistrent et contrôlent chaque étape d'un processus de fabrication. Grâce à ce niveau de contrôle, l'ensemble du processus de fabrication peut être géré et optimisé en fonction de toutes les autres étapes de la chaîne de production."
 production_efficiency_VIII:0 "Gravure laser avancée"
 production_efficiency_VIII_desc:0 "La gravure au laser consiste à utiliser des lasers pour marquer un objet ou y laisser une empreinte. Si le marquage et la gravure au laser existaient déjà auparavant, le développement de cette technologie permettant de marquer des objets métalliques avec des numéros de série ou des données facilite la gestion logistique et offre une plus grande durabilité que le marquage à la peinture ou à la poudre. De plus, les lasers ne s'usent pas, car ils n'utilisent pas d'outils entrant en contact avec la surface à graver."
 production_efficiency_IX:0 "Revêtement par projection à froid"
 production_efficiency_IX_desc:0 "La projection à froid est une méthode de revêtement dans laquelle des jets de gaz supersoniques sont projetés sur une surface et y viennent frapper, ce qui entraîne leur adhérence. Cette méthode de revêtement est bien plus rapide que les techniques précédentes et permet de traiter les surfaces des produits ou des pièces mécaniques plus rapidement et plus simplement. Elle est également plus économe en énergie et permet de récupérer et de réutiliser les particules non utilisées, tout en améliorant la sécurité globale sur le lieu de travail."
 production_efficiency_X:0 "Bases de l'impression 3D"
 production_efficiency_X_desc:0 "L'impression 3D est un procédé qui consiste à solidifier des matériaux liquides ou en poudre pour former un objet solide. Elle est principalement utilisée dans le secteur industriel pour fabriquer des modèles en polymères thermodurcissables et des objets en plastique. Cette méthode est plus efficace et génère moins de déchets que le moulage plastique ; elle peut s'avérer particulièrement utile pour la fabrication d'objets médicaux tels que des implants ou des couronnes dentaires de remplacement."
 industry_production_efficiency_tt:0 "§G+15%§! de revenus des §YParc industriels§!\n"
 industrial_robots_I:0 "Robots de manutention lourde"
 industrial_robots_I_desc:0 "Les robots sont des machines capables d'effectuer des actions complexes, de manière autonome ou semi-autonome. Les débuts de la robotique industrielle ont révolutionné le secteur en permettant aux machines d'effectuer des tâches qui seraient normalement dangereuses pour les humains, et ce à un rythme bien plus rapide. Grâce au développement de systèmes hydrauliques et de commande permettant l'exécution automatisée de tâches répétitives, les usines peuvent atteindre des niveaux de productivité bien supérieurs avec moins de main-d'œuvre et accomplir des tâches qui étaient auparavant difficiles à réaliser."
 industrial_robots_II:0 "Robotique à bras articulé"
 industrial_robots_II_desc:0 "En améliorant encore la force et la dextérité des robots, il est possible de créer des bras robotiques articulés capables d'effectuer des tâches encore plus complexes. Ainsi, ces bras robotiques peuvent se plier et atteindre davantage de zones, et réaliser des tâches plus complexes, ce qui réduit encore davantage les effectifs nécessaires et permet aux usines d'augmenter plus facilement leur cadence de production."
 industrial_robots_III:0 "Robots commandés par ordinateur"
 industrial_robots_III_desc:0 "Les robots commandés par ordinateur, ou « robotique intégrée à la FAO », sont des robots qui peuvent être reprogrammés en temps réel via le réseau FAO d'une usine et commandés à distance. Cela renforce le contrôle des opérateurs sur les chaînes de montage automatisées et permet de disposer de chaînes plus flexibles, capables d'importer des programmes robotiques et de s'adapter rapidement à de nouvelles tâches."
 industrial_robots_IV:0 "Chaînes de montage entièrement robotisées"
 industrial_robots_IV_desc:0 "La conception de variantes et de modèles d'équipements robotiques de fabrication permet de produire une plus grande diversité de produits. En élargissant la gamme de robots et en créant des équipements capables de s'adapter à une multitude de modèles, il est possible d'automatiser entièrement des chaînes de montage."
 industrial_robots_V:0 "L'intelligence artificielle dans le secteur manufacturier"
 industrial_robots_V_desc:0 "Grâce à l'intelligence artificielle et aux actions autonomes dynamiques, les robots sont capables de s'adapter aux changements de leur environnement et d'améliorer considérablement la sécurité. Auparavant, le moindre dysfonctionnement ou désalignement du système pouvait entraîner une série d'événements en cascade causant de graves dommages aux machines ; or, en dotant les équipements robotiques de la capacité de réagir et de prendre des décisions élémentaires face à une situation donnée, on leur permet d'agir de manière appropriée. Cette technologie peut également être utilisée pour tester et détecter automatiquement les défauts et les imperfections des produits."
