 mountaineers_tech:0 "Alpinistes"
 night_vision:0 "Vision nocturne I"
 night_vision_desc:0 "Être capable de voir l’ennemi avant d’être vu est la clé des opérations nocturnes. avec l’invention de la technologie infrarouge, nous pouvons équiper notre armée avec des dispositifs qui, bien que peu maniables, le rendent possible."
 night_vision2:0 "Vision nocturne II"
 night_vision2_desc:0 "Les premières lunettes infrarouges, initialement conçues pour les tireurs d'élite, avaient une portée limitée. Avec des améliorations notables en termes de portée aussi bien que de portabilité, elles peuvent être utilisées par plus d'unités opérant de nuit."
 electronic_mechanical_engineering:0 "Ingénierie Électronique et Mécanique"
 electronic_mechanical_engineering_desc:0 "Dans une ère où les machines ne se contentent plus de chauffer ou d'éclairer, mais pensent pour nous, les MOSFET à micro-échelle sont les nerfs de notre intelligence militaire."
 motorised_infantry:0 "Infanterie motorisée"
 motorised_infantry_desc:0 "En élargissant l’utilisation des véhicules automobiles dans les transports d’infanterie sur le terrain, la mobilité des unités d’infanterie qui se déplacent lentement peut être grandement améliorée, ce qui permet de réagir plus rapidement et de nouvelles stratégies."
 ARTILLERY_TITLE_ROCKET:0 "ARTILLERIE À ROQUETTES"
 ARTILLERY_TITLE_AT:0 "ANTI-CHAR"
 ARTILLERY_TITLE:0 "ARTILLERIE"
 ARTILLERT_TITLE_AA:0 "ANTI-AÉRIEN"
 experimental_rockets:0 "Fusées expérimentales"
 experimental_rockets_desc:0 "Faire progresser la science de la fusée en améliorant la portée et la fiabilité des fusées à combustible liquide nous apprendra suffisamment sur la technologie pour permettre la construction de sites de lancement pour des modèles plus avancés."
 rocket_engines:0 "Fuséologie pratique"
 rocket_engines_desc:0 "La propulsion fusée atteint un seuil où bombes volantes et avions fuselés défient les vitesses humaines, une menace dans ce ciel en feu."
 improved_rocket_engines:0 "Moteurs de fusées améliorés"
 improved_rocket_engines_desc:0 "Les missiles balistiques à longue portée frappent des villes lointaines et l'espace, leur précision mortelle défiant toute défense."
 advanced_rocket_engines:0 "Fuséologie avancée"
 advanced_rocket_engines_desc:0 "L'avenir des fusées ouvre la voie à des missiles intercontinentaux aux charges toujours plus létales, une ombre sur le monde."
 atomic_research:0 "Recherche atomique"
 atomic_research_desc:0 "Dans la fission nucléaire, le fractionnement de l’atome donne des quantités énormes d’énergie et une capacité de destruction illimitée."
 rocket_interceptor:0 "Intercepteur à fusée"
 rocket_interceptor_desc:0 "Ces chasseurs fuselés, basés sur des planeurs, dépassent toute vitesse connue, leur carburant instable étant le prix de leur réactivité fulgurante."
 rocket_interceptor_2:0 "Intercepteur à fusée II"
 rocket_interceptor_2_desc:0 "Toujours dangereux, ces chasseurs gagnent en précision avec des pilotes automatiques et des remorqueurs, maximisant leur vitesse éphémère."
 rocket_interceptor_3:0 "Intercepteur à fusée III"
 rocket_interceptor_3_desc:0 "Nouvelles techniques d'atterrissage et carburants sûrs réalisent le potentiel de ces engins, des lames tranchantes dans le ciel dystopique."
 nukes:0 "Ogive à fission I"
 nukes_desc:0 "Un projet de construction d’une bombe atomique sera l’une des tâches les plus secrètes et difficiles qu’une nation puisse entreprendre, mais, s’il réussit, il peut changer non seulement le cours des guerres actuelles, mais aussi celui de l’avenir du monde."
 interwar_artillery:0 "Artillerie d’entre-guerres"
 interwar_artillery_desc:0 "Les leçons tirées du développement de différents types d’artillerie peuvent être appliquées à la conception d’autres pièces."
 artillery1:0 "Artillerie I"
 artillery1_desc:0 "Avec des matériaux et des mécanismes plus modernes, les obusiers et les canons de la Grande Guerre peuvent être recalibrés et modernisés pour la guerre moderne."
 artillery2:0 "Amélioration de l’artillerie I"
 artillery2_desc:0 "La modernisation des anciens modèles a ses limites. Il faudra concevoir de nouveaux obusiers, équipés de nouveaux dispositifs de recul hydrauliques et de canons plus longs."
 artillery3:0 "Amélioration de l’artillerie II"
 artillery3_desc:0 "Pour permettre l’utilisation de canons plus lourds sur des wagons plus légers, les freins de bouche peuvent être inclus dans la conception des obusiers."
 artillery4:0 "Artillerie IV"
 artillery4_desc:0 "Le développement d’une artillerie légère pouvant être décomposée pour le transport permettra d’apporter un soutien d’artillerie dans des zones auparavant difficiles à atteindre."
 artillery5:0 "Amélioration de l’artillerie avancée"
 artillery5_desc:0 "Les conceptions d’artillerie avec des silhouettes inférieures seront plus difficiles à cibler pour l’ennemi."
 mountain_gun:0 "Canon de montagne"
 mountain_gun_desc:0 "Le terrain montagneux du nord de l’Inde a conduit à la mise au point d’une pièce d’artillerie qui pouvait être démontée et transportée en mulot partout où elle était nécessaire."
 rocket_artillery2:0 "Amélioration de l’artillerie à roquettes I"
 rocket_artillery2_desc:0 "L’artillerie automotrice utilisant de multiples roquettes sera capable de provoquer des destructions à grande échelle rapidement, tout en maintenant la mobilité pour éviter les contre-tirs."
 rocket_artillery3:0 "Amélioration de l’artillerie à roquettes II"
 rocket_artillery3_desc:0 "Sacrifiant la portée pour l’impact, nous pouvons monter des roquettes plus lourdes sur les véhicules plus grands. Fonctionnant en équipes, ces batteries d’artillerie peuvent coopérer pour recharger et relocaliser rapidement."
 rocket_artillery4:0 "Lance-roquettes III"
 rocket_artillery4_desc:0 "Les roquettes stabilisées par spin peuvent augmenter la portée des batteries d’artillerie plus légères."
 antiair1:0 "Amélioration de l'anti-aérien"
 antiair1_desc:0 "Grâce à des mécanismes de rechargement plus rapides, les canons antiaériens qui transportent de gros obus peuvent toujours maintenir les cadences de tir nécessaires."
 antiair2:0 "Canon anti-aérien II"
 antiair2_desc:0 "Pour cibler les avions de haut vol, des cartouches et des barils plus longs seront nécessaires sur les canons anti-air."
 antiair3:0 "Amélioration de la défense antiaérienne I"
 antiair3_desc:0 "À mesure que les systèmes radar s’améliorent, l’utilisation de la direction radar des canons antiaériens devient plus viable. Le maintien de cette technologie nous permettra de fabriquer certains des systèmes anti-air les plus précis disponibles."
 antiair4:0 "Amélioration de la défense antiaérienne II"
 antiair4_desc:0 "La combinaison de systèmes modernes de radar, d’informatisation et d’autoloaders sera nécessaire pour réagir rapidement contre des avions plus rapides."
 antiair5:0 "Canon anti-aérien V"
 antiair5_desc:0 "Les missiles sol-air sont l’avenir de la guerre anti-aérienne. Le développement d’une plate-forme mobile devrait être notre prochain objectif."
 antitank1:0 "Amélioration anti-char"
 antitank1_desc:0 "L’importance des armes antichars efficaces a été établie pendant la Grande Guerre. L’introduction d’une nouvelle génération de ces armes sera nécessaire pour lutter contre les conceptions de chars modernes."
 antitank2:0 "Anti-char II"
 antitank2_desc:0 "La plupart des canons antichar sont assez légers jusqu’à présent. Des canons de plus gros calibre seront nécessaires pour combattre les chars lourds avec une armure inclinée."
 antitank3:0 "Amélioration anti-char I"
 antitank3_desc:0 "Les obus HEAT (antichar à haute puissance explosive) peuvent être utilisés dans l’artillerie anti-char pour compenser la vitesse de canon limitée."
 antitank4:0 "Amélioration anti-char II"
 antitank4_desc:0 "De nouveaux canons antichars polyvalents utilisant des tirs de sabot qui peuvent pénétrer l’armure de presque n’importe quel char."
 antitank5:0 "Anti-char V"
 antitank5_desc:0 "En combinant différents types de nouvelles technologies de munitions avec des canons à plus grande vitesse, nous pouvons être prêts pour tout nouvel armement que nos ennemis pourraient développer."
 armor:0 "Véhicule blindé de combat"
 ARMOUR_TITLE:0 "BLINDAGE"
 ARMOUR_TITLE_HEAVY:0 "LOURD"
 ARMOUR_TITLE_MEDIUM:0 "INTERMÉDIAIRE"
 ARMOUR_TITLE_LIGHT:0 "LÉGER"
 iw_armored_vehicles:0 "CONCEPTION DE VÉHICULES DE COMBAT"
 iw_armored_vehicles_desc:0 "Les principes fondamentaux de la guerre mobile et de la conception des véhicules militaires."
 armor_iw_armored_vehicles_tt:0 "§YDÉBLOQUE LA POSSIBILITÉ DE RECHERCHER DES VÉHICULES DE COMBAT§!"
 support_tech:0 "Technologie de soutien"
 engineers_tech:0 "Cie du génie"
 hospital_tech:0 "Hôpitaux de campagne"
 logistics_tech:0 "Compagnie de Logistique"
 recon_tech:0 "Compagnie de Reconnaissance"
 signal_company_tech:0 "Commandement et transmission"
 combat_support:0 "Bataillons de soutien de combat"
 combat_support_desc:0 "Les compagnies d'appui au combat sont des unités qui jouent un rôle semi-direct dans les opérations de combat. Bien qu'elles ne se trouvent pas à l'arrière, elles remplissent des fonctions qui impliquent généralement le combat lui-même, mais pas le combat direct en première ligne. Les compagnies d'appui au combat doivent être prêtes à prendre part aux combats, mais, dans l'idéal, elles ne s'engagent pas directement. Avant de pouvoir mettre en place ces compagnies, il faut développer les kits d'équipement de base et les ensembles de matériel durable afin qu'elles soient en mesure d'apporter leur soutien aux troupes de première ligne."
 combat_service_support:0 "Soutien au service de combat"
 combat_service_support_desc:0 "Les compagnies de soutien au combat sont des unités qui ne jouent aucun rôle direct dans les combats et ne sont pas aptes au combat. Elles restent bien en arrière des lignes de front et ne participent ni directement ni indirectement aux combats proprement dits. Cela ne signifie toutefois pas qu’elles n’ont pas besoin d’être proches du front, car les compagnies sanitaires doivent rester disponibles pour prodiguer des soins aux soldats blessés et les compagnies de maintenance peuvent effectuer des réparations sur le terrain. Avant de pouvoir mettre en place des compagnies de service de combat, il faut d'abord développer les bases nécessaires à la mise en place de structures de campagne portables telles que des tentes, des remorques et des éléments de fourgons."
 tech_recon:0 "Reconnaissance I : Éclaireurs"
 tech_recon_desc:0 "Les éclaireurs constituent la forme la plus simple d'agent de reconnaissance. Leur mission consiste à repérer les positions ennemies et à recueillir des informations sur la puissance et les effectifs de l'ennemi, puis à transmettre ces renseignements aux forces alliées. Les éclaireurs patrouillent dans les régions pour repérer les positions ennemies. Ils ont besoin d'un équipement de communication simple, d'instruments d'optique et d'un équipement léger."
 tech_recon2:0 "Reconnaissance II : Observateurs"
 tech_recon2_desc:0 "Les observateurs sont des unités de reconnaissance qui occupent des positions avancées en situation de combat. Ils surveillent les unités ennemies et fournissent des informations cruciales sur les attaques, les mouvements et les positions de l'ennemi, afin que les alliés puissent prendre les mesures qui s'imposent et y réagir. Les observateurs ont besoin d'équipements de communication plus coûteux et d'un équipement de combat léger pour se défendre."
 tech_recon3:0 "Reconnaissance II : Spotteurs"
 tech_recon3_desc:0 "Les spotteurs sont des observateurs sont affectés à des unités de combat spécifiques et fournissent des renseignements sur les cibles potentielles au cœur des combats. Ils repèrent les cibles et transmettent ces informations aux unités auxquelles ils sont rattachés afin que celles-ci puissent engager le combat ou envisager de le faire. Les observateurs ont besoin de moyens de communication, d'équipements optiques et de systèmes de coordonnées performants pour transmettre des informations précises sur la position de l'ennemi."
 tech_recon4:0 "Reconnaissance IV : forces de reconnaissance d'élite"
 tech_recon4_desc:0 "Les forces de reconnaissance constituent des éléments essentiels au sein d'une armée. De par leur nature même, il est primordial de préserver leur vie et leur capacité de survie au combat. Grâce à la mise en place d'un programme d'entraînement au combat et de survie plus perfectionné, les forces de reconnaissance peuvent rester opérationnelles plus longtemps et mieux résister aux embuscades et aux attaques soudaines."
 tech_recon5:0 "Reconnaissance V : Tirailleurs modernes"
 tech_recon5_desc:0 "Les tirailleurs constituent une forme avancée d'éclaireurs. Historiquement, les tirailleurs étaient des fantassins légers chargés de servir d'avant-garde aux positions alliées, de harceler l'ennemi et de repérer ses positions. Dans le combat moderne, bon nombre de ces tirailleurs ont été supprimés ou ne disposent que d'une capacité de survie minimale. En développant des armes et des systèmes capables d'assurer un tir de harcèlement et de permettre de se sortir de situations difficiles, le rôle du tirailleur peut être rempli dans le combat moderne."
 tech_recon6:0 "Reconnaissance VI : Espions sur le terrain"
 tech_recon6_desc:0 "Les espions de terrain sont des agents de renseignement militaire qui se font passer pour des soldats ennemis ou des civils afin d'échapper à la détection. Ils n'opèrent pas au sein d'une agence de renseignement, mais dans le cadre d'une armée, et transmettent des informations sur les positions des forces ennemies, généralement dans le cadre de combats urbains où il leur est plus facile de se mettre en place. Pour mener à bien leurs missions, les espions de terrain ont besoin d'équipements discrets et faciles à dissimuler, tels que des radios compactes ou des téléphones civils modifiés."
 tech_recon7:0 "Reconnaissance VII : Reconnaissance en profondeur"
 tech_recon7_desc:0 "La reconnaissance en profondeur est une opération de très haut niveau dans laquelle des éléments de reconnaissance se positionnent bien au-delà des lignes ennemies afin de transmettre des informations. Ce type de tactiques d'infiltration en profondeur nécessite d'importants efforts de mise au point et exige généralement que les unités se dissimulent et laissent passer l'ennemi. L'équipement, les techniques de camouflage et les tactiques d'infiltration sont difficiles à mettre en place, mais s'avèrent extrêmement utiles car ils permettent d'obtenir les informations les plus détaillées, inaccessibles aux éléments de reconnaissance conventionnels."
 tech_mech_recon:0 "Reconnaissance mécanisée I : Éclaireurs motorisés"
 tech_mech_recon_desc:0 "Les éclaireurs constituent la forme la plus simple d'agent de reconnaissance. Leur mission consiste à repérer les positions ennemies et à recueillir des informations sur la puissance et les effectifs de l'ennemi, puis à transmettre ces renseignements aux forces alliées. Les éclaireurs patrouillent dans les régions pour repérer les positions ennemies. Ils ont besoin d'équipements de communication simples, d'instruments d'optique et d'un équipement léger. Les éclaireurs motorisés utilisent des véhicules rapides et correctement blindés pour patrouiller les zones plus rapidement."
 tech_mech_recon2:0 "Reconnaissance mécanisée II : Observateurs avancés"
 tech_mech_recon2_desc:0 "Les observateurs sont des unités de reconnaissance qui occupent des positions avancées en situation de combat. Ils surveillent les unités ennemies et fournissent des informations cruciales sur les attaques, les mouvements et les positions de l'ennemi, afin que les alliés puissent prendre les mesures qui s'imposent et y réagir. Les observateurs ont besoin d'équipements de communication plus coûteux et d'un équipement de combat léger pour se défendre. Les observateurs avancés utilisent des moyens tels que des hélicoptères ou des véhicules de reconnaissance pour bénéficier d'une meilleure visibilité."
 tech_mech_recon3:0 "Reconnaissance mécanisée III : Spotteurs mécanisés"
 tech_mech_recon3_desc:0 "Les spotteurs sont des observateurs qui sont des agents affectés à des unités de combat spécifiques et chargés de fournir des renseignements sur les cibles potentielles au cœur des combats. Ils repèrent les cibles et transmettent ces informations aux unités auxquelles ils sont rattachés afin que celles-ci puissent engager le combat ou envisager de le faire. Les observateurs ont besoin de moyens de communication, d'équipements optiques et de systèmes de coordonnées performants pour transmettre des informations précises sur la position de l'ennemi. Les observateurs mécanisés utilisent des véhicules lourdement blindés équipés d'appareils optiques puissants pour repérer les cibles."
 tech_mech_recon4:0 "Reconnaissance mécanisée IV : Unité d'élite de reconnaissance mobile"
 tech_mech_recon4_desc:0 "Les forces de reconnaissance constituent des éléments essentiels au sein d'une armée. De par leur nature même, il est primordial de préserver leur vie et leur capacité de survie au combat. La mise en place d'un programme d'entraînement au combat et de survie plus avancé permet à ces forces de survivre plus longtemps et de mieux résister aux embuscades et aux attaques soudaines. Le développement de véhicules de reconnaissance haut de gamme, bien que coûteux, peut également contribuer à renforcer la capacité de survie des éclaireurs."
 tech_mech_recon5:0 "Recon mécanisée V : Tirailleurs modernes de pointe"
 tech_mech_recon5_desc:0 "Les tirailleurs constituent une forme avancée d'éclaireurs. Historiquement, les tirailleurs étaient des soldats d'infanterie légère chargés de servir d'avant-garde aux positions alliées, de harceler l'ennemi et de repérer ses positions. Dans le combat moderne, bon nombre de ces tirailleurs ont été supprimés ou ont une capacité de survie minimale. En développant des armes et des systèmes capables de fournir un tir de harcèlement et de se sortir de situations difficiles, le rôle du tirailleur peut être rempli dans le combat moderne. Équiper les chars de reconnaissance de rideaux de fumée et de disperseurs de paillettes modernes peut grandement améliorer leur capacité à harceler l'ennemi et à survivre aux tirs de riposte."
 tech_mech_recon6:0 "Reconnaissance mécanisée VI : Espions de terrain avancés"
 tech_mech_recon6_desc:0 "Les espions de terrain sont des agents de renseignement militaire qui se font passer pour des soldats ennemis ou des civils afin d'échapper à la détection. Ils n'opèrent pas au sein d'une agence de renseignement, mais dans le cadre d'une armée, et transmettent des informations sur les positions actives à l'ennemi, généralement dans le cadre de combats urbains où il leur est plus facile de se mettre en place. Pour mener à bien leurs missions, les espions de terrain ont besoin d'équipements discrets et faciles à dissimuler, tels que des radios compactes ou des téléphones civils modifiés. En utilisant des véhicules civils, les espions de terrain peuvent infiltrer plus rapidement des positions urbaines et rurales et se fondre potentiellement dans la population."
 tech_mech_recon7:0 "Reconnaissance mécanisée VII : Reconnaissance mobile en profondeur"
 tech_mech_recon7_desc:0 "La reconnaissance en profondeur est une opération de très haut niveau dans laquelle des éléments de reconnaissance se positionnent bien au-delà des lignes ennemies afin de transmettre des informations. Ce type de tactiques d'infiltration en profondeur nécessite d'importants efforts de mise au point et exige généralement que les unités se dissimulent et laissent passer l'ennemi. L'équipement, les techniques de camouflage et les tactiques d'infiltration sont difficiles à mettre en place, mais s'avèrent extrêmement utiles car ils permettent d'obtenir les informations les plus détaillées, inaccessibles aux éléments de reconnaissance conventionnels."
 tech_engineers:0 "Ingénieur I : Défenseurs"
 tech_engineers_desc:0 "Les défenseurs constituent la forme la plus élémentaire de génie de combat. Ils ont pour mission principale de construire des retranchements et des ouvrages défensifs, de dégager des chemins et d'installer des camps de base. Les défenseurs ont besoin d'outils de base tels que des pelles et des haches, de kits de fortification élémentaires et de mines."
 tech_engineers2:0 "Ingénieur II : Génie"
 tech_engineers2_desc:0 "Les sapeurs sont une autre appellation désignant les ingénieurs de combat. Ils sont chargés de missions de combat plus directes, telles que la destruction de fortifications et la conduite d'opérations de déminage visant à dégager les champs de mines et les obstacles. Les sapeurs ont besoin de charges explosives, d'explosifs puissants, de matériel de déminage, de lance-flammes, de coupe-boulons et d'autres équipements nécessaires pour neutraliser les fortifications."
 tech_engineers3:0 "Ingénieur III : Sapeurs-ponteurs"
 tech_engineers3_desc:0 "Les sapeurs-ponteurs sont des ingénieurs de combat qui utilisent du matériel de pontage pour faciliter la traversée des cours d'eau. Ces ingénieurs construisent des ponts à partir de matériaux locaux, tels que des troncs d'arbres ou des pierres empilées, afin de mettre en place des ponts de fortune. Ce processus peut s'avérer long et pénible lorsqu'il est effectué manuellement ; dans les grandes divisions, on compte sur les sapeurs-ponteurs pour diriger les autres soldats dans la construction des ponts. Pour accomplir cette tâche, les sapeurs-ponteurs ont besoin de haches ou d'outils pour tailler la pierre, de cordes et de kits de pontage."
 tech_engineers4:0 "Ingénieur IV : Junglers"
 tech_engineers4_desc:0 "Les junglers sont des ingénieurs de combat qui défrichent des zones de jungle à l'aide de défoliants ou du feu, ainsi que d'outils perfectionnés permettant de construire des fortifications dans la jungle. Cela facilite les combats et permet aux ingénieurs de combat d'apporter un avantage décisif dans l'environnement difficile de la jungle. Cependant, la majeure partie de la formation des junglers est consacrée aux techniques et aux théories de la guerre en jungle ; par conséquent, ils ne sont d'aucune utilité dans d'autres environnements de combat."
 tech_engineers5:0 "Ingénieur V : Ingénieurs de combat"
 tech_engineers5_desc:0 "Les ingénieurs de combat pourraient devoir jouer un rôle plus direct au combat. À un moment donné, ils devront établir des bases avancées au cœur des zones de combat. Ils doivent être capables de mettre en place, en un temps record, des fortifications et des bases avancées d’une grande qualité. Cela nécessite un équipement individuel encore plus sophistiqué, une chaîne d’approvisionnement rapide capable de livrer tout le matériel nécessaire, ainsi qu’un équipement plus résistant pour assurer leur survie dans les zones dangereuses."
 tech_engineers6:0 "Ingénieur VI : Pionniers"
 tech_engineers6_desc:0 "Les pionniers sont des ingénieurs de combat capables de s'adapter à n'importe quel environnement et de relever n'importe quel défi sur le terrain, partout dans le monde. Ce sont des ingénieurs compétents, capables de s'acquitter de leur mission où qu'on les envoie. Ils utilisent des outils et des équipements polyvalents et légers pour construire des fortifications, faciliter les déplacements ou franchir les défenses ennemies."
 tech_engineers7:0 "Ingénieur VII : Ingénieurs de combat urbain / Ingénieurs de terrain"
 tech_engineers7_desc:0 "Les ingénieurs de combat urbain sont l'évolution des ingénieurs de combat et des sapeurs. Spécialisés dans la guerre urbaine, ils sont capables de mettre en place des fortifications et des installations sophistiquées en milieu urbain. Non seulement ils peuvent améliorer la capacité de combat des troupes en milieu urbain, mais ils sont également capables de gérer les dangers urbains liés à la guerre, tels que les décombres, les câbles électriques à nu, les inondations toxiques, etc. Ces hommes rendent la guerre urbaine un peu moins infernale pour vos troupes et en font une véritable « flamme éternelle » pour l'ennemi. Les ingénieurs de campagne sont l'évolution des défenseurs.\nLes ingénieurs de campagne sont spécialisés dans la construction d'installations et de défenses améliorées, ainsi que dans le dégagement des voies. Grâce à un équipement plus sophistiqué, les ingénieurs de campagne sont capables de dégager les voies plus rapidement et de construire plus vite que jamais."
 tech_armor_engineers:0 "Génie blindé I : Défenseurs motorisés"
 tech_armor_engineers_desc:0 "Les défenseurs constituent la forme la plus élémentaire de génie de combat. Ils ont pour mission principale de construire des retranchements et des ouvrages défensifs, de dégager des chemins et d'installer des camps de base. Ils ont besoin d'outils de base tels que des pelles et des haches, de kits de fortification élémentaires et de mines. Les défenseurs motorisés utilisent des engins de chantier et des camions de ravitaillement pour faciliter leurs opérations de fortification."
 tech_armor_engineers2:0 "Génie blindé II : Sapeurs mécanisés"
 tech_armor_engineers2_desc:0 "Les sapeurs sont un autre nom donné aux ingénieurs de combat. À ce stade, les sapeurs sont affectés à des missions de combat plus directes, telles que la destruction de fortifications et la conduite d'opérations de contre-attaque visant à déminer les champs de mines et à éliminer les obstacles. Les sapeurs ont besoin de charges de démolition, d'explosifs puissants, de matériel de déminage, de lance-flammes, de coupe-boulons et d'autres équipements nécessaires pour neutraliser les fortifications. Les sapeurs mécanisés utilisent des véhicules de destruction de bunkers et des camions de ravitaillement afin de faciliter leurs assauts et de mieux soutenir les attaquants principaux."
 tech_armor_engineers3:0 "Génie blindé III : Sapeurs-ponteurs"
 tech_armor_engineers3_desc:0 "Les sapeurs-ponteurs sont des ingénieurs de combat qui utilisent du matériel de pontage pour faciliter la traversée des cours d'eau. Ces ingénieurs construisent des ponts à partir de matériaux locaux, tels que des troncs d'arbres ou des pierres empilées, afin de réaliser des ponts de fortune. Ce processus peut s'avérer long et pénible lorsqu'il est effectué manuellement ; dans les grandes divisions, on compte sur les sapeurs-ponteurs pour diriger les autres soldats dans la construction des ponts. Pour accomplir cette tâche, les sapeurs-ponteurs ont besoin de haches ou d'outils pour tailler la pierre, de cordes et de kits de pontage. Les sapeurs-ponteurs mécanisés utilisent des véhicules de pontage spéciaux afin de construire des ponts plus rapidement sur le terrain."
 tech_armor_engineers4:0 "Génie blindé IV : Junglers avancés"
 tech_armor_engineers4_desc:0 "Les « junglers » sont des ingénieurs de combat qui défrichent des zones de jungle à l'aide de défoliants ou du feu, ainsi que d'outils perfectionnés permettant de construire des fortifications dans la jungle. Cela facilite les combats et permet aux ingénieurs de combat d'apporter un avantage décisif dans l'environnement difficile de la jungle. Cependant, la majeure partie de la formation des « junglers » est consacrée aux techniques et aux théories de la guerre en jungle. Les junglers avancés utilisent de gros bulldozers, des véhicules de déboisement, des chars lance-flammes et des hélicoptères équipés de défoliants afin de mieux soutenir les autres troupes ou de vaincre les forces ennemies qui tentent de tirer parti de la jungle."
 tech_armor_engineers5:0 "Génie blindé V : Ingénieurs de combat blindés"
 tech_armor_engineers5_desc:0 "Les ingénieurs de combat sont des ingénieurs qui jouent un rôle plus direct au combat. Ils construisent des bases avancées dans les zones de combat. Les ingénieurs de combat doivent être capables de mettre en place des fortifications et des bases avancées en un temps extrêmement court et avec un niveau de qualité élevé. Cela nécessite un équipement individuel encore plus sophistiqué, un train de ravitaillement rapide capable de livrer tous les matériaux nécessaires, ainsi qu'un équipement plus résistant pour survivre dans les zones dangereuses. Les ingénieurs de combat blindés utilisent des véhicules lourdement blindés et des chars de génie afin de mieux se protéger en milieu urbain et de combattre dans des situations de siège."
 tech_armor_engineers6:0 "Génie blindé VI : Pionniers motorisés"
 tech_armor_engineers6_desc:0 "Les pionniers sont des ingénieurs de combat capables de s'adapter à n'importe quel environnement et de relever n'importe quel défi régional à travers le monde. Ce sont des ingénieurs compétents, capables d'intervenir partout où on les envoie. Ils utilisent des outils et des équipements polyvalents et légers pour construire des fortifications, faciliter les déplacements ou franchir les défenses ennemies. Les pionniers motorisés utilisent des engins de chantier et des véhicules de ravitaillement modernes afin d'accomplir leur mission plus rapidement et avec de meilleurs résultats que les pionniers qui n'ont pas accès à du matériel lourd."
 tech_armor_engineers7:0 "Génie blindé VII : UWE/FE mobile"
 tech_armor_engineers7_desc:0 "Les ingénieurs de combat urbain sont l'évolution des ingénieurs de combat et des sapeurs. Spécialisés dans la guerre urbaine, ils sont capables de mettre en place des fortifications et des installations sophistiquées en milieu urbain. Non seulement ils peuvent améliorer la capacité de combat des troupes en milieu urbain, mais ils sont également capables de gérer les dangers urbains liés à la guerre, tels que les décombres, les câbles électriques à nu, les inondations toxiques, etc. Ces hommes rendent la guerre urbaine un peu moins infernale pour vos troupes et en font une véritable « flamme éternelle » pour l'ennemi. Les ingénieurs de guerre urbaine mobiles utilisent des véhicules lourdement blindés et des chars du génie afin d'éliminer les dangers et d'apporter un meilleur soutien lors des sièges de villes.\nLes ingénieurs de campagne sont l'évolution des défenseurs. Les ingénieurs de campagne sont spécialisés dans la construction d'installations et de défenses améliorées, ainsi que dans le dégagement des voies d'accès. Grâce à un équipement plus sophistiqué, les ingénieurs de campagne sont capables de dégager les voies plus rapidement et de construire plus vite que jamais. Les ingénieurs de campagne mobiles utilisent des véhicules de déblayage, des hélicoptères, des engins de chantier, des chars du génie et bien d'autres équipements de pointe pour accomplir leur travail mieux que ne le peuvent les ingénieurs de campagne qui ne disposent pas de ces équipements."
 tech_field_hospital:0 "Terrain I : Compagnie de campagne"
 tech_field_hospital_desc:0 "Les compagnies médicales sont des unités de soutien composées de personnel médical, notamment de chirurgiens de campagne, d'infirmiers de combat, d'infirmières, etc. Elles veillent à la santé et au bien-être des soldats sur le terrain. Les compagnies médicales les plus simples se contentent d'équiper le personnel médical de matériel léger et de leur dispenser une formation et une discipline leur permettant de faire face aux horreurs de la guerre. Il n'est pas nécessaire de les former à travailler sous pression et dans l'urgence, car le personnel médical doit toujours travailler dans ces conditions."
 tech_field_hospital2:0 "Médecine II : Hôpitaux de campagne"
 tech_field_hospital2_desc:0 "La mise en place d'hôpitaux de campagne mobiles facilite grandement la prise en charge des blessés. Les soldats blessés transportés vers des hôpitaux de campagne dotés d'équipements médicaux ont bien plus de chances de survivre que s'ils étaient soignés par des infirmiers qui tenteraient de les secourir sous les tirs, dans la boue. Les hôpitaux de campagne doivent disposer d'équipements légers et d'ambulances de campagne blindées afin de pouvoir accompagner l'armée et évacuer les soldats en plein combat."
 tech_field_hospital3:0 "Médecine III : Matériel hospitalier mobile"
 tech_field_hospital3_desc:0 "Si les machines imposantes et les lits d'hôpital équipés de moniteurs constituent d'excellents moyens de sauver des vies, les hôpitaux traditionnels ne sont malheureusement pas transportables. La mise au point de versions légères et portables du matériel médical utilisé dans les hôpitaux permet aux hôpitaux de campagne de se rapprocher davantage de leurs homologues permanents et de mieux venir en aide aux soldats."
 tech_field_hospital4:0 "Médecine IV : Conditionnement physique et psychologique avancé"
 tech_field_hospital4_desc:0 "Il va sans dire qu’il est préférable d’être en bonne santé lorsque sa vie est en jeu : cela facilite le travail des médecins et augmente les chances de survie. Grâce à la recherche médicale, les entreprises du secteur peuvent surveiller et améliorer la santé physique et mentale des soldats sur le terrain, afin de s’assurer qu’ils disposent d’une ossature, d’une musculature, d’un système immunitaire et d’un mental solides, ce qui leur permet de mieux surmonter le traumatisme lié aux blessures subies au combat."
 tech_field_hospital5:0 "Médecine V : Recherche médicale militaire"
 tech_field_hospital5_desc:0 "Les médecins civils et les chercheurs en médecine n'ont (heureusement) pas à faire face régulièrement à un afflux massif de patients souffrant de blessures de guerre graves. C'est pour cette raison que la médecine de guerre n'a fait l'objet d'une attention scientifique que lorsque des conflits armés sont en cours ou que le pays est en proie à une grande instabilité. Cela dit, lorsqu'un pays est instable, il est peu probable qu'il y ait beaucoup de médecins disposant d'hôpitaux bien financés. Il est donc prudent d'inclure des chercheurs en médecine capables d'étudier et de mettre au point de nouvelles techniques et de nouveaux équipements médicaux pour traiter les blessures de guerre."
 tech_field_hospital6:0 "Médecine VI : Psychiatres militaires"
 tech_field_hospital6_desc:0 "Tous ceux qui sont mis hors service dans l'armée ne sont pas nécessairement tués ou blessés. La nature violente et infernale de la guerre laisse de nombreux soldats atteints de syndrome de stress post-traumatique (SSPT). Cet état malheureux rend les anciens combattants invalides ou incapables de réintégrer la vie civile et de poursuivre leur service dans l'armée. Les psychiatres militaires ont pour mission d'aider les soldats victimes de traumatismes psychologiques et de leur permettre soit de continuer à servir dans l'armée, soit d'être démobilisés et de réintégrer sereinement la vie civile avec un minimum de problèmes psychiatriques ou de facteurs déclencheurs du SSPT, voire sans aucun."
 tech_field_hospital7:0 "Médecine VII : Médecine des traumatismes en milieu militaire"
 tech_field_hospital7_desc:0 "En tant que prolongement logique de la médecine d'urgence et de réanimation (CIMR), la médecine traumatologique nécessite un équipement spécialisé pour traiter les blessures extrêmes et stabiliser les troubles physiologiques graves associés aux traumatismes majeurs. Cette exigence, combinée à la nécessité de disposer d'un matériel médical léger et compact en situation de guerre, pousse l'ingéniosité médicale à ses limites. Cela inclut des organes artificiels temporaires capables d'effectuer des tâches simples, des anesthésiques très puissants, des dispositifs d'assistance de pointe et du matériel miniaturisé pour les services de traumatologie. La médecine traumatologique militaire permet de sauver des soldats qui, quelques années auparavant, auraient été considérés comme condamnés."
 tech_field_hospital_helicopter3:0 "Hélicoptères MEDEVAC I"
