 ITA_60s_Piano_Solo_desc:0 ""
 Piano_Solo.1.d:0 "Suite aux gesticulations socialistes et communistes contre le gouvernement ainsi qu'aux grèves et attaques répétées contre les fonctionnaires et les piétons, les Carabiniers ont jugé bon de placer le pays sous leur gouvernance pour le moment, avec la promesse d'un éventuel retour à la démocratie."
 Piano_Solo.2.d:0 "Suite aux gesticulations socialistes et communistes contre le gouvernement en Italie, ainsi qu'aux grèves et attaques répétées contre les fonctionnaires et les piétons, la gendarmerie nationale italienne a jugé bon de placer le pays sous sa gouvernance pour le moment, avec la promesse d'un éventuel retour à la démocratie."
