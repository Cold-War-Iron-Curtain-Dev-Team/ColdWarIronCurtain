 NBO_Econ.1.t: "Launching the First Reconstruction and Development Plan"
 NBO_Econ.1.d: "In the aftermath of World War II and the Japanese occupation, North Borneo lies battered—its ports damaged, its plantations abandoned, and its administrative system barely functioning. In response, the British administration has unveiled The First North Borneo Reconstruction and Development Plan, a sweeping blueprint for revitalization that spans the years 1948 to 1955.\n\nThis plan marks the first of three long-term development programs envisioned to prepare the colony for eventual self-governance. It aims to modernize the territory’s fragile infrastructure, rebuild administrative capacity, and lay the social and economic foundations for a stable, self-sufficient state.\n\nAmong the core pillars of the plan are:\n    -Infrastructure: Reconstruct and expand road and rail networks, repair and modernize Jesselton Port, and build new telecommunications systems.\n    -Economic Diversification: Reduce dependency on timber exports by investing in agriculture, fisheries, and small-scale industry.\n    -Social Development: Expand primary education, introduce local teacher training programs, build rural clinics, and reform the civil service.\n    -Political Reforms: Lay groundwork for representative institutions to nurture political participation and responsible governance."
 NBO_Econ.1.a: "A new dawn for North Borneo"
 NBO_Econ.2.t: "Sabah Petroleum Development Act Passed"
 NBO_Econ.2.d: "In a landmark move to assert control over its natural wealth, the Parliament of North Borneo has passed the Sabah Petroleum Development Act, enshrining full ownership of oil and gas resources within the state. The Act establishes the Sabah Petroleum Authority (SPA), a statutory body tasked with regulating petroleum exploration, refining, and export.\n\nUnder this new framework, all petroleum operations—onshore and offshore—will require state-issued licenses. Foreign corporations will be permitted to invest only under joint ventures that meet local development requirements. Royalties from oil production will be redirected into state coffers, with a portion earmarked for indigenous development and infrastructure programs.\n\nThe Act formally nullifies outdated colonial-era oil agreements and strengthens Sabah’s legal standing in managing its energy future. Backed by both nationalist and economic reformist factions, the move is seen as a decisive step toward financial independence and modernization."
 NBO_Econ.2.a: "Our oil, our future"
