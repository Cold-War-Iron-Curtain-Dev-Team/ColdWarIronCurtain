 NBO_Mil.1.t: "Founding of the North Borneo Armed Forces"
 NBO_Mil.1.d: "Nanyang, North Borneo stands as a lone loyalist bastion in the British Commonwealth. Following its elevation to Dominion Status, the government in Jesselton has moved swiftly to secure its sovereignty and defense capabilities.\n\nAt the heart of this transformation lies the historic North Borneo Armed Constabulary. First founded in 1882, and reorganized in 1897 under the motto “Prego et Perago” (“I Advance and Accomplish”), the force has a proud lineage of service to the Crown. Originally manned by Sikh recruits from Perak and indigenous Dyak auxiliaries, the Constabulary long served as both a police force and local defense corps.\n\nNow, as part of sweeping reforms, the Constabulary is to be fully reorganized into a professional standing military force—the North Borneo Armed Forces (NBAF). The new force will include:\n\nThe North Borneo Rifle Regiment, formed from existing armed constabulary battalions and Sikh units.\n\nThe Royal Dayak Rangers, a jungle warfare unit composed of indigenous headhunters fighters and emulated from the famed White Rajah's Sarawak Rangers.\n\nA small but growing Air Force, initially formed from surplus British light aircraft.\n\nThe Navy, responsible for patrolling the Sabah coastline and deterring MCP-aligned raiders.This act of military reorganization is not only a necessity in a dangerous region, but a symbol of national pride and defiance in the face of communist expansion."
 NBO_Mil.1.a: "Prego et Perago!"
 NBO_Mil.2.t: "Establishment of the North Borneo Navy "
 NBO_Mil.2.d: "In the face of mounting regional insecurity and the threat posed by the communist control of mainland Malaya, the Dominion of North Borneo has taken its next bold step in asserting its sovereignty and self-defense capabilities—the formal establishment of the North Borneo Naval Command (NBNC).\n\nBased in the strategic port of Jesselton, the naval command will serve both as a coastal patrol and regional deterrent. The foundation of this naval force was made possible by close cooperation with the Australian Armed Forces, who, recognizing the strategic importance of Borneo, have pledged financial aid, technical expertise, and surplus vessels to bolster the fledgling navy.\n\nThe expansion of Jesselton Port—soon to become the naval headquarters—will include:\n\nConstruction of a drydock and repair facilities\n\nTraining infrastructure for coastal defense operations\n\nDeployment of small patrol boats and minesweepers, many of which are retired Australian Commonwealth vessels\n\nA cooperative advisory team of Royal Australian Navy (RAN) officers to assist in doctrine and officer training\n\nThis foundation not only strengthens Borneo’s coastline against infiltration and maritime subversion but cements a new defense partnership with the Australian Commonwealth in resisting communist expansion in Southeast Asia."
 NBO_Mil.2.a: "Navigare necesse est, vivere non est necesse."
 NBO_Mil.3.t: "Foundation of the North Borneo Air Force"
 NBO_Mil.3.d: "What once lay in ruins as the Jesselton Airfield, bombed into fragments during the twilight of the Pacific War, will now rise again—not as a civilian port, but as the cradle of North Borneo’s own air power.\n\nWith growing threats from the communist south and a need to patrol vast interior jungles and coastlines, the Department of Civil Aviation (DCA) has been formally restructured and militarized, giving birth to the North Borneo Air Force (NBAF). This transformation has been made possible with extensive financial and material support from the United States and the United Kingdom, both of whom view Borneo as a key bulwark in the Southeast Asian theatre of Cold War containment.\n\nUnder this initiative:\n\nJesselton Airfield will be converted into the Jesselton Air Base, serving as NBAF’s command hub\n\nFormer RAF and USAF trainers and surplus aircraft (including transport planes and basic fighters) will be delivered\n\nBritish and American advisors will assist in pilot training, radar installation, and air doctrine formation\n\nThe founding ceremony, held with both American and British envoys in attendance, marked a turning point for North Borneo—a declaration that its skies will no longer be guarded by others, but by its own."
 NBO_Mil.3.a: "Per Ardua ad Astra"
 NBO_Pol.1.t: "Dominion of North Borneo Proclaimed"
 NBO_Pol.1.d: "As Malaya burns under the red banner of Chin Peng's People's Democratic Union of Nanyang, the last free bastions of British Southeast Asia scramble to regroup. Amidst this chaos, North Borneo has risen from colonial administration to national sovereignty.\n\nBacked by British officials, Australian logistical teams, and quiet American approval, Donald Marmaduke Stephens, a seasoned local leader and voice of unity, has declared the Dominion of North Borneo under a constitutional monarchy model within the Commonwealth.\n\nHis Sabah People's Party (SPP), a broad-tent nationalist movement formed just weeks earlier, now leads a provisional government from Jesselton, promising protection to all ethnic and religious communities—Kadazan-Dusun, Murut, Chinese settlers, Malays, and British settlers alike.\n\nThe new Dominion pledges:\n\nContinued loyalty to the Crown\n\nA democratic constitution to be drafted within a year\n\nMilitary reorganization to resist MCP expansion\n\nEconomic cooperation with Australia and the United States\n\nThe flags were raised today. A new chapter has begun—amid fire, fear, and freedom."
 NBO_Pol.1.a: "We are no longer a colony. We are North Borneo!"
 NBO_Pol.2.t: "Fragmented Past, Uncertain Future"
 NBO_Pol.2.d: "As the Dominion of North Borneo embarks on its journey as an independent state, the question of national identity looms large. Unlike neighboring Malaya or Indonesia, North Borneo lacks a singular ethnic, linguistic, or cultural foundation that can be easily woven into a national mythos.\n\nHistorically, North Borneo was not a unified polity. It was a mosaic of indigenous communities—Kadazan-Dusun, Bajau, Murut, Rungus, Bisaya, Orang Sungai, and others—each with their own languages, customs, and forms of governance. Coastal towns like Sandakan and Jesselton grew into administrative hubs under foreign powers, while the interior remained culturally autonomous and diverse.\n\nFrom 1881 to 1946, the territory was governed not by the British Crown but by a private enterprise—the North Borneo Chartered Company (NBCC). Chartered by Queen Victoria, the NBCC treated North Borneo as a corporate colony, extracting resources like timber, rubber, and tobacco while offering minimal infrastructure or educational development. It wasn’t until the devastation of World War II and the Japanese occupation that the Company’s ineffectiveness was finally exposed. In 1946, North Borneo became a British Crown Colony.\n\nNow, with independence declared, there is no common flag in every village, no shared anthem in every school, and no founding father who unites all hearts. Even the Sabah People's Party finds it difficult to form slogans that resonate equally in Keningau, Kota Belud, and Semporna.\n\nUnless the new Dominion actively fosters a sense of shared history and civic nationalism, it risks becoming a state without a soul—united on paper, but fragmented in spirit."
 NBO_Pol.2.a: "We must invest in forging a shared national identity!"
 NBO_Pol.3.t: "White Pioneers, Shared Destiny"
 NBO_Pol.3.d: "As the newly declared Dominion of North Borneo begins the process of state-building, a curious proposition has gained traction among influential figures in Jesselton and Sandakan: use the legacy of Anglo-White settlers—planters, missionaries, constables, and company officers—as the foundational thread of a unified North Bornean identity.\n\nWhile North Borneo is home to a stunning array of indigenous peoples, there is no single dominant culture or unifying mythos. Instead of attempting to elevate one native tradition over others, some argue that recasting the shared colonial experience under the North Borneo Chartered Company (NBCC) as a “civilizing foundation” could offer a new route toward unity.\n\nFor proponents of this idea, the British and European settlers who administered the territory between 1881 and 1946 are not merely foreign rulers—but the very architects of order, commerce, and education. Under the NBCC’s watch, the once lawless coasts plagued by Sulu pirates and maritime slave raids were pacified. Peace, development, and infrastructure were brought to the deep jungles and coasts. Railroads, rubber estates, and hospitals emerged alongside the idea of a multi-ethnic society bound together by law and labor.\n\nBy establishing cultural museums, Anglo-native historical sites, and a “Founders’ Day” to honor the settlers and the charter company’s legacy, the government hopes to inspire all peoples—Dusun, Murut, Chinese, Bajau, Sikhs, and Eurasians alike—to adopt a shared story rooted in the values of order, cooperation, and frontier spirit."
 NBO_Pol.3.a: "We honor the pioneers as our unity begins with them."
 NBO_Pol.4.t: "Decolonize to Unify: A New Identity for North Borneo"
 NBO_Pol.4.d: "With the fall of mainland Malaya and the declaration of the North Bornean Dominion, calls for decolonization have surged from indigenous leaders, intellectuals, and youth movements. They argue that the path to national unity lies not through the imported colonial memory of white planters, but through the shared struggles, languages, and beliefs of North Borneo’s native peoples.\n\nA rising coalition of Dusun, Murut, Bajau, and indigenous Chinese-descended leaders proposes a cultural framework based on shared land stewardship, adat traditions, native languages, and syncretic customs. In response, a bold national campaign has begun: to reclaim the public space from colonial legacies, restore native place names, and protect local belief systems from foreign dominance.\n\nThe first step? Renaming the capital city: Jesselton, once the symbol of colonial administration, must go.\n\nOption A:\n“Rename Jesselton to Api-Api—as it was before empire.”\n-> City of Jesselton renamed to Api-Api\nOption B:\n“Let it be Bandar Kinabalu—a symbol of our sacred mountain.”\n-> Renames Jesselton to Bandar Kinabalu\nOption C:\n“Call it Kota Merdeka—our land, finally free.”"
 NBO_Pol.4.a: "Rename Jesselton to Api-Api, as it was before empire"
 NBO_Pol.4.b: "Let it be Bandar Kinabalu, symbol of our sacred mountain."
 NBO_Pol.4.c: "Call it Kota Merdeka, our land, finally free."
 NBO_Pol.5.t: "The First Provisional Election"
 NBO_Pol.5.d: "After years of colonial rule, war, and the collapse of British mainland authority, the Dominion of North Borneo now moves to form its first provisional civilian government. With the Constitution in place and the future of the country uncertain, the people now turn to the ballot box to choose their first Prime Minister.\n\nThree major political forces have emerged to contest this historic vote:\n\nDonald Marmaduke Stephens and the People’s Sabah Party (PSP):\nA modernist, moderate nationalist party promoting Anglo-Sabah cultural fusion, democratic reforms, and alignment with Sarawak and Western nations. Stephens, a seasoned leader of mixed Kadazan and British descent, proposes a secular and inclusive administration focused on development, education, and regional diplomacy.\n\nDatu Mustapha Datu Harun and the United Sabah National Organization (USNO):\nA conservative, pro-Malay Muslim party, inspired by Malaya’s UMNO. USNO advocates for closer ties with Peninsular Malaya, Islamization of state institutions, and the assimilation of non-Muslim tribes into a broader Malay identity. Backed by religious scholars and traditionalist elites, Datu Mustapha appeals to rural Muslim voters and segments of the Bajau and Suluk populations.\n\nThe North Borneo Charter Company Loyalists (NBCC):\nA representative of the old British North Borneo Chartered Company has emerged, arguing that reinstating the company as a governing body would stabilize the region. They promise efficient administration, restored business ties, and “neutral” governance modeled after pre-war corporate colonialism. Their nostalgia-fueled appeal resonates with older settlers and some business elites."
 NBO_Pol.5.a: "PSP"
 NBO_Pol.5.b: "USNO"
 NBO_Pol.5.c: "NBCC"
 NBO_Pol.6.t: "A New Era of Cultural Pluralism"
 NBO_Pol.6.d: "With the electoral victory of [NBO.GetLeader] and the People’s Sabah Party, the newly formed government has pledged to uphold and safeguard the indigenous cultures, languages, and spiritual traditions of North Borneo.\n\nThe new administration has rejected the notion of aggressive cultural unification, choosing instead to champion a pluralistic “Sabahan Identity” — one that balances Kadazan-Dusun, Murut, Bajau, Chinese, and settler traditions within a democratic framework. Traditional religious rites, animist practices, Christian missions, and local customs are to be legally protected, while Malay and Islamic institutions will not receive preferential status.\n\nIn a symbolic gesture, the government has declared the preservation of sacred highlands, recognition of customary law (Adat), and support for vernacular schools in indigenous communities."
 NBO_Pol.6.a: "A victory of the indigenous people"
 NBO_Pol.7.t: "Sulu Claim on Sabah Reaches the World Stage"
 NBO_Pol.7.d: "Following years of diplomatic silence, the Republic has again formally raised the issue of Sabah’s historic ties to the Sultanate of Sulu, citing the 1878 lease agreement with the British North Borneo Company and ongoing claims of sovereignty.\n\nEncouraged by nationalist circles and factions within the House of Representatives, Manila has agreed to submit the claim for international mediation, after pressure and facilitation from the United States and United Kingdom.\n\nPresident [PHI.GetLeader] must now decide the tone and aim of the Philippine delegation."
 NBO_Pol.7.a: "Let diplomacy prevail. We’ll negotiate for compensation or autonomy."
 NBO_Pol.8.t: "International Mediation Over the Sulu Claim"
 NBO_Pol.8.d: "The long-standing historical claim of the Sultanate of Sulu—supported by the Republic of the Philippines—over parts of Eastern Sabah has returned to the international spotlight.\n\nIn light of rising tensions and diplomatic back-and-forth between North Borneo and Manila, the United States and United Kingdom have jointly proposed a multilateral arbitration process in Geneva. The talks, mediated under a neutral framework, aim to prevent any escalation that could destabilize Southeast Asia.\n\nPrime Minister Donald Stephens has agreed to the mediation, insisting that the sovereignty of North Borneo must be upheld, while recognizing the need to resolve lingering historical grievances from the British colonial era."
 NBO_Pol.8.a: "We’ll resolve this peacefully, under mediation."
 NBO_Pol.9.t: "The First Parliament Meeting"
 NBO_Pol.9.d: "Following the successful conclusion of North Borneo’s first provisional general election, the newly elected representatives have gathered at the hastily refurbished Legislative Assembly Hall in Jesselton, now the capital of the Dominion. Among them are men and women from all walks of life—tribal leaders, urban professionals, missionaries, and ex-Company officers.\n\nThe opening session was marked by hopeful speeches, cultural rituals, and firm declarations of loyalty to the Crown and to the future of a united Bornean state. Despite ideological and ethnic differences among the MPs, the shared sense of responsibility and the memory of recent struggles brought an air of solemnity to the assembly.\n\nThe elected Prime Minister delivered a carefully worded address calling for reconciliation and progress, emphasizing democratic values, national identity, and the need for a common future among Sabah’s diverse peoples.\n\nKey items on the agenda include the drafting of a permanent constitution, discussions on land and resource governance, and the status of relations with neighboring powers and the Crown."
 NBO_Pol.9.a: "Let history remember this day."
 NBO_Pol.10.t: "Islamization and Malay-nization"
 NBO_Pol.10.d: "The resounding victory of Datu Mustapha Datu Harun and the United Sabah National Organization (USNO) has marked a pivotal shift in the Dominion’s direction. Citing the need for a unified Sabahan nation, the new government has declared a policy of cultural harmonization under Islam and Malay identity.\n\nMosques are to be constructed in every major township, and Arabic-script Jawi education is being integrated into all state schools. The new administration has also proposed merging traditional tribal courts into Sharia-influenced administrative structures. While the constitution remains nominally secular, the Prime Minister has declared that “Islam is the moral compass of the Sabahan people.”\n\nNon-Muslim indigenous communities and Christian missionaries have expressed concerns over the speed and depth of these reforms. Nonetheless, the USNO government insists that Islamic unity is the foundation for peace, morality, and modernization."
 NBO_Pol.10.a: "A victory for the Malay race."
 NBO_Pol.11.t: "Moro Unrest Ignites in Mindanao and the Sulu Archipelago"
 NBO_Pol.11.d: "Despite postwar reconstruction and centralization efforts, the southern regions of the Philippines—Mindanao, Sulu, and Tawi-Tawi—remain volatile. Long-standing tensions between the Moro Muslim populations and the Christian-dominated government in Manila have erupted again into localized armed unrest, particularly following rumors of foreign (particularly North Borneo and newly elected USNO Party) funding to Moro leaders.\n\nCalls for autonomy, protection of Islamic law, and resistance to resettlement policies from the north have grown louder. Meanwhile, armed bands affiliated with the Ansar al-Haqq, a newly emerged militant group, have attacked police stations and military outposts in Cotabato and Jolo.\n\nFurthermore, discontent is rising among the Tausug elites in Sulu, who see Manila’s renewed push to drop the Sabah claim as a betrayal of their historical rights and cultural memory."
 NBO_Pol.11.a: "Deploy the Constabulary"
 NBO_Pol.12.t: "North Borneo’s Constitution Finalized"
 NBO_Pol.12.d: "Today marks a historic turning point for our young dominion. After months of careful drafting, consultation with tribal leaders, settler representatives, civil servants, and legal experts, the North Bornean Constitution has been officially ratified and proclaimed in Jesselton.\n\nThe Constitution sets forth a bold and inclusive vision for the future:\n    All races, ethnic groups, and communities shall be equal under the law.\n    Political parties and civil organizations are granted full legal rights to form, campaign, and operate, so long as they respect the integrity of the state.\n    Freedom of belief is protected, yet the native spiritual traditions of North Borneo — rooted in adat, ancestral veneration, and the sacred harmony between humans and land — are recognized as the cultural and spiritual foundation of the nation.\n\nThe state shall remain secular in administration, but guided by indigenous ethics and reverence for natural order, allowing all faiths to flourish peacefully under the protection of the law."
 NBO_Pol.12.a: "Let this be the compact that unites our peoples in dignity and peace."