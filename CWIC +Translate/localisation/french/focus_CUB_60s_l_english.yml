 CUB_Crush_the_26th_of_July_Movement:0 "Répression contre le mouvement du 26 juillet"
 CUB_Implement_Land_Reform:0 "Mettre en œuvre une réforme agraire"
 CUB_the_final_revoultion:0 "La révolution finale"
 CUB_the_final_revoultion_desc:0 "Cuba ne sera plus le théâtre de la corruption que Batista a infligée au peuple de l'ancienne Cuba."
 CUB_bay_of_pigs_victory:0 "Victoire de la Baie des Cochons"
 CUB_bay_of_pigs_victory_desc:0 "Le gouvernement socialiste de Cuba n'est plus ; place à la libération du grand problème de Cuba."
 CUB_victorious_blaze:0 "Blaze victorieux"
 CUB_victorious_blaze_desc:0 "Batista s'y attendait depuis longtemps, ce n'était qu'une question de temps."
 CUB_the_cuban_missile_crisis:0 "La crise des missiles de Cuba"
 CUB_the_cuban_missile_crisis_desc:0 "Les États-Unis cherchent à démanteler Cuba par leur impérialisme ignoble. Nikita Khrouchtchev viendra en aide à Cuba dans sa lutte contre les impérialistes."
 CUB_the_provisional_cuban_government:0 "Le gouvernement provisioire cubain"
 CUB_the_provisional_cuban_government_desc:0 "Cuba doit assumer les responsabilités qui lui incombent."
 CUB_the_shut_down_of_brothels:0 "La fermeture des maisons closes"
 CUB_the_shut_down_of_brothels_desc:0 "Les maisons closes sont un symbole de la corruption qui a marqué l'histoire de Cuba sous le régime de Batista. Même si cela entraîne des pertes d'emploi, la population devra s'en accommoder."
 CUB_crusades_against_corruption:0 "Croisade contre la corruption politique"
 CUB_crusades_against_corruption_desc:0 "Si Batista a pris le pouvoir, c'est uniquement parce qu'il souhaitait s'en prendre à la population cubaine lors des élections de 1953."
 CUB_political_intensity:0 "Intensification politique"
 CUB_political_intensity_desc:0 "Le mouvement du 4 juillet s'est révélé agressif à long terme, car ses membres sont divisés entre le nationalisme cubain et le collectivisme cubain."
 CUB_governmental_resignation:0 "Démission du gouvernement"
 CUB_governmental_resignation_desc:0 "Si le régime actuel venait à se maintenir, cela ne ferait qu'aggraver la crise politique. Le gouvernement doit démissionner."
 CUB_educational_rehabilitation:0 "Réadaptation scolaire"
 CUB_educational_rehabilitation_desc:0 "Sous le régime de Batista, Cuba a dû faire de nombreux sacrifices pour survivre. L'un d'entre eux concernait les fondements de l'éducation cubaine."
 CUB_regime_stabilization:0 "Stabilisation du régime"
 CUB_regime_stabilization_desc:0 "Le régime actuel est enfin en voie de stabilisation, au point qu'une décision gouvernementale a été prise."
 CUB_execution_of_the_batista_era:0 "La fin de l'ère Batista"
 CUB_execution_of_the_batista_era_desc:0 "Cuba en a finalement assez des agissements de Batista, qui ont eu un impact négatif sur l'histoire du pays."
 CUB_public_persuadsion:0 "Négociation publique"
 CUB_public_persuadsion_desc:0 "Pour que le prochain régime puisse prendre le pouvoir, il aura besoin d'aide pour assurer sa propre stabilisation."
 CUB_che_in_the_barracks:0 "Guevara dans les casernes"
 CUB_che_in_the_barracks_desc:0 "Ernesto Guevara a été nommé à la tête de la caserne cubaine pour une raison bien précise: éliminer toute influence pro-Batista au sein de l'établissement, par tous les moyens nécessaires."
 CUB_youth_indoctination:0 "Endoctrinement de la jeunesse"
 CUB_youth_indoctination_desc:0 "Une fois de plus, ce sont les jeunes qui ont sauvé Cuba. Ils doivent continuer à le faire."
 CUB_path_to_democracy:0 "Chemin vers les valeurs démocratiques"
 CUB_path_to_democracy_desc:0 "La démocratie, même si elle ne correspond pas à nos idéaux, doit être garantie pour assurer la protection du peuple cubain."
 CUB_one_party_socialism_in_the_cuban_state:0 "Le socialisme à parti unique dans l'État cubain"
 CUB_one_party_socialism_in_the_cuban_state_desc:0 "Ce n'est que par des moyens énergiques que Cuba a pu être pleinement protégée par les idéaux du socialisme."
 CUB_the_crazied_devil_che_guervara:0 "Che Guevara, le diable fou"
 CUB_the_crazied_devil_che_guervara_desc:0 "Ernesto Guevara bénéficie du soutien du peuple cubain, c'est lui qui devra nous diriger pour l'instant."
 CUB_a_revoultionary_regiment:0 "Un régiment révolutionnaire"
 CUB_a_revoultionary_regiment_desc:0 "Guevara aspire à disposer de son propre régiment de partisans révolutionnaires, formés aux côtés d'anciens républicains de l'Espagne défunte."
 CUB_cultural_revoultion:0 "La révolution culturelle"
 CUB_cultural_revoultion_desc:0 "Cuba restera toujours aux mains de ces sales impérialistes, à moins que nous n'agissions."
 CUB_the_soldier_raul_castro:0 "Le soldat Raul Castro"
 CUB_the_soldier_raul_castro_desc:0 "Raúl Castro a l'intention de faire de Cuba un État isolationniste."
 CUB_mafia_witch_hunts:0 "Chasses aux sorcières contre la mafia"
 CUB_mafia_witch_hunts_desc:0 "Peu importe où dans le monde, nous ferons tout notre possible pour éradiquer la mafia et tous ses principes de la surface de la planète, en raison de ce qu’elle a fait à la glorieuse Cuba."
 CUB_state_visit_to_the_USA:0 "Visite d'État aux États-Unis"
 CUB_state_visit_to_the_USA_desc:0 "Cuba est secrètement dirigée par un régime de gauche sous leur nez, le régime actuel devra en prendre acte et organiser une visite à Washington afin d'éviter de susciter les soupçons du gouvernement américain."
 CUB_the_progressive_movement:0 "Le mouvement progressiste"
 CUB_the_progressive_movement_desc:0 "Le Mouvement progressiste est ce que le peuple cubain a tenté de recréer après la dissolution du Parti authentique et du Parti orthodoxe."
 CUB_increase_wages_for_the_middle_class:0 "Augmenter les salaires de la classe moyenne"
 CUB_increase_wages_for_the_middle_class_desc:0 "Les classes moyennes et défavorisées doivent être intégrées aux fondements de la société des nantis, afin de permettre une amélioration continue."
 CUB_introduce_a_welfare_state:0 "Introduire l'état-providence"
 CUB_introduce_a_welfare_state_desc:0 "Le régime adhère aux idéaux d'un capitalisme social."
 CUB_national_industrialization:0 "Industrie nationale"
 CUB_national_industrialization_desc:0 "Ces derniers temps, Cuba cherche désespérément à s'industrialiser."
 CUB_moderate_socialism:0 "Le socialisme modéré"
 CUB_moderate_socialism_desc:0 "Même s'il ne s'agit pas d'un \"véritable\" socialisme, cela pourrait susciter moins de polémiques à Cuba."
 CUB_progressive_land_reform:0 "Réforme agraire progressive"
 CUB_progressive_land_reform_desc:0 "Il faudra mettre en place une réforme agraire afin de compenser la superficie des terres que Cuba détient."
 CUB_the_world_revoultion:0 "La révolution mondiale"
 CUB_the_world_revoultion_desc:0 "Si le monde ne veut pas d'une révolution de nos idéaux, c'est à la révolution de venir au monde."
 CUB_rebellion_in_the_americas:0 "Révolution aux Amériques"
 CUB_rebellion_in_the_americas_desc:0 "Les Amériques ne seront plus le terrain de jeu des États-Unis, elles formeront un ensemble de pays collectivisés, à l'image de notre propre union."
 CUB_cooperation_in_buenos_aires:0 "Coopération à Buenos Aires"
 CUB_cooperation_in_buenos_aires_desc:0 "Le péronisme argentin a marqué l'histoire de l'Argentine en suscitant des sympathies tant à gauche qu'à droite, une alliance économique doit être conclue entre La Havane et Buenos Aires."
 CUB_bolivian_socialism:0 "Socialisme bolivien"
 CUB_bolivian_socialism_desc:0 "La Bolivie semble être extrêmement affaiblie, notamment en raison du désespoir que lui ont infligé ses voisins et les États-Unis."
 CUB_racial_opptunity:0 "Égalité des chances entre les races"
 CUB_racial_opptunity_desc:0 "Cuba sera reconnue comme un haut lieu des idéaux antiracistes."
 CUB_colombian_leftism:0 "Gauchisme colombien"
 CUB_colombian_leftism_desc:0 "La Colombie est en ruine, tant à gauche qu'à droite, mais Cuba ne s'intéresse qu'à la gauche."
 CUB_the_secret_revoultion:0 "La révolution secrète"
 CUB_the_secret_revoultion_desc:0 "Le mouvement du 4 juillet s'est formé en réaction à notre mépris pour la société démocratique, ce qui l'a conduit à se tourner vers des initiatives plus radicales."
 CUB_extensive_taxation:0 "Fiscalité globale"
 CUB_extensive_taxation_desc:0 "Qu'on soit riche ou pauvre, Cuba aspire à la collectivisation de tous les biens de valeur afin de retrouver sa grandeur."
 CUB_posadist_legacy:0 "Un nouvel héritage"
 CUB_posadist_legacy_desc:0 "Née en Argentine, pays amical, le posadisme est une idéologie issue du trotskisme selon laquelle une société avancée comme la nôtre devrait être aussi avancée que des extraterrestres."
 CUB_removal_of_private_property:0 "L'expropriation de biens privés"
 CUB_removal_of_private_property_desc:0 "La propriété privée ne fait que creuser le fossé entre les classes, il faut la collectiviser à l'extrême."
 CUB_rally_for_rocketry:0 "Rassemblement pour l'astronautique"
 CUB_rally_for_rocketry_desc:0 "La seule façon de rencontrer nos héros est de s'envoler au-delà des étoiles, si ce n'est pas aujourd'hui, alors ça sera demain."
 CUB_consolidation_of_power:0 "Consolider le pouvoir"
 CUB_consolidation_of_power_desc:0 "De nombreux régimes avant nous ont échoué lamentablement en raison de leur incapacité à mener à bien leur consolidation politique."
 CUB_anti_communist_rhetoric:0 "Rhétorique anti-communiste"
 CUB_anti_communist_rhetoric_desc:0 "Le communisme n'apporte que la destruction et aggrave encore davantage les troubles politiques et sociaux. C'est pourquoi il est néfaste pour l'avenir de Cuba."
 CUB_prosecution_of_batistos:0 "Poursuites judiciaires à l'encontre des fidèles partisans de Batista"
 CUB_prosecution_of_batistos_desc:0 "Batista a des partisans aux agissements déments, que leurs agissements soient violents ou constitutionnels, Cuba ne peut pas les laisser agir en toute impunité."
 CUB_deal_with_the_usa:0 "Accord avec les États-Unis"
 CUB_deal_with_the_usa_desc:0 "Les États-Unis d'Amérique ont soutenu notre régime jusqu'à présent, autant poursuivre sur cette lancée."
 CUB_strike_against_leftist_strongholds:0 "Offensive contre les bastions de gauche"
 CUB_strike_against_leftist_strongholds_desc:0 "Si les critiques incessantes de la gauche ne font qu'aggraver notre situation, une option radicale pourrait peut-être apporter une réponse à leurs doléances."
 CUB_cuban_isolationism:0 "L'isolationnisme cubain"
 CUB_cuban_isolationism_desc:0 "Le peuple cubain en a assez que les États-Unis se mêlent de ses affaires, après cela, les États-Unis pourraient bien cesser un moment de s'en prendre à Cuba."
 CUB_prosecution_against_batista:0 "Poursuite contre Batista"
 CUB_prosecution_against_batista_desc:0 "Que les Nations Unies soient de notre côté ou non, Batista devra être traduit en justice par tous les moyens possibles."
 CUB_allow_the_secular_clubs:0 "Autoriser les clubs laïques"
 CUB_allow_the_secular_clubs_desc:0 "Ces clubs encouragent des comportements illégaux et ont été fortement soutenus sous le régime de Batista, cependant si nous les fermions, cela pourrait mettre en péril l'emploi de nombreuses personnes."
 CUB_ban_the_secular_clubs:0 "Interdire les clubs laïques"
 CUB_ban_the_secular_clubs_desc:0 "Ces clubs encouragent des comportements illégaux et ont été fortement soutenus sous le régime de Batista, mais cela n'a aucune importance. Cuba devra endurer ces épreuves pour devenir une nation plus civilisée sur la scène internationale."
 CUB_crackdown_on_infamous_corruption:0 "Réprimer l'infâme corruption"
 CUB_crackdown_on_infamous_corruption_desc:0 "Batista a peut-être laissé la mafia sévir sur le sol cubain, mais la junte militaire ne permettra pas qu'une telle chose se reproduise."
 CUB_the_education_womb:0 "Le berceau de l'éducation"
 CUB_the_education_womb_desc:0 "L'éducation a été détruite sous le régime de Batista, il est donc primordial de démolir les maisons closes et de construire des écoles à leur place."
 CUB_soviet_guarentee:0 "La garantie soviétique"
 CUB_soviet_guarentee_desc:0 "Cuba dispose de missiles pouvant menacer les États-Unis, c'est à l'URSS qu'il revient de décider de les utiliser ou non, mais ce qui est certain pour Cuba, c'est que notre indépendance est menacée par la rhétorique impérialiste des États-Unis."
 CUB_cuban_missiles:0 "Les missiles cubains"
 CUB_cuban_missiles_desc:0 "Ces missiles soviétiques sont ce dont Cuba avait besoin, bien que l'URSS n'en ait pas conscience, Cuba va démonter certains de ces missiles pour en tirer profit."
 CUB_consolidation_of_the_caribbean:0 "Affirmation de l'État"
 CUB_consolidation_of_the_caribbean_desc:0 "Les États-Unis disposent d'une emprise redoutable dans les Caraïbes, grâce à leur influence, ils peuvent contrôler Haïti et la République dominicaine."
 CUB_goal_against_the_domician:0 "Justification contre la République Dominicaine"
 CUB_goal_against_the_domician_desc:0 "La République dominicaine représente une menace pour le marxisme cubain, la consolidation de Cuba est compromise."
 CUB_attack_haiti:0 "L'invasion d'Haïti"
 CUB_attack_haiti_desc:0 "Haïti sera liberée de l'impérialisme américain"
 CUB_prepare_for_an_us_counterattack:0 "Se préparer à une invasion américaine"
 CUB_prepare_for_an_us_counterattack_desc:0 "Ces sales impérialistes croient pouvoir débarquer à Cuba sans rencontrer la moindre résistance, mais ils vont devoir se battre."
 CUB_anti_aircraft:0 "Canons anti-aériens"
 CUB_anti_aircraft_desc:0 "Cuba doit être protégée des invasions aériennes."
 CUB_prime_minister_castro:0 "Le premier ministre Fidel Castro"
 CUB_prime_minister_castro_desc:0 "Fidel Castro dirige déjà ce pays, alors pourquoi pas officiellement ?"
 CUB_agarian_land_reform:0 "Réformes agraires"
 CUB_agarian_land_reform_desc:0 "La terre sera répartie équitablement entre le peuple."
 CUB_finacial_distribution:0 "Redistribution financière"
 CUB_finacial_distribution_desc:0 "Tous les Cubains doivent bénéficier de l'égalité des chances."
 CUB_military_isolation:0 "Isolationnisme militaire"
 CUB_military_isolation_desc:0 "Raúl Castro n'est ni une marionnette de l'Union soviétique ni de la République populaire de Chine."
 CUB_closer_ties_with_the_prc:0 "Des relations plus étroites avec la République populaire de Chine"
 CUB_closer_ties_with_the_prc_desc:0 "La République populaire de Chine défend de grands idéaux que Che partage, peut-être qu'ensemble, la révolution pourra se poursuivre."
 CUB_closer_ties_with_the_USSR:0 "Des liens plus étroits avec l'Union soviétique"
 CUB_closer_ties_with_the_USSR_desc:0 "L'Union soviétique est le plus grand exportateur de la Révolution, son objectif est similaire au nôtre: nous libérer de l'impérialisme occidental."
 CUB_venture_in_africa:0 "Sorties en Afrique"
 CUB_venture_in_africa_desc:0 "L'Afrique est le maillon faible de l'impérialisme occidental, notre mission est de libérer ses peuples de l'oppression."
 CUB_state_visit_to_santiago:0 "Visite d'État à Santiago"
 CUB_state_visit_to_santiago_desc:0 "Compte tenu du succès remporté par la gauche dans l'un des pays les plus puissants d'Amérique du Sud, les forces alliées de cette rébellion doivent se réunir pour discuter de l'évolution future du socialisme coopératif."
 CUB_the_shining_path:0 "Le sentier lumineux"
 CUB_the_shining_path_desc:0 "Compte tenu de la victoire de l'extrême gauche au Pérou, nos forces doivent entretenir des relations amicales avec ce pays, sous peine de voir la situation dégénérer."
 CUB_the_angolan_civil_war:0 "La guerre civile angolaise"
 CUB_the_angolan_civil_war_desc:0 "Les rebelles communistes en Angola ont besoin du soutien cubain pour rester anti-impérialistes."
 CUB_the_six_days_war:0 "La guerre des Six Jours"
 CUB_the_six_days_war_desc:0 "L'Égypte est la cible de l'impérialisme occidentalm elle a besoin de l'aide de Cuba pour libérer le Moyen-Orient de l'impérialisme occidental."
 CUB_south_african_marxism:0 "Le marxisme sud-africain"
 CUB_south_african_marxism_desc:0 "Cuba va lancer une opération visant à porter la révolution en Afrique du Sud, avec notre soutien et nos idéaux."
 CUB_state_visit_to_algiers:0 "Visite d'état à Algiers"
 CUB_state_visit_to_algiers_desc:0 "L'Algérie est victime de l'impérialisme occidental. Nous devons lui apporter notre soutien."
 CUB_support_the_congo:0 "Soutenir le Congo"
 CUB_support_the_congo_desc:0 "Le Congo a désespérément besoin de renforts cubains pour préserver son indépendance."
 CUB_marxist_leninist_rhetoric:0 "Rhétorique Marxiste-Léniniste"
 CUB_marxist_leninist_rhetoric_desc:0 "Seul le marxisme-léninisme peut rassembler le peuple afin de parvenir au \"vrai\" communisme."
 CUB_the_non_aligned_movement:0 "Le mouvement non-aligné"
 CUB_the_non_aligned_movement_desc:0 "Cuba s'alliera à la Yougoslavie, car nous partageons les mêmes idéaux face à l'Est comme à l'Ouest."
 CUB_incite_rallies_against_radicals:0 "Appeler à manifester contre les radicaux"
 CUB_incite_rallies_against_radicals_desc:0 "Les radicaux cubains comprennent les factions d'extrême droite et d'extrême gauche, notre gouvernement mettra un terme à toutes les initiatives politiques que ces factions pourraient tenter de mener."
 CUB_a_modern_constitution:0 "Une constitution moderne"
 CUB_a_modern_constitution_desc:0 "Seule une Constitution fondée sur le droit peut assurer l'avenir de Cuba pour de nombreuses années encore."
 CUB_the_militaristic_era:0 "L'ère militariste"
 CUB_the_militaristic_era_desc:0 "À la suite d'un vote populaire, le peuple cubain a décidé de maintenir la junte."
 CUB_the_washington_dc_meeting:0 "Réunion à Washington"
 CUB_the_washington_dc_meeting_desc:0 "L'actuel président des États-Unis nous a invités à une réunion à Washington D.C. afin de discuter de notre politique étrangère."
 CUB_the_cuban_revoultionary_council:0 "Le conseil révolutionnaire cubain"
 CUB_the_cuban_revoultionary_council_desc:0 "Le Conseil révolutionnaire cubain prendra le pouvoir à la suite d'un vote populaire, son dirigeant, José Cordona, souhaite retourner à Cuba après avoir été contraint de démissionner."
 CUB_recruitment_propaganda:0 "Propagande de recrutement"
 CUB_recruitment_propaganda_desc:0 "Le peuple cubain ne voudra pas se rallier à notre cause de son plein gré, il faudra donc mettre en place une conscription obligatoire par tous les moyens."
 CUB_militaristic_rhetoric:0 "Rhétorique militariste"
 CUB_militaristic_rhetoric_desc:0 "Cuba et son peuple savent tous deux que la seule façon de rester indépendants est de s'entraîner jusqu'à ce que la bataille éclate."
 CUB_corporatist_economic_policies:0 "Politiques economiques corporatistes"
 CUB_corporatist_economic_policies_desc:0 "Seul le corporatisme peut nous apporter la richesse."
 CUB_civilian_economy:0 "Économie civile"
 CUB_civilian_economy_desc:0 "Le néolibéralisme, bien qu'il s'agisse d'un idéal économique expérimental, pourrait être la voie à suivre pour redynamiser notre industrie."
 CUB_private_land_ownership:0 "Propriété privée de la terre"
 CUB_private_land_ownership_desc:0 "La collectivisation des terres est un fléau dont souffre la majeure partie de l'extrême gauche, il faut l'éradiquer."
 CUB_medicine_through_virture:0 "La médecine par la vertu"
 CUB_medicine_through_virture_desc:0 "Pour panser les blessures de Cuba, nos idéaux religieux doivent être remis en pratique."
 CUB_family_values:0 "Valeurs familiales"
 CUB_family_values_desc:0 "Nous avons besoin de nos valeurs pour que Cuba fonctionne mieux."
 CUB_an_new_cuban_tradition:0 "Une nouvelle tradition cubaine"
 CUB_an_new_cuban_tradition_desc:0 "L'heure est venue de mettre en œuvre des idées novatrices, notre nouvelle tradition s'avérera extrêmement efficace dans un avenir proche."
 CUB_stronghold_of_the_caribbean_right:0 "Bastion de la droite caribéenne"
 CUB_stronghold_of_the_caribbean_right_desc:0 "Les Caraïbes ont enfin été libérées de tout comportement extrémiste, il est temps que Cuba vienne en aide à ses voisins."
 CUB_ventures_in_europe:0 "Sorties en Europe"
 CUB_ventures_in_europe_desc:0 "L'Europe en veut toujours à ceux qui font preuve de faiblesse et est vulnérable aux idéologies néfastes émanant de ses propres citoyens, notre représentation pourrait changer cela."
 CUB_helping_hand_of_the_americas:0 "Une main tendue aux Amériques"
 CUB_helping_hand_of_the_americas_desc:0 "Ces derniers temps, les Amériques ont été marquées par l'extrémisme et le ressentiment. Notre représentation pourrait changer la donne."
 CUB_denunciation_of_spains_legacy:0 "Dénonciation de l'héritage espagnol"
 CUB_denunciation_of_spains_legacy_desc:0 "Il est important de dénoncer les pratiques du fascisme, notamment à travers l'histoire de l'Espagne, afin de susciter un mouvement antifasciste à l'échelle du continent."
 CUB_aid_in_the_reconstruction_of_germany:0 "Aide à la reconstruction de l'Allemagne"
 CUB_aid_in_the_reconstruction_of_germany_desc:0 "L'Allemagne a été durement touchée par ses efforts de guerre passés et elle est encore en train de s'en remettre, nous devons tendre la main à ce pays au cœur brisé."
 CUB_the_valparaiso_summit:0 "Le sommet de Valparaiso"
 CUB_the_valparaiso_summit_desc:0 "C'est à Valparaiso, au Chili, que se tiendra la réunion consacrée à l'examen des projets concernant le Sud de l'Amérique du Sud."
 CUB_the_cuban_marshall_plan:0 "Le plan Marshall cubain"
 CUB_the_cuban_marshall_plan_desc:0 "Grâce à notre influence en Amérique du Nord, Cuba a réussi à convaincre les États-Unis d'adopter un plan Marshall à l'échelle des Amériques."
 CUB_coastal_forts_across_cuba:0 "Les forts côtiers à travers Cuba"
 CUB_coastal_forts_across_cuba_desc:0 "Cuba se défendra comme si elle faisait face à une invasion navale."
 CUB_deal_with_hershey:0 "Un accord avec Hershey"
 CUB_washington_havana_joint_commission:0 "Commission Washington-La Havane"
 CUB_washington_havana_joint_commission_desc:0 "Nous devrions collaborer avec les responsables à Washington."
 CUB_state_visit_to_paris:0 "Visite d'état à Paris"
 CUB_expel_anti_american_influence:0 "Expulser l'influence anti-américaine"
 CUB_sino_cuban_pact:0 "Pacte sino-cubain"
 CUB_enviromental_supervision:0 "Contrôle environnemental"
 CUB_international_meeting_in_havana:0 "Réunion internationale à La Havane"