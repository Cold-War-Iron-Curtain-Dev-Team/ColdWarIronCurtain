l_english:
 suezcrisis.1.d:0 "Aujourd'hui, le gouvernement égyptien a décidé d'abroger unilatéralement le traité anglo-égyptien de 1936. Cette décision a suscité une vive inquiétude, beaucoup soupçonnant l'Égypte de convoiter le canal."
 suezcrisis.2.d:0 "Aujourd'hui, le canal de Suez est légitimement repris et les impérialistes seront chassés ! Les forces égyptiennes ont pénétré dans le canal et en ont pris le contrôle. Le gouvernement a rapidement proclamé la nationalisation du canal de Suez. Les impérialistes sont sous le choc, mais nous sommes convaincus qu'ils sont impuissants à nous arrêter."
 suezcrisis.3.d:0 "Nos craintes concernant le sort du canal de Suez se sont confirmées, l'Égypte s'étant emparée du canal et l'ayant nationalisé. Il s'agit d'un danger sans précédent pour notre économie et notre prestige international ; nous devons agir."
 suezcrisis.4.d:0 "L'Égypte a scandaleusement nationalisé le canal de Suez, mettant gravement en péril nos routes commerciales. Nous ne sommes pas les seuls à être paniqués, car les Britanniques en subissent les conséquences les plus graves. Nous avons décidé de collaborer avec les Britanniques à un plan visant à annuler la nationalisation du canal ; l'Égypte ne peut pas s'en tirer impunément."
 suezcrisis.5.d:0 "Alors que l'Égypte a nationalisé le canal de Suez, mettant en péril le commerce international, elle a également décidé de bloquer une voie commerciale vitale pour nous, le détroit de Tiran, empêchant ainsi nos navires de commercer avec le reste du monde. Nous ne pouvons pas laisser cette situation perdurer ; nous devons y mettre un terme."
 suezcrisis.6.d:0 "Craignant une escalade de la situation, les États-Unis ont organisé une conférence internationale pour tenter de résoudre la crise. De nombreux pays ont campé sur leurs positions concernant la propriété du canal, sans qu'aucune partie ne semble céder. Cette conférence s'est soldée par un échec, la situation continuant de s'aggraver."
 suezcrisis.7.d:0 "Aujourd'hui, une réunion secrète s'est tenue à Sèvres, en France, entre des représentants britanniques, français et israéliens. Tous les pays présents sont indignés par la nationalisation du canal par l'Égypte et sont favorables à une action visant à annuler cette nationalisation. Le plan prévoit que les forces israéliennes attaquent la péninsule du Sinaï, s'arrêtent près du canal, puis laissent les forces britanniques et françaises prendre d'assaut le canal et submerger les Égyptiens, mettant ainsi fin au conflit."
 suezcrisis.8.d:0 "Aujourd'hui, une réunion secrète s'est tenue à Sèvres entre des représentants britanniques, français et israéliens. Tous les pays présents sont indignés par la nationalisation du canal par l'Égypte et sont favorables à une action visant à annuler cette nationalisation. Le plan prévoit que les forces israéliennes attaquent la péninsule du Sinaï, s'arrêtent près du canal, puis laissent les forces britanniques et françaises prendre d'assaut le canal et submerger les Égyptiens, mettant ainsi fin au conflit."
 suezcrisis.9.d:0 "Le plan franco-britannique, l'opération Mousquetaire, a été approuvé et est en attente de mise en œuvre. Initialement, l'opération prévoyait un débarquement franco-britannique à Alexandrie, mais le site de débarquement a été déplacé à Port-Saïd afin de minimiser les pertes civiles. L'objectif est de prendre rapidement le contrôle du canal avant que les Égyptiens n'aient le temps de réagir."
 suezcrisis.10.d:0 "Aujourd'hui, les forces franco-britanniques ont débarqué à Port-Saïd et se sont rapidement emparées de la ville après un bref combat contre les forces égyptiennes qui la défendaient. La pression s'accentuant, nous devons atteindre les objectifs de l'opération, faute de quoi elle se soldera par un échec."
 suezcrisis.11.d:0 "Les manifestations contre notre invasion ont commencé à s'intensifier, socialistes et non-interventionnistes exigeant l'arrêt de l'opération. Le gouvernement ferme largement les yeux sur ces protestations, espérant qu'elles s'apaiseront d'elles-mêmes."
 suezcrisis.12.d:0 "Aujourd'hui, l'offensive finale dans le canal de Suez et l'opération Mousquetaire sont en cours. Un succès mettra rapidement fin à l'opération, tandis qu'un échec ou une impasse conduira à son échec, la pression de l'ONU forçant nos troupes à l'abandonner."
 suezcrisis.13.d:0 "Mauvaise nouvelle : notre offensive est bloquée par la détermination des défenseurs égyptiens. Nous ne pouvons plus qu’attendre un cessez-le-feu décrété par l’ONU. L’opération est un échec."
 suezcrisis.14.d:0 "Bonne nouvelle ! Notre offensive a porté ses fruits : les forces égyptiennes, prises de panique, ont battu en retraite du canal. Nous disposons désormais d’un avantage considérable pour les négociations à venir. L’opération Mousquetaire est un succès retentissant."
 suezcrisis.15.d:0 "Un cessez-le-feu a été décrété par l'ONU. Nos troupes doivent quitter l'Égypte aujourd'hui. Nos relations avec les États-Unis ont été mises à mal par cette opération, qui est globalement perçue comme un échec retentissant."
 suezcrisis.16.d:0 "Un nouveau traité a été signé, le traité d'Alexandrie, par lequel l'Égypte rétrocède le canal de Suez à la Compagnie du canal de Suez et démilitarise la péninsule du Sinaï et la bande de Gaza. Une victoire pour notre politique étrangère."
 suezcrisis.17.d:0 "Les impérialistes anglo-saxons, français et israéliens, se sont retirés après leurs vaines tentatives de conquête de notre nation. Notre dirigeant est salué comme le sauveur du monde arabe. Une victoire de propagande pour notre pays."
 suezcrisis.18.d:0 "Les impérialistes anglo-saxons, français et israéliens, se sont retirés, mais non sans nous avoir imposé un traité injuste et humiliant. Cela nuira assurément à la popularité de notre régime."
 suezcrisis.19.d:0 "La délégation israélienne a décidé de s'abstenir de participer à notre projet de prise de contrôle du canal, par crainte de représailles internationales. Il nous faudrait un autre casus belli pour intervenir ; des plans sont déjà en cours d'élaboration."
 suezcrisis.20.d:0 "Décrivez comment les Israéliens, bien qu'ayant remporté la victoire, ont dû battre en retraite sous la pression politique."
 suezcrisis.0.d:0 "Décrivez comment l'Égypte a finalement abrogé le traité"
 OperationKadesh.1.d_1:0 "Aujourd'hui, le Premier ministre israélien [Root.GetLeader], le directeur général du ministère de la Défense, Shimon Peres, et le chef d'état-major, Moshe Dayan, ont rencontré secrètement le ministre français de la Défense, le ministre des Affaires étrangères et le chef d'état-major, ainsi que le ministre britannique des Affaires étrangères et son assistant, dans une maison isolée de Sèvres. Ils ont discuté de l'urgence de la situation en Égypte et de leur réaction à la nationalisation du canal de Suez par l'Égypte. Ils ont ensuite planifié une invasion de l'Égypte en deux temps, assortie d'une version officielle des faits à communiquer au monde. Le délégué israélien, craignant d'être abandonné par la France et la Grande-Bretagne en cours d'invasion, a exigé que toutes les parties signent un document d'engagement mutuel. Tous les dirigeants ont quitté les lieux avec des exemplaires de l'accord. Il ne nous reste plus qu'à préparer une invasion du Sinaï, tandis que les puissances occidentales concentrent leurs efforts sur l'Égypte."
 OperationKadesh.1.d_2:0 "Aujourd'hui, le Premier ministre [Root.GetLeader], le directeur général du ministère de la Défense et le chef d'état-major ont rencontré secrètement le ministre français de la Défense, le ministre des Affaires étrangères et le chef d'état-major, ainsi que le ministre britannique des Affaires étrangères et son assistant, dans une maison isolée de Sèvres. Ils ont discuté de l'urgence de la situation en Égypte et de leur réaction à la nationalisation du canal de Suez par l'Égypte. Ils ont ensuite planifié une invasion de l'Égypte en deux temps, assortie d'une version officielle des faits à communiquer au monde. Les Israéliens, craignant d'être abandonnés par la France et la Grande-Bretagne en cours d'invasion, ont exigé que toutes les parties signent un document d'engagement mutuel. Tous les dirigeants ont quitté les lieux avec des exemplaires de l'accord. Il ne nous reste plus qu'à préparer une invasion du Sinaï pendant que les puissances occidentales concentrent leurs efforts sur l'Égypte."
 OperationKadesh.2.d:0 "Notre intégration au plan franco-britannique visant à renverser Nasser impliquait de sécuriser la péninsule du Sinaï pendant que les forces franco-britanniques attaqueraient le canal. Le plan interdisant une frappe préventive sur les bases aériennes égyptiennes, nous avons dû recourir aux parachutistes pour atteindre nos objectifs. Le 890e bataillon de parachutistes, commandé par le commandant Rafael Eitan, a été largué aux abords orientaux du col de Mitla et a dû tenir la position pendant plusieurs heures, en attendant le renfort du reste des parachutistes."
 OperationKadesh.3.d:0 "L'un de nos principaux objectifs était de stopper les incursions des Fedayeen en Israël. Alors que beaucoup s'attendaient à trouver des bases Fedayeen à la fois à Gaza et dans la péninsule du Sinaï, Tsahal n'en a découvert aucune dans le Sinaï et a donc décidé de détruire toute base Fedayeen qu'elle pourrait trouver à Gaza. Une fois ces opérations menées à bien, beaucoup estiment que les Fedayeen seront considérablement affaiblis et ne constitueront plus une menace majeure."
 OperationKadesh.4.d:0 "Notre offensive principale dans la péninsule du Sinaï a véritablement débuté aujourd'hui, avec le déploiement de nos forces en direction d'Arish, d'Abu Ageila et du col de Mitla. L'opération Kadesh peut commencer dès maintenant."
 OperationKadesh.5.d:0 "Alors que le reste de l'opération se déroule sans encombre, Tsahal a rencontré des difficultés pour s'emparer des importants carrefours routiers d'Abu Ageila et d'Um Katef. Après un assaut frontal infructueux, des renforts blindés ont permis à Tsahal de percer les lignes égyptiennes et de prendre le contrôle de la quasi-totalité du nord de la péninsule du Sinaï."
 OperationKadesh.6.d:0 "Un autre point stratégique à conquérir est le col de Mitla, celui-là même où la 890e brigade de parachutistes avait été déployée quelques jours auparavant. Avec l'arrivée des renforts, les parachutistes commencèrent à prendre le contrôle du col, déclenchant une longue et sanglante bataille contre l'armée égyptienne. Une légende raconte que le soldat Yehuda Ken-Dror aurait foncé en jeep dans le col pour attirer les tirs égyptiens, se sacrifiant ainsi. Après les combats, on dénombrait 38 parachutistes tués, 120 blessés et 260 Égyptiens morts. À ce moment-là, les Égyptiens battaient en retraite pour défendre le canal de Suez, mettant fin à la résistance dans le nord du Sinaï."
 OperationKadesh.7.d:0 "Durant son séjour dans la péninsule du Sinaï, l'armée israélienne a entrepris de détruire les infrastructures égyptiennes afin d'entraver toute avancée future du pays. Ces destructions allaient constituer un véritable fardeau pour les Égyptiens pendant longtemps."
 OperationKadesh.8.d:0 "L'armée israélienne a pris aujourd'hui le contrôle du port stratégique de Charm el-Cheikh, ce qui lui permet de contrôler le Sud-Sinaï et de neutraliser le blocus égyptien dans les détroits de Tiran et d'Aqaba."
 OperationKadesh.9.d:0 "La pression internationale s'accentue sur nous, la Grande-Bretagne et la France, pour que nous mettions fin à l'opération et nous retirions respectivement du Sinaï et du canal de Suez. Cette situation a culminé avec les avertissements fermes lancés par les États-Unis et l'URSS nous enjoignant de nous retirer du Sinaï. Bien que certains s'opposent à ce retrait, nous n'avons guère le choix, car nous ne voulons pas nous attirer les foudres des États-Unis."
 OperationKadesh.10.d:0 "Suite au succès de l'offensive finale britannique, l'Égypte fut contrainte à une paix humiliante, cédant le canal de Suez à la Suez Canal Corporation (et de facto à la Grande-Bretagne), et se voyant interdire tout déploiement de troupes dans le canal. Le traité démilitarisa également la péninsule du Sinaï après que les Britanniques eurent promis de se retirer. La démilitarisation du Sinaï bénéficia d'un large soutien en Israël et rares furent ceux qui s'opposèrent au retrait."
 OperationKadesh.11.d:0 "Comme nous nous étions opposés à l'adhésion au plan franco-britannique visant à prendre le contrôle du canal de Suez, le haut commandement de Tsahal a commencé à élaborer des plans pour mettre fin une fois pour toutes à la menace fedayeen. Le plan, baptisé Opération Mapatz, consistait à parachuter des troupes dans la bande de Gaza, un foyer d'activité fedayeen, et à semer la destruction dans toutes les bases fedayeen qu'elles pouvaient trouver. Deux heures plus tard, des groupes mécanisés appuyaient les parachutistes dans leur mission, qui s'est soldée par un succès retentissant et un affaiblissement considérable des fedayeen. Après l'opération, de nombreux experts estiment que la menace fedayeen est définitivement éradiquée."
 isr_eng.1.d:0 "Si Israël dit oui, ils obtiennent des alt-sevres. Si non, rien ne se passe."
 isr_eng.2.d:0 "Tristesse"
 isr_eng.3.d:0 "Les objectifs militaires d'Israël"
 isr_eng.4.d:0 "Les objectifs militaires de la Grande-Bretagne"
 isr_eng.5.d:0 "L'aide britannique à Israël"
 fra_eng.1.d:0 "Un demi-youpi ! La Grande-Bretagne et la France auront droit à des événements pour alt-sevres 2."
 fra_eng.2.d:0 "La Grande-Bretagne mènera une opération sous faux drapeau pour justifier son invasion."
 fra_eng.3.d:0 "La France envahira et/ou bombardera"
 fra_eng.4.d:0 "Attaque sous faux drapeau. Aucun effet pour l'instant."