 ino_war.2.t: "The Story of Komarudin"
 ino_war.2.d: "In the annals of history, most of those who fought for independence were somewhat limited to the groups that inhabited the territory prior to colonization, yet one name stands out the most.\n\nKomarudin was not always called Komarudin. His real name was Yang Chil-seong, a Korean national who was stranded in our country not by force, but by choice. When we declared our independence in 1945, Korea was liberated by both the Soviets and the Americans, but Yang did not return there. Instead, he stayed, married an Indonesian national, and changed his name. Joining the newly established TKR in 1945, Yang fought in guerrilla warfare as part of a group dubbed “Pasukan Pangeran Papak,” based in Wanaraja, Garut.\n\nWhen the Dutch occupied Wanaraja, Yang and his battalion were forced to retreat into the mountains of Galunggung, where they carried on the fight through relentless guerrilla warfare. From the forests and highlands, they struck the occupying forces whenever the opportunity arose, refusing to surrender despite overwhelming pressure. Ultimately, betrayal led to Yang’s capture in 1948, and after a lengthy trial, he was executed on May 21st, 1949, bringing a tragic end to a life spent in unwavering resistance."
 ino_war.2.a: "Hero of Indonesia and Korea."
 ino_war.3.t: "[GetNewspaperHeader]Indonesia Joined the United Nations in Korea!"
 ino_war.3.d: "Following the abolition of Indonesia’s federal structure, Prime Minister Mohammad Hatta closely monitored developments in other parts of the world, with the ongoing Korean War drawing particular attention. As a newly independent nation navigating its place on the international stage, Indonesia viewed global events, especially those in Asia as closely connected to its own aspirations for stability and sovereignty.\n\nDetermined to support a fellow emerging democracy in Asia, Indonesia ratified United Nations Resolution 83 and formally dispatched its troops to South Korea. This decision was officially welcomed by the United Nations, which expressed hope that Indonesia’s contribution would help guide the Korean Peninsula toward eventual peace and reunification under the Republic of Korea."
 ino_war.3.a: "Interesting Development."