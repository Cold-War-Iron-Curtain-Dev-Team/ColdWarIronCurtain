l_english:
 northseaflood.1.d:0 "Une violente tempête a frappé les îles Britanniques et les Pays-Bas le 31 janvier 1953, provoquant des inondations et d'importants dégâts. Elle a fait 2 551 victimes, principalement aux Pays-Bas et en Belgique, et a entraîné une crue de 5,6 mètres au-dessus du niveau de la mer, submergeant 1 370 kilomètres carrés de terres agricoles néerlandaises. De nombreuses digues ont cédé, forçant 70 000 personnes à évacuer. L'armée américaine a dépêché des hélicoptères pour participer aux opérations de sauvetage, et la Croix-Rouge a reçu un afflux considérable de dons. Un projet, baptisé « Travaux du Delta », a été évoqué afin de protéger les principaux estuaires et d'éviter qu'une telle catastrophe ne se reproduise."
 northseaflood.2.d:0 "Une onde de tempête a provoqué les pires inondations de notre époque, la rupture de nos principales digues ayant entraîné des inondations massives en Zélande et en Hollande-Méridionale. Malgré les avertissements de Rijkswaterstaat, les services des eaux locaux n'ont émis aucune alerte, laissant la population du pays déferler sur une vague soudaine et imprévisible. Ce fléau a fait 1 836 morts et des dizaines de milliers de déplacés sans abri. Avec 9 % des terres agricoles inondées, des dizaines de milliers de têtes de bétail péries et des dizaines de milliers de bâtiments détruits, cette catastrophe représente un coup dur pour notre reconstruction après la Seconde Guerre mondiale."
 northseaflood.3.d:0 "De graves inondations ont frappé notre côte est, les vagues déferlant du Kent à l'est de l'Écosse et faisant des centaines de victimes. Bien que moins touchée que notre voisin d'outre-Manche, la situation n'en demeure pas moins dramatique. Il s'agit des pires inondations de cette période de l'histoire, avec des dizaines de milliers de personnes déplacées. Un effort concerté sera indispensable pour se remettre de ces dégâts. Des discussions sont déjà en cours au Parlement afin de prévenir une telle catastrophe à l'avenir."
 northseaflood.4.d:0 "Les Flamands réagissent encore au choc immédiat provoqué par cette catastrophe naturelle inattendue. Nos digues près d'Anvers ont été entièrement percées et détruites, causant des dégâts sur toute la côte nord-est de la Flandre. Heureusement, le nombre de décès est très faible dans notre pays, comparé aux Pays-Bas et au Royaume-Uni, et nos dégâts sont également bien moindres ; notre rétablissement sera donc beaucoup plus facile."