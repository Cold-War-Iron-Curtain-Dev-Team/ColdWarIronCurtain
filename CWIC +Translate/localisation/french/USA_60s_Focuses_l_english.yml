 Castro.1.d: "Le gouvernement cubain a annoncé qu'une tentative d'assassinat contre le président Fidel Castro avait été déjouée. Le gouvernement a déclaré qu'une équipe de voyous impérialistes et de traîtres au peuple avait tenté de prendre la vie de Castro, mais qu'ils avaient été pris en flagrant délit. Ils ont ajouté que tous les Cubains surpris en train d'aider ou de soutenir les assassins seraient également arrêtés et jugés. La justice serait rendue au nom du peuple cubain. Bien que les détails n'aient pas été fournis, le gouvernement cubain a également affirmé qu'il croyait que ce complot était l'œuvre d'agents du renseignement américains. Les États-Unis n'ont pas commenté les accusations de leur implication dans la tentative, mais ont déclaré que ces tentatives démontraient le désir des Cubains d'être libres de Castro et de son régime oppressif."
 Castro.2.d: "Avant la révolution cubaine, les parrains de la mafia américaine possédaient des casinos, des hôtels et d'autres actifs économiques précieux à travers Cuba. Cependant, après la révolution cubaine, Fidel Castro a mené une campagne pour limiter l'accès étranger aux actifs cubains, et de nombreux parrains de la mafia américaine ont perdu des millions. Aujourd'hui, ces groupes ont pris leur revanche en utilisant leurs contacts d'avant la révolution pour introduire du poison, fourni par la Central Intelligence Agency (CIA), dans la nourriture de Castro. Le dirigeant cubain est décédé au matin. Ce développement choquant a été bien accueilli à Washington, mais à travers Cuba, des centaines de milliers de personnes sont sorties pour pleurer la mort de leur héros national populaire. Le gouvernement cubain a rapidement promis une rétribution à quiconque serait impliqué dans le complot."
 Castro.3.d: "Avant la révolution cubaine, les parrains de la mafia américaine possédaient des casinos, des hôtels et d'autres actifs économiques précieux à travers Cuba. Cependant, après la révolution cubaine, Fidel Castro a mené une campagne pour limiter l'accès étranger aux actifs cubains, et de nombreux parrains de la mafia américaine ont perdu des millions. Aujourd'hui, une tentative d'empoisonner la nourriture du dirigeant cubain Fidel Castro a été découverte. Le personnel de sécurité cubain a rapidement capturé le groupe qui avait livré le plat empoisonné à Castro et a annoncé que le complot avait été orchestré par la mafia américaine. Le gouvernement cubain a ajouté que la sophistication du poison et l'organisation du plan les amenaient à soupçonner que la mafia travaillait en étroite collaboration avec le gouvernement américain. Jusqu'à présent, les États-Unis n'ont pas commenté ces accusations."
 CIA.7.d: "L'Opération HTLINGUAL, l'examen des envois postaux entrant et sortant des États-Unis à destination des pays communistes, a été approuvée pour une expansion par la CIA. Initialement conçue uniquement pour collecter des adresses et des noms sur les enveloppes des courriers suspects à destination de pays tels que l'Union Soviétique et la République Populaire de Chine, la nouvelle expansion de la CIA a permis l'ouverture de deux nouveaux centres d'inspection rigoureux à New York et à Los Angeles afin d'assurer la sécurité du peuple américain. Bien qu'initialement créée pour recueillir des renseignements sur des adversaires étrangers, la CIA a également commencé à surveiller le courrier de potentiels fauteurs de troubles et d'activistes nationaux, tels que Martin Luther King et John Steinbeck."
 power_pack.2.d: "Après la réduction des combats dans la guerre civile en République dominicaine, nous pouvons enfin organiser de nouvelles élections avec notre gouvernement provisoire nouvellement installé, et nous visons à les tenir dans l'année à venir. Bien que notre président soit accusé de pratiquer la \"diplomatie de la canonnière\", une politique que ses prédécesseurs ont poursuivie au 20e siècle, où les Marines américains ont envahi et occupé plusieurs nations latino-américaines pour le moindre prétexte, nos hommes sur le terrain, principalement des unités aéroportées, mènent des opérations de sécurité et fournissent de l'aide aux membres des deux factions, notamment de la nourriture, de l'eau et des fournitures médicales."
 CIA.1.d: "Le projet MKUltra a récemment été lancé. Il s'agit d'un programme visant à réaliser des expériences sur des sujets humains afin d'identifier et de développer des substances et des procédures à utiliser lors des interrogatoires pour affaiblir l'individu et lui extorquer des aveux ou des informations par le biais du contrôle mental. Organisé par le Bureau du renseignement scientifique de la CIA et coordonné par les Laboratoires de guerre biologique de l'armée américaine, il a examiné des méthodes de contrôle mental utilisant des méthodes chimiques, biologiques et radiologiques. Parmi nos expériences, nous avons notamment administré du LSD à des patients mentaux, des prisonniers, des toxicomanes et des travailleurs du sexe. Il est primordial de sélectionner les personnes les moins susceptibles de raconter leur expérience."
 CIA.2.d: "La CIA a confirmé le lancement de l'opération Mockingbird. Imaginée par le directeur de la CIA, Allen Dulles, cette opération prévoit de nombreuses actions indépendantes à travers les États-Unis pour garantir la validité des informations publiées dans les journaux. La CIA fournira des rapports conformes à la politique américaine, confiés à des journalistes coopérants, du New York Times au Washington Post. Outre la lutte contre la propagande antiaméricaine et l'augmentation du volume d'informations pro-américaines dans les journaux, la CIA financera également certaines agences civiques, comme la National Student Association."
 CIA.3.d: "L'Opération Midnight Climax, l'un des nombreux sous-projets de MKULTRA, est l'une des plus étranges jamais menées par notre agence de renseignement. Les agents de la CIA impliqués dans Midnight Climax engageaient des prostituées à San Francisco pour attirer les clients dans des maisons closes. Une fois sur place, les agents droguaient secrètement leurs cibles et les observaient se livrer à des activités sexuelles derrière un miroir sans tain. L'un des responsables du projet a créé une maison close à San Francisco, souhaitant que l'endroit ait « l'allure d'un bordel français », a-t-il déclaré. Espérons que les opérations qu'ils mèneront seront concluantes et apporteront de nombreux résultats qui enrichiront les données scientifiques que MKULTRA cherche à obtenir."
 CIA.4.d: "Le projet MKNAOMI est le nom de code d'un programme de recherche conjoint entre la CIA et le ministère de la Défense. Lancé à peu près au même moment que MKUltra, il est axé sur les agents de guerre biologique, et plus précisément sur la capacité de stocker des matériaux capables de neutraliser ou de tuer un sujet testé, et sur le développement de dispositifs permettant leur diffusion. MKNAOMI a également assuré la surveillance, les tests, la mise à niveau et l'évaluation de matériaux spéciaux afin de garantir l'absence de défauts et de problèmes indésirables lors de leur utilisation. Le SOC de l'armée américaine a été chargé d'assister la CIA pendant le développement. L'une de ces inventions était une arme à feu modifiée tirant des fléchettes spéciales enduites d'agents biologiques et de diverses pilules toxiques. Ces armes ont été testées sur des chiens de garde, permettant aux agents d'infiltrer la zone surveillée par les chiens, puis de les réveiller à leur sortie de l'installation."
 CIA.5.d: "Projet parent de MKOFTEN, le projet MKULTRA de la CIA a été rebaptisé MKSEARCH, indiquant une recherche plus poussée d'un sérum de vérité plus parfait. S'appuyant sur des recherches antérieures de médecins de l'OSS, puis de la CIA, qui avaient étudié les expériences de psychiatres allemands sur des prisonniers de camps de concentration, le projet nécessite davantage de sujets « sacrifiables », ou sujets de test. Les tests MKSEARCH seraient menés dans des maisons sécurisées de la CIA à Washington, New York, Chicago et Los Angeles. Les expériences se concentreraient sur l'exploitation des faiblesses humaines et la déstabilisation de la personnalité humaine. Dans les grandes villes, il était suggéré de trouver des sujets « sacrifiables » qui ne seraient pas oubliés que dans les petites villes ou les zones rurales. Les sujets seraient soumis à des tests visant à provoquer des troubles du comportement, des altérations des schémas sexuels et la stimulation d'aberrations, autant de moyens d'interrogatoire et d'obtention d'informations."
 CIA.6.d: "Le projet MKOFTEN était un programme secret du ministère de la Défense développé en collaboration avec la CIA. Partenaire de MKSEARCH, MKOFTEN avait pour objectif de « tester les effets comportementaux et toxicologiques de certains médicaments sur les animaux et les humains ». L'opération « Souvent » de la CIA, un programme connexe, a également été lancé pour explorer le « monde de la magie noire » et « exploiter les forces des ténèbres et remettre en question l'idée que les profondeurs de l'esprit sont inaccessibles ». Dans le cadre de cette opération, des employés de la CIA ont rencontré et recruté des diseurs de bonne aventure, des chiromanciens, des clairvoyants, des astrologues, des médiums, des voyants et de nombreux autres praticiens de l'occulte. MKOFTEN était impliqué dans « tout, des séances de spiritisme et de sorcellerie à la vision à distance et aux drogues exotiques »."
 CIA.8.d: "L'opération CHAOS, ou MHCHAOS, était un projet d'espionnage intérieur de la Central Intelligence Agency (CIA) visant à surveiller le peuple américain. Elle a été lancée en 1967. Notre mission est de découvrir toute influence étrangère possible sur les mouvements internes liés aux questions de race, à l'anti-guerre et autres mouvements de protestation. L'opération a été mise en place sous la direction du directeur de la CIA. Lorsque [USA.GetLeader] a été élu en 1968, les activités de surveillance intérieure existantes ont été consolidées dans le cadre de l'opération CHAOS. Le projet utilisait les stations de la CIA à l'étranger pour surveiller les activités anti-guerre des citoyens américains voyageant à l'étranger, en employant des méthodes telles que la surveillance physique et l'écoute électronique, en utilisant des \"services de liaison\" pour maintenir cette surveillance. Les opérations ont ensuite été étendues pour inclure davantage d'agents. En 1969, suite à cette expansion, l'opération a commencé à développer son propre réseau d'informateurs dans le but d'infiltrer divers groupes anti-guerre étrangers situés dans des pays étrangers, qui pourraient avoir des liens avec des groupes américains."
 CIA.9.d: "Le projet MERRIMAC était une opération d'espionnage intérieur lancée en 1967. Coordonnée par le Bureau de la sécurité de la CIA, elle impliquait des procédures de collecte d'informations par infiltration et surveillance de groupes pacifistes basés à Washington susceptibles de représenter une menace pour la CIA. Cependant, les données recueillies comprenaient également des informations générales sur l'infrastructure des communautés ciblées. Le projet MERRIMAC et son programme jumeau, le projet RESISTANCE, étaient tous deux coordonnés par le Bureau de la sécurité de la CIA. De plus, ces projets jumeaux étaient des opérations de branche qui relayaient des informations civiles à leur programme parent, l'Opération CHAOS."
 CIA.10.d: "Le Projet RESISTANCE était une opération d'espionnage intérieur coordonnée par la Division des opérations intérieures de la CIA. Son objectif était de recueillir des informations sur les groupes présents aux États-Unis susceptibles de menacer les installations et le personnel de la CIA. À partir de 1967, de nombreux services de police locaux, des membres du personnel des campus universitaires et d'autres informateurs indépendants ont collaboré avec la CIA pour suivre les groupes étudiants radicaux opposés à la politique étrangère du gouvernement américain au Vietnam. Le Projet RESISTANCE et son programme jumeau, le Projet MERRIMAC, étaient tous deux coordonnés par le Bureau de la sécurité de la CIA. De plus, ces projets jumeaux étaient des opérations de branche qui relayaient des informations civiles à leur programme parent, l'Opération CHAOS."
 Operation_Shock.1.d: "Après l'offensive du Têt, une petite équipe d'analystes de la CIA, dirigée par George Carver, réagit à l'attaque en élaborant un plan baptisé « Opération Choc ». Les analystes craignaient que les généraux du gouvernement sud-vietnamien ne se laissent trop facilement aider par l'armée américaine, ce qui entraînerait un soutien croissant au Viêt-Cong. Le plan prévoit que le vice-président supervise une purge de tous les responsables militaires et civils coupables de corruption ou d'autres abus de pouvoir. L'équipe a également évoqué d'autres solutions pour inverser le cours de la guerre en cas d'échec, notamment contraindre le président actuel à démissionner et laisser un héros de guerre accéder au pouvoir, cesser temporairement les bombardements du Nord-Vietnam et engager des pourparlers pour tenter de négocier une reddition, ou des discussions avec le Front de libération nationale en vue de former un gouvernement de coalition."
 Secret_War.1.d: "Les activités de la CIA au Laos ont débuté dès les années 1950. Dès 1959, des forces spéciales américaines formaient des soldats laotiens aux techniques de guerre asymétrique. La CIA affirme elle-même que les opérations aériennes au Laos comptaient parmi les plus vastes opérations paramilitaires jamais menées par l'organisation. Pendant des années, elle a dirigé des forces autochtones contre les forces nord-vietnamiennes, organisant des tribus pour combattre les communistes laotiens. Elle a même utilisé la compagnie aérienne Air America pour larguer des millions de kilos de vivres, transporter des milliers de soldats et effectuer des reconnaissances. La CIA opérait avec des lunettes de vision nocturne et un équipement électronique de pointe. Nos efforts sont remarquables, l'utilisation de nos effectifs a été excellente et nous avons aidé le peuple laotien à combattre la menace communiste."
 Diem_Coup.2.d: "Le président du Sud-Vietnam, Ngo Dinh Diem, et son frère, Ngo Dinh Nhu, furent brutalement assassinés lors d'un coup d'État militaire lancé par des officiers nationalistes. Premier dirigeant du Sud-Vietnam, le président Diem était réputé pour être l'un des principaux militants anticoloniaux et anticommunistes du pays. Catholique profondément fervent, le régime de Diem a lutté ces dernières années contre les guérillas communistes opérant dans les campagnes et la résistance de la population majoritairement bouddhiste. Après avoir isolé Diem des forces loyalistes, les putschistes militaires ont attaqué sa résidence et ont finalement capturé Diem et son frère qui tentaient de fuir. Malgré les garanties des généraux et des États-Unis selon lesquelles Diem serait autorisé à quitter le pays en toute sécurité, alors qu'il était transporté au quartier général militaire, Diem et son frère furent tués à la baïonnette par un officier subalterne. De nombreux membres de la nouvelle junte au pouvoir ont condamné cet acte, mais on ignore si ce meurtre était accidentel ou ordonné par la junte pour consolider son pouvoir."
 Reagan.103.d: "Le président [USA.GetLeader] s'oppose depuis longtemps aux lois sur les droits civiques, mais affirme ne pas être ségrégationniste. Il soutient simplement l'importance des droits des États. Cependant, il s'oppose particulièrement à certaines dispositions de la loi historique sur les droits civiques et a chargé ses hauts fonctionnaires d'étudier la possibilité d'amender le projet de loi afin de lever les restrictions imposées aux États. Cependant, ses opposants affirment que ces amendements supprimeraient les protections accordées aux minorités ; une forte opposition du Congrès est attendue à toute modification. Le président ne devrait pas non plus utiliser le pouvoir exécutif pour faciliter l'application de la loi, ce qui, selon beaucoup, pourrait en réduire l'impact pour les minorités."
 Goldwater.1.d: "Le président [USA.GetLeader] a annoncé que le gouvernement fédéral respectera désormais les droits des États et ne forcera plus un agenda fédéral sur les États individuels. Le président [USA.GetLeader] a souligné que les exigences fédérales et les ordonnances des tribunaux doivent être appliquées, mais a déclaré que les États doivent être autorisés à les mettre en œuvre selon leurs propres conditions, afin de garantir une atmosphère stable et amicale à travers le pays. L'annonce a été accueillie par des condamnations, en particulier de la part des groupes d'activistes et de défense des droits civiques, qui estiment que ne pas obliger les États à se conformer aux directives fédérales permettra à ces derniers de perpétuer leurs systèmes d'injustice et d'éviter d'apporter les changements radicaux nécessaires."
 USAUrban.1.d: "Après une série de manifestations violentes et de troubles dans les centres urbains américains, le président [USA.GetLeader] a annoncé que le calme était revenu dans toutes les villes américaines. Il a souligné les efforts des forces de l'ordre, ainsi que des autorités étatiques et fédérales, pour lutter contre les troubles. Interrogé sur l'opportunité d'ouvrir une enquête sur les récents troubles, le président a déclaré que cette possibilité était à l'étude. Bien que les troubles aient pris fin, ses opposants laissent entendre qu'ils se sont simplement éteints ou ont été dispersés par la force grâce aux efforts du gouvernement. Les unités de la Garde nationale mobilisées ou mises en alerte dans tout le pays devraient se retirer."
 Bussing.1.d: "Le président [USA.GetLeader] a demandé aux membres du cabinet et aux hauts responsables de diriger les fonctionnaires fédéraux pour qu'ils retirent la pression et les fonds destinés aux États pour la mise en œuvre des programmes de bus de déségrégation. Ces programmes de bus déplacent les élèves vers différentes écoles afin de combattre la ségrégation et de mettre fin aux inégalités entre les écoles fondées sur des critères raciaux. Le président [USA.GetLeader] a déclaré que, bien qu'il n'opposât pas à l'objectif des bus, il souhaitait respecter les droits des États et des parents locaux. Il a affirmé que le gouvernement fédéral n'avait pas à s'immiscer de manière aussi directe dans les affaires des politiques éducatives des États et des autorités locales."
 Goldwater.201.d: "Partout aux États-Unis, ce matin, le FBI et les forces de l'ordre locales ont perquisitionné des bureaux du parti liés à d'importantes organisations nationalistes noires. Le président [USA.GetLeader] s'est adressé aux médias cet après-midi-là pour annoncer qu'il donnait instruction aux agences fédérales de réprimer le nationalisme noir militant. Le président a déclaré que ces organisations se livraient à des activités militantes, à des entraînements au maniement des armes et à des activités illégales, notamment au crime organisé. Il a ajouté que le gouvernement craignait que ces groupes ne se livrent prochainement à des violences ouvertes contre les non-Noirs et le gouvernement. Il a ajouté que les perquisitions de ce matin n'étaient qu'un début et que la campagne s'intensifierait dans les mois à venir."
 Goldwater.202.d: "Le président [USA.GetLeader] a déclaré que son gouvernement publierait un décret afin de préserver le principe des droits des États. Ce nouveau décret garantirait les droits des États et interdirait au gouvernement fédéral de recourir à la force, à l'intimidation ou à la pression financière pour contraindre les États à se conformer aux directives. L'annonce a été chaleureusement accueillie par les Sudistes opposés aux récentes décisions judiciaires fédérales concernant la ségrégation, mais des manifestations ont éclaté sur les campus universitaires de tout le pays. De plus, plusieurs membres éminents du Congrès ont déclaré que le président profanait les sacrifices des soldats et des citoyens de l'Union pendant la guerre de Sécession."
 Goldwater.200.d: "Les Américains qui suivaient les informations hier soir ont été stupéfaits de voir la police et la Garde nationale disperser brutalement des manifestations anti-guerre sur plusieurs campus universitaires importants. Cette décision fait suite aux déclarations précédentes du président [USA.GetLeader] selon lesquelles les manifestants anti-guerre affaiblissaient les États-Unis et aidaient leurs ennemis à l'étranger. Il a qualifié la menace d'immense et a déclaré que le gouvernement commencerait à réprimer ces organisations. Outre la dispersion violente des manifestations, le FBI a perquisitionné d'importantes organisations anti-guerre et saisi des milliers de documents. Un porte-parole du FBI a déclaré que le FBI prévoyait de poursuivre de nombreux dirigeants anti-guerre pour leurs liens avec l'étranger et leurs sympathies communistes violentes."
 Klan.1.d: "La récente renaissance du tristement célèbre Ku Klux Klan et plusieurs incidents violents très médiatisés contre des Afro-Américains ont poussé le président [USA.GetLeader] à annoncer que le procureur général porterait prochainement des accusations contre les dirigeants du Klan impliqués dans ces violences. Le président a déclaré que la violence du Klan n'avait pas sa place dans l'Amérique moderne et que le gouvernement poursuivrait le groupe tant qu'il ne cesserait pas ses violences contre les citoyens américains. De nombreuses communautés minoritaires à travers le pays accueilleront favorablement la nouvelle, mais la réaction du Klan reste inconnue, sa structure étant décentralisée."
 ERA.1.d: "La campagne pour un amendement sur l'égalité des droits (ERA) a été lancée pour la première fois en 1923. Cet amendement vise à mettre fin à toute discrimination juridique entre les sexes. L'évolution de la vie sociale et culturelle a relancé les efforts pour l'adopter. Des milliers de femmes ont participé à des manifestations ou signé des pétitions exhortant le Congrès à approuver définitivement l'ERA. Les femmes se heurtent encore à des obstacles juridiques dans les affaires de divorce et d'autres questions importantes. Les étudiantes et les femmes de la classe moyenne sont à l'origine du renouveau de l'ERA, mais les femmes de la classe ouvrière s'y opposent, craignant que le projet de loi ne mette fin aux lois de protection du travail adoptées pour préserver les droits des femmes sur le lieu de travail."
 JFK_Mafia.1.d: "Le président [USA.GetLeader], travaillant en étroite collaboration avec le procureur général, a ordonné au Département de la Justice, au FBI et à l'IRS de commencer des enquêtes et de collaborer étroitement sur des affaires visant le crime organisé aux États-Unis. Le président a noté que le crime organisé avait prospéré en raison de la concentration des forces de l'ordre fédérales sur des crimes plus évidents. Bien que ces enquêtes puissent prendre de nombreuses années pour être menées à bien, le président [USA.GetLeader] espère que des villes comme Las Vegas et Newport, Kentucky, seront débarrassées des éléments criminels organisés. Cependant, cette nouvelle initiative ne manquera pas d'irriter les puissantes familles criminelles et suscite des inquiétudes au sein du gouvernement concernant d'éventuelles représailles."
 LBJ_Civil.1.d: "Après l'adoption du Civil Rights Act par le président [USA.GetLeader], des questions ont été soulevées quant à son application. De nombreuses communautés du Sud, y compris des représentants des États, ont résisté à sa mise en œuvre. Pour y remédier, le président a décidé de lancer des injonctions et des poursuites fédérales, et a dépêché des agents dans les zones sensibles afin de garantir le respect de la loi. Il envisage également de signer des décrets exécutifs habilitant les agences fédérales à veiller à son application. Cependant, cette approche a aliéné certains membres du Congrès, qui craignent qu'une intervention excessive du gouvernement fédéral n'enhardisse les opposants aux droits civiques."
 Nixon.1960.d: "Les Dixiecrats sont apparus comme une faction ségrégationniste et dissidente au sein du Parti démocrate, qui a mis fin à leur dissidence en 1948. Cependant, ils restaient mécontents de la situation des droits civiques, et la récente élection présidentielle laisse entrevoir un possible changement d'allégeance des démocrates du Sud. Plusieurs États du Sud, traditionnellement démocrates, sont tombés aux mains du candidat républicain. Ces résultats ont provoqué la colère des dirigeants du Parti démocrate, qui ont accusé l'influence des Dixiecrats et l'accent mis par les démocrates du Sud sur la ségrégation d'avoir orienté le Sud vers les républicains. On ignore si les démocrates parviendront à résoudre ce conflit, mais on s'attend à ce que les républicains tentent de convaincre les démocrates du Sud de les rejoindre."
 Nixon_native.1.d: "Le président [USA.GetLeader] a exposé sa vision des relations entre les États-Unis et les nombreuses communautés amérindiennes du pays. Il a annoncé que l'ancienne politique d'extermination ou d'assimilation forcée prendrait fin au profit de l'autodétermination. Il a insisté sur le fait que les Amérindiens doivent faire leurs propres choix et prendre leurs propres décisions. Le Bureau des Affaires indiennes versera des fonds fédéraux aux tribus reconnues pour qu'elles les répartissent selon leurs conditions. Bien que de nombreuses tribus aient salué cet effort, les Amérindiens urbains hors réserve ont exprimé leur inquiétude quant à leur exclusion de ces ressources ou à la merci des aînés."
 Rockefeller.1.d: "Le président [USA.GetLeader] a longtemps exprimé ses inquiétudes concernant les dépenses de bien-être social par le gouvernement. Le président estimait qu'un bien-être incontrôlé serait nuisible au développement et au caractère social du pays. Dès son entrée en fonction, le président [USA.GetLeader] a rencontré les membres pertinents du cabinet et les dirigeants du Congrès pour élaborer une stratégie afin de maîtriser les dépenses de bien-être social et mettre en place plusieurs programmes, dont un qui verrait les bénéficiaires de l'aide sociale capables de travailler être inscrits à des programmes de formation professionnelle. Le président a annoncé aujourd'hui que ses efforts ont porté leurs fruits et que les dépenses de bien-être social, autrefois jugées incontrôlables, ont été stabilisées."
 Rockefeller.2.d: "Lors d'une cérémonie publique, le président [USA.GetLeader] a officiellement dévoilé sa nouvelle initiative artistique. Passionné de collection et mécène, le président a fièrement déclaré que cette initiative permettrait aux plus grands artistes des États-Unis non seulement d'obtenir des financements essentiels pour leurs projets, mais aussi d'être mis en avant. Il a insisté sur la nécessité de soutenir le talent américain dans tous les domaines et que son initiative contribuerait à mettre en valeur la créativité américaine et à renforcer la collaboration entre les États-Unis et le reste du monde. Bien que l'initiative ait été saluée par la presse, ses détracteurs l'ont qualifiée de projet vaniteux pour le président."
 Desegregation.1.d: "Suite à la décision de la Cour suprême déclarant la ségrégation inconstitutionnelle, le vétéran militaire James Meredith a tenté de s'inscrire comme étudiant à l'Université du Mississippi (également appelée Ole Miss). Meredith a rencontré des manifestants hostiles et le gouverneur a refusé de protéger ou de soutenir la déségrégation de l'université. En réponse, le président [USA.GetLeader] a ordonné aujourd'hui aux Marshals et à l'armée américaine de faire respecter la déségrégation et de se déployer sur le campus. Meredith devrait s'inscrire sous la protection des Marshals et des troupes, mais des milliers de manifestants anti-déségrégation se rassemblent, beaucoup craignant des violences entre les troupes fédérales et les manifestants furieux."
 Desegratation.2.d: "Aujourd'hui, à la Maison Blanche, le président [USA.GetLeader] a signé le décret 11063. Ce décret « …interdit la discrimination dans la vente, la location, la location ou toute autre forme de cession de biens et d'installations appartenant au gouvernement fédéral ou exploités par lui avec des fonds fédéraux ». La ségrégation est désormais interdite dans tous les logements financés par le gouvernement fédéral et est saluée comme une grande victoire du mouvement pour les droits civiques. Plus important encore, nombreux sont ceux qui espèrent que ce décret mettra fin à la pratique, depuis des décennies, du sous-financement chronique des communautés noires par les fonds fédéraux, en particulier dans les communautés qui en ont un besoin urgent."
 Wallace.5.d: "La guerre contre la drogue est une campagne menée par le gouvernement américain et pilotée par le président [USA.GetLeader], qui vise à interdire les drogues, à fournir une aide militaire et à intervenir militairement afin de réduire le trafic de drogue aux États-Unis. Ce plan comprend un ensemble de politiques visant à décourager la production, la distribution et la consommation de substances psychoactives déclarées illégales par les gouvernements participants et les Nations Unies. Parmi les mesures employées contre la drogue, on compte l'augmentation drastique des peines pour tout ce qui y est lié : possession, vente, consommation, production… bref, vous serez poursuivi. Selon certaines ONG, la guerre contre la drogue provoque une flambée des arrestations, ciblant de manière disproportionnée les Afro-Américains pour divers facteurs. Certains affirment que la guerre contre la drogue est utilisée pour criminaliser et perturber les communautés noires et hippies et leurs dirigeants. N'oubliez jamais que la drogue est l'ennemi public numéro un !"
 US_60s_The_CIA: "La CIA"
 US_60s_The_CIA_desc: "La CIA est, eh bien, au cœur de notre lutte contre l'Union soviétique et ses fantoches communistes. Nos maîtres-espions affirment avoir mis en place plusieurs opérations à travers le monde pour faire pencher la balance en notre faveur. Peut-être devrions-nous simplement la rebaptiser Agence d'intervention (anti)communiste ?"
 USA_60s_Domestic_Affairs: "Affaires intérieures"
 USA_60s_Domestic_Affairs_desc: "Même si nous devons préserver notre vision d'un ordre mondial démocratique, nous ne pouvons ignorer les problèmes que nous rencontrons chez nous. Si nous échouons sur le front intérieur, comment aurons-nous une chance de réussir à l'étranger ?"
 USA_60s_Latin_America_Desk: "Bureau Amérique latine"
 USA_60s_Latin_America_Desk_desc: "Nos voisins du Sud sont actuellement un foyer d'instigateurs et de propagande communistes. De nombreux pays, et notamment Cuba, proche de nos côtes, sont déjà tombés. Nous devons agir vite."
 USA_60s_Launch_the_Bay_of_Pigs: "Lancement de la Baie des Cochons"
 USA_60s_Launch_the_Bay_of_Pigs_desc: "Nos meilleurs espions à Cuba ont élaboré un plan audacieux pour renverser Fidel Castro. En utilisant des exilés cubains formés par la CIA pour dissimuler notre implication, nos forces débarqueront sur une plage du sud-ouest de Cuba et reprendront le contrôle de l'île par la force."
 USA_Attempt_to_Assasinate_Castro: "Tentative d'assassinat de Castro"
 USA_Attempt_to_Assasinate_Castro_desc: "Après la débâcle de la Baie des Cochons, nous sommes à court d'options pour nous débarrasser de la dictature communiste cubaine. Notre meilleure option est d'organiser une tentative d'assassinat contre Fidel Castro et de destituer l'homme qui bloque tout le régime."
 USA_Operation_Northwoods: "Opération Northwoods"
 USA_Operation_Northwoods_desc: "L'opération Northwoods est une opération sous fausse bannière visant à justifier une invasion de Cuba. Si le feu vert est donné, des agents de la CIA camouflés commettront de véritables actes terroristes à travers les États-Unis afin de provoquer l'indignation contre Cuba."
 USA_Deal_with_the_Underworld: "Traiter avec les Enfers"
 USA_Deal_with_the_Underworld_desc: "Si traiter avec des chefs criminels et des gangs mécontents est déplaisant, les complots d'assassinat le sont tout autant. Organiser l'empoisonnement du repas de Fidel Castro est l'une des meilleures chances que nous ayons d'éliminer la menace communiste de nos côtes."
 USA_Re_Establish_Mafia_in_Cuba: "Rétablir la mafia à Cuba"
 USA_Re_Establish_Mafia_in_Cuba_desc: "Maintenant que nos exilés cubains ont vaincu les forces communistes, il est temps de rétablir l'ordre établi avant l'arrivée de Castro au pouvoir. Cet ordre repose en partie sur les gangs mafieux, qui, bien que manifestement criminels, joueront un rôle essentiel dans le maintien de l'ordre."
 USA_60s_Cuban_Deathsquads: "Escadrons de la mort cubains"
 USA_60s_Cuban_Deathsquads_desc: "Malgré la chute de Castro, de nombreux Cubains protestent et se révoltent contre leur liberté retrouvée ! Cela ne peut plus durer. Former des escadrons de la mort pour protéger nos intérêts est nécessaire pour détruire définitivement le communisme cubain."
 USA_60s_Depose_Juan_Velasco: "Déposer Juan Velasco Alvarado"
 USA_60s_Depose_Juan_Velasco_desc: "Juan Velasco Alvarado, le dirigeant du Pérou, est un despote tyrannique et doit être destitué. Nos agents sont sur place et attendent le feu vert."
 USA_60s_Establish_Ecuadorian_Junta: "Établir une junte équatorienne"
 USA_60s_Establish_Ecuadorian_Junta_desc: "Bien que l'Équateur ne soit pas encore communiste, il est temps de créer un nouveau régime. Bien qu'une véritable démocratie soit préférable, une junte militaire forte est nécessaire pour maintenir la stabilité et le statu quo."
 USA_60s_Operation_POWER_PACK: "Opération POWER PACK"
 USA_60s_Operation_POWER_PACK_desc: "La République dominicaine est plongée dans le chaos, et un nouveau régime communiste est sur le point d'émerger dans les Caraïbes. C'est impossible. En envoyant nos propres troupes au secours des forces démocratiques, nous pouvons empêcher un nouveau Cuba."
 USA_60s_Crush_The_Dominican_Rebellion: "Écraser la rébellion dominicaine"
 USA_60s_Crush_The_Dominican_Rebellion_desc: "Nos troupes étant à terre et repoussant les rebelles communistes, il est temps de mettre un terme à cette folie. Écrasez les Rouges sans pitié !"
 USA_60s_Launch_Coup_in_Bolivia: "Coup d'État en Bolivie"
 USA_60s_Launch_Coup_in_Bolivia_desc: "Le gouvernement bolivien affiche trop de tendances gauchistes à notre goût. Nous devons le remplacer avant qu'il ne révèle son vrai visage et ne rejoigne l'Union soviétique."
 USA_60s_Assasinate_Rafael_Trujillo: "Assassiner Rafael Trujillo"
 USA_60s_Assasinate_Rafael_Trujillo_desc: "Homme fort de la République dominicaine depuis les années 1930, Trujillo a instauré un nouveau règne de terreur dans les Caraïbes. Il doit partir, même s'il n'est pas communiste."
 USA_60s_Train_Brazilian_Deathsquads: "Former les escadrons de la mort brésiliens"
 USA_60s_Train_Brazilian_Deathsquads_desc: "Pour réprimer les instigateurs communistes au Brésil, nous devons organiser et soutenir des escadrons de la mort d’extrême droite pour les réduire au silence."
 USA_60s_Train_Uruguayan_Death_Squads: "Former les escadrons de la mort uruguayens"
 USA_60s_Train_Uruguayan_Death_Squads_desc: "Pour réprimer les instigateurs communistes en Uruguay, nous devons organiser et soutenir des escadrons de la mort d’extrême droite pour les réduire au silence."
 USA_60s_Project_MKUltra: "Projet MKUltra"
 USA_60s_Project_MKUltra_desc: "L'Opération MK-Ultra est une série d'expériences sur des sujets humains visant à tester l'efficacité de diverses drogues conçues pour le contrôle mental. Bien que légèrement inhumaines, les résultats nous aideront énormément dans notre lutte contre la menace rouge."
 USA_60s_Operation_Mockingbird: "Opération Mockingbird"
 USA_60s_Operation_Mockingbird_desc: "Nous avons besoin que la population mondiale, ou du moins la nôtre, croie fermement à la justesse de notre cause. Pour ce faire, nous devons commencer à diffuser des histoires et de la propagande dans tous les médias du monde."
 USA_60s_Operation_MIDNIGHT_CLIMAX: "Opération MIDNIGHT CLIMAX"
 USA_60s_Operation_MIDNIGHT_CLIMAX_desc: "Extension de MK-Ultra, Midnight Climax mettra en scène des prostituées employées par la CIA qui attireront leurs clients dans des planques de l'agence. Une fois sur place, nous leur injecterons du LSD pour enregistrer les effets. Ne vous souciez pas de l'éthique, c'est pour le bien commun. Vous êtes communiste, quoi ?"
 USA_60s_Project_MKNAOMI: "Projet MKNAOMI"
 USA_60s_Project_MKNAOMI_desc: "MK-NAOMI est une autre branche de MK-Ultra. Plutôt que de se concentrer sur les drogues de contrôle mental, NAOMI se concentre sur les composés biologiques et chimiques conçus pour tuer ou neutraliser instantanément, ainsi que sur les dispositifs permettant leur diffusion."
 USA_60s_Project_MKSEARCH: "Projet MKSEARCH"
 USA_60s_Project_MKSEARCH_desc: "Le projet MKSEARCH est une branche d'Ultra qui se concentre spécifiquement sur un sérum de vérité. Malheureusement (enfin, pas pour nous), il nécessitera des cobayes pour les expérimentations. Ce que nous faisons pour la liberté…"
 USA_60s_Project_MKOFTEN: "Projet MKOFTEN"
 USA_60s_Project_MKOFTEN_desc: "MKOFTEN est un autre projet de recherche sur les drogues, visant cette fois à examiner les effets comportementaux et toxicologiques des drogues sur les humains et les animaux. De plus, le Dr Sydney Gottlieb, expert en espionnage, souhaite utiliser OFTEN comme couverture pour étudier la magie noire et l'occultisme. Effrayant et étrange, mais bon, si ça surpasse les rouges, qui s'en soucie ?"
 USA_60s_Expand_HTLINGUAL: "Développer HTLINGUAL"
 USA_60s_Expand_HTLINGUAL_desc: "HTLINGUAL est une opération visant à intercepter le courrier américain à destination de l'URSS et de la RPC. Nous espérons que cela nous aidera dans nos efforts pour éradiquer le communisme aux États-Unis."
 USA_60s_Operation_MCHAOS: "Opération MCHAOS"
 USA_60s_Operation_MCHAOS_desc: "L'opération MCHAOS est un projet d'espionnage intérieur visant à révéler l'influence étrangère dans les récents mouvements de protestation raciale et pacifiste. Nous savons que l'URSS est à l'origine de ces émeutes, et si nous démasquons ses agents, ces mouvements disparaîtront."
 USA_60s_Operation_MERRIMAC: "Opération MERRIMAC"
 USA_60s_Operation_MERRIMAC_desc: "De nombreux groupes anti-guerre basés à Washington ont vu le jour ces derniers mois. MERRIMAC recueillera des informations sur ceux qui sont considérés comme une menace pour les institutions et la stabilité du pays."
 USA_60s_Operation_RESISTANCE: "Opération RÉSISTANCE"
 USA_60s_Operation_RESISTANCE_desc: "RÉSISTANCE est un projet frère de MERRIMAC qui cible les organisations des campus universitaires, en particulier les groupes étudiants radicaux, qui dénoncent notre politique au Vietnam. Ce projet nous permettra de surveiller les personnes susceptibles de rejoindre le mouvement communiste."
 USA_60s_Undermine_the_Anti_War_Movement: "Saper le mouvement anti-guerre"
 USA_60s_Undermine_the_Anti_War_Movement_desc: "Le mouvement anti-guerre est une véritable épine dans notre pied, réduisant notre capacité à combattre au Vietnam, minant notre popularité et notre stabilité nationales, et portant atteinte à notre prestige international. Nous devons l'affaiblir avant qu'il ne s'aggrave."
 USA_60s_African_and_European_Desks: "Bureaux africains et européens"
 USA_60s_African_and_European_Desks_desc: "Bien que moins instables que l’Amérique du Sud et l’Amérique centrale, les théâtres européens et africains sont tout aussi importants, voire plus, dans notre bataille pour la suprématie mondiale contre les Soviétiques, et ne peuvent être ignorés."
 USA_60s_Support_the_Greek_Junta: "Soutenir la junte grecque"
 USA_60s_Support_the_Greek_Junta_desc: "Depuis la guerre civile grecque de 1949, la junte militaire au pouvoir peine à maintenir l'ordre. Nous devons lui envoyer de l'aide avant que la Grèce ne sombre à nouveau dans la guerre."
 USA_60s_Provide_Intel_to_Greek_Junta: "Fournir des renseignements à la junte grecque"
 USA_60s_Provide_Intel_to_Greek_Junta_desc: "En fournissant aux Grecs des renseignements sur les groupes communistes, leurs partisans et leurs sympathisants au sein de leur nation, nous pouvons stabiliser davantage leur pays."
 USA_60s_Covert_Rhodesian_Aid: "Aide secrète à la Rhodésie"
 USA_60s_Covert_Rhodesian_Aid_desc: "Tout en nous opposant officiellement et fermement aux Rhodésiens et à leur politique raciste, nous leur enverrons une aide militaire et économique secrète. Après tout, ce ne sont pas des Rouges, alors à quel point la situation peut-elle être si grave ?"
 USA_60s_Covert_South_African_Aid: "Aide secrète à l'Afrique du Sud"
 USA_60s_Covert_South_African_Aid_desc: "Du point de vue des droits civiques, le gouvernement de l'apartheid en Afrique du Sud est catastrophique. Mais bon, nous avons tous nos défauts, n'est-ce pas ? Nous avons notre propre problème de droits civiques, et d'ailleurs, mieux vaut eux que les communistes."
 USA_60s_Aid_the_FNLA: "Aider le FNLA"
 USA_60s_Aid_the_FNLA_desc: "Le FNLA, ou Front national de libération de l'Angola, lutte pour son indépendance dans la guerre entre l'Angola et le Portugal. En l'aidant maintenant, nous pouvons gagner sa gratitude et l'intégrer à notre sphère d'influence."
 USA_60s_Aid_Mobutu: "Aider Mobutu"
 USA_60s_Aid_Mobutu_desc: "Mobutu Sese Seko, président de la République démocratique du Congo, a un besoin urgent de notre aide militaire, et nous lui donnerons ce dont il a besoin pour assurer la survie de son régime."
 USA_60s_Asian_Desk: "Bureau asiatique"
 USA_60s_Asian_Desk_desc: "L'Asie est le théâtre de nos plus importantes implication dans les conflits de la Guerre froide, d'abord en Corée, puis au Vietnam. Nous devons poursuivre nos efforts pour éviter que l'Extrême-Orient, ainsi que le reste du continent, ne tombe davantage sous le coup de la botte rouge."
 USA_60s_The_Secret_War: "La guerre secrète"
 USA_60s_The_Secret_War_desc: "Bien que la guerre du Vietnam soit connue de tous, un autre conflit, tout aussi violent, se déroule juste à côté, au Laos. D'importants efforts aériens ont été déployés, fournissant soutien terrestre et ravitaillement, ainsi que de nombreuses opérations des forces spéciales, pour soutenir les combattants anticommunistes dans la région."
 USA_60s_Operation_PINCUSHION: "Opération PINCUSHION"
 USA_60s_Operation_PINCUSHION_desc: "L'opération PINCUSHION est un effort secret visant à recruter des tribus montagnardes laotiennes et à les transformer en forces de combat régulières capables de se défendre contre la menace communiste sur la piste Ho Chi Minh."
 USA_60s_Operation_MOMENTUM: "Opération MOMENTUM"
 USA_60s_Operation_MOMENTUM_desc: "MOMENTUM, programme d'entraînement de guérilla laotien, sera opéré dans le nord-est du pays et mis en œuvre par l'unité de renfort aérien de la police thaïlandaise. La partie américaine de la planification sera assurée par James William Lair, un agent déjà implanté en territoire laotien."
 USA_60s_Arm_the_Royalists: "Armer les royalistes"
 USA_60s_Arm_the_Royalists_desc: "Les royalistes ont désespérément besoin de notre aide militaire, sous forme de conseillers et de fournitures. Comme nous ne pouvons pas nous permettre une autre nation communiste en Asie du Sud-Est, ils obtiendront ce qu'ils demandent."
 USA_60s_Air_America_Drug_Smuggling: "Trafic de drogue sur Air America"
 USA_60s_Air_America_Drug_Smuggling_desc: "Pour aider l’économie laotienne en difficulté, nous utiliserons les avions de ligne d’Air America pour faire entrer clandestinement de la drogue dans le pays."
 USA_60s_Aid_Royalist_Drug_Smuggling: "Aider les royalistes au trafic de drogue"
 USA_60s_Aid_Royalist_Drug_Smuggling_desc: "En plus du trafic de drogue d’Air America, nous soutiendrons également le trafic de drogue local laotien pour soutenir leur économie."
 USA_60s_Launch_Indonesian_Coup: "Lancement du coup d'État indonésien"
 USA_60s_Launch_Indonesian_Coup_desc: "Malheureusement, il y a quelques années, les Indes orientales néerlandaises sont tombées aux mains de Sukarno et de ses partisans communistes. Nous avons dû attendre notre heure, mais nos agents nous disent que le moment est venu de frapper et de renverser le régime."
 USA_60s_Provide_Hit_List_to_Indonesia: "Fournir la liste des cibles à l'Indonésie"
 USA_60s_Provide_Hit_List_to_Indonesia_desc: "Bien que le pays ne soit plus communiste de nom, de nombreux partisans de l'ancien gouvernement indonésien subsistent. En fournissant des listes de cibles à l'armée, nous pouvons rapidement remédier à cette situation."
 USA_60s_Aid_SAVAK: "Aider le SAVAK"
 USA_60s_Aid_SAVAK_desc: "La SAVAK, la jeune agence de renseignement du Shah, peine à retrouver et à arrêter ceux qui cherchent à renverser le gouvernement. Nous devons l'aider afin de préserver nos intérêts au Moyen-Orient."
 USA_60s_Support_Lon_Nol: "Soutenir Lon Nol"
 USA_60s_Support_Lon_Nol_desc: "Lon Nol, le général cambodgien le plus à droite, peine à contenir les Khmers rouges et a besoin de notre aide immédiate. Nous devons agir vite avant qu'il ne soit débordé."
 USA_60s_Arm_the_Republic_of_Cambodia: "Armer la République du Cambodge"
 USA_60s_Arm_the_Republic_of_Cambodia_desc: "Maintenant que nous avons endigué l’hémorragie au Cambodge, un réarmement général de leurs forces est nécessaire."
 USA_60s_Covert_Aid_to_Thailand: "Aide secrète à la Thaïlande"
 USA_60s_Covert_Aid_to_Thailand_desc: "La Thaïlande a besoin de notre soutien pour soutenir son économie et son armée, et même si nous ne sommes pas visibles en train de les aider, nous leur fournirons des armes et des fonds secrets."
 USA_60s_Vietnam_Desk: "Bureau du Vietnam"
 USA_60s_Vietnam_Desk_desc: "Vietnam. Que dire de plus ? C'est le désastre total dans lequel nous nous sommes fourrés, il y a si longtemps. Il faut se ressaisir, écraser le Viêt-Cong et Hô Chi Minh, et faire ses valises avant que la situation ne s'aggrave vraiment."
 USA_60s_Assasinate_Diem: "Assassiner Diem"
 USA_60s_Assasinate_Diem_desc: "Ngo Dinh Diem a malheureusement échoué dans sa mission de maintenir la stabilité du Sud-Vietnam et de le protéger des forces communistes. L'ARVN est impatiente de renverser son régime, et nous n'interviendrons pas. À bientôt, Diem."
 USA_60s_Preserve_the_Diem_Regime: "Préserver le régime Diem"
 USA_60s_Preserve_the_Diem_Regime_desc: "Malgré tous ses défauts, Diem a tout fait pour préserver l'État vietnamien durant ces années de violence et de turbulences. Nous devons le garder, car, à ce stade, qui est plus compétent et expérimenté que lui à ce poste ?"
 USA_60s_Civilian_Irregular_Defense_Group_Program: "Programme du Groupe de défense civile irrégulière"
 USA_60s_Civilian_Irregular_Defense_Group_Program_desc: "Le CIDG est un programme visant à recruter et à déployer des unités irrégulières composées de minorités au Sud-Vietnam. Ce programme renforcera la capacité offensive de l'ARVN et permettra de tenir ces minorités à l'écart du Viêt-Cong."
 USA_60s_Operation_VULCAN: "Opération VULCAN"
 USA_60s_Operation_VULCAN_desc: "Les Nord-Vietnamiens développent une marine, et même si elle ne peut rivaliser avec la nôtre, elle constituera une nuisance si elle n'est pas maîtrisée. Nous disposons d'une équipe de plongeurs chargés de bombes qui attendent l'ordre de commencer leur mission de sabotage."
 USA_60s_Bribe_the_An_Quang_Buddhists: "Soudoyer les bouddhistes d'An Quang"
 USA_60s_Bribe_the_An_Quang_Buddhists_desc: "Les bouddhistes d'An Quang sont un groupe religieux prêt à coopérer avec les Sud-Vietnamiens et l'ARVN, moyennant finance. Cependant, l'ARVN a besoin d'hommes et d'expérience ; le pot-de-vin sera donc versé."
 USA_60s_Launch_the_PHOENIX_Program: "Lancer le programme PHOENIX"
 USA_60s_Launch_the_PHOENIX_Program_desc: "Le programme PHOENIX vise à détruire le Vietcong et ses partisans par l'infiltration, la lutte antiterroriste, la torture et les interrogatoires. Il impliquera des unités de reconnaissance spécialisées qui tueront ou captureront les Vietcongs présumés et les ramèneront dans des centres de détention."
 USA_60s_Operation_SHOCK: "Opération SHOCK"
 USA_60s_Operation_SHOCK_desc: "En réponse à l'offensive du Têt, un groupe d'analystes de la CIA dirigé par George Carver a conçu l'opération SHOCK, destinée à purger l'ARVN des officiers corrompus et, en cas d'échec, à arrêter temporairement les bombardements et à négocier les conditions de reddition avec le Nord, ou à créer un gouvernement de coalition avec le NLF."
 USA_60s_Operation_Wandering_Soul: "Opération Âme errante"
 USA_60s_Operation_Wandering_Soul_desc: "L'opération Âme Errante s'inspire d'une croyance vietnamienne du même nom, selon laquelle une âme mal enterrée erre dans la campagne en gémissant sans but. Pour effrayer le Viêt-Cong, nous avons installé des haut-parleurs sur notre territoire qui diffusent des sons et des voix étranges pour simuler des « Âmes Errantes »."
 USA_60s_Expand_the_PHOENIX_Program: "Développer le programme PHOENIX"
 USA_60s_Expand_the_PHOENIX_Program_desc: "Malgré tous nos efforts, le programme PHOENIX n'est pas assez vaste et des milliers de partisans et de combattants communistes sont toujours en liberté. Nous devons redoubler d'efforts pour les arrêter."
 USA_60s_End_the_PHOENIX_Program: "Mettre fin au programme PHOENIX"
 USA_60s_End_the_PHOENIX_Program_desc: "Malgré un succès limité, le programme PHOENIX est inhumain et, le plus souvent, il entraîne la mort d'un civil innocent plutôt que celle d'un soldat Viêt-Cong. Il faut y mettre un terme immédiatement."
 USA_60s_Bomb_the_Pathet_Lao: "Bombarder le Pathet Lao"
 USA_60s_Bomb_the_Pathet_Lao_desc: "Finalement, après avoir réarmé les royalistes et formé des unités spéciales, nous mènerons l'un des plus grands bombardements jamais planifiés au monde et anéantirons les Khmers rouges depuis les airs. Ils n'auront aucune chance face à la puissance d'une superpuissance moderne."
 USA_60s_Continue_Funding_the_LDP: "Continuer à financer le PLD"
 USA_60s_Continue_Funding_the_LDP_desc: "Le PLD est l’un des seuls régimes non communistes (ou non impliqué dans un quelconque conflit) en Asie du Sud-Est, et mérite notre soutien continu, malgré certaines politiques antidémocratiques antérieures."
 USA_60s_State_Department: "Le Département d'État"
 USA_60s_State_Department_desc: "Le Département d'État est l'organe du gouvernement et du pays que le monde voit, entend et auquel il réagit. Il jouera un rôle crucial dans les décennies à venir, alors que nous tenterons de maintenir le contrôle de l'ordre mondial."
 USA_60s_Rethinking_our_Foriegn_Policies: "Repenser nos politiques étrangères"
 USA_60s_Rethinking_our_Foriegn_Policies_desc: "À ce stade avancé de la décennie, nous bénéficions désormais du recul et de la possibilité de modifier notre approche en matière de politique étrangère, à savoir si le concept de confinement sera maintenu ou remplacé."
 USA_60s_The_Middle_East: "Le Moyen-Orient"
 USA_60s_The_Middle_East_desc: "La situation au Moyen-Orient a radicalement changé depuis les années 1950. Nous avons assisté à l'essor d'un nouveau nationalisme panarabe, mené par Gamal Abdel Nasser, ainsi qu'à sa tentative réussie d'annexion du canal de Suez. Nos alliés plus démocratiques, comme Israël et l'Iran, ont désespérément besoin de soutien et d'aide, et nous les leur apporterons."
 USA_60s_Aid_the_Pahalvi_Regime: "Aider le régime Pahlavi"
 USA_60s_Aid_the_Pahalvi_Regime_desc: "Le Shah a déjà survécu à de nombreux coups d'État et tentatives d'assassinat, mais l'opposition interne et l'instabilité grandissent. Nous devons l'aider si nous voulons que son régime perdure."
 USA_60s_Subsidize_the_Iranian_Armed_Forces: "Subventionner les forces armées iraniennes"
 USA_60s_Subsidize_the_Iranian_Armed_Forces_desc: "Les forces armées iraniennes, bien qu'elles aient régulièrement modernisé leurs équipements et leurs stratégies pour les adapter aux normes modernes, accusent encore un retard. Il faut remédier à cela."
 USA_60s_Outreach_to_Israel: "Contact avec Israël"
 USA_60s_Outreach_to_Israel_desc: "Israël est déjà l'un de nos alliés les plus fidèles au Moyen-Orient et le restera pendant de nombreuses années. Nous devons renforcer notre coopération et nos liens mutuels."
 USA_60s_Arm_Israel: "Armer Israël"
 USA_60s_Arm_Israel_desc: "Entouré de voisins hostiles qui éclipsent tous sa population, Israël, l'armée israélienne, a besoin de toute l'avance technologique possible, et nous pouvons la lui fournir."
 USA_60s_Reject_Containment: "Rejeter le confinement"
 USA_60s_Reject_Containment_desc: "L'endiguement est la politique étrangère suivie par notre gouvernement depuis 1947, et ses exigences de lutte simultanée contre l'influence soviétique partout dans le monde sont erronées et dépassées. Il est temps de nous retirer de nos divers ancrages en Asie et en Afrique."
 USA_60s_Vietnamization: "Vietnamisation"
 USA_60s_Vietnamization_desc: "La politique de vietnamisation prévoit le retrait des forces américaines du Vietnam et leur remplacement par davantage de forces de l'ARVN, afin de rendre la guerre du Vietnam plus vietnamienne. Reste à savoir si c'est une bonne idée sur le plan militaire."
 USA_60s_Withdraw_From_Vietnam: "Se retirer du Vietnam"
 USA_60s_Withdraw_From_Vietnam_desc: "Le processus de vietnamisation est achevé, et il est temps de retirer complètement nos soldats et conseillers du Vietnam. Bonne chance au Sud-Vietnam !"
 USA_60s_Saudi_Aid: "Aide saoudienne"
 USA_60s_Saudi_Aid_desc: "Les Saoudiens, même s’ils ne sont pas aussi démocratiques que nous l’aurions espéré, sont l’un de nos rares alliés au Moyen-Orient et ont besoin de notre soutien."
 USA_60s_Aid_Oman: "Aide à Oman"
 USA_60s_Aid_Oman_desc: "Oman est un petit pays ami, mais important, situé à l'embouchure de la mer Rouge et à proximité du golfe Persique. Nous devons veiller à ce qu'il reste notre allié."
 USA_60s_Launch_Airstrikes_in_Cambodia_and_Laos: "Lancer des frappes aériennes au Cambodge et au Laos"
 USA_60s_Launch_Airstrikes_in_Cambodia_and_Laos_desc: "Même si nous retirons nos forces terrestres, nous avons toujours un intérêt direct dans les conflits en Asie du Sud-Est. Des frappes aériennes et un soutien au Cambodge et au Laos protégeront ces intérêts."
 USA_60s_Increase_American_Influence_in_the_Persian_Gulf: "Accroître l'influence américaine dans le golfe Persique"
 USA_60s_Increase_American_Influence_in_the_Persian_Gulf_desc: "Le golfe Persique est une région vitale du Moyen-Orient en raison des quantités considérables de pétrole qui y transitent chaque jour. Nous devons entretenir de bonnes relations avec les pays riverains pour en assurer l'approvisionnement."
 USA_60s_Allow_The_PRC_In_the_UN: "Autoriser la RPC à siéger à l'ONU"
 USA_60s_Allow_The_PRC_In_the_UN_desc: "Malgré nos différences idéologiques évidentes et profondes, la Chine est une puissance mondiale trop importante pour être reléguée au second plan dans les discussions mondiales importantes, et il est temps de l’accepter au sein de l’ONU."
 USA_60s_Arm_Lon_Nol: "Armer Lon Nol"
 USA_60s_Arm_Lon_Nol_desc: "Lon Nol, président du Cambodge, a besoin de davantage d’aide militaire et d’équipement de notre part pour continuer la lutte contre les Khmers rouges. et nous le lui fournirons."
 USA_60s_Increase_Arms_Sales_to_Saudi_Arabia_and_Iran: "Augmenter les ventes d'armes à l'Arabie saoudite et à l'Iran"
 USA_60s_Increase_Arms_Sales_to_Saudi_Arabia_and_Iran_desc: "L'Arabie saoudite et l'Iran ont encore besoin d'armes et de conseillers. Comme nous avons besoin d'alliés plus forts à travers le monde, ils en bénéficieront."
 USA_60s_The_Korean_DMZ_Crisis: "La crise de la DMZ coréenne"
 USA_60s_The_Korean_DMZ_Crisis_desc: "Depuis 1964, les Nord-Coréens infiltrent et sabotent la République de Corée à travers la zone démilitarisée. Plus récemment, lors du désormais tristement célèbre raid de la Maison Bleue, ils ont tenté d'assassiner Park Chung Hee. Il faut agir !"
 USA_60s_Fortify_the_Border: "Fortifier la frontière"
 USA_60s_Fortify_the_Border_desc: "Même si nous aimerions tant détruire la RPDC, c'est trop risqué dans le contexte mondial actuel. Mieux vaut fortifier le côté sud de la zone démilitarisée que risquer une nouvelle guerre de Corée."
 USA_60s_Increase_Aid_to_the_Republic_of_Korea: "Augmenter l'aide à la République de Corée"
 USA_60s_Increase_Aid_to_the_Republic_of_Korea_desc: "Les récents événements ont clairement démontré le besoin d'aide militaire et économique de la République de Corée. Elle doit pouvoir se défendre contre son voisin hostile."
 USA_60s_Approve_Retaliatory_Strikes: "Approuver les frappes de représailles"
 USA_60s_Approve_Retaliatory_Strikes_desc: "L'insolence de la Corée du Nord a assez duré, et il est temps de réagir de la même manière. Des frappes de représailles en RPDC enverront le bon message. Il faut rendre la monnaie de sa pièce à ces communistes !"
 USA_60s_the_Second_Korean_War: "La deuxième guerre de Corée"
 USA_60s_the_Second_Korean_War_desc: "Il est temps de mettre un terme à cette situation de deux États une fois pour toutes et de corriger les erreurs commises il y a près de vingt ans. La Corée du Nord doit disparaître, et une seule Corée prendra sa place. En avant, soldats, pour la démocratie !"
 USA_60s_The_Tar_Baby_Option: "L'option Tar Baby"
 USA_60s_The_Tar_Baby_Option_desc: "La politique du Tar Baby implique des contacts plus étroits avec les gouvernements des minorités blanches d’Afrique australe, ainsi qu’une réduction des mesures économiques à leur encontre, dans une tentative de réaliser que l’apartheid, bien que déplaisant, est là pour rester, tout comme ces régimes."
 USA_60s_Limited_Approach: "Approche limitée"
 USA_60s_Limited_Approach_desc: "S'il est nécessaire de rouvrir les voies diplomatiques avec ces pays et de nouer des liens d'amitié, il n'est pas nécessaire de s'engager à fond dans ces relations. Une approche limitée est préférable."
 USA_60s_Circumvent_Rhodesian_Embargo: "Contourner l'embargo rhodésien"
 USA_60s_Circumvent_Rhodesian_Embargo_desc: "De nombreux citoyens rhodésiens innocents souffrent des embargos internationaux imposés sur leurs importations et exportations. En contournant cet embargo, nous pouvons aider ces innocents."
 USA_60s_Limited_Escalation: "Escalade limitée"
 USA_60s_Limited_Escalation_desc: "Même si nous ne nous lancerons pas tête baissée dans une nouvelle guerre après les raids de représailles, nous permettrons aux Sud-Coréens d'intensifier leurs patrouilles et leurs opérations de reconnaissance dans une sorte d'escalade limitée."
 USA_60s_Allow_American_Volunteers: "Autoriser les volontaires américains"
 USA_60s_Allow_American_Volunteers_desc: "Malgré notre soutien discret aux gouvernements de l'apartheid, nous souhaitons toujours, en fin de compte, leur disparition et celle de leurs idées racistes. Permettre à des volontaires de se rendre au Zimbabwe et dans d'autres régions contribuera à cet objectif."
 USA_60s_Extensive_Approach: "Approche extensive"
 USA_60s_Extensive_Approach_desc: "La Rhodésie et l'Afrique du Sud sont des régimes pleinement légitimes et méritent d'être reconnus comme tels. Nous les soutiendrons par tous les moyens possibles."
 USA_60s_Deploy_Advisors_to_the_Alcora_Exercise: "Déployer des conseillers pour l'exercice Alcora"
 USA_60s_Deploy_Advisors_to_the_Alcora_Exercise_desc: "L'opération Alcora est une alliance conjointe entre le Portugal, la Rhodésie et l'Afrique du Sud, les trois gouvernements qui luttent pour maintenir l'unité de leurs régimes issus de la minorité blanche. Nous devrions leur envoyer des conseillers pour les aider."
 USA_60s_Capitalize_on_the_Soviet_Sino_Split: "Capitaliser sur la scission sino-soviétique"
 USA_60s_Capitalize_on_the_Soviet_Sino_Split_desc: "Les Chinois et les Soviétiques se sont finalement séparés sur la base de divergences idéologiques majeures et d'objectifs contradictoires. Nous avons ici l'occasion de nous associer à l'un pour prendre l'avantage sur l'autre, que ce soit politiquement ou militairement."
 USA_60s_Outreach_to_Moscow: "Contact avec Moscou"
 USA_60s_Outreach_to_Moscow_desc: "Nous et nos anciens alliés avons parcouru un long chemin depuis l'âge d'or du début des années 40, mais avec une nouvelle menace à l'horizon, il est peut-être temps de reformer le groupe. Nous et les Soviétiques ? Qui l'eût cru !"
 USA_60s_Condemn_Chinese_Agression: "Condamner l'agression chinoise"
 USA_60s_Condemn_Chinese_Agression_desc: "Les Chinois se sont montrés beaucoup trop expansionnistes et agressifs, attaquant des nations sans défense comme le Tibet et ignorant les traités, ce qui aggrave la situation de Taïwan. Nous devons nous dresser contre eux."
 USA_60s_Negotiate_over_Vietnam: "Négocier sur le Vietnam"
 USA_60s_Negotiate_over_Vietnam_desc: "Le délégué polonais a fait plusieurs propositions à l'ONU pour s'asseoir avec les Vietnamiens et négocier la fin de la guerre."
 USA_60s_Joint_American_Soviet_War_Against_PRC: "Guerre conjointe américano-soviétique contre la RPC"
 USA_60s_Joint_American_Soviet_War_Against_PRC_desc: "Nos chefs d'état-major et nos agences de renseignement se sont rencontrés et les plans sont en place. Laissant de côté nos divergences pour l'instant, le meilleur moyen d'assurer une paix mondiale durable est de se débarrasser au plus vite de la RPC. Combattant une fois de plus aux côtés des Soviétiques, nous sommes prêts à replonger le monde dans le chaos pour le bien commun."
 USA_60s_Recognize_Rhodesia: "Reconnaître la Rhodésie"
 USA_60s_Recognize_Rhodesia_desc: "La Rhodésie est un gouvernement parfaitement légitime, et aucun Noir africain ne s'en plaint. Aux vainqueurs revient le butin, disons-nous, et les Rhodésiens ont été et seront à nouveau vainqueurs."
 USA_60s_Continue_Containment_Doctrines: "Poursuivre les doctrines de confinement"
 USA_60s_Continue_Containment_Doctrines_desc: "Même si son taux de réussite n’est pas de 100 %, le confinement nous a bien servi dans notre lutte contre le communisme mondial, et il ne serait pas logique de s’en débarrasser maintenant."
 USA_60s_Double_Down_in_Vietnam: "Double Down au Vietnam"
 USA_60s_Double_Down_in_Vietnam_desc: "Nous avons résisté au Vietnam pendant si longtemps, et ce n'est pas le moment d'abandonner nos alliés. Nous devons envoyer plus d'armes, plus de troupes et plus d'aide aux Sud-Vietnamiens."
 USA_60s_Increase_Aid_to_Taipei: "Augmenter l'aide à Taïwan"
 USA_60s_Increase_Aid_to_Taipei_desc: "En plus de rester au Vietnam, nous devons également aider nos autres amis du Sud-Est à survivre. Taipei a besoin d'aide supplémentaire pour résister à la RPC."
 USA_60s_Outreach_to_Beijing: "Contact avec Pékin"
 USA_60s_Outreach_to_Beijing_desc: "Tendre la main à la RPC en pleine scission sino-soviétique semble une sage idée, car nos ponts avec les Soviétiques sont déjà coupés depuis longtemps. Quel sera le résultat de cet effort diplomatique ?"
 USA_60s_State_Visit_to_China: "Visite d'État en Chine"
 USA_60s_State_Visit_to_China_desc: "Nos démarches auprès de Pékin ont été bien accueillies, et notre président effectuera la première visite officielle des États-Unis en RPC. Bon vol, Monsieur le Président !"
 USA_60s_Pressure_Hanoi: "Mettre la pression sur Hanoï"
 USA_60s_Pressure_Hanoi_desc: "Ho Chi Minh et son cabinet de Hanoï refusent d'écouter qui que ce soit, même leurs compatriotes communistes de RPC. Il est temps d'accroître la pression sur eux et de les contraindre à négocier."
 USA_60s_The_Shaghai_Communique: "Le communiqué de Shanghai"
 USA_60s_The_Shaghai_Communique_desc: "Le communiqué de Shanghai sera une communication conjointe entre nous et Pékin, affirmant notre volonté commune de travailler ensemble à la paix en Asie de l'Est et dans le Pacifique Sud-Est. Un toast à nos nouveaux amis communistes !"
 USA_60s_Intervene_in_Cambodia: "Intervenir au Cambodge"
 USA_60s_Intervene_in_Cambodia_desc: "Il est temps pour nous de nous impliquer plus directement dans la guerre au Cambodge, en envoyant davantage d’armes et d’hommes aux royalistes, et en renforçant nos liens diplomatiques."
 USA_60s_Increase_Arms_to_the_Hmong: "Augmenter les armes pour les Hmong"
 USA_60s_Increase_Arms_to_the_Hmong_desc: "Les Hmongs, une minorité au Vietnam, combattent à nos côtés depuis le début du conflit et ont besoin de notre soutien. Nous leur fournirons des armes et d'autres équipements pour les aider."
 USA_60s_Veto_PRC_Accension_into_the_UN: "Veto à l'accession de la RPC à l'ONU"
 USA_60s_Veto_PRC_Accension_into_the_UN_desc: "La RPC est un pays agressif, belliciste et expansionniste, à peine sorti d'une guerre civile sanglante. Elle n'a pas sa place au sein de l'organisation la plus prestigieuse du monde."
 USA_60s_Expand_Aid_to_South_Korea: "Augmenter l'aide à la Corée du Sud"
 USA_60s_Expand_Aid_to_South_Korea_desc: "Malgré la liberté obtenue grâce au cessez-le-feu de 1953, la République de Corée doit encore se défendre contre les instigateurs communistes nord-coréens et chinois. Pour ce faire, elle a besoin d'une économie et de forces armées plus fortes."
 USA_60s_Encourage_Further_Thai_Intervention_in_South_East_Asia: "Encourager une nouvelle intervention thaïlandaise en Asie du Sud-Est"
 USA_60s_Encourage_Further_Thai_Intervention_in_South_East_Asia_desc: "Les Thaïlandais ont été un allié étonnamment solide en Asie du Sud-Est et ont apporté leur soutien aux Sud-Vietnamiens et aux royalistes. Il est temps qu'ils s'impliquent davantage."
 USA_60s_The_Gulf_of_Tonkin_Incident: "L'incident du golfe du Tonkin"
 USA_60s_The_Gulf_of_Tonkin_Incident_desc: "Les Nord-Vietnamiens ont attaqué deux de nos destroyers en patrouille dans le golfe du Tonkin ! Cet acte de violence injustifié et sans précédent ne passera pas inaperçu. Cela. Signifie. La. Guerre."
 USA_60s_Begin_The_Vietnam_War: "Début de la guerre du Vietnam"
 USA_60s_Begin_The_Vietnam_War_desc: "L'heure de la guerre est à nouveau venue. Tous les coups sont permis, et aucune pitié ne sera accordée à Ho Chi Minh et à ses complices communistes. Nous les écraserons comme de petites fourmis."
 USA_60s_Restrict_Involvement: "Restreindre l'implication"
 USA_60s_Restrict_Involvement_desc: "Même s'il pouvait paraître grandiose de s'élancer dans la jungle vietnamienne dense au plus fort de l'incident du golfe du Tonkin, la raison a pris le dessus et a décidé que la situation était trop complexe pour s'y lancer. Pour l'instant, nous mènerons des opérations limitées."
 USA_60s_Crush_the_Khmer_Rouge: "Écraser les Khmers rouges"
 USA_60s_Crush_the_Khmer_Rouge_desc: "La guerre civile cambodgienne a assez duré. Il est temps d'intervenir et de mettre fin définitivement à la révolte des Khmers rouges."
 USA_60s_Tacit_Support_of_South_Africa: "Soutien tacite à l'Afrique du Sud"
 USA_60s_Tacit_Support_of_South_Africa_desc: "Même si nous ne pouvons pas être vus en train de soutenir publiquement le gouvernement sud-africain, nous devons lui faire savoir qu’il a notre soutien, à la fois en paroles et en actes."
 USA_60s_Aid_Portugal_Colonial_Conflicts: "Aide aux conflits coloniaux du Portugal"
 USA_60s_Aid_Portugal_Colonial_Conflicts_desc: "Les Portugais sont impliqués dans des guerres coloniales partout dans le monde et ont un besoin urgent de soutien. Nous leur apporterons cette aide."
 USA_60s_Reduce_Global_Tensions: "Réduire les tensions mondiales"
 USA_60s_Reduce_Global_Tensions_desc: "Depuis quelques années, voire quelques décennies, les tensions mondiales atteignent un niveau alarmant. En tant que première puissance mondiale, il nous appartient de les apaiser."
 USA_60s_The_American_Armed_Forces: "Les forces armées américaines"
 USA_60s_The_American_Armed_Forces_desc: "Malgré toutes nos opérations secrètes et nos efforts diplomatiques, notre armée est la seule véritable force qui nous maintient en vie et prospère. Elle doit être soutenue et entretenue pour que cette situation perdure."
 USA_60s_US_Missle_Command: "Commandement des missiles des États-Unis"
 USA_60s_US_Missle_Command_desc: "Bien qu'il s'agisse d'un département récent, le Commandement des missiles est un élément essentiel de notre mission militaire et constitue le seul obstacle à la réduction de notre population à l'atome par les Soviétiques. Nous devons poursuivre nos recherches sur les missiles."
 USA_60s_Polaris_SLBM_Deployment: "Déploiement du missile balistique intercontinental Polaris"
 USA_60s_Polaris_SLBM_Deployment_desc: "Le missile balistique sous-marin balistique Polaris est notre conception la plus réussie à ce jour et doit être déployé au plus vite dans nos flottes de sous-marins. Il donnera aux Soviétiques une raison supplémentaire de réfléchir à deux fois avant de déclencher leur prochaine guerre."
 USA_60s_Missle_Silo_Expansion: "Extension des silo à missiles"
 USA_60s_Missle_Silo_Expansion_desc: "À quoi servent les missiles si on n'a pas d'endroit où les stocker ? En agrandissant nos silos, nous pouvons également accroître notre force de missiles."
 USA_60s_Attempt_to_Close_the_Missle_Gap: "Tenter de combler l'écart en matière de missiles"
 USA_60s_Attempt_to_Close_the_Missle_Gap_desc: "Malgré tous nos efforts, les Soviétiques semblent avoir une longueur d'avance en matière de recherche et développement de missiles. Cela doit changer, même légèrement, si nous voulons survivre."
 USA_60s_Expand_Warhead_Production: "Développer la production d'ogives nucléaires"
 USA_60s_Expand_Warhead_Production_desc: "Les ogives nucléaires sont presque aussi importantes que les missiles qui les transportent et sont vitales pour nos intérêts. Nous devons accélérer leur production."
 USA_60s_The_American_Army: "L'armée américaine"
 USA_60s_The_American_Army_desc: "Notre armée, bien que n'étant pas particulièrement utile en tant que commandement de missiles pour la dissuasion, et tout à fait inutile en temps de paix, est néanmoins très importante pour la propagation de la démocratie dans le monde, et doit être soutenue et développée."
 USA_60s_Ford_Machinery_M113: "Machinerie Ford M113"
 USA_60s_Ford_Machinery_M113_desc: "Le M113 est un tout nouveau véhicule blindé de transport de troupes (VTT) conçu et produit par Ford. Haut de gamme et à la pointe de la technologie, il est dans notre intérêt de le distribuer le plus largement possible."
 USA_60s_M113_Armorered_Cavalry_Conversion: "Conversion de cavalerie blindée M113"
 USA_60s_M113_Armorered_Cavalry_Conversion_desc: "Le M113 équipera également certaines de nos unités de cavalerie blindée pour remplacer leurs véhicules blindés de transport de troupes vieillissants. Cela renforcera notre corps mécanisé et en fera une force redoutable."
 USA_60s_Encourage_M113_Exports: "Encourager les exportations de M113"
 USA_60s_Encourage_M113_Exports_desc: "L’exportation du M113 ne profitera pas seulement à notre gouvernement, elle renforcera également notre économie grâce aux ventes à l’exportation ainsi qu’à nos alliés lorsqu’ils le mettront en service."
 USA_60s_Mass_Adoption_of_the_M16: "Adoption massive du M16"
 USA_60s_Mass_Adoption_of_the_M16_desc: "Le M16, descendant de l'AR-15 et développé pendant la guerre du Vietnam, est l'un des meilleurs fusils jamais fabriqués au monde. Toutes nos forces terrestres devraient l'utiliser."
 USA_60s_The_MBT_70: "Le MBT-70"
 USA_60s_The_MBT_70_desc: "Le programme MBT-70 sera un projet de recherche et développement conjoint entre les États-Unis et l'Allemagne de l'Ouest visant à produire un char de combat principal capable de contrer les corps blindés soviétiques. Ce sera une tâche difficile, mais enrichissante."
 USA_60s_Abandon_the_MBT_70_Program: "Abandonner le programme MBT-70"
 USA_60s_Abandon_the_MBT_70_Program_desc: "Le MBT-70 est déjà largement hors budget et dépassé. Il est malheureusement temps de tourner la page sur cette expérience ratée."
 USA_60s_X_M803: "XM-803"
 USA_60s_X_M803_desc: "Le XM-803 est un projet de l'armée, censé être une version améliorée du MBT-70, un modèle défaillant, à un coût bien inférieur. L'avenir nous dira s'ils ont raison, mais pour l'instant, ils peuvent poursuivre leurs expériences."
 USA_60s_Lima_Tank_Plant_Explosion: "Agrandir l'usine de réservoirs de Lima"
 USA_60s_Lima_Tank_Plant_Explosion_desc: "L'usine de chars de Lima, dans l'Ohio, est en activité depuis 1941 et compte parmi les meilleures du pays. Pour accroître nos capacités de production de chars, l'agrandissement de l'usine est la solution."
 USA_60s_The_American_Navy: "La marine américaine"
 USA_60s_The_American_Navy_desc: "Notre marine nous permet de projeter notre puissance sur toutes les mers, loin de chez nous et dans des régions comme le Moyen-Orient et l'Asie du Sud-Est. Nous devons entretenir cette force si nous voulons continuer à le faire."
 USA_60s_Advanced_Naval_Design_Studies: "Études avancées de conception navale"
 USA_60s_Advanced_Naval_Design_Studies_desc: "De nouvelles avancées dans le domaine de la technologie navale apparaissent chaque jour, et nous devons les exploiter et les mettre à profit dans nos grandes flottes."
 USA_60s_Hydrofoil_Design_Studies: "Études de conception d'hydroptères"
 USA_60s_Hydrofoil_Design_Studies_desc: "De nouvelles études sur les hydroptères nous ont donné la possibilité de faire progresser considérablement notre technologie RHIB (bateau pneumatique à coque rigide)."
 USA_60s_Anti_Submarine_Ballistic_Missles: "Missiles balistiques anti-sous-marins"
 USA_60s_Anti_Submarine_Ballistic_Missles_desc: "Nous possédons des missiles balistiques sous-marins (SLBM), et maintenant les Soviétiques aussi. Nous devons créer un autre type d'arme pour empêcher leurs sous-marins de larguer leurs charges mortelles."
 USA_60s_Kittery_Shipyard_Expansion: "Agrandir le chantier naval de Kittery"
 USA_60s_Kittery_Shipyard_Expansion_desc: "Le chantier naval de Portsmouth, à Kittery, dans le Maine, est un important centre de production en Nouvelle-Angleterre pour notre marine et devrait être agrandi."
 USA_60s_Nuclear_Carrier_Development: "Développement de porte-avions nucléaires"
 USA_60s_Nuclear_Carrier_Development_desc: "Les porte-avions nucléaires représentent l'avenir. Ils peuvent aller plus loin, rester plus longtemps en mer et soutenir des opérations sur une zone plus vaste. Nous devons investir sans tarder dans de nouveaux modèles."
 USA_60s_Conventional_Nuclear_Naval_Propulsion: "Propulsion navale nucléaire conventionnelle"
 USA_60s_Conventional_Nuclear_Naval_Propulsion_desc: "Maintenant que les plans sont en place, nous devons faire progresser nos recherches sur les moteurs nucléaires afin de pouvoir alimenter nos nouveaux superporteurs."
 USA_60s_Mobile_Airfield: "Aérodrome mobile"
 USA_60s_Mobile_Airfield_desc: "Nos tout nouveaux CVN sont exactement ce que les pères fondateurs de la doctrine des porte-avions avaient imaginé il y a des années : d'immenses aérodromes flottants, chacun capable de soutenir et de mener des frappes stratégiques précises à travers les océans."
 USA_60s_Salt_Water_Nuclear_Engines: "Moteurs nucléaires à eau salée"
 USA_60s_Salt_Water_Nuclear_Engines_desc: "Nos recherches ont montré que nous avons besoin de moteurs nucléaires spécialisés pour l'environnement marin, où vivent pratiquement nos porte-avions. Nous devons progresser dans ce domaine sans tarder."
 USA_60s_The_American_Airforce: "L'armée de l'air américaine"
 USA_60s_The_American_Airforce_desc: "L'armée de l'air a opéré même lorsque et là où nos autres branches ne le pouvaient pas, fournissant des ponts aériens aux nations affamées, soutenant les régimes démocratiques avec une couverture aérienne et bombardant nos ennemis communistes à travers le monde."
 USA_60s_Strategic_Bomber_Command_Restructure: "Restructuration du Strategic Bomber Command"
 USA_60s_Strategic_Bomber_Command_Restructure_desc: "De nouveaux modèles et rôles de bombardiers sont produits chaque jour, et nous devons mettre à jour notre structure de commandement pour refléter cela."
 USA_60s_Continue_High_Speed_Bomber_Development: "Poursuivre le développement des bombardiers à grande vitesse"
 USA_60s_Continue_High_Speed_Bomber_Development_desc: "Des plans pour un bombardier à grande vitesse sont en place et en cours depuis un certain temps, et nous devons les poursuivre pour ajouter cet avion vital à notre arsenal."
 USA_60s_Cancel_the_XB_70: "Annuler le XB-70"
 USA_60s_Cancel_the_XB_70_desc: "Le XB-70 Valkyrie a été conçu pour être le bombardier stratégique ultime à haute altitude et à grande vitesse. Malheureusement, ce ne fut pas le cas lors des essais en vol, et il est temps de le mettre au placard."
 USA_60s_Big_Four_B_52_Enhancement: "Amélioration du Big Four B-52"
 USA_60s_Big_Four_B_52_Enhancement_desc: "Le B-52 est la pierre angulaire de notre puissance aérienne, et il serait dommage de laisser tomber une plateforme d'armement aussi remarquable. Nous devons l'améliorer et la moderniser."
 USA_60s_Embrace_Systemic_Doctrine: "Adopter la doctrine systémique"
 USA_60s_Embrace_Systemic_Doctrine_desc: "Le rôle de notre armée de l'air a évolué depuis sa création, et il est temps que notre doctrine évolue en conséquence. L'adoption du programme systémique y contribuera."
 USA_60s_Air_Gunnery_Re_Emphasis: "Réadoption de la gunnery aérienne"
 USA_60s_Air_Gunnery_Re_Emphasis_desc: "Depuis trop longtemps, nous nous concentrons sur les bombardiers de haute technologie, et notre recherche et développement en matière d'avions de combat est à la traîne. C'est inacceptable et nous devons remettre l'accent sur les avions de combat à réaction."
 USA_60s_Chrysler_XM_1: "Chrysler XM-1"
 USA_60s_Chrysler_XM_1_desc: "Le XM-1 sera enfin la solution que nous recherchions pour remplacer le char M-60 Patton, aujourd'hui obsolète. Il est neuf, robuste et très performant. C'est exactement ce dont nous avions besoin, et que nous souhaitions, pour notre Corps Blindé."
 USA_60s_Carrier_Strike_Group_Formations: "Formations de groupes aéronavals"
 USA_60s_Carrier_Strike_Group_Formations_desc: "Alors que les porte-avions prennent une place croissante dans notre stratégie, nous ne pouvons nous permettre de les négliger, eux et leurs escadrons. La modernisation des formations de groupes d'attaque améliorera l'efficacité et la précision."
 USA_60s_Maintain_Missle_Prioritisation: "Maintenir la priorité des missiles"
 USA_60s_Maintain_Missle_Prioritisation_desc: "Bien que notre force aérienne habitée soit importante, notre commandement de missiles et notre R&D le sont encore plus, et nous ne pouvons pas l'oublier."
 USA_60s_Heavy_Napalm_Integration: "Intégration de napalm lourd"
 USA_60s_Heavy_Napalm_Integration_desc: "Le napalm est et sera un outil utile pour nettoyer les villages et les forêts denses. Son intégration à notre armée de l'air nous permettra de le déployer."
 USA_60s_Wild_Weasels: "Wild Weasels"
 USA_60s_Wild_Weasels_desc: "Les Wild Weasels sont des avions équipés de missiles anti-radiations et chargés de neutraliser et de neutraliser les défenses aériennes ennemies. Disposer d'avions et de pilotes dédiés à cette tâche permettra aux autres d'agir sans se soucier des tirs au sol."