 Operation_Firebird.1.d: "Dans le cadre de la guerre de Corée en cours, le commandant en chef de l'UNCOM, le général Douglas MacArthur, a lancé l'opération Hudson Harbor, un plan qui restera désormais dans l'infamie. Sous le couvert de la nuit, cinquante B-29 ont décollé de plusieurs pistes d'atterrissage et porte-avions positionnés dans la portée de la frontière coréenne-mandchoue, tous armés d'une charge nucléaire. Un par un, ils ont largué leurs charges infernales, dévastant la frontière d'Antung à Hunchun et piégeant effectivement l'Armée rouge chinoise. L'attaque a été étendue, avec un B-29 escorté livrant une bombe à charge plus lourde dans une attaque brutale sur Pékin. En quelques heures, les lignes d'approvisionnement et de commandement des communistes soutenus ont été détruites, et les Armées rouges ont été désorganisées. Maintenant, le commandant en chef a lancé la deuxième phase de son plan, alors que des centaines de milliers de soldats américains et du Kuomintang débarquent en Chine continentale."
