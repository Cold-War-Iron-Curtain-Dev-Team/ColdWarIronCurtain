 USASOV_VIETNAM.1.d: "L'invasion américaine des jungles vietnamiennes se poursuit sans opposition depuis un certain temps, bien que les troupes de [USA.GetNameDef] aient fait peu de progrès. Januscz Lewandowski, notre représentant à la Commission internationale de contrôle, a proposé une initiative diplomatique appelée \"Marigold\". Dans le cadre de cette proposition, il se chargerait de discerner les termes de la paix en agissant comme intermédiaire entre le Vietnam du Nord et l'ambassadeur américain au Vietnam du Sud."
 USASOV_VIETNAM.2.d: "L'invasion américaine des jungles vietnamiennes se poursuit sans opposition depuis un certain temps, bien que les troupes de [USA.GetNameDef] aient fait peu de progrès. Nous avons appris que Januscz Lewandowski, représentant polonais à la Commission internationale de contrôle, a proposé une initiative diplomatique appelée \"Marigold\". Dans le cadre de cette proposition, il aiderait à discerner les termes de la paix en agissant comme intermédiaire entre le Vietnam du Nord et l'ambassadeur américain au Vietnam du Sud. Bien que nous ne devions pas intervenir activement dans la médiation, nous pouvons empêcher son initiative, si nous le souhaitons."
 USASOV_VIETNAM.3.d: "L'ambassadeur soviétique en [POL.GetNameDef] a contacté nos diplomates au sujet de Marigold, l'initiative diplomatique récemment lancée par Januscz Lewandowski. Ces diplomates ont suggéré de manière maladroite, avec des menaces à peine voilées, que nous empêchions ses efforts de diplomatie. Malheureusement, nous ne pouvons pas permettre à Lewandowski de poursuivre cette initiative."
 USASOV_VIETNAM.4.d: "Notre ambassadeur au Vietnam du Sud a reçu une communication du représentant polonais à la Commission internationale de contrôle, Januscz Lewandowski. Lewandowski a exprimé le souhait de servir d'intermédiaire dans les négociations de paix entre le Vietnam du Nord et [USA.GetNameDef]. Alors que certains des conseillers les plus proches du Président estiment que nous devrions saisir cette opportunité pour sortir de la guerre, de nombreux partisans de la guerre croient que nous pouvons lutter bec et ongles pour remporter cette bataille contre le communisme."
 USASOV_VIETNAM.5.d: "Le gouvernement [USA.GetAdjective] a officiellement accepté notre proposition pour des négociations de paix entre le Vietnam du Nord et [USA.GetNameDef] ! Nous pouvons nous attendre à de véritables négociations dans les mois à venir au siège des Nations Unies, si [VIN.GetNameDef] accepte."
 USASOV_VIETNAM.6.d: "L'initiative diplomatique Marigold a été rapidement et sans ambiguïté rejetée par [USA.GetAdjective]. Malheureusement, nous ne serons pas en mesure de résoudre le conflit au Vietnam."
 USASOV_VIETNAM.7.d: "Le représentant polonais à la CIC, Januscz Lewandowski, s'est porté volontaire pour jouer le rôle d'intermédiaire dans les négociations de paix entre notre nation et [USA.GetNameDef] ! Les Américains semblent même disposés à collaborer avec nous pour la paix."
 USASOV_VIETNAM.8.d: "Des représentants de [USA.GetNameDef] et de [VIN.GetNameDef] se sont rencontrés sous la supervision du représentant polonais Lewandowski au siège des Nations Unies. Après plusieurs jours de négociations tendues, ils ont convenu des termes de paix, qui ont ensuite été confirmés par les gouvernements de [USA.GetNameDef] et de [VIN.GetNameDef]. L'armée [USA.GetAdjective] se retirera bientôt d'Asie du Sud-Est."
 USASOV_VIETNAM.9.d: "Les dirigeants de [VIN.GetNameDef] ont rejeté nos tentatives de paix ! Pour une raison inconnue, ils semblent vouloir continuer le combat."
