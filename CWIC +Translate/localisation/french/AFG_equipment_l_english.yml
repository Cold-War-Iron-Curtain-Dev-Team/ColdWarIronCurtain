l_english:
 AFG_infantry_equipment_0:0 "Fusil Lee-Enfield à chargeur court, n° 4 Mk I"
 AFG_infantry_equipment_0_short:0 "SMLE No. 4"
 AFG_infantry_equipment_0_desc:0 "Le Lee-Enfield est un fusil à répétition à verrou, alimenté par magasin, qui fut l'arme principale de l'Empire britannique et du Commonwealth durant la première moitié du XXe siècle. Il fut le fusil standard de l'armée britannique de 1895 à 1957. Ce fusil fut largement utilisé durant la Seconde Guerre mondiale, notamment en Afrique du Nord, en Italie, dans le Pacifique et en Birmanie, par les forces britanniques et du Commonwealth. L'Australie et l'Inde conservèrent et produisirent le SMLE Mk III* comme fusil standard durant le conflit, et ce fusil resta en service dans l'armée australienne durant la guerre de Corée, jusqu'à son remplacement par le L1A1 SLR à la fin des années 1950."
 AFG_infantry_equipment_1:0 "Avtomat Kalashnikova 1947"
 AFG_infantry_equipment_1_short:0 "AK-47"
 AFG_infantry_equipment_1_desc:0 "L'AK-47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais il n'entra en service actif qu'en 1948, date à laquelle la version à crosse fixe fut mise en production. Début 1949, l'AK-47 fut adopté par les forces armées soviétiques pour un déploiement massif au sein des unités de première ligne. Doté d'un piston à gaz à longue course, d'un sélecteur de tir avec sécurité, d'un mécanisme de détente et d'alimentation automatique, ainsi que d'autres améliorations de conception, l'AK-47 représentait une nette amélioration par rapport au SKS. Pendant de nombreuses années, l'AK-47 fut considéré comme l'une des armes les plus fiables, faciles à entretenir, à manier et à apprendre au monde."
 AFG_infantry_equipment_2:0 "Avtomat Kalashnikova Modernizirovanniy"
 AFG_infantry_equipment_2_short:0 "AKM"
 AFG_infantry_equipment_2_desc:0 "L'AKM est une version modernisée de l'AK-47, développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'Armée soviétique en 1959. L'arme a été largement optimisée et repensée pour répondre aux besoins de l'armée en pleine modernisation. De nombreuses pièces ont été simplifiées pour la production de masse et le boîtier en acier usiné a été remplacé par une pièce en acier emboutie en forme de U afin d'améliorer les cadences de production. Grâce à ces simplifications, l'arme était également beaucoup plus légère, son poids étant réduit d'environ 30 %. De plus, elle a été renforcée pour une meilleure robustesse et des rails de guidage ont été ajoutés pour faciliter le mouvement du porte-culasse. L'AKM a été immédiatement et largement utilisée par de nombreux pays communistes et produite pour les conflits tout au long de sa durée de vie. On peut notamment citer l'invasion de la Tchécoslovaquie, où elle a été utilisée par les deux camps."
 AFG_infantry_equipment_3:0 "Avtomat Kalashnikova 1974"
 AFG_infantry_equipment_3_short:0 "AK-74"
 AFG_infantry_equipment_3_desc:0 "L'AK74 est un fusil d'assaut moderne développé par Mikhaïl Kalachnikov pour remplacer l'AKM en 1974. Il utilise une cartouche plus petite et un canon chromé amélioré avec 4 rainures à droite. Le guidon et le bloc de gaz ont été redessinés pour contenir un canal bas installé à 90 degrés par rapport à l'axe du canon afin de réduire le cisaillement des balles au niveau de la fenêtre d'éjection. De plus, son développement s'est accompagné de divers accessoires, notamment une crosse rembourrée en caoutchouc. Les améliorations apportées à l'AK74 ont permis aux soldats de transporter une plus grande quantité de munitions sur le terrain et de maintenir un volume de tir plus élevé avec une précision accrue à moyenne distance. Il a été utilisé à grands frais pendant le conflit en Afghanistan, où la CIA a versé une somme importante aux moudjahidines pour récupérer un AK74 capturé."
 AFG_infantry_equipment_4:0 "Avtomat Kalashnikova 1974 Modernizirovanniy"
 AFG_infantry_equipment_4_short:0 "AK-74M"
 AFG_infantry_equipment_4_desc:0 "L'AK-74M est une variante améliorée de l'AK-74 développée en 1991 par l'usine Izhmash. L'AK-74M a été développé afin d'intégrer de nouveaux matériaux et des avancées technologiques dans la fabrication pour créer une arme améliorée. Il est équipé d'un verrou et d'un porte-verrou allégés qui réduisent le recul produit par le piston à gaz. Le fusil comprend également une crosse en polyamide renforcé de fibre de verre qui peut être tenue sur le côté, un canon amélioré, un couvercle renforcé et plusieurs autres améliorations mineures. Il est également équipé d'un rail pour le montage d'optiques. Le fusil allégé et renforcé était plus facile à manipuler et à transporter et offrait un meilleur support pour les accessoires. Il n'a pas été adopté par l'Union soviétique, car l'URSS s'est effondrée avant qu'il puisse être envisagé, mais il a été adopté par la Fédération de Russie."
 AFG_lt_equipment_1:0 "T-60"
 AFG_lt_equipment_1_short:0 "T-60"
 AFG_lt_equipment_1_desc:0 "Le T60 était un char léger fabriqué pour remplacer le T-38 dans son rôle de reconnaissance. Il a été conçu en 1941 par Nicholas Astrov et 6 300 exemplaires ont été produits au cours des deux années de sa fabrication. Ce véhicule était un char à deux membres d'équipage équipé d'un moteur 6 cylindres et pouvant atteindre une vitesse de 44 km/h, avec un canon principal de 20 mm. Il a été largement utilisé pendant la Seconde Guerre mondiale."
 AFG_lt_equipment_2:0 "T-70"
 AFG_lt_equipment_2_short:0 "T-70"
 AFG_lt_equipment_2_desc:0 "Le char léger T-70 était un char de reconnaissance de la Seconde Guerre mondiale fabriqué pour remplacer le PT60. Nicholas Astrov a commencé à travailler immédiatement après le PT60 et aterminé en 1942. Au cours des 2 années de fabrication, 8 300 ont été produits. Le char avait un canon bien plus gros de 45 mm et était équipé de 2 moteurs GAZ-202 et pouvait atteindre jusqu'à 45 km/h. Le T-70 avait également une capacité optique nominalement améliorée, Il a été largement utilisé pendant la Seconde Guerre mondiale. "
 AFG_lt_equipment_3:0 "PT-76"
 AFG_lt_equipment_3_short:0 "PT-76"
 AFG_lt_equipment_3_desc:0 "Le PT-76 est un char léger amphibie soviétique qui a été largement exporté à travers le monde. Il a été conçu par Nikolai Shashmyrin et Zh. Kotin en 1951, et environ 12 000 exemplaires ont été produits. Il nécessite un équipage de trois hommes et est équipé d’un moteur V6 six cylindres en ligne, lui permettant d’atteindre une vitesse de 44 km/h sur terre et de nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique ou proches de l’Union soviétique et a ainsi rempli un rôle de reconnaissance dans pratiquement tous les conflits impliquant des nations de cette sphère. Toutefois, il est encore utilisé aujourd’hui par de nombreux pays en raison de sa fiabilité réputée et de sa facilité d’entretien."
 AFG_lt_equipment_4:0 "PT-76B Modèle 4"
 AFG_lt_equipment_4_short:0 "PT-76B"
 AFG_lt_equipment_4_desc:0 "Le PT-76 est équipé d'un canon rayé D-56TS de 76,2 mm (frein de bouche à double déflecteur, éjecteur de douilles, extracteur de fumée et système de stabilisation à deux axes STP-2P « Zarya »), du système de protection PAZ (protivo-atomnaya zashchita) , un système d'extinction automatique d'incendie, un viseur TShK-2-66 amélioré, un système de filtration-ventilation, des dispositifs d'observation améliorés, un équipement électrique amélioré, un nouveau moteur diesel V-6B 6 cylindres 4 temps en ligne refroidi par eau développant 263 ch (196 kW) à 1800 tr/min et des réservoirs de carburant internes supplémentaires pour lesquels la forme du blindage a dû être légèrement modifiée."
 AFG_lt_equipment_5:0 "BRM-1K"
 AFG_lt_equipment_5_short:0 "BRM-1K"
 AFG_lt_equipment_5_desc:0 "Le BRM-1K est un véhicule d'origine soviétique de reconnaissance datant de la fin de la Guerre froide. Il a été développé pour soutenir les formations blindées et mécanisées employées par les forces soviétiques. Le BRM-1K devait repérer les routes et détecter les formations ennemies."
