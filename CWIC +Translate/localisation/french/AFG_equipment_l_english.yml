 AFG_ht_equipment_4:0 "T-10"
 AFG_ht_equipment_4_short:0 "T-10"
 AFG_ht_equipment_5:0 "T-10M"
 AFG_ht_equipment_5_short:0 "T-10M"
 AFG_mbt_equipment_0:0 "T-34-85"
 AFG_mbt_equipment_0_short:0 "T-34-85"
 AFG_mbt_equipment_0_desc:0 "Le T-34 est un char moyen soviétique qui a révolutionné le domaine de la conception des chars et qui est réputé pour sa fiabilité. Le T-34 a été conçu en 1940 par KMBD en Union soviétique. Afin de réduire les coûts, un blindage incliné a été intégré à la conception du char. Cependant, cela a également permis d'améliorer considérablement la protection du char et de réduire son coût grâce à une surface plus petite. L'arme elle-même est un canon de 76,2 mm et avait une capacité nominale de transport de munitions. Cependant, les viseurs et les dispositifs de vision étaient particulièrement médiocres, ce qui rendait leur utilisation difficile pour les commandants de chars, et leur faible capacité de coordination réduisait considérablement les avantages offerts par le char lui-même. Le T-34 est devenu le deuxième char le plus produit au monde, mais l'un des plus importants de la Seconde Guerre mondiale. Les T-34 sont encore utilisés aujourd'hui par les insurgés et les pays pauvres."
 AFG_mbt_equipment_1:0 "T-34-85M"
 AFG_mbt_equipment_1_short:0 "T-34-85M"
 AFG_mbt_equipment_1_desc:0 "Le T-34 est un char moyen soviétique qui a révolutionné le domaine de la conception des chars et qui est réputé pour sa fiabilité. Le T-34 a été conçu en 1940 par KMBD en Union soviétique. Afin de réduire les coûts, un blindage incliné a été intégré à la conception du char. Cependant, cela a également permis d'améliorer considérablement la protection du char et de réduire son coût grâce à une surface plus petite. L'arme elle-même est un canon de 76,2 mm et avait une capacité nominale de transport de munitions. Cependant, les viseurs et les dispositifs de vision étaient particulièrement médiocres, ce qui rendait leur utilisation difficile pour les commandants de chars, et leur faible capacité de coordination réduisait considérablement les avantages offerts par le char lui-même. Le T-34 est devenu le deuxième char le plus produit au monde, mais l'un des plus importants de la Seconde Guerre mondiale. Les T-34 sont encore utilisés aujourd'hui par les insurgés et les pays pauvres."
 AFG_mbt_equipment_2:0 "T-54"
 AFG_mbt_equipment_2_short:0 "T-54"
 AFG_mbt_equipment_2_desc:0 "Le char T-54 est le char le plus produit de l'histoire. Conçu en 1946 par KMBD, il est équipé d'un canon rayé de 100 mm et d'un blindage à épaisseur variable, de 60 à 205 mm. Son moteur diesel V12 de 38,88 litres et sa suspension à barres de torsion lui permettent d'atteindre une vitesse de 48 km/h. Utilisé par plus de 50 armées à travers le monde, il a été produit dans tout le bloc soviétique et a participé à tous les conflits qui y ont été liés."
 AFG_mbt_equipment_3:0 "T-55"
 AFG_mbt_equipment_3_short:0 "T-55"
 AFG_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. Le bureau d'études OKB-520 a modifié la conception du T-55 en améliorant sa protection NBC, en optimisant son moteur, en redessinant la tourelle et en ajoutant des équipements auxiliaires tels qu'un système de conduite de tir et des optiques améliorés. De plus, le T-55 utilisait plus fréquemment la mitrailleuse lourde DShK de 12,7 mm, tandis que le T-54 était équipé du canon SGMT de 7,62 mm, ce qui lui conférait une puissance de feu supérieure, mais limitait sa capacité d'emport de munitions. Le T-55 a été utilisé dans autant d'armées que le T-54 et a généralement participé aux mêmes conflits."
 AFG_mbt_equipment_4:0 "T-62"
 AFG_mbt_equipment_4_short:0 "T-62"
 AFG_mbt_equipment_4_desc:0 "Le T-62 est une évolution du char T-55. Il est équipé d'un canon à âme lisse et possède un blindage légèrement plus épais. Le calibre du canon principal a également été porté à 115 mm. Commandé initialement par l'Union soviétique dans le but d'améliorer sa puissance de feu, le projet fut achevé par le bureau d'études OKB-520 vers 1960. Malgré ses améliorations, sa production ne fut pas arrêtée, son coût étant nominalement supérieur à celui du T-55. Plus de 22 700 T-62 furent construits et il participa à de nombreux combats dans la sphère d'influence soviétique, notamment au Moyen-Orient. Ses améliorations démontrèrent une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique."
 AFG_mbt_equipment_5:0 "T-62M"
 AFG_mbt_equipment_5_short:0 "T-62M"
 AFG_mbt_equipment_5_desc:0 "Le T-62 est une évolution du char T-55. Il est équipé d'un canon à âme lisse et possède un blindage légèrement plus épais. Le calibre du canon principal a également été porté à 115 mm. Commandé initialement par l'Union soviétique dans le but d'améliorer sa puissance de feu, le projet fut achevé par le bureau d'études OKB-520 vers 1960. Malgré ses améliorations, sa production ne fut pas arrêtée, son coût étant nominalement supérieur à celui du T-55. Plus de 22 700 T-62 furent construits et il participa à de nombreux combats dans la sphère d'influence soviétique, notamment au Moyen-Orient. Ses améliorations démontrèrent une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique."
 AFG_mbt_equipment_6:0 "T-62M1"
 AFG_mbt_equipment_6_short:0 "T-62M1"
 AFG_mbt_equipment_6_desc:0 "Le T-62 est une évolution du char T-55. Il est équipé d'un canon à âme lisse et possède un blindage légèrement plus épais. Le calibre du canon principal a également été porté à 115 mm. Commandé initialement par l'Union soviétique dans le but d'améliorer sa puissance de feu, le projet fut achevé par le bureau d'études OKB-520 vers 1960. Malgré ses améliorations, sa production ne fut pas arrêtée, son coût étant nominalement supérieur à celui du T-55. Plus de 22 700 T-62 furent construits et il participa à de nombreux combats dans la sphère d'influence soviétique, notamment au Moyen-Orient. Ses améliorations démontrèrent une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique."
