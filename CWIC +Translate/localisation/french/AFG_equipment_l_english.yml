 AFG_fighter_equipment_0:0 "Force Aérienne Afghane"
 AFG_fighter_equipment_0_short:0 "FAA"
 AFG_fighter_equipment_0_desc:0 "L'Armée de l'Air Royale Afghane a été créée en 1921 sous le règne du roi Amanullah et a été considérablement modernisée par le roi Zahir Shah dans les années 1960. Au cours des années 1980, l'Union Soviétique a mis en place l'Armée de l'air afghane, d'abord dans le but de vaincre les moudjahidines et dans l'espoir qu'une forte puissance aérienne afghane préserverait le gouvernement pro-soviétique de Mohammad Najibullah"
 AFG_fighter_equipment_1:0 "Yakovlev Yak-3"
 AFG_fighter_equipment_1_short:0 "Yak-3"
 AFG_fighter_equipment_1_desc:0 "Le Yakovlev Yak-3 était un chasseur soviétique monomoteur et monoplace de la Seconde Guerre mondiale. Robuste et facile à entretenir, il était très apprécié des pilotes et du personnel au sol. L'un des chasseurs de combat les plus petits et les plus légers mis en service par n'importe quel combattant pendant la guerre, son rapport puissance/poids élevé lui a donné d'excellentes performances et il s'est avéré être un formidable chasseur de combat aérien."
 AFG_fighter_equipment_2:0 "Lavochkin La-7"
 AFG_fighter_equipment_2_short:0 "La-7"
 AFG_fighter_equipment_2_desc:0 "Le Lavochkin La-7 était un avion de chasse soviétique monoplace à moteur à pistons développé pendant la Seconde Guerre mondiale par le bureau d'études Lavochkin. Il s'agissait d'une version améliorée du Lavochkin La-5, et du dernier modèle d'une famille d'avions qui avait débuté avec le LaGG-1 en 1938."
 AFG_fighter_equipment_3:0 "Lavochkin La-9"
 AFG_fighter_equipment_3_short:0 "La-9"
 AFG_fighter_equipment_3_desc:0 "Le La-9 représente une évolution du prototype Lavochkin La-126. Le premier prototype, baptisé La-130, fut achevé en 1946. Sa ressemblance avec le célèbre Lavochkin La-7 n'était que superficielle : le nouveau chasseur était entièrement construit en métal et doté d'une aile à écoulement laminaire. La réduction du poids due à l'élimination du bois de la cellule permit d'augmenter considérablement la capacité en carburant et d'armer l'appareil de quatre canons. Des simulations de combat ont démontré que le La-130 était à égalité avec le La-7, mais inférieur au Yakovlev Yak-3 dans les plans horizontaux. Le nouveau chasseur, officiellement désigné La-9, est entré en production en août 1946. Au total, 1 559 appareils ont été construits jusqu'à la fin de la production en 1948."
 AFG_jet_multirole_equipment_1:0 "Mikoyan-Gurevich MiG-9"
 AFG_jet_multirole_equipment_1_desc:0 "Le MiG-9 Fargo fut le premier avion à réaction conçu par Mikoyan après la Seconde Guerre mondiale. Introduit en 1948, il fut utilisé de manière limitée au combat et à l'entraînement pendant la guerre civile chinoise et la guerre de Corée. Au total, 610 appareils furent produits, exclusivement par l'URSS. Les derniers MiG 9 furent retirés du service par la République populaire de Chine en 1951."
 AFG_jet_multirole_equipment_1_short:0 "MiG-9"
 AFG_jet_multirole_equipment_2:0 "Mikoyan-Gurevich MiG-15"
 AFG_jet_multirole_equipment_2_desc:0 "Sans doute l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a participé à de nombreux conflits depuis son introduction pendant la guerre de Corée, où il s'est révélé être un adversaire redoutable pour les F-86 Sabre et F9F Panther américains. Une partie de la frontière entre la Corée et la Chine a été surnommée « MiG Alley » en raison de leur omniprésence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Si la plupart des appareils ont été mis hors service dans les années 1950, certains sont encore en service dans l'armée de l'air nord-coréenne."
 AFG_jet_multirole_equipment_2_short:0 "MiG-15"
 AFG_jet_multirole_equipment_3:0 "Mikoyan-Gurevich MiG-17"
 AFG_jet_multirole_equipment_3_desc:0 "Successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence dans l'armée de l'air chinoise sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, en Afrique, en Europe et en Asie. Son premier déploiement au combat a eu lieu en 1958, lorsque des MiG de la République populaire de Chine ont affronté des F-86 Sabre chinois nationalistes au-dessus du détroit de Taiwan. Cependant, le MiG-17 a principalement été utilisé pendant la guerre du Vietnam par la NVAF et la PLAAF, où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même tenu tête aux chasseurs américains Phantom II, beaucoup plus modernes et supersoniques, pendant la guerre du Vietnam. Le MiG-17 a été généralement retiré du service dans les années 1970, mais il reste encore en service de manière limitée dans certains pays africains et en Corée du Nord."
 AFG_jet_multirole_equipment_3_short:0 "MiG-17"
 AFG_jet_multirole_equipment_4:0 "Mikoyan-Gurevich MiG-19"
 AFG_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de fabrication soviétique capable d'atteindre une vitesse supersonique en vol horizontal. Son équivalent américain dans la « série Century » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les McDonnell Douglas F-4 Phantom II et Republic F-105 Thunderchief, plus modernes, au-dessus du Nord-Vietnam."
 AFG_jet_multirole_equipment_4_short:0 "MiG-19"
 AFG_jet_multirole_equipment_5:0 "Mikoyan-Gurevich MiG-21F-13"
 AFG_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, équipé de missiles à portée au-delà du champ visuel et d'un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, notamment en Chine et en Inde où il a été construit en grand nombre sous licence. Plus de 11 000 exemplaires ont été construits, servant dans plus de 60 pays sur les 5 continents. Au cours de sa durée de vie, le MiG-21 a abattu 240 avions ennemis. Le MiG-21 a été utilisé dans de nombreux conflits, notamment au Vietnam (où il a remporté un énorme succès), lors de la guerre indo-pakistanaise de 1971, lors de la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il est toujours en service après plus de six décennies."
 AFG_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 AFG_jet_multirole_equipment_6:0 "Mikoyan-Gurevich MiG-21PF"
 AFG_jet_multirole_equipment_6_desc:0 "Version de série de l'intercepteur tout temps. Ces appareils étaient équipés du turboréacteur R11F2-300 et, à partir du septième lot de production, du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T, également appelé RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 afin de permettre l'utilisation du missile air-air à guidage laser RS-2US (alias K-5MS) en plus du missile à guidage infrarouge K-13."
 AFG_jet_multirole_equipment_6_short:0 "MiG-21PF"
 AFG_jet_multirole_equipment_7:0 "Mikoyan-Gurevich MiG-21bis"
 AFG_jet_multirole_equipment_7_short:0 "MiG-21bis"
 AFG_jet_multirole_equipment_7_desc:0 "Le développement ultime du MiG-21, équipé du turboréacteur Tumanskiy R25-300 et d'un grand nombre d'autres avancées par rapport aux types précédents. Ces MiG-21bis pour le PVO soviétique (Force de Défense aérienne) étaient équipés du système Lazur GCI (\"Fishbed-L\"), tandis que ceux de l'Armée de l'Air soviétique étaient équipés du système Polyot ILS (\"Fishbed-N\")."
 AFG_CAS_equipment_1:0 "Hawker Hind"
 AFG_CAS_equipment_1_short:0 "Hind"
 AFG_jet_light_equipment_1:0 "Yakovlev Yak 7"
 AFG_jet_light_equipment_1_short:0 "Yak-11"
 AFG_jet_light_equipment_1_desc:0 "Le Yak-11 est entré en service en 1947, servant d'entraîneur avancé standard avec les Forces aériennes soviétiques et la DOSAAF. Les Yak-11 et C-11 ont été utilisés dans tous les pays du Pacte de Varsovie et ont été exportés vers dix-huit pays, dont de nombreux pays d'Afrique, du Moyen-Orient et d'Asie."
 AFG_jet_light_equipment_2:0 "Mikoyan-Gurevich MiG-15UTI"
 AFG_jet_light_equipment_2_short:0 "MiG-15UTI"
 AFG_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 s'est vu officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n° 1 entre mars et mai 1949. La cabine de l'instructeur sur le MiG-15UTI a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement comprenait un canon NR-23 de 23 mm avec 80 cartouches et une mitrailleuse UBK-E avec 150 cartouches."
 AFG_jet_light_equipment_3:0 "L-29 Delfin"
 AFG_jet_light_equipment_3_short:0 "L-29 Delfin"
 AFG_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín (nom de code OTAN : Maya) est un avion d'entraînement militaire à réaction développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Plus de 3 000 exemplaires du L-29 Delfín ont été produits. Environ 2 000 d'entre eux auraient été livrés à l'Union soviétique, où il a servi d'avion d'entraînement standard pour l'armée de l'air soviétique."
 AFG_jet_light_equipment_4:0 "Aero L-39 Albatros"
 AFG_jet_light_equipment_4_short:0 "L-39 Albatros"
 AFG_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme principal avion d'entraînement. Il a été le premier avion d'entraînement à être équipé d'un turboréacteur à double flux. Ce modèle a été exporté vers de nombreux pays en tant qu'avion d'entraînement militaire."
 AFG_jet_light_equipment_5:0 "Aero L-39ZA Albatros"
 AFG_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 AFG_jet_light_equipment_5_desc:0 "L-39 considérablement amélioré pour l'entraînement au combat et les attaques légères, équipé d'un train d'atterrissage plus robuste, d'une charge utile plus importante et, surtout, d'un canon double GSh-23L de 23 millimètres fixé dans un pod conforme sous le cockpit, avec un chargeur de 150 cartouches dans le fuselage."
 AFG_recon_equipment_0:0 "Tupolev Tu-2R"
 AFG_recon_equipment_0_short:0 "Tu-2R"
 AFG_recon_equipment_0_desc:0 "Version de reconnaissance du Tu-2."
 AFG_jet_recon_equipment_0:0 "Mikoyan-Gurevich MiG-15Rbis"
 AFG_jet_recon_equipment_0_short:0 "MiG-15Rbis"
 AFG_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, l'OKB MiG a commencé à développer une variante de reconnaissance de première ligne du MiG-15 équipée d'une caméra AFA-BA/40, qui offre une largeur de balayage de 0,9 à 4,5 km avec une longueur de parcours photographique de 90 à 450 km à des altitudes comprises entre 2 000 et 10 000 m. Un seul canon NR-23 était installé sur l'avion. Afin d'augmenter l'autonomie du reconnaissance, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur « Barium-M » et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur l'appareil."
 AFG_jet_recon_equipment_1:0 "Mikoyan-Gurevich MiG-21R-13"
 AFG_jet_recon_equipment_1_short:0 "MiG-21R-13"
 AFG_jet_recon_equipment_1_desc:0 "Initialement nommé Izdeliye 03 pour confondre les étrangers, la désignation officielle du \"type\" du MiG-21R était Izdeliye 94R. La première unité de production a été déployée au début de 1966 et la production s'est poursuivie jusqu'en 1971. Pour les missions de reconnaissance, le MiG-21R pouvait transporter un pod PHOTINT de jour de type D, un pod PHOTINT de nuit de Type N, un pod ELINT à usage général de Type R ou un pod de type T abritant un système de télévision, faisant du MiG-21R l'un des premiers avions de reconnaissance soviétiques à utiliser l'équipement ELINT. De petits changements ont été apportés tout au long du cycle de production."
 AFG_jet_tac_bomber_equipment_2:0 "Ilyushin Il-28"
 AFG_jet_tac_bomber_equipment_2_short:0 "Il-28"
 AFG_jet_tac_bomber_equipment_2_desc:0 "L'Il-28 était un bombardier moyen à turboréacteur développé immédiatement après la fin de la Seconde Guerre mondiale pour l'armée de l'air soviétique. Premier bombardier à réaction à être produit à grande échelle, l'Il-28, lorsqu'il a été introduit en 1950, a servi dans de nombreux conflits majeurs de la guerre froide, du Vietnam à la guerre soviéto-afghane, en passant par le conflit de Suez et la guerre du Biafra. Même après avoir été retiré du service soviétique dans les années 1980, de nombreux appareils de ce type sont encore en service aujourd'hui. Le nom de code de l'USAF/DoD est Type 27, tandis que le nom de code de l'OTAN est Beagle."
 AFG_transport_plane_equipment_1:0 "Junkers G 24"
 AFG_transport_plane_equipment_1_short:0 "G 24"
 AFG_transport_plane_equipment_2:0 "Lisunov Li-2T"
 AFG_transport_plane_equipment_2_short:0 "Li-2T"
 AFG_transport_plane_equipment_3:0 "Ilyushin Il-14M"
 AFG_transport_plane_equipment_3_short:0 "Il-14M"
 AFG_transport_plane_equipment_4:0 "Antonov An-12"
 AFG_transport_plane_equipment_4_short:0 "An-12"
 AFG_transport_plane_equipment_5:0 "An-26"
 AFG_transport_plane_equipment_5_short:0 "An-26"
 AFG_transport_plane_equipment_6:0 "AN-32"
 AFG_transport_plane_equipment_6_short:0 "AN-32"
 AFG_transport_plane_equipment_7:0 "An-32B"
 AFG_transport_plane_equipment_7_short:0 "An-32B"
 AFG_jet_CAS_equipment_1:0 "Ilyushin IL-10M"
 AFG_jet_CAS_equipment_1_desc:0 "Le Yakovlev Yak-23 Flora était un avion d'attaque au sol de conception soviétique introduit en 1949. L'avion était un développement du chasseur à réaction Yak-15. Le Yak-23 a été principalement exporté vers les pays du pacte de Varsovie, où il est resté en service jusqu'à la fin des années 1950."
 AFG_jet_CAS_equipment_1_short:0 "IL-10M"
 AFG_jet_CAS_equipment_2:0 "Mikoyan-Guerevich MiG-17bis"
 AFG_jet_CAS_equipment_2_desc:0 "Conversion d'un chasseur-bombardier, équipé pour transporter des roquettes et des bombes non guidées."
 AFG_jet_CAS_equipment_2_short:0 "MiG-17bis"
 AFG_jet_CAS_equipment_3:0 "Mikoyan-Guerevich MiG-19S"
 AFG_jet_CAS_equipment_3_desc:0 "Version chasseur-bombardier avec queue à panneaux mobiles. Équipé d'un récepteur de navigation longue portée Svod et armé de trois canons NR-30 de 30 mm. Il pouvait embarquer un pack de roquettes non guidées ORO-32K ou une bombe FAB-250 sous chaque aile, et à partir de 1957, il a été modifié pour pouvoir transporter quatre pods de roquettes."
 AFG_jet_CAS_equipment_3_short:0 "MiG-19S"
 AFG_jet_CAS_equipment_4:0 "Soukhoï Su-7"
 AFG_jet_CAS_equipment_4_desc:0 "La version bombardier du Su-7 Fitter-A a effectué son premier vol en mars 1959, avant d'entrer en service en 1961. Il est devenu le principal avion d'attaque au sol soviétique des années 1960. Entre 1957 et 1972, plus de 1 400 Su-7B ont été construits, dont une grande partie a été exportée. Cet avion était relativement populaire à l'étranger, où il a été utilisé par 10 pays. Il a été largement utilisé par les forces aériennes indiennes et égyptiennes. Il est toujours en service, mais de manière limitée, en Corée du Nord."
 AFG_jet_CAS_equipment_4_short:0 "Su-7B"
 AFG_jet_CAS_equipment_5:0 "Sukhoi Su-7BKL"
 AFG_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté du fuselage, réservoirs de carburant installés dans les ailes, points d'ancrage « humides » sous les ailes pour transporter des réservoirs de carburant externes, capable de transporter des bombes nucléaires tactiques."
 AFG_jet_CAS_equipment_5_short:0 "Su-7BKL"
 AFG_jet_CAS_equipment_6:0 "Sukhoi Su-22M4"
 AFG_jet_CAS_equipment_6_short:0 "Su-22M4"
 AFG_jet_CAS_equipment_6_desc:0 "Le Sukhoi Su-17 Fitter-C était une version améliorée de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers les forces aériennes du bloc de l'Est, des pays arabes et d'Amérique du Sud. Le Su-17 apportait des améliorations dans presque tous les domaines par rapport à son prédécesseur, notamment au niveau des capteurs, des performances de vol, de la charge utile, de l'autonomie et du balayage variable des ailes. De 1969 à 1990, 2 867 appareils ont été produits et utilisés dans 30 pays, dont 6 utilisent encore cet avion aujourd'hui."
 AFG_jet_CAS_equipment_7:0 "Sukhoi Su-22M4K"
 AFG_jet_CAS_equipment_7_short:0 "Su-22M4K"
 AFG_jet_CAS_equipment_7_desc:0 "Le Sukhoi Su-17 Fitter-C était une version améliorée de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers les forces aériennes du bloc de l'Est, des pays arabes et d'Amérique du Sud. Le Su-17 apportait des améliorations dans presque tous les domaines par rapport à son prédécesseur, notamment au niveau des capteurs, des performances de vol, de la charge utile, de l'autonomie et du balayage variable des ailes. De 1969 à 1990, 2 867 appareils ont été produits et utilisés dans 30 pays, dont 6 utilisent encore cet avion aujourd'hui."
 AFG_jet_CAS_equipment_8:0 "Sukhoi Su-25"
 AFG_jet_CAS_equipment_8_desc:0 "Le Sukhoi Su-25 Frogfoot est un avion d'attaque au sol bimoteur développé en Union soviétique. Il a effectué son premier vol en 1975 et a été mis en service en 1981. Depuis 1978, plus de 1 000 exemplaires ont été produits. Cet avion a connu un grand succès à l'étranger, où il a été vendu à 29 pays. Le Su-25 a ainsi participé à plusieurs conflits, notamment la guerre soviétique en Afghanistan, la guerre Iran-Irak et la guerre du Golfe. Il est toujours en service dans tous les pays importateurs."
 AFG_jet_CAS_equipment_8_short:0 "Su-25"