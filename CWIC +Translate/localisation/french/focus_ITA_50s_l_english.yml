 De_Gasperi_V:0 "Le cinquième gouvernement De Gasperi"
 ITA_De_Gasperi_Government_VI:0 "Sixième gouvernement De Gasperi"
 ITA_De_Gasperi_Government_VI_desc:0 "De Gasperi a formé son huitième gouvernement. La coalition est composée de la Démocratie chrétienne, du Parti socialiste démocratique italien, du Parti républicain italien et du Parti libéral italien. Il appartient désormais aux chambres de lui accorder la confiance."
 ITA_Degasperi_resignation:0 "Démission du gouvernement Degasperi"
 ITA_Degasperi_resignation_desc:0 "Lorsqu'il s'est présenté devant les deux chambres du Parlement, il a essuyé un vote de défiance avec 282 voix contre, 263 pour et 37 abstentions ; De Gasperi a annoncé sa démission"
 ITA_The_first_Governo_Tecnico:0 "Le premier gouvernement technique"
 ITA_The_first_Governo_Tecnico_desc:0 "Suite à la chute du dernier gouvernement d'Alcide De Gasperi, le président de la République, Luigi Einaudi, a chargé Pella de former un gouvernement dit « de gestion » ou « d'administration », dont la seule mission était d'obtenir l'adoption de la loi de finances"
 ITA_Pass_the_budget_law:0 "Adopter la loi de finances"
 ITA_Pass_the_budget_law_desc:0 "Notre priorité absolue est d'adopter la loi de finances avant le 30 octobre de chaque année"
 ITA_Trieste_Crisis:0 "La crise de Trieste"
 ITA_Trieste_Crisis_desc:0 "Trieste est italienne de plein droit, elle ne peut être cédée à la Yougoslavie"
 ITA_La_Diplomazia:0 "La voie diplomatique"
 ITA_La_guerra:0 "La guerre"
 ITA_La_guerra_desc:0 "Se tourner vers nos alliés est risqué et pourrait dévoiler notre plan ; si cela ne peut se faire dans la paix, ce sera par la guerre."
 desc:0 "Suite à la chute du dernier gouvernement d'Alcide De Gasperi, le président de la République, Luigi Einaudi, a chargé Pella de former un gouvernement dit « de service » ou « d'administration », dont la seule mission était d'obtenir l'adoption de la loi de finances"
 ITA_secure_western_support:0 "Obtenir le soutien de l'Occident"
 ITA_secure_western_support_desc:0 "Si nous voulons éviter un bain de sang pour reprendre Trieste, nous devons contacter nos alliés"