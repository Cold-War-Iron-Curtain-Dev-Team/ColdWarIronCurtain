 UNITY_DESC_0:0 "Des siècles d'humiliation, d'asservissement et de division n'ont fait que renforcer notre détermination à nous unifier. Seul un avenir uni peut garantir le destin du peuple arabe."
 UNITY_DESC_1:0 "Les résolutions suivantes seront débloquées en fonction de l'évolution de la situation dans le monde arabe. À mesure que l'opinion publique se tournera vers l'unification, des textes législatifs plus importants pourront être adoptés. Le processus peut débuter par l'examen de la première résolution disponible sur la voie de l'unification."
 UNITY_DESC_2:0 "L'union entraînera la disparition de la Ligue arabe et, par conséquent, sa dissolution officielle. Toute nation refusant de voter pour l'union sera exclue de la fraternité arabe, considérée comme un État traître, et fera l'objet de poursuites ultérieures…\nNous pouvons toutefois envisager un compromis plus acceptable : la création formelle d'une faction œuvrant pour la sécurité et la prospérité du monde arabe."
