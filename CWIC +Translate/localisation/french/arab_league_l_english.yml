 ARAB_LEAGUE_RESOLUTION.0.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour s'aligner sur la sphère [arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.0.d:0 "\nAprès des mois de négociations avec les autorités [arab_league_nation_global_target.GetAdjective], cette dernière a voté en faveur d'une initiative commune visant à construire un avenir prospère. Ce vote fait suite à plusieurs semaines d'auditions, de débats et de discussions sur la résolution. Les représentants [arab_league_nation_global_target.GetAdjective] souhaitent forger une relation solide, susceptible d'ouvrir la voie à des réalisations majeures, voire à une adhésion à l'OTAN et à une place sous la protection de l'OTAN. Cette entente cordiale devrait perdurer au moins quelques années, ou jusqu'au prochain incident majeur."
 ARAB_LEAGUE_RESOLUTION.01.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour s'aligner sur la sphère [arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.01.d:0 "\nAprès des mois de négociations avec nos autorités, la Ligue arabe a voté en faveur d'une initiative commune visant à bâtir un avenir prospère. Ce vote fait suite à plusieurs semaines d'auditions, de débats et d'arguments sur la résolution. Les représentants de la Ligue arabe souhaitent forger une relation solide, susceptible d'ouvrir la voie à des réalisations majeures, voire à l'adhésion à l'OTAN et à une place sous la protection de l'Occident. Cette entente cordiale devrait perdurer au moins quelques années, ou jusqu'au prochain incident majeur."
 ARAB_LEAGUE_RESOLUTION.1.d:0 "Lors d'une récente session de la Ligue arabe, notre pays a été ouvertement condamné pour violations des droits de l'homme dans une résolution. Cette décision nuit gravement à notre image internationale et à notre tourisme. Plus grave encore, elle encourage les ennemis de l'État et nos opposants à agir avec plus d'audace, alors que la surveillance internationale de nos actions s'intensifie. Certains hauts responsables gouvernementaux estiment que cette résolution devrait servir d'avertissement et que nous devons agir pour rassurer la communauté internationale et notre peuple quant au caractère juste de notre nation. D'autres hauts responsables affirment que le vote de la Ligue arabe était le fruit de la propagande et pourrait même être le résultat d'un dangereux complot interne. Ils soutiennent que nous ne devons pas interrompre nos politiques nécessaires, mais que nous pouvons certainement œuvrer à les dissimuler davantage au public."
 ARAB_LEAGUE_RESOLUTION.2.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour condamner le [arab_league_nation_global_target.GetAdjective] colonialisme"
 ARAB_LEAGUE_RESOLUTION.2.d:0 "\nLa Ligue arabe a adopté une résolution ferme condamnant le colonialisme de [arab_league_nation_global_target.GetAdjective]. Lors des débats précédant le vote, de nombreux membres ont souligné que le droit à l'autodétermination est un principe fondamental de la Charte de la Ligue arabe et que [arab_league_nation_global_target.GetAdjective] n'a offert à ses sujets coloniaux aucune perspective d'autonomie ni de contrôle sur leur avenir. Nombre de membres sont restés sceptiques face aux contre-arguments présentés, et il semble que la plupart soient convaincus que [arab_league_nation_global_target.GetAdjective] n'a pas accordé à ses colonies une participation suffisante à la gestion de leur administration ni à la définition de leur avenir politique. Les représentants de [arab_league_nation_global_target.GetAdjective] ont refusé de faire une déclaration officielle avant de quitter la Ligue arabe pour consulter leurs dirigeants. Ce vote est perçu comme une victoire majeure pour les militants anticolonialistes du monde entier."
 ARAB_LEAGUE_RESOLUTION.3.t:0 "La Ligue arabe vote pour condamner le colonialisme de [arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.3.d:0 "Une récente résolution de la Ligue arabe a condamné les possessions coloniales de notre nation. Cette résolution n'a pas reconnu notre contribution à ces régions en matière de sécurité, d'éducation et d'économie, mais elle porte néanmoins un coup dur à notre image internationale. Nul doute que des individus mal intentionnés et des éléments égarés dans les colonies se sentiront encouragés à nous attaquer ou à nous discréditer davantage. Nous pouvons certes maintenir notre politique et notre présence dans les colonies, au risque toutefois de nouvelles sanctions de la Ligue arabe. Plusieurs hauts responsables militaires et coloniaux ont rapidement fait part de leur préférence pour cette option. Nous pouvons également envisager l'élaboration de plans de décolonisation afin de contrer l'attention internationale négative dont nous sommes victimes. Certains hauts responsables estiment qu'il est possible de libérer ces États et de conserver une influence significative, bien que cela ne puisse être garanti."
 ARAB_LEAGUE_RESOLUTION.4.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour contenir l'influence de [arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.4.d:0 "\nUne nouvelle résolution adoptée par la Ligue arabe a formellement enjoint le[arab_league_nation_global_target.GetAdjective] de cesser d'étendre ses ressources pour accroître son influence sur d'autres États. De nombreux membres ont fait valoir que les activités de [arab_league_nation_global_target.GetAdjective] étaient sources de déstabilisation et de difficultés économiques, et qu'elles menaçaient la souveraineté de trop nombreux États. Nombreux étaient ceux qui semblaient convaincus par les débats affirmant que les actions de [arab_league_nation_global_target.GetAdjective] s'apparentaient à une nouvelle forme de colonialisme, dissimulée au regard du public. Après le vote, plusieurs représentants ont souligné le caractère néfaste des pratiques de [arab_league_nation_global_target.GetAdjective] et ont averti que l'inaction risquerait de replonger le monde dans une compétition mondiale violente."
 ARAB_LEAGUE_RESOLUTION.5.t:0 "[GetNewspaperHeader]La Ligue arabe vote le gel des actifs nationaux de[arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.5.d:0 "\nAprès de longs débats, la Ligue arabe a voté le gel des avoirs nationaux de [arab_league_nation_global_target.GetAdjective]. Ses membres ont estimé que le gouvernement de [arab_league_nation_global_target.GetAdjective] utilisait ses fonds de manière inappropriée, au détriment de la communauté internationale et de son peuple. Il s'agit d'un revers majeur pour le gouvernement de [arab_league_nation_global_target.GetAdjective]. À l'issue du vote, son représentant a déclaré à la presse que ce résultat était non seulement décevant, mais constituait également un recul des normes internationales relatives à la souveraineté des États. Il a prédit qu'un tel vote entraînerait de nouvelles atteintes aux droits des nations et de leurs peuples. D'autres pays ont publié des déclarations affirmant que [arab_league_nation_global_target.GetAdjective] avait enfreint tellement de normes acceptables que ce résultat était inévitable."
 ARAB_LEAGUE_RESOLUTION.6.t:0 "[GetNewspaperHeader]La Ligue arabe vote des sanctions contre des personnalités importantes de [arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.6.d:0 "\nLa Ligue arabe a voté des sanctions contre des personnalités importantes du [arab_league_nation_global_target.GetAdjective]. Ces individus sont accusés de nombreux crimes et actes de corruption. La Ligue arabe espère que ces sanctions inciteront le gouvernement du [arab_league_nation_global_target.GetAdjective] à arrêter ou à détenir ces personnes. Ce vote a été salué par de nombreux médias, qui y ont vu une mesure visant les principaux responsables et non une punition infligée à l'ensemble de la société ou même du gouvernement. Dans le même esprit, un diplomate de haut rang a déclaré aux médias que ces sanctions visaient à aider le peuple du [arab_league_nation_global_target.GetAdjective] à assainir ses institutions et à réaliser ses aspirations. Aucune des personnes sanctionnées n'a souhaité s'exprimer sur le sujet."
 ARAB_LEAGUE_RESOLUTION.7.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour imposer des sanctions commerciales à [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.7.d:0 "\nÀ l'issue d'un débat houleux, la Ligue arabe a voté l'imposition de sanctions commerciales importantes à l'encontre de [arab_league_nation_global_target.GetName]. La résolution dénonçait les violations répétées des normes établies et les agissements répréhensibles du gouvernement de [arab_league_nation_global_target.GetName]. Plusieurs diplomates se sont empressés de déclarer aux médias que ces sanctions n'étaient pas destinées à nuire à la population, mais qu'elles étaient nécessaires pour encadrer les actions de [arab_league_nation_global_target.GetName]. Le gouvernement de [arab_league_nation_global_target.GetName] serait profondément indigné par cette résolution, dénonçant un complot international et affirmant à sa population être victime de harcèlement et d'intimidation de la part de la Ligue arabe."
 ARAB_LEAGUE_RESOLUTION.8.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour imposer un embargo sur le commerce des armes à [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.8.d:0 "\nLa Ligue arabe a adopté une nouvelle résolution interdisant l'achat d'armes par le gouvernement de [arab_league_nation_global_target.GetName]. De nombreux États membres ont partagé l'avis selon lequel l'arsenal acquis par [arab_league_nation_global_target.GetName] était largement supérieur à ses besoins. De plus, les États membres estimaient que [arab_league_nation_global_target.GetName] détournait des ressources nécessaires à l'aide à sa population au profit de son arsenal excessif et menaçant. La Ligue arabe a finalement conclu qu'elle devait agir afin d'empêcher [arab_league_nation_global_target.GetName] de déstabiliser davantage la communauté internationale. Les représentants de [arab_league_nation_global_target.GetName] ont publié une brève déclaration condamnant la résolution comme une violation de la souveraineté et une atteinte directe à la capacité du pays à se défendre."
 ARAB_LEAGUE_RESOLUTION.9.t:0 "[GetNewspaperHeader]L'ONU appelle à la fin du programme nucléaire de [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.9.d:0 "\nLa Ligue arabe a adopté une résolution appelant [arab_league_nation_global_target.GetName] à mettre fin à son programme nucléaire. Lors des débats, plusieurs pays ont souligné la menace existentielle que représentent ces armes nucléaires, non seulement pour la région, mais pour le monde entier. Les représentants de [arab_league_nation_global_target.GetName] ont insisté sur leur droit de poursuivre et de développer les technologies nécessaires au progrès et à la protection de leur population. Ils ont ajouté que la résolution de la Ligue arabe révélait les préjugés et l'hypocrisie de l'organisation, mais qu'ils prévoyaient de publier une réponse officielle après consultation de leur haute direction. D'autres diplomates ont rejeté ces affirmations, faisant remarquer que les risques étaient manifestes et que l'inaction aurait constitué une grave erreur."
 ARAB_LEAGUE_RESOLUTION.10.t:0 "[GetNewspaperHeader]L'ONU appelle au retrait des armes de destruction massive de [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.10.d:0 "\nUn débat houleux s'est conclu par l'adoption, par la Ligue arabe, d'une résolution exigeant que [arab_league_nation_global_target.GetName] retire toutes ses armes de destruction massive. Des diplomates de plusieurs États ont affirmé que [arab_league_nation_global_target.GetName] ne disposait pas des procédures de commandement et de contrôle adéquates, ni de la retenue et des justifications nécessaires pour produire, détenir ou utiliser de telles armes. La résolution de la Ligue arabe soulignait que le retrait de ces armes renforcerait les perspectives de paix dans la région et réduirait le risque de conflit armé. Le principal représentant de [arab_league_nation_global_target.GetName] a dénoncé le débat et le vote comme une simple manœuvre d'humiliation. Il a déclaré qu'une réponse officielle serait apportée dès son retour au pays, après consultation avec les plus hauts dirigeants."
 ARAB_LEAGUE_RESOLUTION.11.d:0 "La Ligue arabe a adopté une résolution exigeant la suspension de notre programme nucléaire et son placement sous sa supervision. Lors des débats, il est apparu clairement que la communauté internationale ne nous fait pas confiance pour gérer de telles armes. Nous pouvons accepter la résolution et entamer un processus de dénucléarisation. Cela désamorcerait les critiques de nos adversaires et démontrerait notre responsabilité au sein de la communauté internationale. Cela réduirait également le risque d'escalade. Cependant, de hauts responsables et officiers militaires soulignent que la nation a consenti d'immenses sacrifices financiers, humains et matériels pour établir une force de dissuasion nucléaire. Dénucléariser serait un affront pour la nation et la rendrait vulnérable. Ils craignent que la résolution de la Ligue arabe ne soit qu'une manœuvre pour neutraliser l'arsenal nucléaire en prévision d'une invasion ennemie."
 ARAB_LEAGUE_RESOLUTION.12.d:0 "Une résolution récemment adoptée par la Ligue arabe exige la suspension et l'arrêt de notre programme d'armes chimiques. Le vote montre clairement que la communauté internationale considère ce programme comme une grave menace et qu'un refus pourrait entraîner de nouvelles mesures de la part de la Ligue arabe. Accepter la résolution et entamer le processus permettrait sans aucun doute de mettre fin à toute escalade, et certains responsables estiment que, moralement, il serait de toute façon justifié de retirer ces armes. Cependant, d'autres responsables, notamment au sein des forces armées, insistent sur le fait que nous ne devons pas céder, car ces armes sont destinées à la protection nationale et relèvent de nos affaires intérieures. Pour eux, la Ligue arabe n'a pas le droit de dicter à un État souverain ce qu'il peut faire sur son territoire."
 ARAB_LEAGUE_RESOLUTION.13.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour le retour de [arab_league_state_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.13.d:0 "\nDans un revers majeur pour [arab_league_state_owner_global_target.GetName], la Ligue arabe a voté en faveur de la restitution de [arab_league_state_global_target.GetName]. Lors des débats de principe, de nombreux membres ont exprimé leur inquiétude face aux informations faisant état de troubles et de tensions dans le territoire. Ils ont convenu que la volonté du peuple est le retour de [arab_league_state_global_target.GetName]. Le Secrétaire général a fait écho à ce sentiment après l'adoption de la résolution, déclarant que la restitution de [arab_league_state_global_target.GetName] contribuerait grandement à apaiser les tensions et les violences dans la région. Il reste à voir si cette dernière action de la Ligue arabe permettra à [arab_league_state_owner_global_target.GetName] de réintégrer [arab_league_state_global_target.GetName] au sein de la communauté internationale."
 ARAB_LEAGUE_RESOLUTION.14.t:0 "[GetNewspaperHeader]La Ligue arabe nous demande de renoncer au contrôle de [arab_league_state_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.14.d:0 "\nLa Ligue arabe a récemment adopté une résolution exigeant que nous cédions notre contrôle sur [arab_league_state_global_target.GetName]. Cette condamnation cinglante de la part de cette organisation internationale représente un défi majeur pour notre gouvernement. Certains estiment que nous devrions obtempérer à la demande de la Ligue arabe, car cela nous vaudrait une bonne image internationale et modifierait le discours négatif qui pèse sur notre nation. Ils soulignent également qu'un refus pourrait menacer notre sécurité nationale. D'autres, en revanche, affirment qu'accepter cette résolution serait perçu comme une trahison par notre peuple et que le gouvernement pourrait ne pas y survivre. De plus, ils rejettent l'idée même que la Ligue arabe puisse imposer une telle exigence. Nous devons donc décider d'accepter ou de rejeter cette résolution."
 ARAB_LEAGUE_RESOLUTION.15.t:0 "[GetNewspaperHeader]La Ligue arabe déploie des Casques bleus dans la [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.15.d:0 "\nLa Ligue arabe a autorisé le déploiement de Casques bleus en [arab_league_nation_global_target.GetName]. Ces Casques bleus sont censés réduire les tensions et la violence dans la région et préserver la paix. Les membres ayant approuvé cette mesure ont déclaré que les Casques bleus agiraient en première ligne pour la paix et la stabilité. Plusieurs membres ont manifesté leur intérêt pour l'envoi de Casques bleus, mais le nombre exact de participants et les pays impliqués dans la mission n'ont pas encore été annoncés. Bien que de nombreux journaux en [arab_league_nation_global_target.GetName] aient salué ce déploiement, certains craignent que les forces de la Ligue arabe ne constituent une menace pour l'indépendance du pays et estiment que leur déploiement n'aurait pas dû être autorisé."
 ARAB_LEAGUE_RESOLUTION.16.t:0 "[GetNewspaperHeader]La Ligue arabe lance une initiative de médiation dans [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.16.d:0 "\nLa Ligue arabe a approuvé l'envoi d'une délégation de haut niveau pour tenter une médiation dans les troubles en [arab_league_nation_global_target.GetName]. Cette délégation sera dirigée par un diplomate chevronné possédant une connaissance approfondie de la situation. Son départ est prévu dès réception de l'autorisation officielle de voyage. Les diplomates au fait de la situation estiment que cette tentative de médiation, menée par un groupe neutre, représente le meilleur espoir de résolution. Cette initiative est globalement saluée, mais compte tenu des attentes élevées, de nombreux diplomates soulignent qu'un échec pourrait avoir des conséquences désastreuses."
 ARAB_LEAGUE_RESOLUTION.17.d:0 "La Ligue arabe nous a demandé de cesser les hostilités et d'accepter un cessez-le-feu. Elle s'est engagée à garantir l'entrée en vigueur d'un cessez-le-feu qui préserverait les lignes de front actuelles et empêcherait notre ennemi de manipuler la situation à son avantage avant les négociations de paix. Nous devons consulter les hauts responsables militaires et de la défense afin de connaître leur avis sur l'opportunité de poursuivre les combats."
 ARAB_LEAGUE_RESOLUTION.18.t:0 "[GetNewspaperHeader]Cessez-le-feu convenu par [FROM.GetName] et [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.18.d:0 "\n[FROM.GetName] et [arab_league_nation_global_target.GetName] ont convenu d'un cessez-le-feu sous l'égide de la Ligue arabe. Une force de surveillance de la Ligue arabe est attendue prochainement pour veiller au respect de la ligne de cessez-le-feu. Le secrétaire général de la Ligue arabe espère que les deux parties profiteront de ce cessez-le-feu pour relancer les négociations de paix et résoudre définitivement tous les problèmes en suspens. Les deux gouvernements concernés ont publié des déclarations saluant le rôle de la Ligue arabe dans la facilitation du cessez-le-feu. Bien que la Ligue arabe se félicite de son rôle dans ce cessez-le-feu, certains diplomates ont confié aux médias, en privé, qu'ils estimaient que le cessez-le-feu avait tardé à être instauré."
 ARAB_LEAGUE_RESOLUTION.19.t:0 "[GetNewspaperHeader][FROM.GetName] Rejette les négociations de paix"
 ARAB_LEAGUE_RESOLUTION.19.d:0 "\nLa Ligue arabe a annoncé que [FROM.GetName] a refusé toute offre de négociations de paix. De hauts diplomates de la Ligue arabe ont exprimé leur déception face à ce refus, soulignant que le statut de la Ligue arabe, en tant qu'organisation mondiale neutre, en aurait fait un partenaire idéal pour des négociations de paix. Le Conseil de sécurité devrait examiner cette nouvelle situation lors de sa prochaine session. Ce rejet fait craindre une escalade du conflit et une incapacité de la Ligue arabe à réaliser les aspirations de ses fondateurs."
 ARAB_LEAGUE_RESOLUTION.20.t:0 "[GetNewspaperHeader]La Ligue arabe lance une intervention dans [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.20.d:0 "\nÀ l'issue d'un vote serré, la Ligue arabe a autorisé une intervention militaire en [arab_league_nation_global_target.GetName]. Après le vote, le secrétaire général a souligné que la gravité de la situation sur le terrain rendait cette intervention inévitable et nécessaire. Plusieurs États ont déjà manifesté leur intérêt pour soutenir cette nouvelle mission, mais la Ligue arabe n'a pas encore précisé le nombre de forces qui seront déployées ni leur provenance. En [arab_league_nation_global_target.GetName], nombreux sont ceux qui saluent la décision de la Ligue arabe et espèrent qu'elle contribuera à instaurer la sécurité et la stabilité indispensables à une paix durable. Certains, en [arab_league_nation_global_target.GetName], s'opposent à ce déploiement, le considérant comme une ingérence étrangère. La Ligue arabe devra agir avec prudence, mais on fonde de grands espoirs sur son succès."
 ARAB_LEAGUE_RESOLUTION.21.t:0 "[GetNewspaperHeader]La Ligue arabe lance une intervention contre [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.21.d:0 "\nLors d'un vote solennel, la Ligue arabe a autorisé une intervention militaire en [arab_league_nation_global_target.GetName]. Après le vote, le secrétaire général a souligné que ce n'était ni l'objectif ni le souhait de l'organisation, mais que la situation s'était tellement dégradée qu'il n'y avait pas d'autre choix. D'autres diplomates de la Ligue arabe se sont montrés plus francs, déclarant que la situation en [arab_league_nation_global_target.GetName] avait atteint un point de non-retour et qu'une intervention était inévitable. On ignore pour l'instant quelles nations mèneront l'intervention et en quel nombre. Le gouvernement de [arab_league_nation_global_target.GetName] n'a pas publié de déclaration officielle, mais les analystes estiment qu'il adoptera probablement une attitude de défi et qu'il est peu probable qu'il cède ou qu'il recule sous la pression internationale."
 ARAB_LEAGUE_RESOLUTION.22.d:0 "Une récente résolution de la Ligue arabe appelle à la formation d'une coalition pour contribuer à instaurer la paix dans une région en proie à des troubles. Certains médias locaux nous exhortent à rejoindre cette coalition afin de manifester notre solidarité et notre soutien à la paix internationale. Au sein de l'armée, certains officiers y sont également favorables, y voyant un moyen de tester nos troupes et notre matériel sur le terrain. Cependant, une opposition se manifeste également, certains médias estimant que nous devrions nous abstenir de toute ingérence dans les affaires des autres nations. Par ailleurs, un autre groupe au sein de l'armée soutient que participer à une telle force mettrait des vies en danger et gaspillerait des ressources sans avantage concret. C'est un choix difficile à faire."
 ARAB_LEAGUE_RESOLUTION.23.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour assouplir les sanctions commerciales contre [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.23.d:0 "\nLa Ligue arabe a voté la levée des sanctions commerciales importantes imposées à [arab_league_nation_global_target.GetName]. Le Conseil de sécurité a noté que [arab_league_nation_global_target.GetName] avait accompli des progrès considérables pour mettre fin aux pratiques qui avaient contraint la Ligue arabe à imposer initialement ces sanctions. Le Secrétaire général, en réaction au vote, a souligné que l'organisation n'avait pas vocation à punir les États et a exprimé l'espoir que ce vote contribuerait au retour de [arab_league_nation_global_target.GetName] au sein de la communauté internationale. Le représentant de [arab_league_nation_global_target.GetName] s'est félicité de cette décision et a déclaré que ce vote jouerait un rôle majeur dans la normalisation des relations."
 ARAB_LEAGUE_RESOLUTION.24.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour assouplir l'embargo sur le commerce des armes [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.24.d:0 "\nLa Ligue arabe a adopté une résolution levant l'embargo sur les armes imposé à [arab_league_nation_global_target.GetName]. Le Conseil de sécurité a estimé que les raisons de cette interdiction n'étaient plus justifiées et que l'attitude du gouvernement de [arab_league_nation_global_target.GetName] s'était montrée récemment très réceptive. Le Secrétaire général a déclaré que l'organisation ne considérait plus la menace comme réelle. Il a ajouté espérer que le gouvernement de [arab_league_nation_global_target.GetName] poursuivrait les initiatives positives entreprises. Certains diplomates ont abondé dans ce sens, affirmant que les sanctions sont souvent un dernier recours et qu'une fois des changements positifs constatés, le maintien des sanctions est peu souhaitable. En privé, cependant, certains représentants ont exprimé leur crainte que la levée des sanctions n'entraîne une course aux armements dans la région."
 ARAB_LEAGUE_RESOLUTION.25.t:0 "[GetNewspaperHeader]La Ligue arabe vote pour la liberté de [arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.25.d:0 "\nLa Ligue arabe a voté en faveur de l'octroi de la liberté à la communauté [arab_league_nation_global_target.GetAdjective]. Le vote, intervenu après un débat animé sur la question, a suscité un sentiment d'importance historique parmi tous les délégués. Le Secrétaire général a félicité les États membres pour leur vote et leurs débats sur la résolution. Il a souligné que le droit à l'autodétermination est un principe fondamental non seulement de la Charte de la Ligue arabe, mais aussi de la quasi-totalité des nations. L'adoption de cette résolution témoigne de l'attachement de la communauté internationale aux idéaux et aux aspirations de tous les peuples du monde."
 ARAB_LEAGUE_RESOLUTION.26.t:0 "La Ligue arabe appelle à la liberté de [arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.26.d:0 "\nDans un développement significatif, la Ligue arabe a adopté une résolution appelant à la liberté du peuple [arab_league_nation_global_target.GetAdjective]. La Ligue arabe a souligné l'importance du droit à l'autodétermination et a demandé son application en l'espèce. Avant l'adoption de la résolution, de vifs débats ont eu lieu, de nombreux membres craignant qu'une telle résolution ne constitue une ingérence directe dans la souveraineté d'une nation. Ils estimaient qu'un tel précédent rendrait de nombreux États membres vulnérables à des résolutions similaires et, de ce fait, ne souhaitaient pas voter pour. Cependant, les votes nécessaires à l'adoption de la résolution ont finalement été obtenus. À l'extérieur de la Ligue arabe, des foules de partisans et de membres de la communauté [arab_league_nation_global_target.GetAdjective] auraient manifesté leur joie. L'avenir dira si cette résolution sera acceptée."
 ARAB_LEAGUE_RESOLUTION.27.t:0 "[GetNewspaperHeader][FROM.GetName] Rejette les appels à la liberté de [arab_league_nation_global_target.GetAdjective]"
 ARAB_LEAGUE_RESOLUTION.27.d:0 "\nLe gouvernement de [FROM.GetName] a fermement rejeté la résolution de la Ligue arabe appelant à l'indépendance de la communauté [arab_league_nation_global_target.GetAdjective]. Dans une déclaration, il a affirmé que la Ligue arabe n'avait aucune juridiction ni aucun droit de dicter ses affaires intérieures. Accepter cette résolution aurait non seulement sacrifié sa souveraineté, mais aurait également créé un dangereux précédent. La déclaration a également souligné que la résolution et la campagne internationale qui l'accompagne s'inscrivent vraisemblablement dans un complot international visant à détruire l'unité et la force de [FROM.GetName]. Cette déclaration de défi a été froidement accueillie par la Ligue arabe, dont le secrétaire général a exprimé sa profonde déception. Le Conseil de sécurité devrait examiner la question lors de sa prochaine session."
 ARAB_LEAGUE_RESOLUTION.28.t:0 "[GetNewspaperHeader]La libération de [FROM.GetAdjective] [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.28.d:0 "\nLa communauté [FROM.GetAdjective] a obtenu officiellement son indépendance de la part de [arab_league_nation_global_target.GetName]. Cette décision fait suite à une récente résolution de la Ligue arabe appelant à la libération du peuple [FROM.GetAdjective]. Le gouvernement de [arab_league_nation_global_target.GetName] a publié une brève déclaration indiquant qu'il avait choisi de se conformer à la résolution de la Ligue arabe non par crainte ou sous la pression, mais parce qu'il avait lui aussi conclu que cette voie était la meilleure pour garantir la paix. Au sein de la Ligue arabe, les principaux diplomates se sont félicités de cette évolution, la qualifiant d'une des plus grandes expressions d'autodétermination de ces dernières années. La presse internationale semble largement soutenir ce résultat, le considérant comme le plus favorable à l'instauration d'une paix durable."
 ARAB_LEAGUE_RESOLUTION.29.t:0 "[GetNewspaperHeader]Résolution rejetée par la Ligue arabe"
 ARAB_LEAGUE_RESOLUTION.29.d:0 "\nLa résolution [ARAB_LEAGUE_SELECTION_BUTTON_3] a été largement rejetée par la Ligue arabe après des débats houleux. Les analystes estiment qu'elle n'a pas bénéficié du soutien des principaux États arabes et que ses opposants ont démontré avec succès que les inconvénients potentiels d'une telle résolution l'emportaient sur tout avantage. Malgré une certaine déception suite à ce rejet, de nombreux diplomates se sont félicités que la Ligue arabe ait pu permettre à la communauté arabe de discuter, de débattre et de voter. Un tel scénario aurait semblé presque impossible il y a encore peu de temps."
 ARAB_LEAGUE_RESOLUTION.30.d:0 "\nUne résolution récente, [ARAB_LEAGUE_SELECTION_BUTTON_3], a été rejetée par un membre permanent du Conseil de sécurité de la Ligue arabe. Ce veto est critiqué par certains représentants qui estiment qu'il a anéanti tout espoir de mener à bien un débat sur la résolution et de parvenir à un consensus. D'autres dénoncent un veto comme une manœuvre politique visant à protéger un État ami. Cependant, certains pays ont apporté leur soutien au veto, accusant la résolution initiale d'être politiquement motivée dès le départ. De ce fait, le veto était non seulement inévitable, mais aussi la bonne décision. Quoi qu'il en soit, la résolution est de facto caduque."
 ARAB_LEAGUE_RESOLUTION.90.t:0 "[GetNewspaperHeader][arab_league_nation_global_target.GetName] Rejette l'appel de la Ligue arabe à la dénucléarisation"
 ARAB_LEAGUE_RESOLUTION.91.t:0 "[GetNewspaperHeader]Dénucléarisation en [arab_league_nation_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.100.t:0 "[GetNewspaperHeader][arab_league_nation_global_target.GetName] Rejette l'appel de la Ligue arabe au retrait des armes de destruction massive"
 ARAB_LEAGUE_RESOLUTION.101.t:0 "[GetNewspaperHeader][arab_league_nation_global_target.GetName] Démantèle ses armes de destruction massive"
 ARAB_LEAGUE_RESOLUTION.131.t:0 "[GetNewspaperHeader][arab_league_state_owner_global_target.GetName] refuse de renvoyer [arab_league_state_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.132.t:0 "[GetNewspaperHeader][arab_league_state_owner_global_target.GetName] Accepte de retourner [arab_league_state_global_target.GetName]"
 ARAB_LEAGUE_RESOLUTION.30.t:0 "[GetNewspaperHeader][ARAB_LEAGUE_SELECTION_BUTTON_3] Veto"
 ARAB_LEAGUE_RESOLUTION.90.d:0 "\nLe gouvernement de [arab_league_nation_global_target.GetName] a rejeté avec véhémence la résolution récemment adoptée par la Ligue arabe l'appelant à la dénucléarisation. Dans sa réponse officielle, le gouvernement a insisté sur le fait que la résolution viole sa souveraineté et que la Ligue arabe n'a aucun droit de dicter les technologies qui peuvent ou non être développées pour le bien de la nation. Il a conclu en affirmant qu'aucune organisation ni puissance étrangère ne peut imposer ses exigences à un peuple. Le secrétaire général de la Ligue arabe n'a pas réagi immédiatement, mais les puissances mondiales s'efforcent de trouver une réponse appropriée à cette nouvelle provocation."
 ARAB_LEAGUE_RESOLUTION.91.d:0 "\nL'enthousiasme était palpable aujourd'hui parmi les diplomates et les dirigeants de la Ligue arabe. Cette joie fait suite à l'annonce de l'engagement de la [arab_league_nation_global_target.GetName] à mettre fin à son programme nucléaire et à démanteler l'ensemble de ses armes nucléaires. Une équipe de spécialistes de [arab_league_nation_global_target.GetName] devrait être dépêchée sur place pour superviser le processus. De nombreux dirigeants mondiaux ont salué la décision de [arab_league_nation_global_target.GetName] de placer la paix et la stabilité mondiales au premier plan. Des représentants de la Ligue arabe ont d'ailleurs déjà indiqué espérer de meilleures relations et des avantages accrus de la part de la communauté internationale après son adhésion à la résolution de la Ligue arabe."
 ARAB_LEAGUE_RESOLUTION.100.d:0 "\nDans une réponse laconique, le gouvernement de [arab_league_nation_global_target.GetName] a rejeté catégoriquement la résolution de la Ligue arabe exigeant le démantèlement de toutes ses armes de destruction massive. [arab_league_nation_global_target.GetName] affirme qu'accepter une telle demande compromettrait sa sécurité et sa souveraineté. Le pays a condamné la Ligue arabe, la jugeant moralement indigne et instrumentalisée par des intérêts étrangers. Le secrétaire général de la Ligue arabe a exprimé sa frustration face à cette déclaration. Un diplomate de haut rang n'a pas été surpris par cette réaction, déclarant qu'elle illustrait parfaitement la nécessité pour la communauté internationale d'agir avec fermeté. Le Conseil de sécurité devrait se saisir de la question lors de sa prochaine session."
 ARAB_LEAGUE_RESOLUTION.101.d:0 "\nLa Ligue arabe a annoncé avec satisfaction que le gouvernement de [GetNewspaperHeader][arab_league_nation_global_target.GetName] a récemment informé le Conseil de sécurité de son intention de mettre fin à son programme d'armes de destruction massive et de le détruire. Cette décision fait suite à un vote récent de la Ligue arabe exigeant l'arrêt de ce programme. Le secrétaire général de la Ligue arabe a salué la décision prise par les dirigeants de [GetNewspaperHeader][arab_league_nation_global_target.GetName], une décision judicieuse en faveur de la paix mondiale. Dans une déclaration distincte, un porte-parole de [GetNewspaperHeader][arab_league_nation_global_target.GetName] a confirmé l'arrêt du programme, tout en insistant sur le fait que cette action n'était pas motivée par la peur ou l'intimidation, mais bien par la volonté de son peuple. La presse internationale a largement salué ces événements et la crédibilité qu'ils confèrent à la Ligue arabe en tant qu'organisation proactive œuvrant pour la paix mondiale."
 ARAB_LEAGUE_RESOLUTION.131.d:0 "\nL'État [arab_league_state_owner_global_target.GetName] a défié la Ligue arabe et la communauté internationale en refusant de restituer [arab_league_state_global_target.GetName]. Cette décision a déclenché de vives manifestations dans la zone contestée et au-delà des frontières de la Ligue arabe, les partisans de la résolution exigeant des mesures concrètes. Dans un communiqué, le gouvernement de [arab_league_state_owner_global_target.GetName] a déclaré que la résolution de la Ligue arabe constituait une ingérence directe dans ses affaires intérieures et était illégale. Il a ajouté que toute décision concernant son territoire et son peuple sacrés serait prise par la nation et non par des puissances étrangères s'immisçant dans les affaires d'autrui. Le Conseil de sécurité de la Ligue arabe devrait se prononcer sur ces derniers développements lors de sa prochaine session."
 ARAB_LEAGUE_RESOLUTION.132.d:0 "\nDans ce qui est salué comme une victoire majeure pour la paix mondiale, [arab_league_state_global_target.GetName] a accepté de restituer [arab_league_state_global_target.GetName]. Le gouvernement de [arab_league_state_global_target.GetName] a déclaré être une nation responsable et accepter la volonté de la communauté internationale. Il a insisté sur le fait que cette décision n'avait pas été prise sous la pression ou par crainte, mais par respect. Le secrétaire général de la Ligue arabe a salué cette décision et a exhorté toutes les nations à s'en inspirer. De nombreux journaux à travers le monde ont publié des articles élogieux louant la Ligue arabe et sa capacité à œuvrer pour la paix et la stabilité mondiales. Cependant, certains diplomates ont exprimé en privé leurs inquiétudes quant à la possibilité que certaines nations tentent désormais de manipuler la Ligue arabe pour atteindre leurs objectifs territoriaux."
 ARAB_LEAGUE_RESOLUTION.506.t:0 "\nUne menace de sanction"
 ARAB_LEAGUE_RESOLUTION.506.d:0 "\nUn événement inquiétant s'est produit : [from.GetName] nous a menacés de sanctions si nous n'acceptons pas ses propositions. Pouvons-nous nous permettre d'ignorer ses menaces, ou allons-nous céder à ses exigences et le laisser dicter sa loi à tout le monde ?"
 ARAB_LEAGUE_RESOLUTION.507.t:0 "\nUne sanction de menace"
 ARAB_LEAGUE_RESOLUTION.507.d:0 "\nNotre manœuvre a été rejetée et [from.GetName] a refusé de se soumettre à nos demandes. Que devons-nous faire ?"
 ARAB_LEAGUE_RESOLUTION.508.t:0 "\nProposition d'accord de défense mutuelle"
 ARAB_LEAGUE_RESOLUTION.508.d:0 "\nQue cela nous plaise ou non, il est réjouissant que [from.GetName] cherche à signer un traité de défense avec nous, dans une garantie mutuelle d'aide militaire."
 ARAB_LEAGUE_RESOLUTION.509.t:0 "\nCorruption découverte !"
 ARAB_LEAGUE_RESOLUTION.509.d:0 "\nIl semblerait que [from.GetName] ait peu d'estime pour nos fonctionnaires, puisqu'ils ont tenté de les corrompre. Nous ne pouvons laisser cela impuni."