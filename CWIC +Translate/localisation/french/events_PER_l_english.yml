l_english:
 iran_political.100.d:0 "Partisan de longue date d'un régime islamique en Iran, Navvab Safavi a fondé le mouvement Fedayin de l'Islam afin de promouvoir des réformes fondamentalistes plus poussées dans le pays. Le gouvernement au pouvoir finit par en avoir assez de ses agissements après une tentative d'assassinat contre le Premier ministre, le général Fazlollah Zahedi. Safavi fut exécuté par les autorités de l'État en même temps que trois autres de ses alliés.\nCette exécution marque un jour sombre pour les fondamentalistes islamiques en Iran, car il devient clair que les politiques laïques sont appelées à perdurer dans le pays."
 iran_political.500.d:0 "Un tribunal militaire a condamné à mort l'ancien Premier ministre iranien Mohammad Mossadegh pour ses actes de trahison envers le gouvernement et le peuple iraniens. Peu après le prononcé de la sentence, un peloton d'exécution a procédé à l'exécution. Avant d'être exécuté, Mossadegh aurait déclaré que ses actions avaient été menées pour la liberté et l'honneur du peuple iranien. Les opposants à l'ancien Premier ministre se réjouiront sans aucun doute de sa mort. Sa capacité à rallier le soutien populaire et son influence politique faisaient de lui une menace redoutable pour ses adversaires. Pour ses partisans et ses alliés, son décès sera source d'un grand désespoir. Cependant, des rumeurs parviennent déjà à Téhéran selon lesquelles son réseau d'alliés politiques tentera probablement de poursuivre ses efforts pour démocratiser l'Iran et restaurer son honneur national."
 iran_political.1301.d:0 "À la suite de l'échec de l'opération Ajax, les tensions entre le régime de Mossadegh et le Tudeh s'intensifièrent. La farouche résistance opposée par le Tudeh pendant l'opération Ajax attira de nombreux adhérents au sein du parti, dont les rangs grossirent jusqu'à devenir majoritaires dans le pays. Craignant un nouveau coup d'État, Mossadegh tenta de réprimer le parti. La police armée tenta d'arrêter des figures de proue du Tudeh, notamment des membres du « Groupe des Cinquante-Trois ». Cela ne fit que rallier davantage le parti, et Téhéran fut envahi par des civils armés et des forces paramilitaires. En l'espace de deux jours, Mosaddegh démissionna de ses fonctions et s'enfuit en Turquie. L'ancienne direction ayant disparu et Téhéran étant tombé, la République socialiste d'Iran fut proclamée. En l'absence d'opposition interne, cette décision a consolidé le pouvoir du parti Tudeh.\nLes Iraniens de tout le pays célèbrent cette victoire, et des festivités sont organisées partout pour soutenir ce changement. Les fondamentalistes islamiques continuent de s’opposer au Tudeh, mais manquent de cohésion et de soutien populaire pour véritablement défier le nouveau régime. Pour l’Occident, ce qui avait commencé comme un plan visant à préserver les profits pétroliers a abouti à la création d’un Iran communiste."
 iran_political.1298.d:0 "L'ancien monarque emblématique de l'Iran, autrefois acclamé lorsqu'il traversait les rues de Téhéran, était désormais la cible des railleries de la foule, qui lançait des fruits pourris sur le convoi blindé dans lequel il se trouvait. Le convoi s'est rapidement mis en route, en direction de la Cour suprême de Téhéran. Mohammad Reza Pahlavi est accompagné de sa famille, ainsi que de Shaban Jafari, Fazlollah Zahedi et Nematollah Nassiri, tous jugés pour haute trahison. Devant la Cour suprême, des centaines de manifestants du Tudeh réclament la peine de mort pour toutes les personnes impliquées. Comment la cour décidera-t-elle du sort de ces traîtres ?"
 iran_political.1299.d:0 "Le démantèlement de l'ancienne monarchie se poursuit aujourd'hui à Téhéran. Les anciens généraux et principaux conseillers du Shah ont récemment été jugés et condamnés pour des chefs d'accusation allant de la corruption à la trahison. Ces procès sont connus sous le nom de « procès de Téhéran ». Les accusations de trahison découlent du contre-coup d'État manqué lancé pour rétablir le pouvoir du Shah. Bon nombre des personnes reconnues coupables sont condamnées à mort ou à de longues peines de prison. Le Shah reste en exil à l'étranger et a peu de chances de revenir, d'autant plus que bon nombre de ses partisans ont désormais été écartés. Les États-Unis et leurs alliés, accusés d'avoir soutenu le contre-coup d'État, suivent de près ces procès, car la crainte que le nouveau régime ne se tourne vers le communisme ne cesse de croître."
 iran_political.1300.d:0 "Le verdict de l'audience tendue devant la Cour suprême de Téhéran a enfin été rendu. Les personnes impliquées dans le coup d'État ont été condamnées à mort. À l'extérieur du palais de justice, les partisans du Tudeh célèbrent cette annonce, qu'ils qualifient d'étape majeure vers la fin du régime bourgeois en Iran. Peu après l'annonce, les conspirateurs ont été conduits à 25 kilomètres de Téhéran et exécutés par un peloton d'exécution. Plus de 280 conspirateurs ont été exécutés, y compris l'ensemble de la dynastie Pahlavi.\nLa fin d'une époque s'est abattue sur l'Iran, mettant un terme à des milliers d'années d'influence monarchiste. Cet événement aura des répercussions sur l'avenir de l'Iran pour des générations."
 tudeh.1.d:0 "La Cour suprême de Téhéran allait rendre son verdict. Dans les 48 heures, les Pahlavi et nombre de leurs complices devaient être exilés du pays pour ne plus jamais y revenir. Alors que Mohammad Reza quittait la salle d'audience, des manifestants agressifs lancèrent des pierres sur lui et sa famille. Ce fut son dernier souvenir de l'Iran, car il fut rapidement déchu de sa nationalité et expulsé vers l'Arabie saoudite, d'où il s'installa ensuite aux États-Unis. L'ancien monarque a refusé toute interview avec les médias et a demandé que l'on respecte sa vie privée et celle de sa famille. \nLa fin d'une époque a frappé l'Iran, alors que des milliers d'années d'influence monarchique touchent à leur fin. Cet événement aura des répercussions sur l'avenir de l'Iran pour des générations."
 iran_political.1100.d:0 "Après des mois de réflexion, Mohammad Reza Shah annonça son divorce avec la reine Soraya, invoquant son incapacité à lui donner un héritier. Sa fille unique épousa Ardeshir Zahedi, un ennemi de la famille royale. Ce faisant, il reniait à la fois sa femme et sa fille et se remariait avec Farah Pahlavi. Beaucoup ont considéré toute cette épreuve comme corrompue et moralement répréhensible, d'autres la jugeant excusable en raison de la nécessité d'avoir un héritier. Quoi qu'il en soit, ce divorce royal a suscité une nouvelle controverse en Iran."
 phi_events.1.d:0 "Une terrible nouvelle a frappé Manille aujourd’hui : l’ancien sénateur philippin Benigno « Ninoy » Aquino Jr. a été assassiné sur le tarmac de l’aéroport international de Manille. Fervent détracteur du président Ferdinand Marcos, le sénateur Aquino venait tout juste d’arriver à Manille après un exil volontaire aux États-Unis, où il avait cherché à échapper aux dangers, à des tortures extrêmes et à une mort certaine. À son arrivée à Manille, des soldats du gouvernement l'attendaient et l'ont arrêté. Cependant, alors qu'il descendait de l'avion, des coups de feu ont été signalés et Ninoy Aquino a été retrouvé mort, gisant sur le tarmac. L'enquête a conclu qu'un tueur à gages communiste nommé Rolando Galman avait assassiné Aquino, mais des rumeurs circulent selon lesquelles Galman n'était qu'un bouc émissaire et que l'assassinat avait été ordonné par l'administration Marcos. Néanmoins, des milliers de Philippins ont pleuré la mort de Ninoy Aquino, et les appels à la démission du régime de Marcos se font de plus en plus pressants. Les observateurs soulignent que cet événement pourrait être le catalyseur d’une révolution et du renversement du régime de Marcos, mais il est trop tôt pour se prononcer."
 AJAX.101.d:0 "La nationalisation du pétrole en Iran par le régime de Mossadegh a laissé un goût amer au Royaume-Uni et aux États-Unis. Déterminée à rétablir son influence sur l'Iran, la CIA a pris contact avec le Shah, des chefs de gangs et des hauts responsables militaires afin d'orchestrer un coup d'État. Le plan a échoué lorsque Mossadegh a eu vent du coup d'État en cours et a arrêté le meneur Shaban Jafari avant que celui-ci ne puisse être mis à exécution. Grâce à des informations divulguées par les Tudehs et Jafari, la police iranienne a arrêté la famille royale Pahlavi juste avant qu'elle ne parte en « vacances » dans les montagnes du nord de l'Iran. Sans le leadership fort de Pahlavi et Jafari, les forces du Tudeh et du gouvernement ont facilement mis fin à toute tentative de coup d'État. Des centaines de personnes soupçonnées d'être les instigateurs du coup d'État et d'agents étrangers ont été arrêtées.\nCe qui va maintenant arriver à l'Iran reste un mystère. L'influence monarchiste et occidentale a été éliminée, mais la manière dont le régime de Mossadegh et le Parti Tudeh réagiront au coup d'État pourrait bien déterminer le sort de la nation. Une nouvelle lutte pour le pouvoir est-elle déjà en train de se préparer ?"
 AJAX.105.d:0 "Peu après l'échec de l'opération Ajax, il fallut s'attaquer au chaos qui régnait. Le Parti Tudeh gagna en puissance grâce à ses efforts remarquables pour réprimer le coup d'État, ce qui provoqua des tensions entre le régime de Mossadegh et les communistes presque immédiatement après cette épreuve. Plutôt que d'aggraver le conflit, les deux camps comprirent rapidement l'importance du dialogue, et une réunion officielle entre les dirigeants des deux factions fut rapidement organisée. Bien qu'ils aient des divergences d'opinion sur de nombreux sujets, les deux camps ont démontré la puissance de leur collaboration. Grâce à cela, des accords ont été conclus pour maintenir la paix.\nLa République d'Iran sous Mosaddegh reste au pouvoir, malgré la pression des forces internes qui l'entourent. La démocratie naissante a affronté sa plus grande menace à ce jour, résistant à l'Occident et l'emportant."