 INO_train_equipment_1: "Indonesian Railways E10 Class"
 INO_train_equipment_1_short: "E10 Class"
 INO_train_equipment_1_desc: "The E10 class steam locomotives were compact but powerful engines used by the Indonesian State Railways during the early post-independence period. Originally built by Nippon Sharyo in Japan, these 0-10-0T tank locomotives were designed for steep gradients and tight curves, making them ideal for use on mountainous or industrial branch lines, particularly in Java and Sumatra.\n\nWith their short wheelbase and strong traction, the E10s were often employed for hauling freight in difficult terrain where larger locomotives struggled. Despite their modest appearance, they earned a reputation for reliability and endurance during a time when Indonesia’s rail system was still recovering from wartime damage and limited resources."
 INO_train_equipment_2: "Indonesian Railways BB 204 12 SLM Locomotive"
 INO_train_equipment_2_short: "BB 204 12 SLM Locomotive"
 INO_train_equipment_3: "Indonesian Railways GE Universal Series U18C"
 INO_train_equipment_3_short: "GE Universal Series U18C"
 INO_jet_multirole_equipment_6: "T-33A Puslitbang"
 INO_jet_multirole_equipment_6_desc: "Originally designed in the United States as a derivative of the P-80/F-80 jet fighter, the T-33 featured a tandem two-seat cockpit, a single Allison J33 turbojet, and straightforward handling characteristics that made it one of the most successful jet trainers in aviation history. In Indonesia, the \"Puslitbang\" designation marked aircraft repurposed for aeronautical research, weapons integration trials, and flight systems testing, particularly during the 1960s–70s as the nation sought to deepen its self-reliance in aerospace capabilities."
