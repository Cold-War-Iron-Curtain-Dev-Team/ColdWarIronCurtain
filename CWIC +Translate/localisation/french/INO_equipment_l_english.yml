 INO_jet_multirole_equipment_2: "CS-102"
 INO_jet_multirole_equipment_2_desc: "Externally similar to the standard MiG-15UTI, the CS-102 retained the same tandem-seat configuration, swept wings, and the reliable RD-45F engine. Though unarmed or lightly armed compared to its single-seat counterparts, the CS-102's value lay in its ability to prepare generations of jet pilots for high-speed combat flight. Its forgiving handling and robust construction made it ideal for novice pilots entering the jet age.\n\nThe CS-102 was widely exported, with air forces in Africa, Asia, and Latin America acquiring the type as part of military cooperation agreements with Czechoslovakia and the Soviet Union."
 INO_jet_multirole_equipment_2_short: "CS-102"
 INO_jet_multirole_equipment_3: "Lim-5/Type 56"
 INO_jet_multirole_equipment_3_desc: "The Lim-5 featured improved avionics and a more powerful VK-1A engine compared to earlier models, enabling higher performance and better reliability. Though largely similar in appearance to the MiG-17F, the Lim-5 was uniquely adapted for use within Warsaw Pact nations and exported to allies in the Middle East and Africa.\n\nLike its MiG-17 predecessor, the Lim-5 continued flying in various secondary roles such as training, ground attack, and reserve air defense well into the 1980s in some countries. A few examples still survive in museums or ceremonial squadrons today, marking a long legacy of postwar Eastern Bloc air power."
 INO_jet_multirole_equipment_3_short: "Lim-5/Type 56"
 INO_jet_multirole_equipment_4: "Mikoyan-Gurevich MiG-19S"
 INO_jet_multirole_equipment_4_desc: "The MiG-19 was the first Soviet production aircraft capable of supersonic speeds in level flight. A comparable U.S. \"Century Series\" fighter was the North American F-100 Super Sabre, although the MiG-19 primarily fought against the more modern McDonnell Douglas F-4 Phantom II and Republic F-105 Thunderchief over North Vietnam."
 INO_jet_multirole_equipment_4_short: "MiG-19S"
 INO_jet_multirole_equipment_5: "Mikoyan-Gurevich MiG-21F-13"
 INO_jet_multirole_equipment_5_desc: "The MiG-21 Fishbed is considered one of the earliest Soviet third generation fighters, incorporating beyond-visual-range missiles and pulse radar. The MiG-21 is the most produced supersonic jet in history, particularly large numbers were built in China and India under license. Over 11 000 have been built, serving in more than 60 countries spanning 5 continents. Over its lifetime MiG-21s scored 240 aerial kills. The MiG-21 served in many conflicts, including Vietnam (where it saw huge success), the 1971 India-Pakistan War, the Iran-Iraq War and many smaller conflicts. It remains in service after more than 6 decades."
 INO_jet_multirole_equipment_5_short: "MiG-21F-13"
 INO_jet_multirole_equipment_8: "Northrop F-5E Tiger II"
 INO_jet_multirole_equipment_8_short: "In 1970, Northrop won the International Fighter Aircraft (IFA) competition to replace the F-5A, with better air-to-air performance against aircraft like the Soviet MiG-21. The resultant aircraft, initially known as F-5A-21, subsequently became the F-5E. It had more powerful (5,000 lbf) General Electric J85-21 engines, and had a lengthened and enlarged fuselage, accommodating more fuel. Its wings were fitted with enlarged leading edge extensions, giving an increased wing area and improved maneuverability."
 INO_jet_multirole_equipment_9: "General Dynamics F-16A Block 15 OCU (Operating Capability Upgrades) Fighting Falcon"
 INO_jet_multirole_equipment_9_short: "F-16A Block 15 OCU"
 INO_jet_multirole_equipment_9_desc: "The first major change in the F-16, the Block 15 aircraft featured larger horizontal stabilizers, the addition of two hardpoints to the chin inlet, a new radar, and increased capacity for underwing pylons. This variant also acquired an up-to-date Ultra High Frequency (UHF) radio. This variant is the most numerous among the F-16 variants."
 INO_jet_multirole_equipment_10: "General Dynamics F-16C Block 50"
 INO_jet_multirole_equipment_10_short: "F-16C Block 50"
 INO_mr_stealth_fighter_equipment_1: "Sukhoi Su-30MK2"
 INO_mr_stealth_fighter_equipment_1_short: "Su-30MK2"
 INO_mr_stealth_fighter_equipment_1_desc: "The Sukhoi Su-30MKM (NATO reporting name; Flanker-H) is a supermaneuverable fighter of the Royal Malaysian Air Force. It is a variant of the Su-30 series fighters, with many significant improvements over the original Su-30MK export version."
 INO_jet_interceptor_equipment_9: "Sukhoi Su-27SK"
 INO_jet_interceptor_equipment_9_desc: "The Su-27S Flanker B is the initial production variant of the Soviet designed Sukhoi Su-27 fighter. The aircraft was intended as the direct competitor to the F-14 Tomcat and F-15 Eagle. After making its maiden flight in 1977 it entered service later in 1985. It's primary role was long range air defense against American B-1 and B-52 bombers, also to provide long-range escort for Soviet intercontinental strategic bombers. So far 809 aircraft have been produced, which still see service in the Russian Air Force. Other operators include: Indonesia, Ukraine, Vietnam and China (Designated J-11), among others. The aircraft will remain in service for the foreseeable future."
 INO_jet_interceptor_equipment_9_short: "Su-27SK"
 INO_CAS_equipment_1: "Type 99 Carrier Bomber"
 INO_CAS_equipment_1_short: "Aichi D3A"
 INO_CAS_equipment_1_desc: "Among the scattered remnants of war and empire, one aircraft came to bear the red-and-white insignia of a newly-born nation: the Aichi D3A, a Japanese dive bomber once feared across the Pacific, now flown under the banner of the Indonesian Air Force (AURI) during the early days of the revolution.\n\nKnown during the war as the “Val”, the Aichi D3A had served the Imperial Japanese Navy with distinction as a carrier-based dive bomber. But with Japan’s surrender in 1945, these aircraft—left behind in airfields across the archipelago—became valuable spoils for a people fighting to assert their independence."
 INO_CAS_equipment_2: "Curtiss P-40K Warhawks"
 INO_CAS_equipment_2_short: "P-40K Warhawk"
 INO_CAS_equipment_3: "Curtiss P-40E Warhawks"
 INO_CAS_equipment_3_short: "P-40E Warhawks"
 INO_CAS_equipment_4: "Douglas A-26C Invader"
 INO_CAS_equipment_4_short: "A-26C Invader"
 INO_CAS_equipment_4_desc: "The Douglas A-26 Invader is an American twin-engined light bomber and ground attack aircraft. Built by Douglas Aircraft Company during World War II, the Invader also saw service during several major Cold War conflicts."
 INO_jet_CAS_equipment_1: "North American AT-16 Harvard"
 INO_jet_CAS_equipment_1_short: "AT-16 Harvard"
 INO_jet_CAS_equipment_1_desc: "Armed variant of the North American T-6 Harvard. The AT-16 could be armed with rocketpods, bombs and gunpods for close air support missions."
 INO_jet_light_equipment_1: "North American T-6G Texan"
 INO_jet_light_equipment_1_short: "T-6G Texan"
 INO_jet_light_equipment_1_desc: "Earlier model AT-6/T-6s re-built between 1949-1953 with improved cockpit layout, increased fuel capacity, steerable tailwheel, updated radios and a 600hp R-1340-AN-1 engine. Identifiable by simplified canopy framing. 2068 modified."
 INO_jet_light_equipment_2: "Mikoyan-Gurevich MiG-15UTI"
 INO_jet_light_equipment_2_short: "MiG-15UTI"
 INO_jet_light_equipment_2_desc: "In April 6, 1949, the OKB-155 team was officially entrusted with the development of a training version of the MiG-15 fighter. The prototype of the MiG-15UTI aircraft was manufactured by Plant No.1 during March-May 1949. The instructor's cabin on the UTI MiG-15 was placed by reducing the first fuselage fuel tank. Both pressurized cabins were equipped with ejection seats and pyromechanically-dropped lanterns.  The special equipment of the vehicle consisted of an ASP-1N automatic gun sight, an RSI-6K transceiver radio station, an RPKO-10M radio compass with an RPKO-10M marker, an SPU-2M intercom, a KP-14 oxygen device, and an AFA-IM camera. The armament consisted of one 23-mm cannon NR-23 with 80 rounds of ammunition and one UBK-E machine gun with 150 rounds of ammunition."
 INO_jet_light_equipment_3: "L-29 Delfin"
 INO_jet_light_equipment_3_short: "L-29 Delfin"
 INO_jet_light_equipment_3_desc: "The Aero L-29 Delfín (English; Dolphin, NATO reporting name; Maya) is a military jet trainer developed and manufactured by Czechoslovakian aviation manufacturer Aero Vodochody. During the course of the programme, in excess of 3,000 L-29 Delfin trainers were produced. Of these, around 2,000 were reported to have been delivered to the Soviet Union, where it was used as the standard trainer for the Soviet Air Force."
 INO_jet_light_equipment_4: "North American Rockwell OV-10A Bronco"
 INO_jet_light_equipment_4_short: "OV-10A Bronco"
 INO_jet_light_equipment_4_desc: "The North American Rockwell OV-10 Bronco is an American twin-turboprop light attack and observation aircraft. It was developed in the 1960s as a special aircraft for counter-insurgency (COIN) combat, and one of its primary missions was as a forward air control (FAC) aircraft. It can carry up to 3,200 lb of external munitions, internal loads such as paratroopers or stretchers, and loiter for three or more hours."
 INO_jet_light_equipment_5: "British Aerospace Hawk 209"
 INO_jet_light_equipment_5_short: "Hawk 209"
 INO_jet_light_equipment_5_desc: "The British Aerospace Hawk 200 is a single-seat, single engine light multirole fighter designed for air defence, air denial, anti-shipping, interdiction, close air support, and ground attack."
 INO_recon_equipment_0: "North American F-6D Mustang"
 INO_recon_equipment_0_short: "F-6D Mustang"
 INO_recon_equipment_0_desc: "Reconnaissance version of P-51D Mustang."
