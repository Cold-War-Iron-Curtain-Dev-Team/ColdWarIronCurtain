l_english:
 INO_infantry_equipment_0: "M95/51 Mannlicher Carbine"
 INO_infantry_equipment_0_short: "Geweer M. 95"
 INO_infantry_equipment_0_desc: "The M95/51 Mannlicher Carbine is a bolt-action firearm that is based on the earlier Mannlicher M1895 rifle, originally designed for military use during the late Austro-Hungarian period. It features a distinctive straight-pull bolt system, which allows for faster cycling compared to conventional turn-bolt rifles. The designation “/51” refers to the post-World War II refurbishment and conversion program, during which many surviving M1895 carbines were updated to fire the more modern 8×56mmR cartridge."
 INO_infantry_equipment_1: "U.S. Rifle, Caliber .30, M1"
 INO_infantry_equipment_1_short: "M1 Garand"
 INO_infantry_equipment_1_desc: "The M1 Garand is a grand weapon designed by John C. Garand in 1928 for the United States. The M1 Garand is a .30 caliber semi-automatic rifle that saw extensive use during WWII. It is amongst the first weapons to use a gas reloading system to rechamber a new round after firing. It uses clips loaded from the top of the rifle and can be fitted with accessories including the M31 HEAT anti-tank rifle grenade. It functions as an all purpose weapon with an exceptional range and accuracy. It became symbolic and is still used by modern drill teams in the US.."
 INO_infantry_equipment_2: "Bandung Weapons Factory SP-1"
 INO_infantry_equipment_2_short: "Bandung SP-1"
 INO_infantry_equipment_2_desc: "License built version of the Beretta BM-59 produced by the Bandung Weapons Factory as the SP-1"
 INO_infantry_equipment_3: "Rifle, Caliber 5.56 mm, M16A1"
 INO_infantry_equipment_3_short: "M16A1"
 INO_infantry_equipment_3_desc: "The U.S. Army XM16E1 was essentially the same weapon as the M16 with the addition of a forward assist and corresponding notches in the bolt carrier. The M16A1 was the finalized production model in 1967 and was produced until 1982. To address issues raised by the XM16E1's testing cycle, a closed, bird-cage flash suppressor replaced the XM16E1's three-pronged flash suppressor which caught on twigs and leaves. Various other changes were made after numerous problems in the field. Cleaning kits were developed and issued while barrels with chrome-plated chambers and later fully lined bores were introduced."
 INO_infantry_equipment_4: "PT Pindad Senapan Serbu 1"
 INO_infantry_equipment_4_short: "Pindad SS1"
 INO_infantry_equipment_4_desc: "The SS1 short for Senapan Serbu 1, meaning; \"Assault Rifle 1\" is the standard assault rifle of the Indonesian armed forces and Indonesian National Police. It is based on the FN FNC rifle but modified in order to meet ergonomic and tropical environment needs."
 INS_infantry_equipment_0: "U.S. rifle, caliber .30, M1"
 INS_infantry_equipment_0_short: "M1 Garand"
 INS_infantry_equipment_0_desc: "The M1 Garand is a grand weapon designed by John C. Garand in 1928 for the United States. The M1 Garand is a .30 caliber semi-automatic rifle that saw extensive use during WWII. It is amongst the first weapons to use a gas reloading system to rechamber a new round after firing. It uses clips loaded from the top of the rifle and can be fitted with accessories including the M31 HEAT anti-tank rifle grenade. It functions as an all purpose weapon with an exceptional range and accuracy. It became symbolic and is still used by modern drill teams in the US.."
 INS_infantry_equipment_1: "Fabrique Nationale Fusil Automatique Léger"
 INS_infantry_equipment_1_short: "FN FAL"
 INS_infantry_equipment_1_desc: "FN FAL is one of most produced guns in history. Because of its prevalence and widespread usage among the militaries of many NATO and first world countries during the Cold War it was given the title \"The right arm of the Free World\"."
