 INO_attack_helicopter_equipment_4: "Mil Mi-35P"
 INO_attack_helicopter_equipment_4_short: "Mi-35P"
 INO_attack_helicopter_equipment_4_desc: "Initially a basic export version of the Soviet produced Mil Mi-24P, this variant was upgraded to a new common standard for Mi-24 modernization. The Mi-35P has received the OPS-24N-1L observation-sight system with a third generation long-wave matrix thermal imager, TV camera, and laser rangefinder. The upgraded gunship's cockpit has the KNEI-24E-1 flight navigation system with multifunctional displays. The PKV-8-35 digital flight system increases the helicopter's manoeuvrability and steadiness. The modernised gunship is also fitted with the updated PrVK-24-2 targeting system, which allows the use of 9M127-1 Ataka-VM anti-tank guided missiles and either L370 Vitebsk electronic countermeasure system or its export version President-S."
 INO_attack_helicopter_equipment_5: "McDonnell Douglas AH-64E Guardian"
 INO_attack_helicopter_equipment_5_short: "AH-64E Guardian"
 INO_attack_helicopter_equipment_5_desc: "The AH-64E features improved digital connectivity, the Joint Tactical Information Distribution System, more powerful T700-GE-701D engines with upgraded face gear transmission to accommodate more power, capability to control unmanned aerial vehicles (UAVs), full IFR capability, and improved landing gear. New composite rotor blades, which successfully completed testing in 2004, increase cruise speed, climb rate, and payload capacity."
 INS_CAS_equipment_1: "Fokker C.X Series I"
 INS_CAS_equipment_1_short: "Fokker C.X"
 INS_CAS_equipment_1_desc: "The Fokker C.X was originally designed for the Royal Dutch East Indies Army, in order to replace the Fokker C.V. Like all Fokker aircraft of that time, it was of mixed construction, with wooden wing structures and a welded steel tube frame covered with aluminium plates at the front of the aircraft and with fabric at the rear. The prototype was built in 1934 with a Rolls-Royce Kestrel V engine. "
 INS_CAS_equipment_2: "Curtiss P-40K Warhawk"
 INS_CAS_equipment_2_short: "P-40K Warhawk"
 INS_CAS_equipment_3: "Curtiss P-40N Kittyhawk"
 INS_CAS_equipment_3_short: "P-40N Kittyhawk"
 INS_CAS_equipment_3_desc: "The P-40 was a single-engine, all-metal fighter aircraft developed in 1938 and was a modified version of the P-36 Hawk. The type would be used by a sizeable number of Allied powers during the Second World War, and despite being inferior to the later P-47 and P-51, would serve in frontline service all the way until the end of the war. 200 Allied pilots from 7 different nations ranging from the U.S., the British Commonwealth nations and the Soviet Union became aces in the P-40. Despite differing designations for Commonwealth and Soviet Service, the official nickname in U.S. service is 'Warhawk.'"
 INS_CAS_equipment_4: "Douglas A-26C Invader"
 INS_CAS_equipment_4_short: "A-26C Invader"
 INS_CAS_equipment_4_desc: "The Douglas A-26 Invader is an American twin-engined light bomber and ground attack aircraft. Built by Douglas Aircraft Company during World War II, the Invader also saw service during several major Cold War conflicts."
