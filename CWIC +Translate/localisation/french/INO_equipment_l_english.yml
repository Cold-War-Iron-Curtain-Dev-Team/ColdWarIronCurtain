 INO_tac_bomber_equipment_1: "Mitsubishi Navy Type 1 Attack Bomber"
 INO_tac_bomber_equipment_1_short: "Mitsubishi G4M"
 INO_tac_bomber_equipment_2: "North American B-25C Mitchell"
 INO_tac_bomber_equipment_2_short: "B-25C Mitchell"
 INO_tac_bomber_equipment_2_desc: "The B-25 is a twin-engine medium bomber introduced in 1941. Used by many air forces during WWII, it also served in every theater involving aircraft in the war, the most famous use being the Doolittle Raid, the first successful air bombing campaign of the Japanese mainland during the war. Its nickname is the 'Mitchell', named after Major General Billy Mitchell, a pioneer of U.S. military aviation."
 INO_tac_bomber_equipment_3: "North American B-25J Mitchell"
 INO_tac_bomber_equipment_3_short: "B-25J Mitchell"
 INO_jet_tac_bomber_equipment_2: "Ilyushin Il-28"
 INO_jet_tac_bomber_equipment_2_short: "Il-28"
 INO_jet_tac_bomber_equipment_2_desc: "The Il-28 was a turbojet medium bomber developed immediately after the end of the Second World War for the Soviet Air Force. The first jet bomber to enter large-scale production, the Il-28, when introduced in 1950 served in many of the major conflicts of the Cold War, from Vietnam and the Soviet-Afghan War, to the Suez Conflict and the Biafra War. Even after being phased out of Soviet service by the 1980s, many aircraft of this type still enjoy service to this day. The USAF/DoD reporting name is Type 27, while the NATO codename is Beagle."
 INO_jet_strat_bomber_equipment_1: "Tupolev Tu-16KS1"
 INO_jet_strat_bomber_equipment_1_short: "Tu-16KS1"
 INO_jet_strat_bomber_equipment_1_desc: "The Tu-16 is a twin-engine strategic bomber developed in 1952, and was one of the first jet-powered strategic bombers to enter Soviet Air Force service. It had a swept-wing configuration and was powered by two Mikulin AM-3 turbojets on the wing roots. It could carry up to 9,000 kg (20,000 lbs) of ordinance, including nuclear weapons and the FAB-9000, a 9,000 kg bomb with a yield similar to the British Grand Slam bomb. Known in the West as the Badger, the type served throughout the Cold War, retiring in 1993. China's license-built variant, the H-6, remains in service as the PLAAF's frontline strategic bomber."
