l_english:
 mongolia.1.d:0 "Sous le joug de Staline et de ses marionnettes communistes en Mongolie, les habitants de la région ont énormément souffert. Depuis sa création en 1921, la République populaire de Mongolie a été en proie à des purges et à des massacres qui ont complètement bouleversé le mode de vie du peuple mongol et ont eu un impact dévastateur sur la population. Bien qu’il prétende représenter le peuple, le Parti populaire mongol a contraint la population à collectiviser son bétail tout en éradiquant pratiquement la religion bouddhiste. Ses temples profanés subsistent comme autant de vestiges calcinés d’une époque révolue. Le mécontentement face au régime soviétique ne cesse de croître et la population est de plus en plus insatisfaite du régime communiste. Bien qu’il ne constitue pas encore une menace pour le régime soviétique, le sentiment antisoviétique grandissant dans toute la Mongolie représente un danger que Staline ne peut se permettre d’ignorer."
 mongolia.2.d:0 "Notre cher dirigeant, Khorloogiin Choibalsan, est décédé à l’âge de 56 ans d’un cancer du rein à Moscou. On se souviendra de lui comme d’un héros, d’un patriote et, en fin de compte, d’un martyr de la cause de l’indépendance mongole. Sa dépouille a été rapatriée avec tous les honneurs militaires et des funérailles nationales lui ont été organisées dans la capitale, en présence de responsables mongols et soviétiques. Il a été inhumé au cimetière d'Altan Ulgii à Oulan-Bator, mais la construction d'un mausolée devant le Palais du Gouvernement a déjà commencé."
 mongolia.3.d:0 "\nMalgré l'enthousiasme des dirigeants communistes mongols, l'Union soviétique a rejeté leur demande d'adhésion en tant que république constituante au sein du pays. Bien que les Soviétiques apprécient l'engagement de la Mongolie envers le socialisme et le modèle soviétique, nombreux sont ceux qui estiment que la nation est bien trop sous-développée pour être intégrée. Certains craignaient également que l’intégration de la Mongolie ne finisse par s’attirer l’hostilité des alliés socialistes de l’Union soviétique en Chine et en Asie de l’Est. Le gouvernement mongol se serait montré déçu par cette décision et s’est engagé à poursuivre le développement révolutionnaire du pays sous la houlette soviétique. Au sein du Parti communiste mongol, cependant, des rumeurs laissent entendre que de nombreux membres du parti s’opposaient à ce projet et auraient même, en privé, exhorté les responsables soviétiques à rejeter la proposition."
 mongolia.11.d:0 "Le Parti communiste mongol a clôturé les débats publics et les rapports concernant les transgressions et les excès de violence commis par le passé lors de la Grande Purge de 1937 à 1939. Le Parti déplore les pertes humaines et la destruction culturelle survenues durant cette période. Plus important encore, le Parti a décidé de réhabiliter les membres du Parti purgés qui avaient été condamnés pour leur nationalisme excessif. Au sein du parti, nombreux sont ceux qui attribuent la responsabilité de ces événements au rôle joué par les conseillers soviétiques, en particulier ceux du NKVD, accusés d’avoir dirigé et contrôlé les violences, notamment la torture et la mise en place de camps de prisonniers. Le dirigeant communiste de l’époque, le maréchal Choibalsan, très apprécié, a également été critiqué pour avoir commis des erreurs durant cette période et pour avoir instauré un culte de la personnalité. Certains membres de la vieille garde du parti sont mal à l’aise face à ces mesures."
 mongolia.20.d:0 "Le secrétaire général Dashiin Damba a récemment été démis de ses fonctions à la suite d’une lutte de pouvoir au sein du Parti communiste mongol. Damba avait récemment joué un rôle majeur dans les efforts de déstalinisation, tout en encourageant le pays à nouer des relations avec d’autres puissances asiatiques d’orientation socialiste, et non plus uniquement avec l’Union soviétique. La vieille garde du Parti a pris ombrage de cette déstalinisation, en particulier des critiques formulées à l’encontre de l’ancien dirigeant, le maréchal Choibalsan. C’est cette faction qui a orchestré l’éviction de Damba et la purge de ses proches collaborateurs. L’Union soviétique devrait se réjouir de cette évolution, car elle contribuera à consolider le leadership de la faction pro-Moscou au sein du Parti."
 mongolia.7.d:0 "Depuis la chute de l’Empire mongol, la Mongolie a connu une histoire complexe et instable. Dans le chaos politique de la Chine de l’époque des seigneurs de guerre, cette petite nation isolée qu’est la Mongolie a été oubliée par les grandes puissances et n’a donc jamais bénéficié d’une reconnaissance officielle. Après que Bogd Khan et les forces d'occupation chinoises eurent été chassés par l'Armée rouge en 1921, le pays se retrouva de fait sous contrôle soviétique et dépourvu de tout statut officiel d'État. Bien qu'elle ait pris part de manière indépendante aux combats contre le Japon pendant la Seconde Guerre mondiale, l'indépendance de la Mongolie n'était toujours reconnue que par les Soviétiques. Cependant, avec l’intensification de la Guerre froide à l’échelle mondiale, l’Union soviétique a considérablement redoublé d’efforts pour faire reconnaître les Mongols en tant qu’État indépendant. Cette initiative représente une avancée majeure pour l’identité nationale mongole et pourrait bien redonner à la Mongolie son statut de puissance universellement reconnue pour la première fois depuis le XIVe siècle."
 mongolia.21.d:0 "Au cours d’une réunion extraordinaire du Comité central, le Premier ministre Yumjaagiin Tsedenbal a été démis de ses fonctions. Figure majeure du parti depuis son accession au poste de secrétaire général en 1940, sa destitution indique que le parti s’était mis à se méfier de ses efforts d’industrialisation et de son attachement à Moscou. Sa destitution est probablement le résultat des récents efforts de déstalinisation qui ont vivement critiqué les mentors politiques de Tsedenbal. Son association avec l'ancienne direction a rendu sa position intenable, la nouvelle direction du parti souhaitant tourner la page. Le nouveau Premier ministre n'a pas encore été nommé, mais il devrait maintenir des liens étroits avec Moscou et œuvrer pour que la Mongolie renoue des relations plus solides avec les autres États socialistes d'Asie. On ignore si Tsedenbal a été exclu du parti ou s'il a simplement été démis de ses fonctions de haut niveau."
 AJAX.900.d:0 "Le nouveau gouvernement iranien d’Ahmad Qavam a donné son accord à la restauration de la dynastie des Qajar. Le jeune Hamid Mirza Qajar, fils de l’ancien prince héritier, deviendra shah. Le gouvernement iranien a qualifié cet événement de réparation d’une injustice historique, soulignant que Reza Pahlavi avait usurpé le trône par des manœuvres, la violence et avec le soutien de forces étrangères. C’est cette tendance à la cruauté et à l’alliance avec les puissances étrangères qui a maintenu la nation iranienne dans un état de faiblesse ces dernières années. La restauration des Qajar ramène au pouvoir une dynastie du XVIIIe siècle et redynamisera les liens naturels non seulement entre la monarchie et le peuple, mais aussi entre la monarchie et le clergé."
 AJAX.911.d:0 "La position du Shah auprès de l'opinion publique s'est encore détériorée à la suite de l'organisation de rassemblements de masse contre lui par le groupe radical Fadaiyan-i-Islam. Grâce à ses contacts au sein du clergé, ce groupe a réussi à rallier des partisans lors des prières du vendredi et à les faire descendre dans les rues à travers tout le pays. Les manifestants ont condamné les politiques d'occidentalisation de la dynastie Pahlavi, son engagement envers les puissances impérialistes et ce qu'ils qualifiaient d'oppression de l'islam. La mobilisation des communautés religieuses en Iran constitue un coup dur pour le Shah, qui fait déjà face à un tollé général en raison de ses tendances autocratiques et de son image de marionnette des puissances impérialistes."
 mongolia_prc_1_desc:0 "Dans un communiqué officiel, la [PRC.GetName] a proposé d'envoyer quelques centaines de milliers de travailleurs chinois de l'ethnie Han en Mongolie extérieure afin de contribuer à la modernisation de notre pays. Cela serait sans aucun doute extrêmement utile pour consolider notre rôle au sein du monde communiste. Cependant, la [MON.GetName] est une très petite nation, relativement parlant, et le nombre de Mongols de souche vivant sur notre territoire est assez faible. Si nous acceptons ces travailleurs chinois de souche han, nous nous retrouverions avec un nombre de personnes d’origine chinoise bien supérieur à ce que nous pourrions assimiler, et il existe un risque que la [PRC.GetName] tente d’intégrer notre nation."
 inner_mongol_13_desc:0 "Plus tôt dans la journée, la [PRC.GetName] a annoncé qu’elle autoriserait et encouragerait la migration des Mongols de la région de la Mongolie intérieure vers la Mongolie extérieure, ou [MON.GetName]. Cette décision fait suite à une première demande de cession de l’ensemble de la région de la Mongolie intérieure, demande que le gouvernement chinois a apparemment jugée ridicule et qu’il a catégoriquement rejetée. Toutefois, leur demande officielle visant à conclure une sorte de traité de migration a été acceptée comme un geste de bonne volonté, et le mouvement en faveur de l'unité mongole est célébré ce soir à Oulan-Bator."
 inner_mongol_14_desc:0 "Plus tôt dans la journée, le [MON.GetName] a fait part de son mécontentement envers le gouvernement chinois en raison de son refus catégorique de coopérer avec le gouvernement mongol dans ses efforts visant à intégrer les populations de la Mongolie intérieure sur son territoire. Dans un premier temps, la [PRC.GetName] avait rejeté une première tentative visant à organiser la cession de la région de la Mongolie intérieure à son État, dans l’espoir d’améliorer les relations après le transfert de la région. Lorsque la [MON.GetName] a envoyé un autre communiqué demandant une politique d'immigration ouverte, la [PRC.GetName] a une nouvelle fois rejeté cette demande. Ce soir, nombreux sont ceux qui, en Mongolie, se sentent frustrés face à ce manque de coopération."
 inner_mongol_12_desc:0 "Ce maudit [PRC.GetName] a encore compromis nos efforts visant à unir les Mongols. Dans une tentative malavisée de nous combattre bec et ongles par pure rancune, il a rejeté nos deux demandes, adoptant au contraire une position intransigeante qui s'apparente presque à un sentiment anti-mongol. Malheureusement, nous devrons attendre pour voir notre union se concrétiser."
 inner_mongol_11_desc:0 "Cette maudite [PRC.GetName] a encore compromis nos efforts visant à unir les Mongols. Dans une tentative malavisée de nous combattre bec et ongles par pure rancune, il a rejeté nos deux demandes, adoptant au contraire une position intransigeante qui s'apparente presque à un sentiment anti-mongol. Malheureusement, nous devrons attendre pour voir notre union se concrétiser."
 inner_mongol_10_desc:0 "Bien que nous ayons rejeté leur précédent communiqué, nous avons reçu un nouveau message du gouvernement mongol. S'excusant de son empressement, [PRC.GetLeader] a sollicité la conclusion d'un traité autorisant la libre migration des peuples altaïques vers son territoire, afin de poursuivre sa mission d'unité nationale. Bien que cette demande soit moins gênante que la précédente, certains continuent de s'opposer à l'idée d'apaiser les Mongols."
 inner_mongol_1_desc:0 "Bien que la Mongolie intérieure ne fasse plus partie de la nation mongole depuis la chute de l’empire de Temujin, les peuples altaïques continuent d’habiter de vastes étendues des steppes de la Mongolie intérieure, qui font désormais partie du nord de la Chine. De plus, une partie influente de la population de cette région aspire à une steppe unifiée et à la réunification d'une Grande Mongolie. Cependant, la [PRC.GetName] contrôle ces vastes steppes et pourrait ne pas partager notre point de vue quant à l'acquisition de leurs terres. Nous ne pouvons qu'envoyer notre demande et espérer que tout se passe pour le mieux."
 inner_mongol_2_desc:0 "À midi aujourd’hui, nous avons reçu un communiqué de [MON.GetName]. Ce communiqué contenait une demande détaillée visant à céder les territoires de la Mongolie intérieure à [MON.GetName], au nom de ce que [MON.GetLeader] a qualifié de « droit ancestral et ethnique à l’unité des peuples ». S'il est vrai que cela constituerait un geste de bonne volonté notable envers les peuples altaïques de la région, ainsi qu'un moyen d'établir de meilleures relations entre nos pays, de nombreux membres influents de notre gouvernement ont réagi avec hostilité à cette demande, affirmant sans ambages que nous ne devons rien au peuple mongol."
 inner_mongol_3_desc:0 "La Chine a rejeté notre demande, ce qui constitue un revirement regrettable. [PRC.GetLeader] a déclaré que « le peuple chinois ne doit rien aux Mongols », rejetant ainsi notre tentative d'unité entre les peuples. Nous pourrions toutefois parvenir à convaincre nos voisins de participer à un traité de migration ouvert qui permettrait à nos frères du sud de se réinstaller sur nos terres."
 inner_mongol_4_desc:0 "La Chine a accédé à notre demande. En quelques mots, [PRC.GetLeader] a de fait cédé la Mongolie intérieure, invoquant les animosités du passé et l'espoir d'une amitié renforcée entre les deux nations. Même si le transfert de ce territoire pourrait prendre un certain temps, il s'agit là d'une avancée historique sur le plan diplomatique."
 inner_mongol.5.d:0 "Plus tôt dans la journée, la [PRC.GetName] a annoncé qu’elle céderait les territoires de la Mongolie intérieure à la [MON.GetName], invoquant la forte présence des peuples altaïques dans la région, ainsi que la volonté d’améliorer les relations entre les deux nations. Bien que ces territoires n’aient plus appartenu à un État mongol depuis la dynastie Yuan, le gouvernement mongol a réaffirmé son souhait de voir s’unir tous les peuples mongols. À Oulan-Bator, la population est descendue dans les rues pour célébrer ce couronnement de la diplomatie."