 Assassinate_General_Success_tt:0 "Le général [local_possible_operations_personnel_target] a été assassiné avec succès par [GetCurrentSquadTitle], qui a réussi à échapper aux forces de sécurité."
 Assassinate_General_Failure_tt:0 "Une tentative d'assassinat du général [local_possible_operations_personnel_target] menée par des agents de [GetCurrentSquadTitle] a échoué, ceux-ci ayant été appréhendés par les forces de sécurité après l'échec de leur opération."
 Assassinate_Admiral_Success_tt:0 "L'amiral [local_possible_operations_personnel_target] a été assassiné avec succès par [GetCurrentSquadTitle], qui a réussi à échapper aux forces de sécurité."
 Assassinate_Admiral_Failure_tt:0 "Une tentative d'assassinat de l'amiral [local_possible_operations_personnel_target] par des agents de [GetCurrentSquadTitle] a échoué, ceux-ci ayant été appréhendés par les forces de sécurité après l'échec de leur opération."
 Sabotage_Nuclear_Program_Success_tt:0 "L'infiltration par [GetCurrentSquadTitle] dans le programme nucléaire de [GetTargetPlaceholder] a été couronnée de succès, ces agents ayant neutralisé toute capacité nucléaire pour l'avenir proche."
 Sabotage_Nuclear_Program_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] visant à infiltrer le programme nucléaire de [GetTargetPlaceholder] ont échoué, car ses membres ont été appréhendés par les forces de sécurité alors qu'ils tentaient de pénétrer dans les lieux."
 Sabotage_Nuclear_Site_Success_tt:0 "L'infiltration menée par [GetCurrentSquadTitle] sur un site nucléaire de [GetTargetPlaceholder] a été couronnée de succès : ces agents ont neutralisé toute capacité nucléaire pour les jours à venir et détruit des équipements essentiels."
 Sabotage_Nuclear_Site_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] visant à s'infiltrer dans un site nucléaire de [GetTargetPlaceholder] ont échoué, car ses membres ont été appréhendés par les forces de sécurité alors qu'ils tentaient d'y pénétrer."
 Sabotage_Airfield_Success_tt:0 "L'infiltration menée par [GetCurrentSquadTitle] sur un aérodrome situé à [GetTargetPlaceholder] a été couronnée de succès ; ces agents ont ainsi neutralisé les capacités offensives et défensives de cette base pour les jours à venir."
 Sabotage_Airfield_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] pour s'infiltrer sur un aérodrome à [GetTargetPlaceholder] ont échoué, car ses membres ont été appréhendés par les forces de sécurité alors qu'ils tentaient d'y pénétrer."
 Sabotage_Military_Industry_Success_tt:0 "L'infiltration par [GetCurrentSquadTitle] dans les installations de production militaire de [GetTargetPlaceholder] a réussi, ces agents ayant paralysé toute capacité de production de matériel de défense pour les jours à venir."
 Sabotage_Military_Industry_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] visant à s'infiltrer dans les installations de production militaire de [GetTargetPlaceholder] ont échoué, car ses membres ont été appréhendés par les forces de sécurité alors qu'ils tentaient d'y pénétrer."
 Sabotage_Dockyard_Success_tt:0 "L'infiltration par [GetCurrentSquadTitle] dans les chantiers navals de [GetTargetPlaceholder] a réussi, et ces agents ont paralysé toute capacité de construction navale et toute puissance navale pour les mois à venir."
 Sabotage_Dockyard_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] pour s'infiltrer dans les chantiers navals de [GetTargetPlaceholder] ont échoué, car ses membres ont été appréhendés par les forces de sécurité alors qu'ils tentaient d'y pénétrer."
 Sabotage_Port_Success_tt:0 "L'infiltration menée par [GetCurrentSquadTitle] dans un port de [GetTargetPlaceholder] a réussi, et ces agents ont neutralisé toute capacité offensive navale pour les jours à venir."
 Sabotage_Port_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] pour s'infiltrer dans un port de [GetTargetPlaceholder] ont échoué, car ses membres ont été appréhendés par les forces de sécurité alors qu'ils tentaient d'y pénétrer."
 Sabotage_Civilian_Industry_Success_tt:0 "L'infiltration par [GetCurrentSquadTitle] dans les complexes industriels civils de [GetTargetPlaceholder] a été couronnée de succès ; ces agents ont ainsi paralysé toute capacité de production industrielle civile pour les jours à venir"
 Sabotage_Civilian_Industry_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] visant à s'infiltrer dans les installations industrielles civiles de [GetTargetPlaceholder] ont échoué, car ses membres ont été appréhendés par les forces de sécurité alors qu'ils tentaient d'y pénétrer."
 Blow_Key_Infrastructure_Success_tt:0 "Les opérations menées par [GetCurrentSquadTitle] contre des infrastructures clés situées à [GetTargetPlaceholder] ont été couronnées de succès, leur capacité de transport ayant été considérablement réduite par des attaques de grande ampleur."
 Blow_Key_Infrastructure_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] visant à s'infiltrer dans des infrastructures clés de [GetTargetPlaceholder] ont échoué, leurs membres ayant été appréhendés par les forces de sécurité alors qu'ils tentaient d'y pénétrer."
 Perform_Terrorist_Attack_Success_tt:0 "Les attentats terroristes perpétrés par [GetCurrentSquadTitle] contre des civils à [GetTargetPlaceholder] ont atteint leur but, faisant de nombreuses victimes et semant la peur au sein de l'appareil gouvernemental."
 Perform_Terrorist_Attack_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] visant à commettre un attentat terroriste contre [GetTargetPlaceholder] ont échoué, car ses membres ont été appréhendés par les forces de sécurité alors qu'ils tentaient de mettre leur complot à exécution."
 Prepare_Local_Uprising_Success_tt:0 "Une opération de soulèvement locale menée avec le soutien de [GetCurrentSquadTitle] contre [GetTargetPlaceholder] a été couronnée de succès, entraînant la mort de nombreux membres des forces de sécurité fidèles au gouvernement et la quasi-chute du gouvernement au profit des rebelles."
 Prepare_Local_Uprising_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] visant à organiser un soulèvement local contre le gouvernement à [GetTargetPlaceholder] ont échoué, car ses membres ont été arrêtés par les forces de sécurité qui ont découvert leur complot."
 Contact_Resistance_Group_Success_tt:0 "La prise de contact entre [GetCurrentSquadTitle] et un groupe de résistance local contre [GetTargetPlaceholder] a abouti, ce qui a permis d'établir de nouvelles voies de communication et d'assistance importantes pour le groupe insurgé."
 Contact_Resistance_Group_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] pour entrer en contact avec un groupe de résistance à [GetTargetPlaceholder] ont échoué, en raison d'un manque de communication et d'une absence de coopération entre les deux parties."
 Train_Local_Resistance_Success_tt:0 "Une opération menée par [GetCurrentSquadTitle] visant à former des groupes de résistance locaux contre [GetTargetPlaceholder] a été couronnée de succès, ce qui a permis d'accroître la capacité de combat de ces forces irrégulières et leur capacité à lancer davantage d'attaques contre le gouvernement en place."
 Train_Local_Resistance_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] visant à former des forces de résistance locales à [GetTargetPlaceholder] ont échoué, car ses membres ont été arrêtés par les forces de sécurité lors d'un raid contre le groupe de résistance."
 Arm_Local_Resistance_Success_tt:0 "Une opération menée par [GetCurrentSquadTitle] visant à armer les groupes de résistance locaux contre [GetTargetPlaceholder] a été couronnée de succès, ce qui a permis de renforcer les capacités militaires de ces forces irrégulières et leur a donné les moyens de lancer davantage d'attaques contre le gouvernement en place."
 Arm_Local_Resistance_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] visant à armer les groupes de résistance locaux à [GetTargetPlaceholder] ont échoué, car leurs auteurs ont été arrêtés par les forces de sécurité lors d'un raid mené contre le groupe de résistance."
 Embed_Insurgency_Success_tt:0 "L'opération menée par [GetCurrentSquadTitle] visant à s'infiltrer dans un groupe insurgé local à [GetTargetPlaceholder] a été couronnée de succès, ce qui a permis de renforcer les liens de communication et d'améliorer les capacités d'attaque de ce groupe en particulier."
 Embed_Insurgency_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] pour s'infiltrer dans des groupes insurgés à [GetTargetPlaceholder] ont échoué, car ses membres ont été appréhendés par les forces de sécurité lors d'un raid."
 Counterespionage_Embed_Success_tt:0 "L'opération visant à infiltrer les services de sécurité menée par [GetCurrentSquadTitle] contre [GetTargetPlaceholder] a été couronnée de succès. Elle a permis d'enrichir les renseignements sur les capacités et les forces de sécurité, ce qui facilitera la conduite des opérations futures."
 Counterespionage_Embed_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] visant à s'infiltrer dans les services de sécurité de [GetTargetPlaceholder] ont échoué, car ils ont été démasqués par ces derniers et placés en détention."
 Expand_Intel_Network_Success_tt:0 "L'opération menée par [GetCurrentSquadTitle] visant à étendre le réseau de renseignement à [GetTargetPlaceholder] a été couronnée de succès, ce qui a permis de renforcer les capacités de renseignement et les effectifs afin de soutenir leurs objectifs."
 Expand_Intel_Network_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] visant à étendre leur réseau de renseignement à [GetTargetPlaceholder] ont échoué, car elles ont été contrecarrées par le gouvernement et les forces de sécurité."
 Steal_Technology_Success_tt:0 "Une opération menée par [GetCurrentSquadTitle] contre [GetTargetPlaceholder] en vue de dérober une technologie cruciale a abouti, permettant ainsi de mettre au jour des données et des informations essentielles concernant la technologie actuelle."
 Steal_Technology_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] visant à dérober une technologie cruciale à [GetTargetPlaceholder] ont échoué, car ses membres ont été appréhendés par les forces de sécurité alors qu'ils tentaient de s'enfuir."
 Combat_Resistance_Success_tt:0 "Une opération anti-insurrection menée par [GetCurrentSquadTitle] contre les forces insurgées et de résistance locales a été couronnée de succès, se soldant par de nombreuses arrestations et pertes humaines, à la suite de raids menés contre des camps et des quartiers généraux stratégiques."
 Combat_Resistance_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] pour lutter contre la résistance locale menée par des groupes insurgés à l'intérieur du pays ont échoué, car elles n'ont pas permis d'empêcher efficacement les actions de ces groupes."
 Blow_Railways_Success_tt:0 "Une opération visant à faire sauter des lignes ferroviaires stratégiques, menée par [GetCurrentSquadTitle] contre [GetTargetPlaceholder], a été couronnée de succès, entraînant d'énormes problèmes logistiques et une interruption temporaire du transport ferroviaire."
 Blow_Railways_Failure_tt:0 "Les tentatives de [GetCurrentSquadTitle] visant à faire sauter les voies ferrées à [GetTargetPlaceholder] ont échoué, car ils ont été appréhendés par les forces de sécurité alors qu'ils tentaient d'y pénétrer."
 WORLD_FACTBOOK_TITLE:0 "Livre des faits mondiaux : §Y[?generic_operations_selected_target.GetName]§!"
 PHASE_1_Operation_DESC_BOP_1:0 "Il est nécessaire que nous dressions une liste d'exilés cubains à contacter dans les mois à venir, en particulier ceux qui sont opposés à Castro et souhaitent renverser le gouvernement communiste de La Havane."
 PHASE_2_Operation_DESC_BOP_1:0 "Le moment est venu ; plusieurs agents se rendront à Miami dans les prochains jours afin de prendre contact avec tous les exilés figurant sur la liste établie précédemment, dans le but de déterminer leurs intentions, leurs capacités et leur intérêt pour un changement de régime à Cuba."
 PHASE_3_Operation_DESC_BOP_1:0 "L'opération à Miami a été un succès ! Presque tous les exilés à qui nous avons parlé adhèrent à notre projet visant à renverser le régime illégitime de Castro, et nos agents sont impatients de nous faire part de plus amples informations sur ces exilés."
 PHASE_1_Operation_DESC_BOP_2:0 "Cette nouvelle brigade a tout d'abord besoin d'un modèle de structure de commandement pour définir son mode de fonctionnement. Nous devrions nous inspirer des modèles existants de l'armée américaine pour définir l'organisation de cette unité."
 PHASE_2_Operation_DESC_BOP_2:0 "D'après les exilés cubains à qui nous avons parlé à Miami, nos agents doivent évaluer chaque homme et lui attribuer un grade d'officier, afin que la brigade dispose d'un encadrement suffisant le moment venu."
 PHASE_3_Operation_DESC_BOP_2:0 "Enfin, maintenant que nous avons posé les bases de la nouvelle brigade, nos agents doivent contacter le Pentagone et demander que des officiers de l'armée soient affectés à la brigade afin de commencer à la conseiller et à la former."
 PHASE_1_Operation_DESC_BOP_3:0 "Nous devrions prendre contact avec le réseau d'exilés de la région de Miami, en accordant une attention particulière à ceux qui ont une expérience de pilote."
 PHASE_2_Operation_DESC_BOP_3:0 "Outre les pilotes exilés, il pourrait s'avérer nécessaire de renforcer cette force pilote avec certains membres de la Garde nationale, notamment ceux qui possèdent une expérience de vol et les compétences requises."
 PHASE_3_Operation_DESC_BOP_3:0 "Il est temps de faire rapport au siège de Langley pour informer nos supérieurs de l'état d'avancement de notre programme de recrutement de pilotes."
 PHASE_1_Operation_DESC_BOP_4:0 "Compte tenu du grand nombre d'aérodromes disséminés à travers les États-Unis, il doit sûrement y en avoir certains qui possèdent de vieux avions pouvant être récupérés pour nos besoins."
 PHASE_2_Operation_DESC_BOP_4:0 "Sous le couvert de la nuit, des équipes de la CIA voleront en secret des bombardiers B-26 depuis leurs bases aériennes et les piloteront vers des destinations tenues secrètes afin de soutenir notre mission d'exil."
 PHASE_3_Operation_DESC_BOP_4:0 "Maintenant que les appareils sont en notre possession, nous devons nous assurer que les bombardiers sont prêts à entrer en service et que leurs cocardes et leurs marquages ont été repeints en conséquence."
 PHASE_1_Operation_DESC_BOP_5:0 "Cette nouvelle unité aérienne a d'abord besoin d'un modèle de structure de commandement pour définir son mode de fonctionnement. Nous devrions nous inspirer des modèles existants de l'US Air Force pour définir l'organisation de cette unité."
 PHASE_2_Operation_DESC_BOP_5:0 "D'après les pilotes cubains à qui nous avons parlé à Miami, nos agents doivent évaluer chaque homme et lui attribuer un grade d'officier, afin que la brigade dispose d'un encadrement suffisant le moment venu."
 PHASE_3_Operation_DESC_BOP_5:0 "Enfin, maintenant que nous avons posé les bases de cette nouvelle force aérienne, nos agents doivent prendre contact avec le Pentagone et demander que des officiers de l'armée de terre soient affectés à la brigade afin de commencer à la conseiller et à la former."
 PHASE_1_Operation_DESC_BOP_6:0 "Après avoir trouvé l'emplacement idéal pour un terrain d'entraînement, nos agents doivent prendre contact avec les responsables du gouvernement guatémaltèque afin d'obtenir leur autorisation pour l'utilisation de leurs terres."
 PHASE_2_Operation_DESC_BOP_6:0 "Maintenant que nous avons obtenu l'autorisation, nous allons faire appel à des ouvriers du bâtiment locaux, équipés de matériel américain, pour commencer la construction de la piste et des bâtiments annexes."
 PHASE_3_Operation_DESC_BOP_6:0 "L'aérodrome est terminé ! La brigade dispose désormais d'un site hors des États-Unis pour s'entraîner et se préparer à l'opération. Le déplacement des troupes va commencer sans délai."
 PHASE_1_Operation_DESC_BOP_7:0 "Étant donné que nous formons principalement des pilotes cubains en exil, nos agents et nos interprètes feront tout leur possible pour initier le personnel aux principes fondamentaux de la mécanique aéronautique, tant en anglais qu'en espagnol."
 PHASE_2_Operation_DESC_BOP_7:0 "Maintenant que les pilotes ont acquis les bases, il est temps de tester l'appareil, en commençant par quelques exercices d'entraînement au vol à basse altitude et des vols autour de la base de Rayo."
 PHASE_3_Operation_DESC_BOP_7:0 "Enfin, pour conclure leur formation, les pilotes effectueront des missions avec des bombes factices et des munitions à blanc afin de s'entraîner au bombardement et au mitraillage de cibles sélectionnées, telles que des dépôts de munitions et des casernes."
 PHASE_1_Operation_DESC_BOP_8:0 "Afin d'attirer davantage d'émigrés au sein de la brigade, nous allons lancer une campagne de propagande dans les quartiers de Miami à forte population cubaine, en mettant l'accent sur le sentiment anti-Castro et les avantages financiers liés à l'adhésion à la brigade."
 PHASE_2_Operation_DESC_BOP_8:0 "Afin de faciliter le traitement des dossiers de ces nouvelles recrues potentielles, nos agents ainsi que les officiers de la brigade ouvriront un bureau dans le centre-ville de Miami."
 PHASE_3_Operation_DESC_BOP_8:0 "Maintenant que nous avons réuni le nombre d'hommes nécessaire, il est temps de les répartir en compagnies au sein de la brigade, en désignant un officier pour les commander ainsi que des sous-officiers."
 PHASE_3_Operation_DESC_BOP_8_FAILURE:0 "Notre récente campagne de recrutement pour la brigade ayant échoué, nous devons réorienter et restructurer la brigade en une unité plus petite afin de nous adapter aux effectifs actuels."
 PHASE_1_Operation_DESC_BOP_9:0 "La CIA dispose de certains fonds, mais l'armée en a davantage. Il suffit de demander une petite partie du financement au ministère de la Défense pour compléter nos achats d'armes destinés à la brigade."
 PHASE_2_Operation_DESC_BOP_9:0 "Maintenant que nous disposons des fonds nécessaires, nous allons commander et acheter des milliers de fusils, de pistolets et de bazookas auprès des meilleurs fabricants américains afin de doter nos forces d'une puissance de feu considérable."
 PHASE_3_Operation_DESC_BOP_9:0 "Des avions remplis de caisses ont atterri à la base de Rayo. Il est temps maintenant que chaque membre de la brigade se procure son arme et s'y familiarise."
 PHASE_1_Operation_DESC_BOP_10:0 "Étant donné que nous formons principalement des recrues issues de la diaspora cubaine, nos agents et nos interprètes feront tout leur possible pour enseigner au personnel les techniques de combat de base, tant en anglais qu'en espagnol."
 PHASE_2_Operation_DESC_BOP_10:0 "Compte tenu du nombre limité de bateaux et de ressources dont nous disposons, nos instructeurs apprendront aux recrues comment débarquer sur les plages et prendre leurs positions de combat."
 PHASE_3_Operation_DESC_BOP_10:0 "La deuxième phase des opérations a commencé. La brigade sera transférée à Puerto Cabezas, au Nicaragua, où elle sera hébergée temporairement avant le débarquement."
 PHASE_1_Operation_DESC_BOP_11:0 "Grâce à une partie des fonds dont nous disposons, environ cinq cargos excédentaires de la compagnie cubaine Garcia Line seront achetés et utilisés pour transporter du matériel, des armes et du personnel dans le cadre de l'invasion."
 PHASE_2_Operation_DESC_BOP_11:0 "Pour assurer la desserte de nos deux navires de débarquement d'infanterie, nous allons recruter des équipages issus du Service de transport maritime militaire."
 PHASE_3_Operation_DESC_BOP_11:0 "À La Nouvelle-Orléans, nos cinq navires de transport seront chargés à ras bord de ravitaillement, d'armes et de matériel de communication, ainsi que de personnel chargé d'assurer leur fonctionnement dans le cadre d'une mission de soutien dès le début de l'invasion."
 PHASE_1_Operation_DESC_BOP_12:0 "Pour notre opération d'infiltration, il faut prévoir à l'avance quelques zones d'atterrissage afin que nos équipes puissent y accéder par bateau."
 PHASE_2_Operation_DESC_BOP_12:0 "Avant d'atterrir à Cuba, nous devrions envoyer des messages aux principaux groupes d'insurgés anticastristes de la région pour les informer de notre arrivée et de ce que nous espérons accomplir."
 PHASE_3_Operation_DESC_BOP_12:0 "Nos équipes débarqueront sur les plages de Cuba tard dans la nuit, avant de s'enfoncer dans la jungle pour se livrer à leurs frasques."
 PHASE_1_Operation_DESC_BOP_13:0 "En nous appuyant sur les exilés avec lesquels nous entretenons déjà de bonnes relations, nous dresserons une liste des groupes insurgés et de leurs dirigeants à Cuba afin de pouvoir les contacter."
 PHASE_2_Operation_DESC_BOP_13:0 "À l'aide de cette liste, nous mettrons en place une fréquence radio commune ainsi que des points de dépôt de messages et des lieux de rendez-vous pour permettre aux insurgés de communiquer avec nous."
 PHASE_3_Operation_DESC_BOP_13:0 "Maintenant que nous disposons d'insurgés et de moyens de communication, il est temps de leur faire part de nos plans et de solliciter leur aide pour renverser le régime de Castro."
 PHASE_1_Operation_DESC_BOP_14:0 "Dans le cadre de l'opération Puma, nous établirons une liste des aérodromes et des installations de l'armée de l'air cubaine à détruire de manière préventive afin de neutraliser leur force aérienne, ainsi que des infrastructures militaires visant à les paralyser."
 PHASE_2_Operation_DESC_BOP_14:0 "Maintenant que nous avons des cibles, il est temps d'armer les B-26 de bombes, de charger les mitrailleuses et de briefer les pilotes sur leurs cibles et leur mission."
 PHASE_3_Operation_DESC_BOP_14:0 "Enfin, nos bombardiers décolleront pour frapper trois aérodromes cubains à San Antonio de los Baños, ainsi que l'aéroport de Santiago de Cuba, afin de paralyser l'armée de l'air de Castro."
 PHASE_1_Operation_DESC_BOP_15:0 "Dans le cadre de l'opération Windfall, nous devons choisir un lieu à La Havane au-dessus duquel faire survoler des avions supersoniques, à des fins de guerre psychologique."
 PHASE_2_Operation_DESC_BOP_15:0 "Maintenant que nous disposons d'une base à La Havane, nos pilotes de la Marine recevront l'ordre de survoler la ville à vitesse supersonique à bord de leurs F-8 Crusader afin d'effrayer les forces de Castro et de semer le chaos"
 PHASE_3_Operation_DESC_BOP_15:0 "Enfin, nos avions de combat décolleront et provoqueront trois bangs soniques distincts au-dessus de La Havane, à différents endroits, mais en ciblant principalement le centre administratif du gouvernement cubain et les installations importantes."
 PHASE_1_Operation_DESC_BOP_16:0 "Après les premières frappes aériennes, nous devons établir une liste de cibles pour mener quelques frappes de diversion contre des navires et des bases militaires cubains, ainsi que d'autres installations logistiques."
 PHASE_2_Operation_DESC_BOP_16:0 "Maintenant que nous avons des cibles, il est temps d'armer les B-26 de bombes, de charger les mitrailleuses et de briefer les pilotes sur leurs cibles et leur mission."
 PHASE_3_Operation_DESC_BOP_16:0 "Enfin, nos bombardiers décolleront pour lancer leurs attaques contre les bases militaires, les installations navales et les centres logistiques cubains, dans le but de détourner leur attention avant le débarquement de nos forces."
 PHASE_1_Operation_DESC_BOP_17:0 "Nos cinq navires de transport, ainsi que les deux péniches de débarquement, seront tous chargés et remplis à ras bord avec leur équipage et tout le matériel supplémentaire nécessaire, avant de mettre le cap sur les côtes cubaines."
 PHASE_2_Operation_DESC_BOP_17:0 "Les insurgés doivent savoir que nous arrivons et où nous allons atterrir. Nos agents leur feront parvenir une série de messages par les voies habituelles pour les en informer."
 PHASE_3_Operation_DESC_BOP_17:0 "Le moment est venu ! Après des mois et des mois de préparatifs, la brigade et nos forces aériennes sont prêtes à débarquer. Les navires sont prêts, et à mesure qu'ils avancent, la brigade est prête à rendre Cuba à son dirigeant légitime."
