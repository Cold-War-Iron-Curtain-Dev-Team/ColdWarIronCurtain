 PHASE_3_Operation_DESC_GLADIO_SUCCESS_1:0 "Après avoir rencontré des contacts sur place, nos agents ont pu évaluer correctement les candidats au recrutement local. Ces derniers se sont révélés politiquement fiables et ont satisfait à nos vérifications d'antécédents de base. Bien qu'une formation en matière de stratégie et d'utilisation des armes soit nécessaire, ces nouvelles recrues devraient nous être d'un grand secours dans nos futures opérations."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_2:0 "Nos agents ont réussi à agrandir les caches d'armes locales sans attirer l'attention, en particulier celle des agents communistes et des forces de l'ordre. Des collaborateurs locaux de confiance ont été informés de cette extension et des modalités d'accès aux armes en cas d'urgence avant que l'équipe ne retourne dans un site secret de la CIA en vue de son exfiltration."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_3:0 "Après avoir établi le contact avec les dirigeants régionaux, l'escouade a pu rapidement affiner ses stratégies afin d'infliger le plus de dégâts possible aux occupants soviétiques et de perturber la chaîne d'approvisionnement soviétique dans tout le pays. Dans les jours qui ont suivi leur départ, le réseau local a lancé avec succès sa campagne de résistance antisoviétique."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_4:0 "Nos sources confidentielles au sein de l'armée ont confirmé que l'assassinat a été un succès ! Les forces de sécurité sont en pleine effervescence, mais nos agents ont réussi à s'échapper sans encombre vers notre site secret."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_5:0 "Nos sources confidentielles au sein de l'armée ont confirmé que l'assassinat a été un succès ! Les forces de sécurité sont en pleine effervescence, mais nos agents ont réussi à s'échapper sans encombre vers notre site secret."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_6:0 "Nos sources confidentielles au sein des services de renseignement ont confirmé que l'assassinat a été un succès ! Les forces de sécurité sont en pleine effervescence, mais nos agents ont réussi à s'échapper sans encombre vers notre site secret."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_7:0 "Nos agents ont rapidement réussi à se faire passer pour des membres de factions militantes d'extrême gauche locales et ont recruté des agents locaux de confiance pour mener une attaque terroriste sous faux pavillon dans le pays cible. Cela a eu pour effet escompté de réduire le soutien dont bénéficie la gauche dans ce pays."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_8:0 "Une fois déployée, l'escouade a pu entrer en contact avec des éléments d'extrême droite locaux liés à l'opération Gladio et les informer de leur rôle dans le lancement d'une attaque contre des éléments d'extrême gauche locaux. L'attaque a été menée rapidement avec le soutien de l'escouade et a réussi à causer des dégâts aux infrastructures du parti de gauche."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_9:0 "Nos agents ont rapidement pu entrer en contact avec des partisans locaux de l'opération Gladio, qui sont également membres de groupes d'extrême droite. Grâce à ses contacts locaux d'extrême droite, l'équipe a réussi à provoquer une réaction violente de la part des partisans locaux de gauche, ce qui a débouché sur une véritable émeute."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_10:0 "À l'issue de diverses négociations avec des acteurs économiques locaux et des responsables de partis, nos agents ont réussi à mettre en place un circuit de financement permettant de blanchir de l'argent par le biais d'entreprises locales légitimes afin de financer des partis pro-américains. Il s'agit là d'une avancée majeure pour la promotion de la stabilité politique."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_11:0 "Nos efforts pour trouver des candidats susceptibles d'être soudoyés ont porté leurs fruits, ce qui nous a permis de renforcer notre infiltration au sein du gouvernement du pays cible. Les agents de l'équipe ont réussi à approcher discrètement divers responsables politiques et administratifs et à les rallier à notre cause, tout en leur offrant une compensation financière."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_12:0 "L'équipe a pris contact en secret avec divers agents des services de renseignement de rang subalterne et intermédiaire dans le pays cible, identifiés comme ayant des sympathies pro-américaines. Les renseignements se sont avérés exacts et plusieurs nouveaux contacts ont été établis avec les services de renseignement de ce pays."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_13:0 "Après avoir consacré beaucoup de temps à la recherche et à l'enquête sur les cibles désignées, l'équipe a constitué des dossiers très complets sur ces personnes. Ces dossiers contiennent des allégations allant de délits financiers à des relations extraconjugales, en passant par des activités homosexuelles."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_14:0 "Après un examen approfondi, l'équipe a rassemblé les informations nécessaires à nos analystes pour élaborer une stratégie visant à faire avancer le projet de renversement du régime dans le pays cible. Une fois cette étape franchie, nous devrons désigner le chef du coup d'État et nous assurer que le complot bénéficie d'un soutien suffisant pour aboutir."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_15:0 "Après avoir examiné plusieurs candidats, voici la liste des dirigeants potentiels pour ce poste : lequel devrions-nous soutenir pour qu'il prenne la tête du gouvernement ?"
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_16:0 "Le groupe a rapidement réussi à provoquer divers incidents à travers le pays visé et à semer le chaos, présentant ainsi le gouvernement comme faible et incapable de lutter efficacement contre la menace terroriste. De plus, nos amis des médias ont encore attisé les tensions en accusant le gouvernement de complicité dans les événements récents."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_17:0 "Après avoir confronté des personnalités du gouvernement sur lesquelles nous détenions des informations compromettantes, les personnes visées ont accepté nos exigences et se sont engagées à soutenir nos futures initiatives dans le pays, ce qui a considérablement renforcé nos efforts dans le cadre du projet de changement de régime en cours."
 PHASE_3_Operation_DESC_GLADIO_SUCCESS_18:0 "Grâce à la collaboration d'une multitude de partenaires, d'agents et de sympathisants locaux, le groupe a pu rapidement prendre pied dans la capitale dès le début de l'opération. Cela a permis l'arrestation rapide de personnalités de premier plan du gouvernement et le ralliement des forces armées à la cause du nouveau gouvernement."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_1:0 "Nos agents ont réussi à agrandir les caches d'armes locales sans attirer l'attention, en particulier celle des agents communistes et des forces de l'ordre. Des collaborateurs locaux de confiance ont été informés de cette extension et des modalités d'accès aux armes en cas d'urgence avant que l'équipe ne retourne dans un site secret de la CIA en vue de son exfiltration."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_2:0 "Malheureusement, nos agents ont été aperçus alors qu'ils quittaient les lieux où étaient dissimulées les caches d'armes, attirant ainsi l'attention des forces de l'ordre locales. Bien que nos agents aient réussi à échapper aux forces de l'ordre, plusieurs de nos caches d'armes ont été découvertes et saisies par le gouvernement. De même, une surveillance accrue des caches d'armes rendra certainement ce genre d'opérations plus difficiles."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_3:0 "ESPACE RÉSERVÉ IGNORER"
 PHASE_3_Operation_DESC_GLADIO_FAILURE_4:0 "Malheureusement, notre tentative d'assassinat contre le général [?slot_one_personnel_target.GetName] a échoué, car nos agents ont tué par erreur l'aide de camp du général. Certains agents ont réussi à s'échapper, mais plusieurs ont été capturés par les forces de sécurité."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_5:0 "Malheureusement, notre tentative d'assassinat contre l'amiral [?slot_one_personnel_target.GetName] a échoué, car nos agents ont tué par erreur l'aide de camp de l'amiral. Certains agents ont réussi à s'échapper, mais plusieurs ont été capturés par les forces de sécurité."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_6:0 "Malheureusement, notre tentative d'assassinat contre un militant de gauche de renom a échoué, nos agents ayant tué par erreur un simple civil à sa place. Certains collaborateurs locaux ont réussi à s'échapper, mais plusieurs ont été capturés par les forces de sécurité."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_7:0 "Une fois sur place, l'escouade a pu entrer en contact avec des éléments d'extrême droite locaux liés à l'opération Gladio et les informer de leur rôle dans le lancement d'une attaque contre des éléments d'extrême gauche locaux. Cependant, la police a réussi à appréhender nos collaborateurs juste avant que l'attaque n'ait lieu, ce qui a contraint l'escouade à battre précipitamment en retraite."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_8:0 "Malheureusement, bien que nos agents aient réussi à semer un chaos considérable au niveau local, aucune des deux parties n'a ouvertement recouru à la violence, ce qui a fait de cette opération un échec partiel. Alors que les éléments d'extrême droite locaux ont été encouragés à provoquer les partisans de gauche, l'extrême gauche n'a pas envenimé la situation ni riposté, empêchant ainsi l'éclatement d'une émeute."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_9:0 "Malheureusement, bien que nos agents aient réussi à trouver des informations fiables et des collaborateurs dans la région, ces derniers ont été arrêtés pour des délits connexes, ce qui a entraîné l'échec de l'opération. Heureusement, nos agents ont pour la plupart réussi à s'échapper sans trop de dommages."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_10:0 "Au début, nos agents ont réussi à établir des contacts dans le cadre de l'opération. Malheureusement, les forces de l'ordre locales ont découvert le stratagème et ont mis en examen des entrepreneurs locaux qui collaboraient à l'opération. Même si nous veillerons à leur libération rapide dans la mesure du possible, cela n'en reste pas moins un échec pour l'opération."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_11:0 "Au départ, nos agents avaient réussi à identifier plusieurs responsables politiques susceptibles d'être corrompus. Malheureusement, nos efforts se sont heurtés à une opération d'infiltration visant à mettre au jour la corruption au sein du gouvernement, ce qui a entraîné l'échec de l'opération. Heureusement, tous les agents ont pu être évacués en toute sécurité et dans les délais impartis."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_12:0 "L'équipe a pris contact en secret avec divers agents des services de renseignement de rang subalterne ou intermédiaire dans le pays cible, identifiés comme ayant des sympathies pro-américaines. Malheureusement, nos renseignements se sont révélés erronés, ce qui a contraint nos agents à prendre la fuite précipitamment pour échapper aux forces de l'ordre locales, entraînant ainsi l'échec de l'opération."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_13:0 "Après avoir consacré beaucoup de temps à la recherche et à l'enquête sur les cibles désignées, l'équipe n'a pas réussi à mettre la main sur des éléments de chantage crédibles. Il reste à déterminer si cet échec est dû à un manquement des services de renseignement, à l'incompétence de l'équipe ou au fait que les cibles en question sont relativement irréprochables."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_14:0 "ESPACE RÉSERVÉ IGNORER"
 PHASE_3_Operation_DESC_GLADIO_FAILURE_15:0 "Après un examen approfondi, aucun des candidats auditionnés n'était en mesure de satisfaire à nos critères préalables pour que nous puissions soutenir leur leadership après un coup d'État réussi."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_16:0 "Bien que nos forces aient réussi à provoquer quelques incidents dans le pays cible, l'opinion publique est restée plutôt indifférente à la situation. Pour aggraver les choses, les médias, malgré nos efforts, n'ont pas relayé l'information et le gouvernement n'a pour l'instant pas été affecté par nos tentatives de déstabiliser la situation politique."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_17:0 "Malheureusement, après avoir confronté diverses personnalités sur lesquelles nous détenions des informations compromettantes, les personnes visées ont pour la plupart refusé de se plier à nos exigences. Il s'agit là d'un revers majeur pour notre programme, qui risque de voir nos plans dévoilés aux hauts responsables du gouvernement."
 PHASE_3_Operation_DESC_GLADIO_FAILURE_18:0 "Malheureusement, le gouvernement avait été prévenu à l'avance du coup d'État imminent, ce qui a empêché les conspirateurs de prendre le contrôle de l'armée ou d'arrêter des membres clés du gouvernement. Si l'équipe a réussi à s'extraire du pays pratiquement indemne, nous avons perdu plusieurs collaborateurs et nos capacités en matière de renseignement en pâtiront certainement."
 PHASE_1_Operation_DESC_GLADIO_1:0 "Les analystes de la CIA identifieront les personnes-clés à recruter au sein de la cible. Une fois cette étape franchie, nos agents prendront contact avec ces personnes."
 PHASE_1_Operation_DESC_GLADIO_2:0 "Avant d'étendre nos stocks d'armes actuels, nos agents évalueront d'abord l'état de nos stocks actuels à travers le pays afin de déterminer la marche à suivre."
 PHASE_1_Operation_DESC_GLADIO_3:0 "En vue du soulèvement national, l'escouade prendra contact avec les responsables régionaux pour leur communiquer leurs ordres et toute autre information nécessaire."
 PHASE_1_Operation_DESC_GLADIO_4:0 "Nos agents commenceront par surveiller les activités quotidiennes et l'entourage de la cible afin d'affiner notre suivi et d'augmenter les chances de réussite de l'opération."
 PHASE_1_Operation_DESC_GLADIO_5:0 "Nos agents commenceront par surveiller les activités quotidiennes et l'entourage de la cible afin d'affiner notre suivi et d'augmenter les chances de réussite de l'opération."
 PHASE_1_Operation_DESC_GLADIO_6:0 "Nos agents commenceront par surveiller les activités quotidiennes et l'entourage de la cible afin d'affiner notre suivi et d'augmenter les chances de réussite de l'opération."
 PHASE_1_Operation_DESC_GLADIO_7:0 "L'équipe examinera les informations concernant les groupes militants d'extrême gauche locaux afin de déterminer la meilleure façon de dissimuler l'identité des auteurs et de donner plus de crédibilité à l'attaque."
 PHASE_1_Operation_DESC_GLADIO_8:0 "L'équipe prendra contact avec des éléments d'extrême droite locaux liés à l'opération Gladio et sollicitera leur coopération pour mener une attaque terroriste."
 PHASE_1_Operation_DESC_GLADIO_9:0 "L'équipe va analyser le contexte politique local afin de déterminer quels acteurs seront les plus faciles à pousser à s'engager dans des affrontements de rue ouverts."
 PHASE_1_Operation_DESC_GLADIO_10:0 "Les membres de l'équipe prendront discrètement contact avec des responsables du parti proches de notre gouvernement afin de déterminer la meilleure façon de transférer des fonds à leur parti politique."
 PHASE_1_Operation_DESC_GLADIO_11:0 "L'équipe, en collaboration avec les analystes de l'Agence, dressera une liste des membres du gouvernement du pays cible susceptibles d'être convaincus, moyennant une compensation, de se rallier à Washington."
 PHASE_1_Operation_DESC_GLADIO_12:0 "L'équipe, en collaboration avec les analystes de l'Agence, passera en revue nos contacts actuels au sein des services de renseignement du pays cible afin de définir un point de départ."
 PHASE_1_Operation_DESC_GLADIO_13:0 "L'équipe s'infiltrera sous couverture dans le pays cible et recueillera des informations sur les personnalités du gouvernement actuel susceptibles d'être compromises."
 PHASE_1_Operation_DESC_GLADIO_14:0 "Alors que le projet de changement de régime démarre, l'équipe évaluera la situation sur le terrain et planifiera la suite de l'opération visant à affaiblir le gouvernement en vue d'un coup d'État."
 PHASE_1_Operation_DESC_GLADIO_15:0 "Les analystes de l'Agence examineront les candidats appropriés au poste de nouveau dirigeant du gouvernement de la cible, tout en s'efforçant de trouver un équilibre entre légitimité internationale et références anticommunistes."
 PHASE_1_Operation_DESC_GLADIO_16:0 "Dans un premier temps, nos agents passeront en revue l'histoire du terrorisme et des conflits dans la zone cible et s'en serviront pour mettre au point un incident de nature à attiser les tensions."
 PHASE_1_Operation_DESC_GLADIO_17:0 "Nos agents récupéreront les éléments compromettants que l'Agence a rassemblés sur nos cibles et détermineront la marche à suivre quant aux personnes à contacter et à celles qui seront les plus susceptibles de se plier à nos exigences."
 PHASE_1_Operation_DESC_GLADIO_18:0 "L'équipe se rendra dans les réseaux opérationnels locaux et chez nos partenaires afin de s'assurer du soutien nécessaire à l'opération et de mobiliser nos sympathisants en vue de l'opération à venir."
 PHASE_2_Operation_DESC_GLADIO_1:0 "Nos agents s'installeront discrètement dans les grandes villes du pays, puis mettront à profit nos contacts au sein des forces sympathisantes pour entrer en contact avec des recrues potentielles."
 PHASE_2_Operation_DESC_GLADIO_2:0 "Après un examen approfondi, nos agents se rendront sur les sites des caches d'armes et renfloueront les stocks d'armement de ces dernières. Des agents locaux de confiance seront également informés de ces améliorations."
 PHASE_2_Operation_DESC_GLADIO_3:0 "L'équipe s'infiltrera discrètement dans la zone cible et rencontrera différentes cellules de la résistance afin de remonter le moral des troupes et d'affiner les plans en vue du soulèvement."
 PHASE_2_Operation_DESC_GLADIO_4:0 "L'équipe suivra les déplacements du général tout au long de la journée et analysera son emploi du temps quotidien afin d'élaborer différentes stratégies pour frapper la cible."
 PHASE_2_Operation_DESC_GLADIO_5:0 "L'équipe suivra les déplacements de l'amiral tout au long de la journée et analysera son emploi du temps quotidien afin d'élaborer différentes stratégies pour frapper la cible."
 PHASE_2_Operation_DESC_GLADIO_6:0 "L'équipe suivra les déplacements de la cible tout au long de la journée et analysera son emploi du temps quotidien afin d'élaborer différentes stratégies pour frapper la cible."
 PHASE_2_Operation_DESC_GLADIO_7:0 "Les membres de l'équipe et leurs collaborateurs locaux élaboreront une stratégie visant à rejeter autant que possible la responsabilité sur les forces de gauche du pays, tout en évitant de révéler l'identité des véritables auteurs de l'attaque."
 PHASE_2_Operation_DESC_GLADIO_8:0 "Une fois le soutien local obtenu, l'équipe distribuera des armes à nos collaborateurs et élaborera une stratégie pour lancer l'attaque."
 PHASE_2_Operation_DESC_GLADIO_9:0 "Nos agents s'efforceront activement de pousser les deux camps à en venir aux mains en organisant des bagarres mineures, des actes de vandalisme et des agressions de part et d'autre, tout en faisant porter la responsabilité de ces incidents à l'autre camp."
 PHASE_2_Operation_DESC_GLADIO_10:0 "Afin de dissimuler l'origine des fonds destinés au parti, nos agents rechercheront des collaborateurs locaux propriétaires d'entreprises pour mettre en place des sociétés écrans servant au blanchiment d'argent, dans le but d'acheminer ces fonds vers le parti."
 PHASE_2_Operation_DESC_GLADIO_11:0 "Les cibles identifiées feront l'objet d'une surveillance afin de s'assurer qu'elles n'ont aucun lien connu avec l'extrême gauche et qu'elles ne risquent pas de compromettre nos opérations à long terme."
 PHASE_2_Operation_DESC_GLADIO_12:0 "En s'appuyant sur les informations recueillies au préalable, l'équipe établira une liste de cibles potentielles à contacter au sein des services de renseignement de la cible afin de les recruter pour le programme."
 PHASE_2_Operation_DESC_GLADIO_13:0 "Les personnes visées dans la liste provisoire feront l'objet d'une enquête approfondie visant à mettre au jour d'éventuels comportements sexuels déviants, relations extraconjugales et autres infractions pénales susceptibles de servir de base à un chantage."
 PHASE_2_Operation_DESC_GLADIO_14:0 "Les chefs militaires, les ministres pro-américains et les collaborateurs locaux seront recherchés par l'équipe et interrogés afin d'évaluer leur loyauté dans le cadre de nos projets en cours."
 PHASE_2_Operation_DESC_GLADIO_15:0 "L'équipe rencontrera les candidats en toute discrétion afin de se faire une idée plus précise de leur personnalité et de leurs positions sur divers sujets liés à notre lutte contre le communisme."
 PHASE_2_Operation_DESC_GLADIO_16:0 "Une fois la stratégie optimale définie, nos agents, en collaboration avec des agents locaux, mèneront une attaque terroriste afin d'exacerber les tensions au niveau national et d'affaiblir davantage le gouvernement."
 PHASE_2_Operation_DESC_GLADIO_17:0 "Notre équipe s'approchera discrètement des cibles et leur communiquera les détails des activités illicites dont nous avons des preuves, tout en leur signifiant notre exigence de garder le silence."
 PHASE_2_Operation_DESC_GLADIO_18:0 "Nos agents et nos sympathisants, en collaboration avec l'escouade, s'efforceront de prendre rapidement le contrôle total de l'appareil militaire afin de paralyser et de neutraliser toute riposte du gouvernement."
 PHASE_3_Operation_DESC_GLADIO_1:0 "Une fois les recrues contactées, notre équipe retournera à la base pour examiner les références des personnes contactées et déterminer la meilleure façon de développer nos activités locales."
 PHASE_3_Operation_DESC_GLADIO_2:0 "Enfin, nos agents s'efforceront de brouiller les pistes en améliorant les déguisements et les cachettes avant de se retirer discrètement et d'échapper aux forces de l'ordre locales."
 PHASE_3_Operation_DESC_GLADIO_3:0 "Après avoir informé la hiérarchie et rallié les troupes, notre équipe mettra au point la stratégie et les plans des opérations de résistance, puis regagnera Washington en toute discrétion."
 PHASE_3_Operation_DESC_GLADIO_4:0 "Après avoir mis au point un plan visant à réduire au minimum les victimes collatérales et à éviter toute exposition, l'équipe procédera à l'assassinat de la cible, puis se retirera discrètement vers un site secret sécurisé."
 PHASE_3_Operation_DESC_GLADIO_5:0 "Après avoir mis au point un plan visant à réduire au minimum les victimes collatérales et à éviter toute exposition, l'équipe procédera à l'assassinat de la cible, puis se retirera discrètement vers un site secret sécurisé."
 PHASE_3_Operation_DESC_GLADIO_6:0 "Après avoir mis en place un plan visant à réduire au minimum les victimes civiles collatérales et à éviter toute exposition, l'équipe procédera à l'assassinat de la cible, puis se retirera discrètement vers un site secret sécurisé."
 PHASE_3_Operation_DESC_GLADIO_7:0 "Le groupe, en collaboration avec des sympathisants et des partenaires locaux, va mener une attaque terroriste contre le gouvernement afin de saper la crédibilité et le soutien dont bénéficient les forces de gauche."
 PHASE_3_Operation_DESC_GLADIO_8:0 "Le groupe, en collaboration avec des sympathisants et des complices locaux, lancera une attaque terroriste contre des éléments de gauche dans le pays, ce qui ne fera qu'exacerber les tensions nationales."
 PHASE_3_Operation_DESC_GLADIO_9:0 "On fera appel à des collaborateurs locaux pour encourager les manifestations contre les violences actuelles, dans le but d'inciter les deux camps à s'affronter ouvertement dans la rue lors de ces manifestations."
 PHASE_3_Operation_DESC_GLADIO_10:0 "Les agents, en collaboration avec les membres du parti au courant de la situation, veilleront à ce que les fonds nécessaires soient débloqués afin de renforcer leur position politique face aux forces de gauche, tout en limitant au maximum leur exposition."
 PHASE_3_Operation_DESC_GLADIO_11:0 "L'équipe prendra contact avec les cibles et leur proposera des compensations financières et autres afin de les inciter à s'aligner sur Washington, dans le but de renforcer son influence au sein du gouvernement de la cible."
 PHASE_3_Operation_DESC_GLADIO_12:0 "L'équipe s'approchera discrètement de la cible et sollicitera sa collaboration dans le cadre de nos efforts continus visant à protéger l'Europe occidentale de la menace soviétique."
 PHASE_3_Operation_DESC_GLADIO_13:0 "Une fois l'enquête terminée, nos agents rassembleront les informations recueillies dans des dossiers consacrés aux personnes visées, en vue d'une utilisation future."
 PHASE_3_Operation_DESC_GLADIO_14:0 "Une fois les entretiens terminés, l'équipe déterminera quelles seront les prochaines étapes et les conditions nécessaires à la réussite du changement de régime."
 PHASE_3_Operation_DESC_GLADIO_15:0 "Une fois que l'équipe aura présenté ses conclusions, le Conseil de sécurité nationale désignera le candidat à soutenir lors du prochain coup d'État."
 PHASE_3_Operation_DESC_GLADIO_16:0 "Nos spécialistes des médias vont activement manipuler les médias nationaux et internationaux afin de saper le soutien dont bénéficie le gouvernement au lendemain de l'attaque."
 PHASE_3_Operation_DESC_GLADIO_17:0 "Une fois la confrontation initiale passée, l'équipe s'assurera que les cibles soutiendront nos prochaines actions contre le gouvernement et suivront notre ligne dans les mois à venir."
 PHASE_3_Operation_DESC_GLADIO_18:0 "Une fois l'armée neutralisée, nos forces et nos alliés chercheront à prendre le contrôle total du gouvernement et à capturer les principaux dirigeants et ministres de celui-ci."
 OPERATION_NATION_DESC_351:0 "Événement : §YRecrutement d'agents de Gladio à [?black_ops_team_history_entries_flags^i.GetName]§!"
 OPERATION_NATION_DESC_352:0 "Événement : §YLes caches d'armes se sont multipliés à [?black_ops_team_history_entries_flags^i.GetName]§!"
 OPERATION_NATION_DESC_353:0 "Événement : §YSoulèvement national déclenché à [?black_ops_team_history_entries_flags^i.GetName]§!"
