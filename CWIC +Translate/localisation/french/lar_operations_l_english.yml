 HISTORY_ENTRY:0 "[GetSquadHistoryTooltip]"
 PHASE_1_Operation_DESC_GENERIC_1:0 "Afin de renforcer notre sécurité nationale et notre position géopolitique, nos services de renseignement ont proposé d'infiltrer le [?generic_operations_selected_target.GetName] afin de lancer des opérations de collecte de renseignements et d'espionnage."
 PHASE_2_Operation_DESC_GENERIC_1:0 "Nous allons donner suite aux propositions visant à construire un « site secret » à [?generic_operations_selected_target.GetName]. Les travaux débuteront immédiatement, sous la direction de notre ambassade."
 PHASE_3_Operation_DESC_GENERIC_1:0 "Maintenant que les opérations ont été approuvées et que le site secret a été construit dans le [?generic_operations_selected_target.GetName], nous allons commencer à déployer notre personnel de renseignement et nos experts afin de lancer les opérations de collecte d'informations et de renseignement."
 PHASE_1_Operation_DESC_GENERIC_2:0 "Nos agents procéderont tout d'abord à une vérification et à un examen approfondis du réseau de renseignement de [?generic_operations_selected_target.GetName] afin d'en déterminer les fonctionnalités actuelles, les faiblesses et les points à améliorer."
 PHASE_2_Operation_DESC_GENERIC_2:0 "Nos agents sur le terrain proposeront des rémunérations en espèces ou des avantages aux personnes locales travaillant dans des zones sensibles, telles que les concierges et le personnel d'entretien, afin qu'elles nous informent des mouvements de l'ennemi et nous permettent ainsi d'étendre notre réseau"
 PHASE_3_Operation_DESC_GENERIC_2:0 "Enfin, nous veillerons à ce que le réseau soit à l'abri de toute ingérence des services de sécurité en mettant en place une couverture adéquate, en garantissant l'anonymat et en recourant à des tactiques de contre-espionnage afin de nous assurer de ne jamais être pris."
 PHASE_1_Operation_DESC_GENERIC_3:0 "Dans un premier temps, nous allons recueillir davantage d'informations sur le général [?selected_operation_personnel_target.GetName], notamment sur ses responsabilités militaires et ses liens familiaux, ainsi que sur d'éventuels éléments susceptibles de faire l'objet d'un chantage."
 PHASE_2_Operation_DESC_GENERIC_3:0 "Il faudra ensuite suivre les déplacements du général [?selected_operation_personnel_target.GetName] au cours d'une journée type, afin de trouver le moment opportun pour l'éliminer."
 PHASE_3_Operation_DESC_GENERIC_3:0 "Le moment est venu. Nos agents vont neutraliser [?selected_operation_personnel_target.GetName] alors qu'il se rendra à son travail ; ils se réfugieront ensuite dans notre site secret, où un débriefing sera organisé."
 PHASE_1_Operation_DESC_GENERIC_4:0 "Dans un premier temps, nous allons recueillir davantage d'informations sur l'amiral [?selected_operation_personnel_target.GetName], notamment sur ses responsabilités militaires et ses liens familiaux, ainsi que sur d'éventuels éléments susceptibles de faire l'objet d'un chantage."
 PHASE_2_Operation_DESC_GENERIC_4:0 "Il faudra ensuite suivre les déplacements de l'amiral [?selected_operation_personnel_target.GetName] au cours d'une journée type, afin de trouver le moment opportun pour l'éliminer."
 PHASE_3_Operation_DESC_GENERIC_4:0 "Le moment est venu. Nos agents vont neutraliser [?selected_operation_personnel_target.GetName] alors qu'il se rendra à son travail ; ils se réfugieront ensuite dans notre site secret, où un débriefing sera organisé."
 PHASE_1_Operation_DESC_GENERIC_5:0 "Avant de lancer toute opération, nos agents doivent infiltrer le programme et évaluer son état d'avancement afin de déterminer le degré de menace qu'il représente pour notre position géopolitique."
 PHASE_2_Operation_DESC_GENERIC_5:0 "Nos agents examineront ensuite le dispositif de sécurité entourant le programme nucléaire, afin d'identifier les failles et de déterminer les moyens de recueillir des renseignements exploitables sur les capacités nucléaires."
 PHASE_3_Operation_DESC_GENERIC_5:0 "Enfin, une fois infiltrés dans le programme nucléaire, nos agents voleront ou détruiront des documents essentiels, notamment des rapports et des données sur l'avancement du programme, afin d'en paralyser le déroulement."
 PHASE_1_Operation_DESC_GENERIC_6:0 "Nos agents vont commencer à surveiller la sécurité et les opérations du site nucléaire situé à [?selected_operation_personnel_target.GetName], afin de déterminer la meilleure méthode d'attaque."
 PHASE_2_Operation_DESC_GENERIC_6:0 "Nos agents exploiteront ensuite les failles de sécurité critiques du site nucléaire [?selected_operation_personnel_target.GetName] pour s'infiltrer dans les installations, en se faisant passer pour des techniciens."
 PHASE_3_Operation_DESC_GENERIC_6:0 "Enfin, nos agents se mettront à l'œuvre pour détruire les infrastructures du site, notamment les centrifugeuses et les cyclotrons, ainsi que les zones de confinement, afin de mettre un terme aux progrès en matière de développement nucléaire."
 PHASE_1_Operation_DESC_GENERIC_7:0 "Nos agents vont commencer à surveiller la sécurité et les opérations de l'aérodrome de [?selected_operation_personnel_target.GetName], afin de déterminer la meilleure stratégie d'attaque."
 PHASE_2_Operation_DESC_GENERIC_7:0 "Nos agents exploiteront ensuite les failles de sécurité critiques de la base aérienne [?selected_operation_personnel_target.GetName] pour s'infiltrer dans les locaux, en se faisant passer pour des membres de l'équipe de maintenance."
 PHASE_3_Operation_DESC_GENERIC_7:0 "Enfin, nos agents s'emploieront à endommager les avions, le matériel de réparation, les véhicules et les hangars, afin de paralyser les opérations aériennes de cette base."
 PHASE_1_Operation_DESC_GENERIC_8:0 "Nos agents vont commencer à surveiller la sécurité et les opérations du complexe de production militaire situé à [?selected_operation_personnel_target.GetName], afin de déterminer la meilleure stratégie d'attaque."
 PHASE_2_Operation_DESC_GENERIC_8:0 "Nos agents exploiteront ensuite les failles de sécurité critiques de la base aérienne [?selected_operation_personnel_target.GetName] pour s'infiltrer dans les locaux en se faisant passer pour des employés."
 PHASE_3_Operation_DESC_GENERIC_8:0 "Enfin, nos agents se mettront à l'œuvre pour endommager les équipements de production, notamment les chaînes de montage de véhicules, d'armes légères et d'aéronefs."
 PHASE_1_Operation_DESC_GENERIC_9:0 "Nos agents vont commencer à surveiller la sécurité et les opérations du chantier naval de [?selected_operation_personnel_target.GetName], afin de déterminer la meilleure stratégie d'attaque."
 PHASE_2_Operation_DESC_GENERIC_9:0 "Nos agents exploiteront ensuite les failles de sécurité critiques de la base aérienne [?selected_operation_personnel_target.GetName] pour s'infiltrer dans les installations, en se faisant passer pour des dockers."
 PHASE_3_Operation_DESC_GENERIC_9:0 "Enfin, nos agents se mettront à l'œuvre pour endommager les infrastructures, notamment les quais, les jetées et les installations de défense côtière."
 PHASE_1_Operation_DESC_GENERIC_10:0 "Nos agents vont commencer à surveiller la sécurité et les opérations du port de [?selected_operation_personnel_target.GetName], afin de déterminer la meilleure stratégie d'attaque."
 PHASE_2_Operation_DESC_GENERIC_10:0 "Nos agents exploiteront ensuite les failles de sécurité critiques de la base aérienne [?selected_operation_personnel_target.GetName] pour s'infiltrer dans les installations, en se faisant passer pour des dockers."
 PHASE_3_Operation_DESC_GENERIC_10:0 "Enfin, nos agents s'emploieront à endommager les installations portuaires, notamment les grues, les équipements de manutention et les entrepôts."
 PHASE_1_Operation_DESC_GENERIC_11:0 "Nos agents vont commencer à surveiller la sécurité et les opérations de l'usine située à [?selected_operation_personnel_target.GetName], afin de déterminer la meilleure stratégie d'attaque."
 PHASE_2_Operation_DESC_GENERIC_11:0 "Nos agents exploiteront ensuite les failles de sécurité critiques de l'usine [?selected_operation_personnel_target.GetName] pour s'infiltrer dans les locaux, en se faisant passer pour des ouvriers."
 PHASE_3_Operation_DESC_GENERIC_11:0 "Enfin, nos agents s'emploieront à endommager le matériel de production, notamment les machines, les équipements de contrôle qualité et les documents administratifs."
 PHASE_1_Operation_DESC_GENERIC_12:0 "Nos agents vont commencer à surveiller la sécurité et le fonctionnement de l'infrastructure située à [?selected_operation_personnel_target.GetName], afin de déterminer la meilleure méthode d'attaque."
 PHASE_2_Operation_DESC_GENERIC_12:0 "Nos agents se procureront et assembleront les engins explosifs appropriés afin de causer un maximum de dégâts."
 PHASE_3_Operation_DESC_GENERIC_12:0 "Enfin, nos agents s'infiltreront dans les infrastructures et placeront des explosifs à des endroits stratégiques afin de causer un maximum de dégâts et de pertes humaines."
 PHASE_1_Operation_DESC_GENERIC_13:0 "Nos agents vont effectuer une reconnaissance de la cible située à [GET_BLACK_OPS_OPERATION_VICTORY_POINT_NAME] afin d'évaluer les niveaux de sécurité et de déterminer la marche à suivre en cas d'attaque."
 PHASE_2_Operation_DESC_GENERIC_13:0 "Nos agents vont maintenant préparer les armes légères, les explosifs plastiques et les composants nécessaires afin d'assembler les armes et les explosifs requis pour mener à bien l'attaque."
 PHASE_3_Operation_DESC_GENERIC_13:0 "Nos agents s'infiltreront sur le site dans le but de faire exploser des engins explosifs et d'affronter les forces de sécurité et les civils qui se présenteront sur place afin de causer le plus de dégâts possible."
 PHASE_1_Operation_DESC_GENERIC_14:0 "Notre agence affrétera un camion, un navire ou un avion pour acheminer notre cargaison clandestine d'armes légères, de grenades et d'explosifs plastiques vers le mouvement insurrectionnel local à [?selected_operation_personnel_target.GetName]."
 PHASE_2_Operation_DESC_GENERIC_14:0 "Nos agents commenceront alors à former les guérilleros au maniement des armes légères et à l'utilisation des explosifs, tout en surveillant les forces de sécurité locales afin d'identifier leurs points faibles."
 PHASE_3_Operation_DESC_GENERIC_14:0 "Nos agents et nos guérilleros s'infiltreront alors dans les installations et les cibles stratégiques situées au sein de [?selected_operation_personnel_target.GetName], dans le cadre de leur plan visant à déclencher un soulèvement contre le gouvernement."
 PHASE_1_Operation_DESC_GENERIC_15:0 "Nous allons envoyer certains de nos agents à [GET_BLACK_OPS_OPERATION_VICTORY_POINT_NAME] afin de prendre contact avec un groupe de résistance local dans l'espoir de former ses membres et de financer ses activités."
 PHASE_2_Operation_DESC_GENERIC_15:0 "Maintenant que nos agents ont tenté d'établir le contact, ils vont faire rapport à notre quartier général et nous tenir informés de l'avancement de leurs opérations."
 PHASE_3_Operation_DESC_GENERIC_15:0 "Lors de nos échanges avec le groupe de résistance, nous aborderons leurs objectifs et la mission générale qui sous-tend leurs activités, afin de coordonner notre contribution à cet effort."
 PHASE_1_Operation_DESC_GENERIC_16:0 "Nos conseillers prendront en charge les armes et les explosifs que notre agence a expédiés précédemment, afin de s'assurer que nous disposons du matériel adéquat pour cette mission."
 PHASE_2_Operation_DESC_GENERIC_16:0 "Nos conseillers vont désormais dispenser des formations discrètes axées sur la sécurité des armes à feu, les compétences nécessaires et le tir de précision."
 PHASE_3_Operation_DESC_GENERIC_16:0 "En guise de test final, nos conseillers mettront en place un exercice de grande envergure et exigeant pour la résistance locale, afin que celle-ci puisse faire ses preuves et démontrer qu'elle est à la hauteur de la tâche."
 PHASE_1_Operation_DESC_GENERIC_17:0 "Notre agence mènera une étude du terrain et de la situation sécuritaire à [GET_BLACK_OPS_OPERATION_VICTORY_POINT_NAME] afin de déterminer la quantité adéquate d'armes légères et d'explosifs à fournir à la résistance locale."
 PHASE_2_Operation_DESC_GENERIC_17:0 "Nos agents largueront ensuite les armes et le matériel à l'aide d'un avion affrété, qui survolera une zone désignée pendant la nuit afin d'échapper aux forces de sécurité."
 PHASE_3_Operation_DESC_GENERIC_17:0 "Une fois les livraisons reçues, nos agents intégrés veilleront à ce que chaque avion de combat dispose des munitions et du matériel nécessaires pour garantir sa capacité opérationnelle."
 PHASE_1_Operation_DESC_GENERIC_18:0 "Tout d'abord, nos agents seront parachutés à [GET_BLACK_OPS_OPERATION_VICTORY_POINT_NAME], où ils seront récupérés à un point de rendez-vous par des membres du groupe de résistance local auquel ils seront intégrés."
 PHASE_2_Operation_DESC_GENERIC_18:0 "Maintenant que nos agents sont sur le terrain, nous veillerons à établir des contacts appropriés avec les chefs de groupe et de cellule afin que notre agence et nos conseillers puissent rester en contact avec les principaux dirigeants de la résistance."
 PHASE_3_Operation_DESC_GENERIC_18:0 "Nos conseillers se concerteront ensuite avec les chefs de la résistance afin de constituer des cellules et des unités spécialement conçues pour mener des opérations ponctuelles ou des actions de sabotage."
 PHASE_1_Operation_DESC_GENERIC_19:0 "Nos agents seront parachutés sur le territoire de [GET_BLACK_OPS_OPERATION_VICTORY_POINT_NAME] afin de s'infiltrer au sein des groupes de résistance et de garantir la sécurité de leurs activités de contre-espionnage."
 PHASE_2_Operation_DESC_GENERIC_19:0 "Nos agents et conseillers prendront les mesures nécessaires pour garantir l'efficacité des dispositifs de sécurité du groupe de résistance, notamment en ce qui concerne leur localisation et leurs actions."
 PHASE_3_Operation_DESC_GENERIC_19:0 "Nos agents et les chefs de la résistance surveilleront les forces de sécurité, dans le but de leur échapper et d'empêcher que le groupe de résistance ne soit découvert."
 PHASE_1_Operation_DESC_GENERIC_20:0 "Nos agents mettront sur pied une équipe de voleurs chevronnés, composée d'experts en sécurité, de spécialistes du déguisement et de personnel local, afin de dérober des technologies sensibles appartenant à [local_possible_operations_personnel_target]."
 PHASE_2_Operation_DESC_GENERIC_20:0 "Avec l'aide de nos nouvelles recrues, nos agents surveilleront le site où se trouve la technologie, afin de dérober des cartes d'identité et d'autres documents qui leur permettront de s'infiltrer et de s'emparer de cette technologie."
 PHASE_3_Operation_DESC_GENERIC_20:0 "Avec leur nouvelle équipe, nos agents et assistants s'introduiront dans les locaux, voleront [local_possible_operations_personnel_target] et d'autres documents sensibles avant de se réfugier dans un lieu sûr."
 PHASE_1_Operation_DESC_GENERIC_21:0 "Nos services de renseignement et de sécurité procéderont immédiatement à une évaluation des menaces pesant sur notre gouvernement, en mettant l'accent sur les militants violents ainsi que sur les étudiants et les intellectuels."
 PHASE_2_Operation_DESC_GENERIC_21:0 "Nos agents concentreront ensuite leurs efforts sur la localisation précise des groupes de résistance, en ciblant leurs chefs et les principales menaces pour la stabilité du gouvernement."
 PHASE_3_Operation_DESC_GENERIC_21:0 "Enfin, le point culminant de notre opération aura lieu lorsque nos agents et nos forces de sécurité, agissant sur la base de renseignements, mèneront un raid et arrêteront ou neutraliseront ces membres de la résistance, garantissant ainsi la pérennité de notre gouvernement et de notre mode de vie."
 PHASE_1_Operation_DESC_GENERIC_22:0 "Nos agents détermineront, à l'aide des cartes et des infrastructures disponibles, quelles sont les lignes ferroviaires les plus importantes et les plus vulnérables à [?generic_operations_selected_target.GetName] afin de paralyser leurs capacités de transport et de mobilisation."
 PHASE_2_Operation_DESC_GENERIC_22:0 "Nos agents sélectionneront ensuite les explosifs appropriés, en quantités suffisantes pour endommager les voies ferrées, et formeront le personnel ferroviaire, par équipes, à la manière de poser et de faire exploser ces explosifs à distance, en toute sécurité et sans se faire repérer."
 PHASE_3_Operation_DESC_GENERIC_22:0 "Enfin, nos équipes de démolition et nos agents s'infiltreront dans [?generic_operations_selected_target.GetName], en ciblant les voies ferrées les plus vulnérables, et y placeront leurs explosifs avant de s'éloigner suffisamment avant que ceux-ci n'explosent au cœur de la nuit."
 PHASE_3_Operation_DESC_GENERIC_1_SUCCESS:0 "Nos agents ont réussi à mettre en place un site secret à [?slot_one_target.GetName], où notre agence peut désormais mener des opérations et des interrogatoires à l'insu des forces de sécurité et des autorités locales."
 PHASE_3_Operation_DESC_GENERIC_2_SUCCESS:0 "Notre plan visant à renforcer le réseau de renseignement à [?slot_one_target.GetName] a été couronné de succès ! Nous avons réussi à augmenter nos effectifs et à étendre notre réseau de renseignement sans attirer l'attention des services de sécurité locaux."
 PHASE_3_Operation_DESC_GENERIC_3_SUCCESS:0 "Nos sources confidentielles au sein de l'armée ont confirmé que l'assassinat a été un succès ! Les forces de sécurité sont en pleine effervescence, mais nos agents ont réussi à s'échapper sans encombre vers notre site secret."
 PHASE_3_Operation_DESC_GENERIC_4_SUCCESS:0 "Nos sources confidentielles au sein de l'armée ont confirmé que l'assassinat a été un succès ! Les forces de sécurité sont en pleine effervescence, mais nos agents ont réussi à s'échapper sans encombre vers notre site secret."
 PHASE_3_Operation_DESC_GENERIC_5_SUCCESS:0 "Nos agents infiltrés dans le programme nucléaire ont indiqué que les premières opérations de sabotage ont été couronnées de succès et que les forces de sécurité n'ont pas connaissance d'une quelconque menace."
 PHASE_3_Operation_DESC_GENERIC_6_SUCCESS:0 "Nos agents ont fait état d'opérations de sabotage menées avec succès contre le site nucléaire de [?slot_one_personnel_target.GetName]. Les forces de sécurité n'ont pas été alertées de la présence des agents, qui ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_7_SUCCESS:0 "Nos agents ont fait état d'opérations de sabotage menées avec succès contre la base aérienne de [?slot_one_personnel_target.GetName]. Les forces de sécurité n'ont pas été alertées de la présence des agents, qui ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_8_SUCCESS:0 "Nos agents ont fait état d'opérations de sabotage menées avec succès contre le complexe de production militaire situé à [?slot_one_personnel_target.GetName]. Les forces de sécurité n'ont pas été alertées de la présence des agents, qui ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_9_SUCCESS:0 "Nos agents ont signalé avoir mené à bien des opérations de sabotage contre le chantier naval de [?slot_one_personnel_target.GetName]. Les forces de sécurité n'ont pas été alertées de la présence des agents, qui ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_10_SUCCESS:0 "Nos agents ont fait état d'opérations de sabotage menées avec succès contre le port de [?slot_one_personnel_target.GetName]. Les forces de sécurité n'ont pas été alertées de la présence des agents, qui ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_11_SUCCESS:0 "Nos agents ont signalé avoir mené à bien des opérations de sabotage contre l'usine de [?slot_one_personnel_target.GetName]. Les forces de sécurité n'ont pas été alertées de la présence des agents, qui ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_12_SUCCESS:0 "Notre opération contre les infrastructures de [?slot_one_personnel_target.GetName] a été couronnée de succès ! Nos agents ont réussi à faire exploser les charges et à prendre la fuite avant l'arrivée des forces de sécurité."
 PHASE_3_Operation_DESC_GENERIC_13_SUCCESS:0 "Notre opération contre la cible située à [?slot_one_personnel_target.GetName] s'est déroulée avec succès, et de nombreux membres des forces de sécurité ainsi que des civils ont été tués. Nos agents se sont bien battus."
 PHASE_3_Operation_DESC_GENERIC_14_SUCCESS:0 "Nos agents ont réussi à préparer les chefs de la résistance locale et leur ont dispensé une formation en vue d'un soulèvement imminent contre le gouvernement actuel à [?slot_one_personnel_target.GetName]."
 PHASE_3_Operation_DESC_GENERIC_15_SUCCESS:0 "Notre prise de contact avec le groupe de résistance de [?slot_one_personnel_target.GetName] a été couronnée de succès, et nous disposons désormais d'un réseau d'agents locaux sur lequel nous pouvons compter pour mener nos opérations ici."
 PHASE_3_Operation_DESC_GENERIC_16_SUCCESS:0 "Notre opération visant à former la résistance locale a été jugée fructueuse, car nous disposons désormais de personnel local supplémentaire pour nous aider à atteindre nos objectifs dans le pays."
 PHASE_3_Operation_DESC_GENERIC_17_SUCCESS:0 "Nos agents et conseillers peuvent confirmer que l'opération visant à armer le groupe de résistance local à [?slot_one_personnel_target.GetName] s'est déroulée avec succès et que tous les combattants sont désormais entièrement équipés pour mener leurs opérations."
 PHASE_3_Operation_DESC_GENERIC_18_SUCCESS:0 "Notre opération visant à infiltrer des conseillers au sein des groupes de résistance locaux à [?slot_one_personnel_target.GetName] a été couronnée de succès, et nous sommes désormais en mesure d'assurer des contacts suffisants avec les chefs de la résistance."
 PHASE_3_Operation_DESC_GENERIC_19_SUCCESS:0 "Notre opération visant à infiltrer des groupes de résistance et à mettre en place des mesures de contre-espionnage a été couronnée de succès, et nous avons assuré au groupe de résistance de [?slot_one_personnel_target.GetName] que ses opérations et ses actions pouvaient être menées en toute sécurité."
 PHASE_3_Operation_DESC_GENERIC_20_SUCCESS:0 "Nos agents ont réussi à dérober un équipement technologique essentiel et ont échappé aux forces de sécurité suffisamment longtemps pour ramener cet équipement en notre possession."
 PHASE_3_Operation_DESC_GENERIC_21_SUCCESS:0 "Nos services de renseignement et de sécurité ont réussi à venir à bout de la résistance, de l'insurrection et des autres menaces qui pesaient sur notre appareil gouvernemental sur ce territoire. Ces menaces ont été vaincues."
 PHASE_3_Operation_DESC_GENERIC_22_SUCCESS:0 "Nos agents et nos équipes de démolition indiquent que nous avons réussi à détruire de nombreuses lignes ferroviaires stratégiques à [?slot_one_target.GetName], ce qui a considérablement réduit leurs capacités de transport ferroviaire terrestre et leur vitesse de mobilisation en cas de guerre."
 PHASE_3_Operation_DESC_GENERIC_1_FAILURE:0 "Malheureusement, nos tentatives de mettre en place un site secret à [?slot_one_target.GetName] ont échoué, car certains de nos agents ont été démasqués par les forces de sécurité. Par mesure de sécurité, nos services de renseignement ont réduit leurs effectifs et opèrent désormais depuis le consulat situé dans la capitale."
 PHASE_3_Operation_DESC_GENERIC_2_FAILURE:0 "Malheureusement, notre projet visant à étendre notre réseau de renseignement à [?slot_one_target.GetName] a échoué. Les services de sécurité locaux se sont intéressés à nous et plusieurs informateurs ont été arrêtés et interrogés, ce qui nous a contraints à réorganiser nos agents afin d'assurer leur sécurité."
 PHASE_3_Operation_DESC_GENERIC_3_FAILURE:0 "Malheureusement, notre tentative d'assassinat contre le général [?slot_one_personnel_target.GetName] a échoué, car nos agents ont tué par erreur l'aide de camp du général. Certains agents ont réussi à s'échapper, mais plusieurs ont été capturés par les forces de sécurité."
 PHASE_3_Operation_DESC_GENERIC_4_FAILURE:0 "Malheureusement, notre tentative d'assassinat contre l'amiral [?slot_one_personnel_target.GetName] a échoué, nos agents ayant tué par erreur l'aide de camp de l'amiral à sa place. Certains agents ont réussi à s'échapper, mais plusieurs ont été capturés par les forces de sécurité."
 PHASE_3_Operation_DESC_GENERIC_5_FAILURE:0 "Malheureusement, nos agents infiltrés dans le programme nucléaire nous ont signalé que leurs premières tentatives visant à entraver les progrès en matière de développement nucléaire ont été déjouées par les forces de sécurité."
 PHASE_3_Operation_DESC_GENERIC_6_FAILURE:0 "Malheureusement, nos agents ont signalé qu'ils n'avaient pas réussi à s'infiltrer dans la centrale nucléaire de [?slot_one_personnel_target.GetName] ni à la saboter. Les forces de sécurité ont été alertées de leur présence et certains ont été capturés, même si quelques-uns ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_7_FAILURE:0 "Malheureusement, nos agents ont signalé qu'ils n'avaient pas réussi à s'infiltrer dans la base aérienne de [?slot_one_personnel_target.GetName] ni à la saboter. Les forces de sécurité ont été alertées de leur présence et certains ont été capturés, même si quelques-uns ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_8_FAILURE:0 "Malheureusement, nos agents ont signalé qu'ils n'avaient pas réussi à infiltrer et à saboter le complexe de production militaire situé à [?slot_one_personnel_target.GetName]. Les forces de sécurité ont été alertées de leur présence et certains ont été capturés, même si quelques-uns ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_9_FAILURE:0 "Malheureusement, nos agents ont signalé qu'ils n'avaient pas réussi à s'infiltrer dans le chantier naval de [?slot_one_personnel_target.GetName] pour le saboter. Les forces de sécurité ont été alertées de leur présence et certains ont été capturés, même si quelques-uns ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_10_FAILURE:0 "Malheureusement, nos agents ont signalé qu'ils n'avaient pas réussi à s'infiltrer dans le port de [?slot_one_personnel_target.GetName] pour le saboter. Les forces de sécurité ont été alertées de leur présence et certains ont été capturés, même si quelques-uns ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_11_FAILURE:0 "Malheureusement, nos agents ont signalé qu'ils n'avaient pas réussi à s'infiltrer dans l'usine de [?slot_one_personnel_target.GetName] pour la saboter. Les forces de sécurité ont été alertées de leur présence et certains ont été capturés, même si quelques-uns ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_12_FAILURE:0 "Malheureusement, notre opération contre les infrastructures de [?slot_one_personnel_target.GetName] a échoué. Certaines bombes n'ont pas explosé, et seuls quelques agents ont pu s'échapper avant l'arrivée des forces de sécurité."
 PHASE_3_Operation_DESC_GENERIC_13_FAILURE:0 "Malheureusement, notre opération contre la cible située à [?slot_one_personnel_target.GetName] a échoué, les forces de sécurité ayant réussi à intercepter nos hommes et à les placer en détention avant qu'ils n'aient pu mener à bien leur attaque."
 PHASE_3_Operation_DESC_GENERIC_14_FAILURE:0 "Malheureusement, nos agents n'ont pas réussi à former efficacement les groupes de résistance locaux lors d'un soulèvement à [?slot_one_personnel_target.GetName]. Les forces de sécurité ont pu arrêter les chefs de la résistance, tandis que nos agents ont réussi à s'échapper."
 PHASE_3_Operation_DESC_GENERIC_15_FAILURE:0 "Malheureusement, notre tentative de prise de contact avec le groupe de résistance de [?slot_one_personnel_target.GetName] s'est soldée par un échec, car celui-ci s'est montré hostile à nos efforts et ses objectifs ne correspondaient pas aux nôtres."
 PHASE_3_Operation_DESC_GENERIC_16_FAILURE:0 "Malheureusement, notre opération visant à former la résistance locale a échoué, principalement en raison du manque de compétences des dirigeants et des membres de la résistance, ainsi que d'un manque de connaissances."
 PHASE_3_Operation_DESC_GENERIC_17_FAILURE:0 "Malheureusement, notre opération visant à armer la résistance locale à [?slot_one_personnel_target.GetName] a été jugée un échec, car ils n'ont pas réussi à récupérer les armes et à assurer un armement adéquat à temps pour les opérations."
 PHASE_3_Operation_DESC_GENERIC_18_FAILURE:0 "Malheureusement, nos agents n'ont pas réussi à s'intégrer efficacement aux groupes de résistance à [?slot_one_personnel_target.GetName], en raison d'un manque de contacts et d'une certaine hostilité entre nos agents et les combattants de la résistance."
 PHASE_3_Operation_DESC_GENERIC_19_FAILURE:0 "Malheureusement, nos opérations de contre-espionnage à [?slot_one_personnel_target.GetName] ont échoué, car les forces de sécurité ont eu vent de l'existence du groupe de résistance et sont intervenues."
 PHASE_3_Operation_DESC_GENERIC_20_FAILURE:0 "Malheureusement, notre tentative de kidnapping de [local_possible_operations_personnel_target] a échoué, car certains de nos agents ont été interceptés par les forces de sécurité alors qu'ils tentaient de s'enfuir et ont été arrêtés."
 PHASE_3_Operation_DESC_GENERIC_21_FAILURE:0 "Malheureusement, nos services de renseignement et de sécurité n'ont pas réussi à mettre complètement fin à l'insurrection et à la résistance qui sévissent sur notre territoire. Certaines informations se sont révélées totalement erronées et ont coûté la vie à de nombreux agents, des vies qui ne pourront jamais être ramenées. Nous continuerons à aller de l'avant."
 PHASE_3_Operation_DESC_GENERIC_22_FAILURE:0 "Malheureusement, nos équipes de démolition n'ont pas réussi à endommager les voies ferrées ciblées dans [?slot_one_target.GetName]. Certaines équipes ont réussi leur mission, mais d'autres ont été arrêtées par les services de sécurité ou leurs explosifs n'ont pas fonctionné."
