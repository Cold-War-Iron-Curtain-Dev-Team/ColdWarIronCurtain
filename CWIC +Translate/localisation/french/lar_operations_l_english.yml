 PHASE_1_Operation_DESC_UIA_1:0 "Tout d'abord, nous devons nous mettre d'accord avec les agents locaux du MGB pour organiser l'arrestation de Roman, et obtenir leur aide pour la dissimulation des faits qui s'ensuivra."
 PHASE_2_Operation_DESC_UIA_1:0 "Afin de nous assurer que la cible ne puisse pas s'échapper de la zone d'intervention, nous coordonnerons nos efforts avec les autorités locales et internes pour veiller à ce que sa maison soit encerclée par plusieurs centaines de soldats de l'intérieur."
 PHASE_3_Operation_DESC_UIA_1:0 "Même si les affrontements sont inévitables, nous ne pouvons pas laisser l'OUN faire passer Choukhévitch pour un martyr. Nous ferons en sorte que sa mort ressemble à un suicide, et nous brûlerons son corps près de la rivière Zbruch afin qu'il ne puisse pas être retrouvé."
 PHASE_1_Operation_DESC_UIA_2:0 "Nos services de renseignement et de sécurité procéderont immédiatement à une évaluation des menaces pesant sur les sites susceptibles d'abriter des complexes de l'UIA, en se concentrant sur les cellules les plus actives de la région."
 PHASE_2_Operation_DESC_UIA_2:0 "Nos agents concentreront ensuite leurs efforts sur la localisation précise des cellules de l'UIA, en ciblant leurs dirigeants et les principales menaces pesant sur les responsables locaux et les infrastructures."
 PHASE_3_Operation_DESC_UIA_2:0 "Enfin, le point culminant de notre opération aura lieu lorsque nos agents et nos forces de sécurité, agissant sur la base de renseignements, mèneront des raids et neutraliseront les membres de la cellule, protégeant ainsi les membres locaux du parti et éliminant davantage les fascistes."
 PHASE_1_Operation_DESC_UIA_3:0 "Les dirigeants et les cadres locaux du parti se concerteront avec les forces de sécurité afin de déterminer quels villages de la région sont les plus susceptibles de soutenir l'UIA."
 PHASE_2_Operation_DESC_UIA_3:0 "Nos agents se concentreront ensuite sur la surveillance des villages figurant sur la liste cible afin de déterminer lesquels bénéficient du plus fort soutien aux fascistes et sont susceptibles de leur avoir apporté leur aide par le passé."
 PHASE_3_Operation_DESC_UIA_3:0 "Enfin, le détachement, accompagné des unités de défense populaire locales placées sous son commandement, encerclera le village et procédera à la déportation de la population vers l'Extrême-Orient."
 PHASE_1_Operation_DESC_UIA_4:0 "Après avoir repéré les cellules de l'OUN dans toute la RSS d'Ukraine, nous les intégrerons au sein de l'organisation, en leur attribuant de fausses identités et de faux parcours, afin de nous assurer une base solide."
 PHASE_2_Operation_DESC_UIA_4:0 "Avant que nos agents puissent occuper des postes à responsabilité au sein de l'OUN, nous devons les aider à accélérer leur carrière afin de renforcer leur position au sein de l'Organisation."
 PHASE_3_Operation_DESC_UIA_4:0 "En coordination avec nos agents infiltrés, nous ciblerons discrètement les principaux responsables de chaque cellule en vue de les éliminer discrètement, afin d'ouvrir la voie à la promotion rapide des agents que nous avons infiltrés."
 PHASE_1_Operation_DESC_UIA_5:0 "Si les autorités locales ont eu du mal à appréhender elles-mêmes ces militants, elles disposent néanmoins d'informations cruciales, telles que leurs noms et leurs lieux de séjour."
 PHASE_2_Operation_DESC_UIA_5:0 "Il est déconseillé d'engager un combat ouvert contre les milices locales ; tant qu'elles restent en contact avec leurs chefs, elles sont en mesure de coordonner une résistance."
 PHASE_3_Operation_DESC_UIA_5:0 "Les militants étant coupés de leur hiérarchie et incapables de se coordonner entre eux, grâce à l'aide des autorités locales, ils peuvent être appréhendés sans grande résistance et sans laisser de traces de notre implication."
 PHASE_1_Operation_DESC_UIA_6:0 "Si les autorités locales ont eu du mal à appréhender elles-mêmes ces militants, elles disposent néanmoins d'informations cruciales, telles que leurs noms et leurs lieux de séjour."
 PHASE_2_Operation_DESC_UIA_6:0 "Il est déconseillé d'engager un combat ouvert contre les milices locales ; tant qu'elles restent en contact avec leurs chefs, elles sont en mesure de coordonner une résistance."
 PHASE_3_Operation_DESC_UIA_6:0 "Les militants étant coupés de leur hiérarchie et incapables de se coordonner entre eux, grâce à l'aide des autorités locales, ils peuvent être appréhendés sans grande résistance et sans laisser de traces de notre implication."
 PHASE_1_Operation_DESC_UIA_7:0 "Étant donné que Bandera est implantée à Munich, il est essentiel de veiller à ce que nos agents restent discrets tout en restant efficaces. Il est crucial de s'assurer qu'il n'y ait aucun témoin pour garantir le succès de l'opération."
 PHASE_2_Operation_DESC_UIA_7:0 "Une fois l'ordre donné, les agents encercleront le collaborateur et l'aspergeront à l'aide d'un pistolet à cyanure, une méthode mortelle, mais surtout très rapide."
 PHASE_3_Operation_DESC_UIA_7:0 "Une fois l'opération menée à bien, le retour clandestin de nos agents de l'autre côté de la frontière est une priorité absolue, afin de garantir que la mort de Bandera ne puisse être attribuée à l'Union soviétique et d'éviter l'arrestation de nos agents."
 UIA_1_Success_desc:0 "L'opération menée par [GetCurrentSquadTitle] pour assassiner Roman Shukhevych s'est soldée par un succès retentissant, sa mort ayant été présentée comme un suicide survenu alors qu'il résistait à une arrestation civile."
 UIA_1_Failure_desc:0 "La tentative d'assassinat de Roman Shukhevych par [GetCurrentSquadTitle] s'est soldée par un échec regrettable, car celui-ci a réussi à échapper à [GetCurrentSquadTitle] et à s'enfuir vers un lieu qui reste, pour l'instant, inconnu."
 UIA_2_Success_desc:0 "Une opération anti-insurrection menée par [GetCurrentSquadTitle] contre des sites présumés de l'Armée insurrectionnelle ukrainienne s'est soldée par un succès, avec plusieurs arrestations et la saisie d'armes."
 UIA_2_Failure_desc:0 "Une tentative de raid contre les bases de l'Armée insurrectionnelle ukrainienne, menée par [GetCurrentSquadTitle], s'est soldée non seulement par un échec, mais aussi par la mort de plusieurs de nos agents."
 UIA_3_Success_desc:0 "[GetCurrentSquadTitle] a réussi à localiser et à expulser d'innombrables insurgés présumés et sympathisants de l'insurrection dans tout l'ouest de l'Ukraine, ce qui a entraîné une forte baisse de l'activité insurrectionnelle dans la région."
 UIA_3_Failure_desc:0 "Les tentatives de [GetCurrentSquadTitle] visant à paralyser les villages soutenant les insurgés dans l'ouest de l'Ukraine ont non seulement échoué, mais elles ont également renforcé la base de soutien des insurgés dans la région."
 UIA_4_Success_desc:0 "Les tentatives de [GetCurrentSquadTitle] pour infiltrer l'Organisation des nationalistes ukrainiens ont été couronnées de succès, et plusieurs de nos agents infiltrés ont réussi à se hisser à des postes de direction au sein de l'organisation."
 UIA_4_Failure_desc:0 "Les tentatives d'infiltration de [GetCurrentSquadTitle] ont non seulement été découvertes, mais elles ont également conduit à l'expulsion et à l'exécution de plusieurs de nos agents infiltrés au sein de l'organisation."
 UIA_5_Success_desc:0 "Les efforts déployés par [GetCurrentSquadTitle] pour neutraliser et réprimer les milices nationalistes dans l'oblast de Kiev ont porté leurs fruits et ont porté un coup dur à la présence armée de l'OUN dans la capitale de la RSS d'Ukraine."
 UIA_5_Failure_desc:0 "L'incapacité de [GetCurrentSquadTitle] à appréhender les milices nationalistes dans l'oblast de Kiev a entraîné la mort de plusieurs agents et semble n'avoir fait que renforcer la présence de l'OUN dans cette région."
 UIA_6_Success_desc:0 "Les efforts déployés par [GetCurrentSquadTitle] pour arrêter et neutraliser les milices nationalistes dans l'oblast de Vinnytsia ont porté leurs fruits et ont porté un coup dur à la présence armée de l'OUN dans la région."
 UIA_6_Failure_desc:0 "L'échec de [GetCurrentSquadTitle] à appréhender les milices nationalistes dans l'oblast de Vinnytsia a entraîné la mort de plusieurs agents et semble n'avoir fait que renforcer la présence de l'OUN dans cette région."
 UIA_7_Success_desc:0 "L'assassinat de cet ancien collaborateur nazi, autrefois très actif, par [GetCurrentSquadTitle] (à moins que vous ne préfériez utiliser le nom historique de son assassin, Bohdan Stashynsky) a été un succès retentissant, Bandera s'étant effondré devant son appartement à Munich, victime d'un empoisonnement au cyanure."
 UIA_7_Failure_desc:0 "Stepan Bandera a malheureusement échappé une nouvelle fois à l'assassinat, la tentative de [GetCurrentSquadTitle] visant à éliminer le collaborateur à l'aide de gaz cyanuré ayant échoué, Bandera ayant réussi à quitter les lieux avant que le gaz ne fasse effet."
