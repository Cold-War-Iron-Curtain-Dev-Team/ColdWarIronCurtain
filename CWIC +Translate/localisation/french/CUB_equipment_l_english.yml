 CUB_nav_bomber_equipment_3:0 "Consolidated PBY-5A Catalina"
 CUB_nav_bomber_equipment_3_short:0 "PBY-5A Catalina"
 CUB_cv_jet_CAS_equipment_2:0 "Hawker Sea Fury FB.11"
 CUB_cv_jet_CAS_equipment_2_short:0 "Sea Fury FB.11"
 CUB_cv_jet_CAS_equipment_2_desc:0 "Chasseur-bombardier monoplace pour la Royal Navy, la Royal Australian Navy, la Royal Canadian Navy et la Royal Netherlands Navy, 615 exemplaires construits, dont 31 pour la RAN et 53 pour la RCN."
 CUB_attack_helicopter_equipment_2:0 "Mil Mi-24V"
 CUB_attack_helicopter_equipment_2_short:0 "Mil Mi-24V"
 CUB_attack_helicopter_equipment_2_desc:0 "Une version ultérieure qui est entrée en production en 1976. Elle était équipée du missile 9M114 Shturm (AT-6 Spiral), plus perfectionné. Huit de ces missiles sont montés sur quatre pylônes extérieurs des ailes. Il s'agit de la version la plus produite, avec plus de 1 500 exemplaires fabriqués. Au service de l'armée polonaise, cet appareil est désigné Mi-24W. Un Mi-24V a été désigné Mi-24T pour des raisons inconnues."
 CUB_attack_helicopter_equipment_3:0 "Mil Mi-25"
 CUB_attack_helicopter_equipment_3_short:0 "Mil Mi-25"
 CUB_attack_helicopter_equipment_3_desc:0 "La version d'exportation du Mi-24D (Hind-D). Le Mi-24D a été conçu pour être un hélicoptère d'attaque plus pur que les variantes précédentes. Sa production a débuté en 1973. Le Mi-24D présente un fuselage avant redessiné, avec deux cockpits distincts pour le pilote et le mitrailleur. Il est armé d'une seule mitrailleuse Yak-B de 12,7 mm à quatre canons sous le nez. Il peut également embarquer quatre lance-roquettes de 57 mm, quatre missiles antichars SACLOS 9M17 Phalanga (une amélioration significative par rapport au système MCLOS équipant le Mi-24A), ainsi que des bombes et d'autres armes."
