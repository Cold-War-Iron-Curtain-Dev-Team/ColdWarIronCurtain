 CUB_fighter_equipment_0:0 "Défense antiaérienne et Force aérienne révolutionnaire"
 CUB_fighter_equipment_0_short:0 "DAAFAR"
 CUB_fighter_equipment_0_desc:0 "La Force aérienne et de défense aérienne révolutionnaire cubaine, communément abrégée en DAAFAR tant en espagnol qu'en anglais, est l'armée de l'air de Cuba."
 CUB_fighter_equipment_3:0 "P-51D nord-américain Mustang"
 CUB_fighter_equipment_3_short:0 "P-51D Mustang"
 CUB_jet_multirole_equipment_2:0 "Mikoyan-Gurevich MiG-15"
 CUB_jet_multirole_equipment_2_desc:0 "Sans doute l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a participé à de nombreux conflits depuis son introduction pendant la guerre de Corée, où il s'est révélé être un adversaire redoutable pour les F-86 Sabre et F9F Panther américains. Une partie de la frontière entre la Corée et la Chine a été surnommée « MiG Alley » en raison de leur omniprésence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Si la plupart des appareils ont été mis hors service dans les années 1950, certains sont encore en service dans l'armée de l'air nord-coréenne."
 CUB_jet_multirole_equipment_2_short:0 "MiG-15"
 CUB_jet_multirole_equipment_3:0 "Mikoyan-Gurevich MiG-17"
 CUB_jet_multirole_equipment_3_desc:0 "Successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence dans l'armée de l'air chinoise sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, en Afrique, en Europe et en Asie. Son premier déploiement au combat a eu lieu en 1958, lorsque des MiG de la République populaire de Chine ont affronté des F-86 Sabre chinois nationalistes au-dessus du détroit de Taiwan. Cependant, le MiG-17 a principalement été utilisé pendant la guerre du Vietnam par la NVAF et la PLAAF, où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même tenu tête aux chasseurs américains Phantom II, beaucoup plus modernes et supersoniques, pendant la guerre du Vietnam. Le MiG-17 a été généralement retiré du service dans les années 1970, mais il reste encore en service de manière limitée dans certains pays africains et en Corée du Nord."
 CUB_jet_multirole_equipment_3_short:0 "MiG-17"
 CUB_jet_multirole_equipment_4:0 "Mikoyan-Gurevich MiG-19"
 CUB_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de fabrication soviétique capable d'atteindre une vitesse supersonique en vol horizontal. Son équivalent américain dans la « série Century » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les McDonnell Douglas F-4 Phantom II et Republic F-105 Thunderchief, plus modernes, au-dessus du Nord-Vietnam."
 CUB_jet_multirole_equipment_4_short:0 "MiG-19"
 CUB_jet_multirole_equipment_5:0 "Mikoyan-Gurevich MiG-21F-13"
 CUB_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, équipé de missiles à portée au-delà du champ visuel et d'un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, notamment en Chine et en Inde où il a été construit en grand nombre sous licence. Plus de 11 000 exemplaires ont été construits, servant dans plus de 60 pays sur les 5 continents. Au cours de sa durée de vie, le MiG-21 a abattu 240 avions ennemis. Le MiG-21 a été utilisé dans de nombreux conflits, notamment au Vietnam (où il a remporté un énorme succès), lors de la guerre indo-pakistanaise de 1971, lors de la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il est toujours en service après plus de six décennies."
 CUB_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 CUB_jet_multirole_equipment_6:0 "Mikoyan-Gurevich MiG-21PF"
 CUB_jet_multirole_equipment_6_desc:0 "Version de série de l'intercepteur tout temps. Ces appareils étaient équipés du turboréacteur R11F2-300 et, à partir du septième lot de production, du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T, également appelé RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 afin de permettre l'utilisation du missile air-air à guidage laser RS-2US (alias K-5MS) en plus du missile à guidage infrarouge K-13."
 CUB_jet_multirole_equipment_6_short:0 "MiG-21PF"
 CUB_jet_multirole_equipment_7:0 "Mikoyan-Gurevich MiG-23M"
 CUB_jet_multirole_equipment_7_desc:0 "Le MiG-23 a été le premier chasseur soviétique à être équipé d'un radar à balayage vers le bas et à tirer vers le bas, et l'un des premiers à être armé de missiles à portée au-delà du champ visuel. Sa production a débuté en 1969 et a atteint des chiffres importants avec plus de 5 000 appareils construits, ce qui en fait l'avion à ailes à géométrie variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service de manière limitée chez certains clients à l'exportation."
 CUB_jet_multirole_equipment_7_short:0 "MiG-23M"
 CUB_jet_multirole_equipment_8:0 "Mikoyan-Gurevich MiG-23ML"
 CUB_jet_multirole_equipment_8_desc:0 "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment en termes de résistance et de fiabilité de la cellule, de performances du moteur, de maniabilité et de performances radar. Une refonte considérable de la cellule a été effectuée, donnant naissance au MiG-23ML."
 CUB_jet_multirole_equipment_8_short:0 "MiG-23ML"
 CUB_jet_multirole_equipment_9:0 "Mikoyan-Gurevich MiG-23MLD"
 CUB_jet_multirole_equipment_9_desc:0 "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de cette mise à niveau était d'améliorer la maniabilité, en particulier lors d'angles d'attaque élevés, qui étaient considérés comme le principal défaut du MiG-23M/ML. La perche pitot était équipée de générateurs de tourbillons, et les bords d'attaque dentelés des ailes étaient également conçus pour agir comme des générateurs de tourbillons. Le système de commande de vol intégrait le dispositif de butée synthétique SOS-3-4 et le limiteur de signaux."
 CUB_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 CUB_jet_multirole_equipment_10:0 "Mikoyan-Gurevich MiG-29A"
 CUB_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le bureau d'études Mikoyan. Il s'agit du premier chasseur de quatrième génération à avoir été mis en service par l'URSS et le bloc de l'Est. Il intègre une avionique améliorée et des capacités radar considérablement renforcées. Les premiers MiG-29 ont été utilisés comme avions d'entraînement par le Pacte de Varsovie, avec des exportations limitées vers l'Inde, mais leur utilisation au combat était restreinte. Le MiG-29 allait plus tard servir de base à des variantes largement produites, telles que le MiG-29S, le MiG-29M et le MiG-35."
 CUB_jet_multirole_equipment_10_short:0 "MiG-29A"
 CUB_jet_CAS_equipment_7:0 "Mikoyan-Gurevich MiG-23BN"
 CUB_jet_CAS_equipment_7_short:0 "MiG-23BN"
 CUB_jet_CAS_equipment_7_desc:0 "Successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence dans l'armée de l'air chinoise sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, en Afrique, en Europe et en Asie. Son premier déploiement au combat a eu lieu en 1958, lorsque des MiG de la République populaire de Chine ont affronté des F-86 Sabre chinois nationalistes au-dessus du détroit de Taiwan. Cependant, le MiG-17 a principalement été utilisé pendant la guerre du Vietnam par la NVAF et la PLAAF, où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même tenu tête aux chasseurs américains Phantom II, beaucoup plus modernes et supersoniques, pendant la guerre du Vietnam. Le MiG-17 a été généralement retiré du service dans les années 1970, mais il reste encore en service de manière limitée dans certains pays africains et en Corée du Nord."
 CUB_jet_light_equipment_1:0 "Lockheed T-33 Shooting Star"
 CUB_jet_light_equipment_1_short:0 "T-33 Shooting Star"
 CUB_jet_light_equipment_1_desc:0 "Le Lockheed T-33 Shooting Star (ou T-Bird) est un avion d'entraînement subsonique américain. Il a été produit par Lockheed et a effectué son premier vol en 1948. Le T-33 a été développé à partir du Lockheed P-80/F-80, d'abord sous le nom de TP-80C/TF-80C, puis sous celui de T-33A."
 CUB_jet_light_equipment_2:0 "Mikoyan-Gurevich MiG-15UTI"
 CUB_jet_light_equipment_2_short:0 "MiG-15UTI"
 CUB_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 s'est vu officiellement confier le développement d'une version d'entraînement du chasseur MiG-15. Le prototype de l'avion MiG-15UTI a été fabriqué par l'usine n° 1 entre mars et mai 1949. La cabine de l'instructeur sur le MiG-15UTI a été placée en réduisant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes à largage pyromécanique. L'équipement spécial du véhicule comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un compas radio RPKO-10M avec un marqueur RPKO-10M, un interphone SPU-2M, un appareil à oxygène KP-14 et une caméra AFA-IM. L'armement comprenait un canon NR-23 de 23 mm avec 80 cartouches et une mitrailleuse UBK-E avec 150 cartouches."
 CUB_jet_light_equipment_3:0 "L-29 Delfin"
 CUB_jet_light_equipment_3_short:0 "L-29 Delfin"
 CUB_jet_light_equipment_3_desc:0 "L'Aero L-29 Delfín (nom de code OTAN : Maya) est un avion d'entraînement militaire à réaction développé et fabriqué par le constructeur aéronautique tchécoslovaque Aero Vodochody. Plus de 3 000 exemplaires du L-29 Delfín ont été produits. Environ 2 000 d'entre eux auraient été livrés à l'Union soviétique, où il a servi d'avion d'entraînement standard pour l'armée de l'air soviétique."
 CUB_jet_light_equipment_4:0 "Aero L-39 Albatros"
 CUB_jet_light_equipment_4_short:0 "L-39 Albatros"
 CUB_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Il a été conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme principal avion d'entraînement. Il a été le premier avion d'entraînement à être équipé d'un turboréacteur à double flux. Ce modèle a été exporté vers de nombreux pays en tant qu'avion d'entraînement militaire."
 CUB_jet_light_equipment_5:0 "Aero L-39ZA Albatros"
 CUB_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 CUB_jet_light_equipment_5_desc:0 "L-39 considérablement amélioré pour l'entraînement au combat et les attaques légères, équipé d'un train d'atterrissage plus robuste, d'une charge utile plus importante et, surtout, d'un canon double GSh-23L de 23 millimètres fixé dans un pod conforme sous le cockpit, avec un chargeur de 150 cartouches dans le fuselage."
 CUB_recon_equipment_0:0 "P-51D nord-américain Mustang"
 CUB_recon_equipment_0_short:0 "F-6D Mustang"
 CUB_recon_equipment_0_desc:0 "Reconnaissance version of P-51D Mustang."
 CUB_jet_recon_equipment_0:0 "Lockheed RT-33A Shooting Star"
 CUB_jet_recon_equipment_0_short:0 "RT-33A Shooting Star"
 CUB_jet_recon_equipment_0_desc:0 "RT-33A modifié avant livraison en version monoplace de reconnaissance ; 85 exemplaires construits, principalement pour l'exportation dans le cadre du programme d'aide militaire."
 CUB_jet_recon_equipment_1:0 "Mikoyan-Gurevich MiG-21R-13"
 CUB_jet_recon_equipment_1_short:0 "MiG-21R-13"
 CUB_tac_bomber_equipment_2:0 "B-25D nord-américain Mitchell"
 CUB_tac_bomber_equipment_2_short:0 "B-25C Mitchell"
 CUB_tac_bomber_equipment_2_desc:0 "Le B-25 est un bombardier moyen bimoteur introduit en 1941. Utilisé par de nombreuses forces aériennes pendant la Seconde Guerre mondiale, il a également servi sur tous les théâtres d'opérations impliquant des avions pendant la guerre, son utilisation la plus célèbre étant le raid de Doolittle, la première campagne de bombardements aériens réussie sur le territoire japonais pendant la guerre. Son surnom est le « Mitchell », du nom du major général Billy Mitchell, pionnier de l'aviation militaire américaine."
 CUB_tac_bomber_equipment_3:0 "Douglas B-26B Invader"
 CUB_tac_bomber_equipment_3_short:0 "B-26B Invader"
 CUB_jet_tac_bomber_equipment_2:0 "Ilyushin Il-28"
 CUB_jet_tac_bomber_equipment_2_short:0 "Il-28"
 CUB_jet_tac_bomber_equipment_2_desc:0 "L'Il-28 était un bombardier moyen à turboréacteur développé immédiatement après la fin de la Seconde Guerre mondiale pour l'armée de l'air soviétique. Premier bombardier à réaction à être produit à grande échelle, l'Il-28, lorsqu'il a été introduit en 1950, a servi dans de nombreux conflits majeurs de la guerre froide, du Vietnam à la guerre soviéto-afghane, en passant par le conflit de Suez et la guerre du Biafra. Même après avoir été retiré du service soviétique dans les années 1980, de nombreux appareils de ce type sont encore en service aujourd'hui. Le nom de code de l'USAF/DoD est Type 27, tandis que le nom de code de l'OTAN est Beagle."
 CUB_transport_plane_equipment_1:0 "Douglas C-47 Dakota"
 CUB_transport_plane_equipment_1_short:0 "C-47 Dakota"
 CUB_transport_plane_equipment_2:0 "Antonov An-2"
 CUB_transport_plane_equipment_2_short:0 "An-2"
 CUB_transport_plane_equipment_6:0 "Antonov An-26"
 CUB_transport_plane_equipment_6_short:0 "An-26"
 CUB_transport_plane_equipment_6_desc:0 "L'Antonov An-26 est un avion de transport civil et militaire bimoteur à turbopropulseurs, conçu et construit en Union soviétique de 1969 à 1986."
