l_english:
 CUB_infantry_equipment_0:0 "Johnson M1941"
 CUB_infantry_equipment_0_short:0 "Johnson M1941"
 CUB_infantry_equipment_0_desc:0 "Le fusil Johnson M1941 est un fusil semi-automatique américain à recul court conçu par Melvin Johnson avant la Seconde Guerre mondiale. Le M1941 a tenté sans succès de concurrencer le fusil américain M1."
 CUB_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 CUB_infantry_equipment_1_short:0 "FN FAL"
 CUB_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. Du fait de sa prévalence et de son utilisation généralisée au sein des forces armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le surnom de « bras droit du monde libre »."
 CUB_infantry_equipment_2:0 "Avtomat Kalashnikova Modernizirovanniy"
 CUB_infantry_equipment_2_short:0 "AKM"
 CUB_infantry_equipment_2_desc:0 "L'AKM est une version modernisée de l'AK-47, développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'Armée soviétique en 1959. L'arme a été largement optimisée et repensée pour répondre aux besoins de l'armée en pleine modernisation. De nombreuses pièces ont été simplifiées pour la production de masse et le boîtier en acier usiné a été remplacé par une pièce en acier emboutie en forme de U afin d'améliorer les cadences de production. Grâce à ces simplifications, l'arme était également beaucoup plus légère, son poids étant réduit d'environ 30 %. De plus, elle a été renforcée pour une meilleure robustesse et des rails de guidage ont été ajoutés pour faciliter le mouvement du porte-culasse. L'AKM a été immédiatement et largement utilisée par de nombreux pays communistes et produite pour les conflits tout au long de sa durée de vie. On peut notamment citer l'invasion de la Tchécoslovaquie, où elle a été utilisée par les deux camps."
 CUB_infantry_equipment_3:0 "Avtomat Kalashnikova 1974"
 CUB_infantry_equipment_3_short:0 "AK-74"
 CUB_infantry_equipment_3_desc:0 "L'AK74 est un fusil d'assaut moderne développé par Mikhaïl Kalachnikov pour remplacer l'AKM en 1974. Il utilise une cartouche plus petite et un canon chromé amélioré avec 4 rainures à droite. Le guidon et le bloc de gaz ont été redessinés pour contenir un canal bas installé à 90 degrés par rapport à l'axe du canon afin de réduire le cisaillement des balles au niveau de la fenêtre d'éjection. De plus, son développement s'est accompagné de divers accessoires, notamment une crosse rembourrée en caoutchouc. Les améliorations apportées à l'AK74 ont permis aux soldats de transporter une plus grande quantité de munitions sur le terrain et de maintenir un volume de tir plus élevé avec une précision accrue à moyenne distance. Il a été utilisé à grands frais pendant le conflit en Afghanistan, où la CIA a versé une somme importante aux moudjahidines pour récupérer un AK74 capturé."
 CUB_infantry_equipment_4:0 "Avtomat Kalashnikova Modernizirovanniy"
 CUB_infantry_equipment_4_short:0 "AKM cubain"
 CUB_infantry_equipment_4_desc:0 "Une version sous licence de l'AKM, simplement connue sous le nom d'AKM cubain, est encore utilisée et produite de nos jours. Des points de fixation supplémentaires ont été ajoutés pour accueillir une lunette de visée conçue et fabriquée localement, ce qui pourrait prolonger la durée de vie de ce fusil en service à Cuba depuis la fin des années 1950."
 CUB_lt_equipment_1:0 "M3A3 Stuart"
 CUB_lt_equipment_1_short:0 "M3A3 Stuart"
 CUB_lt_equipment_2:0 "M8 Greyhound"
 CUB_lt_equipment_2_short:0 "M8 Greyhound"
 CUB_lt_equipment_3:0 "PT-76"
 CUB_lt_equipment_3_short:0 "PT-76"
 CUB_lt_equipment_3_desc:0 "Le PT-76 est un char léger amphibie soviétique qui a été largement exporté à travers le monde. Il a été conçu par Nikolai Shashmyrin et Zh. Kotin en 1951, et environ 12 000 exemplaires ont été produits. Il nécessite un équipage de trois hommes et est équipé d’un moteur V6 six cylindres en ligne, lui permettant d’atteindre une vitesse de 44 km/h sur terre et de nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique ou proches de l’Union soviétique et a ainsi rempli un rôle de reconnaissance dans pratiquement tous les conflits impliquant des nations de cette sphère. Toutefois, il est encore utilisé aujourd’hui par de nombreux pays en raison de sa fiabilité réputée et de sa facilité d’entretien."
 CUB_lt_equipment_4:0 "PT-76B Modèle 4"
 CUB_lt_equipment_4_short:0 "PT-76B"
 CUB_lt_equipment_4_desc:0 "Le PT-76 est équipé d'un canon rayé D-56TS de 76,2 mm (frein de bouche à double déflecteur, éjecteur de douilles, extracteur de fumée et système de stabilisation à deux axes STP-2P « Zarya »), du système de protection PAZ (protivo-atomnaya zashchita) , un système d'extinction automatique d'incendie, un viseur TShK-2-66 amélioré, un système de filtration-ventilation, des dispositifs d'observation améliorés, un équipement électrique amélioré, un nouveau moteur diesel V-6B 6 cylindres 4 temps en ligne refroidi par eau développant 263 ch (196 kW) à 1800 tr/min et des réservoirs de carburant internes supplémentaires pour lesquels la forme du blindage a dû être légèrement modifiée."
 CUB_ht_equipment_4:0 "IS-2M"
 CUB_ht_equipment_4_short:0 "IS-2M"
 CUB_mbt_equipment_0:0 "M4 Sherman"
 CUB_mbt_equipment_0_short:0 "M4 Sherman"
 CUB_mbt_equipment_1:0 "Char A34 Comet"
 CUB_mbt_equipment_1_short:0 "Comet"
 CUB_mbt_equipment_2:0 "T-54"
 CUB_mbt_equipment_2_short:0 "T-54"
 CUB_mbt_equipment_2_desc:0 "Le char T-54 est le char le plus produit de l'histoire. Conçu en 1946 par KMBD, il est équipé d'un canon rayé de 100 mm et d'un blindage à épaisseur variable, de 60 à 205 mm. Son moteur diesel V12 de 38,88 litres et sa suspension à barres de torsion lui permettent d'atteindre une vitesse de 48 km/h. Utilisé par plus de 50 armées à travers le monde, il a été produit dans tout le bloc soviétique et a participé à tous les conflits qui y ont été liés."
 CUB_mbt_equipment_3:0 "T-55"
 CUB_mbt_equipment_3_short:0 "T-55"
 CUB_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. Le bureau d'études OKB-520 a modifié la conception du T-55 en améliorant sa protection NBC, en optimisant son moteur, en redessinant la tourelle et en ajoutant des équipements auxiliaires tels qu'un système de conduite de tir et des optiques améliorés. De plus, le T-55 utilisait plus fréquemment la mitrailleuse lourde DShK de 12,7 mm, tandis que le T-54 était équipé du canon SGMT de 7,62 mm, ce qui lui conférait une puissance de feu supérieure, mais limitait sa capacité d'emport de munitions. Le T-55 a été utilisé dans autant d'armées que le T-54 et a généralement participé aux mêmes conflits."
 CUB_mbt_equipment_4:0 "T-62"
 CUB_mbt_equipment_4_short:0 "T-62"
 CUB_mbt_equipment_4_desc:0 "Le T-62 est une évolution du char T-55. Il est équipé d'un canon à âme lisse et possède un blindage légèrement plus épais. Le calibre du canon principal a également été porté à 115 mm. Commandé initialement par l'Union soviétique dans le but d'améliorer sa puissance de feu, le projet fut achevé par le bureau d'études OKB-520 vers 1960. Malgré ses améliorations, sa production ne fut pas arrêtée, son coût étant nominalement supérieur à celui du T-55. Plus de 22 700 T-62 furent construits et il participa à de nombreux combats dans la sphère d'influence soviétique, notamment au Moyen-Orient. Ses améliorations démontrèrent une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique."
 CUB_mbt_equipment_5:0 "T-62M"
 CUB_mbt_equipment_5_short:0 "T-62M"
 CUB_mbt_equipment_5_desc:0 "Le T-62 est une évolution du char T-55. Il est équipé d'un canon à âme lisse et possède un blindage légèrement plus épais. Le calibre du canon principal a également été porté à 115 mm. Commandé initialement par l'Union soviétique dans le but d'améliorer sa puissance de feu, le projet fut achevé par le bureau d'études OKB-520 vers 1960. Malgré ses améliorations, sa production ne fut pas arrêtée, son coût étant nominalement supérieur à celui du T-55. Plus de 22 700 T-62 furent construits et il participa à de nombreux combats dans la sphère d'influence soviétique, notamment au Moyen-Orient. Ses améliorations démontrèrent une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique."
 CUB_mechanized_equipment_1:0 "M2 Half-Track"
 CUB_mechanized_equipment_1_short:0 "M2 Half-Track"
 CUB_mechanized_equipment_1_desc:0 "Le véhicule semi-chenillé M2 est un véhicule blindé semi-chenillé produit par les États-Unis pendant la Seconde Guerre mondiale. Sa conception s'inspire des véhicules semi-chenillés importés de France dans les années 1930, utilisant des composants standard fournis par les constructeurs de camions américains afin d'accélérer la production et de réduire les coûts. Le concept a été conçu et les modèles pilotes ont été fabriqués par la Firestone Tire and Rubber Company (avant que le prototype ne soit officiellement baptisé M2). La production par la White Motor Company a commencé en 1940 et a été étendue à Autocar."
 CUB_mechanized_equipment_2:0 "M3 Half-Track"
 CUB_mechanized_equipment_2_short:0 "M3 Half-Track"
 CUB_mechanized_equipment_2_desc:0 "Le semi-chenillé M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et la Guerre froide. Dérivé du semi-chenillé M2, le M3 a été produit en grande série, avec environ 15 000 exemplaires standard et plus de 38 000 variantes. Pendant la Guerre froide, il a été utilisé par divers acteurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, et est resté en service jusqu'au milieu des années 1990. Au Mexique, il était encore en service en 2019."
 CUB_mechanized_equipment_3:0 "M3A1 Half-Track"
 CUB_mechanized_equipment_3_short:0 "M3A1 Half-Track"
 CUB_mechanized_equipment_3_desc:0 "Le M3A1 est un semi-chenillé M3 équipé du support circulaire amélioré pour mitrailleuse M49, situé au-dessus du siège avant droit. Entre 1942 et 1943, tous les semi-chenillés M3 (standard et A1) ont fait l'objet d'améliorations continues. Ces améliorations concernaient notamment la transmission, le moteur et les systèmes de rangement."
