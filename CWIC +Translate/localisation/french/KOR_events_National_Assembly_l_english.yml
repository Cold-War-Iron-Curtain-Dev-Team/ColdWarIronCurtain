l_english:
 kor.na.bill.pass.d:0 "Le projet de loi a finalement été adopté. Les débats furent vifs, mais au bout du compte, les partisans l’ont emporté. À l’Assemblée nationale, le coup de marteau annonça son adoption, et il entra en vigueur sans modification. Rapidement, le gouvernement publia des communiqués, et la presse s’empara du sujet. Ce projet de loi apportera sans doute un grand changement à notre nation… Ou pas."