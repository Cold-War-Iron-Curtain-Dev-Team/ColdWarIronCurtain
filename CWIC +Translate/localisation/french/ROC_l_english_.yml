 CHI_CIVILWAR_the_chinese_civil_war:0 "La guerre civile chinoise"
 CHI_CIVILWAR_the_chinese_civil_war_desc:0 "Après la défaite de l'Empire japonais, la guerre civile entre le Kuomintang et le Parti communiste chinois a repris en 1946. Le PCC, avec l'aide de l'URSS, a pris le contrôle de la Mandchourie et a percé les lignes nationalistes en 1948, devenant finalement une menace sérieuse pour le Kuomintang. Le PCC a actuellement le dessus et le gouvernement a déjà élaboré des plans d'évacuation vers l'île de Taïwan, qui a été restituée à la République après la fin de la Seconde Guerre mondiale. Quel que soit le vainqueur, il est certain que cela déterminera le rôle et l'avenir de la Chine dans la guerre froide."
 CHI_CIVILWAR_abandon_mainland:0 "Se préparer à l'inévitable"
 CHI_CIVILWAR_abandon_mainland_desc:0 "Le PCC est tout simplement trop puissant pour le moment. Nous devons limiter nos pertes et nous retirer du continent. Depuis Taïwan, nous finirons par entreprendre la reconquête du continent sur les bandits communistes après avoir réglé nos problèmes actuels."
 CHI_CIVILWAR_Relocate_the_government_to_Taipei:0 "Réformer le commandement de la garnison de Taïwan"
 CHI_CIVILWAR_Relocate_the_government_to_Taipei_desc:0 "Notre retraite à Taïwan nous oblige à établir notre quartier général administratif temporaire sur l'île. Des changements et des réformes plus importants doivent être apportés à notre force d'occupation actuelle à Formose, afin de garantir une gouvernance efficace et anticommuniste."
 CHI_CIVILWAR_relocate_gold_reserves:0 "Transfert des réserves d'or"
 CHI_CIVILWAR_relocate_gold_reserves_desc:0 "Depuis l'année dernière, le gouvernement a élaboré des plans pour évacuer le continent avec l'or et les trésors qui y sont encore stockés. Nous utiliserons les réserves d'or pour mettre fin aux opérations économiques du PCC issues d'investissements précoces et nous les utiliserons pour lutter contre le problème de l'hyperinflation."
 CHI_CIVILWAR_relocate_important_institutions:0 "Déplacer les institutions importantes"
 CHI_CIVILWAR_relocate_important_institutions_desc:0 "L'Académie Sinica, le Musée national du palais, l'université Tsing-Hua et diverses autres institutions seront transférées à Taïwan. Les universitaires, les documents et les livres seront également transférés afin d'assurer le développement culturel et scientifique de Taïwan. Nous ne voulons pas imaginer ce qui se passerait s'ils tombaient entre les mains des communistes..."
 CHI_CIVILWAR_evacuate_civilians:0 "Évacuer les civils"
 CHI_CIVILWAR_evacuate_civilians_desc:0 "Nous allons commencer à évacuer les civils du continent vers Taïwan par voie maritime et aérienne. On estime que des centaines de milliers de civils chinois seront déplacés. Seul le temps nous dira combien exactement nous pourrons sauver de la menace communiste qui se profile."
 CHI_CIVILWAR_fortify_taiwan_desc:0 "Nous transformerons Taïwan en une forteresse qui ne tombera jamais aux mains de Mao et de ses sbires. Nous établirons des bases aériennes et des fortifications sur l'île afin de garantir la survie de la Chine libre et son retour un jour sur le continent !"
 CHI_CIVILWAR_fortify_taiwan:0 "Fortifier Taïwan"
 CHI_CIVILWAR_fortify_hainan:0 "Fortifier Hainan"
 CHI_CIVILWAR_fortify_hainan_desc:0 "L'île de Hainan pourrait être approuvée comme base supplémentaire pour de futures opérations contre le PCC. Nous devons renforcer les mesures défensives sur l'île afin de nous assurer qu'aucune force de l'APL ne puisse jamais nous la prendre !"
 CHI_CIVILWAR_our_darkest_hour:0 "Notre heure la plus sombre"
 CHI_CIVILWAR_our_darkest_hour_desc:0 "La situation semble désespérée, mais nous ne pouvons pas abandonner ! Nous retournerons un jour sur le continent et libérerons le peuple du Parti communiste. Pour la République de Chine ! Pour la révolution !"
 CHI_CIVILWAR_defend_mainland:0 "La bataille pour le continent continue !"
 CHI_CIVILWAR_defend_mainland_desc:0 "Nous nous battrons jusqu'au dernier homme ! Nous ne pouvons pas laisser les communistes gagner davantage de terrain, sinon la Chine et ses paysans subiront le même sort que les paysans de l'Union soviétique. Nous continuerons à nous battre jusqu'à ce que le PCC soit définitivement vaincu. À bas les bandits russes, opposons-nous au communisme, éliminons Zhu et Mao et mettons en œuvre les trois principes du peuple !"
 CHI_CIVILWAR_call_for_foreign_support:0 "Appel à l'aide étrangère"
 CHI_CIVILWAR_call_for_foreign_support_desc:0 "Nous avons désespérément besoin du soutien de l'Occident si nous voulons vaincre le PCC. Nous conseillerons à nos représentants aux Nations Unies à New York de demander l'aide des autres membres du Conseil de sécurité, tels que les États-Unis, la Grande-Bretagne et la France."
 CHI_CIVILWAR_western_guns:0 "Demander des armes aux pays occidentaux"
 CHI_CIVILWAR_western_guns_desc:0 "La Seconde Guerre mondiale a été marquée par d'importantes avancées technologiques dans la fabrication des armes à feu. Le M14 américain et le L1A1 britannique sont d'excellentes armes et si nous pouvions nous les procurer, cela serait très bénéfique pour l'effort de guerre. Nous demanderons aux États-Unis et à la Grande-Bretagne s'ils sont prêts à nous soutenir en nous fournissant leurs nouvelles armes."
 CHI_CIVILWAR_request_american_planes:0 "Avions de chasse américains"
 CHI_CIVILWAR_request_american_planes_desc:0 "Le groupe de volontaires américains en Chine pendant la guerre de résistance s'est révélé très efficace, perturbant les avions japonais et aidant nos forces terrestres. Nous demanderons plusieurs P-51 Mustang qui aideront nos troupes terrestres à lutter contre l'Armée populaire de libération."
 CHI_CIVILWAR_request_army_fonds:0 "Fonds pour les forces armées"
 CHI_CIVILWAR_request_army_fonds_desc:0 "Nous avons besoin de plus d'argent pour financer l'effort de guerre. Grâce aux prêts américains (que nous rembourserons à terme), nous pourrons produire davantage d'armes et d'autres équipements afin d'approvisionner nos troupes."
 CHI_CIVILWAR_emergency_military_conference:0 "Conférence militaire d'urgence"
 CHI_CIVILWAR_emergency_military_conference_desc:0 "La situation est désespérée pour la République, une conférence militaire d'urgence doit être organisée afin de déterminer la stratégie globale des forces armées. Le destin du pays est entre nos mains, nous sortirons victorieux de cette guerre civile !"
 CHI_CIVILWAR_Central_Command_CKS:0 "Centraliser le commandement de l'armée"
 CHI_CIVILWAR_Central_Command_CKS_desc:0 "La corruption et l'incompétence sont le résultat de nos commandants qui font ce qu'ils pensent être juste et bénéfique. Assez ! Les décisions seront prises par le généralissime Chiang Kai-shek et son état-major militaire proche afin de garantir une efficacité maximale des armées sur le terrain. Tout commandant qui refusera ou ne pensera qu'à son propre intérêt sera relevé de ses fonctions !"
 CHI_CIVILWAR_anti_ccp_propaganda:0 "Campagnes de propagande contre le PCC"
 CHI_CIVILWAR_anti_ccp_propaganda_desc:0 "Afin d'accroître le soutien populaire à notre cause, nous devrons lancer des campagnes de propagande contre le PCC, démontrant au public que leurs idées utopiques ne sont qu'un leurre et que leurs véritables intentions ne sont pas d'aider les paysans et les soldats chinois, mais de donner le pouvoir à une élite totalitaire qui supervisera l'État et réprimera toute dissidence."
 CHI_CIVILWAR_expand_airbases:0 "Développer les bases aériennes"
 CHI_CIVILWAR_expand_airbases_desc:0 "Les communistes ont pris le contrôle de la plupart de nos bases aériennes, nous devons agrandir celles qui restent pour nous assurer que nos avions puissent décoller et soutenir nos courageux soldats au sol."
 CHI_CIVILWAR_crush_rural_peasant_revolts:0 "Écraser les révoltes paysannes"
 CHI_CIVILWAR_crush_rural_peasant_revolts_desc:0 "Les différentes révoltes paysannes dans notre pays deviennent de plus en plus dangereuses. Nous devons écraser ces révoltes si nous ne voulons pas que les paysans poignardent nos soldats dans le dos sur le terrain. Cependant, cela réduirait considérablement le soutien populaire dont nous bénéficions et aurait un impact important sur les efforts de reconstruction."
 CHI_CIVILWAR_concessions_to_peasants:0 "Concessions aux paysans"
 CHI_CIVILWAR_concessions_to_peasants_desc:0 "Nous devons négocier avec les paysans afin d'obtenir leur soutien pour notre gouvernement. Nous leur promettrons diverses réformes agraires et sociales à leur avantage après avoir écrasé l'insurrection communiste afin de les convaincre que le Kuomintang est le parti qui convient aux paysans chinois, et non le PCC totalitaire."
 CHI_CIVILWAR_amnesty_for_ccp_deserters:0 "Offrir l'amnistie aux déserteurs communistes"
 CHI_CIVILWAR_amnesty_for_ccp_deserters_desc:0 "Avec le vent qui tourne une nouvelle fois, nous faisons de grands progrès dans l'effort de guerre et nous nous dirigeons vers Pékin. De nombreux soldats et officiers communistes désertent l'APL et le gouvernement estime que leurs compétences et leur main-d'œuvre pourraient nous aider à vaincre plus rapidement le reste du PCC."
 CHI_CIVILWAR_Sweet_Victory:0 "Toujours « victorieux » !"
 CHI_CIVILWAR_Sweet_Victory_desc:0 "Même si ce n'est pas une victoire totale, nous avons finalement consolidé notre position en Chine centrale. L'Armée populaire de libération, qui n'est plus que l'ombre d'elle-même, se cache désormais en Mandchourie avec le soutien de l'Union soviétique, mais ne détient plus aucun pouvoir industriel significatif. Nous sommes toujours victorieux !"
 CHI_CIVILWAR_revive_the_gexin_reform_movement:0 "Relancer le mouvement réformateur de Gexin"
 CHI_CIVILWAR_revive_the_gexin_reform_movement_desc:0 "Le mouvement de réforme Gexin, composé principalement de jeunes issus de la faction Whampoa et du Central Club Clique, a éclaté en 1944, montrant au peuple comment le gouvernement du Kuomintang était capable de se réformer sans pour autant renoncer à son programme de contrôle de la Chine. Nous devons soutenir leur renaissance afin d'ouvrir la voie à des réformes avec leur aide."
 CHI_CIVILWAR_temporal_military_reorganization:0 "Réorganisation militaire temporaire"
 CHI_CIVILWAR_temporal_military_reorganization_desc:0 "Avec la victoire dans le sud de la Chine, nous avons réussi à redonner du moral et un nouvel élan à nos généraux et officiers. Nous allons procéder à une réorganisation rapide et minimale afin d'utiliser une structure militaire relativement réduite pour le moment, sans avoir besoin d'une structure militaire excessive et importante en raison des millions de désertions enregistrées ces dernières années."
 CHI_CIVILWAR_form_the_national_security_bureau:0 "Former le Bureau de la sécurité nationale"
 CHI_CIVILWAR_form_the_national_security_bureau_desc:0 "Le Bureau national d'enquête et de statistique a commis suffisamment d'erreurs en matière de renseignement pendant la guerre civile ! Nous ne pouvons plus compter sur cette seule police secrète pour recueillir des renseignements militaires. Nous devons créer une nouvelle branche de la police secrète qui aiderait à coordonner les autres branches de la police secrète au sein de la République de Chine, ce qui augmenterait les chances de succès des opérations d'espionnage."
 CHI_CIVILWAR_discredit_the_CCP_internationally:0 "Discréditer le Parti communiste à l'échelle internationale"
 CHI_CIVILWAR_discredit_the_CCP_internationally_desc:0 "Afin de convaincre le monde que notre guerre contre le PCC vise à libérer le peuple de la brutalité des communistes, nous devons envoyer des journalistes sur les lieux des atrocités commises par les communistes, puis diffuser ces images dans le monde entier afin de montrer aux gens pourquoi nous nous battons."
 CHI_CIVILWAR_drive_the_bandits_back_north:0 "Marche vers le nord"
 CHI_CIVILWAR_drive_the_bandits_back_north_desc:0 "Le cours de la guerre tourne lentement en notre faveur, les communistes perdent peu à peu leur élan alors qu'ils tentent d'envoyer des hommes après des hommes contre nos bastions retranchés. Il est temps de commencer à les repousser vers le nord."
 CHI_CIVILWAR_pressure_end_to_arms_embargo:0 "La fin de l'embargo sur les armes"
 CHI_CIVILWAR_pressure_end_to_arms_embargo_desc:0 "Alors que la mission Marshall progressait lentement vers la fin de la guerre civile chinoise, les Américains ont décidé de nous imposer un embargo sur les armes et ont cessé toute importation d'armes en provenance de ce pays, dans une ultime tentative pour nous forcer à faire des compromis avec les communistes à la table des négociations. Maintenant que le soutien dont nous bénéficions aux États-Unis est à son plus haut niveau, nous devons l'utiliser pour faire pression sur le gouvernement américain afin qu'il mette fin à l'embargo sur les armes et renoue son soutien, plutôt que de laisser la Chine tomber aux mains des communistes influencés par l'Union soviétique."
 CHI_CIVILWAR_reapproach_li_zongren:0 "Renouer le dialogue avec Li Zongren"
 CHI_CIVILWAR_reapproach_li_zongren_desc:0 "Avec l'aide de Yan Xishan, les tensions entre la nouvelle clique du Guangxi et le gouvernement central se sont apaisées, car nous sommes confrontés à un ennemi commun qui souhaite détruire notre République."
 CHI_CIVILWAR_coup_li_zongren:0 "Coup d'État de Li Zongren"
 CHI_CIVILWAR_coup_li_zongren_desc:0 "Maintenant que les tensions avec Li sont faibles, nous pouvons facilement le prendre par surprise et le forcer à quitter la Chine grâce à un coup d'État militaire à Guangzhou. Nous rétablirons alors Chiang dans ses fonctions de président légitime de la République et aurons le contrôle total sur les affaires du gouvernement."
 CHI_Isolate_Chiangs_enemies:0 "Isoler les ennemis de Chiang"
 CHI_Isolate_Chiangs_enemies_desc:0 "Avec la chute du continent, les différentes factions et les seigneurs de guerre ont perdu leur base de soutien au sein de notre gouvernement et constituent désormais un obstacle moindre à la réforme. Le projet de réforme du Kuomintang par les généralissimos se heurtera à une forte résistance de la part de ces groupes, mais nous ne pouvons prendre aucun risque susceptible de compromettre la transformation du parti. Nous mettrons les opposants de Chiang sur la touche en leur attribuant des postes honorifiques mais sans importance politique au sein de notre gouvernement."
 CHI_Establish_the_Central_Reform_Committee:0 "Créer le Comité central de réforme"
 CHI_Establish_the_Central_Reform_Committee_desc:0 "Nous n'avons pas perdu la guerre civile à cause de facteurs militaires, mais plutôt à cause de la puissance organisationnelle supérieure du PCC. Le Comité central de réforme (CRC) existera en tant que nouvelle institution centrale du KMT, avec pour objectif de réinventer le parti et d'en faire une institution démocratique révolutionnaire. Le but ultime du CRC est la renaissance du parti, afin qu'il puisse servir de base solide à la reconquête du continent aux mains des bandits communistes !"
 CHI_create_advisory_group:0 "Introduire des groupes consultatifs"
 CHI_create_advisory_group_desc:0 "Nous allons créer un groupe consultatif de vingt-cinq personnes, avec Zhang Qiyun comme secrétaire général, qui assistera le Comité central de réforme. Ce nouvel organe consultatif sera chargé de divers sous-comités et agences spécialisés dans la mise en œuvre de tâches de réforme spécifiques, le recrutement et la formation des cadres du parti, la gestion des affaires du parti et la planification politique. Il apportera un soutien considérable au CRC et garantira la croissance du Kuomintang en tant que parti révolutionnaire efficace et véritablement performant."
 CHI_declare_sanmin_doctrine_state_doctrine:0 "Déclarer le tridéisme doctrine d'État"
 CHI_declare_sanmin_doctrine_state_doctrine_desc:0 "Le Dr Sun Yat-sen est le père fondateur de la République de Chine et a développé la philosophie des Trois principes du peuple, combinant démocratie, bien-être et nationalisme. Le nouveau Kuomintang purifiera sa pensée et sera prêt à établir les Trois principes à Taïwan afin de servir de modèle à une Chine véritablement moderne, démontrant que les idéologies communistes sont néfastes pour le peuple chinois et sa culture."
 CHI_end_party_factionalism:0 "Fin du sectarisme politique"
 CHI_end_party_factionalism_desc:0 "Les anciennes cliques et les anciens seigneurs de guerre se sont révélés être un obstacle aux réformes de notre parti. Le généralissime prévoit de les isoler et de les mettre sur la touche en créant un Comité consultatif central, un organe honorifique directement sous son contrôle mais sans pouvoir. Le CRC affectera ensuite les membres du Club central des frères Chen, de la clique du Guangxi et du Groupe d'étude politique (Zhengxuexi) au Comité consultatif, honorant ainsi les vétérans du parti tout en les marginalisant, afin de les empêcher de diviser la nouvelle direction du parti."
 CHI_encourage_neo_confucian_thinking:0 "Encourager la pensée néo-confucéenne"
 CHI_encourage_neo_confucian_thinking_desc:0 "Chaque membre du parti sera encouragé à s'engager dans une démarche d'introspection et d'autocritique afin de garantir que la corruption et le factionnalisme disparaissent progressivement au fil du temps. Seule l'introspection sur nos erreurs commises sur le continent nous apprendra comment améliorer le parti, et chaque cadre du parti devra donc passer par ce processus."
 CHI_recruit_former_party_members:0 "Recruter d'anciens membres du parti"
 CHI_recruit_former_party_members_desc:0 "Après la création du CRC, celui-ci approuvera les mesures visant à réinscrire les membres qui avaient perdu le contact avec le Parti pendant la période de confusion de la guerre civile et la retraite à Taïwan. On s'attend à ce que, pendant les 20 jours d'inscription, plus de 20 000 membres présentent leur candidature et se voient remettre une nouvelle carte du Parti. Ensuite, les antécédents et le comportement de chaque membre du Parti seront évalués. Ce processus se déroulera en trois étapes : accusations d'actes répréhensibles ; délibération (y compris enquête, autocritique, jugement et décision) ; et enfin sanction."
 CHI_recruit_taiwanese_elites_into_party:0 "Recruter des intellectuels taïwanais au sein du Kuomintang"
 CHI_recruit_taiwanese_elites_into_party_desc:0 "Avec la confiscation des terres de la noblesse taïwanaise par le gouvernement et l'autorisation des élections locales, de plus en plus d'intellectuels taïwanais influents ont demandé à adhérer au Kuomintang. Afin d'apaiser les autochtones, nous leur permettrons de rejoindre le parti afin de gagner davantage de soutien populaire pour le mouvement nationaliste."
 CHI_ensure_effective_and_high_quality_government:0 "Assurer une gouvernance efficace et efficiente"
 CHI_ensure_effective_and_high_quality_government_desc:0 "Afin de garantir le succès de nos réformes, nous devons mettre en place un contrôle et une surveillance stricts des cadres et des comités du parti, tout en contribuant à élargir notre audience sociale en intégrant les paysans et les ouvriers au sein du parti. Ces mesures permettront d'éviter que le parti ne retombe dans le factionnalisme, l'opportunisme et la corruption. Le parti deviendra ainsi une base solide pour reconquérir la Chine continentale."
 CHI_Sinicization_of_taiwan:0 "La sinisation de Taïwan"
 CHI_Sinicization_of_taiwan_desc:0 "Après 50 ans de domination japonaise, nous devons resiniser le peuple taïwanais afin d'établir une base chinoise solide pour reprendre le continent aux bandits communistes traîtres !"
 CHI_change_the_curriculum:0 "Modifier le programme scolaire"
 CHI_change_the_curriculum_desc:0 "Nous abolirons l'ancien programme japonais et mettrons en place un nouveau programme chinois, mettant l'accent sur la pensée néo-confucéenne, les trois principes du peuple, l'anticommunisme ainsi que l'histoire chinoise."
 CHI_promote_mandarin:0 "Mouvement national de promotion de la langue"
 CHI_promote_mandarin_desc:0 "Dans le cadre de nos réformes éducatives, nous mettrons l'accent sur l'utilisation du mandarin non seulement dans nos écoles, mais aussi dans les établissements publics et les transports en commun. Cela contribuera davantage à unir la population taïwanaise contre la menace du PCC et nous aidera à atteindre notre objectif de créer une province chinoise moderne modèle. À cet égard, le gouvernement débat actuellement du statut des langues locales et de leur rôle dans nos campagnes."
 CHI_tolerate_taiwanese_cultural_groups:0 "Tolérance envers la culture autochtone"
 CHI_tolerate_taiwanese_cultural_groups_desc:0 "Bien que la culture taïwanaise ait été profondément transformée sous l'empire japonais, divers facteurs, traditions et normes qui la distinguent des cultures continentales ont survécu à l'occupation. Nous devrions envisager d'accorder aux autochtones une certaine liberté culturelle afin de nous assurer de leur soutien à notre cause."
 CHI_teach_neo_confuzian_values:0 "Enseigner les valeurs néo-confucéennes"
 CHI_teach_neo_confuzian_values_desc:0 "Il est important que non seulement les cadres de notre parti, mais aussi nos enfants apprennent l'art de l'autocritique et de l'introspection. De cette manière, l'efficacité de notre cause et de notre société pourra être renforcée, ce qui nous aidera grandement à éviter toute corruption et tout opportunisme au sein de notre parti et de notre société."
 CHI_purge_japanese_teachers:0 "Purge des vestiges japonais"
 CHI_purge_japanese_teachers_desc:0 "Après l'arrivée du KMT à Taïwan en 1945, nous avons déployé divers efforts pour éliminer l'ancienne bureaucratie japonaise. Nous devons poursuivre notre programme en renvoyant les anciens enseignants japonais de Taïwan et en les remplaçant par des enseignants han-chinois qui enseigneront à nos enfants les seules valeurs et normes véritables, et non l'ancienne propagande impériale japonaise et la suprématie culturelle japonaise."
 CHI_Anti_communist_propaganda:0 "Diffuser la propagande anticommuniste"
 CHI_Anti_communist_propaganda_desc:0 "Les Japonais n'étaient qu'une maladie de la peau, tandis que les communistes étaient une maladie du cœur. Pures marionnettes de l'impérialisme soviétique, ils tentent d'imposer leur idéologie totalitaire au peuple chinois et de détruire la culture et la pensée chinoises. Taïwan deviendra le modèle d'une Chine moderne, tout en continuant à honorer son histoire et sa culture chinoises. Nous préparerons le peuple à la reconquête de la Chine continentale, afin que la Chine puisse à nouveau se libérer de l'impérialisme étranger."
 CHI_Emphazise_Sanmin:0 "Mettre l'accent sur la doctrine San-Min"
 CHI_Emphazise_Sanmin_desc:0 "Nous diffuserons la philosophie du Dr Sun sur les trois principes du peuple à Taïwan. Même les autochtones doivent apprendre les grandes idées et les normes proposées par le père fondateur de la Chine moderne afin de transformer notre société en une communauté chinoise véritablement moderne, où la démocratie, le bien-être et le nationalisme ne sont pas seulement un rêve, mais une réalité."
 CHI_expand_primary_and_higher_education:0 "Réouverture des écoles privées"
 CHI_expand_primary_and_higher_education_desc:0 "De nombreux continentaux et Taiwanais âgés sont toujours mécontents du système éducatif que nous avons mis en place. Il est temps pour nous de rouvrir les écoles privées afin de les apaiser. Cependant, nous installerons dans ces écoles privées des personnes loyales afin de nous assurer qu'elles n'enseignent pas d'idéaux antipatriotiques."
 CHI_presidential_election_taiwan:0 "L'élection présidentielle de 1954"
 CHI_presidential_election_taiwan_desc:0 "Aujourd'hui, dans la grande salle Chung-Shan à Taipei, l'Assemblée nationale élira le président de la République de Chine ainsi que le vice-président. Le généralissime Chiang est au sommet de son influence grâce aux réformes qu'il a menées au sein de son parti, et son proche collaborateur Chen Cheng, qui occupe déjà le poste de Premier ministre, sera candidat à la vice-présidence."
 CHI_waishen_dominated_bureaucracy:0 "Une bureaucratie continentale"
 CHI_waishen_dominated_bureaucracy_desc:0 "Il est préférable de nommer des membres loyaux du parti originaires du continent à des postes bureaucratiques et politiques importants. Ils comprennent véritablement notre cause et notre idéologie, il est donc naturel qu'ils dirigent notre gouvernement et notre bureaucratie."
 CHI_ban_opposition_parties:0 "Interdire les Partis d'Opposition"
 CHI_ban_opposition_parties_desc:0 "Les partis prônant le communisme, l'indépendance de Taïwan et d'autres idéologies contraires au tridemisme seront interdits en République de Chine. Ils ne feraient que diviser la population et rendre impossible la reconquête de la mère patrie."
 CHI_allow_local_elections:0 "Autoriser les élections locales"
 CHI_allow_local_elections_desc:0 "Nous permettrons au Dr Suns de mettre en œuvre sa « volonté du peuple » en autorisant des élections locales à Taïwan. Elles seront plus ouvertes et plus compétitives que les élections nationales. Si les membres du KMT seront favorisés lors des nominations, cela encouragera les élites et les intellectuels taïwanais locaux à rejoindre le parti, ce qui nous donnera plus de légitimité en tant que parti du peuple. Les dirigeants élus localement pourront toujours exercer leur influence sur les affaires locales. La démocratie commencera par la base et finira par atteindre le niveau national."
 CHI_expand_advisory_groups:0 "Développer les groupes consultatifs"
 CHI_expand_advisory_groups_desc:0 "Afin d'inclure davantage d'anciens gouverneurs, amiraux, généraux et universitaires dans la masse salariale du gouvernement, le bureau présidentiel sera élargi pour inclure ces personnes dans divers comités consultatifs nationaux, commissions et autres institutions."
 CHI_utilize_intellectuals:0 "Utiliser les intellectuels"
 CHI_utilize_intellectuals_desc:0 "Contrairement au président Mao, qui est un rustre, le président Chiang comprend parfaitement l'importance de l'élite pour la modernisation. Il sélectionnera des responsables économiques exceptionnels qui seront chargés d'élaborer les premières stratégies de croissance économique de Taïwan."
 CHI_appoint_chiang_ching_kuo_secret_police_director:0 "Nommer Chiang Ching-kuo directeur de la police secrète"
 CHI_appoint_chiang_ching_kuo_secret_police_director_desc:0 "Grâce à sa formation en Union soviétique, le fils du généralissime s'avérera être un chef efficace de la police secrète. Il assurera la stabilité et éliminera toute dissidence politique."
 CHI_establish_green_island_prison:0 "Créer la prison de Green Island"
 CHI_establish_green_island_prison_desc:0 "Green Island servira de lieu isolé et d'exil pour les prisonniers politiques pendant notre règne. Toutes les forces procommunistes qui tentent de détruire l'ordre politique en République de Chine seront envoyées ici, afin qu'elles ne puissent plus causer de troubles ni de dissidence."
 CHI_postpone_elections:0 "Reporter les élections au Yuan législatif"
 CHI_postpone_elections_desc:0 "Le Yuan législatif actuel a été élu en 1948, alors que nous contrôlions la majeure partie du territoire continental chinois. Ces mandats représentent la volonté de toute la nation chinoise, il est donc tout à fait naturel qu'ils soient maintenus jusqu'à ce que le continent soit libéré du PCC !"
 CHI_Arrest_Sun_Li_jen:0 "Arrêter Sun Li-jen"
 CHI_Arrest_Sun_Li_jen_desc:0 "Le général a eu assez de liberté ! Pour avoir conspiré en vue de renverser Tchang Kaï-chek, Sun Li-Jen a été relevé de ses fonctions et assigné à résidence. Cela devrait servir d'exemple aux autres officiers supérieurs de l'armée, qui doivent faire passer leur pays avant tout le reste."
 CHI_supremacy_Chiang:0 "Le triomphe de Tchang Kaï-chek"
 CHI_supremacy_Chiang_desc:0 "Chiang Kai-Shek triomphe de ses ennemis au sein de son cercle restreint. Il a guidé la République pendant la Seconde Guerre mondiale et continuera à la guider vers de nouveaux sommets. Le généralissime Chiang reprendra le continent aux bandits communistes et réunifiera la Chine sous la bannière républicaine."
 CHI_formation_of_china_democratic_party:0 "Création du Parti démocratique chinois"
 CHI_formation_of_china_democratic_party_desc:0 "L'ancien responsable du parti Lei Chen a formé un nouveau parti, le CDP, abréviation de China Democratic Party (Parti démocratique chinois). Il comprend diverses autres voix libérales telles que Hu Shih, Hsu-Shih-hsien et Huang Hua. Tout en restant fondamentalement anticommuniste, le parti prône une coopération étroite entre les continentaux et les Taiwanais de souche, afin de construire une structure plus démocratique en République de Chine. Il appartient désormais au gouvernement de se prononcer sur la légalité et la légitimité du parti."
 CHI_seventh_national_congress_kmt:0 "Le septième congrès national du KMT"
 CHI_seventh_national_congress_kmt_desc:0 "Le septième congrès national du KMT sera le premier congrès organisé sur l'île de Taïwan. Il marquera officiellement la fin de la période de réforme entre 1950 et 1952 et permettra de faire le point sur lesdites réformes."
 CHI_renew_temporary_provisions:0 "Renouveler les dispositions temporaires"
 CHI_renew_temporary_provisions_desc:0 "Il est désormais clair que les dispositions temporaires en vigueur pendant la période de mobilisation nationale pour la répression de la rébellion communiste ne peuvent pas encore être suspendues. Nous demanderons à l'Assemblée nationale de les renouveler, afin de préparer nos forces au conflit final entre la Chine libre et le continent occupé par les communistes."
 CHI_soft_grip_censorship:0 "Approche souple de la censure"
 CHI_soft_grip_censorship_desc:0 "Bien que nous ne puissions évidemment pas autoriser les journaux communistes à diffuser leur propagande, nous autoriserons d'autres journaux, tels que les journaux libéraux, sociaux-démocrates et autochtones. Cela nous permettra certainement de gagner davantage le soutien de la population taïwanaise indigène."
 CHI_intensify_newspaper_censorship:0 "Intensifier la censure des journaux"
 CHI_intensify_newspaper_censorship_desc:0 "Nous ne pouvons tolérer aucun journal diffusant de la propagande communiste. Nous remplacerons ces journaux rebelles par des sources d'information loyales et dignes de confiance."
 CHI_The_Economy_of_Taiwan:0 "L'économie taïwanaise"
 CHI_The_Economy_of_Taiwan_desc:0 "Avec le continent aux mains des communistes, nous devons repartir de zéro. Nous devons évaluer soigneusement notre situation politique et nous en servir comme base pour planifier nos futures politiques économiques."
 CHI_Land_reform_rent_cap:0 "Introduire des plafonds pour les loyers fonciers"
 CHI_Land_reform_rent_cap_desc:0 "Dans le cadre de la première étape de nos programmes de réforme agraire, nous réduirons les loyers que les paysans doivent payer à leurs propriétaires fonciers. Le Premier ministre Chen Cheng propose une limite de 37,5 %, qui doit encore être discutée au sein du Comité central de réforme."
 CHI_Land_reform_sell_public_land:0 "Vendre un terrain public"
 CHI_Land_reform_sell_public_land_desc:0 "Les anciennes terres des seigneurs japonais ont été abandonnées par les forces japonaises en retraite après 1945. Le gouvernement continental saisira ces terres et les vendra à des locataires pauvres à un prix bien inférieur à celui du marché. Nous leur donnerons 10 ans pour acheter leurs terres au moyen de produits agricoles plutôt que d'argent liquide, sans intérêts."
 CHI_Land_reform_establish_land_offices:0 "Créer des bureaux de vulgarisation agricole"
 CHI_Land_reform_establish_land_offices_desc:0 "Des bureaux d'évaluation foncière et de vulgarisation agricole seront créés par le bureau foncier du gouvernement, qui supervisera le démarrage des associations d'agriculteurs et d'irrigation, des organes quasi gouvernementaux qui ont aidé les agriculteurs locaux à suivre les directives gouvernementales."
 CHI_Land_reform:0 "Les propositions de réforme agraire de Chen Cheng"
 CHI_Land_reform_desc:0 "Des rapports provenant du continent indiquent que les redistributions foncières violentes menées par le PCC entraînent des purges massives, des exécutions et des tortures à l'encontre des propriétaires fonciers locaux. Le Premier ministre Chen Cheng estime qu'une réforme agraire modérée réduirait le soutien au communisme et a déjà présenté des plans de réforme agraire au président à Taipei."
 CHI_Land_reform_land_to_the_tiller:0 "Loi sur l'attribution des terres aux cultivateurs de [GetYear]"
 CHI_Land_reform_land_to_the_tiller_desc:0 "La loi « Land to the Tiller » (la terre à celui qui la cultive) indemnisera les anciens propriétaires fonciers de Taïwan en leur accordant des obligations foncières et des actions d'entreprises publiques privatisées, et en les encourageant à s'engager dans la politique locale."
 CHI_Land_reform_modernisation_funds_for_new_farmers:0 "Aides financières pour les nouveaux propriétaires fonciers"
 CHI_Land_reform_modernisation_funds_for_new_farmers_desc:0 "Nous accorderons aux nouveaux propriétaires fonciers plusieurs prêts afin de moderniser leurs exploitations agricoles et leurs systèmes d'irrigation. Cela garantira l'efficacité et la croissance agricole, tout en renforçant considérablement le soutien populaire au Kuomintang."
 CHI_Land_reform_encourage_industrial_investment:0 "Encourager les investissements industriels"
 CHI_Land_reform_encourage_industrial_investment_desc:0 "Nous encouragerons les anciens propriétaires fonciers à investir leurs nouveaux prêts et leurs actions dans l'industrie afin de garantir la croissance économique en dehors du secteur agricole et de soutenir les entreprises privées qui se voient confier des contrats gouvernementaux."
 CHI_introduce_a_gold_saving_deposit_program:0 "Lancer un programme de dépôt d'épargne en or"
 CHI_introduce_a_gold_saving_deposit_program_desc:0 "Nous mettrons en place un programme d'épargne-or afin de permettre aux particuliers de déposer leurs nouveaux dollars taïwanais sur des comptes rémunérés en or à l'échéance. De cette manière, nous maintiendrons notre monnaie à un niveau élevé et contrerons le risque d'aggravation de l'inflation."
 CHI_Establish_new_exchange_rates:0 "Établir de nouveaux taux de change"
 CHI_Establish_new_exchange_rates_desc:0 "Le nouveau dollar taïwanais sera établi avec un taux de change de 1 pour 40 000. Les citoyens recevront un NT$ pour chaque tranche de 40 000 anciens yuans taïwanais."
 CHI_allow_limited_foreign_exchange:0 "Autoriser les opérations de change limitées"
 CHI_allow_limited_foreign_exchange_desc:0 "Le ministère des Affaires étrangères a décidé que le NTD serait partiellement convertible, de sorte que les devises étrangères sont disponibles pour un grand nombre de paiements et d'investissements extérieurs au taux d'environ NT$5 for US$1."
 CHI_protectonism_agenda:0 "Protectionnisme"
 CHI_protectonism_agenda_desc:0 "Notre programme de substitution des importations prévoit l'importation de biens de production plutôt que de biens de consommation. Nous ajusterons nos tarifs douaniers actuels, nos contrôles à l'importation ainsi que nos taux de change afin de promouvoir davantage la substitution des importations."
 CHI_emphazise_on_import_of_production_goods:0 "Importation de biens de production"
 CHI_emphazise_on_import_of_production_goods_desc:0 "Afin de relancer l'industrialisation de la République de Chine, nous mènerons une politique économique de substitution des importations, axée sur l'importation de biens de production destinés à la fabrication locale plutôt que sur l'importation de biens de consommation."
 CHI_import_substitution:0 "Promouvoir l’industrie légère"
 CHI_import_substitution_desc:0 "Avec l'importation rapide de nouveaux biens de production en provenance des États-Unis d'Amérique, nous devons encourager l'industrie légère à forte intensité de main-d'œuvre de Taïwan à répondre aux besoins intérieurs de notre population."
 CHI_focus_on_agricultural_exports:0 "Exportation de produits agricoles"
 CHI_focus_on_agricultural_exports_desc:0 "Avec l'augmentation de l'efficacité et de la production de notre secteur agricole, nous concentrerons notre politique d'exportation sur les produits agricoles destinés à la communauté internationale. Cependant, cela ne suffira probablement pas à combler notre déficit commercial, compte tenu de notre dépendance à l'égard des importations de matières premières et d'équipements. Néanmoins, cela permettra de détourner davantage de capitaux vers Taipei."
 CHI_divert_labor_overflow_to_light_industries:0 "Réorienter l'excédent de main-d'œuvre vers l'industrie légère"
 CHI_divert_labor_overflow_to_light_industries_desc:0 "À mesure que la productivité agricole augmente, un surplus de main-d'œuvre agricole devient disponible. Le gouvernement réaffectera cette main-d'œuvre à des industries légères et à forte intensité de main-d'œuvre telles que les produits du bois, les textiles, les produits en plastique, le papier et les appareils électriques. Ces industries ne nécessitent pas beaucoup de capitaux ni de main-d'œuvre qualifiée, mais offrent un retour sur investissement rapide."
 CHI_promote_private_enterprises:0 "Promouvoir les entreprises privées"
 CHI_promote_private_enterprises_desc:0 "Le projet d'« économie de marché planifiée » de Yin Zhongrong prévoit la coexistence d'entreprises privées et d'entreprises publiques. Si les entreprises publiques ont la priorité en matière de contrats gouvernementaux, nous demanderons à des entreprises privées, telles que Taiwan Cement et Taiwan Pulp and Paper, de reprendre les activités auparavant détenues par l'État dans les secteurs du ciment, du papier, de l'agriculture et de la sylviculture afin de promouvoir l'économie de marché."
 CHI_appoint_Yin_Zhongrong_minister_of_economic_affairs:0 "Nommer Yin Zhongrong ministre des Affaires économiques"
 CHI_appoint_Yin_Zhongrong_minister_of_economic_affairs_desc:0 "Yin Zhongrong, bien qu'il ne soit pas membre du Kuomintang, a précédemment occupé divers postes dans des entreprises privées à Shanghai et possède une grande connaissance et une grande expérience du fonctionnement du marché. Le Premier ministre Chen Cheng estime que le potentiel de cet homme peut grandement profiter aux affaires économiques de Taïwan et a donc suggéré de le nommer ministre des Affaires étrangères de la République."
 CHI_50s_Launch_of_the_first_four_year_plan:0 "Lancer le plan quadriennal"
 CHI_50s_Launch_of_the_first_four_year_plan_desc:0 "Avec peu ou pas de possibilités de reconquérir le continent, nous devons trouver un autre moyen de consolider nos territoires actuels au lieu de perdre notre temps à Taiwan. Nous allons lancer le premier plan quadriennal, un programme de développement bien planifié de nos secteurs industriels légers afin de promouvoir l'autosuffisance et de mettre fin à notre dépendance vis-à-vis des importations massives."
 CHI_50s_focus_on_the_textile_industrial_sector:0 "Priorité sur le secteur textile"
 CHI_50s_focus_on_the_textile_industrial_sector_desc:0 "À l'heure actuelle, nous enregistrons un déficit commercial important dans le secteur de la fabrication textile. Cette situation doit changer : nous devons nous concentrer sur le développement de l'industrie textile dans le pays et promouvoir son expansion, car elle peut facilement être fabriquée localement."
 CHI_50s_prioritize_the_fertilizer_industry:0 "S'intéresser à l'industrie des engrais"
 CHI_50s_prioritize_the_fertilizer_industry_desc:0 "L'industrie des engrais à Taïwan est synonyme d'argent, car le gouvernement de la République de Chine a réussi à monopoliser ce secteur auparavant. Nous devons désormais nous concentrer sur la promotion de son développement, puis utiliser ces engrais pour les vendre aux agriculteurs qui en ont besoin pour leur activité."
 CHI_50s_second_four_year_plan:0 "Lancer le deuxième plan quadriennal"
 CHI_50s_second_four_year_plan_desc:0 "La première s'est très bien déroulée, la plupart de nos industries légères ayant repris leurs activités et étant en plein essor. Nous devons désormais promouvoir le développement de l'industrie lourde et encourager les investissements étrangers dans le pays. Vers une nouvelle ère !"
 CHI_50s_electrify_the_island:0 "Électrifier l'île"
 CHI_50s_electrify_the_island_desc:0 "L'île a besoin d'électricité, car notre industrie en dépend pour fonctionner."
 CHI_50s_invite_japanese_investors:0 "Coopérer avec les technocrates japonais"
 CHI_50s_invite_japanese_investors_desc:0 "Des technocrates japonais nous ont contactés afin de nouer des partenariats pour de futurs investissements dans le pays, ce qui nous sera bénéfique à long terme."
 CHI_50s_appoint_educated_economists_and_professionals:0 "Recruter des économistes et des professionnels qualifiés"
 CHI_50s_appoint_educated_economists_and_professionals_desc:0 "Comme nous savons que les conseillers américains ne resteront pas longtemps parmi nous, nous devons rapidement trouver des remplaçants pour les économistes et les professionnels hautement qualifiés. Heureusement, de nombreux Chinois ont fait leurs études à l'étranger et sont revenus nous faire profiter de leurs connaissances."
 CHI_50s_seek_technological_advancements:0 "Rechercher les avancées technologiques"
 CHI_50s_seek_technological_advancements_desc:0 "Il faudrait mettre davantage l'accent sur les progrès technologiques dans le pays !"
 CHI_50s_develop_heavy_industry:0 "Développer l'industrie lourde"
 CHI_50s_develop_heavy_industry_desc:0 "Contrairement au premier plan quadriennal, nous avons décidé cette fois-ci de donner la priorité aux industries lourdes, notamment la production d'acier et d'autres secteurs, afin de renforcer notre autosuffisance."
 CHI_50s_national_defense_industrial_expansion:0 "Expansion industrielle dans le domaine de la défense nationale"
 CHI_50s_national_defense_industrial_expansion_desc:0 "Nos arsenaux militaires doivent être agrandis dans le cadre du deuxième plan quadriennal, car nous savons tous que les communistes vont tenter de s'attaquer à nouveau à l'une de nos îles."
 CHI_50s_manufacturing_hub_of_the_east:0 "Pôle industriel de l'Est"
 CHI_50s_manufacturing_hub_of_the_east_desc:0 "Enfin, nous avons surmonté les ravages économiques du passé et même dépassé les attentes en matière de réforme économique !"
 CHI_reopen_national_central_library:0 "Réouverture de la Bibliothèque nationale centrale"
 CHI_reopen_national_central_library_desc:0 "L'ancienne Bibliothèque centrale nationale de Nanjing rouvrira ses portes à Taipei, dans le district de Zhongzheng, en tant que seule bibliothèque nationale de Taïwan. Sa mission consiste à acquérir, cataloguer et conserver les publications nationales à l'usage du gouvernement, des chercheurs et du grand public. La collection de livres rares est l'une des plus importantes collections au monde de livres anciens et de manuscrits chinois. Elle soutiendra la recherche et les études sinologiques par l'intermédiaire du Centre d'études chinoises (CCS) qui lui est affilié."
 CHI_benevolent_leader_chiang:0 "Le général bienveillant"
 CHI_benevolent_leader_chiang_desc:0 "Les partis léninistes s'appuient généralement sur un dirigeant fort, quelqu'un que tout le monde admire, quelqu'un qui unit le peuple autour d'une cause. Une forme de culte de la personnalité (pas nécessairement aussi poussé que celui de Staline ou de Mao) est nécessaire pour personnaliser l'organisation du parti, par ailleurs très impersonnelle, et faciliter l'engagement des individus. Les membres du parti jurent ainsi fidélité au Généralissime, qui a défendu la nation contre l'impérialisme japonais et consacre tout son temps à lutter contre le mouvement communiste en Chine. Héritier du Dr Sun, le Koxinga moderne, il sauvera la Chine d'une mort certaine !"
 CHI_launch_voice_of_free_china:0 "La voix de la Chine libre"
 CHI_launch_voice_of_free_china_desc:0 "La Voix de la Chine libre a été créée le 10 octobre 1949, pendant les derniers jours de la guerre civile chinoise. Nous diffuserons vers le continent sous l'indicatif « Station centrale de radiodiffusion » afin de continuer à informer les masses continentales des agissements malfaisants du Parti communiste chinois."
 CHI_The_Fall_of_the_Mainland:0 "Le destin du continent"
 CHI_The_Fall_of_the_Mainland_desc:0 "Les forces de l'Armée populaire de libération, composée de traîtres, nous ont chassés du sud de la Chine ! Nous devons nous regrouper et nous replier sur l'île de Taïwan, puis nous reprendrons le continent lorsque le moment sera venu. Les communistes regretteront le jour où ils nous ont expulsés de notre patrie."
 CHI_Declaration_of_Martial_Law:0 "Déclaration de la loi martiale"
 CHI_Declaration_of_Martial_Law_desc:0 "Afin de préserver la sécurité nationale de notre nouvelle République, la loi martiale doit être déclarée. Nous devons nous préparer à toute attaque sur notre sol et planifier la reconquête du continent et la défaite des communistes !"
 CHI_Elections_of_1954:0 "Élections de 1954"
 CHI_Elections_of_1954_desc:0 "Les élections générales de 1954 opposent le Parti démocratique populaire, le Parti communiste taïwanais et le Parti socialiste démocratique chinois. Le peuple s'exprimera par son vote !"
 CHI_Elections_of_1958:0 "Élections de 1958"
 CHI_Elections_of_1958_desc:0 "Les élections générales de 1958 opposent le Parti démocratique populaire, le Parti communiste taïwanais et le Parti socialiste démocratique chinois. Le peuple s'exprimera par son vote !"
 CHI_The_Hyperinflation_Crisis:0 "La crise de l'hyperinflation"
 CHI_The_Hyperinflation_Crisis_desc:0 "Nous devons lutter contre la crise d'hyperinflation provoquée par la guerre civile ! Un nouveau dollar taïwanais sera créé pour remplacer l'ancien dollar taïwanais et le yen taïwanais."
 CHI_Republic_of_China_Armed_Forces:0 "Forces armées de la République de Chine"
 CHI_Republic_of_China_Armed_Forces_desc:0 "Afin de lutter contre la menace communiste, nos forces doivent être fortes, bien entraînées et compétentes, afin de reprendre les terres qui nous appartiennent de droit !"
 CHI_Republic_of_China_Air_Force:0 "Force Aérienne de la République de Chine"
 CHI_Republic_of_China_Air_Force_desc:0 "Nous devons nous défendre contre les menaces aériennes révolutionnaires en utilisant de nouvelles technologies et de nouveaux avions, afin de combattre les forces communistes qui s'emparent de nos terres."
 CHI_Re_Establish_the_Air_Force_Academy:0 "Rétablir l'Académie de l'armée de l'air"
 CHI_Re_Establish_the_Air_Force_Academy_desc:0 "Pour constituer une force aérienne efficace, nous avons besoin non seulement d'avions, mais aussi d'officiers compétents. C'est précisément l'objectif de l'Académie de l'armée de l'air de la République de Chine, qui forme de jeunes hommes pour qu'ils deviennent la prochaine génération de l'armée de l'air."
 CHI_Surplus_American_Aircraft:0 "Avions américains excédentaires"
 CHI_Surplus_American_Aircraft_desc:0 "Pour nous aider, nous accepterons les avions excédentaires des États-Unis, afin de pouvoir mettre efficacement en place notre puissante force aérienne."
 CHI_Develop_Airbases_on_Kinmen:0 "Développer des bases aériennes à Kinmen et Matsu"
 CHI_Develop_Airbases_on_Kinmen_desc:0 "Kinmen et Matsu seront les premiers lieux de combat si nous ou les bandits communistes osons lancer une attaque. Nous devons renforcer leurs infrastructures militaires, en commençant par des bases aériennes modernes afin d'exploiter pleinement notre supériorité aérienne sur l'APL."
 CHI_black_bat_squadrons:0 "Les escadrons Black Cat"
 CHI_black_bat_squadrons_desc:0 "Le Black Cat Squadron, anciennement le 34e escadron, est une unité aérienne secrète de l'armée de l'air de la République qui mène des missions de reconnaissance au-dessus de la Chine continentale et parachute des agents dans les zones contrôlées par les communistes afin de recueillir des renseignements militaires."
 CHI_flying_with_the_usaf:0 "Voler avec l'USAF"
 CHI_flying_with_the_usaf_desc:0 "Avec l'aide et l'assistance de l'armée de l'air américaine, nous pouvons acquérir des tactiques et une expérience cruciales pour nous préparer au conflit inévitable avec l'Armée populaire de libération. Le soutien aérien est le facteur le plus important dans la guerre moderne et il est donc indispensable de lui accorder la plus haute priorité pour réussir l'invasion du continent."
 CHI_The_Fate_of_Hainan:0 "Le destin de Hainan"
 CHI_The_Fate_of_Hainan_desc:0 "Merde"
 CHI_Victory_in_Hainan:0 "Victoire à Hainan"
 CHI_Victory_in_Hainan_desc:0 "Les tentatives des communistes de prendre l'île de Hainan par la force ont échoué ! Nos forces ont mis en place une défense impressionnante, nous considérons cela comme une victoire pour la République de Chine !"
 CHI_Haikou_Kaohsiung_naval_route:0 "Route maritime Haikou-Kaohsiung"
 CHI_Haikou_Kaohsiung_naval_route_desc:0 "Les îles de Hainan et Formose sont distantes de plus de 1 000 kilomètres l'une de l'autre. Nous devons pallier cette situation en augmentant les capacités de transport maritime sur les deux îles, afin d'assurer un approvisionnement et une communication efficaces entre les deux provinces."
 CHI_rebuild_minery_industry:0 "Reconstruire l'industrie minière"
 CHI_rebuild_minery_industry_desc:0 "L'industrie minière a été détruite par les Japonais en retraite et par les bombardements alliés. L'île est riche en minerais tels que le fer, l'or, le tungstène et la bauxite. Divers investissements et efforts doivent être consentis pour exploiter pleinement le potentiel des ressources de Hainan."
 CHI_interconnect_hainan:0 "Interconnecter Hainan"
 CHI_interconnect_hainan_desc:0 "Pendant l'occupation japonaise, les Japonais ont construit une ligne ferroviaire reliant les mines du sud-ouest au sud-est. Nous pouvons désormais la reconstruire et la prolonger jusqu'au port principal, ainsi que créer des routes et les infrastructures nécessaires à l'exploitation minière."
 CHI_subsidize_rubber_farms:0 "Subventionner les plantations de caoutchouc"
 CHI_subsidize_rubber_farms_desc:0 "Les forêts tropicales de l'intérieur des terres sont idéales pour la culture du caoutchouc, et subventionner les agriculteurs provenant d'autres régions tropicales d'Asie orientale s'avérera rentable."
 CHI_expand_textile_industry:0 "Développer l'industrie textile"
 CHI_expand_textile_industry_desc:0 "La plupart des capacités industrielles de Hainan ont été détruites par les Japonais pendant la guerre de résistance. Nous devons reconstruire l'industrie et rendre l'île autosuffisante."
 CHI_open_hainan_university:0 "Ouvrir l'université de Hainan"
 CHI_open_hainan_university_desc:0 "Hainan n'a pas été laissée de côté par nos troupes, nous devons désormais veiller à ce que, d'un point de vue social, l'extension des infrastructures éducatives et des centres de recherche soit bénéfique non seulement pour l'île, mais aussi pour l'ensemble de la République."
 CHI_prevent_future_invasions:0 "Prévenir les invasions futures"
 CHI_prevent_future_invasions_desc:0 "L'île a été sauvée des communistes une fois, mais cela ne signifie pas qu'ils ne tenteront pas à nouveau leur chance. Pour éviter cela, nous devons défendre la « Côte des Perles » contre toute attaque maritime."
 CHI_purge_remaining_guerrillas:0 "Éliminer les guérilleros restants"
 CHI_purge_remaining_guerrillas_desc:0 "Depuis 1927, divers groupes de soi-disant « combattants de la liberté » ont mené une guérilla sur l'île. Avec la récente invasion, certains de ces groupes ont récupéré le matériel laissé par les forces communistes en retraite. Nous devons éradiquer ces dangereux rebelles une fois pour toutes !"
 CHI_Sinification_campaigns_Hainan:0 "Sinisation de Hainan"
 CHI_Sinification_campaigns_Hainan_desc:0 "Hainan fait partie de la Chine depuis l'ancienne dynastie Han (206 av. J.-C.), il serait insensé de s'éloigner de la culture chinoise. Nous allons lancer de nouvelles campagnes de sinisation sur l'île, afin de rappeler aux habitants qu'ils font partie de la plus grande nation de la planète depuis l'Antiquité."
 CHI_Retaliate_with_Natives:0 "Riposter avec les autochtones"
 CHI_Retaliate_with_Natives_desc:0 "Au lieu d'imposer notre volonté aux habitants de l'île, nous tenterons de trouver un juste milieu, en recherchant un compromis qui allie la tolérance culturelle régionale et la promotion de la culture cantonaise sur l'île."
 CHI_Send_Bai_chongxi_to_hainan:0 "Envoyer Bai Chongxi chez les Utsuls"
 CHI_Send_Bai_chongxi_to_hainan_desc:0 "Bai Chongxi, ancien chef de guerre du Guangxi, occupe actuellement le poste de général musulman au sein des forces armées ; il collecte des fonds pour construire des mosquées à Taïwan et s'imposer comme le leader de la communauté musulmane. Les Utsuls, minorité musulmane de Hainan, l'accueilleront sans aucun doute à bras ouverts, tout comme ses initiatives, ce qui contribuera à apaiser les tensions sur l'île."
 CHI_Republic_of_China_Army:0 "Armée de la République de Chine"
 CHI_Republic_of_China_Army_desc:0 "Notre nouvelle armée doit être forte et bien entraînée pour combattre les forces communistes infâmes. Nous devons constituer une force compétente et nombreuse pour vaincre ces bandits communistes !"
 CHI_listen_to_Sun_li_jen:0 "Soutenir les réformes de Sun Li-jen"
 CHI_listen_to_Sun_li_jen_desc:0 "Le général Sun Li-jen a suivi une formation aux États-Unis et les fonctions qu'il a exercées pendant la guerre de résistance lui ont valu le statut de héros de guerre légendaire. Ses liens étroits avec l'armée américaine et la CIA offrent un formidable potentiel pour mener à bien des réformes visant à améliorer l'efficacité au sein des forces armées."
 CHI_empower_the_maag:0 "Renforcer le MAAG"
 CHI_empower_the_maag_desc:0 "Nous accorderons davantage de liberté au Groupe consultatif d'assistance militaire américain (MAAG) au sein de nos forces armées. À l'heure actuelle, ce groupe supervise la formation doctrinale ainsi que diverses autres tactiques et stratégies, mais nous lui accorderons davantage de liberté dans d'autres domaines, tels que la formation des soldats, des généraux et des forces de police."
 CHI_indoctrinate_officiers:0 "Endoctriner les forces armées"
 CHI_indoctrinate_officiers_desc:0 "Des officiers, des fonctionnaires et des cadres du parti seront sélectionnés pour intégrer l'Académie d'étude de la mise en œuvre de la révolution, afin d'harmoniser leur orientation politique et d'éviter qu'ils ne s'écartent de la ligne officielle et ne forment des cliques politiques opposées à Tchang Kaï-chek."
 CHI_establish_the_china_youth_corps:0 "Créer le Corps de la jeunesse chinoise"
 CHI_establish_the_china_youth_corps_desc:0 "Le Corps national de salut de la jeunesse chinoise sera l'organisation officielle de la jeunesse de la République de Chine. Chiang Ching-kuo en sera élu premier président et aura pour objectif de dispenser une formation militaire de base aux jeunes avant leur incorporation dans l'armée de la République de Chine."
 CHI_further_excersises_with_us_troops:0 "Poursuivre les exercices avec les Américains"
 CHI_further_excersises_with_us_troops_desc:0 "Nous veillerons à ce qu'un plus grand nombre de conseillers américains du MAAG encadrent nos soldats lors des exercices. Ils apporteront leur soutien à nos troupes grâce à des systèmes de communication sans fil modernes, ce qui renforcera notre efficacité militaire face à l'Armée populaire de libération."
 CHI_amend_act_of_military_system:0 "Modifier la loi sur le service militaire"
 CHI_amend_act_of_military_system_desc:0 "La Chine continentale dispose d'un avantage considérable en termes d'effectifs par rapport à nous, ce qui rend tout simplement invraisemblable l'idée même d'envahir le continent avec nos troupes de qualité « à l'américaine », dont les effectifs sont si réduits. Nous devons réformer le système de service militaire : les citoyens de sexe masculin devront effectuer 2 à 3 ans de service actif dans les forces armées, selon la branche (2 ans pour l'armée de terre, 3 ans pour la marine, l'armée de l'air et le corps des marines). La loi modifiée a également mis en place un système permettant au ministère de la Défense nationale de sélectionner des officiers de réserve et des sous-officiers de réserve parmi les citoyens de sexe masculin en service actif, renforçant ainsi nos capacités de mobilisation militaire."
 CHI_adopt_soviet_style_command_structure:0 "Tirer parti de la formation soviétique de Chiang Ching-kuo"
 CHI_adopt_soviet_style_command_structure_desc:0 "Grâce à l'expérience de Chiang Ching-kuo, le fils de notre président, nous mettrons en œuvre dans notre armée des réformes militaires inspirées du modèle soviétique, écartant ainsi le général Sun Li-jen et ses partisans pro-américains. Nous pourrons ainsi renforcer considérablement le corps des officiers politiques et étendre l'influence du KMT au sein des forces armées."
 CHI_American_Arms:0 "Armes américaines"
 CHI_American_Arms_desc:0 "Nous devons nous procurer les tout derniers modèles d'armes américaines pour équiper et former nos forces armées ; cela permettra à notre armée d'être forte et de vaincre ces communistes traîtres !"
 CHI_Urban_Warfare_Training:0 "Formation au combat en milieu urbain"
 CHI_Urban_Warfare_Training_desc:0 "Il est essentiel que nos soldats apprennent à combattre en milieu urbain, que ce soit à Taipei ou à Pékin. La guerre urbaine est indispensable à notre époque ; nous ne sommes plus à l'ère victorienne."
 CHI_Fall_of_Hainan:0 "La chute de Hainan"
 CHI_Fall_of_Hainan_desc:0 "Nous avons perdu l'île de Hainan ! Les communistes ont débarqué à Hainan et fait des milliers de victimes ! Notre marine nous a laissé tomber ! Nous devons nous replier sur Taïwan, mais les combats vont se poursuivre."
 CHI_Fortify_the_Coast:0 "Renforcer la côte"
 CHI_Fortify_the_Coast_desc:0 "Il faut faire de Taïwan une forteresse imprenable contre toute incursion ou tout débarquement communiste éventuel. Des forts et des ouvrages de défense seront construits le long de la côte ouest afin de protéger notre sécurité nationale."
 CHI_the_Korean_War:0 "La Guerre de Corée"
 CHI_the_Korean_War_desc:0 "Le gouvernement légitime de la péninsule coréenne est attaqué par des bandits communistes soutenus par l'Union soviétique, qui cherchent à renverser le gouvernement de Séoul et à instaurer une dictature socialiste sur l'ensemble de la péninsule. Il est de notre devoir de soutenir le gouvernement coréen contre cette invasion par tous les moyens nécessaires."
 CHI_Korean_War_Intervention_debate:0 "Débat sur l'intervention dans la guerre de Corée"
 CHI_Korean_War_Intervention_debate_desc:0 "Nos options concernant la guerre de Corée dépendent fortement de la volonté des États-Unis d'Amérique. Bien que le chef d'état-major et le président Truman refusent toute implication directe, ils apprécient notre contribution en matière de livraisons de matériel et d'interrogatoires des prisonniers de guerre chinois. L'entourage proche de Douglas MacArthur soutient toutefois l'idée d'une attaque conjointe contre la Chine continentale afin de contenir le communisme non seulement en Corée, mais aussi en Chine."
 CHI_Korean_War_Prepare_for_Operations_on_mainland:0 "Rejoindre la guerre de Corée"
 CHI_Korean_War_Prepare_for_Operations_on_mainland_desc:0 "Nous suivrons les conseils du général MacArthur et nous joindrons à la coalition des Nations Unies dans sa lutte contre les troupes nord-coréennes. Nous ne pouvons pas laisser les communistes prendre pied en Asie !"
 CHI_Korean_War_prepare_yansa_for_insurection_into_Yunnan:0 "Assurer la coordination avec YANSA"
 CHI_Korean_War_prepare_yansa_for_insurection_into_Yunnan_desc:0 "À la suite de la grande retraite vers Formose, le général Li Mi et ses troupes se sont repliés vers la frontière birmane et pillent la région afin de frapper l'Armée populaire de libération dans le Yunnan. Grâce à nos contacts au sein de la CIA, nous poursuivrons les livraisons d'armes en Birmanie par la route thaïlandaise et les préparerons en vue d'une éventuelle incursion dans le Yunnan."
 CHI_Korean_War_supply_kmt_islamic_insurgency_via_airbridges:0 "Préparer les troupes islamiques au Qinghai"
 CHI_Korean_War_supply_kmt_islamic_insurgency_via_airbridges_desc:0 "Nous continuerons à approvisionner les guérilleros du Qinghai par l'intermédiaire d'espions et de ponts aériens afin de financer leurs opérations contre les forces locales de l'APL."
 CHI_Korean_War_supply_south_korean_troops:0 "Approvisionner les troupes sud-coréennes"
 CHI_Korean_War_supply_south_korean_troops_desc:0 "L'armée sud-coréenne a un besoin urgent de munitions et de conseillers. Nous contribuerons à l'effort de guerre en fournissant du matériel de soutien et de communication, ce qui renforcera les capacités logistiques de la République de Corée."
 CHI_Korean_War_listen_to_the_chief_of_staffs:0 "Écouter le chef d'état-major"
 CHI_Korean_War_listen_to_the_chief_of_staffs_desc:0 "Nous devrions suivre la recommandation du chef d'état-major de ne pas aggraver la guerre de Corée. Le Kuomintang et les forces armées ont toujours un besoin urgent de réformes, et attaquer le continent à l'heure actuelle risquerait fort de faire s'effondrer notre domination sur Taïwan."
 CHI_Korean_chinese_deserters:0 "Accorder l'asile aux déserteurs chinois"
 CHI_Korean_chinese_deserters_desc:0 "Les prisonniers de guerre chinois capturés par la coalition des Nations Unies seront transférés à Taïwan et enrôlés dans l'Armée de la République de Chine (ROCA). Leurs connaissances et leur expérience pourraient s'avérer utiles pour de futures opérations contre le Parti communiste chinois."
 CHI_American_financial_aid:0 "Aide financière américaine"
 CHI_American_financial_aid_desc:0 "Les États-Unis d'Amérique sont notre plus proche allié et la survie de notre régime dépend de leur soutien. Nous allons demander à Washington des fonds supplémentaires pour relancer nos capacités industrielles."
 CHI_request_american_protection:0 "Solliciter la Protection Américaine"
 CHI_request_american_protection_desc:0 "La septième flotte nous a sauvés d'une invasion communiste potentielle ; il est donc tout à fait naturel que nous renforcions nos liens avec les États-Unis et que nous demandions la conclusion d'un traité officiel de sécurité et de protection. Avec l'aide des États-Unis d'Amérique, ces bandits communistes ne nous prendront jamais l'île !"
 CHI_Sino_american_treaty:0 "Signer le traité de défense mutuelle sino-américain"
 CHI_Sino_american_treaty_desc:0 "Le Congrès a adopté le Traité de défense mutuelle sino-américain, un pacte défensif entre la République de Chine et les États-Unis d'Amérique. Les États-Unis s'engagent désormais à protéger l'île de Taïwan si celle-ci venait à être attaquée par le Parti communiste. Ce traité n'inclut toutefois pas les îles de Kinmen et de Matsu, et les États-Unis n'ont jusqu'à présent manifesté aucun intérêt pour une invasion de la Chine continentale."
 CHI_contain_american_political_influence:0 "Limiter l'influence américaine"
 CHI_contain_american_political_influence_desc:0 "Même si les États-Unis nous apportent un soutien industriel et militaire considérable, nous ne pouvons pas leur permettre d'accroître leur influence politique au sein de notre gouvernement, non pas que la position du généralissime Tchang puisse être menacée par la faction pro-américaine de notre gouvernement."
 CHI_allign_closer_to_america:0 "Se rapprocher de Washington"
 CHI_allign_closer_to_america_desc:0 "C'est grâce aux Américains que Taïwan n'est pas sous un régime communiste. Ils stimulent notre économie et apportent leur soutien à notre armée. Il est tout à fait naturel de nous rapprocher davantage de l'Oncle Sam afin d'approfondir notre coopération."
 CHI_encourage_american_investment:0 "Encourager les investissements occidentaux"
 CHI_encourage_american_investment_desc:0 "Nous devons attirer davantage de capitaux et d'investissements étrangers dans l'économie de notre pays ; au-delà des investisseurs américains, nous avons besoin d'un soutien international."
 CHI_join_seato:0 "Rejoindre l’OTASE"
 CHI_join_seato_desc:0 "Avec la création de l'Organisation du traité de l'Asie du Sud-Est, il est impératif que Taïwan adhère à cette organisation afin de lutter contre l'agression de la République populaire de Chine, de la Corée du Nord et du Nord-Vietnam."
 CHI_indochinese_policy:0 "Affaires vietnamiennes"
 CHI_indochinese_policy_desc:0 "Depuis la fin de la Seconde Guerre mondiale, la région de l'Indochine a été le théâtre de multiples mouvements révolutionnaires communistes, qui cherchaient à renverser les régimes en place et collaboraient étroitement avec le Parti communiste chinois. Il est dans notre intérêt suprême de soutenir tout pays de la région confronté à des insurrections communistes afin d'affaiblir le mouvement communiste en Asie de l'Est."
 CHI_Denounce_Diems_Sinophoby:0 "Dénoncer les lois sinophobes de Diem"
 CHI_Denounce_Diems_Sinophoby_desc:0 "Les lois restrictives sévères visant les personnes d'origine chinoise en République du Vietnam vont trop loin ! En les obligeant à renoncer à leurs noms mandarins, à leur nationalité et à leurs traditions exceptionnelles, nous refusons de coopérer avec tout gouvernement sinophobe, même si nous avons un ennemi commun."
 CHI_evacuate_Cho_Lon:0 "Évacuer les biens de Cho-Lon"
 CHI_evacuate_Cho_Lon_desc:0 "Nous devons évacuer la communauté chinoise du quartier de Cholon. Cette communauté et ses capitaux sont trop précieux pour les laisser là-bas, aux portes de ce régime sinophobe. Nous les emmènerons à Taïwan pour assurer leur sécurité."
 CHI_establish_relations_with_south_vietnam:0 "Établir officiellement des relations avec le Sud-Vietnam"
 CHI_establish_relations_with_south_vietnam_desc:0 "La République du Vietnam est le seul gouvernement légitime du Vietnam, mais elle doit faire face aux conséquences du mouvement de résistance antijaponais mené sous la bannière du Viêt Minh. En tant que membre permanent du Conseil de sécurité des Nations unies, nous reconnaîtrons officiellement son indépendance et sa souveraineté sur l'ensemble du Vietnam, ce qui contribuera grandement à la légitimité du gouvernement de Saigon."
 CHI_state_visit_from_saigon:0 "Visite d'État en provenance de Saigon"
 CHI_state_visit_from_saigon_desc:0 "Le président a suggéré que nous invitions des représentants du gouvernement vietnamien afin de discuter plus en détail des plans et des stratégies concernant les rébellions communistes en Chine et au Vietnam, notamment les programmes d'échange, les livraisons d'armes et le savoir-faire militaire."
 CHI_Allign_with_Saigon:0 "Se rapprocher de Saigon"
 CHI_Allign_with_Saigon_desc:0 "Malgré les lois sinophobes de Diem, nous poursuivrons notre politique d'amitié et de coopération avec la République du Vietnam. Celle-ci constitue un atout précieux pour le mouvement anticommuniste en Asie de l'Est et bénéficie d'un soutien accru de la part de notre gouvernement."
 CHI_fund_vnqdd:0 "Soutenir financièrement le VNQDD"
 CHI_fund_vnqdd_desc:0 "Le Viet Quoc, également connu sous le nom de Viet Nam Quoc Dan Dang ou VNQDD, est un parti nationaliste vietnamien réputé pour ses positions anticolonialistes et anticommunistes. Bien qu’il ait été purgé au Nord-Vietnam par Ho Chi Minh, il partage notre vision d’une république fondée sur les Trois Principes du Peuple. Nous soutiendrons nos frères d’Indochine dans leur lutte contre le colonialisme et le communisme."
 CHI_provide_material_support:0 "Aide militaire à Saigon"
 CHI_provide_material_support_desc:0 "Même si nous avons besoin de tout le matériel possible pour la libération du continent, nous allons réaffecter une partie de notre armement, pour l'essentiel obsolète, à Saigon afin d'assurer l'approvisionnement de leur armée."
 CHI_mainland_operations:0 "Vestiges sur le continent"
 CHI_mainland_operations_desc:0 "Les vestiges des forces du Kuomintang qui n'ont pas réussi à s'évacuer vers Taïwan avec les armées principales ont décidé de se retrancher sur le continent et de résister aux forces communistes jusqu'au bout ; nombre d'entre eux se trouvent soit dans les anciens territoires de la clique de Ma, sous le commandement du général Ma Hushan, soit à la frontière entre le Yunnan et la Birmanie, sous le commandement du général Li Mi. Leurs forces occuperont les communistes jusqu’à ce que nous soyons prêts à reprendre le continent, et nous nous souviendrons d’eux comme des martyrs de la Chine libre !"
 CHI_supply_yansa:0 "Ravitailler le YANSA"
 CHI_supply_yansa_desc:0 "Les troupes restantes de la province du Yunnan se sont réfugiées dans les régions frontalières de l'ancienne colonie britannique de Birmanie, où elles ont établi leur quartier général, dans l'attente d'ordres supplémentaires pour reprendre la province du Yunnan aux mains du PCC. Nous approvisionnerons le général Li Mi et ses unités en vue de la libération du continent."
 CHI_reaction_to_burmese_un_complaint:0 "La plainte de la Birmanie à l'ONU"
 CHI_reaction_to_burmese_un_complaint_desc:0 "À la suite de l'échec des efforts diplomatiques et militaires déployés par le gouvernement birman pour résoudre le problème du Kuomintang à Kengtung, la Birmanie a déposé une plainte auprès des Nations Unies, accompagnée d'une multitude de photos, de documents saisis et de témoignages suffisamment convaincants pour obtenir un vote de censure à l'encontre de la République de Chine. Les États-Unis font également pression sur nous pour que nous rappelions le général Li Mi, arguant que la question du KMT était devenue « une telle source d'embarras international pour les États-Unis »."
 CHI_the_taiwan_strait:0 "La crise du détroit de Taïwan"
 CHI_the_taiwan_strait_desc:0 "L'Armée populaire de libération a commencé à bombarder l'île de Kinmen ! Nous devons prendre immédiatement des mesures pour repousser cette attaque contre un nouveau territoire républicain ! La République de Chine ne tombera pas aujourd'hui !"
 CHI_Taiwan_strait_crisis_US_help:0 "Demander l'aide des États-Unis"
 CHI_Taiwan_strait_crisis_US_help_desc:0 "Nous devons compter sur la puissance navale et les capacités logistiques de Washington pour évacuer les civils des îles qui sont actuellement sous le feu des bombardements."
 CHI_evacuate_Dachen_islands:0 "Opération Pullback"
 CHI_evacuate_Dachen_islands_desc:0 "Les civils se trouvant sur les îles bombardées doivent être évacués au plus vite ! Nous devons envoyer des soldats et des agents de santé sur ces îles afin de décontaminer les civils et de les aider à être évacués vers Taïwan."
 CHI_reject_evacuation_efforts_of_dachen:0 "Refuser l'évacuation des îles Dachen"
 CHI_reject_evacuation_efforts_of_dachen_desc:0 "Les îles Dachen constituent des positions stratégiques qui nous permettront de consolider plus facilement la province du Zhejiang à l'avenir ; abandonner ces positions serait une décision stupide !"
 CHI_fortify_kinmen_matsu:0 "Fortifier Kinmen et Matsu"
 CHI_fortify_kinmen_matsu_desc:0 "Kinmen et Matsu constitueront le premier théâtre d'opérations si nous-mêmes ou les bandits communistes osons lancer une attaque. Nous devons continuer à renforcer leurs infrastructures militaires, notamment en y construisant des bastions solidement fortifiés capables de résister à de futurs bombardements. Nous allons également y déployer 40 000 soldats supplémentaires."
 CHI_bomb_xiamen:0 "Shell Xiamen"
 CHI_bomb_xiamen_desc:0 "Il est temps de riposter ! Si ces bandits croient que nous ne sommes pas en mesure de riposter, ils se trompent lourdement ! Nous allons bombarder leurs batteries d'artillerie à Xiamen pour mettre un terme à ce conflit."
 CHI_second_taiwan_strait:0 "Deuxième crise du détroit de Taïwan"
 CHI_second_taiwan_strait_desc:0 "Les communistes ont de nouveau lancé des attaques contre nos positions autour du détroit, nous devons riposter immédiatement !"
 CHI_operation_black_magic:0 "Opération Black Magic"
 CHI_operation_black_magic_desc:0 "Avec le déclenchement de la deuxième crise du détroit de Taïwan, les Américains se sont déclarés prêts à nous aider à modifier certains de nos chasseurs afin de les équiper des tout nouveaux missiles air-air AIM-9 Sidewinder. Cela nous donnera sans aucun doute un avantage sur les chasseurs MiG-15 et MiG-17 de fabrication soviétique des communistes chinois lors des combats visant à assurer la suprématie aérienne au-dessus des îles de Kinmen."
 CHI_islamic_insurgency:0 "L'insurrection islamiste"
 CHI_islamic_insurgency_desc:0 "Les derniers partisans du général Ma Bufang et de la famille Ma résistent toujours dans les régions du Qinghai et du Xinjiang de la République. Avec l'aide des États-Unis, nous pourrions peut-être leur fournir des armes afin qu'ils continuent à se rebeller contre le régime du PCC."
 CHI_Aid_For_Ma_hushan:0 "De l'aide pour Ma Hushan"
 CHI_Aid_For_Ma_hushan_desc:0 "Le général Ma Hushan est la figure de proue des troupes islamistes, qui mènent une guérilla contre l'Armée populaire de libération. Nous devons prendre contact avec lui pour lui fournir du matériel et discuter de l'avenir des 14 000 anciens soldats musulmans."
 CHI_CIA_connections:0 "Liens avec la CIA"
 CHI_CIA_connections_desc:0 "Le président [CHI.GetLeader] est fermement convaincu que nous devons soutenir l'insurrection islamique au Qinghai et au Xinjiang. Il a ordonné aux avions du Kuomintang de larguer régulièrement des vivres et des armes aux musulmans de la région de l'Amdo, avec l'aide de la CIA (Agence centrale de renseignement des États-Unis)."
 CHI_recalling_muslim_generals:0 "Rappeler les généraux musulmans"
 CHI_recalling_muslim_generals_desc:0 "La situation est devenue critique pour les divisions musulmanes restantes. Nous devrions peut-être renforcer notre collaboration avec l'Inde et lui demander de nous aider à évacuer nos généraux encore présents au Tibet, au Xinjiang et au Qinghai."
 CHI_Reinforced_American_Ties:0 "Renforcés les liens avec les États-Unis"
 CHI_Reinforced_American_Ties_desc:0 "Après avoir sollicité des armes et des avions auprès des États-Unis, il nous semble tout à fait normal de renforcer nos liens diplomatiques avec les Américains, notre plus proche allié, dans le but commun d'empêcher la propagation du communisme là où il est présent."
 CHI_Support_Anti_Communist_Insurgents:0 "Soutenir les insurgés anticommunistes"
 CHI_Support_Anti_Communist_Insurgents_desc:0 "La guerre n'est pas perdue ! Nous continuerons à soutenir les insurgés sur le continent et dans toute l'Asie du Sud-Est pour résister à la propagation rapide du communisme et contrecarrer les complots des Soviétiques et des Chinois !"
 CHI_Continue_to_Support_Operations_in_Burma:0 "Continuer à soutenir les opérations en Birmanie"
 CHI_Continue_to_Support_Operations_in_Burma_desc:0 "Nous devons poursuivre nos opérations en Birmanie afin de contenir les insurrections menées par les communistes du « drapeau rouge » et du « drapeau blanc ». Il faut stabiliser la Birmanie et la préserver des dangers du communisme."
 CHI_Republic_of_China_Navy:0 "Marine de la République de Chine"
 CHI_Republic_of_China_Navy_desc:0 "Notre marine doit être renforcée pour dominer la mer de Chine méridionale ! Nous devons recruter et former des marins compétents afin que les eaux chinoises nous appartiennent."
 CHI_Develop_Taiwanese_Shipyards:0 "Développer les chantiers navals taïwanais"
 CHI_Develop_Taiwanese_Shipyards_desc:0 "De par sa situation géographique insulaire, Taïwan est l'endroit idéal pour accueillir des chantiers navals. Nous allons mettre en place plusieurs installations afin de commencer à construire nos propres navires, dans le but de renforcer notre flotte."
 CHI_Commissioning_of_Former_IJN_Destroyers:0 "Mise en service d'anciens destroyers de la Marine impériale japonaise"
 CHI_Commissioning_of_Former_IJN_Destroyers_desc:0 "Maintenant que le Japon est allié aux États-Unis, nous avons accepté avec gratitude l'offre de plusieurs anciens destroyers japonais. Il est temps de les mettre en service et de les intégrer à notre vaillante marine !"
 CHI_Purchase_American_Destroyers:0 "Acheter des navires de débarquement américains"
 CHI_Purchase_American_Destroyers_desc:0 "Les Américains nous ont également proposé de nous vendre des navires excédentaires, et nous allons accepter ; plusieurs vieux destroyers américains viendront également grossir les rangs de notre flotte, qui ne cesse de s'agrandir."
 CHI_Expand_the_Marine_Corps:0 "Élargir le Corps des Marines"
 CHI_Expand_the_Marine_Corps_desc:0 "Le Corps des Marines de la République de Chine (ROCMC) doit être renforcé. Créé en 1914, ce corps d'élite des forces armées doit être parfaitement entraîné à tous les types de combat."
 CHI_The_Temporary_Provisions:0 "The Temporary Provisions"
 CHI_The_Temporary_Provisions_desc:0 "Afin de réprimer la rébellion communiste, nous devons instaurer la loi martiale et suspendre la Constitution de la République de Chine. Des mesures d'urgence doivent être mises en place pour garantir la sécurité nationale et la sûreté de notre nation. Nous devrons rester dans ces conditions jusqu'à ce que nous ayons réussi à reprendre le continent !"
 CHI_Reconstruct_the_KMT:0 "Reconstruire le KMT"
 CHI_Reconstruct_the_KMT_desc:0 "Nous avons peut-être perdu le continent, mais Taïwan est toujours à nous ! Le KMT, ou Kuomintang, restera fort et se concentrera sur la prospérité économique. Nous devons reconstruire et renouer avec la vie dans notre nouvelle patrie."
 CHI_The_Academy_for_the_Study_of_Carrying_out_Revolution:0 "L'Académie pour l'étude de la mise en œuvre de la révolution"
 CHI_The_Academy_for_the_Study_of_Carrying_out_Revolution_desc:0 "Nous devons analyser les échecs du KMT continental, identifier nos propres lacunes et déterminer comment nous pouvons faire mûrir une nouvelle révolution contre le gouvernement communiste."
 CHI_all_is_not_yet_lost:0 "Tout n'est pas encore perdu !"
 CHI_all_is_not_yet_lost_desc:0 "Bien qu'exilé sur l'île de Taïwan par les bandits communistes, il reste convaincu de la reconquête du continent. Le généralissime est persuadé que les bandits communistes finiront par plonger la Chine dans l'instabilité et le chaos, ouvrant ainsi la voie au retour du Kuomintang sur le continent et à l'expulsion de ces bandits. Ce n'est qu'une question de temps avant que la prédiction de Tchang ne se réalise."
 CHI_triumph_plan:0 "Le plan Triomphe"
 CHI_triumph_plan_desc:0 "Avec l'aide des conseillers militaires japonais du Groupe White, ils ont contribué à former nos forces armées afin qu'elles soient mieux organisées et plus aptes au combat. Ils apporteront également leur soutien au Plan Triumph, qui vise à définir les futures opérations en vue de la contre-offensive sur le continent."
 CHI_victory_plan:0 "Le plan de la victoire"
 CHI_victory_plan_desc:0 "En l'absence de conseillers militaires japonais pour nous soutenir, nous devons définir les grandes lignes des préparatifs visant à reprendre le continent par nos propres moyens, avec un soutien américain limité en raison de leur opposition à l'idée que nous reprenions le continent."
 CHI_zhongxing_planning_office:0 "Bureau d'urbanisme de Zhongxing"
 CHI_zhongxing_planning_office_desc:0 "La mise en place du Bureau de planification Zhongxing pour les organisations opérationnelles va débuter ; nous n'inclurons parmi les membres de l'état-major de planification que des personnes entretenant des liens étroits avec le généralissime."
 CHI_Intensify_the_White_Terror:0 "Intensifier la Terreur blanche"
 CHI_Intensify_the_White_Terror_desc:0 "Certains « dissidents politiques » doivent être placés en détention en raison de leur opposition au Kuomintang. Il faut éliminer tous les espions communistes qui se trouvent parmi nous. Il faut intensifier la Terreur blanche afin d'éradiquer ceux qui refusent de se rallier aux objectifs du KMT."
 CHI_Execute_Aborginee_Leaders:0 "Exécuter les dirigeants aborigènes"
 CHI_Execute_Aborginee_Leaders_desc:0 "Certains dirigeants des peuples autochtones de Taïwan se sont opposés aux politiques du KMT et à leur « assimilation forcée » dans la société chinoise. Nous devons montrer l'exemple à ceux qui s'opposent à nous et exécuter plusieurs dirigeants autochtones pour envoyer un message fort."
 CHI_Sinification_Campaign:0 "Campagne de sinisation"
 CHI_Sinification_Campaign_desc:0 "Nous devons lancer une campagne d'éducation et de sensibilisation auprès des peuples autochtones de Taïwan, afin de faire de notre jeune république un phare de la démocratie et de la culture chinoises. Nous devons lutter contre les influences japonaises du passé qui ont corrompu le peuple."
 CHI_Repress_Taiwanese_Activists:0 "Réprimer les militants taïwanais"
 CHI_Repress_Taiwanese_Activists_desc:0 "Ceux qui refusent de se rallier aux idéaux du KMT doivent être réprimés ; c'est le seul moyen de maintenir l'ordre et la stabilité. Les opposants politiques seront neutralisés."
 CHI_Ban_the_Formation_of_New_Political_Parties:0 "Interdire la création de nouveaux partis politiques"
 CHI_Ban_the_Formation_of_New_Political_Parties_desc:0 "Il n'est ni nécessaire ni utile de créer de nouveaux partis politiques. Le KMT est fort, et tous ceux qui s'y opposent ont été punis pour servir d'exemple. La République de Chine ne sera pas une démocratie divisée, en proie à des luttes politiques internes !"
 CHI_Outlaw_Native_Languages:0 "Mouvement pour la promotion du mandarin"
 CHI_Outlaw_Native_Languages_desc:0 "Il sera indispensable de connaître le mandarin pour pouvoir communiquer et s'adapter à nos traditions. Toutes les autres langues n'ont aucune valeur et ne servent à rien à la République de Chine."
 CHI_Rename_Street_Names:0 "Changer les noms de rue"
 CHI_Rename_Street_Names_desc:0 "Conformément à notre campagne de sinisation, nous allons renommer certaines rues afin qu'elles reflètent des lieux situés en Chine continentale, car il s'agit de notre territoire légitime."
 CHI_appoint_chen_cheng_vp:0 "Nommer Chen Cheng au poste de vice-président"
 CHI_appoint_chen_cheng_vp_desc:0 "Chen Cheng, Premier ministre de la République, héros de la guerre civile et ancien gouverneur de la province de Taïwan, s'est imposé auprès du Généralissime comme l'un de ses conseillers politiques les plus proches et les plus efficaces. Ses campagnes de réforme agraire, ses projets d'infrastructure et sa crédibilité internationale, notamment auprès des États-Unis, ont considérablement renforcé l'efficacité de notre gouvernement. Le président Chiang a désormais décidé de le nommer vice-président de la République, confiant le poste de Premier ministre à l'ancien maire de Shanghai, Yu Hung-chun."
 CHI_Sun_Li_Jen_Coup:0 "Le coup d'État de Sun Li Jen"
 CHI_Sun_Li_Jen_Coup_desc:0 "Sun Li-jen, l'actuel commandant en chef de l'armée de la République de Chine et éminent vétéran de la guerre civile chinoise, a pris le contrôle du gouvernement à la suite d'un coup d'État soutenu par la CIA américaine. Sun, qui s'opposait aux réformes d'inspiration soviétique au sein des forces armées et du parti, a réuni autour de lui un cercle restreint de personnalités politiques libérales et modérées influentes dans le but de destituer le généralissime et de redresser la situation politique actuelle en s'appuyant sur le rationalisme plutôt que sur un fanatisme idéologique aveugle."
 CHI_the_vice_presidential_debate:0 "Le débat entre les candidats à la vice-présidence"
 CHI_the_vice_presidential_debate_desc:0 "Chiang Kai-shek ayant été écarté du pouvoir, la junte débat actuellement pour déterminer qui devrait occuper les autres postes politiques clés pour le moment. Il a été rapidement convenu que l'ancien Premier ministre Yan Xishan reprendrait ses fonctions de Premier ministre par intérim, mais la question du poste de vice-président de la République suscite des tensions au sein de la junte."
 CHI_purge_pro_chiang_loyalists:0 "Le destin de la famille Chiang"
 CHI_purge_pro_chiang_loyalists_desc:0 "Le généralissime et son fils ayant été démis de leurs fonctions, la junte est confrontée à la question de savoir quoi faire des deux Chiang et de leur famille, et quel rôle ils devraient désormais jouer. Alors que diverses voix s'élèvent pour réclamer soit leur exil aux États-Unis, soit leur assignation à résidence, Chiang Kai-shek jouit toujours d'un grand prestige au sein du Kuomintang, même en dehors de sa faction, en raison de ses exploits lors de l'Expédition du Nord, au début de la guerre civile et pendant la Guerre de résistance, où il fut le symbole central de la résistance chinoise contre l'impérialisme japonais. C'est pourquoi le gouvernement provisoire décide que Chiang Kai-shek et sa famille..."
 CHI_release_white_terror_victims:0 "Libérer les prisonniers politiques innocents"
 CHI_release_white_terror_victims_desc:0 "Pendant la vague de terreur qui a marqué le règne de Tchang Kaï-chek à Taïwan, de nombreuses voix libérales, y compris celles de militants taïwanais, ont été emprisonnées sous l'accusation d'espionnage et de sympathie envers les bandits communistes. Nous allons revenir sur ces purges précipitées et libérer divers militants et libéraux afin de gagner davantage le soutien de la population. Cependant, nous maintiendrons les prisonniers communistes traîtres derrière les barreaux afin qu'ils ne puissent pas détruire notre gouvernement de l'intérieur."
 CHI_the_road_to_democracy:0 "Le chemin vers la démocratie"
 CHI_the_road_to_democracy_desc:0 "La démocratie pour le peuple chinois était un élément central de la philosophie du Dr Sun Yat-sen. Nous allons désormais jeter les bases de la démocratisation du peuple de la République de Chine et nous ne nous servirons pas de la situation sur le continent comme prétexte pour prolonger la loi martiale et suspendre les droits civils."
 CHI_continue_dang_guo:0 "Continuer avec Dang Guo"
 CHI_continue_dang_guo_desc:0 "Le rôle du Kuomintang n'est pas encore terminé. Après nous être débarrassés des éléments autoritaires, nous avons désormais tracé une voie plus claire pour que le Kuomintang guide la République vers la démocratie. Les autres partis, qui s'opposent à la philosophie des Trois Principes du Peuple, ne feraient que retarder le processus de démocratisation."
 KMT_fortify_tridemism:0 "L'importance du tridéisme"
 KMT_fortify_tridemism_desc:0 "Les trois principes du peuple constituent les lignes directrices du Kuomintang et doivent être respectés de manière égale. La démocratie, le nationalisme et le bien-être social ne doivent pas s'exclure mutuellement, et chaque principe mérite l'attention et les ressources du gouvernement."
 CHI_encourage_tangwai_washingren_cooperation:0 "Le débat Waishengren-Tangwai"
 CHI_encourage_tangwai_washingren_cooperation_desc:0 "Une fois l'ancien gouvernement écarté, nous avons commencé à jeter les bases d'un climat libéral, égalitaire et tolérant à Taïwan, et nous continuerons dans cette voie. La question de savoir s'il faut intégrer la population autochtone dans la structure administrative de la République ou conserver pour l'instant notre personnel originaire du continent reste toutefois ouverte."
 CHI_anti_corruption_campaigns:0 "Nouvelles campagnes de lutte contre la corruption"
 CHI_anti_corruption_campaigns_desc:0 "La corruption politique est un problème majeur au sein du KMT, mais aussi dans tout le pays. Nous devons éradiquer toute forme de corruption afin de rendre le gouvernement plus efficace et de le mettre au service du peuple, plutôt que de servir des intérêts personnels."
 CHI_greater_local_democratic_reforms:0 "Démocratie locale"
 CHI_greater_local_democratic_reforms_desc:0 "Afin de renforcer la légitimité de la structure politique républicaine, nous devons mettre en place diverses réformes politiques locales fondées sur le principe de la démocratie libérale directe. En organisant des élections démocratiques au niveau local, telles que les élections municipales et celles des conseils municipaux, nous élargirons notre base de soutien et engagerons progressivement la République sur la voie de la démocratisation."
 CHI_rise_of_judicial_yuan:0 "L'ascension du Yuan judiciaire"
 CHI_rise_of_judicial_yuan_desc:0 "L'État de droit est un principe fondamental de toute démocratie. Il ne doit y avoir aucun cas où l'égalité serait bafouée dans le domaine judiciaire. La Constitution s'applique à tous de manière égale, que l'on soit un haut responsable politique ou un simple paysan des régions rurales."
 KMT_Begin_Seperation_of_Party_and_state:0 "Entamer la séparation entre le parti et l'État"
 KMT_Begin_Seperation_of_Party_and_state_desc:0 "Il faut mettre fin à l'emprise du Kuomintang sur la société et l'armée. Le Kuomintang ne doit pas être assimilé à l'État et à ses institutions. La Constitution sera bientôt rétablie et le Kuomintang se retrouvera parmi les nombreux acteurs politiques du système républicain, et non plus comme le seul acteur dominant."
 CHI_abolish_political_commissars:0 "Supprimer les commissaires politiques"
 CHI_abolish_political_commissars_desc:0 "Les commissaires politiques constituent une particularité purement communiste de l'armée, et nous ne serons jamais comme cette racaille communiste ! Il est nécessaire de surveiller les convictions idéologiques de nos troupes, mais les commissaires ne le sont pas."
 CHI_maintain_anti_communist_rhetoric:0 "Maintenir une rhétorique anticommuniste"
 CHI_maintain_anti_communist_rhetoric_desc:0 "Même si notre position vis-à-vis du continent occupé diffère de celle de la famille Chiang, en matière de reconquête, le mouvement communiste reste la principale menace, non seulement pour nous, mais aussi pour l'Asie tout entière. Nous continuerons à dénoncer les activités communistes et à venir en aide à toute nation menacée par la menace rouge."
 KMT_Outlaw_Torture_Sun_Li_Jen:0 "Interdire la torture"
 KMT_Outlaw_Torture_Sun_Li_Jen_desc:0 "Comme le stipule la Déclaration universelle des droits de l'homme des Nations Unies, à laquelle la République de Chine a adhéré, la torture est considérée comme un « traitement cruel, inhumain et dégradant ». Nous respecterons ce principe et mettrons fin à nos pratiques de torture, qui deviendront illégales ; il existe des moyens plus humains d'obtenir des informations."
 CHI_invite_US_observers:0 "Inviter des observateurs américains"
 CHI_invite_US_observers_desc:0 "Afin de garantir la mise en place sans heurts de véritables structures démocratiques, nous inviterons des observateurs américains, qui surveilleront le déroulement des élections, le respect de l'État de droit ainsi que les séances du Yuan législatif et du Yuan judiciaire."
 CHI_declare_end_of_military_rule:0 "Proclamer la fin du régime militaire"
 CHI_declare_end_of_military_rule_desc:0 "Le moment est venu de mettre fin au gouvernement d'intérim. La junte quittera le pouvoir et les préparatifs en vue des prochaines élections seront engagés."
 CHI_electing_a_new_government:0 "Élection d'un nouveau gouvernement"
 CHI_electing_a_new_government_desc:0 "Pour la première fois depuis 1948, le peuple de la République de Chine va décider de son propre avenir dans les urnes. Avec la fin de la loi martiale, l'instauration de l'État de droit au sein de nos institutions constitutionnelles et une plus grande liberté politique, le moment est venu d'organiser des élections libres, secrètes et équitables qui continueront à faire avancer le processus de démocratisation."
 CHI_Release_Formosan_Activists:0 "Libérer les militants de Formose"
 CHI_Release_Formosan_Activists_desc:0 "La République de Chine a le pouvoir de libérer les militants taïwanais qui s'opposent activement au régime du Kuomintang, et c'est ce que nous ferons ; ils doivent apprendre à faire preuve de prudence."
 CHI_Accede_to_American_Pressure:0 "Céder à la pression américaine"
 CHI_Accede_to_American_Pressure_desc:0 "Les Américains nous ont mis au pied du mur ; nous allons mettre un terme à nos « interrogatoires » politiques des dissidents présumés, dans l'espoir que notre république devienne plus sûre."
 CHI_Arrest_Sun_Li_Jen:0 "Arrestation de Sun Li-Jen"
 CHI_Arrest_Sun_Li_Jen_desc:0 "Le général en a assez de cette liberté ! Pour avoir comploté en vue de renverser Tchang Kaï-chek, Sun Li-jen a été démis de ses fonctions et assigné à résidence. Cela devrait servir d'exemple aux autres hauts gradés de l'armée, afin qu'ils placent les intérêts du pays avant tout."
 CHI_Intensify_Censorship_Campaign:0 "Intensifier la campagne de censure"
 CHI_Intensify_Censorship_Campaign_desc:0 "Nous devons contrôler tous les médias, y compris les journaux, la radio et la télévision, afin de préserver la sécurité nationale et d'empêcher toute opposition au KMT. Il faut intensifier la censure."
 CHI_Arrest_the_Intellectual_Elite:0 "Arrêter l'élite intellectuelle"
 CHI_Arrest_the_Intellectual_Elite_desc:0 "l est nécessaire de placer certains membres de l'intelligentsia en détention afin de contenir leur opposition au gouvernement du KMT. Leur soutien ouvert à la démocratie et à l'indépendance de Taïwan sera ainsi réduit au silence."
 CHI_Play_the_Cliques_off_Against_One_Another:0 "Monter les clans les uns contre les autres"
 CHI_Play_the_Cliques_off_Against_One_Another_desc:0 "Il faut monter les clans opposés au KMT les uns contre les autres, pour qu'ils s'affrontent et que notre parti reste au pouvoir !"
 CHI_Empower_The_CC_Clique:0 "Renforcer la Clique du Club central"
 CHI_Empower_The_CC_Clique_desc:0 "Le CC, ou « Central Club Clique », est considéré comme l'aile d'extrême droite du Kuomintang ; il représente les anticommunistes et les nationalistes, et compte dans ses rangs de nombreux membres de l'élite du parti, ainsi que des personnalités influentes issues de l'armée, des services de renseignement et du monde des affaires. Nous devons soutenir leurs actions et leur permettre de continuer à exercer leur influence."
 CHI_Outlaw_Political_Demonstrations:0 "Interdire les manifestations politiques"
 CHI_Outlaw_Political_Demonstrations_desc:0 "Toute opposition au gouvernement du Kuomintang au pouvoir ne sera pas tolérée. Toute manifestation politique, en particulier celles dirigées contre le KMT, sera réprimée par la force et réduite au silence."
 CHI_Expel_Lei_Chen_From_the_Party:0 "Exclure Lei Chen du Parti"
 CHI_Expel_Lei_Chen_From_the_Party_desc:0 "Lei Chen est devenu l'un des leaders du mouvement d'opposition visant à instaurer une République de Chine plus démocratique. Nous devons l'exclure du parti et l'arrêter, car il ne fait plus preuve de la même loyauté qu'autrefois !"
 CHI_Outlaw_Strikes:0 "Grèves illégales"
 CHI_Outlaw_Strikes_desc:0 "Il ne sera tout simplement plus possible de faire grève pour obtenir de meilleures conditions de travail. Nous avons beau avoir des lois autorisant les travailleurs à former des syndicats et à conclure des conventions collectives, toute grève en République de Chine sera réprimée par la force par le gouvernement et rapidement brisée, au prix de vies humaines ou non."
 CHI_Allow_the_Former_Blueshirts_to_Run_the_Secret_Police:0 "Laissons les anciens Blueshirts diriger la police secrète"
 CHI_Allow_the_Former_Blueshirts_to_Run_the_Secret_Police_desc:0 "La Société pour la mise en pratique des trois principes du peuple (communément appelée les « Chemises bleues ») était une faction paramilitaire ultranationaliste d'extrême droite au sein du KMT. Réputée pour son anticommunisme fervent et ses opérations inspirées du fascisme italien, nous lui permettrons de prendre le contrôle du Commandement de la garnison de Taïwan et d'agir en tant que police secrète du KMT."
 CHI_Empower_The_Secret_Police:0 "Renforcer les pouvoirs de la police secrète"
 CHI_Empower_The_Secret_Police_desc:0 "Maintenant que les Chemises bleues sont au pouvoir, nous pouvons étendre les pouvoirs et le champ d'action de la police secrète, afin de lui permettre de prendre toutes les mesures nécessaires contre l'opposition au KMT ou contre d'éventuelles tendances communistes."
 CHI_Inhibit_the_Political_Center:0 "Freiner le centre politique"
 CHI_Inhibit_the_Political_Center_desc:0 "Nous devons ancrer notre idéologie au centre politique, plutôt que de chercher à trouver un équilibre entre les deux camps."
 CHI_Seek_Out_American_Support:0 "Rechercher le soutien des États-Unis"
 CHI_Seek_Out_American_Support_desc:0 "Nous devons bénéficier d'un soutien accru de la part de notre allié, les États-Unis. C'est le seul moyen de préserver notre stabilité face aux agissements malveillants des révolutionnaires communistes du continent."
 CHI_Investigate_Mainland_Refugees:0 "Enquête sur les réfugiés du continent"
 CHI_Investigate_Mainland_Refugees_desc:0 "Nous devons enquêter sur les réfugiés venus du continent, afin de nous assurer qu'ils sont bien ici pour demander l'asile et non pas des agents communistes en sommeil !"
 CHI_Invest_in_Textiles:0 "Investir dans le textile"
 CHI_Invest_in_Textiles_desc:0 "Il est nécessaire de faire de l'industrie textile l'un des principaux secteurs d'activité de Taïwan. Le ministère de l'Économie va immédiatement mettre en place un comité chargé de mettre en œuvre le développement de l'industrie textile."
 CHI_Sovietize_the_Armed_Forces:0 "Soviétiser les forces armées"
 CHI_Sovietize_the_Armed_Forces_desc:0 "Grâce à l'expérience de Chiang Ching-kuo, le fils de notre président, nous allons mettre en place dans notre armée des réformes militaires inspirées du modèle soviétique ; maintenant que Sun Li-Jen a été « éliminé », nous pouvons développer pleinement le corps des officiers politiques et étendre l'influence du KMT."
 CHI_Establish_Light_Industries:0 "Créer des industries légères"
 CHI_Establish_Light_Industries_desc:0 "Il est essentiel que nous commencions à produire davantage de biens de consommation en développant les industries légères, afin de gagner le soutien de la population."
 CHI_Democratic_Progressive_Victory:0 "Victoire du Parti démocratique progressiste"
 CHI_Democratic_Progressive_Victory_desc:0 "Lors des élections de 1954, le Parti démocratique progressiste a remporté la victoire ! Le PDP est connu pour ses positions de centre-gauche et nationalistes."
 CHI_A_Formosan_Identity:0 "Une identité taïwanaise"
 CHI_A_Formosan_Identity_desc:0 "Il est nécessaire que nous commencions à nous forger une identité ici, à Formose, dans notre nouvelle patrie, afin de montrer au monde entier que nous formons un peuple diversifié."
 CHI_Moderate_Welfare_Spending:0 "Des dépenses sociales modérées"
 CHI_Moderate_Welfare_Spending_desc:0 "Le gouvernement assumera désormais une part plus importante des dépenses consacrées à la santé publique, aux hôpitaux et à la prévention des maladies. Le ministère de la Santé et des Affaires sociales sera créé à cette fin."
 CHI_Increase_Ties_to_South_Korea:0 "Renforcer les liens avec la Corée du Sud"
 CHI_Increase_Ties_to_South_Korea_desc:0 "Nous devons établir des relations amicales et diplomatiques avec les autres nations libres d'Asie. La Corée du Sud doit être notre alliée, car nos deux pays sont confrontés à la même menace communiste."
 CHI_Japanese_Investments:0 "Investissements japonais"
 CHI_Japanese_Investments_desc:0 "Nous autoriserons le gouvernement japonais et les entreprises japonaises à investir dans nos secteurs du textile et de l'industrie légère, ce qui renforcera nos relations et profitera à tous."
 CHI_Industrial_Expansion:0 "Développement industriel"
 CHI_Industrial_Expansion_desc:0 "Nous devons continuer à développer notre industrie, tant dans le secteur des biens d'équipement que dans celui des biens de consommation. La République de Chine sera reconnue pour sa puissance industrielle !"
 CHI_Defend_Our_Newfound_Independence:0 "Défendre notre nouvelle indépendance"
 CHI_Defend_Our_Newfound_Independence_desc:0 "La République de Chine est une nation indépendante et souveraine, et toute tentative de la République populaire de Chine visant à changer cela est vouée à l'échec. Nous nous battrons pour notre indépendance !"
 CHI_Naturalization_of_the_Military:0 "Naturalisation des militaires"
 CHI_Naturalization_of_the_Military_desc:0 "Si un ressortissant étranger a servi dans les forces armées de la République de Chine, il sera naturalisé et deviendra citoyen taïwanais en reconnaissance de ses services rendus à l'État."
 CHI_Constitutional_Reform:0 "Réforme constitutionnelle"
 CHI_Constitutional_Reform_desc:0 "La Constitution de la République de Chine doit être réformée afin d'affirmer notre souveraineté, notre territoire et notre indépendance vis-à-vis du régime communiste."
 CHI_Democratic_Progressive_Victory_1958:0 "Victoire du Parti démocratique progressiste de 1958"
 CHI_Democratic_Progressive_Victory_1958_desc:0 "Lors des élections de 1958, le Parti démocratique progressiste a remporté la victoire ! Le PDP est connu pour ses positions de centre-gauche et nationalistes."
 CHI_Purchase_American_Weaponry:0 "Acheter des armes américaines"
 CHI_Purchase_American_Weaponry_desc:0 "Afin de rester à la pointe des technologies émergentes, nous devons continuer à acheter des armes et du matériel aux États-Unis, pour des raisons de défense et de sécurité nationales."
 CHI_Trade_Deal_with_Indonesia:0 "Accord commercial avec l'Indonésie"
 CHI_Trade_Deal_with_Indonesia_desc:0 "Il est nécessaire de conclure un accord commercial avec l'Indonésie, une puissance voisine, afin de s'approvisionner en pétrole, en gaz et en huile de palme. En contrepartie, nous leur fournirons des textiles et des biens de consommation."
 CHI_Abandon_Hope:0 "Abandonner tout espoir"
 CHI_Abandon_Hope_desc:0 "Ces efforts sont vains. Les forces communistes ne sont qu'à quelques encablures, et elles vont bientôt débarquer en masse pour nous asservir tous. Nous devons abandonner tout espoir et accepter la réalité."
 CHI_Political_Instability:0 "Instabilité politique"
 CHI_Political_Instability_desc:0 "La situation actuelle est marquée par une instabilité politique considérable. Des factions de tous bords se disputent le pouvoir, et le pays tout entier est en proie au chaos."
 CHI_Increase_Taiwanese_Repression:0 "Intensifier la répression à Taïwan"
 CHI_Increase_Taiwanese_Repression_desc:0 "Nous devons intégrer les Taïwanais de souche et les amener à adhérer pleinement aux principes du Kuomintang et du gouvernement au pouvoir. Toute opposition sera réduite au silence."
 CHI_Legacy_of_the_228_Incident:0 "L'héritage de l'incident du 228"
 CHI_Legacy_of_the_228_Incident_desc:0 "Nous devons présenter nos excuses aux familles des victimes de l'incident du 228 et ne jamais oublier cette horrible tragédie qui a frappé la population."
 CHI_The_Formosan_Revolution:0 "La révolution de Formose"
 CHI_The_Formosan_Revolution_desc:0 "Le peuple doit se soulever contre le gouvernement corrompu et autoritaire du Kuomintang ! Nous ne resterons pas sous le joug de la répression nationaliste !"
 CHI_The_Republic_of_Formosa_Provisional_Government:0 "Gouvernement provisoire de la République de Formose"
 CHI_The_Republic_of_Formosa_Provisional_Government_desc:0 "Maintenant que nous avons renversé le gouvernement corrompu du KMT, nous devons créer un parti plus démocratique et moins nationaliste, au service du peuple."
 CHI_Restore_Japanese_Relations:0 "Rétablir les relations avec le Japon"
 CHI_Restore_Japanese_Relations_desc:0 "Nous sommes à nouveau Formose ; le Japon doit s'impliquer davantage dans nos relations et dans la sécurité régionale. Les relations diplomatiques seront rétablies."
 CHI_President_Thomas_Liao:0 "Président Thomas Liao"
 CHI_President_Thomas_Liao_desc:0 "Thomas Liao a été l'un des figures de proue du mouvement indépendantiste taïwanais. Maintenant que nous sommes devenus la République de Formose, il semble tout à fait juste de le nommer président de cette nouvelle nation indépendante."
 CHI_Equal_Rights:0 "Égalité des droits"
 CHI_Equal_Rights_desc:0 "Contrairement à la répression politique et à l'assimilation forcée menées par le gouvernement du Kuomintang, tous les citoyens de Formose seront traités sur un pied d'égalité et jouiront de toutes leurs libertés."
 CHI_Formation_of_the_Democratic_Progressive_Party:0 "Création du Parti démocratique progressiste"
 CHI_Formation_of_the_Democratic_Progressive_Party_desc:0 "Il faut créer le Parti démocratique progressiste afin de promouvoir les idées de bien-être social et de nationalisme pour notre nouvelle république."
 CHI_Promote_Formosan_Culture:0 "Promouvoir la culture de Formose"
 CHI_Promote_Formosan_Culture_desc:0 "Nous devons promouvoir une identité propre aux peuples autochtones de Formose ; nous ne serons pas connus pour la culture chinoise, mais pour la nôtre."
 CHI_Ban_The_KMT:0 "Interdire le KMT"
 CHI_Ban_The_KMT_desc:0 "Le KMT est un parti corrompu et d'une autorité brutale. On ne le tolérera plus jamais à Formose. Nous ne voulons pas de lui ici."
 CHI_Seek_American_Aid:0 "Demander l'aide américaine"
 CHI_Seek_American_Aid_desc:0 "Nous devons continuer à bénéficier de l'aide américaine, quel que soit le changement de régime. Nous avons besoin de cette aide pour mener à bien la révolution et défendre nos côtes."
 CHI_Education_Reform:0 "Réforme du système éducatif"
 CHI_Education_Reform_desc:0 "Nous devons modifier le programme d'histoire. Au lieu de glorifier l'arrivée du Kuomintang, nous devrions lui en faire porter la responsabilité et mettre davantage l'accent sur l'enseignement des sociétés autochtones de Formose."
 CHI_Free_Market_Reforms:0 "Réformes du Marché libre"
 CHI_Free_Market_Reforms_desc:0 "La République de Formose doit continuer à jouer un rôle de premier plan sur la scène internationale. Notre système économique doit être réformé afin de favoriser les échanges commerciaux avec tous les pays."
 CHI_One_China_One_Formosa:0 "Une Chine, une Formose"
 CHI_One_China_One_Formosa_desc:0 "Le moment est venu : nous devons cesser de rêver de reconquérir le continent. La guerre civile est terminée, et il n'y a plus aucun espoir d'écraser les communistes aujourd'hui. Nous nous contenterons du territoire qui est le nôtre, et rien de plus ; la Chine et Formose sont désormais deux entités distinctes."
 CHI_Taiwanese_Communist_Party_Victory:0 "Victoire du Parti communiste taïwanais"
 CHI_Taiwanese_Communist_Party_Victory_desc:0 "Le Parti communiste taïwanais a remporté les élections de 1954 ! Le Parti communiste taïwanais est connu pour… eh bien… le communisme."
 CHI_Emulate_the_Japanese_Communist_Party:0 "Prendre exemple sur le Parti communiste japonais"
 CHI_Emulate_the_Japanese_Communist_Party_desc:0 "Nous ne devons pas nous tourner vers des politiques staliniennes répressives. En suivant l'exemple des communistes japonais, nous privilégierons le développement économique plutôt que l'autoritarisme."
 CHI_Increase_Welfare:0 "Améliorer le bien-être"
 CHI_Increase_Welfare_desc:0 "Il est essentiel que nous allouions davantage de fonds aux soins de santé et à d'autres besoins, afin d'améliorer le bien-être de notre population et d'accroître la qualité de vie de tous."
 CHI_Socialist_Values:0 "Valeurs socialistes"
 CHI_Socialist_Values_desc:0 "Les valeurs socialistes pourraient s'avérer utiles à la République de Formose ; nous devons commencer à placer l'économie sous le contrôle du gouvernement et agir dans l'intérêt de notre peuple."
 CHI_Embrace_Secularism:0 "Adopter la laïcité"
 CHI_Embrace_Secularism_desc:0 "La religion est morte, et ces activités futiles ne feraient que nous détourner de notre développement économique et de notre défense nationale."
 CHI_Reconstruction:0 "Reconstruction"
 CHI_Reconstruction_desc:0 "Nous devons reconstruire notre pays après des années de guerre civile, de répression politique et de violence. Formose retrouvera toute sa force."
 CHI_Universal_Elementary_Education:0 "Enseignement primaire universel"
 CHI_Universal_Elementary_Education_desc:0 "Chaque enfant de notre pays, sans distinction de race ou de sexe, mérite de bénéficier d'une éducation équitable et impartiale. C'est ce que nous allons lui offrir."
 CHI_Reduce_Unemployment_Crisis:0 "Lutter contre la crise du chômage"
 CHI_Reduce_Unemployment_Crisis_desc:0 "Pour réduire le chômage, nous devons proposer des emplois aux gens, que ce soit dans le secteur public ou dans le secteur privé. Cela permettra de renforcer encore davantage notre économie."
 CHI_Reduce_Land_Rent_Costs:0 "Réduire les coûts liés à la location de terrains"
 CHI_Reduce_Land_Rent_Costs_desc:0 "L'agriculture à Taïwan pourrait être stimulée en réduisant les coûts de location des terres, ce qui permettrait à tout un chacun de se lancer dans l'agriculture et favoriserait une plus grande prospérité générale."
 CHI_Promote_Domestic_Industry:0 "Promouvoir l'industrie nationale"
 CHI_Promote_Domestic_Industry_desc:0 "Nous devons nous efforcer de maintenir l'ensemble de la production exclusivement à Taïwan ; nous ne pouvons plus dépendre des importations étrangères très longtemps."
 CHI_Repatriate_Former_Japanese_Property:0 "Restituer d'anciens biens japonais"
 CHI_Repatriate_Former_Japanese_Property_desc:0 "Ce qui appartenait autrefois aux Japonais nous appartient désormais. Tous les biens japonais situés à Taïwan deviendront la propriété de l'État."
 CHI_The_Farmers_Fields_Bill:0 "Le projet de loi sur les terres agricoles"
 CHI_The_Farmers_Fields_Bill_desc:0 "Le projet de loi sur les terres agricoles sera adopté par le Yuan législatif, ce qui accordera davantage de droits aux agriculteurs et permettra de vendre leurs excédents à des prix élevés, au bénéfice de l'État."
 CHI_American_Foreign_Aid:0 "Aide étrangère américaine"
 CHI_American_Foreign_Aid_desc:0 "Les États-Unis doivent accorder davantage d'aide étrangère pour nous permettre de soutenir notre économie et notre système de protection sociale en pleine expansion."
 CHI_Protectionism:0 "Protectionnisme"
 CHI_Protectionism_desc:0 "Afin de renforcer davantage notre économie, nous devons être contraints de taxer les importations, afin de donner à nos industries nationales un avantage sur le marché taïwanais."
 CHI_Increase_Literacy_Rates:0 "Augmenter les taux d'alphabétisation"
 CHI_Increase_Literacy_Rates_desc:0 "Notre système éducatif performant ne peut que faire progresser le taux d'alphabétisation de notre population et rendre les gens de plus en plus intelligents !"
 CHI_Economic_Integration_of_Recent_Immigrants:0 "Intégration économique des immigrants récents"
 CHI_Economic_Integration_of_Recent_Immigrants_desc:0 "Tous les immigrants récents, qu'ils viennent du continent ou d'ailleurs, seront intégrés rapidement et efficacement au marché du travail local, où ils deviendront de fiers exemples de la citoyenneté formosienne."
 CHI_Womens_Rights:0 "Droits des Femmes"
 CHI_Womens_Rights_desc:0 "Conformément à notre attachement aux libertés individuelles, les femmes devraient bénéficier des mêmes droits que les hommes en matière d'emploi, de vote et d'éducation."
 CHI_Establish_a_Minimum_Wage:0 "Fixer un salaire minimum"
 CHI_Establish_a_Minimum_Wage_desc:0 "L'époque des salaires ridiculement bas est révolue ! Compte tenu de l'inflation, le gouvernement fixera un salaire horaire minimum que chaque travailleur devra percevoir afin de tenir compte du coût de la vie."
 CHI_Expand_the_Port_of_Kaohsiung:0 "Agrandir le port de Kaohsiung"
 CHI_Expand_the_Port_of_Kaohsiung_desc:0 "Pendant l'occupation japonaise de Taïwan, plusieurs projets d'extension ont été lancés, mais leur dernière phase a été interrompue en raison de la Seconde Guerre mondiale. Nous devons poursuivre cette expansion afin de faire de Kaohsiung un port majeur pour Taïwan."
 CHI_Invest_in_Taipei:0 "Investir à Taipei"
 CHI_Invest_in_Taipei_desc:0 "Il faut investir massivement dans Taipei, notre brillante capitale ; elle a le potentiel de devenir un pôle du commerce international, et le gouvernement de Formose doit tout mettre en œuvre pour atteindre cet objectif."
 CHI_Urbanization:0 "Urbanisation"
 CHI_Urbanization_desc:0 "Nous devons urbaniser les grandes villes et les banlieues de Taïwan ; la population, qui connaît une croissance rapide, a besoin d'endroits où vivre et travailler, et les villes doivent s'étendre !"
 CHI_Lift_the_Ban_on_the_KMT:0 "Lever l'interdiction qui pèse sur le KMT"
 CHI_Lift_the_Ban_on_the_KMT_desc:0 "Même si le KMT est connu pour ses pratiques d'oppression politique et son autoritarisme, nous devons faire preuve de transparence dans le processus politique. L'interdiction sera levée, et le Kuomintang sera à nouveau autorisé à exercer ses activités à Taïwan."
 CHI_Promote_Democratic_Values:0 "Promouvoir les valeurs démocratiques"
 CHI_Promote_Democratic_Values_desc:0 "Nous ne voulons pas que Taïwan retombe dans un État policier sous le joug du KMT ; l'idée de démocratie doit être ancrée dans l'esprit de chaque citoyen afin qu'il puisse jouir pleinement de sa liberté et de sa prospérité."
 CHI_Housing_Reform:0 "Réforme du logement"
 CHI_Housing_Reform_desc:0 "À mesure que la population augmente, le gouvernement doit rendre le logement et son accès plus abordables et plus faciles à obtenir, en particulier pour les personnes à faibles revenus de notre société."
 CHI_Expand_Health_Access:0 "Améliorer l'accès aux soins de santé"
 CHI_Expand_Health_Access_desc:0 "L'accès aux soins de santé doit être garanti à tous. Le ministère de la Santé et des Affaires sociales doit déployer des efforts concrets pour garantir l'accès aux soins de santé à tous les citoyens de Taïwan, sans distinction de race, de sexe ou de croyance."
 CHI_Expand_Labor_Unions:0 "Développer les syndicats"
 CHI_Expand_Labor_Unions_desc:0 "Il faut redonner au peuple le pouvoir de négocier collectivement les droits des travailleurs. Les syndicats seront renforcés afin de permettre à l'homme ordinaire d'obtenir les droits qu'il mérite, par le biais d'un processus démocratique. Nous ne serons plus jamais des esclaves !"
 CHI_Freedom_of_the_Press:0 "Liberté de la presse"
 CHI_Freedom_of_the_Press_desc:0 "Sous le KMT, les médias ne seront plus ce qu'ils étaient. Il n'y aura plus de journaux d'État, et les médias seront autorisés à couvrir l'actualité gouvernementale et politique sans craindre de représailles, au nom de la liberté du peuple."
 CHI_Infrastructure_Modernization:0 "Modernisation des infrastructures"
 CHI_Infrastructure_Modernization_desc:0 "Nos routes, nos bâtiments publics, nos barrages, nos canaux et nos ports doivent être modernisés et mis à niveau pour s'adapter à l'évolution des temps. Nous ne pouvons pas laisser nos infrastructures essentielles vieillir et se délabrer dans un pays aussi prospère et florissant."
 CHI_China_Democratic_Socialist_Party_Victory_1958:0 "Victoire du Parti socialiste démocratique chinois en 1958"
 CHI_China_Democratic_Socialist_Party_Victory_1958_desc:0 "Le Parti socialiste démocratique chinois a remporté les élections de 1958 ! Le PSDC est connu pour son socialisme démocratique de centre-gauche, prônant la paix mondiale, les libertés individuelles et les systèmes de protection sociale."
 CHI_The_Formosan_Welfare_State:0 "L'État-providence taïwanais"
 CHI_The_Formosan_Welfare_State_desc:0 "Notre système social doit être considérablement développé afin de permettre l'émergence de tous les aspects d'un État-providence traditionnel ; Formose doit être reconnue pour son excellent système de santé et son État-providence géré par le gouvernement !"
 CHI_Socialized_Health_Care:0 "Système de santé public"
 CHI_Socialized_Health_Care_desc:0 "Le gouvernement de Formose assurera la prise en charge médicale de sa population grâce à une baisse des coûts et à des régimes d'assurance maladie, ce qui permettra aux citoyens de ne payer que très peu pour les consultations à l'hôpital ou les examens de routine."
 CHI_Establish_Pensions:0 "Mettre en place un régime de retraite"
 CHI_Establish_Pensions_desc:0 "Nos aînés doivent bénéficier des mêmes prestations et du même accompagnement que tous les autres citoyens de notre pays. Nous verserons des prestations de retraite ou des pensions aux retraités afin qu'ils puissent vivre confortablement pendant leurs vieux jours."
 CHI_Promote_World_Peace:0 "Promouvoir la paix dans le monde"
 CHI_Promote_World_Peace_desc:0 "Nous avons mis fin à notre conflit avec la Chine communiste, et nous exhortons tous les autres pays du monde à mettre de côté leurs divergences idéologiques ou politiques afin de faire de la Terre un endroit globalement plus sûr pour tous."
 CHI_Condemn_Soviet_Imperialism:0 "Condamner l'impérialisme soviétique"
 CHI_Condemn_Soviet_Imperialism_desc:0 "L'impérialisme soviétique a dépassé les bornes. L'ingérence soviétique en Europe de l'Est, au Moyen-Orient et en Asie du Sud-Est est allée trop loin."
 CHI_The_Plight_of_the_Indigenous_Formosans:0 "Le sort des autochtones de Formose"
 CHI_The_Plight_of_the_Indigenous_Formosans_desc:0 "Les autochtones de Formose ont beaucoup souffert ; le chômage élevé, un système éducatif défaillant, l'assimilation culturelle et la disparition des langues ont ruiné ces peuples autochtones."
 CHI_Rural_Investments:0 "Investissements rurales"
 CHI_Rural_Investments_desc:0 "Nous devons soutenir notre secteur agricole en investissant davantage dans l'immobilier rural, les exploitations agricoles et les aides aux cultures ; cela permettra de renforcer tant notre marché intérieur que nos marchés étrangers."
 CHI_China_Democratic_Socialist_Party_Victory:0 "Victoire du Parti socialiste démocratique chinois"
 CHI_China_Democratic_Socialist_Party_Victory_desc:0 "Le Parti socialiste démocratique chinois a remporté les élections de 1958 ! Le PSDC est connu pour son socialisme démocratique de centre-gauche, prônant la paix mondiale, les libertés individuelles et les systèmes de protection sociale."
 CHI_Reform_the_Formosan_Navy:0 "Réformer la marine de Formose"
 CHI_Reform_the_Formosan_Navy_desc:0 "Notre marine doit être réformée, tant au niveau de son équipement que de son personnel d'officiers ; la marine de Formose doit être réformée pour s'adapter à une stratégie défensive, en recourant aux équipements les plus modernes et aux dernières méthodes d'entraînement."
 CHI_Relations_With_South_Vietnam:0 "Relations avec le Sud-Vietnam"
 CHI_Relations_With_South_Vietnam_desc:0 "Il est impératif que le gouvernement de Taïwan établisse dès que possible des relations diplomatiques avec le Sud-Vietnam, car il s'agit là d'un autre pays asiatique menacé par les révolutionnaires communistes."
 CHI_Attract_Formosan_Loyalists:0 "Attirer les partisans de Formose"
 CHI_Attract_Formosan_Loyalists_desc:0 "Il faut rallier et soutenir les partisans du mouvement formosien et les peuples autochtones ; nous avons besoin de plus de diversité et de transparence au sein de notre gouvernement."
 CHI_A_Free_Formosa:0 "Une Formose libre"
 CHI_A_Free_Formosa_desc:0 "Il faut libérer Formose de la tyrannie du régime communiste chinois ! Nos troupes doivent être entraînées pour défendre notre pays !"
 CHI_Cooperate_with_the_Treaty_Ports:0 "Coopérer avec les ports signataires du traité"
 CHI_Cooperate_with_the_Treaty_Ports_desc:0 "Nous devons continuer à coopérer avec les ports ouverts imposés par les puissances occidentales, ce qui nous permettra de poursuivre nos échanges commerciaux avec le reste du monde."
 CHI_Reform_the_Tax_Code:0 "Réformer le code des impôts"
 CHI_Reform_the_Tax_Code_desc:0 "Notre système fiscal doit être réformé afin que nos citoyens les plus fortunés soient davantage imposés et ne puissent pas se soustraire à leurs obligations fiscales ; nos impôts sont indispensables au bon fonctionnement de l'État et à la prospérité de notre pays."
 CHI_New_Taiwan_Dollars:0 "Nouveaux dollars taïwanais"
 CHI_New_Taiwan_Dollars_desc:0 "Pour résoudre définitivement notre crise d'hyperinflation, nous allons mettre en place une nouvelle version du dollar taïwanais. Ce nouveau dollar vaudra 40 000 anciens dollars taïwanais et le gouvernement se fera un plaisir d'échanger toute la monnaie existante contre cette nouvelle version."
 CHI_Socialist_Unions:0 "Syndicats socialistes"
 CHI_Socialist_Unions_desc:0 "Les travailleurs doivent s'unir, non seulement au sein des syndicats, mais aussi au sein de groupes qui défendent les valeurs du socialisme et les moyens de production."
 CHI_Distance_Ourselves_From_Maoism:0 "Nous distancier du maoïsme"
 CHI_Distance_Ourselves_From_Maoism_desc:0 "Les principes communistes chinois, plus communément appelés maoïsme, sont odieux et ne conviennent pas à un pays comme Taïwan. Nous nous inspirerons des principes du socialisme yougoslave plutôt que des idées autoritaires et destructrices du maoïsme."
 CHI_Soviet_Aid:0 "Aide soviétique"
 CHI_Soviet_Aid_desc:0 "Nous solliciterons l'aide de l'Union soviétique afin de soutenir notre développement militaire et économique. Nous adoptons un régime politique spécifiquement socialiste, et l'URSS tirera profit de nos efforts."
 CHI_Establishing_a_Taiwanese_Identity:0 "Construire une identité taïwanaise"
 CHI_Establishing_a_Taiwanese_Identity_desc:0 "Notre identité nationale doit reposer sur les idéaux propres à Taïwan, notre patrie. Nous ne tolérerons aucun autre idéal que celui d'une identité typiquement taïwanaise."
 CHI_Limited_Collectivization:0 "Collectivisation limitée"
 CHI_Limited_Collectivization_desc:0 "Afin de renforcer notre secteur agricole, nous poursuivrons la création, dans une mesure limitée, d'exploitations agricoles publiques ou collectives, gérées par le gouvernement national ; cela permettra de centraliser notre approvisionnement alimentaire et nos techniques agricoles, et de garantir l'égalité sur l'ensemble du territoire."
 CHI_Ties_with_North_Korea:0 "Relations avec la Corée du Nord"
 CHI_Ties_with_North_Korea_desc:0 "Maintenant que nous sommes passés à un gouvernement socialiste, nous devons nouer des liens d'amitié avec la République populaire démocratique de Corée (RPDC), un autre grand pays socialiste d'Asie, réputé pour sa puissance économique et sa prospérité !"
 CHI_Encourage_Indigenous_Culture:0 "Promouvoir la culture autochtone"
 CHI_Encourage_Indigenous_Culture_desc:0 "Il faut accepter les citoyens autochtones de Taïwan pour leur culture et leurs différentes langues. Nous ne devons en aucun cas tenter de leur imposer notre culture, mais plutôt leur témoigner du respect."
 CHI_Egalitarian_Reforms:0 "Réformes égalitaires"
 CHI_Egalitarian_Reforms_desc:0 "Tous les habitants de Taïwan doivent être égaux ; nous devons réformer notre gouvernement et notre société afin qu'ils reflètent l'égalité de tous, sans distinction de sexe, de race ou de classe sociale."
 CHI_Soviet_Advisors:0 "Conseillers soviétiques"
 CHI_Soviet_Advisors_desc:0 "Nous devons accueillir dans notre pays des conseillers de l'URSS afin qu'ils nous aident dans nos affaires économiques et militaires."
 CHI_Join_COMECON:0 "Rejoindre le COMECON"
 CHI_Join_COMECON_desc:0 "Le COMECON, ou Conseil d'assistance économique mutuelle, est une organisation du bloc de l'Est destinée à aider tous les pays socialistes dans leurs affaires économiques, afin de les renforcer. Nous allons adhérer au COMECON, car tout soutien économique de la part de nos nouveaux alliés nous serait profitable."
 CHI_Condemn_Maoism:0 "Condamner le maoïsme"
 CHI_Condemn_Maoism_desc:0 "L'idéologie maoïste est erronée, et nous ne pouvons pas la soutenir. En tant que pays socialiste fier de l'être, nous devons dénoncer le maoïsme comme la philosophie erronée qu'il représente aujourd'hui."
 CHI_Aid_the_Vietminh:0 "Aider le Viêt Minh"
 CHI_Aid_the_Vietminh_desc:0 "Le Viêt Minh, une organisation anti-impérialiste vietnamienne, défend les idéaux du socialisme vietnamien et de la libération du colonialisme français. Nous devons soutenir leurs efforts de guérilla !"
 CHI_Taiwanese_Communist_Party_Victory_58:0 "Victoire du Parti communiste taïwanais de 1958"
 CHI_Taiwanese_Communist_Party_Victory_58_desc:0 "Le Parti communiste taïwanais a remporté les élections de 1958 ! Le Parti communiste taïwanais est connu pour… eh bien… le communisme."
 CHI_Reformation_of_the_State_and_Party:0 "Réforme de l'État et du Parti"
 CHI_Reformation_of_the_State_and_Party_desc:0 "Il est essentiel de réformer certains aspects de l'État afin d'assurer la prospérité politique et économique dans l'intérêt du peuple."
 CHI_Reform_the_Secret_Police:0 "Réformer la police secrète"
 CHI_Reform_the_Secret_Police_desc:0 "Notre police secrète doit être réformée et recyclée afin de refléter la nouvelle idéologie socialiste de l'État, et non plus celle de l'ancien régime fasciste."
 CHI_Reduce_Censorship:0 "Réduire la censure"
 CHI_Reduce_Censorship_desc:0 "Nos concitoyens doivent pouvoir exprimer leurs opinions sans subir de répression politique, comme c'était le cas sous l'ancien régime. Nous allons réduire la censure et le contrôle exercés sur les médias."
 CHI_American_Investors:0 "Investisseurs Américains"
 CHI_American_Investors_desc:0 "Les investisseurs américains devraient être autorisés à investir dans notre économie en pleine croissance ; cela serait bénéfique tant pour notre économie que pour les investisseurs eux-mêmes."
 CHI_CIA_Observers:0 "Observateurs de la CIA"
 CHI_CIA_Observers_desc:0 "La CIA (Agence centrale de renseignement américaine) tirera un grand profit de la présence d'observateurs à Taïwan ; notre emplacement est idéal pour surveiller les mouvements de la Chine communiste le long de la côte."
 CHI_Focus_on_the_Defensive:0 "Priorité à la défense"
 CHI_Focus_on_the_Defensive_desc:0 "Nous devons nous préparer à toute éventualité. Les communistes chinois sont désormais capables de bien des choses, et notre politique militaire doit être axée sur la défense de Taïwan."
 CHI_Bolster_the_Viet_Quoc:0 "Soutenir le Viet Quoc"
 CHI_Bolster_the_Viet_Quoc_desc:0 "Le Viet Quoc, ou VNQDD, est un parti nationaliste vietnamien qui milite pour la libération du joug colonial français. Nous devons soutenir ce parti dans ses actions anti-impérialistes."
 CHI_Open_Up_to_Foreign_Investment:0 "S'ouvrir aux investissements étrangers"
 CHI_Open_Up_to_Foreign_Investment_desc:0 "Il est important de dynamiser notre économie en autorisant les investissements étrangers dans nos industries et nos entreprises. Cela sera bénéfique tant pour notre économie que pour le monde entier."
 CHI_Join_SEATO:0 "Rejoindre l’OTASE"
 CHI_Join_SEATO_desc:0 "Avec la création de l'Organisation du traité de l'Asie du Sud-Est, il est impératif que Taïwan adhère à cette organisation afin de lutter contre l'agression de la République populaire de Chine, de la Corée du Nord et du Nord-Vietnam."
 CHI_American_Backed_Economic_Reforms:0 "Réformes économiques soutenues par les États-Unis"
 CHI_American_Backed_Economic_Reforms_desc:0 "Nous serions honorés de nous inspirer des idées américaines pour réformer notre économie et la rendre plus prospère que jamais !"
 CHI_Tolerate_Political_Dissenters:0 "Tolérer les dissidents politiques"
 CHI_Tolerate_Political_Dissenters_desc:0 "La liberté d'expression est l'élément le plus important d'une démocratie, et la dissidence politique est tolérée à Taïwan, mais n'est pas encouragée."
 CHI_Economic_Growth:0 "Croissance économique"
 CHI_Economic_Growth_desc:0 "Il faut renforcer notre économie et mener à bien une industrialisation rapide afin que Taïwan soit reconnue dans toute la région comme une puissance économique prospère."
 CHI_Increase_Relations_with_Vietnam_and_Korea:0 "Renforcer les relations avec le Vietnam et la Corée"
 CHI_Increase_Relations_with_Vietnam_and_Korea_desc:0 "Il faut renforcer notre économie et mener à bien une industrialisation rapide afin que Taïwan soit reconnue dans toute la région comme une puissance économique prospère."
 CHI_Cut_Our_Foreign_Losses:0 "Réduisons nos pertes à l'étranger"
 CHI_Cut_Our_Foreign_Losses_desc:0 "Nos investissements à l'étranger et nos exportations ne portent pas leurs fruits. Plutôt que de continuer à perdre de l'argent, nous allons résilier tous les contrats."
 CHI_Lift_the_Martial_Law:0 "Lever la loi martiale"
 CHI_Lift_the_Martial_Law_desc:0 "Les années de paranoïa et d'autoritarisme sont révolues. Nous devons revenir aux valeurs démocratiques et non violentes de notre passé. La loi martiale sera levée."
 CHI_Allow_Formation_of_New_Parties:0 "Autoriser la création de nouveaux partis"
 CHI_Allow_Formation_of_New_Parties_desc:0 "En accordant davantage de liberté, les citoyens pourront créer de nouveaux partis politiques, exprimer leur opinion sur le gouvernement et renforcer la démocratie au sein de la population."
 CHI_Limited_Democracy:0 "Démocratie limitée"
 CHI_Limited_Democracy_desc:0 "Le peuple a beau jouir de la démocratie, nous ne devons pas oublier les manœuvres agressives de la République populaire de Chine et d'autres pays communistes malveillants de la région, et nous devons faire tout ce qui est en notre pouvoir pour empêcher cela."
 CHI_Limit_American_Influence:0 "Limiter l'influence américaine"
 CHI_Limit_American_Influence_desc:0 "Les Américains en ont assez fait à Taïwan. Nous sommes indépendants, et bien que déterminés à enrayer la propagation du communisme, les États-Unis ne peuvent pas contrôler notre démocratie."
 CHI_State_Visit_From_Washington:0 "Visite d'État en provenance de Washington"
 CHI_State_Visit_From_Washington_desc:0 "Nous serons ravis d'inviter le président américain à se rendre à Taïwan afin de discuter ensemble de la démocratie et de la sécurité dans la région asiatique, tout en œuvrant pour la paix et la prospérité."
 CHI_Embrace_Capitalism:0 "Adopter le capitalisme"
 CHI_Embrace_Capitalism_desc:0 "Le capitalisme est synonyme de réussite pour Taïwan, et nos récents succès en matière de développement économique et d'investissements étrangers l'ont clairement démontré : le marché est une source de bienfaits pour nous."
 CHI_Militarist_Propaganda:0 "Propagande militariste"
 CHI_Militarist_Propaganda_desc:0 "Nos forces armées doivent être renforcées pour défendre nos côtes contre les communistes ! Nous devons recruter massivement."
 CHI_Prepare_for_Operation_National_Salvation:0 "Se préparer pour l'opération sauvetage national"
 CHI_Prepare_for_Operation_National_Salvation_desc:0 "Le moment est venu pour nous de dépasser Taïwan et de reprendre le contrôle du continent. Nous nous battrons pour reprendre le contrôle du continent !"
 KMT_Amend_the_Temporary_Provisions:0 "Modifier les dispositions provisoires"
 KMT_Amend_the_Temporary_Provisions_desc:0 "Maintenant que la rébellion communiste a été réprimée, nos dispositions provisoires peuvent être modifiées afin de rétablir la paix en Chine et de mettre fin à la mobilisation politique."
 KMT_Republic_of_China_Armed_Forces:0 "Forces armées de la République de Chine"
 KMT_Republic_of_China_Armed_Forces_desc:0 "Nos forces armées doivent être renforcées afin de servir de phare pour la liberté, la démocratie et l'anticommunisme dans toute la région asiatique !"
 KMT_The_Direction_of_the_Kuomintang:0 "La direction du Kuomintang"
 KMT_The_Direction_of_the_Kuomintang_desc:0 "Le Kuomintang doit devenir le premier parti politique de toute la Chine. Il est essentiel de contenir les communistes."
 KMT_The_Tibetan_Situation:0 "La situation au Tibet"
 KMT_The_Tibetan_Situation_desc:0 "Des rumeurs circulent dans la région tibétaine, évoquant l'indépendance et une révolution contre les forces d'occupation chinoises. Nous avons préservé leur liberté, cela ne durera pas."
 KMT_Republic_of_China_Army:0 "Réforme des forces armées de la République de Chine"
 KMT_Republic_of_China_Army_desc:0 "Notre armée révolutionnaire, autrefois glorieuse, doit être réformée afin d'unifier la Chine et d'assurer l'ordre, la paix et la prospérité dans notre nouvelle société démocratique."
 KMT_The_Hyperinflation_Crisis:0 "La crise de l'hyperinflation"
 KMT_The_Hyperinflation_Crisis_desc:0 "L'inflation de notre monnaie est allée trop loin ! Nous allons commencer à lutter contre la crise d'hyperinflation en Chine et à reconstruire notre industrie !"
 KMT_Establish_the_Institute_of_Nuclear_Energy_Research:0 "Créer l'Institut de recherche sur l'énergie nucléaire"
 KMT_Establish_the_Institute_of_Nuclear_Energy_Research_desc:0 "L'énergie nucléaire est l'avenir, et il est essentiel que la République de Chine se mette dès que possible à la construction de réacteurs nucléaires. Un institut sera créé afin de faciliter et de développer ces recherches."
 KMT_seeking_allies_in_asia:0 "À la recherche d'alliés à long terme en Asie"
 KMT_seeking_allies_in_asia_desc:0 "Miser principalement sur la diplomatie avec les puissances occidentales et refuser de nouer des alliances à long terme avec les pays de la région ne fera que nous isoler en Asie. Notre ministère des Affaires étrangères prendra contact avec ces nations anticommunistes de la région afin d'établir des relations mutuellement bénéfiques, dans l'espoir d'expulser le communisme du continent."
 KMT_korean_war:0 "Guerre dans la péninsule coréenne"
 KMT_korean_war_desc:0 "Peu avant la fin de la guerre civile chinoise, les Nord-Coréens ont injustement envahi le Sud, poussés par les tensions croissantes dans la région et forts de l'aval de la République populaire de Chine et de l'Union soviétique. Bien que notre nation se trouve dans la situation la plus défavorable qui soit, nous devons venir en aide à nos frères anticommunistes en Corée en leur apportant un soutien limité."
 KMT_support_rhee_government:0 "Soutenir le gouvernement de Rhee"
 KMT_support_rhee_government_desc:0 "Le gouvernement anticommuniste coréen dirigé par Rhee, avec lequel nous étions autrefois en désaccord, est désormais notre seul espoir d'empêcher le communisme de s'étendre à l'ensemble de la Corée ; nous devons l'aider, lui et son gouvernement, dans leur lutte pour se débarrasser de cette vermine communiste, même si cela ne se déroule pas exactement selon nos conditions."
 KMT_supply_the_ROK_with_CCW_arms:0 "Fournir au Sud du matériel de guerre civile"
 KMT_supply_the_ROK_with_CCW_arms_desc:0 "Comme nous n'avons plus besoin de compter sur les équipements obsolètes de notre stock, nous pouvons nous permettre d'en mettre une partie à la disposition de Rhee et de son armée pour les équiper avec des armes que nous avons nous-mêmes utilisées pendant notre propre guerre civile."
 KMT_military_advisors_for_korea:0 "Attaché militaire de la République de Corée"
 KMT_military_advisors_for_korea_desc:0 "Dans le but d'étendre le soutien militaire apporté aux Coréens, un poste d'attaché militaire a été créé pour la Corée, dans l'espoir d'aider leurs forces armées. Tant que la menace communiste pèsera sur l'Asie, rien ne limitera notre soutien à nos alliés anticommunistes."
 KMT_sino_korean_mutual_defense_treaty:0 "Proposer le traité de défense mutuelle sino-coréen"
 KMT_sino_korean_mutual_defense_treaty_desc:0 "Au cours de la guerre de Corée, la République de Chine et la République de Corée se sont rapprochées dans leur opposition au communisme, et les rancœurs du passé ont pratiquement disparu. En gage de l'amitié qui nous lie depuis ces dernières années, nous proposerons aux Coréens un pacte de défense mutuelle qui profitera aux deux nations."
 KMT_The_Legacy_of_the_Faustian_Bargain:0 "L'héritage du pacte faustien"
 KMT_The_Legacy_of_the_Faustian_Bargain_desc:0 "Nous avons remporté la guerre civile, mais nous devons désormais faire face à d'autres problèmes. Conformément à la définition du pacte faustien, nous avons désormais la Chine continentale, mais nous avons « vendu notre âme » au diable pour l'obtenir. Cela signifie que nous devons améliorer notre nouveau pays."
 KMT_Repress_the_Bandits:0 "Réprimer les bandits"
 KMT_Repress_the_Bandits_desc:0 "Les bandits et les seigneurs de guerre de la Chine continentale ne seront pas et ne pourront pas être des membres actifs du nouveau gouvernement. Ils s'opposent au Kuomintang et doivent donc être réduits au silence."
 KMT_Restoring_Rural_Order:0 "Rétablir l'ordre dans les zones rurales"
 KMT_Restoring_Rural_Order_desc:0 "Il faut rétablir l'ordre dans les régions rurales de Chine, celles qui sont particulièrement visées par les seigneurs de guerre locaux ou les communistes, qui ne sont pas fidèles au nouveau gouvernement. Nous ferons tout ce qui est en notre pouvoir pour garantir la sécurité de nos régions rurales."
 KMT_Combat_Opium_Usage:0 "Lutter contre la consommation d'opium"
 KMT_Combat_Opium_Usage_desc:0 "L'opium est une drogue dangereuse et mortelle qui a été introduite par les puissances européennes et qui nous a plongés dans la guerre internationale, les conflits internes et la ruine. Nous devons mettre fin à la consommation de cette drogue à tout prix pour protéger notre nouvelle nation."
 KMT_allow_current_societal_norms:0 "Accepter les normes sociales actuelles"
 KMT_allow_current_societal_norms_desc:0 "Toutes les normes importées par l'Occident ne sont pas mauvaises. Le jeu et la prostitution sont des vices nécessaires qui garantissent la subsistance et la docilité de notre population, tout en fournissant les emplois indispensables aux secteurs des casinos et de l'industrie du sexe."
 KMT_enforce_change_in_social_norms:0 "Réformer la société"
 KMT_enforce_change_in_social_norms_desc:0 "Minées par l'influence occidentale et la corruption, nos normes sociales actuelles, qui faisaient autrefois l'objet de vives critiques, sont aujourd'hui encouragées et s'intègrent dans la vie de chacun. Nous imposerons nos normes sociales à la population et tenterons de réformer la société."
 KMT_Promote_Christian_Missionary_Activity:0 "Promouvoir l'activité missionnaire chrétienne"
 KMT_Promote_Christian_Missionary_Activity_desc:0 "Conscients des bienfaits et de la bonne volonté que procure la foi chrétienne, nous autoriserons les missionnaires à entrer en Chine et à diffuser la parole de Dieu à tous ceux qui souhaitent l'entendre."
 KMT_reopen_sun_yat_sen_university:0 "Réouverture des universités nationales Sun Yat-sen"
 KMT_reopen_sun_yat_sen_university_desc:0 "À la mort du père fondateur, le Dr Sun Yat-Sen, quatre grandes universités ont été rebaptisées en son honneur après la campagne du Nord, notamment l'université de Wuhan, l'université du Zhejiang, l'université de Nanjing et l'université du Guangdong, qui ont toutes apporté des réalisations et des avancées académiques majeures à la nation. Lorsque les communistes ont envahi près de la moitié de la Chine, de nombreuses universités ont été occupées et rebaptisées par leurs soins. Maintenant que toutes les universités nationales Sun Yat-Sen sont à nouveau sous notre contrôle, nous pouvons les rouvrir en toute sécurité et les subventionner."
 KMT_support_the_western_allies:0 "Soutenir les Alliés occidentaux"
 KMT_support_the_western_allies_desc:0 "Bien qu'elles soient, au fond, colonialistes et impérialistes, les puissances occidentales ont été nos plus grands alliés pendant la guerre de résistance. Nous les soutiendrons dans leurs efforts et mettrons l'accent sur la coopération avec elles."
 KMT_anti_colonial_rhetoric:0 "Rhétorique anticolonialiste"
 KMT_anti_colonial_rhetoric_desc:0 "Les puissances coloniales se sont immiscées assez longtemps dans les affaires chinoises ! Nous agirons en toute indépendance, nous ne soutiendrons pas leurs aventures impérialistes en Asie et nous viendrons en aide à toutes les nations qui se trouvent sous la menace du colonialisme britannique et français."
 KMT_establish_embassies_in_indochina:0 "Ouvrir des ambassades au Laos, au Cambodge et en Thaïlande"
 KMT_establish_embassies_in_indochina_desc:0 "Après la capitulation du Japon et l'effondrement de l'autorité française en Indochine, divers États n'ont cessé de lutter pour affirmer leur indépendance vis-à-vis des puissances étrangères. Nous nouerons des liens d'amitié avec ces nations et ouvrirons des ambassades dans leurs capitales afin de leur apporter un soutien accru et de renforcer notre solidarité."
 KMT_seek_cooperation_with_Malaya:0 "Reconnaître la Fédération de Malaisie"
 KMT_seek_cooperation_with_Malaya_desc:0 "La Malaisie revêt un grand intérêt pour notre sphère d'influence, compte tenu de l'importante minorité de citoyens d'origine chinoise qui y réside. La fédération est actuellement en conflit permanent avec l'Armée de libération nationale malaisienne, d'inspiration maoïste, qui prétend mettre fin à la domination coloniale britannique et « libérer » la Malaisie."
 KMT_give_malaya_guns:0 "Envoyer un soutien militaire"
 KMT_give_malaya_guns_desc:0 "La Fédération de Malaisie et les forces britanniques ont besoin d'aide dans leur lutte contre les forces maoïstes de Chin Peng. Il est essentiel, pour la sécurité de la population de Malaya (qui compte plus de deux millions de citoyens d'origine chinoise), que l'ordre public soit maintenu et respecté."
 KMT_The_Tibetan_Reconcilation:0 "Réconciliation avec le Tibet"
 KMT_The_Tibetan_Reconcilation_desc:0 "Bien que le Tibet fasse partie de la Chine depuis la dynastie Yuan (avec quelques interruptions), il vaut mieux laisser cette région tranquille et ne pas contraindre les Tibétains, qui ne s'identifient pas comme Chinois, à s'intégrer à la culture han."
 KMT_Suppress_Ethnic_Seccessionists:0 "Réprimer les sécessionnistes ethniques"
 KMT_Suppress_Ethnic_Seccessionists_desc:0 "Il faut à tout prix empêcher ceux qui souhaitent faire sécession de notre grande et humble nation. Nous voulons être unis, et non divisés ; tous ceux qui s'opposent à l'autorité du gouvernement du Kuomintang seront placés en détention en tant que dissidents politiques."
 KMT_Launch_Sinicization_Campaign:0 "Lancer une campagne de sinisation"
 KMT_Launch_Sinicization_Campaign_desc:0 "La diffusion de la culture chinoise traditionnelle est au cœur de nos campagnes éducatives, et nous ferons tout notre possible pour que les peuples autochtones s'imprègnent de notre culture et du mode de vie typiquement chinois."
 KMT_Support_The_Viet_Quoc:0 "Rendre hommage au mouvement VNQDD de Vu Hong-Khanh"
 KMT_Support_The_Viet_Quoc_desc:0 "Vu Hong-Khanh a passé beaucoup de temps au sein du Kuomintang et de l'ancienne Armée nationale révolutionnaire (NRA) au cours des premières décennies de Nankin. Pendant la Seconde Guerre mondiale, il a été chargé de la formation et du recrutement de soldats vietnamiens et thaïlandais avant de retourner au Vietnam à la suite de la deuxième phase de la guerre civile chinoise, où il a soutenu les politiques anticommunistes et anti-françaises de Cuong De."
 KMT_The_White_Terror:0 "La terreur blanche"
 KMT_The_White_Terror_desc:0 "Notre situation est devenue critique ; certains opposants au régime du KMT doivent être placés en détention et interrogés sur leurs motivations idéologiques ; cela afin de garantir la loyauté et l'absence de toute opposition au parti au pouvoir de notre glorieuse Chine !"
 KMT_Utilize_Organized_Crime_Connetions:0 "Exploiter les liens avec le crime organisé"
 KMT_Utilize_Organized_Crime_Connetions_desc:0 "Les liens que notre gouvernement entretient avec les différents syndicats et triades sont trop précieux pour être rompus. Grâce à leur soutien, nous pouvons obtenir tout ce que nous voulons et devenir encore plus puissants !"
 KMT_Crackdown_on_Organized_Crime:0 "Lutter contre le crime organisé"
 KMT_Crackdown_on_Organized_Crime_desc:0 "Les familles et les organisations du crime organisé en Chine doivent être éradiquées. La corruption n'a pas sa place ici."
 KMT_Legitimize_Rural_Secret_Cults:0 "Légaliser les sectes secrètes rurales"
 KMT_Legitimize_Rural_Secret_Cults_desc:0 "Diverses sectes, telles que la Société du Sable Jaune, doivent être légitimées et intégrées à la société chinoise."
 KMT_Crush_Secret_Societies:0 "Écraser les sociétés secrètes"
 KMT_Crush_Secret_Societies_desc:0 "Les sociétés secrètes sont un fléau pour notre monde et pourraient servir à fomenter la résistance ou la rébellion contre notre régime. Nous ne tolérerons plus leur existence."
 KMT_recall_VNQDD_members:0 "Formation des milices Viet-Quoc"
 KMT_recall_VNQDD_members_desc:0 "De nombreux membres du VNQDD sont menacés d'exécution et de répression par les régimes de Hanoï et de Saigon ; nous devons les aider à survivre en encourageant et en soutenant la guérilla et la lutte clandestine, ainsi qu'en leur offrant l'asile ici, en République de Chine, et en commençant à les former pour qu'ils soient prêts."
 KMT_send_hanjians_to_labour_camps:0 "Développer les camps de travail pour les Hanjians"
 KMT_send_hanjians_to_labour_camps_desc:0 "Ceux qui ont soutenu les communistes et les Japonais traîtres doivent être sévèrement punis ; ils seront envoyés dans les camps de travail chinois récemment ouverts, où ils serviront la République jusqu’à ce que le gouvernement juge bon de les réinsérer dans la société."
 KMT_remove_these_traitors_entirely:0 "Éliminer tous les traîtres"
 KMT_remove_these_traitors_entirely_desc:0 "Ces traîtres ne méritent plus de vivre ; il faut faire un exemple pour ceux qui ont l'audace de collaborer avec cette maladie de la peau et du cœur ; nous ne tolérerons plus ces traîtres !"
 KMT_Commencen_the_Show_Trials:0 "Que les procès-spectacles commencent"
 KMT_Commencen_the_Show_Trials_desc:0 "Il faut faire un exemple de ces personnes qui ont collaboré avec les Japonais et les communistes pendant leur invasion et leur occupation. Nous ne tolérerons pas les traîtres ici !"
 KMT_Pardon_Japanese_Collaborators:0 "Gracier les collaborateurs japonais"
 KMT_Pardon_Japanese_Collaborators_desc:0 "Nous devons mettre l'accent sur l'égalité, et maintenant que la Chine est entrée dans une nouvelle ère, nous devons pardonner et nous libérer de toutes les fautes du passé ; ceux qui ont collaboré avec les Japonais seront pardonnés."
 KMT_harden_grip_over_the_media:0 "Renforcer notre emprise sur les médias"
 KMT_harden_grip_over_the_media_desc:0 "Il existe encore de nombreux médias qui restent autonomes et échappent à notre contrôle, tout en diffusant des critiques à l'encontre de notre glorieux Parti et en soutenant les communistes traîtres de Mandchourie. Tous les médias opérant en Chine seront nationalisés par nos soins, et nous punirons ceux qui oseront répandre de fausses rumeurs sur le Parti et la République."
 KMT_Investigate_Land_Reform:0 "Étudier la réforme agraire"
 KMT_Investigate_Land_Reform_desc:0 "Il est essentiel que notre gouvernement étudie et recherche les meilleures politiques en matière de réforme agraire, afin de faire de notre pays le plus prospère dans le secteur agricole."
 KMT_Commit_to_Land_Reform:0 "S'engager en faveur de la réforme agraire"
 KMT_Commit_to_Land_Reform_desc:0 "Il est évident qu'une réforme s'impose pour favoriser la redistribution des biens immobiliers et des exploitations agricoles au profit du grand public. Le gouvernement s'attellera volontiers à cette tâche !"
 KMT_Implement_Georgist_Tax_Reforms:0 "Mettre en œuvre les réformes fiscales géorgistes"
 KMT_Implement_Georgist_Tax_Reforms_desc:0 "Dans ses « Trois principes du peuple », le Dr Sun Yat-Sen a proposé au gouvernement des moyens de garantir l'égalité des droits fonciers en s'appuyant sur la valeur imposable foncière issue du géorgisme. La théorie de Sun prévoit que tout propriétaire foncier qui surévalue la valeur de ses terres se verra imposer un taux plus élevé. Si un propriétaire décide de sous-évaluer la valeur de ses terres, celles-ci pourront être rachetées à moindre coût par le gouvernement, ce qui contraint les propriétaires à déclarer la valeur réelle de leurs terres aux autorités."
 KMT_Allow_Clique_Autonomy:0 "Permettre l'autonomie des cliques"
 KMT_Allow_Clique_Autonomy_desc:0 "Il faut accorder davantage de liberté aux différentes cliques de Chine continentale, car elles feront office de gouvernements locaux ; cela permettra de maintenir la paix et de garantir la loyauté envers le gouvernement national."
 KMT_Compensate_Landowners:0 "Indemniser les propriétaires fonciers"
 KMT_Compensate_Landowners_desc:0 "En contrepartie de la culture de leurs produits et de leur mise sur le marché, nous verserons une compensation ou une subvention afin d'aider nos propriétaires fonciers à faire face à la hausse des coûts agricoles."
 KMT_Liquidate_Uncooperative_Landlords:0 "Mettre en liquidation les propriétaires récalcitrants"
 KMT_Liquidate_Uncooperative_Landlords_desc:0 "Tout propriétaire foncier qui refuserait de se conformer à la nouvelle réforme agraire de l'État sera interpellé et interrogé ; nous voulons garantir l'égalité en matière d'agriculture et d'accès à la terre à tous ceux qui souhaitent devenir agriculteurs."
 KMT_Take_Half_Measures:0 "Faire les choses à moitié"
 KMT_Take_Half_Measures_desc:0 "Aux yeux du Kuomintang, la réforme agraire n'est pas nécessaire ; nous ne voyons aucune raison de lancer des projets de grande envergure ni même d'apporter le strict minimum de soutien si cela n'est pas nécessaire."
 KMT_Seize_Collaborators_Land:0 "Saisir les terres des collaborateurs"
 KMT_Seize_Collaborators_Land_desc:0 "Les personnes ayant collaboré avec les communistes ou les occupants japonais seront dûment punies, et leurs terres seront confisquées par l'État, dans l'espoir qu'elles soient redistribuées à des citoyens plus loyaux."
 KMT_Reward_Kuomitang_Loyalists:0 "Récompenser les partisans du Kuomintang"
 KMT_Reward_Kuomitang_Loyalists_desc:0 "Ceux qui sont restés fidèles et déterminés envers le KMT seront récompensés par des terres ou des biens immobiliers supplémentaires, afin de pouvoir créer leur exploitation agricole ou leur entreprise."
 KMT_Commit_to_Reform:0 "S'engager en faveur de la réforme"
 KMT_Commit_to_Reform_desc:0 "Depuis que nous avons libéré le continent, le gouvernement au pouvoir a rencontré de nombreuses difficultés. Des réformes s'imposent pour renforcer notre emprise sur ce nouveau territoire et garantir que nos citoyens soient traités équitablement."
 KMT_Deny_Need_to_Reform:0 "Refuser la nécessité d'une réforme"
 KMT_Deny_Need_to_Reform_desc:0 "Il est évident que le glorieux gouvernement chinois n'a pas besoin de réformes : nous sommes forts et nous avons reconquis le continent sans aucune nouvelle « réforme » ; elles ne sont tout simplement pas nécessaires."
 KMT_Lift_Martial_Law:0 "Lever la loi martiale"
 KMT_Lift_Martial_Law_desc:0 "Nous ne voyons pas la nécessité de maintenir la loi martiale. La guerre civile est terminée, et les communistes ont été efficacement maîtrisés. La population nous est fidèle, et nous ne voyons pas la nécessité de lui imposer de nouvelles mesures autoritaires."
 KMT_Lift_Martial_Law2_desc:0 "Nous ne voyons pas la nécessité de maintenir la loi martiale. La guerre civile est terminée, et les communistes ont été efficacement maîtrisés. La population nous est fidèle, et nous ne voyons pas la nécessité de lui imposer de nouvelles mesures autoritaires."
 KMT_Continue_Martial_Law:0 "Prolonger la loi martiale"
 KMT_Continue_Martial_Law_desc:0 "Il est évident que les communistes et les opposants à la direction du Kuomintang continuent de représenter une menace pour notre sécurité intérieure. La loi martiale restera en vigueur afin de garantir que ces individus soient traduits en justice."
 KMT_Strengthen_Grip_Over_Cliques:0 "Renforcer le contrôle sur les cliques"
 KMT_Strengthen_Grip_Over_Cliques_desc:0 "Nous devons renforcer notre emprise sur les cliques ; leur participation à notre régime permettra de garantir davantage la loyauté du peuple à notre égard."
 KMT_Empower_the_Cliques:0 "Donner du pouvoir aux cliques"
 KMT_Empower_the_Cliques_desc:0 "Au lieu d'essayer d'intégrer les différentes cliques à notre régime, nous leur accorderons certaines libertés, mais elles apprendront à rester sous notre surveillance attentive, sinon des événements très désagréables se produiront."
 KMT_The_Central_Reform_Committee:0 "Le Comité central de réforme"
 KMT_The_Central_Reform_Committee_desc:0 "Nous devons mettre en place le Comité central de réforme du Kuomintang, qui sera chargé de réinventer et de transformer le KMT en un parti plus démocratique et plus proche du peuple, en s'appuyant sur l'idéologie des Trois Principes du Peuple, élaborée par notre fondateur, Sun Yat-sen."
 KMT_Launch_Kuomintang_Reorganization:0 "Lancer la réorganisation du Kuomintang"
 KMT_Launch_Kuomintang_Reorganization_desc:0 "Il est désormais évident que le Kuomintang a désespérément besoin de réformes. Les luttes intestines incessantes entre les différentes factions, ainsi que le manque de formation des cadres supérieurs, conduisent à une gouvernance inefficace. Nous devons agir et prendre des mesures pour stabiliser et unir le parti dans son ensemble."
 KMT_Establish_A_Social_Base:0 "Définir une base sociale"
 KMT_Establish_A_Social_Base_desc:0 "Au cours des dernières décennies, le Kuomintang a perdu le soutien des paysans au profit du Parti communiste, et celui des universitaires, des étudiants et des intellectuels au profit des États-Unis. L'heure est venue pour le Kuomintang de se réinventer en tant que véritable parti du peuple chinois."
 KMT_Encourage_Cadre_Training:0 "Formation des cadres du Parti"
 KMT_Encourage_Cadre_Training_desc:0 "La faiblesse de l'organisation du Kuomintang a failli causer sa défaite face au PCC. Le généralissime Tchang s'est plaint du fait que les membres du parti ne reçoivent pas une formation adéquate lorsqu'ils adhèrent au KMT. Il faut que cela change."
 KMT_Fortify_Tridemism_Mainland:0 "La doctrine San-Min"
 KMT_Fortify_Tridemism_Mainland_desc:0 "Le Dr Sun Yat-sen est le père fondateur de la République de Chine ; il a élaboré la philosophie des « Trois Principes du Peuple », qui allient démocratie, bien-être social et nationalisme. Le nouveau Kuomintang purifiera sa pensée et se tiendra prêt à mettre en œuvre ces Trois Principes afin qu’ils servent de modèle à une Chine véritablement moderne, démontrant ainsi que les idéologies communistes sont néfastes pour le peuple chinois et sa culture."
 KMT_send_ching_kuo_to_shanghai:0 "Envoyer Chiang Ching-Kuo à Shanghai"
 KMT_send_ching_kuo_to_shanghai_desc:0 "La ville de Shanghai, qui revêt une importance capitale pour la Chine tant sur le plan économique que politique, s'est transformée ces dernières années en une dystopie à la suite de la fin de la guerre civile chinoise. Nos précédentes tentatives de réforme des politiques de la ville, s'appuyant sur la ligne dure de Ching-Kuo contre la corruption locale en 1948, ont lamentablement échoué, car elles ont privé le Kuomintang du soutien dont il bénéficiait initialement et n'ont pas réussi à gagner le soutien des classes populaires. La guerre civile étant désormais bel et bien terminée, nous pouvons nous permettre de perdre quelques partisans dans le processus de transformation de la ville en une utopie afin d'attirer le soutien des classes populaires."
 KMT_restore_bai_as_minister_of_national_defense:0 "Réintégrer Bai au poste de ministre de la Défense nationale"
 KMT_restore_bai_as_minister_of_national_defense_desc:0 "La nouvelle clique du Guangxi, dirigée par Li Zongren, a toujours représenté une menace pour notre régime depuis le déclenchement de la guerre des Plaines centrales en 1930. Pendant la guerre de résistance, nous nous sommes efforcés d'éloigner de l'influence de Li des membres clés tels que Bai Chongxi. Nous maintiendrons notre politique de « diviser pour régner » à l'encontre de la nouvelle clique du Guangxi, et nous veillerons à ce qu'elle ne puisse plus jamais constituer une menace pour le gouvernement de Nankin."
 KMT_Chen_Cheng_50s_Rent_cap:0 "La réduction de loyer de 37,5%"
 KMT_Chen_Cheng_50s_Rent_cap_desc:0 "La politique de réduction des loyers mise en place par Chen Cheng vise à plafonner le loyer versé par les agriculteurs aux propriétaires fonciers à 37,5 % de la récolte. Avant cette directive, les propriétaires fonciers exigeaient souvent plus de la moitié de la récolte en guise de paiement. Le président espère que cette initiative lui permettra de bénéficier d'un soutien plus large de la part des paysans chinois, tout en espérant qu'elle mettra un terme à la propagation du marxisme au sein de la République."
 KMT_Sideline_Opposition_Factions:0 "Mettre les factions rivales sur la touche"
 KMT_Sideline_Opposition_Factions_desc:0 "Les différentes factions rivales au sein du KMT, telles que la « clique des sciences politiques » et la « faction de Whampoa », nuisent collectivement à l'efficacité du gouvernement central sans même le vouloir. Nous devons prendre des mesures pour mettre fin aux divisions politiques au sein du Kuomintang et tenter de rassembler toutes les différentes ailes, afin de réduire la corruption et d'assurer une gouvernance plus efficace."
 KMT_Integrate_Intelligensa:0 "Intégrer le cercle des sciences politiques"
 KMT_Integrate_Intelligensa_desc:0 "La « clique des sciences politiques » est une faction au sein du Kuomintang composée principalement d'intellectuels, à quelques exceptions près, et placée sous l'autorité de Zhang Qun, ancien gouverneur du Sichuan et Premier ministre de la République de Chine. Bien que peu structurée, cette faction peut nous servir à faire avancer nos objectifs en faveur d'une Chine réformée par le biais de l'intégration."
 KMT_Deradicalize_the_CC_Clique:0 "Réformer la Clique du Club central"
 KMT_Deradicalize_the_CC_Clique_desc:0 "La faction CC, une branche d'extrême droite au sein du Kuomintang, et ses politiques sont en profond désaccord avec le nouveau gouvernement réformé du Kuomintang. Bien qu'il nous soit impossible d'écarter le dernier des frères Chen (Chen Guofu étant décédé au début de l'année 1951), Chen Lifu continuera d'occuper un poste important au sein du gouvernement en raison de son amitié de longue date avec Tchang Kaï-chek. Cependant, la clique doit prendre conscience que les intérêts fonciers et les anciennes méthodes traditionnelles de gouvernance ne correspondent pas à notre programme actuel et doivent être révisés."
 KMT_Strengthen_the_Secret_Police:0 "Renforcer la police secrète"
 KMT_Strengthen_the_Secret_Police_desc:0 "Nos services secrets doivent être considérablement renforcés afin de soutenir nos opérations visant à garantir la loyauté et à écraser tous ceux qui s'opposent à nos idéaux patriotiques et nationaux."
 KMT_collaborate_with_other_parties:0 "Collaboration avec les parties concernées"
 KMT_collaborate_with_other_parties_desc:0 "Le Parti de la Jeune Chine et le Parti socialiste démocratique chinois ont accepté de se joindre à nous dans la lutte contre le communisme et pour l'instauration d'une république forte. Nous devons mettre de côté nos divergences et collaborer efficacement, tout en nous assurant de leur loyauté dans la lutte pour la république."
 KMT_Outlaw_Labor_Strikes:0 "Protection des jeunes travailleurs"
 KMT_Outlaw_Labor_Strikes_desc:0 "Les grèves menaceront notre stabilité. Le gouvernement a donc décidé de lancer de petites campagnes sociales visant à améliorer les conditions de travail des salariés, de manière à éviter les grèves à grande échelle. Nous espérons que cela dissuadera les sympathisants communistes de poursuivre leurs rêves utopiques et renforcera le soutien dont bénéficie notre gouvernement."
 KMT_Play_the_Cliques_Against_Each_Other:0 "Monter les clans les uns contre les autres"
 KMT_Play_the_Cliques_Against_Each_Other_desc:0 "Les différentes factions du KMT sont divisées et divergent quant à leurs convictions et leurs objectifs pour le parti ; il est nécessaire de les monter les unes contre les autres afin de réduire la résistance à notre idéologie nationaliste au sein du parti."
 KMT_Restrain_American_Influence:0 "Limiter l'influence américaine"
 KMT_Restrain_American_Influence_desc:0 "L'influence américaine est allée assez loin ; nous avons gagné notre guerre civile et avons violemment écrasé les communistes qui subsistaient après ce conflit. Nous sommes désormais autonomes et n'avons besoin ni de l'aide ni de l'argent de Washington."
 KMT_Crackdown_on_the_Intellectual_Elites:0 "Persécuter les mouvements de gauche"
 KMT_Crackdown_on_the_Intellectual_Elites_desc:0 "Les mouvements de gauche, tels que le Parti démocratique chinois ou l'ancienne aile gauche du Kuomintang, constituent une menace pour notre sécurité nationale, notamment en raison de la diffusion d'idées contraires aux objectifs du KMT. Les membres de ces mouvements et partis seront mis à l'écart en leur attribuant des postes sans importance."
 KMT_institute_ching_kuo_reforms_nationwide:0 "Mettre en œuvre les réformes de l'Institut Chiang Ching-kuo à l'échelle nationale"
 KMT_institute_ching_kuo_reforms_nationwide_desc:0 "Ching-Kuo a déployé des efforts considérables pour mettre fin au chaos économique qui régnait à Shanghai, transformant ainsi cette ville, autrefois en ruines, en une ville modèle. Compte tenu du succès retentissant de ces réformes, nous devons les mettre en œuvre dans d’autres grandes villes telles que Nanjing, Guangzhou et même Wuhan. Nous devons faire passer le bien-être du peuple chinois avant la recherche du profit, même si cela implique de renoncer à ceux qui nous étaient autrefois fidèles."
 KMT_Supremacy_of_CKS:0 "Le triomphe de Tchang Kaï-chek"
 KMT_Supremacy_of_CKS_desc:0 "À la suite des réformes au sein du Kuomintang, toutes les autres factions politiques rivales ont été mises sur la touche et Tchang Kaï-chek a fait pencher la balance du parti en sa faveur. Tchang Kaï-chek a ainsi pris le contrôle d'une grande partie du Kuomintang."
 KMT_Replace_Untrustworthy_Governors:0 "Remplacer les gouverneurs indignes de confiance"
 KMT_Replace_Untrustworthy_Governors_desc:0 "Les défections massives ont constitué un problème majeur durant la phase finale de la guerre civile chinoise. Afin de convaincre nos gouverneurs de rester fidèles, nous avons dû leur accorder d'importantes concessions pour garantir leur loyauté. Aujourd’hui, alors qu’une certaine stabilité revient en Chine, nous devrions réexaminer notre choix de gouverneurs et envisager de remplacer certains individus indignes de confiance."
 KMT_Outreach_to_the_Panchen_Lama:0 "Prise de contact avec le Panchen Lama"
 KMT_Outreach_to_the_Panchen_Lama_desc:0 "Le Panchen Lama, deuxième chef spirituel du bouddhisme tibétain, joue un rôle essentiel pour notre cause et il faut le rencontrer dès que possible afin d'éviter une crise au Tibet."
 KMT_Launch_Investigations_into_Warlords:0 "Ouvrir des enquêtes sur les seigneurs de guerre"
 KMT_Launch_Investigations_into_Warlords_desc:0 "Il faut mener une enquête approfondie sur les chefs de guerre de chaque région afin de mettre au jour leurs agissements et leurs véritables intentions auprès du gouvernement national ; nous devons nous assurer de leur loyauté."
 KMT_Condemn_the_Dalai_Lama:0 "Condamner le Dalaï-Lama"
 KMT_Condemn_the_Dalai_Lama_desc:0 "En cherchant à imposer l'indépendance du Tibet, le Dalaï-Lama prive son peuple de la protection et de la sécurité offertes par la République de Chine. Nous condamnons toutes ses actions sécessionnistes."
 KMT_Demand_Tibetan_Submission:0 "Demander la soumission tibétaine"
 KMT_Demand_Tibetan_Submission_desc:0 "Nous exigeons que le Tibet renonce à ses revendications et reprenne sa place au sein de la République de Chine en tant que province à part entière de notre pays ; la résistance et les menaces d'indépendance ne serviront en rien leur cause."
 KMT_Back_Coup_by_Panchen_Lama:0 "Coup d'État du Panchen Lama"
 KMT_Back_Coup_by_Panchen_Lama_desc:0 "Afin de mettre un terme à ces actes ignobles commis par le Dalaï-Lama, nous allons soutenir son second, le Panchen-Lama, dans sa tentative de renverser le gouvernement régional tibétain et d'en prendre le contrôle."
 KMT_Recognize_Tibetan_Independence:0 "Reconnaître l'indépendance du Tibet"
 KMT_Recognize_Tibetan_Independence_desc:0 "Le Tibet a proclamé son indépendance vis-à-vis de notre pays, et étant en mesure de l'accepter, nous reconnaîtrons le Tibet comme une nation souveraine et espérons que les autres nations amies du monde feront de même."
 KMT_Settle_Border_Claims_with_India:0 "Régler les différends frontaliers avec l'Inde"
 KMT_Settle_Border_Claims_with_India_desc:0 "Toujours au sujet des frontières occidentales, notre frontière avec la République de l'Inde fait l'objet de nombreuses controverses ; au nom de la paix, nous proposons de régler dès que possible les différends frontaliers avec l'Inde afin d'éviter tout conflit."
 KMT_Invade_Tibet:0 "Envahir le Tibet"
 KMT_Invade_Tibet_desc:0 "Le Tibet en a assez des rébellions et de la résistance ! Afin de démontrer notre capacité à faire respecter la loi et notre opposition à l'indépendance du Tibet, nos divisions les plus performantes et les mieux équipées envahiront le Tibet et réprimeront toute résistance."
 KMT_Crush_the_Tibetan_Aristocracy:0 "Tolérer l'aristocratie tibétaine"
 KMT_Crush_the_Tibetan_Aristocracy_desc:0 "Si la classe supérieure tibétaine a peut-être été à l'origine de la rébellion dans la région, l'aristocratie tibétaine n'en reste pas moins un acteur essentiel pour la stabilité et le maintien des traditions dans la région. C'est pourquoi le gouvernement a décidé de tolérer le statut de l'aristocratie tibétaine, tout en exerçant une certaine surveillance."
 KMT_reforge_the_tip:0 "Reconstituer le Parti pour l'amélioration du Tibet"
 KMT_reforge_the_tip_desc:0 "Afin de promouvoir l'autonomie et la stabilité au Tibet, nous autoriserons le Parti pour l'amélioration du Tibet, une formation locale, à diriger le gouvernement régional et à mener ses propres politiques intérieures. Cela permettra de combler le fossé entre le gouvernement centralisé de Nanjing et les préoccupations liées à l'oppression à Lhassa."
 KMT_Sinicization_of_Tibet:0 "La sinisation du Tibet"
 KMT_Sinicization_of_Tibet_desc:0 "Nous ferons valoir nos convictions constitutionnelles et politiques au Tibet afin de les harmoniser avec votre société, notre système politique et la République de Chine dans son ensemble."
 KMT_reinforce_authority_in_jiangxinpo:0 "Se tourner vers la frontière du Yunnan"
 KMT_reinforce_authority_in_jiangxinpo_desc:0 "La région de Birmanie est plongée dans un chaos permanent depuis l'indépendance de la colonie britannique, avec de nombreuses insurrections et mouvements séparatistes qui sévissent dans les campagnes birmanes, opposant une forte résistance au gouvernement de Rangoon. Cela nous offre toutefois l'occasion de reprendre le contrôle du nord du Kachin, également connu sous le nom de « Jiangxinpo », qui sera rattaché à la province du Yunnan une fois ce contrôle rétabli."
 KMT_the_manchurian_issue:0 "La question mandchoue"
 KMT_the_manchurian_issue_desc:0 "À notre arrivée à Pékin, l'ancienne capitale impériale, l'Union soviétique nous a lancé un ultimatum : soit nous faisions demi-tour et renoncions à poursuivre notre avancée en Mandchourie, soit nous nous exposions à des « conséquences désastreuses ». Nos contraintes logistiques et politiques nous ont contraints à accepter cet ultimatum, sauvant ainsi de justesse le Parti communiste chinois de l'anéantissement total. Cependant, le statu quo ne durera pas éternellement..."
 KMT_expand_military_infrastructure_hebei_alsha:0 "Développer les infrastructures militaires sur le rideau"
 KMT_expand_military_infrastructure_hebei_alsha_desc:0 "L'Alliance militaire soviétique a rapidement étendu ses frontières jusqu'à la République. Le Xinjiang, la Mongolie et la Mandchourie sont sous occupation étrangère et constituent une grave menace pour la sécurité nationale. Il est essentiel de développer les infrastructures et la logistique afin de consolider notre position actuelle."
 KMT_announce_the_one_china_policy:0 "Annoncer la politique d'une seule Chine"
 KMT_announce_the_one_china_policy_desc:0 "Le régime en Mandchourie n'est qu'un gouvernement fantoche soviétique, dépourvu de toute crédibilité et légitimité internationales. En tant que membre permanent du Conseil de sécurité de l'ONU, nous proclamerons le principe « d'une seule Chine », affirmant qu'il n'existe qu'une seule Chine, qui comprend non seulement les territoires actuellement contrôlés par la République de Chine, mais aussi la Mandchourie, la Mongolie, le Tibet, Macao, Hong Kong et le Xinjiang. Les nations qui souhaitent maintenir des relations diplomatiques avec notre gouvernement sont tenues d'accepter ce concept. Dans le cas contraire, il n'y aura aucune communication diplomatique."
 KMT_the_kung_chao_doctrine:0 "La doctrine Kung-Chao"
 KMT_the_kung_chao_doctrine_desc:0 "Après plusieurs jours de consultations et de discussions, le ministère des Affaires étrangères et le président sont parvenus à un accord concernant la position officielle de la République de Chine sur le statut international de la Mandchourie. Conformément à la « politique d'une seule Chine » de la République de Chine, la Mandchourie fait partie intégrante de la République de Chine et se trouve actuellement sous contrôle séparatiste. Nankin a donc annoncé la « doctrine Kung-Chao », du nom de l'actuel ministre des Affaires étrangères George Kung-Chao, qui prévoit des sanctions à l'encontre de tout État cherchant à établir des relations diplomatiques avec le PCC en Mandchourie."
 KMT_intensify_border_controls:0 "Renforcer les contrôles aux frontières"
 KMT_intensify_border_controls_desc:0 "Nous ne pouvons pas prendre le risque que des agents communistes dormants infiltrent la République via la Mandchourie ou la Mongolie. Des contrôles frontaliers plus stricts doivent être mis en place dans ces régions afin d'empêcher les espions de pénétrer sur notre territoire."
 KMT_send_spies_into_ccp_territory:0 "Envoyer des espions en Mandchourie communiste"
 KMT_send_spies_into_ccp_territory_desc:0 "Il est essentiel de se renseigner sur les projets et les ambitions du Parti communiste en Mandchourie. Nous enverrons nos meilleurs espions en Mandchourie afin qu’ils nous fournissent des informations sur la situation actuelle du PCC, ses politiques et ses projets à l’encontre de notre régime."
 KMT_Tibet_accepts_submission:0 "Le Tibet accepte la soumission"
 KMT_Tibet_accepts_submission_desc:0 "Après plusieurs jours de négociations à la table des pourparlers, le Tibet a accepté notre ultimatum. Le Dalaï-Lama renonce à ses revendications d'indépendance, mais reste à la tête du gouvernement local du Tibet, conservant le monopole sur l'élaboration de la politique intérieure tout en soumettant sa politique étrangère à Nanjing."
 KMT_Tibet_refuses_submission:0 "Le Tibet refuse la soumission"
 KMT_Tibet_refuses_submission_desc:0 "Après plusieurs jours de négociations à la table des pourparlers, le Tibet a rejeté notre ultimatum. Le Dalaï-Lama ne renonce pas à ses revendications d'indépendance et a clairement déclaré que le Tibet ne fait pas partie de la Chine et ne le sera plus jamais."
 KMT_End_Political_Commissars:0 "Fin des commissaires politiques"
 KMT_End_Political_Commissars_desc:0 "Les commissaires politiques constituent une particularité purement communiste de l'armée, et nous ne serons jamais comme cette racaille communiste ! Il est nécessaire de surveiller les convictions idéologiques de nos troupes, mais les commissaires ne le sont pas."
 KMT_Crackdown_on_Party_Corruption:0 "Lutte contre la corruption au sein du parti"
 KMT_Crackdown_on_Party_Corruption_desc:0 "La corruption politique est un problème majeur au sein du KMT, mais aussi dans tout le pays. Nous devons éradiquer toute forme de corruption afin de rendre le gouvernement plus efficace et de le mettre au service du peuple, plutôt que de servir des intérêts personnels."
 KMT_Republic_of_China_Air_Force:0 "Force Aérienne de la République de Chine"
 KMT_Republic_of_China_Air_Force_desc:0 "Notre armée de l'air doit être dotée des modèles d'avions les plus récents, et nous serons reconnus comme la première puissance aérienne de la région !"
 KMT_Anti_Aircraft_Initiative:0 "Initiative de défense antiaérienne"
 KMT_Anti_Aircraft_Initiative_desc:0 "La technologie antiaérienne, notamment les canons antiaériens, les radars et les missiles sol-air (SAM), revêt une importance capitale pour nous ; l'Union soviétique dispose de systèmes similaires et nous devons nous préparer à toute action militaire offensive de la part de nos ennemis."
 KMT_Re_Establish_the_Whampoa_Military_Academy:0 "Réhabiliter l'Académie militaire centrale"
 KMT_Re_Establish_the_Whampoa_Military_Academy_desc:0 "L'Académie militaire centrale (que beaucoup connaissent sous le nom d'Académie militaire de Whampoa) a formé bon nombre de nos vaillants officiers et militaires pendant la Seconde Guerre mondiale et la guerre civile chinoise ; nous allons la réinstaller à Nanjing et, dans le même temps, la rebaptiser « Académie militaire de la République de Chine », afin d'en faire la première académie militaire pour notre corps de cadets."
 KMT_Reform_the_Air_Force_Academy:0 "Réformer l'Académie de l'armée de l'air"
 KMT_Reform_the_Air_Force_Academy_desc:0 "L'Académie de l'armée de l'air de la République de Chine doit être réformée afin de tenir compte des nouvelles technologies et de la formation plus approfondie dont nos officiers de l'armée de l'air doivent bénéficier."
 KMT_Import_American_Jets:0 "Importer des jets américains"
 KMT_Import_American_Jets_desc:0 "Les États-Unis, l'un de nos plus proches alliés, disposent d'appareils parmi les plus récents et les plus modernes ; nous serons ravis de leur acheter certains des derniers modèles d'avions polyvalents afin de renforcer notre armée de l'air."
 KMT_A_Chinese_Jet_Fighter:0 "Un avion de chasse chinois"
 KMT_A_Chinese_Jet_Fighter_desc:0 "Inspirés par notre premier prototype de chasseur de fabrication nationale (le Chu XP-0), réalisé en 1943, de nombreux ingénieurs locaux ainsi que des généraux de l'armée ont opté pour la conception et la fabrication, par nos propres moyens, d'un avion de chasse d'inspiration occidentale ; il est en effet impératif que la République de Chine développe ses propres avions à réaction, plutôt que de dépendre uniquement des importations étrangères provenant de nos alliés, afin de renforcer considérablement notre force aérienne."
 KMT_reform_the_ministry_of_national_defense:0 "Réformer le ministère de la Défense nationale"
 KMT_reform_the_ministry_of_national_defense_desc:0 "Le ministère de la Défense nationale, qui a succédé à la fois au département de la Guerre du gouvernement et à la Commission des affaires militaires à la suite de l'adoption de la Constitution de 1946, est chargé de l'ensemble des affaires de défense et des affaires militaires de la République. Cependant, le ministère de la Défense nationale n'est actuellement pas en mesure de mettre pleinement en œuvre des réformes susceptibles de bouleverser l'appareil militaire actuel des Forces armées, en raison de son inefficacité et du pouvoir qu'il ne détient que de nom ; il convient de remédier à cette situation."
 KMT_clamp_down_on_army_nepotism:0 "Mettre un frein au népotisme au sein de l'armée"
 KMT_clamp_down_on_army_nepotism_desc:0 "Le népotisme au sein de l'armée est un problème majeur depuis l'époque de la guerre civile ; de nombreux officiers ont détourné des fonds et des armes pour les revendre sur le marché noir aux communistes eux-mêmes. On a même recensé le cas d'un officier qui a tenté de faire sortir clandestinement de l'or du pays à bord d'un avion pendant la guerre civile chinoise. Si nous voulons véritablement réformer les forces armées, il faut mettre un terme au népotisme qui règne au sein de l'armée."
 KMT_chinese_armed_forces_structure:0 "Supprimer la structure des forces armées américaines"
 KMT_chinese_armed_forces_structure_desc:0 "La structure des forces armées américaines a révélé son inefficacité au combat pendant la guerre de Sécession ; compte tenu de l'importance accordée à l'approvisionnement et à la qualité des infrastructures, il nous serait difficile de les soutenir à long terme. Il serait donc plus avantageux pour nous de réformer les forces armées selon nos propres principes et de faire à nouveau appel à nos amis allemands pour nous aider dans cette tâche."
 KMT_US_armed_forces_structure:0 "Respecter la structure des forces armées américaines"
 KMT_US_armed_forces_structure_desc:0 "Même si la structure des forces armées américaines met l'accent sur l'approvisionnement et une infrastructure de qualité, ce que nous ne sommes pas en mesure d'assurer pour l'instant, il serait dans notre intérêt de progresser petit à petit vers la mise en place d'un meilleur système logistique pour soutenir l'armée, plutôt que de la supprimer complètement et de revenir à une armée arriérée."
 KMT_recall_falkenhausen:0 "Rappeler Falkenhausen"
 KMT_recall_falkenhausen_desc:0 "Alexander von Falkenhausen, l'ancien conseiller militaire allemand en Chine qui a succédé à Hans von Seeckt au sein de la mission militaire allemande en Chine, nous a grandement aidés dans nos efforts visant à mettre en place une armée réformée. Il réside actuellement en Allemagne et reste en contact avec nous ; pourrions-nous peut-être organiser son retour afin qu'il nous aide dans nos nouvelles réformes militaires ?"
 KMT_sixty_divisions_plan:0 "Deuxième plan des soixante divisions"
 KMT_sixty_divisions_plan_desc:0 "Le « Plan des soixante divisions » original, conçu par Hans von Seeckt, qui mettait l'accent sur l'utilisation de l'artillerie – un équipement difficile à se procurer à nos débuts –, est désormais disponible et peut être facilement fabriqué sur place, ce qui nous permet de reconstituer ce plan sous la supervision de Falkenhausen."
 KMT_promote_sun_li_jen:0 "Promouvoir Sun Li-Jen"
 KMT_promote_sun_li_jen_desc:0 "Sun Li-Jen a apporté une contribution majeure sur les champs de bataille pendant la guerre civile ; sans ses efforts, la guerre aurait été synonyme de catastrophe pour nous ! Compte tenu de sa formation aux États-Unis et de sa connaissance de la structure militaire américaine, ne pourrions-nous pas le promouvoir et lui confier la supervision de nos projets de réforme des forces armées chinoises afin de les aligner davantage sur celles de nos frères américains ?"
 KMT_ninety_divisions_plan:0 "Aborder le plan des 90 divisions"
 KMT_ninety_divisions_plan_desc:0 "Le « Plan des 90 divisions », proposé par Joseph Stilwell à l'époque de la Guerre de résistance, prévoyait la réorganisation de l'armée chinoise en 90 divisions. Même si la Guerre de résistance et la guerre civile appartiennent désormais au passé, nous pourrions peut-être nous inspirer de ce plan initial et le réadapter à notre situation actuelle."
 KMT_Restore_the_Hanyang_Arsenal:0 "Restaurer l'arsenal de Hanyang"
 KMT_Restore_the_Hanyang_Arsenal_desc:0 "L'arsenal de Hanyang est le plus célèbre et le plus ancien de Chine ; il a contribué à la fabrication de fusils depuis la révolte des Boxers et tout au long de la guerre civile. Nous allons le restaurer afin qu'il puisse à nouveau servir à la fabrication d'armes légères et de fusils."
 KMT_Restore_the_Taiyuan_Arsenal:0 "Restaurer l'arsenal de Taiyuan"
 KMT_Restore_the_Taiyuan_Arsenal_desc:0 "Nous allons également restaurer l'arsenal de Taiyuan ! Situé dans le Shanxi, cet arsenal était également connu pour avoir produit des fusils Mauser de type 24 pendant la guerre civile, ainsi que des mitrailleuses, des pièces d'artillerie et des obus."
 KMT_Reform_the_Kiangnan_Arsenal:0 "Réformer l'arsenal de Kiangnan"
 KMT_Reform_the_Kiangnan_Arsenal_desc:0 "Situé à Shanghai, l'arsenal de Kiangnan, adjacent aux chantiers navals de Kiangnan, se consacrait à la fabrication d'armes à feu jusqu'à sa dissolution en 1937, juste avant la guerre de résistance contre l'agression japonaise. Nous allons le reconstruire !"
 KMT_Urban_Warfare_Training:0 "Formation au combat en milieu urbain"
 KMT_Urban_Warfare_Training_desc:0 "La guerre urbaine est de plus en plus courante à l'ère moderne de la guerre asymétrique. Nos forces doivent être parfaitement entraînées au combat urbain, qu'il s'agisse d'attaquer ou de défendre."
 KMT_Republic_of_China_Navy:0 "Marine de la République de Chine"
 KMT_Republic_of_China_Navy_desc:0 "Notre marine doit être renforcée, car nous devons figurer parmi les principales puissances navales de la région. La sécurité dans nos eaux territoriales et sur les mers est la priorité absolue de notre marine."
 KMT_Expand_the_Kiangnan_Shipyard:0 "Agrandir le chantier naval de Kiangnan"
 KMT_Expand_the_Kiangnan_Shipyard_desc:0 "Agrandissement du chantier naval de Kiangnan, réputé dans les années 1920 pour la construction de canonnières et d'autres navires de patrouille ; nous ferons appel à leur expertise pour développer notre marine."
 KMT_Commissioning_Former_IJN_Destroyers:0 "Mise en service d'anciens destroyers de la Marine impériale japonaise"
 KMT_Commissioning_Former_IJN_Destroyers_desc:0 "Nous avons un besoin urgent de navires ; l'acquisition d'anciens destroyers japonais permettrait à la fois de renforcer notre marine et d'aider le gouvernement japonais ; leur mise en service débutera dès que possible."
 KMT_Puchase_American_Vessels:0 "Acheter des navires américains"
 KMT_Puchase_American_Vessels_desc:0 "Les États-Unis cherchent également à moderniser leur marine ; nous serions ravis de recevoir des navires américains d'ancienne génération afin de renforcer et de diversifier notre marine."
 KMT_Expand_the_Marine_Corps:0 "Élargir le Corps des Marines"
 KMT_Expand_the_Marine_Corps_desc:0 "Le Corps des Marines de la République de Chine (ROCMC) est considéré comme la branche d'élite de l'armée ; son renforcement est nécessaire pour nous permettre d'être prêts à intervenir dans toute opération en Asie nécessitant notre aide."
 KMT_Seek_Western_Financial_Aid:0 "Dénationalisation des industries légères"
 KMT_Seek_Western_Financial_Aid_desc:0 "Depuis le début de la guerre de résistance, nous avons nationalisé plus de 90 % des industries chinoises afin de mobiliser la nation pour une résistance totale contre les envahisseurs japonais. Cela ne nous a toutefois pas été profitable à long terme, car la croissance économique s'est arrêtée en raison de la corruption endémique des bureaucrates qui ont pris le contrôle des industries nationalisées, lesquelles sont sous leur emprise depuis plus de 13 ans. La guerre civile étant terminée, il est temps de restituer la propriété des industries légères aux hommes d'affaires, ce qui devrait permettre à notre économie de se remettre progressivement de la dévastation."
 KMT_Enact_Currency_Reform:0 "Mettre en œuvre une réforme monétaire"
 KMT_Enact_Currency_Reform_desc:0 "Notre monnaie doit être réformée dès que possible ; l'hyperinflation pèse lourdement sur notre économie et nous devons trouver des solutions pour éviter l'effondrement de celle-ci."
 KMT_Introduce_New_Standardized_Currency:0 "Distribuer le Fabi Yuan"
 KMT_Introduce_New_Standardized_Currency_desc:0 "Le Fabi Yuan sera officiellement réintroduit comme monnaie de la République de Chine. Le gouvernement et les banques nationales faciliteront la conversion monétaire vers la nouvelle norme."
 KMT_Apply_For_American_Reconstruction_Aid:0 "Demander l'aide américaine à la reconstruction"
 KMT_Apply_For_American_Reconstruction_Aid_desc:0 "Les succès rapides du plan Marshall en Europe nous ont convaincus que le recours à l'aide américaine pour la reconstruction est la meilleure stratégie pour relancer notre économie et nos infrastructures."
 KMT_Commence_Planning_of_the_Four_Year_Plan:0 "Autoriser les services bancaires privés limités"
 KMT_Commence_Planning_of_the_Four_Year_Plan_desc:0 "Avec le recul, la suppression du système bancaire privé en 1935 s'est avérée être un désastre pour l'économie chinoise. La réforme monétaire a détruit ce système bancaire privé qui avait si bien servi l'économie chinoise, et a placé le contrôle de la monnaie entre les mains d'un gouvernement corrompu et incompétent. L'inflation s'est déclarée presque immédiatement. Finalement, elle est devenue si grave qu'elle a contribué à provoquer l'effondrement quasi total de notre régime. Nous devons prendre des mesures afin d'éviter une nouvelle inflation."
 KMT_The_First_Four_Year_Plan:0 "Le premier plan quadriennal"
 KMT_The_First_Four_Year_Plan_desc:0 "Nous avons mené une réflexion approfondie, et le plan quadriennal sera mis en œuvre dès que possible, avec pour objectif principal de reconstruire et de redynamiser les secteurs clés qui relèvent de notre compétence."
 KMT_National_Corporations_Department:0 "Direction des sociétés nationales"
 KMT_National_Corporations_Department_desc:0 "Afin de soutenir la relance des industries lourdes nationalisées chinoises, un département chargé de superviser la gestion des entreprises publiques sera créé au sein du ministère de l'Économie."
 KMT_Nationalize_Mining_and_Extraction_Industries:0 "Nationaliser les industries minières et extractives"
 KMT_Nationalize_Mining_and_Extraction_Industries_desc:0 "Notre secteur minier et d'extraction a fait ses preuves tant au niveau national qu'international ; sa nationalisation permettra d'accroître les échanges commerciaux et les bénéfices pour la République de Chine."
 KMT_Nationalize_the_Arms_Industry:0 "Moderniser les industries de l'armement chinoises"
 KMT_Nationalize_the_Arms_Industry_desc:0 "La Chine accuse encore un retard considérable en matière de modernisation de son industrie de l'armement, avec plusieurs décennies de retard sur l'Occident. Nous devons tirer parti de l'aide étrangère pour remplacer les machines et les outils obsolètes par du matériel neuf ; ce n'est qu'ainsi que nous pourrons enfin disposer d'une industrie militaire autonome."
 KMT_Begin_Mechanizing_Agriculture:0 "Lancer la mécanisation de l'agriculture"
 KMT_Begin_Mechanizing_Agriculture_desc:0 "Les systèmes et les techniques agricoles utilisés par nos agriculteurs sont obsolètes ; nous devons commencer à mécaniser et à rationaliser les processus agricoles afin de nourrir notre population."
 KMT_Invest_in_Irrigation_Projects:0 "Investir dans des projets d'irrigation"
 KMT_Invest_in_Irrigation_Projects_desc:0 "Les régions particulièrement arides de Chine ont besoin de grands projets d'irrigation, et grâce à des fonds américains, nous allons investir massivement dans les infrastructures hydrauliques de notre pays."
 KMT_Commence_Reconstruction:0 "Commencer la reconstruction"
 KMT_Commence_Reconstruction_desc:0 "Nos efforts de reconstruction vont commencer, et nos nouvelles infrastructures et industries seront les meilleures du continent asiatique !"
 KMT_Rebuild_Coastal_Infrastructure:0 "Reconstruire les infrastructures côtières"
 KMT_Rebuild_Coastal_Infrastructure_desc:0 "Les infrastructures de nos zones côtières, notamment les ports, les ponts et les routes, doivent être reconstruites et modernisées pour répondre aux normes actuelles."
 KMT_Rebuild_Southern_Railways:0 "Relancer les chemins de fer du Sud"
 KMT_Rebuild_Southern_Railways_desc:0 "Nos lignes ferroviaires du sud ont été gravement endommagées pendant les guerres qui ont secoué la région ; elles doivent être modernisées et rendues performantes afin de pouvoir transporter des passagers et des marchandises dans toute la région."
 KMT_Decline_to_Seek_American_Cooperation:0 "Refuser de solliciter la coopération des États-Unis"
 KMT_Decline_to_Seek_American_Cooperation_desc:0 "Dans le domaine de la recherche nucléaire, il existe d'autres puissances avec lesquelles nous pourrions coopérer ; nous apprécions le soutien américain, mais la République de Chine ne restera pas éternellement sous sa tutelle."
 KMT_Reform_University_Departments:0 "Réformer les départements universitaires"
 KMT_Reform_University_Departments_desc:0 "Pour s'engager sur la voie de la recherche indépendante, nos établissements d'enseignement supérieur et nos départements universitaires doivent être réformés, afin de s'adapter à l'époque moderne dans laquelle nous vivons et aux travaux de recherche scientifique que nous devons mener."
 KMT_Import_Dassault_Mirage_IV_Strategic_Bombers:0 "Importation de bombardiers stratégiques Dassault Mirage IV"
 KMT_Import_Dassault_Mirage_IV_Strategic_Bombers_desc:0 "Dans le cadre de notre coopération avec d'autres pays, nous importerons de France des bombardiers stratégiques, à savoir le dernier modèle de Mirage IV ; cela nous permettra à la fois de renforcer notre armée de l'air et d'entamer des échanges commerciaux avec d'autres alliés démocratiques."
 KMT_Prioritize_Coastal_Relief:0 "Donner la priorité à la protection du littoral"
 KMT_Prioritize_Coastal_Relief_desc:0 "Les îles et les villes côtières de la côte chinoise ont été les plus durement touchées par les récents conflits ; l'aide humanitaire destinée au pays doit en priorité être acheminée vers ces régions."
 KMT_Nationalize_Taiwanese_Assets:0 "Nationaliser les actifs taïwanais"
 KMT_Nationalize_Taiwanese_Assets_desc:0 "Tous les actifs agricoles et industriels de l'île de Taïwan seront nationalisés afin de soutenir notre économie en plein essor ; Taïwan deviendra une puissance économique !"
 KMT_Attract_Foriegn_Capital:0 "Attirer les capitaux étrangers"
 KMT_Attract_Foriegn_Capital_desc:0 "Nous devons attirer davantage de capitaux et d'investissements étrangers dans l'économie de notre pays ; au-delà des investisseurs américains, nous avons besoin d'un soutien international."
 KMT_Exploit_Uranium_Deposits_in_Shandong:0 "Exploiter les gisements d'uranium du Shandong"
 KMT_Exploit_Uranium_Deposits_in_Shandong_desc:0 "Pour poursuivre notre programme nucléaire, il faut agrandir et moderniser les mines d'uranium du Shandong afin de nous permettre d'obtenir les ressources dont nous avons besoin."
 KMT_Refocus_Tsing_Hua_University:0 "Réorientation de l'université Tsinghua"
 KMT_Refocus_Tsing_Hua_University_desc:0 "En encourageant la recherche nucléaire à l'université de Tsing-Hua, nous espérons pouvoir les convaincre de nous aider dans le cadre de notre programme d'énergie nucléaire et d'armement."
 KMT_Intensify_French_Nuclear_Cooperation:0 "Renforcer la coopération nucléaire avec la France"
 KMT_Intensify_French_Nuclear_Cooperation_desc:0 "La France est rapidement devenue notre principal allié dans le domaine de la recherche nucléaire, et nos relations ne cessent de se renforcer."
 KMT_tackle_national_illiteracy_problem:0 "S'attaquer au problème national de l'analphabétisme"
 KMT_tackle_national_illiteracy_problem_desc:0 "La prochaine fois, lis un livre."
 KMT_Establish_Modern_Military_RD_Center:0 "Créer un centre moderne de recherche et développement militaire"
 KMT_Establish_Modern_Military_RD_Center_desc:0 "Sans progrès dans le domaine de la recherche militaire, nous accuserons un retard considérable par rapport aux autres et serons exposés à de nouvelles humiliations. Un nouveau centre moderne de recherche et développement militaire sera créé afin de mener nos avancées militaires encore plus loin. Ainsi, nous n'aurons plus à dépendre des Américains pour chaque nouvelle technologie militaire qu'ils acquièrent."
 KMT_first_chinese_a_bomb:0 "La toute première bombe atomique chinoise"
 KMT_first_chinese_a_bomb_desc:0 "Enfin, nos recherches nucléaires ont porté leurs fruits ! La République de Chine va devenir une puissance nucléaire, rejoignant ainsi les rangs des États-Unis, du Royaume-Uni, de la France et de l'URSS ; c'est un jour mémorable pour tous les Chinois !"
 KMT_chinese_nuclear_plants:0 "Centrales nucléaires chinoises"
 KMT_chinese_nuclear_plants_desc:0 "Monsieur le Président [CHI.GetLeader], il nous faut plus d'énergie nucléaire !"
 KMT_Develop_Chinese_Nuclear_Power:0 "Développer l'énergie nucléaire en Chine"
 KMT_Develop_Chinese_Nuclear_Power_desc:0 "L'énergie nucléaire est la forme de production d'électricité la plus moderne, la plus efficace sur le plan énergétique et la plus sûre qui ait été mise au point. La République de Chine mérite de disposer de l'énergie nucléaire et nous la développerons nous-mêmes. "
 KMT_American_Cooperation:0 "Coopération américaine"
 KMT_American_Cooperation_desc:0 "Après tout, ce sont les Américains qui ont été les premiers à utiliser les armes nucléaires et l'énergie nucléaire ; alors pourquoi ne pas solliciter leur aide dans le cadre de notre programme ?"
 KMT_Joint_American_Chinese_Uranium_Extraction:0 "Projet conjoint américano-chinois d'extraction d'uranium"
 KMT_Joint_American_Chinese_Uranium_Extraction_desc:0 "Avec l'aide et la coopération des États-Unis, nous allons commencer à extraire de l'uranium des gisements du Shandong, dans l'intérêt de nos deux pays."
 KMT_Establish_the_Tibetan_Autonomous_Region:0 "Créer la Région autonome du Tibet"
 KMT_Establish_the_Tibetan_Autonomous_Region_desc:0 "Maintenant que le coup d'État du Panchen Lama a réussi, nous ferons du Tibet une région autonome, sous notre contrôle mais dotée d'une certaine forme d'autonomie."
 KMT_Prepare_for_Mass_Industrialization_Program:0 "Programme de préparation à l'industrialisation de masse"
 KMT_Prepare_for_Mass_Industrialization_Program_desc:0 "Nous devons nous atteler dès que possible à notre stratégie d'industrialisation. Cela permettra de développer le secteur industriel et de créer une économie plus diversifiée et plus prospère."
 KMT_Aim_for_Electric_Equipment_Self_Sufficiency:0 "Viser l'autosuffisance en matière d'équipements électriques"
 KMT_Aim_for_Electric_Equipment_Self_Sufficiency_desc:0 "La République de Chine doit commencer à assurer l'autonomie de son réseau électrique ; des centrales électriques seront construites dans notre pays afin de mettre fin à notre dépendance vis-à-vis d'autres pays en matière d'approvisionnement en électricité."
 KMT_Modernize_Steel_Production:0 "Moderniser la production d'acier"
 KMT_Modernize_Steel_Production_desc:0 "Le procédé de fabrication de l'acier à l'oxygène a été mis au point par Robert Durrer en 1948 ; nous devons rattraper notre retard en matière de progrès techniques afin de rester au niveau des autres pays industrialisés du monde."
 KMT_Economic_Planning_Council:0 "Conseil de planification économique"
 KMT_Economic_Planning_Council_desc:0 "Le Conseil pour l'aide aux États-Unis sera transformé en Conseil de planification économique afin de contribuer à la mise en œuvre des plans quadriennaux de la Chine à l'avenir."
 KMT_Complete_the_Reforms:0 "Achever les réformes"
 KMT_Complete_the_Reforms_desc:0 "Nos réformes agraires seront bientôt achevées. Cela permettra au peuple de jouir d'une plus grande liberté et apportera une plus grande prospérité à tous, en particulier à ceux qui souhaitent devenir agriculteurs."
 KMT_Attempt_to_Persuade_Reluctant_Landlords:0 "Tenter de convaincre les propriétaires réticents"
 KMT_Attempt_to_Persuade_Reluctant_Landlords_desc:0 "Les propriétaires qui ont des doutes quant aux politiques de réforme agraire de la ROC se verront rappeler, avec douceur et discrétion, les avantages qu'il y a à respecter les règles, peut-être moyennant un versement initial de quelques centaines de dollars..."
 KMT_Invest_in_Agricultural_Modernization:0 "Investir dans la modernisation de l'agriculture"
 KMT_Invest_in_Agricultural_Modernization_desc:0 "L'agriculture est un secteur clé en Chine, et investir dans les dernières technologies et innovations agricoles nous permettra de nous hisser au niveau des pays les plus modernisés."
 KMT_Enforce_Reforms_in_Clique_Territory:0 "Appliquer les réformes sur le territoire des cliques"
 KMT_Enforce_Reforms_in_Clique_Territory_desc:0 "Nos réformes doivent être mises en œuvre avec plus de vigueur dans les régions du pays où règnent les cliques, car celles-ci ont davantage besoin de l'aide et du soutien du gouvernement national que les autres régions."
 KMT_Launch_the_Second_Four_Year_Plan:0 "Lancer le deuxième plan quadriennal"
 KMT_Launch_the_Second_Four_Year_Plan_desc:0 "Compte tenu du succès retentissant du premier plan quadriennal, nous allons lancer le deuxième plan dès que possible, en mettant l'accent sur la poursuite de l'industrialisation et de la modernisation de l'économie."
 KMT_Begin_Mass_Literacy_Campaigns:0 "Lancer des campagnes d'alphabétisation de masse"
 KMT_Begin_Mass_Literacy_Campaigns_desc:0 "Outre nos campagnes d'industrialisation, notre peuple doit être éduqué, non seulement aux principes de l'idéologie nationaliste, mais aussi à la lecture et à l'écriture, comme tout citoyen moderne. Le peuple chinois sera reconnu pour son intelligence !"
 KMT_Construct_New_Steel_Mills:0 "Construire de nouvelles aciéries"
 KMT_Construct_New_Steel_Mills_desc:0 "Compte tenu de la modernisation de notre secteur sidérurgique et de l'expansion de notre industrie lourde, il semble tout simplement nécessaire de construire davantage d'aciéries."
 KMT_Expand_Heavy_Industry:0 "Développer l'industrie lourde"
 KMT_Expand_Heavy_Industry_desc:0 "Il faut continuer à développer notre industrie lourde afin de produire davantage de produits industriels, d'avions et d'armement."
 KMT_Seek_Foriegn_Economic_Advisors:0 "Rechercher des conseillers en économie internationale"
 KMT_Seek_Foriegn_Economic_Advisors_desc:0 "Nous devons solliciter l'aide des États-Unis sous la forme de conseillers économiques chargés de nous faire des suggestions pour améliorer notre économie et nos industries."
 KMT_Electrification_Campaign:0 "Campagne d'électrification"
 KMT_Electrification_Campaign_desc:0 "L'électricité doit être accessible partout en Chine ! Des centrales électriques seront construites dans tout le pays afin d'assurer un réseau électrique stable."
 KMT_Build_New_Dams:0 "Lancement de la construction du barrage des Trois Gorges"
 KMT_Build_New_Dams_desc:0 "Le barrage des Trois Gorges, une idée imaginée par le grand père fondateur Sun Yat-Sen, consistait à construire un barrage dans les Trois Gorges capable de produire 30 millions de chevaux-vapeur (22 GW) en aval. Alors que nous avions déjà élaboré des plans dès 1932 pour lancer la planification de la construction du barrage des Trois Gorges, le moment est enfin venu de mettre en œuvre ce projet."
 KMT_Exploit_Rare_Earth_Deposits:0 "Exploiter les gisements de terres rares"
 KMT_Exploit_Rare_Earth_Deposits_desc:0 "De précieux gisements de métaux rares, tels que le tungstène, ont été découverts un peu partout dans notre pays ! Nous devons les exploiter pour nos besoins industriels et vendre le reste sur le marché international."
 KMT_Encourage_Urbanization:0 "Encourager l'urbanisation"
 KMT_Encourage_Urbanization_desc:0 "Nous devons étendre les zones urbaines de Pékin, Shanghai, Guangzhou et d'autres grandes villes ; l'urbanisation permettra de concentrer l'industrie et la main-d'œuvre dans un lieu central et facilitera l'accès des populations aux services publics."
 KMT_Expand_Rural_Rail_Access:0 "Deuxième mouvement de reconstruction rurale"
 KMT_Expand_Rural_Rail_Access_desc:0 "Le Mouvement pour la reconstruction rurale a révolutionné les zones rurales de Chine grâce à ses efforts de reconstruction et de modernisation ; nous devons accueillir YC James Yen afin qu'il poursuive ce qu'il a commencé."
 KMT_Expand_Shanghai_Port_Capacity:0 "Augmenter la capacité du port de Shanghai"
 KMT_Expand_Shanghai_Port_Capacity_desc:0 "Il faut construire davantage de quais et de chantiers navals dans le port de Shanghai afin de répondre à l'essor du commerce et aux besoins de notre marine en pleine expansion, ainsi qu'aux travaux de construction et de réparation."
 KMT_The_Industrialization_of_China:0 "L'industrialisation de la Chine"
 KMT_The_Industrialization_of_China_desc:0 "Dans le cadre de notre deuxième plan quadriennal, il est essentiel d'étendre l'industrialisation à davantage de régions de la Chine ; des complexes industriels seront construits partout où notre pays en a besoin."
 KMT_Economic_Modernization:0 "Modernisation économique"
 KMT_Economic_Modernization_desc:0 "À mesure que les temps changent, nos méthodes de fabrication et de production doivent elles aussi évoluer afin de rester en phase avec les autres nations industrialisées modernes du monde."
 KMT_Conduct_a_Proper_Census:0 "Réaliser un recensement en bonne et due forme"
 KMT_Conduct_a_Proper_Census_desc:0 "Il faut recenser notre population ; c'est absolument indispensable, car cela permettra de mieux cerner les besoins de la population et de déterminer comment le gouvernement peut y répondre."
 KMT_Rapid_Economic_Growt:0 "Croissance économique rapide"
 KMT_Rapid_Economic_Growt_desc:0 "Notre économie connaît une croissance sans précédent, grâce au succès de nos plans quadriennaux et à l'aide internationale !"
 KMT_Reform_the_Judicial_System:0 "Réformer le système judiciaire"
 KMT_Reform_the_Judicial_System_desc:0 "Notre pouvoir judiciaire et notre système judiciaire doivent être réformés afin d'incarner la justice, et non la corruption ou l'autoritarisme."
 KMT_Empower_the_Legislative_Yuan:0 "Renforcer les pouvoirs du Yuan législatif"
 KMT_Empower_the_Legislative_Yuan_desc:0 "Le pouvoir législatif de la République de Chine, le Yuan, doit pouvoir débattre d'autres questions touchant à la population et au développement économique, dans l'intérêt de la démocratie et de la nation."
 KMT_Introduce_Limited_Democratic_Reforms:0 "Mettre en place des réformes démocratiques limitées"
 KMT_Introduce_Limited_Democratic_Reforms_desc:0 "La démocratie limitée est la voie qui convient à la République de Chine, et il en sera toujours ainsi ; la démocratie totale peut être dangereuse, et l'autoritarisme est inefficace à notre époque. Des réformes s'imposent."
 KMT_Prosecute_the_CC_Clique:0 "Poursuivre la clique du Club central"
 KMT_Prosecute_the_CC_Clique_desc:0 "Les membres de la « CC Clique » sont des traîtres, fidèles uniquement à Tchang Kaï-chek, et non à leur parti ni à leur pays. Ils seront punis afin de servir d'exemple à tous ceux qui sont corrompus et qui se moquent du sort de leur glorieuse nation."
 KMT_Begin_Preperations_for_First_Nuclear_Test:0 "Lancer les préparatifs en vue du premier essai nucléaire"
 KMT_Begin_Preperations_for_First_Nuclear_Test_desc:0 "Nous allons commencer à mobiliser des chercheurs en physique nucléaire afin de lancer les travaux en vue de la fabrication de la bombe atomique chinoise. Dans ce cadre, un nouveau site sera choisi pour servir de zone d'essais nucléaires."
 KMT_Embrace_Atoms_for_Peace:0 "Embrasser les atomes pour la paix"
 KMT_Embrace_Atoms_for_Peace_desc:0 "Au lieu d'utiliser l'énergie nucléaire à des fins militaires et destructrices, la République de Chine s'engagera à l'utiliser à des fins pacifiques, en la réservant exclusivement à la production d'électricité."
 KMT_Siphon_American_Material:0 "Siphon américain"
 KMT_Siphon_American_Material_desc:0 "Les documents et le matériel américains nous seront d'une grande aide dans notre projet de fabrication d'armes nucléaires. Il se pourrait bien que certains de leurs documents les plus importants « disparaissent » pendant quelques heures..."
 KMT_Quaidam_Basin_Installations:0 "Installations du bassin de Qaidam"
 KMT_Quaidam_Basin_Installations_desc:0 "Grâce à ses sols riches en potassium, magnésium et lithium, ainsi qu'en gaz et en plomb (et à son éloignement des centres urbains), ce site est idéal pour la construction de notre nouvelle centrale électrique."
 KMT_Redevelop_Damaged_Factories:0 "Réhabiliter les usines endommagées"
 KMT_Redevelop_Damaged_Factories_desc:0 "Nos usines endommagées doivent être reconstruites et modernisées afin de refléter les technologies et les méthodes modernes couramment utilisées dans le monde industriel."
 KMT_recognise_saigon_authority_in_vietnam:0 "Reconnaître l'autorité de Saigon au Vietnam"
 KMT_recognise_saigon_authority_in_vietnam_desc:0 "Il ne fait aucun doute que la Révolution Tridemiste a lamentablement échoué au Vietnam, le Viet Quoc étant au bord de la dissolution au sein même du pays. Nous devons accepter cette dure réalité et aller de l'avant en coopérant avec le gouvernement anticommuniste de Saigon, dans l'espoir de contenir la menace qui pèse depuis le Nord-Vietnam et qui vise à compromettre notre stabilité interne."
 KMT_non_aggression_pact_with_vietnam:0 "Renforcer nos relations avec le Sud-Vietnam"
 KMT_non_aggression_pact_with_vietnam_desc:0 "Nos relations s'améliorant depuis l'établissement de liens entre nos deux pays, nous devons prendre des mesures pour les approfondir par le biais d'accords avec le gouvernement de Saigon. Cet accord comporterait des engagements selon lesquels nous nous abstiendrons de toute ingérence dans leur vie politique, parallèlement à la signature d'un pacte de non-agression. Dans ce cadre, nous renoncerons également totalement à tout soutien au VNQDD et remettrons au gouvernement de Saigon les membres du parti VNQDD qui résident encore en Chine."
 KMT_organize_the_indochina_military_mission:0 "Mettre en place la mission militaire en Indochine"
 KMT_organize_the_indochina_military_mission_desc:0 "Maintenant que notre position en matière de politique étrangère vis-à-vis du Vietnam a été clairement définie et que le général Nguyen Chan-A a été renvoyé dans son pays, nous devons mettre en place la mission militaire en Indochine sous sa direction, afin de soutenir nos objectifs et de mener à bien notre programme en Indochine."
 KMT_indochina_situation:0 "Affaires vietnamiennes"
 KMT_indochina_situation_desc:0 "L'État du Sud-Vietnam pourrait constituer un nouvel allié précieux au lendemain de la Seconde Guerre mondiale. Le gouvernement actuel pourrait toutefois ne pas être disposé à coopérer pleinement avec nous. Le VNQDD est actif sur la scène politique dans le Sud, depuis la dissolution du parti dans le Nord sous la pression du Viêt Minh. Nous pourrions peut-être leur apporter notre soutien dans l'espoir de gagner un nouvel allié idéologique en Asie du Sud-Est."
 KMT_guard_maritime_trade_routes_in_SCS:0 "Assurer la sécurité des voies maritimes commerciales en mer de Chine méridionale"
 KMT_guard_maritime_trade_routes_in_SCS_desc:0 "Même si nous avons clairement indiqué qu'il était dans notre intérêt de rester en dehors du conflit au Vietnam, cela ne garantit pas pour autant que ce conflit ne puisse pas nous atteindre, notamment par voie maritime. Nous devons veiller à ce que nos échanges commerciaux en mer de Chine méridionale ne soient pas perturbés par ce conflit et nous assurer qu'ils puissent être escortés par notre marine."
 KMT_partial_cooperation_with_diem:0 "Coopération partielle avec Diem"
 KMT_partial_cooperation_with_diem_desc:0 "Nous avons pris conscience que, pour éviter de nous retrouver avec un Vietnam hostile à nos portes, nous devons choisir un camp à soutenir, un camp qui s'oppose au communisme à nos côtés. L'État du Vietnam, bien qu'il soit quelque peu en désaccord avec nos frères du VNQDD, a clairement indiqué qu'il était disposé à coopérer avec nous pour venir à bout du Viêt Minh, qui représente une menace pour nos deux régimes anticommunistes."
 KMT_Invest_in_the_Empire_of_Vietnam:0 "Investir dans l'État du Vietnam"
 KMT_Invest_in_the_Empire_of_Vietnam_desc:0 "Compte tenu de notre coopération avec le Vietnam, il nous semble tout à fait normal d'investir dans l'industrie et l'économie de ce pays, afin de garantir leur stabilité à long terme."
 KMT_Reorganize_the_VNQDD_party:0 "Réorganiser le VNQDD"
 KMT_Reorganize_the_VNQDD_party_desc:0 "Une autre raison de l'échec de leur révolution tridéiste tient à leur manque d'esprit révolutionnaire et de loyauté envers les Trois Principes du Peuple, ce qui a dénaturé les idéaux défendus par le fondateur du tridéisme, le Dr Sun Yat-Sen. Nous devons intervenir dans les affaires du Parti et purger les riches hommes d'affaires au sein du Parti qui n'ont fait que tirer profit de son statut. Après avoir assaini le Parti, nous endoctrinerons les membres du Parti pour qu'ils soient fidèles à l'idéologie elle-même, afin qu'ils aient même une chance de s'opposer à la fois aux bandits communistes de Hanoï et aux chiens de garde impérialistes de Saigon."
 KMT_training_for_VNQDD:0 "Entraînement du Viet Quoc"
 KMT_training_for_VNQDD_desc:0 "Le VNQDD ne dispose d'aucune capacité militaire lui permettant de déclencher une révolution sur son propre territoire ; c'est donc un appel lancé à nous pour que nous soutenions ses efforts par le biais de programmes de formation spécialement conçus pour lui, en mettant à profit notre expérience de la guerre de résistance et de la guerre civile chinoise."
 KMT_collapse_the_iron_curtain_in_north_asia:0 "Briser le rideau de bambou au Nord"
 KMT_collapse_the_iron_curtain_in_north_asia_desc:0 "Nous ne tolérerons pas le statu quo actuel ! Nous nous préparerons à la libération inévitable de ceux qui vivent à l'étranger, alors que de nombreux habitants du pays souffrent des diverses épreuves imposées par les régimes communistes. Alors que l'Union soviétique prépare ses États fantoches à une deuxième offensive contre nous, notre seul et meilleur espoir est de frapper ces États fantoches de l'intérieur ; petit à petit, un par un, le bloc communiste en Asie s'effondrera."
 KMT_60s_ROC_in_the_world:0 "Notre politique étrangère"
 KMT_60s_ROC_in_the_world_desc:0 "Maintenant que notre pays a retrouvé sa stabilité, nous devons nous attaquer aux problèmes internes et externes qui nous entourent en Asie."
 KMT_60s_USA_Relations:0 "Nos relations avec Washington"
 KMT_60s_USA_Relations_desc:0 "Étant donné que les États-Unis nous ont aidés à remporter la guerre civile chinoise il y a dix ans, nous devons décider de la manière dont nous allons gérer nos relations avec Washington à l'avenir."
 KMT_60s_USA_Cooperation:0 "Traité avec les États-Unis"
 KMT_60s_USA_Cooperation_desc:0 "Étant donné que nous sommes toujours confrontés à des menaces communistes, nous devons à nouveau nous allier aux États-Unis pour lutter contre de futures agressions communistes."
 KMT_60s_USA_exercises:0 "Le savoir-faire américain"
 KMT_60s_USA_exercises_desc:0 "En envoyant nos étudiants aux États-Unis, nous pouvons obtenir des informations précieuses de la part des Américains qui nous aideront à lutter contre les communistes qui nous entourent."
 KMT_60s_USA_CIA:0 "Inviter une mission militaire"
 KMT_60s_USA_CIA_desc:0 "En invitant les États-Unis en Chine pour une mission militaire, nous pourrons acquérir des tactiques et une discipline militaires adaptées à l'ère de la guerre moderne."
 KMT_60s_USA_Qingdao_base:0 "Créer la base aérienne de Tsingtao"
 KMT_60s_USA_Qingdao_base_desc:0 ""
 KMT_60s_SEATO:0 "Collaborer avec l'OTASE"
 KMT_60s_SEATO_desc:0 "Au lieu de nous rallier à l'ancienne puissance impérialiste européenne, nous devrions nous aligner sur vos amis d'Asie du Sud-Est pour faire face à la menace du socialisme"
 KMT_60s_NEATO:0 "Créer le NEATO"
 KMT_60s_NEATO_desc:0 ""
 KMT_60s_Invest_Europe:0 "Investir dans des entreprises européennes"
 KMT_60s_Invest_Europe_desc:0 ""
 KMT_60s_renegotiate_over_HK_Macau:0 "Renégocier les traités inéquitables"
 KMT_60s_renegotiate_over_HK_Macau_desc:0 ""
 KMT_60s_NATO:0 "Collaborer avec l'OTAN"
 KMT_60s_NATO_desc:0 "En collaborant étroitement avec l'OTAN, nous pouvons coordonner nos efforts dans la lutte contre les communistes à travers le monde."
 KMT_60s_Industry_USA:0 "Aide industrielle américaine"
 KMT_60s_Industry_USA_desc:0 "Grâce à l'aide des États-Unis, nous pouvons relancer notre industrie plus rapidement que si nous le faisions seuls."
 KMT_60s_USA_no_cooperation:0 "Dénoncer l'influence américaine"
 KMT_60s_USA_no_cooperation_desc:0 "Afin de libérer la Chine de toute influence étrangère, nous devons rejeter toute tentative américaine visant à influencer notre nation et notre avenir."
 KMT_60s_USA_Spies:0 "Diffuser la propagande anti-impérialiste"
 KMT_60s_USA_Spies_desc:0 "Pour repousser les influences américaines dans notre pays, nous commencerons par diffuser une propagande anti-impérialiste."
 KMT_60s_USA_Seize:0 "Attirer les capitaux étrangers"
 KMT_60s_USA_Seize_desc:0 "En saisissant les capitaux étrangers présents dans notre pays, nous pourrons les utiliser pour reconstruire rapidement notre industrie sans avoir à compter sur l'aide des États-Unis."
 KMT_60s_USA_Steal_Bluprints:0 "Reconstruire les créations américaines"
 KMT_60s_USA_Steal_Bluprints_desc:0 ""
 KMT_60s_Pressure_SEATO:0 "Faire pression sur les membres de l'OTASE"
 KMT_60s_Pressure_SEATO_desc:0 "En faisant pression sur les membres de l'OTASE, nous pouvons les détourner de l'impérialisme américain et former ensemble notre propre alliance asiatique contre les communistes et les impérialistes."
 KMT_60s_Anti-Concessionist:0 "Se souvenir du Mouvement du 4 mai"
 KMT_60s_Anti-Concessionist_desc:0 "Il est important que nous nous souvenions du Mouvement du 4 mai et de ce qu'il représente, en veillant à ce que notre nation ne tombe plus jamais sous l'emprise d'influences étrangères, comme cela s'est produit par le passé."
 KMT_60s_ports:0 "Les ports du traité"
 KMT_60s_ports_desc:0 "Enfin, nous sommes en mesure de venir à bout des derniers vestiges de l'influence étrangère dans notre pays grâce à des négociations avec les nations étrangères concernant le sort des ports ouverts au commerce international situés en Chine et leur restitution future à la Chine."
 KMT_60s_USA_No_aggression:0 "Traité de non-agression"
 KMT_60s_USA_No_aggression_desc:0 "En acceptant un traité de non-agression avec les États-Unis, nous pouvons garantir la paix entre les États-Unis et la Chine pour toujours."
 KMT_60s_North_PRC:0 "Regardez vers le nord"
 KMT_60s_North_PRC_desc:0 "Même si nous avons pris le contrôle de la majeure partie de la Chine continentale, nous devons continuer à surveiller le Nord, où des poches de forces communistes subsistent sous la protection soviétique."
 KMT_60s_Prepare_Manchurian_Invasion:0 "Préparer le projet « National Glory »"
 KMT_60s_Prepare_Manchurian_Invasion_desc:0 ""
 KMT_60s_Forts_PRC:0 "Se préparer à l'invasion imminente de l'APL"
 KMT_60s_Forts_PRC_desc:0 "Pour prévenir toute nouvelle incursion de l'Armée populaire de libération, nous devons renforcer notre frontière nord afin de sécuriser nos territoires du nord."
 KMT_60s_Infiltrate_PRC:0 "Infiltrer le PCC"
 KMT_60s_Infiltrate_PRC_desc:0 "Pour affaiblir davantage le PCC, nous enverrons des espions infiltrer le PCC et semer la méfiance et la division au sein du parti."
 KMT_60s_Propaganda_PRC:0 "Diffuser de la propagande en faveur du KMT en Mandchourie"
 KMT_60s_Propaganda_PRC_desc:0 "Grâce à nos espions infiltrés en Mandchourie, nous diffuserons des messages de propagande en faveur du KMT auprès de la population afin d'affaiblir sa loyauté envers le PCC."
 KMT_60s_Prepare_army:0 "Proclamer la loi martiale dans les régions frontalières du Hebei"
 KMT_60s_Prepare_army_desc:0 "Nous devons mobiliser et renforcer l'armée à la frontière afin de la protéger contre de futures incursions communistes."
 KMT_60s_lessons_civilwar:0 "Les leçons de la guerre civile"
 KMT_60s_lessons_civilwar_desc:0 "Les enseignements tirés de la guerre civile nous aideront à lutter contre les tactiques que l'armée communiste pourrait employer contre nous à l'avenir."
 KMT_60s_defense_of_free_china:0 "La défense de la Chine libre"
 KMT_60s_defense_of_free_china_desc:0 ""
 KMT_60s_expand_infrastructure:0 "Améliorer les infrastructures frontalières"
 KMT_60s_expand_infrastructure_desc:0 "Nous devons améliorer les infrastructures frontalières afin de garantir que nos troupes puissent se déplacer rapidement d'un endroit à l'autre pour faire face à de futures incursions communistes."
 KMT_60s_test_prc:0 "Mettre en œuvre le projet « Gloire Nationale »"
 KMT_60s_test_prc_desc:0 "Maintenant que nous avons renforcé notre frontière au nord, nous allons mettre notre puissance à l'épreuve face au PCC."
 KMT_60s_aid_south_korea:0 "La question coréenne"
 KMT_60s_aid_south_korea_desc:0 "Étant donné que la République de Corée a connu, tout comme nous, une guerre civile il y a une dizaine d'années, nous devons trouver un moyen d'aider les Coréens à lutter contre leurs homologues communistes."
 KMT_60s_aid_south_korea_army:0 "Approvisionner l'armée sud-coréenne"
 KMT_60s_aid_south_korea_army_desc:0 "Nous devons fournir des armes à l'armée sud-coréenne afin qu'elle puisse se défendre contre de futures invasions communistes venues du Nord."
 KMT_60s_neutrality_korea:0 "Déclarer la neutralité envers la Corée"
 KMT_60s_neutrality_korea_desc:0 ""
 KMT_60s_denounce_kim:0 "Sanctionner la Corée du Nord"
 KMT_60s_denounce_kim_desc:0 ""
 KMT_60s_denounce_park:0 "Dénoncer Park Chung-hee"
 KMT_60s_denounce_park_desc:0 ""
 KMT_60s_protect_south_korea:0 "Protéger la Corée du Sud"
 KMT_60s_protect_south_korea_desc:0 ""
 KMT_60s_aid_south_vietnam:0 "La guerre du Vietnam"
 KMT_60s_aid_south_vietnam_desc:0 "Le Vietnam est également en proie à une guerre civile qui oppose le régime communiste du Nord au régime libre du Sud. Aidons le régime du Sud à Saigon de toutes les manières possibles."
 KMT_60s_stay_out_of_vietnam_militarily:0 "Éviter l'escalade"
 KMT_60s_stay_out_of_vietnam_militarily_desc:0 ""
 KMT_60s_support_south_vietnam:0 "Soutenir le Sud-Vietnam"
 KMT_60s_support_south_vietnam_desc:0 ""
 KMT_60s_nation_building_south:0 "Bâtiment administratif au Sud-Vietnam"
 KMT_60s_nation_building_south_desc:0 ""
 KMT_60s_push_for_regime_change:0 "Faire pression pour un changement de régime"
 KMT_60s_push_for_regime_change_desc:0 ""
 KMT_60s_embargo_north:0 "Embargo sur le Nord"
 KMT_60s_embargo_north_desc:0 "Pour affaiblir le régime communiste du Nord-Vietnam, nous allons leur imposer un embargo, afin d'empêcher que des armes et du matériel supplémentaires ne leur parviennent."
 KMT_60s_sabotage_supply_north:0 "Saboter les lignes d'approvisionnement du Viêt Cong"
 KMT_60s_sabotage_supply_north_desc:0 "En sabotant les lignes d'approvisionnement des Viet Cong, nous pouvons paralyser l'effort de guerre du régime communiste du Nord-Vietnam."
 KMT_60s_vietnam_war:0 "Nommer Hu Lien ambassadeur au Vietnam"
 KMT_60s_vietnam_war_desc:0 "Étant donné que Hu Lien a l'habitude de lutter contre les guérilleros communistes, nous pourrions peut-être l'envoyer en tant qu'ambassadeur au Sud-Vietnam afin qu'il aide l'ARVN à combattre ses propres guérilleros communistes grâce à son expertise."
 KMT_60s_guns_for_vietnam:0 "Aide matérielle à Saigon"
 KMT_60s_guns_for_vietnam_desc:0 "Nous apporterons notre soutien au gouvernement de Saigon au Sud-Vietnam en lui envoyant des fournitures et du matériel qui lui permettront de mener la guerre contre le Viêt Minh."
 KMT_60s_secret_negotiations:0 "Renforcer l'influence du VNQDD"
 KMT_60s_secret_negotiations_desc:0 "Le VNQDD partage notre vision d'une république fondée sur les Trois Principes du Peuple ; aidons-le à étendre son influence au Vietnam également. Le Viet Quoc, également connu sous le nom de Viet Nam Quoc Dan Dang ou VNQDD, est un parti nationaliste vietnamien réputé pour son anticolonialisme. Nous soutiendrons nos frères d'Indochine dans leur lutte contre les fléaux du colonialisme !"
 KMT_60s_direct_intervention:0 "Intervention directe"
 KMT_60s_direct_intervention_desc:0 "Nous devons apporter un soutien direct à Saigon dans ses relations avec le Nord-Vietnam communiste, afin d'aider le Sud-Vietnam à gagner la guerre."
 KMT_60s_send_volunteers:0 "Recruter des volontaires"
 KMT_60s_send_volunteers_desc:0 ""
 KMT_60s_mediate_unification:0 "Organiser la conférence de Taipei"
 KMT_60s_mediate_unification_desc:0 ""
 KMT_60s_united_vietnam_in_our_sphere:0 "Traité sino-vietnamien de coopération et d'amitié"
 KMT_60s_united_vietnam_in_our_sphere_desc:0 ""
 KMT_60s_Sinkiang:0 "La question du Xinjiang"
 KMT_60s_Sinkiang_desc:0 "Comme le Xinjiang est toujours sous contrôle communiste, nous devons rapidement décider comment agir à leur égard."
 KMT_60s_Yulbars:0 "Contacter Yulbars Khan"
 KMT_60s_Yulbars_desc:0 "Le Xinjiang faisant partie de la Chine depuis la dynastie Qing, nous ne l'abandonnerons jamais. Contactons le chef de guerre loyaliste, Yulbars Khan, et aidons-le à s'emparer du Xinjiang."
 KMT_60s_Ressource_Smuggle:0 "Contrebande de ressources"
 KMT_60s_Ressource_Smuggle_desc:0 "Nous pouvons commencer à soutenir Yulbars Khan dans sa lutte pour la reconquête du Xinjiang en faisant passer clandestinement des ressources qui nous aideront à combattre les communistes sur place."
 KMT_60s_arm_hans:0 "Armer les milices locales han"
 KMT_60s_arm_hans_desc:0 "Étant donné que les tensions ethniques entre les Ouïghours et les Hans locaux restent vives au Xinjiang, envoyons des armes aux milices han locales pour qu'elles combattent le gouvernement communiste du Xinjiang."
 KMT_60s_support_KMT_remnants:0 "Soutenir les vestiges du KMT"
 KMT_60s_support_KMT_remnants_desc:0 "Nous pouvons également apporter notre soutien aux vestiges du KMT qui continuent de lutter au Xinjiang contre le gouvernement communiste afin de les affaiblir de l'intérieur."
 KMT_60s_raid_Bayingolin:0 "Raid de Bayingolin"
 KMT_60s_raid_Bayingolin_desc:0 "Prenons l'initiative et lançons un raid sur Bayingolin afin d'affaiblir encore davantage l'armée communiste du Xinjiang, ce qui pourrait ouvrir la voie à un coup d'État."
 KMT_60s_do_coup:0 "Lancer le coup d'État"
 KMT_60s_do_coup_desc:0 "Maintenant que nous avons affaibli les forces communistes au Xinjiang, il est temps pour nous de lancer un coup d'État dans cette région avec l'aide de Yulbars Khan et de complices locaux. Reprenons le Xinjiang aux forces communistes qui s'y trouvent et réunifions la Chine une fois pour toutes."
 KMT_60s_Asylum:0 "Accorder l'asile aux immigrants han"
 KMT_60s_Asylum_desc:0 "Puisque nous avons renoncé à nos prétentions sur le Xinjiang, offrons l'asile aux immigrants han qui souhaitent quitter cette région."
 KMT_60s_recall_officiers:0 "Rappeler les responsables de l'armée du Xinjiang"
 KMT_60s_recall_officiers_desc:0 "Rappelons tous les militaires qui étaient restés au Xinjiang, maintenant que nous n'y revendiquions plus aucun droit."
 KMT_60s_abolish_governate:0 "Abolir le gouvernorat du Xinjiang"
 KMT_60s_abolish_governate_desc:0 "Nous allons désormais abolir le gouvernorat du Xinjiang et le faire disparaître de la carte de notre pays."
 KMT_60s_integrate_sik:0 "Intégrer le Xinjiang"
 KMT_60s_integrate_sik_desc:0 ""
 KMT_60s_friendship_SIK:0 "Traité d'amitié et de non-agression"
 KMT_60s_friendship_SIK_desc:0 "Grâce au traité d'amitié et de non-agression, nous pouvons garantir à Moscou que la paix régnera en Asie, à condition que ni nous ni eux ne nous attaquions mutuellement."
 KMT_60s_ask_sov:0 "Prendre contact avec Moscou"
 KMT_60s_ask_sov_desc:0 "Nous devrions prendre contact avec Moscou et lui garantir que nous n'envahirons pas le Xinjiang à l'avenir."
 KMT_60s_trial_Shicai:0 "Le destin de Sheng Shicai"
 KMT_60s_trial_Shicai_desc:0 "Puisque nous avons abandonné le Xinjiang, nous allons juger Sheng Shicai, l'ancien gouverneur du Xinjiang, et décider de son sort."
 KMT_60s_Coup:0 "Développer le NBIS "
 KMT_60s_Coup_desc:0 "Nous devrions renforcer le NBIS afin de mener efficacement notre opération de reconquête du Xinjiang."
 KMT_60s_korea_industrial_aid:0 "Aide industrielle à Séoul"
 KMT_60s_korea_industrial_aid_desc:0 "Nous pouvons envoyer de l'aide industrielle à Séoul afin que la République de Corée puisse reconstruire rapidement son industrie."
 KMT_60s_korea_war:0 "Conseillers militaires"
 KMT_60s_korea_war_desc:0 "Nous pouvons envoyer des conseillers militaires à Séoul pour les aider à former des soldats à la lutte contre les communistes."
 KMT_60s_korea_refugees:0 "Accueillir les réfugiés coréens"
 KMT_60s_korea_refugees_desc:0 "Nous devrions accueillir les réfugiés coréens qui souhaitent s'installer dans notre pays pour échapper à la répression et à la torture."
 KMT_60s_korea_joint_exercises:0 "Manœuvres militaires conjointes"
 KMT_60s_korea_joint_exercises_desc:0 "Nous devrions organiser des exercices militaires conjoints avec l'armée sud-coréenne afin de renforcer la coopération entre les armées de nos deux pays face aux forces communistes."
 KMT_60s_korea_solve_conflict:0 "Unir la péninsule"
 KMT_60s_korea_solve_conflict_desc:0 "Nous devons trouver un moyen de résoudre le conflit coréen afin de nous assurer de conserver un allié dans la péninsule coréenne."
 KMT_60s_sino_korean_friendship:0 "Traité d'assistance sino-coréen"
 KMT_60s_sino_korean_friendship_desc:0 ""
 KMT_60s_korea_Protect_only:0 "Mesures Défensives"
 KMT_60s_korea_Protect_only_desc:0 "Nous garantirons officiellement la souveraineté de la République de Corée, de sorte que Pyongyang y réfléchira à deux fois avant de franchir à nouveau la frontière."
 KMT_60s_Recognize:0 "Reconnaître l'indépendance du Turkestan oriental"
 KMT_60s_Recognize_desc:0 "Nous devons prendre conscience que le Xinjiang est une cause perdue et que la reconnaissance de l'indépendance de la République du Turkestan oriental constituerait le premier pas vers la paix dans le Nord-Ouest."
 KMT_60s_Infra_Structure:0 "Moderniser les infrastructures dans le Xibei"
 KMT_60s_Infra_Structure_desc:0 "Nous devons moderniser nos infrastructures dans la région du Nord-Ouest afin de les protéger contre toute incursion du gouvernement communiste du Xinjiang."
 KMT_60s_Training:0 "Exercices militaires dans le Qinghai"
 KMT_60s_Training_desc:0 "Nous devons mener des exercices militaires au Qinghai afin de le défendre contre de futures invasions communistes en provenance du Xinjiang."
 KMT_60s_Forts_SIK:0 "Développement des fortifications"
 KMT_60s_Forts_SIK_desc:0 "Nous devons construire des fortifications à la frontière nord-ouest afin de dissuader toute tentative d'invasion en provenance du Xinjiang."
