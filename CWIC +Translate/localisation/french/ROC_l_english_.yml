 CHI_Supply_Node:0 "Mesures d'urgence relatives aux infrastructures"
 CHI_Supply_Node_desc:0 "L'échec de l'offensive communiste nous a donné un peu de répit pour nous réorganiser et planifier une contre-attaque. Divers projets spécifiques concernant les routes, les voies ferrées et les réseaux d'approvisionnement doivent être mis en œuvre afin de mettre en place une structure logistique fiable, capable d'assurer l'approvisionnement de nos soldats en nourriture, en vêtements et en équipement."
