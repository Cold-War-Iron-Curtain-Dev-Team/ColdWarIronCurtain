 KMT_Economic_aftermath_of_civil_war_1:0 "Conséquences économiques de la guerre civile"
 KMT_Economic_aftermath_of_civil_war_1_desc:0 "Après près de douze ans de conflits incessants, d'instabilité, d'hyperinflation et de sanctions occidentales, l'économie chinoise est en ruines et doit être reconstruite à partir de zéro. Ce sera une tâche difficile, mais le succès de notre gouvernement en dépend."
