 CHI_Economic_Cooperation:0 "Coopération économique chinoise"
 National_Crisis_modifier:0 "État de la République"
 National_Crisis_modifier_desc:0 "Même après notre victoire dans la guerre civile contre le Parti communiste, le soutien public au Kuomintang est au plus bas, et divers dissidents politiques, notamment les vestiges communistes, les collaborateurs japonais et les sociaux-démocrates, constituent une menace pour le régime actuel. Ces questions doivent être abordées et traitées avec prudence par le gouvernement. Sinon, l'ordre public pourrait ne jamais revenir en Chine."
