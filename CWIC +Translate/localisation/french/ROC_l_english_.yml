 Hainan_Invasion:0 "L'invasion de Hainan"
 Hainan_Invasion_desc:0 "Remarque : ce modificateur s'applique aux provinces de Taïwan, aux îles Penghu et aux autres provinces de la République, à l'exception de Hainan. Il vise à empêcher la République populaire de Chine de faire capituler la République de Chine."
 CHI_Mainland_Rent_Cap_Established:0 "Un plafond de loyer de 37,5 % a été fixé."
 KMT_centralized_schools:0 "Le gouvernement a centralisé les établissements d'enseignement supérieur et les établissements scolaires"
 KMT_Taiwan50s.5.b:0 "Nos compatriotes de Chine continentale doivent entendre cela !"
 KMT_Taiwan50s.5.c:0 "Propagande bourgeoise !"
 KMT_Taiwan50s.45.t:0 "L'œil vigilant"
 KMT_Taiwan50s.45.d:0 "Avec la consolidation de la République de Chine sur l'île de Taïwan, le ministère de l'Éducation a décidé que le programme scolaire devait aller au-delà de la simple maîtrise de la lecture, de l'écriture et des mathématiques. Pour survivre à la menace existentielle venant de l'autre côté du détroit, la prochaine génération doit faire preuve d'une loyauté sans faille envers l'État et ses dirigeants.\n\nUn nouveau décret a été promulgué : chaque salle de classe, de la plus petite école primaire rurale aux amphithéâtres des universités de Taipei, doit désormais afficher un portrait du généralissime Tchang Kaï-chek aux côtés de celui de Sun Yat-sen et du drapeau national. En plaçant l’image du Leader à l’avant de chaque salle, on rappelle quotidiennement aux élèves le sacrifice des expéditions vers le nord et la lutte en cours pour la reconstruction nationale. Alors que certains critiques de la presse clandestine murmurent qu’il s’agit d’un « culte de la personnalité », le gouvernement s’empresse de garantir que toute école qui ne se conformerait pas à cette règle s’exposerait à des conséquences rapides et imprévisibles."
 KMT_Taiwan50s.45.a:0 "Comme il se doit."
 KMT_Taiwan50s.46.t:0 "Le gouverneur modèle"
 KMT_Taiwan50s.46.d:0 "Pendant des décennies, Yan Xishan, le « gouverneur modèle » du Shanxi, a été l’une des figures les plus puissantes et les plus indépendantes de Chine. Politicien pragmatique et habile à assurer sa survie, qui a su guider sa province natale du Shanxi à travers l’ère des seigneurs de la guerre, l’invasion japonaise et la guerre civile, Yan s’est retiré à Taipei aux côtés du Kuomintang. Contrairement à nombre de ses contemporains qui se sont enfuis à Hong Kong ou en Occident, Yan reste attaché à la survie de la République.\n\nMalgré leurs relations houleuses, Tchang Kaï-chek reconnaît la valeur symbolique de Yan. En l'invitant à rejoindre son cercle restreint en tant que conseiller principal, le généralissime peut présenter un front uni, de sorte que même les dirigeants les plus indépendants d'esprit reconnaissent que le KMT est la seule voie vers le redressement."
 KMT_Taiwan50s.46.a:0 "Bon retour parmi nous."
 KMT_Taiwan50s.47.t:0 "Le transfert de la collection du Palais de Pékin"
 KMT_Taiwan50s.47.da:0 "Après un périple de 12 000 kilomètres à travers les montagnes du Sichuan et l'intérieur de la Chine ravagé par la guerre, les plus beaux trésors de la Cité interdite ont enfin atteint leur refuge temporaire à Taïwan. D'abord entreposées dans les entrepôts de sucre de Taichung, puis dans les tunnels spécialement construits à Beigou, ces milliers de caisses renferment des biens culturels issus de cinq mille ans de civilisation chinoise. En mettant en sécurité le Chou de jade, le Mao Gong Ding et les vastes bibliothèques impériales, la République de Chine reste la seule gardienne légitime du mandat chinois. Le monde doit reconnaître que la culture de la Chine réside là où ses trésors sont conservés."
 KMT_Taiwan50s.47.db:0 "Alors que la poussière de la guerre de libération retombe, l'inventaire vide du Musée du Palais de Pékin a révélé l'ampleur du désespoir du KMT. Dans leur fuite lâche vers l'île de Taïwan, Tchang Kaï-chek et ses partisans ont pillé le patrimoine national, emballant les objets les plus précieux dans des milliers de caisses et les expédiant vers Formose. Des légendaires vases en bronze de la dynastie Zhou à la porcelaine la plus raffinée de la dynastie Song, le patrimoine culturel du peuple chinois est pris en otage par un régime moribond. Les organes de propagande de Taipei prétendent « préserver » ces biens, mais la République populaire connaît la vérité : il s’agit d’un vol criminel de l’histoire du peuple. Nous ne cesserons jamais de réclamer le retour de ces trésors dans leur foyer légitime, la capitale."
 KMT_Taiwan50s.47.a:0 "Nous sommes les véritables gardiens de l'histoire chinoise."
 KMT_Taiwan50s.47.b:0 "Les réactionnaires ont volé l'histoire du peuple !"
 KMT_Hainan.1.t:0 "[GetNewspaperHeader] L'Armée populaire de libération avance sur Hainan"
 KMT_Hainan.1.d:0 "À la suite de l'évacuation de la Chine continentale, le Kuomintang a transféré la majeure partie de ses forces sur l'île de Taïwan, se préparant à de futures attaques de l'Armée populaire de libération. L'île de Hainan est restée sous le contrôle du Kuomintang jusqu'à ce que des vagues de navires de l'APL soient récemment repérées au large de la côte nord de l'île. Les forces françaises restantes à Guangzhouwan ont signalé une importante invasion amphibie se dirigeant droit vers la côte, dans le but de reprendre l'île au Kuomintang et d'écraser tout espoir de résistance contre le régime nouvellement établi à Pékin. Il n'est pas certain que les forces du Kuomintang puissent repousser l'attaque ou qu'elles soient contraintes de se replier vers Taipei. Le ministère des Affaires étrangères de la République de Chine a refusé de publier une déclaration concernant l'invasion, affirmant qu'il s'agissait d'une « affaire interne »."
 KMT_Hainan.1.a:0 "La guerre civile se poursuit."
 KMT_Hainan.1.b:0 "Venez nous chercher !"
 KMT_Hainan.1.c:0 "Nous allons libérer l'île !"
 KMT_Hainan.2.t:0 "[GetNewspaperHeader] L'Armée populaire de libération s'empare de Hainan"
 KMT_Hainan.2.d:0 "Après d'intenses combats sur l'île de Hainan, les forces communistes de l'Armée populaire de libération ont fait leur entrée à Haikou, proclamant leur victoire sur les forces locales du Kuomintang. Le conflit dévastateur qui a opposé les troupes restantes du Kuomintang à l'alliance communiste composée de soldats de l'APL et de communistes locaux a plongé les forces républicaines dans un désespoir encore plus grand ; celles-ci se sont désormais dispersées vers la Birmanie, le Sud-Vietnam et Taipei. La République populaire de Chine nouvellement fondée a proclamé sa victoire et a exprimé son désir de libérer le reste des territoires contrôlés par le Kuomintang. Les observateurs ont noté que les défenses de Taïwan s'avèrent plutôt bien fortifiées, rendant un assaut sur l'île nettement plus difficile à mener qu'à Hainan."
 KMT_Hainan.2.a:0 "Taïwan sera-t-il le prochain ?"
 KMT_Hainan.2.b:0 "Zut !"
 KMT_Hainan.2.c:0 "Une grande victoire"
 KMT_Hainan.3.t:0 "[GetNewspaperHeader] La défense du Kuomintang à Hainan"
 KMT_Hainan.3.d:0 "À l'issue d'intenses combats sur l'île de Hainan, les forces communistes de l'Armée populaire de libération ont été encerclées par les unités locales du Kuomintang, qui ont finalement proclamé leur victoire totale sur les communistes, renforçant ainsi leur emprise sur Hainan. Le ministère des Affaires étrangères de la République de Chine a publié un communiqué qualifiant cette défense de « succès retentissant pour la reconquête de la Chine continentale ». Pékin n'a fourni aucune information officielle à ce sujet, mais on suppose que cela constitue un léger embarras pour les dirigeants communistes, compte tenu de leur emprise totale sur la Chine continentale. Cependant, cela indiquera très probablement que l'île de Taïwan ne fera l'objet d'aucune attaque future, du moins pas avant que Hainan ait été conquise par les communistes."
 KMT_Hainan.3.a:0 "Une surprise."
 KMT_Hainan.3.b:0 "La Chine libre vit toujours !"
 KMT_Hainan.3.c:0 "Nous reviendrons."