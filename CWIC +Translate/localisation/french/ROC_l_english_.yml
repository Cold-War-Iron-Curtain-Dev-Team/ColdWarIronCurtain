 KMT_Temporary_Provisions_Taiwan_50s_category:0 "Mesures provisoires contre la rébellion communiste"
 KMT_Temporary_Provisions_Taiwan_50s_category_desc:0 "\n\n\n\n\n\n£CHI_Temporary_Provisions\n\n\n\n\n\n\n\nLorsque la Constitution de la République de Chine fut rédigée et adoptée par l'Assemblée nationale en 1947, elle suscita une grande joie et de grands espoirs au sein du gouvernement, qui espérait enfin stabiliser la Chine et entamer la troisième phase de la révolution du Dr Sun Yat-sen, prônant le progrès du constitutionnalisme. Cependant, les avancées rapides du Parti communiste sur le continent et les désertions massives nous ont contraints à suspendre la Constitution et à instaurer la loi martiale dans la République jusqu'au retour de la stabilité et de l'ordre. Le PCC occupant le continent chinois et ayant proclamé un nouveau gouvernement, il est tout à fait naturel que l'Assemblée nationale approuve le renouvellement des dispositions jusqu'à ce que le continent soit entièrement libéré des bandits communistes.\n"
 Move_Presidential_Palace_to_Taipei:0 "Transférer le siège de la présidence à Taipei"
 Move_Presidential_Palace_to_Taipei_desc:0 "Avec la chute de Chengdu à la fin de l’année 1949, les centres provisoires de la République de Chine mis en place pendant la guerre ont été dissous. En installant officiellement le palais présidentiel dans l’ancien palais du gouverneur général japonais à Taipei, nous montrerons que notre repli s’est transformé en une base structurée et durable pour la résistance et la reconquête future du continent."
 Storage_of_National_Palace_Museum_Goods:0 "Entreposage des objets du Musée national du Palais"
 Storage_of_National_Palace_Museum_Goods_desc:0 "Après avoir survécu au périple qui les a menés de Pékin à Nankin, puis jusqu’aux tunnels de Taichung, ces milliers d’objets impériaux sont bien plus que de simples œuvres d’art ; ils constituent un trésor qui prouve que la République de Chine reste la véritable gardienne de la culture chinoise."
 Establish_Mandatory_Portraits_in_School_Classes:0 "Instaurer l'obligation de prendre des photos de classe"
 Establish_Mandatory_Portraits_in_School_Classes_desc:0 "Le nationalisme commence au tableau noir. En plaçant des portraits de Sun Yat-sen et de Tchang Kaï-chek dans chaque salle de classe, l'État encourage un culte de la personnalité et veille à ce que les « Trois principes du peuple » soient la première chose que chaque élève voie, ancrant ainsi l'identité de la jeunesse à la cause nationaliste."
 Launch_A_Party_Cadre_Recruitment_Wave:0 "Lancer une campagne de recrutement de cadres du Parti"
 Launch_A_Party_Cadre_Recruitment_Wave_desc:0 "Pour assurer la survie du KMT en exil, le parti doit passer d'une bureaucratie militaire pléthorique à une machine idéologique efficace et allégée. En recrutant une nouvelle génération de cadres fidèles — dont beaucoup sont des Taïwanais de souche —, le parti consolide son emprise sur le terrain dans chaque village, chaque usine et chaque unité militaire."
 Invite_Yan_Xishan_into_Chiangs_Circle:0 "Inviter Yan Xishan à rejoindre le cercle de Chiang"
 Invite_Yan_Xishan_into_Chiangs_Circle_desc:0 "Le « gouverneur modèle » du Shanxi, ayant perdu sa province aux mains des communistes, se retrouve à Taïwan. En intégrant cet homme d'État chevronné et ancien militaire à son cercle restreint en tant que conseiller principal, Tchang ne se contente pas de maintenir l'apparence d'une représentation chinoise complète au sein de son gouvernement, mais s'adjoint également les services de l'un des gouverneurs chinois les plus appréciés et les plus efficaces du siècle."
 Launch_Propaganda_Broadcasts_across_Mainland_China:0 "Lancement de campagnes de propagande à travers la Chine continentale"
 Launch_Propaganda_Broadcasts_across_Mainland_China_desc:0 "Des tours radio à haute puissance situées le long des côtes de Kinmen et de Matsu commencent à diffuser « La Voix de la Chine libre » par-delà le détroit de Taïwan. Ces émissions, qui mêlent actualités, musique pop et témoignages de transfuges, visent à percer le blocus de l'information communiste et à entretenir l'espoir d'une « renaissance nationale » dans le cœur des habitants de la Chine continentale."
 Formally_Expell_Li_Zongren_as_VP:0 "Révoquer Li Zongren de son poste de vice-président"
 Formally_Expell_Li_Zongren_as_VP_desc:0 "Alors que la rivalité entre Tchang Kaï-chek et Li Zongren a atteint son paroxysme vers la fin de la guerre civile, Li occupe toujours officiellement le poste de vice-président de la République de Chine. Comme il reste aux États-Unis pour y suivre un « traitement médical » et refuse de revenir sur l'île, le gouvernement doit rapidement le destituer et le démettre de ses fonctions."
 KMT_Temporary_Provisions_Mainland_50s_category:0 "Mesures provisoires contre la rébellion communiste"
 KMT_Temporary_Provisions_Mainland_50s_category_desc:0 "\n\n\n\n\n\n£CHI_Temporary_Provisions\n\n\n\n\n\n\n\nL'adoption de la Constitution de 1947 a été saluée comme un triomphe, une promesse de stabiliser enfin la Chine et d'entamer la troisième phase tant attendue de la révolution du Dr Sun Yat-sen. Cependant, l'avancée inexorable des communistes et les désertions massives ne nous ont laissé d'autre choix que de suspendre ces libertés et d'imposer la loi martiale pour rétablir l'ordre. L'ennemi étant renforcé par l'aide soviétique en Mandchourie, l'Assemblée nationale doit inévitablement renouveler ces dispositions jusqu'à ce que le continent soit entièrement libéré des bandits communistes.\nPourtant, alors même que la deuxième phase de la §Rguerre civile chinoise§! touche à sa fin, les fantômes du passé refont surface. Les £budget_rich §ccentres urbains§!, sont le théâtre d'une agitation menée par les intellectuels, les commerçants et les §Rsympathisants communistes§!, ce qui éloigne la population du gouvernement. Pire encore, la £population_texticon §Opopulation paysanne§! est de plus en plus §Omécontente§! de la domination des propriétaires terriens, tandis que le [CHI.GetFlag]§gKuomintang§! lui-même reste paralysé, §gdivisé§! entre des factions rivales.\n\n--------------\n\n§gEffets de [CHI.GetFlag]l'nstabilité du Parti :§!\n\nGain de pouvoir politique : [?ROOT.crisis_factor_party_neg|%0R]\nVitesse de construction : [?ROOT.crisis_factor_party_neg|%0R]\n\n§cEffets de £budget_rich l'nstabilité urbaine :§!\n\nProduction industrielle : [?ROOT.crisis_factor_urban_neg|%0R]\nVitesse de recherche : [?ROOT.crisis_factor_urban_neg|%0R]\n\n§OEffets de £population_texticon l'instabilité rurale :§!\n\nFacteur d'approvisionnement : [?ROOT.crisis_factor_rural_neg|%0R]\nGain hebdomadaire de soutien à la guerre : [?ROOT.crisis_factor_rural_neg|%0R]\n"
 End_the_Crisis:0 "Mettre fin à l'instabilité politique"
 End_the_Crisis_desc:0 "L'ordre a été rétabli. Les menaces immédiates qui pesaient sur la stabilité de l'État ont été neutralisées, et les mesures d'urgence peuvent désormais être assouplies. La République est à nouveau en sécurité."
 Expand_The_Garrison_Command:0 "Développer le commandement de la garnison"
 Expand_The_Garrison_Command_desc:0 "Le Commandement de la garnison est le rempart de l'État. Nous devons étendre sa compétence et ses moyens financiers afin d'éradiquer toute activité subversive, de placer en détention les personnes soupçonnées de trahison et d'appliquer la loi martiale avec une efficacité sans faille."
 Purge_Universities:0 "Nettoyer les universités"
 Purge_Universities_desc:0 "Nos écoles sont devenues des foyers de pensée radicale et de sympathie marxiste. Nous devons débarrasser le corps enseignant et les élèves de ces éléments dangereux afin de garantir que la prochaine génération reste fidèle aux Trois Principes."
 Enforce_Mandarin_Only_Education:0 "Encourager l'enseignement du mandarin"
 Enforce_Mandarin_Only_Education_desc:0 "Une langue divisée mène à une nation divisée. Nous imposerons strictement le mandarin comme seule langue d'enseignement et sanctionnerons l'usage des dialectes locaux afin de forger une identité nationale unifiée."
 Subsidize_Urban_State_Enterprises:0 "Subventionner les entreprises publiques urbaines"
 Subsidize_Urban_State_Enterprises_desc:0 "La main-d'œuvre urbaine est en ébullition. En injectant des fonds publics dans des secteurs clés, nous pouvons garantir l'emploi et nous assurer la loyauté du prolétariat, le mettant ainsi hors de portée des agitateurs communistes."
 Enforce_375_Rent_Cap:0 "Appliquer le plafonnement des loyers à 37,5%"
 Enforce_375_Rent_Cap_desc:0 "Les métayers sont écrasés par des loyers exorbitants. En plafonnant légalement le loyer agricole à 37,5 % du rendement de la culture principale, nous allégerons leur fardeau et affaiblirons l'attrait des communistes dans les campagnes."
 Compensation_Landlords_with_Japanese_Assets:0 "Utiliser les actifs japonais pour indemniser les propriétaires"
 Compensation_Landlords_with_Japanese_Assets_desc:0 "Afin d'éviter toute révolte de la part de la noblesse terrienne lors de la réforme agraire, nous les indemniserons pour la perte de leurs terres en leur attribuant des parts dans des sociétés industrielles saisies aux occupants japonais vaincus."
 Land_to_The_Tiller:0 "La terre à celui qui la cultive"
 Land_to_The_Tiller_desc:0 "La solution définitive à la crise agraire. L'État rachetera de force les terres excédentaires aux propriétaires fonciers et les revendra aux locataires actuels, créant ainsi une nouvelle classe de propriétaires-agriculteurs fidèles, attachés à la survie de la République."
 Deploy_Rural_Pacification_Squads:0 "Déployer des escouades de pacification rurale"
 Deploy_Rural_Pacification_Squads_desc:0 "Les paroles seules ne suffiront pas à mettre un terme aux agissements des bandits. Nous devons déployer des escouades de pacification armées pour ratisser les provinces, rétablir l'ordre dans les villages et rappeler aux seigneurs de guerre que l'autorité de Nankin est absolue."
 Reform_CC_Clique:0 "Réformer la Clique du Club central"
 Reform_CC_Clique_desc:0 "Le « Club central » est devenu trop puissant et dirige le parti comme s'il s'agissait de son fief personnel. Nous devons démanteler ses réseaux autonomes et placer ses immenses ressources sous le contrôle direct du président du parti."
 Expand_Yangmingshan_Institute:0 "Développer l'Institut Yangmingshan"
 Expand_Yangmingshan_Institute_desc:0 "L'Institut de recherche sur la pratique révolutionnaire de Yangmingshan est le creuset de notre nouvelle élite. Nous allons augmenter ses effectifs afin de former des milliers de cadres disciplinés à la véritable idéologie du Parti."
 Conduct_Ideological_Re_Registration:0 "Procéder à une réinscription idéologique"
 Conduct_Ideological_Re_Registration_desc:0 "Nous ne pouvons tolérer aucune passivité. Chaque membre du Parti doit se soumettre à un processus rigoureux de contrôle et de réinscription. Ceux qui se révèlent corrompus ou dont les convictions idéologiques sont vacillantes seront immédiatement exclus du Kuomintang."
 Communist_Activities_Urban:0 "Activités communistes en milieu urbain"
 Communist_Activities_Urban_desc:0 "Des agitateurs et des cellules dormantes sévissent dans nos centres industriels, organisant des grèves et semant le défaitisme dans les universités. Si rien n'est fait, les villes deviendront un terreau fertile pour l'insurrection."
 Peasant_Rebellions_Rural:0 "Révoltes paysannes rurales"
 Peasant_Rebellions_Rural_desc:0 "La campagne est en pleine révolte. Le banditisme, attisé par les promesses de terres faites par les communistes, menace notre approvisionnement alimentaire et nos voies de ravitaillement. Les magistrats locaux perdent le contrôle des villages."
 Party_Factionalism:0 "Luttes intestines au sein du Kuomintang"
 Party_Factionalism_desc:0 "Le parti est en train de se déchirer. Des factions rivales font passer leur propre pouvoir avant la survie de la nation, paralysant le gouvernement central par la corruption et l'enlisement bureaucratique."
 CHI_land_reform_issue_1_desc:0 "La guerre civile chinoise et les campagnes de propagande du Parti communiste ont remis au goût du jour la question de la réforme agraire en Chine. La majorité des citoyens chinois sont des paysans, et il est essentiel pour la survie de tout gouvernement chinois de s'assurer leur soutien. La principale question que se pose le Kuomintang est toutefois de savoir jusqu'où cet engagement doit aller."
 CHI_land_reform_issue_2_desc:0 "La guerre civile chinoise et les campagnes de propagande du Parti communiste ont remis au goût du jour la question de la réforme agraire en Chine. La majorité des citoyens chinois sont des paysans, et il est essentiel pour la survie de tout gouvernement chinois de s'assurer leur soutien. Le Kuomintang a déjà pris diverses mesures en confisquant les terres des collaborateurs japonais ou des propriétaires fonciers récalcitrants, mais d'autres mesures doivent être prises afin d'apaiser les paysans chinois."
 CHI_Economic_Cooperation_desc:0 "Le gouvernement du Kuomintang est ouvert aux investissements et à la coopération économique avec les autres nations d'Asie qui ont vu le jour après la capitulation du Japon. Des délégations ont été envoyées dans divers pays d'Indochine et d'Asie du Sud-Est dans l'espoir d'établir des relations diplomatiques et économiques."
 CHI_Disorganized_Kuomintang_1_desc:0 "Les années de guerre civile et la retraite chaotique du gouvernement central ont laissé le Parti au bord de l'effondrement. Les luttes intestines entre la clique du Comité central, la clique de Whampoa et le groupe des sciences politiques ont paralysé l'administration centrale. La corruption est endémique, les directives de Nanjing sont ignorées par les cadres locaux, et l'esprit révolutionnaire de 1911 semble n'être plus qu'un lointain souvenir. Tant que le généralissime n'aura pas purgé les défaitistes et imposé une chaîne de commandement unique, le gouvernement restera un géant aux pieds d'argile."
 CHI_Disorganized_Kuomintang_2_desc:0 "Les années de guerre civile et la retraite chaotique du gouvernement central ont laissé le Parti au bord de l'effondrement. Les luttes intestines entre la clique du Comité central, la clique de Whampoa et le groupe des sciences politiques ont paralysé l'administration centrale. La corruption est endémique, les directives de Nanjing sont ignorées par les cadres locaux, et l'esprit révolutionnaire de 1911 semble n'être plus qu'un lointain souvenir. Tant que le généralissime n'aura pas purgé les défaitistes et imposé une chaîne de commandement unique, le gouvernement restera un géant aux pieds d'argile."
 CHI_Disorganized_Kuomintang_3_desc:0 "Les années de guerre civile et la retraite chaotique du gouvernement central ont laissé le Parti au bord de l'effondrement. Les luttes intestines entre la clique du Comité central, la clique de Whampoa et le groupe des sciences politiques ont paralysé l'administration centrale. La corruption est endémique, les directives de Nanjing sont ignorées par les cadres locaux, et l'esprit révolutionnaire de 1911 semble n'être plus qu'un lointain souvenir. Tant que le généralissime n'aura pas purgé les défaitistes et imposé une chaîne de commandement unique, le gouvernement restera un géant aux pieds d'argile."
 CHI_Disorganized_Kuomintang_4_desc:0 "Les années de guerre civile et la retraite chaotique du gouvernement central ont laissé le Parti au bord de l'effondrement. Les luttes intestines entre la clique du Comité central, la clique de Whampoa et le groupe des sciences politiques ont paralysé l'administration centrale. La corruption est endémique, les directives de Nanjing sont ignorées par les cadres locaux, et l'esprit révolutionnaire de 1911 semble n'être plus qu'un lointain souvenir. Tant que le généralissime n'aura pas purgé les défaitistes et imposé une chaîne de commandement unique, le gouvernement restera un géant aux pieds d'argile."
 banditry_desc:0 "Le retrait des forces principales communistes vers le nord a laissé un vide du pouvoir dans les campagnes. Des déserteurs, les vestiges des seigneurs de guerre locaux et des bandes criminelles opportunistes ont comblé ce vide, terrorisant les villages et perturbant les lignes d'approvisionnement. Bien qu'ils ne disposent pas de la cohésion idéologique des Rouges, ces bandits rendent impossible toute gouvernance efficace dans les provinces. L'autorité de l'État ne s'étend actuellement que jusqu'à la portée des fusils de la garnison la plus proche."
 banditry2_desc:0 "Le retrait des forces principales communistes vers le nord a laissé un vide du pouvoir dans les campagnes. Des déserteurs, les vestiges des seigneurs de guerre locaux et des bandes criminelles opportunistes ont comblé ce vide, terrorisant les villages et perturbant les lignes d'approvisionnement. Bien qu'ils ne disposent pas de la cohésion idéologique des Rouges, ces bandits rendent impossible toute gouvernance efficace dans les provinces. L'autorité de l'État ne s'étend actuellement que jusqu'à la portée des fusils de la garnison la plus proche."
 CHI_Georgist_Taxation_desc:0 ""
 KMT_land_reform_backlash_1_desc:0 "En apprenant que le gouvernement prévoyait de lancer des réformes agraires par le biais d'une redistribution des terres, de nombreux propriétaires fonciers influents ont commencé à s'opposer à nos efforts en la matière, ce qui a ralenti nos réformes agraires et nous a fait perdre le soutien des propriétaires fonciers."
 KMT_land_reform_backlash_2_desc:0 "En apprenant que le gouvernement prévoyait de lancer des réformes agraires par le biais d'une redistribution des terres, de nombreux propriétaires fonciers influents ont commencé à s'opposer à nos efforts en la matière ; toutefois, cette opposition s'est progressivement affaiblie à mesure que les réformes du gouvernement ont porté leurs fruits et ont largement apaisé les propriétaires fonciers."
 CHI_Legacy_of_the_inadequate_US_Army_Structure_1_desc:0 "Les forces armées de la République de Chine n'ont cessé de combattre depuis l'époque de la Campagne du Nord. Des campagnes d'encerclement à la guerre contre le Japon, jusqu'à la fin du conflit contre le Parti communiste chinois. La corruption et l'épuisement ont poussé notre armée à ses limites, la laissant dans un état désastreux. Si nous voulons rester concentrés sur notre objectif de réunification de la Chine, nous devons réorganiser et réformer les forces armées de la République."
