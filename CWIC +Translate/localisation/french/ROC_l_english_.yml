 cooperation_with_SEATO:0 "Coopérer avec l'OTSE"
 cooperation_with_SEATO_desc:0 "La nouvelle alliance SEATO (OTSE) formée par les États-Unis et les nations anticommunistes d'Asie permet à ces pays de résister à la propagation du communisme, même s'ils ne sont pas directement membres de l'alliance. Pour l'instant, nous coopérerons avec l'alliance SEATO et, en échange, nous bénéficierons de la protection de l'alliance elle-même en tant que pays non membre."
