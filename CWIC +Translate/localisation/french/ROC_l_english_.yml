 KMT_Military_Reforms_category:0 "Réforme de l'armée"
 KMT_Military_Reforms_category_desc:0 "\n\n\n\n\n\n£CHI_Texticon_Army\n\n\n\n\n\n\n\nLa corruption au sein des forces armées républicaines a failli entraîner la destruction totale de nos soldats pendant la guerre civile. Il est nécessaire d'apporter des changements fondamentaux à la structure et aux stratégies de notre armée afin de garantir une protection et une efficacité opérationnelles dans tout conflit futur, qu'il se déroule en Chine ou à l'étranger.\n"
 KMT_Shanghai_beating_tigers_category:0 "La transformation de Shanghai"
 KMT_Shanghai_beating_tigers_category_desc:0 "\n\n\n\n\n\n£CHI_Texticon_Shanghai\n\n\n\n\n\n\n\nQuand on pense à Shanghai, on pense à la Perle de l'Orient, à la Porte de l'Occident, voire au fleuron de la modernisation chinoise. Mais la réalité est souvent décevante. Des hommes d'affaires corrompus, des sociétés secrètes et même des membres de gangs ont décidé de revenir dans la ville après la guerre civile, montrant ainsi que la tâche de mettre de l'ordre dans la ville ne sera pas plus facile qu'auparavant. La seule différence, cependant, est que cette fois-ci, Chiang Ching-Kuo, le fils du généralissime, est deux fois plus déterminé à remplir son devoir de rétablir l'ordre public à Shanghai, si c'est ce qu'il faut pour regagner le soutien des Shanghaïens envers la République."
 send_ching_kuo_to_shanghai:0 "Envoyer Chiang Ching-Kuo à Shanghai"
 start_beating_the_tigers:0 "Lancer les réformes de Shanghai"
 relaunch_mass_movements_in_shanghai:0 "Relancer les mouvements de masse à Shanghai"
 lobby_support_from_government:0 "Soutien politique du gouvernement central"
 rearrest_green_gang_members:0 "Débarrasser la ville des gangs et des sociétés secrètes"
 outline_various_classes_in_Shanghai:0 "Aperçu des classes socio-économiques à Shanghai"
 attack_upperclass_businessmen:0 "Cible : hommes d'affaires haut placés"
 attack_middleclass_businessmen:0 "Cible : hommes d'affaires issus de la classe moyenne"
 conclude_the_reforms_in_shanghai:0 "Conclure les réformes à Shanghai"
 Chinese_Faction_Decisions_desc:0 "\n\n\n\n\n\n£CHI_Texticon_Warlords\n\n\n\n\n\n\n\nDepuis la mort de Yuan Shikai en 1916, la Chine est en proie à des cliques de seigneurs de guerre, qui ont pris le contrôle de plusieurs provinces grâce à leurs armées locales. Bien que le Kuomintang ait vaincu les seigneurs de guerre de Beiyang en 1928, plusieurs d'entre eux ont continué à exercer leur influence, ce qui pose encore aujourd'hui des problèmes à l'administration du Kuomintang.\n"
 Integrate_the_Shanxi_Clique:0 "Intégrer la clique du Shanxi"
 Integrate_the_Ningxia_Ma_Clique:0 "Intégrer la clique Ningxia Ma"
