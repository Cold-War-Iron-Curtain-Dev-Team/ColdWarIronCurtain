l_english:
 POLITICS_SUN_LI_JEN_DESC:0 "§gSun Li-jen est né à Jinnu, dans la province d'Anhui. Il a brièvement effectué un stage chez Chicago Bridge & Iron Company à Chicago, dans l'Illinois. Mais son patriotisme l'a poussé à changer de carrière et à se lancer dans des études militaires. Sun a décidé qu'il pourrait mieux servir sa nation divisée en tant que soldat plutôt qu'en tant qu'ingénieur. En 1927, il est retourné en Chine et est devenu caporal dans l'Armée révolutionnaire nationale, stationnée à Duyun, dans la province du Guizhou. Il est surtout connu pour son leadership pendant la seconde guerre sino-japonaise et la guerre civile chinoise. Ses exploits militaires lui ont valu le surnom élogieux de « Rommel de l'Orient ». Avec l'aide de la CIA, Sun Li-jen a désormais consolidé son pouvoir au sein de la République de Chine et prévoit de réformer le parti, d'abolir la structure de commandement léniniste et de lutter contre la corruption.§!"
 POLITICS_CHIANG_DESC:0 "§YDirecteur général du Kuomintang, général de classe spéciale des forces armées de la République de Chine§!\n§gChiang Kai-shek, né en 1887 à Fenghua, dans la province du Zhejiang, dans une modeste famille de marchands de sel, a d'abord poursuivi une carrière militaire au Japon avant de retourner en Chine pendant la révolution Xinhai. Il a mené des campagnes contre la dynastie Qing, puis s'est réfugié au Japon pendant le règne de Yuan Shikai. À son retour, il a noué des liens avec la pègre de Shanghai avant de retrouver son mentor Sun Yat-sen à Canton. Chiang s'est ensuite rendu en Union soviétique pour étudier les méthodes politiques et militaires du Parti communiste soviétique. Après la mort de Sun, il s'empare de la direction du KMT à la suite d'un coup d'État contre Wang Jingwei et lance l'Expédition du Nord afin d'unifier la Chine sous la bannière du Kuomintang. Sa tentative de purge du Parti communiste à Shanghai déclenche une guerre civile entre le Kuomintang et le Parti communiste chinois. Malgré des tentatives répétées pour le renverser, Chiang conserve le pouvoir grâce à des manœuvres diplomatiques et des intrigues en coulisses. Ses efforts pour éradiquer les communistes échouèrent lorsqu'il fut kidnappé par Zhang Xueliang en 1936, ce qui conduisit à une trêve connue sous le nom de Second Front uni chinois. Après des années de guerre contre les Japonais, la popularité de Chiang, ainsi que la réputation du Kuomintang, déclinèrent. Il reprit le conflit avec le Parti communiste en 1946, refusant de négocier avec Mao, ce qui plongea à nouveau la Chine dans la guerre.§!"
 POLITICS_ZONGREN_DESC:0 "§YPrésident de la République de Chine, commandant de l'armée d'acier§!\n§gNé dans la province du Guangxi en 1890, Li rejoint le Tongmenghui, le parti révolutionnaire de Sun Yat-sen, en 1910, mais comprend mal les objectifs plus larges de Sun en matière de réforme et de réunification nationale. En 1924, il devint le chef de la clique du Guangxi et, en 1926, il aida le KMT lors de son expédition dans le nord. Cette alliance fut toutefois de courte durée, car il fut expulsé du KMT en 1929.\n\nEn 1937, il rejoignit toutefois le KMT pour repousser l'invasion japonaise en tant que général. Il ne s'impliqua dans la politique du KMT qu'en 1948, lorsqu'il fut élu vice-président de la République de Chine. En janvier 1949, après la démission de Tchang Kaï-chek de la présidence, Zongren devint président de la Chine.§!"
 POLITICS_CHEN_CHENG_DESC:0 "§gChen a occupé le poste de commandant en chef de l'Armée révolutionnaire nationale pendant l'expédition du Nord, les campagnes anticommunistes, la seconde guerre sino-japonaise et la guerre civile contre le PCC. À la fin de la guerre civile, il a été nommé gouverneur de la province de Taïwan, où il a déclaré la loi martiale afin d'établir une forte tête de pont nationaliste sur l'île en cas de défaite de l'armée nationaliste sur le continent. Après la chute de Li Zongren, Chiang Kai-shek reprit la présidence aux côtés de Chen Cheng, qui remplaça Yan Xishan au poste de Premier ministre. Bien qu'il fût un anticommuniste convaincu, un nationaliste et un partisan des politiques de Chiang Kai-shek, il prônait des mesures pacifiques via la privatisation de l'industrie, des réformes agraires et des politiques de plafonnement des loyers afin d'apaiser les tensions entre les paysans et le gouvernement et d'empêcher la propagation du communisme.§!"
 POLITICS_CHEN_CHENG_DESC_DEMOCRATIC:0 "§gAprès la chute de Tchang Kaï-chek, Chen Cheng s'est d'abord retrouvé dans une situation difficile. Compte tenu de ses anciennes fonctions sous le généralissime, il craignait d'être purgé par le gouvernement provisoire. Ce dernier a toutefois reconnu le potentiel de ses politiques et lui a permis de rester en politique pour un avenir imprévisible. Il se trouve désormais à la tête de l'aile conservatrice du Kuomintang, poursuivant des politiques similaires à celles qu'il menait auparavant et prônant une coopération plus étroite avec l'Occident dans leur lutte contre le communisme.§!"
 POLITICS_WELLINGTON_DESC:0 "V. K. Wellington Koo, ou Gu Weijun comme on l'appelle en Chine, est l'un des diplomates et hommes d'État les plus éminents du pays. Il a été représentant de la délégation chinoise à Versailles en 1919. Il a été témoin de la création de la Société des Nations et de l'ONU et a occupé divers postes au sein de plusieurs gouvernements chinois avant 1928, notamment ceux de ministre des Finances, ministre des Affaires étrangères, Premier ministre et ambassadeur auprès des pays occidentaux.\n\nAprès la victoire du Kuomintang contre la clique de Beiyang en 1928, Wellington Koo fut recherché pour être arrêté, mais grâce à la médiation de Zhang Xueliang, il fut autorisé à faire partie du nouveau gouvernement du Kuomintang et reprit ses fonctions diplomatiques. Il quitta finalement le service diplomatique en 1956 pour devenir juge à la Cour internationale de justice de La Haye.\n\nEn 1960, Wellington Koo retourna en Chine et devint une figure importante au sein de la faction Minquan, qui prônait une coopération plus étroite avec l'Occident et la constitutionnalisation de la Chine.§!"
 POLITICS_CHIANG_KUO_MAINLAND_DESC:0 "§gChiang Ching-kuo est né dans la province du Zhejiang, fils aîné issu du premier mariage de Chiang Kai-shek. Il fréquenta l'université Sun Yat-sen à Moscou en 1925, mais fut retenu prisonnier en URSS jusqu'en 1938, date à laquelle il fut autorisé à retourner en Chine et rejoignit le gouvernement de son père à Chongqing. Après la défaite du PCC, il est devenu chef de la police secrète et a été responsable de diverses campagnes contre les cellules communistes. En 1965, il a été promu ministre de la Défense et a gravi les échelons jusqu'au poste de Premier ministre de la République de Chine. À la mort de Chiang Kai-shek, la Chine sera dirigée par lui, mais pour l'instant, on ne sait pas si cet avenir verra la poursuite du régime autoritaire du Kuomintang ou s'il y aura un changement dans la politique chinoise et si la voie sera ouverte à des réformes démocratiques.§!"
 POLITICS_NATIONAL_ASSEMBLY_DESC:0 "§gL'Assemblée nationale, branche législative faisant autorité de la République de Chine, composée du Yuan législatif et du Yuan de contrôle, a assumé l'autorité provisoire de la République à la suite de la démission du gouvernement de Sun Li-jens. L'Assemblée agira en tant qu'instance gouvernementale provisoire et préparera les premières élections nationales à venir depuis la suspension de la Constitution de 1947.§!"
 POLITICS_CHIANG_ARMY_DESC:0 "§gNé dans la province du Chekiang, Chiang était membre du Kuomintang (KMT) et lieutenant de Sun Yat-sen dans la révolution visant à renverser le gouvernement Beiyang et à réunifier la Chine. Cependant, en 1927, avant la fin de l'expédition du Nord, Chiang purgea les communistes au sein du KMT, déclenchant une guerre civile avec le PCC.\nEn 1936, il fut kidnappé par ses propres généraux et contraint de conclure une trêve avec les communistes afin de s'unir contre l'agression japonaise. À la suite de l'incident du pont Marco Polo en 1937, il mobilisa la Chine pour la seconde guerre sino-japonaise. Pendant huit ans, il mena la guerre de résistance contre un ennemi largement supérieur, principalement depuis Chongqing, la capitale de guerre.\nAprès l'échec de l'accord du Double Dix, la guerre civile a repris en 1946. À l'heure actuelle, la NRA est épuisée par huit années de guerre contre l'Empire japonais et le soutien populaire au KMT est au plus bas. Chiang a déjà élaboré des plans d'évacuation vers l'île de Taïwan, au cas où le KMT serait vaincu sur le continent.§!"
 POLITICS_CHIANG_DESC_70s:0 "§gÀ l'issue du conflit final contre le Parti communiste, Tchang Kaï-chek remporta définitivement la bataille pour la Chine et entra dans les livres d'histoire comme le grand défenseur de la nation contre l'impérialisme étranger et le marxisme. Après la victoire du Kuomintang, il utilisa tous les moyens nécessaires pour renforcer son pouvoir sur la Chine et traqua les cellules socialistes restantes avec une force brutale, suspendant les droits et libertés constitutionnels tout en continuant à prétendre respecter les trois principes du peuple du Dr Sun.\n\nBien qu'il ait vaincu tous ses ennemis politiques, le généralissime Tchang Kaï-chek dirige le pays depuis près de 50 ans maintenant et son âge avancé le rend pratiquement incapable de prendre seul des décisions politiques. On ne sait pas combien de temps il restera à la tête de la République, mais il est certain que son héritage et ses actions resteront à jamais gravés dans l'histoire chinoise.§!"
 POLITICS_ZONGREN_ARMY_DESC:0 "§gNé dans la province du Guangxi en 1890, Li rejoint le Tongmenghui, le parti révolutionnaire de Sun Yat-sen, en 1910, mais il comprend alors peu les objectifs plus larges de Sun en matière de réforme et de réunification nationale. En 1924, il devint le chef de la clique du Guangxi et, en 1926, il aida le KMT lors de son expédition dans le nord. Cette alliance fut toutefois de courte durée, car il fut expulsé du KMT en 1929.\nEn 1937, il rejoignit toutefois le KMT pour repousser l'invasion japonaise en tant que général. Il ne s'impliqua dans la politique du KMT qu'en 1948, lorsqu'il fut élu vice-président de la République de Chine. En janvier 1949, après la démission de Tchang Kaï-chek de la présidence, Zongren devint président de la Chine.§!"
 POLITICS_CHI_BAI_CHONGXI_DESC:0 "§gMusulman issu du peuple Hui, Bai Chongxi revendique son ascendance d'une famille de marchands persans qui s'étaient installés dans le Sichuan. Il a fréquenté l'École de formation des cadres militaires du Guangxi, où il a suivi un programme d'études moderne et novateur dans le cadre d'une réforme plus large de l'armée chinoise. Ces connaissances de pointe lui ont été très utiles lorsqu'il s'est fait un nom au sein d'une milice étudiante du Guangxi, avant de gravir les échelons pour devenir l'un des généraux les plus influents de l'ère des seigneurs de la guerre. Fidèle partisan de la vision de Sun Yat-sen pour une Chine démocratique, il faisait partie du triumvirat connu sous le nom de « nouvelle clique du Guangxi », qui cherchait à renverser le gouvernement régional du seigneur de guerre Lu Rongting.\nAvec Li Zongren, il a combattu le gouvernement de Chiang Kai-shek lors de la guerre des Plaines centrales de 1930, mais a finalement rejoint le généralissime pour défendre le pays contre l'agression japonaise et communiste. Chongxi a été le premier ministre de la Défense de la République de Chine de 1946 à 1948 et était responsable de la défense du centre et du sud de la Chine à la fin de la guerre civile chinoise.§!"
 POLITICS_CHI_HSUEH_YUEH_DESC:0 "§gNé dans une famille paysanne hakka à Shaoguan, dans la province du Guangdong, Hsueh Yueh rejoint en 1909 la société secrète du Dr Sun Yat-sen au Japon, la Tongmenghui. À son retour en Chine, il fréquente l'Académie militaire de Baoding, mais décide de se rendre dans le Guangdong pour rejoindre volontairement l'armée nouvellement créée par Sun Yat-sen et Chen Jiongming avec le grade de capitaine.\nPendant l'expédition du Nord, il fut l'un des commandants nationalistes les plus efficaces, mais s'opposa plus tard à Tchang Kaï-chek pendant la guerre des Plaines centrales, aux côtés de la nouvelle clique du Guangxi. Après leur défaite, Hsueh Yueh fut réintégré dans l'Armée nationale révolutionnaire en tant que commandant de diverses armées participant aux batailles de Shanghai, du Henan, de Wuhan et de Changde.\nAu cours de sa collaboration avec Claire Lee Chennault, il reçut le surnom de « Patton de l'Asie ».§!"
 POLITICS_CHI_SUN_LI_JEN_ARMY_DESC:0 "§gSun Li-jen est né à Jinnu, dans la province d'Anhui. Il a brièvement effectué un stage chez Chicago Bridge & Iron Company à Chicago, dans l'Illinois, mais son patriotisme l'a poussé à changer de carrière et à se lancer dans des études militaires. Sun a décidé qu'il pourrait mieux servir sa nation divisée en tant que soldat plutôt qu'en tant qu'ingénieur. En 1927, il est retourné en Chine et est devenu caporal dans l'Armée révolutionnaire nationale, stationnée à Duyun, dans la province du Guizhou. Il était surtout connu pour son leadership pendant la seconde guerre sino-japonaise et la guerre civile chinoise. Ses exploits militaires lui ont valu le surnom élogieux de « Rommel de l'Orient ».§!"
 POLITICS_CHI_HU_ZONGNAN_DESC:0 "§gHu Zongnan était l'un des protégés les plus fidèles de Tchang Kaï-chek et un jeune commandant exemplaire pendant l'expédition du Nord et la seconde guerre sino-japonaise. Il participa aux campagnes d'extermination des communistes menées par Tchang, se vit confier le commandement de la première armée en 1936 et prit part aux batailles de Shanghai et de Wuhan.\nCependant, la gloire de Hu sur les champs de bataille fut de courte durée après que Chiang Kai-shek lui eut confié le commandement de plus de 400 000 soldats du Kuomintang afin de bloquer la base communiste dans le Shaanxi. Hu Zongnan aurait préféré mourir pour son pays sur les champs de bataille en combattant les envahisseurs japonais. Mais en tant que soldat professionnel, il a consciencieusement exécuté l'ordre donné par Chiang Kai-shek en restant à son poste pendant le reste de la guerre.\nAprès la Seconde Guerre mondiale, Hu Zongnan a combattu le PCC dans la région du Shaanxi et a même réussi à s'emparer de la base communiste de Yan'an. Cependant, en raison du transfert de près de la moitié de ses troupes sur ordre de Chiang Kai-Shek, Zongnan ne put conserver la région et fut contraint de battre en retraite.§!"
 POLITICS_CHI_GU_ZHUTONG_DESC:0 "§gGu est né à Lianshui, dans la province du Jiangsu. Au cours de sa jeunesse, il a fréquenté de nombreuses académies militaires, telles que celles de Baoding et de Whampoa, où il a occupé le poste d'instructeur.\nIl est devenu commandant après le début de l'expédition du Nord et a été promu à plusieurs reprises après la création du gouvernement de Nanjing. Il a participé à diverses opérations, telles que les campagnes d'encerclement contre le PCC, ce qui lui a valu l'Ordre du Ciel bleu et du Soleil blanc en 1941 après avoir détruit un important contingent de troupes communistes.\nEn 1946, il occupait le poste de commandant en chef de la NRA à Zhengzhou et était chargé de lancer des offensives contre les zones contrôlées par les communistes dans la province du Shandong. En 1947, il perdit le Shandong au profit de l'APL et fut relevé de son commandement, puis nommé chef d'état-major par Tchang Kaï-chek."
 POLITICS_CHI_XIONG_SHIHUI_DESC:0 "§gAprès avoir obtenu son diplôme de l'école élémentaire militaire du Jiangxi, Xiong Shihui entre en 1911 au quatrième collège militaire de Nanjing et rejoint à cette époque le Tongmenghui. Après avoir obtenu son diplôme en 1916, il se rendit au Yunnan et devint commandant de bataillon avant de quitter la Chine pour étudier au Japon. À son retour en 1924, il rejoignit le KMT et resta à Guangzhou pour enseigner à l'Académie militaire locale de la NRA et participa à l'expédition du Nord.\nAu cours des années suivantes, il a servi au sein du gouvernement provincial du Jiangxi et en tant que chef d'état-major de la Commission des affaires militaires. En 1935, il a été nommé cinquième membre du Comité exécutif central du Kuomintang et a été chargé de la défense de la province du Jiangxi jusqu'à sa démission en 1942. Il revint en 1945 et fut réélu membre du Comité exécutif central du Kuomintang, mais rejoignit également le Comité politique du Bureau et fut chargé de la réquisition du territoire mandchou effondré. Il occupa ce poste jusqu'en août de l'année suivante, puis devint en décembre membre du Comité consultatif stratégique du gouvernement national.§!"
 POLITICS_CHI_LIU_YUZHANG_DESC:0 "§gLiu Yuzhang s'est inscrit dans la quatrième promotion de cadets en 1925. Parmi ses camarades de classe les plus connus figuraient Lin Biao, Hu Lien et Zhang Lingfu. Après avoir obtenu son diplôme, il a participé à l'expédition du Nord et à la guerre des Plaines centrales, puis a été promu commandant du 5e régiment de la 2e division lorsque la guerre sino-japonaise a éclaté.\nLiu Yuzhang avait déjà affronté les Japonais sur le champ de bataille lors de la défense de la Grande Muraille en 1933, au cours de laquelle il avait été légèrement blessé. Pendant la guerre, il s'était distingué lors des batailles de Taierzhuang, Wuhan et Changsha, et avait même mené des troupes au Vietnam pour accepter la reddition de l'armée japonaise stationnée dans ce pays.\nAprès la fin de l'occupation soviétique de la Mandchourie en 1946, Liu Yuzhang défendit avec succès Shenyang contre son ancien camarade de classe Lin Biao, membre de l'Armée populaire de libération, ce qui lui valut le grade de lieutenant général. Cependant, après la lutte acharnée menée par le Kuomintang pour conserver la Mandchourie face à l'Armée populaire de libération pendant la campagne de Liaohsi, il se retira en Mandchourie et fut nommé commandant de la zone de défense de Kinmen.§!"
 POLITICS_CHI_HU_LIEN_DESC:0 "§gHu Lien est diplômé de l'Académie militaire de Whampoa, tout comme d'autres généraux célèbres tels que Lin Biao, Du Yuming et Li Yuzhang. Il a servi dans l'Armée nationale révolutionnaire en tant que général pendant l'expédition du Nord, les campagnes d'encerclement, la guerre de résistance et la guerre civile. Il était stationné dans le centre et l'est de la Chine pendant la guerre civile et a même mené avec succès des campagnes contre les communistes. Son expérience pourrait s'avérer précieuse pour de futurs conflits, qu'ils se déroulent en Chine ou à l'étranger.§!"
 POLITICS_YINQING_DESC:0 "§gHe Yingqin est né dans la province impériale du Guizhou en 1890 et a passé la majeure partie de sa jeunesse dans des académies militaires. Il a également été choisi par le ministère de la Défense du gouvernement Qing pour étudier au Japon, où il a rencontré Chiang Kai-shek et rejoint la société secrète anti-Qing du Dr Sun Yat-sen, le Tongmenghui. Il est retourné en Chine après le soulèvement de Wuchan en 1911 et a finalement obtenu son diplôme en 1916, mais a été expulsé de sa province natale du Guizhou vers le Yunnan. Après la création de l'Académie militaire de Whampoa et de l'Armée révolutionnaire nationale en 1924, il devint instructeur général de l'Académie et servit comme commandant de division pendant la révolte de Chen Jiongming à Liangguang. Il continua à diriger des troupes contre la clique de Beiyang pendant l'expédition du Nord. Il soutint la position anticommuniste de Tchang Kaï-chek après le massacre de Shanghai et continua à gravir les échelons au sein du gouvernement du Kuomintang. Il conserva son poste de chef d'état-major des armées du KMT, mais fut remplacé en 1944 par Chen Cheng, ami de longue date de Chiang Kai-shek. Il fut toutefois choisi comme représentant du gouvernement chinois pour la cérémonie du 9 septembre à Nanjing, au cours de laquelle il accepta les conditions de capitulation japonaises, marquant ainsi l'apogée de sa carrière. Lorsque Chiang Kai-shek démissionna de son poste de président, il lui confia la tâche de contenir le pouvoir et l'influence du nouveau président Li Zongren en le nommant chef de l'Exécutif Yuan et ministre de la Défense.§!"
 POLITICS_XISHAN_DESC:0 "§gYan Xishan est né dans la province du Shanxi en 1883 et a grandi sous la garde de sa grand-mère, après le décès de sa mère. Dès son plus jeune âge, il a commencé à étudier les classiques confucéens et a finalement rejoint l'académie militaire de Taiyuan dans le Shanxi. Yan, aux côtés d'autres jeunes talents prometteurs, a été envoyé étudier à Tokyo où il a été fasciné par les efforts d'occidentalisation du Japon, convaincu que la Chine devait prendre des mesures similaires pour ne pas prendre de retard sur la scène internationale. Après le déclenchement de la révolution Xinhai, il est retourné en Chine et s'est joint à la lutte contre les Qing. Il a finalement consolidé son pouvoir en tant que gouverneur du Shanxi après la mort de Yuan Shikai. Sous son règne, le Shanxi a connu des progrès incroyables dans les domaines de l'agriculture, de la santé et de l'éducation, ainsi que dans le domaine de l'idéologie propre à Yan, appelée « pensée Yan Xishan », qui combine de nouveaux éléments du néo-confucianisme tels que l'autocritique et le développement personnel. Pendant la Seconde Guerre mondiale, il a servi comme commandant dans le Shanxi contre les Japonais, mais a secrètement intensifié ses opérations contre le mouvement communiste local. Après la chute de Taiyuan aux mains du PCC, il réussit à persuader le président par intérim Li Zongren de former un nouveau gouvernement comprenant les partisans de Chiang Kai-shek, avec Yan à la tête du Yuan exécutif, jouant le rôle de médiateur entre les deux camps. Malgré ses efforts, Li et Chiang continuèrent leur rivalité. Yan reste pour l'instant Premier ministre, mais il est certain que sa démission ne tardera pas.§!"
 POLITICS_ZHANG_FAKUI_DESC:0 "§gAprès la capitulation japonaise, Zhang est resté à Hong Kong, supervisant le rétablissement de l'autorité britannique, ce qui lui a valu d'être nommé Commandeur de l'Ordre de l'Empire britannique. Il a ensuite été nommé gouverneur de la province du Guangdong, mais a été démis de ses fonctions après la démission de Tchang Kaï-chek de la présidence. Zhang occupe actuellement le poste d'administrateur militaire en chef de l'île de Hainan et prépare l'île à d'éventuelles invasions, au cas où les communistes prendraient le contrôle de la Chine continentale.§!"
 POLITICS_ZHAO_HENGTI_ARMY_DESC:0 "§gBien qu'il ait été évincé du pouvoir en 1926 par Tang Shengzhi, Zhao Hengti est sorti relativement rapidement de sa retraite pour occuper le poste de président de l'Assemblée provisoire du Hunan pendant la seconde guerre sino-japonaise. Après la guerre, il a rejoint le Kuomintang et est devenu un proche allié de Chiang Kai-shek. Zhao est revenu à la politique locale dans le Hunan et espère consolider à nouveau son pouvoir en tant que gouverneur.§!"
 POLITICS_ZHU_SHAOLIANG_DESC:0 "§gZhu Shaoliang a grandi dans la province du Fujian, avant de fréquenter brièvement les académies militaires japonaises. Il s'est allié à Sun Yat-sen en 1910 et a rejoint les révolutionnaires à Wuchang l'année suivante. Pendant la Seconde Guerre mondiale, il a occupé le poste de vice-président de la Commission des affaires militaires du gouvernement national, avant de s'installer à Chongqing en 1948. En 1949, le ministère de la Défense nationale a nommé Zhu gouverneur des provinces du Fujian et du Jiangxi, fonction qu'il occupe actuellement.§!"
 POLITICS_TANG_ENBO_DESC:0 "§gLa réputation de Tang a été fortement ternie pendant la guerre anti-japonaise, puisqu'il a perdu plus de 37 villes en 36 jours lors des offensives japonaises dans le sud de la Chine en 1944. Après la guerre, les communistes ont tenté de rallier Tang à leur cause, mais celui-ci a finalement été poussé par sa concubine à rester fidèle à Tchang Kaï-chek. En conséquence, Tang a rapporté à Chiang Kai-shek les plans de Chen Yi visant à faire défection au profit des communistes, ce qui a conduit à l'arrestation de Chen. Cependant, cela a finalement conduit Chiang Kai-shek à perdre toute confiance en Tang Enbo, d'autant plus que des découvertes récentes montrent que Tang prévoyait de s'enfuir au Japon après la bataille de Shanghai en 1937.§!"
 POLITICS_LI_PINXIAN_DESC:0 "§gLi rejoint la NRA en 1926 et mène ses troupes à l'occupation de tout le Hunan, contribuant ainsi à la défaite de l'armée de Wu Peifu dans le Hubei pendant l'expédition du Nord. Après avoir rejoint la nouvelle clique du Guangxi en 1928 et un bref exil à Hong Kong, Li est finalement vaincu lors de la guerre des Plaines centrales, mais continue par la suite à occuper des postes militaires importants dans le Guangxi. Pendant la Seconde Guerre mondiale, il fut déployé à Shanghai, Xuzhou, Wuhan et Changsha, mais continua à lutter contre le Parti communiste chinois en réprimant la Nouvelle quatrième armée. Après la capitulation japonaise, Li devint membre du Comité exécutif central du Kuomintang et occupa brièvement le poste de président du gouvernement provincial du Guangxi avant que Li Zongren ne revienne dans le Guangxi après sa démission.§!"
 POLITICS_YANG_SEN_DESC:0 "§gAvant de rejoindre l'Armée révolutionnaire nationale en 1926, Yang Sen a servi dans les rangs de l'armée du Sichuan en tant qu'allié proche du célèbre seigneur de guerre du Zhili, Wu Peifu. Bien qu'il ait été rétrogradé en raison de ses liens avec Wu, il est resté fidèle au Kuomintang et a finalement été nommé lieutenant général en 1936. Pendant la Seconde Guerre mondiale, il a participé aux campagnes de Shanghai et a été promu à la tête du 27e groupe d'armées. Après la guerre, il occupa divers postes importants, notamment celui de membre du Yuan législatif, de l'Assemblée nationale, ainsi que son poste actuel de maire de Chongqing.§!"
 POLITICS_CHEN_JITANG_DESC:0 "§gLes relations entre Chen Jitang et le gouvernement central ont été gravement compromises lors du complot du Guangxi à la fin de l'année 1936. Alors que le complot visant à renverser Tchang Kaï-chek a été abandonné en 1936, Chen s'est enfui à Hong Kong, mais il est revenu plus tard pour rejoindre le gouvernement national dans sa lutte contre le Japon. Après la guerre, il a été nommé à son poste actuel de gouverneur de Hainan.§!"
 POLITICS_JIANG_DINGWEN_DESC:0 "§gJiang Dingwen se retira à Shanghai après avoir démissionné à l'issue de la bataille du Henan en 1944. Après la guerre, il fit campagne pour obtenir le mandat de Zhuji à la première Assemblée nationale, qu'il remporta finalement en 1948, mais fut également nommé conseiller stratégique du président de la République.§!"
 POLITICS_MA_HONGKUI_DESC:0 "§gMa est né le 14 mars 1892 dans le village de Hanchiachi, dans la région du Gansu. Il était autrefois un allié du chef du Guominjun, Feng Yuxiang, mais il a trahi Feng et s'est allié à Chiang Kai-shek pendant la guerre des Plaines centrales. Il est ensuite devenu gouverneur de la province du Ningxia. Ma est connu pour ses positions anticommunistes extrêmes et a la réputation de traiter sévèrement les communistes sur son territoire. Les observateurs extérieurs le considèrent comme l'un de nos généraux les plus efficaces.§!"
 POLITICS_MA_HONGBIN_DESC:0 "§gMalgré plusieurs revers politiques dans le Ningxia, Ma Hongbin a acquis une grande popularité grâce à ses efforts défensifs à Suiyuan, empêchant les Japonais d'entrer dans le Ningxia et de créer un gouvernement fantoche musulman hui. Après la capitulation japonaise, il est devenu conseiller principal au sein du quartier général de l'armée du Nord-Ouest.§!"
 POLITICS_LU_HAN_DESC:0 "§gLu Han a grandi dans le Yunnan, où il a étudié à l'Académie militaire du Yunnan et servi sous les ordres de Long Yun dans le Yunnan après la chute de Tang Jiyao en 1927. Pendant la deuxième guerre sino-japonaise, il a commandé la 60e armée (plus tard la 30e armée) de l'ancienne Armée révolutionnaire nationale et a été déployé dans le Hunan et le Shandong. Après la guerre, il a remplacé son ancien supérieur Long Yun au poste de gouverneur du Yunnan avec l'aide de Du Yuming. Depuis février 1949, le général Lun a ignoré à plusieurs reprises les ordres de Nanjing, perdant ainsi la confiance du généralissime. Grâce aux efforts de l'ancien président Li Zongren, Lu a pu être convaincu de rester fidèle au Kuomintang en lui promettant une plus grande autonomie politique dans la Chine d'après-guerre.§!"
 POLITICS_CHI_DING_DELONG_DESC:0 "§gDing Delong est né dans la province du Hunan à la fin de la dynastie Qing. À l'âge de 20 ans, Ding s'est inscrit dans une académie militaire qui a ensuite fusionné pour devenir l'Académie militaire de Whampoa. En 1931, Ding a rejoint l'Armée nationale révolutionnaire et a mené une campagne près du Hunan contre les seigneurs de guerre locaux et les forces communistes. Pendant la guerre avec le Japon, Ding a combattu à Shanghai, dans la province du Henan et dans la ville de Wuhan. Vers la fin de la guerre avec le Japon, Ding a été promu lieutenant-général et a mené des campagnes contre les partisans communistes dans le Hunan. Lorsque Cheng Qian et de nombreux autres généraux du Hunan ont choisi de faire défection, Ding a été l'un des rares Hunanais à ne pas suivre leur exemple et a été nommé gouverneur de sa province natale après la fin de la guerre civile. Cependant, sa loyauté envers Nankin peut être remise en question, car il a montré qu'il ne se souciait que de sa province.§!"
 POLITICS_MA_BUFANG_NORMAL_DESC:0 "§gMa Bufang est né en 1903 dans le Gansu. Il est le fils de Ma Qi, fondateur de l'armée musulmane Ningxia du Qinghai au lendemain de la révolution Xinhai. Ma s'est rangé du côté de Tchang Kaï-chek et du Kuomintang après le succès de l'expédition du Nord. La position farouchement anticommuniste de Ma et sa loyauté envers le Kuomintang ont été prouvées à maintes reprises, comme en témoignent ses opérations militaires contre les communistes au début des années 1930 et son refus de multiples offres de défection japonaises. Sa loyauté inconditionnelle envers le Kuomintang, bien qu'il soit Hui, a fait de lui l'un des hommes de confiance de Chiang Kai-shek. En 1945, Bufang a été nommé au comité central du Kuomintang et a mené avec succès la lutte contre les Ouïghours révoltés, en plus de combattre le Parti communiste chinois pendant la guerre civile chinoise.§!"
 POLITICS_CHEN_QIAN_NORMAL_DESC:0 "§gCheng Qian a fait ses études au Japon où il a rencontré le Dr Sun Yat-sen, rejoignant sa cause relativement tôt. Il a occupé le poste de vice-ministre de la Guerre sous Sun Yat-sen et s'est rapidement illustré au sein du Kuomintang, après l'expédition du Nord. Il a été élu membre du Comité exécutif central du Kuomintang et a occupé de nombreux postes militaires importants pendant la deuxième guerre sino-japonaise. En 1948, il se présente à la vice-présidence de la République, mais est battu par le seigneur de guerre du Guangxi, Li Zongren. Chiang Kai-shek lui promet le poste de gouverneur du Hunan dans la Chine d'après-guerre, à condition qu'il ne passe pas du côté du Parti communiste.§!"
 POLITICS_LIU_WENHUI_NORMAL_DESC:0 "§gLa relation entre Liu Wenhui et Chiang Kai-shek a été aussi instable que les provinces qu'il a gouvernées au cours des 20 dernières années. Liu a rejoint le Kuomintang en 1926 et a commandé la 24e armée de l'Armée nationale révolutionnaire dans le Sichuan. Il a finalement été repoussé dans la province de Xikang par son neveu, le général Liu Xiang, où il a continué à saboter le gouvernement central en permettant aux troupes communistes de traverser Xikang sans être inquiétées. Chiang n'avait cependant pas les ressources politiques nécessaires pour prendre des mesures contre Liu. Pendant la guerre de résistance, Liu s'est assuré que ses forces participent le moins possible aux combats, ignorant souvent les ordres de Nanjing. Liu reste indigne de confiance aux yeux de Chiang, mais son autonomie locale et son influence rendent difficile le remplacement de son administration.§!"
 POLITICS_YU_HUNG_CHUN_DESC:0 "§gYu Hongjun, également connu sous le nom d'O. K. Yui, a passé toute sa carrière politique au sein du KMT. Le gouvernement nationaliste l'a nommé maire de Shanghai en 1937, poste qu'il a utilisé pour négocier la paix entre les forces chinoises et japonaises juste avant la bataille de Shanghai, qui s'est finalement soldée par un échec. Après la guerre civile chinoise et la grande retraite du gouvernement du Kuomintang à Taïwan, il a occupé le poste de quatrième président du gouvernement provincial de Taïwan de la République de Chine jusqu'à sa récente promotion au poste de Premier ministre de la République sous la présidence de Tchang Kaï-chek.§!"
 POLITICS_WU_GUOZHEN_DESC:0 "§gWu Guozhen a commencé sa carrière politique à l'université de Princeton, où il a obtenu un doctorat en sciences politiques en 1926. À son retour en Chine la même année, il a gravi les échelons à Hunan sous le règne du seigneur de guerre local Hsia Tou-yin. Après l'occupation japonaise du Hunan en 1939, Wu rejoint le gouvernement de Chiang Kai-shek à Chungking et occupe divers postes politiques importants jusqu'à la Grande Retraite, notamment celui de maire de Chungking, de Shanghai et de vice-ministre des Affaires étrangères. À la suite de la retraite à Taïwan, Wu a occupé le poste de gouverneur de Taïwan, tentant d'apporter une plus grande autonomie et moins de brutalité policière au peuple taïwanais. Wu a été contesté par les membres conservateurs du Kuomintang, ce qui a finalement conduit à son renvoi du gouvernement et du Kuomintang. Aujourd'hui, avec la suspension de l'ancien gouvernement, Wu voit à nouveau la possibilité pour Taïwan de s'engager sur une voie libérale, pacifique et modérément anticommuniste.§!"
 POLITICS_KUO_LIANG_DESC:0 "§gKuo Ting-liang est l'un des rares généraux à avoir fait ses études au Virginia Military Institute, où il a finalement rencontré son futur subordonné Sun Li-jen. Ensemble, ils ont combattu l'armée japonaise lors des campagnes en Birmanie et ont poussé à la mise en place de réformes à l'américaine dans la République après la perte de la Chine continentale. Malgré son opposition à Chiang Kai-shek, Kuo reste un anticommuniste dans l'âme, mais il est prêt à écouter les conseils et les ordres donnés par les États-Unis d'Amérique. On peut supposer sans risque que, sous sa vice-présidence, il déploiera d'innombrables efforts pour améliorer et maintenir les relations avec Washington et reconsidérera la reconquête du continent chinois par la force militaire.§!"
 POLITICS_XISHAN_JUNTA_DESC:0 "§gÀ la suite des troubles liés à la Grande Retraite du gouvernement nationaliste vers Taïwan, Yan Xishan fut finalement démis de ses fonctions de Premier ministre par Tchang Kaï-chek après la chute politique de Li Zongren. Yan s'attendait à passer le reste de sa vie loin de la politique, séparé de sa chère province natale du Shanxi pour une durée indéterminée. Cependant, lorsque le général Sun Li-jen fit son entrée dans le palais présidentiel de Taipei et destitua le gouvernement de Chiang Kai-shek, tout changea à nouveau pour Yan. Le gouvernement provisoire décida de le nommer Premier ministre temporaire de la République jusqu'à la fin du régime militaire, estimant que ses talents de médiateur entre Li Zongren et Chiang Kai-shek pendant la guerre civile pourraient s'avérer efficaces pour l'intégration de l'ancien gouvernement de Chiang Kai-shek. Peut-être que cela sera l'occasion pour Yan d'entamer une carrière politique qui pourrait finalement le conduire à retourner dans le Shanxi, que ce soit par la voie diplomatique ou par la guerre.§!"
 POLITICS_WANG_YUN_WU_DESC:0 "§gConsidéré par divers cercles chinois et étrangers comme l'un des plus grands érudits modernes de Chine, M. Wang a occupé des postes clés dans des institutions politiques et éducatives, notamment à l'Institut national chinois de Woosung, dans divers journaux et agences de presse, au ministère de l'Éducation et des Finances ainsi qu'au Yuan exécutif. Wang, fervent défenseur de la tradition, de la culture et du confucianisme chinois, s'est opposé aux communistes pendant la révolution chinoise, a décidé de se relancer dans la politique et a gravi les échelons jusqu'à intégrer le gouvernement conservateur nouvellement élu de la République de Chine.§!"
 POLITICS_ZHU_JIAHUA_DESC:0 "§gConnu et respecté par de nombreux membres du parti comme l'homme responsable du déménagement de l'Académie Sinica, Zhu Jiahua est un homme politique influent au sein du Kuomintang. Il occupe le poste de président de l'Académie Sinica depuis 1940 et a fondé divers projets permettant à des étudiants chinois d'étudier aux États-Unis, considérant le paysage éducatif et universitaire américain comme une étape nécessaire vers une éducation efficace pour les futurs politiciens et universitaires. Ses projets ont d'abord été désapprouvés par Chiang Kai-shek, mais maintenant que celui-ci n'est plus au pouvoir, Zhu est revenu dans la sphère politique et occupe actuellement le poste de Premier ministre de la République de Chine au sein du gouvernement conservateur, avec pour objectif de poursuivre ses anciennes politiques à l'Academia Sinica.§!"
 POLITICS_CHANG_LI_SHENG_DESC:0 "§gChang a passé sa jeunesse en France dans le cadre du programme chinois d'études et de travail, où il s'est ensuite inscrit à l'université de Paris et s'est spécialisé en sciences politiques. C'est à cette époque qu'il a rencontré le jeune Zhou Enlai, qui a tenté de le convaincre de rejoindre le Parti communiste, ce que Chang a finalement refusé. Après son retour en Chine, il a rejoint le Kuomintang en 1924 et s'est rallié au général Chen Cheng pendant la Seconde Guerre mondiale, lançant des campagnes contre le PCC. Au cours des dernières années du règne de Tchang Kaï-chek, il a contribué aux programmes de réforme agraire et économique de Chen Cheng. Après la destitution de Tchang, il a commencé à étudier des programmes susceptibles de garantir l'autonomie culturelle de la population taïwanaise autochtone et une gouvernance constitutionnelle, qu'il espère mettre en œuvre et renforcer au cours de son mandat.§!"
 POLITICS_ZHANG_JUNMAI_DESC:0 "§gChang a passé sa jeunesse en France dans le cadre du programme chinois d'études et de travail, où il s'est ensuite inscrit à l'université de Paris et s'est spécialisé en sciences politiques. C'est à cette époque qu'il a rencontré le jeune Zhou Enlai, qui a tenté de le convaincre de rejoindre le Parti communiste, ce que Chang a finalement refusé. Après son retour en Chine, il a rejoint le Kuomintang en 1924 et s'est rallié au général Chen Cheng pendant la Seconde Guerre mondiale, lançant des campagnes contre le PCC. Au cours des dernières années du règne de Tchang Kaï-chek, il a contribué aux programmes de réforme agraire et économique de Chen Cheng. Après la destitution de Tchang, il a commencé à étudier des programmes susceptibles de garantir l'autonomie culturelle de la population taïwanaise autochtone et une gouvernance constitutionnelle, qu'il espère mettre en œuvre et renforcer au cours de son mandat.§!"
 POLITICS_SUN_FO_DESC:0 "§gSun Fo, également connu sous le nom de Zhesheng, est sans doute l'un des membres les plus éminents et les plus emblématiques du Kuomintang. Fils de Sun Yat-sen, père de la révolution de 1911, père et premier président de la République et fondateur du Kuomintang, Sun Fo a un parcours familial assez impressionnant. Ayant servi dans le gouvernement nationaliste sous son père, mais aussi sous Chiang Kai-shek dans divers ministères et à d'autres postes, il est devenu l'un des plus hauts fonctionnaires du Kuomintang. Cependant, en raison de ses convictions libérales et nationalistes, inspirées par son père, il a eu de multiples désaccords et différends avec l'ancien président Chiang Kai-shek sur la question du gouvernement constitutionnel et des négociations avec le Parti communiste face à l'agression japonaise. Après le départ du gouvernement nationaliste à Taïwan, il quitta le pays en 1952, mais comme beaucoup d'autres intellectuels libéraux, il revint après la destitution de Chiang et devint immédiatement le candidat favori du camp social-libéral au sein du Kuomintang.§!"
 POLITICS_LEI_CHEN_DESC:0 "§gAvant de s'installer à Taïwan avec le gouvernement du Kuomintang, Lei Chen a joué un rôle important dans la réorganisation du Parti de la jeunesse chinoise et du Parti socialiste démocratique chinois lors de la session de l'Assemblée nationale de 1946 et des premières élections législatives de 1947. Avant même son départ pour Taïwan, il avait préparé, avec Hu Shi, Wang Shiije et Hang Liwu, la publication du journal « Free China », qui fut toutefois retardée en raison de la traversée du Yangtsé par les communistes. Tout en entretenant au départ de bonnes relations avec Tchang Kaï-chek et en soutenant ses projets politiques, Lei critiquait les mesures autoritaires du gouvernement. Il a été démis de ses fonctions de conseiller politique du président par Chiang Kai-shek et risquait d'être expulsé du Kuomintang. Avec la destitution du généralissime et le retour d'un gouvernement civil, Lei Chen a remporté les récentes élections à la tête du Parti démocratique chinois qu'il venait de fonder. Bien que son parti ne détienne pas la majorité absolue, la présidence de Lei devrait entraîner des changements fondamentaux dans la structure gouvernementale de la République de Chine.§!"
