 International_Diplomacy_category:0 "Diplomatie internationale"
 International_Diplomacy_category_desc:0 "La Chine était autrefois le centre du monde, car tous les pays venaient lui rendre hommage. Aujourd'hui, les temps changent rapidement et nous avons perdu notre statut prestigieux au profit des puissances occidentales. Que nous souhaitions mener des politiques anticolonialistes ou collaborer avec elles, nous devons nous assurer de laisser notre empreinte sur le monde grâce à notre influence et à notre puissance croissantes. Notre place dans le monde nous ouvrira de nouvelles opportunités à l'avenir."
