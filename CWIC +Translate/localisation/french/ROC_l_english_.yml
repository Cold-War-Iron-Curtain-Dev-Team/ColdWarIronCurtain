 text_help_title_loc:0 "Explication de l'interface graphique"
 text_help_loc:0 "§gCette interface graphique personnalisée vous fournit des informations essentielles sur la situation actuelle en Chine. Elle affiche toutes les régions concernées du pays, y compris le territoire actuellement sous le contrôle du Kuomintang, ainsi que§! §Gles régions indépendantes§! §gcomme le Tibet et§! §Rles régions alignées sur l'Union soviétique§! §gtelles que la Mandchourie, la Mongolie et le Xinjiang. Alors que la majeure partie de la Chine centrale est sous§! §BContrôle principal du KMT§!, §gles régions restantes sont dominées par§! §CClans de seigneurs de guerre locaux§!, §gqui ont pris le pouvoir à la suite de la guerre civile. Ces clans jouissent d’une grande autonomie au sein de la République, ce qui est représenté par des modificateurs locaux, infligeant§! §Rdes malus au recrutement et à la construction§!. §gCes cliques peuvent éventuellement être intégrées à la structure administrative centrale de la République, à condition que leur loyauté envers le gouvernement central soit suffisamment élevée. Les changements de loyauté peuvent être effectués via§! §Yles orientations nationales et les décisions§!. §gSi la loyauté d'une clique venait à chuter au-delà d'un certain seuil, cela provoquerait d'importants conflits politiques internes et constituerait une menace pour la stabilité et le soutien à la guerre.§!"
