 KMT_Taiwan_60s_prepare_operation_national_glory:0 "Préparer l'opération « National Glory »"
 KMT_70s_Expand_Terms:0 "Prolonger le mandat de Tchang Kaï-chek"
 KMT_70s_Expand_Terms_desc:0 "Si le pays souhaite véritablement prospérer et être libre, il a encore besoin des conseils de Tchang Kaï-chek et du Kuomintang. Nous ne pouvons pas prendre le risque de voir des menaces constitutionnelles, telles que d'autres partis ou des élections, remettre en cause la position du Généralissime. Nous présenterons au Yuan législatif une proposition visant à prolonger une nouvelle fois le mandat de Tchang Kaï-chek afin de garantir que le pays ne s'écarte pas de la bonne voie."
 KMT_70s_Call_New_Legislative_Elections:0 "Remaniement au sein du Yuan législatif"
 KMT_70s_Call_New_Legislative_Elections_desc:0 "Si nous avons organisé quelques élections de façade au cours des dernières décennies, nous sommes aujourd’hui confrontés au problème suivant : nos proches alliés au sein du Yuan législatif, fidèles à Chiang et à son gouvernement, disparaissent peu à peu, car la plupart d’entre eux sont des vétérans et des membres qui ont rejoint le parti pendant la décennie de Nankin. Nous devons procéder à un remaniement de cette institution, mais il faut s’attendre à ce que tous les nouveaux élus ne partagent pas les mêmes opinions autoritaires et intransigeantes."
 KMT_70s_Appoint_Chiang_Ching_Kuo_PM:0 "Nommer Chiang Ching Kuo Premier ministre"
 KMT_70s_Appoint_Chiang_Ching_Kuo_PM_desc:0 "L'âge avancé de Tchang Kaï-chek rend de plus en plus difficile l'exercice du pouvoir en Chine. Alors qu'il est déjà dans le coma depuis plus de six mois, il apparaît clairement qu'il ne peut plus gouverner seul. Le généralissime prépare depuis des décennies son fils, Tchang Ching-Kuo, à la présidence et a décidé que, compte tenu de son état de santé précaire, celui-ci devrait devenir Premier ministre de la République de Chine."
 KMT_70s_Expand_KMT_Influence_Private_Sector:0 "Étendre l'influence du KMT dans le secteur privé"
 KMT_70s_Expand_KMT_Influence_Private_Sector_desc:0 "Le gouvernement doit nouer des relations étroites avec le secteur privé, car nous avons besoin d'une plus grande représentation des entreprises dans l'élaboration des politiques, l'économie chinoise s'orientant actuellement vers des secteurs plus complexes, à forte intensité de capital et à forte intensité technologique."
 KMT_70s_sideline_pro_democratic_intellectuals:0 "Surveiller les intellectuels pro-démocratiques"
 KMT_70s_sideline_pro_democratic_intellectuals_desc:0 "Au cours des dernières années, de nombreux intellectuels non alignés et aux idées libérales ont accédé à des postes clés au sein de l'administration locale et des établissements d'enseignement. Bien qu'il ne soit pas possible de les démettre directement de leurs fonctions, nous pouvons mettre en place diverses mesures de surveillance à leur égard afin de nous assurer qu'ils ne constituent pas une menace politique pour l'État."
 KMT_70s_Deal_with_CCP_remnants:0 "Le sort du Parti communiste"
 KMT_70s_Deal_with_CCP_remnants_desc:0 "Après notre victoire finale sur le PCC, la plupart de ses dirigeants ont été jugés ces deux dernières années. Il est désormais temps d'appliquer les sanctions. L'exécution de Mao Zedong marquera le triomphe symbolique du Kuomintang sur ses adversaires politiques et affirmera sa domination en Chine pour toujours."
 KMT_70s_Recruit_locals_into_KMT:0 "Recruter des habitants de la région au sein du Kuomintang"
 KMT_70s_Recruit_locals_into_KMT_desc:0 "Si nous voulons garantir la stabilité régionale, nous devons recruter au sein du parti des militants politiques locaux favorables au KMT. Ceux-ci s'aligneront officiellement sur le parti tout en assumant le rôle de représentants des intérêts locaux. Après tout, la Chine est un pays très diversifié et nous devrions chercher à concilier cette diversité en la rapprochant davantage de nos convictions."
 KMT_70s_Keep_Elites_In_Check:0 "Tenir les élites en échec"
 KMT_70s_Keep_Elites_In_Check_desc:0 "Hommes d'affaires, officiers, responsables politiques locaux… tous jouent un rôle essentiel au service du gouvernement en tant que piliers du développement socio-économique. Si le gouvernement et son élite, soigneusement sélectionnée et formée, travaillent en étroite collaboration, la croissance économique sera mieux assurée. Si nous voulons garantir que cela reste ainsi, nous ferions bien de surveiller le comportement et les convictions de ces élites afin de nous assurer qu’aucune corruption ne se propage en leur sein, comme ce fut le cas pendant la « Décennie de Nankin » qui a suivi la Campagne du Nord."
 KMT_70s_Mandarin_Learning_Efforts:0 "Promouvoir les cours de mandarin"
 KMT_70s_Mandarin_Learning_Efforts_desc:0 "Afin de conserver notre emprise sur la société, nous devons redoubler d'efforts dans les campagnes d'apprentissage du mandarin, depuis l'école jusqu'à l'université. Même si nous ne pouvons plus réprimer aussi sévèrement les dialectes et les langues locales comme nous l'avons fait au cours des dernières décennies, nous pouvons essayer d'affirmer la prédominance du mandarin afin de rendre son utilisation plus attrayante."
 KMT_70s_Tighten_grip_over_radio_television:0 "Renforcer notre emprise sur les nouveaux médias"
 KMT_70s_Tighten_grip_over_radio_television_desc:0 "La télévision et la radio font leur apparition dans un nombre croissant de foyers à travers le pays. Si elles sont utiles pour le divertissement, il faut toutefois veiller, en tant que moyens de diffusion de l'information, à ce que le gouvernement exerce un contrôle sur ce qui est diffusé. Ce n'est pas comme si des messages critiques à l'égard du KMT parvenaient jusqu'aux tables de nos citoyens."
 KMT_70s_Get_to_know_the_people:0 "Visiter le pays"
 KMT_70s_Get_to_know_the_people_desc:0 "Le Premier ministre Chiang Ching-Kuo a décidé de se présenter au peuple non pas comme un haut dignitaire brillant, mais comme un simple citoyen du pays. Vêtus de tenues décontractées, lui et ses collaborateurs se sont rendus dans les écoles, les universités, les usines, les bureaux et les hôpitaux locaux afin de faire connaissance avec les gens sur place et de discuter avec eux de leurs besoins et de leurs problèmes."
 KMT_70s_encourage_young_politicians:0 "Soutenir les jeunes politiciens"
 KMT_70s_encourage_young_politicians_desc:0 "Étant donné que la vieille garde s'éteint peu à peu et que ses méthodes et ses convictions sont de toute façon dépassées, nous devrions recruter davantage de jeunes dynamiques au sein du Kuomintang afin qu'il ne soit pas uniquement un parti composé de personnes âgées conservatrices."
 KMT_70s_further_anti_corruption_campaigns:0 "Poursuivre les campagnes de lutte contre la corruption"
 KMT_70s_further_anti_corruption_campaigns_desc:0 "Un gouvernement intègre et efficace est la clé du développement socio-économique et politique. Nous ne pouvons tolérer la présence au sein du gouvernement de fonctionnaires égoïstes et corrompus. Le pays est la priorité absolue. Pas les intérêts personnels."
 KMT_70s_attract_western_trained_chinese:0 "Attirer des experts chinois formés en Occident"
 KMT_70s_attract_western_trained_chinese_desc:0 "Les Chinois d'outre-mer ayant suivi une formation en sciences sociales, en technologie et en sciences naturelles pourraient constituer un atout précieux pour notre gouvernement. Leur expertise nous aidera à élaborer de nouvelles politiques visant à améliorer les conditions de vie de la population, ainsi qu'à développer de nouvelles technologies et théories politiques."
 KMT_70s_establish_institute_of_economics:0 "Créer l'Institut d'économie"
 KMT_70s_establish_institute_of_economics_desc:0 "L'Academia Sinica fait office d'Académie nationale depuis 1928. Nous devrions élargir l'éventail des disciplines enseignées, en particulier en économie. Si nous voulons véritablement garantir la croissance économique et la prospérité, nous devons fournir les ressources nécessaires à nos futurs économistes."
 KMT_70s_More_Infrastructure:0 "Les huit grands projets de construction"
 KMT_70s_More_Infrastructure_desc:0 "Les différents projets d'infrastructure menés ces dernières années ont grandement contribué au bien-être local et ont permis de renforcer la cohésion du pays. Il reste toutefois beaucoup à faire, notamment en matière de modernisation des infrastructures, d'entretien et de développement du réseau de liaisons. De nombreux Chinois vivent encore dans des conditions difficiles et, selon la tradition confucéenne, il est de notre devoir, en tant que dirigeants, de leur venir en aide."
 KMT_70s_Appoint_Hsieh_Tung-min_Governor_Taiwan:0 "Nommer Hsieh Tung-min au poste de gouverneur de Taïwan"
 KMT_70s_Appoint_Hsieh_Tung-min_Governor_Taiwan_desc:0 "Afin d'apaiser les minorités et les communautés locales, nous devrions nommer des personnalités locales issues de ces régions et proches du KMT à des postes gouvernementaux clés, tels que ceux de gouverneurs et d'officiers de garnison. Nous commencerons par nommer Hsieh Tung-min au poste de gouverneur de Taïwan ; né à Taïwan sous la domination japonaise, il a décidé de quitter l'île dans les années 1920 pour rejoindre le Kuomintang sur le continent. Si nous avions besoin de communistes purs et durs à des postes clés pendant la période de consolidation qui a suivi la fin de la guerre civile, nous devrions désormais encourager des personnalités moins radicales et connues localement à les remplacer. La promotion de Hsieh Tung-min en sera un exemple."
 KMT_70s_Build_CKS_airport_Chongqing:0 "Construire l'aéroport Chiang Kai-shek"
 KMT_70s_Build_CKS_airport_Chongqing_desc:0 "Dans le cadre des différents projets de construction proposés par le Premier ministre Chiang, nous devons construire davantage d'aéroports afin de relier notre pays au reste du monde. Nous commencerons par Chongqing et donnerons à cet aéroport le nom du généralissime Chiang Kai-shek."
 KMT_70s_World_Heritage_Sites:0 "Sélection des premiers sites chinois inscrits au patrimoine mondial"
 KMT_70s_World_Heritage_Sites_desc:0 "Un site du patrimoine mondial est un lieu ou une zone bénéficiant d'une protection juridique en vertu d'une convention internationale gérée par l'Organisation des Nations unies pour l'éducation, la science et la culture (UNESCO). Les sites du patrimoine mondial sont désignés par l'UNESCO en raison de leur importance culturelle, historique, scientifique ou autre. Ces sites sont considérés comme abritant « le patrimoine culturel et naturel de la planète, jugé d'une valeur exceptionnelle pour l'humanité ». L'architecture, les inventions, la nature et les sites touristiques chinois ont parfaitement démontré la créativité, les ambitions et les capacités physiques de l'humanité et méritent donc leur place sur la Liste du patrimoine mondial."
 KMT_70s_Promote_moderate_patriotism:0 "Encourager un patriotisme modéré"
 KMT_70s_Promote_moderate_patriotism_desc:0 "Si le nationalisme fait partie intégrante des trois principes du Dr Sun Yat-sen, il peut devenir un élément dangereux s’il prend une tournure trop radicale. Au lieu de faire croire à tort que le peuple chinois est supérieur au reste du monde, nous devrions mettre l’accent sur la notion de patriotisme, ce qui signifie que l’on peut être fier de son pays sans pour autant nourrir des sentiments de supériorité ni le désir de partir en guerre pour sa nation. Les tendances nationalistes ne feront que créer l'image d'une société hostile et nuiront considérablement à nos relations avec l'Occident."
 KMT_70s_Maintain_US_relations:0 "Entretenir les relations avec les États-Unis"
 KMT_70s_Maintain_US_relations_desc:0 "Même si Tchang Kaï-chek a eu des différends houleux avec les Américains pendant et après la Seconde Guerre mondiale, il est évident que les États-Unis ont été notre plus proche allié, nous apportant des capitaux, une philosophie politique et un soutien militaire. Il est indispensable pour notre nation d’entretenir de bonnes relations avec Washington, surtout lorsque l’on a leur plus grand rival, l’URSS, à nos portes."
 KMT_70s_Open_the_nanjing_memorial_museum:0 "Ouverture du Musée commémoratif de Nanjing"
 KMT_70s_Open_the_nanjing_memorial_museum_desc:0 "Même après plusieurs décennies, la Guerre de la Résistance a eu une influence si considérable sur la Chine qu'elle restera très certainement un sujet sensible dans un avenir prévisible. Afin de ne jamais oublier ce qui s'est passé sur les champs de bataille et dans les zones occupées, nous devrions construire un musée qui nous rappellera non seulement la courageuse résistance dont ont fait preuve les Chinois face à l'impérialisme étranger, mais aussi à quel point les êtres humains peuvent se montrer cruels les uns envers les autres, afin que nous, les humains, ne laissions jamais cela se reproduire."
 KMT_70s_crackdown_on_remaining_communist_cells:0 "Répression contre les cellules du PCC"
 KMT_70s_crackdown_on_remaining_communist_cells_desc:0 "Si l'élite du PCC a disparu pour de bon, qu'elle repose en paix ou qu'elle soit derrière les barreaux, il subsiste néanmoins une importante scène clandestine qui tente de saboter et d'infiltrer les institutions gouvernementales et de diffuser de la propagande pro-PCC, notamment un petit livre rouge contenant les soi-disant « Pensées du président Mao Zedong ». Nous ne pouvons pas laisser cette propagande idéologique se propager davantage dans le pays."
 KMT_70s_Modernise_Education_Institutions:0 "Moderniser les établissements d'enseignement"
 KMT_70s_Modernise_Education_Institutions_desc:0 "On observe une généralisation croissante de l'informatique dans les armées du monde entier, y compris au sein des forces armées de la République. Mais pourquoi réserver cette technologie exclusivement au domaine militaire ? Les établissements d'enseignement, tels que les écoles et les universités, pourraient tirer pleinement parti de ces nouvelles avancées technologiques, ce qui permettrait sans aucun doute d'accroître considérablement nos capacités éducatives."
 KMT_70s_spread_anti_ussr_propaganda:0 "Diffuser une rhétorique antisoviétique"
 KMT_70s_spread_anti_ussr_propaganda_desc:0 "L'Union soviétique a été la source de tous les maux, ce mal qu'est le communisme. Si le Dr Sun et même Chiang Ching-kuo ont reconnu certains aspects positifs, tels que l'organisation des forces armées ou la manière de mener une révolution anti-impérialiste, il était évident que le PCUS ne cherchait qu'à aider le Kuomintang afin de l'influencer et, à terme, de le remplacer par le Parti communiste. C'est pourquoi notre glorieux leader Chiang Kai-shek a perçu leurs véritables intentions lors de son séjour à Moscou et a décidé de frapper de manière préventive contre le PCC en 1927. Compte tenu de nos relations étroites avec les États-Unis et de notre histoire personnelle avec l'anticommunisme, il est plus que nécessaire de dénoncer l'URSS comme l'ennemi du pays."
 KMT_70s_secure_soviet_borders:0 "Sécuriser les frontières soviétiques"
 KMT_70s_secure_soviet_borders_desc:0 "Même si une invasion directe est peu probable, il n'est pas inutile de redoubler d'efforts pour assurer la défense de nos frontières. Qui sait quand l'Union soviétique se servira à nouveau du prétexte de la protection des minorités soviétiques locales pour justifier des guerres régionales et des conflits frontaliers ?"
 KMT_70s_review_economy:0 "Faire le point sur la situation économique"
 KMT_70s_review_economy_desc:0 "Les dernières décennies ont transformé le fonctionnement de notre économie. Mais aujourd’hui, grâce à un niveau de vie en légère hausse, à des infrastructures plus développées et à l’absence de menaces marxistes, nous bénéficions de conditions favorables pour développer encore davantage notre économie et pourrions être en mesure de rivaliser avec les États-Unis. Au cours des prochaines années, nous nous concentrerons sur les technologies informatiques, les infrastructures, les machines électriques et les exportations."
 KMT_70s_establish_Electronic_data_center:0 "Créer le centre de traitement électronique des données"
 KMT_70s_establish_Electronic_data_center_desc:0 "Le Yuan exécutif mettra en place un centre de traitement électronique des données afin d'aider les administrations publiques et les établissements d'enseignement à concevoir leurs propres ordinateurs, adaptés à leurs besoins, dans le but d'optimiser leur efficacité."
 KMT_70s_Collaboration_between_Universities_Domestic_Companies:0 "Encourager la collaboration entre les universités et les entreprises locales"
 KMT_70s_Collaboration_between_Universities_Domestic_Companies_desc:0 "Grâce à notre collaboration avec des universités et des entreprises nationales du secteur de l'électronique, nous sommes en mesure d'introduire de nombreuses nouvelles technologies en Chine."
 KMT_70s_Buy_Semiconductors_from_US:0 "Acheter des semi-conducteurs américains"
 KMT_70s_Buy_Semiconductors_from_US_desc:0 "Pour lancer l'industrie informatique, nous devons d'abord nous procurer des semi-conducteurs. Ceux provenant des États-Unis nous aideront non seulement à fabriquer nos premiers modèles d'ordinateurs, mais permettront également à nos ingénieurs et scientifiques chinois expatriés, forts de leur expérience, de mettre en place et de mener à bien divers projets liés aux semi-conducteurs."
 KMT_70s_encourage_vocational_technical_education:0 "Promouvoir l'enseignement professionnel et technique"
 KMT_70s_encourage_vocational_technical_education_desc:0 "Nous devons promouvoir l'enseignement professionnel et technique, en particulier au niveau du deuxième cycle du collège, car l'économie a de plus en plus besoin de travailleurs qualifiés et de personnel technique."
 KMT_70s_tax_cuts:0 "Allègements fiscaux pour les entreprises étrangères et nationales"
 KMT_70s_tax_cuts_desc:0 "Si nous voulons encourager les investissements des entreprises privées chinoises et étrangères, nous devons réduire les impôts qu'elles devront payer afin de rendre ces investissements plus attractifs."
 KMT_70s_energy_investments:0 "Investir dans l'énergie nucléaire"
 KMT_70s_energy_investments_desc:0 "Afin de disposer d'une sorte de réserve d'énergie d'urgence, nous devons investir dans l'énergie nucléaire afin de réduire notre dépendance vis-à-vis des exportations de pétrole."
 KMT_70s_petro_chemicals:0 "Promouvoir l'industrie pétrochimique"
 KMT_70s_petro_chemicals_desc:0 "Les plastiques, les plastifiants, les solvants. Ce sont tous des composants essentiels des produits de la vie quotidienne. Nous devons développer l'industrie pétrochimique afin d'augmenter la production et d'approvisionner davantage le marché."
 KMT_70s_Export_Focus:0 "Économie exportatrice"
 KMT_70s_Export_Focus_desc:0 "Nous devons nous concentrer davantage sur l'exportation de biens, en particulier dans les domaines des technologies informatiques et des produits agricoles, ainsi que sur la réduction des barrières commerciales telles que les droits de douane et les taxes supplémentaires."
 KMT_70s_Further_Agriculture_Projects:0 "Nouveaux investissements dans le secteur agricole"
 KMT_70s_Further_Agriculture_Projects_desc:0 "L'agriculture reste un secteur important de l'économie chinoise. De nombreux agriculteurs des régions rurales ont besoin de notre soutien si nous voulons garantir des conditions de vie décentes à tous les Chinois, qu'ils vivent à Shanghai ou à Xining."
 KMT_70s_More_Infrastructure_2:0 "Présenter les grands projets d'infrastructure"
 KMT_70s_More_Infrastructure_2_desc:0 "Les infrastructures constituent un élément essentiel pour l'efficacité d'un pays. L'approvisionnement en eau, les transports, les infrastructures énergétiques : sans elles, les besoins fondamentaux de la population ne peuvent être satisfaits. En particulier en ces temps d'incertitude liés au système capitaliste mondial dominant, nous devons nous préparer à une crise potentielle et investir dans divers projets d'infrastructure afin de garantir la connectivité et la stabilité du pays."
 KMT_70s_More_Infrastructure_2_railroads:0 "Connecter les zones rurales"
 KMT_70s_More_Infrastructure_2_railroads_desc:0 "Si nous avons mis en place un vaste réseau ferroviaire reliant les principales villes du pays, il est également important que les petites zones rurales puissent prendre le train pour rejoindre la gare la plus proche, qui leur permettra ensuite de se rendre dans les grandes villes du pays."
 KMT_70s_More_Infrastructure_2_water_supply_streets:0 "Projets routiers et d'approvisionnement"
 KMT_70s_More_Infrastructure_2_water_supply_streets_desc:0 "Des réseaux routiers et d'approvisionnement en eau en bon état de fonctionnement sont essentiels pour chaque collectivité. Des investissements supplémentaires aideront ces collectivités à améliorer leurs infrastructures."
 KMT_70s_More_Infrastructure_2_Expand_Harbours:0 "Agrandir les ports"
 KMT_70s_More_Infrastructure_2_Expand_Harbours_desc:0 "Nos ports constituent la porte d'entrée pour les échanges commerciaux avec l'Occident, notamment le Japon, les États-Unis et l'Europe occidentale. Cependant, ils sont terriblement vétustes et doivent être modernisés afin d'optimiser l'efficacité des échanges commerciaux."
 KMT_70s_More_Infrastructure_2_steel_mills:0 "Construction d'une aciérie"
 KMT_70s_More_Infrastructure_2_steel_mills_desc:0 "Même si nous ne nous concentrons pas sur l'industrie lourde, nous ne pouvons pas pour autant la négliger, car l'acier est indispensable dans presque tous les domaines."
 KMT_70s_Oil_gansu:0 "Fouilles dans le Gansu"
 KMT_70s_Oil_gansu_desc:0 "Si nous voulons que l'industrie pétrochimique prospère, nous avons besoin de plus de pétrole. Même si les importations de pétrole en provenance des États-Unis nous aideront dans l'immédiat, nous devrions nous tourner vers des sources d'approvisionnement en pétrole plus indépendantes."
 KMT_70s_Build_Fuel_Silos:0 "Agrandir les réservoirs de carburant"
 KMT_70s_Build_Fuel_Silos_desc:0 "La demande croissante en pétrole, ainsi que nos activités intensives d'extraction et d'importation, nous obligent à investir davantage dans des installations de stockage de pétrole et de carburant."
 KMT_70s_Build_more_Petrochemical_plants:0 "D'autres raffineries pétrochimiques"
 KMT_70s_Build_more_Petrochemical_plants_desc:0 "La demande en produits pétrochimiques ne cesse de croître ; nous devons donc redoubler d'efforts et investir davantage dans les raffineries pétrochimiques."
 KMT_70s_economic_growth:0 "Croissance économique"
 KMT_70s_economic_growth_desc:0 "Nos experts économiques ont constaté une forte augmentation de la production et de l'efficacité dans notre pays au cours des dernières années. Nos projets se sont révélés efficaces, mais il reste encore beaucoup à faire, notamment en matière de modernisation des principaux centres urbains du pays et d'investissements dans l'industrie légère."
 KMT_70s_modernise_our_big_cities:0 "Moderniser les villes"
 KMT_70s_modernise_our_big_cities_desc:0 "Avec l'essor des nouvelles technologies telles que l'informatique, la télévision et diverses autres inventions, nous devons moderniser les institutions administratives, éducatives et bureaucratiques de nos villes les plus importantes. La Chine urbaine doit devenir une société moderne."
 KMT_70s_modernise_our_big_cities_nanjing:0 "Nankin"
 KMT_70s_modernise_our_big_cities_nanjing_desc:0 "Nanjing est notre capitale actuelle et a toujours été notre site le plus important pour assurer la sécurité et l'administration du pays. Elle doit donc être considérée comme une priorité en matière de modernisation urbaine."
 KMT_70s_modernise_our_big_cities_chongqing:0 "Chongqing"
 KMT_70s_modernise_our_big_cities_chongqing_desc:0 "Chongqing a servi de capitale provisoire pendant la Seconde Guerre mondiale et constitue l'un des sites les plus importants du Sichuan, le grenier de la Chine. La forte densité de population impose la modernisation de toutes les grandes villes du Sichuan afin d'améliorer l'efficacité administrative, et nous commencerons par Chongqing."
 KMT_70s_modernise_our_big_cities_beijing:0 "Pékin"
 KMT_70s_modernise_our_big_cities_beijing_desc:0 "L'ancienne capitale de la Chine, siège des empereurs chinois et ancienne capitale de ces maudits bandits communistes. Même si les KMT sont en difficulté et que leur idéologie ne s'accorde pas avec la ville, celle-ci reste l'une des plus grandes du pays et ne doit pas être exclue de la modernisation."
 KMT_70s_modernise_our_big_cities_Shanghai:0 "Shanghai"
 KMT_70s_modernise_our_big_cities_Shanghai_desc:0 "Bien que nous ayons déjà beaucoup investi à Shanghai, qui nous a servi de porte d'entrée vers l'Occident, nous devons continuer à moderniser la ville. Une ville modernisée signifie des échanges modernisés avec l'Occident."
 KMT_70s_modernise_our_big_cities_guangzhou:0 "Guangzhou"
 KMT_70s_modernise_our_big_cities_guangzhou_desc:0 "La ville natale du Dr Sun, bastion du Kuomintang où nous avons préparé nos forces en vue de l'expédition vers le nord, et l'une des villes les plus riches du Guangdong. Elle occupe une place incontournable lorsqu'il s'agit de la modernisation des villes les plus importantes de Chine."
 KMT_70s_modernise_our_big_cities_kunming:0 "Kunming"
 KMT_70s_modernise_our_big_cities_kunming_desc:0 "Il ne faut pas oublier les régions montagneuses du Yunnan. Les efforts de modernisation doivent également porter sur la capitale provinciale, Kunming."
 KMT_70s_modernise_our_big_cities_golmud:0 "Golmud"
 KMT_70s_modernise_our_big_cities_golmud_desc:0 "L'ancienne base de la famille Ma, aujourd'hui capitale de la province du Qinghai, est relativement en retard par rapport aux régions côtières. Nous devons la moderniser afin de la rendre plus attractive pour l'urbanisation, mais aussi en faire une porte d'entrée vers la partie moderne du pays pour les agriculteurs ruraux ordinaires qui vivent dans la région."
 KMT_70s_modernise_our_big_cities_Dihua:0 "Dihua"
 KMT_70s_modernise_our_big_cities_Dihua_desc:0 "Le Xinjiang et ses tensions ethniques ont toujours posé problème par le passé. Nous devrions commencer notre politique à l'égard du Xinjiang par l'amélioration des infrastructures et l'introduction de technologies modernes dans la région, en particulier à Dihua."
 KMT_70s_Light_Industry:0 "L’industrie légère"
 KMT_70s_Light_Industry_desc:0 "Le développement de l'industrie lourde a dominé notre économie avant la Seconde Guerre mondiale et dans les années qui ont suivi. Alors que la société occidentale évolue progressivement vers une société de consommation, nous devons nous tourner vers l'industrie légère afin de stimuler la production, l'exportation et l'importation de biens de consommation et de technologies."
 KMT_70s_Radios_Television:0 "Électronique grand public"
 KMT_70s_Radios_Television_desc:0 "La télévision et la radio ne devraient pas être des produits de luxe. Même s’il sera difficile de permettre à toutes les classes sociales d’y avoir accès financièrement, la plupart des foyers chinois devraient être équipés d’une radio et d’un téléviseur."
 KMT_70s_acer:0 "Les origines d'Acer"
 KMT_70s_acer_desc:0 "Fondée par Stan Shih à Hsinchu, la société Acer a pour objectif de fournir des composants électroniques et des services de conseil dans le domaine des technologies de microprocesseurs. Elle devrait certainement poursuivre son développement à l'avenir et, avec un financement adéquat, elle pourrait bien devenir un acteur majeur dans le secteur des microprocesseurs."
 KMT_70s_American_cars_for_the_chinese_market:0 "Voitures américaines destinées au marché chinois"
 KMT_70s_American_cars_for_the_chinese_market_desc:0 "Grâce à nos bonnes relations avec les États-Unis, nous pouvons encourager leurs constructeurs automobiles à créer des filiales locales en Chine avec le soutien d'investisseurs chinois. En 1972, la filiale Ford Lio Ho Motor a été créée et continuera à produire des modèles Ford destinés au marché chinois."
 KMT_70s_renewable_energies:0 "Investir dans les énergies renouvelables"
 KMT_70s_renewable_energies_desc:0 "Les énergies renouvelables sont l'avenir et nous devrions y investir afin de nous assurer une deuxième source d'énergie. Elles ne pourront pas remplacer le charbon et le pétrole pour l'instant, mais si nous poursuivons la recherche et le développement dans ce domaine, nous pourrions être en mesure de réduire considérablement les émissions de CO₂ à l'avenir. Pour l'instant, elles nous serviront toutefois de sources d'énergie supplémentaires pour répondre à la demande croissante en machines et en appareils électroniques."
 KMT_70s_food_branches:0 "Secteurs alimentaires"
 KMT_70s_food_branches_desc:0 ""
 KMT_70s_textile_industry:0 "Soutenir l'industrie textile"
 KMT_70s_textile_industry_desc:0 "Les entreprises du secteur de l'habillement jouent un rôle essentiel dans la croissance économique. Un financement public accru devrait favoriser les investissements, améliorer l'efficacité et stimuler les exportations de vêtements."
 KMT_70s_plastic_industry:0 "Investir dans le plastique"
 KMT_70s_plastic_industry_desc:0 ""
 KMT_70s_chinese_consumer_society:0 "La société de consommation chinoise"
 KMT_70s_chinese_consumer_society_desc:0 "Aujourd'hui, la Chine est elle aussi devenue une société de consommation à l'occidentale, mais le gouvernement continue de surveiller la situation de près. La richesse s'est considérablement accrue en Chine, et cela grâce au changement de politique économique opéré par le Kuomintang. Mieux vaut ne pas imaginer les expériences dangereuses auxquelles le PCC se serait livré s'il avait remporté la guerre civile et pris le contrôle de la Chine."
 KMT_70s_review_army:0 "Bilan des forces armées"
 KMT_70s_review_army_desc:0 "Au cours des dernières décennies, notre armée a constitué un monopole politique de premier plan qui a exercé une influence considérable sur les décisions politiques. Cependant, la menace que représentait le PCC ayant enfin disparu, il est peut-être temps de se demander si nous avons réellement besoin d'une armée aussi imposante et influente."
 KMT_70s_downsize_army:0 "Réduire les effectifs de l'armée"
 KMT_70s_downsize_army_desc:0 "L'entretien de l'armée coûte cher, et la taille et l'influence considérables de la ROCA en font une charge financière très lourde. La menace que représentait le PCC ayant enfin disparu, il n'est plus nécessaire de maintenir cette immense armée. Nous la réduirons à une armée purement défensive et nous concentrerons également nos efforts sur les commissariats de police et les casernes locales afin de nous assurer qu'ils soient prêts à faire face aux menaces internes."
 KMT_70s_maintain_huge_army:0 "La Prusse chinoise"
 KMT_70s_maintain_huge_army_desc:0 "Le KMT est arrivé au pouvoir grâce à l'armée, a défendu le pays grâce à l'armée et n'a survécu que grâce à elle. Le militarisme était essentiel à la survie de notre régime et, même après la chute du PCC, nous ne pouvons pas prendre le risque de voir l'autorité de notre armée remise en cause. On ne sait jamais qui sera notre ennemi demain..."
 KMT_70s_depoliticise_army:0 "Dépolitiser les officiers"
 KMT_70s_depoliticise_army_desc:0 "De nombreux hauts responsables agissent encore sous l'emprise d'idéologies et tentent d'imposer leur volonté aux soldats. Nous devons veiller à ce que l'armée reste politiquement neutre afin qu'elle puisse se consacrer exclusivement à sa seule mission : la défense du peuple. Nous n'avons pas besoin d'une armée susceptible d'être manipulée à des fins politiques."
 KMT_70s_utilize_former_warlord_armies:0 "Recourir aux armées d'anciens chefs de guerre"
 KMT_70s_utilize_former_warlord_armies_desc:0 "Une fois les chefs de guerre intégrés au gouvernement central, nous pourrions mettre à profit leurs anciennes armées et les intégrer aux garnisons locales et aux forces de police."
 KMT_70s_volunteer_service:0 "Réformer le service militaire obligatoire"
 KMT_70s_volunteer_service_desc:0 "Afin de lutter contre le militarisme radical, nous devrions apporter quelques modifications à la durée du service militaire. Nous la ramènerons à un an au lieu de trois et mettrons également en place des options de service civil, par exemple au sein du ministère de l'Intérieur."
 KMT_70s_decrease_army_spending:0 "Réduire les dépenses militaires"
 KMT_70s_decrease_army_spending_desc:0 "Nous devrions réorienter nos financements vers le secteur civil, car nos forces armées n'ont besoin pour l'instant que d'équipements légers."
 KMT_70s_light_equipment:0 "Investir dans du matériel léger"
 KMT_70s_light_equipment_desc:0 "Étant donné que notre armée remplit désormais principalement des missions défensives et administratives, nous devrions investir dans des armes légères, de l'artillerie légère et du matériel de soutien afin de garantir que nos troupes soient bien équipées pour faire face à d'éventuelles menaces, tant à l'intérieur qu'à l'extérieur de la Chine."
 KMT_70s_remove_corrupt_police_officers:0 "Éliminer les policiers corrompus"
 KMT_70s_remove_corrupt_police_officers_desc:0 "Les fonctionnaires corrompus qui ne pensent qu'à leur intérêt personnel et tolèrent la criminalité n'ont pas leur place au sein de notre administration. Nous surveillerons de près nos forces de l'ordre pour nous assurer qu'elles n'agissent pas de manière suspecte."
 KMT_70s_increase_army_spending:0 "Augmenter les dépenses militaires"
 KMT_70s_increase_army_spending_desc:0 "L'armée est notre priorité absolue en matière de financement. La sécurité nationale n'a pas de prix et nous sommes prêts à consacrer davantage de ressources à ce secteur."
 KMT_70s_loyal_officers:0 "Généraux fidèles"
 KMT_70s_loyal_officers_desc:0 "Si nous ne voulons pas risquer de perdre le pouvoir, nous devons veiller à ce que nos forces armées comptent dans leurs rangs des officiers supérieurs extrêmement loyaux. Leur loyauté nous permettra d'utiliser l'armée à toutes fins utiles et garantira également que les soldats restent sous l'influence du KMT, de sorte qu'ils ne remettent jamais en cause les ordres que nous leur donnerons à l'avenir."
 KMT_70s_heavy_machinery:0 "Investir dans les engins de chantier"
 KMT_70s_heavy_machinery_desc:0 "Nous devrions investir dans des avions, des chars et divers autres engins lourds qui renforceront considérablement la puissance de nos forces armées. La dissuasion est l'essence même du réalisme en matière de politique internationale. Personne n'osera nous attaquer si notre pays est armé jusqu'aux dents avec les technologies les plus récentes imaginables."
 KMT_70s_military_propaganda:0 "Propagande militaire"
 KMT_70s_military_propaganda_desc:0 "Le pays a besoin de vous ! À tout moment, nous pourrions être attaqués par des puissances impérialistes étrangères qui exploitent notre pays depuis plus de 100 ans. Rejoignez vos frères d'armes et faites preuve de patriotisme, de camaraderie et de courage pour défendre vos amis, votre famille et votre pays contre ses ennemis. Rejoignez la ROCA dès aujourd'hui !"
 KMT_70s_army_maneuvers:0 "Manœuvres militaires"
 KMT_70s_army_maneuvers_desc:0 "Nous ne pouvons jamais savoir quand nous serons attaqués. Pour que vos forces soient en mesure de défendre notre pays, elles ont besoin d'un entraînement. Nous mènerons diverses manœuvres avec l'aide de nos conseillers américains afin de renforcer la capacité défensive de notre armée."
 KMT_70s_militaristic_society:0 "Une société militariste"
 KMT_70s_militaristic_society_desc:0 "Notre société s'aligne sur les principes de notre pays, qui trouvent également leur expression dans la grande ROCA. Cela nous apportera la démocratie, la fierté nationale et le bien-être, mais seulement si chacun y croit et participe activement à ce processus. Engagez-vous dans l'armée et contribuez à faire de ce pays un endroit plus sûr pour nos femmes et nos enfants !"
 KMT_70s_foreign_policy:0 "Le ministère des Affaires étrangères"
 KMT_70s_foreign_policy_desc:0 "En tant que grande puissance en pleine ascension, nous pouvons utiliser notre influence politique pour agir sur d'autres pays par le biais d'alliances, de traités, d'un soutien ou, si nécessaire, par la guerre. Nous adopterons principalement une approche réaliste en matière de politique étrangère, ce qui signifie que nous souhaitons maximiser notre influence politique et garantir notre sécurité."
 KMT_70s_Indian_relations:0 "Relations indiennes"
 KMT_70s_Indian_relations_desc:0 "Même si nous avons déjà eu des discussions avec l'Inde au sujet de nos régions frontalières au Tibet il y a une dizaine d'années, nous devrions nous demander s'il convient de reprendre le dialogue avec les Indiens et, si tel est le cas, comment nous y prendre."
 KMT_70s_Recognize_Indian_Claims:0 "Reconnaître la ligne MacMahon"
 KMT_70s_Recognize_Indian_Claims_desc:0 "Nous parviendrons à un accord pacifique avec l'Inde en reconnaissant sa souveraineté sur les territoires délimités par la ligne MacMahon. Ce traité a été signé par le gouvernement tibétain en 1914, mais n'a pas été reconnu par la République, qui affirmait que le Tibet faisait partie de la Chine et ne pouvait donc pas signer de traités multilatéraux. Cependant, se créer un nouvel ennemi en revendiquant ces territoires ou en violant le traité ne serait pas une décision judicieuse. Nous devrions plutôt œuvrer en faveur d'une coopération accrue entre l'Inde et la Chine."
 KMT_70s_Non_Agression_India:0 "Traité de sécurité sino-indien"
 KMT_70s_Non_Agression_India_desc:0 "Nous devrions proposer à Delhi un traité de non-agression et de coopération afin de garantir la paix entre nos deux nations. Une collaboration étroite permettra de renforcer encore davantage l'unité de l'Asie et contribuera à garantir l'ordre et la stabilité dans la région."
 KMT_70s_Utilise_Indian_market:0 "Profiter du marché indien"
 KMT_70s_Utilise_Indian_market_desc:0 "La population indienne est gigantesque et représente un marché immense de personnes ayant besoin de biens et de services. Nous devrions encourager nos entreprises chinoises à exporter davantage de biens de consommation vers l'Inde, car le faible niveau de développement de ses infrastructures et de son tissu social engendre des besoins bien plus importants en produits de première nécessité tels que la nourriture, les vêtements, les médicaments et les appareils électroniques."
 KMT_70s_Demand_Return_Arunanchal_Pradesh:0 "Dénoncer l'accord MacMahon"
 KMT_70s_Demand_Return_Arunanchal_Pradesh_desc:0 "L'accord MacMahon n'a jamais constitué un traité juridique, puisqu'il a été signé par une délégation tibétaine au début du XXe siècle. Le gouvernement chinois ne l'a jamais reconnu, car le Tibet a toujours fait partie intégrante de la Chine et ne pouvait donc pas signer de traités internationaux de son propre chef. Nous continuerons à revendiquer les anciennes régions du Sud-Tibet et n'hésiterons pas à recourir à la force si nos exigences ne sont pas satisfaites."
 KMT_70s_Army_Drills_in_Tibet:0 "Exercices militaires au Tibet"
 KMT_70s_Army_Drills_in_Tibet_desc:0 "Si l'Inde ne renonce pas à nos territoires légitimes par des moyens pacifiques, nous devrons recourir à la force. Nous déploierons notre armée à l'avance dans les montagnes tibétaines si la situation venait à s'aggraver davantage."
 KMT_70s_Arm_Pakistani_Militias_in_Indian_Kashmir:0 "Armer les milices musulmanes au Cachemire"
 KMT_70s_Arm_Pakistani_Militias_in_Indian_Kashmir_desc:0 "La région contestée du Cachemire, qui nous oppose à l'Inde et au Pakistan, pourrait constituer une formidable diversion pour les Indiens si quelqu'un venait à jeter de l'huile sur le feu. Armer les forces pro-pakistanaises dans cette région provoquerait une instabilité et mettrait l'Inde sous pression si nous venions à lui réclamer les territoires que nous revendiquons."
 KMT_70s_Demand_South_Tibet:0 "Réclamer le Tibet du Sud"
 KMT_70s_Demand_South_Tibet_desc:0 "Le moment est venu de faire asseoir les Indiens à la table des négociations et de réclamer la restitution de nos anciens territoires. Nous sommes prêts à faire de nombreuses concessions, mais nous ne repartirons pas les mains vides. Si les Indiens ne cèdent pas, nous devrons peut-être envisager de recourir à la force meurtrière contre eux."
 KMT_70s_Soviet_Relations:0 "Relations sino-soviétiques"
 KMT_70s_Soviet_Relations_desc:0 "Les relations entre l'URSS et la Chine sont tendues. Si elle a soutenu le PCC et l'a aidé lors de son ascension au pouvoir, elle a également apporté son soutien à notre effort de guerre contre l'invasion japonaise. Cependant, l'occupation de la Mandchourie et l'aide apportée au PCC pendant la guerre civile ont gravement nui à nos relations."
 KMT_70s_Soviet_Detente:0 "Rechercher une détente avec Moscou"
 KMT_70s_Soviet_Detente_desc:0 "Nous devrions peut-être faire un pas vers l'URSS et essayer d'apaiser les tensions entre nos deux pays. Après tout, malgré notre rivalité idéologique, nous ne souhaitons pas entrer en conflit militaire avec l'URSS."
 KMT_70s_Soviet_Detente_Tuva:0 "Reconnaître la domination soviétique sur la Touva"
 KMT_70s_Soviet_Detente_Tuva_desc:0 "La région de Touva fait partie de la Russie depuis la révolution de 1911. Les populations qui y vivent ne sont plus soumises à l'influence mongole ou chinoise ; par conséquent, toute revendication sur ce territoire est vaine et ne ferait qu'alimenter de nouveaux conflits potentiels avec l'URSS. Nous devons renoncer à nos revendications sur cette région."
 KMT_70s_Trade_with_USSR:0 "Établir des relations commerciales"
 KMT_70s_Trade_with_USSR_desc:0 "Nous devrions tirer parti du marché soviétique. Toutes ces personnes qui ont besoin de produits de première nécessité et les diverses ressources de l'URSS, comme le pétrole, pourraient s'avérer plus utiles que des relations hostiles. Après tout, nous ne voulons pas laisser passer une bonne opportunité financière."
 KMT_70s_Reperations_for_deported_Chinese:0 "Indemnisation des Chinois expulsés"
 KMT_70s_Reperations_for_deported_Chinese_desc:0 "Entre les années 1920 et 1940, de nombreux Chinois vivant dans l'Extrême-Orient russe ont été déportés de cette région vers les différents fiefs des seigneurs de la guerre en Chine. À présent que les tensions entre nous et Moscou s'apaisent, nous pourrions tenter de les approcher et peut-être exiger des excuses ainsi qu'une indemnisation pour les victimes de ces déportations."
 KMT_70s_invest_into_eastern_block:0 "Investir dans le bloc de l'Est"
 KMT_70s_invest_into_eastern_block_desc:0 "Pourquoi se limiter à l'URSS ? Nous allons étendre nos activités économiques et investir dans les entreprises les plus importantes de divers pays du Pacte de Varsovie."
 KMT_70s_Soviet_Rivalry:0 "Maintenir le cap"
 KMT_70s_Soviet_Rivalry_desc:0 "Notre histoire récente a montré qu'on ne peut jamais faire confiance aux Soviétiques. Il serait vain d'essayer de coopérer avec eux, car ils saisiraient la première occasion pour affaiblir notre régime et tenter de rétablir le régime communiste en Chine."
 KMT_70s_accept_soviet_enemies:0 "Accorder l'asile à des adversaires politiques"
 KMT_70s_accept_soviet_enemies_desc:0 "Les Soviétiques tentent de réduire au silence et d'arrêter tous ceux qui s'élèvent contre ce système communiste pourri. Nous accueillerons ces personnes opprimées à bras ouverts et leur offrirons l'asile dans notre pays."
 KMT_70s_demand_Tanu_Tuva:0 "Demander le Touva"
 KMT_70s_demand_Tanu_Tuva_desc:0 "Les Soviétiques occupent l'ancienne région chinoise de Touva depuis la révolution de Xinhai. Nous n'avons jamais reconnu la domination russe sur cette région, mais dans le chaos qui a suivi la révolution, nous n'étions pas en mesure de la reprendre, sans parler de la Mongolie. Il est de notre droit de ramener cette province dans les frontières chinoises."
 KMT_70s_Japanese_relations:0 "Notre ancien ennemi"
 KMT_70s_Japanese_relations_desc:0 "La première moitié du XXe siècle et la Seconde Guerre mondiale ont pratiquement anéanti toutes les relations que notre pays entretenait avec le Japon. Les horreurs des crimes commis par les Japonais pendant la guerre sont encore vivaces dans l'esprit des gens. Mais nous devons tout de même aller de l'avant et reconnaître que le Japon est aujourd'hui une nation transformée et que ses relations étroites avec les États-Unis le rapprochent idéologiquement de notre sphère d'influence. Nous devrions nous préparer à signer un traité de paix officiel qui normalisera les relations entre Pékin et Tokyo."
 KMT_70s_Forgive_Japan:0 "Pardonner les crimes japonais"
 KMT_70s_Forgive_Japan_desc:0 "Les temps ont changé, tout comme les Japonais. Si nous voulons aller de l'avant et améliorer nos relations, nous ne devons pas assimiler tous les Japonais d'aujourd'hui aux criminels de la Seconde Guerre mondiale. Bien sûr, nous ne pouvons pas oublier ce qui s'est passé, mais cela ne doit pas constituer un obstacle majeur au rétablissement des relations entre nos deux pays."
 KMT_70s_Demand_Japanese_Reperations:0 "Exiger des réparations"
 KMT_70s_Demand_Japanese_Reperations_desc:0 "Les crimes commis par les Japonais ont causé tant de souffrances et de douleur à de nombreuses familles chinoises. Le viol de Nankin, la bataille de Shanghai, l'unité 731... Nous exigerons des réparations pour ces crimes et une indemnisation pour les victimes de leur cruauté."
 KMT_70s_Sign_Joint_Communique:0 "Signer un communiqué conjoint"
 KMT_70s_Sign_Joint_Communique_desc:0 "Nous signerons un traité avec Tokyo afin de rétablir et de normaliser les relations diplomatiques entre le Japon et la République de Chine. Nous souhaitons préserver la paix en Asie de l'Est, mettre définitivement fin à la situation anormale qui règne entre nos deux pays et régler une fois pour toutes la question des réparations de guerre."
 KMT_70s_cooperate_with_japanese_Firms:0 "Collaborer avec des entreprises japonaises"
 KMT_70s_cooperate_with_japanese_Firms_desc:0 "Le marché japonais s'est révélé être une véritable source d'innovations technologiques. Panasonic, Sony... la liste est longue. Nous devrions coopérer avec ces entreprises afin d'optimiser notre efficacité et de favoriser l'innovation."
 KMT_70s_pact_relations:0 "Renforcer le Traité de Nankin"
 KMT_70s_pact_relations_desc:0 "Notre alliance s'est élargie au cours de la dernière décennie. La Corée, le Vietnam, la Mongolie et le Xinjiang sont tous tombés sous notre sphère d'influence. Nous devrions redoubler d'efforts pour renforcer notre alliance sur les plans politique et économique afin de conserver notre position dominante en Asie de l'Est."
 KMT_70s_treaty_of_equals:0 "Un traité entre égaux"
 KMT_70s_treaty_of_equals_desc:0 "Nous ne cherchons pas à exploiter nos frères pour notre propre profit. Nous allons transformer notre traité, qui passera d'une alliance militaire à une organisation institutionnelle similaire à la Communauté européenne. Nous réduirons notre influence sur les États membres et nous nous efforcerons de nouer des liens avec d'autres gouvernements de la région partageant les mêmes valeurs."
 KMT_70s_recall_chinese_officals:0 "Rappel des membres du KMT"
 KMT_70s_recall_chinese_officals_desc:0 "Plusieurs membres du KMT ont été envoyés auprès de nos alliés afin d'inciter leurs gouvernements à s'aligner davantage sur nos politiques. Cependant, compte tenu de notre nouvelle approche concernant le Traité de Nankin, nous ne souhaitons pas nous immiscer dans la politique intérieure d'autres nations. Nous rapatrierons nos représentants en Chine afin que nos alliés puissent décider eux-mêmes de leurs politiques."
 KMT_70s_grant_loans:0 "Prêts à la reconstruction"
 KMT_70s_grant_loans_desc:0 "Bon nombre de nos alliés ont traversé diverses guerres et divers conflits qui ont causé des destructions et des souffrances sur les territoires qu'ils administrent aujourd'hui. Nous leur accorderons des prêts afin de les aider à reconstruire ces pays et à y rétablir la stabilité."
 KMT_70s_decentralised_army_command:0 "Commandement décentralisé de l'armée"
 KMT_70s_decentralised_army_command_desc:0 "Alors que le Kuomintang a pris le commandement des troupes coréennes et vietnamiennes pendant la guerre anticommuniste, nous devrions rétablir notre structure afin que les gouvernements concernés reprennent le contrôle de leurs armées. Cela permettra d'éviter toute tentative de coup d'État de la part des forces pro-chinoises au sein du pacte."
 KMT_70s_establish_treaty_institutions:0 "Mettre en place les institutions prévues par le traité"
 KMT_70s_establish_treaty_institutions_desc:0 "Nous réformerons le Traité de Nankin afin qu'il devienne une organisation supranationale régionale plutôt qu'un simple traité défensif. Nous nous inspirerons des institutions de la Communauté européenne dans le but de créer une union économique unifiée en Asie de l'Est."
 KMT_70s_invite_more_countries:0 "Élargir le traité de Nankin"
 KMT_70s_invite_more_countries_desc:0 "Nous devrions encourager davantage de pays d'Asie de l'Est partageant les mêmes valeurs à rejoindre notre sphère d'influence. Nous élargirons notre champ d'action en matière de développement économique et établirons davantage de liens de dépendance, ce qui réduira considérablement le risque de conflits dans la région. Envoyons les invitations !"
 KMT_70s_tight_hand:0 "Une main serrée"
 KMT_70s_tight_hand_desc:0 "Pour tirer pleinement parti du traité, nous devons conserver notre position dominante. L'influence dans les autres pays est primordiale dans le domaine des relations internationales, et nous devons tirer parti de cette réalité en exerçant une influence sur les différents autres membres du traité."
 KMT_70s_centralised_army_command:0 "Commandement centralisé de l'armée"
 KMT_70s_centralised_army_command_desc:0 "Le Kuomintang a pris le commandement des troupes coréennes et vietnamiennes pendant la guerre anticommuniste. Nous devons conserver cette structure afin de rester la force dominante en Asie de l'Est. Les armées restent les acteurs les plus influents au sein d'un pays, et le fait de les contrôler nous conférera encore plus d'influence dans nos États membres."
 KMT_70s_reinforce_chinese_influence:0 "Renforcer l'influence chinoise"
 KMT_70s_reinforce_chinese_influence_desc:0 "Nous continuerons d'envoyer davantage d'espions et de responsables du KMT dans nos États membres dans le but d'infiltrer leurs gouvernements et d'exercer une plus grande influence sur leur programme politique."
 KMT_70s_chinese_companies_in_allied_markets:0 "L'influence économique de la Chine"
 KMT_70s_chinese_companies_in_allied_markets_desc:0 "Nous laisserons nos grandes entreprises investir dans nos États membres afin d'y étendre leur influence et, à terme, de rendre ces États dépendants de nous."
 KMT_70s_treaty_ports:0 "Les ports du traité"
 KMT_70s_treaty_ports_desc:0 ""
 KMT_70s_buy_treaty_ports:0 "Acheter à Hong Kong et à Macao"
 KMT_70s_buy_treaty_ports_desc:0 "Même si le bail officiel court jusqu’aux années 1990, nous pourrions peut-être demander aux Britanniques et aux Portugais s’ils sont disposés à restituer les ports plus tôt en échange d’une compensation financière. En raison de la décolonisation, ces deux pays sont confrontés à diverses difficultés économiques."
 roc.1.t:0 "Chiang Kai-shek reprend la présidence"
 roc.1.d:0 "Le temps presse pour le président Li Zongren. Suite à la démission du généralissime Tchang face aux multiples victoires communistes sur le continent, ce dernier et ses partisans en ont désormais assez des ambitions et de la politique de Li Zongren. Li et Tchang n’ont jamais été en bons termes et leur rivalité s’est avérée désastreuse pour la direction du KMT pendant la guerre civile, divisant davantage le parti et l’état-major de l’armée et permettant ainsi aux communistes de progresser plus loin dans les zones nationalistes. Li s'est rendu aux États-Unis où il a discrédité le généralissime en le qualifiant de « dictateur » et d'« usurpateur », affirmant qu'il reviendrait pour écraser le mouvement de Chiang. Chiang Kai-shek a désormais repris ses fonctions de président de la République de Chine, aux côtés de son ami de longue date Chen Cheng, qui remplace l'ancien Premier ministre Yan Xishan."
 roc.1.a:0 "Bon retour parmi nous !"
 KMT_Taiwan50s.1.t:0 "Sun Li-jen prend le pouvoir"
 KMT_Taiwan50s.1.d:0 "Au cours des derniers mois, Sun Li-jen, vétéran de la Seconde Guerre mondiale et célèbre héros de guerre, a manifesté à plusieurs reprises son mécontentement face à la structure gouvernementale du « généralissime » mise en place par le Kuomintang à Taïwan. Ayant suivi une formation en Virginie, il est le plus proche collaborateur de Washington au sein de la République et s'oppose aux réformes du parti léniniste, qui visent à infiltrer la société et l'armée sur le plan politique afin d'en garantir la loyauté. Grâce à ses relations avec les États-Unis et au succès de ses réformes au sein de l'armée, il a acquis suffisamment d'influence et de soutien pour renverser le gouvernement de Tchang Kaï-chek. Aux premières heures du matin, il a fait irruption dans le palais présidentiel aux côtés de ses bataillons fidèles, désarmant les gardes locaux et déchargeant le généralissime de ses fonctions. Le général Sun s'est désormais proclamé président provisoire de la République jusqu'à la formation d'un nouveau gouvernement. Les États-Unis n'ont pas donné de réponse officielle à cet événement, mais on peut supposer sans risque que Washington était au courant des récents développements à Taipei."
 KMT_Taiwan50s.1.a:0 "Mon allégeance va à la République, à la Démocratie !"
 KMT_Taiwan50s.2.t:0 "La sinisation de Taïwan"
 KMT_Taiwan50s.2.d:0 "Il y a plus de cinquante ans, la dynastie Qing a cédé l'île de Taïwan à l'Empire japonais après sa défaite lors de la première guerre sino-japonaise de 1895. Aujourd'hui, l'Empire ayant été vaincu par nos soins, Taïwan est enfin de nouveau sous souveraineté chinoise.\n\nIl reste toutefois beaucoup à faire pour guérir la population taïwanaise des maux causés par la colonisation et la nationalisation japonaises. Nous transformerons l'île en un modèle de véritable province chinoise moderne, en appliquant les Trois Principes du Peuple, démontrant ainsi que seule la vision du Dr Sun peut sauver la Chine, et non l'impérialisme soviétique."
 KMT_Taiwan50s.2.a:0 "À bas l'impérialisme !"
 KMT_Taiwan50s.3.t:0 "L'importance du néo-confucianisme"
 KMT_Taiwan50s.3.d:0 "Le grand Maître a dit un jour : « Ne pas cultiver la force morale, ne pas approfondir ce que j’ai appris, être incapable de défendre ce que je sais être juste, être incapable de réformer ce qui ne va pas : voilà ce qui m’inquiète. »\n\nLorsque le Kuomintang régnait sur le continent, il était malade, pourri jusqu’à la moelle et gangrené par l’opportunisme, la corruption et divers autres individus égoïstes qui ne croyaient pas en la cause du mouvement révolutionnaire national. Afin d’éviter une telle évolution à Taïwan, nous commencerons à introduire les enseignements de Confucius dans les institutions éducatives et gouvernementales, en mettant l’accent sur l’introspection et l’autocritique, encourageant notre peuple à examiner ses actions pour déterminer si elles sont bénéfiques à la République. Personne n’est parfait, pas même notre bien-aimé président, mais le fait de montrer qu’il reste fidèle aux normes et aux valeurs de Confucius et de la révolution renforcera considérablement le soutien populaire à ces enseignements."
 KMT_Taiwan50s.3.a:0 "Une leçon pleine de sagesse."
 KMT_Taiwan50s.4.t:0 "Le problème de la langue"
 KMT_Taiwan50s.4.d:0 "À notre arrivée à Taïwan, l'influence japonaise était profondément ancrée dans la société taïwanaise. On peut toutefois supposer que les Japonais ont mené de vastes campagnes culturelles visant à promouvoir la langue japonaise et à restreindre l'usage des langues locales. La population autochtone de Taïwan se caractérise par une grande diversité linguistique, mais le gouvernement du Kuomintang est aujourd'hui confronté à un dilemme : doit-il suivre l'exemple japonais en interdisant les langues locales et en privilégiant le mandarin, ou bien tolérer l'usage des langues locales ? D'un côté, nous gagnerions davantage de soutien populaire auprès de la population autochtone, mais si le mandarin ne se répand pas davantage sur l'île, transformer Taïwan en un modèle de province chinoise moderne s'avérera plus difficile et nous isolera davantage de la culture et des traditions chinoises, ce qui réduira notre crédibilité et notre légitimité en tant que seul gouvernement de la Chine."
 KMT_Taiwan50s.4.a:0 "Interdisons toutes les langues locales !"
 KMT_Taiwan50s.4.b:0 "Il faut simplement interdire le japonais et privilégier l'usage du mandarin dans les institutions publiques."
 KMT_Taiwan50s.4.c:0 "Accorder la liberté d'expression."
 KMT_Taiwan50s.5.t:0 "[GetNewspaperHeader]La voix de la Chine libre sur le continent"
 KMT_Taiwan50s.5.d:0 "Aujourd'hui, la Société chinoise de radiodiffusion a réussi à s'implanter en Chine continentale depuis Taïwan, en contournant l'emprise stricte du Parti communiste chinois sur les stations de radiodiffusion. La Voix de la Chine libre est une station de radio internationale de la République de Chine qui a commencé à émettre le 10 octobre 1949 et qui a depuis servi de source de propagande à la République de Chine, attaquant la Station centrale de radiodiffusion populaire et Radio Chine internationale, et dénonçant l'illégitimité du gouvernement communiste sur le continent. Le département des émissions à l'étranger de la China Broadcasting Corporation a officiellement commencé à diffuser vers le monde extérieur sous l'indicatif d'appel « Voice of Free China ». Au départ, les émissions étaient uniquement en chinois, en anglais et en japonais, puis se sont enrichies du coréen, du français, de l'allemand, de l'espagnol, du russe, de l'arabe, du vietnamien, de l'indonésien et d'autres langues. Il est évident que l'infiltration de la propagande des nationalistes chinois sur le continent ne sera pas bien accueillie par les communistes chinois."
 KMT_Taiwan50s.5.a:0 "La guerre de propagande en Chine se poursuit."
 KMT_Taiwan50s.6.t:0 "Le rapport économique"
 KMT_Taiwan50s.6.d:0 "Le ministère des Affaires économiques est parvenu à la conclusion que le gouvernement doit prendre des mesures drastiques pour stabiliser la situation économique actuelle sur l'île de Taïwan, allant des politiques de lutte contre l'inflation aux politiques agricoles, lesquelles auront également un impact crucial sur l'engagement politique et la réaction des citoyens de la République.\n\nLe Comité central de réforme a conclu que le fait de favoriser les propriétaires terriens et d'ignorer les revendications des paysans avait été un facteur majeur dans la chute du régime nationaliste sur le continent. Chen Cheng, ancien gouverneur de Taïwan et ami de longue date de Tchang Kaï-chek, a suggéré d'introduire diverses réformes agraires fondées sur l'indemnisation et la médiation, contrairement aux méthodes d'expropriation des réformes agraires marxistes en Russie, en Allemagne de l'Est et sur le continent occupé. Nous suivrons son conseil et commencerons à redistribuer les terres des propriétaires fonciers taïwanais aux paysans, tout en offrant aux anciens propriétaires des fonds publics et des postes politiques locaux.\n\nNos experts économiques ont également présenté des propositions pour faire face à la crise inflationniste actuelle que nous avons importée du continent. Heureusement, de nombreux plans mettant l'accent sur des réformes monétaires visant à freiner l'hyperinflation avaient déjà été mis en œuvre auparavant."
 KMT_Taiwan50s.6.a:0 "Commençons."
 KMT_Taiwan50s.7.t:0 "Une réunion à Taipei"
 KMT_Taiwan50s.7.d:0 "Aux premières heures du matin à Taipei, [CHI.GetLeader] attendait le Premier ministre, qui s'était révélé être un allié précieux pour le président grâce au succès de ses campagnes de réforme agricole et fiscale. Lorsque le Premier ministre entra dans la pièce, [CHI.GetLeader] fut surpris de le voir accompagné d'un autre homme d'âge mûr. Il se présenta au président sous le nom de Yin Zhongrong, membre du cabinet invité à rejoindre le Kuomintang par le président Li Zongren en 1949, occupant jusqu'à présent les fonctions de vice-président du Comité de gestion de la production du district de Taïwan et de président du Central Trust of China Bank. Il a également joué un rôle important lors du transfert des réserves d'or du continent vers Taïwan et a été chargé de la planification et de l'utilisation des fonds d'aide américains destinés à la république. Le Premier ministre fait valoir que, bien que Sir K. Y. Yin ne soit pas membre du Kuomintang, il devrait occuper le poste de notre prochain ministre des Affaires économiques. Son expérience au sein d'anciennes entreprises privées sur le continent et sa conception d'une « économie de marché planifiée », axée sur la substitution des importations et les politiques orientées vers l'exportation, pourraient s'avérer bénéfiques pour notre gouvernement, car nous devons bâtir une économie prospère afin de transformer Taïwan en un modèle moderne de province chinoise. \n[CHI.GetLeader] approuve ses arguments et tend la main à Sir Yin."
 KMT_Taiwan50s.7.a:0 "Monsieur Yin, nous suivrons votre carrière avec beaucoup d'intérêt."
 KMT_Taiwan50s.8.t:0 "The Temporary Provisions"
 KMT_Taiwan50s.8.d:0 "Lorsque la Constitution de la République de Chine fut rédigée et adoptée par l'Assemblée nationale en 1947, elle suscita une grande joie et de grands espoirs au sein du gouvernement, qui espérait enfin stabiliser la Chine et entamer la troisième phase de la révolution du Dr Sun Yat-sen, prônant le progrès du constitutionnalisme. Cependant, les avancées rapides du Parti communiste sur le continent et les désertions massives nous ont contraints à suspendre la Constitution et à instaurer la loi martiale dans la République jusqu'au retour de la stabilité et de l'ordre. Le PCC occupant le continent chinois et ayant proclamé un nouveau gouvernement, il est tout à fait naturel que l'Assemblée nationale approuve le renouvellement des dispositions jusqu'à ce que le continent soit entièrement libéré des bandits communistes."
 KMT_Taiwan50s.8.a:0 "Nous reviendrons."
 KMT_Taiwan50s.9.t:0 "La création du Comité central de réforme"
 KMT_Taiwan50s.9.d:0 "Le généralissime Tchang estime que la cause de la défaite lors de la guerre civile ne réside pas dans la puissance militaire, mais dans la désunion bureaucratique et institutionnelle. Tchang a précisé que, pour attirer des membres de haut niveau, « le calendrier des réformes devrait mettre l’accent sur l’importance de faire du parti une nouvelle organisation, dotée de nouvelles lignes directrices, de nouvelles exigences et de nouvelles missions ». Notre objectif est de vaincre le factionnalisme au sein du Kuomintang en écartant les différentes cliques qui ont désormais perdu leur influence, mais aussi en nous occupant des vétérans du parti qui ne coopèrent pas.\n\nLe généralissime a déclaré ce qui suit lors d'une réunion privée avec Chen Cheng : \n\n« Les membres du parti sont devenus grossiers et déraisonnables. Dans leur esprit, ils ne se soucient plus de la survie du parti et de l'État. Je dois me consacrer à la tâche de redresser le parti afin qu’il puisse survivre. Sans une réforme complète du parti, il n’y aura aucun espoir de sauver notre nation. »\n\nNous transformerons le Kuomintang en l’entité politique unie qu’il était à l’époque du Premier Front uni. Nous nous attacherons tout particulièrement à écarter les fonctionnaires corrompus et peu coopératifs, ainsi qu’à mettre fin au factionnalisme au sein du parti et au recrutement de la population taïwanaise locale."
 KMT_Taiwan50s.9.a:0 "Emphazise on Ideological Indoctrination"
 KMT_Taiwan50s.9.b:0 "Mettre l'accent sur les campagnes de lutte contre la corruption"
 KMT_Taiwan50s.9.c:0 "Mettre l'accent sur l'obtention d'un soutien local"
 KMT_Taiwan50s.10.t:0 "Les trois principes du peuple"
 KMT_Taiwan50s.10.d:0 "Les « Trois Principes du Peuple », également connus sous le nom de « doctrine San-min » ou « tridéisme », constituent la philosophie politique fondamentale du Kuomintang, élaborée par le père de la révolution nationale, le Dr Sun Yat-sen. Ils ont servi de ligne directrice pour le développement de la Chine à l'époque républicaine et peuvent se résumer en trois mots : « démocratie, nationalisme et bien-être ».\n\nLe « Minzu », premier principe, prône le développement d'une identité nationale plutôt que d'une identité ethnique et appelle à l'indépendance de l'ensemble du peuple chinois face aux menaces impérialistes extérieures et à la domination interne des minorités.\n\nLe « Minquan », souvent traduit par « démocratie », défend le droit du peuple chinois à exprimer ses opinions politiques et à contrôler les fonctions administratives, représentées par l'Assemblée nationale. Ces droits comprennent le droit de vote, le droit de révocation, le droit d'initiative et le droit d'organiser des référendums. Le système politique doit être divisé en cinq branches distinctes au lieu de trois seulement. \n\nL'État est divisé en un Yuan législatif, exécutif, judiciaire, de contrôle et d'examen, combinant la pensée montesquieuane avec la tradition chinoise. Ce principe est également fortement influencé par la pensée d’Henry George, qui prônait l’imposition foncière en affirmant que « le seul moyen de soutenir le gouvernement est un impôt infiniment juste, raisonnable et équitablement réparti, et c’est sur cela que nous fonderons notre nouveau système ».\n\nSur le continent, nous n’avons pas réussi à mettre en œuvre ces principes, mais à partir de maintenant, nous consacrerons toutes nos ressources et tous nos efforts à l’achèvement de la révolution nationale sous l’égide des Trois Principes du Peuple."
 KMT_Taiwan50s.10.a:0 "Nous mettrons l'accent sur Minzu. L'union fait la force."
 KMT_Taiwan50s.10.b:0 "Minquan doit d'abord être présenté au public."
 KMT_Taiwan50s.10.c:0 "Minsheng nous apportera davantage de soutien populaire."
 KMT_Taiwan50s.11.t:0 "Évaluation des réformes du parti"
 KMT_Taiwan50s.11.d:0 "Aujourd’hui, le Kuomintang a tenu son premier congrès depuis la perte de la Chine continentale et a officiellement annoncé la dissolution du Comité central de réforme. Le généralissime Tchang et le Premier ministre Chen sont désormais à la tête du Kuomintang, écartant ainsi toutes les factions politiques restantes. Grâce à cet effort de réforme, un nouveau régime politique a été mis en place et, bien que nous n'ayons pas encore pu reprendre le continent, nous avons réussi à transformer le Kuomintang, vaincu et démoralisé, en un nouveau parti politique inclusif. Le Comité de réforme a réussi à mettre en place une nouvelle direction du parti composée de cadres jeunes et talentueux, tout en donnant au KMT une identité et un objectif, et en créant diverses écoles de formation pour former les membres du parti afin de pénétrer et de restructurer efficacement la société, l'économie et la politique."
 KMT_Taiwan50s.11.a:0 "L'ère de l'autoritarisme éclairé a commencé."
 KMT_Taiwan50s.12.t:0 "Mise en place d'une équipe de planification"
 KMT_Taiwan50s.12.d:0 "Le président [CHI.GetLeader] a convoqué ses plus proches alliés au sein de l'armée républicaine afin de faire le point sur l'évolution de la situation au sein des forces armées à la suite des réformes menées ces derniers mois. L'état-major estime que « l'armée républicaine est prête à résister à toute attaque venant des zones occupées par les communistes » et a assuré au président que Formosa était prête à faire face à tout type d'attaque que l'APL pourrait lancer. Le président a souri et a annoncé à ses camarades que la deuxième phase de son plan serait planifiée et organisée très prochainement."
 KMT_Taiwan50s.12.a:0 "La libération du continent est inévitable."
 KMT_Taiwan50s.13.t:0 "La réélection du généralissime Tchang"
 KMT_Taiwan50s.13.d:0 "Aujourd’hui, au palais Chung-Shan à Taipei, le généralissime Tchang Kaï-chek a été réélu président par l’Assemblée nationale de la République de Chine. Bien que cette élection ne se déroule pas au suffrage universel, elle est menée par les délégués des provinces chinoises qui ont constitué la première Assemblée nationale en 1947, agissant en tant que représentants de l’ensemble de la Chine. Le président Chiang continuera d'exercer les fonctions de président et de commandant en chef de la République ; il nous guidera à travers ces temps difficiles et reprendra le continent occupé aux bandits communistes."
 KMT_Taiwan50s.13.a:0 "Wansui !"
 KMT_Taiwan50s.14.t:0 "Construire la démocratie à partir de la base"
 KMT_Taiwan50s.14.d:0 "Afin de renforcer la légitimité du parti, nous devons mettre en place diverses réformes politiques locales en nous appuyant sur le concept de « démocratie révolutionnaire flexible ». En autorisant des élections démocratiques limitées au niveau local, nous élargirons la base sociale du Kuomintang et engagerons progressivement la République dans un long processus de démocratisation, qui débutera au niveau local pour aboutir finalement au niveau national. Bien que ces élections aient pour objectif d'être équitables et compétitives, nous les surveillerons de près et interviendrons si des espions antirévolutionnaires et communistes venaient à occuper des positions importantes dans nos provinces."
 KMT_Taiwan50s.14.a:0 "En route vers le deuxième principe."
 KMT_Taiwan50s.144.t:0 "Construire la démocratie à partir de la base"
 KMT_Taiwan50s.144.d:0 "Afin de renforcer la légitimité de la structure politique républicaine, nous devons mettre en place diverses réformes politiques locales fondées sur le principe de la démocratie libérale directe. En autorisant des élections démocratiques au niveau local, telles que les élections municipales et celles des conseils municipaux, nous élargirons notre base de soutien et engagerons progressivement la République dans un processus de démocratisation, en commençant par le niveau local pour aboutir finalement au niveau national. Ces élections devront être équitables et compétitives ; par conséquent, nous ne les surveillerons pas de près et éviterons toute ingérence, même si une partie de l'opposition venait à remporter le vote populaire."
 KMT_Taiwan50s.144.a:0 "En route vers le deuxième principe."
 KMT_Taiwan50s.15.t:0 "Lei Chen a été exclu du Kuomintang"
 KMT_Taiwan50s.15.d:0 "À la suite de nos récentes campagnes de censure contre les éléments déloyaux au sein de la République, le Comité permanent du Kuomintang a décidé d'exclure Lei Chen, fondateur et directeur du journal « Free China », du Kuomintang. Son journal relayait diverses idées politiques qui constituent une grave menace pour notre gouvernement, notamment l'autonomie des populations autochtones, les élections démocratiques et l'abolition du régime à parti unique. À l'origine anticommuniste, le journal a vu ses positions séparatistes se renforcer considérablement et a dénoncé à de nombreuses reprises le gouvernement du KMT, critiquant l'absence de constitutionnalisme et la prolongation de la loi martiale. Afin de préserver la stabilité et l'ordre, le gouvernement a décidé d'exclure Lei du parti et a placé Free China sous étroite surveillance."
 KMT_Taiwan50s.15.a:0 "Ils ne sont que de la poussière emportée par le vent."
 KMT_Taiwan50s.16.t:0 "Le Rapport sur la Chine libre"
 KMT_Taiwan50s.16.d:0 "Au cours des derniers mois, le célèbre journal « Free China », dirigé par Hu Shih et publié par Lei Chen, a connu une augmentation significative de son tirage. Nos responsables indiquent que les Taïwanais de souche, en particulier, manifestent un vif intérêt pour ce journal, notamment pour les articles traitant de l'autonomie, des réformes démocratiques et d'une coopération plus étroite entre les réfugiés du continent et la population autochtone de Taïwan afin de bâtir une société chinoise moderne et démocratique. Bien que ces idées soient considérées comme absurdes aux yeux du gouvernement du Kuomintang, la fermeture du journal irait à l'encontre de notre politique de censure modérée et mécontenterait les abonnés locaux, déstabilisant encore davantage le pays."
 KMT_Taiwan50s.16.a:0 "Gardez un œil sur le journal..."
 KMT_Taiwan50s.17.t:0 "L'ascension du Parti démocratique chinois"
 KMT_Taiwan50s.17.d:0 "Lorsque l'Armée populaire de libération, traîtresse, s'empara de la Chine continentale, les divers intellectuels sinolibéraux de la République, formés aux États-Unis d'Amérique, s'enfuirent à Taipei aux côtés du Kuomintang. Mécontents du régime autoritaire du KMT à Taïwan, un cercle autour de l'ancien membre du parti Lei Chen, comprenant des universitaires et des hommes politiques chinois et taïwanais de renom tels que Hu Shih, Hsu-Shih-hsien, Huang Hua et Wellington Koo, a critiqué le gouvernement pour ses mesures autoritaires et sa répression de la population autochtone. En réponse, Lei Chen a organisé un nouveau mouvement politique qu’il appelle le « Parti démocratique chinois », exigeant des réformes démocratiques, une coopération plus étroite entre les continentaux et les Taïwanais de souche, ainsi qu’un anticommunisme pacifique. Ce nouveau parti a pris une telle ampleur que notre gouvernement ne peut plus l'ignorer, et nous devons décider comment aborder cette évolution récente. Nous pourrions tenter d'inviter la CDL à rejoindre le gouvernement, mais nous risquerions alors de perdre le soutien et la légitimité nécessaires à la reconquête inévitable du continent occupé, ce qui pourrait gravement menacer notre position en tant que seul gouvernement légitime de la Chine. Cependant, dissoudre le parti par la force provoquerait une vive dissidence au sein des factions démocratiques et autochtones, non seulement du Kuomintang, mais aussi de l'ensemble de la zone libre de la République de Chine, étant donné que même des personnalités influentes au sein du Kuomintang appellent Chiang à respecter la Constitution et à ne pas briguer un nouveau mandat."
 KMT_Taiwan50s.17.a:0 "Contacter le CDP"
 KMT_Taiwan50s.17.b:0 "Assez de ce cirque de clowns ! Mettez-y un terme."
 KMT_Taiwan50s.18.t:0 "Allongement de la durée du mandat des membres du Yuan législatif"
 KMT_Taiwan50s.18.d:0 "Lorsque le peuple chinois a enfin été autorisé à exercer son droit de vote, le premier Yuan législatif institué en vertu de la Constitution de 1947 de la République de Chine s'est réuni en 1948 ; il était composé de 759 représentants des provinces chinoises, dont plus de la moitié des mandats se sont retirés à Taïwan à nos côtés. Afin de préserver notre légitimité en tant que seul gouvernement de la Chine, nous ne pouvons autoriser aucune nouvelle élection tant que le continent n'aura pas été définitivement libéré des bandits communistes. Sinon, aucun groupe de représentants élus dans la zone libre de la République ne représenterait les intérêts et les aspirations de l'ensemble de la population chinoise. C'est pour cette raison que le gouvernement du Kuomintang a décidé de reporter l'élection du Yuan législatif, en maintenant en fonction l'ancien groupe de représentants du continent."
 KMT_Taiwan50s.18.a:0 "C'est pour le bien de la République."
 KMT_Taiwan50s.19.t:0 "Le destin de la famille Chiang"
 KMT_Taiwan50s.19.d:0 "Le généralissime et son fils ayant été démis de leurs fonctions, la junte est confrontée à la question de savoir quoi faire des deux Chiang et de leur famille, et quel rôle ils devraient désormais jouer. Alors que diverses voix s'élèvent pour réclamer soit leur exil aux États-Unis, soit leur assignation à résidence, Chiang Kai-shek jouit toujours d'un grand prestige au sein du Kuomintang, même en dehors de sa faction, en raison de ses exploits lors de l'Expédition du Nord, au début de la guerre civile et pendant la Guerre de résistance, où il fut le symbole central de la résistance chinoise contre l'impérialisme japonais. C'est pourquoi le gouvernement provisoire décide que Chiang Kai-shek et sa famille..."
 KMT_Taiwan50s.19.a:0 "...sera exilé aux États-Unis."
 KMT_Taiwan50s.19.b:0 "...doivent être assignés à résidence."
 KMT_Taiwan50s.19.c:0 "...peuvent rester à Taipei en tant que simples citoyens."
 KMT_Taiwan50s.20.t:0 "Le débat entre les candidats à la vice-présidence"
 KMT_Taiwan50s.20.d:0 "Chiang Kai-shek ayant été écarté du pouvoir, la junte débat actuellement pour déterminer qui devrait occuper les autres postes politiques clés pour le moment. Il a été rapidement convenu que l'ancien Premier ministre Yan Xishan reprendrait ses fonctions de Premier ministre par intérim, mais le poste de vice-président de la République suscite des tensions au sein de la junte.\nLa première option serait Kuo Ting-liang, l'allié le plus proche de Sun Li-jen et commandant de division, qui sert le président depuis les campagnes de Birmanie pendant la Seconde Guerre mondiale ; sa position anticommuniste et pro-américaine fait de lui le candidat favori de nos alliés à Washington.\nCependant, plusieurs responsables au sein du gouvernement provisoire ont perçu le potentiel des réformes menées par Chen Cheng pendant son mandat sous Chiang Kai-shek et estiment que, sous étroite surveillance, Chen continuera de se révéler un homme politique pragmatique et réaliste pour notre gouvernement ; mais son ancienne alliance et son amitié avec le Generalissimo suscitent de sérieux doutes à Washington et parmi les voix libérales au sein de la République.\n Wu Guozhen est le candidat favori de l'aile libérale du Kuomintang. Il prône une plus grande autonomie pour le peuple taïwanais, des élections locales au suffrage universel, ainsi que la réduction des violences policières, tout en s'opposant à la politique de type russe de Chiang Ching-kuo et au régime autoritaire à parti unique de Chiang Kai-shek.\n\nAprès mûre réflexion et consultation, le gouvernement provisoire choisit..."
 KMT_Taiwan50s.20.a:0 "Chen Cheng conservera son poste."
 KMT_Taiwan50s.20.b:0 "Kuo Ting-liang deviendra vice-président par intérim."
 KMT_Taiwan50s.20.c:0 "Wu Guozhen, ancien maire de Shanghai."
 KMT_Taiwan50s.22.t:0 "Le débat entre les candidats à la vice-présidence"
 KMT_Taiwan50s.22.d:0 "Chiang Kai-shek ayant été écarté du pouvoir, la junte débat actuellement pour déterminer qui devrait occuper les autres postes politiques clés pour le moment. Il a été rapidement convenu que l'ancien Premier ministre Yan Xishan reprendrait ses fonctions de Premier ministre par intérim, mais le poste de vice-président de la République suscite des tensions au sein de la junte.\nLa première option serait Kuo Ting-liang, l'allié le plus proche de Sun Li-jen et commandant de division, qui sert le président depuis les campagnes de Birmanie pendant la Seconde Guerre mondiale ; sa position anticommuniste et pro-américaine fait de lui le candidat favori de nos alliés à Washington.\nWu Guozhen est le candidat favori de l'aile libérale du Kuomintang. Il prône une plus grande autonomie pour le peuple taïwanais, des élections locales au suffrage universel, ainsi que la réduction des violences policières, tout en s'opposant à la politique de type russe de Chiang Ching-kuo et au régime autoritaire à parti unique de Chiang Kai-shek.\n\nAprès mûre réflexion et consultation, le gouvernement provisoire choisit..."
 KMT_Taiwan50s.22.b:0 "Le lieutenant-colonel Kuo Ting-liang deviendra vice-président par intérim."
 KMT_Taiwan50s.22.c:0 "Wu Guozhen, ancien maire de Shanghai."
 KMT_Taiwan50s.21.t:0 "Le destin de Chen Cheng"
 KMT_Taiwan50s.21.d:0 "Bien qu'il ne fasse pas officiellement partie de la famille Tchang, Chen Cheng entretient une amitié très solide avec Tchang Kaï-chek depuis leurs premières années à Whampoa. Sa loyauté peut certes poser problème, mais il convient de saluer le succès et l'efficacité des propositions de réforme de Chen en matière d'agriculture, de politique budgétaire et d'infrastructures. Au sein du gouvernement provisoire, de nombreuses voix s'élèvent pour recommander que nous le gardions à l'œil dans notre cercle politique et que nous tirions parti de ses réformes pragmatiques ; cependant, certains craignent fortement que son amitié avec Chiang Kai-shek ne cause des problèmes à l'avenir."
 KMT_Taiwan50s.21.a:0 "Gardons-le au sein de notre gouvernement. C'est quelqu'un de très précieux."
 KMT_Taiwan50s.21.b:0 "Excluez-le de toutes ses fonctions !"
 KMT_Taiwan50s.23.t:0 "L'affaire Kuo-Ting-liang"
 KMT_Taiwan50s.23.d:0 "La « soviétisation » de la société et des forces armées menée par Chiang Ching-kuo a permis au Kuomintang de renforcer son emprise et son influence sur la population taïwanaise et ses membres, mais de nombreuses voix s'élèvent au sein de l'armée pour s'opposer fermement à ces réformes, en particulier parmi les diplômés de l'Institut militaire de Virginie aux États-Unis. L'un des plus éminents d'entre eux est Sun Li-jen, mais en raison de notre dépendance vis-à-vis des États-Unis et de son statut de héros de guerre, nous ne pouvions prendre aucune mesure à son encontre. Mais aujourd'hui, une poignée de ses subordonnés ont été arrêtés et interrogés par la police secrète de Ching-kuo. Le lieutenant-colonel Kuo Ting-liang, un proche subordonné de Sun, a avoué être un espion du Parti communiste, ayant suivi Sun à Taïwan sous couverture pour infiltrer le Kuomintang et préparer un coup d'État contre le gouvernement de Tchang Kaï-chek."
 KMT_Taiwan50s.23.a:0 "Arrêtez ces conspirateurs !"
 KMT_Taiwan50s.25.t:0 "Sun Li-jen a été arrêtée à Taipei"
 KMT_Taiwan50s.25.d:0 "Pendant la Seconde Guerre mondiale, la coopération avec le gouvernement de Tchang Kaï-chek s'est avérée pour le moins compliquée, compte tenu de la réticence de Tchang à écouter nos conseillers et de son insatiable soif d'armes et de munitions. Cependant, l'entourage de Sun Li-jen, diplômé de l'Institut de Virginie, qui a combattu aux côtés de notre mission en Chine en Birmanie, a toujours constitué notre porte d'entrée vers le gouvernement du KMT, jusqu'à présent. Les rapports de nos conseillers locaux indiquent que le général a été arrêté par la police secrète, à la suite des aveux d'un subordonné qui espionnait pour le compte du Parti communiste chinois. Cela réduira considérablement nos ressources politiques pour influencer le gouvernement de Taipei et renforcera le règne autoritaire de la famille Chiang. Mais dans le cadre de la politique d'endiguement du président Truman, nous sommes tenus de continuer à soutenir les régimes anticommunistes en Asie, face aux menaces émanant de tout mouvement communiste."
 KMT_Taiwan50s.25.a:0 "C'est dommage."
 KMT_Taiwan50s.24.t:0 "L'état de la bureaucratie"
 KMT_Taiwan50s.24.d:0 "Sous le règne de la famille Chiang, d'innombrables Taïwanais de souche ont été victimes de répression, de terreur et de torture. L'incident du 27 février a fait basculer l'image du Kuomintang, qui est passé de « libérateur » à « répresseur » ; aux yeux de la population locale, nous ne valons pas mieux que les impérialistes japonais. Une fois l'ancien gouvernement renversé, nous avons commencé à jeter les bases d'un climat libéral, égalitaire et tolérant à Taïwan, et nous continuerons dans cette voie. Cependant, la question de savoir s'il faut intégrer la population autochtone dans la structure bureaucratique de la République ou conserver notre personnel continental pour le moment reste ouverte. La première option renforcerait considérablement le soutien local à notre gouvernement, mais au prix d'une perte potentielle de l'identité chinoise et de notre affiliation avec la Chine dans son ensemble, tandis que la seconde option renforcerait notre légitimité en tant que gouvernement chinois, mais au prix d'une perte de soutien de la part de la population autochtone."
 KMT_Taiwan50s.24.a:0 "Les continentaux et les autochtones dirigeront ensemble l'administration !"
 KMT_Taiwan50s.24.b:0 "Les autochtones ne sont pas encore prêts."
 KMT_Taiwan50s.26.t:0 "[GetNewspaperHeader]Fin du régime militaire en République de Chine"
 KMT_Taiwan50s.26.d:0 "Plus tôt dans la journée, lors d'une conférence de presse à Taipei, le gouvernement militaire provisoire du général Sun Li-jen a annoncé la fin du régime militaire en République de Chine. À la suite de la destitution du généralissime Tchang Kaï-chek, la junte a mis en place diverses mesures politiques visant à rétablir l'ordre constitutionnel conformément à la Constitution chinoise de 1947. Dans sa récente déclaration, le président provisoire Sun Li-jen a annoncé que son gouvernement se retirerait afin de permettre l'élection d'un nouveau gouvernement. À l'heure actuelle, l'Assemblée nationale fait office d'instance gouvernementale provisoire jusqu'aux prochaines élections, qui devraient avoir lieu sous peu."
 KMT_Taiwan50s.26.a:0 "Une démocratie chinoise ?"
 KMT_Taiwan50s.27.t:0 "L'aile socio-libérale du Kuomintang"
 KMT_Taiwan50s.27.d:0 "Après la destitution de la famille Tchang, toute la structure du Kuomintang a été réorganisée. Le cercle autoritaire formé autour de Tchang Kaï-chek et de Tchang Ching-kuo, issu de l'éducation soviétique, a été écarté, et de nouvelles factions ont pris de l'importance. L'un de ces cercles rassemble une grande diversité d'esprits libéraux chinois, notamment des diplomates, des universitaires et des politiciens défendant des convictions sociales libérales et démocratiques telles que l'autonomie locale, la protection des minorités, la diplomatie, le renforcement et la protection des droits constitutionnels et l'économie mixte. Son membre le plus éminent est Sun Fo, homme d’État et fils du fondateur de la République, Sun Yat-sen, qui avait été un fervent détracteur des politiques de Tchang Kaï-chek mais n’avait pas pu être purgé par le Generalissimo en raison de son statut de fils de son ancien mentor. Parmi les autres membres figurent plusieurs personnalités revenues d’exil aux États-Unis après la destitution de Tchang, telles que l’ancien gouverneur de Taïwan, Wu Guozhen, le social-démocrate et philosophe Zhang Junmai ou l’intellectuel néo-confucéen Xu Fuguan."
 KMT_Taiwan50s.27.a:0 "Compris"
 KMT_Taiwan50s.28.t:0 "L'aile libérale du Kuomintang"
 KMT_Taiwan50s.28.d:0 "L'autre grande faction en lice pour le pouvoir législatif dans la République est composée d'anciens hommes politiques ayant travaillé pour le gouvernement nationaliste sous Chiang Kai-shek. Ce qui les distingue toutefois de la famille Chiang, c'est leur position apolitique et leur vision réaliste des politiques, cherchant à améliorer l'efficacité dans divers domaines tels que la médecine, l'agriculture, les transports et surtout les questions économiques. Ils considéraient le projet de Tchang Kaï-chek de reconquérir le continent par la force militaire comme une illusion, et leurs réformes efficaces ont convaincu le gouvernement provisoire de ne pas les écarter de la sphère politique. Parmi les personnalités les plus célèbres de cette faction figurent Chen Cheng, ancien collaborateur du Generalissimo et vétéran de la guerre civile, qui s'est illustré par ses réformes en matière de redistribution des terres agricoles et d'infrastructures, ainsi que Chang Li-sheng, ancien vice-Premier ministre sous Chen Cheng et actuel ambassadeur au Japon, chargé de la mise en œuvre des réformes économiques et foncières de Chen Cheng. Ils soutiennent un programme libéral marqué, mettant l'accent sur la privatisation économique, les droits individuels et une gouvernance efficace, et visent également à maintenir et à améliorer les relations avec les États-Unis d'Amérique."
 KMT_Taiwan50s.28.a:0 "D'accord."
 KMT_Taiwan50s.29.t:0 "L'aile libérale du Kuomintang"
 KMT_Taiwan50s.29.d:0 "L'autre grande faction en lice pour le pouvoir législatif dans la République est composée d'anciens hommes politiques ayant travaillé pour le gouvernement nationaliste sous Chiang Kai-shek. Ce qui les distingue toutefois de la famille Chiang, c'est leur position apolitique et leur vision réaliste des politiques, cherchant à améliorer l'efficacité dans divers domaines tels que la médecine, l'agriculture, les transports et surtout les questions économiques. Ils considéraient le projet de Tchang Kaï-chek de reconquérir le continent par la force militaire comme une illusion, et leurs réformes efficaces ont convaincu le gouvernement provisoire de ne pas les écarter de la sphère politique. Parmi les personnalités les plus célèbres de cette faction figurent Chang Li-sheng, ancien vice-Premier ministre sous Chen Cheng et actuel ambassadeur au Japon, chargé de la mise en œuvre des réformes économiques et agraires de Chen Cheng, qui ont contribué à apaiser le conflit social tendu entre anciens propriétaires terriens et paysans. Parmi les autres membres notables figurent l'ancien ministre de l'Économie, Yin Chung-jung, l'homme politique et universitaire Wang Yun-wu, et l'actuel président de l'Academia Sinica, Zhu Jiahua. Ils soutiennent un programme libéral marqué, mettant l'accent sur la privatisation économique, les droits individuels et une gouvernance efficace, et visent également à maintenir et à améliorer les relations avec les États-Unis d'Amérique."
 KMT_Taiwan50s.29.a:0 "D'accord."
 KMT_Taiwan50s.31.t:0 "Le Parti démocratique chinois"
 KMT_Taiwan50s.31.d:0 "À la suite de l'abrogation de la loi sur le parti unique, l'entourage de Lei Chen, ancien membre du KMT, a fondé le Parti démocratique chinois, un groupe d'intérêt regroupant divers militants taïwanais qui prônent la démocratie multipartite, l'autonomie locale et des politiques visant à créer une société multiculturelle à Taïwan, composée de Chinois Han et d'autochtones taïwanais. Leur journal affilié, « Free China », s'en prend aux politiques autoritaires et nationalistes du Kuomintang et enregistre une augmentation du nombre d'abonnés dans les zones rurales de la République. Le CDP est sans aucun doute devenu une force à prendre au sérieux et pourrait s'avérer être un parti efficace, capable d'instaurer une culture politique du pluralisme, que ce soit en tant qu'opposition au Kuomintang ou en tant que partenaire de coalition."
 KMT_Taiwan50s.31.a:0 "Très bien"
 KMT_Taiwan50s.30.t:0 "Les premières élections nationales"
 KMT_Taiwan50s.30.d:0 "Pour la première fois depuis 1948, les citoyens de la République se sont enfin rendus aux urnes pour décider de l'avenir de leur pays. Non seulement les milieux politiques, mais aussi les citoyens ordinaires ont vécu cette période avec beaucoup d'enthousiasme tout au long de la campagne des différents candidats. Et aujourd'hui, après le dépouillement de tous les bulletins, nous connaissons le résultat qui nous guidera au cours des quatre prochaines années."
 KMT_Taiwan50s.30.a:0 "Sun Fo et les libéraux-sociaux remportent la majorité."
 KMT_Taiwan50s.30.b:0 "Les libéraux-démocrates de Chang Li-sheng l'emportent."
 KMT_Taiwan50s.33.t:0 "Les premières élections nationales"
 KMT_Taiwan50s.33.d:0 "Pour la première fois depuis 1948, les citoyens de la République se sont enfin rendus aux urnes pour décider de l'avenir de leur pays. Non seulement les milieux politiques, mais aussi les citoyens ordinaires ont vécu cette période avec beaucoup d'enthousiasme tout au long de la campagne des différents candidats. Et aujourd'hui, après le dépouillement de tous les bulletins, nous connaissons le résultat qui nous guidera au cours des quatre prochaines années."
 KMT_Taiwan50s.33.a:0 "Sun Fo et les libéraux-sociaux remportent la majorité."
 KMT_Taiwan50s.33.b:0 "Les libéraux-démocrates de Chen Cheng l'emportent."
 KMT_Taiwan50s.32.t:0 "Les premières élections nationales"
 KMT_Taiwan50s.32.d:0 "Pour la première fois depuis 1948, les citoyens de la République se sont enfin rendus aux urnes pour décider de l'avenir de leur pays. Non seulement les milieux politiques, mais aussi les citoyens ordinaires ont vécu cette période avec beaucoup d'enthousiasme tout au long de la campagne des différents candidats. Et aujourd'hui, après le dépouillement de tous les bulletins, nous connaissons le résultat qui nous guidera au cours des quatre prochaines années."
 KMT_Taiwan50s.32.a:0 "Sun Fo et les libéraux-sociaux remportent la majorité."
 KMT_Taiwan50s.32.b:0 "Chen Cheng et les libéraux-démocrates l'emportent."
 KMT_Taiwan50s.32.c:0 "Le Parti démocratique chinois remporte la majorité des voix."
 KMT_Taiwan50s.34.t:0 "Les premières élections nationales"
 KMT_Taiwan50s.34.d:0 "Pour la première fois depuis 1948, les citoyens de la République se sont enfin rendus aux urnes pour décider de l'avenir de leur pays. Non seulement les milieux politiques, mais aussi les citoyens ordinaires ont vécu cette période avec beaucoup d'enthousiasme tout au long de la campagne des différents candidats. Et aujourd'hui, après le dépouillement de tous les bulletins, nous connaissons le résultat qui nous guidera au cours des quatre prochaines années."
 KMT_Taiwan50s.34.a:0 "Sun Fo et les libéraux-sociaux remportent la majorité."
 KMT_Taiwan50s.34.b:0 "Chang Li-sheng et les libéraux-démocrates l'emportent."
 KMT_Taiwan50s.34.c:0 "Le Parti démocratique chinois remporte la majorité des voix."
 KMT_Taiwan50s.35.t:0 "[GetNewspaperHeader] [VIE.GetLeader] visite Taipei"
 KMT_Taiwan50s.35.d:0 "À l'issue de la cérémonie d'accueil à l'aéroport de Taipei Songshan, le président vietnamien [VIE.GetLeader] a été officiellement reçu par [CHI.GetLeader] au palais présidentiel de Taipei. Selon des déclarations de la présidence, [VIE.GetLeader] a été invité au nom du gouvernement de Taipei afin de discuter des plans et stratégies à venir concernant les rébellions communistes en Chine et au Vietnam, et les deux dirigeants ont examiné diverses options telles que des programmes d'échange, des livraisons d'armes et le partage d'expertise militaire. Le Parti communiste chinois et le Politburo du Parti communiste de l'Union soviétique ont vivement critiqué cette rencontre, la qualifiant de simples négociations scénarisées entre deux régimes fantoches des États-Unis d'Amérique. Les spécialistes en sciences politiques considèrent ces rencontres comme la preuve d'une montée des tensions entre les deux blocs en Asie de l'Est et prédisent que les politiques à venir s'inscriront dans une perspective strictement réaliste."
 KMT_Taiwan50s.35.a:0 "Les tensions en Indochine semblent s'intensifier encore davantage..."
 KMT_Taiwan50s.36.t:0 "La situation en Indochine"
 KMT_Taiwan50s.36.d:0 "Pendant la dernière guerre, les Japonais ont arraché l'Indochine aux Français et y ont instauré un régime brutal. Cependant, la résistance vietnamienne a combattu avec ténacité d'abord les Français, puis les Japonais, en utilisant souvent la Chine comme base principale. À la fin de la guerre, la Chine a occupé le nord du Vietnam jusqu'au retour des Français. La France cherche aujourd'hui à rétablir le statu quo d'avant-guerre, mais elle est désormais confrontée à divers soulèvements menés par le Viet Quoc au Vietnam. Nous entretenons des liens étroits avec le Vietnam, notamment par l'intermédiaire du VNQDD et des États-Unis d'Amérique. Nous aiderons le gouvernement vietnamien à Saigon afin de garantir qu'aucune faction communiste vietnamienne ne devienne dominante et de faire en sorte que les anticommunistes l'emportent."
 KMT_Taiwan50s.36.a:0 "Compris"
 KMT_Taiwan50s.37.t:0 "Une invitation de Taipei"
 KMT_Taiwan50s.37.d:0 "Le bureau présidentiel de Saigon a été informé que [CHI.GetLeader], président de la République de Chine, nous a invités à une réunion à Taipei. Le gouvernement du KMT souhaite vivement nouer des liens étroits avec d’autres régimes d’Asie de l’Est, eux aussi confrontés à des soulèvements révolutionnaires, afin d’avoir une vue d’ensemble de la situation géopolitique et d’élaborer des stratégies communes visant à débarrasser les campagnes des mouvements révolutionnaires totalitaires. Selon certaines rumeurs, cette invitation aurait été envoyée au nom des États-Unis d'Amérique, qui cherchent à renforcer davantage l'alliance anticommuniste en Asie du Sud-Est."
 KMT_Taiwan50s.37.a:0 "Nous y assisterons avec grand intérêt."
 KMT_Taiwan50s.38.t:0 "L'influence du Kuomintang en hausse"
 KMT_Taiwan50s.38.d:0 "À la suite de la coopération mise en place ces derniers mois entre notre gouvernement et la République de Chine, le VNQDD a vu son soutien et ses ressources politiques s'accroître. Il ne fait aucun doute que le KMT cherche à soutenir le parti dans ses objectifs politiques, compte tenu de son adhésion aux Trois Principes du Peuple, la philosophie d'État de Sun Yat-sen, membre fondateur du KMT. Bien que nous ne puissions pas nous permettre de rompre nos liens avec le Kuomintang, nous devrions accorder davantage d'attention à nos nouveaux rivaux politiques et veiller à ce qu'ils ne deviennent pas trop influents."
 KMT_Taiwan50s.38.a:0 "Il faudrait suivre cette évolution de près."
 KMT_Taiwan50s.41.t:0 "La flotte américaine fait son entrée dans le détroit de Taïwan"
 KMT_Taiwan50s.41.d:0 "Dans sa récente déclaration, le président Truman des États-Unis d'Amérique a fait part de ses vives inquiétudes quant à la sécurité et à la paix en Asie de l'Est, à la suite de l'attaque lancée par la Corée du Nord contre le sud de la péninsule. Il a fait valoir que la RPDC avait violé les résolutions du Conseil de sécurité des Nations unies et a donc ordonné à la Septième Flotte de la marine américaine de pénétrer dans le détroit de Taiwan afin d'empêcher toute attaque contre l'île et d'empêcher le gouvernement du Kuomintang de mener des opérations maritimes et aériennes contre la Chine continentale. Le président estime que le statut futur de Formose devra être déterminé une fois la paix rétablie dans le Pacifique et en Asie de l'Est."
 KMT_Taiwan50s.41.a:0 "Dieu merci."
 KMT_Taiwan50s.41.b:0 "L'impérialisme américain dans toute sa splendeur."
 KMT_Taiwan50s.42.t:0 "Le Kuomintang demande une protection supplémentaire"
 KMT_Taiwan50s.42.d:0 "Le gouvernement de [CHI.GetLeader] a pris contact avec notre ambassadeur à Taipei pour demander la reconnaissance officielle du régime local ainsi qu’une protection officielle contre les menaces étrangères. Bien que nous souhaitions contenir tout mouvement communiste en Asie de l’Est, collaborer avec le KMT pendant la Seconde Guerre mondiale peut être qualifié d’éprouvant, d’ingrat et de pénible, compte tenu de la corruption au sein du KMT et de son refus de suivre les conseils prodigués par nos délégations militaires. Il est dans notre intérêt suprême d'éviter une guerre à grande échelle en Asie et, compte tenu de la rhétorique du Kuomintang visant à reprendre à terme la Chine continentale au Parti communiste chinois, il serait insensé de leur accorder un soutien inconditionnel pour leurs opérations. Cependant, l'état-major militaire convient qu'il serait bénéfique d'aider la République de Chine dans ses efforts défensifs visant à protéger l'île de Formose contre le Parti communiste chinois, à l'exclusion des îles de Kinmen et de Matsu. De cette manière, nous pourrons continuer à vendre du matériel militaire au Kuomintang tout en évitant de nous impliquer activement dans les conflits chinois."
 KMT_Taiwan50s.42.a:0 "Un traité de défense. À prendre ou à laisser."
 KMT_Taiwan50s.43.t:0 "Les Américains acceptent un pacte de défense"
 KMT_Taiwan50s.43.d:0 "La réaction de Washington a suscité des sentiments mitigés au sein du gouvernement. Si tout le monde apprécie leur volonté de défendre Formose contre toute menace étrangère, les États-Unis ont explicitement déclaré qu’ils ne cherchaient pas à aider la République de Chine (ROCA) dans des opérations offensives contre le continent occupé par les communistes et qu’ils limitaient la zone de défense à Formose uniquement, excluant ainsi les îles de Matsu, Kinmen et Hainan. Cela modifiera sans aucun doute nos stratégies et nos plans pour la reconquête du continent, mais ce traité renforcera considérablement notre légitimité internationale en tant que seul gouvernement de la Chine dans un avenir prévisible."
 KMT_Taiwan50s.43.a:0 "On prend ce qu'on a."
 KMT_Taiwan50s.44.t:0 "[GetNewspaperHeader] Le traité de défense mutuelle sino-américain"
 KMT_Taiwan50s.44.d:0 "Aujourd'hui, le secrétaire d'État américain John Foster Dulles a annoncé la signature d'un pacte de défense entre les États-Unis d'Amérique et la République de Chine à Taïwan, négocié au cours de l'année écoulée entre le généralissime Tchang Kaï-chek et M. Dulles. Ce pacte suit des dispositions similaires à celles du traité de défense mutuelle entre la Corée et les États-Unis, garantissant au gouvernement de Taipei une protection contre toute attaque étrangère sur l'île de Formose et reconnaissant le gouvernement du Kuomintang comme la seule autorité légitime sur la Chine. Cependant, le statut des îles côtières chinoises toujours détenues par le Kuomintang reste à régler, étant donné que les États-Unis n'en font aucune mention dans le traité. Le pacte prévoit la mise à disposition des États-Unis de nombreuses bases militaires sur l’île et a été qualifié par Dulles d’« élément de paix » ; il a affirmé qu’il éliminait toute crainte que Formose ne soit qu’un « sujet de négociation diplomatique que Washington abandonnera dès la normalisation des relations entre Washington et Pékin ». Le Congrès approuvera sans aucun doute ce traité, étant donné qu’il vise à intégrer Formose dans le système de sécurité américain et qu’il limite également les opérations du gouvernement nationaliste chinois contre la Chine continentale."
 KMT_Taiwan50s.44.a:0 "Cela apportera-t-il la paix en Chine ?"
 Strait_Crisis.1.t:0 "L'Armée populaire de libération bombarde Kinmen !"
 Strait_Crisis.1.d:0 "Selon la garnison locale des îles de Kinmen et de Matsu, l’Armée populaire de libération, traîtresse, a commencé à bombarder massivement les îles, faisant de nombreuses victimes civiles et militaires, dont deux conseillers américains. Il est clair que le PCC ne renonce pas à son objectif de s’emparer du reste de la Chine libre et n’éprouve aucun remords face aux pertes civiles. Mais nous résisterons à cette attaque, comme nous l’avons fait en 1949. Conformément aux ordres du président, les habitants des îles doivent être évacués vers le Zhejiang. On ne sait pas encore quel rôle les États-Unis joueront dans ce conflit, mais espérons que Washington n'hésitera pas davantage et qu'il nous apportera son aide dans ce conflit."
 Strait_Crisis.1.a:0 "Que chacun reste à sa place."
 Strait_Crisis.2.t:0 "Poursuite des bombardements"
 Strait_Crisis.2.d:0 "Le Kuomintang a opposé une résistance farouche aux campagnes de bombardements. Nous devons intensifier nos efforts et attaquer également les autres archipels afin d'affaiblir leurs forces armées et d'épuiser leurs ressources. Bientôt, l'ensemble de Taïwan et les îles restantes seront sous notre contrôle."
 Strait_Crisis.2.a:0 "Nous allons anéantir les garnisons de Kinmen !"
 Strait_Crisis.3.t:0 "La marine américaine passe à l'action"
 Strait_Crisis.3.d:0 "Le président [USA.GetLeader] a autorisé la marine américaine à venir en aide au Kuomintang dans ses efforts de défense, ainsi que dans ses opérations sur les îles bombardées. Les États-Unis exigent que l'Armée populaire de libération cesse ses opérations et se retire des îles occupées, faute de quoi elle s'expose à de graves conséquences."
 Strait_Crisis.3.a:0 "On peut toujours compter sur l'Oncle Sam."
 Strait_Crisis.3.b:0 "Et si nous ne le faisions pas ?"
 Strait_Crisis.4.t:0 "La situation se calme"
 Strait_Crisis.4.d:0 "Grâce à l'intervention et à la médiation des États-Unis lors de la Conférence de Bandung, les deux parties au conflit ont convenu d'un cessez-le-feu, le KMT conservant le contrôle des îles au large des côtes. Mais nul ne sait quand les hostilités pourraient reprendre. En attendant, la paix revient en Chine."
 Strait_Crisis.4.a:0 "Enfin la paix."
 Strait_Crisis.4.b:0 "Nous les aurons la prochaine fois"
 Strait_Crisis.5.t:0 "La bataille des îles Yijiashan"
 Strait_Crisis.5.d:0 "Une bataille a récemment eu lieu sur les îles de Yijiashan, non loin des îles Dachen, entre les forces de l'Armée populaire de libération (APL) et celles de la République de Chine (ROCA). Zhang Aiping, qui menait l'attaque avec l'autorisation de Mao, a frappé les positions d'artillerie et de communication de la ROCA autour des îles avant de débarquer des troupes à l'aide de canonnières et d'artillerie côtière, neutralisant ainsi les efforts défensifs de la ROCA. Peu après, trois bataillons de renforts supplémentaires sont arrivés, ont brisé la tête de pont et pris le contrôle des îles, faisant 519 prisonniers et 567 blessés parmi les forces de la ROCA."
 Strait_Crisis.5.a:0 "Les îles de Dachen et de Kinmen vont-elles elles aussi tomber ?"
 Strait_Crisis.5.b:0 "Un pas de plus vers la libération de Taïwan !"
 Strait_Crisis.6.t:0 "Arrivée d'American Airwings à Taïwan"
 Strait_Crisis.6.d:0 "Grâce à l'intervention américaine aux côtés de la République de Chine, des escadrons aériens ont commencé à être déployés depuis les Philippines, la Corée du Sud et le Japon vers des bases aériennes situées à Taïwan, notamment celles de Chiayi, Tainan et Taoyuan, tandis qu'un quartier général provisoire a été mis en place par la 5e Armée de l'air à Taipei afin de contribuer à la défense aérienne autour des îles Dachen."
 Strait_Crisis.6.a:0 "L'Armée populaire de libération n'est pas invincible, mais l'armée de l'air américaine, elle, l'est assurément !"
 Strait_Crisis.6.b:0 "Maudits impérialistes américains !"
 Strait_Crisis.7.t:0 "Déclenchement de la deuxième crise du détroit de Taïwan"
 Strait_Crisis.7.d:0 "Nous avons appris que l'Armée populaire de libération (APL) a pris des mesures musclées en ripostant par des tirs sur les îles de Kinmen et en imposant un blocus aérien sur l'île, coulant notre navire de débarquement LST. Nous montrerons à ces fichus communistes la véritable puissance de nos forces armées s'ils veulent vraiment un deuxième round."
 Strait_Crisis.7.a:0 "À bas les sbires de Mao !"
 Strait_Crisis.8.t:0 "Des tracts communistes ont été lancés pour exiger notre reddition"
 Strait_Crisis.8.d:0 "Au septième jour des bombardements de l'île de Kinmen, des tracts de propagande ont été largués, exigeant que les troupes locales de l'Armée républicaine chinoise (ROCA) se rendent à l'Armée populaire de libération (APL) ; il est évident que cela ne servira à rien, et les garnisons de Kinmen ont promis de sacrifier leur vie pour tenir bon et défendre Kinmen contre l'invasion communiste."
 Strait_Crisis.8.a:0 "Nous les avons déjà arrêtés à Kinmen, et nous le ferons encore !"
 Strait_Crisis.9.t:0 "L'Union soviétique annonce son soutien à la République populaire de Chine"
 Strait_Crisis.9.d:0 "Les Soviétiques ont annoncé qu'ils étaient prêts à apporter à l'Armée populaire de libération (APL) le soutien moral et matériel nécessaire dans la lutte pour la « libération » de Taïwan. Bien qu'un changement semble s'être opéré à la tête de l'Union soviétique, le nouveau dirigeant semble avoir maintenu la politique de soutien aux bandits communistes et compte bien la poursuivre à l'avenir. Cela montre également que le monde entier a les yeux rivés sur le détroit de Taïwan, où la situation s'est considérablement aggravée et où une guerre pourrait éclater."
 Strait_Crisis.9.a:0 "Pourquoi les Soviétiques ne peuvent-ils pas rester en dehors de tout ça ?"
 Strait_Crisis.10.t:0 "Les États-Unis nous apportent leur soutien"
 Strait_Crisis.10.d:0 "Les États-Unis ont envoyé à Taïwan le 16e escadron de chasseurs-intercepteurs de la 5e Armée de l'air. Ils ont également déployé leurs porte-avions Essex et Midway, ainsi que des destroyers d'escorte, en renfort de la 7e flotte dans le détroit de Taïwan. Un bataillon Nike-Hercules et des équipements modernes ont également été envoyés à Taïwan. Il semble que le soutien américain à notre égard ne s'arrêtera pas là, puisqu'il est prévu qu'un autre escadron de chasseurs F-104 soit envoyé le 6 septembre."
 Strait_Crisis.10.a:0 "Les États-Unis sont entrés en scène."
 Strait_Crisis.11.t:0 "Rapport militaire sur l'approvisionnement des îles de Kinmen"
 Strait_Crisis.11.d:0 "Alors que les forces communistes commençaient à tenter de bloquer les îles de Kinmen, nous avons effectué plusieurs tentatives pour ravitailler les garnisons de Kinmen qui résistaient sur l'île. Notre première tentative de ravitaillement s'est soldée par un échec cuisant, nous ayant coûté 11 de nos torpilleurs. La deuxième tentative de ravitaillement, le lendemain, a vu la marine de la République de Chine bien mieux équipée qu'auparavant, mais elle a conduit les torpilleurs de l'APL à lancer une attaque autour de la baie de Liaolo, empêchant nos convois d'accomplir leur mission. Cette situation a perduré jusqu'à ce que les communistes demandent à négocier avec les États-Unis, permettant alors à nos convois de ravitailler l'île sans encombre. Le lendemain, un seul convoi réussit à ravitailler l'île, les autres étant repoussés par les bombardements incessants. n/n/ Les États-Unis ont trouvé une nouvelle solution pour contourner le blocus, en mettant l'accent sur le largage aérien de ravitaillement sur les îles, qui était peu efficace auparavant mais qui peut désormais être mis en œuvre de manière fiable grâce à une meilleure couverture aérienne américaine."
 Strait_Crisis.11.a:0 "Compris"
 Strait_Crisis.12.t:0 "Premier affrontement aérien majeur au-dessus des îles de Kinmen"
 Strait_Crisis.12.d:0 "Le premier affrontement aérien majeur au-dessus des îles de Kinmen a débuté lorsque 12 F-86 de la ROCAF et 12 MiG-17 de la PLAF se sont livrés à un combat pour la suprématie aérienne au-dessus des îles, au cours duquel la PLAF a perdu entre 7 et 9 MiG-17 et la ROCAF un seul appareil."
 Strait_Crisis.12.a:0 "Peut-être devrions-nous renforcer notre armée de l'air ?"
 Strait_Crisis.12.b:0 "C'est coûteux, mais ça en vaut la peine pour la libération de Taïwan !"
 Strait_Crisis.13.t:0 "Deuxième affrontement aérien majeur au-dessus des îles de Kinmen"
 Strait_Crisis.13.d:0 "Cette fois-ci, 32 F-86 de la ROCAF ont affronté 100 MiG-17 de la PLAAF ; 20 de ces F-86 étant équipés de missiles Sidewinder américains, ils ont largement surpassé les MiG-17, abattant plus de 25 MiG. Cependant, un missile Sidewinder s'est logé dans l'un des MiG-17 de la PLAAF sans exploser ; il a rapidement été retiré et sera probablement utilisé par le bloc communiste pour en fabriquer des copies."
 Strait_Crisis.13.a:0 "Au moins 25 d'entre eux ont été abattus… ?"
 Strait_Crisis.13.b:0 "En fait, nous avons volé la technologie américaine !"
 Strait_Crisis.14.t:0 "Important affrontement aérien au-dessus des îles Matsu"
 Strait_Crisis.14.d:0 "Un nouveau combat aérien a eu lieu au-dessus des îles Matsu : six F-86 de la ROCAF, qui effectuaient une mission de reconnaissance au-dessus de ces îles, ont été pris en embuscade par huit MiG-17 de la PLAAF. Trois MiG-17 ont été abattus et la PLAN a perdu trois vedettes de patrouille, tandis que la ROCAF n'a perdu qu'un seul F-86."
 Strait_Crisis.14.a:0 "Encore une victoire pour nous !"
 Strait_Crisis.14.b:0 "Maudits soient ces bandits blancs !"
 Strait_Crisis.15.t:0 "Cessez-le-feu décrété par Peng Dihuai"
 Strait_Crisis.15.d:0 "Le blocus ayant été effectivement levé, le général Peng Dehuai, de l'Armée populaire de libération, a décrété un cessez-le-feu unilatéral avec la République de Chine à Kinmen, invoquant des « raisons humanitaires », bien que les bombardements des îles de Kinmen aient fait peu de victimes civiles. Cela signifie toutefois que la crise touche bientôt à sa fin et que les discussions sur le cessez-le-feu se poursuivront."
 Strait_Crisis.15.a:0 "Les bandits ont été repoussés !"
 Strait_Crisis.15.b:0 "Profitez de la trêve tant qu'elle dure, bande de larbins !"
 Strait_Crisis.16.t:0 "Prolongation du cessez-le-feu unilatéral"
 Strait_Crisis.16.d:0 "De nouvelles informations indiquent que le cessez-le-feu a été prolongé et qu'un accord définitif sera proposé prochainement afin de mettre définitivement fin au conflit. Les deux parties ont encore beaucoup à dire à ce sujet."
 Strait_Crisis.16.a:0 "La situation semble désastreuse pour les Reds."
 Strait_Crisis.16.b:0 "Peut-être que nous libérerons Taïwan un jour."
 Strait_Crisis.17.t:0 "Nouvel accord sur la deuxième crise du détroit de Taïwan"
 Strait_Crisis.17.d:0 "La République populaire de Chine a proposé un accord selon lequel elle ne serait autorisée à tirer que les jours pairs, afin de permettre aux troupes de se réapprovisionner les jours impairs, à condition que les États-Unis ne les escortent pas. Cet accord informel pour le moins étrange vise très probablement à permettre aux communistes de sauver la face, en faisant comme si le blocus n’avait pas été contourné."
 Strait_Crisis.17.a:0 "On se souviendra de cette crise !"
 Strait_Crisis.17.b:0 "Gardez vos îles pour une autre fois, bande de bandits !"
 Strait_Crisis.18.t:0 "Le retour des avions F-86"
 Strait_Crisis.18.d:0 "Alors que la deuxième crise du détroit de Taïwan touche à sa fin, le moment est peut-être venu de rendre aux États-Unis certains de leurs avions F-86 ? Cela dit, si nous les gardons, nous pourrions peut-être continuer à utiliser leurs missiles Sidewinder contre les communistes lorsque viendra le moment de libérer le continent."
 Strait_Crisis.18.a:0 "Nous les conserverons encore sept ans."
 Strait_Crisis.18.b:0 "Rendez-les, nous n'en avons plus besoin."
 Strait_Crisis.19.t:0 "La chute des îles de Kinmen et de Dachen"
 Strait_Crisis.19.d:0 "La République de Chine (ROC) étant étirée sur une longue ligne allant des îles Dachen jusqu'aux îles Kinmen, l'Armée populaire de libération (APL) a réussi à percer les lignes ennemies et a anéanti de manière décisive les défenses nationalistes grâce à des tirs d'artillerie concentrés qui ont occupé les défenseurs pendant qu'elle menait un débarquement amphibie dans leur dos, ce qui a finalement conduit à la chute simultanée de toutes les îles côtières. Il semble que le pari de la ROC de conserver toutes les îles ait échoué."
 Strait_Crisis.19.a:0 "Se préparer à défendre Taïwan !"
 Strait_Crisis.19.b:0 "Prochaine étape… Taïwan !"
 KMT_Taiwan50s.49.t:0 "Les vestiges du Kuomintang en Chine continentale"
 KMT_Taiwan50s.49.d:0 "Alors que les forces principales de l'armée républicaine se sont repliées sur l'île de Taïwan, quelques divisions résistent encore dans diverses provinces du pays. Parmi elles figurent les troupes placées sous le commandement de la clique musulmane de Ma, qui se sont repliées dans les régions du Qinghai, du Ningxia et du Xinjiang, où elles poursuivent leur guérilla contre le PCC. Une autre faction de l'ancienne NRA s'est retirée sous le commandement du général Li Mi vers les régions frontalières avec la Birmanie, établissant une base d'opérations contre l'APL dans la province du Yunnan. Il est dans notre intérêt suprême de soutenir ces unités et de les préparer à d'éventuelles opérations stratégiques contre le Parti communiste."
 KMT_Taiwan50s.49.a:0 "The Fight is not over yet!"
 KMT_Taiwan50s.50.t:0 "Aide de Taipei"
 KMT_Taiwan50s.50.d:0 "Après des combats acharnés sur le continent, le gouvernement central de la République de Chine s'est réfugié sur l'île de Taïwan, où il a établi sa nouvelle base d'opérations contre le Parti communiste. Le gouvernement dirigé par [CHI.GetLeader] nous a maintenant contactés et nous a ordonné de poursuivre la guérilla contre l'APL dans les régions frontalières du Yunnan jusqu'à nouvel ordre. Il nous a promis d'envoyer régulièrement des renforts et des ravitaillements avec l'aide de la CIA afin de garantir que les derniers vestiges du Kuomintang sur le continent chinois ne tombent pas aux mains des communistes traîtres de Pékin."
 KMT_Taiwan50s.50.a:0 "Magnifique."
 KMT_Taiwan50s.51.t:0 "La plainte déposée par la Birmanie auprès de l'ONU"
 KMT_Taiwan50s.51.d:0 "À la suite de l'échec des efforts diplomatiques et militaires déployés par le gouvernement birman pour résoudre le problème du Kuomintang à Kengtung, la Birmanie a déposé une plainte auprès des Nations Unies, accompagnée d'une multitude de photos, de documents saisis et de témoignages suffisamment convaincants pour obtenir un vote de censure à l'encontre de la République de Chine. Les États-Unis font également pression sur nous pour que nous rappelions le général Li Mi, arguant que la question du KMT était devenue « une telle source d'embarras international pour les États-Unis ». Bien que nous devions écouter les États-Unis, le rappel des troupes finirait par nous priver d'une autre base géopolitique importante pour nos opérations contre le Parti communiste."
 KMT_Taiwan50s.51.a:0 "Ramène-les à la maison."
 KMT_Taiwan50s.51.b:0 "Annoncer des mesures d'évacuation, mais les retenir là-bas en secret."
 KMT_Taiwan50s.52.t:0 "L'avenir des unités islamiques"
 KMT_Taiwan50s.52.d:0 "La Clique des Ma se bat avec acharnement et passion pour la République, mais ses capacités vont bientôt atteindre leurs limites. L'état-major chargé de la planification débat actuellement pour savoir s'il faut évacuer le Qinghai et le Xinjiang et ramener nos hommes chez eux par la route indienne. Cela nous ferait perdre une autre base opérationnelle importante contre l'APL, mais le risque de perdre ces soldats courageux et précieux augmente de jour en jour."
 KMT_Taiwan50s.52.b:0 "Ces hommes sont des héros. Ramenez-les chez eux."
 KMT_Taiwan50s.52.a:0 "Ordonnez-leur de tenir leurs positions."
 KMT_Taiwan50s.53.t:0 "La Corée en pleine tourmente"
 KMT_Taiwan50s.53.d:0 "Au lendemain de la guerre civile chinoise, la Chine continentale est tombée aux mains du Parti communiste chinois, qualifié de traître, tandis que le gouvernement central a dû se réfugier dans l'ancienne colonie japonaise de Formose. Aujourd'hui, plus de six mois plus tard, Kim Il-sung, président du Parti des travailleurs de Corée, a lancé une invasion à grande échelle de la partie sud de la péninsule, dans le but de placer l'ensemble de la Corée sous son autorité. Nos espions sur le continent font état de rumeurs concernant une possible intervention du Parti communiste chinois en Corée au nom de Kim, ce qui a poussé notre gouvernement à intervenir et à soutenir la Corée du Sud et la coalition de l'ONU par tous les moyens nécessaires. Nous discuterons avec les États-Unis des plans à venir pour faire face à la situation, mais cela pourrait être notre seule chance de lancer une contre-offensive à grande échelle contre l'APL."
 KMT_Taiwan50s.53.a:0 "Ensemble contre l'impérialisme rouge."
 KMT_Taiwan50s.54.t:0 "Le Kuomintang prépare une offensive"
 KMT_Taiwan50s.54.d:0 "Nos espions encore en poste à Taïwan nous ont rapporté que le Kuomintang a conclu un accord avec la Maison Blanche à Washington, permettant au régime de [CHI.GetLeader] d'envoyer ses troupes au combat contre nos alliés à Pyongyang. On peut supposer que le Kuomintang cherche à étendre son influence au-delà de la Corée et souhaite profiter de cette occasion pour nous reprendre la Chine continentale et poursuivre la répression des paysans. Nous devons prendre des mesures immédiates et préparer l'ensemble de l'APL à faire face à cette menace imminente."
 KMT_Taiwan50s.54.a:0 "À bas le KMT !"
 KMT_Taiwan50s.55.t:0 "La révolution de Formose"
 KMT_Taiwan50s.55.d:0 "Après des mois de répression sévère et de politiques anti-autochtones, les peuples autochtones de Taïwan se sont soulevés contre notre gouvernement, qu’ils considèrent comme la nouvelle force d’occupation étrangère de Taïwan depuis le départ des Japonais de l’île. Des manifestations de masse et des incursions secouent l’île, et le gouvernement est submergé par l’ampleur de l’opposition. Les tensions ont atteint des niveaux comparables à ceux des émeutes qui ont suivi l'incident de 1947. Les manifestants exigent la démission immédiate du gouvernement du Kuomintang et réclament l'autonomie, notamment l'abolition de la bureaucratie dominée par les continentaux et la libération de tous les prisonniers politiques. On ignore si le gouvernement parviendra d'une manière ou d'une autre à désamorcer cette situation, mais étant donné que le Kuomintang a perdu le soutien local des autochtones de Formose, cela semble peu probable."
 KMT_Taiwan50s.55.a:0 "Est-ce la fin ?"
 KMT_fangong_dalu.1.t:0 "Fǎngōng dàlù"
 KMT_fangong_dalu.1.d:0 "« Fǎngōng dàlù », un slogan utilisé par la République de Chine qui se traduit littéralement par « Contre-attaque sur le continent », évoque une action militaire musclée menée par les Forces armées de la République de Chine pour revenir sur le continent et éliminer les communistes. Ce slogan a également constitué la principale politique nationale de la République de Chine, la priorité de la nation étant de reconquérir le continent et de « redonner sa gloire au continent ». Bien qu'il ne s'agisse que d'un simple slogan utilisé par la République de Chine, il donne de l'espoir au peuple, l'espoir de voir le Kuomintang faire son retour sur le continent et l'effondrement du régime communiste sur le continent."
 KMT_fangong_dalu.1.a:0 "Rendez-nous les terres qui nous reviennent de droit !"
 KMT_50s_Mainland.1.t:0 "La République de Chine (re)établit des relations diplomatiques"
 KMT_50s_Mainland.1.d:0 "\nLa République de Chine a survécu à ses luttes contre les Japonais et le Parti communiste. Nankin a fait part de son intention d'établir et de renforcer ses relations avec les pays d'Indochine afin de favoriser la coopération et la sécurité dans la région. Dans un premier temps, le gouvernement nationaliste chinois a (ré)ouvert son ambassade dans notre pays."
 KMT_50s_Mainland.1.a:0 "Pour la paix en Asie !"
 KMT_50s_Mainland.2.t:0 "[GetNewspaperHeader] La République de Chine annonce la politique d'une seule Chine"
 KMT_50s_Mainland.2.d:0 "À l'issue de la guerre civile chinoise, la Chine s'est divisée en un État communiste et un État pro-occidental, à l'instar de la Corée, de l'Allemagne et du Vietnam. Le Kuomintang contrôlant la majorité des régions à majorité han, la République de Chine a annoncé sa position sur le statut international de la Chine. \n\nLe président [CHI.GetLeader] a annoncé que la République de Chine avait adopté la « politique d'une seule Chine », proclamant qu'il n'existe qu'une seule Chine, administrée par la République de Chine sous le gouvernement du Kuomintang, y compris tout territoire chinois hors du contrôle du Kuomintang. Toute nation souhaitant établir ou maintenir des relations avec la République de Chine doit accepter cette politique. \n\nLes diplomates et les universitaires ont interprété cette initiative comme une stratégie du Kuomintang visant à discréditer le Parti communiste chinois et à renforcer la légitimité du régime du KMT sur la scène internationale. Il n'est toutefois pas certain que les membres de la sphère d'influence soviétique se plieront à cette politique ou feront pression sur le Kuomintang pour qu'il revienne sur sa position."
 KMT_50s_Mainland.2.a:0 "La Chine était à nouveau unie. Puis elle s'est à nouveau divisée."
 KMT_50s_Mainland.3.t:0 "La doctrine Kung-Chao"
 KMT_50s_Mainland.3.d:0 "Après plusieurs jours de consultations et de discussions, le ministère des Affaires étrangères et le président de la République de Chine sont parvenus à un accord concernant la position officielle de la République de Chine sur le statut international de la Mandchourie. Conformément à la « politique d'une seule Chine » de la République de Chine, la Mandchourie fait partie intégrante de la République de Chine et se trouve actuellement sous le contrôle de « séparatistes ». Nankin a donc annoncé la « doctrine Kung-Chao », du nom de l'actuel ministre des Affaires étrangères George Kung-Chao, qui prévoit des sanctions à l'encontre de tout pays cherchant à établir des relations diplomatiques avec le PCC en Mandchourie, y compris les pays du bloc de l'Est. Si ces sanctions ne nous porteront pas préjudice à un niveau élevé, elles nuiront considérablement à nos relations avec le Kuomintang."
 KMT_50s_Mainland.3.a:0 "Oh non ! Bref..."
 KMT_50s_Mainland.4.t:0 "Un envoyé de Nanjing"
 KMT_50s_Mainland.4.d:0 "La République de Chine est sortie victorieuse de son conflit avec le Parti communiste et a immédiatement commencé à nouer des contacts avec d'autres États anticommunistes d'Asie de l'Est. En tant que nation indépendante nouvellement établie, nous sommes encore confrontés à divers problèmes, notamment des troubles socialistes dans les jungles de Malaisie, et le gouvernement du Kuomintang s'est montré très disposé à aider notre gouvernement à stabiliser les zones rurales. Les ravitaillements devraient arriver sous peu."
 KMT_50s_Mainland.4.a:0 "C'est apprécié"
 KMT_50s_Mainland.5.t:0 "Les Chinois renoncent à leurs revendications"
 KMT_50s_Mainland.5.d:0 "Dans un revirement de situation surprenant, le gouvernement chinois de Nankin, qui est sorti victorieux de la guerre civile contre le Parti communiste, a annoncé qu’il renoncerait à toute revendication sur le Tibet et reconnaîtrait le Dalaï-Lama comme chef de l’État tibétain. Les troupes chinoises se retirent des régions frontalières stratégiques et des émissaires du Kuomintang nous ont contactés afin de discuter de l’établissement officiel de relations diplomatiques et de faire pression pour obtenir la reconnaissance internationale de l’indépendance du Tibet."
 KMT_50s_Mainland.5.a:0 "Magnifique."
 KMT_50s_Mainland.6.t:0 "Rapport sur les provinces"
 KMT_50s_Mainland.6.d:0 "Les gouverneurs de chaque région de Chine, qu'il s'agisse du Guangxi ou du Qinghai, doivent faire l'objet d'une enquête approfondie afin de mettre au jour leurs agissements et leurs véritables intentions à l'égard du gouvernement national. Nanjing a dépêché des agents secrets dans les capitales provinciales respectives et leurs environs afin d'évaluer la situation de l'administration, des services de santé ainsi que de l'éducation. À leur retour, après avoir remis leurs rapports au secrétaire du président, il est apparu clairement à Nanjing que..."
 KMT_50s_Mainland.6.a:0 ". . . il n'y a absolument aucun problème."
 KMT_50s_Mainland.6.b:0 ". . . La corruption, le népotisme et divers autres problèmes minent les régions."
 KMT_50s_Mainland.7.t:0 "La démission de Li Zongren"
 KMT_50s_Mainland.7.d:0 "Bien qu'il fût officiellement devenu président de la République de Chine en janvier 1949, Li Zongren n'exerçait que peu ou pas de pouvoir sur les autorités militaires centrales et ne parvint guère à mettre en œuvre les politiques qu'il souhaitait en raison de l'opposition des partisans de Tchang Kaï-chek. Malgré des relations tendues entre Tchang et Li, le Premier ministre Yan Xishan joua un rôle important de médiation entre les deux hommes, ce qui permit de maintenir la cohésion du gouvernement du Kuomintang pendant la phase finale de la guerre civile chinoise. Après la fin de la guerre, la rivalité entre Li Zongren et Tchang Kaï-chek reprit, ce qui conduisit finalement Li à démissionner de son poste de vice-président et à retourner dans sa province natale du Guangxi. En raison de son influence et des politiques d'autonomie du Guangxi pendant la Seconde Guerre mondiale, il continuera très probablement à constituer un obstacle pour Tchang et ses partisans."
 KMT_50s_Mainland.7.a:0 "On se reverra."
 KMT_50s_Mainland.8.t:0 "Les trois principes du peuple"
 KMT_50s_Mainland.8.d:0 "Les « Trois principes du peuple », également connus sous le nom de « doctrine San-min » ou « tridéisme », constituent la philosophie politique principale du Kuomintang, élaborée par le père de la révolution nationale, le Dr Sun Yat-sen. Ils ont servi de ligne directrice pour le développement de la Chine à l'époque républicaine et peuvent se résumer brièvement par « démocratie, nationalisme et bien-être ».\n\nMinzu, le premier principe, prône le développement d'une identité nationale plutôt qu'ethnique et appelle à l'indépendance de l'ensemble du peuple chinois face aux menaces impérialistes extérieures et à la domination interne des minorités.\n\nMinquan, souvent traduit par « démocratie », soutient le droit du peuple chinois à exprimer ses opinions politiques et à contrôler les postes administratifs, représentés par l'Assemblée nationale. Ces droits comprennent le droit de vote, le droit de révocation, le droit d'initiative et le droit d'organiser des référendums. Le système politique doit être divisé en cinq branches distinctes au lieu de trois seulement. L'État est divisé en un Yuan législatif, exécutif, judiciaire, de contrôle et d'examen, combinant la pensée montesquieuane avec la tradition chinoise.\n\nMinsheng, souvent traduit par « bien-être du peuple », se concentre sur quatre domaines : l'habillement, l'alimentation, le logement et la mobilité. Ce principe est également fortement influencé par la pensée d’Henry George, qui prônait l’imposition foncière comme « le seul moyen de soutenir le gouvernement par un impôt infiniment juste, raisonnable et équitablement réparti, et c’est sur cela que nous fonderons notre nouveau système ».\n\nAu cours des dernières décennies, depuis la mort du Dr Sun, le Kuomintang n’a pas su mettre en œuvre ces principes et n’a plus guère, voire plus du tout, adhéré à cette philosophie. Mais à partir d’aujourd’hui, nous consacrerons toutes nos ressources et tous nos efforts à l’achèvement de la révolution nationale sous l’égide des Trois Principes du Peuple. Chaque membre du parti doit s’y engager pleinement et garder ces principes constamment à l’esprit."
 KMT_50s_Mainland.8.a:0 "San-min chu-i, shih-hsing."
 KMT_50s_Mainland.9.t:0 "Un dîner tardif"
 KMT_50s_Mainland.9.d:0 "Il était déjà 23 heures, mais les lumières étaient toujours allumées au palais présidentiel de Nankin. Tchang Kaï-chek, entouré de sa famille et de son entourage proche, dînait et partageait ses réflexions sur les dernières années. Chen Cheng, le vice-président de la République, affichait depuis le début de la soirée un air dubitatif, se demandant si les politiques actuelles parviendraient à apaiser la population et à garantir un certain soutien populaire :\n\n« Cela nous apportera-t-il vraiment le soutien nécessaire et détournera-t-il l'attention du Parti communiste ? Leurs campagnes de propagande excessives et leurs politiques locales ont failli nous faire perdre la guerre. Le peuple n'oubliera pas cela de sitôt. »\n\nChiang Kai-shek se penche en arrière et esquisse un léger sourire. Il affirme avoir tiré les leçons du passé et savoir exactement comment relever ce défi :\n\n« La réforme du parti n’était qu’une première étape. En mettant en place de nouvelles politiques, en mettant l’accent sur le compromis, vous finirez par satisfaire la majorité de la population à un point tel qu’elle acceptera votre règne et reconnaîtra une certaine légitimité. Tout est question de trouver le parfait équilibre entre concessions et restrictions. »\n\nBien sûr, cela ne peut pas être la solution pour toujours, a-t-il ajouté. Les temps changent, tout comme les gens. Mais pour l’instant, le Kuomintang se trouve dans une position stable, contrairement à la situation désastreuse de 1949. Un jour, les Trois Principes seront pleinement intégrés dans la mentalité chinoise. Mais le chemin à parcourir est encore long."
 KMT_50s_Mainland.9.a:0 "Encore un verre d'eau bouillie, s'il vous plaît."
 KMT_50s_Mainland.10.t:0 "Lancement d'une nouvelle gamme Fabi"
 KMT_50s_Mainland.10.d:0 "Depuis 1935, la République subit les effets de l'hyperinflation du yuan, qui a entraîné une flambée des prix. Après la mise en place du gouvernement du Kuomintang à Nankin, le système bancaire libre a été aboli et le Kuomintang s'est assuré le soutien politique et financier des plus grandes banques du pays. Ces banques sont finalement devenues dépendantes du gouvernement, accordant ainsi à Nankin le monopole monétaire. L'introduction de la nouvelle série de Fabi est l'une des nombreuses mesures visant à reconstruire l'économie chinoise dévastée ; cette fois-ci, la nouvelle série de Fabi serait indexée sur le dollar américain et adossée à plusieurs devises et métaux précieux en tant que réserves, tout en contrôlant strictement la quantité en circulation et en imposant le remplacement de toutes les anciennes devises par le nouveau yuan Fabi à un certain taux. D'autres changements doivent être apportés au système bancaire, ainsi qu'à l'agriculture et aux infrastructures nationales, pour parvenir à la pleine reprise du pays."
 KMT_50s_Mainland.10.a:0 "Il en sera ainsi."
 KMT_50s_Mainland.11.t:0 "La République de Chine sollicite une aide à la reconstruction"
 KMT_50s_Mainland.11.d:0 "Les ravages de la guerre civile et de la Seconde Guerre mondiale ont laissé la Chine en ruines. Avec la victoire du Kuomintang, nous disposons désormais d’un allié de premier plan en Chine, un pays doté d’un vaste marché de consommation et d’un potentiel de ressources encore inexploité. Nous aiderons volontiers le gouvernement du Kuomintang dans ses efforts de reconstruction, afin de nous assurer une ou plusieurs faveurs pour l’avenir, au cas où nous devrions un jour frapper à la porte de Nankin."
 KMT_50s_Mainland.11.a:0 "Excellent."
 KMT_50s_Mainland.12.t:0 "La nécessité d'une réforme"
 KMT_50s_Mainland.12.d:0 "Le Kuomintang était arrivé au pouvoir en promettant diverses réformes sociales et économiques au peuple chinois après la chute de la monarchie Qing. Cependant, après la défaite de la clique de Beiyang, le parti s’est principalement attaché à maintenir et à étendre son pouvoir politique, ainsi qu’à écraser le mouvement communiste. L’inefficacité de la bureaucratie, la corruption, les luttes de factions et l’opportunisme ont contribué à l’effondrement de la structure du Kuomintang, nous faisant presque perdre la Chine continentale au profit du Parti communiste. Il est dans notre intérêt de mettre fin à cette situation déplorable et de prendre des mesures pour réformer le Kuomintang afin d'en faire un parti uni et efficace. La résistance des seigneurs de guerre et des différentes factions politiques au sein du Kuomintang ne rendra pas cette tâche facile, mais c'est le seul moyen d'assurer notre domination sur la Chine."
 KMT_50s_Mainland.12.a:0 "Pour un avenir meilleur."
 KMT_punishments.1.t:0 "La République de Chine demande l'extradition de Puyi"
 KMT_punishments.1.d:0 "Le gouvernement du Kuomintang a commencé à concentrer ses efforts sur la répression des collaborateurs du Japon, en accordant la priorité à la punition des traîtres qui ont couvert le pays de honte. Il se trouve que lors de notre invasion de la Mandchourie en 1945, nous avons réussi à capturer l’un des principaux « traîtres » de la Chine, l’ancien empereur Puyi. Le Kuomintang soutient que ces traîtres doivent être sévèrement punis par le gouvernement chinois légitime et souhaitait prendre en main la question de leur châtiment. Nous pourrions éventuellement céder à ces demandes mineures, mais il existe une alternative. Le gouvernement de Mandchourie, qui relève de nos intérêts supérieurs, a également demandé l'extradition de Puyi, tout en affirmant que le gouvernement de Nankin ne ferait preuve d'aucune pitié envers les traîtres, contrairement au gouvernement mandchou."
 KMT_punishments.1.a:0 "Allez, ce n'est pas grave"
 KMT_punishments.1.b:0 "Nous ne laisserons pas les « traîtres » souffrir sous le régime réactionnaire."
 KMT_punishments.2.t:0 "Réponse des Soviétiques concernant notre demande"
 KMT_punishments.2.yes:0 "Les Soviétiques ont accepté notre demande d'extradition de Puyi, estimant que la sanction qui lui serait infligée n'avait pas grande importance. Ils ont enfin repris leurs esprits et compris que ce n'était qu'une question de temps avant que notre régime ne parvienne à renverser l'État satellite soviétique en Mandchourie."
 KMT_punishments.2.no:0 "Les impérialistes soviétiques ont rejeté notre demande d'extradition de Puyi ; au contraire, ils l'ont jusqu'à présent extradé vers le régime communiste de Mandchourie, cherchant ainsi à détériorer ouvertement nos relations. Cet acte ne restera toutefois pas sans suite dans les décennies à venir."
 KMT_punishments.2.a:0 "Les Soviétiques ont changé d'avis"
 KMT_punishments.2.b:0 "Comment osent-ils ?"
 KMT_punishments.3.t:0 "Le destin de Puyi"
 KMT_punishments.3.d:0 "Les Soviétiques ayant accepté d'extrader Puyi, il est temps pour nous de décider du sort du dernier empereur de Chine, qui est mal vu par la majorité de la population chinoise non seulement en raison de ses liens avec la dynastie Qing, très impopulaire, mais aussi à cause de sa collaboration avec le Japon de 1932 jusqu'en 1945. Puyi a mené une vie fastueuse et est gâté jusqu'à la moelle en raison de son statut d'ancien empereur de Chine ; nous devons lui montrer que ses jours en tant qu'empereur de Chine sont révolus et que sa vie est en jeu."
 KMT_punishments.3.a:0 "Faites-le exécuter par un peloton d'exécution"
 KMT_punishments.3.b:0 "Condamnez-le à la prison à vie"
 KMT_punishments.4.t:0 "Le sort de Chen Yi"
 KMT_punishments.4.d:0 "Chen Yi, l'ancien gouverneur de la province de Taïwan, est responsable de l'incident du 28 février (souvent appelé « incident du 228 » ou simplement « 228 ») ; c'est lui qui a lancé une répression brutale contre la population taïwanaise locale, ce qui a déjà suscité une vague de mécontentement à l'égard de notre régime et terni l'image que les Taïwanais ont de nous à cause de Chen Yi. Même si Chen Yi a été démis de ses fonctions de gouverneur de Taïwan, cela ne semble pas suffire à apaiser la population taïwanaise locale. Nous devons agir et punir le responsable de tout ce chaos, et tenter de regagner le cœur de la population taïwanaise locale."
 KMT_punishments.4.a:0 "Le condamner à mort"
 KMT_punishments.4.b:0 "Le condamner à la prison à perpétuité"
 KMT_punishments.4.c:0 "Pardonnez-lui, il mérite une seconde chance"
 KMT_punishments.5.t:0 "Le destin du prince De"
 KMT_punishments.5.d:0 "Le prince Demchudongrub, également connu sous le nom de « prince De », fut l’un des principaux artisans de la défection de la Mongolie intérieure au profit des Japonais en 1936, bien qu’on lui eût proposé auparavant l’autonomie. Bien qu’il ait commis l’erreur de faire défection et de collaborer avec le Japon, il s’est jusqu’à présent montré disposé à collaborer avec nous dans le cadre de nos futurs projets visant à libérer la Mongolie du communisme, à condition que nous décidions de lui épargner la vie."
 KMT_punishments.5.a:0 "Exécutez ce séparatiste ethnique"
 KMT_punishments.5.b:0 "Enfermez-le à vie"
 KMT_punishments.5.c:0 "Épargnez-le, il pourrait nous être utile plus tard"
 KMT_punishments.6.t:0 "Le prince De prend la fuite"
 KMT_punishments.6.d:0 "Le prince De a appris que les autorités de la Mongolie intérieure faisaient pression sur le gouvernement mongol pour qu'il soit arrêté et extradé ; il a ainsi échappé de justesse à l'arrestation en prenant la fuite et en traversant la frontière sino-mongole dans le désert de Gobi. À son retour en Chine, il a été chaleureusement accueilli par le gouvernement chinois et a réaffirmé son allégeance au gouvernement du Kuomintang."
 KMT_punishments.6.a:0 "Bon retour parmi nous, mon vieil ami"
 KMT_punishments.6.b:0 "Maudit soit le KMT !"
 KMT_punishments.7.t:0 "Le sort de Zhang Xueliang"
 KMT_punishments.7.d:0 "Zhang Xueliang, surnommé le « Jeune Maréchal », était le chef de la clique de Fengtian, succédant ainsi à son père, Zhang Zuolin, également connu sous le nom de « Vieux Maréchal ». Après la défaite désastreuse de la bataille de la Grande Muraille, Zhang fut réaffecté à la répression des communistes dans le Shaanxi dans le cadre de la campagne de répression des bandits du Nord-Ouest. Sur place, il commença à sympathiser avec les communistes et tourna le dos au Kuomintang en arrêtant Chiang à Xi'an et en le forçant à former un front uni avec les rouges. Après les événements de Xi'an, Chiang fit arrêter Zhang peu après et le plaça en résidence surveillée pour trahison envers le Kuomintang, l'empêchant ainsi de rejoindre les communistes. Les communistes s'étant repliés en Mandchourie, de nombreux politiciens ont réclamé le procès de Zhang ainsi que d'autres sympathisants communistes afin de faire pression sur nous pour que nous traitions les traîtres à la République."
 KMT_punishments.7.a:0 "Qu'on coupe la tête du jeune maréchal !"
 KMT_punishments.7.b:0 "Qu'il reste assigné à résidence ; l'exécution, c'est trop sévère"
 KMT_punishments.7.c:0 "Libérez l'homme qui a uni la Chine contre les Japonais"
 KMT_REFORM.1.d:0 "Un nouveau Comité central de réforme a été créé afin de mieux orienter l'évolution politique future de la République et de réformer le KMT. Ce nouveau comité entend mettre fin à l'inefficacité et à la corruption qui ont caractérisé les comités exécutifs précédents en encourageant des membres du parti instruits, jeunes et très motivés à prendre la tête de cette initiative et à redynamiser le parti. Le comité a déjà défini des plans pour les réformes à venir, telles que la réorganisation de la formation des cadres, la réinscription des anciens membres et un contrôle plus strict des responsables du parti. Chiang Kai-Shek est un dirigeant qui a fait ses preuves, promettant de poursuivre son approche intransigeante visant à centraliser l'État, à mener des réformes approfondies au sein du parti et à réprimer les vestiges communistes."
 KMT_REFORM.1.a:0 "Vers le progrès sous son règne."
 chi.1.t:0 "Accepter l'adhésion de la République populaire de Chine à l'ONU"
 chi.1.d:0 "La République populaire de Chine souhaite être reconnue par les Nations unies comme l'héritière de la République de Chine. Le gouvernement du Kuomintang de la République de Chine s'est réfugié à Taïwan, tandis que la République populaire de Chine contrôle le continent. Devrions-nous préconiser que le siège de la République de Chine (Taïwan) soit attribué à la République populaire de Chine ?"
 chi.1.a:0 "Oui, bien sûr !"
 chi.1.b:0 "Non, ils ne doivent pas entrer."
 CHI_KOR.0.d:0 "L'ambition sans limite de notre ennemi mortel à Pékin a fait une nouvelle victime ; la jeune République de Corée, longtemps en proie aux agitations de Kim Il-sung, a sombré dans la guerre civile, la révolution de Mao Zedong soutenant sans aucun doute les forces de Sung au Nord afin de contrer l'aide américaine en route pour soutenir le gouvernement républicain de Séoul ; C'est une situation que nous, Chinois patriotes, ne connaissons que trop bien. \n\nLes yeux du monde se tournent une fois de plus vers l'Asie alors que la guerre civile coréenne s'intensifie, et la République de Chine ne restera pas les bras croisés tandis que la menace rouge s'abat sur le bon peuple coréen depuis son bastion de Pyongyang.\n\nCependant, bien que le général MacArthur encourage vivement une intervention de la Chine nationaliste dans la guerre de Corée, le président Truman s'est ouvertement opposé à cette idée ; par conséquent, la proposition d'une intervention des États-Unis dans la guerre de Corée a toutes les chances d'échouer."
 CHI_KOR.1.d:0 "Notre récente décision de nous impliquer dans la guerre civile en Corée a attiré l'attention des ennemis de la République populaire de Chine et de ceux qui soutiennent Kim Il-sung ; La République de Chine à Taïwan et les vestiges du Kuomintang ont proposé de rejoindre l'armée américaine pour combattre l'armée nord-coréenne.\n\nSi toute tentative visant à endiguer la vague rouge en Asie est la bienvenue, le choix d'impliquer Taïwan pourrait exaspérer le gouvernement de Pékin, ce qui pourrait déclencher une invasion depuis la Mandchourie"
 CHI_KOR.2.d:0 "La correspondance officielle en provenance de Washington D.C. nous a informés que le gouvernement américain a donné son accord à la proposition de Tchang Kaï-chek, et que l'armée américaine collaborera avec l'armée du Kuomintang dans le cadre d'une opération conjointe contre l'armée nord-coréenne ! Le feu vert a été donné et, d'ici quelques semaines, nous lancerons la contre-offensive contre l'Armée populaire de libération."
 CHI_KOR.3.d:0 "Dans une lettre officielle envoyée depuis Washington D.C., le président a fait savoir à Tchang Kaï-chek qu'il souhaitait que la République de Chine ne s'immisce pas dans la guerre civile coréenne, craignant qu'une intervention militaire de Taïwan ne provoque des représailles de la part de Pékin, ce qui risquerait de transformer le conflit en une crise internationale."
 CHI_KOR.4.d:0 "\nAvec le déclenchement de la guerre civile en Corée, il est tout à fait naturel que les ennemis du bloc communiste asiatique, qui soutiennent la révolte communiste à Pyongyang, cherchent à prendre part aux combats ; moins d’un an après la fin de la guerre civile chinoise, les vestiges du Kuomintang à Taïwan ont décidé, une fois de plus, de prendre les armes contre l’Armée rouge chinoise qui soutient Kim Il-sung en Corée du Nord.\n\nÀ la suite d'un récent échange de correspondance entre le président de la République de Chine, Tchang Kaï-chek, à Taipei, et le président américain Harry Truman à Washington, les États-Unis ont donné leur feu vert aux armées du Kuomintang pour qu'elles viennent en aide à l'armée américaine contre la Corée du Nord et la Chine communiste, estimant que leur expérience face aux forces communistes chinoises serait d'une aide précieuse contre la menace à laquelle ils sont confrontés."
 CHI_KOR.5.t:0 "[GetNewspaperHeader]La République de Chine se retire de Corée"
 CHI_KOR.5.d:0 "À la suite de combats acharnés et de tentatives désespérées de défense, la coalition des Nations Unies et les forces sud-coréennes n'ont plus été en mesure de résister à l'avancée de l'offensive sino-coréenne en Corée du Sud. Alors que les forces des Nations Unies sont toujours présentes dans le pays dans l'espoir de renverser une nouvelle fois le cours de la guerre, les forces nationalistes chinoises sous le commandement de [CHI.GetLeader] ont reçu l'ordre de se retirer de la péninsule et de regagner Taïwan. Le Parti communiste chinois a discrédité cette annonce, y voyant un exemple de la faiblesse de l'armée du Kuomintang et affirmant que la libération de Taïwan par l'APL est inévitable. Les États-Unis ont exprimé de vives inquiétudes, mais ont aidé la République dans ses efforts d'évacuation afin de limiter au maximum le nombre de victimes."
 CHI_KOR.5.a:0 "Cela n'a rien de surprenant."
 CHI_KOR.6.t:0 "[GetNewspaperHeader]La République de Chine entre en guerre en Corée"
 CHI_KOR.6.d:0 "Avec le déclenchement de la guerre civile en Corée, il est tout à fait naturel que les ennemis du bloc communiste asiatique, qui soutiennent la révolte communiste à Pyongyang, cherchent à prendre part aux combats ; moins d’un an après la fin de la guerre civile chinoise, les vestiges du Kuomintang à Taïwan ont décidé, une fois de plus, de prendre les armes contre l’Armée rouge chinoise qui soutient Kim Il-sung en Corée du Nord.\n\nÀ la suite d'un récent échange de correspondance entre le président de la République de Chine, Chiang Kai-Shek, à Taipei, et le président américain Harry Truman à Washington, les États-Unis ont donné leur feu vert aux armées du Kuomintang pour qu'elles viennent en aide à l'armée américaine contre la Corée du Nord et la Chine communiste, estimant que leur expérience face aux forces communistes chinoises serait d'une aide précieuse contre la menace à laquelle ils sont confrontés. De plus, le Kuomintang coordonne une offensive contre le continent communiste avec l'aide des vestiges du KMT dans les régions du Qinghai et de la Birmanie, dans l'espoir de détourner encore davantage l'attention de l'APL et de déstabiliser le commandement des forces chinoises rouges."
 CHI_KOR.6.a:0 "C'est inquiétant."
 CHI_KOR.7.t:0 "Déclenchement de la guerre de Corée"
 CHI_KOR.7.d:0 "Dans les derniers instants de notre propre guerre civile, les communistes du Nord de la Corée ont lancé une invasion contre le Sud, déclenchant un conflit dans la région, exactement comme l’avaient fait à notre égard ces perfides communistes chinois. Nos frères coréens anticommunistes se trouvent aujourd’hui dans la même situation que celle que nous avons connue autrefois ; nous devons les aider sans tarder à renverser cette racaille communiste qui ravage l’Asie."
 CHI_KOR.7.a:0 "Deux nations, un même combat"
 CHI_KOR.8.t:0 "[GetNewspaperHeader] La République de Chine condamne la Corée du Nord"
 CHI_KOR.8.d:0 "Dans un revirement surprenant, [CHI.GetLeader] a publiquement condamné la République populaire démocratique de Corée pour son invasion de la République de Corée, affirmant que cette invasion était injuste et qu'elle avait démontré que le bloc communiste regorgeait de bellicistes. Sa déclaration a été perçue comme inattendue par de nombreux journalistes, car les nationalistes chinois ne se sont pas encore complètement remis des ravages de la guerre après leur « victoire » dans la guerre civile contre les communistes chinois. Certains politiciens ont affirmé qu'il semblait que la Chine allait intervenir dans la guerre de Corée par le biais d'un conflit armé direct, afin de justifier la reprise de la guerre civile contre les communistes en Mandchourie et d'en finir avec eux. Malgré cela, le gouvernement américain à Washington a soutenu la condamnation de Pyongyang par les nationalistes et a considéré cela comme une victoire diplomatique en Asie, la position anticommuniste intransigeante de la République de Chine garantissant que le bloc communiste aurait du mal à s’étendre en Asie."
 CHI_KOR.8.a:0 "Un prélude à la reprise de la guerre civile chinoise ?"
 CHI_KOR.9.t:0 "La République de Chine envoie des stocks datant de la guerre civile"
 CHI_KOR.9.d:0 "Dans le but de renforcer nos liens et de contrer la menace communiste, la République de Chine nous a transmis une grande partie de ses stocks militaires datant de la guerre civile chinoise, nous assurant ainsi que nous ne sommes pas seuls dans cette lutte contre le communisme en Asie."
 CHI_KOR.9.a:0 "À bas les communistes, tous ensemble !"
 CHI_KOR.10.t:0 "La République de Chine envoie des conseillers militaires"
 CHI_KOR.10.d:0 "Afin d'empêcher le communisme de s'emparer de l'ensemble de la péninsule coréenne, la République de Chine a dépêché en Corée des officiers aguerris, en tant que conseillers, dans l'espoir de nous donner un atout supplémentaire face aux communistes. Ces conseillers peuvent s'avérer utiles dès à présent et à l'avenir, et contribueront grandement à améliorer les relations entre nos deux pays."
 CHI_KOR.10.a:0 "Bienvenue en Corée."
 CHI_KOR.11.t:0 "La Chine nous propose un traité de défense mutuelle"
 CHI_KOR.11.d:0 "À la fin de la guerre de Corée, la Chine a proposé de former une alliance militaire avec nous afin d'assurer la survie de nos deux nations en Asie. Ce pacte prévoit des exercices militaires conjoints, le déploiement de troupes chinoises en Corée et une coopération renforcée entre nos deux pays. Nanjing nous a assuré que ce pacte serait utile pour libérer l'Asie du communisme à l'avenir et qu'il ne s'agirait pas d'une énième alliance militaire sans substance."
 CHI_KOR.11.a:0 "Signez le traité de défense mutuelle."
 CHI_KOR.11.b:0 "Nous refusons de le signer."
 CHI_KOR.12.t:0 "[GetNewspaperHeader] La République de Corée refuse de signer un traité de défense mutuelle avec la Chine"
 CHI_KOR.12.d:0 "Dans ce que les nationalistes chinois considéraient comme une initiative diplomatique décisive visant à renforcer la coopération avec le gouvernement anticommuniste de Séoul, ce dernier a rejeté l'idée d'un traité de défense mutuelle sino-coréen, affirmant que ses intérêts étaient actuellement liés aux États-Unis et qu'il ne recherchait pas de soutien étendu de la part des nationalistes chinois. Le gouvernement nationaliste chinois, qui s'est senti insulté par la réponse de la Corée du Sud, a immédiatement rompu ses relations diplomatiques avec ce pays et a rappelé ses conseillers, dont beaucoup avaient été envoyés pendant la guerre de Corée. Les États-Unis ont jusqu'à présent tenté de rétablir les liens entre les deux nations en mettant l'accent sur la diplomatie anticommuniste, qui était à l'origine de leur rapprochement."
 CHI_KOR.12.a:0 "Le bloc anticommuniste en Asie est en train de s'effondrer."
 CHI_KOR.13.t:0 "[GetNewspaperHeader] Le traité de défense mutuelle sino-coréen"
 CHI_KOR.13.d:0 "Le gouvernement sud-coréen a signé de plein gré le traité de défense mutuelle après avoir reçu la proposition du gouvernement chinois à Nankin, reconnaissant qu'il s'agissait là du seul moyen pour les deux nations de s'unir dans la lutte contre le communisme en Asie. Cette initiative diplomatique a été considérée par de nombreux responsables politiques américains comme une « victoire » pour le bloc anticommuniste en Asie, car ce traité de défense mutuelle entre les deux nations garantissait leur engagement à s'opposer au communisme, ce qui les maintenait ainsi dans le cadre de la Guerre froide. Le gouvernement de Nankin a promis au gouvernement sud-coréen une aide militaire et des programmes de formation encore plus importants, ainsi que l'envoi d'un nouveau contingent de conseillers professionnels, composés d'anciens combattants de la guerre sino-japonaise et de la guerre civile chinoise."
 CHI_KOR.13.a:0 "Les tensions en Asie semblent monter en flèche."
 CHI_KOR_TT:0 "[CHI.GetNameDef] va officiellement prendre part à la guerre de Corée contre les agresseurs communistes."
 CHI_KOR_guns_TT:0 "§CRecevra des stocks d'armes de la République de Chine en fonction de l'issue de la guerre civile chinoise.§!"
 KMT_Lift_Martial_Law2:0 "Lever la loi martiale"
 KMT.10.d:0 "En République de Chine, le Kuomintang, parti au pouvoir, a annoncé son intention d'exclure Lei Chen, ancien conseiller présidentiel et fondateur du magazine Free China. Bien que Free China ait été fondé comme une publication indépendante, libre de débattre ouvertement des questions d'actualité et de faire contrepoids à la sévérité des médias contrôlés par les communistes, le Kuomintang a jugé que les publications récentes de Free China constituaient une menace. Plus précisément, plusieurs articles ont critiqué le Kuomintang pour ne pas avoir respecté les procédures constitutionnelles, notamment en matière de limitation des mandats, et le gouvernement a estimé que Lei Chen était à l'origine de ces critiques. Lei Chen est un fervent défenseur de la Constitution, même au détriment du Kuomintang, et il semble que cette position lui ait coûté son adhésion au parti. Il devrait continuer à défendre ses convictions, mais désormais en dehors du parti."
 Formosa.10.d:0 "Le Mouvement du 28 février fait référence aux massacres et à la répression brutale des manifestants taïwanais par la République de Chine, contrôlée par le Kuomintang, le 28 février 1947. Les manifestations contre la corruption et l'agression d'une veuve par des fonctionnaires de l'État ont conduit au déploiement de troupes qui ont tué des milliers de personnes pour mettre fin aux manifestations. Cela a également déclenché une campagne de répression sévère contre le peuple taïwanais, à qui il a été interdit de parler de ces événements ou de s'en souvenir. Tout cela a exacerbé les tensions entre les Taïwanais et les Chinois continentaux. De nombreux Taïwanais n'ont pas oublié et continuent de considérer ces événements comme un exemple flagrant de la corruption et de la brutalité du Kuomintang chinois continental. Ils y voient également la preuve que Taïwan doit être libre et indépendante pour contrôler son propre destin."
 Formosa.11.d:0 "Dans un rebondissement spectaculaire en République de Chine, le gouvernement au pouvoir s'est effondré face à un soulèvement mené par des Taïwanais révoltés par la domination et le contrôle exercés sur leur île depuis l'arrivée du Kuomintang en provenance de Chine continentale, après sa défaite lors de la guerre civile chinoise. Ces derniers jours, à travers toute l'île, et en particulier dans la capitale Taipei, des milliers de personnes sont descendues dans la rue. Le gouvernement a déployé la police et l'armée avec pour ordre de mettre fin aux manifestations par la force, mais cela n'a fait qu'inciter davantage de personnes à rejoindre les manifestants. Lorsque le gouvernement a ordonné aux troupes d'utiliser des armes à feu, de nombreux soldats ont refusé d'obéir et ont rejoint le soulèvement. Privé du soutien de l'armée, le gouvernement s'est rendu et de nombreux membres ont fui vers des missions diplomatiques amies ou l'aéroport afin de chercher protection ou de s'enfuir. Les journaux du pays ont annoncé le succès de la Révolution de Formose."
 Formosa.12.d:0 "La récente révolution de Formose a permis à la population de l'île, présente avant l'arrivée du Kuomintang en 1945, de prendre enfin le contrôle de l'île. Les révolutionnaires victorieux ont récemment annoncé la mise en place d’un nouveau gouvernement provisoire de Formose afin de faire entrer l’île dans une nouvelle ère de gouvernance inclusive et juste. Dans la tourmente, certains anciens responsables gouvernementaux et partisans ont réussi à s’enfuir, mais un grand nombre d’entre eux restent sur l’île, en particulier les réfugiés qui ont fui la Chine continentale et les communistes qui y règnent. Pour l'instant, le nouveau gouvernement a déclaré que ces personnes seraient surveillées de près, que celles ayant commis des crimes seraient jugées et qu'une fois le gouvernement établi, il déciderait du sort des réfugiés. Cette déclaration n'a pas été perçue comme rassurante par les réfugiés et de nombreux partisans du Kuomintang s'inquiètent également pour la mission sacrée de libération de la Chine continentale."
 Formosa.100.d:0 "Le nouvel État de Formose a récemment annoncé, lors d'une émission diffusée à l'échelle nationale, qu'il renonçait à toutes ses revendications sur la Chine continentale. Il a déclaré que la nation ne consacrerait plus ses efforts ni ne sacrifierait ses ressources à une cause qui n'avait guère d'importance en dehors des réfugiés et des fidèles du Kuomintang. Formose ne se préoccupe que du bien-être, de la sécurité et du développement de son propre peuple. Elle a ajouté qu'en renonçant à ces revendications territoriales, elle espérait établir des relations amicales et de bon voisinage avec le régime communiste chinois, tout en restant déterminée à défendre ses frontières contre toute agression. Aucune réponse officielle n'est encore venue de Pékin, mais de nombreux analystes estiment que l'annonce de Formose ne changera probablement pas la position du gouvernement chinois, qui considère que l'île est une province de la Chine et qu'elle doit être restituée au pays."
 KMT.110.d:0 "La République de Chine (ROC) et le Kuomintang, le parti au pouvoir, ont accueilli la visite présidentielle du président américain [USA.GetLeader]. Cette visite dans la capitale fait l'objet d'une intense couverture médiatique dans la presse insulaire afin de mettre en avant le soutien international dont bénéficie la ROC dans sa lutte pour la libération de la Chine. Les deux pays devraient aborder le renforcement de leur coopération en matière de défense, le commerce et la situation sécuritaire régionale. Le président [USA.GetLeader] rencontrera des hauts responsables gouvernementaux et devrait visiter des sites culturels à travers le pays. Le gouvernement communiste chinois a publié son propre communiqué condamnant les États-Unis pour ingérence dans les affaires intérieures de la Chine et a réaffirmé qu'il ramènerait bientôt l'île rebelle sous son contrôle. En réponse, un homme politique de la ROC a condamné la déclaration de la Chine continentale et a ajouté que cette visite légitimait le gouvernement du Kuomintang et contribuerait à faire taire les détracteurs de ses objectifs."
 KMT.201.d:0 "Aujourd'hui, sur l'île de Taïwan, un coup d'État a été perpétré contre le généralissime Tchang Kaï-chek. Selon les autorités et des représentants de l'armée, le général Sun-Li Jen, l'un des plus éminents généraux et dirigeants de la République de Chine, a mené un coup d'État militaire afin de destituer celui qu'il qualifie de « dirigeant incompétent qui fait honte à la nation chinoise ». Bénéficiant du soutien des Américains, nombreux sont ceux qui affirment que le coup d'État a été soutenu par la CIA et par le président américain, mais ces allégations n'ont, jusqu'à présent, reçu aucun fondement ; il semble que ce ne soit qu'une rumeur parmi tant d'autres concernant la destitution de Tchang."
 KMT.150.d:0 "Surnommé le « Rommel de l'Orient », le général Sun-Li Jen a été arrêté aujourd'hui par les autorités sur ordre du généralissime Tchang Kaï-chek. Ce dernier l'accuse de préparer un coup d'État militaire visant à renverser et à opprimer les Chinois de Taïwan. Tchang Kaï-chek a promis d'infliger une punition sévère au général, qui est également accusé de plusieurs négligences pour avoir laissé ses subordonnés prendre part à une révolte impliquant des agents communistes. À l'heure actuelle, le général est assigné à résidence, dans l'attente de son sort."
 CHI_KMT.0.d:0 "Les récentes modifications apportées aux dispositions provisoires, initialement adoptées pour aider le gouvernement à réprimer l'insurrection communiste, marquent une évolution importante. Mises en place à l'origine pour suspendre temporairement certaines libertés politiques et civiles, les premières dispositions provisoires visaient à renforcer les opérations de l'État contre les communistes et à empêcher leur infiltration. La situation au front s'étant temporairement stabilisée, l'Assemblée nationale a voté la révision de ces dispositions afin de faciliter dès à présent la démobilisation politique. En vertu des nouvelles dispositions, le président [CHI.GetLeader] se voit conférer des pouvoirs accrus pour rétablir le contrôle de l'État dans les territoires reconquis et éliminer tout sympathisant communiste restant."
 CHI_KMT.1.d:0 "Le KMT se trouve à la croisée des chemins. Ces dernières années, il a survécu à une guerre contre le Japon et à une résurgence communiste massive qui a failli renverser le régime. De nombreux membres réformateurs du parti estiment aujourd’hui que le moment est venu d’engager des réformes et de changer le cap du parti. Ils attribuent à la corruption, à l’incompétence et au manque de moral la raison pour laquelle le Japon et les communistes ont pu prospérer. Des réformes plus radicales renforceront l'État et garantiront qu'aucune idéologie ou force hostile ne puisse prospérer dans la république. Cependant, il existe des oppositions au sein du parti, principalement des factions anti-réformistes qui tirent profit du système actuel et qui ne sont pas d'accord, arguant que ce n'est que grâce à la centralisation et à la loi martiale que la république a été suffisamment forte pour vaincre ces menaces. Ils soutiennent que la Chine doit poursuivre dans cette voie afin d'achever son indépendance et son unification. Le président [CHI.GetLeader] doit décider soit de mener des réformes pour assurer la survie du pays, soit de laisser les factions corrompues continuer à déchirer le Kuomintang."
 CHI_TIB.0.d:0 "Le Dalaï-Lama a proclamé son indépendance et gouverne le Tibet depuis 1912. Par le passé, la République de Chine a généreusement reconnu au Dalaï-Lama ses titres historiques et présenté ses excuses pour les excès commis sous la dynastie Qing ; pourtant, il refuse de dialoguer avec nous. Nous maintenons que la souveraineté du Tibet appartient à la Chine, mais le Dalaï-Lama continue de le nier et a négocié des territoires par le passé sans notre permission. Le moment est venu pour nous d'imposer une résolution sur le Tibet et de décider une fois pour toutes de sa relation avec la République."
 KMT_MIL.1.d:0 "Un groupe d'officiers supérieurs a remis son rapport sur les capacités de combat, la logistique et l'organisation des forces armées. Ce rapport met en évidence les griefs des soldats concernant la faiblesse du soutien logistique et les irrégularités dans le versement des soldes. Il souligne également des problèmes liés au manque de leadership chez les officiers et à la formation insuffisante des soldats. Sans réformes, l'Armée nationale révolutionnaire risque de continuer à décliner. La structure actuelle favorise également la formation de cliques et le territorialisme, ce qui doit également être réformé. Les dirigeants nationaux ont décidé de donner suite à ce rapport et lanceront une série de réformes pour remédier à ces problèmes et renforcer la défense nationale."
 KMT_NUCLEAR.1.d:0 "Le président [CHI.GetLeader] a présidé l'inauguration du nouvel Institut de recherche sur l'énergie nucléaire. Cet événement marque un nouvel engagement du gouvernement en faveur du potentiel de la technologie nucléaire. Le gouvernement chinois espère que l'énergie nucléaire pourra jouer un rôle majeur dans la satisfaction des besoins énergétiques futurs, à mesure que l'ensemble du pays se développe. Cependant, l'institut se penchera également sur le développement privé d'armes nucléaires. La question sera de savoir si la Chine cherche à développer de telles armes par ses propres moyens ou en demandant l'aide des Américains. Si nous les développons nous-mêmes, nous aurons le contrôle total de ces armes, mais cela pourrait prendre beaucoup de temps. Faire appel aux Américains accélérerait le développement, mais limiterait notre indépendance et notre capacité à adapter le programme à notre situation. Nous devons décider de la voie à suivre, car les communistes sont sans aucun doute en train de développer leur propre bombe."
 CHI_INDO.0.d:0 "Depuis la fin de la Seconde Guerre mondiale, la région de l'Indochine a été le théâtre de multiples mouvements révolutionnaires communistes, qui cherchaient à renverser les régimes en place et collaboraient étroitement avec les partis communistes de l'Union soviétique et de la Chine. La République de Chine a manifesté son vif intérêt à soutenir notre pays dans nos luttes contre les insurrections communistes afin d'affaiblir le mouvement communiste en Asie de l'Est."
 CHI_INDO.1.t:0 "La République de Chine reconnaît le gouvernement [VIE.GetLeader]"
 CHI_INDO.1.d:0 "Après avoir ouvert son ambassade à Saigon et ainsi reconnu le gouvernement du Sud comme le gouvernement légitime du Vietnam, la République de Chine a décidé de soutenir ouvertement le régime de [VIE.GetLeader]. Les experts avaient prédit une implication chinoise dans le mouvement nationaliste de Vu-hong-Khanh, mais Nanjing a décidé d'ignorer ses ambitions et de collaborer avec le gouvernement actuel. On ignore si cette décision a été influencée par les États-Unis, mais pour l'instant, la République de Chine travaillera aux côtés de Saigon contre le Parti des travailleurs du Vietnam."
 CHI_INDO.1.a:0 "Magnifique."
 CHI_INDO.1.b:0 "Encore une marionnette de l'Occident."
 CHI_INDO.2.t:0 "Les inquiétudes de Nanjing concernant les minorités chinoises à Cholon"
 CHI_INDO.2.d:0 "Au fil des ans, notre gouvernement a promulgué certaines lois qui favorisaient les groupes ethniques autochtones du Vietnam. Cependant, depuis l'établissement de relations entre notre État et la République de Chine, les pressions internes et externes en faveur d'une révision de ces lois se sont intensifiées. Si Nanjing ne peut se permettre de cesser de nous soutenir d'un point de vue géopolitique, l'intensité et les formalités de nos relations pourraient toutefois en pâtir gravement. Il nous appartient désormais de décider si nous allons modifier nos politiques à l'égard des minorités chinoises ou maintenir le statu quo."
 CHI_INDO.2.a:0 "Nous ne pouvons pas nous permettre de perdre le soutien de la Chine. Il faut réviser ces lois."
 CHI_INDO.2.b:0 "Nous proposons une aide à la relocalisation à Nanjing."
 CHI_INDO.3.t:0 "Le gouvernement vietnamien révise les lois anti-chinoises"
 CHI_INDO.3.d:0 "Saigon a reconnu que notre soutien à leur cause est trop précieux pour être perdu. Les lois relatives à la discrimination légale des citoyens chinois sur les territoires contrôlés par l'État du Vietnam seront modifiées afin de garantir l'égalité des droits et de traitement à ces personnes. Il s'agit là d'une grande réussite pour notre gouvernement, qui montre clairement que nous protégeons non seulement les Chinois à l'intérieur de nos frontières, mais aussi en dehors de notre territoire."
 CHI_INDO.3.a:0 "Une journée importante pour les Chinois d'outre-mer !"
 CHI_INDO.4.t:0 "La contre-offre de Saigon"
 CHI_INDO.4.d:0 "Le gouvernement vietnamien a rejeté notre demande de révision des lois relatives à la discrimination légale et à l'inégalité de traitement dont sont victimes les citoyens chinois au Vietnam. Il a fait valoir que la volonté des groupes ethniques autochtones du Vietnam devait primer en matière de politiques nationales, mais Saigon reste ouvert à la négociation. Il a rédigé une contre-proposition, suggérant que nous reprenions les citoyens chinois et leur accordions notre pardon, tout en recevant de Saigon une indemnisation pour ces personnes, afin de les aider à se construire une nouvelle vie dans la République."
 CHI_INDO.4.a:0 "Nous sommes d'accord. Ramènons nos camarades à la maison."
 CHI_INDO.5.t:0 "Investissements chinois"
 CHI_INDO.5.d:0 "Les derniers mois de coopération et de communication intensives avec le gouvernement chinois ont porté leurs fruits. Les entreprises chinoises investissent dans nos secteurs d'activité et commercialisent leurs produits sur nos marchés, ce qui favorise l'afflux de capitaux dans notre économie. Avec leur aide, nous bâtirons une économie qui garantira la prospérité et la stabilité sociale, à l'opposé des économies planifiées radicales des « bandits du Nord »."
 CHI_INDO.5.a:0 "Génial !"
 CHI_INDO.6.t:0 "La République de Chine réaffirme son soutien au Viet-Quoc"
 CHI_INDO.6.d:0 "Après avoir établi son ambassade à Saigon et reconnu ainsi le gouvernement du Sud comme le gouvernement légitime du Vietnam, la République de Chine a décidé de soutenir secrètement le mouvement nationaliste Viet-Quoc dirigé par Vu-hong-Khanh. S'inspirant du Kuomintang, le VNQDD a réussi à rallier un petit nombre de partisans parmi les habitants du Nord, en particulier parmi les enseignants et les intellectuels. Le parti, qui a eu moins de succès auprès des paysans et des ouvriers industriels, était organisé en petites cellules clandestines. Les experts avaient prédit l'implication chinoise dans le mouvement nationaliste de Vu-hong-Khanh, compte tenu de la ligne anti-impérialiste du gouvernement de Nankin, qui ne considère les rebelles du Nord que comme des marionnettes de l'Union soviétique et reste sceptique quant à l'influence occidentale au Sud-Vietnam. Pour l'instant, la République de Chine continuera de collaborer dans une certaine mesure avec Saigon contre le Parti des travailleurs du Vietnam, mais ses projets de réaffecter des ressources au Viet-Quoc ne passeront pas inaperçus."
 CHI_INDO.6.a:0 "Pathétique !"
 CHI_INDO.7.t:0 "La République de Chine nous propose de renforcer nos relations amicales"
 CHI_INDO.7.d:0 "Constatant le renforcement des relations diplomatiques, le gouvernement nationaliste chinois a demandé la conclusion d'un pacte de non-agression avec le Vietnam, visant principalement à ne pas entraver l'influence économique chinoise en Indochine dans son ensemble. En échange, la Chine renoncera totalement à soutenir le mouvement Viet Quoc et remettra les membres de ce mouvement qui résident encore sur son territoire."
 CHI_INDO.7.a:0 "Accepter leur proposition"
 CHI_INDO.7.b:0 "Ils ont suffisamment influencé le Vietnam."
 CHI_INDO.8.t:0 "Une mission militaire chinoise en Indochine"
 CHI_INDO.8.d:0 "Alors que le gouvernement de Saigon tente de repousser les guérilleros communistes du Nord au moyen de campagnes coûteuses, le gouvernement chinois de Nankin a mis en place la Mission militaire en Indochine, placée sous la direction du général Nguyen Chan-A. Il ne fait toutefois aucun doute que cette initiative permettra aux deux pays de franchir une nouvelle étape dans le développement de leurs relations amicales."
 CHI_INDO.8.a:0 "Un Succès"
 CHI_INDO.8.b:0 "Excellent !"
 CHI_INDO.9.t:0 "Réorganisation du VNQDD"
 CHI_INDO.9.d:0 "Grâce aux efforts déployés par le Kuomintang pour s'immiscer dans les affaires du parti et réorganiser le Viet Quoc, des réformes et des changements de grande ampleur ont été mis en œuvre au sein de l'organisation du parti, parallèlement à des purges menées avec l'aide de la police secrète nationaliste chinoise. Bien que cette purge ait été en partie sanglante, elle a permis au VNQDD de ne plus dépendre du soutien des propriétaires terriens et des hommes d'affaires, ce qui lui a permis d'élargir sa base de soutien pour y inclure la paysannerie."
 CHI_INDO.9.a:0 "L'impérialisme chinois au grand jour"
 CHI_INDO.9.b:0 "Le Vietnam s'engage désormais sur la voie d'une révolution tridéiste !"
 CHI_INDO.10.t:0 "Entraînement du Viet Quoc"
 CHI_INDO.10.d:0 "Plusieurs généraux fidèles au VNQDD ont été envoyés en Chine pour y suivre une formation militaire dispensée par nos généraux qui se sont battus avec acharnement tant pendant la guerre de Résistance que pendant la guerre civile chinoise. Ils s'inscriront à notre académie militaire et recevront une formation adéquate avant d'être renvoyés au Vietnam pour y déclencher une révolution."
 CHI_INDO.10.a:0 "Une révolution orchestrée par des forces étrangères ? Les Chinois ont dépassé les bornes !"
 CHI_INDO.10.b:0 "Que le Vietnam s'unisse sous le drapeau à l'étoile blanche !"
 CHI_INDO.11.t:0 "Le Vietnam rejette notre proposition"
 CHI_INDO.11.d:0 "Saigon a répondu à notre proposition en la rejetant, affirmant qu'elle « affectait » la politique étrangère du Vietnam en Indochine, alors que l'influence chinoise domine la région. Cette réponse soudaine a conduit de nombreux politiciens à s'affronter sur l'orientation de la politique étrangère chinoise envers le Vietnam : les responsables nationalistes partisans de la ligne dure souhaitent soutenir à nouveau le VNQDD afin de s'en servir pour renverser le régime de Saigon, tandis que les responsables farouchement anticommunistes souhaitent ignorer la réponse du Sud-Vietnam et maintenir les liens avec ce pays.\n\nLes relations sino-vietnamiennes sont à deux doigts de devenir tendues ; nous devons réagir immédiatement à la situation actuelle."
 CHI_INDO.11.a:0 "Traîtres à la cause anticommuniste !"
 CHI_INDO.11.b:0 "Cela ne vaut pas la peine de nuire à nos relations."
 CHI_INDO.12.t:0 "La Chine propose à [ROOT.GetName] de rejoindre la Mission militaire en Indochine"
 CHI_INDO.12.d:0 "Le gouvernement de la République de Chine a proposé de nous apporter un soutien et une aide militaires, à l'instar de l'aide militaire qu'il avait fournie aux Sud-Vietnamiens dans le cadre de la nouvelle mission militaire en Indochine qu'il a mise en place. Cela nous permettra de moderniser notre armée sous la supervision de la Chine et de renforcer nos liens avec Nankin, ce qui pourrait ouvrir d'autres perspectives d'avenir bénéfiques pour notre pays."
 CHI_INDO.12.a:0 "Les Chinois sont les bienvenus pour apporter leur aide !"
 CHI_INDO.12.b:0 "Il vaudrait mieux qu'ils restent en dehors de l'Indochine."
 CHI_INDO.13.t:0 "Saigon accepte notre proposition"
 CHI_INDO.13.d:0 "Après mûre réflexion de la part de [VIE.GetLeader], le Sud-Vietnam accepterait la proposition de la République de Chine. Ce nouvel accord permettrait à la République de Chine et au Sud-Vietnam de tirer mutuellement profit de cette entente : la Chine pourrait agir librement en Indochine tout en favorisant les activités économiques au Vietnam, tandis que le Sud-Vietnam accueillerait les exilés du VNQDD résidant en Chine, ce qui permettrait d'affaiblir davantage le Mouvement Viet Quoc et conduirait à terme à son effondrement. Un jour glorieux pour les peuples de la Chine et du Sud-Vietnam !"
 CHI_INDO.13.a:0 "Puissent nos relations diplomatiques continuer à se développer !"
 CHI_INDO.14.t:0 "Le débat sur la loi sur la nationalité"
 CHI_INDO.14.d:0 "Le débat sur la loi sur la nationalité remonte à l'époque de la dynastie Qing, lorsque cette loi revendiquait la protection de la population chinoise d'outre-mer bien que celle-ci fût titulaire de la citoyenneté d'un pays étranger, alors que les puissances coloniales affirmaient le contraire et définissaient la nationalité de leurs sujets par le biais de leur statut de citoyenneté. Bien que le statu quo soit resté relativement paisible, les puissances coloniales parvenant à régler les différends entre les autochtones et les Chinois, la décolonisation a mis fin à la médiation des puissances coloniales dans les conflits entre les deux parties, ce qui a entraîné une instabilité précaire pour la population chinoise d'outre-mer, avec des incidents qui se sont soldés par des attaques et bien plus encore. Il semble que la seule façon de garantir la fin de la persécution des Chinois soit de conclure un accord avec les pouvoirs locaux ; sinon, aucune des deux parties ne reconnaîtra les lois sur la nationalité de l'autre, ce qui pourrait aggraver encore la situation."
 CHI_INDO.14.a:0 "Elle se transmettra par le droit du sang..."
 CHI_INDO.14.b:0 "Faire davantage de concessions aux autorités locales..."
 CHI_INDO.15.t:0 "La République de Chine exige l'abrogation des lois anti-chinoises"
 CHI_INDO.15.d:0 "Le sentiment anti-chinois est présent en Thaïlande depuis un certain temps déjà, mais Nankin a récemment constaté que ces lois anti-chinoises dépassaient les limites. Les autorités chinoises nous ont demandé d'adopter des mesures de protection juridique pour la population chinoise de Thaïlande. Bien que cela puisse être considéré comme une ingérence dans les affaires intérieures d'un autre pays, compte tenu de la position de plus en plus influente de la Chine sur la scène internationale, il serait peut-être préférable de céder à leurs demandes afin d'éviter un nouveau conflit."
 CHI_INDO.15.a:0 "Qui sont-ils pour nous dicter les lois de notre pays ?"
 CHI_INDO.15.b:0 "Peut-être devrions-nous nous résigner cette fois-ci."
 CHI_INDO.16.t:0 "La Thaïlande refuse d'abroger les lois anti-chinoises"
 CHI_INDO.16.d:0 "Malgré notre demande, la Thaïlande a jusqu’à présent refusé de céder, tout en aggravant la situation en nous accusant de « nous ingérer » dans ses affaires intérieures. Cette réponse a suscité choc et colère en Chine, et de nombreux responsables politiques d’obédience nationaliste et patriotique ont proposé de prendre des mesures pour sanctionner la Thaïlande, qui laisse s’amplifier le sentiment anti-chinois. Nous ne tolérerons pas que nos compatriotes à l’étranger soient réduits à l’esclavage."
 CHI_INDO.16.a:0 "Mettons fin à la mission militaire en Indochine en Thaïlande !"
 CHI_INDO.16.b:0 "Il n'y a aucune raison d'aggraver encore la situation."
 CHI_INDO.17.t:0 "La Thaïlande s'engage à abroger les lois anti-chinoises."
 CHI_INDO.17.d:0 "L'ambassadeur thaïlandais a annoncé aux Chinois une excellente nouvelle concernant l'acceptation par la Thaïlande de la demande chinoise. La fin des lois anti-chinoises permettra aux Chinois de Thaïlande de bénéficier de la protection juridique garantie par la Constitution et de jouir des mêmes droits que les Thaïlandais eux-mêmes. Une journée mémorable pour les Chinois vivant sous les quatre mers !"
 CHI_INDO.17.a:0 "Vive le peuple chinois !"
 CHI_INDO.18.t:0 "La fin de la mission militaire en Indochine pour nous"
 CHI_INDO.18.d:0 "Selon certaines informations, la République de Chine nous aurait exclus du programme de la Mission militaire en Indochine, qui s'adressait à tous les pays de la région. De toute évidence, le refus de leurs exigences n'a pas été bien accueilli, et ils tentent désormais d'envoyer un avertissement sévère au monde entier, indiquant que leurs exigences doivent être satisfaites sous peine de conséquences. Face à cette situation, de nombreux politiciens thaïlandais ont suggéré une répression plus sévère à l'encontre des Chinois de Thaïlande afin de manifester notre opposition à la tentative de la Chine de nous asservir. Nous allons signer immédiatement de nouvelles lois anti-chinoises."
 CHI_INDO.18.a:0 "Nous résisterons à la menace chinoise."
 CHI_INDO.19.t:0 "Nouvelle loi sur la nationalité de la République de Chine"
 CHI_INDO.19.d:0 "En raison de l'inefficacité du principe du jus sanguinis, une nouvelle loi sur la nationalité a été adoptée afin de régler cette question. Des démarches ont été entreprises auprès des pays d'Asie du Sud-Est en vue de conclure un traité de double nationalité avec ces pays, afin de permettre aux migrants chinois de choisir entre retourner en Chine continentale ou continuer à résider dans la région. Cette initiative permet au gouvernement chinois de freiner efficacement les sentiments sinophobes en Asie du Sud-Est et de renforcer la coopération avec les pays de cette région."
 CHI_INDO.19.a:0 "Une nouvelle étape vers le progrès"
 CHI_INDO.19.b:0 "Très bien, cela sera accepté."
 CHI_INDO.20.t:0 "[ROOT.GetName] accepte notre traité sur la double nationalité"
 CHI_INDO.20.d:0 "[ROOT.GetName] a accepté de signer le traité pour le faire entrer en vigueur. À l'heure actuelle, des milliers d'immigrants chinois ont le choix entre se réinstaller en Chine continentale ou continuer à vivre en Asie du Sud-Est. Si la population chinoise souhaite retourner en Chine, elle se verra accorder la pleine citoyenneté et bénéficiera d'une aide à la recherche d'emploi à son arrivée."
 CHI_INDO.20.a:0 "Bienvenue chez toi !"
 KMT_qiaowuweiyuanhui.1.t:0 "Le Conseil des affaires de la communauté chinoise d'outre-mer"
 KMT_qiaowuweiyuanhui.1.d:0 "Le Conseil des affaires des communautés chinoises d'outre-mer (Qiáo Wù Wěiyuánhuì) a été créé en 1926 à Guangzhou, dans le but de collaborer avec les communautés chinoises d'outre-mer et de répondre à leurs besoins, bien qu'elles ne résident pas directement dans notre pays. Cependant, les communautés chinoises d'outre-mer continuent de vivre dans la crainte d'être persécutées par certains de leurs gouvernements, en raison de la propagation d'un discours anti-chinois généralisé, ce qui provoque un mécontentement massif non seulement à l'égard de la population chinoise vivant dans leur pays, mais aussi à l'égard de la communauté chinoise dans son ensemble. Nous devons veiller à ce que le peuple chinois obtienne justice."
 KMT_qiaowuweiyuanhui.1.a:0 "Leur persécution prendra bientôt fin."
 KMT_qiaowuweiyuanhui.1.b:0 "Nous ne sommes pas en mesure de les aider."
 KMT_qiaowuweiyuanhui.2.t:0 "Ouverture de nouveaux bureaux du Conseil des affaires communautaires en Asie du Sud-Est"
 KMT_qiaowuweiyuanhui.2.d:0 "Afin de renforcer nos liens avec nos compatriotes chinois d'Asie du Sud-Est, nous avons ouvert des bureaux sous l'égide du Conseil des affaires communautaires des Chinois d'outre-mer. Cette initiative permettra également de consolider notre influence dans les pays d'Asie du Sud-Est et constituera un avertissement clair aux autorités locales : nous serons présents pour veiller aux intérêts de nos compatriotes d'outre-mer et défendre leurs droits."
 KMT_qiaowuweiyuanhui.2.a:0 "Compris"
 KMT_qiaowuweiyuanhui.3.t:0 "Coopération avec l'Association chinoise consolidée Benelovent"
 KMT_qiaowuweiyuanhui.3.d:0 "L'Association chinoise consolidée du Benelovent (Zhōnghuá Huìguǎn), ou simplement « Association chinoise » en traduction littérale, constitue le pilier de la communauté chinoise d'outre-mer résidant en Amérique du Nord, plus précisément aux États-Unis et au Canada. Cette association regroupe principalement des colons chinois du XIXe siècle, qui ont dû faire face à des persécutions plus sévères que celles subies par les colons chinois du XXe siècle. L'Association a accepté de coopérer étroitement avec notre Conseil des affaires de la communauté chinoise d'outre-mer afin de coordonner les communautés chinoises tant en Amérique du Nord qu'en Chine continentale et de traiter leurs problèmes aux États-Unis ainsi qu'au Canada."
 KMT_qiaowuweiyuanhui.3.a:0 "Un moment décisif de l'histoire."
 KMT_diplomatic_report.1.t:0 "Rapport diplomatique sur la République de l'Inde"
 KMT_diplomatic_report.1.d:0 "La République de l'Inde, fondée il n'y a pas si longtemps, en 1947, juste après la fin de la guerre du Pacifique. Pendant la guerre du Pacifique, Chiang Kai-Shek et Soong Mei-Ling, qui avaient tous deux exprimé leur soutien sans faille à l'indépendance de l'Inde, ont déployé des efforts considérables pour soutenir cette cause. Cependant, peu après leur indépendance, les Indiens ont commencé à collaborer avec les Soviétiques tout en adoptant une position neutre dans le conflit de la guerre froide. Il est clair que le monde évolue rapidement et que nous devons prendre la décision d'aller de l'avant."
 KMT_diplomatic_report.1.a:0 "Nous maintiendrons des liens étroits avec l'Inde !"
 KMT_diplomatic_report.1.b:0 "Peut-être devrions-nous nous tourner vers le Pakistan ?"
 KMT_diplomatic_report.1.c:0 "Il vaut mieux ne pas répondre à cette question."
 KMT_diplomatic_report.2.t:0 "Rapport diplomatique sur la situation au Japon"
 KMT_diplomatic_report.2.d:0 "La création de l'État du Japon, qui a vu le jour avec la signature du traité de San Francisco et a ainsi rendu le pays indépendant, soulève une question pour beaucoup : quel sera l'avenir des relations sino-japonaises ? Jusqu'à présent, Tchang Kaï-chek a mené une politique consistant à pardonner aux Japonais leurs actes horribles commis pendant la Seconde Guerre mondiale, et il a même collaboré avec des officiers japonais de haut rang pendant la guerre civile contre les communistes. Le Japon a infligé souffrances et terreur à notre peuple, mais cela doit-il pour autant faire des Chinois et des Japonais des ennemis à jamais ?"
 KMT_diplomatic_report.2.a:0 "Ils méritent une seconde chance."
 KMT_diplomatic_report.2.b:0 "Il serait trop risqué de nouer des liens d'amitié avec le Japon."
 KMT_diplomatic_report.3.t:0 "Rapport diplomatique sur l'Asie du Sud-Est maritime"
 KMT_diplomatic_report.3.d:0 "L'Asie du Sud-Est maritime comprend la Malaisie, l'Indonésie et les Philippines. Ces pays étaient autrefois vassaux des anciennes dynasties chinoises qui régnaient sur la Chine et, à ce titre, ont exercé une influence considérable sur la région. Malgré cela, les puissances impérialistes ont réussi à effacer notre influence sur la région et, dans le même temps, à affaiblir la Chine, de sorte que même les puissances locales ne craignent plus notre autorité, ce qui a ouvert la voie à la persécution des populations chinoises locales."
 KMT_diplomatic_report.3.a:0 "Nous devrions chercher à renforcer nos liens avec eux."
 KMT_diplomatic_report.3.b:0 "Dénoncez-les pour avoir persécuté notre peuple !"
 KMT_diplomatic_report.3.c:0 "Tout cela nous est indifférent."
 CHI_BANDIT.0.d:0 "Le chaos de la guerre et de la guerre civile a fait des campagnes et des villes isolées les proies des bandits. Il s'agit souvent d'unités militaires désertrices ou de milices armées qui ravagent les campagnes. Ces bandits commettent des crimes innommables contre les voyageurs et pillent les marchandises transportées sur les routes. Le gouvernement du KMT devra s'attaquer à cette crise afin de relancer le commerce intérieur et de mieux unifier le pays. Pour de nombreux paysans, ce sont les seigneurs de guerre locaux qu'ils sollicitent pour se protéger des bandits, et non le gouvernement. Si le problème des bandits n'est pas résolu, le soutien populaire et l'économie s'éroderont rapidement."
 CHI_VIN.0.d:0 "Dans le cadre de notre politique de soutien au Viet Quoc, mouvement anticolonial, nos agents de renseignement ont commencé à assassiner discrètement des officiers du Viet Minh. Le Viet Minh, mouvement communiste, est un autre grand parti anticolonial vietnamien qui rivalise avec le Viet Quoc pour la légitimité et le recrutement. L'élimination de ses officiers entravera sa capacité à recruter davantage de combattants ou à mettre en place des groupes organisés de combattants. Le Viet Quoc devrait ainsi être en mesure de mieux recruter et de se présenter comme un véritable parti en faveur de l'indépendance du Vietnam. Le Viet Minh ne semble pas avoir conscience de notre implication dans ces assassinats."
 CHI_VIN.1.d:0 "Au cours des dernières semaines, plusieurs de nos officiers ont été assassinés, principalement dans nos bases situées le long de la frontière chinoise. L'enquête est en cours, mais les coupables potentiels semblent être soit les Français, soit les Chinois, soit le Viet Quoc. Les Français nous considèrent comme la principale menace, mais leur présence dans la région n'est pas aussi bien établie. Les Chinois sont farouchement anticommunistes, mais soutiennent la cause anticolonialiste. Les Viet Quoc prétendent être nos camarades et souhaitent lutter à nos côtés contre les Français, mais semblent incapables de mener des opérations aussi sophistiquées. Quoi qu'il en soit, l'élimination de nos officiers affaiblit notre capacité de recrutement et notre efficacité au combat. Nous devrons suivre la situation de près."
 KMT_Fuguo.1.d:0 ""
 KMT_Fuguo.2.d:0 ""
 KMT_LAND_REFORM.0.d:0 "L'une des principales difficultés auxquelles la République de Chine a été confrontée depuis ses débuts est celle de la réforme agraire. L'incapacité apparente à briser le pouvoir des propriétaires terriens et à offrir des perspectives aux paysans a longtemps été tenue pour responsable des troubles paysans et de la popularité du communisme. L'incapacité à mettre en place une réforme agraire en profondeur est également tenue pour responsable du développement économique atone, la Chine ne parvenant toujours pas à atteindre son véritable potentiel agricole. Cependant, les propriétaires fonciers apportent un soutien politique et financier au gouvernement, et briser leur pouvoir risquerait de renforcer les groupes qui s'opposent souvent au KMT. Le gouvernement doit décider soit de lancer une réforme agraire à grande échelle pour remédier au problème, soit de proposer un plan de réforme plus modeste afin d'apporter un soulagement aux paysans sans pour autant s'aliéner les puissantes classes de propriétaires fonciers."
 TIBET_KMT.100.d:0 "La République de Chine reconnaît que le Panchen Lama, considéré comme le deuxième chef spirituel après le Dalaï-Lama, cherche de plus en plus à jouer un rôle politique plus important. Le Panchen Lama disposerait de ses propres forces militaires fidèles et serait à la recherche d'une aide extérieure. Le gouvernement chinois est prêt à fournir à ses forces des armes, une formation et des fonds, à condition qu'il intervienne au cas où le Dalaï-Lama refuserait d'accepter la souveraineté chinoise. Cela place le Dalaï-Lama dans une position difficile, car il est désormais clair qu'il risque un soulèvement ou un coup d'État s'il ne se plie pas aux exigences de la Chine."
 TIBET_KMT.4.d:0 "La République de Chine nous a demandé d'accepter sa souveraineté sur nos territoires. Les Chinois promettent de respecter notre gouvernement et notre administration actuels, mais souhaitent contrôler notre politique étrangère et notre défense. Si nous refusons cette exigence, nous risquons de faire l'objet de tentatives, ouvertes ou dissimulées, visant à nous faire changer d'avis. Mais nous aurions alors une chance de préserver notre indépendance. Si nous acceptons, nous conserverons une certaine autonomie et une certaine liberté d'action ; toutefois, à terme, les Chinois pourraient chercher à occuper directement le Tibet."
 TIBET_KMT.20.d:0 "Le Dalaï-Lama a été informé que des routes principales et des carrefours stratégiques sont bloqués par des hommes armés. Il semblerait que le Panchen-Lama, dont l'importance spirituelle n'est surpassée que par celle du Dalaï-Lama lui-même, soit en train d'orchestrer un coup d'État. Il s'agit d'une réaction directe à notre décision de ne pas accepter la souveraineté chinoise, et nous soupçonnons les Chinois d'inciter le Panchen-Lama à agir. Quant au Panchen Lama, il a exprimé le désir d'obtenir une plus grande autorité politique, et il semble que ce soit ce que les Chinois lui promettent. Il a également mobilisé ses propres combattants et les utilise sans aucun doute dans cette tentative de coup d'État. Nos propres fidèles à Lhassa s'organisent pour riposter, mais il n'est pas certain que nous parvenions à mettre fin au coup d'État."
 KMT_MIL.2.d:0 "Le Bureau d'enquête judiciaire est la principale agence de renseignement de la République. Il relève directement du comité exécutif, mais la récente guerre contre le Japon et les communistes a mis en évidence ses faiblesses. L'organisation semble parfois encline à la corruption et aux pots-de-vin. Sur le terrain, les capacités de renseignement étaient également insuffisantes, l'organisation peinant à recueillir des informations sur l'infiltration et les mouvements communistes. Un nouveau plan de réforme est en cours de mise en œuvre afin d'améliorer la formation, de renforcer l'organisation et d'augmenter les salaires pour remonter le moral des troupes. Plus important encore, l'influence des officiers militaires sera limitée afin d'améliorer la capacité du Bureau d'enquête judiciaire à enquêter sur les affaires militaires."
 KMT_MIL.3.d:0 "Les réformes et les enquêtes menées au sein de l'armée de la République de Chine révèlent qu'un certain nombre d'officiers de haut rang sont idéologiquement compromis ou enclins à la corruption. Les dirigeants doivent décider de la marche à suivre. Certains préconisent une grande purge visant à écarter ces officiers négligents des postes clés. Une mesure aussi radicale pourrait s'aliéner l'armée et nuire au moral à court terme, mais elle présenterait des avantages à long terme. L'autre solution possible serait d'envoyer ces officiers à des postes difficiles ou isolés, en particulier à la frontière. Ces officiers ne seraient plus en mesure d'avoir une influence négative sur la défense et seraient empêchés d'accéder à des grades supérieurs. Cette voie atténuerait l'impact sur l'armée en tant qu'institution, mais les effets positifs ne seraient pas aussi importants qu'avec une purge massive."
 KMT_MIL.4.d:0 "La direction a décidé d'affecter à la frontière les officiers jugés compromis sur le plan idéologique, corrompus ou inaptes sur le plan militaire. Cette mesure les écartera des postes de commandement importants et les isolera souvent, les empêchant ainsi de former des cliques au sein de l'armée. Ces postes à la frontière sont dépourvus du confort et de la gloire que l'on trouve dans d'autres affectations. Ces officiers verront désormais leur voie vers la promotion bloquée et beaucoup d'entre eux devraient finir par prendre leur retraite. Le transfert de ces officiers vers la frontière nous aidera à lutter contre la corruption et l'inefficacité, ouvrant ainsi la voie à des officiers plus compétents et plus patriotes."
 KMT_MIL.5.d:0 "Le président [CHI.GetLeader] a ordonné aux autorités militaires, policières et des services de renseignement de procéder à l'arrestation massive des officiers identifiés comme étant idéologiquement compromis, politiquement corrompus ou pénalement inaptes à exercer leurs fonctions. Cette vague d'arrestations d'officiers militaires libère de nombreux postes et va susciter un certain malaise au sein de l'armée. Cependant, la voie est désormais ouverte pour que des officiers plus jeunes, patriotes et compétents accèdent à des postes plus élevés. Cette période d'arrestations et de purges provoquera sans aucun doute une panique et des défis organisationnels au sein de l'armée, mais une fois qu'elle sera terminée, la défense de la République de Chine sera bien plus solide."
 KMT_MIL.6.d:0 "Les purges d'officiers militaires menées par le gouvernement de la République de Chine semblent toucher à leur fin. Le dernier groupe d'officiers a récemment été arrêté, jugé et condamné. De nombreux analystes estiment qu'il faudra du temps à l'armée chinoise pour rétablir le moral et la stabilité dans ses rangs. Toutefois, le gouvernement est convaincu qu'une fois que les officiers nouvellement promus auront acquis confiance et expérience, les capacités militaires de la République seront bien plus solides qu'auparavant. On estime également que ces purges montreront aux jeunes officiers et à ceux qui intègrent les académies militaires qu'ils doivent faire preuve de professionnalisme et de dévouement envers la nation."
 KMT_MIL.7.t:0 "La République de Chine invite Alexander von Falkenhausen"
 KMT_MIL.7.d:0 "Le gouvernement national de la République de Chine nous a contactés pour inviter l'ancien attaché militaire Alexander von Falkenhausen à revenir en Chine, afin de contribuer à la réorganisation de l'ancienne Armée nationale révolutionnaire. Falkenhausen s'est fait connaître vers la fin de la Seconde Guerre mondiale pour ses liens avec la conspiration du 20 juillet, ce qui lui a valu d'être arrêté par la Gestapo. Après la guerre, il a témoigné lors des procès de Nuremberg. Bien qu'il ait été condamné à 12 ans de travaux forcés, Falkenhausen a été libéré trois semaines seulement après le prononcé de sa peine et s'est installé à la frontière intérieure allemande, près du manoir de son vieil ami Franz von Papen.\n\nEnvoyant à nouveau Falkenhausen en Chine permettrait de rétablir et d'approfondir nos relations avec le Kuomintang et de les aider dans leur inévitable reconquête du nord de la Chine."
 KMT_MIL.7.a:0 "Bon voyage, Alexander."
 KMT_MIL.Falkenhausen_Back.t:0 "Falkenhausen revient en Chine"
 KMT_MIL.Falkenhausen_Back.d:0 "Le gouvernement fédéral allemand a autorisé le retour de Falkenhausen en Chine et a accepté sa nomination au poste de conseiller principal auprès de Chiang. Alexander apportera son aide à notre gouvernement dans le cadre des réformes militaires. Alors qu'il préparait son voyage en Chine, il a mis au jour d'anciens documents relatifs au « plan des 60 divisions » de Hans von Seeckt, qui avait été utilisé par l'Armée nationale révolutionnaire il y a plusieurs décennies."
 KMT_MIL.Falkenhausen_Back.a:0 "Bon retour parmi nous."
 KMT_MIL.8.d:0 "La brigade d'entraînement constitue un élément essentiel du plan de la 60e division. En tant qu'unité de démonstration, elle servira de modèle pour la nouvelle armée chinoise moderne. Grâce à une conception et une mise en œuvre minutieuses, la brigade d'entraînement fera la démonstration des tactiques, de la stratégie et des capacités de commandement les plus avancées, devenant ainsi le berceau de la formation et du développement de talents militaires exceptionnels. À mesure que ce nouveau modèle sera adopté par de nouvelles unités, il contribuera à améliorer l'efficacité et l'efficience au combat de l'ensemble de l'armée chinoise, lui permettant ainsi de rester compétitive dans les conflits militaires modernes et d'apporter une contribution positive à la sécurité et au développement du pays."
 KMT_MIL.9.d:0 "En tant que modèle et terrain d'expérimentation de la réforme militaire, la brigade d'entraînement a finalement mis en place la structure militaire la mieux adaptée à la Chine. Nous pouvons désormais nous en servir de modèle pour lancer la formation de la 60e division. La mise en place de cette structure militaire est le fruit d'essais et d'ajustements répétés sur le terrain. Grâce aux efforts de la brigade d'entraînement, nous avons trouvé la structure organisationnelle et le mode de combat les plus efficaces, qui apporteront à notre armée une efficacité et une efficience de combat accrues."
 KMT_MIL.10.d:0 "Alors que le plan des soixante divisions touche à sa fin, ces soixante divisions d'élite, qui s'inspirent de la brigade d'entraînement et adoptent une nouvelle structure militaire, constitueront l'épine dorsale de l'armée chinoise modernisée et le pilier sur lequel reposera la victoire future sur le Parti communiste en Mandchourie. Le plan des soixante divisions marque également une étape importante dans la transformation de l'armée chinoise. Il représente une grande réussite dans la modernisation de nos forces armées et apporte de nouvelles améliorations à nos capacités de défense nationale. Cette transformation n'est pas seulement une mise à jour technique et structurelle, mais aussi une redéfinition de l'efficacité au combat et du positionnement stratégique de notre armée, ouvrant un nouveau chapitre pour la sécurité et le développement de notre pays."
 KMT_MIL.11.d:0 "Dans notre volonté de réformer et de remédier aux lacunes de la structure des forces armées américaines, l'approche la plus logique consiste à faire appel à l'expertise de ceux qui connaissent parfaitement les subtilités du système : les conseillers militaires de l'armée américaine. Heureusement, en tirant parti de l'influence du lobby chinois et de nos relations avec des généraux pro-République de Chine tels que Wedemeyer, nous avons réussi à obtenir l'aide d'un groupe de conseillers militaires américains pour soutenir nos efforts de réforme militaire. Cette collaboration représente pour nous une opportunité majeure de bénéficier des connaissances et de l'expérience de professionnels chevronnés, accélérant ainsi nos progrès vers la mise en place d'une structure militaire plus solide et plus efficace."
 KMT_MIL.12.d:0 "Il est évident que la Chine reste un pays confronté à des défis en matière de développement, et cette réalité s'étend même au domaine de la logistique militaire. La complexité et la sophistication de la structure des forces armées américaines reposent largement sur des chaînes d'approvisionnement solides et des infrastructures bien établies, des éléments qui font actuellement défaut dans notre cadre militaire. Pour remédier aux lacunes de la structure des forces armées américaines, il est nécessaire de procéder à une refonte fondamentale de nos systèmes logistiques ; ce n’est qu’une fois que nous aurons atteint un niveau d’approvisionnement suffisant que nous pourrons espérer que la structure des forces armées américaines fonctionne de manière optimale et soutienne efficacement nos opérations militaires. Ainsi, l’amélioration de notre système logistique constitue la première étape cruciale pour nous aligner sur les normes et les exigences de la structure des forces armées américaines."
 KMT_MIL.13.d:0 "Au fil du temps, il apparaît de plus en plus clairement que les approches traditionnelles ne suffisent plus à répondre aux besoins en constante évolution de nos forces armées. C'est pourquoi nous élaborons avec soin de nouvelles méthodologies adaptées aux exigences actuelles et visant à préserver l'efficacité de la structure de notre armée. Cette initiative proactive souligne notre engagement en faveur de l'adaptabilité et de l'amélioration continue afin de garantir le fonctionnement optimal de nos forces armées dans un contexte en constante évolution."
 KMT_MIL.14.d:0 "À l'issue du plan des « 90 divisions », les 90 divisions prévues, chacune conçue pour remplir des rôles spécifiques et soutenue par un réseau logistique entièrement réorganisé, sont en passe de devenir la pierre angulaire de l'armée chinoise modernisée. Leur importance stratégique s'étend à la lutte contre l'influence communiste en Mandchourie et au-delà. Ce plan marque un tournant décisif dans le processus de modernisation de l'armée chinoise, en remédiant aux principales lacunes héritées de l'adoption de la structure militaire américaine. Il représente une étape décisive vers le renforcement de nos capacités militaires et l'adaptation aux exigences de la guerre moderne."
 KMT_MIL.15.t:0 "Souvenirs de l'Académie militaire de Whampoa"
 KMT_MIL.15.d:0 "En 1925, le Dr Sun Yat-Sen a fondé l'Académie militaire de Whampoa, destinée à former une nouvelle génération d'officiers qui consacreraient leur vie à la révolution nationale pendant les décennies à venir. La majorité des officiers et des généraux de nos forces armées sont issus de l'Académie militaire de Whampoa et jouissent ainsi d'une influence considérable en Chine. L'Académie a été transférée de Whampoa (à Guangzhou) à Nanjing après l'Expédition du Nord et a été rebaptisée Académie militaire centrale. La période des guerres étant désormais révolue pour nous, nous allons faire revivre l'esprit de Whampoa sous la direction de [CHI.GetLeader], en avant avec l'esprit de Whampoa !"
 KMT_MIL.15.a:0 "Une camaraderie que nous chérirons pour toujours."
 KMT_MIL.16.t:0 "Promotion du général Sun"
 KMT_MIL.16.d:0 "Général intrépide qui a réussi à changer le destin de la République, il a largement prouvé sa loyauté en continuant à se battre et à nous aider, bien que nous lui ayons tourné le dos auparavant. Dès demain, il sera chargé de superviser les réformes militaires des Forces armées de la République de Chine, avec le concours du MAAG (Groupe consultatif d'assistance militaire) américain pour leur mise en œuvre."
 KMT_MIL.16.a:0 "Il continuera à nous aider."
 FRA_KMT.1.d:0 "La République de Chine a pris contact en privé avec notre gouvernement pour solliciter une coopération dans le domaine de la technologie nucléaire, y compris en matière d'armement. Les Chinois indiquent qu'ils ont accès à des matières nucléaires et qu'ils sont en train de mettre en place une infrastructure de grande envergure. Cependant, ils ont besoin de l'expertise et de l'expérience françaises dans le domaine nucléaire. La Chine est située dans une région stratégique et fait face à des menaces majeures de la part de ses voisins communistes. Si nous soutenons la Chine, nous pourrions renforcer l'anticommunisme dans la région et affirmer notre influence en Chine. Une telle relation pourrait contribuer à protéger nos propres intérêts dans la région. Cependant, soutenir les Chinois pourrait nous aliéner les Soviétiques et les Américains. Un autre problème est que certains conseillers se demandent si les avantages en valent la peine par rapport à ce que les Chinois attendraient de nous."
 FRA_KMT.2.d:0 "Le gouvernement français a indiqué qu'il nous apporterait son soutien dans nos efforts visant à développer notre programme nucléaire. Cela constituera un atout majeur pour nos efforts en vue de nous doter d'une force de dissuasion nucléaire. Plus important encore, nous ne serons plus dépendants des États-Unis et nos relations avec la France seront bien plus coopératives. Nous pouvons offrir à la France l'accès à des matières nucléaires pour ses propres programmes. Nos plus hauts responsables du nucléaire prévoient de se rendre à Paris dans les prochains jours pour rencontrer leurs homologues."
 FRA_KMT.3.d:0 "Le gouvernement français a rejeté notre proposition de coopération nucléaire. Il semble qu’il ne perçoive pas les avantages d’une collaboration et d’un alignement des intérêts entre nos deux pays. Nous ne savons pas si cette décision française est motivée par la crainte de répercussions internationales ou par des menaces directes émanant d’autres puissances. Quoi qu’il en soit, c’est à leur détriment, et le peuple chinois poursuivra sur la voie de la dissuasion nucléaire. Le gouvernement redoublera d’efforts pour soutenir les scientifiques et les installations qui se consacrent au développement de la technologie nucléaire chinoise."
 KMT_Sinification.0.d:0 "La République de Chine a intensifié sa campagne de sinisation. Le gouvernement s'efforce depuis longtemps de forger l'unité nationale en diffusant la culture et la langue chinoises dans toutes les communautés. En privé, un responsable a déclaré que tout le monde devait devenir chinois ou quitter le pays, et que l'ère des barbares était révolue. La campagne se heurte à une certaine résistance, en particulier dans les provinces frontalières de la Chine, dont les habitants ne sont souvent pas d'origine chinoise ou suivent leurs propres traditions culturelles ou religieuses. Le gouvernement ne semble pas s'inquiéter outre mesure des réactions négatives des non-Chinois."
 KMT_VICTORY_TERROR.0.d:0 "Le gouvernement de la République de Chine a récemment lancé une campagne visant à réprimer la dissidence et les menaces pesant sur l'État. La police et d'autres organismes publics ont déjà ouvert des enquêtes sur des hommes politiques, des écrivains, des militants et des intellectuels accusés de sympathiser avec les ennemis de l'État ou de les soutenir ouvertement. Les sympathisants communistes et les éléments criminels semblent notamment être dans le collimateur. De nombreux militants des droits de l'homme s'inquiètent du fait que cette nouvelle répression de la dissidence marque le début d'une « terreur blanche » et qu'elle sera utilisée pour écraser toute menace pesant sur le parti au pouvoir, au détriment des droits individuels ou politiques."
 KMT_CULTS.0.d:0 "La République de Chine a décidé de légaliser les sectes secrètes qui prolifèrent dans les zones rurales du pays. Ces mouvements à caractère quasi-religieux et culturel existent depuis des siècles. Bon nombre des soulèvements les plus puissants de l'histoire chinoise ont été provoqués par ces sectes. Au cours des dernières décennies, des forces d'autodéfense locales se sont constituées à partir de ces groupes, à l'époque des seigneurs de guerre et de la guerre civile. Le gouvernement chinois estime qu'en légitimant ces groupes, il pourra s'appuyer sur ces forces d'autodéfense et sur la stabilité qu'elles apportent pour soutenir l'État. Cependant, certains craignent que ces groupes n'utilisent cette légitimation pour étendre leur influence sous la protection de l'État."
 KMT_CULTS.1.d:0 "La République de Chine a décidé de sévir et de démanteler les sectes et les sociétés secrètes qui prolifèrent dans les zones rurales du pays. Bien que ces groupes existent depuis des siècles, ils ont commencé, au cours des dernières décennies, à former des milices locales d’autodéfense dans le contexte d’anarchie générale qui a marqué l’époque des seigneurs de guerre et de la guerre civile. En s’attaquant à ces groupes, le gouvernement chinois s’expose à une crise de l’ordre public jusqu’à ce qu’il parvienne à établir sa présence dans ces régions. D'autres craignent que ces sectes ne se transforment même en bandes de brigands et n'érodent davantage l'ordre public. Quoi qu'il en soit, cette initiative témoigne d'une forte volonté de l'État chinois d'affirmer son contrôle sur le pays."
 KMT_SHOW_TRIALS.1.d:0 "Une série de procès publics de grande envergure se déroule actuellement dans toute la République de Chine. Des collaborateurs japonais de la Seconde Guerre sino-japonaise et des militants communistes accusés de crimes commis pendant la guerre civile sont jugés en audience publique. Le gouvernement assure une large couverture médiatique de ces procès à travers le pays et, selon les premières indications, les tribunaux devraient condamner toutes les personnes inculpées. Le gouvernement tient à démontrer la puissance de la République de Chine et à rendre justice au peuple chinois. Les opposants au gouvernement et les observateurs internationaux dénoncent ces procès, les qualifiant de pure mise en scène et de théâtre politique."
 KMT_LAND_REFORM.1.d:0 "Dans une décision surprise, la République de Chine a adopté une nouvelle loi globale sur la réforme agraire, destinée à réduire le pouvoir écrasant des propriétaires fonciers et à offrir de nouvelles perspectives aux paysans. Pendant des décennies, le KMT au pouvoir a noué des liens étroits avec les propriétaires fonciers ruraux et, pendant des années, son refus de soutenir la réforme agraire s'est avéré avantageux pour les communistes. Le gouvernement espère que son engagement en faveur de la réforme agraire permettra de gagner la sympathie des paysans envers l'État et de priver les communistes d'un vivier fertile de recrues pour leurs opérations d'insurrection."
 KMT_LAND_REFORM.2.d:0 "La République de Chine a adopté une nouvelle loi sur la réforme agraire, que le gouvernement présente comme une victoire retentissante pour les paysans chinois. Cependant, bien que le gouvernement se vante d’avoir mené une réforme majeure, de nombreux observateurs locaux et internationaux estiment que ces réformes sont minimes. Les propriétaires fonciers continuent de bénéficier de nombreuses échappatoires et les paysans ne verront pas leur situation changer de manière significative. Il semble que le gouvernement ne soit pas disposé à perdre le soutien traditionnel des propriétaires fonciers, qui apportent un appui économique et politique à l’État."
 CHI_MARTIAL_LAW.0.d:0 "La République de Chine a annoncé qu'elle allait lever la loi martiale sur l'ensemble du territoire. Cette mesure s'inscrit dans le cadre d'un vaste effort de réforme au sein du KMT, le parti au pouvoir. Les réformateurs sont fermement convaincus que le rétablissement des droits constitutionnels et démocratiques affaiblira la dissidence et le soutien populaire dont bénéficient les dirigeants régionaux ou les infiltrés communistes. Des réformes similaires devraient se poursuivre, malgré les critiques formulées par certains membres de la vieille garde du parti, qui craignent que ces réformes et cette démocratisation n'entraînent une perte de contrôle et ne favorisent la dissidence. La décision de lever la loi martiale est largement saluée dans tout le pays."
 CHI_MARTIAL_LAW.1.d:0 "Le gouvernement national de la République de Chine a officiellement prolongé les « Dispositions temporaires applicables pendant la période de mobilisation nationale », plaçant ainsi la République de Chine en état de guerre pour une durée indéterminée.\n\nDans un geste décisif visant à consolider son pouvoir, le président Tchang Kaï-chek a fait valoir que la présence persistante du Parti communiste chinois en Mandchourie constituait une menace existentielle à laquelle la Constitution ordinaire n'était pas en mesure de faire face. Invoquant la nécessité de « l'unité et de la détermination », les nouvelles dispositions accordent au pouvoir exécutif des pouvoirs d'urgence étendus, contournant de fait le Yuan législatif sur les questions de sécurité nationale. \n\nLe décret suspend les limites habituelles du mandat présidentiel et autorise la restriction des libertés civiles, y compris les droits de réunion et de liberté d'expression, pendant toute la durée de la crise. Alors que les dirigeants du Kuomintang insistent sur le fait que ces mesures constituent une nécessité temporaire pour « éradiquer l’insurrection soutenue par les Soviétiques » dans le nord, les figures de l’opposition avertissent que cela marque une transition d’un gouvernement constitutionnel vers une administration militaire centralisée."
 TIBET_KMT.3.d:0 "La République de Chine a fermement condamné le Dalaï-Lama pour son usurpation flagrante de la souveraineté chinoise. Le gouvernement chinois affirme que le Dalaï-Lama a cédé illégalement des territoires et mène des activités diplomatiques sans l'autorisation de la Chine, qui est la puissance souveraine. Les Chinois appellent le Dalaï-Lama à mettre fin à ses provocations et à réaffirmer sa loyauté envers la Chine, soulignant qu'il devrait être reconnaissant de l'autonomie et du respect dont il bénéficie de la part de la République."
 TIBET_KMT.10.d:0 "À la surprise de nombreux observateurs, la République de Chine a signé un accord avec le Tibet reconnaissant son indépendance. Le gouvernement chinois a déclaré estimer que ce territoire avait été conquis par un Empire Qing oppressif et que le nouvel État chinois démocratique ne pouvait pas conserver un territoire saisi pour satisfaire la vanité d’un empereur. Le gouvernement tibétain, dirigé par le Dalaï-Lama, a salué le président [CHI.GetLeader] pour son leadership avisé et a promis une nouvelle ère de paix entre les deux États. De nombreux observateurs estiment que la Chine cherche à établir des relations amicales avec le Tibet et à en faire un État tampon avec l'Asie du Sud."
 TIBET_KMT.5.d:0 "Le chef du Tibet, le Dalaï-Lama, a rejeté l'ultimatum lancé par la République de Chine lui demandant de reconnaître le gouvernement chinois comme souverain du pays. Les Chinois accusent le Dalaï-Lama de céder des territoires et d'agir en tant que chef d'État et non en tant que subordonné de la République de Chine. Les Chinois affirment qu'ils sont disposés à accorder au Dalaï-Lama et au Tibet une large autonomie, mais qu'en échange, le Dalaï-Lama doit cesser de se comporter comme un chef d'État indépendant. Le refus du gouvernement tibétain indique clairement que le Dalaï-Lama revendique une indépendance totale vis-à-vis de la Chine."
 TIBET_KMT.6.d:0 "Le Dalaï-Lama a déclaré que le Tibet faisait partie intégrante de la République de Chine et qu'il n'était pas un chef d'État. Cela marque l'acceptation par le Dalaï-Lama des exigences chinoises, à savoir qu'il reconnaisse la souveraineté de la République et mette fin à toute tentative de négocier des traités ou de céder des territoires de son propre chef. Le Dalaï-Lama a probablement donné son accord après avoir reçu l'assurance que les Chinois accorderaient au Tibet une grande autonomie et maintiendraient le gouvernement actuel pour administrer le territoire au nom de la Chine. Certains observateurs estiment que la crainte d'une intervention militaire ou d'un soulèvement soutenu par la Chine a également poussé le Tibet à accepter les exigences chinoises."
 TIBET_KMT.21.d:0 "Le Dalaï-Lama a été renversé lors d’un récent coup d’État organisé par le Panchen-Lama. Le Panchen-Lama, numéro deux spirituel du Dalaï-Lama, nourrissait depuis des années le désir d’accroître son influence politique. Il semble que des troupes armées qui lui sont fidèles aient réussi à prendre le contrôle de cols et de villes stratégiques, y compris les accès à Lhassa. La guerre civile étant la seule issue possible, le Dalaï-Lama a préféré ordonner à ses partisans de se retirer. Le nouveau gouvernement tibétain a annoncé qu'il accepterait la souveraineté chinoise à condition que le Tibet conserve son autonomie. De nombreux observateurs internationaux estiment que le Panchen Lama a bénéficié du soutien, voire de l'aide militaire, de la République de Chine."
 TIBET_KMT.22.d:0 "Une tentative de coup d'État visant à renverser le Dalaï-Lama au Tibet s'est soldée par un échec. Des combattants fidèles au Panchen Lama, le deuxième chef spirituel après le Dalaï-Lama, ont tenté de prendre le contrôle de villes stratégiques, de cols et des accès à Lhassa afin de forcer le Dalaï-Lama à capituler rapidement. Cependant, les partisans du Dalaï-Lama ont contrecarré cette tentative de prise de contrôle des environs de Lhassa, et le Panchen Lama a rapidement vu ses partisans se disperser lorsque des groupes de combattants pro-Dalaï-Lama sont venus les défier. Dans une déclaration, le Dalaï-Lama a affirmé avoir mis fin à une tentative pro-chinoise de prise de pouvoir et s'est engagé à ne faire aucun compromis sur l'indépendance de son pays. La République de Chine a nié toute implication, bien que certaines photographies aient fait surface montrant des combattants du Panchen-Lama armés de fusils chinois."
 TIBET_KMT.11.d:0 "Un nouvel accord a été conclu entre la République de Chine et l'Inde. Bon nombre des différends antérieurs ont été résolus après que la République de Chine eut reconnu l'indépendance du Tibet. Auparavant, la Chine revendiquait la souveraineté sur le Tibet et se considérait comme l'autorité compétente pour définir la frontière entre l'Inde et le Tibet. Le Tibet étant désormais reconnu comme indépendant, la frontière chinoise avec l'Inde est beaucoup plus courte et fait l'objet de moins de contestations. Après de brèves négociations, les deux parties ont pu signer un accord visant à régler officiellement leur différend frontalier. Les gouvernements chinois et indien ont tous deux exprimé l'espoir que ce nouvel accord favorisera un renouveau de l'amitié entre les plus grandes démocraties d'Asie."
 CHI_SEATO.1.d:0 "La République de Chine a accepté d'adhérer à l'Organisation du Traité de l'Asie du Sud-Est (OTASE) afin de renforcer la coopération entre les États membres et de lutter contre l'influence communiste dans la région. Pour le gouvernement chinois, cette adhésion lui permettra d'étendre son rôle régional et de nouer des alliances locales dans le cadre de ses efforts visant à coordonner les activités anticommunistes en Asie. Le gouvernement chinois a fait part de son enthousiasme à l'idée de participer au prochain sommet de l'OTASE. Les États-Unis se réjouissent tout particulièrement de l'adhésion de la Chine, car cela confère une plus grande légitimité à l'organisation. L'Union soviétique et les régimes communistes de la région condamnent cette décision et accusent la SEATO d'être une façade impérialiste. Des membres de l'opposition ont fait part en privé aux médias de leurs inquiétudes quant au fait que la SEATO pourrait n'offrir que peu d'avantages concrets et faire de la Chine une cible plus importante pour le communisme international."
 TIBET_KMT.15.d:0 "Le Dalaï-Lama, chef du Tibet, a appelé la communauté internationale à défendre le pays après des informations faisant état d'une invasion lancée par la République de Chine. Des troupes chinoises afflueraient actuellement au Tibet dans le but d'y établir le contrôle chinois. Le gouvernement chinois affirme qu'il ne s'agit pas d'une invasion, mais d'une action locale visant à rétablir son contrôle sur une province. Les Chinois soutiennent que le Dalaï-Lama est un administrateur autonome, mais que ses récentes revendications d'indépendance et ses tentatives de négociation territoriale constituent des violations manifestes et qu'il doit être tenu pour responsable. Les Chinois insistent sur le fait que toutes les tentatives de résolution pacifique ont été rejetées par le Dalaï-Lama et espèrent rétablir rapidement l'ordre public pour le peuple tibétain."
 TIBET_KMT.16.d:0 "À la suite de la récente invasion du Tibet par la République de Chine, l'aristocratie tibétaine traditionnelle se trouve confrontée à des arrestations ou à des poursuites judiciaires. Cette aristocratie a longtemps constitué une source majeure de légitimité, d'adhésion et de pouvoir pour le Dalaï-Lama et son gouvernement. La décision chinoise de cibler ce groupe et de l'affaiblir économiquement et militairement vise à briser la base de soutien de l'ancien gouvernement. Si le Dalaï-Lama et ses alliés perdent leurs bases de soutien locales, cela renforcera les efforts du gouvernement chinois pour établir un État tibétain plus docile. Plus important encore, les fonctionnaires chinois envoyés au Tibet seront également protégés de la concurrence locale. Un certain nombre d'aristocrates tibétains seraient en train de fuir vers le Népal, l'Inde et la Birmanie."
 TIBET_KMT.105.d:0 "À la suite d'une série de troubles politiques au Tibet, le Tibet a signé un accord avec la République de Chine. Le Tibet fera désormais partie de la Chine et sera connu sous le nom de Région autonome du Tibet. Le gouvernement chinois a promis d'apporter son soutien au Panchen-Lama, notamment en lui accordant des pouvoirs politiques étendus, en échange de la soumission de son gouvernement à la souveraineté chinoise. Les gouvernements tibétain et chinois affirment que l'administration et la gouvernance du Tibet resteront globalement inchangées ; toutefois, le Tibet ne sera plus en mesure de mener sa propre politique étrangère ni d'exercer un contrôle total sur ses forces armées."
 CC_CLIQUE_FALL.0.d:0 "Dans le cadre des récentes réformes politiques et de la démocratisation en République de Chine, le président [CHI.GetLeader] a signé une nouvelle loi restituant un certain nombre de pouvoirs au Yuan législatif. Le Yuan législatif, qui n'était autrefois qu'une chambre d'approbation pour le KMT au pouvoir, a commencé à tenir beaucoup plus de débats et à adopter des lois sans recevoir de directives du Conseil exécutif. Les observateurs estiment que ces nouvelles réformes transforment le Yuan législatif en une institution politique plus puissante et en un contrepoids au pouvoir exécutif en République de Chine."
 CC_CLIQUE_FALL.1.d:0 "La faction de la « clique CC » au sein du KMT a vu son influence et son pouvoir considérablement diminuer en République de Chine. Bon nombre de ses dirigeants de premier plan font l’objet d’accusations de corruption ou sont écartés de postes clés. Les médias mettent en lumière certains des échecs militaires et politiques des dirigeants de la « clique CC » au cours des dernières décennies. La « clique CC » représente l’aile droite du KMT et s’est forgé une réputation d’anticommunisme et d’antijaponisme virulents. Cependant, les nouvelles réformes de démocratisation ont ouvert des postes à d'autres groupes et de nombreux réformateurs considèrent la clique CC comme la vieille garde qui doit être remplacée pour que la Chine puisse prospérer. Les réformateurs espèrent que l'affaiblissement de la clique CC permettra une transition en douceur vers la démocratie. Les dirigeants de la clique CC mettent en garde contre le fait que des réformes rapides conduiront à l'instabilité et à une mauvaise gouvernance."
 KMT_Atoms.1.d:0 "La République de Chine a annoncé qu'elle acceptait et soutenait pleinement le programme « Atoms for Peace » lancé par les États-Unis. « Atoms for Peace » est un programme qui encourage les nations à s'informer sur les risques et les avantages de la technologie nucléaire. Ce programme apporte un soutien en matière d'éducation et d'assistance technique pour le développement de réacteurs nucléaires. Le gouvernement chinois estime que ce programme l'aidera à former des scientifiques nucléaires et à développer sa propre technologie nucléaire afin de mieux répondre à ses besoins énergétiques, alors qu'il envisage un avenir meilleur. Les partis communistes de la région critiquent ce programme, qu'ils considèrent comme un moyen détourné pour la Chine d'acquérir les moyens de produire des armes nucléaires, et accusent les États-Unis de soutenir la nucléarisation de l'Asie de l'Est."
 KMT_Atoms.2.d:0 "Dans le cadre d'un projet lancé par la République de Chine et tenu secret pendant des années, celui-ci a été officiellement rendu public lorsque le premier essai nucléaire chinois a été couronné de succès, sous le nom de code « Projet Ciel Bleu Soleil Blanc ». La population chinoise, tant celle vivant en Chine que celle vivant à l'étranger, a encouragé l'acquisition d'armes nucléaires par la République de Chine, fière que son pays puisse être considéré comme l'égal des puissances occidentales et que les jours des « siècles d'humiliation » soient définitivement révolus. Dans le même temps, cette initiative a été condamnée par de nombreux journalistes occidentaux, qui ont déclaré que le gouvernement américain, en collaborant avec la République de Chine pour l'acquisition d'armes nucléaires, n'avait fait qu'alimenter la soif de la Chine de remettre en cause l'ordre mondial actuel dirigé par les États-Unis et l'Union soviétique, avec l'intention potentielle de former son propre ordre mondial pour défier les Américains et les Soviétiques. Néanmoins, le nationalisme chinois est à son apogée partout, la population chinoise célébrant la merveilleuse réussite de sa nation."
 KMT_Atoms.3.d:0 "Des informations en provenance du désert de Gobi, à Alasha, nous ont parvenues, indiquant que notre projet nucléaire, baptisé « Projet Ciel Bleu Soleil Blanc », a été couronné de succès. À ce jour, seuls les États-Unis et la République de Chine disposent d'informations sur ce récent essai nucléaire réussi. Certains responsables ont toutefois déclaré que cette nouvelle devrait être révélée au public et à la communauté internationale, afin de renforcer notre influence régionale et de démontrer la puissance et la force de notre nation. Cela pourrait toutefois se retourner contre nous et susciter des réactions de condamnation à l'égard de notre programme nucléaire."
 ROC_VICTORY.1.d:0 "L'Union soviétique et son alliée, la Mongolie, sont récemment intervenues dans la guerre civile chinoise afin d'empêcher l'effondrement total de la République populaire de Chine (RPC), alors que celle-ci luttait pour repousser les Forces armées de la République de Chine. Après d'intenses combats, un cessez-le-feu a été conclu : la Mongolie intérieure a rétabli une nouvelle république, tandis que la RPC a installé son gouvernement à Pékin, dans ses environs et en Mandchourie. À l'ouest, le Xinjiang a rejoint le Turkestan oriental. Le reste de la Chine, y compris la majeure partie de son tissu industriel et de la population ethnique han, est sous le contrôle de la République de Chine. Ce cessez-le-feu fragile tient pour l'instant, mais les deux camps devraient reconstituer leurs arsenaux et planifier une résolution future du conflit en leur faveur."
 ROC_CLIQUE.15.d:0 "Les efforts visant à rétablir la stabilité et l'harmonie internes en République de Chine semblent échouer, plusieurs cliques militaires s'étant soulevées contre le gouvernement. Ces cliques militaires rappellent ce que l'on a pu observer pendant la période des seigneurs de la guerre, où les chefs militaires formaient des forces loyales dirigées par des officiers partageant des origines professionnelles, culturelles ou territoriales similaires. Nombreux sont ceux qui, en Chine, affirment qu'une deuxième période des seigneurs de la guerre a commencé, et l'on craint une éventuelle guerre civile, une instabilité politique ou un effondrement de l'ordre public. Le gouvernement chinois affirme que la situation sera gérée rapidement et que la Chine ne sera pas victime de seigneurs de guerre."
 ROC_CLIQUE.16.d:0 "Jiao Yulu, un ancien communiste, est revenu à ses racines de chef de secte en se proclamant héritier de l'Empire Ming. Sa revendication est soutenue par la très populaire Société de la Lance Rouge et d'autres sectes vouées à la restauration de la dynastie Ming. Le retour du militarisme et la montée de la méfiance du public ont entraîné un regain de popularité pour ces groupes, qui organisent des forces d'autodéfense locales afin de lutter contre les seigneurs de guerre, les bandits et les fonctionnaires jugés corrompus. Le prétendant au trône Ming souhaite renverser la République de Chine pour rétablir le régime impérial, affirmant que la république n'a pas le mandat du Ciel et que la Chine a besoin d'une nouvelle dynastie. Le gouvernement chinois devra rétablir la confiance du public et réagir rapidement avant que ce mouvement monarchiste ne devienne trop puissant."
 ROC_CLIQUE.1.d:0 "Selon des informations récentes, la « clique du Hunan » se serait soulevée contre la République de Chine. Invoquant les mesures oppressives du gouvernement et son ingérence dans les affaires locales, ces officiers militaires réclament une plus grande autonomie et une réduction du pouvoir centralisé. Le gouvernement chinois a fermement condamné ce soulèvement, enjoignant à tous les officiers loyaux du Hunan de rester fidèles à la République, mais il semble que cet appel soit largement ignoré. On sait que les officiers du Hunan ont noué des liens avec les communistes au cours des années 1920 et 1930. Le gouvernement chinois craint que la clique du Hunan n'utilise ces contacts pour solliciter l'aide militaire des communistes, mais finisse par livrer la région à l'ennemi."
 ROC_CLIQUE.2.d:0 "La clique Ma du Ningxia s'est soulevée contre la République. Ces officiers militaires, originaires de l'ouest et majoritairement musulmans, dénoncent les mesures oppressives du gouvernement et son ingérence dans les affaires des citoyens. Ils réclament davantage d'autonomie et une réduction du pouvoir centralisé. Le gouvernement chinois a condamné avec virulence ce soulèvement, enjoignant à tous les officiers loyaux du Ningxia de rester fidèles à la République, même s'il semble que cet appel soit largement ignoré. Le gouvernement chinois voudra agir rapidement, car tout soulèvement dans l'ouest comporte toujours le risque de déclencher soit un soulèvement islamique plus large, soit d'offrir à des voisins hostiles l'occasion d'étendre leur influence dans l'une des zones frontalières de la Chine."
 ROC_CLIQUE.3.d:0 "La nouvelle clique du Guangxi s'est soulevée contre la République. Comptant parmi les cliques les plus puissantes des années 1920 et 1930, son soulèvement est suivi avec une grande inquiétude par le gouvernement chinois. Ce soulèvement est motivé par les mesures de centralisation et les réformes visant les cliques et la vieille garde de la République. Le gouvernement chinois accuse les officiers rebelles d'agir dans leur propre intérêt et appelle tous les officiers loyaux à rester fidèles à la République. Le gouvernement chinois cherchera à agir rapidement, car le Guangxi constitue une base démographique et économique majeure pour la Chine."
 ROC_CLIQUE.4.d:0 "La clique de Qinghai Ma, dans l'ouest de la Chine, s'est soulevée contre la République. Ses dirigeants invoquent une centralisation excessive et l'oppression des droits culturels ainsi que de l'autonomie comme causes principales de leur agitation. Le gouvernement chinois a appelé tous les officiers à rester loyaux et a condamné la clique pour avoir cherché à entraver le développement de la Chine. Le gouvernement chinois s'efforcera d'agir rapidement, car le Qinghai est proche de frontières contestées et l'on craint déjà que les officiers rebelles ne cherchent à s'allier avec un ennemi de la République, qu'il soit étranger ou national."
 ROC_CLIQUE.5.d:0 "La clique du Shanxi s'est soulevée contre la République. Ses dirigeants invoquent une centralisation excessive et des réformes visant à démanteler l'organisation militaire actuelle comme principales raisons de ce soulèvement. Le gouvernement chinois accuse la clique de militarisme et appelle tous les officiers à rester fidèles à l'État. Le gouvernement chinois s'efforcera d'agir rapidement afin de réprimer d'autres soulèvements et de rétablir l'ordre dans le Shanxi sans délai. Le Shanxi est proche des communistes et l'on craint que des agitateurs communistes locaux et étrangers ne cherchent à profiter de ce conflit pour étendre leur influence."
 ROC_CLIQUE.6.d:0 "La clique du Xinjiang s'est soulevée contre la République. Ces officiers, originaires de l'ouest et majoritairement musulmans, dénoncent les mesures oppressives du gouvernement et son ingérence dans la vie des citoyens. Ils réclament davantage d'autonomie et une réduction du pouvoir centralisé. Le gouvernement chinois a condamné avec virulence ce soulèvement, enjoignant à tous les officiers loyaux du Xinjiang de rester fidèles à la République, même s'il semble que cet appel soit largement ignoré. Le gouvernement chinois voudra agir rapidement, car tout soulèvement dans l'ouest comporte toujours le risque de déclencher soit un soulèvement islamique plus large, soit d'offrir à des voisins hostiles l'occasion d'étendre leur influence dans l'une des zones frontalières de la Chine. La clique est connue pour avoir entretenu des liens étroits avec les Soviétiques dans le passé."
 ROC_CLIQUE.7.d:0 "La clique du Yunnan s'est soulevée contre la République. Ses dirigeants invoquent une centralisation excessive et des réformes visant à modifier la structure militaire actuelle du pays comme principales raisons de ce soulèvement. Le gouvernement chinois accuse la clique de se livrer à un régime de seigneurs de guerre et appelle tous les officiers à rester loyaux. Le gouvernement chinois s'efforcera d'agir rapidement, car le Yunnan est une province d'importance stratégique et dispose d'un accès à plusieurs États étrangers qui pourraient chercher à tirer profit de ce soulèvement."
 ROC_CLIQUE.100.d:0 "Jiao Yulu, qui s'est autoproclamé empereur Ming de Chine, et sa coalition de milices et de sectes ont mis fin à la deuxième période des seigneurs de la guerre. Cet ancien communiste charismatique a su exploiter la colère et la frustration des paysans chinois, lassés des combats incessants entre le Kuomintang, les communistes et les seigneurs de guerre. Le retour des seigneurs de guerre a été la goutte d'eau qui a fait déborder le vase pour beaucoup, qui craignaient que leur arrivée n'entraîne davantage de privations et de banditisme. Avec la victoire de Jiao Yulu, la République de Chine semble sur le point soit d'unir ses forces pour restaurer la dynastie Ming, soit d'être détruite."
 ROC_CLIQUE.101.d:0 "La deuxième période des seigneurs de la guerre a pris fin en Chine. Ce retour au seigneurisme a été très mal accueilli par de nombreux paysans, qui ont vu là un retour au banditisme, à l'instabilité et à la violence après des années de guerre. Beaucoup espèrent désormais que ces cliques disparaîtront définitivement. Le gouvernement chinois doit désormais s'atteler à réparer non seulement les dégâts matériels causés, mais aussi à rétablir la confiance du peuple chinois. Sur le plan international, les appels et les pressions se multiplient pour que le gouvernement mette en place de nouvelles politiques visant à empêcher qu'une telle situation ne se reproduise."
 ROC_CLIQUE.102.d:0 "La République populaire de Chine (RPC) a annoncé que ses forces avaient mis fin à la deuxième période des seigneurs de la guerre. La RPC a déclaré que la république corrompue et incompétente avait conduit la Chine au bord de la désintégration et de la ruine. Elle a ensuite salué les paysans et le peuple pour s'être soulevés aux côtés de l'Armée populaire de libération afin de balayer les seigneurs de guerre corrompus et les fonctionnaires provinciaux et nationaux républicains incompétents. La RPC a conclu en annonçant un programme visant à apporter développement, prospérité et modernisation aux paysans qui ont été négligés et exploités pendant des décennies."
 ROC_CLIQUE.103.d:0 "La deuxième période des seigneurs de la guerre a pris fin en Chine. Ce retour au seigneurisme a été très mal accueilli par de nombreux paysans qui y ont vu un retour au banditisme, à l'instabilité et à la violence après des années de guerre. Beaucoup espèrent désormais que ces cliques disparaîtront définitivement. La République de Chine a réussi à réunifier le pays malgré la menace des milices, des seigneurs de la guerre, des communistes et des sectes. Le gouvernement chinois doit désormais s'atteler à réparer non seulement les dégâts matériels causés, mais aussi à rétablir la confiance du peuple chinois. Le président [CHI.GetLeader] a promis de bâtir une république forte et de mener la Chine vers sa grande destinée."
 KMT_Coup.1.t:0 "[GetNewspaperHeader]Un coup d'État à Nankin"
 KMT_Coup.1.d:0 "Aujourd'hui, dans la capitale de la République de Chine, un coup d'État a été perpétré contre le généralissime Tchang Kaï-chek. Selon les autorités et des représentants de l'armée, le général Sun-Li Jen, l'un des plus éminents généraux et dirigeants de la République de Chine, a mené un coup d'État militaire afin de destituer celui qu'il qualifie de « dirigeant incompétent qui fait honte à la nation chinoise ». Bénéficiant du soutien des Américains, nombreux sont ceux qui affirment que le coup d'État a été soutenu par la CIA et par le président américain, mais ces allégations n'ont, jusqu'à présent, reçu aucun fondement ; il semble que ce ne soit qu'une rumeur parmi tant d'autres concernant la destitution de Tchang."
 KMT_Coup.1.a:0 "Intéressant"
 KMT_Coup.2.t:0 "[GetNewspaperHeader]Chiang Kai-shek s'accroche"
 KMT_Coup.2.d:0 "Aujourd’hui, dans la capitale de la République de Chine, le généralissime Tchang Kaï-chek a été confirmé dans ses fonctions de président par le Comité central de réforme. Au cours des derniers mois, de nombreux changements politiques ont eu lieu au sein du Kuomintang. Certains responsables du parti ont disparu, et de jeunes talents prometteurs sont actuellement formés dans de nouvelles écoles de cadres du parti, selon des observateurs américains en Chine. Dans un discours adressé à ses partisans et à ses détracteurs, Tchang a promis de poursuivre son approche visant à réformer le parti et l'État, à lutter contre la corruption et à réprimer les vestiges communistes en Chine libre. Les experts étrangers prévoient que la loi martiale sera maintenue pour le moment et que les espoirs d'un constitutionnalisme chinois seront anéantis pour les années ou les décennies à venir."
 KMT_Coup.2.a:0 "Voilà pour le terme « République »."
 KMT_mainlandburma.1.t:0 "Question de Jiangxinpo"
 KMT_mainlandburma.1.d:0 "Dans la région de Kachin, où se trouvait autrefois la région de Jiangxinpo. La région était contrôlée par des chefferies birmanes locales, qui appartenaient à la préfecture de Tengyue dans le Yunnan sous les dynasties Ming et Qing. Elle fut perdue lorsque les Britanniques envahirent la Birmanie à la fin du XIXe siècle, ce qui fit perdre aux Qing le territoire qu'ils détenaient à Jiangxinpo. Cette question a amené beaucoup de gens à s'interroger sur la valeur de ce territoire, la République ayant longtemps maintenu ses revendications sur la région."
 KMT_mainlandburma.1.a:0 "Lancez une invasion pour le reprendre !"
 KMT_mainlandburma.1.b:0 "Nous avons des affaires internes à régler."
 KMT_mainlandburma.2.t:0 "L'invasion de Jiangxinpo"
 KMT_mainlandburma.2.d:0 "Sur ordre de Nankin, des milliers de soldats ont franchi la frontière sino-birmane et établi des bases militaires dans la région du nord de l'État Kachin, empiétant sur ce territoire principalement pour asseoir leur contrôle sur cette zone faisant l'objet d'un litige territorial. Bien que Rangoon ait reconnu la présence de troupes chinoises au Kachin et ait ordonné à ses propres troupes de s'y opposer, les forces birmanes ont été complètement écrasées après avoir lancé une série de contre-attaques infructueuses. Nankin a jusqu'à présent fait pression sur Rangoon pour qu'il ne saisisse pas l'ONU de cette question, tout en le menaçant de financer les groupes rebelles en Birmanie qui souhaitent renverser l'autorité de Rangoon s'il tentait de saisir l'ONU."
 KMT_mainlandburma.2.a:0 "Le rétablissement de nos frontières légitimes"
 KMT_mainlandburma.2.b:0 "Maudits Chinois !"
 KMT_50s_Mainland.13.t:0 "La question de Hong Kong"
 KMT_50s_Mainland.13.d:0 "La colonie britannique de Hong Kong existe depuis la fin de la première guerre de l'opium, lorsque la Grande-Bretagne a contraint la Chine à céder l'île, peu après que les Britanniques eurent commencé à étendre cette colonie sur le continent via Kowloon et les Nouveaux Territoires. La colonie elle-même symbolise les jours et les souvenirs des siècles d'humiliation ; la seule façon pour la Chine de se remettre d'une telle humiliation est de reprendre ce qui a été volé par les Yangrens (les Occidentaux) et d'affirmer notre force, en les forçant à reconnaître que leurs jours de domination sur la Chine et l'Asie sont révolus."
 KMT_50s_Mainland.13.a:0 "Nous le reprendrons quand le moment sera venu"
 KMT_50s_Mainland.14.t:0 "La crise de Suez en Égypte"
 KMT_50s_Mainland.14.d:0 "Alors que la crise de Suez oppose toujours l'Égypte et la Grande-Bretagne, cela nous offre l'occasion de reprendre aux Britanniques la colonie de Hong Kong, perdue depuis longtemps. Bon nombre de nos responsables et conseillers nous ont recommandé de frapper immédiatement les positions britanniques à Hong Kong et de les en chasser. Cela pourrait nuire gravement à nos relations futures avec les impérialistes, mais cela contribuerait de manière significative à rétablir la souveraineté et l'indépendance de la Chine face à l'Occident."
 KMT_50s_Mainland.14.a:0 "C'est trop risqué, annulez les attaques"
 KMT_50s_Mainland.14.b:0 "Hong Kong est chinoise, et l'a toujours été"
 KMT_50s_Mainland.15.t:0 "L'invasion chinoise de Hong Kong"
 KMT_50s_Mainland.15.d:0 "Dans un geste surprenant, la Chine a profité de la crise de Suez pour envahir la colonie de Hong Kong et chasser les Britanniques presque immédiatement. La Chine a déclaré que Hong Kong lui appartenait, invoquant comme justification la promesse faite par l'ancien président américain Roosevelt concernant la restitution de Hong Kong après la Seconde Guerre mondiale. Bien que les Chinois aient envahi la colonie de manière illégitime, ils n'ont pour l'instant pas expulsé les hommes d'affaires britanniques locaux et leur ont au contraire permis de rester à Hong Kong."
 KMT_50s_Mainland.15.a:0 "Condamnez leurs actes, ils devraient pourtant savoir mieux que quiconque"
 KMT_50s_Mainland.15.b:0 "On ne peut rien y faire contre les Chinois"
 KMT_50s_Mainland.16.t:0 "Une invasion de Macao ?"
 KMT_50s_Mainland.16.d:0 "Juste après l'invasion de Hong Kong, bon nombre de nos responsables ont commencé à faire pression pour renverser également la colonie de Macao, l'une des dernières colonies encore détenues en Chine. Bien que Macao fût une colonie chinoise, les Portugais l'avaient acquise auparavant par le biais d'un bail équitable remontant à l'époque de la dynastie Ming, tout en se tenant à l'écart des agissements des autres puissances occidentales qui avaient ravagé la Chine comme des barbares."
 KMT_50s_Mainland.16.a:0 "Nous n'avons pas besoin de Macao"
 KMT_50s_Mainland.16.b:0 "Macao sera elle aussi réunifiée avec la mère patrie"
 KMT_50s_Mainland.17.t:0 "Invasion de Macao"
 KMT_50s_Mainland.17.d:0 "Après la chute de Hong Kong, la Chine s'est rapidement lancée à la conquête de Macao, déployant des troupes pour envahir la ville sous prétexte de troubles locaux et de rétablissement de l'ordre. Jusqu'à présent, Macao n'avait pas suffisamment d'importance économique pour intéresser la Chine, mais le fort soutien de la population locale en faveur d'une rétrocession de Macao, à l'instar de Hong Kong, a poussé le gouvernement à agir en ce sens."
 KMT_50s_Mainland.17.a:0 "Condamner leurs actes"
 KMT_50s_Mainland.17.b:0 "Nous devrions continuer à chercher à coopérer avec eux"
 KMT_50s_Mainland.18.t:0 "Le Portugal souhaite renforcer sa coopération"
 KMT_50s_Mainland.18.d:0 "Le gouvernement portugais a reconnu notre autorité sur Macao et s'est montré disposé à poursuivre sa coopération avec nous même après notre prise de contrôle de Macao ; il semble donc sincère dans sa volonté de coopérer avec la Chine."
 KMT_50s_Mainland.18.a:0 "Et nous les accueillerons à bras ouverts"
 KMT_50s_Mainland.19.t:0 "Renouvellement du mandat de Bai Chongxi au poste de ministre de la Défense nationale"
 KMT_50s_Mainland.19.d:0 "La reconduction de Bai Chongxi au poste de ministre de la Défense nationale lui permettrait de se rapprocher du gouvernement central et de diviser la nouvelle clique du Guangxi, comme par le passé. Ancien chef d'état-major et ministre de la Défense nationale, Bai est incontestablement un génie militaire sur le champ de bataille ; non seulement il peut contribuer à démanteler la faction de Li, mais son expérience à la tête du ministère de la Défense nationale nous aidera également dans notre quête visant à bâtir des forces armées solides. Espérons que cette fois-ci, nos plans visant à diviser la clique du Guangxi aboutiront et que Li et ses acolytes seront contraints de se soumettre au gouvernement central."
 KMT_50s_Mainland.19.a:0 "La deuxième fois sera-t-elle la bonne ?"
 KMT_50s_Mainland.20.t:0 "La reconstruction de Shanghai"
 KMT_50s_Mainland.20.d:0 "Si vous vous promenez dans les rues de Shanghai et que vous discutez avec les habitants âgés, ils ne vous raconteront pas l'histoire d'une ville, mais celle de toute une nation. Shanghai s'est imposée comme le centre économique du commerce et de l'industrialisation de la Chine, mais au prix d'une forte présence des puissances étrangères, qui détenaient d'importantes parts et des droits considérables au sein de la ville.\n\nAprès la chute de la dynastie Qing, la ville a vu sa population croître, jusqu’à devenir la plus peuplée du monde, attirant divers groupes de personnes venues y refaire leur vie, notamment des réfugiés juifs d’Allemagne et des émigrés russes blancs. La ville a continué à se développer : l’électricité, la radio et les tramways ont fait leur apparition dans la société chinoise via Shanghai, tandis que des innovations artistiques dans les domaines de la musique et de l’animation ont commencé à s’épanouir.\n\nSur le plan politique, la ville était sous l'emprise des marchands, fortement influencés par les gangs clandestins qui avaient conclu une alliance avec le Kuomintang dans les années 1920. Cependant, personne ne pouvait prévoir les horreurs qui allaient se produire lorsque les Japonais attaquèrent la ville. Les premiers bombardements de 1932 donnèrent lieu à des combats intenses entre les étudiants chinois et les soldats des concessions japonaises. Cinq ans plus tard, la bataille pour le « Stalingrad de l'Orient », comme certains observateurs occidentaux l'appellent aujourd'hui, vit diverses parties de la ville détruites, avec un nombre de victimes si élevé qu'il aurait fallu des semaines pour compter les corps (si la plupart d'entre eux n'avaient pas été brûlés ou réduits en cendres). Avec la capitulation japonaise en 1945 et la dissolution de la Concession internationale de Shanghai en 1941, la ville put reprendre son souffle après les horreurs qu’elle avait dû endurer, jusqu’à ce que le prochain événement majeur, peut-être le plus important, survienne. Le 13 juillet 1949, la paix revint enfin pour de bon à Shanghai, lorsque les forces de la République réussirent, contre toute attente, à résister à l'avancée de l'Armée populaire de libération et empêchèrent Shanghai de tomber aux mains des communistes.\n\nPeut-être est-il temps maintenant pour Shanghai de panser ses blessures. Toute la corruption, la guerre, les étrangers et tout le reste ont influencé et traumatisé la ville à un degré incomparable avec aucune autre ville d'Asie de l'Est. Peut-être est-il temps de prendre un nouveau départ."
 KMT_50s_Mainland.20.a:0 "Puisse-t-elle redevenir la Perle de l'Orient."
 KMT_50s_Mainland.21.t:0 "L'emprise communiste sur la Chine"
 KMT_50s_Mainland.21.d:0 "Alors que le conflit qui a suivi la guerre froide entraîne la République de Chine dans son sillage, l'Union soviétique nourrit de nouveaux projets d'empiètement sur nos territoires, ne se contentant pas encore de la part du gâteau qui lui revient. À l'heure actuelle, la Mongolie, le Turkestan oriental et la Mandchourie sont sous l'emprise des impérialistes soviétiques ; nous devons préparer leur libération en fomentant des révoltes, plutôt que par une invasion directe qui pourrait également entraîner une intervention directe de l'Union soviétique. Plus nous attendons, plus ils auront le temps de se préparer à frapper la Chine et à opprimer le peuple chinois sous le couvert de leur rhétorique communiste ; nous ne pouvons pas nous permettre de laisser cela se produire."
 KMT_50s_Mainland.21.a:0 "Nous n'allons pas perdre de temps : préparons-nous à libérer le nord."
 KMT_50s_Mainland.22.t:0 "Création du NCSIST"
 KMT_50s_Mainland.22.d:0 "La création de l'Institut national des sciences et technologies Chung-Shan, connu sous l'acronyme NCSIST, nous servira de centre de recherche et développement militaire et d'intégration des systèmes. Cela nous permettra d'être autonomes dans l'acquisition des technologies militaires de pointe et de réduire notre dépendance vis-à-vis des États-Unis dans ce domaine. Il sera enregistré en tant qu'entreprise publique relevant du gouvernement."
 KMT_50s_Mainland.22.a:0 "C'est super."
 KMT_50s_Mainland.23.t:0 "Débat sur l'enseignement privé"
 KMT_50s_Mainland.23.d:0 "Depuis quelque temps déjà, l'enseignement privé constitue le pilier de l'éducation dans le pays. Bien que la suppression des écoles privées au profit des écoles publiques puisse sembler une excellente décision, elle risque de susciter le mécontentement des élites qui ont toujours compté sur ce système pour leur éducation. Au cours du débat sur le maintien des écoles privées, deux camps distincts se sont formés quant à la réponse que le gouvernement devrait apporter. L'une souhaite laisser les écoles privées en place afin d'apaiser les élites, tandis que l'autre, adoptant une position plus intransigeante, souhaite fermer ces écoles privées et n'établir que des écoles publiques dans le pays, à la fois pour centraliser les programmes scolaires et pour réglementer ce qui y est enseigné. Bien que [CHI.GetName] ne se soit pas encore prononcé sur sa position, le gouvernement devrait bientôt donner une réponse au public."
 KMT_50s_Mainland.23.a:0 "Que les écoles privées restent."
 KMT_50s_Mainland.23.b:0 "Les nationaliser et les rouvrir en tant qu'écoles publiques."
 KMT_50s_Mainland.25.t:0 "Question sur l'enseignement obligatoire"
 KMT_50s_Mainland.25.d:0 "L'enseignement public occupant actuellement une place centrale dans le système éducatif chinois, la question de la durée de la scolarité obligatoire a été soulevée. De nombreux responsables se sont prononcés en faveur d'une scolarité obligatoire de six ans, tandis que les partisans d'une ligne dure souhaitent qu'elle s'étende jusqu'à neuf ans afin de mieux préparer les élèves. Cependant, cette nouvelle initiative visant à lutter contre l'analphabétisme nécessitera d'importantes ressources budgétaires de la part du gouvernement pour être mise en œuvre, notamment pour subventionner les familles qui n'ont pas les moyens de payer les frais de scolarité dans les écoles publiques."
 KMT_50s_Mainland.25.a:0 "Six ans d'enseignement obligatoire."
 KMT_50s_Mainland.25.b:0 "Neuf ans d'enseignement obligatoire."
 KMT_50s_Mainland.25.c:0 "Le strict minimum..."
 KMT_50s_Mainland.26.t:0 "Le « Sanmin Zhuyi » enseigné dans les écoles"
 KMT_50s_Mainland.26.d:0 "Les « Trois principes du peuple », une idéologie inventée par le père fondateur, ont sauvé le Kuomintang de décennies de malheurs. Nous rendrons obligatoire l'étude de la philosophie de cette idéologie ainsi que de l'histoire de notre parti pour tous les élèves. Ce cours sera introduit dans tous les niveaux d'enseignement en Chine, afin que chacun soit informé de la cause de la Révolution nationale."
 KMT_50s_Mainland.26.a:0 "Tout le monde connaîtra ses principes !"
 KMT_50s_Mainland.26.b:0 "Rendez-le facultatif."
 KMT_50s_Mainland.26.c:0 "Allégez le programme et rendez-le facultatif."
 KMT_Shanghai.1.t:0 "Chiang Ching-Kuo revient à Shanghai"
 KMT_Shanghai.1.d:0 "Alors que le chaos règne toujours à Shanghai, Tchang Kaï-chek a décidé de tenter une nouvelle fois de pacifier la ville, même si cela doit aller à l'encontre de toute probabilité. Le généralissime a renvoyé son fils à Shanghai afin qu'il soit chargé de contraindre les Shanghaïens à mettre un terme à leurs agissements perturbateurs et à en répondre. Des hommes d'affaires corrompus, des sociétés secrètes et même des membres de gangs ont décidé de revenir en ville après notre victoire dans la guerre civile, ce qui montre que la tâche de mettre la ville au pas ne sera pas plus facile qu'auparavant. La seule différence, cependant, est que cette fois-ci, Ching-Kuo est deux fois plus déterminé à remplir son devoir de rétablir l'ordre public à Shanghai, si c'est ce qu'il faut pour regagner le soutien des Shanghaïens envers la République."
 KMT_Shanghai.1.a:0 "Adieu, Chiang Junior !"
 KMT_Shanghai.2.t:0 "Reprise de la série « Beating Tigers » à Shanghai"
 KMT_Shanghai.2.d:0 "Dès son retour en ville, Chiang Ching-Kuo ordonna immédiatement la remise en œuvre de certaines réformes qu’il avait prévu de mettre en place dès 1948. Une série de documents anciens et de documents récemment rédigés lui ont été remis afin qu'il les mette en œuvre sur ses ordres. Il a jusqu'à présent réintroduit le Corps national de reconstruction chargé de la répression des bandits afin qu'il soit mobilisé, tandis qu'une annonce publique a également été faite par le bureau du gouvernement à Shanghai concernant le retour de Ching-Kuo et les réformes qui devaient être introduites dans la ville, ce qui a bien sûr suscité des critiques de la part de ceux qui tiraient profit de la situation actuelle à Shanghai."
 KMT_Shanghai.2.a:0 "Un prix à payer pour le bien-être du peuple."
 KMT_Shanghai.3.t:0 "Une nouvelle manifestation de masse à Shanghai"
 KMT_Shanghai.3.d:0 "Conformément à son projet de s'appuyer sur la population pour soutenir ses réformes, Ching-Kuo a commencé à mettre en place divers points de signalement, permettant ainsi aux habitants de dénoncer toute personne soupçonnée de spéculation ou de corruption à Shanghai. Ching-Kuo a réorganisé le Corps des services de la jeunesse de Shanghai et a mobilisé des jeunes de la région pour patrouiller dans la ville et collaborer avec le Corps national de reconstruction chargé de la répression des bandits afin de faire respecter ses réformes."
 KMT_Shanghai.3.a:0 "À bas les profiteurs et les exploiteurs !"
 KMT_Shanghai.3.b:0 "Déradicaliser ces mouvements… avant que la violence et le chaos ne éclatent."
 KMT_Shanghai.4.t:0 "Soutien du gouvernement aux réformes"
 KMT_Shanghai.4.d:0 "Conscient de l'erreur qu'il avait commise par le passé en ne sollicitant pas le soutien du gouvernement dont il avait besoin, Ching-kuo décida cette fois-ci de changer d'approche vis-à-vis des réformes. Compte tenu des liens étroits qui unissaient de nombreux hauts fonctionnaires à la famille Soong, Ching-kuo s'est tourné vers les réformateurs de Gexin qui, bien qu'ils ne constituassent qu'une petite faction au sein du parti et fussent d'extrême droite, étaient favorables à l'élimination des fonctionnaires corrompus. À leurs côtés, il a fait appel à diverses autres factions rivales au sein du parti, telles que la clique du Club central, qui jouissait d'une grande influence."
 KMT_Shanghai.4.a:0 "Au moins, notre succès est désormais assuré."
 KMT_Shanghai.4.b:0 "Peut-être ne devrions-nous pas laisser les différentes factions et familles s'immiscer dans notre programme de réformes."
 KMT_Shanghai.5.t:0 "La disparition des gangs et des sociétés secrètes à Shanghai"
 KMT_Shanghai.5.d:0 "Le déclin soudain des gangs et des sociétés secrètes à Shanghai a commencé lorsque Ching-kuo a lancé une vaste campagne de répression dans la ville, menant des raids contre bon nombre de leurs bases clandestines avec l'aide de la police secrète. Le Corps des services de la jeunesse de Shanghai et le Corps national de reconstruction chargé de la répression des bandits ont procédé à des arrestations massives après la capture d'un grand nombre de leurs membres, dont la plupart étaient soit impliqués dans la gestion des activités de contrebande sur le marché noir de Shanghai, soit se livraient à des vols violents dans les rues. Après la chute des « mouches » de Shanghai, la baisse du taux de criminalité a permis à la ville de retrouver une sécurité quasi totale."
 KMT_Shanghai.5.a:0 "Les habitants de Shanghai adorent le maire Chiang !"
 KMT_Shanghai.6.t:0 "Lancer des descentes chez les hommes d'affaires fortunés"
 KMT_Shanghai.6.d:0 "Chiang Ching-Kuo a promulgué de nouvelles lois autorisant le Corps national de reconstruction chargé de la répression des bandits à mener des raids contre bon nombre des hommes d'affaires les plus riches et les plus en vue de Shanghai, leur donnant ainsi carte blanche pour semer la terreur parmi ceux qui avaient été reconnus coupables de thésaurisation de marchandises – une pratique courante dans le monde des affaires – ainsi que de collaboration avec le marché noir de Shanghai pour faire passer des marchandises en contrebande à des prix inférieurs. Ces mesures ont conduit à l'incarcération de nombreux hommes d'affaires tristement célèbres et à l'exécution de certains d'entre eux, dans le cadre du plan de Ching-kuo visant à « faire un exemple pour les autres hommes d'affaires »."
 KMT_Shanghai.6.a:0 "Voilà leur entreprise qui passe entre les mains du gouvernement."
 KMT_Shanghai.6.b:0 "Permettre à certains hommes d'affaires « intègres » de poursuivre leurs activités."
 KMT_Shanghai.7.t:0 "Lancer des descentes contre des entrepreneurs de la classe moyenne"
 KMT_Shanghai.7.d:0 "Chiang Ching-Kuo a promulgué de nouvelles lois autorisant le Corps national de reconstruction et de répression des bandits à mener des descentes contre les hommes d'affaires de la classe moyenne soupçonnés d'activités illégales. Tout en tolérant le capitalisme mais pas la corruption capitaliste, Chiang Ching-Kuo a déclaré publiquement que « les hommes d'affaires de la classe moyenne qui n'ont rien à se reprocher n'ont pas à s'inquiéter de ces descentes ». Des sanctions mineures leur étaient toutefois réservées, car Ching-Kuo ne souhaitait pas s'aliéner la classe moyenne, qui allait bientôt devenir le pilier de Shanghai une fois les réformes achevées."
 KMT_Shanghai.7.a:0 "Une nécessité au détriment du soutien de la classe moyenne."
 KMT_Shanghai.7.b:0 "Il faut sévir davantage contre les rabatteurs de Shanghai !"
 KMT_Shanghai.7.c:0 "Ce n'était peut-être pas une très bonne idée... Revenons à la politique initiale."
 KMT_Shanghai.8.t:0 "Conclusion des réformes"
 KMT_Shanghai.8.d:0 "À minuit pile à Shanghai, le fils du généralissime était assis dans son bureau, rédigeant les derniers rapports destinés à être envoyés à son père à Nankin, dans l'espoir de ne pas décevoir une nouvelle fois les habitants de Shanghai, comme il l'avait fait auparavant. Il avait déjà fait part à son père, en 1948, de ses griefs suite à l'échec de la mise en œuvre des réformes à Shanghai, et lui avait expliqué comment il avait tenté diverses méthodes pour agir différemment de ce qu'il avait fait auparavant. Alors qu'il s'apprêtait à quitter son bureau, il aperçut un rapport qu'il avait oublié d'ouvrir. Il commença à l'ouvrir lentement et découvrit qu'il contenait un graphique et des détails sur les résultats des réformes.\n\nLa déception se lisait rapidement sur le visage du généralissime. D'après les protocoles et les rapports, les mesures prises à Shanghai n'ont eu qu'un impact si minime que les graves problèmes de la ville, tels que la corruption et les manigances clandestines, continuent de sévir dans la région à un niveau élevé. Bien qu'il ne fût manifestement pas satisfait des résultats, le généralissime s'abstint de blâmer son fils, reconnaissant les efforts et la volonté qu'il avait mis dans son voyage à Shanghai. La ville n'est peut-être pas encore là où elle devrait être, mais la volonté de débarrasser Shanghai de la corruption et des gangs clandestins ne s'éteindra pas."
 KMT_Shanghai.8.a:0 "Quel dommage..."
 KMT_Shanghai.9.t:0 "Conclusion des réformes"
 KMT_Shanghai.9.d:0 "Il était 7 heures du matin à Shanghai. Tchang Kaï-chek se réveilla et reçut un rapport de Ching-kuo, accompagné d’une lettre de sa part dans laquelle celui-ci affirmait que les réformes avaient été couronnées de succès. Le rapport faisait état d’une baisse du taux de criminalité à Shanghai ainsi que de la fin de la corruption parmi les fonctionnaires et les hommes d’affaires. Tchang Kaï-chek s’en réjouit et vit immédiatement le potentiel de transformer la ville en une métropole prospère de renommée internationale. La ville s'était remise des conflits précédents, et les affaires avaient repris leur cours normal pour beaucoup. Le récit de Ching-kuo sur la mise sous contrôle de Shanghai lui valut un regain de prestige au sein du gouvernement, et son père commença à envisager de lui confier davantage de responsabilités au sein du gouvernement."
 KMT_Shanghai.9.a:0 "Son histoire a transformé Shanghai."
 KMT_Shanghai.10.t:0 "Conclusion des réformes"
 KMT_Shanghai.10.d:0 "Il était 7 heures du matin à Shanghai. Tchang Kaï-chek se réveilla et reçut un rapport de Tsing-kuo, accompagné d’une lettre de sa part dans laquelle celui-ci indiquait que les réformes affichaient des progrès modérés. Bien que les attentes n’aient pas été pleinement satisfaites, il avait correctement évalué et prédit que le soutien du peuple devrait permettre de mettre à mal les profiteurs et les exploiteurs de Shanghai. Certaines mesures prises n'étaient peut-être pas les plus efficaces avec le recul et avaient entraîné l'implication d'un certain nombre d'innocents, mais Tchang Kaï-chek lut la lettre avec une joie modérée, car il s'agissait d'un grand succès pour l'image politique de Ching-kuo pour le moment."
 KMT_Shanghai.10.a:0 "Bien. Pas parfait, mais bien."
 KMT_Shanghai.11.t:0 "Conclusion des réformes"
 KMT_Shanghai.11.d:0 "Il était 7 heures du matin à Shanghai. Tchang Kaï-chek se réveilla et reçut un rapport de Ching-kuo, accompagné d’une lettre de sa part dans laquelle celui-ci indiquait que les réformes commençaient à porter leurs fruits, même si les résultats n’étaient pas encore à la hauteur des attentes. La corruption, la contrebande et les activités des gangs avaient en effet légèrement diminué. Certaines mesures prises n'étaient peut-être pas les plus efficaces avec le recul et avaient entraîné l'implication d'un certain nombre de personnes innocentes, mais Chiang Kai-Shek lut néanmoins la lettre avec une joie prudente, car il s'agissait d'une avancée modeste mais importante pour l'image politique de Ching-kuo pour le moment."
 KMT_Shanghai.11.a:0 "C'est mieux que rien."
 KMT_Civilwar.1.t:0 "Mise en place des réformes de l'armée en temps de guerre"
 KMT_Civilwar.1.d:0 "Compte tenu du nombre important de désertions enregistrées ces dernières années au sein de l'armée et de l'inefficacité de la structure adoptée par l'armée américaine, nous n'aurons pas besoin de recourir à une structure militaire obsolète, trop vaste et excessive ; nous adopterons une structure plus petite mais suffisamment efficace pour faire respecter la discipline au sein de l'armée et sévir contre les futurs déserteurs potentiels. Maintenant que le front s'est globalement stabilisé, nous pouvons mener à bien cette réforme en toute sécurité et nous assurer que le conflit à venir ne viendra pas perturber nos efforts."
 KMT_Civilwar.1.a:0 "J'espère que cela vous aidera."
 KMT_Civilwar.2.t:0 "La renaissance du mouvement de réforme de Gexin"
 KMT_Civilwar.2.d:0 "Le Mouvement de réforme de Gexin, qui a vu le jour en 1944 et a duré trois ans au total, était composé de divers jeunes membres issus des factions de droite du Kuomintang, principalement la faction de Whampoa et la clique du Club central, qui prônaient la fin de la corruption et des purges au sein de l'administration, ainsi que la réforme du gouvernement afin d'assurer une gouvernance efficace. Nous encouragerons ces personnes et les inviterons à rejoindre le gouvernement."
 KMT_Civilwar.2.a:0 "Allons-nous enfin pouvoir mener à bien ces réformes ?"
 KMT_Civilwar.3.t:0 "Création du Bureau de la sécurité nationale"
 KMT_Civilwar.3.d:0 "L'époque où l'on comptait entièrement sur le NBIS (Bureau national d'enquête et de statistiques) est révolue ; cet organisme n'est plus fiable pour la collecte de renseignements militaires et doit être remplacé par les services de renseignement d'autres secteurs. Le Bureau de la sécurité nationale assurera la coordination entre les différents services de renseignement afin de faciliter la collecte de renseignements militaires et la conduite d'opérations d'espionnage contre nos ennemis."
 KMT_Civilwar.3.a:0 "Si Dai Li était encore en vie, cela ne lui aurait pas plu."
 KMT_Civilwar.4.t:0 "La République de Chine exige la levée de l'embargo sur les armes"
 KMT_Civilwar.4.d:0 "Aujourd’hui, le « China Lobby » (un groupe d’Américains appelant au soutien de la République de Chine) et des diplomates de la République de Chine nous ont mis au défi de mettre fin à l’embargo sur les armes imposé à la République de Chine depuis 1947. L’administration Truman avait instauré cet embargo afin d’imposer un cessez-le-feu dans la guerre civile chinoise pendant la mission Marshall, dans le but de contraindre le Kuomintang à trouver un compromis avec les communistes. Aujourd'hui, alors que le soutien à la République de Chine atteint un niveau sans précédent aux États-Unis et que le China Lobby gagne en influence tout en faisant pression pour un soutien encore plus important à la Chine, la décision de lever l'embargo sur les armes est inévitable."
 KMT_Civilwar.4.a:0 "Nous n'avons d'autre choix que de céder."
 KMT_Civilwar.5.t:0 "Washington lève l'embargo sur les armes."
 KMT_Civilwar.5.d:0 "Aujourd'hui, le gouvernement américain a officiellement annoncé la levée de l'embargo sur les armes imposé à la République de Chine, tout en affirmant son intention de soutenir la cause de cette dernière contre les communistes, que ce soit sur le plan diplomatique ou militaire. Il n'en reste pas moins qu'un progrès majeur a été accompli pour regagner le soutien américain dans la lutte contre les communistes."
 KMT_Civilwar.5.a:0 "Nous serons heureux de retrouver leur soutien, mais nous n'oublierons jamais le jour où ils nous ont abandonnés."
 KMT_Civilwar.6.t:0 "Le « China Lobby » milite en faveur d'un soutien massif à la Chine"
 KMT_Civilwar.6.d:0 "À la suite de la levée de l'embargo sur les armes imposé à la République de Chine, le lobby chinois a fait pression sur nous pour que nous soutenions la République, en intervenant directement dans la guerre civile afin d'y mettre fin en faveur de la République de Chine."
 KMT_Civilwar.6.a:0 "Nous sommes d'accord là-dessus."
 KMT_Civilwar.6.b:0 "On ne peut pas faire confiance aux nationalistes !"
 KMT_Civilwar.7.t:0 "[GetNewspaperHeader]Atrocités présumées en Chine"
 KMT_Civilwar.7.d:0 "Récemment, la République de Chine a dépêché des journalistes pour couvrir la situation de la guerre civile du côté des communistes, avec des clichés des atrocités commises dans les zones urbaines à la suite de rafles massives visant les propriétaires fonciers et les hommes d'affaires alignés sur le Kuomintang. Les journalistes nationalistes chinois et occidentaux ont qualifié le comportement des communistes de « grossier » et ont déclaré que ces atrocités devaient cesser immédiatement. Le Parti communiste chinois a qualifié ces informations de « fausses allégations des médias occidentaux » et a déclaré que ces propriétaires fonciers et hommes d'affaires traversaient une période de rééducation. Les organes de presse des partis communistes ont dénoncé les allégations du Kuomintang et ont attiré l'attention sur la prétendue répression des paysans et des ouvriers chinois par le Kuomintang, arguant que leur libération de la bourgeoisie était inévitable."
 KMT_Civilwar.7.a:0 "Une grande tragédie."
 KMT_Civilwar.8.t:0 "Soutien populaire au Kuomintang"
 KMT_Civilwar.8.d:0 "Grâce à la défense victorieuse des forces du Kuomintang à Shanghai, la guerre civile chinoise semble avoir atteint un tournant décisif : les forces communistes ne parviennent pas à percer les défenses nationalistes à Shanghai et perdent peu à peu de leur élan. Dans le même temps, le soutien au Kuomintang s'est rapidement accru aux États-Unis à la suite de la défense réussie de la ville, beaucoup estimant que le Kuomintang est sur le point de renverser le cours de la guerre et d'écraser les communistes. Face à la pression locale croissante en faveur d'un soutien au Kuomintang, l'administration Truman doit prendre une décision."
 KMT_Civilwar.8.a:0 "Nous continuerons à leur apporter notre soutien."
 KMT_Civilwar.8.b:0 "Nous ne ferons plus jamais confiance à ces voleurs corrompus."
 KMT_Civilwar.9.t:0 "Le conflit de Chiang-Li"
 KMT_Civilwar.9.d:0 "En 1948, une élection présidentielle eut lieu et Li Zongren fut élu vice-président de la République de Chine, tandis que Tchang Kaï-chek conservait la présidence. En 1949, la situation s'étant aggravée et Li Zongren étant déjà un farouche opposant à Tchang, une lutte pour le pouvoir s'engagea, Tchang démissionnant afin de faire de Li Zongren le bouc émissaire de l'échec face aux communistes pendant la guerre civile. Les fidèles de Li ne suivaient que ses ordres, tandis que ceux de Tchang ne suivaient que les siens, les deux hommes s'étant partagé le commandement des forces armées de la République de Chine, alors en ruine, ce qui a entraîné de graves revers pour la défense du reste de la Chine."
 KMT_Civilwar.9.a:0 "Une situation très grave."
 KMT_Civilwar.10.t:0 "Yan Xishan propose des services de médiation"
 KMT_Civilwar.10.d:0 "Yan Xishan, gouverneur du Shanxi et actuel Premier ministre, a une nouvelle fois proposé d'intervenir pour faciliter les négociations entre Tchang Kaï-chek et Li Zongren en vue de l'unité entre le gouvernement central et la nouvelle clique du Guangxi. Il a déclaré être prêt à tout mettre en œuvre pour instaurer un gouvernement stable, le sort de la République reposant entre les mains de Tchang et de Li."
 KMT_Civilwar.10.a:0 "Il faudra me passer sur le corps."
 KMT_Civilwar.10.b:0 "Envoyez-le négocier avec Li."
 KMT_Civilwar.11.t:0 "Réconciliation et compromis trouvés"
 KMT_Civilwar.11.d:0 "La proposition de compromis faite par Yan Xishan à Li a globalement été couronnée de succès : Yan a promis à Li des droits importants sur le Trésor public ainsi que la protection du gouvernement pour la « Nouvelle Clique du Guangxi ». Li s'est d'abord montré réticent, mais a fini par accepter l'offre de Yan après une série de concessions accordées à ses proches collaborateurs."
 KMT_Civilwar.11.a:0 "Ces conditions sont scandaleuses ! Il faut remettre Li à sa place."
 KMT_Civilwar.11.b:0 "L'union fait la force, la division mène à la ruine."
 KMT_Civilwar.12.t:0 "Les négociations commencent à s'enliser"
 KMT_Civilwar.12.d:0 "Li a affirmé que les conditions proposées par Yan étaient bien plus avantageuses que les nôtres, et qu'il n'était pas disposé à accepter un accord de coopération en raison de l'attitude hostile de Chiang, qui refusait de lui accorder des conditions équitables et équivalentes. Par conséquent, les perspectives de coopération entre le gouvernement central et la nouvelle clique du Guangxi s'annoncent sombres."
 KMT_Civilwar.12.a:0 "Très bien ! Ce n'est pas comme si on avait besoin de lui."
 KMT_Civilwar.13.t:0 "Li Zongren découvre une tentative de coup d'État."
 KMT_Civilwar.13.d:0 "Lorsque Li Zongren découvrit le complot de coup d'État militaire ourdi par Tchang, lui et ses fidèles s'enfuirent du continent pour se réfugier à Hong Kong. Avec son départ du continent, Tchang reprit la présidence et rétablit son contrôle total sur le gouvernement, l'ensemble des forces armées étant de nouveau sous son commandement."
 KMT_Civilwar.13.a:0 "Au moins, ce salaud est parti maintenant."
 KMT_Civilwar.14.t:0 "La situation à Shanghai"
 KMT_Civilwar.14.d:0 "Les forces communistes ont occupé Nankin, l'ancienne capitale de la République de Chine, et ont commencé à franchir le fleuve Yangtsé à Suzhou, faisant de Shanghai la dernière grande ville encore debout dans l'est de la Chine. \nLa situation à Shanghai ne semble pas tenable, et il convient de procéder à une évacuation pour éviter de nouvelles pertes humaines. \n\n« Si la défense de Shanghai échoue, il faut l'évacuer, la réduire en miettes et la faire sauter. »\n\n- Tchang Kaï-chek"
 KMT_Civilwar.14.a:0 "Compris"
 KMT_Civilwar.15.t:0 "[GetNewspaperHeader]La deuxième bataille de Nankin"
 KMT_Civilwar.15.d:0 "Après avoir défendu Shanghai avec succès et vu les offensives communistes s'arrêter complètement, les troupes nationalistes lancèrent une offensive depuis Shanghai vers l'ancienne capitale de la République, Nanjing. Une bataille brutale et intense s'engagea pour le contrôle de la ville, les forces nationalistes finissant par percer les défenses de la ville et forçant les forces communistes à se retirer. Les observateurs étrangers affirment que la guerre a étonnamment tourné à l'avantage du Kuomintang, qui était au bord de l'effondrement après la percée communiste en Mandchourie lors de la campagne de Liao-hsi en 1948. Il ne fait toutefois aucun doute que les forces nationalistes prennent de l'élan grâce à la reconquête de leur ancienne capitale, ce qui constituerait une victoire majeure pour elles."
 KMT_Civilwar.15.a:0 "Une nouvelle décennie comme celle de Nankin ?"
 KMT_Civilwar.16.t:0 "[GetNewspaperHeader]Le Kuomintang progresse vers Wuhan"
 KMT_Civilwar.16.d:0 "Lorsque les forces nationalistes lancèrent leur contre-offensive contre les communistes, celles-ci furent rapidement repoussées vers la province du Hubei, où la ville de Wuhan fut rapidement reprise, ce qui permit aux nationalistes d'envisager de franchir le fleuve Yangtsé pour se diriger vers le nord. La bataille pour le berceau de la révolution de Xinhai revêt une grande importance, étant donné que tant le gouvernement du Kuomintang que le gouvernement communiste revendiquaient le statut de successeur légitime de la révolution de 1911. Avec la ville de Wuhan tombant sous le contrôle du Kuomintang, il semble que l'esprit révolutionnaire des nationalistes soit toujours bien vivant en eux. Du moins en apparence."
 KMT_Civilwar.16.a:0 "Un rebondissement inattendu."
 KMT_Civilwar.17.t:0 "[GetNewspaperHeader]Les troupes du Kuomintang reprennent Beiping"
 KMT_Civilwar.17.d:0 "À l'issue d'une invasion réussie de la capitale communiste, les nationalistes ont triomphé des rouges ; la guerre leur est désormais totalement favorable et a anéanti tout l'élan dont disposaient auparavant les communistes. La ville étant de nouveau sous le contrôle du Kuomintang, un portrait de Tchang a été remis en place au-dessus de la place Tiananmen, humiliant ainsi les communistes dans leur propre capitale. Face à la défaite évidente des forces communistes en Chine, les Soviétiques ont commencé à préparer une intervention dans la région afin d'imposer un cessez-le-feu fragile entre les deux camps et d'assurer leur propre influence en Mandchourie. Ils ont déclaré qu'ils étaient prêts à tout pour renforcer leur influence, même si cela devait entraîner une escalade totale du conflit avec la République de Chine et les États-Unis."
 KMT_Civilwar.17.a:0 "Les communistes chinois sont à bout de souffle"
 KMT_Civilwar.18.t:0 "Retour à Nanjing"
 KMT_Civilwar.18.d:0 "Avec le retour du gouvernement national à Nankin, nous pouvons ordonner directement aux forces armées de marcher sur Beiping afin de libérer le nord de l'emprise communiste et de rétablir l'ordre en Chine. Nos années de persévérance ayant porté leurs fruits alors que nous étions au plus bas, nous pouvons désormais être certains que la chute des communistes n'est plus qu'une question de temps."
 KMT_Civilwar.18.a:0 "Poursuivez sans tarder les bandits en fuite !"
 KMT_Civilwar.19.t:0 "La défection du Hunan"
 KMT_Civilwar.19.d:0 "Récemment, le gouverneur du Hunan, Cheng Qian, accompagné de ses subordonnés, a annoncé le ralliement pacifique du Hunan aux forces communistes, rendant ainsi impossible de résister aux communistes dans cette province."
 KMT_Civilwar.19.a:0 "Traîtrise ! Ordonnez l'arrestation de Cheng Qian !"
 KMT_Civilwar.20.t:0 "Soulèvement de Pengxian"
 KMT_Civilwar.20.d:0 "À la suite du soulèvement de Pengxian, le gouverneur Liu Wenhui a changé de camp pour se rallier aux communistes de Pékin, dans le cadre de la campagne communiste du Sud-Ouest visant à envahir les provinces du Yunnan et du Sichuan."
 KMT_Civilwar.20.a:0 "Traîtres !"
 KMT_Civilwar.21.t:0 "Un soulèvement dans le Yunnan"
 KMT_Civilwar.21.d:0 "Le Yunnan, autrefois considéré comme le bastion de la démocratie en Chine, a basculé du côté des communistes. Le gouverneur Lu Han a pris la décision audacieuse d'annoncer la reddition de la province du Yunnan aux forces communistes ; nous devons réprimer cette odieuse rébellion avant que les forces communistes ne pénètrent dans le Yunnan."
 KMT_Civilwar.21.a:0 "Et maintenant ?"
 KMT_Civilwar.22.t:0 "Prise de pouvoir communiste au Xinjiang"
 KMT_Civilwar.22.d:0 "Alors que les forces communistes approchaient du Xinjiang, le gouverneur local Burhan Shadini, ainsi que les commandants et les troupes de la région, commencèrent à faire défection pour rejoindre les communistes ; la « libération pacifique » du Xinjiang fut alors proclamée, mettant fin à toute forme de résistance sérieuse qui aurait pu être opposée aux communistes à leur arrivée dans la région."
 KMT_Civilwar.22.a:0 "C'est scandaleux !"
 KMT_Civilwar.23.t:0 "[GetNewspaperHeader] La chute de Yenan"
 KMT_Civilwar.23.d:0 "La troisième chute de Yan'an aux mains des nationalistes, à l'issue d'une série de combats acharnés menés pour s'emparer de l'ancienne capitale de la base communiste et la sécuriser, a porté un coup terrible au moral des communistes pour les semaines qui ont suivi, démontrant ainsi que les communistes n'étaient pas aussi invincibles qu'ils le croyaient. La ville de Yan'an, qui servait de capitale et de quartier général au Parti communiste chinois depuis 1935, avait été prise pour la première fois par l'Armée du Nord-Est de Zhang Xueliang lors de la campagne de répression des bandits du Nord-Ouest, puis était tombée une seconde fois aux mains des forces nationalistes commandées par Hu Zongnan. Cette fois-ci, cependant, les nationalistes ont l'intention de consolider leur contrôle sur la ville au lieu de l'abandonner à nouveau, non pas en raison de son emplacement stratégique, mais pour sa capacité à saper la volonté des forces communistes."
 KMT_Civilwar.23.a:0 "La fin de l'héritage de la campagne d'encerclement ?"
 KMT_Civilwar.24.t:0 "Le retour de la nouvelle clique du Guangxi"
 KMT_Civilwar.24.d:0 "Avec l'entrée des forces soviétiques en Mandchourie, la majeure partie de nos forces armées fut envoyée dans cette région afin de se préparer à d'éventuels affrontements et conflits frontaliers, laissant ainsi d'importants vides de pouvoir dans la région de Liangguang. La clique du Guangxi, alors en exil, profita de l'absence des forces armées pour reprendre le pouvoir dans les régions du Guangxi. Sans déclarer illégitime le régime de Nanjing, Li Zongren a annoncé que son gouvernement maintiendrait une plus grande autonomie au Guangxi et s'opposerait aux efforts de centralisation du gouvernement nationaliste de Nanjing. En raison de l'épuisement causé par la guerre, de la situation économique désastreuse et de l'instabilité politique, nous ne sommes actuellement pas en mesure de nous débarrasser à nouveau de Li et de ses associés."
 KMT_Civilwar.24.a:0 "Nous nous en occuperons plus tard."
 KMT_Civilwar.25.t:0 "Sun Li-Jen achève l'entraînement de la 201e division"
 KMT_Civilwar.25.d:0 "Le général Sun Li-Jen a passé les derniers jours de la guerre civile à former des régiments issus de l'Armée de la Jeunesse chinoise afin de constituer la 201e division à Taïwan, cette division ayant été transférée pour l'instant sur l'île de Kinmen. Le général Sun avait initialement été nommé parmi les commandants chargés de mener la répression de la rébellion communiste en Mandchourie, où il avait réussi à semer la terreur parmi les forces et les commandants de l'Armée populaire de libération grâce à des offensives couronnées de succès. Cependant, le désastre a frappé lorsque le général Du Yuming a demandé au gouvernement central de le démettre de son commandement des forces en Mandchourie tout en l'accusant d'insubordination, ce qui a conduit à la situation actuelle de guerre civile dans laquelle nous nous trouvons. Il est maintenant temps de voir Sun revenir au front et se racheter, en espérant renverser le cours de la guerre civile comme nous l'avions prévu."
 KMT_Civilwar.25.a:0 "Bienvenue à nouveau, général Sun"
 KMT_Civilwar.26.t:0 "Ma Bufang demande à Guangzhou de lui fournir davantage de matériel"
 KMT_Civilwar.26.d:0 "Alors que les forces communistes approchent du Nord-Ouest, Ma Bufang s'est rendu à Guangzhou pour demander davantage de ravitaillement afin de défendre le Nord-Ouest contre les forces communistes, supérieures en nombre, tandis que son fils, Ma Jinyuan, dirige actuellement la défense de la région. Le Nord-Ouest est une région hostile, ce qui rend pratiquement impossible toute avancée des communistes s'ils décidaient d'y pénétrer pour y imposer leur autorité, tout comme au Xinjiang. Le gouverneur du Xinjiang, Burhan Shahidi, étant persuadé par son entourage de passer du côté communiste, notre seule option pour les en empêcher sera d'utiliser la clique de Ma comme barrière pour empêcher les forces communistes d'entrer dans la région, ce qui offrira une résistance suffisamment forte pour mettre un terme à leur avancée."
 KMT_Civilwar.26.a:0 "Envoie-lui par largage aérien le matériel qu'il a demandé"
 KMT_Civilwar.26.b:0 "Dommage, nous n'en avons assez que pour le sud de la Chine !"
 KMT_Civilwar.27.t:0 "Les mesures prises par Li Zongren pour freiner l'inflation"
 KMT_Civilwar.27.d:0 "Les tensions avec Tchang s'étant enfin apaisées, Tchang autorisa Li à utiliser les réserves d'or de Taïwan pour redresser l'économie, grâce à l'application provisoire de l'étalon-or dans diverses provinces sous le contrôle de la République, ainsi qu'à la réduction des dépenses liées au paiement des salaires des postes superflus. Ces mesures devaient renforcer la popularité de Li Zongren aux yeux de la population, tout en permettant de freiner partiellement l'hyperinflation afin de renforcer le soutien, même modeste, dont bénéficiait le Kuomintang."
 KMT_Civilwar.27.a:0 "Il ne nous échappera pas."
 KMT_Civilwar.27.b:0 "Il mérite tout le mérite de ces réformes !"
 KMT_Civilwar.28.t:0 "Stratégie de défense sur le continent"
 KMT_Civilwar.28.d:0 "Le Kuomintang ayant finalement accepté de conserver le contrôle du continent plutôt que de tout retirer à Taïwan, la question reste de savoir si l'armée doit ou non se replier vers des positions stratégiques à travers la Chine, où il serait beaucoup plus facile de freiner l'avancée de l'ennemi. Li Zongren a prévu de redéployer ses propres troupes dans le sud de la Chine, principalement dans les provinces du Guangxi et du Guangdong, afin de résister aux communistes. Chiang Kai-Shek, quant à lui, a prévu de tenir bon dans le sud-ouest de la Chine, principalement au Sichuan, qui avait servi de capitale de guerre pendant la guerre de résistance, avec sa propre armée. Nous devons analyser attentivement nos stratégies et notre situation, puis décider où concentrer la défense de notre armée."
 KMT_Civilwar.28.a:0 "Le plan de Chiang : concentrer les défenses sur le sud-ouest"
 KMT_Civilwar.28.b:0 "Le plan de Li : concentrer les défenses sur le sud"
 KMT_Civilwar.28.c:0 "Nos défenses actuelles sont tout à fait suffisantes."
 KMT_Civilwar.29.t:0 "Quel traitement Li Zongren préconisait-il pour les maladies chroniques du duodénum ?"
 KMT_Civilwar.29.d:0 "Le président Li Zongren, dont on sait qu'il souffre d'une affection chronique du duodénum, avait prévu de s'envoler pour les États-Unis afin de se faire soigner à la célèbre université Columbia. Si cette décision risquait de démoraliser de nombreux soldats, ne pas se faire soigner aurait pu aggraver la maladie et causer des dommages irréversibles à la santé de Li, mettant ainsi sa vie en danger."
 KMT_Civilwar.29.a:0 "Sa santé est « importante », il devrait consulter un médecin."
 KMT_Civilwar.41.t:0 "Quel traitement Li Zongren préconisait-il pour les maladies chroniques du duodénum ?"
 KMT_Civilwar.41.d:0 "Le président Li Zongren, dont on sait qu’il souffre d’une affection chronique du duodénum, avait prévu de s’envoler pour les États-Unis afin de se faire soigner à la célèbre université Columbia. Cependant, craignant que cette décision ne sape le moral de nombreux soldats, Li Zongren a déclaré que l’unité inconditionnelle et un commandement compétent devaient être garantis pour que la République puisse l’emporter. Un geste véritablement noble, qui pourrait toutefois renforcer sa popularité au sein du Kuomintang, si nous sortions victorieux de la guerre civile."
 KMT_Civilwar.41.a:0 "Tous ensemble pour la victoire ! (Il l'a dit !)"
 KMT_Civilwar.30.t:0 "Le complot du soulèvement de Changsha"
 KMT_Civilwar.30.d:0 "Par un heureux hasard, notre Bureau de la sécurité nationale, récemment créé, a obtenu des renseignements selon lesquels le gouverneur du Hunan (Cheng Qian) aurait tenté de faire défection au profit des communistes. Nous ne pouvons certainement pas lui permettre de conserver plus longtemps son poste de gouverneur du Hunan ; il sera plutôt « chaleureusement » accueilli à son retour à la capitale par Tchang Kaï-chek, avec qui il « prendra le thé »."
 KMT_Civilwar.30.a:0 "Invitez Cheng et ses subordonnés à Guangzhou !"
 KMT_Civilwar.31.t:0 "Arrestation de Cheng Qian et de ses subordonnés"
 KMT_Civilwar.31.d:0 "Peu après leur arrivée, Cheng et ses subordonnés ont été immédiatement arrêtés et inculpés de trahison envers l'État sur la base d'informations recueillies par le Bureau de la sécurité nationale du Kuomintang. Dans le même temps, Zhao Hengti a été nommé nouveau gouverneur du Hunan et s'est rendu dans la région pour prendre la tête de la défense de la province."
 KMT_Civilwar.31.a:0 "Fini les contretemps."
 KMT_Civilwar.31.b:0 "Le Hunan finira bien par nous revenir !"
 KMT_Civilwar.32.t:0 "Lancement de la campagne Chang-heng"
 KMT_Civilwar.32.d:0 "Peu après l'échec du soulèvement de Changsha mené par Cheng Qian et d'autres officiers, le Parti communiste a lancé la campagne de Chang-heng dans l'espoir de placer le Hunan sous son autorité et de mettre rapidement un terme à la guerre civile chinoise. On ignore encore quelle sera la position du Kuomintang concernant la défense du Hunan : s'il choisira de conserver le contrôle de la province ou s'il l'utilisera pour organiser une défense concentrée autour de Liangguang et du Sichuan."
 KMT_Civilwar.32.a:0 "Qu'on y aille !"
 KMT_Civilwar.32.b:0 "Libérons le Hunan des bandits blancs !"
 KMT_Civilwar.33.t:0 "Conférence militaire d'urgence"
 KMT_Civilwar.33.d:0 "La situation militaire devenant critique, Tchang Kaï-chek a rappelé tous les officiers supérieurs fidèles à la cause, disséminés à travers la Chine, afin qu’ils regagnent la capitale et discutent d’une nouvelle stratégie face à l’avancée des armées communistes. À leur retour, ces officiers ont été accueillis avec beaucoup d’espoir, dans l’attente qu’une solution rapide puisse être trouvée aux problèmes actuels."
 KMT_Civilwar.33.a:0 "Tout le monde a réussi à se rendre à la conférence."
 KMT_Civilwar.34.t:0 "Deuxième gouvernement de coalition"
 KMT_Civilwar.34.d:0 "Grâce aux efforts déployés par la République de Chine pour ramener le Turkestan oriental dans le giron national, efforts couronnés de succès par le biais de renégociations et d'offres de concessions, celle-ci a réussi à s'assurer leur soutien pour la formation du deuxième gouvernement de coalition. Bien qu'on leur ait promis, pour l'instant, autonomie et liberté, cela pourrait changer si la République de Chine sortait victorieuse de la guerre civile."
 KMT_Civilwar.34.a:0 "Une province de plus qui revient dans le giron."
 KMT_Civilwar.34.b:0 "Malheureusement..."
 KMT_Civilwar.35.t:0 "[GetNewspaperHeader]La chute de Guangzhou"
 KMT_Civilwar.35.d:0 "Les défenses de la ville ont commencé à s'effondrer lorsque l'Armée populaire de libération a lancé un assaut coordonné contre la ville après la chute de la province du Hunan. L'APL a mis en œuvre une stratégie d'encerclement et a pris pour cible les défenses du KMT à l'aide d'artillerie et d'assauts d'infanterie. Les troupes du KMT, en infériorité numérique et confrontées à des problèmes logistiques, se sont rapidement effondrées sous la pression. Les forces du gouvernement nationaliste se dispersent désormais et fuient vers l'ouest et le sud, tentant de s'échapper in extremis du continent afin d'éviter de vivre sous la nouvelle bannière communiste, alors que la guerre civile touche à sa fin."
 KMT_Civilwar.35.a:0 "C'est fini pour le Kuomintang."
 KMT_Civilwar.36.t:0 "[GetNewspaperHeader]La chute de Chongqing"
 KMT_Civilwar.36.d:0 "Avec la campagne de Chongqing menée par l'Armée populaire de libération (APL) pour écraser la résistance militaire résiduelle de l'Armée nationale révolutionnaire (ANR) dans la province du Sichuan et s'emparer de l'ancienne capitale de guerre, Chongqing, les nationalistes ont perdu l'un de leurs derniers grands centres urbains sur le continent. Tchang Kaï-chek et les forces nationalistes restantes ont déjà ordonné l'évacuation vers Chengdu, qui se trouve désormais exposée à la fois à l'avancée des troupes de l'APL et aux seigneurs de guerre rebelles du Sichuan. La chute de Chongqing a jusqu'à présent marqué la victoire quasi totale des communistes dans la guerre civile chinoise, l'effondrement de l'autorité du Kuomintang sur le continent étant inévitable."
 KMT_Civilwar.36.a:0 "Ce n'est plus qu'une question de temps..."
 KMT_Civilwar.37.t:0 "Le dernier jour sur le continent ?"
 KMT_Civilwar.37.d:0 "Il était 23 heures lorsque Tchang Kaï-chek, Tchang Ching-kuo, Tao Xisheng, Gu Zhenggang, Yu Jishi et leur groupe ont fait leurs adieux au chef d'état-major Gu Zhutong, qui devait rester sur place pour continuer à diriger la résistance, après avoir chanté l'hymne national de la République de Chine. Chiang Kai-shek monta ensuite dans une voiture, escortée par des véhicules blindés et des chars pour assurer sa sécurité totale, et quitta l'enceinte de l'Académie militaire centrale par la porte principale. Sous l'escorte d'un détachement entièrement armé du 23e corps de l'Académie militaire, il se rendit directement à l'aéroport de Xinjin dans la nuit, où Chiang Kai-shek embarqua à bord de l'avion à destination de Taïwan. Ce fut peut-être là son tout dernier moment sur le continent."
 KMT_Civilwar.37.a:0 "Au moins, on est à l'abri des communistes maintenant..."
 KMT_Civilwar.38.t:0 "Déserteurs au sein de l'armée"
 KMT_Civilwar.38.d:0 "Alors que l'Armée populaire de libération poursuit son avancée vers le centre et le sud de la Chine, plusieurs bataillons, en perte de moral, décident de faire défection de l'Armée républicaine et de livrer des villes entières aux communistes sans opposer la moindre résistance. Si nous ne parvenons pas à renverser le cours de la guerre rapidement, ces défections causeront notre perte."
 KMT_Civilwar.38.a:0 "Traîtres !"
 KMT_Civilwar.39.t:0 "La question des prisonniers de guerre"
 KMT_Civilwar.39.d:0 "Au cours de notre avancée sur le territoire du Kuomintang, nos glorieuses victoires ont non seulement libéré les ouvriers chinois de l'emprise de la bourgeoisie, mais ont également permis la capture de plusieurs généraux clés de l'Armée républicaine, parmi lesquels Du Yuming, Fan Hanjie, Huang Wei, Wang Yaowu, Chen Changjie, Shen Zui, Song Xilian et Liao Yaoxiang.\n\nAlors que les forces du Kuomintang se rapprochent rapidement de nos fortifications et reprennent des villes à un rythme alarmant, la direction du parti commence à remettre en question les capacités de l'Armée populaire de libération et élabore des plans pour un retrait total vers les régions de Mandchourie. Des ordres ont été donnés pour transférer les généraux capturés à Pékin afin d'empêcher qu'ils ne soient repris par le Kuomintang."
 KMT_Civilwar.39.a:0 "Tu ne vas nulle part."
 KMT_Civilwar.40.t:0 "Le sort de nos généraux capturés"
 KMT_Civilwar.40.d:0 "Au cours de l'avancée communiste sur notre territoire, nombre de nos courageux généraux, qui avaient risqué leur vie pour défendre la République contre les menaces tant japonaises que communistes, ont été capturés par l'Armée populaire de libération. Parmi ces généraux figurent Du Yuming, Fan Hanjie, Huang Wei, Wang Yaowu, Chen Changjie, Shen Zui, Song Xilian et Liao Yaoxiang.\n\nDes espions de Beiping nous ont informés qu'en raison de l'avance rapide de nos forces, le Parti communiste élabore des plans pour un retrait total vers les régions de Mandchourie. L'ordre a été donné de transférer ces généraux capturés à Pékin afin de les empêcher de fomenter une révolte à la veille de notre victoire imminente. Bien que nous ne sachions pas encore comment l'Union soviétique réagira à ces récents développements, il est de notre devoir de secourir ceux qui se sont battus pour préserver la Chine de la tyrannie."
 KMT_Civilwar.40.a:0 "Nous allons redoubler d'efforts !"
 bss.221.t:0 "La République de Chine à Taïwan"
 bss.221.d:0 "Nos soldats ayant été vaincus sur le champ de bataille, nos approvisionnements détruits et le moral au plus bas, les bandits communistes ont pris le contrôle de la Chine continentale et s’apprêtent désormais à instaurer leur régime totalitaire brutal sur la Chine. Cependant, ce n’est pas le moment de perdre espoir ! La Chine libre perdure, sur l’île de Taïwan. Nous allons nous réarmer et nous réorganiser, puis nous retournerons finalement sur le continent pour libérer le peuple chinois de l'oppression !\n\nDivers rapports suggèrent également que le général Li Mi et son bataillon se sont repliés vers les régions frontalières de l'ancienne Birmanie britannique et prévoient de lancer une offensive de libération dans le Yunnan. Nous devons le soutenir si nous voulons un jour reprendre le continent !"
 bss.221.a:0 "Un jour, nous reviendrons."
 bss.221.b:0 "Li Mi va libérer la Chine ! (Incarnez YANSA)"
 bss.222.t:0 "[GetNewspaperHeader]Résolution 505 de l'ONU"
 bss.222.d:0 "Aujourd’hui à New York, au nom des représentants de la République de Chine, l’Assemblée générale des Nations unies a adopté la résolution 505, condamnant officiellement la violation par l’Union soviétique du Traité d’amitié sino-soviétique de 1945. La République de Chine accuse l’Union soviétique d’avoir rompu ce traité en soutenant le Parti communiste chinois, son adversaire, et en l’encourageant à renverser le gouvernement nationaliste de la République de Chine. De plus, les représentants du gouvernement de [CHI.GetLeader] ont affirmé que les forces armées de la République de Chine avaient besoin de l'aide des nations occidentales pour vaincre l'insurrection communiste en Chine, sous forme de livraisons d'armes et de conseillers. On ne sait pas encore comment les États-Unis et leurs alliés vont gérer la situation, mais cela montre clairement que le Kuomintang pourrait ne pas être en mesure de conserver le contrôle de la Chine continentale."
 bss.222.a:0 "Un coup dur pour les relations sino-soviétiques."
 bss.227.t:0 "Désertions massives au sein des forces armées"
 bss.227.d:0 "Alors que l'Armée populaire de libération (APL) poursuit son avancée vers le centre et le sud de la Chine, de plus en plus de généraux, de gouverneurs et d'amiraux remettent leurs forces aux communistes sans même opposer de résistance. Des informations nous sont parvenues selon lesquelles le général Liu Wenhui du Sichuan et le général Cheng Qian du Hunan se seraient rendus pacifiquement à l'APL de Mao Zedong qui avance. De plus, divers amiraux et autres personnalités politiques tels que Ma Hongbin, Ma Dunjing, Li Jishen et Chen Shaokuan ont cédé aux promesses communistes et ont également fait défection au profit de l'APL, nous privant ainsi d'équipements militaires importants. Une fois de retour sur le continent, ils paieront pour leur trahison envers la République !\n\nOutre cette trahison, divers généraux courageux qui ont refusé de se rendre aux communistes ont connu une mort tragique sur le champ de bataille, soit en étant capturés par l’APL, soit en étant purement et simplement assassinés de sang-froid. Leur sacrifice ne sera pas oublié et chacun d’entre eux sera vengé !"
 bss.227.a:0 "Traîtres !"
 bss.228.t:0 "Le Groupe White"
 bss.228.d:0 "D'anciens officiers japonais ayant pris part à la Seconde Guerre mondiale ont été nommés conseillers militaires de Tchang Kaï-chek pendant la guerre civile chinoise, qui a fait rage à partir de 1946. Beaucoup d'entre eux ont accepté de continuer à soutenir Tchang afin d'éradiquer la menace communiste en Chine, principalement par gratitude envers Tchang, qui a fait preuve d'une certaine indulgence face aux atrocités commises contre la population chinoise. Leur aide nous permettra de renforcer nos capacités militaires grâce à leurs stratégies de guerre supérieures, ce qui nous donnera un avantage sur les communistes."
 bss.228.a:0 "Ils travailleront pour nos forces armées !"
 bss.228.b:0 "À long terme, cela pourrait bien se retourner contre eux..."
 bss.229.t:0 "Les seigneurs de guerre se montrent de plus en plus rebelles..."
 bss.229.d:0 "Notre autorité sur les territoires que nous contrôlons étant insuffisante, plusieurs gouverneurs régionaux ont commencé à échapper à notre contrôle et à nous considérer comme illégitimes. Il est évident que si nous n'exerçons pas une autorité suffisante sur le pays, une révolte des seigneurs de guerre est inévitable."
 bss.229.a:0 "La situation ne doit pas dégénérer."
 bss.0.t:0 "Kowalski, charge l'arbre des années 60"
 bss.0.d:0 "Kowalski, je veux que tu attribues à ce joueur son arbre des années 60 et quelques malus pour que cela corresponde à la situation de son pays, c'est bien compris ?"
 bss.0.a:0 "Oui, Monsieur."
 bss.1.t:0 "La République de Chine en 1949"
 bss.1.d:0 "Lorsque la dynastie Qing fut renversée lors de la révolution de Xinhai, la République de Chine fut officiellement fondée en 1912, avec le grand Dr Sun Yat-sen comme premier président par intérim, mais celui-ci fut rapidement contraint de céder le pouvoir à l'ancien général Qing Yuan Shikai. Après que Yuan Shikai se fut proclamé empereur de Chine, une crise nationale éclata et de nombreuses provinces déclarèrent leur indépendance vis-à-vis de Pékin, marquant ainsi le début de l'ère des seigneurs de la guerre en Chine. Le Kuomintang se retrouva dans le Guangdong, d'où il commença à planifier une expédition pour unifier le pays. Sun Yat-sen, le fondateur du parti, mourut en 1925 et, après une lutte pour le pouvoir entre Wang Jingwei et Tchang Kaï-chek, ce dernier sortit vainqueur et lança l'Expédition du Nord pour unifier le pays sous la bannière du KMT. Les dix années qui suivirent entrèrent dans l'histoire sous le nom de « Décennie de Nankin », durant laquelle le Kuomintang tenta lentement d'établir son autorité sur le pays. Ces années prirent finalement fin à la suite de l'incident du pont Marco Polo en 1937, qui dégénéra en une guerre ouverte entre la République de Chine et l'Empire du Japon. Après plus de huit ans de résistance acharnée, la République sortit victorieuse et reprit aux Japonais ses anciennes provinces de Mandchourie et de Taïwan. La paix et l'ordre ne durèrent toutefois pas longtemps, car le conflit entre le Kuomintang et le mouvement communiste en pleine expansion reprit, entraînant une fois de plus le pays dans la guerre et le chaos."
 bss.1.a:0 "Parlez-nous davantage du Kuomintang."
 bss.1.b:0 "Le mouvement communiste ?"
 bss.1.c:0 "En avant !"
 Intro.1.t:0 "La situation du Kuomintang"
 Intro.1.d:0 "Le Kuomintang, également connu sous le nom de Parti nationaliste chinois, trouve son origine dans l'organisation révolutionnaire clandestine Tongmenghui, fondée par le Dr Sun Yat-sen et divers autres intellectuels républicains opposés au régime de la dynastie Qing. Le KMT adhère aux Trois Principes du Peuple, à savoir le bien-être, la démocratie et le nationalisme. Après l'ascension de Yuan Shikai à la suite de la Grande Révolution, le Kuomintang a été interdit, mais s'est réorganisé à Liangguang après que le pays se fut divisé en plusieurs régions contrôlées par des seigneurs de la guerre. Afin d'unifier le pays, le KMT et le Parti communiste chinois, alors relativement modeste, ont formé le Premier Front uni et ont vaincu les cliques de Beiyang dans le nord, unifiant officiellement la Chine sous la bannière du KMT. Cependant, divers seigneurs de guerre ont été soudoyés et recrutés par le KMT pour maintenir la stabilité régionale. Peu après la mort du Dr Sun en 1925 et la consolidation du pouvoir de Chiang Kai-shek, le PCC a été purgé du KMT en 1927, marquant le début officiel de la guerre civile chinoise. Tout au long de la décennie suivante et jusqu’à aujourd’hui, le KMT n’est plus que l’ombre de ce qu’il était. La corruption, l’opportunisme, les luttes de factions et le manque de soutien populaire ont plongé le KMT dans une situation désastreuse. Même le généralissime en a pris conscience et a annoncé de grandes réformes pour transformer le parti en l’organisation démocratique révolutionnaire qu’il était autrefois."
 Intro.1.a:0 "Pour la révolution !"
 Intro.1.b:0 "Parle-moi un peu plus du mouvement communiste."
 Intro.2.t:0 "La guerre civile chinoise"
 Intro.2.d:0 "Lorsque le Komintern a soutenu la création du Parti communiste chinois, celui-ci n'était alors qu'une organisation politique inconnue comptant seulement quelques centaines de membres. Le Comité central du PCC avait prévu que le parti rejoigne à terme le Kuomintang au sein du Premier Front uni contre les cliques impérialistes de Beiyang, puis tente par la suite d'infiltrer le KMT pour en faire un véritable parti marxiste. Cependant, lorsque Sun Yat-sen mourut en 1925 et que la faction de Wang Jingwei au sein du Kuomintang fut vaincue par celle de Tchang Kaï-chek, le Front uni se désagrégea et les membres communistes furent purgés lors du massacre de Shanghai en 1927, marquant le début officiel de la guerre civile chinoise. Au cours des dix années suivantes, le Kuomintang a tout tenté pour éradiquer les bandits communistes restants qui s’étaient enfuis au Shaanxi, mais à la suite de l’incident de Mukden en 1931 et de l’incident de Shanghai en 1932, les sentiments antijaponais au sein du KMT se sont considérablement intensifiés, ce qui a conduit à l'enlèvement de Tchang Kaï-chek par le général Zhang Xueliang en 1936, qui a contraint le généralissime à rejoindre un nouveau Front uni avec le PCC contre l'impérialisme japonais. La guerre contre le Japon touchant à sa fin en 1945, il n'a pas fallu longtemps pour que le conflit entre le KMT et le PCC reprenne de plus belle. En 1946, la guerre civile continue de faire rage et les bandits communistes ont gagné de manière exponentielle le soutien populaire des paysans chinois. Nous devons mettre tous nos efforts à vaincre la menace rouge !"
 Intro.2.a:0 "Et le Kuomintang, alors ?"
 Intro.2.b:0 "Pour la République !"
 bss.2.t:0 "L'intervention soviétique"
 bss.2.d:0 "Alors que nous étions sur le point de remporter la victoire contre les communistes, l'Union soviétique est intervenue pour empêcher l'effondrement total du PCC et a envahi les régions du Xinjiang et de la Mongolie intérieure. Les communistes contrôlent toujours la Mandchourie et la région de Pékin, mais nous ne sommes pas en mesure de déclencher un conflit avec l'URSS. \n\nNéanmoins, nous contrôlons les régions de la Chine continentale et avons assuré le leadership du KMT. Pour l'instant, nous devons nous concentrer sur la reconstruction du pays et la maîtrise de nos problèmes internes si nous voulons un jour reprendre le Nord au PCC."
 bss.2.a:0 "Les armes se tiennent au repos… pour l'instant."
 bss.3.t:0 "La République sur la scène internationale"
 bss.3.d:0 "Après la guerre civile, nous nous sommes retrouvés dans une situation difficile. Nous nous sommes imposés comme un bastion anticommuniste en Asie de l'Est, mais maintenant que nous avons réglé nos problèmes internes, nous devons décider du rôle que nous jouerons sur la scène politique internationale, en particulier dans nos relations avec les États-Unis et leurs alliés en Asie de l'Est."
 bss.3.a:0 "On verra bien."
 bss.4.t:0 "Une proposition des Chinois"
 bss.4.d:0 "Une délégation du gouvernement de Nankin est arrivée ce matin à Washington. Le Kuomintang cherche à renforcer ses liens avec nous et propose que nous disposions d'une base militaire dans le détroit de Taïwan et que nous puissions déplacer librement nos troupes à l'intérieur des frontières chinoises, en échange de conseillers, d'équipements et d'une protection contre une éventuelle agression communiste. Cela renforcerait notre influence en Chine et en Asie de l'Est en général, mais étant donné qu'une invasion du PCC soutenue par l'Union soviétique semble très improbable, cela signifierait que nous risquerions de nous retrouver impliqués dans une guerre régionale majeure en Asie de l'Est.\n\nComment devrions-nous réagir ?"
 bss.4.a:0 "Parfait ! Nous acceptons l'offre."
 bss.4.b:0 "C'est trop risqué."
 bss.5.t:0 "Washington accepte !"
 bss.5.d:0 "Les États-Unis d'Amérique ont accepté notre offre ! Grâce à leur protection et à leur équipement moderne, nous serons non seulement en mesure de repousser toute invasion communiste, mais cela nous aidera également à moderniser notre armée selon les normes occidentales."
 bss.5.a:0 "Magnifique."
 bss.6.t:0 "Les Américains refusent."
 bss.6.d:0 "Les Américains ont rejeté notre demande d'équipement et de protection, arguant qu'ils ne souhaitent pas être impliqués dans une éventuelle guerre à grande échelle en Chine. Cependant, Washington continue de nous reconnaître comme le seul gouvernement légitime de la Chine et reste ouvert au commerce et aux ventes d'armes."
 bss.6.a:0 "C'est dommage."
 bss.7.t:0 "[GetNewspaperHeader]La République de Chine dénonce les États-Unis"
 bss.7.d:0 "À la suite d'un revirement de situation inattendu, le président chinois [CHI.GetLeader] a annoncé que lui-même et son gouvernement n'étaient plus disposés à continuer de soutenir les États-Unis ; il a expulsé tous les conseillers américains du territoire chinois et a refusé d'adhérer à l'OTASE.\nLes Chinois ont fait valoir que les États-Unis ne sont qu'une puissance impérialiste de plus qui cherche à exploiter la Chine pour l'argent, et ont jugé nécessaire d'expulser l'influence américaine afin de mettre un peu plus fin au « siècle d'humiliation ». Washington a qualifié ces mesures d’absurdes et a immédiatement rappelé tous ses conseillers et cessé ses ventes d’armes à la Chine. Il s’agit néanmoins d’un coup dur pour l’influence américaine en Asie de l’Est, mais de nombreux experts occidentaux estiment que le gouvernement de Nankin est désormais extrêmement vulnérable à une éventuelle invasion communiste."
 bss.7.a:0 "Intéressant"
 bss.8.t:0 "[GetNewspaperHeader]La conclusion du Pacte de Nankin"
 bss.8.d:0 "Aujourd’hui, le gouvernement de Nanjing a annoncé la création du Pacte de Nanjing, une alliance militaire visant à endiguer le communisme en Asie de l’Est. [CHI.GetLeader] a affirmé que l’OTASE ne pouvait à elle seule mettre un terme à la propagation du communisme et a clairement indiqué que la République de Chine apporterait son soutien à toute nation d’Asie de l’Est menacée par le communisme.\nL'Union soviétique et d'autres gouvernements communistes de la région ont critiqué cette initiative, qualifiant l'alliance d'inutile et de menace pour la paix dans la région. Les États-Unis d'Amérique ont toutefois déjà exprimé leur soutien à cette idée et se montrent intéressés par une coopération entre l'OTASE et le Pacte de Nanjing."
 bss.8.a:0 "Une guerre se profile-t-elle à l'horizon ?"
 bss.9.t:0 "En souvenir du Mouvement du 4 mai"
 bss.9.d:0 "Le Mouvement du 4 mai fut un mouvement anti-impérialiste, culturel et politique né des manifestations étudiantes qui eurent lieu à Pékin le 4 mai 1919. La première conséquence directe de ce mouvement fut d’amener l’ancien gouvernement de Beiyang à refuser de signer des accords défavorables à la Chine.\n\nCette décision a choqué de nombreux pays occidentaux et leur a fait prendre conscience que la Chine, autrefois faible et qui ne faisait que fuir, avait commencé à leur tenir tête. Hu Shih, éminent érudit et témoin contemporain du Mouvement du 4 mai, suggère que si nous voulons mettre fin au « siècle d’humiliation », nous devons nous souvenir et remettre en œuvre les idées et les principes du Mouvement du 4 mai. \n\nQue la Chine soit libérée de l’impérialisme étranger. Pour dix mille ans !"
 bss.9.a:0 "Wansui !"
 KMT_Borderconflict.1.t:0 "Les bataillons de l'APL ont été anéantis"
 KMT_Borderconflict.1.d:0 "Nos troupes ont remporté une victoire décisive contre les forces ennemies de l'Armée populaire de libération lors d'un accrochage à la frontière de Pékin. Bien que nous ne souhaitions pas, pour l'instant, aggraver le conflit et que nos forces n'aient pas franchi la frontière, il s'agit tout de même d'une grande victoire pour la République de Chine !"
 KMT_Borderconflict.1.a:0 "Youpi !"
 KMT_Borderconflict.2.t:0 "Catastrophe à la frontière"
 KMT_Borderconflict.2.d:0 "C'est une terrible nouvelle ! Notre bataillon, qui devait tester les forces ennemies de l'Armée populaire de libération à la frontière de Pékin, a subi une défaite cuisante à la suite d'un accrochage avec les troupes communistes. C'est un immense déshonneur pour la République de Chine."
 KMT_Borderconflict.2.a:0 "Comment cela a-t-il pu arriver ?"
 KMT_Borderconflict.4.t:0 "Les troupes du KMT remportent une victoire à la frontière"
 KMT_Borderconflict.4.d:0 "Aujourd'hui, un bataillon de l'ancienne NRA a lancé une attaque surprise contre notre poste-frontière à Pékin. Nos forces ont été submergées et ont dû battre en retraite pour se réapprovisionner. Même si les troupes du KMT n'ont pas franchi la frontière, il s'agit tout de même d'une défaite cuisante pour l'APL."
 KMT_Borderconflict.4.a:0 "Terrible !"
 KMT_Borderconflict.3.t:0 "Les troupes du KMT ont été vaincues par une patrouille de l'APL"
 KMT_Borderconflict.3.d:0 "Aujourd'hui, un bataillon de l'ancienne NRA a lancé une attaque surprise contre nos gardes-frontières à Pékin. Nos forces ont d'abord été débordées, mais elles ont ensuite pris l'avantage grâce au soutien des milices de guérilla présentes dans les territoires occupés, forçant les troupes du KMT à battre en retraite pour se ravitailler. Il s'agit d'une grande victoire pour l'APL, qui a démontré que l'armée du Kuomintang n'est pas invincible."
 KMT_Borderconflict.3.a:0 "Parfait"
 bss.401.t:0 "[GetNewspaperHeader]L'invasion de la Mandchourie"
 bss.401.d:0 "De nombreux observateurs avaient prédit que ce jour finirait par arriver et, aujourd’hui, le [GetDateText], la République de Chine a lancé son invasion des territoires de Mandchourie occupés par les socialistes. À l’issue de la guerre civile chinoise, le Parti communiste chinois a bénéficié du soutien de l’Union soviétique pour éviter son effondrement total et s’est maintenu dans la région de Mandchourie. Le Kuomintang a affirmé qu'il était le seul gouvernement légitime de Chine et a annoncé que la réunification était inévitable. Tout en se concentrant sur la reconstruction du pays après la guerre civile et la Seconde Guerre mondiale, la République est désormais prête à reprendre ses anciens territoires et à vaincre les socialistes en Chine une fois pour toutes. L'Union soviétique et les États-Unis n'ont pas encore fait de déclaration concernant cette évolution récente, mais on peut supposer sans risque qu'ils aideront leurs partenaires respectifs en leur fournissant des armes et des conseillers."
 bss.401.a:0 "La bataille finale pour l'Asie a commencé."
 bss.402.t:0 "[GetNewspaperHeader]Le triomphe des nationalistes"
 bss.402.d:0 "Depuis 1911, la nation chinoise a été victime de révolutions, de seigneurs de guerre, de conflits régionaux, de guerres civiles, d'exploitation étrangère et d'agressions. Le chapitre de la guerre civile chinoise a constitué le plus long conflit de l'histoire récente, s'étendant de 1927 à [GetYear], période durant laquelle le Kuomintang et le Parti communiste chinois se sont affrontés pour le contrôle du pays. À la fin de la Seconde Guerre mondiale, l'Union soviétique est intervenue dans la guerre civile en faveur des communistes et leur a assuré une base politique en Mandchourie. Cependant, le Kuomintang, qui contrôlait la majeure partie du pays, a clos ce chapitre de l'histoire chinoise avec sa récente invasion de la Mandchourie, marquant ainsi la bataille finale entre les deux camps. Le Kuomintang a remporté la victoire et, aujourd'hui, dans un discours, le président [CHI.GetLeader] a annoncé au peuple chinois que « la menace du marxisme est enfin vaincue » et que désormais « rien ne s'oppose à la prospérité de l'Empire du Milieu ». On ignore pour l'instant quel est le sort de l'ancien PCC, mais on suppose que la plupart de ses membres se sont exilés en Union soviétique ou ont été capturés et seront jugés."
 bss.402.a:0 "La paix en Chine ?"
 bss.10.t:0 "La République de Chine exige le retrait de l'OTASE"
 bss.10.d:0 "Après avoir adopté une position anti-occidentale, la République de Chine tente désormais de contrer l'influence occidentale non seulement en Chine, mais aussi dans toute la région de l'Asie de l'Est. C'est pourquoi le gouvernement de Nanjing a exigé que nous nous retirions de l'OTASE et que nous expulsions toutes les troupes et tous les fonctionnaires américains de notre pays, sous peine de subir un embargo qui paralyserait gravement notre économie.\n\nRefuser cet ultimatum aurait des conséquences désastreuses pour notre économie, car nous dépendons du commerce avec le gouvernement républicain, mais nous ne pouvons pas non plus risquer de perdre le soutien et la protection des États-Unis. Comment devons-nous réagir ?"
 bss.10.a:0 "Nous n'avons d'autre choix que d'accepter"
 bss.10.b:0 "Nous ne pouvons pas mettre en péril nos relations avec les États-Unis. Refusons !"
 bss.11.t:0 "Les Chinois réclament Hong Kong !"
 bss.11.d:0 "Après avoir adopté une position anti-impérialiste et dénoncé le colonialisme en Asie de l'Est, le gouvernement de Nankin a exigé que nous rendions immédiatement le territoire de Hong Kong ! Il s'agit clairement d'une violation du Traité de Nankin et de la Deuxième Convention de Pékin, mais si nous conservons ce territoire, nous risquons de nous heurter à la force de l'Armée nationale révolutionnaire (NRA) et, en raison de leur position anticolonialiste, les États-Unis ne nous soutiendront pas dans ce conflit.\n\nCependant, certains membres de notre gouvernement proposent qu'au lieu de restituer le territoire, nous essayions d'apaiser les Chinois en leur accordant des droits supplémentaires sur les ressources locales et en laissant leur armée stationner dans la région.\n\nComment devrions-nous réagir ?"
 bss.11.a:0 "On ne peut pas y faire grand-chose."
 bss.11.b:0 "Faites une contre-offre"
 bss.11.c:0 "Les 99 ans ne sont pas encore terminés !"
 bss.12.t:0 "Les Chinois réclament Macao !"
 bss.12.d:0 "Après avoir adopté une position anti-impérialiste et dénoncé le colonialisme en Asie de l'Est, le gouvernement de Nanjing a exigé que nous lui rendions immédiatement le territoire de Macao ! Si nous tentons de conserver ce territoire, nous risquons de nous heurter à la force de la NRA et, en raison de leur position anticolonialiste, les États-Unis ne nous soutiendront pas dans ce conflit.\n\nCependant, certains membres de notre gouvernement proposent qu'au lieu de restituer le territoire, nous essayions d'apaiser les Chinois en leur accordant des droits supplémentaires sur les ressources locales et en laissant leur armée stationner dans la région.\n\nComment devons-nous réagir ?"
 bss.12.a:0 "On ne peut pas y faire grand-chose."
 bss.12.b:0 "Faites une contre-offre"
 bss.12.c:0 "Nous n'abandonnerons jamais Macao !"
 bss.13.t:0 "Londres capitule !"
 bss.13.d:0 "Le gouvernement britannique a cédé à nos pressions ! Il nous a rendu Hong Kong et sa garnison militaire quitte la Chine. C'est une grande victoire pour le peuple chinois, et nous avons désormais fait un pas de plus vers la fin définitive du « siècle d'humiliation »."
 bss.13.a:0 "Youpi !"
 bss.14.t:0 "Lisbonne capitule !"
 bss.14.d:0 "Le gouvernement portugais a cédé à nos pressions ! Il nous a rendu Macao et sa garnison militaire quitte la Chine. C'est une grande victoire pour le peuple chinois et nous avons désormais fait un pas de plus vers la fin définitive du « siècle d'humiliation »."
 bss.14.a:0 "Youpi !"
 bss.15.t:0 "Le Royaume-Uni refuse de céder Hong Kong"
 bss.15.d:0 "\nLe gouvernement de Londres a rejeté nos revendications ! Selon certains experts, les Britanniques enverraient des renforts pour protéger la ville si nous tentions de l'envahir. Mais pour l'instant, la ville est faiblement défendue et la NRA se tient prête à y faire son entrée pour libérer la population du colonialisme."
 bss.15.a:0 "Hong Kong est chinoise !"
 bss.15.b:0 "Faisons marche arrière, nous ne voulons pas prendre le risque d'un éventuel conflit."
 bss.16.t:0 "Les Portugais refusent de céder Macao"
 bss.16.d:0 "\nLe gouvernement de Lisbonne a rejeté nos revendications ! Selon certains experts, le gouvernement portugais enverrait des renforts dans la ville pour la protéger si nous tentions de l'envahir. Mais pour l'instant, la ville est faiblement défendue et la NRA se tient prête à y faire son entrée pour libérer la population du colonialisme."
 bss.16.a:0 "Macao est chinoise !"
 bss.16.b:0 "Faisons marche arrière, nous ne voulons pas prendre le risque d'un éventuel conflit."
 bss.17.t:0 "Les Britanniques proposent un compromis"
 bss.17.d:0 "\nAujourd’hui, l’ambassadeur britannique a présenté à notre gouvernement une proposition concernant le statut de Hong Kong. Bien que Londres ne souhaite pas nous céder l’ensemble de la région, il propose que nous soyons libres de déployer nos forces armées sur ce territoire et que nous en tirions toutes les ressources naturelles. Bien que cela renforcerait notre influence à Hong Kong, la ville ferait toujours partie de l'Empire britannique et non de la République de Chine.\n\nDevons-nous accepter cette offre ou la refuser et exiger le transfert immédiat de la ville ?"
 bss.17.a:0 "Ça me semble être une bonne affaire."
 bss.17.b:0 "Non, le colonialisme doit disparaître complètement de Chine."
 bss.18.t:0 "Les Chinois rejettent notre proposition"
 bss.18.d:0 "\nLe gouvernement chinois a rejeté notre proposition ! Nanjing a clairement fait savoir qu'il n'accepterait aucun compromis et qu'il souhaitait que nous quittions complètement la Chine. À l'heure où nous parlons, la NRA se prépare déjà à prendre le contrôle de la ville.\n\nQue devons-nous faire maintenant ?"
 bss.18.a:0 "Nous n'avons d'autre choix que de céder la ville."
 bss.18.b:0 "Nous défendrons la ville à tout prix !"
 bss.19.t:0 "Les Chinois acceptent notre compromis"
 bss.19.d:0 "Nankin a accepté notre proposition concernant le statut de Hong Kong. L'ambassadeur chinois nous a informés qu'une garnison était déjà en route vers Hong Kong pour assurer la sécurité de la ville et que des entreprises chinoises du secteur des ressources naturelles étaient déjà en train d'y ouvrir des bureaux.\n\nNous avons peut-être perdu une partie de notre influence dans la région, mais c'est une meilleure option que la guerre."
 bss.19.a:0 "La paix pour notre temps."
 bss.20.t:0 "Les Chinois font marche arrière"
 bss.20.d:0 "Le gouvernement de Nanjing a décidé de faire marche arrière et de nous laisser Hong Kong, arguant qu'il ne voulait pas risquer une guerre potentielle avec l'OTAN pour une seule ville."
 bss.20.a:0 "Bande d'imbéciles."
 bss.21.t:0 "Les Portugais proposent un compromis"
 bss.21.d:0 "\nAujourd'hui, l'ambassadeur du Portugal a présenté à notre gouvernement une proposition concernant le statut de Macao. Bien que Lisbonne ne souhaite pas nous céder l'ensemble de la région, elle propose que nous soyons libres de déployer nos forces armées sur ce territoire et que nous en tirions toutes les ressources naturelles. Bien que cela renforcerait notre influence à Macao, la ville ferait toujours partie de l'Empire colonial portugais et non de la République de Chine.\n\nDevons-nous accepter cette offre ou la refuser et exiger le transfert immédiat de la ville ?"
 bss.21.a:0 "Ça me semble être une bonne affaire."
 bss.21.b:0 "Non, le colonialisme doit disparaître complètement de Chine."
 bss.22.t:0 "Les Chinois rejettent notre proposition"
 bss.22.d:0 "\nLe gouvernement chinois a rejeté notre proposition ! Nanjing a clairement fait savoir qu'il n'accepterait aucun compromis et qu'il souhaitait que nous quittions complètement la Chine. À l'heure où nous parlons, la NRA se prépare déjà à prendre le contrôle de la ville.\n\nQue devons-nous faire maintenant ?"
 bss.22.a:0 "Nous n'avons d'autre choix que de céder la ville."
 bss.22.b:0 "Nous défendrons la ville à tout prix !"
 bss.23.t:0 "Les Chinois acceptent notre compromis"
 bss.23.d:0 "Nankin a accepté notre proposition concernant le statut de Macao. L'ambassadeur chinois nous a informés qu'une garnison était déjà en route vers Macao pour assurer la sécurité de la ville et que des entreprises chinoises du secteur des ressources naturelles étaient déjà en train d'y ouvrir des bureaux.\n\nNous avons peut-être perdu une partie de notre influence dans la région, mais c'est une meilleure option que la guerre."
 bss.23.a:0 "La paix pour notre temps."
 bss.24.t:0 "Les Chinois font marche arrière"
 bss.24.d:0 "Le gouvernement de Nanjing a décidé de faire marche arrière et de nous laisser Macao, arguant qu'il ne voulait pas risquer une guerre potentielle avec l'OTAN pour une seule ville."
 bss.24.a:0 "Bande d'imbéciles."
 bss.25.t:0 "La situation au Xinjiang"
 bss.25.d:0 "Tout au long de son histoire, le Xinjiang a abrité de nombreux groupes ethniques, notamment les Ouïghours, les Kazakhs et les Kirghizes (de souche turque), les Hans, les Tibétains, les Huis, les Tadjiks chinois (Pamiris), les Mongols, les Russes et les Sibés. Depuis son intégration à l'Empire Qing au XVIIIe siècle, le rétablissement de la paix et de l'ordre dans cette région a toujours constitué un défi de taille pour le gouvernement chinois en raison des tensions locales entre les différents groupes ethniques.\n\nTout au long de l'histoire de la République de Chine, la province du Xinjiang a traversé des périodes difficiles. Elle a été en proie à des menaces internes, telles que la rébellion de Kumul de 1931 à 1934, la révolte de Charkhlik de 1935 et la rébellion islamique de 1937, ainsi qu’à des menaces externes, notamment de la part de l’Union soviétique, qui s’efforce depuis lors d’accroître son influence dans la région.\n\nAprès la rébellion d'Ili, une coalition s'est formée entre les membres du KMT, les Ouïghours et les forces pro-soviétiques de la région, mais à la suite de notre « victoire » dans la guerre civile chinoise contre les communistes, l'Union soviétique est intervenue dans la région et a soutenu le soulèvement du Turkestan à Ili, qui a fini par prendre le contrôle de tout le Xinjiang et établir un régime pro-communiste.\n\nÀ l'heure actuelle, nous devons décider de la manière dont nous allons aborder cette situation, mais nous ne pouvons pas pour autant nous permettre de provoquer l'Union soviétique, car nous ne sommes pas en mesure de risquer une guerre avec Moscou."
 bss.25.a:0 "D'accord"
 bss.26.t:0 "[GetNewspaperHeader]La République de Chine reconnaît l'indépendance du Turkestan oriental"
 bss.26.d:0 "La région du Xinjiang est sous contrôle chinois depuis près de deux siècles, mais à la suite de l'intervention soviétique dans la guerre civile chinoise, la République du Turkestan oriental a réussi à prendre le contrôle de l'ensemble de la région du Xinjiang et à y instaurer un régime pro-soviétique.\nCependant, contre toute attente, le gouvernement de Nanjing a annoncé qu'il renoncerait à ses revendications sur la région et reconnaîtrait le Turkestan oriental comme un État indépendant, et qu'il cherchait à améliorer ses relations avec la jeune république.\n\nL'Union soviétique a déjà salué cette initiative, qui renforcera sans aucun doute la légitimité du gouvernement de Yining."
 bss.26.a:0 "Étonnant"
 bss.27.t:0 "Le destin de Sheng Shicai"
 bss.27.d:0 "Sheng Shicai a occupé le poste de gouverneur du Xinjiang entre 1933 et 1944, officiellement sous l'égide du KMT, mais s'est révélé peu fiable en raison de ses liens avec l'URSS. Après la bataille de Stalingrad, Sheng a tenté de faire appel à Joseph Staline une nouvelle fois et a essayé de limiter l'influence du KMT au Xinjiang, mais il a finalement échoué et a été destitué en 1944, puis rétrogradé au poste de ministre de l'Agriculture et des Forêts.\nEn raison de notre nouvelle position vis-à-vis du Xinjiang, de nombreux responsables du parti réclament un procès pour trahison envers le KMT.\nCependant, l'état-major estime que son expérience militaire au Xinjiang pourrait s'avérer très utile pour élaborer des stratégies de guerre dans le désert et en montagne."
 bss.27.a:0 "Pas de pitié pour les traîtres !"
 bss.27.b:0 "Son expérience pourrait s'avérer utile dans le cadre de futurs conflits"
 bss.27.c:0 "Nous allons le surveiller de près..."
 bss.28.t:0 "Une proposition du Kuomintang"
 bss.28.d:0 "Suite à la reconnaissance de notre régime, le Kuomintang a pris des mesures visant à exclure la région du Xinjiang de son administration et de son système bureaucratique. Il a déjà renoncé à ses prétentions sur notre territoire et propose désormais un pacte de non-agression entre nos nations afin d'apaiser les tensions entre Nanjing et le Pacte de Varsovie.\n\nComment devons-nous réagir ?"
 bss.28.a:0 "Nous acceptons leur offre"
 bss.28.b:0 "On ne peut pas leur faire confiance"
 bss.29.t:0 "Yining refuse notre offre !"
 bss.29.d:0 "Contre toute attente, le gouvernement du Turkestan oriental a rejeté notre demande de pacte de non-agression ! Cela ne manquera pas de contrarier les responsables de notre gouvernement, mais on peut s'attendre à ce que nous subissions désormais un tollé politique de la part de l'opinion publique, qui nous considérera comme faibles et estimera que nous avons cédé le Xinjiang pour rien."
 bss.29.a:0 "Malheureux"
 bss.30.t:0 "La NRA débarque à Hong Kong"
 bss.30.d:0 "Nos forces ont chassé les Britanniques de Hong Kong ! Après plus de 100 ans, Hong Kong fait enfin à nouveau partie de la Chine !"
 bss.30.a:0 "Youpi !"
 bss.31.t:0 "Catastrophe à Hong Kong"
 bss.31.d:0 "Nos forces n'ont pas réussi à chasser les Britanniques de Hong Kong ! C'est un désastre qui va gravement nuire à la réputation de notre armée et du gouvernement."
 bss.31.a:0 "Comment cela a-t-il pu arriver ?"
 bss.32.t:0 "La défense de Hong Kong"
 bss.32.d:0 "Excellente nouvelle ! Nos forces armées à Hong Kong ont réussi à mettre en place une défense remarquable et, après plusieurs jours de combats, la NRA a battu en retraite et a évacué la zone.\nC'est non seulement un grand jour pour l'Empire britannique, mais aussi un formidable coup de pouce au moral en ces temps difficiles."
 bss.32.a:0 "Rule Britannia !"
 bss.33.t:0 "La chute de Hong Kong"
 bss.33.d:0 "Mauvaise nouvelle ! Nos forces armées à Hong Kong n'ont pas réussi à défendre la ville contre la NRA. L'armée chinoise s'est rapidement emparée de la ville et a déclaré illégitimes tous les responsables britanniques.\nC'est non seulement un jour sombre pour l'Empire britannique, mais aussi un énorme coup porté au moral en ces temps difficiles."
 bss.33.a:0 "Le soleil est sur le point de se coucher..."
 bss.34.t:0 "La NRA fait son entrée à Macao"
 bss.34.d:0 "Nos forces ont chassé les Portugais de Macao ! Après plus de 400 ans, Macao fait enfin à nouveau partie de la Chine !"
 bss.34.a:0 "Youpi !"
 bss.35.t:0 "Catastrophe à Macao"
 bss.35.d:0 "Nos forces n'ont pas réussi à chasser les Portugais de Macao ! C'est un désastre qui va gravement nuire à la réputation de notre armée et du gouvernement."
 bss.35.a:0 "Comment cela a-t-il pu arriver ?"
 bss.36.t:0 "La défense de Macao"
 bss.36.d:0 "Excellente nouvelle ! Nos forces armées à Macao ont réussi à mettre en place une défense remarquable et, après plusieurs jours de combats, la NRA s'est retirée et a évacué la zone.\nC'est non seulement un grand jour pour le Portugal, mais aussi un formidable coup de pouce au moral en ces temps difficiles."
 bss.36.a:0 "Excellent."
 bss.37.t:0 "La chute de Macao"
 bss.37.d:0 "Mauvaise nouvelle ! Nos forces armées à Macao n'ont pas réussi à défendre la ville contre la NRA. L'armée chinoise s'est rapidement emparée de la ville et a déclaré illégitimes tous les responsables portugais.\nC'est non seulement un jour sombre pour le Portugal, mais aussi un énorme coup porté au moral en ces temps difficiles."
 bss.37.a:0 "C'est un désastre"
 bss.38.t:0 "Le coup d'État échoue"
 bss.38.d:0 "Une terrible nouvelle nous parvient du Xinjiang ! Il semblerait que les services secrets du Turkestan oriental, avec l'aide du KGB, aient découvert notre complot visant à renverser le régime de Qasim ! Si quelques-uns de nos hommes ont réussi à s'échapper à temps, beaucoup d'autres n'ont pas pu s'en sortir et ont été arrêtés par les autorités du Xinjiang ; ils seront jugés et condamnés à mort.\nCe serait un véritable désastre pour notre gouvernement si cette affaire venait à être rendue publique..."
 bss.38.a:0 "Super, on a vraiment perdu notre temps."
 bss.39.t:0 "Yulbars Khan consolide son emprise sur le Xinjiang"
 bss.39.d:0 "Excellente nouvelle ! Il semblerait que le complot visant à renverser Qasim ait abouti ! Yulbars Khan et ses alliés, ainsi que l'ancien Comité révolutionnaire du Kuomintang chinois, ont pris le contrôle des principales institutions politiques du Xinjiang et ont établi leur autorité sur les villes les plus importantes de la région. Nos espions indiquent que Qasim et son entourage proche ont évacué la région et sont en route pour Moscou.\nC'est un grand succès pour notre gouvernement et cela renforcera sans aucun doute le soutien populaire à notre régime. Dès à présent, nous devons commencer les préparatifs pour la réintégration du Xinjiang au sein de la République."
 bss.39.a:0 "Excellent !"
 bss.40.t:0 "Yulbars Khan prend le pouvoir !"
 bss.40.d:0 "Une nouvelle terrible ! Un complot secret réunissant des vestiges du KMT, des Ouïghours locaux et des anticommunistes a pris le contrôle du Xinjiang ! Ils préparaient un coup d'État depuis des mois et, grâce à des manœuvres habiles, ils ont pris le contrôle de toutes les institutions politiques du pays. Le président Qasim et son entourage ont fui le pays et cherchent asile à Moscou, tandis que le nouveau gouvernement dirigé par Yulbars Khan commence déjà à asseoir son autorité en procédant à des purges massives d'anciens responsables de notre gouvernement."
 bss.40.a:0 "Comment avons-nous pu ne pas s'en rendre compte ?"
 bss.41.t:0 "Un complot a été découvert !"
 bss.41.d:0 "Dernières nouvelles ! Un complot secret, mené par des vestiges du KMT, des Ouïghours locaux et des anticommunistes sous la direction de Yulbars Khan, ancien général de l'Armée nationale révolutionnaire (NRA) et dernier gouverneur du Xinjiang, visait à prendre le contrôle du Xinjiang ! Ils préparaient ce coup d'État depuis des mois, mais grâce à l'intensification de nos activités d'espionnage et au soutien du KGB, nous avons pu arrêter la plupart des conspirateurs avant qu'ils ne passent à l'action.\n\nCette opération a sans aucun doute été organisée par le gouvernement de Nanjing et montre clairement qu'il refuse de reconnaître la légitimité de notre régime. De nombreux responsables de notre gouvernement et du KGB suggèrent que nous devrions investir davantage dans nos agences de renseignement et nos efforts d'espionnage si nous voulons éviter que cela ne se reproduise."
 bss.41.a:0 "Ça aurait pu mal tourner."
 bss.42.t:0 "[GetNewspaperHeader]Coup d'État du Kuomintang au Xinjiang"
 bss.42.d:0 "Aujourd'hui, un millier de soldats nationalistes, sous les ordres de l'ancien général et gouverneur Yulbars Khan, ont lancé un coup d'État contre le régime de Qasim dans l'ancienne République du Turkestan oriental. Des troupes de l'armée et des forces paramilitaires ont été déployées dans toute la ville de Yining ; l'aéroport est fermé et les vols internationaux sont suspendus. Selon certaines informations, la République de Chine serait à l'origine de ce coup d'État et aurait soutenu les forces séparatistes et attisé la dissidence au Xinjiang depuis des mois.\nÀ l'heure actuelle, l'influence soviétique au Xinjiang est au plus bas, mais Moscou n'a pour l'instant manifesté aucune réaction face à ces récents événements."
 bss.42.a:0 "Inquiétant"
 bss.43.t:0 "[GetNewspaperHeader]Échec d'un coup d'État au Xinjiang"
 bss.43.d:0 "Aujourd'hui, un millier de soldats nationalistes, sous les ordres de l'ancien général et gouverneur Yulbars Khan, ont tenté de mener un coup d'État contre le régime de Qasim dans l'ancienne République du Turkestan oriental. Cependant, le gouvernement de Yining, avec l'aide des troupes soviétiques locales et du KGB, a réussi à arrêter la plupart des conspirateurs et à neutraliser les forces nationalistes restantes au Xinjiang. Selon certaines informations, la République de Chine serait à l'origine de ce coup d'État et aurait soutenu les forces séparatistes et attisé la dissidence au Xinjiang depuis des mois.\nLes experts estiment que cela va exacerber les tensions entre l'Union soviétique et la République de Chine, mais pour l'instant, ni Moscou ni Nanjing n'ont pris de mesures significatives concernant l'issue de cet événement."
 bss.43.a:0 "Inquiétant"
 bss.44.t:0 "[GetNewspaperHeader]Nouveaux traités entre Washington et Nankin"
 bss.44.d:0 "Aujourd'hui, le Congrès américain a adopté la loi sur les relations avec Nanjing de [GetYear], qui renforce les liens entre les États-Unis d'Amérique et la République de Chine. Cette loi vise à étendre la coopération militaire et industrielle entre les deux pays ainsi qu'avec les autres membres de l'OTASE. Le gouvernement de Nanjing espère que ce traité apportera protection et solidarité face aux menaces socialistes dans la région. Le président [CHI.GetLeader] a annoncé lors d'un discours public à Nanjing que cette coopération profiterait non seulement aux capacités militaires de la République, mais contribuerait également à la paix et à la prospérité dans tout le pays. L'URSS ainsi que ses alliés ont déjà critiqué cette loi, la qualifiant de menace pour la stabilité et la paix en Asie de l'Est, et prévoient déjà de renforcer leurs frontières dans la région."
 bss.44.a:0 "Intéressant"
 bss.45.t:0 "La situation au Vietnam"
 bss.45.d:0 "À la suite de la première guerre d'Indochine, la France a été contrainte de quitter le continent, ce qui a conduit à l'indépendance du Laos et du Cambodge ainsi qu'à la division du Vietnam. Cependant, les espoirs de réunification se sont évanouis après que le gouvernement sud-vietnamien dirigé par Ngô Đình Diệm eut rejeté les accords de Genève de 1955. À l'heure actuelle, le gouvernement sud-vietnamien est confronté à diverses rébellions dans le pays, notamment celle du Front de libération nationale, qui vise la réunification avec le Nord sous un gouvernement marxiste. Si nous ne voulons pas que le communisme se propage en Asie de l'Est, nous devons aider Saigon dans sa lutte contre ses ennemis."
 bss.45.a:0 "Bien noté."
 bss.46.t:0 "Nanjing envoie du matériel"
 bss.46.d:0 "Le gouvernement chinois à Nanjing nous a envoyé plusieurs livraisons d'armes et d'équipements afin d'aider notre armée à faire face à toute menace socialiste."
 bss.46.a:0 "Aux canons !"
 bss.47.t:0 "Hu Lien arrive à Saigon"
 bss.47.d:0 "Hu Lien, général au sein de la République de Chine (ROCA), est arrivé aujourd’hui à Saigon pour prendre ses fonctions de nouvel ambassadeur de Chine dans notre pays. Ayant servi lors de l’Expédition du Nord, des campagnes d’encerclement, de la guerre contre le Japon et de la guerre civile, il apporte une expérience considérable du combat en terrain difficile et dans des zones mal approvisionnées. [CHI.GetLeader] lui a également confié la mission de conseiller notre état-major et de mettre au point de nouvelles tactiques contre les insurrections de guérilla dans notre pays."
 bss.47.a:0 "Bienvenue !"
 bss.48.t:0 "Aborder la guerre du Vietnam"
 bss.48.d:0 "Bien que nous ayons apporté un soutien considérable au gouvernement sud-vietnamien, il est clair qu’il ne pourra pas tenir beaucoup plus longtemps tout seul. De nombreux anticommunistes purs et durs au sein de notre gouvernement suggèrent que nous envahissions directement le régime socialiste de Hanoï pour mettre fin à ce conflit une fois pour toutes.\nCependant, notre état-major craint fortement qu'une intervention directe ne provoque une réaction négative à Moscou et, compte tenu de notre situation géopolitique, nous devrions l'éviter à tout prix. Peut-être pouvons-nous trouver un compromis ?"
 bss.48.a:0 "Intervention limitée"
 bss.48.b:0 "Déclarer la neutralité"
 bss.48.c:0 "Si nous voulons gagner cette guerre contre le communisme, menons-la ici autant qu’au Vietnam"
 bss.49.t:0 "La République de Chine prévoit d'envahir le Nord"
 bss.49.d:0 "Nous avons reçu aujourd’hui un télégramme de [CHI.GetLeader] lui-même, indiquant que la ROCA est prête et s’apprête à envahir le régime marxiste du Nord afin de rétablir l’ordre au Vietnam une fois pour toutes. Nanjing nous propose de rejoindre leur faction afin de renforcer notre coopération et notre communication, dans le but d’assurer le succès de cette invasion."
 bss.49.a:0 "On est partants !"
 bss.50.t:0 "Saigon soutient l'invasion"
 bss.50.d:0 "Le gouvernement de Saigon a déclaré qu'il soutiendrait notre armée lors de la prochaine invasion du Nord et a accepté de rejoindre notre alliance afin de renforcer la coopération militaire."
 bss.50.a:0 "Prochaine étape : Hanoï !"
 bss.52.t:0 "La situation en Corée"
 bss.52.d:0 "Tout comme nous, la Corée s'est retrouvée divisée à l'issue d'une longue et sanglante guerre civile. La péninsule reste divisée, le régime marxiste de Kim Il-sung contrôlant le Nord et le régime anticommuniste le Sud. Il ne fait aucun doute que le Nord pourrait tenter d'attaquer le Sud à tout moment avec l'aide du PCC et de l'Union soviétique. Si nous ne voulons pas que le socialisme s'empare de toute la péninsule, nous devons intervenir et soutenir la Corée du Sud."
 bss.52.a:0 "Bien noté."
 bss.53.t:0 "[GetNewspaperHeader]L'invasion chinoise du Vietnam"
 bss.53.d:0 "Les espoirs de stabilité et de paix en Indochine ont une nouvelle fois été anéantis. Hier, les forces armées de la République de Chine ont franchi la frontière vietnamienne en coopération avec le gouvernement sud-vietnamien. Le gouvernement chinois a justifié cette invasion comme étant « une mesure nécessaire pour garantir la paix et la stabilité au Vietnam » et vise à renverser le régime marxiste de Hanoï et à aider Saigon à écraser toute rébellion socialiste dans la région. L'invasion a été vivement critiquée par l'URSS, qui avait prévu de porter cette question devant l'ONU mais a finalement échoué en raison de la sympathie des pays occidentaux pour cette invasion."
 bss.53.a:0 "L'Indochine connaîtra-t-elle un jour la paix ?"
 bss.54.t:0 "Résoudre la question coréenne"
 bss.54.d:0 "Bien que nous ayons apporté un soutien considérable au gouvernement sud-coréen, il est clair qu’une réunification sans la conquête du Nord n’est pas possible. De nombreux anticommunistes purs et durs au sein de notre gouvernement suggèrent que nous envahissions directement le régime socialiste de Pyongyang et que nous unissions la péninsule une fois pour toutes.\nCependant, notre état-major craint fortement qu'une intervention directe ne provoque une réaction négative à Moscou et, compte tenu de notre situation géopolitique, nous devrions l'éviter à tout prix. Peut-être pouvons-nous trouver un compromis ?"
 bss.54.a:0 "Nous soutiendrons Séoul en cas de conflit défensif"
 bss.54.b:0 "Déclarer la neutralité"
 bss.54.c:0 "Nous allons marcher sur Pyongyang !"
 bss.55.t:0 "Une délégation de Nanjing"
 bss.55.d:0 "Une délégation du gouvernement de la République de Chine est arrivée aujourd’hui à Séoul. Nanjing nous propose de nous rallier à son camp pour des raisons de défense et d’économie. Cette offre nous offrirait une meilleure protection contre d’éventuelles attaques dans la région et garantirait la croissance économique, mais elle conduirait à terme à un renforcement de l’influence chinoise non seulement sur notre économie, mais aussi sur notre gouvernement.\n\nComment devons-nous réagir ?"
 bss.55.a:0 "Nous acceptons leur offre."
 bss.55.b:0 "Refuser."
 bss.551.t:0 "Une délégation de Nanjing"
 bss.551.d:0 "Une délégation du gouvernement de la République de Chine est arrivée aujourd’hui à Saigon. Nanjing nous suggère de nous rallier à leur camp pour des raisons défensives et économiques. Cette proposition nous offrirait une meilleure protection contre d’éventuelles attaques dans la région et garantirait la croissance économique, mais elle conduirait à terme les Chinois à accroître leur influence non seulement sur notre économie, mais aussi sur notre gouvernement.\n\nComment devons-nous réagir ?"
 bss.551.a:0 "Nous acceptons leur offre."
 bss.551.b:0 "Demandez plutôt une garantie d'indépendance."
 bss.561.t:0 "Les Vietnamiens refusent"
 bss.561.d:0 "Bien que le gouvernement de Saigon ait apprécié notre proposition, il a fait valoir qu'une coopération militaire et économique d'une telle ampleur n'était pas nécessaire. Même s'il n'était pas prêt à se rallier à notre camp, il a toutefois demandé une garantie d'indépendance."
 bss.561.a:0 "Ça fera l'affaire."
 bss.56.t:0 "Les Coréens refusent"
 bss.56.d:0 "Bien que le gouvernement de Séoul ait apprécié notre proposition, il a estimé qu'une coopération militaire et économique d'une telle ampleur n'était pas nécessaire."
 bss.56.a:0 "Inattendu."
 bss.59.t:0 "La République de Chine prévoit d'envahir le Nord"
 bss.59.d:0 "Nous avons reçu aujourd’hui un télégramme de [CHI.GetLeader] lui-même, indiquant que la ROCA est prête et s’apprête à envahir le régime marxiste du Nord afin de rétablir l’ordre en Corée une fois pour toutes. Nanjing nous propose de rejoindre leur faction afin de renforcer notre coopération et notre communication, dans le but d’assurer le succès de cette invasion."
 bss.59.a:0 "On est partants !"
 bss.60.t:0 "Séoul soutient l'invasion"
 bss.60.d:0 "Le gouvernement de Séoul a déclaré qu'il soutiendrait notre armée lors de la prochaine invasion du Nord et a accepté de rejoindre notre alliance afin de renforcer la coopération militaire."
 bss.60.a:0 "Prochaine étape : Pyongyang !"
 bss.61.t:0 "[GetNewspaperHeader]La deuxième guerre de Corée"
 bss.61.d:0 "Au lendemain de la guerre de Corée, les espoirs de réunification des deux Corées ont été anéantis, mais les événements récents pourraient bien changer la donne. En collaboration avec la République de Chine, le gouvernement sud-coréen a lancé une invasion à grande échelle contre la Corée du Nord, dans l'espoir de réunifier la péninsule une fois pour toutes. L'Union soviétique et ses alliés n'ont pas encore réagi à cette invasion, mais les experts estiment que ce conflit pourrait facilement s'intensifier si l'Armée populaire coréenne ne parvenait pas à tenir le coup."
 bss.61.a:0 "Encore un."
 bss.62.t:0 "Le 9e Congrès national du Kuomintang"
 bss.62.d:0 "Aujourd’hui, les membres du Comité exécutif central se sont réunis à Nanjing pour discuter de l’avenir du parti. Il a été convenu que le Kuomintang s’était éloigné de ses principes depuis le décès du Dr Sun Yat-sen et qu’il était devenu un parti représentant les propriétaires terriens et la classe supérieure, et non plus le peuple. La corruption, l'opportunisme, la cupidité et le militarisme ont dominé le parti ces dernières années, tandis que celui-ci n'a pas su fonctionner comme une entité unie et séduire le peuple.\nLe Comité a décidé de mettre en place des réformes constitutionnelles et internes afin de ramener le Kuomintang à ce qu'il était autrefois, un parti révolutionnaire, afin qu'il puisse remplir son rôle de guide auprès du peuple chinois."
 bss.62.a:0 "Pour un avenir meilleur."
 bss.63.t:0 "La chute du YLTPP"
 bss.63.d:0 "Au lendemain de la Seconde Guerre mondiale, la Société des Chemises bleues, d'obédience fasciste, a subi des pressions politiques qui ont finalement conduit à sa dissolution officielle en 1945. Cependant, de nombreux anciens membres ont rejoint soit le Kuomintang, soit la Ligue de la jeunesse des Trois principes du peuple (YLTPP) nouvellement fondée, tout en conservant leur influence au sein du Bureau des enquêtes et des statistiques. Nous ne pouvons pas permettre à ces personnes d'occuper des postes élevés au sein de notre gouvernement, car elles ne se rallient pas aux nouvelles politiques de notre parti. Si nous voulons véritablement réformer le Kuomintang, nous devons les exclure du parti."
 bss.63.a:0 "Autant en emporte le vent."
 bss.64.t:0 "Une rencontre avec Li Zongren"
 bss.64.d:0 "« Je me souviens de mon passage au Tongmenghui. À l’époque, je ne comprenais guère la vision du Dr Sun en matière de réforme et de réunification nationale, mais avec le recul, après des années de conflits internes et de guerre contre l’impérialisme, son dévouement et sa volonté de sauver notre pays étaient remarquables. »\n\nLi Zongren est l’un des rares derniers membres encore en vie du Tongmenghui, une société secrète fondée par Sun Yat-sen et Song Jiaoren en 1905. Alliant nationalisme, républicanisme et socialisme, l’organisation avait pour objectif d’expulser les Mandchous de Chine, d’unifier le pays et d’établir une république où la terre serait répartie équitablement entre le peuple. Ces « Trois principes du peuple » originaux ont été négligés par le Kuomintang après la mort tragique de Sun Yat-sen en 1925.\n\n« Il est regrettable que le parti ait négligé la vision du Dr Sun après avoir pris la tête du pays, mais les récents développements au sein du parti me donnent l’espoir que nous pourrions revenir à nos racines et atteindre les objectifs des figures révolutionnaires qui se sont battues pour la liberté et la souveraineté de notre pays. »"
 bss.64.a:0 "La Chine est numéro un !"
 bss.65.t:0 "Comprendre le concept de « minzu »"
 bss.65.d:0 "Que signifie « Minzu » ? La signification moderne du terme « Minzu » remonte à la Révolution de Xinhai et constituait l’un des principes fondateurs de la République au début de la période républicaine. Le début du XXe siècle a allumé la flamme du nationalisme chinois, le rêve d'une communauté chinoise unifiée contre l'asservissement étranger et l'impérialisme, que le Dr Sun a décrit comme l'unification de toutes les nationalités chinoises, afin de faire du pays une nation avancée et moderne, et non pour satisfaire des rêves chauvins han. Nous devons ancrer ce principe plus profondément dans notre nouvelle constitution afin que les Mongols, les Hans, les Mandchous, les Huis, les Tibétains et toutes les autres nationalités bénéficient de droits égaux et créent la communauté chinoise unie dont nous rêvons."
 bss.65.a:0 "Cinq courses sous une même bannière."
 bss.66.t:0 "Tensions au sein du parti"
 bss.66.d:0 "Depuis quelques mois, l'optimisme et l'espoir règnent au sein du Comité exécutif central. Il est clair que le parti est en train de mener les réformes dont il avait tant besoin, mais les appels à un changement de direction se font de plus en plus pressants. Le président [CHI.GetLeader], qui n'est aligné sur aucune faction du parti, a appelé à la tenue d'une élection interne à la présidence afin de décider de l'avenir du Kuomintang. Chaque membre du Kuomintang sera autorisé à voter lors de cette élection très spéciale. Si toutes les factions partagent la philosophie fondamentale des « Trois principes du peuple », les trois factions les plus influentes prônent chacune de se concentrer sur un principe spécifique.\nL'aile droite, également connue sous le nom de « faction Minzu », soutient une politique axée sur l'intégration nationale, la culture et la tradition, avec pour objectif l'unification du peuple chinois afin de faire front commun contre l'impérialisme étranger et le marxisme. L'aile gauche, également connue sous le nom de « faction Minsheng », prône des réformes sociales à l'échelle nationale et recherche la détente et la paix avec nos voisins. L'aile progressiste, également connue sous le nom de « faction Minquan », prône l'extension des droits civils ainsi que la participation économique et politique, l'individualisme et une attitude amicale envers les pays capitalistes occidentaux. »\n\nLes tensions restent vives au sein du Comité, car cette élection très particulière va changer l'avenir de la République chinoise."
 bss.66.a:0 "Nous envisageons l'avenir avec optimisme."
 bss.67.t:0 "Les premières élections internes au parti"
 bss.67.d:0 "Le jour est enfin venu. Des centaines de milliers de membres du parti vont voter pour décider de l'avenir du Kuomintang et de la République. Au terme d'une campagne électorale acharnée et serrée, la faction qui l'emporte est..."
 bss.67.a:0 "La faction Minzu !"
 bss.67.b:0 "La faction Minsheng !"
 bss.67.c:0 "La faction Minquan !"
 bss.68.t:0 "Le fléau de la nation"
 bss.68.d:0 "« Devenez fonctionnaire et faites fortune. »\n\nCe vieil adage chinois est devenu la norme depuis la mise en place du système des examens par les dynasties Tang et Song, il y a plus de mille ans. Il permettait à une poignée de citoyens issus des classes supérieures de gouverner la majorité de la population. Également connue sous le nom de « gentry », cette classe d'élite de la société chinoise occupait des postes importants dans l'administration et l'armée, et était chargée de la perception des impôts et de l'administration des forces armées locales dans les différentes provinces.\n\nAprès la révolution de 1911, ce concept a perduré de manière plus intense pendant la période des seigneurs de la guerre, au cours de laquelle divers généraux et gouverneurs militaires ont déclaré leur indépendance vis-à-vis du gouvernement central de Pékin, en s'appuyant sur les forces armées locales. L'ancien principe de hiérarchie despotique a perduré et s'est même maintenu en vie entre 1927 et 1952 au sein du Kuomintang. L'exploitation, le capitalisme bureaucratique, l'opportunisme, le blanchiment d'argent, la contrebande d'opium, tout cela a contribué au déclin de la Chine à l'ère moderne.\n\nIl n'est pas facile de laisser derrière soi des valeurs millénaires, mais c'est une étape nécessaire pour faire entrer le pays dans l'ère moderne. Les populations locales doivent se gouverner elles-mêmes et ne doivent pas être exploitées par des tyrans despotiques."
 bss.68.a:0 "La modernisation est inévitable."
 bss.69.t:0 "La reconstruction de l'Académie de Whampoa"
 bss.69.d:0 "L'Académie de Whampoa a été la plus importante académie militaire au début de la République nationale. Sous la direction de Tchang Kaï-chek, elle a formé de nombreux commandants brillants qui ont fait leurs preuves lors de la guerre de résistance contre le Japon et de la guerre civile contre le PCC. C'est même là que notre hymne national, « San Min Chu-I », a été joué pour la première fois. Pendant la seconde guerre sino-japonaise, elle a été détruite à Huangpu par les bombardiers japonais. Des années de guerre civile et de conflits internes ont retardé nos efforts de reconstruction, mais l'heure est venue de reconstruire l'académie si nous voulons maintenir une armée hautement professionnelle qui nous protégera des menaces impérialistes et marxistes."
 bss.69.a:0 "Renaître de ses cendres"
 bss.70.t:0 "Une belle journée à Cuiheng"
 bss.70.d:0 "Cuiheng occupe une place particulière dans le cœur de tous les membres du Kuomintang, car c'est là que naquit Sun Yat-sen, le Père de la Nation. Le Comité exécutif central du Kuomintang a décidé d'y établir le siège du nouveau « Syndicat Minsheng ». Cette décision a été prise en raison de la valeur symbolique de ce lieu et de sa proximité avec les zones rurales du Guangdong, afin de toucher le peuple. Diverses structures seront mises en place à travers le pays. Il ne faut pas confondre ce syndicat avec les « syndicats » totalitaires des pays marxistes despotiques d’Europe et d’Asie de l’Est, qui sont utilisés pour rééduquer et endoctriner le peuple conformément aux politiques gouvernementales. Notre objectif est de créer un syndicat pour l’homme ordinaire, qui pourra enfin faire entendre sa voix sur son lieu de travail et ne sera plus brutalement exploité par ses supérieurs. Le droit de grève fera partie intégrante de notre nouvelle république ; après tout, ce sont les travailleurs et les paysans chinois ordinaires qui représentent la majorité de la nation, et non les propriétaires terriens et les industriels."
 bss.70.a:0 "C'est vraiment un endroit magique."
 bss.71.t:0 "La méthode de la carotte et du bâton"
 bss.71.d:0 "À la fin du XIXe siècle, le chancelier de fer allemand Otto von Bismarck a adopté le principe du « Zuckerbrot und Peitsche » (la carotte et le bâton) pour faire face aux mouvements socialistes et sociaux-démocrates en Allemagne. La carotte prenait la forme d’avantages sociaux, notamment les assurances qui ont bouleversé à jamais les politiques sociales à l’échelle mondiale, tandis que le bâton symbolisait la répression et l’interdiction des organisations socialistes.\n\nBien que cette approche ne se soit pas avérée aussi efficace qu'espéré en Allemagne, nous devrions en adopter l'essence même et accorder des concessions aux paysans ordinaires tout en punissant les vestiges maoïstes dans notre pays afin d'arrêter la propagation du communisme dans la République et de le rendre peu attrayant."
 bss.71.a:0 "Ils finiront bien par en tirer la leçon."
 bss.72.t:0 "Le nouveau Yuan législatif"
 bss.72.d:0 "Afin de montrer au monde et aux libéraux chinois que notre République est une véritable démocratie, le président [CHI.GetLeader] a convoqué de nouvelles élections pour le Yuan législatif. Cependant, en raison de la menace maoïste qui reste relativement élevée dans notre pays, les seuls partis éligibles seront le Kuomintang, le Parti de la Jeune Chine (pro-Kuomintang) et le Parti socialiste démocratique chinois. Cela suffira néanmoins à apaiser les voix libérales dans notre pays et montrera au monde que nous sommes aussi démocratiques que n'importe quelle autre démocratie occidentale."
 bss.72.a:0 "Comme prévu, le Kuomintang remporte la majorité."
 bss.73.t:0 "Élection du vice-président"
 bss.73.d:0 "Il semble que la faction réformiste au sein de notre gouvernement n'ait pas été satisfaite des récents résultats des élections au Yuan législatif. De nombreuses voix se sont élevées pour dénoncer des fraudes électorales et des cas de corruption, ainsi que la répression exercée à l'encontre des partis libéraux indépendants. Cependant, ce que nous pourrions faire, c'est organiser une élection nationale à la vice-présidence. Ce poste est relativement moins influent que ceux de président et de Premier ministre, mais il pourrait tout de même nous apporter une certaine légitimité démocratique.\n\nLe premier choix se porte sur Sun Fo, l'actuel président du Yuan d'examen et fils du Dr Sun. Il est également connu pour son « caractère bien trempé », c'est-à-dire pour ses positions libérales sans concession contre les mesures autoritaires de Tchang Kaï-chek. En tant que partisan du constitutionnalisme et du nationalisme chinois, Sun Fo prône des réformes favorisant les institutions constitutionnelles et la réunification pacifique avec le Parti communiste. Bien que cela soit totalement inacceptable au regard de nos politiques, nous ne pouvons pas l'écarter en raison de son statut de fils du père de la République, ce qui lui confère également une grande popularité auprès du peuple.\n\nSoutenu par Tchang Kaï-chek et ses alliés, Chen Cheng est l'autre candidat favori. Chen a occupé le poste de commandant en chef de l'Armée nationale révolutionnaire (NRA) pendant l'Expédition du Nord, les campagnes anticommunistes, la seconde guerre sino-japonaise et la guerre civile contre le PCC. À la fin de la guerre civile, il a été nommé gouverneur de la province de Taïwan, où il a déclaré la loi martiale afin d'établir un bastion nationaliste solide sur l'île au cas où l'armée nationaliste serait vaincue sur le continent. Tout en étant un anticommuniste convaincu et un partisan des politiques de Tchang Kaï-chek, il prône la libéralisation économique et la réforme agraire afin d'apaiser les tensions entre les paysans et le gouvernement, mais cherche également à établir une coopération étroite avec les États-Unis pour en faire un rempart contre le socialisme."
 bss.73.a:0 "Sun Fo poursuivra l'œuvre de son père."
 bss.73.b:0 "Chen Cheng veillera à la sécurité de la République."
 bss.74.t:0 "[GetNewspaperHeader]Chen Cheng élu vice-président de la République de Chine"
 bss.74.d:0 "À la suite des récentes élections au Yuan législatif, les élections à la vice-présidence ont eu lieu aujourd’hui en République de Chine. Chen Cheng, ancien commandant de l’Armée nationale révolutionnaire et gouverneur de Taïwan, a prêté serment en tant que vice-président au Palais présidentiel de Nanjing. Chen a ensuite prononcé un discours dans lequel il a annoncé ses projets pour son mandat législatif. En tant que fervent anticommuniste, Chen prône le maintien de la loi martiale et d'une forte autorité militaire dans le pays, mais il a également exprimé son intérêt pour les réformes économiques, les projets de construction et la réforme agraire visant à améliorer les zones rurales en Chine. Étant donné que cette fonction est relativement faible par rapport à celle de président, on ignore pour l'instant si ses politiques seront mises en œuvre comme il l'a prévu, mais compte tenu de sa longue amitié et de sa coopération avec Chiang Kai-shek, il est très probable qu'il obtiendra son approbation."
 bss.74.a:0 "Intéressant."
 bss.75.t:0 "[GetNewspaperHeader]Sun Fo élu vice-président de la République de Chine"
 bss.75.d:0 "À la suite des récentes élections au Yuan législatif, les élections à la vice-présidence ont eu lieu aujourd’hui en République de Chine. L’ancien président du Yuan des examens, fils de Sun Yat-sen, est arrivé en tête et a prêté serment en tant que vice-président au Palais présidentiel de Nanjing. Sun était le favori des électeurs en raison de ses tendances libérales, de son soutien à la suspension de la loi martiale et de son plaidoyer en faveur d'une unification pacifique avec le PCC. Ce poste étant relativement faible par rapport à celui de président, on ignore pour l'instant si ses politiques seront mises en œuvre comme il l'avait prévu. Compte tenu notamment de sa rivalité avec Chiang Kai-shek, il est très peu probable qu'il obtienne l'approbation nécessaire."
 bss.75.a:0 "Intéressant"
 bss.76.t:0 "Une délégation de Nanjing"
 bss.76.d:0 "À la surprise générale, une délégation du gouvernement de Nanjing est arrivée aujourd’hui à la frontière de Pékin, sous la direction de Sun Fo, fils du Dr Sun Yat-sen. Elle a déclaré vouloir prendre contact avec notre gouvernement afin de proposer un pacte de non-agression entre nos deux nations, ainsi que la libération réciproque des prisonniers de guerre de la guerre civile. Il est difficile de savoir si leurs intentions traduisent un véritable rapprochement pacifique ou s’il s’agit simplement d’une tentative de nous tromper avec quelques belles paroles. Nous devons néanmoins les aborder avec prudence."
 bss.76.a:0 "Nous acceptons leur offre… pour l'instant."
 bss.76.b:0 "Ne faites jamais confiance à la bourgeoisie."
 bss.77.t:0 "Pékin accepte notre offre !"
 bss.77.d:0 "Le gouvernement de Pékin a accepté notre offre. À l'heure actuelle, tous les prisonniers de guerre capturés par les deux camps pendant la guerre civile sont en train d'être rapatriés sur leur territoire respectif. Bien que nous continuions à nous présenter comme le seul gouvernement légitime de toute la Chine, ce traité constituait une étape nécessaire pour maintenir la paix en Asie de l'Est."
 bss.77.a:0 "Jusqu'à présent, nous n'avions aucune relation ; désormais, nous en aurons de mauvaises – et c'est déjà un progrès."
 bss.78.t:0 "Le CCP refuse notre offre !"
 bss.78.d:0 "Le gouvernement de Pékin a rejeté notre proposition, affirmant qu'il s'agissait d'une manœuvre destinée à nous faire gagner du temps pour préparer une invasion du Nord. Il semble que le PCC ne soit absolument pas intéressé par une réunification pacifique et cherche uniquement à étendre son contrôle sur l'ensemble de la Chine."
 bss.78.a:0 "Et ils prétendent être le parti du peuple..."
 bss.79.t:0 "Le Mémorial national"
 bss.79.d:0 "Les nuages masquent le soleil, le ciel se pare peu à peu de gris, mais il ne pleut pas encore.\n\nCe n’est pas la première fois que Sun Fo se rend au Mémorial de Nanjing, plus connu sous le nom de mausolée de Sun Yat-sen. Depuis la mort tragique et prématurée du Dr Sun Yat-sen, le « père de la Chine moderne », Sun Fo se rend chaque année en ce lieu si particulier. Le 12 mars 1925, non seulement une nation entière a perdu son figure de proue, mais un fils a également perdu son père bien-aimé. Mais cette visite est différente, car Zhesheng se tient désormais ici en tant que vice-président de la République de Chine, une Chine unifiée sur le papier, mais les objectifs de la Révolution chinoise n’ont toujours pas été atteints à ce jour. Devant le sarcophage de marbre, il se met à parler doucement à son père, lui promettant qu’il fera tout ce qui est en son pouvoir pour réaliser les rêves et les ambitions de la Révolution chinoise. S’ensuit un moment de silence.\n\nAlors que Sun Fo quitte le Mémorial, les nuages commencent à se dissiper et le soleil réapparaît, accompagné d’une brise qui fait flotter les drapeaux républicains qui entourent le musée."
 bss.79.a:0 "Puisse-t-elle briller pendant dix mille ans."
 bss.80.t:0 "La République de Chine propose la réunification"
 bss.80.d:0 "À la suite de la victoire du Kuomintang lors de la guerre civile chinoise, la plupart des responsables de notre gouvernement s’attendaient à ce que Nanjing apporte son soutien au régime fantoche impérialiste de Saigon. Cependant, Nanjing a décidé de s’abstenir de tout soutien militaire à Saigon et a préféré exercer son influence sur le gouvernement du Sud-Vietnam, ce qui a abouti à un coup d’État contre l’ancien régime. Le VNQDD, le Kuomintang vietnamien qui partage la philosophie des « Trois principes du peuple » du Dr Sun Yat-sen, a alors pris le pouvoir.\n\nÀ Taipei, les gouvernements chinois et sud-vietnamien, ainsi qu'une de nos délégations, ont présenté une nouvelle proposition pour la réunification pacifique du Vietnam. Le Vietnam unifié sera un État neutre en Asie du Sud-Est et sera dirigé par un gouvernement de coalition composé du Parti communiste vietnamien et du VNQDD, qui proposera un programme pour la transition pacifique vers un État libre et démocratique."
 bss.80.a:0 "C'est une piste qui mérite d'être explorée."
 bss.80.b:0 "Ce ne sont que des impérialistes déguisés."
 bss.81.t:0 "[GetNewspaperHeader]La réunification du Vietnam"
 bss.81.d:0 "Après plusieurs semaines de négociations, la Conférence de Taipei a finalement pris fin, aboutissant à la réunification pacifique du Vietnam sous un gouvernement de coalition entre le Parti communiste vietnamien et le Parti nationaliste vietnamien. Cet événement historique s'est produit à l'initiative du gouvernement chinois de Nanjing, qui a non seulement accueilli la conférence, mais a également joué un rôle important en tant que médiateur pendant les négociations. Il y a quelques semaines, l'ancien gouvernement corrompu du Sud-Vietnam a été renversé par le VNQDD, le Kuomintang vietnamien, récemment réformé, qui se présente comme un parti nationaliste mais aussi socialiste démocratique. Malgré les tensions passées, le gouvernement nord-vietnamien a salué ce changement politique à Saigon et a accepté les conditions fixées à Taipei. Le nouveau gouvernement vietnamien travaille désormais à l'élaboration d'une nouvelle constitution démocratique pour l'État vietnamien unifié."
 bss.81.a:0 "Cela signifie-t-il la paix pour l'Indochine ?"
 bss.82.t:0 "[GetNewspaperHeader]L'échec de la conférence de Taipei"
 bss.82.d:0 "Après plusieurs semaines de négociations à Taipei, la conférence prit finalement fin, entraînant le retour du gouvernement nord-vietnamien à Hanoï. Bien que l'on ait nourri de grands espoirs quant à une éventuelle négociation pacifique entre les deux Vietnam, le gouvernement nord-vietnamien rejeta la proposition faite à Taipei, qui suggérait que le Parti communiste vietnamien et le Parti nationaliste vietnamien forment un gouvernement de coalition et préparent la transition vers la démocratie. Les communistes ont critiqué le Parti nationaliste, le qualifiant de « lèche-bottes du capitalisme chinois », et ont rejeté toute coopération avec lui. Il semble que la table des négociations ait une fois de plus échoué à unifier le Vietnam."
 bss.82.a:0 "Seule l'épée peut désormais unir le pays."
 bss.83.t:0 "La République de Chine propose le NEATO"
 bss.83.d:0 "Le NEATO, acronyme de « North East Asian Treaty Organisation » (Organisation du traité de l'Asie du Nord-Est), était une proposition du secrétaire d'État John Foster Dulles, qui considérait qu'une telle alliance permettrait de contrebalancer le communisme en Asie du Nord-Est dans les années 50. Cette alliance aurait dû nous inclure, ainsi que la Corée du Sud, le Japon et la République de Chine à Taïwan. Cependant, depuis que le Kuomintang a réussi à renverser la tendance lors de la guerre civile chinoise et à s'imposer, il a proposé de relancer le projet et d'établir officiellement la NEATO en tant qu'organisation internationale afin d'empêcher la propagation du communisme dans la région."
 bss.83.a:0 "Cela arrivera."
 bss.83.b:0 "Ça ne sert à rien."
 bss.85.t:0 "Les États-Unis déclinent notre offre"
 bss.85.d:0 "Les États-Unis ont déclaré qu'ils ne soutiendraient pas l'idée d'une NEATO, étant donné qu'il s'agirait simplement d'une extension du Traité de défense mutuelle sino-américain, le Japon n'étant pas autorisé à disposer d'une armée et la Corée du Sud n'ayant pas les ressources nécessaires pour mettre sur pied une armée puissante. De plus, compte tenu de l'existence de la SEATO, ils ont affirmé qu'une autre organisation serait tout simplement inutile et causerait plus de confusion que de bienfaits."
 bss.85.a:0 "C'est compréhensible"
 bss.84.t:0 "Les États-Unis adhèrent à cette idée"
 bss.84.d:0 "Les États-Unis ont accepté notre proposition de relancer le NEATO. Ils ont déjà pris contact avec le Japon et la Corée du Sud, et la signature officielle du traité devrait avoir lieu d'ici quelques mois."
 bss.84.a:0 "Excellent."
 bss.86.t:0 "[GetNewspaperHeader]La création du NEATO"
 bss.86.d:0 "Lors d'une réunion du Conseil des ministres à Tokyo, l'Organisation du traité de l'Asie du Nord-Est (NEATO) a été officiellement créée. Alors que ce projet avait déjà été proposé par les États-Unis au début des années 50 mais avait finalement échoué, il a aujourd'hui été relancé à l'initiative de la République de Chine. L'organisation a pour objectif d'instaurer une sécurité collective face aux menaces communistes potentielles dans la région et a son siège à Nanjing, en République de Chine. Les États-Unis soutiennent cette initiative et y voient une sorte d’OTAN régionale pour l’Asie du Nord-Est. La création de cette organisation a déjà été critiquée par les États communistes de la région, qui l’ont qualifiée d’effort inutile visant à perturber la paix dans la région."
 bss.86.a:0 "NEATO ? On venait juste d'avoir le SEATO"
 KMT_70s.3.t:0 "La situation de l'armée"
 KMT_70s.3.d:0 "La lutte du Kuomintang pour le pouvoir et sa survie dépendait fortement de ses forces armées, l'ancienne Armée nationale révolutionnaire. Après la Seconde Guerre mondiale, l'ANR a été réorganisée pour devenir les Forces armées de la République de Chine, mais même après la défaite du PCC, l'armée a conservé une grande autorité au sein du pays. Formée selon le modèle soviétique par Chiang Ching-Kuo, elle privilégie la discipline et l'obéissance politique, mais elle est également à l'origine de la corruption et des réseaux d'influence. De nombreux responsables de notre gouvernement ont appelé à des efforts de dépolitisation afin de transformer les Forces armées de la République de Chine en une armée purement défensive qui ne s'impliquerait pas dans la politique chinoise, tandis que les partisans de la ligne dure soutiennent que sans forces armées puissantes, nous sommes vulnérables aux menaces extérieures."
 KMT_70s.3.a:0 "Le CCP n'existe plus, il n'y a plus lieu de le maintenir."
 KMT_70s.3.b:0 "Les partisans de la ligne dure rejettent les réformes."
 KMT_70s.1.t:0 "Décès de Tchang Kaï-chek"
 KMT_70s.1.d:0 "Le 5 avril 1975, à 23 h 50 (heure de Taipei), Tchang Kaï-chek, généralissime et président de la République de Chine, est décédé d'une crise cardiaque consécutive à une insuffisance rénale provoquée par une insuffisance cardiaque avancée et une pneumonie, à l'Hôpital général des anciens combattants de Taipei, à Taipei (Taïwan), à l'âge de 87 ans. La santé de Tchang s'était progressivement détériorée au cours des années 1970. Au moment de son décès, il n'avait plus fait d'apparition publique depuis 1972, après avoir été diagnostiqué avec une pneumonie et avoir subi une intervention chirurgicale pour une hypertrophie de la prostate. Son fils, Chiang Ching-kuo, avait également été désigné comme son successeur cette même année."
 KMT_70s.1.a:0 "Zongtong Jianggong, ton héritage perdurera !"
 KMT_80s.1.t:0 "Décès de Chiang Ching-Kuo"
 KMT_80s_1.d:0 "Le 13 janvier 1988, le président taïwanais Chiang Ching-kuo est décédé d'une crise cardiaque, mettant fin à une période de quatre décennies durant laquelle les Chinois ayant fui le continent en 1949 avaient occupé les plus hautes fonctions de cette nation insulaire. Son âge officiel était de 77 ans – bien que certains sources indiquent qu'il était plus âgé – et il occupait la présidence depuis 1978. Chiang Ching-kuo, fils et héritier politique du leader nationaliste chinois Chiang Kai-shek, est décédé dans un hôpital de Taipei, la capitale de Taïwan. Il a été remplacé par son successeur désigné, le vice-président Lee Teng-hui, âgé de 64 ans. M. Lee, économiste formé à l'université Cornell qui a été maire de Taipei et gouverneur de province, est le premier natif de Taïwan à devenir président. Des spécialistes chinois et américains de Taïwan ont exprimé hier leur inquiétude quant au fait que la mort de Chiang Ching-Kuo, qui met fin à la dynastie familiale, pourrait entraîner une instabilité sur l'île."
 KMT_80s_1.a:0 "Maître Jingguo, on se souviendra de vous !"
 KMT_Borderconflict.5.t:0 "Les bataillons soviétiques ont été anéantis"
 KMT_Borderconflict.5.d:0 "Nos troupes ont remporté une victoire décisive contre les forces de l'Armée rouge lors d'un affrontement à la frontière de la Touva. Nos forces ont ainsi pu sécuriser la Touva et libérer son peuple de la répression socialiste. C'est une grande victoire pour la République de Chine !"
 KMT_Borderconflict.5.a:0 "Youpi !"
 KMT_Borderconflict.6.t:0 "Catastrophe à la frontière de la Touva"
 KMT_Borderconflict.6.d:0 "C'est une terrible nouvelle ! Notre bataillon, qui devait tester les forces de l'Armée rouge ennemie à la frontière de la Touva, a subi une défaite cuisante à la suite d'un affrontement avec les troupes communistes. C'est un immense déshonneur pour la République de Chine."
 KMT_Borderconflict.6.a:0 "Comment cela a-t-il pu arriver ?"
 KMT_Borderconflict.8.t:0 "Les troupes du KMT remportent une victoire à la frontière"
 KMT_Borderconflict.8.d:0 "Aujourd'hui, un bataillon du gouvernement du Kuomintang a lancé une attaque surprise contre notre patrouille frontalière à Tuva. Nos forces ont été submergées et ont dû battre en retraite pour se ravitailler. Les troupes du KMT ont franchi la frontière et occupent désormais Tuva. C'est une défaite cuisante pour l'Armée rouge."
 KMT_Borderconflict.8.a:0 "Terrible !"
 KMT_Borderconflict.7.t:0 "Les troupes du KMT ont été vaincues par une patrouille de l'Armée rouge"
 KMT_Borderconflict.7.d:0 "Aujourd’hui, un bataillon de l’armée du gouvernement du Kuomintang a lancé une attaque surprise contre notre patrouille frontalière à Tuva. Nos forces ont d’abord été débordées, mais elles ont ensuite pris l’avantage grâce au soutien des milices de guérilla en Mongolie et ont contraint les troupes du KMT à battre en retraite pour se ravitailler. Il s’agit d’une grande victoire pour l’Armée rouge, qui a démontré que l’armée du Kuomintang n’est pas invincible."
 KMT_Borderconflict.7.a:0 "Parfait !"
 KMT_Borderconflict.9.t:0 "Les bataillons indiens ont été anéantis"
 KMT_Borderconflict.9.d:0 "Nos troupes ont remporté une victoire décisive contre les forces indiennes lors d'un affrontement à la frontière de Tawang. Nos forces ont pu sécuriser Tawang et libérer sa population de l'oppression indienne. C'est une grande victoire pour la République de Chine !"
 KMT_Borderconflict.9.a:0 "Youpi !"
 KMT_Borderconflict.10.t:0 "Catastrophe à la frontière de Tawang"
 KMT_Borderconflict.10.d:0 "C'est une terrible nouvelle ! Notre bataillon, qui devait tester les forces indiennes ennemies à la frontière de Tawang, a subi une défaite cuisante à la suite d'un accrochage avec les troupes indiennes. C'est un immense déshonneur pour la République de Chine."
 KMT_Borderconflict.10.a:0 "Comment cela a-t-il pu arriver ?"
 KMT_Borderconflict.12.t:0 "Les troupes du KMT remportent une victoire à la frontière"
 KMT_Borderconflict.12.d:0 "Aujourd'hui, un bataillon du gouvernement du Kuomintang a lancé une attaque surprise contre notre patrouille frontalière à Tawang. Nos forces ont été submergées et ont dû battre en retraite pour se ravitailler. Les troupes du KMT ont franchi la frontière et occupent désormais Tawang. C'est une défaite dévastatrice pour notre pays."
 KMT_Borderconflict.12.a:0 "Terrible !"
 KMT_Borderconflict.11.t:0 "Les troupes du KMT ont été vaincues par une patrouille indienne"
 KMT_Borderconflict.11.d:0 "Aujourd'hui, un bataillon du gouvernement du Kuomintang a lancé une attaque surprise contre notre patrouille frontalière à Tawang. Nos forces ont d'abord été débordées, mais elles ont ensuite pris l'avantage grâce au soutien des milices de guérilla au Tibet et ont contraint les troupes du KMT à battre en retraite pour se ravitailler. Il s'agit d'une grande victoire pour l'armée indienne, qui a démontré que l'armée du Kuomintang n'est pas invincible."
 KMT_Borderconflict.11.a:0 "Parfait !"
