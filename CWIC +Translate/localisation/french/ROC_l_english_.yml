 POLITICS_MA_JIYUAN_50s_WARLORDS_DESC:0 "§gMa Jiyuan est né à l'époque du gouvernement de Beiyang. Fils unique de Ma Bufang, il rejoignit plus tard l'Armée nationale révolutionnaire (NRA) pendant la guerre contre le Japon. Au cours de la guerre civile, le jeune Ma se forgea une réputation dans le nord-ouest en menant, aux côtés de Hu Zongnan, une campagne victorieuse qui permit de vaincre 120 000 soldats communistes dans les dernières phases du conflit. Après notre victoire dans la guerre civile, Ma Jiyuan s'est rapproché du gouvernement central et, contrairement à son père Ma Bufang, il a autorisé la mise en œuvre dans le nord-ouest des réformes adoptées à Nankin. Ma Jiyuan a ensuite été nommé gouverneur du Nord-Ouest, tandis que son père était envoyé en Arabie saoudite en tant qu'ambassadeur pour représenter la Chine.§!"
 POLITICS_LI_ZONGREN_WARLORD_50s_DESC:0 "§gLi Zongren est né dans la province du Guangxi en 1890 et s'est très tôt engagé dans la vie politique et militaire. En 1924, Li devint la figure de proue de la faction du « Nouveau Guangxi » et apporta son soutien au Kuomintang lors de la campagne du Nord. Cette alliance fut toutefois de courte durée, car il fut exclu du Kuomintang et combattit Tchang Kaï-chek lors de la guerre des Plaines centrales de 1930.\n\nIl finit par rejoindre le Kuomintang afin de repousser l'invasion japonaise, mais continua à s'opposer à Tchang Kaï-chek et à le critiquer. En janvier 1949, après la démission de Tchang Kaï-chek de son poste de président, Li Zongren devint président par intérim de la Chine ; toutefois, il n'exerça jamais de pouvoir réel et fut démis de ses fonctions lorsque Tchang Kaï-chek reprit ses fonctions après la victoire du Kuomintang lors de la guerre civile chinoise.§!\n\n§CExplication de la Clique : §!\n\n§gLa nouvelle clique du Guangxi, dirigée par Li Zongren, Huang Shaohong et Bai Chongxi, est l'une des cliques de seigneurs de la guerre les plus influentes de Chine et a toujours entretenu des relations tendues avec le gouvernement central de Nankin. Chiang Kai-Shek tenta à plusieurs reprises de réorganiser les armées des seigneurs de guerre du Guangxi, ce qui finit par pousser la clique du Guangxi à rompre ses relations avec le gouvernement central, déclenchant ainsi la confrontation qui conduisit à la guerre des Plaines centrales. De 1930 à 1936, la clique a organisé la reconstruction du Guangxi, qui est devenu une province « modèle » dotée d'une administration progressiste. En conséquence, le Guangxi a pu fournir un grand nombre de soldats pour l'effort de guerre contre le Japon lors de la seconde guerre sino-japonaise, ce qui lui a conféré un statut important parmi les provinces du sud de la Chine.§!"
 POLITICS_CHIANG_ARMY_ROC_VICTORY_50s_DESC:0 "§gSuite à la victoire du Kuomintang sur le Parti communiste, l'autorité et le statut de Tchang Kaï-chek au sein du parti se sont une nouvelle fois renforcés, ne lui laissant aucune opposition sérieuse à Nankin. Cependant, des obstacles subsistent sur la voie qui lui permettra de consolider le pouvoir du Kuomintang sur l'ensemble de la Chine. Des seigneurs de guerre et diverses autres factions politiques règnent sur des régions importantes de la Chine, ce qui pourrait constituer une menace sérieuse pour les dirigeants nationaux à Nankin. Chiang a exprimé à plusieurs reprises au fil des ans son désir de réformer le Kuomintang, et avec le retour progressif de la paix et de l'ordre civil en Chine, il pourrait bien parvenir à atteindre ses objectifs.§!\n\n§CExplication des cliques :§!\n\n§gAprès la défaite des cliques de Beiyang à Zhili et à Nanjing, le Kuomintang a transféré son quartier général à Nanjing, la proclamant nouvelle capitale de la République. Au fil du temps, le Kuomintang a consolidé son autorité dans les provinces de Chine centrale. Le gouvernement de Nanjing est l'institution politique dominante dans ces provinces et a efficacement écarté tous ses rivaux politiques, qu'il s'agisse d'anciens seigneurs de guerre locaux ou de cliques politiques opposées. La centralisation a conduit à une diminution de la corruption et à une gouvernance plus efficace dans ces régions, qui sont considérées comme le « territoire central » du régime du Kuomintang, le KMT cherchant également à étendre son influence dans les autres régions de Chine.§!"
 POLITICS_DING_DELONG_50s_WARLORDS_DESC:0 "§gDing Delong est né dans la province du Hunan à la fin de la dynastie Qing. À l’âge de 20 ans, il s’est inscrit dans une académie militaire qui a ensuite fusionné pour devenir l’Académie militaire de Whampoa. En 1931, Ding a rejoint l’Armée nationale révolutionnaire (NRA) et a mené une campagne près du Hunan contre les seigneurs de guerre locaux et les forces communistes. Pendant la guerre contre le Japon, Ding a combattu à Shanghai, dans la province du Henan et dans la ville de Wuhan. Vers la fin de la guerre contre le Japon, Ding fut promu lieutenant-général et mena des campagnes contre les partisans communistes dans le Hunan. Lorsque Cheng Qian et ses partisans choisirent de faire défection au profit du Parti communiste, Ding fut l'un des rares Hunanais à ne pas les suivre et fut nommé gouverneur de sa province natale après la fin de la guerre civile. Bien que sa loyauté envers Nankin puisse être remise en question, car il s'est montré uniquement soucieux du bien-être de sa province§!"
 POLITICS_SUN_DU_50s_WARLORDS_DESC:0 "§gLe général Sun Du rejoignit pour la première fois la faction du Yunnan dirigée par Cai E en 1915. En 1922, Sun Du fut personnellement promu par Tang Jiyao. À la suite de cette promotion, Sun Du et ses forces se déplacèrent vers le Guizhou et le Sichuan, où ils combattirent les seigneurs de guerre voisins, avant de revenir au Yunnan en 1924, où il fut promu commandant de la police militaire provinciale du Yunnan et de l'Administration générale du tabac et des alcools du Yunnan. À la suite du coup d'État contre Tang Jiyao, qui a conduit ce dernier à abdiquer son titre de gouverneur et à mourir quelques mois plus tard, une guerre civile a éclaté au Yunnan entre Long Yun et d'autres factions. Pendant la guerre civile du Yunnan, Sun Du décida d'adopter une position neutre et attendit que la guerre se termine, bien qu'il eût des sympathies pour Long Yun. Lorsque la guerre civile du Yunnan se solda par la victoire de Long Yun, Sun fut nommé bras droit de Long Yun. Sous les ordres de Long, Sun adopta une ligne anticommuniste et mena ses armées contre les forces communistes en fuite pendant la Longue Marche, ce qui lui valut les éloges de la clique. Pendant la guerre contre le Japon, Sun conduisit ses troupes dans la province du Jiangxi pour combattre l'armée japonaise. Vers la fin de la guerre contre le Japon, Sun se détacha de Long Yun, qui fut par la suite remplacé par Lu Han, et rejoignit les forces de Tchang Kaï-chek. Pendant la guerre civile chinoise, Lu Han et d'autres généraux ont fait défection, et Sun fut l'un des rares à choisir de ne pas faire défection mais de rester fidèle à la République. À la fin de la guerre civile, Sun fut nommé gouverneur de sa province natale. Bien que sa loyauté envers Nankin puisse être remise en question, car il s'est montré uniquement soucieux de sa province, à l'instar de la manière dont les seigneurs de guerre précédents gouvernaient le Yunnan.§!"
 POLITICS_HUANG_SHAOHONG_50s_WARLORDS_DESC:0 "§g§!"
 POLITICS_YAN_XISHAN_WARLORD_50s_DESC:0 "§gNé dans la province du Shanxi en 1883, Yan Xishan commença très jeune à étudier les classiques confucéens avant d'intégrer l'académie militaire de Taiyuan, dans le Shanxi. Yan, aux côtés d'autres jeunes talents prometteurs, fut envoyé étudier à Tokyo, où il fut fasciné par les efforts d'occidentalisation menés par le Japon, convaincu que la Chine devait prendre des mesures similaires pour ne pas se laisser distancer sur la scène internationale. Après le déclenchement de la révolution de Xinhai, il est retourné en Chine et a rejoint la lutte contre la dynastie Qing, avant de consolider son pouvoir en tant que gouverneur du Shanxi après la mort de Yuan Shikai. Pendant la Seconde Guerre mondiale, il a servi comme commandant dans le Shanxi contre les Japonais, mais a secrètement intensifié ses opérations contre le mouvement communiste local. Après avoir joué un rôle de médiateur en tant que Premier ministre pendant la guerre civile, Yan a repris son poste de gouverneur dans le Shanxi.§!\n\n§CExplication de la Clique : §!\n\n§gLe Shanxi s'est séparé de l'Armée de Beiyang après la révolution de Xinhai, sous la direction de Yan Xishan, et a adopté une position neutre afin d'éviter toute implication dans des conflits militaires. Le Shanxi a connu de grandes améliorations dans les domaines de l'éducation, de l'aide sociale et des soins de santé dans les années 1920, jusqu'à ce que Yan décide de rejoindre le KMT dans sa croisade contre la clique de Fengtian en 1927. Pendant l'occupation japonaise, la clique du Shanxi a été fortement affaiblie, ce qui a conduit à une brève occupation communiste de 1946 à 1949. Avec le retour au pouvoir du Kuomintang, on peut supposer sans risque que Nanjing cherche à intégrer correctement l'ancienne clique autonome au sein de la République.§!"
 POLITICS_MA_BUFANG_WARLORD_50s_DESC:0 "§gMa Bufang est né en 1903 dans le Gansu ; il était le fils de Ma Qi, fondateur de l'Armée musulmane du Ningxia du Qinghai au lendemain de la Révolution de Xinhai. Ma s'est rallié à Tchang Kaï-chek et au Kuomintang après le succès de la Campagne du Nord. La position farouchement anticommuniste de Ma et sa loyauté envers le Kuomintang ont été démontrées à maintes reprises, comme en témoignent ses opérations militaires contre les communistes au début des années 1930 et son refus de multiples offres de défection japonaises. Sa loyauté inconditionnelle envers le Kuomintang, bien qu'il soit de confession hui, a fait de lui l'un des proches de confiance de Tchang Kaï-chek. En 1945, Bufang a été nommé au comité central du Kuomintang et a mené avec succès la lutte contre les Ouïghours insurgés, en plus de combattre le Parti communiste chinois pendant la guerre civile chinoise. §!\n\n§CExplication de la Clique : §!\n\n§g Les familles Ma règnent sur le nord-ouest de la Chine depuis l'abolition de la dynastie Qing. La clique Ma se compose de trois familles qui contrôlent les provinces du Gansu, du Qinghai et du Ningxia. Après la Campagne du Nord, les seigneurs de guerre Ma ont rejoint le Kuomintang et ont aidé le gouvernement nationaliste au Xinjiang, au Tibet et à Wuyuan. Parmi les membres les plus éminents de ces familles figurent Ma Bufang, l'actuel représentant de la clique Ma, le général de cavalerie Ma Hongkui, Ma Buqing, Ma Hushan et Ma Hongbin. Les tentatives passées de Tchang Kaï-chek pour déstabiliser la région ont échoué, et l'absence relative de troupes japonaises et communistes dans le nord-ouest a permis à la région de conserver son autonomie vis-à-vis de Nankin.§!"
 POLITICS_SUN_ZHEN_WARLORD_50s_DESC:0 "§gVers la fin de la Seconde Guerre mondiale, Sun Zhen fut affecté à la province de Zhengzhou, où il occupa son poste jusqu’en février 1948. Il fut ensuite muté dans la province de Xuzhou en tant qu’officier chargé de la répression des bandits, avant d’être à nouveau muté en octobre 1948 dans la région frontalière entre le Sichuan et le Hubei, où il poursuivit sa carrière d’officier de pacification. Après février 1949, Sun fut nommé commandant adjoint du quartier général de pacification de Chongqing et commandant du quartier général de pacification de Chuandong. Après la chute de Liu Wenhui, il fut choisi par le généralissime pour occuper le poste de gouverneur militaire du Sichuan.§!\n\n§CExplication de la Clique : §!\n\n§g Après la chute de la dynastie Qing, la région du Sichuan devint un territoire disputé, où de nombreux seigneurs de guerre se sont battus pendant des décennies pour le contrôle de la province. La « clique du Sichuan » se divisa en groupes de seigneurs de guerre plus petits, ou « zones de défense », séparés les uns des autres par des frontières militaires, politiques et économiques bien définies. En 1935, Liu Xiang consolida son pouvoir à Chongqing, mais mourut seulement trois ans plus tard. Cela a ouvert la voie au gouvernement central, qui s'était alors installé à Chongqing, pour intégrer davantage la province dans la République. Cependant, la fin de la guerre contre le Japon et la reprise de la guerre civile chinoise ont permis à son successeur, Liu Wenhui, de regagner un certain degré d'autonomie, qui est toujours maintenu au Sichuan, même après l'arrestation de Liu Wenhui.§!"
 POLITICS_LI_MI_50s_WARLORDS_DESC:0 "§gLi Mi s'est illustré lors de la première phase de la guerre civile. Il a remporté de grands succès en battant les unités de l'Armée rouge en retraite commandées par He Long et Ye Ting, occupant ainsi les territoires que les communistes contrôlaient auparavant. Au moment du déclenchement de la deuxième guerre sino-japonaise, Li avait été promu colonel. Lorsque les Japonais se sont rendus en 1945, Li Mi a été promu au grade de lieutenant-général grâce à ses campagnes victorieuses contre les Japonais en Chine centrale et dans l'ouest du Yunnan. Il échappa de justesse à une mort certaine lorsque les troupes de l'APL étaient sur le point d'encercler ses unités dans le Henan et reçut l'ordre de Tchang Kaï-chek de défendre la province du Yunnan au début de l'année 1949. Après la guerre, il entra en politique locale au Yunnan et finit par s'imposer grâce à ses bonnes relations avec le généralissime et à la chute de l'ancien gouverneur Sun Du.§!"
 POLITICS_ZHAO_HENGTI_50s_WARLORDS_DESC:0 "§gBien qu'il ait été évincé du pouvoir en 1926 par Tang Shengzhi, Zhao Hengti sortit relativement vite de sa retraite pour occuper le poste de président de l'Assemblée provisoire du Hunan pendant la seconde guerre sino-japonaise. Après la guerre, il rejoignit le Kuomintang et devint un proche allié de Tchang Kaï-chek. Zhao fit son retour dans la politique locale au Hunan. L'héritage de la Constitution fédéraliste de la province du Hunan fait de lui l'un des hommes politiques les plus populaires de la région et, grâce à la destitution de Cheng Qian par Nankin, Zhao occupe à nouveau le poste de gouverneur par intérim du Hunan.§!"
 POLITICS_CHIA_CHING_TEH_50s_WARLORDS_desc:0 "§gChia est né à Qinshui, dans la province du Shanxi, où il devint premier secrétaire du gouverneur du Shanxi en 1912. Après avoir occupé des fonctions dans les domaines de l'administration civile, de la police et des affaires politiques, il fut intégré à la structure de l'Armée nationale révolutionnaire à la suite du ralliement du Shanxi au gouvernement du Kuomintang. Il fit son entrée dans la politique nationale dans les années 1940 lorsqu'il fut nommé conseiller du Yuan exécutif et travailla au ministère de l'Harmonie jusqu'en 1948. Il fut nommé vice-Premier ministre de la République en 1949, avant de revenir à la politique du Shanxi après la fin de la guerre civile. Il succéda alors à Yan Xishan au poste de gouverneur du Shanxi, dans l'espoir d'améliorer encore davantage la province par rapport à ce que Yan avait accompli pendant son mandat.§!"
 POLITICS_WANG_MING_WARLORD_50s_DESC:0 "§gWang Ming faisait partie des 28 bolcheviks envoyés en Chine par le Komintern pour prendre la tête du Parti communiste chinois en 1929. Cependant, ils se heurtèrent à une forte résistance au sein du PCC de la part de membres tels que Zhang Guotao et Zhou Enlai. Sans surprise, on leur attribua des postes sans importance. Au cours des années 1930, il devint l'un des principaux rivaux politiques de Mao Zedong au sein du PCC, adhérant à l'idéologie marxiste-léniniste traditionnelle, en opposition aux convictions de Mao. En 1937, il persuada Mao de s'allier avec Tchang Kaï-chek face à l'agression japonaise. Pendant la guerre, il continua à critiquer la politique de Mao envers le Japon et le Kuomintang. Malgré une santé de plus en plus fragile, Wang resta le plus grand détracteur de Mao et le candidat favori de Moscou, ce qui lui permit finalement de renverser Mao de son poste de président du PCC après la défaite désastreuse de la guerre civile chinoise.§!\n\n§CExplication de la Clique : §!\n\n§g Après 14 ans d'occupation japonaise, la Mandchourie fut finalement restituée à la Chine. Cependant, la transition fut tout sauf paisible. Les forces d'occupation soviétiques violèrent le traité sino-soviétique de 1945 en remettant la Mandchourie au Parti communiste chinois plutôt qu'au Kuomintang, offrant ainsi aux communistes dirigés par Mao Zedong une nouvelle base d'opérations contre le gouvernement de Nankin. Avec l'encouragement de l'Union soviétique, la région a servi de base arrière pendant la guerre civile aux communistes chinois, qui ont failli remporter la victoire en 1949 contre le Kuomintang. Lorsque les forces du généralissime Tchang Kaï-chek atteignirent Pékin et faillirent anéantir l'Armée populaire de libération, l'Union soviétique envahit une nouvelle fois la Mandchourie et y établit un État fantoche sous l'administration des vestiges du Parti communiste chinois, laissant la Mandchourie entre les mains des Soviétiques pour le moment.§!"
 POLITICS_Yumjaagiin_Tsedenbal_WARLORD_50s_DESC:0 "§gYumjaagiin Tsedenbal faisait partie des rares Mongols talentueux sélectionnés pour étudier en Union soviétique dans les années 1920. Diplômé de l'Institut des finances et d'économie d'Irkoutsk en 1938, il attira l'attention du Comité central du Parti communiste soviétique lors d'un voyage à Moscou. Il est retourné en Mongolie et a rejoint le Parti révolutionnaire populaire mongol en 1939, occupant brièvement le poste de ministre des Finances de la Mongolie. En 1940, à l'âge de 24 ans, Tsedenbal a été élu membre du Comité central, membre du Présidium et secrétaire général lors du dixième congrès du PRPM, devenant ainsi le numéro deux du pays. À la suite du décès de Khorloogiin Choibalsan en janvier 1952 et d'une brève lutte pour le pouvoir au sein du parti, Tsedenbal a été nommé président du Conseil des ministres en mai 1952. §!\n\n§CExplication de la Clique : §!\n\n§g La Mongolie a proclamé son indépendance après la chute de la dynastie Qing. Bien que les forces chinoises commandées par Xu Shuzheng aient occupé la Mongolie en 1919, l'ancien général russe blanc, le baron Ungern, a mené ses troupes en Mongolie en 1920, battant les forces d'occupation chinoises. Après la victoire de l'Armée rouge lors de la guerre civile russe et la mort de Bogd Khaan, la République populaire de Mongolie a été fondée. La Mongolie a connu la collectivisation du bétail, la destruction des monastères bouddhistes et les purges staliniennes sous la direction de Khorloogiin Choibalsan. Afin de s'assurer l'aide soviétique dans la guerre du Pacifique, les Alliés occidentaux ont accordé, lors de la conférence de Yalta en 1945, que la Mongolie extérieure conserverait son indépendance après la guerre. Un référendum a eu lieu le 20 octobre 1945, et 100 % des électeurs ont voté pour l'indépendance.§!"
 POLITICS_QASIM_WARLORD_50s_DESC:0 "§gEhmetjan Qasim succéda à Eilhan Tore à la présidence de la Deuxième République du Turkestan oriental en 1946. Il était le candidat favori du Parti communiste de l'Union soviétique en raison de la formation qu'il avait suivie à l'Université communiste des travailleurs de l'Orient, à Moscou. Pendant la guerre civile chinoise, Qasim tenta de négocier avec l'administration locale du Kuomintang au sujet de l'avenir de la République du Turkestan oriental au sein de la République de Chine, mais ces plans furent finalement abandonnés par l'Union soviétique après la prise de Nankin par les communistes chinois. Malgré la victoire des nationalistes, Qasim s'est rallié à Moscou et contrôle désormais l'ensemble du Xinjiang.§!\n\n§CExplication de la Clique :§!\n\n§gLa République du Turkestan oriental a été fondée en 1944 à la suite de la révolte d'Ili dans la province du Xinjiang. Avec l'aide de l'Union soviétique, une nouvelle république a été proclamée après que les rebelles turcophones eurent pris Yining aux mains du Kuomintang. En juin 1946, le gouvernement central chinois du Kuomintang a conclu un accord négocié avec les dirigeants de la République du Turkestan oriental, formant un gouvernement de coalition qui finira par s'effondrer en août 1947. Les trois districts sont restés une zone pro-soviétique distincte jusqu'à ce que l'Armée rouge fasse son entrée au Xinjiang après l'effondrement de l'Armée populaire de libération en Chine centrale. Le Xinjiang reste pour l'instant sous influence soviétique, mais on ne sait pas pour combien de temps.§!"
 POLITICS_MAO_ZEDONG_WARLORD_50s_DESC:0 "§gAprès sa cuisante défaite lors de la deuxième phase de la guerre civile chinoise, le président Mao subit une pression considérable de la part de ses rivaux au sein du Parti communiste. On lui reproche ce désastre et l'échec de la tentative de reprendre la Chine aux mains du Kuomintang, et sa position au sein du Parti communiste est gravement menacée.§!\n\n§CExplication de la Clique : §!\n\n§g Après 14 ans d'occupation japonaise, la Mandchourie fut finalement restituée à la Chine. Cependant, la transition fut tout sauf paisible. Les forces d'occupation soviétiques violèrent le traité sino-soviétique de 1945 en remettant la Mandchourie au Parti communiste chinois plutôt qu'au Kuomintang, offrant ainsi aux communistes dirigés par Mao Zedong une nouvelle base d'opérations contre le gouvernement de Nankin. Avec l'encouragement de l'Union soviétique, la région a servi de base arrière pendant la guerre civile aux communistes chinois, qui ont failli remporter la victoire en 1949 contre le Kuomintang. Lorsque les forces du généralissime Tchang Kaï-chek atteignirent Pékin et faillirent anéantir l'Armée populaire de libération, l'Union soviétique envahit une nouvelle fois la Mandchourie et y établit un État fantoche sous l'administration des vestiges du Parti communiste chinois, laissant la Mandchourie entre les mains des Soviétiques pour le moment.§!"
 POLITICS_MAO_ZEDONG_WARLORD_50s_RETURNED_DESC:0 "§gAprès sa défaite écrasante lors de la deuxième phase de la guerre civile chinoise, le président Mao a été soumis à une pression considérable de la part de ses rivaux au sein du Parti communiste. Il a finalement été écarté du pouvoir et contraint à une retraite anticipée par le cercle de Wang Ming. Cependant, les partisans maoïstes restants au sein de l'APL ont mis Pékin en état d'urgence et réinstallé Mao à la tête du PCC. Mao est désormais de nouveau au pouvoir et devrait procéder à une purge de l'ancienne administration ; il cherche une nouvelle occasion d'unifier la Chine sous la bannière rouge.§!\n\n§CExplication de la Clique : §!\n\n§gAprès 14 ans d'occupation japonaise, la Mandchourie fut finalement restituée à la Chine. Cependant, la transition fut tout sauf paisible. Les forces d'occupation soviétiques violèrent le traité sino-soviétique de 1945 en remettant la Mandchourie au Parti communiste chinois plutôt qu'au Kuomintang, offrant ainsi aux communistes dirigés par Mao Zedong une nouvelle base d'opérations contre le gouvernement de Nankin. Avec l'encouragement de l'Union soviétique, la région a servi de base arrière pendant la guerre civile aux communistes chinois, qui ont failli remporter la victoire en 1949 contre le Kuomintang. Lorsque les forces du généralissime Tchang Kaï-chek atteignirent Pékin et eurent failli anéantir l'Armée populaire de libération, l'Union soviétique envahit une nouvelle fois la Mandchourie et y établit un État fantoche sous l'administration des vestiges du Parti communiste chinois, laissant la Mandchourie entre les mains des Soviétiques pour le moment.§!"
 POLITICS_Tibet_Commission_50s_WARLORDS:0 "§Commission des affaires mongoles et tibétaines§!"
 progressbar_native_unrest_explanation_tt:0 "§gCette barre de progression vous indique l'état actuel de vos politiques envers la population autochtone de Taïwan. Elle varie de -30 % à 30 % et peut être modifiée par le biais de décisions, d'événements et d'objectifs nationaux dans votre arbre d'objectifs. Si la barre de progression est principalement rouge, votre modificateur sera négatif, ce qui vous infligera un malus à la stabilité, au soutien à la guerre et à la population recrutable. Si la barre de progression est principalement verte, votre modificateur sera positif, ce qui vous conférera un bonus en matière de stabilité, de soutien à la guerre et de population recrutable.§!"
 progressbar_kmt_unity_explanation_tt:0 "§gCette barre de progression vous indique l'état actuel de vos politiques concernant la structure interne et l'organisation du Kuomintang. Elle varie de 0 % à 100 %, mais est liée à l'esprit national dans votre onglet « Gouvernement », qui varie de -20 % à 20 %. Elle peut être modifiée par le biais de décisions, d'événements et d'axes stratégiques nationaux dans votre arbre d'axes stratégiques. Si la barre de progression est principalement rouge, votre esprit national a des valeurs négatives, ce qui se traduit dans la barre de progression par des valeurs comprises entre 0 % et 50 %, vous infligeant un malus au seuil de capitulation, à la vitesse de recherche et à la force du contre-espionnage. Si la barre de progression est principalement verte, votre moral national a des valeurs positives, ce qui est représenté dans la barre de progression par des valeurs comprises entre 50 % et 100 %, vous conférant un bonus au seuil de capitulation, à la vitesse de recherche et à la force du contre-espionnage.§!"
 progressbar_kmt_influence_explanation_tt:0 "§gCette barre de progression vous indique dans quelle mesure le Kuomintang a réussi (ou échoué) à étendre son influence sur la société taïwanaise. Elle varie de 0 % à 100 %, mais est liée à l'esprit national dans votre onglet « Gouvernement », qui varie de -20 % à 20 %. Elle peut être modifiée par le biais de décisions, d'événements et d'objectifs nationaux dans votre arbre d'objectifs. Si la barre de progression est principalement rouge, votre esprit national a des valeurs négatives, ce qui se traduit dans la barre de progression par des valeurs comprises entre 0 % et 50 %, vous infligeant un malus au gain de pouvoir politique, à l'efficacité de production, à la production des usines et à la portée d'approvisionnement. Si la barre de progression est principalement verte, votre moral national a des valeurs positives, ce qui est représenté dans la barre de progression par des valeurs comprises entre 50 % et 100 %, vous conférant un bonus au gain de pouvoir politique, à l'efficacité de production, à la production des usines et à la portée d'approvisionnement.§!"
 progressbar_usa_influence_explanation_tt:0 "§gCette barre de progression vous indique le niveau d'influence des États-Unis d'Amérique dans votre pays ; cette information est également disponible dans l'onglet « Diplomatie ». Elle va de 0 % à 100 % d'influence et, selon l'importance de cette influence, les États-Unis peuvent vous pousser à mener certaines négociations bilatérales, telles que des accords commerciaux ou des subventions militaires. Si l'influence américaine venait à devenir incontrôlable et n'était pas combattue par le gouvernement, les forces pro-américaines au sein du parti et de l'armée passeraient à l'action contre l'administration actuelle.§!"
 text_native_unrest_status_tt:0 "§CLes troubles chez les autochtones sont à [?kmt_50s_native_taiwan_var|%+]§!"
