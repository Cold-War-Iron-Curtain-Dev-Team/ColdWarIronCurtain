 Chinese_Civil_War_missions_category:0 "La guerre civile chinoise"
 Chinese_Civil_War_missions_category_desc:0 "\n\n\n\n\n\n£CHI_Texticon_Chinese_Civil_War\n\n\n\n\n\n\n\nLa guerre de résistance a peut-être pris fin, mais la Chine est encore loin de connaître la paix. Après l'échec de l'accord du Double Dix en 1946, la guerre civile entre le Parti communiste et le Kuomintang a repris et les deux camps se disputent désormais le contrôle de la Chine continentale. Quel que soit le vainqueur, il déterminera l'avenir de la Chine et son rôle dans la guerre froide.\n"
 The_Chinese_Civil_war:0 "La fin de la guerre civile chinoise"
 The_Chinese_Civil_war_desc:0 "Après la percée en Mandchourie, l'Armée populaire de libération continue d'avancer sur notre territoire, confrontée à une résistance timide des forces armées républicaines. Nos soldats sont épuisés et incapables de se battre plus longtemps. Si nous voulons sécuriser la Chine, nous devons agir rapidement."
 ADD_DAYS_TO_MISSION:0 "Ajouter $DAYS|H$ jours à la mission $MISSION|H$"
 REMOVE_DAYS_TO_MISSION:0 "Supprimer $DAYS|H$ jours de la mission $MISSION|H$"
 Retreat_to_Manchuria:0 "Retraite en Mandchourie"
 The_Shanghai_Campaign:0 "Évacuation de Shanghai"
 The_Shanghai_Campaign_desc:0 "Il est clair que tenir Shanghai est impossible et irréalisable, nous devons ordonner immédiatement l'évacuation des troupes à Shanghai afin qu'elles retournent sur le front principal."
 The_Hunan_Campaign:0 "La bataille de Changteh"
 The_Hunan_Campaign_desc:0 "La ville de Changteh a connu de terribles horreurs pendant la seconde guerre sino-japonaise. C'est notre principale base d'approvisionnement dans la région du Hunan, nous devons donc la défendre à tout prix si nous ne voulons pas que nos lignes d'approvisionnement en souffrent."
 The_Sichuan_Campaign:0 "La bataille de Chongqing"
 The_Sichuan_Campaign_desc:0 "La ville de Chongqing a été notre capitale provisoire pendant la guerre contre le Japon. Elle a résisté aux bombardements terroristes japonais, elle résistera donc également à la menace communiste."
 CHI_hunan_defection:0 "Le soulèvement de Changsha"
 CHI_hunan_defection_desc:0 "Dans des circonstances claires, la faction pro-paix au sein du Kuomintang, qui comprend des personnalités du Hunan telles que l'actuel gouverneur du Hunan Cheng Qian et Tang Shengzhi, souhaite mettre rapidement fin à la guerre civile chinoise par une « libération » pacifique, une initiative politique contagieuse qui pourrait influencer l'allégeance d'autres cliques de seigneurs de la guerre à notre gouvernement."
 CHI_Make_concessions_to_Xinjiang:0 "Concessions au Xinjiang"
 CHI_Make_concessions_to_Xinjiang_desc:0 "Les Ouïghours du Xinjiang sont profondément mécontents de l'administration du KMT et cherchent activement à évincer tous les responsables du Kuomintang du pouvoir dans la région. Avec quelques concessions et promesses, nous pourrions les ramener dans le droit chemin.\n\nAtteindre 100 % d'influence forcera le Turkestan oriental à se soumettre."
 CHI_Rebellious_Troops:0 "Troupes rebelles"
 CHI_sun_li_jen_training_troops:0 "Programme d'entraînement de Sun Li-Jen pour la 201e division"
 Changheng_campaign:0 "Campagne de Chang-heng"
 Changheng_campaign_desc:0 "Avec l'échec du complot de Changsha, une invasion militaire du Hunan était nécessaire pour anéantir le KMT et consolider le reste du sud de la Chine. La campagne de Chang-heng allait permettre à l'APL de s'emparer des principales villes du Hunan, notamment Changsha et Hengyang, lui ouvrant ainsi la voie vers Chongqing et Guangzhou."
 Defense_of_the_southwest:0 "Défense du Sud-Ouest"
 Defense_of_the_southwest_desc:0 "Avec la moitié de la Chine sous le contrôle des communistes, les deux dernières grandes villes encore debout sont Chongqing et Chengdu, toutes deux situées dans le sud-ouest de la Chine. Si Chongqing venait à tomber, le reste du front sud-ouest s'effondrerait également, tandis que les seigneurs de guerre de Xikang et du Yunnan pourraient commencer à se rebeller..."
 Defense_of_Liangguang:0 "Défense de Liangguang"
 Defense_of_Liangguang_desc:0 "Actuelle capitale de la République, la ville de Guangzhou est l'une des rares régions où l'industrie reste sous le contrôle de la République de Chine. Les régions voisines de la ville, considérées comme faisant partie des provinces du Guangdong et du Guangxi (appelées Liangguang lorsqu'elles sont réunies), doivent se préparer à repousser l'Armée populaire de libération et à l'empêcher à tout prix de s'approcher de Guangzhou."
 Defense_of_the_Northwest:0 "Défense du Nord-Ouest"
 Defense_of_the_Northwest_desc:0 "La région nord-ouest, confrontée à la menace et à la vulnérabilité d'une invasion de la République populaire de Chine, offre au KMT une bonne occasion de mener une guerre d'usure contre les forces de l'APL tout en empêchant le PCC d'atteindre la province du Xinjiang, où le gouvernement provincial était dominé par des sympathisants communistes attendant l'arrivée de l'APL."
 CHI_keep_propaganda_machines_rolling:0 "Maintenir les machines de propagande en marche"
 CHI_keep_propaganda_machines_rolling_desc:0 "Jusqu'à la destruction des bandits communistes, notre département de propagande continuera à travailler."
 CHI_the_grand_counterattack:0 "La grande contre-attaque"
 CHI_the_grand_counterattack_desc:0 "Il est temps..."
