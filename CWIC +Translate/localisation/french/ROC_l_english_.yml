 text_native_unrest_loc:0 "Agitation chez les autochtones :"
 text_native_unrest_title_tt:0 "§CAgitation autochtone§!"
 text_native_unrest_tt:0 "§gLorsque l'Empire japonais capitula en 1945, l'île de Taïwan fut restituée à la République de Chine. Le gouvernement du Kuomintang, partisan de politiques de centralisation et de sinisation, a déjà pris diverses mesures pour intégrer la province de Taïwan à l'État chinois. Les écoles taïwanaises mettent désormais l'accent sur la langue et l'histoire chinoises, ainsi que sur un programme scolaire soutenant l'idéologie du Kuomintang. Cependant, étant donné que la majorité du peuple taïwanais a été coupée de l'influence chinoise pendant plus de cinq décennies, il est clair qu'il n'est pas disposé à adopter toutes les doctrines énoncées par un gouvernement dominé par des continentaux.\n\n§RSi ce modificateur tombe en dessous de -30 % de stabilité et de soutien à la guerre, le gouvernement du Kuomintang tombera et la République de Chine cessera d'exister.§! §!"
 text_kmt_strength_loc:0 "Unité du KMT :"
 text_kmt_strength_title_tt:0 "§CL'unité du Kuomintang§!"
 text_kmt_strength_tt:0 "§g« La révolution chinoise a échoué. Mon seul souhait aujourd’hui est de faire renaître l’esprit révolutionnaire qui animait le Kuomintang chinois en 1924 », déclarait Tchang Kaï-chek en 1932. \n\nLe Kuomintang était arrivé au pouvoir en promettant diverses réformes sociales et économiques au peuple chinois. Mais après la défaite de la clique de Beiyang, le parti ne s’est plus soucié que de maintenir et d’étendre son pouvoir et de lutter contre le Parti communiste. L'inefficacité des bureaucrates, la corruption, les luttes factionnelles et l'opportunisme ont contribué à la chute du Kuomintang et à sa défaite face au Parti communiste sur le continent. Il est dans notre intérêt de mettre fin à cette misère et de prendre des mesures pour réformer le Kuomintang afin d'en faire un parti uni et efficace, exempt d'opportunistes et de corruption.§!"
 text_kmt_influence_loc:0 "L'influence du KMT :"
 text_kmt_influence_title_tt:0 "§CL'influence du Kuomintang§!"
 text_kmt_influence_tt:0 "§gPour avoir une chance de reprendre le contrôle du continent aux communistes, le Kuomintang doit promouvoir les valeurs et les convictions du Parti auprès du peuple taïwanais. Si le peuple ne considère pas le Kuomintang comme le seul gouvernement chinois légitime, l'occasion de reconquérir la Chine pourrait être perdue à jamais.§!"
 text_cia_influence_loc:0 "L'influence des États-Unis :"
 text_cia_influence_tt:0 "§gLes États-Unis d'Amérique ont été notre plus proche allié pendant la guerre de résistance, nous fournissant les conseillers et les armes dont nous avions tant besoin pour repousser les envahisseurs japonais. Après la chute de la Chine continentale, les États-Unis ont déclaré leur soutien à notre lutte contre le communisme en Asie. Leur puissant arsenal sera d'un grand secours à notre armée et jouera un rôle crucial dans la reconquête de la Chine continentale, mais il serait sage de limiter l'influence politique de Washington...§!"
 text_cia_influence_title_tt:0 "§CL'influence américaine§!"
 president_title_tt:0 "§YPrésident de la République de Chine§!"
 vice_president_title_tt:0 "§YVice-président de la République de Chine§!"
 premier_title_tt:0 "§YPremier ministre de la République de Chine§!"
 premier_description_tt:0 "§gLe Premier ministre de la République de Chine est à la tête du gouvernement républicain et dirige le Yuan exécutif. Il est nommé par le président de la République et est chargé de proposer les noms des vice-premiers ministres, des ministres du gouvernement ainsi que des présidents des différents départements du Yuan exécutif, qui sont ensuite nommés par le président. Le Premier ministre a pour mission de présenter les politiques administratives et de soumettre les projets de loi au Yuan législatif. Le Premier ministre peut assumer les fonctions de vice-président si le vice-président en exercice prend les fonctions de président, et ce jusqu'à la fin du mandat présidentiel initial. Le Premier ministre doit démissionner si une motion de censure est déposée par le Yuan législatif et approuvée à la majorité simple. Compte tenu de l'énorme influence de la fonction présidentielle de Tchang Kaï-chek, il est peu probable que le Premier ministre détienne des pouvoirs significatifs au sein du gouvernement à l'heure actuelle."
 president_vice_description_tt:0 "§gConformément à l'article 49 de la Constitution de la République de Chine de 1947, le vice-président est le deuxième plus haut responsable de la République et succède au président en cas de vacance du poste, jusqu'à l'expiration du mandat présidentiel initial. Le vice-président fait également office de représentant du président lorsque celui-ci est dans l'incapacité d'exercer ses fonctions. Si le vice-président assume la présidence en cas de décès, de maladie ou de démission du président en exercice, le chef du Yuan exécutif et Premier ministre de la République de Chine assumera les fonctions de vice-président. Ce poste, tout comme celui de président, est attribué par l'Assemblée nationale tous les six ans, mais il ne détient que très peu de pouvoirs formels au sein du gouvernement républicain et dépend fortement du programme politique du président.§g"
 president_description_tt:0 "§gLe président de la République de Chine est à la fois chef de l'État et commandant en chef de l'armée chinoise. Selon la Constitution de 1947 de la République de Chine, qui a rétabli la Chine en tant que république parlementaire, le président n'exerce sur le papier que des pouvoirs protocolaires et ne dispose que de peu, voire d'aucun pouvoir exécutif réel ; il est élu par l'Assemblée nationale tous les six ans.\n\nCependant, à la suite de la décision de l'Assemblée nationale de soutenir Tchang Kaï-chek en tant que président, celui-ci a continué à étendre ses pouvoirs, transférant des compétences du Yuan législatif et du Premier ministre vers la présidence. La fonction présidentielle, du moins pour l'instant, conserve des pouvoirs quasi dictatoriaux.§!"
