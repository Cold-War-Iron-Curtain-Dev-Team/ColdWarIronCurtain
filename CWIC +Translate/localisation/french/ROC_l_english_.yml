 propose_intervention_into_korea:0 "Proposer aux États-Unis d'intervenir en Corée"
 Korean_War_Escalation_50s_Taiwan_category:0 "La guerre de Corée"
 Korean_War_Escalation_50s_Taiwan_category_desc:0 "L'invasion de la Corée du Sud par le Parti des travailleurs coréens a marqué un tournant pour les États-Unis, qui ont abandonné leur politique de neutralité pour adopter une politique d'endiguement du stalinisme et du communisme. Après diverses négociations et réunions, Washington nous a donné le feu vert pour intervenir dans la guerre de Corée au nom de la Corée du Sud, contre la menace rouge à Pyongyang et ses partisans du PCC. Des voix fanatiques au sein de l'état-major des forces républicaines suggèrent que nous utilisions ce conflit pour reprendre le continent chinois au Parti communiste, mais cela nécessiterait des efforts logistiques et des renforts militaires supplémentaires, qui risquent de nous manquer si le temps ne joue pas en notre faveur."
 join_the_fray_alone_against_Korea:0 "Rejoindre le combat en Corée"
 join_the_fray_alone_against_Korea_desc:0 "Notre équipe de planification a décidé qu'il était préférable de déployer nos unités uniquement dans la péninsule coréenne, étant donné que notre armée se remet encore des conséquences de la guerre civile chinoise. Pour l'instant, nous défendrons nos alliés à Séoul et, après une préparation, des réformes et une réorganisation supplémentaires, nous serons en mesure de reprendre le continent aux communistes à l'avenir."
 send_more_guns_to_south_korea:0 "Envoyer plus d'armes à la Corée"
 abandon_south_korea:0 "Se retirer de la Corée du Sud"
 abandon_south_korea_desc:0 "La situation devient chaque jour plus grave. Avec l'offensive sino-coréenne qui s'empare d'importantes villes clés dans le sud, il est peu probable que la guerre tourne à nouveau en notre faveur. Il vaudrait peut-être mieux limiter nos pertes et ordonner à nos unités de se replier sur Taïwan."
 launch_invasion_of_chinese_mainland:0 "Lancer une invasion du continent communiste"
 launch_invasion_of_chinese_mainland_desc:0 "Le moment est venu de retourner en Chine continentale. Nos troupes en Birmanie et au Qinghai nous aideront dans notre lutte contre le Parti communiste, et comme une grande partie des forces de l'Armée populaire de libération sont mobilisées en Corée, c'est peut-être notre seule chance de reprendre le continent aux bandits rouges !"
 return_to_nanjing:0 "Retour à Nankin"
 XSM_replace_Ma_Bufang_as_governor:0 "Remplacer Ma Bufang au poste de gouverneur du Nord-Ouest"
 XIK_replace_Sun_Zhen_as_governor:0 "Remplacer Sun Zhen au poste de gouverneur du Sichuan"
 XIK_replace_Sun_Zhen_as_governor_desc:0 "Le dévouement et la loyauté de Sun Zhen envers le Kuomintang pendant la deuxième phase de la guerre civile ne doivent pas être oubliés. Notre administration estime toutefois que le retour de la gouvernance locale du Sichuan à l'administration civile permettra d'intégrer davantage la province au pays. Le cercle restreint du généralissime a suggéré que nous relevions Sun Zhen de ses fonctions et que nous lui accordions une retraite bien méritée. Nous renverrons l'ancien gouverneur Zhang Qun au Sichuan pour remplacer Sun afin de garantir une administration civile efficace."
 YUN_replace_Sun_Du_as_governor:0 "Remplacer Sun Du au poste de gouverneur du Yunnan"
 YUN_replace_Sun_Du_as_governor_desc:0 "Sun Du a succédé à Lu Han, jugé peu fiable, après l'invasion soviétique de la Mandchourie. Il n'a peut-être pas œuvré contre le gouvernement central pendant la dernière phase de la guerre civile, mais son commandement a été médiocre. De nombreux soldats et hauts fonctionnaires ont fait défection au profit du Parti communiste sous son commandement. Bien qu'il soit resté loyal dans le fond, il serait peut-être préférable de remplacer son administration militaire par une administration plus civile, afin d'assurer une gouvernance locale sans recours à la force pour le Yunnan."
 HNN_replace_Ding_Delong_as_governor:0 "Remplacer Ding Delong au poste de gouverneur du Hunan"
 HNN_replace_Ding_Delong_as_governor_desc:0 "Malgré la loyauté de Ding Delong envers le gouvernement central et le parti, notre administration estime que le retour de la gouvernance locale du Hunan à l'administration civile permettra d'intégrer davantage la province au pays. Le cercle restreint du généralissime a suggéré que nous le relevions de ses fonctions et que nous renvoyions l'ancien gouverneur Zhao Hengti au Hunan afin de garantir une administration civile efficace."
 GXC_replace_Li_Zongren_as_governor:0 "Remplacer Li Zongren au poste de gouverneur du Guangxi"
 GXC_replace_Li_Zongren_as_governor_desc:0 "Li Zongren a défié Chiang pendant des décennies lorsqu'il était gouverneur du Guangxi, mais la clique du Guangxi est devenue très influente dans la politique du gouvernement central et nous ne pouvons donc pas nous permettre de le remplacer facilement par un gouverneur pro-Chiang. Cependant, l'une des figures les plus éminentes de la clique du Guangxi, outre Li Zongren et Bai Chongxi, n'est autre que Huang Shaohong. Huang était le gouverneur civil de la clique du Guangxi aux côtés de Li, mais il a temporairement quitté la Chine pour Hong Kong en 1949 après l'échec des négociations avec les communistes et est revenu pendant l'armistice avec ces derniers. Il serait un excellent candidat au poste de gouverneur du Guangxi, car cela affaiblirait en partie l'influence de Li Zongren dans la région tout en empêchant Li de lancer une rébellion à grande échelle, l'un de ses associés occupant le poste de gouverneur."
 SHX_Retirement_of_Yan_Xishan_as_governor:0 "Remplacer Yan Xishan au poste de gouverneur"
 SHX_Retirement_of_Yan_Xishan_as_governor_desc:0 "Yan Xishan, autrefois un chef de guerre influent en Chine, n'est plus aujourd'hui qu'un vieil homme fragile, alors que la région ne s'est pas encore remise des ravages de la guerre civile chinoise et que son autorité sur le Shanxi s'est affaiblie. Il sera remplacé par Feng Qinzai, un ancien membre de la clique du Shanxi qui a pris sa retraite de l'armée après la chute de Beiping aux mains des communistes en 1948 et qui s'est récemment lancé dans la politique de la République de Chine."
 CHI_recapture_nanjing:0 "Reprendre Nankin"
 CHI_recapture_nanjing_desc:0 "Nankin, la capitale de la République, a été l'exemple brillant de la modernisation et de l'industrialisation chinoises après l'expédition du Nord. L'occupation communiste doit prendre fin dès que possible."
 CHI_recapture_wuhan:0 "Reprendre Wuhan"
 CHI_recapture_wuhan_desc:0 "Wuhan, berceau de la révolution Xinhai, est l'une des villes les plus importantes de Chine sur le plan symbolique. Étant donné que le Parti communiste se présente également comme le successeur de la révolution de 1911, il est essentiel que nous la reprenions aux mains des bandits."
 CHI_recapture_beiping:0 "Reprendre Beiping"
 CHI_recapture_beiping_desc:0 "Lors de la chute de Beiping aux mains des forces communistes en 1948, celles-ci ont commencé à faire de la ville leur nouvelle capitale tout en poursuivant la guerre civile contre nous dans les plaines centrales. La reconquête de Beiping portera le coup fatal aux forces communistes épuisées."
 CHI_move_capital_back_to_nanjing:0 "Transférer la capitale à Nankin"
 CHI_move_capital_back_to_nanjing_desc:0 "La menace des forces communistes qui se rapprochaient de Nankin ayant disparu et la ville étant désormais isolée du front principal, nous pouvons désormais retourner en toute sécurité dans notre ancienne capitale et y reprendre le commandement, tandis que les communistes battent précipitamment en retraite vers le nord. La victoire est en vue, poursuivons-la."
 KMT_Reform_the_Justice_Investigation_Bureau:0 "Réformer le Bureau d'enquête judiciaire"
 KMT_Reform_the_Justice_Investigation_Bureau_desc:0 "Le Bureau d'enquête judiciaire est le service de contre-espionnage et d'enquête criminelle de la République de Chine. Une réforme est nécessaire de toute urgence pour lutter contre la corruption et les injustices massives dans les opérations du JIB."
 KMT_Launch_Investigations_into_the-Army:0 "Lancer des enquêtes sur l'armée"
 KMT_Launch_Investigations_into_the-Army_desc:0 "Le Bureau d'enquête judiciaire et le Bureau du renseignement militaire de la République de Chine mèneront immédiatement des enquêtes approfondies sur certaines personnes au sein de l'armée de la République de Chine qui ont exprimé des opinions politiques contraires aux idéaux de l'État. La discipline sera maintenue."
 KMT_Send_Suspect_Officers_to_the_Frontier:0 "Envoyer les officiers suspects à la frontière"
 KMT_Send_Suspect_Officers_to_the_Frontier_desc:0 "Tous les officiers considérés comme des dissidents politiques ou impliqués dans des affaires de corruption ou toute autre activité illégale seront envoyés, tous frais payés, dans un nouveau commandement situé à l'est de la Chine, où ils pourront profiter de la vie à la frontière."
 KMT_Mass_Purges:0 "Purges de masse"
 KMT_Mass_Purges_desc:0 "Il est nécessaire de se débarrasser de ceux qui ont professé leur déloyauté et leur opposition au régime dirigeant du Kuomintang ; ces individus seront arrêtés, jugés, condamnés et « traités » en conséquence."
 KMT_acquire_US_advisors:0 "Acquérir des conseillers américains"
 KMT_acquire_US_advisors_desc:0 "Les États-Unis d'Amérique sont notre plus grand partenaire en matière de commerce et de diplomatie. Demander davantage de conseillers contribuera à améliorer notre armée et à préparer les troupes à de futurs conflits en Asie de l'Est."
 KMT_training_brigades:0 "Brigades d'entraînement"
 KMT_training_brigades_desc:0 "Le plan de la 60e division se concentrera sur la formation d'une force d'élite capable de s'adapter et résistante. Au lieu de miser sur la quantité, comme l'a fait Mao, nous tenterons une nouvelle fois de mettre en place une force de combat qualitative."
 KMT_adopt_new_army_structure:0 "Adopter une nouvelle structure militaire"
 KMT_adopt_new_army_structure_desc:0 "Une nouvelle structure militaire sera mise en place, en s'inspirant de divers éléments des anciennes structures militaires utilisées par nous, qui ont été développées par l'Allemagne, les Soviétiques et les Américains."
 KMT_conclude_the_sixty_divisions_plan:0 "Conclure le plan des soixante divisions"
 KMT_conclude_the_sixty_divisions_plan_desc:0 ""
 KMT_reform_logistical_system:0 "Réformes logistiques"
 KMT_reform_logistical_system_desc:0 "Notre logistique actuelle est insuffisante pour approvisionner et déployer nos armées sur le front afin qu'elles soient pleinement efficaces au combat. Nous allons changer cela et mettre en œuvre les réformes logistiques indispensables."
 KMT_devise_new_methods_for_sustaining_army_structure:0 "Concevoir de nouvelles méthodes pour soutenir le plan Alpha"
 KMT_devise_new_methods_for_sustaining_army_structure_desc:0 "Malgré nos efforts pour surmonter tous les défis auxquels nous avons été confrontés pour maintenir la structure actuelle de l'armée, le système présente encore des lacunes importantes, et une réforme de la structure de l'armée est donc indispensable."
