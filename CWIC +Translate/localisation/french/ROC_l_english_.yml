 CHI_Protected_by_US_Fleet:0 "Protégé par la Septième Flotte"
 CHI_Protected_by_US_Fleet_description:0 "\nLa septième flotte de la marine américaine s'est déployée dans le détroit de Taiwan afin de protéger l'île contre toute invasion éventuelle de la part de la Chine communiste. Cela nous aidera considérablement dans nos efforts de défense contre le PCC, mais cela interférera également avec nos plans offensifs visant à reconquérir la Chine continentale."
 native_unrest_50s_taiwan:0 "Agitation indigène"
 native_unrest_50s_taiwan_desc:0 "Lorsque l'Empire japonais capitula en 1945, l'île de Taïwan fut rétrocédée à la République de Chine. Le gouvernement du Kuomintang, favorable à la centralisation et à la sinisation, a déjà pris diverses mesures pour aligner la province taïwanaise sur l'État chinois, notamment en mettant l'accent sur la langue chinoise, l'histoire et un programme scolaire soutenant l'idéologie du Kuomintang. Cependant, étant donné que la majorité des Taïwanais ont été coupés de l'influence chinoise pendant plus de cinq décennies, il est clair qu'ils ne sont pas disposés à s'adapter à toutes les doctrines énoncées par un gouvernement dominé par les continentaux.\n\n§RSi ce modificateur tombe en dessous de -30 % de stabilité et de soutien à la guerre, le gouvernement du Kuomintang tombera et la République de Chine cessera d'exister.§!"
 kmt_party_unity_50s_taiwan:0 "Unité du Kuomintang"
 kmt_party_unity_50s_taiwan_desc:0 "« La révolution chinoise a échoué », déclarait Chiang Kai-shek en 1932. « Mon seul désir aujourd'hui est de restaurer l'esprit révolutionnaire qui animait le Kuomintang chinois en 1924 ». Le Kuomintang était arrivé au pouvoir en promettant diverses réformes sociales et économiques au peuple chinois. Mais après la défaite de la clique Beiyang, le parti s'est uniquement concentré sur le maintien et l'expansion de son pouvoir et la lutte contre le mouvement communiste chinois. L'inefficacité des bureaucrates, la corruption, le factionnalisme et l'opportunisme ont contribué à la chute du Kuomintang et à sa défaite face au Parti communiste sur le continent. Il est dans notre intérêt de mettre fin à cette misère et de prendre des mesures pour réformer le Kuomintang afin d'en faire un parti uni et efficace, exempt d'opportunistes et de corruption, un parti de véritables patriotes chinois et un parti d'action, et non de paroles."
 kmt_influence_50s_taiwan:0 "Influence du Kuomintang"
 kmt_influence_50s_taiwan_desc:0 "Afin de garantir les chances du Kuomintang de se rétablir et de reprendre le continent aux communistes, le gouvernement doit utiliser son pouvoir politique pour pénétrer tous les secteurs de la société afin d'approfondir le règne du Kuomintang et sa légitimité en tant que seul gouvernement de la Chine. Le Kuomintang doit aligner l'île de Taïwan sur ses convictions et ses politiques, sinon il mettra en péril ses chances de reprendre le continent."
