 CHI_KMT_reborn:0 "La renaissance du Kuomintang"
 CHI_KMT_reborn_description:0 "\nAprès des décennies d'incompétence, de corruption et d'opportunisme, les réformes du Comité central de réforme du Kuomintang ont finalement transformé le parti en un parti léniniste révolutionnaire, tel qu'il était autrefois. Le moment est désormais venu de se préparer à la libération inévitable de la Chine continentale."
