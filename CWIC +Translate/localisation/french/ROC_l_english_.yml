 education_reform_category:0 "Réformes éducatives"
 education_reform_category_desc:0 "\n\n\n\n\n\n£CHI_Texticon_Education\n\n\n\n\n\n\n\nSi les campagnes militaires ont permis de sécuriser nos frontières, la fragmentation et les lacunes du système éducatif au sein de la République constituent toujours une vulnérabilité majeure. Afin d’assurer l’avenir de la République, le ministère de l’Éducation a ratifié le « Plan de renaissance nationale par l’éducation ». Le mandarin deviendra la langue d'enseignement dominante afin de combler le fossé entre les provinces et de démanteler le factionnalisme régional. De plus, les ressources seront réorientées des arts libéraux vers les sciences appliquées et l'ingénierie, garantissant ainsi que nous disposions d'une base industrielle à la hauteur de nos rivaux. Enfin, l'instruction militaire et les Trois Principes du Peuple deviendront des matières obligatoires, garantissant que chaque diplômé comprenne son devoir envers l'État.\n"
 centralize_control_of_schools:0 "Centraliser le contrôle des établissements d'enseignement"
 centralize_control_of_schools_desc:0 "En raison des périodes de troubles, nous n'avons pas été en mesure de réglementer les écoles dans le pays ni de remédier à l'analphabétisme. Maintenant que nous bénéficions d'au moins une décennie de paix, nous allons concentrer nos efforts sur la centralisation du contrôle des écoles, de l'enseignement primaire à l'université, après quoi nous déciderons des autres points à l'ordre du jour."
 private_schooling_in_china:0 "L'enseignement privé en Chine"
 private_schooling_in_china_desc:0 "L'enseignement privé est à la fois un obstacle et une forme d'apaisement pour les élites du pays. Nous déciderons de ce que nous ferons de l'enseignement privé."
 compulsory_education_in_china:0 "Enseignement primaire obligatoire en Chine"
 compulsory_education_in_china_desc:0 "Pour que nos campagnes d'alphabétisation soient pleinement couronnées de succès, nous devons mettre en place l'enseignement obligatoire dans le pays afin que chacun puisse bénéficier d'une éducation d'une manière ou d'une autre. Cependant, il peut être coûteux pour le gouvernement de subventionner l'éducation des familles moins aisées, ce qui représente une somme considérable compte tenu de l'énorme population chinoise."
 sanminzhuyi_course:0 "Cours sur les trois principes du peuple"
 sanminzhuyi_course_desc:0 "Ce cours a été introduit en 1944 sous le nom de « principes du parti », afin de permettre aux gens de comprendre les trois principes et l'histoire du Kuomintang. Il serait peut-être dans notre intérêt d'introduire ce cours à tous les niveaux d'enseignement."
 CHI_land_reform_issue_1:0 "La question de la réforme agraire"
