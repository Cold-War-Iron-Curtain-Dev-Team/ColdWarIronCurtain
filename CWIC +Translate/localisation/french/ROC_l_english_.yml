 bss.301.t:0 "Rapport de nos informateurs à Nanjing"
 bss.301.d:0 "Monsieur le Président ! Nos espions chargés d'infiltrer le gouvernement du Kuomintang et son armée ont fait une découverte choquante. L'entourage du traître Tchang Kaï-chek a élaboré des plans pour envahir la Mandchourie et mobilise actuellement ses forces armées pour nous attaquer ! Nous devons prendre diverses mesures pour protéger le peuple chinois de Mandchourie contre l'impérialisme occidental, mais de nombreux membres de l'état-major de l'Armée populaire de libération ne pensent pas que nous puissions résister longtemps seuls à une invasion. Même si l'Union soviétique nous soutiendra sans aucun doute par des livraisons d'armes, nous devrions envisager de demander à nos autres camarades socialistes de Mongolie, de Corée, du Vietnam et du Turkestan de nous aider à vaincre une fois pour toutes les capitalistes d'Asie de l'Est."
 bss.301.a:0 "Contactez nos alliés. Nous avons besoin de tout le monde pour vaincre la bourgeoisie !"
 bss.302.t:0 "L'intervention soviétique"
 bss.302.d:0 "Alors que nous étions au bord d'une défaite totale face au Kuomintang, l'Union soviétique est intervenue pour empêcher l'effondrement complet de nos forces et a envahi les régions du Xinjiang et de la Mongolie intérieure. Les bourgeois contrôlent désormais les principales zones han de Chine, mais nous ne sommes pas en mesure de déclencher un conflit avec le Kuomintang dans les années à venir.\n\nNous contrôlons néanmoins toujours Pékin et la Mandchourie. Pour l'instant, nous devons nous concentrer sur la reconstruction de l'armée et la maîtrise de nos problèmes internes si nous voulons un jour reprendre la Chine au KMT."
 bss.302.a:0 "Les armes se tiennent au repos… pour l'instant."
 POLITICS_SUN_ZHEN_UPRISING_DESC:0 "§gMécontents des réformes et des politiques du gouvernement central de Nankin, Sun Zhen et ses partisans ont déclaré faire sécession de la République de Chine. Sun s'est proclamé gouverneur militaire provisoire du Sichuan jusqu'à la formation d'un nouveau gouvernement local, bien que les chances pour le Sichuan de conserver son indépendance semblent minces, à moins que d'autres factions ne déclarent leur indépendance vis-à-vis du gouvernement central.§!"
 POLITICS_BUFANG_UPRISING_DESC:0 "§gMécontents des réformes et des politiques du gouvernement central de Nankin, Ma Bufang et ses partisans ont déclaré faire sécession de la République de Chine. Ma s'est proclamé gouverneur militaire provisoire du Nord-Ouest jusqu'à la formation d'un nouveau gouvernement local, bien que les chances pour la région de conserver son indépendance semblent minces, à moins que d'autres factions ne déclarent leur indépendance vis-à-vis du gouvernement central.§!"
 POLITICS_YAN_XISHAN_UPRISING_DESC:0 "§gMécontents des réformes et des politiques du gouvernement central de Nankin, Yan Xishan et ses partisans ont déclaré faire sécession de la République de Chine. Yan s'est proclamé gouverneur militaire provisoire du Shanxi jusqu'à la formation d'un nouveau gouvernement local, même si les chances pour que le Shanxi conserve son indépendance semblent minces, à moins que d'autres factions ne déclarent leur indépendance vis-à-vis du gouvernement central.§!"
 POLITICS_ZONGREN_UPRISING_DESC:0 "§gMécontents des réformes et des politiques du gouvernement central de Nankin, Li Zongren et ses partisans ont fait sécession de la République de Chine. Li s'est proclamé gouverneur militaire provisoire du Guangxi jusqu'à la formation d'un nouveau gouvernement local, bien que les chances pour le Guangxi de conserver son indépendance semblent minces, à moins que d'autres factions ne déclarent leur indépendance vis-à-vis du gouvernement central.§!"
 POLITICS_SUN_DU_UPRISING_DESC:0 "§gMécontents des réformes et des politiques du gouvernement central de Nankin, Sun Du et ses partisans ont déclaré faire sécession de la République de Chine. Sun s'est proclamé gouverneur militaire provisoire du Yunnan jusqu'à la formation d'un nouveau gouvernement local, même si les chances pour que le Yunnan conserve son indépendance semblent minces, à moins que d'autres factions ne déclarent leur indépendance vis-à-vis du gouvernement central.§!"
 POLITICS_DING_DELONG_UPRISING_DESC:0 "§gMécontents des réformes et des politiques du gouvernement central de Nankin, Ding Delong et ses partisans ont déclaré faire sécession de la République de Chine. Ding s'est proclamé gouverneur militaire provisoire du Hunan jusqu'à la formation d'un nouveau gouvernement local, bien que les chances pour le Hunan de conserver son indépendance semblent minces, à moins que d'autres factions ne déclarent leur indépendance vis-à-vis du gouvernement central.§!"
