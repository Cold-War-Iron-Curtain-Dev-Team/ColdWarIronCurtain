 Chinese_faction_category:0 "Le pacte de Nankin"
 Border_Conflict_PRC:0 "Provoquer un conflit frontalier avec le PCC"
 Border_Conflict_PRC_desc:0 "Si nous entrions en guerre contre le PCC, nous serions très probablement confrontés à l'ensemble de l'Armée rouge de l'URSS. Nous ne sommes pas en mesure de combattre l'ensemble du Pacte de Varsovie à l'heure actuelle, mais nous pourrions provoquer un incident à la frontière afin de tester les capacités actuelles de l'APL."
 Chinese_faction_category_desc:0 "Alors que l'ère de l'impérialisme et du colonialisme touche lentement à sa fin, le communisme reste une menace sérieuse pour l'Asie. Avec le soutien de l'Union soviétique, de nombreux pays ont instauré des dictatures communistes et renforcé leurs capacités militaires. Si nous voulons mettre un terme à la propagation du communisme en Asie de l'Est, nous devons établir une alliance militaire avec les États anticommunistes de la région et les aider à renforcer leurs forces armées afin de résister à toute invasion communiste."
 Escalate_war_PRC:0 "Lancer l'invasion de la Mandchourie"
 Escalate_war_PRC_desc:0 ""
 Negotiate_Ports:0 "Négocier avec les puissances occidentales"
 Negotiate_Ports_desc:0 "Même si nous avons adopté une position anti-impérialiste, nous pourrions peut-être adopter une approche pacifique et essayer de renégocier avec les Britanniques et les Portugais le statut de Macao et de Hong Kong. Après tout, leurs empires coloniaux commencent lentement à se désintégrer et, comme l'a montré la crise de Suez, l'URSS et les États-Unis n'interviendront pas en faveur du colonialisme."
 Red_Spear_Uprising:0 "Révolte de la Lance rouge"
 End_the_Warlord_Period:0 "Mettre fin à la période des seigneurs de guerre"
 Vietnam_aggression1:0 "Envahir le Nord-Vietnam"
 Vietnam_limited_intervention:0 "Envoyer des volontaires au Sud-Vietnam"
 Vietnam_peaceful1:0 "Déclarer la neutralité envers le Vietnam"
 korea_aggression1:0 "Envahir la Corée du Nord"
 Korea_protection1:0 "Protéger la Corée du Sud"
 korea_neutrality1:0 "Déclarer la neutralité envers la Corée"
 Chiang_Ching_kuo_Infrastructure_projects_category:0 "Les huit grands projets de construction"
 Chiang_Ching_kuo_Infrastructure_projects_category_desc:0 "Proposés par le Premier ministre Chiang Ching-kuo, les huit grands projets de construction sont les projets d'infrastructure nationale prévus dans les années 1970 en République de Chine. Le gouvernement estime que le pays manque encore d'infrastructures essentielles telles que des autoroutes, des ports maritimes, des aéroports et des centrales électriques. De plus, la Chine subit les effets importants de la crise pétrolière de 1973. C'est pourquoi, afin de moderniser l'industrie et de favoriser le développement du pays, le gouvernement a prévu de se lancer dans divers projets de construction de grande envergure."
 Build_CKS_Airport:0 "Construire l'aéroport international Chiang Kai-shek à Chongqing"
 Build_Nanjing_Museum:0 "Construire le Musée national du Mémorial à Nanjing"
