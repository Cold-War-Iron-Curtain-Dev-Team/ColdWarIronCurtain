 Build_Railroads:0 "Développer les chemins de fer"
 Build_Infrastructure:0 "Infrastructures de base pour les régions sous-développées"
 Invite_Siam_Council:0 "Inviter la Thaïlande au Conseil de Nanjing"
 Invite_Phillipines_Council:0 "Inviter les Philippines au Conseil de Nanjing"
 Invite_Japan_Council:0 "Inviter le Japon au Conseil de Nanjing"
 Declare_Victory_over_Socialism_in_China:0 "Proclamer la victoire sur le socialisme en Asie"
 Sino_American_Relations_Taiwan_50s_category:0 "Relations sino-américaines"
 Sino_American_Relations_Taiwan_50s_category_desc:0 "Les États-Unis d'Amérique ont été notre plus proche allié dans la guerre contre le Japon, nous fournissant divers conseillers, équipements et technologies pour combattre l'armée japonaise. Après la chute de la Chine continentale et l'invasion de la Corée du Sud par le régime de Pyongyang, les États-Unis ont déclaré leur soutien à notre lutte contre le communisme en Asie. Leur arsenal militaire sera très utile à notre armée et jouera un rôle crucial dans la reconquête de la Chine continentale. Mais il serait sage de limiter l'impact politique que Washington aura..."
