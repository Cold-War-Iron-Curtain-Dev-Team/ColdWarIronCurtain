 KMT_60s_Political_Executive_Democracy:0 "Une « démocratie » paternaliste"
 KMT_60s_Political_Executive_Democracy_desc:0 "C'est uniquement grâce au généralissime Tchang Kaï-chek que le pays a survécu à l'insurrection marxiste et a pu se remettre de la Seconde Guerre mondiale et de la guerre civile. Mais tant que le Parti communiste tient toujours ses positions en Mandchourie et bénéficie du soutien de l'Union soviétique, nous ne pouvons autoriser aucune réforme démocratique tant que le PCC n'aura pas été vaincu une fois pour toutes. Le président Tchang Kaï-chek, malgré son grand âge, nous guidera à travers ces temps difficiles et ramènera la paix et l'ordre dans notre république."
 KMT_60s_Political_Executive_Democracy_continue_terror:0 "Réorganiser la Terreur blanche"
 KMT_60s_Political_Executive_Democracy_continue_terror_desc:0 "Au cours des dernières décennies, nous avons traqué toute dissidence politique liée aux communistes et les avons écrasés. Si cette stratégie s'est avérée efficace contre les espions et les infiltrations du PCC, elle a considérablement nui à la réputation du Kuomintang en tant que parti du peuple, étant donné que des militants sociaux-démocrates et libéraux ont eux aussi été traqués, arrêtés et exécutés. Nous devons donner la priorité aux maoïstes en tant que principale cible politique, tout en gardant un œil attentif sur les autres militants politiques afin de nous assurer qu'ils ne deviendront pas une menace pour notre pouvoir à l'avenir."
 KMT_60s_Political_Executive_Democracy_utilize_shanghai_crime:0 "Poursuivre la coopération avec les gangs de Shanghai"
 KMT_60s_Political_Executive_Democracy_utilize_shanghai_crime_desc:0 "Grâce à ses liens avec le Gang Vert, impliqué dans le trafic d’opium, la prostitution, l’extorsion et les jeux d’argent, le Kuomintang a amassé d’énormes sommes d’argent et continuera de le faire si nous permettons au Gang Vert de poursuivre ses activités à Shanghai. Non seulement ses profits profiteront grandement à notre gouvernement, mais aussi ses ressources humaines, qui ont souvent perturbé et infiltré les cellules maoïstes et les syndicats par le passé. Cependant, la corruption au sein de cette société secrète constituera sans aucun doute un défi de taille à relever. Néanmoins, le gouvernement a un besoin urgent de l'argent et des ressources du Green Gang."
 KMT_60s_Political_Executive_Democracy_invest_in_army:0 "Investissements dans l'armée"
 KMT_60s_Political_Executive_Democracy_invest_in_army_desc:0 "Il existe un vieil adage concernant l'ancien État de Prusse qui dit : « La Prusse est une armée dotée d'un État. » Le Kuomintang s'est lui aussi appuyé sur son armée tout au long de son histoire, depuis la Campagne du Nord jusqu'à aujourd'hui. C'est pourquoi nous continuerons d'investir dans les forces armées afin d'assurer la survie de notre régime jusqu'à ce que nous puissions entamer la troisième phase de la Révolution et enfin instaurer la démocratie dans le pays. Mais personne ne peut dire quand exactement cela se produira."
 KMT_60s_Political_Executive_Democracy_reform_prison_system:0 "Réformer notre système pénitentiaire"
 KMT_60s_Political_Executive_Democracy_reform_prison_system_desc:0 "Dans le cadre de la réorganisation de nos mesures répressives, nous apporterons également quelques changements à la manière dont sont traités les prisonniers politiques. La peine de mort sera maintenue, mais elle ne sera appliquée qu’en cas de trahison, de désertion et de meurtre. En dehors de cela, nous devrions nous efforcer de privilégier la réinsertion et la rééducation des individus qui enfreignent la loi, plutôt que de les torturer et de les traiter comme des êtres humains de seconde zone. Nous investirons davantage dans les prisons des zones urbaines afin d'encourager les anciens criminels à s'adapter à notre système et de ne pas les remplir de haine et de colère à notre égard."
 KMT_60s_Political_Executive_Democracy_appease_sino_liberals:0 "« Promesse » de réformes libérales"
 KMT_60s_Political_Executive_Democracy_appease_sino_liberals_desc:0 "Il existe encore au sein de notre gouvernement un grand nombre de personnalités sino-libérales influentes qui s'opposent aux politiques de Tchang Kaï-chek et des partisans de la ligne dure. Leur influence est trop grande pour que l'on puisse les écarter ; nous allons donc les satisfaire en leur promettant que nous finirons par mettre en place des réformes sociales et une démocratie limitée.\n\nÀ terme."
 KMT_60s_Political_Executive_Democracy_tackle_corruption:0 "Lutter contre la corruption locale"
 KMT_60s_Political_Executive_Democracy_tackle_corruption_desc:0 "La corruption est responsable de la perte de soutien populaire dont souffrent les gouvernements et elle détruira toute confiance du peuple dans nos institutions politiques. Chiang Ching-kuo, fils du Généralissime, a proposé de lancer diverses purges contre les fonctionnaires corrompus au sein du Kuomintang. Étant donné que le PCC finira par nous attaquer à nouveau, nous ne pouvons pas prendre le risque que des ressources précieuses finissent dans les poches d'individus cupides au lieu d'être affectées aux forces armées et au secteur économique."
 KMT_60s_Political_Executive_Democracy_councils:0 "Conseils de district"
 KMT_60s_Political_Executive_Democracy_councils_desc:0 "Maintenant que nous contrôlons presque toute la Chine et que nous ne dépendons plus des cliques de seigneurs de guerre, nous devons mettre en place des conseils locaux qui nous représenteront au niveau local. Nous autoriserons certes les habitants à voter, mais seuls les responsables du Kuomintang seront autorisés à se présenter aux élections. Cela devrait suffire à apaiser en partie les revendications démocratiques tout en préservant notre influence dans les zones rurales."
 KMT_60s_Political_Executive_Democracy_carrot_stick:0 "Prendre exemple sur Bismarck"
 KMT_60s_Political_Executive_Democracy_carrot_stick_desc:0 "Les « Sozialistengesetze », également connues sous le nom de « lois socialistes », visaient à réprimer les camps socialistes et sociaux-démocrates en Allemagne à la suite des tentatives d'assassinat contre l'empereur Guillaume Ier perpétrées par des socialistes radicaux. Ces lois finirent par se retourner contre leurs auteurs et renforcèrent le mouvement social-démocrate en Allemagne, le SPD devenant ainsi le parti le plus puissant au Parlement. Nous devrions tirer les leçons des erreurs de Bismarck en accordant davantage de concessions aux paysans afin de les encourager à soutenir notre programme plutôt que de suivre la propagande communiste."
 KMT_60s_Political_Executive_Democracy_sham_elections_preparation:0 "Calendrier des « élections » au Yuan législatif"
 KMT_60s_Political_Executive_Democracy_sham_elections_preparation_desc:0 "Le Yuan législatif fait office de parlement de la République de Chine et représente les intérêts du peuple ; toutefois, en raison des menaces internes et externes qui pèsent sur la République, nous ne pouvons autoriser la tenue d'élections libres et légales qui permettraient à des partis opposés au Kuomintang d'être élus au Parlement. Mais afin de satisfaire les mouvements libéraux au sein du pays et de préserver notre réputation de république sur la scène internationale, nous autoriserons divers autres partis fidèles au KMT à obtenir des sièges au Parlement."
 KMT_60s_Political_Executive_Democracy_Change_constitutions:0 "Renforcer l'exécutif"
 KMT_60s_Political_Executive_Democracy_Change_constitutions_desc:0 "Nous allons apporter quelques modifications à la Constitution de 1947, en nous inspirant des modèles américain et français, où le président dispose de pouvoirs considérables. De cette manière, nous pourrons justifier en partie notre régime autoritaire temporaire sur le plan constitutionnel et éviter que l'opposition grandissante au sein du Yuan législatif ne vienne concurrencer notre pouvoir."
 KMT_60s_Political_Executive_Democracy_Social_reforms:0 "Mettre en place des réformes sociales"
 KMT_60s_Political_Executive_Democracy_Social_reforms_desc:0 "Dans le cadre de notre stratégie de la carotte et du bâton, nous mettrons en place diverses réformes sociales visant à améliorer les conditions de vie du paysan chinois moyen. Si nous parvenons à les satisfaire suffisamment, ils ne se laisseront pas berner par la propagande du PCC, qui cherche à leur faire croire à ses idéaux utopiques. Nous devrions envisager de mettre en œuvre davantage de réformes dans un avenir proche si nous ne voulons pas risquer de perdre le soutien de la population."
 KMT_60s_Political_Executive_Democracy_limit_bureaucratic_capitalism:0 "Limiter le capitalisme bureaucratique"
 KMT_60s_Political_Executive_Democracy_limit_bureaucratic_capitalism_desc:0 "L'économie de la République repose actuellement sur les entreprises publiques et les sociétés exerçant des activités économiques. Nous devrions accorder davantage de liberté aux entreprises privées indépendantes du gouvernement afin de garantir la croissance économique et de lutter contre la corruption."
 KMT_60s_Political_Executive_Democracy_vice_president_elections:0 "Organiser les élections à la vice-présidence"
 KMT_60s_Political_Executive_Democracy_vice_president_elections_desc:0 "Les pressions internationales et extérieures nous obligent à accorder davantage de libertés politiques. Le gouvernement a décidé de modifier le mode d'élection du vice-président. Le vice-président ne détient pas beaucoup de pouvoir par rapport au président, ce qui rend cette élection moins importante sur le plan politique que les élections au Yuan législatif. Les candidats les plus populaires sont Sun Fo, fils du fondateur de la République, Sun Yat-sen, et l'ancien gouverneur de la province de Taïwan et célèbre commandant de la NRA, Chen Cheng, tous deux très proches du Kuomintang depuis plusieurs décennies. Ils ne s'écarteront certainement pas de la ligne politique du généralissime."
