l_english:
 SOV_woodmetal_frames:0 "Missile R-1"
 SOV_woodmetal_frames_short:0 "R-1"
 SOV_woodmetal_frames_desc:0 "La fusée R-1 (nom de code OTAN SS-1 Scunner, nom de code soviétique SA11, indice GRAU 8A11) était un missile balistique tactique fabriqué en Union soviétique sur la base de la fusée allemande V-2. Bien qu’il s’agisse d’une copie, elle fut produite à l’aide des installations industrielles soviétiques et permit à l’URSS d’acquérir une précieuse expérience qui rendit possible, par la suite, la construction de fusées bien plus performantes. Le système de missile R-1 entra en service dans l’armée soviétique le 28 novembre 1950."
 SOV_pressure_vessel1:0 "R-5 Pobeda"
 SOV_pressure_vessel1_short:0 "R-5 Pobeda"
 SOV_pressure_vessel1_desc:0 "La R-5 Pobeda (\"Victoire\") était un missile balistique de théâtre développé par l'Union soviétique pendant la guerre froide. La version R-5M reçut le nom de code OTAN SS-3 Shyster et portait l'indice GRAU 8K51. La R-5 était à l'origine un développement de l'OKB-1 en tant que missile à une seule étape avec un véhicule de rentrée de charge utile détachable. La R-5M était un missile à charge nucléaire – le premier missile nucléaire déployé par l'Union soviétique – avec une capacité de charge utile et un poids plus importants, mais offrant une meilleure fiabilité que son prédécesseur. La R-5M donna à l'Union soviétique la capacité de cibler de nombreux objectifs stratégiques en Europe. La R-5M entra en service le 21 mai 1956 (retirée en 1967) et en 1959, elle fut installée à Vogelsang, Zehdenick et Fürstenberg/Havel en Allemagne de l'Est - les premières bases de missiles nucléaires soviétiques en dehors de l'URSS."
 SOV_pressure_vessel2:0 "Vostok"
 SOV_pressure_vessel2_short:0 "Vostok"
 SOV_pressure_vessel2_desc:0 "Vostok (russe : Восток, traduit par \"Est\") était une famille de fusées dérivées du missile balistique intercontinental soviétique R-7 Semyorka et conçue pour le programme de vols spatiaux habités. Cette famille de fusées lança le premier satellite artificiel (Spoutnik 1) et le premier vaisseau spatial habité (Vostok) de l'histoire de l'humanité. Elle faisait partie de la famille de fusées R-7. Le 18 mars 1980, une fusée Vostok-2M explosa sur sa rampe de lancement à Plesetsk lors d'une opération de ravitaillement, tuant 48 personnes. Une enquête sur un accident similaire – mais évité – révéla que le remplacement de la soudure à base de plomb par de la soudure à base d'étain dans les filtres de peroxyde d'hydrogène permettait la dégradation du H2O2, provoquant ainsi l'explosion résultante."
 SOV_pressure_vessel3:0 "N1/L3"
 SOV_pressure_vessel3_short:0 "N1/L3"
 SOV_pressure_vessel3_desc:0 "Le N1/L3 (Raketa-nositel', \"Fusée porteuse\"; cyrillique : Н1) était un lanceur super lourd destiné à livrer des charges utiles au-delà de l'orbite terrestre basse. Le N1 était le contrepartie soviétique du Saturn V américain et visait à permettre les voyages habités vers la Lune et au-delà, avec des études débutant dès 1959. Sa première étape reste la plus puissante jamais construite, mais toutes les quatre premières étapes du N1 Block A ont échoué, car l'absence d'essais statiques a fait en sorte que les problèmes de tuyauterie et d'autres caractéristiques défavorables liés au grand groupe de trente moteurs et à son système complexe d'alimentation en carburant et oxydant ne furent pas révélés plus tôt."
 SOV_pressure_vessel4:0 "Energia"
 SOV_pressure_vessel4_short:0 "Energia"
 SOV_pressure_vessel4_desc:0 "Energia (GRAU 11K25) était un lanceur super lourd. Il a été conçu par NPO Energia de l'Union soviétique pour une variété de charges utiles, y compris le vaisseau spatial Buran. L'entreprise principale développant le système de contrôle était le NPO Khartron \"Electropribor\". L'Energia utilisait quatre propulseurs d'appoint, chacun alimenté par un moteur RD-170 à quatre chambres brûlant du kérosène/LOX, et un noyau central avec quatre moteurs RD-0120 (11D122) à chambre unique, alimentés par de l'hydrogène liquide/LOX. Le lanceur avait deux variantes opérationnelles fonctionnellement différentes : Energia-Polyus, la configuration de test initiale, dans laquelle le système Polyus était utilisé comme étage final pour mettre la charge utile en orbite, et Energia-Buran, dans laquelle les orbiteurs de classe Buran étaient la charge utile et la source de l'impulsion d'insertion orbitale. Le lanceur avait la capacité de placer environ 100 tonnes en orbite terrestre basse, jusqu'à 20 tonnes en orbite géostationnaire et jusqu'à 32 tonnes sur une trajectoire translunaire vers l'orbite lunaire. Le lanceur a effectué seulement deux vols orbitaux avant d'être abandonné. Depuis 2016, des tentatives ont été faites pour relancer ce lanceur."
 SOV_pressure_vessel5:0 "Angara-A5"
 SOV_pressure_vessel5_short:0 "Angara-A5"
 SOV_pressure_vessel5_desc:0 "\"Angara-A5\" - Véhicule de lancement de classe lourde russe de la famille \"Angara\". Le carburant écologique de la fusée (oxygène + kérosène) permet de réduire la charge environnementale des lancements sur l'environnement. Il est lancé avec cinq modules de fusée universels URM-1, qui sont équipés de moteurs RD-191 (quatre modules dans la première étape et un dans la deuxième)."
 SOV_pressure_vessel6:0 "Yenisei"
 SOV_pressure_vessel6_short:0 "Yenisei"
 SOV_pressure_vessel6_desc:0 "Yenisei, nom de projet RN STK-1 (Raketa-Nositel' SverkhTyazhologo Klassa - Véhicule de lancement de classe super-lourde), est le premier lanceur super-lourd en développement par l'industrie spatiale russe. Le principal développeur est le RSC Energia. Il est développé dans le cadre du programme fédéral \"Création d'un complexe de fusée spatiale de classe super-lourde pour 2020-2030\", et le coût du programme est estimé à 1,5 trillion de roubles. C'est la fusée principale du programme lunaire russe. La conception finale de la fusée devrait être terminée d'ici l'automne 2021. Le premier lancement est prévu pour 2028 depuis le cosmodrome de Vostochny. Basé sur le lanceur Yenisei, le lanceur Don (RN STK-2) est en développement en ajoutant un autre étage."
 SOV_liquid_propellant:0 "NK-9 (8D517)"
 SOV_liquid_propellant_short:0 "NK-9 (8D517)"
 SOV_liquid_propellant_desc:0 "Le NK-9 (8D517) est un moteur-fusée à propergol liquide développé par le SNTK im. ND Kuznetsova. Depuis mai 1959, le développement des moteurs-fusées à propergol liquide a commencé. L'un des premiers moteurs-fusées développés a été le moteur NK-9. Le NK-9 était destiné à la première étape du missile intercontinental GR-1 \"Global-1\" (SS-10 selon la classification OTAN). Il s'agissait du premier moteur à oxygène et kérosène au monde dans la classe de poussée supérieure à 1 MN, fabriqué en circuit fermé avec post-combustion des gaz de générateur dans la chambre de combustion. Pour la deuxième étape de ce missile, le moteur NK-9V a été développé. Ses essais ont commencé en septembre 1962. Au début des années 1960, sur la base du NK-9, les moteurs-fusées NK-19 et NK-21 ont été créés pour les troisième et quatrième étapes du lanceur N1."
 SOV_nuclear_pulse_propulsion:0 "RD-0410"
 SOV_nuclear_pulse_propulsion_short:0 "RD-0410"
 SOV_nuclear_pulse_propulsion_desc:0 "Le RD-0410 était un moteur-fusée nucléaire thermique soviétique. Le moteur a été testé au sol au site d'essais de Semipalatinsk, et son utilisation a été intégrée dans la proposition de mission habitée Mars 1994 de Kurchatov. Ce moteur avait des performances légèrement supérieures (température des gaz d'échappement et impulsion spécifique) à celles du projet américain de moteur-fusée nucléaire thermique NERVA. La conception du cœur du réacteur comprenait une isolation thermique entre le carburant en carbure d'uranium/carbure de tungstène et le modérateur en hydride de zirconium. Cette solution permettait une conception très compacte du cœur du réacteur. Le flux d'hydrogène refroidissait d'abord le modérateur, permettant de maintenir une énergie de neutron très faible et une forte section efficace de fission, puis il était chauffé par contact direct avec les tiges de carburant. Pour prévenir la réaction chimique entre le carbure et l'hydrogène, environ 1 % d'heptane était ajouté à l'hydrogène après le passage dans le modérateur."
 SOV_geosynchronous_network:0 "Cyclone"
 SOV_geosynchronous_network_short:0 "Cyclone"
 SOV_geosynchronous_network_desc:0 "Cyclone (la version civile du système est connue sous le nom de \"Tsikada\") - le premier système de navigation par satellite en URSS, construit sur la base des engins spatiaux (ES) \"Cyclone\" et \"Zaliv\" (indice GUKOS - 11F617), qui comprenait trois complexes matériels : Tsunami-AM sur satellites artificiels, Tsunami-BM (P-790) sur navires et Tsunami-VM sur installations côtières."