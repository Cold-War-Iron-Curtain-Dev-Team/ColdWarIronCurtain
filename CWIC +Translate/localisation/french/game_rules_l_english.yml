 RULE_OPTION_CYP_ENOSIS: "@GRE L'énosis est devenue réalité"
 RULE_OPTION_CYP_ENOSIS_DESC: "Que ce soit par la négociation ou par une insurrection armée, Chypre rejoindra la Grèce. La Grande-Bretagne et la Turquie accepteront ce dénouement."
 RULE_OPTION_CYP_INDEPENDENCE: "£GFX_game_rule_flags_CYP   Indépendance de Chypre"
 RULE_OPTION_CYP_INDEPENDENCE_DESC: "Les négociations aboutiront à la création d'un État indépendant à Chypre. La Grande-Bretagne et la Turquie accepteront ce résultat.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_CYP_STATUS_QUO: "@ENG Le statu quo perdure"
 RULE_OPTION_CYP_STATUS_QUO_DESC: "§YConditions requises :§! §CLes communistes ont remporté la guerre civile grecque.§!\nLa Grèce ne s'impliquera pas à Chypre, et le régime actuel restera en place."
 RULE_OPTION_CYP_TAKSIM: "@TUR @GRE Taksim imposé"
 RULE_OPTION_CYP_TAKSIM_DESC: "§YConditions requises :§! §CLa CEOKA a obtenu l'indépendance par la force.§!\nChypre sera divisée en une zone turque au nord et une zone grecque au sud."
 RULE_OPTION_CYP_TURKISH_RULE: "@TUR Rétablissement de la domination turque"
 RULE_OPTION_CYP_TURKISH_RULE_DESC: "§YConditions requises :§! §CLa CEOKA a imposé l'indépendance par la force.§!\nL'armée turque va occuper et annexer Chypre ;"