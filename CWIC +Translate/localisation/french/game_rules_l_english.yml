 LBA_ADMINISTRATIVE_STRUCTURE: "£GFX_game_rule_flags_LBA   [1950s] Structure administrative"
 LBA_ADMINISTRATIVE_STRUCTURE_DESC: "L'indépendance de la Libye ayant été proclamée, le nouveau régime doit mener un débat crucial sur la conception de la structure administrative, car les régions du pays ont toujours été distinctes les unes des autres."
 RULE_OPTION_LBA_UNITARY_KINGDOM: "Royaume unitaire"
 RULE_OPTION_LBA_UNITARY_KINGDOM_DESC: "La Libye sera organisée selon un modèle unitaire, ce qui provoquera des troubles à Tripoli et dans le Fezzan."
 RULE_OPTION_LBA_FEDERAL_KINGDOM: "Royaume fédéral"
 RULE_OPTION_LBA_FEDERAL_KINGDOM_DESC: "La Libye sera organisée selon un modèle unitaire, accordant une autonomie à Tripoli et au Fezzan. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 LBA_1952_CONSTITUTION: "£GFX_game_rule_flags_LBA   Constitution de 1952"
 LBA_1952_CONSTITUTION_DESC: "La Libye unifiée ayant obtenu son indépendance, le nouveau royaume doit désormais rédiger une constitution. Bien sûr, la question de l'administration n'est pas encore réglée."
 RULE_OPTION_LBA_STATUS_QUO_MONARCHY: "Monarchie de statu quo"
