 CAN_1958_ELECTIONS_RULE: "@CAN Élections de 1958"
 RULE_OPTION_CAN_CCF_1958: "Victoire du CCF"
 RULE_OPTION_CAN_CCF_1958_DESC: "Le CCF remportera les élections."
 RULE_OPTION_CAN_LIBERAL_1958: "Victoire des libéraux"
 RULE_OPTION_CAN_LIBERAL_1958_DESC: "Les libéraux vont remporter les élections."
 RULE_OPTION_CAN_PROGCON_1958: "Victoire du Parti progressiste-conservateur"
 RULE_OPTION_CAN_PROGCON_1958_DESC: "Les conservateurs progressistes remporteront les élections. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 CUB_1958_ELECTIONS_RULE: "@CUB Élections présidentielles de 1958"
 RULE_OPTION_CUB_AGUERO_1958: "Agüero remporte le titre"
 RULE_OPTION_CUB_AGUERO_1958_DESC: "Andrés Agüero sera élu président. Il mettra en place des forces anti-paramilitaires et sollicitera le soutien des États-Unis pour vaincre le Mouvement du 26 juillet."
 RULE_OPTION_CUB_STERLING_1958: "Sterling remporte la victoire"
 RULE_OPTION_CUB_STERLING_1958_DESC: "Carlos Sterling sera élu président. Il rétablira les libertés politiques et sollicitera le soutien des États-Unis pour conclure la paix avec le Mouvement du 26 juillet."
 RULE_OPTION_CUB_REVOLUTION: "La Révolution cubaine"
 RULE_OPTION_CUB_REVOLUTION_DESC: "Fidel Castro et le Mouvement du 26 juillet renverseront le régime de Batista.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 DOM_1957_ELECTIONS_RULE: "@DOM Élections présidentielles de 1957"
 RULE_OPTION_DOM_TRUJILLO_1957: "Hector Trujillo remporte la victoire"
 RULE_OPTION_DOM_TRUJILLO_1957_DESC: "Hector Trujillo, frère de Rafael Trujillo, sera élu président. La famille Trujillo continuera à contrôler la République dominicaine.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_DOM_BALAGUER_1957: "Joaquin Balaguer remporte la victoire"
 RULE_OPTION_DOM_BALAGUER_1957_DESC: "Joaquin Balaguer sera élu président. La famille Trujillo sera écartée du pouvoir ; un régime à parti unique sera mis en place à sa place."
 DOM_ANTIHAITIANISMO_RULE: "@DOM [1950s] Anti-haïtianisme"
 RULE_OPTION_DOM_CONTINUE_ANTIHAITIANISMO: "Garder le cap"
 RULE_OPTION_DOM_CONTINUE_ANTIHAITIANISMO_DESC: "L'anti-haïtianisme persiste, tout comme la répression culturelle des Haïtiens et les tensions diplomatiques avec Haïti."
 RULE_OPTION_DOM_SLOW_DOWN_ANTIHAITIANISMO: "Ralentir"
 RULE_OPTION_DOM_SLOW_DOWN_ANTIHAITIANISMO_DESC: "L'anti-haïtianisme sera freiné ; mise en place de mesures de protection culturelle en faveur des Haïtiens, avec une visite d'État en Haïti."
 ENG_1950_ELECTIONS: "@ENG Élections de 1950"
 RULE_OPTION_ENG_ATLEE_1950: "Clément Attlee remporte la victoire"
 RULE_OPTION_ENG_ATLEE_1950_DESC: "Clement Atlee remportera les élections. Au cours de son mandat, il s'attachera à développer l'industrie militaire.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_ENG_BEVAN_1950: "Aneurin Bevan remporte la victoire"
 RULE_OPTION_ENG_BEVAN_1950_DESC: "Aneurin Bevan remportera les élections. Au cours de son mandat, il mettra en œuvre d'importantes réformes de gauche, qui finiront par conduire à des élections anticipées."
 ENG_1959_ELECTIONS: "@ENG Élections de 1959"
 ENG_1959_ELECTIONS_DESC: ""
 RULE_OPTION_ENG_MACMILLAN_1959: "Harold Macmillan remporte la victoire"
 RULE_OPTION_ENG_MACMILLAN_1959_DESC: "Harold Macmillan et le Parti conservateur remporteront les élections.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_ENG_GRIMOND_1959: "Jo Grimond remporte la victoire"
 RULE_OPTION_ENG_GRIMOND_1959_DESC: "Jo Grimond et le Parti libéral remporteront les élections."
 RULE_OPTION_ENG_GAITSKELL_1959: "Hugh Gaitskell remporte la victoire"
 RULE_OPTION_ENG_GAITSKELL_1959_DESC: "Hugh Gaitskell et le Parti travailliste remporteront les élections."
 BEL_1949_ELECTIONS_RULE: "@BEL Élections de 1949"
 RULE_OPTION_BEL_CSP_1949: "Victoire du CSP"
 RULE_OPTION_BEL_CSP_1949_DESC: "Le CSP remportera les élections. Au cours de ce mandat, il s'attachera à éradiquer les vestiges du nazisme en Belgique."
 RULE_OPTION_BEL_BSP_1949: "Victoire du BSP"
 RULE_OPTION_BEL_BSP_1949_DESC: "Le BSP remportera les élections. Au cours de ce mandat, il mettra l'accent sur les politiques sociales et les mouvements syndicaux."
 BEL_FATE_OF_MONARCHY_RULE: "@BEL [1950s] Le sort de la monarchie"
 RULE_OPTION_BEL_REFERENDUM_SUCCESS: "Référendum - Succès"
 RULE_OPTION_BEL_REFERENDUM_SUCCESS_DESC: "Le gouvernement soumettra la question de la monarchie à un référendum, qui aboutira grâce au soutien des monarchistes flamands."
 RULE_OPTION_BEL_REFERENDUM_FAILURE: "Référendum - Le Roi est bloqué"
 RULE_OPTION_BEL_REFERENDUM_FAILURE_DESC: "Le gouvernement soumettra la question de la monarchie à un référendum. Même si le référendum est approuvé, l'opposition wallonne empêchera le roi d'assumer ses fonctions."
 RULE_OPTION_BEL_RETURN_IGNORE: "Retour du roi - Les attaques sont ignorées"
 RULE_OPTION_BEL_RETURN_IGNORE_DESC: "Le roi rentrera en Belgique sans délai. Les grèves générales organisées contre le roi seront ignorées."
 RULE_OPTION_BEL_RETURN_NEGOTIATE: "Le retour du Roi - Les attaquants font l'objet de négociations"
 RULE_OPTION_BEL_RETURN_NEGOTIATE_DESC: "Le roi rentrera en Belgique sans délai. Les grèves générales contre le roi feront l'objet de négociations."
 BEL_1950_ELECTIONS_RULE: "@BEL Élections de 1950"
 RULE_OPTION_BEL_CSP_1950: "Victoire du CSP"
 RULE_OPTION_BEL_CSP_1950_DESC: "Le CSP remportera les élections. Au cours de ce mandat, il permettra au roi de reprendre ses fonctions ; et il y aura trois Premiers ministres différents au cours de ce mandat."
 RULE_OPTION_BEL_BSP_1950: "Victoire du BSP"
 RULE_OPTION_BEL_BSP_1950_DESC: "Le BSP remportera les élections. Au cours de ce mandat, il poursuivra sa ligne anti-monarchiste et mettra en œuvre des politiques socialistes."
 BEL_1954_ELECTIONS_RULE: "@BEL Élections de 1954"
 RULE_OPTION_BEL_CSP_1954: "Victoire du CSP"
 RULE_OPTION_BEL_CSP_1954_DESC: "Le CSP remportera les élections. Au cours de ce mandat, il devra faire face à la récession économique et s'attachera à renforcer ses liens avec l'Occident."
 RULE_OPTION_BEL_BSP_1954: "Victoire du BSP"
 RULE_OPTION_BEL_BSP_1954_DESC: "Le BSP remportera les élections. Au cours de ce mandat, il mettra en œuvre des politiques social-démocrates."
 BEL_1958_ELECTIONS_RULE: "@BEL Élections de 1958"
 RULE_OPTION_BEL_CSP_1958: "Victoire du CSP"
 RULE_OPTION_BEL_CSP_1958_DESC: "Le CSP remportera les élections. Au cours de ce mandat, il formera une coalition avec le BSP afin de résoudre les problèmes sociaux."
 RULE_OPTION_BEL_BSP_1958: "Victoire du BSP"
 RULE_OPTION_BEL_BSP_1958_DESC: "Le BSP remportera les élections. Au cours de ce mandat, il se concentrera davantage sur la situation au Congo."
 WGR_1949_ELECTIONS: "@WGR Élections de 1949"
 WGR_1949_ELECTIONS_DESC: "L'indépendance de l'Allemagne étant rétablie, les premières élections libres suscitent un vif intérêt tant au niveau national qu'international."
 RULE_OPTION_WGR_ADENEUER_1949_HISTORICAL: "Adenauer élu – Tout va bien"
 RULE_OPTION_WGR_ADENEUER_1949_HISTORICAL_DESC: "Konrad Adenauer sera élu. Il échappera de justesse à un attentat, ce qui conduira à l'interdiction du Parti socialiste du Reich. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_WGR_ADENEUER_1949_ASSASSINATED: "Adenauer élu - assassiné"
 RULE_OPTION_WGR_ADENEUER_1949_ASSASSINATED_DESC: "Konrad Adenauer sera élu. Plus tard, il sera assassiné, ce qui permettra au Parti socialiste du Reich de gagner en popularité."
 RULE_OPTION_WGR_SCHUMACHER_1949_RESIGNS: "Élection de Schumacher - Démission"
 RULE_OPTION_WGR_SCHUMACHER_1949_RESIGNS_DESC: "Kurt Schumacher sera élu. Il refusera de coopérer avec le KPD et finira par démissionner au profit d'Ollenhauer."
 RULE_OPTION_WGR_SCHUMACHER_1949_SOCIALIST_UNITY: "Schumacher élu - SED"
 RULE_OPTION_WGR_SCHUMACHER_1949_SOCIALIST_UNITY_DESC: "Kurt Schumacher sera élu. Il fondera le SED ouest-allemand, ce qui permettra la §Yréunification allemande§! sous un régime §Rsocialiste§!"
 WGR_1953_ELECTIONS: "@WGR Élections de 1953"
 WGR_1953_ELECTIONS_DESC: "§YConditions requises :§! §RNON§! SED occidental \nLes deuxièmes élections générales auront lieu ; l'accent sera davantage mis sur la diplomatie. "
 RULE_OPTION_WGR_ADENEUER_1953: "Adeneuer élu"
 RULE_OPTION_WGR_ADENEUER_1953_DESC: "§YConditions requises :§! Adenauer est en vie \nKonrad Adenauer sera élu. Au cours de son mandat, il mettra en œuvre les principes de l'économie sociale de marché.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_WGR_OLLENHAUER_1953: "Ollenhauer élu"
 RULE_OPTION_WGR_OLLENHAUER_1953_DESC: "Erich Ollenhauer sera élu. Au cours de son mandat, il nouera des liens avec les pays du bloc de l'Est."
 RULE_OPTION_WGR_REMER_1953: "Remer élu"
 RULE_OPTION_WGR_REMER_1953_DESC: "§YConditions préalables :§! Adenauer est assassiné \nOtto Ernst Remer sera élu."
 WGR_1957_ELECTIONS: "@WGR Élections de 1957"
 RULE_OPTION_WGR_ADENEUER_1957_DROP_CLAIMS: "Élection d'Adenauer – Abandon des poursuites"
 RULE_OPTION_WGR_ADENEUER_1957_DROP_CLAIMS_DESC: "§YConditions requises :§! Adenauer est en vie \nKonrad Adenauer sera élu. Au cours de son mandat, il reconnaîtra la perte des territoires de l'Est et rétablira les relations avec la Pologne."
 RULE_OPTION_WGR_ADENEUER_1957_KEEP_CLAIMS: "Adenauer élu – Revendications maintenues"
 RULE_OPTION_WGR_ADENEUER_1957_KEEP_CLAIMS_DESC: "§YConditions requises :§! Adenauer est en vie \nKonrad Adenauer sera élu. Au cours de son mandat, il maintiendra les revendications sur les territoires de l'Est, ce qui créera des tensions."
 RULE_OPTION_WGR_OLLENHAUER_1957: "Ollenhauer élu"
 RULE_OPTION_WGR_OLLENHAUER_1957_DESC: "Erich Ollenhauer sera élu. Au cours de ce mandat, il proposera la §Yréunification allemande§! sous un régime §gneutre§!"
 WGR_NAVAL_REESTABLISHMENT: "@WGR [1950s] Restructuration de la marine"
 RULE_OPTION_WGR_DEFENSIVE_NAVY: "Marine défensive"
 RULE_OPTION_WGR_DEFENSIVE_NAVY_DESC: "La Marine fédérale allemande sera rétablie selon des doctrines défensives, en s'appuyant sur des sous-marins et des destroyers."
 RULE_OPTION_WGR_NAVAL_SUPREMACY: "Marine de la Domination"
 RULE_OPTION_WGR_NAVAL_SUPREMACY_DESC: "La Marine fédérale allemande sera réorganisée selon des doctrines de haute mer, en mettant l'accent sur les navires de combat."
 WGR_JOIN_NATO_AI: "@WGR £GFX_game_rule_flags_NATO  L'adhésion de l'Allemagne de l'Ouest à l'OTAN"
 RULE_OPTION_WGR_JOIN_NATO_SUCCESS: "L'Allemagne de l'Ouest devient membre de l'OTAN"
 RULE_OPTION_WGR_JOIN_NATO_SUCCESS_DESC: "Lorsqu'elle y sera invitée, l'Allemagne de l'Ouest deviendra membre de l'Organisation du Traité de l'Atlantique Nord."
 RULE_OPTION_WGR_JOIN_NATO_FAILURE: "L'Allemagne de l'Ouest reste en dehors de l'OTAN"
 RULE_OPTION_WGR_JOIN_NATO_FAILURE_DESC: "Lorsqu'elle sera invitée à rejoindre l'Organisation du Traité de l'Atlantique Nord, l'Allemagne de l'Ouest déclinera cette invitation et restera en dehors de l'organisation, même si elle continuera sans doute à s'aligner sur les pays occidentaux."
 DDR_EASTERN_CLAIMS: "£GFX_game_rule_flags_DDR   [1950s] Réclamations de l'Est"
 RULE_OPTION_DDR_RENOUNCE_CLAIMS: "Renoncer à toute réclamation"
 RULE_OPTION_DDR_RENOUNCE_CLAIMS_DESC: "Le gouvernement est-allemand reconnaîtra la perte des territoires orientaux au profit de la Pologne et de l'URSS, mettant ainsi fin au débat.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_DDR_DEMAND_CLAIMS: "Faire valoir ses droits"
 RULE_OPTION_DDR_DEMAND_CLAIMS_DESC: "Le gouvernement est-allemand va demander aux Soviétiques la restitution des territoires allemands perdus au profit de la Pologne."
 DDR_POST_STALIN_ROUTE: "£GFX_game_rule_flags_DDR   [1950s] Les conséquences du soulèvement de Berlin"
 RULE_OPTION_DDR_SECRETARY_RAU: "Le secrétaire Rau"
 RULE_OPTION_DDR_SECRETARY_RAU_DESC: "Le secrétaire en exercice, Walter Ulbricht, sera écarté et remplacé par Heinrich Rau. L'Allemagne de l'Est mènera désormais une politique révisionniste."
 RULE_OPTION_DDR_SECRETARY_ZAISSER: "Le secrétaire Zaisser"
 RULE_OPTION_DDR_SECRETARY_ZAISSER_DESC: "Le secrétaire en exercice, Walter Ulbricht, sera écarté et remplacé par Wilhelm Zaisser. L'Allemagne de l'Est mènera désormais une politique révisionniste."
 RULE_OPTION_DDR_SECRETARY_ULBRICHT: "Le secrétaire Ulbricht"
 RULE_OPTION_DDR_SECRETARY_ULBRICHT_DESC: "Walter Ulbricht conservera le pouvoir ; il mènera une déstalinisation modérée tout en éliminant les figures de proue de l'opposition au sein du parti. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_DDR_SECRETARY_HARICH: "M. Harich, secrétaire"
 RULE_OPTION_DDR_SECRETARY_HARICH_DESC: "Wolfgang Harich et son « groupe Harich » prendront le contrôle du SED. Ils procéderont à une libéralisation en profondeur de l'Allemagne de l'Est, ouvrant ainsi la voie à la §Yréunification allemande§! sous un §Crégime libéral§!"
 YUG_DJILAS_PRESIDENCY: "@YUG [1950s] Présidence de Djilas"
 RULE_OPTION_YUG_DJILAS_CRITIQUE_ACCEPTED: "Tito accepte les critiques de Djilas"
 RULE_OPTION_YUG_DJILAS_CRITIQUE_ACCEPTED_DESC: "Tito soutiendra Djilas. Les réformes suivantes permettront de libéraliser la Yougoslavie en adoptant une approche plus occidentale."
 RULE_OPTION_YUG_DJILAS_PURGED: "Tito purge Djilas pour ses critiques"
 RULE_OPTION_YUG_DJILAS_PURGED_DESC: "Tito rejettera la critique de Djilas. Il écartera le président Djilas et maintiendra la neutralité pro-orientale actuelle.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 ALB_POST_STALIN_COURSE: "@ALB [1950s] Troisième congrès du Parti du travail"
 RULE_OPTION_ALB_HOXHA_STAYS: "Hoxha reste"
 RULE_OPTION_ALB_HOXHA_STAYS_DESC: "À mesure que les partisans d'Enver Hoxha occuperont davantage de postes au sein du parti, Hoxha conservera son emprise et éliminera toute trace de révisionnisme. L'Albanie s'orientera vers le maoïsme. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_ALB_HOXHA_PURGED: "Xoce réhabilité"
 RULE_OPTION_ALB_HOXHA_PURGED_DESC: "Koci Xoce sera réhabilité à titre posthume. Cette mesure sera suivie de la purge d'Enver Hoxha et de la nomination de Liri Belishova au poste de secrétaire générale. L'Albanie restera dans la sphère d'influence soviétique."
 BUL_POST_STALINIST_COURSE: "@BUL [1950s] L'évolution post-stalinienne"
 RULE_OPTION_BUL_CHERVENKOV: "Antirévisionnisme"
 RULE_OPTION_BUL_CHERVENKOV_DESC: "Valko Chervenkov prendra la tête du parti après l'éviction de Yugov et Zhivkov. Il adoptera une ligne anti-révisionniste et renforcera les liens avec Hoxha et Mao."
 RULE_OPTION_BUL_YUGOV: "Ligne soviétique"
 RULE_OPTION_BUL_YUGOV_DESC: "Anton Yugov prendra les rênes du pouvoir avec le soutien de l'Union soviétique. Il renforcera les liens avec l'Union soviétique. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 ROM_POLITICAL_INFIGHTING: "@ROM [1950s] Luttes politiques internes"
 RULE_OPTION_ROM_PURGE_MUSCOVITES: "Chasser les Moscovites"
 RULE_OPTION_ROM_PURGE_MUSCOVITES_DESC: "Gheorghe Gheorghiu-Dej mettra à l'écart et purgera la faction moscovite, tout en maintenant la répression d'État. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_ROM_PURGE_SECRETARY: "Purge de Gheorghiu-Dej"
 RULE_OPTION_ROM_PURGE_SECRETARY_DESC: "La faction moscovite renversera Gheorghe Gheorghiu-Dej. Ana Pauker prendra la tête du pays et adoptera une approche plus libérale et pluraliste."
 ROM_POST_STALINIST_COURSE: "@ROM [1950s] L'évolution politique après Staline"
 RULE_OPTION_ROM_DESOVIETIZATION: "Les postes de direction"
 RULE_OPTION_ROM_DESOVIETIZATION_DESC: "Les dirigeants actuels conserveront leur poste. Ils adopteront une approche plus indépendante vis-à-vis des Soviétiques. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_ROM_DESTALINIZATION: "La déstalinisation roumaine"
 RULE_OPTION_ROM_DESTALINIZATION_DESC: "Miron Constantinescu prendra les rênes du pouvoir. Il adoptera une position révisionniste et renforcera les liens avec l'Union soviétique."
 HUN_HUNGARIAN_REVOLUTION: "@HUN [1950s] Révolution hongroise"
 HUN_HUNGARIAN_REVOLUTION_DESC: "À l'instar de la Pologne, avec son libertarianisme, et de l'Autriche, avec sa neutralité, la Hongrie tentera de s'engager sur une voie qui s'éloigne du communisme."
 RULE_OPTION_HUN_REVOLUTION_SUCCESSFUL: "@HUN Révolution réussie"
 RULE_OPTION_HUN_REVOLUTION_SUCCESSFUL_DESC: "La Hongrie se détachera du bloc de l'Est et proclamera sa neutralité. Elle instaurera une démocratie titiste."
 RULE_OPTION_HUN_REVOLUTION_CRUSHED: "@SOV La révolution écrasée"
 RULE_OPTION_HUN_REVOLUTION_CRUSHED_DESC: "L'Union soviétique rétablira l'ordre et autorisera le retour de János Kádár. La Hongrie s'engagera dans une voie intransigeante. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 CZE_PRESIDIUM_ESTABLISHMENT: "@CZE [1950s] Constitution du présidium"
 RULE_OPTION_CZE_GOTTWALD_PURGED: "Gottwald est écarté"
 RULE_OPTION_CZE_GOTTWALD_PURGED_DESC: "Klement Gottwald sera écarté. Rudolf Slansky prendra la tête de la Tchécoslovaquie et ouvrira l'économie."
 RULE_OPTION_CZE_SLANSKY_TRIALS: "Les procès Slansky"
 RULE_OPTION_CZE_SLANSKY_TRIALS_DESC: "Rudolf Slansky sera jugé et purgé. Le statu quo sera maintenu. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 CZE_POST_STALIN_COURSE: "@CZE [1950s] L'évolution post-stalinienne"
 RULE_OPTION_CZE_SECRETARY_HUSAK: "Le secrétaire général Husak"
 RULE_OPTION_CZE_SECRETARY_HUSAK_DESC: "Gustav Husak sera nommé secrétaire général. Il mettra en œuvre une libéralisation modérée, tout en restant dans la sphère d'influence soviétique. \nSi Gottwald est écarté, la Tchécoslovaquie s'engagera dans la déstalinisation."
 RULE_OPTION_CZE_SECRETARY_NOVOTNY: "Le secrétaire général Novotny"
 RULE_OPTION_CZE_SECRETARY_NOVOTNY_DESC: "Antonin Novotny sera nommé secrétaire général. Il poursuivra la politique stalinienne, s'inscrivant dans la lignée de Gottwald. \nSi Gottwald venait à être écarté, la Tchécoslovaquie s'engagerait sur la voie de la déstalinisation. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 POL_POLISH_OCTOBER: "@POL [1950s] Octobre en Pologne"
 RULE_OPTION_POL_APPOINT_GOMULKA: "Le secrétaire Gomulka"
 RULE_OPTION_POL_APPOINT_GOMULKA_DESC: "Wladislaw Gomulka prendra les rênes du pouvoir. Il instaurera une liberté politique limitée et favorisera les relations avec le bloc occidental tout en préservant les liens avec l'Union soviétique. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_POL_APPOINT_ZAWADZKI: "M. Zawadzki, secrétaire"
 RULE_OPTION_POL_APPOINT_ZAWADZKI_DESC: "Aleksander Zawadzki prendra les rênes du pouvoir. Il écrasera l'opposition, fera arrêter Gomulka pour la deuxième fois et rétablira les politiques staliniennes."
 SWE_1952_ELECTIONS: "@SWE Élections de 1952"
 RULE_OPTION_SWE_SOCDEM_VICTORY_1952: "Victoire du SAP"
 RULE_OPTION_SWE_SOCDEM_VICTORY_1952_DESC: "Les sociaux-démocrates remporteront les élections. Au cours de ce mandat, ils mettront en œuvre des politiques sociales. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_SWE_COALITION_VICTORY_1952: "Victoire de la coalition"
 RULE_OPTION_SWE_COALITION_VICTORY_1952_DESC: "La coalition des partis de centre-droit remportera les élections. Au cours de ce mandat, elle mettra en œuvre des politiques libérales."
 SWE_1956_ELECTIONS: "@SWE Élections de 1956"
 RULE_OPTION_SWE_SOCDEM_VICTORY_1956: "Victoire du SAP"
 RULE_OPTION_SWE_SOCDEM_VICTORY_1956_DESC: "Les sociaux-démocrates remporteront les élections. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_SWE_COALITION_VICTORY_1956: "Victoire de la coalition"
 RULE_OPTION_SWE_COALITION_VICTORY_1956_DESC: "La coalition des partis de centre-droit remportera les élections."
 SWE_1958_ELECTIONS: "@SWE Élections de 1958"
 RULE_OPTION_SWE_SOCDEM_VICTORY_1958: "Victoire du SAP"
 RULE_OPTION_SWE_SOCDEM_VICTORY_1958_DESC: "Les sociaux-démocrates remporteront les élections. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_SWE_COALITION_VICTORY_1958: "Victoire de la coalition"
 RULE_OPTION_SWE_COALITION_VICTORY_1958_DESC: "La coalition des partis de centre-droit remportera les élections."
 SWE_NUCLEAR_QUESTION_50: "@SWE [1950s] La question nucléaire"
 RULE_OPTION_SWE_SWEDISH_NUKES: "Les centrales nucléaires suédoises"
 RULE_OPTION_SWE_SWEDISH_NUKES_DESC: "Le programme nucléaire suédois se poursuivra. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_SWE_AMERICAN_NUKES: "Armes nucléaires américaines"
 RULE_OPTION_SWE_AMERICAN_NUKES_DESC: "Le programme nucléaire suédois bénéficiera du soutien et de l'alignement des États-Unis."
 RULE_OPTION_SWE_TERMINATE_NUCLEAR_PROGRAM: "Fin du programme nucléaire"
 RULE_OPTION_SWE_TERMINATE_NUCLEAR_PROGRAM_DESC: "Le programme nucléaire suédois sera abandonné. Ils proposeront des mesures de non-prolifération."
 FIN_1950_ELECTIONS: "@FIN Élections de 1950"
 RULE_OPTION_FIN_PAASIKIVI_1950: "Paasikivi élu"
 RULE_OPTION_FIN_PAASIKIVI_1950_DESC: "Juho Kusti Paasikivi remportera les élections. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_FIN_PEKKALA_KUUSINEN: "Élection de Pekkala – Succession de Kuusinen"
 RULE_OPTION_FIN_PEKKALA_KUUSINEN_DESC: "Mauno Pekkala remportera les élections. Kuusinen lui succédera à sa mort ; il collaborera avec les Soviétiques."
 RULE_OPTION_FIN_PEKKALA_KILPI: "Élection de Pekkala - Succession de Kilpi"
 RULE_OPTION_FIN_PEKKALA_KILPI_DESC: "Mauna Pekkala remportera les élections. Kilpi lui succédera à sa mort."
 FIN_1956_ELECTIONS: "@FIN Élections de 1956"
 RULE_OPTION_FIN_KEKKONEN_1956: "Élection de Kekkonen"
 RULE_OPTION_FIN_KEKKONEN_1956_DESC: "Urho Kekkonen remportera les élections. Au cours de son mandat, il mettra l'accent sur le développement économique. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_FIN_FAGERHOLM_1956: "Fagerholm a été élu"
 RULE_OPTION_FIN_FAGERHOLM_1956_DESC: "Karl-August Fagerholm remportera les élections. Au cours de son mandat, il mettra l'accent sur le climat politique, qui sera globalement pro-occidental."
 RULE_OPTION_FIN_PAASIKIVI_KUUSINEN: "Élection de Paasikivi - Succession de Kuusinen"
 RULE_OPTION_FIN_PAASIKIVI_KUUSINEN_DESC: "§YConditions requises :§! Kuusinen succède à Pekkala\nJuho Kusti Paasikivi remportera les élections. À sa mort, Kuusinen lui succédera et adoptera une ligne de gauche."
 RULE_OPTION_FIN_PAASIKIVI_KEKKONEN: "Élection de Paasikivi - Succession de Kekkonen"
 RULE_OPTION_FIN_PAASIKIVI_KEKKONEN_DESC: "Juho Kusti Paasikivi remportera les élections. À sa mort, Kekkonen lui succédera et mettra l'accent sur le développement économique."
 FIN_RETURN_OF_PORKKALA: "@FIN @SOV [1950s] Restitution de la base de Porkkala"
 RULE_OPTION_FIN_PORKKALA_RETURNED: "@FIN La restitution de Porkkala"
 RULE_OPTION_FIN_PORKKALA_RETURNED_DESC: "L'Union soviétique cédera la base de Porkkala à la Finlande. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_FIN_PORKKALA_KEPT: "@SOV Porkkala conservée"
 RULE_OPTION_FIN_PORKKALA_KEPT_DESC: "L'Union soviétique conservera la base de Porkkala."
 ETR_GOVERNANCE: "@SIK [1950s] Le parcours du Turkestan oriental"
 ETR_GOVERNANCE_DESC: "La Deuxième République du Turkestan oriental existe depuis la reprise de la guerre civile chinoise ; mais alors que les parties décident de leur sort, celui du Turkestan oriental est lui aussi en train de se jouer."
 RULE_OPTION_ETR_JOIN_PRC: "@PRC Adhérer à la République populaire de Chine"
 RULE_OPTION_ETR_JOIN_PRC_DESC: "À mesure que les communistes progressent en Chine, le gouvernement ouïghour rejoindra la République populaire. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_ETR_COMMUNIST_INDEPENDENCE: "@SIK Communisme indépendant"
 RULE_OPTION_ETR_COMMUNIST_INDEPENDENCE_DESC: "Ehmetjan Qasim conservera le pouvoir et préservera l'indépendance du Turkestan oriental."
 RULE_OPTION_ETR_KMT_YULBARS: "@CHI Yulbars Khan prend les rênes"
 RULE_OPTION_ETR_KMT_YULBARS_DESC: "Yulbars Khan prendra le pouvoir dans le pays. Alors que les communistes s'emparent de la Chine, Yulbars transformera le Xinjiang en une république autonome."
 RULE_OPTION_ETR_KMT_REVCOM: "@CHI Direction du Comité révolutionnaire"
 RULE_OPTION_ETR_KMT_REVCOM_DESC: "Le Comité révolutionnaire du Kuomintang chinois prendra le pouvoir. En tant qu'aile gauche du Kuomintang, il affirmera son indépendance vis-à-vis du Parti communiste, mais il n'éprouve pas non plus de sympathie pour le courant dominant du Kuomintang."
 RULE_OPTION_ETR_ISLAMIST: "@SAU Prise de pouvoir islamiste"
 RULE_OPTION_ETR_ISLAMIST_DESC: "Elihan Tore prendra les rênes du pouvoir. Il mettra en œuvre des politiques islamistes fondées sur la charia au Turkestan oriental."
 MON_SINO_MONGOLIAN_NEGOTIATIONS: "@MON @PRC [1950s] Négociations sino-mongoles"
 MON_SINO_MONGOLIAN_NEGOTIATIONS_DESC: "Avec deux pays sous le régime communiste, des négociations importantes pourraient avoir lieu."
 RULE_OPTION_MON_JOIN_PRC: "@PRC Adhérer à la République populaire de Chine"
 RULE_OPTION_MON_JOIN_PRC_DESC: "La demande d'adhésion de la Mongolie à l'URSS ayant été rejetée, une offre similaire sera faite à la République populaire de Chine, qui l'acceptera."
 RULE_OPTION_MON_INNER_MONGOLIA: "@MEN Contre-offre de la Mongolie intérieure"
 RULE_OPTION_MON_INNER_MONGOLIA_DESC: "Au lieu que la Mongolie rejoigne la Chine, c'est la Chine qui cédera la Mongolie intérieure à la République de Mongolie."
 RULE_OPTION_MON_NEGOTIATIONS_FAIL: "@MON Échec des négociations"
 RULE_OPTION_MON_NEGOTIATIONS_FAIL_DESC: "Les négociations n'aboutiront à aucun résultat. Cela conduira la politique mongole à se mettre sur la défensive face à la Chine."
 MON_DESTALINIZATION_IN_MONGOLIA: "@MON [1950s] La déstalinisation en Mongolie"
 MON_DESTALINIZATION_IN_MONGOLIA_DESC: "La mort de Staline a également eu des répercussions en Mongolie. Malgré le décès de Choibalsan, l'influence de Staline reste très forte en Mongolie, ce qui fait l'objet d'un débat quant à l'orientation politique à adopter."
 RULE_OPTION_MON_DAMBA_PURGED: "Damba purgé"
 RULE_OPTION_MON_DAMBA_PURGED_DESC: "Yumjaagiin Tsedenbal va évincer Dashiin Damba. Tsedenbal maintiendra le statu quo, en s'alignant sur les Soviétiques.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_MON_TSEDENBAL_PURGED: "Tsedenbal a été écarté"
 RULE_OPTION_MON_TSEDENBAL_PURGED_DESC: "Dashiin Damba destituera Yumjaagiin Tsedenbal. Damba poursuivra la déstalinisation et s'efforcera d'assurer l'indépendance géopolitique vis-à-vis de l'Union soviétique et de la Chine."
 KOR_KOREAN_WAR: "@KOR @KPA Guerre de Corée"
 KOR_KOREAN_WAR_DESC: "Avec l'accord de Moscou et de Pékin, la Corée du Nord a lancé une invasion surprise contre la Corée du Sud. Cette guerre va faire pencher la balance en Asie et revêtira donc une importance comparable à celle de la guerre civile chinoise et de la guerre d'Indochine."
 RULE_OPTION_KOR_TOTAL_NORTH_VICTORY: "@KPA Victoire totale du Nord"
 RULE_OPTION_KOR_TOTAL_NORTH_VICTORY_DESC: "La Corée du Nord écrasera les forces sud-coréennes et anéantira le Sud, réunifiant ainsi la péninsule. \nCe dénouement permettra au §RCCP§!, vaincu, de §Ylancer une invasion§! contre le §BKMT§!, victorieux."
 RULE_OPTION_KOR_CEASEFIRE: "@KOR @KPA Cessez-le-feu"
 RULE_OPTION_KOR_CEASEFIRE_DESC: "Les belligérants n'ayant pas réussi à s'imposer, la guerre de Corée se terminera par un cessez-le-feu, avec seulement de légères modifications des frontières.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_KOR_TOTAL_SOUTH_VICTORY: "@KOR Victoire totale du Sud"
 RULE_OPTION_KOR_TOTAL_SOUTH_VICTORY_DESC: "La Corée du Nord échouera lamentablement dans sa tentative d'avancée ; et cet échec permettra aux forces sud-coréennes d'avancer sans rencontrer de résistance, réunifiant ainsi la péninsule."
 KPA_AUGUST_FACTION_INCIDENT: "@KPA [1950s] Incident de la faction d'août"
 KPA_AUGUST_FACTION_INCIDENT_DESC: "Alors que Kim Il-sung s'obstine à suivre la voie du Juche et du stalinisme, un petit groupe de conspirateurs complote pour renverser Kim."
 RULE_OPTION_KPA_ARDUOUS_MARCH: "La deuxième marche difficile"
 RULE_OPTION_KPA_ARDUOUS_MARCH_DESC: "Les conspirateurs échoueront. Kim consolidera son emprise tant sur le parti que sur l'État, tout en éliminant les influences et les alliances soviétiques et chinoises.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_KPA_KIM_PURGED: "Kim destitué"
 RULE_OPTION_KPA_KIM_PURGED_DESC: "Kim Il-sung sera destitué. Choe Chang-ik prendra la tête de la RPDC ; il procédera à une purge du Juche et de ses partisans tout en poursuivant la déstalinisation."
 KOR_1952_ELECTIONS: "@KOR Élections de 1952"
 KOR_1952_ELECTIONS_DESC: "Alors que les souvenirs de la guerre sont encore vivaces, les élections de 1952 revêtiront sans aucun doute une grande importance pour la Corée, car la guerre a rendu leur issue déterminante pour l'avenir du pays."
 RULE_OPTION_KOR_RHEE_1952: "Syngman Rhee"
 RULE_OPTION_KOR_RHEE_1952_DESC: "Syngman Rhee sera réélu. Au cours de ce mandat, il poursuivra sa dictature pro-américaine, en suivant les principes de l'Ilminisme et en réprimant la gauche.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_KOR_CHONG_1952: "Chong Bong-am"
 RULE_OPTION_KOR_YI_1952: "Yi Si Yeong"
 RULE_OPTION_KOR_YI_1952_DESC: "Yi Si Yeong sera élu. Au cours de son mandat, il suivra une ligne plus traditionaliste et rétablira la monarchie coréenne."
 KOR_1956_ELECTIONS: "@KOR Élections de 1956"
 RULE_OPTION_KOR_RHEE_1956: "Syngman Rhee"
 RULE_OPTION_KOR_RHEE_1956_DESC: "Syngman Rhee sera élu. Au cours de son mandat, il recourra à des méthodes autoritaires qui porteront atteinte à la démocratie.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_KOR_CHONG_1956: "Chong Bong-am"
 RULE_OPTION_KOR_CHONG_1956_DESC: "Chong Bong-am sera élu. Au cours de son mandat, il mettra en place des programmes sociaux et s'efforcera de négocier la §Yréunification de la Corée§!"
 RULE_OPTION_KOR_CHANG_1956: "Chang Myon"
 RULE_OPTION_KOR_CHANG_1956_DESC: "Chang Myon sera élu. Au cours de son mandat, il suivra une ligne modérée et centriste, s'éloignant de l'héritage de Rhee."
 JAP_REESTABLISHMENT: "@JAP [1950s] Réinstallation au Japon"
 JAP_REESTABLISHMENT_DESC: "L'occupation américaine touche à sa fin ; cependant, c'est la manière dont le pays s'organisera qui importe pour le Japon"
 RULE_OPTION_JAP_SAN_FRANCISCO: "£GFX_game_rule_flags_JAP   Traité de San Francisco"
 RULE_OPTION_JAP_SAN_FRANCISCO_DESC: "L'occupation américaine prendra fin avec la signature du Traité de San Francisco par la délégation japonaise ; ce traité rétablit l'indépendance du Japon, mais sous réserve d'un désarmement.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_JAP_EMPIRE: "£GFX_game_rule_flags_JAP_fascism   Le retour de l'Empire"
 RULE_OPTION_JAP_EMPIRE_DESC: "Un complot nationaliste débouchera sur un coup d'État. L'ancien régime reviendra, avec la plupart de ses politiques ; toutefois, le résultat final sera la démocratie."
 JAP_1952_ELECTIONS: "£GFX_game_rule_flags_JAP   Élections de 1952"
 JAP_1952_ELECTIONS_DESC: "Les premières élections libres depuis l'ancien régime auront lieu parallèlement au rétablissement de l'indépendance du Japon."
 RULE_OPTION_JAP_COMMUNIST_1952: "Victoire du PCJ"
 RULE_OPTION_JAP_COMMUNIST_1952_DESC: "Le Parti communiste japonais remportera les élections. Au cours de ce mandat, il contraindra l'empereur Hirohito à abdiquer en faveur d'Akihito, tout en préservant la monarchie constitutionnelle."
 RULE_OPTION_JAP_SOCIALIST_LEFT_1952: "Victoire de la gauche socialiste"
 RULE_OPTION_JAP_SOCIALIST_LEFT_1952_DESC: "Le Parti socialiste de gauche remportera les élections. Au cours de ce mandat, il nouera des liens avec les soviets."
 RULE_OPTION_JAP_SOCIALIST_RIGHT_1952: "Victoire de la droite socialiste"
 RULE_OPTION_JAP_SOCIALIST_RIGHT_1952_DESC: "Le Parti socialiste de droite remportera les élections. Au cours de ce mandat, il renforcera ses liens avec les États-Unis."
 RULE_OPTION_JAP_LIBERAL_1952: "Victoire des libéraux"
 RULE_OPTION_JAP_LIBERAL_1952_DESC: "Le Parti libéral remportera les élections. Au cours de ce mandat, il mettra en œuvre les principes de son chef, Shigeru Yoshida.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_JAP_KASHINTO_1952: "Victoire de Kashinto"
 RULE_OPTION_JAP_KASHINTO_1952_DESC: "Kashinto remportera les élections. Au cours de ce mandat, ils entameront un processus de réarmement."
 JAP_1953_ELECTIONS: "£GFX_game_rule_flags_JAP   Élections de 1953"
 RULE_OPTION_JAP_COMMUNIST_1953: "Victoire du PCJ"
 RULE_OPTION_JAP_COMMUNIST_1953_DESC: "Le Parti communiste japonais remportera les élections. Au cours de ce mandat, il contraindra l'empereur Hirohito à abdiquer en faveur d'Akihito, tout en préservant la monarchie constitutionnelle."
 RULE_OPTION_JAP_SOCIALIST_LEFT_1953: "Victoire de la gauche socialiste"
 RULE_OPTION_JAP_SOCIALIST_LEFT_1953_DESC: "Le Parti socialiste de gauche remportera les élections. Au cours de ce mandat, il nouera des liens avec les soviets."
 RULE_OPTION_JAP_SOCIALIST_RIGHT_1953: "Victoire de la droite socialiste"
 RULE_OPTION_JAP_SOCIALIST_RIGHT_1953_DESC: "Le Parti socialiste de droite remportera les élections. Au cours de ce mandat, il renforcera ses liens avec les États-Unis."
 RULE_OPTION_JAP_LIBERAL_1953: "Victoire des libéraux"
 RULE_OPTION_JAP_LIBERAL_1953_DESC: "Le Parti libéral remportera les élections. Au cours de ce mandat, il mettra en œuvre les principes de son chef, Shigeru Yoshida.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_JAP_KASHINTO_1953: "Victoire de Kashinto"
 RULE_OPTION_JAP_KASHINTO_1953_DESC: "Kashinto remportera les élections. Au cours de ce mandat, ils entameront un processus de réarmement."
 JAP_1955_ELECTIONS: "£GFX_game_rule_flags_JAP   Élections de 1955"
 RULE_OPTION_JAP_COMMUNIST_1955: "Victoire du PCJ"
 RULE_OPTION_JAP_COMMUNIST_1955_DESC: "Le Parti communiste japonais va remporter les élections."
 RULE_OPTION_JAP_SOCIALIST_1955: "Victoire socialiste"
 RULE_OPTION_JAP_SOCIALIST_1955_DESC: "Le Parti socialiste remportera les élections."
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_1955: "Victoire des libéraux-démocrates"
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_1955_DESC: "Le Parti libéral-démocrate remportera les élections."
 JAP_1958_ELECTIONS: "£GFX_game_rule_flags_JAP   Élections de 1958"
 RULE_OPTION_JAP_COMMUNIST_1958: "Victoire du PCJ"
 RULE_OPTION_JAP_COMMUNIST_1958_DESC: "Le Parti communiste japonais va remporter les élections."
 RULE_OPTION_JAP_SOCIALIST_1958: "Victoire socialiste"
 RULE_OPTION_JAP_SOCIALIST_1958_DESC: "Le Parti socialiste remportera les élections."
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_ISHIBASHI_1958: "Victoire du PLD – Ishibashi reste en poste"
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_ISHIBASHI_1958_DESC: "Le Parti libéral-démocrate remportera les élections. Le Premier ministre Ishibashi conservera son poste."
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_KISHI_1958: "Victoire du PLD : Kishi devient Premier ministre"
 RULE_OPTION_JAP_LIBERAL_DEMOCRAT_KISHI_1958_DESC: "Le Parti libéral-démocrate remportera les élections. Par la suite, Nobusuke Kishi deviendra Premier ministre. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 VIN_15_PLENUM: "@VIN [1950s] 15. Plenum"
 VIN_15_PLENUM_DESC: "Alors que le Nord-Vietnam se développe et apporte son soutien aux communistes laotiens, le Parti communiste vietnamien doit régler la question de la nomination du secrétaire général."
 RULE_OPTION_VIN_VO_NGUYEN_GIAP: "Vo Nguyen Giap"
 RULE_OPTION_VIN_VO_NGUYEN_GIAP_DESC: "Vo Nguyen Giap prendra les fonctions de secrétaire général. Il mettra en place des politiques libertaires dans le cadre d'un alignement pro-soviétique."
 RULE_OPTION_VIN_LE_DUAN: "Le Duan"
 RULE_OPTION_VIN_LE_DUAN_DESC: "Le Duan prendra les fonctions de secrétaire général. Il mettra fin aux politiques libérales menées jusqu'alors et commencera à approvisionner les Viet Cong, déclenchant ainsi la guerre. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_VIN_TRUONG_CHINH: "Truong Chinh"
 RULE_OPTION_VIN_TRUONG_CHINH_DESC: "Truong Chinh prendra les fonctions de secrétaire général. Fervent partisan de Mao, il mettra en œuvre les politiques maoïstes et alignera le Vietnam sur la Chine."
 VIE_SECT_CRISIS: "@VIE [1950s] La crise des sectes"
 VIE_SECT_CRISIS_DESC: "Comme Ngo Dinh Diem met en œuvre des politiques favorables aux catholiques, de vives tensions règnent actuellement dans le pays. Il est impératif de trouver une issue à cette crise."
 RULE_OPTION_VIE_NGO_DINH_DIEM: "Diem reste"
 RULE_OPTION_VIE_NGO_DINH_DIEM_DESC: "Ngo Dinh Diem maintiendra le cap. La monarchie sera abolie au profit d'une dictature républicaine. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_VIE_UNITED_FRONT: "Le Front uni prend le pouvoir"
 RULE_OPTION_VIE_UNITED_FRONT_DESC: "Une large coalition de l'opposition politique renversera Diem, ce qui apaisera les tensions et assouplira le climat."
 VIE_1956_ELECTIONS: "@VIE Élections de 1956"
 VIE_1956_ELECTIONS_DESC: "La crise des sectes étant encore récente, les élections de 1956 devraient occuper une place importante dans la vie politique vietnamienne."
 RULE_OPTION_VIE_VIET_QUOC_1956: "La victoire de Viet Quoc"
 RULE_OPTION_VIE_VIET_QUOC_1956_DESC: "Le Parti national du Vietnam remportera les élections. Au cours de ce mandat, il mettra en œuvre les « Trois principes du peuple » tout en réprimant les activités communistes."
 RULE_OPTION_VIE_DAI_VIET_1956: "La victoire de Dai Viet"
 RULE_OPTION_VIE_DAI_VIET_1956_DESC: "Le Parti national du Dai Viet remportera les élections. Au cours de ce mandat, il mettra l'accent sur des politiques conservatrices."
 RULE_OPTION_VIE_COALITION_1956: "Victoire de la Coalition nationale"
 RULE_OPTION_VIE_COALITION_1956_DESC: "La Coalition nationale remportera les élections. Au cours de ce mandat, elle mettra en œuvre des politiques nationalistes et proposera des négociations en vue de la §Yréunification du Vietnam§!"
 RULE_OPTION_VIE_CAN_LAO_1956: "La victoire du Laos"
 RULE_OPTION_VIE_CAN_LAO_1956_DESC: "Le Parti révolutionnaire du travail personnaliste remportera les élections. Au cours de ce mandat, il mettra en œuvre des politiques catholiques et s'alignera sur celles de Diem."
 PHI_1949_ELECTIONS: "@PHI Élections de 1949"
 RULE_OPTION_PHI_QUIRINO_1949: "La victoire de Quirino"
 RULE_OPTION_PHI_QUIRINO_1949_DESC: "Elpidio Quirino sera réélu. Au cours de ce mandat, il alignera les Philippines sur les États-Unis.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_PHI_LAUREL: "La victoire de Laurel"
 RULE_OPTION_PHI_LAUREL_DESC: "José Laurel remportera les élections. Au cours de ce mandat, il adoptera une ligne plus non-alignée."
 PHI_1953_ELECTIONS: "@PHI Élections de 1953"
 RULE_OPTION_PHI_QUIRINO_1953: "La victoire de Quirino"
 RULE_OPTION_PHI_QUIRINO_1953_DESC: "Elpidio Quirino va remporter les élections."
 RULE_OPTION_PHI_MAGSAYSAY: "La victoire de Magsaysay "
 RULE_OPTION_PHI_MAGSAYSAY_DESC: "Ramon Magsaysay va remporter les élections. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 PHI_1957_ELECTIONS: "@PHI Élections de 1957"
 RULE_OPTION_PHI_YULO: "Victoire de Yulo"
 RULE_OPTION_PHI_YULO_DESC: "José Yulo va remporter les élections."
 RULE_OPTION_PHI_GARCIA: "Victoire de Garcia"
 RULE_OPTION_PHI_GARCIA_DESC: "Carlos Garcia va remporter les élections.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_PHI_MANAHAN: "Victoire de Manahan"
 RULE_OPTION_PHI_MANAHAN_DESC: "Manuel Manahan va remporter les élections."
 CAM_1951_ELECTIONS: "@CAM Élections de 1951"
 CAM_1951_ELECTIONS_DESC: "Le pouvoir français s'affaiblit de plus en plus ;"
 RULE_OPTION_CAM_DEMCORATIC_1951: "Victoire démocrate"
 RULE_OPTION_CAM_DEMCORATIC_1951_DESC: "Le Parti démocrate remportera les élections. Au cours de ce mandat, il s'efforcera d'obtenir l'indépendance dès que possible.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_CAM_LIBERAL_1951: "Victoire des libéraux"
 RULE_OPTION_CAM_LIBERAL_1951_DESC: "Le Parti libéral remportera les élections. Au cours de ce mandat, il maintiendra ses liens avec la France."
 RULE_OPTION_CAM_NORTHEAST_1951: "Victoire du Parti du Nord-Est"
 RULE_OPTION_CAM_NORTHEAST_1951_DESC: "Le Parti du Nord-Est remportera les élections. Au cours de ce mandat, il adoptera une position anticommuniste."
 RULE_OPTION_CAM_NATIONALIST_1951: "Victoire des nationalistes"
 RULE_OPTION_CAM_NATIONALIST_1951_DESC: "Le Parti nationaliste remportera les élections. Au cours de ce mandat, il nouera des liens avec les États-Unis."
 CAM_1955_ELECTIONS: "@CAM Élections de 1955"
 CAM_1955_ELECTIONS_DESC: ""
 RULE_OPTION_CAM_SANGKUM_1955: "Victoire de Sangkum"
 RULE_OPTION_CAM_SANGKUM_1955_DESC: "Sangkum remportera les élections. Au cours de ce mandat, ils suivront la ligne tracée par le Monarque et mettront en œuvre sa vision.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_CAM_DEMCORATIC_1955: "Victoire démocrate"
 RULE_OPTION_CAM_DEMCORATIC_1955_DESC: "Le Parti démocrate remportera les élections. Au cours de ce mandat, il suivra une ligne centriste."
 RULE_OPTION_CAM_INDEPENDENCE_1955: "Victoire de l'indépendance"
 RULE_OPTION_CAM_INDEPENDENCE_1955_DESC: "Le Parti de l'indépendance khmère remportera les élections. Au cours de ce mandat, il nouera des liens avec les États-Unis et le Sud-Vietnam."
 CAM_MONARCHY_DEBATE_1950: "@CAM [1950s] Débat sur la monarchie"
 CAM_MONARCHY_DEBATE_1950_DESC: ""
 RULE_OPTION_CAM_MONARCHY_1950: "La Monarchie reste"
 RULE_OPTION_CAM_MONARCHY_1950_DESC: "§YConditions requises :§! §RNON§! §CLe Parti de l'indépendance khmère a remporté les élections de 1955.§! \nLe gouvernement réprimera les sentiments républicains ; et la monarchie sera maintenue.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_CAM_REPUBLIC_1950: "Fondation de la République"
 RULE_OPTION_CAM_REPUBLIC_1950_DESC: "§YConditions requises:§! §RNON§! §CSangkum a remporté les élections de 1955.§! \nAvec le soutien des États-Unis, des conspirateurs républicains organiseront un coup d'État et renverseront la monarchie pour instaurer une république."
 MLA_FOREIGN_ALINGMENT_1950: "@MLA [1950s] Alignement étranger"
 MLA_FOREIGN_ALINGMENT_1950_DESC: ""
 RULE_OPTION_MLA_SOVIET_ALIGNMENT_1950: "@SOV Alignement soviétique"
 RULE_OPTION_MLA_SOVIET_ALIGNMENT_1950_DESC: "Une diarchie composée de Chin Peng et de Shamsiah Fakeh prendra la tête des communistes malais. Cela alignera la Malaisie sur la ligne soviétique."
 RULE_OPTION_MLA_CHINESE_ALIGNMENT_1950: "@PRC Alignement chinois"
 RULE_OPTION_MLA_CHINESE_ALIGNMENT_1950_DESC: "Chin Peng conservera le contrôle. Cela conduira les communistes malais à s'aligner sur la ligne chinoise.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 BRU_MACBRYAN: "@BRU [1950s] La conspiration MacByarn"
