 RULE_OPTION_SENUSSI_COUNTERCOUP: "£GFX_game_rule_flags_LBA  La révolution senussi"
 RULE_OPTION_SENUSSI_COUNTERCOUP_DESC: "À la suite des troubles généralisés et de l'instabilité gouvernementale qui ont suivi la démission de Mouammar Kadhafi, les clans pro-Senussi, menés par Ahmed al-Senussi, renverseront le gouvernement."
 LBA_UAR_RULE: "£GFX_game_rule_flags_LBA_nationalism   [1960s] La Libye au sein de la RAU"
