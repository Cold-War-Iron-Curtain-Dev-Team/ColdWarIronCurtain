 RULE_OPTION_NGA_KANO_ACCORDS_PARTITION: "Accord de Kano - Partition"
 RULE_OPTION_NGA_KANO_ACCORDS_PARTITION_DESC: "§YConditions requises :§! §CNigéria en proie à une rébellion§!\nLes accords de Kano seront conclus et la colonie du Nigéria sera partagée entre les peuples locaux."
 RULE_OPTION_NGA_KANO_ACCORDS_BINATIONAL: "Accord de Kano - Nation binationale"
 RULE_OPTION_NGA_KANO_ACCORDS_BINATIONAL_DESC: "§YConditions requises :§! §CNigéria en proie à une rébellion§!\nLes accords de Kano seront conclus et le Nigéria obtiendra son indépendance dans le cadre d'un système de partage du pouvoir entre le Nord et le Sud."
 RULE_OPTION_NGA_UNITARY_NIGERIA: "Un Nigeria unitaire"
 RULE_OPTION_NGA_UNITARY_NIGERIA_DESC: "§YConditions requises :§! §CNigéria a réprimé ses rébellions§!\nLe Nigéria sera organisé selon un modèle unitaire, avec une concentration des pouvoirs dans le nord."
 RULE_OPTION_NGA_INDEPENDENCE_AS_PLANNED: "L'indépendance, comme prévu"
 RULE_OPTION_NGA_INDEPENDENCE_AS_PLANNED_DESC: "§YConditions requises :§! §CLa Constitution de Lyttleton est en vigueur§!\nLe Nigeria sera suffisamment stable pour accéder à l'indépendance. Une autonomie suffisante sera accordée à mesure que les fonctionnaires coloniaux seront progressivement remplacés."
