 RULE_OPTION_HISTORICAL_LBA_UAR_DESC: "Que ce soit en raison de divergences idéologiques ou d'ingérences extérieures, la Libye et la République arabe unie resteront distinctes et s'attacheront plutôt à entretenir des relations étroites entre elles.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
