 RULE_OPTION_CAN_PROGCON_1953: "Victoire du Parti progressiste-conservateur"
 RULE_OPTION_CAN_PROGCON_1953_DESC: "Les conservateurs progressistes vont remporter les élections."
 CAN_1957_ELECTIONS_RULE: "@CAN Élections de 1957"
 RULE_OPTION_CAN_CCF_1957: "Victoire du CCF"
 RULE_OPTION_CAN_CCF_1957_DESC: "Le CCF remportera les élections."
 RULE_OPTION_CAN_LIBERAL_1957: "Victoire des libéraux"
 RULE_OPTION_CAN_LIBERAL_1957_DESC: "Les libéraux vont remporter les élections."
