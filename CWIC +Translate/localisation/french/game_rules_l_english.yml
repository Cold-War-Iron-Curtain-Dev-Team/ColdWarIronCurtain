 USA_STANCE_ON_VIETNAM: "@USA @VIE @VIN [1950s] La position américaine sur le Vietnam"
 USA_STANCE_ON_VIETNAM_DESC: "Les Accords de Genève prévoient la tenue d'un référendum sur la réunification tant au Nord qu'au Sud du Vietnam. Cependant, tout le monde n'y est pas favorable."
 RULE_OPTION_USA_ALLOW_FREE_ELECTIONS: "@USA @VIE @VIN Permettre la tenue d'élections libres"
 RULE_OPTION_USA_ALLOW_FREE_ELECTIONS_DESC: "§YCondition :§! §RNON§! §CLe Sud-Vietnam a opposé son veto au référendum§!\nLes États-Unis feront pression sur le gouvernement sud-vietnamien pour qu'il organise le référendum ; celui-ci aboutira et permettra la §Yunification du Vietnam§!."
 RULE_OPTION_USA_ALLOW_RIGGED_ELECTIONS: "@USA @VIE Autoriser les élections truquées"
 RULE_OPTION_USA_ALLOW_RIGGED_ELECTIONS_DESC: "§YConditions requises :§! §RNON§! §CVeto du Sud-Vietnam sur le référendum§!\nLes États-Unis feront pression sur le gouvernement sud-vietnamien pour qu'il organise le référendum ; celui-ci échouera en raison de fraudes électorales."
 RULE_OPTION_USA_BLOCK_ELECTIONS: "@USA @VIE Élections bloquées"
 RULE_OPTION_USA_BLOCK_ELECTIONS_DESC: "Les États-Unis soutiendront le refus du Sud-Vietnam d'organiser un référendum et lanceront l'opération « Passage vers la liberté ». \n§YC'est ainsi que s'est déroulée l'histoire.§!"
 SOV_FOREIGN_AI_BEHAVIOR: "@SOV [1950s] La politique étrangère soviétique"
 RULE_OPTION_FOREIGN_HISTORICAL_SOV_AI_DESC: "La politique étrangère soviétique suivra la realpolitik et évitera les confrontations ouvertes.\n§YC'est ainsi que s'est déroulée l'histoire.§!"
 RULE_OPTION_FOREIGN_AGGRESSIVE_SOV_AI: "Agressif"
 RULE_OPTION_FOREIGN_AGGRESSIVE_SOV_AI_DESC: "Les Soviétiques mèneront une politique étrangère offensive"
 SOV_INTERNAL_AI_BEHAVIOR: "@SOV [1950s] Lutte pour le pouvoir"
 RULE_OPTION_INTERNAL_HISTORICAL_SOV_AI: "Nikita Khrushchev"
 RULE_OPTION_INTERNAL_HISTORICAL_SOV_AI_DESC: "Nikita Khrouchtchev prendra le dessus sur Beria et remportera la lutte pour le pouvoir.\n§YC'est ainsi que s'est déroulée l'histoire.§!"
 RULE_OPTION_INTERNAL_BERIA_SOV_AI: "Beria succède à Staline"
 RULE_OPTION_INTERNAL_BERIA_SOV_AI_DESC: "Lavrentiy Beria prendra le pouvoir, avec Georgy Malenkov comme figure de proue."
 RULE_OPTION_INTERNAL_STALIN_SOV_AI: "Staline est vivant"
 RULE_OPTION_INTERNAL_STALIN_SOV_AI_DESC: "sois réaliste"
 ALB_ALBANIAN_SUBVERSION_AI: "@ALB @USA [1950s] La subversion albanaise"
 RULE_OPTION_ALB_PIXIES_CRUSHED: "L'Albanie intacte"
 RULE_OPTION_ALB_PIXIES_CRUSHED_DESC: "Malgré l'ingérence des puissances étrangères, le gouvernement albanais reste intact et poursuit la ligne qu'il s'était fixée."
 RULE_OPTION_ALB_ALBANIA_SUBVERTED: "Contre-révolution albanaise"
 RULE_OPTION_ALB_ALBANIA_SUBVERTED_DESC: "Avec l'aide des États-Unis et de la Grande-Bretagne, des agents réactionnaires parviendront à organiser un soulèvement, déclenchant ainsi une guerre civile."
 JOR_KING_TALAL_QUESTION: "@JOR [1950s] La question du roi Talal"
 JOR_KING_TALAL_QUESTION_DESC: ""
 RULE_OPTION_JOR_TALAL_ABDICATES: "Talal abdique"
 RULE_OPTION_JOR_TALAL_ABDICATES_DESC: "Le roi Talal est contraint d'abdiquer, et Hussein prendra la tête du royaume. \n§YC'est ainsi que s'est déroulée l'histoire.§!"
 RULE_OPTION_JOR_TALAL_STAYS: "Talal reste"
 RULE_OPTION_JOR_TALAL_STAYS_DESC: "Le roi Talal restera sur le trône, malgré sa maladie. Il mènera une politique libérale pour la Jordanie."
 JOR_FREE_OFFICERS_COUP_AI: "@JOR [1950s] Le coup d'État des Officiers libres jordaniens"
 JOR_FREE_OFFICERS_COUP_AI_DESC: "§YConditions requises :§! §CLe roi Talal a abdiqué§!\n"
 RULE_OPTION_JOR_FREE_OFFICERS_THWARTED: "Échec d'une tentative de coup d'État"
 RULE_OPTION_JOR_FREE_OFFICERS_THWARTED_DESC: "Avant même que le coup d'État ne puisse véritablement commencer, ses meneurs sont contraints de démissionner et le roi Hussein consolide son pouvoir sur le pays. \n§YC'est ainsi que s'est déroulée l'histoire.§!"
 RULE_OPTION_JOR_FREE_OFFICERS_SUCCESS: "Révolution jordanienne"
 RULE_OPTION_JOR_FREE_OFFICERS_SUCCESS_DESC: "Le roi Hussein ignore les signes d'un coup d'État imminent, permettant ainsi aux Officiers libres de renverser la monarchie jordanienne et d'instaurer une république."
 LEB_1952_ELECTIONS: "@LEB Élections de 1952"
 LEB_1952_ELECTIONS_DESC: ""
 RULE_OPTION_LEB_CHAMOUN_ELECTED_1952: "Chamoun élu"
 RULE_OPTION_LEB_CHAMOUN_ELECTED_1952_DESC: "Camille Chamoun va remporter les élections."
 RULE_OPTION_LEB_EDDE_ELECTED_1952: "Eddé élu"
 RULE_OPTION_LEB_EDDE_ELECTED_1952_DESC: "Raymond Eddé va remporter les élections."
 LEB_CRISIS_OF_1958: "@LEB Crise de 1958"
 LEB_CRISIS_OF_1958_DESC: ""
 RULE_OPTION_LEB_CHEHAB_ELECTED_1952: "Chehab élu"
 RULE_OPTION_LEB_CHEHAB_ELECTED_1952_DESC: "Fouad Chehab va remporter les élections."
 RULE_OPTION_LEB_EDDE_ELECTED_1958: "Eddé élu"
 RULE_OPTION_LEB_EDDE_ELECTED_1958_DESC: "Raymond Eddé va remporter les élections."
 RULE_OPTION_LEB_SSNP_TAKEOVER: "@SYR Prise de contrôle de la SSNP"
 RULE_OPTION_LEB_SSNP_TAKEOVER_DESC: "Le SSNP prendra le pouvoir au Liban et poursuivra l'idéal de la Grande Syrie."
 RULE_OPTION_LEB_JOIN_UAR: "£GFX_game_rule_flags_UAR  Rejoindre l'UAR"
 RULE_OPTION_LEB_JOIN_UAR_DESC: "Les panarabistes prendront le contrôle du gouvernement libanais et rejoindront la République arabe unie de Nasser."
 PAK_RAWALPINDI_CONSPIRACY_AI: "@PAK [1950s] Le complot de Rawalpindi"
 RULE_OPTION_PAK_RAWALPINDI_THWARTED: "Complot déjoué"
 RULE_OPTION_PAK_RAWALPINDI_THWARTED_DESC: "Le complot de Rawalpindi sera déjoué et ses auteurs arrêtés. Le gouvernement civil actuel restera en place pour l'instant. \n§YC'est ainsi que s'est déroulée l'histoire.§!"
 RULE_OPTION_PAK_RAWALPINDI_SUCCESS: "La révolution de Rawalpindi"
 RULE_OPTION_PAK_RAWALPINDI_SUCCESS_DESC: "Le complot de Rawalpindi sera ignoré, ce qui conduira à un coup d'État de gauche et à la mise en place d'un gouvernement §Rmarxiste-léniniste§!."
 PAK_1955_ELECTIONS: "@PAK Élections de 1955"
 PAK_1955_ELECTIONS_DESC: "§YConditions requises :§! §CÉchec du complot de Rawalpindi§!\nCompte tenu du récent complot de Rawalpindi, une nouvelle constitution s'impose au Pakistan ; les élections détermineront à la fois la nouvelle constitution et la composition du gouvernement."
 PAK_TRIPLE_ALLIANCE: "Victoire de la Triple Alliance"
 PAK_TRIPLE_ALLIANCE_DESC: "La Triple Alliance remportera les élections."
 PAK_UNITED_FRONT: "Victoire du Front uni"
 PAK_UNITED_FRONT_DESC: "Le Front uni remportera les élections."
 PAK_JAMAAT_ISLAMI: "Victoire du Jamaat-i Islami"
 PAK_JAMAAT_ISLAMI_DESC: "Le Jamaat-i Islami remportera les élections."
 PAK_SHAHABUDDIN_COMMISSION_AI: "@PAK [1960s] Rapport de la commission Shahabuddin"
 RULE_OPTION_PAK_SHAHABUDDIN_REVISED: "Rapport révisé accepté"
 RULE_OPTION_PAK_SHAHABUDDIN_REVISED_DESC: "Le rapport de la commission Shahabuddin sera révisé afin de renforcer le pouvoir du président et de maintenir l'interdiction des partis politiques.\n\n§CAyub Khan a dû prendre le contrôle du gouvernement !§!"
 RULE_OPTION_PAK_SHAHABUDDIN_ACCEPTED: "Rapport entièrement accepté"
 RULE_OPTION_PAK_SHAHABUDDIN_ACCEPTED_DESC: "Le rapport de la commission Shahabuddin sera accepté tel quel. Cela permettra d'accélérer le retour à la démocratie et de renforcer les institutions démocratiques.\n\n§CAyub Khan a dû prendre le contrôle du gouvernement !§!"
 PAK_RAJ_KASHMIR_UNREST_AI: "@PAK @KAS @RAJ Les troubles au Cachemire de 1965"
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_WAR: "@PAK @RAJ Deuxième guerre du Cachemire"
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_WAR_DESC: "Les troubles au Cachemire, qui ont débuté par le vol d'une relique religieuse, sont mis à profit par l'Inde et le Pakistan pour affirmer leur position dans la région. Finalement, les escarmouches mineures dégénèrent en une guerre totale sur le sous-continent."
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_REFERENDUM: "@PAK @UNS @RAJ Référendum organisé sous l'égide de l'ONU"
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_REFERENDUM_DESC: "Les troubles au Cachemire, qui ont débuté par le vol d'une relique religieuse, poussent l'Inde et le Pakistan à saisir les Nations Unies afin d'obtenir la tenue d'un référendum au Cachemire pour trancher définitivement la question."
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_COMMUNAL_PARTITION: "@PAK @RAJ Répartition communautaire du Cachemire"
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_COMMUNAL_PARTITION_DESC: "Les troubles au Cachemire, déclenchés par le vol d'une relique religieuse, poussent l'Inde et le Pakistan à diviser le Cachemire selon des critères religieux, Srinagar étant cédée au Pakistan."
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_FORMALISE_STATUS_QUO: "@PAK @RAJ Le statu quo pérennisé"
 RULE_OPTION_PAK_RAJ_KASHMIR_UNREST_FORMALISE_STATUS_QUO_DESC: "Les troubles au Cachemire, déclenchés par le vol d'une relique religieuse, poussent l'Inde et le Pakistan à officialiser enfin la division de facto du Cachemire et à transformer la ligne de cessez-le-feu en une frontière permanente."
 PAK_HISTORICAL_1965_ELECTION_AI: "@PAK Élections de 1965 (historique)"
 PAK_HISTORICAL_1965_ELECTION_AI_DESC: "§YConditions requises :§! §CLa commission Shahabuddin est acceptée sous réserve de modifications§!\n"
 RULE_OPTION_PAK_HISTORICAL_1965_AYUB_KHAN: "Ayub Khan"
 RULE_OPTION_PAK_HISTORICAL_1965_AYUB_KHAN_DESC: "Alors que le rapport de la commission Shahabuddin était en cours de révision, §LAyub Khan§! réussit à remporter une victoire facile lors des élections truquées de 1965."
 RULE_OPTION_PAK_HISTORICAL_1965_FATIMA_JINNAH: "Fatima Jinnah"
 RULE_OPTION_PAK_HISTORICAL_1965_FATIMA_JINNAH_DESC: "Malgré les modifications apportées au rapport de la commission Shahabuddin, §CFatima Jinnah et l'opposition unie§! parviennent à remporter les élections de 1965 et s'efforcent de consolider la démocratie au Pakistan."
 PAK_DEMOCRATIC_1965_ELECTION_AI: "@PAK Élections de 1965 (Démocratie)"
 PAK_DEMOCRATIC_1965_ELECTION_AI_DESC: "§YConditions requises :§! §CLa Commission Shahabuddin est pleinement acceptée§! OU §CFatima Jinnah est élue lors des élections de 1965§!\n"
 RULE_OPTION_PAK_DEMOCRATIC_1965_AYUB_KHAN: "Ayub Khan"
 RULE_OPTION_PAK_DEMOCRATIC_1965_AYUB_KHAN_DESC: "Une fois le rapport de la commission Shahabuddin pleinement accepté, §LAyub Khan et la coalition centriste§! ont réussi à remporter les élections de 1965."
 RULE_OPTION_PAK_DEMOCRATIC_1965_SHEIKH_MUJIB: "Sheikh Mujibur Rahman"
 RULE_OPTION_PAK_DEMOCRATIC_1965_SHEIKH_MUJIB_DESC: "Une fois le rapport de la commission Shahabuddin pleinement accepté, §RSheikh Mujibur Rahman et les partis de gauche§! ont réussi à remporter les élections de 1965."
 PAK_1970_ELECTION_AI: "@PAK Élections démocrates de 1970"
 RULE_OPTION_PAK_1970_BHUTTO: "Zulfikar Ali Bhutto"
 RULE_OPTION_PAK_1970_BHUTTO_DESC: "Avec le retrait d'Ayub Khan de la vie politique, §OZulfikar Ali Bhutto et le centre-gauche§! reprennent le flambeau et parviennent à remporter les élections de 1970.\n\n§CAvec l'acceptation totale du rapport de la commission Shahabuddin ou la victoire de Fatima Jinnah aux élections historiques de 1965 !§!"
 RULE_OPTION_PAK_1970_SHEIKH_MUJIB: "Sheikh Mujibur Rahman"
 RULE_OPTION_PAK_1970_SHEIKH_MUJIB_DESC: "La démocratie semblant désormais acquise, §RSheikh Mujibur Rahman et les forces de gauche§! parviennent à remporter les élections de 1970. Néanmoins, §LMuhammad Zia-ul-Haq§! tente de mener un coup d'État, mais les soldats loyalistes et la popularité nationale de Rahman l'en empêchent.\n\n§CConditionne l'acceptation totale du rapport de la commission Shahabuddin ou la victoire de Fatima Jinnah aux élections historiques de 1965!§!"
 RULE_OPTION_PAK_1970_ZIA_COUP: "Le coup d'État de Muhammad Zia-ul-Haq"
 RULE_OPTION_PAK_1970_ZIA_COUP_DESC: "Après la victoire de §RSheikh Mujibur Rahman§! aux élections de 1970, §LMuhammad Zia-ul-Haq§! organise un coup d'État : la popularité de Rahman, limitée au Pakistan oriental, permet à l'armée d'agir librement dans l'ouest du pays et de renverser le gouvernement avec succès.\n\n§CNécessite que le rapport de la commission Shahabuddin soit pleinement accepté ou que Fatima Jinnah remporte les élections historiques de 1965 !§!"
 PAK_1975_ELECTION_AI: "@PAK Élections démocratiques de 1975"
 RULE_OPTION_PAK_1975_BHUTTO: "Zulfikar Ali Bhutto"
 RULE_OPTION_PAK_1975_BHUTTO_DESC: "Après une décennie entière de démocratie, §OZulfikar Ali Bhutto et le centre-gauche§! parviennent à remporter les élections de 1975.\n\n§CIl faut un Pakistan uni et sa démocratie pour survivre aux conséquences des élections démocratiques de 1970!§!"
 RULE_OPTION_PAK_1975_SHEIKH_MUJIB: "Sheikh Mujibur Rahman"
 RULE_OPTION_PAK_1975_SHEIKH_MUJIB_DESC: "Après une décennie entière de démocratie, §RSheikh Mujibur Rahman et les partis de gauche§! ont réussi à remporter les élections de 1975.\n\n§CIl faut un Pakistan uni et sa démocratie pour survivre aux conséquences des élections démocratiques de 1970!§!"
 RULE_OPTION_PAK_1975_ELAHI: "Chaudhry Zahoor Elahi"
 RULE_OPTION_PAK_1975_ELAHI_DESC: "Après une décennie entière de démocratie, §GChaudhry Zahoor Elahi et la droite religieuse§! ont réussi à remporter les élections de 1975.\n\n§CIl faut un Pakistan uni et sa démocratie pour survivre aux conséquences des élections démocratiques de 1970!§!"
 FRA_50S_ELECTIONS: "@FRA Élections de 1951"
 RULE_OPTION_FRA_50S_HISTORICAL: "@FRA Victoire de la Troisième Force"
 RULE_OPTION_FRA_50S_ELECTIONS_HISTORICAL_DESC: "La Troisième Force remportera les élections de 1951 et poursuivra le programme socialiste démocratique.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_FRA_COMMUNIST_PEACE: "£GFX_game_rule_flags_FRA_communism  Victoire du PCF"
 RULE_OPTION_FRA_COMMUNIST_PEACE_DESC: "Le Parti communiste remportera les élections de 1951, instaurera la Ve République et alignera la France sur le bloc de l'Est."
 RULE_OPTION_FRA_COMMUNIST_WAR: "@FRA @ALE Victoire du PCF (intervention de l'OTAN)"
 RULE_OPTION_FRA_COMMUNIST_WAR_DESC: "Le Parti communiste remportera les élections de 1951. Ne voulant pas qu'un allié clé change de camp et franchisse le rideau de fer, les États-Unis mobiliseront l'OTAN et déclareront la guerre à la France."
 FRA_1953_ELECTIONS: "@FRA Élections de 1953"
 RULE_OPTION_FRA_SFIO_1953: "Victoire du SFIO"
 RULE_OPTION_FRA_SFIO_1953_DESC: "Le SFIO remportera les élections de 1953. Il adoptera une position favorable à l'union. \nCela enverra Jacques Soustelle en Algérie."
 RULE_OPTION_FRA_RADICALS_1953: "Victoire des Radicaux"
 RULE_OPTION_FRA_RADICALS_1953_DESC: "Les radicaux remporteront les élections de 1953. Ils adopteront une position de compromis entre les syndicats et les employeurs. \nCela permettra d'instaurer un cessez-le-feu en Algérie."
 RULE_OPTION_FRA_CNIP_1953: "Victoire du CNIP"
 RULE_OPTION_FRA_CNIP_1953_DESC: "Le CNIP remportera les élections. Il adoptera une position favorable aux employeurs. \nCela enverra Robert Lacoste en Algérie.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 FRA_1958_CRISIS: "@FRA Crise de 1958"
 RULE_OPTION_FRA_GAULLE_RETURNS: "Le retour de De Gaulle"
 RULE_OPTION_FRA_GAULLE_RETURNS_DESC: "Charles de Gaulle interviendra dans la crise en cours, ce qui lui permettra de prendre la tête du gouvernement et d'instaurer la Ve République française.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_FRA_ALGERIAN_COMPROMISE: "Le compromis algérien"
 RULE_OPTION_FRA_ALGERIAN_COMPROMISE_DESC: "Charles de Gaulle ne prendra pas la tête du gouvernement. Cela obligera la France à rechercher un compromis avec l'Algérie, avant de finir par se retirer de ce pays."
 KRD_DROUGHT_OUTCOME:0 "£GFX_game_rule_flags_KRD  [1950s] La grande sécheresse"
 KRD_DROUGHT_OUTCOME_DESC: "§YConditions requises :§! §CL'Union soviétique mène une politique étrangère agressive dans les années 1950.§!"
 RULE_OPTION_KRD_JOIN_TURKEY:0 "£GFX_game_rule_flags_SRT  Intégration des Kurds"
 RULE_OPTION_KRD_JOIN_TURKEY_DESC:0 "Après avoir reçu les conseils de Sefik Hüsnü, le gouvernement kurde décidera de réintégrer la Turquie en tant qu'État autonome afin de bénéficier de toute l'aide turque et de sauver le peuple kurde."
 RULE_OPTION_KRD_JOIN_SOVIET:0 "@SOV L'ascension soviétique"
 RULE_OPTION_KRD_JOIN_SOVIET_DESC:0 "Après avoir reçu les conseils de Sefik Hüsnü, le gouvernement kurde décidera de devenir une République socialiste soviétique à part entière et de rejoindre l'Union soviétique afin de lutter contre la sécheresse avec l'aide des autres républiques soviétiques."
 RULE_OPTION_KRD_INDEPENDENT_RURAL:0 "@KUR Retour aux sources"
 RULE_OPTION_KRD_INDEPENDENT_RURAL_DESC:0 "Le gouvernement kurde fera fi des conseils de Hüsnü et s'accrochera au rêve d'une nation. Par la suite, il abandonnera le modèle d'industrialisation soviétique et reviendra à une économie agraire féodale, tout en restant fidèle à Moscou."
 RULE_OPTION_KRD_INDEPENDENT_INDUSTRIAL:0 "£GFX_game_rule_flags_KRD  Miser le double"
 RULE_OPTION_KRD_INDEPENDENT_INDUSTRIAL_DESC:0 "Le gouvernement kurde fera fi des conseils de Hüsnü et s'accrochera au rêve national. Par la suite, il poursuivra son industrialisation rapide et devra faire face à une deuxième sécheresse, et trouver une solution deviendra une question de survie."
 TRS_UNIFICATION: "@TRS [1954] Réunification de Trieste"
 RULE_OPTION_TRS_HISTORICAL: "@TRS Mémorandum de Londres"
 RULE_OPTION_TRS_HISTORICAL_DESC: "L'Italie et la Yougoslavie parviendront à un accord concernant Trieste et se partageront le territoire, la zone A revenant à l'Italie et la zone B à la Yougoslavie.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_TRS_ITALY: "@ITA Trieste italienne"
 RULE_OPTION_TRS_ITALY_DESC: "Non contente de sa part du territoire, l'Italie fera pression pour obtenir l'annexion totale de celui-ci. Craignant une intervention du Royaume-Uni et des États-Unis en faveur de l'Italie, la Yougoslavie finira par céder."
 RULE_OPTION_TRS_YUGO: "@YUG Trieste yougoslave"
 RULE_OPTION_TRS_YUGO_DESC: "La Yougoslavie contraindra l'Italie à renoncer à son contrôle total sur Trieste. Afin de préserver la paix dans l'Adriatique, l'Italie cédera et Trieste passera sous contrôle yougoslave."
 RULE_OPTION_TRS_WAR: "@ITA @YUG La guerre de Trieste"
 RULE_OPTION_TRS_WAR_DESC: "Les négociations sur la réunification échoueront, et l'Europe sera le théâtre d'une nouvelle guerre dans l'Adriatique."
 ITA_53_ELECTIONS: "@ITA Élections législatives italiennes de 1953"
 RULE_OPTION_ITA_53_ELECTIONS_HISTORICAL: "@ITA Victoire de la Coalition du Centre - Pella démissionne"
 RULE_OPTION_ITA_53_ELECTIONS_HISTORICAL_DESC: "Une large coalition regroupant les démocrates-chrétiens et les libéraux, dirigée par Giuseppe Pella, remportera les élections de 1953 et consolidera progressivement la droite italienne. Une fois la question de Trieste réglée, Pella démissionnera et sera remplacé par Mario Scelba. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_ITA_53_CENTER_RIGHT: "@ITA Victoire de la coalition du centre - Coalition de centre-droit"
 RULE_OPTION_ITA_53_CENTER_RIGHT_DESC: "Une large coalition regroupant les démocrates-chrétiens et les libéraux, dirigée par Giuseppe Pella, remportera les élections de 1953 et consolidera progressivement la droite italienne. Une fois la question de Trieste réglée, Pella restera au pouvoir et adoptera une ligne plus marquée à droite."
 RULE_OPTION_ITA_53_POPULAR_FRONT: "£GFX_game_rule_flags_ITA_communism  Victoire du Parti populaire démocratique"
 RULE_OPTION_ITA_53_POPULAR_FRONT_DESC: "Le Front populaire démocratique, coalition communiste-socialiste, remportera les élections de 1953. Après avoir perdu de justesse les élections précédentes sous l'influence de la CIA, le nouveau gouvernement de gauche fera sortir le pays de l'OTAN et mènera une politique d'équilibre entre l'Est et l'Ouest."
 ITA_58_ELECTIONS: "@ITA Élections législatives italiennes de 1958"
 RULE_OPTION_ITA_58_ELECTIONS_SOCIALIST: "Victoire socialiste"
 RULE_OPTION_ITA_58_ELECTIONS_SOCIALIST_DESC: "Le PSI socialiste remportera les élections de 1958. Au cours de ce mandat, il adoptera une ligne diplomatique plus orientée vers l'Est, avec une position plus neutre."
 RULE_OPTION_ITA_58_ELECTIONS_FANFANI: "Fanfani devient Premier ministre"
 RULE_OPTION_ITA_58_ELECTIONS_FANFANI_DESC: "Le Parti démocrate remportera les élections. Au cours de ce mandat, il adoptera une ligne plus centriste, conciliant les intérêts de la droite et de la gauche.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_ITA_58_ELECTION_RIGHT_WING: "Victoire de la droite"
 RULE_OPTION_ITA_58_ELECTION_RIGHT_WING_DESC: "Le MSI remportera les élections. Au cours de ce mandat, il mènera une politique anti-gauche teintée d'euroscepticisme, tout en conservant son alignement pro-occidental."
 EGY_EGYPTIAN_REVOLUTION: "@EGY £GFX_game_rule_flags_EGY_freeofficers   [1950s] Révolution égyptienne"
 EGY_EGYPTIAN_REVOLUTION_DESC: ""
 RULE_OPTION_EGY_MONARCHY_OVERTHROWN: "£GFX_game_rule_flags_EGY_freeofficers   Renversement de la monarchie"
 RULE_OPTION_EGY_MONARCHY_OVERTHROWN_DESC: "Les Officiers libres réussiront à organiser un coup d'État et prendront le contrôle du pays. La monarchie égyptienne sera abolie.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_EGY_REVOLUTION_CRASHED: "@EGY La révolution écrasée"
 RULE_OPTION_EGY_REVOLUTION_CRASHED_DESC: "La monarchie restera en place et les Officiers libres seront arrêtés. La monarchie se poursuivra sous un régime absolutiste."
 EGY_FUTURE_OF_MONARCHY: "@EGY [1950s] L'avenir de la monarchie"
 EGY_FUTURE_OF_MONARCHY_DESC: "§YConditions requises :§! §CLe coup d'État des officiers libres a échoué.§!"
 RULE_OPTION_EGY_MODERN_PHARAOH: "Pharaon moderne"
 RULE_OPTION_EGY_MODERN_PHARAOH_DESC: "Le roi Farouk consolidera son pouvoir absolu, en ne procédant qu'à des réformes mineures."
 RULE_OPTION_EGY_KING_REPLACED: "Farouk a été destitué"
 RULE_OPTION_EGY_KING_REPLACED_DESC: "Le roi Farouk sera destitué au profit d'un nouveau monarque. L'absolutisme prendra fin avec le rétablissement des institutions démocratiques."
 EGY_REVOLUTION_AFTERMATH: "£GFX_game_rule_flags_EGY_freeofficers  [1950s] Conflit au sein du RCC"
 EGY_REVOLUTION_AFTERMATH_DESC: "§YConditions requises :§! §CLa monarchie égyptienne est renversée.§!"
 RULE_OPTION_EGY_NASSER: "£GFX_game_rule_flags_UAR  Une révolution nationaliste"
 RULE_OPTION_EGY_NASSER_DESC: "Gamal Abdel Nasser renversera Naguib et deviendra président. Il s'emploiera à créer la République arabe unie, mouvement nationaliste arabe.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_EGY_NAGUIB: "£GFX_game_rule_flags_EGY_democracy  Une révolution démocratique"
 RULE_OPTION_EGY_NAGUIB_DESC: "Mohammed Naguib reprendra le pouvoir à Nasser, lèvera l'interdiction des partis politiques et organisera des élections libres."
 RULE_OPTION_EGY_MOHIEDDIN: "£GFX_game_rule_flags_EGY_communism  Une révolution communiste"
 RULE_OPTION_EGY_MOHIEDDIN_DESC: "Au cœur de la lutte pour le pouvoir qui oppose Nasser et Naguib, Kahlid Mohieddin et un groupe d'officiers de gauche renverseront le gouvernement et instaureront une dictature marxiste."
 EGY_REPUBLIC_ELECTION: "£GFX_game_rule_flags_EGY_democracy  [1950s] Les premières élections de la République"
 EGY_REPUBLIC_ELECTION_DESC: "§YConditions requises :§! §CMohamed Naguib a consolidé son pouvoir.§!"
 RULE_OPTION_EGY_NATIONALIST: "Victoire de Naguib"
 RULE_OPTION_EGY_NATIONALIST_DESC: "Mohamed Naguib remportera les élections et transformera progressivement l'Égypte en une démocratie multipartite de type occidental, tout en rétablissant les relations avec les autres démocraties."
 RULE_OPTION_EGY_DEMOCRATIC: "Nouvelle victoire du Wafd"
 RULE_OPTION_EGY_DEMOCRATIC_DESC: "Le Parti Wafd, désormais réformé, remportera les élections. Pour se débarrasser de leur ancienne réputation, ses membres adopteront une position anti-britannique et introduiront le libéralisme classique en Égypte."
 RULE_OPTION_EGY_ISLAMIC: "Victoire des Frères musulmans modérés"
 RULE_OPTION_EGY_ISLAMIC_DESC: "Hassan Al Hudaybi et la faction modérée des Frères musulmans remporteront les élections. Au lieu de purger radicalement l'Égypte de ses éléments irréligieux, le gouvernement adoptera des politiques alliant la gouvernance islamique aux principes démocratiques."
 RULE_OPTION_EGY_SALAFIST: "Victoire des Frères musulmans radicaux"
 RULE_OPTION_EGY_SALAFIST_DESC: "La faction radicale des Frères musulmans, dirigée par Sayyid Qutb, remportera les élections. Le nouvel État persécutera sévèrement les minorités religieuses et s'attachera à détruire la nation juive."
 EGY_FATE_OF_SUDAN: "@EGY @ENG [1950s] Le sort du Soudan"
 EGY_FATE_OF_SUDAN_DESC: "Alors que l'avenir de l'Égypte s'éloigne de plus en plus de celui de la Grande-Bretagne, l'avenir du Soudan anglo-égyptien est remis en question."
 RULE_OPTION_EGY_EGYPTIAN_SUDAN: "@EGY Soudan égyptien"
 RULE_OPTION_EGY_EGYPTIAN_SUDAN_DESC: "§YConditions requises :§! §CLe roi Farouk est le pharaon des temps modernes§!\nLe Soudan sera entièrement annexé par l'Égypte."
 RULE_OPTION_EGY_DIVIDED_SUDAN: "@EGY @SSU Le Soudan divisé"
 RULE_OPTION_EGY_DIVIDED_SUDAN_DESC: "L'Égypte annexera la moitié nord du Soudan, tandis que le sud obtiendra son indépendance."
 RULE_OPTION_EGY_INDEPENDENT_SUDAN: "£GFX_game_rule_flags_SUD_independence   Indépendance du Soudan"
 RULE_OPTION_EGY_INDEPENDENT_SUDAN_DESC: "L'Égypte et la Grande-Bretagne s'accorderont sur l'indépendance du Soudan"
 GRE_CIVIL_WAR: "@GRE @PDG [1950s] Guerre civile grecque"
 GRE_CIVIL_WAR_DESC: "L'unité de la Résistance grecque a pris fin alors que la guerre civile fait rage. L'orientation politique de la Grèce est remise en question."
 RULE_OPTION_GRE_DEMOCRACY: "@GRE Victoire du gouvernement"
 RULE_OPTION_GRE_DEMOCRACY_DESC: "L'insurrection communiste sera écrasée ; et la monarchie constitutionnelle actuelle sera maintenue.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_GRE_COMMUNISM: "@PDG Victoire communiste"
 RULE_OPTION_GRE_COMMUNISM_DESC: "L'ELAS s'emparera d'Athènes et mettra en place un gouvernement communiste, s'alignant sur le bloc de l'Est."
 GRE_1950_ELECTIONS: "@GRE Élections de 1950"
 GRE_1950_ELECTIONS_DESC: "§YConditions requises :§! §CLe gouvernement a remporté la guerre civile grecque§!"
 RULE_OPTION_GRE_VENIZELOS: "Sophocle Venizelos"
 RULE_OPTION_GRE_VENIZELOS_DESC: "Sofoklis Venizelos remportera les élections ; il sera ensuite remplacé par Nikolaos Plastiras. Au cours de ce mandat, il s'efforcera de préserver l'unité du groupe vénizéliste."
 RULE_OPTION_GRE_TSALDARIS: "Konstantinos Tsaldaris"
 RULE_OPTION_GRE_TSALDARIS_DESC: "Konstantinos Tsaldaris remportera les élections. Au cours de son mandat, il mènera une politique conservatrice avec le soutien de la monarchie."
 GRE_1951_ELECTIONS: "@GRE Élections de 1951"
 RULE_OPTION_GRE_PLASTIRAS_1951: "Nikolaos Plastiras"
 RULE_OPTION_GRE_PLASTIRAS_1951_DESC: "Nikolaos Plastiras remportera les élections. Au cours de son mandat, il tentera de se réconcilier avec la gauche."
 RULE_OPTION_GRE_PAPAGOS_1951: "Alexandros Papagos"
 RULE_OPTION_GRE_PAPAGOS_1951_DESC: "Alexandros Papagos remportera les élections. Au cours de son mandat, il modifiera le système électoral au détriment de la gauche."
 GRE_1952_ELECTIONS: "@GRE Élections de 1952"
 RULE_OPTION_GRE_PLASTIRAS_1952: "Nikolaos Plastiras"
 RULE_OPTION_GRE_PLASTIRAS_1952_DESC: "Nikolaos Plastiras remportera les élections. Au cours de son mandat, il rétablira la loi n° 509 et poursuivra la répression contre les communistes. À sa mort, Sofoklis Venizelos lui succédera."
 RULE_OPTION_GRE_PAPAGOS_1952: "Alexandros Papagos"
 RULE_OPTION_GRE_PAPAGOS_1952_DESC: "Alexandros Papagos remportera les élections. Au cours de son mandat, il abrogera la loi n° 509, permettant ainsi aux communistes de revenir sur la scène politique. À sa mort, Konstantinos Karamanlis lui succédera."
 GRE_1956_ELECTIONS: "@GRE Élections de 1956"
 RULE_OPTION_GRE_KARAMANLIS_1956: "Konstantinos Karamanlis"
 RULE_OPTION_GRE_KARAMANLIS_1956_DESC: "Konstantinos Karamanlis remportera les élections. Au cours de son mandat, il s'attachera à attirer les investissements étrangers."
 RULE_OPTION_GRE_PAPANDREOU_1956: "Georgeos Papandreou"
 RULE_OPTION_GRE_PAPANDREOU_1956_DESC: "Georgeos Papandreou remportera les élections. Au cours de son mandat, il abrogera la loi n° 511, mettant ainsi fin à l'exil interne des communistes."
 GRE_1958_ELECTIONS: "@GRE Élections de 1958"
 RULE_OPTION_GRE_KARAMANLIS_1958: "Konstantinos Karamanlis"
 RULE_OPTION_GRE_KARAMANLIS_1958_DESC: "Konstantinos Karamanlis remportera les élections. Au cours de son mandat, il prendra des mesures contre les partis de gauche tout en menant une politique d'industrialisation de la Grèce."
 RULE_OPTION_GRE_PAPANDREOU_1958: "Georgeos Papandreou"
 RULE_OPTION_GRE_PAPANDREOU_1958_DESC: "Georgeos Papandreou remportera les élections. Au cours de son mandat, il mettra en œuvre son « plan économique national »."
 GRE_JOIN_NATO_AI: "@GRE £GFX_game_rule_flags_NATO  L'adhésion de la Grèce à l'OTAN"
 RULE_OPTION_GRE_JOIN_NATO_SUCCESS: "La Grèce devient membre de l'OTAN"
 RULE_OPTION_GRE_JOIN_NATO_SUCCESS_DESC: "Lorsqu'elle y sera invitée, la Grèce deviendra membre de l'Organisation du Traité de l'Atlantique Nord."
 RULE_OPTION_GRE_JOIN_NATO_FAILURE: "La Grèce reste en dehors de l'OTAN"
 RULE_OPTION_GRE_JOIN_NATO_FAILURE_DESC: "Si elle est invitée à rejoindre l'Organisation du Traité de l'Atlantique Nord, la Grèce déclinera cette invitation et restera en dehors de l'organisation, même si elle continuera sans doute à s'aligner sur les pays occidentaux."
 PDG_GREEK_CIVIL_WAR: "@PDG [1950s] Organisation de l'ELAS"
 PDG_GREEK_CIVIL_WAR_DESC: "Le Front de libération nationale a refusé de se plier au gouvernement réactionnaire et mène une guerre ouverte contre celui-ci. La question qui se pose aujourd’hui est la suivante : comment l’ELAS doit-il s’organiser ?"
 RULE_OPTION_HISTORICAL_PDG_AI: "Guerre conventionnelle"
 RULE_OPTION_HISTORICAL_PDG_AI_DESC: "L'Armée démocratique grecque poursuivra la guerre conventionnelle. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_GUERILLA_PDG_AI: "Guerre de guérilla"
 RULE_OPTION_GUERILLA_PDG_AI_DESC: "L'Armée démocratique grecque s'inspirera des guerres de libération et mènera une guérilla."
 PDG_POST_STALIN_COURSE: "@PDG Le communisme post-stalinien en Grèce"
 PDG_POST_STALIN_COURSE_DESC: "Avec la disparition de Staline, la direction du pays se trouve à un tournant."
 RULE_OPTION_PDG_ZACHARIDIS_STAYS: "Zacharidis reste"
 RULE_OPTION_PDG_ZACHARIDIS_STAYS_DESC: "Nikos Zacharidis conservera le pouvoir. Il s'opposera au révisionnisme tout en s'alignant sur la ligne maoïste."
 RULE_OPTION_PDG_KOLIGIANNIS_TAKES_OVER: "Koligiannis prend la relève"
 RULE_OPTION_PDG_KOLIGIANNIS_TAKES_OVER_DESC: "Kostas Koligiannis prendra les rênes de la Grèce. Il suivra la ligne révisionniste et maintiendra l'alignement sur l'Union soviétique."
 RULE_OPTION_PDG_VAFEIADIS_TAKES_OVER: "Vafeiadis prend la relève"
 RULE_OPTION_PDG_VAFEIADIS_TAKES_OVER_DESC: "Markos Vafeiadis prendra la tête du gouvernement grec. Tout en maintenant l'alignement de la Grèce sur l'Union soviétique, il suivra une ligne plus libertaire."
 BCP_FOREIGN_AI_BEHAVIOR: "@BCP [1950s] Front communiste birman"
 RULE_OPTION_CHINESE_ALIGNMENT_BCP_AI: "Alignement chinois"
 RULE_OPTION_CHINESE_ALIGNMENT_BCP_AI_DESC: "Les communistes birmans s'aligneront sur la Chine et le maoïsme. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_SOVIET_ALIGNMENT_BCP_AI: "Alignement soviétique"
 RULE_OPTION_SOVIET_ALIGNMENT_BCP_AI_DESC: "Les communistes birmans s'aligneront sur l'Union soviétique."
 BCP_INTERNAL_AI_BEHAVIOR: "@BCP [1950s] Affaires internes de l'Armée populaire de libération birmane"
 RULE_OPTION_POLITICAL_FORCE: "Collaborer avec la NUF"
 RULE_OPTION_POLITICAL_FORCE_DESC: "Le Parti communiste birman va désormais se concentrer sur les élections législatives, prenant ainsi ses distances par rapport à l'insurrection."
 RULE_OPTION_LIBERATION_WAR_BCP_AI: "Guerre de libération"
 RULE_OPTION_LIBERATION_WAR_BCP_AI_DESC: "Le Parti communiste birman va intensifier son insurrection et en faire une priorité. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 PER_ELECTIONS_52: "@PER Élections iraniennes de 1952"
 RULE_OPTION_HISTORICAL_MOSADDEGH_52: "Victoire du Front national"
 RULE_OPTION_HISTORICAL_MOSADDEGH_52_DESC: "Mohammad Mossadegh défendra sa position et poursuivra ses politiques nationalistes et d'indépendance nationale. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_PER_ROYALIST_52: "Victoire royaliste"
 RULE_OPTION_HISTORICAL_PER_ROYALIST_52_DESC: "Le religieux royaliste Hassan Emami remportera les élections. En tant qu'anglophile notoire, il s'efforcera d'améliorer les relations avec l'Occident tout en cherchant à apaiser les tensions générales."
 PER_AJAX: "@PER Opération AJAX"
 PER_AJAX_DESC: "§YConditions requises:§! §CLe Front national a remporté les élections de 1952§!\nLa nationalisation des compagnies pétrolières par Mossadegh a été perçue comme un geste hostile par les puissances occidentales, qui ont donc demandé au Shah de destituer son propre Premier ministre."
 RULE_OPTION_HISTORICAL_PER_AJAX: "Le Shah donne son accord"
 RULE_OPTION_HISTORICAL_PER_AJAX_DESC: "Le Shah acceptera de soutenir le coup d'État anglo-américain contre Mossadegh. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_SHAH_REFUSE: "Le Shah refuse"
 RULE_OPTION_HISTORICAL_SHAH_REFUSE_DESC: "Le Shah se rangera du côté de Mossadegh et refusera de soutenir le coup d'État. Dans les semaines qui suivront, des milliers de religieux et d'extrémistes chiites se soulèveront contre le gouvernement laïc, renverseront la dynastie Pahlavi et rétabliront le règne des Qajar sous la forme d'une monarchie islamiste."
 PER_RIOTS: "@PER Émeutes à Téhéran"
 PER_RIOTS_AI_DESC: "§YConditions requises :§! §CL'opération Ajax a été lancée.§!"
 RULE_OPTION_HISTORICAL_PER_RIOTS: "La monarchie tient bon"
 RULE_OPTION_HISTORICAL_PER_RIOTS_DESC: "Si le coup d'État réussit, le régime monarchique s'en trouvera renforcé et le shah reprendra le pouvoir.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_RIOTS_REPUBLIC: "Le coup d'État et les émeutes ont été réprimés"
 RULE_OPTION_RIOTS_REPUBLIC_DESC: "Trahis par la monarchie, Mosaddegh refusera de céder et fera échouer le coup d'État par tous les moyens. Plus tard, il transformera l'Iran en république et éliminera les éléments extrémistes de la société."
 RULE_OPTION_RIOTS_TUDEH: "Prise de contrôle par le Tudeh"
 RULE_OPTION_RIOTS_TUDEH_DESC: "À mesure que les émeutes s'intensifient, le Parti Tudeh, fort du soutien de l'Union soviétique et des minorités, abolira la monarchie et instaurera un État communiste à parti unique."
 PER_COMMUNISM_SPLIT: "£GFX_game_rule_flags_PER_communism  L'avenir de la révolution iranienne"
 PER_COMMUNISM_SPLIT_DESC: "§YRequiert :§! §CLa prise de contrôle de CTudeh pendant les émeutes de Téhéran§!\n"
 RULE_OPTION_PER_SOVIET: "@SOV Alignement soviétique"
 RULE_OPTION_PER_SOVIET_DESC: "Le nouveau gouvernement iranien se rangera du côté de l'Union soviétique et du bloc de l'Est, cédant ses territoires du nord en échange d'une aide accrue du COMECON."
 RULE_OPTION_PER_YUGOSLAVIA: "@YUG Mouvement des pays non alignés"
 RULE_OPTION_PER_YUGOSLAVIA_DESC: "Méfiante à l'égard de la politique expansionniste de l'Union soviétique vis-à-vis de l'Azerbaïdjan, l'Iran décidera plutôt de rejoindre le Mouvement des pays non alignés et d'opter pour la neutralité armée."
 PER_GHARANI_COUP: "@PER [1950s] Coup d'État Gharani"
 PER_GHARANI_COUP_DESC: "§YConditions requises:§! §CMonarchie : la situation reste tendue lors des émeutes à Téhéran§!.\n"
 RULE_OPTION_PER_GHARANI_COUP_FAIL: "Échec du coup d'État"
 RULE_OPTION_PER_GHARANI_COUP_FAIL_DESC: "Gharani échouera dans sa tentative et sera emprisonné. Mossadegh sera exécuté par la suite. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_PER_GHARANI_COUP_SUCCEED: "Le coup d'État a réussi"
 RULE_OPTION_PER_GHARANI_COUP_SUCCEED_DESC: "Gharani réussira à renverser le gouvernement. La monarchie sera maintenue ; Mosaddegh sera libéré et des élections auront lieu."
 PER_GHARANI_COUP_AFTERMATH: "@PER [1950s] Le coup de maître soviétique"
 PER_GHARANI_COUP_AFTERMATH_DESC: "§YConditions requises :§! §CLe coup d'État de Gharani a échoué§!.\nShah prévoit de signer un pacte de non-agression avec l'Union soviétique, ce à quoi s'opposent les États-Unis."
 RULE_OPTION_PER_ALIGN_AMERICA: "@PER @USA S'aligner sur l'Amérique"
 RULE_OPTION_PER_ALIGN_AMERICA_DESC: "Shah sera contraint de rejoindre la sphère d'influence américaine, puis reconnaîtra Israël. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_PER_IRANIAN_CIVIL_WAR: "@PER £GFX_game_rule_flags_PER_communism   £GFX_game_rule_flags_KRD   Guerre civile iranienne"
 RULE_OPTION_PER_IRANIAN_CIVIL_WAR_DESC: "Le shah Reza Pahlavi sera assassiné. Malgré le couronnement d'un nouveau shah, Gholamreza Pahlavi, les Kurdes et les communistes déclencheront une guerre civile."
 RULE_OPTION_PER_TUDEH_RETURNS: "£GFX_game_rule_flags_PER_communism  Le retour de Tudeh"
 RULE_OPTION_PER_TUDEH_RETURNS_DESC: "Shah Reza Pahlavi sera assassiné. Les communistes profiteront du chaos pour prendre rapidement le pouvoir."
 PER_1954_ELECTIONS: "@PER Élections de 1954"
 PER_1954_ELECTIONS_DESC: "§YConditions requises :§! §CMosaddegh a proclamé la République.§!\n"
 RULE_OPTION_PER_MOSADDEGH_1954: "Victoire du Front national"
 RULE_OPTION_PER_MOSADDEGH_1954_DESC: "Le Front national remportera les élections. Au cours de ce mandat, il alignera l'Iran sur les États-Unis."
 RULE_OPTION_PER_TOILERS_PARTY_1954: "Victoire du Parti des travailleurs"
 RULE_OPTION_PER_TOILERS_PARTY_1954_DESC: "Le Parti des travailleurs remportera les élections. Au cours de ce mandat, il s'alignera sur la Yougoslavie."
 RULE_OPTION_PER_MOJAHEDS_1954: "La victoire des Mojaheds"
 RULE_OPTION_PER_MOJAHEDS_1954_DESC: "La Société des moudjahidines musulmans remportera les élections. Au cours de ce mandat, elle mettra en œuvre la charia."
 PER_1958_ELECTIONS: "@PER Élections de 1958"
 PER_1958_ELECTIONS_DESC: "§YConditions requises :§! §CMosaddegh a proclamé la République§! OU §CGle coup d'État de Gharani a réussi§!.\n"
 RULE_OPTION_PER_MOSADDEGH_1958: "Victoire du Front national"
 RULE_OPTION_PER_MOSADDEGH_1958_DESC: "Le Front national va remporter les élections."
 RULE_OPTION_PER_TOILERS_PARTY_1958: "Victoire du Parti des travailleurs"
 RULE_OPTION_PER_TOILERS_PARTY_1958_DESC: "Le Parti des travailleurs va remporter les élections."
 RULE_OPTION_PER_MOJAHEDS_1958: "La victoire des Mojaheds"
 RULE_OPTION_PER_MOJAHEDS_1958_DESC: "La Société des Moudjahidines musulmans remportera les élections. Au cours de ce mandat, elle abolira la monarchie pour instaurer une République islamique."
 YAN_FAILURE_OUTCOME: "@YAN [1950s] Catastrophe dans le Yunnan"
 YAN_FAILURE_OUTCOME_DESC: "§YConditions requises :§! §C§RLes communistes§! ont remporté la guerre civile chinoise§! ET §CL'offensive sur le Yunnan a échoué§!\n"
 RULE_OPTION_HISTORICAL_YAN_FAILURE: "@YAN Garder le cap"
 RULE_OPTION_HISTORICAL_YAN_FAILURE_DESC: "Après avoir échoué à percer les lignes du Yunnan, Liu Yuanlin prendra le commandement de l'armée. Le rêve de libérer la Chine est toujours vivant !\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_YAN_SHAN_STATE: "£GFX_game_rule_flags_YAN_Shan  L'État Shan"
 RULE_OPTION_YAN_SHAN_STATE_DESC: "Après avoir échoué à percer dans le Yunnan, le général Li Mi se détachera de Taïwan et s'attachera à établir un État shan-chinois sous la direction du Kuomintang."
 TUR_KURDISH_QUESTION: "@TUR £GFX_game_rule_flags_KRD   [1950s] La question kurde en Turquie"
 RULE_OPTION_MOUNTAIN_TURKS: "Les Turcs des montagnes"
 RULE_OPTION_MOUNTAIN_TURKS_DESC: "Le gouvernement turc ne tolérera pas l'émergence d'une identité kurde distincte et s'efforcera de la réprimer.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_KURDISH_TOLERATION: "Tolérance kurde"
 RULE_OPTION_KURDISH_TOLERATION_DESC: "Le gouvernement turc va nouer le dialogue avec les dirigeants locaux et tolérera l'identité kurde."
 TUR_1950_ELECTIONS: "@TUR Élections législatives de 1950"
 RULE_OPTION_CHP_1950: "Victoire du CHP"
 RULE_OPTION_CHP_1950_DESC: "İsmet İnönü et son CHP conserveront le pouvoir. Au cours de ce mandat, ils réaffirmeront le kémalisme et se concentreront sur le développement industriel."
 RULE_OPTION_DP_1950: "Victoire du Parti démocrate (DP)"
 RULE_OPTION_DP_1950_DESC: "Adnan Menderes et son Parti démocrate (DP) seront élus. Au cours de ce mandat, ils commenceront à renverser les anciennes politiques du CHP et se concentreront sur le développement rural. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 TUR_1954_ELECTIONS: "@TUR Élections législatives de 1954"
 RULE_OPTION_CHP_1954: "Victoire du CHP"
 RULE_OPTION_CHP_1954_DESC: "İsmet İnönü et son CHP seront élus. Au cours de ce mandat, ils s'attacheront à promouvoir le développement industriel."
 RULE_OPTION_DP_1954: "Victoire du Parti démocrate (DP)"
 RULE_OPTION_DP_1954_DESC: "Adnan Menderes et son Parti démocrate seront élus. Au cours de ce mandat, ils s'engageront sur la voie de l'autocratie. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 TUR_1957_ELECTIONS: "@TUR Élections législatives de 1957"
 RULE_OPTION_CHP_1957: "Victoire du CHP"
 RULE_OPTION_CHP_1957_DESC: "İsmet İnönü et son CHP seront élus. Au cours de ce mandat, ils se concentreront sur les questions sociales et économiques."
 RULE_OPTION_DP_1957: "Victoire du Parti démocrate (DP)"
 RULE_OPTION_DP_1957_DESC: "Adnan Menderes et son Parti démocrate seront élus. Au cours de ce mandat, ils s'engageront sur la voie de l'autocratie. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 TUR_ISRAELI_RELATIONS: "@TUR @ISR [1950s] Les relations avec Israël"
 TUR_ISRAELI_RELATIONS_DESC: "La Turquie est le premier pays à majorité musulmane à avoir reconnu Israël. Cependant, les relations avec Israël poseront un problème aux autres pays arabes, tout autant que l'inverse."
 RULE_OPTION_ESTABLISH_LEGATION: "Établir une légation"
 RULE_OPTION_ESTABLISH_LEGATION_DESC: "La Turquie entretiendra et développera ses relations avec Israël, tout en conservant des liens cordiaux avec les pays arabes.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_RESCIND_RECOGNITION: "Retirer la reconnaissance"
 RULE_OPTION_RESCIND_RECOGNITION_DESC: "La Turquie va rompre ses relations avec Israël dans un revirement radical ; elle se retourne contre Israël tout en renforçant ses liens avec les pays arabes."
 TUR_UAR_RELATIONS: "@TUR £GFX_game_rule_flags_UAR   [1950s] Réaction de la Turquie face à la RAU"
 TUR_UAR_RELATIONS_DESC: "§YConditions requises :§! §CRéunion de la République arabe unie.§!"
 RULE_OPTION_RECOGNIZE_UAR: "Reconnaître la RAU"
 RULE_OPTION_RECOGNIZE_UAR_DESC: "La Turquie reconnaîtra la RAU, ce qui permettra d'apaiser toute tension éventuelle"
 RULE_OPTION_CLASH_UAR: "Imposer un changement de régime"
 RULE_OPTION_CLASH_UAR_DESC: "La Turquie fera pression pour obtenir un changement de régime en Syrie."
 RULE_OPTION_ANNEX_NORTH_SYRIA: "Annexer le Nord de la Syrie"
 RULE_OPTION_ANNEX_NORTH_SYRIA_DESC: "La Turquie va envahir et annexer unilatéralement le nord de la Syrie."
 TUR_JOIN_NATO_AI: "@TUR £GFX_game_rule_flags_NATO  L'adhésion de la Turquie à l'OTAN"
 RULE_OPTION_TUR_JOIN_NATO_SUCCESS: "La Turquie devient membre de l'OTAN"
 RULE_OPTION_TUR_JOIN_NATO_SUCCESS_DESC: "Lorsqu'elle en sera invitée, la Turquie deviendra membre de l'Organisation du Traité de l'Atlantique Nord."
 RULE_OPTION_TUR_JOIN_NATO_FAILURE: "La Turquie reste en dehors de l'OTAN"
 RULE_OPTION_TUR_JOIN_NATO_FAILURE_DESC: "Si elle est invitée à rejoindre l'Organisation du Traité de l'Atlantique Nord, la Turquie déclinera cette invitation et restera en dehors de l'organisation, même si elle continue de s'aligner sur l'Occident."
 SPR_POLITICAL_REFORMS: "@SPR [1950s] Orientation politique"
 RULE_OPTION_SPR_POLITICS_LIBERAL: "Réformes libérales"
 RULE_OPTION_SPR_POLITICS_LIBERAL_DESC: "L'Espagne mettra progressivement fin aux politiques phalangistes et poursuivra le renouveau de ses relations avec les démocraties occidentales, en sollicitant leur coopération. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_SPR_POLITICS_FALANGE: "Retour aux sources"
 RULE_OPTION_SPR_POLITICS_FALANGE_DESC: "Les principes traditionalistes et phalangistes originaux du mouvement franquiste seront préservés à l'ère moderne."
 SPR_RETURN_OF_MOROCCO: "@SPR @MOR [1950s] Le retour du Maroc espagnol"
 RULE_OPTION_RETURN_RIF: "Rif est de retour"
 RULE_OPTION_RETURN_RIF_DESC: "L'Espagne acceptera de restituer le Rif, mais refusera de restituer tout autre territoire."
 RULE_OPTION_RETURN_IFNI: "Ifni et le Rif sont restitués"
 RULE_OPTION_RETURN_IFNI_DESC: "L'Espagne acceptera de restituer le Rif et Ifni, mais refusera de restituer tout autre territoire."
 RULE_OPTION_RETURN_TARFAYA: "Le Rif et Tarfaya sont de retour"
 RULE_OPTION_RETURN_TARFAYA_DESC: "L'Espagne acceptera de restituer le Rif et Tarfaya, mais refusera de restituer tout autre territoire."
 RULE_OPTION_RETURN_BOTH: "Tous les biens sont restitués"
 RULE_OPTION_RETURN_BOTH_DESC: "L'Espagne acceptera de restituer tous ses territoires au Maroc, mettant ainsi fin à la domination espagnole.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 CHI_CHINESE_CIVIL_WAR: "@CHI @PRC [1950s] Guerre civile chinoise"
 CHI_CHINESE_CIVIL_WAR_DESC: "Depuis la défaite de l'Empire japonais, le conflit entre le gouvernement central dirigé par le Kuomintang et l'Armée populaire de libération communiste a repris et se poursuit encore aujourd'hui. Le vainqueur de cette guerre déterminera l'avenir de toute l'Asie et du monde entier."
 RULE_OPTION_CCW_KMT_VICTORY: "@CHI Victoire du Kuomintang"
 RULE_OPTION_CCW_KMT_VICTORY_DESC: "Le gouvernement central dirigé par le Kuomintang renversera la situation et vaincra les communistes. L'Union soviétique interviendra pour sauver les communistes et éviter leur anéantissement total, instaurant ainsi une paix fragile qui s'étendra du Qinghai à Pékin."
 RULE_OPTION_CCW_CCP_VICTORY: "@PRC Victoire du Parti communiste"
 RULE_OPTION_CCW_CCP_VICTORY_DESC: "L'Armée populaire de libération vaincra le gouvernement central, et la République populaire de Chine sera proclamée. Les vestiges du Kuomintang se replieront à Taïwan et en Birmanie.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 CHI_DEFEAT_AFTERMATH: "@CHI [1950s] Les conséquences de la défaite"
 CHI_DEFEAT_AFTERMATH_DESC: "§YConditions requises :§! §C§RLes communistes§! ont remporté la guerre civile chinoise§!\nLe continent est tombé aux mains des communistes. L'urgence de la situation exige une attention immédiate."
 RULE_OPTION_CHI_TEMPORARY_PROVISIONS: "@CHI Dispositions transitoires"
 RULE_OPTION_CHI_TEMPORARY_PROVISIONS_DESC: "Une fois le continent perdu, le gouvernement prolongera la loi martiale, instaurant de fait une dictature à Taïwan. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_CHI_ABANDON_HOPE: "£GFX_game_rule_flags_ROC_formosa   Abandonner tout espoir"
 RULE_OPTION_CHI_ABANDON_HOPE_DESC: "Si la Chine continentale venait à perdre le contrôle de Taïwan, le peuple taïwanais se soulèverait et renverserait le régime du Kuomintang, proclamant ainsi son indépendance vis-à-vis de la Chine."
 CHI_BATTLE_OF_HAINAN: "@CHI @PRC [1950s] Bataille de Hainan"
 CHI_BATTLE_OF_HAINAN_DESC: "§YConditions requises :§! §C§RLes communistes§! ont remporté la guerre civile chinoise§!\nLe Kuomintang ayant perdu le continent, l'Armée populaire de libération lance une opération amphibie sur Hainan."
 RULE_OPTION_CHI_KMT_HAINAN: "@CHI Le Kuomintang contrôle Hainan"
 RULE_OPTION_CHI_KMT_HAINAN_DESC: "Malgré la suprématie communiste, les forces du Kuomintang conserveront le contrôle de Hainan, stoppant ainsi l'avancée de l'Armée populaire de libération. Hainan constituera une frontière précaire pour le Kuomintang."
 RULE_OPTION_CHI_CCP_HAINAN: "@PRC L'APL s'empare de Hainan"
 RULE_OPTION_CHI_CCP_HAINAN_DESC: "L'Armée populaire de libération réussira à occuper Hainan et à repousser le Kuomintang vers la mer. Taïwan est le dernier refuge du Kuomintang. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 CHI_SUN_LIREN_COUP: "@CHI [1950s] Le coup d'État de Sun Li-jen"
 CHI_SUN_LIREN_COUP_DESC: "§YConditions requises :§! §CDictature du Kuomintang à Taïwan§!\nTchang Kaï-chek est devenu paranoïaque ; il y a des rumeurs de complot en vue d'un coup d'État militaire."
 RULE_OPTION_CHI_COUP_FAILS: "Échec du coup d'État"
 RULE_OPTION_CHI_COUP_FAILS_DESC: "La tentative de Sun Liren visant à renverser Tchang a échoué, et la dictature de Tchang va se poursuivre. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_CHI_COUP_SUCCEEDS: "Le coup d'État réussit"
 RULE_OPTION_CHI_COUP_SUCCEEDS_DESC: "Sun Liren réussira à renverser Tchang et entamera une démocratisation progressive avec le soutien des États-Unis."
 CHI_TAIWAN_ELECTIONS_1954: "£GFX_game_rule_flags_ROC_formosa   Élections législatives taïwanaises de 1954"
 CHI_TAIWAN_ELECTIONS_1954_DESC: "§YConditions requises :§! §CTaïwan est indépendant§!\n"
 RULE_OPTION_CHI_DPP_1954: "Victoire du Parti démocratique progressiste"
 RULE_OPTION_CHI_DPP_1954_DESC: "Les progressistes démocrates remporteront les élections. Au cours de ce mandat, ils mettront en œuvre un programme libéral."
 RULE_OPTION_CHI_TCP_1954: "Victoire du Parti communiste taïwanais"
 RULE_OPTION_CHI_TCP_1954_DESC: "Les communistes taïwanais remporteront les élections. Au cours de ce mandat, ils noueront des liens avec les communistes asiatiques, indépendamment de Mao."
 RULE_OPTION_CHI_DEMSOC_1954: "Victoire des socialistes démocrates"
 RULE_OPTION_CHI_DEMSOC_1954_DESC: "Les progressistes démocrates remporteront les élections. Au cours de ce mandat, ils mettront en œuvre des politiques sociales-démocrates."
 CHI_TAIWAN_ELECTIONS_1958: "£GFX_game_rule_flags_ROC_formosa   Élections législatives taïwanaises de 1958"
 CHI_TAIWAN_ELECTIONS_1958_DESC: "§YConditions requises :§! §CTaïwan est indépendant§!\n"
 RULE_OPTION_CHI_DPP_1958: "Victoire du Parti démocratique progressiste"
 RULE_OPTION_CHI_DPP_1958_DESC: "Les progressistes démocrates remporteront les élections. Au cours de ce mandat, ils noueront des contacts avec d'autres puissances régionales."
 RULE_OPTION_CHI_TCP_1958: "Victoire du Parti communiste taïwanais"
 RULE_OPTION_CHI_TCP_1958_DESC: "Les communistes taïwanais remporteront les élections. Au cours de ce mandat, ils adhéreront au COMECON, tout en prenant leurs distances avec Mao."
 RULE_OPTION_CHI_DEMSOC_1958: "Victoire des socialistes démocrates"
 RULE_OPTION_CHI_DEMSOC_1958_DESC: "Les progressistes démocrates remporteront les élections. Au cours de ce mandat, ils mettront en œuvre des politiques sociales-démocrates."
 CHI_KUOMINTANG_REFORM: "@CHI [1950s] Réforme du Kuomintang"
 CHI_KUOMINTANG_REFORM_DESC: "§YConditions requises :§! §C§BLe Kuomintang§! a remporté la guerre civile chinoise§!\nLe Kuomintang a repoussé les communistes ; cependant, le parcours politique ne fait que commencer. Surtout, l'orientation du parti doit être réexaminée."
 RULE_OPTION_CHI_KMT_REFORM: "Lancer les réformes"
 RULE_OPTION_CHI_KMT_REFORM_DESC: "Les dirigeants du Kuomintang vont mettre en œuvre de vastes réformes politiques et sociales."
 RULE_OPTION_CHI_KMT_STATUS_QUO: "Le statu quo perdure"
 RULE_OPTION_CHI_KMT_STATUS_QUO_DESC: "La direction du Kuomintang maintiendra les principes actuels."
 CHI_NEW_PRESIDENT: "@CHI [1950s] Nouveau président de la Chine"
 CHI_NEW_PRESIDENT_DESC: "§YConditions requises :§! §C§BLe Kuomintang§! a remporté la guerre civile chinoise§!\nAlors que les réformes sont en cours, le Comité central de réforme va être mis en place ; c'est lui qui désignera le prochain président."
 RULE_OPTION_CHI_KMT_LI_ZONGREN: "Li Zongren"
 RULE_OPTION_CHI_KMT_LI_ZONGREN_DESC: "Li Zongren consolidera son pouvoir et sera nommé président. Il entamera alors un processus de démocratisation progressive en Chine."
 RULE_OPTION_CHI_KMT_JIANG_JIESHI: "Chiang Kai-shek"
 RULE_OPTION_CHI_KMT_JIANG_JIESHI_DESC: "Chiang Kai-shek reprendra le pouvoir puisqu'il sera (re)nommé président, poursuivant ainsi son long règne autoritaire"
 RULE_OPTION_CHI_KMT_SUN_LIREN: "Sun Liren"
 RULE_OPTION_CHI_KMT_SUN_LIREN_DESC: "Sun Liren sera nommé président et collaborera plus étroitement avec les Américains."
 CHI_RETURN_TO_TIBET: "@CHI @TIB [1950s] La question du Tibet"
 CHI_RETURN_TO_TIBET_DESC: "§YConditions requises :§! §C§BLe Kuomintang§! a remporté la guerre civile chinoise§!\nUne fois la situation stabilisée en Chine, la question de l'avenir du Tibet ne sera plus qu'une formalité."
 RULE_OPTION_CHI_STAGE_COUP: "@CHI @TIB Coup d'État au Tibet"
 RULE_OPTION_CHI_STAGE_COUP_DESC: "La Chine organisera un coup d'État pour installer le Panchen Lama à la tête du Tibet, transformant ainsi le Tibet en région autonome si l'opération aboutit."
 RULE_OPTION_CHI_LEAVE_TIBET: "@TIB Quitter le Tibet"
 RULE_OPTION_CHI_LEAVE_TIBET_DESC: "La Chine reconnaîtra l'indépendance du Tibet, mettant ainsi fin au débat sur la souveraineté tibétaine. Cela permettra d'établir des relations plus cordiales avec l'Inde."
 RULE_OPTION_CHI_INVADE_TIBET: "@CHI Envahir le Tibet"
 RULE_OPTION_CHI_INVADE_TIBET_DESC: "La Chine envahira le Tibet pour rétablir son contrôle, puis procédera à une purge de la noblesse traditionnelle."
 CHI_STANCE_ON_VIETNAM: "@CHI @VIE [1950s] La position de la Chine vis-à-vis du Vietnam"
 CHI_STANCE_ON_VIETNAM_DESC: "§YConditions requises :§! §C§BLe Kuomintang§! a remporté la guerre civile chinoise§!\nLe Kuomintang chinois ayant vaincu les communistes, le gouvernement chinois adoptera une position hostile au communisme à l'étranger ; le Vietnam ne fera pas exception."
 RULE_OPTION_CHI_SUPPORT_FRENCH: "Soutenir les Français"
 RULE_OPTION_CHI_SUPPORT_FRENCH_DESC: "Le gouvernement chinois apportera un soutien direct aux Français contre le Viêt Minh ; il adoptera une approche plus résolue."
 RULE_OPTION_CHI_SUPPORT_VNQDD: "Soutenir le VNQDD"
 RULE_OPTION_CHI_SUPPORT_VNQDD_DESC: "Le gouvernement chinois soutiendra le Kuomintang vietnamien tant au nord qu'au sud, tout en limitant son implication."
 PRC_HUNDRED_FLOWERS_CAMPAIGN: "@PRC [1950s] Fin de la campagne des « Cent Fleurs »"
 PRC_HUNDRED_FLOWERS_CAMPAIGN_DESC: "§YRequires:§! §C§RLes communistes§! ont remporté la guerre civile chinoise§!\nLe projet mis en place par Mao Zedong pour recueillir les critiques a dégénéré. Face à la montée de l'opposition, le Parti doit prendre des mesures."
 RULE_OPTION_PRC_RECTIFICATION: "Défaillance - Remédiation"
 RULE_OPTION_PRC_RECTIFICATION_DESC: "La Chine rétablira l'ordre en lançant une campagne anti-droitière, afin de revenir au statu quo. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_PRC_DEMOCRATIZATION: "Succès - Poursuite des réformes"
 RULE_OPTION_PRC_DEMOCRATIZATION_DESC: "L'opposition parviendra à renverser Mao et commencera à accorder davantage de libertés. \nCela pourrait permettre une unification avec le régime de Taïwan."
 PRC_TIBETAN_UPRISING: "@PRC @TIB [1950s] Soulèvement tibétain"
 PRC_TIBETAN_UPRISING_DESC: "§YConditions requises :§! §C§RLes communistes§! ont remporté la guerre civile chinoise§!\nBien que le pays ait été libéré en même temps que le reste de la Chine, un soulèvement contre le régime communiste est en cours."
 RULE_OPTION_PRC_SUPPRESS_UPRISING: "@PRC Réprimer le soulèvement"
 RULE_OPTION_PRC_SUPPRESS_UPRISING_DESC: "La Chine va réprimer le soulèvement et, ce faisant, exiler le Dalaï-Lama.\n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_PRC_LEAVE_TIBET: "@TIB Quitter le Tibet"
 RULE_OPTION_PRC_LEAVE_TIBET_DESC: "La Chine cédera face au soulèvement et rétablira l'indépendance du Tibet."
 PRC_MAO_AND_LIU: "@PRC [1960s] Mao et Liu"
 PRC_MAO_AND_LIU_DESC: "Suite à l'échec du « Grand Bond en avant », Mao est contraint de se retirer au second plan, et c'est désormais Liu Shaoqi qui tient les rênes. Mais Mao prévoit de revenir, et la question est de savoir s'il parviendra à ses fins."
 RULE_OPTION_PRC_MAO_RETURNS: "Mao prend le dessus sur Liu"
 RULE_OPTION_PRC_MAO_RETURNS_DESC: "Mao Zedong reprendra ses fonctions au sein des instances décisionnaires. Cela lui permettra de lancer la Révolution culturelle, puis d'éliminer tous ses opposants. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_PRC_MAO_RETIRES: "Liu prend le dessus sur Mao"
 RULE_OPTION_PRC_MAO_RETIRES_DESC: "Liu Shaoqi contraindra Mao à prendre sa retraite, mettant ainsi fin à son implication au sein du Parti. Le président Liu lancera par la suite le « Printemps de Pékin », qui marquera le début d'une libéralisation progressive du climat politique."
 PRC_SINO_INDIAN_CONFLICT: "@PRC @RAJ [1960s] Conflit sino-indien"
 PRC_SINO_INDIAN_CONFLICT_DESC: "Alors que les relations entre la Chine et l'Inde se détériorent, un conflit se profile à l'horizon ; mais est-il inévitable ?"
 RULE_OPTION_PRC_INVADE_AKSAI_CHIN: "Envahir l'Aksai Chin"
 RULE_OPTION_PRC_INVADE_AKSAI_CHIN_DESC: "Une série de conflits frontaliers éclatera entre la Chine et l'Inde. Ce conflit se soldera par l'occupation et l'annexion de l'Aksai Chin par la Chine. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_PRC_STRIKE_A_THAW: "Dégel"
 RULE_OPTION_PRC_STRIKE_A_THAW_DESC: "Le conflit frontalier ne s'intensifiera pas et sera réglé par la signature de traités."
 PRC_SINO_SOVIET_CONFLICT: "@PRC @SOV [1960s] Conflit sino-soviétique"
 PRC_SINO_SOVIET_CONFLICT_DESC: "Une petite île, appelée Damansky en russe et Zhenbao en chinois, est source de conflit entre la Chine et l'Union soviétique. Les relations étant tendues en raison de la rupture sino-soviétique, l'avenir de l'île est incertain."
 RULE_OPTION_PRC_SETTLE_A_DEAL: "Conclure un accord"
 RULE_OPTION_PRC_SETTLE_A_DEAL_DESC: "Le conflit sera résolu sans effusion de sang."
 RULE_OPTION_PRC_CEASEFIRE: "Conflit gelé"
 RULE_OPTION_PRC_CEASEFIRE_DESC: "Le conflit ne durera pas longtemps ; mais il n'y aura pas non plus de solution durable. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 PRC_MANCHURIA_POST_STALIN: "£GFX_game_rule_flags_PRC_SOV_communism   [1950s] L'orientation post-stalinienne"
 PRC_MANCHURIA_POST_STALIN_DESC: "§YConditions requises :§! §C§BLe Kuomintang§! a remporté la guerre civile chinoise§!\nFace aux communistes chinois sous la direction de Staline, Mao a été contraint de démissionner au profit de Wang Ming. Mais avec la disparition de Staline, l'avenir de la direction chinoise est aussi incertain que celui des autres pays du bloc de l'Est alignés sur l'Union soviétique."
 RULE_OPTION_PRC_WANG_MING_STAYS: "Wang Ming reste"
 RULE_OPTION_PRC_WANG_MING_STAYS_DESC: "Le Parti communiste chinois s'orientera vers le révisionnisme et entretiendra des relations avec l'Union soviétique, en purgeant Mao et ses partisans."
 RULE_OPTION_PRC_MAO_RETURNS_MANCHU: "Le retour de Mao Zedong"
 RULE_OPTION_PRC_MAO_RETURNS_MANCHU_DESC: "Le Parti communiste chinois refusera de céder au révisionnisme, ce qui permettra à Mao Zedong d'écarter Wang Ming pour la deuxième fois."
 PRC_MANCHURIA_POST_KHRUSHCHEV: "£GFX_game_rule_flags_PRC_SOV_communism   [1960s] L'orientation post-Khrouchtchev"
 PRC_MANCHURIA_POST_KHRUSHCHEV_DESC: "Le gouvernement populaire reste en place ; mais alors que la direction du Soviet change une nouvelle fois, le Parti communiste chinois doit à nouveau ajuster son cap."
 RULE_OPTION_PRC_LIBERAL_COMMUNISM: "Le printemps chinois"
 RULE_OPTION_PRC_LIBERAL_COMMUNISM_DESC: "Le gouvernement populaire adoptera une ligne libertaire, sous la direction de Kai Feng. Les communistes chinois continueront à suivre la ligne soviétique."
 RULE_OPTION_PRC_ROLL_BACK_STATUS_QUO: "Faire marche arrière sur la libéralisation"
 RULE_OPTION_PRC_ROLL_BACK_STATUS_QUO_DESC: "Les efforts de la Chine en faveur de la libéralisation du pays seront abandonnés, et les partisans de cette cause seront purgés."
 CAN_1949_ELECTIONS_RULE: "@CAN Élections de 1949"
 RULE_OPTION_CAN_CCF_1949: "Victoire du CCF"
 RULE_OPTION_CAN_CCF_1949_DESC: "Le CCF remportera les élections."
 RULE_OPTION_CAN_LIBERAL_1949: "Victoire des libéraux"
 RULE_OPTION_CAN_LIBERAL_1949_DESC: "Les libéraux vont remporter les élections. \n§YC'est ainsi que s'est déroulé l'histoire.§!"
 RULE_OPTION_CAN_PROGCON_1949: "Victoire du Parti progressiste-conservateur"
 RULE_OPTION_CAN_PROGCON_1949_DESC: "Les conservateurs progressistes vont remporter les élections."
