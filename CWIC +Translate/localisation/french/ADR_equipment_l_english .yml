 ADR_fighter_equipment_3_short:0 "Ta 152"
 ADR_jet_multirole_equipment_1:0 "Mikoyan-Gurevich MiG-9"
 ADR_jet_multirole_equipment_1_desc:0 "Le MiG-9 Fargo fut le premier avion à réaction conçu par Mikoyan après la Seconde Guerre mondiale. Introduit en 1948, il fut utilisé de manière limitée au combat et à l'entraînement pendant la guerre civile chinoise et la guerre de Corée. Au total, 610 appareils furent produits, exclusivement par l'URSS. Les derniers MiG 9 furent retirés du service par la République populaire de Chine en 1951."
 ADR_jet_multirole_equipment_1_short:0 "MiG-9"
 ADR_jet_multirole_equipment_2:0 "Mikoyan-Gurevich MiG-15"
 ADR_jet_multirole_equipment_2_desc:0 "Sans doute l'un des chasseurs les plus emblématiques de la guerre froide, le Mikoyan-Gurevich MiG-15 Fagot est entré en service en 1947. Le MiG-15 a participé à de nombreux conflits depuis son introduction pendant la guerre de Corée, où il s'est révélé être un adversaire redoutable pour les F-86 Sabre et F9F Panther américains. Une partie de la frontière entre la Corée et la Chine a été surnommée « MiG Alley » en raison de leur omniprésence dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Si la plupart des appareils ont été mis hors service dans les années 1950, certains sont encore en service dans l'armée de l'air nord-coréenne."
 ADR_jet_multirole_equipment_2_short:0 "MiG-15"
 ADR_jet_multirole_equipment_3:0 "Mikoyan-Gurevich MiG-17"
 ADR_jet_multirole_equipment_3_desc:0 "Successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence dans l'armée de l'air chinoise sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, en Afrique, en Europe et en Asie. Son premier déploiement au combat a eu lieu en 1958, lorsque des MiG de la République populaire de Chine ont affronté des F-86 Sabre chinois nationalistes au-dessus du détroit de Taiwan. Cependant, le MiG-17 a principalement été utilisé pendant la guerre du Vietnam par la NVAF et la PLAAF, où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même tenu tête aux chasseurs américains Phantom II, beaucoup plus modernes et supersoniques, pendant la guerre du Vietnam. Le MiG-17 a été généralement retiré du service dans les années 1970, mais il reste encore en service de manière limitée dans certains pays africains et en Corée du Nord."
 ADR_jet_multirole_equipment_3_short:0 "MiG-17"
 ADR_jet_multirole_equipment_4:0 "Mikoyan-Gurevich MiG-19"
 ADR_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de fabrication soviétique capable d'atteindre une vitesse supersonique en vol horizontal. Son équivalent américain dans la « série Century » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les McDonnell Douglas F-4 Phantom II et Republic F-105 Thunderchief, plus modernes, au-dessus du Nord-Vietnam."
 ADR_jet_multirole_equipment_4_short:0 "MiG-19"
 ADR_jet_multirole_equipment_5:0 "Mikoyan-Gurevich MiG-21F-13"
 ADR_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, équipé de missiles à portée au-delà du champ visuel et d'un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, notamment en Chine et en Inde où il a été construit en grand nombre sous licence. Plus de 11 000 exemplaires ont été construits, servant dans plus de 60 pays sur les 5 continents. Au cours de sa durée de vie, le MiG-21 a abattu 240 avions ennemis. Le MiG-21 a été utilisé dans de nombreux conflits, notamment au Vietnam (où il a remporté un énorme succès), lors de la guerre indo-pakistanaise de 1971, lors de la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il est toujours en service après plus de six décennies."
 ADR_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 ADR_jet_multirole_equipment_6:0 "Mikoyan-Gurevich MiG-21PF"
 ADR_jet_multirole_equipment_6_desc:0 "Version de série de l'intercepteur tout temps. Ces appareils étaient équipés du turboréacteur R11F2-300 et, à partir du septième lot de production, du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T, également appelé RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 afin de permettre l'utilisation du missile air-air à guidage laser RS-2US (alias K-5MS) en plus du missile à guidage infrarouge K-13."
 ADR_jet_multirole_equipment_6_short:0 "MiG-21PF"
 ADR_jet_multirole_equipment_7:0 "Mikoyan-Gurevich MiG-23M"
 ADR_jet_multirole_equipment_7_desc:0 "Le MiG-23 a été le premier chasseur soviétique à être équipé d'un radar à balayage vers le bas et à tirer vers le bas, et l'un des premiers à être armé de missiles à portée au-delà du champ visuel. Sa production a débuté en 1969 et a atteint des chiffres importants avec plus de 5 000 appareils construits, ce qui en fait l'avion à ailes à géométrie variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service de manière limitée chez certains clients à l'exportation."
 ADR_jet_multirole_equipment_7_short:0 "MiG-23M"
 ADR_jet_multirole_equipment_8:0 "Mikoyan-Gurevich MiG-23ML"
 ADR_jet_multirole_equipment_8_desc:0 "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment en termes de résistance et de fiabilité de la cellule, de performances du moteur, de maniabilité et de performances radar. Une refonte considérable de la cellule a été effectuée, donnant naissance au MiG-23ML."
 ADR_jet_multirole_equipment_8_short:0 "MiG-23ML"
 ADR_jet_multirole_equipment_9:0 "Mikoyan-Gurevich MiG-23MLD"
 ADR_jet_multirole_equipment_9_desc:0 "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de cette mise à niveau était d'améliorer la maniabilité, en particulier lors d'angles d'attaque élevés, qui étaient considérés comme le principal défaut du MiG-23M/ML. La perche Pitot était équipée de générateurs de tourbillons, et les bords d'attaque dentelés des ailes étaient également conçus pour agir comme des générateurs de tourbillons. Le système de commande de vol intégrait le dispositif de butée synthétique SOS-3-4 et le limiteur de signaux."
 ADR_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 ADR_jet_multirole_equipment_10:0 "Mikoyan-Gurevich MiG-29A"
 ADR_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le bureau d'études Mikoyan. Il s'agit du premier chasseur de quatrième génération à avoir été mis en service par l'URSS et le bloc de l'Est. Il intègre une avionique améliorée et des capacités radar considérablement renforcées. Les premiers MiG-29 ont été utilisés comme avions d'entraînement par le Pacte de Varsovie, avec des exportations limitées vers l'Inde, mais leur utilisation au combat était restreinte. Le MiG-29 allait plus tard servir de base à des variantes largement produites, telles que le MiG-29S, le MiG-29M et le MiG-35."
 ADR_jet_multirole_equipment_10_short:0 "MiG-29A"
 ADR_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29M"
 ADR_mr_stealth_fighter_equipment_1_short:0 "MiG-29M"
 ADR_mr_stealth_fighter_equipment_1_desc:0 "L'avion MiG-29M/M2 est une version révisée du MiG-29 de base. Il offre une capacité multirôle plus robuste grâce à une utilisation améliorée des armes air-air et air-sol de haute précision. Il dispose également d'une autonomie de combat considérablement accrue, grâce à une augmentation de sa capacité interne en carburant. Quelques modifications ont été apportées au cours du développement de l'avion. La cellule redessinée a été construite à partir d'un alliage léger d'aluminium et de lithium afin d'augmenter le rapport poussée/poids. La géométrie des rampes d'admission d'air a été revue, les persiennes d'admission supérieures ont été supprimées afin de laisser place à davantage de carburant dans les LERX, des grilles ont été installées pour empêcher les dommages causés par des objets étrangers (FOD) et les dimensions des entrées ont été agrandies pour permettre un débit d'air plus important."
 ADR_jet_light_equipment_1:0 "Yakovlev Yak-18"
 ADR_jet_light_equipment_1_short:0 "Yak-18"
 ADR_jet_light_equipment_2:0 "Mikoyan-Gurevich MiG-15UTI"
 ADR_jet_light_equipment_2_short:0 "MiG-15UTI"
 ADR_jet_light_equipment_3:0 "L-29 Delfin"
 ADR_jet_light_equipment_3_short:0 "L-29 Delfin"
 ADR_jet_light_equipment_4:0 "Aero L-39 Albatros"
 ADR_jet_light_equipment_4_short:0 "L-39 Albatros"
 ADR_jet_light_equipment_5:0 "Aero L-39ZA Albatros"
 ADR_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 ADR_recon_equipment_0:0 "Tupolev Tu-2R"
 ADR_recon_equipment_0_short:0 "Tu-2R"
 ADR_recon_equipment_0_desc:0 "Version de reconnaissance du Tu-2."
 ADR_jet_recon_equipment_0:0 "Mikoyan-Gurevich MiG-15Rbis"
 ADR_jet_recon_equipment_0_short:0 "MiG-15Rbis"
 ADR_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, l'OKB MiG a commencé à développer une variante de reconnaissance de première ligne du MiG-15 équipée d'une caméra AFA-BA/40, qui offre une largeur de balayage de 0,9 à 4,5 km avec une longueur de parcours photographique de 90 à 450 km à des altitudes comprises entre 2 000 et 10 000 m. Un seul canon NR-23 était installé sur l'avion. Afin d'augmenter l'autonomie du reconnaissance, des verrous D4-50 ont ensuite été installés sur les poutres, permettant de suspendre sous l'aile des réservoirs de carburant de 600 litres de forme améliorée. De plus, un transpondeur « Barium-M » et une bouteille d'oxygène supplémentaire de 2 litres ont été installés sur l'appareil."
 ADR_jet_recon_equipment_1:0 "Mikoyan-Gurevich MiG-25RB"
 ADR_jet_recon_equipment_1_short:0 "MiG-25RB"
 ADR_jet_recon_equipment_1_desc:0 "MiG-25RB - avion de reconnaissance opérationnel monoplace toutes altitudes - bombardier. Les essais ont été achevés en décembre 1970. L'avion était équipé de 2 à 4 caméras de reconnaissance générale A-70M et d'une caméra topographique AFA-E/10. L'équipement photographique était logé dans cinq compartiments situés au bas du fuselage avant. Une station SIGINT appelée SPS-4A ou B « Virage » a également été installée, fonctionnant dans différentes gammes de fréquences. Équipement spécial - station de brouillage radio actif SPS-141."
 ADR_jet_recon_equipment_2:0 "Sukhoi Su-24MR"
 ADR_jet_recon_equipment_2_short:0 "Su-24MR"
 ADR_jet_recon_equipment_2_desc:0 "Variante dédiée à la reconnaissance tactique. Le Su-24MR conserve une grande partie de la suite de navigation du Su-24M, y compris le radar de suivi du terrain, mais supprime le radar d'attaque Orion-A, le système laser/TV et le canon au profit de deux installations de caméras panoramiques, caméra TV « Aist-M » (« Cigogne »), radar aéroporté à balayage latéral (SLAR) RDS-BO « Shtik » (« Baïonnette ») et système de reconnaissance infrarouge « Zima » (« Hiver »). D'autres capteurs sont transportés sous forme de nacelles."
 ADR_heavy_fighter_equipment_1:0 "Yakovlev Yak-9"
 ADR_heavy_fighter_equipment_1_short:0 "Yak-9"
 ADR_heavy_fighter_equipment_1_desc:0 "Le Yak-9 avait un fuselage arrière raccourci et une verrière offrant une vision panoramique. Sa structure métallique plus légère permettait d'augmenter la charge de carburant et l'armement par rapport aux modèles précédents construits en bois. Le Yak-9 était maniable à grande vitesse à basse et moyenne altitude et facile à contrôler, ce qui en a fait l'un des chasseurs soviétiques les plus produits pendant la Seconde Guerre mondiale."
 ADR_heavy_fighter_equipment_2:0 "Petlyakov Pe-3"
 ADR_heavy_fighter_equipment_2_short:0 "Pe-3"
 ADR_heavy_fighter_equipment_2_desc:0 "Évolution du Pe-2, le Pe-3 était un avion de chasse nocturne dédié lorsqu'il a été introduit en 1941, la même année que son homologue, le Pe-2. Sa conception et son utilisation ont suivi une voie comparable à celle empruntée par la Luftwaffe allemande avec le Junkers Ju 88 et la Royal Air Force britannique avec le De Havilland Mosquito. Utilisé avec distinction pendant la bataille de Moscou, et malgré l'évacuation de la seule usine chargée de sa construction à la suite de la bataille, le Pe-3 fut utilisé tout au long du conflit, les séries de production ultérieures étant consacrées à la construction de variantes de reconnaissance de ce type."
 ADR_heavy_fighter_equipment_3:0 "Lavochkin La-11"
 ADR_heavy_fighter_equipment_3_short:0 "La-11"
 ADR_heavy_fighter_equipment_3_desc:0 "Développé en 1947, après la fin de la Seconde Guerre mondiale, le La-11 était une version améliorée du La-9 « Fritz » destinée à servir d'avion d'escorte à longue portée. L'avion était équipé de pneus plus larges pour supporter son poids accru et de commodités pour les longs vols, telles que des sièges mieux rembourrés, des accoudoirs et un urinoir. De plus, un équipement complet de navigation radio a été installé. Sans surprise, les performances au combat avec un plein de carburant en ont souffert. Cependant, à mesure que la charge de carburant se rapprochait de celle du La-9, les performances s'amélioraient. Les pilotes du La-11 au service de l'Union soviétique, puis de la Chine, ont servi dans la défense aérienne, abattant des Mustang et des avions d'attaque de fabrication américaine pendant la guerre de Corée. Son nom de code OTAN est Fang."
 ADR_jet_interceptor_equipment_1:0 "Yakovlev Yak-17"
 ADR_jet_interceptor_equipment_1_desc:0 "Le Yak-17 fut présenté pour la première fois au public lors de la Journée de l'aviation soviétique de 1949, à l'aérodrome de Tushino. En service, le Yak-17 présentait la plupart des défauts de son prédécesseur, notamment une vitesse et un rayon d'action relativement faibles, ainsi qu'un moteur peu fiable (toujours basé sur le Junkers Jumo 004 allemand) avec une procédure de démarrage compliquée. En revanche, son pilotage était très simple et similaire à celui des chasseurs à hélice populaires tels que le Yak-3 et le Yak-9. Cela en faisait un excellent appareil de transition vers les chasseurs à réaction."
 ADR_jet_interceptor_equipment_1_short:0 "Yak-17"
 ADR_jet_interceptor_equipment_2:0 "Lavochkin La-15"
 ADR_jet_interceptor_equipment_2_desc:0 "Le Lavochkin La-15 Fantail a été introduit dans l'armée de l'air soviétique en 1949. Bien que cet avion fût technologiquement supérieur au MiG-15, le coût de fabrication inférieur de ce dernier lui a valu d'être préféré. L'avion n'a jamais été utilisé au combat et n'a connu qu'un déploiement limité. Les 235 appareils fabriqués ont été mis hors service en 1953. Ils ont été dépouillés de leurs moteurs et utilisés pour des essais d'armes nucléaires."
 ADR_jet_interceptor_equipment_2_short:0 "La-15"
 ADR_jet_interceptor_equipment_3:0 "Mikoyan-Gurevich MiG-17PF"
 ADR_jet_interceptor_equipment_3_desc:0 "Version intercepteur tout temps équipée d'un radar Izumrud, de 3 canons NR-23 de 23 mm et d'un moteur VK-1F."
 ADR_jet_interceptor_equipment_3_short:0 "MiG-17PF"
 ADR_CAS_equipment_1:0 "Focke-Wulf Fw 58 Weihe"
 ADR_CAS_equipment_1_short:0 "Fw 58 Weihe"
 ADR_CAS_equipment_2:0 "Junkers Ju 87 G 'Kanonenvogel'"
 ADR_CAS_equipment_2_short:0 "Ju 87 G 'Kanonenvogel'"
 ADR_CAS_equipment_3:0 "Henschel Hs 129"
 ADR_CAS_equipment_3_short:0 "Hs 129"
 ADR_jet_CAS_equipment_1:0 "Ilyushin IL-10M"
 ADR_jet_CAS_equipment_1_short:0 "IL-10M"
 ADR_jet_CAS_equipment_2:0 "Mikoyan-Guerevich MiG-17bis"
 ADR_jet_CAS_equipment_2_desc:0 "Conversion d'un chasseur-bombardier, équipé pour transporter des roquettes et des bombes non guidées."
 ADR_jet_CAS_equipment_2_short:0 "MiG-17bis"
 ADR_jet_CAS_equipment_3:0 "Mikoyan-Guerevich MiG-19S"
 ADR_jet_CAS_equipment_3_desc:0 "Version chasseur-bombardier avec queue à panneaux mobiles. Équipé d'un récepteur de navigation longue portée Svod et armé de trois canons NR-30 de 30 mm. Il pouvait embarquer un pack de roquettes non guidées ORO-32K ou une bombe FAB-250 sous chaque aile, et à partir de 1957, il a été modifié pour pouvoir transporter quatre pods de roquettes."
 ADR_jet_CAS_equipment_3_short:0 "MiG-19S"
 ADR_jet_CAS_equipment_4:0 "Sukhoi Su-7B"
 ADR_jet_CAS_equipment_4_desc:0 "La version bombardier du Su-7 Fitter-A a effectué son premier vol en mars 1959, avant d'entrer en service en 1961. Il est devenu le principal avion d'attaque au sol soviétique des années 1960. Entre 1957 et 1972, plus de 1 400 Su-7B ont été construits, dont une grande partie a été exportée. Cet avion était relativement populaire à l'étranger, où il a été utilisé par 10 pays. Il a été largement utilisé par les forces aériennes indiennes et égyptiennes. Il est toujours en service, mais de manière limitée, en Corée du Nord."
 ADR_jet_CAS_equipment_4_short:0 "Su-7B"
 ADR_jet_CAS_equipment_5:0 "Sukhoi Su-7BKL"
 ADR_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté du fuselage, réservoirs de carburant installés dans les ailes, points d'ancrage « humides » sous les ailes pour transporter des réservoirs de carburant externes, capable de transporter des bombes nucléaires tactiques."
 ADR_jet_CAS_equipment_5_short:0 "Su-7BKL"
 ADR_jet_CAS_equipment_6:0 "Sukhoi Su-20"
 ADR_jet_CAS_equipment_6_desc:0 "Le Sukhoi Su-17 Fitter-C était une version améliorée de l'avion d'attaque au sol soviétique Su-7B. Le Su-17 a été largement exporté vers les forces aériennes du bloc de l'Est, des pays arabes et d'Amérique du Sud. Le Su-17 apportait des améliorations dans presque tous les domaines par rapport à son prédécesseur, notamment au niveau des capteurs, des performances de vol, de la charge utile, de l'autonomie et du balayage variable des ailes. De 1969 à 1990, 2 867 appareils ont été produits et utilisés dans 30 pays, dont 6 utilisent encore cet avion aujourd'hui."
 ADR_jet_CAS_equipment_6_short:0 "Su-20"
 ADR_jet_CAS_equipment_7:0 "Mikoyan-Gurevich MiG-27M"
 ADR_jet_CAS_equipment_7_desc:0 "Le MiG-27 Flogger est un avion d'attaque au sol soviétique à ailes à géométrie variable. Cet avion est basé sur le MiG-23, mais optimisé pour l'attaque au sol. Contrairement au MiG-23, le MiG-27 n'a pas été largement utilisé en dehors de l'URSS. Entre 1970 et 1986, 1 075 appareils ont été produits. Le MiG-27 a été utilisé pendant les dernières phases des guerres soviéto-afghane et de Kargil. L'avion reste en service de manière limitée en Inde et au Kazakhstan."
 ADR_jet_CAS_equipment_7_short:0 "MiG-27M"
 ADR_jet_CAS_equipment_8:0 "Sukhoi Su-25K"
 ADR_jet_CAS_equipment_8_desc:0 "Le Sukhoi Su-25 Frogfoot est un avion d'attaque au sol bimoteur développé en Union soviétique. Il a effectué son premier vol en 1975 et a été mis en service en 1981. Depuis 1978, plus de 1 000 exemplaires ont été produits. Cet avion a connu un grand succès à l'étranger, où il a été vendu à 29 pays. Le Su-25 a ainsi participé à plusieurs conflits, notamment la guerre soviétique en Afghanistan, la guerre Iran-Irak et la guerre du Golfe. Il est toujours en service dans tous les pays importateurs."
 ADR_jet_CAS_equipment_8_short:0 "Su-25K"
 ADR_cas_stealth_equipment_1:0 "Sukhoi Su-25SM"
 ADR_cas_stealth_equipment_1_short:0 "Su-25SM"
 ADR_cas_stealth_equipment_1_desc:0 "Le Su-25SM (Stroyevoy Modernizirovannyi) est un programme de mise à niveau \"abordable\" du Su-25, conçu par l'Armée de l'air russe en 2000. Le programme découle des tentatives de mise à niveau des Su-25T et Su-25TM, qui ont été évaluées et qualifiées de trop sophistiquées et coûteuses. La mise à niveau SM intègre des améliorations avioniques et une remise à neuf de la cellule pour prolonger la durée de vie du Frogfoot jusqu'à 500 heures de vol ou de 5 ans. La toute nouvelle suite de navigation/attaque PRnK-25SM \"Bars\" du Su-25SM est construite autour du système informatique numérique BTsVM-90, initialement prévu pour le programme de mise à niveau du Su-25TM. La précision de navigation et d'attaque fournie par la nouvelle suite est trois fois supérieure à celle de la ligne de base Su-25 et se situerait à moins de 15 m en utilisant la correction satellite et à 200 m sans elle."
 ADR_jet_tac_bomber_equipment_1:0 "Ilyushin Il-22"
 ADR_jet_tac_bomber_equipment_1_short:0 "Il-22"
 ADR_jet_tac_bomber_equipment_1_desc:0 "L'Ilyushin Il-22 fut le premier bombardier soviétique à réaction à voler. Il était équipé de quatre turboréacteurs Lyulka TR-1 montés sur des pylônes horizontaux courts situés à l'avant et sous l'aile. Les moteurs n'atteignaient pas la poussée prévue et leur consommation de carburant était plus élevée que prévu. Ces problèmes empêchèrent l'avion d'atteindre les performances requises et il fut abandonné le 22 septembre 1947."
 ADR_jet_tac_bomber_equipment_2:0 "Ilyushin Il-28"
 ADR_jet_tac_bomber_equipment_2_short:0 "Il-28"
 ADR_jet_tac_bomber_equipment_2_desc:0 "L'Ilyushin Il-22 fut le premier bombardier soviétique à réaction à voler. Il était équipé de quatre turboréacteurs Lyulka TR-1 montés sur des pylônes horizontaux courts situés à l'avant et sous l'aile. Les moteurs n'atteignaient pas la poussée prévue et leur consommation de carburant était plus élevée que prévu. Ces problèmes empêchèrent l'avion d'atteindre les performances requises et il fut abandonné le 22 septembre 1947."
 ADR_jet_tac_bomber_equipment_3:0 "Yakovlev Yak-28B"
 ADR_jet_tac_bomber_equipment_3_short:0 "Yak-28B"
 ADR_jet_tac_bomber_equipment_3_desc:0 "Le Yak-28 a été développé comme avion de combat à ailes en flèche et introduit en 1960. Les variantes bombardiers du Yak-28, connues sous leur nom de code OTAN Brewer, étaient équipées de moteurs montés en nacelle, similaires à ceux du Yak-25 Flashlight dont il était dérivé. Grâce à cela et à ses ailes en flèche, c'était un avion subsonique capable d'atteindre des vitesses transsoniques à haute altitude. Il a servi de bombardier léger principal de l'armée de l'air soviétique et a été largement utilisé par la Russie, la Biélorussie et le Turkménistan après la chute de l'Union soviétique, avant d'être retiré du service en 1992."
 ADR_jet_tac_bomber_equipment_4:0 "Yakovlev Yak-28I"
 ADR_jet_tac_bomber_equipment_4_short:0 "Yak-28I"
 ADR_jet_tac_bomber_equipment_4_desc:0 "Version améliorée avec le système de ciblage interne « Initsiativa-2 », un radar de cartographie du sol à 360 degrés, associé à un système de ciblage contrôlé au sol utilisant la triangulation à partir de sites émetteurs terrestres."
 ADR_jet_tac_bomber_equipment_5:0 "Mikoyan-Guerevich MiG-25RBT"
 ADR_jet_tac_bomber_equipment_5_short:0 "MiG-25RBS"
 ADR_jet_tac_bomber_equipment_5_desc:0 "Le MiG-25RBS est un bombardier-reconnaissance monoplace dérivé du MiG-25R, équipé de systèmes de reconnaissance améliorés et d'un système de bombardement automatique Peleng. L'avion peut transporter une charge de huit bombes de 500 kg (1 102 lb)."
 ADR_jet_tac_bomber_equipment_6:0 "Sukhoi Su-24"
 ADR_jet_tac_bomber_equipment_6_short:0 "Su-24"
 ADR_jet_tac_bomber_equipment_6_desc:0 "Un gros chasseur-bombardier développé par l'Union soviétique dans les années 1960 et toujours en service aujourd'hui. Il se caractérise par ses ailes variables et son fuselage effilé. Il peut embarquer jusqu'à 8 000 kg d'armes et est capable de lancer différents types de missiles air-sol tout en maintenant une vitesse stable. Cet avion est connu sous son nom de code OTAN, « Fencer ». Avec son successeur, le Su-34, il est actuellement utilisé comme chasseur-bombardier par les anciens pays du bloc de l'Est."
 ADR_jet_tac_bomber_equipment_7:0 "Sukhoi Su-24"
 ADR_jet_tac_bomber_equipment_7_short:0 "Su-24M"
 ADR_jet_tac_bomber_equipment_7_desc:0 "Entré en service en 1983, le Su-24M était une évolution du Su-24 depuis la mise en service du modèle initial. L'une des principales caractéristiques du Su-24M est l'ajout d'une capacité de ravitaillement en vol grâce à une sonde rétractable, d'un nouveau système de navigation interne et d'un désignateur laser Kaira-24, qui permet à l'appareil d'utiliser des bombes à guidage de précision. Il est connu en Occident sous le nom de Fencer-D."
