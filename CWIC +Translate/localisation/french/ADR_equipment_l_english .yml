l_english:
 ADR_infantry_equipment_0:0 "Karabiner 98 kurz"
 ADR_infantry_equipment_0_short:0 "Karabiner 98k"
 ADR_infantry_equipment_0_desc:0 "Un fusil à verrou emblématique adopté par la Wehrmacht en 1935 comme fusil de service standard. C'était l'un des derniers développements de la longue lignée de fusils militaires Mauser. Bien que complété par des fusils semi-automatiques et automatiques pendant la Seconde Guerre mondiale, il est resté le principal fusil de service allemand jusqu'à la fin de la guerre en 1945. Malgré le nombre croissant de fusils semi-automatiques et automatiques, le Kar98k continue d'être utilisé des deux côtés du rideau de fer."
 ADR_infantry_equipment_1:0 "Avtomat Kalashnikova 1947"
 ADR_infantry_equipment_1_short:0 "AK-47"
 ADR_infantry_equipment_1_desc:0 "L'AK-47 est un fusil d'assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947, mais il n'entra en service actif qu'en 1948, date à laquelle la version à crosse fixe fut mise en production. Début 1949, l'AK-47 fut adopté par les forces armées soviétiques pour un déploiement massif au sein des unités de première ligne. Doté d'un piston à gaz à longue course, d'un sélecteur de tir avec sécurité, d'un mécanisme de détente et d'alimentation automatique, ainsi que d'autres améliorations de conception, l'AK-47 représentait une nette amélioration par rapport au SKS. Pendant de nombreuses années, l'AK-47 fut considéré comme l'une des armes les plus fiables, faciles à entretenir, à manier et à apprendre au monde."
 ADR_infantry_equipment_2:0 "Avtomat Kalashnikova Modernizirovanniy"
 ADR_infantry_equipment_2_short:0 "AKM"
 ADR_infantry_equipment_2_desc:0 "L'AKM est une version modernisée de l'AK-47, développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l'Armée soviétique en 1959. L'arme a été largement optimisée et repensée pour répondre aux besoins de l'armée en pleine modernisation. De nombreuses pièces ont été simplifiées pour la production de masse et le boîtier en acier usiné a été remplacé par une pièce en acier emboutie en forme de U afin d'améliorer les cadences de production. Grâce à ces simplifications, l'arme était également beaucoup plus légère, son poids étant réduit d'environ 30 %. De plus, elle a été renforcée pour une meilleure robustesse et des rails de guidage ont été ajoutés pour faciliter le mouvement du porte-culasse. L'AKM a été immédiatement et largement utilisée par de nombreux pays communistes et produite pour les conflits tout au long de sa durée de vie. On peut notamment citer l'invasion de la Tchécoslovaquie, où elle a été utilisée par les deux camps."
 ADR_infantry_equipment_3:0 "Maschinenpistole Avtomat Kalashnikova-74N"
 ADR_infantry_equipment_3_short:0 "MPi-AK-74N"
 ADR_infantry_equipment_3_desc:0 "En 1981, la RDA a acquis une licence pour fabriquer l'AK-74, après quoi plusieurs modifications ont été apportées à l'arme. Le nouvel échantillon a été indexé MPi AK-74N. Les changements ont consisté en la fabrication d'une nouvelle crosse et d'une têtière, en plastique gris-bleu (moins souvent brun foncé). La crosse avait une structure pointillée caractéristique. La variante avec crosse pliante a reçu la variante MPi AKS-74N. Le fusil d'assaut MPI AK-74NK a également été développé, avec un canon raccourci."
 ADR_infantry_equipment_4:0 "Maschinenpistole KM-90"
 ADR_infantry_equipment_4_short:0 "MPi-90"
 ADR_infantry_equipment_4_desc:0 "La création du Wieger MPi-90 est la tentative de l'Allemagne de l'Est de développer son propre système d'armes légères, indépendant de l'Union soviétique, mais basé sur l'AK-74 chambré pour le 56 x 45mm OTAN."
 ADR_lt_equipment_1:0 "Steyr ADGZ"
 ADR_lt_equipment_1_short:0 "ADGZ"
 ADR_lt_equipment_2:0 "T-70"
 ADR_lt_equipment_2_short:0 "T-70"
 ADR_lt_equipment_2_desc:0 "Le char léger T-70 était un char de reconnaissance de la Seconde Guerre mondiale fabriqué pour remplacer le PT60. Nicholas Astrov a commencé à travailler immédiatement après le PT60 et aterminé en 1942. Au cours des 2 années de fabrication, 8 300 ont été produits. Le char avait un canon bien plus gros de 45 mm et était équipé de 2 moteurs GAZ-202 et pouvait atteindre jusqu'à 45 km/h. Le T-70 avait également une capacité optique nominalement améliorée, Il a été largement utilisé pendant la Seconde Guerre mondiale. "
 ADR_lt_equipment_3:0 "PT-76"
 ADR_lt_equipment_3_short:0 "PT-76"
 ADR_lt_equipment_3_desc:0 "Le PT-76 est un char léger amphibie soviétique qui a été largement exporté à travers le monde. Il a été conçu par Nikolai Shashmyrin et Zh. Kotin en 1951, et environ 12 000 exemplaires ont été produits. Il nécessite un équipage de trois hommes et est équipé d’un moteur V6 six cylindres en ligne, lui permettant d’atteindre une vitesse de 44 km/h sur terre et de nager à 10 km/h. Il a été exporté vers divers pays de la sphère soviétique ou proches de l’Union soviétique et a ainsi rempli un rôle de reconnaissance dans pratiquement tous les conflits impliquant des nations de cette sphère. Toutefois, il est encore utilisé aujourd’hui par de nombreux pays en raison de sa fiabilité réputée et de sa facilité d’entretien."
 ADR_lt_equipment_4:0 "PT-76B Modèle 4"
 ADR_lt_equipment_4_short:0 "PT-76B"
 ADR_lt_equipment_4_desc:0 "Le PT-76B est armé du canon de char rayé D-56TS de 76,2 mm (doté d’un frein de bouche à double déflecteur, d’un éjecteur de douille, d’un extracteur de fumées et du système de stabilisation à deux axes STP-2P « Zarya »). Il est également équipé du système de protection NBC PAZ (protivo-atomnaya zashchita), d’un système automatique d’extinction d’incendie, d’une lunette de visée TShK-2-66 améliorée, d’un système de filtration-ventilation, de dispositifs d’observation améliorés ainsi que d’un équipement électrique modernisé. Le char reçoit aussi un nouveau moteur diesel V-6B, 6 cylindres en ligne, 4 temps, refroidi par eau, développant 263 ch (196 kW) à 1 800 tr/min, ainsi que des réservoirs de carburant internes supplémentaires, ce qui a nécessité une légère modification de la forme du blindage."
 ADR_lt_equipment_5:0 "BRM-1K"
 ADR_lt_equipment_5_short:0 "BRM-1K"
 ADR_lt_equipment_5_desc:0 "Le BRM-1K est un véhicule d'origine soviétique de reconnaissance datant de la fin de la Guerre froide. Il a été développé pour soutenir les formations blindées et mécanisées employées par les forces soviétiques. Le BRM-1K devait repérer les routes et détecter les formations ennemies."
 ADR_lt_equipment_6:0 "BRM-3K"
 ADR_lt_equipment_6_short:0 "BRM-3K"
 ADR_lt_equipment_6_desc:0 "Le BRM-3K Rys a été développé au début des années 1990. Il était destiné à compléter et à remplacer le véhicule de reconnaissance BRM-1K. Il est basé sur le châssis du véhicule de combat d'infanterie BMP-3. Bien que le BRM-3K ait été officiellement accepté au service de l'armée russe en 1995, il est toujours produit en petite série."
 ADR_mbt_equipment_0:0 "Panzerkampfwagen IV"
 ADR_mbt_equipment_0_short:0 "Panzer IV"
 ADR_mbt_equipment_1:0 "T-34-85M"
 ADR_mbt_equipment_1_short:0 "T-34-85M"
 ADR_mbt_equipment_2:0 "T-54"
 ADR_mbt_equipment_2_short:0 "T-54"
 ADR_mbt_equipment_2_desc:0 "Le T-54 est le char de combat le plus produit de l’histoire. Conçu en 1946 par le KMBD, il est équipé d’un canon rayé de 100mm et d’un blindage variant de 205mm à 60mm. Son moteur diesel V-12 de 38,88 litres, associé à une suspension à barres de torsion, lui permet d’atteindre une vitesse de 48 km/h. Utilisé par plus de 50 armées dans le monde, il a été fabriqué dans l’ensemble du bloc soviétique et a participé à tous ses conflits."
 ADR_mbt_equipment_3:0 "T-55"
 ADR_mbt_equipment_3_short:0 "T-55"
 ADR_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. Le bureau d'études OKB-520 a modifié la conception du T-55 en améliorant sa protection NBC, en optimisant son moteur, en redessinant la tourelle et en ajoutant des équipements auxiliaires tels qu'un système de conduite de tir et des optiques améliorés. De plus, le T-55 utilisait plus fréquemment la mitrailleuse lourde DShK de 12,7 mm, tandis que le T-54 était équipé du canon SGMT de 7,62 mm, ce qui lui conférait une puissance de feu supérieure, mais limitait sa capacité d'emport de munitions. Le T-55 a été utilisé dans autant d'armées que le T-54 et a généralement participé aux mêmes conflits."
 ADR_mbt_equipment_4:0 "T-62"
 ADR_mbt_equipment_4_short:0 "T-62"
 ADR_mbt_equipment_4_desc:0 "Le T-62 est une évolution du char T-55. Il est équipé d'un canon à âme lisse et possède un blindage légèrement plus épais. Le calibre du canon principal a également été porté à 115 mm. Commandé initialement par l'Union soviétique dans le but d'améliorer sa puissance de feu, le projet fut achevé par le bureau d'études OKB-520 vers 1960. Malgré ses améliorations, sa production ne fut pas arrêtée, son coût étant nominalement supérieur à celui du T-55. Plus de 22 700 T-62 furent construits et il participa à de nombreux combats dans la sphère d'influence soviétique, notamment au Moyen-Orient. Ses améliorations démontrèrent une capacité légèrement supérieure en 1969 lors du conflit frontalier sino-soviétique."
 ADR_mbt_equipment_5:0 "T-62M"
 ADR_mbt_equipment_5_short:0 "T-62M"
 ADR_mbt_equipment_6:0 "T-72"
 ADR_mbt_equipment_6_short:0 "T-72"
 ADR_mbt_equipment_6_desc:0 "Le T-72 est un char de combat principal soviétique conçu comme une nouvelle génération de blindés, destiné à remplacer le T-62 et son équivalent plus coûteux, le T-64. Conçu par Leonid Venediktov et finalisé en 1973, il offrait d'importantes améliorations tout en coûtant presque deux fois moins cher que le T-64. Il conserve un canon de 125mm et un blindage composite, mais dans un design optimisé pour une production plus économique. Son moteur V-12 de 780 chevaux pouvait être modernisé jusqu'à 1 130 chevaux, lui permettant d'atteindre une mobilité exceptionnelle avec des vitesses allant jusqu'à 80 km/h et une meilleure adaptation aux terrains difficiles par rapport au T-64. Contrairement à ce dernier, le T-72 a été largement utilisé dans l’ensemble du bloc soviétique et s’est illustré dans de nombreux conflits en Afrique, au Moyen-Orient et en Indochine."
