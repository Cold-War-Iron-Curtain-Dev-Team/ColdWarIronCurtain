l_english:
 ukraine_1:0 "Ukraine is not yet lost!"
 ukraine_1_desc:0 "\n\n\n£ukraine\n\n\n\n\n\nThe Ukrainian parliament has decisively passed a declaration that firmly establishes Ukraine's autonomy within the Union of Soviet Socialist Republics. This significant move follows a wave of sovereignty declarations from various republics across the Soviet Union, clearly demonstrating the growing momentum of nationalism that is reshaping the central authority of the Union.\n\nThe declaration, along with subsequent votes, establishes an independent Ukrainian army and a central bank tasked with introducing a new currency. It unequivocally grants Ukrainian citizenship, recognizing Ukrainians as citizens of both Ukraine and the Soviet Union. This declaration demands economic independence and upholds the principles of self-determination and governance by the people. Furthermore, it proclaims a commitment to military neutrality and unequivocally rejects the production of nuclear weapons, signaling a bold step forward for Ukraine's future."
 ukraine_2:0 "The Fruit of our Independence"
 ukraine_2_desc:0 "Even with our youthful government and a faltering economy, our people couldn't be more hopeful. The promise of independence and a new future has united us, even as we face shortcomings and hardships. Many believe that the government will lead us through these challenges, despite their inexperience.\n\nIn spite of the challenges that lay ahead, the people of our nation are united and ready for what is to come. The hope for change drives our people forward, allowing them to endure their hope despite the current hardships. The desire for change and progress keeps our people alive, even in these tough times."
 ukraine_3:0 "Economic Uncertainty"
 ukraine_3_desc:0 "The transition from Soviet socialism to a market economy is plagued with tremendous challenges. The government funding that supported factories and infrastructure during Soviet rule disappeared, causing numerous industries to strive to adapt to the new environment. The economy is fragile, with inflation and shortages making daily life unbearable for most of our citizens.\n\nProduction has slowed, and any construction projects are frequently delayed if not stopped altogether. The shift to a market economy has brought confusion and instability, casting uncertainty over our country’s future. Without adequate resources or institutions to rely upon in these times, we are forced to navigate this difficult time by ourselves."
 Ukraine.1.d:0 "The Ukrainian Soviet Socialist Republic took a decisive step toward self-determination, declaring its state sovereignty in a bold move that signaled the unraveling of Soviet dominance. While still nominally a part of the USSR, Ukraine’s declaration was more than just a political gesture—it was a statement of intent, a sign that the tides of history were shifting.\n\nThe document asserted Ukraine’s primacy of national laws over Soviet legislation, a direct challenge to Moscow’s control. It proclaimed economic independence, the right to its own military, and full control over its natural resources—positioning Ukraine not as a mere Soviet republic but as a nation preparing for its destiny. For the first time in decades, the idea of an independent Ukraine was no longer just the dream of dissidents—it was becoming a reality written into law.\n\nYet, sovereignty did not come without its struggles. In the Kremlin, this declaration was seen as a dangerous precedent, a fracture in the foundation of the Soviet Union."
 Ukraine.2.d:0 "For too long, Ukraine had been bound to the will of empires, its identity overshadowed, its sovereignty a distant dream. But when the moment finally came, the nation did not hesitate. With a single declaration, Ukraine asserted its right to govern itself, placing its own laws above those of Moscow and laying the foundation for true independence.\n\nThe decision sent shockwaves through the Soviet hierarchy. In the Kremlin, officials saw it as a dangerous precedent, a signal that the once-unbreakable union was fracturing. Warnings of economic collapse and political instability followed, but in Kyiv, the path forward was already clear. Across the country, the spirit of independence burned stronger than ever, igniting a movement that could not be stopped.\n\nFor the Ukrainian people, this was more than a political maneuver—it was a reclaiming of history, culture, and destiny. The language that had been suppressed, the traditions that had been sidelined, the dreams of generations were now given new life. The world watched as Ukraine, long considered a subordinate republic, stood up and declared that its future would be decided by no one but itself.\n\nThough. Challenges lay ahead, the course had been set. What began as a bold statement of sovereignty would soon become an undeniable reality. The Soviet era was crumbling, and from its ruins, Ukraine was ready to rise."