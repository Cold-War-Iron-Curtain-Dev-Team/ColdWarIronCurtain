 ARG_cv_CAS_equipment_1:0 "Grumman J2F Duck"
 ARG_cv_CAS_equipment_1_short:0 "J2F Duck"
 ARG_cv_CAS_equipment_1_desc:0 "Le Grumman J2F Duck (désignation constructeur G-15) est un biplan amphibie monomoteur américain. Il fut utilisé par toutes les branches principales des forces armées américaines du milieu des années 1930 jusqu'à l'après-Seconde Guerre mondiale, principalement pour des missions utilitaires et de sauvetage en mer. Il fut également utilisé par la marine argentine, qui reçut son premier exemplaire en 1937. Après la guerre, des J2F Duck furent mis en service par des opérateurs civils indépendants, ainsi que par les forces armées colombiennes et mexicaines."
 ARG_cv_jet_CAS_equipment_4:0 "Douglas A-4B Skyhawk"
 ARG_cv_jet_CAS_equipment_4_short:0 "A-4B Skyhawk"
 ARG_cv_jet_CAS_equipment_4_desc:0 "L'A-4B est un avion d'attaque léger monomoteur capable d'emporter la même charge de bombes qu'un B-17 malgré sa taille plus réduite. En service dans de nombreuses forces aériennes et aéronavales depuis sa mise en service en 1954, il a subi de nombreuses modifications et modernisations au cours de ses plus de 60 ans de service et continue d'être utilisé par de nombreux pays à ce jour. Son surnom est « Skyhawk »."
 ARG_cv_jet_CAS_equipment_5:0 "Douglas A-4E Skyhawk"
 ARG_cv_jet_CAS_equipment_5_short:0 "A-4E Skyhawk"
