 ARG_jet_multirole_equipment_10_short:0 "Finger IIIB"
 ARG_CAS_equipment_1:0 "Northrop A-17"
 ARG_CAS_equipment_1_short:0 "A-17"
 ARG_CAS_equipment_2:0 "Douglas DB-8A-2"
 ARG_CAS_equipment_2_short:0 "DB-8A-2"
 ARG_CAS_equipment_4:0 "FMA IAe 28 Super Calquin"
 ARG_CAS_equipment_4_short:0 "IAe 28 Super Calquin"
 ARG_jet_CAS_equipment_1:0 "FMA IAe 30 Pallavicino II"
 ARG_jet_CAS_equipment_1_short:0 "IAe 30 Pallavicino II"
 ARG_jet_CAS_equipment_6:0 "Dassault Mirage 5P"
 ARG_jet_CAS_equipment_6_short:0 "Mirage 5P"
 ARG_jet_CAS_equipment_6_desc:0 "Le Dassault Mirage 5 est un avion d'attaque supersonique conçu en France par Dassault Aviation et fabriqué en France ainsi que dans plusieurs autres pays sous licence. Il est dérivé du célèbre chasseur Mirage III de Dassault."
 ARG_jet_CAS_equipment_7:0 "Douglas A-4P Skyhawk"
 ARG_jet_CAS_equipment_7_short:0 "A-4P Skyhawk"
 ARG_jet_CAS_equipment_7_desc:0 "Version terrestre destinée à l'armée de l'air argentine, utilisée pour des missions de frappe."
 ARG_jet_CAS_equipment_8:0 "Lockheed Martin A-4AR Fightinghawk"
 ARG_jet_CAS_equipment_8_short:0 "A-4AR Fightinghawk"
 ARG_jet_CAS_equipment_8_desc:0 "Le Lockheed Martin A-4AR Fightinghawk est une version modernisée du McDonnell Douglas A-4M Skyhawk, avion d'attaque développé pour l'armée de l'air argentine et entré en service en 1998. Le programme a été baptisé Fightinghawk en hommage au F-16 Fighting Falcon, dont il a repris la nouvelle avionique."
 ARG_jet_light_equipment_1:0 "IAe 22 DL\""
 ARG_jet_light_equipment_1_short:0 "IAe 22 DL"
 ARG_jet_light_equipment_1_desc:0 "L'I.Ae. 22 DL était un avion d'entraînement avancé argentin conçu par l'Instituto Aerotecnico (Institut aérotechnique) en 1943, avec une structure en bois, qui ressemblait au North American NA-16."
 ARG_jet_light_equipment_2:0 "Morane-Saulnier MS.760 Paris"
 ARG_jet_light_equipment_2_short:0 "MS.760 Paris"
 ARG_jet_light_equipment_2_desc:0 "Le Paris était dérivé d'un projet d'avion d'entraînement antérieur, le MS.755 Fleuret. Suite au refus de l'Armée de l'Air française de retenir le Fleuret, Morane-Saulnier décida de développer le projet en un avion de liaison et un jet d'affaires compact. La principale différence entre les deux versions résidait dans la configuration des sièges : le cockpit biplace d'origine, avec ses deux sièges côte à côte, fut modifié pour permettre l'ajout d'une rangée supplémentaire de deux sièges passagers. Le Paris conservait les caractéristiques de vol du Fleuret, ainsi que la possibilité d'y installer un armement, ce qui lui permettait d'être utilisé aussi bien comme avion d'entraînement militaire que pour l'aviation civile. Le 29 juillet 1954, le prototype effectua son vol inaugural."
 ARG_jet_light_equipment_3:0 "Aermacchi MB-326G"
 ARG_jet_light_equipment_3_short:0 "MB-326G"
 ARG_jet_light_equipment_3_desc:0 "En 1982, lors de l'invasion des îles Malouines par l'Argentine, la 1re Escadrille d'attaque de la marine argentine était équipée de plusieurs MB-326, ainsi que de MB-339, plus modernes. Immédiatement après le débarquement, plusieurs MB-326 furent déployés sur des bases le long des côtes argentines, avant de rejoindre rapidement la base de l'escadron à Punta Indio."
 ARG_jet_light_equipment_4:0 "FMA IA 58 Pucará"
 ARG_jet_light_equipment_4_short:0 "IA 58 Pucará"
 ARG_jet_light_equipment_4_desc:0 "Le FMA IA 58 Pucará est un avion d'attaque au sol et de contre-insurrection argentin, fabriqué par la Fábrica Militar de Aviones. C'est un monoplan bimoteur à turbopropulseurs, monobloc métallique, à aile basse et train d'atterrissage rétractable, capable d'opérer depuis des pistes non préparées en cas de besoin. Il a été engagé lors de la guerre des Malouines et de la guerre civile sri-lankaise."
 ARG_jet_light_equipment_5:0 "FMA IA-63 Pampa"
 ARG_jet_light_equipment_5_short:0 "IA-63 Pampa"
 ARG_jet_light_equipment_5_desc:0 "L'IA-63 Pampa est un avion d'entraînement à réaction avancé doté de capacités de combat, produit en Argentine par Fabrica Militar de Aviones (FMA) avec l'assistance de Dornier d'Allemagne."
 ARG_recon_equipment_0:0 "FMA AeMOe.2"
 ARG_recon_equipment_0_short:0 "AeMOe.2"
 ARG_recon_equipment_0_desc:0 "Six AeMOe.1 ont suivi, pour la formation des équipages dans le rôle d'observation, qui étaient généralement de conception similaire mais dotés d'un capot NACA pour le moteur, puis la version définitive AeMOe.2 est apparue en 1937 avec un empennage encore plus raffiné, dont 61 exemplaires ont été construits."
