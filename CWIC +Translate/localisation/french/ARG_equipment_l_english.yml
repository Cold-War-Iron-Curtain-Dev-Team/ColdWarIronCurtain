l_english:
 ARG_infantry_equipment_0:0 "Fusil américain, calibre .30, M1"
 ARG_infantry_equipment_0_short:0 "M1 Garand"
 ARG_infantry_equipment_0_desc:0 "Le M1 Garand est une arme emblématique conçue par John C. Garand en 1928 pour les États-Unis. Ce fusil semi-automatique de calibre .30 a été largement utilisé pendant la Seconde Guerre mondiale. Il figure parmi les premières armes à utiliser un système de rechargement par emprunt de gaz permettant de chambrer une nouvelle cartouche après chaque tir. Il fonctionne avec des chargeurs à chargement par le haut et peut être équipé d'accessoires, notamment la grenade antichar M31 HEAT. Arme polyvalente, il offre une portée et une précision exceptionnelles. Devenu un symbole, il est encore utilisé par les équipes de démonstration de tir américaines."
 ARG_infantry_equipment_1:0 "Fabrique Nationale Fusil Automatique Léger"
 ARG_infantry_equipment_1_short:0 "FN FAL"
 ARG_infantry_equipment_1_desc:0 "Le FN FAL est l'une des armes les plus produites de l'histoire. Du fait de sa prévalence et de son utilisation généralisée au sein des forces armées de nombreux pays de l'OTAN et du premier monde pendant la guerre froide, il a reçu le surnom de « bras droit du monde libre »."
 ARG_infantry_equipment_2:0 "Fusil automatique léger de fabrication militaire"
 ARG_infantry_equipment_2_short:0 "FM FAL"
 ARG_infantry_equipment_2_desc:0 "Les FAL argentins ont été produits par l'arsenal FM (Fabricaciones Militares), propriété du gouvernement, à la Fábrica Militar de Armas Portátiles \"Domingo Matheu\" (FMAP \"DM\") à Rosario. L'acronyme « FAL » a été conservé, sa traduction étant « Fusil Automático Liviano », (Fusil Automatique Léger)."
 ARG_infantry_equipment_3:0 "Fabricaciones Militares Fusil Automático Liviano Para"
 ARG_infantry_equipment_3_short:0 "FM FAL Para"
 ARG_infantry_equipment_3_desc:0 "Les FAL argentins ont été produits par l'arsenal FM (Fabricaciones Militares), propriété du gouvernement, à la Fábrica Militar de Armas Portátiles \"Domingo Matheu\" (FMAP \"DM\") à Rosario. L'acronyme « FAL » a été conservé, sa traduction étant « Fusil Automático Liviano », (Fusil Automatique Léger)."
 ARG_infantry_equipment_4:0 "FMAP-DM Fusil Argentino Modelo Asalto M5"
 ARG_infantry_equipment_4_short:0 "FMAP-DM FAMA"
 ARG_infantry_equipment_4_desc:0 "Le Fusil Argentino Modelo Asalto (fusil d'assaut argentin) est la version fusil d'assaut utilisant des munitions de 7,62 mm. Il possède une cadence de tir de 700 coups par minute et une longueur totale de 591 mm. Il peut être équipé de viseurs holographiques, d'une lampe tactique laser, d'une poignée tactique ou d'un lance-grenades de 40 mm."
