 ARG_jet_multirole_equipment_1:0 "FMA IAe 27 Pulqui"
 ARG_jet_multirole_equipment_1_short:0 "IAe 27 Pulqui"
 ARG_jet_multirole_equipment_1_desc:0 "L'IAe 27 Pulqui I était un avion à réaction argentin conçu à l'« Instituto Aerotecnico » (Institut aérotechnique) en 1946. Un seul prototype a été achevé ; des performances insatisfaisantes ont conduit à son remplacement par un modèle ultérieur."
 ARG_jet_multirole_equipment_2:0 "FMA IAe 33 Pulqui II"
 ARG_jet_multirole_equipment_2_short:0 "IAe 33 Pulqui II"
 ARG_jet_multirole_equipment_2_desc:0 "Le FMA IAe 33 Pulqui II était un avion de chasse à réaction conçu par Kurt Tank à la fin des années 1940 en Argentine, sous le gouvernement de Perón, et construit par la Fábrica Militar de Aviones (FMA). Reprenant de nombreux éléments du Focke-Wulf Ta 183, un projet d'avion de chasse resté à l'état de projet pendant la guerre, le FMA envisageait l'IAe 33 Pulqui II comme successeur du Gloster Meteor F4 d'après-guerre, en service au sein de la Fuerza Aérea Argentina."
 ARG_jet_multirole_equipment_3:0 "North American F-86F Sabre"
 ARG_jet_multirole_equipment_3_short:0 "F-86F Sabre"
 ARG_jet_multirole_equipment_3_desc:0 "Système de commandes de vol amélioré et « empennage entièrement mobile » (Ce système a été remplacé par une commande entièrement motorisée avec une « sensation artificielle » intégrée aux commandes de l'avion pour donner au pilote des forces sur le manche toujours conventionnelles, mais suffisamment légères pour un contrôle de combat supérieur). Les Sabre F bénéficiaient d'une agilité à haute vitesse nettement améliorée, associée à une vitesse d'atterrissage plus élevée de plus de 145 mph (233 km/h)."
 ARG_jet_multirole_equipment_4:0 "North American F-86F-30-NA Sabre"
 ARG_jet_multirole_equipment_4_short:0 "F-86F-30-NA Sabre"
 ARG_jet_multirole_equipment_4_desc:0 "Améliorations supplémentaires apportées au F-86F Sabre pour le rendre plus efficace au combat contre les avions plus récents équipés de postcombustion, en l'armant de points d'emport et de rails pour le lancement de missiles AIM-9B Sidewinder."
