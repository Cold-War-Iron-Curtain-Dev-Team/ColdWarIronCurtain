 ARG_cv_fighter_equipment_2:0 "Vought F4U-5 Corsair"
 ARG_cv_fighter_equipment_2_short:0 "F4U-5 Corsair"
 ARG_cv_fighter_equipment_2_desc:0 "Le Vought F4U Corsair est un avion de chasse américain qui a principalement servi pendant la Seconde Guerre mondiale et la guerre de Corée. Conçu et initialement fabriqué par Chance Vought, le Corsair connut rapidement un grand succès ; des contrats de production supplémentaires furent attribués à Goodyear, dont les Corsairs furent désignés FG, et à Brewster, désignés F3A. Conçu et utilisé comme avion embarqué, le Corsair entra en service en grand nombre au sein de l'US Navy fin 1944 et début 1945. Il devint rapidement l'un des chasseurs-bombardiers embarqués les plus performants de la Seconde Guerre mondiale."
 ARG_cv_fighter_equipment_3:0 "Vought F4U-5N Corsair"
 ARG_cv_fighter_equipment_3_short:0 "F4U-5N Corsair"
 ARG_cv_fighter_equipment_3_desc:0 "Le Vought F4U Corsair est un avion de chasse américain qui a principalement servi pendant la Seconde Guerre mondiale et la guerre de Corée. Conçu et initialement fabriqué par Chance Vought, le Corsair connut rapidement un grand succès ; des contrats de production supplémentaires furent attribués à Goodyear, dont les Corsairs furent désignés FG, et à Brewster, désignés F3A. Conçu et utilisé comme avion embarqué, le Corsair entra en service en grand nombre au sein de l'US Navy fin 1944 et début 1945. Il devint rapidement l'un des chasseurs-bombardiers embarqués les plus performants de la Seconde Guerre mondiale."
 ARG_cv_jet_multirole_equipment_1:0 "Vought F4U-5NL Corsair"
 ARG_cv_jet_multirole_equipment_1_short:0 "F4U-5NL Corsair"
 ARG_cv_jet_multirole_equipment_1_desc:0 "Le Vought F4U Corsair est un avion de chasse américain qui a principalement servi pendant la Seconde Guerre mondiale et la guerre de Corée. Conçu et initialement fabriqué par Chance Vought, le Corsair connut rapidement un grand succès ; des contrats de production supplémentaires furent attribués à Goodyear, dont les Corsairs furent désignés FG, et à Brewster, désignés F3A. Conçu et utilisé comme avion embarqué, le Corsair entra en service en grand nombre au sein de l'US Navy fin 1944 et début 1945. Il devint rapidement l'un des chasseurs-bombardiers embarqués les plus performants de la Seconde Guerre mondiale."
 ARG_cv_jet_multirole_equipment_2:0 "Grumman F9F Panther"
 ARG_cv_jet_multirole_equipment_2_short:0 "F9F Panther"
 ARG_cv_jet_multirole_equipment_2_desc:0 "Le F9F fut initialement conçu comme un avion à réaction embarqué à ailes droites, introduit en 1949. Un des premiers avions à réaction capables d'opérer depuis un porte-avions au sein de l'US Navy, il fut l'appareil d'attaque au sol prédominant de l'US Navy et de l'US Marine Corps durant la guerre de Corée, effectuant 78 000 sorties. Il est crédité de la première victoire aérienne d'un chasseur de l'US Navy durant ce conflit. Sa structure robuste lui permettait de mener des opérations d'attaque au sol, même sous le feu de la DCA. Le F9F (rebaptisé plus tard F-9) servit également au sein des Blue Angels, devenant ainsi le premier avion à réaction utilisé par cette patrouille. Fidèle à la tradition de Grumman de nommer ses avions d'après des félins, il est surnommé « Panthère »."
 ARG_cv_jet_multirole_equipment_3:0 "Grumman F9F Cougar"
 ARG_cv_jet_multirole_equipment_3_short:0 "F9F Cougar"
 ARG_cv_jet_multirole_equipment_3_desc:0 "Le F9F fut initialement conçu comme un avion à réaction embarqué à ailes droites, introduit en 1949. Un des premiers avions à réaction capables d'opérer depuis un porte-avions au sein de l'US Navy, il fut l'appareil d'attaque au sol prédominant de l'US Navy et de l'US Marine Corps durant la guerre de Corée, effectuant 78 000 sorties. Il est crédité de la première victoire aérienne d'un chasseur de l'US Navy durant ce conflit. Sa structure robuste lui permettait de mener des opérations d'attaque au sol, même sous le feu de la DCA. Le F9F (rebaptisé plus tard F-9) servit également au sein des Blue Angels, devenant ainsi le premier avion à réaction utilisé par cette patrouille. Fidèle à la tradition de Grumman de nommer ses avions d'après des félins, il est surnommé « Panthère »."
