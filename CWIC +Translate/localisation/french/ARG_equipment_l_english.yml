 ARG_cargo_helicopter_equipment_2:0 "Boeing CH-47C Chinook"
 ARG_cargo_helicopter_equipment_2_short:0 "CH-47C Chinook"
 ARG_cargo_helicopter_equipment_2_desc:0 "Le CH-47 (initialement HC-1B) est un hélicoptère bimoteur à rotors en tandem, figurant parmi les hélicoptères de transport les plus lourds de l'Ouest américain. Succédant au CH-37 Mojave, le CH-47 dispose de plusieurs moyens de chargement, notamment de multiples portes sur le fuselage, d'une large rampe de chargement à l'arrière et de trois crochets d'arrimage ventraux externes. Lors de sa mise en service en 1962, il était l'hélicoptère le plus rapide de sa génération et reste aujourd'hui l'un des plus rapides de l'arsenal de l'armée américaine. Son nom, « Chinook », provient du peuple amérindien Chinook, originaire de l'actuel État de Washington."
 ARG_naval_helicopter_equipment_1:0 "Sikorsky S-51"
 ARG_naval_helicopter_equipment_1_short:0 "Sikorsky S-51"
 ARG_naval_helicopter_equipment_2:0 "Aérospatiale SA316 Alouette III ASW"
 ARG_naval_helicopter_equipment_2_short:0 "Alouette III ASW"
 ARG_naval_helicopter_equipment_4:0 "Sikorsky SH-3 Sea King"
 ARG_naval_helicopter_equipment_4_short:0 "SH-3 Sea King"
 ARG_naval_helicopter_equipment_4_desc:0 "Dérivé du Sikorsky S-61 civil, le SH-3 (désignation originale HSS-2) est un hélicoptère de lutte anti-sous-marine (ASM) bimoteur. Premier hélicoptère amphibie au monde, il pouvait décoller aussi bien de la terre que de la mer. Avec le Seasprite, il fut également l'un des premiers hélicoptères ASM à utiliser des turbomoteurs. Outre ses missions ASM, le SH-3 était aussi utilisé pour la recherche et le sauvetage (SAR), le transport, l'évacuation sanitaire et la détection aéroportée (AEW). Plusieurs exemplaires furent même utilisés comme « Marine One », l'hélicoptère de transport officiel des présidents américains. C'est pourquoi il gagna le surnom de « Roi des mers », considéré comme l'un des hélicoptères les plus polyvalents au monde."
