 ARG_scout_helicopter_equipment_1:0 "Aerospatiale SA.315B Lama"
 ARG_scout_helicopter_equipment_1_short:0 "SA.315B Lama"
 ARG_scout_helicopter_equipment_2:0 "Agusta-Bell AB-206 JetRanger"
 ARG_scout_helicopter_equipment_2_short:0 "AB-206"
 ARG_scout_helicopter_equipment_2_desc:0 "Introduit en 1969, en pleine guerre du Vietnam, l'OH-58 était un hélicoptère quadriplace dont la particularité résidait dans la possibilité de retirer les commandes du siège pilote gauche afin de transporter un passager à l'avant, malgré la présence de deux pilotes. Durant le conflit, son armement se limitait à une mitrailleuse M134 ou un lance-grenades M129. Après la guerre, l'OH-58 bénéficia de nombreuses modifications : un moteur plus puissant (le mettant au même niveau que l'OH-58C ultérieur), un système d'imagerie thermique, un système de communication pour les forces de l'ordre, un équipement de navigation amélioré et un train d'atterrissage surélevé. Ces versions modernisées du « Kiowa » (nommé d'après une tribu amérindienne originaire du Montana et du Colorado) participèrent aux opérations antidrogue RAID de la Garde nationale de l'armée de terre américaine."
