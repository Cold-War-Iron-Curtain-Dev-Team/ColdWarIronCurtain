 ARG_mechanized_equipment_1:0 "Transporteur universel"
 ARG_mechanized_equipment_1_short:0 "Transporteur universel"
 ARG_mechanized_equipment_2:0 "M3 Half-Track"
 ARG_mechanized_equipment_2_short:0 "M3 Half-Track"
 ARG_mechanized_equipment_2_desc:0 "Le semi-chenillé M3 était un véhicule blindé de transport de troupes américain largement utilisé par les Alliés pendant la Seconde Guerre mondiale et la Guerre froide. Dérivé du semi-chenillé M2, le M3 a été produit en grande série, avec environ 15 000 exemplaires standard et plus de 38 000 variantes. Pendant la Guerre froide, il a été utilisé par divers acteurs étatiques et non étatiques dans des conflits en Amérique du Sud, au Moyen-Orient, en Afrique et en Asie, et est resté en service jusqu'au milieu des années 1990. Au Mexique, il était encore en service en 2019."
 ARG_mechanized_equipment_3:0 "M3A1 Half-Track"
 ARG_mechanized_equipment_3_short:0 "M3A1 Half-Track"
 ARG_mechanized_equipment_3_desc:0 "Le M3A1 est un semi-chenillé M3 équipé du support circulaire amélioré pour mitrailleuse M49, situé au-dessus du siège avant droit. Entre 1942 et 1943, tous les semi-chenillés M3 (standard et A1) ont fait l'objet d'améliorations continues. Ces améliorations concernaient notamment la transmission, le moteur et les systèmes de rangement."
 ARG_mechanized_equipment_5:0 "AMX-VCI"
 ARG_mechanized_equipment_5_short:0 "AMX-VCI"
 ARG_mechanized_equipment_6:0 "M113A1"
 ARG_mechanized_equipment_6_short:0 "M113A1"
 ARG_mechanized_equipment_7:0 "MOWAG Grenadier"
 ARG_mechanized_equipment_7_short:0 "Grenadier"
 ARG_mechanized_heavy_equipment_8:0 "TAMSE Vehículo de Combate Transporte de Personal"
 ARG_mechanized_heavy_equipment_8_short:0 "VCTP"
 ARG_mechanized_marine_equipment_1:0 "LVT-4 Water Buffalo"
 ARG_mechanized_marine_equipment_1_short:0 "LVT-4"
 ARG_mechanized_marine_equipment_1_desc:0 "Le LVTP-4 est un véhicule de débarquement amphibie conçu par Ford Machinery Corporation au début des années 1940. Utilisé pendant la Seconde Guerre mondiale, la guerre de Corée et la guerre du Vietnam, il est équipé d'un moteur radial W-670-9A à 7 cylindres et peut parcourir jusqu'à 120 km dans l'eau à une vitesse de 11 km/h. Évolution du LVTP-1, le LVTP-4 est capable de parcourir des distances impressionnantes à la nage, bien qu'à faible vitesse. Si vous devez traverser 110 km d'eau en une dizaine d'heures, le LVTP-4 est le véhicule idéal. Il peut transporter des troupes ou des véhicules."
 ARG_mechanized_marine_equipment_2:0 "LVT(A)-5"
 ARG_mechanized_marine_equipment_2_short:0 "LVT(A)-5"
 ARG_mechanized_marine_equipment_2_desc:0 "Le LVT(A)-4 était équipé d'une tourelle motorisée et d'un gyrostabilisateur pour l'obusier. Certains exemplaires ont été modernisés à la fin des années 1940 par une modification de la configuration du blindage."
 ARG_mechanized_marine_equipment_3:0 "AAVP-7"
 ARG_mechanized_marine_equipment_3_short:0 "AAVP-7"
 ARG_mechanized_marine_equipment_3_desc:0 "Le LVTP-7 (ou AAVP-7) est un véhicule blindé de transport de troupes amphibie conçu en 1972 par la Food Machinery Corporation. Il a été engagé dans des conflits aux Malouines, à Grenade, dans le Golfe, en Syrie et en Irak. Le LVTP-7 est équipé d'un moteur 8V-53T et peut parcourir 37 km à une vitesse de 13,2 km/h dans l'eau. Sa principale caractéristique est sa capacité à évoluer en mer de force 5, qualifiée de « forte » avec une houle moyenne à élevée, ce qui le rend bien plus performant que le LVTP-5 dans des conditions météorologiques difficiles. De plus, son blindage est nettement supérieur. Grâce à ses impressionnantes capacités en mer de force 5 et à sa protection accrue, il a remplacé le LVTP-5. Il est également équipé de lance-fumigènes."
 ARG_mechanized_marine_equipment_4:0 "MECATROL AAVP-7(Local Modification)"
 ARG_mechanized_marine_equipment_4_short:0 "AAVP-7 (L)"
 ARG_mechanized_marine_equipment_4_desc:0 "Le Naval Infantry Command a initialement reçu plusieurs véhicules composés de LVTP-7 et de LVTR, dont plusieurs ont ensuite été modernisés localement par MECATROL avec des moteurs diesel Caterpillar C7 et des modifications mineures au train de roulement et à d'autres composants."
 ARG_motorized_equipment_1:0 "GMC CCKW 6x6"
 ARG_motorized_equipment_1_short:0 "CCKW 6x6"
 ARG_motorized_equipment_2:0 "REO M35 6x6"
 ARG_motorized_equipment_2_short:0 "M35 6x6"
 ARG_motorized_equipment_2_desc:0 "Le M35 est un camion 6x6 de 2,5 tonnes conçu par REO en 1944. Il a été largement utilisé dans tous les conflits américains de 1950 à 1988. Le M35 est équipé d'un moteur OA-331, d'une boîte de vitesses à 5 rapports et 2 gammes, et d'essieux rigides avec suspension à lames. Il peut transporter une charge utile de 2 268 kg (5 000 lb). Il peut rouler à 93 km/h (58 mph) sur une distance de 480 km (300 miles) et sa consommation est de 30,5 l/100 km (8 mi/gal). Il a été largement utilisé par les États-Unis et nombre de leurs alliés à travers le monde. Il a été conçu pour remplacer le GMC CCKW après la guerre et offrir un véhicule plus robuste et plus rapide."
 ARG_motorized_equipment_3:0 "AM General M809 6x6"
 ARG_motorized_equipment_3_short:0 "M809 6x6"
 ARG_motorized_equipment_3_desc:0 "Le M809 est un camion 6x6 de 5 tonnes conçu par AM General en 1970. Il a été utilisé dans tous les conflits américains de 1970 à 1982. Le M809 est équipé d'un moteur NH250, d'une transmission à 5 vitesses et 2 gammes, et d'essieux rigides sur ressorts à lames. Il peut transporter une charge utile de 2 268 kg (5 000 lb). Sa vitesse maximale est de 84 km/h (52 mph) sur une autonomie de 563 km (350 miles) et sa consommation est de 23,5 l/100 km (10 mi/gal). Outre ses fonctions de transport de marchandises, ce véhicule est très robuste et peut accueillir divers équipements utilitaires sur sa benne. Il est ainsi possible d'y installer des dépanneuses, des bennes basculantes, des remorques, de grands fourgons pour le confort et le soutien, du matériel de pontage, et bien d'autres choses encore. Grâce à sa garde au sol élevée, le M809 peut également franchir des rivières peu profondes et sa suspension lui confère d'excellentes performances sur route comme en tout-terrain."
 ARG_motorized_equipment_4:0 "AM General M939 6x6"
 ARG_motorized_equipment_4_short:0 "M939 6x6"
 ARG_motorized_equipment_4_desc:0 "Le M939 est un camion 6x6 de 5 tonnes développé par AM General en 1982. Il a été utilisé dans tous les conflits occidentaux depuis lors. Le M939 est équipé d'un moteur 6CTA8.3, d'une transmission à 5 vitesses et 2 gammes, et d'essieux rigides avec suspension à lames. Ce véhicule peut transporter une charge utile de 4 536 kg (10 000 lb). Il peut parcourir 563 km (350 miles) à une vitesse moyenne de 10,1 km/h (6,3 mph) et sa consommation est de 34,7 l/100 km (6 mi/gal). Il est toujours en service aujourd'hui. Le M939 est très performant sur tous les terrains et est parfaitement adapté aux conditions climatiques difficiles. Il a donné naissance à une nouvelle génération de camions, de tracteurs routiers et de véhicules de dépannage et a été produit à grande échelle. Plus fiable et plus robuste que les véhicules précédents, il a complètement remplacé les contrats de production antérieurs."
 ARG_motorized_equipment_5:0 "UNIMOG U1300L"
 ARG_motorized_equipment_5_short:0 "UNIMOG U1300L"
 ARG_motorized_equipment_5_desc:0 "L'Unimog est disponible en version courte pour le transport d'outils ou en version longue pour le transport de charges tout-terrain. Actuellement, Daimler propose la série lourde 437.4 et la série porte-outils 405. Après avoir racheté l'Unimog traditionnel à Boehringer en 1951, Daimler-Benz a lancé la série Unimog S au milieu des années 1950 et a complété sa gamme avec des versions légère, moyenne et lourde dans les années 1960 et 1970, avant de réduire progressivement le nombre de modèles disponibles dans les années 1990 pour aboutir aujourd'hui à la version porte-outils moderne et à la série lourde."
