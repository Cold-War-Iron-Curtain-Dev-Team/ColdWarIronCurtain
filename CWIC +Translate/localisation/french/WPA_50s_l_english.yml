 WPA_Legacy_of_VOC: "L'héritage de la Compagnie des Indes orientales"
 WPA_Legacy_of_VOC_desc: "Alors que les Indes orientales néerlandaises s'apprêtaient à connaître une importante transition politique, l'héritage de la Compagnie néerlandaise des Indes orientales (VOC) demeurait un élément déterminant de la région. Bien que la VOC ait été dissoute en 1799, ses fondements en matière de commerce, de gouvernance et d'infrastructures continuèrent de façonner l'archipel. L'administration coloniale néerlandaise qui lui succéda maintint et développa nombre de structures de la VOC, garantissant ainsi la stabilité et la croissance économique.\n\nPlusieurs villes clés de la région, dont Batavia (Jakarta), Surabaya et Semarang, furent à l'origine des comptoirs commerciaux de la VOC et devinrent d'importants centres de commerce et d'administration. Les routes, les voies ferrées et les ports, initialement conçus pour faciliter le commerce sous la VOC, furent modernisés et développés sous l'administration néerlandaise. Ces développements renforcèrent la connectivité au sein de l'archipel et consolidèrent sa position de centre économique majeur en Asie du Sud-Est."
 WPA_The_Jewels_of_Asia: "Les joyaux de l'Asie"
 WPA_The_Jewels_of_Asia_desc: "Pendant des siècles, les Indes orientales néerlandaises ont été le joyau de l'Asie du Sud-Est, une région d'une immense richesse, d'une importance stratégique et d'une beauté naturelle incomparable. Réputé pour ses ressources abondantes, ses réseaux commerciaux florissants et son rôle central dans le commerce mondial, l'archipel est devenu la pierre angulaire des entreprises néerlandaises outre-mer. Malgré les bouleversements politiques, les Indes orientales néerlandaises sont restées l'un des territoires les plus précieux et les plus développés de la région, un héritage bâti sur des siècles d'investissements économiques et administratifs.\n\nLes Indes orientales néerlandaises sont dotées de richesses naturelles sans pareilles. De vastes plantations de café, de sucre, de thé, de tabac et de caoutchouc ont alimenté une économie d'exportation florissante, tandis que ses réserves de pétrole, d'étain et de charbon en ont fait une puissance industrielle majeure en Asie. Les terres fertiles de Java, les îles Moluques productrices d'épices et les régions riches en ressources de Sumatra et de Bornéo ont permis à l'archipel de demeurer un maillon essentiel de la chaîne d'approvisionnement mondiale.\n\nSon économie figure parmi les plus dynamiques de la région, grâce à des systèmes de plantations modernes, des réseaux de transport et des infrastructures portuaires rivalisant avec ceux des plus grandes puissances mondiales. Les investissements néerlandais dans l'industrie et les infrastructures ont fait de la colonie non seulement une source de matières premières, mais aussi une puissance économique performante et bien organisée, indispensable aux marchés européens."
 WPA_Unpopular_War: "La guerre impopulaire"
 WPA_Unpopular_War_desc: "Après la Seconde Guerre mondiale, les Pays-Bas cherchèrent à rétablir l'ordre dans les Indes orientales, qui avaient souffert de l'occupation japonaise. La déclaration soudaine d'indépendance en août 1945 fut perçue comme une mesure perturbatrice, en l'absence d'accord formel, et risquant d'entraîner un effondrement économique et l'anarchie.\n\nPlutôt que de rejeter le changement, les Pays-Bas privilégièrent un modèle fédéral, offrant une certaine autonomie tout en maintenant la coopération. Des accords comme le Linggadjati visaient un compromis, mais les conflits persistèrent. Les Politèles furent présentées comme nécessaires au rétablissement de la stabilité, mais la pression internationale croissante, notamment des États-Unis et de l'ONU, contraignit les Pays-Bas à un changement de cap."
 WPA_the_crown_set_foot_in_the_nusantara_desc: "Les Indes orientales néerlandaises se trouvaient à la croisée des chemins. Après des années d'investissement dans les infrastructures, la gouvernance et le développement économique, les Pays-Bas étaient confrontés à un contexte politique en pleine mutation. La région, longtemps considérée comme un maillon essentiel de l'économie néerlandaise à l'échelle mondiale, était en proie à l'instabilité en raison de la révolution nationale indonésienne. Si les efforts néerlandais visaient à rétablir l'ordre et à mettre en œuvre une transition politique structurée, la pression internationale croissante et la persistance du conflit rendaient inévitable une résolution négociée."
 dutch_east_indies_war.2.d: "Le décès soudain du lieutenant-général Simon Hendrik Spoor a été un choc pour l'establishment militaire néerlandais. En tant que commandant de l'Armée royale des Indes orientales néerlandaises, Spoor avait joué un rôle déterminant dans la conduite des opérations militaires néerlandaises au plus fort du conflit en Indonésie. Sa présence inspirait le respect ; ses stratégies ont façonné le cours des efforts déployés par les Pays-Bas pour rétablir leur contrôle colonial. Sa mort à Batavia fut brutale, survenant alors que les tensions restaient vives et que les négociations étaient incertaines. Pour les Néerlandais, ce fut plus que la perte d'un commandant : ce fut la perte d'une force directrice au milieu d'une guerre qui leur échappait de plus en plus. \n\nDu point de vue indonésien, le décès de Spoor marqua une fissure dans la campagne néerlandaise. Bien qu'il ne fût pas célébré, il fut accueilli avec une compréhension tacite qu'un des adversaires les plus compétents de la République avait été écarté de l'équation. Son absence a laissé un vide au niveau du commandement, semant l'hésitation et le désarroi dans une position néerlandaise déjà tendue."
 dutch_east_indies_war.2.a: "Repose en paix"
 dei_death_tt: "§YAvec sa mort, le rêve de reprendre le contrôle l'accompagne dans la tombe.§!"
 POLITICS_VAN_EECHOUD_DESC: "Jan Pieter Karel van Eechoud, gouverneur, homme politique, pilote et officier de police, exerce plusieurs professions et occupe actuellement le poste de gouverneur de la Nouvelle-Guinée néerlandaise.\n\nNé en 1904 à Horst, aux Pays-Bas, Eechoud a fréquenté le Kolese Kanisius de Nimègue. En 1929, il s'est rendu aux Indes néerlandaises pour travailler comme officier de police à Sukabumi. Pendant la Seconde Guerre mondiale, il a été envoyé en Australie pour y exercer les fonctions d'officier du renseignement.\n\nÀ son retour, Eechoud est devenu résident et administrateur de la Nouvelle-Guinée. Il souhaitait que la Nouvelle-Guinée néerlandaise se développe en tant que colonie distincte, indépendante des Indes néerlandaises. Eechoud affirmait que la culture en Papouasie était si primitive et si diversifiée que la région devait être exclue de la décolonisation. Les Néerlandais devaient d'abord éduquer les Papous, et ce pendant longtemps, sans quoi les non-Papous envahiraient la Papouasie et étoufferaient toute la culture papoue."