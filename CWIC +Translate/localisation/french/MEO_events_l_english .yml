 MEO.1.t:0 "Forging the Great National Unity in the Kingdom of the Meo"
 MEO.1.d:0 "As the highland mists rolled over Sa Phìn, the echoes of hammering and the shouts of workers filled the air. Vương Chí Sình, once known as the King of the Meo, now stood as a revolutionary leader, guiding his people toward a new future. Under his rule, the Hmong of Đồng Văn no longer lived under the shadow of colonial oppression but instead rallied under the banner of Khối Đại Đoàn Kết Dân Tộc—the great national unity movement, as called upon by Hồ Chí Minh.\n\nOnce a powerful figure in the opium trade, Vương Chí Sình had abandoned his father’s path, choosing instead the road of revolution. The French and Nationalist Chinese had both tried to tempt him with promises of autonomy, seeking to use his influence to divide the ethnic minorities from the Viet Minh. But the Meo King remained steadfast, having sworn loyalty to Bác Hồ and the cause of national liberation.\n\nNow, under his leadership, the Hmong no longer fought for the interests of colonial masters but instead armed themselves for the resistance. In secret, Vương Chí Sình had long been stockpiling weapons, training his people in mountain warfare, and forming a clandestine army drawn from the most loyal Hmong clans. When the call for Kháng chiến toàn quốc came, his warriors were ready.\n\nBut beyond the battlefield, Vương Chí Sình also embraced the revolutionary cause of self-sufficiency and prosperity. Fields once used for poppy cultivation were now repurposed for livestock farming and staple crops. Under his orders, villagers took up hammers and chisels to carve new roads through the stone plateau, opening pathways for trade and communication. His efforts, aligned with Hồ Chí Minh’s vision of Khối Đại Đoàn Kết Dân Tộc, ensured that the Hmong were no longer an isolated people, but an integral part of the revolutionary movement. "
 MEO.1.a:0 "A toast to our brother , Ho Chi Minh"
 MEO.2.t:0 "Tận Tâm Báo Quốc, Bất Thụ Nô Lệ"
 MEO.2.d:0 "The cold winds of the northern highlands swept through the halls of the Meo King’s palace in Đồng Văn as a messenger arrived from Hanoi, carrying a gift from President Hồ Chí Minh himself. Within the ornate package lay a chiếc áo trấn thủ, embroidered with the words: \"Kính tặng Hồ Chủ Tịch, Hội L.H.P.N Hải Dương.\" A symbol of warmth and protection, it had been gifted to the Father of the Nation by the women of Hải Dương, but now it carried a greater purpose. Ho had added his own inscription: \"Chuyển tặng Vương Chí Thành Đại biểu Quốc hội. Ký tên Hồ Chí Minh.\" It was no mere gesture of gratitude but a reaffirmation of the bond between Vương Chí Sình, now bearing the name Vương Chí Thành, and the revolutionary government he had pledged allegiance to.\n\nAlongside the coat was a magnificent sword, its scabbard adorned with eight powerful characters in Hán Nôm, inscribed by Hồ Chí Minh’s own hand:\n\"Tận Tâm Báo Quốc; Bất Thụ Nô Lệ.\"\n(\"Dedicate yourself to serving the nation; Never submit to slavery.\")\n\nWith these gifts, Hồ Chí Minh honored the Meo King not just as an ally but as a sworn brother in the struggle for national liberation. Unlike many other ethnic leaders who wavered between colonial forces, Vương Chí Thành had thrown his lot in with the revolution, believing in a Vietnam where the Hmong and all ethnic minorities would stand as equals in the new republic. His loyalty to the Viet Minh was not just political—it was a commitment sealed with a warrior’s blade and a patriot’s heart.\n\nNow, as the war against the French raged on, the Meo King stood firm, rallying his people to the cause of independence, knowing that the words etched into his sword would guide his path: to fight for Vietnam’s freedom, never again to bow to foreign rule."
 MEO.2.a:0 "A toast to our brother , Ho Chi Minh"
 MEO.3.t:0 "The Quoc-Cong Civil War"
 MEO.3.d:0 "For decades, the Meo Kingdom had watched China’s chaos from the misty highlands of Sa Phìn. Under the rule of Vương Chí Sình, the Hmong clans had once relied on trade with Yunnan’s warlords, exchanging opium for silver, weapons, and supplies. The French turned a blind eye, knowing that as long as the Meo King remained powerful, the mountain passes of Hà Giang were secure. But times had changed.\n\nWith Hồ Chí Minh’s guidance, Vương Chí Sình had broken from the old ways. No longer would the Hmong rely on the poison of the past. Bác Hồ had urged him: \"We must build a new Vietnam, free of colonial shackles, free of feudal oppression, and free of exploitation—including by opium.\" The Meo King listened, ordering his people to end the trade. The clan elders grumbled, the warlords in Yunnan cursed his name, but the decision was made.\n\nNow, as China burned in civil war between the Guomindang and the Communists, old partners sent desperate messengers to Sa Phìn. The Yunnanese generals pleaded for the Meo Kingdom to resume the opium shipments. Their armies were starved for resources. Even Chiang Kai-shek's forces in the south were willing to pay handsomely for supplies.\n\nBut Vương Chí Sình refused. He had seen enough of warlords and imperialists. The Meo Kingdom would not return to the past. His people had chosen revolution, self-sufficiency, and the unity of Khối Đại Đoàn Kết Dân Tộc under Vietnam’s national struggle.\n\nIn response, KMT-aligned bandits raided Meo villages, burning fields and stealing livestock, hoping to pressure the King into resuming trade. But the Hmong warriors, trained under Vương Chí Sình’s secret army, struck back. Clashes erupted along the border, and the Meo Kingdom found itself entangled in the great Chinese war—not as merchants, but as defenders of their newfound independence."
 MEO.3.a:0 "Let wait and see."
 MEO.4.t:0 "The Quoc-Cong War Ends – Chiang’s Victory "
 MEO.4.d:0 "After years of bloody conflict, the Chinese Civil War has ended with a decisive victory for Chiang Kai-shek and the Guomindang (KMT). The Red Army has been shattered, and Mao Zedong has vanished into the shadows. From Nanjing, the KMT declares its total control over China, vowing to restore order and crush all communist influence in the region.\n\nIn Sa Phìn, Vương Chí Sình gathers with trusted advisors to discuss the new geopolitical reality. A message from Hồ Chí Minh soon arrives, urging the Meo Kingdom to remain neutral in Chinese affairs, following the wisdom of \"Cây Tre\" diplomacy—like the bamboo, Vietnam must bend but not break in the face of shifting winds.\n\nHowever, vigilance is necessary. Duong Trung Nhan, the Tusi warlord of Meo Vạc and a sworn enemy of Vương Chí Sình, has aligned himself with the KMT. His bandits, once scattered, are emboldened by Chiang’s victory. With covert support from Nanjing, he now threatens the fragile stability of Hà Giang.\n\nShall we continue to abide by Hồ Chí Minh’s cautious approach, or must we prepare for the inevitable conflict with the KMT-backed factions?"
 MEO.4.a:0 "The bamboo bends, but it never breaks. Remain neutral, but keep the warriors ready."
 MEO.5.t:0 "The People's Republic of China Rises"
 MEO.5.d:0 "The world has changed overnight. Mao Zedong and the Communist Party of China (CPC) have emerged victorious in the Chinese Civil War. Chiang Kai-shek and his remaining forces have fled to the island of Taiwan, leaving Beijing under full CPC control. From the capital, Mao has declared the formation of the People’s Republic of China (PRC), vowing solidarity with oppressed peoples across Asia.\n\nA congratulatory letter from Hồ Chí Minh and the Việt Minh soon arrives in Sa Phìn. They hail China’s victory as a triumph against imperialism and feudalism, seeing it as a great step forward in the revolutionary struggle. However, caution remains necessary. While the CPC has promised support for Vietnam’s liberation, the KMT remnants still lurk in Yunnan, plotting their return.\n\nThe Meo Kingdom, once caught between warlords and colonialists, must now navigate a new political landscape. With the PRC as a potential ally, the balance of power in Southeast Asia has shifted—but can we truly trust them?"
 MEO.5.a:0 "Congratulate the CPC, but prepare for the KMT’s shadow to remain over Yunnan."
 MEO.6.t:0 "The Kingdom of Meo Returns to Tradition"
 MEO.6.d:0 "The people of Sa Phìn have spoken—farming reforms alone cannot sustain them. With starvation looming and the promises of Bộ Canh Nông failing to deliver, Vương Chí Sình makes a difficult decision. He issues a royal decree pardoning Duong Trung Nhan and re-establishing opium trading routes with Yunnan and Laos, securing a steady source of income for the highlands.\n\nThe elders whisper that this is how it has always been. The poppy fields, once abandoned, will bloom again, and the Meo Kingdom will prosper as it did before.\n\nThough the decision may invite the disapproval of Hà Nội, Vương Chí Sình knows that his first duty is to his people. Ideals do not fill empty stomachs—opium does."
 MEO.6.a:0 "A hungry kingdom cannot dream of utopia. We do what must be done."