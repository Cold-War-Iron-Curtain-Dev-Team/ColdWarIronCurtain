 NLRB_Packing.1.d: "Les syndicats ont joui d'un pouvoir excessif dans ce pays pendant trop longtemps. La nation américaine s'est construite sur la libre entreprise, mais les syndicats, dont beaucoup sont corrompus, voire devenus des façades pour la mafia, ne peuvent plus prétendre représenter les travailleurs et prendre l'économie en otage. Bien qu'ils se croient invincibles, le Conseil national des relations du travail (National Labor Relations Board) exerce un pouvoir immense sur les relations entre les travailleurs et les entreprises. Il suffit de quelques hommes de valeur à son conseil, et le pouvoir des syndicats corrompus et tyranniques sera brisé à jamais."
 NLRB_Packing.2.d: "Les syndicats sont l'épée et le bouclier du travailleur américain. Ils garantissent que l'entreprise américaine ne travaille pas seulement pour une élite, mais qu'elle paie sa part aux travailleurs américains qui font la grandeur de ce pays. La concurrence internationale et la libéralisation économique ont affaibli le pouvoir des syndicats au profit des intérêts des riches. Bien qu'ils se croient invincibles, le Conseil national des relations du travail (National Labor Relations Board) exerce un pouvoir immense sur les relations entre les travailleurs et les entreprises. Il suffit de quelques hommes compétents au sein de ce conseil, et le pouvoir des syndicats perdurera à jamais."
 NLRB_Packing.3.d: "Les récentes tentatives de l'administration présidentielle actuelle de doter le NLRB de laquais pro-entreprises menacent l'existence même de l'institution. Si elle ne sert que les riches, pourquoi s'occuper du conseil d'administration ? Même si la marionnette des entreprises au Bureau ovale a peut-être pris les devants, les syndicats ont encore des alliés au Sénat. Un effort concerté pour bloquer les nominations anti-syndicales et contraindre l'administration à nommer des membres du conseil d'administration plus favorables aux syndicats pourrait être la solution pour inverser le déclin des syndicats dans ce pays."
 NLRB_Packing.4.d: "Le président Udall sirote une gorgée de café serré. Ces derniers jours de réunions avec les dirigeants syndicaux et patronaux l'ont laissé à moitié mort. Tant de promesses faites, tant de poignées de main, et si peu à tenir. La politique est une affaire délicate, et le président se sent comme sa première victime.\n\n« Monsieur le Président, votre point de presse du matin, Monsieur. »\n\nLe regard d'Udall se pose sur la jeune assistante tandis qu'elle pose la pile de papiers et de chemises.\n\n« Merci beaucoup. Oh, et soyez gentil et dites à la cuisine que j'aime ce nouveau café. Il est costaricain, non ? »\n\nEnfilant ses lunettes de lecture, Udall plisse les yeux de son seul œil valide sur le point de presse quotidien, le parcourant jusqu'à ce que « VACANCE AU NLRB » attire son regard. Nommés par le président pour des mandats de cinq ans, les candidats choisis par l'administration précédente devaient bientôt quitter leurs fonctions, ce qui laissait une énigme. Durant son mandat au Congrès, il était connu pour son soutien au Parti travailliste et a remporté son poste actuel en grande partie grâce aux nombreuses contributions et soutiens de ses relations avec les dirigeants syndicaux.\n\nEn revanche, une fraction de plus en plus importante des Démocrates avait adopté des positions plus favorables aux entreprises et ne cachait pas son hostilité aux syndicats. Peut-être avaient-ils raison. Les syndicats avaient une noble intention, bien sûr, et de nombreux travailleurs avaient donné leur vie autrefois pour les privilèges dont jouissent aujourd'hui les travailleurs américains. Mais l'économie américaine stagnait ces derniers temps, engluée dans la bureaucratie, les impôts élevés et un mouvement ouvrier empoisonné par les machinations de la mafia. Après avoir examiné la liste des candidats, Udall prend une grande inspiration et prend sa décision."
 AbortionModGOP.1.d: "L'arrêt historique de la Cour suprême, Roe v. Wade, a consacré l'avortement comme un droit légal partout aux États-Unis. Cet arrêt a provoqué des remous au sein des deux partis, compte tenu de leurs positions sociales très divergentes. Au sein de notre propre parti, les conservateurs les plus radicaux ont fait pression pour que des mesures drastiques restreignent ou interdisent l'avortement, dont plusieurs porteraient certainement atteinte à l'intégrité de la Cour. Parallèlement, notre base politique est généralement modérément pro-choix. Cela soulève plusieurs questions sur la manière de procéder sur ce sujet. Nos conseillers politiques nous ont conseillé de rechercher un compromis avec les démocrates partageant les mêmes idées et de codifier l'avortement dans la loi fédérale en échange de certaines concessions."
 AbortionModGOP.2.d: "Suite à l'impasse au Congrès concernant notre tentative de compromis sur la codification du droit à l'avortement, le Président a annoncé plus tôt dans la journée son soutien à la loi sur le financement du libre choix des femmes en matière de santé. Les forces conservatrices au Congrès ont déclaré leur opposition totale au projet de loi et ont annoncé leur intention de lancer une obstruction parlementaire au Sénat afin d'empêcher le vote de ce texte. Hors des murs du Congrès, les réactions ont été mitigées : les sondages montrent qu'une faible majorité d'Américains soutiennent le projet de loi, qui a été soutenu par diverses organisations pro-choix. Cependant, la Majorité morale et d'autres groupes évangéliques ont dénoncé ce projet de loi, le qualifiant de trahison des valeurs américaines par le Président, et font activement pression sur les membres du Congrès pour qu'ils votent contre."
 AbortionModGOP.3.d: "Suite à l'impasse au Congrès concernant notre tentative de compromis sur la codification du droit à l'avortement, le Président a annoncé plus tôt dans la journée son soutien à la loi sur la réduction, les garanties et le soutien prénatal en matière d'avortement. Selon de récents sondages, une forte majorité d'Américains approuvent cette loi. Cependant, les organisations pro-choix ont critiqué la proposition en raison des restrictions imposées à l'accès à l'avortement, et les organisations évangéliques, dont la Majorité morale, ont dénoncé cette initiative, la qualifiant de trahison des valeurs américaines par l'administration. Cependant, aucune obstruction parlementaire n'a été évoquée contre le projet de loi et, en privé, plusieurs sénateurs conservateurs ont exprimé leur opposition, tout en indiquant qu'ils n'insisteraient pas outre mesure sur ce point compte tenu des concessions faites par le lobby pro-choix au Congrès."
 AbortionModGOP.4.d: "L'introduction d'un cadre pour codifier l'avortement au niveau fédéral n'a jamais été une tâche facile.\nLa loi sur le financement des choix en matière de santé des femmes consoliderait enfin le droit des femmes à choisir dans ce pays, mais le financement de ce droit par les contribuables a mis mal à l'aise tous les politiciens, sauf les plus progressistes, craignant que les électeurs, qui auraient autrement soutenu le droit à l'avortement, ne veuillent réélire quelqu'un qui les a obligés à en payer le prix.\nLa loi sur la réduction, les garanties et le soutien prénatal pour l'avortement codifierait l'avortement légal, mais pour de nombreux partisans du droit à l'avortement, elle ne sert qu'à restreindre l'avortement au strict minimum toléré par les tribunaux. Même ses propres auteurs ont gardé secret qu'il s'agissait d'un compromis précaire qui ne satisfait en rien leur base évangélique.\n\nAvec les débats et les obstructions qui menacent d'annuler ce projet de loi avant la naissance, [USA.GetLeader] est confronté au choix de soutenir le Parti républicain en faveur du projet de loi ou de garder ses faveurs politiques pour un autre jour. Le projet de loi sera vraisemblablement entre les mains du président, sauf artifice législatif que le destin pourrait généreusement prévoir. Le choix se situe finalement dans le Bureau ovale, à un coup de fil près de marquer ou de briser l'histoire."
 CAAA_Veto.1.d: "La Maison Blanche a annoncé aujourd'hui que le président [USA.GetLeader] opposerait son veto à la loi anti-apartheid globale adoptée par le Congrès il y a quelques jours. Cette annonce a surpris une grande partie du pays en raison de la popularité considérable du projet de loi, et les analystes politiques ont souligné que le Congrès l'avait adopté avec plus des deux tiers de la majorité dans chaque chambre. Le président a affirmé que sa politique actuelle d'« engagement constructif » serait plus efficace pour mettre fin à l'apartheid en Afrique du Sud, qualifiant le projet de loi de « destructeur pour nos efforts dans une nation divisée ». On estime actuellement que le Congrès parviendra à passer outre le veto du président [USA.GetLeader], compte tenu du grand nombre de votes que la Maison Blanche devrait faire basculer."
 CAAA_Veto.3.d: "L'abrogation de la loi anti-apartheid globale a été adoptée aujourd'hui, infligeant une lourde défaite à la Maison-Blanche et au président [USA.GetLeader]. Le président n'a réussi à rallier qu'une poignée de sénateurs à son opposition, et les représentants de la Chambre ont manqué de plus de 40 voix le nombre nécessaire. Apparemment, le président [USA.GetLeader] a tenté de réunir une coalition de membres du Congrès opposés à la CAAA en raison de son impact économique, et d'anciens partisans de la ségrégation qui restaient fermement opposés aux droits civiques. L'Afrique du Sud a condamné le projet de loi, affirmant qu'il ne ferait que nuire aux relations fragiles entre Noirs et Blancs dans le pays. Nelson Mandela, figure de la lutte contre l'apartheid, a salué le projet de loi, remerciant le Congrès pour sa lutte contre la discrimination en Afrique du Sud."
 CAAA_Veto.4.d: "L'annulation de la loi anti-apartheid globale n'a pas été adoptée aujourd'hui, offrant à la Maison-Blanche et au président [USA.GetLeader] une victoire surprise. Le président a rassemblé une coalition d'anciens membres du Congrès ségrégationnistes et de figures du libre-échange qui s'opposaient au projet de loi sur les intérêts économiques. De nombreux progressistes ont condamné cette décision aujourd'hui, la NAACP affirmant que l'Amérique contribue au maintien du racisme et de la discrimination systémiques dans le monde, et que le président [USA.GetLeader] trahit les valeurs américaines de liberté pour tous. Le gouvernement sud-africain a remercié la Maison-Blanche, affirmant qu'une réponse lente et mesurée à l'apartheid serait la meilleure solution pour toutes les nations concernées. Le leader anti-apartheid, Nelson Mandela, a quant à lui attaqué le président, le qualifiant d'étroit d'esprit et de force destructrice en Afrique du Sud."
 CAAA_Veto.2.d: "Le Congrès a entamé aujourd'hui le processus visant à annuler notre veto à la loi anti-apartheid globale, et la tendance actuelle est à la baisse. Nous ne parviendrons à convaincre aucun membre libéral d'aucun parti, et de nombreux modérés subissent une forte pression pour voter en faveur de cette annulation. Nous pensons cependant pouvoir drainer une coalition de députés partisans du libre-échange qui s'opposent au projet de loi pour des raisons économiques, ainsi que d'anciens partisans de la ségrégation encore présents au Congrès. Nous pourrions également faire pression sur les dirigeants de nos partis, en menaçant éventuellement de suspendre les financements de campagne et les soutiens supplémentaires des députés qui voteraient en faveur de cette annulation. Cependant, une telle option pourrait se retourner contre nous et conduire à l'échec d'autres projets de loi que nous souhaitons voir adoptés."
 CUBUSA80s.1.d: "Aujourd'hui, le président [USA.GetLeader] a annoncé la signature de la loi sur le rapprochement avec Cuba, qui mettrait fin à l'embargo actuel contre Cuba et amorcerait le rétablissement des relations avec l'île. Alors que Cuba et les États-Unis ont été opposés pendant la majeure partie de la Guerre froide, les tensions entre les deux nations se sont considérablement apaisées depuis la crise de 1962. Le président a déclaré qu'il était temps de dépasser les vieux conflits, soulignant l'opposition de l'ONU à l'embargo et le rôle de Cuba au sein du Mouvement des non-alignés comme preuve que ce pays n'est pas une simple marionnette soviétique. Cette annonce a été accueillie avec une vive hostilité par les faucons du Congrès, qui affirment que l'embargo maintient Cuba faible et isolé, et que le président porte ouvertement atteinte aux intérêts américains dans le monde. Un groupe particulièrement restreint de faucons extrémistes du pays a appelé à la démission ou à la destitution du président [USA.GetLeader] pour trahison envers les États-Unis."
 CUBUSA80s.2.d: "Nous avons reçu aujourd'hui un appel du secrétaire d'État américain [GetCurrentSecState], nous informant du projet du pays de mettre fin à l'embargo et de rétablir les relations avec notre République. Nombre de nos conseillers y voient une occasion en or de développer l'économie et d'obtenir une plus grande reconnaissance internationale. Cependant, certains partisans de la ligne dure y voient une ouverture de notre économie au capitalisme de connivence, et l'Amérique ne fait cette offre que pour déstabiliser Cuba par des manœuvres économiques trompeuses. Une normalisation des relations pourrait également entraîner une nouvelle crise migratoire pour notre pays, aggravant ainsi la fuite des cerveaux. Cependant, les approvisionnements alimentaires et médicaux qui entreront désormais dans le pays nous seront d'une grande aide et nous libéreront peut-être de notre dépendance à l'égard de l'Union soviétique."
 USDP.1.d: "Le président [USA.GetLeader] a annoncé aujourd'hui un moratoire national sur toutes les exécutions fédérales, justifiant sa décision par l'affirmation que la peine de mort est une méthode barbare pour faire respecter la loi et que le système actuel est très inefficace, de nombreux prisonniers passant des décennies à attendre leur date d'exécution et à épuiser leurs recours. Le président a critiqué les responsables politiques de la « loi et de l'ordre », soulignant que les délinquants les plus dangereux du pays finissent par être placés dans des cellules spacieuses et de meilleure qualité, avec des droits de visite bien plus étendus, ce qui fait paradoxalement de la peine de mort une expérience plus agréable pour le prisonnier qu'une peine de prison à perpétuité. Le président a également appelé les États qui appliquent encore la peine de mort à mettre également un terme à ce processus. Des députés conservateurs ont aujourd'hui attaqué l'annonce du président, le qualifiant de laxiste en matière de criminalité et affirmant qu'il ne cherche qu'à flatter le « vote carcéral »."
 War_on_Drugs80s.1.d: "Malgré l'adoption de la loi sur les substances contrôlées en 1970 et diverses autres campagnes antidrogue, les États-Unis ont connu une augmentation de la toxicomanie et des décès liés à la drogue dans tout le pays. Le crack, une forme de cocaïne fumable beaucoup moins chère, s'est répandu dans les communautés afro-américaines. De nouvelles drogues, toujours légales, comme la MDMA, ont également gagné en popularité sur de nombreuses scènes musicales underground, causant de graves dommages à notre pays. Aujourd'hui, le président [USA.GetLeader] a annoncé de nouvelles politiques visant à intensifier la lutte contre la drogue. Ces mesures comprennent une réforme importante de nos lois actuelles sur les drogues, l'instauration de peines de prison pour possession de drogue, la possibilité pour les familles ayant perdu un proche à cause de la toxicomanie de poursuivre les trafiquants en dommages et intérêts, et la création et la mise en œuvre d'un programme complet d'éducation aux drogues dans nos écoles. Le Congrès s’est généralement montré réceptif à cette politique, même si certains démocrates plus libéraux et certains membres libertariens ont exprimé leur opposition, qualifiant la guerre contre la drogue de gaspillage d’argent et de violation des droits individuels du peuple américain."
 War_on_Drugs80s.2.d: "Aujourd'hui, le président [USA.GetLeader] a annoncé une nouvelle campagne de lutte contre la drogue, davantage axée sur l'éducation et la science que sur des mesures d'ordre public supplémentaires et autoritaires. Celles-ci incluent le réexamen d'une grande partie des drogues actuellement répertoriées dans les tableaux I et II, certains experts médicaux affirmant que les drogues comme le cannabis devraient être traitées davantage comme l'alcool que comme l'héroïne et autres « substances dures ». Le président a également annoncé une priorité pour développer considérablement l'éducation aux drogues dans les écoles, affirmant qu'enseigner la vérité à la nouvelle génération sur ces substances sera la clé pour mettre fin à la guerre contre la drogue. Le président a essuyé l'opposition de nombreux politiciens conservateurs et des forces de l'ordre, qui affirment que le cannabis reste une drogue très nocive, car il constitue une porte d'entrée vers de nombreuses autres substances. Des rapports indiquent également que le président pourrait opposer son veto à tout projet de loi adopté par le Congrès visant à alourdir les peines pour simple possession de drogue."
 War_on_Drugs80s.10.d: "Le secrétaire à la Défense [GetCurrentSecDef] a annoncé aujourd'hui un renforcement important de la coordination avec la Drug Enforcement Agency (DEA) afin de lutter contre la crise croissante de la drogue aux États-Unis. Il a également annoncé que le président [USA.GetLeader] avait approuvé le recours à la Garde nationale pour lutter contre les fermes et laboratoires de drogue illégaux disséminés dans tout le pays. La Garde nationale mènera des opérations de perquisition contre les cartels et les réseaux de drogue du pays en s'appuyant sur les renseignements de la DEA, dispensera une formation complémentaire aux forces de l'ordre locales et étatiques pour mener à bien ces opérations, et mettra en œuvre un programme éducatif dans les régions où elle interviendra. Ces programmes comprendront une campagne de sensibilisation du public et des interventions dans les écoles locales pour donner des conférences supplémentaires. Ce nouveau programme a suscité une vive opposition de la part de l'ACLU et de nombreux députés progressistes, qui affirment que la militarisation de la police a un effet dissuasif sur le pays et risque de porter atteinte aux droits de nombreuses personnes accusées de crimes liés à la drogue. Entre-temps, les forces de l’ordre se sont montrées très réceptives à ces effectifs supplémentaires, les qualifiant de poids nécessaire pour faire pencher la balance de la guerre contre la drogue."
 AIDSGOP.1.d: "Le syndrome d'immunodéficience acquise (SIDA), causé par l'infection par le VIH, connaît une augmentation constante des cas aux États-Unis depuis la fin des années 1970. Cette maladie, qui se transmet principalement par contact sexuel, est incurable et généralement mortelle. Récemment, nous avons également constaté des cas d'Américains innocents infectés par transfusion sanguine. Les CDC ont recommandé l'interdiction à vie du don de sang aux toxicomanes et aux personnes de même sexe, en raison du risque élevé de contracter le virus. Par ailleurs, de nombreux États ont commencé à adopter des lois criminalisant la transmission intentionnelle du VIH aux États-Unis, afin de tenter de ralentir la progression du virus. L'organisation religieuse et politique Moral Majority a condamné le SIDA, le qualifiant de châtiment divin envoyé par Dieu pour punir l'Amérique de son acceptation croissante de l'homosexualité et de l'avortement dans le pays."
 AIDSGOP.5.d: "Le gouvernement fédéral a annoncé aujourd'hui l'interdiction de nouveaux financements pour la recherche sur le sida et le VIH, le Président affirmant qu'aucun financement supplémentaire ne serait nécessaire pour lutter contre l'épidémie. Cette décision a été condamnée par de nombreux médecins à travers le pays, ainsi que par certaines personnalités de gauche, qui affirment que le gouvernement fait passer l'argent avant la vie des Américains en paralysant les efforts de recherche sur le VIH. Jerry Falwell, chef de file de la Majorité morale, a affirmé qu'il était inutile de financer la recherche sur le sida, car il s'agit d'une maladie exclusivement causée par les hommes homosexuels, et que c'était la punition divine pour leurs péchés."
 AIDSGOP.10.d: "Aujourd'hui, le Directeur général de la santé publique des États-Unis a publié un rapport sur la crise du sida aux États-Unis. Il a recommandé une vaste campagne d'éducation sur le sida, car des mythes répandus se sont répandus comme une traînée de poudre, comme celui selon lequel le sida se transmet par les moustiques ou par simple contact cutané. Il a également plaidé pour une généralisation de la contraception masculine. Ces propositions d'éducation sexuelle et de contraception ont été rejetées par les conservateurs sociaux, qui préfèrent une éducation sexuelle plus limitée, axée uniquement sur l'abstinence. Jerry Falwell, chef de file de la Majorité morale, s'est prononcé contre le rapport du Directeur général de la santé publique, affirmant que des financements supplémentaires et une tolérance accrue envers les personnes infectées par le sida ne feraient que gaspiller l'argent des contribuables. Falwell a plutôt recommandé de réintroduire Dieu à l'école et dans la société américaine, ce qui, selon lui, « limiterait la propagation de l'homosexualité, vecteur du sida »."
 AIDSLib.1.d: "Le syndrome d'immunodéficience acquise (SIDA), causé par l'infection par le VIH, connaît une augmentation constante des cas aux États-Unis depuis la fin des années 1970. Les CDC demandent des fonds supplémentaires pour poursuivre la recherche sur la maladie, dans l'espoir de trouver un remède ou de proposer un traitement plus adapté. Le ministère de l'Éducation a également noué un partenariat avec le HHS et les CDC pour créer et financer des programmes d'éducation sur le SIDA, dans l'espoir de réduire la transmission et de dissiper les mythes néfastes sur la maladie. Cette initiative a suscité une forte opposition de la part des conservateurs sociaux du pays, qui accusent le gouvernement de détourner l'argent des contribuables pour financer une maladie causée par des homosexuels déviants. Jerry Falwell, membre de la Majorité morale, s'est engagé à soutenir les primaires contre tout politicien républicain soutenant les mesures gouvernementales sur le SIDA."
 USA_Nuclear_Energy.4.d: "Suite à plusieurs catastrophes nucléaires majeures aux États-Unis et en Union soviétique, notamment à Three Mile Island et à Tchernobyl respectivement, le président [USA.GetLeader] a annoncé le gel de nouvelles centrales nucléaires et l'obligation d'un examen strict de la sécurité et de la conformité de toutes les centrales nucléaires en exploitation aux États-Unis. Cela fait suite à la position ferme du président [USA.GetLeader] en faveur de la non-prolifération nucléaire et à sa méfiance à l'égard de l'énergie nucléaire. Les écologistes et autres partisans de l'antinucléaire ont salué cette décision, mais ont été attaqués par les électeurs pro-nucléaire et le secteur de l'énergie. D'autres inquiétudes ont été soulevées quant à l'impact que cela aura sur les prix de l'énergie, en particulier dans les régions fortement utilisatrices d'énergie nucléaire. Le président a également appelé d'autres pays à se joindre à lui en suspendant et en réexaminant leurs propres programmes d'énergie nucléaire. Comment d'autres pays, en particulier l'Union soviétique, ont réagi après la récente catastrophe de Tchernobyl."
 USA_Nuclear_Energy.5.d: "Le dirigeant soviétique [SOV.GetLeader] a annoncé un gel des installations nucléaires afin de confirmer la conformité réglementaire et la pleine mise en place des mesures de sécurité. [SOV.GetLeader] a également indiqué être ouvert à la reprise des négociations sur la non-prolifération nucléaire avec les États-Unis. Cette annonce fait suite à la récente annonce du président [USA.GetLeader] d'un gel de l'énergie nucléaire afin d'évaluer la sécurité des centrales et d'enquêter sur les mesures réglementaires et de sécurité actuelles. Ces deux décisions font suite à des accidents nucléaires majeurs survenus dans les deux pays, provoquant un tollé international. Le mouvement international pour l'environnement et la non-prolifération a salué cette annonce comme une victoire majeure et appelle les autres pays à suivre. Cependant, d'autres ont souligné les risques d'un arrêt arbitraire de l'énergie nucléaire, qui, selon eux, pourrait entraîner une pénurie d'électricité, une hausse des prix de l'électricité et une hausse des prix en aval tout au long de la logistique et du processus de production des biens."
 ADA_Veto.1.d: "Lors d'une cérémonie à la Maison Blanche aujourd'hui, le président [USA.GetLeader] a opposé son veto à l'Americans with Disabilities Act (ADA), un projet de loi bipartisan qui aurait considérablement étendu les droits et la réglementation des Américains handicapés. Ce projet de loi bénéficie d'un large soutien de la part de l'opinion publique américaine et son rejet entraînera certainement une réaction négative. Les dirigeants du Congrès se sont engagés à tenter un vote pour passer outre ce veto dans les prochains jours. L'opposition à l'ADA provient principalement de deux sources. La première est celle des milieux d'affaires, qui ont affirmé que le projet de loi obligerait les entreprises à augmenter considérablement leurs coûts et nécessiterait la rénovation des bâtiments existants. Une autre source d'opposition, probablement plus pertinente pour le raisonnement même du veto, est l'indignation des dirigeants évangéliques face à l'extension des protections aux victimes de la pandémie de sida."
 ADA_Veto.2.d: "Comme promis par une coalition bipartite au Congrès, un vote visant à annuler le veto a débuté dans les deux chambres du Congrès concernant l'Americans with Disabilities Act (ADA). Malheureusement, compte tenu de la large marge de votes initiale de l'ADA, nos efforts pour maintenir ce veto seront extrêmement difficiles. Notre meilleure chance sera de tirer parti des préoccupations de nos donateurs institutionnels et de faire pression sur nos collègues conservateurs au Sénat et à la Chambre des représentants pour qu'ils votent en faveur du maintien du veto. Cependant, compte tenu de la forte médiatisation de ce vote, des nombreux avis favorables au projet de loi et de l'image négative du vote contre les droits des personnes handicapées, cela ne suffira probablement pas à faire basculer suffisamment de votes en notre faveur. Quoi qu'il en soit, notre première initiative en faveur de l'ADA satisfera certainement nos donateurs et, espérons-le, sera oubliée par l'électeur moyen d'ici 1992."
 ADA_Veto.3.d: "La Chambre des représentants et le Sénat des États-Unis ont annulé le veto de l'Americans with Disabilities Act. Il s'agit d'une défaite majeure pour le président [USA.GetLeader], qui s'est fermement opposé à cette loi en raison de ses conséquences potentielles sur les entreprises et de l'inclusion des personnes atteintes du sida comme handicap. Les groupes d'intérêts économiques et les groupes de défense politique évangéliques se sont engagés à poursuivre la lutte contre l'ADA et ont indiqué qu'ils chercheraient à contester la constitutionnalité de la loi devant les tribunaux. Des juristes ont exprimé des doutes quant à la légitimité de ces recours juridiques. L'opinion publique américaine a largement approuvé cette annulation du veto, et l'opposition constante du président à la loi a pesé sur sa popularité. Il s'agit d'une victoire majeure pour les droits des personnes handicapées aux États-Unis et pourrait établir une nouvelle norme mondiale en matière de droits des personnes handicapées."
 ADA_Veto.4.d: "Alors que le rejet du veto du président sur l'Americans with Disabilities Act (ADA) a facilement franchi le seuil d'un rejet par la Chambre des représentants, le consensus général était que le Sénat suivrait rapidement son exemple. À la surprise générale, le Sénat n'a pas réussi aujourd'hui à franchir le seuil des deux tiers requis pour un rejet du veto. Cette situation survient alors que plusieurs sénateurs du parti du président ont initialement abandonné leur soutien au projet de loi pour voter contre. Les dirigeants évangéliques et les milieux d'affaires ont salué le courage de ces sénateurs qui ont pris position contre les interventions du gouvernement. Cependant, l'opinion publique désapprouve vivement cette mesure et une réaction générale contre ces sénateurs et le président [USA.GetLeader] est de plus en plus probable."
 USA_Monetary.1.d: "La crise de stagflation qui frappe le pays depuis les années 1970 a conduit la Réserve fédérale, avec le soutien du président, à relever les taux d'intérêt afin de resserrer la masse monétaire. Lors de la campagne électorale de 1980, le président avait insisté sur la nécessité de réduire l'inflation en resserrant la politique monétaire. Cette mesure permettra, à terme, de freiner l'inflation. Cependant, ce resserrement de la masse monétaire entraînera inévitablement une hausse du taux de chômage et une aggravation des problèmes socio-économiques. Quoi qu'il en soit, le président de la Réserve fédérale nous a assuré que les mesures drastiques prises mettront un terme à l'inflation et aux troubles économiques des années 1970."
 USA_Monetary.2.d: "Bonne nouvelle : le taux d'inflation a baissé à plusieurs reprises pendant plusieurs mois au cours de l'année écoulée. Maintenant inférieur à 9 %, la Réserve fédérale estime que, grâce au maintien de taux d'intérêt élevés et à une politique de dollar fort, l'inflation pourrait revenir à des valeurs normales d'ici un an environ. Cela dit, les inquiétudes se sont accrues quant aux conséquences économiques de taux d'intérêt élevés sur le Midwest industriel. Des rapports économiques récents indiquent que le chômage a commencé à augmenter chez les travailleurs de l'automobile et que le chômage des minorités a également commencé à grimper. Le président de la Réserve fédérale a assuré que ces conséquences, bien que préoccupantes, sont naturelles et qu'elles se résorberont d'elles-mêmes au cours des prochaines années."
 USA_Monetary.3.d: "Une nouvelle année, une nouvelle année de difficultés économiques. Techniquement, le pays est entré en récession en 1980, mais la situation est restée relativement calme grâce à une hausse limitée du taux de chômage. Malheureusement, de plus en plus d'indicateurs économiques commencent à indiquer l'imminence d'une récession majeure. La Réserve fédérale est restée inébranlable dans son soutien au maintien de taux d'intérêt élevés afin de faire baisser l'inflation, tout en maintenant une stratégie de « dollar solide » pour renforcer la position financière américaine sur les autres marchés. Deux options s'offrent alors à nous : suivre les conseils de la Réserve fédérale ou exercer une pression politique pour qu'elle assouplisse ses taux d'intérêt afin d'éviter les pires effets de la récession. Une profonde récession économique pourrait avoir de graves conséquences politiques si elle n'est pas résolue d'ici les prochaines élections et dévasterait à coup sûr le cœur industriel et agricole des États-Unis, déjà ravagé par des taux d'intérêt élevés. Comment procéder ?"
 USA_Monetary.4.d: "L'économie est entrée dans une profonde récession et les sondages sur notre gestion de l'économie et l'approbation de la Réserve fédérale sont en chute libre. Les agriculteurs ont commencé à protester contre le gouvernement et les concessionnaires automobiles ont attiré l'attention des médias après que plusieurs d'entre eux ont envoyé au président de la Réserve fédérale les clés de véhicules invendus dans des cercueils. Les taux d'intérêt élevés, combinés à la récession, ont ravagé les mineurs, les agriculteurs et les fabricants américains, tous secteurs qui dépendent de taux d'intérêt bas. Cela a gravement entamé notre popularité dans la ceinture agricole, les Appalaches et les villes industrielles du Midwest.\n\nCela dit, le taux d'inflation est tombé sous la barre des 3 % et nos économistes estiment que cette récession sera de courte durée et qu'une reprise est en vue. Cependant, si l'économie ne rebondit pas rapidement, les élections de 1984 pourraient être désastreuses pour notre parti."
 USA_Monetary.5.d: "Notre campagne de pression privée sur le président de la Réserve fédérale a conduit à une baisse drastique des taux d'intérêt à des niveaux plus raisonnables et à une atténuation rapide du pire de la récession. Malheureusement, cela a entraîné une baisse de l'inflation plus lente que ne l'espéraient de nombreux économistes et conseillers politiques. Heureusement, l'atténuation de la crise économique a permis un regain de soutien à notre administration, notamment parmi les électeurs du Midwest et des Appalaches. Malheureusement, notre action a affaibli notre soutien à New York, en Californie et dans d'autres régions plus favorables au libre-échange, centres commerciaux ou non dépendants de l'industrie manufacturière ou des exportations. La baisse des taux d'intérêt et la légère hausse de l'inflation ont semé la consternation parmi les géants de la finance américaine. Les problèmes persistent et les effets à long terme de la crise économique se feront encore sentir pendant des années."
 USA_Monetary.10.d: "La Réserve fédérale a annoncé plus tôt dans la journée une baisse importante des taux d'intérêt afin de stimuler l'économie. Avec un taux d'inflation désormais inférieur à 3 %, la stagflation des années 1970 est bel et bien révolue. Malheureusement, notre solution à ce problème a entraîné une profonde récession économique. Cependant, la Réserve fédérale et d'autres économistes de l'administration estiment désormais qu'avec ces baisses de taux, l'économie pourrait rebondir à temps pour les prochaines élections. Idéalement, cela nous permettra de mener une campagne positive axée sur notre réussite : sortir le pays de la stagflation et le sortir de la récession. Il s'agira d'un exercice d'équilibre délicat, et nos actions passées pourraient avoir causé des dommages politiques à long terme dans certaines régions du pays, notamment parmi les agriculteurs et les mineurs."
 Reaganomics.1.d: "Notre administration a été élue sur la base d'un programme visant à réduire les dépenses fédérales globales tout en augmentant les dépenses militaires, en réduisant les impôts et en équilibrant le budget, tout en mettant fin aux excès du libéralisme social des dernières années. À cet égard, la loi omnibus de réconciliation budgétaire de 1981 prévoyait une réduction du budget fédéral de 36 milliards de dollars pour l'exercice 1982 et de 140 milliards de dollars cumulés, incluant les années 1983 et 1984, et une augmentation des dépenses militaires de 176 milliards de dollars pour l'exercice 1981 à 221 milliards de dollars pour l'exercice 1982. De plus, cette mesure visait également à réduire les impôts et à abroger la controversée loi sur les systèmes de santé mentale, parmi un large éventail d'autres modifications de moindre ampleur. Normalement, une loi d'une telle ampleur serait difficile à adopter et pourrait faire l'objet d'une obstruction parlementaire au Sénat. Cependant, étant donné que l'ensemble de ce projet de loi a été intégré à la réconciliation budgétaire, le vote ne nécessitera qu'une majorité simple et ne sera pas susceptible d'obstruction parlementaire. Ceci, combiné à la loi sur la relance économique, qui sera adoptée dans le courant de l'année, contribuerait grandement à inscrire dans la loi plusieurs de nos promesses de campagne."
 Reaganomics.10.d: "Le Groupe de travail présidentiel sur les marchés financiers a été créé aujourd'hui par le décret 12631. Cette création fait suite au krach boursier de 1987. Les causes de cette crise restent encore mal comprises, mais ce qui a commencé par une appréhension face à un ralentissement de la croissance économique a entraîné plusieurs jours de chute des cours boursiers, jusqu'au « lundi noir », où le Dow Jones Industrial Average a plongé de plus de 500 points, perdant plus de 22 % de sa valeur boursière totale. Le nouveau groupe de travail, créé par le Président, constituera un groupe consultatif informé, mais informel, sur les marchés, à l'intention du Président et des régulateurs. Il sera composé du Secrétaire au Trésor, du Président de la Réserve fédérale, du Président de la Securities and Exchange Commission et du Président de la Commodity Futures Trading Commission. Malgré le soutien du grand public, certains acteurs politiques ont affirmé qu'il s'agissait simplement d'un nouvel exemple de capitalisme de connivence, le gouvernement choisissant les gagnants et les perdants de l'économie."
 Reaganomics.5.d: "La dernière décennie n'a pas été tendre avec les agriculteurs américains, c'est le moins qu'on puisse dire. Entre la hausse des taux d'intérêt, l'inflation, les prix du pétrole, la chute des prix fonciers et les conflits mondiaux entraînant une baisse des exportations, les saisies agricoles et les pertes des banques agricoles ont atteint des sommets depuis la Grande Dépression. Cela a non seulement affecté les agriculteurs, mais aussi les fabricants de machines agricoles du Midwest. Alors que la situation continue de se détériorer, les appels du public à une intervention gouvernementale se sont multipliés et devront être pris en compte. Le président est depuis longtemps un fervent partisan de la suppression totale des subventions agricoles. Si l'administration pourrait encore poursuivre dans cette voie, les chances qu'elle soit adoptée par le Congrès compte tenu de la crise actuelle sont faibles et l'accueil du public dans la Farm Belt serait assurément négatif. Cela dit, cela apaiserait les conservateurs fiscaux et les principaux soutiens du président. Alternativement, l'administration pourrait rechercher un compromis avec les démocrates du Congrès en soutenant la loi bipartite sur la sécurité alimentaire, qui vise à réformer les subventions agricoles, à améliorer les crédits d'impôt liés à l'agriculture et à mettre en place divers nouveaux programmes de conservation. Comment procéder ?"
 SSPurge.60: "Lors d'une conférence de presse aujourd'hui, le président Bill Clinton a annoncé qu'il chargerait le secrétaire à la Santé et aux Services sociaux d'enquêter sur la purge des effectifs de la Sécurité sociale opérée par l'administration précédente. Tout en se gardant de dénoncer la purge en elle-même, le président Clinton a souligné que les procédures appropriées n'avaient pas été respectées et que chaque cas devrait être examiné au cas par cas. Dans le même ordre d'idées, il a appelé le Congrès à adopter une loi codifiant le processus d'examen de l'admissibilité aux prestations d'invalidité de la Sécurité sociale afin de prévenir de futurs abus du système. Les dirigeants du Congrès ont manifesté leur soutien à cette loi et la plupart des observateurs s'attendent à ce qu'elle soit adoptée relativement facilement, compte tenu du caractère non controversé de la réforme. Les progressistes ont salué cette annonce, mais ont souligné que le président devait tenir parole lors de la précédente campagne et réintégrer les personnes injustement radiées lors de la purge des effectifs."
 SSPurge.61: "L'une des mesures les plus controversées de la présidence Reagan fut la purge des listes d'invalidité de la Sécurité sociale. De 1981 à 1984, l'Administration de la Sécurité sociale a modifié un processus de révision des prestations d'invalidité de la Sécurité sociale, ce qui a entraîné la radiation de près d'un demi-million de bénéficiaires, dont un grand nombre souffraient de troubles mentaux. La plupart des personnes dont les prestations ont été supprimées étaient clairement admissibles et avaient besoin d'aide. Si l'action du Congrès a mis un terme à la purge des listes, des milliers d'Américains handicapés, probablement admissibles, ont été radiés de la Sécurité sociale. Maintenant que notre administration a annoncé une révision des purges, deux options s'offrent à nous : la réponse attendue par notre base est la réintégration des membres radiés, mais cela serait coûteux et pourrait nuire à d'autres priorités budgétaires. Notre autre option serait de mettre fin discrètement à la révision et de tenter de maintenir les purges. Cependant, cela provoquerait presque certainement une vive réaction de l'aile progressiste du parti."
 SSPurge.62: "La résilience de notre administration face à la purge de la Sécurité sociale menée par l'administration précédente a suscité une vive réaction de la part de l'aile progressiste du parti. Si la purge en elle-même n'a pas constitué un enjeu majeur pour les électeurs, ce n'est pas le cas de la base démocrate. Compte tenu du passé de Clinton et de ses origines dans un État du Sud, les progressistes nourrissaient déjà des soupçons quant à la politique économique et sociale du président. Cette décision a conforté l'aile gauche du parti dans l'idée que le président Clinton ne fait guère mieux que Reagan sur la question de la protection sociale et compliquera certainement l'adoption de futures lois avec leur soutien. Des rumeurs ont également commencé à circuler quant à une possible contestation de la gauche lors des prochaines primaires, probablement par Jesse Jackson."
 Fairness_Doctrine.1.d: "La doctrine d'équité de la Commission fédérale des communications des États-Unis (FCC), introduite en 1949, imposait aux titulaires de licences de radiodiffusion de présenter les sujets controversés d'intérêt public et de le faire de manière à refléter équitablement les différents points de vue. Cependant, cette doctrine a suscité la controverse depuis sa création et a souvent suscité l'ire des conservateurs. Aujourd'hui, la FCC a officiellement voté l'abolition de cette doctrine par quatre voix contre zéro. Le président de la FCC, Dennis Patrick, a annoncé lors du vote : « Nous souhaitons étendre à la presse électronique les mêmes garanties du Premier Amendement dont la presse écrite bénéficie depuis la création de notre pays.» Les démocrates du Congrès se sont engagés à soumettre un projet de loi visant à rétablir cette doctrine, mais le consensus général est que le texte ne bénéficiera pas d'un soutien suffisant pour surmonter un veto présidentiel. L'avenir nous dira quels seront les effets de cette décision sur le pays et sur la presse électronique dans son ensemble."
 ERA_Extension.1.d: "Le président [USA.GetLeader] a signé aujourd'hui une mesure du Congrès visant à modifier le délai de ratification de l'amendement sur l'égalité des droits (ERA). Plusieurs États ayant déjà ratifié l'amendement ont indiqué qu'ils contesteraient la légalité d'une nouvelle prolongation du délai de ratification de l'ERA devant les tribunaux. D'autres questions juridiques ont également été soulevées concernant l'ERA. Plusieurs constitutionnalistes ont soutenu que le délai lui-même était inconstitutionnel, et cet argument est actuellement examiné par les tribunaux. Une autre question juridique est de savoir si les États peuvent annuler la ratification de leurs amendements et, le cas échéant, quelle est la procédure légale pour ce faire. Quoi qu'il en soit, cette question restera un bourbier juridique dans un avenir proche et l'ERA restera un sujet de division politique."
 ERA80s.2.d: "Dans un discours national prononcé aujourd'hui, le président américain [USA.GetLeader] a appelé le Congrès à prolonger le délai de ratification de l'amendement sur l'égalité des droits (ERA). Cet amendement est unique en ce sens que le Congrès a fixé une date limite à laquelle les États devaient ratifier l'amendement pour qu'il soit considéré comme valide. Alors que l'ERA devait expirer en 1979, le Congrès avait prolongé ce délai jusqu'en 1981. Cependant, la légalité de cette initiative a été sujette à caution et constitue une question juridique très controversée. Le président [USA.GetLeader] a appelé aujourd'hui à prolonger indéfiniment le délai afin de mettre un terme à ce problème et d'établir un calendrier ouvert pour une éventuelle ratification de l'amendement. Cependant, cela ne résout pas l'autre question juridique concernant l'ERA, à savoir si les États peuvent annuler la ratification après l'avoir ratifiée. Quoi qu'il en soit, cette question restera un bourbier juridique dans un avenir proche."
 SSPurge.1.d: "L'administration Reagan a confirmé avoir demandé à l'Administration de la Sécurité sociale de réévaluer l'éligibilité des bénéficiaires de prestations d'invalidité de la Sécurité sociale. Cette décision a été prise en modifiant le processus d'examen des bénéficiaires. Le président Reagan et ses partisans ont affirmé que la Sécurité sociale était saturée de personnes ne méritant pas d'y être inscrites et que cela contribuerait à éliminer les fraudes et à lutter contre le phénomène des « reines de l'aide sociale ». Des critiques et des avocats militants ont quant à eux affirmé qu'il s'agissait d'une simple tentative de l'administration de combler le déficit fédéral aux dépens des Américains handicapés. L'accueil réservé à cette mesure a été largement apathique et indifférent, mais elle a attisé la colère des progressistes contre le président Reagan."
 SSPurge.50.d: "Le président américain [USA.GetLeader] a annoncé aujourd'hui que son administration chercherait à réintégrer les personnes radiées des allocations d'invalidité de la Sécurité sociale suite aux décisions de l'administration précédente. Ces suppressions ont suscité des divisions et la colère des militants progressistes pendant des années. Le président appelle également à de nouvelles mesures pour codifier dans la loi la procédure appropriée de détermination de l'éligibilité à la Sécurité sociale afin d'éviter qu'une telle pratique ne se reproduise. Les conservateurs fiscaux du Parti républicain ont critiqué cette mesure, la jugeant plus favorable à ceux qui abusent du système de protection sociale à leurs propres fins, et s'engagent à bloquer le projet de codification du processus de révision. Cela dit, la mesure a rencontré un large soutien public et le soutien à la codification d'une procédure appropriée et claire de détermination de l'éligibilité devrait être adopté par le Congrès compte tenu de la répartition partisane actuelle."
 FedReserve80s.1.d: "Alors que le mandat actuel de Paul Volcker, président de la Réserve fédérale, touche à sa fin, il est temps de décider qui sera nommé pour confirmation par le Sénat. L'actuel président, Paul Volcker, est disposé à être reconduit dans ses fonctions, mais son mandat controversé depuis 1979 pourrait inquiéter certains électeurs, notamment les agriculteurs qui ont vigoureusement condamné sa politique de taux d'intérêt au début de la décennie. Alan Greenspan, ancien président du Conseil des conseillers économiques au milieu des années 1970, est un fervent partisan de la déréglementation. Il est connu pour avoir été un ami proche de la controversée Ayn Rand et a été décrit comme un objectiviste. Si Greenspan s'attirerait probablement les foudres des libéraux, il bénéficierait du soutien quasi unanime des conservateurs au Sénat. Une autre option serait Felix Rohatyn. Rohatyn, architecte de la reprise budgétaire de l'État de New York dans les années 1970 et fervent partisan du développement des infrastructures et de la réglementation budgétaire, bénéficierait d'un large soutien des critiques de Volcker à gauche, mais susciterait l'ire des conservateurs. Comment procéder ?"
 FedReserve80s.5.d: "Felix Rohatyn, financier qui a piloté le sauvetage budgétaire de New York dans les années 1970, a été nommé président de la Réserve fédérale par le président [USA.GetLeader]. Rohatyn, immigré d'une Europe ravagée par la guerre au lendemain de la Seconde Guerre mondiale, est un fervent défenseur de la reconstruction des infrastructures américaines et bénéficie du soutien de critiques plus à gauche du mandat de Volcker. Cette nomination intervient alors que le second mandat de l'actuel président, Paul Volcker, touche à sa fin. Volcker, bien qu'il ait réussi à sortir l'Amérique de la stagflation des années 1970, a été critiqué des deux côtés de l'échiquier politique pour son maintien de taux d'intérêt élevés et son opposition à la déréglementation financière, respectivement. L'opposition de Rohatyn à la déréglementation étant largement considérée comme plus forte que celle de Volcker, les conservateurs tenteront probablement de bloquer la nomination. Cependant, les analystes politiques estiment généralement que Rohatyn devrait facilement être confirmé au Sénat dans les semaines à venir."
 FedReserve80s.6.d: "Le président [USA.GetLeader] a annoncé aujourd'hui la nomination de Paul Volcker pour un troisième mandat à la tête de la Réserve fédérale. Le président a salué Volcker pour avoir guidé l'Amérique à travers la stagflation économique de la fin des années 1970 et du début des années 1980. Cependant, les critiques de Volcker ont critiqué cette annonce. Les conservateurs fiscaux ont été irrités par l'opposition de Volcker à une plus grande déréglementation financière, tandis que les intérêts agricoles et industriels ont soutenu ses mesures visant à maintenir des taux d'intérêt élevés tout au long des années 1980, ce qui, selon certains, a aggravé la crise agricole actuelle. Cela dit, on s'attend toujours à ce que Volcker soit facilement confirmé une fois de plus par le Sénat, et les efforts de lobbying de ses opposants, tant de gauche que de droite, n'ont pas réussi à entamer la confiance du président en lui."
 FedReserve80s.7.d: "À la surprise générale, le président [USA.GetLeader] a annoncé la nomination d'Alan Greenspan au poste de président de la Réserve fédérale. Cette annonce intervient alors que le second mandat de l'actuel président Paul Volcker touche à sa fin. Volcker lui-même, selon ses proches, était ouvert à un troisième mandat, mais le président [USA.GetLeader] a décidé de changer de cap. Des rumeurs ont circulé selon lesquelles le président et Volcker se seraient disputés suite à l'opposition de ce dernier à de nouvelles mesures de déréglementation. De plus, le mandat controversé de Volcker à la présidence a certainement joué un rôle dans cette décision, compte tenu des nombreuses protestations contre lui au début des années 1980, liées à la hausse des taux d'intérêt et à la récession de 1982. Greenspan est l'ancien président du Conseil des conseillers économiques au milieu des années 1970. Fervent partisan de la déréglementation, il est connu pour avoir été un ami proche de la controversée Ayn Rand et a été décrit comme un objectiviste."
 Savings_and_Loan_Collapse: "Effondrement du secteur de l'épargne et du crédit"
 Savings_and_Loan_Bailout: "Renfloué le secteur des caisses d'épargne et de crédit"
 Savings_and_Loan_Crisis.10.d: "La déréglementation du secteur financier au début des années 1980 était une mesure nécessaire pour atténuer la stagflation qui frappait alors l'économie américaine. Cependant, ces réformes ont permis à ces associations d'offrir une gamme plus large de produits d'épargne, notamment des prêts hypothécaires à taux variable, mais ont également considérablement étendu leur pouvoir de prêt et allégé la surveillance réglementaire. Ce phénomène, combiné à la hausse des taux d'intérêt depuis 1979 et à la croissance rapide des actifs due aux investissements risqués, a entraîné un risque d'effondrement massif de ces associations. Des économistes internes estiment que jusqu'à la moitié de ces associations financières pourraient faire faillite sans intervention fédérale. Notre administration se retrouve donc face à deux options pour faire face à cette crise imminente. La première option serait de solliciter l'intervention fédérale et de renflouer ces associations, puis de rétablir un semblant de réglementation du secteur. Alternativement, nous pourrions laisser le marché s'adapter et permettre l'effondrement massif de ces associations. Comment procéder ?"
 Savings_and_Loan_Crisis.11.d: "Le président [USA.GetLeader] a annoncé aujourd'hui avoir demandé au Trésor de renflouer le secteur des caisses d'épargne et de crédit afin d'éviter une éventuelle faillite massive des organismes financiers. Il a également appelé au rétablissement de la réglementation des caisses d'épargne et de crédit afin d'éviter que ce type de crise ne se reproduise. Cette mesure de stabilisation a permis d'éviter une ruée générale sur les caisses d'épargne et de crédit, mais a été critiquée pour avoir renfloué des sociétés financières avec l'argent des contribuables américains. Des critiques des deux bords politiques se sont concentrées sur ce point, d'autres ciblant le président de la Réserve fédérale et la déréglementation financière votée par le Congrès au début de la décennie. Cela dit, la situation continue de se stabiliser et la plupart des électeurs approuvent l'intervention du président [USA.GetLeader] dans la crise et la prévention d'un nouveau chaos économique."
 Savings_and_Loan_Crisis.12.d: "Ces dernières semaines, de nombreuses caisses d'épargne et de crédit ont fait faillite. Heureusement, la quasi-totalité des dépôts était couverte par la Federal Deposit Insurance Corporation (FDIC). Interrogé sur la crise, le président [USA.GetLeader] a déclaré que, malgré la situation préoccupante, les fondamentaux économiques étaient solides et que le marché allait se redresser dans les mois à venir. Il a également souligné que la quasi-totalité des dépôts étaient assurés par l'État et seraient accessibles aux déposants. Cependant, le président a essuyé de vives critiques pour son inaction face à la crise et son inaction face au secteur de l'épargne et du crédit. Depuis le début de la crise, plus de 30 % des caisses d'épargne et de crédit du pays ont fait faillite, et d'autres devraient faire faillite dans les semaines à venir."
 OilCrisis80s.1.d: "Le président [USA.GetLeader] a annoncé que le temps était venu pour le gouvernement américain de mettre fin au contrôle des prix du pétrole et de lever les contrôles d'allocation du pétrole. Il a fait valoir que le pire de la crise pétrolière était passé et que de telles mesures nuisaient désormais plus à l'économie qu'elles ne lui étaient bénéfiques. L'opinion publique a été mitigée à cette annonce : les milieux d'affaires et les conservateurs ont salué cette mesure, la qualifiant de pas vers la restauration du libre marché après les turbulences des années 1970, tandis que les défenseurs des consommateurs ont critiqué cette mesure, la qualifiant de braderie des Américains ordinaires aux mains des compagnies pétrolières. Certains démocrates progressistes ont également rétorqué que cette mesure, bien que nécessaire, était prématurée et que le moment n'était pas opportun pour lever le contrôle des prix du pétrole, ajoutant que cette mesure ne ferait qu'aggraver l'inflation compte tenu de ses effets potentiels sur la chaîne d'approvisionnement."
 DoVA.1.d: "Le programme moderne d'avantages sociaux pour les anciens combattants américains existe depuis la Première Guerre mondiale. Dans les années 1920, les différentes prestations étaient gérées par trois agences fédérales distinctes : le Bureau des anciens combattants, le Bureau des pensions et le Foyer national des soldats volontaires handicapés. La création de l'Administration des anciens combattants a eu lieu en 1930, lorsque le Congrès a autorisé le président à « consolider et coordonner les activités gouvernementales concernant les anciens combattants ». Les trois agences qui la composent sont devenues des bureaux au sein de l'Administration des anciens combattants. Ce statu quo a été largement maintenu jusqu'à aujourd'hui. Cependant, la complexité des avantages et des soins aux anciens combattants s'est considérablement accrue et la nécessité d'une réforme est un enjeu majeur depuis plusieurs années. Heureusement, le Congrès a adopté la loi sur le Département des anciens combattants, qui fera de l'Administration des anciens combattants un ministère de niveau ministériel chargé de promouvoir la réforme et la supervision, ainsi que d'améliorer la qualité des services aux anciens combattants américains."
 EnvironmentUSA.1.d: "L'Agence de protection de l'environnement (EPA) et l'augmentation massive des réglementations environnementales sont l'un des exemples les plus flagrants de l'ingérence fédérale ces dernières années. Ce nouveau décret a gravement entravé la vie quotidienne des entreprises et des Américains ordinaires. Si nous ne pouvons pas supprimer l'EPA pour le moment, nous pouvons certainement réaffecter des fonds du ministère et chercher à imposer des licenciements et à aggraver l'impasse au sein de l'organisation. À cet effet, le chef de cabinet a déjà ordonné une réduction de 11 % du budget de l'EPA pour cette seule année et, d'ici la fin de notre mandat actuel, cela devrait représenter une baisse de 40 % du budget par rapport à 1980. Un autre changement nécessaire que notre administration devrait s'efforcer d'opérer est l'ouverture de davantage de terres fédérales à l'exploitation pétrolière. Si la décennie écoulée a été une leçon pour la nation, plus nous réduirons notre dépendance au pétrole étranger, mieux ce sera. Cela dit, ces mesures ne manqueront pas d'inciter les forces progressistes à se rebeller contre notre administration."
 DEM88.1.d: "L'une des principales priorités des Démocrates ces dernières décennies a été la réforme du système de santé. Compte tenu de notre force actuelle au Congrès et de notre récente victoire électorale, le moment est peut-être venu de prendre des mesures décisives en la matière. À ce jour, trois propositions majeures de réforme du système de santé sont actuellement présentées au sein du parti. La première est la plus ambitieuse : instaurer un système de santé universel à payeur unique via une expansion massive du système Medicare. Cette option bénéficierait d'un fort soutien de l'aile progressiste du parti, mais pourrait rencontrer des difficultés auprès des factions plus modérées et conservatrices, et ne recueillerait probablement aucun soutien de la part des Républicains. La deuxième option est la loi sur la réduction des coûts et l'accès aux soins de santé, qui viserait à élargir l'accès à l'assurance maladie et à en réduire les coûts en renforçant le contrôle des prix par l'État, en augmentant les subventions et en réformant l'enseignement médical, tout en offrant davantage d'options pour la souscription d'une assurance maladie. Cette mesure plus modérée satisfera les progressistes tout en paraissant aux yeux des modérés du parti. La dernière mesure, la loi sur l'accès à des soins de santé abordables, de qualité et responsables, est similaire à celle proposée par les administrations précédentes et viserait à créer des marchés subventionnés de l'assurance maladie, tout en rendant obligatoire la souscription d'une assurance maladie pour tous, sous peine de sanctions. Cette loi élargirait également l'accès à Medicaid. Elle plairait à la majorité des membres du parti, mais elle serait critiquée par les progressistes, qui la jugent insuffisante. Comment procéder ?"
 IRCA_Veto.1.d: "Lors d'une cérémonie télévisée à la Maison Blanche aujourd'hui, le président Jackson a opposé son veto à la loi sur la réforme et le contrôle de l'immigration. Bien qu'il soutienne l'application des lois existantes sur l'immigration, le président Jackson a souligné que ce projet de loi était excessivement punitif envers les soi-disant « étrangers illégaux » et qu'un projet de loi plus humain devrait être présenté à la place. Le président a également exprimé son opposition aux sanctions imposées aux employeurs qui embauchent des personnes en situation irrégulière et a appelé le représentant Ed Roybal (Démocrate-Californie) à adopter le projet de loi sur l'immigration. Royabal, un allié notoire de Jackson, propose un projet de loi alternatif visant à appliquer les lois du travail fédérales et étatiques existantes aux travailleurs sans papiers. Jackson a une fois de plus été critiqué par les conservateurs, tant au sein de son parti que du Parti républicain, pour ses opinions sur l'immigration et ses positions progressistes sur la question. Des sondages et des appels ont été lancés pour que le veto soit levé dans les prochains jours."
 IRCA_Veto.2.d: "Comme promis, les dirigeants conservateurs du Sénat et de la Chambre des représentants ont lancé des votes pour annuler notre veto à la loi sur la réforme et le contrôle de l'immigration. Pour éviter ce veto, nous devrons mobiliser les législateurs démocrates afin qu'ils votent contre. Cela impliquera probablement de convaincre ceux qui ont voté pour la loi de voter contre. Ce sera une tâche difficile, mais si nous parvenons à faire échouer ce veto, cela prouvera que notre administration ne se laissera pas renverser par les forces réactionnaires du Congrès. De plus, nous devrions contrer le discours conservateur en continuant à faire pression pour que le représentant Ed Roybal (Démocrate-Californie) adopte une loi sur l'immigration visant à réduire les mauvais traitements infligés aux travailleurs migrants. Malheureusement, la force des forces conservatrices au Congrès risque d'être trop importante, d'autant plus que les démocrates du Sud soutiennent largement la loi."
 IRCA_Veto.3.d: "À la grande déception du président Jackson et des progressistes du pays, le rejet du veto de la loi sur la réforme et le contrôle de l'immigration a recueilli suffisamment de voix pour être adopté au Sénat et à la Chambre des représentants. Le président Jackson s'est engagé à poursuivre sa lutte contre les dispositions de la loi et à demander des amendements au projet de loi dans un avenir proche. Alors que les sénateurs démocrates auraient théoriquement dû compter suffisamment de membres pour bloquer un tel rejet, un nombre important de démocrates du Sud ont fait défection lors du vote, ce qui a permis son adoption. Il s'agit d'une victoire majeure pour la coalition conservatrice des deux partis contre les politiques progressistes du président Jackson. Cela dit, une majorité de l'opinion publique a exprimé son soutien à la loi sur la réforme et le contrôle de l'immigration."
 IRCA_Veto.4.d: "À la grande déception des conservateurs du pays, le vote annulant le veto du président Jackson à la loi sur la réforme et le contrôle de l'immigration a échoué aujourd'hui au Sénat. Si l'adoption initiale du projet de loi indiquait un soutien suffisant pour une telle annulation, le président Jackson et ses partisans ont réussi à convaincre suffisamment de sénateurs démocrates de voter contre, la condamnant ainsi à l'échec. Malheureusement pour le président, le projet de loi sur l'immigration du représentant Ed Roybal (Démocrate-Californie) que Jackson a défendu est bloqué à la Chambre et a peu de chances d'être adopté. Cela dit, il s'agit d'une défaite majeure pour les forces conservatrices des deux partis qui tentent d'imposer une politique conservatrice contre la volonté du président Jackson. Alors que le débat fait rage, une chose est sûre : l'immigration jouera certainement un rôle important dans les élections de 1988."
 CRRA_Veto.1.d: "Aujourd'hui, le président [USA.GetLeader] a opposé son veto à la loi de 1987 sur la restauration des droits civiques. Cette loi stipulerait que les entités recevant des fonds fédéraux doivent se conformer à la législation sur les droits civiques dans toutes leurs opérations, et pas seulement pour le programme ou l'activité financé. Cette mesure fait suite à la décision de la Cour suprême de 1984 dans l'affaire Grove City College c. Bell, qui stipulait que seul le programme d'un établissement d'enseignement bénéficiant d'une aide financière fédérale était tenu de se conformer aux dispositions anti-discrimination du Titre IX. Cette situation a créé une faille, notamment pour les établissements d'enseignement privés, qui peuvent ainsi poursuivre leurs politiques discriminatoires à l'encontre des minorités et des femmes. Le président a justifié son veto en affirmant que la loi était excessive et qu'elle « réduirait considérablement la liberté et l'indépendance des institutions religieuses dans notre société ». Les dirigeants du Congrès se sont engagés à lever ce veto dans les prochains jours."
 CRRA_Veto.2.d: "Comme promis par les dirigeants démocrates du Congrès, un vote visant à annuler le veto sur la loi de restauration des droits civiques a débuté dans les deux chambres du Congrès. Malheureusement, compte tenu de la large majorité des voix initialement exprimées, le maintien de ce veto sera extrêmement difficile. Cela dit, plusieurs pistes s'offrent à nous pour le maintenir. Les groupes évangéliques et les milieux d'affaires sont fermement opposés à la loi de restauration des droits civiques ; c'est pourquoi nous devons faire appel aux législateurs évangéliques qui nous soutiennent pour obtenir leur soutien. Il est intéressant de noter que plusieurs groupes pro-choix se sont également opposés au projet de loi en raison de son ton « neutre vis-à-vis de l'avortement ». Si nos agents parviennent à convaincre un certain nombre de législateurs progressistes de se prononcer sur cette dénonciation des causes féministes, les chances de succès du vote de maintien augmenteront considérablement."
 CRRA_Veto.3.d: "Lors d'un vote décisif des deux chambres du Congrès, la loi de 1987 sur la restauration des droits civiques est entrée en vigueur aujourd'hui, le seuil permettant de passer outre le veto du président [USA.GetLeader] ayant été franchi. Il s'agit d'une victoire majeure pour les militants des droits civiques, et c'est la première fois depuis la Reconstruction qu'une telle annulation est nécessaire pour surmonter un veto présidentiel sur une législation relative aux droits civiques. Le président [USA.GetLeader] a une nouvelle fois condamné cette annulation, la jugeant invalidant la décision antérieure de la Cour dans l'affaire Grove City et consacrant de fait la discrimination à l'encontre des institutions religieuses. Plusieurs établissements d'enseignement privés, notamment ceux liés à des religions spécifiques, devront désormais réévaluer leurs politiques ou renoncer totalement à toute aide financière fédérale. Cela dit, la loi a été critiquée par l'Organisation nationale des femmes (NOW) pour avoir compromis un amendement du sénateur John Danforth (R-MO) qui stipulait que les établissements privés ne seraient pas tenus de financer les services d'avortement des personnes inscrites et interdisait la discrimination à l'encontre des femmes qui y ont recours ou qui y ont recours."
 CRRA_Veto.4.d: "Lors d'une défaite surprise, le Congrès n'a pas réussi à passer outre le veto de la loi de 1987 sur la restauration des droits civiques. Il s'agit d'une défaite majeure pour la cause des droits civiques et d'une perte majeure pour les progressistes et les sociaux-libéraux qui ont défendu ce projet de loi en réponse à la décision de Grove City de 1984, qui a créé une faille dans les dispositions anti-discrimination du Titre IX. Les dirigeants évangéliques ont salué les décisions audacieuses des législateurs républicains qui ont fait défection pour maintenir le veto face à l'intrusion potentielle de cette loi dans les universités évangéliques. À l'opposé, diverses organisations pro-choix, notamment l'Organisation nationale des femmes, ont salué les transfuges libéraux qui ont voté pour le maintien du veto, arguant que l'amendement « neutre en matière d'avortement » inclus dans la loi par le sénateur du Missouri John Danforth portait atteinte à l'esprit du Titre IX. Cette étrange coalition a infligé le premier échec à une dérogation à la législation sur les droits civiques depuis la Reconstruction."
 CRA90_Veto.1.d: "Le Civil Rights Act de 1990 est depuis longtemps la priorité législative des militants des droits civiques. Initialement présenté par le représentant Augustus Hawkins (Démocrate-Californie), le projet de loi visait à modifier l'ancienne loi sur les droits civiques « afin de rétablir et de renforcer les lois sur les droits civiques interdisant la discrimination à l'embauche et à d'autres fins ». Cependant, il a été vivement critiqué par la Federalist Society et d'autres fondations juridiques conservatrices. Ces critiques ont affirmé qu'il obligerait les entreprises à recourir à des quotas raciaux à l'embauche et qu'il serait trop vague dans sa formulation. Utilisant une rhétorique similaire aujourd'hui, le président [USA.GetLeader] a opposé son veto au projet de loi, affirmant qu'il « utilise un langage hautement légaliste pour introduire la force destructrice des quotas dans notre système national d'emploi ». Les démocrates du Congrès se sont engagés à tenter de contourner ce veto dans les prochains jours."
 CRA90_Veto.2.d: "Comme promis par les dirigeants démocrates du Congrès, un vote visant à annuler le veto concernant la loi sur les droits civiques de 1990 a débuté dans les deux chambres du Congrès. Malheureusement, compte tenu de la large marge de vote obtenue par cette loi, nos efforts pour maintenir ce veto seront extrêmement difficiles. Cela dit, plusieurs pistes s'offrent à nous pour le maintenir. Les groupes évangéliques et les milieux d'affaires sont fermement opposés à la loi sur les droits civiques de 1990 ; c'est pourquoi nous devons faire appel aux législateurs évangéliques sympathisants afin de solliciter leur soutien pour son maintien. Il est intéressant de noter que plusieurs groupes pro-choix se sont également opposés au projet de loi en raison de son ton « neutre vis-à-vis de l'avortement ». Si nos agents parviennent à convaincre un certain nombre de législateurs progressistes de se prononcer sur cette dénonciation des causes féministes, les chances de succès du vote de maintien augmenteront considérablement."
 CRA90_Veto.3.d: "Les efforts des Démocrates du Congrès ont porté leurs fruits aujourd'hui, les deux chambres du Congrès ayant finalisé leurs votes pour passer outre le veto du Président à la loi sur les droits civiques de 1990. Avant le vote, les analystes politiques s'attendaient à un échec probable de la mesure, compte tenu du nombre de Démocrates conservateurs qui hésiteraient probablement à passer outre le Président sur ce sujet. Cependant, les défections ont été limitées et plusieurs Républicains progressistes ont rejoint les Démocrates pour passer outre le veto. Le Président [USA.GetLeader] a condamné cette mesure, mais a admis que la mesure était désormais une loi et que son administration la respecterait et ne chercherait pas à l'annuler devant les tribunaux. Les groupes évangéliques et les milieux d'affaires opposés ont juré de contester la loi devant les tribunaux et de tenter de l'annuler par les urnes et le marteau."
 CRA90_Veto.4.d: "Les efforts des dirigeants démocrates du Congrès ont échoué aujourd'hui, le Sénat ayant rejeté une mesure visant à passer outre le veto du Président à la loi sur les droits civiques de 1990. Avant le vote, les analystes politiques s'attendaient à un échec probable de la mesure, compte tenu du nombre de démocrates conservateurs susceptibles d'hésiter à passer outre le Président sur ce sujet. Comme prévu, les défections démocrates ont condamné la mesure à l'échec, notamment compte tenu de l'opposition unie des Républicains. Les évangéliques, les milieux d'affaires et les partisans du Président ont salué les transfuges pour leur « position courageuse » en faveur de ce qui est juste, tandis que les militants des droits civiques ont appelé à de nouvelles contestations lors des primaires contre les démocrates conservateurs ayant voté contre la loi. Le Président a toutefois indiqué qu'il serait ouvert à un compromis avec les démocrates sur une législation plus restrictive en matière de droits civiques qui apaiserait ses inquiétudes concernant les quotas."
 USENT.1.d: "Lors d'une visite au Royaume-Uni plus tôt dans la journée, le président [USA.GetLeader] a annoncé son soutien à un accord de libre-échange américano-britannique. Le Premier ministre [ENG.GetLeader] n'a pas encore annoncé publiquement s'il était favorable ou non à la proposition, mais des sources proches du Premier ministre ont déclaré qu'elles estimaient que la proposition bénéficiait d'un large soutien au sein du gouvernement britannique. Ce soutien au sein du gouvernement britannique est principalement motivé par l'idée de diversifier davantage les opportunités d'exportation britanniques afin de réduire leur dépendance à l'Europe, tout en établissant un accord commercial qui ne devrait pas nuire davantage au secteur industriel britannique. Cependant, des critiques des deux côtés de l'Atlantique ont dénoncé cette proposition, la qualifiant de bradage de la souveraineté de leurs pays respectifs, tandis que d'autres, notamment des dirigeants syndicaux, l'ont critiquée comme une nouvelle attaque contre les syndicats des pays développés."
 USENT.2.d: "Le projet d'Accord de libre-échange anglo-américain (AAFTA) est un sujet controversé depuis sa proposition par le président [USA.GetLeader]. Si nous avons décidé d'aller de l'avant avec ce projet, nous devons également prêter attention aux soutiens et aux oppositions internes à l'accord proposé. Pour commencer, concernant le problème interne au parti, les syndicats sont quasiment unis par leur opposition à l'AAFTA, par crainte de la concurrence étrangère. Les sondages montrent que le Midwest industriel, en particulier l'Ohio et le Michigan, est fortement opposé à l'accord proposé en raison de sentiments protectionnistes. De l'autre côté de la médaille, les États dépendants de l'agriculture ou d'autres exportations soutiennent largement le projet, notamment l'establishment démocrate de Californie et du Sud. Notre engagement en faveur de l'AAFTA ne suscitera probablement pas suffisamment de colère pour entraîner une contestation lors des primaires de 1992, mais il sera indispensable de rester attentif aux factions en présence au sein du parti et de tenter de concilier les intérêts des uns et des autres dans les mois à venir."
 USENT.3.d: "Le président [USA.GetLeader] est depuis longtemps un partisan du libre-échange. Depuis son entrée en fonction, le président américain a manifesté son intention de resserrer ses liens avec l'Anglosphère, notamment avec la Grande-Bretagne. Cet accord pourrait être une aubaine pour notre économie et permettre à notre pays de conquérir une plus grande part du marché américain. De plus, il pourrait également permettre à notre économie de se diversifier et de s'affranchir d'une dépendance excessive aux échanges commerciaux avec l'Europe. En revanche, un tel accord ne manquerait pas d'attiser les tensions avec nos syndicats. De plus, des inquiétudes sociopolitiques ont été soulevées quant à l'absence de protection des travailleurs et de l'environnement dans le projet de traité actuel. Enfin, nous devrions également nous demander si nous souhaitons ou non nous lier davantage à l'orbite américaine. Comment procéder ?"
 USENT.4.d: "Notre ambassadeur à Londres a informé le Département d'État que la Grande-Bretagne avait accepté de poursuivre la mise en œuvre du projet d'accord de libre-échange. Le gouvernement britannique a notamment souligné sa volonté d'accroître ses exportations vers les États-Unis afin de diversifier ses partenaires commerciaux et de réduire sa dépendance à l'égard de l'Europe. L'engagement de la Grande-Bretagne envers nos relations renforcera encore nos liens économiques et géopolitiques. De plus, cela permettra d'assouplir davantage les barrières commerciales avec l'île et de renforcer les liens économiques. Cela étant dit, la Grande-Bretagne a exprimé son souhait de voir la protection des travailleurs renforcée lors des futures négociations. Globalement, il s'agit d'une excellente nouvelle, d'une victoire supplémentaire pour la politique commerciale de notre administration et d'une étape vers la construction d'un héritage durable pour le Président."
 USENT.5.d: "Le gouvernement britannique a informé plus tôt dans la journée le Département d'État qu'il s'opposerait à la conclusion d'un accord de libre-échange pour le moment. Diverses raisons ont été avancées, mais les plus importantes ont été les inquiétudes concernant le déclin du secteur manufacturier, les probables protestations des syndicats et les préoccupations relatives à la protection de l'environnement et des travailleurs aux États-Unis. Sans en parler, nos contacts au sein du gouvernement britannique ont indiqué que Londres envisageait également une perte potentielle de souveraineté et qu'en concluant un tel accord commercial, le Royaume-Uni s'endetterait davantage envers les États-Unis et serait instrumentalisé pour façonner leur politique étrangère."
 USENT.6.d: "Lors d'une cérémonie de signature à Washington aujourd'hui, le président [USA.GetLeader] et le Premier ministre [ENG.GetLeader] ont officiellement signé un accord de libre-échange américano-britannique. Les deux dirigeants ont salué l'adoption de cet accord par leurs gouvernements respectifs et souligné ses avantages pour les deux pays et l'expansion des débouchés commerciaux pour les États-Unis et la Grande-Bretagne. Les milieux d'affaires et les défenseurs du libre-échange ont salué cette initiative, notamment dans la ceinture agricole américaine. Cependant, les syndicats des deux pays ont exprimé leurs inquiétudes quant aux problèmes potentiels, tandis que les groupes environnementaux protestaient également contre l'accord. De plus, les entreprises d'Europe continentale ont critiqué cette initiative, la qualifiant de détournement du Royaume-Uni du marché européen vers les États-Unis. L'avenir nous dira quel impact cet accord aura sur les relations américano-britanniques, ainsi que sur l'avenir du fédéralisme européen."
 USENT.7.d: "La proposition du président [USA.GetLeader] en faveur d’un accord commercial anglo-américain a échoué, constituant un revers majeur pour les objectifs de politique étrangère de son administration. Bien que le Premier ministre [ENG.GetLeader] ait été réceptif à l’accord, les critiques émanant des syndicats, des militants écologistes et des partisans de l’intégration européenne se sont révélées trop importantes à surmonter. Par ailleurs, des préoccupations intérieures aux États-Unis ont entraîné une baisse du soutien à l’accord, notamment en raison d’un retour de bâton de la part des courants protectionnistes, en particulier des syndicats, ainsi qu’une forte opposition de la communauté irlando-américaine. Dans l’ensemble, cela représente un revers notable pour le président, bien que celui-ci ne devrait pas avoir de répercussions politiques majeures lors des prochaines élections, compte tenu de l’indifférence générale du public à l’égard de cette proposition."
