 DEMSouthCarolinaPromptDesc: "§GJimmy Carter§! a remporté le caucus de Caroline du Sud de 1980 en obtenant §G25§! sur §G25§! délégués."
 McDonald84.0.d: "Aujourd'hui à Washington, le président McDonald a signé le décret 12334, intitulé « Activités de renseignement des États-Unis ». Ce décret, qui définit le champ d'action des services de renseignement et autorise une plus grande liberté dans la collecte de renseignements, ordonne également au Conseil de sécurité nationale et à toutes les agences subordonnées d'intégrer la Western Goals Foundation, une agence de renseignement intérieure privée anticommuniste, à leurs opérations. Pour les observateurs non avertis, cela marque un changement radical dans les opérations de renseignement américaines et un assouplissement rapide de l'autorité réglementaire dont disposaient ces agences par le passé, ce qui engendre des attitudes plus agressives et radicalement anticommunistes, et crée peut-être un dangereux précédent pour la sécurité nationale américaine en général."
 McDonald84.1.d: "Le monde a été sous le choc aujourd'hui lorsque l'ambassadrice des États-Unis auprès des Nations Unies, Jeane Kirkpatrick, a annoncé la suspension des activités de sa délégation auprès de l'ONU, sur ordre du président McDonald. En tant que membre permanent du Conseil de sécurité, membre fondateur et membre le plus influent de l'ONU après l'Union soviétique, cette décision modifie fondamentalement le fonctionnement de l'ONU pour une durée indéterminée. Alors que la délégation américaine s'éloignait, convoi à destination de Washington, le Secrétariat est resté sous le choc."
 McDonald84.2.d: "Dissoute en janvier 1975, la Commission de la Chambre sur la sécurité intérieure, connue dans les années 1950 sous le nom de Commission de la Chambre sur les activités antiaméricaines, a été reconstituée sur les conseils du président McDonald, du Conseil de sécurité nationale et de la Western Goals Foundation. Créée pour enquêter sur les « éléments subversifs » non seulement aux États-Unis, mais aussi au sein des gouvernements fédéral et des États, la HCIS constitue une avancée radicale dans une nouvelle direction, et certains experts l'ont qualifiée de résurrection des idéaux maccarthystes, notamment au Congrès américain."
 McDonald88.0.d: "Avec la création de la Commission de la sécurité intérieure de la Chambre des représentants et la signature du décret 12334, la Western Goals Foundation poursuit son ascension et s'infiltre jusqu'aux sphères les plus profondes du gouvernement fédéral américain. Fondée en 1979 par le major-général John Singlaub, l'éditeur John Rees et le président McDonald, la WGF a été créée pour « enrayer la subversion, le terrorisme et le communisme ». Elle agit comme agence de renseignement privée, conservant des dossiers de police et d'enquête sur les « subversifs » connus depuis le début des années 1980. Grâce à ses activités de renseignement, la WGF a pu fournir aux forces de l'ordre fédérales et étatiques des informations cruciales sur les subversifs politiques, en particulier les communistes présumés. Avec l'arrivée au pouvoir du président Larry McDonald, il est clair pour la plupart des analystes politiques que la WGF continuera de gagner en envergure et en influence dans les années à venir."
 McDonald88.1.d: "Lors d'un discours télévisé inédit adressé au peuple américain ce soir, le président Larry McDonald a exposé son interprétation du déclin moral de la nation. Terminant un discours enflammé par des expressions telles que « féminisme militant et terroriste », « monstres pro-avortement radicaux tueurs d'enfants » et « déviants sexuels enragés, obsédés par la pornographie », décrivant selon lui une large partie de la population américaine, McDonald a appelé à un retour aux « valeurs chrétiennes américaines normales, à la famille nucléaire, sans dégénérescence ». Bien que cela soit très inhabituel pour un président américain, ce n'est pas une première pour McDonald, qui a fait campagne sur un principe similaire lors de sa campagne présidentielle."
 McDonald88.2.d: "Le Capitole et la Maison Blanche étaient envahis de journalistes aujourd'hui, suite à des informations simultanées annonçant qu'un amendement constitutionnel visant à abroger l'amendement sur l'égalité des droits était présenté aux deux chambres du Congrès sous forme de résolution conjointe. Les deux porte-parole ont affirmé la même chose : il s'agissait d'une priorité législative pour le président McDonald et « l'amendement sur l'égalité des droits est un affront aux valeurs familiales fondamentales qui existent dans ce pays depuis sa fondation » et « ouvre la voie à davantage de déviances sexuelles de la part des homosexuels et autres personnes du même acabit ». Bien que cette annonce ne soit pas totalement choquante de la part de cette administration, les partisans de l'ERA se préparent à riposter en lançant une série de campagnes, tant au niveau fédéral qu'au niveau des États, pour rejeter cet amendement."
 McDonald88.3.d: "Le président Larry McDonald a officiellement approuvé ce matin, par une résolution conjointe, l'introduction d'un amendement d'annulation à la Constitution des États-Unis. Initialement soulevé au début des années 1830, lorsque l'État de Caroline du Sud a tenté d'annuler les tarifs fédéraux, l'annulation est une théorie qui stipule que les 50 États ont le droit d'annuler ou de déclarer nulle toute loi ou décision fédérale. Plus récemment, l'annulation a été utilisée pour justifier la résistance à l'intégration scolaire ainsi qu'à d'autres réformes des droits civiques. Cet amendement n'est pas surprenant, mais sa ratification reste à déterminer."
 McDonald88.4.d: "Sans surprise, le cabinet du président McDonald a évoqué l'idée d'interdire le Parti socialiste des travailleurs des États-Unis. Formé en 1938 après une scission avec le Parti socialiste d'Amérique, le SWP a connu des difficultés pendant la Seconde Guerre mondiale et la Peur rouge des années 1950. Majoritairement trotskiste et fortement favorable à Cuba, il représente une menace pour l'administration McDonald, et son interdiction serait globalement conforme aux priorités de son administration."
 McDonald88.5.d: "Aujourd'hui, le Service de l'immigration et de la naturalisation des États-Unis, l'agence américaine des douanes et de la protection des frontières, a mené à bien une vaste opération d'expulsion. Annoncée par décret du président McDonald, cette opération a permis d'expulser environ 100 000 immigrants illégaux, principalement dans les zones frontalières des États de Californie, d'Arizona, du Nouveau-Mexique et du Texas. Bénéficiant de l'aide de la Garde nationale, ainsi que du recours à des hélicoptères et à des véhicules blindés, l'opération a été un succès, quoique quelque peu controversé."
 McDonald88.6.d: "Le cabinet du président McDonald se réunissait aujourd'hui pour discuter d'un sujet important, susceptible d'affecter profondément tous les Américains. Le secrétaire au Trésor, George Hansen, a pris la parole le premier, rompant le silence.\n\n« Eh bien, je suis sûr que vous savez tous pourquoi vous êtes ici. Nous devrions discuter de l'impôt sur le revenu.»\n\nDes murmures de « vol » ont été entendus, avant que McDonald ne prenne la parole. « Je veux abolir l'impôt sur le revenu. C'est un gaspillage de temps et de ressources pour le gouvernement, et cela contribuera grandement à libérer l'Américain moyen de l'emprise d'un gouvernement autoritaire.»\n\nDes applaudissements ont retenti dans la salle, tandis que les membres du cabinet hochaient la tête, mais une personne est restée silencieuse avant de prendre la parole.\n\n« Monsieur le Président, je suis opposé à la suppression de l'impôt sur le revenu. D'abord, pourquoi ne pas simplement réformer les problèmes actuels au lieu de le supprimer complètement ? Nos recettes fiscales fournissent la majeure partie de nos fonds budgétaires pour le fonctionnement de ce gouvernement.» Reuben Askew était très compétent dans son travail, étant l'actuel représentant américain au Commerce et ancien gouverneur de Floride.\n\nMcDonald marqua une pause avant de répondre : « Bien que je sois plutôt d'accord, je pense que l'impôt sur le revenu a survécu suffisamment longtemps et que nous pouvons générer des recettes par d'autres moyens, tout en réduisant nos dépenses. Par conséquent, je pense que nous devrions… »"
 McDonald88.7.d: "Dans une annonce sans précédent faite aujourd'hui par la Maison Blanche, le président Larry McDonald a proposé la suppression éventuelle de l'impôt sur le revenu aux États-Unis. S'exprimant avant une conférence de presse régulière, McDonald a qualifié l'impôt sur le revenu de « fardeau inutile pour l'Américain moyen » et a affirmé que sa suppression « libérerait des millions d'Américains de l'esclavage de la dette envers leur gouvernement ». Naturellement, la plupart des membres du Parti démocrate de McDonald ont exprimé leur indignation face à cette annonce, l'ont immédiatement condamnée et ont souhaité que le président McDonald revoie sa stratégie fiscale. On ignore si cette proposition aboutira, mais ses conséquences sont déjà perceptibles."
 McDonald88.8.d: "Lors d'une réunion du Conseil de sécurité nationale, d'importantes discussions sur la politique en matière de drogue ont débuté. Étaient présents le président McDonald, le secrétaire à la Défense John Singlaub, le procureur général des États-Unis Roy Cohn et le directeur de la CIA William Casey.\n\nS'appuyant sur leurs discussions précédentes à ce sujet, Singlaub a pris la parole : « Monsieur le Président, nous savons tous que le problème de la drogue dans ce pays est l'une de vos principales priorités. Je suis sûr que nous sommes tous d'accord sur la nécessité d'agir, et j'ai une proposition à faire.» Il a marqué une pause. « Nous devrions étendre nos opérations antidrogue à un périmètre plus large que le ministère de la Justice.» Il a fait un signe de tête à Cohn. « Les troupes de la Garde nationale et les agents de la CIA devraient être mobilisés. Nous devons utiliser l'État profond et tous nos moyens de renseignement pour contrer ce problème par tous les moyens nécessaires.»\n\nDes hochements de tête ont retenti dans la salle, tandis que le directeur Casey se levait pour prendre la parole. « Je partage cet avis : nous devrions compter sur un soutien accru de la Western Goals Foundation pour atteindre cet objectif au niveau national.»\n\nLe président McDonald a acquiescé. « Ravi de voir que nous sommes tous d'accord. John, informe le chef du Bureau de la Garde nationale du déploiement et demande-lui d'élaborer un plan. Roy, ton département doit fournir une protection contre cela, trouver une justification légale. Directeur Casey, commence à travailler sur des plans d'infiltration d'agents de la CIA dans les réseaux de trafiquants de drogue nationaux. Allons-y. »"
 McDonaldHess.0.d: "Dans une déclaration publique, le président McDonald a appelé au retour de Rudolf Hess, dirigeant du parti nazi pendant la Seconde Guerre mondiale et vice-Führer, qui avait fui l'Allemagne en 1941 pour la Grande-Bretagne afin de garantir la paix. Jugé et reconnu coupable de crimes contre la paix lors du procès de Nuremberg en 1946, Hess est actuellement inhumé seul à la prison de Spandau, en Allemagne de l'Ouest. La mobilisation pour sa libération est vive depuis la fin des années 1960, sous l'impulsion de son fils, Wolf Rudiger Hess, et a recueilli le soutien de personnalités telles que Geoffery Lawrence, juge britannique lors du procès de Nuremberg, et Willy Brandt, ancien maire de Berlin-Ouest et chancelier de l'Allemagne de l'Ouest. Cependant, toutes les tentatives ont jusqu'à présent été rejetées par les Soviétiques, la prison étant administrée par les quatre puissances alliées. Cette tentative de McDonald, historiquement extrêmement anticommuniste, pourrait toutefois se révéler différente."
 McDonaldHess.1.d: "C'était une journée nuageuse lorsque le président McDonald rencontrait ses principaux conseillers juridiques, dont le procureur général Roy Cohn et le conseiller juridique de la Maison-Blanche Arthur Culvahouse Jr., pour discuter des aspects juridiques de sa déclaration publique concernant le retour de Rudolf Hess.\n\nCohn commença : « Monsieur le Président, après avoir examiné cette proposition de transfert de Rudolf Hess aux États-Unis, mon avis professionnel est que cela est légalement possible, mais que cela pourrait attirer une attention indésirable. »\n\nCulvahouse acquiesça d'un signe de tête. « Oui. Il est évident que les Britanniques et les Français doivent être consultés à ce sujet, mais cela sera présenté comme la libération d'un criminel de guerre, et mon bureau devra être prêt à y faire face lorsque cela se produira inévitablement. »\n\nMcDonald acquiesça. « Très bien. Nous allons poursuivre ce plan. Contactez les ambassadeurs britannique et français, demandez-leur d'informer leurs gouvernements respectifs et de se préparer à une réponse soviétique. Appelez le fils de Hess, faites-lui part de nos intentions. Maintenant, attendons. »"
 McDonaldHess.2.d: "« Dans un rare geste en direction de l'Occident, le secrétaire général soviétique [SOV.GetLeader] a autorisé le Conseil de contrôle allié à libérer Rudolf Hess de la prison de Spandau. Considéré comme une décision risquée au départ, le dernier criminel de guerre nazi partira dans quelques semaines. »\n\nLe titre du Washington Post affichait cet article, accompagné d'une grande photo du visage de Hess. McDonald et Cohn se tenaient dans le Bureau ovale, souriants. Ils avaient gagné. Il était désormais temps de régler l'extradition avec les responsables alliés et de lancer la logistique pour rapatrier Hess aux États-Unis, tout en gérant l'inévitable contrecoup de son propre parti."
 McDonaldHess.3.d: "Sans surprise, la dernière tentative de libération du criminel de guerre nazi Rudolf Hess, sous l'impulsion du président américain Larry McDonald, a été stoppée par l'influence soviétique. Interné à la prison de Spandau, à Berlin-Ouest, administrée par le Conseil de contrôle allié, le représentant soviétique a opposé son veto à toute tentative de libération de Hess, seul occupant de la prison.\n\nRien de plus qu'une simple remarque en page 4 du Washington Post, cette information a embarrassé la Maison-Blanche et le président McDonald, qui, après l'avoir lue, fulminait en silence. Maudits Soviétiques !"
 McDonaldHess.4.d: "Dans un rare geste en faveur de l'Occident, le secrétaire général soviétique [SOV.GetLeader] a autorisé le Conseil de contrôle allié à libérer Rudolf Hess de la prison de Spandau, à Berlin-Ouest. Considéré comme une décision risquée au départ, le dernier criminel de guerre nazi partira dans quelques semaines."
 McDonaldHess.5.d: "Sans surprise, la dernière tentative de libération du criminel de guerre nazi Rudolf Hess, encouragée par le président américain Larry McDonald, a été stoppée par l'influence soviétique. Interné à la prison de Spandau, à Berlin-Ouest, administrée par le Conseil de contrôle allié, le représentant soviétique a opposé son veto à toute tentative de libération de Hess, seul occupant de la prison."
 McDonaldHess.6.d: "Un Boeing 727 plutôt quelconque, arborant les couleurs du Département d'État, a atterri ce soir à l'aéroport international de Washington-Dulles, à la faveur de la nuit, avec à son bord un seul passager important : Rudolf Hess. Sans tambour ni trompette, Hess a été placé dans un Chevrolet Suburban noir et s'est envolé, vraisemblablement pour vivre en paix aux États-Unis."
 McDonaldHess.10.d: "Nous avons été informés par le commandant du Groupe des forces soviétiques en Allemagne (GSFG) et par le Conseil de contrôle allié qu'un appel a été lancé pour libérer le criminel de guerre nazi Rudolf Hess de la prison de Spandau, à Berlin-Ouest, et le faire venir aux États-Unis. Notre gouvernement avait jusqu'alors rejeté toute demande, mais suite à un appel du président américain Larry McDonald, cette demande a fait la une des journaux internationaux, d'autant plus que Hess est malade et seul occupant de la prison de Spandau, dont l'entretien est extrêmement coûteux. Quelle sera notre décision ?"
 McDonald88.10.d: "La stupeur a été vive aux États-Unis aujourd'hui lorsqu'un amendement constitutionnel annulant l'Amendement sur l'égalité des droits a été ratifié par l'assemblée législative de l'Alabama, obtenant ainsi la majorité des deux tiers requise pour son entrée en vigueur. Garantissant initialement l'égalité des droits de tous, notamment contre la discrimination fondée sur le sexe ou l'orientation sexuelle, l'administration de Larry McDonald l'a dénoncé comme contraire aux valeurs familiales américaines traditionnelles."
 McDonald88.11.d: "Un soulagement considérable s'est répandu aujourd'hui aux États-Unis après qu'une session conjointe du Sénat et de la Chambre des représentants a voté à une large majorité contre un projet d'amendement constitutionnel qui aurait abrogé l'amendement sur l'égalité des droits. Proposé par le président Larry McDonald, dont la campagne reposait sur un discours homophobe, ce projet a ravi la communauté gay américaine, en plein essor, aujourd'hui."
 McDonald88.12.d: "Les juristes ont observé avec étonnement aujourd'hui la ratification par l'assemblée législative de Virginie d'un amendement constitutionnel codifiant l'annulation, obtenant ainsi la majorité des deux tiers requise pour sa promulgation. Initialement présentée lors de la crise de l'annulation des années 1830, cette théorie juridique, plus récemment appliquée dans le cadre de la lutte pour la déségrégation, stipule que les États peuvent annuler la législation fédérale s'ils ne sont pas d'accord. Ce précédent, désormais inscrit dans la Constitution, crée une situation juridique confuse aux États-Unis."
 McDonald88.13.d: "Un soulagement considérable s'est répandu aujourd'hui aux États-Unis après qu'une session conjointe du Sénat et de la Chambre des représentants a voté à une large majorité contre un projet d'amendement constitutionnel visant à codifier l'annulation par les États. Proposé par le président Larry McDonald, cet amendement aurait permis aux États d'ignorer la loi fédérale s'ils ne l'approuvaient pas, ce qui aurait créé des questions juridiques complexes."
 Rockefeller75.0.d: "Aujourd'hui à Washington, le président Nelson Rockefeller a annoncé l'un de ses premiers objectifs politiques majeurs : la création d'un groupe de travail sur le contrôle des armes à feu. Par décret signé aujourd'hui, le nouveau Conseil présidentiel pour le contrôle des armes à feu sera composé de représentants de toutes les grandes villes américaines, ainsi que du FBI et d'autres représentants des forces de l'ordre. Alors que cette initiative devrait se heurter à la résistance des fabricants d'armes à feu et de la National Rifle Association, de nombreux républicains et démocrates modérés saluent cette initiative comme un premier pas vers la réduction de la criminalité et de la violence armée aux États-Unis."
 Rockefeller75.1.d: "Lors d'une importante conférence de presse aujourd'hui, le président américain Nelson Rockefeller a présenté le programme « Fair Society » (Société équitable) de son administration. Principalement composé de politiques fédérales héritées de son mandat de gouverneur de l'État de New York, ce programme prévoit une augmentation du nombre de logements sociaux, une législation sur les drogues privilégiant la réhabilitation plutôt que l'incarcération, un renforcement de la législation sur les droits civiques, l'extension des programmes Medicare et Medicaid, et un développement du réseau de transport. S'il est censé séduire la base républicaine progressiste de Rockefeller ainsi que la plupart des démocrates, ce plan pourrait se heurter à une certaine résistance au sein même du Parti républicain, notamment de la part des parlementaires dits « faucons de la dette » de la Chambre des représentants."
 Rockefeller76.1.d: "L'annonce officielle aujourd'hui par la Maison Blanche, lors d'une conférence de presse, du limogeage du secrétaire à la Défense Donald Rumsfeld et du chef de cabinet de la Maison Blanche Dick Cheney n'a guère surpris. Tous deux issus de l'administration Ford, ils étaient restés sous la direction de Rockefeller après son assassinat en septembre 1975. En raison de leurs positions idéologiques de conservateurs plus radicaux, contrastant fortement avec l'aile libérale de Rockefeller au sein du Parti républicain, Rumsfeld et Cheney ont été limogés et devraient rester au sein du Parti républicain, s'alignant principalement sur l'aile Reagan-Bush du parti."
 Rockefeller76.2.d: "Le président américain Nelson Rockefeller a présenté aujourd'hui au Congrès américain une proposition visant à modifier la Constitution afin de mettre fin à la clause dite du « citoyen de naissance », qui stipule que seuls les citoyens américains nés sur le sol américain peuvent se présenter à l'élection présidentielle. Bien que la Constitution ne définisse pas explicitement ce que signifie « citoyen de naissance », cette clause a été largement interprétée comme empêchant les citoyens étrangers d'exercer des fonctions publiques aux États-Unis. Plusieurs amendements constitutionnels ont été introduits à ce sujet, le plus récent datant de 1974, lorsque le représentant Jonathan Brewster Bingham de l'État de New York a présenté un amendement similaire visant à permettre au secrétaire d'État Henry Kissinger d'occuper sa place dans l'ordre de succession présidentielle.\n\nL'opinion publique sur cette question reste incertaine, mais l'amendement doit d'abord être adopté par le Congrès avant que les législatures des États puissent le ratifier."
 Rockefeller76.3.d: "De manière assez choquante, un projet d'amendement constitutionnel visant à supprimer la clause de « citoyen de naissance » de la Constitution américaine a été approuvé par une session conjointe du Sénat et de la Chambre des représentants, puis ratifié par la majorité des deux tiers des États, avec l'adoption de la législature de l'État du New Jersey. Ce changement, qui devrait constituer un changement majeur dans l'éligibilité à la présidence, permettra au secrétaire d'État Henry Kissinger d'être dans l'ordre de succession. Si l'opinion publique est plutôt apathique, la communauté immigrée américaine, en plein essor, est celle qui se fait le plus entendre. Elle se sent désormais valorisée et capable de participer au processus démocratique, même si elle n'est pas née aux États-Unis."
 Rockefeller76.4.d: "Sans surprise, une session conjointe du Sénat et de la Chambre des représentants des États-Unis a de nouveau rejeté catégoriquement un projet d'amendement constitutionnel supprimant la clause de « citoyen de naissance », maintenant le statu quo et interdisant aux citoyens étrangers de se présenter à la présidence ou à d'autres fonctions fédérales. Bien que cela ne soit pas totalement inattendu, la pression en faveur de l'éligibilité a été forte ces derniers temps, mais elle s'est heurtée à l'opposition générale et à l'apathie des Américains moyens ainsi que des républicains radicaux du Congrès."
 Rockefeller76.5.d: "Avec le récent limogeage de Donald Rumsfeld et de Dick Cheney, l'administration Rockefeller et le Parti républicain ont de facto écarté la faction néoconservatrice et radicale reaganienne du parti, parfois appelée la « majorité morale », de tout poste important au sein de l'exécutif. Garantissant une quasi-hégémonie de l'aile libérale du Parti républicain, connue sous le nom de « Républicains responsables », l'administration Rockefeller est assurée de ne rencontrer aucune résistance interne à ses politiques, du moins à la Maison-Blanche."
 Rockefeller76.6.d: "C'était une journée ensoleillée à Washington. Le président Rockefeller se tenait devant le bâtiment du ministère de l'Intérieur, entouré du secrétaire à l'Intérieur Thomas Kleppe, d'autres fonctionnaires du ministère et de membres de la police des parcs nationaux des États-Unis et du Service des parcs nationaux. Debout à la tribune, Rockefeller a pris la parole.\n\n« Bonjour. La conservation est un enjeu crucial pour notre pays, car nos terres sont les plus importantes des États-Unis. En tant que gouverneur de l'État de New York, j'ai étendu le réseau des parcs de l'État, interdit le DDT et protégé les Adirondacks. En tant que président, j'espère faire de même pour notre réseau des parcs nationaux. »"
 Dole80.0.d: "L'Amérique sous la présidence de Robert Dole a véritablement été « plus juste et plus libre ». En quatre ans de mandat, le président Dole a accompli de nombreux objectifs politiques, notamment la signature de l'Americans with Disabilities Act (ADA), la loi la plus vaste et la plus complète à ce jour sur les droits des personnes handicapées ; la signature de plusieurs lois de réforme budgétaire, financière et fiscale ; l'adoption de révisions massives du code pénal américain et l'intensification de la guerre contre la drogue ; l'interdiction de la discrimination positive dans certains programmes fédéraux et, se détournant de ses collègues conservateurs, l'insistance sur l'arrêt Roe comme loi établie. Sur le plan de la politique étrangère, le président Dole a particulièrement mis l'accent sur les liens économiques et commerciaux avec l'Amérique latine, autorisant une multitude de blagues télévisées nocturnes comparant le président Dole à la Dole Fruit Company et aux soi-disant « républiques bananières » d'Amérique centrale.\n\nEn fin de compte, le conservatisme unique de Dole, assorti de clins d'œil à certaines politiques libérales, a donné naissance à une nouvelle Amérique pour les années 1980."
 Dole80.1.d: "Lors d'une conférence de presse aujourd'hui, le président Robert Dole a choqué ses collègues conservateurs en appelant à l'acceptation nationale des résultats de l'arrêt Roe v. Wade comme une loi établie.\n\nInterrogé par les journalistes sur ses précédents votes sur l'avortement, Dole a répondu : « C'est l'une de ces questions très personnelles et délicates que la plupart d'entre nous évitent d'aborder », mais a ajouté : « J'ai un bilan irréprochable en matière de protection des enfants à naître.» Interrogé sur ces points, Dole a tenté de faire marche arrière, ajoutant : « Nous devons toutefois respecter la décision de la Cour suprême de 1973 : elle a tranché, et c'est quasiment une loi établie à ce stade.»\n\nApparaissant comme une énigme sur l'avortement aux yeux de la plupart des républicains, Dole est désormais contesté par des forces internes à son parti qui s'opposent fermement aux résultats de l'arrêt Roe et continuent de faire pression pour une interdiction nationale de l'avortement."
 Dole80.2.d: "Par un décret signé aujourd'hui dans le Bureau ovale, le président Dole a créé la Commission présidentielle sur la réforme réglementaire. Proposée par les administrations conservatrices précédentes, cette nouvelle commission a pour mission d'« évaluer l'impact des réglementations fédérales sur les Américains, de travailler à l'amélioration des réglementations et des procédures, et de recommander les présidents et membres des douze agences fédérales de réglementation, dont la Commission fédérale du commerce, la Commission des valeurs mobilières des États-Unis, le Conseil national des relations du travail et la Commission de la sécurité des produits de consommation ».\n\nLargement saluée par les républicains et les démocrates comme un mécanisme de réforme destiné à supprimer les réglementations obsolètes et, espérons-le, à améliorer la bureaucratie gouvernementale, cette commission devrait être constituée et se réunir dès que possible pour commencer à émettre des directives."
 Dole80.3.d: "Par un décret signé aujourd'hui, le président Dole a officiellement interdit la politique de discrimination positive appliquée aux programmes fédéraux et a supprimé le financement de la Commission pour l'égalité des chances en matière d'emploi. Initialement créée pour lutter contre la discrimination à l'embauche, la politique de discrimination positive a été contrainte par les mouvements de défense des droits civiques et des droits des femmes à étendre cette politique aux discriminations fondées sur la race et le sexe.\n\nActuellement, la discrimination positive est étendue aux pratiques d'embauche au sein de l'administration fédérale, aux entrepreneurs et sous-traitants fédéraux, aux logements fournis par l'État et à de nombreuses pratiques d'admission dans les universités et collèges publics des États-Unis.\n\nLes groupes de défense des droits civiques, dont l'American Civil Liberties Union, ont dénoncé ce décret comme un frein aux progrès, tandis que les partisans de Reagan et la base de Dole au sein du Parti républicain soutiennent fermement cette mesure."
 Dole80.4.d: "Peu après le point de presse du Département d'État d'aujourd'hui, la Maison Blanche a tenu une conférence de presse au cours de laquelle le président Dole a annoncé de nouvelles initiatives commerciales avec l'Amérique latine. Soucieux à la fois de remédier à l'ingérence secrète des États-Unis dans les affaires intérieures latino-américaines et de développer les relations commerciales et économiques américaines dans les Amériques, le président a annoncé un nouveau programme d'aide étrangère, des accords bilatéraux et des missions commerciales, coordonnés avec le Département d'État et le Représentant américain au Commerce, ainsi que par l'intermédiaire de l'Organisation des États américains.\n\nLes réactions des deux côtés ont été globalement positives, non sans une certaine opposition de la part des conservateurs radicaux et des éléments de gauche, qui condamnent tous deux l'ingérence continue des États-Unis en Amérique latine."
 Dole84.1.d: "Lors d'une cérémonie restreinte en présence de quelques journalistes aujourd'hui, le président Dole a déclaré : « Les États-Unis reconnaissent officiellement que la déportation et le massacre des Arméniens de souche par l'Empire ottoman pendant la Première Guerre mondiale constituent un génocide au regard du droit international.» Entourée de survivants du génocide, dont le Dr Hampar Kelikian, orthopédiste de Chicago qui a soigné Dole pour ses blessures pendant la Seconde Guerre mondiale, la cérémonie visait principalement à mettre en valeur et à commémorer les immigrants arméno-américains et les survivants du génocide, qui approchait de son 70e anniversaire.\n\nLes réactions à cette reconnaissance ont été nombreuses, avec des condamnations et des réfutations compréhensibles de la part de la République de Turquie, ainsi que des Démocrates et des Républicains des deux camps, qui estiment qu'une reconnaissance officielle est une perte de temps et que les États-Unis ne devraient pas risquer de s'aliéner un allié de l'OTAN à cause d'événements historiques."
 Dole84.2.d: "Notre ministère des Affaires étrangères nous a informés que les États-Unis, sous la présidence de Robert Dole, ont reconnu la déportation massive et légitime de nationalistes et de terroristes arméniens de notre territoire comme un prétendu « génocide » au regard du droit international. En tant que membre principal de l'OTAN, cette reconnaissance par les États-Unis est absurde, traîtresse et contraire à l'intérêt national de la République sous toutes ses formes. Nous avons déjà adressé des messages fermes à l'ambassade américaine à Ankara, ainsi que des communiqués à notre corps diplomatique, pour protester officiellement contre cette action. Ce ne sera pas la dernière fois que les Américains entendront parler de nous."
 Dole88.1.d: "Durant le premier mandat du président Robert Dole, le paysage américain a été profondément transformé. Plus important encore, quatre ministères ont été entièrement dissous par l'administration Dole : le Commerce, l'Énergie, l'Éducation et le Logement et le Développement urbain. Dole a également opposé son veto au Civil Rights Act de 1990, invoquant des quotas raciaux, et a modifié le Clean Air Act afin de renforcer la réglementation fédérale.\n\nSur le front de la défense, Dole a œuvré pour l'expansion de l'Initiative de défense stratégique (IDS), ainsi que pour le renforcement de la réglementation des armes biologiques et des armes de destruction massive (ADM) ; et, fait tristement célèbre, a déployé la Garde nationale américaine dans la guerre contre la drogue.\n\nSur le plan économique, Dole a œuvré pour un renforcement du contrôle budgétaire et a signé l'Accord de libre-échange nord-américain (ALENA) afin de garantir des avantages économiques mutuels en Amérique du Nord. Surnommée la « Renaissance américaine » par de nombreux experts conservateurs, l'administration Dole laissera un héritage pour les décennies à venir."
 Dole88.2.d: "Lors d'une conférence de presse avec les dirigeants du Congrès aujourd'hui, le président Dole a de nouveau appelé à la présentation d'un amendement à l'équilibre budgétaire lors d'une session conjointe du Congrès. Cet amendement constitutionnel stipulant que les États-Unis ne peuvent pas dépenser plus que leurs recettes annuelles, a déjà été proposé, notamment à la fin des années 1960 et dans les années 1970, lorsque le déficit budgétaire fédéral a refait surface.\n\nCependant, compte tenu des récentes mesures prises par l'administration Dole pour limiter le gaspillage des dépenses publiques et de l'adoption de plusieurs projets de loi de réforme budgétaire, le Congrès américain pourrait être davantage enclin à adopter cet amendement constitutionnel."
 NAFTA.1.d: "Lors d'une conférence de presse télévisée donnée aujourd'hui depuis la Maison-Blanche, le président [USA.GetLeader], entouré de son secrétaire d'État, a annoncé son intention d'accélérer les négociations sur un accord de libre-échange nord-américain (ALENA). Prévu comme un accord de libre-échange entre les États-Unis, le Canada et le Mexique, les premières négociations ont débuté, mais n'ont pas encore abouti à de réels progrès. Il est envisagé qu'avec des négociations appropriées et une opinion publique suffisamment favorable, l'accord puisse finalement être conclu."
 NAFTA.2.d: "Aux États-Unis, l'annonce par le président de son intention de conclure un accord de libre-échange nord-américain avec le Canada et le Mexique a récemment suscité soutien et opposition. De nombreux partisans évoquent la nécessité d'un libre-échange accru dans un monde en pleine modernisation et en plein développement technologique, notamment avec les voisins directs des États-Unis au nord et au sud. Cependant, de nombreux opposants, notamment les conservateurs en matière de fiscalité, invoquent les problèmes inhérents à cet accord, tels que la baisse des recettes douanières, la complexité des réglementations commerciales et douanières, la propagation de la drogue aux États-Unis et la délocalisation d'emplois vers le Mexique et le Canada, qui entraîne un ralentissement économique.\n\nL'opinion publique américaine, interrogée, semble plutôt divisée sur cette question, mais les négociations sur l'ALENA semblent se poursuivre."
 NAFTA.3.d: "Le Premier ministre [CAN.GetLeader] a reçu une proposition de l'ambassadeur des États-Unis à Ottawa, lui transmettant un message du président [USA.GetLeader] concernant la possible création d'un accord de libre-échange nord-américain (ALENA) entre les États-Unis, le Canada et le Mexique.\n\nSi notre gouvernement est généralement favorable à cette idée, la population canadienne s'y oppose fermement, notamment lors des dernières élections de 1988 et de l'accord de libre-échange Canada-États-Unis, signé en 1987 et plutôt controversé. Les conseillers économiques et les ministres de notre gouvernement ont clairement établi que le pays pourrait bénéficier d'un tel accord, mais nous devons garder à l'esprit la volonté du peuple, ainsi que notre souveraineté et nos intérêts nationaux. Comment devrions-nous réagir ?"
 NAFTA.4.d: "Nous avons été informés par le Cabinet du Premier ministre à Ottawa et par l'ambassade du Canada à Washington que le gouvernement canadien a accepté nos offres initiales de négociation d'un Accord de libre-échange nord-américain (ALENA), dont la signature d'un cadre de base sera bientôt définie. Le Premier ministre [CAN.GetLeader] s'est entretenu par téléphone avec le Président [USA.GetLeader] et lui a exprimé ses meilleurs vœux pour les négociations futures autour de cet accord."
 NAFTA.5.d: "Malheureusement, l'ambassadeur du Canada à Washington a fait savoir au premier ministre [CAN.GetLeader] à Ottawa que le gouvernement canadien ne participerait pas aux négociations sur l'Accord de libre-échange nord-américain. L'ambassadeur des États-Unis à Ottawa a tenté de modifier sa position sur la question, en vain. Il s'agit d'un revers temporaire pour notre politique étrangère et économique, mais nous nous en remettrons."
 NAFTA.6.d: "Le président [MEX.GetLeader] a reçu une proposition de l'ambassadeur des États-Unis à Mexico, transmettant un message du président américain [USA.GetLeader] concernant la possible conclusion d'un accord de libre-échange nord-américain (ALENA) entre les États-Unis, le Canada et le Mexique.\n\nNotre gouvernement souhaite attirer davantage d'investissements étrangers, notamment américains, suite à la crise de la dette latino-américaine du début des années 1980. Il doit toutefois veiller à ne pas trop lier son économie à celle des États-Unis, au cas où nous deviendrions dépendants de leur économie. De plus, notre intérêt national, notre souveraineté et la volonté du peuple doivent être pris en compte dans cette décision. Comment allons-nous réagir ?"
 NAFTA.7.d: "Nous avons été informés par la présidence de Mexico et l'ambassade du Mexique à Washington que le gouvernement mexicain a accepté nos premières propositions de négociation d'un accord de libre-échange nord-américain (ALENA), dont la signature sur un cadre de base sera prochainement définie. Le président mexicain [MEX.GetLeader] s'est entretenu par téléphone avec le président américain [USA.Get Leader] et lui a exprimé ses meilleurs vœux pour les négociations futures autour de cet accord."
 NAFTA.8.d: "Malheureusement, l'ambassadeur du Mexique à Washington a fait savoir par le président mexicain [MEX.GetLeader] à Mexico que le gouvernement mexicain ne participerait pas aux négociations sur l'Accord de libre-échange nord-américain. L'ambassadeur des États-Unis à Mexico a tenté de modifier sa position sur la question, en vain. Il s'agit d'un revers temporaire pour notre politique étrangère et économique, mais nous nous en remettrons."
 NAFTA.9.d: "Aujourd'hui, un cadre de négociation pour un Accord de libre-échange nord-américain (ALENA) a été signé simultanément à Washington, Ottawa et Mexico, par le président américain [USA.GetLeader], le premier ministre canadien [CAN.GetLeader] et le président mexicain [MEX.GetLeader]. Salué comme un objectif majeur de la politique étrangère américaine, ce cadre ouvrira la voie aux futures négociations entre les trois gouvernements sur les détails du commerce, des douanes, des tarifs douaniers et d'autres sujets d'intérêt économique. Les partisans de l'ALENA se réjouissent de l'espoir de retombées économiques, tandis que les opposants au futur projet continuent de se plaindre des pertes d'emplois au profit de pays étrangers et de la complexité des réglementations commerciales."
 NAFTA.10.d: "Sans surprise, des sources internes aux négociations de l'ALENA font état d'une détérioration rapide des négociations et des progrès entre les trois parties concernant un éventuel accord de libre-échange nord-américain. Les trois parties – les États-Unis, le Canada et le Mexique – semblent insatisfaites les unes des autres sur les détails concernant les douanes, les déplacements transfrontaliers, la circulation des emplois et l'élimination des droits de douane.\n\nEn particulier, le chapitre 11 proposé de l'ALENA permet aux entreprises de poursuivre n'importe lequel des trois pays pour obtenir réparation en cas de violation du droit international ; cette mesure est particulièrement dénoncée par des groupes au Canada et aux États-Unis.\n\nLes membres de la délégation mexicaine craignent également que certains articles de la Constitution mexicaine relatifs aux terres autochtones et à la privatisation ne soient abrogés pour parvenir à un accord.\n\nLes négociations ne devraient pas se poursuivre, chaque délégation se retirant dans sa capitale pour consulter son gouvernement sur cette question."
 NAFTA.100.d: "Alors que de nombreux décideurs politiques américains avaient exprimé un soutien sans faille au projet d'Association de libre-échange nord-américaine (ALENA), le président [USA.GetLeader] a annoncé son opposition totale à cette proposition. Il a évoqué les préoccupations des syndicats, notamment celles des Travailleurs unis de l'automobile (UAW), ainsi que les potentiels problèmes environnementaux et de droits humains liés au Mexique.\n\nLes réactions à cette annonce ont été mitigées : les syndicats ont salué cette initiative, la considérant comme une défense des travailleurs américains, tandis que les groupes d'intérêt des entreprises et d'éminents politiciens et économistes favorables au libre-échange ont critiqué cette initiative, la qualifiant de complaisance envers les syndicats en échange de votes. Il convient également de noter que l'éminent milliardaire Ross Perot a salué cette initiative, la considérant comme une défense des intérêts économiques américains, mettant fin aux spéculations sur une éventuelle candidature présidentielle en 1992."
 AEFTA.1.d: "Aujourd'hui, lors d'une conférence de presse avec le secrétaire d'État et le secrétaire au Commerce, le président [USA.GetLeader] a annoncé le début de négociations qui devraient durer des mois en vue d'un accord de libre-échange entre les États-Unis et les membres de l'Association européenne de libre-échange (AELE), qui comprend l'Autriche, la Finlande, l'Islande, la Norvège, la Suède et la Suisse. Considérées comme une avancée supplémentaire vers les relations économiques avec l'Europe, des négociations fructueuses avec l'AELE entraîneraient la suppression des barrières commerciales et des droits de douane entre ces pays membres, qui ont conclu des accords de libre-échange. Sur le plan national, cette évolution semble bénéficier d'un large soutien auprès de la plupart des Américains qui en sont informés, la grande majorité d'entre eux étant généralement indifférente aux implications futures."
 AEFTA.2.d: "Le Premier ministre [ICE.GetLeader] a reçu une proposition de l'ambassadeur des États-Unis à Reykjavik, transmettant un message du président américain [USA.GetLeader], concernant la possible création ou l'extension d'un accord de libre-échange américano-européen avec les pays membres de l'AELE. L'Islande étant fière d'en être membre depuis 1970, il serait dans notre intérêt d'accepter l'offre américaine, d'autant plus que notre économie est largement liée à l'AELE et à la Communauté économique européenne. Cependant, certains membres de l'aile gauche de notre gouvernement estiment que nous ne devrions pas nous lier volontairement à la sphère d'influence américaine pour l'instant. Comment allons-nous réagir ?"
 AEFTA.3.d: "Nous avons été informés par le cabinet du Premier ministre à Reykjavik et par l'ambassade d'Islande à Washington que le gouvernement islandais a accepté nos premières offres de négociation d'un accord de libre-échange américano-européen, dont la signature sur un cadre de base sera prochainement définie. Le Premier ministre islandais [ICE.GetLeader] s'est entretenu par téléphone avec le président américain [USA.Get Leader] et lui a exprimé ses meilleurs vœux pour les négociations futures autour de cet accord."
 AEFTA.4.d: "Malheureusement, l'ambassadeur d'Islande à Washington a fait savoir par le Premier ministre islandais [ICE.GetLeader] à Reykjavik que le gouvernement islandais ne participerait pas aux négociations sur un accord de libre-échange américano-européen. L'ambassadeur des États-Unis à Reykjavik a tenté de modifier sa position sur la question, en vain. Il s'agit d'un revers temporaire pour notre politique étrangère et économique, mais nous nous en remettrons."
 AEFTA.5.d: "Le Premier ministre [NOR.GetLeader] a reçu une proposition de l'ambassadeur des États-Unis à Oslo, transmettant un message du président américain [USA.GetLeader], concernant la possible création ou l'élargissement d'un accord de libre-échange américano-européen avec les pays membres de l'AELE. Fière membre fondateur de l'AELE et de l'OTAN, la Norvège entretient des relations particulièrement étroites avec l'Europe et les États-Unis. N'ayant pas ratifié son adhésion à la Communauté économique européenne, elle se trouve confrontée à une nouvelle orientation dans le contexte économique émergent. Cependant, certains membres de notre gouvernement mettent en garde contre un rattachement accru au système économique américain et un éloignement accru de l'Europe. Comment allons-nous réagir ?"
 AEFTA.6.d: "Nous avons été informés par le cabinet du Premier ministre à Oslo et par l'ambassade de Norvège à Washington que le gouvernement norvégien a accepté nos premières offres de négociation d'un accord de libre-échange américano-européen, dont la signature sur un cadre de base sera prochainement définie. Le Premier ministre norvégien [NOR.GetLeader] s'est entretenu par téléphone avec le président américain [USA.Get Leader] et lui a exprimé ses meilleurs vœux pour les négociations futures autour de cet accord."
 AEFTA.7.d: "Malheureusement, l'ambassadeur de Norvège à Washington a fait savoir par le Premier ministre norvégien [NOR.GetLeader] à Oslo que le gouvernement norvégien ne participerait pas aux négociations sur un accord de libre-échange américano-européen. L'ambassadeur des États-Unis à Oslo a tenté de modifier sa position sur la question, en vain. Il s'agit d'un revers temporaire pour notre politique étrangère et économique, mais nous nous en remettrons."
 AEFTA.8.d: "Le président du Conseil fédéral suisse a reçu une proposition de l'ambassadeur des États-Unis à Berne, transmettant un message du président américain [USA.GetLeader], concernant la possible création ou l'extension d'un accord de libre-échange américano-européen avec les pays membres de l'AELE. Si la Suisse entretient généralement de bonnes relations avec les États-Unis, elle reste globalement en dehors de l'ordre international libéral habituel, n'étant pas membre de l'ONU mais accueillant le siège de nombreuses agences onusiennes. La Suisse est un membre fondateur de l'AELE, mais ses relations avec les autres pays européens et l'Occident ont été globalement bénéfiques, non sans quelques difficultés dues à notre politique de neutralité. Nombre de membres du gouvernement saluent ce nouvel accord proposé comme une nouvelle forme de développement économique, tandis que d'autres, plus traditionalistes, plaident pour un maintien de l'équilibre dans les relations européennes et dénoncent les dangers d'un rattachement au système économique américain. Comment allons-nous réagir ?"
 AEFTA.9.d: "Nous avons été informés par la Chancellerie fédérale à Berne et l'ambassade de Suisse à Washington que le gouvernement suisse a accepté nos premières offres de négociation d'un accord de libre-échange américano-européen, dont la signature sur un cadre général sera prochainement définie. Plusieurs membres du Conseil fédéral suisse se sont entretenus par téléphone avec le président américain [USA.Get Leader] et lui ont exprimé ses meilleurs vœux pour la suite des négociations autour de cet accord."
 AEFTA.10.d: "Malheureusement, l'ambassadeur de Suisse à Washington a fait savoir, depuis le Conseil fédéral suisse à Berne, que le gouvernement suisse ne participerait pas aux négociations sur un accord de libre-échange américano-européen. L'ambassadeur des États-Unis à Berne a tenté de modifier sa position sur la question, en vain. Il s'agit d'un revers temporaire pour notre politique étrangère et économique, mais nous nous en remettrons."
 AEFTA.11.d: "Le Premier ministre [FIN.GetLeader] a reçu une proposition de l'ambassadeur des États-Unis à Helsinki, transmettant un message du président américain [USA.GetLeader], concernant la possible création ou l'extension d'un accord de libre-échange américano-européen avec les pays membres de l'AELE. La Finlande, adhérente relativement récente à l'AELE et au paysage européen en général, en raison de sa proximité avec l'Union soviétique, a récemment exploré une politique d'orientation occidentale. Cependant, certains responsables politiques indépendants et de gauche de notre gouvernement ont exprimé des inquiétudes quant à l'élargissement des liens avec les États-Unis, notamment en raison de la proximité avec l'Union soviétique et de la crainte d'une asservissement économique. Comment allons-nous réagir ?"
 AEFTA.12.d: "Nous avons été informés par le cabinet du Premier ministre à Helsinki et par l'ambassade de Finlande à Washington que le gouvernement finlandais a accepté nos premières offres de négociation d'un accord de libre-échange américano-européen, dont la signature sur un cadre de base sera bientôt définie. Le Premier ministre finlandais s'est entretenu par téléphone avec le président américain [USA.Get Leader] et lui a exprimé ses meilleurs vœux pour les négociations futures autour de cet accord."
 AEFTA.13.d: "Malheureusement, l'ambassadeur de Finlande à Washington a fait savoir par le biais du Premier ministre finlandais [FIN.GetLeader] à Helsinki que le gouvernement finlandais ne participerait pas aux négociations sur un accord de libre-échange américano-européen. L'ambassadeur des États-Unis à Helsinki a tenté de modifier sa position sur la question, en vain. Il s'agit d'un revers temporaire pour notre politique étrangère et économique, mais nous nous en remettrons."
 AEFTA.14.d: "Le chancelier fédéral [AUS.GetLeader] a reçu une proposition de l'ambassadeur des États-Unis à Vienne, transmettant un message du président américain [USA.GetLeader], concernant la possible création ou l'extension d'un accord de libre-échange américano-européen avec les pays membres de l'AELE. L'Autriche est restée globalement neutre, jouant la carte de l'inaction pendant la Guerre froide, et est restée globalement pro-occidentale, étant occupée par les puissances occidentales dans les années d'après-guerre et limitrophe de l'Allemagne de l'Ouest. Cependant, certains membres du gouvernement protestent contre une éventuelle conclusion d'un accord de libre-échange avec les États-Unis, soulignant l'importance de la neutralité dans ce contexte sécuritaire émergent. Comment allons-nous réagir ?"
 AEFTA.15.d: "Nous avons été informés par la Chancellerie fédérale de Vienne et l'ambassade d'Autriche à Washington que le gouvernement autrichien a accepté nos premières offres de négociation d'un accord de libre-échange américano-européen, dont la signature sur un cadre général sera prochainement définie. Le chancelier autrichien [AUS.GetLeader] s'est entretenu par téléphone avec le président américain [USA.Get Leader] et lui a exprimé ses meilleurs vœux pour les négociations futures autour de cet accord."
 AEFTA.16.d: "Malheureusement, l'ambassadeur d'Autriche à Washington a fait savoir par la voix du chancelier autrichien [AUS.GetLeader] à Vienne que le gouvernement autrichien ne participerait pas aux négociations sur un accord de libre-échange américano-européen. L'ambassadeur des États-Unis à Vienne a tenté de modifier sa position sur la question, en vain. Il s'agit d'un revers temporaire pour notre politique étrangère et économique, mais nous nous en remettrons."
 AEFTA.17.d: "Le Premier ministre [SWE.GetLeader] a reçu une proposition de l'ambassadeur des États-Unis à Stockholm, transmettant un message du président américain [USA.GetLeader], concernant la possible création ou l'extension d'un accord de libre-échange américano-européen avec les pays membres de l'AELE. Les relations entre la Suède et les États-Unis ont été tendues ces dernières années avec le déclenchement de la guerre du Vietnam, mais se sont progressivement réchauffées dans les années 1980. Comme dans de nombreux autres pays nordiques, une part importante du gouvernement est favorable à la conclusion de cet accord commercial, ou à une neutralité et à une implication limitée dans les affaires occidentales. Comment allons-nous réagir ?"
 AEFTA.18.d: "Nous avons été informés par le cabinet du Premier ministre à Stockholm et par l'ambassade de Suède à Washington que le gouvernement suédois a accepté nos premières offres de négociation d'un accord de libre-échange américano-européen, dont la signature sur un cadre de base sera prochainement définie. Le Premier ministre suédois [SWE.GetLeader] s'est entretenu par téléphone avec le président américain [USA.Get Leader] et lui a exprimé ses meilleurs vœux pour les négociations futures autour de cet accord."
 AEFTA.19.d: "Malheureusement, l'ambassadeur de Suède à Washington a fait savoir par le Premier ministre suédois [SWE.GetLeader] à Stockholm que le gouvernement suédois ne participerait pas aux négociations sur un accord de libre-échange américano-européen. L'ambassadeur des États-Unis à Stockholm a tenté de modifier sa position sur la question, en vain. Il s'agit d'un revers temporaire pour notre politique étrangère et économique, mais nous nous en remettrons."
 AEFTA.20.d: "Aujourd'hui, à Washington, les délégués de tous les pays membres de l'AELE signataires ont signé l'Accord de libre-échange américano-européen. Largement salué par le président américain [USA.GetLeader] comme une avancée majeure du libre-échange entre les États-Unis et l'Europe, cet accord a suscité inquiétude et consternation tant chez les membres européens de la CEE que dans le bloc de l'Est en général, qui craignent une influence persistante de l'Occident et des États-Unis en Europe."
 Robertson88.3.t: "[GetNewspaperHeader] Le président Robertson annonce une purge de la bureaucratie « libérale »"
 Robertson88.0.d: "Depuis l'investiture du président Pat Robertson le 20 janvier 1989, beaucoup a été accompli aux États-Unis au cours de ces quatre années. D'une part, trois ministères exécutifs – le Département d'État, l'Éducation et l'Énergie – ont été purgés ou dissous afin d'éliminer la « bureaucratie libérale » ; plusieurs lois importantes du Congrès ont été opposées à leur veto, notamment l'Americans With Disabilities Act, le Civil Rights Act de 1990 et un projet de loi de financement de la lutte contre le sida ; mais certaines ont été adoptées, comme l'interdiction de la pornographie, la loi sur le dépassement de la compétence de la Cour fédérale, la loi sur la modernisation de la défense et un projet d'amendement sur le droit à la vie. Robertson a également réintroduit la prière dans les écoles publiques et autorisé les bons d'études pour les écoles religieuses privées. Dans le domaine de la défense, l'administration Robertson a intensifié la guerre contre la drogue, adopté la loi antiterroriste sur les armes biologiques et intensifié la militarisation de la police. De nombreux experts et historiens considèrent désormais le mandat de Robertson comme l’ère de « l’Amérique morale », et l’avenir des États-Unis après ce président est incertain."
 Robertson88.1.d: "Lors d'une annonce sans précédent faite aujourd'hui à la Maison Blanche, le président Pat Robertson a annoncé la signature d'un décret prévoyant une « rationalisation efficace du Département d'État » par des suppressions d'emplois de 40 à 50 %. Ce décret comprend des membres du service diplomatique américain, mais principalement des fonctionnaires basés à Washington et du personnel non essentiel à l'étranger.\n\nDécrié par les deux camps comme une mesure irresponsable de la politique étrangère américaine, notamment pendant la période tendue de la Guerre froide, l'administration du président Robertson est restée largement muette sur ce point, à l'exception d'une déclaration dans laquelle Robertson a déclaré que « notre corps diplomatique est vaste, inefficace, inutile et corrompu jusqu'à la moelle par des progressistes, des communistes et d'autres sympathisants anti-américains qui cherchent à nous affaiblir »."
 Robertson88.2.d: "Lors d'une conférence de presse aujourd'hui à la Maison Blanche, le président Pat Robertson a annoncé le soutien de son administration à un amendement à la Constitution des États-Unis relatif au « droit à la vie ». Constituant le cœur des propositions politiques pro-vie issues de l'arrêt Roe v. Wade de 1973, également connu sous le nom d'« amendement sur la vie humaine », cet amendement codifierait la définition juridique de la vie humaine comme commençant à la conception et interdirait explicitement l'avortement dans la Constitution.\n\nConfronté à de vives critiques et à la pression des démocrates et des partisans du droit à l'avortement, Robertson les a qualifiés de « communistes tueurs d'enfants » et a exprimé son plein soutien au vote d'un amendement, qui devrait intervenir prochainement au Congrès."
 Robertson88.3.d: "Lors d'une cérémonie télévisée depuis le Bureau ovale aujourd'hui, le président Pat Robertson a signé un décret ordonnant « un mécanisme d'efficacité immédiate au sein de l'administration fédérale » en supprimant, sous 30 jours, 45 % des emplois administratifs au sein du gouvernement fédéral, principalement à Washington D.C. et dans les antennes de certaines agences à travers les États-Unis.\n\nQualifiée par les groupes progressistes de « purge » contre des institutions bureaucratiques indispensables, telles que l'Internal Revenue Service et l'Agence de protection de l'environnement, cette mesure est saluée par les conservateurs et les partisans de Robertson comme une étape majeure pour empêcher les excès de l'État et rationaliser les postes et fonctions nécessaires au sein de l'administration fédérale. Cependant, près d'un million de fonctionnaires fédéraux au chômage ont tendance à ne pas être d'accord, car ils trouvent de nouveaux emplois dans une Amérique post-Robertson."
 Robertson88.5.d: "DE : Cabinet exécutif du Président\nÀ : Conseiller juridique de la Maison-Blanche ; Procureur général, Département de la Justice des États-Unis ; Directeur du FBI\n\nOBJET : Ouverture d'enquêtes sur les groupes féministes et libéraux\n\nÀ toutes les personnes concernées,\n\nLa menace que représentent les forces féministes, libérales, communistes, socialistes et anarchistes dans notre pays est particulièrement dangereuse, en cette nouvelle ère d'une « Amérique morale » où la famille nucléaire américaine et ses valeurs chrétiennes traditionnelles risquent d'être exploitées.\n\nJ'ordonne à toutes les parties, et en particulier au FBI et à tous les autres services fédéraux de police et de renseignement, d'entamer des enquêtes approfondies et une surveillance des groupes suivants :\n\nUnion américaine pour les libertés civiles (ACLU)\nOrganisation nationale des femmes (NOW)\nLigue des électrices (LWV)\nCentre juridique pour la pauvreté du Sud (SPLC)\nFreedom House\nOrganisation socialiste internationale (ISO)\nComité national démocrate (DNC)\n\nUne surveillance et des enquêtes secrètes doivent être menées sur ces organisations. Tous les documents, enregistrements et autres supports sont classés confidentiels en vertu de la loi sur l'espionnage et resteront sous la garde du ministère de la Justice et de toutes les agences fédérales concernées.\n\nSIGNATURE\nPrésident Pat Robertson"
 Robertson88.6.d: "Des rapports récents de personnalités au sein des principaux mouvements féministes américains, notamment l'Organisation nationale des femmes et la Ligue des électrices, font état de graves problèmes internes et de cohésion. Une présence policière légèrement accrue autour des réunions de NOW et de LWV, en particulier celles des membres de haut rang, a été constatée par certains membres et responsables de ces organisations ; et des membres du personnel de maintenance ont constaté de légers dommages aux châssis de fenêtres, aux systèmes informatiques et aux téléphones des bureaux nationaux. L'origine de ces tensions et de ces problèmes reste incertaine, mais un phénomène très suspect se produit au sein du mouvement féministe."
 Robertson88.7.d: "Dernière minute aujourd'hui : une fuite soudaine d'informations par un membre du personnel du ministère de la Justice auprès du procureur général a révélé une campagne d'espionnage menée par le gouvernement américain contre des organisations féministes et progressistes aux États-Unis. Approuvée par le président Robertson et pilotée par le FBI et le ministère de la Justice, une note divulguée évoquait « la menace des forces féministes, progressistes, communistes, socialistes et anarchistes dans notre pays » et précisait la surveillance et le contrôle d'organisations telles que la National Organization for Women (NOW) et la Convention nationale démocrate. Initialement publiée dans le New York Times, cette information a été relayée par d'autres grands journaux nationaux et internationaux, malgré le silence total de la Maison-Blanche et du ministère de la Justice."
 Robertson88.8.d: "Quelques jours après les premières allégations d'espionnage gouvernemental contre des organisations libérales et féministes aux États-Unis, de nouvelles questions ont surgi quant à ce que le président Pat Robertson savait réellement des détails de l'opération. La note initiale, qui a fuité, était signée de sa main, confirmant l'autorisation présidentielle pour l'espionnage, mais de nombreux conservateurs et sympathisants continuent de se demander si Robertson était réellement au courant ou si cette campagne était une décision unilatérale du procureur général et du directeur du FBI. Pour l'instant, peu de choses ont été révélées, mais la cote de popularité du président a chuté de 5 points cette semaine, reflétant la déception manifeste du peuple américain face à cette nouvelle."
 Reagan_VRA.1.d: "Dans une annonce inattendue faite aujourd'hui, le président Ronald Reagan a appelé à l'expiration du Voting Rights Act de 1965. Ce texte législatif majeur, important pour le mouvement des droits civiques des années 1960 et interdisant l'utilisation de « tests ou dispositifs » pour contrôler les votes, a été réautorisé en 1975 et devrait à nouveau expirer cette année, en 1982. L'administration Reagan est restée largement silencieuse sur cette question jusqu'à présent, mais la présence d'amendements à la VRA à la Chambre des représentants a attiré l'attention de la Maison-Blanche. Il est clair que la plupart des groupes de défense des droits civiques, dont la NAACP et la Leadership Conference on Civil Rights, émettront des condamnations, mais la plupart des experts s'accordent à dire que cette saga ne fait que commencer."
 Reagan_VRA.2.d: "Suite à l'annonce par la Maison-Blanche du refus de l'administration Reagan de renouveler la loi sur le droit de vote de 1965, la réaction publique a été vive, avec des condamnations du Comité national démocrate, de l'Association nationale pour l'avancement des personnes de couleur, de l'Union américaine pour les libertés civiles, de la Ligue des électrices et de l'Organisation nationale des femmes, ainsi que de nombreuses autres organisations de défense des droits civiques. La Maison-Blanche n'a toujours pas communiqué, et après l'annonce de Reagan, elle est restée plutôt silencieuse, demandant aux journalistes d'adresser leurs questions au Congrès. Cependant, de nombreux proches du président ont des idées et des opinions divergentes sur la marche à suivre : certains soutiennent que la reconduction devrait être rejetée, tandis que d'autres exhortent le président à signer et à céder aux pressions politiques du Congrès. Quel choix Reagan fera-t-il ?"
 Reagan_VRA.3.d: "Aujourd'hui, dans un geste inattendu de la Maison Blanche, le président Ronald Reagan a renoncé à sa lutte contre la loi sur le droit de vote de 1965, signant plutôt une prolongation de dix ans. Vraisemblablement sous la forte pression publique des organisations de défense des droits civiques et du droit de vote, Reagan a accédé à leur volonté et à celle du Congrès en signant la prolongation de la loi."
 Reagan_VRA.4.d: "Faisant fi de la volonté populaire et sans surprise pour la plupart des experts politiques, le président Ronald Reagan a poursuivi sa croisade contre la loi sur le droit de vote de 1965 en opposant son veto au projet de loi de renouvellement décennal et aux amendements qui lui avaient été présentés. Suscitant de nouvelles condamnations de la part des organisations de défense des droits civiques et du droit de vote, Reagan subit une pression écrasante, non seulement de la part de l'opinion publique, mais aussi de membres du Congrès et de son propre parti qui, malgré leurs divergences d'idéologie politique, souhaitent le maintien de la loi sur le droit de vote."
 Reagan_VRA.5.d: "En réponse au veto du président Reagan à la réautorisation du Voting Rights Act de 1965, le Congrès a mis en place une procédure de contournement de veto, conformément à l'article I, section VII de la Constitution, afin de faire adopter ce projet de loi sans passer par la Maison-Blanche. Il est encore trop tôt pour connaître les marges de vote finales, mais avec un soutien suffisant, le VRA pourrait survivre un jour de plus."
 Reagan_VRA.6.d: "Il semble qu'après un vote final au Sénat américain, la loi de réautorisation de la loi sur le droit de vote de 1965, visant à prolonger ses dispositions de dix ans supplémentaires, ait été adoptée avec plus des deux tiers des voix des deux chambres du Congrès. Suite au veto initial du président Ronald Reagan, le projet de loi est revenu au Congrès, où son veto a été annulé. Combiné à un tollé général envers la Maison Blanche, cet événement sert d'avertissement à l'administration Reagan : il ne faut pas s'en prendre aux autres pouvoirs du gouvernement."
 Reagan_VRA.7.d: "Malheureusement, une tentative de veto visant à annuler la réautorisation du Voting Rights Act de 1965 a échoué aujourd'hui au Congrès, recueillant moins des deux tiers des voix requises. Suite au veto rapide du président Ronald Reagan, le Congrès a tenté de contrer le projet de loi en l'adoptant malgré tout, mais n'a pas obtenu les voix requises. L'indignation publique a été générale, ciblant tant la Maison Blanche que le Capitole, plusieurs branches du gouvernement étant tenues responsables de la mort certaine du Voting Rights Act, dont les dispositions expirent dans quelques mois."
 Gingrich88.1.d: "Dans une déclaration officielle de la Maison Blanche aujourd'hui, le président Newt Gingrich a annoncé une proposition d'amendement à la Constitution américaine visant à limiter la durée des mandats au Congrès. Ancien représentant républicain du 3e district de Géorgie à la Chambre des représentants, Gingrich conserve une influence considérable au Capitole malgré le transfert de son bureau à la Maison Blanche. Des informations provenant du Congrès confirment qu'une résolution de la Chambre a été présentée, limitant spécifiquement la durée des mandats à deux pour les sénateurs et à six pour les membres de la Chambre, ce qui porte à douze le nombre maximum d'années de service. Le mouvement en faveur de la limitation des mandats aux États-Unis est relativement récent et, comme cet amendement doit être adopté par le Congrès lors d'une session conjointe, il est difficile de savoir si de nombreux sénateurs et représentants élus y seraient favorables, car il pourrait entraîner la perte de leurs fonctions pour certains d'entre eux. Cependant, les premiers sondages d'opinion suggèrent que de nombreux Américains moyens sont satisfaits de cette annonce."
 Gingrich88.2.d: "Lors d'une annonce sans précédent faite aujourd'hui à la Maison Blanche, le président Newt Gingrich a annoncé la signature d'un décret prévoyant une « rationalisation efficace du Département d'État » par la suppression de 40 à 50 % des effectifs du département, y compris les membres du Service extérieur américain, mais principalement le personnel administratif basé à Washington ainsi que le personnel non essentiel à l'étranger.\n\nDécriée par les deux camps comme une mesure irresponsable de la politique étrangère américaine, notamment pendant la période tendue de la Guerre froide, l'administration du président Gingrich est restée largement muette sur les commentaires. On sait que le président, surtout lorsqu'il siégeait au Congrès, n'était pas très favorable à la politique étrangère en général, mais les experts s'en étonnent généralement, tout comme les milliers d'employés du gouvernement fédéral qui ont été informés de leur licenciement aujourd'hui."
 Gingrich88.3.d: "Dans une déclaration officielle de la Maison Blanche aujourd'hui, le président Newt Gingrich a annoncé une proposition d'amendement à la Constitution américaine visant à abolir le Collège électoral. Présenté simultanément à la Chambre des représentants, cet amendement prévoit l'application d'un système similaire à celui de la France, selon lequel le seuil requis pour remporter la présidence est de 40 % des suffrages exprimés et, si aucun candidat n'obtient 40 %, un second tour serait organisé. Cet amendement modifierait radicalement la structure et le fonctionnement du système politique américain, notamment en permettant à plus de deux partis de concourir lors d'une élection. Un amendement similaire avait été proposé lors de la session 1969-1970 du Congrès, mais avait été rejeté par les États du Sud, craignant une perte d'influence. On ignore si cette attitude a évolué au sein du Congrès, mais les premiers sondages d'opinion révèlent des sentiments mitigés, la plupart des électeurs étant favorables à cette idée."
 Gingrich88.4.d: "Une proposition inhabituelle a été présentée aujourd'hui par la Maison Blanche, le président Newt Gingrich dévoilant une nouvelle arme dans sa lutte contre la criminalité : les miroirs orbitaux. Avec l'aide plutôt timide du Bureau de la politique scientifique et technologique et de l'administrateur de la NASA, Gingrich a publié une proposition prévoyant le déploiement de milliers de miroirs orbitaux, conçus pour être manœuvrés afin d'exploiter les sources lumineuses du Soleil et d'éclairer les villes américaines la nuit. La proposition de Gingrich avance l'argument selon lequel la criminalité diminuerait si les zones métropolitaines et les autoroutes étaient éclairées en permanence. Les médias et le grand public ont saisi cette nouvelle illustration de dépenses irresponsables, et cela fera assurément la une des journaux des prochaines semaines. Dans un communiqué officiel, la Maison Blanche ne plaisante pas, affirmant qu'avec l'approbation du Congrès, elle espère faire avancer le projet avec force."
 Kemp88.1.d: "Aujourd'hui, lors d'une conférence de presse à la Maison-Blanche, le président Jack Kemp a appelé à un amendement à la Constitution américaine exigeant l'équilibre du budget fédéral. Ancien député de la circonscription de Buffalo (New York) et de ses environs, Kemp a maintes fois insisté sur sa politique budgétaire, notamment lors de sa campagne. Fort de son influence auprès des Républicains à la Chambre, il semble avoir une chance de voir cet amendement aboutir. La réaction du public à cette annonce a été globalement positive, des organisations comme la National Taxpayers Union (NTS) soutenant la proposition de Kemp. On ignore toutefois si et quand une résolution d'amendement sera soumise au Congrès, mais sous la pression de la Maison-Blanche, cela pourrait arriver très prochainement."
 Kemp88.2.d: "Aujourd'hui, depuis le Bureau ovale, entouré de ses secrétaires d'État et au Commerce, le président Jack Kemp a annoncé aux journalistes son intention de créer une zone de libre-échange du Pacifique, composée des États-Unis et de sept autres pays, dont le Japon, la Corée du Sud, l'Australie et la Nouvelle-Zélande. Bien qu'inédite, cette initiative constitue un événement sans précédent, notamment dans le contexte de la croissance économique croissante en Asie. L'opinion publique est mitigée sur le sujet, la plupart des Américains restant généralement indifférents, leur principale préoccupation étant les emplois et les produits disponibles. De nombreux internationalistes libéraux, notamment ceux qui s'occupent des affaires de la région Asie-Pacifique, saluent cette initiative, la considérant comme une nouvelle étape dans la bonne direction pour le commerce extérieur et le développement économique."
 Kemp88.3.d: "Kemp était assis dans le Bureau ovale, feuilletant ses briefings quotidiens, lorsque son secrétaire d'État, Benjamin Gilman, intervint. Ancien député de New York et membre de longue date de la commission des affaires étrangères de la Chambre, Gilman était un excellent choix pour le poste de secrétaire d'État, ayant travaillé aux Nations Unies et œuvré pour la libération des prisonniers de guerre américains à l'étranger.\n\nJetant deux chemises en papier kraft sur le bureau Resolute, Gilman serra la main de Kemp et lui demanda comment allait la Première dame Joanne Kemp. Baissant les yeux, Kemp aperçut les chemises, les releva et demanda : « Qu'est-ce que c'est, Ben ?»\n\n« Monsieur, ce sont des propositions de libre-échange avec l'Europe ; soit la CEE, soit l'AELE. Le secrétaire au Commerce et le représentant américain au Commerce ont également donné leur avis.»\n\n« Excellent. Parlons-en. Quels sont les coûts et les avantages ? »\n\n« Eh bien, Monsieur, travailler avec la Communauté économique européenne serait l'option la plus évidente, car cela ouvrirait les échanges avec l'Allemagne, la France, le Royaume-Uni et l'Europe du Sud, mais cela se heurterait à une forte pression et à une forte opposition de la part des groupes de gauche au sein de ces gouvernements, qui considèrent nos politiques commerciales comme une forme d'impérialisme économique supplémentaire.»\n\nLes deux hommes ricanèrent presque simultanément. Gilman poursuivit :\n\n« Cependant, nous pourrions choisir l'opprimé. L'Association européenne de libre-échange est composée de pays européens plus neutres, dont les pays nordiques et la Suisse, qui ont des pratiques commerciales plus libérales. Nous pourrions exploiter des marchés plus petits et les soutenir, avec la promesse implicite qu'ils auraient un meilleur accès aux produits américains que le reste de la CEE.»\n\nKemp se laissa aller dans son fauteuil, pensif. « Ben, je vais être honnête avec toi, c'est une décision difficile, mais je pense que nous devons choisir… »"
 Kemp88.4.d: "Le porte-parole de la Maison Blanche et le porte-parole du département d'État ont confirmé aujourd'hui que l'administration Kemp, en coopération avec les départements d'État, du Commerce et le représentant américain au Commerce, avait l'intention d'entamer des négociations avec la Communauté économique européenne (CEE) en vue d'un accord de libre-échange. Initialement connu sous le nom d'accord de libre-échange États-Unis-CEE, ce projet d'accord éliminerait toutes les restrictions commerciales entre les États-Unis et les membres de la CEE, notamment les puissances économiques que sont l'Allemagne de l'Ouest, la France, le Royaume-Uni, l'Italie et les pays du Benelux. Contacté pour une déclaration, le cabinet du président de la Commission européenne, Jacques Delors, a réagi positivement, indiquant une volonté d'entamer des négociations malgré les pressions internes exercées par les partis de gauche de certains pays membres. L'opinion publique américaine est favorable, la plupart des experts en politique étrangère qualifiant cet accord d'évolution significative dans les relations américano-européennes modernes."
 Kemp88.5.d: "Le porte-parole de la Maison Blanche et le porte-parole du département d'État ont confirmé aujourd'hui que l'administration Kemp, en coopération avec les départements d'État, du Commerce et le représentant américain au Commerce, avait l'intention d'entamer des négociations avec l'Association européenne de libre-échange (AELE) en vue d'un accord de libre-échange. Initialement connu sous le nom d'Accord de libre-échange États-Unis-AELE, ce projet éliminerait toutes les restrictions commerciales entre les États-Unis et les membres de l'AELE, dont de nombreux pays neutres comme la Suisse et l'Autriche, ainsi que de nombreux pays nordiques comme la Suède. Contacté pour une déclaration, le secrétaire général de l'AELE, Georg Reisch, a répondu positivement, exprimant sa surprise mais une certaine volonté de poursuivre les négociations, malgré la neutralité annoncée de nombreux membres de l'AELE. L'opinion publique américaine est mitigée, beaucoup s'interrogeant sur les raisons pour lesquelles le président a choisi les petits pays européens plutôt que la CEE, plus puissante. De nombreux experts en politique étrangère, cependant, voient encore d'importants avantages à ces négociations et à l'avenir du libre-échange américain."
 Dole84.2.t: "L'Amérique a reconnu le soi-disant « génocide arménien »"
 Nuclear_Freeze.0.d: "Aujourd'hui, les États-Unis ont annoncé leur engagement à geler toute production, tout essai et tout déploiement d'armes nucléaires. Cette annonce a surpris nombre de nos analystes, qui s'attendaient presque tous à ce que les États-Unis maintiennent le déploiement nucléaire comme élément clé de leurs forces armées. Une forte pression internationale s'exerce désormais sur nous pour que nous prenions le même engagement, sous prétexte que cela réduirait les tensions entre nos nations et pourrait favoriser un monde de coexistence pacifique. Cependant, certains de nos conseillers les plus intransigeants se montrent méfiants, doutant de l'engagement total des États-Unis en faveur d'un gel nucléaire, soulignant que les États-Unis pourraient encore disposer d'un seul sous-marin chargé de suffisamment de missiles pour détruire toutes nos grandes villes."
 Nuclear_Freeze.1.d: "Aujourd'hui, le président [USA.GetLeader] a annoncé que les États-Unis s'engageaient à geler tous leurs essais, leur production et leur déploiement d'armes nucléaires. Cette annonce a surpris de nombreux citoyens, et apparemment même le Kremlin, car les États-Unis se retrouveraient alors en position de désavantage stratégique face à l'Union soviétique. Les conservateurs et de nombreux politiciens bellicistes ont critiqué cette annonce, la qualifiant de préjudiciable à la sécurité nationale. Certains membres du Congrès opposés à cette proposition se sont également engagés à adopter un projet de loi exigeant le déploiement d'armes nucléaires sur le sol américain. Le président a également exprimé l'espoir que l'Union soviétique égalerait l'offre américaine, la qualifiant d'excellente occasion de mettre de côté nos craintes et notre méfiance mutuelles, tout en rendant le monde plus sûr."
 Nuclear_Freeze.2.d: "Nous avons été informés par le Kremlin que l'Union soviétique a accepté un gel de ses activités nucléaires, comme le nôtre. Une grande partie du pays se réjouit de cette annonce, un nombre record d'Américains interrogés déclarant que le risque de guerre nucléaire est inexistant ou faible. La communauté internationale a également réagi positivement, reconnaissant à nos deux nations d'avoir contribué à rendre le monde plus sûr. Si la plupart de notre cabinet se réjouit de la situation actuelle, le conseiller à la sécurité nationale [GetCurrentNatSecAdv] a proposé d'équiper un ou deux sous-marins d'ogives nucléaires, afin de servir de moyen de dissuasion d'urgence en cas de première frappe soviétique surprise. Bien que cette politique ne soit pas encore en vigueur, nous avons établi un ensemble de conditions qui permettraient d'amorcer un réarmement limité si la situation l'exigeait."
 Nuclear_Freeze.3.d: "Le Kremlin n'a pas respecté notre engagement en faveur d'un gel nucléaire, ce qui rend notre action actuelle peu convaincante aux yeux du Congrès. Des appels à un déploiement d'armes nucléaires, mandaté par le Congrès, ont déjà été lancés, et une majorité du pays s'inquiète actuellement de la vulnérabilité des États-Unis à une première frappe soviétique. Bien que nous ne pensions pas devoir abandonner cette politique, le ministère de la Défense a élaboré de nouvelles conditions, stipulant que tout passage des forces armées américaines au niveau DEFCON 3 ou inférieur devrait entraîner un réarmement nucléaire limité dans les zones concernées. Malheureusement, un monde dénucléarisé semble encore hors de portée."
 Nuclear_Freeze.5.d: "Le Kremlin a annoncé aujourd'hui l'arrêt du déploiement, des essais et de la production d'armes nucléaires, conformément à l'annonce faite par le président américain [USA.GetLeader] il y a quelques semaines. Les Nations Unies ont salué la collaboration des deux pays sur cette question importante, le Secrétaire général déclarant qu'un nouvel ordre mondial pacifique se profilait à l'horizon. Le Bulletin of the Atomic Scientist a également apporté son soutien aux actions des deux pays, annonçant que l'horloge de l'Apocalypse serait réglée à minuit moins 25, soit le temps le plus éloigné de l'anéantissement total depuis la création de l'agence en 1947. Les États-Unis se sont également montrés plutôt réceptifs à la nouvelle, le président [USA.GetLeader] remerciant le Secrétaire général soviétique et affirmant qu'un nouvel avenir sans nucléaire était en vue."
 Nuclear_Freeze.6.d: "Le Kremlin a annoncé aujourd'hui qu'il ne s'engagerait pas à geler le déploiement, les essais et la production de missiles nucléaires. Le secrétaire général soviétique a condamné cette proposition, la jugeant irrationnelle et laissant l'Union soviétique sans défense face à une première frappe secrète des États-Unis. Le président [USA.GetLeader] a exprimé sa déception face à l'annonce du Kremlin, affirmant que les Soviétiques ratent une occasion en or de rétablir la paix dans ce nouvel ordre mondial. Le secrétaire à la Défense [GetCurrentSecDef] a également déclaré aujourd'hui que les États-Unis pourraient être amenés à réévaluer leur position actuelle, suite au rejet du gel par l'URSS. De nombreux membres du Congrès ont vivement critiqué le président, affirmant que si les États-Unis ne revenaient pas sur leur politique actuelle, il exposerait des millions d'Américains au risque d'une annihilation nucléaire."
 Nuclear_Freeze.10.d: "Le président Askew a annoncé aujourd'hui son projet de redéploiement des armes nucléaires et sa demande au Congrès d'autoriser le financement d'une nouvelle classe d'armes nucléaires pour remplacer notre arsenal vieillissant. Le président affirme avoir pris sa décision sur les conseils des chefs d'état-major interarmées, de son secrétaire à la Défense et du directeur de la CIA, Anthony Lake, qui estimaient que les Soviétiques constituaient toujours une menace sérieuse pour nous et que le réarmement nucléaire rétablirait la sécurité de l'Amérique. Certains progressistes ont condamné aujourd'hui le président Askew, le qualifiant de belliciste et de ruinant des années de travail de dénucléarisation du pays. La plupart des politiciens et membres du Congrès conservateurs ont soutenu Askew, affirmant qu'il rétablissait un élément clé de la défense de notre pays et que ces nouvelles armes nucléaires nous donneraient un net avantage sur les Soviétiques. Le Kremlin a condamné la déclaration du président, la qualifiant de provocatrice et ne faisant que nuire à l'espoir de paix mondiale des deux nations. Les Nations Unies et le Bulletin atomique des scientifiques ont condamné cette mesure, affirmant que le président Askew laisse une peur irrationnelle ramener le monde au bord de l'annihilation nucléaire."
 Nuclear_Freeze.11.d: "Nous avons appris aujourd'hui que les États-Unis ont levé le gel nucléaire que nos deux nations s'étaient engagées à respecter et ont commencé le redéploiement de leurs armes nucléaires à travers le monde. La plupart des membres du parti sont profondément indignés par la trahison américaine et nous ont appelés à abandonner nos propres obligations et à entreprendre nos propres essais et déploiements. Lorsque nous avons interpellé l'ambassadeur américain au sujet du réarmement, il a affirmé que les Soviétiques eux-mêmes avaient trahi leur engagement et que l'Amérique avait besoin de l'arme nucléaire pour sa propre protection. Si le maintien du gel nous placerait dans une position nettement désavantageuse si les États-Unis attaquaient les premiers, le réengagement nous offrirait une victoire morale et internationale majeure sur les États-Unis, susceptible de provoquer des frictions au sein de l'OTAN et d'autres alliances américaines."
 Nuclear_Freeze.12.d: "L'URSS a annoncé aujourd'hui la levée du gel actuel sur tous les essais, la production et le déploiement d'armes nucléaires, après que le président américain [USA.GetLeader] a annoncé le redéploiement de l'arsenal nucléaire américain. L'Atomic Bulletin of Scientists a exprimé sa déception envers les deux nations, affirmant que les deux dirigeants ont laissé la méfiance et la peur ruiner la paix pour le nouveau monde. De nombreux parlementaires démocrates ont imputé la levée du gel nucléaire par le président il y a quelques semaines aux nouvelles tensions qui ont submergé les deux pays. La Maison Blanche a répondu à ces accusations en affirmant que les Soviétiques déployaient déjà secrètement des missiles à tête nucléaire dans leurs sous-marins et certains silos IRBM."
 Nuclear_Freeze.13.d: "L'Union soviétique a surpris le monde aujourd'hui en maintenant son gel actuel des essais, de la production et du déploiement nucléaires, après que les États-Unis ont choisi de reprendre leurs essais nucléaires et de réapprovisionner leurs silos et sous-marins en ogives nucléaires. La Maison Blanche n'a fait aucun commentaire sur la poursuite de cette politique par l'URSS, affirmant que la politique nucléaire de l'Union soviétique la concernait. Les Nations Unies et l'Atomic Bulletin of Scientists ont salué la politique de l'Union soviétique et ont exigé que les États-Unis reviennent au gel de leur réarmement actuel. Les stratèges militaires de groupes de réflexion comme la RAND sont perplexes face à cette décision, car elle place les Soviétiques en net désavantage militaire si les États-Unis tentaient une première frappe. Quelles que soient les raisons du Kremlin, le soutien international est de mise, tandis que la condamnation de la renucléarisation américaine se renforce."
