l_english:
 Dem_1980_Primary.1.d: "Au grand plaisir de nombreux démocrates, le sénateur Ted Kennedy a annoncé qu'il défierait le président Jimmy Carter lors des primaires démocrates pour représenter le parti lors des prochaines élections présidentielles. La décision de défier un président en exercice a certainement peu de parallèles dans l'histoire politique américaine. Le sénateur a pris cette décision après avoir consulté sa famille. Les analystes notent que Kennedy croit que l'héritage et le mysticisme de sa famille surmonteront de manière décisive l'avantage que le président Carter pourrait avoir en tant qu'incumbent. Une source proche de Kennedy a indiqué que le sénateur n'avait aucune confiance dans la manière dont le président Carter gouvernait, soulignant sa faible cote de popularité."
 Dem_1980_Primary.2.d: "Le sénateur Ted Kennedy et ses principaux conseillers tiennent des discussions sur la manière d’aborder les médias. Tous reconnaissent que ce sera un défi difficile de battre un président en exercice. Le premier défi est une interview à venir avec le respecté journaliste politique de CBS, Ted Mudd. L’interview aura lieu trois jours avant l’annonce officielle de la candidature. Tous sont d'accord sur le fait que le sénateur doit continuer à susciter l'anticipation pour maximiser l'enthousiasme parmi les démocrates avant l'annonce officielle. Le sénateur et les principaux membres de son équipe sont enclins à utiliser l’interview pour teaser l’électorat, préparant ainsi le terrain pour l’annonce officielle. Cependant, d’autres conseillers suggèrent que le sénateur utilise l’interview pour exposer son programme et sa vision, afin de démontrer sa détermination présidentielle. Toutefois, cela pourrait affaiblir l'impact historique de l'annonce officielle. Après une discussion intense, une décision a été prise…"
 Dem_1980_Primary.3.d: "L'interview du sénateur Ted Kennedy par le respecté journaliste de CBS, Ted Mudd, est devenue un véritable désastre pour le prétendant à la présidence. Lorsque le journaliste a interrogé le sénateur sur les raisons pour lesquelles il voulait devenir président, Ted Kennedy est apparu mal à l'aise et répétitif. Le sénateur a également semblé mal préparé lorsqu'on lui a posé des questions sur l'incident notoire de Chappaquiddick. Les critiques ont noté que le sénateur répondait aux questions de manière assez vague. Les sondages réalisés après l'interview montrent une chute brutale de la popularité du sénateur, car de nombreux Américains ne le considèrent pas comme un véritable héritier du mysticisme des Kennedy. En privé, les conseillers du sénateur admettent que l'interview ne s'est pas déroulée comme prévu et que les efforts pour utiliser cette interview afin de susciter de l'anticipation pour l'annonce officielle n'ont pas eu l'impact escompté auprès du public."
 Dem_1980_Primary.4.d: "L'interview du sénateur Ted Kennedy par le respecté journaliste de CBS, Ted Mudd, s'est terminée par un énorme succès pour le prétendant à la présidence. Lorsque le journaliste a poussé le sénateur à expliquer pourquoi il voulait devenir président, Ted Kennedy a fait preuve de détermination, exposant ses critiques à l'encontre du président Carter et ses propres qualifications pour le plus haut poste du pays. Bien qu'il ait eu quelques difficultés lorsqu'on lui a posé des questions sur l'incident notoire de Chappaquiddick, les critiques ont souligné que Kennedy s'était exprimé comme un Kennedy. Les sondages réalisés après l'interview montrent un regain de popularité pour le sénateur, et les analystes estiment que le président Jimmy Carter fait face à une campagne primaire difficile. L'annonce officielle du sénateur Kennedy devrait avoir lieu dans les jours à venir."
 Dem_1980_Primary.5.d: "Le président Jimmy Carter a débuté la campagne des primaires démocrates de 1980 par une victoire retentissante lors des caucus de l'Iowa. Cette victoire constitue un coup dur pour son challenger, le sénateur Ted Kennedy, qui se retrouve confronté à la tâche ardue de battre un président en exercice. Les analystes soulignent que cette victoire confère au président légitimité et élan avant les prochains concours des primaires. Ils notent également que le sénateur Kennedy peine à captiver l'imagination des électeurs démocrates, en raison de ses apparitions peu marquantes. De nombreux démocrates du système établi ont également montré une tendance à soutenir le président Carter, estimant que le parti ne peut se permettre de perdre l'avantage d'un président en exercice. Malgré ce revers, le sénateur Kennedy est resté défiant, affirmant que sa campagne ne ferait que se renforcer dans les semaines à venir. Les deux camps continueront clairement à mener une campagne agressive l'un contre l'autre."
 Dem_1980_Primary.6.d: "Le sénateur Ted Kennedy a été annoncé comme le gagnant des caucus de l'Iowa, débutant ainsi la campagne des primaires démocrates par une victoire initiale. La défaite du président Carter va ébranler son soutien, notamment parmi les démocrates de l'establishment, car son statut d'incumbent n'a pas suffi à contrer le défi du fougueux sénateur du Massachusetts. Le président Jimmy Carter n'a pas exprimé de préoccupations, soulignant que la compétition avait été serrée et qu'il était confiant que, finalement, le peuple américain se rallierait à lui. Un sénateur Kennedy jubilant a remercié ses partisans, promettant d'utiliser l'élan acquis dans l'Iowa pour obtenir une victoire historique. Les deux camps continueront clairement à mener une campagne agressive l'un contre l'autre."
 Dem_1980_Primary.7.d: "Le président Jimmy Carter a remporté les primaires du New Hampshire. Le président jubilant a déclaré que ce résultat était une indication claire de son mandat. Les analystes soulignent que cette victoire renforcera le soutien en faveur du président parmi les démocrates de l'establishment, car elle a eu lieu en Nouvelle-Angleterre, la principale base de la dynastie Kennedy. Le challenger, le sénateur Ted Kennedy, est resté confiant, notant que les résultats étaient serrés et promettant de ne pas abandonner la lutte. Quoi qu'il en soit, la campagne des primaires démocrates continuera d'être une compétition âprement disputée, d'État en État."
 Dem_1980_Primary.8.d: "Le sénateur Ted Kennedy a remporté les primaires du New Hampshire. Le sénateur semblait ravi, remerciant chaleureusement son équipe et ses partisans. Il a continué à souligner que le peuple américain était engagé dans une transition historique pour restaurer la confiance dans le Parti démocrate. Le président Jimmy Carter est resté serein et confiant, affirmant que la campagne des primaires ne faisait que commencer et qu'une fois tous les démocrates entendus, les résultats lui seraient favorables. Malgré cette confiance publique, des proches du président ont exprimé leur inquiétude quant à l'affaiblissement du soutien des démocrates de l'establishment, dont le soutien sera crucial."
 Dem_1980_Primary.9.d: "Alors que les dirigeants et les délégués du Parti démocrate arrivent à New York pour la Convention nationale démocrate, les yeux de la nation seront rivés sur eux. Cette convention devrait opposer le président sortant Jimmy Carter et son adversaire, le sénateur Ted Kennedy, à l'investiture présidentielle. Le sénateur Kennedy a lancé une campagne agressive pendant la campagne primaire, ce qui a donné lieu à des affrontements acharnés entre lui et le président Carter. De nombreux dirigeants démocrates seraient déçus par cette campagne acharnée, estimant qu'elle a érodé le capital politique des deux candidats potentiels. Dès le début de la convention, les partisans des deux candidats s'entretiendront avec les délégués et les personnalités influentes pour obtenir l'investiture."
 Dem_1980_Primary.10.d: "Des nouvelles du Madison Square Garden confirment que le président Jimmy Carter a remporté l'investiture du Parti démocrate à la présidence des États-Unis. Ceci met fin à une campagne primaire difficile, au cours de laquelle le président sortant a dû faire face à une opposition acharnée du sénateur Ted Kennedy. On ignore encore si le sénateur a félicité le président. Les dirigeants du Parti démocrate espèrent désormais que le parti pourra se rallier au président Carter, dans l'attente d'une campagne sans doute acharnée contre le candidat républicain. Le président a remercié les délégués et a exhorté les sympathisants du parti à se rassembler."
 Dem_1980_Primary.11.d: "Le sénateur Ted Kennedy a prononcé son discours de concession lors de la Convention nationale démocrate au Madison Square Garden. Ce discours est considéré comme le plus important de sa carrière. Kennedy a défendu avec nostalgie et sans complexe le libéralisme d'après-guerre et les programmes gouvernementaux, et a appelé à la création d'un système national d'assurance maladie. Soulignant que même si les programmes étaient inefficaces, « l'idéal d'équité perdure toujours ». Il a critiqué la vision républicaine et félicité le président Jimmy Carter. Il a conclu son discours en citant un poème cher à ses aînés, qu'il a conclu par la phrase mémorable : « Le rêve ne mourra jamais ». La foule l'a interrompu par des applaudissements plus de cinquante fois. Malgré ce discours percutant, les critiques ont noté que le sénateur Kennedy n'apportait pas un soutien ferme au président Carter et critiquait implicitement ses opinions modérées. Il semble que le Parti démocrate restera partagé quant à son adhésion profonde à ses valeurs libérales."
 Dem_1980_Primary.12.d: "Malgré la force historique des dirigeants démocrates sortants et de l'establishment, le sénateur Ted Kennedy a battu le président Jimmy Carter et a été nommé candidat démocrate à la présidence. Durant une campagne primaire difficile, Kennedy a réussi à rallier le soutien des démocrates grâce à son adhésion aux valeurs libérales. Les experts politiques voient dans la victoire de Kennedy la défaite du pouvoir démocrate modéré sur le parti. Le président Carter l'a gracieusement concédé, même si, en privé, ses proches conseillers se disent stupéfaits par cette défaite. Les dirigeants démocrates profitent désormais de la convention pour établir un front uni en vue de la campagne nationale. Il est clair que l'élection de 1980 sera une bataille culturelle entre libéralisme et conservatisme."
 Dem_1980_Primary.13.d: "Le sénateur Ted Kennedy a prononcé son discours d'acceptation à la Convention nationale démocrate au Madison Square Garden. Ce discours est considéré comme le plus important de sa carrière à ce jour. Kennedy a défendu avec nostalgie et sans complexe le libéralisme d'après-guerre et les programmes gouvernementaux, et a appelé à la création d'un système national d'assurance maladie. Soulignant que même si les programmes étaient inefficaces, « l'idéal d'équité perdure toujours ». Il a critiqué la vision républicaine et promis de ne jamais transiger sur une vision libérale pour la nation. Il a félicité le président Jimmy Carter pour sa généreuse concession. Pour conclure, il a cité un poème cher à ses vénérés aînés, concluant par la phrase mémorable : « Le rêve ne mourra jamais ». La foule l'a interrompu par des applaudissements plus de cinquante fois. La victoire du sénateur Kennedy montre que l'aile libérale du Parti démocrate a désormais supplanté l'establishment modéré."
