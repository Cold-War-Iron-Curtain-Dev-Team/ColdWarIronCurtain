 sov_turkey_in_nato.3.t: "La Turquie refuse de se plier à nos exigences"
 sov_turkey_in_nato.3.desc: "Le mépris flagrant d’Ankara pour nos intérêts en matière de sécurité constitue une provocation directe à l’égard de l’influence légitime de l’Union soviétique dans la région de la mer Noire. En rejetant nos exigences, la Turquie renforce la présence de l’alliance occidentale sur notre flanc sud. Alors que certaines voix au sein du Kremlin réclament une démonstration de force immédiate, d’autres mettent en garde contre le risque de déclencher une crise qui pourrait dégénérer en une nouvelle catastrophe mondiale. L'avenir de la domination régionale soviétique — et l'équilibre des pouvoirs — est en jeu."
 sov_turkey_in_nato.3.a: "Exige que le gouvernement turc se retire immédiatement !"
 sov_turkey_in_nato.3.b: "Fais marche arrière, ça ne vaut pas le risque d'une troisième guerre mondiale."
 sov_turkey_in_nato.2.t: "Les Soviétiques nous ordonnent de ne pas adhérer à l'OTAN."
 sov_turkey_in_nato.2.desc: "Notre nation se trouve à un tournant décisif. Adhérer à l’OTAN, c’est s’assurer des alliances et le soutien militaire de l’Occident, mais c’est aussi prendre le risque de provoquer la colère de l’Union soviétique, qui a lancé un avertissement sans équivoque contre toute nouvelle dérive vers l’influence occidentale. Le souvenir des ravages de la Seconde Guerre mondiale est encore vif ; nous devons décider si nous voulons protéger notre souveraineté en nous alignant sur l’OTAN ou préserver des relations prudentes avec Moscou en accédant à ses exigences. L’une ou l’autre de ces voies pourrait façonner le destin de la Turquie pour des générations."
 sov_turkey_in_nato.2.a: "Accéder à leurs demandes et annoncer notre retrait aux Américains."
 sov_turkey_in_nato.2.b: "Restez tranquilles, les Soviétiques sont trop faibles pour exiger quoi que ce soit !"
 sov_turkey_in_nato.1.t: "La Turquie rejoint l'OTAN !"
 sov_turkey_in_nato.1.desc: "Au mépris de nos avertissements clairs, le gouvernement turc a pris une mesure provocatrice en signant son engagement envers l'alliance de l'OTAN. Les responsables politiques occidentaux saluent l'adhésion de la Turquie comme un succès stratégique dans la lutte contre l'influence soviétique. Au Kremlin, l'alerte est donnée : nombreux sont ceux qui y voient une menace directe pour nos frontières et la stabilité régionale. Nos dirigeants doivent désormais décider s'ils souhaitent réagir avec fermeté, en exigeant un retrait immédiat de l'OTAN, ou s'ils préfèrent rechercher une solution diplomatique afin d'éviter une confrontation totale."
 sov_turkey_in_nato.1.a: "Exigez leur retrait immédiat de l'OTAN."
 sov_turkey_in_nato.1.b: "Nous ne pouvons pas prendre le risque d'une guerre, essayons de négocier avec eux."
 sov_german_question.1.t: "La question allemande"
 sov_german_question.1.desc: "Pour l’Union soviétique, l’avenir de l’Allemagne dépasse le simple cadre politique : il s’agit de l’héritage de la Grande Guerre patriotique et des sacrifices consentis par notre peuple. Nous avons une occasion unique d’influencer le cours des événements en Allemagne de l’Ouest, afin de garantir qu’elle ne représente plus jamais une menace pour notre patrie ni ne remette en cause les victoires que nous avons remportées en 1945. Si une ingérence directe risque d’exacerber les tensions avec les puissances occidentales, ne rien faire pourrait permettre aux forces réactionnaires de se reconstituer et de nous encercler de régimes hostiles. Chaque décision a de graves conséquences pour notre position sur la scène internationale."
 sov_german_question.1.a: "Notre ingérence dans la politique ouest-allemande pourrait bouleverser tout l'équilibre des forces de l'après-guerre."
 sov_percentage_agreement.1.t: "Les accords de pourcentage"
 sov_percentage_agreement.1.desc: "Au cours des dernières phases de la Grande Guerre patriotique, nos dirigeants ont négocié des accords secrets avec la Grande-Bretagne afin de délimiter des sphères d'influence. Aujourd’hui, il est clair que les puissances occidentales n’ont pas respecté ces accords, s’ingérant dans des territoires qui relèvent de plein droit de la protection soviétique. Devons-nous continuer à reconnaître ces engagements dans l’espoir de préserver la paix, ou devons-nous les rejeter entièrement et soutenir nos camarades communistes en Grèce, où l’ingérence impérialiste menace l’essor du socialisme ? Cette décision déterminera le rôle de l’Union soviétique dans la construction du monde d’après-guerre."
 sov_percentage_agreement.1.a: "Respectez les accords, même si ce sont les Britanniques qui les ont rompus les premiers."
 sov_percentage_agreement.1.b: "Les accords sont déjà rompus, aidons nos frères communistes en Grèce !"
