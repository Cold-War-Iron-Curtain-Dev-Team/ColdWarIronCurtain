 SOV_ECON_Launch_the_Liberman_Plan: "Lancer la réforme Liberman"
 SOV_ECON_Launch_the_Liberman_Plan_desc: "La réforme économique soviétique, parfois appelée « réforme Kosygin » ou « réforme Liberman », est un ensemble de changements planifiés visant l'économie de l'URSS. L'un des éléments centraux de ces changements est l'introduction de la rentabilité et du chiffre d'affaires comme deux indicateurs clés de la réussite des entreprises. Une partie des bénéfices d'une entreprise était affectée à trois fonds destinés à récompenser les travailleurs et à développer les activités ; la majeure partie était versée au budget central."
 SOV_ECON_Reduce_the_Amount_of_Policy_Targets: "Réduire le nombre d'objectifs stratégiques"
 SOV_ECON_Reduce_the_Amount_of_Policy_Targets_desc: "Le nombre d'objectifs stratégiques doit être ramené de 30 à 9. Ces neuf grands objectifs sont les suivants : la production totale aux prix de gros courants ; les principaux produits en unités physiques ; la masse salariale totale ; les bénéfices totaux et la rentabilité, exprimée sous forme de ratio des bénéfices par rapport aux immobilisations et au fonds de roulement normalisé ; les versements au budget et les crédits budgétaires ; les objectifs d'investissement total en capital pour l'introduction de nouvelles technologies ; et le volume d'approvisionnement en matières premières et en équipements."
 SOV_ECON_Expand_the_Central_Mathematical_Institute: "Développer l'Institut central de mathématiques économiques"
 SOV_ECON_Expand_the_Central_Mathematical_Institute_desc: "L'Institut central d'économie et de mathématiques (en russe : Центральный экономико-математический институт (ЦЭМИ)) de l'Académie russe des sciences est un institut de recherche économique situé à Moscou. Il se consacre à la théorie économique, à l'économie mathématique et à l'économétrie. Nous prévoyons actuellement de l'étendre à Tallinn et à Leningrad."
 SOV_ECON_Encourage_Enterprise_Independence: "Encourager l'autonomie des entreprises"
 SOV_ECON_Encourage_Enterprise_Independence_desc: "Avec cette réforme, les entreprises sont tenues de définir précisément la gamme et la variété de leurs produits, d'investir leurs propres fonds dans la production, de conclure des accords contractuels à long terme avec leurs fournisseurs et leurs clients, et de déterminer les effectifs nécessaires."
 SOV_ECON_Re_Centralize_Macro_Management: "Recentraliser la gestion macroéconomique"
 SOV_ECON_Re_Centralize_Macro_Management_desc: "Ce plan prévoit une planification centrale plus détaillée et plus scientifique, comprenant notamment des objectifs annuels."
 SOV_ECON_Forecast_Results_with_Computer_Systems: "Prévision des résultats à l'aide de systèmes informatiques"
 SOV_ECON_Forecast_Results_with_Computer_Systems_desc: "Pour planifier l'économie plus efficacement, nous devons nous aider de l'informatique."
 SOV_ECON_Set_the_8th_Five_Year_Budget: "Adopter le budget du 8e plan quinquennal"
 SOV_ECON_Set_the_8th_Five_Year_Budget_desc: "Le budget du 8e plan quinquennal s'élèvera à 310 milliards de roubles, dont la répartition est définie de manière moins détaillée qu'auparavant."
