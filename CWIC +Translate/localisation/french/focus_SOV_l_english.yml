 SOV_BREZHNEV_Inaugurate_the_Collective_Leadership_desc: "Le Présidium, qui en était venu à mal voir le style de direction de Khrouchtchev et craignait la domination autocratique de Mao Zedong ainsi que le culte de la personnalité grandissant en République populaire de Chine, lança une campagne virulente contre Khrouchtchev en 1963. Cette campagne aboutit en 1964 au remplacement de Khrouchtchev à ses fonctions de premier secrétaire par Leonid Brejnev et de président du Conseil des ministres par Alexeï Kossyguine. Brejnev et Kossyguine, ainsi que Mikhaïl Souslov, Andreï Kirilenko et Anastas Mikoyan, furent élus à leurs fonctions respectives pour former et diriger une direction collective opérationnelle."
