 SOV_UST.1.t: "Réélection du secrétaire général Dmitri Oustinov"
 SOV_UST.1.d: "Le XXIVe Congrès du Parti a confirmé Dmitri Fiodorovitch Oustinov au poste de secrétaire général pour un second mandat, prolongeant ainsi son mandat et consolidant la domination de l'aile militaro-industrielle et technico-administrative du Parti.\nNé à Samara en 1908 dans une famille ouvrière, Oustinov a adhéré au Parti communiste en 1927 et a gravi les échelons en tant qu'ingénieur et organisateur industriel. Diplômé de l’Institut d’ingénierie mécanique militaire (1934), il est devenu directeur de l’usine d’armement bolchevique avant d’être nommé commissaire du peuple à l’armement pendant la Grande Guerre patriotique. Son évacuation réussie des industries de défense de Leningrad vers l’Oural lui a valu le titre de Héros du travail socialiste. Après 1945, il a supervisé la saisie de la technologie balistique allemande, des scientifiques et des actifs industriels, jetant ainsi les bases de l’industrie spatiale soviétique et des systèmes d’armes de pointe.\nAprès avoir occupé les fonctions de secrétaire du Comité central chargé du complexe militaro-industriel (1965-1971) et de ministre de la Défense jusqu’en 1971, la réélection d’Oustinov marque la continuité et l’accélération du programme de cybernisation lancé sous Lazar Kaganovitch. Son nouveau mandat met l’accent sur l’automatisation, la planification assistée par ordinateur, la cybernétique et l’intégration de systèmes de contrôle numériques dans l’industrie, la défense et l’administration publique."
 SOV_UST.1.a: "Longue vie au camarade Oustinov !"
 SOV_UST.6.t: "Élection de Nikolai Ogarkov au poste de secrétaire général."
 SOV_UST.6.d: "Le Soviet suprême et le Congrès du Parti ont confirmé Nikolai Vassilievitch Ogarkov au poste de nouveau secrétaire général du Parti communiste de l'Union soviétique, marquant ainsi un tournant décisif vers la réforme technocratique et le socialisme cybernétique. Figure de proue de la faction cybernétique Kaganovitch-Oustinov, la victoire d’Ogarkov reflète la prise de conscience croissante que le système soviétique doit se moderniser sous peine de prendre du retard. \nOgarkov s’est fait connaître en tant que chef d’état-major général, où il a ouvertement reconnu le retard technologique de l’URSS par rapport aux États-Unis, affirmant qu’une réforme économique significative nécessiterait inévitablement une réforme politique. Ses opinions contrastaient fortement avec la doctrine orthodoxe et suscitaient la résistance des officiers traditionalistes attachés à la guerre de masse telle qu’elle avait été menée pendant la Seconde Guerre mondiale.\nEn tant que réformateur militaire, Ogarkov a été le pionnier du concept d’une force de frappe réduite, hautement mobile et axée sur la technologie, mettant l’accent sur les armes de précision, les systèmes de commandement automatisés et la cybernétique. Il a supervisé des exercices opérationnels et stratégiques de grande envergure, notamment Zapad-81, qui a permis de tester des systèmes de contrôle industriel, les premières munitions à guidage de précision et des concepts avancés de commandement et de contrôle. Il a également créé un centre de recherche stratégique au sein de l’état-major général afin d’intégrer les forces de missiles, la défense antimissile et la théorie des systèmes.\nEn tant que secrétaire général, Ogarkov a annoncé une nouvelle orientation axée sur :\n– La normalisation des programmes numériques et cybernétiques à l’échelle de l’État et de l’armée\n– La finalisation et l’extension du réseau informatique national OGAS\n– La promotion des véhicules électriques et de l’industrie automatisée\n– La transition vers une doctrine moderne de « révolution dans les affaires militaires »"
 SOV_UST.6.a: "Longue vie au camarade Ogarkov !"
 SOV_UST.2.t: "Dépolitisation de la science et de l'éducation soviétiques"
 SOV_UST.2.d: "Le secrétaire général Dmitri Oustinov a annoncé une réforme en profondeur visant à réduire le dogmatisme politique et l’ingérence idéologique au sein des institutions scientifiques, militaires et éducatives de l’Union soviétique. Présentée comme une mesure nécessaire pour maintenir la parité technologique et assurer le développement socialiste à long terme, cette politique s’applique non seulement à l’URSS, mais aussi aux systèmes de formation et de recherche du Pacte de Varsovie.\nEn vertu de cette nouvelle directive, le mérite scientifique, la compétence technique et la créativité primeront sur la loyauté politique dans les nominations, les promotions et les décisions de financement. La tutelle du Parti au sein des universités, des académies militaires, des écoles de militsiya et des instituts scientifiques sera réduite, et les programmes d'études et les axes de recherche bénéficieront d'une plus grande autonomie professionnelle.\nL'Académie des sciences de l'Union soviétique, qui regroupe près de 300 instituts, laboratoires et observatoires, conservera son rôle de coordination des priorités nationales en matière de recherche, mais en mettant davantage l'accent sur la science fondamentale, l'innovation et les résultats appliqués, plutôt que sur une conformité idéologique rigide. Les académies régionales et républicaines sont encouragées à identifier et à cultiver les talents locaux, afin d'accélérer la transposition de la recherche dans la pratique industrielle et militaire.\nUstinov a justifié cette réforme en avertissant que la politisation excessive avait étouffé l'initiative, ralenti les progrès cybernétiques et technologiques, et découragé des scientifiques prometteurs. Cette nouvelle orientation vise à libérer la créativité au sein des structures socialistes, en positionnant la science et l'éducation comme moteurs de la modernisation plutôt que comme instruments du dogme."
 SOV_UST.2.a: "Pragmatisme, résultats, socialisme."
