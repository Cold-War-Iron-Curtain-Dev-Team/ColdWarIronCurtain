 SOV_invite_china_warsaw_pact: "Inviter la Chine dans le Pacte de Varsovie"
 SOV_support_nigerian_communist_government: "Soutenir le gouvernement communiste nigérian"
 SOV_finance_nigerian_kainiji_dam: "Financer le barrage de Kainiji au Nigeria"
 SOV_support_guatamala_rebels: "Soutenir les rebelles du Guatemala"
 AOC_reorganize_farming_policies: "Réformer les politiques agricoles"
 SOV_agriculture_desc: "Depuis les débuts de l'humanité, l'agriculture a permis de produire la nourriture nécessaire à la croissance démographique ; après la Grande Guerre patriotique, nous devons mettre en place un nouveau système agricole afin de subvenir aux besoins de notre population en cas de nouvelle guerre contre les puissances capitalistes."
 SOV_improved_training_desc: "Pendant la guerre, nous avons perdu des centaines de milliers de conscrits soviétiques en raison de la situation désespérée sur le front ; nous devrions mettre en place une formation militaire plus professionnelle afin de ne plus perdre autant d'hommes dans une entreprise aussi inutile."
 SOV_lessons_from_the_great_patriotic_war_desc: "La Grande Guerre patriotique nous a beaucoup appris ; nous devons engager une réforme en profondeur de nos forces armées afin de ne plus jamais laisser une force oppressive s'enfoncer aussi profondément en URSS, ni dominer les eaux de notre nation, ni régner sur les cieux de notre grande nation communiste."
 SOV_rebuild_member_civilian_industries_desc: "Ceux qui se sont opposés à nous pendant la guerre ont énormément souffert des conséquences de leurs actes et de leurs décisions, mais maintenant que nous avons mis en place, dans ces pays, des gouvernements amis, dirigés par des personnes partageant nos valeurs, nous devrions soutenir leur secteur industriel afin qu'il puisse rivaliser avec l'Occident."
 SOV_develop_membership_infrastructure_desc: "Les bombardements menés par nos forces aériennes soviétiques ont profondément marqué tous nos anciens ennemis ; une fois nos camarades en place, nous devrions reconstruire leurs chemins de fer, leurs villes et leurs autoroutes afin de favoriser un plus grand développement de leurs nations."
 SOV_develop_membership_research_collection_desc: "Depuis le début de la guerre froide, il y a quelques années, nous avons constaté que les puissances capitalistes ont considérablement renforcé leur supériorité technologique, grâce à leur coopération dans le cadre d'un programme de recherche ; nous devrions nous aussi en mettre un en place afin de mener à bien de glorieux projets pour la patrie."
 SOV_collectivized_five_year_plans_desc: "Depuis la fondation de notre nation, les plans quinquennaux ont été la source de notre puissance industrielle et la raison pour laquelle nous avons vaincu la bête fasciste ; comme cela a si bien fonctionné pour nous, nous devrions mettre en œuvre le plan quinquennal auprès de tous nos nouveaux camarades amis."
 SOV_soviet_oil_fields_desc: "L'offensive allemande dans le Caucase nous a rappelé l'immense pouvoir que le pétrole exerce sur une machine de guerre ; nous devrions explorer et exploiter au maximum tous les nouveaux gisements pétroliers que nous découvrons afin d'alimenter notre machine de guerre à son plein potentiel."
 SOV_soviet_oil_refineries_desc: "Une économie mondiale en constante évolution nous a appris que le pétrole est l'une des matières premières essentielles dont doit disposer tout pays qui souhaite être considéré comme une puissance ; c'est pourquoi nous devons construire de nouvelles raffineries de pétrole afin de répondre aux besoins du peuple soviétique ainsi qu'à ceux de nos alliés à travers le monde."
 SOV_autarkic_policies_desc: "Nous ne pouvons compter sur personne, pas même sur nos alliés, pour nous fournir les ressources qui revêtent une importance capitale pour notre peuple ; notre grand dirigeant a donc décidé que nous adopterions l'autarcie comme nouvel objectif politique pour l'URSS."
 SOV_latam_operations_desc: "Plus nous nous rapprochons de l'ennemi des travailleurs, mieux c'est ; c'est pourquoi nous devons soutenir financièrement nos frères communistes au sein des gouvernements d'Amérique du Sud et d'Amérique centrale afin de faire avancer la révolution et d'abattre l'aigle capitaliste."
 SOV_european_thrust_desc: "Depuis que nous avons renversé la bête fasciste, nous voulions étendre le communisme au reste de l'Europe, mais les Alliés ont entravé notre avancée. Cela suffit, disons-nous, car nous allons désormais nous attaquer à la tyrannie capitaliste en Europe et libérer tous les travailleurs."
 SOV_internal_stability_desc: "Il faut assurer la stabilité interne pour repousser l'aigle capitaliste occidental ; nous avons déjà frôlé de peu un coup d'État trotskiste, lors duquel nous avons écrasé les contre-révolutionnaires dans le feu sacré du socialisme ; nous devons à nouveau rechercher la stabilité afin de protéger nos États tampons contre les Américains."
 SOV_new_political_theory_desc: "Le monde change, et alors que nous sentons le vent du changement souffler sur notre nation, nous devons nous aussi commencer à changer. L'un des piliers de notre nation réside dans la manière dont nous faisons face aux forces réactionnaires partout dans le monde ; nous devons élaborer une nouvelle théorie de l'expansion communiste à l'échelle mondiale."
 SOV_middle_east_operations_desc: "Nous devons considérer le Moyen-Orient comme un terreau fertile pour la révolution ; c'est l'une des régions les plus riches en pétrole de la planète, un pétrole qui serait très apprécié par tous en URSS. C'est pourquoi nous devons entamer des pourparlers avec les gouvernements du Moyen-Orient et commencer à envoyer nos agents sur place pour favoriser la révolution."
 SOV_support_arab_cause_desc: "Les Arabes ont raison de s'opposer à l'État d'Israël ; nous devons les soutenir ouvertement partout où nous le pouvons dans cette lutte contre le capitalisme et l'impérialisme."
 SOV_arm_arab_states_desc: "Nous devons commencer à préparer les Arabes à faire face à toute tentative des Américains ou des Britanniques visant à étouffer leur soif de révolution ; c'est l'une des raisons pour lesquelles nous allons envoyer des armes et des combattants dans de nombreux pays arabes."
 SOV_soviet_arabian_sphere_desc: "La pression exercée par notre gouvernement incitera certainement la plupart, voire la totalité, des gouvernements arabes à nous apporter leur soutien dans cette guerre froide contre les États-Unis ; nous devons veiller à étendre notre sphère d'influence autant que possible, afin de renforcer notre zone tampon et de protéger le véritable chef de file du socialisme, l'URSS."
 SOV_anti_colonialism_desc: "Le colonialisme britannique et français a longtemps été un fléau pour les travailleurs du monde entier, notamment en Asie et en Afrique ; nous devons nous opposer ouvertement à ces tentatives flagrantes visant à briser l'esprit de solidarité des travailleurs du monde entier."
 SOV_stalin_reforms_desc: "Notre Union soviétique est depuis longtemps à l'origine de nombreuses réformes en faveur des travailleurs, et il en va de même cette fois-ci : notre grand leader Staline va mettre en place des réformes majeures en URSS qui lui permettront d'accéder au rang de superpuissance, la rendant ainsi plus puissante que les États-Unis d'Amérique."
 SOV_an_iron_curtain_desc: "On a constaté que des éléments subversifs issus des puissances capitalistes s'infiltrent dans tous les États communistes comme un fléau ; nous devons donc mettre en place une politique anticapitaliste dans chacun de nos États tampons, car nous devons empêcher l'échec de la révolution, qui est le bastion des travailleurs du monde entier."
 SOV_socialism_in_one_country_desc: "Même si une révolution mondiale serait merveilleuse, la révolution est un processus long et ardu qui doit être nourri pendant des siècles pour aboutir ; nous devons donc, au contraire, veiller à ce que notre base socialiste soit la plus solide au monde et attendre la tempête de l'effondrement économique capitaliste qui ne manquera pas de se produire dans les années à venir."
 SOV_expand_gulags_desc: "Nous ne pouvons pas laisser les ennemis de l'État entraver notre développement ; au contraire, nous devrions agrandir notre système pénitentiaire afin que ces ennemis soient contraints de travailler pour le bien du pays. Nous ne devons laisser rien ni personne entraver l'ascension de notre nation vers la place qui lui revient de droit sur cette terre."
 SOV_traditional_beliefs_desc: "Les femmes n'ont pas leur place sur les champs de bataille ; leur place est chez elles, où elles élèvent les futurs enfants de la révolution socialiste. Il est absurde de laisser les mères de nos enfants mourir inutilement au combat, au risque d'affaiblir notre grande nation."
 SOV_egalitarian_beliefs_desc: "Il est de la plus haute importance que nous permettions aux femmes de travailler dans l'armée et dans les usines ; elles ont joué un rôle crucial pendant la Grande Guerre patriotique et ont fait leurs preuves, car elles sont tout aussi utiles sur le champ de bataille ou dans les usines que les hommes. Nous devons en effet montrer aux pays réactionnaires du monde entier que l'Union soviétique est véritablement le pays le plus égalitaire au monde."
 SOV_collectivization_desc: "Le terme « impératif » désigne la collectivisation de toutes les exploitations agricoles en URSS ; ce n’est qu’en s’unissant que les travailleurs de l’Union soviétique verront leur utopie se rapprocher, en renonçant à leurs principes égoïstes au profit de la grandeur de leur nation."
 SOV_traditional_farms_desc: "Le retour aux exploitations agricoles traditionnelles est la véritable voie à suivre ; la collectivisation de nos fermes dans le passé ayant coûté la vie à des millions de nos compatriotes, nous devrions œuvrer pour le bonheur et la sécurité de notre population, au lieu de nous montrer terriblement durs envers elle dans le cadre de notre industrialisation."
 SOV_continue_the_great_turn_desc: "La Grande Guerre patriotique nous a empêchés de poursuivre notre Grand Tournant contre les politiques capitalistes mises en œuvre par Lénine en 1921, mais aujourd’hui, avec le camarade Staline à la tête de notre nation après la victoire sur la bête fasciste, nous pouvons reprendre le Grand Tournant et révolutionner encore davantage l’industrie de l’Union soviétique."
 SOV_revitalize_the_new_economic_policy_desc: "Nous devons reconnaître les erreurs commises par notre gouvernement en accélérant de manière aussi précipitée la collectivisation des travailleurs et notre quête du communisme véritable ; c'est pourquoi nous devons nous efforcer de réparer les dégâts considérables que nous avons causés à l'industrie de notre nation et réintroduire la politique léniniste du capitalisme, afin que notre économie puisse se développer de manière saine."
 premier_khrushchev: "Nikita Khrushchev"
 premier_malenkov: "Georgy Malenkov"
 premier_zhukov: "Georgy Zhukov"
 premier_beria: "Lavrentiy Beria"
 premier_brezhnev: "Leonid Brezhnev"
 SOV_government_corruption: "Corruption au sein du gouvernement"
 SOV_government_corruption_endemic: "Corruption endémique au sein du gouvernement"
 stagnation: "L'ère de la stagnation"
 SOV_Generalissimo_Stalin: "Le généralissime Staline"
 SOV_Generalissimo_Stalin_desc: "Le camarade Staline a beaucoup fait pour le peuple soviétique ; cependant, après la défaite de la bête fasciste et l'expansion de l'Union soviétique, il reste encore beaucoup à faire pour l'avenir du socialisme dans notre pays et à l'étranger !"
 SOV_Proclaim_Victory_Over_Fascism: "Proclamer la victoire sur le fascisme"
 SOV_Proclaim_Victory_Over_Fascism_desc: "Grâce à l'aide du camarade Staline et à la puissance de la patrie, le peuple soviétique peut légitimement revendiquer notre victoire contre les agresseurs fascistes allemands qui cherchaient à violer notre glorieuse patrie et à la détruire pour leur propre profit !"
 SOV_Korea_Question: "La question coréenne"
 SOV_Korea_Question_desc: "Le régime de Kim Il-sung est menacé par les impérialistes occidentaux ! Nous devons trouver un moyen de les aider efficacement !"
 SOV_Demand_War_Reparations: "Exiger des réparations de guerre"
 SOV_Demand_War_Reparations_desc: "L'Allemagne et ses alliés de l'Est ayant été vaincus, nous devons exiger des réparations pour les crimes de guerre qu'ils ont commis contre le peuple soviétique et pour le bombardement de plusieurs usines dans des villes soviétiques telles que Minsk, Koursk, Kiev et d'autres. Nous veillerons à ce qu'ils paient intégralement chaque réparation en moins de cinq ans pour ce qu'ils ont fait !"
 SOV_Establish_European_Radar_Stations: "Mettre en place des stations radar"
 SOV_Establish_European_Radar_Stations_desc: "Les stations radar contribueront à garantir la sécurité de notre bloc oriental et la stabilité de notre Union, et à surveiller toute initiative que l'Occident pourrait prendre à notre encontre."
 SOV_Infrastructure_Effort: "Développement des infrastructures"
 SOV_Infrastructure_Effort_desc: "La modernisation de nos infrastructures permettra d'améliorer les liaisons entre les grandes villes et les communautés plus rurales de notre pays, ainsi que la circulation des marchandises et des approvisionnements à l'échelle nationale."
 SOV_Institute_Nation_Wide_Workers_Programs: "Mettre en place des programmes nationaux en faveur des travailleurs"
 SOV_Institute_Nation_Wide_Workers_Programs_desc: "Il serait bénéfique pour la nation et le prolétariat de mettre en place de nouveaux programmes destinés à l'ensemble de nos travailleurs afin qu'ils puissent être plus productifs."
 SOV_Resume_the_1945_Five_Year_Plan: "Reprendre le plan quinquennal de 1945"
 SOV_Resume_the_1945_Five_Year_Plan_desc: "« D’ici 1960, nous serons la première puissance industrielle mondiale. » Tels étaient les mots du Premier ministre Joseph Staline. Au lendemain de la Grande Guerre patriotique, notre pays était en ruines. Nous devons relancer le quatrième plan quinquennal pour reconstruire notre pays."
 SOV_Comecon_Investments: "Investissements dans le Comecon"
 SOV_Comecon_Investments_desc: "Nos anciens ennemis sont désormais devenus nos alliés depuis que nous avons mis en place de nouveaux gouvernements dans leurs pays. Nous devons y implanter de nouvelles industries afin qu'ils puissent retrouver la stabilité et que nous puissions renforcer la coopération entre nos économies."
 SOV_Turkish_Straits_Crisis: "Crise des détroits turcs"
 SOV_Turkish_Straits_Crisis_desc: "La Turquie contrôle l'accès à la Méditerranée. Nous devons nous pencher sur cette question concernant nos navires et l'accès à la Méditerranée."
 SOV_Peaceful_Resolution: "Résolution pacifique"
 SOV_Peaceful_Resolution_desc: "Grâce à nos diplomates talentueux, dépêchés pour discuter de la question des détroits turcs et de l'accès de nos navires à la Méditerranée, nous sommes parvenus à un règlement pacifique de la situation et avons réussi à éviter tout conflit entre notre pays et la Turquie."
 SOV_Expand_the_Nuclear_Program: "Développer le programme nucléaire"
 SOV_Expand_the_Nuclear_Program_desc: "Nous ne sommes pas en mesure de rivaliser avec les États-Unis en matière de capacités nucléaires. Nous devons consacrer davantage de scientifiques et de ressources budgétaires au développement de notre programme nucléaire !"
 SOV_Continue_Demands_for_Regime_Chang: "Poursuivre les appels à un changement de régime"
 SOV_Continue_Demands_for_Regime_Chang_desc: "L'arrogance des Turcs et nos conflits historiques avec la Turquie nous donnent toutes les raisons de les débarrasser de leur régime antisoviétique et d'établir notre contrôle dans la région !"
 SOV_Partition_of_Turkey: "Partition de la Turquie"
 SOV_Partition_of_Turkey_desc: "La Turquie étant enfin vaincue et placée sous notre sphère d'influence, il est impératif que nous rendions une partie de son territoire à la mère patrie soviétique à titre de compensation !"
 SOV_The_Greek_Civil_War: "La guerre civile grecque"
 SOV_The_Greek_Civil_War_desc: "Nos camarades en Grèce ont déclaré la guerre à l'establishment. Il est essentiel que nous prenions position sur cette question potentiellement stratégique."
 SOV_Leave_them_to_their_Fate: "Laissons-les à leur sort"
 SOV_Leave_them_to_their_Fate_desc: "Compte tenu des pertes subies par nos camarades en Grèce, il serait trop coûteux d'essayer de les sauver maintenant. Dans l'intérêt de la paix internationale et afin de préparer, le cas échéant, une nouvelle révolution plus fructueuse en Grèce, nous devons les laisser à leur sort."
 SOV_Intervene_in_the_Greek_Civil_War: "Intervenir dans la guerre civile grecque"
 SOV_Intervene_in_the_Greek_Civil_War_desc: "Nos camarades grecs ont besoin de notre aide pour que leur révolution aboutisse ! La révolution socialiste en Grèce revêt une importance stratégique trop grande pour que nous puissions l'ignorer ! Nous devons leur venir en aide !"
 SOV_Invite_Greece_to_COMECON: "Inviter la Grèce à rejoindre le COMECON"
 SOV_Invite_Greece_to_COMECON_desc: "Grâce à notre intervention en Grèce, nous devons désormais les intégrer officiellement dans notre sphère d'influence et orienter leur économie vers la voie du socialisme !"
 SOV_Revival_of_the_Russian_Orthodox_Church: "Renouveau de l'Église orthodoxe"
 SOV_Revival_of_the_Russian_Orthodox_Church_desc: "« Malgré la répression que nous avons exercée par le passé à l'encontre de l'Église orthodoxe, nous prenons désormais conscience de son importance sociale pour le peuple soviétique et des avantages qu'il y a à laisser l'Église exister sous l'égide de l'État soviétique. Nous allons désormais laisser l'Église se revitaliser afin de gagner la faveur de la population orthodoxe en faveur du socialisme ! »"
 SOV_Soviet_Socialist_Patriotism: "Patriotisme socialiste soviétique"
 SOV_Soviet_Socialist_Patriotism_desc: "Après la Grande Guerre patriotique, un nouvel élan d'amour pour notre patrie et notre mode de vie socialiste s'est développé en nous ! Toute notre nation chante les louanges de nos anciens combattants et de nos travailleurs, qui ont assuré l'avenir de notre Union !"
 SOV_stalin_notes: "Les notes de Staline"
 SOV_stalin_notes_desc: "Après la division de l'Allemagne, nous avons montré qui détenait le véritable pouvoir dans le monde. Plusieurs années se sont écoulées depuis cette division, et la réunification allemande reste une possibilité, mais elle se fera selon nos conditions : la mise en place d'un gouvernement neutre en Allemagne et le retrait de nos forces ainsi que des forces occidentales, dans l'intérêt d'une paix durable. Nous ferons cette proposition à l'Occident."
 SOV_Direct_Intervention: "Intervention directe"
 SOV_Direct_Intervention_desc: "Les Américains et leur État voyou coréen du Sud devront passer par nous s'ils veulent ne serait-ce que mettre les pieds sur la péninsule coréenne !"
 SOV_Indirect_Intervention: "Intervention indirecte"
 SOV_Indirect_Intervention_desc: "Nous enverrons notre matériel et nos hommes pour venir en aide à nos camarades coréens du Nord. Nous devons le faire en secret afin de ne pas alarmer les Américains."
 SOV_socialism_in_one_country: "Le socialisme dans un seul pays"
 SOV_expand_gulags: "Agrandir les goulags"
 SOV_Further_Purges: "De nouvelles purges"
 SOV_Further_Purges_desc: "Même si Trotsky est mort, tout comme bon nombre de ses alliés à la suite de la grande purge, il reste au sein de notre Politburo des personnes qui nourrissent de la rancœur envers le camarade Staline et ce qu’il a accompli pour notre nation, et qui doivent être définitivement exclues du parti."
 SOV_Favour_Beria_and_Malenkov: "Favoriser Beria et Malenkov"
 SOV_Favour_Beria_and_Malenkov_desc: "Les camarades Beria et Malenkov ont prouvé leur loyauté envers le camarade Staline et sa politique. Nous devons les maintenir à leurs postes élevés au sein du Politburo afin de consolider l'influence du camarade Staline au sein du parti."
 SOV_Purge_the_Lenningrad_Party_Leadership: "Purger la direction du Parti à Leningrad"
 SOV_Purge_the_Lenningrad_Party_Leadership_desc: "Les dirigeants de Leningrad ont manifesté leur désapprobation face aux purges au sein du Politburo. Ils seront eux aussi mis sur la sellette."
 SOV_the_doctors_plot: "Le complot des médecins"
 SOV_the_doctors_plot_desc: "Ces derniers temps, le camarade Staline est en mauvaise santé et a dû faire appel à des médecins juifs pour le soigner. Il a toutefois fini par se méfier d'eux et les soupçonne désormais de s'en prendre à sa santé dans le but de le tuer ; il a donc ordonné le lancement d'une campagne contre ces médecins et contre les Juifs de toute l'Union, qui seront envoyés en Sibérie pour avoir tenté de lui nuire."
 SOV_propaganda_against_judaism: "Propagande contre le judaïsme"
 SOV_propaganda_against_judaism_desc: "Nous devons soutenir la campagne de dénigrement menée par les médecins contre la communauté juive dans notre pays, car ceux-ci ont été désignés comme des ennemis de l'État et des espions américains !"
 SOV_anti_western_propaganda: "Propagande anti-occidentale"
 SOV_anti_western_propaganda_desc: "L'Occident a sans aucun doute engagé ces « médecins » pour assassiner le camarade Staline ! Nous devons donc manifester notre colère contre l'Occident pour montrer que nous ne tolérerons pas la présence de leurs espions dans notre pays !"
 SOV_Purge_the_Georgian_Party_Leadership: "Purger la direction du Parti géorgien"
 SOV_Purge_the_Georgian_Party_Leadership_desc: "Les dirigeants de la République socialiste soviétique de Géorgie ont manifesté leur hostilité à l'égard des nouvelles purges menées par le camarade Staline au sein du Politburo. Ils seront eux aussi mis sur la sellette."
 SOV_Eastern_European_Stimulus_Package: "Plan de relance pour l'Europe de l'Est"
 SOV_Eastern_European_Stimulus_Package_desc: "Puisque les Américains viennent en aide à l'Europe occidentale grâce au plan Marshall, nous devrions mettre en place une initiative similaire afin que nos pays puissent rivaliser avec l'Occident et se remettre de la guerre !"
 SOV_Jumpstart_Belorussian_Industry: "Relancer l'industrie biélorusse"
 SOV_Jumpstart_Belorussian_Industry_desc: "Pour mieux nous remettre de la guerre, nous devons soutenir l'industrie de nos camarades biélorusses !"
 SOV_Jumpstart_Baltic_and_Balkan_Industry: "Relancer l'industrie dans les pays baltes et les Balkans"
 SOV_Jumpstart_Baltic_and_Balkan_Industry_desc: "Après avoir intégré l'Estonie, la Lettonie et la Lituanie à notre grande Union en 1940, nous devrions investir dans leur industrie ainsi que dans celle de nos nouveaux alliés des Balkans afin de les aider à se relever et à rester fidèles !"
 SOV_Invest_In_Ukranian_Reconstruction_Program: "Investir dans les programmes de reconstruction de l'Ukraine"
 SOV_Invest_In_Ukranian_Reconstruction_Program_desc: "Nos camarades ukrainiens ont été durement touchés par l'invasion allemande, qui a détruit leurs habitations et leurs industries. Afin de gagner leur confiance et de relancer leur économie, des programmes de reconstruction seront mis en place pour leur venir en aide."
 SOV_Execute_Khruschev: "Exécutez Khrouchtchev et Joukov"
 SOV_Execute_Khruschev_desc: "Joseph Staline considère Joukov et Khrouchtchev comme des menaces pour son pouvoir. Pour assurer sa sécurité et celle de l'Union soviétique, Khrouchtchev et Joukov doivent être éliminés."
 SOV_Begin_Military_Purges: "Débuter les purges dans l'armée"
 SOV_Begin_Military_Purges_desc: "La Grande Purge des années 1930 a permis d'éliminer les éléments tsaristes au sein de l'armée russe. Nous devons à nouveau purger l'armée afin d'assurer la sécurité de l'Union face au monde capitaliste."
 SOV_Establish_Personal_Property_Rights: "Établir des droits de propriété sur les biens mobiliers"
 SOV_Establish_Personal_Property_Rights_desc: ""
 SOV_Politicize_the_Military: "Politiser l'armée"
 SOV_Politicize_the_Military_desc: ""
 SOV_Close_the_Gulags: "Fermer les goulags"
 SOV_Close_the_Gulags_desc: ""
 SOV_Enact_Anti_Stalnist_Lennist_Reforms: "Adopter des réformes antistaliniennes"
 SOV_Enact_Anti_Stalnist_Lennist_Reforms_desc: ""
 SOV_The_Orthodox_Revival_Beria: "Le renouveau orthodoxe"
 SOV_The_Orthodox_Revival_Beria_desc: ""
 SOV_Continue_Stalinist_Toleration: "Poursuivre la politique religieuse stalinienne"
 SOV_Continue_Stalinist_Toleration_desc: ""
 SOV_Church_as_a_Political_Tool: "Utiliser l'Église comme un outil politique"
 SOV_Church_as_a_Political_Tool_desc: ""
 SOV_Promote_Nationalism: "Promouvoir le nationalisme"
 SOV_Promote_Nationalism_desc: ""
 SOV_Political_Amnesty: "Amnistie politique"
 SOV_Political_Amnesty_desc: ""
 SOV_Curtail_Political_Repression: "Mettre fin à la répression politique"
 SOV_Curtail_Political_Repression_desc: ""
 SOV_Outreach_to_the_West: "Ouverture vers l'Ouest"
 SOV_Outreach_to_the_West_desc: ""
 SOV_Western_Economic_Cooperation: "Coopération économique occidentale"
 SOV_Western_Economic_Cooperation_desc: ""
 SOV_End_Slave_Labor_Programs: "Mettre fin aux programmes de travail forcé"
