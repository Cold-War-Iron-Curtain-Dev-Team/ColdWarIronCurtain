 Soviet_End.1.d: "Dans un moment qui va bouleverser à jamais le paysage politique mondial, l’Union soviétique a officiellement cessé d’exister aujourd’hui. Le président Mikhaïl Gorbatchev a annoncé la dissolution de l’Union soviétique lors d’une allocution télévisée, marquant ainsi la fin d’une superpuissance qui a perduré pendant près de 70 ans.\nCette décision fait suite à une série d’événements tumultueux qui ont débuté avec le coup d’État manqué du mois d’août dernier, lequel a affaibli l’emprise du Parti communiste sur le pouvoir. La montée en puissance des mouvements indépendantistes dans diverses républiques a accéléré l'effondrement, alors que des nations telles que l'Ukraine, la Biélorussie et les États baltes déclaraient leur souveraineté.\nGorbatchev, qui avait introduit les politiques de glasnost (transparence) et de perestroïka (restructuration) visant à revitaliser le système soviétique, a dû faire face à une pression croissante alors que les sentiments nationalistes gagnaient du terrain à travers la fédération. Dans son discours, il a déploré cette désintégration mais a souligné la nécessité d’une transition pacifique vers un nouvel ordre politique.\nÀ la suite de cette annonce, les dirigeants de la Russie, de l’Ukraine et de la Biélorussie ont signé un accord historique à Minsk, établissant officiellement la Communauté des États indépendants (CEI). Cette nouvelle entité vise à favoriser la coopération entre les anciennes républiques soviétiques tout en soulignant leur indépendance."
