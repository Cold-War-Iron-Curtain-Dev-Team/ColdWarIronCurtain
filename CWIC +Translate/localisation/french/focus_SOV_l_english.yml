 SOV_Second_Treaty_of_Sevres: "Le deuxième traité de Sèvres"
 SOV_Second_Treaty_of_Sevres_desc: "Même si la Turquie est désormais sous notre contrôle, il serait judicieux d'accorder à nos camarades grecs des terres dans l'ouest de la Turquie afin de punir davantage ce pays et de nous assurer qu'il ne puisse plus jamais menacer les navires soviétiques !"
