 SOV_VIN.1.t: "Compte rendu du voyage de Hô Chi Minh"
 SOV_VIN.1.d: "Au début de l'année [GetYear], le président vietnamien Hô Chi Minh a rédigé des lettres et signé des décrets. Dans l'après-midi du 2 janvier, il a quitté la zone de sécurité de la province de Tuyen Quang et s'est dirigé vers le poste-frontière de Chongqing. Il s'est alors embarqué pour un voyage en Chine et en Union soviétique.\nLe voyage de Ho Chi Minh s'est déroulé en secret pour des raisons de sécurité, car les soldats français contrôlaient étroitement la frontière avec la Chine et des restes de bandes et de soldats du Kuomintang se trouvaient encore sur le territoire chinois nouvellement libéré.\nLa délégation était composée de neuf personnes : Ho Chi Minh, Tran Dang Ninh, l'interprète Pham Van Khoa, le docteur Le Van Chanh et des agents de sécurité japonais. Le groupe de travail comprenait le colonel Lam Kinh, l'assistant interprète Le Phat, l'opérateur radio Ngo Vi Thien (qui assistait également Tran Dang Ninh) et l'opérateur radio Nhiem Vu.\nDès le début du voyage, le 1er juin, le journal vietnamien « La Vérité » publia un télégramme de félicitations de Ho Chi Minh, au nom du peuple vietnamien, adressé à I.V. Staline à l'occasion de son 70e anniversaire."
 SOV_VIN.1.a: "Un allié potentiel"
 SOV_VIN.2.t: "Compte rendu du voyage de Hô Chi Minh"
 SOV_VIN.2.d: "Le [?global.date.GetDateStringNoHourLong], Ho Chi Minh quitta Pékin à bord d’un train spécial chinois à destination de Moscou. Il était accompagné de M. Tran Dang Ninh.\nQuelques jours plus tard, depuis Chita, Ho Chi Minh envoya le télégramme suivant à Staline :\n« 1. J’espère que ma visite à Moscou restera secrète pour deux raisons. Premièrement, seuls quelques membres du Comité central du Parti communiste et deux membres du gouvernement savent que j’ai quitté le Vietnam. Deuxièmement, je pense que si les Français apprenaient que j’ai quitté le Vietnam, ils pourraient prendre des mesures politiques et militaires.\n2. Le [?global.date.GetDateStringNoHourLong], j’ai demandé, par radio, la position du Parti communiste vietnamien sur la nature de ma visite à Moscou. Cependant, la réponse a été que je ne pourrais arriver à Moscou qu’au plus tôt dans dix jours.\n3. Si vous, camarade Staline, espérez que tout se passe pour le mieux, c’est-à-dire que mon voyage à Moscou soit officiel, je suis convaincu que le Parti communiste vietnamien partage votre position.\n4. À mon arrivée à Moscou, j’aimerais que vous m’autorisiez à me rendre directement auprès de vous.\n\nSalutations, Ho Chi Minh. »"
 SOV_VIN.2.a: "Accepter la délégation"
 SOV_VIN.2.b: "Refuser la délégation"
 SOV_VIN.3.t: "Ho Chi Minh a réussi l'examen"
 SOV_VIN.3.d: "Ho Chi Minh arrive à Moscou pour une rencontre confidentielle avec le camarade Staline et nos dirigeants. Bien que menée dans la plus grande discrétion, cette visite marque un tournant historique : la République démocratique du Vietnam est officiellement accueillie dans le camp socialiste.\nAu cours des pourparlers au Kremlin, Staline reçoit Ho en personne, en présence de Molotov et d’autres hauts dirigeants soviétiques. L’atmosphère est cordiale et respectueuse, signe de la reconnaissance par Moscou de Ho Chi Minh en tant que dirigeant légitime de la révolution vietnamienne. Un moment symbolique se produit lorsque Staline signe un exemplaire de *L'Union soviétique en construction* pour Ho, suivi des signatures des autres membres du Politburo — un sceau tacite de soutien politique. \nÀ huis clos, les discussions portent sur la guerre anticoloniale du Vietnam, la reconnaissance internationale et la coordination avec l'ensemble du bloc socialiste. Peu après cette visite, l'Union soviétique s'oriente vers une pleine reconnaissance diplomatique du gouvernement de Ho, renforçant ainsi la position du Vietnam dans sa lutte contre la domination coloniale française et l'impérialisme."
 SOV_VIN.3.a: "Alors, qu'est-ce que tu veux d'autre, Ho Chi Minh ?"
