 HUN_infantry_equipment_1:0 "AK-55"
 HUN_infantry_equipment_1_short:0 "AK-55"
 HUN_infantry_equipment_1_desc:0 "L'AK-55 est une copie exacte sous licence du fusil d'assault Kalashnikov, manufacturée par l'entreprise hongroise Fegyver es Gazkeszulekgyar (FEG) de 1959 à 1962."
 HUN_infantry_equipment_2:0 "AMD-65"
 HUN_infantry_equipment_2_short:0 "AMD-65"
 HUN_infantry_equipment_2_desc:0 "En 1963, l'armée hongroise a adopté un nouveau fusil d'assault portant le nom d'AKM-63 (aussi connu sous le nom d'AMD-63), qui est une version modernisée de l'AK-55."
 HUN_infantry_equipment_3:0 "AK-63"
 HUN_infantry_equipment_3_short:0 "AK-63"
 HUN_infantry_equipment_3_desc:0 "Dans l'armée hongroise, l'AK-63 a remplacé l'AMD-65, qui est presque identique mais possède un bouclier thermique modifié et d'une poignée verticale à l'avant sous le canon. Bien que l'AMD-65 ait été le fusil de service hongrois depuis 1965, il était plus cher à produire, et la poignée avant avait la réputation de s'endommager facilement sur le terrain. À la fin des années 70, le ministère hongrois de la Défense a demandé à la FÉG de fabriquer un fusil moins coûteux, basé sur le modèle soviétique AKM plus traditionnel. À la fin de l'année 1977, l'AK-63 a été adopté par l'armée populaire hongroise (à commencer par les forces terrestres). En 1978, FÉG a ajouté à son catalogue une version AKMS à crosse pliante de l'AK-63 ; par la suite, l'AK-63 à crosse fixe a été rebaptisé AK-63F (crosse en bois) et la version à crosse pliante a été désignée AK-63D (Descent). Dans l'armée hongroise, les AK-63 F et D sont respectivement désignés AMM et AMMS."
 HUN_infantry_equipment_4:0 "AK-63MF"
 HUN_infantry_equipment_4_short:0 "AK-63MF"
 HUN_infantry_equipment_4_desc:0 "AK-63D modernisée avec crosse télescopique et rail MIL-STD-1913 Swan."
