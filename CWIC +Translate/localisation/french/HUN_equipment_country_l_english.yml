 HUN_fighter_equipment_0:0 "Magyar Legiero"
 HUN_fighter_equipment_0_short:0 "ML"
 HUN_fighter_equipment_0_desc:0 "L'armée de l'air hongroise est la branche aérienne des forces armées hongroises. Une petite force aérienne a été mise en place selon le modèle soviétique en 1947. Après la prise du pouvoir par les communistes, l'aide militaire russe s'est intensifiée et un vaste programme d'expansion a été lancé."
 HUN_fighter_equipment_1:0 "MAVAG Heja"
 HUN_fighter_equipment_1_short:0 "Heja"
 HUN_fighter_equipment_2:0 "MAVAG Bf 109 G-2"
 HUN_fighter_equipment_2_short:0 "Bf 109 G-2"
 HUN_fighter_equipment_3:0 "Yakovlev Jak-9P Vercse"
 HUN_fighter_equipment_3_short:0 "Jak-9P Vercse"
 HUN_jet_multirole_equipment_2:0 "Mikoyan-Gurevich MiG-15"
 HUN_jet_multirole_equipment_2_desc:0 "Sans doute l'un des chasseurs les plus emblématiques de la Guerre froide, le Mikoyan-Gurevich MiG-15 « Fagot » est entré en service en 1947. Le MiG-15 a pris part à de nombreux conflits depuis son apparition lors de la guerre de Corée, où il s'est révélé un adversaire de taille face aux F-86 Sabre et F9F Panther américains. Une partie de la frontière entre la Corée et la Chine a été surnommée « MiG Alley » en raison de leur présence massive dans la région. Plus de 18 000 MiG-15 ont été construits et utilisés par de nombreux pays, notamment l'URSS et les pays du bloc de l'Est. Alors que la plupart des appareils ont été retirés du service dans les années 1950, certains sont toujours en service au sein de l'armée de l'air nord-coréenne."
 HUN_jet_multirole_equipment_2_short:0 "MiG-15"
 HUN_jet_multirole_equipment_3:0 "Mikoyan-Gurevich MiG-17"
 HUN_jet_multirole_equipment_3_desc:0 "Successeur direct du MiG-15 Fagot. Plus de 10 000 MiG-17 Fresco ont été produits à partir de 1952. Le MiG-17 a été construit sous licence dans l'armée de l'air chinoise sous le nom de Shenyang J-5. Au total, 20 pays ont utilisé le MiG-17, en Afrique, en Europe et en Asie. Son premier déploiement au combat a eu lieu en 1958, lorsque des MiG de la République populaire de Chine ont affronté des F-86 Sabre chinois nationalistes au-dessus du détroit de Taiwan. Cependant, le MiG-17 a principalement été utilisé pendant la guerre du Vietnam par la NVAF et la PLAAF, où il a remporté 28 victoires aériennes. Le MiG-17 a connu un tel succès qu'il a même tenu tête aux chasseurs américains Phantom II, beaucoup plus modernes et supersoniques, pendant la guerre du Vietnam. Le MiG-17 a été généralement retiré du service dans les années 1970, mais il reste encore en service de manière limitée dans certains pays africains et en Corée du Nord."
 HUN_jet_multirole_equipment_3_short:0 "MiG-17"
 HUN_jet_multirole_equipment_4:0 "Mikoyan-Gurevich MiG-19"
 HUN_jet_multirole_equipment_4_desc:0 "Le MiG-19 fut le premier avion de fabrication soviétique capable d'atteindre une vitesse supersonique en vol horizontal. Son équivalent américain dans la « série Century » était le North American F-100 Super Sabre, bien que le MiG-19 ait principalement combattu contre les McDonnell Douglas F-4 Phantom II et Republic F-105 Thunderchief, plus modernes, au-dessus du Nord-Vietnam."
 HUN_jet_multirole_equipment_4_short:0 "MiG-19"
 HUN_jet_multirole_equipment_5:0 "Mikoyan-Gurevich MiG-21F-13"
 HUN_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, équipé de missiles à portée au-delà du champ visuel et d'un radar à impulsions. Le MiG-21 est l'avion supersonique le plus produit de l'histoire, notamment en Chine et en Inde où il a été construit en grand nombre sous licence. Plus de 11 000 exemplaires ont été construits, servant dans plus de 60 pays sur les 5 continents. Au cours de sa durée de vie, le MiG-21 a abattu 240 avions ennemis. Le MiG-21 a été utilisé dans de nombreux conflits, notamment au Vietnam (où il a remporté un énorme succès), lors de la guerre indo-pakistanaise de 1971, lors de la guerre Iran-Irak et dans de nombreux conflits de moindre envergure. Il est toujours en service après plus de six décennies."
 HUN_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 HUN_jet_multirole_equipment_6:0 "Mikoyan-Gurevich MiG-21PF"
 HUN_jet_multirole_equipment_6_desc:0 "Version de série de l'intercepteur tout temps. Ces appareils étaient équipés du turboréacteur R11F2-300 et, à partir du septième lot de production, du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T, également appelé RP-9-21). De plus, le système de contrôle des armes a été modifié par rapport à celui du F-13 afin de permettre l'utilisation du missile air-air à guidage laser RS-2US (alias K-5MS) en plus du missile à guidage infrarouge K-13."
 HUN_jet_multirole_equipment_6_short:0 "MiG-21PF"
 HUN_jet_multirole_equipment_7:0 "Mikoyan-Gurevich MiG-23M"
 HUN_jet_multirole_equipment_7_desc:0 "Le MiG-23 a été le premier chasseur soviétique à être équipé d'un radar à balayage vers le bas et à tirer vers le bas, et l'un des premiers à être armé de missiles à portée au-delà du champ visuel. Sa production a débuté en 1969 et a atteint des chiffres importants avec plus de 5 000 appareils construits, ce qui en fait l'avion à ailes à géométrie variable le plus produit de l'histoire. Aujourd'hui, le MiG-23 reste en service de manière limitée chez certains clients à l'exportation."
 HUN_jet_multirole_equipment_7_short:0 "MiG-23M"
 HUN_jet_multirole_equipment_8:0 "Mikoyan-Gurevich MiG-23ML"
 HUN_jet_multirole_equipment_8_desc:0 "Les premières variantes du « Flogger » présentaient un certain nombre de défauts de conception, notamment en termes de résistance et de fiabilité de la cellule, de performances du moteur, de maniabilité et de performances radar. Une refonte considérable de la cellule a été effectuée, donnant naissance au MiG-23ML."
 HUN_jet_multirole_equipment_8_short:0 "MiG-23ML"
 HUN_jet_multirole_equipment_9:0 "Mikoyan-Gurevich MiG-23MLD"
 HUN_jet_multirole_equipment_9_desc:0 "Le MiG-23MLD était la variante de chasse ultime du MiG-23. L'objectif principal de cette mise à niveau était d'améliorer la maniabilité, en particulier lors d'angles d'attaque élevés, qui étaient considérés comme le principal défaut du MiG-23M/ML. La perche pitot était équipée de générateurs de tourbillons, et les bords d'attaque dentelés des ailes étaient également conçus pour agir comme des générateurs de tourbillons. Le système de commande de vol intégrait le dispositif de butée synthétique SOS-3-4 et le limiteur de signaux."
 HUN_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 HUN_jet_multirole_equipment_10:0 "Mikoyan-Gurevich MiG-29A"
 HUN_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A a été initialement développé par le bureau d'études Mikoyan. Il s'agit du premier chasseur de quatrième génération à avoir été mis en service par l'URSS et le bloc de l'Est. Il intègre une avionique améliorée et des capacités radar considérablement renforcées. Les premiers MiG-29 ont été utilisés comme avions d'entraînement par le Pacte de Varsovie, avec des exportations limitées vers l'Inde, mais leur utilisation au combat était restreinte. Le MiG-29 allait plus tard servir de base à des variantes largement produites, telles que le MiG-29S, le MiG-29M et le MiG-35."
 HUN_jet_multirole_equipment_10_short:0 "MiG-29A"
 HUN_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29M"
 HUN_mr_stealth_fighter_equipment_1_short:0 "MiG-29M"
 HUN_mr_stealth_fighter_equipment_1_desc:0 "L'avion MiG-29M/M2 est une version révisée du MiG-29 de base. Il offre une capacité multirôle plus robuste grâce à une utilisation améliorée des armes air-air et air-sol de haute précision. Il dispose également d'une autonomie de combat considérablement accrue, grâce à une augmentation de sa capacité interne en carburant. Quelques modifications ont été apportées au cours du développement de l'avion. La cellule redessinée a été construite à partir d'un alliage léger d'aluminium et de lithium afin d'augmenter le rapport poussée/poids. La géométrie des rampes d'admission d'air a été revue, les persiennes d'admission supérieures ont été supprimées afin de laisser place à davantage de carburant dans les LERX, des grilles ont été installées pour empêcher les dommages causés par des objets étrangers (FOD) et les dimensions des entrées ont été agrandies pour permettre un débit d'air plus important."
 HUN_jet_CAS_equipment_1:0 "Il-10M Ruszko"
 HUN_jet_CAS_equipment_1_short:0 "Il-10M Ruszko"
 HUN_jet_CAS_equipment_2:0 "Mikoyan-Gurevich MiG-17bis"
 HUN_jet_CAS_equipment_2_desc:0 "Conversion d'un chasseur-bombardier, équipé pour transporter des roquettes et des bombes non guidées."
 HUN_jet_CAS_equipment_2_short:0 "MiG-17bis"
 HUN_jet_CAS_equipment_3:0 "Mikoyan-Guerevich MiG-19S"
 HUN_jet_CAS_equipment_3_desc:0 "Version chasseur-bombardier avec queue à panneaux mobiles. Équipé d'un récepteur de navigation longue portée Svod et armé de trois canons NR-30 de 30 mm. Il pouvait embarquer un pack de roquettes non guidées ORO-32K ou une bombe FAB-250 sous chaque aile, et à partir de 1957, il a été modifié pour pouvoir transporter quatre pods de roquettes."
 HUN_jet_CAS_equipment_3_short:0 "MiG-19S"
 HUN_jet_CAS_equipment_4:0 "Sukhoi Su-7B"
 HUN_jet_CAS_equipment_4_desc:0 "La version bombardier du Su-7 Fitter-A a effectué son premier vol en mars 1959, avant d'entrer en service en 1961. Il est devenu le principal avion d'attaque au sol soviétique des années 1960. Entre 1957 et 1972, plus de 1 400 Su-7B ont été construits, dont une grande partie a été exportée. Cet avion était relativement populaire à l'étranger, où il a été utilisé par 10 pays. Il a été largement utilisé par les forces aériennes indiennes et égyptiennes. Il est toujours en service, mais de manière limitée, en Corée du Nord."
 HUN_jet_CAS_equipment_4_short:0 "Su-7B"
 HUN_jet_CAS_equipment_5:0 "Sukhoi Su-7BKL"
 HUN_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté du fuselage, réservoirs de carburant installés dans les ailes, points d'ancrage « humides » sous les ailes pour transporter des réservoirs de carburant externes, capable de transporter des bombes nucléaires tactiques."
