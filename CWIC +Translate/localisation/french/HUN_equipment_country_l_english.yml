 HUN_mechanized_equipment_1_desc:0 "Véhicule blindé de transport de troupes hongrois de la Seconde Guerre mondiale. Il fit son apparition en mai 1943, après l'adoption des chars Turan et Toldi, dans le but de créer un équivalent allemand des véhicules blindés de transport de troupes à chenilles. Le châssis des canons automoteurs Nimrod (selon d'autres sources, celui du Landsverk L-62 suédois) fut choisi comme modèle de base."
