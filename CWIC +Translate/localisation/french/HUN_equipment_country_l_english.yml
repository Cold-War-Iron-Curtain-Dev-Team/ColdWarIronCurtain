 HUN_cas_stealth_equipment_1:0 "Sukhoi Su-25SM"
 HUN_cas_stealth_equipment_1_short:0 "Su-25SM"
 HUN_cas_stealth_equipment_1_desc:0 "Le Su-25SM (Stroyevoy Modernizirovannyi) est un programme de mise à niveau \"abordable\" du Su-25, conçu par l'Armée de l'air russe en 2000. Le programme découle des tentatives de mise à niveau des Su-25T et Su-25TM, qui ont été évaluées et qualifiées de trop sophistiquées et coûteuses. La mise à niveau SM intègre des améliorations avioniques et une remise à neuf de la cellule pour prolonger la durée de vie du Frogfoot jusqu'à 500 heures de vol ou de 5 ans. La toute nouvelle suite de navigation/attaque PRnK-25SM \"Bars\" du Su-25SM est construite autour du système informatique numérique BTsVM-90, initialement prévu pour le programme de mise à niveau du Su-25TM. La précision de navigation et d'attaque fournie par la nouvelle suite est trois fois supérieure à celle de la ligne de base Su-25 et se situerait à moins de 15 m en utilisant la correction satellite et à 200 m sans elle."
