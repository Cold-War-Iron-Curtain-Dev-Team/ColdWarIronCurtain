l_english:
 chi.1.t:0 "Accepter la RPC dans l'ONU"
 chi.1.d:0 "La République populaire de Chine souhaite être reconnue par les Nations Unies comme successeur de la République de Chine. Le gouvernement du Kuomintang de la République de Chine s'est réfugié à Taïwan et la République populaire de Chine contrôle le continent. Devons-nous préconiser l'attribution du siège de la République de Chine-Taïwan à la République populaire de Chine?"
 chi.1.a:0 "Oui bien sûr!"
 chi.1.b:0 "Non, ils resteront dehors."
 kmt_cooperation_tt:0 "§G Grâce à la coopération avec la République de Chine, notre pays recevra divers bonus, notamment de l'expérience militaire, des bonus de recherche et de l'équipement.§!"
 CHI_KOR.0.d:0 "L'ambition sans fin de notre ennemi mortel à Pékin a fait une nouvelle victime ; la jeune République de Corée, longtemps en proie à l'agitation de Kim Il Sung, s'est effondrée dans la guerre civile, la révolution de Mao Zedong soutenant sans aucun doute les forces de Sung au Nord comme moyen de combattre le soutien entrant des États-Unis, eux-mêmes en route pour soutenir le gouvernement républicain à Séoul ; c'est une situation où nous, patriotes chinois, connaissons très bien ce genre de conflit.\n\nLes yeux du monde se tournent à nouveau vers l’Asie alors que la guerre civile coréenne s’intensifie, et la République de Chine ne restera pas les bras croisés alors que la Menace rouge frappe le bon peuple coréen depuis son bastion de Pyongyang.\n\nCependant, bien que le général MacArthur ait fortement encouragé une intervention de la Chine nationaliste dans la guerre de Corée, le président Truman s'est ouvertement opposé à cette idée. Par conséquent, la proposition d'intervention des États-Unis dans la guerre de Corée a plus que de chances d'échouer."
 CHI_KOR.1.d:0 "Notre récente décision de nous impliquer dans la guerre civile en Corée a attiré l’attention des ennemis de la RPC et leur soutien à Kim Il Sung; la République de Chine à Taiwan et les restes du Kuomintang ont proposé de rejoindre l’armée américaine pour combattre l’armée nord-coréenne.\n\nSi toute tentative visant à entraver la marée rouge en Asie est la bienvenue, le choix d’impliquer Taïwan pourrait mettre en colère le gouvernement de Pékin, ce qui pourrait déclencher une invasion de la Mandchourie."
 CHI_KOR.2.d:0 "La correspondance officielle de Washington D.C nous a fait savoir que le gouvernement américain avait approuvé la proposition de Chiang Kai-Shek et que l'armée américaine travaillerait de concert avec l'armée du Kuomintang dans un effort combiné contre l'armée nord-coréenne!"
 CHI_KOR.3.d:0 "La correspondance officielle de Washington D.C a informé Chiang Kai-Shek du souhait du président de voir la République de Chine ne pas intervenir dans la guerre civile coréenne, citant les craintes que toute incursion militaire depuis Taiwan provoque des représailles militaires de Pékin, transformant potentiellement la guerre en crise internationale."
 CHI_KOR.4.d:0 "\nAvec le déclenchement de la guerre civile en Corée, il est tout naturel que les ennemis du bloc communiste asiatique qui soutiennent la révolte communiste à Pyongyang cherchent à se joindre aux combats; moins d’un an après la guerre civile chinoise, les restes du Kuomintang à Taiwan n’ont pas décidé, une fois de plus, de prendre les armes contre l’Armée rouge chinoise qui soutient Kim Il Sung en Corée du Nord.\n\nAprès une récente correspondance entre le président de la ROC Tchang Kai-chek à Taipei et le président américain Harry Truman à Washington, les États-Unis ont donné le feu vert à l'armée du Kuomintang pour aider l'armée américaine en Corée, estimant que leurs expériences contre les forces chinoises rouges seraient d'une aide immense contre la menace à laquelle elles sont confrontées."
 CHI_KOR_TT:0 "[CHI.GetNameDef] va officiellement rejoindre la guerre de Corée contre les agresseurs communistes."
 KMT_Lift_Martial_Law2:0 "Lever la loi martiale"
 sieze_trieste:0 "S'emparer de Trieste"
 sieze_capodistria:0 "Avancer vers Capodistria"
 sieze_trieste_desc:0 "La zone A du Territoire Libre de Trieste est la zone située autour de la ville de Trieste et ses environs."
 sieze_capodistria_desc:0 "Capodistria, également connue sous le nom de Koper, est la zone située au sud de Trieste qui est actuellement occupée par l'armée yougoslave, bien qu'étant formellement en territoire libre, c'est en tous points un territoire yougoslave."
 ITA_trieste.6.d:0 "D'excellentes nouvelles nous sont parvenues de l'état-major des forces armées: nos forces à Trieste ont réussi à sécuriser l'intégralité du territoire libre de Trieste. Selon les rapports, l'armée yougoslave était mal préparée à faire face à un assaut majeur et a été rapidement chassée de la région. Après avoir repoussé les forces yougoslaves, nos forces ont établi des fortifications à la frontière qui étaient capables de repousser les contre-attaques des forces yougoslaves. Cela contribuera certainement à consolider l’héritage du gouvernement actuel dans sa tentative de récupérer une partie de nos pertes de la guerre précédente. Plus important encore, un échec à ce niveau aurait sûrement conduit à l’effondrement du gouvernement actuel et à des dommages majeurs lors des prochaines élections. Cela étant dit, la réaction internationale, notamment de la part des pays non alignés et du bloc soviétique, ne tardera pas à condamner nos actions. Il sera toujours nécessaire de veiller à ce que nos alliés de l’OTAN, en particulier les États-Unis, continuent de collaborer étroitement avec nos forces armées et de nous fournir des équipements pour préserver nos acquis."
 ITA_trieste_crisis_category:0 "La crise de Trieste"
 ITA_trieste_crisis_category_desc:0 "Depuis quelques années, la ville de Trieste et ses environs sont occupés par les forces anglo-américaines dans la ville même et par l'armée yougoslave dans la partie sud du Territoire Libre. Alors que le maréchal Tito fait pression sur les Nations Unies et les Alliés pour mettre fin au Territoire Libre et éventuellement l'annexer entièrement à la Yougoslavie, nous devons faire tout ce qui est en notre pouvoir pour reconquérir ce qui a été pendant des siècles une terre italienne, même si c'est par la force."
 ITA_YUG_war:0 "Conflit italo-yougoslave"
 ITA_won_trieste:0 "L'Italie a gagné à Trieste"
 news_trieste.1.d:0 "Après une courte campagne, l'armée italienne a réussi à prendre le contrôle de la ville de Trieste et de ses environs immédiats. Cela survient après que les tensions autour de la ville se soient intensifiées depuis la fin de la Seconde Guerre mondiale. Après la fin de cette guerre, la région a été divisée et placée sous la juridiction des Nations Unies via le Territoire Libre de Trieste. Cependant, la région est connue pour sa population ethniquement divisée et constitue un point de discorde majeur entre la Yougoslavie et l'Italie concernant la propriété de son territoire. Alors que les discussions sur la dissolution du Territoire Libre étaient en cours, les tensions ont dégénéré en conflit armé entre les deux nations. À la surprise de la communauté internationale, les forces italiennes ont été capables de mettre en déroute les forces yougoslaves des zones A et B du territoire et ont annoncé leur intention d'annexer toute la zone. Cette décision a été largement condamnée par la Yougoslavie ainsi que par plusieurs pays communistes."
