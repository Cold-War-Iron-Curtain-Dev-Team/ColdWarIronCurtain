 BUL_Launch_the_Collectivization_Campaign_desc:0 "Bien que la plupart des petits agriculteurs aient rejoint des collectifs, seulement 12 pour cent des terres arables sont sous le contrôle de l'État - principalement parce que le programme de collectivisation aliène de nombreux paysans. Le régime de Valko Tchervenkov commence à utiliser les menaces, la violence et la discrimination d'approvisionnement pour viser le rythme le plus rapide de collectivisation en Europe de l'Est."
