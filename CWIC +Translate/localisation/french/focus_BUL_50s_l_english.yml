 BUL_Launch_the_First_Five_Year_Plan:0 "Lancer le Premier Plan Quinquennal"
 BUL_Launch_the_First_Five_Year_Plan_desc:0 "Les objectifs annoncés pour le Premier Plan quinquennal ont confirmé les priorités économiques indiquées par le Plan biennal précédent. L'agriculture devait recevoir 17 pour cent des nouveaux investissements et l'industrie 47 pour cent. La production industrielle brute devait croître de 119%, principalement en raison d'une augmentation de 220% de l'industrie lourde. L'industrie légère et l'agriculture devaient augmenter la production de 75 et 59 pour cent, respectivement. La collectivisation et la mécanisation rapides de l'agriculture devaient atteindre le dernier objectif tout en libérant de la main-d'œuvre pour l'industrie, la construction et les transports."
