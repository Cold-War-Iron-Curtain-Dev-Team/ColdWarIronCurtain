l_english:
 BUL_The_Sovietization_of_Bulgaria:0 "La soviétisation de la Bulgarie"
 BUL_The_Sovietization_of_Bulgaria_desc:0 "En tant que jeune nation communiste, il y a beaucoup de travail à faire si nous voulons établir un État socialiste stable."
