 BUL_The_Bulgarian_Peoples_Army:0 "L'armée populaire bulgare"
 BUL_The_Bulgarian_Peoples_Army_desc:0 "Après la proclamation de la République populaire de Bulgarie en 1946, la célébration de la fête militaire du 6 mai a été interrompue, la date du 23 septembre étant désignée comme la Journée de l'Armée populaire bulgare. Son importance réside dans le fait qu'il s'agit du jour de la mise en scène du soulèvement de septembre en 1923. Le premier défilé militaire de l'Armée populaire a eu lieu à l'occasion de l'anniversaire du coup d'État. La nouvelle fête a été réorganisée sur le modèle soviétique avec la participation directe d'officiers soviétiques, équipés d'armes et d'équipements soviétiques. Les postes de direction étaient occupés par des officiers soviétiques d'origine bulgare et une grande partie de l'état-major était formée en Union soviétique."
 BUL_Socialist_Realism:0 "Embrasser le réalisme socialiste"
 BUL_Socialist_Realism_desc:0 "Le réalisme socialiste se caractérise par la représentation des valeurs communistes, telles que l'émancipation du prolétariat. Malgré son nom, les figures du style sont très souvent très idéalisées, en particulier en sculpture, où il s'appuie souvent fortement sur les conventions de la sculpture classique."
