 BUL_The_Little_Stalin_desc:0 "La politique de Tchervenkov ressemble étroitement à celle de l'Union soviétique, ce qui lui a valu le surnom de \"Petit Staline\". Son règne comportait une répression sévère de toute déviation de la ligne du parti, une suppression arbitraire de la culture et des arts dans le sens du réalisme socialiste et une politique étrangère isolationniste."
