 USA_jfk60_The_Kennedy_Administration:0 "L'administration Kennedy"
 USA_jfk60_The_Kennedy_Administration_desc:0 "Jeune et charismatique, John F. Kennedy est choisi comme président des États-Unis lors des élections de 1960. Démocrate, Kennedy est le premier catholique romain à remporter les élections générales."
 USA_jfk60_Betray_Organized_Crime:0 "Trahir le crime organisé"
 USA_jfk60_Betray_Organized_Crime_desc:0 "Bien que beaucoup s'attendaient à ce qu'il laisse la Mafia tranquille, JFK va à l'encontre des prévisions des experts et s'attaque aux gangs criminels avec une nouvelle série d'enquêtes prévues."
 USA_jfk60_Establish_the_Peace_Corps:0 "Créer le Corps de la paix"
 USA_jfk60_Establish_the_Peace_Corps_desc:0 "Nous devons promouvoir la démocratie et les valeurs américaines dans le monde entier, d'une manière nouvelle et non violente, et le Corps de la paix y parviendra. Nous enverrons les meilleurs de nos jeunes hommes et femmes à l'étranger pour aider et développer les pays du tiers monde."
 USA_jfk60_Area_Redevelopment_Act:0 "Loi sur le réaménagement des zones"
 USA_jfk60_Area_Redevelopment_Act_desc:0 "La loi sur le réaménagement des zones rurales établira une administration du même nom, dont le rôle sera d'aider les zones rurales pauvres, en particulier les Appalaches, à développer les infrastructures et les ressources locales."
 USA_jfk60_Increase_the_Minimum_Wage:0 "Augmenter le salaire minimum"
 USA_jfk60_Increase_the_Minimum_Wage_desc:0 "Le salaire minimum, bien que pas trop bas, est encore loin d'être suffisant pour permettre à ceux qui le perçoivent de survivre dans notre système économique moderne et en pleine expansion. Il est nécessaire de l'augmenter."
 USA_jfk60_Invest_in_Appalachia:0 "Investir dans la région des Appalaches"
 USA_jfk60_Invest_in_Appalachia_desc:0 "Bien que déjà visée par la loi sur le réaménagement des zones, les Appalaches sont la région la plus pauvre des États-Unis et ont besoin de tous les fonds et investissements possibles."
 USA_jfk60_Drug_Efficacy_Amendment:0 "Amendement relatif à l'efficacité des médicaments"
 USA_jfk60_Drug_Efficacy_Amendment_desc:0 "Un amendement à la précédente loi fédérale sur les aliments, les médicaments et les cosmétiques, la DEA, introduit une exigence pour les entreprises de fournir la preuve que leur produit fonctionne réellement en toute sécurité comme prévu avant de pouvoir le vendre."
 USA_jfk60_Foreign_Assistance_Act_of_1961:0 "Loi sur l'aide étrangère de 1961"
 USA_jfk60_Foreign_Assistance_Act_of_1961_desc:0 "Cette loi restructure nos programmes d'aide internationale, en classant les fonds en aides militaires et non militaires. Une nouvelle Agence pour le développement international (USAID) supervisera les aides économiques."
 USA_jfk60_Manpower_Development_and_Training_Act:0 "Loi sur le développement et la formation de la main-d'œuvre"
 USA_jfk60_Manpower_Development_and_Training_Act_desc:0 "Notre réserve de main-d’œuvre, tant pour la population active que pour notre armée, est limitée et nous devons nous assurer de tirer le meilleur parti possible de chaque homme ou femme."
 USA_jfk60_Migration_and_Refugee_Assistance_Act:0 "Loi sur l'immigration et l'aide aux réfugiés"
 USA_jfk60_Migration_and_Refugee_Assistance_Act_desc:0 "La loi sur l’aide aux migrations et aux réfugiés est censée répondre aux besoins inattendus et urgents des réfugiés, des personnes déplacées, des victimes de conflits et d’autres personnes en danger dans le monde."
 USA_jfk60_Deploy_Troops_to_Ole_Miss:0 "Déployer des troupes à Ole Miss"
 USA_jfk60_Deploy_Troops_to_Ole_Miss_desc:0 "Après les événements de Little Rock 9 et le mouvement pour les droits civiques, les étudiants d'Ole Miss ont déclenché des émeutes pour protester contre l'inscription des étudiants noirs, et des morts se sont produits. Il est temps d'envoyer l'armée."
 USA_jfk60_Executive_Order_11063:0 "Décret exécutif n°11063"
 USA_jfk60_Executive_Order_11063_desc:0 "Ce décret interdit la discrimination dans tout type de transaction ou d’interaction impliquant un logement fédéral."
 USA_jfk60_Fund_the_Apollo_Program:0 "Financer le programme Apollo"
 USA_jfk60_Fund_the_Apollo_Program_desc:0 "« Nous avons choisi d'aller sur la Lune au cours de cette décennie, et de faire le reste, non pas parce que c'est facile, mais parce que c'est difficile… »\nC'est par ces mots que notre président a annoncé à la nation que nous atteindrons la Lune avant la fin de la décennie. Bonne chance à la NASA !"
 USA_jfk60_Equal_Pay_Act:0 "Loi sur l'égalité de rémunération"
 USA_jfk60_Equal_Pay_Act_desc:0 "Dans le cadre d’une série interminable d’amendements à la loi sur les normes du travail équitables, la loi sur l’égalité de rémunération tentera d’abolir l’écart de rémunération entre les sexes et de s’attaquer à d’autres domaines de discrimination sexuelle."
 USA_jfk60_Clean_Air_Act:0 "Loi sur la qualité de l'air"
 USA_jfk60_Clean_Air_Act_desc:0 "La loi sur la qualité de l'air est une loi nationale visant à contrôler et à éliminer la pollution atmosphérique. Un nouveau programme du Service de santé publique en assurera la supervision, et davantage de recherches dans les domaines connexes seront financées."
 USA_jfk60_Federal_Transit_Act:0 "Loi fédérale sur les transports en commun"
 USA_jfk60_Federal_Transit_Act_desc:0 "La loi sur les transports urbains de 1964 fournira 375 millions de dollars pour des projets ferroviaires urbains publics ou privés à grande échelle sous la forme de fonds de contrepartie aux villes et aux États."
 USA_jfk60_Civil_Rights_Act_of_1964:0 "Loi sur les droits civiques de 1964"
 USA_jfk60_Civil_Rights_Act_of_1964_desc:0 "La loi sur les droits civiques de 1964 interdit toute discrimination fondée sur la race, la couleur, la religion, le sexe ou l'origine nationale. Elle interdit également l'application inégale des conditions d'inscription sur les listes électorales, ainsi que la ségrégation raciale dans les écoles, l'emploi et les lieux publics."
 USA_jfk60_Revenue_Act_of_1964:0 "Loi sur les recettes de 1964"
 USA_jfk60_Revenue_Act_of_1964_desc:0 "La loi sur les revenus de 1964 réduira les impôts fédéraux sur le revenu d'environ vingt pour cent dans tous les domaines et abaissera le taux d'imposition fédéral le plus élevé de 91 pour cent à 70 pour cent."
 USA_jfk60_Food_Stamp_Act:0 "Loi sur les bons alimentaires"
 USA_jfk60_Food_Stamp_Act_desc:0 "La loi sur les bons d'alimentation donnera une autorité législative permanente au programme de bons d'alimentation, qui avait été introduit il y a quelques années à titre temporaire et qui a connu un énorme succès."
 USA_jfk60_Rollback_Steel_Prices:0 "Faire baisser les prix de l'acier"
 USA_jfk60_Rollback_Steel_Prices_desc:0 "Depuis la Seconde Guerre mondiale et les conflits les plus récents, le prix de l'acier est très élevé pour tous, mais surtout pour les entreprises civiles. Il est temps de le faire baisser."
 USA_jfk60_Economic_Opportunity_Act:0 "Loi sur les opportunités économiques"
 USA_jfk60_Economic_Opportunity_Act_desc:0 "L'EOA autorisera la formation d'agences d'action communautaire locales dans le cadre de la guerre contre la pauvreté, et le but de l'EOA est de renforcer, compléter et coordonner les efforts pour vaincre la pauvreté."
