l_english:
 mic_expansion:0 "Expansion du complexe militaro-industriel"
 unificaiton_elections_vie_veto:0 "Le Sud-Vietnam a opposé son veto aux élections de réunification"
 USA_Operation_Paperclip:0 "Operation Paperclip"
 USA_Operation_Paperclip_desc:0 "Bien qu'il puisse sembler légèrement de mauvais goût de compter sur nos anciens ennemis, Wernher Von Braun et ses collègues scientifiques allemands sont les meilleurs dans leur domaine – et nous avons besoin des meilleurs pour travailler sur notre programme de missiles balistiques."
 USA_Advanced_Military_Projects:0 "Projets militaires avancés"
 USA_Advanced_Military_Projects_desc:0 "De nouvelles découvertes sont faites chaque jour dans la recherche militaire, et il serait insensé de ne pas en tirer parti. Nous devrions augmenter le financement de notre recherche militaire."
 USA_Early_Ballistic_Missle_Developments:0 "Premiers développements en matière de missiles balistiques"
 USA_Early_Ballistic_Missle_Developments_desc:0 "Bien qu'il en soit encore à ses balbutiements, notre programme de missiles réalise des avancées spectaculaires. Nous devons exploiter au mieux ces nouvelles connaissances et les mettre à l'épreuve."
 USA_Atlas_Program:0 "Programme Atlas"
 USA_Atlas_Program_desc:0 "La division Convair de General Motors développe actuellement un nouvel ICBM et une fusée spatiale, baptisée Atlas. Ce sera le plus gros missile jamais lancé. Non seulement il peut transporter une ogive nucléaire, mais il est également capable de transporter un homme en orbite autour de la Terre."
 USA_Castle_Bravo:0 "Castle Bravo"
 USA_Castle_Bravo_desc:0 "Castle Bravo sera notre première bombe thermonucléaire utilisant du deutérure de lithium. C'est, à ce jour, l'arme la plus meurtrière jamais conçue. Les Soviétiques n'oseront plus nous attaquer !"
 USA_Condemn_British_Imperialism:0 "Condamner l'impérialisme britannique"
 USA_Condemn_British_Imperialism_desc:0 "La Grande-Bretagne continue de soutenir le régime Pahlavi uniquement dans son propre intérêt impérialiste. Nous devons agir et mettre un terme à cette politique afin de renforcer l'indépendance de l'Iran."
 USA_Foriegn_Aid_to_Iran:0 "Fournir une aide étrangère à l'Iran"
 USA_Foriegn_Aid_to_Iran_desc:0 "Malgré sa taille et sa population, l'Iran est terriblement sous-développé. Lui envoyer des fonds ne pourrait que nous être bénéfiques à tous les deux."
 USA_Redevelopment_of_the_Iranian_Armed_Forces:0 "Réaménager les forces armées iraniennes"
 USA_Redevelopment_of_the_Iranian_Armed_Forces_desc:0 "Outre sa faible économie, l'Iran dispose également d'une armée obsolète. Une restructuration et un réapprovisionnement de ses divisions sont nécessaires pour la mettre à niveau et l'adapter aux exigences de la guerre moderne."
 USA_The_Hungarian_Revolution:0 "La Révolution Hongroise"
 USA_The_Hungarian_Revolution_desc:0 "Le peuple hongrois a enfin vu la lumière et la promesse de la démocratie. Cependant, les Soviétiques, comme prévu, répriment les dissidents et occupent la capitale et ses environs. Devons-nous laisser passer la situation et simplement protester, ou risquons nous de déclencher une Troisième Guerre mondiale en lançant un ultimatum de retrait ?"
 USA_Diplomatic_Objections:0 "Objections diplomatiques"
 USA_Diplomatic_Objections_desc:0 "Il serait bien d'avoir un bastion de la démocratie au plus profond du rideau de fer ; mieux vaut maintenir la paix que risquer la guerre. Envoyer une objection est tout ce que nous pouvons faire, et il nous faudra attendre le moment opportun pour frapper le communisme."
 USA_Ultimatum_to_the_Soviets:0 "Ultimatum aux Soviétiques"
 USA_Ultimatum_to_the_Soviets_desc:0 "Les Soviétiques sont allés trop loin ! Ils avaient promis de ne pas s'immiscer dans les affaires des autres pays dès 1944, et ils ont violé cette promesse à maintes reprises. Il est de notre devoir d'assurer la survie du régime démocratique hongrois, et nous dirons aux Soviétiques de reculer, sinon ce sera la guerre."
 USA_Democracy_Restored_in_Hungary:0 "La démocratie restaurée en Hongrie"
 USA_Democracy_Restored_in_Hungary_desc:0 "Les Soviétiques ont reculé ! Notre politique de la corde raide de la semaine dernière a porté ses fruits. La Hongrie a retrouvé un gouvernement démocratique, et le rideau de fer est enfin fissuré. Qui sait combien de temps cela durera après cela ?"
 USA_Back_Down:0 "Reculer"
 USA_Back_Down_desc:0 "La raison a prévalu et nous a montré qu'il était peut-être imprudent de risquer la guerre et notre destruction à cause de la Hongrie. Nous perdrions la face et serions embarrassés à l'échelle mondiale. Mieux vaut survivre que s'enorgueillir."
 USA_The_Final_Struggle:0 "La lutte finale"
 USA_The_Final_Struggle_desc:0 "C'est fait. Les Soviétiques ont refusé de mettre fin à leur occupation de la Hongrie, ce que nous ne pouvons plus ignorer comme par le passé. Pour protéger la liberté et la démocratie, nous n'avons d'autre choix que de déclarer la guerre. Que Dieu nous protège dans cette terrible lutte pour le sort du monde et de l'humanité tout entière."
 USA_Arm_Israel_suez:0 "Armer Israël"
 USA_Arm_Israel_suez_desc:0 "Les événements récents ont prouvé qu'Israël est un allié précieux (voire le seul) au Moyen-Orient. Entouré de voisins hostiles, nous devons veiller à ce qu'il puisse se protéger en cas de besoin. Armer ses forces est un élément important de cette mission."
 USA_Support_Colonial_Powers_in_UN:0 "Soutenir les puissances coloniales à l'ONU"
 USA_Support_Colonial_Powers_in_UN_desc:0 "Après une campagne victorieuse, nos alliés ont repris le canal de Suez et repoussé les forces armées égyptiennes. Cependant, cela ne met pas fin au problème. Nous devons saisir l'ONU et régler ce problème une fois pour toutes."
 USA_Support_Britian:0 "Soutenir la Grande-Bretagne"
 USA_Support_Britian_desc:0 "Après de longs débats et de longues délibérations, nous avons décidé de soutenir nos alliés traditionnels dans la crise de Suez. Espérons qu'ils pourront reprendre le Sinaï et le canal sans trop de difficultés et que le Moyen-Orient retrouvera son calme."
 USA_Economic_Aid_For_Korea_and_Japan:0 "Envoyer une aide économique à la Corée et au Japon"
 USA_Economic_Aid_For_Korea_and_Japan_desc:0 "La Corée et le Japon sont deux des pays démocratiques les plus puissants du Pacifique. Nous devrions leur apporter une aide économique pour garantir leur force et leur capacité à se défendre."
 USA_Recognize_Reality:0 "Reconnaître la réalité"
 USA_Recognize_Reality_desc:0 "Malgré tous nos efforts, la situation en Chine est désespérée et a atteint le point de non-retour. Les communistes sont tout simplement trop puissants pour Tchang Kaï-Chek et ses forces nationalistes, et nous ne pouvons pas nous engager dans une nouvelle guerre à grande échelle. Malheureusement, il semble que la Chine soit sur le point de basculer."
 USA_Arm_Taiwan:0 "Armer Taïwan"
 USA_Arm_Taiwan_desc:0 "Une grande partie du matériel de l'Armée nationaliste a été perdue lors de la défaite et de l'évacuation ultérieure de Chine continentale. Nous devons réarmer la République de Taïwan afin qu'elle puisse continuer à soutenir ses forces armées."
 USA_Closer_Ties_to_MI6:0 "Établir des liens plus étroits avec le MI6"
 USA_Outreach_to_Ho_Chi_Minh:0 "Approche envers Hô Chi Minh"
 USA_Outreach_to_Ho_Chi_Minh_desc:0 "Hô Chi Minh et sa République démocratique du Vietnam ont vaincu les forces colonialistes françaises. Plutôt que de laisser le pays basculer dans la sphère d'influence soviétique, nous devrions tenter de prendre contact avec lui afin de trouver une solution au problème des deux États."
 USA_The_Unification_of_Vietnam:0 "L'unification du Vietnam"
 USA_The_Unification_of_Vietnam_desc:0 "Les négociations avec Hô Chi Minh et le Sud-Vietnam ont été un succès ! Il est temps pour nous de fusionner les deux États et de former un Vietnam fort, uni et indépendant."
 USA_Finlandization_of_Vietnam:0 "La finlandisation du Vietnam"
 USA_Finlandization_of_Vietnam_desc:0 "Hô Chi Minh s'est montré disposé au compromis, mais il reste, au fond, communiste. Afin d'éviter qu'il ne rejoigne le Pacte de Varsovie à la seconde où nous détournerons le regard, nous devrions finlandiser le pays : obliger le Vietnam à déclarer sa neutralité afin que personne n'intervienne et qu'il s'occupe de ses affaires."
 USA_Arm_Lebanon:0 "Armer le Liban"
 USA_Arm_Lebanon_desc:0 "« Bien que la situation du gouvernement libanais ne soit pas aussi précaire que celle de Saddam Hussein, il n'a pas encore de solution miracle. En soutenant son armée comme celle de la Jordanie, nous pouvons garantir qu'elle puisse protéger le Liban des menaces nasséristes. »"
 USA_Support_Nasser:0 "Soutenir Nasser"
 USA_Support_Nasser_desc:0 "Nasser apporte un vent de fraîcheur à l'Égypte, et il n'est peut-être pas aussi pro-démocratie que nous l'aurions souhaité, mais il n'est pas communiste. En le soutenant, nous pouvons garantir qu'il le reste."
 USA_Fund_the_Aswan_Dam:0 "Financer le barrage d'Assouan"
 USA_Fund_the_Aswan_Dam_desc:0 "Le barrage d'Assouan fera des miracles pour les agriculteurs et l'économie égyptienne en général. Il produira une grande quantité d'électricité, distribuera de l'eau dans tout le désert et constituera un atout majeur en termes de relations publiques pour nous deux. Il ne nous reste plus qu'à envoyer les fonds."
 USA_TRUMAN_The_Truman_Administration:0 "L'administration Truman"
 USA_TRUMAN_The_Truman_Administration_desc:0 "La première administration du président Truman se concentrera sur l’amélioration de la stabilité et de la sécurité intérieures, ainsi que sur la poursuite de certains des programmes et politiques du défunt président Roosevelt."
 USA_TRUMAN_Fair_Labor_Standards_Amendment:0 "Modifier les normes du travail équitables"
 USA_TRUMAN_Fair_Labor_Standards_Amendment_desc:0 "L'amendement sur les normes du travail équitables modifiera la loi de 1938, en augmentant le salaire minimum et en étendant les lois sur la protection du travail des enfants."
 USA_TRUMAN_Central_Intelligence_Agency_Act:0 "Loi sur la CIA"
 USA_TRUMAN_Central_Intelligence_Agency_Act_desc:0 "La loi sur la CIA fera de la CIA une branche gouvernementale quasi indépendante, lui permettant de garder secrets ses archives et ses agents, et lui octroyant des fonds quasi illimités. Enthousiasmant ? Oui. Inconstitutionnel ? Peut-être."
 USA_TRUMAN_Agricultural_Act_of_1949:0 "Loi agricole de 1949"
 USA_TRUMAN_Agricultural_Act_of_1949_desc:0 "La loi agricole de 1949 permettra de faire don des surplus alimentaires aux pays qui en ont besoin et fournira une assistance aux États pour la mise en place de programmes de repas scolaires."
 USA_TRUMAN_Omnibus_Medical_Research_Act:0 "Loi omnibus sur la recherche médicale"
 USA_TRUMAN_Omnibus_Medical_Research_Act_desc:0 "La loi omnibus sur la recherche médicale créera le NIH(Institut national de l'arthrite et des maladies métaboliques). Elle autorisera également le médecin généraliste à mettre en place un programme consultatif national."
 USA_TRUMAN_Defense_Production_Act_of_1950:0 "Loi sur la production de défense de 1950"
 USA_TRUMAN_Defense_Production_Act_of_1950_desc:0 "En réponse au déclenchement de la guerre de Corée, nous devrions adopter la DPA. Elle permet au président Truman d'interdire la thésaurisation et les prix abusifs, de contraindre les entreprises à privilégier les produits et contrats militaires, et de réquisitionner des biens, entre autres. Elle autorise également le Département de la Défense à accorder des prêts sans intérêt pour aider les entreprises essentielles à l'effort de guerre."
 USA_TRUMAN_Housing_Act:0 "Loi sur le logement"
 USA_TRUMAN_Housing_Act_desc:0 "La loi sur le logement prévoit des fonds pour la résorption des bidonvilles et la rénovation urbaine. Elle accorde également davantage d'autorisations aux programmes hypothécaires fédéraux et davantage de financement à la recherche sur les techniques de construction."
 USA_TRUMAN_National_Science_Foundation_Act:0 "Loi sur la Fondation Nationale des Sciences"
 USA_TRUMAN_National_Science_Foundation_Act_desc:0 "La loi NSF établira la NSF, une agence gouvernementale indépendante qui promeut et soutient tous les domaines de recherche, des mathématiques et de l'informatique aux sciences sociales et à l'économie."
 USA_TRUMAN_The_Kefauver_Hearings:0 "Les audiences Kefauver"
 USA_TRUMAN_The_Kefauver_Hearings_desc:0 "Les auditions Kefauver font partie de l'enquête du Sénat sur le crime organisé dans le commerce interétatique, et le sénateur Estes Kefauver est à la tête de l'enquête. Nous voulons découvrir combien d'organisations criminelles existent aux États-Unis.\nHé… N'est-ce pas le travail du FBI ?"
 USA_TRUMAN_McCarran_Internal_Security_Act:0 "Loi McCarran sur la sécurité intérieure"
 USA_TRUMAN_McCarran_Internal_Security_Act_desc:0 "La loi McCarran sur la sécurité intérieure obligera les organisations communistes à s'enregistrer auprès du procureur général et à fournir des informations financières. De plus, elle autorisera le président à appréhender et à détenir les personnes soupçonnées de conspirer, ou susceptibles de conspirer, en vue de saboter ou d'espionner les États-Unis.\nDe quelle peur rouge parlez-vous ? Personne n'a jamais parlé de peur rouge !"
 USA_TRUMAN_Anti_Merger_Act:0 "Loi anti-fusion"
 USA_TRUMAN_Anti_Merger_Act_desc:0 "La loi anti-fusion comblera une lacune de la loi antitrust Clayton de 1914, qui permettait aux entrepreneurs d'acquérir les actifs d'un concurrent plutôt que de l'acquérir directement pour obtenir ainsi un monopole. Elle donnera également au gouvernement le pouvoir d'empêcher l'intégration verticale et les fusions conglomérales."
 USA_TRUMAN_Social_Security_Act_of_1950:0 "Loi sur la sécurité sociale de 1950"
 USA_TRUMAN_Social_Security_Act_of_1950_desc:0 "La loi sur la sécurité sociale de 1950 est un autre amendement à la loi originale sur la sécurité sociale de 1935. Elle prolonge la durée de vie de la loi, augmente les prestations pour la première fois et introduit des ajustements du coût de la vie dans le programme."
 USA_TRUMAN_Propose_National_Healthcare_System:0 "Proposer un système national de santé"
 USA_TRUMAN_Propose_National_Healthcare_System_desc:0 "Dans de nombreuses zones rurales et à faibles revenus, il n'existe ni hôpitaux, ni même de médecins. De plus, les services de santé publique sont inadéquats et manquent de financement. La création d'un système national de santé pourrait améliorer la situation."
 USA_TRUMAN_Crackdown_on_Strikers:0 "Répression des grévistes"
 USA_TRUMAN_Crackdown_on_Strikers_desc:0 "Les travailleurs d'U.S. Steel et d'autres entreprises sidérurgiques importantes, vitales pour l'économie civile et militaire du pays, prévoient de faire grève. En tentant de nationaliser les usines où ils travaillent, nous pouvons tenter de mettre fin à la grève avant qu'elle ne commence."
 USA_TRUMAN_Tax_Relief_for_the_Poor:0 "Allègement fiscal pour les pauvres"
 USA_TRUMAN_Tax_Relief_for_the_Poor_desc:0 "Il y a malheureusement beaucoup de pauvres aux États-Unis. Leur accorder des allégements fiscaux leur permettra non seulement, à eux et à leurs familles, de respirer un peu, mais aussi de disposer de plus d'argent à réinvestir dans l'économie."
 USA_TRUMAN_McCarran_Walter_Act:0 "Loi McCarran-Walter"
 USA_TRUMAN_McCarran_Walter_Act_desc:0 "La loi McCarran Walter maintiendra le statu quo ethnique du pays et empêchera l'influence déstabilisatrice des communistes, des « intérêts juifs » et d'autres indésirables en créant des quotas d'immigration stricts basés sur l'origine ethnique et la région, ainsi que sur les qualifications professionnelles."
 USA_TRUMAN_Propose_Civil_Rights_Legislation:0 "Proposer une législation sur les droits civiques"
 USA_TRUMAN_Propose_Civil_Rights_Legislation_desc:0 "Après la déségrégation des forces armées, nous pouvons prendre de nombreuses autres mesures pour améliorer les droits des Afro-Américains et obtenir leur droit de vote. Ils sont réprimés dans presque tous les milieux sociaux, et les tensions raciales sont vives. Nous devons agir."
 USA_TRUMAN_The_McGuire_Act:0 "La loi McGuire"
 USA_TRUMAN_The_McGuire_Act_desc:0 "La loi McGuire élargira la loi Miller-Tydings de 1937, qui autorise les États à adopter des lois sur le commerce équitable afin de protéger les petites entreprises contre la fixation verticale des prix. Cette exception est nécessaire pour contourner la loi antitrust Sherman."
 USA_TRUMAN_Expand_Funding_for_Eletrification_Programs:0 "Augmenter le financement des programmes d'électrification"
 USA_TRUMAN_Expand_Funding_for_Eletrification_Programs_desc:0 "À notre époque, l'électricité est absolument essentielle pour tous, partout. Nous sommes en train de déployer l'électricité dans tout le pays, mais nous avons besoin de davantage de fonds pour y parvenir efficacement."
 USA_TRUMAN_Mutual_Security_Act:0 "Loi sur la sécurité mutuelle"
 USA_TRUMAN_Mutual_Security_Act_desc:0 "La loi sur la sécurité mutuelle de 1951 fait suite à celle de 1949. Elle créera une nouvelle agence chargée de superviser le plan Marshall et de superviser les programmes d’aide étrangère, tant militaires qu’économiques, afin de garantir que nous ayons des alliés capables de défendre le monde contre la menace rouge."
 USA_TRUMAN_Calm_Political_Tensions:0 "Calmer les tensions politiques"
 USA_TRUMAN_Calm_Political_Tensions_desc:0 "Entre tous les communistes, les éléments radicaux et l'angoisse générale suscitée par la Guerre froide et l'orientation de notre pays, les tensions politiques sont vives. Nous devons désamorcer la situation avant que la situation ne dégénère et ne provoque de véritables dégâts."
 USA_TRUMAN52_The_Truman_Administration:0 "L'administration Truman"
 USA_TRUMAN52_The_Truman_Administration_desc:0 "Pour son second mandat, le président Truman s'efforcera de poursuivre les programmes qu'il a commencé à promouvoir en 1948, ainsi que d'accroître le financement de la recherche et d'accroître la stabilité aux États-Unis."
 USA_TRUMAN52_Invest_in_Science:0 "Investir dans la science"
 USA_TRUMAN52_Invest_in_Science_desc:0 "La science est un domaine d'avenir important dans le monde moderne. Nous devons intensifier nos efforts pour sensibiliser le public et multiplier les possibilités de la pratiquer."
 USA_TRUMAN52_Expand_School_Lunch_Programs:0 "Développer les programmes de repas scolaires"
 USA_TRUMAN52_Expand_School_Lunch_Programs_desc:0 "Le programme de repas scolaires a rencontré un franc succès et s'est avéré essentiel pour certains de nos systèmes scolaires ruraux. Nous devrions en tirer parti et développer ce type de programmes."
 USA_TRUMAN52_Repeal_Taft_Hartley:0 "Abroger la loi Taft-Hartley"
 USA_TRUMAN52_Repeal_Taft_Hartley_desc:0 "La loi Taft-Hartley de 1947 limitait les syndicats et, dans certains cas, les interdisait purement et simplement. Nous pensons que chacun devrait pouvoir se syndiquer aussi facilement que possible ; nous devons donc l'abroger immédiatement."
 USA_TRUMAN52_Social_Security_Act_of_1953:0 "Loi sur la sécurité sociale de 1953"
 USA_TRUMAN52_Social_Security_Act_of_1953_desc:0 "La SSA de 1953 augmentera les prestations pour les personnes âgées et les survivants, prolongera les crédits de salaire pour le service militaire et mettra davantage de fonds à la disposition du gouvernement fédéral."
 USA_TRUMAN52_Refugee_Relief_Ac:0 "Loi sur l'aide aux réfugiés"
 USA_TRUMAN52_Refugee_Relief_Ac_desc:0 "De nombreuses personnes à travers le monde sont déplacées par des conflits violents et cherchent désespérément un refuge. Nous devons les aider en leur apportant une aide, à elles et à leurs pays."
 USA_TRUMAN52_Expand_The_Rural_Eletrification_Program:0 "Développer le programme d'électrification rurale"
 USA_TRUMAN52_Expand_The_Rural_Eletrification_Program_desc:0 "Même si nous avons commencé à électrifier les zones rurales, nous sommes loin d'avoir terminé. Nous devons intensifier nos efforts pour étendre l'électricité à tout le pays."
 USA_TRUMAN52_Empower_Trade_Unions:0 "Renforcer les syndicats"
 USA_TRUMAN52_Empower_Trade_Unions_desc:0 "Les syndicats sont un élément important de notre économie, et pendant trop longtemps, ils ont été mis à l'écart ou réprimés. Nous devons leur donner les moyens de défendre leurs droits."
 USA_TRUMAN52_Small_Buisness_Act:0 "Loi sur les petites entreprises"
 USA_TRUMAN52_Small_Buisness_Act_desc:0 "Les petites entreprises sont essentielles à presque toutes les villes, quelle que soit la taille de leur population. Face à la montée en puissance des grandes entreprises, nous devons veiller à leur protection."
 USA_TRUMAN52Expand_Medical_Access:0 "Élargir l'accès aux soins médicaux"
 USA_TRUMAN52Expand_Medical_Access_desc:0 "L'accès aux soins de santé et aux hôpitaux est trop important pour être absent ou hors de portée de nombreux Américains. Nous devons remédier à cela."
 USA_TRUMAN52_Federal_National_Mortgage_Association_Charter_Act:0 "Loi sur la charte de la FNMA"
 USA_TRUMAN52_Federal_National_Mortgage_Association_Charter_Act_desc:0 "Chaque famille devrait pouvoir se permettre d'avoir sa propre maison, mais pour beaucoup, c'est trop cher. En créant une association hypothécaire fédérale, nous pouvons aider les familles démunies à trouver un logement."
 USA_TRUMAN52_Enforce_Brown_vs_Board_of_Education:0 "Appliquer l'arrêt Brown v. Board of Education"
 USA_TRUMAN52_Enforce_Brown_vs_Board_of_Education_desc:0 "La Cour suprême a jugé la ségrégation scolaire inconstitutionnelle, mais de nombreux gouverneurs et systèmes scolaires refusent de la mettre en œuvre. C'est un scandale, et ils doivent comprendre une fois pour toutes que tous les hommes naissent égaux."
 USA_TRUMAN52_Enforce_Fair_Labor_Standards:0 "Appliquer d'avantage les normes de travail équitables"
 USA_TRUMAN52_Enforce_Fair_Labor_Standards_desc:0 "Malgré l’adoption du précédent amendement sur les normes du travail équitables, il existe toujours un manque important de réglementation dans de nombreuses entreprises à travers les États-Unis. Nous devons appliquer l’amendement avec un langage plus dur et plus clair."
 USA_TRUMAN52_Internal_Revenue_Code_of_1954:0 "Code des impôts de 1954"
 USA_TRUMAN52_Internal_Revenue_Code_of_1954_desc:0 "Le Code des impôts de 1954 sera la première refonte majeure de notre système fiscal depuis sa création en 1913. Il y a tellement de lacunes et de faiblesses dans le code que nous ne pouvons plus les laisser en l'état."
 USA_TRUMAN52_Begin_Space_Research:0 "Commencer la recherche spatiale"
 USA_TRUMAN52_Begin_Space_Research_desc:0 "L'espace : l'ultime frontière ! Il a toujours captivé notre imagination et, grâce aux nouveaux développements, il sera bientôt à notre portée. Nous devons développer la recherche spatiale sans tarder."
 USA_TRUMAN52_A_Quarter_Century_of_Progress:0 "Un quart de siècle de progrès"
 USA_TRUMAN52_A_Quarter_Century_of_Progress_desc:0 "Depuis la fin de la Grande Dépression et le début de la Seconde Guerre mondiale, notre économie est devenue la plus forte du monde et ne cesse de croître. Félicitations !"
 USA_TRUMAN52_Federal_Infrastructure_Reform_Act:0 "Loi sur la réforme des infrastructures fédérales"
 USA_TRUMAN52_Federal_Infrastructure_Reform_Act_desc:0 "La loi fédérale sur la réforme des infrastructures réduira les taxes sur l’essence et réduira le programme fédéral d’autoroutes pour se concentrer uniquement sur les projets interétatiques."
 USA_TRUMAN52_Modernize_the_Postal_Service:0 "Moderniser le service postal"
 USA_TRUMAN52_Modernize_the_Postal_Service_desc:0 "Le service postal est essentiel au bon fonctionnement de notre pays. Pourtant, il est largement obsolète, et dépend encore des chevaux dans certaines régions reculées. Nous devons le remettre aux normes modernes du milieu du XXe siècle."
 USA_TRUMAN52_Appeal_to_the_Dixiecrats:0 "Faire appel aux Dixiecrats"
 USA_TRUMAN52_Appeal_to_the_Dixiecrats_desc:0 "Les Dixiecrats – ou Démocrates du Sud – constituent un élément important de la coalition du Parti démocrate. Nombre d'entre eux sont plutôt alarmés par la déségrégation qui sévit aux États-Unis et menacent de quitter le parti. Nous devons les assurer que leurs intérêts restent à notre cœur."
 USA_TRUMAN52_Expand_Missile_Research:0 "Développer la recherche sur les missiles"
 USA_TRUMAN52_Expand_Missile_Research_desc:0 "La recherche sur les missiles est essentielle pour concurrencer les Soviétiques dans le ciel, ainsi que pour la recherche sur les vecteurs d'armes nucléaires. Nous devons maintenir notre programme à un niveau élevé."
 USA_TRUMAN52_Continue_New_Deal_Economic_Policies:0 "Poursuivre les politiques économiques du New Deal"
 USA_TRUMAN52_Continue_New_Deal_Economic_Policies_desc:0 "Dès les années 1930, feu le président Roosevelt a introduit une politique économique radicalement nouvelle : le New Deal. Depuis, elle a fait des merveilles, et il est dans notre intérêt de poursuivre les politiques du New Deal."
 USA_Rocket_Advancements:0 "Intensifier les recherches sur les fusées"
 USA_Rocket_Advancements_desc:0 "Nous devons intensifier nos recherches sur le développement et la conception de fusées. C'est un domaine d'étude important et nous ne pouvons pas laisser nos recherches prendre du retard sur celles des Soviétiques."
 USA_Suez_Crisis:0 "La crise de Suez"
 USA_Suez_Crisis_desc:0 "L'Égypte a nationalisé le canal de Suez et menace les voies d'approvisionnement et de navigation d'Israël. Israël, la Grande-Bretagne et la France préparent une contre-offensive. Qui soutenir : Israël ou l'Égypte ? Ou vaut-il mieux rester discret et observer la situation ?"
 USA_Formosa_Decleration:0 "Déclaration de Formose"
 USA_Formosa_Decleration_desc:0 "Alors que la situation commençait à se calmer, la RPC a commencé à lancer des raids sur les îles du détroit de Taïwan. Nous devons assurer les nationalistes que nous prendrons leur défense en cas d'aggravation des hostilités et donner au président le pouvoir constitutionnel de le faire."
 USA_Develop_Taiwanese_Industry:0 "Développer l'industrie taïwanaise"
 USA_Develop_Taiwanese_Industry_desc:0 "Taïwan ne représente qu'une fraction de la taille de la Chine continentale, et pourtant, c'est tout ce qui reste au gouvernement de Chiang Kai-Shek. Nous devons optimiser son industrie afin que les Taïwanais puissent relancer leur économie après la guerre."
 USA_Strengthen_NATO_Members:0 "Renforcer les membres de l'OTAN"
 USA_Elections_of_1956:0 "Élections de 1956"
 USA_Creation_of_the_CIA:0 "Élargir la portée de la CIA"
 USA_Creation_of_the_CIA_desc:0 "La CIA sera une arme cruciale dans la guerre pour la survie de la démocratie dans un avenir proche. Nous devons étendre son influence et ses capacités afin qu'elle puisse mieux défendre nos intérêts à travers le monde."
 USA_The_Free_Officier_Coup:0 "Le coup d'État des officiers libres"
 USA_The_Free_Officier_Coup_desc:0 "Gamel Abdel Nasser et ses acolytes ont renversé le roi Farouk. Reste à savoir si c'est une bonne chose. Mais une chose est claire : nous pouvons soit reconnaître Nasser et sa nouvelle forme de nationalisme panarabe, soit la rejeter comme extrémiste et fortifier la région environnante contre lui."
 USA_Arm_Jordan:0 "Armer la Jordanie"
 USA_Arm_Jordan_desc:0 "Le roi Hussein demeure amical à notre égard – pour l'instant. Nous devons agir et stabiliser son régime avant que la propagande nassériste ne provoque un nouveau coup d'État. Soutenir ses forces loyalistes contribuera grandement à améliorer nos relations et sa position."
 USA_An_Offer_to_Jordan:0 "Une offre à la Jordanie"
 USA_Preparation_for_Honduras_Coup:0 "Préparer le coup d'État en Honduras"
 USA_Preparation_for_Honduras_Coup_desc:0 "Le gouvernement hondurien s'est montré méfiant ces derniers temps. Des rumeurs circulent selon lesquelles le droit du travail serait en voie de libéralisation, et des sympathisants communistes seraient infiltrés au sein du gouvernement. Des éléments conservateurs au Honduras souhaitent se débarrasser de ce cabinet crypto-communiste. Peut-être devrions-nous soutenir cette initiative ?"
 USA_Support_the_Pahlavi_Regime:0 "Développer la fabrication d'armes iraniennes"
 USA_Support_the_Pahlavi_Regime_desc:0 "Maintenant que nous avons stabilisé la monarchie Pahlavi, il est temps d'améliorer ses capacités de production d'armes. Le Shah doit pouvoir soutenir une armée capable de défendre le gouvernement que nous avons tant œuvré à soutenir."
 USA_undermine_Sukarno:0 "Saper Sukarno"
 USA_Launch_Coup_in_Indonesia:0 "Coup d'État en Indonésie"
 USA_Support_the_indonesian_uprising:0 "Soutenir le soulèvement indonésien"
 USA_Operation_Condor:0 "Opération Condor"
 USA_Mutual_Security_Act:0 "Loi sur la sécurité mutuelle"
 USA_The_Southern_Cone:0 "Le Cône Sud"
 USA_Assurances_in_Gran_Colombia:0 "Assurances en Grande Colombie"
 USA_Coup_in_Brazil:0 "Coup d'État au Brésil"
 USA_Support_Pro_American_Regimes:0 "Soutenir les régimes pro-américains"
 USA_Support_Israeli_Weapons_Production:0 "Soutenir la production d'armes israélienne"
 USA_Support_Egypt_in_UNSC:0 "Soutenir l'Égypte au Conseil de sécurité de l'ONU"
 USA_Support_Egypt_in_UNSC_desc:0 "Maintenant que l'Égypte a gagné sur le terrain, nous devons veiller à ce que notre nouvel allié conserve ses territoires durement gagnés lors des négociations de l'ONU. Ce sera difficile, car de nombreux membres souhaitent simplement maintenir le statu quo, notamment la Grande-Bretagne et la France, mais nous ferons tout notre possible."
 USA_Pressure_Britain:0 "Faire pression sur la Grande-Bretagne"
 USA_Pressure_Britain_desc:0 "La Grande-Bretagne doit reconnaître que l'ordre mondial est en constante évolution et que son rôle y diminue sans cesse. La perte du canal n'est que la prochaine étape de ce processus. Nous devons intensifier nos efforts diplomatiques pour leur faire comprendre que le soleil se couche bel et bien sur l'Empire britannique."
 USA_Adlai_Stevenson_II_56:0 "Adlai Stevenson 1956"
 USA_Manufacturing_Subsidies:0 "Subventions à la production"
 USA_Post_War_China:0 "La Chine d'après-guerre"
 USA_Promote_De_Armament:0 "Promouvoir le désarmement"
 USA_intervene_in_indonesia:0 "Intervenir en Indonésie"
 USA_intervene_in_indonesia_desc:0 "Même si Sukarno et ses partisans communistes réussissent bien contre les Indes néerlandaises, cela ne durera pas longtemps. Nous devons nous joindre à la guerre et empêcher sa révolution de prendre son envol."
 USA_intervene_in_malaysia:0 "Intervenir en Malaisie"
 USA_intervene_in_vietnam:0 "Intervenir au Vietnam"
 USA_intervene_in_vietnam_desc:0 "Les Français semblent incapables d'écraser une petite rébellion communiste au Nord-Vietnam. Peu importe. En rejoignant le combat, nous pouvons écraser Hô Chi Minh rapidement, efficacement et, si nécessaire, sans pitié."
 USA_Second_Chinese_Civil_War:0 "Seconde guerre civile chinoise"
 USA_The_Truman_Doctrine:0 "La doctrine Truman"
 USA_The_Truman_Doctrine_desc:0 "La doctrine Truman est la politique du président envers l'Union soviétique. Elle stipule que nous devons contenir, stopper et enrayer la propagation du §RCommunisme§! à tout prix, partout et à tout moment. Pour ce faire, nous devons protéger nos alliés, affronter les Soviétiques et, si nécessaire, respecter la morale afin de garantir que la §CDémocratie§!,d'ici à la maison vers l'Europe et l'Asie au-delà."
 USA_Landrum_Griffin_Act:0 "Loi Landrum-Griffin"
 USA_Communist_Control_Act:0 "Loi sur le contrôle communiste"
 USA_Domino_Theory:0 "Théorie des dominos"
 USA_Found_ARPA:0 "Créer l'ARPA"
 USA_Internal_Affairs:0 "Affaires intérieures"
 USA_Elections_of_1952:0 "Élections de 1952"
 USA_Estes_Kefauver_56:0 "Estes Kefauver 1956"
 USA_Atomic_Investments:0 "Investissements atomiques"
 USA_Criminal_Justice_Reforms:0 "Réformer la justice pénale"
 USA_Support_The_British_Empire:0 "Soutenir l'Empire britannique"
 USA_Support_The_British_Empire_desc:0 "Maintenant que le MLA est vaincu, nous pouvons nous concentrer sur le soutien à l’Empire britannique dans ses efforts pour maintenir son emprise sur les colonies qu’il possède encore, que ce soit dans le Pacifique, l’Atlantique ou l’Afrique."
 USA_Stabilize_European_Empires:0 "Stabiliser les empires européens"
 USA_Stabilize_European_Empires_desc:0 "Avec toutes les révolutions en territoire colonial, la stabilité en Europe est très précaire. Cette faible stabilité et cette forte instabilité engendrent un soutien communiste, ce qui est impossible. Nous devons aider ces pays à se relever de leurs guerres."
 USA_Supply_European_Empires:0 "Approvisionner les empires européens"
 USA_Supply_European_Empires_desc:0 "L'une des raisons du succès de ces rébellions est la grande difficulté pour ces pays d'approvisionner leur police et leurs forces armées dans des pays aussi éloignés. En augmentant leurs stocks de biens et d'armes, nous pouvons remédier à ce problème."
 USA_support_for_south_vietnam:0 "Soutenir le Sud-Vietnam"
 USA_support_for_south_vietnam_desc:0 "Un autre pays d'Asie du Sud-Est est passé au rouge, mais nous gardons espoir dans l'État vietnamien. En le soutenant par des armes et une aide économique, nous pouvons le renforcer pour l'inévitable affrontement avec son voisin du nord."
 USA_Advisors_to_South_Vietnam:0 "Envoyer des conseillers au Sud-Vietnam"
 USA_Advisors_to_South_Vietnam_desc:0 "Envoyer des armes à l'ARVN ne suffit pas. Nous devons envoyer des conseillers militaires pour former leurs troupes à la tactique et leurs officiers à la stratégie, afin qu'ils aient une chance de vaincre Hô Chi Minh et ses guérilleros."
 USA_Support_India:0 "Soutenir l'Inde"
 USA_Support_India_desc:0 "L'Inde et le Pakistan sont en conflit depuis le départ des Britanniques. Il est clair que nous ne pouvons pas soutenir les deux pays, et se ranger du côté de l'Inde est le meilleur choix."
 USA_support_for_India:0 "Des armes pour l'Inde"
 USA_support_for_India_desc:0 "Après avoir publiquement déclaré notre soutien, nous devons agir concrètement pour protéger la situation des Indiens. Fournir leur armée y parviendra."
 USA_Advisors_to_India:0 "Envoyer des conseillers en Inde"
 USA_Advisors_to_India_desc:0 "Maintenant que leurs troupes sont armées, la prochaine étape pour nous est de former des officiers indiens pour les diriger, ainsi que d’apprendre à chacun comment utiliser leurs nouveaux outils."
 USA_Decolonization_of_Africa:0 "Décolonisation de l'Afrique"
 USA_Decolonization_of_Africa_desc:0 "L'Afrique a été le théâtre des pires exactions coloniales et demeure le continent le plus soumis. Il est temps pour la Grande-Bretagne, la France et la Belgique de renoncer à leurs anciennes colonies et de laisser l'Afrique aux Africains."
 USA_Algerian_war_of_independence:0 "La guerre d'indépendance algérienne"
 USA_Algerian_war_of_independence_desc:0 "Fatigué d'être opprimé par le gouvernement français, le peuple algérien s'est soulevé. Même si nous n'interviendrons pas directement, nous devons surveiller la situation afin d'éviter qu'elle ne dégénère."
 USA_Peace_in_Algeria:0 "Paix en Algérie"
 USA_Peace_in_Algeria_desc:0 "Cette guerre a assez duré. La France doit reconnaître que l'ère coloniale est révolue depuis longtemps, et nous devons faire pression sur elle pour qu'elle le comprenne. L'Algérie obtiendra enfin son indépendance."
 USA_Return_Treaty_Ports_to_the_Peoples_Republic_of_China:0 "Restituer les ports du traité à la RPC"
 USA_Return_Treaty_Ports_to_the_Republic_of_China:0 "Restituer les ports du traité au KMT"
 USA_Support_Pakistan:0 "Soutenir le Pakistan"
 USA_Support_Pakistan_desc:0 "L'Inde et le Pakistan sont en conflit depuis le départ des Britanniques. Il est clair que nous ne pouvons pas soutenir les deux pays, et se ranger du côté du Pakistan est le meilleur choix."
 USA_support_for_Pakistan:0 "Des armes pour le Pakistan"
 USA_support_for_Pakistan_desc:0 "Après avoir publiquement déclaré notre soutien, nous devons agir concrètement pour protéger la situation des Pakistanais. Fournir leur armée y parviendra."
 USA_Advisors_to_Pakistan:0 "Envoyer des conseillers au Pakistan"
 USA_Advisors_to_Pakistan_desc:0 "Maintenant que leurs troupes sont armées, la prochaine étape pour nous est de former des officiers indiens pour les diriger, ainsi que d’apprendre à chacun comment utiliser leurs nouveaux outils."
 USA_Department_of_Defense:0 "Département de la Défense"
 USA_Department_of_Defense_desc:0 "Alors que la situation mondiale semble de plus en plus tendue, il est temps de revoir nos forces armées, de concentrer nos recherches et d'améliorer nos doctrines. Cela sera crucial dans le prochain affrontement avec le communisme."
 USA_Department_of_the_Navy:0 "Département de la Marine"
 USA_Department_of_the_Navy_desc:0 "La marine américaine est le moyen par lequel nous avons traditionnellement projeté notre puissance et notre présence à travers le monde. Cependant, avec les progrès technologiques en matière d'aviation et de missiles, nous devons décider si elle conservera ce rôle ou s'en écartera."
 USA_Department_of_the_Airforce:0 "Département de l'armée de l'air"
 USA_Department_of_the_Airforce_desc:0 "L'armée de l'air est la branche la plus récente de nos forces armées et, à certains égards, la plus importante. La dernière Guerre mondiale a démontré l'importance cruciale de la couverture et du soutien aériens, et de nouveaux bombardiers à long rayon d'action renforcent chaque jour nos capacités de frappe."
 USA_Fighter_focus:0 "Développements des chasseurs"
 USA_Fighter_focus_desc:0 "En recherchant et en produisant de nouvelles variantes et conceptions d’avions de combat, nous pouvons améliorer la capacité de notre armée de l’air à garantir un ciel propre et convivial à nos troupes au sol."
 USA_Bomber_focus:0 "Développements des bombardiers"
 USA_Bomber_focus_desc:0 "En recherchant et en produisant de nouvelles variantes et de nouveaux modèles de bombardiers, nous pouvons améliorer la capacité de notre armée de l'air à effectuer des frappes à longue distance et des bombardements stratégiques."
 USA_Respond_to_Puerto_Rican_Nationalism:0 "Répression du nationalisme portoricain"
 USA_Puerto_Rican_Statehood:0 "État portoricain"
 USA_The_Korean_War:0 "La guerre de Corée"
 USA_The_Korean_War_desc:0 "La guerre a éclaté ! La Corée du Nord et la Corée du Sud se livrent une lutte à mort, et il nous appartient de faire en sorte que les forces de la démocratie l'emportent. Nous devons tout mettre en œuvre pour aider Syngman Rhee et son gouvernement, que ce soit par le biais du prêt-bail ou du volontariat."
 USA_Turkish_Straits_Crisis:0 "La crise des détroits turcs"
 USA_Turkish_Straits_Crisis_desc:0 "Les Soviétiques font pression sur les Turcs pour qu'ils leur cèdent les détroits et leur donnent accès à la Méditerranée. Cela porterait un coup dur à la position de l'OTAN en Europe, et nous ne pouvons pas le tolérer. Bien que la Turquie soit neutre, nous devons faire savoir aux Turcs que nous les soutenons. L'URSS doit être freinée."
 USA_economic_aid_to_turkey:0 "Envoyer une aide économique à la Turquie"
 USA_economic_aid_to_turkey_desc:0 "Ce ne sera pas la dernière fois que les Soviétiques attaqueront les Détroits ou la Turquie. En développant l'économie turque et en lui offrant un soutien financier, nous pouvons garantir qu'elle sera mieux en mesure de se défendre que cette fois-ci."
 USA_Containment:0 "Endiguement"
 USA_Containment_desc:0 "Certes, nous ne pouvons pas engager directement les Soviétiques dans un conflit de grande ampleur, mais nous pouvons au moins nous assurer de disposer des moyens de les menacer sérieusement si nous y sommes contraints. L'augmentation de notre production militaire et de nos recherches sur les missiles nous sera bénéfique à cet égard."
 USA_Mobilize_Against_the_Soviets:0 "Augmenter la production d'armes"
 USA_Mobilize_Against_the_Soviets_desc:0 "Notre armée est relativement importante, mais elle fait pâle figure face à la puissante Armée rouge. Nous devons accroître notre production d'armes et d'autres véhicules militaires pour tenter de rattraper les Soviétiques sur le terrain."
 USA_An_Arms_Race:0 "Une course aux armements"
 USA_An_Arms_Race_desc:0 "S'il s'avère impossible de rattraper les Soviétiques au sol, nous devons nous assurer de conserver l'avantage dans le ciel et la haute atmosphère. L'intensification de la recherche en fusées y contribuera."
 USA_Decleration_of_Conscience:0 "Déclaration de conscience"
 USA_Decleration_of_Conscience_desc:0 "Récemment, la sénatrice Margaret Chase Smith (Maine) a prononcé un discours critiquant le gouvernement et ses tactiques lors des auditions de McCarthy. Elle n'a nommé personne, et on comprend aisément où elle voulait en venir. McCarthy doit partir."
 USA_The_Hollywood_Witch_Hunt:0 "La chasse aux sorcières d'Hollywood"
 USA_The_Hollywood_Witch_Hunt_desc:0 "La rumeur court qu'Hollywood regorge de communistes répugnants ! Les communistes lavent le cerveau de nos enfants sous couvert de films mignons et divertissants ! Il faut démasquer ces traîtres et les éliminer avant qu'ils ne retournent notre précieuse jeunesse contre la gloire de la liberté ! En avant, pour la démocratie !"
 USA_Fall_of_the_Mainland:0 "Chute de la Chine"
 USA_Fall_of_the_Mainland_desc:0 "La République populaire de Chine a remporté la guerre civile, mais cela ne signifie pas que tout est perdu. En reconnaissant le gouvernement nationaliste de Taïwan, nous pouvons assurer sa survie et conserver notre position en mer de Chine méridionale."
 USA_Peace_Fails:0 "La paix échoue"
 USA_Peace_Succeeds:0 "La paix réussit"
 USA_Support_Israel:0 "Soutenir Israël"
 USA_Support_Israel_desc:0 "Israël a été notre ami depuis son indépendance en 1948. Nos alliés dans la région sont rares, et nous serions insensés de nous aliéner une démocratie stable qui tend la main aux puissances occidentales. Les États-Unis comptent également une importante diaspora juive, et ils apprécieraient certainement notre soutien à leurs frères juifs lors des élections."
 USA_Support_Egypt:0 "Soutenir l'Égypte"
 USA_Support_Egypt_desc:0 "Il est temps de soutenir un nouveau cheval au Moyen-Orient. Nasser est charismatique et influent dans le monde arabe, et nous avons besoin de son pétrole et de son accès au territoire. De plus, il est bon d'avoir un allié plus agressif et qui n'a pas peur d'agir, contrairement à nos camarades européens."
 USA_Ignore_the_Crisis:0 "Ignorer la crise"
 USA_Ignore_the_Crisis_desc:0 "Le canal de Suez est loin. De plus, notre navigation n'est pas affectée par toute cette mascarade. Laissons les deux camps s'affronter, et nous observerons la situation depuis la ligne de touche, comme le font les Soviétiques. Nous avons d'autres chats à fouetter et nous devrions plutôt nous concentrer sur eux."
 USA_Advance_the_American_Nuclear_Program:0 "Faire progresser le programme nucléaire américain"
 USA_Advance_the_American_Nuclear_Program_desc:0 "Il est clair que l'arme nucléaire jouera un rôle majeur dans cette nouvelle ère. Bien que nous soyons encore en avance sur tout le monde en matière de recherche, nous ne pouvons pas nous permettre de relâcher nos efforts dans ce domaine."
 USA_Hydrogen_Bomb_Test:0 "Essai de la bombe à hydrogène"
 USA_Further_Nuclear_Tests:0 "Nouveaux essais nucléaires"
 USA_Further_Nuclear_Tests_desc:0 "Nous ne pouvons pas nous reposer sur nos lauriers après notre dernier succès nucléaire. Les Soviétiques n'arrêtent pas leurs recherches, et nous non plus."
 USA_Create_the_First_Nuclear_Submarine:0 "Développer le premier sous-marin nucléaire"
 USA_Create_the_First_Nuclear_Submarine_desc:0 "Le développement d'un sous-marin nucléaire nous permettra de positionner et de lancer des armes nucléaires depuis presque n'importe quel point du globe. Cela renforcera notre capacité de frappe et notre capacité à menacer l'URSS."
 USA_eisenhower_presidency_Copy:0 "Eisenhower 1956"
 USA_eisenhower_presidency_Copy_desc:0 "Le général américain a remporté la victoire et remporté un nouveau mandat. Le président Eisenhower espère utiliser les quatre prochaines années de manière productive, en garantissant la stabilité et la prospérité de l'Amérique sur son territoire et en la maintenant fermement face à la menace du communisme à l'étranger. Vive le chef !"
 USA_Support_Anti_Communist_Groups:0 "Soutenir les groupes anticommunistes"
 USA_Support_Anti_Communist_Groups_desc:0 "Le communisme est la définition même de la tyrannie. Nous devons soutenir les personnes honnêtes qui tentent de libérer leurs peuples du communisme, où qu'elles se trouvent dans le monde. L'oppression communiste ne peut pas maintenir le monde sous contrôle indéfiniment."
 USA_Rid_the_World_Of_Communism:0 "Débarrassons le monde du communisme"
 USA_Bolster_the_Arms_Industry:0 "Soutenir l'industrie de l'armement"
 USA_Continue_New_Deal_Economic_Policies:0 "Poursuivre les politiques économiques du New Deal"
 USA_Continued_Congressional_Cooperation:0 "Poursuivre la coopération au sein du Congrès"
 USA_Conitinue_Hard_Liner_Stance_on_Communism:0 "Maintenir une position dure contre le communisme"
 USA_These_Years_Of_Progress:0 "Ces années de progrès"
 USA_The_Constitutional_Crisis:0 "La crise constitutionnelle"
 USA_Impeach_Truman:0 "Destituer Truman"
 USA_Continue_Reforms:0 "Poursuivre les réformes"
 USA_Support_The_Dutch_Empire:0 "Soutenir l'Empire néerlandais"
 USA_Support_The_Dutch_Empire_desc:0 "La seule raison pour laquelle Sukarno a pu s'élever au pouvoir est la faiblesse de l'Empire néerlandais. Nous devons lui apporter un soutien économique pour éviter que cela ne se reproduise."
 USA_Support_The_French_Empire:0 "Soutenir l'Empire français"
 USA_Support_The_French_Empire_desc:0 "La France n'a jamais été stable (du moins depuis Napoléon), et tous ces troubles dans ses colonies n'arrangent rien. Nous devons faire tout notre possible pour contribuer à leur redressement."
 USA_Abstain_from_the_unsc:0 "S'abstenir de siéger au Conseil de sécurité de l'ONU"
 USA_Abstain_from_the_unsc_desc:0 "Puisque nous sommes restés à l'écart du conflit jusqu'à présent, il est logique de faire de même au Conseil de sécurité de l'ONU. Laissons les autres puissances régler ce problème, ce n'est pas notre problème. En fin de compte, tant que les Soviétiques n'ont pas le canal de Suez, on s'en fiche complètement."
 USA_The_Colonization_Question:0 "La question de la colonisation"
 USA_The_Colonization_Question_desc:0 "Alors que les mouvements et sentiments nationalistes se multiplient dans les régions encore occupées par les puissances européennes du Vieux Continent, il est temps de trancher. Devons-nous soutenir nos alliés de l'OTAN et préserver leurs empires, même par la force, ou vaut-il mieux laisser les choses suivre leur cours et en finir avec la colonisation ici et maintenant ?"
 USA_Support_Israel_in_UNSC:0 "Soutenir Israël au Conseil de sécurité de l'ONU"
 USA_Increase_Encryption:0 "Augmenter les normes de cryptage"
 USA_Increase_Encryption_desc:0 "L'un des moyens de ralentir les opérations d'espionnage soviétiques est de renforcer nos normes de cryptage. Cela rendra tous nos messages codés et classifiés plus difficiles à déchiffrer."
 USA_A_Response_to_the_KGB:0 "Une réponse au KGB"
 USA_A_Response_to_the_KGB_desc:0 "Le KGB a intensifié ses opérations et ses activités subversives partout dans le monde. Il tente de propager le communisme partout. Il faut agir !"
 USA_Improved_Spying_Techniques:0 "Améliorer les techniques d'espionnage"
 USA_Improved_Spying_Techniques_desc:0 "Maintenant que nous avons pris quelques mesures préventives, il est temps de passer à l'attaque. Nous ne toucherons pas directement l'URSS ; grâce aux nouvelles techniques de nos agents, nous saurons bientôt tout ce qu'ils manigancent."
 USA_Send_advisors_to_Vietnam:0 "Envoyer des conseillers au Vietnam"
 civilian_preparations:0 "Préparatifs civils"
 constitutional_crisis:0 "Crise constitutionnelle"
 increased_encryption:0 "Cryptage accru"
 improved_espionage:0 "Espionnage amélioré"
 anti_soviet_mobilization:0 "Mobilisation antisoviétique"
 ARPA:0 "ARPA"
 USA_red_scare:0 "La peur rouge"
 Domino_Theory:0 "Théorie des dominos"
 USA_korean_tensions:0 "Tensions coréennes"
 USA_defensive_protocol:0 "Protocole défensif coréen"
 USA_offensive_protocol:0 "Protocole offensif coréen"
 USA_a_modern_airforce1_desc:0 "L'US Air Force est la meilleure force aérienne du monde, et nous devons veiller à ce qu'elle le reste. Nous moderniserons et réformerons notre force aérienne afin de conserver cet avantage décisif sur les Soviétiques."
 USA_enable_the_us_navy1:0 "Renforcer la marine américaine"
 USA_enable_the_us_navy1_desc:0 "Notre marine est la composante la plus importante de nos forces armées. Sans puissance navale, l'Amérique ne peut projeter sa puissance militaire loin de ses frontières, et nous aurions très peu de moyens de contrecarrer les Russes dans leur quête de domination mondiale. Nous devons investir dans la marine et développer nos capacités de construction navale."
 USA_mothball_the_us_navy:0 "Mettre la marine américaine en veilleuse"
 USA_mothball_the_us_navy_desc:0 "La Marine représente une part importante de notre budget militaire colossal. Il serait plus judicieux de réduire ses effectifs et de se concentrer sur des moyens plus rentables de contrôle des vagues."
 USA_american_commandos1_desc:0 "La force de l'armée américaine réside dans ses forces spéciales. Nous allons intensifier la formation de nos brigades de parachutistes, de Marines et de Mountaineers afin de garantir qu'elles demeurent une force de combat de haute qualité."
 USA_the_marshall_plan1_desc:0 "L’expérience montre que l’extrémisme prend racine dans les périodes de chaos politique et économique – comme celle dans laquelle se trouve actuellement l’Europe. Nous devons investir massivement de l’argent et des matériaux pour reconstruire l’Europe, de peur de la voir se tourner vers Staline, ou un autre Hitler, pour la sauver."
 USA_foriegn_affairs_desc:0 "En tant que nouveau leader du monde libre et principal défenseur de la lutte contre le communisme mondial, de nombreux domaines requièrent notre attention. Nous devons décider dans quels domaines intervenir et dans quelle mesure."
 USA_mccarthy_presidency_desc:0 "Dans un revirement choquant, Joseph McCarthy a remporté l'élection présidentielle américaine et se tient prêt à riposter contre les communistes, réels et imaginaires."
 USA_reaction_to_mccarthyism_desc:0 "Le sénateur Joseph McCarthy a lancé une accusation choquante : il aurait une liste de plus de 200 membres du Département d’État appartenant au Parti communiste ! Ce sénateur du Wisconsin suscite une vague d’indignation et de paranoïa dans tout le pays. Nous devons décider comment gérer cette tempête."
 USA_aid_roc_desc:0 "Le gouvernement républicain de Chiang Kai-Shek est notre allié indéfectible en Orient, mais il est épuisé par l'invasion japonaise d'il y a quelques années. Si nous ne l'aidons pas, il tombera presque certainement aux mains du régime communiste de Mao Zedong, et avec lui, les dominos de l'Asie de l'Est commenceront à s'effondrer."
 USA_advisors_roc_desc:0 "Fournir au Kuomintang des armes et du matériel ne suffit pas s'il ne sait pas les utiliser au mieux. Les Chinois bénéficieront des sages conseils de nos plus grands esprits militaires, ce qui contribuera certainement à endiguer la vague rouge."
 USA_declare_war_on_prc_desc:0 "Si nous avons jusqu'ici évité toute action directe en Chine par crainte de représailles soviétiques, nous ne pouvons plus rester les bras croisés et regarder l'Asie sombrer dans l'ombre de Staline. Le président a choisi de déclarer la guerre à Mao et à son terrible régime, afin de stabiliser et de réorganiser la Chine du Nord jusqu'à ce qu'elle soit remise à un État chinois démocratique et responsable."
 USA_cut_off_roc_desc:0 "Le Kuomintang est un désastre : corrompu, antidémocratique et engagé dans une guerre sans issue contre les communistes. Il n’est ni moral ni prudent de continuer à soutenir le régime de Kaï-Chek."
 USA_recognize_prc_desc:0 "Aussi déplaisant que cela puisse paraître, nous ne pouvons nier que Mao Zedong a remporté la guerre pour la suprématie sur la Chine. Nous devons agir pour reconnaître la RPC comme le gouvernement légitime de la Chine, dans l'espoir de pouvoir contester l'influence de Moscou sur elle."
 USA_anti_soviet_alliance_desc:0 "Bien que Mao soit marxiste, il est plutôt atypique, et les tensions entre Pékin et le Kremlin sont vives. Si nous aborderons la RPC avec suffisamment de tact, nous pourrons peut-être convaincre Mao de signer une alliance avec nous contre Staline, malgré nos divergences idéologiques."
 USA_restart_marshall_mission_desc:0 "En 1945, nous avons envoyé le général George Marshall négocier la paix entre les gouvernements communiste et nationaliste en Chine. La corruption et l'obstination des deux gouvernements ont entraîné l'échec de cette mission, et Marshall s'est retiré en 1947. Nous devons redoubler d'efforts et envoyer une nouvelle mission, au nom de la paix, de la stabilité et de la sécurité face aux Soviétiques."
 USA_press_for_peace_desc:0 "Nous n'avons pas été assez insistants lors de la mission Marshall de 1945-1947. Nous devons nous engager pleinement à faire pression diplomatiquement sur les deux parties pour qu'elles acceptent un cessez-le-feu."
 USA_push_for_yangtze_border_desc:0 "Nos diplomates ont enfin progressé et trouvé une solution acceptable pour les deux parties. Nous tenterons de tracer la ligne de démarcation entre les deux Chines sur le fleuve historique Yangtze. Peut-être cela mettra-t-il enfin un terme à l'effusion de sang."
 USA_compromise_with_congress_desc:0 "S'il serait bien sûr préférable d'adopter chaque loi sans opposition, le Président doit comprendre qu'en démocratie, toutes ses propositions ne seront pas adoptées. Nous devrions être plus disposés à faire des compromis avec le Congrès, même lorsque cela nous oblige à édulcorer nos propositions et nous empêche de faire ce que nous souhaitons. Après tout, il représente aussi le peuple américain."
 USA_the_bully_pulpit_desc:0 "Le Congrès est une nuisance, entravant constamment les efforts du Président pour mener à bien ses sages réformes et contrariant sa volonté à chaque étape. Nous devons saper sa légitimité en convainquant le peuple américain que le Congrès entrave injustement les efforts du Président pour l'aider."
 USA_korea_desc:0 "La péninsule coréenne est un atout stratégique majeur. De par sa proximité avec la Chine et le Japon, elle constituera un terrain d'entraînement et un avant-poste vital pour quiconque la contrôlera. Nous ne pouvons pas la laisser tomber aux mains des communistes, tant pour le bien du peuple coréen que pour la sécurité de nos alliés en Asie de l'Est."
 USA_fair_society_desc:0 "Nous devons garantir une société juste et égalitaire pour tous les Américains."
 USA_truman_assasination_desc:0 "Il faut se débarrasser de Truman, par tous les moyens nécessaires."
 USA_expansion_of_social_security_desc:0 "Nous dépensons déjà des millions de dollars chaque année dans des projets coûteux et risqués pour endiguer la propagation du communisme mondial, tandis que chaque jour, des millions d'Américains subissent des pertes de revenus dues à la maladie, au chômage et à la vieillesse. Cette immense richesse serait mieux utilisée pour améliorer la qualité de vie de nos citoyens."
 USA_crack_down_on_strikes_desc:0 "Alors que les syndicats avaient promis de ne pas faire grève pendant la guerre afin d'assurer la défaite du nazisme, cette promesse a maintenant expiré et ils recommencent à semer le trouble. Nous devrions adopter une ligne plus dure face aux grèves perturbatrices, afin de rendre plus difficile pour les syndicats de perturber l'industrie américaine et d'entraver l'infiltration communiste dans notre pays."
 USA_end_military_segregation_desc:0 "Actuellement, les forces armées américaines n'autorisent que des unités d'origine ethnique homogène. Cette situation est non seulement injuste, mais engendre également des tensions au sein des forces armées et rend difficile le recrutement de la personne idéale pour un poste donné. Nous devons mettre fin à cette pratique et intégrer l'armée, pour des raisons à la fois morales et pratiques."
 USA_continue_price_controls_desc:0 "Pendant la guerre, nous avons instauré des contrôles stricts sur les prix de certains biens et services, afin de préparer notre économie à la guerre. Les économistes réclament la levée de ces contrôles maintenant que la guerre est terminée, arguant qu'ils entraînent des pénuries, mais nous savons que ce n'est pas le cas. Nous maintiendrons le contrôle gouvernemental sur les industries vitales."
 USA_repeal_taft_hartley_desc:0 "La loi de 1947 sur les relations de travail, plus connue sous le nom de loi Taft-Hartley, impose des restrictions injustes aux actions légales des travailleurs syndiqués pour protéger leurs droits. Nous devons abroger cette loi injuste afin de préserver les droits de notre peuple."
 USA_brennan_plan_desc:0 "Pendant la guerre, les Alliés avaient un besoin urgent de nourriture, et nous payions les agriculteurs bien au-dessus des prix du marché pour qu'ils produisent le maximum. Cependant, la guerre terminée, des milliers d'agriculteurs se retrouvent avec des stocks de nourriture invendables. Nous vendrons ces surplus au prix du marché, puis verserons aux agriculteurs une compensation pour ne plus pouvoir vendre aux prix de guerre."
 USA_housing_act_of_1949_desc:0 "Les États-Unis sont confrontés à une grave pénurie de logements, et de nombreux Américains vivent dans des bidonvilles de banlieue. Cette situation est intenable : nous allons lancer un vaste programme de résorption des bidonvilles, de construction de logements abordables et de fourniture d'assurances hypothécaires afin que chaque Américain puisse accéder à un logement de qualité."
 USA_increase_min_wage_desc:0 "Cette administration est fermement convaincue que la justice sociale fondamentale exige que le travailleur américain ait droit à un salaire juste et raisonnable pour son travail. Nous augmenterons le salaire minimum afin d'assurer à nos travailleurs un minimum de sécurité et d'autonomie économique."
 USA_political_freedom_of_conscience_desc:0 "C'est un droit fondamental de tout être humain de pouvoir non seulement exprimer ses convictions sincères et profondes, mais aussi les exprimer publiquement, sans crainte de représailles publiques. C'est cette grande liberté qui préserve notre République de la tyrannie, et nous devons veiller à inscrire publiquement ce principe dans nos déclarations et nos actions."
 USA_condemn_mccarthy_as_insane_desc:0 "Joseph McCarthy est une force dangereuse et volatile, un électron libre dont les dommages collatéraux sont imprévisibles. Nous devons le condamner publiquement afin de mettre un terme à sa croisade moralisatrice et contre-productive contre les membres de notre gouvernement."
 USA_discredit_eisenhower_desc:0 "Dwight D. Eisenhower, bien que héros de guerre respecté, n'est pas favorable à nos projets d'avenir. Nous devrions salir son nom afin de l'éliminer de la liste des menaces politiques."
 USA_preserve_colonial_empires_desc:0 "Bien que nous nous soyons toujours considérés comme anticolonialistes, nous devrions éviter d'exercer une pression excessive sur nos alliés colonialistes. La France et la Grande-Bretagne sont nos alliés essentiels dans la lutte contre les Soviétiques, et les pousser à abandonner leurs empires coloniaux ne ferait que les affaiblir et les irriter, voire les pousser dans les bras de Staline."
 USA_arm_imperialist_vietnam_desc:0 "Ho Chi Minh et ses révolutionnaires communistes sèment le trouble au Vietnam. Nous devons envoyer des armes et du matériel au gouvernement vietnamien pour l'aider à éteindre les feux de la révolution."
 USA_vietnam_advisors_desc:0 "Le gouvernement vietnamien manque de conseillers militaires expérimentés pour former son armée. Nous devrions lui envoyer des conseillers pour former ses officiers et les aider à préserver leur propre sécurité."
 USA_operation_vulture_desc:0 "La garnison française de Dien Bien Phu est encerclée par les soldats du Vietminh. Ils seront certainement tués si personne n'intervient pour les sauver. Nous leur enverrons du soutien par vagues de bombardiers B-29. Nous envisageons même d'envoyer des bombes nucléaires au secours des Français…"
 USA_eisenhower_doctrine_desc:0 "Le Moyen-Orient est une cible tentante pour le communisme mondial, région en proie au mécontentement et riche en ressources pétrolières vitales dont nous et le monde libre avons besoin. Nous devons faire comprendre que tout pays du Moyen-Orient peut faire appel à notre aide contre l'agression communiste, pour son bien et le nôtre."
 USA_new_look_policy_desc:0 "Nos dépenses militaires actuelles étaient basées sur l'hypothèse que les Soviétiques atteindraient un « plafond » maximum de leur capacité militaire par rapport aux nôtres dans les années 1950. Il semble désormais peu probable que la capacité militaire soviétique se stabilise comme nous l'espérions, nous devrions donc passer à une stratégie à long terme axée sur la défense aérienne et les armes nucléaires plutôt que sur les armées et les marines permanentes."
 USA_army_macarthur_hearings_desc:0 "McCarthy exerce une influence très négative sur notre gouvernement et sur la perception qu'en a le public. Nous avons réussi à mettre la main sur une accusation contre lui, celle d'avoir exercé des pressions indues sur des responsables de l'armée, et nous allons lui demander de participer à une audition télévisée en direct à ce sujet. Peut-être que lorsque le peuple américain le verra en personne, il se retournera contre lui."
 USA_refugee_relief_act_desc:0 "On a récemment assisté à un afflux massif de réfugiés en provenance d'Europe du Sud, notamment de plusieurs pays communistes. Nos dispositions actuelles en matière d'immigration ne leur permettent pas d'entrer aux États-Unis, mais nous devrions adopter une nouvelle loi autorisant la réinstallation de ces personnes démunies et déplacées (sous réserve, bien entendu, de certaines vérifications et contrôles)."
 USA_support_monarchism_iran_desc:0 "La stabilité au Moyen-Orient est primordiale, car la région regorge de pétrole et d'agitateurs communistes. Le mécontentement populaire envers la dynastie Pahlavi au pouvoir en Iran s'est accru grâce au soutien soviétique. Nous devons aider le Shah à consolider son soutien populaire et à réprimer la dissidence rouge. Sinon, le Moyen-Orient tout entier risque de s'effondrer sous peu."
 USA_operation_ajax_desc:0 "Le Shah d'Iran s'est montré réceptif aux idées occidentales, mais son gouvernement est nettement moins ouvert d'esprit. Avec les Britanniques, nous avons contacté un puissant militaire iranien et lui avons demandé de nous aider à stabiliser l'emprise du Shah sur son parlement indiscipliné."
 USA_arm_imperialist_persia_desc:0 "Maintenant que nous avons aidé le Shah à renforcer son contrôle sur l'Iran, nous devons veiller à empêcher tout soulèvement armé. Nous enverrons des quantités considérables d'armes et de munitions à la Perse, afin de renforcer notre fidèle allié."
 USA_malayam_emergency_aid_desc:0 "La Malaisie est en proie à une insurrection communiste, une guerre compliquée par le fait que les communistes luttent principalement contre l'oppression coloniale. Nous devons envoyer de l'aide à la Malaisie pour contribuer à apaiser cette situation d'urgence."
 USA_advisors_to_malaysia_desc:0 "Comme de nombreux pays d'Asie de l'Est, la Malaisie souffre d'un manque relatif d'expérience en matière de guerre moderne. Nous devrions envoyer des conseillers militaires pour l'aider dans sa lutte contre l'insurrection communiste."
 USA_intervene_in_malaysia_desc:0 "Nous avons perdu confiance dans la capacité du gouvernement malaisien à gérer seul les révolutionnaires du MLA. Nous avons décidé d'intervenir nous-mêmes pour contenir la propagation du communisme mondial."
 USA_science_funding_desc:0 "L'avenir de l'Amérique repose sur le progrès scientifique et l'éducation de nos jeunes. Nous devons accroître le financement de ces domaines vitaux, sous peine de nous laisser distancer par la Russie."
 USA_support_african_colonialism_desc:0 "Nos alliés européens ont besoin des ressources de leurs marchés coloniaux pour reconstruire leurs économies et rester forts face à l'influence du Pacte de Varsovie. À cette fin, nous devons soutenir leurs efforts pour maintenir la paix et l'ordre dans leurs colonies."
 USA_advisors_french_algeria_desc:0 "L'Algérie française est une région en proie à un sentiment nationaliste particulièrement vif. Les Français auront besoin de l'aide de nos conseillers militaires pour maintenir la stabilité dans la région."
 USA_intervene_in_algeria_desc:0 "Les rebelles nationalistes algériens ont fait preuve d'une compétence et d'une détermination surprenantes. On ne peut plus compter sur les Français pour assurer la sécurité de leurs colonies d'Afrique du Nord ; nous devons intervenir pour assurer la paix."
 USA_crack_down_on_organized_crime_desc:0 "La mafia et les autres formes de crime organisé constituent une véritable épidémie dans notre société. Chantage, extorsion, meurtre, vol et toutes sortes de vices sont commis par ces criminels. On ne peut plus les ignorer et il faut les réprimer par tous les moyens à notre disposition."
 USA_expand_missle_research_desc:0 "Lors de l'invasion de l'Allemagne nazie, nous avons secouru et amnistié de nombreux spécialistes allemands des fusées. Leur expertise accélérera considérablement notre programme de fusées ; après tout, le potentiel militaire de ce domaine ne peut être surestimé."
 USA_the_interstate_highway_system_desc:0 "Les déplacements et les échanges commerciaux à travers l'Amérique sont entravés par des routes dangereuses et une planification des itinéraires inefficace. Nous allons entreprendre un projet de construction routière d'une ampleur sans précédent, afin de mettre en place un réseau routier de bien meilleure qualité qui simplifiera la vie des Américains."
 USA_statehood_for_alaska_and_hawaii_desc:0 "Actuellement, l'Alaska et Hawaï sont des territoires incorporés organisés, et non des États à part entière. Nous devrions étendre le statut d'État à part entière, mais le Congrès refuse d'approuver l'un ou l'autre État séparément, l'Alaska étant majoritairement républicain et Hawaï majoritairement démocrate. Par conséquent, ils doivent tous deux devenir des États rapidement."
 USA_nasa_desc:0 "Les nouvelles technologies ouvrent la perspective surprenante de quitter cette planète sur laquelle nous avons vécu toute notre histoire. De plus, les Soviétiques ont également manifesté leur intérêt pour cette aventure et, jusqu'à présent, ils sont en tête de la « course à l'espace ». Nous créerons la National Aeronautics and Space Administration (NASA) pour faire progresser l'exploration spatiale américaine."
 USA_latam_operations_desc:0 "L'Amérique latine est notre arrière-cour, et nous ne tolérerons aucune subversion socialiste si près de nos frontières. La chute d'un pays américain aux mains d'un régime communiste pourrait potentiellement donner aux Soviétiques une position dominante à quelques centaines de kilomètres de nos frontières, et cela ne sera pas toléré."
 USA_PBSUCCESS_desc:0 "Le Guatemala est dirigé par un gouvernement libéral, bien trop lié au communisme à notre goût. Nous avons élaboré un plan pour remplacer l'administration actuelle par une autre plus en phase avec nos objectifs."
 USA_democratic_regime_gua_desc:0 "L'instauration d'un gouvernement autocratique au Guatemala a été une erreur de notre part, une grave injustice envers le peuple guatémaltèque. Nous devons permettre à un gouvernement démocratiquement élu de prendre le pouvoir."
 USA_gua_military_junta_desc:0 "La dictature que nous avons instaurée au Guatemala n'est pas suffisamment stable pour résister efficacement à l'infiltration communiste. Nous devons organiser la prise du pouvoir par un gouvernement plus ferme et plus fort."
 USA_support_arab_cause_desc:0 "Les relations entre Arabes et Israéliens sont tendues et difficiles, mais les Arabes sont bien plus nombreux que les Israéliens. Dans l'intérêt de la stabilité régionale au Moyen-Orient, nous devons soutenir la cause arabe."
 USA_arm_arab_states_desc:0 "Les pays arabes sont pris pour cible par les Russes, qui tentent de financer les rebelles communistes sur leur territoire. Nous devons leur fournir armes et munitions pour les aider à résister à l'insurrection socialiste."
 USA_arab_advisors_desc:0 "Nos alliés arabes bénéficieront des conseils de nos officiers militaires qualifiés."
 USA_economic_and_oil_development_Desc:0 "Le Moyen-Orient regorge de pétrole, mais les pays arabes ne sont pas en mesure d'y accéder efficacement. Nous investirons des capitaux importants dans nos alliés arabes afin de leur permettre d'exploiter leurs vastes ressources naturelles."
 USA_gua_corporate_puppet_desc:0 "La United Fruit Company est une société américaine qui détenait des intérêts importants au Guatemala avant la récente instabilité. Elle nous a demandé de l'autoriser à étendre son influence dans le pays, afin de permettre aux États-Unis de mieux protéger leurs alliés et de prévenir la propagation du socialisme."
 USA_support_israel_desc:0 "Le peuple juif fait partie de notre héritage judéo-chrétien commun. Nous devons soutenir les Israéliens dans leur noble tentative de défendre leur nation contre toute agression étrangère."
 USA_arm_israel_desc:0 "Le peuple juif a terriblement souffert pendant la Seconde Guerre mondiale et s'efforce aujourd'hui de reconquérir une partie de sa patrie ancestrale en Israël. Cependant, il est entouré d'importantes populations arabes hostiles, qui ne sont pas encore prêtes à cohabiter avec lui. Nous devons fournir à Israël les armes dont il a besoin pour se défendre."
 USA_israeli_advisors_desc:0 "Israël a besoin de l’aide de nos conseillers militaires pour assurer la sécurité de ses frontières."
 USA_support_israeli_economically_desc:0 "Il ne suffira pas de fournir des armes à Israël ; nous devons lui assurer une prospérité économique telle qu'il ne manque de rien. Nous investirons massivement en capital et dans l'industrie israélienne, et nous encouragerons également l'investissement privé dans l'économie israélienne."
 USA_support_honduras_coup_desc:0 "Les conspirateurs en Honduras nous ont fait savoir qu'il était temps de frapper. Nous sommes prêts et nos agents sont en action. Avec un peu de chance, dans quelques semaines, le Honduras sera définitivement sorti de la sphère soviétique."
 USA_arm_militarist_honduras_desc:0 "Nous devons fournir des armes et des munitions au gouvernement du Honduras, afin de mieux garantir sa capacité à se défendre contre l’insurrection communiste."
 USA_arm_korea_desc:0 "La Corée du Sud se trouve dans une position extrêmement vulnérable en Asie de l'Est. Nous devons lui envoyer un soutien matériel important afin de garantir sa défense contre les menaces tant internes qu'externes."
 USA_south_korean_economy_desc:0 "La Corée est actuellement sous-développée, en grande partie à cause de sa longue oppression japonaise. Cependant, nous voyons un grand potentiel dans l'économie coréenne et investirons massivement dans le développement de notre allié."
 USA_defend_the_border_desc:0 "Nous ne pouvons pas nous permettre de lancer une offensive contre la Corée du Nord, mais le régime de Kim est trop dangereux pour être ignoré. Nous construirons un système de fortifications et de mines terrestres qui devrait ralentir, voire stopper, une offensive nord-coréenne en cas de guerre dans la péninsule."
 USA_pre_emptive_strike_desc:0 "Laisser le régime de Kim s'envenimer ne fera qu'aggraver le problème. Nous mettrons fin à la menace communiste en Corée dès maintenant, avant qu'ils n'aient l'occasion de répandre davantage leur poison."
 USA_operation_blue_bat_desc:0 "Le Liban est un pays divisé entre musulmans et chrétiens maronites. Le récent président libanais s'est rapproché de l'Occident, suscitant la colère d'une partie de la population musulmane et provoquant des troubles intérieurs. Nous devrions lancer une opération de renforcement du gouvernement libanais afin d'empêcher ce dernier de s'éloigner de l'Occident."
 USA_arm_lebanon_desc:0 "Pour renforcer davantage le gouvernement libanais, nous devrions lui envoyer des armes et des blindés de fabrication américaine afin de garantir la capacité du gouvernement à résister aux menaces tant étrangères qu’intérieures."
 USA_pull_out_of_korea_desc:0 "La Corée ne nous concerne pas. La péninsule est divisée de manière tout à fait anormale et difficile à défendre, et maintenir nos troupes de combat stationnées plus longtemps dans le Sud serait un gaspillage considérable de ressources."
 USA_arm_tibetan_uprising_desc:0 "Le peuple tibétain s'est soulevé contre l'occupation chinoise. Nous ne voyons aucune raison pour laquelle le peuple tibétain ne devrait pas jouir de son droit à l'autodétermination. C'est pourquoi nous enverrons des armes aux rebelles afin de soutenir la cause de l'indépendance du Tibet."
 USA_return_our_boys_home1_desc:0 "La guerre est enfin terminée, mais des centaines de milliers de soldats américains restent déployés en garnison en Europe. Bien que la menace soviétique soit réelle, cela ne signifie pas que les troupes américaines doivent occuper en permanence l'Allemagne et la France. Nous allons confier ces responsabilités à nos alliés et commencer à rapatrier nos garçons auprès de leurs familles."
 USA_consolidate_the_army1_desc:0 "Sans la menace de l'Allemagne nazie, il n'y a plus de justification à maintenir des millions de soldats mobilisés en permanence. Notre défense contre les Soviétiques sera bien mieux assurée par une armée consolidée, composée de professionnels entraînés, plutôt que par des conscrits."
 USA_return_to_domestic_defense_policy1_desc:0 "Pourquoi les contribuables américains devraient-ils payer la facture de la protection de l'Europe, de l'Afrique et de l'Asie ? Nous devrions revenir à une politique de défense intérieure exclusive, où notre armée défendrait le territoire américain, plutôt que de devoir défendre tous les pays de l'hémisphère occidental simultanément."
 USA_end_of_colonization_desc:0 "L'ère coloniale est révolue, et l'oppression des non-Européens par les Européens est une injustice anachronique. Nous devons soutenir publiquement les mouvements d'indépendance des colonies du monde entier. Après tout, si nous ne les libérons pas nous-mêmes, elles pourraient bien se tourner vers la Russie pour leur salut…"
 USA_call_for_de_colonization_desc:0 "Jusqu'à présent, nous avons traité la Grande-Bretagne et la France avec des pincettes, sans jamais les forcer sérieusement à accorder l'indépendance à leurs colonies. Cette époque est révolue ; il est temps que nous fassions clairement comprendre que nous ne tolérerons pas l'existence continue et indéfinie de puissances coloniales au sein du monde libre."
 USA_the_treaty_ports_desc:0 "Au XIXe siècle, les puissances européennes alors dominantes ont imposé le transfert de plusieurs ports chinois sous leur contrôle direct afin de faciliter le commerce. Depuis, les Chinois ont exprimé, à juste titre, leur amertume face à cet arrangement, et maintenant que le Kuomintang est notre allié, nous devrions faire pression sur la Grande-Bretagne et le Portugal pour qu'ils restituent les ports du traité à la Chine."
 USA_fund_shia_radicals_desc:0 "La monarchie Pahlavi en Iran est désespérément corrompue et faible. Elle est la preuve vivante de la folie d'un régime autocratique. Nous avons eu vent d'un soulèvement populiste contre la monarchie et, au nom de la liberté, nous devons soutenir ceux qui souhaitent s'affranchir de la tyrannie de l'absolutisme."
 USA_recognize_iranian_government_desc:0 "Un gouvernement stable au Moyen-Orient est d'une importance capitale. Nous ne pouvons nous permettre une rébellion violente qui renverserait l'ordre politique au Moyen-Orient à un moment aussi critique. Nous devons soutenir officiellement la monarchie Pahlavi d'Iran contre l'insurrection qui vise à la renverser."
 USA_iranian_industrial_development_desc:0 "Si nous voulons la stabilité du Moyen-Orient, nous devons avoir un Iran stable et amical. Si nous voulons un Iran stable et amical, alors l'Iran doit être riche et heureux. Il est logique que nous investissions en Iran pour améliorer son économie."
 USA_further_deployment_to_europe1_desc:0 "Certains membres des forces armées réclament la démobilisation de nos troupes d'Europe, mais nous savons que non. La guerre contre les nazis est peut-être terminée, mais la nécessité pour les hommes de se battre pour la liberté ne l'est pas. Un spectre odieux hante l'Europe : le spectre du communisme. Nous devons non seulement refuser la démobilisation, mais aussi envoyer encore plus de troupes défendre l'Europe !"
 USA_establish_us_european_command1_desc:0 "Si nous voulons mener des opérations en Europe pour contenir l'influence soviétique, la simple présence de troupes ne suffira pas. Quatre millions de soldats ne peuvent être correctement gérés de l'autre côté de l'océan. Nous devons établir une structure de commandement militaire explicite, basée en Europe, pour gérer l'organisation de nos opérations européennes."
 USA_mobilize_against_the_ussr1_desc:0 "Si nous devons engager une guerre totale contre les Soviétiques, ce sera l'une des plus grandes entreprises jamais entreprises par le peuple américain. Personne n'a réussi à envahir la Russie depuis l'époque des Mongols, et pour réussir, il faudra que chaque homme valide soit prêt à donner sa vie pour la cause."
 USA_the_korean_war_draft_desc:0 "La guerre de Corée pourrait facilement se transformer en une guerre interminable contre un ennemi retranché, une guerre stagnante. Nous abaisserons l'âge minimum d'enrôlement dans l'armée à 18 ans et demi, afin de libérer davantage de main-d'œuvre pour l'effort de guerre."
 USA_mountain_assualt1_desc:0 "Les meilleures troupes américaines sont nos forces spéciales. Nous devrions étendre la formation aux opérations en montagne au plus grand nombre de soldats possible, afin de maximiser notre capacité à combattre dans les régions montagneuses du monde entier."
 USA_condemn_african_colonialism_desc:0 "Les peuples d'Afrique ont énormément souffert du fardeau du colonialisme. Il est de la plus haute importance morale de dénoncer ce fléau et de faire pression sur la Grande-Bretagne, la France et le Portugal pour qu'ils accordent l'indépendance à leurs colonies africaines."
 USA_algerian_democratic_front_desc:0 "L'Algérie est un foyer de nationalisme, le peuple berbère luttant pour obtenir son indépendance vis-à-vis de la France. Nous devons le soutenir afin qu'une fois indépendant, il soit ouvert à une alliance avec nous."
 USA_start_uprising_algeria_desc:0 "Le moment est enfin venu. Nos alliés nationalistes algériens nous appellent depuis des mois à lancer une campagne militaire décisive contre les Français, et enfin tout est en place. Le soulèvement va éclater."
 USA_reform_our_doctrine1_desc:0 "Nous sommes sortis de la Seconde Guerre mondiale comme l'une des puissances dominantes du monde, mais notre armée de terre est inférieure à l'Armée rouge soviétique. Si nous voulons avoir une chance de contenir l'invasion soviétique en Europe, nous devons moderniser notre façon de concevoir la guerre."
 USA_grow_our_talons1_desc:0 "Notre plus grande force est notre armée de l'air. L'US Air Force est reconnue dans le monde entier pour l'excellence de ses services. Nous devons nous concentrer pleinement sur ce domaine, car nous ne pouvons pas nous permettre de perdre notre atout face aux Soviétiques."
 USA_amphious_warfare1_desc:0 "Le Corps des Marines des États-Unis est peut-être l'unité militaire la plus célèbre au monde. Nous devons veiller à la préserver et investir dans la technologie de guerre amphibie. Contrairement aux Soviétiques, nous serons probablement amenés à opérer dans des régions du monde dépourvues de frontières terrestres, et les Marines seront essentiels à ces guerres."
 USA_american_airborne_forces1_desc:0 "Les parachutistes sont un élément essentiel de l'avenir de la guerre. En élargissant le Corps des parachutistes, nous pourrons déployer un important contingent d'infanterie aéroportée."
 USA_special_forces1_desc:0 "Nous n'aurons jamais la population nécessaire pour rivaliser avec les Soviétiques en effectifs bruts. Nous devons donc veiller à utiliser nos soldats plus intelligemment et plus efficacement. Pour ce faire, nous devons concentrer nos efforts sur nos divisions de forces spéciales, qui nous donneront un avantage tactique sur le mastodonte russe."
 USA_expand_our_numbers1_desc:0 "L'Oncle Sam a besoin de vous ! Nous devons veiller à ce que tous les jeunes Américains soient inculqués au patriotisme et que chacun considère l'armée comme une œuvre glorieuse au service de la défense de la liberté dans le monde entier !"
 USA_collabrative_efforts_desc:0 "Nous devons conserver notre avance technologique sur les Soviétiques si nous voulons triompher du communisme mondial. Nous devons collaborer plus étroitement avec nos alliés européens pour rester à la pointe de la recherche scientifique."
 USA_eagles_talons1_desc:0 "Si nos avions de chasse sont à la pointe de la technologie, ce sont les bombardiers qui nous permettent de transformer notre supériorité aérienne en victoires militaires. Nous allons approfondir nos recherches sur les bombardiers afin de pouvoir déployer notre puissance aérienne partout dans le monde."
 USA_begin_a_european_recovery1_desc:0 "Les ravages causés aux pays européens par la Première Guerre mondiale ont joué un rôle majeur dans la montée du communisme et du fascisme. La leçon est claire : les idéologies extrémistes tirent leur pouvoir de l’instabilité politique, et l’instabilité politique naît du chaos économique et de la pauvreté. Par conséquent, si nous voulons protéger l’Europe du communisme, nous devons la reconstruire et l’enrichir."
 USA_nets_for_flemmish_fishermen1_desc:0 "L'industrie de la pêche flamande a été durement touchée par la guerre. Leur fournir du matériel de pêche moderne et à jour renforcerait considérablement l'économie belge."
 USA_construction_equipment_and_engineers_to_france1_desc:0 "La France a été profondément dévastée par l'invasion et l'occupation nazies, et son empire colonial en ruine est en proie à des troubles. Nous devons envoyer des quantités massives de matériaux de construction et d'ingénieurs en France pour reconstruire ses infrastructures et son économie."
 USA_rebuild_italys_auto_indsutry1_desc:0 "Si l'Italie était une puissance de l'Axe pendant la guerre, nous devons également l'aider, car elle est plus proche que la plupart des pays d'Europe occidentale de la menace communiste. L'industrie automobile italienne est en ruine après la guerre, et nous devons investir dans les entreprises italiennes pour la relancer."
 USA_coal_exports_to_denmark1_desc:0 "Nous développerons l’industrie danoise en lui fournissant du charbon bon marché pour alimenter ses usines."
 USA_food_distribution_to_europe1_desc:0 "Les États-Unis ont bénéficié de vastes océans sur deux côtés, empêchant toute puissance ennemie d'envahir leur territoire. Ainsi, notre agriculture n'a pas été interrompue par les bombardements ni saisie par les envahisseurs. L'Europe n'a pas eu cette chance, et la famine constitue un réel danger dans de nombreuses régions de France, et surtout en Allemagne. Nous exporterons des quantités massives de nourriture pour aider les populations européennes en difficulté."
 USA_consolidate_our_positions1_desc:0 "La marine américaine est la plus puissante du monde, mais nous ne devons pas nous reposer sur nos lauriers. Les Soviétiques en sont conscients et investiront probablement massivement dans leur flotte. Nous devons veiller à rester à leur niveau."
 USA_rebuild_and_modernize_our_navy1_desc:0 "Les porte-avions représentent l'avenir de la guerre navale, capables de projeter leur puissance aérienne à des milliers de kilomètres au-delà de toute base navale. Nous devons reconstruire notre marine autour de cette réalité."
 USA_a_truly_american_navy1_desc:0 "Notre marine commence enfin à prendre la forme que nous avions imaginée. Nous poursuivrons notre programme d'expansion des porte-avions, afin que la puissance de notre flotte soit reconnue pendant des générations, à l'image de la marine britannique d'autrefois."
 USA_the_macarthur_question1_desc:0 "Le général MacArthur s'est laissé monter par sa célébrité. Il s'est opposé à notre politique concernant la guerre de Corée, mais il a récemment rendu publiques ses critiques et mené une politique dangereusement agressive envers la Chine. Nombreux sont ceux qui craignent que son contrôle sur l'occupation du Japon ne fasse de lui une sorte de dictateur. Il faut lui rappeler qu'il rend compte au Président."
 USA_a_rebuilt_europe1_desc:0 "L'Europe s'est relevée des cendres de la guerre grâce aux investissements américains. Les pays d'Europe occidentale commencent à se redresser et leurs économies affichent des signes de croissance sans précédent depuis des années. La prochaine étape logique est d'investir dans les routes et les chemins de fer européens, afin que cette nouvelle richesse puisse circuler plus librement."
 USA_a_new_threat1_desc:0 "La menace soviétique est la plus grande menace pour la liberté à laquelle le monde libre ait été confronté depuis la chute du nazisme. L'Europe occidentale est un rempart essentiel contre la propagation du communisme. Nous avons renforcé l'Europe de telle sorte que les turbulences économiques ne la pousseront probablement pas dans les bras de Moscou, mais nous devons également l'armer afin qu'elle puisse se défendre contre une agression plus directe."
 USA_call_for_nato_members_to_return_treaty_ports_roc_desc:0 "Maintenant que la République de Chine est notre alliée, il est tout simplement inexcusable que des membres de l'OTAN détiennent injustement des territoires chinois. Nous demanderons aux Européens de restituer les ports du Traité à la Chine."
 USA_iranian_civil_war_desc:0 "Le soutien aux rebelles anti-Pahlavi a considérablement augmenté en Iran. Le moment est venu de lancer une révolution pour renverser la monarchie."
 USA_arm_greek_government_desc:0 "Les Grecs ont déjà souffert des insurgés communistes. Nous devons leur envoyer des armes et du matériel pour empêcher le Kremlin de s'immiscer en Méditerranée."
 USA_economic_aid_to_greece_desc:0 "L'économie grecque est en grande partie ruinée après la Seconde Guerre mondiale et la guerre civile communiste qui a suivi. Nous devons lui apporter une aide économique afin que le peuple grec n'ait pas besoin de compter sur le communisme pour son salut."
 USA_invite_greece_and_turkey_nato_desc:0 "La Grèce et la Turquie sont vulnérables, du fait de leur proximité avec la Russie et les autres pays du Pacte de Varsovie. Nous devons déployer des efforts politiques et diplomatiques considérables pour assurer leur protection et leur intégration au sein de nos autres alliés. Les inviter à rejoindre l'OTAN est un moyen d'y parvenir."
 USA_McCarran_internal_security_act_desc:0 "Nous devons toujours nous méfier de l'influence des organisations communistes sur notre grand pays. Nous adopterons une loi obligeant toutes les organisations communistes à s'enregistrer auprès du gouvernement et facilitant la recherche et la poursuite des personnes soupçonnées de subversion ou d'espionnage portant atteinte à nos libertés démocratiques."
 USA_join_anti_communist_movement_desc:0 "Jusqu'à présent, nous avons été bien trop indulgents envers les Rouges. Boycotts ? Endiguement ? Au mieux, des demi-mesures ! Nous devons consacrer notre nation de toutes nos forces à la destruction explicite du communisme mondial."
 USA_purge_state_department_desc:0 "Le Département d'État est rempli d'espions communistes et mêlé aux réseaux de l'espionnage. Nous devons éliminer de notre gouvernement tous ceux qui cherchent à vendre la nation aux Soviétiques."
 USA_civil_rights_act_of_1959_desc:0 "Les inégalités raciales dans la société américaine sont une tragédie et une injustice (sans parler du fait que les communistes les utilisent fréquemment comme un instrument rhétorique pour nous frapper). Nous devons chercher à abolir les lois électorales du Sud, techniquement légales mais manifestement discriminatoires, qui privent quasiment de leurs droits les non-Blancs."
 USA_subvert_democratic_system_desc:0 "L'équilibre des pouvoirs au sein du gouvernement américain constitue une menace pour la stabilité mondiale. Comment l'Amérique peut-elle espérer défendre le monde du communisme si elle paralyse délibérément son propre gouvernement ? Nous devons éliminer tout obstacle au pouvoir de la présidence."
 USA_military_junta_desc:0 "Si la démocratie est une tradition américaine ancestrale, nous avons plus que jamais besoin de stabilité. Comme l'a dit Abraham Lincoln, on ne change pas de cheval en plein milieu d'une guerre, ni de dirigeant en temps de guerre. Nous sommes en guerre contre le communisme, et le resterons encore longtemps. Nous devons assurer la stabilité nécessaire pour gagner cette guerre."
 USA_spread_fascism_desc:0 "Nos alliés ne sont pas suffisamment motivés dans la lutte contre les Rouges, et nombre d'entre eux préféreraient une politique d'apaisement plutôt que de s'attaquer au problème. Imbéciles ! Ne se souviennent-ils pas de ce qui s'est passé la dernière fois qu'ils ont tenté d'apaiser un dictateur ? Nous devons veiller à ce que le monde libre soit dirigé par des hommes plus forts et plus dynamiques."
 USA_crusade_agaisnt_communism_desc:0 "Le moment est enfin arrivé. Nous sommes prêts, nos armées sont prêtes, et nos alliés se sont préparés. Aujourd'hui, nous nous engageons dans la plus grande guerre qui ait jamais été menée dans l'histoire de l'humanité. Aujourd'hui, nous nous lançons dans une grande croisade contre le mal et la tyrannie comme on n'en a jamais vu, et qui peut-être ne sera jamais égalée. Gloire, gloire, alléluia ! Victoire aux États-Unis !"
 USA_show_trials_on_opposition_figures_desc:0 "McCarthy a constamment été confronté à l'opposition des traîtres communistes dans sa noble quête pour protéger l'Amérique de la subversion. Maintenant qu'il est président, il a enfin le pouvoir de se débarrasser de tous les traîtres qui voulaient détruire l'Amérique."
 USA_embrace_nationalism_desc:0 "Pendant trop longtemps, le peuple américain a eu honte d'être qualifié de nationaliste. Il associe ce terme au racisme, à la rhétorique du sang et du sol et à des guerres inutiles. C'est une erreur totale ! Le nationalisme signifie simplement l'amour de sa patrie ! Nous devons nous opposer à l'internationalisme larmoyant des communistes par un esprit nationaliste pur et dur."
 USA_paramilitary_american_legion_desc:0 "La Légion américaine est une association honorable pour nos vétérans militaires, mais nous ne voyons aucune raison de gaspiller leurs compétences. Nous ferons de la Légion américaine une force patriotique et unifiée de guerriers talentueux, sous la supervision personnelle de McCarthy."
 USA_outlaw_leftist_opposition_desc:0 "Le deuxième pire ennemi de l'Amérique est le libéralisme, car le libéralisme mène inévitablement au communisme. N'est-ce pas les libéraux qui ont entravé les tentatives de McCarthy de purger l'Amérique des communistes, sous prétexte de se plaindre des pentes glissantes et des droits de conscience ? Pour préserver la sécurité de l'Amérique, toutes les organisations de gauche doivent être interdites."
 USA_isolationism_desc:0 "L'intervention américaine dans la Seconde Guerre mondiale était un mal nécessaire à la destruction du nazisme. Nous n'avons rien promis de plus et nous ne donnerons rien de plus. Le président Taft est déterminé à sortir l'Amérique de ses errements en Europe. Après tout, nous devons d'abord servir et protéger l'Amérique."
 USA_asian_pivot_desc:0 "Le président Taft a décidé qu'il serait bien plus dans l'intérêt de l'Amérique de se concentrer sur la coopération avec ses alliés de la côte Pacifique, plutôt que de s'engager dans une guerre terrestre vouée à l'échec avec les Russes en Europe."
 USA_pacifica_desc:0 "Nous devons formaliser nos relations avec nos alliés du Pacifique en une véritable alliance : l’Organisation du Traité du Pacifique."
 USA_stevenson_presidency_desc:0 "Adlai Stevenson a remporté la présidence et prévoit de mettre en œuvre de vastes réformes économiques et sociales."
 USA_kefauver_presidency_desc:0 "Estes Kefauver a gagné la présidence et va sévir contre les grands trusts commerciaux et le crime organisé."
 USA_macarthur_presidency_desc:0 "Douglas MacArthur a remporté la présidence, fort de sa réputation de héros de guerre. Il compte consacrer la nation américaine tout entière à la destruction du communisme."
 USA_eisenhower_presidency_desc:0 "Dwight Eisenhower a remporté la présidence et entend s'opposer fermement au communisme mondial par le biais d'une coopération internationale et de politiques de représailles massives en matière de guerre nucléaire."
 USA_taft_presidency_desc:0 "Robert Taft Jr. a remporté la présidence et prévoit de retirer l’Amérique de l’enchevêtrement de la politique européenne."
 USA_the_deutsche_mark1_desc:0 "Sans surprise, la monnaie allemande a été complètement ruinée par la défaite de la guerre. Depuis, les Allemands ont eu recours aux cigarettes américaines comme monnaie d'échange, et le marché noir est florissant. L'Allemagne ne se reconstruira jamais si cela continue ainsi. Dans le cadre du plan Marshall, nous devons réintroduire en Allemagne une monnaie authentique, soutenue par les États-Unis."
 USA_final_year_of_eisenhowers_presidency_desc:0 "Au cours de ses nombreuses années dans le Bureau ovale, Dwight D. Eisenhower a connu de nombreuses crises et troubles : soulèvements, révolutions, création de la NASA et construction de l'immense autoroute inter-États. Aujourd'hui, à l'approche de la dernière année de sa présidence, il se prépare pour un dernier voyage à la barre du navire de l'État."
 USA_the_space_race_desc:0 "En 1957, l'URSS a lancé Spoutnik, le premier satellite artificiel de l'histoire. Ce lancement a terrifié notre peuple : notre sécurité dépend de notre supériorité technologique sur les Soviétiques, et il a suscité des doutes quant à cette supériorité. En réponse, nous avons créé la NASA et développons notre propre programme spatial. Nous devons gagner cette course vers les étoiles pour apaiser les esprits de notre peuple."
 USA_nuclear_program_desc:0 "La guerre froide sera gagnée par celui qui possèdera le plus de missiles nucléaires. Nous devons veiller à ce que notre arsenal nucléaire demeure le meilleur au monde, afin que les Soviétiques aient toujours des raisons de craindre notre colère."
 USA_elections_of_1964_desc:0 "Le mandat du président est arrivé à son terme et une nouvelle élection doit être organisée. Cette élection devrait être disputée à parts égales entre questions sociales et politique étrangère, les deux candidats les plus prometteurs étant le démocrate Lyndon Johnson et le républicain Barry Goldwater. Cependant, on ne sait jamais si un candidat surprise n'apparaîtra pas…"
 USA_The_Election_of_1968_desc:0 "Il est temps de se rendre à nouveau aux urnes pour décider qui dirigera notre grande nation. Les candidats les plus prometteurs sont le démocrate Hubert Humphrey et le républicain Richard Nixon, bien que George Wallace, un indépendant de l'Alabama, ait également annoncé son intention de se présenter."
 USA_The_Election_of_1972_desc:0 "Il est temps une fois de plus d’aller aux urnes pour décider qui dirigera notre grande nation."
 USA_the_CIA_desc:0 "Nous ne gagnerons jamais la Guerre froide sans un service de renseignement fort. L'espionnage revêt une importance capitale, tant pour dérober les secrets de nos ennemis que pour empêcher les espions russes de voler les nôtres. Nous devons étendre massivement les fonctions de la CIA afin d'assurer notre sécurité."
 USA_The_Civil_Rights_Movement_desc:0 "Malgré les efforts déployés vers la fin de la décennie précédente, les Noirs et autres groupes minoritaires souffrent encore énormément de discrimination dans notre pays. Le mécontentement populaire s'est intensifié ces dernières années, se transformant en un véritable mouvement social. Reste à savoir si ce mouvement adoptera la voie de la résistance pacifique ou violente."
 president_taft:0 "Robert A. Taft a remporté les élections présidentielles américaines de 1952"
 president_taft_56:0 "Robert A. Taft a remporté les élections présidentielles américaines de 1956"
 president_eisenhower:0 "Dwight D. Eisenhower a remporté les élections présidentielles américaines"
