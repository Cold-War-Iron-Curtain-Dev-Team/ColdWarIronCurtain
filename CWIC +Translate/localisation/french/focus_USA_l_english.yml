 USA_EISENHOWER_The_Eisenhower_Administration:0 "L'administration Eisenhower"
 USA_EISENHOWER_The_Eisenhower_Administration_desc:0 "L'ancien chef du SHAEF et architecte du Débarquement du Jour J a quitté la vie militaire pour se consacrer à la politique et se retrouve aujourd'hui à la tête du gouvernement américain."
 USA_EISENHOWER_Balance_the_Budget:0 "Équilibrer le budget"
 USA_EISENHOWER_Balance_the_Budget_desc:0 "Même si ce n'est pas la chose la plus amusante à faire, il faut maîtriser le budget fédéral. Il est hors de contrôle, l'argent circule partout, apparemment au hasard. Il faut agir."
 USA_EISENHOWER_Refugee_Relief_Ac:0 "Loi sur l'aide aux réfugiés"
 USA_EISENHOWER_Refugee_Relief_Ac_desc:0 "Il y a tellement de réfugiés qui fuient derrière le rideau de fer. Nous devons adopter une loi qui leur permette d'entrer dans le pays, de peur qu'ils ne soient contraints de retourner dans la prison communiste d'où ils se sont enfuis."
 USA_EISENHOWER_Social_Security_Act_of_1953:0 "Loi sur la sécurité sociale de 1953"
 USA_EISENHOWER_Social_Security_Act_of_1953_desc:0 "La SSA de 1953 augmentera les prestations pour les personnes âgées et les survivants, prolongera les crédits de salaire pour le service militaire et mettra davantage de fonds à la disposition du gouvernement fédéral."
 USA_EISENHOWER_Communist_Control_Act:0 "Loi sur le contrôle communiste"
 USA_EISENHOWER_Communist_Control_Act_desc:0 "La loi sur le contrôle communiste interdira le Parti communiste, une mesure attendue depuis longtemps. Elle criminalisera également l'adhésion ou le soutien au parti ou à d'autres groupes considérés comme communistes par le procureur général des États-Unis."
 USA_EISENHOWER_National_Firearms_Act:0 "Loi nationale sur les armes à feu"
 USA_EISENHOWER_National_Firearms_Act_desc:0 "La loi nationale sur les armes à feu tentera de renforcer la loi fédérale sur les armes à feu de 1938, qui interdisait la possession d'armes lourdes comme les mitrailleuses et exigeait l'enregistrement des propriétaires auprès d'un bureau fédéral."
 USA_EISENHOWER_Sabotage_the_Army_McCarthy_Hearings:0 "Saboter les audiences de l'armée McCarthy"
 USA_EISENHOWER_Sabotage_the_Army_McCarthy_Hearings_desc:0 "McCarthy est peut-être allé trop loin dans sa tentative de purger le gouvernement des communistes, mais ce procès dérape un peu. Après tout, McCarthy est républicain et vote pour nous. Nous devrions essayer de trouver des défauts à ses examinateurs."
 USA_EISENHOWER_Small_Buisness_Act:0 "Loi sur les petites entreprises"
 USA_EISENHOWER_Small_Buisness_Act_desc:0 "Les petites entreprises sont essentielles à presque toutes les villes, quelle que soit la taille de leur population. Face à la montée en puissance des grandes entreprises, nous devons veiller à leur protection."
 USA_EISENHOWER_Multiple_Mineral_Development_Act:0 "Loi sur l'exploitation minière multiple"
 USA_EISENHOWER_Multiple_Mineral_Development_Act_desc:0 "La loi sur le développement de plusieurs minéraux est un amendement à la loi générale sur l'exploitation minière de 1872, en vigueur depuis longtemps. Elle permettra le développement et l'exploitation de plusieurs minéraux sur la même parcelle de terrain."
 USA_EISENHOWER_Agricultural_Act_of_1954:0 "Loi agricole de 1954"
 USA_EISENHOWER_Agricultural_Act_of_1954_desc:0 "La loi agricole de 1954 créera une société de crédit aux produits de base pour apporter une aide à l'agriculture nationale et étrangère, ainsi que pour mettre en place des contrôles de prix flexibles et des soutiens aux produits agricoles."
 USA_EISENHOWER_Federal_National_Mortgage_Association_Charter_Act:0 "Loi sur la charte de la FNMA"
 USA_EISENHOWER_Federal_National_Mortgage_Association_Charter_Act_desc:0 "La FNMACA réorganisera la FNMA (connue familièrement sous le nom de Fannie Mae) pour mieux aider le marché hypothécaire secondaire et ses investisseurs."
 USA_EISENHOWER_Enforce_Brown_vs_Board_of_Education:0 "Appliquer l'arrêt Brown v. Board of Education"
 USA_EISENHOWER_Enforce_Brown_vs_Board_of_Education_desc:0 "La Cour suprême a jugé la ségrégation scolaire inconstitutionnelle, mais de nombreux gouverneurs et systèmes scolaires refusent de la mettre en œuvre. C'est un scandale, et ils doivent comprendre une fois pour toutes que tous les hommes naissent égaux."
 USA_EISENHOWER_National_Housing_Act_of_1955:0 "Loi nationale sur le logement de 1955"
 USA_EISENHOWER_National_Housing_Act_of_1955_desc:0 "La loi nationale sur le logement de 1955 prévoit le financement de 140 000 logements à construire à la place des bidonvilles qui seront détruits."
 USA_EISENHOWER_Internal_Revenue_Code_of_1954:0 "Code des impôts de 1954"
 USA_EISENHOWER_Internal_Revenue_Code_of_1954_desc:0 "Le Code des impôts de 1954 sera la première refonte majeure de notre système fiscal depuis sa création en 1913. Il y a tellement de lacunes et de faiblesses dans le code que nous ne pouvons plus les laisser en l'état."
 USA_EISENHOWER_Career_Incentive_Act:0 "Loi sur les incitations à la carrière"
 USA_EISENHOWER_Career_Incentive_Act_desc:0 "La loi sur les incitations à la carrière fera exactement ce que son nom indique : encourager le service militaire de carrière pour ceux qui ont été enrôlés pour la guerre de Corée et qui sont sur le point de terminer leur service."
 USA_EISENHOWER_Fish_and_Wildlife_Act:0 "Loi sur la pêche et la faune"
 USA_EISENHOWER_Fish_and_Wildlife_Act_desc:0 "L'objectif de la FWA est de réglementer l'industrie de la pêche commerciale, de créer une politique concernant les poissons et les crustacés, d'accroître les possibilités de pêche pour le public, ainsi que d'accroître la recherche sur les questions relatives aux poissons et à la faune."
 USA_EISENHOWER_Interstate_Highway_Act_of_1955:0 "Loi sur les autoroutes inter-États de 1955"
 USA_EISENHOWER_Interstate_Highway_Act_of_1955_desc:0 "L'Interstate Highway Act de 1955 autorisera l'investissement de 25 milliards de dollars dans la construction de 66 000 kilomètres d'autoroutes à travers les États-Unis. Bien qu'Eisenhower ait prévu que le réseau inter-États facilite la circulation des troupes à travers le pays, les civils y auront également accès, avec tous les avantages économiques que cela implique."
 USA_EISENHOWER_Modernize_the_Postal_Service:0 "Moderniser le service postal"
 USA_EISENHOWER_Modernize_the_Postal_Service_desc:0 "Le service postal est essentiel au bon fonctionnement de notre pays. Pourtant, il est largement obsolète, et dépend encore des chevaux dans certaines régions reculées. Nous devons le remettre aux normes modernes du milieu du XXe siècle."
 USA_EISENHOWER_Health_Research_Facilities_Act:0 "Loi sur les établissements de recherche en santé"
 USA_EISENHOWER_Health_Research_Facilities_Act_desc:0 "La création de grandes installations de recherche en santé, telles que le National Institute of Health (NIH) près de Washington, D.C., améliorera notre capacité à étudier les maladies avancées et à produire des remèdes de haute technologie pour les traiter."
 USA_EISENHOWER_The_Space_Race:0 "La course à l'espace"
 USA_EISENHOWER_The_Space_Race_desc:0 "L'espace : l'ultime frontière ! Il a toujours captivé notre imagination et, grâce aux nouveaux développements, il sera bientôt à notre portée. Nous devons cependant suivre le rythme des Soviétiques, car ils semblent avoir l'avantage dans ce domaine."
 USA_EISENHOWER_Air_Pollution_Control_Act:0 "Loi sur la lutte contre la pollution atmosphérique"
 USA_EISENHOWER_Air_Pollution_Control_Act_desc:0 "La loi sur le contrôle de la pollution de l'air vise à fournir des recherches et une assistance technique en matière de contrôle de la pollution de l'air, ainsi qu'à réglementer les émissions des voitures et des usines."
 USA_EISENHOWER56_The_Eisenhower_Administration_1956:0 "L'administration Eisenhower"
 USA_EISENHOWER56_The_Eisenhower_Administration_1956_desc:0 "Dwight D. Eisenhower a remporté l'élection présidentielle de 1956, battant largement son homologue démocrate. Il devra cependant surmonter sa minorité à la Chambre des représentants et au Sénat."
 USA_EISENHOWER_Economic_Prosperity:0 "Prospérité économique"
 USA_EISENHOWER_Economic_Prosperity_desc:0 "Notre économie est la plus forte du monde, et notre population le sait. Nous offrons la plus grande quantité de biens de consommation, les meilleurs services, et chacun y trouve son compte. C'est extrêmement bénéfique et nous obtiendrons d'excellents résultats."
 USA_EISENHOWER_Establish_NASA:0 "Créer la NASA"
 USA_EISENHOWER_Establish_NASA_desc:0 "Avec les avancées quotidiennes dans le domaine des technologies spatiales et des fusées, il est temps de créer une agence gouvernementale officielle pour gérer ces aspects. La National Aeronautics and Space Administration (NASA) contribuera à rationaliser et à orienter notre processus de recherche."
 USA_EISENHOWER_Airways_Modernization_Act:0 "Loi sur la modernisation des voies aériennes"
 USA_EISENHOWER_Airways_Modernization_Act_desc:0 "Il y a un an, le 30 juin, un terrible accident impliquant deux avions de ligne a eu lieu au-dessus de l'espace aérien non réglementé du Grand Canyon. En adoptant la loi sur la modernisation des voies aériennes, nous pouvons garantir que cela ne se reproduise plus."
 USA_EISENHOWER_Civil_Rights_Act_of_1957:0 "Loi sur les droits civiques de 1957"
 USA_EISENHOWER_Civil_Rights_Act_of_1957_desc:0 "Depuis 1875, chaque loi sur les droits civiques a été rejetée. Cependant, cela ne signifie pas que nous pouvons accepter la situation actuelle des droits des Afro-Américains. Il est temps de tenter de faire adopter une nouvelle loi sur les droits civiques par le Congrès."
 USA_EISENHOWER_Deploy_the_Army_to_Little_Rock:0 "Déployer l'armée à Little Rock"
 USA_EISENHOWER_Deploy_the_Army_to_Little_Rock_desc:0 "Malgré l'issue de l'affaire Brown contre le Conseil de l'Éducation et la récente loi sur les droits civiques, le gouverneur de l'Arkansas, Orval Faubus, refuse de déségréguer le lycée central de Little Rock. Nous devons fédéraliser la Garde nationale qui arrête les élèves et les obliger à escorter les neuf de Little Rock en lieu sûr."
 USA_EISENHOWER_National_Defense_Education_Act:0 "Loi sur l'éducation en matière de défense nationale"
 USA_EISENHOWER_National_Defense_Education_Act_desc:0 "Nous devons améliorer les programmes scientifiques de nos systèmes scolaires afin que nos futurs chimistes et physiciens bénéficient d'une meilleure formation dans ces domaines essentiels. La NDEA financera des programmes scientifiques dans toute l'Amérique."
 USA_EISENHOWER_Price_Anderson_Nuclear_Industries_Indemnity_Act:0 "Loi sur l'indemnisation des industries nucléaires de Price Anderson"
 USA_EISENHOWER_Price_Anderson_Nuclear_Industries_Indemnity_Act_desc:0 "Les industries nucléaires – centrales et autres services – sont intrinsèquement dangereuses. Nous devons garantir que la population civile puisse être indemnisée en cas d'accident et que les entreprises soient partiellement protégées contre les poursuites en responsabilité."
 USA_EISENHOWER_Establish_ARPA:0 "Créer l'ARPA"
 USA_EISENHOWER_Establish_ARPA_desc:0 "Avec le lancement de Spoutnik, les Soviétiques ont prouvé leur avance dans les domaines de recherche de pointe, et nous ne pouvons pas nous permettre de rester encore plus en arrière. L'ARPA, ou Agence pour les projets de recherche avancée, nous servira à cette fin."
 USA_EISENHOWER_Federal_Aviation_Act:0 "Loi fédérale sur l'aviation"
 USA_EISENHOWER_Federal_Aviation_Act_desc:0 "Faisant suite à la loi de modernisation des voies aériennes de 1957, la loi fédérale sur l'aviation réglementera et structurera davantage le ciel amical en créant la Federal Aviation Administration."
 USA_EISENHOWER_Transportation_Act:0 "Loi sur les transports"
 USA_EISENHOWER_Transportation_Act_desc:0 "Grâce à notre tout nouveau réseau autoroutier, les chemins de fer, déjà en difficulté à cause des compagnies aériennes, sont dans une situation encore plus précaire. La loi sur les transports autorisera l'ICC à prêter de l'argent aux compagnies ferroviaires et à fixer les prix pour tenter de les redynamiser."
 USA_EISENHOWER_Narcotics_Manufacturing_Act:0 "Loi sur la fabrication de stupéfiants"
 USA_EISENHOWER_Narcotics_Manufacturing_Act_desc:0 "Bien que nous ayons déjà adopté des lois et des conventions concernant les drogues illicites, nous devons réaffirmer notre engagement à leur égard et renforcer les mesures de dissuasion contre leur fabrication. La NMA permettra d'atteindre ces deux objectifs."
 USA_EISENHOWER_The_Lessons_of_Defeat:0 "Les leçons de la défaite"
 USA_EISENHOWER_The_Lessons_of_Defeat_desc:0 "Ces dernières années, notre peuple, conditionné à la victoire après les guerres mondiales, a commencé à ressentir le goût amer de la défaite après nos revers en Corée. Cependant, ce n'est pas entièrement négatif, car les leçons et les stratégies à tirer de la défaite sont différentes de celles de la victoire."
 USA_EISENHOWER_Department_of_Defense_Reorganization_Act:0 "Loi sur la réorganisation du ministère de la Défense"
 USA_EISENHOWER_Department_of_Defense_Reorganization_Act_desc:0 "La DODRA rationalisera la chaîne de commandement de nos forces armées, transférant la prise de décision des départements militaires aux chefs d'état-major interarmées et au secrétaire à la Défense. Elle créera également une version plus centralisée et plus axée sur les forces armées de l'ARPA, la DARPA."
 USA_EISENHOWER_Admission_of_Alaska_and_Hawaii:0 "Admission de l'Alaska et d'Hawaï"
 USA_EISENHOWER_Admission_of_Alaska_and_Hawaii_desc:0 "Après avoir été des territoires des États-Unis depuis le XIXe siècle, nous avons enfin obtenu le soutien du Sénat pour admettre l'Alaska et Hawaï au sein de l'Union. Nous devrons exercer un lobbying vigoureux pour leur acceptation, et l'industrie de la fabrication de drapeaux devra moderniser ses modèles."
 USA_EISENHOWER_The_Airport_Construction_Act:0 "Loi sur la construction des aéroports"
 USA_EISENHOWER_The_Airport_Construction_Act_desc:0 "Maintenant que le ciel américain est devenu plus sûr, il est temps que davantage de personnes puissent en profiter. La loi sur la construction d'aéroports prévoit des subventions pour les projets aéroportuaires prévus et soutient le maintien en service des aéroports ruraux."
 USA_EISENHOWER_Solve_the_Missle_Gap:0 "Résoudre le problème des missiles"
 USA_EISENHOWER_Solve_the_Missle_Gap_desc:0 "Il semble que les Soviétiques aient des années-lumière d'avance en matière de technologie balistique, au point que cela devienne une plaisanterie internationale. Nous devons redoubler d'efforts et combler notre retard technologique avant que les Russes ne nous bombardent d'une bombe atomique."
 USA_EISENHOWER_Revise_the_Walsh_Healey_Contracts_Act:0 "Réviser la loi Walsh Healey sur les contrats"
 USA_EISENHOWER_Revise_the_Walsh_Healey_Contracts_Act_desc:0 "La loi Walsh Healey sur les contrats de 1937 fixait le salaire de base pour les heures normales et les heures supplémentaires des employés civils travaillant sur des contrats gouvernementaux. Elle visait à améliorer les normes du travail. Elle est plus que dépassée, et quelques modifications restent à apporter."
 USA_EISENHOWER_The_Explorers_Program:0 "Le programme des explorateurs"
 USA_EISENHOWER_The_Explorers_Program_desc:0 "Le programme Explorers est un projet spatial de la NASA visant à mener des expériences et à recueillir des informations sur la physique spatiale. Explorer 1, la première fusée de mission prévue, devrait atteindre l'orbite."
 USA_EISENHOWER_Landrum_Griffin_ACt:0 "Loi Landrum-Griffin"
 USA_EISENHOWER_Landrum_Griffin_ACt_desc:0 "Récemment, de nouvelles révélations ont été faites concernant la corruption et les malversations au sein des syndicats. La loi Landrum-Griffin réglementera les affaires internes des syndicats et les obligera à rendre compte au ministère du Travail afin de remédier à ce problème."
 USA_EISENHOWER_Civil_Rights_Act_of_1960:0 "Loi sur les droits civiques de 1960"
 USA_EISENHOWER_Civil_Rights_Act_of_1960_desc:0 "Malgré tous nos efforts, de nombreuses lois et pratiques discriminatoires visent encore à empêcher les Afro-Américains et les Hispaniques de voter, notamment dans le Sud. Cette loi sur les droits civiques instaurera un contrôle fédéral des listes électorales et introduira des sanctions en cas d'obstruction au vote, afin de contrer ces lois."
 USA_70s_Advanced_Cruise_Missle_Development:0 "Développement avancé de missiles de croisière"
 USA_70s_Improve_Missle_Launch_Awareness:0 "Améliorer la sensibilisation au lancement de missiles"
