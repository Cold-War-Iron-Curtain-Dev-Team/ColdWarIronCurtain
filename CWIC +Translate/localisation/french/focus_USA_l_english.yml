 USA_70s_Select_a_VFX_Program_Winner:0 "Sélectionnez un gagnant du programme VFX"
 USA_70s_Big_Cats_Big_Decks:0 "Grands félins, grands ponts"
 USA_70s_Advanced_S_3_Viking_Capabilities:0 "Capacités avancées du S3 Viking"
 USA_70s_Strategic_Bomber_Command_Restructure:0 "Restructuration du Strategic Bomber Command"
 USA_70s_Cancel_the_XB_70:0 "Annuler le XB-70"
 USA_70s_Big_Four_B_52_Enhancement:0 "Améliorer les B-52"
 USA_70s_Evaluate_Vietnam_War_Air_Combat_Experiences:0 "Évaluer les expériences de combat aérien de la guerre du Vietnam"
 USA_70s_Evaluate_Vietnam_War_Air_Combat_Experiences_desc:0 "La supériorité aérienne, le soutien terrestre et les bombardements stratégiques ont tous joué un rôle important dans la guerre du Vietnam, mais nous avons également subi de lourdes pertes et avons constaté que certains de nos modèles d'avions étaient mieux adaptés à une période de guerre antérieure. Nous devons tirer les leçons de la guerre du Vietnam pour concevoir une nouvelle génération d'avions de combat, adaptée à une nouvelle génération de guerre."
 USA_70s_The_F_15_Eagle:0 "Le F-15 Eagle"
 USA_70s_The_F_15_Eagle_desc:0 "Créé en réponse au chasseur soviétique MiG-25, le McDonnell Douglas F-15 Eagle est le chasseur du futur. Ses puissants moteurs lui permettent de grimper à 9 000 mètres en une minute et d'accélérer verticalement en situation de combat. Son pilote dispose d'un ordinateur de vol numérique et du meilleur radar et avionique."
 USA_70s_The_M1_Abrams:0 "Le M1 Abrams"
 USA_70s_The_M1_Abrams_desc:0 "Le M60 Patton est un excellent char, mais le nouveau T-72 soviétique le surpasse de loin. Nous avons besoin d'un char moderne doté de la puissance de feu du Patton, mais avec la mobilité et la protection nécessaires pour affronter les nouveaux chars de Moscou."
