l_english:
 YUG_ww_capitals: "Kumbor"
 YUG_ww_capitals_short: "Kumbor"
 YUG_ww_capitals_desc: "Cuirassé de défense côtière de type \"Kronprinz Erzherzog Rudolf\"."
 YUG_battle_hull_light_0: "Type de croiseur « Gazelle »"
 YUG_battle_hull_light_0_short: "Type de croiseur « Gazelle »"
 YUG_battle_hull_light_0_desc: "Le croiseur léger allemand « Niobe » fut endommagé le 22 décembre 1943 par deux torpilles et abandonné par l'équipage. Peu après, il fut capturé par des partisans yougoslaves, mais, faute de pouvoir le sauver, il fut abandonné. En 1947, son démantèlement pour récupérer le métal commença et fut finalement achevé en 1952 par la société yougoslave de relevage naval « Brodospas »."
 YUG_battle_hull_light_4: "Type \"Kotor\""
 YUG_battle_hull_light_4_short: "Type \"Kotor\""
 YUG_battle_hull_light_4_desc: "Les patrouilleurs de grande taille de type « Kotor » sont armés de quatre missiles mer-mer P-21 ou P-22 (code OTAN : SS-N-2 Styx). Ces missiles pèsent 2 607 kg, leur ogive 480 kg, et ont une portée de 8 à 80 km à une altitude de 25 ou 50 mètres, à une vitesse de Mach 0,9. Ils sont dotés d’un système d’autoguidage infrarouge (P-22) ou d’un guidage radar actif (P-21)."
 YUG_screen_hull_heavy_0: "Type \"Tb 74T\""
 YUG_screen_hull_heavy_0_short: "Type \"Tb 74T\""
 YUG_screen_hull_heavy_0_desc: "Le T1 fut mis en service par la marine yougoslave après la guerre sous le nom de Golešnica. Il fut réarmé avec deux canons de 40 mm sur affûts simples et quatre canons de 20 mm, et ses tubes lance-torpilles furent retirés. Il resta en service sous ce nom jusqu'en octobre 1959. Le T5 fut également mis en service par la marine yougoslave après la guerre et rebaptisé Cer. Il fut équipé de deux canons de 40 mm sur affûts simples et d'un canon de 20 mm, et ses tubes lance-torpilles furent également retirés. Il servit jusqu'en 1962, date à laquelle il fut démantelé."
 YUG_screen_hull_heavy_1: "Split"
 YUG_screen_hull_heavy_1_short: "Split"
 YUG_screen_hull_heavy_1_desc: "L'armement principal du Split se composait de quatre canons de 13 cm (5 pouces) de calibre 38 en affûts simples, une paire superposée à l'avant et une autre à l'arrière de la superstructure. Son armement antiaérien comprenait quatre affûts doubles et quatre affûts simples pour canons antiaériens Bofors de 40 mm construits sous licence. Le navire embarquait un quintuple lance-torpilles de 533 mm (21 pouces) et conservait sa capacité d'emport de 40 mines. Pour la lutte anti-sous-marine, le Split était équipé de deux mortiers à tige Hedgehog, de six lanceurs de grenades sous-marines et de deux râteliers à grenades sous-marines. Le navire était doté d'un directeur de tir Mk 37 pour les canons de 13 cm et d'un directeur de tir Mk 51 pour les canons antiaériens."
 YUG_screen_hull_heavy_2: "W classe"
 YUG_screen_hull_heavy_2_short: "W classe"
 YUG_screen_hull_heavy_2_desc: "Répétitions des destroyers des classes U et V précédentes, avec des structures de direction de tir modifiées. La classe Z était armée de canons de 114 mm."
 YUG_screen_hull_heavy_3: "Type \"Animoso\""
 YUG_screen_hull_heavy_3_short: "Type \"Animoso\""
 YUG_screen_hull_heavy_3_desc: "Par rapport à la classe Spica dont elle est issue, la classe Ariete avait perdu l'un de ses trois canons polyvalents de 100 mm/47 calibres, tandis que son armement de torpilles était passé de quatre à six tubes lance-torpilles de 450 mm, répartis en deux affûts triples sur l'axe longitudinal du navire. L'armement antiaérien comprenait dix canons de 20 mm."
 YUG_screen_hull_heavy_4: "Projet 1159"
 YUG_screen_hull_heavy_4_short: "Projet 1159"
 YUG_screen_hull_heavy_4_desc: "L'armement se composait de deux affûts doubles de canons AK726 de 76 mm et de deux canons AA doubles de 30 mm ; 4 lanceurs de missiles antinavires SSN-2 étaient installés sur certains navires ; des râteliers de charges de profondeur et de mines étaient installés à l'arrière."
 YUG_screen_hull_medium_0: "Type \"Tb 82F"
 YUG_screen_hull_medium_0_short: "Type \"Tb 82F"
 YUG_screen_hull_medium_0_desc: "Les torpilleurs (Torpiljarke) type \"Tb 82F\", transférés en 1945 à la marine yougoslave et introduits comme patrouilleur (Patrolni brod) T 5 (à partir du 18 mai 1949 PBR 92 \"Cer\" (PBR 92 \"Cer\") bord n° 92), exclus en 1962, transférés en 1963 pour être démantelés en métal."
 YUG_screen_hull_medium_1: "Type \"Dubrovnik\""
 YUG_screen_hull_medium_1_short: "Type \"Dubrovnik\""
 YUG_screen_hull_medium_1_desc: "Destroyer yougoslave Dubrovnik."
 YUG_screen_hull_medium_2: "Type \"Beograd\""
 YUG_screen_hull_medium_2_short: "Type \"Beograd\""
 YUG_screen_hull_medium_2_desc: "Destroyers de type « Belgrade »"
 YUG_screen_hull_medium_3: "Type \"Ariete\""
 YUG_screen_hull_medium_3_short: "Type \"Ariete\""
 YUG_screen_hull_medium_3_desc: "Destroyers d'escorte (Razaraći eskortni) type \"Ariete\"."
 YUG_screen_hull_medium_4: "Triglav"
 YUG_screen_hull_medium_4_short: "Triglav"
 YUG_screen_hull_medium_4_desc: "Triglav est un patrouilleur de classe Svetlyak"
 YUG_sub_hull_ww: "Classe Hrabri"
 YUG_sub_hull_ww_short: "Classe Hrabri"
 YUG_sub_hull_ww_desc: "En surface, les vedettes de la classe Hrabri étaient propulsées par deux moteurs diesel d'une puissance de 2 400 chevaux (1 800 kW) entraînant deux lignes d'hélice. En plongée, les hélices étaient actionnées par deux moteurs électriques développant une puissance de 1 600 chevaux (1 200 kW). Elles pouvaient atteindre une vitesse maximale de 15,7 nœuds (29,1 km/h) en surface et de 10 nœuds (19 km/h) en plongée grâce à leurs moteurs électriques. Leur armement se composait de six tubes lance-torpilles de 533 mm montés à l'avant et elles emportaient douze torpilles."
 YUG_sub_hull_small_single_3: "Classe Una"
 YUG_sub_hull_small_single_3_short: "Classe Una"
 YUG_sub_hull_small_single_3_desc: "Le sous-marin de classe Una (également connu sous le nom de Type 911) était une série de six sous-marins de poche construits pour la marine yougoslave par le chantier naval Brodogradilište specijalnih objekata dans les années 1980. Ils étaient conçus pour le mouillage de petits champs de mines et le transport de forces spéciales navales, avec ou sans leurs submersibles, dans des eaux peu profondes inaccessibles aux sous-marins de plus grande taille. Compte tenu de leur mission, qui exigeait une conception compacte et la nécessité de rester discrets, ils étaient dépourvus d'armement de torpilles et de générateur pour la recharge des batteries."
 YUG_sub_hull_large_single_0: "Type \"Flutto\""
 YUG_sub_hull_large_single_0_short: "Type \"Flutto\""
 YUG_sub_hull_large_single_0_desc: "Introduit dans la marine yougoslave le 10 septembre 1953, modernisé, expulsé en 1968."
 YUG_sub_hull_large_single_1: "Projet \"B-81/1\""
 YUG_sub_hull_large_single_1_short: "Projet \"B-81/1\""
 YUG_sub_hull_large_single_1_desc: "La classe Sutjeska était une classe de deux sous-marins diesel-électriques construits pour la marine yougoslave à la fin des années 1950 et au début des années 1960. Construits par le chantier naval Uljanik à Pula."
 YUG_sub_hull_large_single_2: "Projet \"B-81/2\""
 YUG_sub_hull_large_single_2_short: "Projet \"B-81/2\""
 YUG_sub_hull_large_single_2_desc: "La classe Sutjeska était une classe de deux sous-marins diesel-électriques construits pour la marine yougoslave à la fin des années 1950 et au début des années 1960. Construits par le chantier naval Uljanik à Pula."
 YUG_sub_hull_large_single_3: "Classe Heroj"
 YUG_sub_hull_large_single_3_short: "Classe Heroj"
 YUG_sub_hull_large_single_3_desc: "La classe Heroj était une classe de sous-marins d'attaque diesel-électriques construits pour la marine yougoslave dans les années 1960. Leur armement se composait de quatre tubes lance-torpilles de 533 mm (1 pied 9 pouces) pouvant tirer jusqu'à six torpilles à guidage actif/passif SET-65E ou déployer jusqu'à douze mines marines. Leur système de détection comprenait un détecteur d'alerte radar « Stop Light », un radar de recherche de surface « Snoop Group » et un sonar de coque Thomson Sintra Eledone."
 YUG_sub_hull_large_single_4: "Classe Sava"
 YUG_sub_hull_large_single_4_short: "Classe Sava"
 YUG_sub_hull_large_single_4_desc: "La classe Sava était une classe de sous-marins d'attaque diesel-électriques construits pour la marine yougoslave à la fin des années 1970 et au début des années 1980. Leur armement se composait de six tubes lance-torpilles de 533 mm orientés vers l'avant, pouvant lancer jusqu'à dix torpilles TEST-71ME d'une portée maximale de 20 km, ou jusqu'à vingt mines marines en cas d'opérations de mouillage de mines. Leur système de détection comprenait un radar d'alerte « Stop Light » et un radar de recherche de surface « Snoop Group ». Les sources divergent quant aux équipements sonar installés."
 YUG_sub_hull_large_double_0: "Type \"Smeli\""
 YUG_sub_hull_large_double_0_short: "Type \"Smeli\""
 YUG_sub_hull_large_double_0_desc: "Sous-marin diesel-électrique yougoslave."