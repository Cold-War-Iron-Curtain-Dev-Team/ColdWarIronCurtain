 ENG_60s_Night_of_the_Long_knives_desc:0 "La « Nuit des longs couteaux » fut un remaniement ministériel de grande ampleur. Le Premier ministre Harold Macmillan a limogé sept membres de son gouvernement, soit un tiers de l'effectif total. La rapidité et l'ampleur de ce remaniement ont conduit ses détracteurs à le comparer à la « Nuit des longs couteaux » de 1934 dans l'Allemagne nazie."
