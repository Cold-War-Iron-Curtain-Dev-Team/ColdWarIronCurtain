 UK50_Representation_People_Act:0 "Loi sur la représentation du peuple [GetYear]"
 UK50_Representation_People_Act_desc:0 "La loi sur la représentation du peuple de [GetYear] a codifié la législation électorale antérieure, mais a également apporté certaines modifications à son administration. Le principal changement consistait à prévoir que les futures révisions des circonscriptions parlementaires seraient menées par les commissions permanentes chargées du découpage électoral. La loi a également supprimé les termes « circonscription parlementaire urbaine » et « circonscription parlementaire rurale », aboli les circonscriptions universitaires et supprimé l'obligation pour la City de Londres de constituer sa propre circonscription."
 UK50_Reinforce_House_Prominence:0 "Mettre en valeur la maison"
 UK50_Reinforce_House_Prominence_desc:0 "La Chambre des communes est la chambre la plus importante du Parlement ; elle est chargée d'adopter toutes les lois, de fixer les impôts et d'approuver les crédits alloués au gouvernement."
 UK50_Parliament_Act:0 "La loi sur le Parlement"
 UK50_Parliament_Act_desc:0 "La loi sur le Parlement de 1949 (12, 13 et 14 Geo. 6, chap. 103) est une loi du Parlement du Royaume-Uni. Elle a restreint le pouvoir de la Chambre des lords de retarder l'adoption de certains types de textes législatifs, notamment les projets de loi d'intérêt public autres que les projets de loi de finances, en modifiant la loi sur le Parlement de 1911."
 UK50_Liberalize_Adoption:0 "Loi sur l'adoption des enfants [GetYear]"
 UK50_Liberalize_Adoption_desc:0 "Cette loi a assoupli diverses règles relatives à l'adoption. Le placement des enfants en vue de leur adoption a été placé sous la supervision des autorités locales, tandis que les enfants adoptés se sont vu accorder des droits successoraux. En outre, la loi a également rejeté l'idée, implicite dans la loi sur l'enfance de 1926, selon laquelle la mère devait connaître l'identité de l'adoptant pour pouvoir donner son consentement à l'adoption en toute connaissance de cause. La loi autorisait au contraire que l'identité de l'adoptant soit dissimulée derrière un numéro d'ordre."
 UK50_Create_Free_Legal_Help_System:0 "Loi sur l'aide et le conseil juridiques [GetYear]"
 UK50_Create_Free_Legal_Help_System_desc:0 "Cette loi a élargi le champ d'application de l'État-providence afin que les personnes n'ayant pas les moyens de payer un avocat puissent bénéficier d'une aide juridique gratuite."
 UK50_Inaugurate_National_Parks:0 "Loi sur les parcs nationaux et l'accès à la campagne [GetYear]"
 UK50_Inaugurate_National_Parks_desc:0 "La loi de [GetYear] sur les parcs nationaux et l'accès à la campagne est une loi du Parlement du Royaume-Uni qui a institué la Commission des parcs nationaux. Cette loi a établi le cadre régissant la création des parcs nationaux et des zones de beauté naturelle exceptionnelle en Angleterre et au Pays de Galles, et a également traité des droits de passage du public et de l'accès aux espaces naturels. Elle a été adoptée avec le soutien de tous les partis, dans le cadre de la reconstruction du Royaume-Uni menée par le gouvernement travailliste après la Seconde Guerre mondiale."
 UK50_Establish_Rent_Control_Courts:0 "Créer des tribunaux chargés du contrôle des loyers"
 UK50_Establish_Rent_Control_Courts_desc:0 "Grâce à l'adoption de plusieurs lois visant à limiter la hausse des loyers, nous commençons à constater certains résultats."
 UK50_Redraw_Electoral_Districts:0 "Redéfinir les circonscriptions électorales"
 UK50_Redraw_Electoral_Districts_desc:0 "La loi de 1949 sur la Chambre des communes (redécoupage électoral) était une loi du Parlement du Royaume-Uni qui prévoyait la révision périodique du nombre et des limites des circonscriptions électorales. Cette loi modifiait les règles de répartition des sièges que devaient respecter les commissions de redécoupage électoral de chacun des pays constitutifs du Royaume-Uni. Elle contenait un certain nombre de règles destinées à guider les travaux de ces commissions."
 UK50_Clean_Air_Act:0 "Loi sur la qualité de l'air"
 UK50_Clean_Air_Act_desc:0 "La loi sur la qualité de l'air (Clean Air Act) est une loi adoptée par le Parlement du Royaume-Uni, principalement en réponse au grand smog de Londres de 1952. La loi a introduit un certain nombre de mesures visant à réduire la pollution atmosphérique. La principale d'entre elles consistait à imposer le passage à des combustibles sans fumée, en particulier dans les zones à forte densité de population soumises à un contrôle des émissions, afin de réduire la pollution par la fumée et les émissions de dioxyde de soufre provenant des feux domestiques. La loi comprenait également des mesures visant à réduire les émissions de gaz, de particules et de poussière provenant des cheminées et des cheminées d'usine."
 UK50_Housing_Repair_Rents_Act:0 "Loi sur la rénovation des logements et les loyers"
 UK50_Housing_Repair_Rents_Act_desc:0 "Loi visant à prendre des dispositions supplémentaires concernant la démolition et le réaménagement de zones comportant des logements insalubres, ainsi qu’à garantir ou à promouvoir la remise en état et l’entretien des logements ; et modifiant par ailleurs les textes législatifs relatifs au logement, à l’exercice de certains pouvoirs en matière foncière et au contrôle des loyers."
 UK50_Halt_Pay_Pauses:0 "Suspendre les suspensions de salaire"
 UK50_Halt_Pay_Pauses_desc:0 "Le gel des salaires pour nos travailleurs les plus précieux nuit à leur bien-être et à leur productivité. Nous allons immédiatement nous employer à garantir des augmentations de salaire à nos ouvriers."
 UK50_Increase_Telephone_Access:0 "Améliorer l'accès au réseau téléphonique dans toute l'Angleterre"
 UK50_Increase_Telephone_Access_desc:0 "Beaucoup de nos habitants n'ont toujours pas accès au téléphone. Nous devons prévoir des fonds pour installer davantage de lignes dans tout le pays."
 UK50_Improve_Ulster_Transportation:0 "Améliorer les transports dans l'Ulster"
 UK50_Improve_Ulster_Transportation_desc:0 "Nous devons allouer davantage de fonds à l'Autorité des transports d'Ulster afin d'améliorer le réseau ferroviaire de la région."
 UK50_Encourage_Paid_Holidays:0 "Encourager les congés payés"
 UK50_Encourage_Paid_Holidays_desc:0 "Le fait de rémunérer nos employés tout en leur accordant du temps pour se détendre en dehors du travail permettra d'accroître leur productivité et leur apportera d'autres avantages sur leur lieu de travail."
 UK50_Double_Taxation_Relief_Order:0 "Arrêté relatif à l'allègement de la double imposition"
 UK50_Double_Taxation_Relief_Order_desc:0 "Les personnes fortunées bénéficieront d'une réduction substantielle de leur impôt sur le revenu, en raison de la politique de double imposition qui les obligeait jusqu'à présent à payer des impôts à deux autorités fiscales différentes."
 UK50_Increase_Tory_Hold:0 "Les conservateurs renforcent leur emprise dans les zones rurales du sud de l'Angleterre"
 UK50_Increase_Tory_Hold_desc:0 "Il faut s'assurer le soutien du Parti conservateur dans les zones rurales du sud de l'Angleterre, où se concentre l'électorat de centre-droit."
 UK50_Popularize_Holiday_Camps:0 "Promouvoir les camps de vacances"
 UK50_Popularize_Holiday_Camps_desc:0 "Les centres de vacances existent en Angleterre depuis la fin des années 1930 ; ils proposent un hébergement et des activités aux touristes en vacances. Avec l'essor des loisirs dans les années 1950, nous allons populariser ces centres afin que nos concitoyens puissent y séjourner pendant leurs vacances."
 UK50_Permissive_Society:0 "La société permissive"
 UK50_Permissive_Society_desc:0 "Une société permissive est une société où les normes sociales, telles que la liberté sexuelle, deviennent plus libérales. On observe ce phénomène principalement dans l'Europe et l'Amérique des années 1960, avec l'essor de la drogue et de la contre-culture, ainsi que l'assouplissement des valeurs victoriennes."
 UK50_Five_Common_Principles:0 "Cinq principes fondamentaux"
 UK50_Five_Common_Principles_desc:0 "La Constitution du Royaume-Uni repose sur cinq principes fondamentaux, à savoir la souveraineté du Parlement, l'Union des royaumes, la liberté individuelle, l'équilibre des pouvoirs et la subordination du pouvoir judiciaire."
 UK50_Maintain_Strict_Monetary_Policy:0 "Maintenir une politique monétaire rigoureuse"
 UK50_Maintain_Strict_Monetary_Policy_desc:0 "Notre politique monétaire doit être resserrée, même si cela entraîne une hausse de notre taux d'inflation. Nous allons imprimer davantage de monnaie pour soutenir la croissance de notre économie."
 UK50_Renewed_Pound_Devaluation:0 "Nouvelle dévaluation de la livre"
 UK50_Renewed_Pound_Devaluation_desc:0 "La valeur de la livre sterling doit être ramenée de 4.03$ à 2.80$ pour 1£, en raison de l'épuisement de nos réserves."
 UK50_Allocate_Funds_Distriution_of_Industry_Act:0 "Loi sur l'affectation de fonds à la distribution industrielle"
 UK50_Allocate_Funds_Distriution_of_Industry_Act_desc:0 "La loi de 1945 sur la répartition industrielle était une loi du Parlement visant à favoriser la revitalisation de certaines zones. Entre 1945 et 1950, elle a permis la construction de 481 usines publiques et de 505 usines privées, créant ainsi environ 200 000 emplois."
 UK50_Increase_State_Housing_Credit_Limit:0 "Augmenter le plafond du crédit d'impôt pour le logement"
 UK50_Increase_State_Housing_Credit_Limit_desc:0 "Le plafond du crédit dont nos concitoyens peuvent bénéficier pour acheter ou louer un logement va être relevé. Cette augmentation permettra à davantage de personnes d'accéder au crédit et de trouver un logement abordable."
 UK50_Ramp_Up_Industrial_Exports:0 "Accroître les exportations industrielles"
 UK50_Ramp_Up_Industrial_Exports_desc:0 "L'augmentation de nos exportations vers nos alliés et l'ensemble de nos clients permettra de reconstituer rapidement les réserves en livres sterling et de stimuler la croissance de notre économie, dont le Royaume-Uni a désespérément besoin en ce moment."
 UK50_Step_Up_Agricultural_Subsidies:0 "Augmenter les subventions agricoles"
 UK50_Step_Up_Agricultural_Subsidies_desc:0 "L'octroi de subventions agricoles permettra à nos agriculteurs d'augmenter leurs rendements et de vendre davantage de produits alimentaires, tout en leur fournissant les meilleures technologies agricoles dont nous disposons."
 UK50_Restore_Universal_Death_Duties:0 "Réintroduire les droits de succession universels"
 UK50_Restore_Universal_Death_Duties_desc:0 "Les droits de succession et les droits de transmission ont été supprimés par la loi de finances de 1949. Nous devons désormais les rétablir."
 UK50_Fund_Tarmac_Group:0 "Soutenir financièrement le groupe Tarmac"
 UK50_Fund_Tarmac_Group_desc:0 "Le groupe Tarmac est une entreprise britannique spécialisée dans les matériaux de construction, qui produit des matériaux de revêtement routier, du béton, du ciment et de la chaux, tout en exerçant des activités de construction routière ; son apport permettra de redynamiser nos routes et nos infrastructures essentielles."
 UK50_Subsidize_Coal_and_Steel:0 "Subventionner les industries du charbon et de l'acier"
 UK50_Subsidize_Coal_and_Steel_desc:0 "Avec la création du National Coal Board en 1946, chargé de gérer notre industrie charbonnière, et l'adoption de la loi sur le fer et l'acier en 1949, le gouvernement britannique exerce un certain contrôle sur les industries du charbon et de l'acier, auxquelles il accorde des subventions."
 UK50_Print_New_Export_Currency:0 "Imprimer la nouvelle devise d'exportation"
 UK50_Print_New_Export_Currency_desc:0 "Une nouvelle monnaie d'exportation sera mise en circulation et indexée sur notre livre sterling, dans le but de reconstituer nos faibles réserves et de dégager un excédent."
 UK50_Increase_Minimum_Wage:0 "Augmenter le salaire minimum"
 UK50_Increase_Minimum_Wage_desc:0 "Avec l'adoption de la loi de 1945 sur les commissions salariales, le Parlement s'apprête à entamer une hausse du salaire minimum dans certains secteurs d'activité."
 UK50_Cap_NHS:0 "Plafond des dépenses du NHS"
 UK50_Cap_NHS_desc:0 "Les dépenses consacrées au Service national de santé ont atteint leur limite ! Le gouvernement est contraint d'imposer de modestes frais, tels qu'un shilling pour les ordonnances et une livre pour les soins dentaires, afin de limiter les dépenses du NHS."
 UK50_Open_BOE_Loans:0 "Prêts de la Banque d'Angleterre"
 UK50_Open_BOE_Loans_desc:0 "Nous devons contracter des emprunts auprès de la Banque d'Angleterre pour garantir la poursuite de la croissance de notre économie, même si cela implique une hausse de l'inflation."
 UK50_Confirm_Rail_Nationalization:0 "Confirmer la nationalisation des chemins de fer et des câbles"
 UK50_Confirm_Rail_Nationalization_desc:0 "En vertu de la loi sur les transports de 1947, toutes les compagnies ferroviaires privées du Royaume-Uni ont été nationalisées pour former British Railways, et le réseau de télécommunications britannique a été nationalisé pour former Cable and Wireless plc."
 UK50_Diminish_Working_Hours_Public_Service:0 "Réduire le temps de travail dans les services publics"
 UK50_Diminish_Working_Hours_Public_Service_desc:0 "La réduction du temps de travail de nos fonctionnaires et agents publics permettra d'accroître leur productivité et de favoriser la stabilité nationale."
 UK50_Raise_High_Income_Inheritance_Tax:0 "Augmenter l'impôt sur les successions pour les revenus élevés"
 UK50_Raise_High_Income_Inheritance_Tax_desc:0 "Il faut augmenter l'impôt sur les revenus et les successions, car le gouvernement a besoin de plus d'argent pour assurer sa survie et son développement."
 UK50_Expand_Iron_Steel_Corportaion_Of_GB:0 "Développer la société Iron & Steel Corporation de Grande-Bretagne"
 UK50_Expand_Iron_Steel_Corportaion_Of_GB_desc:0 "La loi de 1949 sur le fer et l'acier est entrée en vigueur en 1951, et la Société britannique du fer et de l'acier devait être constituée à partir de l'ensemble du secteur."
 UK50_Raise_Investment_in_Public_Works:0 "Accroître les investissements dans les travaux publics"
 UK50_Raise_Investment_in_Public_Works_desc:0 "Il faut accroître nos investissements dans les projets de travaux publics, tels que nos autoroutes, nos ponts et autres infrastructures, afin que le gouvernement britannique puisse exercer un contrôle quasi total sur ces travaux."
 UK50_Resorb_NHS_Deficit:0 "Réduire le déficit du NHS"
 UK50_Resork_NHS_Deficit_desc:0 "Le déficit croissant du Service national de santé doit à nouveau être comblé par le gouvernement, afin de préserver le rêve d'un système de santé national."
 UK50_Aneurin_Bevan_Victory:0 "Victoire d'Aneurin Bevan"
 UK50_Aneurin_Bevan_Victory_desc:0 "L'ancien ministre du Travail, Aneurin Bevan, a obtenu la confiance du Parlement et est devenu Premier ministre."
 UK50_Empower_Workers_Union:0 "Renforcer le syndicat des travailleurs"
 UK50_Empower_Workers_Union_desc:0 "Les syndicats jouent un rôle essentiel pour la sécurité et la protection de nos travailleurs britanniques ; le renforcement de leurs activités et le recours à la négociation collective permettront de garantir que tous les travailleurs conservent leurs droits."
 UK50_Strengthen_Agricultural_Cooperatives:0 "Renforcer les coopératives agricoles"
 UK50_Strengthen_Agricultural_Cooperatives_desc:0 "Les coopératives agricoles communautaires rassembleront les gens autour d'un objectif commun : produire des denrées alimentaires dans un esprit d'amitié, tout en tirant une grande fierté de leur engagement en faveur du secteur agricole britannique."
 UK50_Fully_Nationalize_Steelworks:0 "Nationaliser entièrement les aciéries"
 UK50_Fully_Nationalize_Steelworks_desc:0 "Toutes les usines et entreprises sidérurgiques du Royaume-Uni seront entièrement nationalisées et intégrées à la Iron and Steel Corporation of Great Britain, qui exercera un contrôle total sur le secteur."
 UK50_Sponsor_Trade_Union_Congress_Leftist_Candidates:0 "Soutenir les candidats de gauche au Congrès des syndicats"
 UK50_Sponsor_Trade_Union_Congress_Leftist_Candidates_desc:0 "Si le gouvernement soutient des candidats de gauche favorables aux syndicats, la population saura alors clairement que nous sommes aux côtés des travailleurs et que nous ferons tout ce qui est en notre pouvoir pour garantir leurs droits et leur apporter notre soutien."
 UK50_Generalize_Comprehensive_Schools:0 "Généraliser les écoles polyvalentes"
 UK50_Generalize_Comprehensive_Schools_desc:0 "Les premières écoles polyvalentes, conçues pour proposer un programme d'études plus axé sur la pratique, ont vu le jour en Angleterre après la Seconde Guerre mondiale : cinq à Londres et deux à Coventry. Il convient de développer et de généraliser ces établissements afin d'offrir une formation plus professionnelle à la nouvelle génération."
 UK50_Reshuffle_State_Owned_Business_Boards:0 "Remaniement des conseils d'administration des entreprises publiques"
 UK50_Reshuffle_State_Owned_Business_Boards_desc:0 "Les conseils d'administration qui dirigent nos entreprises publiques, telles que la British Steel Corporation et Cable and Wireless plc, doivent être remaniés et remplacés par des candidats plus expérimentés et politiquement acceptables."
 UK50_Turn_Company_Subsidies_Into_State_Shares:0 "Transformer les subventions aux entreprises en participations de l'État"
 UK50_Turn_Company_Subsidies_Into_State_Shares_desc:0 "Les investissements dans nos industries publiques impliquent un contrôle de l'État sur ces industries, puisque le gouvernement leur accorde des subventions. Notre contrôle sur les industries nationalisées ne cesse de s'étendre."
 UK50_Propose_Left_Unity_Manifesto:0 "Proposer un manifeste pour l'unité de la gauche"
 UK50_Propose_Left_Unity_Manifesto_desc:0 "Tous les partis de gauche au Royaume-Uni, y compris le Parti travailliste, les socialistes et les communistes, devraient s'unir pour former une seule et même force populaire de grande envergure !"
 UK50_Propose_Electoral_Reform:0 "Mettre en œuvre une réforme électorale de grande envergure"
 UK50_Propose_Electoral_Reform_desc:0 "L'adoption du projet de loi sur la représentation du peuple, proposé pour la première fois par le Parti travailliste en 1931, permettra le vote alternatif et donnera au peuple l'occasion de changer de gouvernement."
 UK50_Call_Snap_Elections:0 "Convoquer des élections anticipées"
 UK50_Call_Snap_Elections_desc:0 "Il est plus que jamais urgent d'organiser des élections anticipées ; grâce à notre nouvelle réforme électorale et à nos efforts pour unifier la gauche, les résultats devraient être sans équivoque."
 UK50_Second_Atlee_Ministry:0 "Deuxième gouvernement Atlee"
 UK50_Second_Atlee_Ministry_desc:0 "À la suite des élections anticipées de 1951, le Premier ministre Attlee a de nouveau obtenu la confiance de son gouvernement et a entamé son deuxième mandat à la tête du gouvernement."
 UK50_Propose_Rearmament_Plan:0 "Proposer un plan de réarmement"
 UK50_Propose_Rearmament_Plan_desc:0 "Au lendemain de la Seconde Guerre mondiale, il est apparu clairement que le Royaume-Uni devait se tenir prêt à faire face à d'éventuels conflits futurs, en se réarmant rapidement et en conservant une force de combat solide."
 UK50_Double_University_Funds:0 "Doubler les fonds universitaires"
 UK50_Double_University_Funds_desc:0 "Nos universités ne reçoivent qu'un financement minimal, alors même que nos soldats rentrent de la guerre et doivent trouver un emploi ou poursuivre leurs études. Il faut allouer davantage de fonds aux universités afin de permettre la poursuite des études."
 UK50_Open_New_RSAF_Munition_Plants:0 "Inaugurer de nouvelles usines de munitions de la RSAF"
 UK50_Open_New_RSAF_Munition_Plants_desc:0 "La Royal Small Arms Factory est une usine d'armes légères appartenant au gouvernement britannique, située à Enfield, en banlieue londonienne. Elle est réputée pour la fabrication des célèbres fusils Lee-Enfield, ainsi que des mitraillettes Bren et Sten. Il faut construire davantage d'usines de ce type à travers le Royaume-Uni afin d'accélérer la production et le déploiement de nos armes légères."
 UK50_Develop_de_Havilland_Exports:0 "Développer les exportations d'avions de Havilland"
 UK50_Develop_de_Havilland_Exports_desc:0 "La mise au point du DH.106 Comet par la société de Havilland Aircraft Company Limited devrait susciter l'intérêt de nombreux acheteurs étrangers et propulser notre marché aéronautique sur la scène internationale."
 UK50_Increase_BBC_Budget:0 "Augmenter le budget de la BBC"
 UK50_Increase_BBC_Budget_desc:0 "La British Broadcasting Corporation est le radiodiffuseur national du Royaume-Uni ; elle a été créée en vertu d'une charte royale, ce qui en fait une entreprise essentiellement publique. Le budget de la BBC consacré aux programmes de radio et de télévision doit être financé par la redevance audiovisuelle."
 UK50_Expand_Avro_Factories:0 "Développer les usines Avro"
 Uk50_Expand_Avro_Factories_desc:0 "Avro est un constructeur aéronautique britannique fondé en 1910, à l'origine de l'Avro 504 et de l'Avro Lancaster. Basées principalement dans le Lancashire, les usines Avro doivent être agrandies pour pouvoir commencer la production du nouveau bombardier Avro Vulcan."
 UK50_Inaugurate_Basildon_Corby_New_Towns:0 "Inaugurer les villes nouvelles de Basildon et Corby"
 UK50_Inaugurate_Basildon_Corby_New_Towns_desc:0 "À la suite de l'adoption de la loi de 1946 sur les villes nouvelles, les villes de Basildon et de Corby seront désignées comme villes nouvelles dans le sud-est de l'Angleterre, en tant que banlieues de Londres, et seront gérées par des sociétés de développement."
 UK50_Aid_Rolls_Royce_Production:0 "Soutenir la production de Rolls-Royce"
 UK50_Aid_Rolls_Royce_Production_desc:0 "Rolls-Royce Limited est une multinationale britannique spécialisée dans l'aérospatiale et la défense qui conçoit, fabrique et commercialise aujourd'hui des systèmes de propulsion pour l'aviation, notamment des moteurs d'avion."
 UK50_British_Productivity_Council:0 "Conseil britannique de la productivité"
 UK50_British_Productivity_Council_desc:0 "Le British Productivity Council était un organisme créé dans le but d'améliorer l'efficacité industrielle du Royaume-Uni. Fondé en 1951, le Conseil a produit de nombreux films destinés à sensibiliser les travailleurs aux pratiques de travail."
 UK50_Establish_Fees_NHS_Dental_Vision_Care:0 "Fixer les tarifs des soins dentaires et ophtalmologiques du NHS"
 UK50_Establish_Fees_NHS_Dental_Vision_Care_desc:0 "Le Service national de santé étant surfinancé, le gouvernement a été contraint d'instaurer des frais pour les soins dentaires et ophtalmologiques, en plus des médicaments sur ordonnance."
 UK50_Right_Road_For_Britain:0 "La bonne voie pour la Grande-Bretagne"
 UK50_Right_Road_For_Britain_desc:0 "Comme l'indique le programme électoral du Parti conservateur de 1950, « La voie à suivre pour la Grande-Bretagne consiste à redonner à notre pays son indépendance économique et à nos citoyens leur pleine liberté individuelle et leur capacité d'initiative. »"
 UK50_Push_Strong_Building_Industry:0 "Agir pour un secteur du bâtiment solide"
 UK50_Push_Strong_Building_Industry_desc:0 "La Grande-Bretagne a besoin d'un secteur de la construction solide pour poursuivre ses efforts en faveur de la croissance économique ; nous devons tout mettre en œuvre pour y parvenir."
 UK50_Increase_Bellway_Subsidies:0 "Augmenter les subventions accordées à Bellway"
 UK50_Increase_Bellway_Subsidies_desc:0 "Bellway est un promoteur immobilier résidentiel basé à Newcastle upon Tyne. En lui accordant un financement, nous lui permettons de construire davantage de logements pour les particuliers et les entreprises."
 UK50_Expand_Taylor_Woodrow_Markets:0 "Développer les marchés de Taylor-Woodrow"
 UK50_Expand_Taylor_Woodrow_Markets_desc:0 "Taylor Woodrow comptait parmi les plus grandes entreprises de construction résidentielle et générale de Grande-Bretagne. Elle réalisait des travaux très variés, tant pour le secteur privé que pour le secteur public, mais c'est son rôle dans le secteur britannique de la production d'électricité qui s'est particulièrement distingué ; après avoir construit une série de centrales électriques conventionnelles, l'entreprise a été chargée de la construction de la première centrale nucléaire commerciale au monde. Dans le secteur privé, parmi ses contrats les plus marquants figuraient les terminaux de l'aéroport de Londres-Heathrow et la cathédrale métropolitaine de Liverpool."
 UK50_Fullfil_McMillan_Housing_Pledge:0 "Respecter l'engagement de MacMillan en matière de logement"
 UK50_Fullfil_McMillan_Housing_Pledge_desc:0 "Harold MacMillan, ministre conservateur du Logement et des Collectivités locales, s'est engagé à respecter la promesse faite par le Premier ministre de construire 300 000 logements par an."
 UK50_Build_New_Scotland_England_Highways:0 "Rénover l'autoroute A1 Londres-Édimbourg"
 UK50_Build_New_Scotland_England_Highways_desc:0 "Nous devons moderniser l'A1 afin de permettre des vitesses plus élevées et d'augmenter sa capacité."
 UK50_Raise_Gaelic_Trunk_Roads_Budgets:0 "Augmenter le budget consacré aux routes principales gaéliques"
 UK50_Raise_Gaelic_Trunk_Roads_Budgets_desc:0 "En améliorant le réseau routier principal de la région gaélique, nous pourrons relier davantage de villes et de villages entre eux."
 UK50_Begin_Public_Services_Cuts:0 "Début des coupes dans les services publics"
 UK50_Begin_Public_Services_Cuts_desc:0 "Nous devrions commencer à transférer les services publics et les services d'intérêt général à des entreprises privées, afin de stimuler notre économie."
 UK50_Progressively_End_Rationning:0 "Mettre progressivement fin au rationnement"
 UK50_Progressively_End_Rationning_desc:0 "La Seconde Guerre mondiale est terminée depuis bien assez longtemps. Le rationnement du carburant, de la viande, du fromage, du lait, du sucre et de tous les autres produits alimentaires doit prendre fin dès que possible."
 UK50_UK_Atomic_Energy_Authority:0 "Autorité britannique de l'énergie atomique"
 UK50_UK_Atomic_Energy_Authority_desc:0 "L'Autorité britannique de l'énergie atomique (UKAEA) a été créée par la loi de 1954 sur l'Autorité de l'énergie atomique, qui lui confiait pour mission de « produire, utiliser et valoriser l'énergie atomique ». L'UKAEA est surtout connue pour avoir participé au programme d'armement nucléaire britannique et pour avoir mené les essais nucléaires qui ont suivi."
 UK50_Create_Independent_Television:0 "Créer une chaîne de télévision indépendante"
 UK50_Create_Independent_Television_desc:0 "Independent Television, ou ITV, est une chaîne de télévision britannique en clair, créée pour concurrencer directement la chaîne publique BBC Television à la suite de l'adoption de la loi sur la télévision de 1954."
 UK50_Stimulate_Household_Savings:0 "Encourager l'épargne des ménages"
 UK50_Stimulate_Household_Savings_desc:0 "Il faut encourager l'épargne des ménages."
 UK50_Privatize_Steel_Industry:0 "Privatiser l'industrie sidérurgique"
 UK50_Privatize_Steel_Industry_desc:0 "Maintenant que le Parti conservateur est de retour au pouvoir, nous devons prendre des mesures pour réintégrer certaines divisions de la Société nationale de la sidérurgie de Grande-Bretagne dans le secteur privé, afin que notre économie puisse se redresser."
 UK50_Raise_BOE_Rates:0 "Relever les taux de crédit de la Banque d'Angleterre"
 UK50_Raise_BOE_Rates_desc:0 "L'amélioration de la notation de crédit de la Banque d'Angleterre permettra de réduire les emprunts, ce qui limitera l'offre de monnaie et fera baisser considérablement le taux d'inflation."
 UK50_Abandon_Devaluation_Policies:0 "Abandonner les politiques de dévaluation"
 UK50_Abandon_Devaluation_Policies_desc:0 "Les politiques visant à dévaluer la livre sterling étaient dangereuses et risquaient de menacer notre économie. L'abandon de ces politiques permettra de réduire la masse monétaire et d'augmenter l'excédent de nos réserves."
 UK50_Create_London_Green_Belt:0 "Créer la ceinture verte de Londres"
 UK50_Create_London_Green_Belt_desc:0 "La ceinture verte métropolitaine est une zone verte protégée par la loi qui englobe certaines parties du Grand Londres et les six « comtés voisins ». Cette ceinture verte a pour objectif de limiter l'expansion urbaine et sera étendue sur 56 kilomètres, conformément à la loi de 1947 sur l'aménagement du territoire."
 UK50_United_For_Peace_And_Progress:0 "Unis pour la paix et le progrès"
 UK50_United_For_Peace_And_Progress_desc:0 "Le Royaume-Uni restera uni afin d'assurer la paix et le progrès aussi longtemps que possible."
 UK50_Milford_Haven_Fawley_Raffineries_Expansion:0 "Extension des raffineries de Milford Haven et Fawley"
 UK50_Milford_Haven_Fawley_Raffineries_Expansion_desc:0 "La raffinerie Esso de Milford Haven est une future raffinerie de pétrole située sur la côte du Pembrokeshire, au Pays de Galles. La construction devrait débuter en 1957 et s'achever en 1960 ; la raffinerie de Fawley est une raffinerie plus ancienne, fondée en 1921 et inaugurée après une extension en 1951 par le Premier ministre Attlee."
 UK50_Pupils_Registration_Regulations:0 "Règlement relatif à l'inscription des élèves"
 UK50_Pupils_Registration_Regulations_desc:0 "Tous les élèves britanniques doivent être inscrits dans leur établissement scolaire afin d'éviter les cas d'absentéisme et de garantir leur scolarité."
 UK50_Mines_Quarry_Act:0 "Loi sur les mines et les carrières"
 UK50_Mines_Quarry_Act_desc:0 "La loi de 1954 sur les mines et les carrières a été adoptée par le Parlement « afin d'établir de nouvelles dispositions relatives à la gestion et au contrôle des mines et des carrières, ainsi que pour garantir la sécurité, la santé et le bien-être des personnes qui y travaillent... »"
 UK50_Inaugurate_Premium_Bonds:0 "Lancer les obligations Premium"
 UK50_Inaugurate_Premium_Bonds_desc:0 "Les « Premium Bonds » sont des obligations de loterie émises par le gouvernement britannique depuis 1956 ; elles font l'objet d'un tirage au sort mensuel, et le gouvernement s'engage à les rembourser avec intérêts."
 UK50_Subsidize_Unilever_Innovation:0 "Soutenir financièrement l'innovation chez Unilever"
 UK50_Subsidize_Unilever_Innovation_desc:0 "Unilever est une multinationale britannique spécialisée dans les biens de consommation, dont le siège se trouve à Londres, en Angleterre. Réputée pour son esprit d'innovation, Unilever devrait bénéficier de subventions en reconnaissance de sa contribution à l'économie britannique."
 UK50_Vote_Tax_Cuts_Leyland_BMC:0 "Votez pour les réductions d'impôts au conseil municipal de Leyland"
 UK50_Vote_Tax_Cuts_Leyland_BMC_desc:0 "La British Motor Corporation Limited (BMC Limited) était un constructeur automobile britannique fondé au début de l'année 1952, qui avait racheté des parts de l'Austin Motor Company et de Morris Motors."
 UK50_Encourage_Marketing_Department_Openings:0 "Encourager les recrutements au sein du service marketing"
 UK50_Encourage_Marketing_Department_Openings_desc:0 "Le marketing et la publicité jouent un rôle crucial dans la croissance de notre économie ; il est donc essentiel que les offres d'emploi actuelles dans ce secteur soient rendues publiques et visibles."
 UK50_Fund_Pilkington_Glass:0 "Fonds Pilkington Glass"
 UK50_Fund_Pilkington_Glass_desc:0 "Pilkington est un fabricant britannique de verre et de verre flotté, ayant mis au point ce dernier procédé en 1953. Le financement de cette entreprise est essentiel, car elle exporte ses produits dans le monde entier."
 UK50_Open_Dunlop_Facilities:0 "Visite des installations Dunlop"
 UK50_Open_Dunlop_Facilities_Desc:0 "Dunlop Rubber Company Ltd. est une multinationale britannique spécialisée dans la fabrication de caoutchouc et de pneus, dont le siège se trouve à Birmingham, en Angleterre. Elle détient plus de la moitié du marché britannique des pneus et emploie 70 000 personnes. Il lui faut davantage d'usines pour s'assurer la domination du marché des pneus."
 UK50_Restrict_Bank_of_England_Credit_Allocation:0 "Limiter l'octroi de crédits par la Banque d'Angleterre"
 UK50_Restrict_Bank_of_England_Credit_Allocation_desc:0 "Limiter le pouvoir de la Banque d'Angleterre d'octroyer des crédits à ses clients devrait, en théorie, freiner la hausse de l'inflation et contrôler la masse monétaire du Royaume-Uni."
 UK50_Set_Up_Radcliffe_Commission:0 "Créer la Commission Radcliffe"
 UK50_Set_Up_Radcliffe_Commission_desc:0 "Le rapport de la commission sur le fonctionnement du système monétaire est un document publié en 1959 par la commission Radcliffe, présidée par Cyril Radcliffe. Il passe en revue la politique monétaire et formule des recommandations concernant la maîtrise de l'offre."
 UK50_Allow_Sterling_Pound_Convertibility:0 "Autoriser la convertibilité de la livre sterling"
 UK50_Allow_Sterling_Pound_Convertibility_desc:0 "Le fait de permettre la conversion de la livre sterling en d'autres devises, telles que le dollar et le mark allemand, permettra de mieux contrôler la masse monétaire et au gouvernement de maintenir un excédent croissant."
 UK50_Metropolitan_Vickers_Train_Engines_Modernization:0 "Modernisation des moteurs de train Metropolitan Vickers"
 UK50_Metropolitan_Vickers_Train_Engines_Modernization_desc:0 "Dans le cadre du plan de modernisation des chemins de fer britanniques, il est nécessaire de mettre en service des locomotives produites par Metropolitan Vickers, telles que la British Rail Class 77 et la Rail Class 28, afin de disposer de véhicules de transport modernes."
 UK50_Develop_Fulmer_Reasearch_Institute_Mineral_Fund:0 "Développer le Fonds minier de l'Institut de recherche Fulmer"
 UK50_Develop_Fulmer_Reasearch_Institute_Mineral_Fund_desc:0 "L'Institut de recherche Fulmer est un organisme britannique de recherche et développement, créé en 1946 en tant qu'institut de recherche en technologie des matériaux et en chimie. Chargé de mener des recherches sur la production d'aluminium, les carburants pour fusées et les alliages légers, il est indispensable de développer le Fonds minéral pour soutenir ses découvertes."
 UK50_Stimulate_English_Electric_Computer_Research:0 "Stimuler la recherche en informatique chez English Electric"
 UK50_Stimulate_English_Electric_Computer_Research_desc:0 "English Electric est une entreprise britannique spécialisée dans les équipements électriques, les moteurs, les avions et les moteurs. Le développement et la recherche autour de l'English Electric DEUCE, le premier ordinateur britannique disponible dans le commerce, contribueront à la croissance de notre économie."
 UK50_Imperial_Chemical_Industries_Plant_Development:0 "Développement des usines d'Imperial Chemical Industries"
 UK50_Imperial_Chemical_Industries_Plant_Development_desc:0 "Imperial Chemical Industries est une grande entreprise chimique britannique spécialisée dans les produits chimiques, les plastiques et les produits pharmaceutiques. En tant que première entreprise chimique du Royaume-Uni, ses usines et ses installations contribueront à dynamiser l'économie à l'échelle nationale."
 UK50_Aid_Marconi_Instrument_LTD:0 "Soutenir Marconi Instrument Ltd."
 UK50_Aid_Marconi_Instrument_LTD_desc:0 "Marconi Instruments Limited est une entreprise britannique spécialisée dans l'électronique, issue d'une fusion en 1936 ; elle fabrique des oscilloscopes, des voltmètres, des composants électriques et d'autres équipements. La Grande-Bretagne devrait commencer à faire de l'électronique un pilier de son industrie."
 UK50_Connect_Calder_Hall_Chapelcross_Reactors:0 "Relier les réacteurs de Calder Hall et de Chapelcross"
 UK50_Connect_Calder_Hall_Chapelcross_Reactors_desc:0 "Calder Hall et Chapelcross sont deux centrales nucléaires de type Magnox situées dans le sud-ouest de l'Écosse, exploitées par l'Autorité britannique de l'énergie atomique et chargées d'enrichir du plutonium pour le programme d'armement nucléaire britannique, en plus de fournir de l'électricité."
 UK50_Restructure_German_Debt:0 "Restructurer la dette allemande"
 UK50_Restructure_German_Debt_desc:0 "Les réparations d'après-guerre versées aux Alliés seront modifiées par la mise en œuvre de l'Accord de Londres sur les dettes extérieures de l'Allemagne, qui couvrira les prêts accordés dans le cadre des précédents plans Dawes et Marshall, ce qui se traduira par un versement annuel d'environ 765 millions de marks de la part de l'Allemagne."
 UK50_Increase_MI5_Funds:0 "Augmenter le budget du MI5"
 UK50_Increase_MI5_Funds_desc:0 "Compte tenu des menaces liées à la guerre froide, nous devons augmenter les crédits alloués à la sécurité nationale."
 UK50_MI6_Expansion:0 "Extension du MI6"
 UK50_MI6_Expansion_desc:0 "Compte tenu des menaces liées à la guerre froide, nous devons augmenter nos dépenses en matière de sécurité extérieure."
 UK50_Sign_Peace_Treaty_Japan:0 "Signer un traité de paix avec le Japon"
 UK50_Sign_Peace_Treaty_Japan_desc:0 "Avec la loi de 1951 relative au traité de paix avec le Japon, nous parvenons enfin à une paix totale avec ce pays."
 UK50_Push_FRG_Admission_Council_Europe:0 "Pressions en faveur de l'adhésion de l'Allemagne de l'Ouest au Conseil de l'Europe"
 UK50_Sign_Economic_Partnership_ECSC:0 "Signer un accord de partenariat économique avec la CECA"
 UK50_Sign_Economic_Partnership_ECSC_desc:0 "La Communauté européenne du charbon et de l'acier était une organisation regroupant six pays européens, créée après la Seconde Guerre mondiale afin de réguler leur production industrielle sous l'égide d'une autorité centralisée."
 UK50_H_Bomb_Program:0 "Le programme de la bombe H"
 UK50_H_Bomb_Program_desc:0 "C'est incroyable, le respect que suscitent les armes nucléaires."
 UK50_Participate_Geneva_Conference:0 "Participer à la Conférence de Genève"
 UK50_Participate_Geneva_Conference_desc:0 "Participer à la Conférence de Genève sur le Vietnam."
 UK50_Help_British_Petroleum_Iran:0 "Aider le British Petroleum en Iran"
 UK50_Help_British_Petroleum_Iran_desc:0 "Aider la société British Petroleum à résoudre ses problèmes avec le gouvernement iranien."
 UK50_Foudn_Bagdad_Pact:0 "Découverte du Pacte de Bagdad"
 UK50_Foudn_Bagdad_Pact_desc:0 "Le Pacte de Bagdad est une alliance militaire entre l'Iran, l'Irak, le Pakistan, la Turquie et le Royaume-Uni."
 UK50_Blue_Streak_Missile_Program:0 "Programme de missiles Blue Streak"
 UK50_Blue_Streak_Missile_Program_desc:0 "Il est clair que si la Grande-Bretagne souhaite disposer d'une force de dissuasion nucléaire crédible, un missile balistique est indispensable. Nous n'avons pas pu acheter d'armes américaines en gros en raison des restrictions imposées par la loi sur l'énergie atomique de 1946.\nLes Américains ont alors proposé un programme de développement conjoint de missiles balistiques. Les États-Unis développeraient un missile balistique intercontinental, tandis que nous développerions un missile balistique à portée intermédiaire. La proposition a été acceptée dans le cadre de l'accord Wilson-Sandys."
 UK50_Ask_American_Help:0 "Demander de l'aide aux Américains"
 UK50_Ask_American_Help_desc:0 "Demander de l'aide aux Américains"
 UK50_Tackle_Nasser_Regime:0 "S'attaquer au régime de Nasser"
 UK50_Tackle_Nasser_Regime_desc:0 "Nasser est une véritable épine dans le pied dont il faut se débarrasser."
 UK50_Propose_Signature_EFTA:0 "Proposer le traité de l'Association européenne de libre-échange"
 UK50_Propose_Signature_EFTA_desc:0 "L'Association européenne de libre-échange (AELE) est une organisation commerciale régionale et une zone de libre-échange. Elle a été fondée pour offrir une alternative aux États européens qui ne pouvaient ou ne souhaitaient pas adhérer à la Communauté économique européenne de l'époque."
 UK50_Commonwealth_Affairs:0 "Affaires du Commonwealth"
 UK50_Commonwealth_Affairs_desc:0 "Questions relatives au Commonwealth"
 UK50_Change_Imperial_Semantics:0 "Modifier la sémantique impériale"
 UK50_Change_Imperial_Semantics_desc:0 "« Je pense pouvoir sauver l'Empire britannique de tout, sauf des Britanniques. »\n-Winston Churchill"
 UK50_Colonial_Welfare_Development_Act:0 "Loi sur le développement de l'aide sociale dans les territoires d'outre-mer de [GetYear]"
 UK50_Colonial_Welfare_Development_Act_desc:0 "La loi de [GetYear] sur le développement social des colonies constitue une extension de la loi de 1946. Les fonds alloués au titre de cette loi sont versés au Conseil de recherche en sciences sociales des colonies, qui conseille le ministre des Colonies sur le financement de la recherche en sociologie et en anthropologie liée au développement colonial."
 UK50_Abandon_Groundnut_Scheme:0 "Abandon du programme de culture de l'arachide au Tanganyika"
 UK50_Abandon_Groundnut_Scheme_desc:0 "Le programme de culture de l'arachide du Tanganyika, ou programme de culture de l'arachide d'Afrique de l'Est, visait à accroître la production d'arachides au Tanganyika.\nLes promoteurs du programme avaient ignoré les avertissements selon lesquels l'environnement et les précipitations n'étaient pas adaptés, les moyens de communication étaient insuffisants et l'ensemble du projet était mené avec une précipitation excessive. Malgré des efforts considérables et un coût de £36 millions de livres sterling (soit plus d'un £1 milliard de livres sterling en valeur de 2020), le projet s'est soldé par un échec cuisant."
 UK50_Colonial_Loans_Act:0 "Loi sur les prêts coloniaux"
 UK50_Colonial_Loans_Act_desc:0 "La loi sur les prêts aux colonies a pour objectif d'octroyer des fonds à nos colonies afin d'améliorer leurs zones les plus défavorisées."
 UK50_Approve_Central_African_Federation_Principle:0 "Approuver le principe de la Fédération d'Afrique centrale"
 UK50_Approve_Central_African_Federation_Principle_desc:0 "Grâce aux négociations, nous sommes prêts à approuver la Fédération centrafricaine."
 UK50_Build_New_Airstrips_Gulf:0 "Construire de nouvelles pistes d'atterrissage dans le golfe Persique"
 UK50_Build_New_Airstrips_Gulf_desc:0 "Nous devons étendre notre influence militaire dans la région du golfe Persique."
 UK50_Expand_Indian_Ocean_Bases:0 "Développer les bases dans l'océan Indien"
 UK50_Expand_Indian_Ocean_Bases_desc:0 "Nous devons étendre notre influence militaire dans l'océan Indien."
 UK50_Strengthen_Commonwealth_Trade:0 "Renforcer le commerce au sein du Commonwealth"
 UK50_Strengthen_Commonwealth_Trade_desc:0 "Renforcer les échanges commerciaux au sein du Commonwealth grâce à de nouveaux accords commerciaux."
 UK50_Increase_White_Dominion_Political_Ties:0 "Renforcer les liens politiques avec les pays d'influence blanche"
 UK50_Increase_White_Dominion_Political_Ties_desc:0 "« Gardons l'Angleterre blanche » est un bon slogan.\n-Winston Churchill, 1955"
 UK50_Stimulate_Sterling_Use:0 "Encourager l'utilisation de la livre sterling"
 UK50_Stimulate_Sterling_Use_desc:0 "Depuis la Seconde Guerre mondiale, la livre sterling a perdu de son importance sur la scène internationale, son utilisation étant tombée bien en deçà de ce qu'elle était pendant la guerre, en raison à la fois d'une perte de confiance à son égard et d'un déplacement des marchés vers l'Europe."
 ENG_60s_Continue_The_Economic_Boom:0 "Poursuivre l'essor économique"
 ENG_60s_Continue_The_Economic_Boom_desc:0 "L'économie se porte à merveille et il serait imprudent d'y mettre un terme ; nous devons prendre des mesures pour garantir que l'économie continue de prospérer, afin que le pays lui-même puisse continuer à se développer. "
 ENG_60s_The_Winds_of_Change:0 "Les vents du changement"
 ENG_60s_The_Winds_of_Change_desc:0 "Les temps changent, la colonisation est condamnée au niveau international et les mouvements d'indépendance prennent de l'ampleur. Nous sommes confrontés à un choix : tenter de préserver notre empire ou leur accorder leur indépendance. Peut-être est-il temps que le soleil se couche enfin sur l'Empire britannique."
 ENG_60s_The_British_Armed_Forces:0 "Les forces armées britanniques"
 ENG_60s_The_British_Armed_Forces_desc:0 "Le moment est venu : à mesure que le monde évolue, l'armée doit suivre le mouvement. Nous devons tout mettre en œuvre pour que notre armée réponde aux normes modernes, afin de pouvoir nous protéger de nos ennemis et exercer notre influence."
 ENG_60s_Prime_Minister_MacMillan:0 "Le Premier ministre MacMillan"
 ENG_60s_Prime_Minister_MacMillan_desc:0 "Après la démission forcée d'Anthony Eden, c'est désormais à Harold Macmillan qu'il revient de mener notre grande nation vers l'avenir ; toutefois, compte tenu du ralentissement économique et des troubles coloniaux qui s'annoncent, il reste à voir si son mandat sera couronné de succès."
 ENG_60s_Elections_of_1964:0 "Élections de 1964"
 ENG_60s_Elections_of_1964_desc:0 "Les résultats sont tombés, mais il reste à voir qui s'est imposé et est devenu le nouveau parti au pouvoir. "
 ENG_60s_Elections_of_1966:0 "Élections de 1966"
 ENG_60s_Elections_of_1966_desc:0 "Les votes ont été dépouillés après les récentes élections, je me demande qui a gagné."
 ENG_60s_Elections_of_1970:0 "Élections de 1970"
 ENG_60s_Elections_of_1970_desc:0 "Les voici donc, ces nouvelles élections qui marquent le début d'une nouvelle décennie ; il reste toutefois à voir dans quelle mesure le parti élu saura s'imposer."
 ENG_60s_Increase_Affordable_Housing:0 "Augmenter l'offre de logements abordables"
 ENG_60s_Increase_Affordable_Housing_desc:0 "Les gens ont besoin d'un logement, mais surtout, cela représente une lacune sur le marché : si nous parvenons à augmenter le nombre de logements abordables, cela renforcera notre popularité, sans parler de l'amélioration de nos finances."
 ENG_60s_Increase_Weapon_Exports:0 "Augmenter les exportations d'armes"
 ENG_60s_Increase_Weapon_Exports_desc:0 "Alors que les tensions s'intensifient à travers le monde et que de nouvelles guerres éclatent, la demande en armes connaît une hausse soudaine, ce qui a créé une lacune sur le marché ; nous devons donc augmenter immédiatement la production d'armes afin de pouvoir en vendre davantage."
 ENG_60s_Expand_Auto_Usage:0 "Développer l'utilisation de la voiture"
 ENG_60s_Expand_Auto_Usage_desc:0 "Au fil du temps, on constate que de plus en plus de gens utilisent la voiture dans d'autres pays ; nous serions bien bêtes de passer à côté. Nous devons inciter davantage de personnes à utiliser la voiture : cela leur permet de se déplacer plus facilement et donne un coup de pouce à l'industrie automobile. Tout le monde y gagne."
 ENG_60s_The_Benefits_of_Full_Employment:0 "Les avantages du plein emploi"
 ENG_60s_The_Benefits_of_Full_Employment_desc:0 "Alors que l'économie continue de croître, nous devons veiller à ce que les gens aient du travail, et l'un des moyens d'y parvenir est de leur faire prendre conscience des nombreux avantages du plein emploi ! Promouvoir cette campagne nous coûtera certes un peu de capital politique, mais cela en vaudra largement la peine en termes de gains économiques."
 ENG_60s_Encourage_Economic_Modernization:0 "Encourager la modernisation économique"
 ENG_60s_Encourage_Economic_Modernization_desc:0 "À mesure que la technologie progresse, nous ne pouvons pas nous cantonner à nos méthodes dépassées ; nous devons encourager le développement technologique, sous peine d'être laissés pour compte."
 ENG_60s_Encourage_Higher_Wages:0 "Encourager la hausse des salaires"
 ENG_60s_Encourage_Higher_Wages_desc:0 "À mesure que l'économie se développe, les bénéfices des entreprises augmentent en conséquence ; augmenter les salaires permettra non seulement de renforcer le pouvoir d'achat des citoyens et de stimuler la croissance d'autres entreprises, mais aussi de renforcer notre popularité auprès de la population."
 ENG_60s_Devalue_the_Pound:0 "Dévaluer la livre sterling"
 ENG_60s_Devalue_the_Pound_desc:0 "Même si cela va nuire à l'économie à court terme, nous ne devons pas prendre le risque de voir l'hyperinflation détruire l'économie à long terme ; nous devons dévaluer la livre tant que notre économie est encore assez solide pour en supporter les conséquences."
 ENG_60s_Increase_Airliner_Exports:0 "Accroître les exportations d'avions de ligne"
 ENG_60s_Increase_Airliner_Exports_desc:0 "L'économie mondiale en pleine croissance a besoin d'avions, tout comme le secteur touristique en plein essor, et les exportations britanniques sont là pour répondre à cette demande : plus nous vendrons d'avions de ligne, plus nos bénéfices augmenteront, c'est aussi simple que cela."
 ENG_Establish_the_National_Economic_Development_Council:0 "Créer le Conseil national de développement économique"
 ENG_Establish_the_National_Economic_Development_Council_desc:0 "À mesure que l'économie se développe, les besoins en infrastructures augmentent également ; nous devons mettre en place un programme visant à accélérer la construction d'infrastructures afin d'éviter qu'elles ne prennent du retard par rapport à la demande"
 ENG_60s_Achieve_Budgetary_Surplus:0 "Réaliser un excédent budgétaire"
 ENG_60s_Achieve_Budgetary_Surplus_desc:0 "L'économie s'est tellement développée que nous disposons désormais d'un excédent budgétaire, ce qui nous donne la liberté d'investir davantage et de stimuler l'économie, tout en renforçant encore notre popularité."
 ENG_60s_Encourage_Corporate_Mergers:0 "Encourager les fusions d'entreprises"
 ENG_60s_Encourage_Corporate_Mergers_desc:0 "À mesure que l'économie se développe, de nouvelles entreprises voient le jour ; nous devrions les encourager à fusionner afin d'accroître leurs bénéfices et de se prémunir contre la faillite."
 ENG_60s_Condemn_Rhodesian_UDI:0 "Condamner la déclaration unilatérale d'indépendance de la Rhodésie"
 ENG_60s_Condemn_Rhodesian_UDI_desc:0 "La déclaration d'indépendance de la Rhodésie est inacceptable : elle sape notre autorité et nous jette au visage un pied de nez ! Nous ne pouvons pas les laisser partir dans ces conditions, mais il vaudrait peut-être mieux rechercher une solution diplomatique plutôt qu'une solution militaire."
 ENG_60s_Open_Negotiations_with_Rhodesia:0 "Ouvrir des négociations avec la Rhodésie"
 ENG_60s_Open_Negotiations_with_Rhodesia_desc:0 "Il serait imprudent de tenter de réprimer ce mouvement par la force ; nous devons nous montrer comme la puissance dominante et entamer des pourparlers avec la Rhodésie ; peut-être pourrons-nous tourner ce mouvement à notre avantage en engageant le dialogue."
 ENG_60s_Sanction_Rhodesia:0 "Sanctionner la Rhodésie"
 ENG_60s_Breakdown_of_Negotiations:0 "Échec des négociations"
 ENG_60s_Breakdown_of_Negotiations_desc:0 "Nous avons tenté de discuter avec la Rhodésie, mais en vain ; ils refusent de se montrer raisonnables à notre égard et nous allons donc continuer à exercer notre domination sur eux. Ils n’oseraient tout de même pas se lancer dans une entreprise aussi insensée qu’une révolte ?"
 ENG_60s_Recognize_Rhodesia:0 "Reconnaître la Rhodésie"
 ENG_60s_Recognize_Rhodesia_desc:0 "Les négociations avec la Rhodésie ont abouti, et nous avons convenu de la reconnaître. Espérons que cela ouvre la voie à un avenir radieux pour nos deux nations. "
 ENG_60s_Mitigate_International_Damages:0 "Limiter les dommages à l'échelle internationale"
 ENG_60s_Mitigate_International_Damages_desc:0 "La situation en Rhodésie a nui à notre réputation internationale ; nous devons donc désormais nous employer à rétablir cette réputation et la confiance des autres nations, afin d'aider notre pays à aller de l'avant et d'améliorer notre image aux yeux de la population."
 ENG_60s_Aid_Nigeria:0 "Aider le Nigeria"
 ENG_60s_Aid_Nigeria_desc:0 "Le Nigeria aspire à l'indépendance et il n'est plus possible de tenter de le maintenir sous notre joug ; il est donc désormais de notre devoir de l'aider à consolider cette indépendance naissante, sous peine de le voir tomber sous l'influence de nos ennemis."
 ENG_Reevaluate_The_Colonial_Situation:0 "Réévaluer la situation coloniale"
 ENG_Reevaluate_The_Colonial_Situation_desc:0 "Les temps ont changé ; nous ne pouvons plus continuer à diriger notre empire comme avant. Nous devons réévaluer la meilleure façon de gérer nos colonies restantes, de peur qu'elles ne se tournent vers des méthodes plus radicales pour opérer le changement."
 YEM_The_Aden_Emergency:0 "La crise à Aden"
 YEM_The_Aden_Emergency_desc:0 "« Les sauvages d'Aden se sont soulevés contre nous ! Nous devons prendre des mesures d'urgence pour garantir le maintien de notre domination sur cette précieuse région, ou peut-être est-il temps de renoncer définitivement à Aden. »"
 ENG_60s_Reap_Profits_from_Arabian_Protectorates:0 "Tirer profit des protectorats arabes"
 ENG_60s_Reap_Profits_from_Arabian_Protectorates_desc:0 "Tout en continuant à défendre nos possessions en Arabie, nous devrions pouvoir exploiter leurs ressources à notre avantage économique ; après tout, nous devons en tirer quelque chose : non seulement nous gagnerons davantage de ressources, mais nous créerons aussi plus d'emplois pour notre population."
 ENG_Declare_Martial_Law_in_Aden:0 "Proclamer la loi martiale à Aden"
 ENG_Declare_Martial_Law_in_Aden_desc:0 "La crise s'est aggravée, et nos installations dans la région sont la cible d'attaques menées par les insurgés ; nous devons faire appel à l'armée pour reprendre le contrôle de la zone et maintenir l'ordre, puisque le protectorat est manifestement incapable d'y parvenir par ses propres moyens."
 ENG_60s_Crackdown_on_Aden:0 "Répression à Aden"
 ENG_60s_Crackdown_on_Aden_desc:0 "Aden est une colonie britannique et le restera ! Nous ne nous laisserons pas intimider par ces insurgés ; nous devons sévir contre eux pour garder le contrôle, et cette fois-ci, nous ne céderons pas."
 ENG_60s_Withdraw_from_Aden:0 "Se retirer d'Aden"
 ENG_60s_Withdraw_from_Aden_desc:0 "La situation à Aden est devenue intenable ; il est désormais évident que toute ressource consacrée au maintien du contrôle est gaspillée ; nous devons donc céder aux exigences des insurgés et nous retirer."
 ENG_60s_Reject_Calls_for_South_African_Sanctions:0 "Rejeter les appels à des sanctions contre l'Afrique du Sud"
 ENG_60s_Reject_Calls_for_South_African_Sanctions_desc:0 "Même si la communauté internationale condamne l'apartheid, l'Afrique du Sud reste un allié de la Grande-Bretagne, et nous ne pouvons pas les laisser souffrir ; de plus, l'intensification des échanges commerciaux se traduira par davantage de bénéfices pour nous."
 ENG_60s_Announce_Withdrawal_from_the_Arabian_Gulf:0 "Annonce du retrait du golfe Persique"
 ENG_60s_Announce_Withdrawal_from_the_Arabian_Gulf_desc:0 "Malgré nos efforts pour conserver le contrôle de la région, nous devons nous retirer ; à l'instar d'une grande partie de nos possessions coloniales, celles-ci sont devenues non rentables et intenables. Nous ne pouvons tout simplement plus justifier notre présence ici, et le processus de retrait commence donc."
 ENG_60s_Resist_Calls_to_Withdraw_from_the_Gulf:0 "Résister aux appels au retrait du Golfe"
 ENG_60s_Resist_Calls_to_Withdraw_from_the_Gulf_desc:0 "Nous contrôlons le golfe Persique et rien d'autre ; nous ne laisserons aucune puissance étrangère tenter de nous affaiblir ; nous sommes l'Empire britannique et nous maintiendrons notre emprise sur notre empire ; nous maintiendrons notre emprise sur le golfe, pour le roi et la patrie !"
 ENG_60s_The_Balance_of_Payments_Crisis:0 "La crise de la balance des paiements"
 ENG_60s_The_Balance_of_Payments_Crisis_desc:0 "Malgré la croissance économique rapide des années 50, notre monnaie a commencé à se déprécier, et nous avons désormais du mal à importer les biens dont nous avons besoin et à rembourser nos dettes. Il faut agir rapidement pour éviter que notre économie ne s'effondre"
 ENG_60s_Temporary_Wage_Freeze:0 "Gel temporaire des salaires"
 ENG_60s_Temporary_Wage_Freeze_desc:0 "Afin de réduire les dépenses, nous devons mettre un terme à l'augmentation des salaires liée à l'inflation, sans quoi la situation risque de devenir rapidement incontrôlable. Cela rendra le parti impopulaire auprès de la population, mais permettra de stabiliser l'économie et de renforcer notre popularité auprès des grandes entreprises."
 ENG_60s_Establish_The_National_Income_Commission:0 "Créer la Commission nationale des revenus"
 ENG_60s_Establish_The_National_Income_Commission_desc:0 "Le gel des salaires a porté ses fruits, mais nous devrons finir par le lever ; c'est pourquoi nous devons mettre en place une commission chargée de gérer les salaires et les prix à l'avenir, afin de maîtriser l'inflation."
 ENG_60s_Labour_Victory:0 "Victoire des Travaillistes"
 ENG_60s_Labour_Victory_desc:0 "Le Parti travailliste a remporté les dernières élections ; nous pouvons désormais nous atteler à démanteler les politiques conservatrices et à mettre en place des mesures qui permettront à la Grande-Bretagne d'entrer dans l'avenir, un avenir plus libéral conçu pour aider l'homme de la rue et non les riches."
 ENG_60s_Decrease_Public_Censorship:0 "Réduire la censure publique"
 ENG_60s_Decrease_Public_Censorship_desc:0 "Nous ne vivons pas sous une dictature ; la censure d'État est un phénomène auquel on s'attendrait en Union soviétique, pas en Grande-Bretagne. Il est temps de limiter la censure publique afin de bâtir une nation plus démocratique."
 ENG_60s_Liberalize_Abortion_Laws:0 "Libéraliser la législation sur l'avortement"
 ENG_60s_Liberalize_Abortion_Laws_desc:0 "Des centaines de femmes sont contraintes de se rendre chez des médecins peu scrupuleux pour se faire avorter. Nous en avons assez : il est temps de faciliter l'accès à l'avortement afin de mettre un terme au nombre de décès liés à cette pratique. Cela ne manquera pas de renforcer notre popularité auprès de la population."
 ENG_60s_Labour_Victory_66:0 "Victoire des Travaillistes"
 ENG_60s_Labour_Victory_66_desc:0 "Maintenant que nous avons été élus, nous devons nous mettre au travail pour bâtir la Grande-Bretagne que les citoyens souhaitent et pour laquelle ils ont voté. "
 ENG_60s_Increase_Agricultural_Subsidies:0 "Augmenter les subventions agricoles"
 ENG_60s_Increase_Agricultural_Subsidies_desc:0 "Nos agriculteurs nourrissent notre population et nous devons leur verser des aides financières afin qu'ils puissent moderniser leurs exploitations et augmenter leurs rendements ; après tout, nous ne voudrions pas nous retrouver à court d'argent."
 ENG_60s_Labour_Victory_70:0 "Victoire des Travaillistes"
 ENG_60s_Labour_Victory_70_desc:0 "Nous avons remporté une nouvelle élection, et nous devons désormais veiller à ce que la volonté du peuple soit respectée. C'est le peuple qui nous a élus, et bon sang, nous allons l'écouter dès maintenant et pour les cinq prochaines années."
 ENG_60s_Fight_Racial_Inequality:0 "Lutter contre les inégalités raciales"
 ENG_60s_Fight_Racial_Inequality_desc:0 "À mesure que le temps passe, notre attitude doit évoluer elle aussi ; le monde devient de plus en plus ouvert, et nous devons être capables de suivre le rythme. La quantité de mélatonine présente dans votre peau n'a aucune incidence sur l'intelligence ou le comportement, et il est temps que nous commencions à traiter les autres ethnies sur un pied d'égalité, pour une Grande-Bretagne plus unie."
 ENG_60s_Abolish_the_Death_Penalty:0 "Abolir la peine de mort"
 ENG_60s_Abolish_the_Death_Penalty_desc:0 "Nous ne pouvons plus rester les bras croisés et laisser la peine de mort perdurer ; il a été prouvé qu'elle n'a aucun effet dissuasif et qu'elle est tout simplement barbare, n'ayant pas sa place dans un pays occidental moderne. Il est temps d'abolir la peine de mort une fois pour toutes !"
 ENG_60s_Decriminalize_Homosexuality:0 "Dépénaliser l'homosexualité"
 ENG_60s_Decriminalize_Homosexuality_desc:0 "Au cours des années précédentes, de nombreuses personnes ont été identifiées comme homosexuelles, mais on ne devrait pas arrêter quelqu’un simplement parce qu’il aime une personne du même sexe. Nous devons immédiatement dépénaliser l’homosexualité, créer un pays plus libre et plus libéral, et nous assurer le soutien électoral des homosexuels."
 ENG_60s_Return_to_Nationalizations:0 "Retour à la rubrique « Nationalisations »"
 ENG_60s_Return_to_Nationalizations_desc:0 "Au cours des années précédentes, sous la direction des conservateurs, de plus en plus de secteurs de l'économie ont été privatisés ; or, cela s'est avéré inefficace pour aider la population et l'économie. Nous devons renationaliser l'économie ; après tout, c'est toujours le gouvernement qui sait le mieux ce qu'il faut faire."
 ENG_60s_Investigate_Railway_Reform:0 "Étudier la réforme du secteur ferroviaire"
 ENG_60s_Investigate_Railway_Reform_desc:0 "Alors que la crise s'aggrave, il est nécessaire de se pencher sur les dépenses publiques ; le réseau ferroviaire constitue l'un des domaines où il serait possible de réduire ces dépenses, et nous devons examiner s'il existe des possibilités de réforme permettant de réduire les coûts."
 ENG_60s_The_Beeching_Axe:0 "La « hache de Beeching »"
 ENG_60s_The_Beeching_Axe_desc:0 "Il est clair que nous ne pouvons plus nous permettre de maintenir notre système actuel ; des coupes budgétaires s'imposent, même au prix de suppressions d'emplois et de réductions des infrastructures. De nombreuses gares et kilomètres de lignes devront donc être supprimés. Même si cela ne plaira pas aux personnes qui y travaillent, il s'agit d'un sacrifice nécessaire pour l'économie."
 ENG_60s_Reduce_Inflation:0 "Réduire l'inflation"
 ENG_60s_Reduce_Inflation_desc:0 "Grâce à la maîtrise des dépenses publiques et au rôle joué par les cotisations sociales dans la maîtrise des salaires et des prix, nous sommes désormais en bonne position pour commencer à lutter contre l'hyperinflation. Ces efforts de lutte contre l'inflation prendront du temps et risquent de rendre la vie difficile à la population, mais ils ne pourront que nous être bénéfiques à long terme."
 ENG_60s_Increase_Education_Funding:0 "Augmenter le financement de l'éducation"
 ENG_60s_Increase_Education_Funding_desc:0 "L'éducation est importante : grâce à des personnes instruites, nous disposons d'une main-d'œuvre qualifiée, et une main-d'œuvre plus diversifiée favorise la croissance de notre économie. Non seulement cela améliorera la vie des gens, mais cela augmentera aussi nos revenus, et n'est-ce pas toujours une bonne chose ?"
 ENG_60s_Encourage_Economic_Planning:0 "Encourager la planification économique"
 ENG_60s_Encourage_Economic_Planning_desc:0 "Pour qu'une économie soit florissante, le chaos n'a pas sa place ; c'est pourquoi nous devons tout planifier avec soin afin de ne pas perdre le contrôle et sombrer dans le chaos. Grâce à une planification rigoureuse, nous pourrons plus facilement affecter les ressources aux domaines qui en ont besoin et permettre à l'économie de prospérer."
 ENG_60s_Increase_Welfare_Benefits:0 "Augmenter les prestations sociales"
 ENG_60s_Increase_Welfare_Benefits_desc:0 "Tout le monde n'a pas la même chance dans la vie, et ceux qui traversent une période difficile ont besoin de notre aide. Nous devons augmenter les prestations sociales pour aider ces personnes à se remettre sur pied et à retrouver un emploi ! Cela nous permettra en outre de nous assurer leurs votes à l'avenir."
 ENG_60s_Urban_Renewal_Program:0 "Programme de rénovation urbaine"
 ENG_60s_Urban_Renewal_Program_desc:0 "Les zones urbaines sont devenues obsolètes et inefficaces ; c'est pourquoi nous devons lancer un nouveau programme visant à les moderniser, non seulement pour améliorer le niveau de vie, mais aussi pour faciliter considérablement la construction de nouveaux quartiers urbains. "
 ENG_60s_Increase_Access_to_Healthcare:0 "Améliorer l'accès aux soins de santé"
 ENG_60s_Increase_Access_to_Healthcare_desc:0 "La santé occupe une place importante dans le programme électoral du Parti travailliste, mais cela ne sert pas à grand-chose si les gens ne peuvent pas en bénéficier ; c'est pourquoi nous devons investir pour la rendre plus accessible, tout en renforçant notre popularité et l'efficacité du système de santé."
 ENG_60s_Industrial_Reorganization:0 "Réorganisation industrielle"
 ENG_60s_Industrial_Reorganization_desc:0 "Le moment est à nouveau venu de redoubler d'efforts pour améliorer l'efficacité et la productivité de notre secteur ; nous devons le réorganiser afin de lui donner les moyens de rester en phase avec le reste du monde."
 ENG_60s_Subsidize_Scottish_Industry:0 "Subventionner l'industrie écossaise"
 ENG_60s_Subsidize_Scottish_Industry_desc:0 "Il existe en Écosse tout un marché qui reste inexploité ; pour stimuler la croissance économique, nous devons subventionner l'industrie écossaise afin d'encourager son développement, ce qui permettra non seulement d'augmenter la production dans la région, mais aussi de créer des emplois."
 ENG_Continue_Heavy_Rail_Spending:0 "Poursuivre les investissements dans le rail"
 ENG_Continue_Heavy_Rail_Spending_desc:0 "Même si nous avons trouvé des moyens de réformer le réseau ferroviaire, celui-ci reste un élément essentiel de nos infrastructures ; nous devons donc continuer à y consacrer des investissements importants pour l'entretenir. Si nous le faisons, nos infrastructures n'en seront que meilleures, et, espérons-le, notre économie en profitera également."
 ENG_60s_Establish_The_EFTA:0 "Créer l'AELE"
 ENG_60s_Establish_The_EFTA_desc:0 "Les querelles européennes nous ont coûté notre place sur la scène internationale ; les guerres mondiales ont permis aux Américains et aux Soviétiques de devenir des puissances mondiales. Il ne faut pas que cela se reproduise : l'Europe doit se souder davantage, sous peine de risquer une nouvelle guerre. La mise en place du libre-échange contribue non seulement à cet objectif, mais nous garantit également de meilleurs accords commerciaux, ce qui est une situation gagnant-gagnant."
 ENG_60s_The_Night_of_Long_Knives:0 "La Nuit des longs couteaux"
 ENG_60s_The_Night_of_Long_Knives_desc:0 "Le gouvernement actuel est devenu obsolète et dépassé, et cela commence à se refléter dans les sondages ! Nous devons immédiatement procéder à un remaniement ministériel afin de mieux nous adapter à la situation actuelle et de préparer le gouvernement à relever les défis à venir."
 ENG_60s_Increase_Government_Support:0 "Renforcer le soutien de l'État"
 ENG_60s_Increase_Government_Support_desc:0 "Maintenant que nous disposons d'un nouveau gouvernement plus dynamique, nous pouvons commencer à nous atteler à renforcer le soutien dont bénéficie le gouvernement ; les élections approchent et nous avons besoin d'une base solide qui nous confère davantage de légitimité pour mettre en œuvre notre politique."
 ENG_60s_Conservative_Victory:0 "Victoire des conservateurs"
 ENG_60s_Conservative_Victory_desc:0 "Nous avons réussi ! Grâce à des années de bonne gestion par les conservateurs, nous avons remporté une nouvelle élection. Il nous appartient désormais de maintenir l'économie sur les rails et d'assurer un avenir prospère à la Grande-Bretagne."
 ENG_60s_Reduce_Labour_Union_Influence:0 "Réduire l'influence des syndicats"
 ENG_60s_Reduce_Labour_Union_Influence_desc:0 "Les syndicats ont trop de pouvoir, les travailleurs passent plus de temps à faire grève qu'à travailler, ce qui nuit aux entreprises et à l'économie ; nous devons donc réduire leur pouvoir et remettre les choses sur les rails. Après tout, je suis sûr que les entreprises sauront très bien prendre soin de leurs employés."
 ENG_60s_Encourage_Economic_Efficiency:0 "Favoriser l'efficacité économique"
 ENG_60s_Encourage_Economic_Efficiency_desc:0 "Une économie efficace permettra de réduire la demande en ressources et les besoins d'investissement, ce qui entraînera une diminution des dépenses publiques. Si nous voulons une meilleure économie, nous devons en avoir une plus efficace."
 ENG_60s_Increase_Commonwealth_Technical_Cooperation:0 "Renforcer la coopération technique au sein du Commonwealth"
 ENG_60s_Increase_Commonwealth_Technical_Cooperation_desc:0 "Notre communauté compte de nombreux esprits brillants ; nous devrions donc les rassembler autour d'un objectif commun, celui du progrès technologique, afin d'accélérer le rythme de nos recherches et de nous permettre de suivre plus facilement le rythme d'un monde en constante évolution."
 ENG_60s_Encourage_Home_Modernization:0 "Encourager la rénovation des logements"
 ENG_60s_Encourage_Home_Modernization_desc:0 "Nos logements sont vétustes ; nous devons veiller à ce qu'ils soient modernisés, afin qu'ils consomment moins de ressources et offrent un meilleur confort à leurs occupants. Après tout, si les gens sont satisfaits, ils voteront bien sûr pour nous."
 ENG_60s_Endorse_Slum_Clearances:0 "Soutenir la démolition des bidonvilles"
 ENG_60s_Endorse_Slum_Clearances_desc:0 "Un pays aussi petit que le nôtre a besoin de plus d'espace, et quel meilleur point de départ que ces bidonvilles répugnants qui nous donnent mauvaise réputation ? Si on les démolit, nos villes auront meilleure allure et disposeront de plus d'espace pour s'étendre. C'est génial !"
 ENG_60s_The_Vassall_Tribunal:0 "Le Tribunal des vassaux"
 ENG_60s_The_Vassall_Tribunal_desc:0 "Depuis que l'on a découvert que Vassal était un traître, de très nombreuses personnes critiquent notre système de sécurité ; après tout, comment un fonctionnaire a-t-il pu être autorisé à entrer en contact avec les Soviétiques ? Nous avons été contraints de convoquer ce tribunal afin d'enquêter plus en détail sur ces allégations"
 ENG_60s_Deal_with_The_Profumo_Affair:0 "L'affaire Profumo"
 ENG_60s_Deal_with_The_Profumo_Affair_desc:0 "On a appris que John Profumo entretenait une liaison avec Christine Keeler, une mannequin de 19 ans. Les répercussions politiques de ce scandale ont été un véritable cauchemar et ont entraîné une chute considérable de notre popularité ; nous devons agir pour tenter de contenir la situation avant qu'elle ne dégénère."
 ENG_60s_Rally_the_Conservatives:0 "Mobiliser les conservateurs"
 ENG_60s_Rally_the_Conservatives_desc:0 "À la suite des récents scandales et de plusieurs initiatives visant à renforcer notre popularité, nous sommes désormais en mesure de rallier le soutien des conservateurs à travers tout le pays afin de remporter les prochaines élections ; cela ne manquera pas de se traduire par un regain de soutien en faveur de notre parti et, par conséquent, par une victoire électorale."
 ENG_60s_Conservative_Victory_66:0 "Victoire des conservateurs"
 ENG_60s_Conservative_Victory_66_desc:0 "À peine deux ans après les dernières élections, les conservateurs ont remporté la victoire, et c'est à nous qu'il revient une fois de plus de mener la Grande-Bretagne vers un avenir prospère. "
 ENG_60s_Reform_the_Welfare_State:0 "Réformer l'État-providence"
 ENG_60s_Reform_the_Welfare_State_desc:0 "Le système social actuel coûte beaucoup trop cher ; il faut le réformer afin de réduire les coûts et les dépenses publiques, puis de relancer l'économie, même si cela doit causer des difficultés à quelques citoyens ordinaires par la suite."
 ENG_60s_Conservative_Victory_70:0 "Victoire des conservateurs"
 ENG_60s_Conservative_Victory_70_desc:0 "Nous avons gagné la confiance du peuple britannique, et c'est à nous qu'il revient d'améliorer le pays et l'économie pour lui. En avant vers l'avenir, sous la houlette des conservateurs."
 ENG_60s_Cut_Education_Funding:0 "Réduire le financement de l'éducation"
 ENG_60s_Cut_Education_Funding_desc:0 "Une autre étape dans notre quête sans fin de croissance économique consiste à limiter les dépenses publiques, et il faut bien reconnaître que le système éducatif est l'un des postes les plus coûteux de notre budget. Nous devons donc commencer à réduire les financements, même si cela signifie que certains enfants ne pourront pas aller à l'école ; de toute façon, ils n'aiment pas y aller."
 ENG_60s_Raise_Compulsory_School_Age_to_16:0 "Relever l'âge de la scolarité obligatoire à 16 ans"
 ENG_60s_Raise_Compulsory_School_Age_to_16_desc:0 "Nous avons besoin de plus de travailleurs qualifiés, et le meilleur moyen d'y parvenir est d'obliger les gens à rester à l'école ; si nous les gardons plus longtemps à l'école, ils apprendront forcément davantage et acquerront ainsi plus de compétences qu'ils pourront mettre à profit dans le monde du travail."
 ENG_60s_Retain_Nuclear_Autonomy:0 "Préserver l'autonomie nucléaire"
 ENG_60s_Retain_Nuclear_Autonomy_desc:0 "Nous avons collaboré avec les États-Unis pour mettre au point l'arme nucléaire, mais ils se la sont gardée pour eux. C'est l'arme nucléaire qui nous permet de préserver notre indépendance à l'heure actuelle, et nous devons veiller à ce qu'aucune autre nation ne puisse la mettre en péril, tout en investissant dans notre propre recherche nucléaire avec nos propres fonds."
 ENG_60s_Increase_Investment_in_Northern_Ireland:0 "Accroître les investissements en Irlande du Nord"
 ENG_60s_Increase_Investment_in_Northern_Ireland_desc:0 "Nous nous sommes battus avec acharnement pour contrôler l'Irlande du Nord, et il ne nous est pas venu à l'esprit que cette région constituait un terrain d'investissement de choix. Si nous devions y investir, non seulement cela nous rendrait plus populaires aux yeux de la population, mais cela augmenterait également nos propres revenus : une excellente idée !"
 ENG_60s_Crackdown_on_Crime:0 "Lutte contre la criminalité"
 ENG_60s_Crackdown_on_Crime_desc:0 "La police a besoin de pouvoirs accrus pour assurer la sécurité de la population ; la criminalité a augmenté trop rapidement et nous devons la maîtriser à nouveau ; nous apporterons la paix, la liberté et la sécurité à notre nouvel empire."
 ENG_60s_The_Industrial_Relations_Act:0 "La loi sur les relations professionnelles"
 ENG_60s_The_Industrial_Relations_Act_desc:0 "Si nous voulons une meilleure économie, nous devons laisser les experts s'en occuper ; après tout, qui d'autre sait mieux gérer l'industrie que les entreprises industrielles elles-mêmes ? Nous devons améliorer nos relations avec elles afin d'accroître leur efficacité, même si cela doit se faire au détriment de certains droits des travailleurs ici ou là."
 ENG_60s_The_Royal_Navy:0 "La Royal Navy"
 ENG_60s_The_Royal_Navy_desc:0 "La Grande-Bretagne était autrefois réputée pour sa puissance navale, mais nous ne dominons plus les mers : les Américains nous ont détrônés en tant que première puissance navale. Nous ne pouvons toutefois pas laisser cette situation perdurer ; nous devons tout mettre en œuvre pour moderniser notre marine et retrouver notre place de première puissance navale."
 ENG_60s_County_Class_Destroyers:0 "Destroyeurs de classe County"
 ENG_60s_County_Class_Destroyers_desc:0 "Les sous-marins prenant de plus en plus d'importance, nous devons disposer d'un moyen efficace de les contrer ; c'est pourquoi nous devons investir dans la modernisation de nos destroyers afin de faire face à la menace croissante que représentent les sous-marins."
 ENG_60s_Resolution_Class_Submarines:0 "Sous-marins de la classe Resolution"
 ENG_60s_Resolution_Class_Submarines_desc:0 "Le sous-marin est le nouveau cuirassé ; nous devons investir dans cette nouvelle forme de guerre afin de pouvoir l'utiliser contre nos ennemis avant qu'ils ne s'en servent contre nous."
 ENG_60s_Fund_the_CVA_01_Carriers:0 "Financer les porte-avions CVA 01"
 ENG_60s_Fund_the_CVA_01_Carriers_desc:0 "Les porte-avions constituent un autre type de navire devenu indispensable à la guerre navale ; cependant, nos porte-avions sont vétustes et ne sont pas adaptés à la guerre moderne. Nous devons donc investir dans la conception d'un nouveau porte-avions plus moderne, capable de rivaliser à armes égales avec n'importe quel porte-avions américain ou soviétique."
 ENG_60s_Refit_Carriers:0 "Remise en état des porte-avions"
 ENG_60s_Refit_Carriers_desc:0 "Pourquoi acheter de nouveaux porte-avions alors qu'on peut moderniser ceux qu'on a déjà ? Il suffit de prendre nos porte-avions actuels et d'y installer quelques nouvelles pièces pour les remettre à niveau ; ils ne sont peut-être pas les meilleurs, mais ça ne coûte pas cher."
 ENG_60s_Invest_in_Nuclear_Submarines:0 "Investir dans les sous-marins nucléaires"
 ENG_60s_Invest_in_Nuclear_Submarines_desc:0 "Si nos investissements actuels dans les sous-marins permettent de les mettre à niveau, leurs batteries limitent toutefois la durée pendant laquelle ils peuvent rester sous l'eau. En revanche, si nous investissons dans l'énergie nucléaire récemment mise au point, nous pourrons prolonger leur autonomie et, par conséquent, leur efficacité."
 ENG_60s_The_British_Army:0 "L'armée britannique"
 ENG_60s_The_British_Army_desc:0 "Nous avons toujours privilégié une armée réduite et d'élite, et bien que ses effectifs n'aient pas augmenté depuis la Seconde Guerre mondiale, elle a pris du retard par rapport aux autres grandes puissances. C'est grâce à l'armée que nous conquérons et conservons nos territoires ; nous devons donc investir pour la mettre au niveau de nos rivaux."
 ENG_60s_Suspend_National_Service:0 "Suspendre le service national"
 ENG_60s_Suspend_National_Service_desc:0 "Bien que les tensions soient vives, nous avons toujours privilégié une armée plus réduite, ce qui permet d'en faire une force d'élite ; c'est pourquoi nous devons suspendre l'obligation du service national, ce qui non seulement renforcera notre popularité auprès de la population et lui permettra de reprendre le travail, mais la rendra également plus disposée à soutenir les guerres, puisqu'elle ne sera pas exposée au danger."
 ENG_60s_L2A1_Assault_Rifle:0 "Fusil d'assaut L2A1"
 ENG_60s_L2A1_Assault_Rifle_desc:0 "Une armée forte a besoin d'armes performantes ; nous devons investir dans des armes plus modernes pour équiper nos troupes et leur donner un avantage au combat."
 ENG_60s_Develop_the_Chieftain:0 "Développer le Chieftain"
 ENG_60s_Develop_the_Chieftain_desc:0 "La Seconde Guerre mondiale a démontré à tous l'efficacité de la « blitzkrieg » et des unités blindées ; nous devons veiller à ce que nos unités blindées puissent rivaliser avec celles de nos adversaires afin de pouvoir mettre en œuvre cette tactique qui a fait ses preuves."
 ENG_60s_Operation_Banner:0 "Opération Banner"
 ENG_60s_Operation_Banner_desc:0 "Les paramilitaires de l'Unification ont intensifié leurs opérations ; nous devons lancer l'opération « Banner » et reprendre le contrôle de la situation. "
 ENG_60s_The_Royal_Airforce:0 "La Royal Air Force"
 ENG_60s_The_Royal_Airforce_desc:0 "Ces dernières années, les forces aériennes sont devenues un élément essentiel des opérations militaires, et la RAF ne peut pas se permettre de rester à la traîne ; nous devons rattraper nos rivaux avant qu'ils ne nous distancent. "
 ENG_60s_Invest_in_VTOL:0 "Investir dans les appareils à décollage et atterrissage verticaux"
 ENG_60s_Invest_in_VTOL_desc:0 "Nous avons besoin de chasseurs plus modernes, capables de protéger nos forces depuis les airs ; nous devons investir dans les nouveaux chasseurs à décollage et atterrissage verticaux afin de rattraper nos adversaires potentiels et de faire de la RAF la meilleure force aérienne au monde."
 ENG_60s_Import_American_Phantoms:0 "Importer des American Phantoms"
 ENG_60s_Import_American_Phantoms_desc:0 "Même si nous n'aimons pas l'admettre, l'armée de l'air américaine est supérieure à la nôtre ; nous aurions tout intérêt à acheter certains de leurs appareils pour renforcer nos propres forces. Je suis sûr qu'ils en ont quelques-uns à nous céder, n'est-ce pas ?"
 ENG_60s_Harrier_Jump_Jets:0 "Avions à réaction Harrier"
 ENG_60s_Harrier_Jump_Jets_desc:0 "Nous devons continuer à investir dans notre armée de l'air ; si les chasseurs à décollage et atterrissage verticaux constituaient un pas dans la bonne direction, nous ne pouvons pas en rester là : ces nouveaux avions de chasse vont considérablement renforcer nos capacités dans les combats aériens et autres opérations au sol."
 ENG_60s_The_Blackburn_Buccaneer:0 "Le Blackburn Buccaneer"
 ENG_60s_The_Blackburn_Buccaneer_desc:0 "Si nous disposons déjà d'avions de combat pour nos forces terrestres, nous avons besoin d'appareils spécialement conçus pour les opérations navales ; c'est pourquoi les nouveaux Buccaneer renforceront considérablement les capacités de notre marine."
 ENG_60s_Publicize_Welfare_Programs:0 "Faire connaître les programmes d'aide sociale"
 ENG_60s_Publicize_Welfare_Programs_desc:0 "Nous avons augmenté les dépenses consacrées à l'aide sociale, mais nous devons veiller à ce que les gens sachent ce dont ils peuvent bénéficier. Nous devons donc investir dans une campagne visant à mettre en avant les programmes d'aide sociale et leurs avantages, tout en renforçant notre image auprès du public."
 ENG_60s_Ensure_Dockworker_Job_Security:0 "Garantir la sécurité de l'emploi des dockers"
 ENG_60s_Ensure_Dockworker_Job_Security_desc:0 "Personne ne devrait avoir à vivre sous la menace de la précarité de l'emploi, et le fait de passer plus de temps à s'inquiéter qu'à travailler nuit à la productivité. C'est pourquoi nous devons veiller à ce que les dockers aient l'assurance que leur emploi est sûr, ce qui les incitera davantage à voter pour le Parti travailliste et les rendra plus productifs."
 ENG_60s_Establish_Open_Universities:0 "Créer des universités ouvertes"
 ENG_60s_Establish_Open_Universities_desc:0 "L'université coûte trop cher, et la plupart des gens n'ont pas les moyens de se la payer. C'est pourquoi nous devons la rendre gratuite pour le grand public. Non seulement cela nous rendra plus populaires, mais cela améliorera le niveau d'éducation général de la majorité de la population, et lorsque les gens sont mieux éduqués, tous les secteurs de l'économie prospèrent."
 ENG_60s_Increase_Early_Childhood_Education:0 "Renforcer l'éducation de la petite enfance"
 ENG_60s_Increase_Early_Childhood_Education_desc:0 "Il faut commencer à former les enfants dès leur plus jeune âge afin de leur laisser davantage de temps pour acquérir des compétences essentielles et devenir plus compétents ; grâce à une main-d'œuvre mieux formée, la productivité dans les emplois de bureau augmentera et l'économie en tirera certainement profit."
 ENG_60s_Reduce_the_Voting_Age_to_18:0 "Abaisser l'âge du droit de vote à 18 ans"
 ENG_60s_Reduce_the_Voting_Age_to_18_desc:0 "Ce n'est un secret pour personne que les jeunes sont plus progressistes et donc plus enclins à voter pour le Parti travailliste ; ainsi, en abaissant l'âge du droit de vote, nous pouvons nous assurer d'obtenir davantage de voix et limiter l'influence des générations plus âgées."
 ENG_60s_Increase_Infrastructure_Spending:0 "Augmenter les dépenses d'infrastructure"
 ENG_60s_Increase_Infrastructure_Spending_desc:0 "À mesure que notre pays continue de se développer, nos infrastructures doivent elles aussi évoluer pour pouvoir répondre aux besoins de la population et de l'économie. Pour renforcer nos infrastructures, nous devons investir dans de meilleures méthodes de construction, sous peine de voir notre économie s'essouffler."
 ENG_60s_Increase_Womens_Rights:0 "Renforcer les droits des femmes"
 ENG_60s_Increase_Womens_Rights_desc:0 "Bien qu'elles aient obtenu le droit de vote dès le début du XXe siècle, les femmes sont encore considérées comme inférieures ; c'est à nous qu'il revient de changer cela. Ensemble, nous devons nous efforcer de promouvoir l'image de la femme comme l'égale de l'homme ; après tout, la population féminine compte de nombreux esprits brillants et travailleurs qu'il serait insensé d'ignorer."
 ENG_60s_Expand_English_New_Towns:0 "Développer les villes nouvelles en Angleterre"
 ENG_60s_Expand_English_New_Towns_desc:0 "À mesure que la population augmente, le besoin de loger tout le monde s'accroît également, mais on ne peut pas non plus s'attendre à ce que les gens vivent dans la misère. C'est pourquoi nous devons lancer une campagne visant à développer les villes nouvelles anglaises, des villes nouvelles pour de nouveaux habitants."
 ENG_60s_Enviromental_Regulations:0 "Réglementation environnementale"
 ENG_60s_Enviromental_Regulations_desc:0 "Nous vivons sur cette planète et, à notre connaissance, il n'existe aucune autre planète propice à la vie. C'est pourquoi nous devons protéger la Terre et nous efforcer de mettre un terme à la pollution. Espérons que ces nouvelles réglementations constituent un pas dans la bonne direction."
 ENG_60s_The_Britain_We_Want:0 "La Grande-Bretagne que nous voulons"
 ENG_60s_The_Britain_We_Want_desc:0 "Cela nous a demandé plusieurs mois de travail acharné, mais nous avons réussi à bâtir une Grande-Bretagne plus libérale, une Grande-Bretagne meilleure où les gens peuvent être plus heureux, où la qualité de vie s'améliore et où une société plus égalitaire voit le jour. L'avenir s'annonce radieux pour la Grande-Bretagne et les Britanniques."
 ENG_60s_Begin_Negotiations_with_the_EEC:0 "Entamer les négociations avec la CEE"
 ENG_60s_Begin_Negotiations_with_the_EEC_desc:0 "Si nous voulons relancer l'économie, nous devons coopérer avec nos voisins européens, et non nous opposer à eux. Nous devons entamer sans tarder des négociations avec la CEE afin de renforcer notre coopération et d'instaurer de meilleures relations de travail, dans lesquelles chacun, mais surtout nous, puisse prospérer."
 ENG_60s_Campaign_Against_Euroskepticism:0 "Campagne contre l'euroscepticisme"
 ENG_60s_Campaign_Against_Euroskepticism_desc:0 "Au cours des années précédentes, nous avons plaidé en faveur d'un resserrement des liens avec les pays européens ; cependant, ces maudits eurosceptiques sapent notre programme. Nous devons intensifier notre campagne pour encourager les europhiles et faire en sorte que la collaboration avec l'Europe apparaisse comme une perspective plus prometteuse."
 ENG_60s_Combat_Unemployment:0 "Lutter contre le chômage"
 ENG_60s_Combat_Unemployment_desc:0 "Le chômage est le cauchemar de tout gouvernement, mais la situation ne cesse de s'aggraver ; nous devons prendre des mesures pour le combattre dès maintenant, avant qu'il ne soit trop tard ! Sinon, nous risquons de prendre du retard sur le plan économique, ce qui, en soi, mènera au désastre."
 ENG_60s_Distance_Relations_From_America:0 "Relations à distance depuis les États-Unis"
 ENG_60s_Distance_Relations_From_America_desc:0 "Même si la Grande-Bretagne et les Américains sont de bons amis depuis la Seconde Guerre mondiale, il est désormais évident qu’ils ne cherchent qu’à nous utiliser comme des marionnettes. Nous devons prendre nos distances avec eux pour préserver notre indépendance, sous peine de devenir les esclaves des États-Unis."
 ENG_60s_Strengthen_Relations_with_the_PRC:0 "Renforcer les relations avec la République populaire de Chine"
 ENG_60s_Strengthen_Relations_with_the_PRC_desc:0 "Tu sais, peut-être que la Chine n'est pas si mal après tout. Maintenant qu'on compte prendre nos distances avec les Américains, on doit trouver des alliés, et quoi de mieux que la Chine ? À condition, bien sûr, qu'ils parviennent à tourner la page sur toute cette histoire de guerre de l'Opium."
 ENG_60s_The_Local_Government_Act:0 "La loi sur les collectivités locales"
 ENG_60s_The_Local_Government_Act_desc:0 "Pour mettre en place un système de gouvernement plus efficace et faire en sorte que les citoyens se sentent moins opprimés, nous devons renforcer les pouvoirs des collectivités locales ; après tout, celles-ci sont mieux à même de gérer efficacement les territoires locaux plutôt que de vouloir tout contrôler dans les moindres détails, et cela donne aux citoyens un certain sentiment de contrôle."
 ENG_60s_Combat_Rising_Prices:0 "Lutter contre la hausse des prix"
 ENG_60s_Combat_Rising_Prices_desc:0 "À mesure que les prix augmentent, les gens n'ont plus les moyens d'acheter les produits de première nécessité ; nous devons agir rapidement pour maîtriser ces prix avant qu'ils ne s'emballent et que nous ne soyons confrontés à une hyperinflation."
 ENG_60s_Utilize_British_Technical_Skills:0 "Mettre à profit les compétences techniques britanniques"
 ENG_60s_Utilize_British_Technical_Skills_desc:0 "Les Britanniques ont des compétences techniques, et pourtant nous n'exploitons pas pleinement – je veux dire, nous ne tirons pas pleinement parti de ce segment de la main-d'œuvre ; avec un petit investissement, nous pourrions facilement tirer parti de cette niche du marché. "
 ENG_60s_Reform_the_Unions:0 "Réformer les syndicats"
 ENG_60s_Reform_the_Unions_desc:0 "Les syndicats posent problème, mais si nous parvenions à les réformer, nous pourrions améliorer l'efficacité de notre main-d'œuvre et, par conséquent, stimuler l'économie, transformant ainsi un obstacle en atout. "
 ENG_60s_Increase_European_Cooperation:0 "Renforcer la coopération européenne"
 ENG_60s_Increase_European_Cooperation_desc:0 "Nous ne pouvons pas nous isoler en tant que nation ; nous devons collaborer avec nos partenaires européens, et non nous opposer à eux ; nous devons améliorer nos relations avec eux afin de pouvoir négocier plus facilement des accords commerciaux et des accords de défense mutuelle, car si nous nous isolons, nous nous exposons à une attaque communiste."
 ENG_60s_Reuce_Government_Waste:0 "Réduire le gaspillage dans l'administration"
 ENG_60s_Reuce_Government_Waste_desc:0 "Notre volonté de réduire les dépenses publiques se poursuit ; en tant que gouvernement, nous gaspillons trop d'argent et nous devons y remédier si nous voulons augmenter le budget et résoudre les problèmes économiques de la Grande-Bretagne. Cela nous permettra également de redorer notre image en tant que gouvernement. "
 ENG_60s_Reduce_Immigration_Rates:0 "Réduire les taux d'immigration"
 ENG_60s_Reduce_Immigration_Rates_desc:0 "Nous ne pouvons pas laisser les étrangers prendre les emplois des Britanniques ! Si nous voulons que notre économie se redresse, il faut que les Britanniques travaillent dans l'industrie britannique ; nous devons immédiatement mettre un terme à l'afflux d'immigrants avant qu'il ne soit trop tard."
