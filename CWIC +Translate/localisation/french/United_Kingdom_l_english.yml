 ENG_Election_of_1951_desc:0 ""
 ENG_Atlee_Ministry:0 "Gouvernement Atlee"
 ENG_Atlee_Ministry_desc:0 ""
 ENG_Housing_Expansion:0 "Développement du logement"
 ENG_Housing_Expansion_desc:0 ""
 ENG_Aid_Underdeveloped_Commonwealth_Members:0 "Aide aux États membres du Commonwealth en développement"
 ENG_Aid_Underdeveloped_Commonwealth_Members_desc:0 ""
 ENG_Full_Employment:0 "Plein emploi"
 ENG_Full_Employment_desc:0 ""
 ENG_Agricultural_Subsidies:0 "Subventions agricoles"
 ENG_Agricultural_Subsidies_desc:0 ""
 ENG_Raise_Workers_Wages:0 "Augmenter les salaires des travailleurs"
 ENG_Raise_Workers_Wages_desc:0 ""
 ENG_Development_Councils:0 "Conseils de développement"
 ENG_Development_Councils_desc:0 ""
 ENG_Crackdown_on_Monopolies:0 "Lutte contre les monopoles"
 ENG_Crackdown_on_Monopolies_desc:0 ""
 ENG_Electric_Infrastructure_Development:0 "Développement des infrastructures électriques"
