 ENG_60s_Resist_Nigerian_independence_movements:0 "S'opposer à l'indépendance du Nigeria"
 ENG_60s_Resist_Nigerian_independence_movements_desc:0 "Même si nous sommes sans aucun doute en train de nous effondrer, nous pouvons encore tenter de nous opposer à l'indépendance de ces nations."
