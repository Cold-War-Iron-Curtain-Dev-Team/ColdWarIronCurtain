 eng.1.t:0 "L'unification de l'Autriche"
 eng.1.d:0 "Le peuple autrichien souhaite redevenir un pays libre et indépendant. Il pourrait servir d'État tampon entre l'Est et l'Ouest. Allons-nous l'accepter ?"
 eng.1.a:0 "Oui, bien sûr"
 eng.1.b:0 "Non, nous devons adopter une approche différente pour nos territoires autrichiens."
 eng.2.t:0 "Remplacer la République de Chine par la République populaire de Chine"
 eng.2.d:0 "La République populaire de Chine souhaite être reconnue comme le seul gouvernement chinois au sein de l'ONU. D'un côté, la RPC contrôle le continent et la plupart des questions chinoises importantes, mais d'un autre côté, faut-il laisser les communistes occuper un siège supplémentaire au Conseil de sécurité de l'ONU ?"
 eng.2.a:0 "Voter pour que la République populaire de Chine occupe les sièges de la République de Chine."
 eng.2.b:0 "Non, les communistes n'ont pas leur place ici."
 eng.3.t:0 "Création du NHS"
 eng.3.d:0 "Le NHS est créé. Ce nouveau système de santé universel repose sur trois principes : répondre aux besoins de chacun, être gratuit au moment de la prestation et se fonder sur les besoins cliniques et non sur la capacité de payer."
 eng.3.a:0 "C'est un jour mémorable pour la Grande-Bretagne !"
 eng.4.t:0 "Les socialistes assassinent la famille royale !"
 eng.4.d:0 "Hier soir, un groupe d'extrémistes socialistes a fait irruption au palais de Buckingham et a assassiné les membres de la famille royale qui s'y trouvaient à ce moment-là. Selon certaines rumeurs, les membres restants de la famille royale auraient été évacués vers le Canada jusqu'à ce que les troubles s'apaisent."
 eng.4.a:0 "Ils feraient mieux de filer."
 eng.5.t:0 "L'Ouganda réclame son indépendance"
 eng.5.d:0 "L'Ouganda souhaite obtenir son indépendance. C'est l'une de nos principales colonies, mais elle est enclavée et éloignée de notre capitale."
 eng.5.a:0 "Oui !"
 eng.5.b:0 "Non, ils ont toujours besoin de notre protection."
 eng.6.t:0 "Le Nigeria réclame son indépendance"
 eng.6.d:0 "Le Nigeria souhaite se libérer de notre domination. Ce pays produit beaucoup de pétrole et de caoutchouc, mais nos entreprises sont prêtes à négocier avec un éventuel État nigérian indépendant. Devrions-nous les laisser partir ?"
 eng.6.a:0 "Oui !"
 eng.6.b:0 "Non, ils ont toujours besoin de notre protection."
 eng.7.t:0 "Le Kenya réclame son indépendance"
 eng.7.d:0 "Le Kenya souhaite se libérer de nos politiques coloniales désastreuses qui ont conduit à des événements tels que l'état d'urgence au Kenya. Situé sur la côte ouest-africaine, ce pays constitue une artère majeure vers l'Inde. Devrions-nous accorder l'indépendance à cette région rebelle ?"
 eng.7.a:0 "Oui !"
 eng.7.b:0 "Non, ils ont toujours besoin de notre protection."
 eng.8.t:0 "Le Soudan réclame son indépendance"
 eng.8.d:0 "Le Soudan souhaite se libérer de notre domination. Bien qu'il s'agisse d'un condominium anglo-égyptien, c'est nous qui, dans les faits, gouvernons le Soudan. Devrions-nous lui accorder l'indépendance de manière unilatérale ?"
 eng.8.a:0 "Oui !"
 eng.8.b:0 "Non, leur statut vis-à-vis de l'Égypte reste à déterminer."
 eng.1000.d:0 "La reine Élisabeth II est devenue le 39e monarque britannique et la 6e reine à être couronnée à l'abbaye de Westminster. La cérémonie de couronnement, qui a duré trois heures et a débuté à 11 h 15, a été la première à être retransmise par la BBC. 129 pays étaient représentés lors de ce couronnement. Plus de 27 millions de Britanniques ont regardé la cérémonie à la télévision et plus de 2 000 journalistes se trouvaient à l'extérieur du lieu de la cérémonie. La cérémonie pouvait être considérée comme un symbole de l'unité du Commonwealth britannique : une famille avait fait le voyage depuis l'Australie pour assister au couronnement. Cependant, la reconstruction de la Grande-Bretagne n'était pas encore achevée : de nombreux téléspectateurs devaient encore se contenter de rations."
 UKRadar.1.d:0 "La RAF Saxa Vord, également connue sous le nom de Remote Radar Head Saxa Vord, est une nouvelle station radar située sur l'île d'Unst, la plus septentrionale des îles Shetland. Créée initialement en 1945 pour faire partie intégrante de la défense aérienne britannique, la RRH Saxa Vord continue de jouer un rôle important dans le réseau de défense aérienne britannique, ayant été intégrée au système ROTOR et équipée d'un radar AMES Type 80 en 1955. L'unité de transmissions n° 91 a été officiellement stationnée à la RRH Saxa Vord en 1957, et Sa Majesté la reine Elizabeth II a visité le site en 1960. Tout le personnel applique en permanence la devise latine « Praemoneo de periculus », qui signifie « Je préviens du danger », ce qui s'applique parfaitement à cette installation unique."
 eng.9.t:0 "Accord de Londres sur la dette"
 eng.9.d:0 "Les Alliés occidentaux nous ont invités à discuter d'une restructuration de notre dette envers eux, dans le but de régulariser les dettes de l'Allemagne datant d'avant et d'après la guerre. Les principaux éléments du consensus atteint jusqu'à présent sont une réduction de la dette de 16 milliards de marks, un allongement des délais de remboursement et la prise en compte de divers types de dettes, allant des réparations de la Première Guerre mondiale aux fonds de reconstruction d'après-guerre tels que le plan Marshall."
 eng.9.a:0 "Cela semble raisonnable. Nous signerons le traité."
 eng.10.t:0 "Conférence sur la dette à Londres"
 eng.10.d:0 "Aujourd'hui, des représentants de l'Allemagne de l'Ouest et de ses créanciers se sont réunis à Londres pour signer un accord sur la dette, qui apporte une solution décisive au problème des dettes en suspens de l'Allemagne et ouvre la voie à sa réintégration économique et politique au sein de la communauté internationale. Ce traité allège considérablement le fardeau de la dette allemande, réduisant de moitié ses obligations, qui passent de 16 milliards de marks allemands à environ 7,5 milliards de marks allemands. Le solde de la dette sera remboursé à des conditions très favorables, notamment grâce à des échéanciers de remboursement étalés sur une période pouvant aller jusqu’à 30 ans et à des taux d’intérêt bas. Il est important de noter que les conditions de remboursement sont liées aux performances de l’économie allemande, ce qui garantit que les remboursements n’entraveront pas sa reprise en cours."
 eng.10.a:0 "Une étape importante vers la reconstruction de l'Allemagne."
 CWelect.1.t:0 "Élections législatives de 1950"
 CWelect.1.d:0 "Les élections de 1945, qui ont coïncidé avec la chute du Reich européen d'Hitler, ont établi de nombreux précédents. Le Parti travailliste a remporté une large majorité face aux conservateurs alignés sur Churchill, tandis que le Parti libéral a été relégué au rang de simple troisième force politique, une situation qui perdure encore aujourd’hui. Mais c’était en 1945 ; nous sommes désormais en 1950 et les partis ont changé. Le Parti travailliste a nationalisé des industries clés et créé le NHS, tandis que les conservateurs sont toujours dirigés par Winston Churchill. Les bulletins de vote sont dépouillés et..."
 CWelect.1.a:0 "Clement Attlee s'en est bien sorti jusqu'à présent. Laissons-le nous mener plus loin."
 CWelect.1.b:0 "Aneurin Bevan est le prochain chef du Parti travailliste"
 CWelect.2.t:0 "Élections législatives anticipées de 1951"
 CWelect.2.d:0 "À la demande du roi, Attlee a convoqué des élections anticipées afin de consolider le gouvernement travailliste, qui ne dispose actuellement que d'une majorité fragile. Cette initiative produira-t-elle les effets escomptés par Attlee et lui permettra-t-elle d'obtenir une majorité écrasante, ou bien se retournera-t-elle complètement contre lui ?"
 CWelect.2.a:0 "Le gouvernement travailliste est solide !"
 CWelect.2.b:0 "Churchill et les conservateurs !"
 CWelect.3.t:0 "Élections de 1955 : Anthony Eden contre Clement Attlee"
 CWelect.3.d:0 "Après un intervalle de quatre ans entre les élections, la Grande-Bretagne retourne aux urnes à peine quelques semaines après la démission de Churchill. Eden parviendra-t-il à remporter les élections ? Ou Clement l'emportera-t-il ?"
 CWelect.3.a:0 "Anthony Eden est charmant, et il nous protégera du communisme !"
 CWelect.3.b:0 "Clement Attlee a l'expérience nécessaire."
 churchill:0 "Winston Churchill est depuis longtemps une figure emblématique de la politique britannique. Il s'est illustré pour la première fois pendant la Première Guerre mondiale, où il occupait le poste de Premier Lord de l'Amirauté. Après des années au Parlement et de nombreux postes au sein du gouvernement, il a été choisi en 1940 pour remplacer Neville Chamberlain au poste de Premier ministre, et son charisme ainsi que ses innombrables discours ont aidé le peuple britannique à traverser la guerre et toutes les épreuves qu'elle a entraînées. La carrière de Winston Churchill est bien plus marquée par la Seconde Guerre mondiale que par toute autre chose, et c'est peut-être une bonne chose."
 anthony_eden:0 "Anthony Eden a été ministre de la Guerre pendant le premier mandat de Churchill, puis vice-président du Parti conservateur lorsque Churchill était chef de l'opposition et pendant la période de paix qui a suivi la fin de la guerre. C'est un poids lourd."
 Anthony_Eden_flag:0 "Anthony Eden est au pouvoir"
 CWelect.4.t:0 "Démission d'Anthony Eden"
 CWelect.4.d:0 "Anthony Eden a exercé ses fonctions de Premier ministre avec satisfaction. Cependant, ses échecs lors de la crise de Suez l'ont conduit à démissionner de son poste de Premier ministre. Eisenhower a fait l'éloge de MacMillan, ce qui a incité la reine à nommer ce dernier Premier ministre."
 CWelect.4.a:0 "Tous les regards se tournent vers l'avenir des conservateurs, désormais entre les mains d'Harold Macmillan."
 Harold_Macmillian:0 "Harold « Supermac » Macmillan est un conservateur britannique. Harold Macmillan a connu ses premiers succès après l'effondrement du Parti libéral en 1924, qui a libéré sa circonscription, Stockton-on-Tees, pour les élections. Par le passé, Macmillan s'était rendu à plusieurs reprises en URSS, où il critiquait souvent le gouvernement. En février 1940, MacMillan s'est rendu en Finlande. À son retour, il a mené une campagne contre l'inaction du gouvernement britannique face à l'agression soviétique. Lorsque Churchill est arrivé au pouvoir en 1940, « Supermac » est devenu ministre de l'Approvisionnement. Il a occupé les fonctions de ministre du Logement, de ministre de la Défense, de ministre des Affaires étrangères et de chancelier de l'Échiquier. Il est désormais arrivé au pouvoir à la suite de la démission d'Eden."
 ENG_Lab:0 "Parti travailliste"
 ENG_Cons:0 "Le Parti conservateur et unioniste"
 Hugh_Gaitskell:0 "Hugh Todd Naylor Gaistkell, professeur d'économie et ancien fonctionnaire de guerre, a été élu pour la première fois au Parlement en 1945, lors de la victoire écrasante du Parti travailliste sous la direction de Clement Attlee. Il a occupé le poste de ministre du Combustible et de l'Énergie de 1946 à 1947, puis a rejoint le cabinet d'Attlee en tant que ministre des Finances."
 CWelect.5.t:0 "Élections de 1959 : Harold Macmillan contre Hugh Gaitskell"
 CWelect.5.d:0 "Les élections de 1959 sont arrivées. Harold Macmillan, qui a succédé à Anthony Eden à la tête du Parti conservateur, est désormais confronté à Hugh Gaitskell, du Parti travailliste."
 CWelect.5.a:0 "Harold Macmillan fera l'affaire. On ne veut pas du socialisme, n'est-ce pas ?"
 CWelect.5.b:0 "Le Parti travailliste a besoin d'une nouvelle chance, les conservateurs manquent de détermination."
 CWelect.6.t:0 "La démission d'Harold Macmillan"
 CWelect.6.d:0 "Harold Macmillan a subi des pressions de la part des conservateurs et de la plupart des membres du gouvernement pour qu'il démissionne plutôt que de se présenter aux prochaines élections. Sous le poids de ces pressions, Harold a démissionné de son poste de Premier ministre."
 CWelect.6.a:0 "Le flambeau conservateur passe à Alec Douglas-Home."
 CWelect.7.t:0 "Hugh Gaistkell est décédé !"
 CWelect.7.d:0 "Hugh Gaistkell est décédé prématurément. Il est mort chez lui des suites d'un virus qu'il avait contracté lors de son dernier voyage chez Nikita Khrouchtchev."
 CWelect.7.a:0 "Le flambeau passe à Harold Wilson."
 CWelect.8.t:0 "Les élections de 1964 : Harold Wilson contre Alec Douglas-Home"
 CWelect.8.d:0 "Les trois principaux partis ayant changé de dirigeant à la suite de deux démissions et d'un décès tragique, le peuple britannique se retrouve face à trois nouveaux visages : Harold Wilson pour le Parti travailliste, Alec Douglas-Home pour les conservateurs et Jo Grimond pour les libéraux. Grimond reste pour l'instant en retrait, mais il pourrait bien diviser le vote centriste au profit de l'un des autres partis..."
 CWelect.8.a:0 "C'est l'heure du Parti travailliste ! Harold Wilson"
 CWelect.8.b:0 "Les conservateurs vont nous protéger ! Alec Douglas-Home !"
 Alec_Douglas-Home:0 "Élu député à la Chambre des communes en tant que baron de Hirsel, Alec a pris la relève après la démission d'Harold Macmillan. Il a autrefois été l'assistant du Premier ministre Chamberlain. Alec semble beaucoup plus autoritaire que ses concurrents, et cela pourrait bien causer sa perte..."
 Harold_Wilson:0 "Harold Wilson a longtemps siégé au gouvernement. Dès son élection à la Chambre des communes, il a été nommé au cabinet et au conseil de l'opposition de M. Attlee, et il vient d'être élu à la tête du Parti travailliste. Depuis la mort de Hugh Gaitskell, il s'efforce de réorienter le Parti travailliste vers un socialisme modéré."
 elect.9.t:0 "Élections de 1966 : Harold Wilson contre Edward Heath"
 elect.9.d:0 "Le très honorable Premier ministre a convoqué des élections anticipées, et tandis que le dépouillement des bulletins de vote bat son plein, tous les Britanniques se demandent si un nouveau Premier ministre va voir le jour. Le vieux Sir Alec Douglas-Home a cédé son poste à Edward Heath. Pendant ce temps, M. Wilson fait campagne pour le Parti travailliste et Jo Grimond divise une nouvelle fois l'électorat. Qui l'emportera ?"
 elect.9.a:0 "Le socialisme modéré, c'est ce qu'il y a de mieux ! Harold Wilson !"
 elect.9.b:0 "Mais n'est-il pas préférable de ne pas avoir de socialisme ? Edward Heath !"
 Edward_Heath:0 "Edward « Ted » Heath est un fervent défenseur de l'Espace économique européen et des communautés minières, ainsi que d'un rapprochement avec l'Europe, ce qui est un peu surprenant pour un conservateur, mais il n'en reste pas moins un homme politique de premier plan."
 elect.10.t:0 "Élections de 1970 : Harold Wilson contre Edward Heath"
 elect.10.d:0 "Les candidats des deux grands partis n'ont pas changé, mais cette fois-ci, le scrutin ne sera pas une simple formalité et reflétera sans aucun doute la volonté du peuple britannique. Nous nous trouvons une nouvelle fois à la croisée des chemins : Heath ou Wilson ?"
 elect.10.a:0 "Harold remporte une nouvelle victoire. Vive le Parti travailliste !"
 elect.10.b:0 "Une victoire inattendue pour M. Heath ! Les conservateurs !"
 elect.11.t:0 "Élections de 1974 : le chaos d'un Parlement sans majorité"
 elect.11.d:0 "Des élections ont déjà eu lieu cette année, mais elles se sont soldées par une victoire minoritaire d'Harold Wilson. Afin de déterminer ce que souhaite réellement la Grande-Bretagne, les partis se sont mis d'accord pour organiser de nouvelles élections en octobre. Le moment est venu : Wilson ou Heath ?"
 elect.11.a:0 "Harold Wilson forme un gouvernement. Parti travailliste."
 elect.11.b:0 "Edward Heath forme un gouvernement. Les conservateurs."
 elect.12.t:0 "Harold Wilson démissionne"
 elect.12.d:0 "Harold Wilson a annoncé aujourd'hui qu'il prenait sa retraite. Après une si longue carrière politique, le public britannique ne sait pas qui pourrait lui succéder. Les franges les plus à gauche du Parti travailliste réclament des réformes."
 elect.12.a:0 "James Callaghan remplacera Wilson."
 James_Callaghan:0 "James Callaghan, également connu sous le nom de Jim Callaghan, a désormais occupé les quatre plus hautes fonctions de l'État, de celle de ministre des Finances à celle de Premier ministre."
 elect.13.t:0 "L'ascension de Thatcher"
 elect.13.d:0 "Les conservateurs ont estimé que M. Heath n'était pas en mesure de diriger le parti ni la nation. Ils ont donc décidé de le remplacer par Margret Thatcher, députée de Finchley."
 elect.13.a:0 "Margaret Thatcher guidera notre nation et nos peuples."
 Margret_Thatcher:0 "Margaret Thatcher, surnommée la « Dame de fer », est la première femme à occuper le poste de Premier ministre britannique. Elle a ravi la direction du Parti conservateur à M. Heath et dirige désormais la Grande-Bretagne."
 elect.14.t:0 "Élections de 1979 : Thatcher contre Callaghan"
 elect.14.d:0 "Margaret Thatcher a pris la tête du Parti conservateur au début de l'année 1975, en raison de l'incapacité de Heath à diriger efficacement et à rallier les électeurs à sa cause. Ayant accédé au pouvoir avec peu de capital politique, Thatcher a utilisé tous les moyens possibles pour faire échouer le Parti travailliste, et cela semble avoir porté ses fruits. Des élections anticipées ont été fixées cinq mois avant les élections prévues, et Mme Thatcher pourrait bien l'emporter."
 elect.14.a:0 "Margaret Thatcher est une femme forte, et sous sa direction, la Grande-Bretagne sera forte."
 elect.14.b:0 "Le Parlement est un club réservé aux hommes. Callaghan."
 elect.15.t:0 "Élections de 1983 : Thatcher contre Foot"
 elect.15.d:0 "Les élections de 1983 s'annoncent comme une victoire écrasante pour les conservateurs ; depuis la guerre des Malouines, la popularité de Thatcher n'a jamais été aussi forte et, pire encore pour les travaillistes, les libéraux gagnent du terrain sur eux."
 elect.15.a:0 "Thatcher a défendu les Malouines, et aujourd'hui, elle défend la Grande-Bretagne"
 elect.15.b:0 "Michael Foot forme un gouvernement de coalition avec les libéraux."
 Micheal_Foot:0 "Michael Foot, désormais Premier ministre, évolue dans les rangs du Parti travailliste depuis un certain temps déjà. Il semble toutefois qu'il ne tiendra pas longtemps, Thatcher ne cessant de semer le chaos au Parlement."
 elect.16.t:0 "Élections de 1987 : Thatcher contre Kinnock"
 elect.16.d:0 "Michael Foot a décidé de ne pas se présenter et, à sa place, le Parti travailliste a désigné Neil Kinnock, tandis que la popularité de Thatcher ne cesse de grimper. Il semble qu'elle pourrait bien remporter une nouvelle victoire, mais seuls les électeurs pourront en décider."
 elect.16.a:0 "La Dame de fer remporte une nouvelle victoire !"
 elect.16.b:0 "Kinnock remporte une majorité de justesse."
 elect.17.t:0 "Margaret Thatcher démissionne !"
 elect.17.d:0 "Thatcher a démissionné dans l'intérêt des conservateurs, estimant que son départ affaiblirait la campagne du Parti travailliste à venir. C'est du moins ce qu'elle a déclaré au parti. C'est désormais John Major qui dirige la Grande-Bretagne."
 elect.17.a:0 "Oui, John Major va former un gouvernement."
 Neil_Kinnock:0 "Neil Kinnock a fait ses débuts au Parlement en 1970. Il dirige aujourd’hui le Parti travailliste et la Grande-Bretagne. M. Kinnock a parcouru un long chemin depuis qu’il a pris la tête du Parti travailliste en 1983, malgré les tentatives visant à le mettre sur la touche."
 John_Major:0 "John Major a occupé les fonctions de ministre des Affaires étrangères et de ministre des Finances au sein du gouvernement Thatcher, avant de succéder à Mme Thatcher à la tête du pays et du parti."
 elect.18.t:0 "Élection de 1992 - Major contre Kinnock"
 elect.18.d:0 "Les perspectives des conservateurs pour cette campagne étaient sombres. Les travaillistes menaient de vingt points, jusqu'à ce que leur campagne commence, de manière inattendue, à s'essouffler. Les électeurs vont devoir se décider..."
 elect.18.a:0 "John Major et les conservateurs l'emportent !"
 elect.18.b:0 "Neil Kinnock avec le Parti travailliste !"
 elect.19.t:0 "Démission de Neil Kinnock - L'ascension de Blair"
 elect.19.d:0 "Neil Kinnock a décidé aujourd'hui de se retirer du Parlement et de la vie politique. Le flambeau du Parti travailliste passe désormais à Tony Blair, député de Sedgefield."
 elect.19.a:0 "Qui est ce Blair ?"
 Tony_Blair:0 "Anthony Charles Lynton Blair, ou Tony Blair, un centriste, a progressivement fait évoluer le Parti travailliste vers la droite. Il s'est illustré lors des élections en obtenant une large majorité pour son parti et fait désormais partie intégrante de la scène politique britannique contemporaine."
 elect.20.t:0 "Élections de 1997 - Blair contre Major"
 elect.20.d:0 "Ces élections sont très intéressantes : Blair a fait campagne sous la bannière du « New Labour », un courant centriste au sein de son parti, et a recueilli un large soutien grâce à cela, tandis que les conservateurs se sont déchirés sur la question de l'Union européenne et à cause d'innombrables scandales. 1997 s'annonce comme une victoire écrasante pour le Parti travailliste, mais peut-être, juste peut-être, que les conservateurs pourraient former une coalition minoritaire avec les libéraux-démocrates."
 elect.20.a:0 "John Major remporte une majorité de compromis."
 elect.20.b:0 "Tony Blair remporte une victoire écrasante !"
 ENG_battle_hull_medium_0:0 "Classe Vanguard"
 ENG_battle_hull_medium_1:0 "Rénovation de la classe Vanguard"
 ENG_battle_hull_medium_0_desc:0 "Le HMS Vanguard était un cuirassé rapide britannique construit pendant la Seconde Guerre mondiale et mis en service après la fin du conflit. Il s'agissait du plus grand et du plus rapide des cuirassés de la Royal Navy, du seul navire de sa classe et du dernier cuirassé à avoir été construit."
 ENG_battle_hull_medium_1_desc:0 "Et si le HMS Vanguard avait bénéficié d'une remise en état aussi importante et aussi complète que celle dont ont bénéficié les navires de la classe Iowa de la marine américaine ? Le HMS Vanguard a effectivement fait l'objet d'une brève remise en état en 1955 avant d'être vendu à la ferraille et démoli en 1960. Mais qu'en aurait-il été si cela n'avait pas été le cas ?"
 ENG_carrier_hull_0:0 "Classe Implacable"
 ENG_carrier_hull_1:0 "Classe Audacious"
 ENG_carrier_hull_2:0 "Modèle CVA-01"
 ENG_carrier_hull_3:0 "Rénovation de la classe Audacious"
 ENG_carrier_hull_4:0 "Classe Queen Elizabeth"
 ENG_carrier_hull_0_desc:0 "La classe Implacable comprenait deux porte-avions construits pour la Royal Navy pendant la Seconde Guerre mondiale. Dérivés de la conception de la classe Illustrious, ils étaient plus rapides et pouvaient embarquer davantage d'avions que les navires plus anciens. À leur achèvement en 1944, ils furent initialement affectés à la Flotte de la Maison et attaquèrent des cibles en Norvège ainsi que le cuirassé allemand Tirpitz. Par la suite, ils furent affectés à la Flotte britannique du Pacifique (BPF)."
 ENG_carrier_hull_1_desc:0 "Les porte-avions de la classe Audacious constituaient une classe de porte-avions proposée par le gouvernement britannique dans les années 1930-1940 et dont la construction s'est achevée après la Seconde Guerre mondiale. Les deux navires construits ont subi d'importantes modifications et ont suivi des parcours très différents au cours de leur carrière."
 ENG_carrier_hull_2_desc:0 "Le CVA-01 était un projet de porte-avions britannique, conçu dans les années 1960. Ce navire devait être le premier d'une classe destinée à remplacer tous les porte-avions de la Royal Navy alors en service, dont la plupart avaient été conçus avant ou pendant la Seconde Guerre mondiale."
 ENG_carrier_hull_3_desc:0 "Au fur et à mesure de leur construction, l'Audacious (rebaptisé Eagle) et l'Irresistible (rebaptisé Ark Royal) se sont tellement distingués l'un de l'autre qu'ils sont devenus, de fait, les navires de tête (et les seuls) de leurs classes respectives. Ils ont constitué l'épine dorsale de la flotte de porte-avions de l'après-guerre et ont fait l'objet de nombreuses modifications."
 ENG_carrier_hull_4_desc:0 "La classe Queen Elizabeth est une classe composée de deux porte-avions de la Royal Navy britannique, qui constituent les éléments centraux du groupe aéronaval britannique."
 ENG_carrier_hull_light_0:0 "Classe Colosse"
 ENG_carrier_hull_light_1:0 "Classe Centaure"
 ENG_carrier_hull_light_2:0 "Classe Invincible"
 ENG_carrier_hull_light_3:0 "Classe Océan"
 ENG_carrier_hull_light_4:0 "Rénovation de la classe Invincible"
 ENG_carrier_hull_light_0_desc:0 "Le porte-avions léger de type 1942, communément appelé « porte-avions léger britannique », était un modèle de porte-avions léger conçu par la Royal Navy pendant la Seconde Guerre mondiale et utilisé par huit marines entre 1944 et 2001. Ces navires ont été conçus et construits par des chantiers navals civils afin de constituer un compromis entre les porte-avions de flotte de grande taille, très coûteux, et les porte-avions d'escorte, moins onéreux mais aux capacités limitées."
 ENG_carrier_hull_light_1_desc:0 "La classe Centaur de porte-avions de la Royal Navy fut la dernière série de porte-avions légers mise en chantier dans les dernières années de la Seconde Guerre mondiale. Le premier des quatre navires initialement prévus fut mis en service en 1953 et le dernier fut désarmé en 1984. Les trois premiers navires n'étaient pas équipés d'un pont d'envol incliné et ne pouvaient donc pas accueillir d'avions à réaction rapides ; la construction d'une deuxième série de quatre porte-avions fut donc annulée."
 ENG_carrier_hull_light_2_desc:0 "La classe Invincible était une classe de porte-avions légers exploités par la Royal Navy. Ces navires ont été construits pour servir de plates-formes de lutte anti-sous-marine (ASW) aptes à accueillir des aéronefs, afin de contrer la menace que représentaient les sous-marins soviétiques dans l'Atlantique Nord pendant la Guerre froide ; ils embarquaient initialement des avions Sea Harrier et des hélicoptères anti-sous-marins Sea King HAS.1."
 ENG_carrier_hull_light_3_desc:0 "Le HMS Ocean était une plate-forme d'appontage pour hélicoptères, ancien porte-hélicoptères du Royaume-Uni et navire amiral de la Royal Navy. Il avait été conçu pour soutenir les opérations de débarquement amphibies et pour appuyer l'état-major du commandant de la Force amphibie britannique et du commandant de la Force de débarquement britannique."
 ENG_carrier_hull_light_4_desc:0 "Au milieu des années 2000, les navires de la classe Invincible ont fait l'objet d'une nouvelle remise en état au chantier naval de Rosyth. Ces travaux ont consisté en une reconstruction complète de la rampe d'envol, l'installation de systèmes de communication plus performants et une reconfiguration du navire afin de permettre un passage plus rapide du rôle de porte-avions léger à celui de porte-hélicoptères."
 ENG_sub_hull_small_single_0:0 "Classe Amphion"
 ENG_sub_hull_small_single_0_desc:0 "La classe Amphion (également connue sous le nom de classe « A » et de classe Acheron), qui regroupe des sous-marins diesel-électriques britanniques, a été conçue pour la guerre du Pacifique. Seuls deux exemplaires furent achevés avant la fin des hostilités, mais après avoir été modernisés dans les années 1950, ils continuèrent à servir dans la Royal Navy jusque dans les années 1970."
 ENG_sub_hull_small_single_1:0 "Classe Porpoise"
 ENG_sub_hull_small_single_1_desc:0 "La classe Porpoise était une classe de huit sous-marins diesel-électriques exploités par la Royal Navy. À l'origine, ces navires étaient classés comme sous-marins de patrouille, puis comme sous-marins d'attaque. Il s'agissait des premiers sous-marins conventionnels britanniques construits après la fin de la Seconde Guerre mondiale. Leur conception s'inspirait, à bien des égards, des sous-marins allemands de type XXI de la Seconde Guerre mondiale."
 ENG_sub_hull_small_single_2:0 "Classe Oberon"
 ENG_sub_hull_small_single_2_desc:0 "La classe Oberon était une classe de 27 sous-marins de conception britannique exploités par cinq pays différents. Conçus comme la suite directe de la classe Porpoise, ils présentaient les mêmes dimensions, mais leur coque était construite avec des matériaux plus résistants et ils étaient équipés de matériel modernisé."
 ENG_sub_hull_small_single_3:0 "Classe Upholder"
 ENG_sub_hull_small_single_3_desc:0 "Les sous-marins de la classe Upholder/Victoria, également connus sous le nom de Type 2400 (en raison de leur déplacement de 2 400 tonnes), constituent une classe de sous-marins diesel-électriques construits au Royaume-Uni dans les années 1980 afin de compléter la flotte de sous-marins nucléaires en service au sein de la Flotte sous-marine de la Marine royale britannique."
 ENG_sub_hull_small_single_4:0 "Classe Victoria"
 ENG_sub_hull_small_single_4_desc:0 "Les sous-marins de la classe Upholder/Victoria, également connus sous le nom de Type 2400 (en raison de leur déplacement de 2 400 tonnes), constituent une classe de sous-marins diesel-électriques construits au Royaume-Uni dans les années 1980 afin de compléter la flotte de sous-marins nucléaires en service au sein de la Flotte sous-marine de la Marine royale britannique."
 ENG_sub_hull_large_single_0:0 "Classe Explorer"
 ENG_sub_hull_large_single_0_desc:0 "Les deux sous-marins de la classe Explorer étaient des navires expérimentaux construits pour la Royal Navy afin de tester un système de propulsion reposant sur l'utilisation de peroxyde d'hydrogène hautement concentré (HTP) et de carburant diesel, dans le but d'atteindre une grande autonomie et des vitesses élevées en plongée."
 ENG_sub_hull_large_single_1:0 "Classe Valiant"
 ENG_sub_hull_large_single_1_desc:0 "La classe Valiant était une classe de sous-marins nucléaires de flotte en service au sein de la Royal Navy du milieu des années 1960 jusqu'en 1994. Il s'agissait des premiers sous-marins nucléaires de flotte entièrement britanniques ; le HMS Dreadnought, qui les avait précédés, était équipé d'un réacteur nucléaire américain."
 ENG_sub_hull_large_single_2:0 "Classe Churchill"
 ENG_sub_hull_large_single_2_desc:0 "Les trois sous-marins de la classe Repeat Valiant, parfois appelés classe Churchill, étaient des sous-marins de flotte à propulsion nucléaire qui ont servi dans la Royal Navy des années 1970 jusqu'au début des années 1990. La classe Churchill s'inspirait de l'ancienne classe Valiant, mais comportait de nombreuses améliorations internes."
 ENG_sub_hull_large_single_3:0 "Classe Trafalgar"
 ENG_sub_hull_large_single_3_desc:0 "La classe Trafalgar est une classe de sous-marins nucléaires d'attaque (SSN) en service au sein de la Royal Navy, qui succède à la classe Swiftsure. À l'instar de la plupart des sous-marins nucléaires de la Royal Navy, les sept unités ont toutes été construites au chantier naval de Barrow-in-Furness, dans le comté de Cumbria."
 ENG_sub_hull_large_single_4:0 "Classe Astute"
 ENG_sub_hull_large_single_4_desc:0 "La classe Astute est la dernière génération de sous-marins nucléaires d'attaque (SSN) en service au sein de la Royal Navy."
 ENG_sub_hull_large_double_0:0 "Classe Dreadnought"
 ENG_sub_hull_large_double_0_desc:0 "Le septième HMS Dreadnought fut le premier sous-marin à propulsion nucléaire du Royaume-Uni, construit par Vickers Armstrongs à Barrow-in-Furness. Mis à l'eau par la reine Élisabeth II lors de la journée de Trafalgar en 1960 et mis en service au sein de la Royal Navy en avril 1963, il resta en service jusqu'en 1980."
 ENG_sub_hull_large_double_1:0 "Classe Resolution"
 ENG_sub_hull_large_double_1_desc:0 "La classe Resolution était une classe de quatre sous-marins nucléaires lanceurs d'engins (SNLE) construits pour la Royal Navy dans le cadre du programme britannique Polaris. Chaque sous-marin était armé de jusqu'à 16 missiles nucléaires UGM-27 Polaris A-3."
 ENG_sub_hull_large_double_2:0 "Rénovation de la classe Resolution"
 ENG_sub_hull_large_double_2_desc:0 "La classe Resolution était une classe de quatre sous-marins nucléaires lanceurs d'engins (SNLE) construits pour la Royal Navy dans le cadre du programme britannique Polaris. Chaque sous-marin était armé de jusqu'à 16 missiles nucléaires UGM-27 Polaris A-3."
 ENG_sub_hull_large_double_3:0 "Classe Vanguard"
 ENG_sub_hull_large_double_3_desc:0 "La classe Vanguard est une classe de sous-marins nucléaires lanceurs d'engins (SNLE) en service au sein de la Royal Navy. Cette classe a été mise en service en 1994 dans le cadre du programme nucléaire Trident."
 ENG_screen_hull_medium_0:0 "Classe Bay"
 ENG_screen_hull_medium_0_desc:0 "La classe Bay était une série de 26 frégates antiaériennes (A/A) construites pour la Royal Navy dans le cadre du programme d'urgence de guerre de 1943 pendant la Seconde Guerre mondiale (dont une a été annulée et six ont été achevées en tant que navires de ravitaillement ou de reconnaissance). Elles s'inspiraient des coques de frégates anti-sous-marines (A/S) de la classe Loch qui n'avaient pas été achevées."
 ENG_screen_hull_medium_1:0 "Classe Whitby"
 ENG_screen_hull_medium_1_short:0 "Type 12"
 ENG_screen_hull_medium_1_desc:0 "Les frégates de type 12, ou de la classe Whitby, constituaient une classe de six frégates anti-sous-marines de la Royal Navy, entrées en service à la fin des années 1950. Elles avaient été conçues au début des années 1950 pour servir d'escorteurs de convoi hauturiers de premier ordre, à la lumière de l'expérience acquise pendant la Seconde Guerre mondiale. À cette époque, la Royal Navy concevait des escorteurs à fonction unique et les Whitby ont été conçus comme des escorteurs de convoi rapides, capables de faire face à des sous-marins à grande vitesse."
 ENG_screen_hull_medium_2:0 "Class Amazon"
 ENG_screen_hull_medium_2_short:0 "Type 21"
 ENG_screen_hull_medium_2_desc:0 "Au milieu des années 1960, la Royal Navy (RN) avait besoin de remplacer ses frégates à moteur diesel des classes Leopard (Type 41) et Salisbury (Type 61). Alors que les navires de guerre de la Royal Navy étaient traditionnellement conçus par le département naval du ministère de la Défense basé à Bath, des chantiers navals privés (en particulier Vosper Thorneycroft) ont fait campagne pour obtenir le droit de concevoir et de construire un navire répondant à ces besoins. Vosper Thorneycroft affirmait qu'en s'affranchissant de ce qu'il qualifiait de pratiques de conception conservatrices suivies par l'équipe du ministère de la Défense à Bath, il serait en mesure de livrer la nouvelle frégate à un prix nettement inférieur."
 ENG_screen_hull_medium_3:0 "Classe Broadsword"
 ENG_screen_hull_medium_3_short:0 "Type 22"
 ENG_screen_hull_medium_3_desc:0 "La frégate de type 22, également connue sous le nom de classe Broadsword, était une classe de frégates construites pour la Royal Navy britannique. Quatorze exemplaires ont été construits au total, la production étant répartie en trois séries. Initialement destinées à la lutte anti-sous-marine dans le cadre de la contribution de l'OTAN, ces navires sont finalement devenus des navires de guerre polyvalents."
 ENG_screen_hull_medium_4:0 "Classe Duke"
 ENG_screen_hull_medium_4_short:0 "Type 23"
 ENG_screen_hull_medium_4_desc:0 "La frégate de type 23, ou classe Duke, est une classe de frégates construites pour la Royal Navy britannique. Ces navires portent le nom de ducs britanniques, ce qui explique que cette classe soit communément appelée « classe Duke »."
 ENG_screen_hull_heavy_0:0 "Classe Daring"
 ENG_screen_hull_heavy_0_desc:0 "Les navires de la classe Daring étaient à la fois les plus grands et les plus lourdement armés des navires en service dans les marines du Commonwealth à être classés comme destroyers. Ils étaient destinés à assumer certaines des fonctions des croiseurs, que les planificateurs navals considéraient, après la Seconde Guerre mondiale, comme coûteux et obsolètes, et ont brièvement été officiellement classés comme un type hybride (les « Darings ») avant d’être reclassés en destroyers. Ils furent également les derniers destroyers de la Royal Navy (RN) et de la Royal Australian Navy (RAN) à posséder des canons comme armement principal (au lieu de missiles guidés), et furent utilisés pendant la Confrontation indonésienne et la guerre du Vietnam."
 ENG_screen_hull_heavy_1:0 "Classe County"
 ENG_screen_hull_heavy_1_desc:0 "La classe County était une classe de destroyers lance-missiles britanniques, les premiers navires de guerre de ce type construits par la Royal Navy. Conçus spécialement pour accueillir le système de missiles antiaériens Seaslug, ces navires avaient pour mission principale d'assurer la défense aérienne de zone autour de la force opérationnelle du porte-avions dans un contexte de guerre nucléaire."
 ENG_screen_hull_heavy_2:0 "Classe County Batch II"
 ENG_screen_hull_heavy_2_desc:0 "La classe County était une classe de destroyers lance-missiles britanniques, les premiers navires de guerre de ce type construits par la Royal Navy. Conçus spécialement pour accueillir le système de missiles antiaériens Seaslug, ces navires avaient pour mission principale d'assurer la défense aérienne de zone autour de la force opérationnelle du porte-avions dans un contexte de guerre nucléaire."
 ENG_screen_hull_heavy_3:0 "Classe Sheffield"
 ENG_screen_hull_heavy_3_short:0 "Type 42"
 ENG_screen_hull_heavy_3_desc:0 "La classe Type 42, ou classe Sheffield, était une série de quatorze destroyers lance-missiles qui ont servi dans la Royal Navy. Deux autres navires de cette classe ont été construits pour la marine argentine et ont servi dans ses rangs."
 ENG_screen_hull_heavy_4:0 "Classe Daring"
 ENG_screen_hull_heavy_4_short:0 "Type 45"
 ENG_screen_hull_heavy_4_desc:0 "Le destroyer de type 45, également connu sous le nom de classe D ou Daring, est une classe de six destroyers lance-missiles construits pour la Royal Navy britannique au début du XXIe siècle. Cette classe est principalement conçue pour la lutte antiaérienne et antimissile et s'articule autour du système de défense aérienne PAAMS (Sea Viper), qui utilise les radars AESA SAMPSON et les radars à longue portée S1850M."
 ENG_battle_hull_light_0:0 "Classe Minotaure"
 ENG_battle_hull_light_0_desc:0 "La classe Minotaur, ou « Design Z », était un projet de classe de croiseurs légers prévu pour la Royal Navy britannique peu après la Seconde Guerre mondiale. Le projet « Design Z » prévoyait plusieurs configurations, avec des armements et des systèmes de propulsion différents."
 ENG_battle_hull_light_1:0 "Classe Tiger"
 ENG_battle_hull_light_1_desc:0 "La classe Tiger comprenait trois navires de guerre britanniques du XXe siècle et constituait la dernière série de croiseurs entièrement armés de canons de la Royal Navy. Leur construction, initialement prévue dans le cadre de la classe Minotaur, a débuté pendant la Seconde Guerre mondiale, mais en raison de l'austérité d'après-guerre, de la guerre de Corée et de la préférence de Churchill pour les armes nucléaires et l'aviation au détriment de la flotte de surface, les coques sont restées inachevées."
 ENG_battle_hull_light_2:0 "Rénovation de la classe Tiger"
 ENG_battle_hull_light_2_desc:0 "En 1964, le gouvernement conservateur et la moitié de l'état-major de la marine estimaient que les « Tigers » n'étaient plus rentables ni crédibles dans leur rôle de combat de surface ou de défense aérienne de la flotte, et auraient préféré les mettre hors service ; mais comme ils n'avaient techniquement que trois ans et avaient été construits à un coût colossal, leur démolition s'avérait politiquement difficile. Ils ont donc approuvé leur conversion en porte-hélicoptères, destinés à embarquer des hélicoptères Westland Wessex pour les opérations des commandos de la Royal Marine. Un grand hangar remplaça la tourelle en « Y », tandis que les tourelles avant furent conservées pour l'appui-feu et la lutte anti-surface."
 ENG_battle_hull_light_3:0 "Classe Bristol"
 ENG_battle_hull_light_3_short:0 "Type 82"
 ENG_battle_hull_light_3_desc:0 "Le destroyer de type 82, ou de classe Bristol, devait constituer une classe de huit destroyers lance-missiles de la Royal Navy équipés du missile Sea Dart, destinés à remplacer les destroyers de classe County armés de missiles Seaslug. Ils devaient assurer la défense aérienne de zone au-dessus des groupes aéronavals et pouvaient opérer de manière autonome dans le rôle de croiseur moderne à l'est de Suez. Dotés de missiles à longue portée contre les cibles aériennes, de surface et sous-marines, ils devaient également servir au sein d'un groupe composé de quatre Type 82 et de quatre frégates de classe Leander « Broad Beam » en tant qu'escortes extérieures et intérieures des porte-avions CVA-01 prévus."
 attlee_speech_category:0 "Les discours publics du Premier ministre Attlee"
 attlee_speech_category_desc:0 "Le Premier ministre Attlee a été témoin du déclin rapide de l'Empire britannique peu après la fin de la Seconde Guerre mondiale. Il accorde une grande importance au bien-être des citoyens et s'oppose fermement à la guerre. Sous son gouvernement, le pays a entamé sa reconstruction."
 attlee_anti_war:0 "Organiser un discours contre la guerre destiné au grand public"
 attlee_anti_war_desc:0 "Cinq années de guerre ont causé d’énormes dégâts à notre pays. Des vies précieuses ont été perdues. De nombreuses richesses ont été détruites. Nos échanges commerciaux ont été perturbés. Il est évident que nous devrons faire face à des difficultés et à des pénuries dans de nombreux domaines. Pour parvenir à la reprise, nous avons besoin d’un effort considérable de la part de tous les hommes et femmes de Grande-Bretagne. Au cours des quatre dernières années et demie, un effort remarquable a été fourni : la production industrielle et agricole a considérablement augmenté, des possibilités d’emploi ont été offertes à tous et la grande majorité a bien travaillé. Les difficultés et les pénuries inévitables ont été, dans la mesure du possible, partagées par tous, mais il en va de même pour les avantages : le grand système de sécurité sociale a été étendu à tous. Le résultat de la politique du Parti travailliste se reflète dans la santé de la population, en particulier celle des enfants et des bébés : jamais ils n’ont été en aussi bonne santé. Oui, M. Churchill appelle cela « le partage de la misère », et la question qui doit être tranchée lors de cette élection est de savoir si la politique du Parti travailliste, qui consiste à assurer une part équitable à tous, doit se poursuivre, ou si, comme sous les précédents gouvernements conservateurs, les avantages doivent revenir à une partie de la population et la misère à une autre. Je vous demande de nous aider à poursuivre l’œuvre de relance si bien engagée."
 attlee_korean_war:0 "Aborder la guerre de Corée"
 attlee_korean_war_desc:0 "Nous sommes confrontés à une remise en cause directe de l’autorité des Nations Unies ; un acte d’agression a été commis. Vous pouvez bien sûr convoquer toutes sortes de réunions extraordinaires, vous pouvez dire que le gouvernement sud-coréen ou le gouvernement américain a raison, je suis d’accord. Mais le fait qu’une personne ait un caractère peu recommandable n’excuse pas qu’on tente de l’assassiner. Vous pouvez dire que la Chine, la nouvelle Chine, ne siège pas au Conseil de sécurité. Cela n’affecte ni ne modifie en rien le fait qu’il s’agisse d’une agression. Et si l'Organisation des Nations Unies n'était pas tout à fait l'ancienne Société des Nations, il était absolument nécessaire de mettre un terme à cela. Et plus de cinquante autres nations les soutiennent dans cet effort pour préserver la paix mondiale. Cela implique des risques et des dangers, comme toute autre cause implique des risques et des dangers. Je suis tout à fait certain que si nous gagnons, l'autorité dans le monde sera plus grande que celle de l'agresseur. Nous devons affirmer ici et maintenant que l'agression ne réussira pas."
 churchill_speech_category:0 "Les discours du Premier ministre Churchill"
 churchill_speech_category_desc:0 "Le Premier ministre Churchill est notre héros de guerre ; il a guidé le pays pendant les cinq années les plus difficiles. Bien que la Seconde Guerre mondiale ait coûté la vie à des millions de Britanniques, notre grand Premier ministre a refusé tout compromis avec les nazis et s'est battu jusqu'à la victoire finale ; on se souviendra à jamais de sa contribution à la nation et à la paix mondiale."
 churchill_king_death:0 "Discours prononcé à l'occasion du décès du roi George VI"
 churchill_king_death_desc:0 "Au cours de ces derniers mois, le roi a côtoyé la mort comme si celle-ci était une compagne, une connaissance qu’il reconnaissait et ne craignait pas. À la fin, la mort est venue comme une amie, et après une heureuse journée passée au soleil et à la pratique de ses sports favoris, après avoir dit « bonne nuit » à ceux qui l’aimaient le plus, il s’est endormi comme tout homme ou toute femme qui s’efforce de craindre Dieu et rien d’autre au monde peut espérer le faire. Moi qui ai passé ma jeunesse dans la gloire auguste, incontestée et tranquille de l’époque victorienne, je ne peux m’empêcher d’éprouver un frisson en invoquant une fois de plus la prière et l’hymne : « God save the Queen ! »"