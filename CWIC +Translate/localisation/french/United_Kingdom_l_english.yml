l_english:
 ENG_The_British_Armed_Forces:0 "Les forces armées britanniques"
 ENG_The_British_Armed_Forces_desc:0 "Meurtries mais non brisées, les forces armées britanniques sont sorties des épreuves de la Seconde Guerre mondiale en tant que force de combat éprouvée. Il y a toutefois toujours matière à amélioration..."
 ENG_The_British_Army:0 "L'armée britannique"
 ENG_The_British_Army_desc:0 "Après avoir été décimée à Dunkerque, l'armée britannique s'est réarmée et a survécu à la guerre. Mais de nouveaux équipements et de nouvelles tactiques seront nécessaires pour survivre à la nouvelle ère de la guerre."
 ENG_FV_214_Conqueror:0 "FV-214 Conqueror"
 ENG_FV_214_Conqueror_desc:0 "Si la Grande-Bretagne veut rivaliser avec les superpuissances mondiales, elle aura besoin d'armes à la hauteur des leurs. Le Conqueror répond à cette exigence. Plus lourdement armé que le Centurion, le Conqueror est capable d'affronter le redoutable IS-3 soviétique et de défendre les intérêts de la Grande-Bretagne."
 ENG_Expand_Centurion_Production:0 "Développer la production de Centurion"
 ENG_Expand_Centurion_Production_desc:0 "Bien qu'il n'ait pas été mis à l'épreuve pendant la Seconde Guerre mondiale, le Centurion a le potentiel de devenir un pilier de l'armée britannique. À cette fin, il faut augmenter la production pour répondre à la demande."
 ENG_Adopt_the_L1A1:0 "Adopter le L1A1"
 ENG_Adopt_the_L1A1_desc:0 "Cette arme d'origine belge, désormais baptisée L1A1, a subi les modifications nécessaires pour en faire une arme adaptée au rôle de « gardien de la paix » impérial et devrait bientôt être prête à entrer en service."
 ENG_Develop_Counter_Insurgency_Tactics:0 "Élaborer des tactiques de lutte contre l'insurrection"
 ENG_Develop_Counter_Insurgency_Tactics_desc:0 "Les nouveaux ennemis de la Grande-Bretagne ne mèneront pas une guerre ouverte, avec des lignes de front et des règles d'engagement claires ; nous devons donc nous adapter et trouver une solution."
 ENG_The_Royal_Navy:0 "La Royal Navy"
 ENG_The_Royal_Navy_desc:0 "La Royal Navy s'est révélée être un élément essentiel de la défense de la Grande-Bretagne au cours des deux dernières grandes guerres et le sera sans aucun doute lors de la prochaine. Il faut mettre en service des navires nouveaux et plus performants pour faire face aux ennemis de la Grande-Bretagne."
 ENG_The_Daring_class_Destroyers:0 "Les destroyers de la classe Daring"
 ENG_The_Daring_class_Destroyers_desc:0 "Le nouveau destroyer de la classe Daring contribuera à combler les lacunes de la nouvelle stratégie navale britannique. Plus grand que la plupart des destroyers, le Daring peut assumer certaines fonctions autrefois dévolues aux croiseurs ; toutefois, certains craignent que son manque d'armement, hormis ses canons, ne pose problème à l'avenir."
 ENG_Complete_the_Audacious_Class_Carriers:0 "Terminer les porte-avions de la classe Audacious"
 ENG_Complete_the_Audacious_Class_Carriers_desc:0 "Mis en chantier pendant la Seconde Guerre mondiale, les porte-avions de la classe Audacious devraient bientôt être opérationnels et mener la Royal Navy vers une nouvelle ère de la guerre navale."
 ENG_Invest_in_Nuclear_Reactor_Research:0 "Investir dans la recherche sur les réacteurs nucléaires"
 ENG_Invest_in_Nuclear_Reactor_Research_desc:0 "La puissance de l'atome a déjà fait ses preuves ; la question est désormais de savoir s'il est possible d'exploiter cette puissance de manière moins destructrice."
 ENG_Develop_the_Tiger_Class_Cruisers:0 "Développer les croiseurs de la classe Tiger"
 ENG_Develop_the_Tiger_Class_Cruisers_desc:0 "Commandé en 1941, le croiseur Tiger suscite des doutes quant à sa place au sein de la flotte moderne. Avec quelques modifications, ces doutes peuvent toutefois être dissipés et les Tiger peuvent enfin être rendus opérationnels."
 ENG_The_Nuclear_Program:0 "Le programme nucléaire"
 ENG_The_Nuclear_Program_desc:0 "Pour que la Grande-Bretagne survive, elle doit disposer des armes les plus performantes et les plus destructrices qui soient, et la bombe atomique en fait certainement partie. Les meilleurs scientifiques britanniques se mettront au travail pour construire notre propre bombe et trouver d'autres applications à la technologie nucléaire."
 ENG_Vickers_Valiant:0 "Vickers Valiant"
 ENG_Vickers_Valiant_desc:0 "Si la Grande-Bretagne veut se doter d'une arme nucléaire, elle doit être en mesure de la transporter et de la larguer. Le Valiant sera l'instrument de destruction de la Grande-Bretagne et, espérons-le, n'aura jamais à accomplir la mission pour laquelle il a été conçu."
 ENG_Fission_Nuclear_Tests:0 "Essais nucléaires de fission"
 ENG_Fission_Nuclear_Tests_desc:0 "Il faut comprendre comment les Américains ont exploité l'énergie nucléaire pour fabriquer une bombe. Les essais devraient être menés... dans un endroit isolé."
 ENG_The_Thermonuclear_Weapon_Program:0 "Le programme d'armes thermonucléaires"
 ENG_The_Thermonuclear_Weapon_Program_desc:0 "Nos premiers essais se sont bien déroulés, mais nous nous heurtons à un mur et avons besoin d'aide pour construire une bombe d'une puissance équivalente à celle des Américains et des Soviétiques. Nous pourrions nous adresser directement à la source ou mettre en commun toutes les connaissances de l'Empire dans l'espoir de faire une percée."
 ENG_Seek_American_Cooperation:0 "Solliciter la coopération des États-Unis"
 ENG_Seek_American_Cooperation_desc:0 "Les Américains sont nos alliés de confiance et n'ont certainement aucune raison de nous refuser l'accès à leurs données nucléaires."
 ENG_Commonwealth_Collaboration:0 "Coopération au sein du Commonwealth"
 ENG_Commonwealth_ColLaboration_desc:0 "Les pays du Commonwealth sont nos fidèles partenaires et n'ont certainement aucune raison de ne pas collaborer avec nous dans le cadre de notre projet nucléaire."
 ENG_The_Gloster_Javelin:0 "Le Gloster Javelin"
 ENG_The_Gloster_Javelin_desc:0 "On ne saurait trop insister sur la menace que représentent les bombardiers à réaction, d'autant plus que le souvenir du Blitz est encore frais dans l'esprit de nombreux Britanniques. Le Javelin protégera la Grande-Bretagne et ses intérêts contre cette menace."
 ENG_Produce_the_DH_112_Venom:0 "Fabriquer le DH-112 Venom"
 ENG_Produce_the_DH_112_Venom_desc:0 "Alors que les avions à réaction font l'objet d'innovations rapides partout dans le monde, la Grande-Bretagne doit suivre le rythme. Le DH 112 Venom nous rendra de grands services et apportera des améliorations par rapport à notre ancien parc d'avions à réaction."
 ENG_The_Hawker_Hunter:0 "Le Hawker Hunter"
 ENG_The_Hawker_Hunter_desc:0 "Après avoir battu le record du monde de vitesse, il ne fait aucun doute que le Hawker Hunter est un modèle de référence pour la nouvelle génération de la RAF."
 ENG_The_Avro_Vulcan:0 "L'Avro Vulcan"
 ENG_The_Avro_Vulcan_desc:0 "Le Vulcan, un bombardier stratégique de haute technologie qui dotera la Grande-Bretagne de la force de dissuasion nucléaire nécessaire à l'ère moderne."
 ENG_The_Royal_Airforce:0 "La Royal Air Force"
 ENG_The_Royal_Airforce_desc:0 "La Royal Air Force a remporté la bataille d'Angleterre et a protégé nos soldats à l'étranger, mais elle doit s'adapter à notre époque."
 ENG_Operation_Grapple:0 "Opération Grapple"
 ENG_Operation_Grapple_desc:0 "Nous y sommes parvenus. Du moins, c'est ce que nous pensons. Une nouvelle série de tests permettra de valider les travaux de nos scientifiques et contribuera à redorer le blason de la Grande-Bretagne sur la scène internationale."
 ENG_ColdWar:0 "La Guerre froide"
 ENG_ColdWar_desc:0 "« De Stettin, sur la Baltique, à Trieste, sur l'Adriatique, un rideau de fer s'est abattu sur le continent. » Nous devons tenir compte de l'avertissement de Churchill : la menace communiste n'est pas à venir, elle est déjà là ! Les hommes de Grande-Bretagne doivent rester vigilants en tout temps."
 ENG_HighMilitarism:0 "Militarisme exacerbé"
 ENG_HighMilitarism_desc:0 "Nous devons militariser notre pays, quelle que soit la menace que représente le complexe militaro-industriel. Nous devons nous militariser plus rapidement que jamais face à une menace plus grande que jamais. La Grande-Bretagne deviendra une puissance militaire."
 ENG_LowMilitarism:0 "Faible militarisme"
 ENG_LowMilitarism_desc:0 "En se concentrant uniquement sur la préparation défensive, on évitera la mise en place d'un complexe militaro-industriel."
 ENG_CloakDagger:0 "Capes et couteaux"
 ENG_CloakDagger_desc:0 "Les tactiques clandestines pourraient nous donner un avantage considérable sur les Soviétiques. Nous devons mettre à profit toutes les tactiques dont nous disposons dans cette guerre froide."
 ENG_Militarise:0 "Renforcement du militarisme"
 ENG_Militarise_desc:0 "Il faut renforcer le militarisme. Nous allons faire entrer toute la Grande-Bretagne de plein pied dans la Guerre froide."
 ENG_Mobalise:0 "Mobilisation économique"
 ENG_Mobalise_desc:0 "La prochaine grande guerre approche."
 ENG_MI6:0 "MI6"
 ENG_MI6_desc:0 "Il faut étendre le programme MI6."
 ENG_MI5:0 "MI5"
 ENG_MI5_desc:0 "Le renforcement du MI5 pourrait être très bénéfique pour la sécurité intérieure britannique. La meilleure défense, c'est l'attaque."
 ENG_StrikeFirst:0 "Frapper le premier"
 ENG_StrikeFirst_desc:0 "Nous devons être la poudrière de la Troisième Guerre mondiale afin que nos alliés soient prêts et que nous puissions frapper selon nos propres conditions."
 ENG_DefensivePrep:0 "Préparatifs défensifs"
 ENG_DefensivePrep_desc:0 "Nous devons préparer nos défenses. Il faut préparer la barrière naturelle que constitue la mer pour la Grande-Bretagne."
 ENG_Spy1:0 "Jeter un œil derrière le rideau"
 ENG_Spy1_desc:0 "Nous devons envoyer des espions et mettre en place un réseau de renseignement derrière le Rideau de fer ; après tout, c'est là que sont émis les ordres soviétiques les plus importants."
 ENG_Cubs:0 "Se défendre contre les Cubs"
 ENG_Cubs_desc:0 "Si la Russie représente une menace, ses marionnettes en constituent une tout autant. Nous devons y faire face."
 ENG_Unthinkable:0 "Opération « Unthinkable »"
 ENG_Unthinkable_desc:0 "Winston Churchill et ses alliés ont élaboré une série de plans, baptisés « Opération Unthinkable », afin d'envisager une guerre contre le Pacte de Varsovie et l'Union soviétique. Nous devons les mettre en œuvre et entrer en guerre sans délai."
 ENG_LetThemCome:0 "Qu'ils viennent !"
 ENG_LetThemCome_desc:0 "Que nos ennemis viennent jusqu'à nos côtes et s'écrasent comme des vagues contre le rocher que nous sommes ! Qu'ils s'écrasent !"
 ENG_Spy2:0 "Techniques d'espionnage perfectionnées"
 ENG_Spy2_desc:0 "Nous sommes entrés dans une nouvelle ère de la guerre. Une ère d'espionnage et de ruses. Pour mener ce combat à bien, nous devons nous tenir informés des dernières avancées en matière de décryptage afin de nous défendre efficacement contre les espions soviétiques."
 ENG_Defend:0 "Se défendre contre Mama Bear"
 ENG_Defend_desc:0 "Maintenant que les Cubs sont hors jeu, nous devons nous méfier de la « Mama Bear », l'Union soviétique."
 ENG_Suez_Crisis:0 "La crise de Suez"
 ENG_Suez_Crisis_desc:0 "Depuis trop longtemps, Nasser s'oppose à l'Empire. En tentant de nationaliser le canal de Suez, il a poussé le bouchon trop loin. Avec le soutien de nos alliés israéliens, nous allons montrer à ce nationaliste arriviste qu'il ne faut pas se frotter au Lion !"
 ENG_Withdrawal_from_Suez:0 "Retrait de Suez"
 ENG_Withdrawal_from_Suez_desc:0 "Nasser a tenu bon. Les Américains nous menacent de ruine économique si nous ne nous retirons pas. Nous n'avons d'autre choix que de céder le canal de Suez aux Égyptiens."
 ENG_Humiliation:0 "Humiliation internationale"
 ENG_Humiliation_desc:0 "Notre défaite près du canal a ruiné notre réputation. Les enfants d’une douzaine de pays différents se moquent de nous, et les dignitaires étrangers rient et ricanent en coulisses. C’est un jour sombre pour la Grande-Bretagne."
 ENG_Empires_End:0 "La fin de l'Empire"
 ENG_Empires_End_desc:0 "Notre heure a enfin sonné. Nos marines régnaient autrefois sur les mers. Notre industrie surpassait toutes les autres. Nul n’osait même tenter de défier la puissance de nos armées. Sous la protection éternelle de Dieu, le soleil ne se couchait jamais sur l’Empire. Mais cette époque est révolue. Notre nation est tombée en disgrâce, nos colonies sont perdues. Mettez le drapeau en berne et faites vos adieux à l’Empire."
 ENG_Victory_in_Suez:0 "Victoire à Suez"
 ENG_Victory_in_Suez_desc:0 "La guerre est gagnée ! Avec l'aide des Israéliens et des Français, nous avons chassé Nasser du canal de Suez. Le soleil ne se couchera jamais !"
 ENG_Push_for_Regime_Change:0 "Appel à un changement de régime"
 ENG_Push_for_Regime_Change_desc:0 "Grâce à notre victoire au canal, le gouvernement de Nasser s'est rapidement effondré. Nous avons désormais l'occasion de prendre le contrôle de la scène politique égyptienne et de commencer enfin à récupérer nos possessions impériales perdues."
 ENG_Settle_for_Suez:0 "Se contenter de la zone d'occupation de Suez"
 ENG_Settle_for_Suez_desc:0 "Suite à notre victoire au niveau du canal, nos concitoyens exigent que nous allions plus loin et que nous renversions Nasser. Cependant, face aux menaces d'embargo et de sanctions brandies par les Américains, nous avons décidé de suspendre notre avancée au niveau du canal."
 ENG_Strengthen_Ties_to_Israel:0 "Renforcer les liens avec Israël"
 ENG_Strengthen_Ties_to_Israel_desc:0 "Notre victoire aux côtés de Nasser n'a en rien été influencée par le soutien que nous avons reçu de l'armée israélienne. Dans cette optique, de nombreux hauts responsables de notre armée ont laissé entendre qu'une coopération avec le gouvernement israélien pourrait s'avérer avantageuse pour nos futures opérations au Moyen-Orient."
 ENG_Resist_Decolonization:0 "Résister à la décolonisation"
 ENG_Resist_Decolonization_desc:0 "Notre Grande-Bretagne a peut-être traversé des moments difficiles ces dernières années, mais c'est fini ! À jamais bénie par Dieu, le soleil ne se couche jamais sur l'Empire britannique !"
 ENG_Patriot:0 "Un patriotisme renouvelé"
 ENG_Patriot_desc:0 "La victoire sur Hitler a ravivé le patriotisme britannique ! La puissance de notre empire nous permettra de lutter contre ces fléaux ; peut-être la Grande-Bretagne est-elle prête pour un nouvel empire."
 ENG_Solidify_Ties_with_France:0 "Renforcer les relations avec la France"
 ENG_Solidify_Ties_with_France_desc:0 "Nous, les Britanniques, n'avons pas toujours entretenu des relations des plus cordiales avec notre voisin du sud, mais nous avons combattu côte à côte lors des deux guerres mondiales en tant qu'alliés indissociables. Compte tenu de l'aide qu'ils nous ont apportée lors de la crise de Suez, nous devons renforcer nos relations avec les Français."
 ENG_Dominion_of_Rhodesia:0 "Dominion de Rhodésie"
 ENG_Dominion_of_Rhodesia_desc:0 "Le gouvernement colonial en place en Rhodésie du Sud sollicite depuis un certain temps déjà auprès de Westminster une collaboration plus étroite avec le gouvernement central. Compte tenu de l'intérêt récent de notre peuple pour le renforcement de l'Empire, il s'agit là d'une offre que nous ne pouvons refuser."
 ENG_Preserve_Arab_Colonies:0 "Préserver les colonies arabes"
 ENG_Preserve_Arab_Colonies_desc:0 "En vertu de l'accord Sykes-Picot de 1916, le Moyen-Orient devait être partagé entre les empires français et britannique, afin d'assurer une plus grande prospérité à nos royaumes et de développer comme il se doit ces régions qui avaient été négligées par les autochtones. L'Empire en Orient ne doit pas être perdu."
 ENG_Statute:0 "Mettre fin à la loi"
 ENG_Statute_desc:0 "Pour véritablement renforcer l'Empire et le faire entrer dans une nouvelle ère de prospérité, il faut restreindre la souveraineté de nos colonies. De toute façon, elles seront mieux loties sous notre domination."
 ENG_Strengthen_Ties_to_South_Africa:0 "Renforcer les liens avec l'Afrique du Sud"
 ENG_Strengthen_Ties_to_South_Africa_desc:0 "Compte tenu des importantes ressources dont dispose l'Afrique du Sud, il serait dans notre intérêt d'entretenir de bonnes relations avec son gouvernement."
 ENG_Secure_African_Colonies:0 "Assurer la sécurité des colonies africaines"
 ENG_Secure_African_Colonies_desc:0 "L'Afrique a toujours résisté farouchement à la conquête. Les émeutes envahissent les rues, les nationalistes réclament davantage de souveraineté. Bah ! L'Afrique est mieux lotie sous la tutelle de la Grande-Bretagne, et nous veillerons à ce que les indigènes en prennent bonne note."
 ENG_Dominions:0 "Les dominions"
 ENG_Dominions_desc:0 "Afin de renforcer l'Empire, nous devons renforcer encore davantage notre emprise sur nos colonies."
 ENG_Commonwealth:0 "Le Commonwealth"
 ENG_Commonwealth_desc:0 "Après les efforts que nous avons récemment déployés pour centraliser l'Empire, il est temps d'unir véritablement tous nos territoires sous un seul drapeau, l'Union Jack !"
 ENG_CanExpan:0 "Assujettir le Canada"
 ENG_CanExpan_desc:0 "Le Canada, notre principal point d'ancrage en Amérique du Nord, est une nation prospère, regorgeant de ressources naturelles. Un peuple qui vit sur une terre aussi magnifique comprend sans aucun doute que, sous notre juste gouvernance, son sort ne pourrait qu'être amélioré, n'est-ce pas ?"
 ENG_Ozzie:0 "Assujettir l'Australie"
 ENG_Ozzie_desc:0 "Le renforcement de nos garnisons militaires en Australie, ainsi que le renforcement de la réglementation de son économie depuis Londres, devraient convaincre le gouvernement australien de repenser sa souveraineté."
 ENG_SouthAfrica:0 "Assujettir l'Afrique du Sud"
 ENG_SouthAfrica_desc:0 "En exploitant les tensions raciales en Afrique du Sud, nous pourrions faire passer l'intégration au sein de la Grande Fédération impériale pour une solution aux problèmes de l'Afrique du Sud."
 ENG_Retake_Ireland:0 "Reconquérir l'Irlande"
 ENG_Retake_Ireland_desc:0 "L'Irlande ne souhaite pas nous revoir. Elle n'a toutefois pas le choix. La Grande-Bretagne va de l'avant."
 ENG_NZL:0 "Assujettir la Nouvelle-Zélande"
 ENG_NZL_desc:0 "Les Néo-Zélandais sont des gens raisonnables ; avec la bonne approche, on pourrait tout simplement les convaincre de se joindre à nous. Sinon, on pourrait toujours se contenter de mettre le feu à Wellington."
 ENG_Empress:0 "Vive l'impératrice"
 ENG_Empress_desc:0 "Enfin, après des années durant lesquelles notre Empire a lentement sombré dans l'oubli, nous avons su nous ressaisir et réunir nos colonies sous le drapeau britannique. Le Lion rugit pour toujours !"
 ENG_Britannia:0 "Rule Britannia"
 ENG_Britannia_desc:0 "La Grande-Bretagne, bénie et libre, comblée par Dieu, joyau resplendissant de la Terre. Car lorsque la Grande-Bretagne émergea de la mer, les anges se rassemblèrent autour de la nation et entonnèrent cet hymne : « Rule Britannia ! Britannia règne sur les vagues ! »"
 ENG_Raj:0 "Le Raj"
 ENG_Raj_desc:0 "Westminster a cédé à tort aux revendications d'indépendance absurdes des Indiens. Une telle parodie de justice ne peut rester impunie. Nous ferons en sorte que ces mangeurs de curry découvrent ce qu'est la domination impériale."
 ENG_Cooperation_with_India:0 "Coopération avec l'Inde"
 ENG_Cooperation_with_India_desc:0 "Même s’il serait certes glorieux de reconquérir le Raj, cela est tout simplement irréalisable. Avec le souvenir de Gandhi encore frais dans les mémoires, nous serions confrontés à un élan irrésistible en faveur de l’indépendance. Le peuple britannique a déjà subi suffisamment de pertes humaines outre-mer au cours de notre histoire récente : nous ne devons pas sacrifier inutilement nos jeunes hommes. Il serait bien plus profitable pour nos deux nations de rechercher une coopération mutuelle, nous ouvrant ainsi l’accès aux ressources indiennes sans qu’une seule goutte de sang ne soit versée."
 ENG_Election_of_1950:0 "Élections législatives de 1950"
 ENG_Election_of_1950_desc:0 "Cela fait cinq ans que les armes se sont tues à travers l'Europe. Cela fait également cinq ans que le Parti travailliste de Clement Atlee a remporté une victoire éclatante, du moins aux yeux de l'establishment conservateur britannique. L'année 1950 sera-t-elle une répétition de 1945 ? C'est désormais au peuple de décider."
 ENG_Labour_Victory:0 "Victoire du Parti travailliste"
 ENG_Labour_Victory_desc:0 "Sans surprise, les Britanniques ont décidé de maintenir le Parti travailliste d'Atlee au pouvoir afin de poursuivre la reconstruction du pays."
 ENG_Enviromental_Regulations:0 "Réglementation environnementale"
 ENG_Enviromental_Regulations_desc:0 "Depuis le début de la révolution industrielle dans notre pays, il y a plusieurs siècles, on n'a jamais pris soin de nos terres verdoyantes et agréables. Il est grand temps de prendre des mesures concrètes, et cette responsabilité nous incombe désormais. À quoi sert une Nouvelle Jérusalem sans air pur ?"
 ENG_Sell_Jet_Technology_to_Soviets:0 "Vendre la technologie des avions à réaction aux Soviétiques"
 ENG_Sell_Jet_Technology_to_Soviets_desc:0 "Notre économie bat de l'aile. La négociation d'un simple contrat d'armement permettra d'injecter des fonds dans notre économie. Tant que personne ne se posera de questions sur l'origine de cet argent, tout ira bien."
 ENG_Nationalize_Steel_Industry:0 "Nationaliser l'industrie sidérurgique"
 ENG_Nationalize_Steel_Industry_desc:0 "Compte tenu du rôle qu'elle a joué dans la pollution de la Grande-Bretagne, l'industrie sidérurgique a tout intérêt à rester sous contrôle national. De plus, nous devons faire savoir clairement que les ressources de la Grande-Bretagne ne seront pas exploitées par des étrangers."
 ENG_Liberal_Victory:0 "Victoire des libéraux"
 ENG_Liberal_Victory_desc:0 "À la grande surprise générale, le Parti libéral de Clement Davies est arrivé en tête des élections et peut désormais poursuivre la nationalisation des industries du pays."
 ENG_Rural_Infrastructure:0 "Infrastructures rurales"
 ENG_Rural_Infrastructure_desc:0 ""
 ENG_Develop_Wales_and_Scotland:0 "Développer le Pays de Galles et l'Écosse"
 ENG_Develop_Wales_and_Scotland_desc:0 ""
 ENG_Seek_closer_ties_to_western_europe:0 "Renforcer les liens avec l'Europe occidentale"
 ENG_Seek_closer_ties_to_western_europe_desc:0 ""
 ENG_Conservative_Victory:0 "Victoire des conservateurs"
 ENG_Conservative_Victory_desc:0 "Après s'être remis de sa défaite écrasante de 1945, le Parti conservateur, toujours dirigé par Winston Churchill, a fait son retour au Parlement."
 ENG_Oppose_Further_Nationalization:0 "S'opposer à de nouvelles nationalisations"
 ENG_Oppose_Further_Nationalization_desc:0 "Cela fait cinq ans que les armes se sont tues à travers l'Europe. Cela fait également cinq ans que le Parti travailliste de Clement Atlee a remporté une victoire éclatante, du moins aux yeux de l'establishment conservateur britannique. L'année 1950 sera-t-elle une répétition de 1945 ? C'est désormais au peuple de décider."
 ENG_Political_Stability:0 "Stabilité politique"
 ENG_Political_Stability_desc:0 ""
 ENG_Tax_Cuts:0 "Réductions d'impôts"
 ENG_Tax_Cuts_desc:0 ""
 tax_cuts:0 "Réductions d'impôts"
