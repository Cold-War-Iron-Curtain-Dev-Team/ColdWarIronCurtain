 ENG_SeaAndSky:0 "Les gardiens de la mer et du ciel"
 ENG_SeaAndSky_desc:0 "Autrefois, nos marines étaient réputées dans le monde entier, et nos escadrons aériens combattaient aux côtés des Américains, anéantissant la Luftwaffe allemande qui avait si longtemps dominé le continent. Mais depuis la fin de la guerre, notre puissance s'est estompée. Nos marines et notre armée de l'air sont désormais surpassées par nos alliés américains. Si nous voulons reconstruire la Grande-Bretagne, nous devons également renforcer ces secteurs."
 ENG_ShdwScheme:0 "Le programme « Shadow »"
 ENG_ShdwScheme_desc:0 "Même s'il a été proposé avant la guerre et adopté dans le contexte de celle-ci, le « Shadow Scheme » présente encore un grand potentiel pour l'armement aérien britannique en temps de paix ; nous devons donc le considérer comme un texte législatif indispensable pour notre précieuse RAF"
 ENG_Designs:0 "Nouveaux modèles"
 ENG_Designs_desc:0 "Nous devons nous tourner vers des avions et des conceptions plus modernes, afin qu'ils puissent dominer les cieux plus que jamais ; les vestiges de la guerre mondiale sont peut-être encore présents, mais nous devons toujours regarder vers l'avenir."
 ENG_AirDoctrine:0 "Doctrine aérienne"
 ENG_AirDoctrine_desc:0 "La doctrine aérienne de notre pays présentait des lacunes lors de la dernière guerre ; la destruction stratégique n'a pas joué un rôle déterminant dans l'effort de guerre ; nous devons donc affiner nos doctrines."
 ENG_SuthEnglishBase:0 "Bases aériennes du sud de l'Angleterre"
 ENG_SuthEnglishBase_desc:0 "Le sud de l'Angleterre a toujours été notre région de prédilection pour les bases aériennes, grâce à sa proximité avec le continent et à ses plaines s'étendant à perte de vue ; la RAF y trouvera certainement de nombreuses autres bases."
 ENG_Airforce:0 "L'armée de l'air"
 ENG_ChessSky:0 "Les échecs dans le ciel"
 ENG_ChessSky_desc:0 "Nous devons améliorer nos stratégies et commencer à considérer cela comme une partie d'échecs dans les airs."
 ENG_Airforce_desc:0 "Il faut considérer l'armée de l'air comme un tout ; quelle est sa situation actuelle ? Elle doit être renforcée et consolidée."
 ENG_AirSchemeII:0 "Programme aérien II"
 ENG_AirSchemeII_desc:0 "Nous devons élaborer un deuxième plan aérien, axé cette fois-ci sur le rôle de l'armée de l'air dans les guerres à venir."
 ENG_ExpndRoyalNavy:0 "Développer la marine"
 ENG_ExpndRoyalNavy_desc:0 "Nous devons renforcer notre vieille amie, la Royal Navy : c'est la première étape pour reprendre le contrôle des mers !"
 ENG_Carriers:0 "Porte-avions"
 ENG_Carriers_desc:0 "Nous devons redoubler d'efforts pour augmenter le nombre de porte-avions dont disposent notre marine et notre armée de l'air."
 ENG_ASW:0 "Guerre anti-sous-marine"
 ENG_ASW_desc:0 "Compte tenu des enseignements tirés de la dernière Grande Guerre, il est indispensable d'investir dans nos capacités de lutte anti-sous-marine."
 ENG_Battleships:0 "Cuirassés"
 ENG_Battleships_desc:0 "Il nous faut davantage de cuirassés"
 ENG_ShdwDocks:0 "Chantiers navals de l'Ombre"
 ENG_ShdwDocks_desc:0 "Le programme « Shadow » a été un grand succès pour l'armée de l'air ; peut-être pourrait-on le reproduire pour notre formidable marine."
 ENG_ScotDocks:0 "Chantiers navals écossais"
 ENG_ScotDocks_desc:0 "Nous pourrions facilement construire davantage de chantiers navals en Écosse"
 ENG_TacticsAdmiralty:0 "Stratèges de l'Amirauté"
 ENG_TacticsAdmiralty_desc:0 "Les tactiques employées par notre marine sont dépassées. Nous devons les perfectionner."
 ENG_praiselord:0 "« Loué soit le Seigneur... »"
 ENG_praiselord_desc:0 ""
 ENG_passammo:0 "« ...et passe-moi les munitions... »"
 ENG_passammo_desc:0 ""
 ENG_stayfree:0 "« Et nous resterons tous libres. »"
 ENG_stayfree_desc:0 ""
 ENG_Frwlharold:0 "Adieu à Harold Alexander"
 ENG_Frwlharold_desc:0 "Nous devons faire nos adieux à Sir Harold Alexander, qui quitte l'armée pour se rendre au Canada où il occupera le poste de gouverneur général."
 ENG_Frwlvetrans:0 "Adieu à nos anciens combattants"
 ENG_Frwlvetrans_desc:0 "Nous devons laisser la vieille garde quitter nos rangs et reprendre le cours de sa vie"
 ENG_NewGuard:0 "Constituer une nouvelle garde"
 ENG_NewGuard_desc:0 "Maintenant que l'ancienne garde a disparu, nous pouvons constituer une nouvelle garde pour toute la Grande-Bretagne afin de mettre au point de nouvelles tactiques et de maintenir nos forces à la pointe de la technologie."
 ENG_NewDoctrines:0 "Nouvelles doctrines"
 ENG_NewDoctrines_desc:0 "Nous devons adopter de nouvelles doctrines dans le domaine militaire, et non nous en tenir aux anciennes."
 ENG_ConsultAdvisors:0 "Consulter les généraux"
 ENG_ConsultAdvisors_desc:0 "Dans notre quête de nouvelles doctrines, nous devons consulter nos vétérans, car ce sont eux qui en savent le plus sur les doctrines futures"
 ENG_MdrnDivisions:0 "Divisions modernes"
 ENG_MdrnDivisions_desc:0 "Nous devons créer des divisions modernes pour notre armée"
 ENG_OldDoctrines:0 "Anciennes doctrines"
 ENG_OldDoctrines_desc:0 "Le « Grand Plan de bataille » a rendu d'immenses services à notre nation pendant la guerre mondiale ; comme il s'écoulera sans doute beaucoup de temps avant qu'une autre ne surgisse, nous pouvons optimiser notre planification : les anciennes doctrines resteront notre ligne directrice !"
 ENG_Grand-erBttlepln:0 "Plan de bataille global"
 ENG_Grand-erBttlepln_desc:0 "Nous devons élaborer des plans de bataille plus ambitieux, plus grandioses et de plus grande envergure que jamais ; nous devons concevoir les plans les plus extraordinaires que l'humanité ait jamais connus ; notre pays a le droit de planifier la prochaine guerre !"
 ENG_NewDivisions:0 "Nouvelles divisions"
 ENG_NewDivisions_desc:0 "Les anciennes divisions de notre armée ne sont qu'un assemblage hétéroclite issu de la guerre ; nous devons aller de l'avant et professionnaliser nos forces pour qu'elles soient à la hauteur de celles des armées européennes."
 ENG_Royalarmy:0 "L'armée royale"
 ENG_Royalarmy_desc:0 "L'armée royale britannique n'a jamais été aussi importante qu'aujourd'hui. Elle a survécu aux flammes de la Seconde Guerre mondiale. Malgré leur expérience, bon nombre de ces hommes manquent encore d'entraînement et de commandants compétents. Pour rester compétitifs, nous devons redynamiser l'armée."
 ENG_Warhawks:0 "Éliminer les Warhawks"
 ENG_Warhawks_desc:0 "Nous devons faire partir les Warhawks de toute l'Europe, ou faire pression sur leur gouvernement pour qu'il les expulse. Il y a déjà eu de nombreux incidents évités de justesse, nous n'en voulons pas d'autres."
 ENG_Cooling:0 "Commencer à refroidir"
 ENG_Cooling_desc:0 "Maintenant que les Warhawks ont été éliminés, nous pouvons entamer les missions diplomatiques"
 ENG_Soldiers:0 "Réduire les effectifs militaires"
 ENG_Soldiers_desc:0 "Nous devons réduire le nombre de soldats le long des frontières et dans toute l'Europe centrale. Nous devons réduire la présence militaire pour apaiser davantage la guerre froide !"
 ENG_Detante:0 "Entamer la détente"
 ENG_Detante_desc:0 "Une vague de froid s'est abattue sur l'Europe. Détente. Nous devons en tirer parti et apporter un peu de fraîcheur au monde."
 ENG_TakeEasy:0 "Du calme..."
 ENG_TakeEasy_desc:0 "Le monde se refroidit, pas de quoi s'inquiéter, détendons-nous"
 ENG_Heating:0 "Commencer le chauffage"
 ENG_Heating_desc:0 "Même si une guerre froide est, disons, froide, et qu'on ne veut certainement pas qu'elle s'envenime, un peu plus d'action entre les grandes puissances pourrait donner lieu à de belles choses"
 ENG_Incident:0 "Créer un incident"
 ENG_Incident_desc:0 "Le réchauffement climatique que nous avons provoqué nous a été très profitable, en fait… On pourrait peut-être provoquer un incident ?"
 ENG_Preserve:0 "Préserver l'Empire"
 ENG_Preserve_desc:0 "Le poids qui pèse sur notre empire est source de tensions ; alors que nombreux sont ceux qui réclament son abandon, nous devons le préserver, ainsi que nos joyaux de la couronne"
 ENG_Troubles:0 "Problèmes à l'étranger"
 ENG_Troubles_desc:0 "Des troubles éclatent partout outre-mer, de la zone du canal aux colonies subsahariennes. La crise, voilà le chemin que suit la Grande-Bretagne."
 ENG_SecureSuez:0 "Assurer la sécurité du canal de Suez"
 ENG_SecureSuez_desc:0 "Nous devons garantir la sécurité de notre zone du canal de Suez. Par tous les moyens nécessaires, y compris au Soudan."
 ENG_EndEgypt:0 "Fin de l'Égypte"
 ENG_EndEgypt_desc:0 "L'État égyptien a été, en tout cas, une expérience intéressante. Mais l'Égypte menace la paix, et la prise de la zone du canal qu'elle a effectuée a montré qu'elle est trop imprévisible pour qu'on la laisse agir à sa guise."
 ENG_CntrlAfrica:0 "Contrôler l'Afrique"
 ENG_CntrlAfrica_desc:0 "Les troubles s'étendent en Afrique ; nous devons prendre des mesures pour y remédier."
 ENG_BNW:0 "Le Meilleur des mondes"
 ENG_BNW_desc:0 "C'est un monde nouveau qui s'ouvre à nous. Nous devons accueillir à bras ouverts les nouvelles institutions qui ont vu le jour avec la chute du Reich hitlérien."
 ENG_UN:0 "Nations Unies"
 ENG_UN_desc:0 "Les Nations Unies ont été fondées par notre pays, le Canada, les États-Unis et bien d'autres nations. Nous devons contribuer à renforcer la légitimité de cette institution fondamentale."
 ENG_OverseasCrisis:0 "Crise à l'étranger"
 ENG_OverseasCrisis_desc:0 "Les crises à l'étranger s'intensifient, nos colonies sont en pleine agitation, nous devons agir avant que cela ne déclenche une nouvelle révolution."
 ENG_OldCrown:0 "L'Ancienne Couronne"
 ENG_OldCrown_desc:0 "Bien que l'Inde et le Pakistan aient accédé à l'indépendance, ils semblent se détester ; nous devons prendre notre temps et consolider notre position à l'Est. Le Pakistan fait preuve de puissance grâce à l'industrialisation que nous lui avons apportée, tandis que l'Inde dispose d'un potentiel en main-d'œuvre."
 ENG_FrndIndia:0 "Se lier d'amitié avec l'Inde"
 ENG_FrndIndia_desc:0 "Même si nous n'avons jamais été en position de force, l'Inde semble être le bon choix dans ce jeu entre l'hindouisme et l'islam"
 ENG_FrndPakistan:0 "Se lier d'amitié avec le Pakistan"
 ENG_FrndPakistan_desc:0 "Le Pakistan était notre allié privilégié à l'époque où nous dirigions l'Empire britannique ; nous devons perpétuer cet héritage et continuer à lui accorder la préférence dans la région"
 ENG_Consolidate:0 "Renforcer les relations"
 ENG_Consolidate_desc:0 "Nous devons renforcer nos relations partout ; ce choix, qui a été soumis à nos ministres, n'a pas été facile, mais mieux vaut qu'il ait été pris maintenant plutôt que plus tard."
 ENG_Security:0 "Conseil de sécurité"
 ENG_Security_desc:0 "Le Conseil de sécurité des Nations unies offre un formidable potentiel en tant que pilier de la puissance britannique. Nous sommes l'un des cinq membres permanents."
 ENG_RedSun:0 "Le soleil rouge se lève"
 ENG_RedSun_desc:0 "La Grande Dépression, les guerres mondiales, tout cela est si proche, notre empire est en ruines. La révolution a atteint la Grande-Bretagne. Cette voie. Sera peut-être notre dernière."
 ENG_Internationalism:0 "Internationalisme"
 ENG_Internationalism_desc:0 "Trotsky avait vu juste. Nous devons être la première nation à adopter véritablement l'internationalisme !"
 ENG_DecoloniseComittee:0 "Comité de la décolonisation"
 ENG_DecoloniseComittee_desc:0 "Nous devons accepter les décisions de la Commission de la décolonisation et en faire partie intégrante. L'époque de l'Empire britannique est révolue."
 ENG_OneCountry:0 "Un seul pays"
 ENG_OneCountry_desc:0 "Staline a raison : il faut prendre soin de notre pays, nous unir et le diriger, afin d'éviter la prolifération d'États indisciplinés qui s'opposeraient à nous."
 ENG_EndRoyalFamily:0 "Supprimer la famille royale"
 ENG_EndRoyalFamily_desc:0 "La famille royale représente une menace immédiate pour notre révolution. Elle est le bastion des riches et des crapules."
 ENG_CutTies:0 "Rompre les liens"
 ENG_CutTies_desc:0 "Soit nos relations se faneront d'elles-mêmes, soit nous y mettrons fin. Romprons nos relations avec les démocraties indésirables."
 ENG_OwnAlliance:0 "Notre propre alliance"
 ENG_OwnAlliance_desc:0 "Nous avons besoin de notre propre pacte, plutôt que de nous plier au rêve de Varsovie de Staline. Vive le Pacte de Liverpool !"
 ENG_WarsawPact:0 "Rejoindre le Pacte de Varsovie"
 ENG_WarsawPact_desc:0 "On serait bien bêtes de créer notre propre alliance ; on voit une menace immédiate de la part des États-Unis et des capitalistes européens. Peut-être que Staline nous acceptera ?"
 ENG_Prepareforinvasion:0 "Se préparer à l'invasion"
 ENG_Prepareforinvasion_desc:0 "Nous devons préparer les côtes de la Grande-Bretagne à l'arrivée des États-Unis, de la Norvège, de la France, du Danemark ou même des Pays-Bas ; nous devons nous tenir prêts à faire face à leurs attaques !"
 ENG_ArmWelsh:0 "Armer les Gallois"
 ENG_ArmWelsh_desc:0 "Nous devons armer les Gallois si nous voulons nous préparer à leur invasion"
 ENG_RAF:0 "La Royal Air Force"
 ENG_RAF_desc:0 "La Royal Air Force est une puissance en Europe ; non seulement elle a connu de nombreux succès, mais elle compte également parmi les plus grandes forces aériennes encore en activité. Nous devons conserver cette position si nous voulons rester influents."
 ENG_DfndFalklands:0 "Défendre les Malouines"
 ENG_DfndFalklands_desc:0 "Nous devons renforcer la défense des Malouines, car les déclarations de la junte sont devenues très agressives ces derniers temps ; la défense de nos dernières colonies doit être une priorité"
 ENG_BowEgypt:0 "Salut à l'Égypte"
 ENG_BowEgypt_desc:0 "C'est peut-être embarrassant, mais pour préserver la paix, nous devons nous plier aux exigences des Égyptiens, afin de montrer que nous sommes attachés à la démocratie"
 ENG_EncourageStatute:0 "Promouvoir la loi"
 ENG_EncourageStatute_desc:0 "La première étape pour mettre fin au joug de notre empire consistera à encourager le recours au Statut de Westminster et à annoncer la fin de la domination britannique sur nos dominions"
 ENG_DemEnternal:0 "La démocratie éternelle"
 ENG_DemEnternal_desc:0 "La démocratie a traversé toutes les épreuves ; notre démocratie a été la première d'une longue série de démocraties pures, et les États-Unis ont démontré que nous sommes tous dans le même bateau."
 ENG_Invest:0 "Investissements multinationaux"
 ENG_Invest_desc:0 "Nous devons mettre à profit notre nouvelle influence pour investir dans les démocraties, non seulement afin de les aider à résister à la pression que les Soviétiques vont exercer, mais aussi pour étendre nos propres marchés et notre influence."
 ENG_Queen:0 "God Save the Queen"
 ENG_Queen_desc:0 "La reine Élisabeth II Alexandra Mary, reine du Royaume-Uni de Grande-Bretagne et d'Irlande du Nord, a reçu une solide formation sur la Constitution et la démocratie britanniques, et devrait défendre nos libertés."
 ENG_ExpndBurmingham:0 "Développer Birmingham"
 ENG_ExpndBurmingham_desc:0 "Développer l'industrie de Birmingham afin de faire de la place pour des usines d'armement et de munitions."
 ENG_ArmScot:0 "Armer les Écossais"
 ENG_ArmScot_desc:0 "Nous devrions stocker davantage de munitions en Écosse afin que, si la guerre venait à frapper à nouveau ces belles îles, nous puissions armer ces vaillants combattants pour qu'ils puissent tout affronter."
 ENG_Prolitariat:0 "Vive le prolétariat !"
 ENG_Prolitariat_desc:0 "La révolution ayant triomphé, le prolétariat est victorieux et le peuple gouverne désormais les îles ! Vive la révolution !"
 ENG_Referendum:0 "Organiser un référendum"
 ENG_Referendum_desc:0 "Même si les Malouines font l'objet d'une revendication de la part des Argentins, organiser un référendum pour prouver qu'il s'agit de notre territoire légitime pourrait s'avérer judicieux ; et si cela échoue, qu'elles rejoignent les territoires qui ont quitté notre empire."
 ENG_Decolonise:0 "Poursuite de la décolonisation"
 ENG_Decolonise_desc:0 "Nous devons clarifier nos relations avec certaines des nations les plus récentes issues de nos efforts de décolonisation"
 ENG_deafrica:0 "L'Afrique"
 ENG_deafrica_desc:0 "Nos relations avec les Africains seront sans doute les plus difficiles à clarifier ; ne devrions-nous pas laisser un peu de temps au ministère des Affaires étrangères pour y mettre de l'ordre ?"
 ENG_decarib:0 "Les Caraïbes"
 ENG_decarib_desc:0 "De nombreuses nations sont issues des Antilles britanniques, et bien qu'elles soient amicales, il ne serait pas inutile de clarifier nos relations avec chacune d'entre elles."
 ENG_FalklandsBritish:0 "Les Malouines sont britanniques !"
 ENG_FalklandsBritish_desc:0 "Les Malouines sont britanniques, du moins c'est ce qu'ont déclaré leurs habitants lorsque notre référendum a abouti."
 SOV_communist_austria:0 "Libérer la République démocratique d'Autriche"
 ENG_60s_Macmilian_holds_office:0 "Harold Macmillan est au pouvoir"
 ENG_60s_Macmilian_holds_office_desc:0 "Harold Macmillan est notre dirigeant actuel."
 ENG_60s_Prime_MinisteR_Harold_Wilson:0 "Le Premier ministre Harold Wilson"
 ENG_60s_Prime_MinisteR_Harold_Wilson_desc:0 "Harold Wilson est notre Premier ministre."
 ENG_60s_Socialist_republic:0 "République socialiste"
 ENG_60s_Socialist_republic_desc:0 "Avec le nouveau gouvernement communiste, nous pourrons instaurer une république socialiste."
 ENG_60s_British_economy:0 "Économie britannique"
 ENG_60s_British_economy_desc:0 "Nous devons faire le point sur notre économie."
 ENG_60s_Royal_Military:0 "Armée royale"
 ENG_60s_Royal_Military_desc:0 "L'armée britannique a prouvé à maintes reprises qu'elle était capable de faire face à toutes sortes de menaces. Pour nous assurer qu'elle puisse continuer à le faire à l'avenir, nous devrions envisager de la moderniser."
 ENG_60s_Foreign_policy:0 "Politique étrangère"
 ENG_60s_embrace_non_aligned_movement:0 "Adhérez au Mouvement des pays non alignés"
 ENG_60s_british_isolationism:0 "L'isolationnisme britannique"
 ENG_60s_Foreign_policy_desc:0 "Quelle politique étrangère allons-nous mener ?"
 ENG_60s_Consolidate_our_position_in_Europe:0 "Consolider notre position en Europe"
 ENG_60s_Consolidate_our_position_in_Europe_desc:0 "Nous ne pouvons pas nous isoler de nos voisins. Nous devons au contraire concentrer nos efforts sur le renforcement de notre position dans cette région."
 ENG_60s_Increase_our_presence_in_Vietnam:0 "Envoyer des conseillers au Vietnam"
 ENG_60s_Increase_our_presence_in_Vietnam_desc:0 ""
 ENG_60s_The_Entriest_Threat:0 "La menace la plus grave"
 ENG_60s_The_Entriest_Threat_desc:0 "La grande nation britannique est menacée par les trotskistes. Que comptons-nous faire à ce sujet ?"
 ENG_60s_Heath_Ministry:0 "Le ministère de la Santé"
 ENG_60s_Heath_Ministry_desc:0 ""
 ENG_60s_Wind_of_change:0 "Un vent de changement"
 ENG_60s_Wind_of_change_desc:0 "Le discours intitulé « Le vent du changement » est un allocution historique prononcée par le Premier ministre britannique Harold Macmillan devant le Parlement sud-africain, qui indiquait clairement que le gouvernement britannique, dirigé par les conservateurs, n'avait pas l'intention de s'opposer à l'indépendance d'un grand nombre de ces territoires."
 ENG_60s_Stay_on_path_of_decolonisation:0 "Poursuivre la décolonisation"
 ENG_60s_Stay_on_path_of_decolonisation_desc:0 "Comme nous l'avons promis, nous poursuivrons la décolonisation."
 ENG_60s_Nigerian_independence:0 "Améliorer les relations avec le Nigeria"
 ENG_60s_Nigerian_independence_desc:0 ""
 ENG_60s_Condemn_South_Africa:0 "Condamner l'Afrique du Sud"
 ENG_60s_Condemn_South_Africa_desc:0 "Même si l'Afrique du Sud était autrefois notre protégée, nous ne pouvons plus tolérer ses opinions racistes. Il est temps de lui adresser une note diplomatique."
 ENG_60s_Kenyan_independence_referendum:0 "Référendum sur l'indépendance du Kenya"
 ENG_60s_Kenyan_independence_referendum_desc:0 "Le Kenya devrait être autorisé à organiser un référendum sur l'indépendance."
 ENG_60s_Condemn_Rhodesia:0 "Condamner la Rhodésie"
 ENG_60s_Condemn_Rhodesia_desc:0 "La Rhodésie sous Smith n'est pas ce que nous voulions."
