 ALG_fighter_equipment_0:0 "Al Quwwat aljawwiya aljaza'eriiya"
 ALG_fighter_equipment_0_short:0 "Les FAA"
 ALG_fighter_equipment_0_desc:0 "Les Forces aériennes algériennes (FAA) (Al Quwwat aljawwiya aljaza'eriiya en arabe ou; Forces Aériennes Algériennes en français) est la branche aérienne de l'Armée nationale populaire algérienne. L'Armée de l'Air algérienne a été créée pour soutenir la lutte de l'Armée nationale populaire contre les forces d'occupation françaises. Cela faisait partie des décisions du congrès de la Soummam tenu le 20 août 1956, qui recommandait un plan à long terme pour former une armée moderne."
 ALG_jet_multirole_equipment_2:0 "Mikoyan-Gourevitch MiG-15"
 ALG_jet_multirole_equipment_2_desc:0 "Le Mikoyan-Gourevitch MiG-15 Fagot, sans doute l'un des chasseurs les plus emblématiques de la Guerre froide, entra en service en 1947. Dès son introduction en service lors de la guerre de Corée, il participa à de nombreux conflits, où il se révéla un adversaire redoutable pour les F-86 Sabre et F9F Panther américains. Une portion de la frontière sino-coréenne fut surnommée « l'allée des MiG » en raison de leur présence massive dans la région. Plus de 18 000 MiG-15 furent construits et utilisés par de nombreuses nations, notamment l'URSS et les pays du bloc de l'Est. Si la plupart des appareils furent retirés du service dans les années 1950, certains sont encore en service au sein de l'armée de l'air nord-coréenne."
 ALG_jet_multirole_equipment_2_short:0 "MiG-15"
 ALG_jet_multirole_equipment_3:0 "Mikoyan-Gurevich MiG-17"
 ALG_jet_multirole_equipment_3_desc:0 "Successeur direct du MiG-15 Fagot, le MiG-17 Fresco fut produit à plus de 10 000 exemplaires à partir de 1952. Construit sous licence par l'Armée de l'air chinoise (PLAAF) sous la désignation Shenyang J-5, il fut utilisé par une vingtaine de nations en Afrique, en Europe et en Asie. Son baptême du feu eut lieu en 1958, lors d'affrontements entre des MiG chinois et des F-86 Sabre nationalistes chinois au-dessus du détroit de Taïwan. Cependant, le MiG-17 fut principalement engagé pendant la guerre du Vietnam par l'Armée de l'air nord-coréenne (NVAF) et l'Armée de l'air chinoise (PLAAF), où il remporta 28 victoires aériennes. Son succès fut tel qu'il tint tête aux chasseurs supersoniques américains Phantom II, bien plus modernes, durant ce même conflit. Le MiG-17 fut généralement retiré du service dans les années 1970, mais il demeure en service, de manière limitée, dans certains pays africains et en Corée du Nord."
 ALG_jet_multirole_equipment_3_short:0 "MiG-17"
 ALG_jet_multirole_equipment_4:0 "Mikoyan-Gurevich MiG-17F"
 ALG_jet_multirole_equipment_4_short:0 "MiG-17F"
 ALG_jet_multirole_equipment_5:0 "Mikoyan-Gurevich MiG-21F-13"
 ALG_jet_multirole_equipment_5_desc:0 "Le MiG-21 Fishbed est considéré comme l'un des premiers chasseurs soviétiques de troisième génération, intégrant des missiles à longue portée et un radar à impulsions. Le MiG-21 est l'avion à réaction supersonique le plus produit de l'histoire, notamment en Chine et en Inde où un grand nombre d'exemplaires ont été construits sous licence. Plus de 11 000 exemplaires ont été construits et utilisés dans plus de 60 pays sur les 5 continents. Au cours de sa carrière, le MiG-21 a abattu 240 avions ennemis. Il a participé à de nombreux conflits, dont la guerre du Vietnam (où il a connu un succès retentissant), la guerre indo-pakistanaise de 1971, la guerre Iran-Irak et de nombreux conflits de moindre envergure. Il est toujours en service après plus de six décennies."
 ALG_jet_multirole_equipment_5_short:0 "MiG-21F-13"
 ALG_jet_multirole_equipment_6:0 "Mikoyan-Gurevich MiG-21MF"
 ALG_jet_multirole_equipment_6_desc:0 "Version de série de l'intercepteur tous temps. Ces appareils étaient propulsés par le turboréacteur R11F2-300 et, à partir du septième lot de production, équipés du radar RP-21 (les six premiers lots utilisaient l'ancien radar TsD-30T, également appelé RP-9-21). De plus, le système de contrôle des armements a été modifié par rapport à celui du F-13 afin de permettre l'utilisation du missile air-air à guidage infrarouge RS-2US (également appelé K-5MS), en plus du missile K-13."
 ALG_jet_multirole_equipment_6_short:0 "MiG-21MF"
 ALG_jet_multirole_equipment_7:0 "Mikoyan-Gurevich MiG-21bis"
 ALG_jet_multirole_equipment_7_short:0 "MiG-21bis"
 ALG_jet_multirole_equipment_7_desc:0 "Ultime évolution du MiG-21, équipé du turboréacteur Tumanskiy R25-300 et de nombreuses autres améliorations par rapport aux versions précédentes. Les MiG-21bis destinés à la Défense aérienne soviétique étaient dotés du système de guidage au sol Lazur, tandis que ceux destinés à l'Armée de l'air soviétique étaient équipés du système de guidage au sol Polyot."
 ALG_jet_multirole_equipment_8:0 "Mikoyan-Gurevich MiG-23ML"
 ALG_jet_multirole_equipment_8_desc:0 "Les premières versions du « Flogger » présentaient plusieurs défauts de conception, notamment au niveau de la robustesse et de la fiabilité de la cellule, des performances du moteur, de la maniabilité et des performances radar. Une refonte importante de la cellule a été entreprise, donnant naissance au MiG-23ML."
 ALG_jet_multirole_equipment_8_short:0 "MiG-23ML"
 ALG_jet_multirole_equipment_9:0 "Mikoyan-Gurevich MiG-23MLD"
 ALG_jet_multirole_equipment_9_desc:0 "Le MiG-23MLD était la version de chasse ultime du MiG-23. L'objectif principal de cette modernisation était d'améliorer la maniabilité, notamment à incidence élevée, principal défaut du MiG-23M/ML. La perche de Pitot était équipée de générateurs de vortex, et les bords d'attaque échancrés des ailes étaient dentelés pour également servir de générateurs de vortex. Le système de commandes de vol intégrait le limiteur de course/de signaux SOS-3-4."
 ALG_jet_multirole_equipment_9_short:0 "MiG-23MLD"
 ALG_jet_multirole_equipment_10:0 "Mikoyan-Gurevich MiG-29A"
 ALG_jet_multirole_equipment_10_desc:0 "Le MiG-29 Fulcrum A fut initialement développé par le bureau d'études Mikoyan. Premier chasseur de quatrième génération à entrer en service en URSS et dans les pays du bloc de l'Est, il intégrait une avionique améliorée et des capacités radar considérablement accrues. Les premiers MiG-29 furent utilisés comme avions d'entraînement par les pays du Pacte de Varsovie, avec quelques exportations vers l'Inde, mais leur utilisation au combat resta limitée. Le MiG-29 servit par la suite de base à des variantes produites en grande série, telles que le MiG-29S, le MiG-29M et le MiG-35."
 ALG_jet_multirole_equipment_10_short:0 "MiG-29A"
 ALG_mr_stealth_fighter_equipment_1:0 "Mikoyan MiG-29S"
 ALG_mr_stealth_fighter_equipment_1_short:0 "MiG-29S"
 ALG_mr_stealth_fighter_equipment_1_desc:0 "Le MiG-29S, désigné par le code OTAN « Fulcrum-C », bénéficie d'améliorations de son système de commandes de vol : quatre nouveaux calculateurs assurent une meilleure stabilité et une maniabilité accrue, avec un angle d'attaque augmenté de 2°. Un système de commandes de vol mécano-hydrauliques amélioré permet une plus grande amplitude de débattement des gouvernes."
 ALG_jet_interceptor_equipment_3:0 "Mikoyan-Gurevich MiG-17PF"
 ALG_jet_interceptor_equipment_3_desc:0 "Version chasseur-intercepteur tous temps équipée d'un radar Izumrud, de 3 canons NR-23 de 23 mm et d'un moteur VK-1F"
 ALG_jet_interceptor_equipment_3_short:0 "MiG-17PF"
 ALG_jet_interceptor_equipment_7:0 "Mikoyan-Gurevich MiG-25P"
 ALG_jet_interceptor_equipment_7_desc:0 "Le Mikoyan-Gourevitch MiG-25 Foxbat est sans doute l'un des avions soviétiques les plus influents de l'histoire. Le premier prototype du MiG-25 effectua son vol inaugural début 1964 et entra officiellement en service en 1970. Au cours de sa production, plus de 1 150 appareils furent construits et vendus à de nombreux pays, dont la Syrie, l'Irak et l'Inde. Cet avion fut conçu pour intercepter rapidement et à une vitesse fulgurante des appareils volant à très haute altitude, tels que le U-2 et le B-58. Il offrit à l'Union soviétique un contrôle sans précédent sur son espace aérien, même en zones reculées. Il est encore en service, de manière limitée, au sein des forces aériennes russes."
 ALG_jet_interceptor_equipment_7_short:0 "MiG-25P"
 ALG_jet_interceptor_equipment_8:0 "Mikoyan-Gurevich MiG-25PD"
 ALG_jet_interceptor_equipment_8_desc:0 "Le Mikoyan-Gourevitch MiG-25 Foxbat est sans doute l'un des avions soviétiques les plus influents de l'histoire. Le premier prototype du MiG-25 effectua son vol inaugural début 1964 et entra officiellement en service en 1970. Au cours de sa production, plus de 1 150 appareils furent construits et vendus à de nombreux pays, dont la Syrie, l'Irak et l'Inde. Cet avion fut conçu pour intercepter rapidement et à une vitesse fulgurante des appareils volant à très haute altitude, tels que le U-2 et le B-58. Il offrit à l'Union soviétique un contrôle sans précédent sur son espace aérien, même en zones reculées. Il est encore en service, de manière limitée, au sein des forces aériennes russes."
 ALG_jet_interceptor_equipment_8_short:0 "MiG-25PD"
 ALG_jet_CAS_equipment_2:0 "Mikoyan-Guerevich MiG-17bis"
 ALG_jet_CAS_equipment_2_short:0 "MiG-17bis"
 ALG_jet_CAS_equipment_2_desc:0 "Conversion d'un chasseur-bombardier, équipé pour transporter des roquettes et des bombes non guidées."
 ALG_jet_CAS_equipment_4:0 "Sukhoi Su-7B"
 ALG_jet_CAS_equipment_4_short:0 "Su-7B"
 ALG_jet_CAS_equipment_4_desc:0 "La version bombardier du Su-7 Fitter-A effectua son premier vol en mars 1959 et entra en service en 1961. Elle devint le principal avion d'attaque au sol soviétique des années 1960. De 1957 à 1972, plus de 1 400 Su-7B furent construits, dont un grand nombre furent exportés. L'appareil connut une relative popularité à l'étranger, étant utilisé par dix pays. Il fut notamment largement employé par les forces aériennes indiennes et égyptiennes. Il est toujours en service, de façon limitée, en Corée du Nord."
 ALG_jet_CAS_equipment_5:0 "Sukhoi Su-7BKL"
 ALG_jet_CAS_equipment_5_short:0 "Su-7BKL"
 ALG_jet_CAS_equipment_5_desc:0 "Moteur AL-7F-1 amélioré, système de carburant amélioré avec tuyauterie externe de chaque côté de l'arête dorsale du fuselage, réservoirs de carburant installés dans les ailes, points d'emport sous les ailes « humides » pour transporter des réservoirs de carburant externes, capable de transporter des bombes nucléaires tactiques."
 ALG_jet_CAS_equipment_6:0 "Sukhoi Su-7BMK"
 ALG_jet_CAS_equipment_6_short:0 "Su-7BMK"
 ALG_jet_CAS_equipment_7:0 "Mikoyan-Gurevich MiG-23BN"
 ALG_jet_CAS_equipment_7_desc:0 "(« Flogger-H ») Version améliorée du MiG-23B, le MiG-23BN se distinguait par ses ailes de troisième génération et son moteur R-29, caractéristiques des chasseurs contemporains, ainsi que par des améliorations mineures au niveau de l'électronique et des équipements. L'autre différence majeure résidait dans la suppression de la tête diélectrique présente sur le MiG-23B. Produit de 1973 à 1985, 624 MiG-23BN furent construits, mais seul un petit nombre servit au sein des forces aériennes vietnamiennes, le reste étant exporté."
 ALG_jet_CAS_equipment_7_short:0 "MiG-23BN"
 ALG_jet_light_equipment_2:0 "Mikoyan-Gurevich MiG-15UTI"
 ALG_jet_light_equipment_2_short:0 "MiG-15UTI"
 ALG_jet_light_equipment_2_desc:0 "Le 6 avril 1949, l'équipe OKB-155 fut officiellement chargée du développement d'une version d'entraînement du chasseur MiG-15. Le prototype du MiG-15UTI fut construit par l'usine n° 1 entre mars et mai 1949. Le poste de l'instructeur fut aménagé sur le MiG-15UTI en supprimant le premier réservoir de carburant du fuselage. Les deux cabines pressurisées étaient équipées de sièges éjectables et de lanternes largables pyromécaniquement. L'équipement spécial de l'appareil comprenait un viseur automatique ASP-1N, une station radio émettrice-réceptrice RSI-6K, un radiocompas RPKO-10M avec un indicateur RPKO-10M, un interphone SPU-2M, un dispositif à oxygène KP-14 et une caméra AFA-IM. L'armement se composait d'un canon NR-23 de 23 mm avec 80 cartouches et d'une mitrailleuse UBK-E avec 150 cartouches."
 ALG_jet_light_equipment_4:0 "Aero L-39 Albatros"
 ALG_jet_light_equipment_4_short:0 "L-39 Albatros"
 ALG_jet_light_equipment_4_desc:0 "L'Aero L-39 Albatros est un avion d'entraînement à réaction haute performance développé en Tchécoslovaquie par Aero Vodochody. Conçu dans les années 1960 pour remplacer l'Aero L-29 Delfín comme avion d'entraînement principal, il fut le premier avion d'entraînement équipé d'un turboréacteur à double flux. Cet appareil fut exporté vers de nombreux pays comme avion d'entraînement militaire."
 ALG_jet_light_equipment_5:0 "Aero L-39ZA Albatros"
 ALG_jet_light_equipment_5_short:0 "L-39ZA Albatros"
 ALG_jet_light_equipment_5_desc:0 "L-39 considérablement amélioré pour l'entraînement armé et l'attaque légère, utilisant un train d'atterrissage plus robuste, une charge utile plus élevée et notamment un système pour un canon bitube GSh-23L de 23 millimètres fixé dans une nacelle conforme sous le compartiment des pilotes, ayant un magasin de 150 cartouches dans la cellule."
 ALG_jet_recon_equipment_0:0 "Mikoyan-Gurevich MiG-15Rbis"
 ALG_jet_recon_equipment_0_short:0 "MiG-15Rbis"
 ALG_jet_recon_equipment_0_desc:0 "Le 25 avril 1950, le bureau d'études MiG (OKB MiG) entamait le développement d'une version de reconnaissance de première ligne du MiG-15 équipée d'une caméra AFA-BA/40. Cette caméra permettait une couverture radar de 0,9 à 4,5 km de large et une portée photographique de 90 à 450 km, à des altitudes comprises entre 2 000 et 10 000 m. L'appareil était initialement armé d'un seul canon NR-23. Afin d'accroître son rayon d'action, des verrous D4-50 furent installés ultérieurement sur les longerons, permettant ainsi la suspension sous les ailes de réservoirs de carburant de 600 litres de forme optimisée. De plus, un transpondeur « Barium-M » et une bouteille d'oxygène supplémentaire de 2 litres furent installés."
 ALG_jet_recon_equipment_1:0 "Mikoyan-Gurevich MiG-25RB"
 ALG_jet_recon_equipment_1_short:0 "MiG-25RB"
 ALG_jet_recon_equipment_1_desc:0 "Le MiG-25RB est un avion de reconnaissance opérationnel monoplace toutes altitudes, de type bombardier. Les essais se sont achevés en décembre 1970. L'appareil était équipé de deux à quatre caméras de reconnaissance générale A-70M et d'une caméra topographique AFA-E/10. L'équipement photographique était logé dans cinq compartiments situés sous le fuselage avant. Une station SIGINT, appelée SPS-4A ou B « Virage », était également installée et fonctionnait sur différentes bandes de fréquences. Équipement spécial : station de brouillage radio active SPS-141."
 ALG_jet_recon_equipment_2:0 "Sukhoi Su-24MR"
 ALG_jet_recon_equipment_2_short:0 "Su-24MR"
 ALG_jet_recon_equipment_2_desc:0 "Variante de reconnaissance tactique dédiée. Le Su-24MR conserve une grande partie du système de navigation du Su-24M, notamment le radar de suivi de terrain, mais abandonne le radar d'attaque Orion-A, le système laser/TV et le canon au profit de deux caméras panoramiques, d'une caméra TV « Aist-M » (« Cigogne »), d'un radar aéroporté à visée latérale (SLAR) RDS-BO « Shtik » (« Baïonnette ») et d'un système de reconnaissance infrarouge « Zima » (« Hiver »). Les autres capteurs sont embarqués en nacelle."
 ALG_jet_tac_bomber_equipment_5:0 "Mikoyan-Guerevich MiG-25RBT"
 ALG_jet_tac_bomber_equipment_5_short:0 "MiG-25RBS"
 ALG_jet_tac_bomber_equipment_5_desc:0 "Le MiG-25RBS est un avion de reconnaissance-bombardier monoplace dérivé du MiG-25R, doté de systèmes de reconnaissance améliorés et d'un système de bombardement automatique Peleng. Il peut emporter une charge de huit bombes de 500 kg."
 ALG_jet_tac_bomber_equipment_6:0 "Sukhoi Su-24"
 ALG_jet_tac_bomber_equipment_6_short:0 "Su-24"
 ALG_jet_tac_bomber_equipment_6_desc:0 "Le Su-34 est un gros chasseur-bombardier développé par l'Union soviétique dans les années 1960 et toujours en service. Il se caractérise par ses ailes à géométrie variable et son fuselage profilé. Capable d'emporter jusqu'à 8 000 kg d'armement, il peut lancer différents types de missiles air-sol tout en maintenant une vitesse stable. Cet appareil est connu sous le nom de code OTAN « Fencer ». Avec son successeur, le Su-34, il est actuellement utilisé comme chasseur-bombardier par les anciens pays du bloc de l'Est."
 ALG_jet_tac_bomber_equipment_7:0 "Sukhoi Su-24M"
 ALG_jet_tac_bomber_equipment_7_short:0 "Su-24M"
 ALG_jet_tac_bomber_equipment_7_desc:0 "Entré en service en 1983, le Su-24M constituait une évolution du Su-24 dès sa mise en service. Parmi ses principales caractéristiques figuraient le ravitaillement en vol grâce à une perche rétractable, un nouveau système de navigation interne et le désignateur laser Kaira-24, lui permettant d'utiliser des bombes à guidage de précision. Il est connu en Occident sous le nom de Fencer-D."
 ALG_jet_tac_bomber_equipment_8:0 "Sukhoi Su-24MK"
 ALG_jet_tac_bomber_equipment_8_short:0 "Su-24MK"
 ALG_jet_tac_bomber_equipment_8_desc:0 "Entré en service en 1983, le Su-24M constituait une évolution du Su-24 dès sa mise en service. Parmi ses principales caractéristiques figuraient le ravitaillement en vol grâce à une perche rétractable, un nouveau système de navigation interne et le désignateur laser Kaira-24, lui permettant d'utiliser des bombes à guidage de précision. Il est connu en Occident sous le nom de Fencer-D."
