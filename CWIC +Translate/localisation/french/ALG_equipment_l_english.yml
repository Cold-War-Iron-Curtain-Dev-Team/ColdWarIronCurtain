l_english:
 ALG_infantry_equipment_0:0 "MAS-36"
 ALG_infantry_equipment_0_short:0 "MAS-36"
 ALG_infantry_equipment_0_desc:0 "Le MAS-36 est un fusil à verrou conçu en 1927 et chambré en cartouche 7,5×54mm française. Adopté par l'armée française en 1936 pour remplacer les fusils de service Berthier et Lebel, il fut utilisé en nombre limité pendant la Seconde Guerre mondiale. Toutefois, sa production massive après la guerre lui permit de servir dans de nombreux conflits et d’être employé par divers pays. Les modèles produits après la guerre bénéficièrent de quelques améliorations ergonomiques, et certaines variantes furent développées, notamment avec l’ajout d’un lance-grenades amovible ou d’une version de précision. Conçu initialement comme un fusil de transition, il fut fabriqué sur des machines prévues pour produire les futurs fusils semi-automatiques."
 ALG_infantry_equipment_1:0 "Avtomat Kalashnikova 1947"
 ALG_infantry_equipment_1_short:0 "AK-47"
 ALG_infantry_equipment_1_desc:0 "L’AK-47 est un fusil d’assaut entièrement automatique développé en Union soviétique par Mikhaïl Kalachnikov en 1947. Il ne fut toutefois introduit en service actif qu’en 1948, avec la mise en production de la version à crosse fixe. Début 1949, l’AK-47 fut adopté par les forces armées soviétiques pour un déploiement massif dans les unités de première ligne. Doté d’un piston à gaz à long débattement, d’un sélecteur de tir, d’un mécanisme de détente automatisé et d’une chambre repensée, l’AK-47 constituait une nette amélioration par rapport au SKS. Pendant des décennies, il fut considéré comme l’une des armes les plus fiables, faciles à entretenir, à manipuler et à apprendre à utiliser au monde."
 ALG_infantry_equipment_2:0 "Avtomat Kalashnikova Modernizirovanniy"
 ALG_infantry_equipment_2_short:0 "AKM"
 ALG_infantry_equipment_2_desc:0 "L’AKM est une version modernisée de l’AK-47, développée par Mikhaïl Kalachnikov à la fin des années 1950 et mise en service dans l’Armée soviétique en 1959. L’arme fut largement optimisée et repensée pour répondre aux besoins d’une armée en pleine modernisation. De nombreuses pièces furent simplifiées pour une production de masse, et le boîtier de culasse en acier usiné fut remplacé par une tôle d’acier emboutie en forme de U, augmentant considérablement les cadences de fabrication. Grâce à ces modifications, l’AKM devint également bien plus léger, son poids étant réduit d’environ 30%. L’arme fut aussi renforcée pour gagner en solidité et intégra des rails de guidage améliorant le mouvement du bloc culasse. L’AKM fut immédiatement adopté par de nombreux pays communistes et produit en masse pour divers conflits tout au long de sa durée de vie, notamment lors de l’invasion de la Tchécoslovaquie, où il fut utilisé par les deux camps."
 ALG_infantry_equipment_3:0 "Avtomat Kalashnikova Modernizirovanniy PM 89"
 ALG_infantry_equipment_3_short:0 "PM 89"
 ALG_infantry_equipment_3_desc:0 "Variante locale du vénérable fusil AKM en service en Algérie."
 ALG_infantry_equipment_4:0 "Avtomat Kalashnikova AK-103"
 ALG_infantry_equipment_4_short:0 "AK-103"
 ALG_infantry_equipment_4_desc:0 "L’AK-103 est un fusil d’assaut conçu par l’armurier russe Mikhaïl Kalachnikov en 1994. Il s’agit d’une variante de la série AK-100 dérivée de l’AK-74M, chambrée en 7,62×39 mm M43, comme l’AKM."
 ALG_mbt_equipment_0:0 "T-34-85"
 ALG_mbt_equipment_0_short:0 "T-34-85"
 ALG_mbt_equipment_1:0 "T-34-85M"
 ALG_mbt_equipment_1_short:0 "T-34-85M"
 ALG_mbt_equipment_2:0 "T-54"
 ALG_mbt_equipment_2_short:0 "T-54"
 ALG_mbt_equipment_2_desc:0 "Le T-54 est le char de combat le plus produit de l’histoire. Conçu en 1946 par le KMBD, il est équipé d’un canon rayé de 100mm et d’un blindage variant de 205mm à 60mm. Son moteur diesel V-12 de 38,88 litres, associé à une suspension à barres de torsion, lui permet d’atteindre une vitesse de 48 km/h. Utilisé par plus de 50 armées dans le monde, il a été fabriqué dans l’ensemble du bloc soviétique et a participé à tous ses conflits."
 ALG_mbt_equipment_3:0 "T-55"
 ALG_mbt_equipment_3_short:0 "T-55"
 ALG_mbt_equipment_3_desc:0 "Le T-55 est une version améliorée du char T-54. L’OKB-520 a modifié son design en renforçant la protection NBC, en optimisant son moteur, en améliorant la forme de la tourelle et en ajoutant divers équipements auxiliaires, notamment un meilleur système de conduite de tir et des optiques améliorées. De plus, le T-55 utilisait plus fréquemment la mitrailleuse lourde DShK de 12,7 mm, alors que le T-54 était équipé d’une SGMT de 7,62mm, offrant ainsi une puissance de feu accrue au détriment de la capacité en munitions. Le T-55 a été adopté par autant d’armées que son prédécesseur et a participé aux mêmes conflits."
 ALG_mbt_equipment_4:0 "T-62"
 ALG_mbt_equipment_4_short:0 "T-62"
 ALG_mbt_equipment_4_desc:0 "Le T-62 est une évolution du char T-55. Il est équipé d’un canon à âme lisse de 115mm et d’un blindage légèrement plus épais. Conçu par le bureau d’études OKB-520 et finalisé vers 1960, il a été commandé par l’Union soviétique pour accroître sa puissance de feu. Bien qu’il représente une amélioration, sa production n’a pas remplacé celle du T-55 en raison de son coût plus élevé. Plus de 22 700 T-62 ont été fabriqués, et ils ont été largement déployés dans l’ensemble du bloc soviétique, en particulier au Moyen-Orient. Ses performances accrues ont été démontrées lors du conflit sino-soviétique de 1969."
 ALG_mbt_equipment_5:0 "T-62M"
 ALG_mbt_equipment_5_short:0 "T-62M"
 ALG_mbt_equipment_5_desc:0 "Le T-62 est une évolution du char T-55. Il est équipé d’un canon à âme lisse de 115 mm et d’un blindage légèrement plus épais. Conçu par le bureau d’études OKB-520 et finalisé vers 1960, il a été commandé par l’Union soviétique pour accroître sa puissance de feu. Bien qu’il représente une amélioration, sa production n’a pas remplacé celle du T-55 en raison de son coût plus élevé. Plus de 22 700 T-62 ont été fabriqués, et ils ont été largement déployés dans l’ensemble du bloc soviétique, en particulier au Moyen-Orient. Ses performances accrues ont été démontrées lors du conflit sino-soviétique de 1969."
 ALG_mbt_equipment_6:0 "T-72"
 ALG_mbt_equipment_6_short:0 "T-72"
 ALG_mbt_equipment_6_desc:0 "Le T-72 est un char de combat principal soviétique conçu comme une nouvelle génération de blindés, destiné à remplacer le T-62 et son équivalent plus coûteux, le T-64. Conçu par Leonid Venediktov et finalisé en 1973, il offrait d'importantes améliorations tout en coûtant presque deux fois moins cher que le T-64. Il conserve un canon de 125mm et un blindage composite, mais dans un design optimisé pour une production plus économique. Son moteur V-12 de 780 chevaux pouvait être modernisé jusqu'à 1 130 chevaux, lui permettant d'atteindre une mobilité exceptionnelle avec des vitesses allant jusqu'à 80 km/h et une meilleure adaptation aux terrains difficiles par rapport au T-64. Contrairement à ce dernier, le T-72 a été largement utilisé dans l’ensemble du bloc soviétique et s’est illustré dans de nombreux conflits en Afrique, au Moyen-Orient et en Indochine."
