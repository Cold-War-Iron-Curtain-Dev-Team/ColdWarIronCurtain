 KOR_50s_the_war_of_625_desc: "On June 25, 1950, the Northern Communists, under the rogue leadership of Kim Il Sung, crossed the 38th parallel, igniting the Korean War of Unification. We cannot allow this rogue communist state to succeed in its ambitions. The struggle for freedom is paramount, Korea must not fall under the agenda of the Communists! We must do everything in our power to secure the independence of the Republic of Korea!"