 AI_MESSAGE_CAT1_MES1: "Bravo pour l'annexion, $OTHER$. Nous sommes tous fiers de toi."
 AI_MESSAGE_CAT1_MES2: "Ahahahah $OTHER$ est nul à ce jeu."
 AI_MESSAGE_CAT1_MES3: "Apprends à jouer, $OTHER_ADJ$ noob."
 AI_MESSAGE_CAT1_MES4: "On a bien eu $OTHER$, presque de la peine pour eux."
 AI_MESSAGE_CAT1_MES5: "Peut-être que ce jeu est trop hardcore pour toi, $OTHER$. Tu devrais essayer un jeu plus casual comme Europa Universalis."
 AI_MESSAGE_CAT1_MES6: "Je parie que $OTHER$ n'a même pas passé 2 heures à configurer son OOB. Nul !"
 AI_MESSAGE_CAT1_MES7: "Oh, regardez toutes ces terres $OTHER_ADJ$ que j'ai maintenant. Je suppose qu'ils n'en avaient pas besoin !"
 AI_MESSAGE_CAT1_MES8: "Hey $OTHER$, peut-être que tu devrais essayer de te battre la prochaine fois ? Parce que si tu l'as fait, ça ne s'est pas vu !"
 AI_MESSAGE_CAT1_MES9: "Pourquoi $OTHER$ pleure ? Parce qu'il vient de se faire écraser !"
 AI_MESSAGE_CAT1_MES10: "Ça fait du bien d'étendre mon lebensraum, n'est-ce pas, $OTHER$ ?"
 AI_MESSAGE_CAT2_MES1: "Je vais blitzer ta krieg, $OTHER$ !"
 AI_MESSAGE_CAT2_MES2: "Bientôt tout le monde à $OTHER$ parlera $US_ADJ$."
 AI_MESSAGE_CAT2_MES3: "Regarde ce $OTHER_ADJ$ noob qui essaie de battre mes troupes $US_ADJ$ supérieures. Ce serait drôle si ce n'était pas si triste !"
 AI_MESSAGE_CAT2_MES4: "Tu appelles ça une guerre, $OTHER$ ? Moi j'appelle ça une promenade de santé."
 AI_MESSAGE_CAT2_MES5: "Assure-toi de garder ces usines $OTHER_ADJ$ bien polies, je vais bientôt les utiliser !"
 AI_MESSAGE_CAT2_MES6: "Tu entends ça, $OTHER$ ? C'est le bruit de ma domination totale."
 AI_MESSAGE_CAT2_MES7: "Hey $OTHER$, peut-être que tu ne te ferais pas autant écraser si tu arrêtais de fuir et que tu essayais de te battre ?"
 AI_MESSAGE_CAT2_MES8: "LOL, regarde $COUNTRY$ essayer de me combattre ! C'est comme si quelqu'un avait mis un furet comateux à la tête d'une armée !"
 AI_MESSAGE_CAT2_MES9: "La vue est vraiment belle à $COUNTRY$ en cette saison. Mes armées en profitent bien !"
 AI_MESSAGE_CAT2_MES10: "Capitule déjà, $COUNTRY$ ! Tu me fais juste perdre mon temps."
 AI_MESSAGE_CAT3_MES1:1 "$OTHER|U$ est un tricheur ! Impossible qu'il m'ait battu honnêtement !"
 AI_MESSAGE_CAT3_MES2: "Ce jeu est tellement déséquilibré ! Les space marines $OTHER_ADJ$ sont impossibles à battre alors que les troupes $US_ADJ$ sont juste du papier mouillé."
 AI_MESSAGE_CAT3_MES3: "Heh, comme si je n'avais pas mieux à faire que de jouer à ce jeu stupide de toute façon."
 AI_MESSAGE_CAT3_MES4: "Je n'aurais pas perdu contre $OTHER$ si Paradox n'avait pas explicitement codé pour que mes alliés soient plus bêtes que deux tonnes de granit pendant que l'ennemi a une précognition littérale !"
 AI_MESSAGE_CAT3_MES5: "ffaSJLgapigjaslgmag s asv lajvlvSCREW YOU $OTHER$ JE NE JOUERAI PLUS JAMAIS AVEC TOI !!!!"
 AI_MESSAGE_CAT3_MES6: "gg $OTHER$ la prochaine fois, essaie peut-être de rendre ça équitable ?"
 AI_MESSAGE_CAT3_MES7: "Wow, cette mécanique de jeu m'a complètement ruiné. Pas étonnant que j'ai perdu contre $OTHER$."
 AI_MESSAGE_CAT3_MES8: "WOW ! PEUT-ÊTRE que si ils n'avaient pas COMPLÈTEMENT DÉSÉQUILIBRÉ $OTHER$ DANS LE DERNIER PATCH, ça aurait été une guerre équitable !"
 AI_MESSAGE_CAT3_MES9: "C'est pour ça que Hearts of Iron 3 était un meilleur jeu. Dans HOI3, $OTHER$ ne m'aurait jamais battu comme ça :/"
 AI_MESSAGE_CAT3_MES10: "Ouais, donc le RNG a complètement perdu cette guerre avec $OTHER$ pour moi. Dommage que la compétence ne signifie rien dans ce jeu."
