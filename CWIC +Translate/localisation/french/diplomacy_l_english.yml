 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_MILACC:2 "Accès militaire accordé"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_MILACC: "\nNotre demande d'accès militaire a été §Gacceptée§! par §Y$COUNTRY$§!.\n\nNous pouvons désormais déplacer des troupes dans leurs frontières."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_MILACC:2 "Accès militaire refusé"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_MILACC:1 "\n§Y$COUNTRY|U$§! a §Rrefusé§! notre demande d'accès militaire!"
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_CALL_ALLY:2 "Appel à la guerre accepté"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_CALL_ALLY:1 "\n§Y$COUNTRY|U$§! a §Gaccepté§! l'appel à rejoindre notre guerre.\n\nNous sommes ensemble."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_CALL_ALLY:2 "Refus de rejoindre notre guerre"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_CALL_ALLY:1 "\n§Y$COUNTRY|U$§! a §Rrefusé§! notre appel à rejoindre notre guerre.\n\nIls ne nous soutiendront pas dans ce conflit."
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_JOIN_ALLY:2 "Nous avons rejoint la guerre"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_JOIN_ALLY:1 "§Y$COUNTRY|U$§! a §Gaccepté§! notre offre de soutien dans leur guerre en cours.\n\nNous combattons désormais à leurs côtés."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_JOIN_ALLY:2 "Refus de co-belligérance"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_JOIN_ALLY: "\nMalgré leur besoin désespéré de notre aide, §Y$COUNTRY$§! a §Rrefusé§! notre demande de rejoindre leur guerre."
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_NONAGGRESSIONPACT:2 "Pacte de non-agression signé"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_NONAGGRESSIONPACT:1 "\n§Y$COUNTRY|U$§! a §Gaccepté§! notre demande de pacte de non-agression.\n\nIl n'y aura pas de guerre entre nos pays."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_NONAGGRESSIONPACT:2 "Pacte de non-agression rejeté"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_NONAGGRESSIONPACT: "\nNotre offre d'entrer dans un pacte de non-agression a été §Rrefusée§! par §Y$COUNTRY$§!.\n\nCela ne peut signifier qu'une chose : ils préparent leur attaque."
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_CREATE_FACTION:2 "Faction formée"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_CREATE_FACTION:1 "\n§Y$COUNTRY|U$§! a §Gaccepté§! l'offre de rejoindre notre nouvelle faction.\n\nPour leur bien et le nôtre, nous les menons vers l'avenir."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_CREATE_FACTION:2 "Refus de rejoindre notre faction"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_CREATE_FACTION:1 "\n§Y$COUNTRY|U$§! a §Rrefusé§! l'offre de nous rejoindre dans une nouvelle faction.\n\nNous devrons chercher ailleurs des alliés."
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_OFFER_JOIN_FACTION:2 "Notre faction s'agrandit"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_OFFER_JOIN_FACTION:1 "\n§Y$COUNTRY|U$§! a §Gaccepté§! l'offre de rejoindre notre faction.\n\nNous sommes ensemble."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_OFFER_JOIN_FACTION:2 "Refus de rejoindre la faction"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_OFFER_JOIN_FACTION:1 "\n§Y$COUNTRY|U$§! a §Rrefusé§! notre offre de rejoindre notre faction.\n\nIls s'effondreront seuls."
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_JOIN_FACTION:2 "Accepté dans la faction"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_JOIN_FACTION:1 "\n§Y$COUNTRY|U$§! a §Gaccepté§! notre demande de rejoindre leur faction.\n\nNous sommes ensemble."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_JOIN_FACTION: "Interdit de faction"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_JOIN_FACTION:1 "\n§Y$COUNTRY|U$§! a §Rrefusé§! notre demande de rejoindre leur faction!"
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_LEND_LEASE:2 "Prêt-bail accepté"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_LEND_LEASE:1 "\n§Y$COUNTRY|U$§! a §Gaccepté§! notre prêt-bail.\n\nNotre soutien matériel sera d'un grand secours à ce pays."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_LEND_LEASE:2 "Prêt-bail refusé"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_LEND_LEASE:1 "\n§Y$COUNTRY|U$§! a §Rrefusé§! notre prêt-bail.\n\nCe pays devra donc s'en sortir sans notre soutien."
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_LEND_LEASE_EXISTING: "Modification du prêt-bail acceptée"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_LEND_LEASE_EXISTING:1 "\n§Y$COUNTRY|U$§! a §Gaccepté§! notre modification au prêt-bail.\n\nNotre soutien matériel continu est d'une grande aide pour ce pays."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_LEND_LEASE_EXISTING: "Modification du prêt-bail refusée"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_LEND_LEASE_EXISTING:1 "\n§Y$COUNTRY|U$§! a §Rrefusé§! notre modification au prêt-bail.\n\nCe pays ne bénéficiera donc plus de notre soutien matériel."
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_PEACE_PROPOSAL: "Offre de paix acceptée"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_PEACE_PROPOSAL:1 "\n§Y$COUNTRY|U$§! a §Gaccepté§! notre offre de paix.\n\nLes combats ont cessé entre nos nations."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_PEACE_PROPOSAL: "Offre de paix refusée"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_PEACE_PROPOSAL:1 "\n§Y$COUNTRY|U$§! a §Rrefusé§! notre offre de paix.\n\nLa guerre fait rage."
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_SEND_VOLUNTEERS: "Volontaires acceptés"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_SEND_VOLUNTEERS:1 "\n§Y$COUNTRY|U$§! a §Gaccepté§! que des volontaires de notre pays combattent dans la guerre.\n\nNos troupes sont en route pour prendre part au conflit."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_SEND_VOLUNTEERS: "Volontaires refusés"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_SEND_VOLUNTEERS:1 "\n§Y$COUNTRY|U$§! a §Rrefusé§! qu'un corps de volontaires prenne part aux conflits dans lesquels §Y$COUNTRY$§! est impliqué.\n\nNos volontaires, si désireux de s'engager, vont devoir ronger leur frein."
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_SEND_EXP_FORCE: "Force expéditionnaire acceptée"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_SEND_EXP_FORCE:1 "\n§Y$COUNTRY|U$§! a §Gaccepté§! notre offre d'envoyer une force expéditionnaire pour les aider dans le conflit en cours."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_SEND_EXP_FORCE: "Force expéditionnaire refusée"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_SEND_EXP_FORCE:1 "\n§Y$COUNTRY|U$§! a §Rrefusé§! notre offre d'envoyer certaines de nos troupes en tant que force expéditionnaire pour aider dans le conflit en cours."
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_ASKSTATECONTROL: "Contrôle de l'État donné"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_ASKSTATECONTROL:1 "\n§Y$COUNTRY|U$§! a §Gaccepté§! notre demande de contrôler un État occupé.\n\nNous sommes désormais responsables de l'État."
 DIPLOMACY_MESSAGE_DECLINED_TITLE_DIPLOMACY_ASKSTATECONTROL: "Refus de contrôle par l'État"
 DIPLOMACY_MESSAGE_DECLINED_MESSAGE_DIPLOMACY_ASKSTATECONTROL:1 "\n§Y$COUNTRY|U$§! a §Rrefusé§! notre demande de contrôler un État occupé."
 DIPLOMACY_MESSAGE_ACCEPTED_TITLE_DIPLOMACY_GIVESTATECONTROL: "Donner le contrôle d'un État occupé"
 DIPLOMACY_MESSAGE_ACCEPTED_MESSAGE_DIPLOMACY_GIVESTATECONTROL:1 "\n§Y$COUNTRY|U$§! a §Gaccepté§! notre offre de leur donner le contrôle de l'un de nos États occupés.\n\nIls sont désormais responsables de l'État."
