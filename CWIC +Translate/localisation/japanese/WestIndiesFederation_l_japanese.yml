 wif.1.d:0 "英国カリブ海連邦法が成立し、西インド諸島連邦が本日誕生した。この新しい政治連合は、20以上の主要な島々と250近くの小さな島々を、連邦政府を中心とする10の州に統合したものである。英国は、この連邦が、かつて植民地であった島々を完全に独立した国家に移行させることを期待している。ロンドンは、独立を求める島々の臣民の圧力の高まりに応えるとともに、独立によってロンドンに依存しない存続可能な国家を実現するための方法として、連邦を捉えているのである。特に大きな島々の住民の中には、この新しい国家を慎重に歓迎する一方で、連邦がどれだけ中央集権的なものになるのか、不安を口にする人もいる。反植民地活動家のインタビューでは、連邦は単にイギリスの搾取が続くだけであり、即時独立だけが島々の人々に対する何世紀もの植民地的抑圧を終わらせることができると述べている。しかし、大多数の人々はこのニュースを歓迎し、これが人々のための独立と発展の新しい時代になることを望んでいるようである。"