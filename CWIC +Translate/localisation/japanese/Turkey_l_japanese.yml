 TUR_Democratize_The_Regime_desc:0 "Eastern Europe is falling more and more into communist hands with each passing day. With Greece's future being bleak and Soviets right across our border it is painfully obvious we must get closer to Western Powers, and fast. To show our commitment to democracy and the western rule of law we must first start reforming our much criticized republican system, so far only favored our ruling government."
 TUR_Closer_Ties_With_West_desc:0 "A major ideal that our government strives for is fellowship between nations and peace and security around the globe. The United Nations is one of if not the primary vehicle that will carry us into that future. We should continue forging better relations with our western friends and help out this new organization reach the potential it carries."
 TUR_Prioritize_Trade_With_United_States_desc:0 "Although our country escaped the destruction of the Second World War, our economy wasn't that much great to begin with. We are in serious need of foreign reserve currencies or else we risk a crisis at a very critical time. With Western Europe still in the process of rebuilding and America's ascendance as the foremost economic power, it would be natural for us to prioritize our trade relations with this juggernaut."
 TUR_Utilize_Marshall_Funds_desc:0 "The venture started by the American government for European reconstruction and development, the so called Marshall Plan, has allowed us to reap some monetary aid as well. This financial aid could help us expand our industry greatly if used in the right way; expanding our mining capabilities, acquisition of raw materials and investing in financial stability of course. In return of this friendly posture we shall work to be a useful partner to the Americans as well as the Organization of European Economic Cooperation. After all, a strong economy for us might mean a strong economy for Europe one day."
 TUR_American_Arms_And_Artillery_desc:0 "Our heroic army needs to be strong to overcome the challenges of achieving world peace. Our friends in the American government are appreciative of our stance and more than willing to help arm our troops with necessary modern weaponry and tools. We should work to secure a new shipment while also work on new plans and measures suitable for today's world."
 TUR_Preparations_for_1950_Elections_desc:0 "The time has come to start preparing for the upcoming general elections. Candidates needs to be chosen, rallies needs to be made and most importantly new laws have to be signed. The last six months before an election can decide the entire outcome. We must be especially careful of what we do or say in the next couple of months."
 TUR_Implement_Tax_Reform_desc:0 "When the Günaltay Government was formed last year one of the first actions it took was to start revising certain taxes, specifically the much hated \"road tax\". For more than a hundred years there has been some form of road tax for our people with the latest iteration having been implemented in the '30s to finance infrastructure development. Recently however the liberal forces in the opposition has used the accumulated hatred to make considerable gains in the electoral race. Whichever way it may be, we must finalize the revisions and put them into effect immediately."
 TUR_Lighten_Governments_Stance_on_Religion_desc:0 "The policy of aggressive secularism we've pursued thus far, although useful in our crusade to rid our people of backwards ideas, has alienated majority of our population and now we face the risk of losing big chunks of vote to the DP. In his governmental plan the prime minister stated his plans to include optional religious education in primary education, open a department of theology at Ankara University and open türbes for a number historical figures. With an islamic scholar prime minister at the helm this should allow us to win back the religious crowd."
 TUR_Reform_the_Electoral_System_desc:0 "For many in the opposition circles the general elections of 1946 is considered a brutal homicide, a sham election deliberately made to ensure no real opposition can be formed. In his July 12th Declaration President Inönü promised a more fair representation and just elections to DP leaders in return of their cooperation. The time has come for us to finally implement the promised reforms into the legal system."
