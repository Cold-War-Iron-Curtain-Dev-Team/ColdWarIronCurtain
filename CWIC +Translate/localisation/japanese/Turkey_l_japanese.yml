 tur_dp_factionalism_decisions:0 "Democrat Party Factionalism"
 tur_dp_factionalism_decisions_desc:0 "Since the day it won the elections, the power and influence within the Democrat Party has been shared by 3 groups in particular: The parliamentary representatives at the National Assembly, Celal Bayar at Çankaya Mansion and Adnan Menderes at the Prime Minister's Headquarters. All three of these groups will try at all times to be the real power behind the Party, and if one of them is working with the other it will always be to oppose the third one."
 TUR_Bayar_tt:0 "Celal Bayar"
 TUR_Bayar_tt_desc:0 "One of the many heroes of the National Struggle, long time rival of Inönü, third prime minister and now president of the republic. Celal Bayar represents the old guard that ruled Turkish politics since its foundation. It was under him the Democrat Party was founded, and it was his expertise that brought the party to victory. After years of struggle he would never be content with a symbolic duty.\n\nBayar's clique represents the liberal wing of DP that isn't necessarily conservative. Still attached to the reforms and legacy of Atatürk, they play an important role in maintaining relations with CHP."
