 Semsettin_Gunaltay_Leader_Desc:0 "A stark contrast to the average CHP politician, Mehmet Şemsettin Günaltay comes from a stout religious background. Having been educated in both western schools abroad and local religious institutions, Günaltay started his teaching career in 1905 and taught in important madrasas of the era as well as in Islamic departments of several universities after the Education Reform. His teaching career continued until 1940 when serving politicians were prohibited from teaching in schools.\n\nFirst elected into the Ottoman parliament in 1915, Günaltay was active in the formation of local Defense Associations during Istanbul's occupation years. After the formation of the republic he got elected as a representative from Sivas and has been a continuous member of the parliament since.\n\nDespite being educated in scientific and religious matters, Günaltay has an especially influential career as a historian, helping find the Turkish History Society in 1931. Since 1941 he's been serving as its president."
 old_teacher:0 "The Old Teacher"
 TUR_Improve_Productivity_of_Government_Workers:0 "Improve Productivity Of Government Officials"
 TUR_Improve_Productivity_of_Government_Workers_desc:0 "To ensure the average citizen wholeheartedly loves the state and its workers is by making the processes as efficiently as possible without causing any unnecessary time loss for our people. On top of improving our admin level organizations we shall also modify The Provinces and Special Administrations Laws and present it to the national assembly as soon as possible. We believe once the local law enforcers start working without hesitation serenity will prevail in the country."
 TUR_Gunaltay.1.t:0 "Aligning Ourselves to Western Democratic Standards"
 TUR_Gunaltay.1.d:0 "When President Inönü appointed Semsettin Günaltay as prime minister back in January the intention was to have a moderate lead the democratization movement as a show of good will. His government platform is described as the most democratic one of the eighteen CHP governments since its foundation. Already a commission headed by Nihat Erim, Günaltay's deputy, is working on the upcoming bill \"The Law on Election of Representatives\". The Prime Minister himself on the other hand is looking to use the limited time he has to challenge CHP's status quo as much as he can, enough to win back the people's trust."
 TUR_Gunaltay.1.a:0 "With a new decade comes the winds of change."
 TUR_Gunaltay.2.t:0 "Implementation of the Road Tax Revisions"
 TUR_Gunaltay.2.d:0 "Although we had promised multiple times to completely abolish the Road Tax our current policy on transportation made this a risky promise to keep, since we desperately need the financing. Instead, we have opted to revise the law to put the weight on gasoline sales in the form of a sales tax.\n\nIt is only fair that the people who actively use the roads we build pay the higher share of the tax. Our lawmakers and economical advisors agree that this is the necessary compromise we have to make to still keep our finances stable.\n\nWe can still, of course, hold off on the revisions and instead decide to keep to our word and abolish any form of road tax. Going back on the work that's already done this late into the process is hard, not to mention the potential hampering on our construction sector, but when the time comes this might make the difference in the voters' minds."
 TUR_Gunaltay.2.a:0 "Hopefully this will be enough to win back some votes."
 TUR_Gunaltay.2.b:0 "Send it back to the Assembly, we must abolish the tax completely!"
 TUR_Gunaltay.3.t:0 "Fevzi Cakmak Passes Away"
 TUR_Gunaltay.3.d:0 "Soldier. Politician. Patriot. Few have been more influential for the republic than Fevzi Çakmak had been this past 30 years. After the victory in the Battle of Dumlupinar he earned the rank of marshal, the second and last person to do so after Atatürk himself. After the war he served in numerous positions including the Chief of General Staff that spanned 22 years.\n\nEver critical of the CHP under Inönü, Çakmak was one of the early members of DP. After the July 12th Declaration when both parties made amends he, with 5 others who were against the compromise, found the Millet Partisi (Nation Party). Although small in numbers, their parliamentary group became the loudest voice among the opposition.\n\nAlthough he was planning to lead the party into the upcoming elections, he unexpectedly passed away today. Although no official report was disclosed to the public some believe he was deliberately given the wrong type of blood by the doctors.\n\nHis upcoming funeral is expected to have hundreds of thousands attendants. We have the option to officially pay our respects to an Independence War hero, despite his harsh criticism of us. We can also simply make do with some simple notices on the Official Gazette to really put the final nail to the Nation Party's coffin. This however risks alienating and even galvanize the people against us for disrespecting a highly revered figure."
 TUR_Gunaltay.3.a:0 "The opposition lost their hero. So, what else is on the radio?"
 TUR_Gunaltay.3.b:0 "The Republic lost a hero, declare a week of mourning!"
 TUR_Gunaltay.4.t:0 "Hardliners Disgruntled"
 TUR_Gunaltay.4.d:0 "Our efforts to further cater to the wider population has caused some worry among some of the more radical elements within the party. They believe any way that goes astray to the principles of Kemalism will start a domino effect that will end with the party program being indistinguishable than the ones of the opposition parties.\n\nThese voices, although not large in numbers, carry the potential to grow as we change more and adapt. If both left and right wing members start to radicalize it can tear our country apart."
 TUR_Gunaltay.4.a:0 "We are doing only what is necessary."
