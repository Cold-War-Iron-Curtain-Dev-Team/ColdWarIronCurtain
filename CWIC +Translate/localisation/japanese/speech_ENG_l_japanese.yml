l_japanese:
 attlee_speech_category:0 "アトリー首相の公開演説"
 attlee_speech_category_desc:0 "アトリー首相は、第二次世界大戦終了後すぐに大英帝国が急速に衰退するのを目の当たりにした。彼は市民の幸福を強く重視し、戦争に強く反対している。彼の政権下で、国は再建に乗り出した。"
 attlee_anti_war:0 "反戦演説"
 attlee_anti_war_desc:0 "5年間の戦争は、私たちの国に大きなダメージを与えた。貴重な人命が失われ、多くの富が破壊され、貿易は中断された。明らかに、耐えなければならない苦難と多くの物の不足がある。回復を達成するためには、英国のすべての人々の大きな努力が必要だ。この4年半の間、非常に素晴らしい努力がなされ、工業や農業の生産が大幅に増加し、働く機会がすべての人に与えられ、多くの人々がよく働いた。避けられない苦難や不足は、できる限りすべての人が共有したが、その分、大きな社会保障制度がすべての人に適用された。労働者の政策の結果は、人々の健康、特に子供や赤ん坊の健康に見ることができる。チャーチルはこれを「不幸の共有」と呼んでいる。今回の選挙で決定される問題は、労働党の「すべての人に公平な分配を」という政策を継続するか、それとも以前の保守党政権のように、国民の一部に利益を与え、別の部分に不幸を与えるかだ。私たちが、せっかく始まった復興の仕事を続けるために、皆さんの協力をお願いしたい。"
 attlee_korean_war:0 "朝鮮戦争への対応"
 attlee_korean_war_desc:0 "私たちは、国連の権威に対する直接的な挑戦、侵略行為に直面している。今、あなたはあらゆる会合を開き、韓国政府またはアメリカ政府を呼び出し,意を表明することに私は賛同する。その人の性格があまり良くはないからと、人が人を殺す弁解になることは無い。「中国が安保理に参加していないからだ」と言うこともできるが、それは侵略の事実に影響を与えたり、変えるものでは無い。そして、国際連合という組織が、かつての国際連盟のようなものでないなら、断固として停戦を呼びかける必要があったのだ。そして、50以上の他の国々が、世界平和を維持するためのこの努力において、バックアップしている。侵略行為はリスクと危険を意味する。他のどんな起因よりもリスクと危険を意味している。もし我々が勝利すれば、世界における権威は侵略者のそれよりも大きいと確信している。私たちは今ここで、侵略行為は成功しないと言わなければならない。"
 churchill_speech_category:0 "チャーチル首相の公開演説"
 churchill_speech_category_desc:0 "チャーチル首相は、最も困難な5年間を通して国を導いた私たちの戦争の英雄だ。第二次世界大戦は何百万人ものイギリス人の命を奪ったが、偉大な首相はナチスとの妥協を許さず、勝利するまで戦った。"
 churchill_king_death:0 "国王ジョージ6世崩御の際のスピーチ"
 churchill_king_death_desc:0 "この最後の数ヶ月間、王は、まるで死が仲間であるかのように、また、死を認め、恐れない知人であるかのように、死と共に歩んだ。結局、死は友人として訪れ、太陽とスポーツに恵まれた幸せな一日を過ごし、自分を最も愛してくれる人々に「おやすみなさい」と声をかけた後、神を恐れ、この世の他の何ものでもないと願うすべての男性や女性が望むように、彼は眠りについた。ビクトリア朝時代の威厳ある、刺激的でない、静かな栄光の中で青春を過ごした私は、「God save the Queen」という祈りと賛歌をもう一度呼び起こすことに、興奮を感じるかもしれない！"