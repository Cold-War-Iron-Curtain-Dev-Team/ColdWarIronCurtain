 BUL.15.d:0 "There is growing disconnection between the BCP and the youth. We must find a way to inspire more political participation for the survival of the party and working class of Bulgaria. Many reformists in the Septemberists believe we must expand leisure activities in the Pioneers. Suggestions such as mass imports of East German “Kinderpanzers”, yearly camping trips to Siberia, and summer camps have all been embraced by the reformist faction of the Septemberists. On the opposite end of the spectrum, hardline Chervnenkovists have called for a more forceful hand. They believe that to keep up youth participation in the BCP, unnecessary decadent bells and whistles must be removed and minor conscription introduced. This plan, if implemented correctly, will greatly expand the BCP and ensure youth discipline for the   future. Both options have strengths and weaknesses, and we must choose one before the youth is alienated for good."
 BUL.16.d:0 "Today Bulgarian premier Todor Zhivkov has announced the beginning of a radical set of economic plans coined the Zhivkov Theses. Inspired by Nikita Khrushchev, the Zhivkov Theses promise to modernize every aspect of the Bulgarian economy, with a heavy emphasis on arms and and mining. Many are concerned with some of these plans' more unrealistic goals and its neglect for agricultural development, yet the Bulgarian government has assured that each plan has been meticulously thought out."
 BUL.17.d:0 ""
 BUL.18.d:0 "With the conclusion of our modernization efforts, a rift has appeared between planners. Some believe we must continue with Chervnenkovist economic policy, while others believe liberalization is needed to keep pace with the rest of Europe. Chervnenkovists have argued that relaxing heavy industry now will foster complacency in the proletarian masses of Bulgaria. Abstinence from decedent consumerism in their eyes will bring about the conditions for communism. Opposing them are reformist socialist planners who believe that without the technology and comforts of a modern nation, the Bulgarian workers will grow tired of the communist project and abandon it entirely. There is no clear answer to this split in our ranks and any answer could result in absolute failure or success."
 BUL.19.d:0 "Today, planners have come forward with a bold new economic policy for Bulgaria. They propose each planner and politicians spend a month doing labor with the workers they direct. They believe this plan will reconnect the BCP to the Bulgarian Working class and eliminate the growing disconnection highlighted by the Zhivkov Theses."
 BUL.20.d:0 "Over the past decade, the Bulgarian economy has racked up a copious amount of debt. If not paid off before the end of the fiscal year, lenders will stop funding our projects, and we will be unable to continue as a socialist nation. Strict budget reform is needed to solve this crisis."
 BUL.21.d:0 ""
 BUL.22.d:0 "Internal Security has informed us that many in the military and intelligentsia have grown tired of our liberalizing policies and wish to return to Chervnenkovist Hardline Marxism. Due to the nature of the threat, we must be careful with where to place agents to avoid suspicion. Many in internal security believe the threat lies with the ideologues and educated urban leaders. According to them, liquidating this growing intelligentsia class will prevent harmful ideas spreading to our working class. Just recently, however, a growing number of agents have uncovered proof of disloyalty in the Sofia military garrison. Evidence suggesting treason in the Bulgarian People's Army is mounting. They warn that without a military purge, Bulgaria could risk becoming a fanatic Red Junta."
 BUL.23.d:0 ""
 BUL.24.d:0 "Now that our revolution is secured internally, we must protect the Bulgarian state from capitalist intruders. Our comrades in Albania have been hard at work constructing fortifications, and our brethren in China amass along the Amur river. Yet to secure Bulgaria, we must look to the power of the atom. With a low population and a border with a Soviet puppet, our only hope for survival is the construction of a nuclear device. Until completion, all news of such a device must be a close guarded secret."
 BUL.26.d:0 "Inspired by comrade Khrushchev, Premier Zhivkov has developed a plan to quickly industrialize Bulgaria. The plan calls for a scaling back of agricultural development in favor of heavy industry in the arms and mining industry. With hard work, Zhivkov has assured us that Bulgaria will become an industrial powerhouse in the Balkans. A small minority of planners, however, believe our plans are much too ambitious. According to the ministry of agriculture, Bulgaria cannot afford agricultural neglect for a prolonged amount of time. Despite small objections, the Zhivkov Theses is expected to be a complete success."
 BUL.27.d:0 "Bulgaria has announced today that it will be escalating to a full great leap forward. This announcement has come after widespread rumors of the initial failure of the Zhivkov Theses. It appears the BCP has doubled down on rapid industrialization and now promises the Bulgarian economy will grow to be the largest economy in the Balkans. This announcement has brought condemnation from many countries who worry about complete agricultural collapse. Despite the concerns, the entire Bulgarian population has already been mobilized and deployed to the countryside to rapidly accelerate industrialization."
 BUL.28.d:0 "Today, Todor Zhivkov announced a controversial decision to begin undoing the nations many laws against homosexuality. This decision came after 26 men were arrested for “deviant behavior”. However, the courts were swayed by their story and, in a shocking development, ruled them innocent. Soon after, homosexuality was decriminalized, and civil unions have now been recognized under Bulgarian law. Many have criticized this development, the most outspoken group being the Orthodox church who has, in a rare instance, gone against party line. Despite the pushback, many are happy for this positive development in Bulgarian culture."
 BUL.29.d:0 "Last night, Bulgarian officers commanded by Ivan Gorunya staged a coup and toppled premier Zhivkov. Gorunya has announced the end of the Zhivkov regime and the beginning of a new Hardline era for Bulgaria. The Soviets were quick to condemn the coup and have requested the new government step down and release Zhivkov and his family unharmed. These demands are unlikely to be met as Bulgarian troops oust Soviet garrisons around the country. Already, the Warsaw Pact has been put on high alert and rumors circulate of a possible intervention. The new Bulgarian government has warned that any incursion onto its soil will result in all-out people's war."
 BUL.30.d:0 "Last night, treasonous officers of the Sofia garrison attempted to opportunistically take power from our people's government. The coup, however, was known to Internal security for months and every officer was arrested before damage could be done. Ivan Gorunya, the leader of the coup, has been detained and is currently being interrogated. This coup has failed spectacularly, however another one could be upon us soon. For that reason, we must crack down hard on the military to ensure the safety of our people's democracy."
 BUL.31.d:0 "Today, Warsaw Pact troops crossed the Bulgarian border in an attempt to bring Bulgaria back into the Soviet bloc. Because of open Romanian hostility to other pact troops, the invasion had to come from the Black Sea. Soviet and East German marines with Hungarian and Polish support landed in Varna and Burgas, while Czechoslovak troops established a beachhead in Sozople. The combined armies of the Warsaw Pact initially met stiff resistance on the outskirts of Sliven however after a series of flanking maneuvers the Bulgarian People's Army melted away and Sofia was breached after only 3 days. The Bulgarian government has been apprehended and are currently awaiting trial. So far, the west has been silent on the issue, and it is unlikely there will be any official statements."
 brazil.2.a: "This can't be good..."
 brazil.3.a: "...and I leave life to enter History."
 brazil.5.d: "In a state visit to Italy, President Machado was visiting the Holy See in the Vatican, when a sudden sickness came over him. He was rushed to the hospital, but passed away, identified as a heart attack, at 21:43 of December 26, 1953. In his place, vice-president Altino Arantes assumes as president until the next election."
 brazil.5.a: "Rest in peace, President Machado."
 brazil.6.d: "On April 6, 1950, a serious train accident of great proportions occurred. More than one hundred fatalities. The cause pointed out for this event was that the river waters were diverted from their natural bed, becoming very close to the bridgehead, causing erosion. The train known as the 'night camper,' consisting of five carriages and a locomotive, fell into the Tanguá River after the embankment at the head of the railway bridge collapsed due to the strong current of the river following heavy rain."
 brazil.7.d: "The first television channel of latin america was opened on September 18th, 1950. PRF-3 aka TV Tupi, founded by journalist and businessman Assis Chateaubriand, began its transmissions in São Paulo, where child actress Sonia Dorce opened the transmission with the quote: ''Good evening, Brazilian television is on air'', dressed as a tupi-guarani native, the logo and brand of the network, coming from a long wish from Chateaubriand of using the names of Brazil's native population in his works to represent the roots of brazilian culture. Offering foreign cartoons and movies, and educational documentaries, the first news broadcasting, Imagens do Dia, came 10 days later on September 28th, offering short recorded reports, with special attention to the upcoming elections and the campaign of Getúlio Vargas."