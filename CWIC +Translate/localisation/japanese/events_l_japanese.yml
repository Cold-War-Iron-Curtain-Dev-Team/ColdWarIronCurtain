 usa.1000.t:0 "Election of 1952: Democratic Nomination"
 usa.1000.d:0 "Election of 1952: Democratic Nomination is taking place today while the frontrunner is Governor of Illinois Adlai Stevenson II, Estes Kefauver US Senator famed for going after the Mafia in Senate testimony. There are also rumors that President Truman could run for re-election at the last minute and seize the nomination...."
 usa.1000.a:0 "Adlai Stevenson II"
 usa.1000.b:0 "トルーマン大統領"
 usa.1000.c:0 "Estes Kefauver"
 usa.1001.t:0 "Election of 1952: Republican Nomination"
 usa.1001.d:0 "Election of 1952: Republican Nomination is taking place today, after 20 years out of power the Republicans are hoping to retake the Presidency, the nomination so far is even divided between General Dwight Eisenhower and noted isolationist Ohio Senator Robert Taft. While not formally in the race General MacArthur also has delegates pledged to support him, if the nomination is deadlocked, perhaps he could pull of an upset"
 usa.1001.a:0 "Dwight D. Eisenhower"
 usa.1001.b:0 "Robert Taft"
 usa.1001.c:0 "Douglas MacArthur"
 usa.1002.t:0 "Election of 1952: Republican Nomination"
