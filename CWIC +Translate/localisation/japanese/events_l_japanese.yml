 notecrisis.1.t:0 "Finnish Elections Turning Badly"
 notecrisis.1.d:0 "Finnish elections are coming up soon and it is looking like our Soviet-friendly ally Urho Kekkonen is losing the election to Olavi Honka. Olvai Honka is all for Western ties and not being as centered around us and the Warsaw Pact. This can really hurt us, and Finland could possibly be dragged into NATO. Do we do anything about the election, try anything else, or just leave this whole thing along and hope he wins?"
 notecrisis.1.a:0 "Tip the election into Kekkonen's favor."
 notecrisis.1.b:0 "Leave the election alone. What happens, happens."
 notecrisis.1.c:0 "The Soviets must get involved now. Send the Finland Note."
 notecrisis.2.t:0 "Finland Note"
 notecrisis.2.d:0 "The Soviets have sent us a new treaty. They wish to secure the defense of both countries. What they mean by this is to reopen the Soviet Porrka Naval Base next to Helsinki, deploy Soviet weaponry and troops in Finland, and to ensure that Finland stays centered on the USSR and the Warsaw Pact. Some of our advisors say this could help us be better allies with the East, but some are saying this could hurt relations with the West. What do we do about the Note?"
 notecrisis.2.a:0 "Accept the Note. The Soviets are closer to us."
 notecrisis.2.b:0 "Deny the Note. We will be neutral and not just be a Soviet ally."
 notecrisis.3.t:0 "Finland says no to Note"
 notecrisis.3.d:0 "The Finnish Government has denied the Finland Note, saying that they wish to stay neutral. This could make them turn towards the West. Finland is a important country to have to be our ally. What should we do about this Note Crisis?"
 notecrisis.3.a:0 "The Finnish Government will have their wish of being neutral."
 notecrisis.3.b:0 "We tried a diplomatic option. Now we have to do a military option."
 notecrisis.3.c:0 "We will negotiate with them."
 notecrisis.4.t:0 "Soviet Troops Cross into Finland"
 notecrisis.4.d:0 "The Soviets have sent in troops into our country without our permission. They have been occupying towns near the Soviet border and are advancing more and more. The Soviets have stated that this is to support us from threats from the West. Should we trust them, or is this impending on our independence as a nation?"
 notecrisis.4.a:0 "Allow the Soviet Union to occupy us. We will allow our ally in."
 notecrisis.4.b:0 "This is violation of our independence and is an act of war. Alert the military to open fire on the Soviets."
 notecrisis.5.t:0 "Helsinki Talks"
 notecrisis.5.d:0 "The Soviets have sent a diplomat to Helsinki to have negotiations about the Finland Note. The Soviets have said that if we joined them, we would be granted land lost from our past. The West has said to us to not bow down to the Russian Bear and to stay and independent state. The East have said that we should join them and be a eternal friend. Our people have said that they want to be a neutral independent state. The World is watching us today, so what will we decide?"
 notecrisis.5.a:0 "We shall become a ally of the USSR."
 notecrisis.5.b:0 "We shall become a SSR for the USSR."
 notecrisis.5.c:0 "We shall become a part of the USSR."
 notecrisis.5.e:0 "We will always be a independent state."
 notecrisis.6.t:0 "Helsinki Talks Fail"
 notecrisis.6.d:0 "The Finnish have stated that they will not bow down to the 'Russian Bear' and want to be an independent neutral state. This does not go well with our plans and the diplomatic solution has seemed to fail. All we can do is a military option or just leave the whole Note Crisis alone."
 notecrisis.6.a:0 "Leave the Note Crisis alone."
 notecrisis.6.b:0 "A military option must happen. Ready the troops."
 notecrisis.7.t:0 "Soviet-Finnish Reforms"
 notecrisis.7.d:0 "The Finnish Government has granted us military access into Finland. They seem not to want to lose another 2nd Winter War. They made the right decision, and now it's time to make our next move. Should we install a Soviet puppet state in Finland, turn Finland into an SSR, completely annex them into the U.S.S.R, or just let them be and have our military access?"
 notecrisis.7.a:0 "Message Finland about the new Finnish Democratic Republic."
 notecrisis.7.b:0 "It's time for Finland to join the SSRs. Message them about it."
 notecrisis.7.c:0 "Annex Finland into the USSR."
 notecrisis.7.e:0 "Leave them alone. The military access will be enough for us."
 notecrisis.8.t:0 "Soviet Union Wishes a Communist Finland"
 notecrisis.8.d:0 "The Soviet Union has sent a new Note asking us to be a new Communist government. We will be the Finnish Democratic Republic. There is a perk to this since we will be allied to the USSR and the Soviets have even offered land that was taken from us during the 1st Winter War. Though we have always been a neutral country. What shall we do?"
 notecrisis.8.a:0 "Long live the Finnish Democratic Republic!"
 notecrisis.8.b:0 "We are always a neutral state. We will not change."
 notecrisis.9.t:0 "Finnish Democratic Republic is Formed!"
 notecrisis.9.d:0 "Finland has decided to follow with a Communist government, and has formed the Finnish Democratic Republic. We did make a statement for them being a Communist nation, that we would grant them some of land they lost before. We do have 3 choices on how to do this. Finland could get their land back from the Winter War as compensation for them forming a Communist government. We could also give them their land from when they were a part of the Russian Empire, which will not give them as much land but still make them happy. We could also not give Finland none of their land, and stop anyone from accepting."
 notecrisis.9.a:0 "Grant them the land that they lost in the Winter War, that we would give then."
 notecrisis.9.b:0 "Grant them the land that they owned as part of the Russian Empire."
 notecrisis.9.c:0 "What land was promised? I think we lost the treaty, oh well."
 notecrisis.10.t:0 "Finland Denies Soviet Government"
 notecrisis.10.d:0 "The Finnish Republic has said that they wish to be a neutral independent state. This goes against our plans with the Note. What should our next move be?"
 notecrisis.10.a:0 "We will have to do it by force."
 notecrisis.10.b:0 "Form a coup."
 notecrisis.10.c:0 "Leave them alone then. We need to keep the military access."
 notecrisis.11.t:0 "Soviet Union Wishes us to be an SSR"
 notecrisis.11.d:0 "The USSR has requested to join them as a SSR and let us be even closer to the USSR. We will be a part of the USSR and still have some sort of autonomy. The Soviets have said that the SSR would be bigger than our current border. We will be under Soviet control though, and some of the advisors worry that any culture of the Finnish might be wiped away. What do we do?"
 notecrisis.11.a:0 "We will be a grateful SSR."
 notecrisis.11.b:0 "We are worried about our culture. Finland will always be Finnish."
 notecrisis.12.t:0 "Finland Denies SSR"
 notecrisis.12.d:0 "The Finnish Republic has said that they wish to be a neutral independent state. This goes against our plans with the Note. We have some options on what to do next. We could keep them happy and allow the neutral independent state or we could try to force it upon them. What should our next move be?"
 notecrisis.12.a:0 "We will allow their independent state."
 notecrisis.12.b:0 "We will have a military option then."
 notecrisis.12.c:0 "Form a coup on the Finnish."
 notecrisis.13.t:0 "Finland To Be Annexed"
 notecrisis.13.d:0 "The Soviets hope to annex us under them, like how we were under the Russian Empire. The Soviets see this as an opportunity to gain more land and a strategic area over Northern Europe. Some of the advisors wonder however, if we will be persecuted for our culture and always being an outcast of the East. Some advisors say this is a great way to have an eternal friendship with the USSR. What should we do about this Note?"
 notecrisis.13.a:0 "We shall be glad to join under the banner of the Soviet Workers and Peoples."
 notecrisis.13.b:0 "We will not erase our country. We will choose the right decision."
 notecrisis.14.t:0 "Finland Denies Annexation"
 notecrisis.14.d:0 "The Finnish have stated that they will not have their culture and way of life to cease to exist. They said that they will always have a independent state for the Finnish people. This is not good with this and goes against our plans. There are increased anti-Soviet sentiment in Finland everyday. What should we do?"
 notecrisis.14.a:0 "Let Finland be."
 notecrisis.14.b:0 "We must protect our Soviet people in Finland. Launch an attack."
 notecrisis.14.c:0 "Time for a Communist Revolution."
 brazil.1.d: "The second half of the decade was a frustrating one for Brazil. After contributing to the Allied war effort, the general sense of the political elite is that the South American behemoth was forgotten by it's allies in the north. While the US injected money in the economies of the losing powers, Brazil could not get approval for loans that didn't match the costs of the war effort and, worse, the regional strategic rival, Argentina, was being welcomed back in Washington despite having collaborated with the Nazi regime and housing war criminals who escaped from Germany. This combined with a lackluster administration by General Eurico Gaspar Dutra, with instances of simple poor planning and management, the way was open for the return of the still popular former dictator and \"War President\" Getúlio Vargas."
 brazil.2.d: "Lacerda, one of the main leaders of the opposition during Vargas administration, kicked off his campaign for the Chamber of Deputies. As he was threatened before, a group of supporters, Air Force officers, served as personal security during his rallies. After a rally held on the night of 4 August 1954 in the courtyard of Colégio São José, the journalist went back home along with his 15-year old son, Sérgio, in the car of Major Rubens Florentino Vaz. After arriving on Tonelero Street, once they all got out of the car to say their farewells, a gunman emerged from the darkness and shot at the group many times. Air Force Major Vaz tried to defend but was shot on the chest. Meanwhile, Lacerda took cover with his son in an adjacent garage and returned fire at the attacker, who fled in a taxi. Sálvio Romeiro, a local guard who heard the gunfire, came to investigate but was also shot; he was, however, able to write down the license plate of the escape vehicle.\n\n Lacerda escaped with minimal injuries, however, Major Vaz was not as fortunate, and passed away the following day. Investigations by the police appointed the chief of Vargas' personal security, Gregório Fortunato, nicknamed ''The Black Angel'' as the mastermind behind the murder. The event has caused shock and outrage among the country, leading to a massive increase in the strength of the opposition, pressure from the army and many demands for the resignation of Vargas."
 brazil.3.d: "Once again, the forces and interests against the people have coordinated and are unleashed upon me once more. They do not accuse me, they insult me; they do not fight me, they slander me, and they do not give me the right to defend myself.\n\n They need to stifle my voice and prevent my action, so that I do not continue to defend, as I have always defended, the people and especially the humble.\n\n I have fought month after month, day after day, hour after hour, resisting constant, incessant pressure, enduring everything in silence, forgetting everything, renouncing myself, to defend the people, who now are left helpless. I can give you nothing more than my blood. If the birds of prey want someone's blood, if they want to continue sucking the blood of the Brazilian people, I offer my life as a holocaust.\n\n I choose this way to always be with you. When you are humiliated, you will feel my soul suffering by your side. When hunger knocks at your door, you will feel in your chest the energy to fight for yourselves and your children. When you are vilified, you will feel in your thoughts the strength to react. My sacrifice will keep you united, and my name will be your banner of struggle. Each drop of my blood will be an immortal flame in your conscience and will maintain the sacred vibration for resistance. To hatred I respond with forgiveness.\n\n I have fought with an open heart. Hatred, infamy, and slander have not diminished my spirit. I gave you my life. Now I offer you my death.\n\n I fear nothing. Serenely I take the first step on the path to eternity..."
 fra.5.t:0 "Ratification of the Treaty of Paris"
 fra.5.d:0 "The European Coal and Steel Community will bring us many benefits and bring us European countries closer together again after the devastating war."
 fra.8.t:0 "Ratification of the European Defence Community Treaty"
 fra.8.d:0 "The Treaty establishing the European Defence Community, also known as the Treaty of Paris will create a European Defence Community (EDC) with a pan-European defence force."
 fra.9.t:0 "Treaty of Paris not signed"
 fra.10.t:0 "[GetNewspaperHeader][From.GetName] created the EDC"
 fra.6.t:0 "Treaty of Paris not signed"
 fra.6.d:0 ""
 fra.7.t:0 "[GetNewspaperHeader][From.GetName] created the ECSC"
 fra.7.d:0 "Today, [From.GetNameDef] created the European Coal and Steel Community. These European countries will work together to expand their industry and share material to rebuild after the Second World War."
 fra.12.t:0 "[From.GetName] Creates the Pleven Plan"
 fra.12.d:0 "[From.GetNameDef] invites us to join the Pleven Plan. It's a Military Cooperation between us European Countries."
 fra.13.t:0 "[From.GetName] signed the Pleven Plan"
 fra.13.d:0 "[From.GetNameDef] signed the Pleven Plan and joined the Military Cooperation"
 fra.14.t:0 "[GetNewspaperHeader] Establishment of the the Pleven Plan"
 fra.14.d:0 "Today, [From.GetNameDef] established the Pleven Plan, a Military Cooperation between European Countries to share knowledge and experience."
 wgr.6.t:0 "[From.GetName] Creates the EDC"
 wgr.6.d:0 "[From.GetNameDef] invites us to join the European Defense Community. It's a Military Cooperation between us European Countries, stronger than the Pleven Plan. Its objective is to control the West German Rearmament."
 wgr.7.t:0 "[From.GetName] joined the EDC"
 wgr.7.d:0 "[From.GetNameDef] joined the European Defense Community and the Military Cooperation"
 wgr.8.t:0 "[GetNewspaperHeader][From.GetName] established the EDC"
 wgr.8.d:0 "\nToday, [From.GetNameDef] established the European Defense Community, a Military Cooperation between European Countries to share knowledge, experience and equipment. It's a stronger alliance then the Pleven Plan with the objective to control the West German Rearmament."
 news.1032.d:0 "Just as promised, this startup event was created to thank our Patrons who support us with their donations. You guys will always be in our hearth :D\n\nBig Thanks so far goes to: Joe Keshy and MyNameJeff2005"
 excellent:0 "素晴らしい"
 unfortunate:0 "残念だ"
 stability.21.t:0 "徴兵忌避"
 stability.21.desc.a:0 "陸軍省による新たな報告書において、動員可能な人的資源の著しい減少が示された。直近の入隊者の一団は当初想定されていたよりもはるかに少なかったようだ。この相違に関して現在調査中であるが、第一の手がかりとして様々な方法で徴兵を回避する人々が示されている。18歳の学生が突如熟練労働者として重要な軍需産業へ雇用されたり、元アスリートが体力試験で失格となったり、場合によっては単純に新兵が跡形もなく消えたりなどすることである。\n\nこれらの人々が捕まり尋問された際には、軍隊の劣悪な状況や冷淡な将官、勝ち目のない戦いによって死ぬことは望んでいないことを理由に挙げた。軍の指導者は徴兵回避をする人々への厳しい弾圧を要求しているが、政府内の多数は入隊した兵士の生活状況を改善する方が良い方法であるかもしれないと考えている。"
 stability.21.desc.b:0 "蔓延する徴兵逃れに対して効果的ではなかった公式の対応によって、問題はより悪化していった。ますます多くの新兵が召集令状を受け取っても現れなくなったのだ。防諜によって、医師に賄賂を握らせ医学的に不適格であることを証明させてもらい徴兵を回避するように示唆するパンフレットを傍受している。家族持ちの父親に対する例外においては、子持ちの戦争未亡人たちへ結婚申し込みが殺到することに繋がり、道義上この例外を申請する人数は記録的な数字を記録していた。\n\n軍の指導者達は捕らえた少数の兵役逃れ者を例に挙げ、この例外を排除することを提案しているが、政府内の他の者達はこの戦争の敗北の結果を示唆し、人々の責任意識へ訴えかけるべきだと提案しているようだ。"
 stability.21.desc.c:0 "政府は徴兵逃れに対応しているが効果らしきものは全くない。なぜ他人が平和に暮らしているのに自分たちが危険を犯さなければならないのかと疑問に思い始める人はますます増えてきた。そう考えるようになった新兵は、自分が政府に反抗し破滅を招く愚か者だとして街頭で嫌がらせを受けたり、嘲笑されたりしていると報告することもある。子どもたちは母親から召集に応じるのを禁じられているという報告は国中から来ており、こうした行方不明の兵士の処置に奔走する中で事務手続きは崩壊し始め、担当部署はもはやどれくらいの人数が召集に応じるのかわからないと言い切る報告書を提出した。"
 stability.21.a:0 "それについては何もできない"
 stability.21.d:0 "兵役逃れをした者を見つけ出し逮捕すべきだ！"
 stability.21.e:0 "おそらく、入隊した兵士への昇給が妥当であろう"
 stability.21.f:0 "より厳しい措置が必要だ"
 stability.21.g:0 "人々の市民としての責任意識へ訴えかける"
 stability.21.h:0 "例を示してやらねばなるまい"
 stability.21.i:0 "国民に戦うものを与えなければ"
 stability.22.t:0 "ストライキ！"
 stability.22.desc.a:0 "労働者が全ての戦争産業においてストライキを宣言したことで、ここ数日は一部の工場において著しく効率が落ちている。「平和とパンを！」と要求する彼らは、ここまでの和解交渉の試みをすべて拒否してきた。政府の中には厳格な軍事的な対応を行い、敵国の工作員や反逆者として首謀者の迅速な処刑を提唱する者もいた。しかしながら行政府の中では、関与する兵士達が我々の思っているよりも忠実ではなかった場合、手荒な行動が裏目に出るかもしれないと指摘し、様々な手段を用いるのが望ましいと考えているようだ。"
 stability.22.desc.b:0 "ストライキ実行者達へ仕事に戻るように説得する政府の努力は、何の効果もなかったようだ。逆にストライキはさらなる工場で報告されており、元々ストライキの影響にあった工場において態度を保留していた人々も、同僚の憤りに直面してその作業道具を手放しているようだ。これまでのところは備蓄によって最前線に対する補給への打撃を幾らか抑えることが出来ているが、この生産停止が戦争遂行能力へ影響を及ぼすのは時間の問題である。\n\n陸軍省は政府に対し、ストライキへ妥協を許すことのないように要求しているが、政府内における他の派閥においては労働者の要求をある程度満せば、仕事へ戻るように説得するのに十分かもしれないと示唆している。"
 stability.22.desc.c:0 "連携することなく複数個所で発生した労働争議は、もはや全国規模に広がり、戦争に直結する産業のみならず、サービス業にも影響している。政府機関自身においても現場職員、郵便配達人、そして運転手で就業を拒否する者が増加し、影響を受けている。\n\n労働者委員会が工場を引き継ぐ事例が数多く見られている。秘密警察の報告によると、「戦時体制」と呼ばれているものに対して大規模な蜂起のために、兵器の生産が複数個所で再開されているようだ。\n\n軍最高司令部は、忠誠を誓う部隊により断固たる対応を採れば鎮圧することができると信じているが、政府の文官によれば、そうすれば内戦に発展し、確実に敗北すると主張している。"
 stability.22.a:0 "やがて終わるだろう"
 stability.22.b:0 "市街にて軍隊による示威運動をしよう"
 stability.22.c:0 "自ら進んで働く人々の中から広告塔を生み出そう"
 stability.22.d:0 "兵役の下で労働者を徴兵し、工場を軍の制御下に置く。"
 stability.22.e:0 "労働者の食糧供給を増やすことを提案する"
 stability.22.f:0 "軍隊を送り、ストライキ実行者どもを逮捕し、首謀者を処刑する"
 stability.22.g:0 "新たな福祉法案を提案する"
 stability.23.t:0 "軍内における反抗"
 stability.23.desc.a:0 "我が軍の幾つかの部隊が上官からの命令を拒否したという驚くべきニュースが軍首脳部にもたらされた。戦線を離脱した部隊は無いとはいえ、兵士達の代表者は敵を攻撃する命令には従わないことを明確に宣言した。\n\n反乱が起きているのはこれまでのところ僅かな大隊と、一握りの訓練部隊、支援部隊だけであるが、戦争省の多くの人々はすぐにこの反乱が他の部隊に広がり、最終的には戦争を継続できなくなるのではないかと危惧している。断固とした行動が必要だ。"
 stability.23.desc.b:0 "軍の反乱部隊に対する呼びかけは効果を示さなかった。実効性に欠けた政府の回答に勇気づけられ、反乱軍は包括的平和協定の実施及び復員による衝突の即時停止を新たに要求事項として増やした。\n\n陸軍省は行動を抑止するために、反乱軍に確固たる意志を伝えることを強く勧告する。"
 stability.23.desc.c:0 "政府は彼らの問題提示に対し、明らかに対応するつもりがないか、その能力を有しておらず、彼らは自ら措置することを決した。「労働者及び兵士評議会」の選挙が発表され、国家を承継し、敵と和平を結ぶという明確な目標が掲げられている。\n\n迅速に行動を起こさないと、この評議会により、国内において支配が変わってしまう地域が現れることになり、戦争を継続できなくなる可能性がある。"
 stability.23.a:0 "今は何もできることはない"
 stability.23.b:0 "支持者で反乱部隊を取囲み、解散するよう命じる"
 stability.23.c:0 "反抗者の前で愛国的演説をする"
 stability.23.d:0 "反抗者を支持していると認められた者は、反逆罪で告発されることを公式に発表する。"
 stability.23.e:0 "平和的な案を発表する。ただし、確実に敵が受け入れられない内容にしてくれ。"
 stability.23.f:0 "支持者の民兵を動員して全ての非番の兵士を逮捕せよ"
 stability.23.g:0 "兵士自ら自分たちの将官を選出できるよう提案する"
