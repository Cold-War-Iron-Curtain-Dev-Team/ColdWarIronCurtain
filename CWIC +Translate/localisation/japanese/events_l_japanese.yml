 Currency.1.d:0 "An official message conveyed by the Hashemite Kingdom of Jordan alongside former members of the Transjordan caucus announced the creation of the kingdom's official national currency. The Jordanian Dinar is set to replace the previous Palestinian pound, a relic currency of the previous British Palestinian administration of the region. Since Jordan's independence in 1946, ideas of the implementation and creation of a national currency were popular among all political spectrums. Currently in 1949, the Provisional Act.35 responsible for such a creation of currency has been passed unanimously in Jordan. Expectations from the recently formed Jordan Currency Board suggest that the Dinar will be officially implemented by July 1, 1950, officially ceasing acceptance to outdated British Palestine currency. Specifications of the currency in accordance to the Jordan Currency Board suggest: Coin denominations of 1, 5, 10, 20, 50 and 100. As for banknotes, denominations will include 0.5, 1, 5, 10, 20 and 50 Dinar. Once more the world can witness the birth, of a new currency."
 ace_promoted.1.t:0 "エースパイロットの昇進"
 ace_promoted.2.t:0 "勇敢なエースパイロット登場"
 ace_promoted.1.d:0 "[Root.GetAdjective]空軍のパイロットほど勇敢でリスクを恐れない者はいない。[From.GetCallsign]のコールサインで知られる腕利きパイロット、[From.GetName] [From.GetSurname]は、最近の[From.GetMissionRegion]での作戦にて、生還したことはもとより、多くの危機的な局面で目覚ましい勝利を飾りその名を轟かせた。\n\n[From.GetName]の昇進は広く喧伝され、[Root.GetAdjective]魂の模範として称揚された。国民の目には、戦争は栄光というよりは地獄として映っていただろうが、多くのものが英雄の登場を喜び、その下で結束を高めている。"
 ace_promoted.1.d_major:0 "[Root.GetAdjective]空軍のパイロットほど勇敢でリスクを恐れない者はいない。[From.GetCallsign]のコールサインで知られる腕利きパイロット、[From.GetName] [From.GetSurname]は、生還したことはもとより、[From.GetHerHis]の[From.GetWing]を類まれな操縦術で乗りこなしたことでその名を轟かせた。最近、[From.GetName]は[From.GetMissionRegion]での作戦に参加し、この決定的な会戦を成功に導いた。\n\n[From.GetName]の昇進は広く喧伝され、[Root.GetAdjective]魂の模範として称揚された。国民の目には、戦争は栄光というよりは地獄として映っていただろうが、多くのものが英雄の登場を喜び、その下で結束を高めている。"
 ace_promoted.1.a:0 "危険を冒すものが勝利する"
 ace_died.1.t:0 "[From.GetCallsign]、[From.GetMissionRegion]で死す"
 ace_died.1.d:0 "[From.Owner.GetName]の最も有名な[From.GetAceType]エースの一人、[From.GetFullName]は[From.GetMissionRegion]での作戦遂行中に炎上墜落した。不幸なことに[From.GetSheHe]は長く有名人であったため、[From.GetCallsign]の死は[From.GetHerHim]を尊敬していた多くの人々をひどく意気消沈させた。\n\n我々は人々からこの出来事を隠蔽する方法があればと望んだが、[From.GetName]が国民に姿を見せないようになればすぐに疑惑が巻き起こる違いなかった。年月を経れば、[From.GetHerHis]の死は伝説の一部として、我々が抱える苦悩を超え長く語り継がれるだろう。"
 ace_died.1.d_major:0 "[From.Owner.GetName]の最も有名な[From.GetAceType]エースの一人、[From.GetFullName]が職務遂行中に墜落した。作戦報告を終えたパイロット達が目撃したところによると、[From.GetHerHis]の[From.GetWingShort]が敵の激しい対空砲火を浴びて[From.GetMissionRegion]に炎上墜落したそうだ。残念ながら[From.GetSheHe]は長く有名人であっため、[From.GetCallsign]の死は[From.GetHerHim]を尊敬していた多くの人々をひどく意気消沈させた。\n\n我々は人々からこの出来事を隠蔽する方法があればと望んだが、[From.GetName]が国民に姿を見せないようになればすぐに疑惑が巻き起こる違いなかった。年月を経れば、[From.GetHerHis]の死は伝説の一部として、我々が抱える苦悩を超え長く語り継がれるだろう。"
 ace_died.1.a:0 "伝説は生きていてこそ"
 ace_killed_by_ace.1.t:0 "[From.GetFullName]、[Prev.GetCallsign]に撃墜される"
 ace_killed_by_ace.1.d:0 "[From.GetMissionRegion]から帰還したパイロットの報告よると、悪名高き[Prev.GetCallsign]率いる[Prev.Owner.GetAdjective]軍の飛行中隊が[From.GetCallsign]を執拗に狙った。敵数機を迎撃し[Prev.Owner.GetAdjective]機からの集中射撃を回避するも、[From.GetCallsign]は[Prev.GetCallsign]に圧倒されていた。報告によれば[From.GetHerHim]は裏をかかれ、燃料タンクを見事に撃ち抜かれた。[From.GetName] [From.GetSurname]の機体に火災が発生し、業火の中、[From.GetMissionRegion]上を螺旋状に舞い落ちていった。\n\n[From.GetFullName]はその類稀なる勇気と功績によって多くの人に尊敬されていた。この国民的英雄の損失は[From.Owner.GetAdjective]空軍に大きな打撃であり、国家全体にも計り知れない打撃だ。我々が悲嘆に暮れる中、[Prev.Owner.GetName]が[Prev.GetFullName]を英雄として祝福したことで、さらに悲しみは深まった。"
 ace_killed_by_ace.1.d_major:0 "[From.GetMissionRegion]から帰還したパイロットの報告よると、悪名高き[Prev.GetCallsign]率いる[Prev.Owner.GetAdjective]軍の飛行中隊が[From.GetCallsign]を執拗に狙った。[Prev.Owner.GetAdjective]機からの集中射撃を回避し敵数機を迎撃するも、[From.GetCallsign]は[Prev.GetWingShort]の[Prev.GetCallsign]に圧倒されていた。報告によれば[From.GetHerHim]は裏をかかれ、燃料タンクを見事に撃ち抜かれた。[From.GetName] [From.GetSurname]の[From.GetWingShort]に火災が発生し、業火の中、[From.GetMissionRegion]上を螺旋状に舞い落ちていった。\n\n[From.GetFullName]はその類稀なる勇気と功績によって多くの人に尊敬されていた。この国民的英雄の損失は[From.Owner.GetAdjective]空軍に大きな打撃であり、国家全体にも計り知れない打撃だ。我々が悲嘆に暮れる中、[Prev.Owner.GetName]が[Prev.GetFullName]を英雄として祝福したことで、さらに悲しみは深まった。"
 ace_killed_by_ace.1.a:0 "我々にとって計り知れない損失だ"
 ace_killed_other_ace.1.t:0 "[From.GetFullName]、[Prev.GetCallsign]を撃墜"
 ace_killed_other_ace.1.d:0 "[From.GetMissionRegion]での今回の任務は[From.Owner.GetAdjective]空軍にとって、様々な面で大成功を収めたと言える。報告によると[Prev.Owner.GetAdjective]軍パイロット、[Prev.GetName] [Prev.GetSurname]、通称[Prev.GetCallsign]の裏をかくという、[From.GetFullName]の英雄的な功績が際立っていた。[From.GetCallsign]が自身を囮に、[Prev.GetCallsign]を誘い込んだことで[From.Owner.GetAdjective]軍パイロットが[Prev.GetCallsign]の飛行隊へ急降下できたのである。[From.GetCallsign]は[Prev.Owner.GetAdjective]機を出し抜き、[From.GetMissionRegion]の上空から一斉射し[Prev.GetCallsign]を螺旋状に墜下させた。\n\n[Prev.GetFullName]は多くの[From.Owner.GetAdjective]人の命を奪ってきた、恐れられたパイロットだった。これは偉大な勝利であり、偉大な英雄の下に結束するとき、偉大な功業を成すということの証左である。"
 ace_killed_other_ace.1.d_major:0 "[From.GetMissionRegion]での今回の任務は[From.Owner.GetAdjective]空軍にとって、様々な面で大成功を収めたと言える。報告によると[Prev.Owner.GetAdjective]軍パイロット、[Prev.GetName] [Prev.GetSurname]、通称[Prev.GetCallsign]の裏をかくという、[From.GetFullName]の英雄的な功績が際立っていた。[From.GetCallsign]が自身を囮に、[Prev.GetCallsign]を誘い込んだことで[From.Owner.GetAdjective]軍パイロットが[Prev.GetCallsign]の飛行隊へ急降下できたのである。[From.GetCallsign]は[Prev.Owner.GetAdjective]機を出し抜き、[From.GetMissionRegion]の上空から一斉射し[Prev.GetCallsign]を螺旋状に墜下させた。\n\n[Prev.GetFullName]は多くの[From.Owner.GetAdjective]人の命を奪ってきた、恐れられたパイロットだった。これは偉大な勝利であり、偉大な英雄の下に結束するとき、偉大な功業を成すということの証左である。"
 ace_killed_other_ace.1.a:0 "この勝利は[From.Owner.GetName]全土で記憶されるであろう！"
 aces_killed_each_other.1.t:0 "[From.GetFullName]墜落"
 aces_killed_each_other.1.d:0 "直近の作戦中に、有名な[From.GetAceType]エースである[From.GetFullname]は遂に、恐れられたエースパイロット[Prev.GetFullName]と遭遇、長時間に渡る戦闘に臨んだ。弾薬が不足し脱出の可能性もなくなった[From.GetCallsign]は、[Prev.Owner.GetAdjective]機からの掃射をかいくぐり[Prev.GetCallsign]へ機体を激突させた。\n[From.GetCallsign]機と[Prev.GetCallsign]機が、ともに[From.GetMissionRegion]上で粉々に砕けて墜落するのが目撃された。\n\n[Prev.Owner.GetAdjective]の危険人物、[Prev.GetCallsign]が我々にとってもはや厄介者ではなくなったことは小さな慰めである一方で、尊敬を集める著名人であり、[From.Owner.GetAdjective]を鼓舞する人物が失われた。"
 aces_killed_each_other.1.d_major:0 "直近の作戦中に、有名な[From.GetAceType]エースである[From.GetFullname]は遂に、恐れられたエースパイロット[Prev.GetFullName]と遭遇、長時間に渡る戦闘に臨んだ。弾薬が不足し脱出の可能性もなくなった[From.GetCallsign]は、[Prev.Owner.GetAdjective]機からの掃射を受けながら、[From.GetWingShort]を巧みに操り[Prev.GetCallsign]へ機体を激突させた。\n[From.GetCallsign]の[From.GetWingShort]と[Prev.GetCallsign]の[Prev.GetWingShort]が、ともに[From.GetMissionRegion]上で粉々に砕けて墜落するのが目撃された。\n\n[Prev.Owner.GetAdjective]の危険人物、[Prev.GetCallsign]が我々にとってもはや厄介者ではなくなったことは小さな慰めである一方で、尊敬を集める著名人であり、[From.Owner.GetAdjective]を鼓舞する人物が失われた。"
 aces_killed_each_other.1.a:0 "しかしなお、我々にとって大きな損失であることに変わりはない"
 RAC_POL.2.t:0 "[GetNewspaperHeader]Race War"
 RAC_POL.2.d:0 "The recent government decision to strip the rights and status of ethnic minorities has resulted in violence across the country. Many citizens, emboldened by the government action, are treating it as permission to target neighborhoods and communities of the people targeted in the government action. Rumors of arson, murder, and looting caused the emergence of self-defense groups on both sides. These organized bands of fighters are constantly clashing and targeting each other. The government appears powerless or unwilling to curtail the unrest. In some cases, the local police forces have taken control of the situation, however, there are just as many cases of the police being accused of participating in the violence.\n\nThe only way to stop the violence is to revert the recent legislation or wait until the fighting has reached its conclusion."
 RAC_POL.2.a:0 "Improve Racial Situation (450 PP)"
 RAC_POL.2.b:0 "§YREQUIRES 450 POLITICAL POWER TO RESOLVE§!"
 RAC_POL.2.c:0 "Refuse Demands"
 RAC_POL.2.da:0 "WIN THE RACE WAR! SEND IN THE ARMY! (650 PP)"
 RAC_POL.2.e:0 "§YREQUIRES 600 POLITICAL POWER TO WIN§!"
 RAC_POL.2.f:0 "§YREQUIRES MILITARY POLICE III (Riot Control) TO WIN§!"
 RAC_POL.2.g:0 "§YREQUIRES MILITARY POLICE III (Riot Control) AND 600 PP TO WIN§!"
 WOM_POL.2.t:0 "[GetNewspaperHeader]Women's Rights Protests"
 WOM_POL.2.d:0 "The capital was brought to standstill today as thousands took to the street to protest for more rights for women. The protestors claim the government has long neglected the role women play in society and the lack of reforms ultimately weaken the nation and leaves women vulnerable. The successful protest inspired similar events in other towns and cities as well. The protestors also threatened to expand their actions to include more direct action to put pressure on the government to take their demands seriously.\n\nThe only way to stop the protests is to revert the recent legislation or wait until the protests have been suppressed."
 WOM_POL.2.a:0 "Improve Gender Situation (450 PP)"
 WOM_POL.2.b:0 "§YREQUIRES 450 POLITICAL POWER TO RESOLVE§!"
 WOM_POL.2.c:0 "Refuse Demands"
 SAGA_POL.2.t:0 "[GetNewspaperHeader]SAGA Rights Marches"
 SAGA_POL.2.d:0 "In a groundbreaking development, citizens gathered to march for recognition of SAGA rights. Members of this often overlooked and oppressed community came together with allies to pressure the government to take action and modernize laws on the issue. The march occurred in the capital. It is being hailed as a success and was largely peaceful. However, a countermarch organized nearby by opponents who argued the state should not compromise on the morality or feelings of the majority. These counter-protests were smaller than the main march. In other major cities and towns, there are plans to hold further marches in order to showcase how many people would be effected by legislation or policy changes on this issue.\n\nThe only way to stop the protests is to revert the recent legislation or wait until the protests have been suppressed."
 SAGA_POL.2.a:0 "Improve LGBT Situation (450 PP)"
 SAGA_POL.2.b:0 "§YREQUIRES 450 POLITICAL POWER TO RESOLVE§!"
 SAGA_POL.2.c:0 "Refuse Demands"
 UNION_POL.1.t:0 "[GetNewspaperHeader]Nationwide General Strike"
 UNION_POL.1.d:0 "A General Strike is being observed across the country by workers infuriated over new government policy which reduces the rights of workers. Opponents accuse the government of being bought out by employers and owners seeking to exploit the workers for further profits. Along with industrial and service workers, many shops in the major markets also shut down in solidarity. A government spokesman dismissed the strike as a weak gesture and insisted the government actions will lead to further economic growth and benefit the workers in the end. Despite the brave face, the government is certainly shaken by how aggressively the workers responded to the new policy.\n\nThe only way to stop the protests is to revert the recent legislation or wait until the strikers have been scabbed."
 UNION_POL.1.a:0 "Improve Worker Situation (450 PP)"
 UNION_POL.1.b:0 "§YREQUIRES 450 POLITICAL POWER TO RESOLVE§!"
 UNION_POL.1.c:0 "Refuse Demands"
 REL_POL.1.t:0 "[GetNewspaperHeader]Massive Religious Crackdown"
 REL_POL.1.d:0 "Religious officials working with security forces are ensuring obedience to the proper religious dictates being provided by the government. The government claims the strength of the nation is with the conformity of the citizens to the true practices of the faith. These efforts have seen certain communities facing intense scrutiny for their lack of conformity. For minority religions, they are facing restrictions on how they publicly present themselves, with security forces forcibly removing signs or advertisements deemed incompatible with the current policy. Some communities are fighting back, with reports of large clashes as there is concern the actions of the government are meant to destroy regional identities and centuries of religious practices. In other areas, mobs of enthusiastic government supporters are violently forcing obedience among their neighbors, leading to scenes of looting and intense violence.\n\nThe only way to stop the violence is to agree to a ceasefire or wait until the heathens have been sent to hell."
 REL_POL.1.a:0 "Agree to a Ceasefire"
 REL_POL.1.c:0 "Refuse Demands"
 REL_POL.4.t:0 "[GetNewspaperHeader]Massive Religious Crackdown"
 REL_POL.4.d:0 "Security forces across the country moved and seized houses of worship and property belonging to religious groups across the country. They are ensuring the new government policies are implemented with minimal interference from what they call religious fanatics. Many religious leaders are also being detained to better transition the population to a more pragmatic and material understanding of the world. However, this robust crackdown has not succeeded as many religious citizens instead clashed with security forces, demanding they vacate the seized properties and release their leaders. In several instances the clashes resulted in the police firing into crowds to disperse them. In other parts of the country, government buildings and vehicles are being looted or burned by those offended by the new policy. Many see the new policy as a threat to the identity of the people and their heritage. The government is already deploying more forces amid rumors that the military may have to eventually restore order.\n\nThe only way to stop the violence is to agree to a ceasefire or wait until the fanatics have been killed off."
 REL_POL.4.a:0 "Agree to a Ceasefire"
 REL_POL.4.c:0 "Refuse Demands"
 REL_POL.2.t:0 "[GetNewspaperHeader]Massive Religious Riots"
 REL_POL.2.d:0 "The new government initiative curtailing the privileges and standing of minority religions has enflamed members of those faiths and their supporters across the country. Crowds of protestors were confronted by supporters of the government initiative, leading to violent street clashes and open rioting in major cities across the country. Opponents to the policy accuse the government of engaging in sectarianism and persecution. Government supporters argue the new policy reflects the feelings of the wider public and that the majority cannot be dictated to. A government spokesman urged calm on both sides but stated the government remains committed to its new policy. So far several major neighborhoods have been badly damaged in the violence and riots.\n\nThe only way to stop the riots is to agree to revert our legislation or wait until the heretics see the error of their ways."
 REL_POL.2.a:0 "Agree to Revert Course"
 REL_POL.2.c:0 "Refuse Demands"
 REL_POL.3.t:0 "[GetNewspaperHeader]Religious Rights Protests"
 REL_POL.3.d:0 "Many joined protests held across the country calling for greater religious tolerance and more secularism in the state. The protestors came from a variety of groups and communities. Greater tolerance would expand the participation of religious minorities in the country, furthering the economic, social, and political development of the state. Many protestors even argued that secularism would preserve the reverence and prestige of the faith. Including it with government risks staining it with the sins and mistakes of man.\n\nThe only way to stop the riots is to agree to revert our legislation or wait until the protestors give up."
 REL_POL.3.a:0 "Agree to Revert Course"
 REL_POL.3.c:0 "Refuse Demands"
 generic.31.t:0 "Racial-Related Problems Arise"
 generic.31.d:0 "Several major cities and towns are being rocked by incidents of racial violence and confrontation. A recent incident involving a member of the racial minority community being mistreated ignited long simmering tensions with protests emerging in response. Representatives of the minority community note the unrest reflects a universal feeling of despair and anger over the current condition of oppression, racism, and blatant discrimination by society. Supporters of the current social order are forming self-defense groups and there are rumors this has only led to more violence. With the situation escalating, the government announced it would deploy police and security forces to restore order. The leading newspapers are divided, with some calling on the government to harshly restore authority and maintain societal norms, while others urge more dialogue and engagement with groups feeling estranged by the state or society."
 generic.31.a:0 "Ok"
 generic.32.t:0 "Racial-Related Problems Dissipate"
 generic.32.d:0 "A strange calm returned to the nation as the recent period of racial violence and tensions appears to have finally ended. The government reported overnight that no incidents of racial based attacks occurred. More significantly, many of the self-defense groups formed during the unrest are said to have disbanded. Some are praising the government for its actions during the crisis, however, there are critics who instead argue the violence only ended once the violence burned itself out. Regardless, markets are once again functioning, and many citizens are relieved to finally be able to leave their homes. Local government officials are already overseeing cleanup efforts in areas especially damaged during the recent violence."
 generic.32.a:0 "Powah!"
 election.2.t:0 "選挙: 国民が再軍備に反対"
 election.2.d:0 "来たる選挙では未だ[Root.GetRulingPraty]への支持が高く、人々は[Root.GetLeader]の指導力を信頼している。しかし[Root.GetLeader]が注力している軍事についての党方針は、大衆と、この方針を無思慮な主戦論だと考えている一部の重要な層には全く受け入れられていない。戦火はまだ我が国の国境まで至っておらず、ほとんどの人が[Root.GetName]が攻撃的な行動をとるのを見たくない。我々と国防に対する意見を同じくする他の主要な政党と協力するならば、我々の支持率が減少しても選挙後の統治を行うことはまだ可能である。"
