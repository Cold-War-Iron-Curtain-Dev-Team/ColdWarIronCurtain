 45_days_tt:0 "実行に§Y45日§!掛かるだろう。\n"
 stability.31.t:0 "軍事的弾圧の成功"
 stability.31.desc:0 "我々の迅速な対応が大変効果的であることが示された。行方不明の被徴兵者のもとを訪れるために地元の治安部隊と憂国の志士たちが一丸となって飛び回った。被徴兵者の多くは召集に応じないとどうなるかを知らされると、自発的に召集に応じた。軍首脳部は、誰であっても「来るべき場所」に来た人は、来なかった過去を裁かれたりしないと公式に宣言した。しかしなお、多数の人が国のために武器をとることを拒絶し、そして逮捕された。"
 stability.31.a:0 "確固たる行動が悪化を防いだのだ"
 stability.32.t:0 "徴兵暴動"
 stability.32.desc:0 "状況の打開に軍事力を用いる試みは失敗続きだ。世論の反応の素早さは、政府中枢内部の誰かが我々の計画をマスコミにリークしたことを示している。憲兵隊などの法執行機関がコネのある徴兵逃れを逮捕しようとしたところ、戦争と強制徴兵を終わらせろと要求する群衆に阻まれた。警察と抗議する群衆が街頭で衝突することもしばしばあり、兵士が自衛のために発砲して多数の死者を出す事態を招いた。警察は事態を収集するまで数時間を費やした。\n\nバリケードが撤去され死者が埋められると首都は嫌な雰囲気に包まれた。担当部署は新兵の人数に変化はないと報告している。このような状況であとどれくらい戦い続けられるのか、政府関係者の多くは疑問に思っている。"
 stability.32.a:0 "状況必ずしも好転せず、大勢もまた我に利あらず"
 stability.33.t:0 "徴兵への反乱"
 stability.33.desc:0 "状況の打開に軍事力を用いる試みは失敗続きだ。世論の反応の素早さは、政府中枢内部の誰かが我々の計画をマスコミにリークしたことを示している。憲兵隊などの法執行機関がコネのある徴兵逃れを逮捕しようとしたところ、戦争と強制徴兵を終わらせろと要求する群衆に阻まれた。警察と抗議する群衆が街頭で衝突することもしばしばあり、兵士が自衛のために発砲して多数の死者を出す事態を招いた。\n\nその後、すぐに事態は収拾不能となった。多数の市民が兵士に突進し、自ら武装するために警察署を襲撃したのだ。いまや本国のいくつか都市では武装した反政府勢力が暴動を起こしている。皮肉にも、彼らには戦う意志のある兵士を探すことについての問題はないようだ。"
 stability.33.a:0 "なんと、では奴らは「今」戦いたいというのか!?"
 stability.34.t:0 "徴兵制度の改革が効果を実証"
 stability.34.desc:0 "より大規模な兵力補充の一環として政府が承認した社会施策は極めて評判が良いことが実証された。新しい莫大な利益と共に高額な給与や頻繁な休暇が挙げられることもあるが、これらの大部分は戦争による未亡人や孤児を支援するための政府の政策にあてられる。軍隊において果たされる国民の義務を拒絶することを正当化する人々の数は減少しつつあり、徴兵逃れをあからさまに支持する人も完全に姿を消した。\n\n実際に近頃では政府を後押しする世論の高まりも著しい。多くの人が[Root.GetAdjective]が生存に直結する問題であると気付きはじめたのだ。"
 stability.34.a:0 "賢明な決断だ"
 stability.35.t:0 "第591懲罰大隊"
 stability.35.desc:0 "状況の厳しさに鑑み、軍最高等司令部は市民が自国を守る義務の回避は許されるものではないことを示すため、より徹底した措置が必要と判断した。あちこちに影響力を駆使して徴兵回避を行った者とその一派を慎重に選定し、複数の個所に今朝未明、憲兵部隊の手が入った。寝巻のまま、彼らは軍に徴兵されたことに気が付き、外部の者からの破壊行為を避けるため、軍により警備された兵舎へ集められた。\n\nこの情報はいち早く市民の間に広まった。これまで、召集令状を無視して逃げることができると信じていた人のほとんどは、覚悟を変えた。全国の徴兵事務所は、徴兵回避をしていた「友人」が自首した場合に、どのように取り扱われるのかを細かく訊ねる者が増加していると報告している。"
 stability.35.a:0 "彼らはいつか自らを取り戻すだろう"
 stability.36.t:0 "地方の名士が抗議の声をあげる"
 stability.36.desc:0 "状況の厳しさに鑑み、軍最高司令部は市民が自国を守る義務の回避は許されるものではないことを示すため、より徹底した措置が必要と判断した。あちこちに影響力を駆使して徴兵回避を行った者とその一派を慎重に選定し、複数の個所に今朝未明、憲兵部隊の手が入った。寝巻のまま、彼らは軍に徴兵されたことに気が付いた。彼らの家族はこの決断に抗議するため大規模な支援団体の組織化に動いている。陸軍省には、単純労働者からの工場管理者を他省庁の役人に戻してほしい、戦争に直結するこれらの人々がなぜ職場から去らねばならないのか理由を知りたいという電話や手紙が殺到している。内閣にさえ、おそらく自分の息子の安全を恐れているのか、戦争について再考するように考えている者もいる。"
 stability.36.a:0 "彼らには義務感がないのか？"
 stability.37.t:0 "「滅びと聖なる義務」"
 stability.37.desc:0 "「もちろん、私は死にたくない。学校へ通い、そして卒業して、女性と恋に落ち、家庭を持ちたい。しかしもし、この戦争に負けたのならばこの夢も叶うことはないだろう。だから私は戦うのだ」\n\n国内すべての主要な新聞へ匿名で送られたこの投書は大きな反響を呼んだ。当初は徴兵回避をしようとしたが、その後に自分の国を守る為に戦わねばならないことを認識した兵士のものであると主張され、この投書は共感を得た人達の心を打った。国に跨る徴兵委員会には、依然として招集を拒否する人の数が、国家や自らの生き方を守る為に、呼び出されるまでもなく新たに志願する兵士達を上回っている事が報告されている。"
 stability.37.a:0 "彼らの命を無駄にはできない"
 stability.38.t:0 "臆病者の最期"
 stability.38.desc:0 "「彼らは明け方に彼を壁へと導いた。彼は最後のタバコを断ったが、目隠しを受け入れた。彼の最後の言葉は、沢山の苦悩を与えてしまった母親への謝罪の言葉であった。銃殺隊が狙いを定める。数分して、医師が彼の死亡宣告を行った」\n\n徴兵を回避した人々全てを捕まえることは叶わなかったが、それでも当局によって多数を逮捕することが出来た。我々の置かれている深刻な状況を鑑みて、陸軍省は出頭の義務を果たさなかった為としてこれらの男性を軍事法の下で裁くことに決定した。最初の一団へと死刑判決が下され、そしてその死刑囚は銃殺隊によって処刑されていった。これらの措置はどうやら期待通りの効果を発揮したようだ。多くの人々が、臆病者としての不名誉な死の確実さよりも、戦場での死の可能性を選んだようである。"
 stability.38.a:0 "このように至ったのは遺憾である"
 stability.39.t:0 "平和のための犠牲者"
 stability.39.desc:0 "「彼らは明け方に彼を壁へと導いた。彼は最後のタバコを断ったが、目隠しを受け入れた。彼の最後の言葉は、沢山の苦悩を与えてしまった母親への謝罪の言葉であった。銃殺隊が狙いを定める。数分して、医師が彼の死亡宣告を行った」\n\n義務に着任しなかったために処刑された男性の判決が公表されたが、反対の効果をもたらしたようだ。この結果を恐れて人々が国旗の下に集まるのではなく、処刑された者たちが平和活動のための殉教者に仕立て上げられることとなった。彼らの名前や人生の物語が、彼らを最大限よく見せるための極めて明確な編集とともに出版されている。戦争の終結を要求する大規模な平和集会がいくつかの主要都市で開催されている。陸軍省は、義務に出頭しないことを公然と述べ、いかなる状況においても、処刑される者となる以外で新たな処刑の共犯者にならないと書かれた多数の被徴兵者からの手紙を受け取ったと報告している。"
 stability.39.a:0 "諸問題は必ずしも改善されていない"
 stability.40.t:0 "[Root.GetNameDef]の新規施策"
 stability.40.desc:0 "今日のラジオ演説において、[Root.GetLeader]は「社会革命」を発表した。発表に続いて、彼は社会生活のすべての部分に触れ、復帰するすべての兵士に、教育、高賃金の仕事、潤沢な年金を約束する改革制度を計画した。彼はまた、休戦調印がなされた日から、若い世帯のために手頃な価格で住宅を取得できるようにする大規模建設計画を実行する旨発表した。このことは世論に大きな影響を与えているようだ。全国の徴兵事務所は、応招兵がこの特別ボーナスを確保するために、最前線部隊への配属を除いて現在の紛争後にまで召集期間を延長するよう申し入れていると報告している。"
 stability.40.a:0 "それで、我々はこれらの費用をどうやって支払うんだ……？"
 strikes_event.1.t:0 "秩序の回復"
 strikes_event.1.desc:0 "軍最高司令部は素早く対応し、訓練中の部隊を任務に就かせるとともに、軍務から離れる臨時部隊を編制した。大多数のストライキ参加者は死亡事故に至りかねない武力との対峙を望まなかったため、これらの部隊は工場の門をくぐり、望ましい効果をもたらした。少数の者が共通の大義をもって兵士を説得しようと試みたが、なぜ、後方の居心地のよいところにいる労働者が、前線で戦っている者たちを失望させなければならないのか兵士が尋ねたとき、効果的に答える言葉を見つけることができなかった。"
 strikes_event.1.a:0 "確かになぜだろう"
 strikes_event.2.t:0 "血の月曜日"
 strikes_event.2.desc:0 "軍高位司令官は素早く対応し、訓練中の部隊を任務に就かせるとともに、軍務から離れる臨時部隊を編制した。しかし、この部隊の影響を受けている都市への移動は、ストライキ参加者が鉄道を封鎖したことにより徒歩による移動となったため、参加者に準備をする時間を与えたため、想定されたよりも困難なものとなった。我が部隊が封鎖された工場に到着した際には、既にストライキ参加者は準備を整えていた。軍部隊による道路の封鎖を排除しようとする試みは、石や瓶を投げつける労働者たちによる激しい攻撃に遭遇した。\n\n軍部隊は自衛のために発砲し、ストライキ参加者に数名の死者とそれを上回る負傷者が出た。これは暴徒を激怒させただけで、「殺人者！」の悲鳴が上がった。首都の情勢はストライキ参加者に有利となった。深夜には、兵士は退却し、バリケードがそのまま残された。\n\nそれ以上の強制的な措置は行われなかった。ストライキ参加者は工場を支配下に置き、工場の操業は行われていない。"
 strikes_event.2.a:0 "思ったようにいかないな"
 strikes_event.3.t:0 "生産分野の英雄"
 strikes_event.3.desc:0 "「産業戦争は、単なる行進する師団や爆撃する飛行機以上のものを意味する。兵士が国家のために殉じる以上の意味がある。産業競争は何よりもまず、工場や鋳造所で勝利するものである。組立ラインにおいて戦いを放棄することは、前線で戦いを放棄することと同義である。そして、組立ラインの勝利は、前線が勝ち取った勝利と同様に称えられるべきである」\n\n利用可能なすべてのプロパガンダ資源は、最善を尽くした軍需産業の労働者へ向けられている。[Root.GetLeader]は、100%以上のノルマを達成した労働者に対しての新しい賞を自ら承認し、最初の受賞者が自己流で取り組んでいる多くの労働者に指導するために全国行脚を行わせた。\n\nこのことにより多くのストライキ参加者が考え方を再考したようだ。これまでに影響を受けた全ての工場で作業が再開された。"
 strikes_event.3.a:0 "だれもかれも英雄だな"
 strikes_event.4.t:0 "戦争生産部"
 strikes_event.4.desc:0 "[Root.GetLeader]は本日、徴兵制度について小規模な変更の実施を発表した。熟練工は以前から徴兵を免除されていたが、この特例はもはや削除され、徴兵を猶予されていた全ての者が即時に徴兵されることになる。同時に、陸軍省は工場経営者にその能力の不足が認められる場合、戦争遂行に関連する製品の製造に関する直接管理を実施する権限を与えられる。\n\nこの発表、特に命令不服従の兵士と同様の取扱いを受けることになることにより、影響を受けた都市においては、静かなあきらめをもたらした。工場の労働者の士気は地に堕ちたままではあるが生産が再開された。"
 strikes_event.4.a:0 "当初からやっていたはずだ"
 strikes_event.5.t:0 "無視される国家"
 strikes_event.5.desc:0 "[Root.GetLeader]は本日、徴兵制度について小規模な変更の実施を発表した。熟練工は以前から徴兵を免除されていたが、この特例はもはや廃止され、徴兵を免除されていた全ての者が即時に徴兵されることになる。同時に、陸軍省は工場経営者にその能力の不足が認められられる場合、戦争遂行に関連する製品の製造に関する直接管理を実施する権限を与えられる。\n\nこの発表、特に命令不服従の兵士と同様の取扱いを受けることになる個所については、影響を受けた都市では、嘲笑の嵐で迎えられることになった。警官が労働者に召集令状を送達するために送り込まれたが、労働者にこの紙切れを持って帰るように言われた。"
 strikes_event.5.a:0 "そうすべきかもしれないのだ"
 strikes_event.6.t:0 "立派に食べる者"
 strikes_event.6.desc:0 "ストライキが発生したことについて言及することなく、[Root.GetLeader]は、軍需産業に携わる労働者に対し、体力を維持するための砂糖、コーヒー、肉の追加供給を受けることを本日発表した。悲しいことに、政府が特別にチョコレートを配給するという噂は、間違っていることが判明した。\n\nストライキの首謀者は、労働者が仕事に復帰しないように試みるも、ほとんどの人はパンの配給を受けることのみに幸せを感じ、「平和とパン」を要求していないようだ。"
 strikes_event.6.a:0 "彼らはより良い報酬を得る"
 strikes_event.7.t:0 "ブラック・オーク作戦"
 strikes_event.7.desc:0 "部隊が一晩中町の外に駐留し、大規模な演習と軽い訓練を続け威嚇を行った。太陽が地平線上に現れ、工場でバリケードを構築している労働者たちが日勤者の支援に望みを託している最中、攻撃側の隊列が動いた。疲労した労働者は、素早く対応し、組織だった抵抗を行うのに出遅れた。囚人を守るために小部隊を残して、軍は町を掃討し、工場労働者のリストにより全ての者が逮捕される。正午までに、軍は都市を完全に支配し、外出禁止令を布告した。これ以上の抵抗はもはや期待できない。大部分の労働者は、仕事に復帰するという条件ですぐに解放され、ストライキの首謀者は拘束され、裁判にかけられる。死刑判決がなされる模様だ。"
 strikes_event.7.a:0 "要求が変更された"
 strikes_event.8.t:0 "オークストリートの戦い"
 strikes_event.8.desc:0 "部隊は夜通し町の外に駐留したが、軽重織り交ぜた訓練が驚きを与えた。部隊が動いたとき、すでに労働者は警戒しており、準備ができていることが分かった。最初の攻撃は雨あられと降り注ぐ投石により失敗に終わった。銃剣を着剣して行われた2度目の攻撃は、野蛮な混戦になり反撃され、多数の死者と倒れている者が路上に残された。\n\n担当将校は部隊を整理するために引き上げたが、労働者はバリケードを強化し、退却の際に残された武器により武装した。明日、2日目の戦闘が予定されているが、軍司令官は、勝機があるとはもはや信じていない。"
 strikes_event.8.a:0 "打てる手がどんどんなくなりつつある"
 strikes_event.9.t:0 "労働者権利保護法"
 strikes_event.9.desc:0 "首都中に緊張が高まりつつある中、[Root.GetLeader]は、戦時においてさえも労働者の権利を保護する新法を発表した。この法律は、解雇されない病気休暇、全労働者への傷害保険の義務化、労働組合への加入及びこれまで類を見なかったものであるが、女性被用者に対して子供を出産後に休暇を取得する権利を包括したものである。\n\n政府関係者は多くがこれによりストライキ参加者を完全に屈服させる以上のものだと考えている。全工場で操業が再開された。"
 strikes_event.9.a:0 "うまくいけばこれで十分だ"
 mutiny_event.1.t:0 "反乱鎮圧"
 mutiny_event.1.desc:0 "営門と塹壕間における何時間にもわたる緊迫した交渉の末、我が軍における反乱は終わった。彼らがこの戦いに勝てる見込みがなくなったことを直視し、反乱軍はすぐに帰営することにした。\n\n一番の問題は、命令を拒否した者への対処となる。軍最高司令官は温情に対処することを選択し、彼らが厳罰に処せられないことを反乱軍に保証した。わずかに兵士が数名降格されたり他の部隊へ配置換えになったのみであった。"
 mutiny_event.1.a:0 "これが最後となることを祈ろう"
 mutiny_event.2.t:0 "効果のない威嚇"
 mutiny_event.2.desc:0 "反乱軍を威嚇して屈服させようという試みは、反乱軍を鎮圧するために派遣した部隊をみてわずかに動揺が生じたのみで見事に裏目に出てしまった。最前線で培われた経験により反乱軍は速やかに自らの陣を構えたため、彼らを倒すには多大なる犠牲も持って試みなければならない。\n\n忠誠を誓った部隊に配属された士官は撤退し、次なる指令を待っているが、この小規模な勝利により反乱軍の決意が高まったことは間違いない。"
 mutiny_event.2.a:0 "このような結末を予測できた者は誰もいなかった"
 mutiny_event.3.t:0 "「何のために戦うのか？」"
 mutiny_event.3.desc:0 "「兵士が自分のやっていることに対して本当に価値があるかどうか疑問に思うのはよくあることだ。諸君に犠牲を強いることをどうやって正当化できるのだろうか？諸君に対し、これまで一度も見たことのない目標のために死ねと言えるのだろうか？\n\n我々が今を生きなければならないということは不幸な事実である。我々は自由、家庭そして我らが[Root.GetAdjective]の生き方を守るために戦争に立ち向かわなければならない運命である！我々はこの戦争を望んでいなかったが、巻き込まれてしまった！諸君には私が私利私益のために何かを頼んだことはないことは承知のとおりであり、逆に諸君は勝利を得るためにあらゆることをしてくれているのも知っている」\n\n部隊を前にしての[Root.GetLeader]の演説は、望ましい効果をもたらしたようだ。兵士の歓声が自然と沸き返り、いつも以上に文句を言わずに任務に戻っていった。"
 mutiny_event.3.a:0 "良い演説だ"
 mutiny_event.4.t:0 "戦時法に対する反逆"
 mutiny_event.4.desc:0 "陸軍省が現在勃発している軍の反乱について、これ以上広く知られることを防ぐために最善を尽くしているが、手紙を検閲する程度でしかない。休暇を取った兵士が陸軍はこの戦いにおいてもはやこれ以上の不要な流血を望んでいないという発言を速やかに広めている。\n\n反乱については特に言及していないが、[Root.GetLeader]は本日、政府がこの争いに関して反逆するような責任感の欠如に対しては、何らかの対応策を検討すべきであると発表した。\n\n反乱罪についてはよく知られており、反乱軍への公的支援は打ち切られている。大衆からの支援もほとんど認められず、兵士たちは静かに任務に復帰した。"
 mutiny_event.4.a:0 "詳しく説明するべきではなかった"
 mutiny_event.5.t:0 "弾圧の試みは水泡に帰した"
 mutiny_event.5.desc:0 "陸軍省が現在勃発している軍の反乱について、これ以上広く知られることを防ぐために最善を尽くしているが、手紙を検閲する程度でしかない。休暇を取った兵士が陸軍はこの戦いにおいてもはやこれ以上の不要な流血を望んでいないという発言を速やかに広めている。\n\nこの流れを止めるための政府の試みは完全に失敗した。秘密警察からの報告によると、反乱軍は一般市民の強い支持を受け、反乱軍のみを鎮圧することは不可能である。"
 mutiny_event.5.a:0 "このような法律の軽視は憂慮すべきだ"
 mutiny_event.6.t:0 "[Root.GetAdjective]の和平提案"
 mutiny_event.6.desc:0 "[Root.GetLeader]は本日、現在進めている和平提案が失敗したと発表した。この不幸な出来事の要因は非常に複雑なものであるが、[Root.GetAdjective]が相手側に対し、全ての損害を賠償すること、完全なる武装解除、相手方が武力衝突を引き起こしたことを公式に認めることの要求がきっかけとなった可能性がある。\n\n敵方もまた対応してきており、我々の寛大なる要求に対し無条件降伏であると位置づけている。彼らは苦しくても最後までこの戦いを継続すると公言している。\n\n敵は明らかに正気を失い、継戦を誓っており、和平状態を強いる反乱軍の試みは崩壊した。"
 mutiny_event.6.a:0 "全く残念なことだ"
 mutiny_event.7.t:0 "軍事的鎮圧が成功"
 mutiny_event.7.desc:0 "小規模の反乱軍団が徹底抗戦を決意していた状況にあったにも関わらず、反乱鎮圧作戦は全くもって成功に終わった。技術よりも数に頼った忠誠派の民兵は暴徒の拠点を包囲し、降伏を要求した。ほとんどの兵士たちは、自国民に対し手を挙げることなく従順に降伏した。\n\n反乱軍指導者は非公開の軍事裁判により裁かれることになるが、その他の兵士は前線へ送られ、新たな反乱軍を組織するのを防ぐために別々の部隊へ配属されることになる。"
 mutiny_event.7.a:0 "よくやった"
 mutiny_event.8.t:0 "対峙する兄弟"
 mutiny_event.8.desc:0 "労働者と兵士の評議会設立のための選挙を阻もうとする我々の試みは、状況をさらに悪化させてしまい、最も悲観的な予測よりも悲惨なものとなった。降伏するどころか、反乱軍たちは暫定評議会を立ち上げて野戦司令官を選抜し、街路に防御陣地を構築し始めた。彼らが戦うつもりなのは明らかだ。\n\n陸軍に生じた亀裂は今や全部隊に波及し、血のつながった者同士でさえ立場を違える事態が生じている。[Root.GetNameDefCap]は内戦の瀬戸際に立っている。"
 mutiny_event.8.a:0 "悪化し続けるだけだな"
 mutiny_event.9.t:0 "新種の士官"
 mutiny_event.9.desc:0 "軍から強い反対があったにも関わらず、[Root.GetAdjective]陸軍の全ての部隊において司令官選挙が強行された。結果は驚くべきもので、選ばれた者の大半が豊富な戦場での経験を持つ熟練の兵士であった。多くのエリート将校はこれを個人的な侮辱と受け取ったようだが、ほとんどの兵士がこの状況を全面的に歓迎するであろうことは疑いの余地がない。"
 mutiny_event.9.a:0 "こんなことがうまく行くはずがない、そうだろ？"
 if_they_accept:0 "彼らが受諾した場合:\n"
 generic.12.t:0 "[From.GetAdjective] Attempts to Sabotage Suez"
 generic.12.d:0 "Military intelligence indicates the [From.GetAdjective] intend to use large-scale demolitions and blockships to sabotage the Suez Canal. If we wish to stop them, we do not have much time."
 generic.12.a:0 "We cannot allow this!"
 generic.13.t:0 "[From.GetAdjective] Attempts to Sabotage Panama"
 generic.13.d:0 "Military intelligence indicates the [From.GetAdjective] intend to use large-scale demolitions and blockships to sabotage the Panama Canal. If we wish to stop them, we do not have much time."
 generic.14.t:0 "[From.GetName] Issues Diplomatic Protest"
 generic.14.d:0 "[From.GetAdjective] envoys have lodged a strong diplomatic protest with our government regarding the presence of our attachés in nations they are currently in a military conflict with. They demand the immediate recall of our military mission."
 generic.14.a:0 "It is a reasonable request."
 generic.14.b:0 "Our attachés will be sent where we please."
 generic.15.t:0 "[From.GetName] Recalls Attaché"
 generic.15.d:0 "In response to our demands, [From.GetNameDef] has withdrawn their military mission to our enemies."
 generic.16.t:0 "[From.GetName] Maintains Attaché"
 generic.16.d:0 "In spite of our demands, [From.GetNameDef] has refused to withdraw their military mission to our enemies, stating that \"we have no business interfering with internal [From.GetAdjective] affairs\"."
 generic.16.a:0 "We will see about that."
 generic.17.t:0 "[From.GetName] Falls Ill"
 generic.17.d:0 "In [From.GetHerHis] service to [From.From.GetNameDef], it seems [From.GetRank] [From.GetName] has pushed [From.GetHerselfHimself] too far. As a result of the bad climate in their operational area, the [From.GetRank] has now fallen ill, and will likely need some time to recover. Until [From.GetSheHe] gets well, [From.GetSheHe] will not be performing at [From.GetHerHis] usual level."
 generic.18.t:0 "[From.GetName] Wounded"
 generic.18.d:0 "In bringing the battle to a successful conclusion, it seems [From.GetRank] [From.GetName] put [From.GetHerselfHimself] at a bit too much risk while leading [From.GetHerHis] men. [From.GetSheHeCap] has been wounded, and it will likely take some time for the wounds to fully heal, until which time the [From.GetRank] will not be performing at [From.GetHerHis] usual level."
 spr.1.d:0 "With the signing of the Pact of Madrid, the Spanish State has ended it's period of Isolation. In a treaty signed by Spain and the United States, the United States will give Spain money to help improve their military and their economy. In return for the US aid to Spain, Spain has agreed to allow the US to use land for air and naval bases in Spanish territory. This new treaty has ended a period in Spanish history since the end of World War II that was marked by Spanish isolationism and being hated by most countries for being fascist and pro-Nazi Germany and pro-Axis Powers. The Pact is seen as a new beginning for Spain and as a sign that the world is coming around to view Spain in a more positive light."
 spr.2.d:0 "In a speech held by [SPR.GetLeader], it was announced that Spain would expatriate former Nazis escaped into Spain."
 spr.3.d:0 "As planned, most of the old shirts have now been removed from their positions and replaced with new members giving full support to our regime."
 spr.4.d:0 "United Nations have gained another member state. As announced by Dag Hammarskjöld, Spain has been accepted to become a member state in the UN."
 spr.8.d:0 "Spain, which recently saw the ousting of its fascistic dictator Francisco Franco by the communists has now asked us to protect them. In exchange for this we would gain a new ally in Iberia and a huge control over their country."
 pru.3.d:0 "Following the coup leaving Manuel A. Odría as military dictator of Peru, the American Popular Revolutionary Alliance has been quickly outlawed to stomp out opposition. It's leader, Víctor Raúl Haya de la Torre has quickly been a target as police barge into his office to find it completely abandoned. A quick investigation has found that De La Torre managed to escape to the Ecuadorian embassy just in time with most of his important belongings."
 cominplot.1.d:0 "In 1948, Yugoslavia was expelled from Cominform citing \"nationalist elements\" that had \"managed in the course of the past five or six months to reach a dominant position in the leadership\" of the KPS. The expulsion effectively banished Yugoslavia from the international association of socialist states. After the expulsion, Tito suppressed those who supported the resolution, calling them \"Cominformists\". Now these cominformists have started to organize better and started formulating a plan to get rid of Tito and return Yugoslavia to the right path."
 cominplot.2.d:0 "After weeks of planning, the cominformists have managed to kill Tito. While walking in Nikola Pasic Square, a man approached Tito and fired two shots towards him with a TT-33 pistol with one bullet hitting his neck and another his left lung. Tito was rushed to Vojnomedicinska akademija hospital in Banjica, where he was pronounced dead 20 minutes later. The attacker, 24-year-old Veselko Sedlacek was shot and died on scene."
 cominplot.3.d:0 "Josip Broz Tito, leader of Yugoslavia was assassinated yesterday in Belgrade. During a walk in Nikola Pasic Square in Belgrade, 24-year-old Veselko Sedlacek shot Tito two times, striking him in his neck and left lung. Tito was immediately rushed to Military Medical Academy Hospital in Banjica neighborhood of Belgrade where he was pronounced dead 20 minutes later. The attacker was shot and killed on scene. The Security Services are now investigating the motive behind this murder. Rumors are that the assassination was organized by a pro-Soviet group know as the Cominformists."
 cominplot.4.d:0 "The feared leader of UDBA, Aleksandar Rankovic has just been killed. While standing outside the headquarters of the UDBA, a sniper managed to hit his head killing him instantly. The perpetrator managed to escape, but left a note stating his motive."
 cominplot.5.d:0 "Our government has been attacked! Earlier today, disgruntled Cominformist insurgents struck hard and fast at the capitol building in [YUG.Capital.GetName]. In a precise strike, the rebel groups broke through a skeleton crew of military guards, storming the building and killing [YUG.GetLeader] in a veritable blitzkrieg. Now, the Cominformists have seized power and declared a new government aligned with the Cominform and the [SOV.GetNameDef]."
 cominplot.6.d:0 "Pockets of Cominform aligned insurgents stormed the Yugoslav capitol building in [YUG.Capital.GetName] early this morning. Since the schism between the [SOV.GetNameDef] and the [YUG.GetNameDef] in the early years of the Cold War, the two Communist nations have been notably sour. Now that the previous government has been overthrown in a precision strike on the Yugoslav capitol, the [YUG.GetRulingParty] has begun to further open relations with the Cominform and [SOV.GetLeader]'s Russia."
 cultural_events.5.d:0 "Today, September the 11th, 1977 we see technology adorn the homes of some today with the Atari 2600, a home console unit launching at $199 USD in the North American Market with two joysticks and a copy of the \"Combat\" video game with eight other games available for purchase as of now."
 cultural_events.6.d:0 "In Technology News, today July 15th, 1983 we see the release of the Famicom (Family Computer) from the famed Nintendo company, the masterminds behind Donkey Kong which steadily sold in the Home Market. The Famicom comes with three games Donkey Kong, Donkey Kong Jr., and Popeye, reports have surfaced of early units crashing due to a chipset issue, this remains to be fixed."
 cultural_events.7.d:0 "\nLines are long and hopes are high as today October 18th, 1985 Nintendo has finally released their Nintendo Entertainment System with a redesigned case compared to it's Japanese blood brother the Famicom, released 2 years earlier. Revealed at the Consumer Electronics Show this zero insertion force design brings a front loading designs instead of a top loader. This new system releases with 17 games, 10-Yard Fight, Baseball, Clu Clu Land, Duck Hunt, Excitebike, Golf, Gyromite, Hogan's Alley, Ice Climber, Kung Fu, Pinball, Soccer, Stack-Up, Tennis, Wild Gunman, Wrecking Crew, and Super Mario Bros which has shown within the first 24 hours of it's release to be the most popular of the bunch."
 cultural_events.8.d:0 "The soldier lost to time has surrendered after local Norio Suzuki convinced him to relieve his position after getting in contact with his former superior, Major Yoshimi Taniguchi. Major Taniguchi flew with with Suzuki back to Lubang to instruct Hiroo Onoda to formally surrender at Malacañang Palace. He surrendered with his sword, his functioning Arisaka Type 99 rifle, 500 rounds of ammunition and several hand grenades, as well as the dagger his mother had given him. After killing at least 30 he was given a pardon from President Ferdinand Marcos."
 KOR_RAID.3.d:0 "The conflict on the Korean Peninsula has reached the highest echelons of the South Korean government, as North Korea has unsuccessfully attempted to assassinate President Park Chung Hee in his personal residence, the Blue House. Unit 124, North Korea's most prestigious commando forces, was chosen by Kim Il-sung himself to assassinate Park so that South Korea, under a leadership crisis, will not be able to properly respond to an invasion of North Korea. The raid was unsuccessful, however, as their plan was prematurely started due to an unlucky encounter by local police, followed by the quick response of the ROK Army. This raid is a representation of the lengths the North Korean regime will do to attain its goals, and observers are expecting a retaliation of similar nature by the South Korean government."
 nic.1.d:0 "Another election dawns upon us. The elections of course aren't fair, as Anastasio Somoza García has rigged them in his favor meaning any means to change power democratically is futile. However, this is also an opportunity to attempt overthrowing Garcia and restoring proper democracy. What shall it be?"
 nic.2.d:0 "In Nicaragua, democratic opposition has launched a revolution against the corrupt regime of Anastasio Somoza García. In a radio speech held by leader of the revolution, Emiliano Chamorro Benard, he encouraged everyone to take up arms and reclaim the country from the corrupt dictator and back into democracy."
 nic.3.d:0 "Shortly after the constitution was amended to allow Somoza to run again in the elections, poet Rigoberto López Pérez managed to infiltrate a party organized by loyal cadres and shot the dictator on his chest. The guards quickly eliminated the shooter. The shot was not deadly, but it required special treatment. Somoza was transported to the nearby Panama Canal to be operated. However, local anesthetic doctors did not take into account the special needs of an overweight and diabetic dictator, and Somoza fell into a coma during the operation. A couple of days later he died, transferring the power to his son."
 nic.4.d:0 "Our dear president Luis Somoza Debayle has suffered a heart attack and died just moments ago. Having been born in 1922, he experienced the rise of his father as the effective dictator of Nicaragua and took up the presidency following his assassination in 1956. Although he allowed elections and a new president in 1963, the real authority was still in the hands of him and his brother Anastasio Somoza Debayle. Despite foreign claims of rampant corruption and heavily restricted civil liberties, Somoza has ruled more lightly than his father and played a key role in the creation of a Central American single market. Following his death, there appeared to be great optimism throughout our country for a change in government and the Sandinista rebel organization has attracted a surge of popular support. However, Anastasio has taken up the presidency and, without any unexpected resistance, it appears that the Somoza dynasty will remain in power for the foreseeable future."
 BUL.100.d:0 "We have just received sad news from Moscow. Our leader, Georgi Dimitrov, has just passed away in Barvikha sanatorium near Moscow. According to Moscow, he had complained about feeling sick few hours before and had gone to rest. When doctors went to check up on him, they found he had died from an apparent heart attack about 30 minutes ago.\n\nSome however speculate that he was actually poisoned by the orders of Stalin for his closeness with Tito and his \"Balkan Federation\" idea. A state consisting of Yugoslavia and Bulgaria would be too large and independent to be controlled by Moscow.\n\nOf course these are just rumors and we cannot prove anything. Now however we must appoint his successor. Our best candidate is Valko Chervenkov, a strong supporter of Stalin and his policies."
 Thai_Focus_6_desc:0 "The 7th General election has just been concluded. It was an additional election of members of the House of Representatives based on the number of citizens under the Transitional Provisions of the Kingdom. The number of representatives in each province is calculated by holding 150,000 people per 1 representative, because this election is about additional members of the House of Representatives. Therefore, elections were held only in 19 provinces, resulting in an additional 21 members of the House of Representatives from the existing 99 people. Of the total 3,518,276 eligible voters, there were 870,208 voters, representing 24.27%. The province with the most voting activity was Sakon nakonn Accounting for 45.12%, with Udon Thani having the least number of people voting, 12.02%. This election is also somewhat historical for us, as for the first time a woman, Orapin Chaiyakan, was elected to the House of Representatives of Thailand."
 KPA_Coup.1.d:0 "We have received urgent news. Leading North Korean figures from the Soviet-Korean faction and the Yan'an faction, with support from the Soviet Union and China are attempting to overthrow Kim-Il Sung. Kim Il-sung became aware of the plan upon his return from Moscow and responded by delaying the plenum by almost a month and using the additional time to prepare by bribing and coercing Central Committee members and planning a stage-managed response. When the plenum finally opened Choe Chang-ik made a speech attacking Kim Il-sung for concentrating the power of the party and the state in his own hands as well as criticizing the party line on industrialization which ignored widespread starvation among the North Korean people. Yun Kong-hum attacked Kim Il-sung for creating a \"police regime\". Kim Il-sung's supporters heckled and berated the speakers rendering them almost inaudible and destroying their ability to persuade members. Kim Il-sung's supporters accused the opposition of being \"anti-Party\" and moved to expel Yun from the party. Kim Il-sung, in response, neutralized the attack on him by promising to inaugurate changes and moderate the regime. But is this enough for most? Or will Kim-Il be overthrown regardless?"
 ENG_event.1.t:0 "English Reconstruction Complete!"
 ENG_event.1.d:0 "After years of toil and labor, we have finished our post-ww2 construction efforts. Our efforts have paid off and our economy is now in the process of growing once again after the war."
 ENG_event.1.a:0 "Wonderful News!"
 ENG_event.2.t:0 "Tanganyika Groundnut Scheme Disbanded"
 ENG_event.2.d:0 "The Tanganyika Groundnut Scheme has been disbanded after its failure. The TGS was originally founded after the second World War as an attempt to reduce cooking oil shortages in Britain and provide jobs in East Africa by cultivating wide tracts of land for peanut growth. After immense costs and numerous failures the project was finally abandoned. A vast majority of the would-be East African workers will no longer be able to avoid falling into poverty and settle in the shanty towns of Dar es Salaam."
 ENG_event.2.a:0 "A Horrible Loss"
 ENG_event.3.t:0 "Jebel Akhdar War"
 ENG_event.3.d:0 "Our nation has taken the initiative to strike at the Imamate of Oman. We are fighting to support the occupation of Sultan Said bin Taimur and control the interior of Oman."
 ENG_event.3.a:0 "To War!"
 ENG_event.4.t:0 "Winds of Change Speech"
 ENG_event.4.d:0 "UK Prime Minister [ROOT.GetLeader] has addressed the Parliament of South Africa with a landmark speech signaling that Britain has no intention to prevent the independence of their southern colonies. The speech was received very well by the leaders of the southern colonies and for decolonization advocates around the world. \n\nIn the speech, [ROOT.GetLeader] stated \"The wind of change is blowing through this continent. Whether we like it or not, this growth of national consciousness is a political fact.\" Additionally, [Root.GetLeader] has expressed a great desire to aid and encourage the independence of these colonies and seeks to find common ground. In addition to this, however [Root.GetLeader] expressed a desire to find common ground and wants the colonies to protect the \"political destinies of free men to which in our own territories we are trying to give effect\" in reference to British nationals."
 ENG_event.4.a:0 "Inspiring"
 ENG_event.5.t:0 "Crackdown on Aden"
 ENG_event.5.d:0 "We have made the decision to suppress the Radfan uprising and taken an aggressive approach to resolving the Aden Emergency. It is advised that you take measures to suppress the uprising in the country and build up an occupation force."
 ENG_event.5.a:0 "A Necessary Measure"
 ENG_event.6.t:0 "Withdraw from Aden"
 ENG_event.6.d:0 "We have made the decision to fully withdraw from Aden and capitulate the region to the Radfan uprising. We have more important matters to attend to elsewhere."
 ENG_event.6.a:0 "A Necessary Measure"
 ENG_event.7.t:0 "Hold in Arabian Gulf"
 ENG_event.7.d:0 "We have made the decision to suppress the Arabian Gulf uprisings and taken an aggressive approach to resolving the Aden Emergency. It is advised that you take measures to suppress the uprising in the country and build up an occupation force."
 ENG_event.7.a:0 "We Will Not Give Them an Inch!"
 ENG_event.8.t:0 "Withdrawal From Arabian Gulf"
 ENG_event.8.d:0 "We have made the decision to fully withdraw from the Arabian Gulf and capitulate the region to the local powers. We have more important matters to attend to elsewhere."
 ENG_event.8.a:0 "A Useless Fight"
 ENG_event.9.t:0 "Balance of Payments Crisis"
 ENG_event.9.d:0 "Our balance of payments situation has boiled over into a full blown crisis which threatens to undermine the Sterling area. As the situation grows worse, our treasury reserves will be drained, interest rates will get worse, our currency will falter, and we will struggle to afford imports."
 ENG_event.9.a:0 "A Terrible Situation"
 ENG_event.10.t:0 "Death Penalty Abolition"
 ENG_event.10.d:0 "In a landmark legislative decision, the British Parliament has moved to pass the Murder Act of [GetYear] to outlaw the death penalty for murder and replaced it with a mandatory life sentence. Effective immediately, all death sentences have been commuted to life sentences. However, high treason, violent piracy, arson in royal dockyards, military offenses, and espionage are still capital offenses and will result in execution."
 ENG_event.10.a:0 "Progress"
 ENG_event.11.t:0 "Railway Reform Investigated"
 ENG_event.11.d:0 "In order to reduce expenses, we are conducting a massive audit of the railway reform in order to identify unnecessary spending or potential areas to make cuts and to improve the overall efficiency of the expansion project and prevent expense overrunning."
 ENG_event.11.a:0 "Interesting"
 ENG_event.12.t:0 "The Beeching Axe"
 ENG_event.12.d:0 "Given the circumstances, it is clear that the route network expansion and restructuring of our nation's railways is overscoped. We cannot afford to continue on this path and will need to massively cut back. Already 55% of stations and 30% of route miles planned will be cut to reduce the scope of the project."
 ENG_event.12.a:0 "A Necessary Cutback"
 ENG_event.13.t:0 "Night of Long Knives"
 ENG_event.13.d:0 "Prime minister [Root.GetName] has performed a major cabinet reshuffle dismissing numerous members of his cabinet. The scale of this reshuffle is immense and will have profound impacts in British politics."
 ENG_event.13.a:0 "Goodbye"
 ENG_event.14.t:0 "Vassall Tribunal"
 ENG_event.14.d:0 "John Vassall has been revealed to be a Soviet spy while working in the Admiralty. Already massive security and auditing reforms are being undertaken throughout the agencies of Great Britain and John Vassall is set to be tried for espionage, potentially facing death."
 ENG_event.14.a:0 "There Will Be Justice!"
 ENG_event.15.t:0 "Profumo Affair"
 ENG_event.15.d:0 "John Profumo and the model Christine Keeler have been found to been in an affair with one another. As a result of the incident, John Profumo has stepped down from his political career and will be replaced and will likely be unable to return to politics any time soon as a result of the scandal."
 ENG_event.15.a:0 "Scandalous!"
 ENG_event.16.t:0 "Operation Banner"
 ENG_event.16.d:0 "Ethno-nationalist conflicts have boiled over in Northern Ireland as the fighting between British armed forces, the Irish republicans, and Ulster loyalists has become untenable. We need to take immediate action to restore £compliance§YCompliance§!!"
 ENG_event.16.a:0 "A Dire Situation"
 ENG_event.17.t:0 "Begin EEC Negotiations"
 ENG_event.17.d:0 "The British government has begun negotiating with the European Economic Community to work toward regional economic integration and cooperation between European nations."
 ENG_event.17.a:0 "A Step Forward For Europe!"
 ENG_event.18.t:0 "Campaign Against Euroscepticism"
 ENG_event.18.d:0 "Despite the state's willingness to cooperate with the European community to foster unity, many people oppose European economic integration for a vast array of complex reasons. Our government has taken measures to challenge critics and campaign against Euroscepticism for the sake of British economic stability and European cooperation."
 ENG_event.18.a:0 "The UK Will Stay With Europe Forever!"
 WhitehallFederation.1.t:0 "The East African Federation"
 WhitehallFederation.1.d:0 "Numerous nations throughout East Africa have begun to gain independence from the United Kingdom. Several of the heads of state of these countries have expressed interest in forming a single, unitary federation with the leader of Tanganyika even offering to delay independence to aid this plan.\n\nThe proposed members Kenya, Tanganyika, Uganda, Zanzibar, Burundi, Rwanda and South Sudan are weighing their options at this time and may begin drafting a regional constitution and beginning movements to federate."
 WhitehallFederation.1.a:0 "One People One Destiny"
 WhitehallFederation.2.t:0 "The Central African Federation"
 WhitehallFederation.2.d:0 "The leaders of Rhodesia and Nyasaland have expressed interest in forming a self-governing federation in south Africa. The colonies have petitioned the UK to consider supporting the federation of the colonies and drafting a constitution to protect the rights of the settlers and of indigenous Africans in the region."
 WhitehallFederation.2.a:0 "Let Us Achieve Greatness"
 ENG_nuclear.1.t:0 "ハリケーン作戦"
 ENG_nuclear.1.d:0 "Our first nuclear test has a tremendous success!\nOur first atomic weapon has successfully undergone a detonation in the Monte Bello Islands near Western Australia.\nWe are now the third nuclear power in the world."
 ENG_nuclear.1.a:0 "A Great Success!"
 ENG_nuclear.2.t:0 "UK Mutual Defense Agreement"
 ENG_nuclear.2.d:0 "Today the UK has signed a mutual defense agreement with us and agreed to nuclear weapon co-operation. As part of the agreement, we will exchange nuclear materials, technology, and information.\nWith this agreement we will surely gain an advantage over the Soviet Union!"
 ENG_nuclear.2.a:0 "Nothing Can Stop Us Now!"
 ENG_nuclear.3.t:0 "Commonwealth Nuclear Program"
 ENG_nuclear.3.d:0 "As part of a far-reaching effort, a commonwealth nuclear co-operation agreement has been signed. All commonwealth nations will aid each-other in nuclear research and share technology and information to better strengthen our position in the world as a nuclear power."
 ENG_nuclear.3.a:0 "Shared Knowledge Shared Power"
 ENG_nuclear.4.t:0 "グラップル作戦"
 ENG_nuclear.4.d:0 "Operation Grapple has proven to be an overwhelming success! Through determination, innovation, and perseverance, our nation has now joined the elite ranks of thermonuclear powers. We have successfully developed and tested a hydrogen bomb with an estimated yield of 3 megatons of TNT—an achievement that firmly solidifies the United Kingdom's position as a global great power.\n\nThough the early stages of the program were marred by setbacks and uncertainty, our scientists and engineers refused to be deterred. Their tireless efforts have culminated in one of the most powerful weapons ever created, marking a turning point in both our national defense strategy and our international standing. Britain now stands as a true nuclear force, capable of projecting immense power and influencing the course of global affairs."
 ENG_nuclear.4.a:0 "We Are The Mighty!"
 ENG_nuclear.5.t:0 "Great Britain Completes Operation Grapple"
 ENG_nuclear.5.d:0 "Great Britain has successfully conducted a thermonuclear weapons test, officially marking its entry into the exclusive group of nations possessing advanced nuclear capabilities. This milestone represents a significant leap in the country's strategic military power, demonstrating its ability to develop and deploy high-yield, fusion-based nuclear weapons.\n\nWith this successful test, the United Kingdom has firmly established itself on the global stage as a nuclear power. Experts anticipate that the nation will accelerate the development and deployment of a full arsenal of high-level nuclear weapons in the coming months. If current projections hold, Britain is expected to achieve full operational capability within a year, further solidifying its role in global deterrence and international security dynamics."
 ENG_nuclear.5.a:0 "Historical."
 ENG_RHO.1.t:0 "UK Condemns the Rhodesian UDI"
 ENG_RHO.1.d:0 "The UK has condemned the Rhodesian UDI citing it as outrageous and born solely out of ethnic conflict. The Rhodesian Unilateral Declaration of Independence states that Rhodesia is now an independent sovereign state and opposes British visions for its future."
 ENG_RHO.1.a:0 "Barbarians"
 ENG_RHO.2.t:0 "Rhodesian Negotiation Breakdown"
 ENG_RHO.2.d:0 "Negotiations between Rhodesia and the UK have completely failed. The British government will not recognize nor support the Rhodesian state and the Rhodesian state will not accept the terms of recognition outlined by the British government."
 ENG_RHO.2.a:0 "A Predictable Outcome"
 ENG_RHO.3.t:0 "[GetNewspaperHeader]Rhodesia Recognized"
 ENG_RHO.3.d:0 "    The government of Great Britain has officially recognized Rhodesia as a sovereign state. After months of internal debate and negotiation with the Rhodesian parliament, the British parliament has officially made the landmark decision to recognize Rhodesia as a legitimate state.\n    Already there is a large international reaction from countries with regional interests with many countries either recognizing Rhodesia or Zimbabwe as a legitimate state. The Rhodesian government and its supporters praised and thanked Great Britain for their political support while opponents to the Rhodesian state have condemned the action citing grievances with the policies and actions of the Rhodesian government.\n    Regardless of the British decision, the conflicts in the region over leadership will continue and the future of Rhodesia is up to the locals of south central Africa."
 ENG_RHO.3.a:0 "Rise, O Voices of Rhodesia!"
 EFTA.1.t:0 "Invitation to the EFTA"
 EFTA.1.d:0 "We have received an invitation to the European Free Trade Association, §Ywould you like to accept?§!\nThe EFTA will increase exported resources by 5%, increase trade income by 25%, increase construction speed (especially for dockyards and state infrastructure), reduce overall research speed by 3% while increasing it by 15% for logistics and infrastructure, and grant 20% additional civilian and naval intel to all foreign nations."
 EFTA.1.a:0 "No"
 EFTA.1.b:0 "Yes"
 EFTA.2.t:0 "Formation of the EFTA"
 EFTA.2.d:0 "We have established the European Free Trade Association to bolster trade!"
 EFTA.2.a:0 "A Major Step Forward"
 FRA_event.1.t:0 "The End of Trentes Glorieuses"
 FRA_event.1.d:0 "In 1944, Charles de Gaulle introduced an economic policy known as the Dirigiste. The Dirigiste was effectively state-direction of a capitalist economy and resulted in a vast period of rapid economic growth and the prosperity of the country. After 30 years, the period has come to an end and French economic growth has nominalized."
 FRA_event.1.a:0 "What A Grand 30 Years"
 FRA_event.2.t:0 "French Maoists Arrested"
 FRA_event.2.d:0 "Under the order of [ROOT.GetLeader], Maoists leaders have been arrested and Maoist groups in France are being dismantled. Right now, French police and military are scouring the country hunting down fugitive Maoists and cracking down on their organizations."
 FRA_event.2.a:0 "Off to Prison!"
 FRA_event.3.t:0 "Larzac Camp Extended"
 FRA_event.3.d:0 "The extension of the Larzac military camp is now underway but has been met with fierce local resistance. Locals are staunchly opposed to the extension of the camp and have begun occupying land purchased by the military for the extension."
 FRA_event.3.a:0 "This Behavior is Unacceptable"
 FRA_event.4.t:0 "France Leaves NATO!"
 FRA_event.4.d:0 "France has officially withdrawn from NATO. [ROOT.GetLeader] today has officially announced the withdrawal of France from NATO citing numerous grievances with the organization and its practices. The withdrawal is effective immediately and France has repealed all NATO-related treaties with their country.\nNumerous leaders around the world are stunned at this development and the action has triggered mixed reactions from different countries. Despite this, many countries have opted out of giving official statements at this time.\nThe loss of France as a NATO ally means NATO will be significantly weaker in the region and in the world as a whole as France's navy and nuclear power were a significant staple in the organization's strategic strength."
 FRA_event.4.a:0 "No Comment"
 FRA_event.4.b:0 "They Have Our Support"
 FRA_event.4.c:0 "This is a Condemnable Action"
 FRA_event.5.t:0 "France Denuclearizes"
 FRA_event.5.d:0 "Our nation is now in the process of denuclearizing. We are shutting down nuclear power plants and cancelling all non-energy and scientific nuclear projects in the country."
 FRA_event.5.a:0 "At Long Last"
 FRA_event.6.t:0 "The End of Atmospheric Nuclear Tests"
 FRA_event.6.d:0 "Under the direction of [ROOT.GetLeader], we have now stopped all atmospheric nuclear tests in the country for a myriad of reasons. After over a decade of testing and damage, it is finally time for France to take a stand and stop."
 FRA_event.6.a:0 "Good Riddance!"
 FRA_event.7.t:0 "Supporting the PLO"
 FRA_event.7.d:0 "We have begun supporting the Palestinian Liberation Organization and their struggles. We are sending monetary and materiel aid to them in hope of supporting their cause."
 FRA_event.7.a:0 "Make Good Use of it"
 FRA_event.8.t:0 "Establishment of the UDF"
 FRA_event.8.d:0 "The United Democratic Front has been founded in France. The group opposes apartheid, institutional and systemic racism, and supports democratic reforms in Africa."
 FRA_event.8.a:0 "A Stunning Development"
 EEC.event.1.t:0 "Foundation of the Euro"
 EEC.event.1.d:0 "The European Economic Community has thus far been an extremely successful common market in Europe and promoted stunning levels of economic growth and international unity in the European community. The time has come to create a common currency for the EEC which will henceforth be known as the Euro."
 EEC.event.1.a:0 "A Great Achievement"
 EEC.event.2.t:0 "We Have Adopted the Euro"
 EEC.event.2.d:0 "Our nation, being a part of the EEC, has elected to adopt the Euro."
 EEC.event.2.a:0 "A Wonderful Development!"
 EEC.event.3.t:0 "Leave Snake in the Tunnel"
 EEC.event.3.d:0 "After endless debate and extensive analysis, we have elected to oppose the creation of a common European currency and will be withdrawing from Snake in the Tunnel."
 EEC.event.3.a:0 "It Was a Bad Idea, Anyway"
 EEC.event.4.t:0 "Invitation to the EEC"
 EEC.event.4.d:0 "Our nation has been invited to the European Economic Community common market.\n§YWould you like to accept?§!"
 EEC.event.4.a:0 "Yes"
 EEC.event.4.b:0 "No"
 EUROPE_space.1.t:0 "[GetNewspaperHeader]Creation of the European Space Agency"
 EUROPE_space.1.d:0 "The European Space Agency has officially been created with the objective of uniting many different European nations to create an international space agency and promote space-related innovation. The agency also seeks to promote cooperation and share scientific knowledge between the members of the agency.\nIn their own words \"The ESA's purpose shall be to provide for, and to promote, for exclusively peaceful purposes, cooperation among the European States in space research and technology and their space applications, with a view to their being used for scientific purposes and for operational space applications systems.\""
 EUROPE_space.1.a:0 "A New Dawn for Humanity!"
 EUROPE_space.1.b:0 "A Waste of Time!"
 EUROPE_space.1.c:0 "They Will Have Our Direct Support!"
 prague_spring.1.t:0 "Writers Disciplined"
 prague_spring.1.d:0 "During the summer, the Union of Czechoslovakian Writers began publishing articles offering minor criticisms of the Party and slow rehabilitation of Czechoslovakian cultural figures. These criticisms reached a point where the most pro-communist journal, Literani Noviny, began advocating that literature should no longer have to confirm to party doctrine. However, this period of cautious expression for reform has been curtailed following a recent meeting of the Communist Party of Czechoslovakia where senior leaders decided to administratively punish specific writers who advocated reform. The Party also placed several journals to be overseen by the Ministry of Culture. Although the Party has acted, many in the country, especially among the intellectual class are said to be growing increasingly unhappy with the Party and its approach to society."
 prague_spring.1.a:0 "The writers must learn"
 prague_spring.2.t:0 "Brezhnev Attends Prague Meeting"
 prague_spring.2.d:0 "President Antonin Novotny has ruled Czechoslovakia with an authoritarian streak since he became First Secretary of the Communist Party of Czechoslovakia (KSC). However, in recent years President Novotny has faced increased criticism within the Party and among the people for his practices. To shore up his support, President Novotny asked Leonid Brezhnev to attend the latest Central Committee meeting in Prague. However, at this meeting, Alexander Dubcek, the First Secretary of the Communist Party of Slovakia has led an effort to take over the position of First Secretary of the KSC. Brezhnev has been surprised at how many members of the KSC have turned on President Novotny and now the embattled President has asked for his opinion on the matter. Comrade Brezhnev must decide to either back the unpopular and weak President Novotny or give approval to the appointment of Dubcek as First Secretary, which may reunify the KSC and reduce public unrest."
 prague_spring.2.a:0 "Back Novotny"
 prague_spring.2.b:0 "Back Dubcek"
 prague_spring.3.t:0 "[GetNewspaperHeader]Brezhnev backs Novotny"
 prague_spring.3.d:0 "During the recent Central Committee meeting, President Antonin Novotny faced intense criticism and a loss of support from many senior Party leaders. These critics then tried to remove him as First Secretary of the Communist Party of Czechoslovakia (KSC). However, to counter such a scenario, President Novotny had earlier called on the Soviet Secretary General, Leonid Brezhnev to attend the meeting to protect himself from such an effort and this tactic proved successful. Despite the strong effort to remove him, Brezhnev decided to back President Novotny and ended the attempt. President Novotny remains First Secretary of the KSC and Czechoslovakia remains under his control. However, many in the KSC and across the country are said to be upset with this interference from Moscow and although Novotny survived the challenge, he will have to deal with discontent both among the people and his party."
 prague_spring.3.a:0 "Novotny is pleased"
 prague_spring.4.t:0 "[GetNewspaperHeader]Brezhnev backs Dubcek"
 prague_spring.4.d:0 "During the recent Central Committee meeting, President Antonin Novotny faced intense criticism and a loss of support from many senior Party leaders. These critics then tried to remove him as First Secretary of the Communist Party of Czechoslovakia (KSC). However, to counter such a scenario, President Novotny had earlier called on the Soviet Secretary General, Leonid Brezhnev to attend the meeting to protect himself from such an effort but this tactic proved to be a mistake. Comrade Brezhnev was stunned at the level of discontent and decided to approve the appointment of Alexander Dubcek as the new First Secretary. Though Dubcek now controls the KSC, Novotny will remain President. Dubcek is expected to slowly take control of the party apparatus and move his supporters into key positions."
 prague_spring.4.a:0 "Congrats Comrade Dubcek"
 prague_spring.5.t:0 "Response to Media Criticism of President Novotny"
 prague_spring.5.d:0 "The appointment of Alexander Dubcek as First Secretary to the Communist Party of Czechoslovakia (KSC) saw President Antonin Novotny lose a lot of his political power in the country. Shortly after the appointment of Dubcek, Eduard Goldstucker became the chairman of the Union of Czechoslovakian Writers and editor in chief of the leading journal, Literani Noviny. Goldstucker recently challenged state censorship policies by openly criticizing the policies of President Novotny in a nationally televised interview. President Novotny and his supporters have called on Dubcek to enforce censorship laws and punish Goldstucker. However, others in the party have urged Dubcek to allow these criticisms and support an atmosphere of openness to the people. They believe harshly enforcing censorship laws will only alienate the people."
 prague_spring.5.a:0 "Allow the criticism"
 prague_spring.5.b:0 "Enforce censorship!"
 prague_spring.6.t:0 "End Censorship Laws"
 prague_spring.6.d:0 "The response to the decision to not suppress public criticism of President Antonin Novotny has led to wider discussions on political reform and openness. Indeed, the support for reform and openness has seen public rallies emerge across the country in support of First Secretary Alexander Dubcek. Now Dubcek must decide if he will begin the process to abolish the strict censorship laws or roll back the public mood by cracking down on these public rallies and publications. Announcing the intention to end censorship laws will garner Dubcek greater public support, allow him to bring more reform policies to the people and strengthen his supporters in the party. However, to instead crackdown on this new openness will alienate the population and his own party supporters, but it would likely assuage concerns from Moscow and among party hardliners."
 prague_spring.6.a:0 "Begin Ending Censorship Laws"
 prague_spring.6.b:0 "Crackdown on Reformers"
 prague_spring.7.t:0 "President Novotny Resigns"
 prague_spring.7.d:0 "The recent decision by Alexander Dubcek, the First Secretary of the Communist Party of Czechoslovakia (KSC), to begin ending censorship laws has greatly angered hardline party members, including President Antonin Novotny who has announced his resignation. For Novotny and other hardliners within the KSC, the opening of political space and media along with other reforms threatens to destroy Party unity and the communist order in Czechoslovakia. Dubcek subsequently offered General Ludvik Svoboda the Presidency and he accepted. President Svoboda announced he would support the reform efforts and his appointment is being lauded across the country due to his highly decorated military career. Politically, President Svoboda survived post-war purges and is seen as a national hero among Czechs and Slovaks."
 prague_spring.7.a:0 "The people welcome the new President\""
 prague_spring.8.t:0 "[GetNewspaperHeader]Dubcek unveils Action Program"
 prague_spring.8.d:0 "In a landmark advance of reform policies, First Secretary Alexander Dubcek announced the beginning of what he calls the Action Program. The Program envisions a gradual liberalization of Czechoslovakia by increasing freedom of press, speech, movement. Economic reform is also being discussed along with an acceptance that multiparty politics may eventually return to the country. Dubcek noted the previous communist policies were not flawed as they were necessary to end the bourgeois influence and post-war instability. Now, Dubcek and reformers believe a socialist society with a positive relationship with the state is the main objective of the Action Program. Although Dubcek did not criticize communism and stated he would work with fellow communist parties, Moscow is said to be viewing these developments with much suspicion. They are especially concerned about Dubcek stating the Action Program will better adapt communist to Czechoslovakian society and offer a socialism with a human face."
 prague_spring.8.a:0 "Hail the socialist society"
 prague_spring.9.t:0 "[GetNewspaperHeader]Enthusiastic May Day Celebration"
 prague_spring.9.d:0 "Public enthusiasm and support for the reforming government in Czechoslovakia has seen record crowds gather across the country for annual May Day Celebration. The Communist Party of Czechoslovakia (KSC) under First Secretary Alexander Dubcek currently enjoys massive public support following the launch of his Action Program. Many in Czechoslovakia support the new openness in public discourse and continued political reforms. The reduction of censorship laws and opening of political space has seen unprecedent political participation. Although the party remains in power and incredibly popular, opponents to the reform and other communist states are concerned overtime these reforms will lead to the re-emergence of non-communist parties in Czechoslovakia. Regardless, the Prague Spring is in full effect and the people are enjoying it."
 prague_spring.9.a:0 "A May Day to remember"
 prague_spring.10.t:0 "[GetNewspaperHeader]Dubcek visits Moscow"
 prague_spring.10.d:0 "First Secretary Alexander Dubcek recently concluded an official visit to Moscow. Dubcek has taken effective control of Czechoslovakia and the Communist Party of Czechoslovakia (KSC). Under his stewardship he has overseen a liberalization of Czechoslovakian society through his reformist Action Program. Although he has tried hard to emphasize the policy as a natural continuation of communist ideology, many in Moscow and across the communist world find the opening of society as a major threat. They are especially concerned with Dubcek tolerating debates regarding the re-establishment of non-communist parties in the country. Soviet leadership emphasized these concerns to Dubcek and after a tense series of meetings, Dubcek returned to Prague. Although Dubcek stated the visit as an exchange of ideas, it is clear ties between Czechoslovakia and the Soviet Union is strained and the Soviets will be watching events closely."
 prague_spring.10.a:0 "Moscow was especially cold"
 prague_spring.11.t:0 "[GetNewspaperHeader]Censorship Officially Abolished"
 prague_spring.11.d:0 "First Secretary Alexander Dubcek upon taking his post began the process of relaxing censorship laws. These efforts have been lauded across Czechoslovakia and its traditionally vibrant intellectual circles have been rejuvenated by the recent opening of political space. Today, the process of abolishing censorship laws has been officially completed and the government announced the end of censorship in Czechoslovakia. The government was quick to note the abolishment of censorship did not mean anarchy, but a confirmation of the communist development society had undergone. The government does not expect people to discuss disruptive ideas or challenge the continued development of the state by the party. Ambassadors from other communist states are said to have expressed their reservations at this latest development to the Czechoslovakian president."
 prague_spring.11.a:0 "Let the people speak"
 prague_spring.12.t:0 "[GetNewspaperHeader]Publication of the Vaculik Manifesto"
 prague_spring.12.d:0 "Leading journalist Ludvik Vaculik recently published a manifesto titled The Two Thousand Words which was signed by leading artists and intellectuals. The manifesto argued the Communist Party of Czechoslovakia (KSC) had led to a decline for the country and the policy of openness must continue. It did not call for a revolution but a more democratization of society under the KSC. Controversially it also advocated an acceleration to liberalization and the re-establishment of pre-revolution socialist parties. The manifesto has angered the conservative KSC base who claim the document is a consequence to the Action Program of First Secretary Alexander Dubcek. Under immense pressure from conservatives, Dubcek and leading KSC members have quickly denounced the document but its impact is said to have raised concern across the European communist world."
 prague_spring.12.a:0 "We condemn this manifesto"
 prague_spring.13.t:0 "Soviet Military Exercises near Border"
 prague_spring.13.d:0 "In southern Germany, near the Czechoslovakian border, Soviet-led Warsaw Pact forces are conducting large military exercises. Newspapers in Prague noted the military deployment lacked any participation from Czechoslovakian forces and are occurring before scheduled talks between the Czechoslovakian and Soviet government over the recent liberal reforms. Many citizens have grown concerned that the exercises are a dress rehearsal to a Soviet intervention and state the government should prepare to resist. However, the Czechoslovakian government has given no indication it will begin any military response and, in a statement, reiterated its bond with the Soviet Union and its allies. In addition, Soviet military officers have also been visiting in larger numbers. The Soviet military visits are also seen as an effort by the Soviets to prepare and scout in case of an intervention."
 prague_spring.13.a:0 "Nothing to see here"
 prague_spring.14.t:0 "Meeting with Czechoslovakian Leaders"
 prague_spring.14.d:0 "Senior Soviet leaders, including the Soviet Secretary General, have met with First Secretary Dubcek and President Svoboda of Czechoslovakia. The Soviet leaders urged Czechoslovakia to end its liberalization program and confirm to the Moscow communist line. They noted liberalization has led to a growing movement demanding multiparty elections and anarchy. They suggest if order is not restored than communism itself may collapse in the streets of Prague. However, the Czechoslovakian leaders noted the popularity of their programs and the strengthening of party popularity among the people. Instead of capitulating to Soviet demands, they instead suggested the Soviets treat them as a model to reform the party and rejuvenate support for communism. The Soviet Secretary General must decide to respond by either condemning the Czechoslovakian model or instead bring it to Moscow and initiate a small liberal reform program to test its validity."
 prague_spring.14.a:0 "Condemn liberal reforms"
 prague_spring.14.b:0 "Bring liberal reforms to Moscow"
 prague_spring.15.t:0 "Results of Soviet Meeting"
 prague_spring.15.d:0 "Senior Soviet leaders met with senior members of our government in Slovakia over a two-day period. The Soviet leaders were quite adamant in their criticism of our Action Program and demanding we reverse liberalization. They claimed the country was undergoing anarchy and our party cannot control the spread of dangerous ideas. Our leaders defended its policies and insisted our liberalization is the best approach for Czechoslovakia. In the end a result could not be achieved but it is clear the Soviets were demanding we end our reforms. First Secretary Alexander Dubcek must now decide to end the Action Program and resign or continue the process and refuse Soviet demands. The Soviet ambassador awaits our final response to the Soviet demands."
 prague_spring.15.a:0 "Refuse Soviet demands"
 prague_spring.15.b:0 "Accept Soviet Demands"
 prague_spring.16.t:0 "Brezhnev Doctrine and Invasion Approval"
 prague_spring.16.d:0 "Secretary General Leonid Brezhnev unveiled his new doctrine to Soviet leadership. The details are planned to be published next month in the Pravda. The Soviet Union has decided that any threats to socialist rule in any communist states within its orbit in Europe will be a threat against all that must be resolved by any means necessary. The dangerous reforms in Czechoslovakia are reaching anarchic levels and the communist party there is on the verge of losing control. Brezhnev received a letter from conservative communists in Czechoslovakia begging Soviet aid. After consulting leaders of Bulgaria, Poland, and Hungary, Brezhnev has approved the military invasion of Czechoslovakia to restore order. The invasion will be the first instance of the Brezhnev doctrine in action."
 prague_spring.16.a:0 "The invasion begins"
 prague_spring.17.t:0 "[GetNewspaperHeader]Invasion of Czechoslovakia"
 prague_spring.17.d:0 "During the night, overwhelming military force from four Warsaw Pact nations, the Soviet Union, Bulgaria, Poland, and Hungary crossed the border into Czechoslovakia. The Czechoslovakian government ordered the military and people to not resist and military forces have remained in their barracks. The Soviet government announced it was forced to act after receiving requests from Czechoslovakian communists who feared the government was leading the country to disaster. Citizens in Prague came out to protest the invaders but within a day the country had been secured by the Warsaw Pact. However, the people have engaged in large scale non-violent protests against occupying troops. It is expected that the reforms initiated by the government will be rolled back and conservative communists restored into positions of power. Internationally there has been a lot of backlash over the Soviet invasion, even among some communist states who see the act as a violation of sovereignty"
 prague_spring.17.a:0 "The Spring has come to an end"
 prague_spring.18.t:0 "Invasion of Czechoslovakia "
 prague_spring.18.d:0 "During the night, overwhelming military force from four Warsaw Pact nations, the Soviet Union, Bulgaria, Poland, and Hungary crossed the border into Czechoslovakia. The Czechoslovakian government ordered the military and people to not resist and military forces have remained in their barracks. The Soviet government announced it was forced to act after receiving requests from Czechoslovakian communists who feared the government was leading the country to disaster. Citizens in Prague came out to protest the invaders but within a day the country had been secured by the Warsaw Pact. It is expected that the reforms initiated by the government will be rolled back and conservative communists restored into positions of power. However, the people have engaged in large scale non-violent protests against occupying troops. The reformers led by First Secretary Alexander Dubcek are said to be in discussions with Soviet forces and are cooperating. It appears the Czechoslovakian experiment with liberalism has come to an end."
 prague_spring.18.a:0 "The Spring has come to an end"
 prague_spring.19.t:0 "Censorship Reintroduced"
 prague_spring.19.d:0 "In the aftermath of the invasion, First Secretary Alexander Dubcek, who had overseen the liberalization of communist rule remained in power as the Soviets did not wish to turn the non-violent protests into open insurrection. Indeed, the Soviets have agreed to a moderate package of limited reforms called the Moscow Protocols. However, Dubcek has been forced to reintroduce censorship in Czechoslovakia. This decision has now ended the liberalization of media and public assembly which had galvanized the people of Prague over the last few months. Leading journalists, writers, and intellectuals must now return to the government line or risk being silenced, fired, or arrested by the government. The conservative communists are now firmly in power. The act confirms with the Moscow Protocol which stated socialism must be restored to its original form in the country."
 prague_spring.19.a:0 "An end to anarchyAn end to anarchy"
 prague_spring.20.t:0 "Czechoslovakia becomes Federal Republic"
 prague_spring.20.d:0 "Although the Prague Spring has come to a sudden end following the Soviet invasion, one of the goals of the reformers was achieved today. Czechoslovakia has officially become a Federal Republic, restoring what many in Czechoslovakia believe is their democratic legacy. Censorship remains as has the rollback on many of the more liberal aspects of the Prague Spring, however, the Soviet Union has conceded this to the reformers. The Soviet Union was largely surprised by the non-violent resistance they faced following the invasion and although restoring socialism was a principle aim, they have agreed to allow this limited concession to the people of Czechoslovakia."
 prague_spring.20.a:0 "Something is better than nothing"
 prague_spring.21.t:0 "Dubcek Replaced as First Secretary"
 prague_spring.21.d:0 "First Secretary Alexander Dubcek, the architect of liberalism and the Prague Spring, was removed from his post today. Although the Soviets had sought to end his rule after the invasion, the amount of non-violent protests and genuine support for his reforms pushed them to instead keep Dubcek in power, though under close supervision. He oversaw the restoration of censorship laws and the rollback of his Action Program but now the Soviets feel confident they can remove him from power. He will be replaced by the hardline communist Gustav Husak who enjoys the blessings of Moscow. Husak is expected to usher in a more autocratic line and ensure the forces of openness and liberalization released by reforms of Dubcek do not pose any further threat to communist rule in the country. Many in Czechoslovakia are said to be saddened by the removal of Dubcek."
 prague_spring.21.a:0 "Goodbye and Thank-you, Dubeck"
 SAF_event.1.t:0 "Simonstown Agreement"
 SAF_event.1.d:0 "The colony of South Africa has officially signed a naval cooperation agreement with Great Britain known as the Simonstown Agreement. The Royal navy has given their naval port at Simon's Town to the South African Navy under the condition that it will still service Royal Navy fleets. Additionally, the agreement has also granted South Africa 6 anti-submarine frigates, 10 coastal minesweepers, and 4 coastal defense boats.\nThe Simonstown Agreement was founded on the principal of protecting sea routes between the UK and the Middle East and improving the autonomous naval capability of South Africa."
 SAF_event.1.a:0 "What a Wonderful Agreement"
 SAF_event.2.t:0 "The Republic of South Africa"
 SAF_event.2.d:0 "Our country is on its way toward a republic, now. Our endless efforts to establish ourselves as a fully functional republic to represent the will of the people is underway!"
 SAF_event.2.a:0 "Diverse People Unite!"
 Namibia.1.t:0 "The Namibian Question"
 Namibia.1.d:0 "During WWI, South African troops deposed the German colonial administration of the Namibian. After the end of the war, a mandate was established. Recently the pressure for global decolonization and national self-determination has forced us to answer to the Namibian question. Our decisions now will drastically influence the lives of everyone in the Namibian."
 Namibia.1.a:0 "Time to Choose"
 Namibia.2.t:0 "Annexation of Namibia"
 Namibia.2.d:0 "South Africa has decided to fully annex the Namibia. When pressed for a decision on the Namibian question the South African government has decided to extend their mandate indefinitely and push for a full integration of the Namibia. While this action is seen as unjust by some, others believe this is the natural outcome of the mandate. Regardless, the opposition to this action is not likely to stay quiet for long."
 Namibia.2.a:0 "Time Will Tell"
 Namibia.10.t:0 "Namibian Problem Brought to the UN"
 Namibia.10.d:0 "We have brought the Namibian question to the UN to help make a decision. The UN has advised us to grant Namibia independence stating that they are entitled to self-governance."
 Namibia.10.a:0 "Propose a 10-Year Trusteeship"
 Namibia.10.b:0 "Agree to the Decision"
 Namibia.11.t:0 "South Africa Establishes the 10-Year Trusteeship"
 Namibia.11.d:0 "After a debate with the UN, the South African government and the United Nations have agreed that the Namibia should be free and independent after a 10-year Trusteeship. During these 10 years South Africa will retain its mandate over the Namibia before the decolonization takes place.\nSouth Africa argued that Namibia should take time to prepare their new government including establishing their own parliamentary system and drafting the constitution rather than becoming independent too quickly before they are ready. The United Nations representatives agreed that this was the best option and the Trusteeship was established.\n§YMany Namibian people believe the South African government should help to develop the country with their tax dollars and contributions in this time although that is not mandatory as per the UN agreement§!"
 Namibia.11.a:0 "10 Years to Prepare"
 Namibia.12.t:0 "Independent Namibia"
 Namibia.12.d:0 "After a debate with the UN, the South African government and the United Nations have agreed that Namibia should become independent immediately. Effective immediately all administrative assets are being transferred from the Namibia to South Africa and the UN is helping the Namibia to establish a transitional government until they can establish a parliament, set up voting districts, and draft a constitution."
 Namibia.12.a:0 "Unity, Liberty, Justice"
 Namibia.13.t:0 "Namibia is Free"
 Namibia.13.d:0 "The 10-Year Trusteeship has ended and Namibia is officially a free, independent, self-governing state."
 Namibia.13.a:0 "Unity, Liberty, Justice"
 brk.1.d:0 "Jean-Baptiste Ouédraogo, has ruled Upper Volta since 1982 when he assumed the precidency after the 1982 Coup. More ideologically moderate than most of his comrades, Ouédraogo did not command much popular support and governed the country amid an unstable political climate. After prolonged dispute with Prime Minister Thomas Sankara culminated to purging of the several radicals, Ouedraogo was deposed in a coup led by Captain Blaise Compaoré, who made his close friend Sankara President. Sankara has promised to begin a period of societal transformation of the state."
 brk.2.d:0 "A pro-Libyan paratroop captain who was dismissed as Prime Minister of Upper Volta in May seized power in the West African country today in a coup that reportedly left 13 people dead and 15 wounded. Diplomats in Upper Volta said 6 of the wounded were French nationals.\nThe captain, Thomas Sankara, 35 years old, went on national radio to announce the ouster of the Government of President Jean-Baptiste Ouedraogo. It was the third coup in Upper Volta in three years and took place one year before a promised return to civilian rule.\nCaptain Sankara was described as ''a committed Marxist-Leninist'' and is said to be particularly popular among young Upper Voltans. He became a national hero in 1974 by leading a raid into Mali during a brief border war in that year."
 brk.3.d:0 "After overthrowing Lamizana in 1980, Colonel Saye Zerbo re-established the full-on military rule ended by Lamizana with the 1978 presidential and parliamentary elections. Initially favoured by the trade unions and much of the political opposition, he soon made them his enemies. Establishing a junta with many radical members, Zerbo's leadership grew increasingly dictatorial. He re-banned all political parties, and once more made labour strikes illegal.\nAnti-Zerbo protests grew increasingly frequent, with anti-government strikes taking place in April, the trade unions demanding a return to constitutional government in May, and several prominent union and opposition leaders arrested in September.\nNow the progressive and radical factions within the military regime have had enough with Zerbo.In the capital, the army chief of staff Colonel Gabriel Yoryan Somé and other officers calling themselves the Council of Popular Salvation moved to depose and arrest Zerbo. Zerbo was declared a lying demagogue who had betrayed the confidence of his people.\nTwo days after the coup, the little-known army physician Major Dr. Jean-Baptiste Ouédraogo was named head of state by the new junta."
 brk.4.d:0 "Sangoulé Lamizana has ruled Upper Volta since his coup against Maurice Yaméogo in 1966. Lamizana would go on to rule the country as a military dictator until the Upper Voltan presidential election in 1978, when he was elected as the leader of a civilian regime. During the 1970s, the Lamizana government faced many problems, among them continued opposition from the trade unions, the rise of new political opposition groups, a strong Sahel drought, increasing desertification, and so on. The need for foreign aid reached record levels, in 1979 making up a full 70% of the government budget.\nIn February 1979 the major trade unions launched a new anti-Lamizana campaign. In May, two prominent labour leaders were arrested for inciting revolt. Two months later, Lamizana denounced the unionist demands, calling for national unity. By December, the president finally acknowledges the country's dependence on Western aid for survival.\nSoon after, Colonel Saye Zerbo led a military coup d'état, overthrowing President Lamizana. The coup proved both bloodless and successful. The riot police, deployed against the striking workers, attempted a counter-coup in support of Lamizana, but failed to reinstate him. Zerbo - a military veteran, former Minister of Foreign Affairs 1974-1976, commander of the army regiment in the capital Ouagadougou, and head of military intelligence - suspended the constitution, and established the Military Committee of Recovery for National Progress, a 31-member junta. Several members of the junta were young and radical, among them future presidents Thomas Sankara and Blaise Compaoré. Among the parts of society that supported the coup were the Mossi people and the Upper Voltan Catholics, two groups sidelined by Lamizana, although Zerbo like his predecessor was a Bissa Muslim."
 brk.5.d:0 "We achieved our independence in 1960. Maurice Yaméogo created a single-party dictatorship, making his own Voltaic Democratic Union the sole legal political party in the country. Opposition parties, like the African Regroupment Party, were either merged with it or dissolved.\nYaméogo's government would come to face charges of neocolonialism, as it aligned closely with the French government. The President's harsh policies, and deeply corrupt state of his administration, made him hugely impopular. In 1964, the government strongly restricted the right of workers to organize and outlawed labour strikes, making the strong trade unions its enemies. In the presidential election the following year Yaméogo was re-elected, with a supposed 100% support and 98.4% turnout. The parliamentary election the following day officially saw a 100% support and 97.4% turnout in favour of the Voltaic Democratic Union, but in fact mass abstention in protest against the President and his party took place.\n\nOn 30 December, following increased economic troubles, the government announced a new austerity budget, massively cutting the salaries of public sector employees and raising taxes. The following day, Denis Yaméogo – Minister of the Interior and Security, and the President's half-brother - used heavy-handed force to break up a meeting of the national labour leadership. As a result, a general strike was called. On 1 January 1966 President Yaméogo declared a state of emergency in the country. On 2 January he deployed troops to all public buildings, and warned government employees against participating in the general strike. Finally, on 3 January, the general strike began. Large groups of protesting workers stormed the ruling party headquarters and the National Assembly. The state of emergency and troop deployments backfired on the government - the rank and file soldiers refused to shoot protesters. Within short, the military leadership stepped in. Lieutenant Colonel Sangoulé Lamizana, the Chief of Staff, seized power. President Maurice Yaméogo was forced to resign, and was later imprisoned. The following day a new military government was organized, which received the support of the trade unions which ended the general strike. The constitution was suspended and the National Assembly dissolved. A new cabinet was formed with seven military officials and four civilians, the Superior Council of the Armed Forces, with Lamizana at the helm. A Consultative Committee was also formed, with 46 members representing the military, political parties, trade unions, religious leaders, and traditional authorities."
 brk.6.d:0 "Today, Thomas Sankara has announced the renaming of the country. In a speech he made, he delcared that \"Upper Volta was a colonial name not from us but from the French Government, and because we are more than just a location on the river Volta\". The new chosen name is \"Burkina Faso\", meaning land of the honest men."
 MLA.0.d:0 "The heroic Malaysian Liberation Army, under the indomitable leadership of Comrade Chin Peng, has launched a triumphant campaign to liberate Singapore, striking a decisive blow against the imperialist forces of British colonialism. In a masterful and unified assault, our valiant soldiers have shattered the last vestiges of colonial rule, sweeping away the weak and crumbling defenses of the oppressors. The cowardly Field Marshal Temple and his High Command, faced with the unstoppable tide of revolution, fled in disgrace to Sarawak, abandoning their futile attempt to subjugate our people.\n\nThe liberation of Singapore stands as a glorious victory for the Malaysian Liberation Army and the Malayan Communist Party, marking the dawn of a new era of freedom and justice for the working masses of Southeast Asia. The fall of this colonial stronghold is a resounding affirmation of the power of the people, solidifying our control over the region and signaling the irreversible decline of imperialism. This historic achievement is but a step forward in our unstoppable march towards the complete emancipation of the oppressed, heralding the inevitable triumph of socialism across the entire Southeast Asian landscape."
 MLA.1.d:0 "Shocking news has come from Southeast Asia yesterday. For the second time in a decade, Singapore has surrendered to enemy forces. This time, however, instead of the rising sun, the crimson flag of the Malaysian workers flies over the crown colony. The colony fell to the Malaysian Rebels thanks to a mass assault across the Johor Straight supported by a pinpoint artillery barrage that annihilated the Colonial static defenses. While putting up a brave fight, the local British garrison was unable to halt the red tide as it swept through the streets. Chin Peng, the leader of the Insurgency has declared this new city “be the capital of our brave and industrious people”. While sporadic fighting continues, it is likely that Singapore will never again see another Anglo rule."
 MLA.2.d:0 "Today, the final chapter of the Malayan Emergency concludes as the sun shines across a new red state. In a brilliant guerilla campaign orchestrated by the Malayan National People's Liberation Army, the mix of Rhodesian, South African, and British troops were repeatedly outflanked and driven into the jungle by the communists. With the colonial government now on the run, The People's Democratic Republic of Malaysia was declared at the new capital Chin Peng City. Although it is unknown what role the new state will play in the region, many worry socialism is now unleashed across Southeast Asia."
 MLA.3.d:0 "Today the People's Democratic Republic of Malaysia have publicly executed sir Gerald Templer by firing squad. An officer and veteran of both world wars, he was one of the key leaders in the colonial regime and has been charged by Malaysian courts with crimes against humanity for his use of chemical weapons, concentration camps (called new villages by the British press), and a man made famine that devastated the Malaysian countryside. Templer was captured by Malaysian Rebel forces in the battle of Singapore while trying to escape. Internationally, the United Kingdom has released a statement demanding UN sanctions however it is unlikely any action will be taken."
 MLA.9.d:0 "In a historic and unexpected declaration, Comrade Chin Peng, Chairman of the Communist Party of Nanyang, has officially proclaimed Buddhism as the State Religion of the People’s Democratic Union of Nanyang (PDUN). The announcement came during the Congress of National Moral Rejuvenation, where the party outlined a renewed ideological synthesis to spiritually anchor the revolution.\nStanding before a massive banner reading “Dharma is Revolution, Revolution is Dharma”, Chin Peng addressed the nation and the world:\n\n\"Gautama Buddha walked away from the palaces of gold and rejected the illusion of material wealth, just as the worker must reject capitalist greed. He taught the Eightfold Path, as we teach the dialectical path to liberation. His was the original class consciousness. We are not abandoning Marx. We are fulfilling Marx, through the spirit of the Buddha.\""
 MLA.11.d:0 "Comrades, after our brave resistance against Japanese fascism, our colonial overlords have returned to this land. As we speak, English dogs pillage our countryside, starve our people, and exploit our nation. With every passing day, the fruits of our labor are stolen and used to entrench colonial rule. This is our last chance to throw the British into the sea. If we fail, our proud people will remain in shackles, but shall we succeed, all of Malaysia will be free from starvation, fear, and tyranny."
 MLA.12.d:0 "Today is a proud day for the workers of Malaysia. We have expelled the British from Malaysia! However, our colonial rulers have a final fight left in them. Intel suggests that the crown colony of Singapore has recently experienced an influx of enemy troops. If we allow this small Island to receive any more reinforcements, British and American forces will be able to launch large offensives into our country. For that reason, Chairman Peng has ordered the Island taken and the red flag be raised over the city as soon as possible."
 MLA.15.d:0 "Comrade Shamsiah Fakeh, hero of the Anti-British war and Propaganda Minister has written to Chairman Peng advising dramatic reorganization of the Malaysian Communist Party. Instead of a pro-chinese government with Chin Peng at the helm, Fakeh has recommended a neutral collective leadership with him as a figurehead. She argues that with a collective leadership, the Malaysian Communist Party can more effectively bridge the gap between ethnic and religious groups as well as seek close ties with both Moscow and Beijing."
 MLA.16.d:0 "The Anti-British War has nearly broken the rural peasantry. The Colonial deportation and chemical bombing campaigns have destroyed Malaysia's ability to feed its hungry proletariat. We must act fast to decontaminate the farms and repatriate the skilled farmers."
 MLA.24.d:0 "With our power secured, it is now time to rebuild our great nation from the ground up. During there cowardly retreat, British and Colonial troops destroyed every economic asset they could touch in an attempt to sabotage our reconstruction. Because of this, we must build Malaysia from the ground up. Farms must be decontaminated, factories must be restored, and the people must be educated. We have a lot of work ahead of us comrades, but with faith in Chairman Peng, anything is possible!"
 MLA.25.d:0 "Recent census data has shown that the education level in Malaysia is far worse than we could have ever imagined. While we have no concrete data, it is likely the literacy rate in our new nation is under 30%. If we wish to rebuild and modernize, the peasants must be educated."
 MLA.26.d:0 "After sorting through the rubble of our newly liberated nation, we have discovered that most of our industry has been lost. It is our duty to salvage any possible equipment, schematics, and technical expertise left behind to hopefully patch together some form of an industrial base."
 MLA.27.d:0 "Individual towns and cities have reported their mortality rates since we came to power and the numbers are horrifying. We can report with absolute certainty that approximately one and a half million people (out of a population of around 7.5 million) have perished from work related accidents, starvation, disease, and neglect. Chairman Peng, previously offering Buddhist teachings when presented with warnings has been hospitalized in Beijing after an attempted suicide. His exact state is unknown, but it is likely he will make a full recovery."
 MLA.19.d:0 "Today, the Central Committee of the People’s Democratic Union of Nanyang, under the immortal leadership of Comrade Chin Peng, has issued a sweeping ideological resolution: the formal denunciation of Islam as a reactionary and counter-revolutionary force incompatible with the liberation of the masses.\n\nIn a fiery speech broadcast across the liberated zones of Nanyang, Comrade Chin Peng declared:\n\"We shall no longer tolerate the chains of feudal superstition and patriarchal bondage. Islam, like all theistic opiates, has been weaponized by landlords, monarchs, and foreign imperialists to subdue the working masses—especially our oppressed sisters. It must be cast into the dustbin of history.\"\n\nEffective immediately, mosques are to be closed or repurposed, religious schools disbanded, and clerical influence abolished from public life. In their place, the People’s Revolutionary Culture shall rise: one of science, Buddhist, feminist liberation, and Marxist-Leninist education."
 MLA.4.d:0 "Today, the Dalai Lama left his home in Tibet to tour the new communist state in Malaysia. The leader of the Buddhist world was greeted with a large parade in the nations capital featuring Buddhist imagery and military strength. In an interview, the Dalai Lama praise for the new state and its Buddhist leader Chin Peng for delivering peace and prosperity to all people of Malaysia. Although invited to stay in Malaysia permanently, the Dalai Lama stated that while the new Malaysian state will forever hold a place in his heart, his true home is Tibet."
 MLA.14.d:0 "During the chaotic retreat from our land, many British bomber pilots were captured. These bomber pilots have been convicted of crimes against humanity by the Malaysian National Court. All that awaits is a sentence. Many believe the only just action is death by firing squad. These pilots are responsible for the deaths of hundreds of thousands of civilians and death may be the only just punishment. Others, however, believe the best punishment is to send the pilots to the victims of British bombings and force them to repair the damage they caused. This could eventually teach them a lesson and hopefully turn them into loyal party members. Finally, a growing number of citizens believe our country has seen enough death. Killing these boys won't bring anyone back and the best course of action is to heal the wounds of war. What should be done?"
 MLA.13.d:0 "Tunku Abdul Rahman, a collaborator to both the British colonial government and the Empire of Japan has been captured. The snake has been tried by the Malaysian National Court and has been convicted with treason. Now we must sentence him. Many argue the death penalty is required, some believe hard labor is the option, and a few think prosecutions is a waste of time and will only polarize the nation further. What should be done?"
 MLA.20.d:0 "In a resounding address to the Central People’s Assembly, Comrade Chin Peng unveiled a sweeping new campaign: the Sinicization of the People’s Democratic Union of Nanyang, a revolutionary effort to forge unity, discipline, and ideological purity through the unification of language, culture, and identity under the Han socialist framework.\n\nComrade Chin Peng proclaimed:\n\n\"Petty tribalism, feudal dialects, and colonial hybridisms must be eradicated from the mind of the revolutionary citizen. We must no longer be Malays, Indians, Dayaks, or others—we must become one: the People of Nanyang, bound by the language of revolution, the culture of struggle, and the discipline of our Han revolutionary heritage. The future speaks Mandarin, walks in Marxist boots, and salutes the flag of unity and socialism!\"\n\nUnder this policy, the following changes will be enacted across all revolutionary zones:\n•    Mandarin Chinese will become the sole official language ofadministration, education, and propaganda.\n•    All non-Han schools, temples, cultural institutions, and signagewill be restructured or replaced with socialist cultural centerspromoting Han values and revolutionary history.\n•    Han revolutionary holidays and heroes will be taught andcommemorated across all provinces, replacing local traditions.\n•    A People’s Language Reform Bureau will be established to oversee language standardization and the elimination of “counter-revolutionary dialects” from public use."
 MLA.5.d:0 "Disturbing news has come out of Malaysia today. Reports have been verified that colonial landlords left behind by retreating British forces are now being liquidated. While the exact number is unknown, it is estimated that over 150 to 200 landlords have been executed by the state in methods ranging from hangings, to firing squads, to even public stoning. The Malaysian government has stated that “although executions bring us no joy, we cannot allow crimes against the Malaysian people to go unpunished”. Already, it appears executions are winding down, yet this is likely to remain a black spot on the People's Democratic Republic of Malaysia."
 MLA.28.d:0 "Today, former hero of the Anti-British war in Malaysia Shamsiah Fakeh was publicly executed on charges of treason. Since the communist state was founded, Fakeh petitioned hard to maintain good relations with both the Soviets and Red Chinese by organizing a pluralistic socialist government. However, as relations soured between the nations, Fakehs utopian sense of unity and compromise became a liability to the increasingly Maoist party. Late last night, a kangaroo court was organized and in a rare televised event, Shamsiah Fakeh was sentenced to death by firing squad. The execution was followed by Chairman Chin Peng stating that effective immediately, the MCP (Malaysian Communist Party) would no longer tolerate “reactionary deviation in the proletarian revolution” within its ranks."
 MLA.29.d:0 "Last week, confused citizens across Thailand awoke to find trillions of banknotes covering the nation. While initially treated as a blessing by the impoverished Thai people, the drastic increase in currency has almost overnight caused the value of the Thai Baht to plummet to historic lows. While long-term damages are unknown, shops across the nation are empty, most of the workforce have abandoned their posts due to stagnant wages, and Pathet Lao splinters have flared up in across the countryside. In an official statement, the Thai government has accused the People's Democratic Republic of Malaysia of sabotaging their economy and have called on strict UN sanctions."
 MLA.30.d:0 "Today marks a new era for the people of Malaysia as Chairman Peng announced the completion of the S.A. Ganapathy Railway Network. Cutting through jungles, mountains, and rivers, the 5,000-mile railway network connects all major cities, ports, mines, and logging areas to Chin Peng City. As well as new access to rare resources, the infrastructure allows much needed aid and supplies to reach remote villages. For the first time, the people of Malaysia can commute to work like westerners as the communist state continues to modernize."
 MLA.31.d:0 "A new movement has risen from the jungles of southern Thailand. Today members of the CPT (Communist Party Thailand) led by lieutenant colonel Phayom Chulanont, along with Pathet Lao splinters and Chinese nationalists, made a long marched across the nation and declared an independent region around the small city of Hat Yai on the Malaysian border. The group, referring to themselves as the Tàiguó mínzú (Thai Nation), is a Maoist insurgency group dedicated to the liberation of all Thai people. While the Royal Thai Armed Forces have been mobilized, probing attacks on the Malaysian Supported guerrillas have ended in disaster leading many to believe this new statelet is here to stay."
 MLA.32.d:0 "In the wake of growing Sino-Soviet tension, Chairman Mao has urged us to disband our dual leadership system, execute Shamsiah Fakeh, and officially join the struggle against Soviet Cultural Imperialism. While Chin Peng has grown hostile to Khrushchevs interventions in Eastern Europe, Fakehs policy of socialist neutrality has brought the wealth of both China and the Soviet Union into Malaysian ports. Advisers have also informed us that socialist neutrality can still be kept, so long as take extra care in future international relations."
 MLA.33.d:0 "Chairman Peng has announced to us his intentions in modernizing Malaysia. Although many wishes to accomplish this task alone, few can deny the need for outside funding. Luckily, two plans have been given to us. The first one is from the USSR. The Soviet Government has promised us full access to industrial secrets as well as extremely generous trade deals on soviet resources. All they wish for in return is a 50-year lease on the port of Malacca to simplify trade in the region. The second one is from the PRC. Comrade Mao has offered top industrial advisers, as well as half a million of China's best workers to help us modernize. All they ask in return is our full support in diplomatic affairs. While both are tempting, we can only choose one offer."
 MLA.34.d:0 "The time has come. Plans for every aspect of the modernization campaign are complete, millions of our workers are mobilized, and supplies from our allies pour through our ports. All that remains now is to give the go-ahead."
 MLA.35.d:0 "While the mass literacy initiative brought reading and wisdom to our nation, it has become necessary to expand the Malaysian people's knowledge further. Chairman Peng has requested that by 1975, all Malaysian people have a college degree. To fulfill this request, universities covering topics ranging from mathematics to applied engineering must be founded, a new enthusiasm for learning must be cultivated, and our understanding of language must be increased."
 MLA.38.d:0 "Through British imperialism, Japanese occupation, and famine, our people have persevered. It is time for the communist party reward them. Every citizen in our nation has access to clean water, a dry bed, and safety from violence, yet they require more. Consumer shops are frequently empty, the lines to receive medical aid often stretch around whole blocks, and our workers lack goods to spend rising wages on. These must be fixed if we are to be considered a modern nation."
 MLA.36.d:0 "Currently, the average Malaysian citizen relies on only 1,250 calories per day. While technically “safe”, any breakdown in productivity will send Malaysia into another famine. If we are to sustain our growing industrial base, all agriculture bottlenecks must be eliminated, mechanization must be achieved, an increase in fertilizer production must happen."
 MLA.39.d:0 "With our country stabilized, we can now begin to exploit our nations rich resources. The mines from british colonial rule can now be re-opened and miners can get back to work. Prospectors returning from Perak and Terengganu have found large deposits of iron, copper, and bauxite. We must harness these riches for the benefit and progress of all Malaysians."
 MLA.40.d:0 "With our great nation modernized, we can begin efforts to liberate all of Southeast Asia. To aid our struggle, the Mǎláixīyà Qíngbào Jú (Malaysian Intelligence Agency) has been founded to gather intel, assist in revolutionary activity, and if necessary, join in direct combat with reactionary forces across the region."
 MLA.41.d:0 "For almost twenty years the Burmese civil war has remained stagnant. The white flag faction under comrade Thakin Than Tun is in a constant state of crisis, yet the Burmese government is unable to strike a critical blow. It is in both the Chinese and our own strategic interests to see these revolutionaries succeed and establish an allied state. Victory here will mean the total encirclement of Thailand as well as a gateway to Bangladesh and India."
 MLA.42.d:0 "Since the early 50s, the Pathet Lao have been in a state of conflict with the French, Americans, and kingdom of Laos. It is in the interests of both the Lao proletariat and our great nation to see a Socialist government in Laos. For that reason, we must begin sending weapons and equipment to increase their chances of victory."
 MLA.43.d:0 "Operatives from our Thailand have reported a situation ripe for revolution. Although currently a small force, the CPT (Communist Party Thailand) has access and connections to many leftist and nationalist guerilla groups in the region. In addition, there is evidence to suggest that the Royal Thai Armed Forces contain Maoist sympathies. If given firm direction, these groups can coordinate in one combined fist capable of shattering the reactionary Monarchy. If given enough attention, funding, and supplies, we believe that by 1980, an allied socialist state can be established in Thailand."
 MLA.44.d:0 "The situation in Cambodia is... Interesting. The Maoist Khmer Rouge under Pol Pot currently wage a bloody guerilla war against the Cambodian monarchy. While on paper, we support Pol Pots struggle against Cambodian repression, operatives and specialists in the MQJ seriously question Pol Pots ability and intelligence to lead his nation in peace time. We believe, however, that given intellect and precarious situation, Pol Pot could prove to be a valuable puppet to us."
 MLA.45.d:0 "Intel suggests the situation in South Vietnam is misleading. American troops pour into the reactionary Diem regime, yet it is clear the will of both their peoples are breaking. Propaganda, repressions, and forced conscription have only emboldened the south Vietnamese proletariat in taking up arms against imperialism. However, to think victory is assured in Vietnam is foolish. Battle lines shift every day and one offensive can destroy all progress in the region. For this reason, we believe it is our duty to get involved in the conflict."
 MLA.46.d:0 "Although initial relief programs have been successful, our industrial base and manpower alone will be unable to tip the balance of the Burmese civil war alone. For this reason, we must request additional Chinese involvement."
 MLA.47.d:0 "Comrade Peng has come to us with an enticing proposal. For the last several months, our Malaysian comrades have become increasingly invested in the conflict in Burma. Although our southern comrades have great amounts of luck, they require more materials and commitment from our great nation. While Many are concerned about getting bogged down in Burma, Peng has expressed the strategic importance of an allied state in the region. What should we do?"
 MLA.48.d:0 "Excellent news from the People's Republic of China. As we speak, the Chinese economy is preparing for prolonged involvement in the Burmese Civil war. They have outlined their goal to send fifty transport planes carrying weapons, advisors, and workers each day for the next ten months. This increased Chinese aid will almost certainly secure victory in the civil war."
 MLA.49.d:0 "Disappointing news from the People's Republic of China. While Comrade Mao and the CCP empathize with Burmese struggle, they have refused any involvement for the foreseeable future on the grounds of wanting to avoid a Vietnam scenario.  While this news is a setback to progress in the civil war, our comrades in Burma still have hope in securing victory."
 MLA.50.d:0 ""
 MLA.51.d:0 ""
 MLA.52.d:0 ""
 MLA.22.d:0 "Tragic news comes from the People's Democratic Republic of Malaysia. While foreign eyes have been banned from the nation, defectors speak of unfinished broken factories, destroyed rail lines, starvation, and repression unseen since the days of Japanese occupation. Not much is known about the tiny communist nation yet many believe Chairman Pengs ambitious modernization campaign has failed. There are many predicted reasons for complete economic collapse however the biggest one appears to be a rushed industrial base and poor steel manufacturing leading to a breakdown in the nations' agriculture infrastructure. Many nations in the UN have offered grain shipments however no response has come from Malaysia."
 MLA.58.d:0 "Today, the Communists achieved a major victory in Asia. The long-time ally of the west Thailand has officially fallen to communist guerrillas. In the days after the Royalist defeat, the People's Republic of Thailand was founded under a strict Maoist one party state. This development came as a shock on both sides of the iron curtain and many have already stated the failure of US containment as Communism sweeps across Asia. In a rare interview with Chairman Chulanon, the revolutionary states he hopes to “prove The Domino Theory correct” as the Thai People's Liberation Army Begins mobilizing on reactionary borders."
 MLA.59.d:0 "Shocking news envelopes Red Malaysia today as long-time leader Chin Peng has been deposed. While the direct whereabouts of Peng are unknown, most analysts believe the new group in charge, coined the reformist faction, is here to stay. The new administration has already stated its intention to liberalize the communists state and improve relations with the west. As of now, the future of Malaysia is unknown as the country moves forward into a new decade."
 MLA.61.d:0 "Today, leaders from the United Kingdom and the Democratic People's Republic of Malaysia met in Johannesburg, South Africa. While the two nations have had icy relations in the past, the leaders of both nations believe it is time to halt hostilities and begin sewing the seeds of peace. The outcomes of this summit include an end to harsh sanctions, the return of POWs, and a guarantee of non-aggression by both parties. While the reaction of the international community has been mostly positive, Albania, the DPRK, and most notably the PRC have harshly criticized the summit and everything it stands for. Despite these condemnations, many agree this is a major step forward in the struggle for global peace."
 MLA.62.d:0 ""
 MLA.63.d:0 ""
 MLA.64.d:0 ""
 MLA.65.d:0 ""
 MLA.66.d:0 ""
 MLA.67.d:0 "Chin Pengs modernization campaign has failed. Low-quality construction materials drained our once rich nation of its prosperity. Now we can only pick up the peaces. Order must be re-established, farms must be reconstructed, and industry must be scrapped if our great socialist nation will survive. All is not lost and our nation will recover."
 MLA.68.d:0 "A toast to the Malaysian proletariat. With our nation modernized, our people enjoy luxuries never before imagined. Indoor pluming, consistent access to clean water and electricity, fully paved roads, and accessible medical treatment are but a few of the many gifts the CPM has awarded to our loyal working class. Yet, a problem remains. Our impressive growth has caused prices on virtually every good to plummet. While this may appear to be a major victory for our great nation, we failed to adjust the money supply in accordance with these new price changes. Because of this failure, mass shortages grip the nation. We must quickly fix this mistake before we risk loosing everything."
 MLA.69.d:0 "The Ministry of Internal security has come to us with troubling news. For the past six months, rumors have spread that moderates inside the CPM have been plotting to overthrow Chairman Peng. According to them, Chin Peng has demonstrated to be an ineffective leader who must be removed to keep the spirit of Malaysia alive. What should be done?"
 MLA.70.d:0 "With our economy stabilized, we can now begin the liberation of East Malaysia. While the National Liberation Armed Forces high command have advised against us of direct action, MQJ has informed us that the material conditions in our occupied territories are ripe for revolution. Malaysians across the South China Sea grow jealous of our prosperity, which paired with the already rebellious ethnic minorities, could ignite East Malaysia into revolution. MQJ has encouraged utilizing terror tactics against reactionary occupiers while arming anti-government groups in preparation for any action taken. With good leadership, patience, and luck, we may finally be able to fully liberate our full nation."
 MLA.71.d:0 "Eternal glory to the rebels of East Malaysia. With one strike, the imperialist occupiers that have leached off the Malaysian proletariat have been swept into the sea. The unification of our nation shall let us spread our influence into the south pacific and provide peace and liberty to our people. As we speak, construction teams, military advisors, and educators make the journey across the South China Sea to modernize the countryside and develop the socialist spirit of our eastern lands."
 MLA.72.d:0 ""
 MLA.77.d:0 "Advisors in Cambodia have informed us that the Khmer Rouge are in dire need of aid. Although the Laotians support the international struggle, the US and South Vietnamese presence has put the revolution in jeopardy. For this reason, we have requested the full intervention of the newly created Thai People's Republic."
 MLA.78.d:0 "Unfortunately, Thailand has refused our request to intervene in the Cambodian Civil War. While they sympathize with the Khmer struggle, the political instability has left the young nation in a vulnerable state. Any drastic military involvement would likely shatter the already weak central government."
 MLA.79.d:0 ""
 MLA.80.d:0 "The Ministry of Internal security has come to us with troubling news. For the past six months, rumors have spread that moderates inside the CPM have been plotting to overthrow Chairman Peng. According to them, Chin Peng has demonstrated to be an ineffective leader who must be removed to keep the spirit of Malaysia alive. What should be done?"
 PRC_SOV.10.d:0 "Today, the steppes of Central Asia bore witness to the largest and most complex military exercise yet. Code named Vostok-62, the exercise was attended by East Germany, Poland, Romania, Czechoslovakia, Bulgaria, the Soviet Union, Mongolia, the DPRK, Red China, Vietnam, Laos, and Hungary. While the true intentions of Vostok-62 are unknown, it is widely believed the goal has been to simulate a multinational assault through poorly supplied territory. Although initially troubled with systemic organization issues and many instances of miscommunication, commanders on the ground were quick to re-establish order and drive forward. Standout moments from the exercise included a failed joint Soviet-Korean drop over Yili that resulted in an estimated 22 casualties and the surprising effectiveness of a joint East German-Chinese assault across Lake Zaysan."
 PRC_SOV.11.d:0 "Chairman Wang Ming announced today that the People's Republic of China will embark on a string of liberal reforms aimed at improving the nations economy and the wellbeing of the Chinese worker. Notable policies include amnesty for many political prisoners, market reforms, and greater freedom of expression. It is unknown as to how far these reforms will go, yet it is clear China is entering a new era."
 PRC_SOV.12.d:0 "Since the founding of red China, the USSR has become overstretched and unorganized as it attempts to maintain control across Eurasia. In an attempt to relieve stress, the PRC has announced its withdrawal from the Warsaw Pact. The strong Soviet partner has proposed to fill soviet garrisons across Asia and allow them to focus on Europe. While some believe this is a sign of socialist division, Wang Ming and Khrushchev have assured the world that the Sino-Soviet alliance remains as strong as ever."
 PRC_SOV.13.d:0 "The People's Liberation Army (PLA) recently began a full-scale invasion of Tibet. The CPC claims it is to restore Chinese sovereignty over the country. This act of agression has been widely condemned however no nation has pursued any action. As Chinese Troops enter the Tibetan capital, it is likely Tibet will be fully absorbed into the PRC."
 PRC_SOV.14.d:0 "Since the founding of red China, the USSR has become overstretched and unorganized as it attempts to maintain control across Eurasia. In an attempt to relieve stress, the PRC has announced its withdrawal from the Warsaw Pact. The strong Soviet partner has proposed to fill soviet garrisons across Asia and allow them to focus on Europe. While some believe this is a sign of socialist division, Wang Ming and Khrushchev have assured the world that the Sino-Soviet alliance remains as strong as ever."
 PRC_SOV.15.d:0 "With the success of the Chinese liberalization experiment, the CPC announced the beginning of massive new reforms aimed at delivering more economic prosperity and freedom to the Chinese Worker. Outlined in this new wave of reforms includes the establishment of a 10-year term limit on Chairmanship, further economic liberalization, and a policy of détente with SEATO and the western world. These reforms are likely to ripple across the Beijing Pact as Asia begins to open."
 PRC_SOV.16.d:0 "Today, Kai Feng was inaugurated as Chairman of the Communist Party of China. Inspired by the cultural and economic reforms of Wang Ming, Feng has bold plans such as overhauling the education system, further opening the market, and allowing greater worker participation in government. Many are hopeful for this new era of freedom for china, yet others worry these reforms have gone too far."
 PRC_SOV.17.d:0 "For the second time in a decade, Chinese forces cross the Yalu into the DPRK. This time, however, it is to dispose the Kim Regime. According to the CPC, Kim Il Sung has become a rogue despot. Already, large numbers of Korean soldiers have abandoned their posts and joined in the invasion as Chinese Tanks roll into Pyongyang unopposed. While the exact whereabouts of the Kim family are unknown, a pro-Chinese Administration has already been established. It is likely that in a matter of days, order will be re-established on the Korean peninsula."
 PRC_SOV.18.d:0 "Today, members of the Chinese Communist Party (CPC) have announced the founding of the People's Government of Northern China. After a crushing defeat at the battle of shanghai, the Communists were pushed back to Manchuria, where only a last-minute soviet intervention saved them from total destruction. The People's Government of Northern China has declared its firm allegiance to Marxist-Leninist orthodoxy and a Shield to the vulnerable underbelly of the far east. Much like Germany, Korea Vietnam, and Austria, it appears China will be divided down ideological lines."
 PRC_SOV.20.d:0 "In a turn of events, disgraced revolutionary Mao Zedong has returned to power in the People's Government of Northern China. Once adored by the Chinese people, Mao fell from grace for his failure to secure China. After retreating to Manchuria, Mao was deposed and replaced with a Soviet puppet. Now, however, while the Soviet administration was on a tour of a steel mill on the Yalu river, Maoist elements of the PLA locked down Beijing and re-installed Mao as Chairman. Reports have confirmed the deposed leader Wang Ming has been detained and awaiting trial for crimes against the Chinese people. The Soviets have refused to deliver a statement, although rumor has it, Tanks are amassing along the Amur river."
 PRC_SOV.22.d:0 "Comrades, our nation has been liberated under the red flag of socialism. Yet, our work only now begins. As we speak, the factories left behind by capitalist pigs lay idol and a famine grips the countryside. We must rebuild the nation brick by brick till our working class no longer fears starvation and alienation from labor."
 PRC_SOV.23:0 "Much like the Soviet Union, Much of China remains untouched by man. Our western lands lay barren and wasted. However, Comrade Khrushchev has inspired us to shape our country into a lush agricultural powerhouse comparable to the steppes of Ukraine and the great plains of North America."
 PRC_SOV.24:0 "With the signing of the Beijing Pact, we have become stronger than steel. SEATO will fear the combined might of China and her allies as we sweep through Asia. While our European comrades halt Capitalism on their continent, so too shall we halt capitalism in Asia."
 PRC_SOV.25:0 "Recent liberal reforms in China have resulted in a total failure. Our once strong working class now grows fat and docile. We must whip them back into shape and return to our Marxist-Leninist roots."
 PRC_SOV.26:0 "Recent liberal reforms have resulted in total success. Our nation, once the sickman of Asia, stands as the continental superpower. We stand as equals to the Soviet Union in GDP and productivity. However, now is not the time to halt. We must open up yet more and allow the wealth of China to grow further."
