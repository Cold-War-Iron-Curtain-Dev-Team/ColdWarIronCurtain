 berlincrisis.0.t:0 "[GetNewspaperHeader]The Soviet Union issus an Ultimatum over Berlin"
 berlincrisis.0.d:0 "Soviet Premier [SOV.GetLeader] has issued an ultimatum demanding the withdrawal of Western forces from West Berlin within six months. He insists the city should become a \"Free City,\" warning that if the demand is ignored, the USSR will sign a separate peace treaty with East Germany, jeopardizing Western access to Berlin.\nThe ultimatum comes amid growing tensions between the Soviet Union and NATO, with Moscow accusing the West of using Berlin as a base for espionage and anti-Soviet propaganda. The Soviet leader warned that if the demand was not met, the USSR would sign a separate peace treaty with East Germany, effectively ending the Western powers’ legal rights in the city and leaving access routes to West Berlin at the mercy of the East German government.\nAs the deadline set by Moscow looms, diplomatic efforts are intensifying. Behind closed doors, NATO officials in Paris are debating possible responses. Some advocate a firm stance, refusing to negotiate under pressure, while others suggest exploring diplomatic options to prevent escalation.\nThe world now watches anxiously, as Berlin once again becomes the focal point of the Cold War. Will the West stand its ground, or will the ultimatum force a historic shift in the balance of power?"
 berlincrisis.0.a:0 "Will the Cold War get hot?"
 berlincrisis.1.t:0 "ベルリン危機"
 berlincrisis.1.d:0 "[GetDateText]に行われたウィーン会談では緊張は高まる一方だった。アメリカ大統領[USA.GetLeader]と対面したフルシチョフ書記長は、東ドイツとの単独講和を結び、西ベルリンへのアクセス権を与えるアメリカ、イギリス、フランス、ソ連の四大国間合意とソ連軍による東ベルリン占領を終了させるという最後通牒を再通知した。ソ連を除く三大国はいかなる片側講和条約も西ベルリンにおける責務に影響を与えはしないと返答している。ベルリンの地位を巡る議論が過熱していく中で、[USA.GetLeader]は1961年6月にフルシチョフとのウィーン会談において交渉の場を降りてしまった。[USA.GetLeader]は実質的にベルリンの分割占領を黙認したことになる。この態度は後のソ連に関するより断言的な公式声明の信頼性を落とした。ベルリン問題に対し我々はどう反応すべきだろうか？"
 berlincrisis.1.a:0 "西ベルリンの軍縮と割譲に関するNATOサミットを開催する"
 berlincrisis.1.b:0 "1インチたりとも渡せない"
 berlincrisis.101.t:0 "Paris Summit on the Berlin Crisis"
 berlincrisis.101.d:0 "In response to [SOV.GetLeader]'s ultimatum in 1958, the Western Allies convened in Paris to discuss the future of West Berlin. Faced with Soviet pressure, they debated the demands of the USSR of turning West Berlin into a \"Free City\" to ease tensions. While some officials see this as a potential compromise, others feared it would weaken Western influence and leave the city vulnerable to communist control. Ultimately, whether the Allies reaffirm their commitment to West Berlin's status and refuse to withdraw or not, will be shown in the upcoming weeks."
 berlincrisis.101.a:0 "Get the West German Government on the Line. We need to consult with them."
 berlincrisis.101.b:0 "Let us meet with the West Germans about this matter."
 berlincrisis.101.c:0 "West Germany needs to be involved in this."
 berlincrisis.102.t:0 "NATO Summit on the Berlin-Crisis"
 berlincrisis.102.d:0 "Yet another cabinet meeting was called today, this time in response to an issue raised by the German embassies in London, Paris, and Washington, concerning a Soviet note sent to the governments of the three latter countries.\n\nAdenauer was already seated, as was the rest of the cabinet, as the Minister of Foreign Affairs, Heinrich von Brentano, hurried in, hands full with briefing materials and printouts.\n\nAdenauer started. “Brentano, what’s the latest?”\n\nBrentano responded. “Chancellor, the Soviets have indicated…well, rather, demanded… that the Allies pull their troops out of West Berlin, and that the city be a Free City.”\n\nThis prompted a lot of vigorous discussion from the room, which Adenauer spoke over. “Well, I gather that this cabinet does not agree on most of those points, and therefore-”\n\nHe was cut off by a junior minister, the Minister of All-German Affairs. “Sir, maybe this wouldn’t be such a bad idea- Berlin could be free, and the Soviets might back off.” Brentano broke in again. “That’s a terrible idea. We should take a harder line against the Soviets- after all, what did we join NATO for?” Adenauer paused, thinking."
 berlincrisis.102.a:0 "This Proposal seems the best for Peace in Europe. We push for the Idea of a Three-State Solution."
 berlincrisis.102.b:0 "Nonsense. They will never keep their promise."
 berlincrisis.103.t:0 "West Germany denounces the Soviet Ultimatum"
 berlincrisis.103.d:0 "West Germany firmly rejected [SOV.GetLeader]’s ultimatum, viewing it as a direct threat to its sovereignty and the security of West Berlin. Chancellor [WGR.GetLeader] and his government refused any proposal that would weaken ties with the Western Allies or compromise West Berlin’s freedom. They insisted that the city's status remain unchanged and warned that conceding to Soviet demands would set a dangerous precedent. Instead, West Germany strengthened its alignment with NATO and called for a united Western response, reinforcing its commitment to standing against Soviet pressure."
 berlincrisis.103.a:0 "A wise decision."
 berlincrisis.104.t:0 "West Germany supports the Idea of a Free City of Berlin"
 berlincrisis.104.d:0 "West Germany considered accepting [SOV.GetLeader]’s ultimatum, seeing it as a possible way to ease tensions and avoid a deeper crisis. Some officials believed that turning West Berlin into a \"Free City\" could prevent further Soviet aggression and stabilize the situation. However, they remained cautious and waited for the Western Allies to take a definitive stance. Knowing that their security depended on NATO support, they refrained from making any unilateral decisions, instead seeking approval from the United States, Britain, and France before committing to any course of action."
 berlincrisis.104.a:0 "If it is their will, let it be."
 berlincrisis.104.b:0 "After second thought...this seems to risky. West Berlin remains in the Federal Republic."
 berlincrisis.105.t:0 "The Allies reject our Offer"
 berlincrisis.105.d:0 "After extensive discussions, the Western Allies have decided not to support West Germany’s willingness to accept Khrushchev’s ultimatum. They believe that turning West Berlin into a \"Free City\" would ultimately weaken their position in Europe and expose the city to Soviet influence. Instead, they reaffirm their commitment to defending West Berlin’s current status and urge West Germany to stand firm against Soviet pressure. While they acknowledge the risks of escalation, they are prepared to confront any challenge to ensure that West Berlin remains free and under Western protection."
 berlincrisis.105.a:0 "Moscow will not be happy about this."
 berlincrisis.106.t:0 "The Western Allies give their Consent"
 berlincrisis.106.d:0 "The Western Allies have reviewed West Germany’s position and acknowledge its desire to accept Khrushchev’s ultimatum. After careful deliberation, they have decided to support this course of action, believing it could reduce tensions and prevent further Soviet escalation. While concerns remain about the long-term implications, they trust that establishing West Berlin as a \"Free City\" under international guarantees will maintain stability. They now stand ready to negotiate the terms of this transition, ensuring that West Germany’s interests and security remain protected throughout the process."
 berlincrisis.106.a:0 "Let's get the Soviets on the Line."
 berlincrisis.107.t:0 "The Establishment of the Free City of Berlin"
 berlincrisis.107.d:0 "Reports from the West confirm that the Allied powers have agreed to transform West Berlin into a \"Free City.\" Allied Forces are leaving the City as we speak, while our leadership views this as a significant diplomatic victory, proving that Western resolve has weakened under pressure. While details of the transition remain uncertain, we do now prepare to push for strict guarantees ensuring that the new status aligns with Soviet interests. At the same time, we need to remain cautious, aware that the West may still attempt to maintain influence over the city. Nevertheless, the decision marks a major step toward consolidating Soviet control over Eastern Europe."
 berlincrisis.107.a:0 "Good."
 berlincrisis.2.t:0 "[GetNewspaperHeader]NATOが西ベルリンから撤退"
 berlincrisis.2.d:0 "ウィーン会談の後、ソビエト連邦はNATOへベルリン問題に関する最後通牒を通知した。ソ連は西ベルリンを東ベルリンに戻すことで統合し、ドイツ民主共和国の下で統一することを望んでいる。NATOサミットが数週間前に開かれ、NATOの西ベルリンからの撤退が決定された。NATOは公式声明で、一つの分割された街のためだけに世界が第三次世界大戦に引き込まれるということはあってはならないと発表した。西ドイツに駐留するアメリカ、フランス、イギリスの軍は撤兵し、数千の市民が脱出を試みている。多くの専門家はこの決断はソ連の勢力圏を急速に拡大することになると分析しているが、少なくともベルリン危機は終結した。"
 berlincrisis.2.a:0 "決定が第三次世界大戦を防ぐことを祈ろう"
 berlincrisis.2.b:0 "共産主義の勝利だ"
 berlincrisis.2.c:0 "第三次世界大戦は回避された"
 berlincrisis.3.t:0 "[GetNewspaperHeader]NATOがソ連の提案を拒絶"
 berlincrisis.3.d:0 "ベルリンを巡る対立の中で、ケネディは6月25日の夜、世界全国へ向けた演説において、アメリカは戦争を望まず、また「東ヨーロッパと中央ヨーロッパにおけるソ連の歴史的懸念」については認識していると発表した。ケネディは対話を継続する意思はあるが、3.25億ドルの追加の軍事支出予算を議会に申請したとも述べた。陸軍6個師団と海兵隊2個師団の新設、また徴兵期間の三倍の延長と予備役の召集を含む計画を明かした。ケネディはこう宣言した。「我々は平和を望むが、従属することはない」同日、ケネディは陸軍の人員数を87万5000人から100万程度までに増加させ、当局に予備役部隊を現役へ戻すよう要請した。黒海沿岸のソチで休暇を取っていたフルシチョフはケネディの演説を聴き怒りに震えていた。ケネディの軍縮に関わる顧問であるジョン・J・マクロイはソ連国内にいたためフルシチョフに招待される。報告によれば、フルシチョフはマクロイにケネディの建軍姿勢は戦争に発展する可能性があると説明したという。"
 berlincrisis.3.a:0 "共産主義の広がりを封じ込めねば"
 berlincrisis.3.b:0 "他の方法を探そう"
 berlincrisis.3.c:0 "緊張が高まっている"
 berlincrisis.4.t:0 "NATOがベルリン問題の存在を否認"
 berlincrisis.4.d:0 "NATOは最後通牒の存在を否定した。これが1946年に定められた4大国合意に反すると言及し、アメリカ、イギリス、フランスはいかなる土地も共産主義者に渡すことはあり得ないと宣言した。東ドイツ政権は次の動向について尋ねてきている。我々はどうすべきだろうか？戦車や歩兵を国境線に配備することで西側へ圧力をかけることみできるが、彼らの決断をただ受け入れることもできる。"
 berlincrisis.4.a:0 "軍事的選択が影響していくだろう。"
 berlincrisis.4.b:0 "駐留決定を受け入れよう"
 berlincrisis.5.t:0 "ベルリン危機の加熱"
 berlincrisis.5.d:0 "ソビエト連邦はNATOが最後通牒を拒絶したことに失望し、祖国ロシアはベルリンを得るために数百万の命を犠牲にしたと改めて発言した。ソ連は西側がベルリンを去らねば第三次世界大戦に発展しさらに数百万の命が奪われることになると脅迫する。ベルリンではソ連の戦車と歩兵が我々の戦車部隊と睨み合っていて緊張感は非常に高まっている。我々はどうしたらよいか？"
 berlincrisis.5.a:0 "これは攻撃行為だ！"
 berlincrisis.5.b:0 "対話のためソ連に外交官を送れ"
 berlincrisis.5.c:0 "兵士と戦車を撤兵させろ"
 berlincrisis.5.e:0 "Let's leave this to the United States."
 berlincrisis.6.t:0 "[GetNewspaperHeader]第三次世界大戦の火蓋が切られた"
 berlincrisis.6.d:0 "NATOとコミンフォルムの間での数週間の対話と緊張激化の結果、外交官達は合意にたどり着くのに失敗し、お互いの侮辱合戦に発展してしまった。報告によれば、ベルリンは再び包囲され、砲声や銃声音が数マイル先から聞こえ、戦闘機や爆撃機はスクランブル発進し艦隊はドックを離れたという。世界中の国々は再び総動員令をかけた。第三次世界大戦は始まった。しかしこれが通常兵器による戦争なのか、核戦争に発展するのかは未だ予想できない。"
 berlincrisis.6.a:0 "神よ我らを救い給え"
 berlincrisis.7.t:0 "[GetNewspaperHeader]ベルリン危機の対話"
 berlincrisis.7.d:0 "ソビエト連邦が軍事行動によって脅迫を行ったのに対し、アメリカは対話のためソ連へ外交官を送った。両者とも緊張緩和を試みていたが、ソ連側がベルリンからNATOを追い出すと宣言し、国際安全保障を重視するNATOとの相違が明らかになっていくにつれ困難さが浮き彫りになっていた。ベルリン危機が解消され世界が第三次世界大戦を避けられることを祈ろう。"
 berlincrisis.7.a:0 "我々は危機を終わらせベルリンを維持する"
 berlincrisis.7.b:0 "我々は危機を終わらせベルリンを解放する"
 berlincrisis.7.c:0 "危機が早く去ることを祈ろう"
 berlincrisis.8.t:0 "ベルリン問題対談"
 berlincrisis.8.d:0 "国際緊張は高い。アメリカ政府はベルリン問題について対話を行うため外交官を送った。世界がこの対談に注目している。我々とアメリカはどうすべきかについて交渉する予定だ。我々は交渉において何に集中すべきだろうか。"
 berlincrisis.8.a:0 "ベルリンの統一"
 berlincrisis.8.b:0 "ベルリンの自由市化"
 berlincrisis.8.c:0 "ベルリンは分断されたままに"
 berlincrisis.9.t:0 "ベルリン交渉"
 berlincrisis.9.d:0 "ソ連はドイツ民主共和国下での東西ベルリンの統一と全ての駐留部隊の撤退を望んでいる。ベルリンは非武装地帯となるだろう。東西を問わず全ての軍隊は市に侵入できない。我々はこの取引を受け入れるべきだろうか？"
 berlincrisis.9.a:0 "取引を受け入れる"
 berlincrisis.9.b:0 "ベルリンは分断されたままに"
 berlincrisis.9.c:0 "It is now up to the Americans..."
 berlincrisis.10.t:0 "[GetNewspaperHeader]東西ベルリン統一！"
 berlincrisis.10.d:0 "熱い議論を数週間交わした末に、NATOは西ベルリンから撤退し東ドイツに東ベルリンを割譲すると決定した。ソビエト連邦はこれは世界平和に向けた偉大な勝利だと宣伝している。NATOは声明で、第二次世界大戦は数年前に終わったのであり、西ベルリンは住民に占領がまだ終わっていないという誤ったメッセージの象徴となってはならないと述べた。NATOにはこれが共産主義圏影響力を強めることになるとの批判が寄せられている。"
 berlincrisis.10.a:0 "西ベルリンを占領し続ける必要はない"
 berlincrisis.10.b:0 "ワルシャワ条約機構の偉大な勝利だ"
 berlincrisis.10.c:0 "関係改善に繋がるのか？"
 berlincrisis.11.t:0 "ソ連がベルリンの自由市化を提案"
 berlincrisis.11.d:0 "ソビエト連邦は、NATOがドイツ民主共和国のもとでのベルリン統一を受け入れがたいというのを受けて、統一ベルリンを自由市にすることを代わりに提案している。ベルリン自由市は東西ベルリン両方を含み、中立的な都市となることになる。ただし、問題はソ連が中立的なベルリンに対しどれだけの影響力を持つかということである。我々はどう対応すべきだろうか？"
 berlincrisis.11.a:0 "ベルリン自由市を受け入れる"
 berlincrisis.11.b:0 "我々の土地を明け渡すわけにはいかない"
 berlincrisis.11.c:0 "What will the US decide?"
 berlincrisis.12.t:0 "[GetNewspaperHeader]ベルリン自由市の成立！"
 berlincrisis.12.d:0 "アメリカとソ連はベルリンに独立した都市国家を設置するということで合意した。ベルリン自由市は中立を保ち、いかなる同盟にも参加しないことになっている。自由都市は長くは続かないだろう。ベルリンはNATOにとってもワルシャワ条約機構にとっても戦略的価値の高い都市だ。アメリカ、ソ連、イギリス、フランスは全て自軍の撤退を始めている。ドイツ民主共和国もドイツ連邦共和国も都市国家を強い口調で非難していて、必ずや統一ドイツの一部となるだろうと発表している。"
 berlincrisis.12.a:0 "これで危機が回避されるとよいのだが"
 berlincrisis.12.b:0 "自由市はいずれ我々の下に戻るだろう"
 berlincrisis.12.c:0 "それで、何が起ころうとしているのだ？"
 berlincrisis.13.t:0 "[GetNewspaperHeader]ソ連とアメリカがベルリン国境から撤兵"
 berlincrisis.13.d:0 "\nKGBスパイのゲオルギー・ボルシャコフをコミュニケーションのチャンネルとして使いながら、フルシチョフとケネディは戦車の撤退により緊張緩和を試みることに同意した。ソ連側の検問所はスターフカのアナトリー・グリブコフと直接の電話回線を有しており、グリブコフを介してフルシチョフとの直接コミュニケーションを取ることとなっていた。アメリカ側の検問所では憲兵らはベルリンにおけるアメリカの派遣軍の司令部へ電話をかけることができ、そこからはホワイトハウスに繋がっていた。ケネディはソ連側が先に戦車を撤兵させればベルリンの将来に関しては寛容になるだろうと提案した所ソ連は合意したようだ。ケネディはベルリンの壁に関しても、「最良の解決策とは言えないが、それでも戦争よりはずっとずっとましだ」と発言した。ソ連軍戦車が先に5メートル後退し、それを見たアメリカ軍戦車も同じように後退する。そうして一台また一台と撤退していった。"
 berlincrisis.13.a:0 "西ドイツはとりあえず守られた"
 berlincrisis.13.b:0 "西ドイツはまた別の機会に"
 berlincrisis.13.c:0 "これで安心か？"
 berlincrisis.14.t:0 "[GetNewspaperHeader]ベルリン危機は去った"
 berlincrisis.14.d:0 "ベルリン危機は解決の目を見た。数週間の交渉、熱い議論、NATO及びコミンフォルム部隊のエスカレーション、そして何よりベルリンの壁建設の末、両者とも相互合意に達し、アメリカは東ベルリンに関して寛容になり戦争よりも壁の建設を選び、その代わりソ連軍が戦車を先に撤退させることになった。こうして二大国間の緊張は緩和された。"
 berlincrisis.14.a:0 "西ベルリンは守られた"
 berlincrisis.14.b:0 "また別の機会に"
 berlincrisis.14.c:0 "西ベルリンはいずれ我々のものになる"
 berlincrisis.14.e:0 "我々は我々の街を守ったのだ"
 berlincrisis.14.f:0 "ベルリンのために第三次世界大戦が起こるところだった"
 Giving_Berlin_away_later_Alert_tt:0 "§CNote that if you decide to support West Germanys decision to establish a Free City in West Berlin, you will be obliged to cede West Berlin to the Soviet Union, should they propose an Offer towards a unified independent Berlin.§!"
 Not_Giving_Berlin_away_later_Alert_tt:0 "§CNote that if you decide to remain the status-quo in West Berlin, you will be obliged to stand by your choice in future negotiations with the Soviet Union about a Free City of Berlin, even if the Soviets consider further Escalation.§!"
