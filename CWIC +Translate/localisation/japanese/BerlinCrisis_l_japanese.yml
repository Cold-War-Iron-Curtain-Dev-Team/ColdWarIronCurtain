 SOV_khruschev_reforms_desc:0 "1953年のスターリンの死は権力闘争を引き起こし、フルシチョフがその勝者となった。1956年2月25日の第20回大会において、フルシチョフは「秘密演説」を行い、そこでスターリンの大粛清を非難し非抑圧的な時代の訪れを宣言した。一般市民の生活向上を目指したフルシチョフの内政方針はしばしば非効率的であり、特に農業分野では無力だった。最終的に国防をミサイルに頼ることを目指したフルシチョフは通常戦力の大幅な削減を命じた。"
 SOV_the_secret_speech_desc:0 "1956年、フルシチョフは同志スターリンが1930年台に行った大粛清を非難し、またソ連労働者のための共産主義を養成することを怠り個人崇拝を強制したことを批判した。この演説はソ連と中国の関係を冷え込ませ、ソ連の国際的影響力を減退させた。"
 SOV_sino_soviet_split_desc:0 "1956年のフルシチョフによる秘密演説が公開されると、毛はフルシチョフを世界中の共産主義制度を構築したスターリニズムに対する修正主義者であると非難した。ソ連にとって地球上で最も重要な同盟国にして経済パートナーだったとも言える中国との国交悪化はソ連を弱体化させた。"
 SOV_peaceful_coexistence_desc:0 "第20回大会において、フルシチョフは現実的になりつつある核戦争の脅威を挙げアメリカとの平和的共存の構想を守りきり固定化した。この宣言は共産主義を暴力闘争によって広めるというソ連の方針の終了を意味し、そのため世界中の共産主義者達はこの宣言を共産主義革命の原則への裏切りであると見ている。"